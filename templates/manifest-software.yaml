# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: {name}

# 显示名
display: "{显示名}"

# 一句话描述
description: "{一句话描述}"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: build-tool

# 官网 URL
homepage: "https://..."

# 开源许可证（SPDX 标识）
license: {SPDX}

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points: []
  # 例如:
  # - "需要设置 CMAKE_SYSTEM_NAME=OHOS"
  # - "Bootstrap 阶段需 --no-qt-gui"

  # 跨版本通用依赖
  common_dependencies: []
  # 例如:
  # - openssl
  # - curl

# ============================================================
# 版本索引
# ============================================================

versions:
  # "{version}":
  #   status: published|built|failed|archived
  #   build_date: YYYY-MM-DD
  #   published_as: {cmd-pkgs中的软件名}  # 仅 published 时需要
