# 软件编译档案元数据模板
# 文件位置: archives/{首字母}/{软件名}/{版本}/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写）
software: example

# 版本号
version: 1.0.0

# 编译状态
# - success: 编译成功，测试通过
# - partial: 编译成功，部分功能异常
# - failed: 编译失败
status: success

# 构建系统类型
# - autotools: configure + make
# - cmake: CMakeLists.txt
# - custom-perl: 自定义 Perl Configure（如 OpenSSL）
# - meson: meson.build
# - makefile: 直接 Makefile
# - qmake: .pro 文件
build_system: autotools

# 编译日期（YYYY-MM-DD）
compile_date: 2024-01-01

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  # 必需依赖（缺少会导致编译失败）
  required: []
  
  # 可选依赖（缺少会禁用某些功能）
  optional: []
  
  # 推荐已安装的库
  recommended: []

# ============================================================
# 编译配置
# ============================================================

build_config:
  # 目标三元组（autotools）
  target: aarch64-unknown-linux-ohos
  
  # configure 参数
  configure_options:
    - --prefix=$HOME/usr/local
  
  # 编译器标志
  cflags: "-fPIC -O2"
  
  # 链接器标志
  ldflags: ""
  
  # 特殊环境变量
  env:
    CC: clang
    AR: llvm-ar

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: 修改 config.guess 和 config.sub 支持 HarmonyOS
    lines_changed: 50
    files_modified:
      - config.guess
      - config.sub

# ============================================================
# 兼容性评估
# ============================================================

compatibility:
  # 兼容性等级
  # - high: 核心功能完全可用，无已知问题
  # - medium: 主要功能可用，有少量限制
  # - low: 仅部分功能可用，需特殊处理
  level: high
  
  # 已知问题列表
  issues: []
  
  # 特殊说明
  notes: ""
  
  # 系统调用兼容性
  syscalls:
    available: []
    missing: []
    workaround: []

# ============================================================
# 测试结果
# ============================================================

test_results:
  # 测试类型
  # - official: 官方测试套件
  # - manual: 手动功能测试
  # - skipped: 跳过测试
  type: official
  
  # 测试统计
  total: 0
  passed: 0
  failed: 0
  skipped: 0
  
  # 测试说明
  note: ""
  
  # 关键功能验证
  key_features: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "此构建系统需要 xxx 处理"
  - "遇到 xxx 问题，通过 yyy 解决"

# 知识库双向追溯
# 当 L1/L2 知识写入 knowledge/ 文件后，在此记录引用链接
# 格式: knowledge/{文件名}#{章节或编号}
# 示例: knowledge/error-patterns.md#E053
knowledge_ref: []

# ============================================================
# 参考链接
# ============================================================

references:
  - title: 官方文档
    url: https://example.com/docs
  - title: 下载地址
    url: https://example.com/download

# ============================================================
# 元数据
# ============================================================

# 档案创建者
maintainer: ""

# 最后更新时间
last_updated: ""

# 标签（用于检索）
tags: []

# ============================================================
# 版本更新追踪
# ============================================================

# 版本升级信息
upgrade_info:
  # 是否可以从旧版本升级
  upgradable_from: []
  
  # 升级注意事项
  upgrade_notes: ""
  
  # 是否有破坏性变更
  breaking_changes: false
  
  # 破坏性变更说明
  breaking_changes_details: ""

# 补丁兼容性
patch_compatible:
  # 补丁是否可用于其他版本
  # - exact: 仅适用于此精确版本
  # - minor: 适用于相同小版本（如 1.0.x）
  # - major: 适用于相同大版本（如 1.x）
  # - universal: 适用于所有版本
  compatibility: exact
  
  # 已验证可用的版本列表
  verified_versions: []
  
  # 补丁依赖关系
  dependencies: []
  
  # 补丁冲突说明
  conflicts: []

# 最后测试版本信息
last_tested_version:
  # 上游最新版本
  upstream_latest: ""
  
  # 是否需要更新档案
  needs_update: false
  
  # 测试状态
  # - current: 当前档案是最新的
  # - outdated: 有新版本可用，建议更新
  # - deprecated: 版本已过时，不推荐使用
  status: current
  
  # 测试日期
  tested_date: ""
  
  # 新版本可用性说明
  notes: ""