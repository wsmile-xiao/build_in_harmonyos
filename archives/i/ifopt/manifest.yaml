software: ifopt
display: "ifopt"
description: "Eigen-based light-weight C++ interface to nonlinear programming solvers (core problem formulation layer)"
category: math
homepage: "https://github.com/ethz-adrl/ifopt"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，仅适配求解器无关的 ifopt_core 层（Eigen3 头文件依赖）"
    - "使用上游官方选项关闭求解器后端（BUILD_IPOPT=OFF/BUILD_SNOPT=OFF），无源码补丁"
    - "上游 ctest 全量 2 条目，core 测试完整运行，IPOPT 示例为文档化缺口"
  common_dependencies:
    - "eigen/3.4.1"

versions:
  "2.1.4":
    status: built
    build_date: "2026-09-20"
    format: conan
    note: "core-only 配方；上游 2 项 ctest（core 16 gtest 用例运行，ipopt 示例缺口），消费者测试 13 断言；实测数待真机预检回填"
