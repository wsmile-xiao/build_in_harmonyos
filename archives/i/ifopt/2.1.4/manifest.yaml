software: ifopt
version: "2.1.4"
status: built
build_system: cmake
build_date: "2026-09-20"

source:
  url: "https://github.com/ethz-adrl/ifopt/archive/refs/tags/2.1.4.tar.gz"
  sha256: "da38f91a282f3ed305db163954c37d999b6e95f5d2c913a63bae3fef9ffb3a37"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_IPOPT=OFF"
    - "-DBUILD_SNOPT=OFF"
    - "-DBUILD_TESTING=ON"
  dependencies:
    - "eigen/3.4.1"
    - "gtest/1.17.0.1 (test_requirements, upstream tests only; in-repo recipe with zero tool_requires, avoids conancenter cmake/4.4.x KeyError 'OHOS')"
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-cmake-minimum-3.5.patch"
    reason: "CMake 4.x removed compatibility with cmake_minimum_required < 3.5; upstream declares 3.1.0. Raise to 3.5, no build logic change."
source_edits:
  - file: "ifopt_core/CMakeLists.txt (via conanfile _patch_gtest_targets)"
    reason: "Basic-signature find_package(GTest) stops at the bundled FindGTest module and the guard needs GTest::GTest; Python in-place edit forces CONFIG mode plus compat targets, no test logic change (replaces fragile static 0002 patch)."

test_results:
  type: official
  total: 16
  note: "Upstream holds 16 gtest TEST macros (ifopt_core-test: 6 composite + 10 problem; ifopt_ipopt-example is a plain main with 0 macros). This recipe builds ifopt_core with official BUILD_IPOPT=OFF/BUILD_SNOPT=OFF and runs all 16 gtest cases via ctest. Real pass counts pending true-device preflight."

knowledge_gained:
  - "ifopt 2.1.4 core layer needs only Eigen3 headers; solver backends are officially optional via BUILD_IPOPT/BUILD_SNOPT."
  - "No published ipopt Conan package exists in the registry (notes only), so core-only is the only single-PR-compliant configuration."
