# test_package/MANIFEST.yml — ifopt 2.1.4
# Upstream and consumer test declaration required by CI L0e.

package: ifopt/2.1.4
homepage: "https://github.com/ethz-adrl/ifopt"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "2.1.4.tar.gz (official GitHub tag archive, ethz-adrl/ifopt tag 2.1.4)"
  source_sha256: "da38f91a282f3ed305db163954c37d999b6e95f5d2c913a63bae3fef9ffb3a37"
  build_system: "CMake"
  test_definition: >
    Top-level CMakeLists.txt enables testing and adds ifopt_core plus the
    optional solver backends (option BUILD_IPOPT default ON, option
    BUILD_SNOPT default OFF). ifopt_core/CMakeLists.txt registers 1 ctest
    entry (ifopt_core-test: test/composite_test.cc with 6 TEST plus
    test/problem_test.cc with 10 TEST, 16 gtest cases total, built only
    when the GTest target exists). ifopt_ipopt/CMakeLists.txt registers
    1 ctest entry (ifopt_ipopt-example: test/ex_test_ipopt.cc, a plain
    main() with asserts solving the example NLP with the Ipopt solver,
    0 gtest TEST macros, needs find_package(IPOPT 3.11.9)).
    Counting unit is the gtest TEST macro (N=16); the review gate counts
    gtest cases, so ctest entries (2) must not be used as the total.
  dependency: "Upstream core tests need GTest (provided by Conan test_requires gtest/1.17.0.1, the in-repo recipe with zero tool_requires); the IPOPT example needs coinor Ipopt, which has no published Conan package."
  portability_changes:
    - "patches/0001-cmake-minimum-3.5.patch: cmake_minimum_required 3.1.0 -> 3.5 (CMake 4.x removed <3.5 compat; no build logic change)"
    - "conanfile _patch_gtest_targets: config-mode find_package(GTest) + GTest::GTest/GTest::Main compat targets via Python in-place edit (no test logic change; replaces fragile static 0002 patch)"
  recipe_scope: >
    The recipe sets the official options BUILD_IPOPT=OFF and
    BUILD_SNOPT=OFF (single-PR rule forbids bundling an ipopt adaptation),
    keeps BUILD_TESTING=ON, and runs ctest in build(). This build runs all
    16 gtest cases via ifopt_core-test; the IPOPT example holds 0 gtest
    macros and is outside this counting unit.

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - test_name: "ifopt_core-test"
    source: "ifopt_core/test/composite_test.cc + ifopt_core/test/problem_test.cc"
    kind: unit
    description: "16 gtest cases covering Composite/Component rows, problem dimensions, bounds, values, constraints, Jacobians, cost and gradients"
    command: "ctest -R ifopt_core-test --output-on-failure"
  - test_name: "ifopt_ipopt-example"
    source: "ifopt_ipopt/test/ex_test_ipopt.cc"
    kind: example
    description: "Solves the example NLP with the Ipopt solver (plain main, 0 gtest macros, 2 asserts on the optimum); not counted in gtest_macros units; disabled in this recipe (BUILD_IPOPT=OFF, no published ipopt package)"
    command: "ctest -R ifopt_ipopt-example --output-on-failure"

# Official total in gtest TEST-macro units (6 composite + 10 problem = 16).
# The IPOPT example holds 0 gtest macros. This build executes all 16.
upstream_test_total: 16
upstream_test_count_method: gtest_macros

test_package_tests:
  - file: test_ifopt.cpp
    scenario: "consumer-api"
    description: >
      Build and run a Conan consumer that formulates the upstream example
      problem (min -(x1-2)^2 s.t. x0^2+x1=1) with custom VariableSet,
      ConstraintSet and CostTerm subclasses against the installed
      ifopt_core, asserting dimensions, bounds, values, constraint
      evaluation, Jacobians, cost value/gradient and cost-term presence.
    command: "./test_ifopt"
    assertions: 13

assertion_count: 13
