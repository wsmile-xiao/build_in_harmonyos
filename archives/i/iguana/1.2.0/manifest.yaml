# 版本级 manifest — iguana 1.2.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.2.0"
software: "iguana"
status: built
build_date: "2026-10-01"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/qicosmos/iguana/archive/refs/tags/1.2.0.tar.gz"
  sha256: "29ad1ff853a278df0b1598db992e1507167bd4521b232a55e360928cf751a9af"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_CXX_STANDARD=17"
    - "-DBUILD_UNIT_TESTS=ON（run_upstream_tests=True，默认）"
    - "-DIGUANA_FAST_BENCHMARK_COMPILE=ON"
    - "-DLINKLIBC++=ON（profile compiler.libcxx=libc++）"
    - "OHOS: -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=armv8（E092）"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 产物
# ============================================================

package_type: header-library
artifacts:
  - "include/iguana/**（48 个头文件，含 detail/、ylt/reflection/）"
  - "include/frozen/**（上游随源码内置的 frozen 头文件，field_reflection.hpp 依赖）"
  - "licenses/LICENSE（Apache-2.0）"
libs: []
requires: []

# ============================================================
# 验证结果
# ============================================================

tests:
  upstream_suite: doctest + ctest
  upstream_registered: 11
  upstream_passed: 11
  upstream_failed: 0
  upstream_skipped: 0
  upstream_pass_rate: "11/11 (100%)"
  upstream_runtime: "2.77s"
  consumer_checks: 17
  consumer_failures: 0
  consumer_pass_rate: "17/17 (100%)"
  command: "conan create archives/i/iguana/1.2.0 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "头文件库打包要点: include 根目录必须同时提供 iguana/ 与 frozen/，否则 field_reflection.hpp 的 \"frozen/...\" 包含会失败"
  - "Conan 2 的 CMake.test(cli_args=[...]) 会把参数透传给 native build tool（cmake --build ... --），因此 --output-on-failure 必须改用 self.run('ctest ...', cwd=self.build_folder)"
  - "上游 CMake 默认连 benchmark 一起构建，IGUANA_FAST_BENCHMARK_COMPILE=ON 可显著缩短验证构建时间而不影响测试覆盖"
  - "上游 iguana/version.hpp 的 IGUANA_VERSION 宏停留在 1.0.5，包版本仍按上游 git tag 1.2.0（R37）"

adaptation_paths:
  - A
