# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: iguana/1.2.0
homepage: "https://github.com/qicosmos/iguana"

upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试（BUILD_UNIT_TESTS=ON + ctest）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j$(nproc)"

# 上游测试: 内置 doctest 框架（test/doctest.h，无需下载），ctest 注册 11 个用例。
# test_pb 无需 protobuf；test_proto 仅在 CMake 找到 Protobuf 时才会注册（本包无依赖，未注册）。
upstream_test_count: 11
upstream_ctest_variants:
  - name: test_some
    command: "ctest --output-on-failure -R '^test_some$'"
  - name: test_ut
    command: "ctest --output-on-failure -R '^test_ut$'"
  - name: test_json_files
    command: "ctest --output-on-failure -R '^test_json_files$'"
  - name: test_github_events
    command: "ctest --output-on-failure -R '^test_github_events$'"
  - name: test_xml
    command: "ctest --output-on-failure -R '^test_xml$'"
  - name: test_yaml
    command: "ctest --output-on-failure -R '^test_yaml$'"
  - name: test_nothrow
    command: "ctest --output-on-failure -R '^test_nothrow$'"
  - name: test_util
    command: "ctest --output-on-failure -R '^test_util$'"
  - name: test_xml_nothrow
    command: "ctest --output-on-failure -R '^test_xml_nothrow$'"
  - name: test_pb
    command: "ctest --output-on-failure -R '^test_pb$'"
  - name: test_cpp20
    command: "ctest --output-on-failure -R '^test_cpp20$'"

upstream_tests:
  - file: test/unit_test.cpp
    source: iguana-1.2.0/test/unit_test.cpp
    description: "iguana 核心序列化/反序列化单元测试 (doctest)"
    command: "ctest --output-on-failure -R '^test_ut$'"
  - file: test/test_some.cpp
    source: iguana-1.2.0/test/test_some.cpp
    description: "反射/嵌套结构/容器/变体/异常路径综合用例（含非法数字必须抛异常）"
    command: "ctest --output-on-failure -R '^test_some$'"
  - file: test/test_json_files.cpp
    source: iguana-1.2.0/test/test_json_files.cpp
    description: "仓库 data/ 下真实 JSON 文档解析用例（工作目录 = test/）"
    command: "ctest --output-on-failure -R '^test_json_files$'"
  - file: test/test_github_events.cpp
    source: iguana-1.2.0/test/test_github_events.cpp
    description: "GitHub Events 真实报文（github_events_schema.h）解析用例"
    command: "ctest --output-on-failure -R '^test_github_events$'"
  - file: test/test_xml.cpp
    source: iguana-1.2.0/test/test_xml.cpp
    description: "XML 读写往返用例（嵌套结构、vector、optional、模板类）"
    command: "ctest --output-on-failure -R '^test_xml$'"
  - file: test/test_xml_nothrow.cpp
    source: iguana-1.2.0/test/test_xml_nothrow.cpp
    description: "XML 非抛异常路径（返回值判定）用例"
    command: "ctest --output-on-failure -R '^test_xml_nothrow$'"
  - file: test/test_yaml.cpp
    source: iguana-1.2.0/test/test_yaml.cpp
    description: "YAML 读写往返用例（map/嵌套/list）"
    command: "ctest --output-on-failure -R '^test_yaml$'"
  - file: test/test_yaml_nothrow.cpp
    source: iguana-1.2.0/test/test_yaml_nothrow.cpp
    description: "YAML 非抛异常路径用例"
    command: "ctest --output-on-failure -R '^test_nothrow$'"
  - file: test/test_util.cpp
    source: iguana-1.2.0/test/test_util.cpp
    description: "字符串/容器工具与编译期检查用例"
    command: "ctest --output-on-failure -R '^test_util$'"
  - file: test/test_pb.cpp
    source: iguana-1.2.0/test/test_pb.cpp
    description: "iguana 自带 protobuf 风格读写器用例（不依赖外部 protobuf）"
    command: "ctest --output-on-failure -R '^test_pb$'"
  - file: test/test_cpp20.cpp
    source: iguana-1.2.0/test/test_cpp20.cpp
    description: "C++20 反射相关用例（该 target 单独以 CXX_STANDARD=20 编译）"
    command: "ctest --output-on-failure -R '^test_cpp20$'"

# test_package 中自带的测试 (消费者视角验证)
consumer_test_count: 1
test_package_tests:
  - file: test_iguana.cpp
    description: "第三方消费者视角: 反射宏 + JSON/XML/YAML 双向往返 + prettify + 非法输入抛异常, 共 17 个断言"
    command: "./test_iguana"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17
