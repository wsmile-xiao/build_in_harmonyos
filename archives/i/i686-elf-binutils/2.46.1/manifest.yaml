software: i686-elf-binutils
version: "2.46.1"
status: built
build_date: "2026-07-14"
build_system: autotools

source:
  url: "https://ftpmirror.gnu.org/gnu/binutils/binutils-2.46.1.tar.bz2"
  sha256: "324ed40ada2633a28eaa5d104ca5db165fd3cc3162cc1d48a7b7fa9c932da439"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--target=i686-elf"
    - "--enable-static"
    - "--disable-shared"
    - "--disable-gprofng"
    - "--disable-gdb"
    - "--disable-gdbserver"
    - "--disable-sim"
    - "--disable-nls"
    - "--disable-werror"
  # 构建期测试工具（tool_requires，均属官方基线，不在本候选交付载荷内）：
  # dejagnu/1.6.3 + expect/5.45.4 + tcl/8.6.14（runtest 执行上游 make check）
  dependencies:
    - dejagnu/1.6.3
    - expect/5.45.4
    - tcl/8.6.14
  cc: clang
  cxx: clang++

patches_applied:
  - file: 0001-config.guess.patch
    purpose: config.guess 添加 HarmonyOS / __OHOS__ libc 识别（E007）
  - file: 0002 ~ 0015-*-configure.patch
    purpose: 14 个 configure 脚本 umask 077 改 022，适配 HMDFS（E011）

compatibility:
  level: built
  notes: |
    交叉工具链：工具运行于 HarmonyOS PC (aarch64)，操作 i686-elf 目标对象，
    不在宿主执行 i686 代码。test_package 用 i686-elf-as 汇编最小程序，
    再用 readelf/objdump/ar/nm 验证产物，真实调用工具二进制（R34）。
    round-2：build() 集成上游完整 make check（379 .exp，DejaGNU runtest），
    依赖 tool_requires dejagnu/1.6.3 + expect/5.45.4 + tcl/8.6.14；OHOS 测试坑
    解法迁移自 E272/arm-none-eabi-binutils：site-stty-fix.exp（DEJAGNU 注入
    spawn -nottyinit）+ tmpfile-shim.so（LD_PRELOAD，恢复 POSIX tmpfile()）。

knowledge_gained:
  - "binutils 2.46.1 顶层共享单个 config.guess/config.sub，2.46.1 的 config.sub 已原生支持 ohos"
  - "config.guess 需加 __OHOS__ 与 HarmonyOS uname 分支（E007）"
  - "14 个 configure 脚本的 umask 077 需改 022 适配 HMDFS（E011）"
  - "gprofng 依赖 SIGEV_THREAD_ID，HarmonyOS 不可用，需 --disable-gprofng"
  - "交叉构建 --target=i686-elf 令工具自动加 i686-elf- 前缀"
  - "宿主 clang 的 -fuse-ld=lld 污染 $CC -E stderr，autoconf 旧式预处理 header 探测误判，需 CPPFLAGS 加 -Wno-unused-command-line-argument"
  - "musl 把 mallinfo/mallinfo2 作桩提供但不定义 struct，需 ac_cv_func_mallinfo=no 绕过"
  - "上游 make check 需 dejagnu+expect+tcl，经 tool_requires 声明；OHOS 上 /bin/stty 缺失与 libc tmpfile() EACCES 分别由 site-stty-fix.exp 与 LD_PRELOAD shim 解决（E272 迁移）"
