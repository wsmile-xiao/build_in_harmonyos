# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）。
# 详见: docs/TEST_QUALITY_SPEC.md

package: i686-elf-binutils/2.46.1
homepage: "https://www.gnu.org/software/binutils/"

# 上游测试命令（gas 145 / ld 187 / binutils 37 / libctf 6 / libsframe 4 = 379 .exp）
upstream_check_command: "make -k -j1 check"

# conanfile.py build() 中是否集成上游测试
# round-2 起集成：build() 末尾运行完整 DejaGNU make check（379 .exp），
# 依赖 dejagnu/1.6.3 + expect/5.45.4 + tcl/8.6.14（tool_requires，官方基线已合入）。
upstream_test_in_build: true
upstream_test_command: "DEJAGNU=<build>/site-stty-fix.exp LD_PRELOAD=<build>/tmpfile-shim.so make -k -j1 check"

# 上游测试程序（全部 5 个 runner，官方总量 379 .exp）
upstream_tests:
  - file: gas/testsuite
    source: binutils-2.46.1/gas/testsuite
    description: "gas 汇编器 dejagnu 测试套件（145 .exp）"
    command: "make check-gas"
  - file: ld/testsuite
    source: binutils-2.46.1/ld/testsuite
    description: "ld 链接器 dejagnu 测试套件（187 .exp）"
    command: "make check-ld"
  - file: binutils/testsuite
    source: binutils-2.46.1/binutils/testsuite
    description: "binutils 二进制工具 dejagnu 测试套件（37 .exp）"
    command: "make check-binutils"
  - file: libctf/testsuite
    source: binutils-2.46.1/libctf/testsuite
    description: "libctf dejagnu 测试套件（6 .exp，ctf-compressed 依赖 tmpfile-shim）"
    command: "make check-libctf"
  - file: libsframe/testsuite
    source: binutils-2.46.1/libsframe/testsuite
    description: "libsframe dejagnu 测试套件（4 .exp）"
    command: "make check-libsframe"

# OHOS 测试环境兼容说明（E272 迁移，非新增上游测试用例）
upstream_test_ohos_notes: |
  1. site-stty-fix.exp（经 DEJAGNU 注入）: 包装 expect spawn 自动追加 -nottyinit，
     消除 OHOS 缺少 /bin/stty（/system/bin 只读 erofs）产生的噪音污染，避免
     binutils objcopy/strip 测试误判失败。
  2. tmpfile-shim.so（经 LD_PRELOAD 注入）: OHOS libc tmpfile() 忽略 TMPDIR 并访问
     系统临时目录返回 EACCES(13)，libctf ctf_link_write 的 ctf-compressed 测试失败；
     shim 用 mkstemp(TMPDIR)+unlink+fdopen 恢复 POSIX tmpfile() 语义（FD_CLOEXEC）。
  3. 测试依赖闭包: dejagnu/1.6.3 + expect/5.45.4 + tcl/8.6.14 均以 tool_requires
     声明（Conan 惯例直连声明 expect/tcl 以解析 TCL_LIBRARY / LD_LIBRARY_PATH）；
     三者属官方基线，不在本候选交付载荷内。

# test_package 自带测试（消费者视角，验证交叉工具链真实可用）
test_package_tests:
  - file: test.sh
    description: "用 i686-elf-as 汇编最小程序，readelf/objdump/ar/nm 验证产物（R34 合规）"
    command: "bash test.sh"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 6
