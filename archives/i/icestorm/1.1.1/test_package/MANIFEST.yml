# test_package/MANIFEST.yml - upstream test declaration
package: icestorm/1.1.1
homepage: "https://github.com/YosysHQ/icestorm"

# 上游测试审计
# 上游没有统一测试框架；测试是各子目录 Makefile 里的目标。逐目录清点后：
#   icebox/Makefile   check  -> 3 个纯 Python 自检脚本        [已执行, 3/3 PASS]
#   icetime/Makefile  test   -> test0..test9 (10 项)          [NOT_RUN]
#   icebram/Makefile  test   -> bash rundemo.sh (1 项)        [NOT_RUN]
#   icecompr/Makefile test   -> example_1k.ok/example_8k.ok (2 项) [NOT_RUN]
#   icefuzz/Makefile  check  -> work_*/*.bin 通配符驱动       [实例 0, 非跳过]
# icebox check 的第三个脚本 tc_logic_xpr.py 与器件数据无关；另两个脚本
# (tc_xlat_netnames.py / tc_rxlat_netnames.py) 会加载 chipdb，因此它们同时
# 验证本版本生成的数据库能被 icebox.py 读取 —— 正是本次修复的功能点。
# 上游以 icebox/ 目录下的数据库运行这三个脚本，故配方先把生成的
# chipdb-*.txt 复制到 icebox/ 再执行；任一脚本非 0 即构建失败。
upstream_tests_exist: true

upstream_check_command: "python3 tc_logic_xpr.py && python3 tc_xlat_netnames.py && python3 tc_rxlat_netnames.py"
upstream_test_in_build: true
upstream_test_command: "python3 tc_logic_xpr.py && python3 tc_xlat_netnames.py && python3 tc_rxlat_netnames.py"

upstream_tests:
  - file: icebox/tc_logic_xpr.py
    source: "上游 icebox/Makefile 的 check 目标（icebox/Makefile:12-14）"
    description: "对全部 65536 个 LUT 值做逻辑表达式往返 round-trip（纯 Python，不需要 Yosys）"
    command: "python3 tc_logic_xpr.py"
  - file: icebox/tc_xlat_netnames.py
    source: "上游 icebox/Makefile 的 check 目标（icebox/Makefile:12-14）"
    description: "全 tile 正向 netname 转换；加载 chipdb 数据库，因此校验本次修复的器件数据可被 icebox.py 读取"
    command: "python3 tc_xlat_netnames.py"
  - file: icebox/tc_rxlat_netnames.py
    source: "上游 icebox/Makefile 的 check 目标（icebox/Makefile:12-14）"
    description: "反向 netname 转换往返；同样加载 chipdb 数据库"
    command: "python3 tc_rxlat_netnames.py"

# NOT_RUN 逐条原因（13 项，均未申报为通过）：
#   icetime test0..test9 (10)：testN 与 runN 两种形式都需要 icetime/mktest.py
#     生成的 testN.asc/testN.pcf，而 mktest.py 调用 icefuzz/icecube.sh 与
#     "yosys -qp ... testN_ref.v"（mktest.py:150, 204）；本环境无 Yosys。
#   icebram test (1)：bash rundemo.sh 需要 yosys、nextpnr-ice40、icebox_vlog、
#     iverilog、vvp。
#   icecompr test (2)：需要 icecompr / iceuncompr 两个工具。上游默认构建也不
#     覆盖它们（顶层 SUBDIRS = "icebox icepack icemulti icepll icebram icetime"），
#     故本配方不为够到这两项而扩大工具集。
upstream_test_note: >-
  Executed 3 of 16 upstream test items (the three scripts of icebox/Makefile
  `check`), all PASS.  13 NOT_RUN with per-item reasons in the comment above;
  none is claimed as passed.

test_package_tests:
  - file: test_icestorm.sh
    description: >-
      CLI 行为 + 器件数据 + 运行期解析检查。34 断言构成：1 项 icepll PLL 计算；
      4 个工具 x (退出码检查 + Usage 横幅) = 8；iceunpack 可执行 = 1；
      5 个器件数据库 x (非空 + "IceBox Chip Database Dump" 头 + ".device" 记录) = 15；
      7 个 timing 表非空 = 7；运行期 chipdb 解析（icetime -v 报告的路径非空且存在）= 2。
    command: "sh test_icestorm.sh <package-bin> <package-share-icebox>"
assertion_count: 34
