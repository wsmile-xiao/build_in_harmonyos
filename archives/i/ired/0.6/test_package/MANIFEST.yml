# test_package/MANIFEST.yml
# 上游官方测试声明 — ired 0.6 (https://github.com/radare/ired)

package: ired/0.6
homepage: "https://github.com/radare/ired"

# 上游测试命令: t/test.sh — bdiff/ired 往返一致性测试
# (4 个 fixture 文件两两组合, 共 16 个独立用例; 依赖 BSD jot 与 md5sum,
# 无 jot 环境需提供 seq 兼容 shim 后完整运行)
upstream_check_command: "sh t/test.sh"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: t/test.sh
    source: ired-0.6/t/test.sh
    description: "bdiff → ired -n 往返测试: 4 个 fixture(file1..file4) 两两组合, 共 16 个独立用例; 每个用例验证 bdiff 补丁经 ired 应用后与原目标文件哈希一致"
    command: "sh t/test.sh"

test_package_tests:
  - file: test_ired.py
    description: "消费者测试: 调用安装后的 ired(写十六进制/搜索/转储) 与 bdiff(二进制 diff), 验证第三方使用者可执行公开 CLI"
    command: "python3 test_ired.py <package>/bin"

assertion_count: 8