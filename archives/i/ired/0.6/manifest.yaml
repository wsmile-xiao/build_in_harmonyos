software: ired
version: "0.6"
status: built
build_date: "2026-09-16"
build_system: makefile

source:
  url: "https://github.com/radare/ired/archive/refs/tags/0.6.tar.gz"
  sha256: "c15d37b96b1a25c44435d824bd7ef1f9aea9dc191be14c78b689d3156312d58a"
  tar_format: tar.gz
  source_identity: "ired 0.6 official GitHub tag archive"

build:
  system: makefile
  configure_options:
    - 'raw Makefile with CC from Conan tools.build:compiler_executables (clang), make -j1'
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ired 是纯 Makefile CLI 工程（无 configure/CMake），产物为 ired/bdiff 两个 ELF 可执行文件与 vired shell 交互脚本"
  - "上游 t/test.sh 依赖 BSD jot（无 jot 环境需 seq 兼容 shim）与 md5sum；4 个 fixture 两两组合共 16 个 bdiff→ired -n 往返用例，本平台实测 16/16 通过"
  - "OHOS Conan 包缓存中的 ELF 无 .codesign 段会在运行时被拒（PermissionError），package() 阶段须用 llvm-objcopy + binary-sign-tool 自签名"
  - "ired 为 CLI 包，R38 要求软件级 commands.json（archives/i/ired/commands.json）"
  - "test_package 采用 explicit test_type + test_ired.py 消费者脚本，实际调用安装后的 ired/bdiff 验证可执行性"
  - "vired（vi 风格交互包装脚本）依赖 stty raw + /dev/tty 读取，无头 CI 的 L2 冒烟测试中会无限挂起，已从 Conan 包中排除；仅交付 ired/bdiff 两个真实 CLI 工具（R38 commands.json 同步只声明二者）"

upstream_tests:
  exists: true
  test_count: 16
  command: "sh t/test.sh（需 jot/seq 兼容 shim + md5sum）"
  notes: "t/test.sh 使用 file1..file4 四文件两两组合做 bdiff 补丁 → ired -n 应用 → 哈希比对，16/16 通过"