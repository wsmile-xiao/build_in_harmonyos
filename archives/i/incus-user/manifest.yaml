software: incus-user
display: "Incus user daemon"
description: "Incus 用户项目守护进程（受限用户经 unix.socket.user 访问个人项目的代理守护）"
category: utility
homepage: "https://github.com/lxc/incus"
license: Apache-2.0

build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 库：CGO_ENABLED=0 + GOOS=linux + GOARCH=arm64 静态交叉编译"
    - "自举 Go SDK 后须对全部 ELF（bin/go、gofmt、pkg/tool/*）做 OHOS 自签名，否则无法执行"
    - "E523：-toolexec 包装器把链接器输出重定向到 /dev/shm，规避 HMDFS fallocate()=EACCES"
    - "E318：go test 测试二进制需签名，且须在 go 最终拷贝之后签名"
  common_dependencies: []

versions:
  "7.0.1":
    status: built
    build_date: "2026-10-10"
