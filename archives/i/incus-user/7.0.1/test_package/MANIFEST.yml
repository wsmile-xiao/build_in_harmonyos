# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制）
package: incus-user/7.0.1
homepage: "https://github.com/lxc/incus"

# 上游测试入口：Makefile check 目标 = `go test -v -tags libsqlite3 ./...` + test/main.sh
# Alpine incus 的 check() 亦为 `go test -v -skip "TestCluster_*|TestIntegration_UnixSocket|..." ./...`
# incus-user 为纯 Go 客户端守护进程（CGO_ENABLED=0），服务端 cgo 包在 OHOS 不可构建；
# 本库实际执行的为 cmd/incus-user 依赖闭包内全部含 *_test.go 的包。
upstream_check_command: "go test ./... (restricted to cmd/incus-user dependency closure)"

# conanfile.py build() 中已集成上游测试执行（go test -c + OHOS 签名 + 执行）
upstream_test_in_build: true
upstream_test_command: "go test -c -toolexec <e523-wrapper> -o <pkg>.test ./<pkg>/ && sign && ./<pkg>.test -test.v"

# 上游实际运行的测试（incus-user 闭包内含 *_test.go 的 8 个包）
upstream_tests:
  - file: "shared/api"
    source: "incus-7.0.1/shared/api/*_test.go"
    description: "shared/api：API 结构体/序列化单测（3 个测试文件）"
    command: "go test -v ./shared/api/"
  - file: "shared/osarch"
    source: "incus-7.0.1/shared/osarch/*_test.go"
    description: "shared/osarch：架构名映射单测"
    command: "go test -v ./shared/osarch/"
  - file: "shared/subprocess"
    source: "incus-7.0.1/shared/subprocess/*_test.go"
    description: "shared/subprocess：子进程管理单测"
    command: "go test -v ./shared/subprocess/"
  - file: "shared/tls"
    source: "incus-7.0.1/shared/tls/*_test.go"
    description: "shared/tls：证书/TLS 工具单测（3 个测试文件）"
    command: "go test -v ./shared/tls/"
  - file: "shared/revert"
    source: "incus-7.0.1/shared/revert/*_test.go"
    description: "shared/revert：reverter 栈单测"
    command: "go test -v ./shared/revert/"
  - file: "shared/idmap"
    source: "incus-7.0.1/shared/idmap/*_test.go"
    description: "shared/idmap：idmap 纯 Go 回退路径单测"
    command: "go test -v ./shared/idmap/"
  - file: "internal/util"
    source: "incus-7.0.1/internal/util/*_test.go"
    description: "internal/util：通用工具单测"
    command: "go test -v ./internal/util/"
  - file: "internal/version"
    source: "incus-7.0.1/internal/version/*_test.go"
    description: "internal/version：版本解析单测"
    command: "go test -v ./internal/version/"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: conanfile.py
    description: "验证安装的 incus-user 二进制：--version==7.0.1、--help 正常、产物为已签名 aarch64 ELF（鸿蒙特有断言）"
    command: "conan test test_package incus-user/7.0.1"
  - file: test.sh
    description: "安装产物冒烟脚本（--version / --help）"
    command: "bash test.sh <bin_dir>"

# 上游测试断言总数（实测：8 个包共 151 个顶层用例，全部 PASS）
assertion_count: 151
