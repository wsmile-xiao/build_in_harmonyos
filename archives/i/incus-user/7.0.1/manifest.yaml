version: "7.0.1"
software: "incus-user"

# conan-verify 8 道门禁通过；W3 conan create 本地通过；上游测试 151/151 PASS；未执行 CI upload
status: built
build_date: "2026-10-10"
build_system: "custom"

source:
  url: "https://github.com/lxc/incus/archive/refs/tags/v7.0.1.tar.gz"
  sha256: "69068dd6cd94eb70d3cb007140eb6b3211937ebfd16f6cedb0ee5e5aa073a2dc"
  tar_format: tar.gz

build:
  # Go 项目：go build ./cmd/incus-user（CGO_ENABLED=0，GOOS=linux GOARCH=arm64）
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOTOOLCHAIN=local"
    - "GOFLAGS=-mod=mod"
    - "GOPROXY=https://goproxy.cn,direct"
    - "GOSUMDB=off"
  dependencies: []
  cc: go
  cxx: ""
  binaries:
    - incus-user

patches_applied: []

knowledge_gained:
  - "incus-user 是纯 Go 客户端守护进程；cmd/incus-user 的 import 闭包无 cgo，CGO_ENABLED=0 可构建（incusd/agent 等服务端组件需 cgo+liblxc/cowsql，OHOS 不可构建）(knowledge_ref: DRAFT-incus-user-7.0.1-go-daemon-ohos-sign-link)"
  - "OHOS 内核拒绝 execve 未签名 ELF：自举的 Go SDK（bin/go、bin/gofmt、pkg/tool/linux_arm64/* 共 10 个 ELF）必须先用 binary-sign-tool 自签才能执行 go build (knowledge_ref: DRAFT-kubeadm-go-toolchain-sign)"
  - "E523：Go 链接器对输出文件调用 fallocate()，HMDFS 返回 EACCES 而链接器只忽略 ENOTSUP/EPERM → 需 -toolexec 包装器把链接器 -o 输出重定向到支持 fallocate 的 /dev/shm，链接后回拷 (knowledge_ref: E523)"
  - "E318：go test 产出的测试二进制同样需 OHOS 签名；且 go 在链接后会改写文件，签名必须在其最终拷贝之后——故采用 go test -c → 签名 → 直接执行 (knowledge_ref: E318)"
  - "源采用 GitHub 官方归档（git archive，不含 vendor/）；build() 先 `go mod download` 显式拉取模块闭包（GOPROXY=goproxy.cn，GOSUMDB=off，go.sum 仍校验）(knowledge_ref: DRAFT-go-no-vendor-module-closure-goproxy)"
  - "Go 1.26.5 (linux/arm64) 满足 go.mod 的 go >= 1.25.11 要求（GOTOOLCHAIN=local）(knowledge_ref: DRAFT-kubeadm-go-toolchain-sign)"

functional_test:
  date: "2026-10-10"
  result: pass
  total_cases: 151
  passed: 151
  failed: 0
  coverage:
    - "上游 go test（incus-user 依赖闭包 8 个包，151 个顶层用例全 PASS）"
    - "test_package：--version==7.0.1 / --help / 产物为已签名 aarch64 ELF（鸿蒙特有断言）"
  known_limitations:
    - "incus-user 为守护进程，需 net/cgroups/dbus 及系统 incusd 才能实际运行；OHOS 无这些 OS 设施，故功能测试限于 CLI（--version/--help）与二进制平台属性"
    - "上游服务端包（internal/server/*、cmd/incusd 等）依赖 cgo/liblxc/cowsql，OHOS 不可构建，不在本库范围"
