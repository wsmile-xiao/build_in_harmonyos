software: ima-evm-utils
version: "1.5"
build_system: autotools
status: built
build_date: "2026-09-21"

source:
  url: "https://github.com/linux-integrity/ima-evm-utils/archive/refs/tags/v1.5.tar.gz"
  sha256: "de59f63ec63c81baa9403cb37f0609b4f5bb83ae60f4f18732ba65cdbd79605a"
  tar_format: tar.gz

dependencies:
  - "openssl/1.1.1w"

build:
  system: autotools
  configure_options:
    - "--build/--host=aarch64-unknown-linux-ohos --disable-engine"
  cc: clang

patches_applied:
  - "0001-config.guess-ohos.patch"
  - "0002-configure-keyutils-optional.patch"

knowledge_gained:
  - "ima-evm-utils 1.5 为 autotools C 项目（configure.ac AC_INIT v1.5），tarball 无预生成 configure，需 tool_requires automake/libtool 手动 autogen"
  - "依赖 LIBCRYPTO（openssl/libcrypto，PKG_CHECK_MODULES），registry 已有 openssl/1.1.1w"
  - "keyutils.h 为硬性 AC_MSG_ERROR 检查（OHOS 无 libkeyutils），需 patch 可选化（AC_CHECK_HEADERS 降级为警告）"
  - "可选依赖：tss2-esys/tss2-rc/ibmtss（TPM 相关，OHOS 无，AC_CHECK_LIB 缺省不启用）；pandoc（文档，可选）"
  - "产物：libimaevm（lib_LTLIBRARIES）+ evmctl（bin_PROGRAMS），SUBDIRS=src/tests/doc"
  - "AC_CHECK_HEADERS(sys/xattr.h) 为硬性错误（OHOS musl 有 sys/xattr.h，通过）"

package_contract:
  libraries: ["imaevm"]
  pkg_config: ["imaevm"]
  headers: ["imaevm.h"]
  binaries: ["evmctl"]

test_results:
  type: consumer
  total: 3
  passed: 3
  failed: 0
  note: "上游无离线自动化测试套件（tests/ 需内核 IMA/EVM 环境）；test_package 消费者 3 断言"
