software: inoticoming
display: "inoticoming"
description: "Daemon that watches an incoming directory through inotify and triggers actions when matching files arrive"
category: system
homepage: "https://sources.debian.org/src/inoticoming/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools build (configure + make) with the OHOS clang from Conan conf tools.build:compiler_executables"
    - "E011: autoconf temp dirs (umask 077 -> drwx--S--- on HMDFS) relaxed to umask 022 in the shipped configure and the config.status it generates, otherwise config.status dies with 'can't create ./confXXXXXX/subs1.awk: Permission denied'"
    - "sys/inotify.h and the inotify syscalls are provided by the OHOS kernel/libc — verified end to end (IN_CLOSE_WRITE + IN_MOVED_TO) on device"
    - "OHOS ships no syslogd: the daemon is testable with --foreground, production mode uses --logfile"
  common_dependencies: []

versions:
  "0.2.3":
    status: built
    build_date: "2026-09-23"
