# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: inoticoming/0.2.3
homepage: "https://sources.debian.org/src/inoticoming/"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: inoticoming_0.2.3.orig.tar.gz,
# sha256 b31ba7956bd98e7f9d6a8b81737570394f8a05e07b66670aca47711dd8c7ee68)
upstream_test_audit:
  source_tarball: "inoticoming_0.2.3.orig.tar.gz"
  source_sha256: "b31ba7956bd98e7f9d6a8b81737570394f8a05e07b66670aca47711dd8c7ee68"
  top_level_entries: 26
  files:
    - AUTHORS          # 单一上游作者声明，无测试入口
    - COPYING          # GPL-2 许可证文本
    - ChangeLog        # 变更记录，无测试入口
    - INSTALL          # autotools 通用安装说明，无测试入口
    - Makefile.am      # 仅 bin_PROGRAMS/man_MANS/EXTRA_DIST，无 TESTS/check_PROGRAMS
    - Makefile.in      # automake 生成物，check 目标不注册用例
    - NEWS             # 发布说明，无测试入口
    - README           # 功能说明，无测试入口
    - aclocal.m4       # autotools 生成物
    - autogen.sh       # autoreconf 包装脚本，无测试接线
    - closeallfds.c    # fd 关闭辅助实现，无测试代码
    - closeallfds.h    # fd 关闭辅助声明
    - config.h.in      # autoheader 生成物
    - configure        # autoconf 2.68 生成物
    - configure.ac     # 仅 AC_PROG_CC/AC_CHECK_HEADERS，无 AC_CONFIG_TESTDIR
    - inoticoming.1    # man 页
    - inoticoming.c    # 守护进程主实现 (746 行)，无单元测试代码
    - ac/depcomp       # autotools 辅助脚本
    - ac/install-sh    # autotools 辅助脚本
    - ac/missing       # autotools 辅助脚本
    - examples/cronjob            # cron 示例
    - examples/inoticoming.default# initscript 默认值示例
    - examples/inoticoming.init   # SysV init 示例
  scanned_for:
    - "TESTS / check_PROGRAMS (autotools make check)"
    - "AC_CONFIG_TESTDIR (autotest)"
    - "enable_testing / add_test (ctest)"
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "tests/ / test/ 目录"
  scan_result: "0 命中 — tar 包 26 个条目中无 tests/ 目录、无 *test* 源文件、无任何测试接线"
  reason: "inoticoming 为 Debian 维护者自研的单二进制 CLI 守护进程，上游发布包不含测试套件"

# 上游测试命令 (存在 check 目标但 0 用例；build() 中已实际执行)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check (automake 默认目标，实测 0 用例：退出码 0 且无输出)"

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证 + 鸿蒙专项)
test_package_tests:
  - file: test_inoticoming.py
    description: >-
      消费者功能测试 6 用例：--version 版本断言、--help 用法输出、
      IN_CLOSE_WRITE 事件派发动作、IN_MOVED_TO 事件派发动作、
      --suffix 过滤（不匹配不派发/匹配派发）、SIGTERM 退出码 0
    command: "python3 test_inoticoming.py <bin/inoticoming> <workdir>"
  - file: test_ohos_inoticoming.py
    description: >-
      鸿蒙专项测试（本次适配新增，非上游既有测试）6 用例：
      (1) OHOS 目标身份 ELF64/AArch64 PIE 且 PT_INTERP=/lib/ld-musl-aarch64.so.1；
      (2) OHOS 内核 inotify ABI 实测（IN_CLOSE_WRITE + IN_MOVED_TO）；
      (3) --initialsearch 依赖的 readdir d_type==DT_REG 在 OHOS 文件系统成立；
      (4) --pid-file 内容等于守护进程真实 pid；
      (5) --chdir 后动作在监听目录内执行；
      (6) 无 syslogd 环境下 daemon 化 + --logfile 派发日志可用。
      本脚本仅当测试目标为 OHOS 时由 test_package/conanfile.py 启动
      （用例 1 断言 OHOS musl 装载器路径），其它目标如实报告为 skipped。
    command: "python3 test_ohos_inoticoming.py <bin/inoticoming> <workdir>"

# 测试断言总数 (6 consumer + 6 OHOS-specific)
assertion_count: 12
