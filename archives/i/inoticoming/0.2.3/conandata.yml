# conandata.yml — inoticoming 0.2.3
#
# 源码来源：Debian pool 的 inoticoming_0.2.3.orig.tar.gz。
# inoticoming 由 Debian 维护者 Bernhard R. Link 本人开发并维护，上游没有
# 独立的托管仓库/发布站点（debian/copyright 记录："The .orig.tar.gz was
# generated with make dist from the cvs checkout"，原 CVS/Alioth 早已下线）。
# 该 orig.tar.gz 就是 `make dist` 产出的原始上游发行包（非 debian/ 重打包
# 版本，也未叠加任何 Debian 补丁），sha256 与 Debian .dsc 声明一致：
#   b31ba7956bd98e7f9d6a8b81737570394f8a05e07b66670aca47711dd8c7ee68
# 与同仓库先例 archives/c/cvs-mailcommit/1.19 一致。
sources:
  url: "https://deb.debian.org/debian/pool/main/i/inoticoming/inoticoming_0.2.3.orig.tar.gz"
  sha256: "b31ba7956bd98e7f9d6a8b81737570394f8a05e07b66670aca47711dd8c7ee68"

# 补丁：仅 1 个，修 E011（HMDFS 上 autoconf 临时目录不可写）。
# 该补丁只放宽 autoconf 建临时目录时的 umask（077 → 022），不改业务逻辑，
# 在所有平台均安全（同仓库 abook 0006-configure.patch / adcli 等 635 份配方
# 采用同一处理）。
patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: >-
      Relax umask 077 to umask 022 when autoconf creates its temp directory
      (./confXXXXXX). On HMDFS the 0700/setgid directory is not writable even
      by the creating process, so config.status dies with
      "can't create ./confXXXXXX/subs1.awk: Permission denied" (E011).
    patch_type: "portability"
    sha256: "5f8a91b17b89d7fa16049eb91d6ede98b67dc8dc96e63c64818603c6a43977da"
