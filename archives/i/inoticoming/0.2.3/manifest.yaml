patches_applied:
  - "0001-configure.patch（E011：autoconf 建临时目录的 umask 077 → 022，HMDFS 上 0700+setgid 目录构建用户自身不可写，config.status 报 subs1.awk Permission denied）"

knowledge_gained:
  - "ref: E011 — HMDFS 上 autoconf 的 (umask 077 && mktemp -d ./confXXXXXX) 临时目录落成 drwx--S---（owner uid 被映射为 20001006 且带 setgid），构建用户自身不可写，config.status 报 'can't create ./confXXXXXX/subs1.awk: Permission denied'；补丁 0001-configure.patch 把 configure 的 umask 077 放宽为 022 后通过（config.status 由该 configure 生成，随之生效）"
  - "ref: none（实施教训，无独立 E 条目）— E011 的修丁必须作用于 source_folder：basic_layout 的 build_folder 是 build-<build_type>，而发行包自带 configure 在 source_folder；只扫 build_folder + os.path.isfile 守卫会静默跳过，原错误一字不差复现（本次第一轮 conan create 实例）"
  - "ref: none（平台能力实测，无对应 E 条目）— OHOS libc 提供 sys/inotify.h 与 inotify_init/inotify_add_watch/inotify_rm_watch，内核侧 IN_CLOSE_WRITE/IN_MOVED_TO 投递实测正常；未做功能裁剪、无平台宏 stub（R8/R40），仅 fanotify（本包未用）在 OHOS 不可用"
  - "ref: none（平台能力实测，无对应 E 条目）— OHOS 默认无 syslogd：守护进程 --foreground 直接写 stdio，生产模式需显式 --logfile；daemon() 化会 chdir('/')，--logfile/--pid-file/动作/参数须用绝对路径"
  - "ref: none（平台行为实测，无对应 E 条目）— --initialsearch 依赖 readdir 返回 d_type==DT_REG，OHOS 文件系统实测 d_type 有值、预存普通文件可被处理；上游 0 测试套件（Makefile.am 无 TESTS/check_PROGRAMS，make check 为空目标），test_package 以 6 消费者用例 + 6 鸿蒙专项用例补足"

