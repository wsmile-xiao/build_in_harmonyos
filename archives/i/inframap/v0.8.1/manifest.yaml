software: inframap
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/v0.8.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "v0.8.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# 构建系统
build_system: go

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/cycloidio/inframap/archive/refs/tags/v0.8.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: go

  # Go 编译选项
  go_options:
    ldflags: "-X github.com/cycloidio/inframap/cmd.Version=v0.8.1"
    output: "inframap"
    entrypoint: "./main.go"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.22.0

  # Go 环境变量
  go_env:
    GOROOT: /data/storage/el2/base/cache/go-1.22.0
    GOPROXY: https://goproxy.cn,direct
    GOCACHE: /data/storage/el2/base/cache/go-cache
    GOTMPDIR: /data/storage/el2/base/cache/go-tmp

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
