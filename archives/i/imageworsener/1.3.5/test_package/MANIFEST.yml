# test_package/MANIFEST.yml — imageworsener 1.3.5
test_type: consumer
upstream_test: "make check (tests/runtest + diff -r --brief expected actual)"
description: "CMake consumer links libimageworsener and exercises the public C API; imagew -version smoke-tests the packaged CLI"

upstream_tests:
  - file: tests/runtest
    source: imageworsener-1.3.5.tar.gz/tests/runtest
    description: "138 imagew invocations, diff of 196 expected outputs"
    command: "make -j1 check"

test_package_tests:
  - file: test_imageworsener.c
    description: "48 real assertions against imagew.h (version/context/formats/colorspace/parse helpers)"
    command: "./test_imageworsener"
  - file: N/A (packaged binary)
    description: "imagew -version exits 0 and reports the version string"
    command: "imagew -version"

assertion_count: 49
