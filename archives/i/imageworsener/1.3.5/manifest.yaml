software: imageworsener
version: "1.3.5"
status: built
build_date: "2026-09-18"
build_system: autotools

source:
  url: "https://entropymine.com/imageworsener/imageworsener-1.3.5.tar.gz"
  sha256: "a7fbb65c5ade67d9ebc32e52c58988a4f986bacc008c9021fe36b598466d5c8d"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - zlib/1.3.1.1
    - libpng/1.6.58
    - libjpeg/10
    - libwebp/1.6.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-runtest-propagate-exit-code.patch"

knowledge_gained:
  - "tests/runtest 从不传递退出码（恒为 0），必须补 exit $RET 才能让 make check 真实把关"
  - "AutotoolsDeps 即可满足 AC_CHECK_LIB 式探测，无需 pkg-config 桥接"
