package: installkernel/4.1
homepage: "https://gitlab.alpinelinux.org/alpine/aports/-/tree/master/main/installkernel"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  上游为 Alpine aports 内嵌单文件 POSIX sh 脚本发行（installkernel，
  918 字节/45 行），APKBUILD options="!check" 无任何测试套件。本包以
  内容级消费者探针代替：内容锚点逐项断言 + 字节/行数精确计数 +
  sh -n 语法与 0 参数干跑行为烟测（无 sh 环境自动 SKIP）。
test_package_tests:
  - file: installkernel_probe.cpp
    description: >-
      真消费者测试：包内清单（sbin/installkernel 在位 + sbin 恰 1 文件
      + 全树恰 1 文件，排除 conan 2 簿记 conaninfo/conanmanifest），
      脚本内容锚点（shebang/set -e/Usage 行/缺省 /boot/.old 备份/
      vmlinuz/System.map-/config- 复制/kernel-suffix），静态完整性
      （918 字节 + 45 行精确 + 首末行断言 + 无 CR），sh -n 语法 +
      0 参数干跑 Usage exit 1 行为烟测（sh 缺失时 SKIP），截断/坏
      Usage 注入负向用例。
    command: "installkernel_probe <package-root>"
assertion_count: 5
