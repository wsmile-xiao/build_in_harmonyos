knowledge_gained:
  - "installkernel 4.1 = Alpine aports main/installkernel pkgver=4.1（全平台唯一对得上 4.1 的候选：Gentoo 版标签为 v70/v69 系、Debian debianutils 版为 v2）——任务卡 url 字段为 null、lang 字段标 C++ 均不可靠（上游实为 POSIX sh 脚本，noarch）"
  - "脚本直接内嵌于 aports 树（APKBUILD source=\"installkernel\"，无独立 tarball/tag），以 aports commit 69a2ca2b（2023-12-21，该文件最近修改）钉死；conan 2.29 裸文件下载禁用 get()（其源码 download→unzip→unlink 无条件解压，裸文件报 BadZipFile，真机 G2 两连败后读设备端源码确认），改用 download()（纯下载 + sha256 校验 + 多 URL 回退）"
  - "Alpine 安装语义：脚本装入 /sbin/installkernel；行为核心 = 复制 vmlinuz/System.map/config 至 /boot（缺省），旧文件留 .old 备份，flavor 后缀写入 lib/modules/<release>/kernel-suffix"
  - "GPL-2.0-only（APKBUILD license 字段声明），脚本本体无内嵌许可文本 → 不设 licenses/ 目录（保持上游发行原样），许可随 manifest/notes 声明"
  - "conan 2 默认 layout 下 source_folder == build 文件夹，内含 conanbuild/conanrun*.sh 等 6 个生成文件（真机 G2 实测 7 文件=6 env .sh+脚本本体），build() 防漂移全树计数须排除 .sh（fabric-completion 同款坑）"
  - "鸿蒙真机 /tmp 只读（mkdir 报 Read-only file system，Linux CI 正常）：探针行为烟测写 /tmp 重定向静默失败致断言全挂；临时目录须 TMPDIR/TMP/TEMP 写权限实测选取、回落 cwd（真机实证后行为烟测实跑全过）"
upstream_test_pass_rate: "N/A（APKBUILD options=\"!check\"：上游无测试套件）"
adapted_test_pass_rate: "真机八门禁全绿：G0-G4/L2/L4/L5 全 PASS（2026-09-26，ohos-aarch64，conan 2.29.1；消费者探针 5 组断言含行为烟测实跑，L2/L4/L5 无 cache 路径跳过与 fabric-completion 同口径）"
test_command: "conan create . --build=missing"
