# 软件级 manifest — imap-tools
# 遵循 ARCHIVE-SPEC v3.0

software: imap-tools
display: "imap-tools"
description: "imap-tools — 高层 IMAP 邮件客户端库（纯 Python，零外部依赖）"
category: library
homepage: "https://github.com/ikvk/imap_tools"
license: Apache-2.0
build_system: python

ohos_adaptation:
  key_points:
    - "纯 Python noarch——无编译，shutil.copytree 拷贝 imap_tools/ 模块（含 py.typed）到 site-packages（pip/setuptools 构建不可用——同 python-magic/rich/dotenv）"
    - "零外部依赖（PyPI requires_dist 为空）——无需任何前置包，路径 A 基础适配"
    - "上游测试：pytest 跑 tests/ 离线可收集子集（test_imap_utf7 + test_query + test_utils = 21 用例）——build() 集成实测回填（rule 4）"
    - "真机连接用例（6 个）无 IMAP 账号且 tests/utils.py 未被官方 sdist 打包——如实披露未运行"
    - "env_info.PYTHONPATH 暴露导入路径给消费者"
  common_dependencies: []

versions:
  "1.10.0":
    status: built
    build_date: "2026-10-07"
    conan_ref: "imap-tools/1.10.0"
