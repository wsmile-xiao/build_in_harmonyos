# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: imap-tools/1.10.0
homepage: "https://github.com/ikvk/imap_tools"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "pytest tests/test_imap_utf7.py tests/test_query.py tests/test_utils.py -q"

upstream_tests:
  - name: "tests/ 离线可收集子集（test_imap_utf7 + test_query + test_utils）"
    count: "21"
    description: "实测 **21 passed / 0 failed（100%）**，build() 集成执行"

  - name: "tests/ 真机连接用例（test_connection + test_folders + test_idle + test_mailbox + test_message）"
    count: "6"
    description: "**本环境不可执行（系统性堵塞）**。上游 tests/utils.py 通过 `tests/credentials.ini` 读取 4 个真实邮箱服务商账号（TEST_MAILBOX_NAME_SET = YANDEX/ZIMBRA/MAIL_RU/YAHOO，各需 host/email/password/path_separator/test_folder），该凭据文件上游**刻意不随仓库发布**（仓库内无模板）；且 MailboxTestCase.setUp 会连接全部 4 个账号。本轮已取上游 GitHub tag v1.10.0 完整源码（含 sdist 缺失的 tests/utils.py 与 tests/__init__.py）并尝试自建本地 IMAP 服务端以代填账号，两条路径均不可行：①仓库自带归档 dovecot/2.4.4（唯一真实 IMAP 服务端）二进制编译前缀为 `/`，运行期 exec 硬编码 `//bin/doveconf`、`//bin/doveadm`，而 OHOS `/bin` 为只读软链（→/system/bin）无法补软链；且 doveconf 把二进制配置写到硬编码 `/tmp`（只读，TMPDIR 无效）——LD_PRELOAD 垫片可解前者（`doveconf -c <cfg> -n` 已能输出有效配置），后者仍致 `Failed to write binary config file`；②改用纯 Python 的 pymap 0.36.7（dict/maildir 后端）作服务端，进程可起但端口始终未监听。故这 6 例在本环境不可执行，如实披露"

test_package_tests:
  - file: test_imap_tools.py
    description: "R34：模块文件齐全 + import + 真实离线 API 调用（查询构建器 AND/OR/NOT/H、MailMessage.from_bytes 解析真实 RFC822、imap_utf7 编解码往返、__version__ 与公开类）"
    command: "python3 test_imap_tools.py <package>"

assertion_count: 6
