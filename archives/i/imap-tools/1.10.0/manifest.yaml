  - category: L1
    content: "imap-tools 上游 tests/ 共 27 个 test 函数，官方 sdist（MANIFEST.in 仅 include LICENSE/MANIFEST.in/README.rst）打包了 8 个测试文件但漏掉 helper 模块 tests/utils.py 与 tests/__init__.py——导致 5 个依赖该 helper 的文件（test_connection/test_folders/test_idle/test_mailbox/test_message）在 sdist 内连收集都失败；离线可执行的仅 test_imap_utf7(3)+test_query(6)+test_utils(12)=21 用例，实测 21 passed / 0 failed（100%）。适配时按文件白名单显式指定可收集子集，而非 pytest 跑整个 tests/ 目录（否则 5 个 collection error 会把真实通过率淹没）"
    reason: "rule 4 实测回填（21/21，分母=离线可收集用例）；剩余 6 个真机连接用例无账号不可执行"
  - category: L1
    content: "纯 Python 库适配要点（与 python-dotenv/rich 同源）：OHOS 沙箱 /tmp 只读——pytest tmp_path fixture 需 TMPDIR=/data/storage/el2/base/cache；pip/setuptools 构建不可用——package() 用 shutil.copytree 直接拷贝源码模块到 lib/python3.12/site-packages；包为顶层 layout（imap_tools/ 在源码根，非 src layout）——直接拷贝源码根下模块目录"
    reason: "imap-tools 适配实测——与 python-dotenv/rich 同源教训"

  - category: L1
    content: "imap-tools 的 6 个真机连接用例（test_connection/test_folders/test_idle/test_mailbox/test_message）在 OHOS 上不可执行，属系统性堵塞：①上游测试凭据 tests/credentials.ini（4 个服务商 section：YANDEX/ZIMBRA/MAIL_RU/YAHOO，字段 host/email/password/path_separator/test_folder）刻意不随仓库发布，且 MailboxTestCase.setUp 会连接全部 4 个账号；②无法用本地 IMAP 服务端代填——仓库自带归档 dovecot/2.4.4 二进制编译前缀为 \"/\"，运行期 exec 硬编码 //bin/doveconf、//bin/doveadm（OHOS /bin 为只读软链 → /system/bin，无法补软链），且 doveconf 把二进制配置写到硬编码 /tmp（只读，TMPDIR 无效）→ 即使用 LD_PRELOAD 垫片重定向 exec 路径（doveconf -c <cfg> -n 可输出有效配置），仍卡在 Failed to write binary config file；纯 Python 的 pymap 0.36.7 进程可起但端口始终未监听。另注意：官方 sdist 的 MANIFEST.in 未打包 tests/utils.py 与 tests/__init__.py，需从 GitHub tag v1.10.0 取完整源码才能看清上述前提"
    reason: "如实披露不可执行原因；排查路径可复用于其它需 IMAP/SMTP 真机用例的库"
