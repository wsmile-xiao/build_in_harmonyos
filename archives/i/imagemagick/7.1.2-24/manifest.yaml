software: imagemagick
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/7.1.2-24/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.1.2-24"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.imagemagick.org/archive/releases/ImageMagick-7.1.2-24.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--disable-docs"
    - "--disable-shared"
    - "--disable-openmp"
    - "--without-modules"
    - "--host=aarch64-unknown-linux-ohos"
    - "CC=clang -fuse-ld=bfd"
    - "CXX=clang++ -fuse-ld=bfd"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "bz2/1.0.8"
    - "jpeg/10"

  # 编译器
  cc: clang
  cxx: clang++

  # 手动链接命令（静态库）
  link_command: "clang -fuse-ld=bfd utilities/magick.o MagickWand/.libs/libMagickWand-7.Q16HDRI.a MagickCore/.libs/libMagickCore-7.Q16HDRI.a $DEFAULT_PREFIX/lib/libbz2.a $DEFAULT_PREFIX/lib/libjpeg.a -lm -lpthread -ldl -o utilities/magick-static"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
