software: imagemagick
# 版本级 manifest 模板
# 文件位置: archives/i/imagemagick/6.9.13-48/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.9.13-48"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ImageMagick/ImageMagick6/archive/6.9.13-48.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--without-x"
    - "--without-tiff"
    - "--without-jbig"
    - "--without-djvu"
    - "--without-webp"
    - "--without-wmf"
    - "--without-fftw"
    - "--without-xml"
    - "--without-gslib"
    - "--without-pango"
    - "--disable-openmp"
    - "--disable-opencl"
    - "HELP2MAN=/bin/true"
    - "MAKEINFO=/bin/true"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libjpeg-turbo/3.1.4.1"
    - "xz/5.6.2"
    - "lcms2"
    - "libpng/1.6.43"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 需要 OHOS 平台检测补丁"
  - "E050: HMDFS 上 umask 077 创建的目录无法写入文件，需移除 configure 中的 umask 077"