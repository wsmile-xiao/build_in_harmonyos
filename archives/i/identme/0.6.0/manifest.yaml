software: identme

# ============================================================
# 必须字段
# ============================================================

version: "0.6.0"
status: published
build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/pcarrier/ident.me/archive/refs/tags/v0.6.0.tar.gz"
  sha256: "5e37f2f5b661ebe9731aab8d6d2ecdbea6e2239ea6f5ad1f2b158ea15fea947c"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "CMAKE_SYSTEM_NAME=Linux"
    - "CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "BUILD_SHARED_LIBS=OFF"
    - "CMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON"
    - "CURL_LIBRARY=/storage/Users/currentUser/usr/local/lib/libcurl.a"
    - "CURL_INCLUDE_DIR=/storage/Users/currentUser/usr/local/include"
    - "CMAKE_PREFIX_PATH=/storage/Users/currentUser/usr/local"
    - "CMAKE_EXE_LINKER_FLAGS=-L/storage/Users/currentUser/usr/local/lib"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "source() 内动态修改 CMakeLists.txt: 添加静态链接依赖 (libssl.a, libcrypto.a, libz.a) 和 -static-libstdc++"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E092: CMake 不识别 HarmonyOS，需 CMAKE_SYSTEM_NAME=Linux"
  - "FindCURL 会通过 pkg-config 找到共享库，需 CMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON + 直接指定 CURL_LIBRARY 静态路径"
  - "libcurl.a 静态链接需额外链接 ssl/crypto/z 依赖，需在 CMakeLists.txt 中指定完整路径"
  - "系统缺少 OpenSSL 静态库时，可从源码构建 (./Configure no-shared linux-aarch64)"
  - "libc++ 动态链接可用 -static-libstdc++ 静态化"
  - "Conan 2 conandata patches 导出机制不稳定，改用 source() 中 Python 字符串替换更可靠"
  - "GitHub 下载 SSL 失败可用 ghfast.top 代理，URL 需保留 .tar.gz 后缀"
