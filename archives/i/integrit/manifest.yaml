software: integrit
display: "integrit"
description: "文件完整性校验系统：用 CDB 数据库与 RMD160 摘要检测文件树被改动、新增或删除"
category: system

homepage: "https://sourceforge.net/projects/integrit/"
license: GPL-2.0-only

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "install 规则含 $(STRIP)：strip 会让 hnp clang 写入的 .codesign 签名随布局失配，装出来的可执行文件直接 Operation not permitted —— 在 install 调用上传 STRIP= 禁 strip（见 DRAFT-E703）"
    - "Conan autotools 走 --prefix=/ + DESTDIR 模式，目录参数必须是根起绝对路径：--sbindir=/bin 才会落到 <DESTDIR>/bin；从 self.folders.package 推导会得到相对值 bin 被 configure 拒绝"
    - "上游把可执行文件装进 $(sbindir)=sbin/，与 L5/G4 只认 bin/ 或 lib/ 不匹配，需 --sbindir 归位"
    - "autoconf 2.59 生成物用 umask 077 && mktemp -d ./confstatXXXXXX 建临时目录，HMDFS 落盘 2700 后 config.status 写不进去（configure 返回 0 但 config.h 未生成的假绿）—— 对生成物 configure/config.status 做 umask 022 + mkdir -p 归一（E011/E114 同族）"
    - "上游测试 test/test 是 fail-fast shell 驱动器、自建 4×4 文件树，断言数用 grep -c 'TEST FAILED' 清点（=31）；依赖 chmod 000 的断言在 HMDFS 上必然失败（权限位不生效）"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "4.1":
    status: built
    build_date: "2026-09-24"
    conan_ref: "integrit/4.1"
