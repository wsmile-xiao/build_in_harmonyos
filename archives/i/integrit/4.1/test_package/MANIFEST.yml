# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# integrit 4.1 的上游测试是 test/test（`make test` 驱动）：先用
# test/make-filetree 自建一棵 4×4 文件树，生成 test.conf，再连续执行
# integrit 的 update/check 并逐条断言退出码与报告行。
# 断言数以 `grep -c 'TEST FAILED' test/test` 清点 = 31（fail-fast 脚本，
# 每个 `|| { echo "test: TEST FAILED: …"; exit 1; }` 守卫即一条断言）。
# 上游无 `make check` 目标，等价入口是 `make test`。

package: integrit/4.1
homepage: "https://sourceforge.net/projects/integrit/"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test
    source: integrit-4.1/test/test
    description: "上游自建文件树集成测试 — 31 条断言（退出码 0/1/2、known/current db 生成、changed/new/missing 报告行识别），fail-fast"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制)
test_package_tests:
  - file: test.sh
    description: "消费者冒烟测试 — 调用已安装 integrit 二进制，断言版本指纹 + 0/1/2 三态退出码契约 + 报告行，共 9 条断言"
    command: "sh test.sh"

# 鸿蒙/OHOS 特有测试（不并入上游用例数，单独计入 rule12 鸿蒙行）
added_tests:
  - name: "consumer-exit-code-contract"
    source: test_package/test.sh
    description: "在 HMDFS 权限语义下改用『配置文件缺失』路径验证 EXIT_FAILURE(2) — 与上游 #31 的 chmod 000 路径互补，证明退出码 2 契约本身在本设备可测"

# 上游测试断言总数（= grep -c 'TEST FAILED' test/test == m4 源 try( 调用数 == 31，
# 且与上游 HEAD 的 test/test.m4 逐字节一致 ⇒ 无差额）
assertion_count: 31

# test_package 消费者断言总数（= assert_* 调用数 == 设备实测 [ok] 行数）
test_package_assertion_count: 9
