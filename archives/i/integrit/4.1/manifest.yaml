# 版本级 manifest
# 文件位置: archives/i/integrit/4.1/manifest.yaml
# 遵循 ARCHIVE-SPEC

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.1"

# 软件名
software: "integrit"

# 编译状态
# published | built | failed | archived
# 未合并且 release upload 未确认前一律 built（AGENTS §1 O5）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  # 取 Debian pool（官方 SourceForge 直链为 HTML 反爬页，实测 403/HTML 已留证）；
  # deb.debian.org 与 ftp.openbsd.org 等 5 镜像 sha256 全等，4 份 PGP 签名 .dsc 内证一致
  url: "https://deb.debian.org/debian/pool/main/i/integrit/integrit_4.1.orig.tar.gz"

  # 源码校验和
  sha256: "2a09b670ee025d6fae756e044f780ccaca90688a97183a350927e3885174223e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: "autotools"

  # 配置选项列表
  # 上游把可执行装进 $(sbindir)=sbin/，用本开关归位到 Conan 标准 bin/。
  # 值必须是**根起绝对路径**（与 conanfile.py 实际 append 值、W3 实跑 sbindir=/bin 一致）——
  # 相对值或未展开占位会被 configure 以 expected an absolute directory name 拒绝。
  # 注释独立成行：clean_verify.py 的 configure_options 正则会把行内注释连同值一起吞入。
  configure_options:
    - "--sbindir=/bin"
  # CFLAGS 由 conanfile generate() 钉死为 -O3 -pipe -DNDEBUG（R33）

  # 编译依赖列表（格式: name/version）
  # 空集：纯 C，哈希(RMD160)/CDB/哈希表全部内置，readelf NEEDED 仅 libc.so
  dependencies: []

  # 编译器
  cc: "clang"
  cxx: "clang++"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
# 无源补丁：HMDFS config.status 修法只改 conan 缓存内的生成物（build() 内），
# 不进 git
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 install 用 $(STRIP) 时：hnp clang 的 .codesign 签名随 strip 后布局失配 ⇒ 装出来的可执行文件 EPERM（section 仍在但签名校验失败）；用 make STRIP= install 禁 strip 即可  # knowledge_ref: DRAFT-E703"
  - "HMDFS config.status umask 077 临时目录族（configure rc=0 却没生成 config.h 的假绿）：对生成物 configure / hashtbl/configure / config.status 做 umask 077→022 + mktemp→mkdir -p ./conftmp 四处归一，只在 build() 内执行、不进 git  # knowledge_ref: E011"
  - "上游 make test 自建文件树 + 退出码契约测试的处置：先 grep -c 'TEST FAILED' 清点总断言数，权限位类失败按平台限制归因而非改码，并用不依赖权限位的等价路径补验同一契约  # knowledge_ref: DRAFT-E698"
  - "上游三份 Makefile.in 零 $(DESTDIR) 而 Conan 走 prefix=/ + 安装期 DESTDIR：make install 会直写根目录（//man、//bin）⇒ 此类老 autotools 项目一律 package() 直接 copy 收产物，不要 patch DESTDIR、也不要依赖 prefix 指向 package_folder（该判断已被本包证伪，机制与三重根因见 notes.md 问题表 #4）  # knowledge_ref: DRAFT-E703"
  - "上游装 $(sbindir)=sbin/ 与 CI L5 门禁（只认 bin/ 或 lib/）不匹配：用一个 configure 开关 --sbindir=/bin 归位（根起绝对路径，配合 prefix=/ + DESTDIR 语义），不动源码  # knowledge_ref: DRAFT-E698"
  - "vendored gnupg/bithelp.h 的 __asm__(roll %%cl) 属 #if __i386__ 备用路径：五重编译探针（-E 展开/编译/运行/-S/make）实证 aarch64 走纯 C 宏，非真实构建面  # knowledge_ref: DRAFT-E698"
  - "libgc(Boehm) 只在 --with-leakfind=DIR 下被 AC_CHECK_LIB 探测且全部 include 在 #ifdef ELC_FIND_LEAKS 内：可选依赖缺省禁用，硬依赖为空集  # knowledge_ref: DRAFT-E698"
