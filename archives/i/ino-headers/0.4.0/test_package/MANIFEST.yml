package: ino-headers/0.4.0
homepage: "https://naspro.sourceforge.net/libraries/ino/"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  上游发行 tarball 无 test/ 目录、Makefile 无 check 目标（make all/check
  均为 no-op，纯头文件发行；R51 清点证据：0.4.0 发行包根目录实测仅文档、
  autotools 文件与 lib.h）。适配以 R34 消费者测试替代：C++11 TU 覆盖全部
  公开 API（3 typedef 语义 + 6 枚举值 + 26 个公开函数精确签名，decltype
  编译期断言不产生链接引用）、C11 TU 验证头文件纯 C 可用性、check_pkg.sh
  校验打包布局与头文件包纯度。
test_package_tests:
  - file: test_ino.cpp
    description: >-
      C++11 消费者探针：3 个 typedef 语义断言（ino_context/ino_variant 为
      void*、ino_method_cb 回调形态）、6 个 ino_variant_type 枚举值
      （0..5）、26 个公开函数精确签名 decltype 断言（unevaluated 上下文，
      无符号引用）、INO_BEGIN/END_C_DECLS C++ 可用性、运行时枚举循环。
    command: "ctest -R '^test_ino_cpp$'"
  - file: test_ino_c.c
    description: >-
      C11 消费者探针：头文件纯 C 可用性——typedef 语义 _Static_assert、
      声明分隔宏可用、运行时枚举校验。
    command: "ctest -R '^test_ino_c$'"
  - file: check_pkg.sh
    description: >-
      打包布局与纯度（R34/R38）：include/ino-0/ino/lib.h 在位且声明公开
      API、ino-headers-0.pc 版本 0.4.0 与 Cflags -I${includedir}/ino-0
      及 ${pcfiledir} 可迁移前缀（无绝对路径）、头文件包纯度（无 bin/
      无编译产物）。
    command: "check_pkg.sh <package-folder>"
assertion_count: 4
