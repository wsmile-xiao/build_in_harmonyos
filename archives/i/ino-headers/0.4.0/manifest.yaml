# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.0"

# 软件名
software: "ino-headers"

# 编译状态
# published | built | failed | archived
# 真机 conan create 全绿后回填 published
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（NASPRO 官方 SourceForge 发行渠道，naspro.atheme.org 已死）
  url: "https://downloads.sourceforge.net/project/naspro/naspro/0.4.0/ino-headers-0.4.0.tar.bz2"

  # 源码校验和（2026-09-24 本地实测）
  sha256: "a06ea7c03660a140938605cd7571bd886a59a41d31a6e8ee03159546c96e14bf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  # 手装范式（跳过上游 autotools，kicad-demos 10.0.4 先例同款）
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无：手装范式不运行 configure，无 OHOS 兼容性补丁需求）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯头文件包（零编译产物/零可执行文件/零依赖），R38 无需 commands.json"
  - "手装范式（跳过 autotools）：上游 make all/check 均为 no-op，configure 在 OHOS 上无编译任务却引入 mktemp/umask 陷阱（E011 路径），直接拷贝安装对齐已合入 kicad-demos 10.0.4 先例"
  - "头文件安装路径为 include/ino-0/ino/lib.h（上游 inoincludedir），消费者以 <ino/lib.h> 引用；package_info includedirs=include/ino-0 与上游 pc Cflags -I${includedir}/ino-0 对齐"
  - "上游仅发 .pc.in 模板，package() 内生成 ino-headers-0.pc 并采用 ${pcfiledir}/../.. 可迁移前缀，包迁移后 pkg-config 仍可用"
  - "上游无测试套件（tarball 无 test/ 目录、Makefile 无 check 目标），R34 实质校验由双语言消费者探针（C++ 26 函数签名断言 + C11 编译）+ check_pkg.sh 布局校验替代"
