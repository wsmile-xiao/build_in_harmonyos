software: ino-headers
display: "ino-headers"
description: "NASPRO ino 组件公共 C API 头文件（JavaScript 执行引擎绑定接口），纯头文件库"
category: library
homepage: "https://naspro.sourceforge.net/libraries/ino/"
license: ISC
build_system: custom

ohos_adaptation:
  key_points:
    - "纯头文件库（单个 lib.h），无编译无链接，手装范式跳过上游 autotools（kicad-demos 10.0.4 先例同款）"
    - "按上游布局安装 include/ino-0/ino/lib.h，并生成可迁移前缀的 ino-headers-0.pc（等价上游 .pc.in 展开）"
    - "上游 configure 在 OHOS 上会踩 HMDFS umask 077 陷阱（E011 路径），手装范式零补丁绕开"
    - "可见性宏在 OHOS clang 下走 GCC visibility 分支，C++ 下 extern \"C\" 包裹"
  common_dependencies: []

versions:
  "0.4.0":
    status: built
    build_date: "2026-09-24"
