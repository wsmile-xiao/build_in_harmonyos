# 完整消费者用例（平台 rule12：鸿蒙特有测试不能只有断言，必须有真正跑通功能/流程的
# 端到端用例）。consumer_locale.py 按 glibc `localedef` 的真实取数方式把交付的
# locale 定义源消费一遍：
#   I18NPATH/locales 交付路径契约 → 按 POSIX/glibc locale 定义语法解析（12 个 LC_* 类别、
#   copy "..." 类别引用、<Uxxxx> / .. / ..(N).. 区间、(a,b) 映射对、具名 class/map 块）
#   → 重建 LC_CTYPE 的 11 个字符类 + 3 个映射 + 2 个具名类 → 真实查询（字符→类别、
#   类别→定义、码位→大小写）→ 用交付的表处理 201 码位混合语料（逐码位分类、按交付的
#   blank 类切词、按交付的 toupper 映射折叠大小写，产出计数与 sha256 指纹）
#   → 与**上游参考实现**（GNU libc 2.43 的 localedef 编译本文件后由 iswctype()/
#   towupper()/towlower()/towctrans() 探出的规模）及 **Python unicodedata**
#   （与 glibc 完全独立的第二实现）逐项交叉核对
# 实测：89 项检查全部通过；14 个类别计数 + 3 个映射规模与 GNU libc 报出的值
# **逐项相等**（749/760/90342/10/22/22/232622/232607/16/67/142253/90352/669/431,
# 映射 759/749/759）；ASCII 与 Latin-1 段的大小写映射与 Python unicodedata 100% 一致。
consumer_case:
  file: "test_package/consumer_locale.py"
  kind: "end-to-end consumer (I18NPATH contract -> localedef-equivalent parse -> LC_CTYPE class/map rebuild -> real text classification/tokenization/case-folding)"
  reference_implementation: "GNU libc 2.43 localedef --no-archive -i C.UTF-8.in -f UTF-8 + iswctype()/towupper()/towlower()/towctrans()"
  second_implementation: "Python 3 str.upper()/str.lower() (unicodedata tables)"
  classes_rebuilt: 14          # 文件里 13 个（含 combining/combining_level3）+ glibc 合成的 alnum
  named_classes: 2
  maps_rebuilt: 3
  checks_total: 89
  checks_passed: 89
  checks_failed: 0
  documented_gaps:
    - "数据基于 Unicode 3.2（2005 年 glibc 数据）：28 个非 ASCII 大小写对与新版 unicodedata 不同（toupper 731/759、tolower 748/749）"
    - "Unicode 3.2 之后的码位（如 U+1F600）不在任何类别中，消费方需回退"
    - "19 对非互逆映射（Unicode 事实），如 toupper(U+00B5)=U+039C 而 tolower(U+039C)=U+03BC"

