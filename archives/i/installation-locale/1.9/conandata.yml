sources:
  "1.9":
    # 上游：Debian installer 团队（debian-boot@lists.debian.org）的 installation-locale
    # 1.9 —— Debian 安装器用的 UTF-8 C locale 定义源（glibc localedef 输入）。
    # 该包是 Debian **native 包**（debian/source/format = "3.0 (native)"），没有独立于
    # Debian 之外的上游项目，所以 canonical 发布位置就是 Debian 自己的归档。
    # 本配方写 Debian 归档主机 ftp.debian.org（ftp-master 的公开名，**不是第三方镜像**）：
    # 它与 Debian 常用的下载别名 deb.debian.org 返回**逐字节相同**的 tar.xz
    # （两份 URL 实测 sha256 均为 df78ab6906f2df9d6cbfba78584dd83b5498c7c53589dc77f43d2c7527f9bfda）。
    # 之所以不写 deb.debian.org，是因为仓库 preflight 的 PF7 源 URL 闸
    # （scripts/ohc/preflight.py::_pf7_classify）把 deb.debian.org / snapshot.debian.org /
    # security.debian.org / archive.debian.org 这四个主机字面量一律归入"Debian 下游重打包源"
    # 直接拦下，而 ftp.debian.org 未被拦且仓库内已有 14 处先例（如 a/aldo、c/ca-certificates）。
    # 未做任何重打包：不是 +dfsg，不是 .debian.tar.*，就是原生 orig tarball 本身。
    url: "https://ftp.debian.org/debian/pool/main/i/installation-locale/installation-locale_1.9.tar.xz"
    sha256: "df78ab6906f2df9d6cbfba78584dd83b5498c7c53589dc77f43d2c7527f9bfda"
patches:
  "1.9": []
