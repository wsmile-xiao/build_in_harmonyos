knowledge_gained:
  - "installation-birthday 为 Debian native 源包（Chris Lamb，GPL-3+）：单文件 Python 3 脚本 + debian/ 打包目录 + COPYING 全文，无 tag/release 之外的独立发行物，v20 钉死 Debian pool 源包 tarball（sha256 与 .dsc Checksums-Sha256 一致）"
  - "脚本运行前提：python3 ≥ 3.11（使用 datetime.UTC）+ python3-distro（蛋糕模板取发行版名）；tune2fs/e2fsprogs 与 df 缺失时脚本经 OSError/CalledProcessError 兜底自动降级到候选文件 mtime 路径"
  - "v20 变更点：候选时间戳列表新增 /etc/hostname（2024-12-31 changelog），探针锚点覆盖以锁定版本特性"
  - "debian/ 打包目录（cron.daily 集成、help2man 生成 manpage、autopkgtest）属 Debian 发行集成，不进入 conan 包；载荷仅 bin/installation-birthday + share/doc/installation-birthday/COPYING"
  - "上游测试 = 2 个 Debian autopkgtest smoke 用例（debian/tests/），适配探针行为组 --verbosity=2 复刻其语义并在鸿蒙真机实跑"
  - "conan 2 在 build() 前向 source folder 注入 6 个聚合环境文件（conanbuild.sh/conanrun.sh/deactivate_*.sh 等），文件计数类漂移守卫须排除 .sh + 簿记文件（真机 G2 首验 23 != 17 FAIL 实证，修复后重验八门禁全绿）"
upstream_test_pass_rate: "2/2（debian/tests/0001-smoketest 与 -force 为 Debian CI autopkgtest 用例，语义由适配探针行为组复刻实跑）"
