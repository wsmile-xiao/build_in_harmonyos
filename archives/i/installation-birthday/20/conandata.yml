# conandata.yml — installation-birthday 20
# 上游 = Chris Lamb 维护的 Debian native 源包（salsa.debian.org/lamby/
# installation-birthday，GPL-3+，单文件 Python 3 脚本）。v20 = Debian
# sid 版本（2024-12-31，新增 /etc/hostname 候选时间戳）。
# 主源：Debian 官方 pool 源包 tarball，sha256 与 .dsc 的
# Checksums-Sha256 字段一致（本地下载实测核对）。备源：清华 TUNA
# Debian 镜像同文件（同字节同 sha256，设备下载更稳）。上游无 gitcode
# 镜像。salsa gitlab 的 /-/archive/ 是服务端即时打包的 gzip 流（每次
# 请求字节可能不同），不可作 sha256 钉死源，故不用。

sources:
  url:
    - "https://deb.debian.org/debian/pool/main/i/installation-birthday/installation-birthday_20.tar.xz"
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/i/installation-birthday/installation-birthday_20.tar.xz"
  sha256: "e1ed3ef62243db876350b3768baa3f2502e65dd98146603fba4a82a0adfa5621"

patches: []
