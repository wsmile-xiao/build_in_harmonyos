upstream_test_note: "上游 inputlirc 34 不带任何测试（.orig 仅 6 个文件：Makefile / inputlircd.c / gennames / inputlircd.8 / inputlirc.service / .gitignore）。已按四种形态逐一清点并如实记 0，证据见 notes.md §4。测试面全部由 test_package 消费者断言补齐。"

test_package_tests:
  - file: test_inputlirc.sh
    description: "消费者测试：执行打包出的 inputlircd，对 CLI 解析、evdev 发现与 DAC、启动顺序、安装布局逐条钉住退出码与诊断原文（8 条产物断言）；另以同工具链编译的探针做 1 条平台观测，走 [OBSERVE] 前缀与 OBSERVATIONS_* 计数，**不计入下方断言数**"
    command: "bash test_inputlirc.sh <inputlircd> <unix_bind_probe>"
    result: PASS
  - file: unix_bind_probe.c
    description: "平台观测（**不由产物执行、不计入 assertion_count**）：复刻 add_unixsocket() 的文件系统 bind 与抽象命名空间 bind，断言 EPERM/OK 组合；探针缺失即硬失败不静默跳过，平台行为变化会打印 [OBSERVE-DIVERGED]"
    command: "cc unix_bind_probe.c -o unix_bind_probe && ./unix_bind_probe <writable-dir>"
    result: PASS

# W4 r1 判决（P2）：原 C1 的证据对象是平台而非产物（既不执行也不链接 inputlircd），
