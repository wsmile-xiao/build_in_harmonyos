# conandata.yml — inputlirc 34
# Source: Debian official archive .orig tarball (authoritative distro source, R39).
# sha256 computed on-device: curl -L + sha256sum, HTTP 200, 6729 bytes.
sources:
  url: "https://deb.debian.org/debian/pool/main/i/inputlirc/inputlirc_34.orig.tar.gz"
  sha256: "6ff52376c226c7cb49fbe053365eb4931c97a9edfa503ee4ebb689598547270c"

patches:
  - patch_file: "patches/0001-uapi-headers-not-under-usr-include.patch"
    patch_description: "Upstream hardcodes /usr/include for the kernel UAPI headers: a Makefile prerequisite, the gennames argument, and an angle-bracket include of the absolute path. The OHOS sysroot is not at /usr/include, so introduce an overridable KERNELINC and include <linux/input.h> through the compiler's own search path."
    patch_type: "portability"
  - patch_file: "patches/0002-comment-install-sh-overridable.patch"
    patch_description: "Document that INSTALL stays overridable: HarmonyOS images have no coreutils install(1) and toybox cp lacks -m, so the recipe injects a POSIX install-sh shim."
    patch_type: "portability"
  - patch_file: "patches/0003-glob-nomagic-not-a-glibc-extension.patch"
    patch_description: "GLOB_NOMAGIC is a GNU/glibc-only glob(3) extension and is undeclared in the HarmonyOS libc, which breaks the build at inputlircd.c:497. Guard it with a feature-test fallback to 0 (no platform macro): the flag only lets a metacharacter-free device path stand for itself, which glob already does for an existing node."
    patch_type: "portability"
