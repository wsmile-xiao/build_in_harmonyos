knowledge_gained:
  - '上游把内核 UAPI 头写死成 /usr/include 绝对路径（Makefile 前置条件 + #include </usr/include/linux/input.h>），OHOS 的 sysroot 不在 /usr/include，须以可覆盖变量 KERNELINC 交给编译器自己解析'
  - 'OHOS 上 AF_UNIX 文件系统端点 bind() 返回 EPERM：同目录普通文件可建、mkfifo 同样 EPERM、抽象命名空间 bind 成功 ⇒ 拒的是「非常规 inode 创建」，不是 socket 子系统'
  - 'HongMeng 对 setreuid/setregid 直接 SIGSYS(31)，但 setuid/seteuid/setgid/setegid/setresuid/setresgid/daemon/mlock 全部放行 ⇒ 逐 syscall 探针，不可按家族一刀切'
  - '探测 /dev/input 与其下 event 节点：open() 对存在与不存在的节点名一律返回 EACCES(13)（父目录 DAC 拒绝）⇒ 本 uid 下无法据此判断节点存在与否；glob() 因无法列目录而 GLOB_NOMATCH ⇒ open() 与 glob() 两回事，须分别取证，且都不得写成「节点存在/不存在」的结论'
  - 'HarmonyOS 镜像无 coreutils install(1)，且 toybox cp 无 -m ⇒ $(INSTALL) 需 POSIX shim；getpwnam("nobody") 返回 NULL，上游有判空故安全退出 EX_OSERR'

