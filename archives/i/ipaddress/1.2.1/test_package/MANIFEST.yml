# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ipaddress/1.2.1
homepage: "https://github.com/VladimirShaleev/ipaddress"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/ip-address-tests.cpp
    source: ipaddress-1.2.1/tests/ip-address-tests.cpp
    description: "gtest 单测（ip_*_address 通用行为），ctest 注册 863 项全部通过"
    command: "ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实解析 IPv4/IPv6 地址与网络并验证字符串往返"
    command: "./test_ipaddress"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 863
