# test_package 中自带的消费者视角测试
# 链接已安装的 libisal，验证 CRC 已知向量、版本查询与纠删码编解码。
test_package_tests:
  - file: test.c
    description: "消费者程序链接 libisal，验证 CRC/版本/纠删码离线 API"
    command: "./test_isal"
    assertion_count: 6

# 上游 17 + 消费者测试 6
assertion_count: 23
