# test_package/MANIFEST.yml
# 上游官方测试声明文件；详见 docs/TEST_QUALITY_SPEC.md

package: isa-l/2.32.1
homepage: "https://github.com/intel/isa-l"

# 上游测试命令（不执行 CMake project()，直接编译运行上游注册的 17 个 check 程序）
upstream_check_command: "run 17 ctest-registered check programs directly"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "run 17 ctest-registered check programs directly"

# 上游 17 个 automake check 程序（源码审计值，详见 notes.md）：
# erasure_code 4（gf_vect_mul / erasure_code / gf_inverse /
# erasure_code_update）+ raid 4（xor_gen / pq_gen / xor_check /
# pq_check）+ crc 4（crc16_t10dif / crc16_t10dif_copy / crc64_funcs /
# crc32_funcs）+ igzip 3（igzip_rand / igzip_wrapper_hdr /
# checksum32_funcs）+ mem 1（mem_zero_detect）+ misc 1（version）。
# 通过数待真机预检 evidence 回填。
upstream_tests:
  - file: erasure_code/gf_vect_mul_test.c
    source: isa-l-2.32.1/erasure_code/gf_vect_mul_test.c
    description: "erasure coding 有限域向量乘法官方测试"
    command: "./erasure_code/gf_vect_mul_test"
    test_count: 1
  - file: erasure_code/erasure_code_test.c
    source: isa-l-2.32.1/erasure_code/erasure_code_test.c
    description: "erasure code 编解码官方测试"
    command: "./erasure_code/erasure_code_test"
    test_count: 1
  - file: erasure_code/gf_inverse_test.c
    source: isa-l-2.32.1/erasure_code/gf_inverse_test.c
    description: "有限域求逆官方测试"
