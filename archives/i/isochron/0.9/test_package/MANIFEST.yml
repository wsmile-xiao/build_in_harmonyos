# test_package/MANIFEST.yml — isochron 0.9
# CI L0e requires this file to exist.

package: isochron/0.9
homepage: "https://github.com/NXP/isochron"

# 上游测试清点（R51）：上游 Makefile 为内核风格，目标仅 all/isochron/man/clean/
# install*，无 check/test 目标；C=1 为 sparse 静态检查开关（非测试）。
# 静态注册用例总数 N_static = 0，无测试程序资产。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序清单
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：经 conanrun 环境真实运行打包产物 bin/isochron（同时验证打包的 libmnl 动态依赖运行时可解析）：断言 ①无参运行输出含 'isochron usage:' 用法页；②`isochron daemon --help` 输出含 'isochron-daemon usage:'。上游 0.9 的真实约定是 usage 页伴随非零退出码（EINVAL 22 / 255），故断言以输出内容为准"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
