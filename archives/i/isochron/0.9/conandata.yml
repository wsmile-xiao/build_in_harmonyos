# conandata.yml — isochron 0.9

sources:
  url: "https://github.com/NXP/isochron/archive/refs/tags/v0.9.tar.gz"
  sha256: "ab4bf84c4bc221717ce6a0820451f0ebf36d79a5ea2e54c3d561080fca44899c"

patches:
  - patch_file: "patches/0001-musl-pthread-affinity.patch"
    patch_type: portability
    patch_description: "musl libc has no pthread_attr_setaffinity_np(); guard the call with __GLIBC__ and fall back to sched_setaffinity() on the calling thread (the spawned sender thread inherits the affinity)"
    patch_source: "GLM-56"
    strip: 1
  - patch_file: "patches/0002-musl-sysroot-includes.patch"
    patch_type: portability
    patch_description: "OHOS SDK 26 sysroot fixes in src/sk.c: include <time.h> before <linux/errqueue.h> (struct timespec incomplete there) and use <poll.h> instead of <sys/poll.h> (musl redirect warning fired as error by -Werror)"
    patch_source: "GLM-56"
    strip: 1
  - patch_file: "patches/0003-posix-toolchain-deps-probe.patch"
    patch_type: portability
    patch_description: "run the toolchain_deps.sh feature probe through an explicit sh interpreter (the shebang-less script fails to exec on OHOS, silently disabling the HAVE_TX_SWHW probe and causing a SOF_TIMESTAMPING_OPT_TX_SWHW redefinition against the SDK 26 kernel headers)"
    patch_source: "GLM-56"
    strip: 1
