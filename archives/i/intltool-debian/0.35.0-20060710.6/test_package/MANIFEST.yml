# test_package/MANIFEST.yml — intltool-debian 0.35.0-20060710.6
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: intltool-debian/0.35.0-20060710.6
homepage: "https://salsa.debian.org/debian/intltool-debian"

# 上游测试套件：极简 Makefile 的 test 目标 → `prove --verbose t/*.t`，
# 仅 t/syntax.t 一个文件，用 Test::More 对 3 个脚本（intltool-extract/
# intltool-merge/intltool-update）各执行 `perl -wc`（纯语法检查，3 个断言）。
# 实测 3/3（100%）通过。纯语法检查，不涉网络/显示/交互，可用解释器桥运行。
upstream_check_command: "prove --verbose t/*.t"
upstream_test_in_build: true
upstream_test_command: "cd {src} && prove --verbose t/*.t"

# 上游测试程序（本机实测 3/3 = 100%，prove exit=0）
upstream_tests:
  - file: t/syntax.t
    source: intltool-debian-0.35.0+20060710.6/t/syntax.t
    description: "intltool-debian 上游语法测试（Test::More 对 3 个脚本各跑 perl -wc）；解释器桥实测 3/3（100%）"
    command: "cd t && prove --verbose syntax.t"

# test_package 消费者测试（R34 真实执行：bin 工具存在+可执行 + perl -wc +
# 每个工具 --version 真实执行并输出 0.35.0 + 鸿蒙特有 shebang 保持断言）
test_package_tests:
  - file: test_intltool_debian.py
    description: "Verifies bin/intltool-extract/merge/update exist and are executable, pass perl -wc, and each --version actually runs and outputs 0.35.0 (via perl interpreter bridge); [鸿蒙特有] asserts upstream #!/usr/bin/perl shebang preserved (E337 HMDFS adaptation)"
    command: "python3 test_intltool_debian.py"

# 断言总数：通用功能断言 9（3 工具 × [存在+可执行 + perl -wc + --version 真实执行]）
#          + 鸿蒙特有断言 3（3 工具 × [shebang 保持 #!/usr/bin/perl]）= 12
assertion_count: 12
# 其中鸿蒙特有断言数（E337 解释器桥 shebang 保持，rule12 适配后鸿蒙特有测试 ≥1）
harmonyos_specific_assertions: 3
