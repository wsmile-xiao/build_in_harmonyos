# 版本级 manifest — intltool-debian 0.35.0-20060710.6
# 遵循 ARCHIVE-SPEC v2.0

version: "0.35.0-20060710.6"
software: "intltool-debian"

# 编译状态: built（真机验证通过未 upload；由 HMBS 门禁后统一更新）
status: built

build_date: "2026-10-01"

# 构建系统（必填顶层字段）— 极简 Makefile（无 autotools/cmake/configure）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://deb.debian.org/debian/pool/main/i/intltool-debian/intltool-debian_0.35.0+20060710.6.tar.xz"
  sha256: "4c0451189af0843dc72a00d730a8d37cef3b9744705d62605c3da43f54fe8709"
  tar_format: tar.xz
  # 上游 Debian 官方版本串为 "0.35.0+20060710.6"（'+' 非合法 conan 版本），
  # 本配方/归档版本号用 '-' 映射（见 conandata.yml 注释）。

# ============================================================
# 构建配置
# ============================================================

build:
  # 极简 Makefile 的纯 Perl 脚本工具集（无原生编译）
  system: makefile

  # 无 configure；make all 仅 chmod 脚本，make test 跑 prove t/*.t
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.2.3       # 运行时解释器
    - gettext/0.22.5.1    # 运行时工具链（xgettext/msgmerge/msgfmt）

  # 编译器
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: official
  total: 3
  passed: 3
  failed: 0
  note: |
    上游测试：极简 Makefile 的 test 目标 → `prove --verbose t/*.t`，仅
    t/syntax.t 一个文件，用 Test::More 对 3 个脚本（intltool-extract/
    intltool-merge/intltool-update）各执行 `perl -wc`（纯语法检查，
    3 个断言）。真机实测 **3/3（100%）**——prove exit=0，全部通过。
    运行方式：perl 解释器桥（HMDFS 仅拒 shebang 直接执行，解释器调用
    可正常运行——同 intltool 0.51.0 E337 结论）。
    适配后：test_package R34 真实执行 bin 工具（存在+可执行+perl -wc+
    --version 报告 0.35.0，9/9 = 100%）。

# ============================================================
# 分发布局（与上游 Debian 的差异说明）
# ============================================================

packaging:
  note: |
    上游 Makefile install 装到 share/intltool-debian（Debian debconf 专用
    布局）。脚本自包含、无同目录依赖，本配方按 Conan 工具型约定（R38）装到
    bin/，便于作为通用 i18n 工具经 PATH 调用。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "intltool-debian 是 Debian 用 salsa.debian.org/debian/intltool-debian 维护的 intltool fork（RFC822/Debconf 模板 i18n），与 intltool/0.51.0 是不同代码库、不同版本串"
  - "上游版本串 0.35.0+20060710.6 的 '+' 非合法 conan 版本字符，配方版本号映射为 0.35.0-20060710.6"
  - "构建系统为极简 Makefile（非 autotools/cmake）：all 仅 chmod，无 configure，无 XML::Parser 依赖（区别于 intltool 0.51.0，后者需 configure 补丁跳 XML::Parser 检查）"
  - "3 个脚本自包含（仅依赖 perl 核心模块 strict/Getopt::Long/Cwd/File::Copy/File::Basename/File::Find），可独立装 bin/；运行时需 gettext 工具（xgettext/msgmerge/msgfmt），脚本支持 XGETTEXT/MSGMERGE/MSGFMT 环境变量覆盖默认 /usr/bin/ 路径"
  - "上游测试 practice：prove --verbose t/*.t（t/syntax.t 对 3 脚本各 perl -wc），真实 3/3（100%）；HMDFS 仅拒 shebang 直执行，perl 解释器桥可运行（E337 结论）"