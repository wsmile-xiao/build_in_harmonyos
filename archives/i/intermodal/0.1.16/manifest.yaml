# 版本级 manifest — intermodal 0.1.16

version: "0.1.16"
software: "intermodal"

# 编译状态
# built：本地 OHOS aarch64 构建+测试通过；未上传发布。
# Rust 工具链由制品仓基础设施包 rust-toolchain/1.97.1 提供（tool_requires），
# 不依赖系统 cargo、不使用 rustup 引导（rustup 无法识别 HarmonyOS 宿主）。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "cargo"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://github.com/casey/intermodal/archive/refs/tags/v0.1.16.tar.gz"

  # 源码校验和（实测 sha256）
  sha256: "3a072929379ddba929d85a579888ac51cf22e44897b7dc84af7612f49d3874d7"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（Rust cargo）
  system: custom

  # 配置选项列表（cargo 无 configure 选项）
  configure_options: []

  # 编译依赖列表（格式: name/version）——intermodal 为纯 Rust 依赖集
  # （无 OpenSSL/libgit2 等 C 依赖），无 conan 依赖
  dependencies: []

  # 构建期工具依赖（tool_requires）
  build_tools:
    - "rust-toolchain/1.97.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "intermodal（imdl）为纯 Rust CLI（crates.io 依赖无 C 绑定），无需 libelf/zlib 等 conan 依赖；cargo build --target aarch64-unknown-linux-ohos 原生编译即得 OHOS 可执行产物"
  - "Rust CLI 适配复用 below/0.11.0 模式：rust-toolchain/1.97.1 tool_requires + 工具链二进制自签名 + rsproxy.cn sparse 镜像 + 设备 CA bundle 注入"
  - "imdl 功能闭环极佳（torrent create/info/verify/link 全链路可在无网络环境验证），test_package 以真实 .torrent 工作流替代纯 --help 冒烟"
