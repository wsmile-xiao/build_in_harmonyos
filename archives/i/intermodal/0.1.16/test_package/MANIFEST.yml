# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51：上游测试三步法申报）

package: intermodal/0.1.16
homepage: "https://github.com/casey/intermodal"

# 上游测试命令（cargo 项目，无 make check / ctest / meson test）
upstream_check_command: "cargo test -p imdl --lib --bins"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cargo test --release --target aarch64-unknown-linux-ohos -p imdl --lib --bins --no-fail-fast"

# 上游实际运行的测试程序（cargo 单元测试，静态统计 src/ 下 285 个 #[test]
# 函数；--lib 目标实际执行 282 个（lib 内 284 个测试宏展开，2 个 ignored
# 不计入 passed/failed）+ main.rs bins 0 个）
upstream_tests:
  - file: "src/*.rs（test_env.rs / metainfo.rs / subcommand/torrent/*.rs 等 52 个含 #[cfg(test)] 模块）"
    source: "intermodal-0.1.16/src/"
    description: "上游单元测试（280 通过 / 2 失败 / 2 忽略，通过率 280/282=99.3%；2 个失败均为 HMDFS 不支持创建 symlink 的环境限制，见 notes.md）"
    command: "cargo test --release --target aarch64-unknown-linux-ohos -p imdl --lib --bins --no-fail-fast"

# doctest 排除说明：cargo test 的 doctest target 由 rustdoc 执行，
# rust-toolchain/1.97.1 dist 包的 rustdoc 未携带 OHOS code signature，
# execve 报 EACCES（errno 13）；README/doc 示例不属于单元测试契约，
# 故测试命令限定 --lib --bins 并在此如实申报。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_imdl.py
    description: "消费者冒烟测试 3 项：--help / 帮助含 torrent 子命令 / --version 报 0.1.16"
    command: "python3 test_imdl.py"

# 鸿蒙特有测试 (HarmonyOS-specific)：断言产物在本平台可用所必需的特性
# B1 ELF machine = AArch64；B2 PT_INTERP = OHOS musl loader（证明是 OHOS
# bionic/musl 二进制而非 glibc Linux）；B3 含 OHOS code signature（未签名
# ELF 在 HarmonyOS 上无法 execve，EACCES errno 13，正是配方 _sign_binaries()
# 修复的失败点）；B4 非空可执行文件
harmonyos_specific_tests:
  - file: test_imdl.py
    description: "鸿蒙特有测试 4 项（AArch64 / musl 解释器 / code signature / 产物完整性）"
    command: "PACKAGE_FOLDER=<pkg> python3 test_imdl.py"
    assertion_count: 4

# 功能测试 (functional)：imdl 是 BitTorrent 元信息 CLI，可在无网络环境
# 完成真实功能闭环——对真实数据文件执行 create（--announce）→ 校验 bencode
# 结构（顶层 dict / announce+info 键 / 文件名）→ show 渲染元信息 →
# verify 重哈希 → link 产出 40-hex infohash magnet。
functional_tests:
  - file: test_imdl.py
    description: "功能测试 8 项（torrent create / bencode 结构断言 / show / verify / link 全链路）"
    command: "PACKAGE_FOLDER=<pkg> conan test ...（自动执行）"
    assertion_count: 8

# 测试断言总数 (近似值, 用于质量评估)
# 上游 cargo 测试 284 宏（280 通过 / 2 symlink 环境限制失败 / 2 忽略）
# + test_package 消费者冒烟 3 + 鸿蒙特有测试 4 + 功能测试 8
assertion_count: 299
