# test_package/MANIFEST.yml
# 上游官方测试声明文件
# intel-hdcp 21.2.0 上游测试：官方 release intel-HDCP-21.2.0 源码树无 tests/ 目录、
# 无 ctest/pytest 注册、无 make check 目标（R51 清点证据见 notes.md 与 W3 台账）。

package: intel-hdcp/21.2.0
homepage: "https://github.com/intel/hdcp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (官方 release 无独立测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 调用已安装 libhdcpsdk API)
test_package_tests:
  - file: example.cpp
    description: "消费者测试 — 链接已安装 libhdcpsdk，调用 HDCPCreate(NULL,...) 与 HDCPGetStatus(...,NULL) 验证参数校验路径返回 HDCP_STATUS_ERROR_INVALID_PARAMETER（无需 daemon 的确定性 API/ABI 验证）"
    command: "./example"

# 上游测试断言总数 (上游零入口；test_package 实际断言 2)
assertion_count: 2