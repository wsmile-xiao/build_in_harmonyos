# conandata.yml — intel-hdcp 21.2.0
# 官方 release intel-HDCP-21.2.0（tag tarball，upstream_release_name 不改写）
# 来源 URL 为官方 GitHub 源（PF7 合规）

sources:
  url:
    - "https://gh-proxy.com/https://github.com/intel/hdcp/archive/refs/tags/intel-HDCP-21.2.0.tar.gz"
    - "https://github.com/intel/hdcp/archive/refs/tags/intel-HDCP-21.2.0.tar.gz"
  sha256: "243e7548745f1dd9b3e092152a3a60bb3a903d8c08254cb307d6be3c2c0858b8"

patches:
  - patch_file: "patches/0001-optional-daemon.patch"
    patch_description: "CMakeLists: gate the hdcpd daemon build behind HDCP_BUILD_DAEMON. The daemon requires Wayland/EGL client headers (wayland-client.h/wayland-egl.h) and a systemd service unit which are not available on HarmonyOS; the SDK library (libhdcpsdk.so) is the deliverable"
    patch_type: "portability"
  - patch_file: "patches/0002-remove-gcc-only-flag.patch"
    patch_description: "CMakeLists: drop -foptimize-strlen from HDCP_COMMON_COMPILE_FLAGS. The flag is GCC-only; clang-15 rejects it with 'unknown argument', failing the build. Removing it is a no-op for clang (which applies the strlen optimization by default at -O2)"
    patch_type: "portability"
  - patch_file: "patches/0003-sys-un-header.patch"
    patch_description: "common/: include <sys/un.h> instead of <linux/un.h>. On the OHOS sysroot <linux/un.h> pulls in <linux/socket.h> which redefines sockaddr_storage already defined by <sys/socket.h>, a hard compile error; the code only uses struct sockaddr_un (sun_family/sun_path), which <sys/un.h> provides"
    patch_type: "portability"