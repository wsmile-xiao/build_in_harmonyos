type: test_package
name: isoimagewriter
version: "26.04.0"

# 上游测试清点（R51 三步法，第 1 步）
# 证据：isoimagewriter-26.04.0.tar.xz 解包后
#   find . -iname "*test*"            -> 0 个结果
#   grep -rn "enable_testing|add_test|add_subdirectory(autotests)" CMakeLists.txt isoimagewriter/CMakeLists.txt
#                                     -> 仅 find_package(Qt6 ... Test) 一项，
#                                        无 enable_testing()/add_test() 注册
#   ls autotests/  -> 不存在
# 结论：上游确无测试用例（N=0），故第 2 步"实际运行上游测试"不适用（0/0），
#      第 3 步按 R51 补增鸿蒙特有测试（test_package，见下）。
# 实际执行的清点命令（上游无 CTest 注册，故未使用 ctest -N）：
upstream_check_command: "find . -iname '*test*'; grep -rn 'enable_testing|add_test' CMakeLists.txt isoimagewriter/CMakeLists.txt; ls autotests/"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，鸿蒙特有测试）
# 注：实际执行逻辑在 conanfile.py 的 test()（9 断言）；test_app.sh 是同语义的
#     手工复现脚本（记录 --version / --help 两次真实调用），供设备端手动验证。
test_package_tests:
  - file: test_app.sh
    description: >-
      手工复现脚本：执行包内 bin/isoimagewriter --version 与应用启动校验
      （构造 QApplication → 加载 offscreen QPA 插件 → 解析全部 Qt6/KF6 动态链接
      闭包），以及 --help 校验上游命令行接口（--version/--lang/--dir）。
      conanfile.py 的 test() 在此基础上另断言产物内嵌 26.04.0 版本串，以及补丁
      生效后安装的 share/applications/org.kde.isoimagewriter.desktop 与
      share/icons/hicolor/scalable/apps/org.kde.isoimagewriter.svg 存在，
      并修复 E537 形态的 DT_NEEDED（相对路径 / 陈旧绝对路径）。
    command: "./test_app.sh <pkg>/bin/isoimagewriter"

# 测试断言总数（conanfile.py test() 中的显式检查项：依赖存在/产物存在/2 个安装
# 文件/--version 输出/内嵌版本字符串/--help 三个选项）
assertion_count: 9
