knowledge_gained:
  - "OHOS Conan sets CMAKE_SYSTEM_NAME=HarmonyOS; upstream projects that dispatch on CMAKE_SYSTEM_NAME with only Windows/Linux/FreeBSD branches silently drop their POSIX sources and fail at link time. Adding HarmonyOS to the Linux branch is enough (no platform macro needed)."
  - "Gpgmepp/QGpgmeQt6 are optional in isoimagewriter (find_package without REQUIRED); the published gpgmepp 1.23.2 has the Qt6 binding disabled, so upstream's non-GPG variant (_USE_GPG undefined) builds without any extra dependency."
  - "The plain qtbase/6.11.1 variant is built with FEATURE_dbus=OFF; packages requiring Qt6::DBus must use qtbase-sql-dbus/6.11.1."
  - "Qt6 defines Q_OS_LINUX on OHOS (__linux__ is part of the aarch64-linux-ohos triple), so upstream Q_OS_* platform guards do not need patching even though CMAKE_SYSTEM_NAME is HarmonyOS."
  - "KDE/ECM apps need KF_SKIP_PO_PROCESSING=ON (ki18n_install(po) needs msgfmt) and KF_IGNORE_PLATFORM_CHECK=TRUE."

