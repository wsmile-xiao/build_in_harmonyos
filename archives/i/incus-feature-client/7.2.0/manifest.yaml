# manifest.yaml — incus-feature-client 7.2.0 (HarmonyOS PC)
version: "7.2.0"
software: "incus-feature-client"
status: "built"
build_date: "2026-10-10"
arch:
  - "armv8"
build_system:
  - "conan2"
  - "go1.25.10"
toolchain:
  go: "1.25.10"
  cgo: false
source:
  upstream: "https://github.com/lxc/incus"
  tag: "v7.2.0"
  url: "https://codeload.github.com/lxc/incus/tar.gz/refs/tags/v7.2.0"
  sha256: "03c48d5fbd097c5e4ae16e96efa768a5f147b86adada7a824f15af017b075bf0"
  license: "Apache-2.0"
  subpackage_of: "incus-feature"
build:
  entry: "go build -trimpath -o bin/incus ./cmd/incus"
  output_binary: "incus"
  env:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOTOOLCHAIN=local"
patches_applied: []
dependencies: []
knowledge_gained:
  - "incus-feature-client 是 Alpine 源包 incus-feature 的二进制子包（client() 函数：amove usr/bin/incus），即 Incus CLI 客户端；上游源码 = github.com/lxc/incus tag v7.2.0（Go module github.com/lxc/incus/v7，go 1.25.10）。"
  - "客户端 /usr/bin/incus 为纯 Go：cmd/incus 的 import 闭包无 import \"C\"，不引用 go-sqlite3/go-lxc/go-cowsql/go-udev；internal/i18n 有 //go:build !linux || !cgo 回退；故 CGO_ENABLED=0 直接交叉编译（与既有 archives/i/incus 7.1.0 先例一致）。"
  - "服务端 incusd 需 CGO + liblxc/cowsql/libsqlite3/libudev/sys/acl.h，OHOS 上不可用；本任务只适配客户端子包，不涉及服务端。"
  - "OHOS HMDFS 限制：Go 链接器 mmap 输出文件失败（link: mapping output file failed: permission denied），链接产物与 GOTMPDIR/GOCACHE/GOMODCACHE 必须落在 ext2 风格可写分区 /data/storage/el2/base/haps/entry/files。"
  - "OHOS 拒绝执行未签名 ELF：最终二进制与 go test 编译出的测试二进制都必须用 binary-sign-tool 补 .codesign 段（后者经 go test -exec 包装器签名）。"
  - "Go 纯解析器（CGO_ENABLED=0 下 netdns=cgo 不可用）在本环境无法解析域名（resolv.conf 的 114.114.114.114/8.8.8.8 直连超时），需提供可达的 GOPROXY（配方默认 https://goproxy.cn,direct，可经环境变量 GOPROXY 覆盖）。"
  - "go.mod 声明 go 1.25.10，本地 GOTOOLCHAIN=local 工具链须 ≥ 1.25.10；配方自举 go1.25.10（官方 URL + sha256），不依赖宿主机预装 Go。"
  - "上游测试在客户端 import 闭包内实测 12 个包 / 248 用例全通过（含 cmd/incus 28 例）；服务端包因 CGO 依赖不在客户端任务范围。"
