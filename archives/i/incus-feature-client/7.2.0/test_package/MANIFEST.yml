# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: incus-feature-client/7.2.0
homepage: "https://github.com/lxc/incus"

# 上游测试命令：Alpine aports community/incus-feature/APKBUILD 的 check() 执行
#   go test -v -skip '<server-only tests>' ./...
# incus-feature-client 只产出 /usr/bin/incus（客户端），因此本适配在 ./cmd/incus
# 的 import 闭包内执行全部可编译的 *_test.go（服务端 cmd/incusd、internal/server/*
# 需要 CGO + liblxc/cowsql/go-sqlite3，CGO_ENABLED=0 下不可编译，故不在客户端任务范围）。
upstream_check_command: "go test -list '.*' ./cmd/incus/..."
upstream_test_command: "go test -v -count=1 -exec=<sign-wrapper> <each closure package>"

# conanfile.py build() 方法中是否已集成上游测试
# incus-feature-client 7.2.0 的 build() 末尾调用 _run_upstream_tests()，动态枚举
# ./cmd/incus 的 import 闭包中带测试的 incus 包，逐包真实执行 go test -v，产出
# HMBS_UPSTREAM_TEST_RESULT 证据（discovered/executed/passed/failed/skipped + 逐条用例名）。
upstream_test_in_build: true

# 上游实际运行的测试包（./cmd/incus import 闭包内、主模块中带 *_test.go 的 12 个包）
upstream_tests:
  - name: "github.com/lxc/incus/v7/cmd/incus"
    file: "cmd/incus/{image,list,main,utils,utils_properties}_test.go"
    cases: 28
  - name: "github.com/lxc/incus/v7/shared/api"
    file: "shared/api/{config,devices,url}_test.go"
    cases: 80
  - name: "github.com/lxc/incus/v7/shared/osarch"
    file: "shared/osarch/{release,tempfile}_test.go"
    cases: 6
  - name: "github.com/lxc/incus/v7/shared/subprocess"
    file: "shared/subprocess/bgpm_test.go"
    cases: 3
  - name: "github.com/lxc/incus/v7/shared/tls"
    file: "shared/tls/{acme,cert,tls}_test.go"
    cases: 15
  - name: "github.com/lxc/incus/v7/shared/revert"
    file: "shared/revert/revert_test.go"
    cases: 1
  - name: "github.com/lxc/incus/v7/shared/cmd"
    file: "shared/cmd/sort_test.go"
    cases: 4
  - name: "github.com/lxc/incus/v7/internal/filter"
    file: "internal/filter/{clause,match,value}_test.go"
    cases: 33
  - name: "github.com/lxc/incus/v7/shared/scriptlet"
    file: "shared/scriptlet/marshal_test.go"
    cases: 32
  - name: "github.com/lxc/incus/v7/shared/validate"
    file: "shared/validate/validate_test.go"
    cases: 5
  - name: "github.com/lxc/incus/v7/internal/util"
    file: "internal/util/network_test.go"
    cases: 30
  - name: "github.com/lxc/incus/v7/internal/version"
    file: "internal/version/version_test.go"
    cases: 11

# ── 上游测试审计（upstream_tests_exist=true）──
upstream_tests_exist: true
upstream_test_audit:
  - source: "incus v7.2.0 source tree (`find . -name '*_test.go'` → 122 files)"
    reason: "全仓 122 个 *_test.go；其中服务端/工具类包（cmd/incusd、internal/server/*、cmd/lxc-to-incus、cmd/generate-*）需 CGO + liblxc/cowsql/go-sqlite3，在 OHOS CGO_ENABLED=0 下不可编译。"
  - source: "Alpine aports community/incus-feature/APKBUILD check()"
    reason: "check(){ go test -v -skip '<server-only tests>' ./... } —— 上游真实测试入口。"
  - source: "./cmd/incus import closure (`go list -deps ./cmd/incus`)"
    reason: "客户端子包 /usr/bin/incus 的可编译测试集 = 闭包内 12 个 incus 包。"
  - conclusion: "上游提供自动化测试入口（go test ./...），本适配在客户端闭包内实测执行全部可用用例。"

# 上游实际执行的用例数 = 248（=== RUN 计；45 个顶层测试函数 + 203 个子用例），全通过，0 跳过
upstream_test_count: 248
upstream_test_executed:
  discovered: 248
  executed: 248
  passed: 248
  failed: 0
  skipped: 0

# ── 上游测试修改说明 ──
upstream_test_modifications: []
# 说明：客户端 ./cmd/incus 闭环为纯 Go，CGO_ENABLED=0 直接交叉编译，
# 本次适配未修改任何上游源码或测试文件（patches: []）。

# ── 鸿蒙特有测试 ──
# 计数口径（唯一）：test_package/test_incus.sh 中显式标注 [HarmonyOS] 的断言数（case 6、case 7）。
# 与 test_package/conanfile.py 的 ohos_specific_cases、reports/test-report.md、HMBS_TEST_PACKAGE_RESULT 一致（均为 2）。
ohos_specific_test_count: 2
ohos_specific_tests:
  - name: "[HarmonyOS] 产物 ELF 目标架构为 aarch64（case 6）"
    reason: "OHOS PC 目标平台为 armv8/aarch64，校验产物架构与目标一致。"
  - name: "[HarmonyOS] 产物 ELF 含 .codesign 段（case 7）"
    reason: "HarmonyOS 内核执行 ELF 的前置要求（binary-sign-tool -selfSign）。"
ohos_specific_note: >-
  case 1-5 为通用 CLI 冒烟断言，但均在 HarmonyOS 上真实执行产物二进制（未签名 ELF 会被 OHOS 内核
  拒绝执行）；其通过同时构成对 OHOS 适配链路（CGO_ENABLED=0 交叉编译 + ELF 签名）的验证，
  但不计入“鸿蒙特有”计数，以保持与显式 [HarmonyOS] 标注口径一致。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_incus.sh
    description: "冒烟测试: incus --version 断言 7.2 系列 + incus --help 校验 list/remote 子命令 + [鸿蒙] aarch64 架构 + [鸿蒙] .codesign 签名"
    command: "bash test_incus.sh <bin/incus> <expect-ohos>"

# test_incus.sh 中的断言数:
#   1. `incus --version` 退出码为 0
#   2. `incus --version` 输出匹配 ^7.2
#   3. `incus --help` 退出码为 0（含 "Command line client for Incus"）
#   4. `--help` 输出列出 `list` 子命令
#   5. `--help` 输出列出 `remote` 子命令
#   6. [鸿蒙特有] 产物 ELF 目标架构为 aarch64
#   7. [鸿蒙特有] 产物 ELF 含 `.codesign` 段（HarmonyOS 执行前置要求）
assertion_count: 7
