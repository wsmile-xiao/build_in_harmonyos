# 软件级 manifest — incus-feature-client
software: incus-feature-client
display: "Incus CLI client"
description: "Incus 系统容器/虚拟机管理器的命令行客户端（Alpine incus-feature 源包的 client 子包，产物 /usr/bin/incus）"
category: system
homepage: "https://github.com/lxc/incus"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 静态编译（CGO_ENABLED=0，GOOS=linux，GOARCH=arm64），无需任何第三方 C/C++ 库"
    - "Go 工具链自引导下载（go1.25.10，官方 URL + sha256），不依赖宿主机预装 Go"
    - "Go linker mmap 在 HMDFS 上 permission denied，链接输出与 GOTMPDIR/GOCACHE/GOMODCACHE 放在 ext2 可写分区（/data/storage/el2/base/haps/entry/files）"
    - "OHOS 上每个被 fork/exec 的 ELF 必须用 binary-sign-tool 自签名（含 .codesign section），最终二进制与 go test 测试二进制同样需要"
    - "仅构建客户端 ./cmd/incus；服务端 incusd 需 CGO + liblxc/cowsql/libsqlite3，OHOS 不可用，不在本子包范围"
  common_dependencies: []

versions:
  "7.2.0":
    status: built
    build_date: "2026-10-10"
    conan_ref: "incus-feature-client/7.2.0"
