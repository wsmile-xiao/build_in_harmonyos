software: imx_uart_loader
display: "imx_uart_loader"
description: "NXP i.MX5/6/7/8 系列串口(UART)引导加载工具（Qt 无关，纯 C 命令行工具）"
category: embedded
homepage: "https://github.com/boundarydevices/imx_usb_loader"
license: LGPL-2.1-only
build_system: make

ohos_adaptation:
  key_points:
    - "编译器取自 tools.build:compiler_executables（R33），不使用裸环境变量 $CC"
    - "libusb 由命令行 USBCFLAGS/USBLDFLAGS 显式传入，绕开上游 Makefile 的 pkg-config 依赖"
    - "为 imx_usb 显式加入 DT_RUNPATH 指向 libusb 包 lib/，避免裸 CLI 工具运行时找不到动态库"
    - "测试脚本用 CONFIG_SHELL 执行（R5），OHOS 不保证 /bin/sh 可用于复杂脚本"
    - "TMPDIR 落在构建目录内，OHOS /tmp 是只读 erofs 挂载"
  common_dependencies:
    - "libusb/1.0.27"

versions:
  "0_git20201102":
    status: built
