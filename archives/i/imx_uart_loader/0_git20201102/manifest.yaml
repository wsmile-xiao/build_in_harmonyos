knowledge_gained:
  - "The version string 0_git20201102 is Alpine's pkgver for the imx_loader source package; it pins upstream commit 30b43d69770cd69e84c045dc9dcabb1f3e9d975a, so the recipe takes the upstream GitHub tarball for that commit rather than any distribution repack."
  - "imx_uart and imx_usb are two different binaries from one Makefile: imx_uart omits imx_sdp_simulation.o and is linked WITHOUT $(USBLDFLAGS), so the packaged UART tool has no libusb runtime dependency at all (confirmed on the built artifact: its only DT_NEEDED entry is libc.so)."
  - "The upstream tests/ harness drives imx_usb (not imx_uart) through the built-in SDP simulation, comparing against golden .output files; it therefore needs libusb even though the packaged binary does not."
  - "IMX_USB must be passed as a RELATIVE path (../imx_usb, upstream's default). The harness echoes the config-file paths imx_usb derives from argv[0] into the output it diffs, so an absolute path fails the golden diff on path strings alone with every protocol byte still matching."
  - "Bare imx_uart with no arguments HANGS on OHOS aarch64 (no output, never exits) - an upstream defect. Any harness driving this binary must wrap it in timeout."
  - "imx_uart -V prints 'imx_usb 0.2pre': upstream shares IMX_LOADER_VERSION between the two programs."
