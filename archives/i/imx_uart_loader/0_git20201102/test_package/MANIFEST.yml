# test_package/MANIFEST.yml
# 上游官方测试声明文件
# imx_uart_loader 0_git20201102 上游测试：tests/Makefile 定义 3 个用例，通过内建 SDP 模拟
# （imx_usb -v -S 0x15a2:0x0061 <image>）驱动，并与签入的 golden .output 逐字节比对。
# 该套件已并入 conanfile build()，在 Harmony PC 真机上执行。

package: imx_uart_loader/0_git20201102
homepage: "https://github.com/boundarydevices/imx_usb_loader"

# 上游测试命令（tests/Makefile: tests: test.imx.test test-dcd.imx.test test-plugin.imx.test）
upstream_check_command: "make -C tests tests IMX_USB=../imx_usb"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C tests tests IMX_USB=../imx_usb"

# 上游实际运行的测试用例（tests/Makefile 的 3 个 %.test 目标）
# 注意：套件驱动的是 imx_usb 二进制；本配方打包的是 imx_uart。
# 两者共用 imx_sdp.c / sdp.c / imx_loader_config.c，但 imx_uart.c 自身无上游测试覆盖。
upstream_tests:
  - file: tests/test.imx
    source: imx_usb_loader-30b43d69770cd69e84c045dc9dcabb1f3e9d975a/tests/
    count: 1
    count_unit: cases
    description: "test.imx.test — 无 plugin 的 IMX 镜像，比对 golden tests/test.imx.output"
    command: "make -C tests test.imx.test IMX_USB=../imx_usb"
  - file: tests/test-dcd.imx
    source: imx_usb_loader-30b43d69770cd69e84c045dc9dcabb1f3e9d975a/tests/
    count: 1
    count_unit: cases
    description: "test-dcd.imx.test — 带 DCD 的 IMX 镜像，比对 golden tests/test-dcd.imx.output"
    command: "make -C tests test-dcd.imx.test IMX_USB=../imx_usb"
  - file: tests/test-plugin.imx
    source: imx_usb_loader-30b43d69770cd69e84c045dc9dcabb1f3e9d975a/tests/
    count: 1
    count_unit: cases
    description: "test-plugin.imx.test — 带 plugin 的 IMX 镜像，比对 golden tests/test-plugin.imx.output"
    command: "make -C tests test-plugin.imx.test IMX_USB=../imx_usb"

# test_package 中自带的测试（消费者视角验证，调用已安装二进制）
test_package_tests:
  - file: test_imx_uart.sh
    count: 4
    count_unit: cases
    description: >-
      消费者测试 — 调用已安装的 bin/imx_uart，验证 -h / --help / -V 与非法选项；
      全部以 timeout 包裹，因为裸 imx_uart 无参数在本平台会挂起。
    command: "sh test_imx_uart.sh <install>/bin/imx_uart"

# 上游测试断言总数（= 3 个用例；每个用例以 diff -u 与 golden 输出整体比对）
assertion_count: 3
