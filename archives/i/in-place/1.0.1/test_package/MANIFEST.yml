package: in-place/1.0.1
homepage: "https://github.com/jwodder/inplace"

upstream_check_command: "pytest -q test/"
upstream_test_in_build: false
upstream_test_command: "pytest -q test/ (run separately against the fixed source distribution)"

upstream_tests:
  - file: test/test_encoding.py
    source: in_place-1.0.1/test/test_encoding.py
    description: "Text encoding behavior"
    command: "pytest -q test/test_encoding.py"
  - file: test/test_errors.py
    source: in_place-1.0.1/test/test_errors.py
    description: "Error handling"
    command: "pytest -q test/test_errors.py"
  - file: test/test_general.py
    source: in_place-1.0.1/test/test_general.py
    description: "General in-place processing behavior"
    command: "pytest -q test/test_general.py"
  - file: test/test_in_place_util.py
    source: in_place-1.0.1/test/test_in_place_util.py
    description: "Shared upstream test helpers"
    command: "Consumed by the other upstream test modules"
  - file: test/test_io_methods.py
    source: in_place-1.0.1/test/test_io_methods.py
    description: "File-like I/O methods"
    command: "pytest -q test/test_io_methods.py"
  - file: test/test_nonstr_path.py
    source: in_place-1.0.1/test/test_nonstr_path.py
    description: "Path-like and bytes path behavior"
    command: "pytest -q test/test_nonstr_path.py"
  - file: test/test_symlinks.py
    source: in_place-1.0.1/test/test_symlinks.py
    description: "Symbolic link behavior"
    command: "pytest -q test/test_symlinks.py"

test_package_tests:
  - file: consumer.py
    description: "Imports the Conan-provided module and rewrites a temporary file in place"
    command: "python3 consumer.py"

assertion_count: 1
