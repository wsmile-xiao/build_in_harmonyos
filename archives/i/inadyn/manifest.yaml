software: inadyn
# 软件级 manifest
# 文件位置: archives/i/inadyn/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: inadyn

# 软件类别
# network-tools | system-tools | development-tools | libraries | utilities
category: network-tools

# 软件描述（一句话）
description: "轻量级动态DNS客户端，支持多个DNS服务提供商"

# ============================================================
# 版本索引（自动维护）
# ============================================================

# 已编译版本列表
versions:
  - version: "2.12.0-r0"
    status: built
    build_date: "2026-05-21"
    notes: 静态编译版本，解决OpenHarmony动态链接器RUNPATH限制

# 最新版本（由finish脚本自动更新）
latest_version: "2.12.0-r0"
latest_status: built

# ============================================================
# 源码信息
# ============================================================

# 官方仓库URL
repository: "https://github.com/troglobit/inadyn"

# 主分支
main_branch: main

# ============================================================
# 依赖关系
# ============================================================

# 构建依赖（编译时必需）
build_dependencies:
  - "libconfuse/3.3"
  - "openssl/1.1.1w"

# 运行依赖（运行时必需）
# 静态编译版本无运行时依赖
runtime_dependencies: []

# ============================================================
# 编译特性
# ============================================================

# 是否支持静态编译
static_build_supported: true

# 是否支持交叉编译
cross_compile_supported: false

# 平台特性记录
platform_notes:
  - "OpenHarmony musl libc不完全支持RUNPATH，必须静态编译"
  - "HMDFS umask 077创建的临时目录权限过严，需使用umask 022"
  - "libtool -static标志可能不生效，需手动链接静态二进制"