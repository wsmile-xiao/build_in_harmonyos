software: inadyn
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.12.0-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.12.0-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/inadyn-2.12.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型
build_system: autotools

# 配置选项列表
configure_options:
  - "--enable-openssl"
  - "--disable-shared"
  - "LDFLAGS=-static"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libconfuse/3.3"
    - "openssl/1.1.1w"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "OpenHarmony musl libc 不完全支持 RUNPATH，必须静态编译"
    - "HMDFS umask 077 创建的临时目录权限过严，需使用 umask 022"
    - "libtool -static 标志可能不生效，需手动链接静态二进制"
    - "静态编译需删除依赖库动态库文件，修改 .la 文件"
    - "手动链接：clang -static + 所有对象文件 + 静态库"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
