# conandata.yml — io_lib 1.14.9 (Staden io_lib / libstaden-read)

sources:
  url: "https://downloads.sourceforge.net/project/staden/io_lib/1.14.9/io_lib-1.14.9.tar.gz"
  sha256: "8d0732f3d37abba1633731bfacac5fd7f8172eccb1cef224e8ced904d3b242f4"

patches:
  "1.14.9":
    - patch_file: "patches/0001-update-config-guess-sub-ohos.patch"
      patch_description: "Replace 2012-era config.guess/config.sub with 2026 versions recognizing aarch64-linux-ohos"
      patch_type: "portability"
    - patch_file: "patches/0002-configure-umask-tmpdir.patch"
      patch_description: "configure secure-tmp umask 077->022 (HMDFS exec/no-permission on mktemp subdir, commoncpp2 precedent)"
      patch_type: "portability"
    - patch_file: "patches/0003-libtool-expsym-retain-symbols.patch"
      patch_description: "Generated libtool archive_expsym_cmds uses nested double quotes that break under OHOS strict /bin/sh; link with -retain-symbols-file instead of version-script echo pipeline"
      patch_type: "portability"
    - patch_file: "patches/0004-libtool-echo-printf-not-print.patch"
      patch_description: "configure picks ksh `print -r --` builtin for ECHO/as_echo on mksh hosts, but generated libtool/config.status run under bash (no print builtin) -> 'print: command not found'; force portable printf branch"
      patch_type: "portability"
    - patch_file: "patches/0005-threadpool-musl-stacksize.patch"
      patch_description: "thread_pool workers created with default attrs crash (SIGSEGV) under musl's 128KB thread stack; set explicit 8MB stack via pthread_attr_setstacksize"
      patch_type: "portability"
