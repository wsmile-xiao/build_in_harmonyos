# 版本级 manifest — io_lib 1.14.9（遵循 ARCHIVE-SPEC v3.0）

version: "1.14.9"
software: "io_lib"
status: built
build_date: "2026-09-30"
build_system: "autotools"

source:
  url: "https://downloads.sourceforge.net/project/staden/io_lib/1.14.9/io_lib-1.14.9.tar.gz"
  sha256: "8d0732f3d37abba1633731bfacac5fd7f8172eccb1cef224e8ced904d3b242f4"

ohos_adaptation:
  key_points:
    - "2012 版 config.guess/config.sub 不识别 aarch64-linux-ohos → 0001 换 2026 版（build_systems.md §3.1）"
    - "configure 安全临时目录 umask 077 在 HMDFS 上 exec 权限失败 → 0002 改 022（commoncpp2 先例）"
    - "生成的 libtool archive_expsym_cmds 嵌套双引号在 OHOS 严格 /bin/sh 下 eval 语法损坏 → 0003 改 -retain-symbols-file"
    - "mksh 探测使 ECHO='print -r --'（ksh 内建），而 libtool/config.status shebang 是 bash（无 print）→ 0004 强制 printf 分支"
    - "musl 线程默认栈 128KB（glibc 8MB），thread_pool worker 跑 CRAM 编码 SIGSEGV → 0005 显式 8MB 栈"
    - "私有 prefix（R49）：--prefix=build_folder/prefix；package() 用 make target=install（避开 autotools.install() 的 DESTDIR=package_folder 绝对路径嵌套）"
    - "头文件双 include 路径：include 与 include/io_lib（上游头文件交叉引用 io_lib/Read.h）"

patches_applied:
  - "0001-update-config-guess-sub-ohos.patch"
  - "0002-configure-umask-tmpdir.patch"
  - "0003-libtool-expsym-retain-symbols.patch"
  - "0004-libtool-echo-printf-not-print.patch"
  - "0005-threadpool-musl-stacksize.patch"

dependencies:
  - "zlib/1.3.1.1（ohpcd 已发布）"
  - "libcurl/8.5.0（ohpcd 已发布）"
  - "bzip2/1.0.8（ohpcd 已发布）"
  - "xz/5.8.3.2（ohpcd 已发布）"

knowledge_gained:
  - "老版 libtool(2012) 在 OHOS 上三类生成脚本坑：嵌套引号 expsym/版本脚本、ksh print 内建误选、umask 077——均可用最小 patch 修复（0002-0004，一类通用模式）"
  - "musl 线程栈默认 128KB，glibc 系多线程库必须显式 setstacksize（0005）"
  - "conan autotools.install() 强制 DESTDIR=package_folder 与绝对 --prefix 组合会嵌套污染包目录；用 make target=install 绕开"

upstream_tests:
  registered: "tests/Makefile.am TESTS 10 项（srf2fasta/srf2fastq/srf_info/srf_filter/srf_index/scram/scram_mt/scram_v3/cram_io/java）"
  run_result: "10/10 Passed（scram_mt/scram_v3 依赖 0005 栈补丁；java.test 实际跳过 Java 段但 rc=0）"
  evidence: "~/tmp/builds/io_lib-upstream-tests.log + mt-final/v3-final：rc=0，Signal 11 计数 0"
