# ============================================================
# 必须字段
# ============================================================

version: "0.9.1"
software: "immer"

# 编译状态: published | built | failed | archived
status: "bootstrap"

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-30"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 GitHub release tag（R39 官方源）
  url: "https://github.com/arximboldi/immer/archive/refs/tags/v0.9.1.tar.gz"

  # 官方标签/release commit
  tag: "v0.9.1"
  release_commit: "160f0d7025321e5dc1fc3f0b7742ca7621d43981"

  # 源码校验和（2026-08-30 实测下载值）
  sha256: "b18b92ba60ec3186dc36ef671d3c2ae542cbb63eb6dc0e258476c6111a67c971"

  # 压缩格式
