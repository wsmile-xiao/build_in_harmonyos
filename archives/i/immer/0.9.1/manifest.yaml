# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（header-only：仅构建上游单测，关闭 examples/docs/extras）
  configure_options:
    - "-Dimmer_BUILD_TESTS=ON"
    - "-Dimmer_BUILD_EXAMPLES=OFF"
    - "-Dimmer_BUILD_DOCS=OFF"
    - "-Dimmer_BUILD_EXTRAS=OFF"

  # 编译依赖列表（格式: name/version）— header-only，无第三方运行时依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "immer 0.9.1 是 header-only C++ 库（CMake INTERFACE target `immer`，导出 ImmerConfig），无 .a/.so 产物，无需为库本身编译（ref: notes.md 发现与知识-1）"
  - "上游 CMake 包名为 Immer（cmake_file_name=Immer），target 名 `immer`（无命名空间）；recipe package_info 已对齐（ref: notes.md 发现与知识-1）"
  - "上游 project(immer VERSION 0.9.0) 版本串未随 v0.9.1 标签同步（上游瑕疵），适配以正式标签 v0.9.1 为准（ref: notes.md 发现与知识-2）"
  - "immer 无第三方运行时依赖；Boehm-GC/RRB/Boost 仅为上游完整测试/benchmark 的可选依赖（ref: notes.md 发现与知识-3）；上游测试前置 Catch2 v3 等不入生产配方（ref: notes.md 发现与知识-4）"
