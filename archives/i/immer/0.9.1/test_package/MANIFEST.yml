# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: immer/0.9.1
homepage: "https://github.com/arximboldi/immer"

upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: 按 immer/ 各数据结构单元测试编译为多个 CTest 可执行文件
# （详见 test/CMakeLists.txt；首个完整测试结果以实际 conan create / ctest 运行为准）
upstream_tests:
  - file: test/vector.cpp
    source: immer-0.9.1/test/vector.cpp
    description: "immer::vector 持久化向量单元测试（push_back/update/iteration/结构共享）"
    command: "ctest -R test/vector"
  - file: test/map.cpp
    source: immer-0.9.1/test/map.cpp
    description: "immer::map 持久化映射单元测试（insert/update/erase/lookup）"
    command: "ctest -R test/map"
  - file: test/flex_vector.cpp
    source: immer-0.9.1/test/flex_vector.cpp
    description: "immer::flex_vector 灵活向量单元测试（push_front/insert/update）"
    command: "ctest -R test/flex_vector"

test_package_tests:
  - file: test_immer.cpp
    description: "消费者测试: 验证 immer 库链接、immer::vector push_back/update/get 核心 API"
    command: "./test_immer"

assertion_count: 4
