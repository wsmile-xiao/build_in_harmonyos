# test_package/MANIFEST.yml
package: ifcplusplus/0-git20190402.13744d5
homepage: "https://github.com/ifcquery/ifcplusplus"

# 上游测试命令
# 该快照（git 13744d58f9b99ce3b4d49567b7085917cd7a6a3c，2019-04-02）上游无任何测试用例：
#   - 无 add_test() / enable_testing() 注册
#   - 无 gtest / catch2 / doctest 等测试框架依赖
#   - 无测试目录、无测试脚本、无 CI 配置
# 上游唯一可执行目标是 examples/SimpleViewerExampleQt（依赖 Qt + OpenGL 的桌面 viewer，
# 非测试目标，且不属于 OHOS PC 库交付范围，配方以 BUILD_VIEWER_APPLICATION=OFF 关闭）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无独立测试框架，故为空）
upstream_tests: []

# 上游用例数为 0 的复现核查：
#   grep -rn "add_test\|enable_testing" . --include=CMakeLists.txt        -> 无输出
#   grep -rniE "gtest|catch2|doctest|boost/test" . --include=CMakeLists.txt  -> 无输出
#   find . -iname '*test*'                                                -> 无匹配
#   ls -a | grep -iE 'github|travis|ci|appveyor'                          -> 无 CI 配置

# test_package 中自带的测试（消费者端到端 + 鸿蒙专项，经 ctest 真实执行）
test_package_tests:
  - file: src/test.cpp
    source: test_package/src/test.cpp
    description: "消费者端到端：解析 IFC4 STEP 模型(64 实体) -> 类型化取 IfcProject/IfcBuildingStorey/IfcWall -> 遍历墙 BRep(6 面/24 顶点) -> WriterSTEP 回写 -> 重新解析回环校验实体数守恒（16 项检查）"
    command: "./test_ifcplusplus"
  - file: src/test_ohos.cpp
    source: test_package/src/test_ohos.cpp
    description: "鸿蒙专项消费者端到端：Carve CSG 布尔运算（交集/并集，覆盖本次补丁修复的 intersect/mesh/spacetree 路径）+ IFC GUID 基 64 编解码 64/64 回环与非法输入拒绝 + 50 面墙模型 STEP 回写再解析守恒（13 项检查）"
    command: "./test_ifcplusplus_ohos"
