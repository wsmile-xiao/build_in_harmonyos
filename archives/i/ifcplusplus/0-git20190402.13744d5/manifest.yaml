knowledge_gained:
  - "该快照不内置 Boost（与 2.5 不同），公开头依赖 boost::optional / boost::algorithm::string / boost::unordered / boost::uuid，必须声明真实 Conan 依赖"
  - "OHOS boost/1.84.0 的 include 目录挂在 boost_headers 组件上（cmake_target_name Boost::headers）；聚合目标 boost::boost 不带 includedirs，只 requires 它消费者拿不到任何 Boost 头路径"
  - "上游 Carve 对 GNU/Clang 硬编码 SHARED；OHOS 要求静态无运行时库搜索路径，需补丁改为 STATIC"
  - "Carve 使用 C++17 已移除的 std::auto_ptr / std::bind1st / std::bind2nd，libc++ 下为硬失败"
  - "BuildingGuid.h 的 decodeBase64Uuid 模板体内 lambda 返回类型推导冲突；上游零调用点故从不实例化，消费者一调用即编译失败"
  - "Carve MeshSet 的 face_indices 是每面 [N,i0..iN-1] 扁平编码，不是三角形索引三元组"

