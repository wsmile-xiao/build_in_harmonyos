patches:
  - patch_file: "patches/0001-carve-static-link-ohos.patch"
    patch_description: "上游 Carve 在 GNU/Clang 下被硬编码为 SHARED 库；OHOS 交付要求静态、无运行时库搜索路径依赖，补丁强制 carve 编译为 STATIC"
    patch_type: "portability"
  - patch_file: "patches/0002-carve-cxx17-removed-facilities.patch"
    patch_description: "Carve 使用 C++17 已移除的 std::auto_ptr / std::bind1st / std::bind2nd（libc++ 严格按标准移除）；改用 std::unique_ptr 与等价 lambda，行为不变"
    patch_type: "portability"
  - patch_file: "patches/0003-buildingguid-lambda-return-type.patch"
    patch_description: "公开头 BuildingGuid.h 的 decodeBase64Uuid() 内 lambda 推导返回类型冲突（return i 为 uint8_t、return 0 为 int）；消费者一旦实例化该模板即编译失败，显式标注返回类型 uint8_t"
    patch_type: "portability"
