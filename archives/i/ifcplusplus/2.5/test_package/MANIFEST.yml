# test_package/MANIFEST.yml
package: ifcplusplus/2.5
homepage: "https://github.com/ifcquery/ifcplusplus"

# 上游测试命令 (项目为 CMake 库，无 ctest 注册，无独立测试目录)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无独立测试框架，官方仅提供 examples 示例）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证 + 鸿蒙专项)
test_package_tests:
  - file: src/test.cpp
    source: test_package/src/test.cpp
    description: "消费者用例：ReaderSTEP 解析 IFC4 STEP 模型 + WriterSTEP 回写校验"
    command: "./test_ifcplusplus"
  - file: src/test_ohos.cpp
    source: test_package/src/test_ohos.cpp
    description: "鸿蒙专项：GUID 压缩/解压往返一致性（覆盖 OHOS/ARM char 无符号的 mask 修复路径）"
    command: "./test_ifcplusplus_ohos"