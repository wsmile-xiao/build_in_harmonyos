# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "monorepo 共享 CMakeCommon.cmake 硬编码 CMAKE_CXX_STANDARD 14 会覆盖 Conan toolchain 的 cache 默认值，需补丁内改 17（libindi 2.2 头文件用 std::any）"
  - "依赖包 .so 无 SONAME 时（libraw），以绝对路径传给链接器会把 Conan 缓存路径写进 DT_NEEDED；必须 -L+裸名链接"
  - "libindi 2.x 新属性 API 迁移：INDI::PropertySwitch 用 findOnSwitchIndex()，状态更新用 setState()+apply()（FocuserInterface 回调同样适用）"
