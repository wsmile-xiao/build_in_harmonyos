# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点（R51，证据见 notes.md「上游测试清点」一节）：
#   清单 `indi-gphoto/`：CMakeLists.txt、gphoto_ccd.cpp/h、gphoto_driver.cpp/h、
#   gphoto_readimage.cpp/h、dsusbdriver.cpp/h、config.h.cmake、indi_gphoto.xml.cmake、
#   85-disable-dslr-automout.rules、indi-gphoto.spec、README 等
#   CMakeLists.txt 无 enable_testing()/add_test()，indi-3rdparty 全仓无该驱动测试用例
#   → 上游确无测试（故 upstream_tests 为空列表，非占位符）

package: indi-gphoto/3.2-20221221172841
homepage: "https://github.com/indilib/indi-3rdparty"

# 上游测试命令：该驱动子项目未提供 check/test 目标
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试（上游确无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（清点结论：无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，鸿蒙独有）
test_package_tests:
  - file: check_driver.py
    description: "消费者校验 4 项：bin/indi_gphoto_ccd 为 AArch64 ELF；share/indi/indi_gphoto.xml 驱动名与 bin/ 交叉引用一致；驱动 DT_NEEDED 静态审计（libindiclient/libindidriver 两项齐备且均为裸 soname、且都能在 libindi 包内找到）；conanrun 下真跑驱动，宿主加载器拒绝（本机 FUSE mmap 受限/未签名）记 SKIP、打包缺陷记 FAIL"
    command: "python3 check_driver.py <bindir>/indi_gphoto_ccd <bindir> <resdir>/indi/indi_gphoto.xml <libindi-pkg>/lib"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 4
