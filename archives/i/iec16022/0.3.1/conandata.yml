# conandata.yml — iec16022 0.3.1
#
# Source: official GitHub release asset (R39).  The release tarball ships the
# generated `configure`, `Makefile.in`, `config.guess`, `config.sub` and the
# libtool helper scripts, so the recipe does not need autoreconf/libtool.
# The git-archive/tarball endpoints ship only `configure.ac`, hence the
# release asset is required (not merely preferred).
#
# URL/sha256 are kept here (not in conanfile.py) because the CI pre-download
# step reads `sources.url` from conandata.yml, validates the checksum and then
# rewrites the entry to a local file:// URL (ci/conan/build_and_test.sh).

sources:
  url: "https://github.com/rdoeffinger/iec16022/releases/download/v0.3.1/iec16022-0.3.1.tar.xz"
  sha256: "5a83dbab402390695367cf1ea456140e51ff68171cbc0352ceba4be227715e07"

patches:
  - patch_file: "patches/0001-config.guess-harmonyos.patch"
    patch_description: "Teach config.guess the HarmonyOS uname signature (E007)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-ohos.patch"
    patch_description: "Register the ohos-linux triplet and linux-ohos kernel/OS pair (E122)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-tmpdir-hmdfs.patch"
    patch_description: "Relax the umask on configure's temp dir so HMDFS setgid dirs stay writable (E011/E114)"
    patch_type: "portability"
  - patch_file: "patches/0004-test-testsuite-vpath-srcdir.patch"
    patch_description: "Resolve the test reference artefacts through ${srcdir:-.} so the upstream suite works in an out-of-tree (VPATH) build"
    patch_type: "portability"
