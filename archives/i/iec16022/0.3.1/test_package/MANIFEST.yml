# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: iec16022/0.3.1
homepage: "https://github.com/rdoeffinger/iec16022"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# test/Makefile.am: TESTS=./testsuite.sh，automake 的 test-driver 逐个执行。
upstream_tests:
  - file: test/testsuite.sh
    source: iec16022-0.3.1/test/testsuite.sh
    description: "端到端编码测试：同一 payload 分别输出 Text/EPS/PNG/Bin/Hex/UTF-8 六种格式并与 test/ 下参考产物逐字节 diff"
    command: "./testsuite.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_iec16022.c
    description: "消费者测试：链接安装后的 libiec16022，用公开头文件验证 32x32 ECC200 编码与上游参考矩阵逐模块一致、指定尺寸/非法尺寸、超长载荷拒绝、ISO/IEC 16022 Annex R 校验向量、GS1 标志、PNG 渲染头部（R34 实质调用被测 API）；真机实测 40 项断言全过"
    command: "./test_iec16022"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
