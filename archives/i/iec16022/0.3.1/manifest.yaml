version: "0.3.1"
software: "iec16022"
conan_ref: "iec16022/0.3.1"
status: built
build_date: "2026-09-14"
build_system: "autotools"

source:
  url: "https://github.com/rdoeffinger/iec16022/releases/download/v0.3.1/iec16022-0.3.1.tar.xz"
  sha256: "5a83dbab402390695367cf1ea456140e51ff68171cbc0352ceba4be227715e07"
  tar_format: tar.xz

build:
  system: autotools
  configure_options: []
  dependencies:
    - popt/1.16
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess-harmonyos.patch"
  - "0002-config.sub-ohos.patch"
  - "0003-configure-tmpdir-hmdfs.patch"
  - "0004-test-testsuite-vpath-srcdir.patch"

knowledge_gained:
  - "E007/E205: 用 config.guess + config.sub 补丁让 configure 原生识别 aarch64-unknown-linux-ohos；不使用 --build/--host 绕过（会置 cross_compiling=yes 并跳过 AC_RUN_IFELSE）"
  - "E122: 只加 ohos* OS 家族还不够，config.sub 的 kernel-os 组合校验必须补 linux-ohos*，否则报 Invalid configuration `aarch64-linux-ohos': Kernel `linux' not known to work with OS `ohos'"
  - "E011/E114: HMDFS 强制目录 setgid，autoconf 的 umask 077 && mktemp -d 会建出属主不可写的 drwx--S--- 目录；把 configure 临时目录的 umask 放宽到 002"
  - "E002: HarmonyOS /tmp 只读，generate() 里显式把 TMPDIR 指向 build 目录，避免编译器临时文件写 /tmp 导致 AC_PROG_CC 的 conftest 失败"
  - "E074: make -j>1 需要 jobserver FIFO，HMDFS 拒绝（EPERM），全部 make 调用用 -j1"
  - "E232: 原生鸿蒙构建机上 Autotools.configure() 直接执行源码里的 configure 脚本会 Permission denied / error 126（shebang 方式执行被拒）；CONFIG_SHELL 无法补救（Autoconf 启动后才读它）。须用 /system/bin/sh 显式启动 configure 并沿用 autotools._configure_args，且以 settings_build.os 判定原生构建机"
  - "E037/E232: 鸿蒙拒绝以 shebang 方式启动脚本，automake test-driver 无法直接 exec test/testsuite.sh（bad interpreter: Permission denied, exit 126）。用 make check LOG_COMPILER=/system/bin/sh 让驱动以 `sh script` 形式调用，shebang 不再参与，无需改动上游测试文件"
  - "VPATH 构建：上游 test/testsuite.sh 用裸文件名引用参考产物，而 conan create 是 out-of-tree 构建，产物只存在于源码 test/ 目录；automake 会向测试环境导出 srcdir，脚本改用 ${srcdir:-.} 后兼容 in-source 与 out-of-tree 两种构建（设备实测六种格式逐字节一致）"
  - "官方 release asset（tar.xz）自带生成的 configure/Makefile.in/config.guess/config.sub，无需 autoreconf 自举；git-archive 只有 configure.ac"
  - "image.c 的 zlib 分支由 USEZLIB 宏关闭，因此 zlib 不是依赖；popt 是唯一外部依赖"
