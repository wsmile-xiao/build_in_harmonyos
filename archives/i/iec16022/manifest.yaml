software: iec16022
display: "iec16022"
description: "DataMatrix (IEC 16022 / ECC200) 2D barcode generator library and command-line tool"
category: gfx
homepage: "https://github.com/rdoeffinger/iec16022"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 需补 HarmonyOS 分支，config.sub 需补 ohos-linux 三元组、ohos* OS 家族与 linux-ohos* kernel-OS 组合（E007/E072/E122）"
    - "不使用 --build/--host 绕过 triplet 检测：会置 cross_compiling=yes 并跳过全部 AC_RUN_IFELSE（E007）"
    - "configure 临时目录的 umask 077 在 HMDFS 上会建出属主不可写的 setgid 目录，需放宽为 002（E011/E114）"
    - "HarmonyOS /tmp 只读，需在配方中把 TMPDIR 指向 build 目录（E002）"
    - "make -j>1 需要 jobserver FIFO，HMDFS 拒绝，统一 -j1（E074）"
    - "原生鸿蒙构建机上 Autotools.configure() 直接执行 configure 会被拒（Permission denied/126），须用 /system/bin/sh 显式启动并沿用 autotools._configure_args；判定条件是 settings_build.os（E232）"
    - "automake 测试驱动无法 exec 测试脚本（shebang 被拒），make check 须传 LOG_COMPILER=/system/bin/sh（E037/E232）"
    - "out-of-tree(VPATH) 构建下上游测试脚本按裸文件名找不到参考产物，需用 ${srcdir:-.} 定位"
    - "官方 release asset 自带生成的 configure/Makefile.in，无需 autoreconf 自举"
  common_dependencies:
    - popt

versions:
  "0.3.1":
    status: built
    build_date: "2026-09-14"
    conan_ref: "iec16022/0.3.1"
