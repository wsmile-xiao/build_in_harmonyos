# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: igor2/0.5.9
homepage: "https://github.com/AFM-analysis/igor2"

# 上游测试命令 — 上游套件在 conanfile.py build() 内真跑（pytest tests/）
upstream_check_command: "python3 -m pytest tests/ -q"
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest tests/ -q"

# 上游实际运行的测试程序（15 用例，本机 conan create 实测 15 passed / 0 failed）
upstream_tests:
  - file: test_ibw.py
    passed: 11
    failed: 0
  - file: test_pxp.py
    passed: 2
    failed: 0
  - file: test_cli.py
    passed: 2
    failed: 0
# 真实运行结果（2026-10-01）：15 passed / 0 failed / 0 skipped（python 3.12.9 + numpy 2.5.3 + pytest 9.1.1）
# test_cli.py 上游为两个空壳函数（仅 capsys 参数、无断言体），原样运行通过

# test_package 自带的测试（消费者视角验证）
test_package_tests:
  - file: test_igor2.py
    description: "消费者测试 — 真实 .ibw/.pxp 二进制解析断言（与上游 test_ibw/test_pxt 期望值对齐）+ bin/igorbinarywave CLI 端到端转换"
    command: "python3 test_igor2.py <package_folder>"

# 测试断言总数（近似值）
assertion_count: 15
