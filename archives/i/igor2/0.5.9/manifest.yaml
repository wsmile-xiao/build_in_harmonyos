# 版本级 manifest
# 文件位置: archives/i/igor2/0.5.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.5.9"

# 软件名
software: "igor2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: "setuptools (pure python, no compile)"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档，tag 无 v 前缀）
  url: "https://github.com/AFM-analysis/igor2/archive/refs/tags/0.5.9.tar.gz"

  # 源码校验和
  sha256: "da872d001e3b6fd9f8169624abfa6baf6db27cbcd4338295c7c42e7306a9386a"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（numpy 为宿主 python3 运行时依赖，非 conan 依赖 — badread 0.4.2 先例）
  dependencies: []

  # 编译器（纯 Python 包，无 C/C++ 编译）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-cli-optional-matplotlib.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "igor2 是纯 Python 包（setuptools + setuptools_scm），无 C/C++ 扩展，适配走 Python 件路线（badread/aiohappyeyeballs 先例）"
  - "上游 tarball 无 git 元数据，setuptools_scm 无法生成版本 — 配方内生成 igor2/_version.py 替代（write_to 同构）"
  - "上游 CLI（script.py）未装 matplotlib 时任何普通转换 exit 1（plot_wave/display_plots 先查 pyplot 再查 -p），补丁交换检查顺序修复"
  - "numpy 依赖走宿主 python3 运行时（制品仓 numpy conan 包的 .so 为交叉编译件，与宿主 python3.12 解释器 ABI 不兼容）"
  - "packed.load 解析 big-endian pxt 必须传 initial_byte_order='>'（上游 test_pxt.py 同款）"
