# 软件级 manifest
# 文件位置: archives/i/igor2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: igor2

# 显示名
display: "igor2"

# 一句话描述
description: "Interface for reading binary IGOR files (.ibw/.pxp)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: data

# 官网 URL
homepage: "https://github.com/AFM-analysis/igor2"

# 开源许可证（SPDX 标识）
license: LGPL-3.0-or-later

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: custom

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "纯 Python 包（setuptools），无 C/C++ 编译，走 Python 件路线（badread/aiohappyeyeballs 先例）"
    - "numpy 依赖走宿主 python3 运行时而非 conan requires（交叉编译 .so 与宿主解释器 ABI 不兼容）"
    - "上游 tarball 无 git 元数据，配方内生成 igor2/_version.py 替代 setuptools_scm"
    - "CLI 入口用 sh wrapper 实现（python3 -m igor2.cli.igorbinarywave），PYTHONPATH 注入包内 site-packages"
    - "CLI 的 matplotlib 为可选 extra，未安装时普通转换需可用（补丁 0001）"
  common_dependencies:
    - numpy（宿主 pip，>=1.19.2）

# 版本索引
versions:
  "0.5.9":
    status: built
    build_date: "2026-10-01"
