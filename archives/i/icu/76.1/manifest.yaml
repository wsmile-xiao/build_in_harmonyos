# 版本级 manifest — icu 76.1
# 遵循 ARCHIVE-SPEC v2.0

version: "76.1"
software: "icu"
status: built
build_date: "2026-09-07"
build_system: autotools

source:
  url: "https://github.com/unicode-org/icu/releases/download/release-76-1/icu4c-76_1-src.tgz"
  sha256: "dfacb46bfe4747410472ce3e1144bf28a102feeaa4e3875bac9b4c6cf30f4f3e"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--host=aarch64-unknown-linux-ohos"
    - "--build=x86_64-unknown-linux-gnu"
    - "--with-cross-build=<build-dir>"
    - "--disable-shared"
    - "--enable-static"
    - "--disable-extras"
    - "--disable-icuio"
    - "--disable-layout"
    - "--disable-layoutex"
    - "--disable-tests"
    - "--disable-samples"
    - "--with-data-packaging=static"
    - "--enable-renaming"
    - "--disable-strict"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "conanbuild.sh 会导致 /bin/sh SIGSEGV (Error -11)，需直接设 CC/CXX 环境变量 (E064)"
  - "ICU 交叉编译需要 --with-cross-build + icucross.mk/icucross.inc stub"
  - "HMDFS 上 config.status 的 umask 077 需改为 022 (E011)"
  - "OHOS config.sub 已支持 linux-ohos 三元组 (E007)"
