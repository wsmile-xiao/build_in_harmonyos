package: inja/3.5.0
homepage: "https://github.com/pantor/inja"

upstream_check_command: "ctest --test-dir <build_folder> --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure"

upstream_tests:
  - path: test/test.cpp
    type: doctest C++ unit tests
    case_count: 15
    assertion_count: 258
    executions: 2
    targets: [inja_test, single_inja_test]

test_package_tests:
  - file: test_inja.cpp
    description: "Consumer checks for inja::render, Environment rendering, loops, conditionals, and RenderError"
    command: "./test_inja"
    case_count: 1
    assertion_count: 4

assertion_count: 4
