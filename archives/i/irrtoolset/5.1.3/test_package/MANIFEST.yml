# test_package/MANIFEST.yml — irrtoolset 5.1.3

package: irrtoolset/5.1.3
homepage: "https://github.com/irrtoolset/irrtoolset"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# irrtoolset 5.1.3 官方源码无独立测试框架: 无 TESTS/check_PROGRAMS 注册,
# 无 gtest/Catch 等测试框架文件, examples/ 仅为示例输入数据(非独立用例).
# make check 输出 "Nothing to be done for 'check'" — 源码声明独立用例数 = 0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "调用已安装 CLI 工具 rpslcheck(合法/非法 RPSL 对象校验) 与 rtconfig(运行输出)"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3