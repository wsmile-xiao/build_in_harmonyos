software: ipinfo

# 软件级 manifest
# 文件位置: archives/i/ipinfo/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

name: ipinfo
category: network

# 软件描述（简短）
description: "IP 网络计算工具，用于计算和分析 IP 地址的网络信息"

# 维护状态
# active | maintained | unmaintained | deprecated
maintainer_status: maintained

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2":
    status: built
    build_date: "2026-06-09"
    patches: 1
    notes: "首次编译，修复 Makefile 硬编码路径问题"

# ============================================================
# 软件元数据
# ============================================================

metadata:
  # 官方网站
  homepage: "https://kyberdigi.cz/projects/ipinfo/"

  # 许可证
  license: "Unknown"

  # 编程语言
  language: "C"

  # 构建系统
  build_systems:
    - makefile

  # 关键词（用于搜索）
  keywords:
    - ip
    - network
    - subnet
    - cidr
    - calculator

# ============================================================
# 依赖信息（软件级）
# ============================================================

# 运行时依赖（用户安装后需要）
runtime_dependencies: []

# 编译时依赖（构建时需要）
build_dependencies: []

# ============================================================
# 跨版本知识沉淀
# ============================================================

# 所有版本共用的编译经验
common_knowledge:
  - "Makefile 项目，无需 configure 步骤"
  - "使用 CC=clang CFLAGS=-fPIC -O2 编译选项"
  - "需要修复硬编码的 /usr/bin/gcc 和 /usr/bin/install"
  - "Makefile 需添加 DESTDIR 支持用于打包"