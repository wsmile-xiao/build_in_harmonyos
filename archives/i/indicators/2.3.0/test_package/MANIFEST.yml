# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: indicators/2.3.0
homepage: "https://github.com/p-ranav/indicators"

# 上游无独立 CTest 套件（INDICATORS_DEMO/INDICATORS_SAMPLES 默认 OFF，无 test/ 目录）
upstream_check_command: "cmake -N -LA . >/dev/null 2>&1; test $? -eq 0"

# test_package 消费者验证
upstream_test_in_build: false
upstream_test_command: ""

# 上游组件: 头文件 + demo/samples（可视终端程序，评估阶段抽查编译）
upstream_tests:
  - file: include/indicators/progress_bar.hpp
    source: indicators-2.3.0/include/indicators/progress_bar.hpp
    description: "ProgressBar 核心头文件（上游库本体，非测试）"
    command: ""
  - file: include/indicators/indicators.hpp
    source: indicators-2.3.0/include/indicators/indicators.hpp
    description: "全量聚合头文件（上游库本体，非测试）"
    command: ""

test_package_tests:
  - file: test_indicators.cpp
    description: "消费者测试: 链接 indicators::indicators，构造 ProgressBar 并验证 set_progress/is_completed/option::Stream"
    command: "./test_indicators"

assertion_count: 4