package: inn2
version: "2.7.4"
homepage: "https://www.eyrie.org/~eagle/software/inn/"
license: ISC
status: built
build_system: autotools
build_date: "2026-09-24"

source:
  url: "https://ftp.isc.org/isc/inn/inn-2.7.4.tar.gz"
  sha256: "80fc7e801e1996cb17bb430d104dd9c5b29aa571fd4b29a9c821b4fadb051d3b"

patches_applied:
  - "0001-configure-umask-022.patch"
  - "0002-config-guess-ohos.patch"
  - "0003-config-sub-ohos.patch"
  - "0004-innfeed-validate-hash-table-void-cast.patch"

build:
  configure_options:
    - "--without-perl"
    - "--without-python"
    - "--without-sendmail"
    - "--disable-largefiles"
    - "--disable-shared"
  dependencies: []

upstream_tests:
  command: "make check"
  test_count: 3883
  notes: >-
    73 test files / 3883 assertions.  Observed 110 failures (97.17% pass, 26
    skipped) on device.  Every failing case needs a real news account,
    executable chown/chgrp or a writable spool, none of which the sandbox
    provides; the libinn unit tests themselves all pass.  Full breakdown in
    test_package/MANIFEST.yml.

test_package:
  assertion_count: 34
  description: >-
    Links libinn and exercises four public subsystems: doubly-linked lists
    (list_new/addhead/addtail/succ/pred/remove/remhead), the generic hash
    table (hash_create/insert/lookup/replace/delete/count), MD5 against
    RFC 1321 vectors, and concat/concatpath.

knowledge_gained:
  - "hmdfs 是 setgid 卷：umask 077 建出的目录为 drwx--S---，磁盘属主与构建 UID 不同，导致属主自己也写不进 → configure 的 config.status 用 umask 077 建临时目录必然 Permission denied，须 patch 成 022"
  - "INN 自带 config.guess 不识别 HarmonyOS，报 'cannot guess build type'，须 patch config.guess/config.sub 而非 --build/--host 绕过 (R15)"
  - "make install 用 install-sh -o news -g news：环境无 chown/chgrp 与 news 账号 → installer 中止；用 CHOWNPROG=:/CHGRPPROG=: 覆盖 + OWNER= 清空 -o/-g 参数"
  - "构建路径含空格会让 INN 的 Makefile 把 abs_builddir 拆词，把父目录当成 target 反复构建——必须在无空格目录构建"

patch_classification:
  - file: 0001-configure-umask-022.patch
    type: portability
    platform_only: True
    guard: none
  - file: 0002-config-guess-ohos.patch
    type: portability
    platform_only: True
    guard: __OHOS__
  - file: 0003-config-sub-ohos.patch
    type: portability
    platform_only: True
    guard: none
  - file: 0004-innfeed-validate-hash-table-void-cast.patch
    type: upstream-bug
    platform_only: False
    guard: none
