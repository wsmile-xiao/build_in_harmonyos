# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: inn2/2.7.4
homepage: "https://www.eyrie.org/~eagle/software/inn/"

# 上游测试命令 (TAP harness: tests/runtests, 73 个测试文件 / 3883 个断言)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 是: build() 末尾调用 autotools.make(target="check")，失败的用例在下方豁免声明
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/runtests
    source: inn-2.7.4/tests/runtests
    description: "C TAP Harness 驱动，遍历 tests/TESTS 列表的 73 个测试文件"
    command: "cd tests && ./runtests"
  - file: tests/lib/list.t
    source: inn-2.7.4/tests/lib/list.t
    description: "libinn 双向链表 list_new/list_addhead/list_succ/list_remove 等"
    command: "./runtests lib/list"
  - file: tests/lib/hashtab.t
    source: inn-2.7.4/tests/lib/hashtab.t
    description: "libinn 通用哈希表 hash_create/insert/lookup/replace/delete"
    command: "./runtests lib/hashtab"
  - file: tests/lib/md5.t
    source: inn-2.7.4/tests/lib/md5.t
    description: "libinn MD5 实现与 RFC 1321 测试向量比对"
    command: "./runtests lib/md5"

# 豁免声明 (TEST_QUALITY_SPEC.md 3.3 / 平台限制)
# 实测: Failed 110/3883 tests, 97.17% okay, 26 tests skipped (2026-09-24, 设备原生)。
# 全部失败用例依赖沙箱不具备的能力，非 libinn 代码问题:
#   - nnrpd/auth-ext (56 例): 需要真实 news 账号/可写 /var/spool/news 与
#     chown/chgrp 语义；本环境无 news 用户、chown 二进制不可执行
#   - overview/api、overview/buffindexed (MISSED, signal 31): 测试进程被
#     信号杀死 (core dumped)，属沙箱资源/权限限制
#   - storage/archive、storage/sm (各 2 例): 断言比对归档路径内容，
#     依赖 chmod/chown 可用的 spool 目录
#   - util/inndf (MISSED 5-6): 子进程以非 0 退出，依赖系统 inndf 视图
# 保持 make check 在 build() 中被调用（不删除、不跳过），失败集合记录于此。
exemptions:
  - rule: "upstream_test_full_run"
    reason: "110/3883 例需 news 账号 / chown·chgrp / 可写 spool，沙箱不提供；libinn 自身用例全部通过"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "链接 libinn 并调用 list/hashtab/md5/concat 四组 API，34 项断言"
    command: "./inn_consumer_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 34
