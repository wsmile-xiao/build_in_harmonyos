sources:
  url: "https://ftp.isc.org/isc/inn/inn-2.7.4.tar.gz"
  sha256: "80fc7e801e1996cb17bb430d104dd9c5b29aa571fd4b29a9c821b4fadb051d3b"

patches:
  - patch_file: "patches/0001-configure-umask-022.patch"
    patch_description: "Create config.status tmp dir with umask 022 (setgid hmdfs makes 0700 dirs unwritable for the non-owner build UID)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-config-guess-ohos.patch"
    patch_description: "Teach the bundled config.guess the HarmonyOS system type and __OHOS__ libc"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-config-sub-ohos.patch"
    patch_description: "Accept the ohos-linux / linux-ohos triplet in the bundled config.sub"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0004-innfeed-validate-hash-table-void-cast.patch"
    patch_description: "Fix invalid `(void(0))` macro body in innfeed/article.c that only surfaces under NDEBUG (Release builds)"
    patch_type: "portability"
    strip: 1
