software: imlib2
# 软件级 manifest 模板
# 文件位置: archives/i/imlib2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（与目录名一致）
name: imlib2

# 软件描述（简短）
description: "通用图像加载和渲染库"

# 软件分类
category: graphics

# 官方网站
homepage: https://enlightenment.org

# ============================================================
# 版本索引（由 finalize-archive 自动更新）
# ============================================================

# 已编译版本列表
# 格式: version: status
versions:
  "1.12.6": published

# ============================================================
# 依赖关系（可选）
# ============================================================

# 运行时依赖
runtime_deps:
  - freetype2
  - libpng
  - zlib

# 构建时依赖
build_deps:
  - pkg-config

# ============================================================
# 维护信息
# ============================================================

# 最后更新日期
last_updated: "2026-05-22"

# 维护者（可选）
maintainer: ""