# test_package/MANIFEST.yml — imlib2 1.9.1
# CI L0e 强制要求：声明上游测试来源与 test_package 测试。

package: imlib2/1.9.1
homepage: "https://enlightenment.org"

# 上游测试：gtest 套件，9 个可执行（test_misc/test_string/test_file/
# test_context/test_load/test_load_2/test_save/test_scale/test_rotate；
# test_grab 由 BUILD_X11 互斥分支排除）。运行需 IMLIB2_LOADER_PATH 指向
# build 的 loaders/.libs，cwd 为 build-release/test。完整台账见
# 1.9.1/reports/test-report.md。
upstream_check_command: "make -C test run"
upstream_test_in_build: true
upstream_test_command: "make -C test run"

upstream_tests:
  - file: test/test_misc.cpp
    source: legacy-imlib2 v1.9.1/test
    description: "MISC.version / MISC.strerror — gtest 2 例"
    command: "./test_misc"
  - file: test/test_string.cpp
    source: legacy-imlib2 v1.9.1/test
    description: "STR.strsplit_1..4 — gtest 4 例"
    command: "./test_string"
  - file: test/test_file.cpp
    source: legacy-imlib2 v1.9.1/test
    description: "FILE 7 例（file_can_read 因 HMDFS chmod 不生效失败，平台限制）"
    command: "./test_file"
  - file: test/test_context.cpp
    source: legacy-imlib2 v1.9.1/test
    description: "CTX.ctx — gtest 1 例"
    command: "./test_context"
  - file: test/test_load.cpp
    source: legacy-imlib2 v1.9.1/test
    description: "LOAD.load_1/2 — symlink 相对路径子测试受 out-of-tree 构建布局影响失败"
    command: "./test_load"
  - file: test/test_load_2.cpp
    source: legacy-imlib2 v1.9.1/test
    description: "LOAD2.load_1 — ff.gz 解压 loader 硬编码 /tmp 模板，/tmp 只读失败（平台限制）"
    command: "./test_load_2"
  - file: test/test_save.cpp
    source: legacy-imlib2 v1.9.1/test
    description: "SAVE 8 例 — 2 通过；6 例因配方禁用 gif/jpeg/tiff/webp saver 失败"
    command: "./test_save"
  - file: test/test_scale.cpp
    source: legacy-imlib2 v1.9.1/test
    description: "SCALE.scale_1_rgb/argb — gtest 2 例"
    command: "./test_scale"
  - file: test/test_rotate.cpp
    source: legacy-imlib2 v1.9.1/test
    description: "ROTAT.rotate_1/2 aa/noaa — gtest 4 例"
    command: "./test_rotate"

test_package_tests:
  - file: test_package.c
    description: "消费者验证：公开 API imlib_create_image/填充/缩放/像素断言，编译链接运行 RC=0"
    command: "./test_package"

assertion_count: 39
