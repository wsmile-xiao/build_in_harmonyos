# conandata.yml — imlib2 1.9.1
# 上游：官方 release 归档（sourceforge），任务头列明的官方 HTTPS URL。
# r03：CI 侧 git.enlightenment.org clone 网络失败（curl 18 early EOF），
# 但 CI 日志证明 downloads.sourceforge.net 可达（libpng 同源下载成功）；
# 切换为官方 sourceforge release 归档并写入官方 SHA-256。
sources:
  url: "https://downloads.sourceforge.net/project/enlightenment/imlib2-src/1.9.1/imlib2-1.9.1.tar.gz"
  sha256: "c319292f5bcab33b91bffaa6f7b0842f9e2d1b90df6c9a2a39db4f24d538b35b"

patches:
  - patch_file: "patches/0001-enable-build-test.patch"
    patch_description: >-
      configure.ac 将 BUILD_TEST 硬编码为 false（AM_CONDITIONAL(BUILD_TEST,
      false)），上游测试套件（test/ 目录，gtest 用例）永不构建。改为
      --enable-test 开关（默认 no），配方以 -o test=True 启用后即可
      实际编译并运行上游测试；默认保持关闭不影响普通构建。
    patch_type: "portability"
  - patch_file: "patches/0002-decompress-tmpdir.patch"
    patch_description: >-
      decompress_load.c 硬编码 mkstemp("/tmp/imlib2_loader_dec-XXXXXX")，
      /tmp 只读（OHOS HMDFS 约束，E002 平台限制）时解压 loader 失败。
      改为优先读取 $TMPDIR（回退 /tmp），使 gz/bz2/xz 解压加载在
      可写临时目录下可用。
    patch_type: "portability"
  - patch_file: "patches/0003-loader-id3-tmpdir.patch"
    patch_description: >-
      loader_id3.c load2() 硬编码 mkstemp("/tmp/imlib2_loader_id3-XXXXXX")
      提取 APIC 图像，/tmp 只读时 ID3 loader 报 "Unable to create a
      temporary file"（jpg.mp3 加载失败）。改为优先读取 $TMPDIR
      （回退 /tmp），与 0002 同型修复。
    patch_type: "portability"
  - patch_file: "patches/0004-xpm-builtin-named-colors.patch"
    patch_description: >-
      loader_xpm.c xpm_parse_color() 对命名色（如 white）查找
      /usr/share/X11/rgb.txt（及其变体路径），无 X11 环境（OHOS）下
      文件缺失 → 颜色解析失败返回黑色，导致 XPM 图像像素失真
      （上游测试 icon-64.xpm crc 不匹配）。缺 rgb.txt 时以内置常用
      颜色名表兜底（white/black/red/... 24 项）。
    patch_type: "portability"
  - patch_file: "patches/0005-configure-test-makefile-unconditional.patch"
    patch_description: >-
      r03 源码切换为官方 release 归档后无 .git（SRC_IS_GIT=false），
      configure.ac 原 AM_COND_IF 跳过 test/Makefile 生成，导致
      automake 报 required file 'test/Makefile.in' not found；配方已
      随 export_sources 携带官方 v1.9.1 测试源（upstream-test/ ->
      test/），无条件生成 test/Makefile。
    patch_type: "portability"
