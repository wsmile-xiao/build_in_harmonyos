software: imlib2
version: "1.9.1"
build_system: autotools
status: built
build_date: "2026-09-16"

source:
  url: "https://git.enlightenment.org/old/legacy-imlib2"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-x"
    - "--build=aarch64-linux"
    - "--host=aarch64-linux"
  dependencies:
    - freetype/2.14.3.1
    - libpng/1.6.58.2
    - zlib/1.3.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-enable-build-test.patch"

knowledge_gained:
  - "OHOS 无 X11：必须 --without-x 且向消费者注入 -DX_DISPLAY_MISSING（Imlib2.h 用该宏守卫 X11 头）"
  - "OHOS 主机不被 config.guess 识别：显式 --build=aarch64-linux --host=aarch64-linux"
  - "freetype 配方未设 pkg_config_name，configure 需 freetype2.pc：用依赖包内自带 .pc 或补写桥接"
  - "上游测试默认 BUILD_TEST=false 硬编码，需最小补丁 --enable-test 启用"

patch_generation:
  method: git-diff
  source_orig_dir: https://git.enlightenment.org/old/legacy-imlib2 (tag v1.9.1)
  patches_count: 1
