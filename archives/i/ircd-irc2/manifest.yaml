# 软件级 manifest — ircd-irc2
# 遵循 ARCHIVE-SPEC v3.0

software: ircd-irc2
display: "ircd-irc2 (classic IRC server)"
description: "经典 IRC 服务器（irc2 系列，C/autotools）：产出 ircd 服务器本体与 chkconf / iauth / ircd-mkpasswd / ircdwatch 共 5 个可执行"
category: application
homepage: "https://salsa.debian.org/debian/ircd-irc2"
license: GPL-1.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "构建步骤照抄 Debian 打包的权威做法：`mkdir builddir && cp support/configure builddir/` 后在其内 `./configure --with-zlib --enable-ipv6 …`，再 `make -C builddir all`（irc2 顶层 configure 是自写脚本，真正可用的 autoconf 在 support/configure）"
    - "依赖：libxcrypt/4.5.2（提供 libcrypt，`crypt()`）+ zlib/1.3.1.1（`--with-zlib`），两者制品仓均已合入、R35 实测可解析；注意仓库里 libxcrypt 另一版本 4.4.36 不可用"
    - "老式 autoconf 用 AC_CHECK_LIB/AC_CHECK_HEADER 找依赖 → 由 AutotoolsDeps 注入 CPPFLAGS/LDFLAGS 命中，无需上游提供 pkg-config"
    - "产物 5 个二进制（ircd / chkconf / iauth / ircd-mkpasswd / ircdwatch）→ bin/（Debian 侧装到 usr/sbin）"
    - "上游无测试（无 t//test//check 目标）→ 通过率记 N/A，验证由 test_package 的 ELF/架构审计与 best-effort 运行承担"
  common_dependencies:
    - "libxcrypt/4.5.2"
    - "zlib/1.3.1.1"

versions:
  "2.11.2p3-dfsg":
    status: built
    build_date: "2026-10-08"
    conan_ref: "ircd-irc2/2.11.2p3-dfsg"
