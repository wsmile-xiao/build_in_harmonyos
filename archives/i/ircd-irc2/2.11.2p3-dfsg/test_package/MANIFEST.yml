# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点（R51）：
#   源码树内**无** t/、无 test/、无 check 类目标（`find src -name "*test*"` 为空；
#   `Makefile.in` 仅存在于 support/ 且无 check target）→ 上游确无测试，
#   上游通过率记 N/A（如实披露）；验证由 test_package 承担。

package: ircd-irc2/2.11.2p3-dfsg
homepage: "https://salsa.debian.org/debian/ircd-irc2"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: check_binaries.py
    description: "消费者校验 4 项：①五个二进制（ircd / chkconf / iauth / ircd-mkpasswd / ircdwatch）齐备、非空、可执行 ②均为 64 位 AArch64 ELF（手写解析 ELF 头）③静态指纹审计——ircd 二进制内含版本串 2.11.2p3 与 crypt 符号引用（证明经本适配构建且链上 libcrypt）④best-effort 真跑 chkconf：宿主加载器拒绝记具名环境 SKIP 并打印原文，输出含 usage 记通过，其余非 0 判真实缺陷"
    command: "python3 check_binaries.py <package>/bin"

assertion_count: 4
