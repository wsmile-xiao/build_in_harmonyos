# conandata.yml — ircd-irc2 2.11.2p3-dfsg
#
# 上游是 1990 年代的经典 IRC 服务器（irc2 系列）。源码取 Debian pool 的 dfsg 版：
#   https://deb.debian.org/debian/pool/main/i/ircd-irc2/ircd-irc2_2.11.2p3~dfsg.orig.tar.gz
# （上游原站 ftp.irc.org 不可达；Debian 的 dfsg 版仅移除非自由文档，代码与上游一致。）
#
# 依赖：libxcrypt（提供 libcrypt，`crypt()`）+ zlib（`--with-zlib` 压缩链接）。
#   两者制品仓均已合入（R35 实测：libxcrypt/4.5.2 → Install finished successfully；
#   zlib/1.3.1.1 → Install finished successfully）。
#   注意：仓库里 libxcrypt 的另一版本目录 4.4.36 实测 **Unable to find**（只有 4.5.2 可用）。
#
# 构建系统：顶层 `configure` 是 irc2 **自写的 shell 脚本**（会 `support/config.guess` 后建
#   ${rev} 目录），真正的 autoconf 是 `support/configure`（带 `--prefix`、`--with-zlib`，
#   并自动 `checking for crypt in -lcrypt`）。故配方不走 AutotoolsToolchain 的参数约定，
#   而是显式调用顶层 configure 并注入依赖的 include/lib 路径。
#
# 上游测试：源码树内**无测试目录/测试目标**（无 t/、无 test/、无 check target）
#   → 上游通过率记 N/A（如实披露），验证由 test_package 承担。

sources:
  url: "https://deb.debian.org/debian/pool/main/i/ircd-irc2/ircd-irc2_2.11.2p3~dfsg.orig.tar.gz"
  sha256: "ed0130903edc6799facf659c4371246c042fd858388ac595a960795d6b0f659b"
  filename: "ircd-irc2_2.11.2p3~dfsg.orig.tar.gz"

patches:
  - patch_file: "patches/0001-s_bsd-setpgrp-musl.patch"
    patch_description: >-
      musl（含 OHOS）的 unistd.h 只声明 `void setpgrp(void)`，而 irc2 的 s_bsd.c 在非 glibc
      平台落到 2 参 BSD 形式 `setpgrp(0, getpid())` → 编译期报
      `too many arguments to function call, expected 0, have 2`。补丁在 `#else` 前插入
      `#elif !defined(__GLIBC__)` 分支改用 POSIX `setsid()` 脱离终端（与上游 HPUX/SVR4/
      _POSIX_SOURCE 分支同一处理），**glibc 路径保持原样**，不改变 Debian 侧行为。
    patch_type: "portability"
  - patch_file: "patches/0002-mkpasswd-getpass-musl.patch"
    patch_description: >-
      musl（含 OHOS）不提供 `getpass()`，链接 `ircd-mkpasswd` 时报
      `ld.lld: error: undefined symbol: getpass`。补丁把 mkpasswd.c 里那句
      `extern char *getpass(const char *)` 在**非 glibc** 下换成等价的本地实现
      （读 `/dev/tty`，回退 stdin，去掉行尾换行），glibc 下仍走 libc 版本。
    patch_type: "portability"
