# 版本级 manifest — ircd-irc2 2.11.2p3-dfsg
version: "2.11.2p3-dfsg"
software: "ircd-irc2"
status: built
build_date: "2026-10-08"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/i/ircd-irc2/ircd-irc2_2.11.2p3~dfsg.orig.tar.gz"
  sha256: "ed0130903edc6799facf659c4371246c042fd858388ac595a960795d6b0f659b"
  note: >-
    Debian dfsg 版 orig tarball（上游原站 ftp.irc.org 不可达；dfsg 版仅移除非自由文档，
    代码与上游一致）。源码树为 irc2 的经典布局：顶层 `configure` 是自写脚本，autoconf 在
    `support/configure`。

build:
  system: autotools
  dependencies:
    - "libxcrypt/4.5.2"    # crypt()（support/configure 自动探测 -lcrypt）
    - "zlib/1.3.1.1"       # --with-zlib
  build_steps:
    - "mkdir builddir && cp support/configure builddir/（照抄 Debian override_dh_auto_configure）"
    - "cd builddir && ./configure --with-zlib --enable-ipv6 …（依赖经 AutotoolsDeps 注入 CPPFLAGS/LDFLAGS）"
    - "make -C builddir all"
  artifacts:
    - "ircd、chkconf、iauth、ircd-mkpasswd、ircdwatch（5 个二进制 → bin/）"

patches_applied: []

upstream_tests:
  framework: none
  test_sources: 0
  test_command: ""
  run_in_build: false
  evidence: >-
    源码树内无 t/、无 test/、无 check 类目标（`find src -name "*test*"` 为空；
    Makefile.in 仅在 support/ 下且无 check target）——上游确无测试，故 build() 只做
    configure + make all；上游通过率记 N/A（如实披露，不虚构）。
upstream_test_pass_rate: "N/A（上游无测试用例，如实披露）"
adapted_test_pass_rate: "test_package/check_binaries.py **4 项校验：4 项全部通过**（本地 conan create 实测，包创建成功；`checks=4 fails=0 skips=0 RESULT: PASS`）：①五个二进制（ircd / chkconf / iauth / ircd-mkpasswd / ircdwatch）齐备、非空、可执行 ②均为 64 位 AArch64 ELF（手写解析 ELF 头）③指纹审计——ircd 含版本串 2.11.2p3、ircd-mkpasswd 含 crypt 符号引用（crypt 真正使用方是 mkpasswd，不是服务端）④best-effort 真跑：chkconf exit=0 并打印 `initconf(): ircd.conf = /usr/local/etc/ircd.conf`"

knowledge_gained:
  - "irc2 系列上游的构建入口有两层：顶层 `configure` 是自写脚本（会 config.guess 后建目录），可用的 autoconf 在 `support/configure`；Debian 的权威做法是把 support/configure 复制到独立 builddir 再在其内 configure —— 配方照抄该做法比猜顶层脚本的参数更可靠"
  - "仓库里同一库可能存在多个版本目录但只有部分已发布（本库 libxcrypt：4.4.36 目录在但 Unable to find，4.5.2 才可用）→ 依赖核查必须按**目录里列出的版本**逐个 R35 探测，不能凭目录名判断可用"
  - "老式 autoconf 工程用 AC_CHECK_LIB/AC_CHECK_HEADER 找依赖（本例 crypt/zlib）：由 AutotoolsDeps 注入 CPPFLAGS/LDFLAGS 即可命中，无需上游提供 pkg-config"
