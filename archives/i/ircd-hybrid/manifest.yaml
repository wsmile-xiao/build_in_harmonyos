# 软件级元数据；版本级构建细节见对应版本目录的 manifest.yaml 与 notes.md。
software: ircd-hybrid
display: "ircd-hybrid"
description: "模块化 IRC 服务器，支持动态模块和 TLS"
category: network
homepage: "https://www.ircd-hybrid.org/"
license: "GPL-2.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "HarmonyOS PC aarch64 上使用 OHOS Clang 和系统 libc 构建"
    - "TLS 通过 openssl/3.5.8.1 提供"
    - "运行时由集成方提供 IRC 配置与服务管理"
  common_dependencies:
    - openssl

versions:
  "8.2.46-dfsg.1":
    status: built
    build_date: "2026-10-03"
    conan_ref: "ircd-hybrid/8.2.46-dfsg.1"
