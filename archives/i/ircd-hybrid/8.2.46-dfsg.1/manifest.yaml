version: "8.2.46-dfsg.1"
software: ircd-hybrid
status: built
build_date: "2026-10-03"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/ircd-hybrid/ircd-hybrid/ircd-hybrid-8.2.46/ircd-hybrid-8.2.46.tgz"
  sha256: "a5d5c8f1888fa82fbded7a313456f5a659b871f2ce07e6ff81eb5a8d73f3c74b"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--sysconfdir=/etc/ircd-hybrid"
    - "--with-tls=openssl"
    - "--build=aarch64-linux-ohos"
  dependencies:
    - openssl/3.5.8.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-tempdir-permissions.patch"
  - "0002-ircd-signal-header-include.patch"
  - "0003-avoid-openssl-tls-symbol-collision.patch"
  - "0004-mkpasswd-include-crypt-header.patch"
  - "0005-mkpasswd-portable-hidden-prompt.patch"

binary:
  type: executable
  paths:
    - bin/ircd
    - bin/mkpasswd
  modules: lib/ircd-hybrid/modules/*.la

conan:
  package_type: application
  verified: true
  verify_date: "2026-10-03"
  verify_result: "HarmonyOS 6.1.0.117 aarch64 Conan create; consumer test 3/3 PASS including dynamic modules, IRC 001/PING/PONG, and clean shutdown"
