package: ircd-hybrid/8.2.46-dfsg.1
homepage: "https://www.ircd-hybrid.org/"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "ircd-hybrid-8.2.46.tgz (ircd-hybrid-8.2.46/)"
  source_sha256: "a5d5c8f1888fa82fbded7a313456f5a659b871f2ce07e6ff81eb5a8d73f3c74b"
  source_origin: "https://downloads.sourceforge.net/project/ircd-hybrid/ircd-hybrid/ircd-hybrid-8.2.46/ircd-hybrid-8.2.46.tgz"
  top_level_entries:
    - dir: "libltdl/, libio/, src/, modules/, tools/, doc/, help/"
      role: "libtool loader, IRC daemon, dynamic modules, utility, documentation, and help data"
      test_targets: "none found in Automake declarations"
      is_test: false
    - file: "Makefile.am"
      role: "top-level recursive build definition"
      test_targets: "SUBDIRS only; no TESTS or check_PROGRAMS registration"
      is_test: false
    - file: ".github/workflows/irctest-ci.yml"
      role: "upstream CI definition"
      test_targets: "make -C irctest/ hybrid; pytest --controller=irctest.controllers.hybrid --services-controller=irctest.controllers.anope_services -k 'not Ergo and not deprecated'"
      is_test: true
      test_type: "external integration suite"
      irctest_revision: "aaa2e26b6e468112665ad7b15d144574a969b411"
      collected_cases: 517
      selected_cases: 458
      selector_deselected_cases: 59
      controller_filtered_cases: 20
      executed_cases: 438
      passed_cases: 311
      failed_cases: 0
      skipped_cases: 125
      xfailed_cases: 2
      not_run_cases: 0
  scanned_for:
    - "Automake TESTS and check_PROGRAMS declarations"
    - "top-level Makefile.am and recursively included Makefile.am files"
    - "upstream GitHub workflow test commands and dependencies"
  scan_result: "No in-tree Automake tests are registered. Upstream CI also defines an external irctest/pytest live-server integration suite; 458 cases are selected for the hybrid target."
  reason: >-
    `make check` runs during Conan build and discovers no in-tree tests. On HarmonyOS 6.1.0.117 aarch64, the final upstream Hybrid run had 517 collected, 59 excluded by the upstream selector, and 458 selected. Upstream `conftest.py` filters 20 client-side cases when a server controller is used; the remaining 438 server-side results were 311 passed, 125 skipped, 2 xfailed, and 0 failed, with no server-side case left unrun. The 125 skips were runtime capability/feature skips: 85 unsupported IRCv3 capabilities, 14 unsupported SASL mechanisms, 5 unsupported optional commands, 4 absent ISUPPORT tokens, 5 unsupported multi-target extensions, 5 implementation-choice cases, 4 tests marked not consistently implemented, and 3 unsupported mute extban cases. The previous HELP failures passed after testing with the package data in a user-writable prefix; the LIST time test passed with faketime disabled. The Anope 2.1.1 probe failed with hidden cross-module exception RTTI in its stock test build; with a test-only exported exception type, the services subset produced 4 passed and 51 capability skips. These temporary test-environment changes are not part of the ircd package. See notes.md and reports/test-report.md for exact conditions and reasons.

in_tree_registered_test_total: 0
upstream_test_total: 458
upstream_test_count_method: "pinned irctest pytest collection: 517 collected, 59 deselected by the upstream hybrid selectors, 458 selected"
upstream_check_command: "make check"
in_tree_make_check_executed: true
upstream_test_in_build: false
upstream_test_command: "make -C irctest/ hybrid"
upstream_tests:
  - suite: "progval/irctest hybrid integration suite"
    revision: "aaa2e26b6e468112665ad7b15d144574a969b411"
    services: "Anope 2.1.1"
    selected_cases: 458
    controller_filtered_cases: 20
    executed_cases: 438
    passed_cases: 311
    failed_cases: 0
    skipped_cases: 125
    xfailed_cases: 2
    not_run_cases: 0
    not_run_reason: "No server-side item selected for the Hybrid controller remained unrun. The upstream controller hook filtered 20 client-side items before execution; 59 items were excluded by the upstream selector. The services-only selection produced 4 passed and 51 skipped. On the stock HarmonyOS Anope build, the first services probe exposed hidden RTTI for NotImplementedException across the core/module boundary; the final complete run used a temporary Anope test build that exported this exception type."

test_package_tests:
  - file: "test_harmonyos_runtime.py"
    description: "HarmonyOS-native consumer test: query HarmonyOS kernel/product identity, execute the packaged daemon and modules, complete a real loopback IRC NICK/USER welcome (001), verify server PING/PONG, then stop the process."
    command: "python3 test_harmonyos_runtime.py <package>/bin/ircd <package>/lib/ircd-hybrid/modules"
    assertions: 9

test_files:
  - path: "test_package/test_harmonyos_runtime.py"
    test_type: "R34"
    assertion_count: 9

test_package_test_count: 1
