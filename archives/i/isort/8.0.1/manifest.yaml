software: isort
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/8.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.0.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# 构建系统类型（G4门禁必填）
build_system: python

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/ef/7c/ec4ab396d31b3b395e2e999c8f46dec78c5e29209fac49d1f4dace04041d/isort-8.0.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Python包(isort)无需编译，直接下载wheel解压到site-packages即可 | ref: python-pure-pkg-wheel-install"
  - "PyPI包URL需手动提供(--url=)，search_url不覆盖PyPI策略 | ref: pypi-url-manual-init"
  - "pip在HarmonyOS沙箱中超时/SSL失败时，用curl下载wheel再unzip | ref: pip-ssl-curl-wheel-fallback"
  - "Python入口脚本需手动创建到bin/目录 | ref: python-entry-script-manual"
