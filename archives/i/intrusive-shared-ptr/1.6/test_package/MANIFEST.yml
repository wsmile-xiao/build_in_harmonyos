# test_package/MANIFEST.yml — intrusive-shared-ptr 1.6
package: intrusive-shared-ptr/1.6
homepage: "https://github.com/gershnik/intrusive_shared_ptr"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "intrusive_shared_ptr v1.6 (https://github.com/gershnik/intrusive_shared_ptr/archive/refs/tags/v1.6.tar.gz)"
  source_sha256: "b11784fe0687894f0482977f44277aa7944153726a54e48f7b0559f86a0e7d53"
  build_system: "CMake"
  test_definition: >
    test/CMakeLists.txt 将 13 个测试源分别构建为 test-17-headers 和
    test-20-headers 两个 doctest 可执行文件，并由官方 run-test 目标依次执行。
    两个运行变体各发现 52 个测试用例和 704 个断言，合计 104 个用例、
    1408 个断言。
  dependency: "doctest/2.4.11 (test-only; exact upstream version)"
  portability_changes: []
  examples_note: "none"

upstream_check_command: "rg -n 'TEST_CASE\\(' test --glob '*.cpp'"
upstream_test_in_build: true
upstream_test_command: "build test-17-headers/test-20-headers, then run each by absolute path"

upstream_tests:
  - name: "test-17-headers"
    source: "test/*.cpp (13 files)"
    framework: "doctest"
    command: "<absolute-build-path>/test/test-17-headers"
    test_cases: 52
    assertions: 704
    passed: 52
    failed: 0
    skipped: 0
  - name: "test-20-headers"
    source: "test/*.cpp (13 files)"
    framework: "doctest"
    command: "<absolute-build-path>/test/test-20-headers"
    test_cases: 52
    assertions: 704
    passed: 52
    failed: 0
    skipped: 0

upstream_test_total: 104
upstream_test_passed: 104
upstream_test_failed: 0

test_package_tests:
  - file: test_intrusive_shared_ptr.cpp
    description: "Installed isptr::isptr consumer test for ownership, copy, lifetime and weak-reference APIs"
    command: "./test_intrusive_shared_ptr"
    assertions: 10
  - file: test_intrusive_shared_ptr_ohos.cpp
    description: "OHOS-only AArch64 ABI and atomic refcnt_ptr load/CAS/store/lifetime test"
    command: "./test_intrusive_shared_ptr_ohos"
    assertions: 8

assertion_count: 1426
