# test_package/MANIFEST.yml — intrusive_shared_ptr 1.13
package: intrusive_shared_ptr/1.13
homepage: "https://github.com/gershnik/intrusive_shared_ptr"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "intrusive_shared_ptr v1.13 (https://github.com/gershnik/intrusive_shared_ptr/archive/refs/tags/v1.13.tar.gz)"
  source_sha256: "8fdad3b3e3ca1477421e0035e3aaa08986abca34e737fb30125e2c78f4ecd363"
  build_system: "CMake"
  test_definition: >
    test/CMakeLists.txt 将 14 个测试源分别构建为 test-17-headers 和
    test-20-headers 两个 doctest 可执行文件，并由官方 tests 目标依次执行。
    两个运行变体各发现 55 个测试用例和 727 个断言，合计 110 个用例、
    1454 个断言。
  dependency: "doctest/2.5.2 (test-only; exact upstream version)"
  portability_changes: []
  examples_note: "none"

upstream_check_command: "rg -n 'TEST_CASE\\(' test --glob '*.cpp'"
upstream_test_in_build: true
upstream_test_command: "build test-17-headers/test-20-headers, then run each by absolute path"

upstream_tests:
  - name: "test-17-headers"
    source: "test/*.cpp (14 files)"
    framework: "doctest"
    command: "<absolute-build-path>/test/test-17-headers"
    test_cases: 55
    assertions: 727
    passed: 55
    failed: 0
    skipped: 0
  - name: "test-20-headers"
    source: "test/*.cpp (14 files)"
    framework: "doctest"
    command: "<absolute-build-path>/test/test-20-headers"
    test_cases: 55
    assertions: 727
    passed: 55
    failed: 0
    skipped: 0

upstream_test_total: 110
upstream_test_passed: 110
upstream_test_failed: 0

test_package_tests:
  - file: test_intrusive_shared_ptr.cpp
    description: "Installed isptr::isptr consumer test for ownership, copy, lifetime and weak-reference APIs"
    command: "./test_intrusive_shared_ptr"
    assertions: 10
  - file: test_intrusive_shared_ptr_ohos.cpp
    description: "OHOS-only AArch64 ABI and atomic refcnt_ptr load/CAS/store/lifetime test"
    command: "./test_intrusive_shared_ptr_ohos"
    assertions: 8

assertion_count: 1426
