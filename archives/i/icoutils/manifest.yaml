software: icoutils
display: "icoutils"
description: "Extract and convert Windows icon and cursor resources (ICO/CUR/ANI)"
category: dev
homepage: "https://www.nongnu.org/icoutil/"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools build, no source code patches needed"
    - "libpng.so symlink required (libpng.so → libpng16.so)"
    - "CFLAGS simplified to avoid clang 15 unsupported warning flags"
  common_dependencies:
    - libpng

versions:
  "0.32.3":
    status: published
    build_date: "2026-05-27"