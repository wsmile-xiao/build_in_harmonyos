# test_package/MANIFEST.yml — upstream test declaration (CI L0e).
package: inifile-cpp/master
homepage: "https://github.com/Rookfighter/inifile-cpp"

upstream_test_in_build: true
upstream_test_command: "python3 test_package/run_upstream_tests.py <build>/unit_tests"

upstream_tests:
  - file: upstream_tests/main.cpp
    source: inifile-cpp-master/test/main.cpp
    description: "Catch2 main module"
  - file: upstream_tests/test_inifile.cpp
    source: inifile-cpp-master/test/test_inifile.cpp
    description: "upstream parser, writer, conversion and error-path tests"

test_package_tests:
  - file: run_upstream_tests.py
    description: "run the unmodified upstream Catch2 binary"
    command: "python3 run_upstream_tests.py <build>/unit_tests"

test_dependencies:
  - ref: catch2/2.13.10-r0
    purpose: "Catch2 v2 upstream test framework; supplied as a Conan test dependency instead of a vendored header"

assertion_count: 181
