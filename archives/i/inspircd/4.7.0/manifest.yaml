version: "4.7.0"
software: inspircd
status: built
build_system: perl-configure-make

source:
  url: "https://github.com/inspircd/inspircd/archive/refs/tags/v4.7.0.tar.gz"
  sha256: "fcad041a46f1d7c635ba2ed41d7bcef1cfa2510a5692ac98b34f90420187c97b"
  tar_format: tar.gz

build:
  system: perl-configure-make
  configure_options:
    - "--prefix=/"
    - "--disable-auto-extras"
    - "--disable-ownership"
    - "--disable-interactive"
  dependencies: []
  build_dependencies: []
  cc: clang
  cxx: clang++
  build_command: "sync sources to $TMPDIR/inspircd-src + real-write probe + copy-only -w relax, then perl configure + make (jobs from tools.build:jobs) + make DESTDIR=<package> install"
  install_layout: "--prefix=/ with DESTDIR: bin/inspircd, modules/*.so, conf/examples, manuals, scripts"

patches_applied: []

binary:
  type: executable
  path: bin/inspircd
  modules: modules/core_*.so (auto-loaded at startup) + modules/m_*.so (standard set, extras disabled)
  tools:
    - inspircd

conan:
  verified: false
  verification_note: "待 HMBS 真机预检（conan create）通过后由后端统一更新"

knowledge_gained:
  - "InspIRCd 4 的 Configure 是 perl 程序（use v5.26.0，只用核心模块），任一选项即进入非交互模式；CXX 取 conan build env，socket engine 按 epoll/kqueue/poll/select 顺序探测，main.mk 透传 CPPFLAGS/CXXFLAGS/LDFLAGS"
  - "--disable-auto-extras 关闭全部依赖型 extra 模块（ssl/mysql/pgsql/sqlite3/ldap/pcre2/re2/maxminddb/argon2…），核心零外部 requires；该模式下不强制 TLS 模块"
  - "core_*.so 由服务器启动时从模块目录自动加载（LoadCoreModules），package() 必须校验其存在，否则拒绝出包"
  - "上游无任何自动化测试（main.mk 无 check/test 目标；make/test/ 只是 configure 探测；irctest 为外部 harness），MANIFEST 按 no_tests + 审计申报"
