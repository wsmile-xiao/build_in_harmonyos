# test_package/MANIFEST.yml — inspircd 4.7.0
# 上游测试盘点（与官方 v4.7.0 同版本的统计口径一致）：
# 上游发布包内没有任何自动化测试：make/template/main.mk 只定义
# all/clean/configureclean/debug/install/deinstall/distclean 等目标，
# 无 check/test/installcheck 目标；make/test/*.cpp 是 Configure 在构建期
# 编译并运行的特性探测（编译器/arc4random/clock_gettime/getentropy/
# kqueue 头文件），不是注册测试；上游 CI 的质量门是外部 irctest pytest
# 套件（.github/workflows/ci-irctest.yml），需 live server + Anope/Atheme
# 服务，无法在 conan 构建内运行。故 upstream_tests_exist: false。

package: inspircd/4.7.0
homepage: "https://www.inspircd.org/"

upstream_tests_exist: false
upstream_test_audit:
  source_tarball: "v4.7.0.tar.gz (inspircd-4.7.0/, 602 members)"
  source_sha256: "fcad041a46f1d7c635ba2ed41d7bcef1cfa2510a5692ac98b34f90420187c97b"
  source_origin: "https://github.com/inspircd/inspircd/archive/refs/tags/v4.7.0.tar.gz"
  top_level_entries:
    - dir: "inspircd-4.7.0/src/ (+ coremods/, modules/)"
      role: "C++17 server core, core command modules, loadable m_*.cpp modules"
      test_targets: "none (no TEST()/assert harness, no test subdir)"
      is_test: false
    - dir: "inspircd-4.7.0/include/"
      role: "public C++ headers"
      test_targets: "none"
      is_test: false
    - dir: "inspircd-4.7.0/make/test/"
      role: "Configure-time probes only: compiler.cpp, arc4random_buf.cpp, clock_gettime.cpp, getentropy.cpp, kqueue.cpp (compiled AND executed by perl Configure to detect features, results cached in .configure/cache.cfg)"
      test_targets: "none (not registered anywhere, no pass/fail accounting)"
      is_test: false
    - file: "inspircd-4.7.0/make/template/main.mk"
      role: "hand-written makefile template rendered by Configure"
      test_targets: "none (targets: all/clean/configureclean/debug/install/deinstall/distclean/finishmessage/help/mod-header/std-header/target only; verified by target-name scan)"
      is_test: false
    - dir: "inspircd-4.7.0/.github/workflows/"
      role: "CI definitions (ci-linux/macos/windows/alpine/irctest)"
      test_targets: "ci-irctest.yml runs the EXTERNAL irctest pytest harness against an installed live server with Anope/Atheme services — not bundled, needs pytest + network services"
      is_test: false
    - dir: "inspircd-4.7.0/tools/ (convert-unreal-*, directive, mkauthors, mkdescriptions, mkheaders, testssl)"
      role: "packaging/migration helper scripts; testssl is a TLS helper script installed as inspircd-testssl, not a test runner"
      test_targets: "none"
      is_test: false
    - dir: "inspircd-4.7.0/vendor/ (fmt, http_parser, lyra, md5, sha2, bcrypt, utfcpp)"
      role: "vendored third-party sources"
      test_targets: "none"
      is_test: false
  scanned_for:
    - "tests/ / test/ / t/ / spec/ directories"
    - "*test*.cpp / *check* files with test semantics"
    - "Makefile check / test / TESTS / check_PROGRAMS targets"
    - "CMakeLists.txt enable_testing / add_test / BUILD_TESTING"
    - "GTest / CUnit / pytest / TEST() macros in src/"
  scan_result: "0 matches — only hits are make/test/ configure probes and tools/testssl helper script, neither is a runnable test suite"
  reason: "inspircd 4.7.0 ships zero in-tree automated tests; upstream quality gate (irctest) is external-only and cannot run inside a conan build."

upstream_test_total: 0
upstream_test_count_method: "auto"
# Upstream has no suite, so there is no check command to discover or run.
# Must stay empty: the HMBS lister treats a non-empty value as
# "upstream has tests" and rejects no_tests/0.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_inspircd.sh
    description: "消费者功能测试 5 项：二进制存在/可执行/非空、--version 输出 InspIRCd-4.7.0 横幅、最小配置启动并监听 127.0.0.1 端口、真实 IRC 握手（NICK/USER 后收到 001 welcome 并 QUIT）、干净关闭后端口释放（R34 合规，非空输出+精确内容断言）"
    command: "<shell> test_inspircd.sh（INSPIRCD_BIN 指向包内 bin/inspircd，INSPIRCD_MODDIR 指向包内 modules）"

test_files:
  - path: "test_package/test_inspircd.sh"
    test_type: "R34"
    assertion_count: 5

test_package_test_count: 1
consumer_assertion_count: 5
assertion_count: 5
