# test_package/MANIFEST.yml
# inih r58 — upstream sh-based tests are not integrated into conan build;
# validation is performed through test_package consumer-side tests below.

package: inih/r58
homepage: https://github.com/benhoyt/inih

# inih ships a unittest.sh (bash) that runs test programs.
# Those programs need to be compiled separately — not run through conan build().
upstream_check_command: "cd tests && python3 ../extra/meson/meson_test.py --build-dir=../build"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_inih.c
    description: "inih API 验证: ini_parse_string 基本解析 / 多 section / 注释忽略 / 错误检测 / 空输入处理"
    command: "./test_inih"

# 测试断言总数 (6 组测试, 每组多个断言)
assertion_count: 15
