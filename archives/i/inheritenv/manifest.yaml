software: inheritenv
display: "inheritenv"
description: "GNU Emacs Lisp 包：让临时缓冲区继承缓冲区局部环境变量（process-environment/exec-path），纯 Elisp 数据包"
category: library
homepage: "https://github.com/purcell/inheritenv"
license: GPL-3.0-or-later
build_system: none

ohos_adaptation:
  key_points:
    - "纯 Emacs Lisp 数据包（.el 源文件），无 C 编译无链接，装到 lib/site-lisp（ace-link 先例范式）"
    - "上游 Makefile 的 compile/package-lint/test 目标均需 Emacs 运行时与 MELPA 网络，配方构建期不执行（R1）"
    - "测试探针在宿主有 emacs 时原样运行上游 ERT 测试命令（inheritenv-test-propagation）"
    - "任务平台标签为 C++，实为 Emacs Lisp 包，已按数据包先例适配并在笔记中说明"
  common_dependencies: []

versions:
  "0.2":
    status: built
    build_date: "2026-09-24"
