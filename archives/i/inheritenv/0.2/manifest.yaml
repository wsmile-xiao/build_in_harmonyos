knowledge_gained:
  - "任务平台标签为 C++，实为 Emacs Lisp 包（purcell/inheritenv），发行包内无任何 C/C++ 源码，按 ace-link 纯数据包先例适配"
  - "上游发行含 ERT 测试套件（inheritenv-tests.el，1 用例 3 个 should 断言：默认不继承/宏内继承/advice 后继承），GitHub Actions CI 矩阵覆盖 Emacs 24.4–28.2 全绿"
  - "上游 Makefile 的 test 目标仅需 emacs -Q --batch 加载两文件；package-lint 目标需从 MELPA 联网安装依赖，compile 为字节编译"
  - "GitHub tag 0.1 与 0.2 均存在，0.2 为最新（Package-Requires emacs 24.4）；仓库无 LICENSE 文件，GPL 声明在 .el 文件头"
  - "github.com 归档 URL 与 codeload.github.com 返回字节一致（sha256 实测相同），主 URL 用 github.com 官方形式"
  - "真机（OHOS 6.0 armv8）conan-verify 8 道门禁全绿（G0-G4 PASS，L2/L4/L5 纯数据包按框架跳过），探针 3 组静态断言全过、宿主无 emacs 时上游 ERT 按设计跳过并显式注明，exit 0"
  - "当前配方模板要求 conandata 用 sources 段、conanfile 提供 export_sources()/apply_conandata_patches()（ace-link 老模板 source 段会被 G1 判定缺 sources 段）"
upstream_test_pass_rate: "100%（上游 CI，Emacs 24.4–28.2 矩阵全绿）；宿主无 emacs 时 ERT 套件跳过并注明"
adapted_test_pass_rate: "真机实跑 100%（3 组静态断言全过，exit 0）；第 4 组上游 ERT 为条件执行：宿主有 emacs 原样执行上游测试命令、无 emacs 显式注明跳过（真机无 emacs，已按设计跳过）"
test_command: "conan create . --build=missing"
