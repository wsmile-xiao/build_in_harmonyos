package: inheritenv/0.2
homepage: "https://github.com/purcell/inheritenv"

# 上游测试命令（Makefile 各目标；package-lint 需 MELPA 联网，compile 为
# 字节编译，均属 Emacs 运行时范畴，适配构建期不执行）
upstream_check_command: "make (compile + package-lint + test)"
upstream_test_in_build: false
upstream_test_command: "emacs -Q --batch -l inheritenv.el -l inheritenv-tests.el -f ert-run-tests-batch-and-exit"

# 上游实际运行的测试程序
upstream_tests:
  - file: inheritenv-tests.el
    source: https://github.com/purcell/inheritenv/blob/0.2/inheritenv-tests.el
    description: >-
      ERT 测试套件：inheritenv-test-propagation 验证临时缓冲区经 inheritenv
      宏正确继承缓冲区局部 process-environment（默认不继承 + 宏内继承 +
      add-advice 改造后的函数继承，3 个 should 断言）
    command: "emacs -Q --batch -l inheritenv.el -l inheritenv-tests.el -f ert-run-tests-batch-and-exit"

# test_package 中自带的测试
test_package_tests:
  - file: test_inheritenv.py
    description: >-
      校验 lib/site-lisp 下 inheritenv.el / inheritenv-tests.el 在位非空；
      inheritenv.el 六个发行标记（文件头、Version 0.2、provide、inheritenv
      与 inheritenv-add-advice 两个 defmacro、GPL 许可头）；tests 文件 ERT
      用例标记；宿主有 emacs 时原样运行上游 ERT 套件并检查退出码（无
      emacs 时跳过并注明）。
    command: "test_inheritenv.py <package-folder>"

# 测试断言总数
assertion_count: 4
