# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: itpp/4.3.1
homepage: "https://sourceforge.net/projects/itpp/"

# 上游测试命令 — itpp gtests（需 GTEST_DIR 指向 gtest 源码）
upstream_check_command: "cmake -DOLD_TESTS=ON -DGTEST_DIR=... .. && cmake --build ."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-17 实测记录）：
# - gtests/ 目录 65 个测试源（array/bessel/cholesky/det/eigen/commfunc/
#   converters/circular_buffer 等，gtest 框架，需 GTEST_DIR 外部 gtest 源码）
# - 实测 8 个代表性子测试：4 PASS（array/bessel/converters/circular_buffer）
#   / 4 FAIL（cholesky/det/eigen rc=134 SIGABRT——BLAS/LAPACK 相关测试，
#   本地未链接 BLAS 致崩溃，如实记录；commfunc 编译失败）——通过率 4/8，
#   不臆造
upstream_tests:
  - file: gtests/
    source: itpp-4.3.1/gtests/
    description: "上游 gtest 回归测试（65 个测试源；实测 8 子测试 4 PASS / 4 FAIL，BLAS 相关 SIGABRT 如实记录）"
    command: "cmake -DOLD_TESTS=ON -DGTEST_DIR=... .. && cmake --build ."

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_itpp.cpp
    description: "消费者测试：itpp vec（sum/dot）+ mat（det）真实 API 数学验证（R34）"
    command: "clang++ test_itpp.cpp -std=c++17 -I<include> -L<lib> -litpp -o test_itpp_cpp && ./test_itpp_cpp"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 3
