# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: imapfilter
display: "imapfilter"
description: "Mail filtering tool that connects to IMAP servers and applies Lua-scripted rules to messages"
category: mail
homepage: "https://github.com/lefcha/imapfilter"
license: "MIT"
build_system: makefile

ohos_adaptation:
  key_points:
    - "Raw recursive Makefile build; deps (lua/pcre2/openssl) injected from Conan graph via INCDIRS/LIBDIRS (R33/R49)"
    - "No source patches required: compiles/links cleanly with OHOS clang 15"
    - "Static deps from ohpcd artifact repo; binary is standalone (NEEDED: libc/libm/libdl only)"
    - "Command-line tool: commands.json declared at software level (R38)"
  common_dependencies:
    - lua
    - pcre2
    - openssl

versions:
  "2.8.3":
    status: built
    build_date: "2026-09-21"
