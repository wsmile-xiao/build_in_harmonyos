# test_package/MANIFEST.yml — 上游官方测试声明
# R51 清点证据：imapfilter 2.8.3 上游源码包中无任何自动化测试套件：
#   - 无 tests/ 目录（find . -iname '*test*' 仅命中 doc/samples，无命中）
#   - 顶层与 src/ Makefile 均无 check/test 目标（无 make check）
#   - 非 cmake/meson 工程，无 ctest/pytest 注册
# 上游验证方式为手工运行（README/doc/imapfilter.1），因此本包按 R51
# "上游确无测试" 处理，并在 test_package 中补齐消费者功能测试（3 项）。

package: imapfilter/2.8.3
homepage: "https://github.com/lefcha/imapfilter"

# 上游测试命令：上游确无测试目标（Makefile 无 check/test 目标）
upstream_check_command: "make check（上游不存在该目标，已核验）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（清点证据见文件头注释）
upstream_tests: []

# test_package 中自带的测试（补齐的消费者功能测试，真机实测通过）
test_package_tests:
  - file: test_package/test.sh
    description: "imapfilter -V 输出 IMAPFilter 2.8.3 版本横幅且退出码 0"
    command: "imapfilter -V"
  - file: test_package/test.sh
    description: "imapfilter -h 打印 usage 选项说明且退出码 0（选项解析验证）"
    command: "imapfilter -h"
  - file: test_package/test.sh
    description: "包内 share/imapfilter 下 8 个 Lua 运行时模块齐全（二进制每次运行都会从编译期内置 SHAREDIR 加载）"
    command: "test.sh <package>/share/imapfilter"

# 测试断言总数（3 项：退出码 + 关键输出 + 打包完整性）
assertion_count: 3
