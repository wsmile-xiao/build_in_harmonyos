# 软件级 manifest — ink-generator
# 遵循 ARCHIVE-SPEC v3.0

software: ink-generator
display: "ink-generator"
description: "ink!（Rust 智能合约）代码生成器，以 wasm-bindgen npm 模块形式发布（预构建 wasm、零依赖）"
category: application
homepage: "https://github.com/Smart-Beaver/ink-generator-wasm"
license: Apache-2.0
build_system: none

ohos_adaptation:
  key_points:
    - "npm 包形态（wasm-bindgen 产物）：`ink_generator.js`（ESM）+ `ink_generator_bg.js`（胶水）+ **预构建 `ink_generator_bg.wasm`**；npm 发布物**零依赖**、无 bin/scripts → 无需 Rust/wasm 工具链，也没有依赖缺口"
    - "**版本披露**：比赛列表写 0.4，但 npm 上无 0.4（最高 0.3.8）→ 按既定规则用最新可获取版本 0.3.8，并在 manifest/notes/PR 三处披露"
    - "产物落 `res/ink-generator/`（JS/wasm 模块无 include/lib 语义，用 resdirs 暴露）"
    - "上游测试在 Rust 侧（cargo test），本环境无 Rust 工具链（rustup 拒绝 HarmonyOS）→ 上游通过率 N/A 并披露；功能验证由消费者侧 **Node 端到端**承担（真加载 wasm + 调 `start()`）"
    - "**可行性判据**：同属 Rust 系的 install-mimic 因必须 cargo 编译而系统级不可用（放弃），而本包因发布物已含构建产物而完全可行——看'发布物是否已含构建产物'，不看实现语言"
  common_dependencies: []

versions:
  "0.3.8":
    status: built
    build_date: "2026-10-08"
    conan_ref: "ink-generator/0.3.8"
