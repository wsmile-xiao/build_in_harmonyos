# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点（R51）：
#   上游仓库（Smart-Beaver/ink-generator-wasm）的测试在 **Rust 侧**（cargo test / wasm-bindgen 测试），
#   而本环境**没有 Rust 工具链**（rustup 明确拒绝 HarmonyOS：`error: unrecognized OS type: HarmonyOS`；
#   同族 cargo 配方依赖 brew，本机无 brew）→ 上游测试**无法在此环境运行**，记 N/A 并如实披露。
#   本包为 **npm 预构建产物**（`ink_generator_bg.wasm` 已由上游编译好），故**不需要** Rust/wasm 工具链。

package: ink-generator/0.3.8
homepage: "https://github.com/Smart-Beaver/ink-generator-wasm"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

release_smoke_tests:
  - file: "res/ink-generator/ink_generator_bg.wasm"
    source: "npm 发布 tarball（上游预构建的 wasm-bindgen 产物）"
    description: "wasm 合法（magic \\0asm、version=1）；用 Node 手动实例化并调用 start() 成功"
    command: "python3 check_ink_generator.py <package-folder>"

test_package_tests:
  - file: check_ink_generator.py
    description: "消费者校验 4 项：①模块文件齐备（7 个）②wasm 合法（magic+version）③API 面存在（start/Contract/Standard/OutputFile）④**Node 端到端真跑**——手动实例化 wasm（`__wbg_set_wasm`，绕开 Node 对 .wasm ESM 导入的限制）、构造 Contract、调 start() 并断言成功返回；宿主无 node 按具名环境信号 SKIP"
    command: "python3 check_ink_generator.py <package-folder>"

assertion_count: 4
