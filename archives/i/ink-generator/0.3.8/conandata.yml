# conandata.yml — ink-generator 0.3.8
#
# 上游是 **npm 包**（wasm-bindgen 产物：JS 包装 + 预构建 wasm），仓库：
#   https://github.com/Smart-Beaver/ink-generator-wasm （Apache-2.0，包内另附 MIT 许可文件）
#
# 版本说明（如实披露）：比赛列表写的是 **0.4**，但 npm registry 上**没有 0.4**
#   （全部版本 0.3.1…0.3.8，latest = 0.3.8）→ 按既定规则**用最新可获取版本 0.3.8**。
#
# 依赖：**零依赖**（`dependencies: {}`）且无 `bin`/`scripts` → 无需在 build 期从 npm 源取任何依赖，
#   也就不存在"依赖缺口"；包内 `ink_generator_bg.wasm` 是**预构建产物**，
#   **不需要 Rust/wasm 工具链**（这点与同为 Rust 系但需 cargo 的 install-mimic 截然不同）。
#
# 上游测试：仓库的测试在 **Rust 侧**（cargo test / wasm-bindgen 测试），本环境无 Rust 工具链
#   （rustup 拒绝 HarmonyOS）→ 上游测试记 **N/A 并如实披露**；功能验证由 test_package 的
#   **Node 端到端校验**承担（真加载 wasm 并调用 `start()`）。

