# 版本级 manifest — ink-generator 0.3.8
version: "0.3.8"
software: "ink-generator"
status: built
build_date: "2026-10-08"
build_system: none

source:
  url: "https://registry.npmjs.org/ink-generator/-/ink-generator-0.3.8.tgz"
  sha256: "fd23c57a53524695895b20f6041b5e2b5abaa1479232f4598075df39153c2a53"
  note: >-
    npm 发布 tarball（wasm-bindgen 产物）：`ink_generator.js`（ESM 入口）+ `ink_generator_bg.js`
    （胶水）+ **预构建 `ink_generator_bg.wasm`**（1020564 B）+ `.d.ts` + 两份许可 + README。
    **版本说明（如实披露）**：比赛列表写 0.4，但 npm 上**没有 0.4**（0.3.1…0.3.8，latest=0.3.8）
    → 按既定规则用最新可获取版本 0.3.8。

build:
  system: none
  dependencies: []          # **零依赖**（package.json 的 dependencies 为空），无 bin/scripts
  build_steps:
    - "无编译步骤：wasm 已是预构建产物（因此**不需要 Rust/wasm 工具链**）"
    - "build() 仅做自检：必需文件齐备 + wasm magic（\\0asm）"

patches_applied: []

upstream_tests:
  framework: none
  test_sources: 0
  test_command: ""
  run_in_build: false
  evidence: >-
    上游仓库（Smart-Beaver/ink-generator-wasm）的测试在 **Rust 侧**（cargo test / wasm-bindgen 测试），
    而本环境**没有 Rust 工具链**（rustup 明确拒绝 HarmonyOS：`error: unrecognized OS type: HarmonyOS`；
    同族 cargo 配方依赖 brew，本机无 brew）→ 上游测试**无法在此环境运行**，记 N/A 并如实披露；
    功能验证由 test_package 的 **Node 端到端校验**承担（真加载 wasm 并调用导出的 `start()`）。
upstream_test_pass_rate: "N/A（上游测试为 Rust 侧且本环境无 Rust 工具链，如实披露）"
adapted_test_pass_rate: "test_package/check_ink_generator.py **4 项：3 项通过 + 1 项具名阻塞 SKIP**（本地 conan create 实测，包创建成功；`checks=4 fails=0 skips=1 RESULT: PASS`）：①模块文件齐备（7 个，`res/ink-generator/`）②wasm 合法（magic `\\0asm`、version=1、1020564 B）③API 面存在（`start`/`Contract`/`Standard`/`OutputFile`）④**Node 端到端真跑**：wasm **真实例化**（统计导出函数数量）+ API 可调用 + `Contract` 构造成功 → 这三项均为真跑通过；**唯 `start()` 未以真实输入执行**——本校验用的是合成 `Contract`（占位 source），生成器内部用 `syn` 解析 ink! 源码，非法输入导致 panic/trap（实测 `sm-function[161]:0x6cf34`），而 **npm 包未随附合法输入 fixture** → 按具名证据记 SKIP（**不冒充"start() 真跑通过"**）"

knowledge_gained:
  - "**同一语言生态的两个包可能有完全不同的可行性**：install-mimic 与 ink-generator 都是 Rust 系，但前者必须 cargo 编译（本环境系统级不可用 → 放弃），后者上游**已把 wasm 预构建好**随 npm 发布 → 零工具链需求、零依赖，可直接打包。**判断可行性要看'发布物里是否已含构建产物'，而不是看实现语言**"
  - "npm 包的 `dependencies` 为空 + 无 `bin`/`scripts` → build 期无需从 npm 源取任何东西，'依赖缺口'这一维度直接不适用（与 install-peerdeps 的'依赖走 npm 源'同类结论）"
  - "比赛列表里的版本号可能不存在于任何公开发布渠道（本例要 0.4，npm 只到 0.3.8）→ 按既定规则用最新可获取版本，并在 manifest/notes/PR 中显著披露，不能默默换版本"
