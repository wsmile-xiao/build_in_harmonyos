package: indigo/1.4.3
homepage: "https://github.com/epam/Indigo"
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests_exist: true
upstream_test_total: 1
upstream_test_count_method: ctest_entries
upstream_test_audit: "Tarball Indigo-indigo-1.4.3 (3094 entries) audited: CMake-registered CTest suite in recipe scope (build_scripts/indigo) is exactly 1 test - DEFINE_TEST(indigo-c-test-shared, api/tests/c/indigo-test.c) in api/CMakeLists.txt. Full indigo-all adds dlopen-test but it requires bingo/renderer/inchi plugin libs not built here. Wider suites exist outside the CMake gate and are not runnable in this recipe: api/tests/python (~80 scripts via test.py, needs Python wrapper + rendering reference data), Java/dotnet tests (need JDK/.NET), bingo-elastic/service tests (need Elasticsearch/DB)."
upstream_tests:
  - name: indigo-c-test-shared
    description: "Core C API smoke test (version, molecule load, canonical SMILES, transform, reaction gross formula)"
    command: "ctest -R indigo-c-test-shared"
test_package_tests:
  - file: test_indigo.c
    description: "Indigo C API consumer (version, SMILES round-trip, reaction gross formula)"
    command: "test_indigo"
assertion_count: 7
