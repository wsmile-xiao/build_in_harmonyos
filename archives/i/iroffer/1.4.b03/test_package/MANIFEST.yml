# test_package/MANIFEST.yml — iroffer 1.4.b03
# R34/R51: test_package 必须实质执行被测包；上游测试必须清点后再声明

package: iroffer/1.4.b03
homepage: "https://tracker.debian.org/pkg/iroffer"

# ---------------------------------------------------------------------------
# 上游测试清点（R51 三步法 · 第 1 步）
# ---------------------------------------------------------------------------
# 清点依据（同一份 Debian pristine .orig，sha256 03a6ea4e…e507，共 24 个文件）：
#   * 目录：src/ 与顶层，均无 tests/、test/、t/、check/ 任何命名的目录或文件
#     （find 全量列举见 notes.md「上游测试资产」节）。
#   * 构建系统：顶层只有自研 sh 脚本 Configure + Makefile.config 模板；
#     生成的 Makefile 目标全集为
#     all / convertxdccfile / iroffer / iroffer_chroot / src-doc / tar / winbin /
#     clean / install —— **没有 check 也没有 test 目标**。
#   * 无 ctest / prove / pytest / TAP 注册，无任何 .t/.exp/expected 输出语料。
upstream_check_command: "make check   # -> make: Fatal: No rule to make target 'check'"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# ---------------------------------------------------------------------------
# 第 2 步：实测——上游确实无可跑测试
# ---------------------------------------------------------------------------
# 在 B 机（HarmonyOS PC）编译成功后实跑：
#   make check  → *** Error: No rule to make target 'check'  (rc=2)
# 结论：上游 iroffer 1.4.b03 无正式测试套件（仅 README/WHATSNEW 里的人工使用说明）。

# ---------------------------------------------------------------------------
# test_package 自带的测试（消费者侧新写，不冒充上游测试）
# ---------------------------------------------------------------------------
test_package_tests:
  - file: test.sh
    description: "执行 iroffer 四条确定性命令行分支 + convertxdccfile 的真实 .xdcc→.state 数据往返；产物头部按上游写 state 的源码（src/iroffer_statefile.c:93-94/223-234/246-267、Configure:8/21）逐字节校验 magic、格式版本、版本条目 tag+length，以及偏移 16 的版本串前缀"
    command: 'bash test.sh'

# 断言总数 16：
#   1-2  iroffer -v                rc=0 + "iroffer v1.4.b03"
#   3-4  iroffer (无参)            rc=0 + "no configuration file specifed"（上游原拼写）
#   5-6  iroffer -h                rc=0 + "unrecognized option"
#   7-9  iroffer -d -n -s 不完整配置 rc=1 + "Starting up" + "Config File Missing"
#   10-11 convertxdccfile (无参)    rc=1 + "Usage:"
#   12-14 convertxdccfile 空表转换   rc=0 + .state 头 8 字节 = "IRFR"+htonl(1)
#                                + 版本条目 tag=htonl(1<<8)、length 为 4 的倍数且 28..252
#                                + 偏移 16 起逐字节 "iroffer v1.4.b03 ["
#   15-16 convertxdccfile 坏输入     rc=1 + "syntax error"
#
# 13-14 两条的**判据形态**（2026-09-27 整改，结论未变、证据更硬）：
#   旧形态对二进制产物用 `grep -a -q`。同一份 252 B 产物实测：GNU grep 3.12
#   （/data/service/hnp/bin/grep）rc=0，toybox 0.8.12 的 grep（/usr/bin、/system/bin、
#   /bin）rc=1 且**不报错** —— 即旧断言把结论押在"PATH 上恰好是 GNU grep"这一环境属性上，
#   CI worker 的 test 阶段（VirtualRunEnv 只把包目录加进 PATH，profile 的 hnp 路径属于
#   [buildenv]）因此红在第 14 条。新形态只用 `od -An -tx1/-tu1` 与 `head -c | tail -c`
#   做偏移级切片（两侧读数逐字一致，见 notes.md 的实拍表），**不再对二进制文件用 grep**。
#
# 有意排除、且如实披露的一条分支：`iroffer -c`（口令加密生成器）。
#   它经 getpass 类例程读口令，实测退出码**随有无控制终端而变**：
#   有 tty → rc=1；无 tty（`| printf …` 或 `< /dev/null`）→ 阻塞至 timeout(124)。
#   不可复现的行为不写成断言（放宽成"1 或 124"等于没有断言），故整条撤下并在此记录。
assertion_count: 16
