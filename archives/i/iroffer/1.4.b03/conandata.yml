# conandata.yml — iroffer 1.4.b03
#
# 取源自证（上游官网已死，详见 notes.md「取源」节）：
#   * 上游 iroffer.org 在本环境 DNS 不复存在（curl: Could not resolve host），
#     SourceForge 的 projects/iroffer 与 projects/iroffer-dinoex 均 404；
#     Debian 侧 debian/watch 把上游版本直接改写成 "0.No-Site"（FakeWatchNoUpstreamSite-
#     ForThisPackage），即 Debian 官方也认定"无上游站点"。
#   * 因此取用 Debian pristine .orig（未打 Debian 补丁的上游原tarball；解包后只有
#     Configure/Makefile.config/src 等 24 个上游文件，无 debian/ 目录，
#     Configure 内含 VERSION=1.4.b03，与任务版本逐字一致）。
#   * 三方同哈希：deb.debian.org 下载自算 == iroffer_1.4.b03-9.dsc 的
#     Checksums-Sha256 行 == ftp.debian.org 独立主机下载自算，均为下面这个值。
sources:
  url: "https://deb.debian.org/debian/pool/main/i/iroffer/iroffer_1.4.b03.orig.tar.gz"
  sha256: "03a6ea4e8c7e644d157d0846076d1eb30cc3ef777f9f97a39aaa964df3f2e507"

patches:
  - patch_file: "patches/0001-Configure.patch"
    patch_description: "Teach the 2005 hand-written Configure about HarmonyOS (map uname -s onto the existing Linux branch) and let it honour $CC, since the device ships clang only with no gcc/cc on PATH"
    patch_type: "portability"
    sha256: "da68036fcc1dc02d1195bf02b6ada5e9a7865e946f95d29e43ddc5192f9ca0ed"
