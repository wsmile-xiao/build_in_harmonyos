# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: isl/0.28
homepage: "https://libisl.sourceforge.io/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (automake TESTS 注册的 16 个入口)
upstream_tests:
  - file: isl_test.c
    source: isl-0.28/isl_test.c
    description: "主 C 测试（79 个注册命名用例：解析/值运算/集合映射/凸包/调度等）"
    command: "./isl_test"
  - file: isl_test_int.c
    source: isl-0.28/isl_test_int.c
    description: "整数接口数据驱动测试（123 用例）"
    command: "./isl_test_int"
  - file: isl_test_imath.c
    source: isl-0.28/isl_test_imath.c
    description: "imath 后端内部约定测试"
    command: "./isl_test_imath"
  - file: isl_test2.cc
    source: isl-0.28/isl_test2.cc
    description: "C++ API 测试（14 注册用例）"
    command: "./isl_test2"
  - file: isl_test_cpp.cc
    source: isl-0.28/isl_test_cpp.cc
    description: "C++ 绑定测试（9 用例）"
    command: "./isl_test_cpp"
  - file: isl_test_cpp17.cc
    source: isl-0.28/isl_test_cpp17.cc
    description: "C++17 绑定测试"
    command: "./isl_test_cpp17"
  - file: isl_test_cpp_failed.sh
    source: isl-0.28/isl_test_cpp_failed.sh
    description: "负向编译检查（验证故意失败的用例不可构建）"
    command: "./isl_test_cpp_failed.sh"
  - file: isl_test_python.py
    source: isl-0.28/isl_test_python.py
    description: "Python 绑定测试（11 顶层用例）"
    command: "./isl_test_python.py"
  - file: codegen_test.sh
    source: isl-0.28/codegen_test.sh
    description: "isl_codegen 数据驱动脚本测试"
    command: "./codegen_test.sh"
  - file: pip_test.sh
    source: isl-0.28/pip_test.sh
    description: "isl_pip 参数整数规划脚本测试"
    command: "./pip_test.sh"
  - file: bound_test.sh
    source: isl-0.28/bound_test.sh
    description: "isl_bound 上界脚本测试"
    command: "./bound_test.sh"
  - file: flow_test.sh
    source: isl-0.28/flow_test.sh
    description: "isl_flow 数据流分析脚本测试"
    command: "./flow_test.sh"
  - file: schedule_test.sh
    source: isl-0.28/schedule_test.sh
    description: "isl_schedule 调度脚本测试"
    command: "./schedule_test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: consumer.c
    description: "消费者用例：模拟编译器多面体调度业务场景，使用 isl_schedule 公开 API 计算调度"
    command: "./isl_consumer"
  - file: isl_ohos_test.c
    description: "HarmonyOS 专项测试：imath 多精度大整数/gcd/集合基数/映射合成/版本号"
    command: "./isl_ohos_test"

# 测试断言总数
assertion_count: 244