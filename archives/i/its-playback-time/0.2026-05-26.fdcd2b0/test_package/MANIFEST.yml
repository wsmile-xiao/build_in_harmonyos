# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
package: its-playback-time/0.2026-05-26.fdcd2b0
homepage: "https://www.chiark.greenend.org.uk/~sgtatham/ipbt/"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (R51: 如实记录，不允许把"没有测试"说成"测试通过")
upstream_test_audit:
  source_tarball: "ipbt-20260527.fdcd2b0.tar.gz"
  source_url: "https://www.chiark.greenend.org.uk/~sgtatham/ipbt/ipbt-20260527.fdcd2b0.tar.gz"
  source_sha256: "5303c8010addf1b2dec5375c8cf32d70e1835545d639ee2183863e09d4e80aa3"
  build_system: "cmake (cmake_minimum_required 3.10); no autotools, no configure script"
  cmake_minimum_required: "3.10"
  top_level_build_files:
    - "CMakeLists.txt          # project(ipbt LANGUAGES C), add_subdirectory(doc|unix|charset), 4 个 add_library/add_executable"
    - "cmake/setup.cmake       # 特性探测 + 生成 cmake_commit.c / licence.h 目标"
    - "cmake/platforms/unix.cmake # check_include_file/check_symbol_exists 探测 + installed_program()"
    - "cmake/gitcommit.cmake   # 生成 cmake_commit.c (源码 git commit 字符串)"
    - "cmake/cmake.h.in        # configure_file 生成 cmake.h"
    - "cmake/gtk.cmake         # GTK/X11 探测 (OHOS 上不存在, GTK_FOUND=false)"
    - "doc/CMakeLists.txt      # 仅用 halibut 重新生成 roff man page"
    - "unix/CMakeLists.txt      # find_package(Curses) + CURSES_NEED_WIDE + ipbt/ipbt-dump 可执行文件"
    - "charset/CMakeLists.txt  # 字符集查表生成"
    - "utils/CMakeLists.txt    # 静态工具库"
    - "Buildscr                # bob 打包脚本, 非构建系统"
  scanned_for:
    - "tests/ test/ spec/ t/ 目录"
    - "add_test / enable_testing / include(CTest) / include(Catch) / gtest / ctest"
    - "TEST( / TEST_F( / def test_ / assert-based unit tests"
    - "全树 find -iname '*test*'"
  scan_result: >-
    唯一匹配是 terminal/bidi_test.c (BidiMirroring 测试数据辅助文件)，它没有被
    顶层 CMakeLists.txt 的 guiterminal 目标
    (terminal/terminal.c terminal/bidi.c terminal/lineedit.c) 引用，也没有任何
    add_executable 指向它，因此既不会被编译也不会被执行。
    全树无 enable_testing()/add_test()，无 CTest/Catch/gtest 依赖，
    无 tests/ 目录，make/ctest 可执行测试数为 0。
  make_check_output: "不适用 —— 上游是 CMake 工程，未定义 check/test 目标，也未调用 enable_testing()"
  reason: >-
    ipbt 是交互式 curses 程序 + 一个非交互转换器，上游不提供单元测试框架。
    功能验证完全由 test_package 真实执行已打包的 ipbt / ipbt-dump 二进制完成。

# 上游测试命令 (不适用: 无测试套件)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false，见上方审计)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质执行被测包的二进制
test_package_tests:
  - file: test.sh
    description: >-
      功能测试 (14 条断言，全部真实执行已打包二进制):
      ipbt --version 精确 "ipbt, source commit <sha>" / --help 含 usage、--utf8-linedraw、-A、-f / --licence 含 PuTTY 版权与 MIT 许可;
      ipbt-dump --version 精确 "ipbt, source commit <sha>" / --help 含 -S、-H、-x 输出模式 / --licence 含 PuTTY 版权与 MIT 许可;
      ipbt-dump -T 默认 SUMMARY 模式输出 ':0:0.000000:offset 0xc len 0xc';
      ipbt-dump -T -S typescript 输出与录制数据逐字节相同 (cmp);
      ipbt-dump -T -H hex dump 含 '68 65 6c 6c 6f' 与 ASCII 列 'hello ipbt';
      ipbt-dump -T -x 屏幕 XML 含 <ttyrecording>/<frame index="0">/hello/</ttyrecording>
      (证明终端模拟器真的把录制文本渲染进屏幕);
      ipbt-dump -R -S raw 模式往返一致;
      错误路径: 无文件名 / 文件不存在 / 未知长选项 三者均非零退出;
      反假阳性: 篡改载荷后 hex dump 输出必须改变; 去掉 -T 后格式自动识别仍选中 ttyrec 并解析出同一帧。
    command: "bash test.sh <pkg>/bin/ipbt <pkg>/bin/ipbt-dump"
  - file: test_ohos_playback.sh
    description: >-
      鸿蒙特有端到端消费者用例 (rule12, 18 条 TAP 断言，全部真实执行已打包二进制):
      bin/ipbt 与 bin/ipbt-dump 存在且为 ELF / 整包不含 .so (ncurses 静态链入) /
      终端库契约 (注入的 TERMINFO 必须是有效目录; 未注入时记录设备自带终端库或走负控
      TERMINFO=/nonexistent 证明转换器不依赖宿主终端库) / 两个程序 --version 输出版本标记 /
      3 帧 ttyrec 全流水线: SUMMARY 帧数与时间戳、typescript 逐字节一致、hex dump 字节与 ASCII 列、
      screen XML 根元素与帧元素与屏幕文本、raw 模式往返、反假阳性 (篡改载荷后 dump 必须变)、格式自动识别。
    command: "bash test_ohos_playback.sh <pkg> [terminfo_dir]"
  - file: conanfile.py
    description: >-
      Conan test() 入口: 声明 ncurses/6.6 运行依赖 (run=True) 并由 conanrun 聚合运行环境提供 TERMINFO,
      另以 _resolve_terminfo() 四级来源兜底并打印命中的来源; 依次执行 test.sh 与 test_ohos_playback.sh,
      输出 HMBS 机器证据标记 (HMBS_TEST_PACKAGE_RESULT discovered=32/passedCount=32,
      HMBS_UPSTREAM_TEST_RESULT status=no_tests discovered=0)
    command: "conan test test_package its-playback-time/0.2026-05-26.fdcd2b0"

# 测试断言总数 (与 HMBS_TEST_PACKAGE_RESULT discovered=32 一致: test.sh 14 + test_ohos_playback.sh 18)
assertion_count: 32