# conandata.yml — its-playback-time 0.2026-05-26.fdcd2b0
#
# Upstream source: Simon Tatham's own site (the canonical distribution point
# for ipbt; the Debian source package `its-playback-time` repackages from
# here).  Verified HTTP 200 before writing this recipe:
#   HEAD https://www.chiark.greenend.org.uk/~sgtatham/ipbt/ipbt-20260527.fdcd2b0.tar.gz
#   -> 200, Content-Length: 360583, Last-Modified: Wed, 27 May 2026 05:00:01 GMT
#
# The upstream tarball name is ipbt-<date>.<git short sha>.tar.gz; its
# version.h says PACKAGE_VERSION "20260527.fdcd2b0" and cmake/gitcommit.cmake
# carries the full commit fdcd2b0ad60f74ffa6a695c992d56c6a3ae20e4a, which is
# where this recipe's version 0.2026-05-26.fdcd2b0 comes from (Debian's
# 0.<upstream-date>.<short-sha> scheme, one day off because of the upstream
# release timezone).
#
# CMakeToolchain injects the OHOS compiler / sysroot / static link flags, and
# the upstream feature probes are all compile-or-link-only
# (check_include_file / check_symbol_exists / check_c_source_compiles /
# check_library_exists), so no try_run and therefore no cross-execution
# emulation is needed.  The single patch below is a portability fix for
# CMake's FindCurses module, not a HarmonyOS workaround: it makes the build
# work on any curses installation that exposes ncurses.h / curses.h directly
# in its include directory instead of under an ncursesw/ subdirectory.
sources:
  url: "https://www.chiark.greenend.org.uk/~sgtatham/ipbt/ipbt-20260527.fdcd2b0.tar.gz"
  sha256: "5303c8010addf1b2dec5375c8cf32d70e1835545d639ee2183863e09d4e80aa3"

patches:
  - patch_file: "patches/0001-curses-header-fallback.patch"
    patch_description: "unix/CMakeLists.txt: probe the resolved curses include directory when FindCurses left all CURSES_HAVE_*_H variables false, so unix/ipbt.c actually includes a curses header"
    patch_type: "portability"