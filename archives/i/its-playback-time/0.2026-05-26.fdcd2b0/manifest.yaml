software: its-playback-time
version: "0.2026-05-26.fdcd2b0"
status: built
build_system: cmake
build_date: "2026-10-04"
created_at: "2026-10-04"
knowledge_gained: []

source:
  url: "https://www.chiark.greenend.org.uk/~sgtatham/ipbt/ipbt-20260527.fdcd2b0.tar.gz"
  sha256: "5303c8010addf1b2dec5375c8cf32d70e1835545d639ee2183863e09d4e80aa3"
  tar_format: tar.gz
  size_bytes: 360583
  http_status: 200
  upstream_commit: "fdcd2b0ad60f74ffa6a695c992d56c6a3ae20e4a"
  upstream_version_h: 'PACKAGE_VERSION "20260527.fdcd2b0"'
  note: >-
    Debian source package name is its-playback-time; upstream tarball and the
    installed programs are ipbt / ipbt-dump. The recipe version uses Debian's
    0.<upstream-date>.<short-sha> scheme, one day off the tarball's 20260527
    because of the upstream release timezone.

build:
  system: cmake
  cmake_minimum_required: "3.10"
  cmake_variables:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DPUTTY_GSSAPI=OFF"
    - "-DSTRICT=OFF"
  cc: "/data/service/hnp/bin/clang (CI) / lpk-fixed shim (local WSL cross)"
  target: "OHOS aarch64 (os=OHOS, arch=armv8, compiler=clang 15, libcxx=libc++)"
  dependencies:
    - "ncurses/6.6 (published on ohpcd, static wide-char libncursesw.a)"

patches_applied:
  - 0001-curses-header-fallback.patch

artifacts:
  - path: "bin/ipbt"
    type: "ELF 64-bit LSB PIE, ARM aarch64, dynamically linked (NEEDED: libc.so only)"
    sha256: "c7b7e20d11a776a82edc2e631dc44ccc4071d1c14b409692b8d714910a5e6d6c"
  - path: "bin/ipbt-dump"
    type: "ELF 64-bit LSB PIE, ARM aarch64, dynamically linked (NEEDED: libc.so only)"
    sha256: "890f90cfa3910472f98d3c65ab5abb7b9aebc84a54c976cbe08a6e1d817baf11"
  - path: "share/man/man1/ipbt.1"
    type: "pre-generated roff man page shipped in the upstream tarball"
  - path: "share/doc/its-playback-time/README"
    type: "upstream README"
  - path: "licenses/LICENCE"
    type: "MIT"

security:
  nx: true        # GNU_STACK is RW, no X
  pie: true       # FLAGS_1 = PIE
  relro: true     # GNU_RELRO segment present
  shared_libs: "none produced; ncurses is linked statically into both binaries"
  fortify: "OHOS SDK clang default _FORTIFY_SOURCE applies (ipbt.c fdopen -> __fd_chk)"

test_results:
  type: manual
  total: 32
  passed: 32
  failed: 0
  breakdown:
    - "test_package/test.sh: 14/14（两个程序的入口、SUMMARY/typescript/hex/XML/raw 转换、错误路径、反假阳性、格式自动识别）"
    - "test_package/test_ohos_playback.sh: 18/18（鸿蒙特有端到端消费者用例，rule12：交付契约 + 3 帧 ttyrec 全流水线）"
  evidence: >-
    2026-10-11 实测：CI 真机构建 #84438 中 test.sh 14/14 通过，test_ohos_playback.sh 17/18
    （唯一失败项为断言 4 `TERMINFO 无效 (got: empty)`）；本轮已修复该断言并本地复现为
    `ok 4 - TERMINFO 指向有效目录（注入：…/ncurses/6.6/share/terminfo）`，修复后真机复跑待 CI 队列出结果。
    本地 `conan test`（profile ohos-aarch64-wsl）与真机同源，唯一差异是断言 5 在 x86_64 宿主上因
    `Error relocating … __fd_chk: symbol not found`（宿主加载 aarch64 产物的已知限制）而失败，与产物无关。
  upstream_tests: 0
  upstream_tests_note: >-
    Upstream ships no test suite at all (audited; see
    test_package/MANIFEST.yml upstream_test_audit). Reported honestly as
    no_tests/0, never as a pass.
  functional: >-
    All 14 assertions execute the packaged aarch64/OHOS binaries and pass:
    version/help/licence entry points of both programs, the ttyrec SUMMARY
    frame report, the byte-identical typescript round-trip, the hex dump, the
    terminal-emulator screen XML, the raw-byte round-trip, three error paths,
    a tamper check that proves the fixture really is parsed, and ttyrec format
    autodetection.
  notes: >-
    The interactive curses player itself cannot be driven headlessly; the
    curses UI is out of scope for an automated test, and its non-curses entry
    points are covered instead.

