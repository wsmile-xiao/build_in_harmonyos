# 软件级 manifest — itsy_bitsy
software: itsy_bitsy
display: "itsy.bitsy"
description: "Header-only C++ bit utilities library"
category: library
homepage: "https://github.com/ThePhD/itsy_bitsy"
license: BSL-1.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS arm64 使用 clang 15/C++17；CMake 使用 Linux 兼容平台名。"
    - "span-lite/0.11.0 是 C++17 bit_span 的公共 Conan 依赖（负对照：去掉该头路径编译即失败）。"
    - "range-v3 仅用于上游测试，空子模块由固定源码归档补齐。"
    - "修复安装 CMake 配置中的 sol2 复制残留，导出 itsy::bitsy。"
    - "设备构建按工作区规则使用 make -j2，上游 CTest 保持串行执行。"
  common_dependencies:
    - "span-lite/0.11.0"

