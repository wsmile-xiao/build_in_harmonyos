# 版本级 manifest 模板
# 文件位置: archives/i/itsy_bitsy/0.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8"

# 软件名
software: itsy_bitsy

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ThePhD/itsy_bitsy/archive/refs/tags/v0.8.tar.gz"

  # 源码校验和
  sha256: "ba76a9b22f41802ede0d7b141f6cf0bf48fa27a88a7181eef8928d6c20ee771d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux (OHOS CMake compatibility)"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_CXX_STANDARD=17"
    - "-DITSY_BITSY_SINGLE=ON"
    - "-DITSY_BITSY_TESTS=ON"
    - "-DITSY_BITSY_EXAMPLES=ON"
    - "-DITSY_BITSY_BENCHMARKS=OFF"
    - "-DCMAKE_CTEST_ARGUMENTS=--output-on-failure"
    - "-DCMAKE_CXX_FLAGS=-Wno-deprecated-declarations -Wno-error=unused-but-set-variable"
  # 构建并发（工作区规则）: cmake --build --parallel 2 -- -j2；测试走 build-system
  # test 目标，保持串行 ctest，不使用 CMake.ctest() 注入的 --parallel <jobs>。
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "span-lite/0.11.0"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-cmake-itsy.bitsy-config.cmake.in.patch"
  - "patches/0002-single_version_popen_bytes.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "itsy.bitsy 是 header-only C++ 库；Conan 包不包含库文件，仅安装 include、CMake 配置和 pkg-config 元数据。"
  - "OHOS 设备的 CMake 无 HarmonyOS 平台模块，配方使用 CMAKE_SYSTEM_NAME=Linux，同时保留 OHOS clang/aarch64 工具链。"
  - "GitHub v0.8 源码包的 range-v3 与 span-lite 子模块为空；配方按固定官方 tarball 和 SHA256 补齐，range-v3 仅供上游测试使用，span-lite 同时作为 C++17 bit_span 的公共依赖。"
  - "span-lite 作为公共依赖是必需而非可选：移除 span-lite 头路径后编译 itsy/bit_span.hpp 立即报 'a span of some sort is required'（设备端负对照已复现）。"
  - "OHOS libc++ C++17 将 allocator::construct 标记为 deprecated；上游测试的 -Werror 还会把 shared_allocator_tests.hpp:118 的 unused-but-set-variable 变成错误，分别使用精确诊断选项处理。"
  - "Conan 的 tc.cache_variables 传 Python list/tuple 会按 repr 序列化进生成的 make 规则：CMAKE_CTEST_ARGUMENTS 必须是字符串，否则 'make test' 变成 ctest ['--output-on-failure']（E301 同一族的 CTest 参数传递陷阱）。"
  - "统计层级必须分开：上游 tests/ 的 6 个正式 CTest 入口 != 1108 次 Catch2 逻辑用例执行 != 7281656 条断言；examples 另有 14 个独立检查，消费者 5 个 CTest 用例再另计。"
  - "上游 build 期的 single header 生成脚本用 os.popen('git describe ...').read() 取版本戳，解码用的是宿主 locale 推导的文本编码；CI worker 上会在 codecs.BufferedIncrementalDecoder.decode 里抛 'can''t concat str to bytes' 让 make 在 1% 中止。仅 pin PYTHONUTF8/ PYTHONIOENCODING 不能覆盖该平台差异；补丁改用 subprocess 按字节读取并以 UTF-8 replacement 解码，异常时返回空版本并沿用上游 Tip fallback。"

test_results:
  upstream:
    # Review count covers the formal tests/ tree only.
    ctest_entries: 6
    ctest_passed: 6
    ctest_failed: 0
    example_ctest_entries: 14
    example_ctest_passed: 14
    ctest_total_with_examples: 20
    logical_cases: 1108
    assertions: 7281656
    executed: true
    command: "cmake --build <build> --target test -- -j2 (串行 ctest --output-on-failure)"
    reason: "tests/ 注册 2 个 runtime、2 个 compile-time 和 2 个 WILL_FAIL 入口，正式套件 6/6 通过；ITSY_BITSY_EXAMPLES=ON 时另有 7 个示例的双布局检查 14/14 通过，完整 CTest 为 20/20。无跳过项。"
  test_package:
    logical_cases: 5
    assertions: 28
    passed: 5
    failed: 0
    falsification: "7 次破坏性反向取证（M0 依赖负对照 + M1~M6 期望值改错）全部产生真实失败，复原后 5/5 通过，源文件 sha256 复原一致"
  device_validation: "OHOS aarch64 conan create（ohos-aarch64 绝对 profile 路径，make -j2）退出码 0；上游 tests/ 正式入口 6/6、examples 14/14、消费者 5/5 全通过"
