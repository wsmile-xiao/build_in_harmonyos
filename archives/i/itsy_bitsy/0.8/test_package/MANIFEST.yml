# test_package/MANIFEST.yml — itsy_bitsy/0.8
# CI L0e requires this file; every count below is from the OHOS device run of
# 2026-09-03 (conan create with the ohos-aarch64 profile, make -j2).

package: itsy_bitsy/0.8
homepage: "https://github.com/ThePhD/itsy_bitsy"

# Upstream CMake/CTest execution, driven from conanfile.py build() through the
# build-system "test" target: ctest --output-on-failure (serial).
# source() restores the two empty test submodules from pinned official
# archives before this phase.
upstream_check_command: "cmake --build <build> --parallel 2 -- -j2 && cmake --build <build> --target test -- -j2"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# The formal upstream tests/ tree registers 6 CTest entries: 2 Catch2 runtime
# drivers + 2 compile-time executables + 2 expected-failure (WILL_FAIL) checks.
# ITSY_BITSY_EXAMPLES=ON separately registers 14 example checks; the complete
# configured CTest run therefore reports 20 entries.  Keep these levels distinct
# so the review count for tests/ cannot be confused with the full run.
upstream_ctest_test_count: 6
upstream_example_ctest_test_count: 14
upstream_ctest_total_with_examples: 20
upstream_logical_test_case_count: 1108
upstream_assertion_count: 7281656
upstream_tests:
  - file: tests/run_time
    source: itsy_bitsy-0.8/tests/run_time
    count: 1
    logical_case_count: 554
    assertion_count: 3640828
    description: "one CTest runtime driver using the normal header layout (554 logical cases, 3640828 assertions)"
    command: "./x64/bin/itsy.bitsy.tests.run_time-1.0.0 --reporter compact"
  - file: tests/run_time.single
    source: itsy_bitsy-0.8/tests/run_time
    count: 1
    logical_case_count: 554
    assertion_count: 3640828
    description: "one CTest runtime driver using the generated single header (554 logical cases, 3640828 assertions)"
    command: "./x64/bin/itsy.bitsy.tests.run_time.single-1.0.0 --reporter compact"
  - file: tests/compile_time
    source: itsy_bitsy-0.8/tests/compile_time
    count: 1
    description: "compile-time header coverage executable"
    command: "ctest --output-on-failure -R itsy_bitsy.tests.compilation$"
  - file: tests/compile_time.single
    source: itsy_bitsy-0.8/tests/compile_time
    count: 1
    description: "compile-time generated single-header coverage executable"
    command: "ctest --output-on-failure -R itsy_bitsy.tests.compilation.single"
  - file: tests/compile_failure
    source: itsy_bitsy-0.8/tests/compile_failure
    count: 2
    description: "negative compilation checks registered with WILL_FAIL (upstream semantics)"
    command: "ctest --output-on-failure -R itsy_bitsy.tests.fail"

upstream_examples:
  - file: examples
    source: itsy_bitsy-0.8/examples
    count: 14
    description: "7 example sources built and run with both the normal and the single header"
    command: "ctest --output-on-failure -R itsy.bitsy.example"

# Consumer-side tests: 5 independent CTest entries compiled against the
# installed package (find_package(itsy.bitsy) + itsy::bitsy + span-lite).
# 27 runtime assertions plus 1 static_assert in test_itsy_bitsy.cpp; each case
# was individually falsified on device (see notes.md).
test_package_tests:
  - file: test_itsy_bitsy.cpp
    source: archives/i/itsy_bitsy/0.8/test_package/test_itsy_bitsy.cpp
    count: 1
    description: "case binary_digits: 4 assertions on bitsy::binary_digits_v"
    command: "./test_itsy_bitsy binary_digits"
  - file: test_itsy_bitsy.cpp
    source: archives/i/itsy_bitsy/0.8/test_package/test_itsy_bitsy.cpp
    count: 1
    description: "case bit_vector: 5 assertions on size()/count(true)/count(false)/bit access"
    command: "./test_itsy_bitsy bit_vector"
  - file: test_itsy_bitsy.cpp
    source: archives/i/itsy_bitsy/0.8/test_package/test_itsy_bitsy.cpp
    count: 1
    description: "case bit_vector_flip: 5 assertions on flip() semantics"
    command: "./test_itsy_bitsy bit_vector_flip"
  - file: test_itsy_bitsy.cpp
    source: archives/i/itsy_bitsy/0.8/test_package/test_itsy_bitsy.cpp
    count: 1
    description: "case popcount: 4 assertions on bitsy::popcount"
    command: "./test_itsy_bitsy popcount"
  - file: test_itsy_bitsy.cpp
    source: archives/i/itsy_bitsy/0.8/test_package/test_itsy_bitsy.cpp
    count: 1
    description: "case bit_span: 9 assertions through itsy/bit_span.hpp, i.e. the public span-lite dependency"
    command: "./test_itsy_bitsy bit_span"

# Total reported assertions: 7281656 Catch2 assertions from the two upstream
# runtime drivers + 27 consumer runtime assertions + 1 consumer static_assert.
# The upstream and consumer layers are counted separately above and must not be
# summed into the CTest entry counts.
assertion_count: 7281684
