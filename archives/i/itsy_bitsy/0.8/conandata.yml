# conandata.yml — itsy_bitsy 0.8
# Official itsy.bitsy source plus pinned sources for its upstream test suite.

sources:
  url: "https://github.com/ThePhD/itsy_bitsy/archive/refs/tags/v0.8.tar.gz"
  sha256: "ba76a9b22f41802ede0d7b141f6cf0bf48fa27a88a7181eef8928d6c20ee771d"

# GitHub source archives leave these .gitmodules directories empty.  The
# range-v3 archive is fetched only to make the upstream CTest suite reproducible. The
# span-lite archive is also staged for that suite, while span-lite is declared
# separately as the public C++17 dependency of bit_span.hpp.
test_sources:
  range_v3:
    url: "https://github.com/ericniebler/range-v3/archive/refs/tags/0.12.0.tar.gz"
    sha256: "015adb2300a98edfceaf0725beec3337f542af4915cec4d0b89fa0886f4ba9cb"
  span_lite:
    url: "https://github.com/martinmoene/span-lite/archive/refs/tags/v0.11.0.tar.gz"
    sha256: "ef4e028e18ff21044da4b4641ca1bc8a2e2d656e2028322876c0e1b9b6904f9d"

patches:
  - patch_file: "patches/0001-cmake-itsy.bitsy-config.cmake.in.patch"
    patch_description: "0001 cmake itsy.bitsy-config.cmake.in load itsy.bitsy targets"
    patch_type: "portability"
  - patch_file: "patches/0002-single_version_popen_bytes.patch"
    patch_description: "0002 single/single.py use byte-wise subprocess for git probe"
    patch_type: "portability"
