# conandata.yml — ismrmrd 1.15.0
# R39: 配方只声明官方 HTTPS 源（CI 构建时自动加镜像 fallback，见 ci/conan/build_and_test.sh）

sources:
  url: "https://github.com/ismrmrd/ismrmrd/archive/refs/tags/v1.15.0.tar.gz"
  sha256: "57739de6d93203adc86f5e510729b7e2a45917bcab480dd1c1a6b6d16508a42c"

patches:
  - patch_file: "patches/0001-tests-CMakeLists.txt.patch"
    patch_type: "portability"
    patch_description: "tests/CMakeLists.txt: Boost.Test 纯头文件模式。上游用 Boost_UNIT_TEST_FRAMEWORK_FOUND 作闸门，找不到就静默跳过全部测试；改为由配方传入的 BOOST_INCLUDE_DIR 判定（Boost.Test >= 1.64 在单一 TU 定义 BOOST_TEST_MODULE 时自包含）。同时修正 include_directories 里未被赋值的 ${Boost_INCLUDE_DIR}。"
  - patch_file: "patches/0002-tests-test_main.cpp.patch"
    patch_type: "portability"
    patch_description: "test_main.cpp: 定义 BOOST_TEST_MODULE 的 TU 改用 <boost/test/included/unit_test.hpp>，使纯头文件实现进入该编译单元，无需链接 libboost_unit_test_framework。"
  - patch_file: "patches/0003-CMakeLists.txt.patch"
    patch_type: "portability"
    patch_description: "CMakeLists.txt 两处：(1) find_package(Boost) 组件收窄为 filesystem+program_options —— Boost.Random 自 1.69 起为纯头文件、鸿蒙 boost 包不导出 random 组件，上游多要的 random/unit_test_framework 会让整个 find_package 失败并导致 Boost_LIBRARIES 为空（test_dataset.cpp 需要 Boost.Filesystem）；(2) 上游按 BUILD_STATIC 分别链接 pugixml::static / pugixml::shared，Conan 的 pugixml 包只导出 pugixml::pugixml，两个分支统一改为该目标。"
  - patch_file: "patches/0004-utilities-CMakeLists.txt.patch"
    patch_type: "portability"
    patch_description: "utilities/CMakeLists.txt: 上游用 FindBoost 模块变量 ${Boost_PROGRAM_OPTIONS_LIBRARY}（CONFIG 模式不产出该变量），改为 Conan BoostConfig 导出的 Boost::program_options 导入目标；同时把 include_directories 里未被赋值的 ${Boost_INCLUDE_DIR} 换成配方传入的 ${BOOST_INCLUDE_DIR}。utilities 必须构建——上游 EndToEndTest 两个用例会调用这些可执行文件。"

