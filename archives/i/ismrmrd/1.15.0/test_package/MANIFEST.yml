# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 脚本 (build_and_test.sh L0e) 强制要求存在

package: ismrmrd/1.15.0
homepage: "https://ismrmrd.github.io/"

# 上游测试命令（1.15.0 用 CMake/CTest，注册的测试名是 check）
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error"

# 上游实际运行的测试程序
# ismrmrd 1.15.0 = 单一 test_ismrmrd Boost.Test 二进制，含 10 个 suite / 38 个 case。
# test_dataset.cpp 与 test_end_to_end.cpp 仅在 USE_HDF5_DATASET_SUPPORT=ON 时
# 才加入测试目标，因此本配方保持 HDF5 数据集支持开启，避免上游用例被静默裁掉。
upstream_test_binary: "test_ismrmrd"
upstream_case_count: 38
upstream_tests:
  - file: tests/test_acquisitions.cpp
    source: ismrmrd-1.15.0/tests/test_acquisitions.cpp
    suite: AcquisitionsTest
    cases: 5
    description: "Acquisition 创建/初始化/拷贝/一致性 与 header 字段访问"
    command: "./test_ismrmrd --run_test=AcquisitionsTest"
  - file: tests/test_channels.cpp
    source: ismrmrd-1.15.0/tests/test_channels.cpp
    suite: ChannelTest
    cases: 4
    description: "channel mask 开/关/全关与查询"
    command: "./test_ismrmrd --run_test=ChannelTest"
  - file: tests/test_dataset.cpp
    source: ismrmrd-1.15.0/tests/test_dataset.cpp
    suite: DatasetTest
    cases: 1
    description: "HDF5 dataset 读写往返（依赖 USE_HDF5_DATASET_SUPPORT=ON）"
    command: "./test_ismrmrd --run_test=DatasetTest"
  - file: tests/test_end_to_end.cpp
    source: ismrmrd-1.15.0/tests/test_end_to_end.cpp
    suite: EndToEndTest
    cases: 2
    description: "流式重建端到端（管道与文件两条路径，依赖 HDF5）"
    command: "./test_ismrmrd --run_test=EndToEndTest"
  - file: tests/test_flags.cpp
    source: ismrmrd-1.15.0/tests/test_flags.cpp
    suite: FlagTest
    cases: 5
    description: "acquisition flag 位操作"
    command: "./test_ismrmrd --run_test=FlagTest"
  - file: tests/test_images.cpp
    source: ismrmrd-1.15.0/tests/test_images.cpp
    suite: ImagesTest
    cases: 5
    description: "Image 创建/初始化/拷贝/一致性 与 header 字段访问"
    command: "./test_ismrmrd --run_test=ImagesTest"
  - file: tests/test_ndarray.cpp
    source: ismrmrd-1.15.0/tests/test_ndarray.cpp
    suite: NDArrayTest
    cases: 3
    description: "NDArray 初始化/创建/拷贝 与维度访问"
    command: "./test_ismrmrd --run_test=NDArrayTest"
  - file: tests/test_quaternions.cpp
    source: ismrmrd-1.15.0/tests/test_quaternions.cpp
    suite: QuaternionTest
    cases: 3
    description: "方向向量与四元数互转、方向符号"
    command: "./test_ismrmrd --run_test=QuaternionTest"
  - file: tests/test_serialization.cpp
    source: ismrmrd-1.15.0/tests/test_serialization.cpp
    suite: SerialiationTest
    cases: 7
    description: "acquisition/waveform/config/string/协议 序列化与反序列化"
    command: "./test_ismrmrd --run_test=SerialiationTest"
  - file: tests/test_xml_header.cpp
    source: ismrmrd-1.15.0/tests/test_xml_header.cpp
    suite: HeaderTest
    cases: 3
    description: "XML header 基础/扩展/区域设置 往返"
    command: "./test_ismrmrd --run_test=HeaderTest"

# test_package 自带的消费者用例（业务上层视角）
test_package_tests:
  - file: test_consumer.c
    description: "消费者测试：仅用公开 C API 构建 acquisition/ndarray、操作 flag 与 channel mask"
    command: "./test_consumer"
    assertions: 20
  - file: test_ohos.cpp
    description: "鸿蒙专项消费者测试：公开 C++ XML 交换 API 构建 header → 序列化 → 反序列化 → 全等比对"
    command: "./test_ohos"
    assertions: 8
