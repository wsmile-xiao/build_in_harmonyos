# 版本级 manifest — ismrmrd 1.15.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.15.0"

# 软件名
software: "ismrmrd"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-04"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 HTTPS，R39）
  url: "https://github.com/ismrmrd/ismrmrd/archive/refs/tags/v1.15.0.tar.gz"

  # 源码校验和
  sha256: "57739de6d93203adc86f5e510729b7e2a45917bcab480dd1c1a6b6d16508a42c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_STATIC=OFF"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DCMAKE_SKIP_RPATH=ON"
    - "-DUSE_HDF5_DATASET_SUPPORT=ON"
    - "-DBUILD_TESTS=ON"
    - "-DBUILD_UTILITIES=ON"
    - "-DBUILD_EXAMPLES=OFF"
    # os=OHOS 专用（generate() 中按 os 守卫设置）：
    #   CMAKE_SYSTEM_NAME=OHOS / CMAKE_SYSTEM_PROCESSOR=aarch64
    # conan 默认把 os=OHOS 映射成 CMAKE_SYSTEM_NAME=HarmonyOS，而 SDK 里只有
    # Modules/Platform/OHOS.cmake，名字对不上会让平台变量留空、产物缺 DT_SONAME。

  # 编译依赖列表（格式: name/version）
  dependencies:
    - boost/1.90.0.4.1
    - pugixml/1.16
    - hdf5/1.14.6
    - fftw3f/3.3.10

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-tests-CMakeLists.txt.patch"
  - "0002-tests-test_main.cpp.patch"
  - "0003-CMakeLists.txt.patch"
  - "0004-utilities-CMakeLists.txt.patch"

# ============================================================
# 测试结果
# ============================================================

# 顶层汇总口径（供 CI / 审核脚本直接读取）
# 上游 54 个 case + test_package 2 个消费者用例，全部通过
test_passed: 56
test_failed: 0

test_results:
  # 上游测试：单一 test_ismrmrd Boost.Test 二进制，ctest 注册名 check
  upstream:
    command: "ctest --output-on-failure --no-tests=error"
    suites: 10
    cases_passed: 54
    cases_total: 54
    assertions_passed: 270765
    assertions_total: 270765
    pass_rate: "100%"
    note: "HDF5 数据集支持与 utilities 均开启，test_dataset/test_end_to_end 未被裁掉"
  # 消费者用例（test_package，业务上层视角）
  test_package:
    cases_passed: 2
    cases_total: 2
    pass_rate: "100%"
    detail:
      - "test_consumer: 公开 C API（flag / channel mask / acquisition / ndarray）编译+链接+运行通过"
      - "test_ohos: 公开 C++ XML 交换 API 构建 header → 序列化 → 反序列化 → 全等比对通过（1383 字节 XML）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "鸿蒙 boost 包不导出 random 组件（Boost.Random 自 1.69 起纯头文件），上游 find_package(Boost CONFIG COMPONENTS ... random ...) 会整体失败、Boost_LIBRARIES 变空；必须把组件表收窄到制品仓真正提供的集合，否则依赖 Boost.Filesystem 的上游测试会链接失败"
  - "CONFIG 模式（BoostConfig）不产出 FindBoost 模块变量 Boost_PROGRAM_OPTIONS_LIBRARY / Boost_INCLUDE_DIR；下游 CMake 里引用这些变量要改用导入目标 Boost::program_options 或按组件取 includedirs"
  - "Boost.Test 纯头文件模式（≥1.64）可在制品仓缺 libboost_unit_test_framework 时恢复上游全部用例：定义 BOOST_TEST_MODULE 的 TU 用 included/unit_test.hpp，并把闸门从 Boost_UNIT_TEST_FRAMEWORK_FOUND 换成 include 路径判定"
  - "鸿蒙 fftw 包 ENABLE_FLOAT=OFF（仅双精度 libfftw3）；需要 fftwf_* 的上游 utilities 必须依赖独立的 fftw3f 包提供 libfftw3f，否则 FindFFTW 的 FLOAT_LIB 组件 NOTFOUND、utilities 被静默跳过、EndToEnd 用例报 'Could not find utilities directory'"
  - "ismrmrd 1.15.0 的 test_dataset/test_end_to_end 只在 USE_HDF5_DATASET_SUPPORT=ON 时加入测试目标，utilities 又必须构建——想跑满上游用例就不能照搬 1.7.0 的 -DUSE_HDF5_DATASET_SUPPORT=OFF/-DBUILD_UTILITIES=OFF"
  - "OHOS 上 ismrmrd 的 test_ismrmrd 把 DT_NEEDED 记成相对路径 ../libismrmrd.so，只有在自身目录为工作目录时才能启动（ctest 天然满足，手工直跑必须显式切目录）"
  - "boost/1.84~1.85 配方钉 zlib/1.3.1，与 hdf5/1.14.6 拉入的 zlib/1.3.1.1 冲突；同一依赖图里选 boost≥1.90 可解"
  - "上游 CMakeLists 自带 -Wall -Werror，clang 15 会对 tests/test_serialization.cpp 的 int→float 常量转换报 -Wimplicit-const-int-float-conversion；用 -Wno-error=<该诊断> 而非整体去掉 -Werror，可保住其余告警仍是硬失败"
  - "OHOS 上 conan 把 os=OHOS 映射为 CMAKE_SYSTEM_NAME=HarmonyOS，但 CMake 平台文件是 Modules/Platform/OHOS.cmake；名字对不上不报错，只把 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 等留空，产物因此没有 DT_SONAME（L5 闸门失败）。修法：generate() 里按 os==OHOS 守卫显式设置 cmake_system_name=OHOS / cmake_system_processor=aarch64"
  - "conan test_package 若显式写 generators=，会**替换**而非追加 conan 默认集；漏掉 VirtualRunEnv 就没有 conanrun 环境，动态库带上 SONAME 后消费者会在加载期报 Error loading shared library。test_package 需显式声明 VirtualRunEnv，并用 env=\"conanrun\" 跑 ctest 与二进制"
  - "CMAKE_SKIP_RPATH=ON 时构建树二进制失去 RPATH，recipe 的运行时环境必须把 build 根目录（而非只有 build/lib 等子目录）加入 LD_LIBRARY_PATH，否则上游 ctest 阶段就加载不到 libismrmrd"
