# 编译中学到的知识
knowledge_gained:
  - "Boost.Test 纯头文件模式（≥1.64）可在制品仓 boost 缺 unit_test_framework 库时恢复上游测试：test_main.cpp 用 included/unit_test.hpp，tests/CMakeLists 松绑 find_package"
  - "OHOS libc 不声明 pthread_setcancelstate（同 Android），Boost 头文件需注入 -DBOOST_SP_NO_PTHREAD_SETCANCELSTATE"
  - "CMake>=4 对 cmake_minimum_required(<3.5) 报错，CMAKE_POLICY_VERSION_MINIMUM 必须命令行传参（toolchain cache 变量无效）"
  - "可选 HDF5 dataset 支持关闭（USE_HDF5_DATASET_SUPPORT=OFF），核心 MR 数据模型与 XML 序列化不受影响"

