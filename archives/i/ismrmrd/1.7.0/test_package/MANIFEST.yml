# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ismrmrd/1.7.0
homepage: "https://ismrmrd.github.io/"

# 上游测试命令 (用于 make -n check / ctest -N 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target check"

# 上游实际运行的测试程序 (ismrmrd 1.7.0: 单一 test_ismrmrd Boost.Test 二进制)
upstream_tests:
  - file: tests/test_acquisitions.cpp
    source: ismrmrd-1.7.0/tests/test_acquisitions.cpp
    description: "Acquisition 序列化/反序列化与字段访问"
    command: "./test_ismrmrd --run_test=AcquisitionTest"
  - file: tests/test_images.cpp
    source: ismrmrd-1.7.0/tests/test_images.cpp
    description: "Image 头与数据访问"
    command: "./test_ismrmrd --run_test=ImageTest"
  - file: tests/test_ndarray.cpp
    source: ismrmrd-1.7.0/tests/test_ndarray.cpp
    description: "NDArray 维度/数据类型访问"
    command: "./test_ismrmrd --run_test=NDArrayTest"
  - file: tests/test_flags.cpp
    source: ismrmrd-1.7.0/tests/test_flags.cpp
    description: "flag 位操作"
    command: "./test_ismrmrd --run_test=FlagTest"
  - file: tests/test_channels.cpp
    source: ismrmrd-1.7.0/tests/test_channels.cpp
    description: "channel mask 操作"
    command: "./test_ismrmrd --run_test=ChannelTest"
  - file: tests/test_quaternions.cpp
    source: ismrmrd-1.7.0/tests/test_quaternions.cpp
    description: "四元数与方向向量互转"
    command: "./test_ismrmrd --run_test=QuaternionTest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过公开 C API 构建 acquisition/ndarray、操作 flag/channel"
    command: "./test_ismrmrd"
  - file: test_ohos.cpp
    description: "鸿蒙专项测试：IsmrmrdHeader C++ XML 序列化往返（公开 C++ API）"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 47
