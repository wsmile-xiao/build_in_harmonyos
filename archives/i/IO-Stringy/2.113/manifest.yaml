software: IO-Stringy
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.113/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 构建系统类型（质量门禁必需字段）
build_system: perl-makefile

# 版本号
version: "2.113"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/D/DS/DSKOLL/IO-Stringy-2.113.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl-makefile
  system: perl-makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 XS 代码）在鸿蒙平台可直接编译，无需特殊链接参数"
  - "CPAN 包名可能与用户输入不同（perl-io-stringy 实际是 IO-Stringy），需查询 CPAN API"
  - "SSL 证书问题可通过手动下载 + file:// URL 绑定解决"
  - "site_perl 中未签名的 XS 模块会覆盖系统核心模块，导致加载失败（HMDFS 限制）"
  - "Perl 模块依赖 IO::Handle 等 XS 模块时，需确保使用系统已签名的核心模块"
  - "预编译包只需包含 .pm 文件，纯 Perl 模块无需 ELF 签名"
  - "用户需设置 PERL5LIB=/path/to/site_perl 环境变量才能使用模块"
  - "参考 perl-dbd-pg 经验：XS 模块在 HMDFS 上无法加载，需管理员安装到系统目录"
