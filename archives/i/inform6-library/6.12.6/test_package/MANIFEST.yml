package: inform6-library/6.12.6
homepage: "https://ifarchive.org/indexes/if-archive/infocom/compilers/inform6/library/"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  上游发行 zip 为纯文本数据（8 个 Inform 头文件 + 6 个文档/许可证文件），
  不含任何测试目录或测试目标（Inform 库的正确性验证方式是把头文件交给
  inform6 编译器编译演示游戏，属编译器包的测试范围）。本包以内容级消费者
  探针代替：逐文件断言发行标记。
test_package_tests:
  - file: inform6lib_probe.cpp
    description: >-
      真消费者测试：校验库目录 14 文件清单（8 头 + 6 文档），8 个头文件
      逐个在位/非空/尺寸合理，并逐文件断言 6.12.6 发行标记（version.h
      LibRelease/LIBRARY_VERSION 常量、english.h 语言定义头与 parserm
      入口、parser/verblib/infix/linklpa/grammar 的序列号 220219、
      infglk.h 生成器标记与 System_file 指令），ARTISTIC 许可证文本校验，
      附带截断注入负向用例。
    command: "inform6lib_probe <library-dir>"
assertion_count: 5
