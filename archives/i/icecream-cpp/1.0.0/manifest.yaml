software: icecream-cpp
# 版本级 manifest
# 文件位置: archives/i/icecream-cpp/1.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方正式源，R39；CI 自动添加镜像 fallback）
  url: "https://github.com/renatoGarcia/icecream-cpp/archive/refs/tags/v1.0.0.tar.gz"

  # 源码校验和（官方 tarball 实测：35fdbd012a4f7990c404c59b8291e04dc6103232323371ea7a2b18613b1b7900）
  sha256: "35fdbd012a4f7990c404c59b8291e04dc6103232323371ea7a2b18613b1b7900"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_TESTING=OFF"

  # 编译依赖列表（库本体 header-only，零依赖；上游测试依赖 Catch2/Boost/fmt/range-v3 仅测试用，未列入配方）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（上游测试断言平台适配，见 notes.md「上游测试用例修改说明」）
patches_applied:
  - "0001-tests-test_c++11.cpp.patch"
  - "0002-tests-test_clang.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS libc（musl 系）printf %p 空指针输出 '0'（glibc 为 '(nil)'），上游测试 libc++ 分支断言需按平台适配"
  - "OHOS SDK clang15 libc++ 缺 C++20 std::views，依赖 ranges 的上游测试硬阻塞（工具链限制，非库缺陷）"
  - "conan-verify E017 镜像注入会残留 conandata.yml.ghfast-bak，提交前必须清理（JC1 拦截）"
