# test_package/MANIFEST.yml
# 上游官方测试声明 + test_package 消费者验证声明（实测数据）
# 完整上游测试台账见 reports/upstream-test-ledger.md（双口径枚举，本文件为 CI 读取摘要）

package: icecream-cpp/1.0.0
homepage: "https://github.com/renatoGarcia/icecream-cpp"

# 上游测试命令（官方 tag v1.0.0 源码枚举结果）
# 构建系统：CMake（tests/CMakeLists.txt，declare_test() 生成独立可执行用例）
upstream_check_command: "cmake -DBUILD_TESTING=ON && ctest"

# 上游测试源声明总数（tests/ 目录 14 个测试源文件，含 2 个编译级条目）：
#   10 个标准门控可执行用例 + 2 个特性门控（ENABLE_FMT/ENABLE_RANGE_V3，默认关）
#   + test_2.cpp（ODR 编译级）+ test_compile_fail.cpp（编译错误演示，非独立可执行用例）
# UI 宏/框架头（common.hpp）与 tests/conanfile.py 非独立测试，未计入。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（OHOS 配置 C++23：10 个可执行用例；9 个编译+运行通过，
# test_c++20 因 OHOS libc++ 缺 std::views(C++20 ranges) 硬阻塞；%p 断言按 OHOS libc 适配说明）
upstream_tests:
  - file: test_config.cpp
    source: tests/test_config.cpp
    description: "C++11 config/hereditary 用例（2 test cases, 15 assertions）"
    command: "./test_config"
    result: "passed"
  - file: test_c++11.cpp
    source: tests/test_c++11.cpp
    description: "C++11 核心用例（16 test cases, 115 assertions，%p 空指针断言按 OHOS libc 适配）"
    command: "./test_c++11"
    result: "passed"
  - file: test_strings_c++11.cpp
    source: tests/test_strings_c++11.cpp
    description: "C++11 字符串用例（4 test cases, 39 assertions）"
    command: "./test_strings_c++11"
    result: "passed"
  - file: test_slicing.cpp
    source: tests/test_slicing.cpp
    description: "C++11 slicing 用例（7 test cases, 48 assertions）"
    command: "./test_slicing"
    result: "passed"
  - file: test_c++17.cpp
    source: tests/test_c++17.cpp
    description: "C++17 用例（4 test cases, 8 assertions）"
    command: "./test_c++17"
    result: "passed"
  - file: test_strings_c++17.cpp
    source: tests/test_strings_c++17.cpp
    description: "C++17 字符串用例（2 test cases, 10 assertions）"
    command: "./test_strings_c++17"
    result: "passed"
  - file: test_strings_c++20.cpp
    source: tests/test_strings_c++20.cpp
    description: "C++20 字符串用例（2 test cases, 12 assertions）"
    command: "./test_strings_c++20"
    result: "passed"
  - file: test_c++23.cpp
    source: tests/test_c++23.cpp
    description: "C++23 用例（1 test case，-std=c++2b；clang15 不支持 c++23 拼写）"
    command: "./test_c++23"
    result: "passed"
  - file: test_clang.cpp
    source: tests/test_clang.cpp
    description: "clang>=15 专用用例（1 test case, 4 assertions，%p 断言按 OHOS libc 适配）"
    command: "./test_clang"
    result: "passed"
  - file: test_c++20.cpp
    source: tests/test_c++20.cpp
    description: "C++20 ranges view 用例（std::views）——OHOS libc++ 缺 C++20 std::views，编译硬阻塞（工具链限制，非当前库缺陷）"
    command: "./test_c++20"
    result: "blocked_toolchain"
  - file: test_fmt.cpp
    source: tests/test_fmt.cpp
    description: "fmt 特性门控用例（ENABLE_FMT 默认 OFF，未实例化）"
    command: ""
    result: "not_instantiated"
  - file: test_range_v3.cpp
    source: tests/test_range_v3.cpp
    description: "range-v3 特性门控用例（ENABLE_RANGE_V3 默认 OFF，未实例化）"
    command: ""
    result: "not_instantiated"
  - file: test_2.cpp
    source: tests/test_2.cpp
    description: "ODR 编译级检查（与 test_config.cpp 双 TU 链接，无重复符号定义）"
    command: ""
    result: "compile_passed"
  - file: test_compile_fail.cpp
    source: tests/test_compile_fail.cpp
    description: "编译错误演示文件（上游未接入 CMake，IC(v) 引用未声明 v；编译期错误为文件预期行为，非独立可执行用例）"
    command: ""
    result: "compile_error_by_design"

# test_package 中自带的测试（消费者视角验证，R34 实质调用被测库 API）
test_package_tests:
  - file: test_icecream.cpp
    description: "消费者测试：IC() 输出捕获断言 + 多参数 + HarmonyOS 空指针 %p 专项断言"
    command: "./test_icecream-cpp"

# 测试断言总数（上游实际运行断言 + test_package 断言，近似值）
assertion_count: 240