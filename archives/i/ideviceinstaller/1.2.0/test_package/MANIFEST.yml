# test_package/MANIFEST.yml
# ideviceinstaller 1.2.0 upstream test declaration

package: ideviceinstaller/1.2.0
homepage: "https://github.com/libimobiledevice/ideviceinstaller"

# Upstream test command (make check needs real iOS device / usbmuxd daemon)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package/test.c
    description: "Run ideviceinstaller --version/--help — verify CLI binary runs (exit 0, non-empty output)"
    command: "./test_ideviceinstaller"

# Test assertion count
assertion_count: 4
