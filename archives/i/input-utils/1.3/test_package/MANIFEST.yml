package: input-utils/1.3
homepage: "https://www.kraxel.org/releases/input/"

upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: "none"

upstream_tests:
  notes: >-
    上游无任何自动化测试套件：input-1.3.tar.gz 无 tests/ 目录、无 make
    check/test 目标（GNUmakefile 仅 all/install/clean/realclean）、无 CI
    配置。证据见库级 manifest.yaml upstream_tests 节。

test_package_tests:
  - file: test_input_utils.c
    description: "真实 C 消费测试（conanfile.py build() 用 clang 编译，test() 执行）：定位 conanrun env PATH 中的打包产物并断言行为——lsinput 空扫描 exit 0；input-events 9999 在 stderr 报告 /dev/input/event9999 打开失败；emulate-key 无 keyname、input-send 无 device 均 usage exit 非 0。popen/pclose 真实执行打包 ELF。"
    command: "conan test / conan create（build() 编译，test() → ./test_input_utils）"
  - file: test.sh
    description: "bash 消费测试：lsinput 空扫描 exit 0；input-events 9999 报告 /dev/input/event9999 打开失败；emulate-key 无 keyname / input-send 无 device 均 usage exit 非 0；lsinput 列出设备须引用 /dev/input。经 conanrun env (VirtualRunEnv PATH) 执行"
    command: "conan test / conan create（test() → bash test.sh）"

assertion_count: 9
