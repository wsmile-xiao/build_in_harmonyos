package: ifile/1.3.9
homepage: https://people.csail.mit.edu/jrennie/ifile/

# 上游测试是否在本次构建中真实执行（R51）
upstream_test_in_build: true
upstream_test_command: "sh test-upstream.sh   # 由配方在 build() 内从上游 test.sh 生成，仅重定位 /tmp 目标并把 bash 专有 &> 改成 POSIX 重定向，8 条断言本体未改"
upstream_tests:
  - file: test.sh
    source: ifile-1.3.9/test.sh
    description: "上游唯一的自动化套件：8 条 POSIX shell 断言（ok 1…ok 8），全部针对 `make install` 的布局产物存在性——默认 --prefix 的 man 页(1)、--exec-prefix 下的 bin/ifile(2)、--bindir 覆写后的 ifile(3) 与 ifilter.mh(4)/irefile.mh(5)/knowledge_base.mh(6)/news2mail(7)、--mandir 覆写后的 man 页(8)"
    command: "sh test-upstream.sh"
    executed: 8
    passed: 4
    failed_stale_upstream: 4
    failure_reason: "not ok 4/5/6/7 检查的 ifilter.mh/irefile.mh/knowledge_base.mh/news2mail 不在 1.3.9 发行件中——上游 ChangeLog 记录这些 .pl 脚本已在更早版本 `removed (added to new mh-ifile)`，而 test.sh 未同步更新；且 install 目标只安装 $(MAIN_EXECUTABLES)=ifile 与 $(MAN_1_PAGES)=ifile.1。任何平台均不可通过，非本次适配引入"
  - file: argp/argp-ex1.c
    source: ifile-1.3.9/argp/argp-ex1.c
    description: "内嵌 argp 的示例/演示程序（argp-ex1..ex4、argp-test、tester 共 6 个），由 argp/Makefile.in 的 `checks` 目标编译；顶层 Makefile 从不注册 check/test，且这些程序无断言与退出码契约，不构成对 ifile 功能的验证，故本次未执行（计入静态分母、不计通过）"
    command: "(未执行：顶层构建不注册，且为演示程序)"
    executed: 0

# test_package 自带的测试（消费者视角验证）
test_package_tests:
  - file: test_ifile.sh
    description: "以 ifile 使用者身份运行交付的 bin/ifile：版本横幅、--help 退出码(证明链接期 duplicate symbol 已消除且 argp 可用)、stdin 训练 spam/work 各 3 封、$HOME/.idata 落盘、垃圾类查询首位为 spam、工作类查询首位为 work、-u 更新路径、两进程并发查询不死锁(flock 替换 System V 信号量的回归测试)、-r 复位(经 system())后数据库消失、man 页安装位置"
    command: "sh test_ifile.sh <scratch> <package_folder>   # 由 conanfile.py 经 VirtualRunEnv 调用"

assertion_count: 25
# 与 notes.md 第 3 节、manifest.yaml、PR 正文两张表逐字一致（数字唯一事实源＝notes 第 3 节）
N_static: 14            # test.sh 8 条断言 + argp `checks` 目标注册的 6 个演示程序
N_registered: 8         # ifile 顶层 Makefile 不注册 check/test，只有 test.sh 的 8 条可执行
N_executed: 8
N_passed: 4
N_failed_stale_upstream: 4
N_not_executed_upstream_examples: 6
N_consumer: 11
adapted_total: 25       # 8 + 6 + 11 ≥ N_static 14
