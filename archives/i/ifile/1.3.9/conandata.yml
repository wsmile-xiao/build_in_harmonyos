sources:
  # ifile 1.3.9 has no official upstream tarball: the author's site
  # (people.csail.mit.edu/jrennie/ifile -> qwone.com/~jason/ifile) only offers
  # 1.3.8 over plain HTTP, which R39/PF7 reject.  Debian/Ubuntu publish the
  # pristine upstream 1.3.9 release as a `.orig` (unrepacked, no +dfsg) source
  # package, and archive.ubuntu.com is not in the PF7 block list.  The bytes are
  # identical to the registry mirror and to old-releases (sha256 below), and 1.3.9
  # is a real, distinct release (65 files) rather than a rename of 1.3.8 (30 files).
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/i/ifile/ifile_1.3.9.orig.tar.gz"
  sha256: "f18f751b33fb867586be5b44277434dff7f4431cc8897ec7bf8e1f8c91ecb1ff"

patches:
  - patch_file: "patches/0001-configure-umask.patch"
    patch_description: >-
      E011: relax the config.status scratch-directory umask (077 to 022) in the
      top-level configure, because on HMDFS a directory created under
      `umask 077 && mktemp -d` is not writable, so config.status cannot write
      subs.sed and no Makefile is generated
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-argp-configure-umask.patch"
    patch_description: >-
      same E011 umask fix for the bundled argp sub-project, which is its own
      autoconf 2.59 project and needs its own config.status before the
      top-level `cd argp ; make libargp.a` can work
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-ifile.c-sysv-sem-to-flock.patch"
    patch_description: >-
      replace the System V semaphore pair at the top of main() with an advisory
      flock() on $HOME/.ifile.lock: the platform seccomp policy raises SIGSYS for
      semget/shmget/msgget, so the unpatched binary cannot even print --version
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0004-Makefile.in-dead-shell-lines.patch"
    patch_description: >-
      comment out two shell statements accidentally left in Makefile.in, which
      GNU make rejects with "Makefile:57: *** missing separator"
    patch_type: "bugfix"
    strip: 1
