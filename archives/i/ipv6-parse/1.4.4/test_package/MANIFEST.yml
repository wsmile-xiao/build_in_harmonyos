# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ipv6-parse/1.4.4
homepage: "https://github.com/jrepp/ipv6-parse"

# 上游测试命令 (CMake 项目, 测试可执行文件由 CMake 构建)
upstream_check_command: "cmake --build build && ./build/bin/ipv6-test && ./build/bin/ipv6-test-extended"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: ipv6-parse-1.4.4/test.c
    description: "主测试套件: 315/315 通过 (RFC 4291/5952/4007 解析、往返转换、诊断事件、API)"
    command: "./build/bin/ipv6-test"
  - file: test_extended.c
    source: ipv6-parse-1.4.4/test_extended.c
    description: "扩展测试套件: 99/99 通过 (诊断事件、边界输入、组件溢出等)"
    command: "./build/bin/ipv6-test-extended"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ipv6_parse.c
    description: "消费者测试: 调用 ipv6-parse API 解析 '::1' 并断言结果"
    command: "./test_ipv6_parse"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 414
