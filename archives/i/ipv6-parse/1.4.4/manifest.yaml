# 版本级 manifest — ipv6-parse 1.4.4
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.4"

# 软件名
software: ipv6-parse

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方 tag v1.4.4）
  url: "https://github.com/jrepp/ipv6-parse/archive/refs/tags/v1.4.4.tar.gz"

  # 源码校验和（实测 tarball sha256，官网上游）
  sha256: "fa3062c695982c6ecfb2c85a013b9e4175e8afaba3b9602ef49bf30cb9e81d90"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DIPV6_CONAN_BUILD=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ipv6-parse 是纯 C CMake 库（上游自带 conanfile.py 与 vcpkg/debian/Formula 发行），npm/WASM 仅为绑定层；R47 语言预检应判 c/cpp 而非 nodejs"