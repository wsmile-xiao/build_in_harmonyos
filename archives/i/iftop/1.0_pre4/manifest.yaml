# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "config.guess/config.sub 需添加 HarmonyOS/linux-ohos 识别 ref: E007"
  - "musl/OHOS 无 pthread_cancel，用 flag+pcap_breakloop+join 替代 ref: E085,E127"
  - "OHOS HMDFS 上 configure 临时目录需 umask 022 ref: E011,E214"
  - "ncurses 为系统同名库，必须静态链接（R26），避免遮蔽系统 libncursesw.so.6"
  - "ncurses/6.4 包不含 ncursesw.h，configure curses 探测需临时 wrapper"

