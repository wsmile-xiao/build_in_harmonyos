# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/"
    - "--build=aarch64-unknown-linux-ohos"
    - "--sbindir=${prefix}/bin"
    - "--with-libpcap=<libpcap package folder>"
  # 说明: --with-libpcap 与 CPPFLAGS/LDFLAGS 在 conanfile.py generate 阶段
  # 从 Conan 依赖图（ncurses/6.4 + libpcap/1.10.6）动态注入，不硬编码本机路径。

  # 编译依赖列表（格式: name/version，来自 ohpcd 制品仓）
  dependencies:
    - "ncurses/6.4"
    - "libpcap/1.10.6"

  # 编译器
  cc: clang
  cxx: clang++

