# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: iftop/1.0_pre4
homepage: "https://pdw.ex-parrot.com/iftop/"

# 上游测试命令（iftop 上游 Makefile.am 无 TESTS/check_PROGRAMS 目标，
# make check 无实际测试可运行）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# iftop 上游无自动化测试套件（源码树无 *test* 文件，Makefile.am 无 TESTS 目标）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，版本受控的 test.sh）
test_package_tests:
  - file: test.sh
    description: "真实执行安装后的 iftop -h：断言退出码 0、synopsis 行与版本行 'iftop, version 1.0pre4' 均存在（3 个 case，3 个断言）"
    command: "sh test.sh"

# 测试断言总数（test.sh 实际执行的检查数：case1 退出码 + case2 synopsis + case3 版本行）
assertion_count: 3
