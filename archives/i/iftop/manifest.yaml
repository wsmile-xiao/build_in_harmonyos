# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: iftop
display: "iftop"
description: "Real-time bandwidth monitoring tool that displays network usage by host"
category: network
homepage: "https://pdw.ex-parrot.com/iftop/"
license: "GPL-2.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub patched for HarmonyOS platform detection (E007)"
    - "pthread_cancel unavailable on musl/OHOS, replaced with flag+pcap_breakloop+join (guarded by HAVE_PTHREAD_CANCEL)"
    - "Global variables in ui_common.h changed to extern declarations"
    - "ncurses/6.4 (static ncursesw) and libpcap/1.10.6 from ohpcd artifact repo; R26 static for system same-name libs"
    - "configure umask 077→022 for HMDFS compatibility (E011/E214)"
  common_dependencies:
    - ncurses
    - libpcap

versions:
  "1.0_pre4":
    status: built
    build_date: "2026-08-15"
