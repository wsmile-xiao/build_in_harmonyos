package: incremental/24.7.2
homepage: "https://github.com/twisted/incremental"
upstream_check_command: "tox -e tests"
upstream_test_in_build: false
upstream_test_command: "tox -e tests"
upstream_tests:
  - file: src/incremental/tests/
    source: incremental-24.7.2.tar.gz/src/incremental/tests/
    description: "Three upstream Twisted Trial modules; run unmodified in the isolated tox tests environment after its wheel install"
    command: "trial incremental"
  - file: tests/test_examples.py
    source: incremental-24.7.2.tar.gz/tests/test_examples.py
    description: "Upstream packaging example integration test in the isolated tox tests environment"
    command: "trial tests/test_examples.py"
test_package_tests:
  - file: functional.py
    description: "Six groups covering the core version API, package path/type marker/license, and exclusion of optional update/Hatch integrations"
    command: "python3 functional.py <absolute-package-folder> <results-json>"
assertion_count: 15
