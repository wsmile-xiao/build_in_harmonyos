# 上游交付物是 include/itlib/*.hpp 单头集合（header-library），上游 CMakeLists 只有
# INTERFACE 目标、无 install() 规则；跑上游 CMake 仅为执行测试树
# （程序口径 47 个 ctest 项 = 44 doctest 可执行 + 3 build-failure；
#   N 口径按 §7.3 候选数法取源码宏数 130，见 notes.md 与 test_package/MANIFEST.yml）
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL（官方 GitHub tag 归档，R39；三路取证见 conandata.yml 头注释）
