  source_orig_hash: 96f7931680334ed8
  source_work_hash: 3277e063ebb2fb66
  generated_at: '2026-09-27T00:51:57'
  patches_count: 3

patch_classification:
  - file: 0001-test-t-time_t-11.cpp.patch
    type: platform
    platform_only: True
    guard: 'test/t-time_t-11.cpp: 仅把 std::locale 名从 en_US.UTF8 改为 bionic+ICU74 认的 en_US.UTF-8（newlocale 探针实测前者 FAIL 后者 OK）；CHECK 断言、期望字符串与用例数一字未动，且没有删/跳过任何用例'
  - file: 0002-include-itlib-generator.hpp.patch
    type: platform
    platform_only: False
    guard: 'include/itlib/generator.hpp: 给从属类型名 pseudo_iterator::end_t 补 typename —— 标准要求的写法（clang15 报硬错误），所有编译器语义等价，不改任何运行期行为'
  - file: 0003-include-itlib-transparent_umap.hpp.patch
    type: platform
    platform_only: False
    guard: 'include/itlib/transparent_umap.hpp: 两行 using（super::iterator / super::const_iterator）补 typename，同 0002；不改运行期行为'
