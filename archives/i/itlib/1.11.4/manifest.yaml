  # 源码校验和（2026-09-26 设备实测下载值 == CCI recipes/itlib/all/conandata.yml 的 1.11.4 条目）
  sha256: "09b155afcb9766fe36d0156294f6656956189235612eb7711903ebc22079c37e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py generate() 的 cache_variables 一致）
  # ITLIB_BUILD_TESTS=ON ⇒ 层 1 上游测试在 build() 内实跑（程序口径 47 个 ctest 项 + 注册数硬断言；
  # 上游用例 N=130 源码宏、实跑 125 / NOT_RUN 5，见 notes.md §上游测试清点）
  configure_options:
    - "-DITLIB_BUILD_TESTS=ON"

  # 编译依赖列表（格式: name/version）
  # header-only，0 运行依赖（W0-2 实查双零）；conandata 里的 icm/doctest-util/doctest-lib/
  # CPM.cmake 只是上游测试树的 CPM 依赖，在 source() 阶段预下载、不进 conan 依赖图
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# 供 finish 内嵌 G0 clean-verify 的 cmake configure 直接取用（该闸按本键解析）
build_options: "-DITLIB_BUILD_TESTS=ON"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（3 个 platform 补丁，逐条说明见 conandata.yml 的 patches 段）
patches_applied:
  - "0001-test-t-time_t-11.cpp.patch"
  - "0002-include-itlib-generator.hpp.patch"
  - "0003-include-itlib-transparent_umap.hpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（行尾注释 # knowledge_ref: 只对真实存在的草稿写）
knowledge_gained:
  - "clang 15（OHOS 工具链 15.0.4）对「从属类型名缺 typename」判硬错误：generator.hpp 的 pseudo_iterator::end_t 与 transparent_umap.hpp 的 super::iterator/super::const_iterator 共 3 处；上游 CI 只跑 gcc/msvc/AppleClang 看不见，补 typename 是严格更符合标准的等价写法"
  - "bionic + ICU74 只认 .UTF-8 连字符 locale 名：newlocale(LC_ALL_MASK, \"en_US.UTF8\") 返回 NULL，std::locale(\"en_US.UTF8\") 构造 collate_byname 直接抛异常；上游 t-time_t-11 硬编码该名，改 en_US.UTF-8 即恢复（断言与用例数不动）"
  - "上游 test/ 走 CPM.cmake 直连 GitHub：source() 预下载三包 + CPM.cmake 后，用 -DCPM_SOURCE_CACHE 消掉引导脚本下载、用 -DCPM_<name>_SOURCE 手工 override 消掉全部 FetchContent 拉取，configure 阶段零网络（CPM.cmake 的 override 分支优先级最高）"
  - "header-only 库的上游测试面可直接接进 conan create 的 build()：configure + build + ctest，另加「CTestTestfile.cmake 的 add_test 注册数 == 程序口径清点 47」硬断言防 ctest 空跑假绿（itlib 47 = 44 个 t-*.cpp + 3 个 bft-*.cpp；上游用例 N 按 §7.3 取源码宏 130，两口径分工不同不冲突）"

