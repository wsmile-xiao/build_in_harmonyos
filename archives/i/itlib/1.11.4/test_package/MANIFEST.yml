# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md 与 references/iron-rules.md R51（上游测试三步法）

package: itlib/1.11.4
homepage: "https://github.com/iboB/itlib"

# ── 上游测试入口 ─────────────────────────────────────────────────────────
# 上游 tarball 自带 CMakeLists.txt：ITLIB_BUILD_TESTS=ON 时
# `enable_testing()` + add_subdirectory(test) → test/CMakeLists.txt 用宏
# add_itlib_test/<add_test> 注册 47 个 CTest 用例。上游无 make check，
# CMake 项目的等价入口是 ctest。
upstream_check_command: "ctest --test-dir <build-dir> --output-on-failure"

# conanfile.py build() 中已集成上游测试（docs/TEST_QUALITY_SPEC.md §3.1 层 1 必做）
upstream_test_in_build: true
upstream_test_command: "cmake.ctest(cli_args=['--output-on-failure','-j4'])   # 配方 build() 内 configure + build + ctest，注册数硬断言 47；沙箱 HOME 手工复跑证据见 reports/test-report.md"

# 上游实际运行的测试（47 个 CTest 用例 = 44 个 doctest 可执行 + 3 个 build-failure 用例）
# 逐用例 PASS/断言数见 reports/test-report.md 两表
upstream_tests:
  - file: itlib-test-*
    source: test/t-*.cpp
    description: "44 个 doctest 可执行（按 C++11/14/17/20 分档：t-<lib>-<std>.cpp），每个由 test/doctest_main.cpp 提供 DOCTEST_CONFIG_IMPLEMENT_WITH_MAIN 主函数；上游按 `add_itlib_test(<lib>)` 展开 32 个库名 × 可用标准档"
    command: "./itlib-test-<lib>-<std>"
  - file: itlib-bft-*
    source: test/bft-*.cpp
    description: "3 个 build-failure 测试（icm_add_multiple_build_failure_tests，期望编译失败）：bft-small_vector-revert-cap-mismatch / bft-pod_vector-pod / bft-utility-force_move；由 icm 生成 cmake -P 脚本，断言编译报错且含源文件 `// build error:` 标注的诊断文本"
    command: "ctest -R itlib-bft"
  - file: CTestTestfile.cmake
    source: test/CMakeLists.txt
    description: "ctest 注册面（**程序口径，不作 N**）：`ctest -N` 显示 Total Tests: 47 = test/ 下 44 个 t-*.cpp 可执行 + 3 个 bft-*.cpp；N 按 §7.3 取源码宏数 130（见文件末「N 的取数命令」）"
    command: "ctest --test-dir <build-dir> -N"

# test_package 中自带的测试（消费者视角验证，鸿蒙特有测试行）
test_package_tests:
  - file: test.cpp
    description: "itlib 消费者测试：从已安装包 include/itlib/*.hpp 真实调用 12 个交付头的公开 API（strutil/qalgorithm/span/small_vector/static_vector/flat_map/dynamic_bitset/any/expected/type_traits/utility/time_t），运行期断言 91 条"
    command: "./test_itlib"

# ── N 的取数命令（R51 候选数法：同一单位取最大值，差额逐项归因）──────────
# 2026-09-27 返修（外部审查 rule4「少报: 上游实测 N=127 > 声明 N=47」）按
# notes/device-facts.md §7.3 重算：**测试程序数/源码文件数不是 N**（zfp 2 → 712 同型）。
#
#   1) 源码宏数（**N 口径·候选最大值**）: grep -rn "TEST_CASE(" <source>/test/ | wc -l
#        → 130   （其中 test/*.cpp 127 + t-atomic_shared_ptr_storage.inl 3）
#   2) 框架注册数: 44 个 itlib-test-* 逐可执行 `--list-test-cases` 求和
#        → 128   （与逐可执行运行期 `test cases:` 求和同值互证）
#   3) CTest 注册数（程序口径，不作 N）: ctest --test-dir <build> -N → Total Tests: 47
#        = 44 个 doctest 可执行 + 3 个 build-failure 用例
#   4) doctest 断言数（assertion 单位，单列不作 N）: 逐可执行运行期 `assertions:` 合计 → 4487
#   5) 消费者断言数（鸿蒙特有，分栏不进上游分母）: ./test_itlib → ITLIB-CONSUMER checks=91 → 91
#
# N = max(130, 128, 47) = **130**（1)/2) 同为「测试用例数」单位；3) 是「测试程序数」单位，
# §7.3 明确其不得当 N；4)/5) 单位不同，按「四口径不混用」单列）。
# N′ = 125（1) 口径下本平台实际注册并运行的源码用例），
#      TOTAL = PASS 125 + FAIL 0 + SKIP 0 + NOT_RUN 5 = 130 = N，通过率 125/130（96%）；
#      同轮互证：框架口径 128/128 test case、断言 4487/4487、CTest 程序口径 47/47 全过。
#
# 差额归因（严格合计）:
#   130 → 125: −5 = 上游自带预处理守卫在本平台不成立而未编译的 5 个用例
#        （t-any-17 ×2、t-pmr_allocator-17 ×2、t-atomic_shared_ptr_storage-20 ×1，
#          逐项见 notes.md「NOT_RUN 5 项逐项」表）
#   125 → 128: +3 = t-atomic_shared_ptr_storage.inl 的 3 个宏被 -11 与 -20 两个 TU 各注册一次
#   审方实测 127 → 本设备实测 128: −5（守卫）+6（.inl 双 TU 注册）= +1；
#        审方 127 与 `grep "TEST_CASE(" test/*.cpp` 逐字同值（未含 .inl 的 3 个宏）
#   128 → 47: 44 个 doctest 可执行（test case 合计 128）+ 3 个 build-failure（源码无 TEST_CASE 宏）
#   3 个 build-failure 用例不进 N（源码无宏、单位不同），本次 ctest 3/3 实跑通过，单列在口径 3)。
#
# 「上游默认未编译」的 5 个用例：既不是 PASS 也不是 SKIP，按 §7.3 在本文件与 notes.md
# 单列说明并给出守卫证据。
assertion_count: 91   # = test_package/test.cpp 消费者断言数（运行期 ITLIB-CONSUMER checks=91）
