# conandata.yml — itlib 1.11.4
#
# 单一事实来源：上游 tag v1.11.4 归档 URL + SHA256。
# 三路取证一致（2026-09-26 设备实测）：
#   1. git ls-remote --tags <上游仓库>（github.com/iboB/itlib）。注释内刻意不写任何
#      https:// 裸 URL：CI 的 pre-download 对整份 conandata 做
#      content.replace(url, 'file://…') 字面替换，注释里的短 URL 会当**前缀**改写真正的
#      源 URL（实测根因与读数见 notes.md 问题 9）
#        refs/tags/v1.11.4     = a061e1dccfa3d04ee3bc36388c94745ce813d0ea（tag 对象）
#        refs/tags/v1.11.4^{}  = d51231a7a7dbbd56ff6680ea509e84a41eddfa2c（指向提交）
#        全量 50 个 tag / 100 行（含 annotated 解引用）逐条命中
#   2. 本地下载 sources["1.11.4"].url 指向的归档（v1.11.4 tag 归档，86904 字节）
#        sha256 = 09b155afcb9766fe36d0156294f6656956189235612eb7711903ebc22079c37e（86904 字节）
#   3. CCI conan-center-index recipes/itlib/all/conandata.yml 的 "1.11.4" 条目同值。
#
# 后四条是**上游测试树的 CPM 依赖**（见下方注释），不是本库的运行依赖：
# 本库 0 运行依赖（W0-2 实查 conan list itlib/* -r=ohpcd = 0、配方 requires 双零）。

sources:
  "1.11.4":
    url: "https://github.com/iboB/itlib/archive/v1.11.4.tar.gz"
    sha256: "09b155afcb9766fe36d0156294f6656956189235612eb7711903ebc22079c37e"

# 上游 test/CMakeLists.txt 在 configure 阶段经 CPM.cmake 直连 GitHub 拉取三个包
# （icm@1.5.1 + doctest-util@0.1.2，后者再拉 doctest-lib@2.4.11），
# CI worker 无法直连 github.com（crow 1.3.3 / glob 0.0.1 同族先例）。
# 处置：全部进 conandata.yml → source() 阶段预下载（CI 的 mirror fallback + pre-download
# 对本文件的每条 url 生效）→ build() 用 -DCPM_SOURCE_CACHE 与 -DCPM_<name>_SOURCE
# 指向本地源码，configure 阶段零网络。
icm_sources:
  url: "https://github.com/iboB/icm/archive/refs/tags/v1.5.1.tar.gz"
  sha256: "2916b6b0c5773c2d0df765c33ebf683dc665cf9542bfb3d1fc353e40e3dfbb3f"

doctest_util_sources:
  url: "https://github.com/iboB/doctest-util/archive/refs/tags/v0.1.2.tar.gz"
  sha256: "227a6483bcbd540605650ce8dd11e82d7ad97f5d62068461eb5943adbbf58e1e"

doctest_lib_sources:
  url: "https://github.com/iboB/doctest-lib/archive/refs/tags/v2.4.11.tar.gz"
  sha256: "b450d66f2eb4c23726db5d3260596ec910f1ab8d9f89165a8e98261c1138f9c2"

# CPM.cmake 引导脚本（test/get_cpm.cmake 在 configure 期 file(DOWNLOAD) 直连 GitHub），
# source() 阶段下载到 <source>/_deps/cpm/CPM_0.35.6.cmake 并 sha256 自校验，
# build() 传 -DCPM_SOURCE_CACHE=<source>/_deps 让 itlib 与 doctest-util 两处
# get_cpm.cmake 都直接命中本地文件（get_cpm.cmake: if(CPM_SOURCE_CACHE) 分支）。
cpm_source:
  url: "https://github.com/cpm-cmake/CPM.cmake/releases/download/v0.35.6/CPM.cmake"
  sha256: "6b47e2a94b69c59acda5567401afc67ac53e9a95bf90cfd4f1e9792c4d8ec815"
patches:
  - patch_file: "patches/0001-test-t-time_t-11.cpp.patch"
    patch_description: "test/t-time_t-11.cpp: 硬编码 std::locale(\"en_US.UTF8\") 在 bionic+ICU74 上 newlocale() 返回 NULL（只认 .UTF-8 连字符形态），构造 collate_byname 直接抛异常导致 [time_t] tm 用例必败；改用 en_US.UTF-8。断言、用例数、比对逻辑一字未动"
    patch_type: "platform"
  - patch_file: "patches/0002-include-itlib-generator.hpp.patch"
    patch_description: "include/itlib/generator.hpp: 从属类型名 pseudo_iterator::end_t 缺 typename，clang 15（OHOS 工具链 15.0.4）判硬错误 missing 'typename' prior to dependent type name（P0634R3 在 clang16 才完整落地，上游 CI 只跑 gcc/msvc/AppleClang 看不见）；补 typename 是严格更符合标准的等价写法"
    patch_type: "platform"
  - patch_file: "patches/0003-include-itlib-transparent_umap.hpp.patch"
    patch_description: "include/itlib/transparent_umap.hpp: 同 0002 —— using iterator = super::iterator / using const_iterator = super::const_iterator 两行缺 typename，clang 15 在全标准档（11/14/17/20）下均硬错误；补 typename，语义与所有编译器等价"
    patch_type: "platform"
