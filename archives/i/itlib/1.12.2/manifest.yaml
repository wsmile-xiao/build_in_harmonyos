software: itlib
# 版本级 manifest
# 文件位置: archives/i/itlib/1.12.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.12.2"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方正式源，R39；CI 自动添加镜像 fallback）
  url: "https://github.com/iboB/itlib/archive/refs/tags/v1.12.2.tar.gz"

  # 源码校验和（官方 tarball 实测：3c29ae38f3d437f4eb0cd2660012edd5d0ebcca36ed5e96a3b4af9237bc68a0d）
  sha256: "3c29ae38f3d437f4eb0cd2660012edd5d0ebcca36ed5e96a3b4af9237bc68a0d"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DITLIB_BUILD_TESTS=OFF"

  # 编译依赖列表（format: name/version）
  dependencies: []

  # 编译器
  cc: clang

  # 目标架构
  arch: arm64

# ============================================================
# 测试信息
# ============================================================

test:
  # 上游测试入口（describe/reg，ITLIB_BUILD_TESTS 关闭时由本地独立构建运行）
  upstream_test_command: "cmake -DITLIB_BUILD_TESTS=ON .. && cmake --build . && ctest"
  # 消费者测试
  consumer_test_command: "conan test test_package itlib/1.12.2"