# test_package/MANIFEST.yml
# 上游官方测试声明 + test_package 消费者验证声明（实测数据）
# 完整上游测试台账见 reports/upstream-test-ledger.md（双口径枚举，本文件为 CI 读取摘要）

package: itlib/1.12.2
homepage: "https://github.com/iboB/itlib"

# 上游测试命令（官方 tag v1.12.2 源码枚举结果）
# 构建系统：CMake（test/CMakeLists.txt，add_itlib_test() 按 C++ 标准 11/14/17/20 生成独立可执行用例）
# 注意：上游测试 configure 期经 CPM 从 GitHub 拉取 doctest/icm/doctest-util/picobench，
# 离线 CI 下 conan create 关闭 ITLIB_BUILD_TESTS（E342），上游测试在本地单独构建运行。
upstream_check_command: "cmake -DITLIB_BUILD_TESTS=ON && cmake --build . && ctest"

# 上游测试源声明总数（test/ 目录 50 个 t-*.cpp + 1 个 .inl 共享体）：
#   165 个独立 TEST_CASE 声明（枚举命令 grep -c '^TEST_CASE' test/t-*.cpp test/t-*.inl）
#   + 2 个编译能力探针（t-pmr_allocator-20 / t-transparent_umap-20，无 TEST_CASE）
#   + 3 个 bft 编译失败测试（预期编译失败，非运行用例）+ 1 个基准（b-rand_dist，非 doctest 用例）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（OHOS 配置，本地独立构建运行）：
#   53 个 CTest 注册测试（50 个 t-* 可执行 + 3 个 bft），52 通过；
#   itlib-time_t-11 的 [time_t] tm 用例因 OHOS 无 en_US.UTF8 locale 数据而失败
#   （std::locale 构造抛异常，真实平台限制，非当前库缺陷），该文件其余 2 用例与 33 断言全过。
upstream_tests:
  - file: t-itlib-11.cpp
    source: test/t-itlib-11.cpp
    description: "C++11 编译能力探针（1 test case）"
    command: "./itlib-test-itlib-11"
    result: "passed"
  - file: t-any-11.cpp
    source: test/t-any-11.cpp
    description: "C++11 any 用例（3 test cases）"
    command: "./itlib-test-any-11"
    result: "passed"
  - file: t-any-17.cpp
    source: test/t-any-17.cpp
    description: "C++17 any 扩展用例（2 test cases）"
    command: "./itlib-test-any-17"
    result: "passed"
  - file: t-flat_map-11.cpp
    source: test/t-flat_map-11.cpp
    description: "C++11 flat_map 用例（8 test cases）"
    command: "./itlib-test-flat_map-11"
    result: "passed"
  - file: t-flat_set-11.cpp
    source: test/t-flat_set-11.cpp
    description: "C++11 flat_set 用例（7 test cases）"
    command: "./itlib-test-flat_set-11"
    result: "passed"
  - file: t-small_vector-11.cpp
    source: test/t-small_vector-11.cpp
    description: "C++11 small_vector 用例（5 test cases）"
    command: "./itlib-test-small_vector-11"
    result: "passed"
  - file: t-span-11.cpp
    source: test/t-span-11.cpp
    description: "C++11 span 用例（7 test cases）"
    command: "./itlib-test-span-11"
    result: "passed"
  - file: t-time_t-11.cpp
    source: test/t-time_t-11.cpp
    description: "C++11 time_t 用例（3 test cases，[time_t] tm 因 OHOS 缺 en_US.UTF8 locale 数据失败）"
    command: "./itlib-test-time_t-11"
    result: "failed_locale"
  - file: bft-*.cpp
    source: test/bft-*.cpp
    description: "编译失败测试 3 个（预期编译失败，通过=符合预期）"
    command: "ctest -R bft"
    result: "passed"
  - file: b-rand_dist.cpp
    source: test/b-rand_dist.cpp
    description: "picobench 基准（非 doctest 用例，仅构建）"
    command: ""
    result: "built_not_run"

# test_package 中自带的测试（消费者视角验证，R34 实质调用被测库 API）
test_package_tests:
  - file: test_itlib.cpp
    description: "消费者测试：small_vector/flat_map/flat_set/span 公开 API 调用 + 可观察断言"
    command: "./test_itlib"

# 测试断言总数（上游实际运行断言 + test_package 断言，近似值）
assertion_count: 200