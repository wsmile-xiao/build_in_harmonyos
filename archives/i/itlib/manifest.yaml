    - "上游测试经 CPM 拉取 doctest/icm/doctest-util/picobench（GitHub 依赖），conan create 关闭 ITLIB_BUILD_TESTS，上游测试在本地单独枚举运行并由 test_package 承担消费者验证"
  common_dependencies: []

