# 软件级 manifest
# 文件位置: archives/i/include-what-you-use/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: include-what-you-use

# 显示名
display: "include-what-you-use (IWYU)"

# 一句话描述
description: "C/C++ #include 分析工具（基于 Clang 22 前端）：头文件依赖分析与 fix_includes.py 改写"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: build-tool

# 官网 URL
homepage: "https://include-what-you-use.org"

# 开源许可证（SPDX 标识）
license: Apache-2.0

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "standalone 构建需 clang 包真实 cmake config（AddLLVM/HandleLLVMOptions/clang-cpp 目标），CMakeDeps 合成版不可用"
    - "设备 uname -s=HarmonyOS → Platform/HarmonyOS.cmake（include Platform/Linux）经 CMAKE_MODULE_PATH 注入，不设 CMAKE_SYSTEM_NAME"
    - "iwyu 内置 driver 在 OHOS 无 C/C++ 标准库默认搜索路径 → 测试用 -isystem 注入 SDK libcxx v1 + musl sysroot 双层（勿用 CPATH 类环境变量）"
    - "iwyu 0.26 无 --json/--fix_headers 选项；文件改写由官方 fix_includes.py 管道完成（iwyu 报告在 stderr，须 2>&1）"
    - "OHOS XPM：iwyu ELF 与捆绑 .so 均须自签（objcopy 去 .codesign + binary-sign-tool）"
  common_dependencies:
    - clang/22.1.8
    - llvm/22.1.0
    - zlib/1.3.2
    - zstd/1.5.7
    - xz/5.8.3.1
    - libedit/20240808
    - z3/4.15.4

# 版本索引
versions:
  "0.26.src":
    status: built
    build_date: "2026-09-27"
