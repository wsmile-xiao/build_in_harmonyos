# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.26.src/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（与上游官方源码包名对齐，全程统一）
version: "0.26.src"

# 软件名
software: "include-what-you-use"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  # codeload.github.com = GitHub 官方 tag 归档后端（release 资产链设备不可达，实测 2026-09-27，详见 notes.md）
  url: "https://codeload.github.com/include-what-you-use/include-what-you-use/tar.gz/refs/tags/0.26"

  # 源码校验和（sha256sum 实测）
  sha256: "ca3f157a5e6bf293cfb2fea585b103ec87245d02eaee0b6ab832665e740016eb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_MODULE_PATH=<build>/_cmake_modules"   # Platform/HarmonyOS.cmake（include Platform/Linux，设备 uname -s=HarmonyOS）
  - "-DLLVM_DIR=<clang包>/lib/cmake/llvm"
  - "-DClang_DIR=<clang包>/lib/cmake/clang"
  - "-DIWYU_RESOURCE_RELATIVE_TO=iwyu"
  - "-DIWYU_RESOURCE_DIR=../lib/clang/22"
  - "-DCMAKE_INSTALL_RPATH=$ORIGIN/../lib"
  - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version；W0 已核验全部在 ohpcd 制品仓）
  dependencies:
  - clang/22.1.8
  - llvm/22.1.0
  - zlib/1.3.2
  - zstd/1.5.7
  - xz/5.8.3.1
  - libedit/20240808
  - z3/4.15.4

  # 编译器
  cc: /data/service/hnp/bin/clang
  cxx: /data/service/hnp/bin/clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无：上游源码零修改，Platform/HarmonyOS.cmake 为 build 目录新增模块非源码补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "设备 uname -s=HarmonyOS 不在 LLVM 22 平台表 → Platform/HarmonyOS.cmake（include Platform/Linux）经 CMAKE_MODULE_PATH 注入，不设 CMAKE_SYSTEM_NAME 保 native（llvm/clang 配方同款先例）"
- "IWYU standalone 需 clang 包真实 cmake config（CMakeDeps 合成版无 AddLLVM/HandleLLVMOptions/clang-cpp 目标）→ LLVM_DIR/Clang_DIR 直指 clang 包 lib/cmake/{llvm,clang}"
- "iwyu 内置 driver 默认搜索路径在 OHOS 无 C/C++ 标准库 → -isystem 注入 SDK libcxx v1 + musl sysroot 双层（system 头分类；CPATH 类环境变量会被归为 user include 破坏 IWYU 归属）"
- "iwyu 0.26 无 --json/--fix_headers 选项：文件改写由官方配套 fix_includes.py 完成（iwyu 报告在 stderr，管道须 2>&1）；iwyu 遇硬编译错误 rc=1 不产报告"
- "clang-cl/--driver-mode=cl 模式拒绝 -isystem 与 --sysroot → 测试 wrapper 按参数分支（cl 模式纯透传）；IWYU_ARGS 实为 --driver-mode=cl（LLVM 18+ 新式写法）"
- "OHOS XPM：iwyu ELF 与捆绑 .so 均须 objcopy 去 .codesign + binary-sign-tool 自签；运行时 3 个 NEEDED .so 自 clang 包捆绑入包内 lib/ + RUNPATH=$ORIGIN/../lib 自包含"
