# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: include-what-you-use/0.26.src
homepage: https://include-what-you-use.org

# 上游测试命令（开发者全量构建语境下；ctest 注册 227 条 = 1 gtest + 224 e2e + 2 py）
upstream_check_command: "ctest -j4 --test-dir <build>"
upstream_test_in_build: false

# 上游全量测试已在 OHOS 真机实测（不在 CI build() 中重复执行：3 条失败为 OHOS libc++/musl
# 与上游 CI libstdc++/glibc 的标准库实现差异，在 CI 中恒红，无门禁价值；实测证据见下与
# archives/i/include-what-you-use/0.26.src/notes.md "验证结果"节）。
upstream_test_manual_run: >-
  2026-09-27 OHOS 真机全量 ctest：N=227，通过 223，跳过 1（cxx.test_ms_inline_asm，
  SKIP 码 77 合法跳过——MSVC 专属 inline asm 用例，上游在非 MSVC 环境即跳过），
  失败 3，通过率 98.2%（≥90% 达标），Total Test time 20.98s。
  3 条失败均为标准库实现差异（非适配缺陷）：
  (1) cxx.test_badinc：#include <string> 的 for 注释差异——OHOS libc++ 的 std::string
      经 allocator/char_traits 间接使用（libstdc++ 不展开），include 建议本身一致；
  (2) cxx.test_libbuiltins：std::pow(float, float) 归属诊断差异——libc++ 的 <cmath>
      重载经 using-decl 可见性不同；
  (3) cxx.test_std_size_t：glibc 下期望 stdio.h→cstdio 替换，OHOS musl sysroot 下
      iwyu 判定 stdio.h 已正确（默认 std_symbol_map 归属判定随 libc 头结构不同）。
  测试环境配方（wrapper/CTestTestfile/签名/资源目录桥接）见 notes.md "注意事项"节。

exempted_tests:
  - file: tests/bugs/**
    name: bug 回归套件 (XFAIL)
    reason: >-
      上游 README 声明该套件主要在 Linux GCC/Clang 环境运行；默认 ctest 不注册
      （需 run_iwyu_tests.py --extra-suite=bugs 显式加入）；56 目录/137 文件均为
      open issue 复现（IWYU_XFAIL 标记）。
    evidence: >-
      CMakeLists.txt 注册 e2e 测试时 execute_process 未传 --extra-suite → 默认不注册；
      tests/bugs/README.md 声明平台范围。
  - file: tests/stdin/**
    name: stdin 冒烟 (iwyu-run-stdin-tests.bash)
    reason: >-
      手动 runner（非 ctest 注册），5 个文件仅验证 iwyu 对 stdin 输入无错误完成；
      其覆盖面被 C1（基础头分析）实质包含。
    evidence: >-
      iwyu-run-stdin-tests.bash 为手动脚本，CMakeLists 无对应 add_test。

# 上游测试套件（本配方不在 build() 中执行；见上实测记录与豁免）
upstream_tests: []

# test_package 中自带的测试（CI conan create 实跑，消费者用例 C1-C3，R34 实质执行被测二进制）
test_package_tests:
  - file: c1_bad.cc
    description: "C1 基础头分析：漏 <vector> 的 C++ 文件，断言报告含 should add + #include <vector>"
    command: "include-what-you-use -isystem <libcxx v1> -isystem <sysroot 双层> c1_bad.cc 2>&1 | grep -F 'should add these lines' && grep -F '#include <vector>'"
  - file: c1_bad.cc
    description: "C2a 确定性退出码：违规文件 + -Xiwyu --error → 退出码 1（0.26 无 --json 选项的等价断言）"
    command: "include-what-you-use -Xiwyu --error ... c1_bad.cc; test $? -eq 1"
  - file: c2_ok.cc
    description: "C2b 确定性退出码：include 正确文件 + -Xiwyu --error → 退出码 0"
    command: "include-what-you-use -Xiwyu --error ... c2_ok.cc; test $? -eq 0"
  - file: c3_fix.cc
    description: "C3 文件改写：iwyu 2>&1 | fix_includes.py 管道（0.26 无 --fix_headers，官方配套脚本等价），断言 include 行精确替换（#include \"consumer_b.h\" 消失 / #include \"consumer_a.h\" 出现，精确到 include 行防注释误匹配）+ 改写后 clang++ -fsyntax-only 可编译；工作文件测试后删除（防归档树污染）"
    command: "include-what-you-use ... c3_run.cc 2>&1 | python3 fix_includes.py c3_run.cc && grep -F '#include \"consumer_a.h\"' c3_run.cc && ! grep -F '#include \"consumer_b.h\"' c3_run.cc && clang++ -fsyntax-only c3_run.cc; rm -f c3_run.cc"
  - file: conanfile.py
    description: "冒烟：include-what-you-use --version 可执行（签名 ELF + 自包含运行时）"
    command: "include-what-you-use --version"

# 真机实测（2026-09-27，安装树 bin/include-what-you-use 自签后）：
#   C1 通过（报告含 should add + #include <vector>）
#   C2a 通过（rc=1）  C2b 通过（rc=0，输出 has correct #includes/fwd-decls）
#   C3 通过（IWYU edited 1 files；改写后可编译）
#   --version = "include-what-you-use 0.26 based on clang version 22.1.8"
test_package_result: "5/5 passed (100%) on OHOS device (manual, 2026-09-27); CI conan create 复跑"

assertion_count: 5
