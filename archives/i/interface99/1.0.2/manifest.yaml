# 版本级 manifest —— interface99 1.0.2
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.2"
software: interface99

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-15"
build_system: header-only

source:
  url: "https://github.com/Hirrolot/interface99/archive/refs/tags/v1.0.2.tar.gz"
  sha256: "8bd007c48cf05436ced60884e8e3a05ede46105f3efae9bf29e0f4d30f938f9e"
  tar_format: tar.gz
  bundled_sources:
    - name: metalang99（interface99.h 的宏引擎，`#include <metalang99.h>` 硬依赖）
      url: "https://github.com/Hirrolot/Metalang99/archive/refs/tags/v1.13.5.tar.gz"
      sha256: "f3d1607d76b4b081d3295661c4c2b8d5fde4d5018b1aa409c84fb3a6660ffb90"
      version_note: "v1.13.5 即上游 CMake FetchContent 锁定的版本"

build:
  system: header-only（包内安装 interface99.h + metalang99.h + metalang99/ 实现头）
  configure_options:
    - "包内同时安装 Metalang99 头（消费者对 <metalang99.h> 的包含由本包 include/ 直接满足，无需第二个包）"
    - "build() 以同口径编译并执行上游 tests/ 全部 8 个程序（上游为独立 CMake 工程、默认构建不包含）"
    - "上游对 GCC/Clang 硬编码 -fsanitize=address；OHOS musl 无 ASan 运行库，执行时剥离（平台差异，PR 描述已归因）"
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
  - "上游 CMake 通过 FetchContent 在 configure 期从 GitHub 拉 Metalang99——conan 配方对这类构建期联网要么改用 FETCHCONTENT_SOURCE_DIR_<NAME> 指向本地、要么跳过其 CMake 直接安装头文件；本配方选择后者（INTERFACE 库无可编译物）"
  - "单头库若 #include 另一个未发包的单头库（Debian 以 -dev 包成对出现的），conan 包必须同时交付两套头，否则消费者无法编译；两个 LICENSE 分别落 licenses/ 并改名区分"
  - "上游测试是独立 CMake 工程 + ASan 硬编码时，可直接以编译器逐程序编译执行（-I 指向源根与依赖根），ASan 剥离按平台差异归因；assert() 型测试天然以退出码为判据"
