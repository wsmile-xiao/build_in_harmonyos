# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: interface99/1.0.2
homepage: "https://github.com/Hirrolot/interface99"

# 上游**有**测试套件但不在默认构建内：tests/ 下 8 个测试程序（basic_tests、
# vcalls、decl_impl、metalang99_compliant、superinterfaces、default_impl、
# version、extern_impl/test），由独立 CMake 工程管理（不挂顶层
# add_subdirectory），且对 GCC/Clang 硬编码 -fsanitize=address。
# 本配方 build() 以同口径（C99、同一组源文件）直接编译并逐一执行全部
# 8 个程序——唯一差异是剥离 ASan（OHOS musl 无 ASan 运行库，平台差异，
# 已在 PR 描述归因）。执行结果打进构建日志，任一失败配方即失败。
upstream_check_command: "由配方 build() 编译执行 tests/ 全部 8 个程序"
upstream_test_in_build: true
upstream_test_command: "（见 conanfile.py _run_upstream_tests）"

upstream_tests:
  - file: tests/basic_tests.c
    description: 基础 interface/impl/DYN/VCALL 行为
  - file: tests/vcalls.c
    description: 虚函数调用语义
  - file: tests/decl_impl.c
    description: 分离声明与实现
  - file: tests/metalang99_compliant.c
    description: Metalang99 兼容性
  - file: tests/superinterfaces.c
    description: 接口继承
  - file: tests/default_impl.c
    description: 默认实现
  - file: tests/version.c
    description: 版本宏契约
  - file: tests/extern_impl/test.c
    description: 跨翻译单元实现

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_interface99.c
    description: >-
      消费者功能测试（5 项断言）：Shape 接口两个实现（Rectangle/Triangle）
      经 DYN 装箱后 VCALL perim 返回 24/60；scale(5) 后分别为 120/300；
      两个动态类型的 vtable 指针互不相同。C99，失败即非零退出。
