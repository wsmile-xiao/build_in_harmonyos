# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS 文件系统下 umask 077 && mktemp -d 创建的临时目录权限不兼容（owner UID 与当前用户不同），需改为 umask 022"
  - "musl libc 的 FILE 结构为 opaque，gnulib fseterr.c 需添加 __OHOS__ 分支使用 portable fallback"
  - "autoconf 检测 CPP 时可能添加 -traditional-cpp 标志导致 sanity check 失败，需手动设置 CPP=clang -E"
  - "旧版 config.guess(2012) 无法识别 HarmonyOS，需替换为 automake-1.17 新版"
  - "gnulib-tests 的 pthread_cancel weak symbol 在 HarmonyOS/musl libc 上未声明，编译失败但不影响核心功能"

