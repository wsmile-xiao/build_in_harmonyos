package: inform6-compiler/6.42
homepage: "https://github.com/DavidKinder/Inform6"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  inform-6.42-r9 发行包不携带 make check 式自动化测试套件，但携带
  punyinform/tests/ 下 55 个 .inf 测试游戏（Makefile punytests 目标：
  编译器+库编译出 .z3 后由 runtests.rb + frotz Z-machine 解释器执行）。
  交叉编译场景下该方式无法在构建机运行（需执行交叉产物 + frotz），
  其编译阶段已在本机宿主以与上游 Makefile 等价编译行逐个实跑 55/55
  通过；上游 Makefile 的演示编译目标（stddemos/stdtutor/punyhowto，
  用编译出的编译器编译演示与教程 .inf → .z5/.z3）同理，故在
  test_package 中以等价口径执行：用打包出的编译器编译上游标准演示
  advent.inf（全库特性）+ 最小库入口 min.inf + PunyInform 入口，
  并对产物做 Z-code 版本字节断言。
test_package_tests:
  - file: test_inform6.sh
    description: >-
      真实消费者测试：执行包内 inform6 编译器编译 3 个游戏源
      （min.inf v5 最小游戏=Story/Headline 常量+parser/verblib/grammar 全库+
      Initialise 例程入口、上游 std-demos/advent.inf v5 全库演示、
      PunyInform globals.h+puny.h 序言 v3），断言编译退出码、产物非空、
      Z-code 首字节版本号（5/5/3），校验 std/lib(19=14+5 别名，大小写
      不敏感文件系统塌缩为 14)/std/include(19)/std/demos(9) 数据清单与
      大小写别名副本在位，并对语法错误源做负向拒绝断言。
    command: "test_inform6.sh <package-folder> <writable-work-root>"
assertion_count: 6
