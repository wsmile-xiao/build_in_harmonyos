knowledge_gained:
  - "Inform 6.42 编译器为纯可移植 C（src/ 20 个翻译单元），平台差异仅 header.h 宏分支，OHOS 走 LINUX 分支无需补丁"
  - "David Griffith r9 一体化包含标准库 6.12.7 + PunyInform 5.14.1 + 演示/教程源；6.42 的编译器 Makefile 目标名为 inform-6.42（无 inform 别名目标），make 必须显式传 CC（CC ?= gcc 已注释）"
  - "6.42 的 Makefile 演示/教程规则（%.z5/%.z3）已用 +目录 语法调用编译器，交叉场景跳过 all 的演示目标，只 make inform-6.42"
  - "6.42 的 Include 指令语义（directs.c 源码注释实证）：Include \">name\" 从当前文件所在目录加载（.inf 扩展名）；无 \">\" 的 Include 走 Include_Path（命令行 +目录 前插累加，.h 扩展名）——最小游戏源必须按此语义书写"
  - "6.12.7 标准库 parser.h 自带默认 Main（[ Main; InformLibrary.play(); ];）不可重定义，游戏入口是 Initialise 例程（advent.inf 同款）；PunyInform 要求 globals.h 先于 puny.h（RTE_* 常量在 globals.h），且 puny.h 自带小写 main 主循环、游戏不得定义 Main"
  - "编译器 Include_Directory 编译期烘焙指向 /usr/local，消费者用命令行 +目录 参数（上游 %.z5/%.z3 规则同款）指向包内 share/inform6/std"
  - "6.42 命令行 +目录 实为替换语义而非文档所述前插：main() 以 set_path_command(p+1) 调用剥掉 '+'，函数靠 command[0]=='+' 判前插 → prepend 分支不可达（源码实证）；A/B 实验证实多 +目录 时最后一个生效，上游 Makefile 规则本身每次编译只传一个 +目录，测试对齐此用法；多目录用 +include_path=a,b 单值逗号分隔（实测编译通过）"
  - "上游 fixlinks.sh 建 English.h 等 5 个大小写别名软链，鸿蒙打包改为文件副本规避 R5；OHOS 真机 /storage 为大小写不敏感文件系统（探针实证），别名副本与原名同文件，copy2 抛 SameFileError 需容错（CI Linux 大小写敏感仍正常产出副本）"
  - "真机 conan 家目录默认无 build profile，conan create 只传 -pr:h 会报 default profile 不存在 → 先 conan profile detect 生成默认 build profile"
  - "真机 git 远端为 ssh URL 而中继 shell PATH 无 ssh → fetch 用显式 https URL + FETCH_HEAD 定点检出（git fetch https://… feat/x && git checkout FETCH_HEAD -- <path>）"
  - "裸 shutil.copy2 不会自建目标目录（conan 的 copy() 会）→ 落盘二进制前先 os.makedirs(bin_dir, exist_ok=True)"
upstream_test_pass_rate: "55/55（编译阶段，本机宿主以与上游 Makefile 等价编译行逐个编译 55 个 punyinform/tests/*.inf 全部通过；运行阶段需 frotz Z-machine 解释器，交叉场景未执行）"
adapted_test_pass_rate: "100%（6/6，2026-09-25 真机 conan create 实测：Package 6b129b068851896169fae42d399fa922d239ce8a created，消费者测试 6 组断言全过，EXIT=0；CI 待 /rebuild 复核）"
test_command: "conan create . --build=missing"
