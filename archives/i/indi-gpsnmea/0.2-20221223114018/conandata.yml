# conandata.yml — indi-gpsnmea 0.2-20221223114018
# 源码 = indilib/indi-3rdparty 仓库 indi-gpsnmea/ 子目录的官方快照。
# 上游未为 indi-gpsnmea 单独打 tag，Debian Astronomy Team 以 orig.tar.gz 形式
# 发布该子目录快照，版本号 0.2+20221223114018（时间戳 = git 提交时刻
# 2022-12-23 11:40:18），是该版本的权威可下载源；conan 版本号把 '+' 规范化为 '-'。

sources:
  # The '+' is written literally rather than percent-encoded as %2B on purpose.
  # CI's pre-download step rewrites every source URL to a file:// path built from
  # the URL's last segment; Conan then percent-decodes that path, so an encoded
  # %2B in the URL would be looked up on disk as a literal '+' while the cached
  # file name keeps the '%2B' -> FileNotFoundError (same note as libfli
  # 2.0-20221221182632). Verified on deb.debian.org: HTTP 200, 48338 bytes.
  url:
    - "https://deb.debian.org/debian/pool/main/i/indi-gpsnmea/indi-gpsnmea_0.2+20221223114018.orig.tar.gz"
  sha256: "7b6fb70c408bf5b0241aecb3527109bae6d4094921ba3fd0677f4c936d06a503"
  # strip_root 由 conanfile.py 的 get(..., strip_root=True) 统一传入，
  # 此处不再声明（否则 get() 会收到重复关键字参数）。

patches:
  - patch_file: "patches/0001-FindINDI.cmake.patch"
    patch_description: "FindINDI.cmake 版本号正则回移上游 master 修复：兼容 INDI 2.x indiversion.h 的 INDI_VERSION \"2.2.2\" 引号形式（否则 FATAL_ERROR failed to detect INDI version）"
    patch_type: "portability"
  - patch_file: "patches/0002-OHOS-indi2.2-gpsapi.patch"
    patch_description: "GPS NMEA 驱动对接 INDI 2.2 框架：① setSystemTime() 在上游非 glibc 的 `#else` 分支（musl 系 libc，含 OHOS）用标准 clock_settime(CLOCK_REALTIME) 替代非标准 stime(3)（musl 无 stime 符号；不引入平台条件编译宏）；② 上游 1.x 快照引用的 INDI::GPS 基类旧成员 LocationN/TimeT 在 INDI 2.x 改名为 LocationNP/TimeTP，逐处更新（8 处），否则编译期 undefined member"
    patch_type: "portability"
  - patch_file: "patches/0003-CMakeLists-cxx17.patch"
    patch_description: "CMakeLists.txt：include(CMakeCommon) 之后把 CMAKE_CXX_STANDARD 抬到 17（上游 CMakeCommon.cmake 钉死 C++14，而 INDI 2.x 基类头 defaultdevice.h 使用 std::any 等 C++17 特性，C++14 编译直接报 no type named 'any' in namespace 'std'）"
    patch_type: "portability"
