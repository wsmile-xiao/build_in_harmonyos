version: "0.2-20221223114018"
software: "indi-gpsnmea"
status: built
build_date: "2026-09-30"
build_system: "cmake"

source:
  # 上游未为 indi-gpsnmea 单独打 tag；Debian Astronomy Team 的 orig 包是
  # indilib/indi-3rdparty indi-gpsnmea/ 子目录的权威可下载快照。
  url: "https://deb.debian.org/debian/pool/main/i/indi-gpsnmea/indi-gpsnmea_0.2+20221223114018.orig.tar.gz"
  sha256: "7b6fb70c408bf5b0241aecb3527109bae6d4094921ba3fd0677f4c936d06a503"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_SYSTEM_NAME=Linux (E092: CMake 无 HarmonyOS 平台映射)"
    - "CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "CMAKE_FIND_PACKAGE_PREFER_CONFIG=OFF (让树内 FindINDI/FindNova 生效)"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 (上游 cmake_minimum_required 3.0，CMake>=4.0 不兼容)"
    - "-I<libnova include root> (FindNova 只报叶子 include/libnova，驱动按 <libnova/*.h> 引用)"
    - "CMAKE_CXX_STANDARD=17 (patch 0003，INDI 2.x defaultdevice.h 用 std::any)"
  dependencies:
    - "libindi/2.2.2.1"
    - "libnova/0.16"
    - "zlib/1.3.1.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-FindINDI.cmake.patch (portability: 版本号正则兼容 INDI 2.x 引号形式)"
  - "patches/0002-OHOS-indi2.2-gpsapi.patch (portability: setSystemTime() 非 glibc 分支改用标准 clock_settime，删去 stime(3)，不引入平台条件编译宏 + INDI 2.x LocationNP/TimeTP 成员改名 8 处)"
  - "patches/0003-CMakeLists-cxx17.patch (portability: CMAKE_CXX_STANDARD 14 -> 17)"

test:
  # 上游 tarball 无任何自动化测试套件（70 个文件中唯一沾 test 的
  # indi-gpsnmea.spec 是 Debian 打包描述，非可执行测试）。
  upstream_test_in_build: false
  upstream_test_command: "none (upstream ships no test suite)"
  upstream_test_count: 0
  upstream_pass: 0
  package_test: "test_gpsnmea: 5 个端到端用例(HC-1 ELF 有效性/HC-2 INDI 框架链接+GPS 逻辑落地/HC-3 NMEA 0183 解析行为(重编译树内 minmea)/HC-4 设备描述 XML/HC-5 鸿蒙特有 aarch64+musl loader)"
  assertions: 54
  pass_rate: 1.0
  result: "conan create (test_package) 真实执行: == 54 checks, 0 failures == / RESULT: PASSED"
