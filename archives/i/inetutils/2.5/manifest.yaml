software: inetutils
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.5"

# 编译状态
# published | built | failed | archived
status: failed

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/builds/inetutils-2.5.tar.xz"

  # 源码校验和（编译失败无产物）
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/data/service/el2/hnd_soft/soft_bus/usr/local"
    - "--host=aarch64-linux-ohos"
    - "CC=clang"
    - "CXX=clang++"
    - "CFLAGS=-fPIC -O2"

  # 编译依赖列表
  dependencies:
    - name: "clang"
      version: "15"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# OHOS 适配信息
# ============================================================

ohos_adaptation:
  # 关键适配点
  key_points:
    - "configure 阶段失败，config.status 报错 'could not setup config files machinery'"
    - "OHOS 平台配置支持不完善，需要深入调试 config.status 脚本"
    - "编译器检测正常，头文件检测正常，问题出在配置文件生成阶段"

  # 失败原因详细说明
  failed_reason: |
    configure 阶段失败，config.status 第 2620 行报错：
    'error: could not setup config files machinery'

    可能原因：
    1. autoconf 生成的脚本对 OHOS 平台支持不完善
    2. 某些模板变量替换失败
    3. config.guess/config.sub 虽已更新但仍需额外配置

  # 建议后续行动
  next_steps:
    - "分析 config.status 脚本第 2620 行附近的失败原因"
    - "可能需要手动修改 configure.ac 或添加 OHOS 特定配置"
    - "inetutils 是网络工具集（telnet, ftp, rsh 等），对平台依赖较高"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（当前无源码补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "GNU 网络工具集（inetutils）对平台依赖较强，OHOS 适配需要更多工作"
  - "config.status 错误 'could not setup config files machinery' 需要深入分析 autoconf 模板"
  - "建议先调查 config.status 脚本失败的具体原因"