software: incron
version: "0.5.12"
status: built
build_date: "2026-05-27"

source:
  url: "https://github.com/ar-/incron/archive/refs/tags/0.5.12.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: makefile
  build_system: makefile
  configure_options: []
  dependencies:
    - argp-standalone
  cc: clang
  cxx: clang++
  rpath: "$ORIGIN/../lib:/usr/local/lib"

patches_applied:
  - 0001-euidaccess-to-eaccess.patch
  - 0002-openharmony-user-fallback.patch
  - 0003-rpath-fix.patch

knowledge_gained:
  - platform_missing_argp_h:
      level: L1
      description: "OpenHarmony 缺少 GNU argp.h,需要安装 argp-standalone 库"
  - platform_eaccess_vs_euidaccess:
      level: L1
      description: "OpenHarmony 使用 eaccess 替代 euidaccess 函数"
  - platform_getpwuid_fallback:
      level: L1
      description: "OpenHarmony getpwuid 可能返回 NULL,需要使用环境变量(USER/LOGNAME)作为 fallback"
  - missing_install_command:
      level: L2
      description: "OpenHarmony 可能缺少 GNU coreutils 的 install 命令,需要手动使用 cp + chmod"
