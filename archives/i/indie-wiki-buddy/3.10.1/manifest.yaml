# 版本级 manifest — indie-wiki-buddy 3.10.1
version: "3.10.1"
software: "indie-wiki-buddy"
status: built
build_date: "2026-10-08"
build_system: none

source:
  url: "https://deb.debian.org/debian/pool/main/i/indie-wiki-buddy/indie-wiki-buddy_3.10.1.orig.tar.gz"
  sha256: "2d648e325760c0ce3277b6efc79b983520b04f854278b111dcd7d6f16df3a515"
  note: >-
    Debian orig tarball（与上游发布一致）：浏览器扩展的静态资源 —— 541 个文件 / 约 4.9 MB，
    含 `_locales/`、`css/`、`data/`、`favicons/`(475)、`images/`(23)、`pages/`(7)、`scripts/`(4)、
    `background.js`(9062 B) 与两份浏览器 manifest 模板。

build:
  system: none
  dependencies: []          # 无任何依赖（无编译、无 npm、无运行期库）
  build_steps:
    - "无编译步骤：纯静态扩展"
    - "build() 仅自检：两份 manifest 模板的 version 与包版本一致 + 7 个内容目录齐备"
  packaging:
    - "按 debian/*.install 与 debian/rules：同一内容装两棵浏览器树"
    - "chromium 树对 manifest-chromium.json（manifest_version=3）；firefox 树对 manifest-firefox.json（manifest_version=2，带 gecko id）"

patches_applied: []

upstream_tests:
  framework: none
  test_sources: 0
  test_command: ""
  run_in_build: false
  evidence: >-
    扩展自身无测试套件（包内无 package.json / Makefile / test 目录；Debian 侧也无 debian/tests）
    —— 上游确无测试，故上游通过率记 **N/A**（如实披露，不虚构）；验证由 test_package 承担
    （两棵树结构 + 两份 manifest 的关键字段 + 资源齐备性断言）。
upstream_test_pass_rate: "N/A（上游无测试套件，如实披露）"
adapted_test_pass_rate: "test_package/check_extension.py **5 项全部通过**（本地 conan create 实测，包创建成功；`checks=5 fails=0 skips=0 RESULT: PASS`）：①两棵浏览器树齐备（chromium + firefox，各含 manifest.json/background.js 与 7 个内容目录）②两份 manifest 均为合法 JSON 且 version=3.10.1，`manifest_version` 分别为 **3**（chromium）/ **2**（firefox）——**装错模板会被抓住** ③firefox manifest 的 gecko id 与包内目录名一致（{cb31ec5d-c49a-4e5a-b240-16c767444f62}）④资源口径达标（favicons/images/data/pages/scripts/css 各不低于下限，两棵树各一份）⑤证据：两棵树各 **538 个文件 / 0.8 MB**（chromium 树、firefox 树）"

knowledge_gained:
  - "**浏览器扩展类包**的适配范式：静态资源按浏览器装多棵树（本例 chromium + firefox），且 `manifest.json` 不是源码里的文件而是**由按浏览器挑选的模板生成**（照抄 debian/rules 的 cp 步骤）——直接原样复制会漏掉 manifest.json 或装错版本（chromium 需 manifest_version=3、firefox 需 2）"
  - "“零依赖”的判定要看三处：Build-Depends（本例仅 debhelper-compat）、Depends（仅 ${misc:Depends}）、以及发布物里有没有 package.json/Makefile 之类的构建声明 —— 三者都空才是真的零依赖"
  - "这类纯数据包的消费者校验应断言**资源口径**（目录存在 + 文件数量下限）与**配置语义**（manifest 的 version/manifest_version/gecko id），而不是只查文件个数"
