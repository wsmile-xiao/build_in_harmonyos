# conandata.yml — indie-wiki-buddy 3.10.1
#
# 上游是**浏览器扩展**（Indie Wiki Buddy：把 Fandom/wiki 的链接导向独立百科），
# 源码取 Debian 的 orig tarball（与上游发布一致）：
#   https://deb.debian.org/debian/pool/main/i/indie-wiki-buddy/indie-wiki-buddy_3.10.1.orig.tar.gz
#
# 依赖：**无**。debian/control 的 Build-Depends 仅 `debhelper-compat (= 13)`（dh 版本声明），
#   Depends 仅 `${misc:Depends}`；扩展本身是纯静态资源（JS/CSS/HTML/图片/多语言），
#   **没有编译步骤、没有运行期库依赖、没有 npm 依赖**（无 package.json）。
#
# 打包要点（照抄 debian/*.install 与 debian/rules）：
#   * 同一份扩展内容要按浏览器装两处：chromium 与 firefox 各自一个目录；
#   * `manifest.json` 由 **按浏览器挑选**的模板生成：
#       cp manifest-chromium.json -> <chromium 目录>/manifest.json
#       cp manifest-firefox.json  -> <firefox 目录>/manifest.json
#     （Debian 的 override_dh_auto_install 正是如此）
#   * firefox 侧目录名使用 Mozilla 的扩展 ID
#       {ec8030f7-c20a-464f-9b0e-13a3a9e97384}/{cb31ec5d-c49a-4e5a-b240-16c767444f62}
#     （来自 debian/*.install，保持与 Debian 一致以便对照）
#
# 上游测试：扩展自身**无测试套件**（无 package.json / Makefile / test 目录）
#   → 上游通过率记 N/A（如实披露）；验证由 test_package 承担（结构 + 两份 manifest 的
#     关键字段 + 资源齐备性）。

