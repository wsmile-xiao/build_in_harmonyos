# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点（R51）：
#   扩展自身**无测试套件** —— 包内无 `package.json`、无 `Makefile`、无 `test/` 目录，
#   Debian 侧亦无 `debian/tests` → 上游通过率记 **N/A**（如实披露，不虚构）。
#   验证由本 test_package 承担（结构 + 两份 manifest 关键字段 + 资源口径）。

package: indie-wiki-buddy/3.10.1
homepage: "https://github.com/KevinPayravi/indie-wiki-buddy"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

release_smoke_tests:
  - file: "res/chromium/extensions/indie-wiki-buddy/manifest.json 与 firefox 树同名文件"
    source: "包产物（由 manifest-chromium.json / manifest-firefox.json 模板按浏览器生成）"
    description: "两份 manifest 均为合法 JSON，version=3.10.1，manifest_version 分别为 3 / 2；firefox 侧 gecko id 与目录名一致"
    command: "python3 check_extension.py <package-folder>"

test_package_tests:
  - file: check_extension.py
    description: "消费者校验 5 项：①两棵浏览器树齐备（各含 manifest.json/background.js + 7 个内容目录）②两份 manifest 合法且 version=3.10.1、manifest_version=3/2（**装错模板会被抓到**）③firefox gecko id 与包内目录名一致 ④资源口径（favicons/images/data/pages/scripts/css 文件数下限，防"空目录装过去"）⑤证据（两棵树文件数与体积）"
    command: "python3 check_extension.py <package-folder>"

assertion_count: 5
