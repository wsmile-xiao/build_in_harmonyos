# 软件级 manifest — indie-wiki-buddy
# 遵循 ARCHIVE-SPEC v3.0

software: indie-wiki-buddy
display: "Indie Wiki Buddy"
description: "浏览器扩展：把 Fandom/wiki 链接导向独立百科（纯静态资源，chromium + firefox 两棵树）"
category: application
homepage: "https://github.com/KevinPayravi/indie-wiki-buddy"
license: MIT
build_system: none

ohos_adaptation:
  key_points:
    - "**零依赖、零编译**：Debian control 的 Build-Depends 仅 debhelper-compat、Depends 仅 ${misc:Depends}；发布物里无 package.json / Makefile → 纯静态资源包"
    - "打包照抄 debian/*.install 与 debian/rules：同一内容装**两棵浏览器树**（chromium、firefox），firefox 树用 Mozilla 扩展 ID 目录"
    - "**manifest.json 不是源码文件**，而是按浏览器挑选模板生成：chromium ← manifest-chromium.json（manifest_version=3）、firefox ← manifest-firefox.json（manifest_version=2、带 gecko id）——直接原样复制会漏文件或装错版本"
    - "上游无测试套件 → 通过率 N/A（如实披露）；验证由消费者校验承担（结构 + manifest 语义 + 资源口径）"
  common_dependencies: []

versions:
  "3.10.1":
    status: built
    build_date: "2026-10-08"
    conan_ref: "indie-wiki-buddy/3.10.1"
