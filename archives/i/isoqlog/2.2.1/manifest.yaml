knowledge_gained:
  - "2000 年代 C 代码把指针经 int 中转存放（`SortDomain.allusers` 声明为 int*、写入 `(int)usr`）在 LP64 上编译零告警、链接零告警，只在表里至少有一条记录时解引用窄化后的地址崩溃：0 条日志跑通、1 条日志 SIGSEGV（rc=139）。定位手段是按数据量二分而不是按功能二分（本机 lldb 因 liblldb.so 缺 PyExc_* 符号不可用）；修法是把容器元素类型改回真实指针类型并同步 sizeof，而不是给编译器加开关（isoqlog 0001 补丁）"
  - "OHOS 设备 profile 的 compiler_executables 指向 /data/service/hnp/bin/clang，但 /data/service/hnp/bin/bash 在本机并不存在：autoconf 经 $CONFIG_SHELL re-exec configure 时报 cannot run ... config.sub（E386 家族，direvent 先例），配方用 `env -u CONFIG_SHELL SHELL=/bin/sh` 路由；据此推论 test_package 也不得默认调用 hnp bash，显式用 /bin/sh"
  - "autoconf 2.53 的 config.status 用 `(umask 077 && mktemp -d -q \"$TMPDIR/csXXXXXX\")` 建临时目录，在 HMDFS 上 077 继承父目录 setgid 表现为大写 S 且目录不可写，config.status 静默产不出 Makefile（E011/E114）：配方内 replace_in_file 一次把 configure 里全部 2 处 `umask 077`（pristine configure:4386 mktemp、:4391 mkdir 回退）改成 002，并把 TMPDIR 钉进构建树（设备 TMPDIR=$HOME，直接跑会把 csoXXXXXX 散件落在家根）"
  - "clang 15 默认 -fno-common 对上\"暂定定义写在头文件里\"的老代码报 ld.lld: duplicate symbol——isoqlog 的 pristine isoqlog/Dir.h:9 一行 `int cur_year, cur_month, cur_day, cur_hour, cur_min, cur_sec;` 被 5 个 TU（Dir.c/Html.c/Store.c/loadconfig.c/main.c）各发一份 .bss 符号；加 -fcommon 恢复合并语义，且必须清掉旧 build 目录，残留 .o 会让症状不变（经验汇总 §12.21/§12.49(f)）"
  - "isoqlog 的 sendmail 解析只把 from= 行的 size= 记入字节账（parseSendmailToLine 以 0 字节调 checkUser），报表里的总量因此是可求和的 from 侧字节数；对 HTML 报表做数字断言时不能把 to= 行的 size= 计入期望值"

patch_generation:
  method: refresh-patch-diff-function
  generator: 'ohc.refresh_patch._diff_files + _validate_patch_format + _dry_run（即 `refresh-patch --auto` 内部同一套差分与校验函数，含 a/ b/ 路径改写与 10 行上下文）；输入 = pristine 树 ~/builds/isoqlog-2.2.1.orig 与打补丁后的树，产物为逐文件补丁'
  cli_note: '`refresh-patch isoqlog 2.2.1 --auto` 走的是编辑追踪器精准模式，work 树在末轮 conan create 后已被重抽为 pristine（`grep -n allusers` 两行皆 int *），追踪器报"无变更记录"并保留现有补丁，故差分由框架函数产出而非该 CLI 重跑'
  generated_at: '2026-09-25T01:01:00'
  patches_count: 2

