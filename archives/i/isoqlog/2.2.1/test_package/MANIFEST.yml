package: isoqlog/2.2.1
homepage: https://packages.ubuntu.com/noble/isoqlog

# 上游无自动化测试：见 archives/i/isoqlog/2.2.1/notes.md 的五维账本
# （SUBDIRS = data isoqlog tr；全树 8 个 Makefile.in 只有 automake 样板 check: 目标、
#   无任何 TESTS= 注册，也无 tests/ 目录 —— 逐文件行号见 notes.md）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: >-
      以真实使用者身份驱动打包件 isoqlog：-h/-v 冒烟、缺失配置与非法 logtype 的负向退出码、
      运行时生成"当天"日期的 sendmail 日志做完整分析，并断言 index.html 与按域报表生成、
      发件人 alice@example.com 进入发件表、收件域 other.org 进入收件表、单条 size= 渲染为
      1024.00 bytes、发件侧字节求和 512+1024 渲染为 1.50 KBytes、非当月日志行被日期闸门忽略
      （修复 SIGSEGV 前实测：当时 10 条断言全部执行、4 过 6 败，首条失败即
      `analysis run failed rc=139`——设备 create-06.log:561 与 :576 `pass=4 fail=6`）。
    command: /bin/sh test.sh <package_folder>/bin/isoqlog <package_folder>

assertion_count: 12
consumer_programs: 1
# 真机 memcap-run.py --probe 实测峰值 RSS = 11MB（12 断言整轮，含 isoqlog 分析子进程与报表生成）；
# 配方 test() 内经 ISOQLOG_MEMCAP 注入的执行器以 --mb 64 硬顶住被测二进制，同轮实测 peak=10MB rc=0
# （日志 ~/tmp/uc2/hw-2/isoqlog-2.2.1/{memcap-probe.log:17,memcap-test.log:74,76}）。
# 预算按 6 倍余量封顶，超限即止损为"该用例失败"而非拖垮 worker（§14.1④）
max_rss_probe_mb: 11
max_rss_mb: 64
