sources:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/i/isoqlog/isoqlog_2.2.1.orig.tar.gz"
  sha256: "4d0bfb35c3820cdf114a0fb2ed75aa56d11b30f60e527dfe88a918eae0c6b810"

patches:
  - patch_file: "patches/0001-isoqlog-Data.h.patch"
    patch_description: "SortDomain.allusers: store user pointers as user **, not int * (declaration side). The 2003 code funnels them through int, which truncates them on LP64 and makes every HTML report with at least one mail user SIGSEGV"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-isoqlog-Data.c.patch"
    patch_description: "isoqlog/Data.c: the 12 narrowing sites that carry user pointers through int, over 13 changed lines -- addUserToSortTab() 4 sites (local var type, malloc, realloc spanning 2 lines, the store statement) plus 1 declaration line in each of the 8 sort*/swap functions; retyped to user pointers, no arithmetic or control flow touched; behaviour on 32-bit hosts unchanged"
    patch_type: "portability"
    strip: 1
