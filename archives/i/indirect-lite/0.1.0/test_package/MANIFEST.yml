# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: indirect-lite/0.1.0
homepage: "https://github.com/nonstd-lite/indirect-lite"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
# INDIRECT_VALUE_LITE_OPT_BUILD_TESTS=ON, build() 中调用 cmake.test()
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
# test/ 目录使用 lest 测试框架, CTest 运行 4 个可执行文件 (cpp11/cpp14/cpp17/cpp20)
# 每个可执行文件包含 54 个 lest 测试用例
upstream_tests:
  - file: test/indirect-value.t.cpp
    source: indirect-lite-0.1.0/test/indirect-value.t.cpp
    description: "indirect_value 核心单元测试 (54 个 lest 用例: 构造/赋值/访问/比较等)"
    command: "ctest -R test-cpp11"
  - file: test/indirect-value-main.t.cpp
    source: indirect-lite-0.1.0/test/indirect-value-main.t.cpp
    description: "测试主函数入口 (lest 框架 main)"
    command: "ctest -R test-cpp11"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_indirect_lite.cpp
    description: "消费者测试: 验证 indirect-lite 库链接、indirect_value 构造/访问/in_place/move/reset/value API"
    command: "./test_indirect_lite"

# 测试断言总数 (近似值)
# test_package 消费者测试 7 个断言
# 上游 4 个 CTest 可执行文件 x 54 lest 用例 = 216 次测试执行
assertion_count: 7