# ============================================================
# 构建配置
# ============================================================

build:
  # tarball 不带 configure，但本配方**不在构建期自举**：configure 及 10 个 autotools 辅助件
  # 由本机（autoconf 2.72 + automake 1.17 + ACLOCAL_PATH 指向含 pkg.m4 的目录）预生成，
  # 随配方放 generated/ 导出、source() 还原进源码树。原因（PR #12629 build 60809 首错）：
  # CI worker 有 hnp autoconf 2.72 但无 aclocal，构建期 autoreconf 必崩
  # `Can't exec "aclocal"` → `aclocal failed with exit status 2`。
  # 形态照已合入的 libxmi/1.2(compat/) 与 afflib/3.7.22(generated/)，非本包自创。
  system: autotools

  # 除 conan AutotoolsToolchain 默认的 --prefix 外不额外传参（R1 参数最少化；
  # 实测本机 config.guess 返回 aarch64-unknown-linux-ohos，无需显式 --build/--host）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libitl/0.8.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 零补丁：AC_PROG_INSTALL 疑点已被 aclocal.m4:439 的 AC_REQUIRE 证伪，
# PACKAGE_NAME 由 autoheader 重写 config.h.in 解决（实测含 #undef PACKAGE_NAME）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
# B判定=create（本 PR 携带 knowledge/drafts/DRAFT-itools-1.1-pkg-check-modules-try-link-late-definition..kv/.md，
# draft-review 质量预检 signature/root_cause/rec 全 ✅、最高相似 E248 仅 0.23 ⇒ 判 create）；
# 另命中既有 E338（getpwuid/pw_dir/homedir 族，ipraytime 的 get_homedir 首选分支即其推荐写法）。
knowledge_gained:
  - "AM_INIT_AUTOMAKE() 自带 AC_REQUIRE([AC_PROG_INSTALL])（实测 aclocal.m4:439）⇒ configure.ac 里注释掉 AC_PROG_INSTALL 不会导致 @INSTALL@ 失配，不要为此打补丁"
  - "configure.ac 用 PKG_CHECK_MODULES 但 aclocal 搜索路径无 pkg.m4 时，autoconf 会把原始宏文本留在生成的 configure 里（实测 configure:4658），执行即 syntax error；且若上游未声明 AC_CONFIG_MACRO_DIR，拷 pkg.m4 进 m4/ 无效，只能注入 ACLOCAL_PATH"
  - "tarball 无 configure 时自举要 -i：-i 不只是补 install-sh/config.guess，GNU 严格度还要求 INSTALL 文件在场（实测 automake --add-missing 补出 ./INSTALL）。但本包最终不在构建期自举——CI worker 无 aclocal，故改为随包导出预生成件（见 build 段注释）"
  - "判 autotools 生成件可用性的硬判据是 sh -n configure 退出 0，不是 ac_fn_c_try_link 的行号先后；含 PKG_CHECK_MODULES 时 autoconf 2.72 会把该函数定义排到首次调用之后（P/Q 单变量复现 1537<4594 vs 1477<1568），于是链接探测静默假失败而 configure 仍退出 0"

