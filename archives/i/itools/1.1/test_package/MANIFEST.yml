# test_package/MANIFEST.yml
package: itools/1.1
homepage: "https://github.com/arabeyes-org/itools"

# Upstream autotools build registers no tests at all: Makefile.am has neither
# TESTS nor check_PROGRAMS, configure.ac has no test macro, and the tarball
# carries no t/ or tests/ directory. Verified by two independent methods
# (see notes.md §5).
upstream_check_command: ""

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: smoke.c
    description: "Consumer behaviour tests: spawn installed ical/idate/ipraytime, assert exit codes, output shape and a G2H/H2G round-trip"
    command: "./itools_smoke"

assertion_count: 12

# §14.1④ 资源纪律：memcap-run.py --probe 在真机实测的峰值 RSS
#   ical 0MB / idate 0MB / ipraytime 4MB（各跑一次）
# ⇒ 消费者测试硬预算取 256MB（余量 >50x），CI 上同一份 test_package 不会拖垮 worker
max_rss_mb: 256
