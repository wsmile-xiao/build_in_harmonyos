software: incus-feature-agent
display: "Incus VM agent"
description: "Incus 虚拟机 agent（在 Incus 管理的虚拟机内运行的 guest 守护进程）"
category: utility
homepage: "https://github.com/lxc/incus"
license: Apache-2.0

build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 组件：CGO_ENABLED=0 + GOOS=linux + GOARCH=arm64 + -tags agent,netgo 静态交叉编译"
    - "自举 Go SDK 后须对全部 ELF（bin/go、gofmt、pkg/tool/*）做 OHOS 自签名，否则无法执行"
    - "E523：-toolexec 包装器把链接器输出重定向到 /dev/shm，规避 HMDFS fallocate()=EACCES"
    - "E318：go test 测试二进制需签名，且须在 go 最终拷贝之后签名"
  common_dependencies: []

versions:
  "7.2.0":
    status: built
    build_date: "2026-10-10"
