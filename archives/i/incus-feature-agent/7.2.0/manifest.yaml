# 版本级 manifest — archives/i/incus-feature-agent/7.2.0/manifest.yaml
version: "7.2.0"
software: "incus-feature-agent"
status: built
build_date: "2026-10-10"
build_system: custom

source:
  url: "https://github.com/lxc/incus/archive/refs/tags/v7.2.0.tar.gz"
  sha256: "03c48d5fbd097c5e4ae16e96efa768a5f147b86adada7a824f15af017b075bf0"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux GOARCH=arm64"
    - "GOTOOLCHAIN=local"
    - "-tags agent,netgo"
  dependencies: []
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "incus-feature-agent = 上游 incus v7.2.0 的 cmd/incus-agent 组件（纯 Go，零 cgo，N=0）"
  - "构建：CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags agent,netgo ./cmd/incus-agent"
  - "Go 工具链：go.mod 要求 go 1.25.10；配方自举官方 Go SDK 1.25.10 并对全部 ELF 自签名（E318）"
  - "E523：Go 链接器对 HMDFS 输出文件 fallocate()=EACCES -> -toolexec 包装器重定向输出到 /dev/shm"
  - "服务端 cgo 包（incusd/db/seccomp 等）在 CGO_ENABLED=0 下不可构建，不在本组件范围"
  - "Go 的 pure resolver 在本环境无法解析 DNS -> 构建用 GOPROXY 环境变量可覆盖（镜像/离线）"
