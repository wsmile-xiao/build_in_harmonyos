# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制）
package: incus-feature-agent/7.2.0
homepage: "https://github.com/lxc/incus"

# 上游测试入口：Makefile unit-test/check 目标 = `go test ./...`
#   incus 的 .github/workflows/tests.yml 亦为 `go test ./...` + `go test -v ./client/...`
# incus-feature-agent 为纯 Go 客户端 agent（CGO_ENABLED=0）；服务端 cgo 包
# （incusd/db/seccomp/... 依赖 liblxc/cowsql/libacl 等）在 OHOS 上不可构建。
# 本库实际执行的为 cmd/incus-agent 依赖闭包内全部含 *_test.go 的纯 Go 包（14 个）。
upstream_check_command: "go test ./... (restricted to cmd/incus-agent pure-Go dependency closure)"

# conanfile.py build() 中已集成上游测试执行（go test -c + OHOS 签名 + 执行）
upstream_test_in_build: true
upstream_test_command: "go test -c -toolexec <e523-wrapper> -o <pkg>.test ./<pkg>/ && sign && ./<pkg>.test -test.v"

# 完整仓库实测（OHOS 适配环境，53 个含测试的包全量尝试，不漏测）：
#   29 个纯 Go 包实际运行；21 个服务端 cgo 包 BUILD_FAIL（CGO_ENABLED=0 限制）；
#   3 个仅含 cgo-gated 测试的包在 CGO_ENABLED=0 下 no test files。
#   失败用例 3 例均为环境限制（见 notes.md「上游测试结果」）。
repo_wide_test_evidence: "notes.md §上游测试结果（53 包全量尝试）"

# 上游实际运行的测试（cmd/incus-agent 闭包内 14 个纯 Go 包）
upstream_tests:
  - file: "shared/api"
    source: "incus-7.2.0/shared/api/*_test.go"
    description: "shared/api：API 结构体/序列化单测"
    command: "go test -v ./shared/api/"
  - file: "shared/osarch"
    source: "incus-7.2.0/shared/osarch/*_test.go"
    description: "shared/osarch：架构名映射单测"
    command: "go test -v ./shared/osarch/"
  - file: "shared/revert"
    source: "incus-7.2.0/shared/revert/*_test.go"
    description: "shared/revert：reverter 栈单测"
    command: "go test -v ./shared/revert/"
  - file: "shared/scriptlet"
    source: "incus-7.2.0/shared/scriptlet/*_test.go"
    description: "shared/scriptlet：Starlark 脚本引擎单测"
    command: "go test -v ./shared/scriptlet/"
  - file: "shared/subprocess"
    source: "incus-7.2.0/shared/subprocess/*_test.go"
    description: "shared/subprocess：子进程管理/信号处理单测"
    command: "go test -v ./shared/subprocess/"
  - file: "shared/tls"
    source: "incus-7.2.0/shared/tls/*_test.go"
    description: "shared/tls：证书/TLS 工具单测"
    command: "go test -v ./shared/tls/"
  - file: "internal/jmap"
    source: "incus-7.2.0/internal/jmap/*_test.go"
    description: "internal/jmap：JSON 映射单测"
    command: "go test -v ./internal/jmap/"
  - file: "internal/util"
    source: "incus-7.2.0/internal/util/*_test.go"
    description: "internal/util：通用工具单测"
    command: "go test -v ./internal/util/"
  - file: "internal/version"
    source: "incus-7.2.0/internal/version/*_test.go"
    description: "internal/version：版本解析单测"
    command: "go test -v ./internal/version/"
  - file: "internal/server/auth"
    source: "incus-7.2.0/internal/server/auth/*_test.go"
    description: "internal/server/auth：认证驱动单测"
    command: "go test -v ./internal/server/auth/"
  - file: "internal/server/device/config"
    source: "incus-7.2.0/internal/server/device/config/*_test.go"
    description: "internal/server/device/config：设备配置单测"
    command: "go test -v ./internal/server/device/config/"
  - file: "internal/server/metrics"
    source: "incus-7.2.0/internal/server/metrics/*_test.go"
    description: "internal/server/metrics：指标标签单测"
    command: "go test -v ./internal/server/metrics/"
  - file: "internal/server/storage/memorypipe"
    source: "incus-7.2.0/internal/server/storage/memorypipe/*_test.go"
    description: "internal/server/storage/memorypipe：内存管道单测"
    command: "go test -v ./internal/server/storage/memorypipe/"
  - file: "internal/server/util"
    source: "incus-7.2.0/internal/server/util/*_test.go"
    description: "internal/server/util：服务端工具单测"
    command: "go test -v ./internal/server/util/"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: conanfile.py
    description: "验证安装的 incus-agent 二进制：--version==7.2、--help 正常、产物为已签名 aarch64 ELF（鸿蒙特有断言）"
    command: "conan test test_package incus-feature-agent/7.2.0"
  - file: test.sh
    description: "安装产物冒烟脚本（--version / --help）"
    command: "bash test.sh <bin_dir>"

# 上游测试断言总数（闭包 14 个包实测顶层用例数，见 notes.md）
assertion_count: 228
