# test_package/MANIFEST.yml — isospec/2.3.2
# 上游官方测试声明文件（docs/TEST_QUALITY_SPEC.md / CI L0e）

package: isospec/2.3.2
homepage: "https://github.com/MatteoLacki/IsoSpec"

# 上游测试命令（tests/C++/Makefile 定义 8 个编译变体 × clang/gcc；
# 上游 CI（.github/workflows/run_tests.yml）只跑 tests/Python 的 pytest）
upstream_check_command: "make -C tests/C++ main_test"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行情况（2026-09-21 OHOS 本机实测，clang 15.0.4，-O3）：
#   tests/C++/main_test.cpp（assert 型单文件测试，含 unity-build.cpp）：
#     快速变体（-DISOSPEC_SKIP_SLOW_TESTS，26 formulas × 11 probs × 4 functions）：
#       1144/1144 通过，rc=0，"Total confs considered: 95838"
#     完整变体（29 formulas × 11 probs × 4 functions）：
#       1276/1276 通过，rc=0，"Total confs considered: 212212034"
#   tests/C/（C wrapper 消费者）：test_IsoThresholdGenerator rc=0、
#     test_IsoOrderedGenerator rc=0；test_arrays.c 为上游失修用例（引用
#     2.3.2 已不存在的 MassSpectrum/set_tablesIsoOrderedGenerator API 且
#     第 30 行缺分号），NOT_RUN。
#   tests/Python/（pytest，上游 CI 唯一口径，注册 301 用例）：NOT_RUN —
#     cffi 绑定层 libIsoSpecCppPy.so 在设备 dlopen 被拒（Permission denied，
#     修复 16K LOAD 对齐与 libc++_shared 依赖后仍拒），import 链失败。
# 日志: archives/i/isospec/2.3.2/reports/（逐字 .md）
upstream_tests:
  - file: tests/C++/main_test.cpp
    source: IsoSpec-2.3.2/tests/C++/main_test.cpp
    description: "assert 型主测试：formulas × probs × {test_threshold_simple, test_threshold, test_layered_tabulator, test_ordered}，完整版 1276 次执行 + test_zero/test_empty 2 项，全部通过"
    command: "clang++ -std=c++17 -O3 main_test.cpp && ./main_test_full"
  - file: tests/C/test_IsoThresholdGenerator.c
    source: IsoSpec-2.3.2/tests/C/test_IsoThresholdGenerator.c
    description: "C wrapper：IsoThresholdGenerator 逐配置遍历（rc=0）"
    command: "clang++ -std=c++17 -x c++ test_IsoThresholdGenerator.c && ./test_IsoThresholdGenerator"
  - file: tests/C/test_IsoOrderedGenerator.c
    source: IsoSpec-2.3.2/tests/C/test_IsoOrderedGenerator.c
    description: "C wrapper：IsoOrderedGenerator 逐配置遍历（rc=0）"
    command: "clang++ -std=c++17 -x c++ test_IsoOrderedGenerator.c && ./test_IsoOrderedGenerator"
  - file: tests/C/test_arrays.c
    source: IsoSpec-2.3.2/tests/C/test_arrays.c
    description: "(NOT_RUN) 上游失修：引用 2.3.2 已删除的 MassSpectrum/set_tablesIsoOrderedGenerator 符号且缺分号，任何平台均无法编译"
    command: "clang++ -std=c++17 -x c++ test_arrays.c"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_isospec.cpp
    description: "消费者测试: IsoThresholdGenerator 阈值流式遍历 + FixedEnvelope::FromTotalProb 覆盖率/质量断言（4 项 CHECK）"
    command: "./test_isospec"
  - file: test_ohos.cpp
    description: "鸿蒙特有测试: OHOS 动态加载器已映射包内 libIsoSpec++ 且导出 C 符号（dlsym RTLD_DEFAULT）+ cwrapper C API 阈值遍历回环 + uname HarmonyOS/aarch64/LP64 断言（8 项 CHECK）"
    command: "./test_isospec_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11
