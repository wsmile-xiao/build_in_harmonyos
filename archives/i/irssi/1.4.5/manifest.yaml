software: irssi
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.4.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/irssi/irssi/releases/download/1.4.5/irssi-1.4.5.tar.gz"

  # 源码校验和
  sha256: "31653e8e0c5b1ef9b89905c330a0d77fe3f0592f88d163e504c1923dcd28ac47"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-perl=no"
    - "--without-socks"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.88.0
    - openssl/3.5.6
    - ncurses/6.5
    - utf8proc/2.11.3.1
    - pcre2/10.45

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub HarmonyOS识别，使用patch-autotools-ohos.pl一键补丁"
  - "Perl模块编译在HarmonyOS上失败(pm_to_blib错误)，使用--with-perl=no禁用"
  - "ncurses静态库需设置CFLAGS/LDFLAGS/LIBS才能被configure检测到"
  - "test-796失败因getpwuid_r()不支持非系统UID(E051平台限制)"

