# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: irssi/1.4.5
homepage: "https://irssi.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# irssi 1.4.5 上游无标准测试套件 (无 tests/ 目录, 无 ctest/pytest 注册)
# 上游测试以 manual testing guide 为主, 无自动化测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 irssi --version 验证可执行文件可用"
    command: "irssi --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
