software: indelible
display: "indelible"
description: "Flexible simulator of biological sequence evolution with indels"
category: utility
homepage: "https://github.com/evolbioinfo/indelible"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools build with OHOS --build/--host set to aarch64-unknown-linux-gnu."
    - "Single-binary application installed to bin/indelible; no shared libraries."
    - "Upstream ships no test suite; consumer test runs the real binary twice (100bp + 50bp minimal control.txt simulations)."
  common_dependencies: []

versions:
  "1.03":
    status: built
    build_date: "2026-09-27"
