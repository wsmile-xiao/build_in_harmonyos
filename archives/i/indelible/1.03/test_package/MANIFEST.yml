# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: indelible/1.03
homepage: "https://github.com/evolbioinfo/indelible"

# 上游测试套件存在性（经审计官方源码 tarball 确认：无自动化测试框架）
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

# 上游测试审计（源码: INDELibleV1.03.tar.gz，
# sha256 6b74cbe0d3ce202e99d04282a87b564449ab935c66480f20665f1fb4102721a6）
upstream_test_audit:
  source_tarball: "kloetzl/indelible@2dbfd2c (https://github.com/kloetzl/indelible/archive/2dbfd2cf835f58817160a8ed4290b6897a03b1c3.tar.gz); fallback INDELibleV1.03.tar.gz (http://abacus.gene.ucl.ac.uk/software/indelible/EFBKqHdv0v7qir6CyeHgqaz/INDELibleV1.03.tar.gz)"
  source_sha256: "d08e572bd636ef04c6d4a526f0faa01c0c00ce90baecabd7e9128640974d78a2 (primary); 6b74cbe0d3ce202e99d04282a87b564449ab935c66480f20665f1fb4102721a6 (official fallback)"
  build_system: "autotools（顶层 configure.ac + Makefile.am + src/，C++ 约 10000 行）"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / include(CTest) / add_test (ctest)"
    - "check_PROGRAMS / TESTS (automake make check)"
    - "tests/ / test/ 目录"
    - "meson test wiring"
  scan_result: "官方 tarball 与 kloetzl 提交锁定包（58 文件）均无 tests/ 或 test/ 目录；无 gtest/pytest/ctest 注册；顶层 Makefile.am 仅定义构建与安装目标，无 check/TESTS 接线；src/ 仅为仿真器实现（indelible.cpp 等），无断言套件"
  manual_programs_only:
    - "control.txt — 上游运行示例输入（[TYPE]/[MODEL]/[TREE]/[PARTITIONS]/[EVOLVE] 仿真描述），非自动化断言套件；无 control.txt 时二进制会自动生成示例文件（man 页明确记载），属功能行为而非测试框架"
    - "help/ — 手册与教程（manual/tutorial），非可执行测试"
    - "debian/tests/*（Debian 打包层 autopkgtest：run-unit-test + 12 组 control.txt 数据）— 打包冒烟，非上游 tarball 内套件，不构成可接入的上游测试入口"
  reason: "indelible 1.03 上游发布包不含任何自动化测试套件"

# 上游测试命令（无自动化套件，故不适用）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（upstream_tests_exist: false，见上方审计）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，真实执行包内二进制）
test_package_tests:
  - file: test_indelible.py
    description: "消费者功能测试 2 项：用例 1 最小 control.txt（NUCLEOTIDE/JC/2 taxa/100bp/1 replicate）仿真产出 outputname.fas 与 outputname_TRUE.phy 且均非空含 FASTA 头；用例 2 同模型 50bp/独立输出桩 output2 同等断言。空目录不作断言：真机证实缺 control.txt 时二进制交互提示 10 次后退出并不生成示例文件"
    command: "python3 test_indelible.py <package>/bin/indelible"

harmonyos_specific_tests: []

# 测试断言总数（2 项功能验证，每项多断言；总数按用例计为 2）
assertion_count: 2
