sources:
  # 主源：Debian 维护者 kloetzl 的 1.03 等效 autotools 树（提交号锁定，
  # 含与官方 tarball 同版的 configure.ac AC_INIT 1.03 + Makefile.am + src/，
  # 经实测 58 个文件、无 tests/ 目录，构建体系与配方一致）。
  # 选用理由：官方 abacus 站点在本机与真机均确认不可达
  # （https 报 SSL Hostname mismatch，http 报 403 Forbidden，
  # 本机 urllib 已复现完全相同的双失败）；
  # 全网核查无同字节（同 sha256）镜像
  # （web.archive.org 仅 404 快照、Debian/Ubuntu orig.tar.xz 系重打包
  # sha 60ed2a8f…不同，不可混作同 sha fallback）。
  # github.com 域名可享 CI 通用镜像改写（gh-proxy）与真机网络可达性，
  # 已验证 codeload 200 + sha256 可复现。
  # 官方原始归档保留为最后回退（同归档同 sha256，不改校验值）。
  - url: "https://github.com/kloetzl/indelible/archive/2dbfd2cf835f58817160a8ed4290b6897a03b1c3.tar.gz"
    sha256: "d08e572bd636ef04c6d4a526f0faa01c0c00ce90baecabd7e9128640974d78a2"
  - url:
      - "https://abacus.gene.ucl.ac.uk/software/indelible/EFBKqHdv0v7qir6CyeHgqaz/INDELibleV1.03.tar.gz"
      - "http://abacus.gene.ucl.ac.uk/software/indelible/EFBKqHdv0v7qir6CyeHgqaz/INDELibleV1.03.tar.gz"
    sha256: "6b74cbe0d3ce202e99d04282a87b564449ab935c66480f20665f1fb4102721a6"
patches: []
