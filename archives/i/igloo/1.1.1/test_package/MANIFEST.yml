# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: igloo/1.1.1
homepage: "https://igloo-testing.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake --build . --target igloo-tests snowhouse-tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（igloo 官方自测：tests/ 与 igloo/external/snowhouse/spec/）
upstream_tests:
  - file: tests/igloo_tests.cpp
    source: igloo-1.1.1/tests/igloo_tests.cpp
    description: "igloo 核心断言与 Context/Spec 框架自测"
    command: "./igloo-tests"
  - file: igloo/external/snowhouse/spec/assertmacro_tests.cpp
    source: igloo-1.1.1/igloo/external/snowhouse/spec/assertmacro_tests.cpp
    description: "snowhouse 断言宏测试（内嵌于 igloo 源码）"
    command: "./snowhouse-tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：仅通过 igloo/igloo.h 公开头文件使用 Describe/It/Assert 宏运行两条断言"
    command: "./test_igloo"

# 测试断言总数 (近似值)
assertion_count: 2