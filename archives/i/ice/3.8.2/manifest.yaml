# 版本级 manifest — ice 3.8.2
# 文件位置: archives/i/ice/3.8.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "3.8.2"

# 软件名
software: ice

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-10"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/zeroc-ice/ice/archive/refs/tags/v3.8.2.tar.gz"

  # 源码校验和
  sha256: "d350ebbcdd7971fafccebfdf1e99db139dc6d121f5a5dcdc4036256206735078"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
  - "os=Linux"
  - "CONFIGS=shared"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - bzip2/1.0.8
  - expat/2.8.2.1
  - libiconv/1.17
  - lmdb/0.9.35
  - mcpp/2.7.2
  - openssl/3.5.6.1
  - readline/8.3

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-fix-datastorm-sessioni-structured-binding.patch"
- "0002-fix-glacier2-crypt-ohos.patch"
- "0003-slice-ice-files.patch"
- "0004-add-editline-readline-shim.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS clang 定义 __linux__ 但无 __GLIBC__（musl libc），crypt_r 不可用需用 crypt()"
- "clang15 拒绝 structured-binding capture（C++17 lambda 捕获分解声明），需显式引用捕获"
- "slice2cpp 把 #include 'Metrics.ice' 解析到 slice/ 根路径，缺失的 .ice 需在 slice/ 下提供"
- "IceGrid/IceStorm Parser 依赖 libedit API（editline/readline.h + -ledit），OHOS 无 libedit，需 readline+shim"
- "GNU readline 静态库依赖 termcap(tget*)，需合并 libncursesw 到 libedit.a 或链接 ncurses"
- "OHOS 无 GNU install 命令，conan recipe 需手工 copy 打包产物"
