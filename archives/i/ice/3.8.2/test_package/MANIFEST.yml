# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 实测结论（2026-08-14 OHOS aarch64 真机执行，证据见 notes.md "上游测试实际运行记录"）：
#   1) 上游单进程单元测试在 OHOS 真实运行并全部通过：
#      - IceUtil 5/5：sha1、stacktrace、timer、unicode、uuid（exit 0，均输出 ok）
#      - Slice 5/5：deprecated、escape、macros、print、structure（exit 0）
#      （ctrlCHandler 上游 test.py 即标注 "only ran manually"，不入 CI，属上游设计）
#   2) 上游编译/翻译器错误检测测试 Slice/errorDetection 40/54 通过，14 个用例因
#      OHOS slice2cpp 错误检测行为差异失败（失败清单与逐行 diff 见 notes.md）。
#   3) 集成测试无需 Python TestFramework 也能端到端运行：
#      Ice/admin、enums、objects、exceptions 手工启动 server+client 全部通过；
#      adapterDeactivation 为上游长时测试（45s 超时）；operations 在 slice2cpp
#      阶段即失败（Test.ice:272 "struct 'MyStruct1' must have at least one member"，
#      Test.ice 与上游 v3.8.2 原始文件逐字节一致，属上游用例与 OHOS slice2cpp 的
#      真实不兼容，非本适配引入）。
#   4) 其余 40 个集成套件由 Python TestFramework（allTests.py）驱动，硬依赖
#      Ice Python 绑定（import Ice，OHOS 无该模块），本适配不改变该约束。

package: ice/3.8.2
homepage: "https://zeroc.com"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make os=Linux CONFIGS=shared test/IceUtil/sha1 test/Slice/deprecated"

# conanfile.py build() 方法中是否已集成上游测试
# 本配方 build() 通过 `make os=Linux srcs` 完成全部编译（含测试所依赖的 libIce/libTestCommon），
# 上游测试在 OHOS aarch64 真机实际执行（证据见 notes.md "上游测试实际运行记录"），
# 真实通过率见下方 upstream_tests。控制台命令可复现：
upstream_test_in_build: false
upstream_test_command: "make os=Linux CONFIGS=shared test/IceUtil/sha1 test/IceUtil/stacktrace test/IceUtil/timer test/IceUtil/unicode test/IceUtil/uuid test/Slice/deprecated test/Slice/escape test/Slice/macros test/Slice/print test/Slice/structure"

# 上游实际运行的测试程序（OHOS 真机实测，含真实结果）
upstream_tests:
  - file: cpp/test/IceUtil/sha1/Client.cpp
    source: ice-3.8.2/cpp/test/IceUtil/sha1/Client.cpp
    description: "IceUtil SHA-1 hash computation — OHOS 实测 PASS"
    command: "LD_LIBRARY_PATH=lib64 ./test/IceUtil/sha1/build/aarch64/shared/client"
  - file: cpp/test/IceUtil/stacktrace/Client.cpp
    source: ice-3.8.2/cpp/test/IceUtil/stacktrace/Client.cpp
    description: "stacktrace backtrace — OHOS 实测 PASS"
    command: "LD_LIBRARY_PATH=lib64 ./test/IceUtil/stacktrace/build/aarch64/shared/client"
  - file: cpp/test/IceUtil/timer/Client.cpp
    source: ice-3.8.2/cpp/test/IceUtil/timer/Client.cpp
    description: "timer create/destroy — OHOS 实测 PASS"
    command: "LD_LIBRARY_PATH=lib64 ./test/IceUtil/timer/build/aarch64/shared/client"
  - file: cpp/test/IceUtil/unicode/Client.cpp
    source: ice-3.8.2/cpp/test/IceUtil/unicode/Client.cpp
    description: "UTF-8 <-> wstring conversion (utf16/utf32) — OHOS 实测 PASS"
    command: "LD_LIBRARY_PATH=lib64 ./test/IceUtil/unicode/build/aarch64/shared/client ."
  - file: cpp/test/IceUtil/uuid/Client.cpp
    source: ice-3.8.2/cpp/test/IceUtil/uuid/Client.cpp
    description: "threaded UUID generation (300000x3) — OHOS 实测 PASS"
    command: "LD_LIBRARY_PATH=lib64 ./test/IceUtil/uuid/build/aarch64/shared/client"
  - file: cpp/test/Slice/deprecated/Client.cpp
    source: ice-3.8.2/cpp/test/Slice/deprecated/Client.cpp
    description: "Slice deprecated definitions — OHOS 实测 PASS"
    command: "LD_LIBRARY_PATH=lib64 ./test/Slice/deprecated/build/aarch64/shared/client"
  - file: cpp/test/Slice/escape/Client.cpp
    source: ice-3.8.2/cpp/test/Slice/escape/Client.cpp
    description: "Slice operation name escape — OHOS 实测 PASS"
    command: "LD_LIBRARY_PATH=lib64 ./test/Slice/escape/build/aarch64/shared/client"
  - file: cpp/test/Slice/macros/Client.cpp
    source: ice-3.8.2/cpp/test/Slice/macros/Client.cpp
    description: "Slice predefined macros — OHOS 实测 PASS"
    command: "LD_LIBRARY_PATH=lib64 ./test/Slice/macros/build/aarch64/shared/client"
  - file: cpp/test/Slice/print/Client.cpp
    source: ice-3.8.2/cpp/test/Slice/print/Client.cpp
    description: "Slice custom print / proxy / remapped identifier — OHOS 实测 PASS"
    command: "LD_LIBRARY_PATH=lib64 ./test/Slice/print/build/aarch64/shared/client"
  - file: cpp/test/Slice/structure/Client.cpp
    source: ice-3.8.2/cpp/test/Slice/structure/Client.cpp
    description: "Slice structure equals() — OHOS 实测 PASS"
    command: "LD_LIBRARY_PATH=lib64 ./test/Slice/structure/build/aarch64/shared/client"
  - file: cpp/test/Ice/admin/Client.cpp
    source: ice-3.8.2/cpp/test/Ice/admin/Client.cpp
    description: "Ice admin facet (communicator/process/properties/logger/custom) — OHOS 端到端 PASS"
    command: "server+client 手工启动（config.test: Test.BasePort=12010, Ice.Default.Host=127.0.0.1）"
  - file: cpp/test/Ice/enums/Client.cpp
    source: ice-3.8.2/cpp/test/Ice/enums/Client.cpp
    description: "Ice enum exceptions — OHOS 端到端 PASS"
    command: "server+client 手工启动"
  - file: cpp/test/Ice/objects/Client.cpp
    source: ice-3.8.2/cpp/test/Ice/objects/Client.cpp
    description: "Ice class cycles / objects — OHOS 端到端 PASS"
    command: "server+client 手工启动"
  - file: cpp/test/Ice/exceptions/Client.cpp
    source: ice-3.8.2/cpp/test/Ice/exceptions/Client.cpp
    description: "Ice exception dispatch — OHOS 端到端 PASS"
    command: "server+client 手工启动"
  - file: cpp/test/Ice/operations/Client.cpp
    source: ice-3.8.2/cpp/test/Ice/operations/Client.cpp
    description: "Ice RPC operations round-trip — 编译失败（slice2cpp Test.ice:272 与上游逐字节一致），见 notes.md 证据"
    command: "make test/Ice/operations（slice2cpp 阶段失败）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：链接 libIce，初始化 Communicator，属性读写 round-trip，校验 ICE_STRING_VERSION=3.8.2 / ICE_INT_VERSION=30802"
    command: "./test_ice"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
