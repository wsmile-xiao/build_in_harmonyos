# 软件级 manifest — ice (ZeroC Ice RPC framework)
# 遵循 ARCHIVE-SPEC v2.0

software: ice
display: "ZeroC Ice RPC Framework"
description: "ZeroC Ice is a comprehensive RPC framework with support for C++, Java, Python, Ruby, PHP and more"
category: network
homepage: "https://zeroc.com"
license: GPL-2.0

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "make 需显式传 os=Linux（OHOS clang 定义 __linux__ 但无 __GLIBC__）"
    - "无 crypt_r，Glacier2 认证需用 __OHOS__ 分支调 crypt()"
    - "clang15 拒绝 structured-binding capture，需改显式引用捕获"
    - "slice2cpp 解析 #include 需 slice/ 根路径符号链接（Metrics.ice 等）"
    - "IceGrid/IceStorm Parser include editline/readline.h，需 libedit 兼容 shim"
    - "链接 -ledit 需映射到 readline/ncurses（OHOS 无系统 libedit）"
  common_dependencies:
    - bzip2
    - expat
    - libiconv
    - lmdb
    - mcpp
    - openssl
    - readline

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.8.2":
    status: built
    build_date: "2026-08-10"
