# test_ohos/MANIFEST.yml — HarmonyOS PC 专项验证
package: irsim/9.7.104
homepage: https://github.com/RTimothyEdwards/irsim

# OpenHarmony PC 平台专项测试（独立于 test_package 的 CLI 消费者验证）
# 运行: conan test archives/i/irsim/9.7.104/test_ohos irsim/9.7.104 \
#       -pr:h ohos-aarch64 -pr:b ohos-aarch64
test_ohos_tests:
  - file: test_ohos.sh
    description: |
      鸿蒙交付验证 (bash + set -euo pipefail, 独立临时目录经
      trap EXIT/INT/TERM 清理, 失败/超时/中断均不残留、不写包目录):
      H1 ELF64 Little-Endian AArch64 (bin/irsim、bin/gentbl、bin/genspktbl
      逐个 readelf 验证, readelf 失败时该检查 fail closed);
      H2 .codesign 段存在 (三产物, 鸿蒙签名要求);
      H3 二进制无宿主路径 (strings 扫描 /home/ /tmp/ storage/Users/);
      H4 CLI 在 OpenHarmony PC 真实加载打包的 .prm 参数库与网络文件
      并执行仿真命令 (d/exit), 验证网络加载输出 "4 nodes" 与进程退出码 0
      (独立 netlist 与命令文件写入私有临时目录, 不依赖包目录可写);
      H5 打包数据完整性: 安装树内 .prm 参数库文件存在且非空
      (lib/irsim/prm/ 下至少 1 个工艺参数文件)
    command: "conan test archives/i/irsim/9.7.104/test_ohos irsim/9.7.104 -pr:h ohos-aarch64 -pr:b ohos-aarch64"
    count: 12

assertion_count: 12
