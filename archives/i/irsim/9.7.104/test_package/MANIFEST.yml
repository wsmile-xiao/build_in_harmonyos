# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: irsim/9.7.104
homepage: "https://github.com/RTimothyEdwards/irsim"

# 上游无 make check / ctest / GTest 测试入口（9.7.104 官方 tag 源码）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证 CLI 二进制)
test_package_tests:
  - file: test.c
    source: test_package/test.c
    description: "验证打包的 irsim CLI 二进制存在并可执行（application 包消费者冒烟）"
    command: "irsim (usage banner)"
