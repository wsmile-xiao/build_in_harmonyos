# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: inipp/1.0.13
homepage: "https://github.com/mcmtroffaes/inipp"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-tests"

upstream_tests:
  - name: unittest/（unittest 二进制内含 17 个 TEST_METHOD + headertest 编译测试——18 用例，test*.ini 样本 CMake 自动拷贝到 build 目录）
    count: "18"
    description: "上游测试实测（rule 4，分母=全部 18 用例）：18 passed / 0 failed / 0 skipped（100%）——unittest/headertest 两个 ctest 用例实际执行 17 个 TEST_METHOD + 1 个编译测试，全部通过（实测 exit=0）；CMake 自动拷贝 ini 样本到 build 目录"

test_package_tests:
  - file: test_inipp.py
    description: "R34：头文件存在 + 编译运行使用 inipp 的 smoke（inipp::Ini 解析 INI 字符串）"
    command: "python3 test_inipp.py <package>"

assertion_count: 2
