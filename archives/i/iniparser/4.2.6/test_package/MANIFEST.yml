# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: iniparser/4.2.6
homepage: "https://github.com/ndevilla/iniparser"

# 上游测试命令（Unity 框架，需要 ruby 生成 runner + FetchContent 拉取 unity）
upstream_check_command: "ctest（BUILD_TESTING=ON 时 test_iniparser + test_dictionary）"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成原因：上游 test/CMakeLists.txt 硬性依赖 1) ruby（generate_test_runner.rb 生成
# 测试 runner）；2) FetchContent 从 github.com clone Unity 框架——CI 远端 clean 环境
# 无 ruby，网络 clone 也不可控。上游测试已在适配阶段于本机全量执行并记录
#（见 notes.md：30/30 通过），test_package 内以等价 API 断言补全。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_iniparser.c
    source: iniparser-4.2.6/test/test_iniparser.c
    description: "上游 Unity 测试套件主测试（23 个用例，含 316 断言，覆盖 load/getstring/getint/getboolean/set/unset/find_entry/misformed/quotes 等）"
    command: "./test_iniparser"
  - file: test/test_dictionary.c
    source: iniparser-4.2.6/test/test_dictionary.c
    description: "上游 Unity 字典底层测试（7 个用例，含 34 断言，覆盖 dictionary_new/set/get/unset/grow/hash/dump）"
    command: "./test_dictionary"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_iniparser.c
    description: "消费者 API 往返测试：写 INI → iniparser_load → getstring/getint/getboolean 验证 → iniparser_set 修改/新建键 → getnsec/getsecname/getsecnkeys 遍历 → freedict 后重复使用"
    command: "./test_iniparser"

# 测试断言总数 (近似值, 用于质量评估)
# test_package: 18 个 CHECK 断言；上游: test_iniparser 316 + test_dictionary 34 = 350 断言
assertion_count: 18
