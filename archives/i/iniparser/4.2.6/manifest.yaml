software: iniparser
build_system: cmake
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.2.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.2.6"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ndevilla/iniparser/archive/refs/tags/v4.2.6.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "iniparser 使用 cmake 构建系统，默认同时编译 shared 和 static 库"
  - "cmake 显示 'System is unknown' 警告但不阻塞编译，无需设置 CMAKE_SYSTEM_NAME"
  - "BUILD_TESTING=ON 需单独指定，默认关闭；启用后自动下载 Unity 测试框架（git clone）"
  - "dictionary_dump 测试在 HarmonyOS 上失败（返回 NULL 而非字符串），核心 INI 解析功能不受影响"
  - "SSL 证书验证失败时需手动 curl -fsSLk 下载源码包"
  - "manifest.yaml 需要顶级 build_system 字段（非 build.system 嵌套），否则 G4 档案完整性检查失败"
