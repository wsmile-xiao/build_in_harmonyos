software: iniparser
version: "4.2.6"
status: built
build_date: "2026-09-05"
build_system: cmake
target_platform: aarch64-unknown-linux-ohos

source:
  url: "https://github.com/ndevilla/iniparser/archive/refs/tags/v4.2.6.tar.gz"
  sha256: "a0bd370713a744b1fa8ec27bba889ebf9dbd43060ec92e07fbe91fb43e3cb3ac"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_DOCS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "iniparser 4.2.6 纯 C 零依赖库，CMake 构建系统默认 shared+static 同编，Conan 单选项模型下用 BUILD_SHARED_LIBS 控制"
  - "上游源码包内含悬空符号链接 compile_commands.json -> build/compile_commands.json，HarmonyOS 上 tar 解压/HMDFS 硬链接复制会失败，需清理后使用"
  - "上游 Unity 测试套件（BUILD_TESTING=ON）依赖 ruby 生成 runner + FetchContent 从 github clone unity，CI clean 环境不可行；本机执行结果 30/30 用例全过（test_iniparser 23 + test_dictionary 7）"
  - "test_dictionary 的 dictionary_dump 用例失败根因是 OHOS libc tmpfile() 尝试 /data/local/tmp 返回 EACCES（知识条目 E272），不是库本身缺陷；用 tmpfile-shim LD_PRELOAD（mkstemp 到 TMPDIR）后 7/7 全过"
  - "cmake 'System is unknown to cmake' 警告不阻塞配置与编译，无需处理"

verification:
  local:
    - "ctest（上游套件，tmpfile-shim 注入后）: 2/2 tests passed"
  ohos:
    status: built
    command: "conan create archives/i/iniparser/4.2.6 -pr:h ci/conan/profiles/ohos-aarch64 -pr:b ci/conan/profiles/ohos-aarch64"
