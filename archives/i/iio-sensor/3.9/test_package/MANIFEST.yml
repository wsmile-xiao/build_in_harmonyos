# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: iio-sensor/3.9
homepage: "https://gitlab.freedesktop.org/hadess/iio-sensor-proxy"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test -C build-ohos"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "meson test -C build-ohos (Python 集成测试需 dbusmock/gi + D-Bus system bus，本环境不可用；C 单元测试已实际运行通过)"

# 上游实际运行的测试程序
upstream_tests:
  - name: "test-orientation"
    source: iio-sensor-proxy-3.9/src/test-orientation.c
    description: "orientation / quirking / threshold 单元测试"
    command: "./build-ohos/src/test-orientation"
    result: "3/3 PASS (ok 1 /iio-sensor-proxy/orientation, ok 2 /iio-sensor-proxy/quirking, ok 3 /iio-sensor-proxy/threshold), exit 0, 2026-09-21"
  - name: "test-mount-matrix"
    source: iio-sensor-proxy-3.9/src/test-mount-matrix.c
    description: "mount matrix 解析与小数分隔符单元测试"
    command: "./build-ohos/src/test-mount-matrix"
    result: "2/2 (ok 1 /iio-sensor-proxy/mount-matrix, ok 2 /iio-sensor-proxy/comma-decimal-separator SKIP 本地无 fr_FR.UTF-8), exit 0, 2026-09-21"
  - name: "integration-test.py"
    source: iio-sensor-proxy-3.9/tests/integration-test.py
    description: "D-Bus 集成测试 (dbusmock/gi/psutil)，需 D-Bus system bus"
    command: "meson test -C build-ohos (tests option)"
    result: "not run: 环境无 dbusmock/gi Python 模块且无 dbus-daemon（Headless OHOS PC），记录为环境限制，非代码缺陷"
    classification: environment_limit

test_package_tests:
  - file: test.c
    description: "编译期目标：stat() Conan 打包的 iio-sensor-proxy（libexec）与 monitor-sensor（bin）绝对路径（R34，无 host PATH 查找）。CI 为 x86 交叉编译 aarch64，不可执行，仅编译验证"
    command: "cmake --build (compile-only); no add_test/ctest"
  - file: test_iio_sensor.sh
    description: "host 侧 bash 脚本（conanfile.py test() 通过 self.run 执行）：验证 iio-sensor-proxy / monitor-sensor 存在且为 ELF aarch64 二进制（L0d 门禁 + R34，交叉编译安全）"
    command: "bash test_iio_sensor.sh <packaged-bin-paths>"
  - file: conanfile.py
    description: "跳过 cmake.test()（交叉编译不能在 x86 worker 上执行 aarch64）；test() 用 self.run 运行 test_iio_sensor.sh 验证打包二进制"
    command: "self.run(f'{bash} {script} ...')"

assertion_count: 6
