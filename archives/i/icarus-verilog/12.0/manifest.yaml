software: icarus-verilog
version: "12.0"
status: built
build_date: "2026-06-01"

source:
  url: "https://github.com/steveicarus/iverilog/archive/refs/tags/v12_0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build_system: autotools

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies:
    - gperf/3.1
    - autoconf/2.72
  cc: clang
  cxx: clang++
  # icarus-verilog GitHub tarball 不含 configure，需先运行 autoconf.sh bootstrap
  configure_pre_cmd: "sh autoconf.sh"

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

knowledge_gained:
  - "GitHub tag tarball 不含 configure，需 autoconf.sh bootstrap（autoconf + gperf）"
  - "R6: 所有 flex/bison/gperf/configure 生成文件不应 patch，只保留 config.guess/sub 源文件 patch"

patch_generation:
  method: manual
  generated_at: '2026-06-03'
  patches_count: 2
  notes: "Only source-file patches retained per R6. Build-generated files (flex/bison/gperf/configure/stamp) are regenerated by autoconf.sh + make, not patched."