software: icarus-verilog
display: "Icarus Verilog"
description: "Verilog compiler and simulator (iverilog + vvp)"
category: development
homepage: "https://iverilog.icarus.com/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub tag tarball 不含 configure，需 autoconf -f 生成（不要运行完整 autoconf.sh，gperf 重新生成会导致 clang SIGSEGV）"
    - "需修改 config.guess/config.sub 添加 HarmonyOS 平台检测"
    - "make -j1 避免并行竞态"
  common_dependencies:
    - gperf
    - autoconf

versions:
  "12.0":
    status: built
    build_date: "2026-06-01"
