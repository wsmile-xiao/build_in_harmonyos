# test_package/MANIFEST.yml
# inih-inireader 62 (upstream tag r62).
#
# Official upstream suite:
#   * tests/unittest.sh / tests/meson.build : 15 compile+run variants compared
#     against the checked-in baseline_*.txt files.
#   * examples/cpptest.sh                   : INIReaderExample (cpptest.txt) and
#     INIReaderExampleErrors (cpptesterrors.txt).

package: inih-inireader/62
homepage: https://github.com/benhoyt/inih

upstream_tests_exist: true
upstream_test_audit: "r62 ships tests/unittest.sh (15 baseline cases) and examples/cpptest.sh (2 INIReader examples)"
upstream_check_command: "reproduce the 15 unittest variants and 2 INIReader examples; compare byte-for-byte with the committed baselines"
upstream_test_in_build: false
upstream_test_command: "test_package/conanfile.py::_run_upstream_tests"
upstream_test_count: 17
upstream_passed: 17
upstream_failed: 0

upstream_tests:
  - multi
  - multi_max_line
  - single
  - disallow_inline_comments
  - stop_on_first_error
  - handler_lineno
  - string
  - heap
  - heap_max_line
  - heap_realloc
  - heap_realloc_max_line
  - heap_string
  - call_handler_on_new_section
  - allow_no_value
  - alloc
  - INIReaderExample
  - INIReaderExampleErrors

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_inih_inireader.cpp
    description: "C: ini_parse_string 解析 4 组键值; C++: INIReader Get/GetInteger/GetReal/GetBoolean/HasSection/HasValue/Keys"
    command: "./test_inih_inireader"

test_files:
  - path: "test_package/test_inih_inireader.cpp"
    test_type: "R34"
    assertion_count: 13
    description: "13 checks over the installed C parser (<ini.h>) and C++ class (<INIReader.h>)"

test_package_test_count: 1
consumer_assertion_count: 13
assertion_count: 13
