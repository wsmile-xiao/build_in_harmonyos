software: intltool
display: "intltool"
description: "Set of tools for internationalizing various file formats"
category: doc
homepage: "https://launchpad.net/intltool"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "纯 Perl 脚本集合，无需原生编译"
    - "XML::Parser XS 模块因 HMDFS dlopen 限制无法加载"
    - "configure 需跳过 XML::Parser 检查（补丁）"
    - "并行构建可能因 HMDFS mkfifo 问题失败，建议 -j1"
  common_dependencies:
    - perl

versions:
  "0.51.0":
    status: published
    build_date: "2026-04-20"
