# test_package/MANIFEST.yml — intltool 0.51.0
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: intltool/0.51.0
homepage: "https://launchpad.net/intltool"

# 上游测试套件：selftest（tests/selftest.pl，40 个编号用例，tests/Makefile.am
# 声明 TESTS = selftest）。真机经解释器桥（E337：tests/ 目录下 perl selftest.pl）
# 实测 40/40（100%）——HMDFS 仅拒绝 shebang 直接执行，解释器调用可正常运行。
# 运行时依赖 XML::Parser（ohpcd expat 2.7.3 编译 XML-Parser 2.47 + PERL5LIB
# 注入）；无 XML::Parser 时 15/40（25 个 XML 类用例失败）。
upstream_check_command: "perl selftest.pl"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（真机实测 40/40 = 100%，selftest exit=0）
upstream_tests:
  - file: tests/selftest.pl
    source: intltool-0.51.0/tests/selftest.pl.in
    description: "intltool selftest（40 个编号用例：extract/merge/prepare 多语言 XML/desktop/scheme 等）；解释器桥实测 40/40（100%）"
    command: "cd tests && perl selftest.pl"

# test_package 消费者测试（R34 真实执行：bin 工具存在 + 可执行 + intltool-update --version 输出 0.51.0）
test_package_tests:
  - file: test_intltool.py
    description: "Verifies bin/intltool-update/intltoolize/intltool-extract exist and are executable, and intltool-update --version actually runs and outputs 0.51.0"
    command: "python3 test_intltool.py"

# 断言总数：4（3 个 bin 工具存在+可执行 + --version 执行 + 版本号 0.51.0）
assertion_count: 4
