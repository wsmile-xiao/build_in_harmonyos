version: "0.51.0"
status: published
build_date: "2026-04-20"

source:
  url: "https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  dependencies:
    - perl
  cc: N/A

patches_applied:
  - "0001-configure.patch"

knowledge_gained:
  - "intltool 是纯 Perl 脚本集合，无需原生编译"
  - "XML::Parser XS 模块因 HMDFS dlopen 限制无法加载"
  - "并行构建可能因 HMDFS mkfifo 问题失败，建议 -j1"
  - "Perl regex 警告（未转义花括号）为非致命"
