# 版本级 manifest — intltool 0.51.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.51.0"
software: "intltool"

# 编译状态: built（真机验证通过未 upload；由 HMBS 门禁后统一更新）
status: built

build_date: "2026-09-02"

# 构建系统（必填顶层字段）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz"
  sha256: "67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # autotools 构建的纯 Perl 工具集（无原生编译）
  system: autotools

  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl

  # 编译器
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-configure.patch"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: official
  total: 40
  passed: 40
  failed: 0
  note: |
    上游测试：selftest 套件（tests/Makefile.am 声明 TESTS = selftest，
    tests/selftest.pl），含 40 个编号用例。真机实测 **40/40（100%）**——
    全部通过（selftest exit=0）。
    运行方式（E337 解释器桥）：从 tests/ 目录 `perl selftest.pl`——HMDFS
    仅拒绝 shebang 直接执行，perl 解释器调用可正常运行。
    运行时依赖 XML::Parser（以 ohpcd expat 2.7.3 编译 XML-Parser 2.47 +
    PERL5LIB 注入）：无 XML::Parser 时 15/40（25 个 XML 类用例失败），
    补齐后 40/40 全部通过。
    适配后：test_package R34 真实执行 bin 工具校验（4/4 = 100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "intltool 是纯 Perl 脚本集合（intltool-update/intltoolize/extract/merge/prepare），autotools 构建，产物 bin/ 5 个可执行脚本，无需原生编译"
  - "configure 检查 XML::Parser 模块（XS 模块在 CI 沙箱因 HMDFS dlopen 限制无法加载）——0001-configure.patch 跳过该检查；运行时 XML::Parser 可用 ohpcd expat 编译 + PERL5LIB 注入解决"
  - "构建用 -j1 避免 HMDFS mkfifo 并行问题"
  - "上游 selftest 可经解释器桥真实运行（E337：tests/ 目录下 `perl selftest.pl`——HMDFS 仅拒 shebang 直接执行，解释器调用可运行）：真机实测 40/40（100%）；无 XML::Parser 时 15/40（25 个 XML 类用例失败）——'无法执行 Perl 脚本'的判断不成立，缺的是 XML::Parser 运行时依赖"
  - "package_type=application（工具集），commands.json type=tool/binary=true"
