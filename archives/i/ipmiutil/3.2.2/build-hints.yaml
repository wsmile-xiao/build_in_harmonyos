software: ipmiutil
version: 3.2.2
build_system: autotools
configure_flags: --prefix=/usr --enable-lanplus=no
env:
  TMPDIR: "$HOME/tmp"
  umask: "022"
post_configure_hooks:
  - description: "Fix config.status umask 077 -> 022 for HMDFS compatibility"
    command: "sed -i 's/umask 077/umask 022/' config.status"
  - description: "Fix config.status mktemp -> mkdir in TMPDIR for HMDFS compatibility"
    command: "sed -i 's|mktemp -d \"./confXXXXXX\") 2>/dev/null|mkdir \"${TMPDIR:-/tmp}/conf.$$\") 2>/dev/null|' config.status"
  - description: "Fix config.status fallback tmp path"
    command: "sed -i 's|tmp=./conf$$-$RANDOM|tmp=${TMPDIR:-/tmp}/conf.$$-$RANDOM|' config.status"
make_flags: "-j1"
make_install_flags: "DESTDIR=$TEST_PREFIX"
notes: |
  HMDFS compatibility: mktemp creates dirs with umask 077 which results in
  drwx--S--- permissions that deny file writes. Fix by changing umask to 022
  and using mkdir in TMPDIR instead of mktemp in source tree.
