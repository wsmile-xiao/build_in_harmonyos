# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: ipmiutil/3.1.7
homepage: "https://ipmiutil.sourceforge.net/"

# Upstream test command
upstream_check_command: "make check"

# Upstream tests not run in build (autotools; ipmiutil 功能测试需真实
# IPMI/BMC 硬件，沙箱无设备)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_ipmiutil.sh
    description: "Run ipmiutil --help to verify tool executes and identifies itself"

# Test assertion count
assertion_count: 1
