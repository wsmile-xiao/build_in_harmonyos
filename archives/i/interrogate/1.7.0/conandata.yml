# Vendored runtime dependency: `py` (deprecated pylib shim) is imported at
# module top level by interrogate/utils.py (`from py import io as py_io`,
# OutputFormatter's TerminalWriter). It is not published in this repo's
# conan registry (verified: conan list 'py/*' -> 0 recipes) and has no task
# card, so release 1.11.0 is vendored into the package's site-packages --
# the same self-contained tree a wheel-based vendoring would lay down.
vendored_py:
  url: "https://files.pythonhosted.org/packages/98/ff/fec109ceb715d2a6b4c4a85a61af3b40c723a961e8828319fbcb15b868dc/py-1.11.0.tar.gz"
