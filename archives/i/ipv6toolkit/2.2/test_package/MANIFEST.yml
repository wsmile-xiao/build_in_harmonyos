# test_package/MANIFEST.yml
package: ipv6toolkit/2.2
homepage: "https://www.si6networks.com/research/tools/ipv6toolkit/"

# 上游测试命令
upstream_check_command: "./tests_libipv6"
upstream_test_in_build: false
upstream_test_command: "./tests_libipv6"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/tests_libipv6.c
    source: ipv6toolkit-2.2/tests/tests_libipv6.c
    description: "Upstream unit tests for libipv6 (ether_ntop, ether_pton, is_service_port)"
    command: "./tests_libipv6"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: addr6 -a ::1/fe80::1/ff02::1 IPv6 address parsing"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 3
