knowledge_gained:
  - "OHOS 系统头文件 linux/socket.h 使用 _UAPI_LINUX_SOCKET_H 作为 include guard（不是 _LINUX_SOCKET_H），sockaddr_storage 与 sys/socket.h 冲突需要跳过 linux/socket.h 并自行定义 __kernel_sa_family_t"
  - "ipv6toolkit 源码已有 __OHOS__ 守卫但使用了错误的宏名，需要修正为 _UAPI_LINUX_SOCKET_H"

