# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: intx/0.15.0
homepage: "https://github.com/chfast/intx"

# 上游测试命令: gtest (Hunter 拉取 GTest 1.15.2)，CMake INTX_TESTING=ON 构建 unittests
upstream_check_command: "cmake -S . -B build -DINTX_TESTING=ON -DCMAKE_CXX_STANDARD=20 && cmake --build build --target intx-unittests && ./build/test/intx-unittests"

# conanfile.py build() 未集成上游测试（库为 header-only，测试属开发期验证）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（317 个 gtest 用例全量运行通过）
upstream_tests:
  - file: test/unittests/test_intx.cpp
    source: intx-0.15.0/test/unittests/test_intx.cpp
    description: "uint_test 类型化套件（uint128/192/256/384/512 各 37 例，共 185）：加法/比较/negate/count 系列；uint512 字面量 1 例"
    command: "./intx-unittests"
  - file: test/unittests/test_intx_api.cpp
    source: intx-0.15.0/test/unittests/test_intx_api.cpp
    description: "uint_api 类型化套件（5 类型各 16 例，共 80）：API 能力与边界验证"
    command: "./intx-unittests"
  - file: test/unittests/test_bitwise.cpp
    source: intx-0.15.0/test/unittests/test_bitwise.cpp
    description: "int128 位运算套件 16 例（按位与/或/异或/移位）"
    command: "./intx-unittests"
  - file: test/unittests/test_div.cpp
    source: intx-0.15.0/test/unittests/test_div.cpp
    description: "div 除法套件 12 例（udivrem 与除法一元/二元运算）"
    command: "./intx-unittests"
  - file: test/unittests/test_builtins.cpp
    source: intx-0.15.0/test/unittests/test_builtins.cpp
    description: "builtins 内置函数套件 11 例（clz/ctz/clmul/带进位/借位运算）"
    command: "./intx-unittests"
  - file: test/unittests/test_uint256.cpp
    source: intx-0.15.0/test/unittests/test_uint256.cpp
    description: "uint256 套件 9 例 + Uint256Test 3 例（乘法、移动、字面量、转字符串）"
    command: "./intx-unittests"

# 测试统计（仅用户测试源 test/unittests 计入独立用例；样例/基准/fixture 不误计）
# 全量发现数: 317 (gtest --gtest_list_tests)
# 全量实际运行: 317，全部 PASSED
# 全量通过率: 317/317 = 100%
test_stats:
  discovered: 317
  ran: 317
  passed: 317
  failed: 0
  pass_rate_percent: 100

# test_package 中自带的测试 (消费者视角验证，同时作为鸿蒙专项测试)
test_package_tests:
  - file: test_intx.cpp
    description: "消费者测试: 通过 find_package(intx) 使用 uint256 加/乘/移位/to_string API，静态断言 2^64 进位"
    command: "./test_intx"

# 测试断言总数 (gtest 用例数近似)
assertion_count: 317