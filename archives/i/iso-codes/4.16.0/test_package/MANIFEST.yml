# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: iso-codes/4.16.0
homepage: "https://salsa.debian.org/iso-codes-team/iso-codes"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: bin/check_valid_utf8.py
    source: iso-codes-4.16.0/bin/check_valid_utf8.py
    description: "Checks that all .po files contain valid UTF-8 data"
    command: "python3 bin/check_valid_utf8.py *.po"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_verify.py
    description: "Verifies JSON data files, pkg-config, and .mo translations are correctly installed"
    command: "python3 test_verify.py $PACKAGE_ROOT"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 19
