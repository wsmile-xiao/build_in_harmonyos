# test_package/MANIFEST.yml — iwnet 1.3.1
# 上游官方测试声明文件（CI L0e 强制要求）

package: iwnet/1.3.1
homepage: "https://github.com/Softmotions/iwnet"

# 上游测试命令（Autark 构建，make test 等价入口为 IWNET_RUN_TESTS=1 ./build.sh）
upstream_check_command: "IWNET_RUN_TESTS=1 ./build.sh"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（完整枚举台账见 reports/upstream-tests-ledger.md）
upstream_tests:
  - file: poller_pipe_test1.c
    source: iwnet-1.3.1/src/poller/tests/poller_pipe_test1.c
    description: "poller pipe 事件测试（独立 main 用例）"
    command: "./poller_pipe_test1"
  - file: poller_proc_test1.c
    source: iwnet-1.3.1/src/poller/tests/poller_proc_test1.c
    description: "poller 子进程管理测试"
    command: "./poller_proc_test1"
  - file: poller_scheduler_test1.c
    source: iwnet-1.3.1/src/poller/tests/poller_scheduler_test1.c
    description: "poller 调度器测试"
    command: "./poller_scheduler_test1"
  - file: poller_timeout_test1.c
    source: iwnet-1.3.1/src/poller/tests/poller_timeout_test1.c
    description: "poller 超时语义测试"
    command: "./poller_timeout_test1"
  - file: wf_test1.c
    source: iwnet-1.3.1/src/http/tests/wf_test1.c
    description: "web framework 断言测试"
    command: "./wf_test1"
  - file: server1.c
    source: iwnet-1.3.1/src/http/tests/server1.c
    description: "HTTP server1 集成测试（plain/ssl harness）"
    command: "./server1-tests-run.sh"
  - file: ws_client_test1.c
    source: iwnet-1.3.1/src/ws/tests/ws_client_test1.c
    description: "websocket client 测试"
    command: "./ws_client_test1"
  - file: ws_client_test2.c
    source: iwnet-1.3.1/src/ws/tests/ws_client_test2.c
    description: "websocket client 测试 2"
    command: "./ws_client_test2"
  - file: ws_client_test4.c
    source: iwnet-1.3.1/src/ws/tests/ws_client_test4.c
    description: "websocket client 测试 4"
    command: "./ws_client_test4"

# test_package 自带的消费者测试（真实调用公开 API + socket 客户端）
test_package_tests:
  - file: test.c
    description: "消费者用例：iwnet 公开 API 创建 HTTP 服务器 + 真实 HTTP 请求验证 200/body"
    command: "./test_iwnet"

# 测试断言总数（近似，上游 IWN_ASSERT 宏逐项断言，见 reports/upstream-tests-ledger.md）
assertion_count: 60
