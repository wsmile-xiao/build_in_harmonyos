# 注：上游测试 harness 脚本两处兼容修改（r01 + r02）：
#     ① GNU sed `I` 修饰符在 OHOS toybox sed 不兼容，按等价大小写类改写
#      （src/http/tests/*-tests-run.sh，r01）；
#     ② --data-urlencode @15MB 因 OHOS 发行版 curl 编码缓冲内存上限 OOM，
#       r02 改为 python3 预计算 URL 编码表单体 + --data-binary 原样发送（server2/proxy1）。
#      见 reports/upstream-tests-ledger.md 与 notes.md。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Autark 构建系统的 AUTARK_HOME 必须用绝对路径，相对路径在嵌套外部项目（iowow）构建时 execve 解析失败"
  - "OHOS 发行版 curl 对 --data-urlencode @file 有内存上限（1MB 可、5MB 起 OOM），大负载 URL 编码测试需换用标准 curl"
  - "HMDFS 挂载不支持 unix domain socket bind（Operation not permitted），/tmp 为只读 tmpfs"
  - "GNU sed /re/Id 的 I 修饰符在 toybox sed 报 bad pattern，用 [cC] 大小写类等价改写"

