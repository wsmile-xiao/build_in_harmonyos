software: imagemagick-full
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/7.1.2-23/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.1.2-23"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
