software: infoware
display: "infoware"
description: "C++ system information library for CPU, memory, OS, kernel and PCI device facts"
category: library
homepage: "https://github.com/ThePhD/infoware"
license: CC0-1.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "x86-only cpuid/xgetbv inline assembly guarded by architecture macros with zero-filled aarch64 fallback (patch 0001)."
    - "Build-time pci.ids requirement satisfied by a pinned official pciutils/pciids snapshot instead of a git clone."
    - "Official 4-example CTest suite runs inside the recipe build and passes on device; consumer test links the installed library."
  common_dependencies: []

versions:
  "0.6.0":
    status: built
    build_date: "2026-09-06"
