# conandata.yml — infoware 0.6.0
#
# Two official sources are needed: the upstream release tag tarball, and the
# pci.ids hardware database that upstream's pci_generator consumes at build
# time (CMake variable INFOWARE_PCI_IDS_PATH). Upstream would otherwise git
# clone pci.ids from the pciutils/pciids repository during configure, which
# build workers cannot do; we pin an official pciutils/pciids snapshot
# instead (the same repository upstream defaults to).

sources:
  - url: "https://github.com/ThePhD/infoware/archive/refs/tags/v0.6.0.tar.gz"
    sha256: "466242836722ace03b8766ad6bd01ff4088d0360a73916834708c9133ce169b7"
  - url: "https://raw.githubusercontent.com/pciutils/pciids/347ba64b3ba5c91211ee8d79596bb6e3dbaab87d/pci.ids"
    sha256: "d20eb0cd2426487a13e6a2253b59c51c3d3af8260b8a22cf4b5542e38eee606d"

patches:
  - patch_file: "patches/0001-src-detail-cpuid_non_windows.cpp.patch"
    patch_description: "Guard x86 cpuid/xgetbv inline assembly with architecture macros and provide zero-filled fallbacks for non-x86 hosts (aarch64), keeping consumers functional"
    patch_type: "portability"
