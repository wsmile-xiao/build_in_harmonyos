package: infoware/0.6.0
homepage: https://github.com/ThePhD/infoware

upstream_check_command: "ctest --test-dir b"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir b"
upstream_tests:
  - file: CMakeLists.txt
    source: infoware-0.6.0/CMakeLists.txt
    description: "Official CTest suite: 4 example programs registered as tests (cpu, gpu, pci, system) when INFOWARE_EXAMPLES=ON and INFOWARE_TESTS=ON"
    command: "ctest --test-dir b"

test_package_tests:
  - file: main.cpp
    description: "Consumer test: links infoware from the package, asserts cpu quantities >= 1, non-zero physical memory, little-endian host (exit codes 1/2/3 identify the failed assertion)"
    command: "ctest (consumer_api_smoke)"

assertion_count: 3
