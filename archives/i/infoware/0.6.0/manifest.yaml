# 版本级 manifest — infoware 0.6.0

version: "0.6.0"
software: "infoware"
status: built
build_date: "2026-09-06"
build_system: cmake

source:
  url: "https://github.com/ThePhD/infoware/archive/refs/tags/v0.6.0.tar.gz"
  sha256: "466242836722ace03b8766ad6bd01ff4088d0360a73916834708c9133ce169b7"
  tag: "v0.6.0"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "INFOWARE_PCI_IDS_PATH=<source>/pci.ids（官方 pciutils/pciids 钉定快照，随 conandata 第二源下载）"
    - "INFOWARE_EXAMPLES=ON"
    - "INFOWARE_TESTS=ON"
    - "CMAKE_SYSTEM_NAME=Linux（CMake 无 OHOS 模块）"
    - "CMAKE_SYSTEM_PROCESSOR=aarch64"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-detail-cpuid_non_windows.cpp.patch"

test_results:
  type: official
  total: 4
  passed: 4
  failed: 0
  skipped: 0
  status: built
  command: "ctest --test-dir b"

knowledge_gained:
  - "上游 x86 专有 __cpuid/xgetbv 内联汇编在 aarch64 交叉场景必须用架构宏（__x86_64__/__i386__）守卫并提供零值回退，不能用平台宏"
  - "上游构建期 git clone 数据文件（pci.ids）在 CI 不可行，改为 conandata 第二源钉定官方仓库快照 + INFOWARE_PCI_IDS_PATH 指向"

patch_classification:
  - file: 0001-src-detail-cpuid_non_windows.cpp.patch
    type: auto
    platform_only: True
    guard: "architecture macros (__x86_64__/__i386__) only, no platform macros"
