source:
  # indi-3rdparty 单体仓库；驱动位于其 indi-aok/ 子目录。
  # 源码代次对齐到 v2.2.2（commit 945fbe12...）：本仓制品仓现有 libindi 2.2.2.1，
  # 而 2.0 代驱动源码使用 libindi 1.9 时代的属性 API（operator& 已 protected）
