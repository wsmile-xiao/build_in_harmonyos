# 本次适配 1 补丁：只改构建脚本 indi-aok/CMakeLists.txt 的 find_package 组件列表，
# 使 libindiclient 进入 DT_NEEDED（CMakeLists 原只请求 driver/lx200，musl 加载期无法为
# libindilx200 定位 INDI 核心符号）。被编译源码（lx200aok.cpp）零改动，R8 合规；
# 其余适配点（探测提示 INDI_ROOT + 构建目录内私有 NovaConfig.cmake）在配方层解决。
patches_applied:
  - "patches/0001-indi-aok-CMakeLists-link-indi-client.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "indi-3rdparty 的驱动子项目用仓库级 cmake_modules/FindINDI.cmake（非 conan 的 libindi config 包）定位依赖，需把预编译 libindi 的包目录通过 INDI_ROOT 提示给它"
  - "indi-3rdparty v2.2.2 整仓没有 FindNova.cmake，libnova 包也不提供 NovaConfig.cmake，而驱动 CMakeLists 硬性 find_package(Nova REQUIRED) → 必须在构建目录内生成私有 NovaConfig.cmake（路径全部取自 libnova 的 cpp_info，R49）"
  - "libindi 2.2.2 的头文件依赖 C++17（std::any）；2.0 代 CMakeCommon.cmake 仍设 CMAKE_CXX_STANDARD 14，v2.2.2 代已升为 17"
  - "CMake 4.x 拒绝 cmake_minimum_required(VERSION 3.0)（2.0 代），v2.2.2 代已是 VERSION 3.16，无需 CMAKE_POLICY_VERSION_MINIMUM 绕过"
  - "libindi 包内 indiversion.h 的 INDI_VERSION 为带引号字符串（\"2.2.2\"），v2.2.2 代 FindINDI.cmake 已兼容带引号解析"
  - "驱动是被 INDI 主程序按需 dlopen 的插件式可执行文件；libindilx200.so 未声明 NEEDED libindidriver，符号来自后者，运行期依赖闭包必须完整"
