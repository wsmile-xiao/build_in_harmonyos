# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: importlib-metadata/9.0.0
homepage: "https://github.com/python/importlib_metadata"

# 上游测试命令 — importlib-metadata 上游 pytest 套件（tests/ 14 个文件）
upstream_check_command: "python3 -m pytest tests/ -o addopts=""" ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-18 实测记录）：
# - tests/ 目录：14 个测试文件（api/integration/main/zip 等）
# - **实测通过（2026-08-18 补测）**：从 CPython 3.12.9 官方源码提取 `Lib/test/`（1581 文件）装到 usr/local 标准库目录（test.support 可用）——重跑全量 pytest：**94 passed + 24 subtests passed（100%——4.81s）**——上游测试全部真实运行通过（此前受阻已解决）
#   （from test.support import os_helper——标准库测试基础设施——发行版
#   Python 无 test 包——`ModuleNotFoundError: No module named 'test'`——
#   排除 4 个依赖文件后其余文件仍 collection 失败（tests 包整体依赖
#   test.support）——`no tests ran`——**环境限制：无 CPython 源码测试
#   基础设施，非臆造**——上游测试无法在发行版 Python 环境运行
# - 测试依赖（pytest/packaging/pyfakefs）按"依赖可装则装"已装——仍受阻
upstream_tests:
  - file: tests/
    source: importlib_metadata-9.0.0/tests/
    description: "上游 pytest 套件（14 文件）——实测 94 passed + 24 subtests（100%）——test 包从 CPython 3.12.9 源码提取装到 usr/local 后全量通过"
    command: "python3 -m pytest tests/ -o addopts=""" ""

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_importlib_metadata.py
    description: "消费者测试（L0c）：真实 API（R34）——distribution()/version/entry_points() 读取打包的 dist-info 元数据"
    command: "python3 test_importlib_metadata.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
