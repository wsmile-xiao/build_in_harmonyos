software: ipatool
# 版本级 manifest 模板
# 文件位置: archives/i/ipatool/2.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
build_system: go

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/majd/ipatool/tarball/v2.3.0"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | go
  system: go

  # 配置选项列表
  configure_options:
    - "GOROOT=/storage/Users/currentUser/usr/local/go"
    - "GOTOOLCHAIN=local"
    - "GOPROXY=https://goproxy.cn,direct"
    - "GOCACHE=/data/storage/el2/base/cache/go-cache-ipatool"
    - "TMPDIR=/data/storage/el2/base/cache"
    - "go build -ldflags=-X github.com/majd/ipatool/v2/cmd.version=2.3.0"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "go/1.24.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go 项目需要正确设置 GOROOT=/storage/Users/currentUser/usr/local/go"
  - "GOTOOLCHAIN=local 防止自动工具链切换"
  - "GOPROXY=https://goproxy.cn,direct 使用中国镜像"
  - "使用 -ldflags 设置版本号: -X github.com/majd/ipatool/v2/cmd.version=2.3.0"