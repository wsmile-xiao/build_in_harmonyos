# test_package — indi-fishcamp 1.1 消费者端到端用例集
#
# indi-fishcamp 是 INDI 驱动（application 包），制品只有两项：
#   * bin/indi_fishcamp_ccd            驱动可执行文件（链接 libindidriver.so.2）
#   * share/indi/indi_fishcamp.xml     INDI 设备描述文件
#
# 驱动需要物理 Starfish 相机（USB），且本构建沙箱的 OHOS 动态加载器对
# conan 缓存内的 libindidriver.so.2 / libindiAlignmentDriver.so.2 两个
# 文件 dlopen 一律 Permission denied（按文件的限制，对照 libusb-1.0.so.0
# 可正常加载；详见 notes.md「驱动直接执行受沙箱限制」），故对包内二进制
# 做**静态**验证（ELF 有效性 / 目标三元组 / INDI 框架链接 / 内嵌 Starfish
# 驱动逻辑字符串）。
#
# 驱动真正的**功能核心**是 libfishcamp 的 Starfish USB 命令协议，而厂商
# 库自带仿真模式（fcUsb_setSimulation(true)，免硬件）。本测试链接包内
# libfishcamp.a 并在仿真模式下驱动完整消费者命令序列（find/open/getinfo/
# gain/integration/exposure/temperature/close），断言**精确**的确定性
# 仿真值——这是真实消费者路径且在沙箱内实际运行。
#
# 统计口径：PR 描述「适配后测试用例统计」表的「鸿蒙特有/消费者测试」行按
# **用例数**填报，即下表的 5 个 HC-N；用例内部 ok/FAIL 行是该用例的检查项。

files:
  - test_fishcamp.c
  - conanfile.py
  - MANIFEST.yml

requirements:
  - indi-fishcamp/1.1
  - libfishcamp/1.2
  - libusb/1.0.27

upstream_tests_exist: false
upstream_test_count: 0

use_cases:
  - id: HC-1
    title: "包内驱动是合法的 AArch64 64-bit ELF 可执行文件 / packaged driver ELF validity"
    kind: consumer_e2e
    description: >
      解析包内 bin/indi_fishcamp_ccd 的 ELF 头：\x7fELF 魔数、ELFCLASS64、
      ELFDATA2LSB、e_machine==EM_AARCH64(183)、e_type 为 ET_EXEC/ET_DYN。
      证明制品是本机目标架构的真实可执行文件而不是占位文件。
    checks: 7
    status: pass

  - id: HC-2
    title: "驱动内嵌 Starfish 逻辑并链接 INDI 2.x 框架 / driver logic + framework linkage"
    kind: consumer_e2e
    description: >
      在包内二进制字节流中验证链接与逻辑落地：NEEDED libindidriver.so.2
      （INDI 2.x 驱动框架，证明 0002 补丁的 INDI::CCD/PropertyNumber 对接
      真的编进了驱动）、NEEDED libindiAlignmentDriver.so.2（INDI 2.x CCD
      基类库）、NEEDED libc++_shared.so（C++17 运行时，证明 0003 补丁 C++17
      标准生效），以及驱动逻辑字符串 'Starfish CCD'（默认设备名）、
      'CCD_GAIN'（增益属性组）、'Camera Info'（相机信息属性组）、
      'Fishcamp CCD is online.'（连接状态消息）、'Taking a %g seconds
      frame...'（曝光开始日志）。
    checks: 8
    status: pass

  - id: HC-3
    title: "libfishcamp 仿真模式端到端真实运行 / functional core, simulation mode"
    kind: consumer_e2e
    description: >
      链接包内 libfishcamp.a，打开仿真模式后驱动驱动使用的全部消费者命令
      并断言精确值：fcUsb_FindCameras()==1（发现 1 台仿真 Starfish）、
      OpenCamera(1)==0、fcUsb_cmd_getinfo 返回 1280x1024 传感器、
      pixel 52x52、setCameraGain(1,1)==0、setIntegrationTime(1,100us)==0、
      startExposure(1)==0、getTemperature()==25（仿真值确定性常量）、
      CloseCamera(1)==0。伪造一份 libfishcamp（把返回值清零/改值）会使
      本用例大面积 FAIL。
    checks: 14
    status: pass

  - id: HC-4
    title: "包内设备描述文件 / packaged device descriptor"
    kind: consumer_e2e
    description: >
      读包内 share/indi/indi_fishcamp.xml（configure_file 从
      indi_fishcamp.xml.cmake 生成，版本宏展开 1.1），断言
      <device label="Starfish CCD">、<driver name="Starfish CCD">
      indi_fishcamp_ccd</driver>（描述文件指向驱动二进制名）、
      <version>1.1</version>、group="CCDs"。证明 INDI 服务端能据此
      描述文件发现并启动该驱动。
    checks: 5
    status: pass

  - id: HC-5
    title: "鸿蒙特有：包内驱动以 OHOS aarch64 为目标 / OHOS aarch64 target confirmation"
    kind: harmony_specific
    description: >
      断言全部落在**包内真实制品**上：ELF 解释器串为 OHOS musl 加载器
      /lib/ld-musl-aarch64.so.1（证明按 OHOS 目标链接，非宿主 x86 产物）、
      e_machine==183（aarch64 交叉编译）、测试程序自身 __aarch64__
      （与制品同一目标架构）。
    checks: 3
    status: pass

summary:
  total_use_cases: 5
  passed_use_cases: 5
  total_checks: 37
  passed_checks: 37
  pass_rate: 1.0
  observed: "== 5 cases, 0 failed == / == 37 checks, 0 failures == / RESULT: PASSED"

# 防空壳的结构性保障（R34 / rule12）
anti_hollow:
  - "test_package/conanfile.py 的 test() 用 self.run 真实编译并执行 test_fishcamp"
  - "缺任一包内制品（bin/indi_fishcamp_ccd 或 share/indi/indi_fishcamp.xml）时直接抛
    AssertionError，不是被跳过"
  - "解析 'case HC-n start|PASS' 行：完全无用例行、任一 ok 检查出现 FAIL、"
    "缺少 HC-5、缺 RESULT: PASSED、或两行汇总任一非零，均抛 AssertionError"
  - "HC-3 的数值断言是精确确定性仿真值（1280x1024 / pixel 52x52 / temp 25 /
    全部命令返回码 0），伪造一份 libfishcamp.a（把解析结果清零或改值）会使
    HC-3 大面积 FAIL"

notes: >
  上游（indilib/indi-3rdparty indi-fishcamp 子目录）不提供任何自动化测试
  套件（tarball 66 个文件中无 tests/ 目录、无 CTest 注册、无 Makefile test
  目标），上游 N=0。本次补全的 5 个消费者用例中 HC-3 在沙箱内真实运行驱动
  功能核心（37 项检查全过），HC-1/HC-2/HC-5 对包内二进制做静态验证，
  HC-4 验证包内设备描述文件。
