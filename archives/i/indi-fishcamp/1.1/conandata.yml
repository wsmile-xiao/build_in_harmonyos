# conandata.yml — indi-fishcamp 1.1
# 源码 = Debian Astronomy Team 的 indi-fishcamp 包官方 orig tarball
# （indilib/indi-3rdparty 仓库 indi-fishcamp/ 子目录的 1.1 版本快照）。
# 上游未为 indi-fishcamp 单独打 tag，Debian contrib pool 是该版本的权威
# 可下载源。2026-09-30 已验证：HTTP 200，46376 字节，
# sha256 eacf05b78b3980389348d9a2be4a112eb1bb2c1d2b8f554743569da8d9102264。

sources:
  url:
    - "https://deb.debian.org/debian/pool/contrib/i/indi-fishcamp/indi-fishcamp_1.1.orig.tar.gz"
  sha256: "eacf05b78b3980389348d9a2be4a112eb1bb2c1d2b8f554743569da8d9102264"
  # strip_root 由 conanfile.py 的 get(..., strip_root=True) 统一传入，
  # 此处不再声明（否则 get() 会收到重复关键字参数）。

patches:
  - patch_file: "patches/0001-FindINDI.cmake.patch"
    patch_description: "FindINDI.cmake 版本号正则回移上游 master 修复：兼容 INDI 2.x indiversion.h 的 INDI_VERSION \"2.2.2\" 引号形式（否则 FATAL_ERROR failed to detect INDI version）"
    patch_type: "portability"
  - patch_file: "patches/0002-indi2.2-api-port.patch"
    patch_description: "Starfish CCD 驱动对接 INDI 2.2 框架：① INDI::CCD 基类成员 TemperatureNP 在 INDI 2.x 由 C 结构体升级为 INDI::PropertyNumber 类，成员用法迁移为 setState/apply/getState/operator[]/getValue/setValue（与上游官方 v2.2.4 移植逐行一致）；② initProperties 中新增 addCaptureFormat(Mono 16bit)（INDI 2.x CCD 基类要求至少一个 capture format）；③ 驱动自身成员 GainNP/CoolerNP/CamInfoTP 等在 2.2 中仍是 C 结构体，保持 .s/.value 不变"
    patch_type: "portability"
  - patch_file: "patches/0003-CMakeLists-ohos-port.patch"
    patch_description: "CMakeLists.txt：① include(CMakeCommon) 之后把 CMAKE_CXX_STANDARD 抬到 17（上游 CMakeCommon 钉死 C++14，而 INDI 2.x 基类头 defaultdevice.h 使用 std::any 等 C++17 特性）；② 1.1 树内无 FindUSB1 wiring 而驱动经 libfishcamp 间接依赖 libusb-1.0，find_library(LIBUSB_LIBRARY NAMES usb-1.0) 并加入链接行；③ INDI_DATA_DIR 覆盖为 ${CMAKE_INSTALL_PREFIX}/share/indi（树内 FindINDI 会报出 libindi 包的数据目录，直接 install 会把设备 xml 装进错误的包）"
    patch_type: "portability"
