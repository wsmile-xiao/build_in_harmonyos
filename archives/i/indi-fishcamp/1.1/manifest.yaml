version: "1.1"
software: "indi-fishcamp"
status: built
build_date: "2026-09-30"
build_system: "cmake"

source:
  # 上游未为 indi-fishcamp 单独打 tag；Debian Astronomy Team 的 contrib pool
  # orig 包是 indilib/indi-3rdparty indi-fishcamp/ 子目录 1.1 版本的权威
  # 可下载快照。2026-09-30 已验证 HTTP 200，46376 字节，顶层目录
  # indi-fishcamp-1.1（66 个文件），tarball 不带 LICENSE 文件。
  url: "https://deb.debian.org/debian/pool/contrib/i/indi-fishcamp/indi-fishcamp_1.1.orig.tar.gz"
  sha256: "eacf05b78b3980389348d9a2be4a112eb1bb2c1d2b8f554743569da8d9102264"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_SYSTEM_NAME=Linux (E092: CMake 无 HarmonyOS 平台映射)"
    - "CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "CMAKE_FIND_PACKAGE_PREFER_CONFIG=OFF (让树内 FindINDI/FindFISHCAMP/FindCFITSIO 生效)"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 (上游 cmake_minimum_required 3.0，CMake>=4.0 不兼容)"
    - "-I<libusb include leaf include/libusb-1.0> (fishcamp_common.h 按 <libusb.h> 裸名引用)"
    - "CMAKE_CXX_STANDARD=17 (patch 0003，INDI 2.x defaultdevice.h 用 std::any)"
    - "INDI_DATA_DIR=${CMAKE_INSTALL_PREFIX}/share/indi (patch 0003，设备 xml 装进本包)"
  dependencies:
    - "libindi/2.2.2.1"
    - "libfishcamp/1.2"
    - "cfitsio/4.6.4"
    - "zlib/1.3.1.1"
    - "libusb/1.0.27"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-FindINDI.cmake.patch (portability: 版本号正则兼容 INDI 2.x 引号形式，与 indi-gpsnmea 0001 byte-identical)"
  - "patches/0002-indi2.2-api-port.patch (portability: 基类成员 TemperatureNP C 结构体 -> INDI 2.x PropertyNumber 类 API 迁移 + addCaptureFormat(Mono 16bit)，与上游官方 v2.2.4 移植逐行一致)"
  - "patches/0003-CMakeLists-ohos-port.patch (portability: C++17 + libusb-1.0 链接 + INDI_DATA_DIR 指向本包 share/indi)"

test:
  # 上游 tarball（66 个文件）无任何自动化测试套件：无 tests/ 目录、无
  # CTest 注册、无 Makefile test 目标（纯驱动 + CMake 构建脚本 +
  # cmake_modules/ 下的 Find*.cmake 集合）。
  upstream_test_in_build: false
  upstream_test_command: "none (upstream ships no test suite)"
  upstream_test_count: 0
  upstream_pass: 0
  package_test: "test_fishcamp: 5 个端到端用例(HC-1 包内驱动 ELF 有效性/HC-2 INDI 2.x 框架链接+Starfish 驱动逻辑落地/HC-3 libfishcamp 仿真模式端到端真实运行/HC-4 设备描述 XML/HC-5 鸿蒙特有 aarch64+musl loader)"
  assertions: 37
  pass_rate: 1.0
  result: "conan create (test_package) 真实执行: == 5 cases, 0 failed == / == 37 checks, 0 failures == / RESULT: PASSED"
