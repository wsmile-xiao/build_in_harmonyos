# iputils 20240905 缂栬瘧璁板綍
# 鐢?OpenHarmony 缂栬瘧鏅鸿兘浣撶敓鎴?

software: iputils
version: 20240905
status: published

build_info:
  build_system: meson
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "-DBUILD_PING=true"
    - "-DBUILD_TRACEPATH=true"
    - "-DBUILD_ARPING=true"
    - "-DBUILD_CLOCKDIFF=true"
    - "-DNO_SETCAP_OR_SUID=true"
    - "-DUSE_CAP=false"
    - "-DUSE_IDN=false"
    - "-DSKIP_TESTS=true"
    - "-DUSE_GETTEXT=false"

  compiler: clang 15.0.4
  target_platform: HarmonyOS aarch64

  build_tools:
    - ping
    - tracepath
    - arping
    - clockdiff

  ipv6_support:
    ping: true
    tracepath: true
    note: "ping 鍜?tracepath 缁熶竴鏀寔 IPv4/IPv6锛屼娇鐢?-4/-6 閫夐」鍒囨崲"

patches:
  - name: "0001-harmonyos-compatibility.patch"
    description: "淇 HarmonyOS/musl 骞冲彴鍏煎鎬ч棶棰?
    fixes:
      - "program_invocation_short_name 鏈畾涔夛紙glibc 鐗规湁锛?
      - "sockaddr_storage 閲嶅畾涔夊啿绐?

dependencies:
  required:
    - meson >= 0.44
    - ninja
    - clang/gcc
  optional:
    - libcap (鏈畨瑁咃紝绂佺敤 USE_CAP)
    - libidn2 (鏈畨瑁咃紝绂佺敤 USE_IDN)
    - gettext (鏈畨瑁咃紝绂佺敤 USE_GETTEXT)

test_results:
  ping_ipv4:
    test: "ping -c 1 127.0.0.1"
    result: "PASS"
    output: "64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.097 ms"

  ping_ipv6:
    test: "ping -c 1 ::1"
    result: "PASS"
    output: "64 bytes from ::1: icmp_seq=1 ttl=64 time=0.081 ms"

  tracepath_ipv4:
    test: "tracepath 127.0.0.1"
    result: "PASS"
    output: "1: localhost 0.227ms reached"

  tracepath_ipv6:
    test: "tracepath ::1"
    result: "PASS"
    output: "1: ip6-localhost 0.202ms reached"

  arping:
    test: "arping -V"
    result: "PASS"
    output: "arping from iputils 20240905"

  clockdiff:
    test: "clockdiff -V"
    result: "PASS"
    output: "clockdiff from iputils 20240905"

binary_info:
  ping:
    size: 262KB
    format: ELF 64-bit LSB arm64, dynamic
    path: bin/ping

  tracepath:
    size: 50KB
    format: ELF 64-bit LSB arm64, dynamic
    path: bin/tracepath

  arping:
    size: 66KB
    format: ELF 64-bit LSB arm64, dynamic
    path: bin/arping

  clockdiff:
    size: 51KB
    format: ELF 64-bit LSB arm64, dynamic
    path: bin/clockdiff

knowledge_gained:
  platform_specific:
    - issue: "program_invocation_short_name glibc-only"
      solution: "浣跨敤 __progname 鏇夸唬"
      applicability: "鎵€鏈変娇鐢?error() 鍑芥暟鐨勮蒋浠?

    - issue: "sockaddr_storage 閲嶅畾涔夊啿绐?
      solution: "璋冩暣澶存枃浠跺寘鍚『搴忥紝浣跨敤瀹忛噸鍛藉悕"
      applicability: "鍖呭惈 linux/rtnetlink.h 鐨勭綉缁滆蒋浠?

  build_specific:
    - issue: "meson vcs_tag 闇€瑕?git 鎴?meson 鍐呴儴鍛戒护"
      solution: "鍒涘缓绗﹀彿閾炬帴浣?meson 鍙墽琛?
      applicability: "浠呮湰杞欢"

notes:
  - "iputils 20240905 缁熶竴浜?ping 鍜?ping6锛屼娇鐢ㄥ崟涓€ ping 宸ュ叿鏀寔 IPv4/IPv6"
  - "绂佺敤浜?capability 鍜?IDN 鏀寔锛堟棤 libcap/libidn2锛?
  - "鎵€鏈夊伐鍏峰潎鏈繘琛?ELF 绛惧悕锛堥渶瑕佸湪鎵撳寘鏃跺鐞嗭級"

build_date: 2026-05-06
compile_duration: "绾?20 鍒嗛挓锛堝寘鍚皟璇曞拰淇锛?