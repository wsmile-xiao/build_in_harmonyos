# Upstream test census and consumer tests for islamic-menus 1.0.5.
package: islamic-menus/1.0.5
homepage: "https://launchpad.net/islamic-menus"

# The upstream source archive contains no tests/ directory or test runner.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_islamic_menus.c
    description: "Parse the installed XDG menu routes, resolve both translated desktop-directory entries, and read their SVG icons"
    command: "/data/service/hnp/bin/bash test_islamic_menus <package-root>"
  - file: test_ohos.sh
    description: "On HarmonyOS PC, verify AArch64/HongMeng shell runtime and XDG environment, then run the real AArch64 data consumer"
    command: "/system/bin/sh test_ohos.sh <consumer-binary> <package-root>"

# 16 consumer checks and 6 HarmonyOS runtime/XDG checks.
assertion_count: 22
