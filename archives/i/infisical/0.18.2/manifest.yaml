software: infisical
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.18.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.18.2"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: go

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///data/storage/el2/base/cache/builds/infisical-cli-v0.18.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: go

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "GOPROXY=https://goproxy.cn,direct"
    - "ldflags=-s -w -X github.com/Infisical/infisical-merge/packages/util.CLI_VERSION=0.18.2"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "go/1.26.4"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
