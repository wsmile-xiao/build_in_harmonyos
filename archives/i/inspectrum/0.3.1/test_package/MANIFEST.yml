# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: inspectrum/0.3.1
homepage: "https://github.com/miek/inspectrum"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# inspectrum 上游为 CMake 构建：顶层 CMakeLists.txt 调用了 enable_testing()，
# 但整个源码树（CMakeLists.txt + src/ 全部 22 个 .cpp/.h）中不存在任何
# add_test() 调用，也没有 tests/ 目录或 *test* 源文件（find 实证为空），
# 即上游虽声明了测试框架入口但实际注册的测试为 0。
upstream_check_command: "ctest"

# 上游实际运行的测试程序（空清单，附清点证据）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：链接 inspectrum 的完整依赖面（Qt5 Core/Widgets/Concurrent + fftw3f + liquid-dsp），实测 8 点单精度 FFTW 正变换（DC bin=0、k=1 bin 幅值=8）、liquid_firdes_kaiser 低通系数有限且直流增益≈1、QCoreApplication 初始化与 QString/QStringList 行为"
    command: "./test_inspectrum"
  - file: "(打包二进制实测) bin/inspectrum"
    description: "QT_QPA_PLATFORM=offscreen 下限时启动冒烟：Popen 启动打包后的 inspectrum，进程存活满 15s 未崩溃（GUI 进入事件循环不会自行退出，超时 kill 属预期），且日志含 QApplication/offscreen 平台插件完整初始化证据（QFontDatabase/QStandardPaths）"
    command: "inspectrum --help (15s timeout)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
