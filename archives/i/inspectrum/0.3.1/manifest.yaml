# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.1"

# 软件名
software: "inspectrum"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/miek/inspectrum/archive/refs/tags/v0.3.1.tar.gz"

  # 源码校验和
  sha256: "94e42333aceb06c15fb6fc10d186d61112975fdcf9539357a279e886e9edf35e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - qt5-qtbase/5.15.2.2
  - fftw3f/3.3.10
  - liquid-dsp/1.8.2
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "上游 FindFFTW/FindLiquid 模块尊重预设缓存变量，直接传 FFTW_LIBRARIES/LIQUID_LIBRARIES 绝对路径即可，无需补丁"
- "制品仓 fftw/3.3.11 只含双精度 fftw3；inspectrum 需单精度 fftw3f，应依赖 fftw3f/3.3.10"
- "liquid-dsp/1.8.2 发布的是静态 libliquid.a"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
