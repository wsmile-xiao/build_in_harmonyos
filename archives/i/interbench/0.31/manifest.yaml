knowledge_gained:
  - "旧年代 C 代码在 clang 15 + musl 下，struct stat 不再经其他头文件传递包含：须显式 #include <sys/stat.h>，否则报 incomplete type"
  - "GNU make 把目标先决条件中不认识的词（如 -lm）当作要构建的文件目标；系统库应放 LDFLAGS/LDLIBS，否则在无开发库链接的系统上报 No rule to make target '-lm'"
