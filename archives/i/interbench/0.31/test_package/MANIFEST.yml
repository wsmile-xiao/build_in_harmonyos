# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在
# 上游 interbench 0.31 无测试目标/测试套件：Makefile 仅有 build/clean 两个目标，
# 源码中无 check/test 代码，程序本身即基准工具（运行即端到端验证）。
# 故 upstream_tests 为空；消费者测试 test_interbench.py 直接执行已安装二进制，
# 逐例输出 TEST PASS/TEST FAIL 与 TEST SUMMARY（共 4 个用例）。

package: interbench/0.31
homepage: "https://github.com/ckolivas/interbench"

# 上游测试命令（Makefile 无 check/test 目标）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_interbench.py
    description: "消费者测试执行器：-h 用法输出 / 非法 load 名拒绝(rc=254) / 完整基准运行(Audio vs Burn, -t 10) / 复用已存 loops_per_ms；逐例 TEST PASS/FAIL + 末行 TEST SUMMARY，任一失败 exit(1)"
    command: "python3 test_interbench.py <installed interbench binary>"

# 上游无测试断言（upstream_tests 为空，见上）；assertion_count 计入消费者执行器 4 个具名用例
assertion_count: 4
