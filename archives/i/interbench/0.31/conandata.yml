# conandata.yml — interbench 0.31
# 官方 GitHub 标签归档 v0.31（github.com/…/archive 形式；与 codeload 直链同一归档、同 sha256。
# 实测 ghfast.top 等加速镜像对 codeload.github.com 形式返回 403，对 github.com/archive 形式正常代理）。
# 核心源文件与官方发布包 ck.kolivas.org/…/interbench-0.31.tar.bz2 逐 md5 一致：
#   interbench.c 1fc45396ac67b90c2c761125151235c7 / interbench.h 47d036e2bd7b5ac41f3591f2f6990806
#   hackbench.c d5685e837ab924b4ef4c3ca61606b6e2 / COPYING 393a5ca445f6965873eca0259a17f833
# Makefile 与官方发布版的差异（链接行 -lm 位置）已由 0002 补丁对齐。

sources:
  url: "https://github.com/ckolivas/interbench/archive/refs/tags/v0.31.tar.gz"
  sha256: "eb838f89a95ba0bffde06c86f6bda565ef234e6165ab86df4e187933ac779151"

patches:
  - patch_file: "patches/0001-add-sys-stat-header.patch"
    patch_description: "Add missing <sys/stat.h> include: struct stat was only pulled in transitively via other headers on old glibc; clang 15 on OHOS reports 'variable has incomplete type struct stat'"
    patch_type: "portability"
  - patch_file: "patches/0002-fix-makefile-lm-prerequisite.patch"
    patch_description: "Keep -lm out of the prerequisite list: GNU make tries to resolve unrecognised prerequisites as files to build and fails with 'No rule to make target -lm' on OHOS where /usr/lib/libm.so is unreadable. -lm is still passed at link time via LDFLAGS (as in the official 0.31 release Makefile)"
    patch_type: "portability"
