# interbench — 软件级元数据

software: interbench
display: "interbench"
description: "内核交互性基准工具：模拟多种负载测量调度延迟与抖动，对比不同负载组合下的交互性"
category: system
homepage: "https://github.com/ckolivas/interbench"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "package_type=application，官方 Makefile 直接构建（make CC=clang），产物为单个 interbench 可执行文件"
    - "补丁 0001：显式 #include <sys/stat.h>——clang 15 + musl 下 struct stat 不再经其他头文件传递包含"
    - "补丁 0002：Makefile 先决条件行的 -lm 移除——GNU make 会把不认识的先决条件当文件目标（No rule to make target）；-lm 仍经 LDFLAGS 参与链接"
    - "首次运行要求当前目录内 interbench.read 大小恰为 MemTotal×1024 字节，否则实写等大文件（真机 32GB 级）；消费者测试用稀疏文件走尺寸相符快路径"
    - "非 root 下 SCHED_FIFO 返回 EPERM 属预期：工具提示 Results will be unreliable 并继续运行（退出码 0）"
  common_dependencies: []

versions:
  "0.31":
    status: built
    build_date: "2026-10-04"
    conan_ref: "interbench/0.31"
