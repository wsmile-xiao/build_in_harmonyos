# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: irpas/0.10
homepage: "https://www.phenoelit.de/irpas/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# irpas 0.10 为纯 Makefile CLI 工具集，官方无测试框架/check 目标
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（官方 0.10 无任何测试源/脚本/断言宏，见 notes.md 台账）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    type: consumer
    description: "消费者用例：通过公开 CLI 逐一调用 16 个 irpas 工具，断言退出码 0 与 usage 输出；netenum 业务调用可观测结果"
    command: "./test_irpas"
  - file: ohos_test.c
    type: ohos_specific
    description: "鸿蒙专项：uname 平台身份 + AF_INET raw socket 系统调用面探测 + 已安装 CLI 在 OHOS 运行时真实执行"
    command: "./ohos_test"