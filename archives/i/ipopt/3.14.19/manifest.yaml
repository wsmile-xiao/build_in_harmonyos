software: ipopt
# 版本级 manifest 模板
# 文件位置: archives/i/ipopt/3.14.19/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.14.19"

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/coin-or/Ipopt/archive/refs/tags/releases/3.14.19.tar.gz"
  sha256: "b3eb84a23812b53a3325bcd2c599de2b0f5df45a18ed251f9e3c1cd893136287"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--with-lapack-lflags=-L$HOME/usr/local/lib -lopenblas"
  dependencies:
    - openblas/0.3.26
  cc: gcc
  cxx: g++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0010-config.guess.patch"
  - "0011-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OpenHarmony 需要修改 config.guess/config.sub 支持系统识别"
  - "OpenBLAS 需要使用 USE_THREAD=0 编译，避免 pthread_setaffinity_np 问题"
  - "ipopt 可使用 OpenBLAS 内置 LAPACK wrapper，无需完整 LAPACK"
