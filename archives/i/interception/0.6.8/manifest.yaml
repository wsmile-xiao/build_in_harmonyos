# 版本级 manifest — interception-tools 0.6.8
# 遵循 ARCHIVE-SPEC v2.0

version: "0.6.8"
software: interception

# 编译状态
# published | built | failed | archived
status: built

build_date: "2026-10-05"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # GitLab 上游 v0.6.8 tag 归档(同一 commit 字节稳定)
  url: "https://gitlab.com/interception/linux/tools/-/archive/v0.6.8/tools-v0.6.8.tar.gz"
  upstream_url: "https://gitlab.com/interception/linux/tools/-/tree/v0.6.8"
  sha256: "84ced1c10bef7f00660704685c651c4241096cc9848c31f5a04f166e1450949d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=<ohos 自带,cmake_minimum 3.10 已由补丁兼容>"

  # 编译依赖(格式: name/version)——全部来自 main 已发布包
  dependencies:
    - libevdev/1.13.7
    - eudev/3.2.14
    - yaml-cpp/0.9.0

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-cmake-ohos-deps.patch"
  # ① cmake_minimum 3.0→3.10(现代 CMake 兼容)
  # ② udev/yaml-cpp 链接改走 pkg_check_modules(原裸 -l 名在交叉构建下
  #    依赖宿主链接路径)
  # ③ 移除 mux 目标与 Boost 依赖(mux 需 Boost.Interprocess,仓库 boost
  #    组件集未含 interprocess;mux 为可选多路复用器,udevmon 才是核心)

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 4 目标中 mux 需 Boost.Interprocess;仓库 boost 1.85/1.91 配方组件集(filesystem/iostreams/program_options/regex/thread)不含 interprocess → 裁剪 mux,保留核心三工具(udevmon 守护 + intercept + uinput)"
  - "上游 udev/yaml-cpp 用裸 -l 名链接,交叉构建下 conan 库不在默认搜索路径;补丁统一改 pkg_check_modules,与已内置的 libevdev 同法"
  - "cmake_minimum 3.0 会被现代 CMake 拒绝,一并升 3.10"
  - "musl 风险 grep 干净:源码无 program_invocation_short_name/rindex/strcasestr"
