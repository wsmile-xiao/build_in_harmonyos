# conandata.yml — interception-tools 0.6.8
# 来源:GitLab 上游 v0.6.8 tag 归档(GitLab 归档对同一 commit 字节稳定)

sources:
  "0.6.8":
    url: "https://gitlab.com/interception/linux/tools/-/archive/v0.6.8/tools-v0.6.8.tar.gz"
    sha256: "84ced1c10bef7f00660704685c651c4241096cc9848c31f5a04f166e1450949d"
    tar_format: tar.gz

patches:
  "0.6.8":
    - patch_file: "patches/0001-cmake-ohos-deps.patch"
      patch_description: >-
        CMake 移植:① cmake_minimum 3.0→3.10(现代 CMake 兼容);
        ② libevdev/udev/yaml-cpp 改走 pkg_check_modules(上游裸 -l 名
        依赖宿主链接路径,交叉构建不可用);③ 移除 mux 目标与 Boost
        依赖(mux 需 Boost.Interprocess,仓库 boost 包组件集未覆盖,
        且 mux 为可选多路复用器,udevmon 才是核心守护)。
      patch_type: "portability"
