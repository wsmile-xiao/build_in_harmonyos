# 软件级 manifest — interception
# 文件位置: archives/i/interception/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: interception

display: "interception-tools"

description: "Composable input device interception suite for Linux (udevmon/intercept/uinput)"

category: system

homepage: "https://gitlab.com/interception/linux/tools"

license: GPL-3.0-or-later

build_system: cmake

ohos_adaptation:
  key_points:
    - "mux 目标需 Boost.Interprocess(仓库 boost 组件集未覆盖),已裁剪;核心三工具 udevmon/intercept/uinput 保留"
    - "udev/yaml-cpp 裸 -l 链接改 pkg_check_modules,与 libevdev 同法"
    - "运行前提:CONFIG_INPUT、/dev/input、eudev 运行时"
  common_dependencies:
    - libevdev
    - eudev
    - yaml-cpp

versions:
  - version: "0.6.8"
    status: built
    build_date: "2026-10-05"
    notes: |
      - 首次适配(GitLab v0.6.8 tag)
      - cmake 构建,application 型包(bin/ 三工具)
      - 依赖经 pkg-config:libevdev/eudev(libudev)/yaml-cpp 来自 conan 依赖图
    dependencies:
      - libevdev/1.13.7
      - eudev/3.2.14
      - yaml-cpp/0.9.0
    provides:
      - bin/udevmon
      - bin/intercept
      - bin/uinput
