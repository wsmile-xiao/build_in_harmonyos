# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: isocline/1.1.0
homepage: "https://github.com/daanx/isocline"

# 上游测试套件存在性 (经审计上游源码确认：无自动化测试框架)
upstream_tests_exist: false

# 上游测试审计 (源码: v1.1.0.tar.gz,
# sha256 1e5f0efa2b719c3e1d292f501e5329e141a039deefc801099f8bbb9a50255531)
upstream_test_audit:
  source_tarball: "v1.1.0.tar.gz (https://github.com/daanx/isocline/archive/refs/tags/v1.1.0.tar.gz)"
  source_sha256: "1e5f0efa2b719c3e1d292f501e5329e141a039deefc801099f8bbb9a50255531"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / add_test (ctest)"
    - "check_PROGRAMS / TESTS (automake make check)"
    - "meson test wiring"
  scan_result: "0 matches — 顶层 CMakeLists.txt 无 enable_testing/include(CTest)/add_test/add_subdirectory(tests) 接线，无 check/test 目标；IC_BUILD_TESTS 选项仅控制 example 与 test_colors 两个演示程序是否构建"
  manual_programs_only:
    - "test/example.c — 交互式 readline 主循环演示（阻塞读 stdin，需真实 TTY），非自动化断言套件"
    - "test/test_colors.c — 可视化终端色板演示（含 main 但只打印色板、无断言），非自动化断言套件"
    - "test/Example.hs — Haskell 绑定使用示例，非 C 测试"
  reason: "isocline 1.1.0 上游发布包不含任何自动化测试套件"

# 上游测试命令 (无自动化套件，故 check 命令不适用)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_isocline.c
    description: "消费者测试：默认模式 12 项非交互 API 断言（版本宏/字符串与字符类/词法匹配/UTF-8 导航/提示符回环/色板探测/bbcode 打印/历史与选项）+ 管道 stdin 模式 1 项 ic_readline 端到端内容断言"
    command: "./test_isocline + ./test_isocline --stdin-line < piped line"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
