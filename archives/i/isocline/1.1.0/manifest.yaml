# 版本级 manifest — isocline 1.1.0
# 遵循 ARCHIVE-SPEC v3.0

version: "1.1.0"
software: "isocline"

# 编译状态: built (配方已完成，待真机预检验证后发布)
status: built

build_date: "2026-09-17"
conan_ref: "isocline/1.1.0"

# 构建系统 (必填顶层字段): CMake（上游自带 CMakeLists.txt）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/daanx/isocline/archive/refs/tags/v1.1.0.tar.gz"
  sha256: "1e5f0efa2b719c3e1d292f501e5329e141a039deefc801099f8bbb9a50255531"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DIC_BUILD_TESTS=OFF"

  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 CMakeLists 恒同时构建 isocline 静态库与 isocline_shared 共享库（OUTPUT_NAME 均为 isocline），忽略 BUILD_SHARED_LIBS；配方按 shared 选项在 package() 期裁剪对侧产物，保证单包单形态"
  - "纯 C99 零依赖库（无 pthread/math/dlopen，仅 libc termios/ioctl/locale），OHOS 无需任何补丁"
  - "上游无自动化测试套件：CMakeLists 无 enable_testing/include(CTest)/add_test，无 check 目标；test/ 仅 example.c（交互式 readline 主循环，需 TTY）、test_colors.c（可视化色板演示）与 Example.hs（Haskell 绑定示例），IC_BUILD_TESTS=OFF 关闭其构建"
