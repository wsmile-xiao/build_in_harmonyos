# 软件级 manifest — isocline
software: isocline
display: "isocline"
description: "A portable GNU readline alternative (multiline editing, history, completion, syntax highlighting)"
category: text
homepage: "https://github.com/daanx/isocline"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 C99 单文件库（src/isocline.c），零外部依赖，仅依赖 libc（无 pthread/math/dlopen），OHOS 适配无需补丁"
    - "上游 CMakeLists 恒同时构建静态库 isocline 与共享库 isocline_shared（忽略 BUILD_SHARED_LIBS），配方按 shared 选项在 package() 期裁剪对侧产物"
    - "上游无自动化测试套件（无 enable_testing/add_test，无 check 目标；test/ 仅交互式演示程序），test_package 以消费者 API 断言测试补全（R34），MANIFEST.yml 含 no_tests 审计"
  common_dependencies: []

versions:
  "1.1.0":
    status: built
    build_date: "2026-09-17"
    conan_ref: "isocline/1.1.0"
