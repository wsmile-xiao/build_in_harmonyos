software: incus
version: "7.1.0"

status: built
build_system: custom
build_date: "2026-06-17"

source:
  url: "https://github.com/lxc/incus/archive/refs/tags/v7.1.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux GOARCH=arm64"
    - "GOTOOLCHAIN=local"
  dependencies:
    - golang/1.26.0
  cc: go
  cxx: ""
  binaries:
    - incus
    - incus-migrate
    - incus-simplestreams
    - incus-user
  excluded_binaries:
    - incusd
    - incus-agent
    - incus-benchmark
    - fuidshift
    - lxc-to-incus
    - lxd-to-incus
patches_applied: []

knowledge_gained:
  - "incus requires Go 1.25.6+ for CGO_ENABLED=0 build, Go 1.26.0 sufficient"
  - "incusd (server daemon) cannot be built with CGO_ENABLED=0 due to missing quota/warningtype packages"
  - "incusd requires CGO_ENABLED=1 and liblxc, cowsql, libudev, sys/acl.h - unavailable on HarmonyOS"
  - "sockaddr_storage redefinition conflict in OHOS SDK prevents CGO_ENABLED=1 builds"
  - "incus client,4 client tools built successfully with CGO_ENABLED=0"
  - "fuidshift requires CGO (依赖 (idmap.ShiftPath/UnshiftPath)"
  - "incus is a partial build - server components excluded due to CGO dependency requirements"
