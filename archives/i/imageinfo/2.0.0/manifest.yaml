knowledge_gained:
  - "imageinfo 为 CMake INTERFACE header-only 库 + CLI 工具（imageinfo_cli），master project 下 IMAGEINFO_BUILD_TOOLS/TESTS/INSTALL 默认 ON，Conan 配方需显式声明保持默认一致"
