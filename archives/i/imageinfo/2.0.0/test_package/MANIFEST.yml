# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: imageinfo/2.0.0
homepage: "https://github.com/xiaozhuai/imageinfo"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake --build build && ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./imageinfo_tests"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/tests.cpp
    source: imageinfo-2.0.0/tests/tests.cpp
    description: "解析 images/valid/ 与 images/invalid/ 下全部真实样例，校验格式/尺寸/错误路径"
    command: "./imageinfo_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：parse<RawDataReader> 解析 1x1 PNG 内存字节，校验 kFormatPng 与尺寸"
    command: "./test_imageinfo"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 200
