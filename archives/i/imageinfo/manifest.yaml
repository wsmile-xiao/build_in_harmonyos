software: imageinfo
display: "imageinfo"
description: "图像格式识别与尺寸获取 header-only C++ 库 + CLI 工具（支持 avif/heic/bmp/cur/ico/dds/gif/hdr/icns/j2k/jp2/jpg/png/psd/svg/tga/tiff/webp 等）"
category: graphics
homepage: "https://github.com/xiaozhuai/imageinfo"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "库为 header-only（imageinfo 为 CMake INTERFACE target）+ CLI 工具 imageinfo_cli"
    - "master project 下 IMAGEINFO_BUILD_TOOLS/TESTS/INSTALL 默认 ON，Conan 配方需显式声明保持一致"
    - "上游测试为 tests/tests.cpp 自定义断言宏（约 200 断言），解析 images/ 下真实样例；ctest 1/1 通过"
    - "GitHub 直连下载超时属网络问题（E017），可用 codeload/ghfast 镜像"
  common_dependencies: []

versions:
  "2.0.0":
    status: built
    build_date: "2026-09-22"
    conan_ref: "imageinfo/2.0.0"
