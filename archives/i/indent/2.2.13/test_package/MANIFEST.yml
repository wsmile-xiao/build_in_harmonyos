# test_package/MANIFEST.yml — indent 2.2.13
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制）
#
# 上游测试口径（四维账本）：
#   N_static = 125 —— 上游回归套件 regression/input/ 下 125 个用例
#   （.c/.err 输入），由 regression/TEST 脚本驱动：对每个用例运行
#   ../src/indent 并与 regression/standard/ 期望输出逐字节对比。
#   注：该套件未注册为 autotools TESTS 变量（脚本驱动），make check
#   的 test 子集入口被 man/texinfo2man 阻塞（HMDFS 执行限制族），
#   故按上游设计直接运行 TEST 脚本，效果等同且证据更完整。
#
#   实测执行结果（真机）：125 个用例全部通过，
#   "Regression test successfully completed"。
#
#   新增消费者测试 1 个：test_package 消费者以 CLI 使用者身份运行
#   打包后的 indent 二进制格式化 sample.c 并断言输出内容。

package: indent/2.2.13
homepage: "https://www.gnu.org/software/indent/"

# 上游测试命令
upstream_check_command: "make check (入口被 man/texinfo2man 阻塞) → sh regression/TEST (上游回归套件驱动)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "sh ./TEST (in regression/)"

# 上游实际运行的测试程序
upstream_tests:
  - file: regression/TEST
    source: indent-2.2.13/regression/TEST
    description: "上游回归套件驱动：125 个 input 用例逐一运行 ../src/indent 并与 standard/ 期望对比"
    command: "sh ./TEST (125/125 passed, Regression test successfully completed)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: sample.c
    description: "消费者测试: 运行打包后的 indent 二进制格式化 sample.c，断言输出含 main()/printf()"
    command: "indent -o sample_formatted.c sample.c"

# 测试断言总数 (近似值: 上游 125 个回归用例对比断言 + 消费者 3 项)
assertion_count: 128
