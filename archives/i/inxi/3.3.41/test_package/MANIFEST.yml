# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: inxi/3.3.41
homepage: "https://smxi.org/docs/inxi.htm"

# Upstream test command
upstream_check_command: "make check"

# Upstream tests not run in build (Perl script; no automated test suite
# shipped in release tarball)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_inxi.sh
    description: "Run inxi --version to verify tool executes"

# Test assertion count
assertion_count: 1
