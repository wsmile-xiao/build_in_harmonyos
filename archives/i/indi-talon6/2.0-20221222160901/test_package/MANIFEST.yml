# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点（R51，证据见 notes.md「上游测试清点」一节）：
#   清单 `indi-talon6/`：CMakeLists.txt、talon6.cpp、talon6.h、config.h.cmake、
#   indi_talon6.xml.cmake、README、AUTHORS、ChangeLog、INSTALL、TODO
#   CMakeLists.txt 无 enable_testing()/add_test()（只有 add_executable + install），
#   indi-3rdparty 全仓亦无该驱动的测试用例
#   → 上游确无测试（故 upstream_tests 为空列表，非占位符）

package: indi-talon6/2.0-20221222160901
homepage: "https://github.com/indilib/indi-3rdparty"

# 上游测试命令：该驱动子项目未提供 check/test 目标
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试（上游确无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（清点结论：无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，鸿蒙独有）
test_package_tests:
  - file: check_driver.py
    description: "消费者校验 4 项：bin/indi_talon6 为 AArch64 ELF；share/indi/indi_talon6.xml 与 bin/ 交叉引用一致（driver name=Talon6）；驱动 DT_NEEDED 静态审计（libindiclient/libindidriver/libindiAlignmentDriver 三项齐备、均为裸 soname、且都能在 libindi 包内找到）；conanrun 下真跑驱动——**真实闭包/符号缺陷一律 FAIL**（未解析符号、未解析共享对象、被点名却不在任何依赖包内的库），仅**有证据**的宿主拒绝记 SKIP（输出含平台限制标记，或被点名的库确实存在却同样无法被宿主映射、如 ctypes 报 Permission denied）"
    command: "python3 check_driver.py <bindir>/indi_talon6 <bindir> <resdir>/indi/indi_talon6.xml <libindi-pkg>/lib"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 4
