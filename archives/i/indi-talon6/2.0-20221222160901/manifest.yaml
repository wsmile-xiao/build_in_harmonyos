# 版本级 manifest — indi-talon6 2.0-20221222160901
version: "2.0-20221222160901"
software: "indi-talon6"
status: built
build_date: "2026-10-07"
build_system: cmake

source:
  url: "https://codeload.github.com/indilib/indi-3rdparty/tar.gz/945fbe12d13f3472643931e24e444a4ca69d4ed5"
  sha256: "6dee1f35741058690488257737af1ffdf20edccd0dcca1054e7906c9ba58d87a"
  note: >-
    indi-3rdparty 单体仓库（驱动位于 indi-talon6/ 子目录，CMakeLists 会 append
    "../cmake_modules"，故保留整棵树）。源码代次对齐到 commit 945fbe12…（v2.2.2 代，
    与制品仓 libindi 2.2.2.1 同代）；同快照兄弟驱动 indi-aok 2.0-20221222093242 用同一
    commit 与同一 sha256 构建通过。codeload 与 github.com/archive 字节一致（sha256 实测
    相同），用 codeload 直连 + 显式 filename（其 URL basename 无 .tar.gz 后缀）。

build:
  system: cmake
  dependencies:
    - "libindi/2.2.2.1"
    - "libnova/0.16"

patches_applied:
  - file: "patches/0001-indi-talon6-CMakeLists-link-indi-client.patch"
    description: "把 find_package(INDI REQUIRED) 改为 find_package(INDI COMPONENTS driver align client REQUIRED)：FindINDI 无组件参数时默认只取 driver+align，DT_NEEDED 里不会记录 libindiclient，而 libindidriver/libindiAlignmentDriver 从 libindiclient 引入的 tty_write_string 等符号会在 musl loader 解析时失败。仅改构建脚本，不改被编译源码（同快照兄弟驱动 indi-aok 的同类补丁）。"

upstream_tests:
  framework: none
  test_sources: 0
  test_command: ""
  run_in_build: false
  evidence: >-
    indi-talon6/CMakeLists.txt 无 enable_testing()/add_test()（仅
    add_executable(indi_talon6) + install），indi-3rdparty 全仓亦无该驱动的测试用例
    ——上游确无测试，故 build() 不跑上游套件
upstream_test_pass_rate: "N/A（上游无测试用例，如实披露）"
adapted_test_pass_rate: "test_package/check_driver.py **4 项校验：3 项通过 + 1 项平台 SKIP**（本地 conan create 实测，包创建成功）：①bin/indi_talon6 为 AArch64 ELF（72192 B）②share/indi/indi_talon6.xml 与 bin/ 交叉引用一致（driver name=Talon6）③DT_NEEDED 闭包完整（libindiclient.so.2 + libindidriver.so.2 + libindiAlignmentDriver.so.2，且三者都在 libindi 包内）④conanrun 下真跑驱动：**真实闭包/符号缺陷一律 FAIL**（未解析符号、未解析共享对象、被点名却不在任何依赖包内的库），仅**有证据**的宿主拒绝记 SKIP（输出含平台限制标记，或被点名的库存在却同样无法被宿主映射、如 ctypes 报 Permission denied）——`checks=4 fails=0 skips=1 RESULT: PASS`"

knowledge_gained:
  - "indi-3rdparty 单体仓驱动的适配范式可直接复用：① 源码 pin 到具体 commit（非 tag），且必须保留整棵树（子目录 CMakeLists 会 append ../cmake_modules）；② require libindi（用 INDI_ROOT 提示让仓内 FindINDI.cmake 命中预构建包）；③ 上游与 libnova 包都没有 Nova 的 finder/config，需在本包 generators 目录内生成私有 NovaConfig.cmake（路径全部取自 libnova cpp_info，R49 私有前缀）；④ libindi 以静态优先发布，Conan 不注入其 lib 目录，需在 package_info 里 display LD_LIBRARY_PATH 才能运行期加载 libindidriver/libindilx200/libindiclient"
