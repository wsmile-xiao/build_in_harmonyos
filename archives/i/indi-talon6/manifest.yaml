# 软件级 manifest — indi-talon6
# 遵循 ARCHIVE-SPEC v3.0

software: indi-talon6
display: "INDI Talon6 driver"
description: "INDI 驱动：Talon6 天文台滑动屋顶（Roll Off Roof）控制器（可执行 indi_talon6，INDI::Dome 派生）"
category: application
homepage: "https://github.com/indilib/indi-3rdparty"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "indi-3rdparty 单体仓驱动子目录适配范式（源码 pin 到 commit 且保留整棵树；build_script_folder 只构建本驱动子目录）"
    - "依赖仅 libindi/2.2.2.1 + libnova/0.16（均已合入制品仓，conan install 实测可解析）"
    - "仓内 FindINDI.cmake 通过 INDI_ROOT 命中预构建 libindi；本包 generators 内生成私有 NovaConfig.cmake（路径取自 libnova cpp_info，R49）"
    - "package_info 暴露 bin/share 并声明 LD_LIBRARY_PATH（libindi 静态优先发布，需显式注入其 lib 目录才能运行期加载）"
    - "上游无测试（CMakeLists 无 enable_testing/add_test）；消费者验证由 test_package/check_driver.py 的 4 项校验承担"
  common_dependencies:
    - "libindi/2.2.2.1"
    - "libnova/0.16"

versions:
  "2.0-20221222160901":
    status: built
    build_date: "2026-10-07"
    conan_ref: "indi-talon6/2.0-20221222160901"
