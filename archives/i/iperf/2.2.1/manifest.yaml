# 版本级 manifest.yaml — iperf 2.2.1
software: iperf
version: "2.2.1"
status: built
build_system: autotools
build_date: "2026-08-26"

source:
  url: "https://downloads.sourceforge.net/project/iperf2/iperf-2.2.1.tar.gz"
  sha256: "754ab0a7e28033dbea81308ef424bc7df4d6e2fe31b60cc536b61b51fefbd8fb"
  tar_format: tar.gz

build:
  system: autotools
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-include-headers.h.patch"
  - "0004-src-checksums.c.patch"

knowledge_gained:
  - "HarmonyOS mktemp -d with umask 077 creates directories that cannot be written to (HMDFS/SELinux limitation); config.status needs patching to use mkdir instead"
  - "OHOS has sockaddr_storage conflict between linux/socket.h and sys/socket.h"
  - "musl libc on OHOS uses uh_sum instead of check for udphdr member"

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: true
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: true
