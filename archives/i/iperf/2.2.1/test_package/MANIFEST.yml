# test_package/MANIFEST.yml
package: iperf/2.2.1
homepage: "https://sourceforge.net/projects/iperf2/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: t/t1_tcp.sh
    source: iperf-2.2.1/t/t1_tcp.sh
    description: "TCP bandwidth test"
    command: "./t/t1_tcp.sh"
  - file: t/t3_udp.sh
    source: iperf-2.2.1/t/t3_udp.sh
    description: "UDP bandwidth test"
    command: "./t/t3_udp.sh"

test_package_tests:
  - file: test.sh
    description: "Run iperf --version and verify output"
    command: "sh test.sh"

assertion_count: 1
