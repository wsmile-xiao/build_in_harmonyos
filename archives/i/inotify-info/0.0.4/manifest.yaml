software: inotify-info
version: "0.0.4"
build_system: makefile  # 上游手写 GNU Makefile，命令行变量覆盖，零 patch
status: built
build_date: "2026-09-25"

test_passed: 8
test_failed: 0

source:
  url: "https://codeload.github.com/mikesart/inotify-info/tar.gz/refs/tags/v0.0.4"
  sha256: "8a44de6a1750863520954770cfc416ae723ffeb3cc5044ec419fa5392a5d22d1"
  tag_commit: "74beab9cf32147bd6dea8017e0897c7dccd1e5a1"
  tar_format: tar.gz

build:
  system: makefile
  make_overrides: "INOTIFYINFO_VERSION=0.0.4 CC=<clang> CXX=<clang++> LIBS='-Wl,--no-as-needed -lm -ldl -lpthread -lc++'"
  configure_options: []  # 无 configure
  cc: clang

patches_applied: []  # 零 patch

upstream_tests:
  status: NO_UPSTREAM_TESTS
  conclusion: "上游无任何官方测试入口：Makefile 无 test/check target（仅 all/lint/clean/install/uninstall/release-tar），无 TESTS/check_PROGRAMS 声明，无 tests/ 目录、无 CMakeLists.txt/configure；.github/workflows/ci.yaml 仅 lint（clang-format）与 build-with-gcc/build-with-zig/build-with-docker 三个构建冒烟 job（构建后 --version + 裸跑），release.yaml 仅发布。上游冒烟形态已由 test_package run_smoke_tests.sh 8 项诚实断言 1:1 覆盖并加强（不断言 watch/instance 计数）。"

knowledge_gained:
  - "上游纯手写 GNU Makefile 且全部关键变量（CC/CXX/CFLAGS/CXXFLAGS/LDFLAGS/LIBS/INOTIFYINFO_VERSION）可命令行覆盖，交叉编译零 patch"
  - "tarball 无 .git → 上游版本串 git describe 兜底 unknown，必须显式传 INOTIFYINFO_VERSION；源码 #error 强制要求该宏"
  - "上游 LIBS 写死 -lstdc++；实测 OHOS SDK 26.0.0.18 clang 15.0.4 驱动会将其静默改写为 -lc++ -lc++abi -lunwind（不替换也能链接成功），按 profile compiler.libcxx=libc++ 显式选 -lc++ 仅为保链接行为可追溯"
  - "license 为 MIT（主程序）AND BSD-2-Clause（内置 lfqueue），两份 LICENSE 需分别随包归档"
  - "上游无任何 test/check 入口（workflows 仅 lint + 构建冒烟），冒烟等价断言落在 test_package：可执行文件可运行、--version 含版本号、裸跑退出 0 且含 /proc/sys/fs/inotify 限额数值"
