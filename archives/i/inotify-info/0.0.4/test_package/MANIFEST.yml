# test_package/MANIFEST.yml — 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
package: inotify-info/0.0.4
homepage: https://github.com/mikesart/inotify-info

# 上游无任何官方测试：Makefile 仅 all/lint/clean/install/uninstall/release-tar，
# 无 test/check target，无 TESTS/check_PROGRAMS；无 tests/ 目录；
# 无 CMakeLists.txt/configure。.github/workflows/ci.yaml 仅 lint（clang-format）
# 与 build-with-gcc/build-with-zig/build-with-docker 三个构建冒烟 job
#（构建后 --version + 裸跑），release.yaml 仅发布草稿。
# 按规范记录 NO_UPSTREAM_TESTS；上游冒烟形态由本 test_package 覆盖并加强。
upstream_check_command: ""
upstream_test_in_build: false

upstream_tests: []

test_package_tests:
  - file: run_smoke_tests.sh
    description: "上游 CI 冒烟等价断言 + 加强（8 项诚实断言）：可执行文件存在且可执行；--version 退出 0 且输出含 0.0.4；裸跑（无参数，对齐上游 build-with-gcc/zig/docker 冒烟形态）退出 0 且输出含 INotify Limits 与 /proc/sys/fs/inotify/{max_queued_events,max_user_instances,max_user_watches} 数值。不断言 watch/instance 计数（依赖环境状态）。"
    command: "sh run_smoke_tests.sh <packaged_inotify_info>"

# 8 项断言：binary-exists / --version rc / --version 内容 / 裸跑 rc /
# INotify Limits 标题 / 三项限额数值各 1
assertion_count: 8
