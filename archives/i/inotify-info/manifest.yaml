software: inotify-info
display: "inotify-info"
description: "inotify 限额/占用查看工具：汇总 /proc/sys/fs/inotify 限额，按进程统计 watch/instance 使用并反查被 watch 的文件路径（OHOS 移植版，零 patch）"
category: system
homepage: "https://github.com/mikesart/inotify-info"
license: "MIT AND BSD-2-Clause"
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游纯手写 GNU Makefile，关键变量全部可命令行覆盖 → OHOS clang 交叉编译零 patch"
    - "tarball 无 .git，版本串需显式传 INOTIFYINFO_VERSION=0.0.4（上游 git describe 兜底 unknown）"
    - "上游 LIBS 写死 -lstdc++；实测 OHOS SDK 26.0.0.18 clang 15.0.4 驱动会将其静默改写为 -lc++ -lc++abi -lunwind（不替换也能链接成功），按 profile compiler.libcxx=libc++ 显式选 -lc++ 仅为保链接行为可追溯"
    - "双许可：主程序 MIT + 内置 lfqueue BSD-2-Clause，两份 LICENSE 分别随包归档"
    - "上游无任何 test/check 入口（workflows 仅 lint + 构建冒烟），冒烟等价断言由 test_package 8 项诚实断言覆盖"
  common_dependencies: []

versions:
  "0.0.4":
    status: built
    build_date: "2026-09-25"
