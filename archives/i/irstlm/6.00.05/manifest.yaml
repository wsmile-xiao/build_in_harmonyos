# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "GitHub tag tarball 不含 autotools 生成文件（configure/config.guess/config.sub），build() 需先 autoreconf -fi 自举"
- "config.guess 无法识别 HarmonyOS，需显式传 --build/--host=aarch64-unknown-linux-ohos（config.sub 支持 *-linux-ohos）"
- "E114/HMDFS：生成的 configure 需去掉 umask 077，否则 config.status 临时目录 drwx--S--- 不可写"
- "install-exec-hook 在 prefix=/ 时创建 lib->lib64 软链会 Permission denied，需移除该 hook"
- "上游 configure.ac 把 -std=c++0x 注入 CPPFLAGS 导致 C 源（cmd.c/thpool.c）编译失败，需移到 CXXFLAGS"
- "make/ctest 需 -j1 规避 HMDFS jobserver fifo EPERM（E074）"
- "zlib 依赖：configure.ac 无条件 -lz（mfstream.cpp 使用 gzopen/gzread），配方必须声明 zlib/1.3.1"

