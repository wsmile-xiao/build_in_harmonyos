# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: irstlm/6.00.05
homepage: "https://github.com/irstlm-team/irstlm"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# irstlm 6.00.05 官方 tag 源码无独立测试用例（无 tests/ 目录、无 ctest 注册、
# Makefile.am 无 TESTS 目标；make check 为空操作），详见 notes.md 枚举台账。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过公开头文件 dictionary.h 调用 encode/decode/size 公开 API，验证第三方应用可编译、链接并运行 libirstlm"
    command: "./test_irstlm"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
