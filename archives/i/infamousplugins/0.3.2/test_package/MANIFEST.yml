# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: infamousplugins/0.3.2
homepage: "https://github.com/ssj71/infamousPlugins"

# 上游测试套件存在性（经审计源码 tar 包确认）
upstream_tests_exist: false

# 上游测试审计（源码: v0.3.2.tar.gz）
upstream_test_audit:
  source_tarball: "v0.3.2.tar.gz"
  source_sha256: "4c83e3d80e501ae72cb891fccf2cfe286fb506aaf6ce2c067a5b7a2dd272e4b4"
  source_url: "https://github.com/ssj71/infamousPlugins/archive/refs/tags/v0.3.2.tar.gz"
  top_level_files:
    - CMakeLists.txt      # 只有 option/set/foreach(add_subdirectory(src/<plug>))，无 enable_testing/add_test
    - README
    - CHANGELOG
    - COPYING
    - src/                # 15 个插件目录（默认构建 12 个）
    - test/               # 开发者草稿，未被任何构建文件引用
  scanned_for:
    - "enable_testing() / add_test() / include(CTest) / BUILD_TESTING"
    - "ctest 调用与 CTestTestfile"
    - "tests/ 或 test/ 目录是否被 add_subdirectory 接入"
    - "gtest / Catch2 / pytest 测试源"
  scan_result: >-
    0 matches —— 全部 CMakeLists.txt 均未启用测试；test/ 目录内是 octave 脚本
    (sine_seeker.c/wave_test.c/testmin.c/test.cxx 等独立源码) 与 .m 脚本，
    没有任何构建文件编译或运行它们
  make_test_output: "make test => make: *** No rule to make target 'test'.  Stop."
  ctest_output: "ctest => No test configuration file found!"
  reason: >-
    infamousPlugins 0.3.2 无上游自动化测试套件：无 enable_testing()/add_test()，
    make test 无规则，ctest 无测试配置；test/ 目录为开发者草稿，不构成测试入口

# 上游测试命令（无测试套件，故不适用）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带测试（消费者视角 + 鸿蒙特有验证）
test_package_tests:
  - file: test_lv2_plugins.c
    description: >-
      逐个 dlopen 已安装的 LV2 bundle，遍历 lv2_descriptor()，按 bundle 自带
      .ttl 的端口表连接全部端口（音频输入喂 440Hz 正弦、控制端口取 lv2:default），
      执行 instantiate/connect/activate/run/deactivate/cleanup 并断言音频输出有限
    command: "./test_lv2_plugins <bundle_root>"
  - file: ohos_specific_test.c
    description: >-
      鸿蒙特有测试：AArch64 LP64 与内核 machine 校验、每个插件的 ELF64/EM_AARCH64/
      ET_DYN 身份、从 Conan 包内 dlopen(RTLD_NOW)、/proc/self/maps 来源校验、
      Conan 共享依赖链 libzita-resampler 映射、二进制内无 /usr/local 路径、bundle 布局
    command: "./ohos_specific_test <bundle_root>"

# 测试断言总数（实测：test_lv2_plugins 79 + ohos_specific_test 128 = 207）
assertion_count: 207
