# 版本级 manifest — infamousplugins 0.3.2
# 文件位置: archives/i/infamousplugins/0.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.3.2"
software: "infamousplugins"

# published | built | failed | archived
# conan-verify 8 道门禁全通过（G0-G4 + L2/L4/L5）
status: published

build_date: "2026-09-24"
build_system: "cmake"

source:
  url: "https://github.com/ssj71/infamousPlugins/archive/refs/tags/v0.3.2.tar.gz"
  sha256: "4c83e3d80e501ae72cb891fccf2cfe286fb506aaf6ce2c067a5b7a2dd272e4b4"
  tar_format: tar.gz

build:
  system: cmake
  # recipe generate()/build() 实际生效的配置
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"   # upstream cmake_minimum_required(VERSION 2.8) vs CMake 4
    - "-DCMAKE_SYSTEM_NAME=Linux"             # CMake 无 OHOS 平台名（R32：os in (Linux, OHOS)）
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
  dependencies:
    - "lv2/1.18.11-git"           # header-only：LV2 core + extensions 头
    - "fftw3f/3.3.10"             # ewham / lushlife DSP
    - "libzita-resampler/1.11.2"  # ewham / lushlife DSP
  cc: clang
  cxx: clang++

patches_applied: []

# 上游测试清点（R51）
upstream_tests:
  exist: false
  discovered: 0
  executed: 0
  passed: 0
  failed: 0
  skipped: 0
  command: "make test"
  evidence: "make test => No rule to make target 'test'；ctest => No test configuration file found!；全仓无 enable_testing()/add_test()"
  detail: "test/ 目录仅为开发者草稿（octave .m 脚本 + 独立 .c/.cxx 源码），无任何构建文件编译或运行"

# 本次新增测试（test_package）
test_package_tests:
  - file: "test_lv2_plugins.c"
    discovered: 79
    passed: 79
    failed: 0
  - file: "ohos_specific_test.c"     # 鸿蒙特有测试
    discovered: 128
    passed: 128
    failed: 0

knowledge_gained:
  - "upstream 0.3.2 使用 2012 年以前的 LV2 头路径（<lv2.h> 与 lv2/lv2plug.in/ns/ext/...），LV2 1.18 只装 include/lv2/<spec>/*.h —— 用 build_folder 下的私有兼容头目录 + -I 解决，不改上游 23 个源文件（同 archives/a/artyfx、archives/b/boops 的 LV2 兼容范式）"
  - "upstream 以裸名链接 -lzita-resampler 且 include <zita-resampler/resampler.h>，Conan 依赖不在默认搜索路径 —— 由 recipe 注入依赖的 includedirs/libdirs（R49 私有注入范式），无需改上游 CMakeLists"
  - "LV2 端口块是多元素列表 `lv2:port [ a ], [ b ] ;`，且单个端口元素内可嵌套 lv2:scalePoints [ ... ] —— 解析 bundle .ttl 端口表时需按括号深度匹配元素边界"
  - "LV2 的 activate/deactivate 是可选回调，casynth 未实现（描述符中为 NULL），宿主必须判空后再调用"
  - "上游 bin/infamous-rule 主循环不返回（忽略 --version/--help 且一直输出），会永久挂住平台 smoke test（conan-verify L2 / CI L2），故不打包该可执行文件"
  - "cmake_minimum_required(VERSION 2.8) 在 CMake >= 4 直接报错，CMAKE_POLICY_VERSION_MINIMUM 必须走命令行 -D（工具链文件在 project() 之后才生效）"
