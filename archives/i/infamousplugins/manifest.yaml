# 软件级 manifest
# 文件位置: archives/i/infamousplugins/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: "infamousplugins"
display: "infamousPlugins"
description: "LV2 audio plug-in collection (12 DSP plug-ins: casynth, ewham, lushlife, hip2b, stuck, ...)"
category: audio
homepage: "https://github.com/ssj71/infamousPlugins"
license: "GPL-2.0-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "LV2 1.18 头布局与上游旧 URI 路径不兼容 → recipe generate() 生成 build_folder 私有兼容头目录 + -I"
    - "zita-resampler / fftw3f 通过 Conan 依赖注入 include/lib 搜索路径（不改上游 CMakeLists）"
    - "GUI 插件依赖 cairo + ntk（OHOS 无）→ 由上游自带 CAIRO_FOUND AND NTK_FOUND 守卫跳过，DSP 插件不受影响"
    - "bin/infamous-rule 主循环不返回，会挂死平台 smoke test → 不打包该可执行文件"
    - "cmake_minimum_required(VERSION 2.8) → 命令行 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"

versions:
  "0.3.2":
    status: published
    build_date: "2026-09-24"
    build_system: cmake
