    - meson/1.11.0
    - pkgconf/3.0.6
    - gettext/0.22.5.1
  cc: clang
patches_applied:
  - "0001-optional-man-and-nls.patch"
  - "0002-bind-iso-codes-localedir.patch"
patch_classification:
  - file: 0001-optional-man-and-nls.patch
    type: portability
    platform_only: false
    guard: "meson feature option man/nls"
  - file: 0002-bind-iso-codes-localedir.patch
    type: portability
    platform_only: false
    guard: "ISOQUERY_LIBINTL or libintl.so, and ISOQUERY_ISO_CODES_LOCALEDIR"
