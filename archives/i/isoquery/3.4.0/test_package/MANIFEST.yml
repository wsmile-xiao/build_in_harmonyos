# 上游测试来自 meson.build 注册的两个 TAP 套件。
# options: tests/options.c 里 16 个 g_test_add_func。
# integration: tests/integration.c 按 tests/expected/*/*_test_commandline.txt
# 每个文件注册 1 个 g_test_add_data_func，共 39 个。
package: isoquery/3.4.0
homepage: https://codeberg.org/toddy/isoquery

upstream_check_command: "meson test -C build --print-errorlogs --no-rebuild -v"
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs --no-rebuild -v"

upstream_tests:
  - file: tests/options.c
    source: isoquery 3.4.0 tests/options.c
    description: "命令行选项解析，16 个 g_test_add_func"
    command: "meson test options --print-errorlogs --no-rebuild -v"
  - file: tests/integration.c
    source: isoquery 3.4.0 tests/integration.c
    description: "用 tests/data 的 JSON 和 expected/* 命令行跑打包前的 isoquery，39 个用例"
    command: "meson test integration --print-errorlogs --no-rebuild -v"

test_package_tests:
  - file: test_isoquery.sh
    description: "对安装后的 isoquery 做版本、帮助、夹具查询、UTF-8、NUL 分隔、缺数据、非法标准检查"
    command: "bash test_isoquery.sh <isoquery> <fixture> <iso-codes-json>"

assertion_count: 12
