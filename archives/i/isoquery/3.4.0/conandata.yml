patches:
  "3.4.0":
    - patch_file: "patches/0001-optional-man-and-nls.patch"
      patch_description: "Make man pages and message catalogs optional when asciidoctor, po4a, or msgfmt is absent"
      patch_type: "portability"
    - patch_file: "patches/0002-bind-iso-codes-localedir.patch"
      patch_description: "Bind iso-codes domains through GNU libintl, with a UTF-8 locale fallback when setlocale fails"
      patch_type: "portability"
