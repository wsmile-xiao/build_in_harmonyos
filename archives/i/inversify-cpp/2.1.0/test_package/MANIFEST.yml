# test_package/MANIFEST.yml
# 消费者测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: inversify-cpp/2.1.0
homepage: "https://github.com/mosure/inversify-cpp"

# 上游测试命令（上游唯一构建面是 Bazel BUILD 的 cc_binary("test")，设备与 CI worker 均无 bazel；
# 配方 build() 按上游 BUILD 参数等价直编后直跑测试可执行）
upstream_check_command: "配方 build(): clang++ -std=c++17 -DINVERSIFY_BINDING_INSPECTION -I include -I third_party -I test test/*.cpp -o <build>/inversify-cpp-upstream-test && <build>/inversify-cpp-upstream-test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "配方 build() 直编直跑（G2/W3 每轮真跑，日志汇总行 `All tests passed (25 assertions in 5 test cases)`）"

# 上游实际运行的测试程序（上游唯一测试面：test/*.cpp 共 6 个 TU，Catch2 v2 单头 vendored 于 third_party/catch2/catch.hpp）
upstream_tests:
  - file: test/auto_resolve.cpp
    source: inversify-cpp-2.1.0/test/auto_resolve.cpp
    description: "Catch2 SCENARIO ×1：自动注入（unique_ptr / shared_ptr singleton / 嵌套注入）"
    command: "<build>/inversify-cpp-upstream-test（与其余 5 个 TU 同二进制）"
  - file: test/constant_resolve.cpp
    source: inversify-cpp-2.1.0/test/constant_resolve.cpp
    description: "Catch2 SCENARIO ×1：常量值绑定"
    command: "同上"
  - file: test/dynamic_resolve.cpp
    source: inversify-cpp-2.1.0/test/dynamic_resolve.cpp
    description: "Catch2 SCENARIO ×1：动态值/工厂绑定（GIVEN/WHEN/THEN 段驱动）"
    command: "同上"
  - file: test/inspection.cpp
    source: inversify-cpp-2.1.0/test/inspection.cpp
    description: "Catch2 SCENARIO ×1：绑定检视元数据（需 INVERSIFY_BINDING_INSPECTION）"
    command: "同上"
  - file: test/speed.cpp
    source: inversify-cpp-2.1.0/test/speed.cpp
    description: "Catch2 SCENARIO ×1：性能断言（BENCHMARK ×2 落在该用例内，不单列为用例）"
    command: "同上"
  - file: test/main.cpp
    source: inversify-cpp-2.1.0/test/main.cpp
    description: "Catch2 入口（CATCH_CONFIG_MAIN + CATCH_CONFIG_ENABLE_BENCHMARKING），非用例"
    command: "同上（链接入同一二进制）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_inversify_cpp.cpp
    description: "消费者测试：常量/动态/重绑定、自动注入构造参数、unique 与 singleton 作用域、工厂绑定、嵌套注入链、未绑定符号 ResolutionException、同型符号区分、绑定检视、容器隔离；23 条运行期 check 逐条打印读数，另有 2 条编译期 static_assert（单列不混口径）"
    command: "./test_inversify_cpp"

# 测试计数口径（N=候选数法最大；单位不混用）
# 口径①源码宏 SCENARIO=5；口径②框架注册 --list-tests=5 ⇒ N（用例数）=5（单位=用例）
# 口径③断言=25（单位=断言，上游自报 `25 assertions in 5 test cases`）
# 口径④消费者断言=23（test_package，不进上游分母）
# assertion_count 按字段语义填「断言数」= 25；用例数 N=5 见上行口径①②
assertion_count: 25
