software: imx-code-signing-tool
display: "imx-code-signing-tool"
description: "NXP Code Signing Tool (CST) for HABv4/AHAB secure boot image signing on i.MX SoCs"
category: system
homepage: "https://www.nxp.com/webapp/sps/download/license.jsp?colCode=IMX_CST_TOOL_NEW"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "顶层 CMake 在 OHOS 上需显式 OSTYPE=linux64（CMAKE_SYSTEM_NAME 非 Linux 时 OSTYPE 检测失败）"
    - "依赖 OpenSSL 3.x：通过在 generate() 中先重映射 openssl 配方组件为 OpenSSL::Crypto/SSL 再生成 CMakeDeps"
    - "ahab_signed_message 静态链接 json-c，需设置 json_c_DIR 指向 json-c 包根目录"
    - "OHOS libc 头文件 + clang -Werror 下需 3 个源码补丁（NULL 重定义、两处 -Wpointer-sign）"
  common_dependencies:
    - openssl
    - json-c

versions:
  "4.0.1":
    status: built
    build_date: "2026-09-21"
    conan_ref: "imx-code-signing-tool/4.0.1"