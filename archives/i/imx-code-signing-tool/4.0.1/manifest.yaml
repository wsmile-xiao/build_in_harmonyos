software: imx-code-signing-tool
version: "4.0.1"
upstream_version: "4.0.1"
status: built
build_date: "2026-09-21"
compile_date: "2026-09-21"
build_system: cmake
test_passed: 3
test_failed: 0

source:
  url: "https://deb.debian.org/debian/pool/main/i/imx-code-signing-tool/imx-code-signing-tool_4.0.1+dfsg.orig.tar.xz"
  tag: "4.0.1"
  sha256: "fd92a1a9faa10fb81bbf752c7ee1e257f17e1ec4c2964f8a47adf8a3eaa7df41"
  tar_format: tar.xz

build:
  system: cmake
  source_subdirectory: src
  configure_options:
    - "-DOSTYPE=linux64"
    - "-DCST_WITH_PKCS11=OFF"
    - "-DCST_WITH_PQC=OFF"
  dependencies:
    - openssl/3.5.6
    - json-c/0.18
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-remove-null-redefinition-convlb.patch"
  - "0002-fix-pointer-sign-types-csf-cmd-ins-key.patch"
  - "0003-fix-pointer-sign-tag-ahab-image-verifier.patch"
knowledge_gained:
  - "CST 4.0.1 顶层 CMake 在 OHOS 上需要显式 OSTYPE=linux64（CMAKE_SYSTEM_NAME 非 Linux 时 OSTYPE 检测失败）"
  - "CST 强依赖 find_package(OpenSSL) 的 OpenSSL::Crypto/OpenSSL::SSL 组件；ohpcd openssl 配方只声明 openssl::openssl，需在 generate() 中先重映射组件再跑 CMakeDeps"
  - "CST 在 -Werror 下对 OHOS 头文件暴露多处指针符号不匹配（NULL 重定义、int8_t*/uint8_t*、char* 赋给 uint8_t*）"
