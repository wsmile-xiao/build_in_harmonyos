# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: irqbalance/1.9.4
homepage: "https://github.com/Irqbalance/irqbalance"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（irqbalance 1.9.4 仅含 1 个独立上游用例）
upstream_tests:
  - file: tests/runoneshot.sh
    source: irqbalance-1.9.4/tests/runoneshot.sh
    description: "oneshot 运行模式冒烟测试：exec irqbalance --debug --oneshot --foreground，验证守护进程可正常启动运行"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "执行安装后的 irqbalance 二进制 --version，核验输出含 'irqbalance version 1.9.4'（上游 --version 退出码为 1 属上游语义，按输出判定）"
    command: "sh test.sh <installed-irqbalance>"
