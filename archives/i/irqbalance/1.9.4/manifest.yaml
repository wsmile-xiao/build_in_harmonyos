    purpose: "OHOS libc 无遗留 rindex 符号，改用标准 strrchr"

knowledge_gained:
  - "GitHub tag 的 archive tarball 不含 configure，autotools 项目需 autoreconf 自举"
  - "config.guess/config.sub 需注入 HarmonyOS 识别与 linux-ohos triplet 才能 configure（E007）"
  - "HarmonyOS 上 configure umask 077 会导致 config.status 临时目录不可写，需 umask 022 + TMPDIR 绝对路径（E136）"
  - "pkg.m4 必须进入 aclocal 搜索路径，否则 PKG_CHECK_MODULES 残留字面量导致 configure 语法错误"
  - "OHOS libc 移除遗留 index/rindex 符号，需替换为标准 strchr/strrchr"
