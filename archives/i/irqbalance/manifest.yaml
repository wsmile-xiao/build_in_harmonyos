# 软件级 manifest — irqbalance
# 遵循 ARCHIVE-SPEC v2.0

software: irqbalance
display: "irqbalance"
description: "irqbalance — 将硬件中断（IRQ）在多个处理器间均衡分配的守护进程及 ui 工具"
category: system
homepage: "https://github.com/Irqbalance/irqbalance"
license: GPL-2.0-only
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "GitHub tag 的 archive tarball 不含 configure，autotools 项目需 autoreconf 自举（tool_requires automake/libtool/pkgconf）"
    - "config.guess/config.sub 需注入 HarmonyOS 识别与 linux-ohos triplet 才能 configure（E007）"
    - "HarmonyOS 上 configure umask 077 会导致 config.status 临时目录不可写，需 umask 022 + TMPDIR 绝对路径（E136）"
    - "OHOS libc 移除遗留 index/rindex 符号，需替换为 strchr/strrchr"
    - "ui 组件依赖 ncursesw，AM_CFLAGS 需含 $(NCURSESW_CFLAGS)"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.9.4":
    status: built
    build_date: "2026-09-18"