# 版本级 manifest
# 文件位置: archives/i/iowow/1.4.18/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.18"

# 软件名
software: "iowow"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-09"
build_system: "CMake（顶层 CMakeLists.txt，cmake_minimum_required 3.12）"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub tag v1.4.18；plain 1.4.18 tag 返回 404）
  url: "https://github.com/Softmotions/iowow/archive/refs/tags/v1.4.18.tar.gz"

  # 源码校验和
  sha256: "ef4ee56dd77ce326fff25b6f41e7d78303322cca3f11cf5683ce9abfda34faf9"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_SYSTEM_NAME=HarmonyOS"
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DBUILD_TESTS=OFF"
  - "-DBUILD_EXAMPLES=OFF"
  - "-DBUILD_BENCHMARKS=OFF"
  - "-DCMAKE_C_FLAGS=-ffile-prefix-map=<src>=/iowow-src"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 上游 CUnit 测试（cunit/2.1.3，ohpcd 制品仓）仅在适配验证期单独运行，
  # 未固化进 CI 配方 build()（沿 1.5.2 先例 upstream_test_in_build: false）

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 平台探针（qsort_r / clock_gettime / pthread / stdatomic 等）全走 CMake
# capability detection，OHOS musl 下无需任何源码补丁、无平台条件编译。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "iowow 1.4.18 CMake 构建 OHOS 适配：BUILD_SHARED_LIBS=OFF 产出 libiowow-1.a（OUTPUT_NAME iowow-${VERSION_MAJOR}），.pc 文件 -liowow 为上游笔误需以实际产物 -liowow-1 为准"
- "iowow 游标语义（1.4.x 块链实现）：AFTER_LAST+PREV 为升序遍历、BEFORE_FIRST+NEXT 实际为降序，与 1.5.x 相反；写遍历断言须以 iwkv_test1.c 上游期望为准"
- "__FILE__ 日志宏泄漏 conan 缓存绝对路径进 rodata：用 -ffile-prefix-map=<src>=/iowow-src 映射为干净相对路径（构建卫生，非平台条件）"
- "OHOS musl 无 glibc 风格 qsort_r：CMake TestQsortR try_compile 探针自动回退库自带 sort_r.h，无需补丁（1.5.2 Autark 探针同结论）"
