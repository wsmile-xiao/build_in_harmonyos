# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: iowow/1.4.18
homepage: "https://github.com/Softmotions/iowow"

# 上游测试命令：iowow 1.4.18 使用 CMake 构建系统（区别于 1.5.x 的 Autark），
# BUILD_TESTS=ON 启用 CUnit 测试目标（FindCUnit 探测 cunit），ctest 逐执行器运行。
upstream_check_command: "cmake -B build -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4 && ctest --test-dir build --output-on-failure"

# conanfile.py build() 中是否已集成上游测试
# 说明：上游测试依赖 cunit（FindCUnit 探测），仅在适配验证期单独构建运行并留痕，
# 未固化进 CI 配方（避免 conan create 引入 cunit 构建依赖）；沿 1.5.2 先例
# upstream_test_in_build: false，测试清单与结果见 reports/test-report.md。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（CUnit 独立可执行用例，原生 OHOS aarch64 构建后逐个执行，
# 23 个执行器全部 exit=0，结果详见 reports/test-report.md）
upstream_tests:
