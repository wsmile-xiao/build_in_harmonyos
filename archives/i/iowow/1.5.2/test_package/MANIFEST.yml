# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: iowow/1.5.2
homepage: "https://github.com/Softmotions/iowow"

# 上游测试命令：iowow 使用 Autark 构建系统，测试通过构建期
# IOWOW_RUN_TESTS=1 触发（等价 make check）。无 ctest/meson 注册。
upstream_check_command: "BUILD_TYPE=Release IOWOW_RUN_TESTS=1 ./build.sh -J4"

# conanfile.py build() 中是否已集成上游测试
# 说明：上游测试依赖 cunit（pkg-config 探测），仅在适配验证期通过
# IOWOW_RUN_TESTS=1 单独运行并留痕，未固化进 CI 配方（避免 CI 额外
# 引入 cunit 构建依赖）；测试清单与结果见 reports/test-report.md。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（CUnit 注册的独立可执行用例，详见台账）
upstream_tests:
  - file: src/utils/tests/iwutils_test1.c
    source: iowow-1.5.2/src/utils/tests/iwutils_test1.c
    description: "utils 工具函数测试（CUnit suite iwutils_test1，5 个 TEST_CASE）"
    command: "BUILD_TYPE=Release IOWOW_RUN_TESTS=1 ./build.sh -J4"
