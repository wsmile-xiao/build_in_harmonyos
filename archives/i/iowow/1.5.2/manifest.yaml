# 版本级 manifest
# 文件位置: archives/i/iowow/1.5.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.2"

# 软件名
software: "iowow"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "Autark（build.sh 包装器）"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Softmotions/iowow/archive/refs/tags/v1.5.2.tar.gz"

  # 源码校验和
  sha256: "24b91edcc69a48a752b2a1892a0b935e980afb8a04eb659c699e77d29253ab61"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "Autark（build.sh 包装器）构建系统 OHOS 适配：直接调 ./build.sh --prefix=<stage> -J1（-J 并行而非 -j），PATH 前置 /bin（install 工具），package() 兼容 lib64/lib 安装目录"
- "OHOS musl libc 无 glibc 风格 qsort_r：Autark test_qsort_r.sh 探针预期失败并回退库自带 sort_r.h，探针失败不是构建失败信号（similar_to E531，免补丁）"
- "上游测试 IOWOW_RUN_TESTS=1 需 cunit pkg-config（cunit/2.1.3 已发布 ohpcd，conan install 后导出 PKG_CONFIG_PATH）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
