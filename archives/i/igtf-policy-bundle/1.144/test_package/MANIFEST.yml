# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# igtf-policy-bundle 是纯数据包（CA 证书捆绑包），上游没有自动化测试。
# test_package 包含鸿蒙特有测试（OpenSSL x509 解析验证）和消费者测试。

package: igtf-policy-bundle/1.144
homepage: "https://dist.igtf.net/distribution/igtf/"

# 上游没有自动化测试（纯数据包，configure 仅用于系统安装）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序（纯数据包）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_verify.py
    description: "鸿蒙特有测试：OpenSSL x509 解析验证 + 消费者测试：PEM 格式、文件计数、元数据存在性"
    command: "python3 test_verify.py <package_root>"

# 测试断言总数（含 84 个证书 × openssl x509 验证 + 消费者断言）
assertion_count: 89