software: icon
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/9.5.25a/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.5.25a"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-20"

# 构建系统
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/gtownsend/icon/archive/refs/tags/v9.5.25a.tar.gz"

  # 源码校验和
  sha256: "ab15b7fc5a96e8b4da1b76cc6c7935400879f8a54b0fcf94a947c02815f21006"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-linux-Makedefs.patch"
  - "0002-config-linux-define.h.patch"
  - "0003-ipl-cfuncs-fpoll.c.patch"
  - "0004-ipl-cfuncs-mklib.sh.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Icon uses its own build system (make Configure name=linux), not standard autotools"
  - "Makedefs source template needs CC=clang and CFLAGS=-fPIC -O2 -D_MUSL for OpenHarmony"
  - "fpoll.c needs __freadahead declaration for musl libc on OpenHarmony"
  - "mklib.sh needs HarmonyOS pattern for shared library creation"
  - "define.h source template needs _MUSL define for musl libc compatibility"
  - "Patches target source templates (config/linux/*), not generated files (R6 compliance)"
  - "ELF signing required between Icont and Ilib builds on HarmonyOS"

patch_classification:
  - file: 0001-config-linux-Makedefs.patch
    type: manual
    platform_only: true
    guard: none
  - file: 0002-config-linux-define.h.patch
    type: manual
    platform_only: true
    guard: none
  - file: 0003-ipl-cfuncs-fpoll.c.patch
    type: manual
    platform_only: true
    guard: "#if defined(_MUSL)"
  - file: 0004-ipl-cfuncs-mklib.sh.patch
    type: manual
    platform_only: true
    guard: "HarmonyOS*)"
