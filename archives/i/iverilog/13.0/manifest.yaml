# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "13.0"
software: iverilog
# published | built | failed | archived
status: built
build_system: autotools
build_date: "2026-09-16"

source:
  url: "https://github.com/steveicarus/iverilog/archive/refs/tags/v13_0.tar.gz"
  sha256: "c897bbfa9848688982c6d5c30529fc29d68df0b9ff22ffa73bad89db73a7ce49"
  tar_format: tar.gz

build:
  system: autotools
  # 由 conanfile.py 的 AutotoolsToolchain 生成：--prefix=/ + DESTDIR；configure 期追加 LIBS=；
  # build/check/install 传静态链接顺序（默认 with_zlib/with_bz2=False 时为
  # -lreadline -lhistory -lformw -lmenuw -lpanelw -lncursesw -lpthread）
  configure_options: []
  dependencies:
    - readline/8.3
    - bison/3.8.2
    - flex/2.6.4
    - gperf/3.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "iverilog 的 AX_PROG_CC_FOR_BUILD 检查会用全局 LIBS 链接本机 gcc；conan 注入的目标库（aarch64）使其失败 → configure 传 LIBS= 绕过（CPPFLAGS/LDFLAGS 保留）"
  - "注册表 readline/ncurses 仅静态（ncurses 配方禁止 shared）：vvp 最终链接需显式按 -lreadline -lhistory ... -lncursesw 顺序，configure 的 -lreadline 探测无法解析 ncurses 符号"
  - "iverilog 编译期把模块路径写死为 $(prefix)/lib/ivl；conan --prefix=/ + DESTDIR 安装后运行需 -B <pkg>/lib/ivl（test_package 已显式传入）"
  - "bison/flex/gperf 是强制生成工具：CI 原生（OHOS aarch64）用注册表二进制（tool_requires），交叉构建改用宿主工具（PATH）"
  - "OHOS worker 的 config.guess 在沙箱 tmp 编译 dummy.c 被 Permission denied → configure cannot guess build type；须显式 --build/--host（CI 原生 aarch64-linux-ohos 两者相同）"
  - "E114：config.status 用 AS_TMPDIR 在 build 目录建 ./confXXXXXX，HarmonyOS 安全框架拦子进程写该目录（subs1.awk: Permission denied）→ 预建可写目录 + TMPDIR + 把 configure 的 ac_tmp 改指该目录"
  - "Conan Autotools.make 把参数空格 join 后经 shell 执行，含空格的 LIBS= 会在 sub-make 里被拆开 → 须转义空格（system.vpi 否则只拿到 -lreadline）"
  - "注册表 zlib/bzip2 仅静态且 zlib 非 PIC，无法链进共享 VPI 模块（z_errmsg recompile with -fPIC）→ 默认关闭 with_zlib/with_bz2"
  - "iverilog 上游 make check 只是 examples/hello.vl 冒烟；真正回归在仓内 ivtest/（主驱动 vvp_reg.py）"
