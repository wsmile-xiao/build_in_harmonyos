# test_package/MANIFEST.yml — iverilog/13.0 上游测试声明
package: iverilog/13.0
homepage: "https://steveicarus.github.io/iverilog/"

# 上游测试命令（make -n check 分析）
upstream_check_command: "make check"

# build() 是否集成上游测试（can_run 时执行 make check）
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际测试程序
upstream_tests:
  - file: Makefile.in
    source: iverilog-13_0/Makefile.in
    description: "make check：driver/iverilog 编译 examples/hello.vl，vvp 运行后 grep 'Hello, World'（上游冒烟测试）"
    command: "make check"
  - file: ivtest/vvp_reg.py
    source: iverilog-13_0/ivtest/vvp_reg.py
    description: "ivtest 回归套件主驱动（ivtest/ 顶层 37 个条目，含 gold/ 与 perl-lib/）；官方入口为 python3 vvp_reg.py，另有 csh 脚本 regress（调用 perl vvp_reg.pl）与 blif_reg.py；交叉构建不可运行"
    command: "python3 vvp_reg.py"

# test_package 自带消费者测试
test_package_tests:
  - file: test.sh
    description: "端到端：iverilog 编译 hello.v（含常量/位宽），vvp 运行并断言输出 IVERILOG_OK 165"
    command: "sh test.sh <package_folder>"

# 断言总数（近似）
assertion_count: 3
