# 软件级 manifest — iverilog
# 遵循 ARCHIVE-SPEC v3.0

software: iverilog
display: "Icarus Verilog"
description: "Verilog HDL 编译与仿真工具（iverilog 编译器 + vvp 仿真运行时）"
category: eda
homepage: "https://steveicarus.github.io/iverilog/"
license: "GPL-2.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "源码不含预生成 parser/lexer/keyword 表，bison/flex/gperf 为强制生成工具"
    - "AX_PROG_CC_FOR_BUILD 检查使用全局 LIBS 链接本机 gcc；conan 目标库注入会使其失败 → configure 传 LIBS="
    - "注册表 readline/ncurses 仅静态：最终链接需显式 -lreadline -lhistory ... -lncursesw 顺序"
    - "conan --prefix=/ + DESTDIR 安装 → 运行期模块路径需 -B <pkg>/lib/ivl"
    - "上游 make check 仅为 examples/hello.vl 冒烟；真回归在仓内 ivtest/（主驱动 vvp_reg.py）"
  common_dependencies:
    - bison
    - flex
    - gperf
    - readline
    - zlib
    - bzip2

versions:
  "13.0":
    status: built
    build_date: "2026-09-16"
