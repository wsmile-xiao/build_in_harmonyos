# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ips4o/0.0-git22069381cc
homepage: "https://github.com/vgteam/ips4o"

# 上游无构建系统（commit 22069381cc 仅含头文件，无 CMake/Makefile），
# 不存在 make check / ctest -N / meson test --list 可分析入口。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：本 commit 无任何测试目录/测试文件
# （枚举证据见 notes.md：tarball 全量文件清单 22 个，全部为头文件与文档）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：include <ips4o.hpp> 调用 ips4o::sort，与 std::sort 结果比对"
    command: "./test_ips4o"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1