# 编译中学到的知识
knowledge_gained:
  - "header-only 无构建系统库：conan-init 会误判为 autotools，需按 header-only 模板重写配方（package_type=header-library，无 build() 编译阶段，package() 仅安装头文件）"
  - "OHOS clang 链接消费者程序需显式 -stdlib=libc++ -lc++ -lc++abi 与 SDK llvm/lib 搜索路径，否则 undefined std::logic_error 等 libc++ 运行时符号"
  - "ips4o 并行排序 API 需要 OpenMP（thread_pool.hpp 无条件包含 <omp.h>）；顺序排序无额外要求"
