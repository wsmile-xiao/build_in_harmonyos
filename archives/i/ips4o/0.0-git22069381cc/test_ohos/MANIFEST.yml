# test_ohos/MANIFEST.yml
# 鸿蒙 PC 专项测试声明（与上游测试、test_package 消费者用例分别计数）

package: ips4o/0.0-git22069381cc

# 运行方式
command: "python3 run_ohos_test.py <conan_package_folder>"
# 目标平台
platform: "HarmonyOS PC (aarch64, clang 15, OpenMP)"

# 专项检查项
checks:
  - id: T1
    description: "消费者可执行文件为 ELF64 AArch64"
  - id: T2
    description: "ips4o::parallel::sort 并行排序 4M 随机 uint64，与 std::sort 逐元素比对"
  - id: T3
    description: "ips4o::sort 顺序排序 + 降序自定义比较器，与 std::sort 参考比对"
  - id: T4
    description: "可执行文件无宿主绝对路径泄漏（RPATH/RUNPATH/字符串）"

# 上游测试、消费者用例、鸿蒙专项测试分别计数，本目录仅计鸿蒙专项。
assertion_count: 3