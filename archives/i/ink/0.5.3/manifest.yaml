knowledge_gained:
  - "GNU config 2018-02 vintage 对内置补丁脚本部分免疫：patch-autotools-ohos.pl 依赖的 __ANDROID__/LIBC=android、android-linux 锚点在该版不存在（Score 1/5），config.guess 打完仍 unable to guess；需按 libinklevel 同款手补（HarmonyOS uname case + linux-ohos 两处白名单）(ref: E007)"
  - "application 包被 AC_CHECK_HEADERS/AC_CHECK_LIB（非 pkg-config）探测时，AutotoolsDeps 注入的 -I/-L/-l 经 conanbuild 环境即可被 configure 拾取，无需手写 CPPFLAGS/LDFLAGS (ref: E075)"
  - "HMDFS 上 mktemp -d 行为随固件/路径变化：2026-09-27 探针在 ~/tmp 下可用，但 E490 历史证据仍在，mktemp→固定目录名补丁作为同源防御保留 (ref: E490)"
  - "OHOS 上 /tmp 只读（E002）：探针脚本重定向临时文件必须用 $TMPDIR/$HOME/tmp，用 /tmp 会把探针本身污染成 rc=1"

