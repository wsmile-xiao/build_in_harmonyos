# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 上游测试三步法）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ink/0.5.3
homepage: "https://ink.sourceforge.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -n check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# R51 清点证据：上游 0.5.3 源码包无测试套件——
#   * Makefile.am 仅声明 bin_PROGRAMS=ink 与 dist_man1_MANS=ink.1，无 check
#     目标、无 TESTS 变量；
#   * 源码树仅 ink.c(257 行)/malloc.c(17 行) 两个源文件，无 tests/ 目录；
#   * `make -n check` 输出 "No rule to make target 'check'"（见 notes.md）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.sh
    description: "ink -v 冒烟：输出 PACKAGE_STRING 并调用 libinklevel get_version_string()（验证二进制可执行 + libinklevel 动态链接），RC=0"
    command: "ink -v"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
