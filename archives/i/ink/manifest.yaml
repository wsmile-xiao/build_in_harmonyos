# 软件级 manifest — archives/i/ink/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: ink
display: "ink"
description: "查询喷墨打印机墨水余量的命令行工具（libinklevel 前端，USB/BJNP）"
category: utility
homepage: "https://ink.sourceforge.io/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 2018-02 vintage 的 config.guess/config.sub 不识 OHOS：configure 第一阶段即 'cannot guess build type' 退出 1（E007）；内置 patch-autotools-ohos.pl 对该 vintage 补不全（Score 1/5），按 libinklevel 同款最小改动手补"
    - "configure 硬依赖 inklevel.h/-linklevel（AC_CHECK_HEADERS/AC_CHECK_LIB，非 pkg-config），直接依赖制品仓已发布的 libinklevel/0.9.7（R36）"
    - "autoconf 2.69 的 configure mktemp -d 分支在 HMDFS 历史上不可用（E490），沿用 libinklevel 已验证的固定目录名补丁"
    - "无上游测试套件（Makefile.am 无 check 目标、无 tests/ 目录），冒烟口径 ink -v（R51）"
  common_dependencies:
    - libinklevel

versions:
  "0.5.3":
    status: built
    build_date: "2026-09-27"
