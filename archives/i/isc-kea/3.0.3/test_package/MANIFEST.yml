# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: isc-kea/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> --list"
upstream_test_in_build: true
upstream_test_command: "meson test -v --no-rebuild -C <builddir> <29 个套件：24 lib + 5 bin>"

# 上游实际运行的测试程序（本件范围：核心库 + 服务器本体；hooks/perfdhcp
# 套件属已拆分的 kea-hook-* / kea-perfdhcp 包；shell 集成套件需守护进程
# 驱动真实 socket，包 CI 环境不可提供）
upstream_tests:
  - file: kea-cc-tests
    source: src/lib/cc/tests/
    description: >-
      gtest 单元套件，覆盖配置数据模型 Element 与会话层（cc）
  - file: kea-dhcp-tests
    source: src/lib/dhcp/tests/
    description: >-
      gtest 单元套件，覆盖 DHCPv4/DHCPv6 报文与选项层（dhcp）
  - file: kea-dhcpsrv-tests
    source: src/lib/dhcpsrv/tests/
    description: >-
      gtest 单元套件，覆盖 DHCP 服务器引擎（子网/租约/分配引擎等），需要
      co1-co3 callout fixture 库
  - file: kea-dns-tests
    source: src/lib/dns/tests/
    description: >-
      gtest 单元套件，覆盖 DNS 报文与 RR 处理
  - file: kea-util-tests
    source: src/lib/util/tests/
    description: >-
      gtest 单元套件，覆盖 util 工具层
  - file: kea-dhcp4-tests
    source: src/bin/dhcp4/tests/
    description: >-
      gtest 单元套件，覆盖 kea-dhcp4 服务器本体（配置解析/分配/告警等），
      需要 co1-co4 callout fixture 库
  - file: kea-dhcp6-tests
    source: src/bin/dhcp6/tests/
    description: >-
      gtest 单元套件，覆盖 kea-dhcp6 服务器本体，需要 co1-co4 fixture
  - file: kea-agent-tests
    source: src/bin/agent/tests/
    description: >-
      gtest 单元套件，覆盖 kea-ctrl-agent 控制 Agent，需要 callout/basicauth fixture
  - file: kea-d2-tests
    source: src/bin/d2/tests/
    description: >-
      gtest 单元套件，覆盖 kea-dhcp-ddns DDNS 更新器，需要 callout/configured fixture
  - file: kea-lfc-tests
    source: src/bin/lfc/tests/
    description: >-
      gtest 单元套件，覆盖 kea-lfc 租约文件清理器
  - file: 其余 19 个 lib 套件
    source: src/lib/{asiodns,asiolink,config_backend,config,cryptolink,d2srv,database,dhcp_ddns,eval,exceptions,hooks,http,log,log/interprocess,process/cfgrpt,process,stats,tcp}/tests/
    description: >-
      gtest 单元套件，覆盖对应核心库（hooks 套件需 nvl/ivl/fxl/bcl/lcl/lecl/ucl/fcl/pcl/acl 十个 fixture）

# test_package 中自带的消费者视角测试
test_package_tests:
  - file: test_isc_kea.cpp
    description: >-
      链接打包的 libkea-* 库并调用公共 API：IOAddress 构造/文本往返/族判定、
      Element JSON 解析与树变更
    command: "./test_isc_kea"
  - file: test_ohos_platform.cpp
    description: >-
      OHOS 特有平台检查：__OHOS__ 编译守卫、BOOST_SP_NO_PTHREAD_SETCANCELSTATE
      传导、aarch64 ELF 签名、musl/libc++ DT_NEEDED、dlopen(RTLD_NOW) 闭包解析
    command: "./test_ohos_platform <libkea-asiolink.so>"
  - file: kea-dhcp4/kea-dhcp6/kea-dhcp-ddns/kea-ctrl-agent/kea-lfc -v
    description: >-
      五个守护进程以 -v 运行（Kea 选项解析为单划线风格，GNU --version 不被接受），
      证明可执行文件及其 DT_NEEDED 闭包在目标环境可加载可执行（守护进程流量验证需
      真实 socket，环境限制）
    command: "./kea-dhcp4 -v 等"
