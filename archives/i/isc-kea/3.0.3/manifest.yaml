# 版本级 manifest
# 文件位置: archives/i/isc-kea/3.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "3.0.3"
software: "isc-kea"
status: built
build_date: "2026-10-08"
build_system: "meson"

source:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
    - "-DBOOST_SP_NO_PTHREAD_SETCANCELSTATE (extra_cxxflags)"
    - "tc.binaries ar/ranlib = <compiler dir>/llvm-ar|llvm-ranlib (MesonToolchain)"
    - "LD_LIBRARY_PATH += host 依赖 libdirs（配置期 cpp.run() 探针）"
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1   # test_requires
    - meson/1.11.0     # tool_requires
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-meson.build.patch"
  - "0002-src-lib-dhcp-iface_mgr_linux.cc.patch"

test:
  upstream_entry: "meson test -v --no-rebuild（24 lib 套件 + 5 bin 服务器套件，协议 gtest）"
  consumer: "test_package：五守护进程 --version + test_isc_kea（IOAddress/Element API）+ test_ohos_platform（OHOS ABI/dlopen）"

package:
  contents:
    - "bin/: kea-dhcp4 kea-dhcp6 kea-dhcp-ddns kea-ctrl-agent kea-lfc keactrl"
    - "lib/: 23 个核心 libkea-*.so（守护进程运行闭包，可供消费者链接）"
    - "include/kea/: 各库公共头 + 生成的 kea_version.h config.h"
    - "res/kea/: keactrl.conf 与五个守护进程参考配置"
  type: application
