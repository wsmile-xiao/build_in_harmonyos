software: indi-beefocus
display: "INDI Bee Focuser driver"
description: "Bee Focuser（开源硬件/软件望远镜调焦器）的 INDI 驱动，经 TCP/IP 与调焦器通信，支持绝对/相对移动、中止与同步"
category: astronomy
homepage: "https://github.com/indilib/indi-3rdparty"
license: LGPL-2.1+
build_system: cmake
package_type: application

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "E092: CMake 不识别 HarmonyOS 平台，配方强制 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64（与 libindi/libfli 同款）"
    - "E537: 本平台无法 mmap PROT_EXEC 加载 Conan 缓存中的 OHOS 共享库，故驱动静态链接 libindidriver.a；同时需 -Wl,--allow-multiple-definition（归档内 indidrivermain.o 自带 main/me，与单元测试的 main 冲突）"
    - "供应商 cmake_modules/FindINDI.cmake 无 CONFIG 感知 → libindi 传递依赖（cfitsio/nova/libusb/curl/gsl/fftw3/libev/jpeg/zlib）由配方从 Conan 依赖图动态生成 -L/-l 注入"
    - "FindINDI.cmake 默认同时找 driver+align 组件，align 上游只发 .so → 用 COMPONENTS driver 收窄，避免引入不可加载的共享库"
    - "上游源码为 INDI 1.x 时代快照：需 C++14→17、INDI 1.x→2.x 属性 API 两处回移（均与上游 master 逐行一致）"
    - "产物是命令行驱动可执行文件 → 软件级 commands.json 必须存在（R38/L0k）"
  common_dependencies:
    - "libindi/2.2.2.1"
  test_requirements:
    - "gtest/1.17.0"

# 版本索引
versions:
  "0.1-20221222010828":
    status: built
    build_date: "2026-10-03"
    conan_ref: "indi-beefocus/0.1-20221222010828"
    upstream_source: "salsa upstream/0.1+20221222010828 snapshot"
