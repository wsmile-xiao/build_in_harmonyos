patches:
  - patch_file: "patches/0001-FindINDI.cmake.patch"
    patch_description: "FindINDI.cmake 版本号正则回移上游 master 修复：兼容 INDI 2.x indiversion.h 的 INDI_VERSION \"2.2.2\" 引号形式（否则 FATAL_ERROR failed to detect INDI version）"
    patch_type: "portability"
  - patch_file: "patches/0002-CMakeCommon-cxx17.patch"
    patch_description: "cmake_modules/CMakeCommon.cmake 的 CMAKE_CXX_STANDARD 由 14 提升到 17：INDI 2.x 头文件（defaultdevice.h 使用 std::any）与 gtest 1.17 都要求 C++17；回移上游 master 同一处改动"
    patch_type: "portability"
  - patch_file: "patches/0003-beefocus-indi2-api.patch"
    patch_description: "driver/beefocus.cpp 迁移到 INDI 2.x 属性 API：FocusAbsPosN/FocusMaxPosN 数组成员改为 FocusAbsPosNP/FocusMaxPosNP 的 setValue/setMin/setMax/setStep 访问器，状态赋值 .s 改为 setState()/getState()，IDSetNumber() 改为 apply()；逐行等同上游 indi-3rdparty master 的同一处移植"
    patch_type: "portability"
  - patch_file: "patches/0004-CMakeLists.txt.patch"
    patch_description: "修复两处上游构建缺陷：①cmake_minimum_required(VERSION 3.0) 在 CMake ≥4 下硬报错，提升到 3.16；②单元测试的 POST_BUILD 用裸 `COMMAND ${TEST}` 调用测试程序，shell 无法解析（Error 127），改为 $<TARGET_FILE:${TEST}>；同时把 find_package(INDI) 收窄为 COMPONENTS driver（本驱动不使用 alignment/client 子系统，上游仅以共享库形式提供）"
    patch_type: "portability"
