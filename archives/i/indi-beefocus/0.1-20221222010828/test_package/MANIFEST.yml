# test_package — indi-beefocus 0.1-20221222010828 消费者端到端用例集
#
# 本配方产物是**可执行文件**（bin/indi_beefocus 驱动 + share/indi/indi_beefocus.xml），
# 不是库。因此消费者测试必须真正执行包内二进制并断言其 INDI 协议行为（R34），
# 而不是只打印字符串。
#
# 统计口径：PR 描述「适配后测试用例统计」表的「鸿蒙特有测试」行按**用例数**
# 填报，即下表的 4 个 HC-N；每个用例内部的 ok/FAIL 行只是该用例的检查项。

files:
  - test_package/conanfile.py
  - test_package/test_indi_beefocus.py
  - test_package/MANIFEST.yml

requirements:
  - indi-beefocus/0.1-20221222010828

# 上游测试套件：unit_tests/test_driver.cpp
#   * 8 个 gtest TEST() 用例（DEVICE.*），驱动**软件模拟固件**（beesimfirmware），
#     无需真实硬件；由 CMakeLists.txt 的 INDI_BUILD_UNITTESTS 分支注册
#     （add_test(run-tests test_driver)）并在 build() 中以 ctest 实跑。
#   * 清点证据：unit_tests/ 目录内含 test_driver.cpp（8×TEST）、test_helpers.h、
#     test_helpers.cpp；CMakeLists.txt 第 62-96 行注册测试（见 notes.md 申报表）。
upstream_tests_exist: true
upstream_test_count: 8
upstream_test_framework: gtest (CTest 注册)
upstream_test_command: "ctest --output-on-failure"
upstream_test_in_build: true

use_cases:
  - id: HC-1
    title: "驱动二进制与上游 CLI 契约 / packaged driver binary + CLI contract"
    kind: consumer_e2e
    description: >
      断言落在**包内** bin/indi_beefocus 上：是 ELF64、e_machine=EM_AARCH64、
      可执行；并按上游 indidrivermain.c 的既定契约，传入未知选项时打印
      "Usage: ... INDI Device driver framework." 横幅到 stderr 且以状态码 1 退出。
    status: pass

  - id: HC-2
    title: "驱动消费 INDI XML 且确实编入包内 / driver consumes INDI XML and carries the driver"
    kind: consumer_e2e
    description: >
      向包内驱动进程的 stdin 写入真实 INDI 请求
      `<getProperties version="1.7" />`，断言驱动经其 INDI 协议输入路径
      **消费**了该请求（-v 模式下驱动回显所解析的请求）并输出自身诊断
      （`indi_beefocus: EOF`，来自上游 indidrivermain.c）；随后用 nm 断言
      交付 ELF 中确实定义了驱动的 7 个自有入口（getDefaultName /
      initProperties / Connect / Handshake / MoveAbsFocuser / AbortFocuser /
      SyncFocuser）、含设备标识 "Bee Focuser"，且链入了 INDI 框架的协议入口
      （newLilXML / readXMLEle / delXMLEle / dispatch）。
      注：不断言 stdout 的 <def> 应答——上游 indidrivermain.c 在管道 EOF 时
      直接 exit(1)，事件循环来不及 flush 排队消息（见 notes.md「HC-2 的诚实说明」）。
    status: pass

  - id: HC-3
    title: "包内 INDI 描述文件 / packaged indi_beefocus.xml"
    kind: consumer_e2e
    description: >
      解析包内 share/indi/indi_beefocus.xml：XML 良构、注册
      <driver name="Bee Focuser">indi_beefocus</driver>、归入 Focusers 组。
    status: pass

  - id: HC-4
    title: "鸿蒙特有：包内 ELF 的打包不变量"
    kind: harmony_specific
    description: >
      readelf 检查包内二进制：DT_NEEDED 非空且**不含绝对路径**
      （E537 教训：机器私有 Conan 缓存绝对路径泄漏 = 制品不可跨机消费）；
      并确认上游 CMakeCommon.cmake 请求的 BIND_NOW/RELRO 硬化在 OHOS 链接后
      仍然可见。
    status: pass

summary:
  total_use_cases: 4
  passed_use_cases: 4
  pass_rate: 1.0

# 防空壳的结构性保障（R34 / L1e）
anti_hollow:
  - "test_package/conanfile.py 的 test() 用 self.run 真正执行包内二进制"
  - "can_run() 为假时直接抛 AssertionError（不允许静默跳过消费者测试）"
  - "HC-2 以真实 INDI XML 请求驱动驱动进程，断言驱动确实消费了该请求，
     且交付 ELF 确实含驱动自有入口与 INDI 框架协议符号（非空壳断言）"
  - "L1e 负向预期：mv 走包内 bin/ 后，HC-1.1 找不到可执行文件直接失败"
