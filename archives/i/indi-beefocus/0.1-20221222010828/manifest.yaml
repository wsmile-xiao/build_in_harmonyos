# 版本级 manifest — indi-beefocus 0.1-20221222010828
# 上游: indilib/indi-3rdparty 的 indi-beefocus/ 子目录
#       官方仓库 https://github.com/indilib/indi-3rdparty
#       上游不为单个 3rdparty 驱动打 tag；本仓库既有先例（libplayerone 3.1.0）
#       对同类情况采用 Debian Astronomy Team 在 salsa 上维护的官方上游 tag 快照
#       tarball（upstream/0.1+20221222010828）。该快照与本任务版本号一一对应
#       （日期戳 2022-12-22 01:08:28），conan 版本号把 '+' 规范化为 '-'。

version: "0.1-20221222010828"
software: indi-beefocus
status: built
build_date: "2026-10-03"
build_system: cmake
package_type: application

source:
  url: "https://salsa.debian.org/debian-astro-team/indi-beefocus/-/archive/upstream/0.1+20221222010828/indi-beefocus-upstream-0.1+20221222010828.tar.gz"
  sha256: "00b4d372db38bd30e873594a18c043773e0740e38c9a489017c9cc4d5f5bee95"
  tar_format: tar.gz
  upstream_homepage: "https://github.com/indilib/indi-3rdparty"
  upstream_license: "LGPL-2.1+ (firmware/LICENSE)"

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_FIND_PACKAGE_PREFER_CONFIG=OFF"
    - "-DINDI_BUILD_UNITTESTS=ON"
    - "-DGTEST_ROOT=<conan gtest package folder>"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-D_INDI_LIB_RELEASE_driver=<libindi pkg>/lib/libindidriver.a"
  dependencies:
    - libindi/2.2.2.1
  test_requirements:
    - gtest/1.17.0
  cc: clang
  cxx: clang++

artifacts:
  - bin/indi_beefocus
  - share/indi/indi_beefocus.xml
  - licenses/LICENSE

patches_applied:
  - patches/0001-FindINDI.cmake.patch
  - patches/0002-CMakeCommon-cxx17.patch
  - patches/0003-beefocus-indi2-api.patch
  - patches/0004-CMakeLists.txt.patch

patch_classification:
  - file: 0001-FindINDI.cmake.patch
    type: auto
    platform_only: false
    guard: "not_required"
    rationale: >
      版本号正则回移上游 indi-3rdparty master 的同一处修复，兼容 INDI 2.x
      indiversion.h 中带引号的 `#define INDI_VERSION "2.2.2"`。与平台无关，
      不含任何平台宏（Linux 上构建同样需要），因此不适用 R8 平台宏约束。
  - file: 0002-CMakeCommon-cxx17.patch
    type: auto
    platform_only: false
    guard: "not_required"
    rationale: >
      供应商 CMakeCommon.cmake 把 CMAKE_CXX_STANDARD 固定为 14；INDI 2.x 头文件
      （defaultdevice.h 使用 std::any）与 gtest 1.17 都要求 C++17。改为 17 与上游
      master 完全一致（上游顶层 cmake_modules/CMakeCommon.cmake 已为 17）。
      纯标准版本修正，不含平台宏。
  - file: 0003-beefocus-indi2-api.patch
    type: auto
    platform_only: false
    guard: "not_required"
    rationale: >
      驱动源码迁移到 INDI 2.x 属性 API：FocusAbsPosN/FocusMaxPosN 数组成员改为
      FocusAbsPosNP/FocusMaxPosNP 的 setValue/setMin/setMax/setStep，状态赋值
      `.s =` 改为 setState()/getState()，IDSetNumber() 改为 apply()。逐行等同
      上游 indi-3rdparty master 现有版本，不含平台宏。
  - file: 0004-CMakeLists.txt.patch
    type: auto
    platform_only: false
    guard: "not_required"
    rationale: >
      修复两处上游构建缺陷：①cmake_minimum_required(VERSION 3.0) 在 CMake ≥4 下
      硬报错（上游 master 已提升到 3.16，本补丁采用同一值）；②单元测试 POST_BUILD
      用裸 `COMMAND ${TEST}` 调用，shell 无法解析（Error 127），改为
      $<TARGET_FILE:${TEST}>。另把 find_package(INDI) 收窄为 COMPONENTS driver
      （本驱动不使用 alignment/client 子系统）。不含平台宏。

knowledge_gained:
  - "E092: CMake 不识别 HarmonyOS 平台，需 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64"
  - "Conan CMakeToolchain 默认 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON，会 shadow 项目自带 Find*.cmake 的旧式变量；须在 toolchain 末尾强制 OFF（libindi/libfli 同款）"
  - "E537: 本平台/CI 无法对 Conan 缓存中的 OHOS 共享库做 mmap PROT_EXEC 加载（libindi 的 .so 与 libindiAlignmentDriver.so 均报 Permission denied），因此 indi driver 类包应链接 libindidriver.a 静态归档；libindi 自身 test_package 采用同一模式"
  - "静态链接 libindidriver.a 会引入其自带的 indidrivermain.o（定义 main/me），与单元测试自身的 main 冲突 → 需 -Wl,--allow-multiple-definition"
  - "供应商 cmake_modules/FindINDI.cmake 无 CONFIG 感知，只解析 legacy find_library 变量 → libindi 的传递依赖（cfitsio/nova/usb-1.0/curl/gsl/fftw3/libev/jpeg/zlib）须由配方显式注入"
  - "FindINDI.cmake 的 _INDI_LIB_RELEASE_<component> 已是有效路径时 find_library 会跳过搜索 → 预置该缓存变量即可强制解析到 .a（E537 的配方侧解法）"
  - "FindINDI.cmake 2022 快照默认同时找 driver+align 两个组件；align 上游只发 .so → 用 COMPONENTS driver 收窄可避免引入不可加载的共享库"
  - "上游单元测试 POST_BUILD 用裸 COMMAND ${TEST}，CMake >= 4 / 非 '.' 搜索路径下 shell 报 Error 127 → 改 $<TARGET_FILE:${TEST}>"
  - "OHOS 构建树内运行测试需显式 RPATH：构建期可执行文件不会自动搜索 Conan 缓存目录"
  - "CMake >= 4.0 移除 < 3.5 兼容，cmake_minimum_required(VERSION 3.0) 直接硬报错；CMAKE_POLICY_VERSION_MINIMUM 必须走 cmake.configure(cli_args=[...]) 的命令行 -D（写进 conan_toolchain.cmake 的普通变量不跨 CMake 内部 system scope 存活）"
  - "CMakeToolchain 的 shell 类链接标志必须走 tc.extra_exelinkflags（会正确加引号）；直接拼进 -D<VAR>=... 的 cli_args 会在含空格时被 CMake 当成额外参数解析（Unknown argument -ldl）"
