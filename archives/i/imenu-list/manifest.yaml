software: imenu-list
display: "imenu-list"
description: "GNU Emacs 包：把当前缓冲区的 imenu 条目大纲显示在独立缓冲区 *Ilist*（可折叠、实时更新、支持跳转），单文件 Emacs Lisp"
category: library
homepage: "https://github.com/bmag/imenu-list"
license: GPL-3.0-or-later
build_system: elisp

ohos_adaptation:
  key_points:
    - "单文件 Emacs Lisp 包（imenu-list.el 686 行），无 C/C++ 源码，按 web-mode 17.3.20 单文件 elisp 先例适配"
    - "requires emacs/29.1：字节编译工具链兼运行期宿主（ohpcd 制品仓已发布）"
    - "上游 tag 带 v 前缀（v0.9），裸 0.9 归档 URL 404，conandata 必须写 v0.9"
    - "上游 v0.9 无测试套件，以功能级消费者探针代替（8 断言含 minor-mode 开关实测）"
    - "任务平台标签为 C++，实为 Emacs Lisp 包，已在笔记中说明"
  common_dependencies:
    - "emacs/29.1"

versions:
  "0.9":
    status: built
    build_date: "2026-10-04"
