package: imenu-list/0.9
homepage: "https://github.com/bmag/imenu-list"

# 上游 v0.9 发行包不含任何测试套件（tar 清单仅 imenu-list.el / LICENSE /
# README.md / images，无 -tests.el 或 ERT 文件），无上游检查命令可执行。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  上游 bmag/imenu-list v0.9 为单文件 Emacs Lisp 包（imenu-list.el 686
  行），发行包内不含任何测试目录或测试文件；上游仓库亦无 CI 测试目标
  （badge 指向 MELPA 构建）。验证方式为 Emacs 加载与字节编译，两者均在
  构建期与消费者探针中实测。本包以功能级消费者探针代替（inform-mode
  同款口径）。

test_package_tests:
  - file: test_imenu_list.sh
    description: >-
      校验 IMENU_LIST_LISPDIR 下 imenu-list.el / imenu-list.elc 双文件
      在位，EMACSLOADPATH 包含安装目录（消费侧环境约定）。
    command: "test_imenu_list.sh"
  - file: test_imenu_list.el
    description: >-
      真消费者测试：经 EMACSLOADPATH 加载打包的 imenu-list，断言
      featurep 加载、imenu-list-buffer-name 默认 "*Ilist*"、
      imenu-list-minor-mode / imenu-list-smart-toggle 函数定义、batch
      模式下 minor-mode enable/disable 实测切换、imenu-list-position
      默认 'right、imenu-list-size 定制变量在位。
    command: "emacs -Q --batch -L $IMENU_LIST_LISPDIR -l test_imenu_list.el"
    count: 8

assertion_count: 8
