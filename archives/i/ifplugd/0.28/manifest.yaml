version: "0.28"
software: "ifplugd"
status: built
build_date: "2026-10-03"
build_system: autotools

source:
  url: "https://0pointer.de/lennart/projects/ifplugd/ifplugd-0.28.tar.gz"
  sha256: "474754ac4ab32d738cbf2a4a3e87ee0a2c71b9048a38bdcd7df1e4f9fd6541f0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-lynx"
    - "--disable-xmltoman"
    - "--disable-subversion"
    - "--with-initdir=${prefix}/etc/init.d"
    - "ac_cv_func_malloc_0_nonnull=yes"
    - "ac_cv_func_realloc_0_nonnull=yes"
  dependencies: []
  bundled_build_time_only:
    - "libdaemon/0.14 (identical upstream tarball, private static prefix; see conanfile.py TODO)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Same 0pointer autotools family as ifmetric: 2005-era config.sub needs explicit --build/--host triplets"
  - "Doc tools (lynx/xmltoman/subversion) are build-blocking but binary-irrelevant: --disable-* all three"
  - "Upstream mandates --with-initdir; stage it under package prefix on OHOS (no /etc/init.d)"
  - "HMDFS umask 077 scratch-dir failure: relax to 022 via replace_in_file (ifmetric precedent), no patch file"
  - "Upstream 0.28 has zero automated tests; consumer test asserts real option-parser behavior"
  - "libdaemon registry recipe lacks E002/E232 hardening so from-source rebuilds die on drifted workers; temporarily bundled as identical-tarball private static prefix until libdaemon re-adaptation"
