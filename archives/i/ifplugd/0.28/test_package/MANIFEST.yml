package: ifplugd/0.28
homepage: "https://0pointer.de/lennart/projects/ifplugd/"

upstream_tests_exist: false
upstream_test_audit:
  - source: "ifplugd-0.28.tar.gz file listing (65 files, probed in-task)"
    reason: "No tests/ or test/ directory exists anywhere in the distribution."
  - source: "top Makefile.am + src/conf/doc/man/patches Makefile.am"
    reason: "None defines TESTS, check_PROGRAMS or a check target; only sbin_PROGRAMS (ifplugd/ifplugstatus) and doc/conf rules."
  - source: "configure.ac"
    reason: "Only PKG_CHECK_MODULES(LIBDAEMON) + lynx/xmltoman/subversion doc probes; no test framework probe (no CUnit/Check/gtest/ctest)."
  - conclusion: "Upstream 0.28 provides no automated tests whatsoever, so the adapted build executes 0 upstream cases. The adaptation adds a real consumer test driving the installed binaries; it is reported separately and never presented as upstream coverage."

upstream_test_total: 0
upstream_test_count_method: manual_audit
# Upstream 0.28 ships no test suite, so there is no check command to
# discover or run. Must stay empty: the HMBS lister treats a non-empty
# value as "upstream has tests" and rejects no_tests/0 (precedent:
# archives/i/inspircd/4.7.0/test_package/MANIFEST.yml, same no_tests
# wiring; sibling archives/i/ifmetric/0.3 uses "" as well). Total 0
# comes from the manual tarball + Makefile.am audit above, not from an
# autotools TESTS enumeration (there is nothing to enumerate).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: smoke.sh
    description: "Both binaries present and executable under package bin/ (or sbin/): proves install layout."
    command: "sh smoke.sh <package>/bin/ifplugd <package>/bin/ifplugstatus"
  - file: smoke.sh
    description: "ifplugd -h prints the full usage banner (title + Usage: + --iface): proves link + getopt wiring is real, not a stub."
    command: "sh smoke.sh <package>/bin/ifplugd <package>/bin/ifplugstatus"
  - file: smoke.sh
    description: "ifplugd -v prints 0.28: proves version path."
    command: "sh smoke.sh <package>/bin/ifplugd <package>/bin/ifplugstatus"
  - file: smoke.sh
    description: "ifplugd unknown long option exits non-zero with 'unrecognized option': proves argument validation runs."
    command: "sh smoke.sh <package>/bin/ifplugd <package>/bin/ifplugstatus"
  - file: smoke.sh
    description: "ifplugstatus -h usage ([options] [INTERFACE] + --help): proves second binary links."
    command: "sh smoke.sh <package>/bin/ifplugd <package>/bin/ifplugstatus"
  - file: smoke.sh
    description: "ifplugstatus unknown long option exits non-zero with 'unrecognized option': proves second binary validation runs."
    command: "sh smoke.sh <package>/bin/ifplugd <package>/bin/ifplugstatus"

test_scenario_count: 6
assertion_count: 6
assertion_count_basis:
  package_layout: 1
  ifplugd_help_banner: 1
  ifplugd_version: 1
  ifplugd_bad_option: 1
  ifplugstatus_help: 1
  ifplugstatus_bad_option: 1
privilege_required_for_test: false
privilege_note: "Link detection needs real NICs and kernel ioctls; the consumer test only exercises -h/-v and bad-option paths, so no root, interface, or route is touched."
