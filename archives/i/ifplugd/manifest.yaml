software: ifplugd
display: "ifplugd"
description: "Linux daemon for automatic Ethernet link detection and interface configuration"
category: network
homepage: "https://0pointer.de/lennart/projects/ifplugd/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools tarball with pre-generated configure (no autoreconf needed)"
    - "Requires libdaemon via pkg-config (PktConfigDeps)"
    - "Doc tools (lynx/xmltoman/subversion) disabled: doc rebuild not needed for binaries"
    - "Init script installed under package prefix via --with-initdir"
  common_dependencies:
    - libdaemon

versions:
  "0.28":
    status: built
    build_date: "2026-10-03"
    conan_ref: "ifplugd/0.28"
