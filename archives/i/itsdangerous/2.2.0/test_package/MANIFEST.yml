# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: itsdangerous/2.2.0
homepage: "https://github.com/pallets/itsdangerous"

# 上游测试命令 — pytest（tests/test_itsdangerous/ 目录）
upstream_check_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest tests -q"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src python3 -m pytest tests -q --assert=plain -p no:cacheprovider"

# 上游实际运行的测试程序（2026-09-16 实测记录）：
# - tests/test_itsdangerous/ 目录（test_encoding / test_serializer /
#   test_signer / test_timed / test_url_safe，共 5 个测试文件）
# - 纯 Python 包，无 C 扩展，故无 skipif 平台分支
upstream_tests:
  - file: tests/test_itsdangerous/
    source: itsdangerous-2.2.0/tests/test_itsdangerous/
    description: "上游 pytest 套件（5 个测试文件：encoding / serializer / signer / timed / url_safe）"
    command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src python3 -m pytest tests -q --assert=plain -p no:cacheprovider"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_itsdangerous.py
    description: >-
      消费者测试：真实 API（R34）——Signer sign/unsign 往返 + **篡改检测**
      （追加字符、换密钥均须抛 BadSignature）+ TimestampSigner 过期
      （max_age=-1 抛 SignatureExpired）+ 4 种 Serializer 往返
      （Serializer / URLSafeSerializer / TimedSerializer / URLSafeTimedSerializer）
      + base64_encode/decode 与 want_bytes 编码助手。
      刻意**不**断言 __version__：它经 importlib.metadata 解析，需要 .dist-info
      目录，而本包只交付可导入的 itsdangerous/ 目录（属打包事实，非 API 契约）。
    command: "python3 test_itsdangerous.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 21
