package: isatapd/0.9.7
homepage: https://www.saschahlusiak.de/linux/isatapd.html

# isatapd ships NO automated upstream test suite:
#   - no TESTS variable in any Makefile.am (top, src, man)
#   - no test/check source files anywhere in the tarball
#   - `make check` is only the automake-generated no-op target (runs zero cases)
upstream_check_command: "make check (automake-generated no-op; upstream registers 0 test cases)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

excluded_upstream_tests:
  - command: "isatapd runtime (tunnel creation + RA processing)"
    reason: "The daemon needs root privileges and a kernel ISATAP tunnel interface (SIOCADDRTNL / IFLA_IPTUN via ioctl). The contest worker userland has no root and no kernel tunnel support, so the runtime path cannot be executed. The binary's option-parsing surface is exercised by the consumer test instead."

coverage:
  enabled: false
  reason: "No coverage instrumentation in the contest OHOS Conan profile."

test_package_tests:
  - file: test_smoke.py
    description: Behavior assertions against the packaged bin/isatapd binary — (1) the full usage banner is emitted for -h (proves the binary links and its getopt option parser is functional, not a stub), and (2) an unknown long option is rejected with a non-zero exit and the 'unrecognized option' diagnostic (proves argument validation runs). Executed by conanfile.py test() via self.run(sys.executable).
    command: "test_package/conanfile.py test() -> python3 test_smoke.py --binary <pkg>/bin/isatapd"

assertion_count: 2
