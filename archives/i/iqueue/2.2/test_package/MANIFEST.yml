# test_package/MANIFEST.yml — iqueue 2.2 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: iqueue/2.2
homepage: "https://github.com/je-so/iqueue"

# 上游测试命令（Makefile 工程：make test 构建 bin/iqueue_test）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（单一可执行测试程序 src/test.c，含 12 个独立测试函数 / 371 处 TEST 断言）
upstream_tests:
  - file: src/test.c
    source: iqueue-2.2/src/test.c
    description: "上游 iqueue_t/iqueue1_t 队列测试：12 个测试函数（initfree/query/trysend/send/tryrecv/recv/close/iqsignal/multi_sendrecv/initfree1/query1/single_sendrecv1）"
    command: "./bin/iqueue_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：new_iqueue/trysend/tryrecv/delete_iqueue 公开 API 流程"
    command: "./test_iqueue"

# 测试断言总数（近似值，用于质量评估；以实际运行台账为准）
assertion_count: 371
