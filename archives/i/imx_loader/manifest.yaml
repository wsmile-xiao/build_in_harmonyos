software: imx_loader
display: "NXP i.MX USB Loader"
description: "NXP i.MX USB and UART bootloader utilities"
category: utility
homepage: "https://github.com/boundarydevices/imx_usb_loader"
license: LGPL-2.1-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "Conan PkgConfigDeps output directory is passed explicitly through PKG_CONFIG_PATH for the upstream Makefile."
    - "The libusb package include root is added to CFLAGS to support the upstream libusb-1.0/libusb.h include spelling."
    - "Upstream make tests run in the HarmonyOS simulator without USB hardware access."
  common_dependencies:
    - libusb

versions:
  "0_git20201102":
    status: built
    build_date: "2026-09-27"
