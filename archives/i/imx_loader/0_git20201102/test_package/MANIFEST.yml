# Upstream test and consumer-test audit for imx_loader 0_git20201102.
package: imx_loader/0_git20201102
homepage: "https://github.com/boundarydevices/imx_usb_loader"

# Exact upstream commit contains a simulator suite, although there is no
# `check` target. `make tests` runs every fixture against the software simulator.
upstream_check_command: "make tests"
upstream_test_in_build: true
upstream_test_command: "make -j1 tests"
upstream_tests:
  - file: tests/test.imx
    source: imx_usb_loader-30b43d69770cd69e84c045dc9dcabb1f3e9d975a/tests/test.imx
    description: "USB SDP simulator output compared with tests/test.imx.output"
    command: "imx_usb -v -S 0x15a2:0x0061 tests/test.imx"
    result: "PASS (asserted by upstream diff target)"
  - file: tests/test-dcd.imx
    source: imx_usb_loader-30b43d69770cd69e84c045dc9dcabb1f3e9d975a/tests/test-dcd.imx
    description: "DCD fixture simulator output compared with tests/test-dcd.imx.output"
    command: "imx_usb -v -S 0x15a2:0x0061 tests/test-dcd.imx"
    result: "PASS (asserted by upstream diff target)"
  - file: tests/test-plugin.imx
    source: imx_usb_loader-30b43d69770cd69e84c045dc9dcabb1f3e9d975a/tests/test-plugin.imx
    description: "Plugin fixture simulator output compared with tests/test-plugin.imx.output"
    command: "imx_usb -v -S 0x15a2:0x0061 tests/test-plugin.imx"
    result: "PASS (asserted by upstream diff target)"

test_package_tests:
  - file: test_imx_loader.py
    description: "Consumer checks: packaged files/executable modes; imx_usb --help/-V; imx_uart --help; simulator loads the installed configuration"
    command: "python3 test_imx_loader.py <package-folder>"
    executed_by: "test_package/conanfile.py test() using self.run"
  - file: test_ohos_imx_loader.py
    description: "HarmonyOS-specific checks: HarmonyOS kernel, AArch64 device and ELF, musl interpreter, runtime dependency loading, and packaged simulator configuration"
    command: "python3 test_ohos_imx_loader.py <package-folder>"
    executed_by: "test_package/conanfile.py test() on settings.os=OHOS"

# Unique consumer assertions: 5 portable + 6 HarmonyOS. Upstream's three
# golden-output comparisons are enumerated separately above.
assertion_count: 11
