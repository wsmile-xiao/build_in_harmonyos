software: inform-mode
display: "inform-mode"
description: "Inform 6 交互式小说语言的 Emacs 主模式（语法高亮、缩进、编译运行集成），单文件 Emacs Lisp"
category: development
homepage: "https://ifarchive.org/indexes/if-archive/infocom/compilers/inform6/source/"
license: GPL-3.0-or-later
build_system: none

ohos_adaptation:
  key_points:
    - "单文件 Emacs Lisp（contrib/inform-mode.el，63201 字节），上游经 inform6 Unix 发行包 6.42-r9 分发，Debian 从 inform6-compiler 6.42 同源构建 inform-mode 1.6.2"
    - "OHOS PC 无 Emacs 运行时：不编译，build() 仅防漂移校验（文件在位 + 字节数），package() 安装到 share/emacs/site-lisp/，licenses/ 附 GPL-3.0 全文"
    - "package_id 清空；无运行时验证以内容级消费者探针代替（版本头 + 功能符号断言），运行时可用时可叠加 byte-compile 条件路径"
  common_dependencies: []

versions:
  "1.6.2":
    status: built
    build_date: "2026-09-27"
