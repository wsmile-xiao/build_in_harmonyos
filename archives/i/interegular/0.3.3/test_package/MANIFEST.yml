package: interegular/0.3.3
homepage: "https://github.com/MegaIng/regex_intersections"

# ── 上游测试清点 ──
# sdist tests/ 目录包含 2 个测试文件：
#   tests/test_patterns.py — 5 个 unittest 用例（SyntaxTestCase）
#   tests/test_comparator.py — 10 个 pytest 用例
# 均在 conanfile.py build() 中真实执行且全部通过。
upstream_test_in_build: true
upstream_test_command: "pytest tests/test_patterns.py -v && pytest tests/test_comparator.py -v"

upstream_tests:
  - name: test_patterns
    command: "pytest tests/test_patterns.py -v"
    expected: "5 passed"
    count: 5
  - name: test_comparator
    command: "pytest tests/test_comparator.py -v"
    expected: "10 passed"
    count: 10

test_package_tests:
  - file: conanfile.py
    test_type: consumer
    description: "验证 interegular 可正常导入并执行基本功能：import、正则解析、交叉检测"