# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: internetarchive/5.10.1
homepage: "https://github.com/jjjake/internetarchive"

# 上游测试命令 (用于分析)
upstream_check_command: "python3 -m pytest"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Python pytest suite)
upstream_tests:
  - file: tests/test_api.py
    source: internetarchive-5.10.1/tests/test_api.py
    description: "API functionality tests"
    command: "python3 -m pytest tests/test_api.py"
  - file: tests/test_config.py
    source: internetarchive-5.10.1/tests/test_config.py
    description: "Configuration tests"
    command: "python3 -m pytest tests/test_config.py"
  - file: tests/test_item.py
    source: internetarchive-5.10.1/tests/test_item.py
    description: "Item functionality tests"
    command: "python3 -m pytest tests/test_item.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ia.py
    description: "Python import + CLI entry point verification"
    command: "python3 test_ia.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
