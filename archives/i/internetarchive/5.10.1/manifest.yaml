software: internetarchive
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.10.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.10.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jjjake/internetarchive/archive/refs/tags/v5.10.1.tar.gz"

  # 源码校验和
  sha256: "000b73d7cc6a27d83cb2bb58e85ad55a35bc654df32751d095baf99ef17f8682"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # Python dependencies (installed via pip, not Conan):
  # - jsonpatch>=0.4
  # - requests>=2.25.0,<3.0.0
  # - tqdm>=4.0.0
  # - urllib3>=1.26.0
  dependencies: []

  # 编译器 (纯 Python 包，不适用)
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Python packages need sys.executable -m pip instead of pip in Conan build environment"
  - "Python test_package needs sys.executable instead of python3"
  - "Pure Python package - no C/C++ compilation needed"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
