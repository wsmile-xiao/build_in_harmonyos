package: ifmetric/0.3
homepage: "https://0pointer.de/lennart/projects/ifmetric/"

upstream_tests_exist: false
upstream_test_audit:
  - source: "ifmetric-0.3 source tree (33 files, verified against the extracted tarball)"
    reason: "No tests/ or test/ directory exists anywhere in the distribution."
  - source: "Makefile.am"
    reason: "Defines only EXTRA_DIST (bootstrap.sh README LICENSE) and SUBDIRS (src man doc); no TESTS, check_PROGRAMS or check target."
  - source: "src/Makefile.am"
    reason: "Declares only sbin_PROGRAMS = ifmetric and ifmetric_SOURCES = ifmetric.c getifn.h getifn.c nlrequest.h nlrequest.c; there is no test program and no check rule."
  - source: "man/ and doc/"
    reason: "Contain only ifmetric.8 and project documentation; no runnable test asset."
  - conclusion: "Upstream 0.3 provides no automated tests whatsoever, so the adapted build executes 0 upstream cases. The adaptation adds a real consumer test that drives the installed binary; it is reported separately and is never presented as upstream coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: smoke.sh
    description: "Drive the packaged ifmetric binary as a user would: validate the packaged file is executable, that both no-argument and --help paths print the usage contract and exit 0 without opening a netlink socket."
    command: "sh smoke.sh <package>/bin/ifmetric"
  - file: smoke.sh
    description: "Assert the rtnetlink read path really works end to end: with a nonexistent interface the binary must complete socket(PF_NETLINK)+bind()+RTM_GETLINK send()/recv() and the RTA walk, then report \"Interface 'hw2nosuchif0' not existent.\" and exit 1 - a syscall-level refusal would print socket(PF_NETLINK)/bind()/NETLINK: send() instead."
    command: "sh smoke.sh <package>/bin/ifmetric"
  - file: smoke.sh
    description: "Assert the success path on a real interface: pick an interface that is present in /proc/net/dev but absent from /proc/net/route (the main table, which is exactly what enumerate() filters on RT_TABLE_MAIN), so getifn() resolves a genuine ifindex and RTM_GETROUTE enumeration completes with 0 matching routes and exit 0."
    command: "sh smoke.sh <package>/bin/ifmetric"
  - file: smoke.sh
    description: "Prove zero side effects on the shared host: snapshot /proc/net/route before and after the successful invocation and require it to be byte-identical, so no RTM_DELROUTE/RTM_NEWROUTE can have been applied."
    command: "sh smoke.sh <package>/bin/ifmetric"

# 3 scenarios = (1) CLI contract (bare + --help), (2) netlink negative round trip
# (nonexistent iface), (3) real-iface success + zero route mutation;
# the 3rd scenario carries 2 of the 6 assertions below.
test_scenario_count: 3
assertion_count: 6
assertion_count_basis:
  cli_contract: 2
  package_layout: 1
  netlink_read_roundtrip_negative: 1
  netlink_read_success_zero_mutation: 2
privilege_required_for_test: false
privilege_note: "Setting a route metric is a CAP_NET_ADMIN operation, and ifmetric has no read-only mode: 'ifmetric <iface> [metric]' defaults metric to 0 and deletes then re-adds every matching route. The consumer test therefore only ever runs against a nonexistent interface or an interface with zero main-table routes, so the write branch is intentionally never exercised. No assertion here claims privileged metric modification works."
