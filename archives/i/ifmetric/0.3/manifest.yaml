# 版本级 manifest
# 文件位置: archives/i/ifmetric/0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "0.3"

software: "ifmetric"

# 编译状态
# published | built | failed | archived
status: built

build_date: "2026-09-24"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://0pointer.de/lennart/projects/ifmetric/ifmetric-0.3.tar.gz"

  sha256: "0fa8510a4e34e555f136f9df81d26618313f2d69a4880c0fb5967f19502f1aec"

  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  configure_options:
  - "--build=aarch64-unknown-linux-gnu"
  - "--host=aarch64-unknown-linux-ohos"
  # configure 硬失败（AC_MSG_ERROR）找不到 lynx；xmltoman 同样拦住 man 页重建，
  # 两者只影响文档，不影响可执行文件
  - "--disable-lynx"
  - "--disable-xmltoman"

  # ifmetric 只依赖 Linux 内核 rtnetlink 头文件，无第三方库依赖
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
- "patches/0001-netlink-dump-datagram-buf.patch"
- "patches/0002-ohos-uapi-sockaddr-storage-guard.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "上游 0.3 的 configure 由 2004 年 autoconf 生成，config.sub 不认 aarch64-unknown-linux-ohos，必须显式 --build/--host 交叉三元组（E007/E160 家族）"
- "ifmetric 无任何自动化测试入口（Makefile.am 无 TESTS/check，源码树无 test 目录）⇒ 上游测试静态数 0，按 §10 只能自建真实消费者测试"
- "程序无只读模式：ifmetric <iface> 不带 metric 时默认 0 并执行 RTM_DELROUTE+RTM_NEWROUTE ⇒ 测试绝不可对真实网卡调用"
- "OHOS 用户态有 /bin/install（command -v install 有输出），故 M13（make 命令行覆盖 INSTALL_*）前提在本包不成立，不得空走"
- "本包自带 automake install-sh，config.status 生成的 INSTALL 不依赖宿主 install 命令"
- "configure 在找不到 lynx 时 AC_MSG_ERROR 硬失败（非 warning），文档类工具缺失也要显式 --disable-lynx/--disable-xmltoman 才能过 configure"
- "★路径 B 主知识：内核把一个 RTM_GETLINK dump 打成单个 netlink 数据报（本机 19276 B / 14 条消息），上游 nlrequest.c 用固定 2048 B 栈缓冲 recv ⇒ 静默截断并弹出 'NETLINK: Packet too small or truncated!'；须用 MSG_PEEK|MSG_TRUNC 先探数据报真实长度再 malloc 收全（DRAFT-ifmetric-0.3-netlink-dump-replybuf-truncation）"
- "本机 CPython 编译时未带 AF_NETLINK 常量，Python socket 造 netlink 套接字报 'bind(): bad family'，是解释器构建缺口而非平台拒绝 netlink —— 判定内核能力要用 C 探针（EH 头直调 syscall）"
- "/proc/net/route 的表列与 RT_TABLE_MAIN 等价，且是纯只读文件 ⇒ 可作为'消费者测试是否真的没改路由'的零副作用断言 oracle（前后字节一致）"
- "★CI 盲区：设备上的 `~/usr/local/bin/clang` 是 wrapper，会注入 `-D__MUSL__`；OHOS sysroot 的 musl `sys/socket.h:377` 把 `struct sockaddr_storage` 包在 `#ifndef __MUSL__` 里，而 `linux/socket.h:23` 是裸定义 ⇒ 带 wrapper 真机全绿、CI 用裸 clang 必红（redefinition of 'sockaddr_storage'）。任何同时 include `sys/socket.h` 与 `linux/*.h` 的包都会中，本机不复现（E091 define-guard 已修，见 patches/0002）"
