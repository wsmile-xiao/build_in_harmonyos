patches:
  "0.3":
    - patch_file: "patches/0001-netlink-dump-datagram-buf.patch"
      patch_description: "Size the netlink reply buffer from the datagram (MSG_PEEK|MSG_TRUNC) instead of a fixed 2048 B stack array, which truncates an RTM_GETLINK dump on HarmonyOS PC"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0002-ohos-uapi-sockaddr-storage-guard.patch"
      patch_description: "Guard the kernel UAPI socket headers (E091 define-guard): OHOS' linux/socket.h defines struct sockaddr_storage bare, which collides with musl sys/socket.h when the compiler is not invoked with -D__MUSL__"
      patch_type: "portability"
      strip: 1
