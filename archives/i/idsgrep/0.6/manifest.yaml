version: "0.6"
software: idsgrep
status: built
build_date: "2026-09-24"
build_system: autotools

source:
  url: "https://tsukurimashou.org/files/idsgrep-0.6.tar.gz"
  sha256: "2c07029bab12d9ceefddf447ce4213535b68d020b093a593190c2afa8a577c7c"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--disable-docs"
    - "--with-pcre=<pcre package prefix>"
  dependencies:
    - "pcre/8.45#d37e7bcdd1483105496deb82632f1b44"  # RREV pin（ohpcd v2 API 实测单值 2026-07-17），防 preflight 先查 conancenter 命中其 CMake 配方
  build_dependencies:
    - "perl/5.42.2"
  cc: clang
  cxx: clang++
  build_command: "configure + make -j1 + make check (25 automake TESTS)"

patches_applied: []

binary:
  type: executable
  path: bin/idsgrep
  tools:
    - idsgrep

conan:
  verified: false
  verification_note: "待 HMBS 真机预检（conan create）通过后由后端统一更新"

knowledge_gained:
  - "IDSgrep 的 PCRE 正则分支是核心功能（test/regex 断言 PCRE 报错），必须 requires pcre/8.45 并用 --with-pcre 前缀做确定性探测"
  - "字典生成（cjkvi2eids）与 cooked/speed 测试在构建期调用 perl，需 tool_requires perl/5.42.2"
  - "上游 25 个 automake TESTS 中 6 个依赖发布包未附带的数据/工具/构建期生成文件（KanjiVG、Tsukurimashou 字典、valgrind、cjkvi-j 生成字典），按退出码 77 跳过并计 skipped"
