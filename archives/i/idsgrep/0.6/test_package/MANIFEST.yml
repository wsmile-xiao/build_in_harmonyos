# test_package/MANIFEST.yml — idsgrep 0.6
# 上游测试盘点（与官方 0.6 同版本的统计口径一致）：
# Makefile.am 在非 gcov 分支声明 TESTS = 24 个 GCOV_TESTS + test/vgneko，
# 共 25 个 automake 测试（make check / test-suite.log 口径）。
# 其中 6 个依赖发布包未附带的数据、构建期生成文件或设备缺失的工具（KanjiVG 字典、
# Tsukurimashou 字典、valgrind），按退出码 77 优雅跳过（SKIP，不失败）：
# test/kvg-grone、test/tsu-grone、test/demorgan、test/speed、test/vgneko、test/filtcalc（条件见下方审计）。

package: idsgrep/0.6
homepage: "https://tsukurimashou.org/idsgrep.php.en"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check (25 automake TESTS, test-suite.log 口径)"

upstream_tests_exist: true
upstream_test_total: 25
upstream_test_count_method: "autotools_tests"
upstream_test_audit:
  - path: "Makefile.am（# TESTING 节）"
    finding: "GCOV_TESTS 列出 24 个 test/ 脚本；非 gcov 分支 TESTS = $(GCOV_TESTS) + test/vgneko，共 25 个"
  - path: "idsgrep-0.6/test/（发布包内）"
    finding: "共 27 个文件：24 个 GCOV_TESTS 脚本 + vgneko + rmgcda/gcov（仅 gcov 分支启用，默认不运行）"
  - path: "test/kvg-grone、test/tsu-grone"
    finding: "首行检查 kanjivg.eids / tsukurimashou.eids，不存在则 exit 77（SKIP）；两字典均未随发布包附带且需外部数据库生成"
  - path: "test/speed"
    finding: "首行检查 chise.eids + kanjivg.eids，kanjivg 缺失则 exit 77（SKIP）；后半段才调用 perl"
  - path: "test/demorgan"
    finding: "首行检查 kanjivg.eids，不存在则 exit 77（SKIP）；与 kvg-grone 同一外部 KanjiVG 数据库，发布包未附带（2026-09-24 预检 SKIP 之一）"
  - path: "test/filtcalc"
    finding: "首行检查构建期生成的 cjkvi-j.eids + cjkvi-j.bvec，两者缺一则 exit 77（SKIP）；2026-09-24 预检 SKIP 之一（6 SKIP 之六）"
  - path: "test/backslash"
    finding: "首行 #!/usr/bin/perl 硬编码，设备无该路径则 exit 126；主配方在 build() 中改写为 #!/usr/bin/env perl（PATH 经 tool_requires perl/5.42.2 提供），断言不变"
  - path: "test/regex"
    finding: "PCRE 正则查询；ohpcd pcre/8.45 缺 --enable-utf 而上游 regex.c 恒传 PCRE_UTF8，主配方在 build() 中经 pcre_config(PCRE_CONFIG_UTF8) 探测、无 UTF 时降级为非 UTF 编译/执行（ASCII 用例行为一致），断言与期望输出不变"
  - path: "test/vgneko"
    finding: "which valgrind 找不到则打印 skipping 并 exit 77（SKIP）；设备无 valgrind"
  - path: "test/cooked"
    finding: "无条件调用 perl -e / perl -pe，主配方以 tool_requires perl/5.42.2 提供"

upstream_tests:
  - file: test/andor
    source: "idsgrep-0.6/test/andor"
    description: "与/或布尔查询匹配"
    command: "make check"
  - file: test/anynot
    source: "idsgrep-0.6/test/anynot"
    description: "任意字符与非查询"
    command: "make check"
  - file: test/assoc
    source: "idsgrep-0.6/test/assoc"
    description: "关联查询"
    command: "make check"
  - file: test/basicmatch
    source: "idsgrep-0.6/test/basicmatch"
    description: "基础结构匹配（6 组管道查询精确 diff）"
    command: "make check"
  - file: test/backslash
    source: "idsgrep-0.6/test/backslash"
    description: "反斜杠转义查询"
    command: "make check"
  - file: test/bighash
    source: "idsgrep-0.6/test/bighash"
    description: "大哈希表查询"
    command: "make check"
  - file: test/cooked
    source: "idsgrep-0.6/test/cooked"
    description: "熟食（cooked）模式查询，需 perl 生成输入"
    command: "make check"
  - file: test/demorgan
    source: "idsgrep-0.6/test/demorgan"
    description: "德摩根律等价查询"
    command: "make check"
  - file: test/equal
    source: "idsgrep-0.6/test/equal"
    description: "等价查询"
    command: "make check"
  - file: test/filtcalc
    source: "idsgrep-0.6/test/filtcalc"
    description: "位向量过滤计算（需构建期生成的 cjkvi-j 字典，无则 SKIP）"
    command: "make check"
  - file: test/genbv
    source: "idsgrep-0.6/test/genbv"
    description: "位向量生成"
    command: "make check"
  - file: test/kvg-grone
    source: "idsgrep-0.6/test/kvg-grone"
    description: "KanjiVG 字典查询（无 kanjivg.eids 则 SKIP）"
    command: "make check"
  - file: test/messages
    source: "idsgrep-0.6/test/messages"
    description: "错误消息与 -V/-h/--bitvec-debug 烟雾调用（恒 exit 0）"
    command: "make check"
  - file: test/parsedict
    source: "idsgrep-0.6/test/parsedict"
    description: "字典解析（扫描 *[a-z].eids，cjkvi-j.eids 覆盖）"
    command: "make check"
  - file: test/regex
    source: "idsgrep-0.6/test/regex"
    description: "PCRE 正则查询（断言 PCRE 报错文本）"
    command: "make check"
  - file: test/spacing
    source: "idsgrep-0.6/test/spacing"
    description: "空白处理查询"
    command: "make check"
  - file: test/speed
    source: "idsgrep-0.6/test/speed"
    description: "速度基准（无 chise+kanjivg 双字典则 SKIP）"
    command: "make check"
  - file: test/ternbv
    source: "idsgrep-0.6/test/ternbv"
    description: "三值位向量查询"
    command: "make check"
  - file: test/truncate
    source: "idsgrep-0.6/test/truncate"
    description: "截断查询"
    command: "make check"
  - file: test/tsu-grone
    source: "idsgrep-0.6/test/tsu-grone"
    description: "Tsukurimashou 字典查询（无 tsukurimashou.eids 则 SKIP）"
    command: "make check"
  - file: test/unilist
    source: "idsgrep-0.6/test/unilist"
    description: "Unicode 列表查询"
    command: "make check"
  - file: test/unord
    source: "idsgrep-0.6/test/unord"
    description: "无序查询"
    command: "make check"
  - file: test/userpred
    source: "idsgrep-0.6/test/userpred"
    description: "用户谓词查询"
    command: "make check"
  - file: test/utf8
    source: "idsgrep-0.6/test/utf8"
    description: "UTF-8 编码查询"
    command: "make check"
  - file: test/vgneko
    source: "idsgrep-0.6/test/vgneko"
    description: "valgrind 内存检查（无 valgrind 则 SKIP）"
    command: "make check"

test_package_tests:
  - file: test_idsgrep.sh
    description: "消费者功能测试 6 项：在位可执行检查、-V 版本横幅、结构查询精确匹配、PCRE 查询精确匹配、缺失字典诊断文本对照、非法查询退出码对照（R34 合规，非空输出+精确内容/诊断断言）"
    command: "<shell> test_idsgrep.sh（IDSGREP_BIN 指向包内 bin/idsgrep）"

assertion_count: 6
