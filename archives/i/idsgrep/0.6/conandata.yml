# conandata.yml — idsgrep 0.6
# Upstream: Tsukurimashou Project, IDSgrep home page
# https://tsukurimashou.org/idsgrep.php.en
# Release tarball mirrored on the project download page
# (idsgrep-0.6.tar.gz, 2021-03-30, 3074591 bytes).
#
# Download reliability (2026-09-24 preflight: HTTPSConnectionPool
# Read timed out on tsukurimashou.org, get() defaults
# retry=2/retry_wait=5 exhausted after 2x "Waiting 5 seconds to retry"):
# No trustworthy third-party mirror exists for this host (the author's
# GitHub copy is explicitly disavowed as outdated in idsgrep.pdf §
# "Download, build, test, and install", and OSDN is unreachable), so
# the list holds the same official file over plain http first with the
# canonical https URL last as fallback (bulletty/0.2.2 precedent: http
# fallback for intercepting CI proxies). sha256 unchanged and still
# enforced by get(), so entries are byte-identical by construction.

sources:
  url:
    - "http://tsukurimashou.org/files/idsgrep-0.6.tar.gz"
    - "https://tsukurimashou.org/files/idsgrep-0.6.tar.gz"
  sha256: "2c07029bab12d9ceefddf447ce4213535b68d020b093a593190c2afa8a577c7c"
