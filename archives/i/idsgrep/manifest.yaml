software: idsgrep
display: "idsgrep"
description: "Tsukurimashou 汉字结构检索工具（IDSgrep，通用树匹配查询）"
category: utility
homepage: "https://tsukurimashou.org/idsgrep.php.en"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 工具包，仅发布 idsgrep 二进制（application 包，R38）"
    - "PCRE 正则分支为必需功能，requires pcre/8.45#d37e7bcdd1483105496deb82632f1b44（RREV 钉 ohpcd 配方）并以 --with-pcre 前缀注入"
    - "字典生成与部分测试需要 perl，tool_requires perl/5.42.2（exult 先例）"
    - "复用 bash 配方的 mktemp 包装与 --build 三元组、pcre 配方的 umask 修复"
    - "上游 make check 共 25 个 automake 测试，缺可选数据时按 77 优雅跳过"
  common_dependencies:
    - "pcre/8.45#d37e7bcdd1483105496deb82632f1b44"

versions:
