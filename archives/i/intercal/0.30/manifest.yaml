# 版本级 manifest —— intercal 0.30
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.30"
software: "intercal"

# 编译状态：本窗口仅在设备完成 W3 构建设备验证，尚未发布到任何远端仓库
# published | built | failed | archived
status: built

build_date: "2026-09-24"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "http://catb.org/~esr/intercal/intercal-0.30.tar.gz"
  sha256: "b38b62a61a3cb5b0d3ce9f2d09c97bd74796979d532615073025a7fff6be1715"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # 交叉参数（build 机==目标 OS，但 configure 需显式区分二者）
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "CC/AR/RANLIB/CC_FOR_BUILD 经 PATH shim 指向 llvm 工具 + OHOS clang wrapper（buildconfig 在 env -i PATH 下运行）"
    - "CFLAGS='-g -O2 -fcommon'（clang 默认 -fno-common，intercal 遗留重复 tentative 定义需 -fcommon）"

  # 无第三方 Conan 依赖（INTERCAL 自包含，仅编译期依赖本包 ick 生成 C）
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-configure-portability.patch"   # umask 077->022 + TMPDIR 导出（E011 HMDFS setgid）
  - "0002-buildconfig-umask-022.patch"    # 嵌套 buildconfig 同步 umask 077->022

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "DRAFT-intercal-0.30-no-bison-stale-prebuilt-parser：发行 tarball 自带 2010 年旧 prebuilt/parser.c、目标平台无 bison/yacc 无法重生成时，播种自带旧件并把 .y/.l mtime 调旧以阻止空 YACC 重生成；代价是编译器语法覆盖面停在旧 era，测试须按平台受限逐项申报（本包 30 例：7 执行通过 / 23 平台受限跳过，非静默删除）"
  - "configure 内嵌套 buildconfig 以 'env -i \"PATH=$PATH\"' 剥除 CC/AR/RANLIB/TMPDIR：用 PATH shim（裸 ar/ranlib/gcc/cc -> llvm + clang wrapper）穿透 env -i，并显式设 CC_FOR_BUILD 为同一 wrapper"
  - "HMDFS setgid 下 umask 077 建的 config.status 临时目录不可写（E011），configure 与 buildconfig 两处均需改 022"
