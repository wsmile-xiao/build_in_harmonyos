# conandata.yml — intercal 0.30
# 取包口径：上游官方站 catb.org 对 CI worker 出口投喂非官方字节（见 notes.md「取包源变更」），
# 而 archive.ubuntu.com 的 *.orig.tar.gz 是未打发行版补丁的 pristine 上游件——与 catb.org
# 官方件**逐字节相同**（sha256 b38b62a6…1715 / 930759B / 254 个文件 md5 全等），且该 sha256 与
# Debian intercal_0.30-6.dsc 的 Checksums-Sha256 逐字一致。仓内同口径先例已在官方 main：
# chrootuid/1.3、coco-cpp/20120102、calcurse/4.6.0。url 与 sha256 同源同物。
sources:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/i/intercal/intercal_0.30.orig.tar.gz"
  sha256: "b38b62a61a3cb5b0d3ce9f2d09c97bd74796979d532615073025a7fff6be1715"

patches:
  - patch_file: "patches/0001-configure-portability.patch"
    patch_description: "configure: umask 077->022 for config.status tmp dir (HMDFS setgid makes 077 dirs unwritable, E011); export TMPDIR=$PWD to the nested buildconfig which runs under 'env -i PATH' (device /tmp is read-only)"
    patch_type: "portability"
  - patch_file: "patches/0002-buildconfig-umask-022.patch"
    patch_description: "buildaux/buildconfig: umask 077->022 for its own config.status tmp dir (same E011 wall inside the nested autoconf 0.29 run)"
    patch_type: "portability"
