software: inform6
display: "inform6"
description: "Inform 6 交互式小说编译器（Z-machine 故事文件），纯 C 实现"
category: compiler
homepage: "https://github.com/DavidKinder/Inform6"
license: Artistic-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯可移植 C（21 个翻译单元），无第三方依赖，GNU make 单目标 inform 编译"
    - "平台宏仅影响 MACHINE_STRING/realpath/路径分隔符，OHOS 走 LINUX 分支，零源码补丁"
    - "跳过上游 all 目标的演示 .z5/.z3 编译（需运行交叉编译产物），库数据原样安装"
    - "二进制以包名 inform6 落盘；上游大小写别名软链改为文件副本（R5）"
    - "消费者经命令行 +目录 参数或源内 +include_path 指向包内 share/inform6/std/"
  common_dependencies: []

versions:
  "6.44-r7":
    status: built
    build_date: "2026-09-24"
