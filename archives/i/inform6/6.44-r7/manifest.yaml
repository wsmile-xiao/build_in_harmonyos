knowledge_gained:
  - "Inform 6.44 编译器为纯可移植 C（src/ 21 个翻译单元），平台差异仅 header.h 宏分支，OHOS 走 LINUX 分支无需补丁"
  - "David Griffith r7 一体化包含标准库 6.12.8 + PunyInform 6.6 + 演示/教程源，Makefile 默认 all 目标需运行交叉编译产物编译演示 .z5/.z3，交叉场景跳过，只 make inform"
  - "上游 Makefile 未给 CC 默认值（CC ?= gcc 已注释），make 必须显式传 CC；命令行选项优先于源内 !% 头选项（6.44 特性）"
  - "编译器 Include_Directory 编译期烘焙指向 /usr/local，消费者用命令行 +目录 参数（上游 puny %.z3 规则同款）或源内 +include_path 指向包内 share/inform6/std"
  - "上游 fixlinks.sh 建 English.h 等 5 个大小写别名软链，鸿蒙打包改为文件副本规避 R5；OHOS 真机文件系统大小写不敏感（别名即原文件），package() 对 shutil.SameFileError 容忍跳过，测试计数按文件系统自适应（20=大小写敏感 CI / 15=大小写不敏感真机）"
