package: inform6/6.44-r7
homepage: "https://github.com/DavidKinder/Inform6"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  inform-6.44-r7 发行包不携带自动化测试套件（无 tests/ 目录、无 make check 目标）。
  上游的等效验证方式是 Makefile 的演示编译目标（stddemos/stdtutor/punyhowto/
  punytests，即用编译出的编译器编译全部演示与教程 .inf → .z5/.z3），上游
  `make all` 默认执行这些目标。交叉编译场景下该方式无法在构建机运行（需执行
  交叉产物），故在 test_package 中以等价口径执行：用打包出的编译器编译上游
  标准演示 advent.inf（全库特性）+ 最小库入口 min.inf + PunyInform 入口，
  并对产物做 Z-code 版本字节断言。
test_package_tests:
  - file: test_inform6.sh
    description: >-
      真实消费者测试：执行包内 inform6 编译器编译 3 个游戏源
      （min.inf v5 最小库入口、上游 std-demos/advent.inf v5 全库演示、
      PunyInform puny.h 入口 v3），断言编译退出码、产物非空、Z-code 首字节
      版本号（5/5/3），校验 std/lib(20)/std/include(19)/std/demos(9)
      数据清单与大小写别名副本在位，并对语法错误源做负向拒绝断言。
    command: "test_inform6.sh <package-folder> <writable-work-root>"
assertion_count: 6
