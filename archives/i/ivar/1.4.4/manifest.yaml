# 版本级 manifest — ivar 1.4.4
# 遵循 ARCHIVE-SPEC v2.0

version: "1.4.4"
software: "ivar"
status: built
build_date: ''
build_system: autotools

source:
  url: "https://codeload.github.com/andersen-lab/ivar/tar.gz/refs/tags/v1.4.4"
  sha256: "e5c3905ffefb910a22aee44dc9374bf597b1cad84821c5f3b9e780d73513c083"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>"
    - "--build=aarch64-unknown-linux-ohos（config.guess 不识别 OHOS）"
    - "（不传 --with-hts：configure.ac 在 LIBS 无条件含 -lp，依赖路径经 CPPFLAGS/LDFLAGS 注入）"
  dependencies:
    - htslib/1.24-r0
    - zlib/1.3.1
    - xz/5.6.2  # 静态 libhts.a(cram/bgzf) 的 lzma_* 符号提供方（htslib 静态库包的 package_info 不含传递依赖，消费方须补链）
    - libdeflate/1.25  # 静态 libhts.a 的 libdeflate_* 符号提供方（allelecount/4.3.0 先例同款）
  cc: clang
  upstream_test_command: "make check（tests/Makefile.am TESTS，21 个单元测试程序，in-source 构建以 ../data/ 取数据）"

patches_applied:
  - "patches/0001-tests-tmpdir.patch（portability，测试专用：上游 test_trim/test_amplicon_search 硬编码 /tmp，设备只读挂载 EROFS；改尊重 TMPDIR 回退当前目录，库代码与断言零改动）"

knowledge_gained:
  - "静态库 conan 包（如 htslib/1.24-r0 仅 libhts.a）的 package_info 不声明其自身传递符号依赖：消费方链接期必炸 undefined symbol（libdeflate_*/lzma_*），W0 须读上游配方的 requirements 并显式 require 同版本依赖 + LIBS 补链（allelecount/4.3.0 先例）；-l 补链只能走 make 命令行 LIBS 覆盖（automake 链接规则 LDFLAGS 在对象之前，LDFLAGS 注入 -l 无效）——真机首验实测"
  - "ivar 官方 tag tarball 不含 configure，autogen.sh = autoreconf --force --install；configure.ac 无 LT_INIT，bootstrap 只需 autoconf/2.72 + automake/1.18（无 libtool）"
  - "设备 /tmp 为只读挂载（EROFS 实测）：上游测试硬编码 /tmp 的写路径在真机必炸，测试补丁须改 TMPDIR/回退路径，配方对 make check 显式导出可写 TMPDIR（真机第 3 轮 check_trim 20/21 唯一失败项）"
  - "仅共享库形态的依赖（libdeflate/1.25 无 .a）运行期 NEEDED libdeflate.so.0：conanbuild 环境的 LD_LIBRARY_PATH 只含 SDK llvm/lib、不含依赖 lib 目录 → make check 与 test_package 均须显式前置注入依赖 cpp_info.libdirs（真机第 2 轮 21/21 exit 127 实测）"
  - "make 命令行 LIBS= 覆盖不跨 make 调用持久化，Makefile.am 无条件 LIBS 赋值又盖掉 configure 代入值：make check 与 make install 每个独立 make 调用都要带同款 LIBS=\"-lhts -lz -lpthread -ldeflate -llzma\" 前缀，漏一处即重链接期 undefined symbols（真机第 4 轮 package() 阶段 15 个 libdeflate_/lzma_ 实测）"
  - "ivar consensus 的 mpileup 输入走 stdin（ivar.cpp isatty 检查强制管道），-i 是 FASTA 头 seq_id 不是输入文件；产物为 <prefix>.fa + <prefix>.qual.txt（call_consensus_pileup.cpp），默认 -m 10 最小深度——消费者测试须 stdin 重定向 + -m 调低 + 断言 .fa 命名与 ^>Consensus_ 头（真机第 5 轮 test_package 首跑实测）"
  - "test_package 的 test() 在真机 host 上下文执行 self.dependencies.host.items()：Conan 2 键是 Requirement 对象，名称取 ref.ref.name；Windows 侧 cross_building() 提前返回会跳过该段，此类错误本地测不出，只能真机首跑暴露"
  - "configure.ac 第 18 行无条件 LIBS=\"-lhts -lp -lpthread\"（-lp 不存在）→ AC_CHECK_LIB(hts/pthread/z) 在 configure 阶段全部报 no，属无害上游怪癖：src/tests 的 Makefile.am 以 LIBS = -lhts -lz -lpthread 覆盖 configure 代入值，实际链接不含 -lp；不要误读为失败，也不要传 --with-hts"
  - "Makefile.am 硬编码 CXXFLAGS 含 -Werror → GNU make 环境变量覆盖 makefile 赋值，generate() 导出完整 CXXFLAGS（保留 -std=c++11 -Wall -Wextra，仅去 -Werror）适配 OHOS clang"
  - "tests 的 TESTS 以 ../data/ 相对路径取数据 → 必须 in-source 构建（folders.build='.'）"
  - "E114/E074 平台限制处理沿用 zzuf/0.15 先例：umask 077→022 替换生成脚本 + make -j1"
