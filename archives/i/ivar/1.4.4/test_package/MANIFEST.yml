# test_package/MANIFEST.yml
# ivar 1.4.4
# 上游有真实测试套件：tests/Makefile.am 声明 21 个 TESTS 单元测试程序
# （plain assert，无第三方框架），由构建阶段 `make check` 在真机运行。

package: ivar/1.4.4
homepage: "https://github.com/andersen-lab/ivar"

upstream_tests_exist: true
upstream_test_audit: >
  tests/Makefile.am TESTS 与 check_PROGRAMS 各 21 项（check_primer_trim、
  check_trim、check_quality_trim、check_consensus、check_allele_depth、
  check_consensus_threshold、check_consensus_min_depth、
  check_consensus_seq_id、check_primer_bed、check_getmasked、
  check_removereads、check_variants、check_common_variants、
  check_unpaired_trim、check_primer_trim_edge_cases、check_isize_trim、
  check_interval_tree、check_amplicon_search、
  check_consensus_min_insert_threshold、check_quality_trim_unpaired、
  check_strand_variants）。数据文件在顶层 data/（111KB），测试经
  ../data/ 相对路径访问，in-source 构建下可离线运行。无外部测试框架
  依赖（plain assert）。
upstream_test_count: 21
upstream_check_command: "make check（构建阶段在配方 build() 内执行）"
upstream_test_in_build: true

# test_package 中自带的测试（消费者视角, R34: 真实执行被适配工具）
test_package_tests:
  - file: test_ivar.sh
    description: >
      消费者视角: 真实执行包内 ivar CLI，7 项断言（version 子命令 / -v
      短选项 / 无参数用法与退出码 / 未知命令提示 / consensus -h /
      trim 缺参非零退出 / 用 fixtures/sample.mpileup 真实调用 consensus
      子命令生成共识序列并校验输出），全部离线
    command: "bash test_ivar.sh <package>/bin/ivar"

test_fixtures:
  - file: fixtures/sample.mpileup
    description: 10 行最小 mpileup（ctg:1-10，深度 3，全 A，Q40），供 consensus 子命令真实调用

# 断言总数（消费者 7 项；上游 21 项在构建阶段 make check 计入 PR 报告）
assertion_count: 7
