software: ivar
display: "ivar"
description: "病毒扩增子测序分析 CLI 工具（引物修剪、共识序列、变异检测）"
category: tool
homepage: "https://github.com/andersen-lab/ivar"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "tarball 无 configure → tool_requires autoconf/2.72 + automake/1.18 手动 bootstrap（无 LT_INIT，无 libtool；zzuf/0.15 先例）"
    - "configure.ac 无条件 LIBS 含不存在的 -lp → AC_CHECK_LIB 报 no 属无害上游怪癖；实际链接用 Makefile.am 的 LIBS 覆盖；不传 --with-hts，依赖路径经 CPPFLAGS/LDFLAGS 注入"
    - "Makefile.am 硬编码 CXXFLAGS 含 -Werror → 环境变量覆盖（保留 -Wall -Wextra，仅去 -Werror 适配 OHOS clang）"
    - "tests 经 ../data/ 相对路径取数据 → in-source 构建；make check 21 项上游单元测试"
    - "E114/E074：umask 077→022 替换 + make -j1；config.guess 不识别 OHOS → 显式 --build 三元组"
    - "CLI 工具门禁：软件级 commands.json（R38）"

versions:
  "1.4.4":
    status: prepared
    conan_ref: "ivar/1.4.4"
