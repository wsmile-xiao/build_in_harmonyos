package: inchi/1.07.5
homepage: "https://github.com/IUPAC-InChI/InChI"
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - name: test_ichimain
    description: "Parse a V3000 input record"
  - name: test_inchi_dll_b
    description: "Generate InChI from molfile text"
  - name: test_inpdef
    description: "Create original input data from V3000 molfile text"
  - name: test_mol_fmt
    description: "Validate molfile field and structure parsing helpers"
  - name: test_permutation_util
    description: "Permute atom data while preserving chemical identity"
  - name: test_strutil
    description: "Validate connected-component and atom-data helpers"
  - name: test_util
    description: "Validate element, valence, stereo, and utility helpers"
test_package_tests:
  - file: test_inchi.c
    description: "Validate InChI strings and generate/check the standard water InChIKey"
    command: "test_inchi"
assertion_count: 6
