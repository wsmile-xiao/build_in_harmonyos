software: i686-elf-gcc
display: "i686-elf-gcc"
description: "GNU GCC 交叉编译器，目标 i686-elf 裸机 ABI"
category: build-tool
homepage: "https://gcc.gnu.org/"
license: "GPL-3.0-or-later WITH GCC-exception-3.1"
build_system: autotools-custom

ohos_adaptation:
  key_points:
    - "config.sub/configfsf.sub 需注入 aarch64-linux-ohos 三元组识别（E072）"
    - "所有 configure 脚本的 umask 077 需改为 022，适配 HMDFS（E011）"
    - "宿主 ELF 工具需 binary-sign-tool 签名后才能在 HarmonyOS 运行（E077）"
    - "GCC 生成脚本超出默认 shell 栈，需 bash + ulimit -s unlimited"
    - "make 需 --jobserver-style=pipe（HMDFS 不支持 FIFO jobserver，E074）"
    - "OHOS 无 pthread_cancel，需 --disable-threads（E085）"
    - "交叉构建 --target=i686-elf，driver 自动加 i686-elf- 前缀"
    - "目标 as/ld/ar/nm/ranlib 来自 i686-elf-binutils（AS_FOR_TARGET 等）"
  common_dependencies:
    - i686-elf-binutils

versions:
  "14.2.0":
    status: pending
    build_date: ""
