software: i686-elf-gcc
version: "14.2.0"
status: pending
build_date: ""
build_system: autotools-custom

source:
  url: "https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz"
  sha256: "a7b39bc69cbf9e25826c5a60ab26477001f7c08d85cec04bc0e29cabed6f3cc9"
  tar_format: tar.xz

build:
  system: autotools-custom
  configure_options:
    - "--target=i686-elf"
    - "--enable-languages=c,c++"
    - "--disable-bootstrap"
    - "--disable-multilib"
    - "--without-isl"
    - "--without-headers"
    - "--disable-threads"
  dependencies:
    - "i686-elf-binutils/2.46.1"
    - "bundled gmp/6.2.1"
    - "bundled mpfr/4.1.0"
    - "bundled mpc/1.2.1"
  cc: clang
  cxx: clang++

source_transforms:
  - "Inject aarch64-linux-ohos triplet into config.sub / configfsf.sub (E072)"
  - "Rewrite configure umask 077 to umask 022 for HMDFS (E011)"
  - "Run the source-tree transform in a short-lived Python process so its memory/state is released before configure"

patches_applied:
  - "files/prepare_ohos_sources.py: config.sub/configfsf.sub ohos 三元组注入 (E072)"
  - "files/prepare_ohos_sources.py: configure umask 077 -> 022 (E011)"

knowledge_gained:
  - "GCC 14.2.0 contrib/download_prerequisites 选择 gmp-6.2.1 / mpfr-4.1.0 / mpc-1.2.1 / isl-0.24"
  - "交叉编译器 build/host=aarch64-linux-ohos, target=i686-elf (freestanding, --without-headers)"
  - "GCC 14.2.0 顶层 config.sub 为 2021-10-27 版本, 不认识 ohos, 需注入三元组 (E072)"
  - "宿主 clang 编译 GCC 宿主工具, 产物需 binary-sign-tool 签名 (E077)"
  - "目标 as/ld/ar/nm/ranlib 来自 i686-elf-binutils (AS_FOR_TARGET 等)"
  - "OHOS libc 无 pthread_cancel, --disable-threads (E085)"
  - "GCC 生成脚本需 bash + ulimit -s unlimited; make 需 --jobserver-style=pipe (E074)"

compatibility:
  level: pending
  notes: |
    交叉编译器：工具运行于 HarmonyOS PC (aarch64)，生成 i686-elf 裸机代码，
    不在宿主执行 i686 代码。test_package 用 i686-elf-gcc/-g++ 编译并链接
    最小 freestanding 程序，再用 i686-elf-readelf/objdump 验证 Intel 80386
    产物 (R34)。上游测试为 make -C gcc selftest（语言无关 + C/C++ 前端自测）。
    权威 conan create（all-gcc + all-target-libgcc + selftest）待真机 shadow CI。

verification:
  local_static_checks: pass
  ohos_ci: pending
  note: "No HarmonyOS build success is claimed until the official CI completes."
