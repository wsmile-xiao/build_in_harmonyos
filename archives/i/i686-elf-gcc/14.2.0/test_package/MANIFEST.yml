# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）。
# 详见: docs/TEST_QUALITY_SPEC.md

package: i686-elf-gcc/14.2.0
homepage: "https://gcc.gnu.org/"

# 上游测试命令：GCC 语言无关 + C/C++ 前端 selftest（宿主执行，不涉及 target 代码运行）
upstream_check_command: "make -C gcc selftest"

# conanfile.py build() 中是否集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C gcc selftest"

# 上游测试程序
upstream_tests:
  - file: gcc/selftest-run-tests.c
    source: gcc-14.2.0/gcc/selftest-run-tests.c
    description: "GCC language-independent internal selftests"
    command: "make -C gcc selftest"
  - file: gcc/c/c-parser.c
    source: gcc-14.2.0/gcc/c/c-parser.c
    description: "C frontend selftests run through -fself-test"
    command: "make -C gcc selftest"
  - file: gcc/cp/cp-lang.c
    source: gcc-14.2.0/gcc/cp/cp-lang.c
    description: "C++ frontend selftests run through -fself-test"
    command: "make -C gcc selftest"

# test_package 自带测试（消费者视角，验证交叉编译器真实可用）
test_package_tests:
  - file: test.sh
    description: "用 i686-elf-gcc/-g++ 编译并链接最小 i686-elf freestanding 程序，readelf/objdump 验证产物（R34 合规）"
    command: "bash test.sh"
  - file: test.c
    description: "最小 i686-elf freestanding 测试程序（编译输入）"
    command: "i686-elf-gcc -O2 -c -o test.o test.c"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 6
