software: infgen
# 版本级 manifest（ARCHIVE-SPEC v2.0）

# 版本号
version: "3.5"

# 编译状态：built = 配方已完成、本机静态验证通过，尚未 conan create/CI/发布
status: built

# 构建系统类型（G4 必填）：无 Makefile/configure，直接 clang 编译单文件
build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"

# 源码信息
source:
  # 官方上游源码（无 git tag，3.5 对应 commit c6fe0c3）
  url: "https://github.com/madler/infgen/archive/c6fe0c3.tar.gz"
  sha256: "3AEEFCFA93B33529D2DA9FA9FCF37116BF485F87C0723356AFF7AAB616813CB4"
  tar_format: tar.gz

# 构建配置
build:
  system: custom
  configure_options: []
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: clang++

# 应用的补丁列表
patches_applied: []

# 编译中学到的知识
knowledge_gained:
  - "infgen 无 Makefile/configure，直接 clang 编译单文件 infgen.c 并链接静态 zlib（crc32 用于 PNG 输入）"
  - "上游无 git tag，版本 3.5 对应 commit c6fe0c3（master 已到 3.6）"
  - "HarmonyOS 可执行文件需 binary-sign-tool 签名（E077）"
  - "shadow CI 隔离 job 的 conan-home 需手动添加 ohpcd remote，否则依赖解析走 conancenter 源码构建（真机无 cmake 失败）"
  - "test_package 的 test() 在 OHOS 需用绝对路径 /data/service/hnp/bin/bash（run 环境 PATH 无 bash）"
