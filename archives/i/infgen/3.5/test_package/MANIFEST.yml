# test_package/MANIFEST.yml
package: infgen/3.5
homepage: https://github.com/madler/infgen/

upstream_test_in_build: false
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Validate the packaged executable and official version output"
    command: "infgen -h"
  - file: test.sh
    description: "Disassemble a deterministic empty gzip stream from stdin"
    command: "printf '...empty gzip...' | infgen"

assertion_count: 3
