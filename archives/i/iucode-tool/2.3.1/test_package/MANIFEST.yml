# test_package/MANIFEST.yml
# Official upstream-test and consumer-test declaration for iucode-tool 2.3.1.

package: iucode-tool/2.3.1
homepage: "https://gitlab.com/iucode-tool/iucode-tool"

# Upstream source audit: v2.3.1 GitLab archive SHA256 is
# e24951098b5753293e43689bd8e0a61c4fd2e68870672d20bb89b093dfd8b255.
upstream_tests_exist: false
upstream_test_audit:
  source_tarball: "iucode-tool-v2.3.1.tar.gz"
  source_sha256: "e24951098b5753293e43689bd8e0a61c4fd2e68870672d20bb89b093dfd8b255"
  source_origin: "https://gitlab.com/iucode-tool/iucode-tool/-/archive/v2.3.1/iucode-tool-v2.3.1.tar.gz"
  source_tree: "COPYING, configure.ac, Makefile.am, autogen.sh, intel_microcode.c, intel_microcode.h, iucode_tool.c, iucode_tool.8.in, m4/"
  scan_commands:
    - "find . -maxdepth 2 -type d -iname 'test*'"
    - "grep -RniE '(^|[[:space:]])(TESTS|check_PROGRAMS|add_test|enable_testing)' ."
    - "make check"
  scan_result: "No test/ or tests/ directory, no test framework or TESTS/check_PROGRAMS registration; make check exits 0 as an empty Automake check target. No upstream test program is present."
  make_check_output: "make check => exit 0 with no test commands (empty check target)"
  reason: "The official v2.3.1 source contains COPYING plus the Autotools build files, two implementation units, a man page, and m4 macros; no upstream test suite is provided."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Runs the packaged executable through --version, --scan-system, and --list."
    command: "bash test.sh"
  - file: conanfile.py
    description: "Resolves the Conan application package by absolute path and executes test.sh."
    command: "conan test"

assertion_count: 3
