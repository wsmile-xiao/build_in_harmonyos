# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e/L1c 读取）
# 用例数均来自设备实跑输出，逐项核对记录见 ../notes.md

package: is_utf8/1.4.1
homepage: "https://github.com/simdutf/is_utf8"

# 上游测试发现方式：tests/CMakeLists.txt 仅 add_cpp_test(unit)，ctest -N = 1 个测试程序
upstream_check_command: "cmake -S . -B build -DBUILD_TESTING=ON && cmake --build build -j2 && ctest --test-dir build --output-on-failure"

# conanfile.py build() 已集成上游测试（can_run 时 cmake.test()）
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

upstream_tests:
  - file: tests/unit.cpp
    source: is_utf8-1.4.1/tests/unit.cpp
    description: "上游 ctest 'unit' 程序（实跑输出：hard_coded 5 good + 37 bad = 42 条；brute_force 10000 个随机串 × (1 次正校验 + 1000 次位翻转差分对比参考实现) = 10,010,000 条）"
    count: 10010042
    command: "ctest --test-dir build --output-on-failure"

test_package_tests:
  - file: test.cpp
    description: "消费者测试（实跑打印 assertions=65820）：1 字节全量差分 256 + 2 字节全量差分 65536 + 定向序列 24 + 64KB SIMD 路径 3 + 空输入 1"
    count: 65820
    command: "./is_utf8_test"

upstream_test_count: 1
test_package_test_count: 1
assertion_count: 10075862
