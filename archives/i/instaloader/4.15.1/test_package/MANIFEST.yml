package: instaloader/4.15.1
homepage: https://github.com/instaloader/instaloader

# The upstream 4.15.1 sdist contains no tests/ directory or test runner.
upstream_check_command: "none (upstream sdist has no tests)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_package/smoke.py
    description: "Import the installed package, instantiate Instaloader, exercise public API symbols, and verify site-packages layout"
    command: "python3 test_package/smoke.py <installed-site-packages>"
  - file: test_package/conanfile.py
    description: "Run the installed console-script entry point with --version"
    command: "instaloader --version"

# Eight API/package-layout assertions in smoke.py plus one installed CLI
# integration test executed by conanfile.py.
assertion_count: 9
