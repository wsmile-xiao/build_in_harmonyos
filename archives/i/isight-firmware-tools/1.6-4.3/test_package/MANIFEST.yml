# test_package/MANIFEST.yml
# isight-firmware-tools 1.6-4.3 - upstream test declaration.

package: isight-firmware-tools/1.6-4.3
homepage: "https://launchpad.net/isight-firmware-tools/"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships src/{extract.c,export.c,udev.c,load.c}. The autotools suite has
  no `make check`/TESTS: tests/Makefile.am defines only a `tests` target that
  loops over AppleUSBVideoSupport* driver files (Mac OS X USBVideo driver) and
  runs ift-extract on them -- no such file is shipped and no camera is present,
  so there are no runnable upstream cases. The udev helper (ift-load) needs a
  real iSight device over USB.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_isight.sh
    description: "installed ift-extract / ift-export / ift-load: --help and error paths, plus a real Intel-HEX conversion of a synthetic firmware image"
    command: "sh test_isight.sh"

test_files:
  - path: "test_package/test_isight.sh"
    test_type: "R34"
    assertion_count: 13

test_package_test_count: 1
consumer_assertion_count: 13
upstream_test_cases: 0
assertion_count: 13
