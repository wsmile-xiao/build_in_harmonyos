software: isight-firmware-tools
display: "isight-firmware-tools"
description: "处理 Apple 内置 iSight 摄像头固件的工具（提取 / 转 Intel HEX / USB 加载）"
category: utility
homepage: "https://launchpad.net/isight-firmware-tools/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 autotools（自带 configure）的 config.sub 不认 OHOS 且 configure 期需 intltool/gettext → 绕过整个引导链，用 clang 直编三个程序 + 最小 config.h"
    - "依赖 glib/2.84.0、libgcrypt/1.11.0、libusb-compat/0.1.7（usb.h）+ 传递 libgpg-error/libusb"
    - "glib 2.84 gi18n.h 无条件 include <libintl.h> 且 _()→gettext()，OHOS sysroot libintl.h 是无 gettext 声明的空壳 → 加 gettext-tiny/0.3.3 提供真 libintl.h"
    - "上游无测试套件（tests/Makefile.am 只遍历未随包的 AppleUSBVideoSupport* 驱动文件）→ N=0"
    - "消费者测试对合成固件做真实 Intel HEX 转换并校验记录"
  common_dependencies:
    - glib/2.84.0
    - libgcrypt/1.11.0
    - libusb-compat/0.1.7
    - gettext-tiny/0.3.3

versions:
  - version: "1.6-4.3"
    status: built
    build_date: "2026-09-29"
