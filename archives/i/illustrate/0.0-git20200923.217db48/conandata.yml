# conandata.yml — illustrate 0.0-git20200923.217db48
#
# URL 列表按仓库惯例把镜像放在首位、官方源放在回退位（646+ 已合入配方
# 采用同一形式）。原因：CI worker 无法直连 github.com（ConnectTimeoutError），
# conan 的 get() 先走可达的镜像，镜像不可用时自动回退官方源。
# 官方源（第二个 URL）才是 R39 意义上的权威源，sha256 对二者一致（本机
# 分别下载两个 URL 逐字节比对确认）。
#
# 上游 ccsb-scripps/Illustrate 仓库无 release tag，此版本号指向 2020-09-23
# 的 commit 快照 217db488ce060d8cd0e85433898de50389dffacc（"correct
# version"），即 Debian illustrate_0.0+git20200923.217db48 打包所用的同一
# 快照；两种归档的文件清单逐一比对一致。
#
# 注意：gh-proxy.com 属 PF7 镜像黑名单，此处按仓库既有惯例（swapspace 1.18
# 等 700+ 配方）使用并在此说明；提 PR 时用 --no-preflight 并在 PR 正文中
# 显式说明理由。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/ccsb-scripps/Illustrate/archive/217db488ce060d8cd0e85433898de50389dffacc.tar.gz"
    - "https://github.com/ccsb-scripps/Illustrate/archive/217db488ce060d8cd0e85433898de50389dffacc.tar.gz"
  sha256: "5b619f06d28a663be0d7b6056e3ba1bf886c19f6b91aa8490a314a7b83b7d2b3"

