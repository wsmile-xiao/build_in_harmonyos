# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: illustrate/0.0-git20200923.217db48
homepage: "https://github.com/ccsb-scripps/Illustrate"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# illustrate 上游（1990s 起演化的单文件 F77 程序）无任何自动化测试：
# 仓库仅含 illustrate.f / 2hhb.inp / 2hhb.pdb / README.md / LICENSE，
# 无 Makefile、无 tests/ 目录、无 CI 配置。README 给出的验证方式即手工
# 编译后用自带样例场景（2hhb.inp + 2hhb.pdb）渲染插画肉眼检查。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# R51 清点证据：
#   - 源码树文件清单：illustrate.f, 2hhb.inp, 2hhb.pdb, README.md, LICENSE（无其他文件）
#   - 无 Makefile / CMakeLists / meson.build / tests 目录 / .github CI 配置
# 上游确无自动化测试。
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_illustrate.sh
    description: "真实运行安装的 illustrate：按 README 命令卡语法渲染 4 原子场景，断言退出码 0、atoms read: 4 原子计数回显、Fortran STOP 正常完成标记、P3 PNM 头、请求的 200x200 尺寸、非背景像素（分子真的被画出来）、opacity.pnm 伴生图写出"
    command: "sh test_illustrate.sh <illustrate-bin> <workdir>"

# 测试断言总数（test_illustrate.sh 中的 7 个互不相同断言）
assertion_count: 7
