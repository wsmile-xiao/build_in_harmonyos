version: "0.1.9.2"
software: "inhomog"

# published | built | failed | archived
status: built
build_date: "2026-09-25"
build_system: "autotools"

source:
  url: "https://bitbucket.org/broukema/inhomog/get/v0.1.9.2.tar.gz"
  sha256: "e631f37ea5496f8e24b1b62f228bc2fba7809fe9ca3bc55a0486792d5d188867"
  tar_format: tar.gz
  # 上游仓库 = https://bitbucket.org/broukema/inhomog（Debian .dsc 的 Homepage 与
  # debian/upstream/metadata 的 Repository 双源一致；tag v0.1.9.2 经 git ls-remote 实测）。
  # /downloads/v0.1.9.2.tar.gz 匿名 404、api 402 ⇒ 取官方归档端点 /get/。
  # 解包根目录为 broukema-inhomog-2e922602f729（VCS 归档命名，非规范），配方用 strip_root=True。
  # 交叉核验：与 Debian pristine orig（sha256 44545d18…7911）条目集合 diff=0、
  # AUTHORS/COPYING/README/NEWS/ChangeLog/TODO 六文件 sha256 逐字节一致 ⇒ 同一棵树。

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"   # config.sub(2016) 不认 -ohos；两侧同值走原生路径
    - "LIBS=-lgsl -lgslcblas -largp -lm"   # -largp 必需（configure 只查 argp.h 不查库）；-lm 因空 ACTION-IF-FOUND 不自动追加；gsl 两项为保险，详见 conanfile.py docstring
  dependencies:
    - gsl/2.8                  # AC_CHECK_LIB(gsl,gsl_spline_init) 硬门；2.7 在 remote 不存在
    - argp-standalone/1.5.0    # AC_CHECK_HEADER(argp.h) 硬门；包内实带 argp.h + libargp.a
  tool_dependencies: []        # 不需要：release 件自带 configure/config.guess/ltmain.sh
  cc: clang
  cxx: clang++
  package_type: library
  artifacts:
    - lib/libinhomog.so.0.2.0
    - bin/inhomog
    - include/inhomog.h
    - include/power_spectrum_flatspace.h
    - include/biscale_partition.h
    - include/parse_noempty_strtox.h
    - include/alloc_big_array.h
    - include/config.h

patches_applied:
  - "0001-configure.patch"
  - "0002-xmalloc.c.patch"

tests:
  # 五维账本（详见 notes.md 与 test_package/MANIFEST.yml）
  # N_static=17：lib/Makefile.am:32-49 的 noinst_PROGRAMS 共 21，其中 test_* 17 个；
  #   另 4 个（Omega_D_BAO / Omega_D_VAv2 / Omega_D_effWEC / effective_sigma8）是研究用
  #   驱动不是测试，不计入分母。计数由 python 正则解析，非肉眼。
  # N_registered=10：TESTS_FAST 7 + TESTS_SLOW 3（后者受 DEV_MODE 条件门，默认不跑）。
  # N_executed=17：注册 7 走 make check；3 个 SLOW 与 7 个未注册项由 build() 直接执行
  #   已编译好的二进制（不用 --enable-devmode，它会连带 -Werror -ansi -fsanitize=address）。
  # 有明确"通过"判据（上游 pass 累加器=0 或 automake PASS）=12；另 5 项逐项原因见 notes.md。
  # 分母不缩（§10.1）：合计=静态全量 17；判通过 12、判不通过 2（均为上游/依赖制品自身
  # 限制，逐项原因见 notes.md）、已执行但无通过判据 3。通过率分层写：注册 7/7、直跑 5/10、
  # 全量口径 12/17。
  upstream_tests:
    # 注册进 TESTS_FAST（make check 真实执行）
    - test_gsl_monte_carlo
    - test_ode
    - test_power_spectrum_flatspace
    - test_scale_factor
    - test_growth_function
    - test_biscale_partition
    - test_alloc_big_array
    # 注册进 TESTS_SLOW（受 DEV_MODE 条件门，默认 make check 不跑 ⇒ build() 直跑）
    - test_Omega_D
    - test_kinematical_backreaction
    - test_scale_factor_D
    # 上游编译但未注册进 TESTS（build() 直跑，不改上游注册表）
    - test_gsl_uniform
    - test_parse_noempty_strtox
    - test_scale_factor_D_Ray
    - test_scale_factor_D_Ham
    - test_sigma_invariants
    - test_gsl_multifit
    - test_gsl_ieee_mode
  upstream_static_count: 17
  registered_count: 10
  executed_count: 17
  passed_count: 12
  failed_count: 2
  no_criterion_count: 3
  skipped_count: 0
  consumer_count: 5
  consumer_passed: 5

knowledge_gained:
  - ref: "notes.md#发现与知识-1"
    text: "OHOS 交叉：CI profile 的 clang 不含 libgcc.a，上游 AC_CHECK_LIB(gcc,main) 的 AC_MSG_ERROR 需降级（0001）"
  - ref: "notes.md#发现与知识-2"
    text: "OHOS musl 无 error.h；本包仅 xmalloc.c:55 一处死包含且全树零调用 ⇒ 删包含即可，不写 error() 兼容层"
  - ref: "notes.md#发现与知识-3"
    text: "argp.h 硬门可由已发布的 argp-standalone/1.5.0 依赖满足（包内含 include/argp.h + lib/libargp.a），零改上游源码"
  - ref: "E467 + notes.md#发现与知识-4"
    text: "configure 的 run 探测因依赖共享库不可加载被误判为交叉编译 ⇒ 按 E467 注入 LD_LIBRARY_PATH/PATH，禁止用 --host/--build 绕过"
  - ref: "notes.md#发现与知识-5"
    text: "conan 走 VPATH 时上游 #include \"lib/inhomog.h\" 需显式 -I$(source_root)"
  - ref: "notes.md#发现与知识-6"
    text: "automake 维护者规则会在 make 与 make install 都触发 aclocal 重跑（OHOS 无该可执行名）⇒ 两处都要传 ACLOCAL=: 等空操作"
  - ref: "notes.md#发现与知识-7"
    text: "公开头声明的函数未必由库导出：test_power_spectrum_flatspace 在 inhomog.h 有声明但定义在未被编入库的测试程序里"

