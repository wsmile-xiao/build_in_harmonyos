sources:
  url: "https://bitbucket.org/broukema/inhomog/get/v0.1.9.2.tar.gz"
  sha256: "e631f37ea5496f8e24b1b62f228bc2fba7809fe9ca3bc55a0486792d5d188867"

patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: "configure: AC_CHECK_LIB(gcc,main) 的失败分支由 AC_MSG_ERROR 降为告警继续——OHOS clang/lld 无 libgcc.a（真机逐字 `ld.lld: error: unable to find library -lgcc`，sysroot 内 find libgcc* 零命中，运行时实为 libclang_rt.builtins.a），而该检查上游自陈面向 Solaris+f77。改动仅这一行降级，不动成功分支（该探测在本平台必失败，成功分支不可达），也不注入 -lgcc"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-xmalloc.c.patch"
    patch_description: "xmalloc.c:55 的 #include <error.h> 是全树唯一且未被使用的 gnulib 遗留包含（error()/error_at_line 全树零调用，实测 grep 计数=0）；OHOS musl 无 error.h ⇒ 逐字 fatal error: 'error.h' file not found。删掉这一行死包含即可，不引入 error() 兼容实现、不改任何行为"
    patch_type: "portability"
    strip: 1
