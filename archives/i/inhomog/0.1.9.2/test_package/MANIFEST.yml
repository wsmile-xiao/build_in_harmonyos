# test_package/MANIFEST.yml
# inhomog 0.1.9.2 上游测试与消费者测试声明

package: inhomog/0.1.9.2
homepage: "https://bitbucket.org/broukema/inhomog"

# 上游测试入口 = automake 的 TESTS（lib/Makefile.am:110-123），本配方在 conanfile.py
# build() 里以 `make check` 真实执行注册的 7 个；另 10 个已编译但默认不跑的程序由
# build() 直接执行二进制（不改上游注册表）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check（TESTS_FAST 7 个；ACLOCAL=: 等维护者规则关闭参数见 conanfile.py）"

# 静态注册（N_static=17 个 test_* 程序；TESTS 声明 10 个）
upstream_tests:
  # —— 注册且默认执行（7）：make check 实测 # PASS: 7 / # FAIL: 0 / # SKIP: 0 / # ERROR: 0
  - file: lib/test_gsl_monte_carlo.c
    executed: true
    result: pass
  - file: lib/test_ode.c
    executed: true
    result: pass
  - file: lib/test_power_spectrum_flatspace.c
    executed: true
    result: pass
  - file: lib/test_scale_factor.c
    executed: true
    result: pass
  - file: lib/test_growth_function.c
    executed: true
    result: pass
  - file: lib/test_biscale_partition.c
    executed: true
    result: pass
  - file: lib/test_alloc_big_array.c
    executed: true
    result: pass
  # —— 注册但被 DEV_MODE 条件门关掉的 3 个：直接执行已编译二进制，全部 pass = 0
  - file: lib/test_Omega_D.c
    executed: true
    result: pass
    note: "TESTS_SLOW；未用 --enable-devmode（会连带 -Werror -ansi -fsanitize=address）。直跑 41.1s / 峰值 16MB"
  - file: lib/test_kinematical_backreaction.c
    executed: true
    result: pass
    note: "TESTS_SLOW；直跑 55.1s / 峰值 7MB"
  - file: lib/test_scale_factor_D.c
    executed: true
    result: pass
    note: "TESTS_SLOW；直跑 68.9s / 峰值 9MB"
  # —— 编译但未注册进 TESTS 的 7 个：直跑并逐项留证
  - file: lib/test_gsl_uniform.c
    executed: true
    result: pass
  - file: lib/test_scale_factor_D_Ray.c
    executed: true
    result: pass
  - file: lib/test_gsl_multifit.c
    executed: true
    result: no-assertion-accumulator
    note: "程序只打印拟合结果（quad_min = 3.1416 / best fit estimate is 3.14082），无上游 pass 累加器可判 ⇒ 记为已执行不判定"
  - file: lib/test_sigma_invariants.c
    executed: true
    result: no-assertion-accumulator
    note: "只输出计时与实现规模（N_realisations = 100、mean time per thread 1.77486），无 pass 累加器"
  - file: lib/test_parse_noempty_strtox.c
    executed: true
    result: requires-cli-args
    note: "零参数直跑时上游按设计打 Warning: failed to read --multiparam value.（前若干断言 nn = 45/-42 已执行）⇒ 非 headless 判定项，不并入通过率"
  - file: lib/test_scale_factor_D_Ham.c
    executed: true
    result: fail
    note: "上游自身判据 pass = 3（3 个误差位）：EdS 与 nearly-EdS 两组初值的 a_D/dot_a_D 相对差超容差（逐字 relative diff = 0.249135，另一组 4.07407e-05）⇒ 数值积分容差敏感项，上游本就未把它注册进 TESTS；非本次适配引入"
  - file: lib/test_gsl_ieee_mode.c
    executed: true
    result: fail-platform-dependency
    note: "SIGABRT，逐字 `gsl: …/ieee-utils/fp-unknown.c:29: ERROR: the IEEE interface for this platform is unsupported or could not be determined at configure time` + `Saving GSL_IEEE_MODE: (null)` ⇒ 失败来自 gsl 制品自身的平台判定，与 inhomog 配方无关"

test_package_tests:
  - file: smoke_inhomog.c
    description: "4 项公开 API 数值断言（flat_length_3 两例 + flat_length_3_3params + 零点 fmax 托底实测 1e-100），链接安装后的 libinhomog.so 真实执行；另 1 项 exec 已签名 bin/inhomog --help（argp-standalone 路径，实测 rc=0 且首两行输出 Usage）"
    command: "test() 内实际命令：clang smoke_inhomog.c $CFLAGS $CPPFLAGS $LDFLAGS -linhomog -lm -o smoke_inhomog && ./smoke_inhomog && <包目录>/bin/inhomog --help | grep -q '^Usage: inhomog'（CLI 路径在 test_package/conanfile.py 的 C5，包目录由 self.dependencies[\"inhomog\"].package_folder 解析）"
    expected_result: "smoke_inhomog: all 4 assertions passed"

assertion_count: 5
max_rss_mb: 512   # 实测：14 个测试程序 memcap 峰值 4–16MB（最大 test_Omega_D 16MB），取 ≥30 倍余量
