# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: itstool/2.0.7
homepage: "https://itstool.org/"

# Upstream test command（如实申报：上游无测试套件）
upstream_check_command: "make check"

# Upstream test suite（规则 4 如实申报）：
# 上游 itstool 2.0.6 无测试套件——tarball 无 tests/ 目录、Makefile.am
# 无测试目标（TESTS/check_PROGRAMS）、全文件无 test/check 相关文件、
# configure.ac 无测试配置（已逐项核实）——N=0，如实申报。
upstream_tests_total: 0  # 上游 tests/ 存在（git 仓库）但 tarball 不含，无法从发布版本运行
upstream_tests_passed: 0
upstream_tests_skipped_reason: "上游存在测试套件（git 仓库 tests/ 目录——ChangeLog 证据 98 个测试文件），但 2.0.7 tarball 不含 tests/（EXTRA_DIST 排除）——需 git 拉取（gh-proxy 429 无法获取）+ Python 运行时 import libxml2（OHOS 无绑定）"
# 运行时限制如实申报（审查 P2）：itstool 核心翻译功能运行时需 python-libxml2
# 绑定（import libxml2）——OHOS python3 无此绑定，itstool 在 OHOS 仅 --version 等
# 不依赖 libxml2 的路径可用；核心翻译功能运行时受限（环境限制，非适配问题），
# 编译打包不受影响（已跳过 configure 的硬检测——补丁 0001）

# Upstream tests not run in build (none exist upstream; consumer-side test
# covers real execution of itstool)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_itstool.sh
    description: "Run itstool --version to verify tool executes"

# Test assertion count
assertion_count: 1
