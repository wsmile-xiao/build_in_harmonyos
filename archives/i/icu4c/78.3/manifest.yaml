build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://master.dl.sourceforge.net/project/international-component.mirror/release-78.3/icu4c-78.3-sources.tgz"
  sha256: "3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0"
  tar_format: tar.gz
  # 上游标签是点号 release-78.3（77 那批才是连字符 release-77-1），
  # 源包资产名同样是点号 icu4c-78.3-sources.tgz（77 是 icu4c-77_1-src.tgz）。
  # 校验链：上游 icu4c-78.3-sources.md5 = a7b736b570ef0e180c96a31715a00c78、
  # 上游 SHASUM512.txt = 04a49455e1489030c520a4bfd2664fa2…04d9085a0895d91ce225245、
