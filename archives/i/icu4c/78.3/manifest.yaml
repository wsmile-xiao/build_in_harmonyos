  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-use-readable-umask-for-configure.patch"
  - "0002-use-tmpdir-for-ucptrie-golden-tempfile.patch"
  - "0003-skip-hmdfs-cwd-tests-on-ohos.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ICU 78.x 起上游改用点号标签 release-78.3 与点号资产名 icu4c-78.3-sources.tgz；77 及以前是 release-77-1 / icu4c-77_1-src.tgz，按老命名拼 URL 必 404"
  - "ICU 78 的 config.sub 已自带 ohos*/linux-ohos* 分支，配方显式传 --build/--host 时 config.guess 根本不被调用，无需再打 config.guess/config.sub 补丁"
  - "上游 configure.ac 对 --enable-layout 直接 AC_MSG_ERROR(The ICU Layout Engine has been removed.)，78 起必须显式 --disable-layout 或干脆不传"
  - "OHOS 的 P_tmpdir=/tmp 是只读的，libc tmpfile() 返回 NULL（errno=13 EACCES），上游 test/cintltst/ucptrietest.c 判空前使用它会在 make check 阶段中止"
  - "OHOS CI worker 的 HMDFS 不支持 getcwd/chdir；TestTZDataDir 和 TestFileStream 因此在 OHOS 构建中排除，其余 ICU xcheck 测试仍执行并作为失败门禁"
  - "HMDFS 上 (umask 077 && mktemp -d) 建出的目录属主自己都不可写（drwx--S---），autoconf 的 as_fn 临时目录段因此失败，需 077→022"
  - "Conan 2.29 的 core.sources:download_cache 命中路径是 <cache>/s/<sha256>（conan/internal/rest/download_cache.py source_path），真机取不到 github 时可用它跑「与提交件逐字节相同」的配方；但 core.* 不能用 conan create -c 传（报 'core.*' configurations are not allowed in profiles），只能写进自己那份 global.conf 且必须是裸 key=value"
  - "apply_conandata_patches() 走 patch-ng，按 hunk 声明行号严格定位：跨版本复用补丁时 git apply --check 与 GNU patch --dry-run 都能过，conan 照样 Failed to apply patch（icu4c 77→78.3 的 configure 该段前移 182 行，@@ -9284 必须改成 @@ -9102）"
  - "真机直连 github.com 会整体不可达（curl -4 超时、python requests ConnectTimeout），而 objects.githubusercontent.com / codeload.github.com 仍可达，release 资产 URL 恰好落在前者不可达的域上"
  - "make xcheck 与 make check 跑同一批套件，额外写出 $(top_builddir)/test-<suite>.xml，逐用例计数比解析 stdout 摘要可靠"
  - "test/Makefile.in 的 LETEST 由 @LAYOUTEX_TRUE@ 门控、fuzzer 默认 false、testdata 的 check-local 是空规则 → --disable-layoutex 时上游实际注册用例的套件只有 intltest/cintltst/iotest"
  - "ICU 78.3 源包内 LICENSE 第一行是 UNICODE LICENSE V3（SPDX Unicode-3.0），不是 Unicode-DFS-2016"

