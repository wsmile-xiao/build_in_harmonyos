# conandata.yml — icu4c 78.3
# Official ICU 78.3 source release. Upstream tags this release "release-78.3"
# (dotted tag, unlike the hyphenated release-77-1) and names the source asset
# icu4c-78.3-sources.tgz (dotted, unlike the icu4c-77_1-src.tgz style).
# Verified against the upstream SHASUM512.txt and icu4c-78.3-sources.md5 assets.

sources:
  # Official ICU GitHub release asset. CI may inject a mirror for this URL.
  url: "https://github.com/unicode-org/icu/releases/download/release-78.3/icu4c-78.3-sources.tgz"
  sha256: "3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0"

patches:
  - patch_file: "patches/0001-use-readable-umask-for-configure.patch"
    patch_description: "Create Autoconf temp dirs with a readable umask; HMDFS denies 077 dirs even to their owner"
    patch_type: "portability"
  - patch_file: "patches/0002-use-tmpdir-for-ucptrie-golden-tempfile.patch"
    patch_description: "Fall back to TMPDIR in ucptrietest; OHOS keeps /tmp read-only so libc tmpfile() returns NULL"
    patch_type: "portability"
  - patch_file: "patches/0003-skip-hmdfs-cwd-tests-on-ohos.patch"
    patch_description: "Skip two filesystem tests whose getcwd/chdir operations are unsupported on the OHOS worker's HMDFS"
    patch_type: "portability"
