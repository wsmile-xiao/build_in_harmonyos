# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求此文件存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: icu4c/78.3
homepage: "https://icu.unicode.org/"

# 上游官方测试命令。`make check` 与 `make xcheck` 跑同一批套件，
# xcheck 额外把逐用例结果写成 $(top_builddir)/test-<套件>.xml（JUnit），
# 配方解析这些 XML 来断言「跑了多少条、失败多少条」。
upstream_check_command: "make check"
upstream_test_command: "make xcheck"
upstream_test_in_build: true
upstream_tests:
  - suite: testdata
    note: "只重建并校验 .dat 数据，不注册 <testcase>"
  - suite: intltest
    report: test-intltest.xml
  - suite: cintltst
    report: test-cintltst.xml
  - suite: iotest
    report: test-iotest.xml

# 未运行/被排除的上游套件与原因（逐条实测，见 notes.md 的取数命令）
upstream_tests_not_run:
  - suite: cintltst/udatatst/TestTZDataDir
    reason: "OHOS CI 的 HMDFS 不支持该测试所需的 getcwd/chdir 操作；仅在 OHOS 编译时排除"
  - suite: cintltst/tsutil/crestst/TestFileStream
    reason: "OHOS CI 的 HMDFS 不支持该测试所需的 getcwd/chdir 操作；仅在 OHOS 编译时排除"
  - suite: perf
    reason: "xcheck/check 均不包含 perf/，需显式 make xperf（上游定位为性能基准而非正确性测试）"
  - suite: letest
    reason: "test/Makefile.in 的 LETEST 变量由 @LAYOUTEX_TRUE@ 门控，本配方 --disable-layoutex 故不注册"
  - suite: fuzzer
    reason: "configure.ac 默认 fuzzer=false，需 --enable-fuzzer 才进 SUBDIRS"
  - suite: compat
    reason: "test/compat 是 ICU4J/Japanese 编译器兼容性套件，不在 test/Makefile.in 的 SUBDIRS 内"
  - suite: thaitest
    reason: "test/thaitest 需外部 Thai locale 语料，同样不在 SUBDIRS 内"

# test_package 自带的消费者测试（鸿蒙平台视角）
test_package_tests:
  - name: icu4c-consumer
    file: test_icu4c.cpp
    command: "./test_icu4c"
    assertion_count: 36
  - name: icu4c-package-layout
    file: test_package_artifacts.sh
    command: "sh test_package_artifacts.sh <package_folder>"
    assertion_count: 22

assertion_count: 58
