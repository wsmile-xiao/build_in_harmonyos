knowledge_gained:
  - "上游 CMake 的 **INSTALL_INTERFACE 必须被 Conan 的 cpp_info 镜像**，否则消费者编译不过。实例：Ceres 的公共头文件（ceres/internal/fixed_array.h 等）会 `#include \"glog/logging.h\"`；MINIGLOG 模式下这个 include 由上游自带头满足，而上游用 `target_include_directories(ceres BEFORE PUBLIC $<INSTALL_INTERFACE:${CMAKE_INSTALL_INCLUDEDIR}/ceres/internal/miniglog>)` 把它作为 PUBLIC 安装面导出——Conan 的 cpp_info 默认只声明 `include`，于是消费者报 `fatal error: 'glog/logging.h' file not found`。修法：package_info() 里把该目录一并写进 includedirs（本包做法）。"
  - "Ceres 的 glog 检测（cmake/FindGlog.cmake）不能识别 Conan 生成的 glog 配置：即便 CMakeDeps 已声明 glog::glog 目标（日志出现 \"Conan: Target declared 'glog::glog'\"），上游仍以 GLOG_FOUND 为空走到 FATAL_ERROR（Can't find Google Log）。因此**默认走 MINIGLOG**是最省事且依赖最少的口径（依赖链只剩 eigen）；若要启用真实 glog，需要额外处理上游 FindGlog 的识别问题。"
  - "Ceres 2.2 的其它依赖都可以用上游开关关掉：GFLAGS=OFF、SUITESPARSE=OFF 后稀疏求解改走 Eigen（EIGENSPARSE=ON），再关掉 LAPACK/CUDA/示例/基准/测试即可把依赖压到「eigen（+ 可选 glog）」。依赖越少，交叉适配的失败面越小。"
  - "eigen 的制品仓包是 header-library（package_type=header-library），其 Conan 侧把 cmake_file_name 设为 Eigen3、target 设为 Eigen3::Eigen、includedirs 为 include/eigen3 —— 因此凡是上游写 find_package(Eigen3 3.3 REQUIRED) 的库，只要 requires(eigen/3.4.x) 就能被 CMakeDeps 直接满足，无需任何补丁。"
  - "消费者侧的传递依赖要显式声明：只写 requires(ceres) 时，Conan 不会为**传递依赖**（Eigen）生成 CMakeDeps 配置文件，头文件目录也可能拿到相对值（实测出现 'Eigen/Core' file not found）。两种正确做法：配方里用 cpp_info.requires 声明传递依赖；或 test_package 里显式 requires 这些头文件型依赖（本包两者都做了）。"
  - "Ceres 的 CMake 会生成大量 schur_eliminator_*/partitioned_matrix_view_* 模板翻译单元，单 TU 编译峰值内存达 1–2 GB：在内存受限的构建机（如默认 7 GB 的 WSL2）上按 nproc 并行会被 OOM killer 杀掉（Error 137），甚至拖挂整个 WSL VM。应显式限制并行度（Conan: -c tools.build:jobs=N）而不是依赖默认值。"
  - "cmake_minimum_required(VERSION 3.16...3.27) 这类“范围式”声明在现代 CMake 下是安全的，不需要像 2.8/3.0 老包那样钉 CMAKE_POLICY_VERSION_MINIMUM。"
