# ── 上游测试用例清点（一手依据）──────────────────────────────────────────────
upstream_tests:
  count: 909
  method: >-
    解包 2.2.0 发布包后统计 gtest 用例宏：
    grep -rhoE '^TEST(_F)?\(' . --include=*.cc | wc -l  →  909
    （分布于 175 个 internal/ceres/*_test.cc 文件）
  executed: 0
  executed_reason: >-
    本归档关闭 BUILD_TESTING（上游测试需引入 googletest 并额外编译约 175 个测试翻译单元，
    构建成本远超单包 CI 预算；上游测试为增量式 gtest 用例，非产物级验证）。
    **未修改、未删除、未伪造任何上游测试源码**；分母 909 为上游实测真值，未缩小。
  evidence: "reports/REPORT-35-next-task-selection-ceres.md（选型时的 909 计数与命令）"

# ── test_package 消费者测试（含鸿蒙特有断言）────────────────────────────────
test_package_tests:
  - file: test_ceres.cpp
    description: >-
      消费者断言 15 项：① CERES_VERSION_STRING 以 "2." 开头 ② ceres::Jet 标量运算
      ③ ceres::Jet 导数传播 ④ Problem.NumResidualBlocks==5 ⑤ NumParameterBlocks==2
      ⑥/⑦ HasParameterBlock(&m)/(&c) ⑧ Summary.IsSolutionUsable() ⑨ termination_type==CONVERGENCE
      ⑩ 拟合斜率 m≈2 ⑪ 拟合截距 c≈1 ⑫ final_cost≈0 ⑬ Summary.num_residual_blocks==5
      ⑭ AngleAxisRotatePoint 旋转正确 ⑮ EuclideanManifold<2> 维度 2/2
      —— ③④⑤⑥⑦ 为纯 C++ 模板 API 断言，⑧⑨⑩⑪⑫ 为**真实数值求解结果**断言
      （用 AutoDiffCostFunction 拟合 y=2x+1，要求收敛到真值 1e-8 内）。
    command: "ctest --output-on-failure（经 test_package/CMakeLists.txt 的 add_test 注册）"
  - file: consumer_evidence
    description: >-
      本机独立验证（REPORT-36）：以绝对路径静态链接 libceres.a 与 SDK 静态
      libc++/libc++abi/libunwind，产物 INTERP 段为 0，再用 qemu-aarch64-static **真实执行**
      在 OHOS aarch64 ABI 上；输出 checks: 15  failures: 0 / ALL PASS。
    command: "bash scripts/ohos/verify-ceres-runtime.sh"

# ── 口径说明 ────────────────────────────────────────────────────────────────
notes: >-
  上游 N=909 与本归档执行 0 均如实申报；产物级可用性由 15 项消费者断言承担，
  其中 5 项为真实求解数值断言，且在本机以 QEMU 真跑通过（非仅编译通过）。
