software: ceres
display: "Ceres Solver"
description: "Ceres Solver——大规模非线性最小二乘与优化库（自动微分、信赖域/线搜索求解器、稀疏线性代数）"
category: data
homepage: "https://github.com/ceres-solver/ceres-solver"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "依赖只有 Eigen3（制品仓 eigen/3.4.1 为 header-library，Conan 侧已声明 cmake_file_name=Eigen3、target=Eigen3::Eigen），因此无需任何补丁即可满足上游 find_package(Eigen3 3.3 REQUIRED)"
    - "glog 走上游 MINIGLOG 模式（GFLAGS/SUITESPARSE/LAPACK/CUDA/TESTING/EXAMPLES/BENCHMARKS 全关），依赖链压到只剩 eigen"
    - "MINIGLOG 模式下 Ceres 公共头文件会 #include \"glog/logging.h\"，上游以 INSTALL_INTERFACE 把 include/ceres/internal/miniglog 作为 PUBLIC 导出；Conan 配方必须把它镜像进 cpp_info.includedirs，否则消费者编译报 fatal error: 'glog/logging.h' file not found"
    - "上游 FindGlog 无法识别 Conan 生成的 glog 配置（即便 glog::glog 目标已声明仍报 Can't find Google Log），故默认不启用真实 glog"
    - "消费者测试以绝对路径静态链接 libceres.a，零运行时 .so 依赖"
  common_dependencies:
    - "eigen/3.4.1"

versions:
  "2.2.0":
    status: built
    build_date: "2026-09-28"
    conan_ref: "ceres/2.2.0"
