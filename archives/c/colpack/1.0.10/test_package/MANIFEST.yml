# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: colpack/1.0.10
homepage: "https://github.com/CSCsw/ColPack"

# 上游测试命令：Makefile.am 第 88 行 TESTS = ${basic_examples_PROGRAMS}
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# （上游测试在鸿蒙设备原生 autotools 环境实测，见 notes.md/PR 记录；配方只负责库构建）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（automake TESTS 注册的 5 个自包含示例，
# 数据依赖 Graphs/ 目录，需在源码树根目录构建运行；设备实测 5/5 PASS）
upstream_tests:
  - file: SampleDrivers/Basic/color_bipartite_graph_using_BipartiteGraphBicoloringInterface.cpp
    source: colpack-1.0.10/SampleDrivers/Basic/
    description: "二部图着色（BipartiteGraphBicoloringInterface）冒烟测试"
    command: "make check (automake parallel-tests harness)"
  - file: SampleDrivers/Basic/color_bipartite_graph_using_BipartiteGraphPartialColoringInterface.cpp
    source: colpack-1.0.10/SampleDrivers/Basic/
    description: "二部图部分着色（BipartiteGraphPartialColoringInterface）冒烟测试"
    command: "make check (automake parallel-tests harness)"
  - file: SampleDrivers/Basic/color_graph_using_GraphColoringInterface.cpp
    source: colpack-1.0.10/SampleDrivers/Basic/
    description: "图着色（GraphColoringInterface，读 Graphs/mtx-spear-head.mtx）冒烟测试"
    command: "make check (automake parallel-tests harness)"
  - file: SampleDrivers/Basic/Generate_seed_matrix_for_Hessian.cpp
    source: colpack-1.0.10/SampleDrivers/Basic/
    description: "Hessian 种子矩阵生成冒烟测试"
    command: "make check (automake parallel-tests harness)"
  - file: SampleDrivers/Basic/Generate_seed_matrix_for_Jacobian.cpp
    source: colpack-1.0.10/SampleDrivers/Basic/
    description: "Jacobian 种子矩阵生成冒烟测试"
    command: "make check (automake parallel-tests harness)"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：内嵌上游 mtx-spear-head.mtx 矩阵，真实调用 GraphColoringInterface 完成 SRC_FILE 解析 + LARGEST_FIRST/DISTANCE_TWO 着色，断言颜色向量规模与取值合法性"
    command: "./test_colpack"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 5
