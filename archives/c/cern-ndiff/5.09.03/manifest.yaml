# 版本级 manifest
# 文件位置: archives/c/cern-ndiff/5.09.03/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.09.03"

# 软件名
software: "cern-ndiff"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (MAD-X 官方 GitHub release tag, ndiff 位于 tools/numdiff 子目录)
  url: "https://github.com/MethodicalAcceleratorDesign/MAD-X/archive/refs/tags/5.09.03.tar.gz"

  # 源码校验和 (与 Homebrew cern-ndiff 5.09.03 formula 公布值一致)
  sha256: "cd57f9451e3541a820814ad9ef72b6e01d09c6f3be56802fa2e95b1742db7797"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "patches/0001-fix-test-register-oracle.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "MAD-X 整包下载、只构建 tools/numdiff 子目录：conanfile 以 build_script_folder 指向子目录，避免为子工具单独寻找不存在的上游分包"
- "上游 cmake_minimum_required(VERSION 2.4) 在 CMake 4.x 下直接报错，需 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容（与 Homebrew cern-ndiff formula 同款 workaround）"
- "上游 test-register 的 CTest 断言过期（2012 年的一刀切 diffs detected over vs 2013 年加入的延迟演示数据，正确结果恒为 0 diffs）：以 test-only 补丁按上游 test-register.ref 修正该用例的 PASS_REGULAR_EXPRESSION，ctest 仍跑真实二进制与真实数据"
