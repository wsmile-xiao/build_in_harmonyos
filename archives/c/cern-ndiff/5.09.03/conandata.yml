# conandata.yml — cern-ndiff 5.09.03
# Source: official MAD-X GitHub release tag 5.09.03.
# ndiff is a sub-project of MAD-X (tools/numdiff); there is no standalone
# ndiff tarball, so the recipe downloads the MAD-X tag archive and builds
# only the tools/numdiff sub-directory (same approach as Homebrew).
# SHA-256 matches the value published in the Homebrew cern-ndiff formula
# for the 5.09.03 tag archive.
# Download reliability: GitHub direct is slow/unreachable from真机/CI;
# list gh-proxy mirror first (same mapping as ci/conan/build_and_test.sh),
# official URL last as fallback. Mirror serves the identical archive,
# so sha256 is unchanged.

sources:
  url:
    - "https://gh-proxy.com/https://github.com/MethodicalAcceleratorDesign/MAD-X/archive/refs/tags/5.09.03.tar.gz"
    - "https://github.com/MethodicalAcceleratorDesign/MAD-X/archive/refs/tags/5.09.03.tar.gz"
  sha256: "cd57f9451e3541a820814ad9ef72b6e01d09c6f3be56802fa2e95b1742db7797"

patches:
  - patch_file: "patches/0001-fix-test-register-oracle.patch"
    patch_description: "Correct the stale CTest oracle for test-register: expect 'do not differ' per the committed reference output (tests/test-register/test-register.ref ends with '81 lines have been diffed', zero diffs)"
    patch_type: "test"
