# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cern-ndiff/5.09.03
homepage: "https://mad.web.cern.ch/mad/"

# 上游测试命令 (tools/numdiff/CMakeLists.txt 注册 3 个 CTest 用例,
# 以 ctest -N 口径清点；另有 Makefile_test 的 make 侧用例，CMake 路径不覆盖)
upstream_check_command: "cmake -S tools/numdiff -B build && cmake --build build && ctest -N"

# conanfile.py build() 方法中已通过 cmake.test() 集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: test-register
    source: MAD-X-5.09.03/tools/numdiff/tests/test-register/test-register.nd.lhs
    description: "上游 CTest 用例 test-register：运行 ndiff 比较 tests/test-register 下的 .nd.{lhs,rhs,cfg}；该用例为寄存器延迟演示，正确结果为 0 diffs（与上游 test-register.ref 一致），补丁将其判定条件修正为输出匹配 do not differ"
    command: "ctest -R test-register"
  - file: test-register-2
    source: MAD-X-5.09.03/tools/numdiff/tests/test-register-2/test-register-2.nd.lhs
    description: "上游 CTest 用例 test-register-2：运行 ndiff 比较 tests/test-register-2 下的 .nd.{lhs,rhs,cfg}，输出匹配 diffs detected over"
    command: "ctest -R test-register-2"
  - file: test-register-3
    source: MAD-X-5.09.03/tools/numdiff/tests/test-register-3/test-register-3.nd.lhs
    description: "上游 CTest 用例 test-register-3：运行 ndiff 比较 tests/test-register-3 下的 .nd.{lhs,rhs,cfg}，输出匹配 diffs detected over"
    command: "ctest -R test-register-3"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ndiff.sh
    description: "真实运行打包后的 bin/ndiff：检查二进制存在可执行、容差内文件对退出 0、超容差文件对输出 diffs detected"
    command: "bash test_ndiff.sh <package bin dir>"

# 测试断言总数 (用于质量评估)
# test_ndiff.sh 执行 3 项检查：二进制存在可执行、容差内比较退出 0、
# 超容差比较报告 diffs detected；任一失败即非零退出。
assertion_count: 3
