# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
#
# 上游测试事实（已逐一读官方源码 v1.0.0 tag commit 5a795daf 确认）:
#   官方测试入口: make tests（唯一测试目标，仅编译，不运行）
#   官方测试总数: 5 个可执行文件 (test_gpio/i2c/mmio/serial/spi)
#   官方 CI (master .github/workflows/build.yml): make all tests —— 只编译，
#     从不运行测试二进制
#   5 个测试全部需要真实硬件 (GPIO 跳线/I2C EEPROM/物理 MMIO 寄存器/串口回环/
#     SPI 回环) + 交互式 stdin (getc)，官方测试假设 BeagleBone Black
#   OHOS 构建机: 无 /dev/i2c-*、/dev/spidev*、/dev/mem，/sys/class/gpio 不可写
#   => 上游 5/5 测试在无硬件 CI 环境不可执行（环境限制，非依赖缺失）
#   => 本 run 按上游测试门禁上报 AWAITING_USER_TEST_DECISION，
#      不做整目录/整标签 skip，不伪造通过统计

package: c-periphery/1.0.0
homepage: "https://github.com/vsergeev/c-periphery"

# 上游测试命令（官方 Makefile 的唯一测试目标）
upstream_check_command: "make tests"

# conanfile.py build() 中执行 make tests —— 官方该目标本身只编译不运行；
# 本配方在 build() 中复现该编译验证（5/5 测试二进制可编译），但不运行测试
# 二进制（运行需要真实硬件，见上方事实）。编译验证 ≠ 测试通过。
upstream_test_in_build: true
upstream_test_command: "make tests"

# 上游测试逐项声明（5 项，全部因硬件前提在本环境不可执行）
upstream_tests:
  - file: tests/test_gpio.c
    source: c-periphery-1.0.0.tar.gz/tests/test_gpio.c
    description: "GPIO 读写/回环/交互测试；需真实 GPIO 跳线 + 万用表 + 3 次 getc(stdin)"
    command: "./test_gpio <pin1> <pin2>"
    executed: false
    reason: "需要真实 GPIO 硬件与交互 stdin；OHOS 构建机 /sys/class/gpio 不可写"
  - file: tests/test_i2c.c
    source: c-periphery-1.0.0.tar.gz/tests/test_i2c.c
    description: "I2C 传输/EEPROM 回环测试；需 /dev/i2c-* + EEPROM + 逻辑分析仪 + 2 次 getc"
    command: "./test_i2c <bus1> <eeprom-addr> <bus2>"
    executed: false
    reason: "需要 /dev/i2c-* 与 EEPROM 硬件；OHOS 构建机无 i2c 设备节点"
  - file: tests/test_mmio.c
    source: c-periphery-1.0.0.tar.gz/tests/test_mmio.c
    description: "MMIO 寄存器读写测试；源码明写 assumes BeagleBone Black，写物理寄存器 + getc"
    command: "./test_mmio"
    executed: false
    reason: "假设 BeagleBone Black 物理硬件 + /dev/mem；OHOS 构建机无 /dev/mem"
  - file: tests/test_serial.c
    source: c-periphery-1.0.0.tar.gz/tests/test_serial.c
    description: "串口配置/回环测试；需 /dev/tty* TX-RX 跳线 + 逻辑分析仪 + 6 次 getc"
    command: "./test_serial <port>"
    executed: false
    reason: "需要真实串口设备与 TX/RX 跳线；OHOS 构建机 tty 节点无权限"
  - file: tests/test_spi.c
    source: c-periphery-1.0.0.tar.gz/tests/test_spi.c
    description: "SPI 传输/回环测试；需 /dev/spidev* + MISO/MOSI 跳线 + 10 次 getc"
    command: "./test_spi <spidev>"
    executed: false
    reason: "需要 /dev/spidev* 硬件；OHOS 构建机无 spidev 设备节点"

# test_package 自带测试（消费者视角，本环境实际执行）
test_package_tests:
  - file: test_periphery.c
    description: "链接 periphery.a，调用 gpio/i2c/serial/mmio/spi 五个子系统核心 API 与错误处理路径（17 项断言：参数校验错误码 + 缺失设备节点的 *_ERROR_OPEN/ENOENT/errmsg 语义）"
    command: "./test_periphery"

# 测试断言总数
assertion_count: 17
