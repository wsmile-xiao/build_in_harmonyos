patches:
  - patch_file: "patches/0001-ohos-termios-speed.patch"
    patch_description: "route baudrate setting through the POSIX termios API (cfsetispeed/cfgetospeed/cfsetospeed/cfgetospeed) instead of direct c_ispeed/c_ospeed member access so the code compiles unchanged on every platform; no platform conditional-compilation macro is introduced; non-standard rates (e.g. 128000/135000) fail explicitly with SERIAL_ERROR_CONFIGURE (documented behavior change vs upstream)"
    patch_type: "portability"
