# test_package/MANIFEST.yml — c-periphery 2.5.0
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
# 上游测试盘点（真实，未伪造）

package: c-periphery/2.5.0
homepage: https://github.com/vsergeev/c-periphery

# 上游测试入口：CMake 自定义 tests 目标（无 CTest 注册，ctest -N 为 0）
upstream_check_command: "cmake --build <build_dir> --target tests"

# conanfile.py build() 中已编译链接全部上游测试程序（tests 目标），
# 但不执行——8 个测试程序全部需要真实外设硬件，CI/验证环境无这些设备。
upstream_test_in_build: false
upstream_test_command: "tests/test_serial <真实串口设备>（需硬件，不执行）"

# 上游测试列表（CMakeLists.txt: file(GLOB_RECURSE periphery_TESTS tests/*.c)）
upstream_tests:
  - file: tests/test_serial.c
    source: c-periphery-2.5.0/tests/test_serial.c
    description: "串口收发/流控/属性测试，需真实串口设备（/dev/ttyS* 或 /dev/ttyUSB*）"
    command: "test_serial <device>（需硬件）"
  - file: tests/test_gpio.c
    source: c-periphery-2.5.0/tests/test_gpio.c
    description: "GPIO cdev 接口测试，需 /dev/gpiochip* 字符设备"
    command: "test_gpio <path> <line>（需硬件）"
  - file: tests/test_gpio_sysfs.c
    source: c-periphery-2.5.0/tests/test_gpio_sysfs.c
    description: "GPIO sysfs 旧接口测试，需可写 /sys/class/gpio 与真实 GPIO"
    command: "test_gpio_sysfs <gpio>（需硬件）"
  - file: tests/test_led.c
    source: c-periphery-2.5.0/tests/test_led.c
    description: "LED 测试，需 /sys/class/leds/<led> 设备"
    command: "test_led <led>（需硬件）"
  - file: tests/test_pwm.c
    source: c-periphery-2.5.0/tests/test_pwm.c
    description: "PWM 测试，需 /sys/class/pwm/pwmchip* 设备"
    command: "test_pwm <chip> <channel>（需硬件）"
  - file: tests/test_spi.c
    source: c-periphery-2.5.0/tests/test_spi.c
    description: "SPI 回环收发测试，需 /dev/spidev* 设备"
    command: "test_spi <device>（需硬件）"
  - file: tests/test_i2c.c
    source: c-periphery-2.5.0/tests/test_i2c.c
    description: "I2C 传输测试，需 /dev/i2c-* 总线设备"
    command: "test_i2c <device> <addr>（需硬件）"
  - file: tests/test_mmio.c
    source: c-periphery-2.5.0/tests/test_mmio.c
    description: "MMIO 寄存器访问测试，需可访问 /dev/mem 与物理地址"
    command: "test_mmio <base> <size>（需硬件/内核许可）"

hardware_unrunnable: 8

# test_package 自带消费者测试（无硬件可复现）
test_package_tests:
  - file: test_periphery.c
    description: "编译链接 libperiphery 并实质调用 API：periphery_version() 版本断言 + serial_open 无效路径错误路径断言（失败返回/errno 置位/错误消息非空）"
    command: "./test_periphery"

# 断言计数：serial_new 分配 1 + 版本串 1 + open 失败 1 + errno 置位 1 + errmsg 非空 1
assertion_count: 5
