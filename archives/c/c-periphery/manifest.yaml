# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: c-periphery
display: "c-periphery"
description: "用户态 Linux 外设 I/O C 库：GPIO（cdev v2/v1/sysfs）、LED、PWM、SPI、I2C、MMIO、Serial 接口访问"
category: library
homepage: "https://github.com/vsergeev/c-periphery"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 C99 零外部依赖（仅标准 C 库 + Linux 内核接口），CMake >=3.19 直接构建"
    - "CMake 自动探测 linux/gpio.h 决定 GPIO cdev v2/v1 支持，缺失时回退 legacy sysfs GPIO"
    - "上游 tests/*.c 8 个测试程序全部需要真实外设硬件，CI 环境不可执行，仅编译链接验证（HMBS 标记如实上报 skipped）"
  common_dependencies: []

versions:
  "2.5.0":
    status: built
    build_date: "2026-08-30"
