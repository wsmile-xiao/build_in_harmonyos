# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.16/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.16"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: "{BUILD_SYSTEM}"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/civetweb/civetweb/archive/refs/tags/v1.16.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x 拒绝 cmake_minimum_required(<3.5)：conanfile generate() 用 cache_variables 注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（复用 DRAFT-E321）"
  - "cmake_layout 默认 build 目录与源码根目录 build 文件冲突（NotADirectoryError）：build_folder='cmake-build'（复用 E470）"
  - "Check 框架临时目录优先级 TEMP>P_tmpdir>TMPDIR，/tmp 只读时须设 TEMP（新增知识草稿 DRAFT-civetweb-001）"
  - "OHOS musl netdb.h 特性宏保护，gethostbyname 隐式声明需 -D_DEFAULT_SOURCE（新增知识草稿 DRAFT-civetweb-001）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
