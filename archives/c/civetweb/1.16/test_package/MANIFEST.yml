# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: civetweb/1.16
homepage: "https://github.com/civetweb/civetweb"

# 上游测试入口：CMake CTest（unittest/ 子目录，基于 Check 框架）。
# 完整枚举台账见任务回报 upstream_test_ledger。
upstream_check_command: "cmake --build . --target check; ctest"

# conanfile.py build() 中未集成上游测试（因上游 unittest 依赖 Check 框架联网下载）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（见 notes.md / 任务回报台账）
upstream_tests:
  - file: unittest/main.c
    source: civetweb-1.16/unittest/main.c
    description: "上游单元测试主程序（Check 框架，含 cgi/lua/ssl 子套件），完整枚举见汇报台账"
    command: "./unittest/civetweb_tests"

# test_package 中自带的测试（消费者视角验证：真实调用 civetweb C API）
test_package_tests:
  - file: test.c
    description: "消费者测试：mg_init_library/mg_start2/mg_set_request_handler/mg_stop 真实调用"
    command: "./test_civetweb"

# 测试断言总数（近似值，用于质量评估；上游完整枚举见汇报台账）
assertion_count: 5