package: cataract/1.0.0
homepage: "http://cgg.bzatek.net/"

# 上游无测试套件：upstream_check_command 必须为空，避免清单器误判为存在测试
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests_exist: false
# 审计 cataract 1.0.0 上游源码 (http://cgg.bzatek.net/files/cataract-1.0.0.tar.bz2,
# sha256 561cd8f4bf71fdb0cb190a26dee44c1a1013648633ea68deffa9b064dbaf1417)：
# - Makefile.am: SUBDIRS=src/templates/sample, 无 TESTS/check_PROGRAMS/check-local
# - src/Makefile.am: 仅 bin_PROGRAMS=cgg + bin_SCRIPTS=cgg-dirgen，无 TESTS
# - configure.ac: 仅 PKG_CHECK_MODULES(LIBS) + AC_CONFIG_FILES，未注册任何测试框架
# - tarball file list: 解压后无 tests/test/*_test.cc/test_*.py 等测试文件；sample 仅为示例相册
# - make -n check (dry-run): 仅打印空操作，无实际编译/运行的测试程序
# 结论：上游 1.0.0 未提供任何自动化测试套件，归为 no_tests，按 TEST_QUALITY_SPEC 需在 test_package 提供真实消费者测试
# HMBS 硬门禁要求 no_tests 时 marker 每轮必现：主配方 build() 与 test_package test() 均会复发
# HMBS_UPSTREAM_TEST_RESULT(status=no_tests, discovered=0, executed=0)（缓存命中时 build() 被跳过，靠 test_package 保证证据必现）
upstream_test_audit: "审计 cataract 1.0.0 上游（Makefile.am/src/Makefile.am/configure.ac/tarball）：1) Makefile.am SUBDIRS=src/templates/sample，无 TESTS/check_PROGRAMS/check-local；2) src/Makefile.am 仅 bin_PROGRAMS=cgg + bin_SCRIPTS=cgg-dirgen，无 TESTS；3) configure.ac 仅 PKG_CHECK_MODULES(LIBS) + AC_CONFIG_FILES，未注册任何测试框架 (gtest/ctest/pytest)；4) tarball 解压后无 tests/test/*_test.cc/test_*.py 等测试文件，sample 仅为示例相册；5) make -n check 仅空操作。上游确实无测试套件，HMBS_UPSTREAM_TEST_RESULT(status=no_tests) 标记由主配方 build() 与 test_package test() 每轮复发（包缓存命中时靠 test_package 保证标记必现）。"
reason: "cataract 1.0.0 上游无测试套件：无 TESTS/check 目标、无 tests/ 目录、无测试源文件；make check 为空操作（no_tests）"

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "真实调用 cgg 二进制: --help/--version 退出 0 且端到端相册生成 (sample/src -> out) 验证 HTML 产出"
    command: "$SHELL test.sh <package_folder>"
  - file: test.sh (case 2)
    description: "cgg-dirgen 辅助脚本生成 index.xml 模板并校验 XML 合法性"
    command: "$SHELL test.sh <package_folder> # 第二阶段 dirgen"
  - file: test.sh (case 3)
    description: "stub thumbnail 回退: 无 MagickWand 时 create_thumbnail 退化为拷贝，验证 out 中图片与源大小一致"
    command: "$SHELL test.sh <package_folder> # 第三阶段缩略图拷贝验证"

assertion_count: 6
