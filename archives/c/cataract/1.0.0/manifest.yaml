name: cataract
version: "1.0.0"
status: built
build_date: "2026-09-02"
build_system: autotools
conan_ref: "cataract/1.0.0"

source:
  url: "http://cgg.bzatek.net/files/cataract-1.0.0.tar.bz2"
  sha256: "561cd8f4bf71fdb0cb190a26dee44c1a1013648633ea68deffa9b064dbaf1417"
  tar_format: tar.bz2
  release_date: "2009-10-24"

build:
  package_type: application
  target: aarch64-linux-ohos
  jobs: 1

dependencies:
  - "glib/2.88.3"
  - "libxml2/2.15.3"
  - "exiv2/0.28.7"
  - "zlib/1.3.2 (override)"
  - "pkgconf/2.2.0"

patches_applied: []

validation:
  source_audit_freeze: pending
  conan_create: pending

patch_classification:
  - file: src/stats.h + src/stats.c (in-conanfile re.sub)
    type: portability
    platform_only: true
    guard: "extern globals + -fcommon fallback via _patch_stats_fcommon"
  - file: configure.ac + configure (in-conanfile re.sub)
    type: portability
    platform_only: true
    guard: "HAVE_MAGICKWAND optional via _patch_configure_ac_optional/_patch_configure_optional"
  - file: src/jpeg-utils.cpp (in-conanfile re.sub)
    type: portability
    platform_only: true
    guard: "HAVE_MAGICKWAND via _patch_jpeg_utils_stub"
  - file: config.guess/sub (in-conanfile re.sub)
    type: portability
    platform_only: true
    guard: "aarch64-unknown-linux-ohos via _patch_config_guess_for_ohos"
