software: cataract
display: "Cataract Gallery Generator"
description: "Simple static web photo gallery, designed to be clean and easily usable (CGG)"
category: graphics
homepage: "http://cgg.bzatek.net/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools build with OHOS aarch64 triplet (aarch64-unknown-linux-ohos)"
    - "MagickWand made optional - stubbed thumbnail (copy) when ImageMagick unavailable"
    - "Fixed multiple definition globals in src/stats.h for -fno-common (gcc10+/clang)"
    - "Updated config.guess/sub to recognize HarmonyOS"
  common_dependencies:
    - glib
    - libxml2
    - exiv2

versions:
  "1.0.0":
    status: built
    build_date: "2026-09-02"
    conan_ref: "cataract/1.0.0"
    note: "Initial HarmonyOS PC adaptation, application package (cgg + cgg-dirgen)"
