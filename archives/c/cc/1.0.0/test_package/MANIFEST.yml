# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cc/1.0.0
homepage: "https://github.com/JacksonAllan/CC"

# 上游测试命令 — cc 上游无 make test/meson test（header-only 库）；
# 测试为 tests/unit_tests.c（C 单元测试，各容器 test_* 函数，main 里
# 全部调用）+ tests/tests_against_stl.cpp（C++/STL 对比）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-21 本地实测）：
# - tests/unit_tests.c（2043 行，多容器单元测试：vec/list/map/set 系列
#   test_* 函数）——test_package 编译运行（见 PR 描述实测通过率）
# - tests/tests_against_stl.cpp（C++/STL 对比，需 C++ 编译器）——
#   作为补充测试存在
upstream_tests: []
