# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "c-stdaux 为纯头文件库（4 个公共头，无编译产物），上游 meson install 仅装头文件与 pkg-config 文件"
  - "上游无 LICENSE 文件（license 在 meson.build 声明为 Apache），打包无可拷贝许可证文件"
  - "上游 pkg-config 文件 libcstdaux-1.pc 导出 cflags 与 version_scripts 自定义变量，c-util 下游（c-utf8 等）用 dep.get_variable() 读取；Conan 侧用 cpp_info.defines=_GNU_SOURCE + pkg_config_custom_content 等价表达"
  - "meson 工具用 tool_requires(meson/1.11.0) 制品仓工具包，CI worker 无全局 meson（canfigger 0.3.2 先例）"
  - "上游自带 2 个自包含测试程序（test-api/test-basic，assert 式，无外部测试框架），在 build() 内 meson compile + meson test 真实执行"
  - "c-util 全家族（c-rbtree/c-siphash/c-shquote/c-list/c-ini/c-utf8）均依赖 libcstdaux-1，本包先行发布可解全家族依赖链"
