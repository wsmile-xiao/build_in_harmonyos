# test_package/MANIFEST.yml
# Upstream official test declaration for CI L0e.

package: c-stdaux/1.6.0
homepage: https://github.com/c-util/c-stdaux

upstream_check_command: "meson test -C build"
upstream_test_in_build: true
upstream_test_command: "meson test"

# The complete upstream suite: two programs registered via meson test()
# in src/meson.build.
upstream_tests:
  - API Symbol Visibility
  - Basic API Behavior

test_package_tests:
  - file: c-stdaux_test.c
    description: "c_assert, C_ARRAY_SIZE, c_memzero/c_memcpy/c_memcmp, 32-bit endian loads, c_container_of"
    command: "./c-stdaux_test"

assertion_count: 7
