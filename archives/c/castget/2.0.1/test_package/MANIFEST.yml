# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: castget/2.0.1
homepage: "https://github.com/mlj/castget"

# 上游测试存在性审计（hmbs 硬门禁要求；上游确有测试，已接入并在真机执行）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 castget 2.0.1 存在自动化测试套件（autotools TESTS 注册），
  已接入并在 OHOS 真机 make check 完整执行（3 个 TESTS 条目 / 9 个用例）。
  1. tests/Makefile.am 注册 TESTS = test_patterns、test_progress、
     test_filenames 三个 GLib 测试框架程序（check_PROGRAMS 同集），
     各程序直接编译 src/ 对应实现文件 + 自制 mocks.c。
  2. 用例数（g_test_add_func 静态计数）：patterns 6、progress 2、
     filenames 1，合计 9；执行计数以 make check 日志 "ok N " 行数为准
     （配方 _parse_check_results 硬校验 9）。
  3. 运行方式：conanfile.py build() 就地 configure/make 后 make check
     （GLib/curl 依赖由 conan buildenv 提供运行时路径），解析
     Testsuite summary 与 "ok N" 用例行数，结果持久化为包内
     res/upstream_test_result.json，test_package 阶段读取并裸 print 输出
     HMBS_UPSTREAM_TEST_RESULT 标记。

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试用例（真机可运行集合 = 3 个 GLib 测试程序）
upstream_tests:
  - file: tests/test_patterns.c
    source: "castget-rel_2_0_1/tests/test_patterns.c"
    description: "GLib 单元测试：文件名模式展开（6 用例）"
    command: "make check"
  - file: tests/test_progress.c
    source: "castget-rel_2_0_1/tests/test_progress.c"
    description: "GLib 单元测试：下载进度计算（2 用例）"
    command: "make check"
  - file: tests/test_filenames.c
    source: "castget-rel_2_0_1/tests/test_filenames.c"
    description: "GLib 单元测试：下载文件名生成（1 用例）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "4 个真实用例：-V 版本横幅、本地 file:// RSS 全栈解析列表、
      --catchup 完整运行、缺失配置文件的错误路径"
    command: "sh test.sh <bin> <pkg>"

# 测试断言总数 (近似值)
# 上游 3 个 TESTS 条目（GLib 框架 9 个注册用例）；test_package 4 条消费者断言
assertion_count: 13

# 测试套件覆盖说明
test_suite_gaps:
  integration: "上游 tests/ 未覆盖 channel 下载主流程（需网络），test_package
    以本地 file:// RSS 的 --list/--catchup 真实运行补足集成验证"
