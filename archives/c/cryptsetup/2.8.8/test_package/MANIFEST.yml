# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# cryptsetup 2.8.8 上游测试体系（tests/ 目录，automake 并行测试驱动）:
#   TESTS（tests/Makefile.am）31 项基础 + 本适配新增 ohos-consumer-test = 32 项字面，
#   再加条件项：VERITYSETUP(verity-compat-test) + INTEGRITYSETUP(integrity-compat-test)
#   + USE_EXTERNAL_TOKENS(systemd-test-plugin，本构建 config.h 为 1) = 构建树实测全员 35 项；
#   check_PROGRAMS 9 个 C 测试程序（api-test / api-test-2 / differ /
#   crypto-check / vectors-test / unit-utils-io / unit-utils-crypt-test /
#   unit-wipe / all-symbols-test）。
#   测试脚本以 `[ $(id -u) != 0 ] && skip` 形式在缺 root / 缺 dm-crypt 内核时
#   主动 `exit 77`（automake SKIP 约定），故非 root 环境可安全执行。

package: cryptsetup/2.8.8
homepage: "https://gitlab.com/cryptsetup/cryptsetup"

# 上游测试命令（automake 并行测试驱动）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序（逐项结果见 reports/test-report.md；该目录被 .gitignore 覆盖，不入 PR）
upstream_tests:
  - file: tests/Makefile.am
    source: cryptsetup-2.8.8/tests/
    description: "automake TESTS 列表（构建树实测全员 35 项 = 字面 32（上游 31 + 本适配新增 ohos-consumer-test）+ 条件项 verity-compat-test / integrity-compat-test / systemd-test-plugin；ssh-test-plugin 因 --disable-ssh-token 未注册）+ check_PROGRAMS 9 个 C 程序"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_cryptsetup.c
    description: "层 A（C API，16 个 check 断言）：链接 libcryptsetup，真实创建并回读 LUKS2 头（libjson-c 元数据 + openssl backend）"
    command: "./test_cryptsetup"
  - file: conanfile.py
    description: "层 B（OHOS CLI 消费者用例，本轮新增）：包内 cryptsetup CLI 完成普通文件上的 LUKS2 容器生命周期（version/isLuks 正反向/luksFormat/luksDump/luksUUID/luksHeaderBackup），无需 root 与 dm-crypt 内核；header restore 由 tests/ohos-consumer-test 第 9 条断言覆盖"
    command: "<pkg>/bin/cryptsetup --batch-mode luksFormat --type luks2 ..."

# 层 A 断言总数（实测：grep -c '^    check(' test_package/test_cryptsetup.c = 16）
assertion_count: 16
