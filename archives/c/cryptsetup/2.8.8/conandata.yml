# conandata.yml — cryptsetup 2.8.8
# 官方发行归档（make dist 产物，含预生成 configure/Makefile.in/config.h.in 与 man 页）。
# 与官方签名校验文件逐字比对一致：
#   https://cdn.kernel.org/pub/linux/utils/cryptsetup/v2.8/sha256sums.asc
#     -> 3acfa685f2dd7fcc832e0b77bc7093aa7da554a51ce8dafbb4138eaa854eee35  cryptsetup-2.8.8.tar.xz
# 本地复算（2026-09-18，11,951,044 字节）：MATCH。
# 注意：GitLab tag 归档 https://gitlab.com/cryptsetup/cryptsetup/-/archive/v2.8.8/...tar.gz
# 不含 configure → 只能走 autogen.sh（本机无 automake/aclocal），不可用。
#
# R39/PF7：源 URL 只写上游官方地址，不手写任何镜像前缀；CI 会自动加镜像回退。

sources:
  url: "https://cdn.kernel.org/pub/linux/utils/cryptsetup/v2.8/cryptsetup-2.8.8.tar.xz"
  sha256: "3acfa685f2dd7fcc832e0b77bc7093aa7da554a51ce8dafbb4138eaa854eee35"

patches:
  - patch_file: "patches/0001-configure-hmdfs-umask.patch"
    patch_description: >-
      E011: autoconf 建临时目录用 `(umask 077 && mktemp -d "./confXXXXXX")`，
      生成 0700 目录；HMDFS 上该目录随后不可写，config.status 生成 Makefile 段错误。
      改为 umask 022（mktemp 分支 + 无 mktemp 的 mkdir fallback 分支各一处）。
    patch_type: "platform"
  - patch_file: "patches/0002-tests-ohos-bash-shebang.patch"
    patch_description: >-
      E165: OHOS 无 /bin/bash（bash 实际在 /data/service/hnp/bin/bash），119 个
      `#!/bin/bash` 脚本直接 exec 会 `bad interpreter` / Error 126。
      其中 tests/ 118 个为构建与 make check 的真实执行路径：build 期 BUILT_SOURCES
      生成 test-symbols-list.h（tests/generate-symbols-list）、31 项 TESTS 脚本、
      以及 luks2-validation-test 直接 exec 的 86 个 tests/generators/*.sh。
    patch_type: "platform"
  - patch_file: "patches/0003-ohos-consumer-test.patch"
    patch_description: >-
      OHOS 适配要求「上游测试套件至少新增一个鸿蒙测试用例（消费者可行性）」：
      新增 tests/ohos-consumer-test 并注册进 tests/Makefile.am 与
      tests/Makefile.in 的 TESTS（make check 第 32 项基础用例）。该用例以
      消费者身份在普通文件上端到端验证 cryptsetup CLI + libcryptsetup +
      libjson-c 元数据 + openssl 后端（version/isLuks 正反向/luksFormat/
      luksDump/luksUUID/luksHeaderBackup/luksHeaderRestore），不依赖 root、
      /dev/mapper 或 dm-crypt 内核模块；open 路径作为平台边界检查
      （无 dm 时必须干净失败）。另配 recipe build() 内 chmod +x 兜底：
      toybox 0.8.12 patch 不解析 git「new file mode 100755」。
    patch_type: "ohos_test"
  - patch_file: "patches/0004-src-hmdfs-fallocate-fallback.patch"
    patch_description: >-
      HMDFS(FUSE) 不支持 posix_fallocate（EOPNOTSUPP），四处文件预分配在 OHOS 上必失败：
      detached header 创建（src/cryptsetup.c:1528）、LUKS1 reencrypt 临时头
      （src/utils_reencrypt_luks1.c:188）、LUKS2 reencrypt 临时头
      （src/utils_reencrypt.c:735）、libdevice 文件空间分配
      （lib/utils_device.c device_fallocate，LUKS1 detached header 全尺寸预分配，
      失败后 LUKS_check_device_size 误报 "Device too small"，实测原位复现、与路径无关）。
      本补丁统一在 posix_fallocate 失败时退化为 ftruncate（稀疏扩展，语义等价）。
    patch_type: "platform"
