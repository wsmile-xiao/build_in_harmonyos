# manifest.yaml — codex-probe 1.0.3 (HarmonyOS PC / OpenHarmony aarch64)
version: "1.0.3"
software: "codex-probe"
status: "built"
build_date: "2026-09-18"
arch:
  - "armv8"
  - "x86_64"
build_system:
  - "conan2"
  - "go1.26.5"
toolchain:
  go: "1.26.5"
  cgo: false
source:
  upstream: "https://github.com/JamesChan21/codex-probe"
  tag: "v1.0.3"
  url: "https://github.com/JamesChan21/codex-probe/archive/refs/tags/v1.0.3.tar.gz"
  sha256: "48868bd2aab102fdf32c5419a812d1792cf46e23beb2c1320a9c7c82e20051f5"
  # 上游 README 声明 "## License / MIT"，但 tag v1.0.3 的仓库中不含 LICENSE
  # 文件（GitHub API license 字段为 null），因此包内不附带 license 文件。
  license: "MIT"
build:
  entry: "go build -trimpath -ldflags \"-s -w\" -o codex-probe ./cmd/codex-probe"
  output_binary: "codex-probe"
  module: "github.com/QuantumNous/new-api/tools/codex-probe"
  go_directive: "1.22"
patches_applied: []
knowledge_gained:
  - "codex-probe 是纯 Go CLI（module github.com/QuantumNous/new-api/tools/codex-probe，入口 ./cmd/codex-probe，非仓库根包）；无 import \"C\"，CGO_ENABLED=0 下静态链接，产物无动态依赖。"
  - "go.mod 声明 go 1.22，故 Go SDK 只要 >= 1.22 即可；采用 1.26.5 与 worker/已合并配方（archives/a/aiac/5.3.0）一致，GOTOOLCHAIN=local 禁止自动切换工具链。"
  - "E051/E166 Go linker mmap 在 HMDFS/tmpfs 上失败：整个 Go 工作区（GOCACHE/GOTMPDIR/GOMODCACHE/TMPDIR 与链接输出）必须放在 ext2 类可写分区 /data/storage/el2/base/haps/entry/files。"
  - "E128/E077 OHOS 上未签名的 ELF 会被 execve 拒绝（实测 rc 126 Permission denied），用 binary-sign-tool sign -selfSign 1 自签名后即可执行；Go SDK 工具链的 bin/ 与 pkg/tool/linux_arm64/ 下每个 ELF 都要签。"
  - "签名检测不能用 .codesign 裸字节/字符串搜索：Go 二进制内嵌 macOS 工具链用的 \"codesign\" 字样会假阳性，导致跳过签名（实测表现为 rc 126）。必须读 llvm-readelf -S 的 .codesign section 头判定。"
  - "上游 1.0.3 无任何测试：无 *_test.go，唯一 workflow 是 GoReleaser 发布 job，无测试 step；上游测试数 = 0（no_tests），本适配补增 6 用例 / 13 断言的消费者冒烟测试作为鸿蒙特有测试。"
  - "上游 CLI 对任何真实命令都会先做网络地域探测（checkNotChina → ipinfo.io/api.country.is/ip-api.com），失败则告警继续、判定为 CN 则退出 1；因此消费者冒烟测试只使用在该探测之前就失败闭合的参数校验路径，全离线且与 CI 出口地域无关。"
