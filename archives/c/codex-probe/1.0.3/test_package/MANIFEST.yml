# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: codex-probe/1.0.3
homepage: "https://github.com/JamesChan21/codex-probe"

# 上游测试命令：空串。codex-probe 1.0.3 上游无任何 *_test.go / make check /
# ctest / pytest，故 upstream_check_command / upstream_test_command 留空以声明
# 「上游未绑定测试入口」，与已通过门禁的 aiac/5.3.0、aribb24、augustus、xidle
# 配方对齐（这些配方同样把两项置空、upstream_tests_exist: false，并在
# test_package 用裸 print() 输出 no_tests 证据）。
# build() 里跑 `go test -v -count=1 ./...` 仅为源码树审计留痕（conan create
# log 可查），不声称上游覆盖。
upstream_check_command: ""

# conanfile.py build() 是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# ── 上游测试审计（upstream_tests_exist=false 的显式证据）──
upstream_tests_exist: false
upstream_test_audit:
  - source: "codex-probe-1.0.3 source tree (`find . -name '*_test.go'`)"
    reason: "全模块（cmd/codex-probe/ 下 19 个 .go 源文件）没有任何 *_test.go 文件；`grep -rn 'func Test|func Benchmark|func Example'` 命中数为 0。模块路径 github.com/QuantumNous/new-api/tools/codex-probe。"
  - source: ".github/workflows/release.yml"
    reason: "上游唯一 CI workflow 是 GoReleaser 构建/发布 job（配合 .github/cliff.toml 生成 changelog），无任何测试 step；不存在 make check / ctest / pytest 等测试入口。"
  - source: "go.mod / go.sum"
    reason: "直接依赖仅 golang.org/x/net v0.26.0 与 golang.org/x/sys v0.21.0（运行时 HTTP/系统调用），无任何测试专用依赖（无 testify / go-cmp 之使用）。"
  - source: "`go test -v -count=1 ./...` 实测"
    reason: "每个包输出 [no test files]，退出码 0，真实执行的用例数 = 0（HMBS_UPSTREAM_TEST_RESULT status=no_tests）。"
  - source: "cmd/codex-probe/test.go"
    reason: "该文件虽名为 test.go，但实现的是 `--apitest` 生产功能（对 Codex 模型端点发轻量请求），被链接进 codex-probe 可执行文件，不是测试夹具。"
  - conclusion: "上游 1.0.3 不提供任何自动化测试。本适配新增二进制消费者冒烟测试（test.sh，6 用例 / 13 断言，鸿蒙特有测试）作为适配后补增测试，不冒充上游覆盖。"
upstream_test_count: 0

# test_package 中自带的测试（消费者视角验证 / 鸿蒙特有测试）
test_package_tests:
  - file: test.sh
    description: "消费者冒烟测试：--help 与空参数打印 Usage、--sync 与 --status 互斥拒绝、--config 缺失失败闭合、--login 缺 -o 失败闭合、--output 非 .csv 失败闭合（全部离线，不触达上游地域探针）"
    command: "sh test.sh <package>/bin/codex-probe"

# test.sh 中的断言数（逐条列举，共 13 条 / 6 个用例）：
#   case 1 `--help`：
#     1. 退出码为 0
#     2. 输出包含 "Usage:"
#     3. 输出包含 "--login"
#   case 2 空参数：
#     4. 退出码为 0
#     5. 输出包含 "Usage:"
#   case 3 `--sync --status`：
#     6. 退出码非 0
#     7. 输出包含 "--sync cannot be combined"
#   case 4 `--config <不存在> --login`：
#     8. 退出码非 0
#     9. 输出包含 "failed to load config"
#   case 5 `--config <存在> --login`（缺 -o）：
#     10. 退出码非 0
#     11. 输出包含 "--login requires -o"
#   case 6 `--status --output report.txt`：
#     12. 退出码非 0
#     13. 输出包含 "--output path must end with .csv"
assertion_count: 13
test_scenario_count: 6
