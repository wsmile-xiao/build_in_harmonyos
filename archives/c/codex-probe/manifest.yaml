# 软件级 manifest — codex-probe
software: codex-probe
display: "codex-probe"
description: "Codex 凭证与诊断命令行工具（OAuth PKCE 登录 / 续期 / 配额 / 模型连通性 / Supabase 加密同步 / CSV 导出）(纯 Go CLI)"
category: build-tool
homepage: "https://github.com/JamesChan21/codex-probe"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 静态编译（CGO_ENABLED=0，GOOS=linux，GOARCH=arm64），产物无动态依赖"
    - "Go linker mmap 在 HMDFS 上 permission denied（E051/E166），整个 Go 工作区与链接输出需放在 ext2 可写分区（/data/storage/el2/base/haps/entry/files）"
    - "OHOS 上每个被 fork/exec 的 ELF 必须用 binary-sign-tool 自签名（含 .codesign section）；判定签名必须读 llvm-readelf -S 的 section 头，字符串搜索会因 Go 二进制内嵌的 codesign 字样假阳性"
    - "上游无任何测试（无 *_test.go），适配补增 6 用例 / 13 断言的消费者冒烟测试"
  common_dependencies: []

versions:
  "1.0.3":
    status: built
    build_date: "2026-09-18"
    conan_ref: "codex-probe/1.0.3"
