# test_package/MANIFEST.yml — c-rbtree 3.2.0 上游测试声明
# 上游测试命令：meson test（默认配置，共 4 项，无跳过条件；
# ptrace 条件测试 2 项上游默认关闭不注册，见 meson_options.txt ptrace value: false）

package: c-rbtree/3.2.0
homepage: "https://github.com/c-util/c-rbtree"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test-api.c
    source: c-rbtree-3.2.0/src/test-api.c
    description: "API Symbol Visibility——导出符号与 libcrbtree.sym 一致性"
    command: "./build/src/test-api"
  - file: src/test-basic.c
    source: c-rbtree-3.2.0/src/test-basic.c
    description: "Basic API Behavior——基础树操作与每次操作后的红黑树不变量校验"
    command: "./build/src/test-basic"
  - file: src/test-map.c
    source: c-rbtree-3.2.0/src/test-map.c
    description: "Generic Map——通用映射宏接口行为"
    command: "./build/src/test-map"
  - file: src/test-misc.c
    source: c-rbtree-3.2.0/src/test-misc.c
    description: "Miscellaneous——遍历器/后序遍历等杂项行为"
    command: "./build/src/test-misc"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：插入/中序正反向遍历/后序覆盖/移除重插/c_rbtree_move 行为断言"
    command: "ctest --test-dir . --output-on-failure"

# 测试断言总数 (近似值, 用于质量评估；静态统计 assert( 出现次数)
# test-api.c: 34 + test-basic.c: 23 + test-map.c: 63 + test-misc.c: 10
assertion_count: 130
