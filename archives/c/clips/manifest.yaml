software: clips
display: "CLIPS"
description: "NASA 出品的规则型专家系统：前向链推理引擎，含交互式 clips 解释器与可嵌入式 C 库（6.3 系列，上游 6.30 core source）"
category: library
homepage: "https://www.clipsrules.net/"
license: Public Domain
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游为纯 Makefile 工程：makefiles/makefile.lib 编译 core/*.c（不含 main.c，-DALLOW_ENVIRONMENT_GLOBALS=0）为 libclips.a"
    - "makefile 硬编码 gcc/ar：补丁 0001 参数化为 CC/AR/RANLIB/CFLAGS 命令行变量，原生构建行为不变"
    - "clips 交互二进制按 makefile.lib 内注释的官方用法链接：cc main.c libclips.a -lm（库与应用同 ABI，ALLOW_ENVIRONMENT_GLOBALS 默认即 0）"
    - "-DLINUX 选择 sysdep.c 的 POSIX 分支（sys/time.h + gettimeofday/clock_gettime 实现 gentime），Debian 同款；OHOS 为 Linux 内核直接适用"
    - "构建仅 编译+ar+链接，不运行任何构建期产物，交叉编译安全"
    - "零外部依赖：纯 C，仅 libc + libm（-lm）"
    - "上游只提供静态库目标（ar cq）：配方 shared=True 直接 ConanInvalidConfiguration 拒绝，不伪装"
    - "公共头文件需整族安装：clips.h 伞头经 #include \"...\" 传递依赖 core/ 下全部头，平铺安装（Debian 同款做法）"
  common_dependencies: []

versions:
  "6.3":
    status: built
    build_date: "2026-09-08"
