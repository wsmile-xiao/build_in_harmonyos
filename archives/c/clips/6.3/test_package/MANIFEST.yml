# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: clips/6.3
homepage: "https://www.clipsrules.net/"

# 上游 6.30 core source 分发包内无测试套件（清点证据见 notes.md）：
# zip 仅含 core/（164 个 .c + 头文件）、makefiles/（5 个 makefile）、readme.txt。
upstream_check_command: "unzip -l clips_core_source_630.zip"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
# 上游无随包测试；CLIPS 官方测试载体是文档中的示例程序
# （clips_documentation_630.zip，独立分发），不随 core source 提供。

test_package_tests:
  - file: test.c
    description: "嵌入式 C API 全链路：CreateEnvironment -> EnvBuild×3（每次仅一个 construct，claim/result 模板 + defrule）-> EnvBuild 非法语法拒绝 -> EnvReset -> EnvAssertString -> EnvRun(恰触发 1 条规则) -> 事实列表轮询验证规则副作用事实 -> EnvFunctionCall 嵌入式求值（返回值按 CLIPS 约定 FALSE=成功）-> DestroyEnvironment(fresh env；上游 6.30 对含 pending activation 的环境 teardown 死循环，已表征并记录 notes.md)"
    command: "./test_clips"
  - file: test_consumer.c
    description: "消费者用例（应用外置规则文件场景）：写 consumer_rules.clp（deftemplate+deffunction+defrule）-> EnvBatchStar 缺失文件返回 0 -> EnvBatchStar 加载规则文件 -> assert 订单事实 -> 文件加载的规则恰触发 1 次 -> 文件加载的 deffunction 计算 shipping-cost=35"
    command: "./test_consumer"
  - file: test_ohos.c
    description: "鸿蒙特有测试：①(time) 经 -DLINUX sysdep.c gentime 分支（clock_gettime/gettimeofday，musl 实测）返回合理 epoch；②save-facts/load-facts 在用户存储（真机 HMDFS）完整往返，文件非空且两条事实槽值正确恢复"
    command: "./test_ohos"
  - file: conanfile.py
    description: "CLI 端到端：clips -f2 hello.clp 批处理执行 printout 脚本，断言输出标记 CLIPS-CLI-OK"
    command: "clips -f2 pipeline"

assertion_count: 21
