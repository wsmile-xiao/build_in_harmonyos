software: clips
# 版本级 manifest
# 文件位置: archives/c/clips/6.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"

# 构建系统类型（顶级字段，verify 需要）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://downloads.sourceforge.net/project/clipsrules/CLIPS/6.30/clips_core_source_630.zip"
  sha256: "01555b257efae281199b82621ad5cc1106a395acc095b9ba66f40fe50fe3ef1c"
  tar_format: zip

# 版本说明：任务口径版本为 6.3（6.3 系列首发版）；上游发布文件为 6.30
# （SourceForge /CLIPS/6.30/，源码头注释 "CLIPS Version 6.30 08/16/14"）。

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile

  configure_options:
    - "make -C core -f ../makefiles/makefile.lib CC=<clang> AR=<llvm-ar> RANLIB=<llvm-ranlib> CFLAGS='-DLINUX -fPIC' -j1 libclips.a"
    - "<clang> -DLINUX -fPIC -o clips main.c libclips.a -lm（makefile.lib 内注释的官方链接方式）"
    - "上游硬编码 gcc/ar/ar 无 ranlib：补丁 0001 参数化工具链并补 ranlib"

  dependencies: []  # 零依赖：纯 C，仅 libc + libm

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-makefile-lib-parameterize-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "makefile.lib 以 -DALLOW_ENVIRONMENT_GLOBALS=0 编译除 main.c 外全部 core 源文件为 libclips.a；该宏在 setup.h 中默认即 0，库与 CLI 二进制同 ABI"
  - "clips 交互二进制无需第二次全量编译：makefile.lib 内注释给出官方用法 gcc -o clips main.c -L. -lm -lclips"
  - "-DLINUX 平台宏只影响 sysdep.c（POSIX 头 + gentime 用 gettimeofday/clock_gettime）与 (operating-system) 返回字符串，不影响引擎逻辑；OHOS 为 Linux 内核直接适用"
  - "上游 zip 无测试套件：仅 core/ + makefiles/ + readme.txt（164 .c / 5 makefile / 0 test）；测试以 test_package 自带断言补足"
  - "clips.h 伞头经 #include \"...\"（带引号同目录查找）传递依赖 core/ 全部头文件，include 目录必须整族平铺安装"
