# 版本级 manifest — caf 1.1.0
# 文件位置: archives/c/caf/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 软件名
software: "caf"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub 源，镜像见 conandata.yml）
  url: "https://github.com/actor-framework/actor-framework/archive/refs/tags/1.1.0.tar.gz"

  # 源码校验和（官方 1.1.0 tag 归档）
  sha256: "9febd85d3a4f50dac760592043028a36bea62bba50c3ee2fc1eace954dd8ae27"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCAF_ENABLE_TESTING=ON"
    - "-DCAF_ENABLE_EXAMPLES=OFF"
    - "-DCAF_ENABLE_OPENSSL_MODULE=ON"
    - "-DCAF_ENABLE_NET_MODULE=ON"
    - "-DCAF_ENABLE_IO_MODULE=ON"
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/3.5.6.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CAF 1.x 创建 actor_system 前必须调用 caf::core::init_global_meta_objects()，否则运行时 FATAL actor_system created without calling caf::init_global_meta_objects<>() before"
  - "CAF 1.x blocking_response_handle::receive 的 OnValue/OnError 回调必须返回 void，结果通过引用捕获，不能返回 int64_t/string"
  - "CAF typed actor 的 sys.spawn 推导需要完整包含 caf/typed_event_based_actor.hpp，仅包含 caf/typed_actor.hpp 会在 infer_handle_from_class 处 SFINAE 失败"
  - "CAF_ENABLE_TESTING=ON 时 caf-<module>-test 为聚合测试二进制，CTest 按 .test.cpp 文件注册 230 项；SCENARIO/TEST 宏为源码级用例声明"