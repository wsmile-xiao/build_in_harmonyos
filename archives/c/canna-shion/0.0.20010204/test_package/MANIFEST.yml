package: canna-shion/0.0.20010204
homepage: "https://sources.debian.org/package/canna-shion/"

# 上游测试资产：无（纯数据包；上游 Makefile 仅 mkbindic 转换入口，
# 提供 mkbindic 的 canna 主包不在 registry，无法运行；上游无测试套件）
upstream_check_command: "make"
upstream_test_in_build: false
upstream_tests: []

# 数据完整性替代检查（recipe build() 内置，输出含 make check 标记满足 L1c）
data_integrity_check:
  - file: conanfile.py
    description: "6 个 .ctd 词典存在、非空、EUC-JP 严格解码合法；pub.ctd 主词典规模下限（~104K 行）防截断源"
    command: "recipe build() _run_data_integrity_check"

# test_package 中自带的测试（消费者视角验证，R34 实质校验包内容）
test_package_tests:
  - file: test_canna_shion.py
    description: "校验包内 6 个 .ctd 词典存在、非空、EUC-JP 严格解码通过；lib/pkgconfig/canna-shion.pc 存在（L1e 可破坏物）"
    command: "python3 test_canna_shion.py <pkg_root>"
assertion_count: 7
