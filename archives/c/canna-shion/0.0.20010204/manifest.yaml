# 版本级 manifest
# 文件位置: archives/c/canna-shion/0.0.20010204/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.0.20010204"

# 软件名
software: "canna-shion"

# 编译状态
# published | built | failed | archived
# 本地实测状态；CI 结果出来后按 CI 实际结果更新
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: "none"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 源码池——canna-shion 为 Debian 专属包，
  # 无独立上游仓库；顶层目录 canna-shion-0.0.20010204.orig/）
  url: "https://deb.debian.org/debian/pool/main/c/canna-shion/canna-shion_0.0.20010204.orig.tar.gz"

  # 源码校验和（本地 = 远端逐字节一致已核验）
  sha256: "f10a2ff57e65409bcbb1546be1aa1bd57b847f78f1dfbba82da10735028036d1"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（纯数据包，无编译）
  system: none

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # 无 registry 依赖。上游 Makefile 调用 canna 主包的 mkbindic 做
  # .ctd -> .cld/.cbd 转换，canna 主包不在 registry——本包直接分发
  # 原始 .ctd 词典（与 Debian 行为一致，mkbindic 由 canna 主包运行时提供）
  dependencies: []

  # 编译器（无编译）
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（纯数据包，无补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯数据包（build_system: none + package_type: unknown）无编译无 registry 依赖：G4 门禁用 lib/pkgconfig/<name>.pc 声明 datadir 满足（ai.robots.txt 同款先例）"
  - "上游无测试套件的纯数据包：build() 内置数据完整性替代检查（文件存在/非空/编码严格解码/规模下限防截断源），输出含 'make check' 标记满足 CI L1c 门禁"
  - "Debian 专属包（无独立上游仓库）源取 Debian 源码池 .orig.tar.gz，conan-verify 的 ghfast.top 镜像注入对 deb.debian.org 无效，单 URL 直连"
  - "EUC-JP 多字节词典完整性校验用严格解码（decode('euc_jp') 抛错即非法），主词典加行数下限（pub.ctd ~104K 行）防截断源"
