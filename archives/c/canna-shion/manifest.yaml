software: canna-shion
display: "canna-shion"
description: "Canna 日文输入法支持词典「子音 (Shion)」——6 个 EUC-JP 汉字转换词典（.ctd），纯数据包"
category: data
homepage: "https://sources.debian.org/package/canna-shion/"
license: Other
build_system: none

ohos_adaptation:
  key_points:
    - "纯数据包（无编译），package_type=unknown 规避 L0k 误判"
    - "G4 门禁：创建 lib/pkgconfig/canna-shion.pc 声明 datadir"
    - "上游无测试套件：build() 内置数据完整性替代检查（6 .ctd 存在/非空/EUC-JP 严格解码 + pub.ctd 规模下限），输出含 make check 标记满足 L1c"
    - "无 registry 依赖：上游 Makefile 依赖 canna 主包的 mkbindic，canna 主包不在 registry，直接分发原始 .ctd（Debian 行为一致）"
  common_dependencies: []

versions:
  "0.0.20010204":
    status: built
    build_date: "2026-09-16"
    notes: |
      - canna-shion 0.0.20010204（Canna 日文输入法支持词典「子音」，纯数据包）
      - 源为 Debian 专属源码包（deb.debian.org pool），无独立上游仓库
      - 6 个 EUC-JP .ctd 词典（basho/kaom/keisan/pub/scien/sup，pub.ctd ~104K 行）
      - 上游无测试套件；build() 数据完整性替代检查 PASS；test_package 7 断言
