software: cmark
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.31.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.31.2"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/builds/cmark-0.31.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "静态库编译避免 ELF 签名问题"
  - "Python 测试需要 libffi.so.8"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

# ============================================================
# 打包产物
# ============================================================

package:
  # 发布包
  release:
    filename: cmark-0.31.2-ohos-aarch64.tar.gz
    size: 495KB
    sha256: ""

  # Debug 符号包
  debug:
    filename: cmark-0.31.2-ohos-aarch64-debug.tar.gz
    size: 37KB
    sha256: ""

# ============================================================
# 测试结果
# ============================================================

test_results:
  total: 5
  passed: 2
  failed: 3
  pass_rate: 40%
  notes:
    - "核心测试通过（api_test, html_normalization）"
    - "Python 测试失败因缺少 libffi.so.8"
    - "手动验证命令行工具正常工作"
