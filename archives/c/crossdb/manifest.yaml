# 软件级 manifest — crossdb
# 文件位置: archives/c/crossdb/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: crossdb
display: "CrossDB"
description: "超轻量嵌入式/服务器 OLTP 关系型数据库（C 实现，零第三方依赖）"

# 分类: foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: db

homepage: "https://crossdb.org"
license: MPL-2.0

build_system: cmake

ohos_adaptation:
  key_points:
    - "musl 的 regex.h 没有 REG_STARTEND：REGEXP 匹配前须把长度前缀切片复制成 NUL 结尾再 regexec"
    - "musl libc 不导出 glibc 风格 qsort_r(base,n,size,compar,arg)：ORDER BY 用线程局部上下文的本地 shim 委托 qsort"
    - "AArch64 上 plain char 默认无符号：pkey_idx=-1 哨兵须声明成 signed char，否则每个 CREATE TABLE 都报 Duplicate PRIMARY KEY"
    - "HMDFS/tmpfs 拒绝 posix_fallocate（EACCES）：扩文件回退 ftruncate（与上游 __APPLE__ 分支同法）"
    - "getopt 返回 int：用 plain char 接收会让循环在无符号平台上永不终止；xdb-cli 另需 --version/--help 长选项以过 L2 冒烟门禁"
  common_dependencies: []

versions:
  "0.14.0":
    status: built
    build_date: "2026-09-28"
