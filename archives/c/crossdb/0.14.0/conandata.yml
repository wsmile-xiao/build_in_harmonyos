# conandata.yml — crossdb 0.14.0
# 上游身份：GitHub tag 0.14.0（无 v 前缀），sha256 三路一致
#   archive/refs/tags/0.14.0.tar.gz == codeload.github.com/.../0.14.0
#   == conan-center-index recipes/crossdb/all/conandata.yml 公布值

sources:
  url: "https://github.com/crossdb-org/crossdb/archive/refs/tags/0.14.0.tar.gz"
  sha256: "38c79686481d2f324ce3d48fcf559f8ea4700e7ed3fa01f7ff9e38bfc79d8572"

patches:
  - patch_file: "patches/0001-cmake-smoke-test-target.patch"
    patch_description: "Add an opt-in (OFF by default) CMake target that builds and registers the upstream test/ smoke suite so the packaged build really runs it"
    patch_type: "portability"
  - patch_file: "patches/0002-regex-reg-startend-fallback.patch"
    patch_description: "musl (OHOS) regex.h has no REG_STARTEND; bound the length-prefixed subject with a NUL-terminated copy before regexec"
    patch_type: "portability"
  - patch_file: "patches/0003-qsort-r-thread-local-shim.patch"
    patch_description: "musl (OHOS) libc exports no glibc-style qsort_r; add a local thread-local shim over qsort for ORDER BY"
    patch_type: "compatibility"
  - patch_file: "patches/0004-signed-char-pkey-idx.patch"
    patch_description: "plain char is unsigned on AArch64, so the pkey_idx=-1 sentinel became 255 and every CREATE TABLE reported Duplicate PRIMARY KEY"
    patch_type: "portability"
  - patch_file: "patches/0005-posix-fallocate-ftruncate-fallback.patch"
    patch_description: "HMDFS/tmpfs rejects posix_fallocate with EACCES; grow the file with ftruncate like the existing __APPLE__ branch"
    patch_type: "portability"
  - patch_file: "patches/0006-xdb-cli-getopt-and-long-options.patch"
    patch_description: "getopt returns int (a plain-char loop never terminates on unsigned char) and GNU --version/--help long options are required by the L2 smoke gate"
    patch_type: "portability"
