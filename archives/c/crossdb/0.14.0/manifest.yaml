  # 上游 GitHub tag 0.14.0（无 v 前缀）
  url: "https://github.com/crossdb-org/crossdb/archive/refs/tags/0.14.0.tar.gz"
  # 三路一致：github archive == codeload == conan-center-index 公布值
  sha256: "38c79686481d2f324ce3d48fcf559f8ea4700e7ed3fa01f7ff9e38bfc79d8572"
  tar_format: "tar.gz"

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF（default_options shared=False，静态交付）"
    - "-DXDB_BUILD_TESTS=ON（补丁 0001，把上游 test/ 冒烟套件接入 CTest）"
  # 零第三方依赖（上游 0 deps，W0-2 已实核）
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-cmake-smoke-test-target.patch"
  - "0002-regex-reg-startend-fallback.patch"
  - "0003-qsort-r-thread-local-shim.patch"
  - "0004-signed-char-pkey-idx.patch"
  - "0005-posix-fallocate-ftruncate-fallback.patch"
  - "0006-xdb-cli-getopt-and-long-options.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "AArch64 上 plain char 无符号使 pkey_idx=-1 哨兵失效，CREATE TABLE 全量报 Duplicate PRIMARY KEY（signed char 修复）"
  - "musl regex.h 无 REG_STARTEND：长度前缀切片须复制成 NUL 结尾再 regexec"
  - "musl 无 glibc 风格 qsort_r：ORDER BY 用线程局部 shim 委托 qsort（E531 同族）"
  - "HMDFS/tmpfs 的 posix_fallocate 返回 EACCES：扩文件回退 ftruncate（E523 同族）"
  - "getopt 返回 int，plain char 接收在无符号平台死循环；CLI 需 --version/--help 过 L2（E503）"
