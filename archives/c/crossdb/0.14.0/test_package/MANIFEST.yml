# test_package/MANIFEST.yml
# 上游官方测试声明文件（crossdb 0.14.0）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: crossdb/0.14.0
homepage: "https://crossdb.org"

# 上游测试入口：test/Makefile 的 all 目标（编译并执行 xdb_smoke_test.bin）
upstream_check_command: "make -C test"

# conanfile.py build() 方法中已集成上游测试
# （CMake 侧 XDB_BUILD_TESTS=ON 注册 ctest，build() 里执行 ctest --verbose）
upstream_test_in_build: true
upstream_test_command: "ctest --verbose"

# 上游实际运行的测试程序（test/xdb_smoke_test.c + utest.h，运行期注册 125 个用例）
upstream_tests:
  - file: test/xdb_smoke_test.c
    source: crossdb-0.14.0/test/xdb_smoke_test.c
    description: "上游冒烟套件：DDL/DML/事务/语义/函数 5 个子文件（57 个 UTEST_I 各注册 2 例 + 11 个 UTEST_F = 125 个运行期用例，203 处断言）"
    command: "./xdb_smoke_test.bin"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：连接/DDL/DML/COUNT/ORDER BY/LIKE/UPDATE/DELETE/2 项负例 共 28 项 CHECK 断言"
    command: "./test_crossdb"

# 测试断言总数（上游 203 处断言 + 消费者 test.c 26 项 CHECK 断言）
assertion_count: 231
