sources:
  # 官方 tag 归档（R39：官方源）
  url: "https://github.com/crystal-lang/crystal/archive/refs/tags/1.21.1.tar.gz"
  sha256: "174ad41131a155d0407fb9f66fac4e4baabc5b5d7d030fef9c631a43f553e112"

# 自举（self-hosting）语言：编译器本身由 Crystal 写成，构建新编译器**必须先有一个
# 可运行的既有编译器**。官方 release 提供预编译 bootstrap（内含 crystal + shards）。
# 实测注意：该归档里的两个二进制**都没有 .codesign 段**，在 OHOS 上直接 execve 会
# 报 Permission denied（errno 13）；必须先用 binary-sign-tool selfSign 补签。
bootstrap:
  url: "https://github.com/crystal-lang/crystal/releases/download/1.21.1/crystal-1.21.1-1-linux-aarch64.tar.gz"
  sha256: "a37365b79f58d4cd32b6113bbb9983e21eb41d233667e003c019520e3c245e49"

# shards 依赖（crystal build 需要，来自 shard.yml）
shards:
  - markd
  - reply
  - sanitize
