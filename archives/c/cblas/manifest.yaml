software: cblas
display: "CBLAS"
description: "Netlib CBLAS - the standard C interface to BLAS (CBLAS component of LAPACK 3.12.1)"
category: foundation
homepage: "https://www.netlib.org/lapack/"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "高价值数学基础接口：BLAS 的标准 C 绑定，科学计算与机器学习栈的公共依赖"
    - "上游 make 构建（CBLAS/Makefile → src 产 libcblas.a），绕开 CMake 路径——顶层 CMake 的 CBLAS 需要 FortranCInterface_VERIFY 混合链接验证，flang-ohos 精简运行集无法完成（同 lapack 包 BUILD_CBLAS=ON 实际未产出 CBLAS 的先例）"
    - "CBLAS/src 含约 30 个 Fortran 桥接子例程（sdotsub.f 等），tool_requires flang-ohos/20.1.0 编译（GNU make 内置 .f.o 规则消费 FC/FFLAGS）"
    - "BLAS 符号由 requires openblas/0.3.34 提供；上游测试驱动以 libopenblas.a 静态链接，运行期零环境依赖"
    - "上游测试 12 个 blat 驱动全部真实运行（level1/2/3 × s/d/c/z），340 PASS / 0 FAIL"
    - "flang 编译/链接需显式 --target=aarch64-linux-ohos --sysroot=<SDK> -resource-dir=<SDK clang resdir>，链接加 -lFortranRuntime -lFortranDecimal；flang 运行期需 LD_LIBRARY_PATH 指向 SDK llvm/lib 与 flang 包 lib"

versions:
  "3.12.1":
    status: built
    build_date: "2026-09-05"
    notes: "零补丁；源码取 Reference-LAPACK v3.12.1 官方 tarball 的 CBLAS 组件；上游测试 340 PASS / 0 FAIL"
