# conandata.yml for ciftilib 1.6.0
# Upstream: https://github.com/Washington-University/CiftiLib
# Tag v1.6.0 (commit 10c99a58f44996ad26344be531ebd699cc0c8d31)
sources:
  url:
    - "https://github.com/Washington-University/CiftiLib/archive/v1.6.0.tar.gz"
  sha256: "5df9c72849bf0105234557a920f4aa247ff6a2503253f7587f3bf8ce429948a1"

patches:
  - patch_file: "patches/0001-cmake-policy-cmp0045.patch"
    patch_description: "CMake 4.1 compatibility: set CMP0045 to NEW and require 3.5 (OLD no longer supported)"
    patch_type: "portability"
  - patch_file: "patches/0002-pkgconfig-fallback-libxml2-glib.patch"
    patch_description: "Fallback to pkg-config for LibXml2/glib/sigc when Find modules miss Conan packages (PKG_CONFIG_PATH)"
    patch_type: "portability"
  - patch_file: "patches/0003-pkgconfig-conan-libs.patch"
    patch_description: "Direct pkg-config for libxml++-2.6 when Findlibxml++ misses Conan prefix (OHOS ld undefined Glib::ustring)"
    patch_type: "conan"
  - patch_file: "patches/0004-disable-openmp-ohos.patch"
    patch_description: "Disable OpenMP on OHOS to avoid libomp dependency (fallback to Glib::Mutex)"
    patch_type: "portability"
