software: ciftilib
version: "1.6.0"
status: built
build_date: "2026-09-09"
build_system: cmake
conan_ref: "ciftilib/1.6.0@ohpcd/stable"

source:
  url: "https://github.com/Washington-University/CiftiLib/archive/v1.6.0.tar.gz"
  sha256: "5df9c72849bf0105234557a920f4aa247ff6a2503253f7587f3bf8ce429948a1"
  tar_format: tar.gz

build:
  system: cmake
  cc: clang
  cxx: clang++
  configure_options:
    - "-DIGNORE_QT=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_CXX_STANDARD=11"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - "boost/1.91.0.1.1"
    - "libxmlpp/2.42.3"
    - "libxml2/2.15.3"
    - "zlib/1.3.1.1"
  tool_dependencies:
    - "pkgconf/3.0.6"

patches_applied:
  - "patches/0001-cmake-policy-cmp0045.patch"
  - "patches/0002-pkgconfig-fallback-libxml2-glib.patch"
  - "patches/0003-pkgconfig-conan-libs.patch"

knowledge_gained:
  - "IGNORE_QT=ON forces libxml++ path; prevents QT autodetection"
  - "Findlibxml++ uses pkg_check_modules(libxml++-2.6); PkgConfigDeps must generate .pc and PKG_CONFIG_PATH must include it"
  - "CMAKE_CXX_STANDARD 11 required (auto_ptr), profile cppstd 17 would break"
  - "CMake 4.x drops OLD behavior for CMP0045; patched to NEW and min 3.5"
  - "FindLibXml2/glibmm/sigc miss Conan prefix without pkg-config fallback; patched to fallback to PKG_CHECK_MODULES libxml-2.0/glib-2.0/sigc++-2.0"
  - "v13 fix: previous injection used GLIB_* upper but Findglib expects glib_* lower; corrected to lowercase + alias and explicit libxml2/2.15.3 require; removed PKG_CONFIG_USE_CMAKE_PREFIX_PATH=False"
  - "v14 fix: Boost 1.91 removed filesystem::complete/file_string; patched CiftiFile.cxx pathToAbsolute/pathToCanonical to use absolute/string (patch)"
  - "v16 fix: patch 0003 tab/space exact-match failure (expected 8 spaces vs actual \\t) -> remove patch file and use pure-python in-place edit in source() with tolerated apply_conandata_patches"
  - "HMFS chmod=0: glib's b/build-release/meson loses +x (code 127). Vendored meson wrapper covers it."
  - "v17 fix: OHOS ld undefined Glib::ustring/xmlpp::TextReader due to Findlibxml++ missing Conan prefix; add pkg-config direct fallback for libxml++-2.6 and fallback link injection via CMAKE_EXE_LINKER_FLAGS"
  - "E002 readonly /tmp: HMBS injects TMPDIR; mktemp shim redirects /tmp to TMPDIR"
