package: ciftilib/1.6.0
homepage: "https://github.com/Washington-University/CiftiLib"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: example/CMakeLists.txt
    source: CiftiLib-1.6.0/example/CMakeLists.txt
    description: "Official Cifti round-trip suite: xmlinfo, rewrite (LITTLE/BIG) + md5, datatype + md5 for 5 data files (Conte69.* and ones.dscalar.nii) = 35 ctests"
    command: "ctest --output-on-failure"

upstream_test_count: 35

test_package_tests:
  - file: test_ciftilib.cpp
    description: "Consumer link test: AString round-trip, CiftiFile default, CiftiXML/CiftiVersion, exception path (4 groups, 6 assertions)"
    command: "./test_ciftilib"

test_package_test_count: 1
assertion_count: 6
