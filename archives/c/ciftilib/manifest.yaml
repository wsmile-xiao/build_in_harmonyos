# Software-level manifest for ciftilib
# Follows ARCHIVE-SPEC v2.0 / v3.0
software: ciftilib
display: "CiftiLib"
description: "C++ library for reading and writing CIFTI-2 and CIFTI-1 files (NIfTI-1/2 I/O)"
category: library
homepage: "https://github.com/Washington-University/CiftiLib"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake project; force IGNORE_QT=ON to select libxml++ path and avoid Qt5 dependency"
    - "Depends on libxmlpp/2.42.3 (OLD 2.6 API, provides libxml++-2.6.pc) + Boost.Filesystem + zlib"
    - "CMAKE_CXX_STANDARD forced to 11 (upstream requires 11; profile default 17 overrides)"
    - "PkgConfigDeps + CMakeDeps for dual pkg-config and CMake discovery; upsteam runs ctest for CIFTI round-trip tests"
  common_dependencies:
    - boost
    - libxmlpp
    - zlib

versions:
  "1.6.0":
    status: built
    build_date: "2026-09-08"
