software: cwebx
display: CWEBx
description: CWEBx 文学编程文档系统（Levy/Knuth CWEB 的 ANSI C 分支）— 由 ctanglex 从 .w 提取 .c、cweavex 提取
  .tex；与 cweb 是不同分支、不同包名，不可混用
category: doc
homepage: "http://wwwmathlabo.univ-poitiers.fr/~maavl/CWEBx/"
license: Knuth-CTAN
build_system: makefile
ohos_adaptation:
  key_points:
  - 发行包的 ./configure 是 82 字节提示脚本，构建系统是 raw Makefile，按 autotools 处理会直接失败
  - cweave.c 不随包提供，须先构建 ctanglex 再由 ./ctanglex 生成；OHOS SDK clang 链接时已写入 .codesign，无需额外签名步骤
  - Makefile 的 prefix 与 CC 都能用命令行变量覆盖，install 目标无需补丁即可 staging
  - 默认 all 目标会调用 TeX 生成 manual.dvi 与源码清单，平台无 TeX，配方只构建 cweb 目标
  - 上游 make check 只有一行 echo；真实自验证 make cautiously 的 recipe 未传 -l，在 x3.52 包上必然失败
  common_dependencies: []
versions:
  3.52:
    status: built
    build_date: '2026-09-12'
