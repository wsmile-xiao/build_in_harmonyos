version: "3.52"

software: "cwebx"

# published | built | failed | archived
# built：conan-verify 通过但未执行 release/upload，无发布证据不写 published
status: built

build_date: "2026-09-12"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 作者本人服务器上的官方发布包；该主机无可验证 TLS 链，只能明文 http，
  # 属 R39/PF7 官方托管例外，理由与独立佐证见 notes.md 与 PR 说明。
  url: "http://wwwmathlabo.univ-poitiers.fr/~maavl/CWEBx/cweb-x3.52.tgz"

  sha256: "92e57b4414388743bd0b91d81c91bea4645a8b04c8f744754b0855e90934186b"

  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile

  # 本发行包没有 configure 阶段（./configure 是提示脚本），此处记录实际 make 调用
  configure_options:
  - "make cweb CC=<profile clang> -j1"
  - "make install prefix=<package_folder> CC=<profile clang>"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 仅登记知识图谱中确有对应条目的结论（每行带 ref: 供 W5 对账）。
# 本次另有三条新发现（82 字节 configure 桩导致 init-build 误判 autotools；
# 上游 make cautiously 因 recipe 缺 -l 必然失败；search-url 把死链标为可用官方源）
# 在 knowledge/graph 中无既有条目，不编造引用，详录于 notes.md 并登记容器层反馈。
# 另注：旧归档 cweb 4.12.2 的 notes.md 把 ELF 签名与 lld 链接问题标为 E106/E105，
# 实测 E106 是 toybox cat/SIGPIPE、E105 是 Rust 工具链，ELF 签名条目应为 E077。
knowledge_gained:
- "ref: E077 — OHOS SDK clang 在链接期已写入 .codesign 与 .note.ohos.ident，自举二进制可直接执行，无需 binary-sign-tool 重签（重签反而有风险）"
- "ref: E034 — 设备访问制品仓/上游 https 需按命令注入经核对的 SSL_CERT_FILE（certifi bundle），不能关闭 TLS 校验"
