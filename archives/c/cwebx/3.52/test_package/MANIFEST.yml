# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cwebx/3.52
homepage: "http://wwwmathlabo.univ-poitiers.fr/~maavl/CWEBx/"

# 上游测试命令（发行包注册的两个测试入口，单位：make 目标）
upstream_check_command: "make check"
upstream_optional_command: "make cautiously"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成：make check 只有一行 echo，没有可判定内容；make cautiously 是上游
# 自举自检，其 recipe 硬编码 `./ctanglex common $(CCHANGES)` 而不传 -l，
# 在 x3.52 发行包上必然失败（见下方 upstream_tests 与 notes.md 的根因）。
# 等价的上游自举验证在适配阶段单独实跑并留证。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（单位见每项 description）
upstream_tests:
  - file: Makefile
    source: cweb-x3.52/Makefile
    description: "默认测试入口 make check：1 个目标，正文只有 @echo 'Did you expect a check from me?'，0 个断言；实跑 rc=0"
    command: "make check"
  - file: Makefile
    source: cweb-x3.52/Makefile
    description: "可选自举自检 make cautiously：3 个 diff 比较（common.c / ctangle.c / cweave.c 确定性）；按发行包默认参数实跑 rc=2，在第 1 个比较 diff common.c 即失败"
    command: "make cautiously CC=clang"
  - file: common.w
    source: cweb-x3.52/common.w
    description: "上游自举验证的等价复现：用 -l 重生成随包文件，common.c / common.h 与随包版本逐字节相同（差异 0 行）"
    command: "./ctanglex -l common && diff common.c SAVEcommon.c"
  - file: ctangle.w
    source: cweb-x3.52/ctangle.w
    description: "上游自举验证的等价复现：ctangle.c 与随包版本逐字节相同（差异 0 行）"
    command: "./ctanglex -l ctangle && diff ctangle.c SAVEctangle.c"
  - file: cweave.w
    source: cweb-x3.52/cweave.w
    description: "ctanglex 输出确定性：cweave.c 连续两次生成完全一致（2979 行）"
    command: "./ctanglex cweave (twice) && diff"
  - file: examples/wc.w
    source: cweb-x3.52/examples/wc.w
    description: "示例程序往返（4 个 .w：wc / treeprint / wmerge / compare），ctanglex 出 C、cweavex 出 TeX，4/4 通过"
    command: "ctanglex wc && cweave wc"
  - file: examples/wc.w
    source: cweb-x3.52/examples/wc.w
    description: "端到端：wc.w 经 ctanglex 生成 wc.c，clang 编译后运行，对 README 得到 125 行 / 1121 词 / 6855 字符"
    command: "ctanglex wc && clang -o wc wc.c && ./wc README"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "消费者功能测试：执行安装后的 ctanglex/cweavex，断言版本横幅、@d 宏展开、#line 与 /*:N*/ 段号、-l 抑制段号、cweavex 产出 .tex，并把提取出的 C 编译后运行比对标准输出"
    command: "bash test.sh <cc>"

# 测试断言总数（test_package/test.sh 内 ok() 计数，脚本自身打印该值）
assertion_count: 10
