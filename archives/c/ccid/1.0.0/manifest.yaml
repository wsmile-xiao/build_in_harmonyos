software: ccid
version: "1.0.0"
status: built
build_date: "2026-08-23"
build_system: autotools

source:
  url: "https://github.com/LudovicRousseau/CCID/archive/refs/tags/1.0.0.tar.gz"
  sha256: "8db301a19899f7f6156af4349a42771052bc578946f4dc8e7eb7e6df7f1838c9"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-usbdropdir=/usr/local/pcsc/drivers"
  dependencies:
    - libusb-compat/0.1.7
    - pcsc-lite/2.4.0

patches_applied: []

knowledge_gained:
  - "ccid 1.0.0 使用 libusb-0.1 API（usb_init/usb.h），需要 libusb-compat 兼容层"
  - "上游 1.0.0 无预生成 configure，OHOS 无 perl → 绕过 autotools 用直接 clang 编译"
  - "与 acsccid 同源（acsccid 是 ACS 的 fork），构建模式相同但 libusb API 不同"
  - "GitHub tag archive URL 可用（Savannah/waterlan 无 1.0.0 历史存档）"
  - "libusb-compat 只有 .a 静态库，需要整体链接进 libccid.so"
  - "flex 不可用（Conan 包无二进制），添加 LTPBundleFindValueWithKey stub"
  - "ccid_usb.c 中 get_ccid_usb_interface 使用前需前向声明（clang-15 C99 严格模式）"

blocking_issues: []
