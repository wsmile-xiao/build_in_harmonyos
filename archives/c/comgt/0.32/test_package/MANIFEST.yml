# test_package/MANIFEST.yml — comgt 0.32
# CI L0e requires this file to exist.

package: comgt/0.32
homepage: "https://sourceforge.net/projects/comgt/"

upstream_check_command: "make"
upstream_test_in_build: false
upstream_test_command: ""

# comgt 0.32 (2006) ships no automated test suite: the tarball contains no
# test/ directory and the makefile has no check/test target. Evidence: full
# tarball listing (comgt.c, comgt.h, comgt.doc, man pages, scripts/, Makefile).
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Runs the installed comgt binary and asserts real behavior: -V prints the version banner and -h prints the usage pointer (upstream exits 1 by design after printing; asserted)"
    command: "bash test.sh"

assertion_count: 2
