# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cista/0.16
homepage: "https://github.com/felixguendling/cista"

# 上游测试命令: doctest 单二进制套件 (50 个 test/*.cc, 221 个 TEST_CASE)
upstream_check_command: "cmake --build build-ohos --target cista-test && ./build-ohos/cista-test"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/struct_serialize_test.cc
    source: cista-0.16/test/struct_serialize_test.cc
    description: "offset 序列化回环测试 (cista-test doctest 套件的一员)"
    command: "./build-ohos/cista-test"
  - file: test/serialization 全套
    source: cista-0.16/test/*.cc (50 文件, 221 TEST_CASE)
    description: "上游 doctest 全量套件；本任务已完成 OHOS aarch64 交叉编译（见 reaudit/adapt 证据），真机运行需设备 hdc"
    command: "./build-ohos/cista-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者序列化/反序列化回环测试 (R34 实质依赖被测包 API)"
    command: "./test_cista"

# 测试断言总数 (test_package 实际断言数)
assertion_count: 5