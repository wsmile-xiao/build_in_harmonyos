# conandata.yml — criterion 2.4.3
# Meson-based C/C++ unit testing framework
# Source: GitHub release tarball (official source)
# 镜像优先、官方 URL 兜底：真机/CI 无法直连 github.com 时依次尝试镜像
# （镜像列表与 ci/conan/build_and_test.sh 维护的 GitHub 镜像映射一致；
#  gh-proxy.com 置于首位——本轮真机 criterion/meson 两处下载均经其兜底成功；
#  ghfast.top 本轮真机 ConnectTimeout（无法建立连接），后移作候选；
#  官方 github.com URL 仍放最后兜底）

sources:
  url:
    - "https://gh-proxy.com/https://github.com/Snaipe/Criterion/releases/download/v2.4.3/criterion-2.4.3.tar.xz"
    - "https://mirror.ghproxy.com/https://github.com/Snaipe/Criterion/releases/download/v2.4.3/criterion-2.4.3.tar.xz"
    - "https://ghproxy.com/https://github.com/Snaipe/Criterion/releases/download/v2.4.3/criterion-2.4.3.tar.xz"
    - "https://gitclone.com/github.com/Snaipe/Criterion/releases/download/v2.4.3/criterion-2.4.3.tar.xz"
    - "https://moeyy.cn/gh-proxy/https://github.com/Snaipe/Criterion/releases/download/v2.4.3/criterion-2.4.3.tar.xz"
    - "https://kkgithub.com/Snaipe/Criterion/releases/download/v2.4.3/criterion-2.4.3.tar.xz"
    - "https://ghfast.top/https://github.com/Snaipe/Criterion/releases/download/v2.4.3/criterion-2.4.3.tar.xz"
    - "https://github.com/Snaipe/Criterion/releases/download/v2.4.3/criterion-2.4.3.tar.xz"
  sha256: "8ec64e482a70b3bfc1836ace0988b3316e6c3cfeac883fb5a674dcea5083ea16"

patches:
  - patch_file: "patches/0001-meson.build.patch"
    patch_description: "Map all CMake subprojects (nanomsg, nanopb, libgit2) to Linux on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0002-ipc-socket-path.patch"
    patch_description: "Use CWD-relative nanomsg IPC socket path (OHOS /tmp is read-only, bind fails with EROFS)"
    patch_type: "portability"
  - patch_file: "patches/0003-message-server-tcp.patch"
    patch_description: "Fall back to loopback TCP message server when NN_SOCKET_PATH is empty (OHOS user storage refuses AF_UNIX socket inodes, bind fails with EPERM)"
    patch_type: "portability"
