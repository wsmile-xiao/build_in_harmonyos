# 版本级 manifest
# 文件位置: archives/c/criterion/2.4.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.4.3"
software: "criterion"
status: built
build_date: "2026-07-16"
build_system: meson

source:
  url: "https://github.com/Snaipe/Criterion/releases/download/v2.4.3/criterion-2.4.3.tar.xz"
  sha256: "8ec64e482a70b3bfc1836ace0988b3316e6c3cfeac883fb5a674dcea5083ea16"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dtests=disabled"
    - "-Dsamples=disabled"
    - "-Ddev=false"
    - "-Di18n=disabled"
    - "-Ddiffs=enabled"
    - "-Dtheories=enabled"
    - "-Dcxx-support=enabled"
    - "-Dwrap_mode=forcefallback"
    - "-Ddefault_library=static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-meson.build.patch"

patches_description:
  0001-meson.build.patch: "在 HarmonyOS 构建时将 nanomsg/nanopb/libgit2 三个 CMake 子项目映射为 Linux（CMAKE_SYSTEM_NAME=Linux），使其选择兼容的 POSIX 后端（OHOS 不被这些子项目识别）。libgit2 块在 diffs=disabled 时不触发，保留备用"

knowledge_gained:
  - "criterion 使用 Meson 构建系统，依赖较多，全部通过 wrap fallback 编译"
  - "使用 wrap_mode=default + force_fallback_for=nanomsg,nanopb：仅对系统未安装的依赖回退源码编译，nanomsg/nanopb 显式强制 fallback（boxfort/libffi 等靠 fallback: 关键字自动回退）"
  - "禁用 tests 和 samples 可以显著加快编译速度"
  - "nanomsg/nanopb/libgit2 子项目根据 CMAKE_SYSTEM_NAME 选择平台后端，OHOS 下需对每个子项目显式设置 CMAKE_SYSTEM_NAME=Linux"
  - "libffi 3.2.9999 在 clang -std=c11 严格模式下 asm 关键字非法且 ssize_t 缺失：asm 通过 meson native file 全局 c_args 加 -Dasm=__asm__ 修复（对 .c 和 .S 都安全）；ssize_t 通过在 build() 中给 libffi 含 ssize_t 的 .c/.h 源文件补 #include <sys/types.h> 修复（必须用 self.source_folder/subprojects/libffi 而非 build_folder，因 basic_layout 下 build_folder 是 meson 构建目录只有产物）"

patch_classification:
  - file: 0001-meson.build.patch
    type: portability
    platform_only: true
    guard: 'host_machine.system() == harmonyos'
