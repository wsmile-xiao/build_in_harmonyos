# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: criterion/2.4.3
homepage: https://github.com/Snaipe/Criterion

# 上游测试命令 (用于 meson test --list 分析)
upstream_check_command: "meson test -C build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -C build"

# 上游官方测试
upstream_tests:
  - file: test/
    source: criterion-2.4.3.tar.xz/test/
    description: "criterion 官方测试套件 (单元测试+集成测试)"
    command: "meson test -C build"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "基础功能烟雾测试: 算术断言、字符串比较、内存分配"
    command: "./test_criterion"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3

# 测试接入说明 (HMBS 机器证据):
# - build() 末尾 _run_upstream_tests() 真机执行 `meson test -C build`，
#   逐行回显输出并解析 meson 汇总行 (Ok/Fail/Skipped/Timeout 等) 得到真实
#   计数，持久化为 build_folder/upstream_test_result.json，随后立即输出
#   HMBS_UPSTREAM_TEST_RESULT=<同一 JSON> (status 非 passed 时抛异常)。
# - package() 把 upstream_test_result.json 复制进包内 res/。
# - test_package test() 运行 ./test_criterion 后从 Synthesis 汇总行解析
#   冒烟测试真实计数并输出 HMBS_TEST_PACKAGE_RESULT，再读取
#   <package>/res/upstream_test_result.json 复发 HMBS_UPSTREAM_TEST_RESULT
#   (包缓存命中时 build() 不重跑，仅 test_package 每轮必跑，保证标记每轮出现)。
# - 计数全部来自真机测试框架输出，不写死、不估算；文件缺失或 status 非
#   passed 均抛 ConanException 显式失败，不静默通过。
