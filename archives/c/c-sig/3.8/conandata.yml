sources:
  url: "https://github.com/libsigcplusplus/libsigcplusplus/releases/download/3.8.0/libsigc++-3.8.0.tar.xz"
  sha256: "502a743bb07ed7627dd41bd85ec4b93b4954f06b531adc45818d24a959f54e36"

patches:
  - patch_file: "patches/0001-cmake-controllable-library-type-and-install.patch"
    patch_description: "Make library type follow BUILD_SHARED_LIBS and add ARCHIVE/RUNTIME install destinations (upstream hardcodes SHARED)"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-drop-hardcoded-cxx-standard.patch"
    patch_description: "Drop hardcoded CMAKE_CXX_STANDARD 17 so the Conan profile compiler.cppstd wins"
    patch_type: "conan"
  - patch_file: "patches/0003-cmake-skip-examples.patch"
    patch_description: "Skip examples subdirectory in the packaged build (upstream tests are kept and run via ctest)"
    patch_type: "conan"
