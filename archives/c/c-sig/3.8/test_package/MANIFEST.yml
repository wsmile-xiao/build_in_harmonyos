package: c-sig/3.8
homepage: "https://github.com/libsigcplusplus/libsigcplusplus"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest"

upstream_tests:
  - file: tests/test_*.cc
    source: libsigc++-3.8.0/tests/test_*.cc
    description: "42 upstream unit tests (test_accum_iter ... test_weak_raw_ptr) compiled and run via ctest in build(); each links sigc-3.0 and exercises one subsystem (bind/compose/connection/disconnect/exception_catch/hide/limit_reference/mem_fun/ptr_fun/retype/rvalue_ref/scoped_connection/signal/slot/trackable/tuple_*/visit_each/weak_raw_ptr)"
    command: "ctest"

test_package_tests:
  - file: test.cpp
    description: "Consumer test exercising signal connect/emit, default last-value collector, connection::disconnect, empty-signal value-init, ptr_fun, mem_fun with state, trackable auto-disconnect, scoped_connection, bind, direct slot call, and self-disconnect during emit"
    command: "./test_c_sig"
    assertions: 19
  - file: test_observer.cpp
    description: "Consumer event-bus/observer scenario: three dynamic listeners, subscription lifecycle (disconnect/block/unblock), trackable listener destroyed while subscribed, last-value collector over mem_fun+lambda slots, hide() adaptor, exception propagation out of emit, and exception_catch keeping a multi-listener emit alive when one listener throws"
    command: "./test_c_sig_observer"
    assertions: 16

assertion_count: 35
