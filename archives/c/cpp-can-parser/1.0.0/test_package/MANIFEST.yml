# test_package/MANIFEST.yml
# cpp-can-parser 1.0.0 — 上游测试声明与 test_package 自测清单
# 依据 v1.0.0 官方 tag 源码枚举（CMakeLists.txt add_test 声明 6 条）

package: cpp-can-parser/1.0.0
homepage: "https://github.com/xatavian/cpp-can-parser"

# 上游测试命令（CTest 注册 6 项，均在 BUILD_TESTING 门内）
upstream_check_command: "ctest --test-dir build"

# conanfile.py build() 中未集成上游测试（由本地 W3 门禁实际执行）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（6 项 CTest 注册项）
upstream_tests:
  - file: tests/test-parsing.cpp
    source: cpp-can-parser-1.0.0/tests/test-parsing.cpp
    description: "解析 empty.dbc 与 single-frame-1.dbc 两个 fixture，无异常即通过（用户测试源 main 内 2 个解析用例）"
    command: "./cpc-test-parsing"
  - file: utils/can-parse/can-parse.cpp
    source: cpp-can-parser-1.0.0/utils/can-parse/can-parse.cpp
    description: "can-parse checkframe dbc-files/single-frame-1.dbc"
    command: "./can-parse checkframe dbc-files/single-frame-1.dbc"
  - file: utils/can-parse/can-parse.cpp
    source: cpp-can-parser-1.0.0/utils/can-parse/can-parse.cpp
    description: "can-parse checkframe dbc-files/single-frame-2.dbc"
    command: "./can-parse checkframe dbc-files/single-frame-2.dbc"
  - file: utils/can-parse/can-parse.cpp
    source: cpp-can-parser-1.0.0/utils/can-parse/can-parse.cpp
    description: "can-parse checkframe 294 dbc-files/big-endian-1.dbc（本机 OHOS 环境解析挂起，见 test_ledger.md）"
    command: "./can-parse checkframe 294 dbc-files/big-endian-1.dbc"
  - file: utils/can-parse/can-parse.cpp
    source: cpp-can-parser-1.0.0/utils/can-parse/can-parse.cpp
    description: "can-parse checkframe 1807 dbc-files/big-endian-1.dbc（本机 OHOS 环境解析挂起，见 test_ledger.md）"
    command: "./can-parse checkframe 1807 dbc-files/big-endian-1.dbc"
  - file: utils/can-parse/can-parse.cpp
    source: cpp-can-parser-1.0.0/utils/can-parse/can-parse.cpp
    description: "can-parse checkframe 1800 dbc-files/big-endian-1.dbc（本机 OHOS 环境解析挂起，见 test_ledger.md）"
    command: "./can-parse checkframe 1800 dbc-files/big-endian-1.dbc"

# test_package 自带的测试（消费者视角验证 + HarmonyOS 专项）
test_package_tests:
  - file: test_consumer.cpp
    description: "消费者验证：fromString 解析内嵌 DBC，核验帧/信号 API（真实断言）"
    command: "./test_consumer"
  - file: harmonyos_specific_test.cpp
    description: "HarmonyOS 专项：核验 __OHOS__/__aarch64__ 宏并真实调用库 API 解析 DBC"
    command: "./harmonyos_specific_test"

# 测试断言总数（消费者 + 鸿蒙专项真实断言，近似值）
assertion_count: 8
