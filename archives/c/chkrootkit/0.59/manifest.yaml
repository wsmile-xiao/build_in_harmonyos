software: chkrootkit
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.59/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.59"

# 构建系统类型（验证脚本需要的顶层字段）
build_system: makefile

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "ftp://ftp.chkrootkit.org/pub/seg/pac/chkrootkit-0.59.tar.gz"

  # 源码校验和
  sha256: "bd38f1d7f543a2aa6dd8c7ad6bb88df7c0d7dc101df57377dac24415cbc8c5ee"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表 (custom Makefile, no configure)
  configure_options:
    - "CC=clang"
    - "STATIC="
    - "CFLAGS=-DHAVE_LASTLOG_H -fPIC -O2"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 无 install target，使用手动 DESTDIR 安装
  install_method: manual
  # 安装布局: bin/chkrootkit(wrapper) + libexec/chkrootkit/(all tools)
  install_layout: libexec

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "chkrootkit 无 configure script，使用自定义 Makefile ref:L3-chkrootkit"
  - "STATIC=-static 在 OpenHarmony/musl 上不兼容，需命令行覆盖 STATIC= ref:L2-makefile-static"
  - "ifpromisc 需要 linux/if.h（OpenHarmony 无此头文件），Makefile 条件编译自动跳过 ref:L3-chkrootkit-ifpromisc"
  - "chkrootkit 主脚本使用 ./ 引用工具，需 wrapper script cd 到 libexec 目录 ref:L3-chkrootkit-layout"
  - "chkrootkit 无 install target，需手动 DESTDIR 安装 ref:L3-chkrootkit-install"
