software: chkrootkit
# 软件级 manifest.yaml — ARCHIVE-SPEC v2.0
# 文件位置: archives/c/chkrootkit/manifest.yaml
# 包含软件描述和版本索引

# ============================================================
# 软件描述
# ============================================================

description: "chkrootkit 是一款本地检测 rootkit 迹象的工具，由 shell 脀本和多个 C 工具组成，用于检测系统日志和进程信息中的异常。 "

display_name: "chkrootkit"

category: security

homepage_url: "https://www.chkrootkit.org/"

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.59":
    status: published
    build_date: "2026-06-02"
    build_system: makefile
    configure_options:
      - "CC=clang"
      - "STATIC="
      - "CFLAGS=-DHAVE_LASTLOG_H -fPIC -O2"
    dependencies: []
    install_layout: libexec