# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: coinor-ipopt/3.14.19
homepage: "https://coin-or.github.io/Ipopt/"

# 上游测试命令 (IPOPT 为 autotools，测试入口为 test/ 目录 run_unitTests)
upstream_check_command: "cd test && make && bash ./run_unitTests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游注册清单（test/Makefile.am noinst_PROGRAMS）：
#   hs071_cpp / hs071_c / emptynlp / getcurr（无条件注册）
#   hs071_f（COIN_HAS_F77 条件注册，OHOS 无 F77 编译器 → 平台限定未编译）
#   parametric_cpp / redhess_cpp（BUILD_SIPOPT 条件注册，sIPOPT 已构建 → 运行）
# OHOS 实测运行 6 个全部通过（hs071_f 因无 F77 平台限定未运行）
upstream_tests:
  - file: test/hs071_cpp.cpp
    source: coinor-ipopt-3.14.19/examples/hs071_cpp/hs071_main.cpp
    description: "C++ 示例 NLP（Hock-Schittkowski 71），求解并校验最优解"
    command: "./hs071_cpp"
  - file: test/hs071_c.c
    source: coinor-ipopt-3.14.19/examples/hs071_c/hs071_c.c
    description: "C 接口示例 NLP，求解并校验最优解"
    command: "./hs071_c"
  - file: test/emptynlp.cpp
    source: coinor-ipopt-3.14.19/test/emptynlp.cpp
    description: "空 NLP 求解"
    command: "./emptynlp"
  - file: test/getcurr.cpp
    source: coinor-ipopt-3.14.19/test/getcurr.cpp
    description: "当前迭代信息获取"
    command: "./getcurr"
  - file: test/parametric_cpp.cpp
    source: coinor-ipopt-3.14.19/contrib/sIPOPT/examples/parametric_cpp/parametric_driver.cpp
    description: "sIPOPT 参数灵敏度示例"
    command: "./parametric_cpp"
  - file: test/redhess_cpp.cpp
    source: coinor-ipopt-3.14.19/contrib/sIPOPT/examples/redhess_cpp/redhess_cpp.cpp
    description: "sIPOPT 简化 Hessian 示例"
    command: "./redhess_cpp"
  - file: test/hs071_f.f
    source: coinor-ipopt-3.14.19/examples/hs071_f/hs071_f.f
    description: "Fortran 示例（COIN_HAS_F77 平台限定，OHOS 无 F77 未运行）"
    command: "./hs071_f"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：IPOPT C++ API 求解无约束二次问题并校验最优解 (2,3)"
    command: "./test_ipopt"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
