software: cutmp3
display: "cutmp3"
description: "Lossless command-line MP3 and MP2 frame cutter"
category: multimedia
homepage: "https://www.puchalla-online.de/cutmp3.html"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Build the application as a static PIE with the OHOS Clang toolchain"
    - "Use TMPDIR for writable temporary files instead of fixed Linux paths"
  common_dependencies:
    - readline
    - ncurses
    - mpg123

versions:
  "4":
    status: built
    build_date: "2026-09-11"
    conan_ref: "cutmp3/4.0"
