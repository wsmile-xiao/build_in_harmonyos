version: "1.3.15"
status: built
build_date: "2026-09-07"
verification: "conan create PASS, test_package PASS, upstream test.sh 21/21 PASS"

source:
  url: "https://zakalwe.fi/~shd/foss/cksfv/files/cksfv-1.3.15.tar.bz2"
  tar_format: tar.bz2
  sha256: "a173be5b6519e19169b6bb0b8a8530f04303fe3b17706927b9bd58461256064c"

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>"
    - "--compiler=aarch64-unknown-linux-ohos-clang"
  dependencies: []
  cc: aarch64-unknown-linux-ohos-clang
  cxx: aarch64-unknown-linux-ohos-clang++

patches_applied: []

knowledge_gained:
  - "configure requires --compiler=aarch64-unknown-linux-ohos-clang to emit correct flags for OHOS clang"
  - "make install uses POSIX install(1) which is absent from OHOS Conan build PATH — must override package() with copy()"
  - "PWD/getcwd fails in some conan build dirs on OHOS; set PWD env var explicitly before calling autotools"
  - "upstream test/test.sh runs 21 cases successfully on OHOS without modification"
  - "stdint.h present, inttypes.h absent on OHOS but configure handles this gracefully"
  - "O_LARGEFILE defined as 0 in cksfv.h; no WIN32 guards needed on OHOS"

patch_classification: []
