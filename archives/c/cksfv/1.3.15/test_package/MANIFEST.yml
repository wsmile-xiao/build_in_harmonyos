# test_package/MANIFEST.yml — cksfv 1.3.15
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
# 上游测试盘点：test/test.sh 共 21 个用例（自包含 bash 脚本，无需 GTest/外部依赖）

package: cksfv/1.3.15
homepage: "https://gitlab.com/heikkiorsila/cksfv"

# 上游测试入口：test/test.sh（自包含 bash 测试脚本，21 个用例）
upstream_check_command: "cd test && ./test.sh"

# upstream_test_in_build: true — make check 在 build() 内调用
upstream_test_in_build: true
upstream_test_command: "cd test && ./test.sh"

# 上游测试列表（来自 test/test.sh 静态分析）
upstream_tests:
  - file: test/test.sh (case 1)
    source: cksfv-1.3.15/test/test.sh
    description: "验证正确校验和报告（cksfv -f c1.sfv 对已知匹配文件）"
    command: "./test/test.sh"  # case 1
  - file: test/test.sh (case 2)
    source: cksfv-1.3.15/test/test.sh
    description: "验证错误校验和报告（cksfv -f c2.sfv 对已知不匹配文件应失败）"
    command: "./test/test.sh"  # case 2
  - file: test/test.sh (case 3)
    source: cksfv-1.3.15/test/test.sh
    description: "SFV 文件创建（cksfv a b c > tmp.sfv）"
    command: "./test/test.sh"  # case 3
  - file: test/test.sh (case 4)
    source: cksfv-1.3.15/test/test.sh
    description: "验证刚创建的 SFV 文件"
    command: "./test/test.sh"  # case 4
  - file: test/test.sh (case 5)
    source: cksfv-1.3.15/test/test.sh
    description: "创建 SFV 时文件不存在应失败（cksfv a d）"
    command: "./test/test.sh"  # case 5
  - file: test/test.sh (case 6)
    source: cksfv-1.3.15/test/test.sh
    description: "大小写不敏感检查（-i 标志）"
    command: "./test/test.sh"  # case 6
  - file: test/test.sh (case 7)
    source: cksfv-1.3.15/test/test.sh
    description: "静默模式输出空（-q 不输出成功信息）"
    command: "./test/test.sh"  # case 7
  - file: test/test.sh (case 8)
    source: cksfv-1.3.15/test/test.sh
    description: "非法校验和字符应报错（c4.sfv）"
    command: "./test/test.sh"  # case 8
  - file: test/test.sh (case 9)
    source: cksfv-1.3.15/test/test.sh
    description: "校验和字符过少应报错（c5.sfv）"
    command: "./test/test.sh"  # case 9
  - file: test/test.sh (case 10)
    source: cksfv-1.3.15/test/test.sh
    description: "校验和字符过多应报错（c6.sfv）"
    command: "./test/test.sh"  # case 10
  - file: test/test.sh (case 11)
    source: cksfv-1.3.15/test/test.sh
    description: "部分验证：缺少文件时应报错"
    command: "./test/test.sh"  # case 11
  - file: test/test.sh (case 12)
    source: cksfv-1.3.15/test/test.sh
    description: "部分验证：仅验证 SFV 中存在的文件"
    command: "./test/test.sh"  # case 12
  - file: test/test.sh (case 13)
    source: cksfv-1.3.15/test/test.sh
    description: "递归模式无符号链接（-C dir1 -r）"
    command: "./test/test.sh"  # case 13
  - file: test/test.sh (case 14)
    source: cksfv-1.3.15/test/test.sh
    description: "递归模式无符号链接但校验失败（-C dir2 -r）"
    command: "./test/test.sh"  # case 14
  - file: test/test.sh (case 15)
    source: cksfv-1.3.15/test/test.sh
    description: "递归模式跟随符号链接成功（-C dir1 -r -L）"
    command: "./test/test.sh"  # case 15
  - file: test/test.sh (case 16)
    source: cksfv-1.3.15/test/test.sh
    description: "递归模式跟随符号链接但校验失败（-C dir2 -r -L）"
    command: "./test/test.sh"  # case 16
  - file: test/test.sh (case 17)
    source: cksfv-1.3.15/test/test.sh
    description: "反斜杠转换（-s 标志）"
    command: "./test/test.sh"  # case 17
  - file: test/test.sh (case 18)
    source: cksfv-1.3.15/test/test.sh
    description: "路径模式验证（-g 标志）"
    command: "./test/test.sh"  # case 18
  - file: test/test.sh (case 19)
    source: cksfv-1.3.15/test/test.sh
    description: "空字节文件名处理（nullbyte.sfv）"
    command: "./test/test.sh"  # case 19
  - file: test/test.sh (case 20)
    source: cksfv-1.3.15/test/test.sh
    description: "空字节文件名处理（nullbyte2.sfv）"
    command: "./test/test.sh"  # case 20
  - file: test/test.sh (case 21)
    source: cksfv-1.3.15/test/test.sh
    description: "递归校验和文件（-R 标志）"
    command: "./test/test.sh"  # case 21

# test_package 消费者测试
test_package_tests:
  - file: test_package/conanfile.py
    description: "Smoke test: 创建临时文件生成 SFV 并验证回环（create + verify roundtrip）"
    command: "cksfv -C <tmpdir> hello.txt world.txt > test.sfv && cksfv -f test.sfv"

# 断言计数：21 个 upstream case + 1 个 smoke test = 22
assertion_count: 22
