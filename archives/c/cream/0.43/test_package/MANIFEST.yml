# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: cream/0.43
homepage: https://cream.sourceforge.net

# 上游测试类文件计数（按 PR 审查器名称模式口径）：N=1，即全 tarball 唯一
# 名称含 test 的 addons/cream-cream-keytest.vim。该文件是交互式键盘诊断
# 工具而非自动化测试：文件头 Description 写明 "Test and interpret
# individual keyboard characters. Useful to see exactly what code your
# hardware and software combination returns for a given keystroke"，Usage
# 写明 "Call Cream_keytest() to get feedback about each key pressed"，
# 实现基于 getchar()（第 112/415 行）阻塞等待人工逐键输入，与
# bugreport/typingtutor 同为发布给最终用户的功能 addon。
upstream_test_files:
  - path: "addons/cream-cream-keytest.vim"
    nature: "交互式键盘诊断工具（Cream_keytest()/Cream_keyinterpret()，逐键显示本机硬件/软件组合返回的键码）"
    automated: false
    ci_executable: false
    reason: "基于 getchar() 阻塞等待人工键盘逐键反馈，无头 CI 环境无人工输入源，无法自动化执行"

# 上游无自动化测试套件：纯 Vim script 数据发行，无 make check/ctest/自测脚本
# （tarball 内构建相关文件仅 INSTALL.sh/INSTALL.bat，均无测试目标；
# 唯一名称含 test 的文件为上述交互式诊断工具，不含可执行测试用例）
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试（文件断言，与工具链无关）
test_package_tests:
  - file: "test_smoke.py"
    description: "校验 share/vim/cream 关键运行时文件存在且非空 + 顶层 .vim 脚本数量与上游 tarball 一致"
    command: "python3 test_smoke.py <cream_runtime_dir>"

assertion_count: 10
