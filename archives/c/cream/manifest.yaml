software: cream
display: "Cream (for Vim)"
description: "Vim 编辑器的现代化 GUI 化配置层（纯 Vim script），提供菜单驱动界面与 CUA 键位，让初学者更容易使用 Vim"
category: utility
homepage: "https://cream.sourceforge.net"
license: GPL-3.0-or-later
build_system: manual

ohos_adaptation:
  key_points:
    - "纯 Vim script 数据包，无编译，conanfile 内 copy 拷贝安装到 <prefix>/share/vim/cream/"
    - "上游 INSTALL.sh 含 bashism，不可在 OHOS 设备执行，安装逻辑由 recipe 实现"
    - "运行宿主 vim 为仓内旧式归档（archives/v/vim），不作 conan requires"
  common_dependencies: []

versions:
  "0.43":
    status: built
    build_date: "2026-09-10"
    source_url: "https://downloads.sourceforge.net/project/cream/Cream/0.43/cream-0.43.tar.gz"
