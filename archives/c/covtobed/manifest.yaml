software: covtobed
display: "covtobed"
description: "Generate BED coverage tracks from sorted BAM alignment files"
category: bioinformatics
homepage: "https://github.com/telatin/covtobed"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Direct C++11 compilation because upstream ships no build-system files"
    - "BamTools and zlib are resolved from the OHPCD Conan registry"
    - "The upstream shell integration suite runs against its bundled BAM fixtures"
  common_dependencies:
    - bamtools
    - zlib

versions:
  "1.3.5":
    status: failed
    build_date: "2026-09-09"
    conan_ref: "covtobed/1.3.5"
