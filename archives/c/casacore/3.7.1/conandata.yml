# conandata.yml — casacore 3.7.1

sources:
  url: "https://github.com/casacore/casacore/archive/refs/tags/v3.7.1.tar.gz"
  sha256: "ad7ad865d5d8517524bdde71e0083a69442648b693850660dadb0ce6109d91c7"

patches:
  - patch_file: "patches/0001-disable-fortran-on-ohos.patch"
    patch_type: "portability"
    patch_description: "Disable Fortran module (scimath_f) - no Fortran compiler on OHOS"
  - patch_file: "patches/0002-undef-open64-to-avoid-musl-macro-conflict.patch"
    patch_type: "portability"
    patch_description: "Insert #undef open64 before every open64 member declaration/definition/call - OHOS musl fcntl.h maps #define open64 open (clang predefines _GNU_SOURCE), which mangles the DataManager::open64 virtual method family inconsistently per-TU and breaks vtables at link time"
  - patch_file: "patches/0003-link-lapack-into-scimath-when-fortran-disabled.patch"
    patch_type: "portability"
    patch_description: "Link LAPACK/BLAS directly into casa_scimath instead of the disabled casa_scimath_f Fortran wrapper - scimath Mathematics calls LAPACK (dgetrf_, dgetri_) with f2c naming via MatrixMathLA.h"
