# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: cute_aseprite/1.0.0
homepage: https://github.com/RandyGaul/cute_headers

# 上游测试: cute_aseprite 是单头文件解析库，上游仓库无独立测试套件
# （无 test/ 目录、无 CI 测试脚本；头文件为 header-only，通过
#   CUTE_ASEPRITE_IMPLEMENTATION 宏在一个编译单元中展开）
upstream_check_command: ""   # 上游无测试入口
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试（消费者视角验证鸿蒙平台可编译可解析）
test_package_tests:
  - file: test_aseprite.c
    description: "内嵌合法 .ase 文件，经 cute_aseprite_load_from_memory 解析并校验 frame/layer/cel/pixel 字段 (8 项检查)"
    command: "clang -std=c99 -DCUTE_ASEPRITE_IMPLEMENTATION test_aseprite.c && ./test_aseprite"

# 测试断言总数 (test_package 8 项)
assertion_count: 8