# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: console-bridge/1.0.1
homepage: "https://github.com/ros/console_bridge"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/console_TEST.cc
    source: console_bridge-1.0.1/test/console_TEST.cc
    description: "13 个 GoogleTest 用例，覆盖日志宏、格式化、级别过滤及输出处理器"
    command: "./console_TEST"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者视角的日志转发、级别映射、阈值过滤和处理器恢复测试"
    command: "./test_console_bridge"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 22
