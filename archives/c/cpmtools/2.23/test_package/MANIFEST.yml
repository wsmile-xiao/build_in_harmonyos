# test_package/MANIFEST.yml — cpmtools 2.23
package: cpmtools/2.23
homepage: "http://www.moria.de/~michael/cpmtools/"

# 上游自带 `fsck.test` 目标，但它需要先有磁盘镜像与 diskdefs，且依赖长选项解析，
# 属手工冒烟而非自动化套件；CI 不集成（见 Makefile.in 的 fsck.test 目标）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试
test_package_tests:
  - file: test_cpmtools.c
    description: "消费者测试：7 个工具（cpmls/cpmrm/cpmcp/cpmchmod/cpmchattr/mkfs.cpm/fsck.cpm）存在+可执行+ELF64-AArch64+真实执行未落在 126-127-255"
    command: "test_cpmtools <bin_dir>"

# 测试断言总数：上游 0 + test_package 22（7 存在 + 7 可执行 + 1 架构汇总 + 7 执行）
assertion_count: 22