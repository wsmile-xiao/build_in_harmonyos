# 版本级 manifest — cpmtools 2.23

version: "2.23"
software: "cpmtools"

status: built
build_date: "2026-09-10"
build_system: custom

source:
  url: "https://deb.debian.org/debian/pool/main/c/cpmtools/cpmtools_2.23.orig.tar.gz"
  sha256: "02088d41bbf4c45c32e4ce505d3030e8f6f0d0dc74e60e5f13d7e696d44f9997"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
  - "生成 config.h（与 config.h.in 完全 parity，含成对的 #ifdef X / #include <x.h>）"
  - "clang -O2 -Wall -DDEVICE=posix -c cpmfs.c / getopt.c / getopt1.c / device_posix.c"
  - "clang -O2 -Wall -DDEVICE=posix -c <tool>.c && clang <tool>.o <公共OBJ> -o <tool>（7 个工具）"
  dependencies: []
  cc: clang
  cxx: N/A

patches_applied: []

knowledge_gained:
- "config.h.in 里「能力宏」与「#include」是成对出现的（#ifdef HAVE_FCNTL_H / #include <fcntl.h> / #endif），头文件包含动作发生在 config.h **内部**。手写 config.h 替代 configure 产物时若只补宏定义、漏掉 include 块，HAVE_* 会形同虚设，症状是各 TU 里 O_RDONLY / LONG_MAX / struct utimbuf 等处处 undeclared —— 看起来像源码不兼容 clang，实为 config.h 不完整。"
- "上游 configure.in 用 AC_CHECK_LIB(curses/ncurses) 探测可选依赖决定是否构建第 8 个工具 fsed.cpm：探测失败时 FSED_CPM 置空，Makefile 的 ALL 里**静默少一个产物**，configure 不报错不警告。绕过 configure 直编时必须显式决定该取舍（提供依赖 / 声明缺口），最不可接受的是既不提供也不声明（CI 全绿但产物静默缩水）。"
- "上游 Makefile 把 DISKDEFS / FORMAT 以 -DDISKDEFS=\\\"...\\\" 形式放进 CPPFLAGS；字符串字面量宏的跨 shell 引号转义不可靠，配方改为在生成的 config.h 里 #define，彻底避开 cmd.exe 与 POSIX sh 的差异。"
- "上游默认 DEVICE=posix（不用 libdsk），故只编 device_posix.c，device_libdsk.c 不参与构建。"