# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: clfft/2.12.2
homepage: "https://github.com/clMathLibraries/clFFT"

# 上游测试（src/tests/ gtest 套件）需 FFTW + gtest + Boost + OpenCL 设备
# （FFTW 参考 + OpenCL context/queue 真实执行），OHOS 无 OpenCL 设备且
# FFTW/gtest 不可用 → -DBUILD_TEST=OFF 关闭，按 rule 1.2 声明平台限制
upstream_check_command: "echo \"upstream gtest suite needs FFTW+gtest+Boost+OpenCL device (unavailable on OHOS); disabled via -DBUILD_TEST=OFF\""

# conanfile.py build() 中已按上游 CMake 配置裁剪（BUILD_TEST/OFF 等）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_clfft.c
    description: "消费者探针：clfftInitSetupData() 初始化 clFFT，验证 libclFFT 链接 + 初始化（无需 OpenCL 设备）"
    command: "clang test_clfft.c -o test_clfft_probe -lclFFT -lOpenCL -ldl && ./test_clfft_probe"

# 断言总数（test_package 1 个断言）
assertion_count: 1
