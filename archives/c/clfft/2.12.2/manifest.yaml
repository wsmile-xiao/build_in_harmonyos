software: clfft
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.12.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.12.2"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/clMathLibraries/clFFT/archive/refs/tags/v2.12.2.tar.gz"

  # 源码校验和
  sha256: "36d081e204026b3942c147037e5e7110792f11fae21243f024eab4f146440417"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 编译器
compiler: clang

# 依赖列表（conan package refs 或系统包名）
requires:
  - "opencl-headers/2026.05.29"
  - "opencl-icd-loader/v2024.05.08"

# 构建配置选项
build_options:
  - "-DBUILD_RUNTIME=ON -DBUILD_CLIENT=OFF -DBUILD_TEST=OFF -DBUILD_EXAMPLES=OFF"

# ============================================================
# 测试信息
# ============================================================

# 测试结果状态
# passed | failed | skipped | not_run
test_status: passed

# 测试说明
test_note: "上游 gtest 测试套件（src/tests/，unit_test.cpp 70 个 TEST_F + accuracy 系列）实测复查（2026-09-10）：手动编译 unit_test_bin 成功（链接 clFFT/gtest/FFTW 依赖），实跑立即崩溃——gtest_main.cpp 启动即 clGetPlatformIDs() 返回 370（无 OpenCL 平台），Signal 6 abort；**OHOS 系统无任何 OpenCL 平台已核实**（全系统无 ICD 文件、无 GPU OpenCL 驱动、pocl 软件实现不在 ohpcd）——所有上游测试依赖 OpenCL 平台发现（clfft 是 OpenCL FFT 库，测试必须真平台执行 FFT），无平台无法运行任何用例（按 rule 1.2 声明平台能力限制，非配方/代码缺陷）；-DBUILD_TEST=OFF 关闭；test_package 消费者探针（clfftGetVersion）验证 libclFFT 链接 + 初始化"
