# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: colortest/20110624
homepage: "https://www.colortest.org/"

# 上游无测试（纯 shell/perl 脚本工具，源码仅 5 个脚本 + README，无 Makefile/ctest/pytest）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（无）
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_colortest.sh 验证 5 个脚本已安装、可执行、shebang 正确且语法无误"
    command: "conan create (test_package: sh test_colortest.sh <bin_dir>)"
  - file: test_colortest.sh
    description: "真实冒烟测试: 5 个脚本存在且可执行、perl/bash shebang 修正生效、perl -c/sh -n/bash -n 语法检查、实际运行验证颜色表输出（8colors.sh/16colors.sh 为无限循环动画脚本，用 timeout 3 采样输出）"
    command: "sh test_colortest.sh <package bin dir>"

assertion_count: 17
