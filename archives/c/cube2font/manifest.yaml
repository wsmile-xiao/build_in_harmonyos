software: "cube2font"
display: "cube2font"
category: "gfx"
license: "Zlib"
description: "Cube Engine 2 字体位图生成工具：把 TrueType 字体渲染成游戏运行时加载的 PNG 纹理页与 .cfg 图集坐标文件"
homepage: "https://www.redeclipse.net"
build_system: "makefile"
versions:
  - "1.5.1"
current_version: "1.5.1"
status: "built"
ohos_adaptation:
  key_points:
    - "上游无独立发行版：cube2font 以 src/shared/cube2font.c 随 Red Eclipse（Cube Engine 2）仓库发布，需从引擎 tag 构建单文件目标"
    - "src/Makefile 用 freetype-config 探测 FreeType，该脚本已被 FreeType 2.9.1 移除，Conan freetype 包也不提供；补丁改为 pkg-config freetype2"
    - "src/Makefile 的 PLATFORM 由 `gcc -dumpmachine` 推导，OHOS 工具链无 gcc，配方显式传 Conan host triplet"
    - "默认 `all` 目标会连带构建 SDL/X11 客户端与 enet 服务端，本包只构建 cube2font 目标"
  common_dependencies:
    - freetype
    - zlib
