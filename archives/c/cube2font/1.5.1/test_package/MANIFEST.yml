# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求存在）

package: cube2font/1.5.1
homepage: "https://www.redeclipse.net"

# cube2font 上游没有测试套件：
#   * src/Makefile 没有 test/check 目标
#     （取数命令：grep -nE '^[a-zA-Z0-9._/-]*(test|check)' src/Makefile → 0 命中）
#   * 引擎源码树里没有 test/ 目录，cube2font 是单文件工具
#   * Debian 源包 cube2font 1.5.1-1 也不含 autopkgtest
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序
upstream_tests: []

# test_package 自带测试（消费者视角，真实执行安装后的 cube2font）
test_package_tests:
  - file: test.sh
    description: "参数契约：无参数必须以非零码退出并打印 usage 首行"
    command: "bash test.sh"
  - file: test.sh + check_output.py --exact
    description: "单页转换：0 1 0 0 16 16 256 256，249 个字符 → 1 张 256x256 PNG 纹理页 + .cfg，逐像素核对图集与坐标表完全一致"
    command: "bash test.sh"
  - file: test.sh + check_output.py
    description: "描边多页转换：3 19 1 1 49 49 512 512 32 64，249 个字符 → 3 张 512x512 PNG 纹理页 + .cfg，逐像素核对非零像素全部落在字符框内"
    command: "bash test.sh"

# 测试断言总数（test.sh 内 3 项 + check_output.py 实际执行的断言数，见 CONAN_VERIFY 日志）
assertion_count: 40
