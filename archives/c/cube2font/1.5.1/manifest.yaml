version: "1.5.1"
software: "cube2font"
status: built
build_date: "2026-09-11"
build_system: "makefile"
license: "Zlib"
conan_ref: "cube2font/1.5.1"

source:
  url: "https://github.com/red-eclipse/base/archive/refs/tags/v1.5.1.tar.gz"
  sha256: "a33168040ff9cfbf501f0ee742a4d1f708d4781a643501a5507ba128d0e58ee3"
  tar_format: "tar.gz"

build:
  system: "makefile"
  configure_options:
    - "make -j1 cube2font（只构建 cube2font 目标；默认 all 需要 SDL/X11/enet）"
    - "PLATFORM=aarch64-unknown-linux-ohos（替代上游必然失败的 `gcc -dumpmachine` 探测）"
    - "CXX=/data/service/hnp/bin/clang++（取自 tools.build:compiler_executables）"
    - "CXXFLAGS=\"$(pkg-config --cflags zlib) -O3 -fomit-frame-pointer -ffast-math\""
    - "LDFLAGS=\"$(pkg-config --libs zlib)\""
  dependencies:
    - "freetype/2.14.3"
    - "zlib/1.3.1"
  cc: "clang (/data/service/hnp/bin/clang 15.0.4)"
  cxx: "clang++ (/data/service/hnp/bin/clang++ 15.0.4, target aarch64-unknown-linux-ohos)"
  profile: "ci/conan/profiles/ohos-aarch64"

patches_applied:
  - "0001-makefile-use-pkg-config-for-freetype.patch"

tests:
  upstream: "TOTAL=0 PASS=0 FAIL=0 SKIP=0 NOT_RUN=0——上游无测试套件（src/Makefile 无 test/check 目标；无 test/ 目录；Debian 源包无 autopkgtest），取证命令见 1.5.1/test_package/MANIFEST.yml"
  test_package: "用例 3/3 PASS；断言 40/40 PASS（= test.sh 3 项 + check_output.py 11 项 + 26 项；单页转换 19173/19173 像素逐点吻合，描边多页转换 257964/258960 落在字符框内）。计数取自 conan create 日志的 ASSERTIONS 行，两轮独立构建（采信轮与 finish 内嵌缓存命中轮）逐行相同；日志覆盖行为与可核对副本见 1.5.1/notes.md 的「验证结果」段"
  cli_smoke: "bin/cube2font 缺参数时非零退出并打印 usage 首行；两次真实转换产出 4 张 PNG 纹理页 + 2 份 .cfg"

knowledge_gained:
  - "上游 Makefile 直接调用已被移除的 freetype-config 探测脚本（FreeType 2.9.1 起删除）：症状链为 `freetype-config: inaccessible or not found` → `'ft2build.h' file not found`；修复模式是把探测迁到 pkg-config 模块名 freetype2 并用消费方 PkgConfigDeps 生成的 .pc，本包形成知识库草稿。knowledge_ref: E572"
  - "依赖包自带的 .pc 不能直接用于 PKG_CONFIG_PATH：ohpcd freetype/2.14.3 包内 lib/pkgconfig/freetype2.pc 的 prefix 是打包安装前缀 `/`，会输出 `-I//include/freetype2 -L//lib` 这类死路径；必须用消费方 PkgConfigDeps 重新生成指向包目录的 .pc。knowledge_ref: E572"
  - "src/Makefile 的 `PLATFORM= $(shell gcc -dumpmachine)` 在无 gcc 的 OHOS 工具链下每次展开都打印 `gcc: No such file or directory`；在 make 命令行传 PLATFORM 即可完全抑制该探测（命令行变量优先于文件内赋值），无需改上游文件。reference: archives/c/cube2font/1.5.1/notes.md"
  - "cube2font 的纹理打包启发式在“所有字形位图均为空”时会以 `0 texs` 结束、只写 .cfg 不写任何 PNG：构造测试字体时必须让字符映射到带真实轮廓的字形，否则退出码 0 的冒烟测试会掩盖“没有产出”的事实。reference: archives/c/cube2font/1.5.1/test_package/MANIFEST.yml"

patch_generation:
  method: "手工 GNU diff 生成（上游 src/Makefile 为手写文件；补丁仅含编译/链接两条 freetype 规则与 PKG_CONFIG 变量定义，SDL 客户端规则未构建故不改动）；用 patch_ng 库调用按 conan 实际执行路径（strip=1）验证应用成功"
  generated_at: "2026-09-11"
  patches_count: 1

