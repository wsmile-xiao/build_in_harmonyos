# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求）

package: cmigemo/1.2-gh0.20220623
homepage: "https://github.com/koron/cmigemo"

# 上游（e0f6145f61e0b7058c3006f344e58571d9fdd83a，1.2 系 main 快照）无自动化测试套件：
# 顶层 Makefile 无 check 目标；src/testdir/ 仅含 profile_speed.c 与 romaji_main.c
# 两个手动基准工具，无注册入口、无断言框架。上游测试静态总数记 0。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package.c
    description: "消费者测试：migemo_open 打开最小字典，migemo_query(\"tokyo\") 生成查询正则并断言包含候选词，migemo_release/close 释放"
    command: "./consumer <test_package>/migemo-dict"

# 测试断言总数（近似值）
assertion_count: 4
