version: "1.2-gh0.20220623"
software: "cmigemo"
status: built
build_date: "2026-09-08"
build_system: "makefile"

source:
  url: "https://github.com/koron/cmigemo/archive/e0f6145f61e0b7058c3006f344e58571d9fdd83a.tar.gz"
  sha256: "beef9e7d362713f54879f22191408ee5c80ec4b9bf6bbc215f7d4316a545bc85"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "-f compile/Make_gcc.mak"
    - "CFLAGS_MIGEMO=-fPIC -O2"
    - "LDFLAGS_MIGEMO="
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 configure 仅展开 config.mk 并硬性要求 nkf/qkc（字典用）：配方生成等价 config.mk + make 命令行变量覆盖（CC/CFLAGS_MIGEMO/LDFLAGS_MIGEMO）绕开工具硬检查与写死的 -rpath"
  - "Make_gcc.mak 库目标无 outdir 前缀：libmigemo.so* 产物在源码根而非 build/，package() 需分别取"
  - "shared-only 库的消费者测试用 VirtualRunEnv（env=conanrun）注入 LD_LIBRARY_PATH"
