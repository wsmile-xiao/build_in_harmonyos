package: captive/1.0.0
homepage: "https://github.com/pacoorozco/captive-browser"

upstream_check_command: "go test -list '.*' ."
upstream_test_in_build: true
upstream_test_command: "bin/captive-browser.test -test.timeout=120s"

upstream_tests:
  - name: core_test
    source: core_test.go
    command: "bin/captive-browser.test -test.timeout=120s"
    expected: "PASS"
  - name: udp_smoke_test
    source: udp_smoke_test.go
    command: "bin/captive-browser.test -test.timeout=120s"
    expected: "PASS"

test_package_tests:
  - file: test_captive.sh
    description: "冒烟测试：验证 captive-browser --version 版本输出、captive-browser --help 帮助输出 (usage/socks5) 和 systemd-networkd-dns --help 帮助输出"
    command: "sh test_captive.sh <bin/captive-browser> <bin/systemd-networkd-dns>"

assertion_count: 4
