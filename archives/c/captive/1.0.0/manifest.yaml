knowledge_gained:
  - "HarmonyOS PC (aarch64) 下 Go 程序以 GOOS=linux、GOARCH=arm64、CGO_ENABLED=0 交叉编译"
  - "Go SDK 与最终 ELF 均需用 binary-sign-tool (selfSign, SHA256withECDSA) 签名才能在 OHOS 执行"
  - "go build -o 输出到 HMDFS 会报 mapping output file failed，需先输出到可写工作区再复制"
  - "OHOS 的 patch --dry-run 会真实创建新文件，污染 .orig 基线目录导致 refresh-patch 误判新文件"
  - "Go 1.24 标准库 resolver 对假 DNS 校验严格（EDNS/A+AAAA 双查询），改为纯 Go 裸 UDP DNS 客户端使测试确定性成立"

