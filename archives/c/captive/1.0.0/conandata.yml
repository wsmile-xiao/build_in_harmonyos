sources:
  url: "https://github.com/pacoorozco/captive-browser/archive/refs/tags/v1.0.0.tar.gz"
  sha256: "28e2481c7fc2eab3b91ba493aa4a9a20e80bcbb1cef3ae37b81257ff3c48b63f"

patches:
  - patch_file: "patches/0001-core.go.patch"
    patch_description: "New file core.go: shared logic (LoadConfig/ExtractDHCPDNS/StartSocksProxy/Execute) + pure-Go UpstreamResolver (raw UDP DNS client that forces all lookups through the upstream DNS server, bypassing the device default resolver)"
    patch_type: "portability"
  - patch_file: "patches/0002-core_test.go.patch"
    patch_description: "New file core_test.go: functional test suite (21 tests) - DHCP DNS extraction, TOML config validation, pure-Go DNS resolver against a local fake DNS server, SOCKS5 proxy end-to-end (RFC 1928 handshake + tunneled HTTP request), Execute orchestration with PROXY env injection, version fallback default"
    patch_type: "portability"
  - patch_file: "patches/0003-main.go.patch"
    patch_description: "Refactor main.go: extract shared logic into core.go for testability; add --version and --help flags; --help usage output goes to stdout"
    patch_type: "portability"
  - patch_file: "patches/0004-udp_smoke_test.go.patch"
    patch_description: "New file udp_smoke_test.go: connected-UDP round-trip smoke test guarding the platform's UDP path used by UpstreamResolver"
    patch_type: "portability"
