# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: commata/1.3.1
homepage: "https://github.com/furfurylic/commata"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -S . -B build -DCOMMATA_BUILD_TESTS=ON && cmake --build build && ./build/src_test/test_commata"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (GoogleTest v1.14.0, 668 tests / 107 suites)
upstream_tests:
  - file: src_test/TestCharInput.cpp
    source: commata-1.3.1/src_test/TestCharInput.cpp
    description: "字符输入 (char_input) 测试"
    command: "./build/src_test/test_commata"
  - file: src_test/TestParseCsv.cpp
    source: commata-1.3.1/src_test/TestParseCsv.cpp
    description: "CSV 解析测试"
    command: "./build/src_test/test_commata"
  - file: src_test/TestRecordExtractor.cpp
    source: commata-1.3.1/src_test/TestRecordExtractor.cpp
    description: "记录抽取器测试 (含 libc++ allocator 适配)"
    command: "./build/src_test/test_commata"
  - file: src_test/TestStoredTable.cpp
    source: commata-1.3.1/src_test/TestStoredTable.cpp
    description: "存储表测试"
    command: "./build/src_test/test_commata"
  - file: src_test/TestTablePull.cpp
    source: commata-1.3.1/src_test/TestTablePull.cpp
    description: "表格拉取测试 (含移动语义 SSO 适配)"
    command: "./build/src_test/test_commata"
  - file: hmos_test.cpp
    source: commata-1.3.1/hmos_test.cpp
    description: "HarmonyOS 专项测试 (平台宏/解析/动态链接)"
    command: "./hmos_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 实际调用 commata 的 parse_csv/table_pull API 验证字段提取"
    command: "./test_commata"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 668