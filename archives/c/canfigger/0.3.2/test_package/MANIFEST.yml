# test_package/MANIFEST.yml — canfigger 0.3.2
# Upstream and consumer test declaration required by CI L0e.

package: canfigger/0.3.2
homepage: "https://github.com/andy5995/canfigger"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "canfigger-0.3.2.tar.xz (official GitHub release asset)"
  source_sha256: "f128a62cec50cce16e1e8c87012f8564d972b663316b27358d1d7f6b4486bec8"
  build_system: "Meson"
  test_definition: >
    tests/meson.build registers 12 assert-based test executables via meson
    test(); meson.build additionally registers example-01/example-02 as test
    entries when build_examples=true. The recipe enables both options, so the
    complete suite is 14 test entries. All tests are self-contained C programs
    (no external test framework); counting unit is the meson test entry.
  dependency: "none (no external test framework or library)"
  portability_changes: []
  examples_note: >
    example-01/example-02 read their .conf files through the SOURCE_DIR
    compile definition, so they run in-tree like the unit tests. They are
    registered by upstream as test entries when build_tests=true and
    build_examples=true (both enabled by the recipe default tests=True).

upstream_check_command: "meson test -C <build-folder> --print-errorlogs --timeout-multiplier=16"
upstream_test_in_build: true
upstream_test_command: "meson test -C <build-folder> --no-rebuild --print-errorlogs --timeout-multiplier=16"

# Counting unit: one meson test entry (tests/meson.build foreach + the two
# example entries in the top-level meson.build). Take-number command:
#   meson test -C <build-folder> --print-errorlogs
# summary lines "Ok:/Fail:" in meson-logs/testlog.txt
upstream_tests:
  - test_name: "check_version"
    source: "tests/check_version.c"
    kind: unit
  - test_name: "bom"
    source: "tests/bom.c"
    kind: unit
  - test_name: "colons"
    source: "tests/colons.c"
    kind: unit
  - test_name: "config_file"
    source: "tests/config_file.c"
    kind: unit
  - test_name: "dirs"
    source: "tests/dirs.c"
    kind: unit
  - test_name: "file_open_err"
    source: "tests/file_open_err.c"
    kind: unit
  - test_name: "incomplete_parse_file"
    source: "tests/incomplete_parse_file.c"
    kind: unit
  - test_name: "multiple_attributes"
    source: "tests/multiple_attributes.c"
    kind: unit
  - test_name: "no_trailing_newline"
    source: "tests/no_trailing_newline.c"
    kind: unit
  - test_name: "parse_file"
    source: "tests/parse_file.c"
    kind: unit
  - test_name: "skip_attributes"
    source: "tests/skip_attributes.c"
    kind: unit
  - test_name: "unicode"
    source: "tests/unicode.c"
    kind: unit
  - test_name: "test_example-01"
    source: "example-01.c"
    kind: example
  - test_name: "test_example-02"
    source: "example-02.c"
    kind: example

upstream_test_total: 14
upstream_test_passed: 14
upstream_test_failed: 0

# Consumer-perspective checks exercise the parse/free iteration protocol,
# attribute iteration, version macros, error paths and XDG helpers. Each
# CHECK has a failure exit path (assert + counter).
test_package_tests:
  - file: test_canfigger.c
    scenario: "consumer-api"
    description: >
      Build and run a Conan consumer that parses a config file with comments
      and section headers, iterates nodes and attributes with the
      free_current_*_advance protocol, verifies the version macros, the
      missing-file NULL path, XDG_CONFIG_HOME handling and path_join edge
      cases.
    command: "./test_canfigger"
    assertions: 40

assertion_count: 40
