version: "0.3.2"
software: "canfigger"
status: built
build_date: "2026-09-05"
build_system: meson

source:
  url: "https://github.com/andy5995/canfigger/releases/download/v0.3.2/canfigger-0.3.2.tar.xz"
  sha256: "f128a62cec50cce16e1e8c87012f8564d972b663316b27358d1d7f6b4486bec8"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "--prefix=/ (MesonToolchain 默认)"
    - "-Ddefault_library=shared (选项 shared=True)"
    - "-Dbuild_tests=true"
    - "-Dbuild_examples=true"
  dependencies:
    - "meson/1.11.0 (tool_requires)"
  build_tool:
    name: meson
    version: "1.11.0 (ohpcd 预构建工具包)"
  cc: clang
  cxx: clang++
  compiler: clang
  parallelism: 1

patches_applied: []

knowledge_gained:
  - "canfigger 0.3.2 上游 Meson 构建与 14 项测试套件在 OHOS aarch64 零补丁原生通过,库源码与测试无需任何平台修改 (reference: archives/c/canfigger/0.3.2/notes.md 验证结果一节)"
  - "Meson 库项目的 Conan 配方用 ohpcd 预构建 meson/1.11.0 tool_requires(1.11.0.1 无预构建包),conan.tools.meson 的 MesonToolchain + Meson 即可完成 setup/compile/test/install (reference: archives/l/libavtp/0.2.0/manifest.yaml knowledge_gained)"
  - "hnp clang 驱动在链接期自动内嵌 ad-hoc .codesign 签名段;binary-sign-tool selfSign 重签产物在本机 musl 加载器 SIGSEGV,剥离 .codesign 段后恢复可加载——本地/Conan 构建链的 .so 不应二次签名 (reference: archives/c/canfigger/0.3.2/notes.md 遇到的问题与解决方案 #1;知识草稿 knowledge/drafts/DRAFT-canfigger-resign-crash)"
  - "Meson 安装的版本化 .so 别名(.so.0/.so)在 HarmonyOS 包视图中按 libavtp 先例实体化为真实文件,实体拷贝保留链接器签名 (reference: archives/l/libavtp/0.2.0/manifest.yaml knowledge_gained)"
  - "lang-preflight 源码统计会把 release tarball 中 doxygen 预生成 docs/ 的 .js 文件计入 nodejs 主体触发 mixed 误判;排除生成文档目录后以真实 .c 主体重跑即得正确语言判定 (reference: archives/c/canfigger/0.3.2/notes.md 遇到的问题与解决方案 #3)"

validation:
  upstream_tests:
    command: "meson test -C <build-folder> --no-rebuild --print-errorlogs --timeout-multiplier=16"
    statistical_unit: "meson test 条目(12 个单元测试可执行文件 + 2 个 example 作为 test 条目)"
    suites: 14
    total: 14
    passed: 14
    failed: 0
    skipped: 0
    not_run: 0
  conan_create:
    command: "conan create archives/c/canfigger/0.3.2 -pr:h=<ohos-aarch64 profile> -pr:b=<ohos-aarch64 profile> --build=missing"
    result: passed
  test_package:
    command: "./test_canfigger"
    assertions: 40
    result: passed
  examples: "example-01/example-02 由上游注册为 meson test 条目(14 项中含 2 项),全部通过"
