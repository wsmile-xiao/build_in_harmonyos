knowledge_gained:
  - "上游 Makefile 使用 BSD make 语法，OHOS 环境没有可用的 bmake，因此由 Conan 配方直接调用 clang。"
  - "error.h 和 const.h 是 BSD make 生成文件；配方先生成占位 const.h，再以 clang 预处理 const.c 生成常量声明。"
  - "OHOS SDK 缺少 vis.h、strlcpy、strlcat、strtonum、reallocarray、funopen、fpurge、closefrom 和 sys_signame；适配使用命名空间化的本地兼容实现或 POSIX/GNU 替代接口。"
  - "csh 是命令行应用，构建为静态 ELF，并在 OHOS package() 阶段验证 .codesign。"

