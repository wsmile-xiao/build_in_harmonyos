# csh 20240808 source and HarmonyOS portability patches
# The official Debian mirror carries the unmodified OpenBSD-derived source.
sources:
  url: "https://deb.debian.org/debian/pool/main/c/csh/csh_20240808.orig.tar.xz"
  sha256: "df916baa73c264516177c6667cc0a061f6eb9743f862b625f17067d74a3f4d1c"

patches:
  - patch_file: "patches/0001-csh.c.patch"
    patch_description: "Use the local compatibility header and fopencookie on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0002-file.c.patch"
    patch_description: "Guard the unsupported TIOCSTAT command-line status path"
    patch_type: "portability"
  - patch_file: "patches/0003-glob.c.patch"
    patch_description: "Use the POSIX glob implementation available on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0004-misc.c.patch"
    patch_description: "Replace OpenBSD closefrom with a portable close loop"
    patch_type: "portability"
  - patch_file: "patches/0005-ohos-compat.c.patch"
    patch_description: "Implement the required BSD libc compatibility APIs"
    patch_type: "portability"
  - patch_file: "patches/0006-ohos-compat.h.patch"
    patch_description: "Add declarations and macros for unavailable BSD libc APIs"
    patch_type: "portability"
  - patch_file: "patches/0007-pathnames.h.patch"
    patch_description: "Provide the shell path fallback used by OHOS"
    patch_type: "portability"
  - patch_file: "patches/0008-proc.c.patch"
    patch_description: "Use strsignal for descriptions and local short signal names"
    patch_type: "portability"
  - patch_file: "patches/0009-str.c.patch"
    patch_description: "Use the local vis compatibility declarations"
    patch_type: "portability"
