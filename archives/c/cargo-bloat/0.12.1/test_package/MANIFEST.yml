package: cargo-bloat/0.12.1
homepage: "https://github.com/RazrFalcon/cargo-bloat"

upstream_check_command: "cargo build && cargo build --no-default-features"
upstream_test_in_build: false
upstream_test_command: "cargo build --locked && cargo build --locked --no-default-features"

upstream_tests:
  - file: .github/workflows/main.yml
    source: cargo-bloat-0.12.1/.github/workflows/main.yml
    description: "Upstream CI builds with default features and without default features"
    command: "cargo build; cargo build --no-default-features"

test_package_tests:
  - file: test_cargo_bloat.py
    description: "Checks --version, --help, Cargo fixture build, ELF parsing, JSON output, and regex filtering"
    command: "python3 test_cargo_bloat.py <cargo-bloat> sample/Cargo.toml"

assertion_count: 5
