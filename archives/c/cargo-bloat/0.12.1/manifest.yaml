  - "The software-level commands.json declares the packaged executable as an R38 tool."
  - "Cargo must receive the resolved CA bundle through cainfo, CARGO_HTTP_CAINFO, SSL_CERT_FILE, and CURL_CA_BUNDLE even when a worker supplies preinstalled cargo.real; the pinned CA bottle is the isolated fallback."
  - "The 2026-08-20 runner task built the OHOS binary and passed version/help plus fixture ELF analysis."
