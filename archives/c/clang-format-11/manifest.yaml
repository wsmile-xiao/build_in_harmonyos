software: clang-format-11
display: "clang-format 11"
description: "LLVM clang-format 代码格式化命令行工具（v11.1.0，aarch64-unknown-linux-ohos）"
category: build-tool
homepage: "https://clang.llvm.org/docs/ClangFormat.html"
license: "Apache-2.0 WITH LLVM-exception"
build_system: cmake

ohos_adaptation:
  key_points:
    - "鸿蒙 PC 真机原生编译：不设 CMAKE_SYSTEM_NAME → 不触发交叉编译 → llvm-tblgen 原生编+跑（与 clang/20.1.8 同族策略）"
    - "config.guess 不认 HarmonyOS：build() 覆盖为 stub 输出 aarch64-unknown-linux-ohos"
    - "cmake 4.1.2 需 CMAKE_POLICY_VERSION_MINIMUM=3.5；提供 Platform/HarmonyOS.cmake（include(Platform/Linux)）挂 CMAKE_MODULE_PATH"
    - "LLVM 11 布局：clang-format 在 clang/tools/clang-format，单测 clang/unittests/Format，lit 测试 clang/test/Format"
    - "上游测试真实运行：单测 760/760（100%）、lit 21/21（100%），build() 打印 'UPSTREAM TESTS' 统计行"
    - "clang-format 运行时依赖系统 libc++_shared.so（R26 合规，不打包系统同名 .so）"
    - "交付物全覆盖（对齐上游 install() 规则）：bin/clang-format + bin/git-clang-format + share/clang/*（5 个集成脚本）"

versions:
  11.1.0.src:
    status: built
    build_date: "2026-09-17"
    conan_ref: "clang-format-11/11.1.0.src"
    notes: 首个适配版本（conan create + test_package 通过；上游测试 781/781，本地 CI 模拟 L0-L5 全过）

tags:
  - formatter
  - clang
  - build-tool
