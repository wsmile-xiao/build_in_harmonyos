# test_package/MANIFEST.yml
# 上游官方测试声明文件（LLVM 11.1.0 clang-format 上游测试）
# 上游布局（LLVM 11）：clang-format 位于 clang/tools/clang-format，单测在
# clang/unittests/Format，lit 测试在 clang/test/Format（本版本无 clang-tools-extra 布局）。

package: clang-format-11/11.1.0.src
homepage: "https://clang.llvm.org/docs/ClangFormat.html"

# 上游测试命令（cmake 构建目标 + lit 套件）
upstream_check_command: "cmake --build build-ohos --target FormatTests FileCheck count not llvm-config && build-ohos/bin/llvm-lit -sv clang/test/Format"

# conanfile.py build() 中已真实运行上游测试（R51 实跑 + 'UPSTREAM TESTS' 统计行留痕）
upstream_test_in_build: true
upstream_test_command: "build-ohos/tools/clang/unittests/Format/FormatTests && build-ohos/bin/llvm-lit -sv <src>/clang/test/Format"

# 上游实际运行的测试程序（实测数字）
upstream_tests:
  - file: clang/unittests/Format/FormatTest.cpp
    source: llvm-project-11.1.0.src/clang/unittests/Format/FormatTest.cpp
    description: "clang-format 单测（gtest FormatTests，760 个用例 / 21 test cases 全部通过）"
    command: "./build-ohos/tools/clang/unittests/Format/FormatTests"
    tests_total: 760
    tests_passed: 760
    tests_failed: 0
  - file: clang/test/Format/basic.cpp
    source: llvm-project-11.1.0.src/clang/test/Format/
    description: "clang-format lit 测试套件（clang/test/Format，21 个测试文件全部通过）"
    command: "./build-ohos/bin/llvm-lit -sv clang/test/Format"
    tests_total: 21
    tests_passed: 21
    tests_failed: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: input.cpp
    description: "用打包的 clang-format -style=LLVM 格式化 input.cpp，断言输出逐字节等于 expected.cpp"
    command: "./bin/clang-format -style=LLVM input.cpp > formatted.out && cmp formatted.out expected.cpp"
  - file: conanfile.py
    description: "断言打包二进制 --version 输出含 'clang-format version 11.1.0'"
    command: "./bin/clang-format --version | grep -q 'clang-format version 11.1.0'"
  - file: conanfile.py
    description: "bin/git-clang-format（上游 install(PROGRAMS) 交付物）：可执行位 + 内容含上游 usage 字符串 + 语法校验（内存 compile()，不用 py_compile 以免在包内写 __pycache__ 污染制品）；若 conanrun 子环境内探测到 git，则额外 best-effort 实跑 --help 校验输出含 'git clang-format'（该脚本 main() 首行调 `git config`，能否运行取决于宿主外部 git，非本包交付物 → 失败仅告警不判负）"
    command: "test -x <pkg>/bin/git-clang-format && python3 -c \"compile(open(p).read(), p, 'exec')\" && grep -q 'git clang-format \\[OPTIONS\\]' <pkg>/bin/git-clang-format"
  - file: conanfile.py
    description: "share/clang/* 集成脚本齐全（clang-format-diff.py / clang-format.py / clang-format-sublime.py / clang-format.el / clang-format-bbedit.applescript）且均具可执行位（LLVM 11 对这 5 个文件均用 install(PROGRAMS)）"
    command: "test -x <pkg>/share/clang/clang-format-diff.py && test -x <pkg>/share/clang/clang-format.py && test -x <pkg>/share/clang/clang-format-sublime.py && test -x <pkg>/share/clang/clang-format.el && test -x <pkg>/share/clang/clang-format-bbedit.applescript"

# 交付物清单（逐条对齐上游 clang/tools/clang-format/CMakeLists.txt 的 install() 规则）
#   bin/clang-format                            （add_clang_tool）
#   bin/git-clang-format                        （install(PROGRAMS) → bindir）
#   share/clang/clang-format-diff.py            （install(PROGRAMS)）
#   share/clang/clang-format.py                 （install(PROGRAMS)，vim 集成）
#   share/clang/clang-format-sublime.py         （install(PROGRAMS)，sublime 集成）
#   share/clang/clang-format.el                 （install(PROGRAMS)，emacs 集成）
#   share/clang/clang-format-bbedit.applescript （install(PROGRAMS)，BBEdit 集成）
# 上游 clang-format-fuzzer 目标为 EXCLUDE_FROM_ALL 且无 install 规则，非交付物。
deliverables:
  - bin/clang-format
  - bin/git-clang-format
  - share/clang/clang-format-diff.py
  - share/clang/clang-format.py
  - share/clang/clang-format-sublime.py
  - share/clang/clang-format.el
  - share/clang/clang-format-bbedit.applescript

# 测试断言总数（口径 = 上游断言数 + test_package 断言数）
#   上游 781 = 单测 FormatTests 760（gtest "[  PASSED  ] 760 tests."）
#              + lit clang/test/Format 21（"Passed: 21"）
#   test_package 5（--version 可执行 1 + input.cpp 格式化输出逐字节比较 1 + 版本号 grep 1
#                   + git-clang-format 可执行/本体/语法 1 + share/clang/* 交付物齐全 1）
# 全部实测通过，通过率 786/786 = 100%（上游测试与 test_package 实跑退出码均为 0）
assertion_count: 786
