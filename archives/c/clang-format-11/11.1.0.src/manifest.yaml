software: clang-format-11
version: "11.1.0.src"
build_date: "2026-09-17"
build_system: cmake
status: built
conan_ref: "clang-format-11/11.1.0.src"

source:
  url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-11.1.0/llvm-project-11.1.0.src.tar.xz"
  sha256: "74d2529159fd118c3eac6f90107b5611bccc6f647fdea104024183e8d5e25831"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-G Ninja"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DLLVM_TARGETS_TO_BUILD=AArch64"
    - "-DLLVM_ENABLE_PROJECTS=clang"
    - "-DLLVM_ENABLE_ASSERTIONS=OFF"
    - "-DLLVM_INCLUDE_TESTS=ON"
    - "-DLLVM_INCLUDE_UTILS=ON"
    - "-DLLVM_INCLUDE_EXAMPLES=OFF"
    - "-DLLVM_INCLUDE_DOCS=OFF"
    - "-DLLVM_ENABLE_TERMINFO=OFF"
    - "-DLLVM_ENABLE_ZLIB=OFF"
    - "-DLLVM_ENABLE_LIBXML2=OFF"
    - "-DLLVM_ENABLE_WERROR=OFF"
    - "-DCMAKE_CXX_FLAGS=-stdlib=libc++"
    - "-DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -lc++abi"
  # build() 在 configure 之外另注入/生成（非 -D 参数，故不列入上方列表）：
  #   env  CMAKE_POLICY_VERSION_MINIMUM=3.5（cmake 4.x 对 LLVM 11 老 policy 的兼容开关）
  #   file <build>/_cmake_modules/Platform/HarmonyOS.cmake（include(Platform/Linux)，经 -DCMAKE_MODULE_PATH 生效）
  #   file llvm/cmake/config.guess stub（#!/bin/sh + echo aarch64-unknown-linux-ohos）
  #   编译器由 profile conf `tools.build:compiler_executables` 提供（-DCMAKE_C/CXX_COMPILER）
  #   构建目标：clang-format FileCheck FormatTests count not llvm-config
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "clang-format-11 11.1.0.src：鸿蒙 PC 真机原生编译（不设 CMAKE_SYSTEM_NAME → 不触发交叉 → llvm-tblgen 原生编+跑），仅 AArch64 target，LLVM_ENABLE_PROJECTS=clang（LLVM 11 中 clang-format 位于 clang/tools/clang-format，非 clang-tools-extra）"
  - "config.guess 不认 uname -s=HarmonyOS（config-ix.cmake 无条件调用）→ build() 覆盖为 stub 输出 aarch64-unknown-linux-ohos；cmake 4.1.2 需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "cmake 无 Platform/HarmonyOS 模块 → 提供 include(Platform/Linux) 的 Platform/HarmonyOS.cmake 挂到 CMAKE_MODULE_PATH"
  - "llvm-lit 的 map_config 依赖构建目录与源码 clang/ 同级（bdir/../clang）：构建目录必须放在源码树内（source_folder/build-ohos）"
  - "上游测试：单测 FormatTests 760/760 通过（100%）、lit clang/test/Format 21/21 通过（100%），已真实运行并打印 'UPSTREAM TESTS' 统计行"
  - "clang-format 运行时动态依赖 libc++_shared.so（OHOS 系统库，无需打包，R26 合规：不输出系统同名 .so）"
  - "交付物必须对齐上游 clang/tools/clang-format/CMakeLists.txt 的全部 install() 规则（全功能，非子集）：bin/clang-format + bin/git-clang-format（git 集成脚本，上游装到 bindir）+ share/clang/*（5 个编辑器/diff 集成脚本）；只打 bin/clang-format 属交付物缺项（同族先例 clang-format/22.1.8.src 同）；git-clang-format 为 Python 脚本，运行时另需宿主 python3 与 git"
