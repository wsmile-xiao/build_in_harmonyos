# Upstream and consumer test inventory for chrpath 0.18.

package: chrpath/0.18
homepage: "https://codeberg.org/pere/chrpath"

upstream_check_command: "make -C testsuite check"
upstream_test_in_build: true
upstream_test_command: "make -C testsuite check"
upstream_tests_total: 10

upstream_tests:
  - file: testsuite/runtest.sh
    source: testsuite/runtest.sh
    description: "--help succeeds"
    command: "make -C testsuite check"
  - file: testsuite/runtest.sh
    source: testsuite/runtest.sh
    description: "--version succeeds"
    command: "make -C testsuite check"
  - file: testsuite/runtest.sh
    source: testsuite/runtest.sh
    description: "script input is rejected"
    command: "make -C testsuite check"
  - file: testsuite/runtest.sh
    source: testsuite/runtest.sh
    description: "missing input is rejected"
    command: "make -C testsuite check"
  - file: testsuite/runtest.sh
    source: testsuite/runtest.sh
    description: "existing RPATH is listed"
    command: "make -C testsuite check"
  - file: testsuite/runtest.sh
    source: testsuite/runtest.sh
    description: "RPATH is replaced with a shorter path"
    command: "make -C testsuite check"
  - file: testsuite/runtest.sh
    source: testsuite/runtest.sh
    description: "larger RPATH replacement is attempted"
    command: "make -C testsuite check"
  - file: testsuite/runtest.sh
    source: testsuite/runtest.sh
    description: "RPATH to RUNPATH conversion is attempted"
    command: "make -C testsuite check"
  - file: testsuite/runtest.sh
    source: testsuite/runtest.sh
    description: "RPATH and RUNPATH are removed"
    command: "make -C testsuite check"
  - file: testsuite/runtest.sh
    source: testsuite/runtest.sh
    description: "testsuite returns the aggregate result"
    command: "make -C testsuite check"

test_package_tests:
  - file: test.sh
    description: "consumer smoke: version, help, RPATH list/replace/delete, and non-ELF rejection"
    command: "bash test.sh"
  - file: test_ohos.sh
    description: "HarmonyOS native target test: long-option RPATH replacement under /data/local/tmp"
    command: "sh test_ohos.sh"

assertion_count: 8
