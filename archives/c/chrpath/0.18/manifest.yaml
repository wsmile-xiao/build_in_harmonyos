version: "0.18"
software: chrpath
status: built
build_date: "2026-09-15"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/c/chrpath/chrpath_0.18.orig.tar.gz"
  sha256: "f09c49f0618660ca11fc6d9580ddde904c7224d4c6d0f6f2d1f9bcdc9102c9aa"
  tar_format: tar.gz

build:
  system: autotools
  dependencies: []
  configure:
    - "autoreconf -fi when Autoconf, Automake, and aclocal are available"
    - "direct C build with generated config.h when the OHOS worker lacks Automake"
    - "OHOS link mode uses lld"

patches_applied:
  - "0001-ohos-getopt-long-fallback.patch"

tests:
  upstream_tests: 10
  upstream_test_in_build: true
  test_package: "test.sh"
  harmonyos_tests:
    - "test_ohos.sh: long-option RPATH replacement on a target ELF under /data/local/tmp"
  assertion_count: 8
