software: chrpath
display: "chrpath"
description: "Tool to edit the rpath in ELF binaries"
category: build-tool
homepage: "https://codeberg.org/pere/chrpath"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Builds the small C utility with the Conan-provided OHOS compiler and lld"
    - "Uses the upstream Autotools path when Autoconf and Automake are available"
    - "Falls back to a direct reproducible C build when aclocal/automake is unavailable"
    - "Normalizes long CLI options when OHOS libc lacks getopt_long"
  common_dependencies: []

versions:
  "0.18":
    status: built
    build_date: "2026-09-15"
