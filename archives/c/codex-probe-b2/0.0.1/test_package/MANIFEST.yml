# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: codex-probe-b2/0.0.1
homepage: "https://github.com/leiMizzou/codex-probe"

# 上游测试命令 (用于 unittest discover 分析)
upstream_check_command: "python3 -m unittest discover -s tests -t . -v"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python -m unittest discover -s tests -t . -v (sys.executable, cwd=source_folder)"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_http_retry.py
    source: codex-probe-579b6b0/tests/test_http_retry.py
    description: "HTTP 重试策略测试（monkey-patched urlopen，无真实网络）"
    command: "python3 -m unittest tests.test_http_retry -v"
  - file: tests/test_scoring.py
    source: codex-probe-579b6b0/tests/test_scoring.py
    description: "评分、聚类、对比逻辑测试（纯函数）"
    command: "python3 -m unittest tests.test_scoring -v"
  - file: tests/test_validators.py
    source: codex-probe-579b6b0/tests/test_validators.py
    description: "响应校验器与文本辅助函数测试"
    command: "python3 -m unittest tests.test_validators -v"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_consumer.py
    description: "消费者测试: 模块导入、CLI 入口、基线数据解析、list-baselines、audit 子命令、OHOS 平台指纹、Python 版本"
    command: "python3 test_consumer.py <lib_dir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 81
