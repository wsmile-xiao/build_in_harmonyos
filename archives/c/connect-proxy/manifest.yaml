# 软件级 manifest — connect-proxy
# 遵循 ARCHIVE-SPEC v3.0

software: connect-proxy
display: "connect-proxy (ssh-connect)"
description: "通过 SOCKS4/5 与 HTTP 隧道中继 TCP 连接的命令行工具，常用作 ssh 的 ProxyCommand；Debian/Termux 等发行版以 connect-proxy 之名分发"
category: network
homepage: "https://github.com/gotoh/ssh-connect"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 硬编码 CC=gcc，需从 Conan profile 注入 clang（R33）"
    - "OHOS libc(musl) 已内置 resolver/socket，必须置空 LDLIBS，不链接 -lresolv/-lsocket/-lnsl"
    - "上游 Makefile 无 install 目标，由 package() 安装二进制；按发行版惯例命名为 connect-proxy（避免与既有 connect 包的 bin/connect 冲突）"
    - "switch_ns() 使用 glibc 的 _res 全局解析器状态，musl 无此结构；补丁 0001 在 musl 上直接向 -R 指定的 nameserver 发 UDP DNS 查询，守卫用 __linux__ && !__GLIBC__（OHOS 下等价，规避 R8 平台宏）"
    - "OHOS 无 /etc/passwd 条目时 getpwuid() 返回 NULL 会使 connect 直接 abort；补丁 0002 回退到 USER/LOGNAME 环境变量"
  common_dependencies: []

versions:
  "1.105":
    status: built
    build_date: 2026-09-08
