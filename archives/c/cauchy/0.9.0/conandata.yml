sources:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/c/cauchy/cauchy_0.9.0.orig.tar.bz2"
  sha256: "7a0cd9ef17190c09f271454b0e698e2e82172ce9efb9ef662e4f7134863d9b56"

patches:
  - patch_file: "patches/0001-ohos-cmake-static.patch"
    patch_description: "cmake_minimum_required 提升到 3.5；Cauchy/CauchyXUnit/m2mml/CauchyTest 去掉 SHARED（默认静态库）；Asserts.h 用 #include <complex> 替代 std 命名空间内不完整前向声明"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-fix-unchecked-map-find.patch"
    patch_description: "DeclarationsRegistry::load 中 constants/globals 的 map::find 结果未校验 end() 即解引用，指针未初始化（UB）：glibc 下静默、OHOS musl 下 SIGSEGV（真机 faultlogger cppcrash 定位）。补 end() 守卫，缺失条目保持 no-op 语义"
    patch_type: "bugfix"
  - patch_file: "patches/0003-ohos-aarch64-arch-detect.patch"
    patch_description: "Config.h.cmake 架构探测缺少 aarch64（OHOS/ARM64）分支导致 'Unknown architecture' 编译错误；补 CAUCHY_ARCH_ARM_64"
    patch_type: "portability"
