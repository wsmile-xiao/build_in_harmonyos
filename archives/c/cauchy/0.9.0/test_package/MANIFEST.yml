# test_package/MANIFEST.yml
# cauchy 0.9.0 — MATLAB/Octave→C++(Eigen) 库 + cauchymc 工具
# CI L0e 要求此文件存在。

package: cauchy/0.9.0
homepage: "https://bitbucket.org/cyrille/cauchy"

# 上游测试：tests/ 含 62 个 .m，经 cauchymc 翻译为 C++ 后 ctest 运行。
# 上游没有独立可执行测试入口；实际为 "cauchymc 生成 + g++ 编译 + 运行"。
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

# 说明：cauchymc 代码生成器在本环境（OHOS aarch64, clang 15, libc++/musl）对
# 任意 .m 输入 SIGSEGV（eigen/mathml 后端、-O0/-O3 均复现），上游 62 个
# .m 用例无法在本机完整执行；以 test_package consumer（链接 libCauchy +
# 版本 API 冒烟）作为可验证替代，SIGSEGV 详情记录于 notes.md。
upstream_tests: []

test_package_tests:
  - file: src/test_cauchy.cpp
    description: "C++ consumer 链接 libCauchy.a，调用 LibraryVersionString()/VersionMajor 等并断言 0.9.0"
    command: "./test_cauchy"

assertion_count: 3
