version: "0.9.0"
software: cauchy
status: built
build_date: "2026-09-09"
build_system: cmake

source:
  # bitbucket 上游(cyrille/cauchy) 已失效；Ubuntu 保留 cauchy_0.9.0.orig.tar.bz2
  # （.hg tag = v0.9.0 快照），作为可信源码镜像。
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/c/cauchy/cauchy_0.9.0.orig.tar.bz2"
  sha256: "7a0cd9ef17190c09f271454b0e698e2e82172ce9efb9ef662e4f7134863d9b56"
  tar_format: tar.bz2

build:
  system: cmake
  configure_options:
    - "-DCAUCHY_BUILD_TESTS=OFF"
    - "-DBUILD_SHARED_LIBS=OFF (patch 去掉 add_library SHARED)"
    - "EIGEN3_INCLUDE_DIR = eigen/3.4.0 package include/eigen3"
  dependencies:
    - "eigen/3.4.0"

patches_applied:
  - "patches/0001-ohos-cmake-static.patch"

knowledge_gained:
  - "cauchy 2010 年代 CMake 项目，cmake_minimum_required 2.6 需提升至 3.5 才能被现代 CMake 解析"
  - "上游 add_library(... SHARED) 在 OHOS 默认静态策略下改为默认(静态)库"
  - "xUnit/Asserts.h 在 namespace std 内前向声明 template complex 与现代 libc++ 冲突，改用 #include <complex>"
  - "公开头仅 Runtime/Cauchy 与 m2mml.h 被 install；Cauchy/*.h 需在 package() 手工补装"
  - "真机限制：cauchymc 代码生成器（eigen/mathml 后端）在 OHOS clang15/libc++ 上对 .m 输入 SIGSEGV（见 notes.md），上游 62 .m 测试无法运行"

test_results:
  type: consumer
  total: 1
  passed: 1
  failed: 0
  skipped: 0
