version: "1.8.4"
software: "coinmp"
status: built
build_date: "2026-09-21"
build_system: "autotools"

source:
  url: "https://github.com/coin-or/CoinMP/archive/refs/tags/releases/1.8.4.tar.gz"
  sha256: "ec03a5110d9d79da950669e3400f3b81c4391747b14821d8997f9f8755873150"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-musl"
    - "--host=aarch64-unknown-linux-musl"
    - "--disable-shared"
    - "--enable-static"
    - "--disable-dependency-tracking"
  dependencies:
    - cbc/2.10.13
    - clp/1.17.10
    - cgl/0.60.10.1
    - coin-or/0.108.12
    - coinutils/2.11.13
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CoinMP 1.8.4 自带 2019-02-24 版 config.sub 不识别 aarch64-unknown-linux-musl 三元组，需在 build() 中补 linux-musl* 支持"
  - "CoinMP configure 通过 pkg-config 探测 cbc/clp/osi-clp，需 osi.pc/osi-clp.pc 兼容别名（同 cgl/clp/cbc 先例）"
  - "COIN-OR 依赖包 .la 内 libdir='//lib' 无效，需 Makefile 中 -l* 替换为绝对 .a 路径"
