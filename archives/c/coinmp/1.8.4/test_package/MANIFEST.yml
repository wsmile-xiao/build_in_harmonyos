# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: coinmp/1.8.4
homepage: "https://github.com/coin-or/CoinMP"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# CoinMP 上游测试入口为 `make -C CoinMP/test unitTest && ./CoinMP/test/unitTest`
# （顶层 Makefile 的 check 目标为空，test 子目录被 ALWAYS_FALSE 守卫排除，
#  `make check` 不运行任何测试；unitTest 需在生成 Makefile 后手动构建运行）。
upstream_check_command: "make -C CoinMP/test unitTest && ./CoinMP/test/unitTest"

# conanfile.py build() 方法中是否已集成上游测试
# 注意: CoinMP 上游 unitTest 在适配阶段已真机实测运行（见 reports/test-report.md）;
# 但配方 build() 仅执行 `make -j1 check`（上游空目标），unitTest 未在 build() 内集成，
# 因此如实声明为 false，由 test_package 消费者测试（test.cpp）承担配方内 API 验证。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: unitTest.cpp
    source: coinmp-1.8.4/CoinMP/test/unitTest.cpp
    description: "CoinMP C-API 单元测试：加载并求解 8 个 LP/MIP 实例（CoinTest/Afiro/Bakery/Exmip1/GamsSos1a/GamsSos2a/P0033/SemiCont），断言最优解状态与目标值"
    command: "./CoinMP/test/unitTest"
    run_env: "true（适配阶段真机实测；需在 LD_LIBRARY_PATH 注入 OHOS SDK libc++ 目录）"
    result: "8/8 实例全部返回 Optimal solution found，assert 全过，exit 0"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：通过 CoinMP C-API 加载上游 CoinTest 实例并求解，断言求解成功、解状态最优、目标值与参考值 1428729.28571 一致"
    command: "./test_coinmp"
    result: "PASS（conan-verify G2 实测）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
