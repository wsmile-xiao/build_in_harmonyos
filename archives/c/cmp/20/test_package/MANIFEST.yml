# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cmp/20
homepage: "https://github.com/camgunz/cmp"

# 上游测试命令 (用于分析测试列表)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (17 个独立 cmocka 用例: test/tests.c 15 个实现 +
# test/test.c 注册 17 项，其中 test_float_flip 受 CMP_NO_FLOAT 条件控制)
upstream_tests:
  - file: test/test.c
    source: cmp-20/test/test.c
    description: "cmocka 测试入口 main，注册 17 个用例（CMP_NO_FLOAT 下 16 个）"
    command: "./cmpunittest"
  - file: test/tests.c
    source: cmp-20/test/tests.c
    description: "17 个 test_* 用例实现，共 1557 个断言宏"
    command: "./cmpunittest"

# test_package 中自带的测试 (消费者视角验证；鸿蒙专项：无堆编解码 +
# 精确线格式字节 + 64 位边界值回环)
test_package_tests:
  - file: test_package.c
    description: "鸿蒙专项消费者测试：-Wl,--wrap 验证零堆分配编解码、精确 MessagePack 字节、uint64/int64 边界回环"
    command: "./test_cmp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1557