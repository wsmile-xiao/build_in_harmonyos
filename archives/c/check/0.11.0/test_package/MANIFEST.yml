# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: check/0.11.0
homepage: "https://libcheck.github.io/check/"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest -N"

upstream_tests:
  - file: tests/check_check_main.c
    source: check-0.11.0/tests/
    description: "check_check 主测试程序（914 项主套件 + 260 项 subordinate 全过）"
    command: "./check_check"
  - file: tests/test_output.sh
    source: check-0.11.0/tests/test_output.sh
    description: "输出格式校验 shell 脚本（6 个脚本入口全过）"
    command: "sh test_output.sh"

test_package_tests:
  - file: test.c
    description: "HarmonyOS 消费者用例: suite_create/srunner 公开 API 编译链接运行"
    command: "./test_check"

assertion_count: 4