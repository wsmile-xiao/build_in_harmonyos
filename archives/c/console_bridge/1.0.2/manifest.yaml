software: console_bridge
version: "1.0.2"
status: published

build_date: "2026-06-05"

source:
  url: "https://github.com/ros/console_bridge/archive/refs/tags/1.0.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  build_system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DBUILD_SHARED_LIBS=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "标准 cmake 构建，无特殊适配需求"
  - "console_bridge 是 header-only 库的轻量封装，生成共享库 libconsole_bridge.so"