knowledge_gained:
  - "libb64 (cdecode/cencode) is a two-file, dependency-free public-domain base64 library (only libc), built by a bare Makefile rule `libb64.a: cencode.o cdecode.o` in src/ with CC/AR and no configure step."
  - "On OHOS the raw-make build needs the clang CC plus llvm-ar (AR key in tools.build:compiler_executables) and in-build TMPDIR/TMP/TEMP (workers lack /tmp and have no build uid in /etc/passwd)."
  - "As a static library package, the consumer must link -lb64 directly; OHOS run of the probe ELF requires binary-sign-tool + .codesign (llvm-readelf check) like the mbw/lerc consumers."
