# 版本级 manifest — cdebootstrap 0.7.9
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "0.7.9"

# 软件名
software: cdebootstrap

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/c/cdebootstrap/cdebootstrap_0.7.9.tar.xz"

  # 源码校验和
  sha256: "40a58b4684ba89ea41347d0c81f424bf06734870d0ac4ff683fa77246ad14346"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--enable-static"
    - "--with-dpkg-arch=arm64"
    - "--with-frontend=standalone"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libdebian-installer/0.121
    - bzip2/1.0.8
    - liblzma/5.8.1
    - zlib/1.3.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-ohos-canonicalize-file-name-shim.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - category: L1
    content: "Debian native 包未预生成 configure——autoreconf -i 生成；configure.ac 无 AC_PROG_LIBTOOL（纯 .o 静态构建）——build_requirements 只需 automake，不需要 libtool（比 libdi 少一个 tool_requirement）"
    reason: "cdebootstrap configure.ac 全文核对 + 本地 autoreconf 实测"
  - category: L1
    content: "OHOS musl 无 glibc 扩展函数 canonicalize_file_name——frontend/standalone/main.c 调用（int→const char* 转换编译错误实测）——patch 加 static shim 用 realpath() 等价实现（PATH_MAX 定长缓冲，返回 static buffer 指针语义一致）"
    reason: "make 编译 main.o 实测错误 + shim 后 RC=0"
  - category: L1
    content: "--enable-static 一举两得：LDFLAGS 加 -static 出静态 ELF + configure.ac L42 仅在 enable_static=no 时 PKG_CHECK_MODULES(libcurl)——standalone frontend 免 libcurl 依赖"
    reason: "configure.ac L41-47 逻辑核对 + 链接行无 libcurl 实测"
  - category: L1
    content: "config.status mktemp 沙箱限制同 libdi/dpkg：configure 执行前替换 mktemp 模板 + TMPDIR 指可写目录（/data/storage/el2/base/cache）"
    reason: "同 SKILL autotools-config-status-mktemp-sandbox"
  - category: L1
    content: "autotools 配方 generate() 必须 AutotoolsToolchain + AutotoolsDeps 双生成——只生成 Toolchain 时依赖 -I/-L 不注入，'debian-installer.h' file not found（conan create 实测；scratch 手动 -I/-L 会掩盖）"
    reason: "conan create 首跑 make 段报错实测"
  - category: L1
    content: "Autotools helper + basic_layout 是 out-of-source（build-release）：编译产物在 build_folder/src/，源数据文件（config/suites、config/generic/）留在 source_folder/config/——package() 两处分别取"
    reason: "conan create package() FileNotFoundError 实测后核实"

# ============================================================
# 测试信息
# ============================================================

upstream_tests:
  unit: 0
  integration: 5
  other: 0
  note: >-
    单元测试 0（源码树无 test/ 目录、所有 Makefile.am 无 check 目标、
    无 test_*.c——实测核对 tarball 全树）。集成测试 5 个为
    debian/tests/ 的 Debian 自动化测试（bookworm-standard/sid-build/
    sid-minimal/sid-standard/trixie-standard），control 声明
    Restrictions: needs-root，每个 `exec cdebootstrap <suite>
    $ADTTMP/root --debug --flavour <X>` 实际 bootstrap 完整 Debian
    rootfs（libcurl 下载 debs + chroot 内 dpkg 安装）。OHOS 真机
    实际执行结果（test_package 逐条真跑，非猜测）：
      - 5/5 在 root 权限门真实阻塞：`E: Need root privileges` rc=1。
        源码 check_permission()（frontend/standalone/main.c L194-198）：
        `if (!noexec && getuid())`——bootstrap 安装层硬要求 root。
        环境实测：euid=20020084（非 root）、`sudo -n` 需密码且
        open /dev/tty 失败、/etc/passwd root 账户 shell=/bin/false
        （锁定）——root 权限无法获取，工具级手段无法绕过。
      - install 层第二道系统级阻塞实测：chroot(2) 系统调用
        （aarch64 __NR_chroot=51，asm-generic 表，OHOS sysroot
        aarch64-linux-ohos/bits/syscall.h 核对）在 OHOS 直接触发
        SIGSYS（signal 31，进程退出码 159）——chroot 被禁用，
        --fakechroot 需 root 亦不可行（execute.c di_exec_prepare_chroot
        安装路径强制 chroot 进 target rootfs）。
      - 下载层真跑通过（--download-only 设 noexec=true 绕过 root
        检查）：conandata 源码 URL 用 mirrors.aliyun.com（国内源，
        CI 可达，#59987 构建成功已证明）；test C 镜像同走 aliyun
        （CLI 第 3 位置参数 https://mirrors.aliyun.com/debian），
        本地实测 79 个 .deb 全落盘；包内 config/suites 默认
        deb.debian.org 跨海、CI 180s 拉不完。bookworm 依赖解析 +
        libcurl/镜像解析/Release+Packages.xz 索引/依赖求解全链路
        验证（test_package C 段）。
    结论：5 个集成测试的 bootstrap 安装层为双重系统级阻塞
    （非 root + chroot 被 OHOS 禁），OHOS 无解；可执行部分（下载层）
    已真跑验证。
  upstream_pass_rate: "0/5 集成测试 bootstrap 完成（系统级阻塞：非 root + chroot 被 OHOS 禁）；下载层（5 测试共同前置）真跑 79 deb 通过"

test_package:
  unit: 0
  integration: 4
  note: >-
    OHOS 真机消费测试（conan create 通过，EXIT=0）：
    A. 冒烟 3 项（--version 0.7.9/无参 rc=1/ELF 静态）
    B. 5 个上游集成测试实际执行——5/5 在 root 权限门真实阻塞
       （E: Need root privileges rc=1，验证二进制到权限门全路径）
    C. 下载层真跑——bookworm 79 .deb 落盘（无网络 SKIP）；镜像经 CLI
       第 3 位置参数显式传 https://mirrors.aliyun.com/debian
       （包内 config/suites 默认 deb.debian.org 跨海，CI 180s 拉不完，
       #58151/#59674/#59987 三次同因），300s
    D. chroot(2) 探测——SIGSYS signal 31（OHOS 禁 chroot）
