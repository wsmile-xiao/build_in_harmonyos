# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cdebootstrap/0.7.9
homepage: "https://salsa.debian.org/installer-team/cdebootstrap"

# 上游无测试套件（源码树无 test/ 目录，无 make check 目标——实测核实）
upstream_test_in_build: false
upstream_tests: []

test_package_tests:
  - file: test_cdebootstrap.py
    description: "R34：运行打包静态二进制——--version 退出码 0 + 版本串 0.7.9；无参调用退出码 1（用法错误）；ELF 头静态二进制确认"
    command: "python3 test_cdebootstrap.py <package>"

assertion_count: 4
