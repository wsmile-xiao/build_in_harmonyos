# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: clex/4.6.patch8
homepage: "http://www.clex.sk"

# 上游自动化测试命令：Makefile.am 未注册 TESTS，automake 的 check-recursive
# 空跑；源码另有一个独立的交互式 kbd-test 工具，需真实 TTY 和双 Ctrl-C。
upstream_check_command: "make check（无 TESTS 注册，空跑，实测 0 项；kbd-test 静态存在但需 TTY）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游静态测试/测试工具：1 项；未纳入 make check，因需真实 TTY 在无头 CI 中跳过。
upstream_tests:
  - name: kbd-test
    command: "src/kbd-test"
    expected: "交互式键盘排障工具；需要真实终端并双 Ctrl-C 退出，无头 CI 跳过"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：(1) cfg-clex 迁移正路径——受控 HOME/XDG_CONFIG_HOME 下预置 ~/.clex/config，运行后断言迁移至 $XDG_CONFIG_HOME/clex/config 且 rc=0；(2) clex 以 TERM=dumb、stdin=/dev/null 真实启动，断言 ncurses 经包依赖加载成功、主循环按 EOF 正常退出（rc=0，探索构建同条件实测）；kbd-test 需真实 TTY，不在此处伪造执行"
    command: "./test_clex"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 5
