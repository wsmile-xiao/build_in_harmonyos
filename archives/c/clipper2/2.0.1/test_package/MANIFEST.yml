# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: clipper2/2.0.1
homepage: "https://github.com/AngusJohnson/Clipper2"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试依赖 googletest (通过 git clone 获取), OHOS 平台无网络 git clone 不可用
# 且上游测试为 CMake/CTest 框架, 需 CLIPPER2_TESTS=ON 构建
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# Clipper2 上游测试位于 CPP/tests/ 目录, 使用 googletest 框架
upstream_tests:
  - file: clipper2.tests.cpp
    source: Clipper2_2.0.1/CPP/tests/clipper2.tests.cpp
    description: "核心功能测试 (googletest): 裁剪、偏移、简化、三角化等"
    command: "ctest"
  - file: Clipper2.tests.vcard.cpp
    source: Clipper2_2.0.1/CPP/tests/Clipper2.tests.vcard.cpp
    description: "VCard 解析测试 (验证复杂路径处理)"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_clipper2.cpp
    description: "多边形布尔运算测试: 面积计算、交集(2500)、并集(17500)、差集(7500)"
    command: "./test_clipper2"

# 测试断言总数 (近似值, 用于质量评估)
# 4 个断言: area=10000 + intersection=2500 + union=17500 + difference=7500
assertion_count: 4
