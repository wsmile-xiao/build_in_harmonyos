software: clipper2
display: "Clipper2"
description: "Polygon Clipping and Offsetting Library — 高性能多边形布尔运算和偏移库"
category: data
homepage: "https://www.angusj.com/clipper2/Docs/Overview.htm"
license: BSL-1.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "cmake 报 System unknown (HarmonyOS) 警告但不影响编译，自动 fallback"
    - "内置测试依赖 googletest（git clone），建议 CLIPPER2_TESTS=OFF 禁用"
    - "纯静态库项目，无可执行文件，安全弹窗验证不适用"
    - "默认含 -Werror，在 OHOS 上零警告通过"
    - "源码为 zip 格式，嵌套目录需提升（CPP → 根目录）"
  common_dependencies: []

versions:
  "2.0.1":
    status: built
    build_date: "2026-06-15"
