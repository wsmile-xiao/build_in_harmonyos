software: clipper
version: 2.0.1
status: published
source_url: https://github.com/AngusJohnson/Clipper2/tree/Clipper2_2.0.1
build_system: cmake
configure_options:
  - CMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX
  - CLIPPER2_EXAMPLES=OFF
  - CLIPPER2_TESTS=OFF
  - CLIPPER2_UTILS=OFF
  - BUILD_SHARED_LIBS=ON
dependencies: []
build_date: "2026-06-15"
compiler: clang 15.0.4
cxx_standard: 17
artifacts:
  libraries:
    - libClipper2.so
    - libClipper2Z.so
  headers:
    - include/clipper2/*.h
  pkgconfig:
    - lib/pkgconfig/Clipper2.pc
    - lib/pkgconfig/Clipper2Z.pc
  cmake:
    - lib/cmake/clipper2/*.cmake
