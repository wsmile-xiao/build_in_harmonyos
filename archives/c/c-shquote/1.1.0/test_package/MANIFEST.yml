# test_package/MANIFEST.yml — c-shquote 1.1.0 上游测试声明
# 上游测试命令：meson test（默认配置，共 3 项，无跳过条件）
# 另有第 4 项 test-reference（需 glib-2.0>=2.50，上游默认关闭的可选项
# -Dreference-test），本配方与设备实测均不启用。

package: c-shquote/1.1.0
homepage: "https://github.com/c-util/c-shquote"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test-api.c
    source: c-shquote-1.1.0/src/test-api.c
    description: "API Symbol Visibility——导出符号与 libcshquote.sym 一致性"
    command: "./build/src/test-api"
  - file: src/test-basic.c
    source: c-shquote-1.1.0/src/test-basic.c
    description: "Basic API Behavior——quote/unquote/parse 基础行为"
    command: "./build/src/test-basic"
  - file: src/test-private.c
    source: c-shquote-1.1.0/src/test-private.c
    description: "Private Helper Functions——内部辅助函数行为"
    command: "./build/src/test-private"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：quote('a' 包裹)与 unquote('a b' 还原) 真实 API 行为断言"
    command: "ctest --test-dir . --output-on-failure"

# 测试断言总数 (近似值, 用于质量评估；静态统计 assert( 出现次数)
# test-api.c: 8 + test-basic.c: 45 + test-private.c: 117
assertion_count: 170
