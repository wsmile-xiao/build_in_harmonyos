software: cron-apt
# 版本级 manifest — archives/c/cron-apt/0.13.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.13.0.1"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: none

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # cron-apt 是 Debian 原生包，无独立上游仓库；源码取自 Debian pool
  url: "https://deb.debian.org/debian/pool/main/c/cron-apt/cron-apt_0.13.0.1.tar.xz"
  sha256: "0361b18cd1d4ca5b7a37234375600e9ee7a12e89c9159133371f931cd301557f"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

# 纯 shell 脚本包，无编译器
cc: ""
cxx: ""

build:
  system: none
  dependencies: []
  # 运行时（非构建期）依赖：apt（OHOS 暂不可得，见 test_note）
  runtime_dependencies:
    - "apt（cron-apt 的实际更新功能依赖 apt-get；OHOS 上暂无适配）"

patches_applied: []

# ============================================================
# 测试信息
# ============================================================

test_status: passed

test_note: "上游测试：test/test.sh（3 个断言，纯 shell，测 herevariables_store/restore 辅助函数，**不依赖 apt**）——已实测 **3/3 PASSED**（PRECHECK / HERE_STORE / HERE_RESTORE 全 PASSED，rc=0）。另有 test_package 消费者探针：真实执行 bin/cron-apt --help（实测 rc=0，输出 'USAGE: cron-apt [-i] [-s] [configfiles]'）。说明：cron-apt 的实际功能（自动 apt 更新）需 apt/apt-get（代码中 40 处引用），OHOS 上暂无 apt 适配——不影响出包、脚本语法校验与 --help 运行，但包在 OHOS 上无法真正驱动包更新，此限制如实声明。"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "cron-apt 是纯 POSIX shell 脚本包（#!/bin/sh），无编译；上游 Makefile 仅用 install -m644/755 落盘 —— OHOS 无 coreutils install（仅 busybox 有 install applet），故配方不调用 make install，改用 conan 的文件工具按 FHS 布局直接复制"
  - "上游硬编码 SHAREDIR=\"/usr/share/cron-apt\" 并 . $SHAREDIR/functions：conan 包无法写系统路径，需 patch 为脚本自定位（dirname $0 的上一级 + share/cron-apt），并支持 CRON_APT_SHAREDIR 环境变量覆盖 —— 纯脚本包普遍存在此类 FHS 硬编码，DESTDIR 只能改安装前缀、改不了脚本内写死的绝对路径"
  - "cron-apt 的上游测试（test/test.sh）只测 shell 辅助函数（herevariables_store/restore），不依赖 apt —— 对依赖不可得的功能型包，仍可能存在可真实运行的上游测试子集，值得实际尝试（对比 bootcd 无上游测试、bork 源码声明 366 断言）"
  - "cron-apt 的运行时依赖 apt 在 OHOS 上无适配（apt 本体依赖 libapt-pkg/gnutls/gpgme 等，适配量远超本包）；此类『能装但功能不可用』的情形需在 manifest 如实声明，不可暗示功能可用"
