# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: cron-apt/0.13.0.1
homepage: "https://tracker.debian.org/pkg/cron-apt"

# 上游测试：test/test.sh —— 3 个断言，纯 shell，测 herevariables_store /
# herevariables_restore 辅助函数（**不依赖 apt**）
# 已实测（2026-09-11）：PRECHECK / HERE_STORE / HERE_RESTORE 全部 PASSED，rc=0
upstream_check_command: "cd test && sh ./test.sh"

# conanfile.py build() 中未运行上游测试（无编译步骤；测试为独立 shell 脚本）
upstream_test_in_build: false
upstream_test_command: "sh test/test.sh"

# 上游测试来源（3 个断言，逐个列出）
upstream_tests:
  - name: PRECHECK
    result: "PASSED — 变量初值断言（test a b / gnarg e）"
  - name: HERE_STORE
    result: "PASSED — herevariables_store HERE STORED"
  - name: HERE_RESTORE
    result: "PASSED — herevariables_restore STORED"

# test_package 中新增的测试（消费者真实执行）
test_package_tests:
  - file: test_cron_apt.sh
    description: "断言 bin/cron-apt 存在+可执行+sh -n 语法、share/cron-apt/functions 已打包，并**真实执行** cron-apt --help 断言输出 USAGE（该路径不触碰 apt）"
    command: "sh test_cron_apt.sh <pkg_dir>"

# 断言总数：上游 3 + test_package 1 = 4
assertion_count: 4
