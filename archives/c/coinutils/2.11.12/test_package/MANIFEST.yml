package: coinutils/2.11.12
homepage: "https://github.com/coin-or/CoinUtils"

upstream_check_command: "make -C CoinUtils/test unitTest && sign CoinUtils/test/unitTest && make -C CoinUtils/test test"
upstream_test_in_build: true
upstream_test_command: "make -C CoinUtils/test test"

upstream_tests:
  - file: CoinUtils/test/unitTest.cpp
    source: coinutils-2.11.12/CoinUtils/test/unitTest.cpp
    description: "上游聚合单元测试，覆盖 CoinError、CoinShallowPackedVector、CoinPackedVector、CoinIndexedVector、CoinPackedMatrix、CoinDenseVector、CoinMessageHandler 等检查；MPS/LP/Model 数据测试仅在显式提供 Sample/Netlib 数据目录时启用。"
    command: "make -C CoinUtils/test test"
    status: "passed"
    test_sources:
      - CoinUtils/test/CoinLpIOTest.cpp
      - CoinUtils/test/CoinDenseVectorTest.cpp
      - CoinUtils/test/CoinErrorTest.cpp
      - CoinUtils/test/CoinIndexedVectorTest.cpp
      - CoinUtils/test/CoinMessageHandlerTest.cpp
      - CoinUtils/test/CoinModelTest.cpp
      - CoinUtils/test/CoinMpsIOTest.cpp
      - CoinUtils/test/CoinPackedMatrixTest.cpp
      - CoinUtils/test/CoinPackedVectorTest.cpp
      - CoinUtils/test/CoinShallowPackedVectorTest.cpp

test_package_tests:
  - file: coinutils_smoke.cpp
    description: "消费者测试构造 CoinPackedMatrix 并校验默认矩阵元素数。"
    command: "./coinutils_smoke"
    assertions: 1

upstream_test_count: 1
consumer_test_count: 1
consumer_assertion_count: 1
assertion_count: 1700
