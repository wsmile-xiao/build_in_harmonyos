sources:
  url:
    - "https://codeload.github.com/coin-or/CoinUtils/tar.gz/refs/tags/releases/2.11.12"
  filename: "coinutils-2.11.12.tar.gz"
  sha256: "eef1785d78639b228ae2de26b334129fe6a7d399c4ac6f8fc5bb9054ba00de64"

patches:
  - patch_file: "patches/0001-no-check-pkgconfig.patch"
    patch_description: "Disable the install-time pkg-config --libs check for cross builds."
    patch_type: "portability"
  - patch_file: "patches/0002-coinutils-config-guess.patch"
    patch_description: "Teach CoinUtils/config.guess to recognize HarmonyOS as Linux with musl."
    patch_type: "portability"
  - patch_file: "patches/0003-root-config-guess.patch"
    patch_description: "Teach the root config.guess to recognize HarmonyOS as Linux with musl."
    patch_type: "portability"
