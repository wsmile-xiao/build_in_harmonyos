software: coinutils
version: "2.11.12"
upstream_version: "2.11.12"
status: built
build_system: autotools
adaptation_path: "Path A base adaptation + Path B knowledge-draft candidate"

source:
  url: "https://codeload.github.com/coin-or/CoinUtils/tar.gz/refs/tags/releases/2.11.12"
  sha256: "eef1785d78639b228ae2de26b334129fe6a7d399c4ac6f8fc5bb9054ba00de64"

build:
  system: autotools
  components:
    - CoinUtils
  dependencies:
    - bzip2/1.0.8
    - zlib/[>=1.2.11 <2]
  disabled:
    - blas
    - lapack
    - glpk
    - asl

patches_applied:
  - file: "patches/0001-no-check-pkgconfig.patch"
    description: "Disable the install-time pkg-config --libs check for cross builds."
  - file: "patches/0002-coinutils-config-guess.patch"
    description: "Teach CoinUtils/config.guess to recognize HarmonyOS as Linux with musl."
  - file: "patches/0003-root-config-guess.patch"
    description: "Teach the root config.guess to recognize HarmonyOS as Linux with musl."

validation:
  upstream_tests:
    total: 1
    passed: 1
    status: passed
    command: "make -C CoinUtils/test unitTest && sign CoinUtils/test/unitTest && make -C CoinUtils/test test"
    reason: "The OHOS-native build path builds and signs the upstream unitTest executable before running it. The command runs the upstream non-data-gated checks; MPS/LP/Model data branches remain disabled because this package does not vendor Sample/Netlib datasets."
  test_package:
    total: 1
    passed: 1
    status: passed
    command: "CI_PACKAGES=archives/c/coinutils/2.11.12 zsh -f ci/conan/build_and_test.sh archives/c/coinutils/2.11.12"
  local_static:
    status: passed
    checks:
      - "python -m py_compile archives/c/coinutils/2.11.12/conanfile.py archives/c/coinutils/2.11.12/test_package/conanfile.py"
      - "git diff --check -- archives/c/coinutils/2.11.12"
  ohos:
    status: passed
    reason: "Shadow CI passed on OpenHarmony PC at 10.62.134.118:2222; run root /storage/Users/currentUser/ohpc-ci-shadow/runs/manual-coinutils-2.11.12-min-20260908T025816Z-22719."

knowledge_used:
  - "PR #3519 accepted draft metadata until CI evidence is available."
  - "CoinUtils is the base dependency for coin-osi, coin-clp, and coin-cbc."
  - "GitHub codeload is an official GitHub source endpoint and avoids the CI gh-proxy timeout while preserving the verified upstream tarball SHA256."
  - "BLAS/LAPACK/Glpk/ASL are optional and disabled by configure arguments."
  - "zlib and bzip2 are present as existing built archive dependencies."
  - "Versioned patches update both config.guess copies without an external build requirement."

knowledge_drafts:
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-autotools-dual-config-guess.kv"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-autotools-dual-config-guess.md"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-install-pkgconfig-cross-probe.kv"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-install-pkgconfig-cross-probe.md"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-generated-configure-umask-install-sh.kv"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-generated-configure-umask-install-sh.md"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-optional-solver-backend-boundary.kv"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-optional-solver-backend-boundary.md"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-ohos-tool-requirements-leak.kv"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-ohos-tool-requirements-leak.md"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-consumer-smoke-negative-test.kv"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-consumer-smoke-negative-test.md"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-upstream-noinst-test-signing.kv"
  - "archives/c/coinutils/2.11.12/knowledge/drafts/DRAFT-coinutils-upstream-noinst-test-signing.md"

knowledge_gained:
  - "CoinUtils 2.11.12 has both root and nested COIN-OR config.guess copies; HarmonyOS/HongMeng support must be applied and checked in both places."
  - "COIN-OR install-data-hook can run pkg-config --libs against an incomplete DESTDIR tree; Conan package_info should be the stable consumer contract."
  - "Generated autotools configure files can need OHOS-scoped umask and install-sh fixes without introducing autoreconf or automake tool dependencies."
  - "CoinUtils optional BLAS/LAPACK/GLPK/ASL probes should stay disabled until those backends are separately adapted and declared."
  - "Copied Windows/MSVC tool_requires can make OHOS L0 fail before the target package is evaluated; remove unused tool requirements from the target path."
  - "For library-only numeric packages, a real CMakeDeps API consumer plus CI negative-link test is stronger than file-existence or version-only checks."
  - "Autotools noinst upstream tests need explicit target-side ELF signing before a native HarmonyOS run; host-only skips are not runtime passes."

knowledge_assessment: "Path B candidate: seven package-local draft pairs capture reusable HarmonyOS/COIN-OR autotools, upstream-test, and consumer-test patterns; the recipe now executes the signed upstream unitTest path plus the consumer test on an OHOS-native build. Final B-class classification still requires reviewer approval."
