package: cunit/2.1-2
homepage: "https://cunit.sourceforge.net/"

# The official release declares no TESTS/check_PROGRAMS; make -n check has no cases.
upstream_check_command: "make -n check (no TESTS/check_PROGRAMS declarations)"
upstream_test_in_build: false
upstream_test_command: "none: no runnable upstream suite is registered in the source release"
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "Three consumer checks for CUnit arithmetic/string assertions and Basic runner execution"
    command: "./test_cunit"

# Three CU_ASSERT_* assertions in test_package/test.c.
assertion_count: 3
