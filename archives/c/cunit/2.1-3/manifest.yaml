software: cunit
version: 2.1-3
status: success
build_system: manual  # 使用手动编译（autotools configure 失败）
created_at: 2026-04-27
build_date: 2026-04-27
install_prefix: ~/usr/local

# 编译方式：手动编译（绕过 autotools configure 的临时文件权限问题）
# 原因：config.status 在创建临时文件时遇到 Permission denied
# 解决方案：手动生成 CUnit.h + 手动编译源文件 + 创建静态库

knowledge_gained:
  - E072: config.sub/config.guess 需要更新以支持 HarmonyOS
  - E064: 鸿蒙系统上的 autotools 临时文件创建问题

patches_applied:
  - config.guess: 更新为支持 HarmonyOS 的版本 (2022-01-09)
  - config.sub: 更新为支持 HarmonyOS 的版本
  - CUnit.h.in: 手动替换 @VERSION@ 和 @RELEASE@

configure_options: []  # 未使用 configure

build_log: logs/build.log
source_url: http://downloads.sourceforge.net/project/cunit/CUnit/2.1-3/CUnit-2.1-3.tar.bz2

# 产物
artifacts:
  - libcunit.a (111KB static library)
  - CUnit.h + 12 header files in ~/usr/local/include/CUnit/

# 打包产物
packages:
  - cunit-2.1-3-ohos-aarch64.tar.gz
  - cunit-2.1-3-ohos-aarch64-debug.tar.gz
