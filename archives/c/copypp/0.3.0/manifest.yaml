# 版本级 manifest — copypp 0.3.0
# 文件位置: archives/c/copypp/0.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 是 CI 唯一构建输入，本文件为交叉校验元数据）

# ============================================================
# 必须字段
# ============================================================

version: "0.3.0"
software: "copypp"

# 编译状态: published | built | failed | archived
# 本任务为 built（conan-verify 通过但未向制品仓 upload——见 AGENTS §1 O5）
status: built

build_date: "2026-09-26"
build_system: cmake

# ============================================================
# 源码信息（与 conandata.yml 同源）
# ============================================================

source:
  # 上游 tag v0.3.0 归档 URL（精确 refs/tags/v0.3.0；相邻 v0.3.0-pre 指向同一提交）
  url: "https://github.com/i-curve/copypp/archive/v0.3.0.tar.gz"
  sha256: "390dc010597f372015a708d7d37e3d06fdf6a4fe90fb1c0077b45b6da5cb38a2"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项（conanfile.py generate() 注入的 CMake 缓存变量）
  configure_options:
    - "-DCMAKE_CXX_STANDARD=20"
    - "-DCOPYPP_TEST=ON"
    - "-DGTest_DIR=<gtest 包>/lib/cmake/GTest"
    - "-Dfmt_DIR=<fmt 包>/lib/cmake/fmt"
    - "-DCMAKE_PROJECT_INCLUDE=<生成目录>/copypp-upstream-includes.cmake"

  # 交付依赖（requirements）：0 —— header-only 纯标准库
  dependencies: []

  # 构建期测试依赖（build_requirements 的 test_requires，不传播给消费者）
  test_dependencies:
    - "gtest/1.17.0"
    - "fmt/11.1.3"
    - "nlohmann_json/3.12.0"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 零补丁：上游源码与测试用例一字未改（构建接线经 CMake 的 CMAKE_PROJECT_INCLUDE
# 注入点在配方侧完成，不落上游文件）
patches_applied: []

# ============================================================
# 测试统计
# ============================================================

test_results:
  type: upstream_and_consumer
  upstream_command: "conanfile.py build() 内 cmake.build() 后逐一执行 test/ 下 7 个 gtest 二进制"
  upstream_framework: gtest
  upstream_source_macro_total: 33   # 源码宏口径: grep -E '^\s*TEST(_F|_P)?\s*\(' test/*.cpp
  upstream_registered_total: 33     # 框架注册口径: gtest 运行期 [==========] N tests ... ran. 汇总
  upstream_tests: 33                 # N = max(33, 33)，差额 0
  upstream_executed: 33
  upstream_passed: 33
  upstream_failed: 0
  upstream_skipped: 0
  upstream_not_run: 0
  consumer_tests: 17                 # test_package 显式检查（不进上游分母）
  consumer_passed: 17
  consumer_failed: 0
  total: 50                           # 上游 33 + 鸿蒙特有 17
  passed: 50
  failed: 0
  skipped: 0
  status: passed
  note: "上游 7 个测试程序 33/33 全过（含 -UNDEBUG 后生效的 assert 检查点）；消费者 17/17 全过"

