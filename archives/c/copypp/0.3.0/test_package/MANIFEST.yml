# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: copypp/0.3.0
homepage: "https://github.com/i-curve/copypp"

# 上游测试入口盘点命令
# （上游根 CMake 的 test/ 子树由 if(COPYPP_TEST) 开关控制；上游 GitHub Actions
#  用 -DCOPYPP_TEST=OFF 显式关闭测试，故上游 CI 实际 0 个运行入口，
#  本适配按 R51 三步法自行清点并真实执行该测试树）
upstream_check_command: "grep -rhoE '^[[:space:]]*TEST[[:space:]]*\\(' test/*.cpp | wc -l  # 源码宏清点；grep -c add_test test/CMakeLists.txt  # CTest 注册清点"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake --build . 后逐一执行 test/ 下 7 个 gtest 二进制，解析 [==========] N tests ... ran. / [  PASSED  ] N tests. 汇总行计数，任一非零或解析失败即构建失败"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/copypp_test.cpp
    source: copypp-0.3.0/test/copypp_test.cpp
    description: "GoogleTest 用例（struct 字段拷贝），全部通过"
    command: "./test/copypp_test"
  - file: test/copypp_test2.cpp
    source: copypp-0.3.0/test/copypp_test2.cpp
    description: "GoogleTest 用例（侵入式/数组/字符串路径），全部通过"
    command: "./test/copypp_test2"
  - file: test/copypp_only_test.cpp
    source: copypp-0.3.0/test/copypp_only_test.cpp
    description: "GoogleTest 用例（copypp_only.hh 单头路径），全部通过"
    command: "./test/copypp_only_test"
  - file: test/copypp_test3.cpp
    source: copypp-0.3.0/test/copypp_test3.cpp
    description: "GoogleTest 用例（结构体字段拷贝回归），全部通过"
    command: "./test/copypp_test3"
  - file: test/copypp_test4.cpp
    source: copypp-0.3.0/test/copypp_test4.cpp
    description: "GoogleTest 用例（JSON 字段路径），全部通过"
    command: "./test/copypp_test4"
  - file: test/copypp_array_test.cpp
    source: copypp-0.3.0/test/copypp_array_test.cpp
    description: "GoogleTest 用例（数组/std::span 路径），全部通过"
    command: "./test/copypp_array_test"
  - file: test/copypp_stl_test.cpp
    source: copypp-0.3.0/test/copypp_stl_test.cpp
    description: "GoogleTest 用例（STL 容器路径），全部通过"
    command: "./test/copypp_stl_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者断言链：include <icurve/copypp.hh> 后对**已安装包头**真实执行 17 个显式检查（版本宏 1 + 非侵入式 3 字段 + 侵入式私有 3 字段 + C 数组 4 + std::vector 4 + 通用字符串 1 + 数组截断 min(L1,L2) 1），显式计数、任一失败进程非零退出（不依赖 assert/NDEBUG）"
    command: "./test_copypp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17
