package: ccbuild/2.0.11
homepage: "https://github.com/bneijt/ccbuild"

# ccbuild 2.0.11 上游测试：test/ 目录 14 个文件（含 threading/ 子目录）：
# 9 个 C++ 测试程序 + empty.hh（空头文件）+ pkg-config-options.sh（调试脚本）
# + README/.gitignore/ccResolutions（3 个元文件）。
# test_package/upstream/ = 上游 test/ 原样复制（逐字节一致，未修改）。
# 其中 8 个可独立编译：argvtest/attempt1/container_const/include/
# openmp_exceptions/parsetest/threading/thread/zeroblock_mem——消费测试中
# compile+run 实跑（真实执行——L0d 非 stub）。
# arguments.cc 依赖 ccbuild src/arguments 头文件，仅源码环境可编译
# （源码环境实测 rc=134 SIGABRT：{0,0,0} 哨兵在现代 libstdc++ 构造 null
# string 抛 exception——上游测试自身缺陷，如实记录）。
# argvtest 实跑 rc=139（SIGSEGV）为上游测试预期行为：该测试故意无条件
# 遍历 argv[0..99]，读到 argv[argc]=NULL 终止符后 cout<<NULL 触发 UB
# 段错误——崩溃点恰为 NULL 终止符，验证「argv 以 \0 终止」的目的达成。
# 消费测试：test_ccbuild.py——bin/ccbuild 可执行 + --version 真实运行
# + 8 个上游测试程序 compile+run 全量实跑。
upstream_tests: 9
upstream_test_command: "test/ 9 个 C++ 测试程序——8 个独立 compile+run 实跑 + 1 个（arguments.cc）源码环境实跑"

test_package_tests:
  - file: test_ccbuild.py
    description: "消费测试：bin/ccbuild 可执行 + --version 真实运行 + 上游 8 个可独立编译测试程序 compile+run 全量实跑"
    command: "python3 test_ccbuild.py <package_folder>"

assertion_count: 10
