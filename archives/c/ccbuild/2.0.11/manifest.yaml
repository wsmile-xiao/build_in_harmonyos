software: ccbuild
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.0.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游最新 release 2.0.11——清单 1.0.0 与上游不一致，按用户指示用真实版本）
version: "2.0.11"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"

# 构建系统标识（verify-build 要求）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（bneijt/ccbuild release 2.0.11 codeload）
  url: "https://codeload.github.com/bneijt/ccbuild/tar.gz/refs/tags/2.0.11"

  # 源码校验和
  sha256: "213b62f61b9aadaed0b28fc918ae9e304afe1d4387f97cb5a603bbdd22a2c8f5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 构建系统标识（verify-build 要求）
  build_system: cmake

  # 配置选项列表（无特殊选项）
  configure_options: []

  # 编译依赖列表（格式: name/version）——boost（header-only）+ openssl
  # （MD5 计算替代制品仓缺失的 gnutls）；FLEX 系统可用（非 Conan 依赖）
  dependencies:
    - "boost/1.90.0"
    - "openssl/3.5.6"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "ccbuild（C++ 源码扫描构建工具）CMake 构建，工具依赖 FLEX（find_package(FLEX) + FLEX_TARGET 生成解析器）——系统 flex 2.6.4 可用"
    - "ccbuild 还依赖 gnutls（MD5 计算 contentHash）——OHOS 制品仓无 gnutls，改用 openssl EVP API（EVP_DigestInit_ex/Update/Final_ex + EVP_md5）等价替代；boost（circular_buffer/lexical_cast/numeric）制品仓 1.90.0 直接命中"
    - "上游 test/（arguments.cc/argvtest.cc/attempt1.cc 等）compile+run 实跑验证"
