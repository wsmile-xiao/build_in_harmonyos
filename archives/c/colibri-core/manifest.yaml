software: colibri-core
display: "Colibri Core"
description: "用于压缩模式表示和文本语料建模的 C++ 库及命令行工具集"
category: data
homepage: "https://proycon.github.io/colibri-core/"
license: GPL-3.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "移除 Clang 下自递归的冗余 PatternPointer 转换运算符"
    - "将 getopt 返回值保存为 int，兼容 aarch64 默认 unsigned char"
    - "上游测试使用 TMPDIR，避免依赖 HarmonyOS 只读 /tmp"
    - "脚本使用 /usr/bin/env bash，避免依赖不存在的 /bin/bash"
    - "autoreconf 后修正 HMFS/HMDFS 不兼容的 umask 077，并使 config.guess 识别原生 HarmonyOS"
  common_dependencies:
    - bzip2

versions:
  "2.5.9":
    status: built
    build_date: "2026-09-09"
    conan_ref: "colibri-core/2.5.9"
