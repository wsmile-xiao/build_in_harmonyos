package: colibri-core/2.5.9
homepage: "https://proycon.github.io/colibri-core/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: src/test.cpp
    source: colibri-core-2.5.9/src/test.cpp
    description: "Colibri Core complete C++ integration suite with 1007 runtime assertions"
    command: "src/tst.sh"

test_package_tests:
  - file: test_colibri_core.cpp
    description: "Consumer links libcolibricore and validates pattern construction and n-gram extraction"
    command: "./test_colibri_core"
  - file: conanfile.py
    description: "Execute the installed native colibri-classencode command"
    command: "colibri-classencode -h"
  - file: conanfile.py
    description: "Execute the installed Bash colibri-ngrams command"
    command: "colibri-ngrams -h"

assertion_count: 1013
