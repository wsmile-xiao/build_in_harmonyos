knowledge_gained:
  - "getopt/getopt_long return int; storing the result in char loops forever on aarch64 targets where char is unsigned."
  - "PatternPointer's redundant conversion operator recursively selects itself under Clang; the existing converting constructor is the safe single conversion path."
  - "The upstream suite contains 1007 checks and can run unchanged in coverage when its temporary files are rooted at TMPDIR."
  - "The ten installed helper scripts require Bash and therefore use a PATH-resolved interpreter on HarmonyOS."
  - "Generated Autotools scripts need umask 022 on HMFS/HMDFS, and config.guess must map native HarmonyOS to aarch64-unknown-linux-ohos."
  - "Native OHOS autoreconf must use the system Perl with PERL5LIB restricted to Conan Automake's pure-Perl modules; Conan Perl's Cwd.so cannot be loaded from HMFS."
  - "Native OHOS aclocal must explicitly search the Conan libtool, pkgconf, and autoconf-archive macro directories; copy Conan libtool m4/ltmain inputs before autoreconf because libtoolize/2.5.4 embeds a non-relocatable prefix."

