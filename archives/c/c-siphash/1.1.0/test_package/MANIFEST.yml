# test_package/MANIFEST.yml — c-siphash 1.1.0 上游测试声明
# 上游测试命令：meson test（默认配置，共 2 项，无跳过条件）

package: c-siphash/1.1.0
homepage: "https://github.com/c-util/c-siphash"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test-api.c
    source: c-siphash-1.1.0/src/test-api.c
    description: "API Symbol Visibility——导出符号与 libcsiphash.sym 一致性"
    command: "./build/src/test-api"
  - file: src/test-basic.c
    source: c-siphash-1.1.0/src/test-basic.c
    description: "Basic API Behavior——SipHash 论文 Appendix A 参考向量与流式分块一致性"
    command: "./build/src/test-basic"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：one-shot 与流式 API 断言 SipHash 参考向量 0xa129ca6149be45e5"
    command: "ctest --test-dir . --output-on-failure"

# 测试断言总数 (近似值, 用于质量评估；静态统计 assert( 出现次数)
# test-api.c: 2 + test-basic.c: 17
assertion_count: 19
