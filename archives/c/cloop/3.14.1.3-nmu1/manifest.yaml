version: "3.14.1.3-nmu1"
software: "cloop"
status: built
build_date: "2026-09-09"
build_system: makefile

source:
  url: "https://codeload.github.com/Code7R/cloop/tar.gz/e6104fb74bda34e184fe92fa080099b0c4c96627"
  sha256: "9df0dc8525b4e26017b7d546fcf5f8dded61c2045c3c7e65f80a2ccb592f65a8"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies:
    - "zlib/1.3.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-portability-and-build.patch"

knowledge_gained:
  - "Old config.guess requires explicit aarch64 build and host identities on HarmonyOS."
  - "HMDFS needs the generated Autoconf temporary directory to retain write/execute permissions."
  - "OHOS libc++ requires ::bind when legacy C++ code uses the POSIX socket API."
  - "Use int64_t instead of Linux-only loff_t while preserving the cloop 64-bit offset format."
  - "The recipe copies the compressor into both command names and restores executable permissions because HMDFS may reject hard-link replacement or preserve mode bits differently."

upstream_tests:
  command: "make check-local"
  test_count: 1
  passed: 0
  failed: 1
  notes: "The shipped target uses obsolete advfs syntax and fails before functional assertions; failure is retained as evidence."

consumer_tests:
  test_count: 1
  passed: 1
  description: "Compresses and extracts an 8192-byte input, checks the original prefix and zero block padding."
