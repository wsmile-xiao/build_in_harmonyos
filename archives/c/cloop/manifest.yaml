software: cloop
display: "Compressed Loopback Utilities"
description: "Utilities for creating and extracting compressed loopback filesystem images"
category: compress
homepage: "https://github.com/KlausKnopper/cloop"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "The kernel module is not built on HarmonyOS PC; the package delivers the user-space utilities."
    - "The bundled advancecomp configure script needs an explicit aarch64 build/host and HMDFS-compatible umask."
    - "OHOS libc++ requires global qualification for the socket bind call because std::bind is visible."
    - "The OHOS sysroot does not expose Linux loff_t; the extractor uses int64_t for the on-disk 64-bit offsets."
  common_dependencies:
    - zlib

versions:
  "3.14.1.3-nmu1":
    status: built
    build_date: "2026-09-09"
    conan_ref: "cloop/3.14.1.3-nmu1"
