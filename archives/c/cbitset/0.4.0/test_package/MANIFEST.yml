package: cbitset/0.4.0
homepage: "https://github.com/lemire/cbitset"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

upstream_tests:
  - file: tests/unit.c
    source: cbitset-0.4.0/tests/unit.c
    description: "Official unit test covering construction, mutation, iteration, shifts, set operations, counts, and containment."
    command: "unit"
    test_functions: 15
    assertion_failure_macros: 40

test_package_tests:
  - file: test.c
    description: "Consumer test creates and mutates a packaged bitset, checks count/access/minimum/maximum/iteration, then clears it."
    command: "./test_cbitset"

assertion_count: 40
