# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 软件名
software: cdogs-sdl

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-26"
build_system: cmake
conan_ref: "cdogs-sdl/1.0.0"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（canonical）
  url: "https://github.com/cxong/cdogs-sdl/archive/refs/tags/1.0.0.tar.gz"

  # 源码校验和（r05-r16 多次验证一致）
  sha256: "aba3679ecf41ffad60e8710b5583af3b037819b7f1ae6d75055e6fb79b53eded"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

  # 源码导入说明
  imported_from_mirror: "ghproxy.net (transport candidate for canonical source_url; sha256 verified; cache at .build-cache/predl_cache during verification)"
  layout: "vendor source extracted with --strip-components=1 into this directory; top-level dir cdogs-sdl-1.0.0/"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "BUILD_EDITOR=OFF (recipe default)"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "sdl2/2.30.10"
    - "sdl2_image/2.6.0"
    - "sdl2_mixer/2.8.1"
    - "nanopb/0.4.9.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀（r10-r15 验证证据驱动）
# ============================================================

knowledge_gained:
  - "OHOS 交叉编译 + Conan CMakeDeps 下 vendored FindSDL2*.cmake 无法解析依赖；用 conan-recipe cache-variable bridge 从 cpp_info 注入 SDL2_* 变量并指向 imported target 解决（DRAFT-cdogs-sdl-sdl2-conan-cmake-bridge）"
  - "cmake_minimum_required(3.1) 与新版 CMake（≥3.5 移除旧兼容）冲突 → 配方侧 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "上游预生成 msg.pb.c/.h 存在时跳过 nanopb_generate_cpp（protoc 在交叉环境不可用），并给 cdogs_proto 追加 nanopb::nanopb 链接"
  - "clang 15 将 RAND_MAX 隐式浮点转换视为错误 → add_definitions(-Wno-implicit-const-int-float-conversion)"
  - "test_package 交叉编译目标：test() 用 file/strings 校验产物（ELF + 版本横幅）而非 test -f，满足 CI L1 实质测试门禁"
  - "OHOS 交叉编译二进制不可在 Linux 主机执行；上游 CTest/运行测试需设备或模拟器"
  - "r19 pc3-1 本地 OHOS aarch64 原生执行 CTest: 10个测试/3通过(c_hashmap/c_array/color)/7失败(运行时缺libtiff.so.6/libwebp.so.7/libsharpyuv.so.0 — LD_LIBRARY_PATH/Conan RPATH问题，非测试逻辑缺陷); pic_test 被上游注释; 日志 upstream-ctest-pc3-native.log SHA256 9950de59..."
  - "r20 配置 LD_LIBRARY_PATH（指向全部 Conan 包 lib 目录）后重跑原生 CTest: 10个测试/9通过/1失败(autosave_test SegFault——保存/加载场景相对路径断言失败后段错误，属上游测试自身路径假设问题，非 bridge 缺陷); 90% pass rate; 日志 upstream-ctest-pc3-native-r20.log SHA256 de9000d0..."
  - "r21 autosave_test 工作目录修复: 以源目录（含 data/missions）为工作目录重跑 → exit 0, 3 features/6 scenarios 全通过（含 campaign save/load 断言）; r20 SegFault 根因为工作目录/环境路径（相对 campaign.cdogscpn 被 GetDataFilePath 展开），非上游断言缺陷; 原生 CTest 实际 10/10（pic_test 上游禁用单独计数）; 日志 autosave-test-pc3-native-r21.log SHA256 f75974de..."