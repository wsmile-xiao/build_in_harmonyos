# 软件级 manifest — cd-discid
software: cd-discid
display: "cd-discid"
description: "CDDB discid 查询命令行工具，读取 CD-ROM 的 TOC 并输出 CDDB disc id（供 abcde 等抓轨工具使用）"
category: utility
homepage: "https://github.com/taem/cd-discid"
license: GPL-2.0-or-later

# 常用构建系统
build_system: makefile

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "纯 Makefile 工程，无 configure/autotools，无 make check 目标"
    - "build() 从 Conan conf 取编译器（tools.build:compiler_executables），禁止裸用 ${CC}（R33）"
    - "上游 make install 依赖 /usr/bin/install（OHOS 缺失）且 -o 0 需 root，改为 package() 中直接 copy 产物"
    - "无 CD-ROM 设备环境下二进制以 open 错误/Usage 消息路径退出，test_package 据此做真实行为验证"
  common_dependencies: []

# 版本索引
versions:
  "1.0.0":
    status: built
    build_date: "2026-08-23"
    patches: 0
    notes: "纯单文件 C + Makefile，仅 libc + ioctl，无外部依赖"
