# 知识沉淀
knowledge_gained:
  - "纯 Makefile 工程：上游无 configure/autotools，无 make check 目标（仅 all/clean/install/tarball）"
  - "build() 必须从 Conan conf 取编译器 tools.build:compiler_executables，禁止裸用 ${CC}（R33）"
  - "上游 make install 依赖 /usr/bin/install（OHOS 缺失）且 -o 0 需 root，package() 直接 copy 产物"
  - "无 CD-ROM 设备时二进制走 open 错误/Usage 路径退出，test_package 用真实运行行为验证（R34）"
