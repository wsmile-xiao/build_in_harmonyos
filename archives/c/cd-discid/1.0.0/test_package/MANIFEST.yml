# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
package: cd-discid/1.0.0
homepage: "https://github.com/taem/cd-discid"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 如实声明：上游 Makefile 仅定义 all/clean/install/tarball 四个目标，
# 无 make check 目标、无测试套件、无测试文件（详见 Makefile）。
upstream_check_command: "make check (not available)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "验证 cd-discid 二进制真实运行行为：可执行、参数过多时输出 Usage 并非零退出、设备不存在时输出 open 错误、无参数时默认 /dev/cdrom"
    command: "bash test.sh"

assertion_count: 4
