software: cdebconf-entropy
version: "0.6"
status: built
build_date: "2026-09-13"
build_system: autotools
source:
  url: "https://deb.debian.org/debian/pool/main/c/cdebconf-entropy/cdebconf-entropy_0.60.tar.xz"
  sha256: "1ebb46487004500cc7959783a6f61b48d52dfbb6917d191ccf44677c8f5f9b68"
  tar_format: tar.xz
build:
  system: autotools
  build_system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies:
    - cdebconf/0.283
  cc: clang
  cxx: clang++
patches_applied: []
runtime_modifications: []
knowledge_gained:
    - "cdebconf-entropy（Debian Installer Team）是 cdebconf 的 entropy 插件包：text-plugin-entropy.c（常驻，读 /dev/random + 键盘补熵进度条）+ newt-plugin-entropy.c + gtk-plugin-entropy.c，autotools 构建，硬依赖 libdebconfclient/libdebian-installer（由 cdebconf/0.283 requires 提供，避免重复 vendor）"
    - "任务目录 0.6 对应上游 release 0.60（Debian pool 无 0.6 发布；0.60 为当前稳定包，源码顶层目录 cdebconf-entropy-0.60，dsc sha256 与 tarball 一致已验）"
    - "Debian 源码包不含预生成 configure（仅 configure.ac + Makefile.in），真机无可用 autotools 自举链——配方零 tool_requires，用 Python 复刻 configure.ac（text 常驻 + pkg-config 探测 newt/GTK + Makefile.in 占位符替换）生成 Makefile"
    - "上游无任何测试套件（48KB 源码包仅三个插件 .c + 构建文件，无 tests/ 目录、无 TESTS/check_PROGRAMS），MANIFEST 声明 upstream_tests_exist:false 并附审计，真机输出 no_tests/0 证据"
