# test_package 中自带的测试（消费者视角验证，R34 实质调用）
test_package_tests:
  - file: test_cdebconf_entropy.py
    description: "一致性验证（3 项真实断言，自适应非硬编码）：pkg-config 重探 libnewt/GTK 栈并打印证据 + text 插件必须存在合法且 newt/gtk 与探测结果一致（有栈则要求插件非空含符号、无栈则要求缺席） + cdebconf 硬依赖提供 libdebconfclient 与插件 API 头文件，找到的插件真实 dlopen"
    command: "python3 test_cdebconf_entropy.py <package_folder> <cdebconf_package_folder>"
  - file: conanfile.py
    description: "Conan test() 入口，执行测试脚本并输出 HMBS 机器证据标记（test_package discovered=3/passedCount=3 + 上游 no_tests/0）"
    command: "conan test test_package"

# 测试断言总数（3 项真实断言，与 HMBS_TEST_PACKAGE_RESULT discovered=3 一致）
assertion_count: 3
