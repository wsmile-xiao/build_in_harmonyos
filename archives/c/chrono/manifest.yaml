software: chrono
display: "Howard Hinnant date (chrono)"
description: "C++ date, calendar, timezone and formatting library built on chrono"
category: foundation
homepage: "https://github.com/HowardHinnant/date"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Build date-tz with MANUAL_TZ_DB=ON to avoid Linux zoneinfo layout assumptions and an implicit libcurl dependency on OHOS."
    - "Expose upstream CMake targets date::date and date::date-tz through CMakeDeps."
  common_dependencies: []

versions:
