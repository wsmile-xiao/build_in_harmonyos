# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: canl-c/3.0.0
homepage: "https://github.com/CESNET/canl-c"

# 上游测试命令：顶层 Makefile 的 check: 目标为空（无任何配方行），
# 仓库无测试目录/测试框架，上游不提供任何测试
upstream_check_command: "make -n check"

# conanfile.py build() 方法中未集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（上游事实，非跳过）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_consumer.c
    description: "编译期消费者：dlopen libcanl_c.so.4 并解析公开符号，真实链接调用公开 API（create_ctx/io_handler/get_error_message/destroy/free_ctx）"
    command: "./consumer"
  - file: conanfile.py
    description: "回环 TLS 端到端：包内 openssl 生成自签证书并建 CA 哈希锚，emi-canl-server 与 emi-canl-client 真实握手，双向消息内容精确断言"
    command: "emi-canl-server & emi-canl-client -s 127.0.0.1"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
