software: canl-c
# 版本级 manifest
# 文件位置: archives/c/canl-c/3.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"

# 构建系统类型
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（CESNET 官方发布 tag 归档；scientific.zcu.cz 官方直链已不可达）
  url: "https://github.com/CESNET/canl-c/archive/refs/tags/emi-canl-c_R_3_0_0_1/canl-c-3.0.0.tar.gz"

  # 源码校验和
  sha256: "d72fabfb94a61586e50fc94028f4aae3062c29bae2ed90ec6d83368d4cbf1108"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（EMI 自定义 Makefile；configure 为 Perl 脚本可跳过）
  configure_options:
    - "BUILD_DOC=0"
    - "LIBCARES_LIBS=-lcares"
    - "LIBSSL_LIBS=-lssl -lcrypto"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "openssl/3.0.16"
    - "c-ares/1.34.6"
    - "krb5/1.22.1"

  # 构建工具依赖
  build_dependencies:
    - "libtool/2.5.4"
    - "bison/3.8.2"
    - "perl/5.42.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-makefile-perl-variable.patch"
  - "0002-netdb-musl-compat-macros.patch"
  - "0003-makefile-optional-doc-and-dep-flags.patch"
  - "0004-ssl-nocertfound-false-positive.patch"

patch_details:
  - file: "0001-makefile-perl-variable.patch"
    type: portability
    reason: "Makefile 直接执行 gen_err*.pl 依赖 #!/usr/bin/perl；OHOS 无该路径"
  - file: "0002-netdb-musl-compat-macros.patch"
    type: portability
    reason: "musl netdb.h 无 glibc 扩展宏 NETDB_INTERNAL/NETDB_SUCCESS"
  - file: "0003-makefile-optional-doc-and-dep-flags.patch"
    type: portability
    reason: "pdflatex 不可用故 doc 目标受 BUILD_DOC 守卫；示例工具补 openssl/c-ares 头路径"
  - file: "0004-ssl-nocertfound-false-positive.patch"
    type: portability
    reason: "无 /etc/grid-security 布局的系统上 proxy_get_filenames 失败被误判为无凭证"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（每条带知识引用）
knowledge_gained: []
# 本任务未形成需晋升的跨库新知识草稿；工具链复用模式（libtool/bison/perl 经
# tool_requires 提供）见既有知识条目与 abiword-plugin-openwriter 先例。

# ============================================================
# 编译结果
# ============================================================

compiled_tools:
  - name: "emi-canl-server"
    status: "success"
    description: "TLS 回显服务器示例（接受单连接并收发消息）"
  - name: "emi-canl-client"
    status: "success"
    description: "TLS 客户端示例（连接服务器并收发消息）"
  - name: "emi-canl-proxy-init"
    status: "success"
    description: "X.509 代理证书生成工具"
  - name: "emi-canl-delegation"
    status: "success"
    description: "证书委找示例工具"

libraries:
  - name: "libcanl_c"
    soname: "libcanl_c.so.4"
    version_info: "4.0.0"
    status: "success"
