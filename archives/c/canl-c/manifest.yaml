software: canl-c
display: "canl-c"
description: "Common Authentication Library (caNl) C 绑定：TLS 连接与 X.509 代理证书管理"
category: security
homepage: "https://github.com/CESNET/canl-c"
license:
  - Apache-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "EMI 自定义 Makefile + libtool；构建期需要 perl（错误码头生成）与 bison（语法分析器），经 tool_requires 提供"
    - "Makefile 直接执行 gen_err*.pl 依赖 #!/usr/bin/perl；OHOS 无该路径，补丁引入 PERL 变量"
    - "musl netdb.h 无 glibc NETDB_INTERNAL/NETDB_SUCCESS 宏，补丁以 #ifndef 兜底"
    - "pdflatex 不可用；doc 目标与 canl.pdf 安装受 BUILD_DOC 守卫（默认关）"
    - "无 /etc/grid-security 布局时 proxy_get_filenames 失败会误报 noCertFound；补丁保持 API 凭证权威"
    - "运行期用 X509_CERT_DIR 指定 CA 目录（上游自有机制）"
  common_dependencies:
    - "openssl"
    - "c-ares"
    - "krb5"

versions:
  "3.0.0":
    status: built
    build_date: "2026-09-05"
    conan_ref: "canl-c/3.0.0"
