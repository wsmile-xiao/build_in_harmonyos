package: celt/1.0.0
homepage: "https://celt-codec.org/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/type-test.c
    source: celt-0.11.3/tests/type-test.c
    description: "Verify celt type definitions"
    command: "./type-test"

  - file: tests/ectest.c
    source: celt-0.11.3/tests/ectest.c
    description: "Entropy coding unit test"
    command: "./ectest"

  - file: tests/cwrs32-test.c
    source: celt-0.11.3/tests/cwrs32-test.c
    description: "CWRS 32-bit unit test"
    command: "./cwrs32-test"

  - file: tests/dft-test.c
    source: celt-0.11.3/tests/dft-test.c
    description: "DFT unit test"
    command: "./dft-test"

  - file: tests/laplace-test.c
    source: celt-0.11.3/tests/laplace-test.c
    description: "Laplace coding unit test"
    command: "./laplace-test"

  - file: tests/mdct-test.c
    source: celt-0.11.3/tests/mdct-test.c
    description: "MDCT unit test"
    command: "./mdct-test"

  - file: tests/mathops-test.c
    source: celt-0.11.3/tests/mathops-test.c
    description: "Math operations unit test"
    command: "./mathops-test"

  - file: tests/tandem-test.c
    source: celt-0.11.3/tests/tandem-test.c
    description: "Encoder/decoder tandem integration test"
    command: "./tandem-test"

test_package_tests:
  - file: test.c
    description: "Consumer smoke test — encoder/decoder round-trip on silence"
    command: "./test_celt"

assertion_count: 6
