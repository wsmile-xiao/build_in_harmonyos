# conandata.yml — clib 2.8.7
# 官方源: GitHub clibs/clib Release 2.8.7 tag tarball
# 用 codeload 直连形态: CI 镜像表仅改写 github.com/ 形态(gh-proxy.com 实测超时),
# codeload 不经镜像表直连下载; 字节与 github archive 形态一致(sha256 实测相同)
# sha256 与设备下载副本一致(83d5767e363c3ed4b4271000b9ce63b6e11b6c4740df910e0074f844fb34258e)

sources:
  url: "https://codeload.github.com/clibs/clib/tar.gz/refs/tags/2.8.7"
  filename: "clib-2.8.7.tar.gz"
  sha256: "83d5767e363c3ed4b4271000b9ce63b6e11b6c4740df910e0074f844fb34258e"

patches:
  - patch_file: "patches/0001-http-get-ca-store-probe.patch"
    patch_description: "vendored http-get 运行时探测 CA 证书库并设置 CURLOPT_CAINFO/CURLOPT_CAPATH; 探测顺序 CURL_CA_BUNDLE 与 SSL_CERT_FILE env、常见 Linux CA 文件、SSL_CERT_DIR env 与 /system/etc/security/certificates 证书目录; OHOS 无 /etc/ssl 默认 CA 且 libcurl 编译期默认 CAINFO 指向不存在的路径导致全部 HTTPS 报 CURLE_SSL_CACERT; 运行时探测无平台条件编译; 知识 E185 同源根因"
    patch_type: "portability"
  - patch_file: "patches/0002-test-build-ohos-pthreads-curl-flags.patch"
    patch_description: "上游测试构建适配: package 与 cache 两个测试 Makefile 的 pthread 开关改走上游自带 scripts/feature-test-pthreads 特性探测(硬编码 -DHAVE_PTHREADS 在 OHOS musl 缺 pthread_cancel 时无法链接; 主构建本就走同一特性探测并回退串行); 测试 Makefile 新增 CURL_CFLAGS 与 CURL_LIBS 变量用于注入 Conan libcurl 路径(上游默认依赖系统 curl-config); scripts/feature-test-pthreads 的 shebang 由 /bin/bash 改为 CONFIG_SHELL 指向的 bash; 不改任何测试用例逻辑"
    patch_type: "platform"
