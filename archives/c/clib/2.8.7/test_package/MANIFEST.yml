# test_package/MANIFEST.yml — clib 2.8.7
# 上游官方测试声明文件(CI L0e 强制要求存在)
# 上游测试已于 2026-09-07 在设备上真实执行,完整证据见
# archives/c/clib/2.8.7/notes.md 与 reports/

package: clib/2.8.7
homepage: "https://github.com/clibs/clib"

# 上游测试入口: test.sh 三段
#   1) clib(1) shell 集成测试 12 个脚本(依赖网络,真实拉取 GitHub 包)
#   2) test/package: 12 个 C 测试程序(describe.h 框架)共 56 个 it() 用例
#   3) test/cache: 1 个 C 测试程序共 5 个 it() 用例
upstream_check_command: "sh test.sh (上游; 依赖 PATH 含 9 个产物与网络)"
upstream_test_in_build: true
upstream_test_command: "sh test.sh"

# 上游测试统计(2026-09-07 设备实测, 采信轮第 5 轮完整日志留存于任务目录并摘要至 notes.md;
# 统计单位: describe it() 用例 / shell 脚本; 取数命令: sed 去除 ANSI 后
# grep -c "✓"(C 用例) 与 grep -c "(✓)"(shell 脚本)):
#   C describe 用例: TOTAL=61  PASS=61  FAIL=0  SKIP=0  NOT_RUN=0
#     (test/package 56 + test/cache 5)
#   shell 集成测试: TOTAL=12  PASS=12  FAIL=0  SKIP=0  NOT_RUN=0
# 合计: TOTAL=73  PASS=73  FAIL=0  SKIP=0  NOT_RUN=0
#     (C describe ✓ 计数含 shell 结果行; 口径: describe ✓=61 由 73 - shell 12 相减,
#      与 56+5 it() 清点一致; shell 以 (✓) 计 12)
upstream_tests:
  - file: test.sh
    source: clib-2.8.7.tar.gz/test.sh
    description: "上游测试入口: 12 个 shell 集成脚本 + package/cache 两组 C 测试"
    command: "sh test.sh"
  - file: test/package/package-install.c
    source: clib-2.8.7.tar.gz/test/package/package-install.c
    description: "包安装集成测试(7 用例, 含从 GitHub 真实拉包)"
    command: "./package-install"
  - file: test/cache/cache-test.c
    source: clib-2.8.7.tar.gz/test/cache/cache-test.c
    description: "缓存目录管理测试(5 用例)"
    command: "./cache-test"

# test_package 自带测试(消费者视角,独立于上游用例数)
# 断言计数(双环境一致的分母): tp1 存在性 9 + tp2 版本 1 + tp3 usage 1
#   + tp4 分发 1 + tp5 init 1 = 13 项断言
# 另有 tp6(clib-search 真实 HTTPS 查询)为环境条件性观测项,不计入分母:
#   设备实测 PASS(CA 探测补丁在 Conan 包环境内生效的直接证据,见
#   reports/conan-create.log 与设备采信轮日志);CI worker 无外网时
#   test.sh 显式输出 ⏭️ SKIP(实测 "failed to fetch wiki HTML"),不伪造、
#   不静默跳过、不计入分母
test_package_tests:
  - file: test.sh
    description: "9 个产物存在可执行; --version 输出 2.8.7; usage 列出命令; 分发机制; clib-init 生成 clib.json(13 项断言); 另含 tp6 clib-search 真实 HTTPS 条件观测项(设备 PASS/无网环境 SKIP)"
    command: "bash test.sh <package_folder> <scratch_dir>"

assertion_count: 13
