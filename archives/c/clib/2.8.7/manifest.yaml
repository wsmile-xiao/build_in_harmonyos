patches_applied:
  - "0001-http-get-ca-store-probe.patch: vendored http-get 运行时探测 CA 证书库(env CURL_CA_BUNDLE 与 SSL_CERT_FILE; 常见 Linux CA 文件; SSL_CERT_DIR 与 /system/etc/security/certificates 目录)并设置 CURLOPT_CAINFO/CURLOPT_CAPATH; OHOS 无 /etc/ssl 默认 CA 且 libcurl 编译期默认 CAINFO 指向不存在路径致全部 HTTPS 报 CURLE_SSL_CACERT"
  - "0002-test-build-ohos-pthreads-curl-flags.patch: 上游测试构建适配; 测试 Makefile 的 pthread 开关改走上游 scripts/feature-test-pthreads 特性探测(OHOS musl 无 pthread_cancel; 硬编码 -DHAVE_PTHREADS 无法链接); 新增 CURL_CFLAGS 与 CURL_LIBS 注入 Conan libcurl 路径; feature-test-pthreads 与 uninstall.sh 的 shebang 改用 hnp bash; test.sh 用例发现去掉 -perm -111(设备 HMDFS 将模式规范化为 770 永不匹配); 未改任何测试用例逻辑"

knowledge_gained:
  - "musl 缺 pthread_cancel: clib 主构建经 scripts/feature-test-pthreads 构建期探测自动回退串行路径(上游自带机制无需补丁); 测试 Makefile 硬编码 -DHAVE_PTHREADS 绕过了探测需改走同一特性探测"  # knowledge_ref: E085
  - "libcurl 编译期默认 CAINFO 在 OHOS 指向不存在路径时全部 HTTPS 报 CURLE_SSL_CACERT(60); 应用内嵌 http 层按 env → 常见 CA 文件 → 设备证书目录顺序运行时探测并显式设置 CURLOPT_CAINFO/CURLOPT_CAPATH 可修复且无平台条件编译"  # knowledge_ref: E185
