# 软件级 manifest — clib
# 遵循 ARCHIVE-SPEC v2.0

software: clib
display: "clib"
description: "C 包管理器:从 GitHub 拉取并安装 clibs 生态的 C 包(含安装、搜索、初始化、构建、更新、卸载等 9 个命令行工具)"
category: build-tool
homepage: "https://github.com/clibs/clib"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建:经任务内 curl-config shim 注入 Conan libcurl 路径(Makefile 硬编码 curl-config 探测)"
    - "musl 无 pthread_cancel:上游 scripts/feature-test-pthreads 构建期探测自动回退串行路径;测试 Makefile 需改走同一探测"
    - "OHOS 无 /etc/ssl 默认 CA:vendored http-get 运行时探测 CA 库并显式设置 CURLOPT_CAINFO/CURLOPT_CAPATH"
    - "设备无 coreutils install:包安装用 conan.tools.files.copy"
    - "设备 HMDFS 将文件模式规范化为 770:test.sh 用例发现需去掉 -perm -111"
  common_dependencies:
    - curl

versions:
  - version: "2.8.7"
    status: built
    build_date: "2026-09-07"
