package: catch2/3.8.1
homepage: "https://github.com/catchorg/Catch2"

upstream_check_command: "ctest --test-dir build/Release --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build/Release --output-on-failure"

upstream_tests:
  - file: tests/CMakeLists.txt
    source: Catch2-3.8.1/tests/CMakeLists.txt
    description: "Catch2 upstream CTest suite: 113 registered tests, including SelfTest, reporters, list/filter behavior, and extra tests."
    command: "ctest --test-dir build/Release --output-on-failure"

# The SelfTest executable contains 460 TEST_CASE instances; CTest invokes it
# together with dedicated behavioral and extra-test executables.
upstream_test_case_count: 460
upstream_ctest_count: 113

# No additional tests were needed because upstream provides comprehensive tests.
test_package_tests:
  - file: test_catch2.cpp
    description: "Consumer test includes Catch2 v3 macros, links Catch2WithMain, and executes a real assertion."
    command: "./test_catch2"

test_package_test_case_count: 1
assertion_count: 84497
