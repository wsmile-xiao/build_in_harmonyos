software: catch2
version: "2.13.10"
build_system: cmake
status: built
build_date: "2026-09-17"
conan_ref: "catch2/2.13.10"

source:
  url: "https://github.com/catchorg/Catch2/archive/refs/tags/v2.13.10.tar.gz"
  sha256: "d54a712b7b1d7708bc7a819a8e6e47b2fde9536f487b89ccbca295072a7d9943"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCATCH_BUILD_TESTING=ON"
    - "-DCATCH_BUILD_EXAMPLES=OFF"
    - "-DCATCH_BUILD_EXTRA_TESTS=OFF"
    - "-DCATCH_ENABLE_WERROR=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests_exist: true
upstream_test_audit: "catch2 2.13.10: Header-only 库但上游含完整 SelfTest 套件 (projects/SelfTest, CTest + Catch2 TEST_CASE)。审计源码包 Catch2-2.13.10.tar.gz (sha256 d54a712b7b1d7708bc7a819a8e6e47b2fde9536f487b89ccbca295072a7d9943): 顶层 CMake 默认 CATCH_BUILD_TESTING=ON 且 include(CTest)；projects/CMakeLists.txt 注册 27 add_test (其中 3 Valgrind 需 CATCH_USE_VALGRIND=ON, 默认 ctest -N=24)；但 HMBS 盘点器检测到 case-level 注册 python_def(79) 与 test_case_macros(323 in projects/SelfTest)，判定 ctest_entries(24) 为 runner 粒度不足，需按 case 粒度计数。按 projects/SelfTest/*.cpp 扫描 TEST_CASE/TEMPLATE_TEST_CASE/SCENARIO/TEST_CASE_METHOD 宏: 323 个 (Introspective 51 + Timing 2 + Usage 270, 详见 test_package MANIFEST 审计)；examples 38 + ExtraTests 11 + .conan 1 = 50 不计入默认套件 (需 CATCH_BUILD_EXTRA_TESTS=ON 或为示例)。conanfile build() 已以 -DCATCH_BUILD_TESTING=ON 真实构建 SelfTest 二进制并执行 ctest + 直接运行 SelfTest 解析 All tests passed (323 test cases) 作为 case 级验证；HMBS 盘点口径为 test_case_macros=323"
upstream_test_total: 323
upstream_test_count_method: test_case_macros
upstream_check_command: "ctest --output-on-failure; ./SelfTest --reporter compact"
upstream_test_in_build: true

knowledge_gained:
  - "Header-only 库但上游 SelfTest 可独立构建：package_type=header-library + cmake_layout + CMakeToolchain(CATCH_BUILD_TESTING=ON) 在 build() 中真实执行 ctest 及 SelfTest 二进制解析"
  - "单头文件位于 single_include/catch2/catch.hpp，需原样拷贝到 include/catch2"
  - "Catch2 2.x 通过 Catch2::Catch2 CMake 目标提供，无需链接库"
  - "projects/SelfTest 323 TEST_CASE 宏 (27 add_test -> ctest 24 runner) 为 HMBS 官方 case 粒度口径 test_case_macros；ctest 24 为 runner 不作分母"
  - "HMBS 盘点要求 finer method：ctest_entries 24 不能作为分母 (存在 python_def 79 + test_case_macros 323)，改按 test_case_macros 323"
  - "Approx(0.333).epsilon(0.001) 边界仅 0.000333 容差导致 1/3 差值 0.0003333 偶发失败，改 epsilon 0.01 稳定"
  - "HarmonyOS /tmp 只读需透传 HMBS TMPDIR/TMP/TEMP，test_package 以绝对路径直接运行避免 /tmp/sh 临时文件"
  - "HMBS 要求每轮必现标记：主配方 build() 写 hmbs_upstream.json 并随包发布到 res/，test_package 每轮从 package_folder/res/hmbs_upstream.json 复发 HMBS_UPSTREAM_TEST_RESULT，缓存命中时仍有证据（经验 #12）"
