version: "1.7.0"
software: cvsgraph
status: built
build_date: "2026-09-14"
build_system: autotools

verification:
  device: "10.62.178.77 (HarmonyOS aarch64, HongMeng Kernel 1.12.0)"
  conan_create: "PASS (RC=0, 2026-09-14, isolated CONAN_HOME, jobs=1)"
  test_package: "PASS (-V version smoke + RCS→PNG render, 1640B valid PNG)"
  config_macros: "9/9 HAVE_GD* (PNG/JPEG/GIF/PNGEX/STRINGFT/FILLEDARC)"

source:
  url: "https://www.vagrearg.org/cvsgraph/release/cvsgraph-1.7.0.tar.gz"
  sha256: "74438faaefd325c7a8ed289ea5d1657befe1d1859d55f8fbbcc7452f4efd435f"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--host=aarch64-linux-ohos"
  dependencies:
    - "gd/2.3.3"
  dependency_note: >-
    gd/2.3.3（static，zlib+libpng）替代 gd/2.3.3.1（shared 含
    fontconfig）：ohpcd 发布的 fontconfig/2.18.1 二进制对 libexpat 烤死
    绝对 DT_NEEDED（$HOME/.conan2/p/<hash>/p/lib/libexpat.so），仅在缓存
    恰在同路径的机器可加载，CI test_package 必挂（PR #10072 #47890）。
    静态变体使运行期闭包仅剩 libpng16.so.16 + libc。TTF 因此不可用，
    上游默认 use_ttf=false 不受影响。
  umask_fix: "conanfile.py build() replace_in_file: configure umask 077 -> 022 (OHOS drwx--S--- temp dir issue, fcrackzip-proven)"

patches_applied: []

knowledge_gained:
  - "cvsgraph 官方源在作者站 vagrearg.org（SourceForge 下载链接 404/403）"
  - "configure.in 为 2008 年代 autoconf 2.61，无 AC_CANONICAL_HOST：无交叉三元组、tarball 无 config.guess/config.sub，交叉编译完全靠 Conan 工具链环境变量注入 CC/CFLAGS，不传 --host/--build（R1）"
  - "tarball 自带预生成 rcsl.c/rcsy.c/rcsy.h（mtime 晚于 .l/.y），构建无需 flex/bison；configure 缺 lex 时置 LEX=: 不硬失败"
  - "cvsgraph.c 要求 gd 至少支持 GIF/PNG/JPEG 之一否则 #error；最终选 gd/2.3.3（static）——gd/2.3.3.1 的 fontconfig 闭包带烤死绝对 DT_NEEDED（ohpcd 发布缺陷，详见 fontconfig-baked-abs-dt-needed 草稿），TTF 功能因此不可用（上游默认 use_ttf=false 不受影响）"
  - "configure 用 AC_CHECK_LIB 探测 gd/freetype（纯链接测试，交叉可用）；gd conan 包不含 gdlib-config，靠 AutotoolsDeps 注入 -I/-L/-l 后所有探测通过"
  - "test_package 可用最小 RCS 文件（admin+deltas+desc，dtexts 可选且 parse_logs 默认关闭）驱动完整 RCS 解析→gd 渲染→PNG 输出管线，断言 PNG 魔数"
  - "【真机】hnp bash 在 conan 构建(HMDFS 深)目录 getcwd 损坏，/system/bin/sh 干净 → configure 显式 sh 调用 + CONFIG_SHELL 固定（E386 能力探针思想的实证）"
  - "【真机】无 AC_CANONICAL_HOST → cross_compiling 恒 no → configure 真实运行 conftest；共享依赖必须内联注入 LD_LIBRARY_PATH（Environment().define 会被 conanbuildenv 的 export 覆盖），否则误报 cannot run C compiled programs（真因是 libgd.so.3 加载失败，非签名/noexec）"
  - "【真机】本 conan 发行版 Autotools.install() 自动 DESTDIR=package_folder + Toolchain 默认 prefix=/：手动 configure 必须用 --prefix=/，绝对 prefix 会叠出 <pkg>/storage/ 嵌套"
  - "【真机】conanrun PATH 只含依赖 bindir 不含被测包自身 bin/；test_package 无自建产物时 cpp.build.bindirs 为空 → 用 self.dependencies[tested_ref].package_folder 定位二进制"

patch_generation:
  method: none
  patches_count: 0

patch_classification: []
