# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: cvsgraph/1.7.0
homepage: "https://www.vagrearg.org/content/cvsgraph"

# R51 upstream test inventory: cvsgraph ships NO test suite.
# Evidence: Makefile.am defines no `check:`/TESTS target (only bin_PROGRAMS,
# man pages, dist-hook); `make check` upstream is a no-op default from
# automake. No tests/ directory in the 1.7.0 tarball.
upstream_check_command: "grep -cE '^(check|TESTS)' Makefile.am  # -> 0"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests: []  # none shipped (see evidence above)

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "cvsgraph -V version smoke test"
    command: "cvsgraph -V"
  - file: conanfile.py
    description: "Full pipeline render: minimal 2-revision RCS file -> PNG via libgd, asserting PNG magic and non-trivial size (use_ttf=false so no font files needed)"
    command: 'cvsgraph -c cvsgraph.conf -o test-out.png -r "" test.txt,v'
  - file: consumer_demo.sh
    description: "Consumer use case: render a branching RCS tree (trunk 1.1-1.3 + side branch 1.2.2) to PNG and to an HTML imagemap; asserts side branch rev 1.2.2.1 and trunk head 1.3 appear in the map (cvsweb integration scenario)"
    command: 'CVSGRAPH=<pkg>/bin/cvsgraph sh consumer_demo.sh'

# Test assertion count (approximate, for quality assessment)
assertion_count: 8
