software: cvsgraph
display: "CvsGraph"
description: "CVS/RCS 仓库版本树图形化渲染工具（libgd 输出 PNG/GIF/JPEG）"
category: devel
homepage: "https://www.vagrearg.org/content/cvsgraph"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "官方源在作者站 vagrearg.org（SourceForge 下载 404/403）"
    - "configure 无 AC_CANONICAL_HOST：交叉编译纯靠工具链环境变量，不传 --host"
    - "tarball 自带预生成 rcsl.c/rcsy.c/rcsy.h，无需 flex/bison"
    - "configure umask 077 需替换为 022（OHOS 临时目录权限）"
    - "依赖 gd/2.3.3（static，zlib+libpng 最小闭包；规避 fontconfig/2.18.1 发布包烤死绝对 DT_NEEDED）"
  common_dependencies:
    - gd

versions:
  "1.7.0":
    status: built
    build_date: "2026-09-12"
    notes: >-
      首次适配。CLI 工具（bin/cvsgraph），无库产物。test_package 用最小
      RCS 文件驱动完整 RCS 解析→gd 渲染→PNG 管线并断言 PNG 魔数，
      use_ttf=false 免字体文件依赖。
