# 数字与 notes.md / test_package/MANIFEST.yml / conan create 日志同源

version: "0.4.0"

software: combine

# published | built | failed | archived
# R29: 本地 create 通过、未 release 前只标 built，不伪造 published
status: built

build_date: "2026-09-26"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.gnu.org/gnu/combine/combine-0.4.0.tar.gz"
  sha256: "56e71cd9cc38404fc4e6dac02d5fb76e894d481f9be8719072b1f8b1d8afbe14"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # 全部经 env -u CONFIG_SHELL SHELL=/bin/sh 前缀执行（E386 同族，见 notes.md 问题 1）
  configure_options:
    - "--prefix=/"
    - "--bindir=${prefix}/bin"
    - "--sbindir=${prefix}/bin"
    - "--libdir=${prefix}/lib"
    - "--includedir=${prefix}/include"
    - "--oldincludedir=${prefix}/include"
    - "--disable-nls"
    - "ac_cv_lib_guile_gh_scm2bool=no"
    - "ac_cv_header_libguile_h=no"

  make_options:
    - "-j1"
    - "make check            # 上游 7 个用例真实执行"
    - "make install DESTDIR=<package_folder> guiledatedir=/share/combine_scm"

  # 零 Conan 依赖：guile 是可选依赖（AC_CHECK_LIB 无 required 判定，全部 guile
  # 代码在 HAVE_LIBGUILE/HAVE_LIBGUILE_H 条件编译内）；NLS 经 --disable-nls 关闭
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-umask.patch"
  - "0004-test-combine-shebang.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "本快照 config.guess/config.sub 是 2004-03-12 版且 `grep -c 'GUESS=' config.guess` = 0，分支体是 per-branch `echo <triplet>; exit 0 ;;` 风格 ⇒ 仓内 scripts/patch-autotools-ohos.pl 产出的 GUESS= 形态在这里根本不会被读到，必须按本快照风格重生成成对补丁（E160/E007 族，B 先例 M4）"
  - "2004 config.sub 有 `-linux*) os=$(echo $os | sed 's|linux|linux-gnu|')` 改写分支 ⇒ 只补 maybe_os 白名单不够，必须把 -linux-ohos* 也加进『OS 直通表』，否则静默产出 -linux-gnu-ohos 畸形 triple 且不报错"
  - "HMDFS 上 autoconf 的 `umask 077 && mktemp -d ./confXXXXXX` 会建出 drwx--S--- 且随后写入被拒 ⇒ config.status: error: could not setup config files machinery；同一目录 A/B 实测 umask 002 → drwxrws--x 且写入 OK。fallback 的 `(umask 077 && mkdir)` 分支反而正常 ⇒ 只有 mktemp 分支炸"
  - "上游带测试的包：tests/Makefile.am 可能不用 TESTS/check_PROGRAMS，而是**手写 `check:` 目标**调一个 shell 驱动脚本 ⇒ 静态清点必须读脚本本体（本包 7 个用例、15 次 diff -q 黄金比对）"
  - "上游 test_combine 的退出码恒为 0（最后一条命令是 rm），且 `[[ \"$(diff -q A B)\" == \"\" ]]` 在文件不存在时也是空 ⇒ make check 的 RC=0 既不代表全过、也可能假阳性；判决必须逐用例点收日志，另用 test_package 做独立逐字节断言"
  - "HarmonyOS 上没有 /bin/bash：上游脚本硬编码 `#!/bin/bash` 时 make check 起手即 ENOENT；实测目标 /bin/sh（/system/bin/sh）接受 `[[ ]]`/`==` ⇒ 只改 shebang、不 POSIX 化脚本体"
  - "profile 的 [buildenv] 导出 CONFIG_SHELL=/data/service/hnp/bin/bash ⇒ Autotools.configure() 在 HMDFS 构建目录必挂 getcwd；仓内已合入解法是 env -u CONFIG_SHELL SHELL=/bin/sh 前缀 + 树内手工 configure（⛔ 用 --build/--host 绕，会静默跳过全部 AC_RUN_IFELSE 探测）"
  - "makeinfo 缺失时不要把 MAKEINFO 占位成 `:`/`true`：automake 的 .texinfo.info 规则会先把 $@ 备份进 .am$$ 再让假 makeinfo '成功'、最后 rm -rf 备份目录，把 tarball 自带的真 info 件吃掉。⚠ 光压生成物时间戳也不成立：make 阶段 doc/ 会再生 version.texi（combine.info ← version.texi ← stamp-vti），make check 时该规则照样执行，缺失的 makeinfo 用 -o 把 tarball 自带的 doc/combine.info 截成 0 字节，随后 make install 把空件装进 share/info/（独立 W4 判决 W68R-COMB-01 实测）。⇒ 成立的做法是任何 make 之前把原件字节快照到 build_folder、全部 make 跑完按快照原样写回，再用解包后一手算出的 size+sha256 逐字节断言（不等即 ConanException，⛔ 只打 warning），并对包内 share/info/combine.info 复核一次"
  - "guile 未启用 ⇒ configure 不跑 GUILE_FLAGS ⇒ @GUILE_SITE@ 为空 ⇒ src/combine_scm 的 guiledatedir 退化成 /combine_scm（DESTDIR 兜住后落在包根散目录）⇒ 用 make 命令行变量 guiledatedir=/share/combine_scm 覆盖，⛔ 改生成的 Makefile.in"

# ============================================================
# 上游测试台账（五维，与 notes.md / MANIFEST.yml 同源）
# ============================================================

upstream_tests_exist: true

upstream_test_audit: >-
  Audited the combine-0.4.0 tarball: tests/Makefile.am registers a hand-written
  `check:` recipe that execs tests/test_combine (no TESTS variable, no
  check_PROGRAMS, no ctest/dejagnu entry point); the driver contains 7
  `Test N: ... PASSED/FAILED` cases doing 15 `diff -q` comparisons against the
  shipped goldens (result1/2/4/5a/5b/6/7.txt + stats1..7.txt).
  Golden-comparison accounting: 15 static calls on 11 lines (15/23/31/39/47/48/49/
  57/58/66/67), 14 actually executed because each case is
  `[[ diff A ]] && [[ diff B ]]` and Test 7 short-circuits after its first
  comparison, of which 13 matched and 1 did not (Test 7 stats.txt vs stats7.txt).
  `make -j1 check` is executed inside conanfile.py build() on the device.

upstream_tests:
  n_static: 7
  n_registered: 7
  n_executed: 7
  n_skipped: 0
  n_passed: 6
  n_failed: 1
  failed_detail: "Test 7 (Extension load and field modification) uses `-X ../src/util.scm`, i.e. the optional guile extension path; guile is not shipped on OHOS and the recipe pins ac_cv_lib_guile_gh_scm2bool=no / ac_cv_header_libguile_h=no, so this case cannot pass. Denominator kept at 7; no case deleted, no case relabelled as skipped."

consumer_tests:
  n_consumer: 1
  n_assertion: 7
  assertion_rule: "N_assertion counts test.sh's numbered sections (1..7) = 7; section 7 itself holds 2 negative checks (7a/7b), so 8 checks are performed in total. Carriers (test.sh echo line, test_package/conanfile.py docstring, test_package/MANIFEST.yml, notes.md, this manifest) all use this one rule."
  detail: "test_package/test.sh runs the packaged `combine` binary as a consumer, one numbered section per assertion: 1) --version, 2) --help, 3) comma-delimited field projection (byte-exact), 4) -t output file (byte-exact), 5) reference-file join (stderr statistics: 3 data records, 2 reference-data matches), 6) duplicate-key pass-through, 7) negative section holding 7a missing data file and 7b `-u` before any `-r` (both must exit non-zero)."

