# conandata.yml — combine 0.4.0
# 官方源单一事实来源（R39/PF7：⛔ 镜像池址、⛔ 本地回退址、⛔ 改哈希、⛔ 加镜像）
#   https://ftp.gnu.org/gnu/combine/combine-0.4.0.tar.gz
# sha256 为设备侧实算值（对已取到的官方副本跑 sha256sum，与主窗前缀 56e71cd9cc38404f 对字）：
#   56e71cd9cc38404fc4e6dac02d5fb76e894d481f9be8719072b1f8b1d8afbe14

sources:
  url: "https://ftp.gnu.org/gnu/combine/combine-0.4.0.tar.gz"
  sha256: "56e71cd9cc38404fc4e6dac02d5fb76e894d481f9be8719072b1f8b1d8afbe14"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Teach the 2004-03-12 config.guess that `uname -s` = HarmonyOS is a Linux-libc host; emitted in this vintage's per-branch `echo <triplet>; exit 0 ;;` style because this snapshot never reads the GUESS= form (E160/E007)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Accept aarch64 and the linux-ohos kernel-os tuple in the 2004-03-12 config.sub: maybe_os whitelist, CPU lists with and without vendor, and the OS pass-through list that would otherwise rewrite -linux-ohos into -linux-gnu-ohos (E007)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask.patch"
    patch_description: "Relax the autoconf temp-dir umask from 077 to 002 (E011/E114). Measured A/B in the Conan build dir on the target: umask 077 makes `mktemp -d ./confXXXXXX` yield drwx--S--- and the next redirect dies with `can't create ./confXXXXXX/subs1.awk: Permission denied`, which aborts config.status with `could not setup config files machinery`; umask 002 yields drwxrws--x and writes fine"
    patch_type: "portability"
  - patch_file: "patches/0004-test-combine-shebang.patch"
    patch_description: "tests/test_combine must not hardcode /bin/bash: HarmonyOS ships no /bin/bash (only /bin/sh -> /system/bin/sh), so `make check` dies with ENOENT before the first case. The script's [[ ]] / == bashisms are accepted by the target /bin/sh (verified), so only the shebang changes"
    patch_type: "portability"
