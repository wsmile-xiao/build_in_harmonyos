# test_package/MANIFEST.yml — combine 0.4.0
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求存在）
#
# 五维台账（手册04 §10.1；与 notes.md / 验证结果 / 日志同源）
#   N_static     = 7   上游静态声明：tests/test_combine 内 7 个 "Test N:" 用例
#                        （注册入口 = tests/Makefile.am 的手写目标
#                         `check: $(srcdir)/test_combine $(srcdir) $(top_builddir)/tests`；
#                         没有 TESTS / check_PROGRAMS / am_ 变量，所以注册面只有 1 个
#                         make 目标，7 个用例都跑在这一个脚本里）
#   N_registered = 7   构建系统注册且可执行的目标 = 1 个 make check 目标，
#                        展开后逐项执行的用例数 = 7（无一条被条件编译剔除）
#   N_executed   = 7   conanfile.py build() 里 `make -j1 check` 真跑，7 条全部执行
#   未执行/跳过     = 0
#   失败          = 1  Test 7（guile 扩展用例，原因见下）
#   N_consumer   = 1   新增消费者测试程序 test_package/test.sh
#                        计数口径：按 test.sh 的「7 个编号节」计 N_assertion = 7
#                        （第 7 节内含 7a/7b 两项反向检查 ⇒ 检查项 8、断言数 7）；
#                        同一口径同步在 test.sh 的 echo 文案、test_package/conanfile.py
#                        docstring、notes.md、版本级 manifest.yaml 五处
#
# 黄金比对面：7 个用例共 15 次 `diff -q` 静态调用（Test 5 比 3 个文件，其余各 2 个；
#   计数入口 = tests/test_combine 的 11 行：15/23/31/39/47/48/49/57/58/66/67）。
#   实执行 14 次 —— 每条用例是 `[[ 比对A ]] && [[ 比对B ]]` 短路形，Test 7 的第一个
#   比对不匹配后第二个不执行 ⇒ 14 次里 13 匹配 / 1 不匹配（Test 7 的 stats.txt vs
#   stats7.txt）。
#
# 上游测试计数口径说明（诚实申报）：
#   * 上游 test_combine 的退出码恒为 0（脚本最后一条命令是 rm），用例失败只打印
#     "Test N: ... FAILED"。因此 build() 的 make check 不会因为 Test 7 失败而中断，
#     判决必须逐用例点收日志 —— 本包实测 6 PASSED / 1 FAILED，见
#     reports/ 与 notes.md 的原文摘录。⛔ 不删用例、⛔ 不缩分母、⛔ 不把 FAILED
#     写成 skipped。
#   * Test 7 失败的确定技术原因：该用例是 `-X ../src/util.scm`（加载 guile 扩展并
#     用 scheme 改字段）。guile 在本包是**可选**依赖（configure.ac:26 AC_CHECK_LIB
#     无 required 判定，全部 guile 代码在 HAVE_LIBGUILE/HAVE_LIBGUILE_H 条件编译内，
#     唯一 guile TU 是 src/iguile.c）。HarmonyOS 侧不部署 guile ⇒ 配方把
#     ac_cv_lib_guile_gh_scm2bool=no / ac_cv_header_libguile_h=no 钉死以保证构建
#     与机器残留无关，代价就是 Test 7 必然失败。

package: combine/0.4.0
homepage: "https://www.gnu.org/software/combine/"

# 上游测试命令（tests/Makefile.am 手写 check 目标）
upstream_check_command: "make check"

# conanfile.py build() 中已集成上游测试（真实执行，非注释）
upstream_test_in_build: true
upstream_test_command: "env -u CONFIG_SHELL SHELL=/bin/sh make -j1 check"

# 上游实际运行的测试程序（7 条，逐条对应日志里的 "Test N: ... PASSED/FAILED"）
upstream_tests:
  - file: tests/test_combine
    source: combine-0.4.0/tests/test_combine
    description: "Test 1: (General matching, reference-based output.) —— 输出与 tests/result1.txt 比对、stderr 统计与 tests/stats1.txt 比对；实测 PASSED"
    command: "./src/combine -n -z 3 -r test.1 -k 1 -m 1 -u -h 30 -r test.2 -k 1 -m 2 -u -h 30 -t <builddir>/testout.txt -w test.3"
  - file: tests/test_combine
    source: combine-0.4.0/tests/test_combine
    description: "Test 2: (General matching, data-based output.) —— result2.txt + stats2.txt 双比对；实测 PASSED"
    command: "./src/combine -n -z 3 -o 1-3 -t <builddir>/testout.txt -w -r test.1 -k 1 -m 1 -u -h 30 -r test.2 -k 1 -m 2 -u -h 30 test.3"
  - file: tests/test_combine
    source: combine-0.4.0/tests/test_combine
    description: "Test 3: (Only necessary ref checking.) —— --no-check-all-reference 路径，result2.txt + stats3.txt；实测 PASSED"
    command: "./src/combine -n -z 3 -o 1-3 -t <builddir>/testout.txt -w --no-check-all-reference -r test.1 -k 1 -m 1 -u -h 30 -r test.2 -k 1 -m 2 -u -h 30 test.3"
  - file: tests/test_combine
    source: combine-0.4.0/tests/test_combine
    description: "Test 4: (Constant strings and reference filler.) —— -K 常量注入，result4.txt + stats4.txt；实测 PASSED"
    command: "./src/combine -K XXX -o 1 -w -r test.1 -k 1 -m 1 -K Y -p -o 1 test.3"
  - file: tests/test_combine
    source: combine-0.4.0/tests/test_combine
    description: "Test 5: (Multiple reference matches.) —— 唯一一个三方比对（stats5.txt + result5a.txt + result5b.txt，-t 双输出文件）；实测 PASSED"
    command: "./src/combine -f -o 1 -w -r test.4 -k 1 -m 1 -o 1 -w -t <builddir>/testout2.txt test.3"
  - file: tests/test_combine
    source: combine-0.4.0/tests/test_combine
    description: "Test 6: (Delimited reference fields and sums.) —— -D 分隔符 + -s 字段求和 + -z 计数宽度，result6.txt + stats6.txt；实测 PASSED"
    command: "./src/combine -z 5 -s 4-9 -r test.5 -k 1 -m 1-3 -o 2 -w -D , test.6"
  - file: tests/test_combine
    source: combine-0.4.0/tests/test_combine
    description: "Test 7: (Extension load and field modification.) —— -X ../src/util.scm 加载 guile 扩展后用 scheme 改字段，result7.txt + stats7.txt；实测 FAILED（HarmonyOS 侧不部署可选依赖 guile，配方显式把 ac_cv_lib_guile_gh_scm2bool / ac_cv_header_libguile_h 钉成 no；保留用例、保留分母）"
    command: "./src/combine -X '../src/util.scm' -w -D , -d , -o '1(rpad input-field 5),2(lpad input-field 10)' test.5"

# test_package 消费者测试（N_consumer = 1 个测试程序；N_assertion 按 test.sh 的
# 7 个编号节计 7，其中第 7 节内含 2 项反向检查 7a/7b ⇒ 检查项 8）
test_package_tests:
  - file: test.sh
    description: "以使用者身份运行包内 combine 二进制，退出码 + 输出双判据按 7 个编号节计（1) --version 报 0.4.0；2) --help 用法横幅；3) -D , -o 1,3 字段投影逐字节比对；4) -t 输出文件内容逐字节比对；5) d1{1,2,3} 对 r1{1,3} 的引用匹配数（stderr 统计 reference-data matches: 2）；6) 未加 -u 时重复键逐条输出；7) 反向节，内含 7a 数据文件不存在 + 7b -u 出现在任何 -r 之前，两项都必须非零退出）⇒ 断言 7 项、检查项 8"
    command: "sh test.sh"
  - file: conanfile.py
    description: "在 conanrun（VirtualRunEnv，包内 bin/ 已进 PATH）环境里真实执行 test.sh"
    command: "sh test.sh"

# 断言总数（消费者侧按 test.sh 的 7 个编号节计 7；上游 15 次静态黄金比对另计，
# 实执行 14 / 匹配 13 / 不匹配 1，⛔ 不混成一个分母）
assertion_count: 7

# 本轮实测读数（A 机 2026-09-26 19:13-19:21 复跑，W68R-COMB-01 整改后；
# 与 notes.md / 版本级 manifest.yaml 逐字同源。reports/ 被仓根 .gitignore 排除、
# 不随 PR 入库 ⇒ 这里抄出的 sha256 与行号就是对外核验锚）
measured_run:
  upstream_verdict_lines: "reports/w3-local-ci.log:3292-3298（Test 1-6 PASSED / Test 7 FAILED）"
  consumer_verdict_line: "reports/w3-local-ci.log:3520 consumer test passed: 7/7 assertions (7 numbered sections: 1-6 positive command behaviours + section 7 holding 2 negative checks 7a/7b)"
  five_dimensions: "N_static=7 N_registered=7 N_executed=7 skipped=0 failed=1 N_consumer=1 N_assertion=7"
  golden_comparisons: "static=15 executed=14 matched=13 mismatched=1"
  info_integrity_line: "COMBINE_INFO_INTEGRITY=pre=0 post=97620 sha=90751f24deba restored=true"
  info_integrity_location: "reports/w3-local-ci.log:3310（包内复核 :3483，规则再触发证据 :3222 与 :3281）"
  w3_log_sha256: "bc32f6424ab10c1a55a37068874352aa8e52d47fd655525029f2e55bfe7e0616"
  ci_result_log_sha256: "bc32f6424ab10c1a55a37068874352aa8e52d47fd655525029f2e55bfe7e0616"
  w3_step_lines: 47
  w3_result_lines: 8
  w3_exit_code: 0
