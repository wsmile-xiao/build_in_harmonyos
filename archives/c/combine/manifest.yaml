# 软件级 manifest — combine
software: combine
display: "combine"
description: "GNU Combine：对文本文件的行做集合运算（并/交/差/补/连接/唯一/计数/求和）的命令行工具"
category: utility
homepage: "https://www.gnu.org/software/combine/"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools 快照极旧（config.guess/config.sub 均为 2004-03-12，且 config.guess 的 `GUESS=` 计数为 0 ⇒ 分支体是 per-branch `echo <triplet>; exit 0 ;;` 风格）⇒ 仓内 helper 的 GUESS= 形态在此不被读取，必须按本快照风格重生成成对补丁（E160/E007，B 先例 M4）"
    - "2004 config.sub 的 `-linux*)` 分支会把 os 改写成 -linux-gnu*，所以除 maybe_os/CPU 两张白名单外还必须把 `-linux-ohos*` 加进 OS 直通表，否则静默产出畸形 triple 而不报错"
    - "profile 注入 `CONFIG_SHELL=/data/service/hnp/bin/bash` 在 HMDFS 构建目录 getcwd 必挂 ⇒ 全部构建命令走 `env -u CONFIG_SHELL SHELL=/bin/sh` 前缀 + 树内手工 configure（仓内 gnu-pw-mgr/2.7.4、gtypist/2.10.1 同族；⛔ 用 --build/--host 绕，会静默跳过全部 AC_RUN_IFELSE 探测）"
    - "HMDFS 上 autoconf 的 `umask 077 && mktemp -d ./confXXXXXX` 建出 drwx--S--- 且写入被拒 ⇒ config.status『could not setup config files machinery』；同目录 A/B 实测 umask 002 → drwxrws--x 正常 ⇒ 补丁 0003 只改这两处 umask"
    - "guile 是**可选**依赖（configure.ac:26 AC_CHECK_LIB 无 required 判定，全部 guile 代码在 HAVE_LIBGUILE/HAVE_LIBGUILE_H 条件编译内，唯一 guile TU 是 src/iguile.c）⇒ 零 Conan 依赖；并把 ac_cv_lib_guile_gh_scm2bool / ac_cv_header_libguile_h 显式钉 no，避免 worker 上残留 libguile.h 让构建随机器漂移"
    - "po/ 与 intl/ 走 AM_GNU_GETTEXT ⇒ --disable-nls（USE_NLS=no 后 po/Makefile 的 all-no/install-data-no 是空目标），worker 上没有 msgfmt/autopoint 也能构建"
    - "上游**有**自动化测试：tests/Makefile.am 用手写 `check:` 目标调 tests/test_combine，脚本内 7 个用例、15 次 diff -q 黄金比对 ⇒ build() 内真跑 `make -j1 check`，实测 6 通过 / 1 失败（Test 7 = guile `-X` 扩展用例，可选依赖未启用），分母保持 7 不缩"
    - "上游 test_combine 首行 `#!/bin/bash` 而 HarmonyOS 无 /bin/bash ⇒ make check 起手 ENOENT；只补 shebang（实测目标 /bin/sh 接受脚本里的 [[ ]]/== bashism，不动脚本体）"
    - "makeinfo 在目标上不存在：不把 MAKEINFO 占位成 `:`/`true`（那条规则会把 tarball 自带的真 combine.info 备份后吃掉），也不停在压生成物时间戳——实测 make 阶段会再生 version.texi，make check 时 .texinfo.info 规则照样执行、缺失的 makeinfo 用 -o 把 doc/combine.info 截成 0 字节 ⇒ 配方改为每次 make 之前快照原件字节到 build_folder、全部 make 跑完原样写回，并用解包后一手算出的 size+sha256 逐字节断言（包内 share/info/combine.info 再核一次）"
    - "无 guile ⇒ @GUILE_SITE@ 为空 ⇒ src/combine_scm 的 guiledatedir 退化成 /combine_scm（DESTDIR 兜住后落在包根散目录）⇒ make 命令行覆盖 guiledatedir=/share/combine_scm，⛔ 改生成的 Makefile.in"
  common_dependencies: []

versions:
  "0.4.0":
    status: built
    build_date: "2026-09-26"
    conan_ref: "combine/0.4.0"
