# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: c-ares-lite/1.33.1
homepage: "https://c-ares.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/arestest.cc
    source: c-ares-1.33.1/test/arestest.cc
    description: "Google Test based test suite: ares_init, ares_destroy, ares_send, ares_cancel, channel management"
    command: "./test/arestest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: ares_library_init + ares_version + ares_library_cleanup"
    command: "./test_c-ares-lite"
  - file: test_ohos_hosts.c
    description: "鸿蒙特有测试: ares_init_options + ares_gethostbyname(localhost, AF_INET) 验证 OHOS hosts/HMDFS 平台路径解析 127.0.0.1"
    command: "./test_c-ares-lite-ohos-hosts"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 50