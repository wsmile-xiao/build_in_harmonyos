# 知识沉淀
# ============================================================

knowledge_gained:
  - "cccc Makefile defines every tool variable with `?=` (AR/CPP/CC/CCC/LD), so clang overrides pass straight through the environment and make command line — no source patch needed (contrast: braa hardcodes `cc` in the link rule and needs a patch)"
  - "The upstream `all` target chains mini (PCCTS antlr/dlg tools, legacy 1990s C that still compiles with clang 15) + cccc (parser generation + counter build) + test (self-test suite), so one make invocation produces the binary AND executes the bundled upstream suite for CI evidence"
  - "Version 3.2.0 comes from CHANGELOG.md ('## 3.2.0 (2022-11-13)') but the compiled binary banner still reports 'Version 3.1.6' — upstream bumped the changelog without the version string; the repo has no 3.2.0 tag, so conandata pins the matching commit snapshot"
  - "cccc treats unknown CLI arguments as input file names and still exits 0 ('Couldn't open -h'), so L2-style smoke checks must assert on report generation rather than flag parsing"

