# test_package/MANIFEST.yml — cccc 3.2.0
# CI L0e requires this file to exist.

package: cccc/3.2.0
homepage: "https://github.com/sarnold/cccc"

# Upstream ships a self-test suite driven by the top-level Makefile
# (`all: mini cccc test`): the `test` target runs the freshly built counter
# over bundled inputs and diffs the HTML/XML/DB outputs against checked-in
# references (test/posix.mak + rules.mak).
upstream_check_command: "make all CCC=clang++ LD=clang++ CC=clang"
upstream_test_in_build: true
upstream_test_command: "make test CCC=clang++ LD=clang++ CC=clang"

# Upstream self-test, executed as part of the recipe build() (see
# reports/test-report.md): 20 test runs (prn1-prn16 unit inputs + test1-test4
# regression inputs), each diffing 3 generated outputs (db/html/xml) against
# references = 60 comparisons, all passing ("All tests passed").
upstream_tests:
  - file: "test/ suite (posix.mak + rules.mak)"
    description: "Runs the built cccc over bundled inputs and diffs HTML/XML/DB reports against checked-in references"
    command: "make test (via make all)"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Feeds a bundled C++ sample through the packaged cccc and asserts exit 0 plus HTML/XML/DB report generation and the runner summary"
    command: "bash test.sh"

assertion_count: 6
