# 软件级 manifest — cpp-hocon
# 文件位置: archives/c/cpp-hocon/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: cpp-hocon
display: "cpp-hocon"
description: "Puppet Labs 的 HOCON 配置文件格式 C++ 解析库（TypesafeConfig 移植）"
category: library
homepage: "https://github.com/puppetlabs/cpp-hocon"
license: Apache-2.0

build_system: cmake

ohos_adaptation:
  key_points:
    - "上游依赖 puppetlabs/leatherman（未发布 OHOS），实际仅用 locale/format/translate、environment::each、scope_exit 三个 API——170 行 boost::format shim 即可替代"
    - "Boost 组件依赖 filesystem/program_options/thread(tss)/regex，制品仓 boost1.84 + boost1.84-thread 覆盖"
    - "boost1.84 与 boost1.84-thread 的 cmake_file_name 都是 Boost，同目录生成 CMakeDeps 会互相覆盖——generate() 里给 thread 包改名"
    - "CMake >= 4.0 移除 FindBoost 模块，find_package(Boost) 需 CONFIG 模式"
    - "cpp-hocon 0.3.0 源码不含 libuv（任务背景的 libuv 依赖归属 leatherman 体系）"
  common_dependencies:
    - boost1.84
    - boost1.84-thread
    - catch

versions:
  "0.3.0":
    status: built
    build_date: "2026-09-09"
