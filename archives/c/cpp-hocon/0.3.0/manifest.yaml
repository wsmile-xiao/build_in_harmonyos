# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "cpp-hocon 0.3.0 源码不含 libuv（grep uv_/libuv/uv.h 为零命中）——libuv 是 leatherman 体系内部依赖，非 cpp-hocon 依赖"
  - "puppetlabs/leatherman 未发布 OHOS 包；cpp-hocon 实际只用 locale::_/format/translate、util::environment::each、util::scope_exit 三个 API，170 行 boost::format shim 即可完整替代"
  - "leatherman 的 format 占位符语义是 {1}/{2} 位置参数，shim 需转换为 boost::format 的 %N% 语法并转义裸 %"
  - "boost1.84 与 boost1.84-thread 两个包的 cmake_file_name 都是 Boost，CMakeDeps 同目录生成时后者覆盖前者——配方 generate() 里 deps.set_property 给 thread 包改名即可共存"
  - "CMake >= 4.0 移除 FindBoost 模块（CMP0167），find_package(Boost) 必须加 CONFIG 关键字走 CMakeDeps 的 BoostConfig.cmake"
  - "OHOS toolchain 设 CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY，find_package 只搜 sysroot——conan deps 目录必须加进 CMAKE_FIND_ROOT_PATH（conan CMakeToolchain 自动处理）"
  - "OBJECT 库（add_library OBJECT）的 target_include_directories PUBLIC usage requirements 不随 $<TARGET_OBJECTS:> 传播给消费者，测试目标需显式补 include 路径"
  - "Catch v1（catch/1.12.2）'failed as expected' 语义：REQUIRE 在预期异常测试中失败计为 expected，不设非零退出码——判定套件通过看 0 个意外失败"
  - "静态库测试二进制动态链接 libc++_shared.so，设备运行需 LD_LIBRARY_PATH 指向 SDK 的 aarch64-linux-ohos/lib（conanrun 环境自动处理）"

