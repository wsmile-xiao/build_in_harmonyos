# conandata.yml — cpp-hocon 0.3.0

sources:
  # 官方 GitHub tag tarball（R39：官方源，CI 自动加镜像 fallback）
  url: "https://github.com/puppetlabs/cpp-hocon/archive/refs/tags/0.3.0.tar.gz"
  sha256: "dab02354046f05aca6275c746d7583ee5f71853aa5b1d93529564632e184c3dd"

patches:
  - patch_file: "patches/0001-cpp-hocon-0.3.0-leatherman-compat-shim.patch"
    patch_description: >
      新增 lib/compat/leatherman 最小 shim 头（locale 的 _/format/translate
      基于 boost::format 实现 {N} 占位符语义；util/environment::each 基于
      POSIX environ；util/scope_exit 基于 RAII）与 lib/export.h.in 静态库
      导出宏模板：puppetlabs/leatherman 未发布 OHOS 包，cpp-hocon 实际仅
      使用这三个 API（全量 grep 验证）
    patch_type: "portability"
  - patch_file: "patches/0002-cpp-hocon-0.3.0-cmake-port.patch"
    patch_description: >
      重写顶层/lib/lib-tests 三级 CMakeLists：去除 leatherman 宏体系
      （include(options)/cflags/leatherman、gettext locale 编译、cpplint/
      cppcheck 目标），保留上游完整源文件列表与 unit_tests 测试目标
      （Catch v1 链接制品仓 catch/1.12.2）；Boost 依赖改用 Conan CMakeDeps
      CONFIG 模式查找（CMake>=3.30 移除 FindBoost 模块 CMP0167；boost1.84
      与 boost1.84-thread 的 cmake_file_name 冲突由配方 generate() 改名
      hocon-boost-thread 解决）；OBJECT 库 usage requirements 不随
      $<TARGET_OBJECTS> 传播，测试目标显式补 inc/compat include 路径
    patch_type: "portability"
