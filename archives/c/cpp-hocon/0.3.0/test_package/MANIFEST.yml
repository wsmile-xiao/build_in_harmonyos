# test_package/MANIFEST.yml — cpp-hocon 0.3.0
package: cpp-hocon/0.3.0
homepage: "https://github.com/puppetlabs/cpp-hocon"

# 上游测试命令（上游 README：make test = ctest，注册目标 unit_tests）
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（单个 Catch v1 测试二进制，14 个测试源文件）
upstream_tests:
  - file: lib/tests/main.cc
    source: cpp-hocon-0.3.0/lib/tests/main.cc
    description: "Catch v1 runner（上游 libcpp-hocon_test，CTEST 注册名 unit_tests）"
    command: "./libcpp-hocon_test"
  - file: lib/tests/config_test.cc
    source: cpp-hocon-0.3.0/lib/tests/config_test.cc
    description: "config API 行为（3 TEST_CASE）"
    command: "./libcpp-hocon_test config"
  - file: lib/tests/conf_parser_test.cc
    source: cpp-hocon-0.3.0/lib/tests/conf_parser_test.cc
    description: "HOCON 解析器（26 TEST_CASE）"
    command: "./libcpp-hocon_test conf parser"
  - file: lib/tests/config_substitution_test.cc
    source: cpp-hocon-0.3.0/lib/tests/config_substitution_test.cc
    description: "${} 替换与解析（30 TEST_CASE）"
    command: "./libcpp-hocon_test substitutions"
  - file: lib/tests/tokenizer_test.cc
    source: cpp-hocon-0.3.0/lib/tests/tokenizer_test.cc
    description: "词法分析（9 TEST_CASE）"
    command: "./libcpp-hocon_test tokenizer"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：HOCON 解析/替换解析/类型化读取/列表/origin 五类断言"
    command: "./test_cpp_hocon"

# 测试断言总数（test_package 6 个 assert + 上游 3229 个断言）
assertion_count: 3235
