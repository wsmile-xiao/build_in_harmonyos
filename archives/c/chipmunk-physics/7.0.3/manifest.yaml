software: chipmunk-physics
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/7.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.0.3"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://chipmunk-physics.net/release/Chipmunk-7.x/Chipmunk-7.0.3.tgz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DBUILD_DEMOS=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-src-cpHastySpace.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "sys/sysctl.h 在鸿蒙/Linux 现代系统已移除，需用 #ifdef __APPLE__ 守卫（cpHastySpace.c 中 sysctlbyname 仅 macOS 使用）"
  - "CMake 项目 BUILD_DEMOS=OFF 是鸿蒙平台必需参数，demo 依赖 OpenGL 不可用"
  - "chipmunk-physics.net 下载 URL 存在 SSL 证书和 404 问题，需从 GitHub slembcke/Chipmunk2D 获取源码"
  - "Chipmunk 是纯 C 库无 C++ 依赖，无 pkg-config 文件生成（CMake 项目特性）"

patch_generation:
