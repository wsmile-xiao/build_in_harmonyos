  source_orig_dir: /storage/Users/currentUser/tmp/builds/chipmunk-physics-7.0.3.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/chipmunk-physics-7.0.3.work
  source_orig_hash: f26df2ac65726737
  source_work_hash: af649af8657a573e
  generated_at: '2026-06-18T18:25:17'
  patches_count: 1

patch_classification:
  - file: 0001-src-cpHastySpace.c.patch
    type: platform_compat
    platform_only: True
    guard: '#ifdef __APPLE__'
    description: "守卫 sys/sysctl.h 包含，该头文件仅在 macOS/BSD 可用"
