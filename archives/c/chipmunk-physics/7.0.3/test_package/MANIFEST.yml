# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: chipmunk-physics/7.0.3
homepage: "https://chipmunk2d.net"

# 上游无自动化测试套件：源码树仅 demo/（需要 GLUT 的交互演示，非测试），
# 无 check/test 目标与 tests/ 目录（R51 清点证据见 notes.md）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.c
    description: "消费者测试：真实物理模拟——小球在重力下落到地面线段，断言落弹并静止于半径高度、无水平漂移（调用 cpSpace/cpBody/cpShape 全套 API）"
    command: "ctest（conan create 自动执行，1/1 passed）"

assertion_count: 3
