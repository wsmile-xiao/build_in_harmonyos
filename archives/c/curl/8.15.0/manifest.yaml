software: curl
version: 8.15.0
category: network
status: built

build_system: cmake
compiler: clang 15.0.4
linker: GNU ld 2.45

dependencies:
  openssl: 1.1.1w
  zlib: 1.3.1

configure_options:
  - CMAKE_INSTALL_PREFIX=$HOME/usr/local
  - CMAKE_BUILD_TYPE=Release
  - CURL_USE_LIBPSL=OFF
  - CURL_USE_NGHTTP2=OFF
  - CURL_USE_LIBSSH2=OFF
  - BUILD_SHARED_LIBS=OFF

features:
  protocols: dict file ftp ftps gopher gophers http https imap imaps ipfs ipns mqtt pop3 pop3s rtsp smb smbs smtp smtps telnet tftp ws wss
  ssl: OpenSSL/1.1.1w
  compression: zlib/1.3.1
  
build_notes:
  - Disabled HAVE_LINUX_TCP_H due to sockaddr_storage redefinition conflict in HarmonyOS headers
  - Used static linking to avoid RPATH issues
  - ELF signed for HarmonyOS execution

artifacts:
  - curl binary (static linked)
  - libcurl.a static library
  - header files

source_url: https://github.com/curl/curl/releases/download/curl-8_15_0/curl-8.15.0.tar.gz
