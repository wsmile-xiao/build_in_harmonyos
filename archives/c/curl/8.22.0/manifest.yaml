# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/8.22.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.22.0"

# 软件名
software: "curl"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/curl/curl/tar.gz/refs/tags/curl-8_22_0"

  # 源码校验和
  sha256: "222c6b5c1f368ac63aed59bce2774eb5def9e8e67e46e800be182e684d2845a3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_CURL_EXE=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_LIBCURL_DOCS=OFF"
    - "-DENABLE_CURL_MANUAL=OFF"
    - "-DCURL_USE_OPENSSL=ON"
    - "-DCURL_ZLIB=ON"
    - "-DCURL_BROTLI=OFF"
    - "-DCURL_ZSTD=OFF"
    - "-DCURL_USE_LIBPSL=OFF"
    - "-DCURL_USE_LIBSSH2=OFF"
    - "-DUSE_NGHTTP2=OFF"
    - "-DUSE_LIBIDN2=OFF"
    - "-DCURL_DISABLE_LDAP=ON"
    - "-DCURL_DISABLE_LDAPS=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.2
    - openssl/3.5.8.1
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "The GitHub codeload tag contains the CMake project but no generated Autotools configure script; use CMakeToolchain for this source form."
  - "The repository OpenSSL package exposes openssl::openssl; curl CMake needs OpenSSL::SSL/Crypto, so FindOpenSSL must be forced with explicit static include/library paths."
  - "CURL_BROTLI and CURL_ZSTD must be disabled explicitly or host libraries are auto-detected and silently widen the target closure."
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
