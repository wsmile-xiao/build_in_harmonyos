version: "1.1"
status: published
build_date: "2026-04-24"

source:
  url: "https://sourceforge.net/projects/cramfs/files/cramfs/1.1/cramfs-1.1.tar.gz"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - zlib
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-GNUmakefile.patch"
  - "0002-configure.patch"
  - "0003-mkcramfs.c.patch"

knowledge_gained:
  - "GNUmakefile 硬编码 gcc，需通过补丁改为 clang"
  - "编译命令: make CC=clang CFLAGS='-fPIC -O2 -W -Wall -I.' LDLIBS='-lz'"
  - "无 make check，手动验证 mkcramfs/cramfsck"
