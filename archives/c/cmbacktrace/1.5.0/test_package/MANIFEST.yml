# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cmbacktrace/1.5.0
homepage: "https://github.com/armink/CmBackTrace"

# 上游无构建系统、无测试框架（source-drop MCU 库；demos/ 为 STM32/FreeRTOS
# 等 MCU 专用工程，tools/addr2line 为 Win32 辅助二进制，均非可运行测试）。
# 已解压源码逐一枚举：cm_backtrace/、demos/、docs/、tools/ 中无任何
# Makefile/CMakeLists/test 脚本/ctest 注册项，故上游测试命令为空。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 自带测试（消费者视角验证，R34 真实 API 调用）
test_package_tests:
  - file: test.c
    description: "通过已安装头文件与静态库调用 cm_backtrace_init/cm_backtrace_firmware_info/cm_backtrace_call_stack 公开 API，验证可编译链接运行"
    command: "./test_cmbacktrace"
