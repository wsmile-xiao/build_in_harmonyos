# conandata.yml — cmbacktrace 1.5.0
sources:
  url: "https://github.com/armink/CmBackTrace/archive/refs/tags/1.5.0.tar.gz"
  sha256: "4a3562d487f4e61d99eaed5d2730d9742e88225f6d6c4697c1a99390e1af2d43"

patches:
  - patch_file: "patches/0001-cmb-cfg-defaults.patch"
    patch_description: "Enable usable defaults in cmb_cfg.h (printf-based cmb_println, bare-metal platform, Cortex-M4 CPU type, English output) so the library compiles out of the box"
    patch_type: "portability"
  - patch_file: "patches/0002-weak-linker-symbols.patch"
    patch_description: "Make the four linker-script symbols (CMB_CSTACK_BLOCK_START/END, CMB_CODE_SECTION_START/END) weak so the library links without a Cortex-M linker script on OHOS aarch64"
    patch_type: "portability"
