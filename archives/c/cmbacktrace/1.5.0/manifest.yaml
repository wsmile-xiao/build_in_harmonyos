# 版本级 manifest — cmbacktrace 1.5.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.0"

# 软件名
software: cmbacktrace

# 编译状态
# published | built | failed | archived
# PR 阶段无上传发布授权：conan-verify + W3 本地 CI 通过但未 conan upload，
# 按 review-memory 规则三状态如实标记为 built；合并 main 后 CI 自动上传并更新为 published
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag tarball）
  url: "https://github.com/armink/CmBackTrace/archive/refs/tags/1.5.0.tar.gz"

  # 源码校验和
  sha256: "4a3562d487f4e61d99eaed5d2730d9742e88225f6d6c4697c1a99390e1af2d43"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（source-drop 单 TU 库，无 configure/make/CMake）
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）— 无外部依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-cmb-cfg-defaults.patch"
  - "0002-weak-linker-symbols.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Cortex-M 故障回溯库是 source-drop 形态：无构建系统，cmb_cfg.h 需用户提供 cmb_println 与 CMB_CPU_PLATFORM_TYPE，直接编译 cm_backtrace.c 即可生成静态库"
  - "cm_backtrace.c 引用的链接脚本符号（CMB_CSTACK_BLOCK_START/END、CMB_CODE_SECTION_START/END）在非 MCU 平台不存在，声明为 __attribute__((weak)) 后可链接，消费方定义真实栈/代码边界即覆盖"
  - "Cortex-M 内联汇编（MRS msp/psp）在 aarch64 上仅有宽度警告不阻断编译；BL/BLX 反汇编检查与 NVIC 寄存器读取为 MCU 语义，OHOS 上调用栈回溯返回 0 深度属预期"
