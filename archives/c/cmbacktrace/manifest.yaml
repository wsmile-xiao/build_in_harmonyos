software: cmbacktrace
display: "CmBackTrace"
description: "Cortex-M 故障回溯库：故障诊断、断言与调用栈回溯（ARM Cortex-M 内核异常处理）"
category: debug
homepage: "https://github.com/armink/CmBackTrace"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "source-drop 单 TU 库：上游无 configure/make/CMake，直接编译 cm_backtrace.c 生成静态库"
    - "cmb_cfg.h 需配置 cmb_println 与 CMB_CPU_PLATFORM_TYPE（补丁 0001 提供 printf 默认）"
    - "链接脚本符号（CMB_CSTACK_BLOCK_START/END 等）声明为 weak 以便非 MCU 平台链接（补丁 0002）"
  common_dependencies: []

versions:
  "1.5.0":
    status: built
    build_date: "2026-09-19"
    published_as: cmbacktrace
    source_url: "https://github.com/armink/CmBackTrace/archive/refs/tags/1.5.0.tar.gz"
