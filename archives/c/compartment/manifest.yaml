software: compartment
display: "compartment"
description: "Linux process isolation toolkit with Landlock and seccomp sandboxing"
category: system
homepage: "https://github.com/nmicic/compartment"
license: Apache-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "Only the zero-dependency core tools are built (compartment-user and compartment-root); the optional compartment-bpf module is skipped because it requires clang with libbpf, bpftool, libsodium, BTF and a 6.6+ kernel with BPF LSM."
    - "Upstream Makefile is driven with the Conan-provided CC and -j1; install uses PREFIX with DESTDIR into the Conan package."
    - "Upstream test entry is make test-quick (filesystem matrix plus child inheritance); sandbox proxy and Claude smoke suites are out of scope for the offline build."
    - "Binaries are OHOS self-signed after build and install so HongMeng kernel exec is not rejected."
  common_dependencies: []

versions:
  "1.3":
    status: built
    build_date: "2026-09-09"
