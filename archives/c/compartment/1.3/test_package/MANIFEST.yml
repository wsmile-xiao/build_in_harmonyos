package: compartment/1.3
homepage: "https://github.com/nmicic/compartment"

upstream_check_command: "tests/scripts/run_all.sh --quick"
upstream_test_in_build: true
upstream_test_command: "tests/scripts/run_all.sh --quick"
upstream_tests_exist: true
upstream_test_audit:
  - path: "tests/scripts/run_compartment_user_matrix.sh (FS-ro, FS-rw, combined groups) + tests/scripts/run_child_inheritance_tests.sh (child-Landlock group) + shell-replacement group"
    finding: "5 Landlock enforcement cases excluded from execution set (upstream_total 34 -> executed_set 28): HongMeng Kernel 1.12.0 lacks Landlock (landlock_create_ruleset ENOSYS Function not implemented per preflight WARNING, /sys/kernel/security/landlock absent, no-config-source, fork-safe raw probe LL killed sig=31). Groups genuinely cannot enforce FS restriction here; force-run history (v13/v16/v17) proves converting them to runs only manufactures FAILs. Low-cost补齐 impossible (kernel feature, not vendored dep)."
  - path: "tests/scripts/run_compartment_user_matrix.sh (seccomp deny-list unshare case)"
    finding: "1 seccomp unshare case excluded (same 34->28 set): host outer filter SIGSYS-kills unshare(CLONE_NEWUSER) before inner EPERM (empty output rc=159, container escape defense); other 7 deny-list probes print EPERM so filter installs fine (rawcap INSTALL ok). Only this syscall is outer-blocked. v28 expect_blocked honesty fix proves empty rc=159 must SKIP, not FAIL; healthy hosts run it. Kernel feature, not vendable."
  - path: "tests/scripts/run_all.sh --quick (remaining 28)"
    finding: "Remaining 28 cases execute fully on preflight (matrix + child suites run to summary, 28 passed 0 failed per 2026-09-11 log with falsification HARNESS-CATCHES and capability audit). Counts in HMBS_UPSTREAM_TEST_RESULT use execution set (discovered=28, skipped=0) with excluded=6 reported separately; raw SKIP lines stay visible in log."
upstream_tests:
  - file: tests/scripts/run_compartment_user_matrix.sh
    source: compartment-1.3.0/tests/scripts/run_compartment_user_matrix.sh
    description: "Filesystem, seccomp, env, combined, dry-run, verify, ai-agent, strict, shell-replacement, FD, and profile hardening checks via deny_probe"
    command: "tests/scripts/run_all.sh --quick"
  - file: tests/scripts/run_child_inheritance_tests.sh
    source: compartment-1.3.0/tests/scripts/run_child_inheritance_tests.sh
    description: "Seccomp, Landlock, env, and nested child inheritance checks"
    command: "tests/scripts/run_all.sh --quick"

test_package_tests:
  - file: test_compartment.py
    description: "Execute installed compartment-user and compartment-root binaries with --help and --verify and assert real output content"
    command: "python3 test_compartment.py <compartment-user> <compartment-root>"

assertion_count: 3
