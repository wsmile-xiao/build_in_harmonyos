version: "0.10.5"
software: "clearsilver"
status: "built"
build_date: "2026-09-09"
build_system: "autotools"

source:
  url: "https://github.com/blong42/clearsilver/archive/refs/tags/clearsilver-0.10.5.tar.gz"
  sha256: "20ef8153b4b8e6a0765407e962c9907e9d6cbe6ea03580aa59904af14ad4fa56"
  tar_format: "tar.gz"

build:
  system: "autotools"
  configure_options:
    - "--disable-apache"
    - "--disable-python"
    - "--disable-perl"
    - "--disable-ruby"
    - "--disable-java"
    - "--disable-csharp"
    - "--disable-wdb"
    - "--enable-compression"
  dependencies:
    - "zlib/1.3.1.1"
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "0001-config-guess-ohos.patch"
  - "0002-config-sub-ohos.patch"
  - "0003-clang-variadic-macro-fix.patch"
  - "0004-crc-signed-fix.patch"
  - "0005-fix-dependency-cc.patch"
  - "0006-fix-man-install.patch"

knowledge_gained:
  - "Clearsilver 0.10.5 uses legacy 2001 config.sub/guess; patched for aarch64 OHOS triplet and aarch64 machine detection"
  - "Disabled all language wrappers (python/perl/ruby/java/csharp/apache) to keep OHOS build minimal with only zlib"
  - "Fixed cs_parse_string ownership segfault by strdup template literal; hardened test_package for HMDFS /bin/sh and readonly /tmp via TMPDIR propagation"
  - "Fixed Makefile man3 install guard (0006) line-number mismatch (36->38) and added conanfile fallback _ensure_man_guard for strict patch failure on OHOS"

homepage: "http://www.clearsilver.net"
license: "ClearSilver-1.0"

tests:
  upstream:
    command: "make -C cs test -j1"
    cases: 39
    passed: 39
    note: "cs regression suite (38 CS_TESTS + test_tag) verified 39/39 via make -C cs test on OHOS"
  adapted:
    command: "./test_clearsilver"
    cases: 2
    passed: 2
    pass_rate: "2/2 (100%)"
