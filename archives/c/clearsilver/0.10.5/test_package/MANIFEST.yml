# test_package/MANIFEST.yml
package: clearsilver/0.10.5
homepage: "http://www.clearsilver.net"

upstream_check_command: "make -C cs test"
upstream_test_in_build: true
upstream_test_command: "make -C cs test"

upstream_tests:
  - file: cs/cstest.c
    source: clearsilver-0.10.5.tar.gz/cs/cstest.c
    description: "CS regression harness (cstest binary)"
    command: "./cs/cstest test.hdf test.cs"
  - file: cs/test.cs
    source: clearsilver-0.10.5.tar.gz/cs/test.cs
    description: "Core CS template regression (30+ cases, gold-file diff)"
    command: "make -C cs test"
  - file: cs/test_var.cs
    source: clearsilver-0.10.5.tar.gz/cs/test_var.cs
    description: "Variable substitution test"
    command: "./cs/cstest test.hdf test_var.cs"
  - file: cgi/cgi.c
    source: clearsilver-0.10.5.tar.gz/cgi/cgi.c
    description: "CGI kit smoke (linked via libneo_cgi)"
    command: "./cgi/cgi_cstest (if built)"

test_package_tests:
  - file: test.c
    description: "HDF + CS API smoke: hdf_set_value/hdf_get_value, cs_init/cs_parse_string/cs_render with conditional"
    command: "./test_clearsilver"

assertion_count: 12
