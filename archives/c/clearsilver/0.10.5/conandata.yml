sources:
  - url:
      - "https://gh-proxy.com/https://github.com/blong42/clearsilver/archive/refs/tags/clearsilver-0.10.5.tar.gz"
      - "https://github.com/blong42/clearsilver/archive/refs/tags/clearsilver-0.10.5.tar.gz"
    sha256: "20ef8153b4b8e6a0765407e962c9907e9d6cbe6ea03580aa59904af14ad4fa56"
patches:
  - patch_file: "patches/0001-config-guess-ohos.patch"
    patch_description: "Update config.guess to recognize aarch64 OHOS"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-ohos.patch"
    patch_description: "Update config.sub to handle aarch64-linux-ohos triplet"
    patch_type: "portability"
  - patch_file: "patches/0003-clang-variadic-macro-fix.patch"
    patch_description: "Fix C99 variadic macro trailing comma for clang (nerr_raise with no va_args)"
    patch_type: "portability"
  - patch_file: "patches/0004-crc-signed-fix.patch"
    patch_description: "Fix string.crc signed 32-bit output for LP64 to match gold (int cast)"
    patch_type: "portability"
  - patch_file: "patches/0005-fix-dependency-cc.patch"
    patch_description: "Fix hard-coded gcc in dependency generation for OHOS clang (CC)"
    patch_type: "portability"
  - patch_file: "patches/0006-fix-man-install.patch"
    patch_description: "Guard man page install when man3 empty to avoid install abort breaking header install"
    patch_type: "portability"
