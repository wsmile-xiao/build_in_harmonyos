software: charls
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.4.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4.3"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/team-charls/charls/archive/refs/tags/2.4.3.tar.gz"

  # 源码校验和
  sha256: "bbf67d51446a98eb8fc98c9c6de49a2605c709d3a14ba39f09a09f8e57527099"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DBUILD_SHARED_LIBS=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cmake 项目需设置 CMAKE_SYSTEM_NAME=Linux 绕过平台检测"
  - "G0 clean-verify 对 cmake 项目存在已知限制（无 ./configure 脚本）"
  - "verify_build.py G4 检查顶级 build_system 字段而非嵌套 build.system"
  - "SSL 下载失败时可用 curl -k 手动下载 + --no-download 模式初始化"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
