# conandata.yml — collections-c 2.3.3
# Source: official upstream srdja/Collections-C (GitHub).
# Upstream publishes no release assets and no git tags; source is pinned to the
# official master HEAD commit dbedaf9599716c9aa16c6e955fdc3ef76d5c5cca via the
# GitHub codeload archive endpoint (official HTTPS source host).

sources:
  url: "https://codeload.github.com/srdja/Collections-C/tar.gz/dbedaf9599716c9aa16c6e955fdc3ef76d5c5cca"
  # codeload URL 末段无 .tar.gz 扩展名，conan get() 默认按 zip 解压导致 BadZipFile；
  # 显式指定 filename 让 unzip 按 tar.gz 处理（URL 与 SHA-256 均未改变）。
  filename: "collections-c-2.3.3.tar.gz"
  sha256: "045b6509493c9c4dbb4578800de497c3ad8154545c41fbb3a774d50f0a832600"

patches:
  - patch_file: "patches/0001-src-memory-cc_dynamic_pool.c.patch"
    patch_description: "0001 fix cc_dynamic_pool alignment: naive `size % boundary` padding never guarantees aligned blocks; round free_ptr up to the configured alignment boundary"
    patch_type: "portability"

