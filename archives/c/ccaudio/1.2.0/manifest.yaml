# 版本级 manifest — ccaudio 1.2.0
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.2.0"

# 软件名
software: ccaudio

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/ccaudio/ccaudio-1.2.0.tar.gz"

  # 源码校验和
  sha256: "6805fe04a3281fbcc66d247f63f6def5db042c7cf55fd7a5b3b783de4999c387"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--prefix=/usr"
    - "--disable-shared"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - commoncpp2/1.8.1
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（配方内联处理——无独立补丁文件）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - category: L1
    content: "GNU 老包族（ccaudio 1.2.0）头文件使用 CCXX_CLASS_EXPORT 宏（commoncpp2 后期版本引入），而可用的 commoncpp2/1.8.1 只提供 __EXPORT——需补等价 fallback（#ifndef CCXX_CLASS_EXPORT/#define CCXX_CLASS_EXPORT __EXPORT），补在头文件保护宏之后随 make install 进包，消费者无需额外 -D"
    reason: "ccaudio 编译实测：'forward declaration of ost::CCXX_CLASS_EXPORT' 报错 20 处"
  - category: L1
    content: "libtool .la 不可重定位问题：conan 包内 .la 的 dependency_libs 记录构建期绝对路径（含 /usr/lib/libccgnu2.la 与已失效的 conan 缓存路径），libtool 报 'is not a valid libtool archive'。处置：把依赖 *.la/*.a 复制到构建目录并清空 dependency_libs（链路依赖由本配方 LDFLAGS/LIBS 显式提供），不改 conan 缓存中的依赖包本体"
    reason: "ccaudio 链接实测（libccext2.la 的 dependency_libs 含 /usr/lib/libccgnu2.la）"
  - category: L1
    content: "ccgnu2-config（commoncpp2 安装的探测脚本）内 prefix 硬编码 /usr——其 --flags/--stdlibs 输出的 -I/-L 指向系统目录，不能用于 conan 包。configure 仅需在 PATH 中找到它通过版本检查；真实 -I/-L 必须由 CXXFLAGS/LDFLAGS 显式给出并放在其追加内容之前"
    reason: "ccaudio configure 探测机制实测（AC_PATH_PROG(CCGNU2_CONFIG, ccgnu2-config)）"
  - category: L1
    content: "手动 configure 配方必须在 generate() 阶段调 AutotoolsToolchain(self).generate()——否则 conanbuild 环境无 CC/CXX，2006 版 configure 的编译器候选列表（g++/c++/gpp/...）不含 clang++，报 'C++ compiler cannot create executables'"
    reason: "ccaudio 首轮构建实测（同 SKILL gnuchess 案例）"
  - category: L1
    content: "musl 不隐式传递头文件：audiofile.cpp 用 struct stat/read/write 但只 include 框架头（老 glibc 间接提供）——musl 下报 incomplete type 'struct stat'，需补 #include <sys/stat.h>/<unistd.h>/<string.h>"
    reason: "ccaudio 编译实测（audiofile.cpp:748）"
  - category: L1
    content: "config.status 的 mktemp 相对路径（./confstatXXXXXX）在 HMDFS 沙箱构建目录下不可写——TMPDIR 指可写目录 + 模板改 ${TMPDIR}/confstatXXXXXX（同 commoncpp2/dpkg 经验）"
    reason: "ccaudio configure 实测（同族先例）"
