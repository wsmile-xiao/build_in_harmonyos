# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ccaudio/1.2.0
homepage: "https://www.gnu.org/software/ccaudio/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true

upstream_tests:
  - name: "src/wavetest1（automake TESTS 注册项，make check 执行）"
    count: "1"
    description: "上游真实行为测试：用 AudioFile 写入 pcm16Stereo RIFF wav（44100Hz）后按字节逐一比对 43 字节文件头；退出码 0=通过"
  - name: "src/wavetest2（noinst_PROGRAMS，未注册 TESTS——build() 内手动运行）"
    count: "1"
    description: "上游真实行为测试：mulaw 格式 wav 写入后比对 54 字节文件头；退出码 0=通过"

test_package_tests:
  - file: smoke.cpp
    description: "R34：以库使用者身份真实调用公开 API——AudioFile 写 RIFF wav 并读回校验头部魔数（编译+链接+运行+退出码）"
    command: "python3 test_ccaudio.py <ccaudio_pkg> <commoncpp2_pkg> <zlib_pkg>"
