# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cxxgraph/4.1.0
homepage: "https://github.com/ZigRazor/CXXGraph"

# 上游测试命令 (探究编译实测: 单 test_exe 可执行文件, gtest 302 声明/301 注册)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./test_exe"

# 上游实际运行的测试程序（同一份 302 声明用例，301 注册，1 个位于注释块未实例化）
upstream_tests:
  - file: test/BFSTest.cpp
    source: CXXGraph-4.1.0/test/BFSTest.cpp
    description: "上游 gtest 用例 13 个（BFS 图搜索）"
    command: "./test_exe"
  - file: test/DijkstraTest.cpp
    source: CXXGraph-4.1.0/test/DijkstraTest.cpp
    description: "上游 gtest 用例 30 个（含 DijkstraDeterministic 两套）"
    command: "./test_exe"
  - file: test/GraphTest.cpp
    source: CXXGraph-4.1.0/test/GraphTest.cpp
    description: "上游 gtest 用例 49 个（图核心操作：add/get/is 系列）"
    command: "./test_exe"
  - file: test/RWOutputTest.cpp
    source: CXXGraph-4.1.0/test/RWOutputTest.cpp
    description: "上游 gtest 用例 29 个（读写输出格式 CSV/OUT_1/压缩）"
    command: "./test_exe"
  - file: test/ConnectivityTest.cpp
    source: CXXGraph-4.1.0/test/ConnectivityTest.cpp
    description: "上游 gtest 用例 8 个，其中 test_5 位于注释块（上游 addNode 未实现）未实例化，7 个注册并运行"
    command: "./test_exe"
  - file: test/[其余 29 个 TEST 文件]
    source: CXXGraph-4.1.0/test/
    description: "其余 29 个独立 TEST 文件（Edge/Node/搜索/最小生成树/拓扑/着色等）共 187 个用例"
    command: "./test_exe"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：通过 Conan 包消费 CXXGraph.hpp 公开 API，构建有向带权图并运行 Dijkstra 验证最短距离"
    command: "./test_cxxgraph"

# 测试断言总数 (上游注册 301 + test_package 消费者断言)
assertion_count: 301