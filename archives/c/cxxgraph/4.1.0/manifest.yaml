# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.1.0"

# 软件名
software: "cxxgraph"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ZigRazor/CXXGraph/archive/refs/tags/v4.1.0.tar.gz"

  # 源码校验和
  sha256: "1f6601abfcb692f35bfe14f2a34b2302f70213a257b0f7d541a110d6bd460040"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 不识别 OHOS 目标平台：generate() 中设置 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64（E092）"
  - "上游 test/CMakeLists.txt 通过 CPM 拉 googletest(zlib，CI 无法直连 github：conandata 预下载本地源码 + patches/0001-use-local-gtest-zlib.patch 让 CPM 优先 SOURCE_DIR"
  - "顶层 CMakeLists 配置期直连 GitHub 下载 CPM.cmake：build() 预下载到 build_folder/cpm/cpm/CPM.cmake 并注入 CPM_SOURCE_CACHE"
  - "上游 zlib 依赖 cmake_minimum_required(<3.5)，现代 CMake 移除兼容：CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "header-only 库：package_type=header-library、cpp_info.libs=[]、仅交付 include/"
  - "上游测试 302 个 TEST 声明，301 个注册（ConnectivityTest.test_5 位于注释块未实例化），test_exe 全量 301/301 通过"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
