# conandata.yml — cxxgraph 4.1.0
# 官方源：https://github.com/ZigRazor/CXXGraph （MIT，header-only C++ 图算法库）

sources:
  url:
    - "https://github.com/ZigRazor/CXXGraph/archive/refs/tags/v4.1.0.tar.gz"
  sha256: "1f6601abfcb692f35bfe14f2a34b2302f70213a257b0f7d541a110d6bd460040"

# googletest 源码（上游 test/CMakeLists.txt 通过 CPM 以 GIT_TAG origin/main 拉取，
# CI worker 无法直连 github.com，故在 build() 阶段预下载本地源码，
# 配合 patches/0001-use-local-gtest-zlib.patch 让 CPM 优先使用本地 SOURCE_DIR）
gtest_sources:
  url:
    - "https://github.com/google/googletest/archive/refs/tags/v1.17.0.tar.gz"
  sha256: "65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c"

# zlib 源码（上游 test/CMakeLists.txt 通过 CPM 拉取 zlib 1.2.13，同样本地化）
zlib_sources:
  url:
    - "https://github.com/madler/zlib/archive/refs/tags/v1.2.13.tar.gz"
  sha256: "1525952a0a567581792613a9723333d7f8cc20b87a81f920fb8bc7e3f2251428"

# CPM.cmake 引导脚本（顶层 CMakeLists.txt 在 configure 期直连 GitHub 下载，
# CI worker 网络受限，故在 build() 阶段预下载并放到 CPM_SOURCE_CACHE）
cpm_source:
  url:
    - "https://github.com/cpm-cmake/CPM.cmake/releases/download/v0.40.2/CPM.cmake"
  sha256: "c8cdc32c03816538ce22781ed72964dc864b2a34a310d3b7104812a5ca2d835d"

patches:
  - patch_file: "patches/0001-use-local-gtest-zlib.patch"
    patch_description: "Use local gtest/zlib sources via CXXGRAPH_GTEST_SOURCE_DIR / CXXGRAPH_ZLIB_SOURCE_DIR if defined, fallback to CPM fetch"
    patch_type: "portability"
