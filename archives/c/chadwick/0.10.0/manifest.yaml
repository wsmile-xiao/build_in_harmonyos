# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "config.guess/config.sub 需替换为 automake-1.17 版本以支持 HarmonyOS 平台检测"
  - "umask 077 在 HMDFS 上会创建 SGID 目录导致写入失败，需改为 umask 022"
  - "autoreconf -fi 可修复 automake 版本不匹配问题"
  - "Conan build 中 self.run() 需使用绝对路径(self.source_folder)而非相对路径"
  - "终端工具需 --enable-static --disable-shared + -static 实现静态链接"

