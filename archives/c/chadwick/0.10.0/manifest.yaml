software: chadwick
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.10.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10.0"

# 编译状态
# published | built | failed | archived
status: built

# Conan 引用
conan_ref: "chadwick/0.10.0@ohpcd/stable"

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/chadwickbureau/chadwick/releases/download/v0.10.0/chadwick-0.10.0.tar.gz"

  # 源码校验和
  sha256: "a4128934286edf5f9938923aad2000f7549dcccfb3b3f149a417534ef7eb29e9"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

