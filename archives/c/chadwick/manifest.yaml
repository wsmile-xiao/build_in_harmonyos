software: chadwick
display: "Chadwick Baseball Tools"
description: "棒球计分和记分工具集，提供 Retrosheet 格式的棒球比赛数据解析和处理功能"
category: data
homepage: "https://github.com/chadwickbureau/chadwick"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需替换为 automake-1.17 版本以支持 HarmonyOS 平台检测"
    - "umask 077 需改为 umask 022，避免 HMDFS SGID 目录权限问题"
    - "需运行 autoreconf -fi 重新生成构建系统文件"
    - "终端工具需静态链接（R26）"
  common_dependencies: []

versions:
  "0.10.0":
    status: built
    build_date: "2026-06-26"
    conan_ref: "chadwick/0.10.0@ohpcd/stable"
    source_url: "https://github.com/chadwickbureau/chadwick/releases/download/v0.10.0/chadwick-0.10.0.tar.gz"
