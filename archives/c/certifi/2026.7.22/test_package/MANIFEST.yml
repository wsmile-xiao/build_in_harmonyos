# test_package/MANIFEST.yml — certifi 2026.7.22
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: certifi/2026.7.22
homepage: "https://github.com/certifi/python-certifi"

# 上游测试套件：certifi/tests/test_certify.py（pytest 套件，certifi 零依赖）
upstream_check_command: "pytest certifi/tests/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: certifi/tests/
    source: certifi-2026.7.22/certifi/tests/*.py
    description: "pytest 套件：本地实测 3/3（100%），零失败"
    command: "pytest certifi/tests/"

# test_package 消费者测试（R34 真实 API：import 打包的 certifi + where() 读 CA bundle）
test_package_tests:
  - file: test_certifi.py
    description: "Imports packaged certifi and reads the real CA bundle via where(), asserting BEGIN CERTIFICATE content"
    command: "python3 test_certifi.py"

# 断言总数：1（CA bundle 内容校验）
assertion_count: 1
