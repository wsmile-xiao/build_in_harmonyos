# 软件级 manifest
# 文件位置: archives/c/cyrus-sasl-sql/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: cyrus-sasl-sql

# 显示名
display: "Cyrus SASL SQL auxprop plugin"

# 一句话描述
description: "Cyrus SASL SQL auxiliary property plugin (libsasl2 with SQL/SQLite3 auxprop support)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: security

# 官网 URL
homepage: "https://www.cyrusimap.org/sasl/"

# 开源许可证（SPDX 标识）
license: BSD-Attribution-HPND-disclaimer

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "SQL 是 auxprop 插件（plugins/sql.c，1385 行），与认证机制不同：它在 libsasl2 内提供 auxprop_plugin='sql' 的数据查询能力"
    - "上游有 STATIC_SQL（configure.ac AC_DEFINE + lib/staticopen.h:126/181 已注册 SPECIFIC_AUXPROP_PLUG_INIT(sql,\"SQL\")），可静态链入 libsasl2，无需静态 dlopen"
    - "configure 的 --enable-sql 要求 mysql/pgsql/sqlite/sqlite3 四者至少其一，否则 AC_MSG_ERROR 硬失败；本包只启用 SQLite3（内嵌、无服务器，可在 CI 真实初始化）"
    - "sqlite3 探测走 --with-sqlite3=<prefix>，configure 检查 <prefix>/lib/libsqlite3.a 并追加 -lsqlite3 与 -I<prefix>/include"
    - "沿用 cyrus-sasl 族的三个 OHOS 补丁：configure tempdir umask、lib/Makefile.in 的 ln -s 改 cp -pR、testsuite getopt int"
    - "沿用族内 OHOS 构建方式：CC_FOR_BUILD=clang（OHOS 无 gcc/cc）、TMPDIR 指向源码树内 tmp、install-sh 经 MKDIR_P/INSTALL 变量注入"

  # 跨版本通用依赖
  common_dependencies:
    - sqlite3/3.53.4

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.1.28":
    status: built
    build_date: "2026-09-13"
    conan_ref: "cyrus-sasl-sql/2.1.28"
    note: "SQL/SQLite3 auxprop 首个适配版本；待真机验证通过后标 published"
