package: cyrus-sasl-sql/2.1.28
homepage: "https://www.cyrusimap.org/sasl/"

upstream_test_in_build: false

upstream_tests: []

test_package_tests:
  - file: test_cyrus_sasl_sql.c
    description: >-
      R34 消费者验证：链接静态 libsasl2 + libsqlite3，断言 SQL auxprop
      插件真实注册。正向：auxprop_plugin='sql' 时 sasl_auxprop_store()
      返回 SASL_OK（upstream lib/auxprop.c 在 total_plugins==0 时返回
      SASL_FAIL 并打印 "could not find auxprop plugin"）。阴性对照：
      同名机制下改用未注册的 auxprop_plugin 名必须返回非 SASL_OK，
      以证明该断言非恒真。另含版本查询、server init、conn 创建、
      sasl_auxprop_request/getctx 属性上下文检查。
    command: "./test_cyrus_sasl_sql"

assertion_count: 9
