# 版本级 manifest
# 文件位置: archives/c/cyrus-sasl-sql/2.1.28/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.28"

# 软件名
software: "cyrus-sasl-sql"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-13"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 cyrus-sasl 2.1.28 同源：SQL auxprop 是上游源码内 plugins/sql.c）
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"

  # 源码校验和
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（SQL/SQLite3 专用最小闭包：只开 SQL auxprop + SQLite3，
  # 机制侧与其余后端全部关闭；静态库形式，SQL 随 libsasl2.a 静态交付）
  configure_options:
    - "--enable-sql"
    - "--with-sqlite3=<sqlite3 package root>"
    - "--disable-shared"
    - "--enable-static"
    - "--with-staticsasl"
    - "--without-mysql"
    - "--without-pgsql"
    - "--without-sqlite"
    - "--disable-auth-sasldb"
    - "--with-dblib=none"
    - "--without-saslauthd"
    - "--disable-sample"
    - "--disable-staticdlopen"
    - "--disable-gssapi"
    - "--disable-ldapdb"
    - "--disable-login"
    - "--disable-ntlm"
    - "--disable-otp"
    - "--disable-srp"
    - "--without-openssl"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sqlite3/3.53.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure-ohos-tempdir.patch"
  - "0002-lib-Makefile.in-copy-linksrcs.patch"
  - "0003-testsuite-use-int-for-getopt.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "SQL 属 auxprop 插件（plugins/sql.c）而非认证机制：为 auxprop_plugin='sql' 提供数据库查询，不参与 SASL 机制协商"
  - "上游有 STATIC_SQL（configure.ac 在 --enable-sql 且 --enable-static 时 AC_DEFINE，lib/staticopen.h:126/181 已注册 SPECIFIC_AUXPROP_PLUG_INIT(sql,\"SQL\")），可静态链入 libsasl2.a——与族内 GS2 不同（上游无 STATIC_GS2，只能共享插件）"
  - "configure 的 --enable-sql 要求 mysql/pgsql/sqlite/sqlite3 至少其一，否则 AC_MSG_ERROR 硬失败；本包以 SQLite3 满足（内嵌、无服务器，CI 可真实初始化）"
  - "--with-sqlite3=PATH 接受包根目录：configure 依次探测 <root>/lib/libsqlite3.a 与 <root>/libsqlite3.a，命中后追加 -lsqlite3 并注入 -I<root>/include"
  - "静态构建下 SQL 的 .o 进入 SASL_STATIC_SRCS/SASL_STATIC_OBJS（并 AC_DEFINE STATIC_SQL），但 libsql.la 共享模块的 LIB_SQLITE3 仅用于 --enable-shared，静态路径不含它——sqlite3 链接由消费者侧 -lsqlite3 承担"
  - "lib/Makefile 通过 linksrcs 目标把 plugins/*.c 符号链接进 lib/ 再编译；HMDFS 不服务这些符号链接，需以 cp -pR 替代并预拷 plugins/sql.c → lib/sql.c"
  - "上游 utils/testsuite.c 不覆盖 SQL（仅在 auxprop_plugin 字符串处出现），故上游测试无法验证 SQL 后端，验证只能由消费者测试承担"
  - "★ --with-staticsasl 会强制 enable_shared=yes（configure.ac:104-107，即使命令行传了 --disable-shared），故包内同时有 libsasl2.a 与 libsasl2.so；消费者默认链接 .so，而 .so 是用 DO_DLOPEN 构建的——其 _sasl_static_plugins 静态注册表不存在（实测 .so 中该符号=0，.a 中=1），插件只能经 dlopen 从搜索路径加载"
  - "★ 不设 SASL_PATH 时 auxprop 列表为空：表现为连 auxprop_plugin='sql' 都解析不到——正向断言失败、而阴性对照（未注册插件被拒）反而\"通过\"（因列表整体为空，任何名字都找不到）。此为该类断言的通用判别特征"
  - "★ 修法：package_info() 里 runenv_info.append_path('SASL_PATH', '<pkg>/lib/sasl2')。SASL_PATH 是上游既有机制（lib/common.c 的 SASL_PATH_ENV_VAR）。实测不设 8/9（正向 FAIL），设后 9/9 全过"
