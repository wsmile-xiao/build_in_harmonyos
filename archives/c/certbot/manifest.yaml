software: certbot
# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 显示名称
display: "Certbot - ACME Client"

# 软件描述
description: "Certbot is EFF's tool to obtain certs from Let's Encrypt and (optionally) auto-enable HTTPS on your server. It can also act as a client for any other CA that uses the ACME protocol."

# 分类（用于批量编译顺序）
# foundation | toolchain | compress | ssl | db | network | advanced | doc
category: network

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表（按时间倒序）
versions:
  - version: "5.1.0"
    status: published
    build_date: "2026-05-19"
    tarball: "certbot-5.1.0-ohos-aarch64.tar.gz"
    size_mb: 8.1

# ============================================================
# 软件特性
# ============================================================

# 构建系统类型
# cmake | autotools | makefile | meson | custom | pip
build_system: pip

# 是否建议静态编译
static_build: false

# 已知鸿蒙适配问题
known_issues:
  - "纯 Python 包，使用 pip 安装方式"
  - "需要 --break-system-packages 标志（PEP 668）"
  - "依赖较多 Python 包（约 16 个）"

# ============================================================
# 外部链接
# ============================================================

# 官方网站
homepage: "https://certbot.eff.org/"

# GitHub 仓库
github: "https://github.com/certbot/certbot"

# PyPI 页面
pypi: "https://pypi.org/project/certbot/"