software: certbot
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.1.0"

# 构建系统类型
# cmake | autotools | makefile | meson | custom | pip
build_system: pip

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-19"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/source/c/certbot/certbot-5.1.0.tar.gz"

  # 源码校验和
  sha256: "d652a598f67af78ecf122860e85cd2e9c19a2bbe79a71775eccf6e8d642a4fca"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | pip
  system: pip

  # 配置选项列表
  configure_options:
    - "--break-system-packages"
    - "--root=$TEST_PREFIX"
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "python3/3.14"
    - "acme/5.6.0"
    - "ConfigArgParse/1.7.5"
    - "configobj/5.0.9"
    - "cryptography/48.0.0"
    - "distro/1.9.0"
    - "josepy/2.2.0"
    - "parsedatetime/2.6"
    - "pyrfc3339/2.1.0"
    - "PyOpenSSL/26.2.0"
    - "requests/2.34.2"
    - "cffi/2.0.0"
    - "pycparser/3.0"
    - "charset_normalizer/3.4.7"
    - "idna/3.15"
    - "urllib3/2.7.0"
    - "certifi/2026.4.22"

  # 编译器（Python 包不需要）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（纯 Python 包，无需补丁）
patches_applied: []
patches_count: 0

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "certbot 是纯 Python 包，使用 pip 安装方式"
  - "pip 需要使用 --break-system-packages 标志（PEP 668）"
  - "依赖 acme>=5.1.0，实际安装 acme-5.6.0（版本兼容）"
  - "staging 目录包含 967 个文件（包括所有 Python 依赖）"
  - "预编译包大小: 8.1MB"

# ============================================================
# 打包信息
# ============================================================

packaging:
  # 预编译包文件名
  tarball: "certbot-5.1.0-ohos-aarch64.tar.gz"
  
  # 包大小（MB）
  size_mb: 8.1
  
  # 包含文件数
  file_count: 967
  
  # 特殊说明
  notes: "纯 Python 包，无需 ELF 签名。包含所有 Python 依赖。"

# 补丁分类（无补丁）
patch_classification: []
