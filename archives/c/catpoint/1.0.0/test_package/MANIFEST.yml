# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: catpoint/1.0.0
homepage: "https://git.2f30.org/catpoint"

# 上游测试命令 — catpoint 上游无独立 CI 单元测试套件（终端演示工具，
# 验证 = make 构建 + 运行 -h 帮助输出）
upstream_check_command: "make"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-21 实测记录）：
# - 上游无独立测试套件（无 make test 入口；git://r-36.net/catpoint 仓库
#   仅含 catpoint.c/Makefile/man page）
# - 构建验证：make（CC=clang + LDFLAGS -lncursesw）生成 catpoint 二进制
# - 消费者验证（test_package）：运行 catpoint -h 输出用法（R34）——
#   实测通过（2026-08-21）
upstream_tests: []
