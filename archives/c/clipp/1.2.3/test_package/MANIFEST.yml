# test_package/MANIFEST.yml — clipp 1.2.3

package: clipp/1.2.3
homepage: "https://github.com/muellan/clipp"

# 上游测试命令（上游用 Makefile/run_tests.py 逐个编译并运行 test/*.cpp，
# 每个 test .cpp 为独立可执行程序，无 CMake 构建系统）
upstream_check_command: "cd test && ./run_tests.py 或逐个编译 g++ -I include -std=c++11 test/*.cpp"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（39 个独立测试可执行，本机 OHOS aarch64 clang-15 实测 38/39 通过）
upstream_tests:
  - file: test/actions_test.cpp
    description: "action 回调触发测试"
  - file: test/alternative_groups_test.cpp
    description: "备选组测试"
  - file: test/alternative_options_test.cpp
    description: "备选选项测试"
  - file: test/alternative_required_test.cpp
    description: "备选必填参数测试"
  - file: test/blocking_test01.cpp .. blocking_test10.cpp
    description: "blocking 语义 10 项测试"
  - file: test/documentation_test.cpp
    description: "文档/帮助文本测试"
  - file: test/empty_args.cpp
    description: "空参数测试"
  - file: test/flag_param_factories_test.cpp
    description: "flag 参数工厂测试"
  - file: test/joined_flags_test1.cpp .. joined_flags_test6.cpp
    description: "拼接 flag 解析 6 项测试"
  - file: test/joined_params_test1.cpp .. joined_params_test2.cpp
    description: "拼接参数 2 项测试"
  - file: test/joined_sequence_test.cpp
    description: "拼接序列测试"
  - file: test/mixed_params_test.cpp
    description: "混合参数测试"
  - file: test/nesting_test.cpp
    description: "嵌套分组测试"
  - file: test/options_test.cpp
    description: "选项测试"
  - file: test/prefix_free_test.cpp
    description: "无前缀自由测试"
  - file: test/prefix_test.cpp
    description: "前缀测试"
  - file: test/repeatability_test.cpp
    description: "可重复性测试"
  - file: test/repeatable_alternatives_test.cpp
    description: "可重复备选测试"
  - file: test/required_params_test1.cpp .. required_params_test2.cpp
    description: "必填参数 2 项测试"
  - file: test/usage_lines_test.cpp
    description: "usage 行测试"
  - file: test/values_conversion_test.cpp
    description: "值转换测试 — OHOS aarch64 上 1 项失败（char 为无符号，上游假定有符号）"
  - file: test/values_filter_test.cpp
    description: "值过滤测试"
  - file: test/values_sequencing_test.cpp
    description: "值排序测试"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "消费者测试 — clipp::parse 解析 argv 并校验结果"
    command: "./test_clipp"
  - file: ohos_special_test.cpp
    description: "HarmonyOS 专项测试 — __OHOS__ 平台校验（小端/char 符号性）+ clipp 解析路径"
    command: "./test_ohos_special"

# 上游 39 个独立测试可执行中 38 个通过、1 个失败（values_conversion_test
# 的 char '-128' 用例：OHOS aarch64 默认无符号 char，属平台 ABI 语义差异，
# 非 clipp 缺陷；未修改上游测试）。
upstream_summary: "39 独立测试可执行，38 通过 / 1 平台语义差异未过，通过率 38/39=97.4%"
