software: clipp
display: "clipp — command line interfaces for modern C++"
description: "单头文件 C++11 命令行参数解析库，提供 option/value/group/嵌套分组/自动帮助页等能力，MIT 许可"
category: foundation
homepage: "https://github.com/muellan/clipp"
license: "MIT"
build_system: custom

ohos_adaptation:
  key_points:
    - "Header-only 单头文件库（include/clipp.h），无独立构建系统"
    - "Conan 配方仅打包头文件，无需编译步骤"
    - "支持 C++11 及以上标准"
    - "无外部依赖"
  common_dependencies: []

versions:
  "1.2.3":
    status: built
    build_date: "2026-09-05"
    source_url: "https://github.com/muellan/clipp/archive/refs/tags/v1.2.3.tar.gz"
