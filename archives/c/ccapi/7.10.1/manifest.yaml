# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建系统标识（verify-build 要求）
  build_system: cmake

  # 配置选项列表（header-only——无编译）
  configure_options: []

