software: ccapi
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/7.10.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游最新 tag v7.10.1——清单 1.0.0 与上游不一致，按用户指示用真实版本）
version: "7.10.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-24"

# 构建系统标识（verify-build 要求）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（crypto-chassis/ccapi tag v7.10.1 codeload）
  url: "https://codeload.github.com/crypto-chassis/ccapi/tar.gz/refs/tags/v7.10.1"

  # 源码校验和
  sha256: "653e933b235e66f3db99730861ab6f92cf2ec11412a17a76407526da6fd853fe"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
