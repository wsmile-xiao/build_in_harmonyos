software: chezscheme
version: "10.3.0"
status: built
build_date: "2026-05-21"

source:
  url: "https://github.com/cisco/chezscheme/archive/refs/tags/v10.3.0.tar.gz"
  sha256: "9cf181cfb1f3e688da86f2698398566adf89ff7a5bb52ab538f1f7ec968405d8"
  tar_format: tar.gz
  note: "GitHub tarball不含子模块内容（zuo/nanopass/lz4/zlib/stex），需手动补全精确commit版本"

build:
  system: custom
  description: "Chez Scheme自举编译系统，使用pb（portable bytecode）petit bootstrap方式构建"
  configure_options:
    - "--pbarch"
    - "--disable-curses"
    - "--disable-x11"
    - "--as-is"
    - "--installprefix=/storage/Users/currentUser/usr/local"
  extra_configure_vars:
    - "CC=clang"
    - "CFLAGS=-fPIC -O2"
    - "LDFLAGS=-fPIC"
  machine_type: "tpb64l"
  machine_flag: "tunknown"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-makefiles-install.zuo.patch"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/chezscheme-10.3.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/chezscheme-10.3.0.work
  source_orig_hash: a84e1da8b3b4b895
  source_work_hash: f5a07f8f92ccf262
  generated_at: '2026-05-21T21:54:53'
  patches_count: 1

patch_classification:
  - file: 0001-makefiles-install.zuo.patch
    type: platform_adaptation
    platform_only: true
    guard: "HMDFS_no_hard_links"
    description: "将install.zuo中ln -f硬链接改为cp拷贝，适配不支持硬链接的文件系统"

knowledge_gained:
  - "Chez Scheme是自举编译器，使用--pbarch可构建portable bytecode版本"
  - "GitHub tarball不含子模块，需从codeload.github.com下载精确commit版本"
  - "nanopass必须使用精确commit版本，tagged release v1.9与v10.3.0不兼容"
  - "HMDFS文件系统不支持硬链接(ln -f)，需用cp替代"
  - "tpb64l机器类型(threaded pb 64-bit LE on unknown)可在aarch64/OHOS上运行"

package:
  file: chezscheme-10.3.0-aarch64-tpb64l.tar.gz
  sha256: "22658fad333fe078888b94b5eadd78db3bce0423ab378a12f707d706040e6698"
  size: "9.3M"
  path_prefix: "usr/local"
  description: "Chez Scheme 10.3.0 预编译包 (aarch64, tpb64l, 解引用符号链接)"

