# test_package/MANIFEST.yml
# clove-unit 2.4.6 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: clove-unit/2.4.6
homepage: "https://github.com/fdefelici/clove-unit"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
# 上游 CI（.github/workflows/ci_action.yml）两条 job 线：
#   build_{windows,macos,ubuntu} → cmake -DCLOVE_CMAKE__UC_BUILD=ON  → ctest 1 条命令
#   sanity_check                 → cmake -DCLOVE_CMAKE__UC_SANITY=ON → ctest 12 条命令
# 本配方在同一次 configure 里同时打开两个开关，故 ctest 注册 13 条命令。
upstream_tests:
  - file: tests/functs/CMakeLists.txt
    source: clove-unit-2.4.6/tests/functs/CMakeLists.txt
    description: "CLoveUnitTest：clove 框架注册 175 用例 / 22 suite（17 UNIT + 5 INTE），add_test(NAME CLoveUnitTest COMMAND CLoveUnitTest -x)"
    command: "ctest -R '^CLoveUnitTest$'"
  - file: tests/functs/resources/prj01
    source: clove-unit-2.4.6/tests/functs/resources/prj01
    description: "CLoveUnitResourcePrj01：3 条用例，由 INTE_CmdRunTest 等集成用例以子进程方式拉起并断言其报告"
    command: "ctest -R '^CLoveUnitTest$'"
  - file: tests/stricts/clove-sanity/CMakeLists.txt
    source: clove-unit-2.4.6/tests/stricts/clove-sanity/CMakeLists.txt
    description: "Sanity_uc_* 12 条 CTest 命令（default/help/version/include/exclude/pretty/csv/json/list/list_pretty/list_csv/list_json），上游 CI sanity_check job"
    command: "ctest -R '^Sanity_uc_'"
  - file: tests/stricts/clove-c/CMakeLists.txt
    source: clove-unit-2.4.6/tests/stricts/clove-c/CMakeLists.txt
    description: "StrictCloveC：-Wall -Wextra -Wpedantic + COMPILE_WARNING_AS_ERROR 严格编译检查（上游无 add_test，只编译不注册测试）"
    command: "cmake --build . --target StrictCloveC"
  - file: tests/stricts/clove-cpp/CMakeLists.txt
    source: clove-unit-2.4.6/tests/stricts/clove-cpp/CMakeLists.txt
    description: "StrictCloveCpp：C++ 互操作严格编译检查（上游无 add_test，只编译不注册测试）"
    command: "cmake --build . --target StrictCloveCpp"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者冒烟：以 conan 包内 include/clove-unit.h 编译自带 3 用例/8 断言的 clove 测试程序，断言算术/字符串/布尔与空指针"
    command: "./test_clove_unit -x"
  - file: ohos_special_test.c
    description: "鸿蒙专项：16 项端到端断言（ELF 符号表自动发现、pretty/csv/json 报告、-i/-e 过滤、-x 退出码、-h/-v 自报 2.4.6）"
    command: "./ohos_special_test ./test_clove_unit"

# 测试断言总数 (test_package 侧：8 + 16 = 24)
# 上游 CI 执行面的静态断言另有 477 条（tests/functs 476 + tests/stricts/clove-sanity 1），
# 见 PR 正文「上游/适配后测试用例统计」两表与补充说明。
assertion_count: 24
