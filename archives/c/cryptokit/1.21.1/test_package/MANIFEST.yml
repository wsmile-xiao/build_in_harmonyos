# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cryptokit
homepage: "https://github.com/xavierleroy/cryptokit"

# 上游测试命令（OCaml 测试，无法在 OHOS C-only 环境中运行）
upstream_check_command: ""
upstream_test_in_build: false
upstream_tests: []

# 适配后的 test_package 测试
test_package_tests:
  - "CMake 编译 test.c 调用 SHA-256 API (SHA256_init/add_data/finish)"
  - "链接 libcryptokit.a/.so 验证符号解析正确"

# test_package 中的断言数量
assertion_count: 1
