knowledge_gained:
  - category: L1
    content: "HMDFS 禁止硬链接（知识库 E079 复用）：上游 Makefile links 目标用 ln -f 创建 17 个 argv0 分析别名，硬链接报 Operation not permitted；通过 make 命令行 LN=\"cp -f\" 覆盖（GNU make 命令行变量优先于文件内赋值），argv0 分发对副本同样生效；不走补丁路线的原因是源码包自带 Makefile.orig，与 patch 备份机制冲突"
    reason: "探索构建实测（ln: cannot create hard link ... Operation not permitted；conan patch 备份与 Makefile.orig 冲突）"
  - category: L2
    content: "CodonW 无 install 目标、无测试套件（Makefile 仅 all/codonw/links/clean/cleanall/realclean）；打包需自行搬运 codonw + 17 个别名到 bin/，消费者测试用真实基因输入断言 GC/ENC 指数输出与 argv0 别名行为"
    reason: "适配实测（codonw input.dat out -nomenu -silent -human -gc -enc 输出 Nc/GC 表）"

