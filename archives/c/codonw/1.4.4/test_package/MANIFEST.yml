# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: codonw/1.4.4
homepage: "http://codonw.sourceforge.net"

# 上游无自动化测试套件：Makefile 仅有 all/codonw/links/clean/cleanall/realclean
# 目标，无 check/test 目标，无测试目录（R51 清点证据见 notes.md）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: "testgene.dat + test_package/conanfile.py test()"
    description: "消费者测试：打包后的 codonw 对真实基因输入执行 GC/ENC 指数分析并断言输出（标题+数值）；argv0 别名副本 tidy 执行格式转换并断言 bulk 输出"
    command: "conan test()（conan create 自动执行，1/1 passed）"

assertion_count: 5
