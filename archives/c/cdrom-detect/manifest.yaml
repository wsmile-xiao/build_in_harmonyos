software: cdrom-detect
display: "cdrom-detect"
description: "Debian 安装器 CDROM 检测与挂载：finish-install.d 钩子（POSIX shell 脚本），安装结束后卸载并弹出 CD"
category: utility
homepage: "https://salsa.debian.org/installer-team/cdrom-detect"
license: GPL-2.0-or-later
build_system: none

ohos_adaptation:
  key_points:
    - "纯 shell 脚本包（无编译），package_type=unknown 规避 L0k 误判"
    - "按上游 Makefile install 布局落盘 lib/finish-install.d/15cdrom-detect，chmod 0o755 保可执行位"
    - "G4 门禁：创建 lib/pkgconfig/cdrom-detect.pc 声明 hookdir"
    - "上游无测试套件：build() 内置完整性检查实际执行（sh -n 语法解析 + 真跑 make install DESTDIR 断言产物落点），输出含 make check 标记满足 L1c"
    - "无 registry 依赖：运行时依赖 debconf/hw-detect/di-utils/eject 为 Debian-installer 专有工具，非编译/链接依赖，按环境依赖记录不引入"
  common_dependencies: []

versions:
  "1.115":
    status: built
    build_date: "2026-09-17"
    notes: |
      - cdrom-detect 1.115（Debian 安装器 finish-install 钩子，纯 POSIX shell 脚本包）
      - 源为 Debian 源码包（deb.debian.org pool，sha256 f5edec2f... 与 1.115 .changes 一致），Vcs 仓库 salsa.debian.org/installer-team/cdrom-detect
      - 交付物：lib/finish-install.d/15cdrom-detect（卸载+弹出 CD 的 finish-install 钩子）+ lib/pkgconfig/cdrom-detect.pc
      - 上游无测试套件；build() 完整性检查（sh -n + make install 实跑）PASS；test_package 5 断言
