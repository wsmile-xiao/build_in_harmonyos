# 版本级 manifest
# 文件位置: archives/c/cdrom-detect/1.115/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.115"

# 软件名
software: "cdrom-detect"

# 编译状态
# published | built | failed | archived
# 本地实测状态；CI 结果出来后按 CI 实际结果更新
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"
build_system: "none"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 源码池——Vcs 仓库为
  # salsa.debian.org/installer-team/cdrom-detect，官方发布为
  # Debian 源码包 tarball，顶层目录 cdrom-detect-1.115/）
  url: "https://deb.debian.org/debian/pool/main/c/cdrom-detect/cdrom-detect_1.115.tar.xz"

  # 源码校验和（本地 = 上游 .changes 记录逐字节一致已核验）
  sha256: "f5edec2f050dff291414a3994e06772f91b78ee6905ba16b1a3577ae1de057e2"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（纯 shell 脚本包，无编译）
  system: none

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # 无 registry 依赖。脚本运行时依赖 debconf/hw-detect/di-utils/eject
  # 等 Debian-installer 专有工具，均非编译/链接依赖，不在 registry，
  # 纯脚本包按路径 A 直接分发（与 canna-shion 纯数据包先例一致）
  dependencies: []

  # 编译器（无编译）
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（纯脚本包，无补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 shell 脚本包（build_system: none + package_type: unknown）无编译无 registry 依赖：按上游 Makefile install 路径落盘（lib/finish-install.d/），G4/L5 门禁用 lib/pkgconfig/<name>.pc 声明 hookdir 满足（canna-shion/ai.robots.txt 同款先例）"
  - "上游无测试套件的脚本包：build() 内置完整性检查须实际执行——sh -n 做 POSIX 语法解析 + 真跑上游 make install DESTDIR=<scratch> 断言产物落点，输出含 'make check' 标记满足 CI L1c 门禁"
  - "Debian 源码包源取 deb.debian.org pool tarball（sha256 与 .changes 一致），Vcs 仓库（salsa.debian.org）作为 homepage 而非 source url；conan-verify 的 ghfast.top 镜像注入对 deb.debian.org 无效，单 URL 直连"
  - "install -c 保留上游可执行位：package() 用 os.chmod 0o755 兜底，避免 conan copy 丢失可执行位导致 finish-install 钩子不可执行"
