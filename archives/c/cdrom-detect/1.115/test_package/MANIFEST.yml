package: cdrom-detect/1.115
homepage: "https://salsa.debian.org/installer-team/cdrom-detect"

# 上游测试资产：无（纯 shell 脚本包；上游 Makefile 仅 install: 目标，
# debian/rules 仅 dh $@，tarball 无任何 test/check 文件）
upstream_check_command: "make install"
upstream_test_in_build: false
upstream_tests: []

# 完整性替代检查（recipe build() 内置实际执行，输出含 make check 标记满足 L1c）
data_integrity_check:
  - file: conanfile.py
    description: "sh -n finish-install 做真实 POSIX 语法解析 + 真跑上游 make install DESTDIR=<scratch> 断言产物落在 usr/lib/finish-install.d/15cdrom-detect"
    command: "recipe build() _run_check"

# test_package 中自带的测试（消费者视角验证，R34 实质校验包内容）
test_package_tests:
  - file: test_cdrom_detect.py
    description: "校验包内 lib/finish-install.d/15cdrom-detect 存在/非空/可执行/sh -n 解析通过；lib/pkgconfig/cdrom-detect.pc 存在（L1e 可破坏物）"
    command: "python3 test_cdrom_detect.py <pkg_root>"
assertion_count: 5
