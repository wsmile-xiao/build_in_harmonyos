software: catatonit
display: "catatonit"
description: "轻量级容器 init 系统，用于在容器中作为 PID 1 进程运行，负责信号转发和孤儿进程回收"
category: container
homepage: "https://github.com/openSUSE/catatonit"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "musl 平台需应用补丁：0001-catatonit.c.patch（将 secure_getenv 替换为 getenv）"
    - "OpenHarmony 平台需应用补丁：0002-fix-close_range-sigsys.patch（修复 close_range syscall 兼容性）"
    - "tmpfs/HMDFS 平台 configure 有限制，需手动编译"
    - "静态编译，无外部依赖"
  common_dependencies: []

versions:
  "0.2.1":
    status: published
    build_date: "2026-05-26"
    published_as: catatonit
    source_url: "https://github.com/openSUSE/catatonit/archive/refs/tags/v0.2.1.tar.gz"