software: "czmq"
version: "4.2.0"
status: published
build_date: "2026-10-04"
build_system: cmake

source:
  url: "https://github.com/zeromq/czmq/releases/download/v4.2.0/czmq-4.2.0.tar.gz"
  sha256: "cfab29c2b3cc8a845749758a51e1dd5f5160c1ef57e2a41ea96e4c2dcc8feceb"
  tar_format: tar.gz

build:
  system: cmake
  # 本包用 CMake 构建，关键开关在 conanfile.py 的 generate() 内设置
  # （CZMQ_BUILD_SHARED=ON / CZMQ_BUILD_STATIC=OFF / ENABLE_DRAFTS=OFF /
  #  CMAKE_DISABLE_FIND_PACKAGE_* / CMAKE_SHARED_LIBRARY_SONAME_C_FLAG）。
  # 此处留空：clean-verify 的 G0 会把这些值喂给 autotools ./configure，
  # 填 CMake 的 -D 形式会被判为非法选项。
  configure_options: ""
  dependencies:
    - "libzmq/4.3.5"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists-cmake4-minimum-required.patch"
  - "0002-zfile-tmp-honour-tmpdir.patch"
  - "0003-zarmour-selftest-empty-string.patch"
  - "0004-zproxy-selftest-ipc-to-tcp.patch"
  - "0005-CMakeLists-link-libzmq-by-name.patch"

test:
  upstream_tests_registered: 30
  upstream_tests_run: 30
  upstream_tests_passed: 30
  upstream_tests_note: "ENABLE_DRAFTS=OFF 时 CMake TEST_CLASSES 注册 30 个 stable 类（draft 关闭时 10 个 draft 类不注册）；ctest 实测 30/30 通过，无排除无跳过"
  test_package: "HarmonyOS consumer test（版本握手/zsys_has_curve/zhash/zuuid/zframe/稳定 zfile API/inproc zsock+zstr/zmsg/zrex/zclock 共 37 项断言，全通过）"

knowledge_gained:
  - "czmq 的 find_package(libzmq) 走 module 模式命中自带 Findlibzmq.cmake，该文件用 pkg_check_modules 找 libzmq → 必须同时生成 PkgConfigDeps（libzmq/4.3.5 导出 pkg_config_name=libzmq），仅 CMakeDeps 不够"
  - "czmq 的公开头包含 <zmq.h>，requires 必须声明 transitive_headers=True + transitive_libs=True，否则 CMakeDeps 生成的传递依赖 include/libs 为空 → 消费者 'zmq.h' file not found（已合入的 zmqpp/4.2.0 同样声明）"
  - "OHOS HMDFS 上 /tmp 是只读 erofs，czmq 的 zfile_tmp() 硬编码 /tmp/czmq_zfile.XXXXXX → 改为优先读 TMPDIR（补丁 0002）"
  - "czmq 的 zproject CMake 会探测宿主上的 uuid/systemd/lz4/libcurl/libmicrohttpd 并链进 libczmq —— 首次本地构建就误链了 ~/usr/local 的 libcurl.so.4；用 CMAKE_DISABLE_FIND_PACKAGE_<name>=ON 强制探测失败，保证包只依赖 libzmq"
  - "上游 CMake 不给构建树设 RPATH，libczmq.so 在构建目录 → ctest 必须把 build_folder 前置到 LD_LIBRARY_PATH；libzmq 改成按 soname 链接后还需补 dependencies['libzmq'] 的 libdir"
  - "OHOS 拒绝 AF_UNIX bind（实测 zmq_bind('ipc://backend') rc=-1 errno=1 EPERM，tcp bind 正常）→ zproxy selftest 的 ipc 后端端点不可用，backport 上游 v4.2.1 的 tcp 端点改法（补丁 0004）"
  - "czmq 4.2.0 zarmour selftest 空串用例断言错误（要求 decoded size == strlen(expected)+1），上游 v4.2.1 已修 → backport（补丁 0003）"
  - "环境缺 Platform/HarmonyOS CMake 模块时 CMake 不知道本系统 soname 旗标 → 共享库无 DT_SONAME（CI L5a）；配方显式设 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG/CXX_FLAG=-Wl,-soname, 即可恢复 libxxx.so.N 版本化命名"
  - "制品仓 libzmq.so 无 DT_SONAME → 按 find_library 绝对路径链接会把 conan 缓存路径写进 DT_NEEDED 并产生 IMPORTED_NO_SONAME（CI L5b/L5c）；改为 -L + -lzmq 链接即合规（补丁 0005）"
  - "本地跑 CI 脚本时 zsh heredoc 需要 TMPPREFIX 指向可写目录（否则 'can't create temp file for here document: read-only file system' 会被 L0i 误报为 conanfile AST 解析失败）"
  - "czmq 的 helper 二进制 zmakecert 在 libzmq 关闭 CURVE 时只能生成全 0 密钥 → 不随包分发（package() 删除 bin/），包保持纯库形态"
  - "clean-verify(G0) 只跑 autotools ./configure：CMake-only 配方若在 manifest.configure_options 填 -D 形式会被判非法选项；czmq 上游 config.sub 早于 OHOS，autotools 路线还需 config.guess/sub patch（本包走 CMake，未采用）"
