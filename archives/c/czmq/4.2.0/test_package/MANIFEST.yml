package: czmq/4.2.0
homepage: "https://czmq.zeromq.org"

upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure (run from the CMake build folder; no test is excluded on OHOS)"

upstream_tests:
  - file: CMakeLists.txt
    source: czmq-4.2.0/CMakeLists.txt
    description: "Registers one ctest entry per czmq selftest class via TEST_CLASSES (30 stable classes with ENABLE_DRAFTS=OFF; the 10 draft classes - zargs/zproc/ztimerset/ztrie/zhttp_*/zosc - are only appended when CZMQ_BUILD_DRAFT_API is set)."
    command: "ctest"
  - file: src/czmq_selftest.c
    source: czmq-4.2.0/src/czmq_selftest.c
    description: "Single selftest driver binary; ctest invokes `czmq_selftest --continue --verbose --test <class>` per registered class."
    command: "ctest"
  - file: src/test_randof.c
    source: czmq-4.2.0/src/test_randof.c
    description: "Standalone random-offset helper built by the upstream build (not registered with enable_testing, so not part of the ctest count)."
    command: "make test_randof"

test_package_tests:
  - file: test_czmq.c
    description: "HarmonyOS consumer test (37 assertions): version handshake, zsys_has_curve() probe, zhash container, zuuid canonical string, zframe codec, stable zfile API read under TMPDIR, inproc zsock+zstr round trip, zmsg envelope, zrex matching and zclock_mono monotonicity."
    command: "./test_czmq"

assertion_count: 37

harmonyos_validation:
  status: verified_local
  command: 'CI_PACKAGES="archives/c/czmq/4.2.0" zsh ci/conan/build_and_test.sh'
  result: "L0 pass / L1 pass (ctest 30/30 + test_package 37 checks) / L2 skip (no bin) / L4 warn (patch regex false positive) / L5 pass"
