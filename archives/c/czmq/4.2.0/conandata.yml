# R39: 只写官方 URL，镜像 fallback 由 CI 自动添加
sources:
  url: "https://github.com/zeromq/czmq/releases/download/v4.2.0/czmq-4.2.0.tar.gz"
  sha256: "cfab29c2b3cc8a845749758a51e1dd5f5160c1ef57e2a41ea96e4c2dcc8feceb"

patches:
  - patch_file: "patches/0001-CMakeLists-cmake4-minimum-required.patch"
    patch_description: "CMake 4.x 不再兼容 <3.5 的 cmake_minimum_required，升至 3.5...3.27"
    patch_type: "portability"
  - patch_file: "patches/0002-zfile-tmp-honour-tmpdir.patch"
    patch_description: "zfile_tmp() 硬编码 /tmp；OHOS HMDFS 上 /tmp 是只读 erofs，改为优先读 TMPDIR"
    patch_type: "portability"
  - patch_file: "patches/0003-zarmour-selftest-empty-string.patch"
    patch_description: "backport 上游 v4.2.1 对 zarmour selftest 的修复：空字符串用例解码后 size 为 0，原断言要求 strlen(expected)+1 必失败"
    patch_type: "bugfix"
  - patch_file: "patches/0004-zproxy-selftest-ipc-to-tcp.patch"
    patch_description: "backport 上游 v4.2.1 对 zproxy selftest 的修复：后端端点由 ipc:// 改为 tcp://127.0.0.1:<port>（OHOS SELinux 拒绝 AF_UNIX bind，errno=1 EPERM）"
    patch_type: "bugfix"
  - patch_file: "patches/0005-CMakeLists-link-libzmq-by-name.patch"
    patch_description: "libzmq 按 -lzmq + -L 链接而非绝对路径：制品仓的 libzmq.so 无 DT_SONAME，按路径链接会写进绝对路径 DT_NEEDED 并在导出文件里产生 IMPORTED_NO_SONAME（CI L5b/L5c 门禁）"
    patch_type: "portability"
