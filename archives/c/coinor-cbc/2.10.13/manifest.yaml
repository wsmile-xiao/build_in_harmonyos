# 版本级 manifest — coinor-cbc 2.10.13
# 遵循 ARCHIVE-SPEC v2.0

version: "2.10.13"
software: coinor-cbc
status: built
build_date: "2026-09-21"
build_system: autotools

source:
  url: "https://github.com/coin-or/Cbc/archive/refs/tags/releases/2.10.13.tar.gz"
  sha256: "62fde44dcf6f3d05c5cd291d7435cdd1b7e8acd3c78ec481dd39fe49cbc40399"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--build=aarch64-unknown-linux-musl"
    - "--enable-static"
    - "--disable-shared"
    - "--disable-dependency-tracking"
    - "--with-cbc-generic"
    - "--without-dylp"
    - "--without-vol"
    - "--without-cpx"
    - "--without-glpk"
    - "--without-grb"
    - "--without-highs"
    - "--without-msk"
    - "--without-spx"
    - "--without-xpr"
    - "--without-asl"
    - "--without-mumps"
    - "--without-nauty"
    - "--without-netlib"
  dependencies:
    - coinutils/2.11.13
    - coin-or/0.108.12
    - clp/1.17.10
    - cgl/0.60.10.1
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []
# 无源码补丁：依赖注入（configure flags 模式）与 HMDFS 修复全部在 conanfile.py
# build() 内完成，不改动上游源码。

knowledge_gained:
  - "COIN-OR 家族（Cbc/Clp/Cgl/CoinUtils/Osi）已发布包的 .pc 固化 prefix=/ 且 Libs 内嵌构建机绝对路径，下游消费必须改用子包 configure 的 --with-<pkg>-lib/--with-<pkg>-incdir flags 模式（flags 分支直接置 coin_has_*=yes 并跳过 pkg-config）" # knowledge_ref: E646
  - "COIN-OR 旧式 autotools 的 incdir 只收单目录而依赖头分居各包 include/coin → 合并头文件 staging 后统一注入；闭包链接串按依赖方在前重复展开（同上游 cgl.pc 口径）" # knowledge_ref: E646
  - "release tarball 不捆绑依赖的 COIN-OR 项目：直接驱动子包 configure（顶层 configure 仅做子包编排），测试数据（Data-Sample/miplib3）以 --with-<pkg>-datadir 注入激活 make test 的数据面" # knowledge_ref: E646

test_results:
  type: upstream_and_consumer
  upstream_test_in_build: true
  upstream_targets_registered: 5
  note: "逐目标结果见 reports/test-report.md；netlib 扩展面未引入（如实申报）"
