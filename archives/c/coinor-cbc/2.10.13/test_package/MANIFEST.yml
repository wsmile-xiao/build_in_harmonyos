# test_package/MANIFEST.yml
# 上游官方测试声明文件 — coinor-cbc 2.10.13
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试面（Cbc/test/Makefile.am 的 CBC_TEST_TGTS 注册，口径=make test 目标）：
#   test = gamstests ositests
#        + test_cbc        (COIN_HAS_CLP && COIN_HAS_SAMPLE)
#        + ctests          (COIN_HAS_CLP)
#        + test_cbc_generic(CBC_BUILD_CBC_GENERIC && COIN_HAS_SAMPLE)
# 本包以 --with-sample-datadir/--with-miplib3-datadir/--with-cbc-generic 激活全部 5 个。
# Netlib 扩展（ositests 的 -testOsiSolverInterface）未引入（约 40MB 数据包，
# 体积/时长代价大，未运行项已在 PR 正文如实申报）。

package: coinor-cbc/2.10.13
homepage: "https://github.com/coin-or/Cbc"

# 上游测试命令（在源码树 Cbc/ 子目录执行；顶层 make test 会 cd Cbc && cd test 传导）
upstream_check_command: "make test (in Cbc/ subpackage)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 test (in <source>/Cbc，运行前对 5 个测试 ELF 自签)"

# 上游实际运行的测试程序
upstream_tests:
  - file: Cbc/test/gamsTest.cpp
    source: Cbc-2.10.13/Cbc/test/gamsTest.cpp
    description: "GAMS 工具链兼容性测试（求解器侧自建模型，无需 GAMS）"
    command: "./gamsTest"
  - file: Cbc/test/osiUnitTest.cpp + Cbc/test/OsiCbcSolverInterfaceTest.cpp
    source: Cbc-2.10.13/Cbc/test/osiUnitTest.cpp
    description: "OsiCbc 接口单元测试（-mpsDir 指向 Data-Sample）"
    command: "./osiUnitTest -mpsDir=<Sample 数据目录>"
  - file: Cbc/test/CInterfaceTest.c
    source: Cbc-2.10.13/Cbc/test/CInterfaceTest.c
    description: "Cbc_C_Interface C API 单元测试（自建模型断言）"
    command: "./CInterfaceTest"
  - file: Cbc/src（cbc 驱动）
    source: Cbc-2.10.13/Cbc/src/CbcSolver.cpp
    description: "cbc 求解器单元测试（-dirSample/-dirMiplib3 -unitTest，miplib3 基准集）"
    command: "../src/cbc -dirSample=<Sample> -dirMiplib=<miplib3> -unitTest"
  - file: Cbc/src（cbc-generic 驱动）
    source: Cbc-2.10.13/Cbc/src/CbcSolver.cpp
    description: "cbc-generic 最小冒烟（-directory Sample -import p0033.mps -branch）"
    command: "../src/cbc-generic -directory=<Sample> -import p0033.mps -branch"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_cbc.sh
    description: "真跑打包产物 bin/cbc：版本横幅 2.10.13 + 内置 MIP 求解最优 + 目标值 11 断言"
    command: "./test_cbc.sh <pkg>/bin/cbc <workdir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
