# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: coinor-csdp/6.2.0
homepage: "https://github.com/coin-or/Csdp"

# 上游测试入口：顶层 Makefile 只有 unitTest 目标（无 autotools `make check`）
upstream_check_command: "make unitTest"

# 上游测试已在 conanfile.py build() 内集成（含数值判据断言 _check_upstream_tests）
upstream_test_in_build: true
upstream_test_command: "make unitTest  # → cd test; make all → csdp theta1.dat-s / theta g50"

# 上游实际运行的测试程序（N=2：test/Makefile `all: theta1.out g50.out`，
# 上游注释自证 "Currently, we have only two tests to complete"）
upstream_tests:
  - file: test/theta1.dat-s
    source: Csdp-releases-6.2.0/test/theta1.dat-s
    description: "SDPA 格式半定规划求解：csdp theta1.dat-s → theta1.out，最优值与 theta1.correct 6 位一致（2.3000000e+01）、DIMACS 六项 < 1.0e-6"
    command: "../solver/csdp theta1.dat-s > theta1.out"
  - file: test/g50
    source: Csdp-releases-6.2.0/test/g50
    description: "Lovasz theta 数：theta g50 → g50.out，theta 数与 g50.correct 6 位一致（2.3000000e+01）、DIMACS 六项 < 1.0e-6"
    command: "../theta/theta g50 > g50.out"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_csdp_consumer.c
    description: "库消费者：read_prob + initsoln + easy_sdp 求解 theta1.dat-s，断言 5 项（rc/规模/Success/pobj/dobj）"
    command: "./test_csdp_consumer theta1.dat-s"
  - file: conanfile.py
    description: "test() 层 10 项断言：消费者 rc + csdp/theta --version 自报 + csdp/theta 真实求解输出匹配"
    command: "csdp --version | csdp theta1.dat-s | theta g50"

# 测试断言总数（近似值, 用于质量评估）：库消费者 5 + test() 层 10 = 15
assertion_count: 15
