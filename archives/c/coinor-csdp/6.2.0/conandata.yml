# conandata.yml — coinor-csdp 6.2.0
# 上游：COIN-OR CSDP（半定规划求解器），官方 GitHub tag releases/6.2.0
# sha256 实测锚定（2026-09-23，设备本机 curl 下载后 sha256sum；tag 由
# `git ls-remote --tags https://github.com/coin-or/Csdp.git` 实证 e1586e0413…）

sources:
  url: "https://github.com/coin-or/Csdp/archive/refs/tags/releases/6.2.0.tar.gz"
  sha256: "3d341974af1f8ed70e1a37cc896e7ae4a513375875e5b46db8e8f38b7680b32f"

# 补丁：5 个 CLI 工具（csdp/theta/complement/rand_graph/graphtoprob）新增
# `--version`/`--help`，在打开输入文件之前退出。动机：平台 L2 smoke 门禁以
# `<bin> --version` 探测可执行文件，上游把该参数当输入文件打开（theta 直接
# fopen(NULL) 后 fscanf 未判空），退出码非 0 ⇒ L2 必红；同时修复用户误敲
# `theta --help` 即段错误的路径。纯新增参数处理分支，不改任何求解/测试逻辑。
# 由 `refresh-patch --auto` 从 .orig/.work 逐文件生成（dry-run -p1 已过）。
patches:
  - patch_file: "patches/0001-solver-csdp.c.patch"
    patch_type: "feature"
    patch_description: "csdp: 新增 --version/--help（打开输入文件前退出）"
  - patch_file: "patches/0002-theta-complement.c.patch"
    patch_type: "feature"
    patch_description: "complement: 新增 --version/--help（含 string.h）"
  - patch_file: "patches/0003-theta-graphtoprob.c.patch"
    patch_type: "feature"
    patch_description: "graphtoprob: 新增 --version/--help"
  - patch_file: "patches/0004-theta-rand_graph.c.patch"
    patch_type: "feature"
    patch_description: "rand_graph: 新增 --version/--help（含 string.h）"
  - patch_file: "patches/0005-theta-theta.c.patch"
    patch_type: "feature"
    patch_description: "theta: 新增 --version/--help（--help 修复 fopen(NULL) 崩溃路径）"
