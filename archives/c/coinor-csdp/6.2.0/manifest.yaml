# 编译中学到的知识
knowledge_gained:
  - "纯 make 包在 make 调用处用命令行变量钉死 CFLAGS/CXXFLAGS/LIBS：makefile 的 export 定义被命令行变量覆盖，且命令行变量会导出给 cd 子目录; make 的子 make —— 配方不依赖环境 flags，CI worker 泄漏 -fPIC -O2 也不再改变已验证配置 # knowledge_ref: E687"
  - "BLAS/LAPACK 用静态归档直链（libopenblas.a 而非 -lopenblas）：交付 ELF 只剩 NEEDED libc.so、可在 L2 门禁裸跑；动态形态在无 conanrun 的 <bin> --version 下必 127 # knowledge_ref: E687"
  - "CLI 包必须补 --version/--help：上游把 --version 当输入文件打开（theta 直接 fopen(NULL)），退出码非 0 则 L2 必红；.correct 参考输出可能陈旧（g50 缺横幅），判据按 Makefile 注释的数值口径 # knowledge_ref: E687"

