# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
package: c-vtapi/0.0-git20230329.226eda8
homepage: "https://github.com/VirusTotal/c-vtapi"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无 TESTS / make check 目标：git 快照仅含 lib/（库源码）与 examples/
# （需真实 VirusTotal API key 的示例程序，默认 --enable-examples 关闭）。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无：上游没有独立测试用例）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 smoke 测试：VtApiPage_new/setApiKey/get/put 真实 API 调用"
    command: "./test_c-vtapi"
  - file: test_ohos.c
    description: "HarmonyOS 专项测试：VtResponse JSON 解析/提取/序列化、VtObject refcount 生命周期、setApiKey 内存路径（15 项检查，离线真实 API）"
    command: "./test_ohos"

# 测试断言总数
assertion_count: 18
