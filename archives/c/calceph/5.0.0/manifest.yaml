software: calceph
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游真实 tag calceph_5_0_0，2026-07 发布）
version: "5.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"

# 构建系统标识（verify-build 要求）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码获取方式（git clone，gitlab.obspm.fr 官方仓库）
  git_url: "https://gitlab.obspm.fr/imcce_calceph/calceph.git"
  git_branch: "calceph_5_0_0"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 构建系统标识（verify-build 要求）
  build_system: cmake

  # 配置选项列表（Fortran/Python/MEX/文档全关——OHOS 无 Fortran 编译器）
  configure_options:
    - "-DENABLE_FORTRAN=OFF"
    - "-DENABLE_PYTHON=OFF"
    - "-DENABLE_MEX_OCTAVE=OFF"
    - "-DENABLE_DOC=OFF"
    - "-DENABLE_PDF=OFF"

  # 编译依赖列表（零第三方依赖，C 核心库自包含）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码 patch，仅构建选项裁剪）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "calceph（IMCCE 天体历表库）C 核心零第三方依赖——路径 A 直接适配（CMake 构建，ENABLE_FORTRAN=OFF 绕 OHOS 无 Fortran 编译器）"
    - "上游测试 tests/ 114 个 C 测试（ctest，含 .tpc 数据文件）——本地实测通过率如实记录"
