package: calceph/5.0.0
homepage: "https://calceph.imcce.fr/"

# calceph 上游测试 tests/ 目录 114 个 C 测试（ctest），在配方 build 阶段
# 实跑（本地实测通过率见 PR 测试对比表）。消费测试：test_calceph.py——
# lib/libcalceph.a 存在 + include/calceph.h 头文件存在 + 编译链接运行
# consumer.c（调用 calceph_sgetconstantcount，3 断言，非空壳）。
upstream_tests: 114
upstream_test_command: "tests/ 114 个 C 测试（ctest，build 阶段实跑）"

test_package_tests:
  - file: test_calceph.py
    description: "消费测试：libcalceph.a 存在 + calceph.h 头文件存在 + consumer 编译链接运行 calceph_sgetconstantcount（3 断言）"
    command: "python3 test_calceph.py <package_folder>"

assertion_count: 3