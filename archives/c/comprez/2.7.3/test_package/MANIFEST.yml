# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: comprez/2.7.3
homepage: "https://kinzler.com/me/z/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# comprez 上游为纯 shell 脚本工具（z/zzcat + Makefile 安装），Makefile 无 check 目标
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游源码包 (z-2.7.3.tgz) 仅含 z、zzcat、Makefile、README、z.man、z.html、COPYING，
# 无任何测试套件（无 test/ 目录、无 make check 目标）——经穷尽核查确认
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 上游无测试，自研 9 项功能测试覆盖核心功能：用法/版本、gzip 压缩/列表/解压、
# bzip2 压缩解压、xz 压缩解压、zip 压缩解压、zzcat 解压、单文件 gzip
test_package_tests:
  - file: test.sh
    description: "comprez 核心功能测试：gzip/bzip2/xz/zip 压缩解压、zzcat、-t 列表（9 项断言组）"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 9 个断言组（每组含 1-3 个校验点）
assertion_count: 18