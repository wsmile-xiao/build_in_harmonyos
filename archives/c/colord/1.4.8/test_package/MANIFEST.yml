# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: colord/1.4.8
homepage: "https://github.com/hughsie/colord"

# 上游测试命令 (meson test --list 结果)
upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游测试 (colord-test-private, colord-test-daemon, colorhug-self-test) 需要
# colord daemon 和 D-Bus session bus 运行环境，OHOS 无此环境
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.c
    description: "消费者测试：CdColorRGB API 创建、设值、验证"
    command: "./test_package"

# 测试断言总数 (近似值)
assertion_count: 3
