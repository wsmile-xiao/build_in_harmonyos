sources:
  url: "https://github.com/hughsie/colord/archive/refs/tags/1.4.8.tar.gz"
  sha256: "4f707604f1d8c3e9d9191bc4499605ebcf03b2e4f45a246a78cbd381333879b7"
patches:
  "1.4.8.1":
    - patch_file: "patches/0001-ohos-disable-udev-gudev-deps.patch"
      patch_description: "Make libudev/gudev/gusb optional via meson required:false; use HAVE_LIBUDEV config macro (not platform macro) to guard libudev.h include and hwdb lookup in cd-edid.c; use conditional dependency lists in lib/colord/meson.build (preserves non-OHOS compatibility); skip colorhug (needs gusb), po (needs gettext), data/profiles+cmf+illuminant (need ELF-signed binaries at build time); skip meson_post_install.sh (needs chown)"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-enable-tests.patch"
      patch_description: "Enable and make the upstream self-test suite (colord-test-private) pass on OHOS: (1) only register colord-test-daemon when the daemon option is enabled (it requires a running colord daemon over a D-Bus session bus, which OHOS lacks); (2) replace hardcoded /tmp paths with g_get_tmp_dir() in cd-test-shared.c/cd-test-private.c so the read-only OHOS /tmp no longer aborts tests (build sets TMPDIR to a writable dir); (3) guard the two cd_edid_get_vendor_name() assertions with HAVE_LIBUDEV since vendor-name resolution needs udev hwdb (returns NULL on OHOS); (4) replace the upstream colord.map version script (local: * hides the statically linked glib2, forcing the test binary to carry a second pointer-encoded GType registry -> SIGSEGV on direct g_object_unref of colord objects) with lib/colord/colord-ohos.map that keeps cd_*/g_* global (single registry) and localizes only zlib-family symbols (non-PIC static libz.a links into the .so). NOTE: the local: list must stay zlib-only - an earlier draft also had a *_copyright catch-all pattern which localized the public cd_icc_get_copyright()/cd_icc_set_copyright() API and broke the cd-fix-profile link."
      patch_type: "test"
    - patch_file: "patches/0003-ohos-icc-tostring-stale-tagtype.patch"
      patch_description: "Two OHOS-specific cd-icc.c fixes for the /colord/icc test. (1) cd_icc_to_string() stale-tagtype crash: cmsReadRawTag() fails when a tag is already cached (decoded) and the supplied buffer is smaller than the whole tag, leaving the 4-byte type from the previous tag in @tmp; on OHOS the dictType 'meta' tag (112 bytes, decoded by cd_icc_load_metadata) is then misdetected as an MLU ('text' leftover from the DevD/CIED tags) and cmsMLUtranslationsCount()/cmsMLUtranslationsCodes() read the dictionary structure as an MLU -> SIGSEGV in liblcms2. Fix: allocate a buffer large enough for the whole tag, only use the first 4 bytes for the type signature, skip the tag if the raw read still fails. (Masked upstream only because with a NULL lcms context the dict's ContextID low bytes read as the MLU entry count are zero; colord's non-NULL context makes them non-zero -> crash.) (2) cd_icc_get_created() timezone round-trip: glib GDateTime on OHOS does not apply the system timezone offset (no /etc/localtime), so g_date_time_new_from_unix_local() returns UTC and the upstream creation-time assertion (expected '2009-12-23, 22:20:46', got 14:20:46) fails. Fix: interpret the ICC header creation time (which is UTC by spec) with timegm() and instantiate with g_date_time_new_from_unix_utc()."
      patch_type: "bugfix"
    - patch_file: "patches/0004-ohos-icc-store-contenttype-fallback.patch"
      patch_description: "cd-icc-store.c: OHOS has no shared-mime-info database, so GIO's content-type detection reports application/octet-stream for *.icc files and the ICC store rejects every profile (colord-test-private /colord/icc-store fails with 'assertion failed (added == 1): (0 == 1)' at cd-test-private.c:2032). Fix: when the content type is undetermined (NULL or application/octet-stream) fall back on the .icc file extension so the ICC store can still discover profiles; on systems with a MIME database the strict application/vnd.iccprofile check keeps applying."
      patch_type: "portability"
