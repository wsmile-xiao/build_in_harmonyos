# 版本级 manifest — colord 1.4.8.1
# 遵循 ARCHIVE-SPEC v2.0（交叉校验元数据，CI 不依赖；以 conandata.yml 为准）

version: "1.4.8.1"
software: colord
status: built
build_date: "2026-09-29"
build_system: meson
conan_ref: "colord/1.4.8.1"

source:
  url: "https://github.com/hughsie/colord/archive/refs/tags/1.4.8.tar.gz"
  sha256: "4f707604f1d8c3e9d9191bc4499605ebcf03b2e4f45a246a78cbd381333879b7"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "daemon=false systemd=false udev_rules=false introspection=false man=false docs=false"
    - "bash_completion=false vapi=false sane=false session_example=false print_profiles=false"
    - "argyllcms_sensor=false libcolordcompat=false installed_tests=false tests=true"
  dependencies:
    - glib2/2.88.0
    - lcms2/2.19
    - sqlite3/3.53.4
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-disable-udev-gudev-deps.patch"
  - "0002-ohos-enable-tests.patch"
  - "0003-ohos-icc-tostring-stale-tagtype.patch"
  - "0004-ohos-icc-store-contenttype-fallback.patch"

knowledge_gained:
  - "上游自测套件（colord-test-private 38 用例）在 OHOS 实测：37 通过 / 1 上游 g_test_skip（/colord/it8{cri-util}，构建期 ELF 签名生成文件不可用）/ 0 失败"
  - "上游 colord.map（local: *）隐藏静态链接 glib2 → 测试二进制双 GType registry SIGSEGV；改 colord-ohos.map 仅 local 化 zlib 系符号解决（0002）"
  - "cmsReadRawTag 对已解码 tag 需整块 buffer，过小残留上一条目 4 字节 type → dictType 'meta' 误判 MLU SIGSEGV；分配整 tag buffer 解决（0003）"
  - "OHOS 无 shared-mime-info，GIO 对 *.icc 报 application/octet-stream → ICC store 拒收；content type 未定时按 .icc 扩展名兜底（0004）"
  - "GDateTime 在无 /etc/localtime 时不应用时区偏移 → cd_icc_get_created 用 timegm + new_from_unix_utc（0003）"
  - "OHOS /tmp 只读（E002）：测试路径改 g_get_tmp_dir()，构建期 TMPDIR 指向可写目录（0002）"
