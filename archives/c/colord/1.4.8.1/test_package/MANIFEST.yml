# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: colord/1.4.8.1
homepage: "https://github.com/hughsie/colord"

# 上游测试命令 (meson test --list 结果)
upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test -C build --no-rebuild --print-errorlogs"

# 上游实际运行的测试程序 (meson test --list 清点结果)
# - colord-test-private: 进程内单元测试，OHOS 上实际运行，通过率 100%
# - colord-test-daemon: 需要 colord daemon + D-Bus session bus，OHOS 无此环境
#   （0002 补丁在 daemon=false 时不注册该测试）
# - colorhug-self-test: 依赖 libgusb，未发布，colorhug 子目录跳过
# - cd-self-test: 依赖 daemon 全套，daemon=false 不构建
upstream_tests:
  - name: colord-test-private
    status: run
    detail: "38 个 g_test 用例：37 通过 / 1 跳过（/colord/it8{cri-util}，构建期生成文件不可用，上游 g_test_skip）/ 0 失败"
  - name: colord-test-daemon
    status: env-excluded
    detail: "需要 colord daemon + D-Bus session bus（OHOS 无），daemon=false 时不注册"
  - name: colorhug-self-test
    status: build-excluded
    detail: "依赖 libgusb（制品仓未发布），colorhug 子目录跳过"
  - name: cd-self-test
    status: build-excluded
    detail: "依赖 daemon 全套，daemon=false 不构建 src/"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.c
    description: "通用消费者测试：CdColorRGB / CdIcc API 冒烟"
    command: "./test_package"
  - file: test_package.c
    description: "鸿蒙特有测试：无 udev 时 cd_edid 路径行为（解析 monitor/PNP/checksum，vendor 为 NULL）"
    command: "./test_package"

# 测试断言总数 (近似值)
assertion_count: 12
