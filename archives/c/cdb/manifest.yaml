software: cdb
display: "cdb"
description: "DJB 常量数据库（CDB 格式）创建和读取工具及库，2025-10-21 维护版，新增 cdb64（64 位哈希/偏移）变体"
category: database
homepage: "https://cdb.cr.yp.to/"
license: Public Domain
build_system: makefile

ohos_adaptation:
  key_points:
    - "djbware 构建：conf-cc/conf-ld/conf-home 首行配置，配方从 Conan conf 取编译器路径写入"
    - "make prog 目标交叉编译安全：不运行构建期生成的二进制（instcopy/instcheck 才需要原生运行）"
    - "makelib 打补丁尊重 AR/RANLIB 环境变量，支持 llvm-ar 交叉归档"
    - "Makefile 打补丁以 sh ./compile|load|makelib 调用生成脚本：HarmonyOS hmdfs 拒绝 #! 脚本直接 exec（ELF 不受限）"
    - "上游不安装库文件；配方将 cdb.a+cdb64.a+buffer.a+unix.a+byte.a 合并为自包含 libcdb.a"
    - "链接默认用 clang 默认 linker（HNP clang 不识别 -fuse-ld=bfd；lld/默认均可），可用 user.cdb:ld conf 覆盖"
    - "系统 tmp 目录只读：构建与测试需注入 TMPDIR 指向可写目录"
    - "cdbmake-12/cdbmake-sv 为 #!/bin/sh+awk 脚本：OHOS 内核对 /bin/sh shebang 有执行限制，需以 sh 显式调用；依赖 awk"
  common_dependencies: []

versions:
  "20251021":
    status: built
    build_date: "2026-09-07"
