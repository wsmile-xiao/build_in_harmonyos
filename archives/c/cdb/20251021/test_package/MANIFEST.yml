# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cdb/20251021
homepage: "https://cdb.cr.yp.to/"

upstream_check_command: "sh rts"
upstream_test_in_build: false
upstream_test_command: "cd <src> && sh rts > rts.out && diff rts.exp rts.out"

upstream_tests:
  - file: rts.tests
    source: cdb-20251021/rts.tests
    description: "Functional suite: cdbmake/cdbmake-12/cdbmake-sv create; cdbdump/cdbtest/cdbstats/cdbget verify (55 sections total, cdb + cdb64)"
    command: "sh rts"

test_package_tests:
  - file: test.c
    description: "C API round-trip: cdb_make_start/add/finish build, cdb_init/find/read query, miss-key, cdb_hash (32-bit)"
    command: "./test_cdb"
  - file: test64.c
    description: "C API round-trip for the cdb64 variant (64-bit hash/offsets via CDB64 macro renaming)"
    command: "./test_cdb64"
  - file: conanfile.py
    description: "CLI round-trip: cdbmake stdin records -> cdbget value assert; cdbget miss exits 100"
    command: "cdbmake/cdbget pipeline"

assertion_count: 11
upstream_result:
  date: "2026-09-08"
  device: "OHOS aarch64 (10.62.134.118), conan 2.29.1, clang 15.0.4"
  passed: 47
  total: 55
  failures: "8 sections (x2 cdb/cdb64): unwritable tmp / unmovable cdb / nomem / full disk — error-injection via symlink-loop and ulimit -f/-v not enforceable on HarmonyOS (hmdfs forbids symlink, musl ulimit no-op); functional behavior itself correct (cdbmake succeeds where upstream expects the injected failure)"
