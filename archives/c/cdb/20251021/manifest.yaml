software: cdb
# 版本级 manifest
# 文件位置: archives/c/cdb/20251021/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "20251021"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"

# 构建系统类型（顶级字段，verify 需要）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cdb.cr.yp.to/cdb-20251021.tar.gz"
  sha256: "8e531d6390bcd7c9a4cbd16fed36326eee78e8b0e5c0783a8158a6a79437e3dd"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile

  # djbware：conf-cc/conf-ld 首行由配方写入（来自 Conan conf 的编译器路径）
  configure_options:
    - "conf-cc=<clang> -fPIC -O2 -D_XOPEN_SOURCE=500"
    - "conf-ld=<clang>（默认不注入 -fuse-ld；可用 user.cdb:ld conf 覆盖）"
    - "conf-home=<package_folder>"
    - "make prog -j1"

  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-makelib-respect-AR-RANLIB-env.patch"
  - "0002-makefile-invoke-build-scripts-via-sh.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "djbware 构建系统：conf-cc/conf-ld/conf-home 首行即配置；./compile、./load 由 Makefile 动态生成"
  - "make prog 只构建二进制+静态库，不执行 instcopy/instcheck，交叉编译安全（不运行构建出的二进制）"
  - "上游只安装命令行工具；库（cdb.a/cdb64.a）需打包方自行安装，链接还需 buffer.a+unix.a+byte.a，合并为单一 libcdb.a"
  - "cdb64 通过 #define CDB64 + #include 源文件实现符号重命名（cdb_* -> cdb64_*），与 cdb 符号无冲突"
  - "pkgsrc 同款包在 Linux 上加 -D_XOPEN_SOURCE=500 暴露 mmap/lseek 原型"
  - "HarmonyOS hmdfs 用户分区拒绝 #! 脚本 exec（ELF 不受影响）：djbware 生成的 ./compile/./load/./makelib 需以 sh ./xxx 调用（补丁 0002）"
  - "HarmonyOS 真机 /tmp 只读：clang 与测试程序需要显式 TMPDIR 指向可写目录"
  - "HNP clang 15 不接受 -fuse-ld=bfd（invalid linker name）；默认 linker/lld 均可正常产出 PIE ELF"
