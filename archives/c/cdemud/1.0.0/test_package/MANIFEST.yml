# test_package/MANIFEST.yml — upstream test declaration (CI gate L0e)
# Facts below verified from the pristine upstream tarball on 2026-09-04
# (see ../notes.md and reports/builder/upstream-test-discovery.md in the run).

package: cdemud/1.0.0
homepage: "https://cdemu.sourceforge.io/"

# Upstream suite listing tool: none exists. The 1.0.0 tree has no test/
# directory, no TESTS automake variable in any Makefile.am (top-level,
# src/, man/) and no custom check target; automake's built-in empty
# `check` target is the only `make check` behavior.
upstream_check_command: ""

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# Consumer-side tests executed by conan create (L1)
test_package_tests:
  - file: test.sh
    description: "executes the packaged signed cdemud ELF with --help (GOption) and asserts the Usage/CDEmu usage output"
    command: "cdemud --help"

assertion_count: 2
