knowledge_gained:
- "cdemud 1.0.0 的 src/main.c 调用 g_type_init()（自 glib 2.36 起废弃 GOBJECT_DEPRECATED_IN_2_36，但 2.88 仍声明且链接可用）：#if !GLIB_CHECK_VERSION(2,36,0) 卫语句仅为消除 deprecation warning 的预防性保留，非功能必需；静态链接 cdemud 全闭包（glib/dbus/dbus-glib/libdaemon/libmirage/sndfile 全 .a）无符号缺口"
- "PKG_CHECK_MODULES 多模块组（dbus-1 + dbus-glib-1）用预置 DBUS_CFLAGS/DBUS_LIBS cache 变量整组覆盖，顺带绕开 dbus 包缺 dbus-1.pc 的问题；每个 *_LIBS 值自带 -Wl,--start-group/--end-group 全闭包，最终可执行文件静态链接与变量求值顺序无关"
- "构建期 glib-genmarshal / dbus-binding-tool 直接从依赖包 bindir 注入 PATH（dbus-binding-tool 为 OHOS ELF，实测可执行）"

patch_generation:
