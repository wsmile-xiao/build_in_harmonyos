  source_orig_dir: /storage/Users/currentUser/tmp/builds/cdemu-daemon-1.0.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/cdemu-daemon-1.0.0
  generated_at: '2026-09-04'
