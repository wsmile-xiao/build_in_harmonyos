sources:
  url: "https://downloads.sourceforge.net/project/cdemu/cdemu-daemon/cdemu-daemon-1.0.0.tar.bz2"
  sha256: "182c569fb11c0dd3e3fea5dc26761fbc63005686455865d49f824177f5b107e0"

patches:
  - patch_file: "patches/0001-config-guess.patch"
    patch_description: "Recognize HarmonyOS: emit aarch64-unknown-linux-ohos with echo+exit (E007 autotools OHOS patch set, 2007-era config.guess form)"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub.patch"
    patch_description: "Accept linux-ohos kernel-OS combination in config.sub whitelist (E007 + libdaemon 0.14 same-era form)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: create private tmp dirs with umask 022; HMDFS rejects self-writes under umask 077"
    patch_type: "portability"
  - patch_file: "patches/0004-src-main-c.patch"
    patch_description: "src/main.c: guard g_type_init() with GLIB_CHECK_VERSION(2,36,0); g_type_init is deprecated since glib 2.36 (GOBJECT_DEPRECATED_IN_2_36) but still declared and linkable in glib 2.88, so the guard only avoids the deprecation warning"
    patch_type: "portability"
