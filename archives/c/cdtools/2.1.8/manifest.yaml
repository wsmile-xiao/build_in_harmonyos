software: cdtools
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游真实最新版 2.1.8——用户给 1.0.0 不合法按真实版）
version: "2.1.8"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-27"

# 构建系统标识（verify-build 要求）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（hinterhof.net 官方，HTTPS——R12 供应链安全要求）
  url: "https://hinterhof.net/cdtool/dist/cdtool-2.1.8.tar.gz"

  # 源码校验和
  sha256: "73de81ea2de2eae64b888e1b2739ef643ccea13c79790569f8e6278369976a21"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 构建系统标识（verify-build 要求）
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/"
    - "--bindir=${prefix}/bin"
    - "--mandir=${prefix}/share/man"

  # 编译依赖列表（cdtools 零第三方依赖——socket 系统库 + 系统头
  # getopt/mntent/linux/cdrom.h，OHOS sysroot 全有）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "cdtools（上游 cdtool）是 C 语言 CD-ROM 音频控制工具集（cdplay/cdstop/cdeject/cdctrl 等单程序多名字）——autotools 构建，零第三方依赖（socket 系统库 + 系统头），OHOS 上 configure 需 TMPDIR 指向可写目录（/tmp 只读，cdrecord 同款）"
    - "上游无独立测试目录（cdtool 是 CD-ROM 音频控制工具，运行需光驱——OHOS 无，如实记录）；消费测试验证 bin/cdtool + --version 真实运行"
