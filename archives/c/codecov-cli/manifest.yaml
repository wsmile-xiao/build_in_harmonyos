software: codecov-cli
display: "codecov-cli"
description: "Command-line uploader for Codecov code coverage reporting service"
category: dev
homepage: "https://github.com/codecov/codecov-cli"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Node.js/TypeScript CLI tool, npm build + shell wrapper"
    - "npm install --ignore-scripts, npm run build (tsc), npm prune --omit=dev"
    - "Shell wrapper script in bin/codecov for Node.js invocation"
  common_dependencies:
    - nodejs

versions:
  "0.8.0":
    status: built
    build_date: "2026-05-27"