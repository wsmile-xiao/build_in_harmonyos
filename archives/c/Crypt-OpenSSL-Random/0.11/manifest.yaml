software: Crypt-OpenSSL-Random
version: "0.11"
status: built  # XS 模块编译成功，需 HNP 安装
publish_status: built
category: perl
build_system: perl_makefile
license: perl_artistic

# 编译信息
compile_date: 2026-06-16
compiler: clang 18.1.8
perl_version: 5.42.0
openssl_version: 1.1.1w

# 依赖关系
dependencies:
  runtime:
    - perl (>= 5.006)
    - openssl/1.1.1w
  build:
    - perl
    - openssl

# 构建选项
configure_options:
  - "LIBS=-L/storage/Users/currentUser/usr/local/lib -lssl -lcrypto"
  - "INC=-I/storage/Users/currentUser/usr/local/include"
make_options:
  - "LDDLFLAGS=-shared -nostartfiles -nodefaultlibs -lc"

# 源码信息
source:
  url: "https://cpan.metacpan.org/authors/id/R/RU/RURBAN/Crypt-OpenSSL-Random-0.11.tar.gz"
  sha256: ""
  tar_format: tar.gz

# 平台适配
platform_notes: |
  Crypt::OpenSSL::Random 是 XS 模块，需要 OpenSSL 库链接。

  鸿蒙平台适配：
  1. CRT 文件缺失：使用 -nostartfiles -nodefaultlibs -lc 绕过
  2. OpenSSL 路径：显式指定 LIBS/INC 参数
  3. SELinux HMDFS 限制：XS 模块无法在 HMDFS 加载

  编译成功，运行时需 HNP 包安装到系统目录。

# 质量门禁
quality_checks:
  g0_clean_build: pass
  g1_binary_integrity: pass  # Random.so ELF 正确
  g2_functional: warn  # SELinux 限制
  g3_portability: pass
  g4_archive: pass

# 产物信息
artifacts:
  package: none
  xs_module: Random.so (13696 bytes)
  pm_module: Random.pm (3132 bytes)
  patches: 0

# 知识提取
knowledge_gained:
  - OpenSSL XS 模块编译需要 -nostartfiles -nodefaultlibs -lc
  - 需显式指定 LIBS/INC 参数（pkg-config）
  - SELinux HMDFS 限制 XS 模块加载
  - Crypt::OpenSSL::RSA 依赖此模块