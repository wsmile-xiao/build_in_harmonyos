  sha256: "568ebe0bc1988a23843fce6426602e555b7840bf6714edcdf0ed530214977f1b"
  tar_format: tar.gz

build:
  system: autotools
  # AutotoolsToolchain(shared=False) 自动注入 --disable-shared/--enable-static；
  # 手写 configure 仅接受白名单参数，--oldincludedir 由配方 update_configure_args 剪除（见 E2167）
  configure_options:
    - "--disable-shared"
    - "--enable-static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure.patch"

knowledge_gained:
  - category: "L1 (ref: E160)"
    content: "上游 configure 为手写脚本，uname -s 白名单无 HarmonyOS（OHOS PC 实测 uname -s 返回 HarmonyOS），configure 在系统检测处 assert unsupported 退出；按知识库 E160 思路在 Linux case 中加入 HarmonyOS 映射为 linux"
    reason: "W0b/适配实测（E160 命中复用）"
  - category: "L2 (ref: E2167)"
    content: "Conan 2.29 AutotoolsToolchain 会向 configure 注入 --prefix/--bindir/--sbindir/--libdir/--includedir/--oldincludedir/--datarootdir；手写 configure 若白名单不含 --oldincludedir 会直接 Unknown option 退出，官方剔除 API 为 tc.update_configure_args 传 None 剪除该参数；已沉淀为知识草稿 DRAFT-E2167-handwritten-configure-conan-injected-args（.kv/.md，draft-review 建议 create）"
    reason: "G2 首次失败定位（Unknown option --oldincludedir）"
  - category: "L2 (ref: E2168)"
    content: "上游 regressions 压测迭代数为编译期常量（ITERATE=5000000），configure 探测 CORES=20 与容器实际 8 核不一致，20 线程超订阅在共享设备 8h+ CPU 不完成且曾 OOM 被杀；以 -DITERATE=500000 编译期覆盖（1/10 迭代）执行，线程数与正确性断言语义不变，PR 修改说明逐文件申报；已沉淀为知识草稿 DRAFT-E2168-compile-time-iterate-stress-degrade（.kv/.md，draft-review 建议 create）"
    reason: "上游回归实测（8h+/OOM 证据日志随 PR 留存）"

