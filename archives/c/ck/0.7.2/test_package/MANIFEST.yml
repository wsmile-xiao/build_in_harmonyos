# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ck/0.7.2
homepage: "http://concurrencykit.org"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make -C regressions check"

upstream_tests:
  - name: "regressions/ make check validate 套件（25 个模块）"
    count: "90"
    description: "上游 regressions/Makefile 的 check 目标按 DIR 循环注册 25 个模块，共 90 个 validate 正确性测试程序（静态逐项计数）；ck_rwcohort 另有 3 个 validate 程序仅纳入 all 编译目标、未注册进 check，上游官方套件不执行，故不计入分母（benchmark 目标同样仅编译不执行）；OHOS 设备实测结果见 notes.md 与 PR 正文"

test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 libck 的 ck_hs API（init/put/count/get/重复拒绝/remove/destroy，含行为断言）"
    command: "ctest（conan create 自动执行，1/1 passed）"

assertion_count: 8
