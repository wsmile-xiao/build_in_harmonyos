version: "2.6.0"
software: "courier-unicode"
status: built
build_date: "2026-09-08"
build_system: "autotools"

source:
  url: "https://downloads.sourceforge.net/project/courier/courier-unicode/2.6.0/courier-unicode-2.6.0.tar.bz2"
  sha256: "0aed2349c5b62de0d33ccf8c23527aae41daf95a03c8054c88de4faef8da8a08"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--enable-static --disable-shared (shared=False, OHOS 默认静态)"
  dependencies:
    - "libiconv/1.17.1 (OHOS only, GNU strict-EILSEQ iconv for unicodetest test1; explicitly wired via AutotoolsDeps + extra -I/-L, recode precedent; Linux uses libc iconv)"
  build_tool:
    name: autotools
    version: "上游自带 configure (Autoconf 2.72 生成, 无需 autoreconf)"
  cc: clang
  cxx: clang++
  compiler: clang
  parallelism: 1

patches_applied: []

knowledge_gained:
  - "courier-unicode 上游 make check 是自定义 check-am 目标(无 automake TESTS 注册): 3 个测试程序直接执行(unicodetest/enttest/normalizetest)加 65 个 unicodetest/graphemetest/biditest 驱动的 shell test 断言, 共 68 项可执行检查 (reference: archives/c/courier-unicode/2.6.0/notes.md 上游测试审计一节)"
  - "LineBreakTest.txt/WordBreakTest.txt/BidiTest.txt 数据文件未随发布包提供, 需从 unicode.org 另行下载, 上游 check-am 在所有平台均以 test -f 或 exit 0 自跳过该 4 个数据驱动套件 (reference: archives/c/courier-unicode/2.6.0/notes.md 上游测试审计一节)"
  - "2026 年版 config.guess/config.sub 尚不识别 HarmonyOS 三元组, 在 OHOS 上按 E007 规范补齐 aarch64-unknown-linux-ohos 识别(config.guess 加 HarmonyOS 分支, config.sub 加 ohos-linux/KERNEL-OS 内核列表三处), 锚点与 scripts/patch-autotools-ohos.pl 同源 (reference: knowledge/doc/E007.md)"
  - "configure 首行按 E165 规范为实际存在的 shell (预检 HMBS /bin/sh, CI worker /system/bin/sh 或 /data/service/hnp/bin/bash, 按文件探测), 并清理 configure 内硬编码的 profile bash 路径与 umask (reference: archives/c/cppi/1.18/conanfile.py)"
