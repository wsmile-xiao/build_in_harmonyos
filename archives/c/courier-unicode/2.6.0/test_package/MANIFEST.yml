# test_package/MANIFEST.yml — courier-unicode 2.6.0
# Upstream and consumer test declaration required by CI L0e.

package: courier-unicode/2.6.0
homepage: "https://www.courier-mta.org/unicode/"

upstream_tests_exist: true
upstream_test_audit: >
  Audit scope: courier-unicode-2.6.0 official SourceForge release tarball
  (courier-unicode-2.6.0.tar.bz2, 707445 bytes) plus Makefile.am and the
  generated Makefile.in. Upstream tests exist and are wired into `make check`
  via a custom check-am target (no automake TESTS registration, so there is
  no PASS/TOTAL summary line; any failing assertion aborts make with non-zero
  exit). noinst_PROGRAMS builds 9 test programs: unicodetest, graphemetest,
  linebreaktest, wordbreaktest, enttest, scripttest, biditest, biditest2,
  normalizetest. The runnable part in the release tarball is 3 direct program
  executions (./unicodetest, ./enttest, ./normalizetest) plus 65 shell `test`
  assertions driven by unicodetest (28, incl. 1023-byte long-string boundary
  cases), graphemetest (34, GB3-GB999) and biditest (3): 68 executable checks
  in total. Counting unit is one check-am check (one direct execution or one
  shell test assertion); the recipe counts both classes from the generated
  Makefile at build time instead of hardcoding. The 4 data-file regression
  suites (linebreaktest/wordbreaktest on LineBreakTest.txt/WordBreakTest.txt,
  biditest/biditest2 on BidiTest.txt) self-skip by upstream design when the
  unicode.org data files are absent (test -f ... || exit 0, see Makefile.am
  update-www-* targets); scripttest is built but not invoked by check-am.
  Conclusion: upstream tests exist and are fully executed in build() via
  `make check`; no_tests is not applicable.

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# Counting unit: one check-am check (direct test-program execution or single
# shell `test` assertion). Take-number command: build, then count
# `test "`./` occurrences plus bare ./unicodetest|enttest|normalizetest lines
# in the generated Makefile; `make check` exit 0 means all counted checks passed.
upstream_tests:
  - test_name: "unicodetest-direct"
    source: "courier-unicode-2.6.0/unicodetest.c"
    kind: unit
  - test_name: "enttest-direct"
    source: "courier-unicode-2.6.0/enttest.c"
    kind: unit
  - test_name: "normalizetest-direct"
    source: "courier-unicode-2.6.0/normalizetest.C"
    kind: unit
  - test_name: "unicodetest-shell-assertions"
    source: "courier-unicode-2.6.0/Makefile.am (check-am, unicodetest-driven)"
    kind: unit
  - test_name: "graphemetest-shell-assertions"
    source: "courier-unicode-2.6.0/Makefile.am (check-am, graphemetest-driven GB3-GB999)"
    kind: unit
  - test_name: "biditest-shell-assertions"
    source: "courier-unicode-2.6.0/Makefile.am (check-am, biditest-driven)"
    kind: unit

upstream_test_total: 68
upstream_test_passed: 68
upstream_test_failed: 0

# Consumer-perspective checks call real library APIs: case mapping uc/lc/tc,
# HTML entity named/numeric lookup, character classes
# (isalpha/isdigit/isspace/ispunct/islower/isupper), wcwidth, general
# category Lu lookup and the default charset query. Each CHECK prints
# PASS and any failure exits 1.
test_package_tests:
  - file: test_courier_unicode.c
    scenario: "consumer-api"
    description: >
      Build and run a Conan consumer against the packaged library covering
      case mapping, HTML entities, character classes, widths, general
      categories and the default charset query; 14 assertions, any failure
      exits non-zero.
    command: "./test_courier_unicode"
    assertions: 14

assertion_count: 14
