# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "cmake-extras 1.1 = 11 个 find_package config 模块（src/：CopyrightTest/CoverageReport/DoxygenBuilder/FormatCode/GMock/GSettings/IncludeChecker/Intltool/Lcov/QmlPlugins/gcovr）+ 5 个 deprecated include shim（modules/：EnableCoverageReport/FormatCode/QmlPlugins/UseDoxygen/UseGSettings），纯数据包无编译"
  - "1.1 的 CMakeLists 把 modules/ 装到 ${CMAKE_ROOT}/Modules/ —— DESTINATION 是运行中 CMake 自身安装目录的绝对路径，staged install 会绕过 CMAKE_INSTALL_PREFIX/DESTDIR 写出包外；上游 14eeaf8ed50b（Drop deprecated macros，进 1.4）删掉该规则，本配方把 shim 与 src/ 同置 share/cmake/ 等价迁移方向"
  - "1.1 无 git tag（GitLab 只有 1.5–1.10），版本坐标取 debian/changelog 的 Releasing 1.1+17.04.20170209 提交；gitlab 归档 URL 路径里写完整 40 位 sha 会被 CDN 判 403 challenge，短 sha 作 ref 可用且解包顶层目录名内嵌完整 sha"
  - "1.1 源码树无 LICENSE 文件，许可证全文只在 debian/copyright（LGPL-3, or at your option any later version）→ licenses/copyright"
  - "QmlPluginsConfig.cmake 在缺 qmlplugindump 时执行 msg(FATAL_ERROR ...) —— msg 不是 CMake 命令（上游笔误，find_package(QmlPlugins) 在无 Qt 环境必失败，且报的是 Unknown CMake command）；GMockConfig.cmake 硬编码 /usr/src/googletest 绝对路径，OHOS 无该路径"
