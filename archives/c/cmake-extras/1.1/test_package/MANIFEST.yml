# test_package/MANIFEST.yml — cmake-extras 1.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: cmake-extras/1.1
homepage: "https://gitlab.com/ubports/development/core/cmake-extras"
upstream_commit: "3073762359dd5f8d3c9c037c4ff4cf550d4b35f2"

# ── 上游测试套件：如实声明 ──────────────────────────────────────────
# 上游 CMakeLists.txt 只有两条 install(DIRECTORY ...)，没有 enable_testing()/
# add_test()/CTest 集成，也没有 Makefile（因此无 make check）：
#   取数：grep -cE 'add_test|enable_testing|include\(CTest\)|add_custom_target\(check' CMakeLists.txt
#         → 0
# 上游自带的 examples/*/CMakeLists.txt 会 add_test，但那些是「模块用法示例」，
# 由打包侧的 Debian autopkgtest 脚本驱动，不是上游自己的测试目标。
# 打包侧 debian/tests/ 下 5 个 autopkgtest 脚本逐条技术原因见
# archives/c/cmake-extras/1.1/notes.md（缺 licensecheck / doxygen /
# intltool-update / libclang-3.8 python 绑定 / 硬编码 /usr/src/googletest）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 消费者测试：R34 真实产物校验 + **在 HarmonyOS 真机上真跑 cmake
# 加载每个打包模块**（cmake -P 脚本模式，不触发编译器探测，只验证被打包的
# CMake 模块能否被下游 find_package()/include() 正确解析并交付其宏/函数）。
test_package_tests:
  - file: test_cmake_extras.py
    description: "35 条产物结构断言（share/cmake 目录 / 11 个模块目录 / 11 个 Config 文件 / 5 个 deprecated shim / 18 个 .cmake 计数 / share/cmake 下 27 个文件计数 / 9 个非 .cmake 伴生数据文件 / 2 个可执行位 / licenses 声明 LGPL / 无 examples 与 debian 越界安装）+ 35 条功能断言（在 HarmonyOS 上真跑 cmake -P：7 个模块 find_package 解析成功并交付各自 macro/变量、4 个 deprecated shim include 生效，另对 CopyrightTest / IncludeChecker / QmlPlugins 按上游缺陷与外部工具缺失的错误签名精确断言）"
    command: "python3 test_cmake_extras.py <package_folder>"

# 断言总数：70（结构 35 + 功能 35），全部在真机 conan create 中实跑
assertion_count: 70
