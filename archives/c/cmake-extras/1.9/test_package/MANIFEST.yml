upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（如实声明：上游无测试套件）
upstream_tests: []

# test_package 消费者测试（R34 真实产物校验：share/cmake/ 下模块目录存在 + 含真实 .cmake 文件）
test_package_tests:
