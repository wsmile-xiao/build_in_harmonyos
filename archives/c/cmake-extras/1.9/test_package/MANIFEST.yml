# test_package/MANIFEST.yml — cmake-extras 1.9
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: cmake-extras/1.9
homepage: "https://gitlab.com/ubports/development/core/cmake-extras"

# 上游测试套件：无（纯 CMake 模块集合，无编译、无测试套件——rule 1.2 如实声明）
