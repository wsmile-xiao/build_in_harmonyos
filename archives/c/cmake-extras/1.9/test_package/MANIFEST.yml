    description: "Verifies share/cmake/ contains expected CMake module dirs (CopyrightTest/GDbus/GSettings/Intltool/Vala/gcovr etc.) and at least one real .cmake file"
    command: "python3 test_cmake_extras.py"

# 断言总数：13（12 个期望模块目录存在 + 含 .cmake 文件）
assertion_count: 13
