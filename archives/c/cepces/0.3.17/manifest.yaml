software: cepces
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.3.17/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.17"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/openSUSE/cepces/archive/refs/tags/v0.3.17.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | python
  system: python
  build_system: python

  # 配置选项列表
  configure_options: []
  # Python包使用pip安装，无需configure选项

  # 编译依赖列表（格式: name/version）
  dependencies:
    - requests/2.32.3  # 已安装
    - cryptography/44.0.0  # 已安装
    - requests_gssapi/missing  # 缺失 - 需要先编译krb5
  # 缺失的系统依赖：
  # - krb5 (MIT Kerberos) - 需要编译
  # - gssapi (Python绑定) - 依赖krb5

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

