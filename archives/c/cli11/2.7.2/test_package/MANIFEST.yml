# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cli11/2.7.2
homepage: "https://github.com/CLIUtils/CLI11"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-tests"

upstream_tests:
  - name: tests/（Catch2 单元测试——24 个 ctest 用例，CMake CLI11_BUILD_TESTS=ON 构建）
    count: "24"
    description: "上游测试实测（rule 4，分母=全部 24 用例）：24 passed / 0 failed / 0 skipped（100%）——Catch2 依赖从 ohpcd catch2/2.13.10-r0 包缓存（hash 3725c0f0 匹配）、pthread_testcancel stub 注入（OHOS libc 缺失，与 commoncpp2 同源）"

test_package_tests:
  - file: test_cli11.py
    description: "R34：头文件存在 + 编译运行使用 CLI11 的 smoke（CLI::App 解析参数）"
    command: "python3 test_cli11.py <package>"

assertion_count: 2
