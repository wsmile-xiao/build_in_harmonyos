# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cpp-httplib/0.18.0
homepage: "https://github.com/yhirose/cpp-httplib"

# header-only 库，默认 HTTPLIB_TEST=OFF；消费者测试为 test_package 烟雾测试
upstream_check_command: ""
upstream_test_in_build: false

# 消费者测试程序
consumer_tests:
  - file: test.cpp
    description: "验证 httplib.h 可包含、Server/Client 可实例化"
    command: "test_cpp_httplib"
