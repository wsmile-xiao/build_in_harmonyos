package: cpp-httplib/0.41.0
homepage: "https://github.com/yhirose/cpp-httplib"

upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build -E '_Online|^UnixSocketTest[.]pathname$|^UnixSocketTest[.]PeerPid$|^UnixSocketTest[.]HostHeaderAutoSet$' --output-on-failure (OHOS; Linux uses only -E _Online)"

upstream_tests:
  - name: "cpp-httplib primary upstream GoogleTest suite"
    count: "662 source declarations; 497 CTest entries; 482 deterministic entries on Linux; 479 on OHOS"
    description: "The principal suite plus upstream fuzz smoke; excludes one optional libcurl interoperability case from the dependency-free feature profile, 15 _Online cases that require external hosts, and on OHOS exactly three pathname Unix socket tests unsupported by the HMDFS workspace"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer loopback HTTP GET test through the exported httplib::httplib CMake target"
    command: "test_package"
  - file: harmonyos_test.cpp
    description: "HarmonyOS-only aarch64 compile guard, uname probe, version check, URL parsing, and response API runtime test"
    command: "harmonyos_test (automatic when OHOS is runnable; HDC for cross builds)"

assertion_count: 22
