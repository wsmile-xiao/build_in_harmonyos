# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: coin3d/4.0.10-src
homepage: "https://github.com/coin3d/coin"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest (testsuite/CMakeLists.txt: add_test(NAME CoinTests COMMAND CoinTests))"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: CoinTests (testsuite/ 生成的单元测试二进制)
    source: coin3d-4.0.10-src/testsuite/
    description: "上游单元测试：源码 142 个文件内嵌 COIN_TEST_SUITE 块经 create_testsuite 展开为 145 个 *Test.cpp，BOOST_AUTO_TEST_CASE 注册 337 例（含 models/*.iv 107 文件场景回归 testCorrectFile 与 io/incorrect 15 损坏文件用例 testIncorrectFile）。真机直跑输出 [OK] 325 tests, 83466 checks（337-325=12 为 JS 引擎未启用时条件注册收缩，COIN_HAVE_JAVASCRIPT=OFF 上游条件编译语义）"
    command: "ctest --test-dir <build> --output-on-failure（conanfile.py build() 内真实执行，ctest 报告 100% tests passed, 0 failed out of 1）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试 test_coin3d：SoDB::init + SoCube 场景图包围盒断言(3) + .iv 序列化往返(SoWriteAction→SoInput→SoDB::readAll) + 字段恢复断言(3)，以退出码判定"
    command: "./test_coin3d（test() 显式 LD_LIBRARY_PATH 后直跑，实跑 PASS）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 83466
