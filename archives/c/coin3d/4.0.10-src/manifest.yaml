# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.0.10-src/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.0.10-src"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: "{BUILD_SYSTEM}"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/coin3d/coin/archive/refs/tags/v4.0.10.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cmake --install 的安装期 RPATH 改写产物会被 musl 严格加载器拒载（构建树原件可载，字节数同内容异）——package() 需用构建树原件覆盖安装副本，消费者侧再以 LD_LIBRARY_PATH 提供依赖目录"
  - "musl 忽略 DT_RUNPATH 且 conan 2 不向消费者注入 rpath——test_package 的 test() 必须显式聚合全部依赖包 lib 目录到 LD_LIBRARY_PATH"
  - "W3 预下载镜像优先（gh-proxy 对部分 GitHub URL 返回 1KB 错误页且 >100B 即视为有效缓存）——predl_cache 需预置正品 tarball 或确保 dlcache sidecar 登记全部注入后 URL"
  - "testsuite/TestSuiteUtils.cpp 以 _POSIX_C_SOURCE 判定 POSIX/WIN32 分支，musl+clang 在该检查点前不预定义——配方级 -D_POSIX_C_SOURCE=200809L 选 POSIX 分支（零补丁）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
