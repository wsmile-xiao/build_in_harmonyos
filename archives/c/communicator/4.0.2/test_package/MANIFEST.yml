# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: communicator/4.0.2
homepage: "https://invent.kde.org/maui/communicator"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# 上游 4.0.2 无任何测试套件：顶层无 tests//autotests/ 目录，CMake 无
# enable_testing/add_test/ECMAddTests，无 CTestConfig/CTestTestfile，
# 源码无 QTEST/QSignalSpy —— 原始扫描证据见 ../reports/upstream-test-scan.log，
# 结论见 ../notes.md「NO_UPSTREAM_TESTS 证据」一节。
upstream_check_command: "cmake --build . (上游未定义 check/test 目标)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（上游无测试套件，NOT_RUN/NO_UPSTREAM_TESTS）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "offscreen 冒烟：启动安装的 communicator 二进制验证 Qt 初始化与 QML 引擎加载"
    command: "QT_QPA_PLATFORM=offscreen communicator（rc 0/124 通过，参照 bambootracker 消费者模式）"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 0
