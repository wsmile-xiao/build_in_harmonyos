# conandata.yml — communicator 4.0.2
# KDE Maui 官方发布归档（download.kde.org），SHA-256 已在本地核验一致。

sources:
  url: "https://download.kde.org/stable/maui/communicator/4.0.2/maui-communicator-4.0.2.tar.xz"
  sha256: "60bc8b5b5f56d81229fccfe1fa52f256ff0b1326b6dc6eb62544939aa64d31fb"

patches:
  - patch_file: "patches/0001-optional-kpeople-capability.patch"
    patch_description: "Make KPeople an optional capability-detected dependency (find_package(KF6People CONFIG QUIET)); without it the app enumerates the shared vCard directory directly instead of via KPeople::PersonsModel"
    patch_type: "portability"
  - patch_file: "patches/0002-drop-kio-filebrowsing.patch"
    patch_description: "Drop upstream's unused KF6 KIO and MauiKit4 FileBrowsing requirements: no source uses their symbols, the published mauikit package ships no FileBrowsing component, and the kio/6.14.0 family's exact kcodecs/6.14.0 pin conflicts with kcontacts/6.18.0's exact kcodecs/6.18.0 pin in one Conan graph; the avatar file dialog in main.qml switches to QtQuick.Dialogs keeping the callback(paths) contract"
    patch_type: "portability"
  - patch_file: "patches/0003-harmonyos-desktop-branch.patch"
    patch_description: "Make the upstream desktop platform branches (elseif(UNIX) and the two if(UNIX AND NOT APPLE AND NOT ANDROID) gates) admit HarmonyOS (CMAKE_SYSTEM_NAME STREQUAL HarmonyOS) so find_package(KF6 COMPONENTS Contacts), the Widgets requirement, KDEInstallDirs and install(TARGETS) all execute on OHOS PC; CMake ships no Platform/HarmonyOS module and leaves UNIX unset, which previously skipped the branch (leaving KF6::Contacts undefined at generate time) and skipped the binary installation (empty package), and relocate the hardcoded absolute /usr/share/maui-accounts/manifests install destination into KDE_INSTALL_DATADIR (an absolute host path cannot be packaged by conan)"
    patch_type: "portability"
  - patch_file: "patches/0004-mauikit-include-root.patch"
    patch_description: "Add the MauiKit4 install include root to the target: the published MauiKit4 imported target only advertises <prefix>/include/MauiKit4/Core as INTERFACE_INCLUDE_DIRECTORIES while the sources include <MauiKit4/Core/...>; the include root previously arrived via the FileBrowsing component removed by patches/0002"
    patch_type: "portability"
  - patch_file: "patches/0005-optional-kemailclientlauncherjob.patch"
    patch_description: "Make KDE PIM's KEMailClientLauncherJob a capability (__has_include): when absent the mail functions fall back to the platform e-mail client via mailto: URLs, reusing upstream's own Android implementation and commented-out fallback; no new dependency is added"
    patch_type: "portability"
