# 版本级 manifest — communicator 4.0.2
# KDE Maui Communicator：Qt6/QML 联系人管理应用（纯可执行程序）
# HarmonyOS PC (aarch64) 适配；CMake + ECM + Qt6 构建

version: "4.0.2"
software: "communicator"
status: built
build_date: "2026-09-13"
build_system: cmake

source:
  url: "https://download.kde.org/stable/maui/communicator/4.0.2/maui-communicator-4.0.2.tar.xz"
  sha256: "60bc8b5b5f56d81229fccfe1fa52f256ff0b1326b6dc6eb62544939aa64d31fb"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON"
    - "-DWARNINGS_ARE_ERRORS=OFF"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
  dependencies:
    - qtbase/6.11.1
    - qtdeclarative/6.11.1
    - ki18n/6.14.0
    - kcoreaddons/6.14.0
    - kservice/6.14.0
    - kcontacts/6.14.0
    - mauikit/4.0.2.1
    - ecm/6.20.0 (tool_requires)
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-optional-kpeople-capability.patch"
  - "0002-drop-kio-filebrowsing.patch"
  - "0003-harmonyos-desktop-branch.patch"
  - "0004-mauikit-include-root.patch"
  - "0005-optional-kemailclientlauncherjob.patch"

knowledge_gained:
  - "Qt6 Widgets 无法裁剪：非 Android 分支 main.cpp 直接使用 QApplication（QtWidgets）"
  - "KPeople 可裁剪：仅 getContacts() 用于枚举联系人；改为 find_package(KF6People CONFIG QUIET) 能力探测 + 直扫 vCard 目录回退（上游自身注释代码即此路线）"
  - "kcontacts pin 需与 KF6 6.14 家族同轴：kcontacts/6.18.0（pin kconfig/kcodecs 6.18 族）与 mauikit/kio 6.14 族同图精确 pin 冲突（ci-run-3）；ohpcd 发布 kcontacts/6.14.0 后对齐解决（mauikit/kio 阻塞此前亦已解除）"
  - "上游无测试套件（无 tests/ 目录、无 enable_testing/add_test/ECMAddTests、无 CTestConfig），证据见 reports/upstream-test-scan.log"
  - "QML 应用冒烟：conan Qt 各包独立前缀且 qtbase 无 qml/ 目录，需显式 QML import path；且 conan self.run(env='conanrun') 不透传 env.apply 的 os.environ 变量——test_package 以命令行 CONAN_QML_IMPORT_PATH 传参、test.sh 导出 QML2_IMPORT_PATH/QML_IMPORT_PATH（ci-run-12/13/14）"
  - "mauikit 平台分支缺陷类：OHOS（CMAKE_SYSTEM_NAME=HarmonyOS，UNIX 未设）不进 elseif(UNIX AND NOT APPLE) → WindowShadow 等 QML 类型缺失；4.0.2 缺陷由 mauikit run 以 4.0.2.1 修复重发布，消费侧对齐 pin 即收敛"
