software: communicator
display: "Communicator"
description: "KDE Maui 联系人管理桌面应用（Qt6/QML 可执行程序，GPL-3.0-or-later）"
category: data
homepage: "https://mauikit.org"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯可执行 Qt6/QML 应用：conanfile 按 application 包处理，不声明 cpp_info.libs"
    - "KPeople 为可选能力（CONFIG QUIET 探测 + HAVE_KPEOPLE 开关 + vCard 直扫回退）"
    - "Qt6::Widgets 不可裁：非 Android 入口 main.cpp 使用 QApplication"
    - "KF_IGNORE_PLATFORM_CHECK=TRUE（OHOS 不在 KDE 平台列表）"
  common_dependencies:
    - qtbase
    - qtdeclarative
    - ki18n
    - kcoreaddons
    - kservice
    - kcontacts
    - mauikit
    - ecm

versions:
  "4.0.2":
    status: built
    build_date: "2026-09-29"
    conan_ref: "communicator/4.0.2"
