package: cfgv/3.4.0
homepage: "https://github.com/asottile/cfgv"

# 上游测试命令 — cfgv 上游使用 pytest
upstream_check_command: "python3 -m pytest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/cfgv_test.py
    source: cfgv-3.4.0/tests/cfgv_test.py
    description: "上游 pytest 测试套件 — validate/Map/Required/Optional/Conditional/Array/load_from_filename"
    command: "python3 -m pytest tests/cfgv_test.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: 模块导入 + validate/Map/Required/Optional + ValidationError 抛错验证"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
