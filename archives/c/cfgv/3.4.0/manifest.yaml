version: "3.4.0"
software: "cfgv"
status: built
build_date: "2026-08-10"
build_system: setuptools
source:
  url: "https://github.com/asottile/cfgv/archive/refs/tags/v3.4.0.tar.gz"
  sha256: "a8a4e4ad5618b6e65af563b14f46ccb1e45f5725c3b733d0ba15bb2a3b5bf9fd"
  tar_format: tar.gz
build:
  system: setuptools
  configure_options:
    - "pip install . --prefix=$DEFAULT_PREFIX --no-deps"
  dependencies: []
  cc: ""
  cxx: ""
patches_applied: []
knowledge_gained:
  - "cfgv 是纯 Python 单文件模块（cfgv.py），使用 setuptools + setup.cfg 构建"
  - "cfgv 无运行时依赖，仅开发依赖（covdefaults/coverage/pytest）"
  - "pip install . --no-deps 不带 --no-build-isolation 构建：构建 Python 未预装 setuptools，让 pip 自动创建隔离环境并从 pypi.cnb.cool 源下载构建依赖（同 pyparsing 方案）"
