software: cyrus-sasl
version: "2.1.28.1"
status: built
build_system: autotools
source:
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"
build:
  options:
    - "--disable-sample"
    - "--disable-shared"
    - "--enable-static"
    - "--with-staticsasl"
    - "--with-dblib=none"
    - "--without external auth backends"
libs:
  - sasl2
requires: []
patches_applied:
  - "0001-configure-ohos-tempdir.patch"
  - "0002-lib-Makefile.in-copy-linksrcs.patch"
  - "0003-testsuite-use-int-for-getopt.patch"
test_package:
  type: cmake-consumer
  checks: 7
adaptation_paths:
  - A
notes:
  - "Packages core libsasl2 and disables service/back-end closures such as saslauthd, PAM, LDAP, SQL, Kerberos/GSSAPI, DB, OpenSSL, and DES."
  - "OHOS configure temp-dir and lib Makefile symlink adaptations are tracked as patches and applied from conandata.yml during source()."
  - "OHOS make/install script handling is passed through make variables; generated Makefiles are not rewritten during build/package."
  - "PR CI build #11317 initially failed before test_package execution because patch files were not exported; subsequent CI #11333 passed the Conan consumer test on recipe commit 65f19f2b."
