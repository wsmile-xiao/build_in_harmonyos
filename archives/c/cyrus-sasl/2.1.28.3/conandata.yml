patches:
  - patch_file: "patches/0001-configure-ohos-writable-tempdir.patch"
    patch_description: >-
      autoconf temp-dir creation umask 077 -> 022; on the HarmonyOS HMDFS
      build tree a 0700 ./confXXXXXX directory is not writable, so
      config.status fails with "can't create ./confXXXXXX/subs1.awk:
      Permission denied".
    patch_type: portability
