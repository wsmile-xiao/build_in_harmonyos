package: cyrus-sasl/2.1.28.3
homepage: "https://www.cyrusimap.org/sasl/"

# Upstream test inventory (R51). The release tarball registers no automake
# test harness: `make check` expands to nothing (no check_PROGRAMS/TESTS in
# Makefile.am / utils/Makefile.am). The programmes below are EXTRA_PROGRAMS /
# sample code and are not wired into `make check`.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "(none - upstream make check has no registered tests)"

upstream_tests:
  - file: utils/testsuite.c
    source: cyrus-sasl-2.1.28.tar.gz
    description: >-
      Standalone libsasl2 harness (EXTRA_PROGRAMS). Its first check is
      sasl_checkpass() against auxprop_plugin=sasldb for a hard-coded user,
      which requires a real sasldb backend plus a seeded database. This
      package ships --with-dblib=none, so the harness cannot pass here
      without a disposable --enable-auth-sasldb --with-dblib=lmdb test tree.
    command: "(not built)"
  - file: saslauthd/testsaslauthd.c
    source: cyrus-sasl-2.1.28.tar.gz
    description: >-
      Client for the saslauthd daemon. The daemon needs PAM/shadow and a
      writable AF_UNIX socket directory; this recipe ships
      --without-saslauthd (daemon is not part of the library).
    command: "(not built)"
  - file: sample/client.c
    source: cyrus-sasl-2.1.28.tar.gz
    description: >-
      Interactive sample client, calls getpass() which musl removed;
      built with --disable-sample.
    command: "(not built)"
  - file: utils/smtptest.c
    source: cyrus-sasl-2.1.28.tar.gz
    description: SMTP negotiation sample requiring a live server; EXTRA_PROGRAMS only.
    command: "(not built)"

test_package_tests:
  - file: test_cyrus_sasl.c
    description: >-
      Consumer of the packaged libsasl2: asserts sasl_version_info 2.1.x,
      sasl_client_init with callbacks, sasl_client_new, sasl_listmech, and
      that the packaged PLAIN and CRAM-MD5 plugins were dlopen'ed.
    command: "./test_cyrus_sasl"

assertion_count: 4
