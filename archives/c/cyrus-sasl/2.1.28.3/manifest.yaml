version: "2.1.28.3"
software: cyrus-sasl
status: built
build_date: "2026-09-18"
conan_ref: "cyrus-sasl/2.1.28.3"

source:
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--enable-shared"
    - "--disable-static"
    - "--with-dblib=none"
    - "--without-saslauthd"
    - "--disable-sample"
    - "--disable-gssapi"
    - "--disable-ldapdb"
    - "--disable-krb4"
    - "--disable-sql"
    - "--without-openssl"
    - "--without-des"
    - "--without-pam"
    - "--without-pwcheck"
    - "--without-authdaemond"
    - "--without-ldap"
    - "--without-mysql"
    - "--without-pgsql"
    - "--without-sqlite"
    - "--without-sqlite3"
    - "--without-opie"
    - "--without-gdbm"
    - "--disable-ntlm"
    - "--disable-srp"
    - "--disable-srp-setpass"
    - "--disable-otp"
    - "--disable-login"
    - "--disable-staticdlopen"
    - "--disable-sia"
    - "--disable-passdss"
    - "--disable-httpform"
    - "--disable-alwaystrue"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-ohos-writable-tempdir.patch"

artifacts:
  shared_lib: "lib/libsasl2.so.3.0.0 (SONAME libsasl2.so.3)"
  plugins:
    - "lib/sasl2/libanonymous.so.3.0.0"
    - "lib/sasl2/libcrammd5.so.3.0.0"
    - "lib/sasl2/libdigestmd5.so.3.0.0"
    - "lib/sasl2/libplain.so.3.0.0"
  executables: []

knowledge_gained:
  - "autoconf 在 HMDFS 构建目录下用 umask 077 建 ./confXXXXXX，该 0700 目录不可写，config.status 报 Permission denied；补丁改为 umask 022"
  - "发行 tarball 的 configure.ac 比 aclocal.m4 新时 make 会重跑 aclocal/automake（OHOS 无 automake → Error 127），需把源码树 mtime 归一"
  - "HMDFS 构建目录无法创建 GNU make jobserver FIFO（mkfifo EPERM），必须 make -j1"
  - "configure 的 AC_PROG_CC_FOR_BUILD 只搜 gcc/cc/cl.exe，需显式喂 CC_FOR_BUILD=clang"
  - "tarball 的 config.guess(2018) 不识别 uname=HarmonyOS，需显式 --build/--host=aarch64-unknown-linux-gnu"
  - "conan rm() 默认 recursive=False：删除 lib/**/*.la 必须显式 recursive=True，否则插件 .la 残留并泄漏构建机绝对路径"
  - "上游 bin/pluginviewer 等可执行文件需在 package() 内清除；纯库包（package_type=library）不得声明 commands.json（R38/PF8）"
