software: cyrus-sasl
display: "Cyrus SASL"
description: "SASL authentication framework and libsasl2 library"
category: security
homepage: "https://www.cyrusimap.org/sasl/"
license: BSD-Attribution-HPND-disclaimer
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools project; the release tarball's config.guess predates HarmonyOS, so configure needs an explicit --build/--host triplet, and autoconf's temp-dir umask 077 must become 022 (on HMDFS a 0700 ./confXXXXXX directory is not writable)."
    - "External authentication backends and daemons (saslauthd, PAM, LDAP, SQL, Kerberos/GSSAPI, GDBM, OPIE, DES) are disabled to avoid platform/service dependency chains; OpenSSL is not needed because DIGEST-MD5/CRAM-MD5 use the bundled MD5/HMAC-MD5."
    - "The source tree's autotools timestamps are normalised and make runs with -j1 (HMDFS cannot create the GNU make jobserver FIFO; automake is absent)."
    - "Recipe-family choice per version: 2.1.28.1 packaged a static core; 2.1.28.3 packages a shared libsasl2.so.3 plus dlopen'ed mechanism plugins (SASL_PATH exported through the Conan run environment) with zero conan runtime dependencies. Per-version detail lives in each version's notes.md."
  common_dependencies: []

versions:
  "2.1.28.3":
    status: built
    build_date: "2026-09-18"
    conan_ref: "cyrus-sasl/2.1.28.3"
    notes: "Self-contained shared libsasl2.so.3 + 4 mechanism plugins (db_none, no conan runtime deps, DT_NEEDED=libc only); real conan create verified locally (W3 gates green, .ci-result.json exit_code=0); pure library package (no executables, no commands.json)."
  "2.1.28.1":
    status: built
    build_date: "2026-07-28"
    conan_ref: "cyrus-sasl/2.1.28.1"
    notes: "Recipe revision for the upstream 2.1.28 source; keeps the finalized OHOS patches and consumer test."
