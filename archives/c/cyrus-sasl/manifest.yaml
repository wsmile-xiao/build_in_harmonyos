software: cyrus-sasl
display: "Cyrus SASL"
description: "SASL authentication framework and libsasl2 library"
category: security
homepage: "https://www.cyrusimap.org/sasl/"
license: BSD-Attribution-HPND-disclaimer
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools project; first pass packages the core libsasl2 library with static mechanism support."
    - "External authentication backends and daemons are disabled to avoid PAM, LDAP, SQL, Kerberos, Berkeley DB, and platform account-service dependency chains."
    - "Dynamic plugin loading is avoided in the default package so OHOS validation does not depend on runtime plugin search paths."
  common_dependencies: []

versions:
  "2.1.28.1":
    status: built
    build_date: "2026-07-28"
    notes: "Recipe revision for the upstream 2.1.28 source; keeps the finalized OHOS patches and consumer test."
