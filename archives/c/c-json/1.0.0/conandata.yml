# conandata.yml — c-json 1.0.0

sources:
  url: "https://github.com/c-util/c-json/archive/refs/tags/v1.0.0.tar.gz"
  sha256: "746371b9a752d4ecb8eef9e6022438cb772c88c4b636ff041b1eac3a02e311e2"

patches:
  - patch_file: "patches/0001-src-c-json-reader.c.patch"
    patch_description: "Flush memstream buffer before closing; OHOS libc fclose on memstream returns EBADF and drops unflushed data"
    patch_type: "portability"
  - patch_file: "patches/0002-src-json-validate.c.patch"
    patch_description: "Flush memstream buffer before closing in the json-validate test tool (same OHOS open_memstream quirk)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-meson.build.patch"
    patch_description: "Read version_scripts pc variable (underscore) for consistency with sibling c-util libraries; hyphenated names are not queryable by pkg-config 0.29"
    patch_type: "portability"
  - patch_file: "patches/0004-src-test-reader.patch"
    patch_description: "Use env shebang for the test-reader script; /bin/python3 does not exist on OHOS"
    patch_type: "portability"
