# test_package/MANIFEST.yml — c-json 1.0.0 上游测试声明
# 上游测试命令：meson test（默认配置，共 2 项，无跳过条件）

package: c-json/1.0.0
homepage: "https://github.com/c-util/c-json"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs --timeout-multiplier=20"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test-basic.c
    source: c-json-1.0.0/src/test-basic.c
    description: "test-basic——reader 的字符串转义/\\uXXXX 解码/数字词法等行为断言（69 处 assert）"
    command: "./build/src/test-basic"
  - file: src/test-reader
    source: c-json-1.0.0/src/test-reader
    description: "test-reader——python 脚本驱动 json-validate 遍历 test/ 下 317 个 JSON 样例校验判定"
    command: "./build/src/test-reader"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：字符串转义解码/数字词法边界/错误传播断言"
    command: "ctest --test-dir . --output-on-failure"

# 测试断言总数 (近似值, 用于质量评估；静态统计 assert( 出现次数)
# test-basic.c: 69；test-reader 为数据驱动脚本（317 个样例，无 assert）
assertion_count: 69
