# test_package MANIFEST — ccache 4.14
software: ccache
version: "4.14"
test_type: consumer

test_cases:
  - name: "ccache --version 可运行"
    command: "ccache --version | head -1"
    expected: "ccache version 4.14"
  - name: "真实缓存语义 (miss->hit)"
    command: "ccache clang -c _tp.c 两次, 校验 Misses=1 且 Hits=1"
    expected: "CONSUMER_CACHE_OK"

consumer_notes: |
  消费者用例通过已安装 ccache 公开 CLI（bin/ccache）编译 C 源两次，
  验证第一次 cache_miss、第二次 cache_hit 的可观察业务结果；
  不使用任何库私有头文件或内部测试目录。
