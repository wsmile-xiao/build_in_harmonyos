knowledge_gained:
  - "ccache 4.14 使用 C++20 std::ranges 算法，OHOS libcxx-ohos (LLVM 15.0.4) 不提供 all_of/any_of/equal，需替换为迭代器版"
  - "ccache 依赖通过 FetchContent (DEPS=DOWNLOAD) 管理，hiredis/xxhash/zstd 需预下载"
  - "unittest 中 hardlink/fifo/fallocate 用例在 HMDFS 文件系统上不可用，属平台限制"
  - "产物需 -ffile-prefix-map 消除构建机绝对路径（鸿蒙专项 T2 验证）"

