# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: cairomm/1.18.0
homepage: https://www.cairographics.org/cairomm/

# 上游测试情况：meson tests/ 7 个测试程序（test-context/test-font-face/test-font-options/
# test-matrix/test-scaled-font/test-surface/test-user-font）需 Boost Test(>=1.63) +
# fontconfig，OHOS 目标无 fontconfig 依赖且 cairo 无 png 模块 → -Dbuild-tests=false。
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试（消费者视角：头闭包编译 + dlopen 运行期可加载）
test_package_tests:
  - file: test_cairomm.cpp
    description: "编译 #include <cairomm/cairomm.h>（含 cairo/sigc++ 头闭包）+ dlopen libcairomm-1.16.so"
    command: "./test_probe"

assertion_count: 2
