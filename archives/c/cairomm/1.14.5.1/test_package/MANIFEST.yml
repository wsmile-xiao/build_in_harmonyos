# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cairomm/1.14.5.1
homepage: "https://www.cairographics.org/cairomm/"

# 上游测试命令 (meson test)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (cairomm 1.14.5 提供 23 个构建目标)
upstream_tests:
  - file: cairomm/context.cc
    source: cairomm-1.14.5/cairomm/context.cc
    description: "Cairo::Context 绑定（核心绘图 API）"
    command: "ninja"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：创建 ImageSurface + Context，填充矩形并验证尺寸"
    command: "./test_cairomm"

# 测试断言总数
assertion_count: 3
