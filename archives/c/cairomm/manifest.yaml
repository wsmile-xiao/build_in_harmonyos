software: cairomm
description: C++ binding for the cairo graphics library
category: graphics
website: https://www.cairographics.org/cairomm/
source: https://gitlab.freedesktop.org/cairo/cairomm
license: LGPL v2+
abi_series:
  - name: cairomm-1.0
    versions: ["<= 1.14.z"]
    used_by: ["gtkmm-2.4", "gtkmm-3.0"]
  - name: cairomm-1.16
    versions: [">= 1.16.0"]
    used_by: ["gtkmm-4.0"]
dependencies:
  required:
    - cairo >= 1.14.0
    - sigc++-3.0 >= 3.0.0
  optional:
    - pixman-1
    - freetype2
pkg_config_names:
  - cairomm-1.16
  - cairomm-ft-1.16
versions:
  1.18.0:
    status: built
    build_system: meson
    compiled_at: 2026-05-21
    notes: "Disabled examples/tests due to cairo-png unavailable"