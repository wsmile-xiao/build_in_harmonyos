# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cairomm/1.16.2
homepage: "https://www.cairographics.org/cairomm/"

# 上游测试命令 (meson test)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (cairomm 1.16.2 提供 7 个 Boost.Test 用例)
upstream_tests:
  - file: tests/test-context.cc
    source: cairomm-1.16.2/tests/test-context.cc
    description: "Cairo::Context 测试"
    command: "meson test"
  - file: tests/test-font-face.cc
    source: cairomm-1.16.2/tests/test-font-face.cc
    description: "Cairo::FontFace 测试"
    command: "meson test"
  - file: tests/test-font-options.cc
    source: cairomm-1.16.2/tests/test-font-options.cc
    description: "Cairo::FontOptions 测试"
    command: "meson test"
  - file: tests/test-matrix.cc
    source: cairomm-1.16.2/tests/test-matrix.cc
    description: "Cairo::Matrix 测试"
    command: "meson test"
  - file: tests/test-scaled-font.cc
    source: cairomm-1.16.2/tests/test-scaled-font.cc
    description: "Cairo::ScaledFont 测试"
    command: "meson test"
  - file: tests/test-surface.cc
    source: cairomm-1.16.2/tests/test-surface.cc
    description: "Cairo::Surface 测试"
    command: "meson test"
  - file: tests/test-user-font.cc
    source: cairomm-1.16.2/tests/test-user-font.cc
    description: "Cairo::UserFont 测试"
    command: "meson test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：创建 ImageSurface + Context，填充矩形并验证尺寸，确认 NEEDED libcairomm-1.16.so.1"
    command: "./test_cairomm"

# 测试断言总数
assertion_count: 3