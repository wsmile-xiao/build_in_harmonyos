# test_package/MANIFEST.yml — curtain/0.3
#
# 上游测试实证（2026-09-15，curtain-0.3 官方归档）：
# - configure.ac: 无 AM_TESTS / AC_CONFIG_TESTDIR / 测试相关宏
# - Makefile.am / src/Makefile.am / desktop/Makefile.am / docs/Makefile.am:
#   无 TESTS、无 check_PROGRAMS、无自定义 check 目标
# - 源码树无 test/ 或 tests/ 目录，无测试源文件
# → Curtain 0.3 上游无自动化测试套件（N=0），详见归档 notes.md。
#
# 消费者侧（test_package）以实测替代：真实运行包内置的 curtain_check
# （调用被测包编译出的 C 核心 API：拖拽几何状态机 + 缩放），并检查
# NAPI 模块链接、ArkUI 宿主工程负载与许可证（R34/R51）。

package: curtain/0.3
homepage: https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/ardesia/curtain-0.3.tar.gz

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: >-
      运行包内 bin/curtain_check（28 项断言：四边揭开/回盖几何、最小尺寸钳制、
      关闭热区、缩放正确性），校验 AArch64 ELF、libcurtain.so 的
      libace_napi.z.so 依赖、curtain_core.h、完整 harmony 适配树（CI CMake、DevEco
      工程、rawfile 幕布图）与许可证。
    command: "bash test.sh PACKAGE_DIR"

assertion_count: 16

manual_tests:
  - "签名 HAP 安装真机后：全屏幕布覆盖桌面"
  - "从边缘拖拽后幕布缩小，露出区域显示桌面"
  - "露出区域的点击由桌面响应（点击穿透），而不是幕布窗口"
  - "拖拽回盖恢复覆盖"
  - "点击右上角 X 后应用退出，可再次启动"
