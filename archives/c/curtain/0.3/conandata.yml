sources:
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/ardesia/curtain-0.3.tar.gz"
  sha256: "a361bf9edb85c35b9080458b9d68abae409825837f8a24207a9e62ea43950adb"

patches:
  "0.3":
    - patch_file: "patches/0001-harmony-CMakeLists.txt.patch"
      patch_type: "portability"
      patch_description: "Add the HarmonyOS CI/Conan CMake entry building the C core, the NAPI module and curtain_check."
    - patch_file: "patches/0002-harmony-README.md.patch"
      patch_type: "portability"
      patch_description: "Add the HarmonyOS adaptation README."
    - patch_file: "patches/0003-harmony-project-AppScope-app.json5.patch"
      patch_type: "portability"
      patch_description: "Add the ArkUI app scope manifest (bundle name, version, label, icon)."
    - patch_file: "patches/0004-harmony-project-AppScope-resources-base-element-string.json.patch"
      patch_type: "portability"
      patch_description: "Add the application label string resource."
    - patch_file: "patches/0005-harmony-project-AppScope-resources-base-media-background.svg.patch"
      patch_type: "portability"
      patch_description: "Add the app icon layered-image background asset (SVG)."
    - patch_file: "patches/0006-harmony-project-AppScope-resources-base-media-foreground.svg.patch"
      patch_type: "portability"
      patch_description: "Add the app icon layered-image foreground asset (SVG)."
    - patch_file: "patches/0007-harmony-project-AppScope-resources-base-media-layered_image.json.patch"
      patch_type: "portability"
      patch_description: "Add the layered application icon descriptor."
    - patch_file: "patches/0008-harmony-project-build-profile.json5.patch"
      patch_type: "portability"
      patch_description: "Add the DevEco product build profile (debug/release modes, no signing material)."
    - patch_file: "patches/0009-harmony-project-entry-build-profile.json5.patch"
      patch_type: "portability"
      patch_description: "Add the entry module build profile (CMake native options, arm64-v8a)."
    - patch_file: "patches/0010-harmony-project-entry-hvigorfile.ts.patch"
      patch_type: "portability"
      patch_description: "Add the entry module Hvigor build script."
    - patch_file: "patches/0011-harmony-project-entry-oh-package.json5.patch"
      patch_type: "portability"
      patch_description: "Declare the libcurtain.so NAPI module dependency for the entry module."
    - patch_file: "patches/0012-harmony-project-entry-src-main-cpp-CMakeLists.txt.patch"
      patch_type: "portability"
      patch_description: "Add the native build for the NAPI module and the curtain_check regression binary."
    - patch_file: "patches/0013-harmony-project-entry-src-main-cpp-check-curtain_check.c.patch"
      patch_type: "portability"
      patch_description: "Add the headless regression checker: 28 assertions on the upstream geometry and scaling."
    - patch_file: "patches/0014-harmony-project-entry-src-main-cpp-curtain_core.c.patch"
      patch_type: "portability"
      patch_description: "Add the ported curtain core (upstream callbacks.c geometry and utils.c scaling semantics)."
    - patch_file: "patches/0015-harmony-project-entry-src-main-cpp-curtain_core.h.patch"
      patch_type: "portability"
      patch_description: "Add the C core interface (rectangle state machine and scaled pixel buffer)."
    - patch_file: "patches/0016-harmony-project-entry-src-main-cpp-curtain_napi.cpp.patch"
      patch_type: "portability"
      patch_description: "Add the NAPI bridge (init/setSource/press/release/shouldQuit/getPixels)."
    - patch_file: "patches/0017-harmony-project-entry-src-main-cpp-types-libcurtain-Index.d.ts.patch"
      patch_type: "portability"
      patch_description: "Add the ArkTS type declarations for the libcurtain.so module."
    - patch_file: "patches/0018-harmony-project-entry-src-main-cpp-types-libcurtain-oh-package.json5.patch"
      patch_type: "portability"
      patch_description: "Declare the libcurtain.so typed module package."
    - patch_file: "patches/0019-harmony-project-entry-src-main-ets-entryability-EntryAbility.ets.patch"
      patch_type: "portability"
      patch_description: "Add EntryAbility: immersive fullscreen window setup, decor hidden, window API probe logs."
    - patch_file: "patches/0020-harmony-project-entry-src-main-ets-pages-Curtain.ets.patch"
      patch_type: "portability"
      patch_description: "Add the curtain page: C-core driven drag-to-peel, window move/resize and the close hot zone."
    - patch_file: "patches/0021-harmony-project-entry-src-main-module.json5.patch"
      patch_type: "portability"
      patch_description: "Add the entry module manifest (EntryAbility, 2in1 device type)."
    - patch_file: "patches/0022-harmony-project-entry-src-main-resources-base-element-color.json.patch"
      patch_type: "portability"
      patch_description: "Add light-theme UI color resources."
