      patch_type: "portability"
      patch_description: "Add the entry layered-image background asset (SVG)."
    - patch_file: "patches/0026-harmony-project-entry-src-main-resources-base-media-foreground.svg.patch"
      patch_type: "portability"
      patch_description: "Add the entry layered-image foreground asset (SVG)."
    - patch_file: "patches/0027-harmony-project-entry-src-main-resources-base-media-layered_image.json.patch"
      patch_type: "portability"
      patch_description: "Add a HarmonyOS host project file."
    - patch_file: "patches/0028-harmony-project-entry-src-main-resources-base-media-startIcon.svg.patch"
      patch_type: "portability"
      patch_description: "Add the application start icon (SVG)."
    - patch_file: "patches/0029-harmony-project-entry-src-main-resources-base-profile-backup_config.json.patch"
      patch_type: "portability"
      patch_description: "Add the backup/restore configuration."
    - patch_file: "patches/0030-harmony-project-entry-src-main-resources-base-profile-main_pages.json.patch"
      patch_type: "portability"
      patch_description: "Declare the Curtain page in the module page list."
    - patch_file: "patches/0031-harmony-project-entry-src-main-resources-dark-element-color.json.patch"
      patch_type: "portability"
      patch_description: "Add dark-theme UI color resources."
    - patch_file: "patches/0032-harmony-project-hvigor-hvigor-config.json5.patch"
      patch_type: "portability"
      patch_description: "Add the Hvigor build configuration."
    - patch_file: "patches/0033-harmony-project-hvigorfile.ts.patch"
      patch_type: "portability"
