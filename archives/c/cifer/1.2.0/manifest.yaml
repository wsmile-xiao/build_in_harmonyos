software: cifer
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# 构建系统类型（顶层）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/cifer/cifer-1.2.0.tar.gz"

  # 源码校验和
  sha256: "436816c1f9112b8b80cf974596095648d60ffd47eca8eb91fdeb19d3538ea793"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（make 参数）
  configure_options:
    - "CC=clang"
    - "CFLAGS=-Wall -pedantic -fPIC -O2 -I$DEFAULT_PREFIX/include"
    - "LINKLIBS=-L$DEFAULT_PREFIX/lib -lreadline"
    - "prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - readline/8.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Makefile 项目通过命令行覆盖 CC/CFLAGS 即可编译，无需修改源码"
  - "AArch64 平台 char 默认无符号（AAPCS），导致 fgetc() 返回 EOF(-1) 被存为 0xFF，== -1 比较失败（file2buffer bug）"
  - "readline 头文件在非标准路径时需添加 -I$DEFAULT_PREFIX/include"
  - "verify_build.py 检查顶层 build_system 字段，非嵌套 build.system"
  - "DESTDIR 模式需传 --install-prefix=$TEST_PREFIX/$DEFAULT_PREFIX 给 verify-build"
