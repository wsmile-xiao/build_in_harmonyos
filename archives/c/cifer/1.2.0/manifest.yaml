version: "1.2.0"
status: built
build_date: "2026-09-07"

source:
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/cifer/cifer-1.2.0.tar.gz"
  sha256: "436816c1f9112b8b80cf974596095648d60ffd47eca8eb91fdeb19d3538ea793"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - readline/8.3
    - ncurses/6.6
  cc: clang
  cxx: clang++

patches_applied:
  - "0002-readline-static-link.patch"
  - "cifer-dict shebang fix (inline in build())"

knowledge_gained:
  - "cifer 1.2.0 uses raw Makefile (no configure), builds in-source"
  - "readline depends on ncursesw (wide-char), must link -lncursesw -lformw -lmenuw -lpanelw"
  - "cifer-dict is a bash script; shebang /bin/bash fails on OHOS (no /bin/bash)"
  - "R33: Get compiler from self.conf.get('tools.build:compiler_executables') dict, not shell env"
  - "R26: Static link all system-name libs (readline, ncurses) via LDFLAGS=-static"
  - "cifer-dict shebang fix applied via load/save in build() for reliability on OHOS"
