software: consul-template
# 软件级 manifest 模板
# 文件位置: archives/c/consul-template/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件描述
description: "Consul Template is a daemon that renders Go template files using data from Consul"

# 主页
homepage: "https://github.com/hashicorp/consul-template"

# 许可证
license: MPL-2.0

# 类别（用于依赖排序）
# library | tool | utility | development | system
category: tool

# ============================================================
# 版本索引（软件级）
# ============================================================

# 已编译版本列表（按日期排序，最新在前）
versions:
  - version: "0.42.0"
    status: published
    build_date: "2026-05-25"
    build_system: custom
    configure_options:
      - "CGO_ENABLED=0"
      - "GOPROXY=https://goproxy.cn,direct"

# ============================================================
# 依赖关系（软件级）
# ============================================================

# 编译依赖（格式: software/version）
build_dependencies:
  - go/1.25.10

# 运行依赖（格式: software/version）
runtime_dependencies: []

# ============================================================
# 知识索引（软件级）
# ============================================================

# 相关知识图谱条目
knowledge_links: []

# ============================================================
# 元数据
# ============================================================

# 首次编译日期
first_compile: "2026-05-25"

# 最后更新日期
last_updated: "2026-05-25"