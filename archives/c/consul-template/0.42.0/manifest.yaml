software: consul-template
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.42.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.42.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# 编译日期（submit 自检要求字段）
compile_date: "2026-05-25"

# 构建系统类型（验证脚本必检字段）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/hashicorp/consul-template/archive/refs/tags/v0.42.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "GOPROXY=https://goproxy.cn,direct"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.25.10

  # 编译器
  cc: clang
  cxx: clang++

  # 备注：Go linker在HarmonyOS上因mmap权限问题无法工作
  # 使用HashiCorp官方预编译二进制(releases.hashicorp.com)
  build_method: prebuilt-binary

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-go.mod.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/consul-template-0.42.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/consul-template-0.42.0.work
  source_orig_hash: ab6cb2df1049713d
  source_work_hash: bcd2c77a409a7e5d
  generated_at: '2026-05-25T23:03:31'
  patches_count: 1

patch_classification:
  - file: 0001-go.mod.patch
    type: auto
    platform_only: True
    guard: 'pending'
