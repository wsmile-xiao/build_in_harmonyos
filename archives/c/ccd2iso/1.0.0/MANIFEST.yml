# MANIFEST — ccd2iso 1.0.0
# CloneCD image (.img) to ISO 9660 image file converter (Autotools, C)

# 软件级元数据
name: ccd2iso
version: "1.0.0"
description: "CloneCD image (.img) to ISO 9660 image file converter"
homepage: "https://ccd2iso.sourceforge.net/"
license: "GPL-2.0"
language: C
build_system: autotools

# 上游测试（无正式测试套件）
upstream_tests:
  - description: "上游无单元测试框架；CLI 工具（--version/--help 可运行性验证）"
    count: 0
    status: "N/A"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: conanfile.py
    description: "验证 ccd2iso 二进制可运行：--version 输出版本号、--help 输出用法（2 个断言）"
    command: "conan test"
