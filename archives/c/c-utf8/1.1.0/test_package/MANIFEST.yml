# test_package/MANIFEST.yml — c-utf8 1.1.0 上游测试声明
# 上游测试命令：meson test（默认配置，共 2 项，无跳过条件）

package: c-utf8/1.1.0
homepage: "https://github.com/c-util/c-utf8"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test-api.c
    source: c-utf8-1.1.0/src/test-api.c
    description: "API Symbol Visibility——导出符号与 libcutf8.sym 一致性"
    command: "./build/src/test-api"
  - file: src/test-basic.c
    source: c-utf8-1.1.0/src/test-basic.c
    description: "Basic API Behavior——ASCII/多字节/非法序列全量枚举校验（1/2/3 字节全枚举 + 文本样例）"
    command: "./build/src/test-basic"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：verify/verify_ascii 对纯 ASCII、合法多字节、非法序列、截断序列的推进/剩余断言"
    command: "ctest --test-dir . --output-on-failure"

# 测试断言总数 (近似值, 用于质量评估；静态统计 assert( 出现次数)
# test-api.c: 0（符号可见性以链接期验证为主） + test-basic.c: 17
assertion_count: 17
