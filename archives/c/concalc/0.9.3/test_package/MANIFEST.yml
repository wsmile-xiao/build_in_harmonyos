# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: concalc/0.9.3
homepage: "https://sourceforge.net/projects/extcalc-linux/"

# 上游 CMakeLists 无 ENABLE_TESTING/add_test，源码树无任何测试源码或脚本。
upstream_check_command: ""

# 上游无测试套件，因此 build() 中没有可集成的上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34: 实质驱动被测二进制)
test_package_tests:
  - file: test.c
    description: "-v 输出版本横幅 Version: 0.9.3"
    command: "./test_probe <concalc-bin>"
  - file: test.c
    description: "表达式求值 2*(3+7/2) = 13"
    command: "./test_probe <concalc-bin>"
  - file: test.c
    description: "表达式求值 1/3 = 0.333...(34 位精度)"
    command: "./test_probe <concalc-bin>"
  - file: test.c
    description: "函数求值 sqrt(2) = 1.4142135623730950488016887242097"
    command: "./test_probe <concalc-bin>"

# 测试断言总数 (test.c 中 check() 调用数)
assertion_count: 4
