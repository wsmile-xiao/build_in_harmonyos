# 软件级 manifest — concalc
# 遵循 ARCHIVE-SPEC v3.0

software: concalc
display: "concalc"
description: "Console version of the Extcalc calculator（终端科学计算器）"
category: math
homepage: "https://sourceforge.net/projects/extcalc-linux/"
license: GPL-2.0-or-later

build_system: cmake

ohos_adaptation:
  key_points:
    - "CMakeLists 声明 CMAKE_MINIMUM_REQUIRED(VERSION 2.4.3)，设备 cmake 4.x 已移除 <3.5 兼容；configure 传 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 解决，无需改上游源码"
    - "src/list.h 存在 *(T*)NULL 绑定引用的 UB 写法（-Wnull-dereference 告警 140 条），实际执行路径不触发，不改上游代码"
    - "命令行工具（无库产物），按 R38 声明 commands.json"
  common_dependencies: []

versions:
  "0.9.3":
    status: built
    build_date: 2026-09-08
