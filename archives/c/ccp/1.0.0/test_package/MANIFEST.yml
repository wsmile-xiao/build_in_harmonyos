# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ccp/1.0.0
homepage: "https://github.com/ccp-project/libccp"

# 上游测试命令 (用于 make -n check / ctest -N 分析)
upstream_check_command: "make test (unittest)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: unittest.c
    source: ccp-1.0.0/unittest.c
    description: "libccp 上游单元测试（mock datapath 驱动 ccp_init/connection/invoke/close 全流程）"
    command: "./unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：实质调用 ccp_init/ccp_connection_start/ccp_connection_lookup/ccp_set_impl/ccp_get_impl/write_ready_msg/ccp_connection_free/ccp_free"
    command: "./test_ccp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
