# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求）

package: cln/1.3.7
homepage: "https://www.ginac.de/CLN/"

# 上游测试命令：automake check 体系，tests/Makefile.am 的 ALL_TESTS = exam tests
upstream_check_command: "make check"

# conanfile.py build() 中未集成上游测试（保持 CI 时长可控；已在设备真机
# 全量执行，详见 test-report.md 与 notes.md）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（设备真机，签名后执行）
upstream_tests:
  - file: tests/exam.cc
    source: cln-1.3.7/tests/exam.cc
    description: "考试组：test_elementary（6 数型 × 5 运算 = 30 个数据表测试函数）+ gcd/xgcd/sqrtp/factorial/doublefactorial 5 个特殊测试，共 35 个叶子测试函数，全部通过"
    command: "./exam"
  - file: tests/tests.cc
    source: cln-1.3.7/tests/tests.cc
    description: "随机化属性测试组：test_I/test_MI/test_nt 3 组 × 默认 10000 轮 = 30000 轮全部通过"
    command: "./tests"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：2^100 乘法/移位双路径交叉核对、integer_length 位长、exquo 精确除、mod 模余、sqrt 回乘精度，5 处断言"
    command: "./consumer"

# 测试断言总数（消费者程序 1 个，5 处行为断言）
assertion_count: 5
