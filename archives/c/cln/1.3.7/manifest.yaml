# cln 版本级 manifest
# 位置: archives/c/cln/1.3.7/manifest.yaml

version: "1.3.7"
software: "cln"
status: published
build_date: "2026-09-09"
build_system: "autotools"

source:
  url: "https://www.ginac.de/CLN/cln-1.3.7.tar.bz2"
  sha256: "7c7ed8474958337e4df5bb57ea5176ad0365004cbb98b621765bc4606a10d86b"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--with-gmp=<gmp-prefix>"
    - "CONFIG_SHELL=/bin/sh"
    - "TMPDIR=$HOME/tmp"
  dependencies:
    - "gmp/6.3.0.1"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "configure 临时目录经 mktemp -d 创建（恒 0700、不经 umask）时，E011 的 umask 放宽无效：须改 mkdir -m 0777（cln r3/r4 vs r12 实证闭环）"
  - "VirtualRunEnv 聚合缺被测包自身 libdir：test() 显式前插 LD_LIBRARY_PATH"
