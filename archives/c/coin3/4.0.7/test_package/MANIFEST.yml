# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: coin3/4.0.7
homepage: "https://github.com/coin3d/coin"

# 上游测试命令 (cmake 注册的 CTest: CoinTests 可执行)
upstream_check_command: "ctest -R CoinTests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> -R CoinTests"

# 上游实际运行的测试程序 (testsuite/ 的 Boost.Test 套件, OHOS 上实测无错误)
upstream_tests:
  - file: testsuite/TestSuiteMain.cpp
    source: coin3-4.0.7/testsuite/TestSuiteMain.cpp
    description: "Coin 单元测试主入口 (Boost.Test, 覆盖 base/fields/nodes/actions/scxml 等)"
    command: "./CoinTests"
    result: "passed"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 初始化 SoDB、构建场景图、写回 buffer 验证 Cube 节点"
    command: "./test_coin3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
