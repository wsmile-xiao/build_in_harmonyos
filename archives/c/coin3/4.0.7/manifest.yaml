# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.0.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.0.7"

# 软件名
software: "coin3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/coin3d/coin/releases/download/v4.0.7/coin-4.0.7-src.tar.gz"

  # 源码校验和
  sha256: "a01276052c31e84e4a069ee4452eab3b65a7d101a3fd7a09803be59125616270"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCOIN_BUILD_GLX=OFF"
  - "-DCOIN_BUILD_EGL=ON"
  - "-DCOIN_BUILD_TESTS=ON"
  - "-DCMAKE_C_FLAGS=-D_POSIX_C_SOURCE=200809L"
  - "-DCMAKE_CXX_FLAGS=-D_POSIX_C_SOURCE=200809L"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - boost/1.90.0
  - gl4es/1.1.6
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
