# test_package/MANIFEST.yml — ctre 3.11.0
# CI L0e 要求此文件存在以声明上游测试来源。

package: ctre/3.11.0
homepage: "https://github.com/hanickadot/compile-time-regular-expressions"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "compile-time-regular-expressions v3.11.0 (https://github.com/hanickadot/compile-time-regular-expressions/archive/v3.11.0.tar.gz)"
  source_sha256: "7d4b30d0bdd8864a47cceb2ab8e7c4d1846f0ec62383f8c45122435d32f19530"
  build_system: "CMake"
  test_definition: >
    tests/CMakeLists.txt 对 tests/*.cpp 每个文件建一个 STATIC 库并挂到聚合目标
    ctre-test（EXCLUDE_FROM_ALL）；每个翻译单元全是编译期 static_assert，
    编译通过即测试通过。tests/benchmark* 不在默认目标内，不计入。
    计数口径：tests/*.cpp 文件数 = 25。
  dependency: "none (no external test framework; compiler-only, C++17)"
  portability_changes: []
  examples_note: "none"

upstream_check_command: "ls tests/*.cpp | wc -l"
upstream_test_in_build: true
upstream_test_command: 'cmake --build <build-folder> --target ctre-test'

# 计数单元：一个 tests/*.cpp 翻译单元 = 1 个上游用例（编译期断言集合）。
# 完整清单（v3.11.0 tag tests/ 目录）：
# __utf8, _bad_cycle, _fixed-string, _unicode, ci, cnttp, correct-conversion,
# gcc8, generating, gets, is_prime, many-of-same-proto, matching,
# matching2-msvc-greedy, matching2, matching3, mode, msvc, parsing, range,
# results, string, trampoline, wide-pattern, z_matching（共 25）。
upstream_tests:
  - name: "official-cmake-aggregate-ctre-test"
    command: 'cmake --build <build-folder> --target ctre-test'
    expected: "25/25 编译通过（含 tests/generating.cpp hexdec 高字节断言，原生平台自适应逻辑在 OHOS unsigned-char 上直接通过，无补丁）"
  - name: "official-make-aggregate"
    command: "make CXX=clang++ CXX_STANDARD=17 -k"
    expected: "25/25 编译通过（与 ctre-test 同源的上游 Makefile 聚合入口）"

upstream_test_total: 25
upstream_test_passed: 25
upstream_test_failed: 0

# test_package 测试(消费者视角)
test_package_tests:
  - file: test_package.cpp
    description: "CTRE 编译期匹配 static_assert + 运行时 search 子串 + 数字提取 + 命名捕获组(year/month)，OHOS aarch64 clang15 libc++ C++17"
    command: "./test_package"
    assertions: 4

assertion_count: 4
