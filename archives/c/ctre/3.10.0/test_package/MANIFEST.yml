# test_package/MANIFEST.yml — ctre 3.10.0
# CI L0e 要求此文件存在以声明上游测试来源。

package: ctre/3.10.0
homepage: "https://github.com/hanickadot/compile-time-regular-expressions"

# CTRE 上游测试: 编译期模板断言(25 个 tests/*.cpp), 由官方聚合入口 make/CMake ctre-test 驱动
upstream_check_command: "make CXX=clang++ CXX_STANDARD=17 -k -j20"
upstream_test_in_build: false
upstream_test_command: "make CXX=clang++ CXX_STANDARD=20 -k -j20"

upstream_tests:
  - name: "official-aggregate-cxx17"
    command: "make CXX=clang++ CXX_STANDARD=17 -k -j20"
    expected: "25/25 编译通过(含 tests/generating.cpp hexdec>=0x80, 由 0001-hexdec-char32-threshold-0x7f.patch 修复)"
  - name: "official-aggregate-cxx20"
    command: "make CXX=clang++ CXX_STANDARD=20 -k -j20"
    expected: "25/25 编译通过"
  - name: "cmake-ctre-test"
    command: "cmake --build build-u --target ctre-test -j20"
    expected: "25/25 编译通过"

# test_package 测试(消费者视角)
test_package_tests:
  - file: test_package.cpp
    description: "CTRE 编译期匹配 static_assert + 运行时 search 子串 + 数字提取, OHOS armv8 clang15 libc++ C++17"
    command: "./test_package"

assertion_count: 4
