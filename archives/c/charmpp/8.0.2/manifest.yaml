knowledge_gained:
- Charm++ 8.0 使用自带 buildcmake 驱动 CMake；-j 并行时峰值内存较高，本机以 <=8 并发构建
- OHOS musl 无 ucontext（getcontext/makecontext），线程后端改用 FCONTEXT（boost-context 自带 arm64 ELF asm）
- OHOS musl 不支持 fcntl F_SETOWN/O_ASYNC（SIGIO），须关闭异步 IO（CMK_ASYNC_NOT_NEEDED=1），否则 charmrun 启动的节点在 CmiStdoutInit 静默退出
- OHOS 无 /bin/bash，charmc/gathertree/testrun 等脚本 shebang 需指向 /data/service/hnp/bin/bash（E165）
- bash 在 /storage/... (HMDFS) 下 getcwd 失败，需 export PWD=<dir>（仅 bash 受影响，sh/python 正常）
- clang 不识别 .ci 文件扩展名（视为 linker input），.ci 预处理需 clang -E -P -x c++；且 clang 不支持 cpp 的 in/out 位置参数，需 -o
- conv-config.sh 在 conv-mach-opt.sh 之前固化 CMK_NATIVE_* 会拿到 gcc/g++ 默认值，-host 编译（conv-cpm）失败；须把 native 默认值移到 conv-mach-opt.sh 之后
- hwloc（charm 自带 contrib/hwloc）autotools 需 config.guess/config.sub 支持 aarch64-unknown-linux-ohos（含 linux-ohos 内核对）
- hwloc config.status 的 mktemp -d 目录在 HMDFS 不可写，mktemp wrapper(exit 1) 触发 mkdir fallback（open-mpi 先例）
- charm 构建对目标文件扩展名有 .o 假设（cmake/converse.cmake 复制 conv-static.c.o），HarmonyOS 未知平台时 CMAKE_C_OUTPUT_EXTENSION=.obj，需改用 ${CMAKE_C_OUTPUT_EXTENSION}
- charmrun mylogin() 依赖 getpwuid 或 `id` 命令；OHOS 均不可用时需回退 USER/LOGNAME 环境变量
- zlib（系统同名库）由制品仓 zlib/1.3.1 提供头文件；链接走 -lz（系统 libz.so 可解析）
- 上游 v8.0.2 tarball 的 CMake 工程版本号为 8.0.1（上游笔误），charmc -V 输出 Charm++ Version 80001
- OHOS 沙箱拒绝 process_vm_readv（EPERM）→ Charm++ zero-copy 特性不可用（上游测试 10 项失败）
- +processPerSocket 的 CPU 亲和性绑定路径（CmiInitCPUAffinity）在 OHOS 段错误

