sources:
  "8.0.2":
    url: "https://github.com/charmplusplus/charm/archive/refs/tags/v8.0.2.tar.gz"
    sha256: "d96af1e8dd33a1a16f98e7467cdad5fb75007a1d03e96cccdfc26051083815b0"

patches:
  "8.0.2":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "0001 add HarmonyOS to the CMake platform detection (Linux-like)"
      patch_type: "portability"
    - patch_file: "patches/0002-cmake-converse.cmake.patch"
      patch_description: "0002 use CMAKE_C_OUTPUT_EXTENSION when copying the conv-static object"
      patch_type: "portability"
    - patch_file: "patches/0003-contrib-hwloc-config-config.guess.patch"
      patch_description: "0003 teach the bundled hwloc config.guess about aarch64-unknown-linux-ohos"
      patch_type: "portability"
    - patch_file: "patches/0004-contrib-hwloc-config-config.sub.patch"
      patch_description: "0004 accept the linux-ohos kernel/OS pair in the bundled hwloc config.sub"
      patch_type: "portability"
    - patch_file: "patches/0005-src-arch-common-cc-clang.sh.patch"
      patch_description: "0005 preprocess .ci files with clang instead of the absent cpp binary"
      patch_type: "portability"
    - patch_file: "patches/0006-src-arch-netlrts-linux-arm8-conv-mach.h.patch"
      patch_description: "0006 use the fcontext thread backend and disable SIGIO async IO"
      patch_type: "portability"
    - patch_file: "patches/0007-src-conv-core-CMakeLists.txt.patch"
      patch_description: "0007 skip the ucontext thread variants on HarmonyOS"
      patch_type: "portability"
    - patch_file: "patches/0008-src-scripts-charmc.patch"
      patch_description: "0008 pass -o to the .ci preprocessor and use the hnp bash shebang"
      patch_type: "portability"
    - patch_file: "patches/0009-src-scripts-conv-config.sh.patch"
      patch_description: "0009 set CMK_NATIVE defaults after conv-mach-opt.sh selects the compiler"
      patch_type: "portability"
    - patch_file: "patches/0010-src-scripts-gathertree.patch"
      patch_description: "0010 point the gathertree shebang at the hnp bash"
      patch_type: "portability"
    - patch_file: "patches/0011-src-scripts-testrun.patch"
      patch_description: "0011 point the testrun shebang at the hnp bash"
      patch_type: "portability"
    - patch_file: "patches/0012-src-util-charmrun-src-charmrun.C.patch"
      patch_description: "0012 fall back to LOGNAME/USER when getpwuid/id is unavailable in charmrun"
      patch_type: "portability"
