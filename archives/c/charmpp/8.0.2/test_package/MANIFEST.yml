# test_package/MANIFEST.yml — charmpp 8.0.2
# 上游测试清点与实测（R51 三步法）
package: charmpp/8.0.2
homepage: "https://github.com/charmplusplus/charm"

# 上游测试命令：
#   在构建目录执行 make -C <arch>/tmp test TESTOPTS="++local"
#   （上游 CI 同命令，见 .github/workflows/ci.yaml）
upstream_check_command: 'make -C netlrts-linux-arm8-clang/tmp test TESTOPTS="++local"'

# 上游测试未集成进 conanfile.py 的 build()（Charm++ 上游测试为独立 make 目标）
upstream_test_in_build: false
upstream_test_command: 'make -k test TESTOPTS="++local"'

# 上游测试集清点（源码树 tests/）：
#   tests/charm++   34 个测试目录（Makefile DIRS；TESTDIRS 32 = DIRS − FTDIRS 2，展开 49 个用例）
#   tests/util       4 个测试目录
#   tests/converse   1 个测试目录
#   tests/ampi      12 个测试目录（本次只构建 charm++ target，未构建 AMPI → 不可运行）
#
# 实测（HarmonyOS PC aarch64，真机）：
#   tests/charm++：TESTDIRS 32/32 全部实跑（2 个 FTDIRS jacobi3d/jacobi3d-sdag 属上游
#     make test 默认不覆盖，本次未运行），49 个用例中 38 通过、11 失败
#     - 10 个失败为 zero-copy 系列（large_bcast / zerocopy_with_qd / direct_api /
#       zc_post_modify_size / dereg_and_nodereg / bcast_nonzero_root / pup_buffer /
#       post_and_match / bcast_subset_async / io_read）：
#       运行时 process_vm_readv 被 OHOS 沙箱拒绝（EPERM），zero-copy 机制依赖跨进程读取
#     - 1 个失败为 provisioning 的 ++processPerSocket 子用例：CmiInitCPUAffinity
#       段错误（OHOS CPU 亲和性/hwloc 绑定路径不可用），同目录另两个子用例通过
upstream_tests:
  - file: tests/charm++/megatest
    source: charm-8.0.2/tests/charm++/megatest
    description: "Charm++ 综合测试（chare array/group/迁移/归约/回调等），PASS"
    command: './charmrun ++local ./megatest'
  - file: tests/charm++/simplearrayhello
    source: charm-8.0.2/tests/charm++/simplearrayhello
    description: "mainchare + chare array 消息传递，PASS"
    command: './charmrun ++local ./hello'
  - file: tests/charm++/sdag
    source: charm-8.0.2/tests/charm++/sdag
    description: "SDAG（结构化 DAG）语法与调度，PASS"
    command: './charmrun ++local ./sdag'
  - file: tests/charm++/load_balancing
    source: charm-8.0.2/tests/charm++/load_balancing
    description: "负载均衡框架（含 lb_test/meta_lb_test），PASS"
    command: './charmrun ++local ./lb_test'
  - file: tests/charm++/reductionTesting
    source: charm-8.0.2/tests/charm++/reductionTesting
    description: "reduction 1D/2D/3D，PASS"
    command: './charmrun ++local ./reduction'
  - file: tests/charm++/chkpt
    source: charm-8.0.2/tests/charm++/chkpt
    description: "checkpoint/restart，PASS"
    command: './charmrun ++local ./chkpt'
  - file: tests/charm++/zerocopy
    source: charm-8.0.2/tests/charm++/zerocopy
    description: "零拷贝消息（依赖 process_vm_readv，OHOS 沙箱拒绝，10 个子用例失败）"
    command: './charmrun ++local ./large_bcast'
  - file: tests/charm++/provisioning
    source: charm-8.0.2/tests/charm++/provisioning
    description: "动态进程供给（默认与 ++processPerHost 子用例 PASS；++processPerSocket 因 CPU 亲和性段错误）"
    command: './charmrun ++local ./launch'

# test_package 中自带的测试（消费者视角验证，R34/R53）
test_package_tests:
  - file: test_hello.ci
    description: "mainchare + 1D chare array 消息传递；用打包的 bin/charmc 编译，直接运行 1 PE 与 charmrun +p2 两个进程运行，断言运行输出"
    command: 'charmc -language charm++ -o test_hello test_hello.ci test_hello.cpp && ./test_hello 5 && ./charmrun ++local +p2 ./test_hello 5'

# 测试断言总数（test_package/conanfile.py 中 assert 数量）
assertion_count: 8
