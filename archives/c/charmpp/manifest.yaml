software: charmpp
display: Charm++
description: Charm++ 并行编程运行时与编译器（netlrts 构建，含 charmc/charmrun 等命令行工具）
category: parallel
homepage: https://github.com/charmplusplus/charm
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
  - Charm++ 8.0 自带 buildcmake（CMake 包装脚本），目标 netlrts-linux-arm8 + clang
  - OHOS musl 无 ucontext，线程后端切换为 FCONTEXT（boost-context arm64 asm）
  - OHOS 不支持 SIGIO（F_SETOWN/O_ASYNC），关闭异步 IO（CMK_ASYNC_NOT_NEEDED=1）
  - 无 /bin/bash：charmc 等脚本 shebang 指向 /data/service/hnp/bin/bash
  - .ci 预处理改用 clang -E -P -x c++ -o（无 cpp 命令）
  - 自带 hwloc 的 config.guess/config.sub 支持 aarch64-unknown-linux-ohos
  - 依赖 zlib 仅用于构建期头文件/库探测与 -lz
  common_dependencies:
  - zlib/1.3.1

versions:
  8.0.2:
    status: built
    build_date: '2026-09-30'
    published_as: charmpp
    ci_verified: true
    functional_test: passed
