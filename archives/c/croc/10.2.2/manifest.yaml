software: croc
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/10.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "10.2.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/schollz/croc/archive/refs/tags/v10.2.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # Go 项目不需要 configure

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "go/1.26.0"

  # 编译器
  cc: go
  cxx: ""

  # 编译环境
  build_env:
    GOPROXY: "https://goproxy.cn,direct"
    CGO_ENABLED: "0"
    GOPATH: "$HOME/go"
    GOCACHE: "$TMPDIR/go-cache"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go 项目编译使用 'go build' 命令，无需 configure/make 流程"
  - "使用 GOPROXY=https://goproxy.cn 解决依赖包网络下载问题"
  - "CGO_ENABLED=0 进行纯静态编译，避免平台兼容性问题"
  - "鸿蒙系统可直接运行编译后的 Go 二进制，无需 ELF 签名"
  - "Go 1.26.0 可成功编译 croc v10.2.2"