software: catfishq
display: "catfishq"
description: "Cat FASTQ files - concatenate and filter zipped/unzipped FASTQ/FASTA (pure Python CLI)"
category: bioinformatics
homepage: https://github.com/philres/catfishq
license: MIT
build_system: pip

ohos_adaptation:
  key_points:
    - "Pure Python CLI (setup.py + console_scripts catfishq); conan recipe installs via pip --prefix into staging then copies to package"
    - "Runtime dependency pysam is pip-installed into site-packages (no conan requires); native .so signed with binary-sign-tool on OHOS"
    - "Upstream provides no automated test suite (only test/ fixture FASTQ data); adaptation adds consumer CLI tests on local fixtures"
  common_dependencies: []

versions:
  "1.4.0":
    status: built
    build_date: "2026-09-08"
    conan_ref: "catfishq/1.4.0"
