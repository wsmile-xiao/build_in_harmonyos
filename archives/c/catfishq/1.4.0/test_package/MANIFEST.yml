package: catfishq/1.4.0
homepage: "https://github.com/philres/catfishq"

upstream_tests_exist: false
upstream_test_audit:
  - source: "catfishq-1.4.0 sdist file list (PyPI + GitHub master)"
    reason: "No test_*.py, *_test.py, tests/ package, pytest.ini, tox.ini, or [tool:pytest] section; setup.py declares no tests_require."
  - source: "catfishq/test/ directory"
    reason: "Holds only fixture FASTQ data (test.fastq, test.channel.fastq, test.header.fastq, test_correct_headers.fastq.gz, subfolder/); no runner script or harness."
  - source: "README.md"
    reason: "Documents only manual CLI examples (catfishq test/ > test.fastq); no test invocation documented."
  - conclusion: "Upstream 1.4.0 provides no automated tests; recipe emits no_tests with this audit and covers behaviour with 6 new consumer cases."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_catfishq.py
    description: "catfishq --help mentions FASTQ and --version prints 1.4.0"
    command: "python3 test_catfishq.py <package>/bin/catfishq fixtures/"
  - file: test_catfishq.py
    description: "Concat single fixture file (2 reads, IDs preserved, non-empty output)"
    command: "catfishq -o single.fastq fixtures/a.fastq"
  - file: test_catfishq.py
    description: "Concat fixture directory (4 reads) and mixed plain+gz inputs (4 reads)"
    command: "catfishq -o merged.fastq fixtures/"
  - file: test_catfishq.py
    description: "Max-reads (-n 1) stops after exactly one read"
    command: "catfishq -n 1 -o one.fastq fixtures/"
  - file: test_catfishq.py
    description: "Min-length (-l 50) filters out the 4bp short read"
    command: "catfishq -l 50 -o filt.fastq fixtures/a.fastq"

assertion_count: 6
