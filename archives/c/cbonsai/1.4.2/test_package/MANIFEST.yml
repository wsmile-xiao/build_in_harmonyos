package: cbonsai/1.4.2
homepage: "https://gitlab.com/jallbrit/cbonsai"

# R51 upstream test inventory (evidence): the official source archive
# cbonsai-v1.4.2.tar.gz (sha256 75cf8449…5f5ab0) contains NO test suite —
# the project is a single C file (cbonsai.c) with a Makefile, man page
# source and shell completions.  Substantive verification is carried by
# test_package (below) and the recipe's actual build of the binary.
upstream_tests: []

test_package_tests:
  - file: conanfile.py (test())
    description: |
      Consumer-level execution of the INSTALLED tool:
      (1) `-h` prints usage and exits 0 (printf path, no ncurses screen);
      (2) `-p -s 42 -c '@:.' -b 0` — fixed seed + fixed leaf strings give a
          deterministic tree; output is non-empty and the custom leaf char
          '@' is rendered (>=10 occurrences); TERM/TERMINFO are pointed at
          the ncurses package's terminfo database because -p still goes
          through initscr();
      (3) the same command twice produces byte-identical output (seeded
          RNG determinism).
