# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: corrade/2020.06
homepage: "https://magnum.graphics/corrade"

# 上游测试命令 (corrade 为 CMake 构建, ctest 驱动)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试 (构建期未集成, 测试在归档验证阶段独立运行)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (代表性子集, 完整 87 目标见 notes.md 测试台账)
upstream_tests:
  - file: src/Corrade/Utility/Test/DirectoryTest.cpp
    source: corrade-2020.06/src/Corrade/Utility/Test/DirectoryTest.cpp
    description: "Utility 目录/文件 API 测试"
    command: "./UtilityDirectoryTest"
  - file: src/Corrade/Containers/Test/ArrayTest.cpp
    source: corrade-2020.06/src/Corrade/Containers/Test/ArrayTest.cpp
    description: "Containers Array 容器测试"
    command: "./ContainersArrayTest"
  - file: src/Corrade/PluginManager/Test/ManagerTest.cpp
    source: corrade-2020.06/src/Corrade/PluginManager/Test/ManagerTest.cpp
    description: "PluginManager 动态插件加载测试"
    command: "./PluginManagerManagerTest"

# test_package 中自带的测试 (消费者视角验证, 鸿蒙专项)
test_package_tests:
  - file: test.cpp
    description: "鸿蒙专项消费者测试: 验证 CORRADE_TARGET_OHOS 宏、String/Containers API 真实可用"
    command: "./test_corrade"

# 测试断言总数 (鸿蒙专项测试断言数; 上游全量见 notes.md: 1564/1571 通过)
assertion_count: 6
