patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "识别 OHOS/HarmonyOS 为类 UNIX 平台(定义 CORRADE_TARGET_OHOS),否则 CORRADE_TARGET_UNIX 未定义导致 unistd.h/readlink 等不可用"
    patch_type: "portability"
  - patch_file: "patches/0002-doc-snippets-CMakeLists.txt.patch"
    patch_description: "snippets-cpp2a 显式设置 CXX_STANDARD 20,避免 profile 全局 cppstd=17 抑制 -std=c++2a 导致 std::span 不可用"
    patch_type: "portability"
  - patch_file: "patches/0003-modules-UseCorrade.cmake.patch"
    patch_description: "OHOS 平台动态插件用 SHARED 而非 MODULE(musl 加载器要求符号在 DT_NEEDED 链内,且 CMake 禁止 MODULE 链接 MODULE)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-Corrade-Containers-Test-CMakeLists.txt.patch"
    patch_description: "Containers StlSpan 测试目标显式设置 CXX_STANDARD 20,避免 cppstd=17 下 std::span 不可用"
    patch_type: "portability"
  - patch_file: "patches/0005-src-Corrade-PluginManager-Test-animals-CMakeLists.txt.patch"
    patch_description: "OHOS 测试插件链接 CorradePluginManagerTestLib 及插件间依赖 Dog(musl 下 dlopen 符号解析需要显式链接)"
