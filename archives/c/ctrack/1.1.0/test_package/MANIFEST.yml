# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: ctrack/1.1.0
homepage: ""

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（官方 tag v1.1.0，6 个可执行用例 = 69 个 TEST_CASE）
upstream_tests:
  - file: test/test_basic.cpp
    source: ctrack-1.1.0/test/test_basic.cpp
    description: "12 个 doctest TEST_CASE：基础跟踪/统计语义"
    command: "./test_basic"
  - file: test/test_multithreaded.cpp
    source: ctrack-1.1.0/test/test_multithreaded.cpp
    description: "9 个 doctest TEST_CASE：多线程隔离"
    command: "./test_multithreaded"
  - file: test/test_nested.cpp
    source: ctrack-1.1.0/test/test_nested.cpp
    description: "10 个 doctest TEST_CASE：嵌套跟踪"
    command: "./test_nested"
  - file: test/test_statistics.cpp
    source: ctrack-1.1.0/test/test_statistics.cpp
    description: "14 个 doctest TEST_CASE：统计聚合"
    command: "./test_statistics"
  - file: test/test_results.cpp
    source: ctrack-1.1.0/test/test_results.cpp
    description: "12 个 doctest TEST_CASE：结果表"
    command: "./test_results"
  - file: test/test_edge_cases.cpp
    source: ctrack-1.1.0/test/test_edge_cases.cpp
    description: "12 个 doctest TEST_CASE：边界用例"
    command: "./test_edge_cases"

# test_package 中自带的测试 (消费者视角验证，R02: 全部真实调用 ctrack 公开 API)
test_package_tests:
  - file: test_package.cpp
    description: "消费者验证：compute_series/compute_product 经 result_get_tables/result_as_string 断言可观测结果"
    command: "./test_ctrack"
  - file: consumer_app.cpp
    description: "消费者用例：price_volatility/moving_average 经公开 API 断言条目与调用次数"
    command: "./consumer_app"
  - file: ohos_special_test.cpp
    description: "鸿蒙专项：单线程/4 线程隔离 + 作用域结束后取表的完整性断言"
    command: "./ohos_special_test"

# 测试断言总数 (69 上游 TEST_CASE + 3 消费者用例的可观测断言)
assertion_count: 72
