software: cargo-seek
display: "cargo-seek"
description: "A terminal user interface for searching, adding and installing cargo crates"
category: dev-tool
homepage: "https://github.com/tareqimbasher/cargo-seek"
license: MIT
build_system: cargo

ohos_adaptation:
  key_points:
    - "Pure Rust Cargo project, edition 2021"
    - "Defaults to aarch64-unknown-linux-ohos on OHOS, overridable via RUST_TARGET"
    - "OHOS fallback uses checksum-pinned Harmonybrew Rust 1.97.1, OpenSSL, zlib, and CA bottles"
  common_dependencies: []

versions:
  "0.1.0":
    status: built
    build_date: "2026-09-05"
    conan_ref: "cargo-seek/0.1.0"
