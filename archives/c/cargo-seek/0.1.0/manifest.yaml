software: cargo-seek
version: "0.1.0"
status: built
build_date: "2026-09-05"
build_system: cargo
conan_ref: "cargo-seek/0.1.0"

source:
  url: "https://github.com/tareqimbasher/cargo-seek/archive/refs/tags/v0.1.0.tar.gz"
  sha256: "d2d9b63d2ef7fe56d3c9c5045350b991d443ed9ca56c28ed72168a88ba97009e"
  tar_format: tar.gz

build:
  system: cargo
  configure_options:
    - "cargo build --release --locked"
    - "OHOS target: aarch64-unknown-linux-ohos (override with RUST_TARGET)"
    - "OHOS fallback: checksum-pinned Harmonybrew Rust 1.97.1, OpenSSL, zlib, and CA bottles"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "cargo-seek 0.1.0 is a pure Rust TUI CLI with one binary cargo-seek and no Conan dependencies."
  - "The recipe defaults to aarch64-unknown-linux-ohos and supports RUST_TARGET overrides."
  - "The OHOS runner image has no Rust/Cargo; four SHA256-pinned Harmonybrew arm64_ohos bottles provide an isolated fallback."
  - "The Harmonybrew cargo wrapper is repaired to execute local cargo.real; CA bundle is resolved for both preinstalled and fallback toolchains."
  - "The temporary Cargo config uses rsproxy sparse registry with retry/timeout and OHOS clang linker."
  - "Upstream CI runs cargo test --locked --all-features --workspace (zero tests in 0.1.0) plus fmt/clippy/docs; recipe runs only cargo build."
