software: cct
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游 tag 1.0.0——与清单一致）
version: "1.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"

# 构建系统标识（verify-build 要求）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Sife-shuo/cct tag 1.0.0 codeload）
  url: "https://codeload.github.com/Sife-shuo/cct/tar.gz/refs/tags/1.0.0"

  # 源码校验和
  sha256: "3ba658e18a0bca50bee3e16752ef827683ffb5208cf90a946b32a60ef9074eb5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建系统标识（verify-build 要求）
  build_system: custom

  # 配置选项列表（无——直接 clang++ 编译 main.cpp）
  configure_options: []

  # 编译依赖列表（格式: name/version）——纯标准库，无 Conan 依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无——纯标准库无需 patch）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "cct（C/C++ 进制/位运算 CLI 计算工具）纯标准库无依赖——clang++ 直接编译 main.cpp 即可，无 Makefile/CMake"
    - "上游测试 test/test.cpp（_cmd_parse 解析）实跑验证"
