software: csvq
display: "csvq"
description: "SQL-like query tool for CSV files (Go implementation)"
category: db
homepage: "https://github.com/mithrandie/csvq"
license: MIT
build_system: go

ohos_adaptation:
  key_points:
    - "Go 语言项目，CGO_ENABLED=0 go build 编译"
    - "无补丁，标准 Go 构建流程即可在 OHOS 上编译"
    - "Go 链接器在 HMDFS 上可能有权限问题（同其他 Go 项目）"
    - "SQL 查询引擎（WHERE、ORDER BY、聚合函数）功能验证通过"
  common_dependencies:
    - go >= 1.21

versions:
  "1.18.1":
    status: built
    build_date: "2026-06-12"