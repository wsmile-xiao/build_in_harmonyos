# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: crunch-dxtc/0.56.2
homepage: "https://github.com/DaemonEngine/crunch"

# 上游测试为 Python 驱动 harness（非 ctest/make check）：test/test.py 调用
# 刚构建出的 crunch 二进制与 example1/2/3，对 test/ 下自带 fixture 做
# png/tga/bmp/jpg/crn/dds/ktx 互转（约 91 次进程调用），再逐文件比对
# test/checksums.tsv（89 条 blake2b 记录，"files" 校验）并交叉比对重复
# 转换的一致性（"clones" 校验）。任一命令失败或校验不匹配即非零退出。
upstream_check_command: "python3 test/test.py"

# conanfile.py build() 方法中已集成上游测试（_run_upstream_tests）
upstream_test_in_build: true
upstream_test_command: "python3 test/test.py"

upstream_tests:
  - file: test/test.py
    source: crunch-unvanquished-0.56.2.tar.gz/test/test.py
    description: "上游官方测试 harness：7 组全格式互转（png/tga/bmp/crn/dds/ktx/jpg-to-all）+ tga/png/bmp/jpg 转 png/crn + example1/2/3 示例程序验证"
    command: "python3 test/test.py"
  - file: test/checksums.tsv
    source: crunch-unvanquished-0.56.2.tar.gz/test/checksums.tsv
    description: "89 个预期输出文件的 blake2b 校验和数据库（files 校验依据）"
    command: "python3 test/test.py"

# test_package 中自带的测试 (消费者视角验证, R34)
test_package_tests:
  - file: test_crn.cpp
    description: "消费者视角：8 项 libcrn 真实 API 检查（格式字符串/文件扩展名/块字节数/每纹素比特/DXT1 单块压缩解压往返/TGA fixture 生成）"
    command: "./test_crn"
  - file: test_crn.cpp (fixture) + crunch CLI
    description: "消费者视角：运行打包的 crunch 二进制（--help + test_input.tga 转 test_output.crn 真实转换，非空断言）"
    command: "crunch -file test_input.tga -out test_output.crn"

# 测试断言总数 (8 库检查 + --help + 真实转换 = 10, 与 HMBS_TEST_PACKAGE_RESULT discovered=10 一致)
assertion_count: 10
