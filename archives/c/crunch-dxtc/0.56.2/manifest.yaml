version: "0.56.2"
software: crunch-dxtc
status: built
build_date: "2026-09-10"
build_system: cmake

source:
  url: "https://github.com/DaemonEngine/crunch/archive/refs/tags/unvanquished/0.56.2.tar.gz"
  sha256: "1863f38c82c172ed2902e6b8201d7df86b298bcc9c415589bbf9b1e306b4851c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_CRUNCH=ON"
    - "-DBUILD_EXAMPLES=ON"
    - "-DBUILD_STATIC_LIBCRN=ON"
    - "-DINSTALL_STATIC_LIBCRN=ON"
    - "-DUSE_FAST_MATH=OFF"
    - "-DUSE_LTO=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-crn_mem-aligned-alloc.patch: posix_memalign 保证 CRNLIB_MIN_ALLOC_ALIGNMENT(16)，修复 OHOS/musl 上 crunch PNG->CRN 转换时 crnlib_free/realloc bad ptr 断言与 vector buf 失败"
  - "patches/0002-crnlib-h-missing-includes.patch: 公开头文件 inc/crnlib.h 补 #include <stddef.h>，修复严格 clang/libc++ 下独立 #include <crnlib.h> 报 NULL/size_t 未声明（test_package 复现）"

knowledge_gained:
  - "crunch-dxtc 上游是 DaemonEngine/crunch 的 unvanquished/0.56.2 标签（Debian crunch-dxtc 源码包跟踪该分支），非 BinomialLLC/crunch master"
  - "上游自带 Python 测试 harness（test/test.py + test/checksums.tsv 89 条记录），需用 CRUNCH_BUILD_DIR 指向构建目录运行，产物不污染源码树"
  - "USE_FAST_MATH=OFF 与上游 CI 一致，保证生成图像可复现，校验和才能跨平台比对"
  - "静态 libcrn 默认不 install，须同时开 BUILD_STATIC_LIBCRN + INSTALL_STATIC_LIBCRN；头文件上游不 install，配方手动 copy inc/*.h"
  - "examples 仅供 test.py 调用，不 install，不污染 bin/"
