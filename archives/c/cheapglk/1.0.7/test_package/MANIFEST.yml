# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: cheapglk/1.0.7
homepage: "https://github.com/erkyrath/cheapglk"

# 上游测试命令（用于 ctest -N / make check 分析）
# cheapglk 上游无单元测试/ctest 注册；Makefile 无 check/test 目标。
upstream_check_command: "make -n"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无自动测试，留空）
upstream_tests: []

# test_package 中自带的测试（消费者视角，调用真实 Glk API）
test_package_tests:
  - file: test.c
    description: "调用 glk_gestalt(gestalt_Version)，断言返回非 0"
    command: "./test_cheapglk"

# 测试断言总数
assertion_count: 1