software: cheapglk
display: "CheapGlk"
description: "An extremely minimal Glk implementation for Unix"
category: gfx
homepage: "https://github.com/erkyrath/cheapglk"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Unix Makefile 工程，无 configure、无 CMake、无依赖"
    - "Makefile 使用 CC/AR/RANLIB 赋值，默认 cc 为宿主编译器，需命令行覆盖为 OHOS 交叉工具链"
    - "CheapGlk 自带 main()，消费者程序需提供 glk_main/glkunix_arguments/glkunix_startup_code 回调"
    - "仅生成静态库 libcheapglk.a，无 shared target"
  common_dependencies: []

versions:
  "1.0.7":
    status: published
    build_date: "2026-09-07"
    conan_ref: "cheapglk/1.0.7"
