# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: colrc/0.3.7
homepage: "https://github.com/welbornprod/colrc"

# 上游测试命令
upstream_check_command: "make -C test test_colrc"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C test test_colrc && ./test/test_colrc --quiet"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/*.c
    source: colrc-0.3.7/test/
    description: "上游 snow.h 测试套件；OHOS 关闭 glibc printf 扩展相关用例，其余测试实际执行"
    command: "./test/test_colrc --quiet"
    status: "通过 301/301"

test_package_tests:
  - file: test.c
    description: "消费者测试 - 编译并链接 colr() API，验证库产物、头文件和 ANSI 文本输出"
    command: "./test_colrc"

# 测试断言总数
# 上游测试 301/301；test_package 1/1
assertion_count: 302
