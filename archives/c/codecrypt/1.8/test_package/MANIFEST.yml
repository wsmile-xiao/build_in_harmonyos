# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# codecrypt 1.8 上游 (exaexa/codecrypt v1.8 tag) 实测:
#   - tarball 内无 tests/ 目录, src/ 全为产品源码 (34 cpp)
#   - configure.ac / autogen.sh 生成的 Makefile.am 无 TESTS/check_PROGRAMS
#   - `make check` 无任何注册测试 (autogen.sh 仅生成 bin_PROGRAMS = ccr)
#   - 上游也无 CI 测试工作流 (.github 无 workflow)
# 因此上游测试 N = 0, test_package 以功能性往返测试代替 (R34 实测被测包二进制)

package: codecrypt/1.8
homepage: "https://github.com/exaexa/codecrypt"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (上游无测试套件, 如实为空)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, ccr 二进制功能实测)
test_package_tests:
  - file: test_package/conanfile.py
    description: "ccr -V 版本校验 + -g help 26 算法套件校验 + 对称加解密往返 (SYM=CHACHA20,CUBE512)"
    command: "./ccr -V; ./ccr -g help; ./ccr -S sym.key -g SYM; ccr -e/-d roundtrip"

# 测试断言总数 (版本 1 + 算法 8 + 对称往返 3)
assertion_count: 12
