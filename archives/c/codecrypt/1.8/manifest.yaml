version: "1.8"
software: "codecrypt"
status: built
build_date: "2026-09-09"
build_system: "autotools"

source:
  url: "https://github.com/exaexa/codecrypt/archive/refs/tags/v1.8.tar.gz"
  sha256: "25f11bc361b4f8aca7245698334b5715b7d594d708a75e8cdb2aa732dc46eb96"
  tar_format: tar.gz

build:
  system: autotools
  # 上游 tarball 无 configure, 需 bash autogen.sh 引导 (automake/libtool 走 tool_requires)
  # configure 传 aarch64-unknown-linux-ohos triplet 绕过 config.guess 探测
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies:
    - "gmp/6.3.0.1"
    - "fftw/3.3.11"
    - "cryptopp/8.9.0"
    - "automake/1.18 (tool)"
    - "libtool/2.5.4 (tool)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-pwrng.cpp.patch"

knowledge_gained:
  - "上游 tarball 不带 configure, autogen.sh 引导 (需 automake/libtool tool_requires)"
  - "configure.ac 硬依赖 gmp/fftw3; crypto++ 经 CRYPTOPP_CFLAGS/LIBS 环境变量喂入 (pc 名不匹配 libcrypto++ vs cryptopp)"
  - "AutotoolsDeps 的 LIBS 含 -lgmpxx, C conftest 加载失败 (需 libc++), 覆盖 LIBS=-lfftw3 -lgmp -lcryptopp -lm"
  - "E114: 生成 configure 的 umask 077 需替换 (HMDFS setgid 目录不可写)"
  - "musl 无 readpassphrase.h/getpass(3), pwrng.cpp 需 termios 内联实现 (#elif !defined(HAVE_GETPASS))"
  - "ccr 密钥生成默认读阻塞 /dev/random, CI 用 CCR_RANDOM_SEED=/dev/urandom"
  - "FMTSEQ h20 变体密钥生成超 10 分钟 (Merkle 树), 测试用 h10/SYM 对称路径"

