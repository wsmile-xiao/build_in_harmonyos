package: "cubature/1.0.4"
homepage: "https://github.com/stevengj/cubature"

upstream_check_command: "cmake --build build && ./build/htest ... && ./build/ptest ..."
upstream_test_in_build: true
upstream_test_command: "htest/ptest: integrands 0/1/2/3/4/5/6/7 and integrand 8"

upstream_tests:
  - file: "test.c"
    source: "cubature-1.0.4/test.c"
    description: "h-adaptive driver over all nine bundled integrands"
    command: "./htest 3 1e-2 0/1/2/3/4/5/6/7 1000000; ./htest 3 1e-8 8 1000000"
  - file: "test.c"
    source: "cubature-1.0.4/test.c"
    description: "p-adaptive driver over all nine bundled integrands"
    command: "./ptest 3 1e-2 0/1/2/3/4/5/6/7 1000000; ./ptest 3 1e-8 8 1000000"

test_package_tests:
  - file: "test_cubature.c"
    description: "Installed-package scalar/vectorized API, numerical accuracy, error estimate, and callback failure checks"
    command: "./test_cubature"
  - file: "test_cubature_ohos.c"
    description: "HarmonyOS target macro, signed shared-library loading, public symbol, and real integration checks"
    command: "./test_cubature_ohos"

test_counting:
  upstream_independent_total: 18
  integration_independent_total: 1
  harmony_specific_total: 1
  internal_assertions_counted_as_cases: false

execution:
  status: "pass"
  target: "HarmonyOS/OHOS 6.0 aarch64"
  upstream_passed: 18
  integration_passed: 1
  harmony_specific_passed: 1

assertion_count: 23
