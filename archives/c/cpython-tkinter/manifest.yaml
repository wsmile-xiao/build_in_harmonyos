# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: cpython-tkinter
display: "CPython _tkinter"
description: "CPython 的 _tkinter C 扩展（桥接 Python 到 Tcl/Tk），供鸿蒙 PC 上的 Python tkinter 使用"
category: library
homepage: "https://docs.python.org/3/library/tkinter.html"
license: PSF-2.0

build_system: custom

ohos_adaptation:
  key_points:
    - "版本 = CPython 版本（_tkinter 与 CPython ABI 锁死）；3.12.9 用 v3.12.9 的 Modules/_tkinter.c（已 backport tcl9：Tcl_Size + #if TK_MAJOR_VERSION>=9）"
    - "requires tcl/tk 9.0.3.1；Python dev 头/libpython 由设备 python3 的 sysconfig 自发现；原生 clang 编译（链接器自签）"
    - "产物 _tkinter.cpython-312-*.so 打进 lib/python3.12/lib-dynload/，配 usr_local deployer 直接落到 ~/usr/local"
  common_dependencies: ["tcl", "tk"]

versions:
  "3.12.9":
    status: built
    build_date: "2026-07-06"
