# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cdcd/0.6.6
homepage: "http://libcdaudio.sourceforge.net/"

# 上游测试套件存在性 (经审计源码 tar 包确认: 不存在)
upstream_tests_exist: false

# 上游测试审计 (源码: cdcd-0.6.6.tar.gz, sha256 06ae2508926b7d1f811d9ce9a53991f8886aef078db4cde617125bda24fbf717)
upstream_test_audit:
  source_tarball: "cdcd-0.6.6.tar.gz"
  source_sha256: "06ae2508926b7d1f811d9ce9a53991f8886aef078db4cde617125bda24fbf717"
  top_level_files:
    - Makefile.am         # 仅 SUBDIRS = doc / bin_PROGRAMS = cdcd / man_MANS = cdcd.1，无 TESTS / check_PROGRAMS / check 目标
    - doc/Makefile.am     # 仅 info_TEXINFOS = cdcd.texi，无测试目标
    - configure.ac        # 仅编译器/库/头文件/函数探测（curses/readline/libcdaudio/socket/glib/vasprintf 等），无测试框架注册
    - cdcd.c              # 纯实现源（main/print_version/getopt 循环），无 TEST/TEST_F/gtest/assert 测试入口
    - cmdline.c           # 纯实现源（readline 补全与命令行解析），无测试入口
    - conf.c              # 纯实现源（.cdcdrc 读写），无测试入口
  scanned_for:
    - "Makefile.am TESTS / check_PROGRAMS / check-local 目标"
    - "tests/ / test/ 目录与 *test* 源文件"
    - "TEST( / TEST_F (gtest) / def test_ (pytest)"
    - "make check / ctest / meson test 目标"
  scan_result: "0 matches — 源码包共 54 个文件，无 tests/ 或 test/ 目录，无 *test* 源文件；根与 doc/ 的 Makefile.am 均无 TESTS/check_PROGRAMS/check 目标；上游 git HEAD 3fac243 (2026-09) 清点同样为 0（grep rc=1），N 下界与声明一致"
  make_check_output: "make check 执行 Automake 默认空 check 目标 (无 TESTS) 退出码 0, 零用例 (配方 build() 真跑 make check 并输出 HMBS_UPSTREAM_TEST_RESULT no_tests 机器证据)"
  reason: "cdcd 0.6.6 为纯 CLI 工具（交互式 CD 播放器），上游发布包不含任何自动化测试套件；Debian 下游打包同样不运行测试；make check 只是 automake 默认空目标，不能冒充为测试"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用 (hmbs 清单器凭非空 upstream_check_command
# 判"上游存在测试命令"; 置空以对齐 osmctools/sipcalc/virtualpg 等已过门禁的 no_tests 写法)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# 上游注册零 Automake TESTS, make check 为空目标 (配方仍真跑 make check
# 并在其后输出 HMBS_UPSTREAM_TEST_RESULT no_tests 机器证据),
# 无实际上游用例可集成, 故声明 false 并对齐已过门禁范例 (cdck/0.7.0)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "验证 cdcd 二进制真实运行行为: 可执行、--version 输出 cdcd 0.6.6 与 Using libcdaudio 运行期链接行、--help 输出 Usage 行、畸形 .cdcdrc 被拒绝（非零退出+invalid 提示，配置解析负路径）"
    command: "sh test.sh <installed bin/cdcd> <isolated-home-dir (mkdtemp under TMPDIR, worktree 外)>"

assertion_count: 4
