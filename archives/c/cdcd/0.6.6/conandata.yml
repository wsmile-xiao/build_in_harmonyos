# conandata.yml — cdcd 0.6.6
#
# 官方源：SourceForge 项目 libcdaudio 的 cdcd 发布目录（项目主页即
# https://libcdaudio.sourceforge.net/ ，SourceForge 是其唯一官方发布点；
# debian/copyright 的 Download 字段同样指向该主页——上游真实 homepage
# 在 Debian 登记为明文 http，此处仅作叙述、不参与取源，取源两条 URL 全 https）。
# sha256 三源锚定（详见 $TASK_DIR/w0/W0-evidence.md）：
#   - 本机两次独立下载（sourceforge.net 与 downloads.sourceforge.net 两个域名）
#     sha256 全等 = 06ae2508…fbf717
#   - SourceForge 官方 RSS media:hash md5 = dc17f2e2…f29fb 与本机 md5 一致
#   - Debian .dsc（PGP 签名）Checksums-Sha256 声明同一 sha256；
#     cdcd_0.6.6.orig.tar.gz 与本文件字节同源（sha256 全等，改名包同源比对通过）
sources:
  url:
    - "https://sourceforge.net/projects/libcdaudio/files/cdcd/0.6.6/cdcd-0.6.6.tar.gz/download"
    - "https://downloads.sourceforge.net/project/libcdaudio/cdcd/0.6.6/cdcd-0.6.6.tar.gz"
  sha256: "06ae2508926b7d1f811d9ce9a53991f8886aef078db4cde617125bda24fbf717"

patches:
  # 四个补丁均已在 $TASK_DIR/patchwork/verify 按此顺序串行 dry-run 应用通过
  # （patch_ng strip=0，与 conan apply_conandata_patches 默认参数一致）。
  # 0001/0003/0004 对应 W0 探索期试打验证过的两处修复；0002 为 E011 族
  # （HMDFS 目录权限）在 autoconf config.status 临时目录上的实例化。
  - patch_file: "patches/0001-config.sub-aarch64.patch"
    patch_description: "0001 config.sub 识别 aarch64（裸名与带厂商两处清单）——1996 版 config.sub 无 aarch64，不打则 --build/--host 校验直接 Invalid configuration"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-000.patch"
    patch_description: "0002 configure 里 config.status 临时目录 umask 077 → 000（两处）——HMDFS 把 0700 目录落成组位不可写，confstat/subs.sed 写入必 EACCES（E011/E206 族实例）"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-curses-to-ncursesw.patch"
    patch_description: "0003 configure 的 AC_CHECK_LIB(curses) 探测 -lcurses → -lncursesw（四处）——conan ncurses 只交付宽字符库名（libncursesw 等），无 libcurses，原探测必死"
    patch_type: "portability"
  - patch_file: "patches/0004-configure.ac-curses-to-ncursesw.patch"
    patch_description: "0004 configure.ac 源头同步 AC_CHECK_LIB(curses → ncursesw（与 0003 同一修复的源真值，防止日后 autoreconf 回退）"
    patch_type: "portability"
  - patch_file: "patches/0005-cmd_cdcd-readline8-cppfunction.patch"
    patch_description: "0005 cmd_cdcd.c 的 CPPFunction 加 RL_READLINE_VERSION 守卫切到 rl_completion_func_t——readline >= 6 移除 CPPFunction typedef，链 readline/8.3 时 clang 报 use of undeclared identifier（探索 make 实测）"
    patch_type: "portability"
