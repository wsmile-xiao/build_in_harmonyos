# cdcd 0.6.6 版本级 manifest
# 遵循 ARCHIVE-SPEC；状态与实测结果由设备采信轮回填
version: "0.6.6"
software: cdcd

# 本地验证通过（原生探索全绿 + 采信轮 conan-verify），PR 阶段无上传发布授权，状态为 built
status: built
build_date: "2026-09-23"
build_system: autotools

# 源码信息（三源 sha256 锚定，见 $HOME/tmp/cdcd-0.6.6/w0/W0-evidence.md）
source:
  url:
    - "https://sourceforge.net/projects/libcdaudio/files/cdcd/0.6.6/cdcd-0.6.6.tar.gz/download"
    - "https://downloads.sourceforge.net/project/libcdaudio/cdcd/0.6.6/cdcd-0.6.6.tar.gz"
  sha256: "06ae2508926b7d1f811d9ce9a53991f8886aef078db4cde617125bda24fbf717"
  tar_format: tar.gz

# 构建配置
build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu (1996 config.guess 在本机 rc=1 猜不出，必须显式三元组；conan 因 build==host profile 不注入)"
    - "--host=aarch64-unknown-linux-gnu (linux-gnu 走 configure 的 *linux* 分支定义 HAVE_CDAUDIO/DEFAULT_DEVICE；cdck 0.7.0 先例)"
    - "--with-libcdaudio-prefix=<libcdaudio package_folder> (conanbuild PATH 不含 host 依赖 bindir → 绝对 LIBCDAUDIO_CONFIG；并修正包内 prefix=/ 烤死的 -I//include -L//lib 假路径)"
    - "--prefix=/ (conan AutotoolsToolchain 默认，配合 install() 注入的 DESTDIR=package_folder)"
    - "CC/CXX/CPPFLAGS/LDFLAGS/LIBS 由 conan build 环境注入（AutotoolsToolchain + AutotoolsDeps）"
  dependencies:
    - "libcdaudio/0.99.12p2 (硬依赖 AM_PATH_LIBCDAUDIO，AC_MSG_ERROR 分支)"
    - "readline/8.3 (硬依赖 AC_CHECK_LIB(rl_completion_matches)，AC_MSG_ERROR 分支)"
    - "ncurses/6.6 (硬依赖 tputs 探测 —— 补丁 0003/0004 后为 -lncursesw；readline 静态链接也需其 termcap 符号)"
  tool_requires: []
  cc: clang
  cxx: clang++

# 补丁信息（五个补丁已在干净 tarball 树按 conandata 顺序串行 dry-run 全过）
patches_applied:
  - "0001-config.sub-aarch64.patch (1996 config.sub 不认 aarch64，不打则 --build/--host 校验直接 Invalid configuration)"
  - "0002-configure-umask-000.patch (config.status 临时目录 umask 077→000 两处；HMDFS 0700 目录组位不可写 E011/E206 族实例)"
  - "0003-configure-curses-to-ncursesw.patch (conan ncurses 只交付宽字符库名，原 -lcurses 探测必死；configure 内四处)"
  - "0004-configure.ac-curses-to-ncursesw.patch (0003 的源真值同步，防 autoreconf 回退)"
  - "0005-cmd_cdcd-readline8-cppfunction.patch (readline>=6 移除 CPPFunction typedef，链 8.3 报 undeclared identifier；RL_READLINE_VERSION 守卫切 rl_completion_func_t)"

# 知识沉淀（预留条目 E688，tools/knowledge_id.py --claim 取号回查未占用）
knowledge_gained:
  - "readline 8 移除 CPPFunction typedef：老 CLI 的 rl_attempted_completion_function 赋值必须按 RL_READLINE_VERSION 守卫切到 rl_completion_func_t，否则 clang 报 use of undeclared identifier # knowledge_ref: E688"
  - "conan 只交付宽字符库名的 ncurses 包与老 autotools AC_CHECK_LIB(curses, tputs) 探测名不匹配：探测与 configure.ac 源头同步改 -lncursesw，否则 configure 硬失败 # knowledge_ref: E688"
  - "AM_PATH_* config-script 探测宏（如 AM_PATH_LIBCDAUDIO）在 conan 下需要 --with-*-prefix：<1> conanbuild PATH 不含 host 依赖 bindir，AC_PATH_PROG 找不到 <lib>-config；<2> 包内 config 脚本 prefix=/ 烤死会产出 -I//include -L//lib 假路径。一个 --with-*-prefix 同时解决两处 # knowledge_ref: E688"
  - "1996 config.guess 在 HarmonyOS PC 上 rc=1 猜不出、config.sub 不认 aarch64：必须显式 --build/--host=aarch64-unknown-linux-gnu，且 conan build==host profile 时 AutotoolsToolchain 不注入三元组 # knowledge_ref: E688"
  - "cdcdrc_read() 先于 getopt 执行：缺省 $HOME/.cdcdrc 会进交互式首启向导挂死无头测试；test_package 必须预置 revision-3 rc 文件并用隔离 HOME，不触真实 HOME # knowledge_ref: E688"

# 测试读数（上游 0 用例 = 清点双面零命中；鸿蒙特有 4 = test_package 用例）
test_results:
  type: official
  total: 0
  passed: 0
  failed: 0
  skipped: 0
  not_run: 0
  # 上游无任何测试套件（tarball 54 文件 + 上游 HEAD 3fac243 双面 grep rc=1）
  # make check = automake 默认空目标，配方真跑并输出 no_tests 机器证据

