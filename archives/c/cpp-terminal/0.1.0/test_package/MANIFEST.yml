# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cpp-terminal/0.1.0
homepage: "https://github.com/jupyter-xeus/cpp-terminal"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-tests"

upstream_tests:
  - name: test_terminal.cpp（doctest 单元测试——自带 doctest.h，1 个 ctest 用例）+ tests.sh（examples/colors/keys）
    count: "1"
    description: "上游测试实测（rule 4，分母=全部 1 用例）：1 passed / 0 failed / 0 skipped（100%）——test_terminal.cpp 自带 doctest.h 无需网络；终端交互（keys）需 tty 沙箱受限未计"

test_package_tests:
  - file: test_cpp_terminal.py
    description: "R34：头文件存在 + 编译运行使用 cpp-terminal 的 smoke（Term::color 输出）"
    command: "python3 test_cpp_terminal.py <package>"

assertion_count: 2
