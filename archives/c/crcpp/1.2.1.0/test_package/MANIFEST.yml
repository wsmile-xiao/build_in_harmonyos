# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: crcpp/1.2.1.0
homepage: "https://github.com/d-bahr/CRCpp"

# 上游测试命令（上游 CI .github/workflows/unit-test.yml:
#   make -C test/prj/gcc  →  test/prj/gcc/bin/unittest）
upstream_check_command: "make -C test/prj/gcc && test/prj/gcc/bin/unittest (upstream CI 同口径)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "配方 build() 在 build 目录复刻 inc/test 结构后 make -C test/prj/gcc（CXX/LINKER=clang++、LDFLAGS+=-static-libstdc++）并运行 unittest"

# 上游实际运行的测试程序（上游唯一测试面：单翻译单元 unittest，
# 断言失败时向 stderr 打印 "Invalid CRC" 并置 returnCode=1）
upstream_tests:
  - file: test/src/main.cpp
    source: CRCpp-release-1.2.1.0/test/src/main.cpp
    description: "unittest：59 个 CRC_TEST 宏（每个展开 4 条断言）+ 3 个 CRC_PARTIAL_BYTE_TEST（每个展开 2 条断言）= 242 条运行期断言（-DCRCPP_INCLUDE_ESOTERIC_CRC_DEFINITIONS，上游 gcc Makefile 默认；esoteric 关闭时为 13×4=52 条）"
    command: "./test/prj/gcc/bin/unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_crcpp.cpp
    description: "消费者测试：版本宏自报 + CRC-32/16/8/64 计算值 + multipart 续算 + 查表路径 + 非 8 位整倍数 CalculateBits + 参数结构体字段；13 条运行期断言逐条打印读数，另有 1 条编译期 static_assert（版本宏）"
    command: "./test_crcpp"

# 测试断言总数（上游 242 条运行期断言；消费者 test_package 另计 13 条，不进上游分母）
assertion_count: 242
