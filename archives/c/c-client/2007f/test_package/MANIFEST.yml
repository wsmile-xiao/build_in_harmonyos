package: c-client/2007f
homepage: "https://github.com/uw-imap/imap"

upstream_tests_exist: false
upstream_test_audit:
  - source: "imap-2007f source archive"
    reason: "Top-level Makefile defines targets slx/lnp/sox etc but no 'check' or 'test' target; grep -n check Makefile shows only documentation."
  - source: "src/mtest/"
    reason: "mtest.c is a manual interactive tool (asks for mailbox name), not an automated test suite; no ctest/gtest/make check harness."
  - source: "src/ directory"
    reason: "No ctest, gtest, or pytest found; source package contains only library and utilities."
  - conclusion: "Upstream 2007f provides no automated tests; adaptation adds consumer smoke test for header and linkage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "c-client header and linkage smoke test (2 assertions: header inclusion + library linkage)"
    command: "./test_cclient"

assertion_count: 2
