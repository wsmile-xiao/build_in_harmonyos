# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: combblas/2.0.0
homepage: "https://github.com/PASSIONLab/CombBLAS"

# 上游测试（ctest 套件）——**已实跑**（2026-09-11 第五轮·定稿）：
#   **18/20 PASS（= 90%）**——按上游 ADD_TEST 精确命令行执行
#   （nproc 同上游：SpGEMM3D_Test=16 即非 Apple 分支 TEST_PROCS，HashSpGEMMTest=1，余=4）
#
# ★ 分母口径修正（重要）：v2.0.0 源码树实际只有 **20 个 ADD_TEST**
#   （ReleaseTests 11 + Applications 5 + Ordering 1 + BipartiteMatchings 2 +
#    SpMSpV-IPDPS2017 1，逐文件实测计数）。
#   先前使用的 21 系照上游 **master** 的 CMakeLists 计数——其中
#   Local_SpDCCols_Transpose_Test 仅存在于 master，v2.0.0 树内既无该测试注册、
#   也无其源文件，不应计入。
#
# 四轮递进（统一按 20 分母）：1/20（5%）→ 7/20（35%）→ 9/20（45%）→ **18/20（90%）**
#   第1轮：仅 IteratorTest
#   第2轮：识别"自带数据生成器"组（FastGen/Gen/er，无需外部 TESTDATA）→ 7/20
#   第3轮：FBFS_Test/FMIS_Test 段错误用 OMP_NUM_THREADS=1 消除 → 9/20
#   第4轮：**获取外部 TESTDATA 并实跑** → 18/20
#
# ★ 外部数据获取（关键突破）：官方源 eecs.berkeley.edu 确已 301→302→404、
#   web.archive 无快照、上游树不含 TESTDATA，但经 FreeBSD ports（math/combblas）
#   记载找到 NERSC 门户镜像：
#     https://portal.nersc.gov/project/m1982/CombBLAS/testdata_combblas1.6.1.tgz
#   sha256 07d5683d8435bf1ae6febbf0021203fd23570bbab9c56affe1dc0dcf023ac207
#   （33734592 字节，实测下载校验一致）→ 解压得 TESTDATA/ 32 个文件
#
# 段错误根因（实测）：FBFS/FMIS 与 OpenMP 多线程相关——
#   OMP_NUM_THREADS=1 → 通过；=2/4/8 → 失败；OMP_STACKSIZE 加大无效
#
# 剩余 2 个失败（逐项）：
#   * Indexing_Test / SpAsgn_Test：段错误，**功能断言已先通过**
#     （"Indexing working correctly" 已打印），崩溃在其后收尾阶段；
#     np=1 亦 1 个信号、np=4 各 4 rank signaled with Segmentation fault、
#     np=2 rc=187；OMP_NUM_THREADS=1 无效（非 OpenMP 数据竞争）。
#     已排除本配方 MPI-IO stdio 兼容层（崩溃链路不涉及 MPI_File_*）。
upstream_check_command: "OMP_NUM_THREADS=1 mpiexec -n <nproc> <test>（nproc/参数同上游 ADD_TEST；需 TESTDATA 数据）"

# conanfile.py build() 中未运行上游 ctest（需外部 TESTDATA 数据 + 系统 shim）
upstream_test_in_build: false
upstream_test_command: "OMP_NUM_THREADS=1 mpiexec -n <nproc> <ReleaseTests|Applications>/<test>（本地实测）"
upstream_test_result: "18/20 PASS (= 90%)；仅 Indexing_Test/SpAsgn_Test 段错误（功能断言已通过，崩溃在收尾阶段）"

# 上游测试来源
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_combblas.cpp
    description: "消费者探针：MPI_Init + SpParMat 分布式稀疏矩阵构造，验证 libCombBLAS 链接 + 初始化"
    command: "clang++ test_combblas.cpp -o test_combblas_probe -lCombBLAS -lmpi -fopenmp && ./test_combblas_probe"

# 断言总数（test_package 1 个断言）
assertion_count: 1
