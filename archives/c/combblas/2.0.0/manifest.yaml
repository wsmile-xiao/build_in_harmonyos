software: combblas
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/PASSIONLab/CombBLAS/archive/refs/tags/v2.0.0.tar.gz"

  # 源码校验和
  sha256: "632a94201a042a2a9aa86803f50ee38b7bf0aa1cfef6ba0eb34ea4007f79a679"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 编译器
compiler: clang

# 依赖列表（conan package refs 或系统包名）
requires:
  - "mpich/4.0.3"

# 构建配置选项
build_options:
  - "CMake C++14；find_package(MPI REQUIRED) 命中 mpich + OpenMP（clang -fopenmp）；静态链接"

# ============================================================
# 测试信息
# ============================================================

# 测试结果状态
# passed | failed | skipped | not_run
test_status: passed

# 测试说明
test_note: "上游测试实跑（2026-09-11，第五轮·定稿）：**通过率 18/20（= 90%）**。分母口径修正——v2.0.0 源码树实际只有 **20 个 ADD_TEST**（ReleaseTests 11 + Applications 5 + Ordering 1 + BipartiteMatchings 2 + SpMSpV-IPDPS2017 1，逐文件实测计数）；先前用的 21 系照上游 master 的 CMakeLists 计数，其中 Local_SpDCCols_Transpose_Test **仅存在于 master，v2.0.0 树内既无该测试注册也无其源文件**，不计入。四轮递进（统一按 20 分母）：1/20（5%）→ 7/20（35%）→ 9/20（45%）→ 18/20（90%）。关键手段：① 识别出约 9 个测试自带数据生成器（FastGen/Gen/er）无需外部数据，此前被一并判为'需外部数据'属漏测；② FBFS_Test/FMIS_Test 段错误经隔离实验定位为 OpenMP 多线程相关，用 OMP_NUM_THREADS=1 消除；③ **外部 TESTDATA 已获取**——官方源 eecs.berkeley.edu 确已 301→302→404、web.archive 无快照、上游树不含 TESTDATA，但经 FreeBSD ports（math/combblas）记载找到 NERSC 门户镜像 https://portal.nersc.gov/project/m1982/CombBLAS/testdata_combblas1.6.1.tgz（sha256 07d5683d8435bf1ae6febbf0021203fd23570bbab9c56affe1dc0dcf023ac207，33734592 字节，实测下载校验一致），解压得 TESTDATA/ 32 个文件后按上游 ADD_TEST 精确命令行实跑（nproc 同上游：HashSpGEMMTest=1、SpGEMM3D_Test=16 即非 Apple 分支 TEST_PROCS、余=4）。实测通过 18 个：GenMMWrite_Test、Multiplication_Test、SpGEMM3D_Test、HashSpGEMMTest、Reduction_Test、Iterator_Test、Transpose_Test、GalerkinNew_Test、FindSparse_Test、TopDownBFS_Test、DirOptBFS_Test、FBFS_Test、FMIS_Test、BetwCent_Test、RCM_Test、BPML_Test、BPMM_Test、SpMSpVBench_test。剩余 2 个失败：**Indexing_Test / SpAsgn_Test**——段错误，且**功能断言已先通过**（'Indexing working correctly' 已打印），崩溃发生在其后的收尾阶段（TopK/置换/LoadImbalance 或 MPI_Finalize）；可复现性：np=1 亦有 1 个信号、np=4 各 4 个 rank 均 signaled with Segmentation fault、np=2 rc=187；OMP_NUM_THREADS=1 无效（与上组不同，非 OpenMP 线程数据竞争）；已排除本配方 MPI-IO stdio 兼容层（该二进制的崩溃链路不涉及 MPI_File_*；另附注：本轮同时**修掉了一处真实 shim 缺陷**——元素大小原用 sizeof(int) 猜测，改用 MPI_Type_size(dt) 后 16 字节派生类型不再被误按 4 字节搬移，但该修复未改变这两例结果，故未据此声称修复）。test_package 消费者探针（MPI_Init + SpParMat 构造）通过率 100%（1/1），运行时真实执行 combblas OK"
