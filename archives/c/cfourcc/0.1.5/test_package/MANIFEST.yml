# test_package/MANIFEST.yml — cfourcc 0.1.5
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: cfourcc/0.1.5
homepage: "https://github.com/mypapit/cfourcc"

# cfourcc 无上游测试套件（tar tzf 全量核验：仅 AUTHORS/BUGS/COPYING/ChangeLog/
# Makefile/README/README.md/TIPS/TODO/cfourcc.c/codeclist.txt，无 tests/、
# 无 make check 目标；TODO 文件明示 "Add unit tests for safer refactoring"）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游 tarball 中无任何测试程序
upstream_tests: []

# test_package 消费者测试（R34 真实执行二进制）
test_package_tests:
  - file: test_cfourcc.py
    description: "Runs `cfourcc -h` and asserts the version banner 'cfourcc 0.1.5' is printed (R34: executes the binary, not just file-existence)"
    command: "python3 test_cfourcc.py"

# 断言总数：1（版本 banner 校验）
assertion_count: 1
