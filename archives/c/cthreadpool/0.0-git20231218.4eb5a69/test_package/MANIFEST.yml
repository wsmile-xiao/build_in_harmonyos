package: cthreadpool/0.0-git20231218.4eb5a69
homepage: "https://github.com/Pithikos/C-Thread-Pool"

upstream_check_command: "cc + thpool.c -D THPOOL_DEBUG -pthread per tests/funcs.sh compile()"
upstream_test_in_build: true
upstream_test_command: "source-tree compile-and-run sequence in conanfile.py build()"

upstream_tests:
  - file: example.c
    source: C-Thread-Pool-4eb5a69/example.c
    description: "Upstream smoke example: 40 tasks on 4 threads, wait, destroy."
    command: "./example_check"
  - file: tests/src/api.c
    source: C-Thread-Pool-4eb5a69/tests/src/api.c
    description: "Upstream API test: thpool_num_threads_working counters (4 and 2 threads)."
    command: "./api_check"
  - file: tests/src/conc_increment.c
    source: C-Thread-Pool-4eb5a69/tests/src/conc_increment.c
    description: "Upstream mass-addition tests from threadpool.sh: 100 jobs on 4 threads, 100 jobs on 1000 threads, 100000 jobs on 1000 threads, each with exact-sum comparison."
    command: "./conc_check <jobs> <threads>"
  - file: tests/src/wait.c
    source: C-Thread-Pool-4eb5a69/tests/src/wait.c
    description: "Upstream wait tests from wait.sh (functional subset): pool-wide wait and per-job wait. Host-calibrated elapsed-time bounds are not asserted."
    command: "./wait_check <jobs> <threads> <wait_each_job>"
  - file: tests/src/pause_resume.c
    source: C-Thread-Pool-4eb5a69/tests/src/pause_resume.c
    description: "Upstream pause/resume lifecycle test from pause_resume.sh on 4 threads."
    command: "./pause_resume_check 4"
  - file: tests/src/no_work.c
    source: C-Thread-Pool-4eb5a69/tests/src/no_work.c
    description: "Upstream create/destroy smoke test (also the valgrind memleaks.sh binary; leak assertions need valgrind and are documented in notes.md)."
    command: "./no_work_check 4"
  - file: tests/src/nonzero_heap_stack.c
    source: C-Thread-Pool-4eb5a69/tests/src/nonzero_heap_stack.c
    description: "Upstream nonzero heap/stack robustness test from heap_stack_garbage.sh."
    command: "./nonzero_check"

test_package_tests:
  - file: test_basic.c
    description: "Links the packaged library: 200 queued increments with exact-sum check and zero working threads after thpool_wait."
    command: "test_basic"
  - file: test_pause_wait.c
    description: "Links the packaged library: no task progress while paused, exact sum after resume, clean destroy."
    command: "test_pause_wait"

assertion_count: 257
