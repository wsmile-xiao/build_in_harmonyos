software: cthreadpool
display: "C-Thread-Pool"
description: "A minimal but powerful thread pool in ANSI C"
category: threading
homepage: "https://github.com/Pithikos/C-Thread-Pool"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Upstream ships no build system; the recipe compiles thpool.c directly with the Conan-profile compiler."
    - "Pure POSIX C plus pthreads; no patches required for OHOS."
    - "Upstream shell-driven tests run in build(); valgrind leak cases excluded (no valgrind on OHOS)."
  common_dependencies: []

versions:
