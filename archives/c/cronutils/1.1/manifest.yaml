software: cronutils
version: "1.1"
status: built
build_date: "2026-09-11"
build_system: makefile

source:
  url: "https://snapshot.debian.org/archive/debian/20110723T212944Z/pool/main/c/cronutils/cronutils_1.1.orig.tar.gz"
  sha256: "28a5bbba67a1977be553aacc0b4087b61fef83857f8d7703b9bb823c07454035"
  tar_format: tar.gz
  source_identity: "cronutils 1.1 upstream archive mirrored by Debian Snapshot"

build:
  system: makefile
  configure_options:
    - 'direct clang targets matching the upstream Makefile, with CFLAGS="-O2 -Wall -Wextra -D_XOPEN_SOURCE=700"'
    - "OHOS: LDFLAGS=-fuse-ld=/data/service/hnp/bin/ld (or user.ohos:ld_path for local SDK) and LDLIBS="
    - "Linux: LDLIBS=-lrt"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "Build-time HOST_NAME_MAX fallback from Debian 1.1-3 portability fix"
  - "Initialize runlock status to a deterministic error value"
  - "OHOS omits standalone -lrt because clock_gettime is provided by libc"
  - "OHOS package binaries are self-signed with llvm-objcopy and binary-sign-tool"

knowledge_gained:
  - "The Debian Snapshot archive provides a fixed upstream cronutils-1.1 source identity with a verified SHA256."
  - "The raw Makefile needs the Conan clang executable and modern POSIX feature macros on HarmonyOS."
  - "HarmonyOS rejects unsigned ELF files from the Conan package cache with PermissionError; package() must add a .codesign section before consumer execution."
  - "cronutils is a CLI package; R38 requires software-level commands.json, which is outside this round's version-only boundary."
  - "B-class candidate draft: raw Makefile, OHOS libc/linker differences, package-time ELF signing, R38 metadata, and first-failure-to-shadow-pass evidence are recorded in knowledge/DRAFT-cronutils-1.1-raw-makefile-ohos-cli-signing.{md,kv}."

upstream_tests:
  exists: false
  test_count: 0
  command: "N/A: upstream Makefile has no check or test target"
  notes: "The source archive contains only the three utilities, support sources, man pages, and Makefile."

test_package:
  assertion_count: 18
  description: "Consumer test executes all three installed utilities and checks status, timeout, locking, and CSV statistics."

quality_gates:
  W0_dependencies: "No external Conan dependencies."
  W1_source: "C project with a raw Makefile; runalarm, runlock, and runstat are the public commands."
  W4_local: "AArch64 OHOS cross-compilation and Conan create/package passed with the installed DevEco Studio BiSheng clang; Windows cannot execute the target ELF."
  W5_shadow_ci: "Passed 2026-09-11: isolated OHOS heavy runner completed Conan create, self-signed all three ELF tools, executed test_package with 18/18 assertions, and passed L0/L1/L2/L4/L5."
  R38_commands_json: "Passed: software-level archives/c/cronutils/commands.json declares cronutils/1.1 and its CLI package."

blockers: []
