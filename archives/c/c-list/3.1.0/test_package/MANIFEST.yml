# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: c-list/3.1.0
homepage: "https://github.com/c-util/c-list"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test -C . --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序 (src/meson.build 注册的 3 个 meson test 套件)
upstream_tests:
  - file: src/test-api.c
    source: c-list-3.1.0/src/test-api.c
    description: "API 符号可见性套件 (test_api/test_api_gnu 2 用例，*_gnu 为 glibc/通用条件编译双实现)"
    command: "meson test -R 'API Symbol Visibility'"
  - file: src/test-basic.c
    source: c-list-3.1.0/src/test-basic.c
    description: "基础行为套件 (iterators/swap/splice/split/flush/macros/gnu 7 用例)"
    command: "meson test -R 'Basic API Behavior'"
  - file: src/test-embed.c
    source: c-list-3.1.0/src/test-embed.c
    description: "内嵌节点套件 (test_entry/test_entry_gnu 2 用例)"
    command: "meson test -R 'Embedded List Nodes'"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_c_list.c
    description: "消费者测试: C_LIST_INIT 空表、link_tail 顺序、c_list_for_each 计数、unlink 中间/头节点、清空回空表 (12 项断言)"
    command: "./test_c_list"

# 测试断言总数 (实测, rule 4)
# 上游 3 个套件内 test_* 测试函数注册用例: 2 + 7 + 2 = 11
assertion_count: 11
