knowledge_gained:
  - "coreutils 9.11 摘要工具并入 cksum 框架(src/coreutils-sha512sum.c + cksum.c),不再有 src/sha512sum.c"
  - "9.11 移除 gnulib freadptr/freadseek 模块,9.10 的对应补丁在 9.11 不适用"
