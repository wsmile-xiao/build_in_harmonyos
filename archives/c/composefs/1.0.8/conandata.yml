# conandata.yml — composefs 1.0.8
# 官方 tag 源码: GitHub containers/composefs 仓库 v1.0.8 标签

sources:
  url: "https://github.com/containers/composefs/archive/refs/tags/v1.0.8.tar.gz"
  sha256: "2b2b11f9a25744c82e9e12b098eefd0ab42d56ae6322634c15f966b3a64926ef"

patches:
  - patch_file: "patches/0001-libcomposefs-lcfs-writer.c.patch"
    patch_description: "OHOS HMFS fs semantics: skip unreadable security.* xattrs (security.hmmac listed but getxattr fails) and canonicalize FS_IOC_MEASURE_VERITY EACCES to ENOVERITY so the in-memory fs-verity fallback runs"
    patch_type: "portability"
  - patch_file: "patches/0002-tests-gendir.patch"
    patch_description: "gendir shebang /usr/bin/python3 -> /usr/bin/env python3 (device has no /usr/bin/python3)"
    patch_type: "portability"
  - patch_file: "patches/0003-tests-test-lcfs.c.patch"
    patch_description: "test-lcfs: mkstemp honors TMPDIR (hardcoded /tmp is erofs read-only on OHOS PC) and testwrite_node writes to a real temp file instead of open_memstream (deterministic SIGSEGV/SIGILL on clang 15/HarmonyOS)"
    patch_type: "portability"