# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: composefs/1.0.8
homepage: "https://github.com/containers/composefs"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（tests/meson.build 中 6 个 test() 注册项）
upstream_tests:
  - file: tests/test-units.sh
    source: composefs-1.0.8/tests/test-units.sh
    description: "单元测试：mkcomposefs 构建、digest、mount digest 与 composefs-info measure"
    command: "bash test-units.sh <build>/tools"
  - file: tests/test-checksums.sh
    source: composefs-1.0.8/tests/test-checksums.sh
    description: "资产 checksum 校验（assets/*.dump 与 .sha256）"
    command: "bash test-checksums.sh <build>/tools <src>/tests/assets"
  - file: tests/test-dump-filtered.sh
    source: composefs-1.0.8/tests/test-dump-filtered.sh
    description: "过滤 dump 断言（chardev/inline/whiteout 过滤后 4 行）"
    command: "bash test-dump-filtered.sh <build>/tools <src>/tests/assets"
  - file: tests/test-should-fail.sh
    source: composefs-1.0.8/tests/test-should-fail.sh
    description: "14 个应失败 dump 输入全部被拒绝"
    command: "bash test-should-fail.sh <build>/tools ..."
  - file: tests/test-lcfs.c
    source: composefs-1.0.8/tests/test-lcfs.c
    description: "libcomposefs C 单测（5 个子测试：node/EROFS 写入/fsverity/xattr）"
    command: "./test-lcfs"
  - file: tests/test-random-fuse.sh
    source: composefs-1.0.8/tests/test-random-fuse.sh
    description: "fuse 随机目录测试（需 fuse 内核与 mknod，本平台沙箱硬阻塞，见 notes.md）"
    command: "bash test-random-fuse.sh <build>/tools"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者用例：公开 API 构建 EROFS 镜像 → 读回 → 校验 app.txt 内容"
    command: "./test_composefs"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 60