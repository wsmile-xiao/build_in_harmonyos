# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS HMFS 对 FS_IOC_MEASURE_VERITY 返回 EACCES（Linux 为 ENODATA/ENOTTY），须将 EACCES 归一化为 ENOVERITY 以回退进程内 fs-verity 摘要计算"
  - "HMFS 在 listxattr 暴露 security.hmmac 但非特权用户 getxattr 失败，构建扫描目录时必须跳过不可读的 security.* xattr"
  - "OHOS PC 上 /tmp 为 erofs 只读，测试用 mkstemp 硬编码 /tmp 须改为读取 TMPDIR"
  - "clang15/HarmonyOS 下 open_memstream 写 EROFS 会确定性 SIGSEGV/SIGILL，测试改用真实临时文件写入"

