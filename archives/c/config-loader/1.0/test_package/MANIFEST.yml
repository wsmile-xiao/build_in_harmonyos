# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: config-loader/1.0
homepage: "https://github.com/netcan/config-loader"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake --build build -j2 && ./build/bin/config_loader_test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test() (CTest: config_loader_test, 29 Catch2 SCENARIO cases)"

# 上游实际运行的测试程序
upstream_tests:
  - file: config_loader_test (test/ut: 13 个源文件, 29 个 SCENARIO)
    source: config-loader-1.0/test/ut/*.cpp
    description: "上游 Catch2 单元测试 (JSON/XML/YAML 解析、序列化、schema 反射)"
    command: "./config_loader_test"
    result: "All tests passed (352 assertions in 29 test cases), exit 0"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_config-loader.cpp
    description: "消费者用例：模拟业务上层应用经公开 API (DEFINE_SCHEMA + loadJSON2Obj) 加载服务配置并校验字段"
    command: "./test_config-loader"
  - file: ohos_platform_test.cpp
    description: "HarmonyOS 专项测试：序列化 dumpObj2OStream -> 反序列化 loadJSON2Obj/loadYAML2Obj 往返验证"
    command: "./ohos_platform_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
