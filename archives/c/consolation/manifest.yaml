# 软件级 manifest — consolation
# 文件位置: archives/c/consolation/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: consolation

# 显示名
display: "Consolation"

# 一句话描述
description: "Copy-paste daemon for the Linux virtual console (GPM-like, libinput based)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: system

# 官网 URL
homepage: "https://salsa.debian.org/consolation-team/consolation"

# 开源许可证（SPDX 标识）
license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "musl 无 glibc 全局 program_invocation_short_name,需静态 fallback(仅 usage() 输出使用)"
    - "上游 man 页由运行编译产物生成,交叉构建下须按「文档不构建」口径中性化(src/Makefile 的 dist_man_MANS)"
    - "运行前提:内核 CONFIG_VT、/dev/tty0、eudev(udevd)运行时;systemd 单元需改写,OHOS 无 systemd"
  # 跨版本通用依赖
  common_dependencies:
    - libinput
    - libevdev
    - eudev

# ============================================================
# 版本索引
# ============================================================

versions:
  - version: "0.0.10"
    status: published
    build_date: 2026-09-28
    notes: |
      - 首次适配(Debian 源包 0.0.10-1 的 orig)
      - autotools 构建,application 型包(安装 sbin/consolation 守护进程)
      - 依赖经 pkg-config 解析:libinput/libudev/libevdev 来自 conan 依赖图
    dependencies:
      - libinput/1.26.2
      - libevdev/1.13.7
      - eudev/3.2.14
    provides:
      - sbin/consolation
