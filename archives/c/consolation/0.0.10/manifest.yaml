# 版本级 manifest — consolation 0.0.10
# 遵循 ARCHIVE-SPEC v2.0

version: "0.0.10"
software: consolation

# 编译状态
# published | built | failed | archived
status: published

build_date: "2026-09-28"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # Debian 源包 orig
  url: "https://deb.debian.org/debian/pool/main/c/consolation/consolation_0.0.10.orig.tar.xz"
  upstream_url: "https://salsa.debian.org/consolation-team/consolation"
  sha256: "50ecf54a5b3b0e34c10eb9ed07d4de5acebe044bbe8c4caff2574d7bab3aa853"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  configure_options: []
  # configure.ac 无可选开关;依赖由 pkg-config 探测
  # (libinput >= 1.5 / libudev / libevdev >= 0.4)

  # 编译依赖(格式: name/version)——全部取自 main 上已发布的组合
  dependencies:
    - libinput/1.26.2
    - libevdev/1.13.7
    - eudev/3.2.14

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-ohos-musl-program-invocation-name-fallback.patch"
  # src/input.c: !__GLIBC__ 下提供 program_invocation_short_name 静态
  # fallback(musl 无此 glibc 全局;仅 usage() 输出使用)。
  #
  # 非补丁类适配(配方内处理):src/Makefile.in 的 dist_man_MANS 中性化
  # ——上游 man 页由运行编译产物生成,交叉构建不可行,按「文档不构建」
  # 口径处理(见 notes.md)。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 man 页规则(src/Makefile.in 内联规则)会执行刚编译出的守护进程来排版 consolation.8,且挂在 all-am:...$(MANS) 下——交叉构建必失败;该包无 --disable-manpages 开关,需在 configure 前清空 src/Makefile.in 的 dist_man_MANS"
  - "application 型消费包只依赖 conan 依赖图:libinput/1.26.2 的 requires 已把 libevdev/mtdev/eudev 以 transitive 声明,单条 requires + PkgConfigDeps 即可让 configure 的三组 PKG_CHECK_MODULES(libinput/libudev/libevdev)全部命中"
  - "musl 的 program_invocation_short_name 缺失在本仓三处包(libinput tools、consolation、eudev 系列)重复出现,值得沉淀为通用检查项"
  - "运行前提(集成阶段确认):内核 CONFIG_VT、/dev/tty0、eudev(udevd)运行;上游 systemd 单元 consolation.service.in 需改写"
