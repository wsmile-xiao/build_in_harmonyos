# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: consolation/0.0.10
homepage: "https://salsa.debian.org/consolation-team/consolation"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_check_command: ""
upstream_test_command: ""

# 上游测试说明
# 上游无测试套件：Makefile.am / src/Makefile.am 均未声明 TESTS
# （make check 退化为编译检查），故无可集成的上游测试，如实申报。

test_package_tests:
  - file: test_consolation.sh
    description: >-
      真实执行 3 项校验（R34 反空壳）：① 定位 sbin/consolation
      （上游 sbin_PROGRAMS）；② `consolation --version` 成功退出
      （input.c 的 OPT_VERSION 分支，version(); exit(0)，不触碰 VT）；
      ③ `consolation --help` 成功退出且输出含 "Usage:"
      （usage(); exit(0)，证明二进制能真实运行）。
      守护主循环需 CONFIG_VT/TTY0，仅真实设备集成阶段验证，不在本范围。
    command: "sh test_consolation.sh <pkg_dir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
