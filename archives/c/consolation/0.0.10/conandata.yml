patches:
  "0.0.10":
    - patch_file: "patches/0001-ohos-musl-program-invocation-name-fallback.patch"
      patch_description: >-
        musl(OHOS PC)不提供 glibc 全局 program_invocation_short_name
        (经 errno.h 在 _GNU_SOURCE 下声明);src/input.c 的 usage() 输出
        使用该符号导致编译失败。补丁在 !__GLIBC__ 下提供静态 fallback;
        glibc 行为不变。
      patch_type: "portability"
