# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cpplocate/2.3.0
homepage: "https://github.com/cginternals/cpplocate"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N; make tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (51 个独立 TEST 用例, 见 R01 枚举台账)
upstream_tests:
  - file: source/tests/liblocate-test/liblocate_test.cpp
    source: cpplocate-2.3.0/source/tests/liblocate-test/liblocate_test.cpp
    description: "liblocate C API 测试 (21 用例)"
    command: "./liblocate-test"
  - file: source/tests/liblocate-test/utils_test.cpp
    source: cpplocate-2.3.0/source/tests/liblocate-test/utils_test.cpp
    description: "utils 路径辅助测试 (20 用例)"
    command: "./liblocate-test"
  - file: source/tests/cpplocate-test/cpplocate_test.cpp
    source: cpplocate-2.3.0/source/tests/cpplocate-test/cpplocate_test.cpp
    description: "cpplocate C++ API 测试 (10 用例)"
    command: "./cpplocate-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_cpplocate.cpp
    description: "消费者测试: 调用 cpplocate API 校验路径解析与平台约定"
    command: "./test_cpplocate"
  - file: test_cpplocate_hmos.cpp
    description: "HarmonyOS 专项: 可执行/模块/库路径定位与 OHOS 平台特性断言"
    command: "./test_cpplocate_hmos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 51