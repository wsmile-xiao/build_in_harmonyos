# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2026.08.05/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2026.08.05"

software: "cute_headers"

status: built

build_date: "2026-08-28"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/RandyGaul/cute_headers/archive/389aa9554f478c49d5db2715548f52b8d5286db7.tar.gz"

  # 源码校验和
  sha256: "019609433eb248f968018764f704a1a19ed3746b2b4b8272b48e29927ea35080"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
