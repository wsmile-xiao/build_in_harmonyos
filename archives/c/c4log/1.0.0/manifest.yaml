software: c4log
version: "1.0.0"
status: built
build_date: "2026-09-02"
build_system: cmake

source:
  url: "https://github.com/biojppm/c4log/archive/23e9bdba1edca287042b45d6ae6c8ea0fb1ad211.tar.gz"
  sha256: "5bf5102d288f130163574d431feacbea1885f7c055239582492f09a2ae464388"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_CXX_STANDARD=17"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-cmake-ohos-minimal.patch"

knowledge_gained:
  - "upstream uses c4Project (biojppm/cmake submodule) which requires recursive submodule fetch; replaced with minimal standalone CMake to avoid network fetch"
  - "c4log depends on c4core (ext/c4core) - vendored via source() second get() to ext/c4core"
  - "c4core compiled sources are 9 cpp files under src/c4/*.cpp"
  - "upstream doctest suite (5 TEST_CASEs) needs doctest header; not executed in OHOS CI, covered by test_package"
