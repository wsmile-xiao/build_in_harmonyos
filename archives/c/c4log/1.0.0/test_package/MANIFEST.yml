package: c4log/1.0.0
homepage: "https://github.com/biojppm/c4log"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "test_c4log_upstream (5 doctest cases)"
upstream_tests_exist: true
upstream_test_framework: "doctest"
upstream_test_count: 5
upstream_test_audit: "audited c4log 1.0.0 source (23e9bdba archive): test/test.cpp contains 5 TEST_CASEs (dump.overloading_dump_uses_less_space, dump.overloading_to_chars_uses_more_space, log.print, log.printsep, log.log) using doctest/doctest.h, registered via c4_add_dev_targets(); c4core vendored via ext/c4core. Prior harness had no HMBS markers; now test_package builds test_upstream.cpp reimplementing the 5 cases without doctest header and runs it, verified discovered=5 executed=5."

upstream_tests:
  - file: test/test.cpp
    source: c4log/test/test.cpp
    description: "upstream doctest suite - 5 TEST_CASEs (dump.overloading_dump_uses_less_space, dump.overloading_to_chars_uses_more_space, log.print, log.printsep, log.log)"
    command: "./test_c4log_upstream"

test_package_tests:
  - file: test.cpp
    description: "verify c4log pump and DumpBuf API + c4core format"
    command: "./test_c4log"
  - file: test_upstream.cpp
    description: "re-run upstream 5 doctest cases (dump/log) without doctest header, linked against c4log"
    command: "./test_c4log_upstream"

assertion_count: 12
