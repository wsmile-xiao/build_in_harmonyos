software: coreutils-fmt
display: "GNU coreutils fmt"
description: "GNU coreutils fmt — simple text formatter, extracted as standalone package"
category: text
homepage: "https://www.gnu.org/software/coreutils/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess needs HarmonyOS recognition (same as coreutils 9.10)"
    - "gnulib freadahead.c needs musl opaque FILE fallback (9.11 removed freadptr.c/freadseek.c)"
    - "mktemp wrapper needed for HMDFS permission fix"
    - "fmt does NOT use fstat/lseek (unlike cat/dd/head/sort/etc.)"
  common_dependencies: []

versions:
  "9.11":
    status: built
    build_date: "2026-09-08"
