# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cpu_features/0.9.0
homepage: "https://github.com/google/cpu_features"

# 上游测试命令 (CMake/CTest 项目)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./bit_utils_test && ./string_view_test && ./stack_line_reader_test && ./cpuinfo_aarch64_test"

# 上游实际运行的测试程序 (OHOS/armv8 配置实例化的 4 个可执行)
upstream_tests:
  - file: test/bit_utils_test.cc
    source: cpu_features-0.9.0/test/bit_utils_test.cc
    description: "bit manipulation helpers (2 TEST cases)"
    command: "./bit_utils_test"
  - file: test/string_view_test.cc
    source: cpu_features-0.9.0/test/string_view_test.cc
    description: "string_view helpers (17 TEST cases)"
    command: "./string_view_test"
  - file: test/stack_line_reader_test.cc
    source: cpu_features-0.9.0/test/stack_line_reader_test.cc
    description: "stack line reader (4 TEST cases)"
    command: "./stack_line_reader_test"
  - file: test/cpuinfo_aarch64_test.cc
    source: cpu_features-0.9.0/test/cpuinfo_aarch64_test.cc
    description: "aarch64 detection (6 declared; 4 on Linux/OHOS branch, 2 mutually exclusive macOS/Windows)"
    command: "./cpuinfo_aarch64_test"

# 上游源码声明总数 (9 个测试源文件, 132 个 TEST/TEST_F; 平台互斥套件 x86/arm/mips/ppc/s390x/riscv/loongarch 不实例化)
source_declared_total: 132
configured_executable_total: 27
executed_passed_total: 27

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 GetAarch64Info/GetAarch64FeaturesEnumName 真实 API"
    command: "./test_cpu_features"

# 测试断言总数 (test_package 中 5 项运行时检查 + 上游 gtest 断言; 近似值)
assertion_count: 5
