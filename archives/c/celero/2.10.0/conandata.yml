sources:
  "2.10.0":
    url: "https://github.com/DigitalInBlue/Celero/archive/refs/tags/v2.10.0.tar.gz"
    sha256: "166f73a1f450396238074c7444e3295082bdda875355c62e1863af12a83be8fa"

patches:
  - patch_file: "patches/0001-test-cxx17-for-gtest-1.17.patch"
    patch_description: "Raise CXX_STANDARD to 17 for the celero-test target only (gtest >= 1.17 requires C++17; the library itself keeps the upstream C++14)"
    patch_type: "portability"
  - patch_file: "patches/0002-fix-upstream-test-debt.patch"
    patch_description: "Fix 7 upstream test cases that fail on any platform: align Benchmark null-baseline expectations with the implementation (it throws), guard Callbacks assertions behind a test-local flag (registered global callbacks cannot be deregistered and leak into later Executor suites), relax Memory live-system-state assertions (freeram excludes reclaimable page cache on busy systems)"
    patch_type: "bugfix"
