name: celero
version: 2.10.0
description: "C++ micro-benchmarking library to measure the performance of C++ code"
homepage: "https://github.com/DigitalInBlue/Celero"
license: "Apache-2.0"
build_system: "CMake"
cpp_standard: "C++14"

status: "built"

source:
  url: "https://github.com/DigitalInBlue/Celero/archive/refs/tags/v2.10.0.tar.gz"
  sha256: "166f73a1f450396238074c7444e3295082bdda875355c62e1863af12a83be8fa"

dependencies:
  # 库本体零外部依赖；上游单元测试经 test_requires 引入 gtest（不传播给消费者）
  system:
    - pthread
  test:
    - gtest/1.17.0.1

patches:
  - file: "patches/0001-test-cxx17-for-gtest-1.17.patch"
    reason: "gtest >= 1.17 要求 C++17，上游全局固定 C++14；仅提升 celero-test 目标标准，库本体与用例逻辑零改动"

features_disabled:
  - CELERO_ENABLE_EXPERIMENTS (示例程序)
  - CELERO_ENABLE_AUTO_RUN_TESTS (POST_BUILD 自动跑测试行为不可控，改为 build() 显式执行)
  - CELERO_ENABLE_WARNINGS_AS_ERRORS (交叉编译 -Werror 风险)

platform:
  os: [Linux, OHOS]
  arch: [aarch64]

test_results:
  upstream_gtest: "67/67 通过（真机 shadow CI，2026-09-08）"
  test_package: "6 项断言全 PASS（Statistics 5 项确定性断言 + celero::Run 基准）"

notes: |
  - 上游 tag 带 v 前缀：v2.10.0
  - 库本体无源码补丁；Timer 用 std::chrono，Memory 用 sysinfo()（musl 提供）
  - Debug 后缀 "-d" 已通过 CMAKE_DEBUG_POSTFIX="" 清除
  - 真机 shadow CI 验证通过（2026-09-08，commit 2a0be6cd82，run 20260908T022643Z）：
    G0/L0/L1/L4/L5 pass（L4 patches clean），L2 skip（纯库无 bin/），Total 1/Success 1
