package: celero/2.10.0
homepage: "https://github.com/DigitalInBlue/Celero"

upstream_check_command: "ctest"
upstream_test_in_build: false
# Upstream unit tests are GTest-based (test/*.test.cpp, 15 files) and only
# build with CELERO_ENABLE_TESTS=ON + find_dependency(GTest). Disabled in
# recipe to keep the library build dependency-free.

upstream_tests: []

test_package_tests:
  - file: test.cpp
    description: "Statistics API deterministic assertions (size/mean/min/max/variance) + real micro-benchmarks driven through celero::Run()"
    command: "./test_celero"

assertion_count: 6
