# 版本级 manifest
# 文件位置: archives/c/callisto/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 软件名
software: "callisto"

# 编译状态
# published | built | failed | archived
# 本地实测状态；CI 结果出来后按 CI 实际结果更新
status: built
build_date: "2026-09-17"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 源码池 orig tarball——上游无 release tarball
  # 发布，官方发布走 Debian 源码包，顶层目录 callisto-1.1.0/）
  url: "https://deb.debian.org/debian/pool/main/c/callisto/callisto_1.1.0.orig.tar.gz"

  # 源码校验和（本地 = pool 下载逐字节一致已核验）
  sha256: "0c278342f9c641d6596f253767c304eb587bcad0f57e7e1ab8a5f9f73323ab42"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（autotools：configure.ac AC_PROG_CC + ACX_PTHREAD +
  # AC_CHECK_LIB(cfitsio, ffopen)，均 required）
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"

  # 编译依赖列表（格式: name/version）
  # cfitsio 为 configure.ac 强制链接依赖（AC_CHECK_LIB required）
  dependencies:
    - cfitsio/4.6.4

  # 编译器（AutotoolsToolchain 从 tools.build:compiler_executables conf
  # 取 OHOS 工具链注入 CC/CFLAGS/LDFLAGS）
  cc: clang (OHOS)
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零补丁，上游源码原样构建）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autotools 老包（2017 config.guess）在 OHOS 交叉构建下应显式 --build/--host 固定三元组，避免 config.sub 误判（与 a52dec 先例一致）"
  - "无 test 目标的守护进程型 C 程序 build() 完整性检查应双路执行：-V 版本旗标实跑断言 rc=0 + 版本串，再走无配置启动路径断言优雅失败（rc<=128 + 可读错误串），验证 ETCDIR/chdir/read_config 链路"
  - "configure.ac 内 PTHREAD/CFITSIO 为 AC_MSG_ERROR 硬依赖：依赖 include/lib 路径经 AutotoolsToolchain 注入即可，无需手改环境"
