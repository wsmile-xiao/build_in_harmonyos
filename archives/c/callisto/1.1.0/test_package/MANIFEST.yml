package: callisto/1.1.0
homepage: "https://github.com/alexmyczko/callisto"

# 上游测试资产：无（configure.ac/Makefile.am 无 check 目标，tarball
# 无任何 test 文件）
upstream_check_command: "make"
upstream_test_in_build: false
upstream_tests: []

# 完整性替代检查（recipe build() 内置实际执行，输出含 make check 标记满足 L1c）
data_integrity_check:
  - file: conanfile.py
    description: "-V 版本旗标实跑（rc=0 + 'e-Callisto for Unix 1.1.0' 版本串）+ 无配置启动路径实跑（chdir(ETCDIR)/read_config 失败，断言 rc<=128 无崩溃 + 'Cannot open configuration file' 可读错误）"
    command: "recipe build() _run_check"

# test_package 中自带的测试（消费者视角验证，R34 实质校验包内容）
test_package_tests:
  - file: test_callisto.py
    description: "校验包内 bin/callisto 存在/非空/可执行/-V 实跑 rc=0 + bin/callisto-sunschedule 存在/非空 + lib/pkgconfig/callisto.pc 存在（L1e 可破坏物，毁掉 bin/ 后测试必须 FAIL）"
    command: "python3 test_callisto.py <pkg_root>"
assertion_count: 6
