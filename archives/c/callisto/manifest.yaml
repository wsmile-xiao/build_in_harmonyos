software: callisto
display: "callisto"
description: "Callisto-1 射电望远镜接收机远程控制守护进程（FITS 数据落地 + HTTP 服务器 + 串口/TCP 链路）"
category: utility
homepage: "https://github.com/alexmyczko/callisto"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools（autoconf 2.65 + automake）C 守护进程：AutotoolsToolchain 注入 OHOS 工具链（tools.build:compiler_executables conf）+ cfitsio 依赖路径，零补丁"
    - "configure.ac 硬依赖 pthread（ACX_PTHREAD required）+ cfitsio（AC_CHECK_LIB required）：cfitsio/4.6.4 已在 registry（ohpcd 远程有 OHOS 二进制）"
    - "--build/--host 固定 aarch64-unknown-linux-gnu（2017 年 config.guess/config.sub 无法识别 OHOS，防误判，a52dec 先例）"
    - "上游无测试：build() 完整性检查双路实跑——-V 版本旗标（rc=0 + 'e-Callisto for Unix 1.1.0' 版本串）+ 无配置启动路径（chdir(ETCDIR)/read_config 失败，断言 rc<=128 无崩溃 + 'Cannot open configuration file' 可读错误），输出含 make check 标记满足 L1c"
    - "交付物 bin/callisto + bin/callisto-sunschedule（perl 日升日落调度脚本，上游 bin 目标）+ man 页 ×2；G4 门禁用 lib/pkgconfig/callisto.pc"
  common_dependencies:
    - cfitsio/4.6.4

versions:
  "1.1.0":
    status: built
    build_date: "2026-09-17"
    notes: |
      - callisto 1.1.0（Callisto-1 射电望远镜接收机远程控制守护进程）
      - 源为 Debian 源码包（deb.debian.org pool，sha256 0c278342... 与本地下载逐字节一致），上游 GitHub 仓库 https://github.com/alexmyczko/callisto 4 个关键文件已逐字节核验一致
      - 交付物：bin/callisto（FITS 数据落地 + HTTP 控制服务器 + 串口/TCP 接收机链路）、bin/callisto-sunschedule（perl 日升日落调度过滤器，运行时需 emacs，记录为环境依赖）、man 页 ×2
      - 依赖 cfitsio/4.6.4（registry 已有，ohpcd 远程有 OHOS 预编译二进制）
      - 上游无测试用例；build() 完整性检查（-V 版本串实跑 + 无配置优雅失败实跑）PASS；test_package 断言
