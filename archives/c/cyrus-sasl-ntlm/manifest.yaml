# 软件级 manifest
# 文件位置: archives/c/cyrus-sasl-ntlm/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: cyrus-sasl-ntlm

# 显示名
display: "Cyrus SASL NTLM mechanism"

# 一句话描述
description: "Cyrus SASL NTLM authentication mechanism (libsasl2 with NTLM/OpenSSL support)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: security

# 官网 URL
homepage: "https://www.cyrusimap.org/sasl/"

# 开源许可证（SPDX 标识）
license: BSD-Attribution-HPND-disclaimer

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "NTLM（plugins/ntlm.c）需要 MD4/HMAC-MD5/DES，必须 --enable-ntlm --with-openssl=<prefix>"
    - "上游 config.guess 不认 HarmonyOS uname，需补 aarch64-unknown-linux-ohos 识别"
    - "HMDFS 下 autoconf umask 077 临时目录不可写，需放宽到 022"
    - "configure 需显式喂 CC_FOR_BUILD=clang（OHOS 无 gcc/cc）"
    - "lib/Makefile 的 linksrcs 软链接在 HMDFS 不可用，须改为拷贝 ntlm.c/db_none.c"
    - "libsasl2.a 内 ntlm.o 的 -lcrypto 链接闭包必须由 LIBS 提供，上游 NTLM_LIBS 只覆盖共享模块"
    - "静态构建 --with-staticsasl，机制表编译期链入，无需运行期 SASL_PATH/dlopen"

  # 跨版本通用依赖
  common_dependencies:
    - openssl/3.5.6

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.1.28":
    status: built
    build_date: "2026-09-26"
    conan_ref: "cyrus-sasl-ntlm/2.1.28"
    note: "NTLM 机制首个适配版本；待 HMBS 真机验证通过后标 published"
