# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cyrus-sasl-ntlm/2.1.28
homepage: "https://www.cyrusimap.org/sasl/"

# 上游测试套件存在性 (经审计上游源码确认：无自动化测试框架)
upstream_tests_exist: false

# 上游测试审计 (源码: cyrus-sasl-2.1.28.tar.gz,
# sha256 7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c)
upstream_test_audit:
  source_tarball: "cyrus-sasl-2.1.28.tar.gz"
  source_sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / add_test (ctest)"
    - "check_PROGRAMS / TESTS (automake make check)"
    - "meson test wiring"
  scan_result: "0 matches — 顶层 Makefile.am 无 check 目标；utils/Makefile.am 仅有 EXTRA_PROGRAMS（testsuite/testsuitestatic/smtptest），无 TESTS/check_PROGRAMS；BLFS 明确记录 This package does not come with a test suite"
  manual_programs_only:
    - "utils/testsuite.c — 手动交互式测试程序（共 18 个命名阶段），需先用 saslpasswd2 预建含 ken/1234 的 sasldb 口令库；本配方 --with-dblib=none --disable-auth-sasldb，无口令后端，故非自动化断言套件"
    - "sample/client.c + sample/server.c — 示例程序（本配方 --disable-sample 不构建）"
    - "saslauthd/testsaslauthd.c — 需运行中 saslauthd 守护进程的手动集成测试（本配方 --without-saslauthd 不构建）"
    - "plugins/ntlm.c — NTLM 机制本身无独立上游测试；其算法自测由 utils/testsuite 的 NTLM 阶段覆盖（见 manual_run_evidence）"
  reason: "cyrus-sasl 2.1.28 上游发布包不含任何自动化测试套件"

# 上游手动测试入口实测记录（本次适配真实执行，非自动化套件，仅供证据留档）
manual_run_evidence:
  entry: "utils/testsuite (make -C utils testsuite)"
  prerequisites: "预置 sasldb（printf '1234\\n' | ./utils/saslpasswd2 -p -c -f ./sasldb ken）+ SASL_PATH 指向机制可用路径"
  observed: "以 --enable-auth-sasldb --with-dblib=lmdb 的测试闭包树实跑：前 7 个阶段通过（checkpass/random/base64/auxprop/init/listmech/serverstart），第 8 阶段 client-first 的 NTLM 子步骤在依赖 lmdb/0.9.35 内部 mdb_cursor_set 崩溃（SIGSEGV，调用栈已符号化）。交付配方为 --with-dblib=none，无需该后端"
  conclusion: "上游无自动化测试套件；utils/testsuite 为需外部口令库的手动程序，不计入自动化测试统计"

# 上游测试命令 (无自动化套件，故 check 命令不适用)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ntlm.c
    description: "消费者测试：版本 2.1 校验 + client 初始化/建连 + 机制枚举 + NTLM 客户端可用 + NTLM 服务端可用 + 鸿蒙静态机制表不变量"
    command: "./test_ntlm"

# 鸿蒙特有测试用例（>=1，要求来自适配任务约定）
ohos_specific_tests:
  count: 1
  cases:
    - name: "ohos-static-mech-table"
      file: test_ntlm.c
      description: "把 sasl 插件搜索路径 sasl_set_path(SASL_PATH_TYPE_PLUGIN) 指向不存在的目录后，NTLM 仍必须出现在 sasl_listmech 结果中"
      rationale: "本包在 OHOS 上以静态 libsasl2.a + STATIC_NTLM + --disable-staticdlopen 交付：机制不依赖运行期 dlopen/SASL_PATH 插件搜索（HMDFS 不服务 linksrcs 软链接、可重定位前缀下编译期 /lib/sasl2 不存在）。该断言即验证这条鸿蒙适配不变量；一旦退化为共享 dlopen 插件包，本项必须失败"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
