# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # 配置选项列表（NTLM 专用最小闭包：只开 NTLM + OpenSSL，其余机制/后端全关）
  configure_options:
    - "--enable-ntlm"
    - "--with-openssl=<openssl package root>"
    - "--disable-shared"
    - "--enable-static"
    - "--with-staticsasl"
    - "--disable-staticdlopen"
    - "--disable-anon"
    - "--disable-cram"
    - "--disable-digest"
    - "--disable-login"
    - "--disable-sql"
    - "--disable-auth-sasldb"
    - "--with-dblib=none"
    - "--without-saslauthd"
    - "--disable-sample"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/3.5.6

  # 编译器
  cc: clang
  cxx: clang++

