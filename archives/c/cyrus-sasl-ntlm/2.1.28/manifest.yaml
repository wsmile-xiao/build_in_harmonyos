# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "NTLM 机制的密码学闭包：P16_lm/P16_nt 用 MD4，P21 用 HMAC-MD5，V2 用 HMAC-MD5+MD5，P24/E 用 DES(ecb) —— 全部来自 OpenSSL libcrypto；--enable-ntlm 必须搭配 --with-openssl=<prefix>"
  - "★ 上游 NTLM_LIBS(-lcrypto) 只进 plugins/libntlm.la 的 LIBADD；libsasl2.a 内 ntlm.o 的 HMAC_*/MD4_*/DES_* 未定义符号在 dbconverter-2/pluginviewer/testsuite 等 $(LIBS) 链接方解析失败 → 必须把 -lcrypto 放进 configure 的 LIBS"
  - "libsasl2.a 内 ntlm.o 与 sasldb.o/db_none.o 由 lib/Makefile 的 linksrcs 目标软链到 lib/ 后编译；HMDFS 不服务该软链接（make 报 linksrcs Error 1 ignored，随后编译因缺源失败），须预拷贝 plugins/ntlm.c、sasldb/db_none.c"
  - "上游 utils/testsuite.c 用 char 接收 getopt() 返回，aarch64 上 char 为无符号，EOF(-1) 判定失效导致 options 解析异常（Invalid parameter）；补丁 0004 改为 int（仅影响可选手动测试程序，不影响库产物）"
  - "上游无自动化测试套件（顶层无 check 目标，utils 仅 EXTRA_PROGRAMS）；utils/testsuite 是需外部 sasldb 口令库的手动 18 阶段压力程序"

