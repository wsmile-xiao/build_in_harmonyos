software: clucene-contribs
display: "clucene-contribs"
description: "CLucene contributions (German/CJK analyzers + highlighter + snowball stemmers)"
category: search
homepage: "https://clucene.sourceforge.net/"
license: "LGPL-2.0-or-later OR Apache-2.0"
build_system: cmake

ohos_adaptation:
  key_points:
    - "与 clucene-core 同一上游 tarball（src/contribs-lib 子树）；整树构建，交付面仅 contribs 产物+头"
    - "requires clucene-core/2.3.3.4 恒定 shared 变体（contribs-lib .so 运行期 NEEDED core .so）"
    - "上游 contribs-lib 无 install 规则（补丁 0006 补齐）"
    - "GERMAN_STOP_WORDS 无 NULL 哨兵致 GermanAnalyzer 构造随机崩（补丁 0007 生产缺陷修复）"
  common_dependencies:
    - clucene-core/2.3.3.4
    - zlib/1.3.1.1

versions:
  "2.3.3.4":
    status: built
    build_date: "2026-09-09"
