sources:
  # 上游官方 SourceForge 域在 CI worker 上不可达（PR !9401 首次 CI：预下载
  # curl --max-time 300 超时，elapsedTime 360s；CI 的 mirror-fallback 对
  # sourceforge 无可用镜像映射，仅回填原 URL）。改用权威发行版镜像：
  # NetBSD pkgsrc distfiles CDN（字节级一致，已 cmp 与官方 tarball 相同；
  # 仓库先例 aamath/0.3.1、libquantum/1.0.0 同域且 CI 通过）。
  # 单值形态（不写多 URL 列表：CI mirror-fallback 正则要求 url 与 URL 同行）。
  url: "https://cdn.netbsd.org/pub/pkgsrc/distfiles/clucene-core-2.3.3.4.tar.gz"
  sha256: "ddfdc433dd8ad31b5c5819cc4404a8d2127472a3b720d3e744e8c51d79732eab"

patches:
  "2.3.3.4":
    - patch_file: "patches/0001-fix-cxx11-narrowing.patch"
      patch_description: "C++11 列表初始化窄化错误修复（JavaCC 生成表与 TCHAR 初值，整树构建需要）"
      patch_type: "portability"
    - patch_file: "patches/0002-fix-single-thread-mode-macros.patch"
      patch_description: "DISABLE_MULTITHREADING 单线程模式宏缺失修复（整树构建需要）"
      patch_type: "portability"
    - patch_file: "patches/0003-test-usleep-explicit-unistd.patch"
      patch_description: "musl 下 usleep 需显式包含 unistd.h（上游测试修改）"
      patch_type: "portability"
    - patch_file: "patches/0004-test-sort-data-rename-std17.patch"
      patch_description: "C++17 下全局 data 与 std::data 二义，测试数据表改名 datap（上游测试修改）"
      patch_type: "portability"
    - patch_file: "patches/0005-test-mock-ramdir-init-rate.patch"
      patch_description: "MockRAMDirectory::randomIOExceptionRate 未初始化（UB）致测试间歇失败，构造函数补零（上游测试修改）"
      patch_type: "portability"
    - patch_file: "patches/0006-contribs-install-and-test-include.patch"
      patch_description: "contribs-lib 补 install 规则并去 EXCLUDE_FROM_ALL（构建配置）；修 contribs 测试 include 路径变量未定义（上游测试修改）"
      patch_type: "portability"
    - patch_file: "patches/0007-german-stopwords-sentinel.patch"
      patch_description: "GERMAN_STOP_WORDS 数组补 NULL 哨兵修 fillStopTable 越界读（contribs 主代码生产缺陷修复）"
      patch_type: "bugfix"
