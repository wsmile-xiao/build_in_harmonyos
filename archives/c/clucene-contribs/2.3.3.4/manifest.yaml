version: '2.3.3.4'
software: 'clucene-contribs'
status: built
build_date: '2026-09-09'
build_system: cmake

source:
  url: 'https://cdn.netbsd.org/pub/pkgsrc/distfiles/clucene-core-2.3.3.4.tar.gz'
  sha256: 'ddfdc433dd8ad31b5c5819cc4404a8d2127472a3b720d3e744e8c51d79732eab'
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
    - '-DDISABLE_MULTITHREADING=ON'
    - '-DBUILD_CONTRIBS_LIB=ON'
    - '-DCMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG=-Wl,-soname,'
    - '-DZLIB_ROOT=<conan zlib 包目录>'
  dependencies:
    - clucene-core/2.3.3.4
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied:
  - '0001-fix-cxx11-narrowing.patch'
  - '0002-fix-single-thread-mode-macros.patch'
  - '0003-test-usleep-explicit-unistd.patch'
  - '0004-test-sort-data-rename-std17.patch'
  - '0005-test-mock-ramdir-init-rate.patch'
  - '0006-contribs-install-and-test-include.patch'
  - '0007-german-stopwords-sentinel.patch'

knowledge_gained:
  - 'CMake 4 移除 <3.5 最低版本兼容；不改上游 CMakeLists 用 CMAKE_POLICY_VERSION_MINIMUM=3.5 政策参数即可 configure'  # knowledge_ref: E187
  - '上游 OPTION(DISABLE_MULTITHREADING) 单线程便携模式在 musl/OHOS 可编译可测（修复宏后 160/160 通过）；MT 模式 TestThreading 必现 SIGSEGV 属上游竞争缺陷（chimera/Adelie musl 同口径）'  # knowledge_ref: E2175 (draft files carried in PR !8895; this package depends on it)
  - 'contribs-lib 与 core 源码均零 boost include（"boost factor" 系 Lucene 评分概念）；整树构建时同源补丁集需整组重放，声明依赖前先 grep include 审计'  # knowledge_ref: E2176 (draft files carried in PR !8895; this package depends on it)
