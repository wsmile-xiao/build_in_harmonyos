# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: clucene-contribs/2.3.3.4
homepage: https://clucene.sourceforge.net/

# 上游测试命令（BUILD_CONTRIBS_LIB=ON：cl_test 内含 contribs 套件
# GermanAnalyzer Test；CuTest 自带框架随源码捆绑，无外部测试依赖）
# cl_test 的库依赖与测试数据均按相对路径解析，上游预期从
# build/src/test 目录运行（dist-test.sh 同口径）
upstream_check_command: "cd <build>/src/test && TEMP=test-tmp TMP=test-tmp srcdir=<source>/src/test LD_LIBRARY_PATH=<build>/bin ../../bin/cl_test"
upstream_test_in_build: true
upstream_test_command: "cd <build>/src/test && TEMP=test-tmp TMP=test-tmp srcdir=<source>/src/test LD_LIBRARY_PATH=<build>/bin ../../bin/cl_test"

# cl_test 内注册的 36 个 suite（BUILD_CONTRIBS_LIB=ON 时含 contribs 套件）
upstream_tests:
  - file: src/test/testall.cpp
    source: clucene-core-2.3.3.4.tar.gz/src/test/
    description: "CuTest 全套测试（37 suites：36 core + contribs GermanAnalyzer，index/search/analysis/store/util/queryParser/document/debug 全覆盖）"
    command: "./bin/cl_test"
  - file: src/test/contribs-lib/analysis/de/TestGermanStemFilter.cpp
    source: clucene-core-2.3.3.4.tar.gz/src/test/
    description: "contribs GermanAnalyzer 词干化套件（TEST_CONTRIB_LIBS 条件编入）"
    command: "./bin/cl_test germananalyzer"

# 上游测试统计（取数口径见下方说明）
# 单位：CuTest case（套件输出行内每个点/字符 = 1 case）
# 取数命令：bin/cl_test 输出末行 "N tests run: P passed, F failed, I not implemented"
upstream_test_count:
  total: 160
  passed: 160
  failed: 0
  not_implemented: 0

# 与 clucene-core 包的差异：BUILD_CONTRIBS_LIB=ON 使 cl_test 额外编入
# contribs 套件（CLucene GermanAnalyzer Test，1 case，补丁 0006 修复其
# include 路径变量未定义），故 160 = core 口径 159 + contribs 1。
# DISABLE_MULTITHREADING=ON 单线程便携模式说明同 clucene-core 包。

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: smoke_contribs.cpp
    description: "contribs API 消费者测试：GermanAnalyzer 词干化建索引→检索 buch→命中断言→存储字段回读"
    command: "./smoke_contribs_probe"

# 测试断言总数（CuTest 断言调用静态计数 + smoke 条件断言）
assertion_count: 327
# 构成: src/test 全源码 CuAssert* 调用 325 处
#   （grep -rEho 'CuAssert[A-Za-z]*' src/test/ | wc -l）
#   + test_package/smoke_contribs.cpp 条件断言 2 处（hits 命中数/存储字段回读）
