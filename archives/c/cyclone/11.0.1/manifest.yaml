software: cyclone
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/11.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "11.0.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（通过 GitHub 官方仓库下载）
  url: "https://github.com/eclipse-cyclonedds/cyclonedds/archive/refs/tags/11.0.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_DDSPERF=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

  # 编译问题及解决方案
  build_issues:
    - "问题：ddsperf 构建时库加载路径错误（Error loading shared library ../../lib/libddsc.so）"
    - "解决方案：禁用 ddsperf 构建（-DBUILD_DDSPERF=OFF）"
    - "原因：CMake 构建时相对路径 RPATH 在鸿蒙平台无法正确解析"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Cyclone DDS 使用 CMake 构建系统"
  - "ddsperf 工具构建时存在库加载路径问题，需要禁用（-DBUILD_DDSPERF=OFF）"
  - "CMake 在鸿蒙平台需要识别 OHOS，输出警告但不影响编译"
  - "编译产物：idlc（IDL编译器）、libddsc.so（核心库）、libcycloneddsidl.so（IDL库）"
  - "国内镜像加速器（ghfast.top/gh-proxy.com/ghp.ci）无法访问，使用 GitHub 官方源直接下载"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
