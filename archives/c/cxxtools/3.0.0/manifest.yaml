version: "3.0.0"
software: "cxxtools"
status: built
build_date: "2026-09-12"
conan_ref: "cxxtools/3.0.0"
build_system: "autotools"

source:
  url: "https://github.com/maekitalo/cxxtools/archive/refs/tags/V3.0.tar.gz"
  sha256: "c48758af8c8bf993a45492fdd8acaf1109357f1c574810e353d3103277b4296b"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-demos"
    - "--disable-dependency-tracking"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies:
    - openssl/3.5.6.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-exception-ptr-swap-libcxx.patch"
  - "0002-use-list-for-nodes-libcxx.patch"
  - "0003-fix-string-view-char-libcxx.patch"
  - "0004-add-missing-string-include-libcxx.patch"
  - "0005-init-iostream-base-ptrstream-libcxx.patch"
  - "0006-file-test-link-ohos-hardlink.patch"
  - "0007-timespan-istream-days-libcxx.patch"
  - "0008-putfloat-quad-long-double-libcxx.patch"

knowledge_gained:
  - "V3.0 tag archive has no generated configure; bootstrap with autoreconf -fi via automake/libtool tool_requires"
  - "Upstream tests are a single alltests runner (55 suites); make check only builds it, run test/alltests explicitly"
  - "src/iodeviceimpl.h uses std::exception_ptr member swap (libstdc++ extension, absent in OHOS libc++); use std::swap + <utility>"
  - "SerializationInfo::Nodes as std::deque of incomplete type is rejected by libc++; std::list (C++17 incomplete-compatible) preserves order and reference stability, indexed accesses rewritten with std::advance"
  - "libc++ basic_string_view requires a trivial character type and hard-errors on basic_ostream<Char> insertion (String streaming delegates to string_view; endl overload resolution instantiates it); explicit std::basic_string_view<Char> specialization in char.h replaces the asserting primary with a read-only view (data/size/substr/compare/find)"
  - "Run autoreconf inside the TMPDIR-guard (_fs_env) so bootstrap temp files avoid read-only /tmp"
  - "Upstream runner emits success/errors/skipped only with -s (testmain.h returns app.errors()); run test/alltests -s inside _fs_env and parse the summary"
  - "tz suite needs IANA files via TZDIR (default /usr/share/zoneinfo absent on OHOS); probe on-device python tzdata (E292) + TZ=UTC for ownTz"
  - "file-test testLinkFile adapts only the hardlink sub-capability on HMDFS (EPERM etc.): explicit [hardlink skipped] note, symlink/copy coverage kept (luafilesystem precedent)"
  - "::link() EPERM throws PermissionDenied, i.e. AccessFailed (IOError/ios::failure hierarchy), never SystemError: 0006 must catch AccessFailed, and a raw-::link() probe (bypassing the library) confirms unsupported filesystems so genuine link bugs still surface"
  - "timespan istream path must not rely on (in >> double) on OHOS libc++: trailing d (Days) sets failbit while other suffixes pass; token + cxxtools::getFloat mirrors the SI path which already handles d"
  - "quad long double putFloat must use libc snprintf %Lg: ARM64 binary128 (digits10=33) breaks the generic log10/pow/division loop over 32 digits (48.0 round-trip fails while brief reporter prints both sides as 48); float/double keep generic path"
  - "tz suite: device has no zoneinfo tree and the Tz parser ignores POSIX footers, so slim files are wrong (Berlin explicit data ends 1996); res/zoneinfo/generate_berlin_fat.py (text-only) generates Europe/Berlin FAT (60 authentic transitions + 83 from its own CET rule) plus Samoa/UTC into TMPDIR/TZDIR at test time, TZ=UTC; no binaries are committed because CI restores PRs via diff+apply which drops GIT binary patches"
