sources:
  url:
    - "https://codeload.github.com/maekitalo/cxxtools/tar.gz/refs/tags/V3.0"
    - "https://github.com/maekitalo/cxxtools/archive/refs/tags/V3.0.tar.gz"
  sha256: "c48758af8c8bf993a45492fdd8acaf1109357f1c574810e353d3103277b4296b"
patches:
  "3.0.0":
    - patch_file: "patches/0001-fix-exception-ptr-swap-libcxx.patch"
      patch_description: "Replace std::exception_ptr member swap (libstdc++ extension, absent in libc++) with std::swap"
      patch_type: "portability"
    - patch_file: "patches/0002-use-list-for-nodes-libcxx.patch"
      patch_description: "Use std::list instead of std::deque for SerializationInfo::Nodes; deque of incomplete type is rejected by libc++, list is incomplete-type compatible since C++17 with identical iteration/reference-stability semantics"
      patch_type: "portability"
    - patch_file: "patches/0003-fix-string-view-char-libcxx.patch"
      patch_description: "Provide std::basic_string_view<cxxtools::Char> specialization; libc++ requires the character type to be trivial and hard-errors on wide-stream insertion (String output, endl), libstdc++ has no such assert"
      patch_type: "portability"
    - patch_file: "patches/0004-add-missing-string-include-libcxx.patch"
      patch_description: "Add missing #include <string> to xmlerror.h; libstdc++ provides std::string transitively via <stdexcept>, libc++ does not, breaking const char[] to std::string conversion"
      patch_type: "portability"
    - patch_file: "patches/0005-init-iostream-base-ptrstream-libcxx.patch"
      patch_description: "Explicitly initialize std::basic_iostream base with null buffer in BasicPtrStream ctors; libstdc++ provides a protected default ctor, libc++ does not"
      patch_type: "portability"
    - patch_file: "patches/0006-file-test-link-ohos-hardlink.patch"
      patch_description: "test/file-test.cpp testLinkFile: catch AccessFailed (PermissionDenied from ::link lives in the IOError hierarchy, not SystemError) plus SystemError, confirm via a raw-::link() probe that the filesystem really rejects hardlinks, then print [hardlink skipped] and return; symlink/copy coverage unchanged"
      patch_type: "portability"
    - patch_file: "patches/0007-timespan-istream-days-libcxx.patch"
      patch_description: "src/timespan.cpp tshelper::get(istream): parse the token with cxxtools::getFloat instead of (in >> double); OHOS libc++ leaves failbit for trailing d (Days) while u/ms/s/m/mi/h pass, SI path with getFloat handles d correctly"
      patch_type: "portability"
    - patch_file: "patches/0008-putfloat-quad-long-double-libcxx.patch"
      patch_description: "include/cxxtools/convert.h putFloat(long double): use libc snprintf %Lg instead of log10/pow/division loop; quad binary128 (digits10=33) accumulates error over 32 digits and breaks 48.0 round-trip, float/double keep generic path"
      patch_type: "portability"
