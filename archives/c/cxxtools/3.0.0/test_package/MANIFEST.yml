package: cxxtools/3.0.0
homepage: "https://github.com/maekitalo/cxxtools"

upstream_check_command: "test/alltests"
upstream_test_in_build: true
upstream_test_command: "make check && test/alltests -s"

upstream_tests:
  - file: test/arg-test.cpp
    source: cxxtools-V3.0/test/arg-test.cpp
    description: "Command-line argument parsing suite (part of alltests runner)"
    command: "test/alltests"
  - file: test/base64-test.cpp
    source: cxxtools-V3.0/test/base64-test.cpp
    description: "Base64 codec suite (part of alltests runner)"
    command: "test/alltests"
  - file: test/json-test.cpp
    source: cxxtools-V3.0/test/json-test.cpp
    description: "JSON parser/formatter suite (part of alltests runner)"
    command: "test/alltests"
  - file: test/xmlrpc-test.cpp
    source: cxxtools-V3.0/test/xmlrpc-test.cpp
    description: "XML-RPC suite (part of alltests runner)"
    command: "test/alltests"
  - file: test/uri-test.cpp
    source: cxxtools-V3.0/test/uri-test.cpp
    description: "URI parsing suite (part of alltests runner)"
    command: "test/alltests"

test_package_tests:
  - file: test_cxxtools.cpp
    description: "Consumer smoke test: base64, md5, convert, net::Uri (8 checks)"
    command: "./test_cxxtools"

assertion_count: 8
