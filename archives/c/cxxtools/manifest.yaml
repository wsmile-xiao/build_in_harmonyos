software: cxxtools
display: "cxxtools"
description: "Collection of general purpose C++ classes"
category: library
homepage: "https://github.com/maekitalo/cxxtools"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub tag archive has no generated configure; bootstrap with autoreconf -fi"
    - "config.guess cannot identify HarmonyOS; pass --build/--host=aarch64-unknown-linux-ohos explicitly"
    - "Disable demos (--disable-demos); keep unittest runner test/alltests"
  common_dependencies:
    - "openssl/3.5.6.1"

versions:
  "3.0.0":
    status: built
    build_date: "2026-09-12"
    conan_ref: "cxxtools/3.0.0"
