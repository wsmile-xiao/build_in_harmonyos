# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）
# 本条目来自本轮实际枚举与运行结果，详见 reports/upstream-tests-ledger.md

package: confu_json/1.2.4
homepage: "https://github.com/werto87/confu_json"

# 上游测试命令（cmake + ctest 注册）
upstream_check_command: "cmake -S . -B build-tests -DBUILD_TESTS=ON && cmake --build build-tests -j1 --target _test && (cd build-tests/test && ./_test)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（Catch2，单一 _test 可执行；47/49 实例化并全部通过，
# 2 个依赖 durak/2.1.1@modern-durak 的用例未实例化，见台账）
upstream_tests:
  - file: test/combineToJsonAndToObject.cxx
    source: confu_json-1.2.4/test/combineToJsonAndToObject.cxx
    description: "Catch2 用户测试源（47 个 TEST_CASE：组合/枚举/optional/unique_ptr 往返）"
    command: "./build-tests/test/_test"
  - file: test/playground.cxx
    source: confu_json-1.2.4/test/playground.cxx
    description: "Catch2 用户测试源（1 个空 TEST_CASE 'playground'）"
    command: "./build-tests/test/_test"
  - file: test/util.cxx
    source: confu_json-1.2.4/test/util.cxx
    description: "Catch2 用户测试源（1 个 TEST_CASE 'type_name'，3 个 SECTION）"
    command: "./build-tests/test/_test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者用例：通过公开头文件/公开 API 完成 enum/optional/vector JSON 往返，断言一致"
