# test_package MANIFEST — cramfsswap 1.4.5
software: cramfsswap
version: "1.4.5"
test_type: cli_functional

# 上游官方测试：debian autopkgtest test-cmd（debian/tests/control 声明 1 个
# 测试：Depends: @, util-linux, util-linux-extra, file）。上游无其他测试套件
# （无 tests/ 目录、Makefile 无 check 目标、无断言式验证程序）。
# test-cmd 语义：mkfs.cramfs -E 生成镜像 → cramfsswap 交换（diff 原镜像须不同）
# → 再交换（diff 原镜像须一致 → exit 0）。
upstream_check_command: "debian autopkgtest test-cmd（mkfs.cramfs 生成夹具）"
upstream_check_count: 1

# OHOS 适配口径：CI 环境无 util-linux 的 mkfs.cramfs（util-linux-extra 属
# Debian 打包层，OHOS CI PATH 无 .harmonybrew），test_package 以确定性 Python
# 字节构造等价 cramfs 镜像（LE 位域与设备 aarch64 一致，fsid.crc 按
# cramfsswap 输出侧重算口径预填）运行同一语义断言。等价性增证：设备本机以
# util-linux 2.42.3 mkfs.cramfs 生成的真实镜像跑同一「交换/复原」断言亦通过
#（见任务 reports/test-report.md）。
test_package_tests:
  - "交换 rc=0 且产出文件存在（上游 test-cmd 首次 swap）"
  - "交换后的镜像与原镜像不同（上游 diff ORG SWP_1 须非零语义）"
  - "stdout 报告 little endian → big endian"
  - "stdout 报告重算 CRC（CRC: 0x…）"
  - "magic 字段字节序已交换（28cd3d45 → 453dcd28）"
  - "二次交换（换回）rc=0（上游 test-cmd 第二次 swap）"
  - "二次交换结果与原镜像逐字节一致（上游 diff ORG SWP_2 零差异语义）"
  - "鸿蒙特有：--version/-V 返回 rc=0 且自报 1.4.5（补丁新增入口）"
  - "鸿蒙特有：--help/-h 返回 rc=0 并输出用法（补丁新增入口）"
  - "非 cramfs 输入 rc=1 且报 cramfs magic not detected（上游错误路径）"
  - "鸿蒙特有：无 LD_LIBRARY_PATH 注入的干净环境可直接执行（zlib 静态链接进产物）"
assertion_count: 11
fixture_count: 2
fixture_origin: "运行期生成（不入库）：①确定性 Python 构造的 4192B cramfs 镜像（root 目录 + 1 个普通文件）；②非 cramfs 文本文件（错误路径用）"
