# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Debian native 包无独立上游 tarball：官方 pool 的 cramfsswap_1.4.5.tar.xz 即源码本体（sha256 与 .dsc Checksums-Sha256 逐字符一致）；上游 Vcs 即 salsa.debian.org/debian/cramfsswap，tag debian/1.4.5 可作版本真实性的第二面验证"
  - "OHOS NDK sysroot 直接提供 linux/cramfs_fs.h（struct cramfs_inode 的 mode/uid/size/gid/namelen/offset 位域齐全）；CRAMFS_MAGIC 不在该头内而在 linux/magic.h，cramfs_fs.h 已 include 传递提供，无需自带内核头"
  - "上游 Makefile 的 CPPFLAGS/CFLAGS/LDFLAGS 变量插在源文件之前、-lz 在最后：conan 依赖的 -I/-L 经 CPPFLAGS/LDFLAGS 注入即得正确链接顺序；LD 独立于 CC（上游 LD=cc），OHOS 无裸 cc，CC/LD 必须同时覆盖"
  - "hnp clang 产物自带 .codesign 链接签名；上游 Makefile `all: cramfsswap strip` 的 strip 会使签名失效，内核拒绝 exec（Operation not permitted rc=126，文案像权限问题）；配方须 make 直指编译目标跳过 strip（同族：binary-sign-tool 重签 .so 崩加载器）"  # knowledge_ref: E642-draft-cramfsswap-strip-codesign-exec-eperm
  - "上游唯一测试 = debian autopkgtest test-cmd（mkfs.cramfs 夹具）；OHOS CI 无 util-linux 的 mkfs.cramfs，test_package 以确定性 Python 字节构造等价镜像（LE 位域 + fsid.crc 按输出重算口径预填）运行同一「首换不同/再换复原」断言"
  - "上游无任何版本探针（argc!=3 即 Usage 退出 1）：CI L2 冒烟探测 --version/--help/-V/-h 全 rc!=0 判 FAIL，需平台适配补丁新增自报入口（运行时分支非条件编译，不触发 R8）"

knowledge_ref:
  - E642-draft-cramfsswap-strip-codesign-exec-eperm

patch_generation:
  method: refresh-patch --auto（orig/work 双副本 difflib，单一 hunk 合并全部改动）
  patches_count: 1

patch_classification:
  - "0001-cramfsswap.c.patch: 平台适配（unistd.h 显式包含 + 版本/帮助探针入口），非上游缺陷修复"
