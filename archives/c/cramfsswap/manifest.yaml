# 软件级 manifest — cramfsswap
# 遵循 ARCHIVE-SPEC v3.0

software: cramfsswap
display: "cramfsswap"
description: "cramfs 文件系统镜像小端/大端字节序互换命令行工具"
category: utility
homepage: "https://salsa.debian.org/debian/cramfsswap"
license: "GPL-2.0-or-later"
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "手写 Makefile（非 autotools）；CC/LD/CPPFLAGS/LDFLAGS 可由 make 命令行变量覆盖；OHOS 无裸 cc，CC/LD 必须同时覆盖"
    - "依赖仅 zlib（CRC32）；conan zlib/1.3.1.1（ohpcd）在 OHOS armv8 为静态 libz.a，链接进产物后运行时无额外 DT_NEEDED"
    - "linux/cramfs_fs.h 与 byteswap.h 由 OHOS NDK sysroot 提供；CRAMFS_MAGIC 在 linux/magic.h（被前者传递 include）"
    - "上游唯一测试 = debian autopkgtest test-cmd（mkfs.cramfs 夹具）；OHOS CI 无 mkfs.cramfs，test_package 以确定性 Python 镜像运行同一语义断言"
    - "上游无版本探针（argc!=3 即 Usage 退出 1）；适配补丁新增 --version/-V/--help/-h 入口以满足 CI L2 冒烟探测"
  common_dependencies:
    - zlib/1.3.1.1

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.4.5":
    status: built
    build_date: "2026-09-21"
