package: cpptest/2.0.0
homepage: "https://github.com/cpptest/cpptest"

# Upstream suite existence: true. Upstream 2.0.0 ships no TESTS/check_PROGRAMS
# harness, but test/mytest.cpp contains 7 real TEST_ADD sites that the HMBS
# inventory scan counts as tests, so no_tests/0 is rejected (acf-lib-lua5.4
# precedent). build() really executes them as a behavior verification.
upstream_tests_exist: true

# Upstream test audit (source: cpptest 2.0.0 tag tarball,
# sha256 09d35d6ecc0e801925579b18efa0adfaa18e8fed19b2f4f743ec7a53f510e409)
upstream_test_audit:
  source_tarball: "cpptest-2.0.0.tar.gz (github tag archive)"
  source_sha256: "09d35d6ecc0e801925579b18efa0adfaa18e8fed19b2f4f743ec7a53f510e409"
  top_level_files:
    - configure.ac        # AC_CONFIG_FILES: Makefile doc/Makefile src/Makefile test/Makefile; no test harness option
    - Makefile.am         # SUBDIRS = src test (+doc); no TESTS / check_PROGRAMS / check target
    - src/Makefile.am     # lib_LTLIBRARIES = libcpptest.la only; no check_PROGRAMS / TESTS
    - test/Makefile.am    # noinst_PROGRAMS = mytest only; no TESTS / check_PROGRAMS
    - test/mytest.cpp     # 7 TEST_ADD sites (FailTestSuite 2, CompareTestSuite 3, ThrowTestSuite 2) with intentional failures; main() always returns EXIT_SUCCESS
  scanned_for:
    - "TEST(F / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am TESTS / check_PROGRAMS / check target"
    - "TEST_ADD (cpptest)"
    - "make check / ctest / meson test target"
  scan_result: "7 upstream TEST_ADD sites in test/mytest.cpp; no TESTS/check_PROGRAMS harness, make check is a no-op"
  make_check_output: "make check => no-op (no TESTS defined; nothing to run)"
  upstream_case_count: 7
  upstream_case_source: "grep -c TEST_ADD test/mytest.cpp (2 FailTestSuite + 3 CompareTestSuite + 2 ThrowTestSuite)"
  execution_method: "build() runs built test/mytest --text-verbose (output must be non-empty with failure evidence) plus a compiled verdict gate proving run()==true for passing asserts and run()==false for TEST_FAIL"
  falsification_guard: "mytest exit code ignored by design (always EXIT_SUCCESS); gate is output content (suite names + fail/assert evidence) plus verdict-gate GATE ok line; empty output or missing failure evidence fails the build"
  reason: "Upstream demo contains intentional failures (TEST_FAIL, 0==1, throw mismatches) and ignores Suite::run(), so exit 0 is not a pass signal. Verification instead checks the framework correctly exercises all 7 sites and correctly distinguishes pass from fail; no assert deleted or skipped."

# Upstream check command (real verification, not a no-op claim)
upstream_check_command: "test/mytest --text-verbose + verdict gate"

# Integrated in conanfile.py build() or not
upstream_test_in_build: true
upstream_test_command: "test/mytest --text-verbose + verdict gate (make -j1 check no-op) + HMBS_UPSTREAM_TEST_RESULT passed marker"

# Upstream programs actually run (7 TEST_ADD sites verified in build())
upstream_tests:
  - file: test/mytest.cpp
    source: cpptest-2.0.0/test/mytest.cpp
    description: "Upstream demo with 7 TEST_ADD sites; executed --text-verbose with output-content gate"
    command: "test/mytest --text-verbose"
  - file: conanfile.py (_run_upstream_mytest_verification)
    source: cpptest-2.0.0/test/mytest.cpp
    description: "Verdict gate: passing suite must report run()==true, TEST_FAIL suite must report run()==false"
    command: "compile+run .hmbs_verdict_gate against built lib"

# Consumer tests (test_package/)
test_package_tests:
  - file: test_cpptest.cpp
    description: "Consumer link+run: MathSuite (TEST_ASSERT/TEST_ASSERT_DELTA) + ThrowSuite (TEST_THROWS/TEST_THROWS_ANYTHING/TEST_THROWS_NOTHING) via TextOutput::Verbose; returns Suite::run() verdict"
    command: "ctest --output-on-failure"
  - file: conanfile.py
    description: "Conan test() entry: runs ctest, emits HMBS_TEST_PACKAGE_RESULT (2 suites) and re-emits HMBS_UPSTREAM_TEST_RESULT passed (7 sites)"
    command: "conan test test_package"

test_counting:
  upstream_independent_total: 7
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 9
assertion_count: 14
