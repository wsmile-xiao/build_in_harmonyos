# test_package/MANIFEST.yml — ctpg 1.3.7 上游测试声明
# 上游：https://github.com/peter-winter/ctpg (tag v1.3.7)
# 测试框架：Catch2 2.x（tests/main.cpp 为 CATCH_CONFIG_MAIN 入口；
#   tests/*.cpp 共 16 个测试源，52 个 TEST_CASE 注册进单一 testbin，
#   经 CMake catch_discover_tests 注册为 52 个 CTest 用例）

package: ctpg/1.3.7
homepage: "https://github.com/peter-winter/ctpg"

# 上游测试命令（cmake --build . --target testbin; ctest）
upstream_check_command: "cmake --build build && ctest --test-dir build"

# conanfile.py build() 已集成上游测试（CTPG_ENABLE_TESTS=ON + cmake.test()）
upstream_test_in_build: true
upstream_test_command: "cmake --build . && ctest"

# 上游实际运行的测试程序（testbin 单可执行 + Catch2 52 用例）
upstream_tests:
  - file: tests/main.cpp
    source: ctpg-1.3.7/tests/main.cpp
    description: "Catch2 测试入口（CATCH_CONFIG_MAIN）"
    command: "./testbin"
  - file: tests/simple_cases.cpp
    source: ctpg-1.3.7/tests/simple_cases.cpp
    description: "简单解析用例（6 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/simple_grammar.cpp
    source: ctpg-1.3.7/tests/simple_grammar.cpp
    description: "简单文法用例（2 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/regex_tests_1.cpp
    source: ctpg-1.3.7/tests/regex_tests_1.cpp
    description: "正则终结符用例组 1（6 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/regex_tests_2.cpp
    source: ctpg-1.3.7/tests/regex_tests_2.cpp
    description: "正则终结符用例组 2（8 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/regex_tests_3.cpp
    source: ctpg-1.3.7/tests/regex_tests_3.cpp
    description: "正则终结符用例组 3（8 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/empty_symbols.cpp
    source: ctpg-1.3.7/tests/empty_symbols.cpp
    description: "空符号用例（1 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/recurrence.cpp
    source: ctpg-1.3.7/tests/recurrence.cpp
    description: "递归文法用例（4 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/precedence.cpp
    source: ctpg-1.3.7/tests/precedence.cpp
    description: "优先级/结合性用例（2 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/compile_time.cpp
    source: ctpg-1.3.7/tests/compile_time.cpp
    description: "编译期解析用例（1 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/list_helpers.cpp
    source: ctpg-1.3.7/tests/list_helpers.cpp
    description: "列表助手用例（3 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/skip_whitespace.cpp
    source: ctpg-1.3.7/tests/skip_whitespace.cpp
    description: "跳过空白用例（2 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/typed_terms.cpp
    source: ctpg-1.3.7/tests/typed_terms.cpp
    description: "类型化终结符用例（1 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/source_tracking.cpp
    source: ctpg-1.3.7/tests/source_tracking.cpp
    description: "源码追踪用例（1 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/error_recovery.cpp
    source: ctpg-1.3.7/tests/error_recovery.cpp
    description: "错误恢复用例（1 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/buffers.cpp
    source: ctpg-1.3.7/tests/buffers.cpp
    description: "缓冲区用例（2 个 TEST_CASE）"
    command: "./testbin"
  - file: tests/contexts.cpp
    source: ctpg-1.3.7/tests/contexts.cpp
    description: "外部上下文用例（4 个 TEST_CASE）"
    command: "./testbin"

# test_package 自带消费者验证（真实调用 ctpg API：运行期+编译期解析断言）
test_package_tests:
  - file: test_ctpg.cpp
    description: "消费者验证：表达式列表解析 1,2,3=6 与编译期 4,5=9"
    command: "./test_ctpg"

# 上游 52 个 TEST_CASE 全量断言近似计数
assertion_count: 52