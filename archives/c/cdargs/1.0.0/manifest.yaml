test_package:
  assertion_count: 3
  description: "真实运行打包二进制：cdargs -f <list> -a <absdir> 非交互书签添加（-a/--add 分支在 init_curses() 之前 exit，无头可执行），校验书签文件写入绝对路径。"

knowledge_gained:
  - "cdargs 为 autotools C++ 单二进制工具（configure + make），链接 ncurses；OHOS 上 ncurses 包只提供宽字符库（libncursesw.a），configure 的 MP_WITH_CURSES 探测需把 -lncurses 替换为 -lncursesw（--with-ncurses 跳过 -lcurses 分支）"
  - "cdargs configure 为 Autoconf 2.52，config.status 用 umask 077 创建临时目录——HMDFS setgid 下不可写，须 patch 为 umask 022（同 a52dec 的 0002 修复）"
  - "OHOS 上应用二进制须 binary-sign-tool self-sign（SHA256withECDSA）才能执行，consumer 测试要实际运行必须签名"
  - "cdargs -a/--add 在 init_curses() 之前 exit，-f <list> -a <absdir> 是非交互书签添加，可作无头功能测试（书签文件格式：每行 <desc> <path>）"
