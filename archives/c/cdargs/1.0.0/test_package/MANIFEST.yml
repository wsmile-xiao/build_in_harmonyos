# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cdargs/1.0.0
homepage: "http://www.skamphausen.de/cgi-bin/ska/CDargs"

# 上游测试命令 — cdargs 1.35 官方 tarball 无自带测试套件
# （Debian orig.tar.gz 仅含源码；无 test/ 目录、无 make check 目标）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 消费者验证（test_package）：cdargs -f <list> -a <absdir> 非交互书签
# 添加——真实运行打包二进制（R34 完整执行，非降级），校验书签文件写入。
# 源码中 -a/--add 分支在 init_curses() 之前 exit，无头环境可运行。
upstream_tests: []
