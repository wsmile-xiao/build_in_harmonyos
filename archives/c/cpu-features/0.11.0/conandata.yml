sources:
  "0.11.0":
    url: "https://github.com/google/cpu_features/archive/refs/tags/v0.11.0.tar.gz"
    sha256: "ab2463f2d38fcaff1ce806be8e4c91333449931f5e02009d543b2569a3fa471a"
patches:
  "0.11.0":
    - patch_file: "patches/0001-use-conan-gtest.patch"
      patch_description: "BUILD_TESTING 时上游在 configure 期联网下载 googletest（沙箱无网络），改为 find_package(GTest) 使用 Conan test_requires 提供的 gtest；test/CMakeLists.txt 链接目标 gtest/gmock_main 换成 GTest::gtest/GTest::gmock_main"
      patch_type: "conan"
    - patch_file: "patches/0002-ohos-arch-fallback.patch"
      patch_description: "OHOS/HarmonyOS 的 CMAKE_SYSTEM_NAME=HarmonyOS 无 CMake 平台模块，CMAKE_SYSTEM_PROCESSOR 为空/unknown → 架构探测链落空报 Unsupported architectures unknown；回落到 CMAKE_HOST_SYSTEM_PROCESSOR（设备原生构建 uname -m = aarch64）"
      patch_type: "portability"
