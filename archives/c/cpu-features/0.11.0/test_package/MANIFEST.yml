# test_package/MANIFEST.yml — cpu-features 0.11.0
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: cpu-features/0.11.0
homepage: "https://github.com/google/cpu_features"

# 上游测试命令（cmake -DBUILD_TESTING=ON && ctest；test/CMakeLists.txt 按架构门控）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 中是否已集成上游测试（层1）
upstream_test_in_build: true
upstream_test_command: "build() 内 ctest --output-on-failure 全量实跑上游 gtest 套件"

# 上游测试真相：test/ 共 10 个测试二进制 133 个 TEST 用例，按处理器架构门控；
# aarch64 适用 4 个二进制（bit_utils_test 2 / string_view_test 17 /
# stack_line_reader_test 4 / cpuinfo_aarch64_test 7）共 30 用例，全部实跑通过。
# 其余 9 个架构专属二进制（x86/arm/mips/ppc/s390x/riscv/loongarch）在 aarch64
# 平台由上游 CMake 自身门控关闭，非适配裁剪。
upstream_test_count: 30
