patches_applied:
- "0001-use-conan-gtest.patch: configure 期联网下载 googletest → find_package(GTest)（沙箱无网络）"

knowledge_gained:
- "cpu_features BUILD_TESTING=ON 时在 configure 期 execute_process 联网拉 googletest，沙箱必失败；patch 换 find_package(GTest) + GTest:: 命名空间目标即可用 Conan gtest"
- "上游 test/ 10 个测试二进制按 CMAKE_SYSTEM_PROCESSOR 门控，aarch64 适用 4 个（bit_utils/string_view/stack_line_reader/cpuinfo_aarch64）共 30 TEST 用例"
- "上游注释明确建议静态链接（位域布局实现定义，共享库跨编译器 ABI 不稳）→ package_type=static-library"
- "消费侧鸿蒙特有断言：ARMv8 强制 fp/asimd，探测链路断裂时必为 0，可作设备端 smoke 判据"
