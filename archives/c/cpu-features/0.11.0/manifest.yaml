version: "0.11.0"
software: cpu-features

status: built
build_date: "2026-09-09"
build_system: cmake

source:
  url: "https://codeload.github.com/google/cpu_features/tar.gz/refs/tags/v0.11.0"
  sha256: "ab2463f2d38fcaff1ce806be8e4c91333449931f5e02009d543b2569a3fa471a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
  - "BUILD_TESTING=ON / BUILD_EXECUTABLE=ON"
  - "静态库（上游明确建议静态链接：位域布局实现定义）"
  dependencies:
  - "gtest/1.17.0 (test_requires，仅测试)"
