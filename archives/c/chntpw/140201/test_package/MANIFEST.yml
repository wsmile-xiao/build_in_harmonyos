# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: chntpw/140201
homepage: "https://pogostick.net/~pnh/ntpasswd/"

# 上游测试命令：Makefile 无 test/check 目标（raw Makefile，无测试目录/文件）
upstream_check_command: "无（Makefile 无 test/check 目标，静态清点为 0）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（静态清点证据：Makefile 全文与源码树无
# TESTS/test/check 目标、无测试目录；仅有 5 个工具源文件与其 .static 预编译产物）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：真实运行包交付的 CLI 工具并按上游源码断言行为——chntpw -h 与 reged -h 走 usage 正路径（rc=0 且 stdout 含特征串）、chntpw 无参走 usage+exit(1) 负路径（rc=1）、sampasswd -h rc=0（断言点均对应 chntpw.c:1047/1056、reged.c:105、sampasswd.c:160）"
    command: "./test_chntpw"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 6
