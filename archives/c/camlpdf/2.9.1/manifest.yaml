software: camlpdf
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.9.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.9.1"

# 构建系统类型
build_system: makefile

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/johnwhitington/camlpdf/archive/refs/tags/v2.9.1.tar.gz"

  # 源码校验和
  sha256: "08e13a341362fb586a8bb02daf85fc1ef62250b63e6b58812b9c361e3d1c9951"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OCaml库项目（OCamlMakefile）不需要configure脚本，直接make即可编译"
  - "ocamlfind不可用时，需手动安装库文件到site-lib目录"
  - "OCaml库项目没有可执行二进制，功能验证(G2)为warning而非failure"
  - "G0干净构建验证不适用于无configure的OCaml项目"
  - "manifest中build_system需为扁平字段，不能仅依赖嵌套build.system"
