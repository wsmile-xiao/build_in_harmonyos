knowledge_gained:
  - "E007: config.guess需要添加HarmonyOS识别，在Linux|GNU|GNU/*)分支中加入HarmonyOS，并添加aarch64:HarmonyOS:*:*)模式输出aarch64-unknown-linux-ohos"
  - "E072: config.sub需要3处修改：ohos-linux映射、ohos* OS白名单、linux-ohos* kernel-os白名单"
  - "musl不支持pthread_cancel，需用pthread_detach替代（加#ifdef __OHOS__守卫）"
  - "musl有shadow.h但getspnam/endspent未实现，需#undef HAVE_SHADOW_H"
  - "HMDFS禁止新编译二进制直接执行，需要binary-sign-tool自签名"
  - "INSTALL_BIN -s标志会strip二进制导致ELF签名失效，需移除"
  - "lld链接器有问题，需用-fuse-ld=bfd或GNU ld wrapper"

