# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.4"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: "{BUILD_SYSTEM}"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/coin-or/Vol/archive/refs/tags/releases/1.5.4.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-musl"
    - "--disable-dependency-tracking"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Vol-config.guess.patch"
  - "0002-Vol-config.sub.patch"
  - "0003-Vol-src-VolVolume.hpp.patch"
  - "0004-config.guess.patch"
  - "0005-config.sub.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "coinor-vol 自带 2007 版 config.guess/config.sub 无法识别 HarmonyOS/aarch64，需加 HarmonyOS 分支与 aarch64/musl 支持（顶层与 Vol/ 子目录各一份）"
  - "COIN-OR 递归 configure 的 config.status 在 HMDFS 上需修补 mktemp/umask（mkdir -p ./conftmp、umask 022）"
  - "上游 VolVolume.hpp 使用 C++17 已移除的 register 关键字，clang -std=c++17 下编译失败，需移除（消费者包含头文件时同样受影响）"
  - "conan relocatable 打包会把 .la 的 dependency_libs 绝对路径改写为 //lib/xxx.la，链接 OsiVol/osiUnitTest 前需修复"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

