# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: coinor-vol/1.5.4
homepage: "https://github.com/coin-or/Vol"

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check (Vol/test 目录为 Osi 依赖测试，无 Osi 时跳过)"

# 上游实际运行的测试程序（Vol/test 为 OsiVolSolverInterfaceTest，依赖
# 可选 Osi 包；核心 libVol 无第三方依赖，无内建单元测试可执行档）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，真实调用 VOL_problem::solve)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：实例化 VOL_problem 并运行一次真实 volume algorithm 求解（TinyHook 子问题）"
    command: "./test_coinor-vol"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3