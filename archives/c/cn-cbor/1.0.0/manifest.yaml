# 版本级 manifest — cn-cbor 1.0.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.0"
software: "cn-cbor"

# 编译状态: published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源码下载 URL（GitHub upstream tag 1.0.0）
  url: "https://github.com/jimsch/cn-cbor/archive/refs/tags/1.0.0.tar.gz"
  sha256: "abf08fb6c28590df733f4affc1ae3eb5e7c358cfe9b45933a44739591913d18c"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  configure_options:
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "-Dfatal_warnings=OFF"
  - "-Dcoveralls=OFF"
  - "-Dbuild_docs=OFF"
  - "-Dbuild_tests=ON"

  # 编译依赖列表（cn-cbor 1.0.0 零外部依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 本版本无需源码补丁（仅配方层配置适配）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "上游 cmake_minimum_required(3.0.0) 在 CMake>=4.x 被拒：注入 CMAKE_POLICY_VERSION_MINIMUM=3.5"
- "上游 fatal_warnings=ON 时 ctest.h 宏生成的无原型函数声明在 clang 15 下 -Werror -Wstrict-prototypes 编译失败：配方关闭 fatal_warnings"