# test_package/MANIFEST.yml
# 上游官方测试声明文件（cn-cbor 1.0.0）

package: cn-cbor/1.0.0
homepage: "https://github.com/jimsch/cn-cbor"

# 上游测试命令：CTest 注册 1 项 "cbor"（cbor_test）
upstream_check_command: "ctest -R cbor"

# conanfile.py build() 中已集成上游测试（configure 后构建并执行 ctest）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（test/cbor_test.c，内部 CTEST 框架 11 个用例）
upstream_tests:
  - file: test/cbor_test.c
    source: cn-cbor-1.0.0/test/cbor_test.c
    description: "上游 CBOR 编码/解码/错误处理测试（11 个 CTEST 用例：error/parse/parse_normalize/fail/float/getset/create/map_errors/array/array_errors/create_encode）"
    command: "./cbor_test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：公开 API 编码 {\"answer\":42} 并解码往返验证"
    command: "./test_cn-cbor"

# 测试断言总数（上游 11 用例 + 消费者 test.c 12 项 CHECK 断言）
assertion_count: 23
