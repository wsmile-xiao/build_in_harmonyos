# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ccmake/4.3.4
homepage: "https://cmake.org/"

# 上游测试命令: CMake 上游用 ctest 驱动完整测试套件 (Tests/ 目录, 659 项注册:
# kwsys.* 20 + CMakeLib.* 46 单元测试, RunCMake.* 353 功能测试等)。
# RunCMake 功能测试需网络/git/python 等宿主能力, 交叉沙箱不可全量运行。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: 'ctest -R "^(kwsys\.|CMakeLib\.)" -E "(sandbox-limited: 4 tests)" --output-on-failure'

# 上游测试清点 (R51):
#   Tests/ 目录 292 个测试子目录, BUILD_TESTING=ON 构建后 ctest -N 实测注册 659 项。
#   build() 内真实执行确定性子集 kwsys.* + CMakeLib.* 共 66 项, 其中 4 项因
#   沙箱限制排除 (文件系统忽略 chmod 权限位 / unix-socket bind 被拒):
#     kwsys.testSystemTools, CMakeLib.testDebuggerAdapterPipe,
#     CMakeLib.testDebuggerNamedPipe-Project, CMakeLib.testDebuggerNamedPipe-Script
upstream_test_count: 659
upstream_test_count_source: "ctest -N on BUILD_TESTING=ON build (292 Tests/ subdirs)"

# 适配后测试: build() 内 ctest 子集 66 项 + test_package/test.c 冒烟 1 项
adapted_test_count: 67
