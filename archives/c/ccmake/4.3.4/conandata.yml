# conandata.yml — cmake 4.3.4

sources:
  url: "https://github.com/Kitware/CMake/releases/download/v4.3.4/cmake-4.3.4.tar.gz"
  sha256: "fdeff897b9eb49d764539f2b1edc6eb7e1440df325678a97c1978499e931adda"

patches:
  - patch_file: "patches/0001-Source-cmAffinity.cxx.patch"
    patch_description: "Guard CPU affinity on glibc: pthread_getaffinity_np is a glibc extension absent on musl (OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0002-Utilities-cmcurl-CMakeLists.txt.patch"
    patch_description: "Probe linux/tcp.h by compiling sys/socket.h+linux/tcp.h together; musl sys/socket.h collides with linux/socket.h (sockaddr_storage redefinition)"
    patch_type: "portability"
  - patch_file: "patches/0003-Utilities-cmlibuv-src-unix-core.c.patch"
    patch_description: "uv_cpumask_size: report UV_ENOTSUP where pthread affinity APIs are absent (musl/OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0004-Utilities-cmlibuv-src-unix-process.c.patch"
    patch_description: "Skip child cpu-affinity setup where pthread_setaffinity_np is absent (musl/OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0005-Modules-Platform-HarmonyOS.cmake.patch"
    patch_description: "Add Platform/HarmonyOS.cmake host module (includes Platform/Linux) so a cmake running natively on a HarmonyOS host (uname -s = HarmonyOS) does not emit 'System is unknown' warnings"
    patch_type: "portability"
  - patch_file: "patches/0006-Source-kwsys-SystemInformation.cxx.patch"
    patch_description: "Detect /proc/meminfo format by content in addition to kernel version: HongMeng (HarmonyOS) kernel reports legacy version numbers while providing the modern meminfo format"
    patch_type: "portability"
