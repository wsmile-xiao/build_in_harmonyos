version: "1.1.0"
software: "cputool"
status: built
build_date: "2026-09-11"
build_system: "meson"
license: "GPL-3.0-or-later"
source:
  url: "https://mirrors.aliyun.com/debian/pool/main/c/cputool/cputool_1.1.0.orig.tar.xz"
  sha256: "d92972c346c0cd249de3b4a064d2e4384ffbd5f188176b9f35b2f87282bb04f8"
  tar_format: "tar.xz"
build:
  system: "meson"
  configure_options:
    - "-Ddocs=disabled"
    - "-Ddefault_library=static"
  dependencies: []
  cc: "clang"
  profile: "ci/conan/profiles/ohos-aarch64"
patches_applied:
  - "0001-meson-build.patch"
tests:
  upstream: "no_tests（上游 1.1.0 无 tests/ 目录、无 meson test() 目标；审计见 test_package/MANIFEST.yml）"
  test_package: "test_cputool.sh（5 项内容级检查，覆盖 bin/cputool）"
  cli_smoke: "bin/cputool -V 报告 cputool 1.1.0，exit 0"
knowledge_gained:
  - "Upstream 1.1.0 为无依赖单文件 Meson 工具（仅 executable，无 test 目标），功能覆盖来自 test_package。"
  - "顶层 meson.build 无条件 find_program(rst2man)，OHOS 无 python3-docutils；-Ddocs=disabled 跳过文档子目录，补丁将该查找改为 required:false 容错。"
