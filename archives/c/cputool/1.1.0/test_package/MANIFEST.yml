# test_package/MANIFEST.yml — cputool 1.1.0 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 上游无测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）

package: cputool/1.1.0
homepage: "https://gitlab.linux.community/cputool/cputool/"

upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "cputool_1.1.0.orig.tar.xz（Debian 官方发布包，22792 字节，sha256=d92972c346c0cd249de3b4a064d2e4384ffbd5f188176b9f35b2f87282bb04f8）"
    finding: "顶层 15 个成员：cputool.c、cputool.h、meson.build、meson_options.txt、docs/、README.md、LICENSE 等；无 tests/、test/ 目录，无任何 *test* 源文件"
  - path: "meson.build（上游顶层构建文件）"
    finding: "仅定义 executable('cputool', 'cputool.c') 与 docs 子目录，无任何 test() 目标；required_programs 为空，仅查找文档工具 rst2man"
  - path: "meson_options.txt"
    finding: "仅含 system/runstatedir/docdir/docs 四个路径与特性选项，无任何测试开关"
  - path: ".gitlab-ci.yml"
    finding: "四个构建任务均只执行 meson+ninja+ninja install+cputool --version，无测试阶段"
  - path: "docs/manpages/meson.build"
    finding: "仅由 cputool.rst 生成 man 手册页，无测试逻辑"
  - path: "Debian 打包（tracker.debian.org control-1.1.0-1）"
    finding: "Build-Depends 仅为 debhelper-compat、meson、python3-docutils，无测试框架依赖，佐证上游无可接入的测试套件"

test_package_tests:
  - file: test_cputool.sh
    description: "消费者功能测试：真实执行 bin/cputool 完成 5 项内容级验证——二进制存在可执行、-V 版本号、--help 用法输出、无参数报错、非法 -c 拒绝（R34 合规）"
    command: "<shell> test_cputool.sh（CPUTOOL_BIN 指向包内 bin/cputool）"

assertion_count: 5
