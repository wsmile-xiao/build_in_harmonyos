package: cliquer/1.21
homepage: "https://github.com/dimpase/autocliquer"
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: test/testcases.c
    source: cliquer-1.21/test/testcases.c
    description: "automake TESTS 注册的 testcases 程序：内含 20 个原子检查（单团/枚举/加权/reentrance）"
    command: "./testcases"
test_package_tests:
  - file: test.c
    description: "消费者测试：libcliquer 真实 API 计算断言（K4 最大团=4，删边(0,1)后=3）"
    command: "./test_probe"
assertion_count: 3
