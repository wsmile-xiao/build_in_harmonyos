# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: clp/1.17.11
homepage: "https://github.com/coin-or/Clp"

# 上游自带 make test / unitTest 套件（Clp/ 与 Clp/src 下的 CppUnit 用例），
# 但依赖完整构建树 + 数据样例，CI 受限环境以 test_package 消费者验证为主。
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""

# 补全测试说明：test_package 新增消费者验证（链接 Clp 库 + 构建最小 LP 并求解）
supplementary_tests:
  - file: test_package/test.c
    count: 2
    description: >-
      1) 链接 libClp 并创建 ClpSimplex 模型；2) 求解一个 2 变量 LP 并断言
      最优目标值。验证库的编译、链接与求解器运行正确性（R34）。
