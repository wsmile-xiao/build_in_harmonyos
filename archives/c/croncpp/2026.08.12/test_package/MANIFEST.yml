# test_package/MANIFEST.yml — croncpp 2026.08.12
# 上游官方测试声明文件 (CI build_and_test.sh L0e 强制要求)

package: croncpp/2026.08.12
homepage: "https://github.com/mariusbancila/croncpp"

# 上游测试命令 (ctest -N 分析; 上游 CMake 以 CRONCPP_BUILD_TESTS=ON 启用)
upstream_check_command: "cmake -B build -DCRONCPP_BUILD_TESTS=ON && cmake --build build && ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
# header-only 配方不编译上游测试套件 (test_package 承担消费者验证)
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build -R test_croncpp"

# 上游实际运行的测试程序 (单一 Catch2 可执行文件, 内含全部 TEST_CASE)
upstream_tests:
  - file: test_croncpp
    source: croncpp-2026.08.12/test
    description: "Catch2 suite: 9 test_*.cpp files, 92 independent TEST_CASEs / 44294 assertions (main.cpp is CATCH_CONFIG_MAIN)"
    command: "./test_croncpp -r compact"

# test_package 中自带的测试 (消费者视角验证, HarmonyOS aarch64 主机)
test_package_tests:
  - file: test_package/test_croncpp_ohos.cpp
    description: "OHOS 专项: 解析/cron_next(tm/time_t/chrono)/cron_prev/quartz 方言/非法表达式/年份耗尽/OHOS libc 时间函数, 13 checks, TZ=UTC"
    command: "./test_croncpp_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 93
