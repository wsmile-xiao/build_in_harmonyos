# 软件级 manifest — croncpp
# 文件位置: archives/c/croncpp/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: croncpp

# 显示名
display: "croncpp"

# 一句话描述
description: "Header-only C++ library for parsing CRON expressions and computing next/previous occurrences"

# 分类标签
category: data

# 官网 URL
homepage: "https://github.com/mariusbancila/croncpp"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "header-only CMake INTERFACE 库，conan 配方 package() 仅拷贝 include/croncpp.h + LICENSE"
    - "C++17（string_view 快速路径），无第三方依赖"
  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2026.08.12":
    status: built
    build_date: 2026-09-03
