# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ctest/1.1.0
homepage: "https://github.com/bvdberg/ctest"

# 上游测试命令：ctest 的 Makefile 无 check 目标，测试程序为 `test`（C）与 `test++`（C++）
upstream_check_command: "make test && ./test"

# conanfile.py build() 方法中是否已集成上游测试（header-only 无编译阶段）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（以 ./test 为准，35 项；其中含演示断言失败的用例）
upstream_tests:
  - file: mytests.c
    source: ctest-1.1.0/mytests.c
    description: "ctest 框架自带演示测试集（CTEST/CTEST2/CTEST_DATA 等宏全覆盖）"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证 ctest.h 可 include 且断言宏可用)
test_package_tests:
  - file: test.c
    description: "消费者测试：include ctest.h，运行 CTEST/CTEST2/CTEST_DATA/CTEST_SETUP/TEARDOWN 宏"
    command: "./test_ctest"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 100
