knowledge_gained:
- "ctest 是单头文件（ctest.h）C/C++ 单元测试框架，无编译产物，采用 header-only 打包（package_type=header-library），上游 Makefile 仅构建演示 test/test++ 二进制"
- "header-only 配方必须显式声明 build()/export_sources()/apply_conandata_patches 三项（G1 结构检查），package() 中 copy 目标须用 package_folder 绝对路径，否则 include 路径悬空导致 test_package CMake 配置失败"
- "codeload.github.com tar.gz/refs/tags 形式 URL 无扩展名，conandata.yml 必须带 filename: <name>-<ver>.tar.gz，否则 conan get() 按 zip 解压报 BadZipFile"
