version: "0.168"
software: clock-setup
status: built
build_date: "2026-09-09"
build_system: makefile
source:
  url: "https://deb.debian.org/debian/pool/main/c/clock-setup/clock-setup_0.168.tar.xz"
  sha256: "04893115e360cad0126f1714a82ee9b9423993551bc3e638550833fecbd28692"
  tar_format: tar.xz
build:
  system: makefile
  configure_options:
    - "CC from Conan conf tools.build:compiler_executables (R33, overrides Makefile CC := gcc)"
    - "make -j1 build (R9; upstream in-source build)"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "clock-setup 上游是 Debian installer udeb：唯一编译产物是 set-date-epoch 单文件 C 工具（gettimeofday/settimeofday），其余为 debconf shell 脚本"
  - "上游 Makefile 仅 set-date-epoch/build/clean 三个目标，无 check/test 目标；debian/rules 的 override_dh_auto_test 仅做 sh -n 语法检查，无正式测试套件（no_tests 审计见 test_package/MANIFEST.yml）"
  - "动态链接即可：二进制仅依赖系统 libc，无外部 Conan 依赖，不触发 R36；产物名唯一，无 R26 系统同名污染风险"
