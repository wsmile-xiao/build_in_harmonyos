  - path: "debian/rules（override_dh_auto_test）"
    finding: "仅对 debian/clock-setup.postinst 与 finish-install.d/10clock-setup 做 sh -n 语法检查，属于 Debian 打包期 lint，无断言、无测试用例计数，不构成可接入的上游测试套件"
  - path: "debian/control"
    finding: "Build-Depends 仅 debhelper-compat (= 13) 与 po-debconf，无任何测试框架依赖（无 check、cmocka、gtest、shunit2 等）"
  - path: "上游 README/TODO 与 salsa 仓库说明"
