test_package_tests:
  - file: test_set_date_epoch.sh
    description: "消费者功能测试：真实执行包内 bin/set-date-epoch，共 6 项内容级验证——二进制存在且可执行、预 epoch 修正提示字符串存在、epoch 引用字符串存在、正常时钟下退出码 0、stdout 为空（未尝试修正）、stderr 为空（R34 合规，含反空壳字符串检查）"
    command: "<shell> test_set_date_epoch.sh（SET_DATE_EPOCH_BIN 指向包内 bin/set-date-epoch）"

assertion_count: 6
