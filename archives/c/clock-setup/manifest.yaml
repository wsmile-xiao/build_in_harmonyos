software: clock-setup
display: "clock-setup"
description: "Debian installer 时钟配置工具：set-date-epoch 在系统日期早于 1970 时回拨到 epoch"
category: utility
homepage: "https://salsa.debian.org/installer-team/clock-setup"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "沿用上游裸 Makefile，CC 由 Conan conf 注入（R33），make -j1 build"
    - "唯一编译产物为单文件 C 工具 bin/set-date-epoch，仅依赖系统 libc"
    - "上游无测试套件（no_tests）；test_package 对二进制做 6 项内容级功能验证"
  common_dependencies: []

versions:
  "0.168":
    status: built
    build_date: "2026-09-09"
