package: "ccmaker/1.0.0"
homepage: "https://gitcode.com/gyccc/ccmaker"
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_tests:
  - file: "test/test_ccmaker.c"
    source: "ccmaker-1.0.0/test/test_ccmaker.c"
    description: "upstream ctest single test verifying add/sub/version"
    command: "ctest --output-on-failure"
test_package_tests:
  - file: "test_add.c"
    description: "verify ccmaker_add and ccmaker_sub"
    command: "./test_add"
  - file: "test_version.c"
    description: "verify ccmaker_version returns 1.0.0"
    command: "./test_version"
assertion_count: 4
