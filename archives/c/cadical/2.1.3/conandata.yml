sources:
  url: "https://github.com/arminbiere/cadical/archive/refs/tags/rel-2.1.3.tar.gz"
  sha256: "abfe890aa4ccda7b8449c7ad41acb113cfb8e7e8fbf5e49369075f9b00d70465"

patches:
  - patch_file: "patches/0001-run-required-shell-scripts-with-sh.patch"
    patch_description: "在 HMDFS 上通过 sh 调用构建和测试必需脚本，避免源码脚本丢失执行位"
    patch_type: "portability"
  - patch_file: "patches/0002-use-tmpdir-for-upstream-test-files.patch"
    patch_description: "让测试临时文件遵守 TMPDIR，并为 HMDFS 放宽并行 I/O 超时"
    patch_type: "portability"
  - patch_file: "patches/0003-make-api-tests-portable.patch"
    patch_description: "修正 C 测试编译参数并替换 OHOS 缺失的 ualarm"
    patch_type: "portability"
  - patch_file: "patches/0004-serialize-compressed-input-pipes.patch"
    patch_description: "串行化压缩输入管道的完整生命周期，避免多线程 popen 竞态"
    patch_type: "portability"
