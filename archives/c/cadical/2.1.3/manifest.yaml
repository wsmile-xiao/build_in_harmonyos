knowledge_gained:
  - "CaDiCaL 使用自定义 configure 与 GNU make；configure 读取 Conan 注入的 CXX/CXXFLAGS，但不支持 --prefix 与 --enable-static 等标准参数"
  - "上游无 make install 目标，实际产物为 build/libcadical.a、build/cadical、build/mobical；本配方仅发布静态库与官方头文件，避免把求解器工具误并入库包"
  - "官方源码包含 src/configure -> ../configure 相对符号链接；Windows tar.exe 解包失败属宿主工具限制，Conan 目标环境与 Python tarfile 可正常处理"
  - "HMDFS 会丢失或拒绝源码脚本执行位，构建和测试脚本需要显式通过 sh 调用"
  - "OHOS /tmp 不适合上游测试临时文件，测试需遵守 job-local TMPDIR；HMDFS I/O 延迟需要放宽 parcompwrite 1 秒报警"
  - "OHOS 缺少 ualarm；C API 测试还需把 -std=c++17 转换为 -std=c11"
  - "多线程并发 popen/pclose 读取 gzip 管道存在竞态，用递归互斥锁覆盖读管道完整生命周期后 parcompwrite 稳定通过"

