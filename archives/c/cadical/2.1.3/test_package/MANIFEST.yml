package: cadical/2.1.3
homepage: "https://github.com/arminbiere/cadical"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

upstream_tests:
  - file: test/makefile
    source: cadical-rel-2.1.3/test/makefile
    description: "上游测试入口，顺序执行 usage、trace、api、cnf、icnf、mbt、contrib 7 组测试"
    command: "make test"
  - file: test/api/run.sh
    source: cadical-rel-2.1.3/test/api/run.sh
    description: "上游 API 测试驱动，OHOS r10 实际执行 16 个测试程序并全部通过"
    command: "make -C test api"

test_package_tests:
  - file: test.c
    description: "消费者视角测试 ccadical C API 的 SAT/UNSAT 求解、模型读取与资源释放"
    command: "./test_cadical"

assertion_count: 10
upstream_summary: "OHOS r10 实际执行日志按 7 组求和：usage 35/35、trace 79/79、API 16/16、CNF 228/228、ICNF 6/6、MBT 1000/1000、contrib 2/2，合计 1366/1366"
