# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: ciwiki/3.0.5
homepage: "https://ciwiki.sourceforge.net/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 穷尽检索结论（R51 三步法）：
#   - 源码包全文件清单 / GitHub 仓库树（90 文件）：无 tests/ 目录、无 TESTS/
#     check_PROGRAMS 注册、无 make check 目标；唯一命中 scripts/check_public_ip.sh
#     为运维辅助脚本（非测试）；.gitignore 无测试钩子
#   - make check 实际执行结果：无测试目标，即 0 个已注册用例
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，自研断言）
test_package_tests:
  - file: test.sh
    description: "消费者功能断言 7 项：①curl 可用；②二进制存在可执行；③--version 输出 version 3.0.5；④--help 输出 Usage；⑤--help 列出 --port；⑥HTTP 服务端启动成功（随机端口）；⑦HTTP GET / 返回非空 HTML"
    command: "bash test.sh <package_folder>"

# 测试断言总数（与 test.sh 硬性判定点一一对应：7 项，全部为 fail-fast 硬断言）
assertion_count: 7
