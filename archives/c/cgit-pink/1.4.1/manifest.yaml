software: cgit-pink
version: "1.4.1"
build_system: makefile
status: built
build_date: "2026-09-06"

source:
  url: "https://git.causal.agency/cgit-pink/snapshot/cgit-pink-1.4.1.tar.gz"
  sha256: "f1246c6c81305800c24e7eee2b224319ab5e57b1ddb07b4883aea845f29046d5"
  tar_format: tar.gz

build:
  system: makefile
  cc: clang
  options:
    - "NO_LUA=1"
    - "NO_CURL=1"
    - "NO_TCLTK=1"
    - "NO_GETTEXT=1"

dependencies:
  openssl: "3.5.8.1"
  zlib: "1.3.1"

patches_applied: []

knowledge_gained:
  - "cgit build reuses in-tree git source pinned by Makefile GIT_VER; vendor git tarball in source() instead of make get-git networking"
  - "Upstream tests are 14 shell scripts under tests/ using git test harness; run via make test"
  - "vendored git getpass fallback fixed in-recipe via python string replace in build() (no .patch file, avoids hunk drift); conandata.yml has no patches section"
