package: cgit-pink/1.4.1
homepage: "https://git.causal.agency/cgit-pink/"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

upstream_tests:
  - file: tests/t0101-index.sh
    source: cgit-pink-1.4.1/tests/t0101-index.sh
    description: "Index page lists configured repositories (10 assertions)"
    command: "make test"
  - file: tests/t0107-snapshot.sh
    source: cgit-pink-1.4.1/tests/t0107-snapshot.sh
    description: "On-the-fly tag/commit snapshots (35 assertions)"
    command: "make test"
  - file: tests/t0010-validate-html.sh
    source: cgit-pink-1.4.1/tests/t0010-validate-html.sh
    description: "Generated HTML validation (7 assertions)"
    command: "make test"
  - file: tests/t0111-filter.sh
    source: cgit-pink-1.4.1/tests/t0111-filter.sh
    description: "Syntax-highlighting filter pipeline (8 assertions)"
    command: "make test"

test_package_tests:
  - file: test.sh
    description: "Execute cgit CGI with default config and assert non-empty HTML cgit marker"
    command: "bash test.sh"
  - file: test.sh
    description: "Execute cgit CGI with custom CGIT_CONFIG and assert config-driven HTML output"
    command: "bash test.sh"

assertion_count: 4
