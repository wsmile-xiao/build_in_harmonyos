software: cgit-pink
display: "cgit-pink"
description: "Fast web frontend (CGI) for git repositories, maintained cgit fork"
category: utility
homepage: "https://git.causal.agency/cgit-pink/"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "Plain Makefile build that reuses an in-tree git source (GIT_VER 2.36.1 unpacked as git/)"
    - "NO_LUA=1 and NO_CURL=1 to avoid optional lua/curl inputs on OHOS"
    - "Compiler and dependency flags come from Conan conf and openssl/zlib package folders (R33)"
    - "Manual package() copies bin/cgit plus css/filters instead of absolute install paths"
  common_dependencies:
    - openssl
    - zlib

versions:
  "1.4.1":
    status: built
    build_date: "2026-09-06"
