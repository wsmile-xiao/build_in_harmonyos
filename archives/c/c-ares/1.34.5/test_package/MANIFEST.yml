# test_package/MANIFEST.yml
# Upstream test declaration file for c-ares 1.34.5
# CI (build_and_test.sh L0e) requires this file

package: c-ares/1.34.5
homepage: "https://c-ares.org/"

# Upstream test command
upstream_check_command: "make check"

# Whether upstream tests are integrated into build()
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream test programs (from make -n check analysis)
upstream_tests:
  - file: test/arestest.cc
    source: c-ares-1.34.5/test/arestest.cc
    description: "Google Test based test suite: ares_init, ares_destroy, ares_send, ares_cancel, channel management（403 个 TEST()/TEST_F()/TEST_P() 测试函数声明，参数化展开后 gtest 运行时 1151 个用例实例、38 个测试套件）"
    command: "./test/arestest"

# Upstream test total (rule 4 criterion 3: unit test function count = 403)
upstream_tests_total: 403

# Upstream test run status (actually executed: 1151 test instances, 1115 passed,
# 36 failed). All 36 failures are environment-class: OHOS sandbox /tmp is
# read-only, tests cannot create temp hosts/resolv files
# ("Error: failed to create '/tmp/ares_...'"), same class as the gmock
# gtest_help_test environment exemption precedent.
upstream_test_run:
  status: "passed_with_env_failures"
  reason: "gtest suite actually ran: 1151 test instances, 1115 passed, 36 failed (96.9%); all 36 failures are OHOS sandbox /tmp read-only temp-file creation failures (environment-class, same as gmock gtest_help_test precedent)"
  evidence: "Local measured run output: [==========] 1151 tests from 38 test suites ran; [  PASSED  ] 1115 tests; [  FAILED  ] 36 tests (all 'Error: failed to create /tmp/ares_...' environment-class failures)"

# test_package consumer tests
test_package_tests:
  - file: test.c
    description: "Consumer test: ares_library_init + ares_version + ares_library_cleanup"
    command: "./test_c-ares"

# Approximate test assertion count
assertion_count: 50
