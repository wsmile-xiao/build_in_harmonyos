package: cppp/2.9
homepage: "https://www.muppetlabs.com/~breadbox/software/cppp/"

upstream_check_command: "./tests/testall"
upstream_test_in_build: true
upstream_test_command: "make CC=\"clang\" -j1 && ./tests/testall"
upstream_test_result: "11/11 test groups passed on HarmonyOS aarch64 (HMBS_UPSTREAM_TEST_RESULT executed=11 passed=11 failed=0)"

upstream_tests:
  - name: "misctests"
    source: tests/testall
    description: "Verify program runs, --help and --version produce output, and invalid args produce errors"
    command: "./tests/testall"
  - name: "goodparsingtest/basic.c"
    source: tests/testall
    description: "Verify basic.c passes through unchanged when no flags given; -Dfoo / -Ufoo produce correct output"
    command: "./tests/testall"
  - name: "goodparsingtest/good.c"
    source: tests/testall
    description: "Same for good.c"
    command: "./tests/testall"
  - name: "goodparsingtest/lines.c"
    source: tests/testall
    description: "Same for lines.c (tests Unix vs MS-DOS newline handling)"
    command: "./tests/testall"
  - name: "badparsingtest/bad.c"
    source: tests/testall
    description: "Verify bad.c sections produce parse-error messages"
    command: "./tests/testall"
  - name: "goodparsingtest/phases.c"
    source: tests/testall
    description: "Same for phases.c (tests #if/#else/#endif phase handling)"
    command: "./tests/testall"
  - name: "trigraphtest/qqs.c"
    source: tests/testall
    description: "Verify trigraph support is disabled by default and enabled with -t/--trigraphs"
    command: "./tests/testall"
  - name: "fulltest/full1.c"
    source: tests/testall
    description: "Full combination test for full1.c (25 flag combinations checked against expected output)"
    command: "./tests/testall"
  - name: "fulltest/full2.c"
    source: tests/testall
    description: "Full combination test for full2.c"
    command: "./tests/testall"
  - name: "fulltest/full3.c"
    source: tests/testall
    description: "Full combination test for full3.c"
    command: "./tests/testall"
  - name: "numerictest/numeric1.c"
    source: tests/testall
    description: "Numeric comparison test: -Dfoo=1 -Dbar=2 etc. produce expected output"
    command: "./tests/testall"

test_package_tests:
  - file: test.sh
    description: "Smoke test: runs packaged cppp binary with --version / --help / -DFOO / -UFOO (4 real usage checks)"
    command: "bash test.sh <cppp-binary>"

assertion_count: 15
