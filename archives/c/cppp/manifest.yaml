software: cppp
display: "cppp"
description: "Partial C/C++ preprocessor — identifies #if/#ifdef blocks and applies user-specified symbol definitions"
category: development-tools
homepage: "https://www.muppetlabs.com/~breadbox/software/cppp/"
license: GPL-2.0-or-later
build_system: make

ohos_adaptation:
  key_points:
    - "Plain Makefile, no configure; direct make CC=clang is sufficient on OHOS"
    - "No patches required: cppp source compiles cleanly on HarmonyOS aarch64 with toybox clang"
    - "Upstream test suite (tests/testall) runs natively on OHOS — no modifications needed"
  common_dependencies: []

versions:
  "2.9":
    status: built
    build_date: "2026-09-09"
    conan_ref: "cppp/2.9"
