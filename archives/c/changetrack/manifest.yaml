software: changetrack
display: "changetrack"
description: "Monitors changes to configuration files and keeps revision history"
category: system
homepage: "http://changetrack.sf.net"
license: GPL-2.0+
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Perl 脚本无编译；shebang 改为 #!/usr/bin/env perl"
    - "运行期 PATH 需保证 GNU diffutils 先于 toybox（diff -e 生成 ed 脚本是核心路径）"
    - "RCS 套件经 conan 依赖 rcs/5.10.1 提供；RCS 检查依赖非空 LOGNAME"
    - "上游 make install 硬编码 /usr/local、/etc，由 conanfile.py 手工打包"
  common_dependencies:
    - diffutils
    - perl
    - rcs

versions:
  "4.7":
    status: built
    build_date: "2026-09-07"
