# test_package/MANIFEST.yml
# 上游官方测试声明文件 — changetrack/4.7
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: changetrack/4.7
homepage: "http://changetrack.sf.net"

# 上游测试命令（Makefile: test 目标 -> sh test.sh）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.sh
    source: changetrack/test.sh
    description: "上游唯一测试入口 make test —— 环境检查：which perl + 5 项 perl 核心模块 use 探测（File::Copy/Getopt::Std/File::Path/FileHandle/strict）+ rcs -V，无功能断言"
    command: "make test"
    upstream_total: 7
    executed: 7
    passed: 7
    blocked: 0
    status: "PASS —— rcs/5.10.1 移植（archives/r/rcs，姊妹 run dc91ea4）解锁后完整通过：7/7（which perl + 5 模块 + rcs -V）。test_package/conanfile.py Test 6 在每次 conan create 中按 test.sh 原始检查逐项等价复验。历史：rcs 缺失期间曾按 NOT_RUN 穷尽记录（设备/制品仓均无 rcs、ConanCenter 404、R36/L0i 拦截、边界外），证据存 run 目录 logs/ 与 progress 历史。人工完整执行 make test 实录见 run 目录 logs/upstream-make-test-pass.log"

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "smoke（-v 版本号、-h 用法文本）+ 无 RCS 模式（-r）真实功能回环（.history 变更记录、.yesterday 快照、GNU diff -e 生成的 .ed 脚本 2c/CHANGED 断言，可检出 toybox diff 遮蔽）+ 真实 RCS 回环（rcs 包 ci -i/co 往返；changetrack 全模式两次扫描生成含 2 个 revision 的 ,v 文件）+ 上游 make test 等价检查（which perl + 5 模块 + rcs -V）"
    command: "conan create 的 test 阶段自动执行"
  - file: test.sh
    description: "等价的 bash 冒烟测试（-v/-h + -r 功能回环 + rcs -V + 全模式 RCS 回环 + 上游等价检查，需 bin/ 与 rcs bin 在 PATH）"
    command: "./test.sh"

# 测试断言总数（conanfile.py test() 中的 raise 断言数：smoke 4 + 无 RCS 回环 9 + rcs ci/co 往返 4 + 全模式 RCS 回环 5 + 上游 make test 等价 3）
assertion_count: 25
