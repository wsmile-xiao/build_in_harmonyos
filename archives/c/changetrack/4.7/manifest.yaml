# 版本级 manifest — changetrack 4.7（ARCHIVE-SPEC v3.0）
# 交叉校验元数据：与 conandata.yml 不一致时以 conandata.yml 为准

version: "4.7"
status: built
build_date: "2026-09-07"
conan_ref: "changetrack/4.7"

source:
  url: "https://deb.debian.org/debian/pool/main/c/changetrack/changetrack_4.7.orig.tar.gz"
  sha256: "bea0905e6cc22f5b92e50834f56d14593b99e26b88b5566e2b4cbfae0c0bf2b4"
  tar_format: tar.gz

build:
  system: makefile
  # 上游 Makefile 仅有 test/install 两 target，无编译步骤；
  # install 硬编码 /usr/local、/etc 不可用，打包由 conanfile.py 手工完成。
  configure_options: []
  dependencies:
    - rcs/5.10.1
  # 运行期 PATH 依赖（非 conan requires）：
  #   perl >= 5（核心模块 File::Copy/Getopt::Std/File::Path/FileHandle）
  #   GNU diffutils 的 diff（需支持 -e；toybox diff 无 -e，不得遮蔽）
  cc: none
  cxx: none

patches_applied:
  - "0001-changetrack.patch"

knowledge_gained:
  - "纯 Perl 脚本类软件需修改 shebang: #!/usr/bin/perl -> #!/usr/bin/env perl"
  - "toybox 0.8.12 的 diff 不支持 -e（ed 脚本输出）；消费 diff -e 的软件必须保证 GNU diffutils 在 PATH 中先于 toybox（CI profile buildenv PATH 已满足）"
  - "changetrack -r 选项禁用全部 RCS 调用；上游 make test 只是环境检查（which perl + perl 模块 + rcs -V），无功能断言"
  - "上游 SourceForge 只到 4.5，4.7 经 Debian pool 分发 orig tarball，SHA256 与 dsc 一致"
  - "RCS 检查（ci/co）依赖非空 LOGNAME；conanbuild 语境下 buildenv_info 只向直接消费者传一跳，二级依赖的 bindir 需显式前置 PATH"
