# 版本级 manifest — commoncpp2 1.8.1
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.8.1"

# 软件名
software: commoncpp2

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-27"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/commoncpp/commoncpp2-1.8.1.tar.gz"

  # 源码校验和
  sha256: "53ced4aff74e28a1d8018eb2b4974519028db3c12471ab6dff1c873578c9af4e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--prefix=/usr"
    - "--disable-shared"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - openssl/1.1.1w

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（配方内联处理——无独立补丁文件）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - category: L1
    content: "旧版 autotools 辅助脚本（2007 年 config.guess/config.sub）分支结构不同——config.guess 各分支自行 echo+exit（需插 'echo ${UNAME_MACHINE}-unknown-linux-ohos; exit ;;'），config.sub 加 linux-ohos* 到 maybe_os 列表"
    reason: "实测 config.sub 识别 aarch64-unknown-linux-ohos——见 commoncpp2 适配"
  - category: L1
    content: "老代码 C++98 + 现代 clang：-fpermissive + friend 声明默认参数需 patch；鸿蒙 libc 无 pthread_testcancel/timespec.tv_usec——stub 头 + 源码 patch"
    reason: "commoncpp2 编译实测（string.h/friends.cpp/nat.cpp）"
  - category: L1
    content: "config.status mktemp 沙箱限制（/tmp 只读 + $HOME/.ci_logs 不可写）——TMPDIR 指可写目录 + configure/config.status 的 mktemp 模板改 ${TMPDIR}/confXXXXXX"
    reason: "同 dpkg——SKILL autotools-config-status-mktemp-sandbox 辅助验证库"
  - category: L1
    content: "上游 tests（6 程序）build() 集成实测：5/6 通过（bug1/bug2/digest/tcpstr1/url1 OK）；thread1 前 4 检查点通过（set n to 1...ok 等）后卡在 suspend 段——OHOS 沙箱信号机制（pthread_kill/SIGWINCH/sigwait）环境限制，非配方可修——如实记录"
    reason: "rule 4 实测回填（test.sh 对比 output.txt——thread1 例外如实说明）"
  - category: L1
    content: "Thread::sleep 换算 bug：friends.cpp 的 tv_usec→tv_nsec 时若用 ×1000000000 会溢出 tv_nsec 合法范围 [0,10^9)，nanosleep 立即 EINVAL 返回（sleep 变 0ms）——正确换算是 1ms = 10^6 ns 即 ×1000000"
    reason: "thread1 WaitNValue 轮询失效根因实测——autotools 库 sleep 类问题的通用排查点"
