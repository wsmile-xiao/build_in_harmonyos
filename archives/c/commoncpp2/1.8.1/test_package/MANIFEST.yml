# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: commoncpp2/1.8.1
homepage: "https://www.gnu.org/software/commoncpp/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true

upstream_tests:
  - name: tests/（bug1/bug2/thread1/digest/tcpstr1/url1——test.sh 对比 output.txt——6 程序）
    count: "6"
    description: "上游 tests 实测回填（rule 4）：build() 编译运行——5/6 通过（bug1/bug2/digest/tcpstr1/url1 OK）；thread1 前 4 检查点通过后卡在 suspend 段（OHOS 沙箱信号机制环境限制——sleep 换算 bug 已修复）——如实记录"

test_package_tests:
  - file: test_commoncpp2.py
    description: "R34：头文件 + lib 存在 + smoke C++ 链接/运行 OK"
    command: "python3 test_commoncpp2.py <package>"

assertion_count: 1
