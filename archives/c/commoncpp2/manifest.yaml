# 软件级 manifest — commoncpp2
# 遵循 ARCHIVE-SPEC v3.0

# 软件名称（小写，与目录名一致）
software: commoncpp2

# 显示名
display: "GNU Common C++ 2"

# 一句话描述
description: "GNU Common C++ 2 — 可移植 C++ 框架（线程/套接字/实时网络开发）"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://www.gnu.org/software/commoncpp/"

# 开源许可证（SPDX 标识）
license: GPL-2.0-or-later

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "旧版 autotools 辅助脚本（2007 年 config.guess/config.sub）不识别 ohos——config.guess 插 linux-ohos 分支、config.sub 加 linux-ohos*（实测识别 aarch64-unknown-linux-ohos）"
    - "老代码 C++98——CXXFLAGS 需 -std=c++98 -fpermissive；string.h friend 声明带默认参数需 patch"
    - "鸿蒙 libc 无 pthread_testcancel——写 stub 头 + -include 注入"
    - "鸿蒙 timespec 无 tv_usec——friends.cpp 改 tv_nsec"
    - "config.status mktemp 沙箱限制——TMPDIR 指可写目录 + mktemp 模板改 ${TMPDIR}（同 dpkg，见 SKILL autotools-config-status-mktemp-sandbox）"
  common_dependencies:
    - zlib
    - openssl

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.8.1":
    status: built
    build_date: "2026-08-27"
    conan_ref: "commoncpp2/1.8.1"
    note: "Conan 配方适配（autotools——config.status mktemp 技能辅助验证库）"
