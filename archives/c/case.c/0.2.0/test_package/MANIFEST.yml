# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: case.c/0.2.0
homepage: "https://github.com/stephenmathieson/case.c"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 中已集成上游测试（编译 test_case 并实际运行）
upstream_test_in_build: true
upstream_test_command: "./test_case"

# 上游实际运行的测试程序
# 补丁 0001 后 13 个独立用例全部注册执行（原 main() 漏注册 camel_space_seperators）
upstream_tests:
  - file: test.c
    source: case.c-0.2.0/test.c
    description: "case.c 上游测试（case_lower 3 + case_upper 3 + case_camel 7 = 13 个独立用例）"
    command: "./test_case"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者验证：仅通过公开头文件 case.h 与公开 API case_lower/case_upper/case_camel 编译、链接并运行"
    command: "./test_consumer"

# 测试断言总数 (上游 13 用例中断言数 + 消费者 3 断言)
assertion_count: 16
