software: cdrdao
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游 tag rel_1_2_6——用户给 1.0.0 不合法按真实版 1.2.6）
version: "1.2.6"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-26"

# 构建系统标识（verify-build 要求）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（codeload 官方）
  url: "https://codeload.github.com/cdrdao/cdrdao/tar.gz/refs/tags/rel_1_2_6"

  # 源码校验和
  sha256: "ba3eadcae7b62a709e9e23988d7fb41f822c408dcec9bd99ff1a343d1bcbc524"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 构建系统标识（verify-build 要求）
  build_system: autotools

  # 配置选项列表（无特殊选项——libcdio/ncurses/zlib/pcre 自动检测）
  configure_options: []

  # 编译依赖列表（格式: name/version）——制品仓均有
  dependencies:
    - "libcdio/2.3.0"
    - "ncurses/6.4"
    - "zlib/1.3.1"
    - "pcre/8.45"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "cdrdao（CD 刻录工具）autotools 构建，依赖 pthread/socket 系统 + libcdio/ncurses/zlib/pcre（制品仓均有）；上游 tag 是 rel_1_2_6 非 1.2.6"
    - "上游测试 testtocs/test（20 个 TOC 解析用例）已移植到 test_package/testtocs 实跑（20/20 通过）；消费测试验证 bin/cdrdao 真实运行（--version 命令非法 rc=1，版本号在 usage 输出）"
