# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: csv2/0.1
homepage: "https://github.com/p-ranav/csv2"

# 上游测试命令（doctest 单元测试，由 CMake CSV2_TEST=ON 构建 test/csv2_test）
upstream_check_command: "ctest -N"

upstream_test_in_build: false
upstream_test_command: "./csv2_test"

# 上游实际运行的测试程序（csv2 0.1 无 CTest 注册，测试二进制为 test/csv2_test）
# 已在本地用 OHOS clang15 完整构建并运行: 19 test cases / 161 assertions 全部通过
upstream_tests:
  - file: test/main.cpp
    source: csv2-0.1/test/main.cpp
    description: "csv2 上游 doctest 单元测试 (Reader/Writer: 空文件/基本解析/表头跳过/双引号/trim/自定义分隔符等 19 用例)"
    command: "./csv2_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_csv2.cpp
    description: "消费者测试: 真实调用 csv2::Reader (mmap/header/行迭代) 与 csv2::Writer (文件输出)，验证头文件安装与 API 可用"
    command: "./test_csv2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
