# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.1/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1"

# 软件名
software: "csv2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/p-ranav/csv2/archive/refs/tags/v0.1.tar.gz"

  # 源码校验和
  sha256: "e185d0378a95edb2ad0f2473970d8fe8579c87326640340d42bdf6327fd96791"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCSV2_TEST=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "csv2 为 header-only CMake INTERFACE 库（C++11），无第三方依赖，OHOS 上直接用 clang15 交叉编译即可，无需补丁"
  - "read_value 保留字段外层引号、仅展开 '' -> '（csv2 0.1 语义）；trim_policy 只对未加引号字段去空白"
  - "Writer 仅接受 std::ofstream& 输出流（不能接 ostringstream）"
  - "E225: test_package 的 CMakeToolchain 不可同时出现在 generators 与 generate()，须 user_presets_path=False"
