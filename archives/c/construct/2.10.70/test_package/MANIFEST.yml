  upstream_test_source: "PyPI sdist tests/ 目录（5 个文件：test_core/test_compiler/test_expr/test_benchmarks/test_multiprocessing）。注意：sdist **未随附** tests/declarativeunittest.py（MANIFEST.in 仅 include README.rst/LICENSE），而 5 个文件均 `from tests.declarativeunittest import *` → 构建期从上游 tag v2.10.70 的 raw URL 取回该文件（实测 2014 字节，带 3 次重试）后运行"
  upstream_test_result: "**实测 181 passed / 4 failed / 13 xfailed**（口径 `pytest tests --assert=plain -p no:cacheprovider --ignore=tests/test_benchmarks.py`，PYTEST_DISABLE_PLUGIN_AUTOLOAD=1）。4 项失败全部因 construct 的**可选 extras** 缺失：numpy×3（test_numpy、test_compiled_example_integrity、test_compiled_example_benchmark）+ lz4×1（test_compressedlz4）—— numpy/lz4 是 C 扩展，OHOS aarch64 无可用 wheel，故列入 ALLOWED_TEST_FAILURES 并在构建日志显式告警。**另排除 tests/test_benchmarks.py**：它依赖 pytest-benchmark 的 `benchmark` fixture（纯性能基准，非功能测试），不排除会产生 202 个 fixture-missing ERROR。构建期另装 arrow 与 cloudpickle（construct 可选 extra，但 tests/ 在模块级构造 Timestamp(...) 会在收集期 import arrow；cloudpickle 供 test_pickling_*）"
  consumer_test: "test_construct.py（R34：Struct(Int8ub,Int16ub) build 出精确字节 b'\\x01\\x00\\x02' + parse 往返 + sizeof()==3；Array(3,Byte) 与 GreedyRange(Byte) 变长解析往返）"
