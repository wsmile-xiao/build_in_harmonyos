# test_package/MANIFEST.yml — cdebconf 0.283
# CI L0e requires this file to exist.

package: cdebconf/0.283
homepage: "https://salsa.debian.org/installer-team/cdebconf"

# 上游测试 src/test configtest/dbtest 在配方 build 阶段实跑
# （configtest_rc=0 通过，dbtest 编译+运行），通过率见 PR 测试对比表。
upstream_check_command: "cd src/test && make configtest dbtest -j1"
upstream_test_in_build: true
upstream_test_command: "configtest/dbtest"

# 上游测试在 build 阶段实跑（configtest 通过 + dbtest 运行）
upstream_tests: []

# test_package tests（consumer 消费测试，真实运行 CLI 工具）
test_package_tests:
  - file: test_cdebconf.py
    description: "消费测试：debconf-communicate 可执行文件存在 + debconf-escape -e 真实运行 + 上游测试记录（2 项 PASS + 1 项 NOTE）"
    command: "python3 test_cdebconf.py <package_folder>"

# 断言数：communicate 存在 + escape 运行（2 项 PASS；上游测试记录为 NOTE 非断言）
assertion_count: 2