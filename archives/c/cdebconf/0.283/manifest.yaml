software: cdebconf
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.283/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游 salsa 最新 tag 0.283；用户给 1.0.0 不合法——按真实版）
version: "0.283"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-27"

# 构建系统标识（verify-build 要求）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（salsa Debian Installer Team 官方）
  url: "https://salsa.debian.org/installer-team/cdebconf/-/archive/0.283/cdebconf-0.283.tar.gz"

  # 源码校验和
  sha256: "90fd910751cc5b1176df05c9f6b11c27a758b0ff1683fef0fad15a2f531d23d8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 构建系统标识（verify-build 要求）
  build_system: autotools

  # 配置选项列表（仅 passthrough 前端 + textdb；textwrap/selinux 禁用）
  configure_options:
    - "--with-frontend=passthrough"
    - "--with-db=textdb"
    - "--disable-selinux"
    - "--without-textwrap"

  # 编译依赖列表（零第三方 Conan 依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码 patch，仅配置裁剪）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "cdebconf（Debian debconf 的 C 实现）硬依赖 libdebian-installer（di_* API 30+ 处：di_data/di_warning/di_slist 等）——制品仓无此库，自包含构建（salsa master 分支 89KB 纯 C autotools 库，先构建 .a + 头 + pc 文件再给 cdebconf 用），同 aegean 的 genometools 方案"
    - "cdebconf 前端（gtk/ncurses/newt/slang/text）与 textwrap/selinux 全部可选——--with-frontend=passthrough + --disable-selinux + --without-textwrap 裁剪；数据库模块 textdb/rfc822db/stack 内置"
    - "上游测试 src/test/：configtest.c/dbtest.c + 测试数据（align/backup/entropy/help/indices 的 config+templates）——本地实测通过率如实记录"
