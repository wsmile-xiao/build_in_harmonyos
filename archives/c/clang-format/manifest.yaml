software: clang-format
display: "clang-format"
description: "LLVM clang-format 代码格式化命令行工具（v22.1.8.src，aarch64-unknown-linux-ohos）"
category: build-tool
homepage: "https://clang.llvm.org/docs/ClangFormat.html"
license: "Apache-2.0 WITH LLVM-exception"
build_system: cmake

ohos_adaptation:
  key_points:
    - "鸿蒙 PC 真机原生编译：不设 CMAKE_SYSTEM_NAME → 不触发交叉编译 → llvm-tblgen/clang-tblgen 原生编+跑（与 clang/22.1.8、clang-format-11/11.1.0 同族策略）"
    - "llvm/cmake/config.guess 不认 uname -s=HarmonyOS（GetHostTriple.cmake/config-ix.cmake 调用）→ build() 覆盖为 stub 输出 aarch64-unknown-linux-ohos"
    - "cmake 无 Platform/HarmonyOS 模块 → 提供 Platform/HarmonyOS.cmake（include(Platform/Linux)）挂 CMAKE_MODULE_PATH"
    - "LLVM 22 布局：clang-format 在 clang/tools/clang-format，单测 clang/unittests/Format，lit 测试 clang/test/Format；googletest 在 third-party/unittest/googletest"
    - "LLVM 22 lit 的 use_llvm_tool 不再回退搜 PATH（use_installed=False）→ clang/test/lit.cfg.py 的 use_clang(required=True) 需靠 CLANG 环境变量提供 clang，否则套件首行 fatal"
    - "上游测试真实运行（R51）：单测 FormatTests + lit clang/test/Format，build() 打印 'UPSTREAM TESTS' 统计行"
    - "clang-format 运行时动态依赖系统 libc++_shared.so（R26 合规，包内不输出系统同名 .so）"

versions:
  22.1.8.src:
    status: built
    build_date: "2026-09-18"
    conan_ref: "clang-format/22.1.8.src"
    notes: 首个适配版本（conan create + test_package 通过；上游单测 + lit 全过，本地 CI 模拟 L0-L5 全过）

tags:
  - formatter
  - clang
  - build-tool
