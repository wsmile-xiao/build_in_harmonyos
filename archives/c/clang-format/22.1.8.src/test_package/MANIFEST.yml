# test_package/MANIFEST.yml
# 上游官方测试声明文件（LLVM 22.1.8 clang-format 上游测试）
# 上游布局（LLVM 22）：clang-format 位于 clang/tools/clang-format，单测在
# clang/unittests/Format（CMake 目标 FormatTests），lit 测试在 clang/test/Format。

package: clang-format/22.1.8.src
homepage: "https://clang.llvm.org/docs/ClangFormat.html"

# 上游测试命令（cmake 构建目标 + lit 套件）
upstream_check_command: "cmake --build build-ohos --target FormatTests FileCheck count not llvm-config && build-ohos/bin/llvm-lit -sv clang/test/Format"

# conanfile.py build() 中已真实运行上游测试（R51 实跑 + 'UPSTREAM TESTS' 统计行留痕）
upstream_test_in_build: true
upstream_test_command: "build-ohos/tools/clang/unittests/Format/FormatTests && build-ohos/bin/llvm-lit -sv <src>/clang/test/Format"

# 上游实际运行的测试程序（实测数字）
upstream_tests:
  - file: clang/unittests/Format/FormatTest.cpp
    source: llvm-project-22.1.8.src/clang/unittests/Format/
    description: "clang-format 单测（CMake 目标 FormatTests 注册 36 个 .cpp 源文件，其中 21 个为 *Test.cpp；实测 1244 个 gtest 用例 / 39 test suites 全部通过）"
    command: "build-ohos/tools/clang/unittests/Format/FormatTests"
    tests_total: 1244
    tests_passed: 1244
    tests_failed: 0
  - file: clang/test/Format/basic.cpp
    source: llvm-project-22.1.8.src/clang/test/Format/
    description: "clang-format lit 测试套件（clang/test/Format，32 个测试文件全部通过）"
    command: "build-ohos/bin/llvm-lit -sv clang/test/Format"
    tests_total: 32
    tests_passed: 32
    tests_failed: 0
    tests_unsupported: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: input.cpp
    description: "用打包的 clang-format -style=LLVM 格式化 input.cpp，断言输出逐字节等于 expected.cpp"
    command: "./bin/clang-format -style=LLVM input.cpp > formatted.out && cmp formatted.out expected.cpp"
  - file: conanfile.py
    description: "断言打包二进制 --version 输出含 'clang-format version 22.1.8'"
    command: "./bin/clang-format --version | grep -q 'clang-format version 22.1.8'"
  - file: conanfile.py
    description: "bin/git-clang-format（上游 install(PROGRAMS) 交付物）：可执行位 + 内容含上游 usage 字符串 + ast.parse 语法校验（不落盘，避免 py_compile 把 __pycache__ 写进包目录污染交付物）+ 断言包内无 __pycache__ 残留（核心断言，不依赖外部工具）；若 conanrun 子环境内探测到 git，则额外 best-effort 实跑 --help 校验输出含 'git clang-format'（该脚本 main() 首行调 `git config`，能否跑 --help 取决于宿主外部 git，非本包交付物 → 失败仅告警不判负）"
    command: "test -x <pkg>/bin/git-clang-format && grep -q 'git clang-format \\[OPTIONS\\]' <pkg>/bin/git-clang-format && python3 -c \"import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read(), sys.argv[1])\" <pkg>/bin/git-clang-format && [ ! -e <pkg>/bin/__pycache__ ]"
  - file: conanfile.py
    description: "share/clang/* 集成脚本齐全（clang-format-diff.py / clang-format.py / clang-format-sublime.py / clang-format.el / clang-format-bbedit.applescript）且 clang-format-diff.py 有可执行位"
    command: "test -x <pkg>/share/clang/clang-format-diff.py && test -f <pkg>/share/clang/{clang-format.py,clang-format-sublime.py,clang-format.el,clang-format-bbedit.applescript}"

# 交付物清单（对齐上游 clang/tools/clang-format/CMakeLists.txt 的 install() 规则）
#   bin/clang-format                        （add_clang_tool）
#   bin/git-clang-format                    （install(PROGRAMS) → bindir）
#   share/clang/clang-format-diff.py        （install(PROGRAMS)）
#   share/clang/clang-format.py             （install(FILES)，vim 集成）
#   share/clang/clang-format-sublime.py     （install(FILES)，sublime 集成）
#   share/clang/clang-format.el             （install(FILES)，emacs 集成）
#   share/clang/clang-format-bbedit.applescript（install(FILES)，BBEdit 集成）
# 上游 clang-format-fuzzer 目标为 EXCLUDE_FROM_ALL 且无 install 规则，非交付物。
deliverables:
  - bin/clang-format
  - bin/git-clang-format
  - share/clang/clang-format-diff.py
  - share/clang/clang-format.py
  - share/clang/clang-format-sublime.py
  - share/clang/clang-format.el
  - share/clang/clang-format-bbedit.applescript

# 测试断言总数（口径 = 上游断言数 + test_package 断言数）
#   上游 1276 = 单测 FormatTests 1244（gtest "1244 tests from 39 test suites ran" /
#               "[  PASSED  ] 1244 tests."）+ lit clang/test/Format 32（"Passed: 32 (100.00%)"）
#   test_package 5（--version 可执行 1 + input.cpp 格式化输出逐字节比较 1 + 版本号 grep 1
#                   + git-clang-format 可执行位/usage/ast 语法/包内无 __pycache__ 断言 1
#                   + share/clang/* 交付物齐全 1）
# 全部实测通过，通过率 1281/1281 = 100%（上游测试与 test_package 实跑退出码均为 0）
#
# 环境说明（详见 ../notes.md 问题表 #3/#4）：
#   - LLVM 22 的 lit.llvm.use_llvm_tool 不再回退搜 PATH → build() 运行 llvm-lit 前设
#     CLANG=<toolchain clang>，使 clang/test/lit.cfg.py 的 use_clang(required=True) 解析成功
#     （否则 llvm-lit 首行 fatal）。clang/test/Format 不使用 %clang，结果不受影响。
#   - 鸿蒙 /tmp 只读，llvm 内置 googletest 的 CapturedStream 硬编码 /tmp/... → build() 用
#     LD_PRELOAD 垫片（拦截 mkstemp 改写 /tmp/ 前缀到可写 cwd）使单测 1244/1244 真实全通过。
#   两项均为构建/测试环境 workaround，未修改任何上游源码或测试。
assertion_count: 1281
