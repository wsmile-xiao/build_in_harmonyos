software: clang-format
version: "22.1.8.src"
build_date: "2026-09-18"
build_system: cmake
status: built
conan_ref: "clang-format/22.1.8.src"

source:
  url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/llvm-project-22.1.8.src.tar.xz"
  sha256: "922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-G Ninja"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DLLVM_TARGETS_TO_BUILD=AArch64"
    - "-DLLVM_ENABLE_PROJECTS=clang"
    - "-DLLVM_ENABLE_ASSERTIONS=OFF"
    - "-DLLVM_INCLUDE_TESTS=ON"
    - "-DLLVM_INCLUDE_UTILS=ON"
    - "-DLLVM_INCLUDE_EXAMPLES=OFF"
    - "-DLLVM_INCLUDE_DOCS=OFF"
    - "-DLLVM_ENABLE_TERMINFO=OFF"
    - "-DLLVM_ENABLE_ZLIB=OFF"
    - "-DLLVM_ENABLE_LIBXML2=OFF"
    - "-DLLVM_ENABLE_WERROR=OFF"
    - "-DLLVM_PARALLEL_LINK_JOBS=2"
    - "-DCMAKE_CXX_FLAGS=-stdlib=libc++"
    - "-DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -lc++abi"
  # build() 在 configure 之外另注入/生成（非 -D 参数，故不列入上方列表）：
  #   file llvm/cmake/config.guess stub（#!/bin/sh + echo aarch64-unknown-linux-ohos）
  #   file <build>/_cmake_modules/Platform/HarmonyOS.cmake（include(Platform/Linux)，经 -DCMAKE_MODULE_PATH 生效）
  #   env  CLANG=<toolchain clang>（供 llvm-lit 的 clang/test/lit.cfg.py use_clang(required=True)；
  #        LLVM 22 的 lit.llvm.use_llvm_tool 不再回退搜 PATH，缺失会首行 fatal）
  #   编译器由 profile conf `tools.build:compiler_executables` 提供（-DCMAKE_C/CXX_COMPILER）
  #   构建目标：clang-format FileCheck FormatTests count not llvm-config
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "clang-format 22.1.8.src：鸿蒙 PC 真机原生编译（不设 CMAKE_SYSTEM_NAME → 不触发交叉 → llvm-tblgen/clang-tblgen 原生编+跑），仅 AArch64 target；clang-format 位于 clang/tools/clang-format（LLVM_ENABLE_PROJECTS=clang 即可）"
  - "config.guess 不认 uname -s=HarmonyOS（config-ix.cmake 无条件调用）→ build() 覆盖为 stub 输出 aarch64-unknown-linux-ohos；cmake 4.1.2 对本版（cmake_minimum_required=3.20）无 policy 问题，无需 CMAKE_POLICY_VERSION_MINIMUM"
  - "cmake 无 Platform/HarmonyOS 模块 → 提供 include(Platform/Linux) 的 Platform/HarmonyOS.cmake 挂到 CMAKE_MODULE_PATH"
  - "LLVM 22 lit 行为变化：use_llvm_tool 不再回退搜 PATH（use_installed=False）→ clang/test/lit.cfg.py 的 use_clang(required=True) 必须靠 CLANG 环境变量提供 clang，否则 llvm-lit 首行 fatal（0 通过）；LLVM 11 靠 PATH 命中 hnp clang 恰好绕开"
  - "LLVM 22 lit 汇总行格式变化：`  Passed: N (100.00%)`（带百分比）、失败标签为 `Failed`（LLVM 11 记 `Unexpectedly Failed`）→ 朴素正则需去尾锚并按新标签解析"
  - "LLVM 22 googletest 迁到 third-party/unittest/googletest（LLVM 11 在 llvm/utils/unittest/googletest）"
  - "llvm-lit 的 map_config 依赖构建目录与源码 clang/ 同级（bdir/../clang）：构建目录必须放在源码树内（source_folder/build-ohos）"
  - "上游测试：单测 FormatTests 与 lit clang/test/Format 已真实运行（R51），build() 打印 'UPSTREAM TESTS' 统计行（实测数字见 notes.md / reports/test-report.md）"
  - "clang-format 运行时动态依赖 libc++_shared.so（OHOS 系统库，无需打包，R26 合规：不输出系统同名 .so）"
