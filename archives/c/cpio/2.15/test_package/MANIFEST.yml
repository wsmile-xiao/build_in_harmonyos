manifest_version: 1
package: cpio/2.15
homepage: "https://www.gnu.org/software/cpio/"
test_type: executable
upstream_check_command: "make -C tests check"
upstream_test_in_build: true
upstream_tests:
  - inout
  - interdir
  - setstat01
  - setstat02
  - setstat03
  - setstat04
  - setstat05
  - symlink
  - symlink-bad-length
  - symlink-long
  - symlink-to-stdout
  - version
  - big-block-size
  - CVE-2015-1197
  - CVE-2019-14866
  - linktime
  - linktime01
test_package_tests:
  - file: conanfile.py
    description: "cpio --version plus newc archive create/extract round-trip"
    command: "cpio --create --format=newc and cpio --extract --make-directories"
assertion_count: 6
