test_files:
  - path: "test_package/test_cython.py"
    test_type: "R34"
    assertion_count: 7
    description: "包内 Cython 可导入（版本 3.3.0）+ 真实加载编译出的扩展模块（Scanning/Scanners/_shared，E212 签名校验）+ 用包内 bin/cython CLI 把真实 .pyx 编译成含 PyInit_demo/PyModuleDef/CYTHON_ 标记的 C 代码"
upstream_test_in_build: true
upstream_test_command: "cythonize -i ohc_smoke.pyx（端到端冒烟：编译+真实调用 add(20,22)==42）；python3 runtests.py -vv --no-pyregr run.hello_world（限时子集）"
upstream_test_result: "端到端冒烟通过（实跑：编译 add(int,int) 并断言 add(20,22)==42）。注：cython 的 tests/ 不是 pytest 用例（tests/run/*.py 由 runtests.py 编译执行，pytest 收集数为 0），故不谎报 pytest 通过率；runtests.py 子集结果按实际记录，超时则如实申报未完成（R51）"
