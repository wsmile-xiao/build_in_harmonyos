# test_package/MANIFEST.yml
# Upstream test declaration file for cld2 0.0.0-git20150806
# CI (build_and_test.sh L0e) requires this file

package: cld2/0.0.0-git20150806
homepage: "https://github.com/CLD2Owners/cld2"

# Upstream has no configure/make-check/ctest harness; the official suite is
# internal/compile_and_test_all.sh which builds cld2_unittest* binaries.
upstream_check_command: "internal/compile_and_test_all.sh"

# Upstream tests are compiled and executed in conanfile.py build()
upstream_test_in_build: true
upstream_test_command: "./cld2_unittest_chrome_2 && ./cld2_unittest_full"

# Upstream test programs (built from internal/*.cc in build())
upstream_tests:
  - file: internal/cld2_unittest.cc
    source: cld2-84b58a5/internal/cld2_unittest.cc
    description: "Upstream unit test: ~85 script/letter/quadgram detection cases over 80+ languages"
    command: "./cld2_unittest_chrome_2"
  - file: internal/cld2_unittest_full.cc
    source: cld2-84b58a5/internal/cld2_unittest_full.cc
    description: "Upstream full-table unit test: 160-language detection cases"
    command: "./cld2_unittest_full"

# Upstream test program count (2 test binaries)
upstream_tests_total: 2

# test_package consumer tests (2 ctest cases)
test_package_tests:
  - file: test_cld2.cpp
    description: "Consumer test: DetectLanguageSummary detects English text as ENGLISH"
    command: "./test_cld2 english"
  - file: test_cld2.cpp
    description: "Consumer test: DetectLanguageSummary detects French text as FRENCH"
    command: "./test_cld2 french"

# Approximate test assertion count (2 language checks + text_bytes/reliability checks)
assertion_count: 6
