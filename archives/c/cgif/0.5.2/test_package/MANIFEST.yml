# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cgif/0.5.2
homepage: "https://github.com/dloebl/cgif"

# 上游测试命令 (meson test)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "meson test"

# 上游实际运行的测试程序 (48 tests via meson test)
upstream_tests:
  - file: tests/all_optim.c
    source: cgif-0.5.2/tests/all_optim.c
    description: "all optimization flags combined"
    command: "meson test"
  - file: tests/alpha.c
    source: cgif-0.5.2/tests/alpha.c
    description: "alpha channel transparency"
    command: "meson test"
  - file: tests/animated_color_gradient.c
    source: cgif-0.5.2/tests/animated_color_gradient.c
    description: "animated GIF color gradient"
    command: "meson test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "创建GIF并调用cgif API验证库功能"
    command: "./test_cgif"

# 测试断言总数 (上游48项 + 消费者测试1项)
assertion_count: 49
