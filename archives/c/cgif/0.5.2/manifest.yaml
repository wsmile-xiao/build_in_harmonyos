software: cgif
version: 0.5.2
status: published
build_system: meson
build_date: 2026-09-01
created_at: 2026-05-06

# 软件描述
description: "A fast and lightweight GIF encoder library"
category: multimedia
license: MIT

# 编译信息
compiler: clang 15.0.4
target_arch: aarch64
target_os: ohos

# 配置选项
configure_options:
  - "--prefix=$DEFAULT_PREFIX"

# 构建命令序列
build_commands:
  - "meson setup build --prefix=$DEFAULT_PREFIX"
  - "ninja -C build"
  - "DESTDIR=$TEST_PREFIX ninja -C build install"

# 测试信息
test_result: PASS
test_summary: "48/48 tests passed"
test_commands:
  - "ninja -C build test"

# 安装产物
artifacts:
  - lib/libcgif.so.0.5.2
  - lib/libcgif.so.0
  - lib/libcgif.so
  - include/cgif.h
  - lib/pkgconfig/cgif.pc

# 补丁信息
patches_applied: []
# 无补丁，原生源码可直接编译

# 知识沉淀
knowledge_gained:
  - "meson构建系统需要先安装meson和ninja"
  - "cgif无外部依赖，纯C库"

# 质量门禁
quality_gates:
  G1_binary_integrity: PASS
  G2_functionality: PASS
  G3_portability: PASS
  G4_archive_integrity: PASS

# 源码信息
source_url: https://github.com/dloebl/cgif/archive/refs/tags/v0.5.2.tar.gz
source_url_mirror: https://gh-proxy.com/https://github.com/dloebl/cgif/archive/refs/tags/v0.5.2.tar.gz

# 预编译包
packages:
  - name: cgif-0.5.2-ohos-aarch64.tar.gz
    size: 245KB
    type: runtime
  - name: cgif-0.5.2-ohos-aarch64-debug.tar.gz
    size: 135KB
    type: debug
