package: critnib/1.1
homepage: "https://github.com/kilobyte/critnib"

upstream_check_command: "ctest -N"
upstream_tests_exist: true
upstream_test_audit: >
  critnib v1.1 ships tests/ with 4 ctest cases registered in
  tests/CMakeLists.txt: 1corr, inequal, th (C harnesses built from
  hmload.c/rand.c) plus iter (shell driver tests/iter around iter-cli).
  Verified against tag v1.1 tarball (15210 bytes). The recipe executes the
  same 4 harnesses via direct compiler invocation (no CMake configure
  probe) and reports them under framework direct-cc.

upstream_test_in_build: true
upstream_test_command: "direct-cc: 1corr/inequal/th + sh iter (same sources as ctest)"

upstream_tests:
  - file: tests/1corr.c
    source: critnib-1.1/tests/1corr.c
    description: "Single-thread correctness: insert/get/remove/neighbour checks"
    command: "./1corr"
  - file: tests/inequal.c
    source: critnib-1.1/tests/inequal.c
    description: "Inequality/neighbour (LE/GE) lookup verification"
    command: "./inequal"
  - file: tests/th.c
    source: critnib-1.1/tests/th.c
    description: "Multithreaded insert/lookup stress"
    command: "./th"
  - file: tests/iter
    source: critnib-1.1/tests/iter
    description: "Iterator shell driver around iter-cli"
    command: "sh ./iter"

test_package_tests:
  - file: test_critnib.c
    description: "Consumer link test: new/insert/get/find_le/find/remove/iter (6 assertions)"
    command: "./test_critnib"

upstream_test_case_count: 4
assertion_count: 10
