knowledge_gained:
  - "官方 release tarball 不含 cmake、debugbreak 和 fast_float git submodule 内容。"
  - "fast_float_all.h 已内置于 release tarball；仅需补齐编译所需的 debugbreak.h。"
  - "c4Project.cmake 需要把 HarmonyOS 纳入 c4_install_exports() 的 Unix 分支。"
  - "OHOS 的 posix_memalign() 对超大非零申请可能返回成功但空指针；aalloc_impl() 需将其作为内存不足处理。"
  - "CMake 构建在鸿蒙工作区使用 -j1，避免并行构建触发 HMDFS jobserver 限制。"

