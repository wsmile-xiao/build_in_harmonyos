# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cake-autorate/1.0.0
homepage: "https://github.com/lynxthecat/cake-autorate"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# cake-autorate 是纯 shell 脚本包，无上游测试套件
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_cake_autorate.sh
    description: "bash -n 语法校验 4 个脚本 + 验证 LICENCE.md 存在"
    command: "bash test_cake_autorate.sh <package_root>"

# 测试断言总数 (近似值, 用于质量评估)
# 6 项断言: launcher 存在、bash -n launcher、4 个脚本存在、
#           bash -n 全脚本、LICENCE.md 存在、shell test 通过
assertion_count: 6
