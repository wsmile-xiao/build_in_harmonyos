software: cake-autorate
# 版本级 manifest 模板
# 文件位置: archives/c/cake-autorate/1.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-23"
build_system: shell

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub 官方 release，CI mirror fallback 覆盖 github.com）
  url: "https://github.com/lynxthecat/cake-autorate/archive/refs/tags/v1.0.0.tar.gz"

  # 源码校验和
  sha256: "b047eba0701c706519dd46f8e28974ff7ad155b6682de3243375ce3a41eb3d9b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: shell

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "cake-autorate 是纯 shell 脚本包，无构建系统"
  - "OpenWrt CAKE QoS 自适应速率调节，针对 LTE/Starlink/电缆等变速连接"
  - "安装布局：bin/cake-autorate*.sh + share/cake-autorate/LICENCE.md"
  - "运行时依赖 bash/fping/tc(iproute2)"
