package: cimfomfa/21-361
homepage: "https://github.com/micans/cimfomfa"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "GitHub tag 21-361"
  source_sha256: "e554f7838a16dfee79999b28133abf58dce01ac9a18f99c38c4183805b5b19d4"
  build_system: "Autotools"
  test_definition: >
    README states that upstream has no unit tests. src/trumpet/Makefile.am
    declares 16 noinst_PROGRAMS used as testing and diagnostic programs, but
    defines no TESTS or check_PROGRAMS entries; consequently make check runs
    zero registered tests. All 16 programs are compiled by make all. The
    recipe executes nine deterministic or internally checked representatives.
  dependency: "none"
  portability_changes: []

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "run nine representative src/trumpet programs"
upstream_tests:
  - test_name: "cff_pagesize"
    source: "src/trumpet/cff_pagesize.c"
    kind: diagnostic
  - test_name: "cff_link"
    source: "src/trumpet/cff_link.c"
    kind: data-structure
  - test_name: "cff_bitpat"
    source: "src/trumpet/cff_bitpat.c"
    kind: memory-format
  - test_name: "cff_let"
    source: "src/trumpet/cff_let.c"
    kind: expression-evaluation
  - test_name: "cff_tst"
    source: "src/trumpet/cff_tst.c"
    kind: string-splice
  - test_name: "cff_unit_ceilfloor"
    source: "src/trumpet/cff_unit_ceilfloor.c"
    kind: randomized-self-check
  - test_name: "cff_optoid"
    source: "src/trumpet/cff_optoid.c"
    kind: option-parser
  - test_name: "cff_match"
    source: "src/trumpet/cff_match.c"
    kind: stream-search
  - test_name: "cff_read"
    source: "src/trumpet/cff_read.c"
    kind: file-io

upstream_program_total: 16
upstream_test_total: 9
upstream_test_passed: 9
upstream_test_failed: 0
upstream_programs_not_executed: >
  Seven remaining noinst programs require interactive, bulk-data, or
  specialized diagnostic inputs and are not registered as upstream tests;
  they are still compiled by the recipe.

test_package_tests:
  - file: "test.c"
    description: >
      Link the installed libtingea archive and verify string creation,
      append/free behavior, lengths, contents, and duplicate-aware binary
      search floor/ceiling semantics.
    command: "./test_cimfomfa"
    assertions: 9
  - file: "test_harmonyos.c"
    description: >
      HarmonyOS-specific test that requires the OHOS aarch64 compiler target,
      checks page-size and UID values through OHOS libc, and exercises the
      packaged mcxTing and binary-search APIs with those runtime values.
    command: "./test_cimfomfa_harmonyos"
    assertions: 10

assertion_count: 19
