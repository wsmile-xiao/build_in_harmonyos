version: "21-361"
software: "cimfomfa"
status: built
build_date: "2026-09-08"
build_system: "autotools"

source:
  url: "https://github.com/micans/cimfomfa/archive/refs/tags/21-361.tar.gz"
  sha256: "e554f7838a16dfee79999b28133abf58dce01ac9a18f99c38c4183805b5b19d4"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos (OHOS armv8 only)"
  dependencies:
    - "automake/1.18 (tool_requires)"
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained:
  - "Git tag omits generated Autotools files; recreate VERSION and configure.ac, then run autoreconf -fi"
  - "The OHOS CI image provides autoconf but not automake/aclocal; use automake/1.18 as a tool requirement"
  - "OHOS CI uses an HMDFS-backed TMPDIR where config.guess cannot create dummy.c; pass the native build triplet to skip that probe"
  - "Generated config.status uses umask 077 for temporary directories, which HMDFS makes unwritable; rewrite it to umask 022 on OHOS"
  - "The distributed library name is libtingea.a and installed headers live under include/tingea"
  - "make check registers zero tests; nine upstream trumpet programs provide executable coverage"
