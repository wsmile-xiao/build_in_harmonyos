software: cimfomfa
display: "cimfomfa (libtingea)"
description: "C utility library used by MCL and zoem"
category: library
homepage: "https://github.com/micans/cimfomfa"
license: "GPL-2.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "Regenerate omitted Autotools outputs from upstream templates"
    - "Skip config.guess on OHOS with an explicit native build triplet"
    - "Use HMDFS-safe permissions for generated Autoconf temporary directories"
    - "Package the upstream static libtingea archive and tingea headers"
    - "Run representative upstream trumpet programs plus consumer API checks"
  common_dependencies:
    - "automake/1.18 (build tool)"

versions:
  "21-361":
    status: built
    build_date: "2026-09-08"
    conan_ref: "cimfomfa/21-361"
