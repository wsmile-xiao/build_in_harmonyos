software: cif-api
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.4.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.2"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/COMCIFS/cif_api/archive/refs/tags/v0.4.2.tar.gz"

  # 源码校验和
  sha256: "803fa1d0525bb51407754fa63b9439ba350178f45372103e84773ed4871b3924"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 编译器
compiler: clang

# 依赖列表（conan package refs 或系统包名）
requires:
  - "sqlite3/3.53.4"

# 构建配置选项
build_options:
  - "--disable-static --enable-shared"

# ============================================================
# 测试信息
# ============================================================

# 测试结果状态
# passed | failed | skipped | not_run
test_status: passed

# 测试说明
test_note: "上游 70 个测试全编译并实跑：65 通过（93%），5 个 write 类测试（write_simple/write_11/write_complex/write_frames/write_loops）因 OHOS 沙箱 tmpfile() 报 Permission denied（临时文件创建受限，TMPDIR 亦无效，环境限制非库缺陷）无法运行；编译需默认 C 标准（-std=c99 下 U_STRING_DECL 的 u\"\" UTF-16 字面量 C11 特性报错）；test_package 消费者探针 cif_create/cif_destroy 运行时真实执行通过"
