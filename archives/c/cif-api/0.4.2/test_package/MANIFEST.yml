# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: cif-api/0.4.2
homepage: "https://github.com/COMCIFS/cif_api"

# 上游测试（src/tests/ compiled_tests：70 个测试程序）
# 已全部编译并实跑：65 通过（93%）；5 个 write 类（write_simple/write_11/
# write_complex/write_frames/write_loops）因 OHOS 沙箱 tmpfile() 报
# Permission denied（临时文件创建受限，TMPDIR 亦无效）无法运行——环境限制非库缺陷
upstream_check_command: "编译 70 个测试程序逐一运行（65 PASS / 5 tmpfile 受限）"

# conanfile.py build() 中未运行上游 make check（手动编译+运行全部测试）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源
upstream_tests:
  - file: src/tests.am
    source: cif_api-0.4.2/src/tests.am
    description: "70 个 compiled_tests 全编译实跑：65 通过（93%），5 个 write 类因 OHOS 沙箱 tmpfile() Permission denied 无法运行"
    command: "逐一编译运行（默认 C 标准；-std=c99 下 U_STRING_DECL 的 u\"\" C11 字面量报错）"

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_cif.c
    description: "消费者探针：cif_create/cif_destroy 创建 CIF 容器，验证 libcif 链接 + 初始化"
    command: "clang test_cif.c -o test_cif_probe -lcif -lsqlite3 -lm && ./test_cif_probe"

# 断言总数（上游 65 个通过 + test_package 1 个断言）
assertion_count: 66
