# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 见: docs/TEST_QUALITY_SPEC.md

package: cparsec/2.3.0
homepage: "https://github.com/PostgREST/CParseC"

# 上游测试命令: 本库无 configure/ctest/meson，上游以 Makefile 编译独立测试
# 可执行文件（basic/unnamed/simd/linkage/freestanding/example），test.sh 执行。
upstream_check_command: "make test && ./test/test.sh"

# conanfile.py build() 中是否已集成上游测试
# header-only 配方不编译；上游测试以 OHOS clang 在配方外编译运行（见 reports/）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（OHOS clang 编译，均通过，exit 0）
upstream_tests:
  - file: test/basic.c + test/basic.h
    source: cparsec-2.3.0/test/basic.c, test/basic.h
    description: "基本解析器组合子断言（字符串/标签/one_of/alt/right/left/between/apply+map/takewhile/many/sepby/eol/eof/pure/match/any 等 58 组 PUTS 用例）"
    command: "./build/basic.o"
  - file: test/unnamed.c
    source: cparsec-2.3.0/test/unnamed.c
    description: "无名解析器用例（提升为文件作用域命名解析器后运行，2 组用例）"
    command: "./build/unnamed.o"
  - file: test/simd.c
    source: cparsec-2.3.0/test/simd.c
    description: "take_till_one_of / take_quoted SIMD 解析器断言（18 组 PUTS 用例）"
    command: "./build/simd.o"
  - file: test/linkage/linkage.c + test/linkage/a.c
    source: cparsec-2.3.0/test/linkage/
    description: "链接正确性：cparsec.h 函数作用域/static inline 检查"
    command: "./build/linkage.o"
  - file: test/freestanding.c
    source: cparsec-2.3.0/test/freestanding.c
    description: "freestanding 符号卫生：-ffreestanding -c 编译且 nm -u 无未定义符号"
    command: "nm -u build/freestanding.o"
  - file: examples/example.c
    source: cparsec-2.3.0/examples/example.c
    description: "CSV 解析示例（readme demo，输出 4 个字段后 exit 0）"
    command: "./build/example.o"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：仅经公开头文件 cparsec.h 与公开 API 解析 BEGIN，验证输出/剩余输入"
    command: "./test_cparsec"

# 测试断言总数 (PUTS 用例 58+2+18=78 组 + linkage + freestanding 符号卫生 = 80 个独立上游入口)
assertion_count: 80
