# 版本级 manifest — conmux 0.12.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.12.0"

# 软件名
software: "conmux"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39 官方源：autotest 官方 GitHub 仓库 conmux 子目录）
  url: "https://github.com/autotest/autotest/archive/refs/heads/master.tar.gz"

  # 源码校验和（实测）
  sha256: "a2bfccea623f8286bcad5f8777cb3430fff3e99dc52e783789ed2d92dd85331a"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型：纯 Perl 应用，make install BUILD=<staging> 纯拷贝安装
  system: makefile

  # 配置选项列表（无 configure）
  configure_options: []

  # 编译依赖列表（格式: name/version；与 conanfile.py requirements 一致）
  dependencies:
    - perl-io-multiplex/1.16
    - perl-uri/5.35

  # 编译器（纯 Perl 无 C 编译；记录工具链）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁；E049 shebang 修正内置在 package() 中）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E049: conmux 脚本 shebang 硬编码 #!/usr/bin/perl，设备 perl 在 /data/service/hnp/bin/perl——package() 中统一修正为 #!/usr/bin/env perl（可移植）"
  - "conmux 为 autotest 仓库 conmux 子目录，conandata 指向官方 autotest tarball，source() 中先整体改名 conmux/ 再提升内容到源码根（避免子目录内同名文件 conmux 的 copy 路径冲突）"
  - "conmux 脚本运行时需 IO::Multiplex/URI::Escape，test_package 须显式声明这两个依赖（否则 test 阶段传递依赖 binary 被 Skipped，package_folder 为 None）"
