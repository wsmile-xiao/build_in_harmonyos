# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: conmux/0.12.0
homepage: "https://github.com/autotest/autotest/tree/master/conmux"

# 上游测试命令 — 穷尽核查结论：上游无自带测试
# 核查证据（R51 三步法）：
#   1. 清点：源码树 41 个文件，无任何测试文件/测试目录（find 无 *test*/.t/t 目录）；
#      Makefile 与 */module.mk 无 test/check 目标；README/INSTALL 无测试说明；
#      GitHub autotest 仓库树核验一致；.gitignore 无被忽略的测试资产。
#   2. 运行：上游无测试可运行（非环境限制，是上游确实未提供）。
#   3. 回填：故适配后 test_package 自研完整功能测试集（见下），非占位符申报。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（上游确无测试，附清点证据）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证 + 自研功能覆盖）
# 自研测试覆盖核心功能（R34 真实调用）：
#   - 安装产物完整性（conmux/conmux-registry/conmux-attach/console/Conmux.pm）
#   - 打包脚本可运行（usage 提示输出）
#   - Conmux.pm 模块经 perl -I 真实加载
#   - conmux-registry 真实 TCP 协议：启动服务 → ADD → LOOKUP（验证回读）→ LIST
test_package_tests:
  - file: test_conmux.py
    description: "消费者+功能测试（R34）：脚本 usage / Conmux.pm 加载 / conmux-registry 真实协议 ADD+LOOKUP+LIST"
    command: "python3 test_conmux.py <registry-path> <conmux-lib-dir>"

# 测试断言总数（test_package 消费者测试独立断言点；上游无测试故不含上游用例）
# 口径：4×check_usage（conmux-registry/conmux/conmux-attach/console）+ Conmux.pm
# 加载 + registry 协议（ADD/LOOKUP 回读/LIST）3 项 = 8 个独立断言点
assertion_count: 8
