# test_package/MANIFEST.yml — cdbfasta 1.00-git20230710.da8f5ba
# CI L0e requires this file to exist.

package: cdbfasta/1.00-git20230710.da8f5ba
homepage: "https://github.com/gpertea/cdbfasta"

# cdbfasta has no upstream test suite (plain-Makefile project; perltest.pl is
# a usage example, not a runner; no make check target)
upstream_check_command: "make"
upstream_test_in_build: true
upstream_test_command: "index/query behavioral workflow on a sample FASTA (build())"

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective, driving both installed tools)
test_package_tests:
  - file: test_cdbfasta.py
    description: "Indexes a sample multi-FASTA with cdbfasta and retrieves records by key with cdbyank, verifying exit codes, index creation, record content, and absent-key behavior"
    command: "python test_cdbfasta.py <cdbfasta> <cdbyank>"

assertion_count: 5
