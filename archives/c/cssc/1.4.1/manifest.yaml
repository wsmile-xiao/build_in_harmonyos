# 版本级 manifest — cssc 1.4.1
# 遵循 ARCHIVE-SPEC v2.0

version: "1.4.1"
software: "cssc"
status: published
build_date: "2026-09-11"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/cssc/CSSC-1.4.1.tar.gz"
  sha256: "d1bed0c80246ee4cd49d0aa45307c075d0876fe531057bb1c8b28f5330d651ef"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "build-aux_config.guess.patch"
  - "build-aux_config.sub.patch"
  - "src_file.cc.patch"
  - "src_sccs.c.patch"
  - "src_bodyio.cc.patch"
  - "src_sccsdiff.sh.in.patch"
  - "testutils_decompress_stdin.sh.in.patch"
  - "testutils_compare_gets.sh.patch"
  - "unit-tests_googletest_src_gtest-port.cc.patch"
  - "unit-tests_test_linebuf.cc.patch"
  - "tests_common_not-root.patch"
  - "tests_bsd-sccs_delsfile.sh.patch"
  - "tests_get_subst.sh.patch"
  - "tests_admin_comment.sh.patch"
  - "tests_cdc_2comment.sh.patch"
  - "tests_cdc_4order.sh.patch"

knowledge_gained:
  - "E007/E122: 2016 版 config.guess/config.sub 需 OHOS 重锚（HarmonyOS 分支 + linux-ohos 三元组），老版 config.guess 用 echo+exit 风格而非 GUESS 变量"
  - "OHOS 应用 UID 无 /etc/passwd 条目：getpwuid() 返回 NULL，SCCS 的 get_user_name()/username() 会 fatal_quit/SIGTRAP (133)——需回退 $USER/'unknown'（file.cc + sccs.c 两处）"
  - "tmpfile() 走 P_tmpdir(/tmp) 只读：需 mkstemp($TMPDIR)+fdopen+unlink 回退（bodyio.cc/sccs.c/test_linebuf.cc/gtest-port.cc CapturedStream 四处）"
  - "捆绑 googletest 1.6 的 CapturedStream 硬编码 /tmp/captured_stream.XXXXXX：死亡测试父进程 GTEST_CHECK abort (134)——__OHOS__ 分支改用 $TMPDIR"
  - "GNU grep 3.12 egrep 弃用警告污染 stderr：docommand 严格比对 stderr 的测试全挂——egrep→grep -E"
  - "硬链接源码树：SCCS 工具拒绝 nlink>1 的 s.file（安全特性非 bug）——测试 fixture 需断链副本"
  - "compress(1) .Z (LZW) 格式 gzip 解不了且 OHOS 无 ncompress——decompress_stdin.sh 改 python3 (gzip→LZW)"
