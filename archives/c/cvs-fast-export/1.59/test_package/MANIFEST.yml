# test_package/MANIFEST.yml — cvs-fast-export 1.59
package: cvs-fast-export/1.59
homepage: "http://catb.org/~esr/cvs-fast-export/"

# 上游自带 tests/ 目录与 Python 驱动的回归（testlifter.py / t9601-t9605.py），
# 但它们需要 cvs、cvsps、git 等外部工具链与真实 RCS 仓库夹具，CI runner 不具备；
# 故按 N=0 如实申报，消费者验证由 test_package 承担。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: tests/testlifter.py
    source: cvs-fast-export-1.59/tests
    description: "上游 Python 回归驱动（需 cvs/cvsps/git 与 RCS 夹具，CI 不具备）"
    command: "python3 tests/testlifter.py"

# test_package 自带消费者测试
test_package_tests:
  - file: test_cvs_fast_export.c
    description: "消费者测试 9 条：二进制存在/可执行/ELF64-AArch64；-V 与 -h 真实执行且输出含源码字面；三个 Python 辅助脚本存在且可执行"
    command: "test_cfe <bin_dir>"

# 测试断言总数：上游 0（外部工具链不可得）+ test_package 9
assertion_count: 9