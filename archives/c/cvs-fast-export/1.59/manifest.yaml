# 版本级 manifest — cvs-fast-export 1.59

version: "1.59"
software: "cvs-fast-export"

status: built
build_date: "2026-09-10"
build_system: custom

source:
  url: "https://deb.debian.org/debian/pool/main/c/cvs-fast-export/cvs-fast-export_1.59.orig.tar.gz"
  sha256: "2439cd83f54c98f248e85d3ba3becbe028580e89652c50756022fbe564a9e8da"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
  - "生成 _cfe_version.h（#define VERSION \"1.59\"），-include 注入（替代上游 -DVERSION=\\\"$(VERSION)\\\"）"
  - "clang -O2 -Wall -pthread -DTHREADS -I. -c <22 个目标文件>"
  - "clang ... <22 个 .o> -o cvs-fast-export"
  dependencies: []
  cc: clang
  cxx: N/A

patches_applied: []

knowledge_gained:
- "tarball 同时携带 bison/flex 的**生成产物**（gram.c/gram.h、lex.c/lex.h）与其源（gram.y/lex.l），而上游 Makefile 有再生成规则（gram.c: gram.y 等）。当 .y/.l 时间戳更新时会触发 bison/flex —— CI 环境没有这两个工具。绕过 make 直编时**直接使用随包生成的 .c** 即可，避免把 bison/flex 变成构建依赖。"
- "上游 Makefile 混合 BSD make（.PATH/.PARSEDIR/?=）与 GNU make（$(shell …)）语法，且 VERSION 由 `sed -n <NEWS.adoc '/::/s/^\\([0-9][^:]*\\).*/\\1/p' | head -1` 从文档抽取后再以字符串字面量宏注入（-DVERSION=\\\"1.59\\\"）。直编时必须复刻该宏，并建议用生成头文件 + -include 规避跨 shell 引号转义。"
- "上游默认开启多线程（CFLAGS += -pthread 与 CPPFLAGS += -DTHREADS），配方必须同样开启，否则 collate 阶段行为与上游不一致。"
- "源码以 #include \"cvs.h\" 形式同目录引用，直编时需显式 -I.。"
- "产物 cvs-fast-export 为 ELF64/AArch64，NEEDED 仅 libc.so；另附三个 Python 辅助脚本 cvsconvert/cvsstrip/cvssync。"
