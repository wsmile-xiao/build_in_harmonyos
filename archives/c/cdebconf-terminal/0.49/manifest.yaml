software: cdebconf-terminal
version: "0.49"
status: built
build_date: "2026-09-09"
build_system: autotools
source:
  url: "https://deb.debian.org/debian/pool/main/c/cdebconf-terminal/cdebconf-terminal_0.49.tar.xz"
  sha256: "4f8af6e8ed3d2de65a205a2749ee3715edbdf7e578ec56cbc0494142b63575e7"
  tar_format: tar.xz
build:
  system: autotools
  build_system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies:
    - cdebconf/0.283
  cc: clang
  cxx: clang++
patches_applied: []
runtime_modifications: []
knowledge_gained:
    - "cdebconf-terminal（Debian Installer Team）是 cdebconf 的终端插件包：gtk-plugin-terminal.c（GTK/VTE 图形终端）+ newt-plugin-terminal.c（newt clean-terminal 运行器），autotools 构建，硬依赖 libdebconfclient/libdebian-installer（由 cdebconf/0.283 requires 提供，避免重复 vendor）"
    - "Debian 源码包不含预生成 configure（仅 configure.ac + Makefile.in），真机无可用 autotools 自举链——配方零 tool_requires，用 Python 复刻 configure.ac（pkg-config 探测 FRONTENDS + Makefile.in 占位符替换）生成 Makefile"
    - "configure 的 confstat 临时目录用 umask 077 建 0700 目录，在 OHOS HMDFS 上不可写——同 cdebconf/catdoc/boa/ccze 方案 patch 为 umask 000"
    - "上游无任何测试套件（38KB 源码包仅两个插件 .c + 构建文件，无 tests/ 目录、无 TESTS/check_PROGRAMS），MANIFEST 声明 upstream_tests_exist:false 并附审计，真机输出 no_tests/0 证据"
