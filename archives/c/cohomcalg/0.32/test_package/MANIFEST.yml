# test_package/MANIFEST.yml
# 上游官方测试声明 — cohomcalg 0.32
# 上游是纯 Makefile 命令行工具, 无测试框架/tests 目录/ctest。
# 独立上游用例 = bin/*.in 样例输入 (7 个几何输入文件, 驱动同一二进制)。

package: cohomcalg/0.32
homepage: "https://github.com/BenjaminJurke/cohomCalg"

# 上游测试命令 (枚举结果: Makefile 无 test/check 目标)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (样例输入 = 用户测试源)
upstream_tests:
  - file: bin/CP2.in
    source: cohomcalg-0.32/bin/CP2.in
    description: "CP^2 射影平面线丛上同调样例 (11 个 cohom 请求), 6/7 集成用例之一, 本任务实测 PASS"
    command: "./cohomcalg --integrated --nomonomfile bin/CP2.in"
  - file: bin/dP1.in
    source: cohomcalg-0.32/bin/dP1.in
    description: "del Pezzo-1 曲面样例 (3 个 cohom 请求), 本任务实测 PASS (鸿蒙专项测试断言基础)"
    command: "./cohomcalg --integrated --nomonomfile bin/dP1.in"
  - file: bin/dP3.in
    source: cohomcalg-0.32/bin/dP3.in
    description: "del Pezzo-3 曲面样例 (2 个 cohom 请求), 本任务实测 PASS"
    command: "./cohomcalg --integrated --nomonomfile bin/dP3.in"
  - file: bin/P31SU7.in
    source: cohomcalg-0.32/bin/P31SU7.in
    description: "P^3 中一般曲面样例, 本任务实测 PASS"
    command: "./cohomcalg --integrated --nomonomfile bin/P31SU7.in"
  - file: bin/Quintic.in
    source: cohomcalg-0.32/bin/Quintic.in
    description: "五次超曲面样例 (2 个 cohom 请求), 本任务实测 PASS"
    command: "./cohomcalg --integrated --nomonomfile bin/Quintic.in"
  - file: bin/WCP11114.in
    source: cohomcalg-0.32/bin/WCP11114.in
    description: "加权射影空间 WCP(1,1,1,1,4) 样例, 本任务实测 PASS"
    command: "./cohomcalg --integrated --nomonomfile bin/WCP11114.in"
  - file: bin/P31SU8.in
    source: cohomcalg-0.32/bin/P31SU8.in
    description: "SU(8) 相关大样例 (10 维 GLSM, 41 项 SR 理想), 计算量指数级, 超时未完成 (运行 240s 达 15.15%, 程序自报剩余约 4h57m), 非缺陷"
    command: "./cohomcalg --integrated --nomonomfile bin/P31SU8.in"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者验证: 运行 cohomcalg 二进制, --help 横幅 + dP1.in 数学结果断言 (h1(O(-1,-2))=1)"
    command: "bash test.sh"

# 测试断言总数 (近似值: 7 上游样例 + 鸿蒙专项 5 断言 + test_package 2 断言)
assertion_count: 14