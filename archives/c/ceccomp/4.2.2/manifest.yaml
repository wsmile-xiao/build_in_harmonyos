# 版本级 manifest — ceccomp 4.2.2
# 文件位置: archives/c/ceccomp/4.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: ceccomp
version: "4.2.2"

# 编译状态: built（conan-verify 通过，未 upload）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 GitHub tag tarball（R39：官方源）
  url: "https://github.com/ceccomp/ceccomp/archive/refs/tags/v4.2.2.tar.gz"

  # 源码校验和（2026-09-08 macOS 与设备两端各自下载，SHA-256 一致）
  sha256: "15136d6f720209fea391fee286930cf5656230cfbe2087c586b28bf81489bece"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型：上游 configure 为手写 Python 脚本（argparse），
  # 读取环境变量 CC/CFLAGS/LDFLAGS，生成 Makefile 后 make——非 autotools
  system: custom
  build_system: custom

  # 配置选项列表（--includedir/--libdir 在 conanfile.py build 阶段
  # 指向依赖图合并目录，不硬编码本机路径）
  configure_options:
    - "--prefix=/"
    - "--without-doc"
    - "--without-i18n"
    - "--includedir=<conan 依赖合并 include 目录>"
    - "--libdir=<conan 依赖合并 lib 目录>"

  # 编译依赖列表（格式: name/version，来自 ohpcd 制品仓，W0 已验证 binary 可用）
  dependencies:
    - "libseccomp/2.6.1"
    - "argp-standalone/1.5.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-ceccomp-4.2.2-ohos-portability.patch"
  - "0002-ceccomp-4.2.2-probe-tmpdir.patch"
  - "0003-ceccomp-4.2.2-configure-platform-ohos.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 configure 是手写 Python 脚本（argparse），读 env CC/CFLAGS/LDFLAGS，非 autotools；用 conanbuild env 驱动而非 Autotools 帮手"
  - "configure 只接受单一 --includedir/--libdir；多依赖时需合并 include/lib 目录注入"
  - "configure argp 回退探测缺 push_sys_dir=True（libseccomp 探测有），conan 包路径探测必败 ref: E011"
  - "OHOS SDK sys/prctl.h 与 linux/prctl.h 重复定义 struct prctl_mm_map，两者不可同时包含 ref: E007"
  - "OHOS 设备 /tmp 不可写，tmpfile() 返回 EACCES；用 TMPDIR 感知的 mkstemp+unlink+fdopen 替代 ref: E214"
  - "musl/OHOS 无 argp.h，链接 argp-standalone/1.5.0 静态包"
  - "make install 依赖 coreutils install（OHOS 无），打包阶段手动 copy"
  - "OHOS 无 BPF syscall 且 PTRACE_SEIZE 被安全策略拒绝（对自身子进程也 EPERM），动态测试 probe/trace/seize 失败为平台级限制 ref: E085"
  - "同一上游在设备与 CI 的 python sys.platform 值可能不同（设备 hnp python3 报 'linux'，CI worker OHOS CPython 报 'ohos'），configure 类平台白名单按 =='linux' 判定会设备通过、CI 失败——平台接受性必须在 CI 环境交叉验证"

# 上游测试计数口径（审方 rule4 对齐用）
# 统计单位：pytest 用例（函数 + 参数化实例）；取数命令：
#   python3 -m pytest test/ --collect-only -q | tail -1
#   python3 -m pytest test/ 2>&1 | tail -1
upstream_tests:
  total: 91
  passed: 87
