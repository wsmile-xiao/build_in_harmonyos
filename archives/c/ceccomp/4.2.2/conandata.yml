sources:
  # 官方 GitHub tag tarball（2026-09-08 两端各自下载，SHA-256 一致）
  url: "https://github.com/ceccomp/ceccomp/archive/refs/tags/v4.2.2.tar.gz"
  sha256: "15136d6f720209fea391fee286930cf5656230cfbe2087c586b28bf81489bece"

patches:
  - patch_file: "patches/0001-ceccomp-4.2.2-ohos-portability.patch"
    patch_description: >
      OHOS 可移植性修复：configure argp 回退探测补 push_sys_dir=True
      （与 libseccomp 探测一致，否则 conan 包目录不可达、探测必失败）；
      删除 read_source.c/str_pile.c/unit_test.c 中与 SDK sys/prctl.h
      重复定义 struct prctl_mm_map 的 linux/prctl.h 冗余包含
    patch_type: "portability"
  - patch_file: "patches/0002-ceccomp-4.2.2-probe-tmpdir.patch"
    patch_description: >
      probe 临时文件改为 TMPDIR 感知（mkstemp+unlink+fdopen 等价替换
      tmpfile()）：OHOS 设备 /tmp 不可写（实测 EACCES）；TMPDIR 未设时
      回退 /tmp 保持原行为，POSIX 通用实现无平台条件编译
    patch_type: "portability"
  - patch_file: "patches/0003-ceccomp-4.2.2-configure-platform-ohos.patch"
    patch_description: >
      configure check_platform 平台白名单接受 sys.platform='ohos'：
      OHOS 补丁版 CPython 的 sys.platform 为 'ohos'（设备 hnp python
      报 'linux'，CI worker python 报 'ohos'），上游白名单直接拒绝导致
      conan create 在 CI worker 构建失败；OHOS 即 Linux 内核，seccomp
      BPF 行为一致，接受后 info 打印实际平台值，android/其他平台分支不变
    patch_type: "portability"
