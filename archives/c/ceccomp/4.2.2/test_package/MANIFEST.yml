# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ceccomp/4.2.2
homepage: "https://github.com/ceccomp/ceccomp"

# 上游测试命令（上游 README 载明的官方入口：configure + make 后
# 在仓库根执行 pytest test；设备端 2026-09-08 实测 91 例，
# 87 passed / 3 failed / 1 skipped，详见 notes.md 验证结果）
upstream_check_command: "python3 -m pytest test/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（pytest 套件，依赖已安装的 ceccomp 二进制）
upstream_tests:
  - "test/test_asm.py"
  - "test/test_disasm.py"
  - "test/test_emu.py"
  - "test/test_edge_case.py"
  - "test/test_dynamic.py"

# test_package 中自带的测试（消费者视角验证，版本受控的 test.sh）
test_package_tests:
  - file: test.sh
    description: "真实执行安装后的 ceccomp：version 输出断言 + asm→raw→disasm→asm 往返逐字节一致（3 个 case）"
    command: "bash test.sh"

# 测试断言总数（case1 版本行存在；case2 三段命令退出码均 0；case3 cmp 往返一致）
assertion_count: 3
