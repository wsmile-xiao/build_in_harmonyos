# 软件级 manifest 模板
# 文件位置: archives/c/ceccomp/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: ceccomp

# 显示名
display: "ceccomp"

# 一句话描述
description: "seccomp BPF 过滤器分析工具：汇编、反汇编、模拟与动态提取"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: system

# 官网 URL
homepage: "https://github.com/ceccomp/ceccomp"

# 开源许可证（SPDX 标识）
license: GPL-3.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "上游 configure 是手写 Python 脚本（argparse），读 env CC/CFLAGS/LDFLAGS 生成 Makefile，非 autotools"
    - "configure 只接受单一 --includedir/--libdir，多依赖需合并目录注入"
    - "musl/OHOS 无 argp.h，依赖 argp-standalone；configure argp 探测需 push_sys_dir=True"
    - "SDK sys/prctl.h 与 linux/prctl.h 重复定义 prctl_mm_map，不可同时包含"
    - "设备 /tmp 不可写，tmpfile() 需替换为 TMPDIR 感知实现"
    - "make install 依赖 coreutils install（OHOS 无），打包需手动 copy"
  # 跨版本通用依赖
  common_dependencies:
    - libseccomp
    - argp-standalone

# ============================================================
# 版本索引
# ============================================================

versions:
  "4.2.2":
    status: built
    build_date: "2026-09-08"
