version: "1.7"
software: c10t
status: built
build_date: "2026-09-06"
build_system: cmake

source:
  url: "https://github.com/udoprog/c10t/archive/refs/tags/1.7.tar.gz"
  sha256: "0e5779d517105bfdd14944c849a395e1a8670bedba5bdab281a0165c3eb077dc"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_CXX_STANDARD=11"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DBoost_USE_STATIC_LIBS=OFF"
    - "-DBUILD_DEV_LIBS=ON"
  dependencies:
    - boost/1.91.0.1
    - libpng/1.6.58
    - freetype/2.14.3
    - zlib/1.3.1.1
  build_dependencies:
    - boost/1.84.0
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-ohos-cmake-and-boost-compat.patch"
