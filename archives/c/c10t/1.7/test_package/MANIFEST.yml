# test_package/MANIFEST.yml — c10t 1.7
# 上游无测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）

package: c10t/1.7
homepage: "https://github.com/udoprog/c10t"

upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "CMakeLists.txt（顶层）"
    finding: "全文件无 enable_testing() / add_test() / add_custom_target(check) 调用；测试入口只有 add_subdirectory(test)，其下目标为 EXCLUDE_FROM_ALL，默认构建与 ctest 均不可达"
  - path: "test/CMakeLists.txt"
    finding: "仅定义 add_executable(c10t-test EXCLUDE_FROM_ALL test.cpp) 并链接 c10t-lib 与 boost_unit_test_framework；该组件未列入本配方依赖且默认不构建，不构成可运行的上游测试入口"
  - path: "test/test.cpp（上游源码）"
    finding: "为 Boost.Test 手工冒烟源文件，未接入任何 CTest/框架注册，无法通过 ctest --output-on-failure 发现或执行"
  - path: "Homebrew c10t 公式（formulae.brew.sh/formula/c10t）"
    finding: "官方 test 块仅执行 `c10t --list-colors` 二进制冒烟，无上游测试套件可引用；佐证上游无可接入测试"

test_package_tests:
  - file: test_c10t.sh
    description: "消费者功能测试：真实执行包内 bin/c10t 完成 4 项验证——--help 用法、--list-colors 方块颜色表（Homebrew 同款）、--version 版本横幅、空参数负向对照（R34 合规）"
    command: "<shell> test_c10t.sh（C10T_BIN 指向包内 bin/c10t）"

assertion_count: 4
