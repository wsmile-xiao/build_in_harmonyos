patches:
  - patch_file: "patches/0001-ohos-cmake-and-boost-compat.patch"
    patch_description: "OHOS/CMake4/Boost>=1.85 compatibility: cmake_minimum_required 3.5, git-revision fallback, drop header-only Boost system component, migrate removed filesystem APIs, link (not list) ZLIB/PNG imported targets in subdir add_library calls, propagate Conan CONFIG-mode imported-target includes globally and append Boost/ZLIB/PNG/Freetype/Threads config targets plus recipe-discovered absolute Boost lib paths to c10t_LIBRARIES (PREFER_CONFIG), use version-consistent 1.84 filesystem headers (shadow) + static lib (c10t-mc PUBLIC) for the directory_iterator ABI split, add missing zlib.h include for Z_DEFAULT_STRATEGY, drop C++17-removed dynamic exception specifications throw(interrupted_exception)/throw(players_db_exception)"
    patch_type: "portability"
