software: c10t
display: "c10t"
description: "Minecraft cartography tool (map renderer)"
category: utility
homepage: "https://github.com/udoprog/c10t"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake tool package: only the c10t binary is published (R38)"
    - "Bundled libs/unc is built in-tree (BUILD_DEV_LIBS=ON, same as Homebrew)"
    - "Boost filesystem modern API patch (basename/extension removed since Boost 1.85)"
  common_dependencies:
    - boost
    - libpng
    - freetype
    - zlib

versions:
  "1.7":
    status: built
    build_date: "2026-09-06"
