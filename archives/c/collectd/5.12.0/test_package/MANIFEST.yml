# test_package/MANIFEST.yml
# collectd 5.12.0 upstream test declaration

package: collectd/5.12.0
homepage: "https://collectd.org"

# Upstream test command (collectd 主程序测试，本配方为 header-only 依赖包不适用)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package/test.c
    description: "按 collectd-apk 插件编译方式（-I<core> + <daemon/plugin.h>）编译测试程序，验证插件 API 头文件布局与依赖链完整（plugin.h → collectd.h/configfile.h/utils_time.h + meta_data.h + oconfig.h）"
    command: "./test_collectd"

# Test assertion count
assertion_count: 2
