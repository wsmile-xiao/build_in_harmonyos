sources:
  url: "https://downloads.sourceforge.net/project/camellia/Unix_Linux%20Distribution/v2.7.0/CamelliaLib-2.7.0.tar.gz"
  sha256: "a3192c350f7124d25f31c43aa17e23d9fa6c886f80459cba15b6257646b2f3d2"

patches:
  - patch_file: "patches/0001-config-sub-aarch64.patch"
    patch_description: "Accept aarch64 linux and ohos triples in the bundled 2007 config.sub"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-022.patch"
    patch_description: "Create the configure temp dir with umask 022; setgid HMDFS makes umask 077 dirs unwritable and config.status fails silently"
    patch_type: "portability"
  - patch_file: "patches/0003-src-cam-utils-uintptr-alignment.patch"
    patch_description: "Use uintptr_t for image data alignment; casting the malloc pointer to int truncates 64-bit addresses and crashes on aarch64"
    patch_type: "portability"
