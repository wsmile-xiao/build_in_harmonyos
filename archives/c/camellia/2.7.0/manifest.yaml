upstream_tests:
  command: "make check"
  test_count: 0
  notes: "The release provides no test suite; automake check targets are empty (check-am: all-am with no TESTS). README documents a manual cam_demo run which requires a resources directory not shipped in the release tarball; library behavior is validated by the 22-assertion consumer in test_package instead."

test_package:
  assertion_count: 24
  description: "C consumer exercises the public C API: image allocation; rectangle drawing and flood fill; PGM save/load round trip with pixel assertions; RLE encode/decode with identity LUT; labeling plus blob analysis asserting exactly one 16x16 surface-255 blob on a uniform background."

knowledge_gained:
  - "64-bit pointer truncation in 2007 era image alignment math crashes on aarch64; fixed with uintptr_t; knowledge_ref: E547"
  - "legacy autotools on OHOS needs explicit aarch64 build/host triple and umask 022 configure tmpdir; reference: E491"
