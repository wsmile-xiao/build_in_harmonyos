package: camellia/2.7.0
homepage: "https://camellia.sourceforge.net/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "none"

upstream_tests: []
upstream_tests_note: >-
  The 2.7.0 release ships no test suite. Both generated Makefile.in files define
  check-am as all-am with an empty TESTS list, so make check compiles everything
  and runs zero cases. The README suggests a manual cam_demo run, but every demo
  (cam_demo; cam_yalefaces; cam_myobjects) loads image fixtures from a resources
  directory that is not part of the release tarball, so no upstream case can run
  from the archive alone. TOTAL=0 PASS=0 FAIL=0 SKIP=0 NOT_RUN=0; statistic unit
  is automake test cases discovered by make check.

test_package_tests:
  - file: test.c
    description: "Public C API consumer: allocation; draw and flood fill; PGM round trip; RLE codec round trip; labeling and blob analysis"
    command: "./camellia_test"

assertion_count: 24
