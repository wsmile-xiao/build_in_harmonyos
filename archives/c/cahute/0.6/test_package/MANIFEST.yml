# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
# 完整枚举台账见 reports/upstream-test-enumeration.md

package: cahute/0.6
homepage: "https://cahuteproject.org/"

# 上游测试命令 — cahute 是 CMake 项目，无 make check；ctest -N 实测 0 注册
upstream_check_command: "ctest -N"

# conanfile.py build() 中是否已集成上游测试（上游无测试，false）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：官方 tag 0.6 无任何测试声明（0 目录/0 注册/无框架）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，实质调用库 API)
test_package_tests:
  - file: test.c
    description: "消费者测试：cahute_create_context + cahute_convert_to_utf8 实质调用库 API"
    command: "./test_cahute"

# 测试断言总数 (真实断言：context 创建成功 + UTF-8 转换结果匹配)
assertion_count: 2
