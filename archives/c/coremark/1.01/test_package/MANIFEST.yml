# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: coremark/1.01
homepage: "https://www.eembc.org/coremark/"

# 上游测试命令 (make -n check / ctest -N / meson test --list 分析)
# coremark 无 ctest/GTest 注册；官方 `make check` 需发行物 coremark.md5（官方 GitHub tag 不含），
# 权威验证入口为 Makefile run 目标（run1/run2/run3.log，自带 crcfinal 自校验）。
upstream_check_command: "make PORT_DIR=linux64 CC=clang XCFLAGS='-DITERATIONS=1000'"
upstream_test_in_build: false
upstream_test_command: "make PORT_DIR=linux64 CC=clang XCFLAGS='-DITERATIONS=1000 -DVALIDATION_RUN=1' load run2.log"

# 上游实际运行的测试程序
upstream_tests:
  - file: core_main.c
    source: coremark-1.01/core_main.c
    description: "CoreMark 基准主程序（性能/验证/profile 三套运行参数，输出 crcfinal 自校验与 Correct operation validated）"
    command: "./coremark 0x3415 0x3415 0x66 100 7 1 2000"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者验证：运行安装后的 coremark 二进制（validation run，iterations=0 自动调优至 ≥10s 有效窗口），断言输出包含 Correct operation validated"
    command: "./test.sh (COREMARK_EXE=<pkg>/bin/coremark 0x3415 0x3415 0x66 0 7 1 2000)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3