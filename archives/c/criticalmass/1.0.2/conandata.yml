# conandata.yml — criticalmass 1.0.2
# 上游：Critical Mass (Critter) — Frank Becker，SDL 1.2/OpenGL 太空射击，GPL-2+
# 官方源: https://sourceforge.net/projects/criticalmass/files/CriticalMass-1.0.2.tar.bz2
#   ⚠️ 实测（2026-09-17）：SourceForge 对非浏览器 UA 返回 403/HTML 拦截页或截断文件，
#   本地 curl 与 CI 均不可靠，故首位放实测可用且 SHA-256 一致的镜像（macports distfiles），
#   官方 /download 仅作兜底（同 abcselect 先例：url 列表按序尝试）。
# SHA-256 846db2d3... 已与本地 tarball 实测一致（5122126 字节；MD5 e2aff114bffa717fb79c82e1dc473ebe）
# 上游包自带的 config.guess/config.sub 为 2012 版，不认 aarch64-unknown-linux-ohos，
# 用 files/config.guess|config.sub（FSF 2024）在 configure 阶段覆盖（同 cheops 先例）。

sources:
  url:
    - "https://distfiles.macports.org/criticalmass/CriticalMass-1.0.2.tar.bz2"
    - "https://ftp.lysator.liu.se/pub/gentoo/distfiles/0f/CriticalMass-1.0.2.tar.bz2"
    - "https://sourceforge.net/projects/criticalmass/files/CriticalMass-1.0.2.tar.bz2/download"
  sha256: "846db2d30d39e559612328594084a7aef980169948b2cfaee9fddec8ffdef724"

patches:
  - patch_file: "patches/0001-remove-bundled-curl.patch"
    patch_description: "Drop AC_CONFIG_SUBDIRS(curl) — the bundled curl is fetched from an unmaintained mirror at configure time; curl is supplied by the Conan dependency chain instead"
    patch_type: "portability"
  - patch_file: "patches/0002-png12-to-png16.patch"
    patch_description: "Adapt libpng 1.2-era API usage (png_structp field access) to libpng 1.6 API"
    patch_type: "portability"
  - patch_file: "patches/0003-sdl-config-compat.patch"
    patch_description: "Add AC_ARG_VAR SDL_CFLAGS/SDL_LIBS and use them in the SDL-1.2 check so the build works without a sdl-config binary (sdl12-compat provides headers/libs only)"
    patch_type: "portability"
  - patch_file: "patches/0004-headless-version-exit.patch"
    patch_description: "Handle --version before any SDL/GL initialisation so test_package can assert the version without a display/driver"
    patch_type: "portability"
  - patch_file: "patches/0005-toolchain-cflags.patch"
    patch_description: "Guard the configure-time CFLAGS/CXXFLAGS reset (: ${CFLAGS=\"\"}) so the injected toolchain flags from AutotoolsToolchain survive"
    patch_type: "portability"
  - patch_file: "patches/0006-resource-data-dir.patch"
    patch_description: "Do not build/install resource.dat (the tools/Packer generator cannot run in the HarmonyOS sandbox): drop pkgdata_DATA/rule and make the runtime fallback resolve data/ via getDataPath() instead of the CWD"
    patch_type: "portability"
  - patch_file: "patches/0007-hashmap-explicit-using.patch"
    patch_description: "Fix hash_map usage for libc++ (clang 15 / OHOS): (1) utils/hashMap.hpp — replace `using namespace HASH_NAMESPACE;` with `using HASH_NAMESPACE::hash_map;` so the __gnu_cxx::hash template is no longer injected, keeping bare `hash<...>` unambiguous under `using namespace std`; (2) game/Input.hpp — move the `hash<Trigger>` specialization from namespace __gnu_cxx into namespace std (Trigger is a user type, so this is legal); (3) drop the redundant `const` from all `hash_map<const string,...>`/`hash<const string>`/`equal_to<const string>` usages (10 files) — the value_type key is const anyway, and libc++'s class-template-argument deduction strips cv-qualifiers inconsistently across hash/equal_to slots; (4) utils/FindHash.hpp — the second overload declared its local iterator as `hash_map<const _KeyT,...>::const_iterator` but assigns it from `hash_map<_KeyT,...>::find()`, which libc++ cannot convert across different key types; use `hash_map<_KeyT,...>` so the const_iterator matches the map's own iterator"
    patch_type: "portability"
  - patch_file: "patches/0008-png16-write-api.patch"
    patch_description: "Adapt remaining libpng 1.2-era API in utilssdl/PNG.cpp to libpng 1.6 (opaque png_struct): use png_get_io_ptr(png) instead of the png->io_ptr field, and setjmp(png_jmpbuf(_png)) instead of setjmp(_png->jmpbuf)"
    patch_type: "portability"
  - patch_file: "patches/0009-makefile-includes-abs.patch"
    patch_description: "Make subdirectory INCLUDES out-of-tree safe: conan builds in a VPATH build folder (build-release/), so the relative -I../utils / -I../tinyxml / -I../utilssdl / -I../utilsgl paths in utilssdl, utilsgl, tools and game Makefile.in resolve against the empty build dir instead of the source tree; anchor them with $(top_srcdir) instead (which is absolute)"
    patch_type: "portability"
  - patch_file: "patches/0010-packer-const-compare.patch"
    patch_description: "Packer.cpp defines operator< taking non-const DirectoryEntry&; since C++11, std::list::sort() invokes the comparator with const elements, so the call no longer binds under libc++/clang 15 (C++03-era libstdc++ passed non-const and masked this). Take const references"
    patch_type: "portability"
  - patch_file: "patches/0011-main-udl-zlib.patch"
    patch_description: "Fix game/main.cpp for C++17: __TIME__/__DATE__ immediately following a string literal are parsed as (reserved) user-defined-literal suffixes, so the build-stamp idiom \" - \"__TIME__\" \"__DATE__ is ill-formed under clang 15 / libc++ -std=c++17; expand them through a BUILD_STAMP_ macro instead. Also #include <zlib.h> explicitly: main.cpp calls zlibVersion() but previously relied on zlib only as a transitive include (host-machine luck); zlib is now a declared Conan requirement"
    patch_type: "portability"
