# 版本级 manifest
# 文件位置: archives/c/criticalmass/1.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0-target-adaptation 规范

# ============================================================
# 必须字段
# ============================================================

version: "1.0.2"
software: "criticalmass"

# 编译状态: built（本地 conan create 全流程通过，2026-09-18；CI 验证后改为 published）
# published | built | failed | archived | pending
status: built

# 构建日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "autotools"

# 顶层测试统计（门禁：test_passed/test_failed 非全零）
test_passed: 1
test_failed: 0

# ============================================================
# 源码信息
# ============================================================

source:
  # SourceForge 官方源对非浏览器 UA 返回 403/HTML 拦截或截断文件（本轮实测），
  # 因此以实测 SHA-256 一致的镜像为第一候选，官方 /download 仅作兜底
  # （conandata.yml 已按此改为 url 列表）。
  url: "https://distfiles.macports.org/criticalmass/CriticalMass-1.0.2.tar.bz2"
  url_fallbacks:
    - "https://ftp.lysator.liu.se/pub/gentoo/distfiles/0f/CriticalMass-1.0.2.tar.bz2"
    - "https://sourceforge.net/projects/criticalmass/files/CriticalMass-1.0.2.tar.bz2/download"

  # 5122126 字节 tarball 实测校验（MD5 e2aff114bffa717fb79c82e1dc473ebe）
  sha256: "846db2d30d39e559612328594084a7aef980169948b2cfaee9fddec8ffdef724"

  # 压缩格式: tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项（双三元组强制 autoconf 交叉模式，绕 conftest 运行探测；
  # --enable-dyngl 使 GL 走 SDL_GL_GetProcAddress 动态解析，OHOS 无 libGL.so）
  configure_options:
    - "--build=x86_64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--enable-dyngl"
    - "SDL_CFLAGS=<-I{...}/include/SDL -I{...}/include (sdl12-compat,sdl-image,sdl-mixer)>"
    - "SDL_LIBS=-L{...}/lib -Wl,-rpath-link,{...}/lib -lSDL-1.2"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sdl12-compat/1.2.68
    - sdl-image/1.2.12
    - sdl-mixer/1.2.12
    - libpng/1.6.58
    - curl/8.15.0.1
    - zlib/1.3.1.1   # 直接依赖: main.cpp zlibVersion()；不再经 libpng/curl 传递侥幸

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-remove-bundled-curl.patch"
  - "0002-png12-to-png16.patch"
  - "0003-sdl-config-compat.patch"
  - "0004-headless-version-exit.patch"
  - "0005-toolchain-cflags.patch"
  - "0006-resource-data-dir.patch"
  - "0007-hashmap-explicit-using.patch"
  - "0008-png16-write-api.patch"
  - "0009-makefile-includes-abs.patch"
  - "0010-packer-const-compare.patch"
  - "0011-main-udl-zlib.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Critical Mass 1.0.2（Critter，Frank Becker）为 SDL 1.2/OpenGL 太空射击（GPL-2+），Autotools 老栈（automake 1.4 era）：configure 3583 行生成物，不重跑 autogen、补丁直接作用于生成物；产物仅 bin_PROGRAMS=critter（bin 内还有 tools/Packer，无运行时用途）；package_type=application"
  - "2012 版 config.guess/config.sub 不识别 aarch64-unknown-linux-ohos；打包 FSF 2024 版到 files/ 并在 configure 前拷入源码根（cheops 先例）；双三元组 --build=x86_64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos 强制交叉模式，跳过 conftest 运行探测（无签名 ELF 在 worker 沙箱无法运行）"
  - "SDL 发现：老栈只有 sdl-config 脚本路径且无 pkg-config 'sdl' 模块；0003 补丁为 configure.in 增加 AC_ARG_VAR(SDL_CFLAGS, SDL_LIBS)，显式传入（sdl-image 先例）；sdl12-compat 头文件在 include/SDL，SDL_image/SDL_mixer 同，编译路径需同时给 include/SDL 与 include"
  - "GL：configure.in 在 TARGET=UNIX 且未禁用时 AC_CHECK_LIB(GL)，OHOS 无 libGL.so → 必传 --enable-dyngl（DYNAMIC_GL 运行时经 SDL_GL_GetProcAddress 解析，上游支持路径）"
  - "data/：resource.dat 由 tools/Packer 从 data/description_file 生成且经 pkgdata_DATA 安装；0006 补丁移除该生成链，改为运行时直接读 $(pkgdatadir)/data（share/Critical_Mass/data/）——6 个子目录（bitmaps/models/sounds/levelpacks/paths/system）非 automake install 目标，package() 手工拷贝；music/lg-criti.xm 仍是 pkgdata_DATA 正常安装"
  - "SourceForge 官方 /download 直连对非浏览器 UA 返回 HTML 拦截页或截断文件（SHA-256 不符），conan get() 必挂；须用实测校验一致的镜像（macports distfiles / gentoo lysator）作为 url 列表首选"
  - "上游无任何测试（无 test/ 目录、无 AC_CONFIG_TESTDIR/TESTS、configure.in 无 check_PROGRAMS）；0004 补丁使 main 在 SDL/GL 初始化前处理 --version（stdout 输出 'Critical_Mass 1.0.2' 后 exit(0)），test_package 以此自建冒烟断言；OHOS ELF 须 package() 内 llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1 自签（julius 先例），否则 test_package 运行报 Operation not permitted"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/cm-official-verify
  source_work_dir: /storage/Users/currentUser/tmp/criticalmass-probe/src/CriticalMass-1.0.2
  source_orig_hash: ""
  source_work_hash: ""
  generated_at: '2026-09-16'
  patches_count: 6

patch_classification:
  - file: 0001-remove-bundled-curl.patch
    type: manual
    platform_only: False
    guard: 'none'   # 移除打包的旧 curl 子树（curl/ 与 SUBDIRS 引用），改由 conan curl 制品满足
  - file: 0002-png12-to-png16.patch
    type: manual
    platform_only: False
    guard: 'none'   # libpng12 → png16（OHOS 只有 png16），纯版本迁移
  - file: 0003-sdl-config-compat.patch
    type: manual
    platform_only: True
    guard: 'AC_ARG_VAR'  # 老栈无 pkg-config/sdl-config 可用；显式 SDL_CFLAGS/SDL_LIBS 覆盖
  - file: 0004-headless-version-exit.patch
    type: manual
    platform_only: True
    guard: 'none'   # 无头环境冒烟验证（--version 在 SDL/GL 初始化前退出）
  - file: 0005-toolchain-cflags.patch
    type: manual
    platform_only: True
    guard: 'none'   # 防止 configure 重置 clang 工具链 CFLAGS/CXXFLAGS
  - file: 0006-resource-data-dir.patch
    type: manual
    platform_only: True
    guard: 'none'   # 跳过 Packer/resource.dat，运行时直读 data/ 目录（OHOS 无打包必要性）

