# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: criticalmass/1.0.2
homepage: "http://criticalmass.sourceforge.net/"

# 上游测试命令 (用于 ctest -N 分析)
# 上游为 Autotools 老栈（automake 1.4 era），configure.in 无 AC_CONFIG_TESTDIR/
# TESTS/check_PROGRAMS，源码树无 test/ 目录 → 上游无任何可注册测试
upstream_check_command: "N/A (上游无测试套件)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "N/A"

# 上游实际运行的测试程序
# 无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "critter --version 冒烟：stdout 断言含 'Critical_Mass 1.0.2' 且退出码 0（0004 补丁在 SDL/GL 初始化前输出后退出，无头环境可跑）"
    command: "critter --version"
    assertions: 1
