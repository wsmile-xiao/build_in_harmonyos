software: cloc
version: 2.08
status: success
build_system: perl
created_at: 2026-04-24
description: Statistics utility to count lines of code
license: GPL-2.0-or-later

# 编译参数（Perl脚本无需configure）
configure_options: []
make_options: []

# 知识沉淀
knowledge_gained:
  - platform: 鸿蒙 date 命令不支持 --date=@timestamp 语法，需手动运行 pod2man 生成 man page
  - dependency: 预编译包需包含 Perl 模块依赖（Regexp::Common, Parallel::ForkManager, Algorithm::Diff）
  - runtime: 需设置 PERL5LIB=$HOME/usr/local/lib/perl5 环境变量

patches_applied: []
build_log: logs/build.log
source_url: https://github.com/AlDanial/cloc/archive/refs/tags/v2.08.tar.gz

# 依赖信息
dependencies:
  runtime:
    - perl >= 5.10.0
    - Regexp::Common
    - Parallel::ForkManager
    - Algorithm::Diff

# 交付物
artifacts:
  - packaging/cloc-2.08-ohos-aarch64.tar.gz (1.4M)
  - packaging/install-cloc-2.08.sh
  - reports/test-report.md
  - reports/quality-report.md
