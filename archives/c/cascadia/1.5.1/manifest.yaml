# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Go CLI 在 OHOS 上构建：沿用 caddy/addchain 的 Go SDK bootstrap + binary-sign-tool ELF 签名 + HMDFS 链接规避（link-out 工作区）模式"
  - "cascadia 主包在仓库根（cascadia_main.go），构建入口为 `go build .`，而非 ./cmd/<name> 子包"
  - "上游版本号硬编码在 cascadia_main.go（version/date 常量），无 -X 注入点，ldflags 仅做 -s -w 裁剪"
  - "上游 piece/GOQR 测试通过 prop_test.go 驱动仓库根 ../cascadia 二进制 + diff 对比 test/*.ref，因此 build() 先把刚构建的二进制暂存到 source_folder/cascadia 再跑 go test，跑完即删"
  - "CGO_ENABLED=0（纯 Go 依赖：goquery/cascadia/mkideal-cli/x-net），OHOS 的 go test 产物仍需 -exec 签名包装器才能 fork/exec"
