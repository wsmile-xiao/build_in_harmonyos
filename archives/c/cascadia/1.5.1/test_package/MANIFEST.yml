# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cascadia/1.5.1
homepage: "https://github.com/suntong/cascadia"

# 上游测试命令 (Go 项目: go test ./...)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
# piece/GOQR 测试经 prop_test.go 驱动仓库根 ../cascadia 二进制 + diff 对比
# test/*.ref；build() 先把刚构建的二进制暂存到 source_folder/cascadia 再跑测试。
upstream_test_command: "go test -v -count=1 ./..."

# 上游实际运行的测试程序 (go test ./... 覆盖的 3 个顶层 Test)
upstream_tests:
  - file: cascadia_test.go
    source: cascadia-1.5.1/cascadia_test.go
    description: "选择器矩阵单元测试 TestSelectors（约 70 组 HTML/selector/期望结果，纯内存断言）"
    command: "go test -run TestSelectors ."
  - file: piece_test.go
    source: cascadia-1.5.1/piece_test.go
    description: "分块抽取测试 TestPiece（Piece raw html 1 例 + Piece Attributes 5 例，经 ../cascadia 二进制 + diff 对比 test/*.ref）"
    command: "go test -run TestPiece ."
  - file: piece_test.go
    source: cascadia-1.5.1/piece_test.go
    description: "GOQR 属性抽取测试 TestPieceGoqr（piece_goqr、piece_goqr_missing 共 2 例，经 ../cascadia 二进制 + diff 对比 test/*.ref）"
    command: "go test -run TestPieceGoqr ."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "端到端冒烟测试: --help 输出含 CSS 说明 + 单元素 CSS 抽取 + ATTR piece 抽取"
    command: "bash test.sh <bin/cascadia>"

# 测试断言总数 (用于质量评估)
assertion_count: 3
