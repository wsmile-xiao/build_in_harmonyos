knowledge_gained:
  - "knowledge_ref: knowledge/drafts/E570-draft-F695.kv — 新增草稿：conan self.run() 在本平台恒 SIGSEGV（test_package 改用 Python subprocess 直启）"
  - "knowledge_ref: knowledge/drafts/E573-draft-7267.kv — 新增草稿：test_package 现场编译消费者程序时 lld 自身依赖 SDK llvm/lib 下的 libxml2.so.16；conan runenv 只导出包目录、musl 命中同名坏条目即硬失败 → 干净 worker 上链接间歇性失败；修复 = 脚本前置工具链 lib 目录 + GNU ld 兜底 + chmod +x 新二进制，并把 LD_LIBRARY_PATH/PATH 由相对 cpp_info 目录改为绝对包目录"
  - "knowledge_ref: knowledge/drafts/E568-draft-D275.kv — 新增草稿：AC_FUNC_MALLOC/AC_FUNC_REALLOC 运行期探针在 OHOS libc 上误判（malloc(0) 合法返回 NULL）→ config.h 定义 malloc=rpl_malloc → 隐式声明 int 截断指针；修复 = 配方向 configure 传 ac_cv_func_malloc_0_nonnull=yes / ac_cv_func_realloc_0_nonnull=yes"
  - "knowledge_ref: knowledge/drafts/E569-draft-FD15.kv — 新增草稿：上游 autotools Makefile.in 写死 in-tree 相对 include 路径（-I../../src/include）在 conan 独立 build 目录下失效 → 配方用 tc.extra_cflags 注入绝对 include 根"
  - "knowledge_ref: knowledge/drafts/E571-draft-BED8.kv — 新增草稿：手写 install-data-local 缺 $(DESTDIR) 且未用 $(srcdir)，conan staging 下装到宿主 /etc（污染构建机、包内缺文件）或 out-of-tree 找不到源文件；cpu 的 0004-doc-Makefile.in.patch 即此形态，可上游化"
  - "knowledge_ref: knowledge/drafts/E572-draft-BD92.kv — 新增草稿：老式 config.guess/config.sub 不识别 HarmonyOS/aarch64；推荐最小补丁（config.guess 在 case 首加 4 行命中分支直接输出 aarch64-unknown-linux-ohos；config.sub 加 maybe_os 白名单与 -linux*) 守卫防 linux→linux-gnu 改写）而非整文件替换（旧法补丁文件 5841 行），两者 triplet 逐字等价、11/11 测试一致"
  - "ref: knowledge/graph/E007.kv — OHOS triplet 识别：config.guess/config.sub 必须感知 HarmonyOS（uname -s）/aarch64，configure 才会得到 aarch64-unknown-linux-ohos；本包按 E572 以最小补丁（+7/-1 行）实现"
  - "ref: knowledge/graph/E046.kv — HMDFS 上 chmod 不生效：生成的 configure 里 umask 077 && mktemp -d 的临时目录非 owner 不可写，直接 patch 生成的 configure 为 umask 022（仓库 581 处先例）"
  - "ref: knowledge/graph/E063.kv — -Werror 放大告警：仅对上游代码在 clang 15 下触发的告警类别降级（configure 与 configure.ac 同步）"
  - "ref: knowledge/graph/E236.kv — libtool .la 跨包不可迁移（libdir 为 //lib、dependency_libs 指向构建期路径）：改用构建目录内私有 prefix（仅 .so 符号链接）+ -DLDAP_DEPRECATED"
  - "ref: knowledge/graph/E522.kv — 依赖库只以 .so 符号链接形式暴露，绕开 .la 的链接期路径（E544 为同题草稿）"
  - "ref: knowledge/graph/E074.kv — HMDFS jobserver fifo EPERM：autotools.make(args=['-j1']) 单作业构建"
  - "ref: knowledge/graph/E490.kv — autotools 脚本可执行位：source() 中对 configure/config.guess/config.sub/install-sh/missing 执行 chmod 0755（部分适配路径只保留内容不保留权限位）"
  - "ref: knowledge/graph/E002.kv — 设备 /tmp 不可写：测试临时文件走测试工作目录/TMPDIR"
  - "ref: knowledge/doc/E416.md — 归档目录名/包名一致性（cpu/1.4.3，小写 slug）"
  - "reference: knowledge/drafts/E568-draft-D275.kv — 本包落地记录：注入 ac_cv_func_malloc_0_nonnull=yes / ac_cv_func_realloc_0_nonnull=yes 后 configure 不再判否，config.h 无 rpl_malloc，不改源码"
  - "reference: knowledge/graph/E522.kv — 插件架构适配：cpu 主程序 dlopen libcpu_<method>.so；本版本 passwd 插件为上游桩实现，配方只启用功能性的 ldap 插件（不传 --enable-developer/--with-flatfile）"

