# test_package/MANIFEST.yml — cpu 1.4.3
#
# 上游测试来源声明。cpu 1.4.3 没有自动化测试用例，因此 test_package 内的
# 11 项适配测试是全部测试内容（详见 version 级 notes.md「测试情况」）。

package: cpu
version: "1.4.3"
build_system: autotools
homepage: "https://cpu.sourceforge.net/"

# 上游检查目标：存在但为空（实测 make check → Nothing to be done for 'check-am'）
upstream_check_command: "make check"
upstream_test_in_build: true          # build() 中已调用 make check
upstream_test_command: "make check"
upstream_tests: []
# 说明：上游随包发布的 doc/test.ldif 是 LDAP 目录数据（需真实服务器导入），
# doc/cpu.conf 是配置样例，二者都不是自动化测试用例。

# 适配测试（test_package/test.sh + test_package/consumer.c）
test_package_tests:
  - file: "test.sh"
    description: "制品内容与 CLI 契约：bin/cpu、lib/libcputil.so、lib/libcpu_ldap.so 存在；--version 报 1.4.3；--help 输出 USAGE: cpu 与 --method="
    command: "bash test.sh"
  - file: "test.sh"
    description: "方法插件加载：-M bogus 反向对照必须在 CPU_loadLibrary 失败；-M ldap（LDAP_URI 指向 127.0.0.1:1）不得出现 CPU_loadLibrary 或 'error loading the ldap library'"
    command: "bash test.sh"
  - file: "consumer.c"
    description: "消费者测试：链接制品 libcputil.so，10 个断言覆盖 Strdup/Free、MD5(\"abc\")、SHA1(\"abc\")、cgetpwent（命中/未命中/uid 解析）"
    command: "./consumer <workdir>"

assertion_count: 11
