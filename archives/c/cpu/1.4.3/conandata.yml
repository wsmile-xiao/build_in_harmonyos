      patch_description: "ldap plugin: same fix in the generated Makefile.in"
      patch_type: "portability"
    - patch_file: "patches/0009-src-plugins-ldap-cat.c.patch"
      patch_description: "cat.c: keep the deprecated ldap_get_values() callers type correct and fix the pointer/literal comparison"
      patch_type: "portability"
    - patch_file: "patches/0010-src-plugins-ldap-commandline.c.patch"
      patch_description: "commandline.c: drop an invalid lvalue cast"
