patches:
  "1.4.3":
    - patch_file: "patches/0001-config.guess.patch"
      patch_description: "config.guess: minimal patch (+3) - case arm for aarch64/arm64 with HarmonyOS/HongMeng printing aarch64-unknown-linux-ohos; replaces the earlier full-file OHOS-aware swap (+1235/-810, 2631-line patch) (E007/E572)"
      patch_type: "portability"
    - patch_file: "patches/0002-config.sub.patch"
      patch_description: "config.sub: minimal patch (+4/-1) - accept *-linux-ohos (maybe_os whitelist) and keep linux-ohos out of the linux->linux-gnu rewrite; replaces the earlier full-file OHOS-aware swap (+1687/-1232, 3210-line patch) (E007/E572)"
      patch_type: "portability"
    - patch_file: "patches/0003-configure.patch"
      patch_description: "configure: umask 077 -> 022 for the sed/mktemp work dir (E046); keep warning classes from -Werror (E063); add linux-ohos* to the shared-library platform table"
      patch_type: "portability"
    - patch_file: "patches/0004-doc-Makefile.in.patch"
      patch_description: "install-data-local: take cpu.conf from $(srcdir) and install under $(DESTDIR) (E571)"
      patch_type: "portability"
    - patch_file: "patches/0005-src-include-conf.h.patch"
      patch_description: "conf.h: use the compiler bool instead of a private typedef int (ABI clash with stdbool.h)"
      patch_type: "portability"
    - patch_file: "patches/0006-src-include-plugins-ldap-ldap.h.patch"
