#  manifest — cpu
#  ARCHIVE-SPEC v2.0

software: cpu
display: "cpu (Change Password Utility)"
description: "LDAP 与本地 passwd/shadow/group 账户管理工具；主程序通过 dlopen 加载 libcpu_<method>.so 后端插件"
category: utility
homepage: "https://cpu.sourceforge.net/"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "E007: config.guess/config.sub 换用 OHOS-aware 版本，configure 得到 aarch64-unknown-linux-ohos"
    - "E046: 生成的 configure 里 sed 临时目录 umask 077 → 022（HMDFS 上 chmod 不生效）"
    - "E063: 仅对上游代码在 clang 15 下触发的告警类别降级 -Werror"
    - "E236/E522: openldap 制品的 .la 跨包不可迁移 → 构建目录内私有 prefix（仅 .so 符号链接）+ -DLDAP_DEPRECATED"
    - "E074: HMDFS jobserver fifo EPERM → make -j1"
    - "libtool 1.4.3 平台表只认 linux-gnu* → 新增 linux-ohos* 且 deplibs_check_method=pass_all，插件才产出共享模块"
    - "插件链接修复：LDADD（对 libtool 模块无效）→ LIBADD，@LBFLAGS@ → -module -avoid-version"
    - "上游缺陷：conf.h 私有 bool 与 <stdbool.h> 冲突；ldap.h globalLdap 缺 extern；hash.c crypt 守卫恒假；cat.c/commandline.c 非法 C"
    - "本版本 passwd 插件为上游桩实现，配方只启用功能性 ldap 插件（不传 --enable-developer/--with-flatfile）"
  common_dependencies:
    - openldap

versions:
  "1.4.3":
    status: built
    build_date: 2026-09-11
    notes: "autotools；12 个补丁；依赖 openldap/2.6.7；上游无自动化测试（make check 为空目标），补充适配测试 11 项全通过（含消费者用例 consumer.c）"
