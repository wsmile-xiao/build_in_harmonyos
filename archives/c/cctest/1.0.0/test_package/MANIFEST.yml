  - file: spec/core/test_result_spec.cc
    source: cctest-1.0/spec/core/test_result_spec.cc
    description: "Test result spec - 8 TEST() cases"
    command: "ctest -R cctest_test_result_spec"
  - file: spec/core/test_desc_spec.cc
    source: cctest-1.0/spec/core/test_desc_spec.cc
    description: "Test desc spec - 11 TEST() cases"
    command: "ctest -R cctest_test_desc_spec"
  - file: spec/core/test_hook_spec.cc
    source: cctest-1.0/spec/core/test_hook_spec.cc
    description: "Test hook spec - 2 TEST() cases"
    command: "ctest -R cctest_test_hook_spec"
  - file: spec/listener/test_collector_spec.cc
    source: cctest-1.0/spec/listener/test_collector_spec.cc
    description: "Test collector spec - 4 TEST() cases"
    command: "ctest -R cctest_test_collector_spec"
  - file: spec/listener/failure_list_spec.cc
