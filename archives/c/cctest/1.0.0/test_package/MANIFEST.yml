    command: "ctest -R cctest_description_spec"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_cctest.cc
    description: "Consumer smoke test: ASSERT_EQ + ASSERT_TRUE via cctest::run_all_tests"
    command: "./test_cctest"

# 测试断言总数 (近似值, 用于质量评估)
# 95 上游 TEST() 用例 + 2 test_package 用例
assertion_count: 97