# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md

package: cctest/1.0.0
homepage: "https://github.com/ccup/cctest"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成：cctest 的 conan create 仅构建库和 test_package，上游 CTest 需单独构建
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（单独 cmake + CCTEST_RUN_TESTS=ON 构建并运行）
upstream_tests:
  - file: spec/auto/stack_spec.cc
    source: cctest-1.0/spec/auto/stack_spec.cc
    description: "Stack spec - 3 TEST() cases"
    command: "ctest -R cctest_stack_spec"
  - file: spec/auto/queue_spec.cc
    source: cctest-1.0/spec/auto/queue_spec.cc
    description: "Queue spec - 3 TEST() cases"
    command: "ctest -R cctest_queue_spec"
  - file: spec/base/string_view_spec.cc
    source: cctest-1.0/spec/base/string_view_spec.cc
    description: "String view spec - 5 TEST() cases"
    command: "ctest -R cctest_string_view_spec"
  - file: spec/base/string_utils_spec.cc
    source: cctest-1.0/spec/base/string_utils_spec.cc
    description: "String utils spec - 1 TEST() case"
    command: "ctest -R cctest_string_utils_spec"
  - file: spec/core/asserter_spec.cc
    source: cctest-1.0/spec/core/asserter_spec.cc
    description: "Asserter spec - 23 TEST() cases"
    command: "ctest -R cctest_asserter_spec"
  - file: spec/core/test_method_spec.cc
    source: cctest-1.0/spec/core/test_method_spec.cc
    description: "Test method spec - 1 TEST() case"
    command: "ctest -R cctest_test_method_spec"
  - file: spec/core/test_case_spec.cc
