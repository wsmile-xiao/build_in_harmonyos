# cnats 版本级 manifest
# 位置: archives/c/cnats/3.13.0/manifest.yaml

version: "3.13.0"
software: "cnats"
status: built
build_date: "2026-09-08"
build_system: "cmake"

source:
  url: "https://github.com/nats-io/nats.c/archive/refs/tags/v3.13.0.tar.gz"
  sha256: "f6ec9ee2ab367594b56dd3265e3561074ade7c3d7410a6f45a77704c5e537024"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DNATS_BUILD_WITH_TLS=ON"
    - "-DNATS_BUILD_EXAMPLES=OFF"
    - "-DNATS_BUILD_STREAMING=OFF"
    - "-DNATS_BUILD_USE_SODIUM=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
  dependencies:
    - "openssl/3.0.16"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "E092 cmake-toolchain：OHOS 映射 CMAKE_SYSTEM_NAME=HarmonyOS 使上游 if(UNIX) 分支失效，toolchain 覆盖为 Linux（sysroot librt.a 可链接 -lrt）"
  - "制品仓 openssl/3.0.16 配方为包级声明（无组件），消费者 cpp_info.requires 必须用 openssl::openssl 包级引用，组件式 openssl::ssl 报 Component not found"
