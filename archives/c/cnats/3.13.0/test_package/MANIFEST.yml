# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cnats/3.13.0
homepage: "https://github.com/nats-io/nats.c"

# 上游测试命令：test/CMakeLists.txt enable_testing() + 对 list_test.txt(324)/
# list_bench.txt(6) 逐项 add_test，即 ctest -N 共 330 个注册测试
upstream_check_command: "ctest -N"

# conanfile.py build() 中未集成上游测试（testsuite 需运行 nats-server 二进制，
# CI 环境无法提供；已在设备真机全量执行，详见 notes.md 与 reports/）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（设备真机，入口 testsuite；逐项 ctest 执行 330 个）
upstream_tests:
  - file: test/test.c
    source: nats.c-3.13.0/test/test.c
    description: "上游 testsuite（test.c+bench.c），CTest 注册 330 个用例（324 功能 + 6 bench）；设备真机 ctest -j1 全量执行，317 Passed / 13 未通过（7 稳定失败 + 5 bench 超时 + 1 复验通过），明细见 notes.md"
    command: "ctest -j1"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package.c
    description: "消费者测试：nats_Open/natsOptions_Create/SetSecure(TLS)/natsConnection_Connect 连接不存在服务器断言返回 NATS_NO_SERVER"
    command: "./consumer"

# 测试断言总数（消费者程序 1 个，含 8 处 API 调用与 3 处返回值断言）
assertion_count: 3
