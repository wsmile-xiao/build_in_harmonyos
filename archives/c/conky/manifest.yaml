software: conky
display: "conky"
description: "轻量级系统监视器，可在桌面显示CPU、内存、磁盘等系统信息"
category: system-monitor
homepage: "https://github.com/brndnmtthws/conky"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "cmake 条件编译缺失：需应用补丁 0001-fix-cmake-conditional-compilation.patch"
    - "getutline 函数缺失：需应用补丁 0002-fix-getutline-missing.patch"
    - "X11/Wayland 初始化缺失：需应用补丁 0003-fix-x11-wayland-init.patch"
    - "依赖 Lua 5.3+ 和 ncursesw"
    - "建议禁用 X11/Wayland/I18N: -DBUILD_X11=OFF -DBUILD_WAYLAND=OFF -DBUILD_I18N=OFF"
  common_dependencies:
    - "lua/5.3.6"
    - "ncursesw/6.4"

versions:
  "1.19.0":
    status: published
    build_date: "2026-05-26"
    published_as: conky
    source_url: "https://github.com/brndnmtthws/conky/archive/refs/tags/v1.19.0.tar.gz"