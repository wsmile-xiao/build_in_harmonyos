software: clusterctl
version: "1.13.2"
status: published
build_date: "2026-06-12"
build_system: go

source:
  url: "https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.13.2/clusterctl-linux-arm64"
  sha256: ""
  tar_format: binary

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "-trimpath"
    - "-ldflags=-X sigs.k8s.io/cluster-api/version.gitVersion=v1.13.2 -X sigs.k8s.io/cluster-api/version.gitMajor=1 -X sigs.k8s.io/cluster-api/version.gitMinor=13 -s -w"
  dependencies:
    - "go/1.26.4"

install:
  prefix: "/storage/Users/currentUser/usr/local"
  dest_dir_mode: true
  binaries:
    - clusterctl
