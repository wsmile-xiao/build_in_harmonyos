# test_package/MANIFEST.yml
# 上游官方测试声明文件，CI L0e 强制要求存在。

package: cpulimit/0.2r4
homepage: "https://github.com/opsengine/cpulimit"

# 上游没有 make check 目标，README 指定直接运行该测试程序。
upstream_check_command: "./tests/process_iterator_test"

# conanfile.py 的 build() 中实际执行上游测试。
upstream_test_in_build: true
upstream_test_command: "./tests/process_iterator_test"

upstream_tests:
  - file: tests/process_iterator_test.c
    source: cpulimit-f4d2682804931e7aea02a869137344bb5452a3cd/tests/process_iterator_test.c
    description: "进程迭代、进程组与 CPU 使用率断言测试"
    command: "./tests/process_iterator_test"
  - file: tests/busy.c
    source: cpulimit-f4d2682804931e7aea02a869137344bb5452a3cd/tests/busy.c
    description: "上游 CPU 负载辅助程序，被回归测试编译"
    command: "./tests/busy"

test_package_tests:
  - file: test.sh
    description: "消费者测试：检查已安装二进制可执行并输出 usage"
    command: "sh test.sh"

assertion_count: 17
