# cfitsio 4.6.4 Precompiled Package Manifest
software: cfitsio
version: 4.6.4
status: published
build_system: cmake
build_method: cmake
compiler: clang 15.0.4
platform: OpenHarmonyOS 4.1.2
build_date: 2026-05-22

dependencies:
  - zlib 1.3.1 (static)

artifacts:
  static_library:
    - lib/libcfitsio.a
  headers:
    - include/fitsio.h
    - include/fitsio2.h
    - include/longnam.h
  utilities:
    - bin/fitscopy
    - bin/fpack
    - bin/funpack
    - bin/imcopy
    - bin/smem
    - bin/speed
    - bin/cookbook

quality_gates:
  G0_clean_build: PASS
  G1_binary_integrity: PASS
  G2_functional: PASS
  G3_portability: PASS
  G4_archive_integrity: PASS

cmake_options:
  - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DCMAKE_C_COMPILER=clang"
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DZLIB_ROOT=/storage/Users/currentUser/usr/local"
  - "-DUSE_CURL=OFF"
  - "-DCMAKE_SYSTEM_NAME=Linux"
  - "-DM_LIB=\"\""

notes:
  - Built using CMake to bypass HMDFS autotools limitations
  - Static library with ZLIB support
  - All utility programs functional