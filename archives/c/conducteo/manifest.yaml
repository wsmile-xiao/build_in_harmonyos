software: conducteo
display: "conducteo"
description: "conducteo — free software for 2D thermal bridges computation (EN 10211 standard), Qt6 GUI"
category: application
homepage: "https://sourceforge.net/projects/conducteo/"
license: GPL-3.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 在 OHOS 下 CMAKE_SYSTEM_NAME=HarmonyOS 且不定义 UNIX 变量：CMakeLists.txt 新增 IS_LINUX_LIKE 归一化判断，替换 5 处 `if (UNIX AND NOT APPLE)` 平台分支。"
    - "QtPrintSupport 裁剪：制品仓 qtbase 的 FEATURE_printsupport=OFF 且无 QtPrintSupport 头文件；源码中 QPrinter 仅 include 零实例化、PDF 导出走 QPdfWriter（QtGui 模块），移除 PrintSupport 组件/链接/冗余 include 零功能损失。"
    - "依赖目标化：uuid/zip/tinyxml/dxflib 裸库名改为 conan CMake 目标（uuid::uuid/libzip::libzip/tinyxml::tinyxml/dxflib::dxflib），dxflib include 补 /dxflib 子目录。"
    - "DebianInstaller.cmake：上游 debian/ 打包文件（desktop/png/xml）不随源码发布，install 加 EXISTS 保护。"
    - "Qt 构建期工具（moc/rcc）在 OHOS 上运行需 libc++_shared.so（SDK llvm/lib/aarch64-linux-ohos），conanfile build() 与 test_package/test.sh 注入 LD_LIBRARY_PATH。"
  common_dependencies:
    - qtbase
    - eigen
    - tinyxml
    - dxflib
    - libzip
    - zlib
    - nlohmann_json
    - uuid

versions:
  "5.0.2":
    status: built
    build_date: "2026-09-09"