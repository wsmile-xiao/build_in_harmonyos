# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: conducteo/5.0.2
homepage: "https://sourceforge.net/projects/conducteo/"

# 上游测试命令: conducteo 是 Qt6 GUI 应用，测试内嵌于主程序
# （菜单/CTRL+SHIFT+V 触发 ValidationsThread → Tests::exec()，18 个测试方法），
# 无独立 ctest 注册（CMake 无 enable_testing/add_test）。
# 适配验证通过独立 test_driver 链接全部编译对象调用 Tests::exec() 无头运行，
# 18/18 全部 PASSED（详见 reports/test-report.md）。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（内嵌于主程序，由 GUI 验证动作触发）
upstream_tests:
  - file: src/tests/Tests.cpp
    source: conducteo-5.0.2/src/tests/Tests.cpp
    description: "Tests::exec() 18 项验证（rotation/translation/scaling/EN10211/EN10077/psi 系数等），GUI 触发（CTRL+SHIFT+V）"
    command: "conducteo（GUI 内验证报告）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "可执行程序冒烟测试：offscreen 平台启动 GUI 事件循环存活 6s（timeout=124 即通过）"
    command: "test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2