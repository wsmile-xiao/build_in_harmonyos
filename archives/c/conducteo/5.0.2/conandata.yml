# conandata.yml — conducteo 5.0.2
# 官方源: SourceForge (https://sourceforge.net/projects/conducteo)
# 源码包: conducteo_5.0.2.orig.tar.gz（SourceForge 官方文件区）
# filename 必填：SourceForge URL 以 /download 结尾，conan get() 无法从扩展名
# 推断压缩格式（否则 BadZipFile），需显式声明文件名（同 armadillo/arpoison 先例）
# 多源 fallback：项目页 URL 302 到动态签名节点，CI Worker 上 27MB 大文件
# 偶发 IncompleteRead 断链；downloads.sourceforge.net 官方直链作为兜底
# （conan 2.x 对 url 列表原生按序 fallback，同 abcselect 先例）

sources:
  url:
    - "https://sourceforge.net/projects/conducteo/files/version%205.0.2/conducteo_5.0.2.orig.tar.gz/download"
    - "https://downloads.sourceforge.net/project/conducteo/version%205.0.2/conducteo_5.0.2.orig.tar.gz"
  filename: "conducteo-5.0.2.tar.gz"
  sha256: "7a336d78eeeb4813af0e5b4c5447163f3fda0b529ce4cb2044fd353147a7f466"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "OHOS 平台判断归一化 + 裁剪未用 QtPrintSupport + 依赖目标化"
    patch_type: "portability"
  - patch_file: "patches/0002-DebianInstaller.cmake.patch"
    patch_description: "install 缺失 debian/ 文件时 EXISTS 保护"
    patch_type: "portability"
  - patch_file: "patches/0003-src-reports-ReportContent.cpp.patch"
    patch_description: "移除未使用的 QtPrintSupport/QPrinter include"
    patch_type: "portability"