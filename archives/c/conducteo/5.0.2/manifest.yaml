# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "CMake 项目在 OHOS（CMAKE_SYSTEM_NAME=HarmonyOS）下 UNIX 变量为 FALSE，`if (UNIX AND NOT APPLE)` 平台分支全部失效，需用 CMAKE_SYSTEM_NAME STREQUAL \"HarmonyOS\" 归一化 IS_LINUX_LIKE"
  - "制品仓 qtbase 的 FEATURE_printsupport=OFF 且无 QtPrintSupport 头文件；仅 include 无实例化的 Qt 模块引用可从 find_package/链接/源码三处裁剪（本例 QPrinter 未使用、PDF 导出走 QPdfWriter/QtGui）"
  - "GUI 应用上游测试内嵌于主程序（QShortcut 触发 ValidationsThread→Tests::exec），无 ctest 注册；可构造独立 test_driver 链接全部编译对象无头运行 Tests::exec() 获取真实报告（有限元求解 en10211Tests 约需 5 分钟+）"
  - "Qt 库（libQt6Core.so）依赖 libc++_shared.so，运行/链接 phase 需要 LD_LIBRARY_PATH 指向 OHOS SDK llvm/lib/aarch64-linux-ohos，否则 rcc/moc 报 Error relocating symbol not found"
  - "cmake_find_mode=none 的 QtBase 包自带 relocatable Qt6Config.cmake，需在 generate() 注入 CMAKE_PREFIX_PATH=<qtbase>/lib/cmake（同 adwaita-qt 先例）"
