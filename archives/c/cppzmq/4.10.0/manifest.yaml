software: cppzmq
version: "4.10.0"
status: published
build_date: "2026-05-26"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/zeromq/cppzmq/archive/refs/tags/v4.10.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCPPZMQ_BUILD_TESTS=OFF"
    - "-DCMAKE_PREFIX_PATH=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"
  dependencies:
    - "zeromq/4.3.5"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "cppzmq is header-only: no binaries, only zmq.hpp and zmq_addon.hpp installed to include/"
  - "PKG_CONFIG_PATH must include $DEFAULT_PREFIX/lib/pkgconfig for cmake to find libzmq"
  - "cppzmq headers install directly to include/, not include/cppzmq/ (upstream default)"
