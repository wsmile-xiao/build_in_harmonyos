# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 未把 install(1) 暴露为独立命令（command -v install 缺失；busybox 1.37 内含 install applet 但无同名入口），上游 `make install` 报 `make: install: No such file or directory` / Error 127；build() 建 busybox install shim 并前置 PATH 可零源码改动解决（knowledge_ref: E429 草稿 knowledge/drafts/chkboot-1.3-ohos-install-shim-for-make-install.kv；同错误面既有条目 E174/E188）"
  - "OHOS 的 /etc 是只读文件系统（mkdir /etc/default → Read-only file system），硬编码 `source /etc/default/chkboot.conf` 的脚本不可用；且变量未定义时 ${A}/${B} 会塌缩成 \"/\"，使 `[[ -s / ]]` 成立 → 误报告警 + cat / 权限错。改 `source \"${CHKBOOT_CONF:-/etc/default/chkboot.conf}\"`（默认值不变）即可（knowledge_ref: E479 草稿 knowledge/drafts/chkboot-1.3-ohos-readonly-etc-config-path-override.kv；同类只读路径陷阱 E002）"
  - "OHOS 无 /bin/bash（bash 由 hnp 提供在 /data/service/hnp/bin/bash），硬编码 shebang `#!/bin/bash` 的脚本执行即 rc=126 bad interpreter；上游同工程其它 5 个脚本已用 /usr/bin/env bash，仅 notification/chkboot-desktopalert 需对齐（knowledge_ref: E165 / E037——/bin/bash 缺失与 shebang 可移植性；E049 硬编码平台路径禁令）"
  - "OHOS 无 zenity/xmessage/systemctl/findmnt/lsblk；chkboot-desktopalert 已自带 -x 探测 → 无后端时干净 exit 1，无需改动（knowledge_ref: E165 之外无对应条目，属平台能力裁剪，不改上游代码）"
  - "OHOS 无 /var/lib（/ 只读），上游默认 CHKBOOT_DATA=/var/lib/chkboot 不可用，须由 CHKBOOT_CONF 指向的自定义配置改到可写目录（knowledge_ref: E002 /tmp 等只读系统路径需显式改到可写位置）"
  - "chkboot 主体 chkboot 有 root 门禁（$UID -ne 0 → rc=1），本机无免密 sudo（sudo -n rc=1）→ 核心 baseline/diff 流程无法在非 root 环境执行，测试用例按 root 门控 SKIP（root 环境会自动执行）（knowledge_ref: 无对应条目；测试环境权限门控记录，见 reports/test-report.md §2）"

