# test_package/MANIFEST.yml — chkboot 1.3
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制存在）
# 详见 docs/TEST_QUALITY_SPEC.md

package: chkboot/1.3
homepage: "https://github.com/grazzolini/chkboot"

# 测试类型：上游无自动化测试套件，本包只有消费者视角测试（test_chkboot.sh）
test_type: "consumer-only"

# ── 上游测试入口清点（R51 第一步，真实命令与原始输出见 reports/test-report.md §1）──
# 上游顶层 Makefile 的 .PHONY 仅 all/install/install-initcpio/install-pacman/install-systemd
# ；all: 为空目标（无编译）；tar 包 19 个条目全部是脚本/配置/文档，无测试文件。
upstream_check_command: "make -n check / make -n test / make -n testall"
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_count: 0
upstream_tests: []

# ── 发行版侧测试入口（上游仓库之外，需真实重启环境，本环境不可执行）──
distro_tests:
  - file: debian/tests/0001-no-changes
    suite: "Debian autopkgtest (Testsuite: autopkgtest, debian/tests/control)"
    restrictions: "isolation-machine, needs-root, breaks-testbed, needs-reboot"
    scenario: "重启后无变更 → chkboot-check 期望 rc=0"
  - file: debian/tests/0002-ack-changes
    suite: "Debian autopkgtest"
    restrictions: "isolation-machine, needs-root, breaks-testbed, needs-reboot"
    scenario: "新增 /boot/new 后 chkboot -u 确认 → 重启后无告警"
  - file: debian/tests/0003-unack-changes
    suite: "Debian autopkgtest"
    restrictions: "isolation-machine, needs-root, breaks-testbed, needs-reboot"
    scenario: "新增文件未确认 → 重启后 chkboot-check 期望 rc=1"
  - file: debian/tests/0004-kernel-update
    suite: "Debian autopkgtest"
    restrictions: "isolation-machine, needs-root, breaks-testbed, needs-reboot"
    scenario: "apt 重装 linux-image 后变更被钩子确认 → 无告警"
upstream_test_modification: |
  无 —— 上游无测试文件可改；上述 4 个发行版用例在 test_chkboot.sh 中以“场景等价移植”
  方式实现（不修改上游任何文件，仅用临时 BOOTDIR/CHKBOOT_DATA 复现其断言）：
  dist-0001 / dist-0002 / dist-0003 / dist-0004。
upstream_test_exemption: |
  dist-0004 需 apt + 真实 /boot 分区 + 重启，OHOS 不具备 → 套件内 SKIP 并打印具体原因；
  dist-0002 需 root（上游 chkboot 有 root 门禁），非 root 环境 SKIP，root 环境下会实际执行。

# ── 消费者测试（test_package/test_chkboot.sh，10 用例）──
test_package_tests:
  - name: pkg-layout-bin-and-conf
    file: test_chkboot.sh
    description: "bin/ 三个可执行文件可执行 + res/default/chkboot.conf 存在"
    command: "bash test_chkboot.sh <package_folder>"
  - name: pkg-layout-boot-integration-assets
    file: test_chkboot.sh
    description: "profile.d / systemd / initcpio / libalpm-hooks 资产随包齐全"
  - name: ohos-script-syntax-all
    file: test_chkboot.sh
    description: "6 个 shell 脚本在 OHOS bash 5.3 下 bash -n 全部通过（鸿蒙特有用例）"
  - name: dist-0001-no-changes
    file: test_chkboot.sh
    description: "无告警文件 → chkboot-check rc=0（等价 Debian autopkgtest 0001）"
  - name: dist-0003-unack-changes
    file: test_chkboot.sh
    description: "存在未确认变更 → rc=1 且告警正文含变更文件与 sha512（等价 0003）"
  - name: dist-0002-ack-changes
    file: test_chkboot.sh
    description: "baseline→变更→chkboot -u 确认→告警消失（等价 0002；需 root，非 root 时 SKIP）"
  - name: dist-0004-kernel-update
    file: test_chkboot.sh
    description: "apt 重装 linux-image 场景（等价 0004；OHOS 无 apt/无可访问 /boot → SKIP）"
  - name: ohos-conf-from-package-env
    file: test_chkboot.sh
    description: "conanrun 注入的 CHKBOOT_CONF 生效：rc=0 且无误报 / 无路径错误（鸿蒙特有用例）"
  - name: ohos-conf-override-required
    file: test_chkboot.sh
    description: "缺 CHKBOOT_CONF 时回落硬编码 /etc/default/chkboot.conf（只读 /etc）→ 误报，证明覆盖必要（鸿蒙特有用例）"
  - name: ohos-desktopalert-degradation
    file: test_chkboot.sh
    description: "无 zenity/xmessage 时通知前端干净退出 rc=1，无命令缺失报错（鸿蒙特有用例）"

# 断言总数（test_chkboot.sh 内的实际校验点计数）
assertion_count: 32

notes: |
  1) 上游 chkboot/1.3 无自动化测试套件（Makefile 无 test/check 目标，tar 包 19 条目
     无测试文件）——清点命令与原始输出见 reports/test-report.md §1；
  2) 发行版侧唯一测试入口是 Debian autopkgtest 4 用例，均带
     needs-root/needs-reboot/isolation-machine，本环境无法原样运行（原因逐项记录）；
  3) 本套件对已安装包执行（env="conanrun"），因此同时满足 CI L1e 的
     “破坏性反向验证”：移走包内 bin/ 后套件必然失败（用例 1 直接检查 bin/ 可执行文件）。
