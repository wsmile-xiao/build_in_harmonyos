name: cubicsdr
version: "0.2.7"
software: cubicsdr
status: in_progress
build_system: cmake

source:
  url: "https://github.com/cjcliffe/CubicSDR/archive/refs/tags/0.2.7.tar.gz"
  sha256: "790f851e08f1068081a8593dfd4a149c7414e7d70c1f5cafd287331df493b811"
  tar_format: tar.gz

build:
  system: cmake-generated-core-project
  configure_options:
    - "ENABLE_DIGITAL_LAB=0 (upstream default; the Digital Lab console is a wxWidgets GUI)"
    - "standalone core CMakeLists generated in source tree under core-build/ (upstream top-level CMakeLists hard-requires GLX OpenGL + wxCore GUI, unavailable on OHOS PC)"
  dependencies:
    - "liquid-dsp/1.8.2"

patches_applied:
  - "0001-guard-outstream-under-digital-lab.patch"

validation:
  upstream_tests: "N/A: upstream 0.2.7 ships no CTest/add_test registration (grep verified empty; travis-ci only builds and runs the GUI application binary); per-layer testability declared in reports/upstream-tests.md"
  consumer_tests: "PASS: 11/11 assertions ALL PASS on OHOS PC aarch64 (factory registry 21 modes; FM/AM/USB demodulation loops with Goertzel tone detection; BPSK digital chain; SoapySDR no-hardware enumeration)"
  source_syntax: "PASS: conan create builds package + test_package cleanly"
  cmake_export: "PASS: cubicsdr-coreConfig.cmake + cubicsdr-core::cubicsdr-core target"
  target_w3: "PASS: local conan create green (2026-09-20)"
  platform_ci: "pending"

notes:
  - "C-class challenge deliverable: layered core-library cut. libcubicsdr-core.a = modem engine (35 upstream compilation units verbatim) + IOThread framework + DataTree + vendored tinyxml/rtaudio(dummy)."
  - "GUI front-end / demod orchestration (src/demod, 26 wxGetApp sites) / SDR device threads (src/sdr, 37 wxGetApp sites) declared out of scope: no wxCore GUI (published wxwidgets 3.3.3 is wxBase non-GUI variant) and no desktop GL immediate mode on OHOS PC (nm-verified)."
  - "Upstream defect fixed by 0001: ModemFSK/ModemGMSK reference the ENABLE_DIGITAL_LAB-gated outStream member unconditionally, so the upstream LAB=0 default never compiled these files."
  - "OHOS clang-15 libc++ weak-symbol hazard: std::stringstream members inside the static library trigger invalid free at exit (ASan-verified); LAB=0 keeps stringstream out of the library."
  - "SoapySDR no-hardware form (enumerate returns empty list) characterised in test_package — OHOS PC has no RTL-SDR/USRP/BladeRF hardware and no vendor modules."
