# test_package/MANIFEST.yml
# 上游官方测试与包消费检查声明
package: cubicsdr/0.2.7
homepage: "https://www.cubicsdr.com"

# 上游 CubicSDR 0.2.7 无 CTest/add_test 注册（tag 源码 grep
# "add_test|enable_testing|BUILD_TESTING" 为空；travis-ci/build_cubicsdr.sh
# 只构建并运行 GUI 应用二进制）。上游可测面 = 应用手动运行，无自动化测试
# 套件；详见 reports/upstream-tests.md 逐文件定性。
upstream_check_command: "grep -r 'add_test|enable_testing' . || echo 'no test registration upstream'"
upstream_test_in_build: false
upstream_test_command: "echo 'upstream ships no automated test suite'"

upstream_tests: []

# test_package 自带的消费者视角检查（DSP 算法闭环真测试 + SDR 无硬件形态定性）
test_package_tests:
  - file: test_package.cpp
    description: "Modem factory registry: 21 upstream-registered modes (analog 9 + digital 12) all instantiate via makeModem"
    command: "./test_cubicsdr_core"
  - file: test_package.cpp
    description: "FM demodulation loop: liquid freqmod synthesise -> CubicSDR ModemFM demodulate() -> 1 kHz tone detected (Goertzel, amp ratio 816x)"
    command: "./test_cubicsdr_core"
  - file: test_package.cpp
    description: "AM demodulation loop: envelope tone 800 Hz detected (ratio 206x)"
    command: "./test_cubicsdr_core"
  - file: test_package.cpp
    description: "USB demodulation loop: upper-sideband analytic tone 4 kHz detected (ratio 3179x)"
    command: "./test_cubicsdr_core"
  - file: test_package.cpp
    description: "BPSK digital modem chain smoke: liquid modemcf -> ModemBPSK demodulate() completes; clean process exit (OHOS libc++ weak-symbol hazard mitigated via ENABLE_DIGITAL_LAB=0)"
    command: "./test_cubicsdr_core"
  - file: test_package.cpp
    description: "SoapySDR no-hardware enumeration: empty device list, zero modules, no crash (documented OHOS PC form)"
    command: "./test_cubicsdr_core"

# 上游注册测试数为 0（无 CTest 注册）；消费者测试 6 项 / 11 断言（上表）。
upstream_test_count: 0
test_package_test_count: 6
assertion_count: 11
