knowledge_gained:
  - "autotools config.status 在 HMDFS 上需要 umask 002 替代 umask 077"
  - "aarch64 平台需要在 chm_lib.c 中添加 __aarch64__ 类型定义分支"
  - "config.guess 需要 echo+exit 0 格式而非 GUESS= 格式（避免创建临时文件）"
  - "OHOS SDK ld.lld 需要 libxml2.so.16（不可用），需要 -B 标志指向 GNU ld 目录绕过"
  - "新编译的 ELF 二进制需要签名才能执行，CC wrapper 自动签名解决 configure 测试"

