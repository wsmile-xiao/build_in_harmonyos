# test_package/MANIFEST.yml
# Upstream test declaration file.
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: compface/1.5.2
homepage: "http://freecode.com/projects/compface"

# Upstream test command analysis: Makefile.in defines only `all` (plus
# install/clean/dist targets); there is no `check`/`test` target and no
# testsuite directory in compface-1.5.2 — upstream ships no automated tests.
upstream_check_command: ""

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs actually run
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_compface.sh
    description: "X-Face roundtrip: compression format check, lossless inverse (byte-identical), XBM export (-X), deterministic recompression"
    command: "conan test"

# Approximate assertion count for quality assessment
# (4 consumer checks; upstream static test count is 0)
assertion_count: 4
