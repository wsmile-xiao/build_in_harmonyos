software: cctz
# 版本级 manifest
# 文件位置: archives/c/cctz/2.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2.5"
status: published
build_date: "2026-06-02"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/google/cctz/archive/refs/tags/v2.5.tar.gz"
  sha256: "47d2d68e7cb5af3296dc7e69b0f4a765589f1b2f4af4b9c42e772414c428b421"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_EXAMPLES=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "cmake 项目在鸿蒙平台需设置 BUILD_TESTING=OFF 以绕过 GTest/GMock 缺失问题"
  - "CMake 'System is unknown' 警告对 HarmonyOS 不影响编译和运行，属于非致命提示"
  - "鸿蒙平台缺少 /usr/share/zoneinfo 导致非UTC时区加载失败，属于平台限制"

# ============================================================
# 产物清单
# ============================================================

products:
  binaries:
    - path: bin/time_tool
      type: ELF executable
      description: "时区信息查询工具"
  libraries:
    - path: lib/libcctz.a
      type: static library
      description: "C++ 时区库（静态链接版）"
  headers:
    - path: include/cctz/time_zone.h
      description: "时区转换主接口"
    - path: include/cctz/civil_time.h
      description: "民用时间接口"
    - path: include/cctz/civil_time_detail.h
      description: "民用时间实现细节"
    - path: include/cctz/zone_info_source.h
      description: "时区数据源接口"
  cmake_config:
    - path: lib/cmake/cctz/cctz-config.cmake
      description: "find_package(cctz) 支持"
    - path: lib/cmake/cctz/cctz-targets.cmake
      description: "导入目标定义"
    - path: lib/cmake/cctz/cctz-targets-release.cmake
      description: "Release 配置导入"

# ============================================================
# 测试结果
# ============================================================

test_result:
  official_test_suite: "未执行（BUILD_TESTING=OFF，GTest/GMock 缺失）"
  functional_test: "10项全通过（civil_time创建/运算/转换/格式化/解析/链接性验证）"
  platform_warnings:
    - "localtime 时区加载失败（缺少 /usr/share/zoneinfo）"
    - "Asia/Shanghai 时区不可识别"
  total_pass: 10
  total_fail: 0
  total_warn: 1