# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ctpl/0.3.5
homepage: "https://ctpl.tuxfamily.org/"

# 上游测试存在性审计（hmbs 硬门禁要求；上游确有测试，已接入并在真机执行）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 ctpl 0.3.5 存在 automake 自动化测试套件，已接入并在
  OHOS 真机 make check 完整执行（TESTS 4 条目；parsing-tests 内含 20 个模板用例）。
  1. testsuite/Makefile.am 注册 TESTS = parsing-tests、float-test、
     read-number-test 三个 check_PROGRAMS，以及 tests.sh（BUILD_CTPL 启用 CLI
     工具时为 dist_check_SCRIPTS，否则为 EXTRA_SCRIPTS 不执行）。
  2. parsing-tests.c 遍历 testsuite/success/（14 个模板）与 testsuite/fail/
     （6 个模板），以 testsuite/environ 为环境逐个解析并比对 -output 期望输出，
     成功/失败语义分别断言；float-test.c 穷举浮点格式化用例；
     read-number-test.c 覆盖数字解析；tests.sh 用 CLI 工具复跑 success/fail 全集。
  3. 运行方式：conanfile.py build() 就地 configure/make 后 make check -j1，
     解析各 test-suite.log 的 automake 汇总行（# TOTAL/# PASS/# FAIL/# SKIP，
     兼顾 XFAIL/XPASS/ERROR），校验 testsuite/success 参照文件非空，失败即阻断
     构建；结果持久化为包内 res/upstream_test_result.json，test_package 阶段
     读取并裸 print 输出 HMBS_UPSTREAM_TEST_RESULT 标记。

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游实际运行的测试程序
upstream_tests:
  - file: testsuite/parsing-tests.c
    source: "ctpl-0.3.5/testsuite/parsing-tests.c"
    description: "模板解析主测试：遍历 success/ 14 个模板与 fail/ 6 个模板并比对期望输出"
    command: "make check"
  - file: testsuite/float-test.c
    source: "ctpl-0.3.5/testsuite/float-test.c"
    description: "浮点格式化穷举测试（float_string 生成值与 CTPL 输出逐字比对）"
    command: "make check"
  - file: testsuite/read-number-test.c
    source: "ctpl-0.3.5/testsuite/read-number-test.c"
    description: "数字字面量解析测试（十进制/十六进制/八进制/二进制/浮点）"
    command: "make check"
  - file: testsuite/tests.sh
    source: "ctpl-0.3.5/testsuite/tests.sh"
    description: "CLI 工具复跑 success/fail 全集（BUILD_CTPL 启用时执行）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "3 个真实用例：模板替换端到端、environ push/lookup API、未知符号错误路径"
    command: "ctest + ./test_ctpl"

# 测试断言总数 (近似值)
# 上游 TESTS 4 条目（内含 parsing-tests 20 个模板用例 + 浮点/数字用例）；test_package 3 条消费者断言
assertion_count: 27

# 测试套件覆盖说明
test_suite_gaps:
  integration: "上游 testsuite 已覆盖模板解析全集与 CLI 复跑；test_package 以消费者视角补足库链接与公共 API 调用验证"
