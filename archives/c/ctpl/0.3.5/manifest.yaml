# 版本级 manifest — ctpl 0.3.5
software: ctpl
version: "0.3.5"
status: built
build_date: "2026-09-12"
build_system: autotools

source:
  url: "https://download.tuxfamily.org/ctpl/releases/ctpl-0.3.5.tar.gz"
  sha256: "21108fc7567ed216deea4591adbfece8e88b1f4bb1ca77c37400920644d756be"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
