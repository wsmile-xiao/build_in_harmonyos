    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - glib/2.88.0
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "官方 release tarball 自带 configure/Makefile.in，直用 official URL；GitHub tag 包无生成文件需 autoreconf，不采用"
  - "TESTS=parsing-tests/float-test/read-number-test(+tests.sh when CLI)；parsing-tests 内含 success/14 + fail/6 模板用例"
