# 软件级 manifest
software: ctpl
display: "CTPL"
description: "C Template Parser Library — C 语言模板解析引擎库"
category: library
homepage: "https://ctpl.tuxfamily.org/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "官方 release tarball 自带 configure/Makefile.in，直接 configure，无需 autoreconf"
    - "config.guess 不识 OHOS，固定 --build/--host=aarch64-unknown-linux-gnu 绕过探测"
    - "硬依赖 glib-2.0/gio-2.0（CLI 另需 gio-unix-2.0），经 PkgConfigDeps + pkgconf 满足"
    - "glib 依赖图需 zlib/1.3.1.1 override 锁定 OHOS 专用版本"
  common_dependencies:
    - glib

versions:
  "0.3.5":
    status: built
    build_date: "2026-09-12"
    published_as: ctpl
    source_url: "https://download.tuxfamily.org/ctpl/releases/ctpl-0.3.5.tar.gz"
