# test_package/MANIFEST.yml
# Upstream test declaration for cpp-jwt 1.5.1.

package: cpp-jwt/1.5.1
homepage: "https://github.com/arun11299/cpp-jwt"

upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: tests/test_jwt_object.cc
    source: cpp-jwt-1.5.1/tests/test_jwt_object.cc
    description: "GTest object API test (1 TEST)"
    command: "./test_jwt_object"
  - file: tests/test_jwt_encode.cc
    source: cpp-jwt-1.5.1/tests/test_jwt_encode.cc
    description: "GTest encode tests (13 TESTs)"
    command: "./test_jwt_encode"
  - file: tests/test_jwt_decode.cc
    source: cpp-jwt-1.5.1/tests/test_jwt_decode.cc
    description: "GTest decode tests incl. algo-confusion check (12 TESTs)"
    command: "./test_jwt_decode"
  - file: tests/test_jwt_decode_verifiy.cc
    source: cpp-jwt-1.5.1/tests/test_jwt_decode_verifiy.cc
    description: "GTest decode+verify tests with error codes (12 TESTs)"
    command: "./test_jwt_decode_verifiy"
  - file: tests/test_jwt_decode_verifiy_with_exception.cc
    source: cpp-jwt-1.5.1/tests/test_jwt_decode_verifiy_with_exception.cc
    description: "GTest decode+verify tests with exceptions (13 TESTs)"
    command: "./test_jwt_decode_verifiy_with_exception"
  - file: tests/test_jwt_rsa.cc
    source: cpp-jwt-1.5.1/tests/test_jwt_rsa.cc
    description: "GTest RSA sign/verify tests with bundled certs (4 TESTs)"
    command: "./test_jwt_rsa"
  - file: tests/test_jwt_es.cc
    source: cpp-jwt-1.5.1/tests/test_jwt_es.cc
    description: "GTest ECDSA sign/verify tests with bundled certs (4 TESTs)"
    command: "./test_jwt_es"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer test: HS256 sign+verify round-trip, wrong-key rejection"
    command: "./test_cpp-jwt"
  - file: ohos_adapt_test.cpp
    description: "OHOS test: arch check, none/HS384/HS512, claims, expiry path"
    command: "./ohos_adapt_test"

assertion_count: 22
