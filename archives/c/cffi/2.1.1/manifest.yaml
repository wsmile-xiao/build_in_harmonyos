# 兼容性
# ============================================================

compatibility:
  level: high
  issues:
    - "testing/cffi1/test_verify1.py::test_verify_dlopen_flags：OHOS 加载器不做 RTLD_GLOBAL 全局符号传播（纯 ctypes 探针实测复现），平台能力限制，配方内探针判定后 deselect"
  notes: |
    C 扩展本体在 OHOS aarch64 上编译、签名、dlopen、回调、结构体、ABI 调用
    全部正常（消费者测试 23/23）。唯一未通过项是**平台能力限制**，非库缺陷：

    · RTLD_GLOBAL 传播：`ctypes.CDLL(liba, mode=RTLD_GLOBAL)` 载入的库，其导出
      符号无法被之后载入的另一个库解析（实测 libb.so `probe_sym_a: symbol
      not found`），与 musl 的 dlopen 作用域语义相关。配方用 `_rtld_global_propagates()`
      **先探针实测**，仅在确认平台不支持时才 deselect 该用例——平台放开后自动恢复。

    测试环境适配（非源码补丁）共 6 处，详见 notes.md 问题表。

