# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 的 hnp CPython 里 subprocess 走 os.posix_spawn()（非 posix_spawnp），对裸名命令不做 PATH 搜索——即使造了 cc→clang 的 PATH shim 也无效；须按 pillow 10.4.0 先例在测试进程注入 sitecustomize 补丁 subprocess.Popen.__init__，用 shutil.which 解析裸名后再 exec。E405 已给出调用方改写类修法（绝对路径/shell=True/which），本条补的是**调用方不归你掌控**的场合（distutils 硬编码 ['cc']、第三方库内部 Popen），故用进程内补丁而非改调用方 (ref: E405)"
  - "musl 不从主可执行文件导出 Python 符号，故『测试运行期现场编译』的 C 扩展（cffi verify/recompile 会编上百个）必须显式 -lpython3.12，否则 dlopen 报 PyImport_ImportModule: symbol not found；而宿主解释器的 sysconfig LDSHARED 不带该标志，需在测试环境补 LDFLAGS。本条**非新知**：E004 已载同一机制（musl BIND_NOW + 扩展 NEEDED 无 libpython → 改 LDSHARED 加 -lpython）；本包是其变体——修的不是 Python 自身的 LDSHARED（不可改），而是**测试进程内**为现场编译补 LDFLAGS（实测 134 项 ImportError → 0）(ref: E004)"
  - "OHOS 加载器不做 RTLD_GLOBAL 全局符号传播：以 RTLD_GLOBAL 载入的库，其符号无法被之后载入的库解析（纯 ctypes 探针实测 libb.so symbol not found）；依赖该语义的用例属平台能力限制，应先探针实测再 deselect，不写死跳过。本条**非新知**：DRAFT-corrade-2020.06-ohos-cmake-plugin-shared-linking 已载明 musl 加载器的符号查找范围仅自身 DT_NEEDED 链、不含主程序已加载库的全局作用域（与 glibc 不同）；本包是该结论在『上游用例把它当默认行为来断言』场景下的落地（探针实测 + 按需 deselect）(ref: DRAFT-corrade-2020.06-ohos-cmake-plugin-shared-linking)"
  - "setuptools 引导目录**不能放进测试 PYTHONPATH**：PYTHONPATH 条目不会执行其 .pth（distutils-precedence.pth），于是子进程只有 setuptools 顶层包而无 distutils shim，嵌套 venv 里的 distutils 构建仍报 No module named 'distutils'；正确做法是让子环境各自 pip 装 setuptools（实测该坑：zintegration 7 项 ERROR → 8 passed）。已沉淀为独立条目，全库此前无覆盖 (ref: DRAFT-ohos-pythonpath-entry-skips-pth)"
  - "OHOS 无 /sbin/ldconfig 且无 gcc，ctypes.util.find_library('m'/'dl') 恒返回 None（E068），而 libm.so/libdl.so 实际可 dlopen；cffi 的 ffi.dlopen('m') 正是走 find_library，故测试环境需按 soname 回退探测（实测该回退让 24+2 项由失败转通过）"
  - "用宿主解释器跑 Python 包的编译型测试时，必须把 conan python 依赖的 lib 从 LD_LIBRARY_PATH 剔除（否则宿主解释器身份被 conan 版 libpython 翻转：sys.platform 由 ohos 变 linux，sysconfig 去找按 conan 编译平台拼出的 _sysconfigdata__linux_* → sysconfig.get_config_var 抛 ModuleNotFoundError）；但 embedding 类用例又需要宿主 libpython 在 LD_LIBRARY_PATH 上（否则其生成的可执行文件 exit 127），故须先剔除 conan 版、再前置宿主 LIBDIR，二者分别处理。已沉淀为独立条目，全库此前无覆盖 (ref: DRAFT-ohos-conan-libpython-hijacks-host-interpreter)"

