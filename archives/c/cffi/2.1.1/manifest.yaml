# ============================================================
# 软件识别（同名不同上游，务必区分！）
# ============================================================

software_identity:
  note: |
    ⚠️ **本仓有两个不相关的上游都叫 "cffi"**，仅版本号不同：
      · cffi/0.24.1 —— `github.com/cffi/cffi`，Common Lisp 的 FFI 库
        （ASDF 构建，package_type=header-library，早在 ohpcd 发布）
      · cffi/2.1.1 —— **本包**，`github.com/python-cffi/cffi`，Python 的
        C Foreign Function Interface（C 扩展 + libffi，package_type=library）
    两者同名不同物、无任何代码关系。Conan 引用始终带版本，故
    `cffi/2.1.1` 与 `cffi/0.24.1` 不会互相解析到；下游 `conan install`
    必须显式指定版本。
    之所以仍沿用 `cffi`（而非改名 `python-cffi`）：PyPI 上的分发包名就是
    `cffi`，改名会与上游包名不一致；且仓内已有 50 个包名对应多个 homepage
    的并存先例（版本号即区分手段）。若维护者倾向与 `cairo`/`python-cairo`、
    `glib`/`pygobject` 的命名惯例对齐，可改名为 `python-cffi`（需同时改
    目录名与配方 `name`，以过 PF8 slug 闸）。

homepage_actual: "https://github.com/python-cffi/cffi"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "python/3.12.9"
    - "libffi/3.5.2"
    - "pycparser/3.0"
  optional: []
  note: |
    · python/3.12.9 —— Python.h + libpython3.12.so（链接期必需：musl 不从主
      可执行文件导出 Python 符号，只链接会得到"链接成功但 import 失败"的模块）。
    · libffi/3.5.2 —— `_cffi_backend` 的唯一外部链接依赖（setup.py
      `libraries = ['ffi']`）。ohpcd 制品为 static-library，自带 ffi.h、
      libffi.a 与 lib/pkgconfig/libffi.pc（实测）。
    · pycparser/3.0 —— 运行期依赖（pyproject.toml:
      `dependencies = ["pycparser; implementation_name != 'PyPy'"]`）；
      cffi/cparser.py 在运行期 `import pycparser`，故消费者必须能拿到它。

    **package_type=library 的原因**：conan 禁止 python-require 依赖带类型的库
      ERROR: Package 'cffi/2.1.1' with type 'python-require' cannot have a
             'static-library' dependency to 'libffi/3.5.2'
    libffi 为 static-library、python 为 library，故声明 library + shared 选项
    （与 psutil 7.2.2 / lxml 6.1.1 一致）。

    构建期 setuptools（>=77.0.3，pyproject build-backend=setuptools.build_meta）
    **未发布到 ohpcd**（实测 `conan list setuptools/* -r=ohpcd` = 0 条），
    按 PF4 不写成 tool_requires，改为构建期从平台 pip 镜像引导（pillow 先例）。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    上游为 src 布局（src/cffi 纯 Python 层、src/c/_cffi_backend.c C 扩展）。
    build() 走 `setup.py build_ext --inplace`（与仓内 psutil/lxml/pillow 同款），
    显式注入 CFLAGS（Python.h + ffi.h）与 LDFLAGS（-lpython3.12 -lffi
    -fuse-ld=bfd），产物 `_cffi_backend*.so` 落 `<source_folder>/src/`
    （distutils 的 --inplace 依 `package_dir={"": "src"}` 拷到 cwd 下的 src/）。

    **必须签名**：OHOS 要求 dlopen 的 .so 带 .codesign 段，否则
    `ImportError: ... Permission denied`（实测未签名时报此错）。build 期与
    package 期各签一次（conan 的 copy() 会使既有签名失效）。

