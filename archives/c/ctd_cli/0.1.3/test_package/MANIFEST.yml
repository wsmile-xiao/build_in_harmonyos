# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ctd_cli/0.1.3
homepage: "https://gitlab.com/slavic-demons/korgorusze/compile_time_defined_cli"

# 上游测试命令 (cmake + ctest，需先启用 CTD_CLI_TEST_BUILD)
upstream_check_command: "cmake -DCTD_CLI_TEST_BUILD=ON .. && cmake --build . && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（GoogleTest 单元测试，共 16 个独立 TEST_CASE）
upstream_tests:
  - file: tests/unit_tests/command_line_interface_test/command_line_interface_test.cpp
    source: ctd_cli-0.1.3/tests/unit_tests/command_line_interface_test/command_line_interface_test.cpp
    description: "CLI 解析功能单元测试（11 个用例：Argparse/CliWithHandlers/CliWithHandlersBiggerExample/HelpTest/CustomDeserialize/ArgumentSetHandlerTests/NamedArgumentSetHandlerTests/FlagSetHandlerTests/CommandSetHandlerTests/ArgumentsPasingTests/AllowThrowingFromHandlers）"
    command: "./command_line_interface_test"
  - file: tests/unit_tests/command_line_interface_test/cli_status_test.cpp
    source: ctd_cli-0.1.3/tests/unit_tests/command_line_interface_test/cli_status_test.cpp
    description: "CliStatus 状态码测试（4 个用例：StatusAsString/CauseTests/RenderingFeedback/CreatingFromHandlerStatus）"
    command: "./cli_status_test"
  - file: tests/unit_tests/function_test/function_test.cpp
    source: ctd_cli-0.1.3/tests/unit_tests/function_test/function_test.cpp
    description: "Function 小型 callable 容器测试（1 个用例：UsageTest）"
    command: "./function_test"

# test_package 中自带的测试 (消费者视角验证 + 鸿蒙专项)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：模拟上层业务组件，仅经公开头文件/API 使用三方库（子命令/具名参数/标志/位置参数/错误路径）"
    command: "./test_ctd_cli"
  - file: ohos_specific_test.cpp
    description: "鸿蒙专项测试：UTF-8（中文）命令行参数解析、argv 风格长短标志、缺参错误枚举、空输入不崩溃"
    command: "./test_ohos_specific"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16