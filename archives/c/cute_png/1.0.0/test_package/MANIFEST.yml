# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: cute_png/1.0.0
homepage: https://github.com/RandyGaul/cute_headers

# 上游测试: cute_png 是单头文件 PNG 库，上游仓库无独立测试套件
# （cute_headers 无 test/ 目录、无 CI 测试脚本；头文件为 header-only，
#   通过 TINYDEFLATE_IMPL / CUTE_PNG_IMPLEMENTATION 宏在一个编译单元中展开，
#   官方示例位于 examples_cute_png/，非独立可运行测试入口）
upstream_check_command: ""   # 上游无测试入口
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试（消费者视角验证鸿蒙平台可编译可运行）
test_package_tests:
  - file: test_cute_png.c
    description: "直接调用 cute_png 1.0.0 公开 API（tdLoadPNGMem 解码 1x1 红色 PNG）并断言尺寸与像素值"
    command: "clang -std=c99 -DTINYDEFLATE_IMPL test_cute_png.c && ./test_cute_png"

# 测试断言总数 (test_package 4 项)
assertion_count: 4
