package: cattle/1.4.0
homepage: "https://kiyuko.org/software/cattle"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check; tests/buffer; tests/interpreter; tests/program; tests/references; tests/tape"
upstream_tests:
  - file: tests/buffer.c
    description: "Upstream CattleBuffer unit tests"
  - file: tests/interpreter.c
    description: "Upstream CattleInterpreter unit tests"
  - file: tests/program.c
    description: "Upstream program loading unit tests"
  - file: tests/references.c
    description: "Upstream GObject reference tests"
  - file: tests/tape.c
    description: "Upstream CattleTape unit tests"

test_package_tests:
  - file: test_cattle.c
    description: "Consumer loads a valid Brainfuck program and verifies malformed input is rejected"
    command: "test_cattle"

assertion_count: 5
