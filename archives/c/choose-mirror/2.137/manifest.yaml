# manifest.yaml — choose-mirror 2.137

version: "2.137"
software: "choose-mirror"
status: built
build_date: "2026-09-12"
build_system: makefile

source:
  url: "https://deb.debian.org/debian/pool/main/c/choose-mirror/choose-mirror_2.137.tar.xz"
  sha256: "93de4bbb018cd0b011d9b5d914e7bd3bce2f4d67ec0c8591ec4ec6bf0ca53c34"
  tar_format: tar.xz

build:
  system: makefile
  dependencies:
    - "cdebconf/0.283"
    - "libdebian-installer/0.121"
  cflags: "-Wall -O2 -D_GNU_SOURCE -DARCH_TEXT=\"arm64\" -DWITH_HTTP -DWITH_HTTPS -DWITH_FTP_MANUAL"

patches_applied: []

knowledge_gained:
  - "Debian 主架构体系里 aarch64 硬件记为 arm64：Release Architectures 行与 binary-<arch> 目录均无 aarch64，choose-mirror.c:361/:899 两处 ARCH_TEXT 匹配均要求 arm64 拼写（实测 arm64 生成 283 条镜像、aarch64 生成 0 条）"
  - "self.run 走 /bin/sh，-DARCH_TEXT 必须用单引号壳保护 C 字符串字面量（-DARCH_TEXT='\"arm64\"'），裸双引号会被 shell 吃掉（E543 草稿）"
  - "cdebconf 包 package_info 无 cpp_info 且 lib/ 混有 .so，须显式 .a 路径静态链接（libdebconfclient.a + libdebian-installer.a + libsystem.a，顺序敏感）避免 RUNPATH"
  - "conan.tools.files.get() 在本环境 PermissionError → download() + tar 手动解压；mirrorlist 用 perl 绝对路径调用（shebang /usr/bin/perl 在 OHOS 不存在）"
