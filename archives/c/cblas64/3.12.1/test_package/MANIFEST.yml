package: cblas64/3.12.1
upstream_test_in_build: true
upstream_tests:
  - suite: "CBLAS 上游测试套件 64 位模式（CBLAS/testing，make run）"
    description: "12 个 blat 驱动（level1/2/3 × s/d/c/z 四精度）64 位模式真实运行：blat1 自包含逐 subprogram 校验；blat2/3 读源码树 *in2/*in3 数据文件，逐函数校验 column-major/row-major 计算与 error-exits。统计 PASS=340 FAIL=0（统计单位=测试程序验证行，取数 conanfile.py build() 内 *test*.out 计数）；经 3 个补丁修复上游 INDEX64+CBLAS 组合缺陷后达成（详见 notes.md）"
test_package_tests:
  - file: test.c
    description: "直接链接 libcblas64+libblas64+FortranRuntime 做真实数值计算：cblas_ddot_64/dasum_64/daxpy_64/dgemm_64（列主序），逐项对照手算值校验而非仅解析符号"
    command: "./test_probe"
assertion_count: 4
