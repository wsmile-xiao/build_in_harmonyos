  sha256: "2ca6407a001a474d4d4d35f3a61550156050c48016d949f0da0529c0aa052422"

patches:
  "3.12.1":
    - patch_file: "patches/0001-f77-mangling-suffix-gate.patch"
      patch_description: "上游 BUILD_INDEX64 + CBLAS 组合断裂修复：cblas_f77.h 的 F77_GLOBAL_SUFFIX 加 #ifndef 门。ILP64 下该宏无条件给 Fortran 符号加 _64 后缀（期望 srotg_64_），而 Fortran 侧（-fdefault-integer-8）恒产出无后缀符号（srotg_），同一次构建的 blas64 与 cblas64 必然链接失败；加门后由配方以 -D 恒等直通，C 端 Fortran 调用名与 BLAS64 实现一致，同时 cblas_*_64 公开 API 命名（cblas.h 的 API_SUFFIX）不受影响。对 32 位构建为 no-op"
      patch_type: "portability"
    - patch_file: "patches/0002-testing-c-xerbla-name-buffer-fix.patch"
      patch_description: "上游测试 c_xerbla.c 的 F77_xerbla 栈缓冲真 bug 修复：rout 字符数组 14 元素装不下 cblas_ 前缀+7 字符 BLAS 名（ZGEMMTR，LAPACK 3.12 新增例程）且复制循环 i<7 对 6 字符名（ZHER2K）越界读 srname[6]、覆盖 rout[12] 的 NUL 终止符，导致 SRNAME 回环校验依赖栈布局运气（32 位 OpenBLAS 路径靠栈上恰好为零通过；参考 BLAS 路径必失败）。修复：数组扩至 15 元素、复制循环用 Fortran 传入的 srname_len 界定上界、循环后显式补 NUL；本补丁同时包含该文件中 cblas_xerbla 调用点向 cblas_xerbla_64 的 API 改名适配（与 0003 同性质，因作用于同一文件故合并于此）"
      patch_type: "bugfix"
    - patch_file: "patches/0003-testing-api64-rename.patch"
      patch_description: "上游测试 C 辅助文件（testing/*.c 共 20 个）的 64 位 API 名适配：调用点 cblas_xxx(...) 改为 cblas_xxx_64(...) 与 libcblas64 导出符号一致。上游 INDEX64 模式下测试 C 代码未做 API 改名（上游缺陷，CMake 同样未覆盖该组合），不改名则链接必然 undefined symbol。仅改函数名解析，不改任何测试逻辑与期望值"
      patch_type: "portability"
