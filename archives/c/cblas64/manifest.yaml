software: cblas64
display: "CBLAS 64-bit integer interface"
description: "Netlib CBLAS 64-bit integer index interface (cblas_*_64 API, CBLAS64 mode of LAPACK 3.12.1) with reference ILP64 BLAS"
category: foundation
homepage: "https://www.netlib.org/lapack/"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "BLAS 的 64 位整数索引 C 接口（cblas_*_64；cblas.h 的 CBLAS_API64 模式，等价上游 CMake BUILD_INDEX64=ON 的 CBLAS64 组件），供 ILP64 线性代数栈使用"
    - "上游 BUILD_INDEX64 + CBLAS 组合存在三处缺陷（详见 conandata.yml patches）：F77_GLOBAL_SUFFIX 无条件加后缀致 BLAS64/CBLAS64 链接断裂；测试 C 辅助文件未做 _64 API 改名；c_xerbla.c 的 F77_xerbla 栈缓冲越界读写。经补丁修复后上游测试 340 PASS / 0 FAIL"
    - "ohpcd 暂无 ILP64 BLAS 发布；按上游 BUILD_INDEX64 构建语义在包内以 flang -fdefault-integer-8 构建参考 BLAS64（BLAS/SRC → libblas64.a），与 libcblas64.a 成对提供（实测 flang 下 default integer storage_size=64）"
    - "C 端宏 -DWeirdNEC -DCBLAS_API64 -DLAPACK_ILP64 -DHAVE_LAPACK_CONFIG_H（与上游 CMake 一致）+ F77_GLOBAL_SUFFIX 恒等直通；flang 需 --sysroot/-resource-dir/-lFortranRuntime 完整链接形态（同 cblas 包实测）"
    - "上游测试驱动与 libblas64.a 的 xerbla.f 依赖 Fortran 运行时，包内随附 libFortranRuntime.a/libFortranDecimal.a（同 lapack 包先例）"
    - "上游 make 构建（BLAS/SRC/Makefile + CBLAS/Makefile），绕开 CMake FortranCInterface 验证（同 cblas/lapack 包先例）"

versions:
  "3.12.1":
    status: built
    build_date: "2026-09-06"
    notes: "源码取 Reference-LAPACK v3.12.1 官方 tarball；含 3 个上游缺陷修复补丁；上游测试 340 PASS / 0 FAIL"
