# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cobs-c/0.4
homepage: "https://github.com/cmcqueen/cobs-c"

# 上游无 make check/ctest（纯 C 源码 + 手写测试程序）
upstream_check_command: "clang -fPIC -O2 -I. UnitTestC/main.c cobs.c cobsr.c -o UnitTestC/unit_test_c && ./UnitTestC/unit_test_c"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: UnitTestC/main.c
    source: cobs-c-0.4/UnitTestC/main.c
    description: "上游 C 单元测试：12 组 encode 用例（空串/短串/含0字节/254-255-257字节边界）"
    command: "./UnitTestC/unit_test_c"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 cobs_encode/cobs_decode 与 cobsr_encode/cobsr_decode 公开 API 验证编解码闭环"
    command: "./test_cobs-c"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
