# 版本级 manifest
# 文件位置: archives/c/cobs-c/0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4"

# 软件名
software: "cobs-c"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 HTTPS 源）
  url: "https://github.com/cmcqueen/cobs-c/archive/refs/tags/version_0.4.tar.gz"

  # 源码校验和（实测 tarball SHA-256）
  sha256: "f8f2e1f11f429c64b2e6f15cca77273170cb28ab400adb8700571ed769d38952"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（官方源码无 configure/make，直接编译 C 源文件）
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）——cobs-c 无第三方依赖
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无需补丁，源码可直接编译）
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（引用知识库草稿）
knowledge_gained:
  - ref: DRAFT-cobs-c-0.4-no-build-system-pure-c-conan-recipe
    scope: conan recipe, custom build, pure C, no build system
    summary: "无构建系统纯 C 库的 Conan 自定义配方：source_folder 路径 + G1 方法声明 + llvm-ar"
  - ref: DRAFT-cobs-c-0.4-py2-upstream-tests-py3-ctypes-cdll-port
    scope: testing, python, ctypes, py2-to-py3
    summary: "Python2 ctypes 测试套件在 Python3.12 最小移植 + cdll 属性加载 AttributeError 陷阱 + LD_LIBRARY_PATH 精确名恢复"
  - ref: E002
    scope: platform, tmpdir, hmdfs
    summary: "/tmp 只读时使用可写 TMPDIR（复用既有知识 E002/E052/E136）"
