     （13 个断言全部通过，无跳过）

upstream_modifications: |
  仅一处可移植性修改（patches/0001）：tests/test-clipmenu 与 tests/test-perf 中
  硬编码的 /tmp/clipmenu 路径改为 "${CM_TEST_BIN:-/tmp/clipmenu}" 可覆盖形式。
  原因：鸿蒙平台 /tmp 为只读文件系统（SKILL gotcha E002），默认值保持上游行为，
  无平台宏（符合 R8）。
  测试逻辑本身零修改：上游通过 bash 函数 shim 掉 dmenu/rofi/xsel/xclip，
  测试无需真实 X11 环境，13 个断言全部原样运行并通过。

supplementary_tests: |
  新增安装完整性检查（5 个脚本的 isfile 验证），作为上游测试的前置层。
  tests/test-perf 为性能基准（非功能测试），不纳入通过率统计。

test_pass_rate: 13/13 upstream (100%) + 5/5 install checks (100%)
notes: |
  之前版本错误地认为上游测试需要 X11 环境不可运行。
  实际上上游测试自行 shim 了所有 X11 依赖，可以在 conan create 环境中运行。
