adapted_test_count: 5
adapted_test_details: |
  适配测试分两层：
  1. 安装完整性检查：验证 5 个脚本（clipmenu/clipmenud/clipdel/clipctl/clipfsck）
     正确安装到 bin/ 目录（os.path.isfile）
