# 版本级 manifest — cbflib 0.9.7
# 遵循 ARCHIVE-SPEC v2.0

version: "0.9.7"
software: "cbflib"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方上游作者 GitHub 仓库 tag CBFlib-0.9.7（Debian watch 反查权威上游）
  url: "https://github.com/yayahjb/cbflib/archive/refs/tags/CBFlib-0.9.7.tar.gz"
  sha256: "e4acf8f7b5cc4e788215983ff428c2f8aa1fdbbfc6d163ace7999dcd2a10b19f"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile
  # 上游无 configure；以下为 make 变量开关（等价 configure_options 语义）
  configure_options:
  - "HDF5_PREFIX=<conan hdf5 包前缀>（启用 CBFLIB_DONT_USE_LOCAL_HDF5，禁用 sourceforge 下载构建 hdf5-1.12.0）"
  - "REGEX_PREFIX=<conan pcre 包前缀>（启用 CBFLIB_DONT_USE_LOCAL_REGEX，禁用 pcre-8.38 下载）"
  - "REGEX_LIBS=-L<pcre lib> -lpcreposix -lpcre（regex 支持走 CBF_REGEXLIB_REGEX）"
  - "NOFORTRAN=1（OHOS 无 Fortran 工具链，上游合法开关，跳过 libfcb 与 test_xds_binary/test_fcb_read_image）"
  - "CBFLIB_DONT_USE_LZ4=yes CBFLIB_DONT_USE_BSHUF=yes（跳过可选捆绑 HDF5 过滤插件）"
  - "CBFLIB_DONT_USE_PY2CIFRW=yes CBFLIB_DONT_USE_PY3CIFRW=yes（跳过可选 PyCifRW 下载）"
  - "CBFLIB_DONT_USE_TIFF=yes（本 PR 新增上游风格开关；ohpcd 无 tiff 发布）"
  # 传递依赖: zlib/1.3.1.1 与 libaec/1.1.7 经 hdf5 传递
  dependencies:
  - hdf5/1.14.6
  - pcre/8.45
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（描述禁用逗号，用分号）
patches_applied:
  - "0001-cbflib-m4-makefile-tiff-switch-cxx-override.patch: m4 模板新增 CBFLIB_DONT_USE_TIFF 开关并沿用既有 CBFLIB_DONT_USE_* 约定; default 段 C++ 改为 ?= 以便 env 覆盖"
  - "0002-cbflib-Makefile-regen-from-m4.patch: 与 0001 对应的 Makefile 再生产物; 与原始 tarball 的 diff 仅含 0001 等价改动"
  - "0003-cbflib-cbf_context-musl-opaque-file.patch: temp_file 按值声明 FILE 改为指针声明; musl 下 FILE 不透明按值声明直接编译失败且该变量仅被 CBF_UNUSED 引用"

# ============================================================
# 上游测试统计（设备原生执行；统计单位 = 测试动作：1 次工具执行或 1 个比较断言）
# TOTAL = PASS + FAIL + SKIP + NOT_RUN = 71 + 0 + 4 + 9 = 84
# PASS=71 FAIL=0 SKIP=4 NOT_RUN=9
# SKIP(4) = XRD1621 tiff 往返组（tiff2cbf 执行 + 1 比较 + cif2cbf 执行 + 1 比较）
#   技术原因: OHOS 无已发布 tiff 包（ohpcd conan list tiff/* = 0）
# NOT_RUN(9) = 6 个 h5dump 转储执行 + 3 个 dump 比较
#   技术原因: conan hdf5/1.14.6 包不含 h5dump 工具; 上游该组为 '-' 前缀非致命断言
# 上游默认不编译/不在目标范围（不计入 TOTAL）:
#   - Fortran 组（test_xds_binary/test_fcb_read_image/libfcb）: 上游 NOFORTRAN
#     配置下 Makefile 不包含该组; OHOS 工具链无 flang/gfortran
#   - testulp: 上游默认不编译（CBF_USE_ULP 未设置）
#   - py2cbftests/py3cbftests: SWIG 未安装且 Python 绑定不在 C 库包范围
# ============================================================

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libcbf 核心硬依赖 HDF5: include/cbf_hdf5.h 无条件 include hdf5.h, 必须以 HDF5_PREFIX 接外部 HDF5 并配 -DH5_USE_110_API (reference: archives/c/cbflib/0.9.7/notes.md)"
  - "make 变量名含 + 无法命令行赋值(C++=x 解析为变量 C+ 追加): 模板改 ?= 后用 env 'C++=clang++' make 经环境覆盖 (knowledge_ref: knowledge/drafts/E547-draft-B155.md)"
  - "m4 生成型 Makefile 修改须同补模板与再生产物并 os.utime 钉同一时间戳防自动再生 (knowledge_ref: knowledge/drafts/E549-draft-7554.md)"
  - "musl 下 FILE 不透明, 按值声明报 incomplete type: 本例上游 cbf_context.c 仅 CBF_UNUSED 引用改为指针声明; 根因知识见 (reference: knowledge/doc/E020.md)"

