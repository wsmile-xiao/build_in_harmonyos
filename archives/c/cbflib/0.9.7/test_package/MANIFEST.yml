# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cbflib/0.9.7
homepage: "https://github.com/yayahjb/cbflib"

# 上游测试命令 (Makefile 驱动, 无 ctest/meson)
upstream_check_command: "make -n basic; make -n extra; make -n dectristests"

# conanfile.py build() 方法中是否已集成上游测试
# (build() 仅构建; 上游测试在设备原生构建树中真实执行, 见 version manifest)
upstream_test_in_build: false
upstream_test_command: "make -j1 basic; make -j1 extra dectristests (NOFORTRAN=1 CBFLIB_DONT_USE_TIFF=yes CBFLIB_DONT_USE_LZ4=yes CBFLIB_DONT_USE_BSHUF=yes CBFLIB_DONT_USE_PY2CIFRW=yes CBFLIB_DONT_USE_PY3CIFRW=yes HDF5_PREFIX=<conan hdf5>)"

# 上游实际运行的测试程序 (设备原生构建树, 同一源码+补丁)
# 统计单位: 测试动作 (1 次工具执行 或 1 个比较断言 diff/cmp)
# 取数命令: 对 make 配方逐行动作枚举, 与 test-basic-2.log / test-extra-3.log 运行行核对
upstream_tests:
  - file: Makefile (target basic)
    source: CBFlib-0.9.7/Makefile
    description: "makecbf/img2cif/cif2cbf 往返 (7 次工具执行 + 3 个 diff + 1 个输入 md5 签名校验)"
    command: "make -j1 basic"
  - file: Makefile (target extra)
    source: CBFlib-0.9.7/Makefile
    description: "扩展转换与 HDF5/Nexus 往返 (38 次工具执行 + 20 个比较断言 PASS; 4 个动作因 CBFLIB_DONT_USE_TIFF 开关跳过; 9 个 h5dump dump 比较动作因包内无 h5dump 未执行)"
    command: "make -j1 extra"
  - file: Makefile (target dectristests)
    source: CBFlib-0.9.7/Makefile
    description: "Dectris 模板测试 cbf_template_t 执行 + 输出 diff (2 个动作)"
    command: "make -j1 dectristests"
  - file: examples/dectris_cbf_template_test/cbf_template_t.c
    source: CBFlib-0.9.7/examples/dectris_cbf_template_test/cbf_template_t.c
    description: "模板还原正确性"
    command: "./bin/cbf_template_t"

# 上游统计汇总 (设备原生执行, 同一源码+补丁, clang 15 aarch64-ohos)
# TOTAL = PASS + FAIL + SKIP + NOT_RUN = 11 + 71 + 2 = 84
# PASS=71 FAIL=0 SKIP=4 NOT_RUN=9
#   SKIP(4): XRD1621 tiff 往返组 (tiff2cbf 执行 + 1 个比较 + cif2cbf 执行 + 1 个比较; 两行 #-$(DIFF) 注释不计动作),
#            原因: OHOS 无已发布 tiff 包 (ohpcd conan list tiff/* = 0),
#            采用上游风格的 CBFLIB_DONT_USE_TIFF 开关, 整组有据跳过
#   NOT_RUN(9): 6 个 h5dump 转储执行 + 3 个 dump 比较,
#            原因: conan hdf5/1.14.6 包不含 h5dump 工具 (bin/ 仅 h5cc/h5c++);
#            该组在上游 Makefile 为 '-' 前缀非致命断言, 对应 cif2cbf 的
#            opaque/encI/encp/encb/encc/encz 六路 HDF5 转换及其回读比较全部 PASS
# 上游默认不编译/不在目标范围 (不计入 TOTAL, 单列防误读):
#   - Fortran 组 test_xds_binary/test_fcb_read_image/libfcb: 上游 NOFORTRAN
#     配置下 Makefile 不包含该组 (F90C 为空), OHOS 工具链无 flang/gfortran
#   - testulp: 上游默认不编译 (CBF_USE_ULP 未设置时 BIN_TESTULP 为空)
#   - py2cbftests/py3cbftests: SWIG 未安装 (command -v swig 无结果),
#     且 Python 绑定不在 C 库包范围

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/consumer.c
    description: "真实消费者: 公开 API 构造 datablock/category/column, 写二进制 CBF 后回读, 校验文本值与 8x6 packed int 数组逐元素一致"
    command: "./consumer"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 84
