# 软件级 manifest — cbflib
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: cbflib

# 显示名
display: "CBFlib"

# 一句话描述
description: "CBF/imgCIF 晶体学二进制文件库（libcbf/libimg）及 CIF↔CBF 转换工具集"

# 分类标签
category: library

# 官网 URL
homepage: "https://github.com/yayahjb/cbflib"

# 开源许可证（SPDX 标识；包整体 GPL，API 可选 LGPL）
license: "GPL-2.0-or-later OR LGPL-2.1-or-later"

# 常用构建系统（可被版本级覆盖）
build_system: makefile

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  notes: "libcbf 核心硬依赖 HDF5（cbf_hdf5.h 无条件包含 hdf5.h）；以 HDF5_PREFIX 接 conan hdf5 并以 NOFORTRAN/ CBFLIB_DONT_USE_* 上游开关裁剪可选组件；regex 走 pcre/8.45 的 pcreposix"
