# 软件级 manifest — cba
# 遵循 ARCHIVE-SPEC v3.0

software: cba
display: "cba"
description: "Continuous Beam Analysis — 连续梁内力/支座反力/挠度计算 CLI 工具"
category: utility
homepage: "https://sourceforge.net/projects/cbeam/"
license: GPL-3.0-or-later

# 常用构建系统（可被版本级覆盖）
build_system: makefile

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "CLI-only：上游 src/（CLI）与 src/gui/（wxWidgets GUI）在 Makefile 层分离，只构建 src/ 即可，无需 wxWidgets"
    - "src/Makefile 硬编码 CXX := c++，OHOS CI 无 c++ 符号——须在 make 命令行覆盖 CXX（R33：自 Conan profile conf 取值）"
    - "产物为 application（tool），软件级 commands.json 已声明；package_info 用 bindirs"
  common_dependencies: []

# 版本索引
versions:
  "0.3.6":
    status: built
    build_date: "2026-09-05"
    conan_ref: "cba/0.3.6"
