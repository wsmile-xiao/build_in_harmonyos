# test_package/MANIFEST.yml — cba 0.3.6
# CI L0e requires this file to exist.

package: cba/0.3.6
homepage: "https://sourceforge.net/projects/cbeam/"

# Upstream has NO test suite — three-layer evidence:
#   1. release tarball tree: no tests/ directory anywhere (VCS/source tree)
#   2. build files: src/Makefile + src/gui/Makefile have no
#      check / check_PROGRAMS / TESTS targets (only all/clean/install)
#   3. no configure.ac / configure exists (plain Makefile project)
# Therefore upstream_check_command has nothing to run:
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs
upstream_tests: []

# test_package harness (consumer perspective, drives installed `cba` binary)
# — 11 cases / 55 assertions (each case also asserts the cba exit status):
#   6 structural-analysis analytic checks = 41 assertions,
#   4 CLI parameter/error-path cases = 8 assertions,
#   1 -o/-p output/plot consistency case = 6 assertions.
test_package_tests:
  - file: test_cba.cpp
    description: "c01_udl_single — single span, uniform load vs analytic M=wL^2/8, R=wL/2, V=+/-wL/2, d=5wL^4/384EI (8 assertions)"
    command: "./test_cba c01_udl_single"
  - file: test_cba.cpp
    description: "c02_point_mid — mid-span point load vs analytic M=PL/4, d=PL^3/48EI (7 assertions)"
    command: "./test_cba c02_point_mid"
  - file: test_cba.cpp
    description: "c03_point_quarter — point load at quarter point vs analytic R_A=Pb/L, R_B=Pa/L, M=Pab/L (6 assertions)"
    command: "./test_cba c03_point_quarter"
  - file: test_cba.cpp
    description: "c04_cont2_udl — two equal spans uniform load vs analytic hogging M=-wL^2/8, R_int=5wL/4, ends=3wL/8 (6 assertions)"
    command: "./test_cba c04_cont2_udl"
  - file: test_cba.cpp
    description: "c05_factor_cont2 — load-factor design combination gamma_g*G+gamma_q*Q, R_d=5w_dL/4 (7 assertions)"
    command: "./test_cba c05_factor_cont2"
  - file: test_cba.cpp
    description: "c06_readme_example — upstream README worked example (5.8/4.2m HEA200) regression (7 assertions)"
    command: "./test_cba c06_readme_example"
  - file: test_cba.cpp
    description: "c07_no_args — no arguments -> usage text + exit 1 (2 assertions)"
    command: "./test_cba c07_no_args"
  - file: test_cba.cpp
    description: "c08_missing_input — nonexistent -i file -> error message + exit 1 (2 assertions)"
    command: "./test_cba c08_missing_input"
  - file: test_cba.cpp
    description: "c09_bad_geometry — input without SPANS -> 'geometry not right' + exit 1 (2 assertions)"
    command: "./test_cba c09_bad_geometry"
  - file: test_cba.cpp
    description: "c10_no_loads — input without LOAD -> 'no loads' + exit 1 (2 assertions)"
    command: "./test_cba c10_no_loads"
  - file: test_cba.cpp
    description: "c11_outfile_plot — -o file equals stdout; -p plot header/103-line/7-column layout (6 assertions)"
    command: "./test_cba c11_outfile_plot"

# Approximate assertion count (55: 41 structural + 8 CLI errors + 6 output)
assertion_count: 55
