software: cba
# 版本级 manifest — cba 0.3.6
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "0.3.6"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方 SourceForge 发布物，CI 自动注入镜像回退）
  url: "https://downloads.sourceforge.net/project/cbeam/cba-0.3.6-linux.tar.gz"

  # 源码校验和
  sha256: "4134b83283a7ae0a474762a05b8cd2c1822b8e7850ab5a35e8fc5137c7781e44"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CLI-only 决策：上游 0.3.6 无 configure.ac，CLI(src/)与 wxGUI(src/gui) 在 Makefile 层分离——只构建 src/ 即天然 CLI-only，无需引入 wxWidgets（任务描述的 --disable-wx 开关在真实源码中不存在）"
  - "src/Makefile 硬编码 'CXX := c++'，CI 无 c++ 符号——编译器须在 make 命令行覆盖（CXX=<conf 读取的 clang++>），环境变量覆盖无效"
  - "conanfile.py 编译器取值自 self.conf tools.build:compiler_executables（R33），不裸用 shell 环境变量"
  - "CI 下载镜像重写白名单不含 deb.debian.org（worker Python SSL 不可用直连失败）——源 URL 须用白名单内官方源（sourceforge/downloads.sourceforge.net）"
  - "上游无任何测试（无 tests/ 目录、无 make check/TESTS 目标、无 configure.ac）；test_package 新增 11 用例/55 断言：6 结构解析解比对(41) + 4 CLI 错误路径(8) + 1 输出/plot 一致性(6)"

# verify-build 兼容字段
build_system: makefile
