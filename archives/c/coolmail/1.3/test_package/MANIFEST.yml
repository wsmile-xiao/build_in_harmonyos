# test_package/MANIFEST.yml — coolmail 1.3
# CI L0e requires this file to exist.

package: coolmail/1.3
homepage: "https://sources.debian.org/src/coolmail/"

# 上游源码审计：coolmail 1.3 发布包确认无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile"
    reason: "目标仅 all/new/clean/install 与目标文件规则；grep -nE '^(check|test)' Makefile 无输出，make -n check 报 No rule to make target 'check' (rc=2)。"
  - source: "coolmail-1.3.tgz 清单"
    reason: "python3 tarfile 列出 18 个文件（COPYRIGHT/Coolmail.ad/IAFA-PACKAGE/Makefile/README/README.changes/TODO/audio.c/coolmail.c/coolmail.man/display_list.h/mailbox.h/r1_sub.c/render1.c/render1.h/system/X11/colors.c/system/X11/colors.h/system/X11/display_list.c）；无 test/、tests/ 目录，无 *_test 源文件。"
  - source: "README"
    reason: "上游仅说明 make 与 make install 用法及手工使用方式，未提供任何自动化测试或自检程序。"
  - conclusion: "上游未提供自动化测试套件；由 test_package 真实执行被测二进制（coolmail -h 与无 DISPLAY 的 Xt 初始化路径）完成验证。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_coolmail.sh
    description: "真实执行被测包二进制：coolmail -h 校验退出码 0、usage 横幅与 -f 选项行；无 DISPLAY 运行校验非零退出且输出 Xt 'Can't open display'（证明 libXt→libSM/libICE、libX11→libxcb/libXau/libXdmcp 动态链加载成功，且 main() 顶部的登录名解析已执行）；并校验安装的 man page 与 X11 app-defaults 资源文件存在。设备与 CI worker 均无 X server（镜像内无 Xorg/Xvfb 可执行文件，制品仓未发布 OHOS xorg-server），因此窗口与邮箱动画无法在本环境运行。"
    command: "sh test_coolmail.sh <package_folder> <package_folder>/bin/coolmail <build_folder> <LD_LIBRARY_PATH>"

# 7 checks: binary present/executable, -h exit code, usage banner, -f option line,
# headless Xt diagnostic + non-zero exit, man page, app-defaults
assertion_count: 7
