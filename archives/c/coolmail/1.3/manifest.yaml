# 版本级 manifest — coolmail 1.3
# 文件位置: archives/{letter}/{name}/1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "1.3"
software: "coolmail"
status: built
build_date: "2026-09-11"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游站点（sunsite.unc.edu / ftp.x.org）早已停止分发该文件；26809 字节的原始
  # 发行物 coolmail-1.3.tgz 从 pkgsrc 官方 distfiles 取得。该副本与 Debian
  # coolmail_1.3.orig.tar.gz（28685 字节）的差异仅为发行方附加内容：
  # Makefile 第 28 行 -L/usr/X11R5/lib（pkgsrc）vs -L/usr/X11R6/lib（Debian），
  # 以及 Debian 多出的打包产物 coolmail.1x.gz；上游 C 源码逐字节一致。
  url: "https://cdn.netbsd.org/pub/pkgsrc/distfiles/coolmail-1.3.tgz"
  sha256: "8c78f2b73819e7978682cba9c9f93831710d95c379d0ab9dc10584f1298c0ff7"
  tar_format: tar.gz
  size_bytes: 26809
  release_date: "1995-09-19"

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options: []
  build_command: >-
    make -j1 CC=<clang> CFLAGS="-O2" INCLUDES="-I<依赖 include 目录>"
    LIB_DIRS="-L<依赖 lib 目录>" LIBS="-L<依赖 lib 目录> -lXt -lX11 -lm"
    AUDIO= AUDIO_MODULE=
  install_method: "package() 用 conan copy 复现上游 Makefile 的安装规则（不调用 make install：上游 install 目标在目录不可写时静默跳过）"
  dependencies:
    - "libxt/1.3.1（直接依赖；传递 libx11/1.8.13、libsm/1.2.6、libice/1.1.2、xorgproto/2025.1、libxcb/1.17.0、libxau/1.0.11、libxdmcp/1.1.5）"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-coolmail.c.patch（<string.h> 改为无条件包含；删除 L_cuserid 缓冲区并以 getpwuid/getlogin/LOGNAME/USER 回退链替换 cuserid()；补 display_list.h 以声明 disp_sync()）"
  - "0002-render1.c.patch（rend_init() 的 strcmp() 补 <string.h>）"

patch_classification:
  - file: 0001-coolmail.c.patch
    type: portability
    platform_only: false
    guard: "none"
    description: >-
      三项 1995 年 C 代码在 C99+ 编译器与 musl libc 下的可移植性问题：
      ① <string.h> 原本只在 #ifdef AUDIO 内包含，关闭 OSS 声音后端后
      strcat/strcmp/strncpy 全部走隐式声明；② cuserid() 在 POSIX.1-2001 已删除，
      OHOS musl 只在静态 libc.a 保留该符号而 libc.so 不导出，隐式声明导致
      int→pointer 硬错误；③ disp_sync() 缺少 display_list.h 声明。
      补丁不含 __OHOS__ 条件编译，glibc/musl 通用，可向上游提交。
  - file: 0002-render1.c.patch
    type: portability
    platform_only: false
    guard: "none"
    description: "rend_init() 调用 strcmp() 但 render1.c 未包含 <string.h>，C99+ 下为隐式声明。"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS musl 头文件保留 L_cuserid 宏但不声明也不导出 cuserid()（符号只在静态 libc.a）；老代码隐式声明后 clang 报 int→pointer 硬错误，手工补 prototype 只把故障推到动态链接期"  # knowledge_ref: E579
  - "上游 Makefile 硬编码 -I/usr/X11R5/include 与 -L/usr/X11R6/lib：配方在 make 命令行用同名 INCLUDES/LIB_DIRS/LIBS 变量覆盖即可，无需改 Makefile 或打补丁"  # reference: archives/c/coolmail/README.md
  - "OHOS 不预装任何 X 库：GUI 目标的运行期依赖靠依赖包 libdir 经 LD_LIBRARY_PATH 解析（DT_NEEDED 链 libXt.so.6→libSM/libICE、libX11.so.6→libxcb/libXau/libXdmcp），不带该变量时 rc=127 并打印 Error loading shared library"  # reference: archives/x/xeyes/1.3.1/test_package/conanfile.py
  - "制品仓中与 libx11/1.8.13 图匹配的 libXext 无可用 binary（libxext/6.4.0.1 的已发布 binary 按 libx11/6.4.0 计算 package_id）；核对 nm 确认源码不使用 Xext API 后从链接行去掉 -lXext"  # reference: archives/n/ncview/2.1.11/manifest.yaml
  - "上游 digitized audio 后端是 OSS 实现（#ifdef linux + <linux/soundcard.h> + /dev/mixer、/dev/dsp）：OHOS 无该头文件与设备节点，按上游 README 记载关闭 AUDIO/AUDIO_MODULE，代价是 -af/-vol 选项不可用（上游行为，非适配引入）"  # reference: archives/c/coolmail/README.md
  - "application 型包在 conan-verify 中 G4/L2/L4/L5 整组走「无 cache 路径」跳过（报告同时打印 ✅ PASS 与 ⏭️ 跳过）：必须人工补测，本包补测证据见 reports/conan-verify-supplement.md"  # reference: reports/conan-verify-supplement.md

# ============================================================
# 验证
# ============================================================

verification:
  conan_create:
    command: "conan create archives/c/coolmail/1.3 -pr:h=<abs>/ci/conan/profiles/ohos-aarch64 -pr:b=<abs>/ci/conan/profiles/ohos-aarch64 --build=missing --user=ohpcd --channel=stable"
    result: "PASS（EXIT=0；清缓存后的干净轮，日志含 Uncompressing / Apply patch ×2 / Calling build() / RUN: make）"
    log: "reports/conan-create-log.md"
  test_package:
    command: "conan create 自动执行：sh test_coolmail.sh <package_folder> <package_folder>/bin/coolmail <build_folder> <LD_LIBRARY_PATH>"
    result: "PASS（7/7：二进制存在且可执行、-h 退出码 0、usage 横幅、-f 选项行、无 DISPLAY 非零退出且含 Can't open display、man page、X11 app-defaults）"
  upstream_tests:
    result: "N/A（上游无自动化测试：Makefile 无 check/test 目标，make -n check 报 No rule to make target 'check'；发行包 18 个文件无测试代码）"
    detail: "见 test_package/MANIFEST.yml 的 upstream_test_audit 小节"
  supplemental:
    result: "application 包在 conan-verify 中 G4/L2/L4/L5 整组跳过，已按 workflow 第 7.2 节人工补测（G4 产物清单、L2 真实执行含无 LD_LIBRARY_PATH 时 rc=127 反证、L4 readelf 四判据、L5 两轮独立干净构建的逐产物 sha256 基线）"
    report: "reports/conan-verify-supplement.md"
  w3_local_ci:
    command: "zsh ci/conan/setup.sh && CI_PACKAGES=archives/c/coolmail/1.3 zsh ci/conan/build_and_test.sh archives/c/coolmail/1.3"
    result: "PASS（L0 全过、L1/L1e 通过、L5 通过；L2 skip 与 L4 warn 为框架/上游固有形态，已人工补测）"
    log: "reports/w3-local-ci-log.md"
