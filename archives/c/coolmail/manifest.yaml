# 软件级 manifest — coolmail
# 遵循 ARCHIVE-SPEC v3.0

software: coolmail
display: "coolmail"
description: "X11 邮件通知工具 — 监视邮箱文件并在一个小组件窗口中播放 3D 信封动画（xbiff 替代品，可点击调用邮件阅读器）"
category: utility
homepage: "https://sources.debian.org/src/coolmail/"
license: GPL-1.0-or-later
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯手写 GNU Makefile（1995 年发布）：无 configure、无 check/test 目标。Makefile 把 -I/usr/X11R5/include 与 -L/usr/X11R6/lib 写死，配方在 make 命令行用 INCLUDES/LIB_DIRS/LIBS 覆盖，不改 Makefile"
    - "窗口通过 X Toolkit Intrinsics 绘制（system/X11/display_list.c 的 XtInitialize/XtCreateManagedWidget/XtAddEventHandler），因此直接依赖 libxt/1.3.1，libx11/libsm/libice/xorgproto 由 libxt 传递"
    - "上游 digitized audio 后端是 OSS 实现（#ifdef linux + <linux/soundcard.h> + /dev/mixer + /dev/dsp），OHOS SDK 无该头文件也无 OSS 设备；AUDIO/AUDIO_MODULE 在 make 命令行置空，采用 README 记载的无声音配置"
    - "上游 Makefile 链接 -lXext，但源码不调用任何 Xext 入口（nm 实测产物无 Xext 未定义符号），且与 libx11/1.8.13 图匹配的 libXext 在制品仓无可用 binary，故去掉该标志"
    - "1995 年 C 代码用 cuserid() 取登录名：OHOS musl 头文件保留 L_cuserid 宏但不声明也不导出该符号（只在静态 libc.a），clang 15 报 int→pointer 硬错误；补丁改为 getpwuid/getlogin/LOGNAME/USER 回退链（见 knowledge/drafts/E579-draft-A26E.kv）"
    - "GUI 工具在设备与 CI worker 都无 X server 可用（镜像内无 Xorg/Xvfb，制品仓未发布 OHOS xorg-server）：验证用 coolmail -h 退出码与 usage 文本，以及无 DISPLAY 时 Xt 的 Can't open display 诊断"
  common_dependencies:
    - libxt
    - libx11

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.3":
    status: built
    build_date: "2026-09-11"
    conan_ref: "coolmail/1.3"
