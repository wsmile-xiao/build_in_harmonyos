software: cminpack
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.9"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
compile_date: "2026-06-24"
build_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/devernay/cminpack/archive/refs/tags/v1.3.9.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: cmake
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（CMake 参数）
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DUSE_BLAS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x 不兼容 cmake_minimum_required < 3.5，需添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "CMinpack 使用 CMake 构建系统，init-build 默认识别为 autotools 需手动修正"
  - "禁用 BLAS (-DUSE_BLAS=OFF) 以避免外部依赖"
  - "测试套 6/24 失败为浮点精度/输出格式差异，非算法错误"
  - "纯静态库包（3个 .a + 2个 .h + pkgconfig + cmake config）"
