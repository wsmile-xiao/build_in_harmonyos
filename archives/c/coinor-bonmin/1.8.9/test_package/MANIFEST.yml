# test_package/MANIFEST.yml
# 上游/消费者测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: coinor-bonmin/1.8.9
homepage: "https://github.com/coin-or/Bonmin"

# 上游标准 test 套件（Bonmin/test：unitTest + CppExample，入口 `make test`）
# 已在配方 build() 内随官方默认配置实际运行；运行期需 deps 的 lib 目录
# （libipopt.so），由配方显式注入 LD_LIBRARY_PATH。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make CFLAGS='-O3 -pipe -DNDEBUG' CXXFLAGS='-O3 -pipe -DNDEBUG' test"

# 补充测试说明：test_package 新增两个消费者/HarmonyOS 专项测试
supplementary_tests:
  - file: test_package/bonmin_smoke.cpp
    count: 1
    description: >-
      消费者冒烟测试：链接已安装 libbonmin.a，用公开 BonminSetup + Bab 跑完整
      B-BB（Ipopt NLP 子问题 + Cbc 分支定界）求解上游 CppExample 的 4 变量
      MINLP，3 项断言：有可行解、mipStatus=FeasibleOptimal、
      bestObj=-2.500141411335916（容差 1e-6，与上游实测一致）。
  - file: test_package/bonmin_ohos_test.cpp
    count: 1
    description: >-
      HarmonyOS 专项测试：3 项断言——已安装 BonminConfig.h 自报
      BONMIN_VERSION=1.8.9（证明消费本包安装头）；IpoptApplicationFactory +
      Initialize 返回 Solve_Succeeded（conanrun 注入的 LD_LIBRARY_PATH 在
      OHOS 运行时解析 libipopt.so、内部 MUMPS 直接求解器初始化成功）；
      完整 B-BB 求解链断言 FeasibleOptimal 与最优值 -2.500141411335916。

# MyTMINLP.hpp / MyTMINLP.cpp 取自上游 examples/CppExample（EPL-2.0，文件头
# 保留原版权），提供被测 MINLP 的问题定义，供两个消费者程序复用。
