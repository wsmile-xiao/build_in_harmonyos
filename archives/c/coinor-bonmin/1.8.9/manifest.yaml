  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # 解析器要求每项每个 token 都以 '-' 开头（G0 干净构建验证），说明只能放注释：
  #   · CC=clang CXX=clang++ 必须裸名 —— 绝对路径命中 coin m4 的 */cl* 分支被判 MSVC，
  #     coin_cc_is_cl=true 会让 pkg-config 探测被整体跳过（configure 硬错，实测复现）；
  #   · CFLAGS/CXXFLAGS='-O3 -pipe -DNDEBUG' 在 configure 期与 make 调用行双钉（R33）；
  #   · --prefix=/ 配 make install DESTDIR=<package>；默认静态（-shared 实链因依赖
  #     静态件非 PIC 报 R_AARCH64 错）。
  configure_options:
    - "--prefix=/"
    - "--disable-shared"
    - "--enable-static"
    - "--disable-dependency-tracking"
    - "--enable-pkg-config"

  dependencies:
    - cbc/2.10.13
    - coinor-ipopt/3.14.19
    - clp/1.17.10
    - coin-or/0.108.12
    - coinutils/2.11.13
    - cgl/0.60.10.1
    - zlib/1.3.1

  cc: clang
  cxx: clang++

