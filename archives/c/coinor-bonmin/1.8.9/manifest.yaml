# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "coinor 族：依赖包 .la 内 libdir='//lib' 无效时不能照 cbc 方案 B 换绝对 .a 路径——libtool 会把 file-arg 归档合并进本包静态库（libbonmin.a 膨胀 1.7GB、成员内嵌 18 个依赖 .a）；正解是本地无 .la 符号链接目录 + 重定向 -L"  # knowledge_ref: DRAFT-E715
  - "coin m4 的 case \"$CC\" in clang*) ;; cl* | */cl* … 会把绝对路径 /data/.../clang 判成 MSVC：coin_cc_is_cl=true ⇒ pkg-config 检查被跳过 ⇒ configure 硬错 Required package Cbc or Ipopt not available；CC/CXX 必须裸名 clang/clang++"  # knowledge_ref: DRAFT-E715
  - "ASL 不在档时 Bonmin 的 if COIN_HAS_ASL 结构闸关掉 libbonminampl/unitTest 的 AMPL 段/bonmin CLI（故无 commands.json）；test/mytoy.nl 计 SKIP，任务卡 --disable-sAMPL-interface 开关在 1.8.9 configure 不存在"  # knowledge_ref: DRAFT-E715
  - "HMDFS：config.status 的 mktemp -d(0700) 目录自身写不进 ⇒ rc=0 但 Makefile/config.h 全没生成；改 mkdir -p conftmp + umask 022（E678/cbc 同款），并在 configure 后断言 5 个关键产物落地"
