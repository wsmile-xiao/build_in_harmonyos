package: cccolutils/1.5
homepage: "https://pagure.io/cccolutils"

# 上游确有测试：tests/cccolutils_test.py（unittest，3 个 def test_ 用例，
# setup.py test_suite="tests" 接入）
upstream_tests_exist: true
upstream_test_audit: "审计上游 CCColUtils-1.5 源码包 (sha256 8b154d4bea0634fe9428de3d03e6bce0d5cb7983b000d66d8f954a7aefacc2de): tests/ 目录含 cccolutils_test.py 一个 unittest 文件，grep 'def test_' 计数 3 个用例 (test_get_user_from_realm / test_get_user_from_realm_unknown_realm / test_has_creds)。测试经 setup.py test_suite=\"tests\" 接入，实际以 `python3 -m unittest tests.cccolutils_test -v` 在 build() 内真实执行并解析 'Tan N tests'/'OK'/'FAILED (failures=X, errors=Y)' 计数。其中 test_get_user_from_realm 的断言体以 `if sys.version_info[0] != 2: return` 门控（Python2 专用，依赖 krbV 构造凭据缓存），Python3 下为空操作通过；真实断言覆盖 unknown realm→None 与 has_creds()→False（空 DIR: 缓存）。framework=unittest。"

upstream_check_command: "python3 -m unittest tests.cccolutils_test -v"
upstream_test_in_build: true
upstream_test_command: "python3 -m unittest tests.cccolutils_test -v  (workdir=source root；TMPDIR 指向可写目录，PYTHONPATH=source root)"

# 上游测试在 build() 内真实执行，聚合计数写入包内 res/upstream_test_summary.json；
# HMBS_UPSTREAM_TEST_RESULT 由 test_package 阶段读取该文件后输出（hmbs gate 只
# 扫描 test_package 阶段 stdout，且 conan create 命中缓存二进制时 build() 会被
# 整体跳过——pycairo 同款模式），数字来自真机真实 unittest 输出解析。
# CI 沙箱（E212 hmmac 拒绝用户路径 dlopen）下退化为静态签名产物校验，
# summary 如实写 failed，不伪造 live 计数。

upstream_tests:
  - file: tests/cccolutils_test.py
    description: "cccolutils 上游 unittest 套件 3 用例（get_user_from_realm / unknown_realm / has_creds），build() 内真实执行；Python2 门控用例在 Python3 下空操作通过（见 note）"
    framework: unittest
    discovered: 3
    notes: "test_get_user_from_realm 断言体仅 Python2 生效（依赖 krbV 构造凭据缓存），Python3 下空操作通过；真实断言为 unknown realm→None 与 has_creds→False（空 DIR: 缓存）"

# test_package 中自带的测试 (消费者视角验证)
# 两条路径（运行时按环境自适应）：
#   A. import cccolutils 可用（真机 SSH）→ test_cccolutils.py 真实 API 调用，
#      5 个检查点（import / 两 API 可调用 / unknown realm→None / has_creds→False）
#   B. import 报 Permission denied（CI AppSpawn 沙箱，E212 hmmac 用户路径
#      dlopen 限制，与签名无关）→ 回退静态签名产物校验，同样 5 项检查
#     （site-packages 布局 / .so ELF+.codesign+PyInit_cccolutils / dist-info）
# 两条路径都输出 HMBS_TEST_PACKAGE_RESULT，discovered/passedCount 为实际执行的计数。
test_package_tests:
  - file: test_cccolutils.py
    description: "用设备 python3 导入打包的 cccolutils 扩展并真实调用 API：import、两 API 可调用、get_user_for_realm('NO_SUCH_REALM')→None、has_creds()→False（5 个独立检查点）；CI 沙箱（E212 hmmac 拒绝用户路径 dlopen）下回退为 5 项静态签名产物校验（见上），不伪造 live 结果"
    command: "python3 test_cccolutils.py (env=conanrun：PYTHONPATH 指向 site-packages + LD_LIBRARY_PATH 含 krb5/libpython)；E212 回退：静态 artifact 校验"
    framework: python
    discovered: 5

assertion_count: 5
