# conandata.yml — collada-dom 2.5.0
# 官方源 https://github.com/rdiankov/collada-dom tag v2.5.0
# 本地下载 sha256sum 核验一致（4509266 字节）
sources:
  url:
    - "https://gh-proxy.com/https://github.com/rdiankov/collada-dom/archive/refs/tags/v2.5.0.tar.gz"
    - "https://github.com/rdiankov/collada-dom/archive/refs/tags/v2.5.0.tar.gz"
  sha256: "3be672407a7aef60b64ce4b39704b32816b0b28f61ebffd4fbd02c8012901e0d"
patches:
  "2.5.0":
    - patch_file: patches/0001-CMakeLists.txt.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        collada-dom 上游 find_package(Boost COMPONENTS filesystem system REQUIRED)
        依赖 libboost_filesystem。registry 的 boost/1.90.0 为头文件版包（仅外部声明、
        无编译库），故改用共享变体 boost/1.90.0.1（含 libboost_filesystem.so），
        通过 find_package(Boost CONFIG REQUIRED COMPONENTS filesystem) 暴露
        Boost::filesystem 目标并链接（Boost.System 自 1.69 起 header-only 无需链接）。
        同时将 cmake_minimum_required 由 2.6.0 提升到 3.5（E103，CMake 4.x
        已移除 <3.5 兼容），并用 Conan LibXml2::LibXml2 目标替代旧式
        LIBXML2_FOUND 变量（E216，CMakeDeps 不填充 FindLibXml2 模块变量）。
    - patch_file: patches/0002-dom-include-dae.h.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        Boost >= 1.80 移除了废弃的 <boost/filesystem/convenience.hpp>；
        collada-dom ≤ 2.5 均包含该头。删除该 include（其工具函数已迁移至
        operations.hpp/path.hpp，本库未直接使用）。
    - patch_file: patches/0003-dom-include-dae-daeErrorHandler.h.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        C++17 移除了 std::auto_ptr；将 _defaultInstance 改为 std::unique_ptr
        （语义等价，.get() 用法不变）。
    - patch_file: patches/0004-dom-src-dae-dae.cpp.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        dae.cpp 直接使用 boost::filesystem::remove_all，此前经 dae.h 中的
        convenience.hpp 传递引入 boost；该头在 Boost >= 1.80 已移除，显式
        include <boost/filesystem.hpp>。
    - patch_file: patches/0005-dom-src-dae-daeAtomicType.cpp.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        同 0003：定义处 std::auto_ptr → std::unique_ptr。
    - patch_file: patches/0006-dom-src-dae-daeErrorHandler.cpp.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        daeUtils.cpp 同因包含已移除的 convenience.hpp；改为 include
        <boost/filesystem.hpp>（is_directory/remove_all/create_directories
        均在 operations.hpp 内联实现）。
    - patch_file: patches/0007-dom-src-dae-daeIOPluginCommon.cpp.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        daeZAEUncompressHandler.cpp 使用 boost::filesystem（fs::path、
        create_directories、remove_all、rename），此前经 dae.h 的
        convenience.hpp 传递引入 boost；该头在 Boost >= 1.80 已移除，
        显式 include <boost/filesystem.hpp>。
    - patch_file: patches/0008-dom-src-dae-daeUtils.cpp.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        上游测试 domTest141（dom/test/1.4）：domTest.h 移除 Boost >= 1.80
        已删除的 <boost/filesystem/convenience.hpp>，改引 <boost/filesystem.hpp>
        （与 0002/0003 主库补丁同风格），使测试可构建。
    - patch_file: patches/0009-dom-src-dae-daeZAEUncompressHandler.cpp.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        上游测试 domTest141（dom/test/1.4）：将已删除 API 迁移为现代等价——
        fs::basename(p) -> p.stem().string()、path::leaf() -> path::filename()、
        path::branch_path() -> path::parent_path()、path::normalize() ->
        path::lexically_normal()；并将全部 DAE 构造显式指定 specversion"1.4.1"
        （默认 NULL 在同时启用 1.4/1.5 的构建中选 1.5.0，导致 1.4 文件
        xmlns(2005/11) 与默认命名空间(2008/03) 不匹配而无法加载）。
    - patch_file: patches/0010-dom-test-1.4-domTest.cpp.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        上游测试 domTest150（dom/test/1.5）：domTest.h 直接使用
        boost::filesystem::path（dataPath/tmpPath），主库 dae.h 移除
        convenience.hpp 后不再传递引入，故显式 #include <boost/filesystem.hpp>。
    - patch_file: patches/0011-dom-test-1.4-domTest.h.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        上游测试 domTest150（dom/test/1.5）：与 0009 相同，迁移已删除
        Boost.Filesystem API（stem/filename/parent_path/lexically_normal）。
    - patch_file: patches/0012-dom-test-1.4-export.cpp.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        上游测试 domTest141（dom/test/1.4/export.cpp）：DAE 构造显式
        specversion"1.4.1"（同 0009 的版本根因修复）。
    - patch_file: patches/0013-dom-test-1.4-integrationExample.cpp.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        上游测试 domTest141（dom/test/1.4/integrationExample.cpp）：DAE 构造
        显式 specversion"1.4.1"（同 0009 的版本根因修复）。
    - patch_file: patches/0014-dom-test-1.5-domTest.cpp.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        daeFloatType::memoryToString 在 COLLADA_DOM_DAEFLOAT_IS64 下用
        setprecision(digits10+1)=16 位全精度输出，导致 (double)6.123f
        =6.123000144958496，与上游测试期望的紧凑 "%g" 形式 "6.123" 不符；
        改为按 _printFormat("%g") 经 snprintf 输出（与 _MSC_VER 分支一致）。
        原子类型 toString 校验（domTest141/150 atomicTypeOps）由失败转通过。
    - patch_file: patches/0015-dom-test-1.5-domTest.h.patch
      patch_type: compatibility
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        daeIOPluginCommon::read 增加 gzip(.gz) 支持：上游 zipFile 测试的
        cube.dae.gz 为 gzip(魔数 0x1f 0x8b)，但本库与运行期 libxml2 均不解压
        gzip，导致原始 gz 字节被当作 XML 解析失败；在库内用已链接的 bundled
        zlib(gzopen/gzread) 解压后经 readFromMemory 解析。zipFile 测试
        （domTest141/150）由失败转通过。