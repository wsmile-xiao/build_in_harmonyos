  - "0001-CMakeLists.txt.patch"
  - "0002-dom-include-dae.h.patch"
  - "0003-dom-src-dae-daeUtils.cpp.patch"

knowledge_gained:
  - "Boost.Filesystem：registry 的 boost/1.90.0 为头文件版包（operations.hpp 仅外部声明 detail 文件系统函数、无 libboost_filesystem），使用 boost::filesystem 的消费者会留未定义符号；需改用共享变体 boost/1.90.0.1（含 libboost_filesystem.so）并通过 CMakeDeps Boost::filesystem 目标链接"
  - "boost/filesystem/convenience.hpp 在 Boost >= 1.80 已删除，需改引 <boost/filesystem.hpp>（is_directory/remove_all/create_directories 均在 operations.hpp）"
  - "collada-dom 上游非 MSVC 分支对 libxml2 无内嵌回退（FATAL_ERROR），必须声明 libxml2 依赖"
  - "配方不得注入 -fuse-ld=/data/service/hnp/bin/ld：该链接器产出的 .so 被 OHOS musl 加载器以 EACCES 拒绝（dlopen Permission denied），默认链接器产物可正常加载"

