# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: collada-dom/2.5.0
homepage: "https://github.com/rdiankov/collada-dom"

# 上游 CMake 的 OPT_COMPILE_TESTS 默认 OFF；本次适配保持 OFF（
# dom/test 需要依赖 OPT_BUILD_PACKAGES 等非默认选项，且对 OHOS 无额外价值）。
# 因此没有上游测试命令可枚举；用 test_package 的真实 C++ 消费测试覆盖。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无，OPT_COMPILE_TESTS=OFF）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/test.cpp
    source: "C++ consumer test (dom API)"
    description: "加载内存 COLLADA 1.5 文档并校验解析根元素，验证头文件+库链接"
    command: "./test_collada_dom"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
