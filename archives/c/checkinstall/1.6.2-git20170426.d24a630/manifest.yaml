# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "installwatch.c 深度绑定 glibc 版本化 stat ABI（__xstat/_STAT_VER/__xmknod/__fxstatat 等 39 处 + 16 处 GLIBC_MINOR 条件块），OHOS musl 无这些符号且 64 位变体宏归一冲突，需 musl 移植（标准符号 interposer + 64 位禁用 + constructor/destructor）"
  - "create-localdecls libc 探针依赖 gcc/ldd//usr/include/unistd.h，OHOS 无 → 无 gcc/无 glibc 头时直接输出 musl 兼容 localdecls.h 快速路径"
  - "脚本 shebang #!/bin/bash 在 OHOS 无 /bin/bash（E037）→ 改 #!/usr/bin/env bash"
  - "checkinstall 为 bash 脚本工具 + installwatch LD_PRELOAD 拦截库（C）；chroot 系统调用被 OHOS 沙盒禁止（SIGSYS，E051 平台限制），上游 test-installwatch chroot 项不可运行"

