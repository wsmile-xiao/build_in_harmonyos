# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: checkinstall/1.6.2-git20170426.d24a630
homepage: "https://checkinstall.izto.org/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make -C installwatch test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（installwatch 自带自测 test-installwatch，
# checkinstall 主程序为 bash 脚本无独立测试套件）
upstream_tests:
  - file: installwatch/test-installwatch.c
    source: checkinstall-1.6.2-git20170426.d24a630/installwatch/test-installwatch.c
    description: "installwatch 拦截库自测程序（REFCOUNT 计数验证）。OHOS 上核心 chmod/chown/creat/open 等拦截路径实测通过；chroot 项因 OHOS 沙盒禁止 chroot 系统调用（SIGSYS，SKILL Gotchas E051 环境限制）不可运行"

external_integration_note: "checkinstall 主程序为 bash 脚本（checkinstall.in 经 sed 生成 + makepak），无独立 C 测试；核心可测组件为 installwatch LD_PRELOAD 拦截库。OHOS 实测：自研探针验证 time/creat/chmod/chown/stat/lstat/open/truncate/ftruncate/utime/unlink 等拦截路径全绿；test-installwatch 中 chroot 项受 OHOS 沙盒 seccomp 限制（chroot syscall 被禁止，SIGSYS）无法运行，属平台环境限制非适配缺陷。"

test_package_tests:
  - file: test.sh
    description: "checkinstall --version / installwatch --version 输出校验 + installwatch.so 真实 dlopen/dlsym(__installwatch_timecount) C 探针验证（3 断言）"
    command: "checkinstall --version && installwatch --version && dlopen/dlsym probe"

assertion_count: 3
