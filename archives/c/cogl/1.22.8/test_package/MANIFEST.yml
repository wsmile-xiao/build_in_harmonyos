package: cogl/1.22.8
homepage: "https://gitlab.gnome.org/GNOME/cogl"

# cogl 上游测试共 72 例（conform 注册 52 + conform 未移植 12 + unit 7
# + micro-perf 1，逐文件清点见 test_package/notes.md）。除 3 个纯 CPU
# 用例外均依赖 GL 渲染环境（test_utils_init 需 cogl_context_new +
# framebuffer）；OHOS 无 /dev/dri，cogl_context_new(NULL) 本机实测
# segfault，其余 69 例如实记录省略（0 运行，非失败）。
# 纯 CPU 子集 3 例（test_color_hsl/test_no_gl_header/test_version，
# 源文件零改动归档在 upstream_unit/）由 test_cogl.py 编译并逐个实跑。
upstream_tests: 72
upstream_test_command: "纯 CPU 子集 3/3 实跑通过（test_cogl.py 内编译运行）；其余 69 例需 GL 渲染环境（OHOS 无 /dev/dri，cogl_context_new 实测 segfault）——如实记录未运行（0/69）"

test_package_tests:
  - file: test_cogl.py
    description: "消费测试：libcogl.so 存在 + cogl.h 头文件存在 + 编译链接运行 consumer.c（符号可解析 + 库可加载）+ 上游纯 CPU 子集 3 用例编译并逐个实跑（PASS/FAIL 汇总）"
    command: "python3 test_cogl.py <package_folder>"

assertion_count: 6
