software: cogl
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.22.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 包版本号（1.22.8.1 = 上游 1.22.8 + 适配修复后缀，R37）
# 本轮修复：开启 cogl-pango 组件（补下游 Clutter 的 cogl-pango-1.0 硬依赖断链）
version: "1.22.8.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"

# 构建系统标识（verify-build 要求）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GNOME 官方）
  url: "https://download.gnome.org/sources/cogl/1.22/cogl-1.22.8.tar.xz"

  # 源码校验和
  sha256: "a805b2b019184710ff53d0496f9f0ce6dcca420c141a0f4f6fcc02131581d759"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 构建系统标识（verify-build 要求）
  build_system: autotools

  # 配置选项列表（与 conanfile.py 实际一致：x11/wayland/kms EGL 平台
  # + gst/gdk-pixbuf 禁用，OHOS 无显示服务；cogl 至少需一个 GL 驱动 →
  # --enable-gles2（制品仓 gles2/egl 提供）--disable-gl；
  # --enable-cogl-pango 为 1.22.8.1 的修复核心——下游 Clutter 1.26.4
  # 硬依赖 cogl-pango-1.0 且无开关可关（R36 依赖断链补链）；
  # --disable-cairo 保持：cogl-pango 硬依赖仅 pangocairo，clutter 源码
  # 零处使用 cogl_cairo_*，故 cairo 仅作 pango 传递依赖；
  # unit-tests 编译禁用——白盒用例依赖内部符号，--disable-unit-tests
  # 下 libcogl 不导出，无法对安装包复跑；纯 CPU 消费级用例改由
  # test_package 实跑）
  configure_options:
    - "--disable-glibtest"
    - "--disable-dependency-tracking"
    - "--disable-x11-egl-platform"
    - "--disable-wayland-egl-platform"
    - "--disable-kms-egl-platform"
    - "--disable-xlib-egl-platform"
    - "--enable-null-egl-platform"
    - "--disable-gles1"
    - "--enable-gles2"
    - "--disable-gl"
    - "--disable-cogl-gst"
    - "--enable-cogl-pango"
    - "--disable-gdk-pixbuf"
    - "--disable-cairo"
    - "--disable-gtk-doc"
    - "--disable-introspection"
    - "--disable-unit-tests"

  # 编译依赖列表（cogl 本体硬需 glib；cogl-pango 组件硬需 pangocairo；
  # gles2/egl 为 GL 驱动；cairo 为 pango 传递依赖）
  dependencies:
    - "glib/2.84.0.1"
    - "pango/1.56.4"
    - "cairo/1.18.4"
    - "gles2/2.0.25"
    - "egl/1.0.5"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码 patch，仅配置裁剪）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "1.22.8.1 修复核心：--enable-cogl-pango 产出 cogl-pango-1.0.pc + libcogl-pango.so + cogl-pango.h——下游 Clutter 1.26.4 把它写死在 CLUTTER_BASE_PC_FILES 且无开关可关，1.22.8 的 --disable-cogl-pango 使其 configure 必然失败（R36 依赖断链）"
    - "cogl-pango 硬依赖仅 pangocairo（configure.ac COGL_PANGO_PKG_REQUIRES），不需要 libcogl-cairo——clutter 源码零处使用 cogl_cairo_*，故 --disable-cairo 可保持"
    - "E236/E522：依赖包 libxcb 的 .la 其 dependency_libs 指向已清理的构建机临时目录（libXau.la），libtool 递归读取报 not a valid libtool archive；generate() 建 deps-nola 私有目录（只放依赖 .so 符号链接、无 .la）并置于 extra_ldflags 最前解决"
    - "enable EGL 平台后 cogl 经 pkg-config 取 -lEGL，而制品仓 egl/1.0.5 为静态 libEGL.a（Khronos EGL 的 OHOS 后端是 C++）——须在生成的 egl.pc 的 Libs 中紧跟 -lEGL 追加 -lc++_shared，否则 libcogl.so 残留未解析 std::__n1::mutex 符号、消费者加载 rc=127"
    - "cogl 公共头 cogl-egl-defines.h 在 COGL_HAS_EGL_SUPPORT 下 #include <EGL/eglmesaext.h>（Mesa 专有头，OHOS SDK 无）——须把最小 stub 随包装到 include/EGL/ 与 include/cogl/EGL/（后者因 cogl 自带 cogl-1.0.pc 的 Cflags 为 -I${includedir}/cogl）"
    - "cogl（GNOME 低层 OpenGL 库）核心只硬需 glib；x11/wayland/kms EGL 平台 + cairo/gdk-pixbuf/pango/gst 全禁用（OHOS 无显示服务）；GL 驱动由制品仓 gles2/egl 提供（--enable-gles2 --disable-gl）"
    - "上游测试清点：conform 注册 52 + unported 12 + unit 7（白盒，编译进 libcogl 内部）+ micro-perf 1 = 72 例；纯 CPU 仅 3 例（test_color_hsl/test_no_gl_header/test_version）"
    - "OHOS 无 /dev/dri，cogl_context_new(NULL) 本机直接 segfault（SIGSEGV）——所有走 test_utils_init 的 GL 路径测试（69 例）不可运行，如实记录省略而非失败"
    - "纯 CPU 子集 3/3 由 test_package 对安装包实跑通过；上游 test_version 需内部头 _COGL_STATIC_ASSERT（c11 _Static_assert 原样 shim）+ 空 config.h 桩，测试源文件零改动"
    - "unit 白盒 7 例依赖 libcogl 内部符号（_cogl_bitmask_* 等），--disable-unit-tests 构建下不导出，无法对安装包复跑"
