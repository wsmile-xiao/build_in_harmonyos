package: cbmconvert/2.1.6
homepage: https://github.com/dr-m/cbmconvert

upstream_check_command: "ctest --test-dir b"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir b"
upstream_tests:
  - file: CMakeLists.txt
    source: cbmconvert-2.1.6/CMakeLists.txt
    description: "Official CTest suite: 6 tests (cbmconvert/disk2zip/zip2disk usage, empty_files, small_files, file_names conversion pipelines)"
    command: "ctest --test-dir b"

test_package_tests:
  - file: test.sh
    description: "Consumer test: usage banner plus real D64 image creation from files and back-conversion to Lynx archive"
    command: "bash test.sh"

assertion_count: 4
