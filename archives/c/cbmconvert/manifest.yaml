software: cbmconvert
display: "cbmconvert"
description: "Create, extract and convert 8-bit Commodore binary archives (D64/D71/D81, Lynx, C2N, zip round-trips)"
category: utility
homepage: "https://github.com/dr-m/cbmconvert"
license: GPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake build presented as generic Linux/aarch64 (CMake has no OHOS platform module); portable C only, no external dependencies."
    - "Official 6-test CTest suite runs inside the recipe build and passes on device."
    - "Consumer test performs real D64 image creation and Lynx back-conversion with the installed binaries."
  common_dependencies: []

versions:
  "2.1.6":
    status: built
    build_date: "2026-09-06"
