software: cldump
display: "cldump"
description: "Clarion database files extractor (dumps Clarion .dat to text/SQL/CSV)"
category: utility
homepage: "https://salsa.debian.org/debian/cldump"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "Plain hand-written Makefile in src/ (no configure/install/check targets); single cldump binary"
    - "Patch Makefile to respect environment flags (CFLAGS +=, link with $(LDFLAGS))"
    - "Pass CC from Conan tools.build:compiler_executables via make command line (R33)"
  common_dependencies: []

versions:
  "0.11-dfsg":
    status: built
    build_date: "2026-09-09"
