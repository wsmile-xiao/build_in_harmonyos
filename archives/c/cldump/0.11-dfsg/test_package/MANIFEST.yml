# test_package/MANIFEST.yml — cldump 0.11-dfsg
# CI L0e requires this file to exist.

package: cldump/0.11-dfsg
homepage: "https://salsa.debian.org/debian/cldump"

# 上游源码审计：0.11~dfsg orig.tar.gz 不含任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "源码树 (cldump_0.11~dfsg.orig.tar.gz, 23,417 字节, sha256 a00f6199...944af5)"
    reason: "无 test/、tests/ 目录；全部源码为 src/*.c（11 个）+ src/cldump.h（单一主程序），无测试文件；magic 为数据文件非测试。"
  - source: "src/Makefile（手写非 automake）"
    reason: "仅 all/clean 目标与 %.c/%.o 规则，无 check/test 目标、无 TESTS 变量；make check = No rule to make target。"
  - source: "构建系统与测试框架"
    reason: "无 CMakeLists.txt/meson.build/configure.ac，无 CTest/gtest/pytest 依赖；Debian 0.11~dfsg-8 仅 debian/tests/control 声明、无可执行 autopkgtest。"
  - conclusion: "上游 0.11-dfsg 未提供自动化测试；由 test_package 对打包二进制做消费者视角 CLI 验证（--version/--help/缺参数/不存在文件 4 项真实执行）。"

# 上游无 check/test 目标，无上游测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无官方测试套件；验证手段为 test_package 对打包二进制的真实执行。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_cldump.sh
    description: "真实执行打包的 cldump 二进制：--version 输出 'cldump v0.11'（exit 0）、--help 输出 'Usage:'（exit 0）、无参数退出 3（no filename specified）、不存在文件退出 1（Couldn't open file）"
    command: "bash test_cldump.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
