software: cargo-nextest
display: "cargo-nextest"
description: "A next-generation test runner for Rust projects"
category: build-tool
homepage: "https://nexte.st"
license: MIT OR Apache-2.0
build_system: cargo

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Rust 项目，使用 cargo build --release 编译"
    - "需要 Rust 工具链 (cargo, rustc)"
    - "生成的二进制文件是静态链接的，通常不需要 RPATH"
  common_dependencies:
    - rust

# 版本索引
versions:
  "0.9.110":
    status: published
    build_date: "2026-06-05"
    published_as: cargo-nextest