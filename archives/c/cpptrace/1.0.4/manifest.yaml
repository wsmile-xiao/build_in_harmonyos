version: "1.0.4"
software: cpptrace
status: built
build_date: "2026-09-09"
build_system: cmake

source:
  url: "https://github.com/jeremy-rifkin/cpptrace/archive/refs/tags/v1.0.4.tar.gz"
  sha256: "5c9f5b301e903714a4d01f1057b9543fa540f7bfcc5e3f8bd1748e652e24f9ea"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux（OHOS 无 CMake 平台模块，强制 UNIX 分支）"
    - "-DCPPTRACE_CONAN=ON"
    - "-DCPPTRACE_USE_EXTERNAL_LIBDWARF=ON"
    - "-DCPPTRACE_USE_EXTERNAL_ZSTD=ON"
    - "-DCPPTRACE_USE_EXTERNAL_GTEST=ON"
    - "-DCPPTRACE_UNWIND_WITH_UNWIND=ON"
    - "-DCPPTRACE_GET_SYMBOLS_WITH_LIBDWARF=ON"
    - "-DCPPTRACE_DEMANGLE_WITH_CXXABI=ON"
    - "-DCPPTRACE_BUILD_TESTING=ON"
  dependencies:
    - libdwarf/0.11.1
  test_dependencies:
    - gtest/1.17.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake 无 HarmonyOS 平台模块：cpptrace autoconfig 对 CMAKE_SYSTEM_NAME=HarmonyOS 判非 UNIX，误选 dbghelp 符号化后端导致编译失败（windows.h not found）；强制 CMAKE_SYSTEM_NAME=Linux 走 UNIX 分支即可。"
  - "OHOS musl 编译器默认优化不发射 unwind tables：不带 -funwind-tables 时 _Unwind_Backtrace 返回 0 帧、栈追踪为空；库与消费方均需显式加 -funwind-tables。"
  - "conan CMakeDeps 的 generator expression 按 CONFIG 精确匹配：构建类型必须与 conan profile 的 build_type=Release 严格一致，否则 INTERFACE_INCLUDE_DIRECTORIES 不传导（libdwarf.h file not found）。"
  - "cpptrace 上游原生支持 CPPTRACE_USE_EXTERNAL_GTEST/LIBDWARF/ZSTD 开关，GTest::gtest_main/GTest::gmock_main target 名与 conan gtest 包完全兼容，无需补丁。"
  - "OHOS musl libc 内建 backtrace/backtrace_symbols（execinfo.h），dladdr 可用；符号化走 libdwarf 后端解析 文件名+行号 实测正常。"

verification:
  platform: "HarmonyOS PC arm64"
  profile: "ci/conan/profiles/ohos-aarch64"
  result: pass
  evidence:
    - "conan create 编译并打包 libcpptrace.a（unwind=libgcc unwind、symbols=libdwarf、demangle=cxxabi）。"
    - "上游 GTest 套件 158 个 TEST/TEST_F 声明（144 TEST + 14 TEST_F，17 个翻译单元）中非 MSVC 平台可运行的 155 用例全部通过（155/155，100%）；3 个条件编译排除项：FromCurrent.SEHBasic/SEHCorrectHandler（#ifdef _MSC_VER，Windows SEH 专用）、Stacktrace.InlineResolution（CPPTRACE_GET_SYMBOLS_WITH_LIBDWARF 为库目标 PRIVATE 宏不传播到测试 TU，所有非 MSVC 平台一致排除）。"
    - "integration 输出 37 行 文件名||行号||符号 与 test/expected/linux.txt 结构一致（符号因 libc++ 与 libstdc++ ABI 命名差异不同，文件名+行号 100% 匹配）。"
    - "demo/c_demo/link_test 三个测试可执行 exit=0；test_package 与 test_cpptrace_ohos 消费者测试通过（真实栈展开≥2 帧+符号解析）。"
