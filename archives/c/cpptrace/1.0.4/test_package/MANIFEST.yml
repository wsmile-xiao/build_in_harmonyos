# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
package: cpptrace/1.0.4
homepage: "https://github.com/jeremy-rifkin/cpptrace"

# 上游测试命令（CMake/CTest 项目）
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./unittest && ./integration && ./demo && ./c_demo && ./link_test"

# 上游测试构成（源码审计 test/unit/，tag v1.0.4）
# 158 个 TEST/TEST_F 声明（144 TEST + 14 TEST_F，17 个测试翻译单元）
# 其中 3 个块被上游条件编译排除（非 MSVC 平台）：2 个 #ifdef _MSC_VER SEH 用例
# （FromCurrent.SEHBasic/SEHCorrectHandler）+ Stacktrace.InlineResolution
# （CPPTRACE_GET_SYMBOLS_WITH_LIBDWARF 为库目标 PRIVATE 宏，不传播到测试 TU）
# 非 MSVC 平台可运行 155 个用例
# 另有 integration/demo/c_demo/link_test 四个测试可执行（exit code 校验）
# CXX20 module 变体（unittest_module 等）需要 Clang>=16 + C++20，OHOS clang15/C++17 不实例化
upstream_tests:
  - file: test/unit/main.cpp + 17 个测试源文件
    source: cpptrace-1.0.4/test/unit/
    description: "GTest 套件：158 个 TEST/TEST_F 声明（144 TEST + 14 TEST_F，24 套件），非 MSVC 平台条件编译后可运行 155 用例（tracing 36/internals 61/lib 58）；排除项：SEHBasic/SEHCorrectHandler（#ifdef _MSC_VER）、InlineResolution（libdwarf PRIVATE 宏）"
    command: "./unittest"
  - file: test/integration.cpp
    source: cpptrace-1.0.4/test/integration.cpp
    description: "集成自检：生成栈追踪并输出 文件名||行号||符号，对照 test/expected/linux.txt 结构"
    command: "./integration"
  - file: test/demo.cpp
    source: cpptrace-1.0.4/test/demo.cpp
    description: "演示程序：异常栈追踪（含内联帧解析）"
    command: "./demo"
  - file: test/ctrace_demo.c
    source: cpptrace-1.0.4/test/ctrace_demo.c
    description: "C API（ctrace.h）演示：栈追踪生成与释放"
    command: "./c_demo"
  - file: test/link_test.cpp
    source: cpptrace-1.0.4/test/link_test.cpp
    description: "链接完整性：所有公共符号可解析"
    command: "./link_test"

# 上游源码声明总数（TEST/TEST_F 计数）与实例化数
source_declared_total: 158
configured_executable_total: 5
executed_passed_total: 155

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：版本宏 + stacktrace 对象 API + frame 渲染"
    command: "./test_package"
  - file: test_ohos.cpp
    description: "OHOS 专项：真实栈展开（≥2 帧）+ 符号解析运行验证"
    command: "./test_cpptrace_ohos"

assertion_count: 8
