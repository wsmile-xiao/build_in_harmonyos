software: cpptrace
display: "cpptrace"
description: "Lightweight and portable C++11 stack tracing library with symbol resolution (libdwarf backend)"
category: debug
homepage: "https://github.com/jeremy-rifkin/cpptrace"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 无 OHOS 平台模块：CMAKE_SYSTEM_NAME 强制为 Linux 使上游 autoconfig 走 UNIX 分支（libgcc unwind + libdwarf + cxxabi）"
    - "OHOS musl 默认不发射 unwind tables：测试与库编译需 -funwind-tables，否则栈展开为空"
    - "外置依赖模式：CPPTRACE_USE_EXTERNAL_LIBDWARF/ZSTD/GTEST=ON + CPPTRACE_CONAN=ON，避免 FetchContent 网络下载"
    - "CMakeDeps generator expression 需 build_type 严格对齐（Release）"
  common_dependencies:
    - libdwarf

versions:
  "1.0.4":
    status: built
    build_date: "2026-09-09"
    conan_ref: "cpptrace/1.0.4"
