build:
  system: manual
  configure_options: []
  dependencies: []
  cc: "aarch64-unknown-linux-ohos-clang"
  cxx: ""

patches_applied: []

knowledge_gained:
  - "OHOS设备缺少automake/aclocal/libtoolize，无法运行autoreconf；改为手工创建config.h和gitrev.c，用clang直接编译main.c"
  - "OHOS /usr/bin/printf是toybox，不支持 %[N]s 位置参数；csvprintf的test-column-names-1.tst依赖此特性，需将PRINTF_PROGRAM指向GNU coreutils printf（~/usr/local/bin/printf）"
  - "OHOS bash子进程cwd异常（getcwd: cannot access parent directories），上游run.sh/run2.sh用bash数组语法；用Python脚本包装测试以避免bash环境噪声"
  - "xsltproc在/data/service/hnp/bin可用，但run.sh的xml2csv round-trip测试依赖ISO-8859-1编码转换，OHOS玩具box iconv支持有限"
