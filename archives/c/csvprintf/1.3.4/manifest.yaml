# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS不支持硬链接(ln)，需改为rm -f && ln -s(软链接)"
  - "HMDFS上umask 077创建的目录无法写入文件(E046)，需改为umask 000"
  - "HMDFS不支持sed -i，需使用perl -pi替代"
  - "原始tarball缺少configure脚本，需要autoreconf -fi bootstrap"
  - "tests/run2.sh使用/bin/bash需改为/data/service/hnp/bin/bash"
  - "CONFIG_SHELL=/data/service/hnp/bin/bash是HMDFS必需的"

