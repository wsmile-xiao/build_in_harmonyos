# test_package/MANIFEST.yml — upstream official test declaration
package: csvprintf/1.3.4
homepage: https://github.com/archiecobbs/csvprintf

# Upstream test command (logical; actual execution is in conanfile.py build())
upstream_check_command: "make tests"

# conanfile.py build() integrates upstream tests
upstream_test_in_build: true
upstream_test_command: "Python-driven wrapper of tests/run.sh + tests/run2.sh"

# Upstream test suite breakdown
# Suite 1 (tests/run.sh): 9 .in files × 8 flag variants = 72 subtests
# Suite 2 (tests/run2.sh): 11 .tst files              = 11 subtests
# Total = 83
upstream_tests:
  - file: tests/run.sh
    source: csvprintf-1.3.4/tests/run.sh
    description: "Main test suite: 9 input CSV files × 8 output-mode variants"
    command: "bash tests/run.sh"
  - file: tests/run2.sh
    source: csvprintf-1.3.4/tests/run2.sh
    description: "Bash-style unit tests: 11 .tst files covering flags, escaping, modes"
    command: "bash tests/run2.sh"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Smoke test: --version, --help, CSV→XML, CSV→JSON, CSV→bash"
    command: "sh test.sh"

assertion_count: 83
