# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "DIGEST-MD5 是唯一链接外部密码库的 SASL 机制：plugins/Makefile.am 的 $(LIB_DES) 由 m4/kerberos_v4.m4 (SASL_DES_CHK) 解析，先探 libcrypto 的 des_cbc_encrypt、再探 DES_cbc_encrypt；命中后 LIB_DES=-lcrypto 且定义 WITH_SSL_DES。上游在探测失败时只告警（No DES support for DIGEST-MD5）仍会构建 auth-only 机制，故配方 configure 后必须断言 WITH_SSL_DES"
  - "内置 patch-autotools-ohos.pl 假设较新 config.guess 的 GUESS= 变量惯用法；cyrus-sasl 2.1.28 自带 config.guess 为 2018-02-24 版，各分支以 echo <triplet>; exit ;; 结束，脚本插入的 arm 只赋值 GUESS 而不输出 → 静默无效（脚本自身打印 [ok]）。需按本版惯用法改写"
  - "config.sub(2018-02-22) 需两处修改才能接受 aarch64-unknown-linux-ohos：maybe_os 的 linux-ohos* 与 os 合法列表的 -linux-ohos*（后者必须先于通用 -linux*) 规则命中，否则被改写为 linux-gnu）"
  - "HMDFS 对新建目录强制 setgid，autoconf 的 umask 077 && mktemp -d ./confXXXXXX 会产生属主不可写目录，config.status 报 can't create ./conf*/subs1.awk: Permission denied（知识 E129）；配方 configure 前 sed umask 077→022"
  - "configure 用 AC_PROG_CC_FOR_BUILD 裸搜 gcc/cc/cl.exe，OHOS 只有 clang，需显式喂 CC_FOR_BUILD/CPP_FOR_BUILD"
  - "--with-staticsasl 会强制 enable_shared=yes（configure.ac 显式改写），静态包必须用 --disable-shared --enable-static --without-staticsasl；此时 DO_DLOPEN 未定义，机制经 lib/staticopen.h 静态注册，运行期无需 SASL_PATH/dlopen"

