# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cyrus-sasl-digestmd5/2.1.28
homepage: "https://www.cyrusimap.org/sasl/"

# 上游测试套件存在性（经审计上游源码确认：有手工测试台，无自动化测试目标）
upstream_tests_exist: true

# 上游测试审计（源码: cyrus-sasl-2.1.28.tar.gz,
# sha256 7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c）
upstream_test_audit:
  source_tarball: "cyrus-sasl-2.1.28.tar.gz"
  source_sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"
  scanned_for:
    - "check_PROGRAMS / TESTS (automake make check)"
    - "check-local / check-am / check: 目标"
    - "add_test / enable_testing (ctest)"
    - "meson test wiring"
    - "pytest def test_"
  scan_result: "0 matches — 全树 Makefile.am 无 TESTS/check_PROGRAMS/check 目标；无 CMakeLists.txt / meson.build / test_*.py；上游无自动化测试注册"
  entry_points:
    - "utils/testsuite.c（utils/Makefile.am:49 EXTRA_PROGRAMS = … testsuite …；:67 testsuite_LDADD = $(all_sasl_libs)）— 自包含断言测试台，fatal() 失败即 exit 3，需手工调用"
    - "utils/testsuitestatic（utils/Makefile.am:71-73，直链 ../lib/.libs/libsasl2.a）— 同套件静态链接版"
    - "utils/pluginviewer（utils/Makefile.am:48,64）— 机制枚举器（本包在 build() 中作为冒烟检查执行）"
    - "utils/smtptest（utils/Makefile.am:49,75-77）— 依赖外部 SFIO 库（#include <sfio.h>），制品仓无该库，无法构建"
    - "utils/saslpasswd2 / utils/sasldblistusers2（utils/Makefile.am:49,59-62）— 口令库工具，需 dblib"
    - "sample/client, sample/server, sample/http_digest_client（sample/Makefile.am:47 noinst_PROGRAMS）— 上游示例程序"
    - "sample/sample-client, sample/sample-server（sample/Makefile.am:48 EXTRA_PROGRAMS）— 上游示例程序"
    - "saslauthd/testsaslauthd — 需运行中的 saslauthd 守护进程（本包 --without-saslauthd 不构建）"
  reason: >
    cyrus-sasl 2.1.28 不注册任何自动化测试目标。上游唯一自包含断言测试台是
    utils/testsuite.c（EXTRA_PROGRAMS），其首个用例 test_checkpass 需要已初始化的
    sasldb 口令库（源码 NOTE 原文："Must be able to read sasldb, which needs to be
    setup with a username and a password"）。本包是 DIGEST-MD5 机制的最小闭包构建
    （--with-dblib=none，auxprop/口令库属独立后端包），故该前置用例在本配置下不成立，
    配方与证据中如实记录（见 reports/upstream-tests.md），不作"原样通过"声明。

# 上游测试命令（无 make check 目标；手工测试台由配方 build() 执行并留痕）
upstream_check_command: "make -C utils testsuite && SASL_PATH=<empty-dir> ./utils/testsuite"

# 上游测试是否已集成进 conanfile.py build()
upstream_test_in_build: true
upstream_test_command: "make -C utils testsuite + ./utils/testsuite（HMBS_UPSTREAM_TEST_RESULT 留痕）"

# 上游实际运行的测试程序（见 reports/upstream-tests.md 的逐项读数）
upstream_tests:
  - program: "utils/pluginviewer"
    args: "-c / -s"
    description: "客户端/服务端机制枚举（静态机制表，SASL_PATH 置空）"
  - program: "utils/testsuite"
    args: "（无参数）/ -n / -a 变体"
    description: "自包含断言测试台；首例 test_checkpass 需 sasldb 口令库"
  - program: "utils/testsuitestatic"
    args: "（无参数）"
    description: "同套件静态链接版"
  - program: "sample/sample-server, sample/sample-client, sample/client, sample/server, sample/http_digest_client"
    args: ""
    description: "上游示例程序（client 系样例在 musl/OHOS 上需 getpass 兼容 shim，见 notes.md）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_digestmd5.c
    description: >
      消费者测试 8 项：版本 2.1 / sasl_client_init / sasl_client_new /
      客户端机制列表枚举 / sasl_server_init / 服务端机制列表含 DIGEST-MD5（本包核心）/
      [鸿蒙特有] SASL_PATH 指向空目录（无 dlopen 插件目录）时 DIGEST-MD5 仍可用
      —— 证明其来自 libsasl2.a 静态机制表 /
      [鸿蒙特有] OpenSSL DES 提供方（DIGEST-MD5 机密性层 LIB_DES=-lcrypto 绑定的
      DES_key_sched / DES_cbc_encrypt 入口）经包传播的链接闭包可解析
    command: "./test_digestmd5"
  - file: test_digestmd5.c
    description: "鸿蒙特有用例数 = 2（ohos-static-mechanism-table-no-dlopen、ohos-openssl-des-provider）"

# 测试断言总数（test_package 消费者检查项）
assertion_count: 8

# 构建期上游工具冒烟（conanfile.py build()）
build_time_smoke:
  - program: "utils/pluginviewer -c"
    assertion: "输出含 'DIGEST-MD5' 且含 'best SSF: 128'（后者证明 DES 机密性层 WITH_SSL_DES 已生效；auth-only 机制会是 0）"
    environment: "SASL_PATH 指向空目录（静态机制表）"

