# 软件级 manifest
# 文件位置: archives/c/cyrus-sasl-digestmd5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: cyrus-sasl-digestmd5

# 显示名
display: "Cyrus SASL DIGEST-MD5 mechanism"

# 一句话描述
description: "Cyrus SASL DIGEST-MD5 authentication mechanism (libsasl2 with DIGEST-MD5 support)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: security

# 官网 URL
homepage: "https://www.cyrusimap.org/sasl/"

# 开源许可证（SPDX 标识）
license: "BSD-Attribution-HPND-disclaimer"

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "DIGEST-MD5 的机密性层（qop=auth-conf）是 cyrus-sasl 机制中唯一的外部库链接项：$(LIB_DES) → OpenSSL libcrypto（LIB_DES=-lcrypto, WITH_SSL_DES）"
    - "config.guess 不识别 uname -s=HarmonyOS；按 E007 打补丁产出 aarch64-unknown-linux-ohos，禁止 --build/--host 绕过"
    - "内置 patch-autotools-ohos.pl 对 2018 版 config.guess 的 echo/exit 分支惯用法静默失效，需按本版改写"
    - "HMDFS setgid + autoconf umask 077 → config.status 属主不可写目录（E129），configure 前改 umask 022"
    - "configure 需显式喂 CC_FOR_BUILD=clang（OHOS 无 gcc/cc）"
    - "静态构建 --disable-shared --enable-static --without-staticsasl，机制经 lib/staticopen.h 静态注册，无需运行期 SASL_PATH/dlopen"

  # 跨版本通用依赖
  common_dependencies:
    - "openssl/3.5.6"

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.1.28":
    status: built
    build_date: "2026-09-26"
    conan_ref: "cyrus-sasl-digestmd5/2.1.28"
    note: "DIGEST-MD5 机制首个适配版本（含 DES/OpenSSL 机密性层）；待真机/CI 验证后按流程发布"
