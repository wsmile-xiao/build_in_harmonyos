# conandata.yml — crashmail 1.7 (CrashMail II)
#
# 源码来源说明（不含裸 URL：CI 预下载器会无边界抓取 sources 之外的 URL）
#
# 上游正式源是 SourceForge ftnapps 项目（Homepage 见包级 manifest.yaml）。
# CI worker 出网白名单极窄且 conan 的镜像表对 SourceForge 域无任何兜底
# （build_and_test.sh get_mirrors() 对该域直接 return [url]），实测同域
# 兄弟包超时 360s 后失败。因此这里改用 Debian 官方制品库中同源的
# orig tarball，两条 URL 的内容已逐字节核对：
#
#   上游 tarball  crashmail-1.7.tar.gz     177765 字节
#                 sha256 fbe5cafa4022c8651c9e97356d4e20540805e535ce1ec28df4d67a45e0233c7d
#   本配方采用    crashmail_1.7.orig.tar.gz 177765 字节
#                 sha256 3d073b82bd2568fd17bfc8944f1a0a12b5e5e1b3841d43ed6683370084bc1a1c
#
#   两者只有 gzip 容器头的 mtime 不同（1f8b0800_43204d5b vs 1f8b0800_00000000），
#   解压后的 tar 载荷逐字节一致：
#     sha256 d6a78777469a822e1e7d8f126f5421cbb0d43848e25b3a4291a2a75d3aa01912
#     942080 字节 / 169 个成员 / 顶层目录 crashmail-1.7

sources:
  url: "https://deb.debian.org/debian/pool/main/c/crashmail/crashmail_1.7.orig.tar.gz"
  sha256: "3d073b82bd2568fd17bfc8944f1a0a12b5e5e1b3841d43ed6683370084bc1a1c"

patches:
  - patch_file: "patches/0001-src-Makefile.linux.patch"
    patch_description: "Let the compiler binary be overridden through CC_BIN instead of the hard-wired gcc in the top-level source makefile"
    patch_type: "portability"
  - patch_file: "patches/0002-src-cmnllib-Makefile.linux.patch"
    patch_description: "Let the compiler binary be overridden through CC_BIN in the cmnllib makefile"
    patch_type: "portability"
  - patch_file: "patches/0003-src-crashmail-handle.c.patch"
    patch_description: "Make the file-local timestamp counter lastt static in handle.c so it no longer collides with the tentative definition of the same name in pkt.c"
    patch_type: "bugfix"
  - patch_file: "patches/0004-src-crashmail-pkt.c.patch"
    patch_description: "Make the file-local timestamp counter lastt static in pkt.c so it no longer collides with the tentative definition of the same name in handle.c"
    patch_type: "bugfix"
  - patch_file: "patches/0005-src-jamlib-Makefile.linux.patch"
    patch_description: "Let the compiler binary be overridden through CC_BIN in the jamlib makefile"
    patch_type: "portability"
  - patch_file: "patches/0006-src-jamlib-mbase.c.patch"
    patch_description: "Include fcntl.h in jamlib mbase.c because musl sys/file.h does not provide struct flock or F_SETLK"
    patch_type: "portability"
  - patch_file: "patches/0007-src-oslib_linux-Makefile.patch"
    patch_description: "Let the compiler binary be overridden through CC_BIN in the oslib_linux makefile"
    patch_type: "portability"
  - patch_file: "patches/0008-tests-roundup.patch"
    patch_description: "Widen the roundup temp-dir template from three X to six X because toybox mktemp requires exactly six and the CI worker resolves mktemp to toybox"
    patch_type: "portability"
