# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: crashmail/1.7
homepage: "http://ftnapps.sourceforge.net/crashmail.html"

# 上游测试入口。上游 tests/Makefile 写的是 `./roundup`，而 tests/roundup
# 的 shebang 是 `#!/bin/bash`，OHOS 没有 /bin/bash，因此改用 PATH/CONFIG_SHELL
# 解析出的 bash 显式启动同一套件。
#
# 全部 18 个 it_* 用例、断言与测试逻辑均未改动。对上游测试基础设施只有一处
# 改动：roundup 建临时目录的模板 `.roundup.XXX` → `.roundup.XXXXXX`
# （补丁 0008-tests-roundup.patch），因为 toybox 的 mktemp 要求恰好 6 个 X，
# 而 CI worker 上没有 coreutils 的 mktemp。设备上因 PATH 命中 coreutils
# 而全绿，worker 上未打补丁时 rc=1 且报 `mktemp: need XXXXXX: Not supported`。
# 计数命令（在源码树 tests/ 下执行）：
#   bash ./roundup 2>&1 | tail -1
#   -> Tests:    18 | Passed:   18 | Skipped:    0 | Failed:    0
upstream_check_command: "bash ./roundup"

# conanfile.py 的 build() 中已集成上游测试（tests/ 5 个 test plan）
upstream_test_in_build: true
upstream_test_command: "bash ./roundup"

# 上游实际运行的测试计划（tests/roundup 依次 source 的 5 个 plan 文件，
# 统计单位为 roundup 的 it_* 用例）
upstream_tests:
  - "tests/01-nodelist-test.sh"
  - "tests/02-crashwrite-test.sh"
  - "tests/03-crashmail-test.sh"
  - "tests/04-crashstats-test.sh"
  - "tests/05-areafix-test.sh"

# 上游用例分母（roundup 汇总行 "Tests: N"）
upstream_case_count: 18
upstream_case_count_command: "bash ./roundup 2>&1 | tail -1"

# test_package 中自带的测试（消费者视角，运行已安装的 8 个可执行文件）
test_package_tests:
  - file: test.sh
    description: >-
      真实执行安装后的 crashmail/crashlist/crashgetnode/crashwrite/crashstats：
      版本指纹 + nodelist 索引生成 + 点位与节点解析逐字节比对 +
      type-2+ 包生成（magic 0200）+ toss 投递到 netmail 区 + 统计输出
    command: "bash test.sh"

# 测试断言总数（A1..A8，见 test.sh 中 ok/fail 调用）
assertion_count: 8
