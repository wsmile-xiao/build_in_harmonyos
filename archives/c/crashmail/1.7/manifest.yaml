knowledge_gained:
  - "手写 Makefile 的 CC 是复合定义（gcc 拼上全部 flags）时 命令行 make CC=clang 会整条替换该定义并丢掉上游自己的 $(DEFS) 与 -I 表现为找不到头文件；改法是加 CC_BIN ?= gcc 旋钮只重定向编译器本体 递归构建需逐个子目录 makefile 一起改"  # knowledge_ref: E568
  - "musl 的 <sys/file.h> 不传递包含 <fcntl.h> glibc 上隐式可见的 struct flock/F_SETLK/F_WRLCK 与 fcntl() 原型在 OHOS 上变成 incomplete type 与未声明标识符；在原有平台条件块内显式 include fcntl.h 即可 平台中立无需 __OHOS__ 分支"  # knowledge_ref: E569
  - "clang 15 默认 -fno-common（GCC<10 默认 -fcommon）同一符号在两个编译单元里的试探性定义会从静默合体变成重复符号链接错误；本例 lastt 在两处本应是各自文件私有的计数器 故改为 static（若两处本意是共享同一符号则按 E491 改为 extern 声明加单一定义）"  # reference: E491
  - "OHOS lld 产物自带 .codesign 段 链接后对其签名范围内的任何字节改写都会使签名失效 内核拒绝 exec 报 Operation not permitted（退出码 126）；上游 makefile 自带的 strip 步骤因此必须关闭（STRIP=:）而不是 strip 后重新签名"  # knowledge_ref: DRAFT-ohos-elf-skip-strip-codesign
  - "上游测试入口的 shebang 写成 #!/bin/bash 而 OHOS 没有 /bin/bash（bash 在 /data/service/hnp/bin/bash）时 用 PATH 或 CONFIG_SHELL 解析出的 bash 显式启动同一套件即可 不必改动上游用例 也不要把本机绝对路径写成通用结论"  # reference: E165

# 补丁生成溯源。只保留与执行机无关且可复现的字段：`source_orig_hash` 是
# refresh_patch.py 的 _compute_hash() 对「纯净上游 + conandata 全部补丁」基线树
# 的聚合（可复现）；`source_work_hash` 依赖探索期可变的 scratch 目录，跨轮不可
# 复现，故不记录；本机绝对路径（/storage/Users/... 与 $HOME/builds/...）一律不入
# 提交——CI 不读本文件，这些路径对复核者无意义且属机器本地信息。
