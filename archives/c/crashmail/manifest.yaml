software: crashmail
display: "CrashMail II"
description: "FidoNet 邮件处理器（tosser/scanner）套件：投递、扫描、打包入站邮件并维护消息区"
category: network
homepage: "http://ftnapps.sourceforge.net/crashmail.html"
license: "LicenseRef-CrashMail-permissive AND LGPL-2.1-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游是手写递归 GNU Makefile（非 autotools/cmake/meson），按平台分发：make linux 构建 POSIX 实现并产出 8 个可执行文件"
    - "make linux 的 CC 被写成「gcc + 全部 flags」的复合值，命令行 make CC=clang 会整体替换并丢掉 $(DEFS) 与 -I；补丁引入 CC_BIN 只重定向编译器本体"
    - "OHOS lld 产物带 .codesign 段，其头部记录签名时的镜像长度；链接后对该范围内任何字节改写都会失效，内核拒绝 exec 报 Operation not permitted（126），因此必须 STRIP=:"
    - "musl 的 <sys/file.h> 不再传递引入 <fcntl.h>，jamlib 的 mbase.c 需显式 include"
    - "clang 15 默认 -fno-common，两个编译单元里同名试探性定义从静默合体变成重复符号错误（lastt 应改 static）"
    - "tests/roundup 的 shebang 是 #!/bin/bash 而 OHOS 无 /bin/bash，需用 PATH/CONFIG_SHELL 解析出的 bash 显式启动"
    - "toybox 的 mktemp 要求模板恰好 6 个 X（coreutils 接受 ≥3），上游 roundup 用的 .roundup.XXX 在 CI worker（toybox mktemp）上直接失败——设备上 PATH 命中 coreutils 故本地全绿"
    - "OHOS clang/lld 默认产物已是 PIE + GNU_RELRO + BIND_NOW + NX，无需额外加固 flags"
  common_dependencies: []

versions:
  "1.7":
    status: built
    build_date: "2026-09-10"
    conan_ref: "crashmail/1.7"
