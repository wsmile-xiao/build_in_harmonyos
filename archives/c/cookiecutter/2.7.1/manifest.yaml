software: cookiecutter
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.7.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.7.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-31"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (上游 tag 带前缀 v)
  url: "https://github.com/cookiecutter/cookiecutter/archive/refs/tags/v2.7.1.tar.gz"

  # 源码校验和
  sha256: "ad22b0a6355e208a614ae0285268a6b612938935f1d29ec9edab85c6053c7224"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "pip install --target=install"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "python/3.10"
    - "pip/latest"

  # 编译器
  cc: python
  cxx: python

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cookiecutter is a pure Python package"
  - "Requires Python >= 3.10"
  - "Built using pip install --target"
  - "Main dependencies: Jinja2, click, requests, python-slugify"