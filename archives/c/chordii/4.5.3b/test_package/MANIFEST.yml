# test_package/MANIFEST.yml
# Upstream test declaration file.
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: chordii/4.5.3b
homepage: "https://sourceforge.net/projects/chordii/"

# Upstream test command (src/Makefile.am defines TESTS = test/above.sh
# test/below.sh test/passthrough.sh, executed by automake's parallel test
# harness through the top-level `check` target)
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream test programs actually run
upstream_tests:
  - file: above.sh
    source: chordii-4.5.3b/src/test/above.sh
    description: "a2crd: conversion of chords placed above lyrics, diff vs expected output"
    command: "make check"
  - file: below.sh
    source: chordii-4.5.3b/src/test/below.sh
    description: "a2crd: conversion of titles and chords below lyrics, diff vs expected output"
    command: "make check"
  - file: passthrough.sh
    source: chordii-4.5.3b/src/test/passthrough.sh
    description: "a2crd: Chordii directives are ignored in input, diff vs expected output"
    command: "make check"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_chordii.sh
    description: "Format ChordPro fixture to PostScript (%!PS header, title and lyrics present); a2crd conversion preserves chord directives"
    command: "conan test"

# Approximate assertion count for quality assessment
# (upstream: 3 diff-based tests; consumer: 4 checks)
assertion_count: 7
