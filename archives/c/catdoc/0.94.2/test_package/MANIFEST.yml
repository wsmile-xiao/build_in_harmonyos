summary:
  purpose: smoke-test the three catdoc executables (catdoc, xls2csv, catppt)
  assertions: 5
  must_pass: 5
details:
  - name: version_output
    description: "catdoc -V prints 'Catdoc Version'"
    fail_hint: "Binary missing, wrong PATH, or version string format changed upstream."
  - name: usage_output
    description: "catdoc with no args runs (prints Usage or charset error)"
    fail_hint: "Binary crashes or produces no output."
  - name: xls2csv_version
    description: "xls2csv -V prints 'Catdoc Version'"
    fail_hint: "xls2csv binary missing or broken."
  - name: catppt_version
    description: "catppt -V prints 'Catdoc Version'"
    fail_hint: "catppt binary missing or broken."
  - name: charset_listing
    description: "catdoc -l runs without crashing"
    fail_hint: "Binary crashes when listing charsets."
