software: catdoc
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.95/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游最新版——清单 1.0.0 与上游不一致，按用户指示用真实版本 0.95）
version: "0.95"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-24"

# 构建系统标识（verify-build 要求）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian snapshot 官方归档——wagner.pp.ru 官方源）
  url: "https://snapshot.debian.org/archive/debian/20250616T204926Z/pool/main/c/catdoc/catdoc_0.95.orig.tar.gz"

  # 源码校验和
  sha256: "0d6ef66ff18d93915e62d77845194ba92bf49b60305c51f866a6f55421e37a79"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 构建系统标识（verify-build 要求）
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-gnu（config.guess 不识 HarmonyOS——ncurses/boa 同款）"

  # 编译依赖列表（格式: name/version）——依赖仅 libc，无 Conan 依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码 patch——configure --build 三元组解决）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "catdoc 0.95（MS Office 文本提取）依赖仅 libc——config.guess 不识 HarmonyOS 用 --build=aarch64-unknown-linux-gnu"
    - "上游无测试套件（0/0 如实）——consumption test 验证 catdoc/catppt/xls2csv/wordview 可执行 + usage"
