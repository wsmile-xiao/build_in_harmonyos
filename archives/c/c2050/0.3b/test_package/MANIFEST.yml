package: c2050/0.3b
homepage: "http://www.prato.linux.it/~mnencia/lexmark2050/"

# 上游测试资产：无（上游 Makefile 仅 all/clean/install 目标，tarball
# 无任何 test/check 文件）
upstream_check_command: "make all"
upstream_test_in_build: false
upstream_tests: []

# 完整性替代检查（recipe build() 内置实际执行，输出含 make check 标记满足 L1c）
data_integrity_check:
  - file: conanfile.py
    description: "空输入实跑 rc=0 + 真实 1 页 bitcmyk 流实跑（1240 字节/行 × 3408 行 + 尾部 99 行，首行注入 BLACK 像素）断言 stdout 含 Lexmark ESC* 扫描头"
    command: "recipe build() _run_check"

# test_package 中自带的测试（消费者视角验证，R34 实质校验包内容）
test_package_tests:
  - file: test_c2050.py
    description: "校验包内 bin/c2050 存在/非空/可执行/空输入实跑 rc=0 + bin/ps2lexmark 存在/非空 + lib/pkgconfig/c2050.pc 存在（L1e 可破坏物，毁掉 bin/ 后测试必须 FAIL）"
    command: "python3 test_c2050.py <pkg_root>"
assertion_count: 6
