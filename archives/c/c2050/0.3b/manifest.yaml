# 版本级 manifest
# 文件位置: archives/c/c2050/0.3b/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3b"

# 软件名
software: "c2050"

# 编译状态
# published | built | failed | archived
# 本地实测状态；CI 结果出来后按 CI 实际结果更新
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: make

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 源码池——上游官网失联，Debian watch 标注
  # upstream dead，官方发布走 Debian 源码包 orig tarball，
  # 顶层目录 c2050-0.3b/）
  url: "https://deb.debian.org/debian/pool/main/c/c2050/c2050_0.3b.orig.tar.gz"

  # 源码校验和（本地 = 上游 .dsc 记录逐字节一致已核验）
  sha256: "58114ab76431c7cee46061ba9a46add375b4e2660095e6d747048ddf5629add5"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游极简 GNU Makefile：all/clean/install，无 check 目标）
  system: make

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # 无外部库（Makefile LDLIBS= 为空，仅 stdio/stdlib/string 系统头），
  # 无 registry 构建依赖
  dependencies: []

  # 编译器（经 make 变量 CC/LD 覆盖为 OHOS 工具链）
  cc: clang (OHOS)
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零补丁，上游源码原样构建）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游官网失联（upstream dead）的极老 C 单文件程序：取 Debian pool 的 orig tarball 作官方源，sha256 与 .dsc 逐字节核对；构建经 make 变量 CC/LD 覆盖 OHOS 工具链即可，零补丁"
  - "无 test 目标的过滤器型单文件 C 程序（stdin->stdout 像素流转换器）的 build() 完整性检查应生成真实格式输入实跑：c2050 吃 ghostscript bitcmyk 裸流（每行 GS_PAGE_WIDTH/2=1240 字节 nibble 打包、PAGE_HEIGHT=3408 行/页 + 尾部 (GS_PAGE_HEIGHT-PAGE_HEIGHT)*GS_PAGE_WIDTH/2 字节），断言 stdout 含 Lexmark ESC* 扫描头而非只看 rc"
