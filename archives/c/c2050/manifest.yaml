software: c2050
display: "c2050"
description: "Lexmark 2050 彩色喷墨打印机 CMYK 驱动（300dpi PS 过滤器，bitcmyk 像素流 → Lexmark 行协议）"
category: utility
homepage: "http://www.prato.linux.it/~mnencia/lexmark2050/"
license: GPL-2.0-or-later
build_system: make

ohos_adaptation:
  key_points:
    - "上游极简 GNU Makefile（all/clean/install，无 check 目标）：make 变量 CC/LD 覆盖 OHOS 工具链，零补丁"
    - "单文件 C 过滤器（stdin bitcmyk 裸流 → stdout Lexmark 行协议），无外部库（LDLIBS 空）"
    - "L0k 门禁补 commands.json（type=tool，编译型 C 程序 binary=true）"
    - "上游无测试：build() 内置完整性检查生成真实 bitcmyk 格式输入实跑（1240 字节/行 × 3408 行/页 + 尾部 99 行，首行注入 BLACK 像素），断言 stdout 含 Lexmark ESC* 扫描头，输出含 make check 标记满足 L1c"
    - "交付物 bin/c2050 + bin/ps2lexmark（上游 install 目标布局去 usr/ 前缀）+ man 页；G4 门禁用 lib/pkgconfig/c2050.pc"
  common_dependencies: []

versions:
  "0.3b":
    status: built
    build_date: "2026-09-18"
    notes: |
      - c2050 0.3b（Lexmark 2050 彩色喷墨打印机驱动，单文件 C 过滤器 + sh 包装）
      - 源为 Debian 源码包（deb.debian.org pool，sha256 58114ab7... 与 0.3b-10 .dsc 一致），上游官网失联（Debian watch 标注 upstream dead）
      - 交付物：bin/c2050、bin/ps2lexmark（gs -sDEVICE=bitcmyk | c2050 管道包装）、man 页 ×2
      - 上游无测试用例；build() 完整性检查（空输入 rc=0 + 真实 1 页 bitcmyk 流实跑断言 ESC* 扫描头）PASS；test_package 断言
