# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cpp-datetime-library/1.0.2
homepage: "https://github.com/jeremydumais/CPP-DateTime-library"

# 上游测试命令 (用于 ctest -N / gtest 分析)
upstream_check_command: "cmake -DBUILD_TESTING=ON && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (gtest, 191 用例全部通过)
upstream_tests:
  - file: datetime_unittest.cpp
    source: cpp-datetime-library-1.0.2/test/datetime_unittest/datetime_unittest.cpp
    description: "datetime 类构造函数/格式化/加减日期/闰年等 117 个 TEST 用例"
    command: "./datetime_tests"
  - file: timespan_unittest.cpp
    source: cpp-datetime-library-1.0.2/test/datetime_unittest/timespan_unittest.cpp
    description: "timespan 类构造/总秒分时换算/比较运算符等 74 个 TEST 用例"
    command: "./datetime_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：通过公开头文件/API 构建、链接并运行，验证 datetime/timespan 公开 API"
    command: "./test_cpp-datetime-library"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
