software: cronie
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.7.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.7.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/cronie-1.7.2.tar.gz"

  # 源码校验和
  sha256: "241ecc1dcd8d4b2a6744fe93509932254d20b7bb9d979d27429809493806357f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=~/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-ohos-passwd-fallback.patch"
  - desc: "crontab passwd检查OHOS适配"
  - location: "src/crontab.c"
  - lines: "230-254"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 文件系统上 mktemp 创建的临时目录权限异常，需要手动创建固定临时目录"
  - "automake 1.17 Perl 模块不兼容，建议使用 1.16.5 或预先生成 configure"
  - "autotools 项目在 HMDFS 上需要修改 config.status 使用固定临时目录"
  - "可使用 sed 修改 configure/config.status 中的 ac_tmp 变量绕过临时目录限制"
  - "OHOS 用户 UID 不在 /etc/passwd 中，需要为 getpwuid 调用添加 fallback 机制"
  - "使用 #ifdef __OHOS__ 宏实现平台特定代码，保持跨平台兼容性"
  - "crontab 工具通过 getpwuid 获取用户信息，OHOS 需要 fallback 到环境变量"

# ============================================================
# 测试信息
# ============================================================

# 功能测试结果
test_results:
  test_date: "2026-05-26"
  test_status: "partial_fixed"  # full | partial | partial_fixed | blocked

  # 修复后最终测试状态
  final_status:
    overall: "大部分功能可用"
    fixed_components: ["crontab"]
    blocked_components: ["crond (setuid限制)"]

  components:
    crond:
      version_test: "PASS"
      function_test: "PASS"
      ohos_compatibility: "PARTIAL"
      issues:
        - "setuid() 被SELinux禁止，需要root/system权限运行"
      fixable: false
    crontab:
      version_test: "PASS"
      function_test: "PASS"  # 修复后: PASS
      ohos_compatibility: "PASS"  # 修复后: PASS
      issues: []  # 修复后: 无问题
      original_issues:
        - "用户UID不在/etc/passwd中"
      fixable: true
      fixed: true
      fix_method: "OHOS passwd fallback机制"
    cronnext:
      version_test: "PASS"
      function_test: "PASS"
      ohos_compatibility: "PASS"
      issues: []
      fixable: false
    anacron:
      version_test: "PASS"
      function_test: "PARTIAL"
      ohos_compatibility: "PARTIAL"
      issues:
        - "需要创建spool目录"
      fixable: true
      fixed: false

  # crontab 详细测试结果（修复后）
  crontab_tests:
    - name: "版本测试 (-V)"
      before_fix: "FAIL"
      after_fix: "PASS"
    - name: "语法检查 (-T)"
      before_fix: "FAIL"
      after_fix: "PASS"
    - name: "安装crontab"
      before_fix: "FAIL"
      after_fix: "PASS"
    - name: "列出crontab (-l)"
      before_fix: "FAIL"
      after_fix: "PASS"
    - name: "编辑crontab (-e)"
      before_fix: "FAIL"
      after_fix: "PASS"
    - name: "删除crontab (-r)"
      before_fix: "FAIL"
      after_fix: "PASS"

  platform_limitations:
    - name: "setuid/setgid系统调用"
      status: "BLOCKED"
      impact: "crond无法切换用户执行任务"
      workaround: "以root/system身份运行crond"
    - name: "OHOS用户管理"
      status: "FIXED"
      impact: "用户UID不在/etc/passwd"
      fix: "OHOS passwd fallback机制"
    - name: "版本参数"
      status: "INFO"
      note: "使用-V而非--version（POSIX风格）"

  recommended_usage:
    - "系统级定时任务管理(root/system权限)"
    - "用户级crontab管理（已修复）"
    - "Crontab语法验证(cronnext)"
    - "周期性任务执行(anacron)"

  blocked_usage:
    - "crond守护进程非root模式运行"

# ============================================================
# OHOS 平台修复记录
# ============================================================

# OHOS 平台修复
ohos_fixes:
  fix_date: "2026-05-26"

  fixed_issues:
    - name: "crontab passwd 检查"
      original_status: "FAIL"
      fixed_status: "PASS"
      solution: "添加 OHOS fallback 机制，当 getpwuid 失败时创建虚拟 passwd 结构"
      patch: "0001-ohos-passwd-fallback.patch"

    - name: "cron.allow 配置"
      original_status: "BLOCKED"
      fixed_status: "PASS"
      solution: "创建 ~/usr/local/etc/cron.allow 文件"

  platform_limitations:
    - name: "crond setuid"
      status: "BLOCKED"
      reason: "SELinux 禁止普通进程调用 setuid()"
      workaround: "以 root/system 身份运行 crond"

  fix_reports:
    - "reports/fix-report.md"