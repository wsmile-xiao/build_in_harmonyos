# 版本级 manifest
# 文件位置: archives/c/ctml/2.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.0"

# 软件名
software: "ctml"

# 编译状态
# published | built | failed | archived
# （O5：合并并确认 release upload 之前一律 built，不得写 published）
status: "built"

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
# 上游交付物是单头 include/ctml.hpp（header-library），配方运行上游 CMake 仅为
# 执行测试树（CTMLTests），无 install 规则、无二进制交付物
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL（官方 GitHub tag 归档，R39；三路取证见 conandata.yml 头注释）
  url: "https://github.com/tinfoilboy/CTML/archive/refs/tags/2.0.0.tar.gz"

  # 源码校验和（2026-09-26 设备实测下载值 == CCI recipes/ctml/all/conandata.yml）
  sha256: "e13b3bb04903f47b90b286f8a4695232179e28474a0a33f1a3f333552338d132"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py generate() 的 cache_variables 一致）
  configure_options:
    - "-DCTML_TESTS_ENABLE=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  # header-only：头文件只 include C++ 标准库，0 外部依赖（W0 实查双零）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# 供 finish 内嵌 G0 clean-verify 的 cmake configure 直接取用（该闸按本键解析）
build_options: "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCTML_TESTS_ENABLE=ON"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（源码一字未改，零补丁；CMake 4 兼容走 configure 选项）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（行尾注释 # knowledge_ref: 指向既有条目/新草稿号，官方脚本与 overlay 都认的唯一形态）
knowledge_gained:
  - "上游 CMakeLists.txt 写死 cmake_minimum_required(VERSION 3.0)，CMake 4.x 直接拒绝（Compatibility with CMake < 3.5 has been removed）→ 用 cache_variables 传 -DCMAKE_POLICY_VERSION_MINIMUM=3.5（tc.variables 写进 toolchain 文件、在 cmake_minimum_required 之后加载不生效），不改上游源码、零补丁"  # knowledge_ref: E187
  - "ctml 2.0.0 是 header-only C++11 库（单头 include/ctml.hpp 1542 行），package_type=header-library，package() 只拷贝头文件与 LICENSE，package_id 清空，0 运行依赖"  # knowledge_ref: E187
  - "上游测试树由 CMake 内置：CTML_TESTS_ENABLE 默认 ON → CTMLTest（Catch2 v2 单头）→ add_test(NAME CTMLTests)；配方 build() 走 configure+build+cmake.test() 实跑（层 1 必做），N 断言口径 26（源码 REQUIRE 26 == 运行期 26）、2 TEST_CASE / 24 SECTION / 1 ctest 项，test_package 消费者断言 30 条单列鸿蒙行"
