# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md 与 references/iron-rules.md R51（上游测试三步法）

package: ctml/2.0.0
homepage: "https://github.com/tinfoilboy/CTML"

# ── 上游测试入口 ─────────────────────────────────────────────────────────
# 上游 tarball 自带 CMakeLists.txt：CTML_TESTS_ENABLE 默认 ON 时
# `enable_testing()` + `add_executable(CTMLTest tests/construction_tests.cpp
# tests/behavior_tests.cpp)` + `add_test(NAME CTMLTests COMMAND CTMLTest)`。
# 上游无 `make check`，CMake 项目的等价入口是 ctest。
upstream_check_command: "ctest --test-dir <build-dir> --output-on-failure"

# conanfile.py build() 中已集成上游测试（docs/TEST_QUALITY_SPEC.md §3.1 层 1 必做）
upstream_test_in_build: true
upstream_test_command: "cmake.test()   # 配方 build() 内 configure + build + ctest；设备沙箱 HOME 手工复跑证据见 reports/test-report.md"

# 上游实际运行的测试（1 个 ctest 用例 → 1 个 Catch2 可执行 → 2 个 TEST_CASE）
upstream_tests:
  - file: CTMLTest
    source: ctml-2.0.0/tests/behavior_tests.cpp
    description: "Catch2 v2「nodes behave correctly」：19 个 SECTION（类切换/拼接/选择器/无闭合标签/删除/转义/Document 多行/QuerySelector 9 种选择器语义）"
    command: "./CTMLTest \"nodes behave correctly\""
  - file: CTMLTest
    source: ctml-2.0.0/tests/construction_tests.cpp
    description: "Catch2 v2「nodes are constructed correctly」：5 个 SECTION（空白节点/带内容/类与 id/属性/嵌套选择器构造）"
    command: "./CTMLTest \"nodes are constructed correctly\""
  - file: CTMLTest
    source: ctml-2.0.0/CMakeLists.txt
    description: "ctest 注册项 add_test(NAME CTMLTests COMMAND CTMLTest) —— `ctest -N` 显示 Total Tests: 1，一次运行覆盖上面两个 TEST_CASE"
    command: "ctest --test-dir <build-dir> -N"

# test_package 中自带的测试（消费者视角验证，鸿蒙特有测试行）
test_package_tests:
  - file: test.cpp
    description: "ctml 消费者测试：从已安装包 include/ctml.hpp 真实调用 CTML::Node/CTML::Document（构造/类切换/拼接/选择器/属性转义/删除/Document 多行格式化/QuerySelector 9 种操作符），运行期断言 30 条"
    command: "./test_ctml"

# ── N 的取数命令（R51 候选数法：同一单位取最大值，差额逐项归因）──────────
# 统计单位 = 断言（assertion），四口径分列、不与 test case 口径混用：
#   1) 源码宏数      : grep -c 'TEST_CASE(' tests/*.cpp            → 2（behavior 1 + construction 1）
#                      grep -c 'SECTION('   tests/*.cpp            → 24（19 + 5，Catch2 分支，非独立注册用例）
#   2) 框架注册数    : ./CTMLTest --list-test-names-only | wc -l   → 2（Catch2 注册 test case）
#                      ctest -N                                     → 1（CTest 注册项）
#   3) 运行期报告    : ./CTMLTest → "All tests passed (26 assertions in 2 test cases)" → 26 断言
#   4) 源码断言词面  : grep -c 'REQUIRE(' tests/*.cpp              → 21 + 5 = 26（CHECK( 0 处）
# N = max(26, 26) = 26（断言口径两端互证），N′ = 实跑 26，差额 0；
# 与其余口径的关系：2 TEST_CASE / 24 SECTION / 1 ctest 项 / 26 断言 —— 全部 ≤ 26。
# 差额归因：2 个 TEST_CASE 按 SECTION 展开为 24 次分支执行，落成 26 条 REQUIRE 断言
#（behavior 19 SECTION / 21 REQUIRE、construction 5 SECTION / 5 REQUIRE）。
assertion_count: 30   # = test_package/test.cpp 消费者断言数（运行期 CTML-CONSUMER checks=30）
