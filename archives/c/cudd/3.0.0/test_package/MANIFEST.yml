# test_package/MANIFEST.yml — cudd 3.0.0
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: cudd/3.0.0
homepage: "https://github.com/ivmai/cudd"

# 上游测试命令（make check → 3 个 TAP 脚本驱动 3 个 check_PROGRAMS）
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试（层1）
upstream_test_in_build: true
upstream_test_command: "build() 内 make check 全量实跑"

# 上游测试真相：3 个 TAP 脚本（nanotrav/test_ntrv.test 13 断言 +
# cplusplus/test_obj.test 2 断言 + dddmp/test_dddmp.test 7 断言 = 22），
# 驱动 3 个 check_PROGRAMS（nanotrav、testobj+testmulti、testdddmp），
# 测试数据经 dist_check_DATA 随 tarball 完整分发。dddmp/obj 子库需
# --enable-dddmp --enable-obj 打开（默认 no，否则对应测试被门控）。
# 全部 22 断言实跑通过。
upstream_test_count: 22
