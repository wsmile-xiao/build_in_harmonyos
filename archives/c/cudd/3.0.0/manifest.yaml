knowledge_gained:
- "cudd 3.0.0 上游测试体系完整随包分发：3 个 check_PROGRAMS + 3 个 TAP 脚本（test_ntrv 13 / test_obj 2 / test_dddmp 7 = 22 断言），测试数据走 dist_check_DATA"
- "dddmp/cplusplus 子库默认关（--enable-dddmp/--enable-obj 默认 no），不开则对应 2 个测试脚本被上游门控，要全量覆盖必须显式打开"
- "顶层 all 目标依赖 html/index.html + doc/cudd.pdf，无 doxygen/pdflatex 时是空规则不阻碍构建"
- "BDD 判据用 Cudd_CountMinterm（精确满足指派数）比 Cudd_DagSize（依赖变量序）更稳"
