software: checksecurity
display: "checksecurity"
description: "Debian 系统安全检查脚本集：通过插件检查磁盘占用、空口令、SUID 文件变化、开放 socket 等系统安全状态"
category: security
homepage: "https://salsa.debian.org/debian/checksecurity"
license: GPL-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Perl/shell 脚本集，无 C/C++ 编译过程（Makefile 仅做安装布局）"
    - "需修改 shebang：#!/usr/bin/perl → #!/usr/bin/env perl（鸿蒙无 /usr/bin/perl，perl 5.42 经 PATH 解析）"
    - "主脚本运行需 root 权限；test_package 以 perl -c 语法校验 + 组件完整性断言做实质验证"
  common_dependencies:
    - perl/5.42.2

versions:
  "2.0.18":
    status: built
    build_date: "2026-09-07"
    source_url: "https://salsa.debian.org/debian/checksecurity/-/archive/debian/2.0.18/checksecurity-2.0.18.tar.gz"