# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）

package: checksecurity/2.0.18
homepage: "https://salsa.debian.org/debian/checksecurity"

# 上游测试命令 — 已清点：checksecurity 2.0.18 上游无独立测试套件。
# 源码包仅 34 个文件（bin/1 + plugins/5 + etc/5 + man/5 + debian/ 打包
# 文件 + Makefile 等），Makefile 无 check/test 目标（all 目标仅输出
# "There is nothing to build"），debian/rules 无测试调用。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（当前版本未提供任何自动化测试）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，R34 实质测试）
test_package_tests:
  - file: test_checksecurity.py
    description: "perl -c 校验主脚本与 perl 插件语法（验证 OHOS perl 可解析补丁后 shebang）；逐项核对 5 个插件 + 5 个配置文件打包完整性"
    command: "python3 test_checksecurity.py <pkg>"

# 测试断言总数: 主脚本存在 1 + perl 语法 1 + 插件存在 5 + perl插件语法 1 + 配置 5 = 13
assertion_count: 13