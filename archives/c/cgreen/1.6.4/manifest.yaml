# 版本级 manifest — cgreen 1.6.4

version: "1.6.4"
software: cgreen
status: published
build_date: "2026-09-05"
build_system: cmake

source:
  url: "https://github.com/cgreen-devs/cgreen/archive/refs/tags/1.6.4.tar.gz"
  sha256: "0b50f50ce305d6d6fe143278c9f6e75606680e987c30302edc4c099e9a88dff3"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCGREEN_WITH_UNIT_TESTS=ON"
    - "-DCGREEN_WITH_XML=OFF"
    - "-DCGREEN_WITH_LIBXML2=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-tools-cgreen_runner_output_diff.patch"

knowledge_gained:
  - "cgreen 1.6.4 is a CMake library (libcgreen.so) mixing C and C++ objects; CMake needs CMAKE_SYSTEM_NAME=Linux for OHOS (HarmonyOS platform files unknown to CMake)"
  - "create_xml_reporter aborts with SIGABRT on OHOS even in a minimal top-level consumer (fork-per-test tmpfile/messaging interplay); xml reporter disabled in build (CGREEN_WITH_XML=OFF)"
  - "OHOS /bin/bash does not exist (bash at /data/service/hnp/bin) and uname -o reports Toybox -> upstream tools bash scripts need env-bash shebang and a Toybox/HarmonyOS case branch"
  - "Reflective dlopen runner tests (runner_test_cgreen_c/cpp) run inside a ctest session destabilise the following bash output-diff tests on OHOS; run them after ctest phase via the built runner binary instead (equivalent invocation)"
