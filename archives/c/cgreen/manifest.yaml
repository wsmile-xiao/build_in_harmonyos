software: cgreen
display: "cgreen"
description: "C/C++ 单元测试与 mock 框架（断言/套件夹具/反射 runner/多报告器）"
category: foundation
homepage: "https://cgreen-devs.github.io/cgreen/"
license: ISC
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 需 CMAKE_SYSTEM_NAME=Linux + PROCESSOR=aarch64（CMake 无 HarmonyOS platform 文件）"
    - "构建期运行上游自测套件 26/26（两阶段：ctest 24 + 反射 runner 直跑 2）"
    - "xml 报告器在 OHOS SIGABRT，关闭 CGREEN_WITH_XML"
  common_dependencies: []

versions:
  "1.6.4":
    status: published
    build_date: "2026-09-05"
