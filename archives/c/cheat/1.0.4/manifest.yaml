patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS clang 不预定义 _POSIX_C_SOURCE，上游 #elif _POSIX_C_SOURCE 分支走 #else 静态 fallback 与 unistd.h 冲突；编译期 -D_POSIX_C_SOURCE=200112L 解决（DRAFT-cheat-1.0.4-posix-c-source-branch-select）"
- "测试框架自测套件含设计性负路径用例（断言故意失败/崩溃/信号），退出码 1 为预期产物；配方 build() 上游测试门禁按 harness 语义：编译硬闸+需框架报告，不按 rc==0 判失败（DRAFT-cheat-1.0.4-framework-self-test-negative-path）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"