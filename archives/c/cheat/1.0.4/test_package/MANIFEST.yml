# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cheat/1.0.4
homepage: "https://github.com/Tuplanolla/cheat"

# 上游测试命令 (makefile `test` 目标：构建 example/examples 后以 -s 运行)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./test && for i in tests/*.c; do cc -I . -o tmp -w $i && ./tmp -s; done"

# 上游实际运行的测试程序（tests/*.c 中每个独立文件 = 一个可独立编译运行的
# 用户测试用例，共 25 个；各文件内 CHEAT_TEST 块为该文件的独立断言用例）
upstream_tests:
  - file: successful.c
    source: cheat-1.0.4/tests/successful.c
    description: "1 个通过用例（cheat_assert 2+2==4）"
    command: "./successful -s"
  - file: failed.c
    source: cheat-1.0.4/tests/failed.c
    description: "1 个失败用例（断言 false，验证 FAILURE 路径）"
    command: "./failed -s"
  - file: variadic.c
    source: cheat-1.0.4/tests/variadic.c
    description: "变参/宏展开相关用例（4 个 CHEAT_TEST）"
    command: "./variadic -s"
  - file: limited.c
    source: cheat-1.0.4/tests/limited.c
    description: "CHEAT_LIMIT 输出限制相关用例"
    command: "./limited -s"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    source: test_package/test.c
    description: "消费者测试：3 个 CHEAT_TEST（math/int/ordering 断言）"
    command: "./test_cheat"
