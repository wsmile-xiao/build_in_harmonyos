# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cyrus-sasl-scram/2.1.28
homepage: "https://www.cyrusimap.org/sasl/"

# 上游测试套件存在性
# cyrus-sasl 2.1.28 发布包**不含 automake `make check` 目标**（顶层与各子目录
# Makefile.am 均无 TESTS/check_PROGRAMS/check-local），但**含真实的自动化测试程序**
# utils/testsuite.c（utils/Makefile.am:49 EXTRA_PROGRAMS，手工 `make testsuite` 构建，
# 运行入口 `utils/testsuite -a`，main() 中 19 个标号阶段）。因此为 true —— 本配方在
# build() 中实际构建并运行它。
upstream_tests_exist: true

# 上游测试审计（源码: cyrus-sasl-2.1.28.tar.gz,
# sha256 7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c）
upstream_test_audit:
  source_tarball: "cyrus-sasl-2.1.28.tar.gz"
  source_sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / add_test (ctest)"
    - "check_PROGRAMS / TESTS (automake make check)"
    - "EXTRA_PROGRAMS (手工构建的测试程序)"
  scan_result: >-
    顶层 Makefile.am 与各子目录 Makefile.am 均无 `TESTS`/`check_PROGRAMS`/`check-local`
    目标（无 automake `make check`）；无 CMakeLists.txt/meson.build/pytest 接线。
    utils/Makefile.am:49 以 EXTRA_PROGRAMS 声明 `testsuite`/`testsuitestatic`，
    即需显式 `make testsuite` 构建的自动化测试程序。故本库的自动化测试入口为
    `utils/testsuite -a`。
  upstream_test_programs:
    - "utils/testsuite.c     — 自动化测试程序（`testsuite -a`：7 个基础阶段 + 8 个机制协商阶段 + corruption + proxy-policy + security-layer）"
    - "utils/testsuitestatic.c（同一 testsuite.c，静态链接变体）"
  manual_only_programs:
    - "utils/smtptest.c — 依赖外部 SFIO（#include <sfio.h>），上游 Makefile.am 中 smtptest_SOURCES 为空；本包与制品仓均无 sfio，故 `make -C utils smtptest` 报 fatal error: 'sfio.h' file not found"
    - "utils/saslpasswd2.c / utils/sasldblistusers2.c — 需口令库后端（本包 --with-dblib=none，运行时报 check_db unsuccessful，属预期）"
    - "saslauthd/testsaslauthd.c — 需运行中的 saslauthd 守护进程（本包 --without-saslauthd 不构建）"
    - "sample/{client,server,http_digest_client,sample-client,sample-server}.c — 交互式示例程序：已全部构建并执行，见 reports/upstream-tests.md 的逐项读数"
  reason: >-
    cyrus-sasl 2.1.28 无 automake `make check`，但提供真实的自动化测试程序
    utils/testsuite；其首个阶段 test_checkpass 需要已初始化的 sasldb 口令库，
    故交付闭包（--with-dblib=none）下停在第一阶段，完整运行在独立 sasldb/LMDB
    临时测试树中完成（10/19 阶段通过，第 11 阶段报 sasl_server_start() error，
    8/8 seed 稳定复现；逐项读数见 2.1.28/reports/upstream-tests.md）。

# 上游测试命令
upstream_check_command: "make -C utils testsuite && SASL_PATH=<empty> ./utils/testsuite -a -s 1"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C utils testsuite; SASL_PATH=<empty> ./utils/testsuite -a -s 1"

# 上游实际运行的测试程序
upstream_tests:
  - file: utils/testsuite.c
    description: >-
      上游自动化测试程序，main() 中 19 个标号阶段。交付闭包（--with-dblib=none）
      下第 1 阶段 test_checkpass 需要 sasldb 口令库而阻塞；在独立 sasldb/LMDB
      测试树中运行 `-a -s 1`（种子固定：该程序以 time(NULL) 播种，不固定则结果
      不可复现）实测 10 个阶段通过、第 11 阶段（client-first/server-last 的
      SCRAM-SHA-256）报 sasl_server_start() error
    command: "./utils/.libs/testsuite -a -s 1"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_scram.c
    description: >-
      消费者测试：版本 2.1 校验 + client/server 初始化与建连 + 两侧机制枚举含
      SCRAM-SHA-1/224/256/384/512 全家族 + sasl_client_start() 真实产出
      RFC 5802 client-first-message（gs2-header "n,," + n=<authid> + r=<nonce>）
    command: "./test_scram"
  - file: test_scram.c
    description: >-
      鸿蒙特有测试：SASL_PATH 指向不存在目录时仍能枚举 SCRAM 全家族，验证
      --enable-scram 静态链入 libsasl2.a（无运行期插件目录/dlopen）的 OHOS 适配
    command: "SASL_PATH=<missing> ./test_scram --ohos-static-only"

# 测试断言总数
assertion_count: 9
