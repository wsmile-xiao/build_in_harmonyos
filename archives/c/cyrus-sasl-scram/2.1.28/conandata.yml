sources:
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"

patches:
  - patch_file: "patches/0001-utils-testsuite.c.patch"
    patch_description: >-
      utils/testsuite.c stores the getopt() result in a `char`.  On the OHOS
      aarch64 test build the truncation makes the EOF sentinel non-terminal,
      so the option loop falls into `default:` and exits with
      "Usage: ... Failed with: Invalid parameter" instead of running the
      suite.  Store the result in the `int` type getopt() is specified to
      return.  No test inputs, assertions or pass criteria are changed.
    patch_type: "portability"
  - patch_file: "patches/0002-config-config.guess.patch"
    patch_description: >-
      config.guess: teach it HarmonyOS (uname -s = HarmonyOS) and emit the
      aarch64-unknown-linux-ohos triplet, so configure is not forced into the
      forbidden --build/--host override (which makes cross_compiling=yes and
      skips every AC_RUN_IFELSE probe).
    patch_type: "portability"
  - patch_file: "patches/0003-config-config.sub.patch"
    patch_description: >-
      config.sub: accept linux-ohos / -linux-ohos (maybe_os kernel-os list +
      valid OS list) so aarch64-unknown-linux-ohos is a legal configuration.
    patch_type: "portability"
