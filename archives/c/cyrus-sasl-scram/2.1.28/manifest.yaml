# 版本级 manifest
# 文件位置: archives/c/cyrus-sasl-scram/2.1.28/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.1.28"
software: "cyrus-sasl-scram"

# 编译状态: published | built | failed | archived
status: built

build_system: autotools
build_date: "2026-09-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源（GitHub releases）。SCRAM 机制是上游源码内 plugins/scram.c，
  # 与 cyrus-sasl / cyrus-sasl-digestmd5 同源同版本。
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # SCRAM 专用最小闭包：只开 scram（+ 上游内置 EXTERNAL），其余机制/后端全关。
  # 与 conanfile.py::_configure_args() 一一对应。
  configure_options:
    - "--prefix=/"
    - "--disable-dependency-tracking"
    - "--disable-sample"
    - "--enable-scram"
    - "--with-openssl=<openssl/3.5.6 package folder>"
    - "--disable-shared"
    - "--enable-static"
    - "--without-staticsasl"
    - "--disable-staticdlopen"
    - "--disable-alwaystrue"
    - "--disable-anon"
    - "--disable-cram"
    - "--disable-digest"
    - "--disable-gssapi"
    - "--disable-httpform"
    - "--disable-krb4"
    - "--disable-ldapdb"
    - "--disable-login"
    - "--disable-ntlm"
    - "--disable-otp"
    - "--disable-passdss"
    - "--disable-plain"
    - "--disable-sia"
    - "--disable-sql"
    - "--disable-srp"
    - "--disable-srp-setpass"
    - "--without-saslauthd"
    - "--without-authdaemond"
    - "--without-gdbm"
    - "--without-ldap"
    - "--without-mysql"
    - "--without-opie"
    - "--without-pam"
    - "--without-pgsql"
    - "--without-pwcheck"
    - "--without-sqlite"
    - "--without-sqlite3"
    - "--disable-auth-sasldb"
    - "--with-dblib=none"

  # 编译依赖（格式: name/version）。SCRAM 的密钥派生（Hi/HMAC/PBKDF2）
  # 依赖 libcrypto，故必须显式声明 openssl。
  dependencies:
    - "openssl/3.5.6"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-utils-testsuite.c.patch"   # getopt() 结果用 int 承接（OHOS aarch64 上 char 截断使 EOF 哨兵失效）
  - "0002-config-config.guess.patch" # config.guess 识别 HarmonyOS → aarch64-unknown-linux-ohos
  - "0003-config-config.sub.patch"   # config.sub 接受 linux-ohos

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "SCRAM（SCRAM-SHA-1/224/256/384/512，RFC 5802/7677）的密钥派生 Hi()/HMAC/PBKDF2 走 OpenSSL EVP，因此 SCRAM 分支必须链 -lcrypto；与 DIGEST-MD5 的 DES 用途不同但同为 openssl/3.5.6（ref: 上游 plugins/scram.c 的 EVP_* 调用）"
  - "静态构建时 -lcrypto 不会自动进入链接闭包：configure.ac 的 SCRAM 分支只为共享插件设 SCRAM_LIBS=-lcrypto，未加入 SASL_STATIC_LIBS（DIGEST 分支才有 SASL_STATIC_LIBS+=$LIB_DES），因此 recipe 需以 LIBS=-lcrypto 参与静态链接（ref: 上游 configure.ac SCRAM 段）"
  - "LIBS=\"-lcrypto\" 从 configure 首条编译命令起生效：若 LDFLAGS 不含 openssl/lib，首轮『whether the C compiler works』链路试探即报 ld.lld: unable to find library -lcrypto → configure: error: C compiler cannot create executables。修复：generate() 里把 -L<openssl>/lib 加进 extra_ldflags、-I<openssl>/include 加进 extra_cflags（AutotoolsToolchain 无 extra_cppflags 属性）"
  - "GNU config.guess（2018-02-24）不识别 uname -s=HarmonyOS → 必须打补丁，禁止用 --build/--host 覆盖（会让 cross_compiling=yes 跳过所有 AC_RUN_IFELSE 探测）"
  - "HMDFS 强制新目录 setgid，autoconf `umask 077 && mktemp -d ./confXXXXXX` 造出的目录属主不可写 → config.status 'can't create ./conf*/subs1.awk: Permission denied'；recipe 将 umask 077 改写为 022"
  - "configure 经 AC_PROG_CC_FOR_BUILD 裸搜 gcc/cc/cl.exe，OHOS 只有 clang，需显式喂 CC_FOR_BUILD/CPP_FOR_BUILD"
  - "静态构建下 lib/Makefile 的 linksrcs 只做 symlink（HMDFS 可能拒绝），需把 SASL_STATIC_SRCS（scram.c/db_none.c）复制到 lib/ 后再 make"
  - "上游 2.1.28 无 automake TESTS/check_PROGRAMS（无 make check），唯一自包含断言测试台是 utils/testsuite.c（EXTRA_PROGRAMS，19 个阶段）；其阶段 1 test_checkpass 需要已初始化的 sasldb 口令库，交付闭包 --with-dblib=none 下必然阻塞（ref: R51 清点证据 utils/Makefile.am:49）"
  - "utils/testsuite 用 char 承接 getopt() 返回值，在 OHOS aarch64 上 EOF 哨兵被截断失效 → 落入 default: 并以 'Failed with: Invalid parameter' 退出、0 个用例执行；改为 int 即恢复（patch 0001，不改测试内容）"
  - "上流 old-style C 样例依赖 musl 已移除的 getpass(3)（sample/client.c:145 等）；仅为跑样例提供 shim（不改样机逻辑），并记录 sample-client 在 OHOS 上口令交互路径 SIGSEGV（rc=139，8 组输入稳定复现；同环境的 test_package/testsuite 调用链正常，定性为样例自身缺陷）"
  - "sample-server/sample-client 是双端交互样例（stdin/stdout 交换 `S: `/`C: ` base64 行）；单端直跑必然失败：sample-client.c samp_recv() 严格要求行以 'S: ' 开头，sample-server.c 对非命令输入报 'Unable to parse input'"
