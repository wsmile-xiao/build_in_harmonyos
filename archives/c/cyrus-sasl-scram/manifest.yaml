# 软件级 manifest
# 文件位置: archives/c/cyrus-sasl-scram/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: cyrus-sasl-scram
display: "Cyrus SASL SCRAM mechanisms"
description: "Cyrus SASL SCRAM (SCRAM-SHA-1/224/256/384/512) authentication mechanisms for libsasl2"
category: security
homepage: "https://www.cyrusimap.org/sasl/"
license: BSD-Attribution-HPND-disclaimer
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "SCRAM 家族（RFC 5802/7677）密钥派生走 OpenSSL EVP/HMAC/PBKDF2，必须链 -lcrypto（唯一 Conan 依赖 openssl/3.5.6）"
    - "上游 SCRAM 分支不把 -lcrypto 加入 SASL_STATIC_LIBS，静态构建需 recipe 以 LIBS=-lcrypto 参与链接"
    - "LIBS 从 configure 首条编译命令起生效：必须把 -L<openssl>/lib 提前注入 LDFLAGS（否则 C compiler cannot create executables）"
    - "config.guess 不识别 HarmonyOS，需补丁（禁止 --build/--host 覆盖，否则跳过 AC_RUN_IFELSE 探测）"
    - "HMDFS 下 autoconf umask 077 临时目录属主不可写，configure 改写为 umask 022"
    - "OHOS 无 gcc/cc，需显式喂 CC_FOR_BUILD/CPP_FOR_BUILD"
    - "静态构建 --enable-static --without-staticsasl：SCRAM 经 staticopen.h 注册，无运行期 SASL_PATH/dlopen"
    - "上游 utils/testsuite.c 用 char 承接 getopt() 返回值，aarch64 上截断致测试台 0 执行 → 改 int"

  common_dependencies:
    - openssl

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.1.28":
    status: built
    build_date: "2026-09-26"
    conan_ref: "cyrus-sasl-scram/2.1.28"
    note: "SCRAM 家族首个适配版本（静态 libsasl2.a）；test_package 9/9 断言通过（含鸿蒙静态注册断言）"
