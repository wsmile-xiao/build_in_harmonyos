package: cvector/1.0.4.1
homepage: "https://github.com/yayahjb/cvector"

upstream_check_command: "ctest --test-dir <build> --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure"

upstream_tests:
  - file: CVectorBasicTest.c
    source: cvector-1.0.4.1/CVectorBasicTest.c
    description: "Upstream CTest case 1: CVectorBasicTest run over 1M double elements (create/add/get/set/remove/clear)"
    command: "ctest -R CVectorBasicTest --output-on-failure"
    tests: 1
  - file: CVectorBasicTest_orig.lst
    source: cvector-1.0.4.1/CVectorBasicTest_orig.lst
    description: "Upstream CTest case 2: compare generated CVectorBasicTest.lst against reference output"
    command: "ctest -R cmp-CVectorBasicTest --output-on-failure"
    tests: 1

test_package_tests:
  - file: test_cvector.c
    description: "Consumer boundary covering create/add/array access/get/pointer/set/remove/clear/free"
    command: "./test_cvector"
    assertions: 108

upstream_test_count: 2
consumer_test_count: 1
consumer_assertion_count: 108
assertion_count: 110
