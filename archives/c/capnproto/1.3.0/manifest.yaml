# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.0"

# 软件名
software: capnproto

# 编译状态
# published | built | failed | archived
# 注：built = 本地 conan create 验证通过但制品仓未 upload（upload 由 PR 合并后 CI release 流水线执行）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://capnproto.org/capnproto-c++-1.3.0.tar.gz"

  # 源码校验和
  sha256: "098f824a495a1a837d56ae17e07b3f721ac86f8dbaf58896a389923458522108"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DBUILD_TESTING=OFF"
  - "-DWITH_OPENSSL=OFF"
  - "-DWITH_ZLIB=OFF"
  - "-DWITH_FIBERS=OFF"
  - "-DEXTERNAL_CAPNP=OFF"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "-DCMAKE_CXX_EXTENSIONS=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-serialize-test-use-test-tmpdir.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "capnproto 是零强制依赖的 CMake 项目（OpenSSL/Zlib/Fibers 均可选且关闭），官方发布 tarball 在 capnproto.org（capnproto-c++-X.Y.Z.tar.gz），GitHub 无对应下载源时可用官网归档"
- "OHOS 上必须 BUILD_SHARED_LIBS=OFF 静态构建（避免 RPATH 问题），与同仓 1.1.0 已验证配置一致"
- "capnproto 要求 GNU 扩展（-std=gnu++NN），Conan toolchain 需在 generate() 后把 CMAKE_CXX_EXTENSIONS 从 OFF 补丁为 ON（同 1.1.0 配方经验）"
- "CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容 CMake 4.x（上游 cmake_minimum_required 3.10）"
- "上游测试 1069 个独立用例（72 文件）；OHOS /tmp、/var/tmp 只读导致 16 项失败（mkstemp/mkdtemp/unix socket bind），TMPDIR 只能规避非硬编码路径；全量通过率 993/1069=92.9%，可执行集合 993/1009=98.4%"
- "test_package 消费者测试：capnp::List<uint32_t> 根字段经 messageToFlatArray + FlatArrayMessageReader 往返可验证序列化（capnp::Text::Builder 无 set 成员，用 List 避免 API 陷阱）"
- "kj filesystem 只接受相对路径（getCurrent()），绝对路径抛异常；setupAsyncIo 的 two-way pipe 端为 Own<AsyncIoStream> 需 -> 访问"
- "库产物：kj、kj-async、kj-http、capnp、capnp-rpc、capnp-json、capnp-websocket、capnpc；可执行：capnp、capnpc-c++、capnpc-capnp（R38 需 commands.json）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
