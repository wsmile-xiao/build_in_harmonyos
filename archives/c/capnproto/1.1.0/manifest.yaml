  - "CMAKE_POLICY_VERSION_MINIMUM=3.5 needed for CMake 4.x compatibility"
  - "CMAKE_CXX_EXTENSIONS=ON required — capnproto rejects -std=c++NN, needs -std=gnu++NN"
  - "Profile must use compiler.cppstd=gnu17 (not 17) for Conan toolchain to pass through extensions"
