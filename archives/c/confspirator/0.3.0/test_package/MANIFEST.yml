# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: confspirator/0.3.0
homepage: "https://github.com/donbowman/confspirator"

# 上游测试命令 — confspirator pytest 套件
upstream_check_command: "python3 -m pytest -o addopts=""" ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-17 实测记录）：
# - confspirator/tests/ 目录（test_configs/test_example/test_utils 3 文件）
# - 测试依赖：toml/slugify/netaddr/rfc3986/mock（已全部安装）
# - 实测结果：**66 passed（100%，0.20s）**——全部测试真实运行通过，
#   无受阻无失败
upstream_tests:
  - file: confspirator/tests/
    source: confspirator-0.3.0/confspirator/tests/
    description: "上游 pytest 套件（3 文件；依赖 toml/slugify/netaddr/rfc3986/mock 安装后 66 passed 100%）"
    command: "python3 -m pytest -o addopts=""" ""

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_confspirator.py
    description: "消费者测试：真实 API（R34）——ConfigGroup schema + Loader/DictSource 合并加载 + 默认值回退"
    command: "python3 test_confspirator.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
