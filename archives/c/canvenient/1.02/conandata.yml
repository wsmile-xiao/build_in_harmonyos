# conandata.yml — canvenient 1.02
# 官方来源: https://github.com/CANopenTerm/CANvenient (任务头 source_url
#   https://github.com/linux-can/canvenient 不存在, 404; 经核实官方仓库为
#   CANopenTerm/CANvenient, 官方发布 tarball v1.02 tag = commit ad92edf,
#   与 Debian 1.02.orig 树一致)
# sha256: 官方发布 tarball 实测值
sources:
  url: "https://github.com/CANopenTerm/CANvenient/archive/refs/tags/v1.02.tar.gz"
  sha256: "dae4c0a4b6a2b62220341466509a57d9a10ee5cc60be5a2def42d0afd345dc41"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "OHOS adaptation: vendor libsocketcan (LGPL-2.1) into target; use NOT WIN32 instead of UNIX (OHOS CMake profile sets CMAKE_SYSTEM_NAME=HarmonyOS so UNIX=OFF); drop external 'socketcan' link dep not published to ohpcd registry"
    patch_type: "portability"
  - patch_file: "patches/0002-deps-libsocketcan-include-can_netlink.h.patch"
    patch_description: "vendor: libsocketcan can_netlink.h (linux-can/libsocketcan master)"
    patch_type: "portability"
  - patch_file: "patches/0003-deps-libsocketcan-include-libsocketcan.h.patch"
    patch_description: "vendor: libsocketcan public header"
    patch_type: "portability"
  - patch_file: "patches/0004-deps-libsocketcan-src-GNUmakefile.am.patch"
    patch_description: "vendor: libsocketcan build file (unused by CMake build, kept for provenance)"
    patch_type: "portability"
  - patch_file: "patches/0005-deps-libsocketcan-src-libsocketcan.c.patch"
    patch_description: "vendor: libsocketcan source; OHOS adaptation — sys/socket.h before kernel netlink headers (sockaddr_storage redefinition), _GNU_SOURCE, pre-declared __kernel_sa_family_t"
    patch_type: "portability"
  - patch_file: "patches/0006-src-drivers-CANvenient_SocketCAN.c.patch"
    patch_description: "OHOS/bionic adaptation: _GNU_SOURCE for ifreq; sys/socket.h before linux/can.h (sockaddr_storage redefinition); pre-declared __kernel_sa_family_t; skip kernel <linux/socket.h> redefinition"
    patch_type: "portability"
