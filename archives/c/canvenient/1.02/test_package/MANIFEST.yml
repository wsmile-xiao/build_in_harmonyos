# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: canvenient/1.02
homepage: "https://canopenterm.de/canvenient"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/tests/example.c
    source: src/tests/example.c
    description: "上游示例程序: 枚举 CAN 接口并逐个打开/关闭 (example.c, 非 CI 门禁测试, 仅作接口参考)"
    command: "./example"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: can_find_interfaces 枚举 + can_get_name/can_get_error/can_open 越界防护 + can_release_interfaces (无 CAN 设备环境下验证 0 接口路径与 API 健全性)"
    command: "./test_canvenient"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
