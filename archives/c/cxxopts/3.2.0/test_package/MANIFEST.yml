package: cxxopts/3.2.0
homepage: "https://github.com/jarro2783/cxxopts"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

upstream_tests:
  - file: test/options.cpp
    source: cxxopts-3.2.0/test/options.cpp
    description: "Catch2 options suite: 35 TEST_CASE declarations; 34 executed and passed, 1 optional case conditionally excluded"
    command: "./options_test"
    static_cases: 35
    executed_cases: 34
    passed_cases: 34
    skipped_cases: 1
  - file: test/find-package-test/CMakeLists.txt
    source: cxxopts-3.2.0/test/find-package-test/CMakeLists.txt
    description: "CMake package discovery integration test"
    command: "ctest -R find-package-test"
    static_cases: 1
    executed_cases: 1
    passed_cases: 1
    skipped_cases: 0
  - file: test/add-subdirectory-test/CMakeLists.txt
    source: cxxopts-3.2.0/test/add-subdirectory-test/CMakeLists.txt
    description: "CMake add_subdirectory integration test"
    command: "ctest -R add-subdirectory-test"
    static_cases: 1
    executed_cases: 1
    passed_cases: 1
    skipped_cases: 0

test_package_tests:
  - file: test.cpp
    description: "Consumer parses a flag and string option and checks generated help"
    command: "./test_cxxopts"
    assertions: 3

assertion_count: 3
