# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cxxopts/3.3.1
homepage: "https://github.com/jarro2783/cxxopts"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-tests"

upstream_tests:
  - name: test/（Catch2 单元测试——options.cpp 含 38 个 TEST_CASE + find-package-test/add-subdirectory-test 2 个 CMake 集成测试）
    count: "38"
    description: "上游测试实测（rule 4，分母=全部 38 用例）：options_test 实测 34 test cases 全过（208 assertions）+ find-package/add-subdirectory 2 个集成测试通过（36/38 = 94.7%）——4 个 TEST_CASE 因 #ifdef CXXOPTS_HAS_OPTIONAL/FILESYSTEM 条件编译排除（非失败）；test/ 自带 catch.hpp；CMAKE_BUILD_TYPE 显式 Release 修复 ctest -C 空值"

test_package_tests:
  - file: test_cxxopts.py
    description: "R34：头文件存在 + 编译运行使用 cxxopts 的 smoke（cxxopts::Options 解析）"
    command: "python3 test_cxxopts.py <package>"

assertion_count: 2
