# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: clamassassin/1.2.4
homepage: https://jameslick.com/clamassassin/

# clamassassin 是 procmail/clamscan 包装脚本，上游无自带测试框架
# （tarball 仅含源码 8 个文件，无 tests/ 目录）
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试
test_package_tests:
  - file: test.sh
    description: "mock clamscan/formail 功能测试：clean 邮件标记 No，infected 邮件标记 Yes + X-Virus-Report + 鸿蒙特有测试（E011）"
    command: "sh test.sh"

# 鸿蒙特有测试（PC 特有测试，E011：HMDFS 默认 umask 077）
harmony_specific_tests:
  - file: test.sh (test 3)
    name: "E011 HMDFS umask 077 perm + behavioral check"
    description: "HMDFS 默认 umask 077 会使 config.status 生成 0600 文件、投递用户无法执行过滤器；配方已 patch config.status umask 077→022 并 chmod 0555。此测试校验打包脚本 group/other r-x 权限位，并在 umask 077 下实跑过滤逻辑（clean 邮件 → X-Virus-Status: No），端到端证明 E011 修复生效"
    count: 1

assertion_count: 7
