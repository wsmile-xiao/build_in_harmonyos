# 版本级 manifest
# 文件位置: archives/c/ccfits/2.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.7"

# 软件名
software: "ccfits"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (NASA HEASARC 官方 v2.7 发布目录)
  url: "https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/ccfits/v2.7/CCfits-2.7.tar.gz"

  # 源码校验和 (设备下载后 sha256sum 实测, 与 fink ccfits 2.7 info 交叉核对一致)
  sha256: "f63546d2feecbf732cc08aaaa80a2eb5334ada37fb2530181b7363a5dbdeb01a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DTESTS=OFF"
  - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - cfitsio/4.6.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "依赖包自带 .pc 的打包时绝对 prefix 在消费端失效：pkg-config 能'找到'依赖但 -I/-L 指向死路径，错误被推迟到编译期头文件 not found；消费方必须用 PkgConfigDeps 重新生成依赖 pc 并按 E468 注入 PKG_CONFIG_PATH，而不是沿用依赖包自带 pc 或把 PKG_CONFIG_PATH 指向其 lib/pkgconfig (knowledge_ref: knowledge/drafts/DRAFT-ccfits-2.7-stale-pc-prefix-regen.md, reference: knowledge/doc/E468.md)"
