# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ccfits/2.7
homepage: "https://heasarc.gsfc.nasa.gov/fitsio/ccfits"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 CMakeLists.txt 仅在 -DTESTS=ON 时注册测试:
#   ADD_EXECUTABLE(cookbook cookbook.cxx); ADD_TEST(cookbook cookbook)
# 并 FILE(COPY file1.pha) 到构建目录作为输入数据。
upstream_check_command: "cmake -DTESTS=ON .. && ctest"

# conanfile.py build() 方法中是否已集成上游测试
# 包构建保持 TESTS=OFF;上游测试在设备验证流程中原生驱动(见 notes.md)。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: cookbook.cxx
    source: CCfits-2.7/cookbook.cxx
    description: >
      Official CCfits cookbook example program, registered as the single
      upstream CTest entry (ADD_TEST(cookbook cookbook)). Reads file1.pha,
      writes and reopens image/ASCII-table/binary-table FITS files
      (atestfil.fit, btestfil.fit, ctestfil.fit) and prints round-trip
      diagnostics. Statistical unit: 1 CTest test (1 executable program);
      the program internally covers image write/read, ASCII table write,
      binary table write, extension switching and row selection scenarios.
    command: "./cookbook"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ccfits.cpp
    description: >
      Consumer write->reopen->read round-trip through the public CCfits API:
      create FITS with primary image geometry (FLOAT_IMG 5x5), write 3
      keyword cards (string, double, string), write 25 float pixels, reopen
      and assert keywords/pixel data/axis count, then binary-table string
      column write/read round-trip.
    command: "./test_ccfits"

# 测试断言总数 (用于质量评估)
# test_ccfits.cpp 执行 7 项 check():TELESCOP/EXPTIME/DETNAM 关键字回读、
# 像素数量、像素数据、轴数、二进制表字符串列回读;任一失败即非零退出。
assertion_count: 7
