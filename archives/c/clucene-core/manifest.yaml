software: clucene-core
display: "clucene-core"
description: "CLucene is a C++ port of the popular Lucene search engine (full-text search library)"
category: search
homepage: "https://clucene.sourceforge.net/"
license: "LGPL-2.0-or-later OR Apache-2.0"
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 4 需传 CMAKE_POLICY_VERSION_MINIMUM=3.5（上游声明最低 2.4.0）"
    - "zlib 为实质依赖（FieldsReader/Misc 真实调用 zlib API）；boost 探测为残余死逻辑不声明"
    - "测试用上游官方便携模式 DISABLE_MULTITHREADING=ON（MT 模式 TestThreading 在 musl 必现 SIGSEGV）"
    - "musl 下 usleep 需显式包含 unistd.h（测试文件补丁）"
  common_dependencies:
    - zlib/1.3.1.1

versions:
  "2.3.3.4":
    status: built
    build_date: "2026-09-07"
