# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: clucene-core/2.3.3.4
homepage: https://clucene.sourceforge.net/

# 上游测试命令（CMake 工程：CTest 注册 SimpleTest = bin/cl_test，
# CuTest 自带框架随源码捆绑，无外部测试依赖）
# 注意：cl_test 的库依赖与测试数据均按相对路径解析（NEEDED=../../bin/*.so，
# 数据=../../src/test/data），上游预期从 build/src/test 目录运行
# （dist-test.sh 同口径）；ctest 对 out-of-source 布局的相对路径解析
# 是上游缺陷，设备验证按上游文档等价直跑同一测试二进制。
upstream_check_command: "cd <build>/src/test && TEMP=test-tmp TMP=test-tmp srcdir=<source>/src/test LD_LIBRARY_PATH=<build>/bin ../../bin/cl_test"
upstream_test_in_build: true
upstream_test_command: "cd <build>/src/test && TEMP=test-tmp TMP=test-tmp srcdir=<source>/src/test LD_LIBRARY_PATH=<build>/bin ../../bin/cl_test"

# ctest -N 输出的测试程序（ cl_test 内部含 36 个 suite / 159 个 case ）
upstream_tests:
  - file: src/test/testall.cpp
    source: clucene-core-2.3.3.4.tar.gz/src/test/
    description: "CuTest 全套测试（36 suites：index/search/analysis/store/util/queryParser/document/debug）"
    command: "./bin/cl_test"

# 上游测试统计（取数口径见下方说明）
# 单位：CuTest case（套件输出行内每个点/字符 = 1 case）
# 取数命令：bin/cl_test 输出末行 "N tests run: P passed, F failed, I not implemented"
upstream_test_count:
  total: 159
  passed: 159
  failed: 0
  not_implemented: 0

# DISABLE_MULTITHREADING=ON 单线程模式说明：
# 上游 CMake OPTION(DISABLE_MULTITHREADING ...) 为官方支持的便携模式开关。
# MT 开启时 TestThreading（Atomic Updates）在 musl/OHOS 下必现 SIGSEGV
# （线程写入与 IndexReader::open 并发读到半刷新状态崩溃）；
# musl 生态 chimera/Adelie 打包同样以 -DDISABLE_MULTITHREADING=ON 跑测试。
# 本包 159 用例全部在该模式下执行，无跳过、无豁免。

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: smoke.cpp
    description: "公开 API 消费者测试：内存索引建立→QueryParser 检索→命中数断言→存储字段回读"
    command: "./smoke_probe"

# 测试断言总数（CuTest 断言调用静态计数 + smoke 条件断言）
assertion_count: 328
# 构成: src/test 全源码 CuAssert* 调用 325 处
#   （grep -rEho 'CuAssert[A-Za-z]*' src/test/ | wc -l，143 StrEquals+99 True+43 基础+20 IntEquals+12 Equals+4 PtrNotNull+2 SizeEquals+2 PtrEquals）
#   + test_package/smoke.cpp 条件断言 3 处（numDocs/hits 长度/存储字段回读）
