sources:
  url: "https://downloads.sourceforge.net/project/clucene/clucene-core-unstable/2.3/clucene-core-2.3.3.4.tar.gz"
  sha256: "ddfdc433dd8ad31b5c5819cc4404a8d2127472a3b720d3e744e8c51d79732eab"
patches:
  "2.3.3.4":
    - patch_file: "patches/0001-fix-cxx11-narrowing.patch"
      patch_description: "C++11 列表初始化窄化错误修复（JavaCC 生成表与 TCHAR 初值）"
      patch_type: "portability"
    - patch_file: "patches/0002-fix-single-thread-mode-macros.patch"
      patch_description: "DISABLE_MULTITHREADING 单线程模式宏缺失修复"
      patch_type: "portability"
    - patch_file: "patches/0003-test-usleep-explicit-unistd.patch"
      patch_description: "musl 下 usleep 需显式包含 unistd.h（上游测试修改）"
      patch_type: "portability"
    - patch_file: "patches/0004-test-sort-data-rename-std17.patch"
      patch_description: "C++17 下全局 data 与 std::data 二义，测试数据表改名 datap（上游测试修改）"
      patch_type: "portability"
    - patch_file: "patches/0005-test-mock-ramdir-init-rate.patch"
      patch_description: "MockRAMDirectory::randomIOExceptionRate 未初始化（UB）致测试间歇失败，构造函数补零（上游测试修改）"
      patch_type: "portability"
