version: '2.3.3.4'
software: 'clucene-core'
status: built
build_date: '2026-09-07'
build_system: cmake

source:
  url: 'https://downloads.sourceforge.net/project/clucene/clucene-core-unstable/2.3/clucene-core-2.3.3.4.tar.gz'
  sha256: 'ddfdc433dd8ad31b5c5819cc4404a8d2127472a3b720d3e744e8c51d79732eab'
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
    - '-DDISABLE_MULTITHREADING=ON'
    - '-DBUILD_STATIC_LIBRARIES=ON'
    - '-DZLIB_ROOT=<conan zlib package rootpath>'
  dependencies:
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied:
  - '0001-fix-cxx11-narrowing.patch'
  - '0002-fix-single-thread-mode-macros.patch'
  - '0003-test-usleep-explicit-unistd.patch'
  - '0004-test-sort-data-rename-std17.patch'
  - '0005-test-mock-ramdir-init-rate.patch'

knowledge_gained:
  - 'CMake 4 移除 <3.5 最低版本兼容；不改上游 CMakeLists 用 CMAKE_POLICY_VERSION_MINIMUM=3.5 政策参数即可 configure'  # knowledge_ref: E187
  - '上游 OPTION(DISABLE_MULTITHREADING) 单线程便携模式在 musl/OHOS 可编译可测（修复宏后 159/159 通过）；MT 模式 TestThreading 必现 SIGSEGV 属上游竞争缺陷（chimera/Adelie musl 同口径）'  # knowledge_ref: E2175
  - 'clucene 2.3.3.4 boost 探测为残余死逻辑：源码零 boost include；CMake 找不到 boost 时回退 src/ext 捆绑头；zlib 才是实质依赖（FieldsReader/Misc 真实调用 zlib API）'  # knowledge_ref: E2176
