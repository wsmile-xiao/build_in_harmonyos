software: cilium-cli
version: "v0.19.4"
status: built
build_system: go
build_date: "2026-06-01"

source:
  url: "https://github.com/cilium/cilium-cli/releases/download/v0.19.4/cilium-cli-v0.19.4.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "-ldflags=-s -w -X github.com/cilium/cilium/cilium-cli/defaults.CLIVersion=v0.19.4"
  dependencies:
    - "go/1.26.3"
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "cilium-cli requires Go >= 1.26.0 (go.mod specifies go 1.26.0)"
  - "Need to download and install Go 1.26.3 separately, sign all ELF binaries in Go toolchain"
  - "Binary output name is 'cilium' (not 'cilium-cli'), build target is ./cmd/cilium"
  - "CGO_ENABLED=0 static compilation produces ~143MB binary, fully portable"
