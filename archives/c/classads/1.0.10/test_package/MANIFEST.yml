# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求）

package: classads/1.0.10
homepage: "https://research.cs.wisc.edu/htcondor/classad/"

# 上游测试命令：automake check 体系，tests/Makefile.am 的 TESTS 列表
# （namespace 默认关闭时的 5 个测试程序）
upstream_check_command: "make check"

# conanfile.py build() 中未集成上游测试（libtool .libs 运行路径与
# 交叉环境的 LD_LIBRARY_PATH 需真机处理；已在设备真机执行，详见 test-report.md）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（设备真机 make check）
upstream_tests:
  - file: classad_functional_tester.cpp
    source: classads-1.0.10/classad_functional_tester.cpp
    description: "功能测试器：按 functional_tests.txt 清单驱动表达式求值"
    command: "./classad_functional_tester functional_tests.txt"
  - file: classad_unit_tester.cpp
    source: classads-1.0.10/classad_unit_tester.cpp
    description: "单元测试器：解析/求值/匹配等单元断言"
    command: "./classad_unit_tester"
  - file: test_xml.cpp
    source: classads-1.0.10/test_xml.cpp
    description: "XML 序列化/解析往返测试"
    command: "./test_xml"
  - file: sample.cpp
    source: classads-1.0.10/sample.cpp
    description: "官方示例：Job/Machine ClassAd symmetricMatch 匹配"
    command: "./sample"
  - file: extra_tests.cpp
    source: classads-1.0.10/extra_tests.cpp
    description: "补充测试"
    command: "./extra_tests"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：ParseClassAd 解析 + EvaluateAttrInt 断言 + MatchClassAd symmetricMatch 断言"
    command: "./consumer"

# 测试断言总数（消费者程序 1 个，3 处行为断言）
assertion_count: 3
