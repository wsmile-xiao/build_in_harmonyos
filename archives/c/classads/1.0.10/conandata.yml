patches:
  - patch_file: "patches/0001-common.cpp.patch"
    patch_description: "OHOS SDK 26 libc++ omits the ostream<<basic_string explicit instantiation; provide the symbol via an asm alias forwarder"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "Use umask 022 for config.status tmp dir (setgid hmdfs makes umask 077 dirs unwritable)"
    patch_type: "portability"
  - patch_file: "patches/0003-exprTree.cpp.patch"
    patch_description: "Same ostream<<basic_string instantiation for exprTree.o members"
    patch_type: "portability"
