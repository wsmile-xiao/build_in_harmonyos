# 版本级 manifest — curseofwar 1.3.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.3.0"
software: "curseofwar"
status: published
build_date: "2026-09-11"
build_system: "make"

source:
  url: "https://github.com/a-nikolaev/curseofwar/archive/refs/tags/v1.3.0.tar.gz"
  sha256: "2a90204d95a9f29a0e5923f43e65188209dc8be9d9eb93576404e3f79b8a652b"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - 'CPPFLAGS=-DVERSION="1.3.0" -DINSTALL_DATA="<pkg>/res/curseofwar/"'
  dependencies:
    - ncurses/6.6
  cc: clang
  cxx: N/A

patches_applied: []

test_report:
  upstream_tests: 0
  upstream_tests_reason: "上游无测试套件：手写 Makefile 仅 all/clean/uninstall/install 目标无 check/test；CMakeLists 无 enable_testing；全树无 tests/ 目录与测试源文件"
  test_package_tests: 3
  test_package_detail:
    - "curseofwar -v 精确版本断言（1.3.0）"
    - "curseofwar -h 帮助断言（Command line arguments + 作者横幅）"
    - "无头游戏循环 smoke：Map is generated 渲染 + 29 次游戏内日期推进 + endwin 终端恢复"
  local_result: "3/3 PASS (rc=0)"

knowledge_gained:
  - "上游 Makefile 的 -DVERSION/-DINSTALL_DATA 宏在命令行覆盖 CPPFLAGS 后丢失，必须显式补回"
  - "mksh (/system/bin/sh) 下嵌套引号转义用 -DVERSION='\\\"1.3.0\\\"' 单引号形式，三层 shell 都能存活"
  - "ncurses/6.6 只提供 libncursesw.a，需建 libncurses.a 符号链接（dhex/dialog 先例）"
  - "ncurses 程序无头 smoke 需强制 TERM=xterm + TERMINFO 指向包内 terminfo；游戏时钟推进用 ESC[19d<DD> 渲染序列计数验证"
