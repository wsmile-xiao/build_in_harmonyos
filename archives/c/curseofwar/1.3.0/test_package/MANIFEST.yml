# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: curseofwar/1.3.0
homepage: "https://github.com/a-nikolaev/curseofwar"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: curseofwar-1.3.0.tar.gz, sha256 2a90204d95a9f29a0e5923f43e65188209dc8be9d9eb93576404e3f79b8a652b)
upstream_test_audit:
  source_tarball: "curseofwar-1.3.0.tar.gz"
  source_sha256: "2a90204d95a9f29a0e5923f43e65188209dc8be9d9eb93576404e3f79b8a652b"
  top_level_files:
    - Makefile            # 仅 all/clean/uninstall/install 目标与 .c.o 后缀规则; 无 check/test/TESTS 目标
    - CMakeLists.txt      # 仅 add_executable(curseofwar/curseofwar-sdl), 无 enable_testing/add_test
    - main.c/output.c     # 纯实现源 (游戏主循环/ncurses 渲染), 无 TEST()/TEST_F (gtest) / def test_ (pytest)
    - COMPILE-WITH-CMAKE  # 编译说明文档, 非测试
    - INSTALL/README      # 安装/使用文档, 无测试说明
    - curseofwar.6        # man 手册页, 非测试
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile check / test / TESTS 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "ctest / meson test / configure.in 测试宏 (enable_testing / add_test)"
    - "find . -name '*test*' (全树)"
  scan_result: "0 matches — 全树无 tests/ 目录与测试源文件; Makefile 无 check/test 目标; CMakeLists 无 enable_testing/add_test; 项目为交互式 ncurses RTS 游戏, 上游不提供测试套件"
  make_check_output: "Makefile 未定义 check 目标 — make check 无规则可执行, 上游测试执行数为 0"
  reason: "curseofwar 1.3.0 为交互式 ncurses RTS 游戏项目, 官方源码包不含任何测试套件: 无 tests/ 目录、无测试源文件、无 check/test 目标 (Makefile 仅 all/clean/uninstall/install)。功能验证由 test_package 真实执行 curseofwar 二进制完成 (-v 精确版本断言 + -h 帮助断言 + 无头游戏循环 smoke: 固定种子地图生成/游戏时钟推进/终端恢复)"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质执行被测包的二进制
test_package_tests:
  - file: test.sh
    description: "功能测试: curseofwar -v 精确版本断言(1.3.0) + -h 帮助断言(含 Command line arguments/Curse of War) + 无头游戏循环 smoke(固定种子 -R 42: Map is generated 渲染 + 游戏内日期 19xx 推进 + endwin 终端恢复序列)"
    command: "bash test.sh"
  - file: conanfile.py
    description: "Conan test() 入口, 执行 test.sh 并输出 HMBS 机器证据标记 (test_package discovered=3/passedCount=3 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test.sh 的 3 个真实断言, 与 HMBS_TEST_PACKAGE_RESULT discovered=3 一致)
assertion_count: 3
