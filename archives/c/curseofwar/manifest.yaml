software: curseofwar
display: "curseofwar"
description: "Curse of War — ncurses 实时战略游戏 (RTS)"
category: game
homepage: "https://github.com/a-nikolaev/curseofwar"
license: GPL-3.0-or-later
build_system: make

ohos_adaptation:
  key_points:
    - "纯 C 代码 + POSIX socket (multiplayer), 无平台特定 API; 单二进制 ncurses 前端"
    - "依赖 ncurses/6.6 (宽字符静态库 libncursesw.a, 需建 libncurses.a 符号链接让 -lncurses 解析)"
    - "Makefile 自带 -DVERSION/-DINSTALL_DATA 宏, 命令行覆盖 CPPFLAGS 时必须显式补回"
    - "游戏为 SIGALRM 定时器驱动实时循环; 无头 smoke 用 timeout+固定种子 -R 验证地图生成/时钟推进/endwin 终端恢复"
  common_dependencies:
    - "ncurses/6.6"

versions:
  "1.3.0":
    status: published
    build_date: "2026-09-11"
    conan_ref: "curseofwar/1.3.0"
