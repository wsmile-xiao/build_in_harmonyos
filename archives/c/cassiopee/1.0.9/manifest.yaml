software: cassiopee
version: "1.0.9"
status: built
build_system: cmake
build_date: "2026-09-07"

source:
  url: "https://github.com/osallou/cassiopee-c/archive/refs/tags/1.0.9.tar.gz"
  sha256: "cdd022ff8c30ffbff91593da3dddbfa4a71448de2bd8f0c192e06c98e52606c4"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - "boost/1.90.0.4"
    - "glog/0.7.1"
    - "cppunit/1.15.1 (build/test only)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-modernize-and-remove-host-path.patch"

knowledge_gained:
  - "HarmonyOS loader does not resolve the upstream relative ../lib/libcassie.so DT_NEEDED layout; static Cassie avoids the invalid runtime dependency."
  - "Cassiopee uses Boost.Serialization but does not use Boost.Iostreams; boost/1.90.0.4 provides the required headers and library."
  - "Optional OpenMP is disabled so the static Cassie library has no undeclared toolchain runtime dependency."

tests:
  upstream_unit: 13
  consumer_integration: 1
  passed: 14
  total: 14
