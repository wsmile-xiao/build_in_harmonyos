# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cmor/3.15.2
homepage: "https://github.com/PCMDI/cmor"

# 上游测试命令 (make 目标的测试清单，见 Makefile.in test_C/test 目标)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（C 测试目标，来自 Makefile.in test_C）
upstream_tests:
  - file: Test/ipcc_test_code.c
    source: cmor-3.15.2/Test/ipcc_test_code.c
    description: "CMOR 端到端 IPCC 风格写入测试"
    command: "make test_a_C (TEST_NAME=ipcc_test_code)"
  - file: Test/test_singletons.c
    source: cmor-3.15.2/Test/test_singletons.c
    description: "单例变量写入测试"
    command: "make test_a_C (TEST_NAME=test_singletons)"
  - file: Test/test_grid.c
    source: cmor-3.15.2/Test/test_grid.c
    description: "网格定义测试"
    command: "make test_a_C (TEST_NAME=test_grid)"
  - file: Test/test_cmor_grid_unstructured_fabi.c
    source: cmor-3.15.2/Test/test_cmor_grid_unstructured_fabi.c
    description: "非结构化网格测试"
    command: "make test_a_C (TEST_NAME=test_cmor_grid_unstructured_fabi)"
  - file: Test/test_cmor_grid_unstructured_3d_fabi.c
    source: cmor-3.15.2/Test/test_cmor_grid_unstructured_3d_fabi.c
    description: "非结构化 3D 网格测试"
    command: "make test_a_C (TEST_NAME=test_cmor_grid_unstructured_3d_fabi)"
  - file: Test/test_unit_cat_unique.c
    source: cmor-3.15.2/Test/test_unit_cat_unique.c
    description: "单位分类唯一性测试"
    command: "make test_a_C (TEST_NAME=test_unit_cat_unique)"
  - file: Test/test_cmor_append_associated.c
    source: cmor-3.15.2/Test/test_cmor_append_associated.c
    description: "追加关联变量测试"
    command: "make test_a_C (TEST_NAME=test_cmor_append_associated)"
  - file: Test/test_cmor_append_associated_point.c
    source: cmor-3.15.2/Test/test_cmor_append_associated_point.c
    description: "追加关联点变量测试"
    command: "make test_a_C (TEST_NAME=test_cmor_append_associated_point)"
  - file: Test/test_cmor_singleton_and_generic.c
    source: cmor-3.15.2/Test/test_cmor_singleton_and_generic.c
    description: "单例与通用变量测试"
    command: "make test_a_C (TEST_NAME=test_cmor_singleton_and_generic)"
  - file: Test/test_cmor_nwdFracLut.c
    source: cmor-3.15.2/Test/test_cmor_nwdFracLut.c
    description: "查找表变量测试"
    command: "make test_a_C (TEST_NAME=test_cmor_nwdFracLut)"
  - file: Test/test_cmor_depth_coord_half.c
    source: cmor-3.15.2/Test/test_cmor_depth_coord_half.c
    description: "深度坐标半层测试"
    command: "make test_a_C (TEST_NAME=test_cmor_depth_coord_half)"
  - file: Test/test_sdepth1_float.c
    source: cmor-3.15.2/Test/test_sdepth1_float.c
    description: "深度坐标 float 测试"
    command: "make test_a_C (TEST_NAME=test_sdepth1_float)"
  - file: Test/test_lots_of_variables.c
    source: cmor-3.15.2/Test/test_lots_of_variables.c
    description: "大量变量写入测试"
    command: "make test_a_C (TEST_NAME=test_lots_of_variables)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：版本宏断言 + cmor_setup/cmor_close 基本 C API"
    command: "./test_cmor"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
