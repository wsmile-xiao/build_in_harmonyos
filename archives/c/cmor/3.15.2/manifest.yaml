# 版本级 manifest — cmor 3.15.2
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.15.2"

# 软件名
software: "cmor"

# 编译状态
# published | built | failed | archived
# R3：published 语义=CI upload 成功。当前 pre-PR 阶段仅本地 conan create
# 通过、制品未上传制品仓，故标记 built；待 CI upload 成功后再置 published。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-14"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag）
  url: "https://github.com/PCMDI/cmor/archive/refs/tags/3.15.2.tar.gz"

  # 源码校验和
  sha256: "1bb4a80b27710dd9b72f1cdae671e22f2db6631526feadb3d87a6e30e613fd32"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-fortran=no"        # OHOS 无 gfortran；禁用后 LIBFILES 仅含 C 目标
    - "--with-netcdf=no"           # 由 AutotoolsDeps 注入 LDFLAGS 解析 netcdf
    - "--with-udunits2=<pkg>"      # 指向 conan udunits 包目录
    - "--with-json-c=<pkg>"        # 指向 conan json-c 包目录
    - "--with-uuid=<pkg>"          # 指向 conan uuid 包目录
    - "--disable-dependency-tracking"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "netcdf/4.9.3"
    - "udunits/2.2.28.1"
    - "json-c/0.17"
    - "uuid/2.40.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 说明：无静态补丁文件；配方 build() 内做以下运行时适配——
#   1) 向 release tarball 自带 config.guess/config.sub 幂等注入 OHOS 识别
#      （HarmonyOS → aarch64-unknown-linux-ohos，OS 校验加 ohos*/linux-ohos*）
#   2) configure 的 netcdf 探测段保留环境 LDFLAGS/CFLAGS（SV_LDFLAGS/SV_CFLAGS）
#   3) configure/config.status 中 umask 077→022（HMDFS setgid 权限问题）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cmor 公共头 include/cmor_func_def.h 直接 #include <udunits2.h>、<json-c/json.h>、<netcdf.h>、<uuid/uuid.h> 及 include/cdTime 子目录头，conan 配方需 requirements(headers=True) 且 cpp_info.includedirs 含 include/cdTime，否则消费者编译缺依赖头"
  - "release tarball 不含 3 个 submodule（cmip6/mip/cmip7-cmor-tables），上游 Test 用 Tables/ 相对路径引用；配方 source() 从官方 GitHub archive 下载并保持目录，测试运行时需 Tables 符号链接"
  - "OHOS 上 configure 的 conftest 与测试程序运行需 NDK libc++ 目录（hdf5 C++ 绑定 libnetcdf→libhdf5_cpp→libc++_shared.so 链）在 LD_LIBRARY_PATH；否则段错误"
  - "configure.ac 用 AC_ARG_WITH([netcdf]) 且优先 nc-config，而 conan netcdf 包的 nc-config 写死构建期路径；传 --with-netcdf=no + AutotoolsDeps LDFLAGS 绕过"
