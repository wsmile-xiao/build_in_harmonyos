patches:
  "3.15.2":
    - patch_file: "patches/0001-configure-ohos-portability.patch"
      patch_type: "portability"
      description: "configure 生成文件 OHOS 可移植性修正：configure 的 netcdf 探测段保留环境 LDFLAGS/CFLAGS（SV_LDFLAGS/SV_CFLAGS，避免 LDFLAGS=${NCLDFLAGS} 覆盖注入的 -L 路径）；config.status 临时目录 umask 077→022（HMDFS setgid E129 权限）"
    - patch_file: "patches/0002-cmor-fix-buffer-overflows.patch"
      patch_type: "bugfix"
      description: "修复 cmor 库自身两处内存越界（上游测试在 musl/OHOS 下 SIGSEGV 根因，ASAN 确认）：① strncpytrim 对空字符串输入读 in[-1]（全局缓冲区越界，cmor.c 的 while 循环先判 in[k] 后判 k>0）；② cmor_setGblAttr 写 singleton 维度时 j==-1（无 singleton）仍访问 cmor_axes[-1]（负索引越界）"
    - patch_file: "patches/0003-cmor-fix-bad-regfree.patch"
      patch_type: "bugfix"
      description: "修复 cmor_CV_checkSourceType 对未初始化 regex_t 调用 regfree 的缺陷：szTokenAdd 循环 AER/else 分支在 regcomp 之前就 regfree、regcomp 失败分支也 regfree 未编译的 regex；musl 的 regfree 解引用未初始化指针导致 SIGSEGV。统一为先 regcomp 成功再 regexec 再 regfree"
