knowledge_gained:
  - "header-only 库的公开头相对 include 内置依赖头（CTurtle.hpp -> CImg.h）时，package() 必须把依赖头一并装入 include/ 同目录，否则消费者编译报 file not found（同族知识 DRAFT-gli-headeronly-ship-bundled-dep-headers）"
  - "消费者必须在 include CTurtle.hpp 前定义 CTURTLE_HEADLESS：该宏设置 cimg_display=0 关闭 CImg X11 后端，headless 模式把画面写为 GIF（CTURTLE_HEADLESS_SAVEDIR），OHOS 无需图形栈"
  - "上游无 git tag/release（README 版本 1.0.5 vs 头文件 CTURTLE_VERSION_PATCH \"4\" 不一致），以官方 commit 归档 URL 固定源码更可靠"