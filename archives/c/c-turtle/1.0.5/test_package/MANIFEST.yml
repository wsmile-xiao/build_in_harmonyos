# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: c-turtle/1.0.5
homepage: "https://github.com/walkerje/C-Turtle"

# 上游测试命令：header-only 库无构建系统，无 make -n check / ctest -N 入口
upstream_check_command: "none (header-only, no build system)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "none"

# 上游实际运行的测试程序（header-only 库无独立上游测试套件；examples/ 为示例程序）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/test_cturtle.cpp
    description: "HarmonyOS 消费者用例（L1）：headless 模式画正方形（forward/right/xcor/ycor 断言）+ write 文本 + GIF 输出文件非空验证"
    command: "./test_cturtle"
  - file: src/test_fractal.cpp
    description: "HarmonyOS 专项测试：headless Koch 分形递归渲染（forward/left/right/penup/pendown/speed/pencolor）+ GIF 输出非空验证"
    command: "./test_fractal"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6