# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: caches/0.1.1
homepage: "https://github.com/vpetrigo/caches"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest"

# 上游测试是否集成在 conanfile.py build() 方法中
# 上游 test/ 依赖 googletest 子模块，官方 tar 不含子模块；35 个上游用例
# 已在本机单独编译运行验证（见 test-report），不重复集成到 conan create
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (gtest 4 个可执行，共 35 个 TEST 用例)
upstream_tests:
  - file: test/lru_cache_tests.cpp
    source: caches-0.1.1/test/lru_cache_tests.cpp
    description: "LRU cache gtest 用例（11 个 TEST）"
    command: "./lru_cache_tests"
  - file: test/fifo_cache_tests.cpp
    source: caches-0.1.1/test/fifo_cache_tests.cpp
    description: "FIFO cache gtest 用例（8 个 TEST）"
    command: "./fifo_cache_tests"
  - file: test/lfu_cache_tests.cpp
    source: caches-0.1.1/test/lfu_cache_tests.cpp
    description: "LFU cache gtest 用例（8 个 TEST）"
    command: "./lfu_cache_tests"
  - file: test/nopolicy_cache_tests.cpp
    source: caches-0.1.1/test/nopolicy_cache_tests.cpp
    description: "NoPolicy cache gtest 用例（8 个 TEST）"
    command: "./nopolicy_cache_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：LRU/FIFO Put/Get/Size/Remove 真实调用"
    command: "./test_caches"
  - file: ohos_specific_test.cpp
    description: "HarmonyOS 专项测试：四策略实例化/自定义类型/TryGet/并发线程"
    command: "./test_caches_ohos"

# 测试断言总数 (近似值, 上游 assertion 统计)
assertion_count: 150