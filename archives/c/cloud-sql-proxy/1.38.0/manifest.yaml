software: cloud-sql-proxy
version: "1.38.0"
build_system: custom
status: published
build_date: "2026-06-01"

source:
  url: "https://github.com/GoogleCloudPlatform/cloud-sql-proxy/archive/refs/tags/v1.38.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags='-s -w -X github.com/GoogleCloudPlatform/cloudsql-proxy/proxy/util.versionString=1.38.0' -o $DEFAULT_PREFIX/bin/cloud-sql-proxy ./cmd/cloud_sql_proxy/"
  dependencies:
    - "go/1.26.3"
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Go项目使用CGO_ENABLED=0静态编译避免PIE/DYN签名损坏TLS header"
  - "Go 1.26.3用于满足go.mod >= 1.25.7的要求"
  - "Go项目模块名与GitHub仓库名可能不同(cloudsql-proxy vs cloud-sql-proxy)"
  - "Go项目主包路径需确认(cmd/cloud_sql_proxy而非根目录)"
  - "Go版本ldflag需使用正确的包路径和变量名(proxy/util.versionString)"