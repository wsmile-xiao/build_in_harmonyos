# test_package/MANIFEST.yml — clog 1.3.0
# 上游 release 包无测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）

package: clog/1.3.0
homepage: "https://gothenburgbitfactory.org/clog/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "clog-1.3.0.tar.gz（GitHub 官方 release 资产，705807 字节，sha256=fed44a8d...5d2018）"
    finding: "解包共 92 个文件，无 test/ 目录；上游 CMakeLists 用 CPack 打包时明确排除 test（CPACK_SOURCE_IGNORE_FILES 含 test），release 包天然无测试"
  - path: "CMakeLists.txt（v1.3.0，commit 98b53f0）"
    finding: "仅当源码树存在 test 目录才 add_subdirectory(test EXCLUDE_FROM_ALL)，release 包该条件恒为假，无任何测试目标"
  - path: "test/CMakeLists.txt（Git 源码树 v1.3.0）"
    finding: "set(test_SRCS) 为空，add_custom_target(test ./run_all) 无实际用例编译；Gentoo ebuild 亦标注 RESTRICT=test（No test suite on tar.gz），佐证无可接入的上游测试"
  - path: "src/CMakeLists.txt"
    finding: "仅定义 clog/libshared 静态库与 clog_executable 可执行文件目标，无 enable_testing/ctest 接线"
upstream_test_reason: "上游 release 包不含任何测试用例（test_SRCS 为空，test 目录未打包），无可运行的上游测试套件"

test_package_tests:
  - file: test_clog.sh
    description: "消费者功能测试：真实执行 bin/clog 完成 4 项验证——--version 版本号、--help 用法、规则命中行保留内容、非命中行透传（R34 合规）"
    command: "bash test_clog.sh（VirtualRunEnv 下 clog 在 PATH）"

assertion_count: 4
