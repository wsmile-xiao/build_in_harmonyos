version: "1.3.0"
software: "clog"
status: built
build_date: "2026-09-08"
build_system: "cmake"

source:
  url: "https://github.com/GothenburgBitFactory/clog/releases/download/v1.3.0/clog-1.3.0.tar.gz"
  mirrors:
    - "https://gh-proxy.com/https://github.com/GothenburgBitFactory/clog/releases/download/v1.3.0/clog-1.3.0.tar.gz"
  sha256: "fed44a8d398790ab0cf426c1b006e7246e20f3fcd56c0ec4132d24b05d5d2018"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-home-fallback.patch (portability: getpwuid fallback to $HOME)"

knowledge_gained:
  - "release 包自带 libshared 子模块内容，无需递归抓取子模块。"
  - "release 包无 test 目录且上游 test_SRCS 为空，无可接入的上游测试，按 no_tests 审计处理。"
  - "cmake_minimum_required(2.8) 在新版 CMake 下用 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容，无需补丁改上游。"
