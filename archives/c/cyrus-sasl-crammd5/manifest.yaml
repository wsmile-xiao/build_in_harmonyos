# 软件级 manifest
# 文件位置: archives/c/cyrus-sasl-crammd5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: cyrus-sasl-crammd5

# 显示名
display: "Cyrus SASL CRAM-MD5 mechanism"

# 一句话描述
description: "Cyrus SASL CRAM-MD5 authentication mechanism (libsasl2 with CRAM-MD5 support)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: security

# 官网 URL
homepage: "https://www.cyrusimap.org/sasl/"

# 开源许可证（SPDX 标识）
license: BSD-Attribution-HPND-disclaimer

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "CRAM-MD5 为自包含 HMAC-MD5 机制（plugins/cram.c，RFC 2195），不链 -lcrypto，零 Conan 依赖"
    - "上游默认启用 CRAM-MD5（--enable-cram），其余机制/后端全部关闭"
    - "PLAIN 由上游默认启用且本包显式 --disable-plain，闭包仅保留 CRAM-MD5（+ 内置 EXTERNAL）"
    - "configure 需显式喂 CC_FOR_BUILD=clang（OHOS 无 gcc/cc）"
    - "静态构建 --with-staticsasl，无需运行期 SASL_PATH/dlopen 插件搜索"
    - "Autoconf 临时目录 umask 077 在 HMDFS 上不可写，configure 补丁改为 022"
    - "上游测试 utils/testsuite -a 需 sasldb/LMDB 闭包，经默认关闭的 with_upstream_tests/with_sasldb 选项实际执行"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.1.28":
    status: built
    build_date: "2026-09-26"
    conan_ref: "cyrus-sasl-crammd5/2.1.28"
    note: "CRAM-MD5 机制首个适配版本；待 HMBS 真机验证通过后标 published"
