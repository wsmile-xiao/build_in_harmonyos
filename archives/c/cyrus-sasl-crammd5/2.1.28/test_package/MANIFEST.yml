# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cyrus-sasl-crammd5/2.1.28
homepage: "https://www.cyrusimap.org/sasl/"

# 上游测试套件存在性
# cyrus-sasl 2.1.28 发布包**不含 automake `make check` 目标**，但**含真实的自动化
# 测试程序** utils/testsuite.c（构建为 `testsuite`，运行入口 `utils/testsuite -a`）。
# 因此为 true —— 本配方在 with_upstream_tests/with_sasldb 测试闭包中实际构建并运行。
upstream_tests_exist: true

# 上游测试审计 (源码: cyrus-sasl-2.1.28.tar.gz,
# sha256 7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c)
upstream_test_audit:
  source_tarball: "cyrus-sasl-2.1.28.tar.gz"
  source_sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / add_test (ctest)"
    - "check_PROGRAMS / TESTS (automake make check)"
    - "EXTRA_PROGRAMS (手工构建的测试程序)"
  scan_result: >-
    顶层 Makefile.am 与各子目录 Makefile.am 均无 `TESTS`/`check_PROGRAMS`/`check-local`
    目标（无 automake `make check`）；utils/Makefile.am:49 以 EXTRA_PROGRAMS 声明
    `testsuite`/`testsuitestatic`，即需显式 `make testsuite` 构建的自动化测试程序。
    故本库的自动化测试入口为 `utils/testsuite -a`。
  upstream_test_programs:
    - "utils/testsuite.c     — 自动化测试程序（`testsuite -a`：基础阶段 7 项 + 机制协商 8 项 + corruption + proxy-policy + security-layer）"
    - "utils/testsuitestatic.c（同一 testsuite.c，静态链接变体）"
  manual_only_programs:
    - "utils/smtptest.c — 需运行中的 SMTP 服务端，非自动化断言套件"
    - "saslauthd/testsaslauthd.c — 需运行中 saslauthd 守护进程（本配方 --without-saslauthd）"
    - "sample/client.c + sample/server.c + sample/*.c — 示例程序，需交互式客户端/服务端配对（本配方 --disable-sample）"
  reason: >-
    cyrus-sasl 2.1.28 无 automake `make check`，但提供真实的自动化测试程序
    utils/testsuite；其明文口令/auxprop 阶段需要 sasldb 口令库，故本配方通过
    默认关闭的 with_upstream_tests/with_sasldb 测试闭包（LMDB 仅存在于临时测试树，
    不进交付包）实际构建并运行 `utils/testsuite -a`。

# 上游测试命令
upstream_check_command: "make testsuite && utils/testsuite -a -s 1"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make testsuite; saslpasswd2 -p -f utils/sasldb -c ken; utils/testsuite -a -s 1"

# 上游实际运行的测试程序
upstream_tests:
  - file: utils/testsuite.c
    description: >-
      上游自动化测试程序，`testsuite -a` 全量运行（需 sasldb 口令库 fixture）。
      种子固定为 -s 1：该程序以 time(NULL) 播种、corruption 阶段用 rand() 选字节，
      不固定则结果不可复现（实测 10 种子中 3 个命中上游自检
      `client username does not match server username`）；`-s` 为该程序自带参数，
      不改变任何测试输入/断言/判定标准
    command: "./utils/.libs/testsuite -a -s 1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_crammd5.c
    description: >-
      消费者测试：MD5/HMAC-MD5 自校验（RFC 1321/RFC 2202 向量）+ 版本 2.1 校验 +
      client/server 初始化与建连 + 两侧机制枚举含 CRAM-MD5 + 真实 CRAM-MD5 往返
      （服务端挑战 → 客户端响应 → 本地重算 HMAC-MD5 逐字节比对）
    command: "./test_crammd5"
  - file: test_crammd5.c
    description: >-
      鸿蒙特有测试：SASL_PATH 指向不存在目录时仍能枚举 CRAM-MD5，验证
      --with-staticsasl 静态链入（无运行期插件目录/dlopen）的 OHOS 适配
    command: "SASL_PATH=<missing> ./test_crammd5 --ohos-static-only"

# 测试断言总数
assertion_count: 10
