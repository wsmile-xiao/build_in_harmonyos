# 版本级 manifest
# 文件位置: archives/c/cyrus-sasl-crammd5/2.1.28/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.28"

# 软件名
software: "cyrus-sasl-crammd5"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 cyrus-sasl 2.1.28 同源：CRAM-MD5 机制是上游源码内 plugins/cram.c）
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"

  # 源码校验和
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（CRAM-MD5 专用最小闭包：只开 cram，其余机制/后端全关）
  configure_options:
    - "--enable-cram"
    - "--disable-shared"
    - "--enable-static"
    - "--with-staticsasl"
    - "--with-dblib=none"
    - "--disable-auth-sasldb"
    - "--disable-plain"
    - "--disable-anon"
    - "--disable-digest"
    - "--disable-scram"
    - "--disable-otp"
    - "--disable-srp"
    - "--disable-ntlm"
    - "--disable-login"
    - "--disable-passdss"
    - "--disable-gssapi"
    - "--disable-ldapdb"
    - "--disable-sql"
    - "--disable-sample"
    - "--without-saslauthd"
    - "--without-openssl"

  # 编译依赖列表（格式: name/version）
  # 交付包零依赖；lmdb/0.9.35 仅作为 with_upstream_tests/with_sasldb 测试闭包的
  # visible=False 依赖，且已从 package_id 中移除。
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure-ohos-umask.patch"
  - "0002-testsuite-use-int-for-getopt.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（每条附 ref: 指向知识来源/知识库条目）
knowledge_gained:
  - "CRAM-MD5 是自包含 HMAC-MD5 机制（plugins/cram.c），configure.ac 打开它不引用 OpenSSL，链接行无 -lcrypto → 零依赖可编（ref: 上游 configure.ac:312-331, plugins/Makefile.am:95）"
  - "HMAC-MD5 原语由源码树内 lib/md5.c + lib/common.c 提供，无需外部 crypto 库（ref: 上游 lib/md5.c, lib/common.c 的 hmac_md5）"
  - "PLAIN 由 m4/plain.m4 默认启用且无 configure 开关之外的路径；本包显式 --disable-plain 收敛闭包（ref: 上游 m4/plain.m4 SASL_PLAIN_CHK）"
  - "Autoconf configure 在 HMDFS 上以 umask 077 建 ./confXXXXXX 临时目录，属主不可写 → config.status 'Permission denied'；补丁改 umask 022（ref: E011；本包以 patches/0001-configure-ohos-umask.patch 固化）"
  - "configure 用 AX_PROG_CC_FOR_BUILD 裸搜 gcc/cc，OHOS 仅有 clang，需显式喂 CC_FOR_BUILD=clang（ref: 同族先例 archives/c/cyrus-sasl/2.1.28.1）"
  - "静态构建 --with-staticsasl 把 cram.c 等链入 libsasl2.a，无需运行期 SASL_PATH/dlopen（ref: 上游 lib/Makefile.am linksrcs；同族先例 archives/c/cyrus-sasl-login/2.1.28）"
  - "上游无 automake make check，但 utils/testsuite.c（testsuite -a）是真实自动化测试程序；其明文口令阶段需 sasldb 口令库（LMDB），故测试走独立临时测试树（ref: R51 清点证据 utils/Makefile.am:49；同族先例 archives/c/cyrus-sasl/2.1.28.1 with_upstream_tests）"
  - "旧式 C 测试程序用 char 承接 getopt() 返回值，在 OHOS aarch64 上 EOF 哨兵截断失效 → 测试程序直接退出（Failed with: Invalid parameter）、整轮用例 0 执行；改为 int 即恢复，不改测试内容（ref: 本 PR 贡献草稿 knowledge/drafts/E6401-draft-1687.kv；同族先例 archives/c/cyrus-sasl/2.1.28.1/patches/0003）"

