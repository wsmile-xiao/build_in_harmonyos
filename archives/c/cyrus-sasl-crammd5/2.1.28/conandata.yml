sources:
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"

patches:
  - patch_file: "patches/0001-configure-ohos-umask.patch"
    patch_description: >-
      OHOS/HMDFS: Autoconf creates its temporary directory with `umask 077`,
      which on the device filesystem yields a directory the owner cannot
      write into, so `config.status` fails with
      "can't create ./confXXXXXX/subs1.awk: Permission denied".
      Relax the umask for that mktemp/mkdir pair to 022.
    patch_type: "portability"
  - patch_file: "patches/0002-testsuite-use-int-for-getopt.patch"
    patch_description: >-
      utils/testsuite.c stores the getopt() result in a `char`.  On the OHOS
      aarch64 test build the truncation makes the EOF sentinel non-terminal,
      so the option loop falls into `default:` and exits with
      "Usage: ... Failed with: Invalid parameter" instead of running the
      suite.  Store the result in the `int` type getopt() is specified to
      return.  No test inputs, assertions or pass criteria are changed.
    patch_type: "portability"
