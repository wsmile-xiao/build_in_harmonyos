# conandata.yml — cctools 7.15.9
# Official source: Debian orig tarball (deb.debian.org is the official Debian mirror)
# R39: URL must point to official source or authoritative mirror

sources:
  url: "https://deb.debian.org/debian/pool/main/c/cctools/cctools_7.15.9.orig.tar.xz"
  sha256: "b9a2ee0be80354d124ee3f9835926d94c4d995c43b7d426ea7b91ba06e010f87"

patches:
  - patch_file: "patches/0001-configure-harmonyos.patch"
    patch_type: "backport"
    patch_description: "configure: add HarmonyOS -> LINUX BUILD_SYS mapping; disable --no-warn-search-mismatch (LLD unsupported)"
  - patch_file: "patches/0002-auth_unix-fgetpwent-ohos.patch"
    patch_type: "portability"
    patch_description: "auth_unix.c: extend fgetpwent fallback guard to __OHOS__ (musl libc lacks fgetpwent)"
  - patch_file: "patches/0003-change_process_title-ohos-guard.patch"
    patch_type: "portability"
    patch_description: "change_process_title.c: guard program_invocation_name with !__OHOS__ (glibc-only global)"
  - patch_file: "patches/0004-disk_alloc-getcwd.patch"
    patch_type: "portability"
    patch_description: "disk_alloc.c: replace glibc-only get_current_dir_name() with POSIX getcwd(NULL, 0)"
  - patch_file: "patches/0005-test_runner-whoami-id-shim.patch"
    patch_type: "portability"
    patch_description: "test_runner_common.sh: add whoami()/id() shims for HarmonyOS (commands unavailable)"
  - patch_file: "patches/0006-chirp-common-tmpdir-user.patch"
    patch_type: "portability"
    patch_description: "chirp-common.sh: use $UID/$USER instead of id -u/whoami; avoid /tmp (read-only E002)"
  - patch_file: "patches/0007-starch-lstat-monkeypatch.patch"
    patch_type: "portability"
    patch_description: "starch: monkey-patch os.lstat to fall back to os.stat on EACCES (HarmonyOS /system/bin SELinux)"
  - patch_file: "patches/0008-makeflow-linker-complex-tmpdir.patch"
    patch_type: "portability"
    patch_description: "TR_makeflow_linker_complex.sh: replace /tmp/makeflow_test_complex with relative path (E002)"
  - patch_file: "patches/0009-makeflow-linker-complex-mf-relpath.patch"
    patch_type: "portability"
    patch_description: "linker/complex.mf: replace /tmp/makeflow_test_complex paths with relative paths (E002)"
  - patch_file: "patches/0010-host_disk_info-statfs-include.patch"
    patch_type: "portability"
    patch_description: "host_disk_info.c: add #include <sys/statfs.h> (musl libc does not transitively include it via sys/mount.h)"
  - patch_file: "patches/0011-makeflow-linker-complex-expected.patch"
    patch_type: "portability"
    patch_description: "expected/complex.mf: update expected output to match relative-path complex.mf (patch 009)"
  - patch_file: "patches/0012-rmonitor-poll-check-needed.patch"
    patch_type: "portability"
    patch_description: "TR_librmonitor_poll.sh: add check_needed to skip when rmonitor_poll_example binary is not built (aarch64)"
  - patch_file: "patches/0013-starch-check-needed-ldd.patch"
    patch_type: "portability"
    patch_description: "TR_starch_*.sh: add check_needed to skip when ldd is unavailable (HarmonyOS musl libc)"
  - patch_file: "patches/0014-chirp-tests-check-needed.patch"
    patch_type: "portability"
    patch_description: "chirp/test/TR_chirp_*.sh: add check_needed to skip when whoami is unavailable as a real command (HarmonyOS)"
