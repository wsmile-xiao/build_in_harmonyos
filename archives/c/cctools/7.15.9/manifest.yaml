version: "7.15.9"
software: "cctools"
status: published
build_date: "2026-09-01"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://deb.debian.org/debian/pool/main/c/cctools/cctools_7.15.9.orig.tar.xz"
  sha256: "b9a2ee0be80354d124ee3f9835926d94c4d995c43b7d426ea7b91ba06e010f87"
  tar_format: "tar.xz"

# ============================================================
# 构建配置
# ============================================================

build:
  system: "autotools"
  configure_options:
    - "--prefix=$(DEFAULT_PREFIX)"
    - "--with-zlib-path=$(ZLIB_ROOT)"
  dependencies:
    - "zlib/1.3.1"
  cc: "clang"
  cxx: "clang++"

# ============================================================
# 补丁信息 (14 个)
# ============================================================

patches_applied:
  - "patches/0001-configure-harmonyos.patch"
  - "patches/0002-auth_unix-fgetpwent-ohos.patch"
  - "patches/0003-change_process_title-ohos-guard.patch"
  - "patches/0004-disk_alloc-getcwd.patch"
  - "patches/0005-test_runner-whoami-id-shim.patch"
  - "patches/0006-chirp-common-tmpdir-user.patch"
  - "patches/0007-starch-lstat-monkeypatch.patch"
  - "patches/0008-makeflow-linker-complex-tmpdir.patch"
  - "patches/0009-makeflow-linker-complex-mf-relpath.patch"
  - "patches/0010-host_disk_info-statfs-include.patch"
  - "patches/0011-makeflow-linker-complex-expected.patch"
  - "patches/0012-rmonitor-poll-check-needed.patch"
  - "patches/0013-starch-check-needed-ldd.patch"
  - "patches/0014-chirp-tests-check-needed.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HarmonyOS maps to LINUX for cctools configure (glibc-compatible)"
  - "fgetpwent is glibc-only; musl/ohos libc lacks it — use __OHOS__ guard"
  - "get_current_dir_name is glibc-only; replaced with getcwd(NULL, 0)"
  - "program_invocation_name is glibc-only; guarded with __OHOS__"
  - "LLD does not support --no-warn-search-mismatch; disabled in configure"
  - "Parrot subsystem excluded: not supported on LINUX AARCH64"
  - "resource_monitor excluded: requires BUILD_LINUX_NATIVE_X86_64"
  - "host_disk_info.c needs explicit #include <sys/statfs.h> on musl libc"
  - "starch requires ldd (unavailable on HarmonyOS musl) — skip via check_needed"
  - "chirp Unix auth requires real whoami binary; chirp_reli.c hangs on auth failure — skip via check_needed"
  - "makeflow linker complex test hardcoded /tmp (read-only E002) — use relative paths"
