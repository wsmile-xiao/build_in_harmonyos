# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: cctools/7.15.9
homepage: "https://github.com/cooperative-computing-lab/cctools"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: dttools/test/TR_b64.sh
    source: cctools-7.15.9/dttools/test/TR_b64.sh
    description: "base64 encoding/decoding test"
    command: "./TR_b64.sh"
  - file: makeflow/test/TR_makeflow_001_dirs_01.sh
    source: cctools-7.15.9/makeflow/test/TR_makeflow_001_dirs_01.sh
    description: "makeflow directory rules test 01"
    command: "./TR_makeflow_001_dirs_01.sh"
  - file: chirp/test/TR_chirp_acl.sh
    source: cctools-7.15.9/chirp/test/TR_chirp_acl.sh
    description: "chirp ACL management test"
    command: "./TR_chirp_acl.sh"
  - file: work_queue/test/TR_work_queue_single.sh
    source: cctools-7.15.9/work_queue/test/TR_work_queue_single.sh
    description: "work_queue single task round-trip test"
    command: "./TR_work_queue_single.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "链接 libdttools 并调用 debug() API（R34 实质依赖）"
    command: "./test_cctools"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 make test: ~145 个 TR_ 脚本 (dttools/makeflow/chirp/work_queue/taskvine/resource_monitor)
# test_package: 1 个编译+运行断言 (test_cctools) + makeflow --version 退出码断言
assertion_count: 147
