software: commitlint
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/homebrew/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "homebrew"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/conventional-changelog/commitlint/tar.gz/refs/tags/v19.8.0"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建系统详情
  build_tool: npm
  language: nodejs
  runtime: node

  # 配置选项列表
  configure_options:
    - "npm install --frozen-lockfile --ignore-engines --ignore-scripts"
    - "npx tsc -b"
    - "npm install -g @commitlint/cli@19.8.0 --prefix=$TEST_PREFIX$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "node/v24.13.0"
    - "npm/11.6.2"
    - "yarn/1.22.22"

  # 编译器（Node.js 工具不使用 C/C++ 编译器）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
