# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.8.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.8.1"

# 软件名
software: "cd-hit"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/weizhongli/cdhit"

  # 源码校验和
  sha256: "f8bc3cdd7aebb432fcd35eed0093e7a6413f1e36bbd2a837ebc06e57cdb20b70"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - zlib/1.3.1
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "lang-preflight 对带大量 .pl/.py 辅助脚本的 C/C++ make 项目可能误判 mixed：主体应看 Makefile 编译规则（CC=g++ 编译 *.c++）与核心源码，辅助脚本不算主体（R47 边界规则）"
- "conan 配方 generate() 里 save_script 不能用保留聚合名 'conanbuild'，否则生成自引用 env 脚本导致 SIGSEGV（Error -11）"
- "Makefile 用 `LDFLAGS += -lz -o` 累加式写法时，依赖注入用 env 变量（+= 会追加）；命令行 LDFLAGS= 会覆盖 += 追加，导致链接丢 -o"
- "make 型项目（无 configure）在 basic_layout 下源码在 source_folder、构建在 build_folder，self.run 需 cwd=self.source_folder 并命令行覆盖硬编码 CC"
