# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cd-hit/4.8.1
homepage: "https://github.com/weizhongli/cdhit"

# 上游测试命令: cd-hit 上游 Makefile 无 test/check 目标（无 make check / ctest）
upstream_check_command: "make (上游无测试目标)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 上游未提供自动化测试套件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 真实调用 cd-hit 二进制)
test_package_tests:
  - file: test.sh
    description: "cd-hit 功能测试: 3 条微型序列聚类, 断言 2 簇 (seq1+seq2 同簇, seq3 独立簇) 与 .clstr 内容"
    command: "cd-hit -i in.faa -o out -c 0.9 -n 5 && 校验 out.clstr"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6