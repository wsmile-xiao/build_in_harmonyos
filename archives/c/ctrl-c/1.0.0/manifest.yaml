# 版本级 manifest
# ctrl-c 1.0.0 — 鸿蒙 PC aarch64 适配（ARCHIVE-SPEC v2.0）

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 软件名
software: "ctrl-c"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/evgenykislov/ctrl-c/archive/refs/tags/v1.0.0.tar.gz"

  # 源码校验和
  sha256: "9f63ff2e02ac62a19e30208af746d5a2655ecf040773b6c7d1e27e85be45ee1a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配方 generate() 注入的 CMake 变量（上游无构建系统，CMakeLists.txt 由配方提供）
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（上游源码零修改）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（本次未产生知识草稿，见 §3.8 零草稿为正常终态）
knowledge_gained: []
