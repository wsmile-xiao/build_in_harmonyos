# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ctrl-c/1.0.0
homepage: "https://github.com/evgenykislov/ctrl-c"

# 上游没有测试框架、没有 make check 入口：唯一的测试面是交互式示例
# test/CMakeLists.txt + test/main.cpp（等待 3 次 Ctrl+C 按键后退出 0）。
upstream_check_command: "cmake -S test -B build && cmake --build build"
upstream_test_in_build: false
upstream_test_command: "./test-ctrl-c  # 等待 3 次 SIGINT；设备上由外部 SIGINT 驱动脚本喂信号后返回 0"

# 上游实际运行的测试程序
upstream_tests:
  - file: main.cpp
    source: ctrl-c-1.0.0/test/main.cpp
    description: "交互式示例即上游测试：注册 Ctrl+C handler，捕获 3 次 SIGINT（kMaxCatches=3）后打印 All Ctrl+C's pressed 并返回 0，随后 ResetCtrlCHandler。"
    command: "./test-ctrl-c"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ctrl_c.cpp
    description: "消费者测试 6 用例 / 20 断言：交付头文件指纹（include guard + 常量值）、进程内 SIGINT 投递、重复投递计数、LIFO 与停止传播、单个 reset、清空后恢复 SIG_DFL（sigaction 查询验证）并可重新注册。"
    command: "./test_ctrl_c"

# 测试断言总数 = test_package 20 断言 + 上游示例 1 个通过判据
assertion_count: 21
