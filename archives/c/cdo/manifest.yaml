# 软件级 manifest — cdo
# 遵循 ARCHIVE-SPEC v2.0

software: cdo
display: "CDO"
description: "Climate Data Operators — 气候与数值天气预报模式数据的命令行算子集合（NetCDF/GRIB 读写、统计、插值、重网格等 700+ 算子）"
category: science
homepage: "https://code.mpimet.mpg.de/projects/cdo"
license: BSD-3-Clause
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "CDO 2.6.x 强制 C++20（configure.ac: AX_CXX_COMPILE_STDCXX(20)），且源码用 std::ranges；OHOS clang 15 的 libc++ 15.0.4 默认 _LIBCPP_HAS_NO_INCOMPLETE_RANGES，必须 -D_LIBCPP_ENABLE_EXPERIMENTAL 才能拿到 std::ranges（此时 __cpp_lib_ranges=201811L，低于标准 202110L，上游 >=201911L 的判断要放宽）"
    - "libc++ 15 实验模式下仍缺 std::views::split / std::views::zip；上游用 __cpp_lib_ranges_zip 守卫的代码会自动走手写分支，无需补丁"
    - "静态 C++ 依赖（proj 的 libproj.a）被上游纯 C 驱动的 AC_CHECK_LIB 探测必然失败；autotools 配方需在 LDFLAGS 补 -lc++/-lc++abi（仓内 mtbl/audiofile/cif-api 同款先例）"
    - "musl 无 glibc 的 __off64_t 与 *64 别名：libf2c 的 sysdep1.h0 对 __linux__ 一律走 glibc 分支会编译失败，补丁按 libc（__GLIBC__）分流到 POSIX off_t/fseeko/ftello"
    - "musl 不实现 pthread_cancel()；仅在退出路径使用时改为随进程结束"
    - "clang 15 不支持 lambda 捕获结构化绑定（P1091R3，clang 17 才有）：auto [a,b] 需先拷贝为普通变量再捕获"
    - "依赖版本必须对齐仓内钉版：zlib 用 1.3.1.1（hdf5/netcdf 链），libxml2 用 2.15.3.1；udunits2/magics/szlib/fdb5/CMOR 在 OHOS 制品仓未发布，配方显式关闭（libaec 等价替代 szlib）"
  common_dependencies:
    - netcdf/4.9.3
    - proj/9.3.1
    - eccodes/2.42.0
    - fftw/3.3.10.3
    - libxml2/2.15.3.1
    - curl/8.15.0
    - zlib/1.3.1.1
    - libaec/1.1.7

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.6.3":
    status: built
    build_date: "2026-09-12"
