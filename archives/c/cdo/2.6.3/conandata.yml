# conandata.yml — cdo 2.6.3
# 单一事实源：源码 URL + SHA256 + 补丁清单
sources:
  url: "https://code.mpimet.mpg.de/attachments/download/30224/cdo-2.6.3.tar.gz"
  sha256: "889ece29314b48cbf47ba14ab5f1779886f128767f6d22dfcc7fad1e62f2d017"

patches:
  - patch_file: "patches/0001-libf2c-sysdep1-libc-off-t.patch"
    patch_type: "portability"
    patch_description: "libf2c sysdep1.h0：按 libc 能力区分——仅 glibc 使用 __off64_t 与 *64 别名，非 glibc（musl）Linux 使用 POSIX off_t/fseeko/ftello"
  - patch_file: "patches/0002-cpp-lib-incomplete-ranges.patch"
    patch_type: "portability"
    patch_description: "cpp_lib.h：libc++ 15 的 __cpp_lib_ranges 在实验特性下为 201811L，按 defined(__cpp_lib_ranges) 判定而非 >= 201911L"
  - patch_file: "patches/0003-process-manager-libc-pthread-cancel.patch"
    patch_type: "portability"
    patch_description: "processManager.cc：按 libc 能力选择 pthread_cancel；无取消能力的 libc 走随进程退出分支（该函数仅由 cdo_exit 调用，紧随 std::exit）"
  - patch_file: "patches/0004-diff-cc-lambda-structured-binding.patch"
    patch_type: "portability"
    patch_description: "operators/Diff.cc：clang 15 未实现 lambda 捕获结构化绑定（P1091R3），先拷贝为普通局部变量（语义不变）"
  - patch_file: "patches/0005-operators-lambda-structured-binding.patch"
    patch_type: "portability"
    patch_description: "operators/{Longinfo,Healpix,Info}.cc：同上，结构化绑定先拷贝再被 lambda 捕获"
  - patch_file: "patches/0006-config-guess-sub-ohos.patch"
    patch_type: "portability"
    patch_description: "config.guess/config.sub（cdo 与 libcdi 各一套）：补 HarmonyOS/ohos 识别分支，避免原生构建时 config.guess 走 dummy 编译路径失败（E007 同款做法）"
  - patch_file: "patches/0007-configure-umask-hmdfs.patch"
    patch_type: "portability"
    patch_description: "configure 与 libcdi/configure：临时目录创建的 umask 077 → 022（HMDFS 下 077 创建的目录权限不兼容，config.status 写 subs.awk 会 Permission denied，E011 与 joe 4.6 / idutils 4.6 同款修法）"
  - patch_file: "patches/0008-pytest-exit-status.patch"
    patch_type: "portability"
    patch_description: "test/pytest/cdoTest.py.in：TestModule.run() 的退出码改为反映用例结果（上游恒 exit 0，只靠 TAP 文本表达结果；OHOS 上 automake TAP driver 不可用，改用标准 test-driver 后必须靠退出码判定 PASS/FAIL）"
