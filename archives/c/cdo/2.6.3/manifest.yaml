# 版本级 manifest — cdo 2.6.3
# 遵循 ARCHIVE-SPEC v2.0
version: "2.6.3"
software: "cdo"
status: built
build_date: "2026-09-12"
conan_ref: "cdo/2.6.3"
build_system: "autotools"

source:
  url: "https://code.mpimet.mpg.de/attachments/download/30224/cdo-2.6.3.tar.gz"
  sha256: "889ece29314b48cbf47ba14ab5f1779886f128767f6d22dfcc7fad1e62f2d017"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-netcdf=<netcdf 包目录>"
    - "--with-hdf5=<hdf5 包目录>"
    - "--with-eccodes=<eccodes 包目录>"
    - "--with-proj=<proj 包目录>"
    - "--with-curl=yes（由 configure 自身 AC_SEARCH_LIBS 探测，AutotoolsDeps 提供 flags）"
    - "--with-libxml2=<libxml2 包目录>"
    - "--with-szlib=<libaec 包目录>（libaec 等价替代未发布的 szlib）"
    - "--with-fftw3"
    - "--with-udunits2=no / --with-magics=no / --with-fdb5=no"
    - "--disable-fortran --disable-openmp"
    - "CXXFLAGS: -std=gnu++20 -D_LIBCPP_ENABLE_EXPERIMENTAL"
  dependencies:
    - netcdf/4.9.3
    - proj/9.3.1
    - eccodes/2.42.0
    - fftw/3.3.10.3
    - libxml2/2.15.3.1
    - curl/8.15.0
    - zlib/1.3.1.1
    - libaec/1.1.7

patches_applied:
  - "0001-libf2c-sysdep1-libc-off-t.patch"
  - "0002-cpp-lib-incomplete-ranges.patch"
  - "0003-process-manager-libc-pthread-cancel.patch"
  - "0004-diff-cc-lambda-structured-binding.patch"
  - "0005-operators-lambda-structured-binding.patch"
  - "0006-config-guess-sub-ohos.patch"
  - "0007-configure-umask-hmdfs.patch"
  - "0008-pytest-exit-status.patch"

knowledge_gained:
  - "OHOS clang 15 的 libc++ 15.0.4 默认定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES，std::ranges::sort/fill 等全部不可用；加 -D_LIBCPP_ENABLE_EXPERIMENTAL 即可启用，且 __cpp_lib_ranges 为 201811L（低于标准 C++20 的 202110L），上游按 >=201911L 判断的头文件需要放宽阈值"
  - "libc++ 15 实验模式下 std::views::split / std::views::zip 仍缺失；上游若用 __cpp_lib_ranges_zip 守卫则自动走手写分支，无需补丁"
  - "静态 C++ 库（proj 的 libproj.a）被纯 C 驱动的 AC_CHECK_LIB 探测时必然失败（operator new/delete 未定义）；autotools 配方需给 LDFLAGS 补 -lc++/-lc++abi（仓内 mtbl/audiofile/cif-api 同款先例）"
  - "musl 无 glibc 的 __off64_t 与 *64 系列别名；libf2c 的 sysdep1.h0 对 __linux__ 一律走 glibc 分支会编译失败，需按 libc（__GLIBC__）分流到 POSIX off_t/fseeko/ftello"
  - "musl 不提供 pthread_cancel()；仅退出路径使用时可退化为随进程结束（cdo_exit 紧跟 std::exit）"
  - "clang 15 不支持 lambda 捕获结构化绑定（P1091R3 需 clang 17）；需先把 auto [a,b] 拷成普通变量再捕获（cdo 共 4 处：Diff/Longinfo/Healpix/Info）"
  - "2024-07-27 版 config.guess 无 HarmonyOS 分支：原生构建（build=host=OHOS）会退回 dummy.c 探测并在 OHOS 上因 Permission denied 失败；用仓内 patch-autotools-ohos.pl 给 config.guess/config.sub 补 *:HarmonyOS:*:* 与 ohos-linux 分支（cdo 与 libcdi 各一套）"
  - "设备端 PATH 无独立 cpp：交叉模式下 autoconf 找不到 cpp 会把 CPP 设为冒号并以 C preprocessor fails sanity check 致命退出；需显式导出 CPP/CXXCPP=编译器 -E（idutils 4.6 / autocutsel 0.10.1 同款）"
  - "HMDFS 下 configure 的 (umask 077 && mktemp -d) 建出的临时目录权限不兼容，config.status 写 subs.awk 会 Permission denied；补丁把 configure 与 libcdi/configure 的 umask 077 改为 022（E011 / joe 4.6 / idutils 4.6 先例）"
  - "cdo test/pytest 用 automake TAP driver，其 fd 3/4 重定向在 OHOS shell 上失败（tap-driver.sh: line 234: 2: Bad file descriptor / sh: >&3 : bad file descriptor → 224 条用例全部 ERROR missing test plan）；libcdi 套件用的默认 test-driver 则正常。改用标准 test-driver 时必须让 cdoTest 的退出码反映结果（上游恒 exit 0），否则会假绿"
