# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cppjieba/5.6.7
homepage: "https://github.com/yanyiwu/cppjieba"

# 上游官方测试命令：顶层 CMakeLists ENABLE_TESTING + test/ 子目录，
# test/unittest 用 FetchContent 拉取 googletest release-1.12.1 编译 test.run，
# 另有 load_test 性能回归二进制；ctest 注册 2 项。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: 'self.run("ctest --output-on-failure", cwd=self.build_folder)'

# 上游测试清点（源码审计 2026-09-10，tag v5.6.7 commit b3602be）：
# test/unittest/*.cpp 共 36 个 TEST（不含 gtest_main 的 InitGoogleTest 行），
# ctest 注册 2 项（./test/test.run + ./load_test）。
upstream_tests:
  - file: test/unittest/jieba_test.cpp
    source: cppjieba-5.6.7/test/unittest/jieba_test.cpp
    description: "Jieba 高层接口（Cut/CutAll/CutForSearch/CutHMM/InsertUserWord），4 TEST"
    command: "ctest -R test.run"
  - file: test/unittest/segments_test.cpp
    source: cppjieba-5.6.7/test/unittest/segments_test.cpp
    description: "Mix/MP/HMM/Full/Query 分词器（含 LongInput 堆损坏回归），14 TEST"
    command: "ctest -R test.run"
  - file: test/unittest/trie_test.cpp
    source: cppjieba-5.6.7/test/unittest/trie_test.cpp
    description: "Trie/DictTrie（含 Dag/用户词典权重），7 TEST"
    command: "ctest -R test.run"
  - file: test/unittest/keyword_extractor_test.cpp
    source: cppjieba-5.6.7/test/unittest/keyword_extractor_test.cpp
    description: "关键词抽取，2 TEST"
    command: "ctest -R test.run"
  - file: test/unittest/textrank_test.cpp
    source: cppjieba-5.6.7/test/unittest/textrank_test.cpp
    description: "TextRank 关键词抽取，2 TEST"
    command: "ctest -R test.run"
  - file: test/unittest/pos_tagger_test.cpp
    source: cppjieba-5.6.7/test/unittest/pos_tagger_test.cpp
    description: "词性标注，2 TEST"
    command: "ctest -R test.run"
  - file: test/unittest/unicode_test.cpp
    source: cppjieba-5.6.7/test/unittest/unicode_test.cpp
    description: "Unicode 编解码（含非法序列/随机输入），3 TEST"
    command: "ctest -R test.run"
  - file: test/unittest/unicode_path_test.cpp
    source: cppjieba-5.6.7/test/unittest/unicode_path_test.cpp
    description: "Unicode 路径资源加载，1 TEST"
    command: "ctest -R test.run"
  - file: test/unittest/pre_filter_test.cpp
    source: cppjieba-5.6.7/test/unittest/pre_filter_test.cpp
    description: "PreFilter 符号过滤，1 TEST"
    command: "ctest -R test.run"
  - file: test/load_test.cpp
    source: cppjieba-5.6.7/test/load_test.cpp
    description: "synthetic_doc.utf8 上 50 轮 MixSegment 回归（ctest 第 2 项）"
    command: "ctest -R load_test"

test_package_tests:
  - file: test.cpp
    description: "消费者视角：MixSegment 精确分词 + Jieba 用户词插入/搜索分词 + KeywordExtractor Top5 含 CEO"
    command: "./test_cppjieba"

assertion_count: 39
