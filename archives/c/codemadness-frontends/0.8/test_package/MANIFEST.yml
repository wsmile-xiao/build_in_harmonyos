# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: codemadness-frontends/0.8
homepage: "https://codemadness.org/idiotbox.html"

# 上游测试套件存在性 (经审计官方源码包确认: 无任何测试)
upstream_tests_exist: false

# 上游测试审计 (源码: frontends-0.8.tar.gz, sha256 b59b264eba2e2927e06b5b035a0f1b68fe743635b37b26e8c3dfad67a03928e0)
upstream_test_audit:
  source_tarball: "frontends-0.8.tar.gz"
  source_sha256: "b59b264eba2e2927e06b5b035a0f1b68fe743635b37b26e8c3dfad67a03928e0"
  top_level_files:
    - Makefile           # 仅定义 all / youtube / clean 目标, 无 check / test 目标
    - youtube/cgi.c      # CGI 前端主程序, 无内建自测
    - youtube/cli.c      # CLI 前端主程序, 无内建自测
    - youtube/feed.c     # Atom feed 前端主程序, 无内建自测
    - youtube/gopher.c   # Gopher 前端主程序, 无内建自测
    - youtube/youtube.c  # YouTube 抓取逻辑, 无测试入口
    - https.c / json.c / util.c / xml.c  # 辅助库, 无测试入口
    - strlcat.c / strlcpy.c  # BSD 兼容层, 无测试入口
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile TESTS / check_PROGRAMS / check-local / test 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "make check / ctest 目标"
    - "find . -iname '*test*' (全树)"
    - "二进制 --self-test / -test 自测选项"
  scan_result: "全树 find -iname '*test*' 零命中; Makefile 无 check/test 目标; 无 tests/ 目录、无 gtest/pytest/ctest 痕迹; 四个前端主程序均无自测选项"
  make_check_output: "make check 为 make 默认空目标 (无配方定义), 执行零个测试用例"
  reason: "frontends 0.8 为小型 CGI/CLI/Gopher 前端工具集, 上游未提供任何测试套件。离线行为由 test_package 真实执行打包后的二进制覆盖 (cli 无参/-o 非法选项的 usage 路径, cgi/gopher 空查询的离线页面渲染)"

# 上游测试命令 (无测试套件, 故为空; 对齐已通过门禁的 no_tests 库)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质执行被测包的二进制
test_package_tests:
  - file: test_frontends.sh
    description: "离线功能测试: youtube-cli 无参 usage + -o 非法选项 usage + youtube-cgi 空查询渲染 </html> + youtube-gopher 空环境 7Search 菜单"
    command: "bash test_frontends.sh"
  - file: conanfile.py
    description: "Conan test() 入口, 执行 test_frontends.sh 并输出 HMBS 机器证据标记 (test_package discovered=4/passedCount=4 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test_frontends.sh 的 4 个真实断言, 与 HMBS_TEST_PACKAGE_RESULT discovered=4 一致)
# 1. youtube-cli 无参打印 usage 且退出码非零
# 2. youtube-cli -o 非法选项打印 usage 且退出码非零
# 3. youtube-cgi 空 QUERY_STRING 离线渲染页面 (含 </html>)
# 4. youtube-gopher 空环境应答 Gopher 菜单 (含 7Search)
assertion_count: 4
