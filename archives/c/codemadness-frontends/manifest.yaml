software: codemadness-frontends
display: "codemadness-frontends"
description: "codemadness-frontends 是轻量 YouTube 前端工具集 (idiotbox), 提供 CLI、CGI 与 Gopher 四种前端, 无 JavaScript 与追踪 Cookie"
category: net
homepage: "https://codemadness.org/idiotbox.html"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 默认 OpenBSD 块, Linux 块被注释: 经命令行显式传入 -D_DEFAULT_SOURCE -D_XOPEN_SOURCE=700 (零补丁)"
    - "LIBTLS_LDFLAGS(_STATIC) 覆盖为动态链接 (-ltls -lssl -lcrypto), 去掉上游 -static (bionic 无法静态链接)"
    - "TLS 由 libressl/3.9.1 提供 (acme-client 同款依赖); pledge/unveil 由 util.h 自带 __OpenBSD__ 兜底"
    - "Makefile 无 install 目标: package() 手工拷贝 youtube/{cli,cgi,gopher,feed} 到 bin/"
    - "make -j1 (R9/E074: HMDFS jobserver FIFO EPERM)"
    - "命令行工具集: 软件级 commands.json 声明 (R38), 四个二进制安装到 bin/"
    - "无库目标: cpp_info.libs=[]"
  common_dependencies:
    - libressl/3.9.1

versions:
  "0.8":
    status: built
    build_date: "2026-09-09"
