# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: clang21-ccache/21.1.8
homepage: "https://ccache.dev/"

# 上游测试命令 (用于 ctest -N / doctest 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: unittest/main.cpp
    source: ccache-4.14/unittest
    description: "ccache doctest 单元测试"
    command: "./unittest/unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "smoke test: verify ccache --version runs and stats work"
    command: "ccache --version && ccache --show-stats"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1