software: clang21-ccache
display: "clang21-ccache"
description: "C/C++ 编译器缓存（ccache v4.14 源码），加速重新编译"
category: build-tool
homepage: "https://ccache.dev/"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "使用 CMake 直接构建（C++20），ccache v4.14 官方 tag 源码"
    - "libcxx-ohos (LLVM 15.0.4) 未提供 std::ranges::all_of/any_of/equal 算法，4 个补丁替换为迭代器版"
    - "FetchContent 依赖 (hiredis 1.4.1, xxhash 0.8.3, zstd 1.5.7) 预下载并指向本地目录"
  common_dependencies: []

knowledge_gained:
  - "问题: OHOS libcxx-ohos (LLVM 15.0.4) 未实现 std::ranges 算法，ccache v4.14 上游直接使用 std::ranges::all_of/any_of/equal 导致编译失败"
  - "根因: 设备原生 libc++ 版本旧于编译器（clang 15 工具链），C++20 ranges 算法库缺失"
  - "修复: 4 个最小补丁将 ranges 算法替换为等价迭代器版 std::all_of/std::any_of/std::equal，语义不变"
  - "验证: conan create 全绿；unittest 240/270 通过（3 例 HMDFS 硬链接平台限制）；消费者用例 ccache 包装 clang 编译 + 缓存命中 50% 运行正确"
  - "适用边界: 使用 clang 15 OHOS SDK 且 C++20 的 CMake 项目；ranges 算法不可用时可复用该替换模式"
  - "查重差异: 现有 E079 覆盖 HMDFS 硬链接平台限制；本条目覆盖 std::ranges 缺失的编译层根因与替换模式，无既有条目命中"

versions:
  "21.1.8":
    status: built
    build_date: "2026-09-21"