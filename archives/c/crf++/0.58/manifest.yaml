software: crf++
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.58/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.58"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型 (顶层字段，供 verify-build 检查)
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://mirrors.sohu.com/gentoo/distfiles/f2/CRF%2B%2B-0.58.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 需更新为 automake-1.17 版本以支持 HarmonyOS 平台识别"
  - "HMDFS 限制: mktemp -d + umask 077 创建的目录无法写入文件，需改 umask 000"
  - "/bin/sh (musl sh) 有 print 内置命令，但 bash 没有，需创建 print 包装脚本"
  - "crf_test -v 与 --version 共用短选项 v，导致 -v 吞掉 -m 参数（原始代码 bug）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/crf++-0.58.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/crf++-0.58.work
  source_orig_hash: a9c37cd6b2ab0f89
  source_work_hash: 739f9ed28fe1332d
  generated_at: '2026-06-24T15:47:03'
  patches_count: 2

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
