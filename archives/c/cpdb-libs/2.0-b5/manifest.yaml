knowledge_gained:
  - "The GLib package gdbus-codegen script must be invoked with Conan's active Python on OHOS because PATH can resolve an SDK copy with an invalid /usr/bin/python3 shebang"
  - "The upstream frontend must release dbus_proxy, not an uninitialized backend_proxy, when no backends are activatable"
  - "HarmonyOS and the published D-Bus package do not provide dbus-run-session; the upstream stop test therefore needs a real no-session-runner fallback instead of relying on a host tool"
  - "Autoconf config.status temporary directories need an OHOS-scoped umask 022 on HarmonyOS HMDFS to avoid subs1.awk write failures while preserving the secure 077 default elsewhere"

