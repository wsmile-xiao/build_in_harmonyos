# 版本级 manifest — cpdb-libs 1.2.0
version: "1.2.0"
software: "cpdb-libs"
status: built
build_date: "2026-09-25"
build_system: "autotools"

source:
  url: "https://github.com/OpenPrinting/cpdb-libs/archive/refs/tags/v1.2.0.tar.gz"
  sha256: "f30a172bc44aed667bc15de200907098e8eeced1a53bd68f5bfa8a5e82fe8990"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-nls"
    - "--enable-shared"
    - "--disable-static"
  dependencies:
    - glib/2.88.3
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-lib-Makefile.am.patch"
  - "0002-lib-frontend_helper.h.patch"
  - "0003-lib-frontend_helper.c.patch"
  - "0004-lib-common_helper.c.patch"

knowledge_gained:
  - "git-archive 型 autotools 包无 configure，build() 需 tool_requires automake/1.18 + libtool/2.5.4 自举 autoreconf"
  - "v1.2.0 前端库对 CUPS 的依赖仅用于 PWG 介质名可读转换（两个工具函数），OHOS 无 CUPS 包时可 passthrough 移除"
  - "get_absolute_path() 对 getpwuid() 返回 NULL（无 passwd 库的沙箱/OHOS）未判空即解引用导致崩溃，需 fallback 到 $HOME"
  - "HMDFS 构建机 config.status 需 TMPDIR 指向 build_folder 且 GDBUS_CODEGEN 需显式 python + GLib 包内脚本"