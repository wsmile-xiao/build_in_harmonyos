# 软件级 manifest
# 文件位置: archives/c/cyrus-sasl-gssapiv2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: cyrus-sasl-gssapiv2

# 显示名
display: "Cyrus SASL GSSAPI mechanism"

# 一句话描述
description: "Cyrus SASL GSSAPI authentication mechanism (libsasl2 with GSSAPI support)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: security

# 官网 URL
homepage: "https://www.cyrusimap.org/sasl/"

# 开源许可证（SPDX 标识）
license: BSD-Attribution-HPND-disclaimer

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "GSSAPI 机制是 plugins/gssapi.c（机制名 GSSAPI），需 MIT Kerberos 提供方"
    - "--enable-gssapi=<krb5包目录> 自动注入 -I/-L 探测，--with-gss_impl=mit 直取 MIT 链接行"
    - "上游探测失败只告警不断构建，配方在 configure 后断言 config.h 含 HAVE_GSSAPI"
    - "configure 需显式喂 CC_FOR_BUILD=clang（OHOS 无 gcc/cc）"
    - "静态构建 --with-staticsasl，无需运行期 SASL_PATH/dlopen"

  # 跨版本通用依赖
  common_dependencies:
    - "krb5/1.22.1"

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.1.28":
    status: built
    build_date: "2026-09-12"
    conan_ref: "cyrus-sasl-gssapiv2/2.1.28"
    note: "GSSAPI 机制首个适配版本；待 HMBS 真机验证通过后标 published"
