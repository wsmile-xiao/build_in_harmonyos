# 版本级 manifest
# 文件位置: archives/c/cyrus-sasl-gssapiv2/2.1.28/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.28"

# 软件名
software: "cyrus-sasl-gssapiv2"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 cyrus-sasl 2.1.28 同源：GSSAPI 机制是上游源码内 plugins/gssapi.c）
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"

  # 源码校验和
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（GSSAPI 专用最小闭包：仅启用 gssapi，其余机制/后端全关；
  # MIT 链接行 LIBS=-L<krb5>/lib -lgssapi_krb5 -lkrb5 -lk5crypto -lcom_err
  # 仅作 make 期变量覆盖，不进 configure 参数，防 LIBS 污染 conftest）
  configure_options:
    - "--enable-gssapi=<krb5包目录>"
    - "--with-gss_impl=mit"
    - "make LIBS=-L<krb5包目录>/lib -lgssapi_krb5 -lkrb5 -lk5crypto -lcom_err"
    - "--disable-shared"
    - "--enable-static"
    - "--without-staticsasl"
    - "--with-dblib=none"
    - "--without-saslauthd"
    - "--without-openssl"
    - "--disable-sample"
    - "--disable-ldapdb"
    - "--disable-sql"
    - "--disable-ntlm"
    - "--disable-otp"
    - "--disable-srp"
    - "--disable-login"
    - "--disable-cram"
    - "--disable-digest"
    - "--disable-scram"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "krb5/1.22.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "GSSAPI 机制是 plugins/gssapi.c（机制名 GSSAPI），需 MIT Kerberos 提供方，经 --enable-gssapi=<krb5包目录> + --with-gss_impl=mit 开启（m4/sasl2.m4 SASL_GSSAPI_CHK）"
  - "SASL_GSSAPI_CHK 探测失败只告警不断构建（gssapi=no），配方在 configure 后断言 config.h 含 HAVE_GSSAPI，防静默丢失机制"
  - "krb5/1.22.1 制品仓已发布（合入的 canl-c/3.0.0 与 python-gssapi/1.8.3 均从制品仓消费），requires 合规"
  - "静态构建 --disable-shared --enable-static --without-staticsasl 把 gssapi.c 链入 libsasl2.a（gssapiv2_client/server_plug_init 就在 gssapi.c 内；上游无 STATIC_GS2 接线，gs2.o 只是死对象），无需运行期 SASL_PATH/dlopen；utils 直链 .a，故 LIBS 预置 MIT 链接行 -lgssapi_krb5 -lkrb5 -lk5crypto -lcom_err"
  - "configure 用 AC_PROG_CC_FOR_BUILD 裸搜 gcc/cc，OHOS 仅有 clang，需显式喂 CC_FOR_BUILD=clang"
  - "HMDFS 默认 tmp 可能不可写，TMPDIR 指到 HMBS 注入值或源码树内 tmp"
