    - "--disable-dependency-tracking"
    - "ac_cv_prog_cc_works=yes"
    - "ac_cv_prog_cc_cross=yes"
  cc: clang

patches_applied: []

knowledge_gained:
  - "2001-era config.guess/config.sub 不识别 HarmonyOS 与 linux-ohos/aarch64，需在 build() 内联修补（E007，同 neon/cadaver 经验）"
  - "沙箱无法运行 conftest：cross.cache + 命令行 ac_cv_prog_cc_works/cross 双保险（speex 1.2.1 先例）"
  - "上游 TESTS 仅 3 项（test-types、test-001、test-002），test-003/test-004 只是 EXTRA_DIST 不参与 make check"
