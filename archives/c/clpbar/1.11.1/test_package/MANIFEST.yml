# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: clpbar/1.11.1
homepage: http://clpbar.sourceforge.net

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试（来源：bar-1.11.1/Makefile.am 的 TESTS 注册；
# test-003/test-004 已被上游注释，仅为 EXTRA_DIST，不参与 make check）
upstream_tests:
  - name: "test-types"
    source: bar-1.11.1/test-types.c
    description: "uint8/16/32/64 位宽断言（4 个 assert），位宽错误即 abort"
    command: "./test-types"
  - name: "test-001"
    source: bar-1.11.1/test-001
    description: "管道透传测试：test-001-pre | bar | test-001-post，两次 Hello World 字符串比对"
    command: "./test-001"
  - name: "test-002"
    source: bar-1.11.1/test-002
    description: "文件回环测试：tar 打包后经 bar -if/-of 与管道两种路径复制，cmp 二进制比对"
    command: "./test-002"

# test_package 中自带的测试（R34：真实执行被测二进制并比对传输字节）
test_package_tests:
  - file: test.sh
    description: "bar --version 版本核对 + 管道回环 cmp + 文件回环 cmp（3 项检查）"
    command: "bash test.sh"

# 测试断言总数：上游 8（test-types 4 assert + test-001 2 strcmp + test-002 2 cmp）+ 新增 3
assertion_count: 11
