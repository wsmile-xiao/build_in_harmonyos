software: clpbar
display: "Command Line Progress Bar"
description: "命令行进度条工具：复制数据流的同时在 stderr 显示传输量、速率与进度条"
category: system
homepage: "http://clpbar.sourceforge.net"
license: LGPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "2001 年版 config.guess/config.sub 不识别 HarmonyOS 与 linux-ohos/aarch64，build() 内联修补"
    - "沙箱禁运行 conftest：cross.cache + 命令行 ac_cv_prog_cc_works/cross 双保险"
    - "HMDFS 临时目录需放开 umask 077，构建全程使用 -j1"
    - "零外部依赖，产物仅 bar 可执行文件"
  common_dependencies: []

versions:
  "1.11.1":
    status: built
    build_date: "2026-09-07"
