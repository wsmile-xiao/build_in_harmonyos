version: "2.9.6"
status: built
build_date: "2026-09-10"

source:
  url: "https://github.com/cracklib/cracklib/releases/download/cracklib-2.9.6/cracklib-2.9.6.tar.gz"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-python"
    - "--build=aarch64-unknown-linux-gnu"
    - "--enable-static"
    - "--disable-shared"
  cc: clang

patches_applied: []

knowledge_gained:
  - "cracklib2 2.9.6 使用 Autotools 构建，Python 绑定默认关闭可避免 Python 开发头依赖"
  - "字典压缩打包环节链接 zlib，依赖制品仓 zlib/1.3.1"
  - "config.guess 不识别 HarmonyOS，需固定 --build=aarch64-unknown-linux-gnu"
