package: cracklib2/2.9.6
homepage: "https://github.com/cracklib/cracklib"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check + util/cracklib-check < test-data + util/testlib < test-data"

upstream_tests:
  - file: util/cracklib-check
    source: cracklib-2.9.6.tar.gz/util/check.c
    description: "上游 make test 入口：util/cracklib-check 逐行检查 test-data 的 10 个密码，共 10 项检查"
    command: "util/cracklib-check < test-data"
  - file: util/testlib
    source: cracklib-2.9.6.tar.gz/util/testlib.c
    description: "上游 FascistCheck 接口自测程序（stdin 逐行密码检查），1 项接口自测"
    command: "util/testlib < test-data"

upstream_test_count: 11

test_package_tests:
  - file: test.c
    description: "调用 FascistCheckUser 完整引擎路径：过短密码被规则拒绝、字典词被引擎拒绝、强密码通过，共 3 项"
    command: "./test_cracklib2 <dict-prefix>"

assertion_count: 3
