software: cracklib2
display: "cracklib2"
description: "Password checking library to stop users from choosing easily guessed passwords"
category: security
homepage: "https://github.com/cracklib/cracklib"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 项目，使用 --without-python 关闭 Python 绑定，避免 Python 开发头依赖"
    - "依赖 zlib 压缩库，复用制品仓已发布的 zlib/1.3.1"
    - "config.guess 不识别 HarmonyOS，固定 --build=aarch64-unknown-linux-gnu"
    - "复用 mktemp 包装器规避 HarmonyOS 上 autoconf 临时目录权限问题"
  common_dependencies:
    - zlib

versions:
  "2.9.6":
    status: built
    build_date: "2026-09-10"
