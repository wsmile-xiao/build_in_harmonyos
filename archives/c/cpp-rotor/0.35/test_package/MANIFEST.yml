# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cpp-rotor/0.35
homepage: "https://github.com/basiliscos/cpp-rotor"

# 上游测试命令 (cmake 驱动)
upstream_check_command: "cmake --build build && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Catch2 测试套件)
upstream_tests:
  - file: tests/001-simple_supervisor.cpp
    source: cpp-rotor-0.35/tests/001-simple_supervisor.cpp
    description: "Catch2 单元测试套件（rotor_test_lib，上游 tests/ 共 30+ 用例）"
    command: "./tests/rotor_test_lib"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：创建 system_context/supervisor/actor 并驱动事件循环"
    command: "./test_cpp-rotor"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 30
