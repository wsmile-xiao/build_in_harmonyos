# 版本级 manifest
# cpp-rotor 0.35 — 鸿蒙 PC aarch64 适配

# ============================================================
# 必须字段
# ============================================================

version: "0.35"
software: "cpp-rotor"
status: built
build_date: "2026-09-03"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/basiliscos/cpp-rotor/archive/refs/tags/v0.35.tar.gz"
  sha256: "245fdda4374ed7a0af18b682b1d861df87d05162daeca263776259a31d1dd4b9"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DROTOR_BUILD_TESTS=OFF"
    - "-DROTOR_BUILD_EXAMPLES=OFF"
    - "-DROTOR_BUILD_ASIO=OFF"
    - "-DROTOR_BUILD_EV=OFF"
    - "-DROTOR_BUILD_WX=OFF"
    - "-DROTOR_BUILD_FLTK=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - boost/1.84.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "cpp-rotor 是 CMake 构建库，链接 Boost::date_time/system/regex；Boost.System 自 1.69 为 header-only"
  - "制品仓 boost 裁剪版（1.90.0.4/1.91.0.x）缺少 date_time 组件或 lockfree 头文件，需使用完整配方 boost/1.84.0"