software: corepdf
# 版本级 manifest
# 文件位置: archives/c/corepdf/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# Build system (top-level for script compatibility)
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/rahmanshaber/corepdf/tarball/v.1.0"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_AUTOMOC=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "qt6/6.11.1"
    - "poppler/23.12.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-poppler-qt6-adaptation.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Original corepdf uses Qt WebEngine + PDF.js for rendering; OpenHarmony lacks WebEngine, replaced with poppler-qt6 — knowledge_ref: E001"
  - "qmake on OpenHarmony cannot generate Makefiles; must use cmake instead — knowledge_ref: E002"
  - "poppler-qt6 Document::load() returns unique_ptr (not raw pointer) in v23.12.0 — knowledge_ref: E001"
  - "libpoppler-qt6.so has broken NEEDED entry ../../libpoppler.so; must patchelf --replace-needed — knowledge_ref: E003"
  - "corepdf v1.0 has hardcoded PDF file path; adapted to accept command-line arguments — knowledge_ref: E001"
  - "pdfjsbridge (WebChannel/WebEngine) replaced entirely by poppler native rendering — knowledge_ref: E001"