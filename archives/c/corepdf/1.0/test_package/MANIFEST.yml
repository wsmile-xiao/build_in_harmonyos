# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: corepdf/1.0
homepage: "https://github.com/rahmanshaber/corepdf"

# 上游测试命令 (qmake project, no make check available)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (qmake project has no test suite)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_corepdf.cpp
    description: "Verify corepdf binary runs and displays help"
    command: "QT_QPA_PLATFORM=offscreen corepdf --help"

# 测试断言总数 (corepdf --help output contains usage info)
assertion_count: 3
