# test_package/MANIFEST.yml — cm256cc 1.1.2
# CI L0e requires this file to exist.

package: cm256cc/1.1.2
homepage: "https://github.com/f4exb/cm256cc"

upstream_check_command: "cmake --build . && ./cm256_test"
upstream_test_in_build: true
upstream_test_command: "cmake -B build -DBUILD_TOOLS=ON && cmake --build build && ./build/cm256_test"

upstream_tests:
  command: "./cm256_test (upstream test binary built by BUILD_TOOLS=ON)"
  upstream_test_in_build: true
  test_source: "unit_test/cm256_test.cpp"
  total: 4
  passed: 4
  failed: 0
  assertions: 4
  notes: "cm256_test main() runs 4 scenario functions (ExampleFileUsage, example2, example3, example4); each returns bool and the binary exits non-zero on any failure. All 4 passed on OHOS aarch64. cm256_tx/cm256_rx are manual UDP integration demo tools without automated pass/fail assertions and are not counted as test cases."

test_package_tests:
  - file: consumer.cpp
    description: "Consumer program calling the real CM256 API: encode 10+4 blocks, erase 2 originals, decode and byte-compare recovered data"
    command: "ctest or direct run (built via CMake, linked against cm256cc::cm256cc)"
  - file: conanfile.py (test())
    description: "Also executes the upstream cm256_test binary shipped with the package"
    command: "cm256_test (exit code asserted via self.run)"

assertion_count: 3
