# 知识沉淀
# ============================================================

knowledge_gained:
  - "cxxtest 4.1 is a header-only framework: the cxxtest/ directory is the library (include-only), and cxxtestgen is a Python-3 build-time tool; the target machine needs no Python runtime"
  - "Upstream ships both Py2 (python/cxxtest) and Py3 (python/python3/cxxtest) driver lines; packaging only the Py3 line keeps the recipe modern and sufficient (verified by direct import under Python 3.12)"
  - "cxxtestgen runs fine under Python 3.12 (only a SyntaxWarning from `if p.type is \"\"` in cxxtest_parser.py — cosmetic, generation output is correct)"
  - "consumer integration pattern: user_info.cxxtestgen exposes res/cxxtest/cxxtestgen.py; test_package invokes it via `python3 <path> --error-printer -o runner.cpp suite.h`, then compiles the generated runner against CxxTest::CxxTest"
  - "upstream PyUnit self-test (test/test_cxxtest.py) executes generated runners on-device; OHOS binaries need LD_LIBRARY_PATH pointing at the SDK libc++ (aarch64-linux-ohos) for the run phase"
  - "TestClang class on the OHOS device: 60 registered / 59 passed / 1 self-skipped (test_int64 — `__int64` is MSVC-only; the suite's own compiler probe int64.cpp fails to compile under clang and skips the case)"

