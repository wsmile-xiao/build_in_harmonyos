# test_package/MANIFEST.yml — cxxtest 4.1
# CI L0e requires this file to exist.

package: cxxtest/4.1
homepage: "https://github.com/CxxTest/cxxtest"

# CxxTest is itself a testing tool: upstream ships a PyUnit self-test suite
# (test/test_cxxtest.py) that drives cxxtestgen + the packaged headers
# through a real compiler for every supported compiler class (TestGpp,
# TestCpp, TestClang, TestCL + optional FOG variants gated on the `ply`
# module). Registration is per-compiler-class: 62 test methods in the
# BaseTestCase mixin (one `test_inheritance` def is shadowed by a later
# def, leaving 61 registered per class), plus test/unit/LinkedList_test.t.h
# (SCons-driven, 6 cases) and test/test_doc.py (pyutilib-gated).
upstream_check_command: "python3 test/test_cxxtest.py -v"
upstream_test_in_build: true
upstream_test_command: "python3 test/test_cxxtest.py TestClang -v"

# Upstream self-test executed on-device against the OHOS clang++ toolchain
# (see reports/test-report.md): the TestClang class registers 60 cases
# (62 defs minus the shadowed duplicate test_inheritance minus
# test_longlong/check_if_supported absence), 59 pass and 1 is skipped by
# the suite's own compiler probe (test_int64: `__int64` is an MSVC-only
# type, the Itanium ABI used by clang does not provide it — the probe
# source int64.cpp fails to compile and the case self-skips).
# TestGpp/TestCpp/TestCL register 0 cases here (their `run()` probes for
# g++/c++/cl which are absent on the device); FOG variants need `ply`.
upstream_tests:
  - file: "test/test_cxxtest.py (class TestClang)"
    description: "PyUnit suite driving cxxtestgen + packaged headers through clang++ (generate → compile → run → output diff)"
    command: "python3 test/test_cxxtest.py TestClang -v"
    static_cases: 62
    registered_cases: 60
    executed_cases: 60
    passed_cases: 59
    failed_cases: 0
    skipped_cases: 1
    skip_reasons: "test_int64: __int64 is MSVC-only, clang/Itanium ABI probe fails → suite self-skips"
  - file: "test/test_cxxtest.py (classes TestGpp/TestCpp/TestCL)"
    description: "Compiler-class variants; their run() probes for g++/c++/cl which are not installed in this environment → 0 cases registered by upstream's own gating"
    command: "python3 test/test_cxxtest.py TestGpp -v"
    registered_cases: 0
    executed_cases: 0
    passed_cases: 0
    failed_cases: 0
    skip_reasons: "g++/c++/cl not available on OHOS build machine (upstream auto-gating in run())"
  - file: "test/test_cxxtest.py (classes TestClangFOG/TestGppFOG/TestCLFOG)"
    description: "FOG parser variants gated on the optional `ply` module (upstream try/except import); ply absent in the target environment"
    command: "python3 test/test_cxxtest.py TestClangFOG -v"
    registered_cases: 0
    executed_cases: 0
    passed_cases: 0
    failed_cases: 0
    skip_reasons: "python `ply` module not available (upstream optional-dependency gating)"
  - file: "test/unit/LinkedList_test.t.h"
    description: "SCons-driven unit suite (cxxtest test of the List/Link internals); requires SCons builder from build_tools/"
    command: "scons -C test/unit"
    registered_cases: 0
    executed_cases: 0
    passed_cases: 0
    failed_cases: 0
    skip_reasons: "SCons build environment not provisioned; the covered API (LinkedList) is exercised indirectly by the main suite's runners"
  - file: "test/test_doc.py"
    description: "User-guide example suite; gated on the optional `pyutilib.th` module (upstream try/except import), absent in the target environment"
    command: "python3 test/test_doc.py"
    registered_cases: 0
    executed_cases: 0
    passed_cases: 0
    failed_cases: 0
    skip_reasons: "python `pyutilib` module not available (upstream optional-dependency gating)"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_cxxtest.h + generated_runner.cpp
    description: "Consumer flow: the packaged cxxtestgen driver (res/cxxtest/cxxtestgen.py) generates the ErrorPrinter runner from a 4-case suite (TS_ASSERT/TS_ASSERT_EQUALS/TS_ASSERT_DIFFERS/TS_ASSERT_LESS_THAN/TS_ASSERT_STR_EQUALS/TS_ASSERT_THROWS/TS_ASSERT_THROWS_NOTHING/TS_ASSERT_DELTA), compiled via CMake against CxxTest::CxxTest, signed (E077) and executed; runner prints 'Running 4 tests.OK!'"
    command: "conan create (generate → cmake build → run_check.sh greps 'OK!')"

assertion_count: 12

consumer_tests: 4
consumer_passed: 4
consumer_assertions: 12
