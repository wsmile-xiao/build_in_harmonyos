    description: "Smoke test: run packaged cxxtestgen --version/--help via self.run, assert exit 0 and usage output"
    command: "python3 cxxtest_smoke.py cxxtestgen"
  - file: MyTestSuite.h
    description: "Consumer test: inherit CxxTest::TestSuite and run TS_ASSERT assertions"
    command: "cxxtestgen --error-printer -o runner.cpp MyTestSuite.h"
  - file: runner.cpp
    description: "Consumer test: compile generated runner and execute, check exit code and success output"
    command: "./runner"

