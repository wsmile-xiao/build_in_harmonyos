software: cxxtest
display: "CxxTest"
description: "C++ unit testing framework similar to JUnit, CppUnit and xUnit"
category: library
homepage: "https://github.com/CxxTest/cxxtest"
license: LGPL-3.0-only
build_system: custom

ohos_adaptation:
  key_points:
    - "header-only 头文件加 cxxtestgen Python 生成器，无需编译库本身"
    - "保留上游 bin 与 python 目录相对布局，保证 cxxtestgen 运行时寻址"
    - "上游测试为 test/test_cxxtest.py unittest，真机运行 TestClang 子集"
  common_dependencies: []

versions:
  "4.4-git230824":
    status: built
    build_date: "2026-09-10"
