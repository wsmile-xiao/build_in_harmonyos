# 软件级 manifest
# 文件位置: archives/c/cxxtest/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: cxxtest

# 显示名
display: "CxxTest"

# 一句话描述
description: "轻量级 header-only C++ 单元测试框架（Python 驱动生成测试运行器）"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: build-tool

# 官网 URL
homepage: "https://github.com/CxxTest/cxxtest"

# 开源许可证（SPDX 标识）
license: LGPL-2.1

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "header-only 框架：包类型 header-library，package_id clear"
    - "cxxtestgen 为构建期 Python 工具：打包 Py3 驱动线（python/python3/cxxtest）到 res/，目标机无需 Python 运行时"
    - "消费者模式：python3 <res>/cxxtest/cxxtestgen.py --error-printer -o runner.cpp suite.h 生成后对 CxxTest::CxxTest 编译"
    - "生成 runner 的 #include 是 <cxxtest/xxx.h> 形式，包 include 布局与上游 cxxtest/ 目录一致即可"
    - "测试二进制运行需 E077 签名 + SDK libc++ LD_LIBRARY_PATH"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "4.1":
    status: built
    build_date: 2026-09-15
