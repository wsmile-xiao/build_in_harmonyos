software: cdrecord
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2024-03-21/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（schilytools 上游 tag 2024-03-21——用户给 1.0.0 不合法按真实版）
version: "2024-03-21"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-26"

# 构建系统标识（verify-build 要求）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（codeload 官方）
  url: "https://codeload.github.com/clausecker/schilytools/tar.gz/refs/tags/2024-03-21"

  # 源码校验和
  sha256: "6054f01e753ef70dcab90c979319fbff78cee63c3ba739a0f5ead00f72320ee1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建系统标识（verify-build 要求）
  build_system: custom

  # 配置选项列表（schilytools 自研 smake，无 configure）
  configure_options: []

  # 编译依赖列表（schilytools 自包含——scg + schily 基础库套件内自带）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "cdrecord 是 schilytools 套件成员（C 语言），自研 smake 构建（顶层 make 构建 psmake+smake 后构建所有工具）——scg/schily 基础库套件内自包含，无需外部 Conan 包"
    - "上游无独立测试目录（cdrecord 是刻录工具，运行需光驱/SCSI——OHOS 无，如实记录）；消费测试验证 bin/cdrecord + --version"
