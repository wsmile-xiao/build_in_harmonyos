package: cwalk/1.2.9
homepage: "https://github.com/likle/cwalk"

upstream_check_command: "ctest --test-dir <build> --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure"

upstream_tests:
  - file: test/*.c
    source: cwalk-1.2.9/test/*.c
    description: "Upstream CMake/CTest path manipulation suite covering 15 functional groups"
    command: "ctest --test-dir <build> --output-on-failure"
    tests: 180

test_package_tests:
  - file: test_cwalk.c
    description: "One consumer boundary covering Unix and Windows normalization, join, relative paths, extensions and basename lookup"
    command: "./test_cwalk"
    assertions: 8

upstream_test_count: 180
consumer_test_count: 1
consumer_assertion_count: 8
assertion_count: 188
