# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 脚本 (build_and_test.sh L0e) 强制要求
# 数字口径（2026-09-23 幕僚-1 实测，源码 cwalk v1.2.8 tag）：
#   N_registered = create_test(DEFAULT ...) 行数 = 180（CMakeLists.txt，14 个 unit）
#   消费者 = 1 个程序 / 8 断言（test_cwalk.c，API 与 1.2.9 同款且 8/8 命中 1.2.8 头文件）

package: cwalk/1.2.8
homepage: "https://github.com/likle/cwalk"

upstream_check_command: "ctest --test-dir <build> --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure"

upstream_tests:
  - file: test/*.c
    source: cwalk-1.2.8/test/*.c
    description: "Upstream CMake/CTest path manipulation suite covering 14 functional groups (absolute/basename/dirname/extension/guess/intersection/is_absolute/is_relative/join/normalize/relative/root/segment/windows)"
    command: "ctest --test-dir <build> --output-on-failure"
    tests: 180

test_package_tests:
  - file: test_cwalk.c
    description: "One consumer boundary covering Unix and Windows normalization, join, relative paths, extensions and basename lookup"
    command: "./test_cwalk"
    assertions: 8

upstream_test_count: 180
consumer_test_count: 1
consumer_assertion_count: 8
assertion_count: 188
