patches_applied:
  - file: "patches/0001-use-conan-gtest.patch"
    description: "Use Conan-resolved GTest and tolerate the OHOS libc stderr macro in upstream tests"

knowledge_gained:
  - "Microsoft GSL 4.2.2 is header-only and its upstream CMake target requires C++14"
  - "The upstream tests require a packaging patch to replace configure-time Git download with Conan GTest"
  - "OHOS libc recursively defines stderr, so Clang upstream tests need -Wno-disabled-macro-expansion while retaining -Werror"
  - "HarmonyOS PC validation can assert __OHOS__ at compile time and run the resulting x86_64 binary through HDC"
