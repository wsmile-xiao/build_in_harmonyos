package: cpp-gsl/4.2.2
homepage: "https://github.com/microsoft/GSL"

upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

upstream_tests:
  - name: "Microsoft GSL upstream test suite"
    count: "97 declared; 89 configured"
    description: "96 GoogleTest TEST declarations in 12 source files, of which 88 instantiate under C++17 on Linux/OHOS, plus gsl_noexcept_tests; built by the Conan recipe and run when the target is executable"

test_package_tests:
  - file: test_package.cpp
    description: "R34 consumer smoke using Microsoft.GSL::GSL, span, at, not_null, narrow, and finally"
    command: "conan create . --build=missing"
  - file: harmonyos_test.cpp
    description: "HarmonyOS-only compile guard and real runtime smoke on the x86_64 HarmonyOS 6.0 VM through HDC"
    command: "HarmonyOS clang++ cross-compile, hdc file send, hdc shell execute"

assertion_count: 11
