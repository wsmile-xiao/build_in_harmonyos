# ccrypt 软件级 manifest
# 文件位置: archives/c/ccrypt/manifest.yaml

software: ccrypt
description: "Encrypt and decrypt files and streams - 安全文件加密解密工具"
category: security
license: "GPL-2.0-or-later"
homepage: "https://ccrypt.sourceforge.net/"

# 版本索引
versions:
  1.11:
    status: built
    build_date: "2026-06-06"
    package: "ccrypt-1.11-ohos-aarch64.tar.gz"
    patches: 2

# 依赖信息
dependencies:
  runtime:
    - libcrypt
  build: []

# 平台支持
platforms:
  - aarch64-unknown-linux-ohos

# 功能标签
features:
  - file-encryption
  - stream-encryption
  - aes-rijndael
  - unix-crypt-compatible