# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cpp-ipc/1.3.0
homepage: "https://github.com/mutouyun/cpp-ipc"

# 上游测试命令：上游 CMake 把测试放在 LIBIPC_BUILD_TESTS=ON 后编译出的
# gtest 主程序里，没有注册 ctest（因此 make check 目标不存在，build 驱动的
# Step7 make check 会报 "No rule to make target 'check'"）。
upstream_check_command: "cmake -DLIBIPC_BUILD_TESTS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .. && make && ./bin/test-ipc"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "./bin/test-ipc"

# 上游实际运行的测试程序（本机 2026-10-06 实测清单）
upstream_tests:
  - file: test/test_ipc.cpp
    source: cpp-ipc-1.3.0/test/test_ipc.cpp
    description: "IPC 广播通道：7 例 (basic_ssu/basic_smb/basic_mmb/1v1/1vN/Nv1/NvN)"
    command: "./bin/test-ipc --gtest_filter=IPC.*"
  - file: test/test_queue.cpp
    source: cpp-ipc-1.3.0/test/test_queue.cpp
    description: "共享内存环形队列：9 例 (check_size/el_connection/connection + 6 组 prod_cons)"
    command: "./bin/test-ipc --gtest_filter=Queue.*"
  - file: test/test_shm.cpp
    source: cpp-ipc-1.3.0/test/test_shm.cpp
    description: "POSIX 共享内存：5 例 (acquire/release/get/hello/mt)"
    command: "./bin/test-ipc --gtest_filter=SHM.*"
  - file: test/test_sync.cpp
    source: cpp-ipc-1.3.0/test/test_sync.cpp
    description: "同步原语：4 例 (Sync.Mutex/Semaphore/Condition/ConditionRobust)；PThread.Robust 一例按补丁 0002 在非 glibc 平台跳过"
    command: "./bin/test-ipc --gtest_filter=Sync.*"
  - file: test/test_waiter.cpp
    source: cpp-ipc-1.3.0/test/test_waiter.cpp
    description: "等待器：2 例 (broadcast/quit_waiting)"
    command: "./bin/test-ipc --gtest_filter=Waiter.*"

# ── 测试口径（五维账，手册/04 §10.1；与 notes.md「五维测试账」同源，2026-10-06 本机复算）──
# 复现命令：
#   grep -c 'TEST(' test/*.cpp                       # 字面量合计 38
#   grep -hE '^\s*//\s*TEST\(' test/*.cpp            # // 注释 2（Memory.tc_alloc、Thread.rw_lock）
#   sed -n '195,210p' test/test_mem.cpp | grep -c 'TEST('   # 块注释 2（Memory.static_alloc/pool_alloc）
#   grep -c 'TEST(PThread, Robust)' test/test_sync.cpp      # 同名双分支 2 → 去重计 1
#   ./bin/test-ipc --gtest_list_tests                # OHOS 实际注册 27
#   38 − 4(注释) − 1(同名重复) = 33；33 − 27 = 6
n_static: 33            # 上游静态声明（去注释 + 同名去重）
n_registered: 27        # OHOS 构建后实际注册（--gtest_list_tests）
n_executed: 27          # 逐例执行到终态
n_passed: 13            # 13/27 = 48.1%（13 过 / 6 失败 / 4 崩溃 / 4 超时）
n_not_built_on_ohos: 6  # 33 − 27

# 上游存在但未编译进测试二进制的 6 例（如实声明，非本次适配造成）
upstream_tests_not_built:
  - file: test/test_thread_utility.cpp
    count: 4
    reason: "Thread.* 4 例：上游 #if 0 (disable ipc::tls) 守卫"
  - file: test/test_platform.cpp
    count: 1
    reason: "Platform.to_tchar 1 例：上游 #if _WIN32 守卫，仅 Windows 构建"
  - file: test/test_sync.cpp
    count: 1
    reason: "PThread.Robust 1 例：补丁 0002 加 __GLIBC__ 守卫（musl 不实现 robust mutex）"

# 不计入 N_static 的共 **5 处 TEST( 字面量**、列成下面 **4 条项**：
#   前 3 条 = 4 处被注释掉的字面量（任何平台都不会编译）；
#   第 4 条**不是注释**，是 test_sync.cpp 里 PThread.Robust 的 Windows 分支与 Linux 分支**同名重复**，
#   在算式 38 − 4(注释) − 1(同名重复) = 33 里按那 1 个「同名重复」扣除（33 与算式为受管数字，勿改）。
# 注：键名 upstream_tests_commented_out 沿用历史命名，实际含第 4 条这一非注释项。
upstream_tests_commented_out:
  - "test/test_mem.cpp: Memory.static_alloc、Memory.pool_alloc（/* */ 块注释）"
  - "test/test_mem.cpp: Memory.tc_alloc（// 注释）"
  - "test/test_thread_utility.cpp: Thread.rw_lock（// 注释）"
  - "test/test_sync.cpp: PThread.Robust 的 Windows 分支与 Linux 分支同名，去重计 1"

# 注册用例总数（--gtest_list_tests 实测）
registered_tests: 27

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：shm 句柄创建/映射/读写/释放 + 命名互斥锁开关锁 + 广播通道收发"
    command: "./test_cpp_ipc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 120
