# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libc++ 把 std::unique_ptr 放在 inline ABI namespace（__config_site 的 _LIBCPP_ABI_NAMESPACE），上游直接写进 namespace std 的推导指引与它不在同一作用域，clang 报 deduction guide must be declared in the same scope as template；该指引在本库未被使用，按 !_LIBCPP_VERSION 跳过即可（reference: archives/c/cpp-ipc/1.3.0/patches/0001-src-libipc-platform-detail.h.patch）"
  - "OHOS SDK pthread.h 只定义 PTHREAD_MUTEX_ROBUST 常量、不声明 robust mutex 函数族（知识条目 E192），上游单测需按 __GLIBC__ 守卫（reference: knowledge/graph/E192.kv）"
  - "HongMeng 内核未实现 FUTEX_CMP_REQUEUE_PI / FUTEX_WAIT_REQUEUE_PI / FUTEX_TRYLOCK_PI（syscall 返回 ENOSYS 38），基础 FUTEX_WAIT/WAKE/LOCK_PI/UNLOCK_PI 可用 ⇒ 上游 a0 层的跨进程条件广播/等待失效（reference: knowledge/drafts/DRAFT-cpp-ipc-1.3.0-futex-requeue-pi-trylock-pi-enosys.kv）"
  - "上游 CMake 未注册 ctest，make check 目标不存在；测试需 LIBIPC_BUILD_TESTS=ON 单独编译，且自带 gtest 需要 -DCMAKE_POLICY_VERSION_MINIMUM=3.5（CMake 4.1 拒绝 <3.5 的 cmake_minimum_required）（reference: archives/c/cpp-ipc/1.3.0/test_package/MANIFEST.yml）"

knowledge_ref:
  - "knowledge/drafts/DRAFT-cpp-ipc-1.3.0-futex-requeue-pi-trylock-pi-enosys.kv"
  - "knowledge/graph/E192.kv"
  - "archives/c/cpp-ipc/1.3.0/patches/0001-src-libipc-platform-detail.h.patch"
  - "archives/c/cpp-ipc/1.3.0/test_package/MANIFEST.yml"

