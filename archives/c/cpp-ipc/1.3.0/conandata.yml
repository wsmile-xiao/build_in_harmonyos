# conandata.yml — cpp-ipc 1.3.0

sources:
  url: "https://github.com/mutouyun/cpp-ipc/archive/refs/tags/v1.3.0.tar.gz"
  sha256: "a5ffb67ff451aa28726ab7801509c5c67feb737db49d2be4f7c70a4e9fad2fee"

patches:
  - patch_file: "patches/0001-src-libipc-platform-detail.h.patch"
    patch_description: "Skip the deduction guides that upstream injects into namespace std: libc++ declares std::unique_ptr inside an inline ABI namespace, so a guide written directly in namespace std is a different scope and clang rejects it"
    patch_type: "portability"
  - patch_file: "patches/0002-test-test_sync.cpp.patch"
    patch_description: "Keep the robust-mutex unit test on glibc Linux: musl does not implement pthread_mutexattr_setrobust/pthread_mutex_consistent and the OHOS SDK pthread.h does not declare them"
    patch_type: "test-portability"
