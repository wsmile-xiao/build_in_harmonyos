# 软件级 manifest — cassbeam
# 遵循 ARCHIVE-SPEC v2.0

software: cassbeam
display: "cassbeam"
description: "Cassegrain 天线建模工具 — VLA 波束仿真器"
category: utility
homepage: "https://github.com/ratt-ru/cassbeam"
license: GPL-2.0-only
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "autoconf 2.69 预生成 configure, in-tree 构建, 单 CLI 二进制"
    - "硬依赖 glib-2.0, 走 conan glib + PkgConfigDeps"
    - "硬依赖 FFTW2 (registry 只有 fftw3), vendor fftw 2.1.5 静态编译"
    - "OHOS 无 install -D, package() 手动 copy"
    - "无上游自动化测试, test_package 跑官方 VLA 示例"
  common_dependencies:
    - glib

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.1":
    status: built
    build_date: "2026-09-08"
