# 版本级 manifest — cassbeam 1.1
# 遵循 ARCHIVE-SPEC v2.0

version: "1.1"
software: "cassbeam"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/c/cassbeam/cassbeam_1.1.orig.tar.gz"
  sha256: "6731a091f9671720f54e48e5847803957b0cc41931aaeaaac658834798c39de9"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options: []
  dependencies:
    - glib/2.88.0
    - pkgconf/3.0.5  # tool: provides pkg-config binary (configure.in AC_CHECK_PROG)
    - zlib/1.3.1.1  # override only: pins OHOS suffix so conancenter zlib/1.3.1 CMake recipe never wins remote ordering
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Debian 1.1 orig 包为 autoconf 2.69 预生成 configure + Makefile.in, in-tree 构建, 产物为单 CLI 二进制 cassbeam"
  - "硬依赖 glib-2.0 (configure.in 无 pkg-config 即 AC_MSG_ERROR), 走 glib/2.88.0 + PkgConfigDeps (2.88.0 为制品仓已上传版本)"
  - "硬依赖 FFTW2 (vector-fftw.c 用 fftw.h/rfftw.h, registry 只有 fftw3 不兼容), vendor fftw 2.1.5 源码静态编译后链接"
  - "Makefile install 用 install -D (OHOS 缺失), package() 手动 copy 二进制"
  - "无上游自动化测试 (无 check 目标/tests 目录), test_package 跑官方 VLA 示例并断言输出非空"
