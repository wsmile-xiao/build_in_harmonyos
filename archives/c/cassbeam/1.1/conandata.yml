# conandata.yml — cassbeam 1.1
# Cassegrain antenna modelling tool (ratt-ru/cassbeam, Debian 1.1 orig).

sources:
  # CI worker deb.debian.org 常不可达，tuna 镜像优先，官方兜底（abr2gbr 先例）。
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/c/cassbeam/cassbeam_1.1.orig.tar.gz"
    - "https://deb.debian.org/debian/pool/main/c/cassbeam/cassbeam_1.1.orig.tar.gz"
  sha256: "6731a091f9671720f54e48e5847803957b0cc41931aaeaaac658834798c39de9"
  filename: "cassbeam_1.1.orig.tar.gz"

vendor:
  # FFTW 2.1.5：cassbeam 的 vector-fftw.c 硬依赖 fftw.h/rfftw.h（FFTW2 API，
  # fftw_create_plan/rfftw_create_plan/fftwnd 等），registry 只有 fftw3
  # （fftw3.h，API 不兼容），Debian 用 fftw-dev（2.1.5）构建，故 vendor
  # 同版本源码静态编译后链接，不新增 conan 依赖。
  fftw:
    url:
      - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/f/fftw/fftw_2.1.5.orig.tar.gz"
      - "https://deb.debian.org/debian/pool/main/f/fftw/fftw_2.1.5.orig.tar.gz"
    sha256: "f8057fae1c7df8b99116783ef3e94a6a44518d49c72e2e630c24b689c6022630"
    filename: "fftw_2.1.5.orig.tar.gz"
