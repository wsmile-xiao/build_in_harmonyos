# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cassbeam/1.1
homepage: "https://github.com/ratt-ru/cassbeam"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: cassbeam_1.1.orig.tar.gz, sha256 6731a091f9671720f54e48e5847803957b0cc41931aaeaaac658834798c39de9)
upstream_test_audit:
  source_tarball: "cassbeam_1.1.orig.tar.gz"
  source_sha256: "6731a091f9671720f54e48e5847803957b0cc41931aaeaaac658834798c39de9"
  top_level_files:
    - configure.in      # 仅 AC_PROG_CC/AC_PROG_INSTALL + glib/fftw 探测, 无测试宏
    - Makefile.in       # 仅 all/clean/distclean/cassbeam/doc/install/uninstall, 无 check/TESTS
    - cassbeam.c        # CLI 主程序, 无 TEST()/TEST_F (gtest)
    - antenna.c/h       # 天线几何, 无测试代码
    - illum.c/h         # 照明/远场, 无测试代码
    - vector-fftw.c/h   # FFTW2 封装, 无测试代码
    - examples/vla/vla-1500MHz.in  # 唯一手动示例 (非自动化套件)
    - doc/              # LaTeX 文档, 非测试
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.in TESTS / check_PROGRAMS / check-local 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "make check / ctest 目标"
    - "find . -name '*test*' (全树)"
  scan_result: "0 matches — 全树无 tests/ 目录; find -name '*test*' 仅命中 autoconf 生成脚本; Makefile.in 无 check/TESTS 目标; configure.in 无测试宏"
  make_check_output: "make -n check 无规则 (Makefile.in 未定义 check 目标) — make check 执行 0 用例"
  reason: "cassbeam 1.1 为单二进制科学工具, 官方源码包不含任何自动化测试套件: 无 tests/ 目录、无测试源文件、无 TESTS/check 目标、configure.in 无测试宏。唯一验证方式是 README 记载的手动示例 (cd examples/vla && cassbeam vla-1500MHz.in); 功能验证由 test_package 真实执行该示例 (3 断言: 正常退出 + 照片/参数输出非空) 完成"

# 上游测试命令 (无自动化套件, 故 check 命令不适用)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的二进制
test_package_tests:
  - file: test.sh
    description: "功能测试: cassbeam examples/vla/vla-1500MHz.in 真实运行, 断言正常退出 + 照片/参数输出非空 (防空文件比空文件静默通过)"
    command: "bash test.sh"
  - file: conanfile.py
    description: "Conan test() 入口, 执行 test.sh 并输出 HMBS 机器证据标记 (test_package discovered=3/passedCount=3 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test.sh 的 3 个真实断言, 与 HMBS_TEST_PACKAGE_RESULT discovered=3 一致)
assertion_count: 3
