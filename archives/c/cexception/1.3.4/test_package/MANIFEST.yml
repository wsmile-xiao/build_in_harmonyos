# test_package/MANIFEST.yml
# 上游官方测试声明：源代码中的 Ceedling/Unity 测试与消费者测试分开统计。

package: cexception/1.3.4
homepage: "https://github.com/ThrowTheSwitch/CException"

# 上游 project.yml 指定 Ceedling 0.29.1，默认任务为 clobber test:all。
upstream_check_command: "bundle exec ceedling test:all"
upstream_test_in_build: false
upstream_test_command: "bundle exec ceedling test:all"

upstream_tests:
  - file: test/TestException.c
    source: cexception-1.3.4/test/TestException.c
    description: "Ceedling/Unity self-test: 16 test functions and 56 TEST_ASSERT/TEST_FAIL macros covering Try/Catch/Throw, nested frames, rethrow, fallback handlers, and ExitTry."
    command: "bundle exec ceedling test:all"

test_package_tests:
  - file: test.c
    description: "Consumer test invokes Throw from a helper, verifies Catch, no-throw behavior, and ExitTry using the packaged CException API."
    command: "./test_cexception"

# Static count from rg over TestException.c: 34 TEST_ASSERT_EQUAL +
# 2 TEST_ASSERT_FALSE + 20 TEST_FAIL_MESSAGE.
assertion_count: 56
