# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cursynth/1.5
homepage: "https://www.gnu.org/software/cursynth/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# 上游（cursynth 1.5 tarball）未注册任何自动化测试：
#   - 全树无 TESTS= / check_PROGRAMS / add_test 注册入口
#   - rtaudio/tests、rtmidi/tests 仅含手工示例程序（audioprobe、midiprobe 等），
#     且未纳入顶层 SUBDIRS，`make`/`make check` 均不构建
# 因此 N_static = 0，`make check` 实际执行 0 项（配方 build() 中真实执行）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test.c"
    description: "运行打包的 cursynth 二进制：断言 -V 版本横幅与无音频设备时的 OSS 探测退出路径"
    command: "./test_cursynth"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
