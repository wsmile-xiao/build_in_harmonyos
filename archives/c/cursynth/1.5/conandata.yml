patches:
  - patch_file: "patches/0001-config.sub.patch"
    patch_description: "E007: teach the 2014-vintage config.sub the linux-ohos triplet (KERNEL-OS recognition list + valid OS list)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "E114: drop the umask 077 wrapper around the config.status temp-dir creation (HMDFS 0700 dirs are unwritable for the mapped uid)"
