  - patch_file: "patches/0003-mopo-configure.patch"
    patch_description: "E114: same umask 077 fix for the bundled mopo sub-configure"
    patch_type: "platform"
  - patch_file: "patches/0004-rtaudio-config-config.sub.patch"
    patch_description: "E007: linux-ohos triplet for the bundled rtaudio config.sub"
    patch_type: "portability"
  - patch_file: "patches/0005-rtaudio-configure.patch"
    patch_description: "E114: same umask 077 fix for the bundled rtaudio sub-configure"
    patch_type: "platform"
  - patch_file: "patches/0006-rtmidi-config-config.sub.patch"
    patch_description: "E007: linux-ohos triplet for the bundled rtmidi config.sub"
    patch_type: "portability"
  - patch_file: "patches/0007-rtmidi-configure.patch"
    patch_description: "Default Linux MIDI-API branch: probe libasound first and fall through to RtMidi's no-API build when ALSA is unavailable (explicit --with-alsa still hard-fails); api assignment moved into the probe's success branch"
    patch_type: "portability"
  - patch_file: "patches/0008-src-cursynth_gui.cpp.patch"
    patch_description: "NLS fallback: gettext()/bindtextdomain()/textdomain() become no-ops returning the untranslated strings when NLS is disabled (OHOS ships a <libintl.h> stub without prototypes and no libintl)"
    patch_type: "portability"
