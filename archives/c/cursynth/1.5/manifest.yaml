  - "(rtaudio/RtAudio.cpp 经典 OSS 移植为配方内置 source() 阶段转换，见 conanfile.py _port_rtaudio_oss)"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS sysroot 提供经典内核 OSS 头 <sys/soundcard.h>（转发 linux/soundcard.h，677 行/108 符号），
     但不含 OSS4 的 SNDCTL_SYSINFO/SNDCTL_AUDIOINFO/oss_*info/PCM_CAP_*；RtAudio 类 OSS4 代码
     需按 #ifdef SNDCTL_SYSINFO 区分经典回退"
  - "OHOS 的 <libintl.h> 是空桩（无原型）且无 libintl 库：源码直调 gettext() 的包必须加 NLS 回退宏"
  - "改 rtmidi/configure.ac 会触发 aclocal-1.13 再生链导致构建失败；只补丁生成的 configure 即可"
  - "OHOS musl 未提供 pthread_testcancel（zam-plugins 同款 __OHOS__ no-op 先例）"

