software: cronolog
display: "cronolog"
description: "cronolog 是面向 Web 服务器的日志轮转工具，按日期模板将日志流拆分存放"
category: system
homepage: "https://github.com/fordmason/cronolog"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "无第三方依赖 (纯 C, 仅链接 libc), 配方自包含"
    - "古老 configure 无三元组概念, 直接使用 Conan 工具链 CC, 无需 config.guess 补丁"
    - "doc 多文件安装在 HMBS install shim 下需多文件拷贝 wrapper (E098/E174)"
    - "命令行工具: 软件级 commands.json 声明 (R38)"
  common_dependencies: []

versions:
  "1.6.2-rpk":
    status: built
    build_date: "2026-09-10"
