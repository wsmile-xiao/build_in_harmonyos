# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cronolog/1.6.2-rpk
homepage: "https://github.com/fordmason/cronolog"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: true

# 上游测试审计 (源码: cronolog-1.6.2.tar.gz, sha256 65e91607643e5aa5b336f17636fa474eb6669acc89288e72feb2f54a27edb88e)
upstream_test_audit:
  source_tarball: "cronolog-1.6.2.tar.gz"
  source_sha256: "65e91607643e5aa5b336f17636fa474eb6669acc89288e72feb2f54a27edb88e"
  top_level_files:
    - configure.in        # AC_INIT(COPYING) + AC_OUTPUT(... testsuite/Makefile ...); 无测试宏
    - Makefile.am         # AUTOMAKE_OPTIONS=gnu dejagnu, SUBDIRS=lib src doc testsuite; 无 TESTS / check_PROGRAMS / check-local
    - testsuite/Makefile.am  # 仅 automake 注释行, 无任何目标
    - testsuite/README    # 明示 "Unfortunately the testsuite is not yet written ;-)"
    - src/Makefile.am     # sbin_PROGRAMS=cronolog + sbin_SCRIPTS=cronosplit + noinst_PROGRAMS=cronotest (手动调试 helper, 非自动化套件)
    - src/cronotest.c     # 交互式调试 helper, 需手动调用, 非 make check 目标
    - configure.ac        # (GitHub master) 无 AC_CONFIG_TESTDIR / 测试相关宏
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am TESTS / check_PROGRAMS / check-local 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "make check / ctest 目标"
    - "find . -name '*test*' (全树)"
  scan_result: "testsuite/ 为空 (无 TESTS 目标); 全树唯一可执行测试为 src/cronotest.c (noinst_PROGRAMS, 非交互式: cronotest [OPTIONS] template count, -s 可固定起始时间)"
  make_check_output: "make check 无可执行用例 (testsuite 无 TESTS 目标, dejagnu 空展开) — 执行 0 用例; 上游唯一可执行测试为构建树 src/cronotest, 由 test_package 真实运行 (1 用例)"
  reason: "cronolog 1.6.2 testsuite/ 为空 (README 明示尚未编写、无 TESTS/check_PROGRAMS 目标), 但 src/cronotest.c 为随包构建的可执行测试工具 (noinst_PROGRAMS, 用法 cronotest [OPTIONS] template count, 完全非交互式, -s 可固定起始时间做确定性验证)。功能验证由 test_package 真实执行 cronolog 二进制 (-V + -o 单写 cmp + 日期模板自动建目录 cmp) 完成, 上游 1 用例由 test_package 真实运行 cronotest (固定起始时间 + %Y/%m/%d 模板推演 3 个周期, 校验 Rotation period/Period 1-3/2024 文件名展开) 完成"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: true, 见上方审计)
# src/cronotest.c 为随包构建的可执行测试工具 (noinst_PROGRAMS, 非交互式),
# 由 test_package 以固定起始时间真实运行 (1 用例)
# 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"passed" discovered:1 executed:1
upstream_tests:
  - file: src/cronotest.c
    source: cronolog-1.6.2/src/cronotest.c
    description: "上游随包构建的可执行测试工具 (noinst_PROGRAMS), 用法 cronotest [OPTIONS] template count, 非交互式; test_package 以固定起始时间真实运行并校验输出"
    command: 'cronotest -s "01 Jan 2024 00:00:00" "logs/%Y/%m/%d/app.log" 3'

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的二进制
test_package_tests:
  - file: test.sh
    description: "功能测试: cronolog -V + 管道经 -o 单写文件并 cmp 内容一致 + 日期模板自动建子目录并 cmp 内容一致"
    command: "bash test.sh"
  - file: conanfile.py
    description: "Conan test() 入口, 执行 test.sh 并输出 HMBS 机器证据标记 (test_package discovered=3/passedCount=3 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test.sh 的 3 个真实断言, 与 HMBS_TEST_PACKAGE_RESULT discovered=3 一致)
assertion_count: 3
