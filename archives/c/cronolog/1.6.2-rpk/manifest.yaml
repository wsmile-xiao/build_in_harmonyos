patches_applied: []

knowledge_gained:
  - "cronolog 1.6.2 的 configure 早于 config.guess 三元组时代 (无 --build/--host, 包内无 config.guess), 直接沿用 Conan 工具链的 CC, 无需三元组补丁"
  - "HarmonyOS /tmp 只读时透传 HMBS 可写 TMPDIR/TMP/TEMP 进 Conan buildenv (本包 configure 无 mktemp 逻辑, 不套用常失败 mktemp shim)"
  - "doc 多文件 install-man 在 HMBS 单文件 install shim 下报 EX_USAGE 64, 用多文件拷贝 wrapper 重定向 INSTALL_DATA (lzop 1.04 同源方案)"
  - "cronolog 管道 EOF 后退出码为 3 (正常结束), test.sh 需显式放行 3, 其他非零仍判失败"
  - "cronolog 1.6.2 testsuite 为空但 src/cronotest.c 为随包构建的可执行测试工具 (noinst_PROGRAMS, 非交互式); package() 将其 stage 到 bin/cronotest, test_package 以固定起始时间真实运行 (1/1) 并校验 Rotation period/Period 1-3/2024 展开"
