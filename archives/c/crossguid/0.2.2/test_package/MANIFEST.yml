# test_package/MANIFEST.yml
# 上游官方测试声明文件 — crossguid/0.2.2

package: crossguid/0.2.2
homepage: "https://github.com/graeme-hill/crossguid"

# 上游测试命令 (CMake 构建, XG_TESTS=ON 生成 xgtest 并直接运行)
upstream_check_command: "cmake --build . (XG_TESTS=ON -> xgtest)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./xgtest"

# 上游实际运行的测试程序 (单一手写 harness, 15 项断言)
upstream_tests:
  - file: test/Test.cpp
    source: crossguid-0.2.2/test/Test.cpp
    description: "hand-written harness: random uniqueness, parse + string round-trip, swap, bytes<->string, error handling"
    command: "./xgtest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_crossguid.cpp
    description: "consumer: real xg::newGuid/Guid(string)/str()/operator<< calls, links installed crossguid"
    command: "./test_crossguid"
  - file: test_ohos_crossguid.cpp
    description: "OHOS-specific: batch uniqueness(1000), bytes<->string round trip, swap/copy, invalid-input handling"
    command: "./test_ohos_crossguid"

# 测试断言总数 (上游 harness 内 15 个检查点)
assertion_count: 15
