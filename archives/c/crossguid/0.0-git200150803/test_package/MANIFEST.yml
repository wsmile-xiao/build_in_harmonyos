# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: crossguid/0.0-git200150803
homepage: "https://github.com/graeme-hill/crossguid"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./crossguid_upstream_test"

upstream_tests:
  - file: test.cpp
    source: crossguid-8f399e8/test.cpp
    description: "上游手写 harness（前 CMake 时代）：单可执行文件 6 断言——3 个随机 guid 互异、s1!=s2、s1==s4、3 组字符串往返；成功打印 All tests passed!"
    command: "./crossguid_upstream_test"

test_package_tests:
  - file: test_crossguid.py
    description: "R34：编译运行真实 Guid API——字符串往返+相等比较（case1）、GuidGenerator::newGuid 互异（case2）"
    command: "python3 test_crossguid.py <crossguid_pkg> <uuid_pkg>"

assertion_count: 8
