# Upstream test declaration for cek 0.2.0.

package: cek/0.2.0
homepage: "https://github.com/bschaatsbergen/cek"

upstream_tests_exist: true
upstream_test_in_build: true
upstream_test_mode: "default: smoke; full: CEK_UPSTREAM_TEST_MODE=full"
upstream_check_command: "default smoke: go test -v -timeout=5m -p 1 -run <deterministic command tests> ./internal/command && go test -v -timeout=5m -p 1 ./internal/view; full: go list ./... && go test -v -timeout=10m -p 1 ./..."
upstream_test_command: "default smoke: deterministic internal/command tests plus internal/view; full: CEK_UPSTREAM_TEST_MODE=full"

upstream_tests:
  - file: internal/command/cat_test.go
    test_functions: 4
    source: "cek-0.2.0/internal/command/cat_test.go"
    description: "Read regular files from OCI layers; uses nginx:latest."
    command: "go test -v -run TestExtractFileFromLayer ./internal/command"
  - file: internal/command/inspect_test.go
    test_functions: 15
    source: "cek-0.2.0/internal/command/inspect_test.go"
    description: "Inspect OCI metadata and error paths; uses alpine, nginx and distroless images."
    command: "go test -v -run 'TestNewInspectCommand|TestInspectCommand|TestRunInspect' ./internal/command"
  - file: internal/command/ls_test.go
    test_functions: 25
    source: "cek-0.2.0/internal/command/ls_test.go"
    description: "List and filter OCI layer files; uses alpine:latest and nginx:latest."
    command: "go test -v -run 'TestNewLsCommand|TestLsCommand|TestRunLs' ./internal/command"
  - file: internal/command/root_test.go
    test_functions: 6
    source: "cek-0.2.0/internal/command/root_test.go"
    description: "Root command and subcommand registration checks."
    command: "go test -v -run 'TestNewRootCommand|TestAddCommands' ./internal/command"
  - file: internal/command/version_test.go
    test_functions: 4
    source: "cek-0.2.0/internal/command/version_test.go"
    description: "Version command argument and output checks."
    command: "go test -v -run TestVersionCommand ./internal/command"
  - file: internal/view/logger_test.go
    test_functions: 8
    source: "cek-0.2.0/internal/view/logger_test.go"
    description: "Human/JSON logger output and level filtering."
    command: "go test -v ./internal/view"

test_package_tests:
  - file: test.sh
    description: "Run the installed cek --version and verify the Conan package version."
    command: "sh test.sh <package>/bin/cek"
  - file: test.sh
    description: "Run the installed cek version and optional path argument."
    command: "sh test.sh <package>/bin/cek"
  - file: test.sh
    description: "Run the installed cek --help output check."
    command: "sh test.sh <package>/bin/cek"
  - file: test.sh
    description: "Verify an invalid argument count returns non-zero."
    command: "sh test.sh <package>/bin/cek"

assertion_count: 6

upstream_test_source_total: 62
upstream_test_source_breakdown: "cat=4, inspect=15, ls=25, root=6, version=4, view/logger=8"

test_suite_gaps:
  registry_tests: "44 upstream test functions need OCI image access through a local daemon or remote registry."
  local_tests: "18 upstream test functions are deterministic and do not require external images."
observed_results:
  default_smoke: "HarmonyOS Shadow CI: discovered=26, executed=26, passed=26, failed=0, skipped=0."
  full: "HarmonyOS Shadow CI: source census N=62; observed N'=31, passed=17, failed=14, skipped=0; 31 source functions were not represented in this run; registry requests to index.docker.io/gcr.io timed out."
