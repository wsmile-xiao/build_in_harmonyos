# 版本级 manifest — cppnumericalsolvers 1.0.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.0"
software: cppnumericalsolvers

status: built
build_date: "2026-09-09"
build_system: bazel(上游)/header-only 直拷(适配侧)

source:
  url: "https://debian.stanford.edu/debian/pool/main/c/cppnumericalsolvers/cppnumericalsolvers_1.0.0.orig.tar.gz"
  sha256: "532a4b0cbaa3054af6fa45f1d9cf3205848c27b72ab3b4879a532fc8be5723ca"
  tar_format: tar.gz
  note: "上游 git 仓无 v1.0.0 标签（仅 v1.0.0alpha1/alpha2、v2.0.0），源码取 Debian sid 收录的 1.0.0 orig tarball"

build:
  system: header-only（直接编译测试，无构建系统）
  configure_options:
  - "c++ -std=c++17 直接编译 verify.cpp + Rosenbrock 消费测试"
  dependencies:
  - "eigen/3.4.1"
  - "gtest/1.17.0 (test_requires，仅测试)"
  cc: clang

patches_applied: []

knowledge_gained:
- "cppnumericalsolvers 1.0.0 上游 git 无对应 tag，Debian sid 的 orig tarball 是唯一权威 1.0.0 源码（sha256 锁定）"
- "上游只有 Bazel 构建（WORKSPACE 联网拉 gtest/eigen），沙箱不可用 → build() 内直接用 Conan gtest 编译 verify.cpp 实跑"
- "verify.cpp 16 TEST + 23 TYPED_TEST（×float/double 双实例化=78 gtest 实例）；benchmark.cpp 写死 bazel 相对 include 且是性能基准，非功能测试"
- "TYPED_TEST_CASE 旧宏在 gtest 1.17 仍存在（deprecated 警告但可用），2016 年代码无需改写"
