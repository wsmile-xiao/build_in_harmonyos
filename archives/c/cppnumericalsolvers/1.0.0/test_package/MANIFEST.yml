# test_package/MANIFEST.yml — cppnumericalsolvers 1.0.0
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: cppnumericalsolvers/1.0.0
homepage: "https://github.com/PatWie/CppNumericalSolvers"

# 上游测试命令（上游仅提供 Bazel：bazel test //src/test:verify，会联网拉依赖）
upstream_check_command: "bazel test //src/test:verify"

# conanfile.py build() 中是否已集成上游测试（层1）
upstream_test_in_build: true
upstream_test_command: "build() 内用 Conan gtest/1.17.0 直接编译实跑 src/test/verify.cpp（绕过 Bazel 联网）"

# 上游测试真相：src/test/verify.cpp 含 16 个 TEST + 23 个 TYPED_TEST
#（typed 用例按 float/double 双实例化 → 62 实例），合计 39 个用例定义/
# 78 个 gtest 实例，全部实跑通过。src/test/benchmark.cpp 是性能基准
#（依赖 google benchmark 且 include 写死 bazel 相对路径 ../../gtest/...），
# 非功能正确性测试，如实上报不纳入。src/examples 9 个示例程序非测试。
upstream_test_count: 39
