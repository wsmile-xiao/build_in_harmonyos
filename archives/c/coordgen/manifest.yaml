software: coordgen
display: "coordgenlibs"
description: "Schrödinger 2D 分子坐标生成（sketcher minimizer）库；RDKit coordgen 集成的上游"
category: library
homepage: "https://github.com/schrodinger/coordgenlibs"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 CMakeLists 固定 CMAKE_CXX_STANDARD 11（低于 profile cppstd 17）；按上游显式选择编译，package_id 仍按 profile 生成"
    - "上游 cmake_minimum_required(3.2) 在 CMake 4.x 下需传 CMAKE_POLICY_VERSION_MINIMUM=3.5（见知识 E103）"
    - "默认 COORDGEN_USE_MAEPARSER=OFF：模板编译期内嵌、库零依赖；上游测试另需 maeparser 与 Boost（Boost.Test 用 boost/test/impl/*.ipp 手动静态编译补齐）"
    - "COORDGEN_RIGOROUS_BUILD=ON（-Werror）在 OHOS clang 15 下库本体零告警可直接通过"
  common_dependencies: []

versions:
  "3.0.2":
    status: built
    build_date: 2026-09-07
