package: coordgen/3.0.2
homepage: "https://github.com/schrodinger/coordgenlibs"

upstream_check_command: "ctest (Boost.Test via manual static compile + example)"
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure（原生探索阶段 shared/static 两变体执行）"

upstream_tests:
  - name: test_coordgen (Boost.Test, 16 test cases)
    command: "./test/test_coordgen --log_level=test_suite"
    expected: "16 test cases pass; No errors detected"
  - name: test_smilesparser (Boost.Test, 4 test cases)
    command: "./test/test_smilesparser --log_level=test_suite"
    expected: "4 test cases pass; No errors detected"
  - name: example (smoke)
    command: "./example_dir/example"
    expected: "exit 0; prints generated coordinates"

test_package_tests:
  - file: example.cpp
    description: "Programmatically build a benzene ring (6 C atoms; alternating Kekule bond orders) via the installed public API: sketcherMinimizerMolecule::addNewAtom/addNewBond; atom setAtomicNumber; bond setBondOrder; sketcherMinimizer::initialize/runGenerateCoordinates; atom getCoordinates. Verifies atom/bond counts; finite coordinates; plausible and near-uniform bond lengths (six-ring template recognition with USE_MAEPARSER=OFF built-in templates); distinct atom positions"
    command: "./test_package"

assertion_count: 30
