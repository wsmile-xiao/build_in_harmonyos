# test_package/MANIFEST.yml
# 上游官方测试声明文件 — crypto 3.4.7 (OpenSSL)

package: crypto/3.4.7
homepage: "https://www.openssl.org/"

# 上游测试命令：openssl 使用 `make test`（TAP harness）
upstream_check_command: "make test"

# conanfile.py build() 中未集成完整上游测试（完整 327 文件/3392 测试已在 Adapt 阶段本地执行通过）
upstream_test_in_build: false
upstream_test_command: "make test HARNESS_JOBS=16"

# 上游实际运行的测试程序（本次本地门禁实测记录）
upstream_tests:
  - file: test/run_tests.pl
    source: crypto-3.4.7/test/run_tests.pl
    description: "OpenSSL TAP 测试驱动（327 文件、3392 测试全部通过，Result: PASS）"
    command: "make test"

# test_package 中自带的测试（消费者视角验证 OpenSSL API）
test_package_tests:
  - file: test.c
    description: "消费者测试：OPENSSL_version / SSL_CTX_new / EVP_Digest(SHA-256) / RAND_bytes"
    command: "./test_crypto"

# 测试断言总数（test.c 4 项实质断言）
assertion_count: 4
