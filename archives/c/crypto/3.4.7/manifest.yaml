# 版本级 manifest — crypto 3.4.7 (OpenSSL)
# 遵循 ARCHIVE-SPEC v2.0

version: "3.4.7"
software: "crypto"
status: published
build_date: "2026-09-21"
build_system: "custom-perl"

# 源码信息
source:
  url: "https://github.com/openssl/openssl/releases/download/openssl-3.4.7/openssl-3.4.7.tar.gz"
  sha256: "7261c348e6e59bc7b635a30f98072e8817a1c60a7033bb570737394a3a061842"
  tar_format: tar.gz

# 构建配置
build:
  system: custom-perl
  configure_options:
    - "perl ./Configure --prefix=<prefix> --openssldir=<prefix>/ssl --with-rand-seed=getrandom no-asm no-shared -fPIC linux-aarch64"
  dependencies: []
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "E006 等价命中：OpenSSL aarch64 必须 no-asm（ARM64 汇编 RSA-PSS bug），本轮配置一致"
  - "E235 等价命中：OHOS 熵源必须 --with-rand-seed=getrandom（排除 DEVRANDOM_WAIT/FD_SET __fd_chk 路径）"
  - "E017 等价命中：github.com 下载超时时用 ghfast.top 镜像（网络/基础设施，路径 A）"
