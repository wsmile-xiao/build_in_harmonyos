knowledge_gained:
  - "coreutils 9.11 的 config.guess (2025) 仍无 HarmonyOS 识别，需移植 aarch64:HarmonyOS -> aarch64-unknown-linux-ohos 分支（与 9.10 同）"
  - "9.11 已移除 lib/freadptr.c 与 lib/freadseek.c，仅剩 lib/freadahead.c 需要 musl opaque FILE 适配"
  - "config.status 在 HMDFS 上因 umask 077 临时目录权限失败（./confXXXX/subs1.awk Permission denied），需移除 umask 077 并 chmod 755 临时目录"
  - "coreutils 9.11 的 make 单目标 src/env 会跳过 BUILT_SOURCES（configmake.h/stdckdint.h/stdcountof.h 未生成），必须用完整 make 先构建生成头"
  - "env 命令不读取 stdin 管道，9.10 的 fstat/lseek EACCES 补丁（E076）不适用于 env"

