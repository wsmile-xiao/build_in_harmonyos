# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: clang16-ccache/16.0.6
homepage: "https://ccache.dev/"

# 上游测试命令 (用于 ctest -N / doctest 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: unittest/main.cpp
    source: ccache-4.14/unittest
    description: "ccache doctest 单元测试（源码声明 279 / 注册执行 243；实测 240 通过、3 失败=设备 link(2) 硬链接限制、5 跳过=上游 runtime 条件）"
    command: "./unittest/unittest"
  - file: test/suites/*.bash
    source: ccache-4.14/test/suites
    description: "ccache ctest 集成套件 54 项（实测 30 通过、2 失败=硬链接与只读 /tmp 平台限制、22 跳过=外部工具/环境条件）"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证, R34 实质消费)
test_package_tests:
  - file: test_package/consumer_hello.c
    description: "消费者 C 源：真实业务程序，由 consumer_verify.sh 经 ccache 包装 OHOS clang 编译/链接/运行"
    command: "ccache clang -c consumer_hello.c && clang -o hello hello.o && ./hello"
  - file: test_package/consumer_verify.sh
    description: "消费者验证：ccache 包装编译真实 C 源、断言缓存命中（direct+preprocessed>=1）并运行产物"
    command: "bash consumer_verify.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
