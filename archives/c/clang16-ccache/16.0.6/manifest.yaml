  sha256: "5b107d2b5604cf3db7bc64b359544b914b1df2035667ab3cee9b737484aa299a"
  tar_format: tar.gz

build:
  system: cmake
  # 包构建（conanfile.py）实际使用的配置；上游测试在适配阶段以
  # ENABLE_TESTING=ON 单独构建执行（见 notes.md / reports/test-report.md）
  configure_options:
    - "DEPS=DOWNLOAD"
    - "REDIS_STORAGE_BACKEND=ON"
    - "HTTP_STORAGE_BACKEND=ON"
    - "ENABLE_TESTING=OFF"
    - "ENABLE_IPO=OFF"
    - "CMAKE_CXX_STANDARD=20"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-ccache-argprocessing.cpp.patch"
  - "0002-src-ccache-config.cpp.patch"
  - "0003-src-ccache-util-path.cpp.patch"
  - "0004-unittest-test_util_tokenizer.cpp.patch"

knowledge_gained:
  - "ccache 4.14 使用 C++20 std::ranges 算法，OHOS libcxx-ohos (LLVM 15.0.4) 不提供 all_of/any_of/equal，需替换为迭代器版（与 E900 知识一致）"
  - "ccache 依赖通过 FetchContent (DEPS=DOWNLOAD) 管理，hiredis/xxhash/zstd 需预下载（其余依赖 bundled 于 src/third_party）"
  - "doctest 头文件仅从 raw.githubusercontent.com 获取，设备网络不可达（SSL connection reset），本地验证需经 gh-proxy 预置本地副本"
  - "unittest/ctest 的 hardlink(2) 用例在设备全部可写挂载点均 Permission denied，属平台限制（E079）；只读 /tmp 使 readonly 套件无法创建临时文件（E002）"

