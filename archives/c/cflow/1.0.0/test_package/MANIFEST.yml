# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cflow/1.0.0
homepage: "https://www.gnu.org/software/cflow/"

# 上游测试命令（cflow 为 GNU Autotest 套件，慢速环境 make check 超时，SKILL §3 允许跳过记录）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序（Autotest 套件超时未完成，0 用例可执行）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "cflow --version 版本断言 + 调用图生成断言（main→foo）"
    command: "cflow --version && cflow -o - sample.c"

# 测试断言总数
assertion_count: 2
