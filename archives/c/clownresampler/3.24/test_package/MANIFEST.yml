# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: clownresampler/3.24
homepage: "https://github.com/Clownacy/clownresampler"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/CMakeLists.txt 注册 16 个 ctest 用例:
# test-high-level × 4 组 + 每组 compare；test-low-level × 4 组 + 每组 compare)
upstream_tests:
  - file: tests/test-high-level.c
    source: clownresampler-12adf868/tests/test-high-level.c
    description: "高层面 API 重采样测试 (配合 dr_flac.h 解码 test.flac，4 组输入/输出采样率组合)"
    command: "test-high-level <test.flac> <out> <in_rate> <out_rate> <low_pass>"
  - file: tests/test-low-level.c
    source: clownresampler-12adf868/tests/test-low-level.c
    description: "低层面 API 重采样测试 (同样 4 组采样率组合)"
    command: "test-low-level <test.flac> <out> <in_rate> <out_rate> <low_pass>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：公开低层 API 将 8000Hz 单声道缓冲上采样至 16000Hz，验证 Init/Precompute/Resample 产出真实输出帧"
    command: "./test_clownresampler"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8