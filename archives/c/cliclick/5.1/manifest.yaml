version: "5.1"
software: "cliclick"
status: "built"
build_date: "2026-09-09"
conan_ref: "cliclick/5.1"
build_system: "make"
source:
  url: "https://github.com/BlueM/cliclick/archive/refs/tags/5.1.tar.gz"
  sha256: "58bb36bca90fdb91b620290ba9cc0f885b80716cb7309b9ff4ad18edc96ce639"
  tar_format: "tar.gz"
license: "BSD-3-Clause"
build:
  system: "make"
  jobs: 1
  cc: "clang"
  strategy: "rewrite-class port: the upstream macOS-only Objective-C/Cocoa front end is re-implemented as a pure-C CLI over the OpenHarmony input-injection C API; only the added ohos/ backend is compiled"
  dependencies: []
test_results:
  type: "test_package-assertions"
  harness: "POSIX-sh port of upstream Test.sh plus OHOS capability assertions"
  total: 75
  upstream_discovered: 64
  upstream_discovered_accounting: "grep -c assert upstream Test.sh = 64 = 60 assertion invocations + 4 assertion-helper definitions; invocations: 58 executed 1:1, 2 pbpaste-blocked with named substitutions; helper definitions realized by the ported harness"
  upstream_portable: 58
  upstream_platform_blocked: 2
  ohos_capability_added: 17
  notes: "Counts are the assertion totals of test_package/test.sh (17 OHOS-side = 2 named pbpaste substitutions + 15 additions); per-run results are in the conan create log and test_package/MANIFEST.yml"
platform_capability_split:
  supported:
    - "kd / ku / kp: key injection via OH_Input_InjectKeyEvent (no extra authorization needed)"
    - "t: ASCII typing via oh_key_code.h US-layout mapping (shift auto-applied)"
    - "w: waits"
    - "c / dc / tc / rc / dd / dm / du: mouse injection via OH_Input_InjectMouseEvent at absolute coordinates; requires the OHOS input-injection authorization (CLI prints authorization guidance for INPUT_PERMISSION_DENIED (201); any other result code is reported verbatim)"
  explicit_boundaries:
    - "p (position print) and '.' / relative coordinates: pointer position read-back is not exposed to CLI processes (mouse monitor API is permission-gated)"
    - "cp: no screen-pixel read-back C API (upstream uses the obsolete macOS CGWindowListCreateImage)"
    - "clipboard output destination (-d/-m clipboard): no pasteboard C API; both forms exit non-zero with a stderr diagnostic in test and non-test mode"
    - "-r (restore position): depends on the unavailable position read-back"
probe_evidence:
  keyboard_injection: "OH_Input_InjectKeyEvent KEY_ACTION_DOWN/UP KEYCODE_A returned INPUT_SUCCESS without prior authorization"
  mouse_injection: "OH_Input_InjectMouseEvent MOUSE_ACTION_MOVE returned INPUT_PERMISSION_DENIED (201) in the non-interactive session"
  request_injection: "OH_Input_RequestInjection returned INPUT_INJECTION_AUTHORIZING (3900005); the authorize callback never fired; OH_Input_QueryAuthorizedStatus reported AUTHORIZING; OH_Input_CancelInjection used to clean up"
  mouse_monitor: "OH_Input_AddMouseEventMonitor returned INPUT_PERMISSION_DENIED (201)"
