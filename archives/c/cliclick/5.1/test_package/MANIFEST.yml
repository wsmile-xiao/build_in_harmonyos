package: cliclick/5.1
homepage: "https://github.com/BlueM/cliclick"

upstream_check_command: "sh test.sh <cliclick> 5.1 (portable + OHOS capability subset of upstream Test.sh)"
upstream_test_in_build: true
upstream_test_command: "sh test.sh <cliclick> 5.1"

upstream_tests:
  - file: Test.sh
    source: cliclick-5.1/Test.sh
    description: "Upstream hand-rolled assertion harness (POSIX-sh port; the two pbpaste clipboard assertions are macOS-only)"
    command: "sh test.sh <cliclick> 5.1"
    status: "executed_portable_subset_on_ohos_target"
    discovered: 64
    discovered_accounting: "reviewer-countable N=64: grep -c assert upstream Test.sh = 64 = 60 top-level assertion invocations (32 assertStderrOutput + 26 assertStdoutOutput + 1 assertFileContains + 1 assertClipboardContains) + 4 assertion-helper definitions (Test.sh:18/23/28/44)"
    invocation_disposition:
      - "upstream #1-56 and #59-60 (58): executed 1:1 on the OHOS target (upstream #11 re-runs bare 'c' where its description says 'c:' - an upstream copy-paste slip; ported per the stated intent)"
      - "upstream #57-58 (2): pbpaste/pasteboard macOS-only; substituted by the named OHOS assertions 'clipboard destination is an explicit unsupported boundary' and 'clipboard destination exits non-zero' in test_package/test.sh"
    helper_definition_disposition: "Test.sh:18/23/28/44 are not standalone assertions; realized 1:1 by the ported harness (assertStdoutOutput->expect_stdout, assertStderrOutput->expect_stderr, assertClipboardContains->the named clipboard substitution pair, assertFileContains->the 'test:file contains the commands' check)"
    executed: 58
    passed: 58
    failed: 0
    disabled: 0
    substituted_with_named_assertions: 2
    platform_blocked:
      - "upstream assertion 'clipboard content' requires pbpaste (macOS-only)"
      - "upstream assertion 'test:clipboard stdout empty' requires a pasteboard writer (macOS-only); OHOS asserts an explicit unsupported diagnostic instead"

test_package_tests:
  - file: test.sh
    description: "58 portable upstream assertions (1:1) + 2 named pbpaste substitutions + 15 OHOS capability assertions = 75 checks (key injection positive, mouse injection authorization gate, cp/position/clipboard/-r explicit boundaries including the -d clipboard non-test path, version/usage smoke)"
    command: "sh test.sh <cliclick> 5.1"

upstream_test_count: 64
test_package_test_count: 1
assertion_count: 75

test_modifications:
  - "Rewrite the upstream bash harness as POSIX sh and drive the packaged binary"
  - "Exclude the two pbpaste-based clipboard assertions (macOS-only); replace with an explicit OHOS unsupported-destination diagnostic assertion"
  - "Add OHOS capability-split assertions: cp and pointer-position read-back must fail loudly with their boundary diagnostics; key injection must execute; mouse injection must execute or fail with the explicit authorization diagnostic"
