# chaiscript 6.1.0 编译档案
software: chaiscript
version: 6.1.0
status: built
build_system: none-header-only
compile_date: 2026-09-07

dependencies:
  required: []
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options: []
  cflags: ""
  env:
    CXX: clang++

patches_applied: []

compatibility:
  level: high
  issues: []
  notes: |
    - header-only 库（include/chaiscript/，47 个 .hpp），零外部依赖
    - 需要 C++14；OHOS clang 15 完全支持
    - 线程模型基于 std::thread/thread_local（chaiscript_threading.hpp），
      无 pthread/平台特定 API，OHOS 无需 patch
    - 伞形头 chaiscript.hpp 默认构造编译内置 Std_Lib::library()，
      运行时不 dlopen；显式 load_module() 才触发动态加载
    - 构造函数在 _POSIX_VERSION 下用 dladdr() 探测可执行路径，
      musl/OHOS 的 libc 提供 dladdr，消费者链接 CMAKE_DL_LIBS 即可

test_results:
  type: upstream-suite-on-device
  passed: 417
  failed: 12
  note: "上游套件真机实测 417/429（97.2%）；12 失败单一根因：OHOS 跨 dlopen 边界 type_info operator== 不成立（探针实证），仅影响 load_module 可选特性；test_package 8/8 PASS（推荐编译内置用法不受影响）"

knowledge_gained:
  - "chaiscript 是 header-only 库，package_type=header-library，只打包头文件"
  - "ChaiScript() 默认构造用编译内置 stdlib，不 dlopen；单参 ChaiScript_Basic 构造才会运行时找模块（5.x 迁移常见坑）"
  - "上游 CMake 对 clang 硬编码 -stdlib=libc++（USE_LIBCXX 默认 TRUE），与 OHOS 工具链冲突，故不走上游构建系统"
  - "OHOS 跨 dlopen 边界 std::type_info::operator== 对同名类型返回 false（libc++abi 无名字回退；探针实证），任何依赖跨 DSO RTTI 同一性的 C++ 插件机制（含 chaiscript load_module）受影响；单 TU/静态集成不受影响"

references:
  - https://github.com/ChaiScript/ChaiScript
