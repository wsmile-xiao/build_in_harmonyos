# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: cute_c2/1.0.0
homepage: https://github.com/RandyGaul/cute_headers

# 上游测试: cute_c2 是单头文件碰撞检测库，上游仓库无独立测试套件
# （cute_headers 无 test/ 目录、无 CI 测试脚本；头文件为 header-only，
#   通过 CUTE_C2_IMPLEMENTATION 宏在一个编译单元中展开，官方示例位于
#   examples_cute_gl_and_c2/，非独立可运行测试入口）
upstream_check_command: ""   # 上游无测试入口
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试（消费者视角验证鸿蒙平台可编译可运行）
test_package_tests:
  - file: test_cute_c2.c
    description: "直接调用 cute_c2 公开 API（c2CircletoCircle/c2AABBtoAABB/c2MakePoly+c2PolytoPoly/c2Collide manifold/c2RaytoAABB）并断言 5 项命中/流形/射线结果"
    command: "clang -std=c99 -DCUTE_C2_IMPLEMENTATION test_cute_c2.c && ./test_cute_c2"

# 测试断言总数 (test_package 5 项)
assertion_count: 5