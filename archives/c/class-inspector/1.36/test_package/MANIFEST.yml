# test_package/MANIFEST.yml — class-inspector 1.36
# CI L0e 强制要求此文件存在（上游测试声明文件）
# 详见: docs/TEST_QUALITY_SPEC.md

package: class-inspector/1.36
homepage: "https://metacpan.org/pod/Class::Inspector"

# 上游自带 Makefile.PL（由 Dist::Zilla::Plugin::Author::Plicease::MakeMaker
# 生成，直接 use ExtUtils::MakeMaker；发行版内**不含 inc/**，非 Module::Install、
# 也非 Module::Build），不需要生成替代构建脚本；上游测试经 make test 运行。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试套件（2026-09-18 实测，hnp perl 5.42.0）：
# - t/ 目录：6 个 .t 测试文件
# - 实测结果：**Files=6, Tests=86, Result: PASS**；执行口径为 85 通过 + 1 个 skip 用例，
#   另有 1 个文件整体 skip
#   skip：t/class_inspector__devel_hide.t —— `skipped: test requires Devel::Hide`
#   （可选测试依赖未安装，非失败）
#   逐文件实测（perl -Iblib/lib t/<file> 逐跑，取各文件 TAP 计划）：
#     00_diag.t                        plan 1..1   → 1
#     01_use.t                         plan 1..3   → 3
#     class_inspector.t                plan 1..56  → 56
#     class_inspector__inc_to_local.t  plan 1..2   → 2（其中 1 个为 Win32 分支 skip 用例）
#     class_inspector_functions.t      plan 1..24  → 24
#     class_inspector__devel_hide.t   plan skip_all → 0（文件整体跳过；声明 tests=>2）
#   已执行合计 = 1+3+56+2+24 = 86；其中 **85 通过 + 1 个 skip 用例**。
#   注意：不能按 diag 行数估算用例数（00_diag.t 虽打印 4 行模块版本 diag，用例只有 1 个）。
upstream_tests:
  - file: t/
    source: Class-Inspector-1.36/t/*.t
    description: "上游 perl 测试套件（6 文件 86 用例 = 85 通过 + 1 个 skip 用例；hnp perl 5.42.0 实测 Result: PASS，零失败。另 1 个文件整体 skip：t/class_inspector__devel_hide.t 需 Devel::Hide）"
    command: "make test"

# test_package 消费者测试（R34 真实 API：加载打包的 Class::Inspector 与
# Class::Inspector::Functions，真实调用其全部公开接口）
test_package_tests:
  - file: test_class_inspector.pl
    description: "消费者测试：版本号、loaded/installed、filename/loaded_filename/resolved_filename、functions/function_refs/function_exists、methods、subclasses（含 ''/undef 三态语义）、_class 校验契约、函数式导出与调用"
    command: "perl -I<site> test_class_inspector.pl"

# 测试断言总数（实测 TAP 计划 1..30）
assertion_count: 30
