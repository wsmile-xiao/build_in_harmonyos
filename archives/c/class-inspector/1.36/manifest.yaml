# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []
  note: |
    META.json prereqs.runtime.requires 仅为 File::Spec >= 0.80 与 base
    （均为 perl 核心模块），configure 为 ExtUtils::MakeMaker + perl >= 5.008，
    test 为 Test::More >= 0.98。全部为 OHOS perl 内建，无外部 CPAN 依赖、
    无 Conan 依赖。
    构建系统为 **Dist::Zilla 生成的 Makefile.PL**（直接 use ExtUtils::MakeMaker），
    发行版内**不含 inc/**——既非 Module::Install 也非 Module::Build，故无需生成
    替代构建脚本、无需外部引导。
    META.json 的 prereqs.develop 列有大量作者侧测试工具（Test::EOL、
    Test2::Tools::PerlCritic、Test::Pod::Spelling::CommonMistakes 等），
    这些属 `xt/` 作者测试用，`make test` 不加载，本适配不涉及。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Perl 模块无二进制产物，沿用
    perl-uri / metrics-any / test-refcount / file-sharedir-install 先例；
    不产生 bindirs，故无需 commands.json，R38 不适用）。
    构建：perl Makefile.PL INSTALLDIRS=site → make → make test →
    make install DESTDIR=<staging>；package() 按登台树原样拷入
    package_folder，并以遍历定位 Class/Inspector.pm 后**上溯一级**得到 site
    目录（安装前缀随 perl 构建而异，实测
    /data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/5.42.0）。
    package_info() 以 runenv_info 注入 PERL5LIB；无 C/C++ 库可链接
    （cpp_info.libs=[]，R26 不适用）。
    解释器固定 /data/service/hnp/bin/perl（5.42.0），与同批次 perl 包口径一致。

