# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CPAN 发行版的构建系统须逐包实地确认：Class-Inspector 1.36 由 Dist::Zilla 生成的是**普通 Makefile.PL**（直接 use ExtUtils::MakeMaker，发行版内不含 inc/），与 1.30 的 Module::Install 随 inc/ 打包、以及 future/metrics-any 的 Module::Build 都不同——检查源码根目录有无 Makefile.PL 与 inc/ 再决定是否需要生成替代脚本 (ref: DRAFT-perl-build-system-varies-and-class-inspector-semantics)"
  - "Class::Inspector 的 subclasses() 有三态返回值（易踩）：命中子类→ARRAY ref；无命中→**空字符串 ''**；类名非法→**undef**。断言时不可一律按 ARRAY ref 处理（上游 t/class_inspector.t 即按三态分别断言）(ref: DRAFT-perl-build-system-varies-and-class-inspector-semantics)"
  - "Class::Inspector 的非法类名不要喂给 installed()/filename()：会触发上游 _inc_filename 对 undef 的取值警告；类名校验应使用 _class()（上游的校验契约断言即用它）(ref: DRAFT-perl-build-system-varies-and-class-inspector-semantics)"
  - "纯 Perl 模块的 site 目录定位：模块位于 <site>/<Module/Path>.pm，须按模块相对路径逐级上溯得到 site 根（Class/Inspector.pm 上溯一级、Test/Future/IO/Impl.pm 上溯三级）；返回末级目录会使 PERL5LIB/-I 指向错误层级 (ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "判定 ohpcd 制品是否存在必须用 conan search <pkg>/* -r=ohpcd；conan download 对不存在/未发布的包报误导性的 system acceleration policy not enabled (ref: DRAFT-perl-module-build-makemaker-substitution)"

references:
