version: "1.18.4.1"
software: "cairo"
status: built
build_date: "2026-09-08"
conan_ref: "cairo/1.18.4.1"
build_system: "meson"
source:
  url: "https://cairographics.org/releases/cairo-1.18.4.tar.xz"
  sha256: "445ed8208a6e4823de1226a74ca319d3600e83f6369f99b14265006599c32ccb"
  tar_format: tar.xz
build:
  system: meson
  configure_options:
    - "-Dxlib=enabled"
    - "-Dglib=enabled"
    - "-Dxcb=disabled"
    - "-Dxlib-xcb=disabled"
    - "-Dquartz=disabled"
    - "-Ddwrite=disabled"
    - "-Dlzo=disabled"
    - "-Dspectre=disabled"
    - "-Dtests=auto"
  dependencies:
    - pixman/0.46.4
    - libpng/1.6.58
    - freetype/2.14.3
    - fontconfig/2.18.1.1
    - zlib/1.3.1.1
    - glib/2.84.0.1
    - libx11/6.4.0
    - libxext/6.4.0
    - libxrender/0.9.12
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-fix-cairo-tmpfile-prefer-TMPDIR.patch"
  - "0002-fix-cairo-tmpfile-mkstemp-fallback.patch"
knowledge_gained:
  - "1.18.4.1：在 1.18.4 基础上启用 xlib surface（xlib=enabled + glib/gobject），为 gtk X11 后端提供 cairo-xlib 符号（R37 版本后缀，避免与制品仓 1.18.4 同版本冲突）"
  - "X 客户端库（libx11/6.4.0、libxext/6.4.0、libxrender/0.9.12）已发布 ohpcd；libx11 用 override 压掉 libxrender 配方的 libx11/1.8.13 传递 pin"
  - "glib 一并启用（cairo-gobject）：cairo 包自带 CAIRO_HAS_GOBJECT_FUNCTIONS 宏，下游 gtk 的头覆盖逻辑可跳过"
  - "构建期工具 meson 用 tool_requires（CI 无全局 meson）"
