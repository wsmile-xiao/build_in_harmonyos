software: cairo
name: Cairo Graphics Library
description: 2D graphics library with multiple output backends
category: graphics
license: LGPL/MPL
website: https://cairographics.org/

versions:
  - version: "1.18.2"
    status: published
    compiled_at: 2026-05-30
    notes: |
      - 2D 图形库
      - Weston/XWayland 的依赖
      - 使用 meson 构建
    dependencies:
      - pixman
      - freetype
      - libpng
      - glib-2.0
    provides:
      - libcairo.so
  - version: "1.18.4"
    status: built
    compiled_at: 2026-07-07
    notes: |
      - 纯 conan 图路线，全依赖各自独立 conan 包（pixman/libpng/freetype/fontconfig/expat/zlib）
      - 真机 conan create 全链 7 包 ALL_PASS；libcairo.so.2 dlopen 通过
    dependencies:
      - pixman/0.46.4
      - libpng/1.6.58
      - freetype/2.14.3
      - fontconfig/2.18.1
      - zlib/1.3.1.1
    provides:
      - libcairo.so.2
