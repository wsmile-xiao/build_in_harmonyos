version: '1.18.2'
status: built
build_date: '2026-09-26'

source:
  url: 'https://cairographics.org/releases/cairo-1.18.2.tar.xz'
  sha256: 'a62b9bb42425e844cc3d6ddde043ff39dbabedd1542eba57a2eb79f85889d45a'
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - '-Dpng=enabled'
    - '-Dfreetype=enabled'
    - '-Dfontconfig=disabled'
    - '-Dzlib=enabled'
    - '-Dxlib=disabled'
    - '-Dxcb=disabled'
    - '-Dxlib-xcb=disabled'
    - '-Dquartz=disabled'
    - '-Ddwrite=disabled'
    - '-Dspectre=disabled'
    - '-Dsymbol-lookup=disabled'
    - '-Dglib=disabled'
    - '-Dtests=auto'
    - '--wrap-mode=nodownload'
  dependencies:
    - 'pixman/0.46.4'
    - 'libpng/1.6.58'
    - 'freetype/2.14.3'
    - 'zlib/1.3.1.1'
  cc: clang

patches_applied:
  - 'patches/0001-fix-cairo-tmpfile-prefer-TMPDIR.patch'
  - 'patches/0002-fix-cairo-tmpfile-mkstemp-fallback.patch'

knowledge_gained:
  - 'Cairo 的 named image cases 由一个 Meson test runner 执行；meson test --list 不代表内部用例数'
  - 'headless OHOS 验证用 CAIRO_TEST_TARGET=image；disabled X backends 不计入适配范围'
  - '库 libcairo.so.2、头 include/cairo/ → includedirs=["include/cairo","include"]'
  - 'Meson install 改写 libcairo RPATH 会破坏 linker signature；缺少签名工具时恢复 build-tree ELF'
  - '远端 zlib 非-PIC 静态链不进 libcairo.so → 用本仓 fPIC 版 zlib'
  - 'cairo 源码使用官方 cairographics.org .xz；仅复用 SHA-256 匹配的设备暂存副本'
  - 'Fontconfig is disabled after the OHOS loader rejected its Conan-cache shared library; FreeType remains enabled'
