package: cairo/1.18.2
homepage: https://www.cairographics.org/

# The recipe runs the three non-slow Meson checks from build(). The
# cairo-test-suite case runner is in Meson's slow suite; its separately
# attempted image-target run and partial case counts are recorded in notes.md.
upstream_test_in_build: true
upstream_test_command: "CAIRO_TEST_TARGET=image CAIRO_TEST_TIMEOUT=300 meson test --no-rebuild --no-suite=slow --num-processes 1 --verbose --timeout-multiplier 0 --print-errorlogs -C <build-folder>"
upstream_tests:
  - "3 non-slow checks: documentation syntax, public headers, and preprocessor syntax (3/3 on OHOS)"
  - "Cairo image-target case runner was attempted separately; see notes.md for partial 1,094-outcome result"

test_package_tests:
  - file: test.c
    description: "Draw opaque red into an image surface and verify the ARGB32 pixel through the public Cairo API"
    command: "self.run with conanrun, LD_LIBRARY_PATH and LD_PRELOAD set to the tested Conan packages"

assertion_count: 2
