# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--buildtype=release"
    - "-Dxlib=disabled"
    - "-Dxcb=disabled"
    - "-Dquartz=disabled"
    - "-Dgtk2-utils=disabled"
    - "-Dtests=disabled"
    - "-Dglib=disabled"
    - "-Dsymbol-lookup=disabled"
    - "--wrap-mode=nofallback"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "pixman/0.46.4"
    - "fontconfig/2.16.0"
    - "freetype2/26.1.20"
    - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

