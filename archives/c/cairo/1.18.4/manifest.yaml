version: '1.18.4'
status: built
build_date: '2026-07-07'

source:
  url: 'https://cairographics.org/releases/cairo-1.18.4.tar.xz'
  sha256: '445ed8208a6e4823de1226a74ca319d3600e83f6369f99b14265006599c32ccb'
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - '-Dpng=enabled'
    - '-Dfreetype=enabled'
    - '-Dfontconfig=enabled'
    - '-Dzlib=enabled'
    - '-Dxlib=disabled'
    - '-Dxcb=disabled'
    - '-Dxlib-xcb=disabled'
    - '-Dquartz=disabled'
    - '-Ddwrite=disabled'
    - '-Dlzo=disabled'
    - '-Dspectre=disabled'
    - '-Dsymbol-lookup=disabled'
    - '-Dglib=disabled'
    - '-Dtests=disabled'
    - '--wrap-mode=nodownload'
  dependencies:
    - 'pixman/0.46.4'
    - 'libpng/1.6.58'
    - 'freetype/2.14.3'
    - 'fontconfig/2.18.1'
    - 'zlib/1.3.1.1'
  cc: clang

patches_applied: []

knowledge_gained:
  - '纯 conan 图：各依赖独立包 --requires'
  - '库 libcairo.so.2、头 include/cairo/ → includedirs=["include/cairo","include"]'
  - 'meson ar 注入 native file；有依赖 → install 重写 rpath 破坏自签 → package() 后重签'
  - '远端 zlib 非-PIC 静态链不进 libcairo.so → 用本仓 fPIC 版 zlib'
  - 'cairo 源码改用 cairographics.org .xz + source() 优先预推暂存件（gitlab 47MB 归档设备下载超时）'
  - 'DT_NEEDED: libpng16.so.16/libfontconfig.so.1/libfreetype.so.6/libpixman-1.so.0/libc.so'
