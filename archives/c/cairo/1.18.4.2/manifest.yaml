version: "1.18.4.2"
software: "cairo"
status: built
build_date: "2026-09-10"
build_system: meson

source:
  url: "https://cairographics.org/releases/cairo-1.18.4.tar.xz"
  sha256: "445ed8208a6e4823de1226a74ca319d3600e83f6369f99b14265006599c32ccb"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dpng=enabled"
    - "-Dfreetype=enabled"
    - "-Dfontconfig=enabled"
    - "-Dzlib=enabled"
    - "-Dxlib=disabled"
    - "-Dxcb=disabled"
    - "-Dxlib-xcb=disabled"
    - "-Dquartz=disabled"
    - "-Ddwrite=disabled"
    - "-Dlzo=disabled"
    - "-Dspectre=disabled"
    - "-Dsymbol-lookup=disabled"
    - "-Dglib=disabled"
    - "-Dtests=auto"
    - "--wrap-mode=nodownload"
  dependencies:
    - "pixman/0.46.4"
    - "libpng/1.6.58"
    - "freetype/2.14.3"
    - "fontconfig/2.18.1.1"
    - "zlib/1.3.1.1"
  cc: clang

patches_applied:
  - "patches/0001-fix-cairo-tmpfile-prefer-TMPDIR.patch"
  - "patches/0002-fix-cairo-tmpfile-mkstemp-fallback.patch"

knowledge_gained:
  - "Same upstream 1.18.4 tarball rebuilt as 1.18.4.2 adaptation fix (R37 suffix)"
  - "Meson single cairo-test-suite via meson test; optional ps/pdf/svg helpers only gate surface checks"
  - "Meson native file needs absolute llvm-ar/llvm-ranlib from compiler dir"
  - "meson install rewrites rpath so package() must re-sign .so for OHOS XPM"
  - "TMPDIR-aware tmpfile patches required for OHOS task-private tmp (O_TMPFILE + mkstemp fallback)"
