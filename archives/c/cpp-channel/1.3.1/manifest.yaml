# 版本级 manifest — cpp-channel 1.3.1

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.1"

# 软件名
software: "cpp-channel"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档）
  url: "https://github.com/andreiavrammsd/cpp-channel/archive/refs/tags/v1.3.1.tar.gz"

  # 源码校验和（v1.3.1 tag，上游官方 tag ef127e6be9bd64b9003ff2daf3d2729ddb8891fa）
  sha256: "65899b67746f0c789e2d84fd37123bf569e4db6550802ced18e80d4790ab6720"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）——header-only 库，无第三方依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（header-only 库，无补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
