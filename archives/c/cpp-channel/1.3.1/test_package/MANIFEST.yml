# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cpp-channel/1.3.1
homepage: "https://github.com/andreiavrammsd/cpp-channel"

# 上游构建系统为 CMake；测试通过 googletest (release-1.12.1) 由
# FetchContent 拉取，CPP_CHANNEL_BUILD_TESTS=ON 时构建。
upstream_check_command: "cmake -DCPP_CHANNEL_BUILD_TESTS=ON . && make -j1 && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（3 个 googletest 可执行文件）
upstream_tests:
  - file: tests/channel_test.cpp
    source: cpp-channel-1.3.1/tests/channel_test.cpp
    description: "Channel push/read/static/traits 行为测试"
    command: "./channel_test"
  - file: tests/blocking_iterator_test.cpp
    source: cpp-channel-1.3.1/tests/blocking_iterator_test.cpp
    description: "阻塞输入迭代器行为测试"
    command: "./blocking_iterator_test"
  - file: tests/storage_test.cpp
    source: cpp-channel-1.3.1/tests/storage_test.cpp
    description: "queue/vector/array 存储类型化测试"
    command: "./storage_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：实际调用 msd::channel / static_channel API（write/read/close/drained）"
    command: "./test_cpp-channel"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15