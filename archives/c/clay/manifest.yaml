# 软件级 manifest
# 文件位置: archives/c/clay/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: clay

# 显示名
display: "Clay"

# 一句话描述
description: "高性能 2D UI 布局库（单头文件，零依赖）"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: gfx

# 官网 URL
homepage: "https://github.com/nicbarker/clay"

# 开源许可证（SPDX 标识）
license: Zlib

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "单头库：clay_impl.c 单编译单元承载 CLAY_IMPLEMENTATION → libclay.a，消费者 link clay::clay 即用"
    - "clay.h C 模式 CLAY__INIT 是复合字面量、C++ 模式是裸 type——消费者 C 代码用 (type){...} 语法"
    - "MeasureText 回调必须注册（Clay_SetMeasureTextFunction）否则 CLAY_TEXT 运行时报错"
    - "渲染器无关：输出 render command 数组，天然 headless 可测（断言 SCISSOR 对/固定宽等契约）"
    - "测试二进制运行需 E077 签名"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.14":
    status: built
    build_date: 2026-09-19
