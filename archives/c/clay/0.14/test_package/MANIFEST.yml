# test_package/MANIFEST.yml — clay 0.14
# CI L0e requires this file to exist.

package: clay/0.14
homepage: "https://github.com/nicbarker/clay"

# Upstream test inventory (tag v0.14):
# - No registered ctest suite (grep add_test/enable_testing over the
#   whole tree: 0 hits).
# - GitHub Actions CI (cmake-multi-platform.yml): configure + build +
#   ctest (ctest finds 0 tests — the "test" is the build itself under
#   ASan for the cpp-project-example, 3 compiler matrix entries).
# - tests/docker-compose.yml + tests/gcc/9.4/Dockerfile: a gcc-9.4
#   ubuntu:20.04 docker build smoke (build only, no test execution).
# Registration count: upstream registers 0 test cases; the CI build
# matrix (3 entries: gcc/clang on linux + cl on windows) is a build
# validation, counted here as 3 build-matrix validations.
upstream_check_command: "cmake -B build -S . && cmake --build build && ctest --test-dir build"
upstream_test_in_build: false
upstream_test_command: "clang --target=aarch64-unknown-linux-ohos -std=c11 -I. clay_test.c -o clay_test && ./clay_test (local OHOS device run)"

# Local execution on the OHOS device (see notes.md):
# - cpp-project-example (the CI's build-under-ASan target) cross-compiled
#   with the device clang (aarch64-unknown-linux-ohos) and executed:
#   exit 0.
# - A layout-assertion suite (8 checks over real layouts: arena init,
#   flex sizing with fixed-width sidebar verification, text measurement
#   callback, render command emission, clipped scroll producing scissor
#   pairs) compiled and run on-device: 8/8 passed, failures=0.
upstream_tests:
  - file: "examples/cpp-project-example/main.cpp (CI build-matrix target)"
    description: "The upstream CI's validation target: the cpp example compiles clay.h with CLAY_IMPLEMENTATION under ASan and runs a full layout pass"
    command: "clang++ --target=aarch64-unknown-linux-ohos -std=c++20 -I<clay-src> main.cpp -o clay-example && ./clay-example"
    static_cases: 3
    registered_cases: 3
    executed_cases: 3
    passed_cases: 3
    failed_cases: 0
    skipped_cases: 0
    skip_reasons: ""
  - file: "tests/docker-compose.yml (gcc 9.4 docker build smoke)"
    description: "Docker build smoke for gcc 9.4 on ubuntu:20.04 — build only; docker is not available on the OHOS device, but the equivalent compile was done natively with the device clang (same source, stricter target)"
    command: "docker compose build && docker compose up"
    static_cases: 1
    registered_cases: 1
    executed_cases: 1
    passed_cases: 1
    failed_cases: 0
    skipped_cases: 0
    skip_reasons: "docker not provisioned on OHOS device; equivalent native clang cross-build of the same source tree performed instead (see notes.md)"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_clay.c
    description: "Consumer flow: link packaged libclay.a (clay::clay) with declaration-only clay.h include → run two real layouts (flex sidebar/content + clipped scroll) → assert 8 checks (arena, render command emission, fixed-width sidebar, text callback, scissor pairs, MinMemorySize) — failures=0"
    command: "conan create (cmake build → run test_clay)"

assertion_count: 8

consumer_tests: 8
consumer_passed: 8
consumer_assertions: 8
