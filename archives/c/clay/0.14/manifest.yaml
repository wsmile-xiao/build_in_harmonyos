# 知识沉淀
# ============================================================

knowledge_gained:
  - "clay 0.14 is a single-header library (clay.h, ~4.4k LOC, zero deps, no libc requirement): the recipe instantiates the required CLAY_IMPLEMENTATION TU (clay_impl.c) into libclay.a so consumers get a regular linkable target"
  - "upstream has no registered test suite (0 add_test): GitHub Actions CI validates via build matrix (cpp-project-example under ASan); tests/ is a docker build smoke for gcc 9.4"
  - "clay.h C-mode quirks: CLAY__INIT(type) expands to (type) compound literals in C and bare type in C++ — consumer test code must use the C form; Clay_TextRenderData field is stringContents (not string); MeasureText callback takes Clay_StringSlice"
  - "CLAY_TEXT requires the consumer to register a measure-text callback (Clay_SetMeasureTextFunction) — otherwise a runtime error is reported through the error handler (upstream example itself triggers this informational path)"
  - "clipped scrolling containers (.clip = {horizontal,vertical}) emit CLAY_RENDER_COMMAND_TYPE_SCISSOR_START/END pairs — asserted in the consumer test"

