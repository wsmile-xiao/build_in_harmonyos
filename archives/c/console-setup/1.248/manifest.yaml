# 版本级 manifest — console-setup 1.248
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.248"

# 软件名
software: console-setup

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

