  dependencies:
    - "kbd/2.9.0"

  # 编译器
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# shebang 适配（13 个 perl 脚本 #!/usr/bin/perl[ ] → #!/usr/bin/env perl，
# 上游 shebang 带尾随空格需正则容忍）——conanfile build() 内 python 正则
# 实现，非独立补丁文件
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - category: L1
    content: "Debian native 纯脚本包的大体量构建期产物（744 个 psf.gz，-j4 约 3min）在 conan build() 内真实 make 生成的 OHOS 模式：上游 Makefile 顶层 '.'/~ 宏重定义为 maindir（子 Makefile 目标带 $./ 前缀、顶层目标名被重定义），字体规则在 Fonts/ 子 Makefile 自包含（fntdir 自锚定）——conanfile 用 make -C Fonts gzipped-linux-fonts -j4 直达子目录目标避免顶层目标名歧义；make -j jobserver 在 OHOS mkfifo 报 Operation not permitted 但不阻塞（make 回退串行 jobserver 语义，-j4 进程并行实测正常）"
    reason: "Fonts/Makefile fntdir/目标结构核对 + 744 字体 -j4 全量构建实测 + mkfifo 告警观测"
  - category: L1
    content: "perl shebang 尾随空格陷阱：上游 console-setup 的 perl 脚本 shebang 为 #!/usr/bin/perl␣（od 复核 16 字节，perl 后带 1 个空格）——精确字符串替换 #!/usr/bin/perl\\n 静默不命中，导致 make 执行 bdf2psf 报 'No such file or directory'（ENOENT 实为内核解析 shebang 解释器失败，非文件缺失）；必须用正则 ^#!\\s*/usr/bin/perl[ \\t]*\\n 容忍行尾空白，且构建后断言首行已改写"
    reason: "od -c 首行字节复核 + dryrun Error 126 复现 + 正则替换后 RC=0 验证"
  - category: L1
    content: "ckbcomp（perl 键图编译器）的 installdir 自解析布局约定：$installdir=${0%/*} 去尾 /bin、ckbcomp 与 setupcon 同逻辑（ckbcomp L42-50 / setupcon L389-394）——conan 包按上游 /usr 前缀映射（bin/ + share/consolefonts/ + share/consoletrans/ + etc/console-setup/（含 ckb 数据与 compose/dkey inc）+ etc/default/），零硬编码 patch；ckb 数据必须放 etc/console-setup/ckb（ckbcomp @xdirs L53-54 为 /etc/console-setup/ckb 与 $installdir/etc/console-setup/ckb，包布局 $pkg=/usr 时重合，share 路径不在 @xdirs 中——首次按 share 布局 ckbcomp 报 'Can not find file rules/base' RC=2 验证）；完整 ckbcomp 不消费 charmap_functions.sh/ekmap（那是 ckbcomp-mini 路径），compose/dkey.*.inc 仅 -compose 选项消费（L4822-4844 $installdir/etc/console-setup/ 回退）"
    reason: "ckbcomp/setupcon installdir 推导段全文核对 + 完整包布局实测 ckbcomp us 生成 108 行 keycode"
  - category: L1
    content: "构建期 vs 运行期键图编译的成本取舍：kbdcompiler 单模型 >5min（OHOS 上 290s timeout 超时，5 模型 >25min 超 CI 预算）不可用于构建期预生成 ekmap；ckbcomp 运行期 -I<ckb> 0.68s/布局等价生成（-I 后无空格，带空格被拆两参数报 no ACM）——ekmaps 不预生成、由运行期 ckbcomp 按需生成记为环境边界"
    reason: "kbdcompiler 290s 超时实测 + ckbcomp -I 运行期 0.678s/142 行输出实测"
  - category: L1
    content: "setupcon 的 tempfile 是 shell 内建函数（L64 定义，mktemp 回退）非 debianutils 外部命令、setupcon/ckbcomp 全文无 dpkg 消费——与 console-common（install-keymap 调 tempfile + dpkg --print-architecture）不同，console-setup 只声明 kbd（loadkeys/setfont/kbd_mode），gzip/zcat 为 OHOS 基础系统不声明；依赖归属必须按脚本全文 system()/backtick/函数定义核对，勿凭与同生态包的类比惯性声明"
    reason: "setupcon L64 函数定义 + 外部命令 grep 全文核对 + console-common 对照"
