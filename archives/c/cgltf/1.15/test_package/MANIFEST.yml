# test_package/MANIFEST.yml
package: cgltf/1.15
homepage: "https://github.com/jkuhlmann/cgltf"

upstream_check_command: "clang++ -std=c++11 -I<src> test/test_math.cpp libcgltf.a -o test_math && ./test_math"
upstream_test_in_build: true
upstream_test_command: "./test_math && ./test_strings && ./test_write && ./test_write_glb"

upstream_tests:
  - file: test_math.cpp
    source: cgltf-1.15/test/test_math.cpp
    description: >-
      Upstream math utility tests. Self-contained, no external data needed.
      Compiled and executed inside build().
    command: "./test_math"
  - file: test_strings.cpp
    source: cgltf-1.15/test/test_strings.cpp
    description: >-
      Upstream string utility tests. Self-contained.
    command: "./test_strings"
  - file: test_write.cpp
    source: cgltf-1.15/test/test_write.cpp
    description: >-
      Upstream glTF write tests. Self-contained.
    command: "./test_write"
  - file: test_write_glb.cpp
    source: cgltf-1.15/test/test_write_glb.cpp
    description: >-
      Upstream GLB write tests. Self-contained.
    command: "./test_write_glb"
  - file: main.c
    source: cgltf-1.15/test/main.c
    description: >-
      Main cgltf_test program. Requires external glTF-Sample-Models repo
      (git clone). NOT executed — declared per gulkan #7121 pattern.
    command: "NOT_EXECUTED (requires external data)"
  - file: test_conversion.cpp
    source: cgltf-1.15/test/test_conversion.cpp
    description: >-
      Conversion tests. Requires external glTF-Sample-Models repo.
      NOT executed — declared per gulkan #7121 pattern.
    command: "NOT_EXECUTED (requires external data)"

test_package_tests:
  - file: test.c
    description: >-
      Consumer-side API validation: parses a minimal valid glTF 2.0 JSON
      string via cgltf_parse(), verifies asset.version == "2.0", calls
      cgltf_free(). Returns non-zero on any failed check.
    command: "./test_cgltf"

assertion_count: 3
