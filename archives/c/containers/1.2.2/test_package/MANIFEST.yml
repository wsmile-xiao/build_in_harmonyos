# test_package/MANIFEST.yml
# containers 1.2.2 — 上游官方测试声明
# 依据: 上游 tst/ 目录, Makefile test_optimized 目标
#   make test_optimized = gcc src/*.c tst/*.c -Wall -Wextra -Wpedantic
#                        -Werror -std=c89 -O3 -ldl -o ContainersTest
# OHOS 适配: 本机无 gcc, 用 clang 等价编译(见 notes.md):
#   clang src/*.c tst/*.c -Wall -Wextra -Wpedantic -Werror \
#     -Wno-tautological-constant-out-of-range-compare -fsigned-char \
#     -std=c89 -O3 -ldl -o ContainersTest

package: containers/1.2.2
homepage: "https://github.com/bkthomps/Containers"

# 上游测试命令 (用于分析)
upstream_check_command: "make test_optimized"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "clang src/*.c tst/*.c -Wall -Wextra -Wpedantic -Werror -Wno-tautological-constant-out-of-range-compare -fsigned-char -std=c89 -O3 -ldl -o ContainersTest && ./ContainersTest"

# 上游实际运行的测试程序 (16 个独立用户用例, 单二进制)
upstream_tests:
  - file: tst/test.c
    source: containers-1.2.2/tst/test.c
    description: "测试驱动主程序 (main), 调用 16 个独立用户测试函数"
    command: "./ContainersTest"
  - file: tst/test_set.c
    source: containers-1.2.2/tst/test_set.c
    description: "set (AVL 树) 用户测试 — 含树结构递归校验 set_verify_recursive"
    command: "./ContainersTest"
  - file: tst/test_map.c
    source: containers-1.2.2/tst/test_map.c
    description: "map 用户测试"
    command: "./ContainersTest"
  - file: tst/test_vector.c
    source: containers-1.2.2/tst/test_vector.c
    description: "vector 用户测试"
    command: "./ContainersTest"
  - file: tst/test_array.c
    source: containers-1.2.2/tst/test_array.c
    description: "array 用户测试"
    command: "./ContainersTest"
  - file: tst/test_deque.c
    source: containers-1.2.2/tst/test_deque.c
    description: "deque 用户测试"
    command: "./ContainersTest"
  - file: tst/test_forward_list.c
    source: containers-1.2.2/tst/test_forward_list.c
    description: "forward_list 用户测试"
    command: "./ContainersTest"
  - file: tst/test_list.c
    source: containers-1.2.2/tst/test_list.c
    description: "list 用户测试"
    command: "./ContainersTest"
  - file: tst/test_multiset.c
    source: containers-1.2.2/tst/test_multiset.c
    description: "multiset 用户测试"
    command: "./ContainersTest"
  - file: tst/test_multimap.c
    source: containers-1.2.2/tst/test_multimap.c
    description: "multimap 用户测试"
    command: "./ContainersTest"
  - file: tst/test_unordered_set.c
    source: containers-1.2.2/tst/test_unordered_set.c
    description: "unordered_set 用户测试"
    command: "./ContainersTest"
  - file: tst/test_unordered_map.c
    source: containers-1.2.2/tst/test_unordered_map.c
    description: "unordered_map 用户测试"
    command: "./ContainersTest"
  - file: tst/test_unordered_multiset.c
    source: containers-1.2.2/tst/test_unordered_multiset.c
    description: "unordered_multiset 用户测试"
    command: "./ContainersTest"
  - file: tst/test_unordered_multimap.c
    source: containers-1.2.2/tst/test_unordered_multimap.c
    description: "unordered_multimap 用户测试"
    command: "./ContainersTest"
  - file: tst/test_stack.c
    source: containers-1.2.2/tst/test_stack.c
    description: "stack 用户测试"
    command: "./ContainersTest"
  - file: tst/test_queue.c
    source: containers-1.2.2/tst/test_queue.c
    description: "queue 用户测试"
    command: "./ContainersTest"
  - file: tst/test_priority_queue.c
    source: containers-1.2.2/tst/test_priority_queue.c
    description: "priority_queue 用户测试"
    command: "./ContainersTest"

# 汇总: source_declared_total=16 (独立用户用例), executed_passed=16, 16/16 (100%)

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者用例: vector_add_last/get_at + set_add/contains + stack LIFO, 断言可观察结果"
    command: "./test_containers"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40