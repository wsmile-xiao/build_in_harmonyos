# 版本级 manifest — containers 1.2.2
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2.2"
software: "containers"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag 归档）
  url: "https://github.com/bkthomps/Containers/archive/refs/tags/v1.2.2.tar.gz"

  # 源码校验和（对应上述 URL 实际字节）
  sha256: "2697da2d4399dbeb999f18d78032a319e8dd19fb13f36872d2c39f578a595c70"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表（本库原始 Makefile，无 configure）
  configure_options: []
  # clang src/*.c -c -O3 -fPIC -fsigned-char -Wno-tautological-constant-out-of-range-compare
  # ar rcs containers.a *.o

  # 编译依赖列表（无第三方依赖，仅 libc）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁；适配通过编译器标志实现）
patches_applied: []
# -fsigned-char: OHOS AArch64 char 默认无符号 → 恢复 AVL 平衡因子 -1/0/1 语义
# -Wno-tautological-constant-out-of-range-compare: clang 特有诊断（gcc 无）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS AArch64 上 char 默认为无符号：AVL/平衡因子 (-1/0/1) 存于 char 的 C 库需 -fsigned-char 恢复上游语义，否则树结构校验断言失败"
  - "上游 Makefile 测试目标硬编码 gcc：OHOS 仅 clang 时用等价 clang 编译（同 -std=c89 -Werror 严格度）代替"
  - "原始 Makefile 产物无 lib 前缀（containers.a）：Conan 包安装时须重命名 libcontainers.a 供 CMake find_library 消费"