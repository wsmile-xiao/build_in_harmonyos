# test_package/MANIFEST.yml
# 上游官方测试声明文件 — cmsis-dsp 1.18.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cmsis-dsp/1.18.0
homepage: "https://github.com/ARM-software/CMSIS-DSP"

# 上游测试命令 (Testing/ 目录, desc.txt 驱动, 非 make check)
upstream_check_command: "python3 preprocess.py -f desc.txt && python3 processTests.py -e && cmake -S Testing -B build && make -C build && ./build/test"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (双口径详表见 reports/test-enumeration-ledger.md)
# 默认配置(desc.txt): 1527/1527 通过; F16 配置: 304/304 通过; NEON 变体被上游模式数据缺口阻塞
upstream_tests:
  - file: Testing/Source/Tests/BasicTestsF32.cpp
    source: cmsis-dsp-1.18.0/Testing/Source/Tests/BasicTestsF32.cpp
    description: "基础数学函数 F32 套件（TEST_ADD_F32_1..N 等独立用例）"
    command: "./test (EMBEDDED, desc.txt 注册集)"
  - file: Testing/Source/Tests/StatsTestsF32.cpp
    source: cmsis-dsp-1.18.0/Testing/Source/Tests/StatsTestsF32.cpp
    description: "统计函数 F32 套件"
    command: "./test (EMBEDDED, desc.txt 注册集)"

# test_package 中自带的测试 (消费者视角验证, R34 实质调用公开 API)
test_package_tests:
  - file: test.c
    description: "消费者测试：arm_dot_prod_f32 / arm_sqrt_f32 / arm_mean_f32 数值断言"
    command: "./test_cmsis-dsp"

# 测试断言总数 (test.c 4 组数值断言 + 上游用例见台账)
assertion_count: 4