# 上游缺陷修复：tinyhashmap64.h 首次分配 new_max 用了 16（非 2^n-1 掩码），
# 探测掩码 i &= maxlen 只产生槽 0/16，插入两个字符串键后探测缺失键会死循环
# （上游 test_hmap64 挂死）。上游 32 位版用 15 正确，64 位版笔误。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "纯 header-only C 库（tinybuf.h/tinyhashmap.h/tinyhashmap64.h）无构建系统，用 header-only 形态配方：package() 只拷贝 *.h 到 include、package_id 清空为单一 id、package_info 置空 libs/bindirs；R34 消费者用例必须 include 全部公开头并实际调用宏 API 断言可观察结果（复用 E321/E257/E307 已有知识，ref: E321,E257,E307）"
- "上游 c-data-structures 无 release tag，conandata.yml 源 URL 须用 GitHub commit snapshot 归档（archive/<sha>.tar.gz），版本号按快照 commit 前缀命名（0.0-git0c2d777456），sha256 以实际下载 tarball 为准（ref: DRAFT-c-data-structures-tinyhashmap64-probe-mask 同批记录）"
- "tinyhashmap64.h 的上游缺陷：hmap64__grow 首次分配 new_max=16 不是 2^n-1 全 1 掩码，探测循环 i &= maxlen 只会命中槽 0/16，两个以上不同低位取模碰撞键会导致线性探测死循环（test_hmap64 挂死、VmSize 暴涨）；修复为 15（与 32 位版 tinyhashmap.h 一致）即可，跑 -O0/-O2 全量 test.c 验证（ref: DRAFT-c-data-structures-tinyhashmap64-probe-mask）"
