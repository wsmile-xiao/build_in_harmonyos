# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: c-data-structures/0.0-git0c2d777456
homepage: "https://github.com/schellingb/c-data-structures"

# 上游无 make/ctest/meson：header-only 库，官方唯一测试入口为
#   cc -O2 -Wall test.c && ./a.out
upstream_check_command: "cc -O2 -Wall test.c && ./a.out"

# conanfile.py build() 方法中是否已集成上游测试（header-only 无 build）
upstream_test_in_build: false
upstream_test_command: "cc -O2 -Wall test.c && ./a.out"

# 上游实际运行的测试程序（独立 test.c，main 调用三个用例函数）
upstream_tests:
  - file: test.c
    source: c-data-structures-0c2d7774560f7c59a839d4e0162e350b63629579/test.c
    description: "官方自检：test_buf（动态数组增删改插）、test_hmap（32位键哈希表）、test_hmap64（64位键哈希表）"
    command: "./a.out"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：仅通过安装后的公开头文件 tinybuf.h / tinyhashmap.h / tinyhashmap64.h 调用宏 API 并断言可观察结果"
    command: "./test_c-data-structures"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 26
