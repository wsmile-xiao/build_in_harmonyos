build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTS=OFF"
    - "-DBUILD_SAMPLES=OFF"
    - "-DCPPREST_EXCLUDE_BROTLI=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
