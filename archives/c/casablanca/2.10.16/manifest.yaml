  - "0004-Release-cmake-cpprest_find_boost.cmake.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMake 不识别 HarmonyOS 平台，需要创建 Platform/HarmonyOS.cmake 继承 Linux.cmake"
  - "clang++ 缺少 libc++ 头文件路径，需要创建 toolchain 文件指向 OHOS SDK 的 libcxx-ohos"
  - "OHOS sysroot 的 pthread.h 有 pthread_cond_clockwait，但 /usr/local/include/pthread.h (musl) 没有，需要用 -I 确保 sysroot headers 优先"
  - "CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY 导致 FindThreads 错误存储 -lpthreads (带 s)，实际库名是 pthread"
  - "boost 1.87.0 未编译 boost_thread 库，但 casablanca 只用 header-only 部分 (condition_variable, mutex)"

