# test_package/MANIFEST.yml
package: csv-parser/1.1
homepage: "https://github.com/p-ranav/csv"

upstream_check_command: "cd test && cmake . && make && ./test_csv"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/main.cpp
    source: csv-1.1/test/main.cpp
    description: "上游单元测试 (基于 Catch2)"
    command: "./test_csv"

test_package_tests:
  - file: test.cpp
    description: "消费者测试: 创建CSV文件并验证解析结果"
    command: "./test_csv-parser"

assertion_count: 4
