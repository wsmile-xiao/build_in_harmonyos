software: cdpr
display: "cdpr"
description: "Cisco Discovery Protocol 监听解码工具"
category: network
homepage: "https://cdpr.sourceforge.net/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 硬编码 gcc, 用 CC 变量替换后可接 Conan 工具链编译器"
    - "cdpr.h 全局变量改 extern + cdpr.c 单一定義, 兼容 -fno-common (gcc10+/clang 默认)"
    - "依赖 libpcap/1.10.6, 从 Conan 依赖取 -I/-L/-l (dhcpdump 先例)"
    - "命令行工具: 软件级 commands.json 声明 (R38)"
  common_dependencies:
    - libpcap

versions:
  "2.4":
    status: built
    build_date: "2026-09-06"
