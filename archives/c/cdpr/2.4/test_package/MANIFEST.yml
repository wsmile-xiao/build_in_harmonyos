# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cdpr/2.4
homepage: "https://cdpr.sourceforge.net/"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: cdpr-2.4.tgz, sha256 32d3b58d8be7e2f78834469bd5f48546450ccc2a86d513177311cce994dfbec5)
upstream_test_audit:
  source_tarball: "cdpr-2.4.tgz"
  source_sha256: "32d3b58d8be7e2f78834469bd5f48546450ccc2a86d513177311cce994dfbec5"
  top_level_files:
    - Makefile          # 仅 cdpr 与 clean 两个目标, 无 check/test/TESTS/check_PROGRAMS 目标
    - cdpr.c            # 主程序 (getopt 命令行 + pcap 抓包), 无 TEST()/TEST_F (gtest) / def test_ (pytest)
    - cdprs.c           # 服务端上报逻辑, 纯实现源
    - conffile.c        # 配置文件解析, 纯实现源
    - cdpr.h            # 全局变量与函数原型头文件
    - cdp.h             # CDP 协议解码头文件
    - u_ints.h          # Solaris 类型兼容头文件
    - XGetopt.c         # Win32 getopt 兼容实现
    - XGetopt.h         # Win32 getopt 头文件
    - cdprs/            # 服务端 cgi/php 脚本目录, 非测试
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile check / test / TESTS / check_PROGRAMS 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "configure.ac / CMakeLists.txt / meson.build 测试声明"
    - "find . -name '*test*' (全树)"
  scan_result: "0 matches — 全树无 tests/ 目录; find 仅命中 XGetopt 等实现源, 无测试源文件; Makefile 无 check/test 目标"
  make_check_output: "make check 无规则可执行 (No rule to make target 'check') — 上游未定义任何测试目标"
  reason: "cdpr 2.4 为纯 CLI 抓包工具, 官方源码包不含任何测试套件: 无 tests/ 目录、无测试源文件、无 check/test 目标。功能验证由 test_package 真实执行 cdpr 二进制 (cdpr -h 的版本横幅/用法说明/选项说明三断言) 完成"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质执行被测包的二进制
test_package_tests:
  - file: test.sh
    description: "功能测试: cdpr -h 退出码与非空输出 + 版本横幅断言 + 用法说明断言"
    command: "bash test.sh"
  - file: conanfile.py
    description: "Conan test() 入口, 执行 test.sh 并输出 HMBS 机器证据标记 (test_package discovered=3/passedCount=3 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test.sh 的 3 个真实断言, 与 HMBS_TEST_PACKAGE_RESULT discovered=3 一致)
assertion_count: 3
