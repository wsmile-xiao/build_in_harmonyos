software: chinadns-c
# 版本级 manifest
# 文件位置: archives/c/chinadns-c/1.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.3.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"

# 构建系统标识（verify-build 要求）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub 官方 tag 源，R39）
  url: "https://github.com/clowwindy/ChinaDNS-C/archive/refs/tags/1.3.2.tar.gz"

  # 源码校验和
  sha256: "c7ee94f84844069a1c2aa240c9468ff6567d67e42e5a419db936b1d5ae831532"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 构建系统标识（verify-build 要求）
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-gnu（configure.ac 无 AC_CANONICAL_*，显式三元组；catdoc 同款）"

  # 编译依赖列表（格式: name/version）——依赖仅 libc，无 Conan 依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（umask 修复直接打在 generated-build 快照的 configure 上，
# patches/0001 为该修复的 diff 留档）
patches_applied:
  - "0001-generated-configure-umask-022.patch（留档：HMDFS E129 修复，实际打在快照 configure 上）"
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 tarball 无 configure（master 分支 autogen.sh 流）——配方携带 generated-build 快照（c-algorithms 同款），CI 无 automake 也能构建"
  - "configure.ac 无 AC_CANONICAL_*：configure 不调用 config.guess，无需 config.guess/config.sub 补丁，仅需 --build 三元组"
  - "autoconf 2.72 生成的 configure 内嵌 umask 077 在 HMDFS 上致 config.status 失败——快照内修为 umask 022（E129）"
  - "OHOS musl libc.so 直接导出 res_query；sysroot libresolv.a 为 8 字节空 archive，-lresolv 探测仍通过（符号解析自 libc.so）"
  - "上游 N=6（tests/ 6 个 dig 集成用例：5 个 A 查询 + x_8888 PTR 反查）——Python 3 移植版 test.py 内嵌 build() 真实运行（boost 同款 rc 判过），本机 conan create 实测 6/6 通过；dig/公网 DNS 不可达时环境限制 SKIPPED"
  - "上游测试为 Python 2 + dig 在线集成测试（.travis.yml 需 dnsutils）——CI 网络受限环境的可行处理：环境探测（dig + UDP 53 探测包）通过才真实运行，否则逐项 SKIPPED 留报告"
