package: csfml/3.0.0
homepage: "https://www.sfml-dev.org/"

upstream_check_command: "ctest --test-dir <build_folder> (CSFML_BUILD_TEST_SUITE=ON, Catch2 3.7.0 + catch_discover_tests)"
upstream_test_in_build: true
upstream_test_command: "cmake.test() -> ctest --test-dir <build_folder> --output-on-failure"

# Baseline: grep -rEc '^[[:space:]]*TEST_CASE' test/<module>/*.test.cpp over the
# official CSFML 3.0.0 tag -> 29 TEST_CASE macros in total, 10 of them in the two
# modules this recipe builds (System 6, Network 4).
upstream_tests:
  - path: test/System/Buffer.test.cpp
    target: test-csfml-system
    case_count: 1
    status: enabled
  - path: test/System/Clock.test.cpp
    target: test-csfml-system
    case_count: 1
    status: enabled
  - path: test/System/Sleep.test.cpp
    target: test-csfml-system
    case_count: 1
    status: enabled
  - path: test/System/Time.test.cpp
    target: test-csfml-system
    case_count: 1
    status: enabled
  - path: test/System/Vector2.test.cpp
    target: test-csfml-system
    case_count: 1
    status: enabled
  - path: test/System/Vector3.test.cpp
    target: test-csfml-system
    case_count: 1
    status: enabled
  - path: test/Network/Ftp.test.cpp
    target: test-csfml-network
    case_count: 1
    status: enabled
  - path: test/Network/Http.test.cpp
    target: test-csfml-network
    case_count: 1
    status: enabled
  - path: test/Network/IpAddress.test.cpp
    target: test-csfml-network
    case_count: 1
    status: enabled
  - path: test/Network/SocketStatus.test.cpp
    target: test-csfml-network
    case_count: 1
    status: enabled
  - path: test/Window/{Joystick,Keyboard,Mouse,Sensor,Window,WindowBase}.test.cpp
    target: test-csfml-window
    case_count: 6
    status: excluded
  - path: test/Graphics/*.test.cpp
    target: test-csfml-graphics
    case_count: 12
    status: excluded
  - path: test/Audio/SoundChannel.test.cpp
    target: test-csfml-audio
    case_count: 1
    status: excluded

excluded_upstream_tests:
  - target: test-csfml-window
    reason: "CSFML_BUILD_WINDOW=OFF: sf::Window needs an EGL/GLES or X11 windowing backend, which the OpenHarmony PC CI image does not expose to a console build."
  - target: test-csfml-graphics
    reason: "CSFML_BUILD_GRAPHICS=OFF: the Graphics module links Window plus FreeType, and its Image/RenderTextures suites load the BMP/GIF/JPG/PSD fixtures through sf::Image, which is unavailable without the disabled module."
  - target: test-csfml-audio
    reason: "CSFML_BUILD_AUDIO=OFF: the Audio module needs an OpenAL-capable audio device; the CI image has no /dev/audio output and no published OpenAL Conan package."

upstream_test_notes:
  - "The upstream suites are built for real: the recipe passes CSFML_BUILD_TEST_SUITE=ON and FETCHCONTENT_SOURCE_DIR_CATCH2 pointing at the pinned Catch2 3.7.0 release, so no git clone happens at build time."
  - "catch_discover_tests registers one CTest entry per TEST_CASE, so ctest reports the 10 enabled cases individually."

coverage:
  enabled: false
  reason: "The OHOS package job does not provide a stable coverage collector for this C++ binding."

test_package_tests:
  - file: test.c
    description: "Consumer C program built with find_package(CSFML) and linked to the csfml-system / csfml-network Conan CMake targets."
    command: "test_csfml"

upstream_total_case_count: 29
upstream_ctest_target_count: 2
upstream_enabled_case_count: 10
upstream_excluded_case_count: 19
assertion_count: 24
