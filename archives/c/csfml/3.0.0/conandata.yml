sources:
  archive: "csfml-3.0.0.tar.gz"
  url: "https://codeload.github.com/SFML/CSFML/tar.gz/refs/tags/3.0.0"
  sha256: "903cd4a782fb0b233f732dc5b37861b552998e93ae8f268c40bd4ce50b2e88ca"

# CSFML 3.0.0 pins `find_package(SFML 3.0 ...)`. The artifact registry only
# publishes sfml/2.6.x, and R36 rejects a dependency that is not published, so
# the C++ core this binding wraps is built from its official 3.0.0 release
# inside this recipe and statically linked into libcsfml-*.so. The package
# itself ships no SFML library, header or CMake target.
bundled_sources:
  sfml:
    archive: "sfml-3.0.0.tar.gz"
    url: "https://codeload.github.com/SFML/SFML/tar.gz/refs/tags/3.0.0"
    sha256: "37506fafbd618b1f8e153bbca8811e62203a70b32a1183279fb9612fd0501d2b"
  catch2:
    archive: "catch2-3.7.0.tar.gz"
    url: "https://codeload.github.com/catchorg/Catch2/tar.gz/refs/tags/v3.7.0"
    sha256: "5b10cd536fa3818112a82820ce0787bd9f2a906c618429e7c4dea639983c8e88"

patches:
  - patch_file: "patches/0001-cmake-Config.cmake-recognize-harmonyos.patch"
    patch_description: "Recognize HarmonyOS as a Linux-compatible platform"
    patch_type: "portability"
  - patch_file: "patches/0002-test-CMakeLists-gate-disabled-modules.patch"
    patch_description: "Gate the Window/Graphics/Audio upstream suites on the modules this recipe builds"
    patch_type: "test"
  - patch_file: "patches/0003-bundled-sfml-cmake-Config.cmake-recognize-harmonyos.patch"
    patch_description: "Recognize HarmonyOS in the bundled SFML 3.0.0 platform detection"
    patch_type: "portability"
