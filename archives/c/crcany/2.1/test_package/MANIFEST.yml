# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: crcany/2.1
homepage: "https://github.com/madler/crcany"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# make test 实际运行的上游测试
# allcrcs-abbrev.txt 共 113 个 CRC 模型定义（以上游仓库该 tag 文件实数为准）；
# crctest 对每个模型做 bit/residue/byte/word/combine 五项校验，再跑生成代码检查。
upstream_tests:
  - file: crctest.c
    source: crcany-2.1/crctest.c
    description: "上游官方校验程序：逐行读模型定义，校验 check 值与 CRC 合并"
    command: "./crctest < allcrcs-abbrev.txt (经由 make test)"
  - file: allcrcs-abbrev.txt
    source: crcany-2.1/allcrcs-abbrev.txt
    description: "上游全部 113 个 CRC 模型定义，上游测试的输入固件"
    command: "make test"
  - file: src/test_src
    source: crcany-2.1/src/test_src (make 过程中由 crcall 生成并编译)
    description: "上游生成代码检查：验证 crcall 生成的 C 代码可编译且行为正确"
    command: "src/test_src (经由 make test)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "链接 libcrcany.a，调用 read_model/process_model/crc_bitwise/crc_bytewise/crc_wordwise/crc_combine，校验 CRC-32/ISO-HDLC 标准向量"
    command: "./test_crcany"

# 测试断言总数 (test.c 内 5 个 PASS 检查)
assertion_count: 5

# 上游测试结论以真机预检日志为准，本机不声明通过率；
# 配方要求 crctest 输出 "-- all good" 且五组计数器全部等于可用模型数，否则构建失败。
upstream_summary: "待真机预检回填（make test 实测计数）"
