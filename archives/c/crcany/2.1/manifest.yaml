version: "2.1"
status: built
build_date: "2026-09-10"

source:
  url: "https://github.com/madler/crcany/archive/refs/tags/v2.1.tar.gz"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  cc: clang

patches_applied: []

knowledge_gained:
  - "crcany 上游是纯 Makefile 项目，无 configure、无 make install；默认目标构建 crcany/crctest/crcall/crcadd/mincrc 与生成式 src/ 目录"
  - "上游测试入口为 make test：逐行喂 allcrcs-abbrev.txt 给 crctest 做 bit/residue/byte/word/combine 五项校验，再跑生成代码检查 src/test_src；checklists 目标才需要联网，test 不需要"
  - "crctest 即使打印 verification failed 仍返回 0，配方必须解析 -- all good 与五组计数器，不能只看退出码"
  - "编译器与归档器路径从 Conan conf 获取，不在配方里裸用 shell 环境变量"
