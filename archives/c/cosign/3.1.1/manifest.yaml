software: cosign
version: "3.1.1"

status: built
build_system: custom
build_date: "2026-06-17"

source:
  url: "https://github.com/sigstore/cosign/archive/refs/tags/v3.1.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux GOARCH=arm64"
    - "GOTOOLCHAIN=local"
  dependencies:
    - golang/1.26.0
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "cosign requires Go >= 1.26.0 due to k8s.io/apimachinery dependency"
  - "Go 1.22.10 is too old for cosign 3.1.1, must use Go 1.26.0"
  - "cosign is a static Go binary (CGO_ENABLED=0), no external dependencies"
  - "go mod tidy required before building cosign due to dependency version updates"
  - "cosign produces single binary from cmd/cosign entry point"
