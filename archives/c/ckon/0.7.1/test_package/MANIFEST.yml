# test_package/MANIFEST.yml — ckon 0.7.1
# CI L0e requires this file to exist.

package: ckon/0.7.1
homepage: "https://github.com/tschaume/ckon"

upstream_check_command: "./autogen.sh && ./configure && make"
upstream_test_in_build: false
upstream_test_command: "test/clone_testdir.sh (manual integration: git clone BesCocktail, then run ckon against it)"

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Runs the installed ckon binary and asserts real behavior: --version prints the version string and --help prints the tool usage (both via boost::program_options parsing)"
    command: "bash test.sh"

assertion_count: 2
