package: cucumber-cpp/0.8.0
homepage: "https://github.com/cucumber/cucumber-cpp"
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - file: tests/unit/RegexTest.cpp
    source: tests/unit/RegexTest.cpp
    description: "Regex matching and submatches"
    command: "ctest -R RegexTest --output-on-failure"
  - file: tests/unit/TableTest.cpp
    source: tests/unit/TableTest.cpp
    description: "Table hashes and columns"
    command: "ctest -R TableTest --output-on-failure"
  - file: tests/integration/WireProtocolTest.cpp
    source: tests/integration/WireProtocolTest.cpp
    description: "Wire protocol commands"
    command: "ctest -R WireProtocolTest --output-on-failure"
test_package_tests:
  - file: test.cpp
    description: "Regex/Table/TagExpression/ContextManager/CukeEngineImpl linkage"
    command: "./test_package"
assertion_count: 5
upstream_tests_exist: true
upstream_test_audit: "tests/ 目录含 ctest 注册的 16 个用例 (14 GMock + 2 drivers), 已在 conanfile.build() 中以 ctest --output-on-failure 实测"
