software: cpluff
display: "cpluff"
description: "C-Pluff, a plug-in framework for C programs"
category: system
homepage: "https://c-pluff.org/"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "以显式 --build/--host triplet 绕过老旧 config.guess 的平台识别问题"
    - "SHELL 指向 bash, 满足 configure 与测试脚本需求"
    - "expat 依赖经 CPPFLAGS/LDFLAGS 注入 (AC_CHECK_LIB 不走 pkg-config)"
    - "上游 make check 套件 (53 用例) 在配方内完整执行"
  common_dependencies:
    - expat

versions:
  "0.2.0":
    status: built
    build_date: "2026-09-10"
