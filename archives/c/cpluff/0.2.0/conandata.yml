sources:
  url: "https://c-pluff.org/downloads/cpluff-0.2.0.tar.gz"
  sha256: "2b769eea5926207232bb715b312caebd5ceeb9be4a086d02a1ac82441c53243a"

patches:
  - patch_file: "patches/0001-guard-framework-lock-no-thread-release.patch"
    patch_description: "Guard cpi_lock/unlock_framework definitions with CP_THREADS/NDEBUG like context.c so Release no-thread build uses no-op macros instead of colliding definitions"
    patch_type: "portability"
  - patch_file: "patches/0002-context-owner-always-defined.patch"
    patch_description: "Keep cpi_context_owner defined in Release no-thread builds; it is declared unconditionally in internal.h and referenced via cpi_debugf in logging.c/pinfo.c/psymbol.c, while the locking helpers stay guarded"
    patch_type: "portability"
