# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cpluff/0.2.0
homepage: "https://c-pluff.org/"

# 上游测试命令 (test/Makefile.am 的 check-local 目标经由顶层 make check 触发)
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (test/tests.txt 登记 53 个用例, 经由 test/testsuite 二进制逐个执行)
upstream_tests:
  - file: test/testsuite
    source: cpluff-0.2.0/test/testmain.c
    description: "上游 C-Pluff Test Suite 主二进制: 依次执行 tests.txt 登记的 53 个用例并打印 OK/FAIL/SKIPPED, 全部通过时打印 ALL OK, 任一失败则 make check 非零退出"
    command: "make check"
  - file: test/tests.txt
    source: cpluff-0.2.0/test/tests.txt
    description: "上游测试用例清单: 53 个用例名, 覆盖版本查询、致命错误处理、初始化销毁、集合管理、插件加载器、日志、插件安装卸载扫描、回调、依赖、扩展点与符号使用"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_cpluff.c
    description: "消费者测试: cp_init 返回 CP_OK、cp_get_version 非空且包含 0.2.0、cp_create_context 与 cp_destroy_context 往返成功, 共 3 个断言"
    command: "./test_cpluff"

# 测试断言总数 (test_package 侧 3 个)
assertion_count: 3

# 审计说明: 上游测试存在且已在配方 build() 中完整接入。
upstream_tests_exist: true
upstream_test_audit: >
  检查范围: 官方发布包 cpluff-0.2.0.tar.gz (c-pluff.org,
  1369314 字节) 与 GitHub 镜像仓库 jlehtine/c-pluff。
  构建文件清点: test/Makefile.am 定义 check-local 目标, 经由
  顶层 make check 触发; test/testsuite 由 psymbolusage.c、extcfg.c、
  pdependencies.c、pcallbacks.c、pscanning.c、pinstallation.c、ploading.c、
  loggers.c、collections.c、ploaders.c、initdestroy.c、fatalerror.c、
  cpinfo.c、testmain.c 编译而成; test/tests.txt 登记 53 个用例
  (getversion、gethosttype、fatalerrordefault 等, 以换行分隔逐行计数);
  另有 test/test-* 包装脚本与 expected/、plugins/、pcollections/ 参照数据。
  非空跑说明: check-local 对每个用例执行 testsuite 二进制并按退出码
  判定 OK/FAIL/SKIPPED, 失败计数非零则 make check 非零退出;
  桩实现无法通过插件扫描与符号解析, 不存在静默跳过路径
  (SKIPPED 仅对 77 退出码计数, 本套件无此分支)。
  结论: 上游存在 53 个测试用例, 配方 build() 以 make check
  真实完整执行, 成功即 53/53 通过。
