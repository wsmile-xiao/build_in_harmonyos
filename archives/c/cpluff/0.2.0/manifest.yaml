# 版本级 manifest — cpluff 0.2.0
# 文件位置: archives/c/cpluff/0.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: cpluff
version: "0.2.0"

# 编译状态: built (工作树待真机预检, 通过前不提交)
status: built

# 编译日期 (YYYY-MM-DD)
build_date: "2026-09-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源 (R39)
  url: "https://c-pluff.org/downloads/cpluff-0.2.0.tar.gz"

  # 源码校验和 (两端各自下载核对一致, 1369314 字节)
  sha256: "2b769eea5926207232bb715b312caebd5ceeb9be4a086d02a1ac82441c53243a"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--disable-nls"
    - "--without-readline"
    - "--disable-dependency-tracking"
    - "--disable-cpluffxx"
    - "--disable-shared"
    - "--enable-static"

  # 编译依赖列表 (格式: name/version)
  dependencies:
    - "expat/2.8.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-guard-framework-lock-no-thread-release.patch"
  - "patches/0002-context-owner-always-defined.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "C-Pluff 为 Autotools 项目, 官方 tarball 自带 configure, 无需 autogen"
  - "必需依赖仅 expat (AC_CHECK_HEADER/AC_CHECK_LIB 探测, 非 pkg-config, 经 CPPFLAGS/LDFLAGS 注入)"
  - "以 --build/--host 显式 triplet 绕过老旧 config.guess 在受限文件系统上的探测失败"
  - "SHELL 指向 bash 满足 configure 与测试脚本的语法需求"
  - "以 --disable-nls 规避 gettext 缺失, 以 --without-readline 保持 MIT 许可洁净"
  - "上游测试为 test/ 目录自定义 check-local 套件 (53 用例), 经由 make check 完整执行"

# 上游测试计数口径
# 统计单位: test/tests.txt 行数 (用例名, 一行一个)
# 取数命令: wc -l test/tests.txt
upstream_tests:
  total: 53
  passed: 53
  failed: 0
  skipped: 0
  not_run: 0
  framework: "make-check"
