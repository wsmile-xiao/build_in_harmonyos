# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: chal/1.1.0
homepage: "https://github.com/namanthanki/chal"

# 上游测试命令 (chal 上游为单文件 Makefile 项目，无 make check / ctest 目标；
# 上游自带 perft 扩展命令，README 给出 perft 6 从初始局面必须返回 119,060,324)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (perft 叶节点计数验证，标准国际象棋 perft 值)
upstream_tests:
  - file: src/chal.c
    source: chal-1.1.0/src/chal.c
    description: "perft 走法生成验证 — README 声明 perft 6 初始局面 = 119,060,324"
    command: "printf 'perft 3\\nquit\\n' | bin/chal"

# test_package 中自带的测试 (消费者视角验证，真实调用 chal 二进制执行 perft)
test_package_tests:
  - file: test.sh
    description: "真实调用 chal 二进制：perft 3=8902、perft 4=197281 节点数断言"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
