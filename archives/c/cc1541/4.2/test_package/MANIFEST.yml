package: cc1541/4.2
homepage: https://bitbucket.org/PTV_Claus/cc1541

upstream_check_command: "make check CC=clang"
upstream_test_in_build: false
upstream_test_command: "make check CC=clang"
upstream_tests:
  - file: test_cc1541.c
    source: cc1541-4.2/test_cc1541.c
    description: "Official 135-case functional suite driving the built cc1541 binary (D64/G64/D71/D81 image creation, BAM accounting, interleave, file write/read)"
    command: "./test_cc1541 ./cc1541"

test_package_tests:
  - file: test.sh
    description: "Consumer test: usage-banner version assertion plus real D64 image creation (exit status, 174848-byte image, directory entry present)"
    command: "bash test.sh"

assertion_count: 4
