software: cc1541
display: "cc1541"
description: "Tool for creating Commodore 1541 floppy disk images in D64, G64, D71 or D81 format"
category: utility
homepage: "https://bitbucket.org/PTV_Claus/cc1541"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Builds the upstream single-binary Makefile target with clang (CC passed explicitly; the build host has no bare cc)."
    - "No Conan package dependencies are declared."
    - "Official upstream suite passes 135/135 on device; the consumer test creates a real D64 image and asserts exit status, image size and directory entry."
  common_dependencies: []

versions:
  "4.2":
    status: built
    build_date: "2026-09-06"
