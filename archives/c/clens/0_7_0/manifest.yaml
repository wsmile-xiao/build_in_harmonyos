knowledge_gained:
  - "clens 是 OpenBSD API 兼容层库：OHOS musl 原生提供 arc4random 族/strlcpy/strlcat/fgetln/glob，配方按'libc 已有即裁剪'只编译 clens/strtonum/fmt_scaled/fparseln 四个真实增量 TU，零补丁零平台宏。"
  - "Homebrew 的 clens formula 在 Linux 上加 libbsd 依赖，仅因 arc4random_buf/uniform 无条件 include <bsd/stdlib.h>；OHOS 不需要 libbsd（已实测 sysroot stdlib.h 原生声明三个 arc4random 函数）。"
