# test_package/MANIFEST.yml — clens 0_7_0
# CI L0e requires this file to exist.

package: clens/0_7_0
homepage: "https://github.com/conformal/clens"

# clens ships no upstream test suite. Inventory (tag CLENS_0_7_0):
#   - Makefile (OpenBSD bsd.lib.mk) and GNUmakefile define no check/test
#     target; `make -n check` fails with "No rule to make target 'check'".
#   - find . -iname '*test*' -o -iname '*check*' matches no test program
#     (only config/Makefile.* platform fragments exist).
#   - config/ has Makefile.{bitrig,cygwin,freebsd,linux,openbsd}, clens.spec,
#     debian/ — none reference tests.
# Upstream N_static = 0; consumer-side validation is provided by this
# test_package (see notes.md "上游测试用例申报表").
upstream_check_command: "make check  # absent upstream (no such rule)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.c
    description: >-
      Consumer-side API validation: 29 CHECK sites covering
      clens_verstring/clens_version, strtonum (in-range, too-large and
      invalid error strings), fmt_scaled/scan_scaled round-trips including
      the ERANGE path, fparseln comment-skipping/line-numbering/backslash
      continuation, plus strlcpy/strlcat/arc4random_uniform/glob resolved
      from OHOS libc (documents the shim-TU trimming rule).
    command: "./test_clens"

assertion_count: 29
