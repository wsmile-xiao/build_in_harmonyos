version: "1.3.2"
software: "cryptopant"
status: "built"
build_date: "2026-09-10"
build_system: "autotools"

source:
  url: "https://ant.isi.edu/software/cryptopANT/cryptopANT-1.3.2.tar.gz"
  sha256: "049b98da835a356230259e68684165fbfa08bf6540424a6f4d815660ae55f278"
  tar_format: "tar.gz"

build:
  system: "autotools"
  configure_options:
    - "--with-scramble_ips"
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - "openssl/3.5.6.1"
  cc: "clang"
  cxx: "clang++"

patches_applied: []

knowledge_gained:
  - "OpenSSL 3.x is mandatory (EVP_CIPHER_fetch path); configure checks for openssl/evp.h and libcrypto EVP_CIPHER_CTX_new."

homepage: "https://ant.isi.edu/software/cryptopANT/"
license: "GPL-2.0-only"

tests:
  upstream:
    command: "make check"
    cases: 16
    passed: 16
    note: "4 crypto types (blowfish/aes/sha1/md5) * 4 operations (ipv4/6 scramble+descramble) = 16 checks; each prints PASSED/FAILED"
  adapted:
    command: "test_package/test_cryptopant"
    cases: 11
    passed: 8
    pass_rate: "11/11 (100%)"
