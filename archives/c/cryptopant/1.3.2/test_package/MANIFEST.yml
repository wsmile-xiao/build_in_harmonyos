package: cryptopant/1.3.2
homepage: "https://ant.isi.edu/software/cryptopANT/"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests_exist: true

# Upstream test suite ships 16 logical checks (4 crypto types * 4 ops)
upstream_tests:
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "blowfish ipv4 scramble"
    command: "make check # test_bf ipv4 scrambling -> cmp ip4s.anon.blowfish"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "blowfish ipv6 scramble"
    command: "make check # test_bf ipv6 scrambling"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "blowfish ipv4 descramble"
    command: "make check # test_bf ipv4 descrambling"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "blowfish ipv6 descramble"
    command: "make check # test_bf ipv6 descrambling"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "aes ipv4 scramble"
    command: "make check # test_aes"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "aes ipv6 scramble"
    command: "make check # test_aes"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "aes ipv4 descramble"
    command: "make check # test_aes"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "aes ipv6 descramble"
    command: "make check # test_aes"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "sha1 ipv4 scramble"
    command: "make check # test_sha1"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "sha1 ipv6 scramble"
    command: "make check # test_sha1"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "sha1 ipv4 descramble"
    command: "make check # test_sha1"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "sha1 ipv6 descramble"
    command: "make check # test_sha1"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "md5 ipv4 scramble"
    command: "make check # test_md5"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "md5 ipv6 scramble"
    command: "make check # test_md5"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "md5 ipv4 descramble"
    command: "make check # test_md5"
  - file: "Makefile.am"
    source: "cryptopANT-1.3.2/Makefile.am"
    description: "md5 ipv6 descramble"
    command: "make check # test_md5"

test_package_tests:
  - file: "test_cryptopant.c"
    description: "Exercises cryptopANT C API: type/name round-trip, init AES/SHA1, ipv4/ipv6 scramble+descramble and prefix checks (11 assertions)"
    command: "./test_cryptopant"

assertion_count: 11
