software: checkit-tiff
display: "checkit-tiff"
description: "Incredibly fast conformance checker for baseline TIFFs"
category: gfx
homepage: "https://git.fsfe.org/art1pirat/checkit_tiff"
license: libtiff
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMakeLists.txt 位于 src/ 子目录，install 规则引用 repo 根的 ../example_configs，整库 clone 进 source_folder"
    - "PCRE2 显式变量分支（PCRE2_INCLUDE_DIR/PCRE2_LIBRARY/PCRE2_POSIX_LIBRARY），可直接传 Conan 依赖路径"
    - "上游仓库位于 git.fsfe.org（Anubis 反爬保护 Web UI），git 协议可用"
  common_dependencies:
    - pcre2

versions:
  "1.7.3":
    status: built
    build_date: "2026-09-07"
    conan_ref: "checkit-tiff/1.7.3"
