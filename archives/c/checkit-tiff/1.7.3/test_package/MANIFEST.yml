# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: checkit-tiff/1.7.3
homepage: "https://git.fsfe.org/art1pirat/checkit_tiff"

# 上游测试命令 (cmake enable_testing(): 01_test_stack C 程序 +
# 01_grammar/02_test_config_examples/03_test_should_pass/03_test_should_fail Perl 脚本)
# 注意: 上游 5 个用例由 src/CMakeLists.txt 的 add_test() 注册在 ctest 里,
#       conanfile.py build() 直接跑 ctest 即可全部执行 (实测 5/5 通过)。
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试 (can_run() 为真时执行, 失败即中断构建)
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (断言数取自各 .t 的 Test::More tests => N, 为实测值)
upstream_tests:
  - file: t/01_test_stack.c
    source: checkit-tiff-1.7.3/t/01_test_stack.c
    description: "Checkit stack/parser smoke test (C)"
    command: "test_stack (ctest 01_test_stack)"
    assertions: 1
  - file: t/01_test_grammar.t
    source: checkit-tiff-1.7.3/t/01_test_grammar.t
    description: "Grammar validation tests (requires Perl)"
    command: "perl -I t 01_test_grammar.t"
    assertions: 181
  - file: t/02_test_config_examples.t
    source: checkit-tiff-1.7.3/t/02_test_config_examples.t
    description: "Example config validation tests (requires Perl)"
    command: "perl -I t 02_test_config_examples.t"
    assertions: 8
  - file: t/03_test_should_pass.t
    source: checkit-tiff-1.7.3/t/03_test_should_pass.t
    description: "Valid TIFF fixtures conformance tests (requires Perl)"
    command: "perl -I t 03_test_should_pass.t"
    assertions: 13
  - file: t/03_test_should_fail.t
    source: checkit-tiff-1.7.3/t/03_test_should_fail.t
    description: "Invalid TIFF fixtures rejection tests (requires Perl)"
    command: "perl -I t 03_test_should_fail.t"
    assertions: 36

# 上游测试运行前提 (由 conanfile.py build() 自动满足, 无需人工干预):
#   1. find_package(Perl) 成功 -> ctest 才会注册 5 个用例 (CI worker: perl 5.42)
#   2. t/Testcall.pm 把可执行文件硬编码为 ../build/<exe>, recipe 会把刚编出来的
#      三个可执行文件暂存到 <source>/build/ 以匹配该路径
#   3. 上游 t/*.t 依赖两个非 perl core 的 CPAN 模块 (File::Slurp / Data::Printer),
#      recipe 通过 PERL5LIB 提供最小纯 perl 实现, 不改动任何上游测试文件


# test_package 中自带的测试 (消费者视角验证, 共 7 个场景, 全部落在已安装的真实制品上)
# 注: OHOS worker 的 /tmp 只读, 临时配置写在 $WORKDIR (优先 $TMPDIR, 退回 $HOME)
test_package_tests:
  - file: test.sh
    description: "E2E test 1: valid baseline TIFF with baseline_minimal config"
    command: "checkit_tiff -c cit_tiff_baseline_minimal.cfg minimal_valid_baseline.tiff"
  - file: test.sh
    description: "E2E test 2: PCRE2 regex rule rejects a TIFF lacking the mandated tag 270"
    command: "checkit_tiff -c $WORKDIR/test_pcre2_positive.cfg minimal_valid_baseline.tiff"
  - file: test.sh
    description: "E2E test 3: PCRE2 valid regex config accepted by the config parser"
    command: "printf '%s\\n' '270; mandatory; regex(\"^test.*\")' | checkit_check_config"
  - file: test.sh
    description: "E2E test 4: Config whitelist rejection - missing mandatory tag"
    command: "checkit_tiff -c $WORKDIR/test_whitelist_reject.cfg minimal_valid_baseline.tiff"
  - file: test.sh
    description: "E2E test 5: PCRE2 negative match - regex mismatch rejection"
    command: "checkit_tiff -c $WORKDIR/test_pcre2_negative.cfg minimal_valid_baseline.tiff"
  - file: test.sh
    description: "E2E test 6: PCRE2 invalid regex must be rejected by the config parser"
    command: "printf '%s\\n' '256; mandatory; regex(\"[invalid\")' | checkit_check_config"
  - file: test.sh
    description: "E2E test 7: control case - a valid grammar must still be accepted"
    command: "printf '%s\\n' '256; mandatory; any' | checkit_check_config"

# 上游 5 个用例实测断言数合计: 1 + 181 + 8 + 13 + 36 = 239
assertion_count: 239
