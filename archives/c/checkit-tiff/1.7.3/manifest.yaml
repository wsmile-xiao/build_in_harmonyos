# 版本级 manifest — checkit-tiff 1.7.3

# 版本号
version: "1.7.3"

# 软件名
software: "checkit-tiff"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（git 仓库；commit 固定 v1.7.3 tag 指向）
  url: "https://git.fsfe.org/art1pirat/checkit_tiff.git"

  # checkout commit: 6e8084b5ae6225162ae9947368e3db8d995ae7b5 (tag v1.7.3)
  # 源码校验和（本地打包产物 sha256，git source 以 commit 为准）
  sha256: "a78178a7edbd0081c297d3a807fbbc7195dfe78e0135f2f348daf966cf3953e7"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DPCRE2_INCLUDE_DIR=<conan pcre2 include>"
    - "-DPCRE2_LIBRARY=<conan pcre2 lib>/libpcre2-8.a"
    - "-DPCRE2_POSIX_LIBRARY=<conan pcre2 lib>/libpcre2-posix.a"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - pcre2/10.47

  # 编译器
  cc: clang
  cxx: clang++

  # 测试配置
  test:
    # 上游测试在 build() 中执行
    upstream_test_in_build: true
    upstream_test_command: "ctest --output-on-failure -j1"
    # test_package E2E 测试
    test_package_command: "bash test.sh"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-pcre2-static-link.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "checkit_tiff CMakeLists 的 PCRE2 探测走显式变量分支（PCRE2_INCLUDE_DIR/PCRE2_LIBRARY/PCRE2_POSIX_LIBRARY）而非 pkg_check_modules，可直接传 Conan 依赖路径、无需 pkg-config"
  - "init_build 的嵌套源码检测会把 src/ 提升到根、破坏 example_configs/t/README 相对引用，checkit-tiff 需手动重建 .orig/.work 保持 repo 结构"
  - "上游仓库位于 git.fsfe.org（Anubis 反爬保护 Web UI），git 协议可用，配方以 git clone + commit checkout 取源码"
  - "checkit_tiff -h 打印帮助并退出 0，但只断言帮助输出属于空壳测试；test_package 改为用真实 baseline 配置 + 真实 TIFF fixture 跑 7 个端到端场景"
  - "上游 5 个测试 (C + 4 Perl) 已在 build() 中通过 ctest 真实执行；用 can_run() 而非 qemu 判断——OHOS CI worker 的 host profile 与 build profile 一致 (os=OHOS arch=armv8)，本就是原生执行，无需 qemu-aarch64"
  - "规则 12 要求鸿蒙特有测试≥1 且含完整消费者用例：test_package/test.sh 覆盖 7 个 E2E 场景（合法 baseline 通过 / mandatory tag 270 缺失被拒绝 / 合法 regex 配置被接受 / mandatory tag 9999 缺失被拒绝 / PCRE2 负匹配被拒绝 / 非法 regex 被拒绝 / 合法语法反向对照被接受）"