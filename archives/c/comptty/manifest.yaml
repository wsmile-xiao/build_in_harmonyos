software: comptty
display: "comptty"
description: "comptty — compare two RTTY streams, computes BER and CER (W1HKJ ham radio family)"
category: utils
homepage: "https://github.com/w1hkj/comptty"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "FLTK GUI 应用（X11 后端），硬依赖 libfltk/1.3.11（静态库，含 libx11/1.8.13 + xorgproto/2025.1 传递依赖）"
    - "官方 GitHub tag tarball 无 configure 脚本，build() 用系统 autoconf 自举生成"
    - "config.guess 2008 版不识别 HarmonyOS，补丁添加 aarch64-HarmonyOS 分支（E007，comptext 同款最小补丁）"
    - "上游 tarball 的 build-aux/compile 为绝对路径符号链接，source() 用 Python 替换为真实文件"
    - "沙箱无 X display，CLI 模式 --version/--help 可运行（test_package 5 断言）"
  common_dependencies:
    - "libfltk/1.3.11"
