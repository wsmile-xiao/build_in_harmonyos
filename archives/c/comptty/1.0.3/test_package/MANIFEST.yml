# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: comptty/1.0.3
homepage: "https://github.com/w1hkj/comptty"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 穷尽核查结论（2026-09-10，见 notes.md）：
# - 源码包全文件清单：无 tests/ 目录，无 test_*.cxx 源文件
# - Makefile.am/src/Makefile.am：无 TESTS / check_PROGRAMS 目标，make check 为空操作
# - 上游 git 仓库树（github.com/w1hkj/comptty）：仅 6 个提交，无任何测试资产
# - 唯一相关文件 data/jabbertest.txt 为运行时示例数据，非测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "comptty --version 输出版本号 + --help 列出 CLI 选项 + FLTK 链接期静态符号检查"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
