  - "官方 GitHub tag tarball 无 configure 脚本，需 build() 中 autoconf 自举生成"
  - "FLTK_CFLAGS/FLTK_LIBS 手动注入跳过 fltk-config 检查（fltk-config 引用 .cache 残留路径不可用）"

