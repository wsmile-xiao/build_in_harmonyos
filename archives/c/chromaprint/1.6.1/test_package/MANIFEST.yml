schema_version: "1.0"
library: chromaprint
version: "1.6.1"
upstream_check_command: "ctest --output-on-failure --parallel 2"
upstream_test_in_build: true
upstream_test_count: 99
upstream_count_unit: GoogleTest cases registered individually by CTest
upstream_tests:
  - file: tests/CMakeLists.txt
    description: Complete 99 GoogleTest cases in library configuration; BUILD_TESTS=ON, BUILD_TOOLS=OFF
    command: ctest --output-on-failure --parallel 2
test_package_tests:
  - file: test_chromaprint.c
    description: PCM fingerprint, encode/decode and hash equality, OHOS identity and TMPDIR lifecycle
    command: ./test_chromaprint
assertion_count: 26
adaptation_tests:
  source: test_chromaprint.c
  cases: 1
  assertions_ohos: 26
  features:
    - Generate a nonempty fingerprint from deterministic 12-second PCM
    - Encode/decode roundtrip and hash equality
    - OHOS uname and task-private TMPDIR persistence roundtrip
notes: fpcalc and FFmpeg reader tests are outside the library-only package scope
