software: curlcpp
display: "curlcpp"
description: "An object oriented C++ wrapper for CURL (libcurl)"
category: network
homepage: "https://github.com/JosephP91/curlcpp"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Build shared libcurlcpp against the Conan-provided libcurl"
    - "Remove the CURLOPT_CLOSEPOLICY/OBSOLETE72 shims that no longer compile with libcurl 8.10+"
    - "Upstream ships no automated tests; verify with an offline consumer exercising real APIs"
  common_dependencies:
    - curl/8.15.0.1

versions:
  "3.1":
    status: built
    build_date: "2026-09-11"
