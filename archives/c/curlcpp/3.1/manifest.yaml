software: curlcpp
version: "3.1"
status: built
build_date: "2026-09-11"
build_system: cmake

source:
  url: "https://github.com/JosephP91/curlcpp/archive/refs/tags/3.1.tar.gz"
  sha256: "ba7aeed9fde9e5081936fbe08f7a584e452f9ac1199e5fabffbb3cfc95e85f4b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DCURLCPP_USE_PKGCONFIG=OFF"
    - "-DBUILD_TEST=OFF"
  dependencies:
    - curl/8.15.0.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-include-curl-easy-h.patch"

knowledge_gained:
  - "curlcpp 3.1 的 CURLOPT_OBSOLETE72/CURLOPT_CLOSEPOLICY 选项垫片在 libcurl 8.10+ 下无法编译（枚举已移除，改为 int 宏），按上游修复 bc38005（Homebrew 同款 backport）整体移除该垫片块"
  - "curlcpp 3.1 上游无自动化测试套件：顶层 CMakeLists 无 enable_testing/add_test，test/ 仅 7 个需外网的演示程序；功能验证由 test_package 离线执行 6 项真实 API 断言完成"
