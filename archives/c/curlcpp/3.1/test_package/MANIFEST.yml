# test_package/MANIFEST.yml — curlcpp 3.1
# 上游无自动化测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）

package: curlcpp/3.1
homepage: "https://github.com/JosephP91/curlcpp"

upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "CMakeLists.txt（顶层，v3.1）"
    finding: "全文件无 enable_testing() / add_test() / add_custom_target(check) 调用；测试入口只有 `if(BUILD_TEST) add_subdirectory(test)`，且 BUILD_TEST 默认 OFF"
  - path: "test/CMakeLists.txt（上游源码）"
    finding: "仅定义 7 个 add_executable 示例目标（cookie/custom_request/easy/easy_info/header/recv_header/multi），链接 curlcpp，无任何 ctest 注册"
  - path: "test/*.cpp（上游源码，共 7 个）"
    finding: "均为演示程序：main() 直接构造 curl_easy 并 perform() 真实外网请求（如 http://www.google.it），无断言、无测试框架、无 PASS/FAIL 判定，不构成可接入的自动化测试"
  - path: "Homebrew curlcpp 公式（Formula/c/curlcpp.rb）"
    finding: "官方 test 块仅做编译链接冒烟，无上游测试套件可引用；佐证上游无可接入测试"
upstream_test_reason: "上游 3.1 无任何自动化测试用例（无 ctest/gtest/pytest 注册；7 个 test/ 程序均为需外网的演示示例），无可运行的上游测试套件"

test_package_tests:
  - file: test.cpp
    description: "消费者功能测试：离线构造 curl_easy（含流式构造）、设置传输选项、组装 curl_form 表单、multi 增删 easy 句柄、make_option 选项对，共 6 项真实 API 断言，全程不发起网络请求（R34 合规）"
    command: "./test_curlcpp"

assertion_count: 6
