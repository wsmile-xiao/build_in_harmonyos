# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ctl/3.0
homepage: "https://github.com/rurban/ctl"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（tests/func/* 12 个独立用例，Makefile TESTS 声明）
upstream_tests:
  - file: tests/func/test_c11.c
    source: ctl-3.0/tests/func/test_c11.c
    description: "C11 多容器混合基础用例"
    command: "./tests/func/test_c11"
  - file: tests/func/test_container_composing.cc
    source: ctl-3.0/tests/func/test_container_composing.cc
    description: "容器组合用例"
    command: "./tests/func/test_container_composing"
  - file: tests/func/test_deq.cc
    source: ctl-3.0/tests/func/test_deq.cc
    description: "deque 容器用例"
    command: "./tests/func/test_deq"
  - file: tests/func/test_lst.cc
    source: ctl-3.0/tests/func/test_lst.cc
    description: "list 容器用例"
    command: "./tests/func/test_lst"
  - file: tests/func/test_str.cc
    source: ctl-3.0/tests/func/test_str.cc
    description: "string 容器用例"
    command: "./tests/func/test_str"
  - file: tests/func/test_pqu.cc
    source: ctl-3.0/tests/func/test_pqu.cc
    description: "priority_queue 容器用例"
    command: "./tests/func/test_pqu"
  - file: tests/func/test_que.cc
    source: ctl-3.0/tests/func/test_que.cc
    description: "queue 容器用例"
    command: "./tests/func/test_que"
  - file: tests/func/test_set.cc
    source: ctl-3.0/tests/func/test_set.cc
    description: "set 容器用例"
    command: "./tests/func/test_set"
  - file: tests/func/test_ust.cc
    source: ctl-3.0/tests/func/test_ust.cc
    description: "unordered_set 容器用例"
    command: "./tests/func/test_ust"
  - file: tests/func/test_stk.cc
    source: ctl-3.0/tests/func/test_stk.cc
    description: "stack 容器用例"
    command: "./tests/func/test_stk"
  - file: tests/func/test_vec_capacity.cc
    source: ctl-3.0/tests/func/test_vec_capacity.cc
    description: "vector 容量用例"
    command: "./tests/func/test_vec_capacity"
  - file: tests/func/test_vec.cc
    source: ctl-3.0/tests/func/test_vec.cc
    description: "vector 容器用例"
    command: "./tests/func/test_vec"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：实例化 vec_int/str 并调用 push_back/at/foreach 公开 API"
    command: "./test_ctl"
  - file: test_ohos.c
    description: "HarmonyOS 专项测试：OHOS 工具链下 vec/lst/deq/set/ust/stk/que/pqu 八类容器真实生命周期断言"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 60
