# 版本级 manifest — ctl 3.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0"

# 软件名
software: ctl

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag archive）
  url: "https://codeload.github.com/rurban/ctl/tar.gz/refs/tags/3.0"

  # 源码校验和
  sha256: "5ddee34d4826b23b53fdaf3c401e6baf2febbef816746bea6c2e0ac6571485d1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "宏模板容器头（ctl 型）每个模板头须单独定义 T/P，非模板头（str.h）包含前必须 #undef T/P；size/capacity 是结构体字段而非 *_size() 函数"
  - "上游测试断言本库容器内部 capacity/bucket_count 与 C++ STL 精确相等时，属实现细节比较：增长策略不同即断言失败，但数据内容一致（探针验证）；如实计入全量通过率分母，flaky 项独立重跑"
  - "header-only 库 Conan 配方：package_type=header-library、build() 直通、package() 拷贝头文件；codeload tarball 需 get() 显式 filename（复用 E276/E257/E321）"
