# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: circularbuffer/1.4.0
homepage: "https://github.com/rlogiacco/CircularBuffer"

# 上游测试命令（本库为 header-only 模板库，上游无构建系统、无测试目标）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试（header-only：无 build()）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游未提供测试套件，仅 examples/*.ino 示例，
# 需 Arduino 运行时，非独立可执行用例）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者用例：经已安装公开头文件调用 CircularBuffer<T,S> 的 push/shift/pop/unshift/first/last/size/available/isEmpty/isFull/clear/copyToArray/operator[]，校验 FIFO/LIFO 语义"
    command: "./test_circularbuffer"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 30
