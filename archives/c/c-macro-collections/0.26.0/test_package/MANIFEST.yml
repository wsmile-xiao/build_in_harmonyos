# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: c-macro-collections/0.26.0
homepage: "https://github.com/LeoVen/C-Macro-Collections"

# 上游测试命令 (make check 分析结果：Makefile 目标为 make -C ./tests)
upstream_check_command: "make -C ./tests"

# conanfile.py build() 方法中是否已集成上游测试
# header-only 库无编译单元，上游测试（main.c 聚合 484 用例）由鸿蒙专项/消费者用例承载
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 实测（clang -I ../src main.c -o out/main.exe；clang 15.0.4，aarch64-linux-ohos 交叉工具链）：
#   33 个测试单元，484/484 用例通过，0 失败，exit 0
upstream_tests:
  - file: tests/main.c
    source: c-macro-collections-0.26.0/tests/main.c
    description: "上游聚合测试入口：17 个 unt_*.h 测试头（484 个 CMC_CREATE_TEST 用例，33 个单元）"
    command: "clang -Wall -Wextra -g -O0 -I ../src main.c -o out/main.exe && ./out/main.exe"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：实例化 cmc/list.h 生成 int 链表，插入 5 元素，迭代求和校验（R34 实质调用公开 API）"
    command: "./test_c-macro-collections"

# 测试断言总数 (来自上游 main.exe 实测汇总：33 单元断言合计)
assertion_count: 611330
