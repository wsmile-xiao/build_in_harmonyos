# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.26.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.26.0"

# 软件名
software: "c-macro-collections"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/LeoVen/C-Macro-Collections/archive/refs/tags/v0.26.0.tar.gz"

  # 源码校验和
  sha256: "92c1d3046fa343eec6387980c9de591aa9e9f30c0b813480924d0c5543414ff6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "header-only 宏库无 configure/CMake install 目标时，conan 配方写 package_type=header-library，package() 用 copy(self, 'cmc/**', src/source, dst/include) 递归复制头文件树；pattern 必须用 'dir/**' 而非 'dir'（copy() 按文件 glob 匹配，目录 pattern 静默为 0 文件）"
- "propagate 宏库 fval 函数表对基本类型：.cpy/.free 可 NULL（上游 unt_list.h 同款用法），.pri 可用 cmp 复用"
- "宏库迭代器终止判断用 PFX##_iter_at_end(&it)（_iter_end(list) 返回迭代器对象而非 bool）"
