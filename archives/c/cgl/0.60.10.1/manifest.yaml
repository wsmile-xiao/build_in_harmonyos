software: cgl
version: "0.60.10.1"
status: built
build_date: "2026-09-16"

source:
  url: "https://github.com/coin-or/Cgl/archive/refs/tags/releases/0.60.10.tar.gz"
  sha256: "41b7ac9402db883d9c487eb7101e59eb513cefd726e6e7a669dc94664d9385e6"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--build=aarch64-unknown-linux-musl"
    - "--disable-dependency-tracking"
    - "--disable-shared"
    - "--enable-static"
  dependencies:
    - coinutils/2.11.13
    - coin-or/0.108.12
    - clp/1.17.10
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Cgl 0.60.10 使用 COIN-OR autotools 构建系统。"
  - "Cgl 依赖 CoinUtils、Osi 和 Clp；ohpcd 中 Osi 的 Conan 包名为 coin-or。"
  - "OHOS 构建使用显式 aarch64-unknown-linux-musl 三元组并禁用依赖跟踪。"
  - "HMDFS 的 SGID 与 umask 077 会使 config.status 临时目录不可写，需用 mkdir + umask 022 重新生成 Makefile。"
  - "CglGomory 使用 OsiClpSolverInterface.hpp，需显式导出 Clp 头文件和静态库闭包。"
  - "Cgl 公共头文件安装在 include/coin，package_info 必须导出该目录供 CMakeDeps 消费者使用。"
