# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cassiopee-c/1.0.9
homepage: "https://github.com/osallou/cassiopee-c"

# 上游测试命令（CTest 注册：test/CMakeLists.txt add_test(NAME TestCassie)）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（test/test.cxx — cppunit 用例，13 断言通过）
upstream_tests:
  - file: test/test.cxx
    source: cassiopee-c-1.0.9/test/test.cxx
    description: "上游 cppunit 测试（CassieIndexer 索引/搜索/序列化，测试通过 OK (13)）"
    command: "./bin/test_cassiopee"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: consumer_test.cxx
    description: "消费者测试：仅通过公开头文件 Cassiopee.h 与公开 API（CassieIndexer/CassieSearch）构建索引、搜索、序列化保存与重载"
    command: "./test_cassiopee-c"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 16
