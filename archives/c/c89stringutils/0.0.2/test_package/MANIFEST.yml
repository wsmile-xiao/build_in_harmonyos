# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: c89stringutils/0.0.2
homepage: "https://github.com/offscale/c89stringutils"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本机实测：1 个 ctest 用例，4 个断言全部通过）
upstream_tests:
  - file: c89stringutils_tests/test_c89stringutils/test.c
    source: c89stringutils-0.0.2/c89stringutils_tests/test_c89stringutils/test.c
    description: "strnstr/strcasecmp/strcasestr/asprintf 等 C89 字符串扩展函数单元测试（greatest 框架）"
    command: "./bin/test_c89stringutils"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 strnstr/strcasecmp/asprintf 验证链接与运行"
    command: "./test_c89stringutils"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
