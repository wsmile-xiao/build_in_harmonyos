software: cgvg
# 版本级 manifest — 遵循 ARCHIVE-SPEC v2.0
version: "1.6.3"

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"

# 构建系统标识
build_system: custom

# ============================================================
# 源码信息
# ============================================================
source:
  # 上游官方站点 uzix.org 已失效；Debian pool 的 cgvg_1.6.3.orig.tar.gz 为
  # 官方 1.6.3 的 pristine 原包（无 Debian 修改），sha256 已核验。
  url: "https://deb.debian.org/debian/pool/main/c/cgvg/cgvg_1.6.3.orig.tar.gz"
  sha256: "d879f541abcc988841a8d86f0c0781ded6e70498a63c9befdd52baf4649a12f3"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型: cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表（无 configure，脚本直接安装）
  configure_options: []

  # 编译依赖列表（无 C/C++ 依赖；运行时依赖 perl 5，OHOS PC 系统自带）
  dependencies: []

  # 编译器（纯 Perl 脚本包，无编译步骤，以下两项不适用）
  cc: "N/A (纯 Perl 脚本，无编译)"
  cxx: "N/A (纯 Perl 脚本，无编译)"

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []
runtime_modifications:
  - "cg/vg shebang 改写为 #!/usr/bin/env perl（autotools 本会烤死构建机绝对 perl 路径）"
  - "cgvg-common.pl/cgvgrc-example 安装在 bin/（脚本目录，脚本首个 @INC 项）而非 share/cgvg，保证 Conan 包可重定位"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "cgvg 为纯 Perl 脚本包（cg/vg 两个脚本 + cgvg-common.pl），autotools 壳仅做 @PERL@ shebang 替换与文件安装，无 C/C++ 源码"
  - "HarmonyOS PC 系统自带 perl（/data/service/hnp/bin/perl，perl.org 5.42.0，aarch64-linux），脚本类包可直接以 env perl 运行时依赖适配"
  - "autotools configure 会把构建机绝对 perl 路径与 --prefix datadir 烤进脚本 → Conan 包不可重定位；改为 env perl + 数据文件与脚本同目录（上游脚本首个 @INC 即 dirname($0)），包内无任何绝对路径"
  - "上游官方站点失效时，Debian pool 的 *_N.orig.tar.gz 是权威 pristine 上游源（逐位一致、无 Debian 修改），R39 可在 conandata/PR 说明后使用"

# 测试
test:
  upstream_cases: 0
  upstream_suite: "无（cgvg 1.6.3 发行包不含测试套件：Makefile.am 无 TESTS/check_PROGRAMS，make check 无可执行内容）"
  runnable: 0
  runnable_note: "上游无测试可运行；以 test_package 端到端功能冒烟替代（R34 实质验证）"
  pass_rate: "N/A（消费者冒烟 14 断言全部通过）"
  consumer_test: "test_cgvg.py：perl -c 语法校验 ×2 + cg 递归搜索 + cg -l 回放 + vg 跳转编辑器(file:line) + vg 错误路径，OHOS perl 5.42.0 真实执行"
