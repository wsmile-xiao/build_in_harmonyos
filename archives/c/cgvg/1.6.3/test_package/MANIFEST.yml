# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
#
# 上游测试情况：cgvg 1.6.3 发行包不含测试套件 — Makefile.am 无 TESTS/
# check_PROGRAMS 声明，autotools 构建只做 @PERL@ shebang 替换 + 文件安装；
# `make check` 无任何可执行测试（本机实测无 check target 产物）。

package: cgvg/1.6.3
homepage: "https://waterlan.home.xs4all.nl/cgvg/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游不携带测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 真实运行打包产物)
test_package_tests:
  - file: test_cgvg.py
    description: "端到端功能冒烟（OHOS perl 5.42.0 真实执行）：perl -c 语法校验 ×2、cg 递归搜索、cg -l 日志回放、vg 跳转编辑器(file:line, fake editor)、vg 无参数错误路径"
    command: "python3 test_cgvg.py <package bin dir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
