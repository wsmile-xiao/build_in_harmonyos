# 编译日期（YYYY-MM-DD）
build_date: "2026-09-12"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mozilla/cubeb/archive/975a727e5e30.tar.gz"

  # 源码校验和
  sha256: "39f55e74ea30686e927d47a389247fd0c3a81691bff3fa7b32d8ddcd8a81feaf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
