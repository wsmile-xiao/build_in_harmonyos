build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_RUST_LIBS=OFF"
    - "-DBUILD_TESTS=OFF"
    - "-DLAZY_LOAD_LIBS=ON"
    - "-DUSE_SANITIZERS=OFF"
    - "-DBUILD_TOOLS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cubeb uses CMake with check_include_files for platform audio backend detection"
  - "LAZY_LOAD_LIBS=ON skips hard dependency on pulse/alsa/jack (uses dlopen at runtime)"
  - "On OHOS no audio backend headers found, builds core library without backend-specific sources"
  - "Internal speex resampler bundled in subprojects/speex/ (no external speexdsp required)"
