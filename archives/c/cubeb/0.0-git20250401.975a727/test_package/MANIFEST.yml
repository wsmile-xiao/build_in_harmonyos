# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cubeb/0.0-git20250401.975a727
homepage: "https://github.com/mozilla/cubeb"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# cubeb uses Google Test framework, tests are defined in test/ directory
# Tests require audio hardware; on headless OHOS they will link but may fail at runtime
upstream_tests:
  - file: test/test_sanity.cpp
    source: cubeb-975a727e5e30/test/test_sanity.cpp
    description: "Basic cubeb API sanity test (init/context/stream)"
    command: "./test_sanity"
  - file: test/test_tone.cpp
    source: cubeb-975a727e5e30/test/test_tone.cpp
    description: "Tone generation test"
    command: "./test_tone"
  - file: test/test_audio.cpp
    source: cubeb-975a727e5e30/test/test_audio.cpp
    description: "Audio playback/recording test"
    command: "./test_audio"
  - file: test/test_resampler.cpp
    source: cubeb-975a727e5e30/test/test_resampler.cpp
    description: "Resampler unit test"
    command: "./test_resampler"
  - file: test/test_ring_buffer.cpp
    source: cubeb-975a727e5e30/test/test_ring_buffer.cpp
    description: "Ring buffer unit test"
    command: "./test_ring_buffer"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：验证 cubeb_init/cubeb_get_min_latency/cubeb_get_preferred_sample_rate API 可链接且可调用"
    command: "./test_cubeb"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
