# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cppcmd/0.1.0
homepage: "https://github.com/remysalim/cppcmd"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Catch2, tests/test_main.cpp)
upstream_tests:
  - file: tests/test_main.cpp
    source: cppcmd-0.1.0/tests/test_main.cpp
    description: "Catch2 上游测试：Expression 解析（3 类型模板实例化）、Argument parser、Registering commands、CommandInterpreter 多实例"
    command: "./cppcmd-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：仅通过公开头文件使用 cppcmd API 注册命令并验证输出"
    command: "./test_cppcmd"

# HarmonyOS 专项测试（OHOS arm64 运行时实际编译执行，独立计数）
ohos_special_tests:
  - file: ohos_special_test.cpp
    description: "鸿蒙专项测试：验证 cppcmd 在 OHOS 运行时的命令解释、表达式解析、Value 转换与越界抛异常行为"
    command: "./ohos_special_test"

# 测试断言总数 (上游实测: 120 assertions in 6 test cases)
assertion_count: 120