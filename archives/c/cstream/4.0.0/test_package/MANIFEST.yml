package: cstream/4.0.0
homepage: "https://www.cons.org/cracauer/cstream.html"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check && sh tests/test1.sh small"
upstream_tests_exist: true

upstream_tests:
  - file: tests/test1.sh
    source: cstream-4.0.0.tar.gz/tests/test1.sh
    description: "Upstream shell suite: exercises -b/-B/-c/-v/-l/-n paths plus file round-trip cmp checks (small mode skips the >8GB soak test)"
    command: "sh tests/test1.sh small"

test_package_tests:
  - file: conanfile.py
    description: "cstream -V version assertion"
    command: "cstream -V"
  - file: test.sh
    description: "Generated-bytes pipe 1k size assertion"
    command: "sh test.sh cstream (pipe case)"
  - file: test.sh
    description: "File round-trip cmp assertion"
    command: "sh test.sh cstream (file case)"

assertion_count: 3
