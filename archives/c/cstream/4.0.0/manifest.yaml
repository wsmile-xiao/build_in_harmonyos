source:
  url: "https://www.cons.org/cracauer/download/cstream-4.0.0.tar.gz"
  sha256: "6bc06d7c4386fb98d3a91713434c315d9e6d425c91c886281beaa254c0e096e3"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
