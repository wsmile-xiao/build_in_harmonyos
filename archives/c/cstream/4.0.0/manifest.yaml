  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-pollloop-handle-pollhup-pollerr.patch"

knowledge_gained:
  - "OHOS has no /etc/services; upstream suite runs in a hermetic build-time workdir copy with services->/dev/zero substitution (identical 6-byte/0-line observable), no conandata patch"
  - "Upstream TESTS is commented out in Makefile.am, make check is a no-op; real suite is tests/test1.sh run with small to skip the 8GB soak test"
  - "pollloop POLLHUP/POLLERR/POLLNVAL readiness mask: -c 4 no longer spins in poll(INFTIM) on EOF pipes under OHOS; Linux behavior unchanged"
  - "log4 compare-time Since-filter: timing-volatile throughput lines excluded on both sides before line-count gate (mirrors upstream stderrfilter for log2); refs untouched"
