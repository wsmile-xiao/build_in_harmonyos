# test_package/MANIFEST.yml
# CDE 0.1 消费者测试声明（L0 门禁要求此文件声明测试来源）
# 测试通过 conanfile.py 的 test() 方法执行，使用 self.run 调用已安装的 cde-static-bundler
package: cde/1.0.0
homepage: "http://www.pgbovine.net/cde.html"

# 无上游测试套件（静态 bundler 为单文件编译 CLI，无内置 check target）
upstream_test_in_build: false
upstream_test_command: ""

# test_package 中自带的消费者验证测试（conanfile.py test() 方法直接执行）
test_package_tests:
  - file: conanfile.py
    description: "installed --help: 断言 BOUNDARY 文本与静态边界声明"
    command: "cde-static-bundler --help"
  - file: conanfile.py
    description: "positive static-ELF scan: 产生 manifest.json 含 complete=true + entry"
    command: "cde-static-bundler scan --entry <fixture> --output <dir>"
  - file: conanfile.py
    description: "negative non-ELF scan: 非零 subject exit + 'not an ELF' 拒绝消息，外层测试通过"
    command: "cde-static-bundler scan --entry <bad.txt> --output <dir>"

# 测试断言总数（3 个消费者测试，每个至少 1 个断言；--help 检查 BOUNDARY，正扫描检查 manifest 2 字段，负扫描检查退出码+消息）
assertion_count: 5