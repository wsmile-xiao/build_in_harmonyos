# test_package/MANIFEST.yml — cowdancer 0.90
# CI L0e 强制要求此文件存在。
# 上游测试清点（R51 三步法）：
#   make check 经 TESTS/check_PROGRAMS 注册 26 项：
#     FAST_TESTS(8): test_cowbuilder test_cowbuilder_util test_file
#       test_forkexec test_ilistcreate test_parameter test_qemuarch
#       test_qemuipsanitize
#     SLOW_TESTS(18): tests/*.sh（000/001/002/003/004/010/012/013/014/015/
#       017/018/019/020/021/022/101/102）+ check_PROGRAMS 辅助二进制。
#   另检查点：tests/016_memleakcheck 依赖 glibc 专用 mcheck.h，musl 缺失，
#   且上游注释已将其列为 fragile 不默认运行 → 从 check_PROGRAMS 移除。

package: cowdancer/0.90
homepage: "https://salsa.debian.org/pbuilder-team/cowdancer"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序（26 项注册清单，OHOS 实测拆分见 notes.md/test-report）
upstream_tests:
  - file: FAST_TESTS 6 项
    source: cowdancer-0.90/{test_cowbuilder,test_cowbuilder_util,test_file,test_forkexec,test_ilistcreate,test_parameter}
    description: "C 单元测试：COW 链接管理、文件复制、进程执行、ilist 创建、参数解析"
    command: "make check"
  - file: QEMUBUILDER 条件 2 项
    source: cowdancer-0.90/{test_qemuarch,test_qemuipsanitize}
    description: "QEMU 架构映射与 IP 地址清洗测试（OHOS host_os=linux 触发 QEMUBUILDER）"
    command: "make check"
  - file: SLOW_TESTS 18 项
    source: cowdancer-0.90/tests/*.sh
    description: "shell 集成测试：COW 写入/符号链接/fopen/chown/chmod/ilistdump/临时文件/tempfile 等"
    command: "make check"

# OHOS 实测（本机 openharmony aarch64，见 notes.md 逐项根因）：
#   PASS 15 / SKIP 2（chown/lchown 权限判定跳过）/ FAIL 9
#   FAIL 根因：
#     test_cowbuilder/test_file/test_qemuarch：设备 /tmp 为只读 erofs，
#       测试用 mkstemp("/tmp/...") 失败（环境限制，CI worker 的 /tmp 可写）
#     tests/001/021：cp -al 对符号链接创建硬链接被 HMDFS 拒绝
#       （Operation not permitted，文件系统限制）
#     tests/010：shebang #!/bin/bash 在 OHOS 无 /bin/bash + 文件含 Shift_JIS
#       非 UTF-8 字节无法便携打补丁，等价运行下 dd 经 musl 内部 openat
#       直链 LD_PRELOAD 拦不到（平台限制）
#     tests/018：C++ 测试二进制需 libc++_shared.so 运行时（LD_LIBRARY_PATH）
#     tests/101/102：qemubuilder/cowbuilder 需系统配置文件/BUILDPLACE

# test_package 自研测试（消费者视角，R34 实质调用被测包二进制）
test_package_tests:
  - file: test.sh
    description: "端到端测试 cowdancer-ilistcreate 生成 .ilist → cowdancer-ilistdump 回读验证；cow-shell 经 ilist 驱动 COW 语义（LD_PRELOAD 核心机制）"
    command: "bash test.sh"

assertion_count: 6