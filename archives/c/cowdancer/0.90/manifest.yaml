# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "git-archive 型 autotools 项目无 configure，必须 autoreconf -fi（tool_requires automake/libtool）"
  - "OHOS musl 缺失 glibc GNU 扩展：canonicalize_file_name→realpath(x,NULL)、get_current_dir_name→getcwd(NULL,0)"
  - "musl 生态工具经 openat 访问文件，LD_PRELOAD 拦截库必须补 openat 拦截否则 COW 机制被绕过"
  - "OHOS /tmp 为只读 erofs：测试/临时文件必须走 $TMPDIR 或 $HOME/tmp"
  - "HMDFS 上 `umask 077 && mktemp -d` 产生不可写目录（E114），需移除 configure 中 umask 077"
  - "dpkg-parsechangelog 在非 Debian 环境不存在，configure.ac 版本号机制需硬编码"

