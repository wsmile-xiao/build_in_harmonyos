  - patch_file: "patches/0001-Makefile.am.patch"
    patch_description: "SHELL=/bin/bash→bash(PATH查找)；移除 tests/016_memleakcheck（依赖 glibc 专用 mcheck.h，musl 缺失）"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.ac.patch"
    patch_description: "AC_INIT 版本号改硬编码 0.90（OHOS 无 dpkg-parsechangelog，原 m4_esyscmd_s 展开为空导致 AC_INIT 报错）"
    patch_type: "portability"
