# conandata.yml — cowdancer 0.90
# 源码 = salsa.debian.org pbuilder-team/cowdancer tag debian/0.90（git archive，无 configure）
# 构建 = autoreconf -fi 引导后 autotools 构建
# 补丁策略：仅保留源码修改补丁（无 __OHOS__ 平台宏注入、无设备绝对路径硬编码）

sources:
