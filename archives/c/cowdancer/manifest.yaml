# 软件级 manifest — cowdancer
# 遵循 ARCHIVE-SPEC v2.0

software: cowdancer
display: "cowdancer"
description: "copy-on-write 目录树工具集 — cow-shell / cowdancer-ilistcreate / cowdancer-ilistdump / cowbuilder / qemubuilder + libcowdancer.so（LD_PRELOAD COW 拦截库），Debian pbuilder 生态"
category: tool
homepage: "https://salsa.debian.org/pbuilder-team/cowdancer"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "git archive 源码无 configure，配方 build() 用 autoreconf -fi 引导（tool_requires automake/libtool）"
    - "OHOS musl 缺失 glibc GNU 扩展：canonicalize_file_name→realpath(x,NULL)、get_current_dir_name→getcwd(NULL,0)（补丁 0003-0007）"
    - "musl 生态工具经 openat 访问文件，cowdancer.c 补 openat 拦截否则 COW 核心机制被绕过（补丁 0005）"
    - "Makefile.am SHELL=/bin/bash→bash、tests shebang 改 env bash（OHOS 无 /bin/bash）"
    - "tests/016_memleakcheck 依赖 glibc 专用 mcheck.h 从 check_PROGRAMS 移除"
  common_dependencies: []

versions:
  "0.90":
    status: built
    build_date: "2026-09-08"
    upstream_identity: valid
    supersession_eligible: false
    note: "Debian sid/trixie 上游 0.90；autotools 构建；上游测试 15P/2S/9F 为平台限制（/tmp只读/musl拦截/配置依赖）如实申报"