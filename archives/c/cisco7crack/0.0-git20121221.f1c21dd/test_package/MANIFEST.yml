# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cisco7crack/0.0-git20121221.f1c21dd
homepage: "https://github.com/madrisan/cisco7crack"

# 上游 git 快照（f1c21dd，first commit）仅含 cisco7crack.c / cisco7crack.h /
# README.md / .gitignore：无构建系统，无测试源码、测试脚本或任何 test 目标。
upstream_check_command: ""

# 上游无测试套件，因此 build() 中没有可集成的上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34: 实质驱动被测二进制)
test_package_tests:
  - file: test.c
    description: "已知答案解密：-d 104D000A0618 输出 cisco（上游源码头注释自带示例）"
    command: "./test_probe <cisco7crack-bin>"
  - file: test.c
    description: "确定性加密：-c#9 -q gHa5ecret1 输出 094B66084C0014000E1855"
    command: "./test_probe <cisco7crack-bin>"
  - file: test.c
    description: "round-trip：解密 094B66084C0014000E1855 还原 gHa5ecret1"
    command: "./test_probe <cisco7crack-bin>"
  - file: test.c
    description: "非法输入：奇数个 hex 位 exit 4 并告警"
    command: "./test_probe <cisco7crack-bin>"

# 测试断言总数 (test.c 中 check() 调用数)
assertion_count: 4
