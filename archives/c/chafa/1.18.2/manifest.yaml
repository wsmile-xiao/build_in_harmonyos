software: chafa
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.18.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.18.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/hpjansson/chafa/archive/refs/tags/1.18.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--without-tools"
  
  # HMDFS权限workaround: config.status临时目录创建失败
  # 需要手动修改config.status使用固定临时目录
  hmdfs_workaround: "config.status tmp目录权限限制，使用$TMPDIR/chafa-config-workdir"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "glib/2.88.0"
    - "pcre2/10.40"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"  # 添加__OHOS__ LIBC检测和HarmonyOS系统识别
  - "0002-config.sub.patch"   # 添加ohos-linux三元组支持

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: 使用patch-autotools-ohos.pl添加HarmonyOS平台识别"
  - "HMDFS: config.status无法在mktemp创建的临时目录中写入文件，需要使用固定目录"
  - "--without-tools: 跳过命令行工具构建，避免freetype2依赖"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
