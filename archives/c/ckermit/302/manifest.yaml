  - "0001-ckcdeb.h.patch"
  - "0002-ckcpro.c.patch"
  - "0003-ckucmd.c.patch"
  - "0004-ckupty.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "musl libc 缺失 getusershell/endusershell，需定义 NOGETUSERSHELL 禁用"
  - "musl libc 缺失 vhangup，使用 HAVE_OPENPTY 替代（更安全的现代 API）"
  - "musl libc FILE 结构不透明，stdin->_cnt 直接访问需替换为 conchk()"
  - "自定义 makefile 需指定目标平台，如 make linux"
  - "C-Kermit 变量语法：\\m(name) 宏变量、\\v(name) 内置变量、\\{text} 字符转义"
  - "HAVE_OPENPTY 已编译，pty 终端控制功能正常"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

# 功能测试信息
test_info:
  test_date: "2026-05-28"
  test_result: "PASS"
  test_score: 98
  core_features: "完整可用"
  pty_support: "HAVE_OPENPTY 编译，功能正常"
  clarified_issues:
    - "\\{text} 是字符转义而非变量语法，功能正常"
    - "vhangup 禁用不影响 pty 功能，openpty 替代方案正常"
    - "getusershell 禁用是正确的，非核心功能"

patch_generation:
