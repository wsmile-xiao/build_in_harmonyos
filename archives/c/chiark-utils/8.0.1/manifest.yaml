# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "conanfile 自定义 env 脚本命名为 conanbuild 会与 Conan 聚合启动器自引用 -> SIGSEGV(Error -11), 编译器经 make 变量直接注入 (knowledge_ref: E2180)"
- "OHOS <libintl.h> 为空壳头, gettext 无声明; -D'gettext(x)=x' 恒等宏编译期解决, 无需源码补丁 (knowledge_ref: E2181)"
- "裸 Makefile 多程序包: 依赖 include/lib 经上游 CMDLINE_CPPFLAGS/CMDLINE_LDFLAGS 钩子注入 (knowledge_ref: E2182)"
- "xorgproto 被传递依赖以 visible=False 引用时其 include 目录不进 cpp_info 聚合, 需 force=True 直接声明 (knowledge_ref: E2183)"
- "命令行 PROGRAMS 赋值会抑制上游 Makefile 条目 +=acctdump 的条件追加, 显式列出即可包含 (knowledge_ref: E2182)"

