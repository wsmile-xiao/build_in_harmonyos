# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: chiark-utils/8.0.1
homepage: "https://www.chiark.greenend.org.uk/ucgi/~ian/git/chiark-utils.git"

# 上游测试命令分析 (R51 三步法申报):
#   1. 清点: cprogs/Makefile 无 check/test 目标 (make -n check => "No rule to
#      make target 'check'"); 全包唯一测试是 cprogs/really.testcases。
#   2. 运行条件: really.testcases 是 Perl 驱动的 setuid 工具测试, 需要 root、
#      /etc/inittab、/etc/rc.local 与专用测试用户 testac (uid 1000)。
#      CI/worker 环境无 Perl 工具链且无 root —— 不可运行, 原因如实申报。
#   3. 结论: 上游无可在本平台运行的自带测试; 消费者测试改为真实执行
#      适配产物的 with-lock-ex 与 summer (见 test_package/conanfile.py)。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: really.testcases
    source: chiark-utils-8.0.1/cprogs/really.testcases
    description: "setuid 工具 really 的特权切换用例 (Perl, 需 root + testac 用户 + /etc/inittab, CI 不可运行)"
    command: "./really.testcases"

test_package_tests:
  - file: test_smoke.sh (L0c 测试源文件, conanfile.test() 调用)
    description: "真实执行 with-lock-ex: 文件锁获取 + 锁下子进程执行 + 输出断言 (seq 生成输入, grep 断言第 2 行存在)"
    command: "with-lock-ex -w test.lock sh -c 'cat lockproof.txt'"
  - file: test_smoke.sh
    description: "真实执行 summer: 文件名经 stdin 传入, 校验和输出含文件名与哈希列 (grep 断言)"
    command: "ls sumfile.txt | summer"

# 断言数: lock 子进程输出 grep (1) + summer 行数/非空 (2)
assertion_count: 3
