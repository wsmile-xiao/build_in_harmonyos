# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: conjure_enum/1.2.0
homepage: "https://github.com/fix8mt/conjure_enum"

# 上游测试命令 (ctest -N 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本机实测：Catch2 v3 devel，utests/unittests+edgetests，
# ctest 51/51 全部通过；示例 srcloctest/example/statictest/cbenchmark 编译通过）
upstream_tests:
  - file: utests/unittests.cpp
    source: conjure_enum-1.2.0/utests/unittests.cpp
    description: "上游 Catch2 单元测试"
    command: "./unittests"
    result: "51/51 passed (本地 ctest 实测)"
  - file: utests/edgetests.cpp
    source: conjure_enum-1.2.0/utests/edgetests.cpp
    description: "上游 Catch2 边界测试"
    command: "./edgetests"

# test_package 中自带的测试 (消费者视角验证，真实调用库 API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：conjure_enum 反射 / conjure_type 类型名 / enum_bitset 位集"
    command: "./test_conjure_enum"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 51