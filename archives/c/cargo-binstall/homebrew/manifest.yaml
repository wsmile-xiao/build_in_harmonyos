software: cargo-binstall
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/homebrew/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "homebrew"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ghfast.top/https://github.com/cargo-bins/cargo-binstall/releases/download/v1.19.1/cargo-binstall-aarch64-unknown-linux-musl.full.tgz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: precompiled (rustc SIGSEGV on HarmonyOS, use GitHub binary)
  system: custom
  build_system: precompiled

  # 配置选项列表 (no source compilation needed)
  configure_options:
    - "--precompiled-binary"

  # 编译依赖列表 (no deps, binary is self-contained)
  dependencies: []

  # 编译器 (N/A - precompiled)
  cc: precompiled
  cxx: precompiled

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Rust static musl binary works on HarmonyOS Kernel 1.12.0 (contradicts prior SIGSEGV expectation)"
  - "GitHub direct SSL fails, need ghfast.top proxy + SSL_CERT_FILE env"
  - "cargo-binstall full.tgz includes detect-targets and detect-wasi helper binaries"
