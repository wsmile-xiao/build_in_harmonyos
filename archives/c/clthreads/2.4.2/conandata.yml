sources:
  url: "https://kokkinizita.linuxaudio.org/linuxaudio/downloads/clthreads-2.4.2.tar.bz2"
  sha256: "c659b14c0c4055c44432cb83060b95d30ae0c1ecc6f50d73968e239c100f7a31"

patches:
  - patch_file: "patches/0001-makefile-cross-compile-install.patch"
    patch_description: "Drop -march=native for cross builds, wire the CLTHREADS_NO_PTHREAD_CANCEL make variable into CPPFLAGS, and add a check target."
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-pthread-cancel-stub.patch"
    patch_description: "Retain pthread_cancel, with an explicit OHOS no-op fallback selected by the recipe-provided CLTHREADS_NO_PTHREAD_CANCEL macro."
    patch_type: "portability"
  - patch_file: "patches/0003-add-upstream-api-test.patch"
    patch_description: "Add the source-tree API test used by make check."
    patch_type: "test"
