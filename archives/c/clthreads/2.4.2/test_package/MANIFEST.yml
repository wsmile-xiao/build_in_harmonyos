package: clthreads/2.4.2
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/downloads/index.html"

upstream_check_command: "make -C source check"
upstream_test_in_build: true
upstream_test_command: "make -C source check"
upstream_tests:
  - file: test_clthreads.cc
    source: clthreads-2.4.2/source/test_clthreads.cc
    description: "Source-tree API test for mutexes, event queues, messages, and Textmsg."
    command: "./test_clthreads"

test_package_tests:
  - file: test_clthreads.cpp
    description: "Links clthreads and checks mutex, event queue, message, and Textmsg behavior."
    command: "test_clthreads"
  - file: test_clthreads_threads.cpp
    description: "Consumer use case: H_thread worker (real pthread via thr_start), cross-thread Textmsg request/reply queues, protocol-terminated detached thread, message ownership accounting."
    command: "test_clthreads_threads"

assertion_count: 20
