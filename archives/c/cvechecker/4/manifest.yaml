knowledge_gained:
  - "The GitHub archive tarball of cvechecker 4.0 is a git snapshot: it carries configure.ac and a committed configure, but no generated Makefile.in / aclocal.m4 / config.h.in; the tree must be bootstrapped with `autoreconf -fi` before configure."
  - "configure.ac unconditionally requires libbsd via PKG_CHECK_MODULES; libbsd has no published conan recipe (absent from ohpcd and conancenter), so a conan requires breaks graph resolution. cvechecker only uses libbsd's strlcpy; the recipe synthesizes a minimal vendored libbsd (real strlcpy + bsd/string.h + libbsd.pc) in build() instead."
  - "argp is not part of the musl-based OHOS libc; argp.h is looked up by AC_CHECK_HEADERS and must be supplied through the argp-standalone conan package by injecting its include dir into the toolchain flags."
  - "Upstream ships no automated tests: no Makefile.am defines a TESTS/check target and `make check` runs nothing in every subdirectory; the adaptation validates the packaged tools through the consumer test_package instead."
