# test_package/MANIFEST.yml
# Upstream test declaration for cvechecker 4 (release tag cvechecker-4.0).
# Upstream ships no automated tests; the consumer test below validates the
# packaged application instead.

package: cvechecker/4
homepage: "https://github.com/sjvermeu/cvechecker"

# ---- Upstream test audit ---------------------------------------------------
# Audited the cvechecker-4.0 source tree and build files (no tests exist):
upstream_tests_exist: false
upstream_test_audit:
  - source: "cvechecker-4.0 source tree (root and src/)"
    reason: "There is no tests/, test/ or *_test.c test-harness directory any level; the only files under src/ are the cvechecker application sources plus sqlite3_impl/mysql_impl/dummy backends."
  - source: "Makefile.am, src/Makefile.am, data/conf/scripts/docs/Makefile.am"
    reason: "No file defines a TESTS, check_PROGRAMS or meaningful check target; they only declare SUBDIRS, bin_PROGRAMS, bin_SCRIPTS and DATA/MANS."
  - source: "Alpine Linux 4.0 build log (make check)"
    reason: "Running `make check` over all subdirectories reports 'Nothing to be done for check' in every subdirectory (src/data/conf/scripts/docs), i.e. the check target is an empty automake default."
  - conclusion: "Upstream 4.0 provides no automated tests; the adaptation's test_package validates the installed cvechecker binary as a runtime consumer check and does not claim upstream coverage."

# rule4 强制字段：upstream_test_total 必须显式声明（缺失按 0 处理会被拒绝）。
# cvechecker 4.0 上游经完整审计确认确实没有任何自动化测试（源码树无 tests/、
# 各 Makefile.am 无 TESTS/check_PROGRAMS、make check 为空操作，见上方审计），
# 官方注册总数即 0，口径为 autotools_tests（automake 无测试注册）。
upstream_test_total: 0
upstream_test_count_method: autotools_tests
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_skipped: 0

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ---- Consumer tests (test_package) -----------------------------------------
# test_package/conanfile.py runs test_cvechecker.sh against the packaged
# bin/cvechecker, parses its deterministic "RESULT: P passed, F failed" trailer
# into HMBS_TEST_PACKAGE_RESULT, and emits HMBS_UPSTREAM_TEST_RESULT
# (status=no_tests, 0 counts) - the real machine-evidence the L0 gate requires.
test_package_tests:
  - file: test_cvechecker.sh
    description: "Write a minimal sqlite-backed cvechecker.conf, run the packaged `cvechecker` (CVECHECKER_CONFFILE set) through 4 real assertions: (1) `--help` exits 0 (argp help path), (2) `--help` output is non-empty, (3) `--help` output contains argp 'Usage' text (proving the binary and its statically-linked dependencies execute and its libconfig configuration parses), (4) negative control - an unknown long option is rejected by argp (proving the harness observes real failures). Emits a machine-readable RESULT trailer parsed by test_package/conanfile.py."
    command: "sh test_cvechecker.sh <package>/bin/cvechecker <workdir>"

assertion_count: 4
