software: cvechecker
display: "cvechecker"
description: "Match the installed software against a local CVE database and report potential vulnerabilities"
category: utility
homepage: "https://github.com/sjvermeu/cvechecker"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub archive tarball is a git snapshot; bootstrap the tree with `autoreconf -fi` (no generated Makefile.in in the tarball)."
    - "argp.h is not part of the musl-based OHOS libc; supply it via argp-standalone and inject its include dir into the toolchain flags."
    - "configure.ac unconditionally requires libbsd and libconfig via pkg-config, plus sqlite3 (default backend); libconfig/sqlite3 are discovered through PkgConfigDeps. libbsd has no published conan package, so the recipe synthesizes a minimal vendored libbsd (real strlcpy + bsd/string.h + libbsd.pc) in build() because cvechecker only uses its strlcpy."
  common_dependencies:
    - libconfig
    - sqlite3
    - argp-standalone
  vendored:
    - "libbsd (strlcpy only)"

versions:
  "4":
    status: built
    build_date: 2026-09-29
    source_url: "https://github.com/sjvermeu/cvechecker/archive/refs/tags/cvechecker-4.0.tar.gz"
    source_sha256: "d48b4c1976d866f6cf493340dc48e4c2b67d2394b6b5467ddc760b0f82466c4d"
