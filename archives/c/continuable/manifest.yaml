software: continuable
display: "continuable"
description: "C++14 asynchronous allocation-aware futures and continuations (header-only)"
category: foundation
homepage: "https://github.com/Naios/continuable"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only C++14 库；包内提供 continuable/ 公开头文件和 CMake package 元数据。"
    - "公开 API 通过 function2 完成类型擦除，依赖 ohpcd 已发布的 function2/4.2.3。"
    - "OHOS/Linux 使用 pthread 系统库；配方使用 in (Linux, OHOS) 处理系统分支。"
    - "源码归档的 Git submodule 目录为空；Conan 包不构建示例和上游测试，设备验证另行使用递归 submodule 检出。"
  common_dependencies:
    - "function2/4.2.3"

versions:
  "4.2.2":
    status: built
    build_date: "2026-09-02"
    conan_ref: "continuable/4.2.2"
