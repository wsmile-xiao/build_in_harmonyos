# test_package/MANIFEST.yml — continuable/4.2.2
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md.

package: continuable/4.2.2
homepage: "https://github.com/Naios/continuable"

# The release archive has empty Git submodule directories, so the Conan
# header-only build does not run the upstream CTest suite. Initialize only the
# four top-level submodules needed by continuable; the nested function2 test
# submodule points at a missing revision in the 4.2.2 superproject.
upstream_check_command: "git clone --branch 4.2.2 https://github.com/Naios/continuable.git continuable-4.2.2 && git -C continuable-4.2.2 submodule update --init dep/asio/asio dep/benchmark/benchmark dep/function2/function2 dep/googletest/googletest && cmake -S continuable-4.2.2 -B continuable-4.2.2/build -DCTI_CONTINUABLE_WITH_EXAMPLES=ON -DCTI_CONTINUABLE_WITH_BENCHMARKS=OFF && for t in test-threads test-link test-continuable-single test-continuable-async test-continuable-multi-0 test-continuable-multi-1 test-continuable-multi-2 test-continuable-multi-3 test-continuable-multi-4 test-continuable-multi-ready test-mock test-playground; do cmake --build continuable-4.2.2/build --target $t --parallel 1 || exit 1; done && ctest --test-dir continuable-4.2.2/build --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build --output-on-failure"

upstream_tests:
  - file: test/threads/test-threads.cpp
    source: continuable-4.2.2/test/threads/test-threads.cpp
    description: "Thread executor and continuation behavior"
    command: "ctest --test-dir build -R '^continuable-threads-tests$' --output-on-failure"
  - file: test/link/test-link.cpp
    source: continuable-4.2.2/test/link/test-link.cpp
    description: "Link and translation-unit integration"
    command: "ctest --test-dir build -R '^continuable-link-tests$' --output-on-failure"
  - file: test/unit-test/single/test-continuable-promise.cpp
    source: continuable-4.2.2/test/unit-test/single/test-continuable-promise.cpp
    description: "Single-step promise, result and type-erasure tests"
    command: "ctest --test-dir build -R '^continuable-unit-tests-single$' --output-on-failure"
  - file: test/unit-test/async/test-continuable-async.cpp
    source: continuable-4.2.2/test/unit-test/async/test-continuable-async.cpp
    description: "Asynchronous executor tests"
    command: "ctest --test-dir build -R '^continuable-unit-tests-async$' --output-on-failure"
  - file: test/unit-test/multi/test-continuable-base-chaining.cpp
    source: continuable-4.2.2/test/unit-test/multi/test-continuable-base-chaining.cpp
    description: "Multi-step continuation suite, step 0"
    command: "ctest --test-dir build -R '^continuable-unit-tests-multi-0$' --output-on-failure"
  - file: test/unit-test/multi/test-continuable-base-chaining.cpp
    source: continuable-4.2.2/test/unit-test/multi/test-continuable-base-chaining.cpp
    description: "Multi-step continuation suite, step 1"
    command: "ctest --test-dir build -R '^continuable-unit-tests-multi-1$' --output-on-failure"
  - file: test/unit-test/multi/test-continuable-base-chaining.cpp
    source: continuable-4.2.2/test/unit-test/multi/test-continuable-base-chaining.cpp
    description: "Multi-step continuation suite, step 2"
    command: "ctest --test-dir build -R '^continuable-unit-tests-multi-2$' --output-on-failure"
  - file: test/unit-test/multi/test-continuable-base-chaining.cpp
    source: continuable-4.2.2/test/unit-test/multi/test-continuable-base-chaining.cpp
    description: "Multi-step continuation suite, step 3"
    command: "ctest --test-dir build -R '^continuable-unit-tests-multi-3$' --output-on-failure"
  - file: test/unit-test/multi/test-continuable-base-chaining.cpp
    source: continuable-4.2.2/test/unit-test/multi/test-continuable-base-chaining.cpp
    description: "Multi-step continuation suite, step 4"
    command: "ctest --test-dir build -R '^continuable-unit-tests-multi-4$' --output-on-failure"
  - file: test/unit-test/multi/test-continuable-base-chaining.cpp
    source: continuable-4.2.2/test/unit-test/multi/test-continuable-base-chaining.cpp
    description: "Ready continuable multi-step suite"
    command: "ctest --test-dir build -R '^continuable-unit-tests-multi-ready$' --output-on-failure"
  - file: test/mock/test-mock.cpp
    source: continuable-4.2.2/test/mock/test-mock.cpp
    description: "Mock promise and continuation behavior"
    command: "ctest --test-dir build -R '^continuable-mock-tests$' --output-on-failure"
  - file: test/playground/test-playground.cpp
    source: continuable-4.2.2/test/playground/test-playground.cpp
    description: "Public-header playground integration"
    command: "ctest --test-dir build -R '^continuable-playground-tests$' --output-on-failure"

test_package_tests:
  - file: test_continuable.cpp
    description: "Compile and run three public API checks: then/to_future, when_all, and fail recovery"
    command: "./test_continuable"

upstream_test_count: 12
test_package_test_count: 1
assertion_count: 3
