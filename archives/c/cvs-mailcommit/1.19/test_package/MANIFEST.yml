package: cvs-mailcommit/1.19
homepage: "https://tracker.debian.org/pkg/cvs-mailcommit"

# 上游无测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）
# conanfile build() 不集成上游测试；perl -c 仅为配方内语法自检，非上游套件。

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "cvs-mailcommit_1.19.orig.tar.gz (Debian 官方池，11241 字节，sha256=4e882554262dc09ede8082dd1b6371b15c4b0ecb4a57f529bd81b4b30c62ed8b)"
    finding: "上游发布包为单个 Perl 脚本（sloc: perl 约 369 行，makefile 约 2 行）；无 tests/、test/、t/ 目录，无任何 *test*、Test*、*_test.pl 源文件"
  - path: "orig tarball 顶层构建接线"
    finding: "无 Makefile.PL / Build.PL / CMakeLists.txt / Makefile.am / configure / meson.build；无 enable_testing / add_test / TESTS / check_PROGRAMS / TESTS_ENVIRONMENT 等测试变量，无 check / test / ctest / pytest 入口"
  - path: "debian/ 打包（sources.debian.org/src/cvs-mailcommit/1.19-7/debian：changelog/control/copyright/cvs-mailcommit.1/install/manpages/rules/watch）"
    finding: "debian/rules 为极简安装规则（仅安装脚本与 man 页），无 dh_auto_test / make check / ctest 调用；debian/ci.yml 仅做构建安装验证。从未运行任何上游测试，佐证上游无可接入的测试套件"
  - path: "README.Debian / cvs-mailcommit.1 手册页"
    finding: "仅描述 CVS loginfo 联动配置与邮件发送用法，无测试运行说明"
  - path: "类比先例 cvsweb 3.0.6（纯 Perl，无上游套件，upstream_tests: []）"
    finding: "同类 Debian 纯 Perl 工具均按 no_tests 口径申报；perl -c 语法自检为配方内最佳实践自检，不计入上游测试发现数"

test_package_tests:
  - file: test_cvs_mailcommit.py
    description: "消费者功能测试：bin/cvs-mailcommit 存在且可执行、perl -c 语法通过、功能运行有输出"
    command: "python3 test_cvs_mailcommit.py <pkg_root>"
assertion_count: 3
