source:
  url: "https://quitte.de/dsp/caps_0.9.26.tar.bz2"
  sha256: ""
  tar_format: tar.bz2

build:
  system: makefile
  configure_options:
    - "OHOS_BUILD=1"
    - "PREFIX=$DEFAULT_PREFIX"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.patch"
  - "0002-basics.h.patch"
  - "0003-configure.py.patch"
  - "0004-dsp-v4f.h.patch"
  - "0005-dsp-v4f_IIR2.h.patch"

knowledge_gained:
  - "caps uses custom configure.py + Makefile, not autotools"
  - "basics.h uses glibc-specific __int8_t etc., need #ifdef __OHOS__ to use standard int8_t"
  - "v4f.h/v4f_IIR2.h use GCC builtins (__builtin_sinf) as template args, clang doesn't support"
  - "exp10f is GNU extension not in musl, need powf(10,x) replacement"

patch_generation:
  method: per-file-difflib
  source_orig_hash: 438ec697c650764f
  source_work_hash: dd3d37e409ad178d
  patches_count: 5

