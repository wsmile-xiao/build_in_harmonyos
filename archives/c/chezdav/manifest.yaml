software: chezdav
display: "chezdav"
description: "A small command-line WebDAV server from the GNOME phodav project"
category: network
homepage: "https://gitlab.gnome.org/GNOME/phodav"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Builds the phodav 3.0 source and packages only the chezdav command-line server"
    - "Disables optional Avahi/mDNS support while retaining local and public WebDAV serving"
    - "Runs the upstream 18-case localhost WebDAV suite on the native HarmonyOS worker"
  common_dependencies:
    - glib2/2.88.0
    - libsoup3/3.6.5-r2
    - libxml2/2.15.3.1

versions:
  "3.0":
    status: pending
    build_date: "2026-09-09"
    conan_ref: "chezdav/3.0"
