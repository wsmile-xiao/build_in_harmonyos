patches:
  "3.0":
    - patch_file: "patches/0001-build-chezdav-with-bundled-uuid.patch"
      patch_description: >-
        Provide a private RFC 4122 UUID helper using GLib symbols exported by
        shared libsoup3, and omit the unrelated spice-webdavd target so the
        chezdav-only package links on HarmonyOS without another GLib copy.
      patch_type: "portability"
