package: chezdav/3.0
homepage: "https://gitlab.gnome.org/GNOME/phodav"

upstream_check_command: "meson test -C build"
upstream_test_in_build: true
upstream_test_command: "meson test -v --no-rebuild --timeout-multiplier=16"

upstream_tests:
  - file: tests/virtual-dir.c
    source: phodav-3.0.tar.xz/tests/virtual-dir.c
    description: "GLib parameterized WebDAV integration suite covering GET, MKCOL, COPY, PUT, and DELETE against a localhost phodav server"
    command: "meson test test-virtual-dir"
    case_count: 18
  - file: tests/virtual-dir-server.c
    source: phodav-3.0.tar.xz/tests/virtual-dir-server.c
    description: "Fixture server used by the 18 parameterized virtual-directory WebDAV cases"
    command: "tests/virtual-dir-server --quit-on-stdin"
    case_count: 0

test_package_tests:
  - file: test_chezdav.sh
    description: "Executes chezdav --version and --help, starts the packaged server on loopback, and verifies a real HTTP GET response"
    command: "bash test_chezdav.sh <chezdav> <work-dir>"
    assertion_count: 3

assertion_count: 3
assertion_count_basis: "Three explicit packaged-binary checks; the 18 registered upstream GLib cases are counted separately"
