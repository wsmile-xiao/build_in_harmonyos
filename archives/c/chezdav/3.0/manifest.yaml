version: "3.0"
software: chezdav
status: pending
build_date: "2026-09-09"
build_system: meson
conan_ref: "chezdav/3.0"

source:
  url: "https://download.gnome.org/sources/phodav/3.0/phodav-3.0.tar.xz"
  sha256: "392ec2d06d50300dcff1ef269a2a985304e29bce3520002fca29f2edc1d138d1"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Ddefault_library=static"
    - "-Davahi=disabled"
    - "-Dgtk_doc=disabled"
    - "-Dsystemdsystemunitdir="
    - "-Dudevrulesdir="
  dependencies:
    - glib2/2.88.0
    - libsoup3/3.6.5-r2
    - libxml2/2.15.3.1
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-build-chezdav-with-bundled-uuid.patch"

knowledge_gained:
  - "chezdav 3.0 is built from the official phodav 3.0 source tree"
  - "The upstream Meson suite contains one executable with 18 parameterized localhost WebDAV cases"
  - "The generated GLib and libsoup pkg-config link lines must avoid a second static GObject copy beside shared libsoup3"
  - "The shared libsoup3 artifact omits g_uuid_string_random; a private RFC 4122 helper can use its exported g_random_int and g_strdup_printf symbols"
