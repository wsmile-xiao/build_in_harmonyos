package: cern/0.4.6
homepage: "https://github.com/dpiparo/vdt"

upstream_tests_exist: true

upstream_test_audit:
  source_tarball: "v0.4.6.tar.gz"
  source_sha256: "1820feae446780763ec8bbb60a0dbcf3ae1ee548bdd01415b1fb905fd4f90c54"
  top_level_files:
    - CMakeLists.txt       # DIAG option builds progs/ + progs/units/
    - include/vdtMath.h    # main header, inline scalar functions
    - include/exp.h        # exp implementations
    - lib/CMakeLists.txt   # builds vdt shared/static library
    - progs/units/         # 12 function unit tests + diagnostic helpers
    - src/signatures_generator.py  # generates vector signatures, needs Python
  scanned_for:
    - "add_test / enable_testing (ctest)"
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "progs/units/*_test.cpp"
    - "DIAG=1 diagnostic executables"
    - "find . -name '*test*' (full tree)"
  scan_result: "No ctest add_test/enable_testing; no gtest/pytest; 12 standalone executables under progs/units (exp/log/sqrt/sin/cos/inv/tan/tanh/asin/acos/atan/atan2)_test.cpp plus fpDifferentBit/printInstSet/test_randomPool/test_fcnResponse/test_fcnComparison/test_fcnPerformance; built when DIAG=ON"
  make_check_output: "No make check target; upstream tests are DIAG executables run directly from source bin/"
  reason: "VDT 0.4.6 upstream test surface is 12 function executables built with -DDIAG=ON, each prints accuracy diffs via printFuncDiff and exits 0 on success; recipe build() runs all 12 binaries from source bin/ and emits HMBS_UPSTREAM_TEST_RESULT with real counts"

upstream_check_command: "cmake -DDIAG=ON && cmake --build . && ./bin/exp_test"
upstream_test_in_build: true
upstream_test_command: "progs/units 12 function tests (DIAG=ON)"

upstream_tests:
  - file: progs/units/exp_test.cpp
    source: vdt-0.4.6/progs/units/exp_test.cpp
    description: "exp scalar/vector accuracy diff vs libm"
    command: "./bin/exp_test"
  - file: progs/units/log_test.cpp
    source: vdt-0.4.6/progs/units/log_test.cpp
    description: "log scalar/vector accuracy diff vs libm"
    command: "./bin/log_test"
  - file: progs/units/sin_test.cpp
