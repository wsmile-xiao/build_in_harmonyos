software: cern
version: "0.4.6"
status: built
build_date: "2026-09-11"
build_system: cmake

source:
  url: "https://github.com/dpiparo/vdt/archive/refs/tags/v0.4.6.tar.gz"
  sha256: "1820feae446780763ec8bbb60a0dbcf3ae1ee548bdd01415b1fb905fd4f90c54"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DSSE=OFF"
    - "-DNEON=OFF"
    - "-DAVX=OFF"
    - "-DAVX2=OFF"
    - "-DFMA=OFF"
    - "-DDIAG=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"

knowledge_gained:
  - "CERN VDT is header-inline plus small libvdt for vector signatures"
  - "Upstream SSE=ON emits -msse which clang aarch64 rejects, must pass SSE=OFF NEON=OFF on OHOS"
  - "DIAG=ON builds 12 unit executables to source bin/, no ctest registration"
  - "DIAG links test_fcnPerformance with -lrt which fails on OHOS libc, patched to empty on HarmonyOS"
  - "src/ needs Python Interpreter for signatures_generator.py, provided by真机 python3"
