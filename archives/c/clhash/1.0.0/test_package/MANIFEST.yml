package: clhash/1.0.0
homepage: "https://github.com/simdhash/clhash"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

upstream_tests:
  - file: tests/unit.c
    source: clhash-1.0.0/tests/unit.c
    description: "C unit suite covering bit sensitivity, known-answer vectors, collision checks, and avalanche behavior."
    command: "./unit (CTest: clhash_unit)"
    test_functions: 4
    assertion_failure_macros: 12
  - file: tests/cppunit.cpp
    source: clhash-1.0.0/tests/cppunit.cpp
    description: "C++ wrapper overload consistency checks."
    command: "./cppunit (CTest: clhash_cppunit)"
    assertions: 4

test_package_tests:
  - file: test_clhash.c
    description: "Consumer test generates a key, checks a known answer, determinism, input sensitivity, empty input, bit restoration, and version macros."
    command: "./test_clhash"
  - file: test_ohos.c
    description: "HarmonyOS-specific consumer test checks the HarmonyOS runtime identity and executes clhash through the OHOS consumer path."
    command: "./test_ohos"

assertion_count: 12
