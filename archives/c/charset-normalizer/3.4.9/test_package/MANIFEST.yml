# test_package/MANIFEST.yml — charset-normalizer 3.4.9
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: charset-normalizer/3.4.9
homepage: "https://github.com/Ousret/charset_normalizer"

# 上游测试套件：tests/ 目录 pytest 套件（charset-normalizer 零依赖，可本地运行）
upstream_check_command: "pytest tests/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: tests/
    source: charset_normalizer-3.4.9/tests/*.py
    description: "pytest 套件：本地实测 163 passed + 11 subtests passed（174/174 = 100%），零失败"
    command: "pytest tests/"

# test_package 消费者测试（R34 真实 API：import 打包的 charset_normalizer + 编码检测）
test_package_tests:
  - file: test_charset_normalizer.py
    description: "Imports packaged charset_normalizer and detects the encoding of a UTF-8 byte string via from_bytes().best()"
    command: "python3 test_charset_normalizer.py"

# 断言总数：1（编码检测结果校验）
assertion_count: 1
