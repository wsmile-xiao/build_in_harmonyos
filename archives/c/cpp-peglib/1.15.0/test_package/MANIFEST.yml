package: cpp-peglib/1.15.0
homepage: "https://github.com/yhirose/cpp-peglib"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: test/test_*.cc
    source: cpp-peglib-1.15.0/test/test_*.cc
    count: 503
    description: "计数口径：源码注册的 TEST/TEST_F 数量（grep 统计，与 PR 上游单元测试声明一致）。顶层 CMake 将 17 个 GoogleTest 源文件编译为 peglib-test-main，并由 gtest_discover_tests 注册独立 CTest 用例；CTest 实际注册并执行 502 个（gtest_discover_tests 展开差异，与 1.17.0 的 521/520 现象同因，见验证日志）。"
    command: "ctest --output-on-failure"

test_package_tests:
  - file: test_package.cpp
    count: 1
    description: "消费者测试构造 peg::parser，验证合法输入可解析、非法输入被拒绝，并通过 Conan CMake interface target 编译。"
    command: "./test_package"

assertion_count: 3
