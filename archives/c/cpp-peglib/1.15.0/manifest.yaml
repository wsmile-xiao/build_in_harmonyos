version: "1.15.0"
status: built
build_date: "2026-09-10"
conan_ref: "cpp-peglib/1.15.0"

validation_note: "配方基于仓库内已合入的 cpp-peglib 1.17.0 适配（commit 21d65a8be1）同构生成：CMake header-only INTERFACE 库。本地 Ubuntu 环境完成 conan create + 上游 CTest + 消费者测试验证；HarmonyOS PC 设备与远程 CI 验证结果待设备/CI 回填后更新。上游仓库内独立 rust-peglib 子项目被顶层 CMake 排除，不属于本 C++ 包构建范围。"

source:
  url: "https://github.com/yhirose/cpp-peglib/archive/refs/tags/v1.15.0.tar.gz"
  sha256: "5bf1b6bf854e9751658ec85a7cba1beeb81fa6a6baff2af6369a2e1be0a2b99a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_CXX_STANDARD=17"
    - "-DCMAKE_CXX_EXTENSIONS=OFF"
    - "-DBUILD_TESTS=ON"
    - "-DPEGLIB_BUILD_BENCHMARK=OFF"
    - "-DPEGLIB_BUILD_EXAMPLES=OFF"
    - "-DPEGLIB_BUILD_LINT=OFF"
    - "-DPEGLIB_BUILD_PL0=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "cpp-peglib 1.15.0 是 C++17 header-only INTERFACE 库，生产包只安装 peglib.h"
  - "顶层 CMake 测试由 gtest_discover_tests 注册独立测试用例；默认 FetchContent 获取 GoogleTest"
  - "上游仓库包含独立 rust-peglib 子项目，本包只构建顶层 C++ 项目"

test_results:
  type: local-linux-native
  upstream_registered_cases: 503
  upstream_cases_executed: 502
  upstream_cases_passed: 502
  consumer_tests_compiled: 1
  consumer_tests_executed: 1
  consumer_tests_passed: 1
  device: "Ubuntu x86_64 (本地验证环境)"
  validation_date: "2026-09-10"
  note: |
    声明口径：上游源码注册 TEST/TEST_F 503（与 PR 上游单元测试声明一致）；
