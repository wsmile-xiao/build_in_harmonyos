software: cryptominisat
# cryptominisat 5.14.4 编译记录
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "5.14.4"
status: built
build_date: "2026-05-20"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "file:///storage/Users/currentUser/tmp/downloads/cryptominisat-5.14.4.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_C_FLAGS=-D__OHOS__"
    - "-DCMAKE_CXX_FLAGS=-D__OHOS__"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DNOBREAKID=ON"
    - "-DNOMPI=ON"
    - "-DNOZLIB=OFF"
    - "-DENABLE_TESTING=OFF"
  dependencies:
    - zlib/1.3.1
    - gmp/6.3.0
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-ohos-fix-cpp20-ranges-compatibility.patch"
  - "0002-ohos-fix-std-ranges-find.patch"
  - "0003-ohos-fix-iota-loop.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HarmonyOS libcxx (clang 15) 不完整支持 C++20 ranges 特性（std::views::iota, std::ranges::find）"
  - "CMake 平台检测需设置 CMAKE_SYSTEM_NAME=Linux 以绕过 HarmonyOS 识别问题"
  - "需通过 CMAKE_C_FLAGS/CMAKE_CXX_FLAGS 定义 __OHOS__ 宏以启用条件编译"
  - "FetchContent 依赖 (CaDiCaL, CaDiBaCk) 下载耗时较长（约 3 分钟）"