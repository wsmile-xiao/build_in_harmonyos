software: cpprestsdk
# 版本级 manifest 模板
# 文件位置: archives/c/cpprestsdk/2.10.19/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.10.19"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/cpprestsdk/cpprestsdk-2.10.19.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCPPREST_EXCLUDE_WEBSOCKETS=OFF"
    - "-DCPPREST_EXCLUDE_COMPRESSION=OFF"
    - "-DWERROR=OFF"
    - "-DBUILD_TESTS=OFF"
    - "-DBUILD_SAMPLES=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - boost/1.81.0
    - openssl/1.1.1w
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "websocketpp md5.hpp 有 null pointer subtraction 警告，需禁用 WERROR"