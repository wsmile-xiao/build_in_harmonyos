# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cpp_redis/4.3.1
homepage: "https://github.com/Cylix/cpp_redis"

# 上游测试命令: CMake + CTest (tests/ 子目录, gtest)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游实际运行的测试程序（本地实跑记录；R03 在真实 redis 8.6.0 服务下 3 类入口全部实测通过）
upstream_tests:
  - file: tests/sources/spec/reply_spec.cpp
    source: cpp_redis-4.3.1/tests/sources/spec/reply_spec.cpp
    description: "reply 类型/取值单元测试 (本地实测 6/6 PASS)"
    command: "./reply_spec"
  - file: tests/sources/spec/builders/array_builder_spec.cpp
    source: cpp_redis-4.3.1/tests/sources/spec/builders/array_builder_spec.cpp
    description: "array builder 单元测试 (本地实测 7/7 PASS)"
    command: "./array_builder_spec"
  - file: tests/sources/spec/builders/bulk_string_builder_spec.cpp
    source: cpp_redis-4.3.1/tests/sources/spec/builders/bulk_string_builder_spec.cpp
    description: "bulk string builder 单元测试 (本地实测 9/9 PASS)"
    command: "./bulk_string_builder_spec"
  - file: tests/sources/spec/builders/integer_builder_spec.cpp
    source: cpp_redis-4.3.1/tests/sources/spec/builders/integer_builder_spec.cpp
    description: "integer builder 单元测试 (本地实测 10/10 PASS)"
    command: "./integer_builder_spec"
  - file: tests/sources/spec/redis_client_spec.cpp
    source: cpp_redis-4.3.1/tests/sources/spec/redis_client_spec.cpp
    description: "redis client 集成测试；R03 在真实 redis 8.6.0 服务下实测 26/26 PASS"
    command: "./redis_client_spec"
  - file: tests/sources/spec/redis_subscriber_spec.cpp
    source: cpp_redis-4.3.1/tests/sources/spec/redis_subscriber_spec.cpp
    description: "redis subscriber 集成测试；R03 在真实 redis 8.6.0 服务下实测 29/29 PASS"
    command: "./redis_subscriber_spec"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp