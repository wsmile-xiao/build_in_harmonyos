# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.7y/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.7y"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://invisible-mirror.net/archives/cproto/cproto-4.7y.tgz"

  # 源码校验和
  sha256: "0bd1d8be8ff0a4ca43f947f95750d34f64eda93c9e2ca79100fd60140b7c6331"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 需打 HarmonyOS 补丁（patch-autotools-ohos.pl + 手动添加 ohos* OS 类型）"
  - "E002: 系统 tmpfile() 在 HMDFS 上失败（/tmp 只读），需禁用 HAVE_TMPFILE 改用自带实现（使用 TMPDIR）"
  - "HMDFS: config.status 的 umask 077 导致临时目录不可写，需替换 umask 077 为 umask 022 添加 chmod 755"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/cproto-4.7y.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/cproto-4.7y.work
  source_orig_hash: 1b7abadbc94a5e44
  source_work_hash: 386c0b78eccbb0af
  generated_at: '2026-06-11T14:47:33'
  patches_count: 2

patch_classification:
  - file: 0001-config.guess.patch
    type: platform
    platform_only: True
    guard: '#ifdef __OHOS__'
    description: '添加 __OHOS__ LIBC 检测 + HarmonyOS 系统识别分支'
  - file: 0002-config.sub.patch
    type: platform
    platform_only: True
    guard: 'ohos*'
    description: '添加 ohos-linux 三元组 + ohos* OS 类型 + linux-ohos 内核列表'
