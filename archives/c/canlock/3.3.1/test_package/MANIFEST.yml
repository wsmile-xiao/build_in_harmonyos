package: canlock/3.3.1
homepage: "https://micha.freeshell.org/libcanlock/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: test/shatest
    description: "SHA-1 through SHA-512 implementation vectors"
    command: "make check"
  - file: test/shatest_check.sh
    description: "Published digest vectors checked with the shatest utility"
    command: "make check"
  - file: test/canlocktest.c
    description: "Core API generation, verification, and error handling"
    command: "make check"
  - file: test/canlocktest_multi.c
    description: "Multiple Cancel-Key and Cancel-Lock verification"
    command: "make check"
  - file: test/canlocktest_legacy.c
    description: "Version 2 compatibility API"
    command: "make check"
  - file: hp/test/mhptest1.sh..mhptest5.sh
    description: "Five complete-message header parser cases"
    command: "make check"
  - file: hp/test/hfptest1.sh, hp/test/hfptest2.sh, hp/test/hfptest_obs.sh
    description: "Three Cancel-Key/Cancel-Lock field parser cases"
    command: "make check"
  - file: hp/test/library_mhptest.c, hp/test/library_hfptest.c
    description: "Two installed-parser library tests skipped by upstream"
    command: "make check"
  - file: hp/test/library_unfold.c, hp/test/library_unfold_empty.c, hp/test/library_unfold_nocolon.c
    description: "Header unfolding with two expected-failure edge cases"
    command: "make check"

upstream_test_count: 18
upstream_expected_result: "14 PASS, 2 SKIP, 2 XFAIL"

test_package_tests:
  - file: test_canlock.c
    description: "Core RFC 8315 vectors, negative verification, relocatable hp parser, and CLI smoke tests"
    command: "./test_canlock && canlock --version && canlock-mhp --version && canlock-hfp --version"
  - file: test_canlock_ohos.c
    description: "OHOS-only macro, SHA-512 generation/verification, and secret-buffer clearing"
    command: "./test_canlock_ohos"

assertion_count: 16
