version: "3.3.1"
software: canlock
status: built
build_date: "2026-09-09"
conan_ref: "canlock/3.3.1"

source:
  url: "https://micha.freeshell.org/libcanlock/src/libcanlock-3.3.1.tar.bz2"
  sha256: "5acd6d59e1fdf2a8507887137cf7f3e862fec0c21cc079bba7068abf03e881d9"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--enable-hp"
    - "--enable-pc-files"
    - "--enable-legacy-api"
    - "--disable-dependency-tracking"
  dependencies:
    - "bison/3.8.2 (build)"
    - "flex/2.6.4 (build)"
  cc: clang

patches_applied:
  - "patches/0001-hp-src-parser.c.in.patch"
  - "patches/0002-build-aux-config.sub.patch"
  - "patches/0003-build-aux-config.guess.patch"
  - "patches/0004-configure-hmdfs-umask.patch"

knowledge_gained:
  - "The core library has no third-party runtime dependencies."
  - "The optional header parsers require Bison and Flex at build time."
  - "libcanlock-hp launches helper binaries, so absolute configure prefixes make binary packages non-relocatable."
  - "Upstream's recursive Automake setup requires an in-source build because generated headers and documentation templates are referenced from the source tree."
  - "Upstream test executables link static build-tree archives even when shared libraries are enabled; shared packages therefore remove those archives only after make check."
  - "The upstream suite contains 18 tests: 14 pass, 2 skip, and 2 expected failures."
  - "Upstream's bundled config.sub predates OHOS triplet support and must be patched in both the main and hp build trees."
  - "Upstream's bundled config.guess predates HarmonyOS host detection and must be patched in both the main and hp build trees for native OHOS workers."
  - "Autoconf's private config.status temporary directories are inaccessible on the native worker's HMDFS build tree, so both configure scripts use a less restrictive umask."
