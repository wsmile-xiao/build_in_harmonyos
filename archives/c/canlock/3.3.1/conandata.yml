sources:
  "3.3.1":
    url: "https://micha.freeshell.org/libcanlock/src/libcanlock-3.3.1.tar.bz2"
    sha256: "5acd6d59e1fdf2a8507887137cf7f3e862fec0c21cc079bba7068abf03e881d9"

patches:
  "3.3.1":
    - patch_file: "patches/0001-hp-src-parser.c.in.patch"
      patch_description: "0001 resolve installed header-parser helpers through PATH so Conan packages remain relocatable"
      patch_type: "portability"
    - patch_file: "patches/0002-build-aux-config.sub.patch"
      patch_description: "0002 accept linux-ohos target triplets in the main and header-parser config.sub files"
      patch_type: "portability"
    - patch_file: "patches/0003-build-aux-config.guess.patch"
      patch_description: "0003 identify native HarmonyOS hosts in the main and header-parser config.guess files"
      patch_type: "portability"
    - patch_file: "patches/0004-configure-hmdfs-umask.patch"
      patch_description: "0004 use an HMDFS-compatible umask for config.status temporary directories"
      patch_type: "portability"
