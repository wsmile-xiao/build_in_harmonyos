# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cbp2make/147
homepage: "https://sourceforge.net/projects/cbp2make/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "grep -icE 'test' cbp2make.cbp.mak.unix"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清点（R51）：上游无自动化测试套件。
# 证据：cbp2make.cbp.mak.unix 构建目标仅 Debug/Release/Doxygen/Profile/all
# （无 check/test 目标）；源码树无 test/ 目录；
# lib/tinyxml/xmltest.cpp 为第三方库 tinyxml 自带样例，未纳入 cbp2make
# 构建目标，不属 cbp2make 上游测试。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_consumer.c
    description: "消费者测试: 生成最小 Code::Blocks 工程 hello.cbp + hello.c，执行包内 cbp2make 转换为 Makefile，断言编译规则/-O2 选项传递/生成 Makefile 真实编译产物 (4 项检查)"
    command: "./test_consumer <cbp2make-path>"

# 测试断言总数 (实测, rule 4)
# 上游无自动化测试套件，上游测试用例数为 0
assertion_count: 0
