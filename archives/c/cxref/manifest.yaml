# 软件级 manifest — cxref
# 遵循 ARCHIVE-SPEC v3.0

software: cxref
display: "cxref"
description: "C 交叉引用与文档工具（Andrew M. Bishop），解析 C 源码生成函数/变量/类型/文件的交叉引用，输出 LaTeX/HTML/RTF/SGML；附带内嵌预处理器 cxref-cpp 与查询工具 cxref-query"
category: devel
homepage: "https://www.gedanken.org.uk/software/cxref/"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "autoconf-2.13 时代的老式 configure：AC_PROG_CC 按名字找 gcc/cc 不认 clang，编译器经 AutotoolsToolchain 环境以 CC=clang 注入（R33）"
    - "configure 与嵌套 cpp/configure 的 umask 077 → umask 022（E011，HMDFS UID 映射致临时目录不可写）"
    - "configure 前 unset CONFIG_SHELL：profile buildenv 的 hnp bash getcwd 在 HMDFS 上 EPERM，autoconf 中止（E386 同域）"
    - "cxref-cpp 把 datadir 绝对路径烧进二进制读 cxref-cpp.defines，configure --prefix 直接用最终包目录并原位安装，保证 bin/share 自洽"
    - "语言判定说明：lang_detect 把 contrib//doc/ 下 10 个 perl 与 1 个 python 辅助脚本计入分母误判 mixed；按 R47 '辅助脚本不算主体' 边界规则，主体为 C（src 15 + cpp 4 + query 3），任务语言 c 匹配"
  common_dependencies: []

versions:
  "1.6e":
    status: built
    build_date: 2026-09-11
