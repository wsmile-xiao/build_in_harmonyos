  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure.patch"
  - "0002-cpp-configure.patch"

knowledge_gained:
  - "autoconf-2.13 老 configure 的 AC_PROG_CC 不认 clang 按名查找，经 AutotoolsToolchain 以 CC 环境变量注入即可"
  - "嵌套子目录 configure（AC_CONFIG_SUBDIRS）的 umask 077 需与顶层一起修（E011），否则顶层过了子配置仍挂"
  - "cxref-cpp 把 datadir 绝对路径烧进二进制读 cxref-cpp.defines，configure --prefix 直接用最终包目录并原位安装，保证 bin/share 自洽"

