# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cxref/1.6e
homepage: "https://www.gedanken.org.uk/software/cxref/"

# 上游顶层与各子目录 Makefile.in 均无 check/test 目标
# （all: programs docs；install: programs），无任何测试注册入口，
# 源码包不含任何测试源码或测试脚本。
upstream_check_command: ""

# 上游无测试套件，因此 build() 中没有可集成的上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34: 实质驱动被测二进制)
# 单一消费者程序 test_cxref.c，以下按 3 条被测路径分列
test_package_tests:
  - file: test_cxref.c
    description: "cxref -html 处理样例 C 文件：断言退出码 0、sample.c.html 生成且内容含被引用函数 add"
    command: "./test_cxref <cxref-bin>"
  - file: test_cxref.c
    description: "未知选项 --version：断言退出码 1 且 usage 横幅含 Version 1.6e"
    command: "./test_cxref <cxref-bin>"
  - file: test_cxref.c
    description: "缺失输入文件：断言输出 Cannot access the file 错误消息（上游对坏文件以 rc=0 退出，按上游实际行为断言消息）"
    command: "./test_cxref <cxref-bin>"

# 测试断言总数 (test_cxref.c 中 check() 调用数)
assertion_count: 6
