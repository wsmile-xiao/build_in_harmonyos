# 版本级 manifest — cracklib 2.10.3
# 遵循 ARCHIVE-SPEC v2.0

version: "2.10.3"
software: cracklib

status: built
build_date: "2026-09-09"
build_system: autotools

source:
  url: "https://github.com/cracklib/cracklib/releases/download/v2.10.3/cracklib-2.10.3.tar.xz"
  sha256: "1d1b83676b5673051b9373e1ca0db81c1fa88faf9a195a3c1af984fd9c250d66"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
  - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu"
  - "--without-python --disable-nls"
  - "--enable-static (默认) / --enable-shared"
  - "make SUBDIRS=\"lib util\"（po/doc/python/dicts 裁剪）"
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
- "cracklib 2.10.3 发布 tarball 缺 check_SCRIPTS（both-endian.sh/checkdict.sh 未分发，上游 dist 缺陷）；3 个 check_PROGRAMS 是 stdin 交互驱动 → 发布包内上游 make check 不可用"
- "等效 L1：cracklib-format dicts/cracklib-small | cracklib-packer testdict 建典（54763 词），FascistCheck 断言典内词拒绝/过短拒绝/强密码通过"
- "test-data（10 词）是全量字典的弱密码表，词不在 cracklib-small 内，勿拿它对 small 典做断言"
- "FascistCheck 返回 NULL=通过、字符串=拒绝原因；弱密码断言对'过短'(abc→it is WAY too short)最稳（不依赖字典）"
