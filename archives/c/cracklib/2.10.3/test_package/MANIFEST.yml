# test_package/MANIFEST.yml — cracklib 2.10.3
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: cracklib/2.10.3
homepage: "https://github.com/cracklib/cracklib"

# 上游测试命令（手动复现：make check → util/ 下 check_PROGRAMS + check_SCRIPTS）
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试（层1）
upstream_test_in_build: true
upstream_test_command: "build() 内用上游 cracklib-format|cracklib-packer 建 testdict + FascistCheck 4 条语义断言（等效覆盖 check_SCRIPTS 判据）"

# 上游 make check 真相：util/Makefile.am 声明 3 个 check_PROGRAMS
#（testlib/testnum/teststr，stdin 交互驱动）+ 2 个 check_SCRIPTS
#（both-endian.sh/checkdict.sh），但**两个脚本未随 2.10.3 发布 tarball 分发**
#（上游 dist 缺陷，tarball 实解包验证），3 个驱动是交互式的 → 发布包内上游
#自动化测试不可直接运行。适配侧用上游建典工具链 + 公开 API FascistCheck 做
# 4 条语义断言等效覆盖（典内词×2 拒绝/过短拒绝/强密码通过）。
upstream_test_count: 5
upstream_test_cases_skipped: 5
skip_reason: "check_SCRIPTS 未随发布 tarball 分发（上游 dist 缺陷）+ check_PROGRAMS 为 stdin 交互驱动；以等效语义断言覆盖"
