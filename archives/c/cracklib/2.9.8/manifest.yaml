knowledge_gained:
- "cracklib 2.9.8 发布 tarball 无自动化 check 脚本（不同于 2.10.3 的 dist 缺陷，2.9.8 根本未声明 both-endian.sh/checkdict.sh）；3 个 check_PROGRAMS（testlib/testnum/teststr）是 stdin 交互驱动 → 默认环境下发布包内上游 make check 不可直接运行"
- "R02 环境构造后三入口真实运行 3/3：PWOpen(NULL) 空前缀被 packlib.c snprintf 格式化为字面 (null) 相对路径 → 把 cracklib-packer 建好的字典以字面 (null) 前缀装入运行 cwd 即命中（无需特权路径）；testlib 的 FascistCheck 内部 getpwuid 以 LD_PRELOAD getpwuid shim（等效 nss 来源，/etc/passwd 只读）提供条目后语义全对（双口径台账 3/3 100%）"
- "等效 L1：cracklib-packer 建 testdict（54763 词）+ FascistCheckUser 断言典内词拒绝/过短拒绝/强密码通过（CI 等效覆盖，另列）"
- "FascistCheckUser 返回 NULL=通过、字符串=拒绝原因；弱密码断言对'过短'(abc→it is WAY too short)最稳（不依赖字典）"
