# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cgicc/3.2.19
homepage: "https://www.gnu.org/software/cgicc/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 tarball 的 ./test/ 目录为空，Makefile.am 未注册 TESTS/check_PROGRAMS，
# 实际执行 `make check` 无任何测试用例运行（exit 0，无 PASS/FAIL 输出）。
upstream_test_in_build: false
upstream_test_command: "make check (no upstream tests registered)"

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用 cgicc C++ API（Cgicc 构造、CgiEnvironment::getRequestMethod、HTMLDoctype/HTTPHTMLHeader 渲染）"
    command: "./test_cgicc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4