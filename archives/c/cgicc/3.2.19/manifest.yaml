# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 工具链使用 libc++（无 libstdc++），cgicc Makefile 硬编码 -lstdc++ 需改为 -lc++"
  - "config.guess/config.sub 需支持 HarmonyOS/lunux-ohos triplet：config.guess 增加 *:HarmonyOS:*:* 分支，config.sub 增加 linux-ohos 识别"
  - "autoconf 临时目录 umask 077 创建的 0700 目录在本机文件系统不可写（chmod 被忽略，组可写才可写），configure/config.status 需以 umask 002 创建临时目录"

