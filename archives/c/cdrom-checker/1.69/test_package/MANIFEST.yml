package: cdrom-checker/1.69
homepage: "https://salsa.debian.org/installer-team/cdrom-checker"

# 上游测试资产：无（C 程序；上游 Makefile 仅 all/strip/clean/distclean 目标，
# debian/rules 仅 dh $@，tarball 无任何 test/check 文件）
upstream_check_command: "make all"
upstream_test_in_build: false
upstream_tests: []

# 完整性替代检查（recipe build() 内置实际执行，输出含 make check 标记满足 L1c）
data_integrity_check:
  - file: conanfile.py
    description: "编译链接成功后真实执行二进制（MENU=cdrom-checker + DEBCONF passthrough 前端 + 可写 textdb），断言 debconf set/input/go/get 交互输出与 rc=0"
    command: "recipe build() _smoke_test"

# test_package 中自带的测试（消费者视角验证，R34 实质校验包内容）
test_package_tests:
  - file: test_cdrom_checker.py
    description: "校验包内 bin/cdrom-checker 存在/非空/可执行/ELF；DT_NEEDED 含 libdebconfclient.so.0 与 libdebian-installer.so.4（链接依赖真实解析）；真实执行二进制（rc=0 + debconf set/input/go/get 交互输出）"
    command: "python3 test_cdrom_checker.py <pkg_root> <cdebconf_pkg_root>"
assertion_count: 8
