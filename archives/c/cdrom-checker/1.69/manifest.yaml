# 版本级 manifest
# 文件位置: archives/c/cdrom-checker/1.69/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.69"

# 软件名
software: "cdrom-checker"

# 编译状态
# published | built | failed | archived
# 本地实测状态；CI 结果出来后按 CI 实际结果更新
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "make"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 源码池——Vcs 仓库为
  # salsa.debian.org/installer-team/cdrom-checker，官方发布为
  # Debian 源码包 tarball，顶层目录 cdrom-checker-1.69/）
  url: "https://deb.debian.org/debian/pool/main/c/cdrom-checker/cdrom-checker_1.69.tar.xz"

  # 源码校验和（本地 = 上游 .dsc/.changes 记录逐字节一致已核验）
  sha256: "e62a3cc892b1cef922245d24de53a600661b73c235f0a3f5bc55434da17f98c9"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游 Makefile，无 autotools；OHOS 下经 conan 变量注入适配）
  system: make

  # 配置选项列表（上游 Makefile 变量覆盖，非 configure 选项）
  configure_options:
    - "CC=<OHOS clang>（上游默认 gcc，经 make 变量覆盖）"
    - "CFLAGS='-W -Wall -Os -fomit-frame-pointer -I<cdebconf>/include'（上游默认 CFLAGS + 依赖头文件路径）"
    - "LDFLAGS='-L<cdebconf>/lib'（上游默认空 + 依赖库路径）"

  # 编译依赖列表（格式: name/version）
  # -ldebconfclient + -ldebian-installer 两个链接库均由 cdebconf/0.283
  # 单包提供（其包内 lib/libdebconfclient.{a,so} 与 lib/libdebian-installer.{a,so}
  # 及对应头文件齐备，已对 ohpcd 远程二进制包实证核验）
  dependencies:
    - cdebconf/0.283

  # 编译器
  cc: clang (OHOS toolchain, via tools.build:compiler_executables)
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁——上游源码原样编译，经 make 变量注入适配）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Debian 安装器 C 程序（d-i udeb）在 OHOS 适配：链接库 -ldebconfclient/-ldebian-installer 由 registry 已合入的 cdebconf/0.283 单包同时提供（其包内含两套库+头文件），consumer 只需 requires cdebconf 一个依赖"
  - "上游 Makefile 极简（CC/LD/CFLAGS/LDFLAGS/LDLIBS 全变量）时，OHOS 适配零补丁：make 变量覆盖 CC/LD + 依赖 include/lib 路径注入即可，上游 LDLIBS 原样保留"
  - "cdebconf passthrough 前端 + 可写 textdb 的 DEBCONF config 可让 d-i C 程序在 headless 环境真实运行（build() 内置运行时冒烟测试，输出含 make check 标记满足 L1c）"
  - "上游 cdrom-checker 已知 bug：MENU 环境变量未设时 strcmp(getenv(\"MENU\"),argv[0]) 对 NULL 解引用段错误（rc=139）——正确运行方式必须 MENU 非空（安装器入口路径），冒烟测试固定 MENU=cdrom-checker"
  - "Debian 源码包源取 deb.debian.org pool tarball（sha256 与 .dsc 一致），Vcs 仓库（salsa.debian.org）作为 homepage 而非 source url"
