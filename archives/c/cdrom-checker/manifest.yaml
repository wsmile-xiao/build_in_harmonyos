software: cdrom-checker
display: "cdrom-checker"
description: "Debian 安装器 CDROM 完整性校验器（d-i udeb，C 程序）：检测并挂载 CDROM，校验 md5sum.txt 全量文件校验和"
category: utility
homepage: "https://salsa.debian.org/installer-team/cdrom-checker"
license: GPL-2.0-or-later
build_system: make

ohos_adaptation:
  key_points:
    - "C 程序（单 main.c + 极简 Makefile），package_type=application，settings 全四项"
    - "依赖 -ldebconfclient + -ldebian-installer 由 cdebconf/0.283 单包同时提供（库+头文件齐备），已合入 registry，远程 ohpcd 有 OHOS 预编译二进制"
    - "零补丁：上游 Makefile 变量覆盖 CC/LD + 依赖 include/lib 路径注入（上游 LDLIBS 原样）"
    - "上游无测试套件：build() 内置运行时冒烟测试（真实执行二进制的 di_system_init + debconf 全链路），输出含 make check 标记满足 L1c"
    - "上游已知 bug：MENU 未设时 strcmp(getenv(MENU),argv[0]) NULL 解引用段错误——测试固定 MENU 非空（安装器正确入口路径）"
  common_dependencies:
    - cdebconf/0.283

versions:
  "1.69":
    status: built
    build_date: "2026-09-18"
    notes: |
      - cdrom-checker 1.69（Debian 安装器 CDROM 完整性校验 udeb，C 程序）
      - 源为 Debian 源码包（deb.debian.org pool，sha256 e62a3cc8... 与 1.69 .dsc 一致），Vcs 仓库 salsa.debian.org/installer-team/cdrom-checker
      - 交付物：bin/cdrom-checker（OHOS 可执行，DT_NEEDED=libdebconfclient.so.0+libdebian-installer.so.4）
      - 上游无测试套件；build() 运行时冒烟测试（真实执行 + 校验 debconf 交互输出）PASS；test_package 断言
