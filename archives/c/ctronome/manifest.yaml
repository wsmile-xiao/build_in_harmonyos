software: ctronome
display: "ctronome"
description: "极简的可编程命令行节拍器，读取 WAV 采样并通过 OSS (/dev/dsp) 输出"
category: audio
homepage: "https://sourceforge.net/projects/ctronome/"
license: GPLv2
build_system: makefile

ohos_adaptation:
  key_points:
    - "无 configure 脚本，顶层裸 Makefile，且没有 install / check 目标；打包由 conanfile.py 的 package() 完成"
    - "Makefile 编译规则不引用 CFLAGS，编译标志必须随 CC 一起传入"
    - "ctronome.h 以暂定义形式重复定义 programfile/dsp_*/debug 等全局变量，clang 15 默认 -fno-common 导致链接期 12 处 duplicate symbol；修复方式为补丁改为 extern 声明 + ctronome.c 中单一定义（禁止 -fcommon，见知识库 E491）"
    - "OSS 头文件（sys/soundcard.h、linux/soundcard.h）由 OHOS sysroot 直接提供，无需移植"
    - "音频输出依赖 /dev/dsp，HarmonyOS PC 无该字符设备，程序运行到音频输出阶段即退出"
    - "测试覆盖：test_package/test.sh 功能测试 3 条断言 + test_package/test_ohos.sh 鸿蒙特有测试 16 条断言（ELF64/AArch64/PIE、musl 解释器、无 RPATH、无构建机绝对路径、仅 musl libc 动态依赖、OHOS ELF 标记、bash 包裹执行、上游默认 /usr/share 路径与 OSS /dev/dsp 缺失时优雅退出、-d 覆盖生效、包内采样可用），conan create 实测 19/19 PASS"
  common_dependencies: []

versions:
  - version: "0.5.6"
    status: built
    build_date: "2026-09-14"
