# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在
# R51 上游测试三步法：清点 -> 运行 -> 如实回填

package: ctronome/0.5.6
homepage: "https://sourceforge.net/projects/ctronome/"

# ── 上游测试清点结论（R51 第一步）─────────────────────────────
# 源码包内无 tests/ 与 test/ 目录；顶层 Makefile 只有 all / clean 两个
# 目标，没有 check / test 目标；全包无 CMakeLists.txt、无 pytest 配置。
# 清点命令与实测输出见 notes.md 的「上游测试清点与实测」一节。
# 结论：上游没有官方自动化测试，因此 upstream_tests 为空列表（已核对，
# 不是未填写的占位符）。
upstream_check_command: "make check (上游无该目标，实测报 No rule to make target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── test_package 自带测试（消费者视角，均真实执行被测二进制）──
test_package_tests:
  - file: test.sh
    description: "功能测试（上游行为视角，3 条断言）: -h 用法 / -v 版本横幅 / 用包内 WAV 采样跑到音频输出阶段"
    command: "bash test.sh <pkg>/bin/ctronome"
    assertions: 3
  - file: test_ohos.sh
    description: "鸿蒙特有测试（16 条断言）: ELF64/AArch64/PIE、.interp=/lib/ld-musl-aarch64.so.1（musl）、无 RPATH/RUNPATH、仅 musl libc 动态依赖、OHOS ELF 标记（.codesign/.note.ohos.ident）、可加载镜像与二进制内无构建机绝对路径、bash 包裹可执行、包内产物完备（4 WAV + 文档 + COPYING）、上游默认 /usr/share/ctronome 路径在 OHOS 缺失时优雅退出（rc=1 不崩溃）、OSS /dev/dsp 缺失时优雅退出且 -d 覆盖生效、全部真实运行无崩溃"
    command: "bash test_ohos.sh <pkg>/bin/ctronome"
    assertions: 16

# 测试断言总数 = 功能 3 + 鸿蒙特有 16
assertion_count: 19

# 其中鸿蒙平台特有测试用例数（ELF/ABI、平台能力缺口、OHOS shell 约束等）
ohos_specific_assertions: 16
