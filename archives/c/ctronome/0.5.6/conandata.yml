sources:
  url: "https://downloads.sourceforge.net/project/ctronome/ctronome-0.5.6.tar.gz"
  sha256: "d8c17282235759491eae36efbc8fe93514dcac655efa68d3cb8db0132c29a24d"

patches:
  - patch_file: "patches/0001-ctronome.c.patch"
    patch_description: >
      在 ctronome.c 中给出 programfile / dsp_channels / dsp_speed /
      dsp_format / dsp_depth / debug 这 6 个全局变量的唯一一份定义。
      上游把它们以暂定义（tentative definition）写在 ctronome.h 里，
      依赖 GCC 10 以前的 common symbol 合并语义；clang 15（以及 gcc>=10）
      默认 -fno-common，于是 ctronome.o、dsp.o、routines.o 各保留一份强
      定义，链接期 ld.lld 报 12 处 duplicate symbol。
    patch_type: "portability"
  - patch_file: "patches/0002-ctronome.h.patch"
    patch_description: >
      把 ctronome.h 中上述 6 个暂定义改为 extern 声明，与 ctronome.c 中的
      单一定义配套（C99 起的标准做法）。刻意不使用 -fcommon 掩盖问题：
      知识库 E491 明确禁止 -fcommon，它会隐藏非法的声明/定义关系。
    patch_type: "portability"
