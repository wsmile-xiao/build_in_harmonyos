knowledge_gained:
  - "上游 Makefile 的编译规则只写 CC -c 源文件，不引用 CFLAGS，编译标志只能随 CC 传入（设置 CFLAGS 环境变量被完全忽略）"
  - "ctronome.h 里以暂定义形式重复定义 programfile/dsp_channels/dsp_format/dsp_speed/dsp_depth/debug，clang 15 默认 -fno-common 时链接期 ld.lld 报 12 处 duplicate symbol；正解是 extern 声明 + 单一定义（E491 明确禁止用 -fcommon 掩盖）"
  - "Conan 的 get() 按 URL 末段扩展名推断压缩格式：SourceForge 的 /files/.../download 链接会让它按 zip 解压并报 BadZipFile（知识库 E483）；改用带 .tar.gz 末段的 downloads.sourceforge.net 直链即可"
  - "self.conf.get() 不能读取 tools.build:compiler_executables:c 这种子键形态（会抛 ConanException），必须整体读取字典后取 [c]"
  - "OHOS sysroot 自带 linux/soundcard.h 与 sys/soundcard.h，OSS 头文件无需移植即可编译通过"
  - "音频输出依赖 /dev/dsp（OSS）；HarmonyOS PC 无该字符设备，程序在音频输出阶段以 FATAL: cannot open dsp device 退出，其余功能正常"

