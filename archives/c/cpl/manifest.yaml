software: cpl
display: "ESO Common Pipeline Library"
description: "ESO 天文数据处理管线的 ISO-C 工具库（图像、星表、矩阵、WCS、拟合与 recipe 插件接口）"
category: data
homepage: "https://www.eso.org/sci/software/cpl/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "零源码补丁：沿用 libcext/1.3.2 的构建时 configure 调整（umask 022、真实 shell、编译器回退、lld 宿主库探测）"
    - "用系统 libcext（上游默认 --with-system-cext=yes），不构建附带的 libcext 子目录"
    - "FFT 默认关闭：注册表 fftw 缺单精度库，而 configure 要求双精度和单精度同时存在"
    - "线程默认关闭：cfitsio/4.6.4 非线程安全构建，CPL 会拒绝开线程的配置"
    - "wcslib 头文件在版本化子目录，需用 --with-wcslib-includes 显式指向"
  common_dependencies:
    - libcext
    - cfitsio
    - wcslib

versions:
  "7.4":
    status: built
    build_date: "2026-09-11"
    conan_ref: "cpl/7.4"
