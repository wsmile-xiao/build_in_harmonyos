package: cpl/7.4
homepage: "https://www.eso.org/sci/software/cpl/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# make check runs 54 TESTS (cplcore 33 + cplui 10 + cpldrs 9 + cpldfs 2).
# The bundled libcext subdir is NOT configured (system libcext is used),
# and cpljava tests are NOT built (gasgano support defaults to off).
upstream_tests:
  - name: cplcore-tests
    source: cpl-7.4/cplcore/tests/Makefile.am
    description: "33 automake TESTS: array, vector, matrix, image, table, property, fits, stats and more."
    command: "make check (cplcore/tests)"
  - name: cplui-tests
    source: cpl-7.4/cplui/tests/Makefile.am
    description: "10 automake TESTS: frames, framesets, parameters, plugins, recipes."
    command: "make check (cplui/tests)"
  - name: cpldrs-tests
    source: cpl-7.4/cpldrs/tests/Makefile.am
    description: "9 automake TESTS: fit, apertures, geometry, detector, photometry, WCS, wlcalib, ppm, fft."
    command: "make check (cpldrs/tests)"
  - name: cpldfs-tests
    source: cpl-7.4/cpldfs/tests/Makefile.am
    description: "2 automake TESTS: cpl_dfs-test, cpl_multiframe-test."
    command: "make check (cpldfs/tests)"

test_package_tests:
  - file: test_cpl.c
    description: "Consumer link test calling real CPL APIs with state assertions: vector sum/mean, image set/get/add_scalar, matrix mean, propertylist append/read, table column, init/end lifecycle."
    command: "./test_cpl"

assertion_count: 6
