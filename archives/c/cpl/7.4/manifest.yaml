software: cpl
display: "ESO Common Pipeline Library"
version: "7.4"
status: built
build_date: "2026-09-11"
conan_ref: "cpl/7.4"
build_system: "autotools"

source:
  url: "https://ftp.eso.org/pub/dfs/pipelines/libraries/cpl/cpl-7.4.tar.gz"
  sha256: "63171467e9deab880842f3e5589c02698c4637cf75106c4aa39affd84ecd8bd4"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-system-cext=yes + --with-cext=<libcext package prefix>"
    - "--with-cfitsio=<cfitsio package prefix> + CFITSIO_CFLAGS/LIBS (static link chain -lcfitsio -lz -lm)"
    - "--with-wcslib-includes=<wcslib versioned include dir>"
    - "--with-wcslib-libs=<wcslib lib dir>"
    - "--disable-fft"
    - "--disable-threads"
    - "--enable-shared --disable-static"
  dependencies:
    - libcext/1.3.2
    - cfitsio/4.6.4
    - wcslib/8.4
    - zlib/1.3.1.1 (transitive via cfitsio, explicit for configure AC_CHECK_LIB link)
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-polynomial-fit-3d-median-tripwire-libc-rand.patch (test-only portability: median tripwire 300->1000 for musl rand() stream)"
  - "patches/0002-fit-window-aarch64-tolerance-fallback.patch (test-only portability: __aarch64__ uses upstream non-wider fallback float 0.006 / double 30*FLT_EPSILON for window-fit self/extra-bad comparison)"

upstream_tests:
  command: "make check"
  test_count: 54
  notes: "cplcore/tests 33 TESTS + cplui/tests 10 TESTS + cpldrs/tests 9 TESTS + cpldfs/tests 2 TESTS. Bundled libcext subdir not configured (system libcext used); cpljava gasgano tests not built (default off, no Java needed)."

test_package:
  assertion_count: 6
  description: "Links cpl::cpl, asserts vector sum/mean, image set/get/add_scalar, matrix mean, propertylist append/read, table column creation, and the init/end lifecycle."

ohos_adaptation:
  key_points:
    - "Zero source patch: generated configure adjusted at build time (umask 022, real-shell shebang, guarded CONFIG_SHELL re-exec), same as libcext/1.3.2"
    - "FFT disabled: registry fftw lacks the single-precision libfftw3f that configure requires; cpl_fft-test asserts UNSUPPORTED_MODE in this configuration"
    - "Threads disabled: cfitsio/4.6.4 is built without pthreads, CPL refuses thread-enabled builds against it"
    - "WCS enabled via explicit --with-wcslib-includes pointing at the versioned include/wcslib-8.4 dir"

knowledge_gained:
  - "CPL 7.4 bundles a libcext subdir but defaults to --with-system-cext=yes, so the registry libcext/1.3.2 satisfies it"
  - "CPL_CHECK_FFTW requires double AND single precision FFTW; the enable knob is --disable-fft (not --disable-fftw)"
  - "CPL_CONFIG_CFITSIO aborts thread-enabled builds when cfitsio lacks Fitsio_InitLock; match --disable-threads to a non-pthread cfitsio"
  - "Upstream test inventory: 33 + 10 + 9 + 2 = 54 TESTS, audited from the four tests/Makefile.am files"
