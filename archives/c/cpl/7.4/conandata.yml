patches:
  - patch_file: "patches/0001-polynomial-fit-3d-median-tripwire-libc-rand.patch"
    patch_description: "Relax the cpl_polynomial_fit_test_3d median_error tripwire 300->1000: the test draws come from unseeded libc rand(), so musl deterministically yields ~387 where the glibc-tuned 300 passes; low-hundreds residuals are the normal noise-floor range and 1000 still catches diverged fits at signal scale 1e4-1e6. Test-only, no production code touched."
    patch_type: "portability"
  - patch_file: "patches/0002-fit-window-aarch64-tolerance-fallback.patch"
    patch_description: "On aarch64 (HarmonyOS clang/musl) the ill-conditioned window-fit self/extra-bad comparison agrees to ~1e-7, not 800*DBL_EPSILON (1.77e-13); use the upstream non-wider fallback (float 0.006 / double 30*FLT_EPSILON) for __aarch64__ only. x86_64 behavior unchanged. Test-only, no production code touched."
    patch_type: "portability"
