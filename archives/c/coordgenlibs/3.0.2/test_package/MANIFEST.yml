# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: coordgenlibs/3.0.2
homepage: "https://github.com/schrodinger/coordgenlibs"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试 (test_coordgen/test_smilesparser) 需要 maeparser + Boost，
# 非库本体依赖；已在本轮适配中独立构建运行（见 notes.md 双口径台账 20/20），
# 配方内通过 COORDGEN_BUILD_TESTS=OFF 关闭，避免引入非必需依赖。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (本轮适配已实际运行，见 notes.md 台账)
upstream_tests:
  - file: test/test_coordgen.cpp
    source: coordgenlibs-3.0.2/test/test_coordgen.cpp
    description: "coordgen 核心功能测试（16 个 BOOST_AUTO_TEST_CASE：模板/楔形键/金属 ZOB/环形状/二面角约束等）"
    command: "./test_coordgen --log_level=test_suite"
  - file: test/test_smilesparser.cpp
    source: coordgenlibs-3.0.2/test/test_smilesparser.cpp
    description: "SMILES 解析测试（4 个 BOOST_AUTO_TEST_CASE：Basics/Rings/Branching/BondOrder）"
    command: "./test_smilesparser --log_level=test_suite"
  - file: example_dir/example.cpp
    source: coordgenlibs-3.0.2/example_dir/example.cpp
    description: "样例可执行程序（ctest 注册项，验证库可链接可运行）"
    command: "./example"

# test_package 中自带的测试 (消费者视角验证)
# 通过公开头文件 sketcherMinimizer.h 构建 4 原子环、生成 2D 坐标并断言原子/键数
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用公开 API（sketcherMinimizer/Molecule/Atom/Bond）生成 2D 坐标并验证可观察结果"
    command: "./test_coordgenlibs"
  - file: test_coordgen_hmos.cpp
    description: "鸿蒙专项测试：验证 OHOS 平台宏 + 同一公开 API 坐标生成可观察结果"
    command: "./test_coordgen_hmos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
