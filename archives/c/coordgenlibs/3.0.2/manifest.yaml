# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.2"

# 软件名
software: coordgenlibs

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/schrodinger/coordgenlibs/archive/refs/tags/v3.0.2.tar.gz"

  # 源码校验和
  sha256: "f67697434f7fec03bca150a6d84ea0e8409f6ec49d5aab43badc5833098ff4e3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCOORDGEN_BUILD_TESTS=OFF"
  - "-DCOORDGEN_BUILD_EXAMPLE=OFF"
  - "-DCOORDGEN_RIGOROUS_BUILD=OFF"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "cmake_minimum_required(VERSION 3.2) 与 CMake>=3.5 不兼容：需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 且在 configure 命令行注入（toolchain set 时机过晚）"
- "上游 -Wall -Wextra -Werror（COORDGEN_RIGOROUS_BUILD=ON）与 OHOS clang/libc++ 的 -Wsign-compare 冲突，需 OFF"
- "coordgen 头文件安装于 include/coordgen/ 子目录，消费者 include 需带 coordgen/ 前缀"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
