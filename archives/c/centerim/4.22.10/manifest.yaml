software: centerim
version: "4.22.10"
status: draft
build_system: autotools

source:
  url: "https://cdn.netbsd.org/pub/pkgsrc/distfiles/centerim-4.22.10.tar.gz"
  sha256: "93ce15eb9c834a4939b5aa0846d5c6023ec2953214daf8dc26c85ceaa4413f6e"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
    - "--with-ssl"
    - "--with-fribidi=no"
    - "--without-libjpeg"
  dependencies:
    - ncurses (conan, 6.4)
    - curl (conan, 8.19.0)
    - openssl (conan, 1.1.1w)
    - libiconv (conan, 1.17)
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.sub-ohos.patch"

knowledge_gained:
  - "E007: config.sub needs aarch64 + linux-ohos recognition (2009-era bundled config.sub)"
  - "Autotools: pass --build/--host explicitly so old config.guess is never run"
