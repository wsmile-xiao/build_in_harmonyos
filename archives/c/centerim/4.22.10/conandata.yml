# conandata.yml — centerim 4.22.10

sources:
  url:
    - "https://cdn.netbsd.org/pub/pkgsrc/distfiles/centerim-4.22.10.tar.gz"
    - "http://www.centerim.org/download/releases/centerim-4.22.10.tar.gz"
  sha256: "93ce15eb9c834a4939b5aa0846d5c6023ec2953214daf8dc26c85ceaa4413f6e"

patches:
  - patch_file: "patches/0001-config.sub-ohos.patch"
    patch_description: "Teach bundled 2009-era config.sub to accept aarch64 and linux-ohos triplets (E007)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-022.patch"
    patch_description: "Use umask 022 for the config.status temp dir (setgid HMDFS makes umask 077 dirs unwritable -> subs1.awk Permission denied)"
    patch_type: "portability"
  - patch_file: "patches/0003-intl-version-comment.patch"
    patch_description: "Neutralize intl/version marker (gettext) so it no longer shadows the C++ <version> header via -Iintl (std namespace pollution)"
    patch_type: "portability"
  - patch_file: "patches/0004-icqface-auto-param.patch"
    patch_description: "Rename findresults parameter 'auto' (C++11 keyword) to auto_ in icqface.h"
    patch_type: "portability"
  - patch_file: "patches/0005-src-makefile-git-version-srcdir.patch"
    patch_description: "git_version rule must read git-version.h.in via $(srcdir) (out-of-tree build; also tolerates non-git conan source)"
    patch_type: "portability"
  - patch_file: "patches/0006-libgadu-rindex-strrchr.patch"
    patch_description: "Replace legacy POSIX rindex() with strrchr() in libgadu.c (OHOS libc has no rindex)"
    patch_type: "portability"
