---
test_package: centerim
version: "4.22.10"
test_type: explicit
description: |
  Smoke-tests the packaged centerim binary non-interactively: centerim
  --version (binary installed + runnable, prints 4.22.10) and centerim
  --help (usage listing). centerim is a ncurses TUI client; the full
  interactive protocol flows (ICQ/Jabber/GG/MSN/Yahoo!/IRC/RSS) need a
  live network and a terminal and are not runnable in CI.
upstream_tests:
  description: |
    Upstream centerim 4.22.10 ships NO automated test suite (no tests/
    directory, no `make check` target) — only manual docs (FAQ, ChangeLog).
    Upstream test count is therefore 0. Verification of the OHOS adaptation
    is done via the autotools configure+build (in conanfile.py build()) and
    the test_package consumer smoke test below.
  location: "(none)"
  framework: "(none)"
  executed_in_build: false
test_package_tests:
  - file: test_centerim.sh
    description: |
      2 HarmonyOS-PC-specific checks: centerim --version exits 0 and prints
      the version; centerim --help prints usage and exits 0.
conanfile: conanfile.py
settings: ["os", "arch"]
