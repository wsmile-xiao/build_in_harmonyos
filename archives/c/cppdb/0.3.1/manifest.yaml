version: "0.3.1"
software: "cppdb"
status: built
build_date: "2026-09-11"
build_system: "cmake"

source:
  url: "https://sourceforge.net/projects/cppcms/files/cppdb/0.3.1/cppdb-0.3.1.tar.bz2/download"
  sha256: "d60eef5a732d8f84ef5e4a2845a8cefc543a6c75bf3782589c2cf6aa150b992e"
  tar_format: tar.bz2

build:
  system: cmake
  configure_options:
    - "-DDISABLE_PQ=ON"
    - "-DDISABLE_MYSQL=ON"
    - "-DDISABLE_ODBC=ON"
    - "-DSQLITE_BACKEND_INTERNAL=ON (shared=False) / OFF (shared=True)"
    - "-DCMAKE_CXX_STANDARD=14 (via portability patch)"
  dependencies:
    - sqlite3/3.49.1
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-cmake-minimum-version-cxx14.patch"

knowledge_gained:
  - "上游 CMakeLists 用裸 find_library/find_path 找 sqlite3，可用 -DSQLITE3_LIB/-DSQLITE3_PATH 直接覆盖（find 已定义变量时跳过搜索），无需补丁"
  - "2013 年代码用 std::auto_ptr，OHOS 默认 C++17 下无法编译，在补丁中固定 CMAKE_CXX_STANDARD=14"
  - "test_basic.cpp 自带 throw-on-failure 的 TEST 宏，只打印 Ok，无计数行；test_backend/test_caching 用 test.h 计数 harness，打印 Tests/failed"
  - "mysql/postgresql/odbc 后端需要在线数据库服务，OHOS 上只跑 sqlite 子集（run_test_linux_a.sh 的 sqlite 部分，共 9 轮）"
