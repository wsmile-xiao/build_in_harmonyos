# test_package/MANIFEST.yml — cppdb 0.3.1
# Upstream test audit (2026-09-11, from the pristine 0.3.1 tarball):
# test/ holds 4 test programs built unconditionally by CMakeLists.txt
# (no enable_testing/add_test registration; executed via shell scripts):
# - test_basic.cpp: 37 TEST sites (throw-on-failure macro local to the
#   file, prints only "Ok"); 6 sites sit in a 2-iteration fetch loop.
# - test_backend.cpp: 121 TEST + 10 THROWS (test/test.h counting harness,
#   prints "Tests: N failed: M" + "Ok"); needs a live DB except sqlite.
# - test_caching.cpp: 46 TEST + 1 THROWS (same harness); dummy driver
#   only, fully offline.
# - test_perf.cpp: 0 assertions (benchmark); not executed by upstream
#   test/run_test_linux_a.sh either.
# Total assertion sites: 37 + 121 + 10 + 46 + 1 = 215.
# mysql/postgresql/odbc connection strings need live servers (absent on
# HarmonyOS); the recipe runs the full sqlite subset of
# test/run_test_linux_a.sh (4 option variants x test_basic/test_backend
# + test_caching = 9 runs) in conanfile.py build().

package: cppdb/0.3.1
homepage: "http://cppcms.com/sql/cppdb/"

upstream_check_command: "test_backend/test_basic with sqlite3 connection strings"
upstream_test_in_build: true
upstream_test_command: "test_basic/test_backend (sqlite3 x4 variants) + test_caching"
upstream_tests_exist: true
upstream_test_framework: "custom"
upstream_test_count: 215
upstream_test_audit: "audited cppdb-0.3.1.tar.bz2 (sha256 d60eef5a...150b992e): test/test_basic.cpp 37 TEST (local throw macro, prints Ok), test/test_backend.cpp 121 TEST + 10 THROWS (test.h harness, prints Tests/failed), test/test_caching.cpp 46 TEST + 1 THROWS (dummy driver, offline), test/test_perf.cpp 0 assertions (benchmark, never run by run_test_linux_a.sh). mysql/postgresql/odbc strings need live servers; sqlite subset (9 runs) executes in build()."

upstream_tests:
  - file: test_basic.cpp
    source: cppdb-0.3.1/test/test_basic.cpp
    description: "upstream CRUD/null-binding/fetch test, 37 TEST sites (exit 0 proves all pass)"
    command: "./test_basic 'sqlite3:db=<db>[;@use_prepared=off][;@pool_size=5]'"
  - file: test_backend.cpp
    source: cppdb-0.3.1/test/test_backend.cpp
    description: "upstream backend conformance test, 121 TEST + 10 THROWS, prints Tests/failed"
    command: "./test_backend 'sqlite3:db=<db>[;@use_prepared=off][;@pool_size=5]'"
  - file: test_caching.cpp
    source: cppdb-0.3.1/test/test_caching.cpp
    description: "upstream driver-manager/statement-cache test, 46 TEST + 1 THROWS, dummy driver"
    command: "./test_caching"

test_package_tests:
  - file: test.cpp
    description: "consumer CRUD over the packaged library (6 CHECK-OK lines)"
    command: "./test_cppdb <db>"
  - file: test_upstream.cpp
    description: "replay of upstream test_basic/test_backend sqlite paths (20 UPSTREAM-OK lines)"
    command: "./test_cppdb_upstream <db>"

assertion_count: 26
