software: cppdb
display: "CppDB"
description: "SQL connectivity library with a database-independent API (sqlite3 backend)"
category: library
homepage: "http://cppcms.com/sql/cppdb/"
license: BSL-1.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "only the serverless sqlite3 backend is enabled (mysql/postgresql/odbc need live servers)"
    - "static default bakes the sqlite backend into libcppdb (no runtime dlopen)"
    - "C++14 pinned via portability patch (upstream uses std::auto_ptr)"
  common_dependencies:
    - "sqlite3/3.49.1"

versions:
  "0.3.1":
    status: built
    build_date: "2026-09-11"
    conan_ref: "cppdb/0.3.1"
