# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "0.3"

# 软件名
software: cnrbtree

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源）
  url: "https://github.com/cnlohr/cnrbtree/archive/refs/tags/v0.3.tar.gz"

  # 源码校验和
  sha256: "da2912ea856a77fe609e35bc73411c45f4ba2248a59cbe2178c9c649011eb374"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Raw Makefile recipe 内嵌 gcc（无 CC 变量）→ 改写 $(CC) + make CC=clang（DRAFT-cnrbtree-0.3-makefile-recipe-gcc-hardcode）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
