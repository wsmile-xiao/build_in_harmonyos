# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cnrbtree/0.3
homepage: "https://github.com/cnlohr/cnrbtree"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
# header-only 库：build() 无编译（R34 不伪造编译日志），上游测试在探索阶段
# 手动执行并记录于 reports/test-report.md
upstream_test_in_build: false
upstream_test_command: "make CC=clang test && ./testtree && ./simple"

# 上游实际运行的测试程序（testtree.c 为唯一独立上游测试源；simple.c 为 README 示例）
upstream_tests:
  - file: testtree.c
    source: cnrbtree-0.3/testtree.c
    description: "独立上游测试程序：3000x300 随机字符串树 + 4x300 随机 int 树插入/删除 + 红黑不变量递归校验 + anotherfn 字典操作"
    command: "./testtree"
  - file: simple.c
    source: cnrbtree-0.3/simple.c
    description: "README 示例（非独立用例）：string-set / string-string map / 自定义模板树，断言式输出"
    command: "./simple"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者验证：通过公开 API（CNRBTREETEMPLATE/create/access/get/remove/destroy/RBA/RBHAS/RBFOREACH）与 cnstrset/cnstrstrmap 内建类型完成 4 个业务场景，1032 断言"
    command: "./test_cnrbtree"

# 测试断言总数 (近似值, 用于质量评估)
# testtree(1545 行含 5 个断言块) + simple(6 组输出校验) + test_package(1032 PASS)
assertion_count: 1041