package: convertlit/1.8
homepage: http://www.convertlit.com/

upstream_check_command: "none (upstream archive contains no test suite or test target)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Execute packaged clit, verify the 1.8 banner, and reject a malformed LIT file with the documented parser error"
    command: "sh test.sh <package>/bin/clit"
  - file: test_ohos_elf.py
    description: "On OHOS, verify that the packaged clit is a little-endian ELF64 AArch64 executable rather than a host or wrong-architecture binary"
    command: "python3 test_ohos_elf.py <package>/bin/clit"

assertion_count: 5
