patches:
  "1.8":
    - patch_file: "patches/0001-modern-c-and-portable-build.patch"
      patch_type: "portability"
      patch_source: "https://github.com/macports/macports-ports/tree/master/textproc/convertlit/files"
      patch_description: |
        Make the two upstream Makefiles honor the selected compiler, archiver,
        linker flags, and external libtommath package. Add the standard headers
        and LZX declarations required by C99 and newer compilers. Also replace
        unsafe printf calls, fix the dir_program terminator index, use S_ISDIR,
        and print size_t with %zu. The changes are generic POSIX fixes shared by
        the actively maintained MacPorts and Debian packages; no OHOS-only stub
        or feature reduction is introduced.
