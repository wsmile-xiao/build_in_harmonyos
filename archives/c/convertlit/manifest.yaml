software: convertlit
display: "ConvertLIT"
description: "Convert Microsoft Reader LIT eBooks into an open format"
category: ebook
homepage: "http://www.convertlit.com/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Uses generic POSIX and modern-C fixes without OHOS-only stubs"
    - "Links the published static libtommath/1.3.0 dependency from a build-private prefix"
    - "Packages and executes the clit command-line tool"
  common_dependencies:
    - libtommath

versions:
  "1.8":
    status: built
    build_date: "2026-09-08"
