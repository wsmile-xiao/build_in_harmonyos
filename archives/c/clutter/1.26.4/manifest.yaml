software: clutter
# 版本级 manifest — clutter 1.26.4
# 文件位置: archives/c/clutter/1.26.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游真实 tag 1.26.4，2020-03-09 发布；GNOME Clutter 此前无 1.27 系列）
version: "1.26.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"

# 构建系统标识（verify-build 要求）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GNOME 官方源，R39）
  url: "https://download.gnome.org/sources/clutter/1.26/clutter-1.26.4.tar.xz"

  # 源码校验和（与官方 clutter-1.26.4.sha256sum 逐字节核对一致）
  sha256: "8b48fac159843f556d0a6be3dbfc6b083fc6d9c58a20a49a6b4919ab4263c4e6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  build_system: autotools

  # 配置选项（与 conanfile.py 实际一致）：OHOS 无显示服务——只启用 EGL
  # 后端（Clutter 要求至少一个后端），x11/win32/quartz/gdk/wayland/mir/
  # cex100 全禁用；evdev/tslib 输入后端与 wayland-compositor 禁用；
  # docs/examples/introspection/gdk-pixbuf 禁用；--disable-Werror（上游
  # MAINTAINER 标志含 clang 15 不认识的 -Werror=logical-op 等）
  configure_options:
    - "--disable-dependency-tracking"
    - "--disable-glibtest"
    - "--disable-Werror"
    - "--disable-x11-backend"
    - "--disable-win32-backend"
    - "--disable-quartz-backend"
    - "--disable-gdk-backend"
    - "--disable-wayland-backend"
    - "--disable-mir-backend"
    - "--disable-cex100-backend"
    - "--enable-egl-backend"
    - "--disable-wayland-compositor"
    - "--disable-evdev-input"
    - "--disable-tslib-input"
    - "--disable-gdk-pixbuf"
    - "--disable-introspection"
    - "--disable-docs"
    - "--disable-examples"

  # 编译依赖（configure.ac 的 CLUTTER_BASE_PC_FILES 硬依赖）
  dependencies:
    - "cogl/1.22.8.1"
    - "glib/2.84.0.1"
    - "cairo/1.18.4.1"
    - "pango/1.56.4"
    - "atk/2.38.0.1.1"
    - "json-glib/1.10.6.1"
    - "fontconfig/2.18.1.1"
    - "gles2/2.0.25"
    - "egl/1.0.5"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无源码 patch 文件；平台适配全部经配置裁剪与配方内的等价修正完成
# （见 notes.md「遇到的问题与解决方案」）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "clutter 上游无 1.27 系列：GNOME 官方 cache.json / 目录 / GitLab tags / 各发行版最高均为 1.26.4（master 为 1.26.5 开发版未发布）；分支名 1.27.4 无对应上游产物"
  - "clutter 的 configure.ac 把 cogl-pango-1.0 写死在 CLUTTER_BASE_PC_FILES 且无任何 enable/disable 开关——制品仓 cogl/1.22.8（--disable-cogl-pango）导致断链，必须由 cogl 侧补链（已发 cogl/1.22.8.1）"
  - "cairo 1.18.4 配方 glib=disabled 不产 cairo-gobject.pc，而 clutter 硬依赖 cairo-gobject；须用 1.18.4.1（glib=enabled）并以 force=True 压制 pango 的精确 pin"
  - "json-glib/1.10.6 的 .so 其 .codesign 段被 OHOS 加载器判无效——dlopen 报 Permission denied（chmod 755 无效，selfSign 后 OK），致 libclutter-1.0.so 加载期 rc=127；须用重签版 json-glib/1.10.6.1"
  - "E236/E522：依赖包（libxcb）的 .la 其 dependency_libs 指向已清理的构建机临时目录，libtool 递归读取报 not a valid libtool archive；配方内建 deps-nola 私有目录（只放依赖 .so 符号链接、无 .la）置前解决"
  - "E011/E129：configure 的 confstat 用 umask 077 + mktemp 建临时目录，HMDFS 强制 setgid 得 drwx--S--- 连属主不可写；配方内改 umask 022"
  - "上游测试 111 项（conform 41 含 26 程序+15 脚本 / interactive 53 / accessibility 5 / micro-bench 5 / performance 7）全部需 Clutter 后端（clutter_init→EGL/GL 渲染上下文），OHOS 无显示服务、无 /dev/dri → 0 运行（非失败）；可运行子集改由 test_package 对安装包实跑免显示 API"
