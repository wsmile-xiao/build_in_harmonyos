package: clutter/1.26.4
homepage: "https://gitlab.gnome.org/Archive/clutter"

# 上游测试清点（R51 三步法第 1 步：适配前清点，逐项数字取自源码实测）
#   tests/conform/      26 个 TAP 测试程序（actor_tests 13 + general_tests 7
#                       + classes_tests 1 + deprecated_tests 5）+ 15 个
#                       script-*.json 数据驱动用例 = 41 项注册到 TESTS
#   tests/interactive/  53 个 UNIT_TESTS 源文件（交互式演示程序）
#   tests/accessibility/ 5 个 cally-*-example 程序（check_PROGRAMS，非注册 TESTS）
#   tests/micro-bench/  5 个测量程序（check_PROGRAMS）
#   tests/performance/  7 个性能程序（check_PROGRAMS）
#   合计 96 个测试程序 + 15 个脚本用例 = 111 项
upstream_tests: 111
upstream_test_command: "make -C tests check（tests/conform 经 glib-tap.mk 注册 TAP；interactive/accessibility/micro-bench/performance 为 check_PROGRAMS）"

# R51 三步法第 2 步：可运行环境实际运行结果（本机实测，如实申报）
#   - 上游 96 个测试程序全部需要 Clutter 后端（clutter_init 建立 EGL/GL
#     上下文 + 渲染目标）。OHOS 本环境无显示服务、无 /dev/dri，
#     clutter_init() 无法建立任何后端 → 96 项全部不可运行（0 运行）。
#     关联实测：同栈的 cogl/1.22.8 cogl_context_new(NULL) 在本机直接
#     SIGSEGV（cogl-1.22.8 notes.md 有记录），底层 GL 上下文本身无法创建。
#   - 消费者视角可运行子集改由本 test_package 实跑（免显示 API 子集），
#     见下方 test_package_tests。
upstream_test_run_note: "上游 96 测试程序 + 15 脚本用例需 Clutter 后端（clutter_init/EGL/GL 渲染上下文）；OHOS 无显示服务、无 /dev/dri，实测不可运行（0 运行，非失败）。逐项技术原因见 notes.md。"

test_package_tests:
  - file: consumer.c
    description: "消费测试：实质调用 Clutter 免显示 API —— 版本宏/CLUTTER_CHECK_VERSION、clutter_color_from_string/to_hls 颜色解析与色彩换算、clutter_units_from_pixels/to_pixels 单位换算（经 ClutterSettings 单例）、clutter_actor_new/set_size/get_size/set_name/get_name/get_reactive 对象生命周期与属性系统；共 14 处 CHECK 断言"
    command: "python3 test_clutter.py <package_folder>"

# 本 test_package 的断言总数（consumer.c 内 CHECK 宏调用数，实测 14）
assertion_count: 14
