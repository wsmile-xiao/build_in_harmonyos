# 版本级 manifest — cdecl 18.7.2

version: "18.7.2"
software: "cdecl"
status: built
build_date: "2026-08-14"
build_system: autotools

source:
  url: "https://github.com/paul-j-lucas/cdecl/releases/download/cdecl-18.7.2/cdecl-18.7.2.tar.gz"
  sha256: "e91cc201c79456b923b45cfa779da62f5ca91824d11c545167ee7bb33a9fb810"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--without-readline"
    - "--disable-term-size"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-hmdfs-pwd-umask.patch"
  - "0002-tests-ohos-portability.patch"

knowledge_gained:
  - "config.guess 无法识别 HarmonyOS，configure 需 --build=aarch64-unknown-linux-gnu 强制指定 build triplet"
  - "readline/term-size 为可选功能：--without-readline --disable-term-size 可避免外部依赖，核心翻译功能不受影响"
  - "发布 tarball 自带维护者机器生成的过期 src/config.h，需在 source() 删除以免遮蔽 configure 生成的 config.h（quoted include 优先命中源码树旧头文件）"
  - "HMDFS 下 getcwd 不可达：configure 的 ac_pwd 判定需回退 $PWD，config.status 临时目录 umask 077→022（E011/E129 先例）"
  - "上游测试为 automake TESTS（test/ 下 90 个 .test + src/ 下 4 个 check_PROGRAMS 单元测试），由 make check 运行，conanfile 解析 test-suite.log 输出 HMBS 标记"
