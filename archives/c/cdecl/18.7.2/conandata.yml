# conandata.yml — cdecl 18.7.2
# 官方源: paul-j-lucas/cdecl (GitHub Release 资产, 已本地实测 sha256)

sources:
  url: "https://github.com/paul-j-lucas/cdecl/releases/download/cdecl-18.7.2/cdecl-18.7.2.tar.gz"
  sha256: "e91cc201c79456b923b45cfa779da62f5ca91824d11c545167ee7bb33a9fb810"

patches:
  - patch_file: "patches/0001-configure-hmdfs-pwd-umask.patch"
    patch_description: "HMDFS 适配: configure 的 pwd 判定在 getcwd() 失败时回退 $PWD（真机父目录不可达导致 working directory cannot be determined）；config.status 临时目录 umask 077→022（HMDFS setgid 下 0700 目录变不可写）"
    patch_type: "portability"
  - patch_file: "patches/0002-tests-ohos-portability.patch"
    patch_description: "测试适配: config.test 改用构建目录可写相对路径构造只读配置场景（真机 /tmp 只读 erofs）；explain.out 移除 --disable-term-size 后不再输出的 terminal columns 警告"
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-portability.patch"
    patch_description: "OHOS 适配: (1) include 命令 wordexp 加 WRDE_NOCMD（musl 仅在 WRDE_NOCMD 下才返回 WRDE_BADCHAR，否则 '|' 等未引用 shell 字符被交给 /bin/sh 报 path syntax error，导致 include-unquoted 输出与 expected 不符）；(2) config.test 的 chmod 000 场景改为路径含普通文件组件的 ENOTDIR 构造（E046: OHOS 忽略 chmod()，无法构造 EACCES，改用内核级路径错误保持'配置打不开→非致命警告→继续'断言语义）"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-fork-tolerant-timestamp.patch"
    patch_description: "HMFS 适配: configure 内 automake 的 filesystem timestamp resolution 探测用子 shell + 命令替换运行 ls -t，HMFS/HMDFS 工作目录链不可达时（HMBS 平台诊断 shell_getcwd）fork 子 shell 偶发 'Out of memory'，导致 ls -t 无输出、configure 硬报 'ls -t produces unexpected output' 终止；把该探测与紧随其后的 build environment sanity 探测的失败分支从 as_fn_error 降级为 WARNING 并沿用默认 2 秒分辨率（am_try_resolutions 置空跳过后续 fork 密集的细粒度探测），build 环境 sanity 失败时继续（am_build_env_is_sane=yes），配合配方预置 am_cv_filesystem_timestamp_resolution 缓存变量跳过整个探测"
    patch_type: "portability"
