# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cdecl/18.7.2
homepage: "https://github.com/paul-j-lucas/cdecl"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试 (make check)
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (test/ 下 90 个 .test 用例 + src/ 下 4 个单元测试 check_PROGRAMS)
upstream_tests:
  - file: test/tests/command_line.test
    source: cdecl-18.7.2/test/tests/command_line.test
    description: "命令行用法测试: cast/declare/define/explain/show 等命令输出与 expected/ 对比"
    command: "./test/run_test.sh"
  - file: test/tests/declare.test
    source: cdecl-18.7.2/test/tests/declare.test
    description: "declare 命令测试: 英文声明翻译为 C 声明 (数组/指针/函数/const 等)"
    command: "./test/run_test.sh"
  - file: test/tests/explain.test
    source: cdecl-18.7.2/test/tests/explain.test
    description: "explain 命令测试: C 声明翻译为英文"
    command: "./test/run_test.sh"
  - file: src/red_black_test.c
    source: cdecl-18.7.2/src/red_black_test.c
    description: "红黑树数据结构单元测试 (check_PROGRAMS)"
    command: "./src/red_black_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_cdecl.sh
    description: "消费者测试: 真实调用 cdecl/c++decl 二进制, 验证 C<->英文声明双向翻译与版本输出 (4 个断言)"
    command: "bash test_cdecl.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
