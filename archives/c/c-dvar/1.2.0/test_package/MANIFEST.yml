# test_package/MANIFEST.yml — c-dvar 1.2.0 上游测试声明
# 上游测试命令：meson test（默认配置，共 4 项，无跳过条件；
# Enumerated Types 测试需可选依赖 libdbus-typenum，上游 required:false 默认不注册）

package: c-dvar/1.2.0
homepage: "https://github.com/c-util/c-dvar"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test-api.c
    source: c-dvar-1.2.0/src/test-api.c
    description: "API Symbol Visibility——导出符号与 libcdvar.sym 一致性"
    command: "./build/src/test-api"
  - file: src/test-basic.c
    source: c-dvar-1.2.0/src/test-basic.c
    description: "Basic API Behavior——序列化/反序列化基线与读写操作"
    command: "./build/src/test-basic"
  - file: src/test-string.c
    source: c-dvar-1.2.0/src/test-string.c
    description: "D-Bus String Restrictions——D-Bus 字符串约束校验"
    command: "./build/src/test-string"
  - file: src/test-type.c
    source: c-dvar-1.2.0/src/test-type.c
    description: "Type and Signature Parser——类型与签名解析器"
    command: "./build/src/test-type"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：(su) 变体写读往返断言，大小端各一轮，含类型串比较"
    command: "ctest --test-dir . --output-on-failure"

# 测试断言总数 (近似值, 用于质量评估；静态统计 assert( 出现次数)
# test-api.c: 42 + test-basic.c: 36 + test-string.c: 18 + test-type.c: 22
# （test-enumerated.c: 5 随可选依赖不启用，不计入）
assertion_count: 118
