# test_package/MANIFEST.yml — cado 0.9.6
# CI L0e 强制要求此文件存在；断言计数与 conanfile.py test() / PR 正文一致。

package: cado/0.9.6
homepage: "https://github.com/rd235/cado"

# 上游 cado 0.9.6 无任何测试基础设施（rule4 N=0，清点证据见 PR 正文）：
# 顶层 CMakeLists.txt 仅 add_subdirectory(man/src) + uninstall 自定义目标，
# src/CMakeLists.txt 仅 4 个可执行目标（cado/cadrop/scado/caprint），
# 无 tests/ 目录、无 make check/ctest/meson test 目标。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序（rule4 清点：N=0）
upstream_tests: []

# test_package 消费者级测试（鸿蒙特有，rule12；4 个二进制 × 存在+输出 = 8 断言点）
test_package_tests:
  - file: conanfile.py
    description: "cado/cadrop/scado/caprint 四个二进制存在且可执行，-h/非法参数差异化输出断言（cado/caprint 含 usage；cadrop 输出 parsing capabilities；scado 运行时检查分支非空输出）"
    command: "conan create test_package（test() 实跑）"

# 断言计数：4 二进制存在性 + 4 二进制输出断言 = 8（与 PR 正文/notes 一致）
assertion_count: 8
