software: cuetools
version: "1.4.1"
status: built
build_date: "2026-06-03"
build_system: autotools

source:
  url: "https://github.com/svend/cuetools/archive/refs/tags/1.4.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "LDFLAGS=-fuse-ld=bfd -L/storage/Users/currentUser/usr/local/lib"
    - "CONFIG_SHELL=bash"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.in.patch"
  - "0002-aclocal.m4.patch"
  - "0003-ar-lib.patch"
  - "0004-compile.patch"
  - "0005-config.h.in.patch"
  - "0006-configure.patch"
  - "0007-depcomp.patch"
  - "0008-doc-Makefile.in.patch"
  - "0009-extras-Makefile.in.patch"
  - "0010-install-sh.patch"
  - "0011-missing.patch"
  - "0012-src-Makefile.in.patch"
  - "0013-src-lib-Makefile.in.patch"
  - "0014-src-tools-Makefile.in.patch"
  - "0015-ylwrap.patch"

knowledge_gained:
  - id: E035
    title: "HMDFS mktemp umask 077 目录无法写入"
    description: "HMDFS 上 mktemp -d 使用 umask 077 创建目录被 UID 20001006 拥有，进程 UID 20020082 无法写入；需将 umask 改为 007 并 chmod g+rwx"
  - id: E036
    title: "鸿蒙 ELF 签名阻止 configure 测试程序执行"
    description: "鸿蒙要求 ELF 签名后才能执行，configure 的 conftest 无法运行导致误判为交叉编译；需修改 configure 脚本跳过运行时检测"
  - id: lld-fallback
    title: "lld 链接器不可用时使用 bfd 替代"
    description: "lld 因依赖 libxml2.so.16 缺失而失败；使用 LDFLAGS=-fuse-ld=bfd 替代"

install_products:
  bin:
    - cuebreakpoints
    - cueconvert
    - cueprint
    - cuetag.sh
  lib: []
  man:
    - share/man/man1/cuebreakpoints.1
    - share/man/man1/cueconvert.1
    - share/man/man1/cueprint.1

quality_gates:
  G0_clean_build: PASS
  G1_binary_integrity: PASS
  G2_functionality: PASS
  G3_portability: PASS
  G4_archive_integrity: PASS

