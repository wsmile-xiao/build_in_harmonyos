software: cuetools
display: "cuetools"
description: "Utilities for .cue and .toc files — 提取断点、格式转换、信息打印、标签写入"
category: data
homepage: "https://github.com/svend/cuetools"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "HMDFS 文件系统上 mktemp -d 使用 umask 077 创建的目录被 UID 20001006 拥有，进程 UID 20020082 无法写入；需将 umask 改为 007 并 chmod g+rwx"
    - "鸿蒙 ELF 签名阻止 configure 的 conftest 测试程序执行；需修改 configure 脚本跳过运行时检测"
    - "lld 链接器因 libxml2.so.16 缺失而不可用；使用 LDFLAGS=-fuse-ld=bfd 替代"
    - "源码 tarball 不含 configure，需 autoreconf -fi 生成构建文件；补丁集已包含所有生成文件"
  common_dependencies: []

versions:
  "1.4.1":
    status: built
    build_date: "2026-06-03"