# ============================================================
# 必须字段
# ============================================================

version: "2.0.0"

# published | built | failed | archived
status: built

build_system: cmake

build_date: "2026-09-16"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/PDB-REDO/cif-tools/archive/refs/tags/v2.0.0.tar.gz"
  sha256: "8f19a41a47bbfa1e1f3b221dcb7e3c59b419da2e6e95b72019ad0fd29523e503"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

compiler: clang

requires:
  - "libcifpp/10.0.4"
  - "libmcfp/1.4.2"
  - "mrc/1.3.17"

build_options:
  - "C++20（上游 CMakeLists 硬编码 CMAKE_CXX_STANDARD 17，patch 0001 改为 20）"
  - "-fexperimental-library（OHOS libc++15 的 std::format / std::ranges 需该开关才暴露 API）"
  - "std::format → fmt::format（libc++15 链接期缺 format_error 符号，patch 0002）"
  - "CMakeDeps 别名：libcifpp→cifpp::cifpp、libmcfp→mcfp::mcfp（上游 find_package 名与 conan 包名不同）"

# ============================================================
# 测试信息
# ============================================================

test_status: passed

test_note: "上游 2.0.0 **未提供测试**：CMakeLists.txt 的 `if(BUILD_TESTING)` 整块被注释掉（源码实测确认），无 ctest、无测试源文件——如实申报，非'环境不可用'。test_package 以消费者视角真实执行：①6 个可执行文件齐全；②6 个工具 `--version` 均 rc=0（验证动态链接依赖全部可解析，该断言曾实测揪出 libfmt.so.7 缺失）；③6 个工具 `--help` 均输出用法。实测 `conan create` exit=0、test_package PASS。"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 CMake 工程用**普通变量** `set(CMAKE_CXX_STANDARD 17)` 固定标准时，CMakeToolchain 的 `tc.variables['CMAKE_CXX_STANDARD']` 会被覆盖，且 CMake 会在编译命令行**末尾追加 -std=c++17**（实测 CXX_FLAGS 尾部即 -std=c++17），把配方经 extra_cxxflags 注入的 -std=c++20 压掉——此时唯一可靠的修法是 patch 上游该行"
  - "conandata.yml 里声明了 patches 但配方**未调用 apply_conandata_patches** 时，补丁会被导出却永不应用，且**不报错**（静默失效）；症状是构建行为与未打补丁完全一致（本次实测：CXX_FLAGS 仍为 -std=c++17）"
  - "OHOS libc++15 的 std::format **能编译但无法链接**：ld.lld 报 `undefined symbol: typeinfo for std::__n1::format_error`——libc++.so 内无 format_error 实现，-fexperimental-library 只让头文件暴露 API"
  - "OHOS clang15 未实现两个 Clang 16 才有的 C++20 特性，且在 -std=c++20 与 -std=c++2b 下**均失败**：P1091（lambda 捕获结构化绑定 → \"'x' in capture list does not name a variable\"）与 P0960（聚合的括号式初始化 → \"no matching function for call to 'construct_at'\"）"
  - "cif-tools 的 cif-diff 传两个文件会**启动 Vim 分页器**（实测 rc=124 挂起，'Vim: Warning: Output is not to a terminal'）——CI 沙箱无 TTY，不能作为 test_package 断言；cif-validate/mmcql 解析 CIF 需 mmcif_pdbx.dic 字典（不在包内），同样不可作断言"
