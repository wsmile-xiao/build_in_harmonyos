# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cif-tools/2.0.0
homepage: "https://github.com/PDB-REDO/cif-tools"

# 上游测试命令 — 2.0.0 发行版**无上游测试**
# CMakeLists.txt 里整个 `if(BUILD_TESTING)` 块被注释掉（源码实测确认），
# 无 ctest / 无测试源，故无 upstream_check_command 可执行。
# 如实申报：不是"没环境"，而是上游未提供测试。
upstream_check_command: ""  # 上游未提供测试（BUILD_TESTING 整块被注释）
upstream_test_in_build: false
upstream_test_command: ""   # 同上

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_cif_tools.sh
    description: >-
      真实消费验证 3 组断言（R34 反空壳）：①6 个可执行文件齐全
      （pdb2cif/cif2pdb/cif-diff/cif-merge/cif-validate/mmcql）；
      ②6 个工具 `--version` 均成功执行（rc=0）——工具为动态链接，能运行即证明
      其共享库依赖（libcifpp/libmcfp/fmt 等）全部可解析，该断言曾实测揪出
      libfmt.so.7 缺失；③6 个工具 `--help` 均输出用法文案。
      不做真实 CIF 解析断言：cif-validate/mmcql 需包外的 mmcif_pdbx.dic 字典；
      cif-diff 传两文件会启动 Vim 分页器而挂起（CI 无 TTY）——均实测确认。
    command: "bash test_cif_tools.sh <pkg_dir>"
  - file: conanfile.py
    description: "验证 6 个可执行文件均存在（6 断言）"
    command: "conan test"

# 测试断言总数（近似值，用于质量评估）
# = test_package 脚本（6 存在性 + 6 版本执行 + 6 用法输出 = 18）+ conanfile（6）
assertion_count: 24
