# conandata.yml — cif-tools 2.0.0
# 官方源（GitHub PDB-REDO/cif-tools，R39 合规）
# 注意 tag 带 `v` 前缀（v2.0.0）。

sources:
  url: "https://github.com/PDB-REDO/cif-tools/archive/refs/tags/v2.0.0.tar.gz"
  sha256: "8f19a41a47bbfa1e1f3b221dcb7e3c59b419da2e6e95b72019ad0fd29523e503"

patches:
  # 上游 CMakeLists 用普通变量 `set(CMAKE_CXX_STANDARD 17)` 固定 C++17，
  # 该变量会覆盖 toolchain 注入的同名 cache 变量，CMake 因而在编译命令行
  # **末尾追加 -std=c++17**（实测 CXX_FLAGS 尾部即 -std=c++17），把配方
  # 传入的 -std=c++20 压掉 → libcifpp/10.0.4 头文件报错
  # （item.hpp: unknown type name 'concept' / 'FloatType'、
  #   no template named 'remove_cvref_t'）。
  # 故直接改上游该行为 C++20（与同源包 libcifpp 的 C++20 口径一致）。
  - patch_file: "patches/0001-cmake-cxx-standard-20.patch"
    patch_description: "CMakeLists.txt: set(CMAKE_CXX_STANDARD 17) -> 20（libcifpp 10 头文件要求 C++20；普通变量会覆盖 toolchain 值并追加 -std=c++17）"
    patch_type: "portability"

  # `std::format` 在 OHOS libc++15 上**能编译但无法链接**：
  #   ld.lld: error: undefined symbol: typeinfo for std::__n1::format_error
  #            >>>> std::__n1::__throw_format_error
  # （libc++.so 内无 format_error 相关符号；-fexperimental-library 只让头文件
  #   暴露 API，不提供实现）。故按站点机械替换为 fmt::format——与同源包
  #   libcifpp/10.0.4 处理其 94 处 std::format 的做法一致；fmt 由 libcifpp
  #   以 transitive_headers/libs 传递，且其 cpp_info 已带 FMT_HEADER_ONLY=1
  #   （header-only 使用，无需额外链接 fmt 库）。
  # 全树仅 3 处：src/mmcql.cpp ×2、readln/readln.cpp ×1（0 处自定义 formatter）。
  - patch_file: "patches/0002-std-format-to-fmt.patch"
    patch_description: "std::format -> fmt::format（3 处：mmcql.cpp ×2、readln.cpp ×1）+ 换 include 为 <fmt/format.h>（OHOS libc++15 的 std::format 链接期缺 format_error 符号）"
    patch_type: "portability"
