software: cweb
display: "CWEB"
description: "C/C++/Java 文学编程文档系统 — 将 TeX 文档与 C/C++ 代码写在同一 .w 源文件中，通过 ctangle 生成 .c 文件，通过 cweave 生成 .tex 文件"
category: doc
homepage: "https://github.com/ascherer/cweb"
license: Knuth-CTAN
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile DESTDIR 与标准 staging 冲突；补丁重构为 PREFIX/DESTDIR/BINDIR 正确语义"
    - "Bootstrap 编译需 ELF 签名 ctangle 后才能继续"
    - "LINKFLAGS 必须使用 -fuse-ld=/data/service/hnp/bin/ld.bfd（lld 有 libxml2 依赖问题）"
    - "文件名长度限制约 128 字符；避免使用过长绝对路径"
  common_dependencies: []

versions:
  "4.12.2":
    status: published
    build_date: "2026-06-09"