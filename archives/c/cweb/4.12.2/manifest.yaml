knowledge_gained:
- CWEB 使用简单 Makefile（非 autotools）；DESTDIR 变量名与标准 staging DESTDIR 冲突
- Bootstrap 编译需在 ctangle 编译后执行 ELF 签名才能继续生成 cweave.c
- LINKFLAGS 必须使用 -fuse-ld=/data/service/hnp/bin/ld.bfd 避免 lld 的 libxml2 依赖错误
- CWEB 文件名长度限制约 128 字符；绝对路径可能触发 'Filename too long' 错误
- '知识图谱草稿: E105-draft-9EAF (lld libxml2 依赖), E106-draft-700D (bootstrap ELF 签名)'
g0_note: 'G0 失败原因: cweb 是 bootstrap 程序，编译 ctangle 后需立即执行生成 cweave.c，但 OHOS 要求 ELF
  签名才能执行。G0 subprocess 无法在 make 过程中插入签名步骤。此为已知平台限制（E106），手动编译已验证通过。'
