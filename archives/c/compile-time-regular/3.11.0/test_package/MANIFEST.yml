# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: compile-time-regular/3.11.0
homepage: "https://github.com/hanickadot/compile-time-regular-expressions"

# 上游测试命令（上游 CI .github/workflows/tests.yml 用 make CXX_STANDARD=17|20
# 逐个编译 tests/*.cpp——编译期断言测试，编译成功即断言全部成立）
upstream_check_command: "make CXX_STANDARD=17 (upstream CI 同口径；配方 build() 内全量编译 tests/ 25 目标 + 运行 6 个运行期用例)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "conan create (配方 build() 全量编译 tests/ 25 个测试目标，6 个含 main 用例实际运行，报告 upstream-tests-report.txt)"

# 上游实际执行的测试（tests/CMakeLists.txt file(GLOB *.cpp) + Makefile
# TESTS := $(wildcard tests/*.cpp) 双注册口径，25 个编译目标全量执行，
# 0 修改 0 排除；benchmark/ 子目录被上游 Makefile IGNORE 与 CMake GLOB 排除）
upstream_tests:
  - file: __utf8.cpp
    description: "UTF-8 range 编译期断言（需 CTRE_ENABLE_UTF8_RANGE 宏时启用 UNICODE_TEST，其余空翻译单元）"
  - file: _bad_cycle.cpp
    description: "bad cycle 防回归编译期断言（issue 防护）"
  - file: _fixed-string.cpp
    description: "ctll::fixed_string 宽字符/UTF-8 尺寸断言"
  - file: _unicode.cpp
    description: "ctre-unicode 编译期断言（\\p 属性类匹配）"
  - file: ci.cpp
    description: "大小写敏感/不敏感匹配断言（case_insensitive mode）"
  - file: cnttp.cpp
    description: "CNTTP 编译器能力探测运行期程序（C++17 emulation 路径）"
  - file: correct-conversion.cpp
    description: "grammar 转换正确性运行期程序"
  - file: gcc8.cpp
    description: "gcc8 兼容性 fixed_string 匹配翻译单元"
  - file: generating.cpp
    description: "正则→NFA 生成器结构断言（175 个编译期断言）"
  - file: gets.cpp
    description: "捕获组 get<N>() 接口翻译单元"
  - file: is_prime.cpp
    description: "素数正则运行期程序（.?|(..+?)\\g{1}+ 反向引用，12 个编译期断言）"
  - file: many-of-same-proto.cpp
    description: "大量同类模式编译压力测试（原型生成器路径）"
  - file: matching.cpp
    description: "核心匹配语义断言（129 个编译期断言）"
  - file: matching2.cpp
    description: "匹配语义第二组（218 个编译期断言，UTF-8 路径）"
  - file: matching2-msvc-greedy.cpp
    description: "MSVC 贪婪语义变体断言（194 个编译期断言）"
  - file: matching3.cpp
    description: "匹配语义第三组（148 个 TEST_MATCH/SEARCH 宏用例 + 8 个断言）"
  - file: mode.cpp
    description: "匹配模式（singleline/multiline）断言"
  - file: msvc.cpp
    description: "MSVC 兼容 fixed_string 内联变量断言"
  - file: parsing.cpp
    description: "PCRE 语法解析断言（136 个编译期断言）"
  - file: range.cpp
    description: "search_all 区间迭代运行期程序（命名捕获组）"
  - file: results.cpp
    description: "results 集合比较运算运行期程序"
  - file: string.cpp
    description: "字符串构造断言"
  - file: trampoline.cpp
    description: "trampoline 递归防护翻译单元"
  - file: wide-pattern.cpp
    description: "宽字符 pattern 运行期程序"
  - file: z_matching.cpp
    description: "lazy/possessive 量词匹配断言（issue #131 防回归）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ctre.cpp
    description: "CTRE 消费者冒烟：C++17 fixed_string NTTP 编译期正则实例化、编译期捕获提取（constexpr optional<date> + static_assert）、运行期 search/search_all/命名捕获组/starts_with/multiline 验证"
    command: "./test_ctre"

# 上游编译期断言合计（static_assert 1019 个 + TEST_* 宏展开用例 133 个）；
# 6 个运行期用例实测退出码全 0
assertion_count: 1152
