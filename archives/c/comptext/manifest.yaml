software: comptext
display: "comptext"
description: "comptext — FLTK 图形文本对比工具（W1HKJ 业余无线电软件家族，与 fldigi/flrig 同源）"
category: hamradio
homepage: "https://github.com/w1hkj/comptext"
license: GPL-2.0-or-later

ohos_adaptation:
  key_points:
    - "构建系统：autotools（自带 configure 2.68，无需 autoreconf）"
    - "硬依赖 libfltk（API 1.1/1.3）→ conan requires libfltk/1.3.11（静态库，含 libx11/1.8.13 + xorgproto/2025.1 传递依赖）"
    - "config.guess 2008 版不识别 HarmonyOS → 添加 aarch64-HarmonyOS 分支映射为 aarch64-unknown-linux-gnu（qalculate-gtk 同款最小补丁，不动 config.sub）"
    - "configure 的 mktemp -d 带 umask 077，HMDFS 上 0700 目录属主映射为 file_manager 导致 config.status 写入 Permission denied → 改 mkdir 保持组写"
    - "main.cxx 的 printf(\"Version: \"VERSION) 被 C++11 词法视为 UDL 后缀（宏不展开）→ 加空格修复"
    - "FLTK_CFLAGS/FLTK_LIBS 手动注入（fltk-config 引用的 .cache 路径为 CI 残留不可用）；configure.ac 检测到两者已设即跳过 fltk-config 检查"
    - "LD_LIBRARY_PATH 注入依赖 lib + OHOS SDK llvm/lib（libc++_shared.so，configure conftest 运行时必需）"
    - "make 需 -j1（HMDFS 不支持 make jobserver mkfifo）"
  common_dependencies:
    - libfltk

versions:
  "1.0.1":
    status: built
    build_date: "2026-09-10"
