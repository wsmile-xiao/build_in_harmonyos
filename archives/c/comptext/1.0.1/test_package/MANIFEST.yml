# test_package/MANIFEST.yml — comptext 1.0.1
# CI L0e requires this file to exist.

package: comptext/1.0.1
homepage: "https://github.com/w1hkj/comptext"

# 上游测试清点（R51 三步法穷尽核查证据）:
# 1. 源码包全文件清单：无 tests/ 目录、无 *_test 源文件
# 2. make check 实际执行：check-am 为空目标（无 TESTS/check_PROGRAMS 注册），
#    上游唯一 "jabbertest.txt" 为数据文件（data/ 目录，非测试程序）
# 3. GitHub v1.0.1 仓库树核查：无 test/check 相关路径；无 .gitignore 测试钩子
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序
upstream_tests: []

# test_package 测试（消费者视角，R34 实质断言）
test_package_tests:
  - file: test.sh
    description: "执行 comptext --version 断言输出 Version 信息；执行 --help 断言列出 --version 选项（2 项断言）"
    command: "bash test.sh"

assertion_count: 2
