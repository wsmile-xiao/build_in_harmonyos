# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "config.guess 2008 版不识别 HarmonyOS（uname -s=HarmonyOS），需添加 aarch64-HarmonyOS 分支映射为 aarch64-unknown-linux-gnu（qalculate-gtk 同款最小补丁，config.sub 无需改动）"
  - "configure 的 mktemp -d 带 umask 077 在 HMDFS 上创建 0700 目录，属主映射为 file_manager 导致进程 euid 20020179 写入 Permission denied——改 mkdir 保持组写权限"
  - "C++11 中 printf(\"Version: \"VERSION) 字符串后紧跟标识符（无空格）被词法视为用户自定义字面量后缀，宏不展开报 invalid suffix on literal——加空格修复"
  - "fltk-config 脚本引用的 .cache 路径为 CI 构建残留本地不可用；configure.ac 检测到 FLTK_CFLAGS/FLTK_LIBS 已设即跳过 fltk-config 检查，手动注入依赖路径即可"
  - "configure conftest 运行时需 LD_LIBRARY_PATH 注入 libX11 及其传递库（libxcb/libXau/libXdmcp）+ OHOS SDK llvm/lib（libc++_shared.so）"

