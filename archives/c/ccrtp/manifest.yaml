# 软件级 manifest.yaml
# ccrtp - GNU Common C++ RTP library
# 文件位置: archives/c/ccrtp/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: ccrtp
display: "GNU ccRTP"
description: "基于 GNU uCommon/Common C++ 框架的 C++ RTP 实时传输协议库（RFC 3550/3551/3555）"
category: network
homepage: "https://www.gnu.org/software/ccrtp/"
license: GPL-2.0-or-later
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "旧版 autotools config.guess/config.sub (2003) 不识别 ohos——需为 config/config.guess 插 linux-ohos 分支、config/config.sub 加 linux-ohos* 识别 aarch64-unknown-linux-ohos"
    - "2013 版 config.guess 不识别 HarmonyOS，需补丁识别 aarch64-unknown-linux-ohos (E007)"
    - "HMDFS/HMFS getcwd 失效：build() 入口 chdir(build_folder)+PWD 同步，configure 的 ac_pwd=`pwd` 改为 `pwd 2>/dev/null || ac_pwd=\"$PWD\"` 兜底（aribb24/nspr/cdecl 同款）"
    - "HMDFS 临时目录：复用 HMBS 注入的 TMPDIR/HMBS_AUTOCONF_MKTEMP_FALLBACK，mktemp 模板改为 ${TMPDIR}/confXXXXXX，umask 077→022，ls -t/时间戳探测在 fork 失败时降级为警告"
    - "HNP bash 在 HMFS 上 getcwd 失败——用 HMBS 注入的 SHELL=/bin/sh (CONFIG_SHELL) 执行 configure/make"
    - "鸿蒙 libc 无 pthread_testcancel——stub 头 + -include 注入 (同 commoncpp2)"
    - "SRTP 可选加密层：无 libgcrypt/OpenSSL 时上游 configure 硬失败，需 --disable-srtp"
    - "C++17 (profile cppstd) 需通过 CXXFLAGS 追加 -std=c++17 覆盖 WARN_FLAGS 的 -ansi"
    - "cpp_info.requires 声明 ucommon::ucommon 使下游 include 传递"
  common_dependencies:
    - commoncpp2
    - ucommon
    - zlib
    - openssl

# 版本索引
versions:
  "1.0.2":
    status: built
    build_date: "2026-09-02"
    conan_ref: "ccrtp/1.0.2"
    note: "HarmonyOS PC 适配完成（autotools + OHOS 补丁），依赖 commoncpp2 1.8.1，上游无 check 目标，如实记录"
  "2.1.2":
    status: built
    build_date: "2026-09-06"
    conan_ref: "ccrtp/2.1.2"
    notes: "autotools 构建，基于 conan ucommon/7.0.1，--disable-srtp"
