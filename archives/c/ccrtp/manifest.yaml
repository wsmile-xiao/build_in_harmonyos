software: ccrtp
display: "GNU ccRTP"
description: "GNU ccRTP - RTP stack for Common C++ (RFC 3550/3551/3555)"
category: network
homepage: "https://www.gnu.org/software/ccrtp/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "旧版 autotools config.guess/config.sub (2003) 不识别 ohos——需为 config/config.guess 插 linux-ohos 分支、config/config.sub 加 linux-ohos* 识别 aarch64-unknown-linux-ohos"
    - "HMDFS/HMFS getcwd 失效：build() 入口 chdir(build_folder)+PWD 同步，configure 的 ac_pwd=`pwd` 改为 `pwd 2>/dev/null || ac_pwd=\"$PWD\"` 兜底（aribb24/nspr/cdecl 同款）"
    - "HMDFS 临时目录：复用 HMBS 注入的 TMPDIR/HMBS_AUTOCONF_MKTEMP_FALLBACK，mktemp 模板改为 ${TMPDIR}/confXXXXXX，umask 077→022，ls -t/时间戳探测在 fork 失败时降级为警告"
    - "HNP bash 在 HMFS 上 getcwd 失败——用 HMBS 注入的 SHELL=/bin/sh (CONFIG_SHELL) 执行 configure/make"
    - "依赖 commoncpp2 1.8.1 (OHOS 已发布)——1.0.2 要求 ≥1.0.0，利用新版向前兼容，configure 时注入 CFLAGS/CXXFLAGS/LDFLAGS 与 PKG_CONFIG_PATH"
    - "鸿蒙 libc 无 pthread_testcancel——stub 头 + -include 注入 (同 commoncpp2)"
  common_dependencies:
    - commoncpp2
    - zlib
    - openssl

versions:
  "1.0.2":
    status: built
    build_date: "2026-09-02"
    conan_ref: "ccrtp/1.0.2"
    note: "HarmonyOS PC 适配完成（autotools + OHOS 补丁），上游无 check 目标，如实记录"
