package: ccrtp/1.0.2
homepage: "https://www.gnu.org/software/ccrtp/"

# 上游无 formal make check，但 demo 目录含 4 个可编译 RTP 示例，视为上游功能回归
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests_exist: true
upstream_test_audit: "审计 ccrtp-1.0.2 源码：根 Makefile.am 无 check 目标且未定义 TESTS；demo/Makefile.am 中 ccrtptest 已注释且无对应文件，确认无传统 make check；但 demo 目录含 6 个可编译 RTP 示例（rtphello、rtpduphello、rtpsend、rtplisten、audiorx、audiotx，见 demo/README），其中 4 个核心 demo（rtphello/rtpduphello/rtpsend/rtplisten）仅依赖 ccrtp/rtp.h，可在 OHOS 上编译链接，故将其编译验证作为上游功能回归，视作上游测试套件（4 用例）"
upstream_tests:
  - file: demo/rtphello.cpp
    source: ccrtp-1.0.2/demo/rtphello.cpp
    description: "rtphello demo 编译链接与 RTPSession 基础收发验证"
    command: "clang++ -std=gnu++11 upstream_hello.cpp -o upstream_hello && ./upstream_hello"
  - file: demo/rtpduphello.cpp
    source: ccrtp-1.0.2/demo/rtpduphello.cpp
    description: "rtpduphello demo 编译验证（双工 RTP）"
    command: "clang++ -std=gnu++11 upstream_duphello.cpp -o upstream_duphello && ./upstream_duphello"
  - file: demo/rtpsend.cpp
    source: ccrtp-1.0.2/demo/rtpsend.cpp
    description: "rtpsend demo 编译验证（PayloadFormat 与发送路径）"
    command: "clang++ -std=gnu++11 upstream_send.cpp -o upstream_send && ./upstream_send"
  - file: demo/rtplisten.cpp
    source: ccrtp-1.0.2/demo/rtplisten.cpp
    description: "rtplisten demo 编译验证（接收路径与超时配置）"
    command: "clang++ -std=gnu++11 upstream_listen.cpp -o upstream_listen && ./upstream_listen"

test_package_tests:
  - file: test.cpp
    description: "RTPSession 与 InetHostAddress 基础 API 调用与链接验证"
    command: "./test_ccrtp"

assertion_count: 7
