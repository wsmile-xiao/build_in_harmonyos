package: ccrtp/1.0.2
homepage: "https://www.gnu.org/software/ccrtp/"
description: "GNU ccRTP - RTP stack for Common C++"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "依赖 commoncpp2 1.8.1（OHOS 已发布，1.0.2 要求 ≥1.0.0，利用新版向前兼容）"
    - "旧版 config.guess/config.sub 不识别 ohos——config/config.guess 插 linux-ohos 分支、config/config.sub 加 linux-ohos*"
    - "HMDFS/HMFS getcwd 失效：build() 入口 chdir(build_folder)+PWD 同步，configure 的 ac_pwd=`pwd` 改为 `pwd 2>/dev/null || ac_pwd=\"$PWD\"` 兜底"
    - "HMDFS 临时目录：复用 HMBS 注入的 TMPDIR/HMBS_AUTOCONF_MKTEMP_FALLBACK（fallback 到 build_folder/tmp），mktemp 模板改为 ${TMPDIR}/confXXXXXX，umask 077→022，ls -t/时间戳探测在 fork 失败时降级为警告"
    - "HNP bash 在 HMFS 上 getcwd 失败——用 HMBS 注入的 SHELL=/bin/sh (CONFIG_SHELL) 执行 configure/make"
    - "鸿蒙缺少 pthread_testcancel——stub 头 + -include 注入，C++98 需 -std=c++98 -fpermissive"
  dependencies:
    - commoncpp2/1.8.1

versions:
  "1.0.2":
    status: built
    build_date: "2026-09-02"
    conan_ref: "ccrtp/1.0.2"
    note: "HarmonyOS PC 适配完成；上游无 make check，如实记录"
