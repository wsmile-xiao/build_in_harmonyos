patches:
  - patch_file: "patches/0001-autoconf-config.guess.patch"
    patch_description: "config.guess: recognize HarmonyOS (aarch64-unknown-linux-ohos) — shipped 2013 script cannot guess build type on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0002-autoconf-config.sub.patch"
    patch_description: "config.sub: accept -linux-ohos* kernel/OS triples"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: define SRTP_OPENSSL/SRTP_GCRYPT automake conditionals unconditionally (enable --disable-srtp); umask 022 for config.status tmp dir (E129 HMDFS setgid)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-CryptoContextCtrl.cpp.patch"
    patch_description: "CryptoContextCtrl.cpp: include ccrtp/CryptoContext.h so SrtpEncryptionNull/SrtpAuthenticationNull are visible outside SRTP_SUPPORT guards"
    patch_type: "portability"
