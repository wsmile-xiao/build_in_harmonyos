# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "SRTP 为可选加密层，缺少 libgcrypt/OpenSSL 时上游 configure 硬失败，--disable-srtp 即可（核心 RTP 不依赖加密后端）"  # ref: E027
  - "ccrtp 用 PKG_CHECK_MODULES 检查 commoncpp，ucommon 配方 pkg_config_name=ucommon；需生成 commoncpp.pc shim + 注入 PKG_CONFIG_PATH"  # ref: E075
  - "clang15 下 ccrtp WARN_FLAGS 的 -ansi(C++03) 触发 ucommon nullptr shim 冲突，CXXFLAGS 追加 -std=c++17 覆盖"  # ref: E130
  - "Conan static->static 库链：下游消费者的传递依赖 require.headers 默认 False，仅 cpp_info.requires 不传递头文件路径；须在 requirements() 用 transitive_headers=True（E269 草稿）"  # ref: E269

