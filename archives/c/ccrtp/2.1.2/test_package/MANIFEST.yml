# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ccrtp/2.1.2
homepage: "https://www.gnu.org/software/ccrtp/"

# 上游测试命令 (make check)。上游没有 automake TESTS，
# demo/ 下的程序 (ccrtptest/rtphello/rtpsend 等) 是示例程序而非测试套件，
# make check 为空操作 (Nothing to be done for 'check')。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 — 上游无自动化测试套件；
# demo/ 示例程序 (需网络 RTP 会话) 作为功能参考，未纳入自动化测试
upstream_tests:
  - file: demo/ccrtptest.cpp
    source: ccrtp-2.1.2/demo/ccrtptest.cpp
    description: "upstream demo: RTP session tx/rx exercise (network, not a CI test suite)"
    command: "./demo/ccrtptest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ccrtp.cpp
    description: "consumer smoke test: InetHostAddress + RTPPacket parse/verify"
    command: "./test_ccrtp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
