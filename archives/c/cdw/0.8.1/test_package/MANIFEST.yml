package: cdw/0.8.1
homepage: "https://sourceforge.net/projects/cdw/"

# cdw 0.8.1 上游测试：无独立测试框架（0/0 如实——test-driver 是
# automake 生成辅助脚本非用例）。
# 适配状态：失败记录模式（adplay 同款）——依赖 burn（libburn）制品仓
# 完全缺失，configure 硬性必需（AC_CHECK_LIB exit -1）不可绕过，
# manifest status: failed + failure_reason 如实记录，不伪造构建通过。
# 消费测试：test_cdw.py——验证归档完整性（conanfile/manifest/conandata
# 存在 + status=failed 如实 + failure_reason 含 burn 说明）。
upstream_tests: 0
upstream_test_command: ""

test_package_tests:
  - file: test_cdw.py
    description: "失败记录归档完整性：conanfile/manifest/conandata 存在 + status=failed 如实 + failure_reason 含 burn（5 断言）"
    command: "python3 test_cdw.py <package_folder>"

assertion_count: 5
