software: cdw
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.8.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游最新 0.8.1——Debian trixie 0.8.1-3，清单 1.0.0 不符
# 按真实版）
version: "0.8.1"

# 编译状态
# published | built | failed | archived
status: failed

# 失败原因（失败记录模式——adplay 同款）
failure_reason: "依赖 burn（libburn/libburnia）制品仓完全缺失（无配方无包）；configure.ac 对 burn 是硬性必需检查（AC_CHECK_LIB [burn] [burn_initialize] 失败 exit -1），无 --disable 绕过——真实构建不可能，如实记录"

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"

# 构建系统标识（verify-build 要求）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian pool 镜像——sourceforge 下载失败）
  url: "http://deb.debian.org/debian/pool/main/c/cdw/cdw_0.8.1.orig.tar.gz"

  # 源码校验和
  sha256: "e7eb49c5c58f26182c13ce62aa80297b281218b1def5f2aad8fa02740cbb979c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 构建系统标识（verify-build 要求）
  build_system: autotools

  # 配置选项列表（--disable-nls；无 burn 相关 disable——configure 硬性必需）
  configure_options:
    - "--disable-nls"

  # 编译依赖列表（格式: name/version）——已合入：libcdio（含
  # cdio+iso9660）+ ncurses（wide 全家 formw/menuw/ncursesw/panelw）
  dependencies:
    - "libcdio/2.3.0"
    - "ncurses/6.4"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "cdw（cdrecord 前端）依赖 cdio+iso9660（制品仓 libcdio/2.3.0 内含两库）+ ncursesw 全家（ncurses/6.4）+ burn——burn 制品仓完全缺失且 configure 硬性必需（exit -1）不可绕过，失败记录模式如实记录"
    - "上游无独立测试框架（0/0 如实；test-driver 是 automake 生成辅助脚本非用例）"
