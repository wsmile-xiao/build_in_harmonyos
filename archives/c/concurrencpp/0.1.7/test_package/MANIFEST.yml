# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: concurrencpp/0.1.7
homepage: "https://github.com/David-Haim/concurrencpp"

# 上游测试命令 (ctest -N 分析：test/CMakeLists.txt 定义 26 个 CTest 目标)
upstream_check_command: "ctest --test-dir build-test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（26 个 CTest 目标，150 个 add_step 独立用例，见 reports/test-ledger.md）
upstream_tests:
  - file: test/source/tests/task_tests.cpp
    source: concurrencpp-0.1.7/test/source/tests/task_tests.cpp
    description: "task_tests (6 steps)"
    command: "./task_tests"
  - file: test/source/tests/executor_tests/thread_executor_tests.cpp
    source: concurrencpp-0.1.7/test/source/tests/executor_tests/thread_executor_tests.cpp
    description: "thread_executor_tests (8 steps)"
    command: "./thread_executor_tests"
  - file: test/source/tests/result_tests/result_tests.cpp
    source: concurrencpp-0.1.7/test/source/tests/result_tests/result_tests.cpp
    description: "result_tests (7 steps)"
    command: "./result_tests"

# test_package 中自带的测试 (消费者视角验证，真实调用 concurrencpp API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：runtime + thread_executor + result 真实计算 42"
    command: "./test_concurrencpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 150
