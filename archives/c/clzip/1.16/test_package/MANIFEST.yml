# test_package/MANIFEST.yml
# Upstream test declaration file.
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: clzip/1.16
homepage: "https://www.nongnu.org/lzip/clzip.html"

# Upstream test command (from Makefile.in `check` target analysis)
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream test programs actually run
upstream_tests:
  - file: check.sh
    source: clzip-1.16/testsuite/check.sh
    description: "clzip self-test suite: compression/decompression roundtrip, bad input, truncation, multi-member files, header variants, option handling"
    command: "make check"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_clzip.sh
    description: "Decompress fixed .lz fixture byte-exact vs upstream plaintext; stdout decompress; -t integrity; compress+decompress roundtrip on real data"
    command: "conan test"

# Approximate assertion count for quality assessment
# (upstream check.sh test_failed assertion points: 253)
assertion_count: 253
