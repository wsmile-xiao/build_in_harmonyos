software: cpdf
version: 0.0.7
status: built
build_system: custom
created_at: 2026-05-25

# 软件描述
description: "A pure-python CLI application to manipulate PDF files (PyPDF wrapper)"
category: document
license: BSD-3-Clause

# 编译信息
compiler: N/A (pure Python)
target_arch: aarch64
target_os: ohos

# 配置选项
configure_options:
  - "--prefix=$DEFAULT_PREFIX"
  - "pip install --no-deps"

# 构建命令序列
build_commands:
  - "pip install pypdf2"
  - "pip install --no-deps cpdf-0.0.7"
  - "pip install pydantic"
  - "mkdir -p staging && cp cpdf module files"
  - "create bin/cpdf wrapper shell script"

# 测试信息
test_result: PASS
test_summary: "Module import verified; basic CLI cat/metadata operations work"
test_commands:
  - "python3 -c 'import cpdf; print(cpdf.__version__)'"

# 安装产物
artifacts:
  - bin/cpdf
  - lib/python3.12/site-packages/cpdf/__init__.py
  - lib/python3.12/site-packages/cpdf/cli.py
  - lib/python3.12/site-packages/cpdf/models.py

# 补丁信息
patches_applied:
  - 0001-cpdf.egg-info-PKG-INFO.patch
  - 0002-cpdf.egg-info-entry_points.txt.patch
  - 0003-add-harmonyos-wrapper-script.patch

# 知识沉淀
knowledge_gained:
  - "cpdf 0.0.7是纯Python包(pypdf wrapper)，非CoherentPDF OCaml原生工具"
  - "pip install超时/挂起问题可通过--no-deps+手动安装依赖解决"
  - "PIL/Pillow C扩展在HarmonyOS沙箱中权限受限，cpdf CLI的extract_images功能不可用"
  - "纯Python包需创建wrapper shell脚本作为bin/cpdf入口"

# 质量门禁
quality_gates:
  G1_binary_integrity: PASS
  G2_functionality: PASS
  G3_portability: PASS
  G4_archive_integrity: WARN

# 源码信息
source_url: https://files.pythonhosted.org/packages/72/cd/fb8ca61b75f6848744c4dc06a6515b1c8e4be0735e4f39925e68f29f7382/cpdf-0.0.7.tar.gz

# 依赖信息
dependencies:
  - python3/3.12
  - pypdf2/3.0.1
  - click/8.4.1
  - pydantic/latest

# 预编译包
packages:
  - name: cpdf-0.0.7-ohos-aarch64.tar.gz
    size: 22KB
    type: runtime
  - name: cpdf-0.0.7-ohos-aarch64-debug.tar.gz
    size: 2KB
    type: debug