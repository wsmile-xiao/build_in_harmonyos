# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 实测记录 (2026-08-29, pc1-62):
#   header-only 库，无编译产物二进制与上游测试二进制；
#   test_package 消费者测试覆盖 range/enumerate/zip/accumulate 真实 API。

package: cppitertools/2.3
homepage: "https://github.com/ryanhaining/cppitertools"

# 上游测试命令 (header-only，无 ctest 套件可运行)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (header-only，无)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_cppitertools.cpp
    description: "消费者测试: range/enumerate/zip/accumulate 真实头文件 API 断言"
    command: "./test_cppitertools"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8