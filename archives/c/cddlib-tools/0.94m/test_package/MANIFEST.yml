# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cddlib-tools/0.94m
homepage: "https://github.com/cddlib/cddlib"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (cddlib 0.94m 的 make check 无实际测试目标，工具验证用真实计算断言)
upstream_tests:
  - file: src/cddexec.c
    source: cddlib-0.94m/src/cddexec.c
    description: "双描述法 H-表示→V-表示转换工具（真实调用，断言 6 维超立方体 64 顶点）"
    command: "./cddexec --rep"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_cddlib_tools.c
    description: "消费者测试：编译 C 测试源并运行 cddexec --rep 对 6 维超立方体做 H→V 变换，断言 64 个顶点"
    command: "./test_cddlib_tools <cddexec绝对路径>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1