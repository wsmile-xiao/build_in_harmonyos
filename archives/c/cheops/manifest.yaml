software: cheops
display: "cheops"
description: "CHEss OPponent Simulator — 控制台象棋程序（人/人、人/机、机/机，alpha-beta 搜索）"
category: games
homepage: "https://logological.org/cheops"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "2016 GNU autotools 递归工程；发布包不随带 config.guess/config.sub → 打包 FSF 2024 版到 files/ 并拷入源码根；configure 以 --build=aarch64-unknown-linux-gnu 固定三元组，跳过无法识别 HarmonyOS 的 config.guess"
    - "产物仅一个 bin_PROGRAMS=cheops（console 程序）+ man6/cheops.6 + 文档数据；package_type=application，无库/头文件，上游无自动化测试"
    - "源码 configure umask 077→022（HMDFS 临时目录组写权限），TMPDIR 指向 conan build _tmp；doc PDF 生成在 HAVE_PDFLATEX 条件内（设备无 pdflatex 自动跳过）"
    - "纯 C++03、零外部依赖、无 -Werror；validate() os 白名单 Linux/OHOS（R32）；设备 cppstd=17 下 ChessBoard.cpp 唯一的 `register` 指示符（C++17 移除）需去除（语义不变）"
    - "运行期交互走 stdin；test_package 以 --version/--help 退出码 + banner/usage + 脚本化 h/h + e2e4/e7e5 + quit 双人对局冒烟"
  common_dependencies: []

versions:
  "1.3":
    status: pending
    build_date: ""
