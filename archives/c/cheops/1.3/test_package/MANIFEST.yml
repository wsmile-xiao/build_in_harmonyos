# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cheops/1.3
homepage: "https://logological.org/cheops"

# 上游测试命令 — 经源码核查：1.3 为交互式 console 象棋程序（src 的 main 循环读 stdin），
# Makefile.am 无 check/TESTS/ctest 目标；doc 仅生成 man/pdf，无测试。
upstream_check_command: "none (interactive console program; upstream has no check/test target)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_cheops.sh
    description: "打包产物冒烟：cheops --version 退出码 0 + CHEOPS banner；--help 退出码 0 + usage；脚本化双人对局（h/h + e2e4 + e7e5 + quit）驱动真实游戏循环退出码 0"
    command: "bash test_cheops.sh <pkg_bin>"

# 测试断言总数 (test_package 实际执行的断言: 二进制可执行 + --version 运行 + banner + --help 运行 + usage + 对局运行 + Command 提示 = 7 检查点)
assertion_count: 7
