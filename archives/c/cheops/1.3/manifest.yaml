knowledge_gained:
  - "cheops 1.3（CHEss OPponent Simulator，console 象棋程序，Tristan Miller）为 2016 GNU autotools C++ 项目：SUBDIRS=src+doc，产物仅一个 bin_PROGRAMS=cheops + man6 + 数据文档；package_type=application，无库/头文件/测试"
  - "发布包不随带 config.guess/config.sub（仅 install-sh/depcomp/missing），configure 直接运行会因缺 aux 文件报错 → 打包 FSF 2024 config.guess/config.sub（aarch64 已支持）到 files/ 并拷入源码根，配 --build=aarch64-unknown-linux-gnu 跳过 config.guess（uname -s=HarmonyOS 无法猜测）"
  - "configure.ac 用 AC_PREREQ(2.57)+AC_PROG_CXX+AC_CHECK_PROG(PDFLATEX, pdflatex, ...) 仅告警；doc/Makefile.am 的 PDF 生成在 HAVE_PDFLATEX 条件内（设备无 pdflatex → 自动跳过），man_MANS=doc/cheops.6 预生成可直接安装"
  - "HMDFS 上 configure 生成的临时目录 umask 077 无组写权限 → 源码 configure umask 077→022；TMPDIR 指向 conan build 目录（同 pakchois/p11-kit 配方）"
  - "纯 C++03 控制台程序、零外部依赖、无 -Werror；设备 profile cppstd=17 下 2003 代码里的 `register` 存储指示符（C++17 已移除）会被 clang 拒绝 → ChessBoard.cpp:418 唯一的 `register bool white=is_white` 去掉该指示符（语义不变）；运行期交互走 stdin（human/human 可脚本化对局验证）→ 上游无自动化测试，如实 upstream_test=0；test_package 以 --version/--help 退出码 + 喂 h/h + e2e4/e7e5 + quit 的真实对局冒烟"
