# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cajun-jsonapi/2.1.1
homepage: "https://github.com/cajun-jsonapi/cajun-jsonapi"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无 CMake/CTest；Makefile 提供 make_test + test 目标（Boost.Test 框架）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make_test && ./test_prog"

# 上游实际运行的测试程序
upstream_tests:
  - file: test_prog
    source: cajun-jsonapi-2.1.1/test/test_*.cpp
    description: "Boost.Test 38 个上游用例 (Array/Object/BasicType 读写 6 个套件)"
    command: "./test_prog"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_cajun_jsonapi
    description: "消费者验证：仅用公开头文件 json::Reader/Writer/Object/Array/String/Number 构造、序列化、回读 JSON"
    command: "./test_cajun_jsonapi"
  - file: test_ohos
    description: "鸿蒙/aarch64 专项：UTF-8 多字节往返、双精度往返、异常路径、嵌套往返"
    command: "./test_ohos"
