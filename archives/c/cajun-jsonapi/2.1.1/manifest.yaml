# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.1"

# 软件名
software: cajun-jsonapi

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/cajun-jsonapi/cajun-jsonapi/tar.gz/refs/tags/2.1.1"

  # 源码校验和
  sha256: "88f1eecf105e7ea337cd4142d1ea1bd165e84b0fa91cdaa098437b2e153a234c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS libc 缺公开 pthread_setcancelstate 声明：编译期 sysroot 头不声明 GNU pthread 取消系列，测试框架（Boost.Test）依赖该符号；用 -include 注入 static inline compat shim（不进入交付物），详见 reports/knowledge-ledger.md C1"
- "header-only 无 CMake 库 conan-verify G1 要求显式 build()/export_sources()/补丁调用（no-op 即可），knowledge-ledger.md C2（E257 已覆盖）"
- "W3 本地 CI 全仓 junk 扫描会命中其他库已提交的空基线文件（.build-closed/.staging-verified）：按基线隔离复验（记录 pre SHA-256 → 临时隔离 → 复跑 → 原样恢复核对 post SHA-256），knowledge-ledger.md C3（SKILL 恢复规则 #3 流程）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
