# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: cconv/0.6.3
homepage: "https://github.com/xiaoyjy/cconv"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无自动测试框架（无 make check/ctest 目标），仅提供语料数据：
#   test_s2t（45 行简体语料）与 test_t2s（44 行繁体语料）
# 适配本地实际运行 cconv 二进制完成简→繁 / 繁→简转换验证。
upstream_tests:
  - file: test_s2t
    source: cconv-0.6.3/test_s2t
    description: "简→繁转换语料，本地实际运行: cconv -f UTF8-CN -t UTF8-TW < test_s2t，输出正确繁体"
    command: "./cconv -f UTF8-CN -t UTF8-TW < test_s2t"
  - file: test_t2s
    source: cconv-0.6.3/test_t2s
    description: "繁→简转换语料，本地实际运行: cconv -f UTF8-TW -t UTF8-CN < test_t2s，输出正确简体"
    command: "./cconv -f UTF8-TW -t UTF8-CN < test_t2s"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 libcconv API (cconv_open/cconv/cconv_close) 做简→繁转换并断言输出"
    command: "./test_cconv"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1