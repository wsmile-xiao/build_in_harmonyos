# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "GitHub codeload zip 打包将指向绝对路径的符号链接（如 config.guess -> /usr/share/automake-1.11/）转为 32-37 字节的文本占位符，解压后需替换为真实 GNU 辅助脚本才能 configure (ref: notes.md)"
  - "init-build 以硬链接创建 .work 目录，探索阶段 cp 覆盖源文件会同步污染 .orig，导致 refresh-patch 无法识别差异；修改前应先解除硬链接或直接修改后重新恢复 .orig 基线 (ref: notes.md)"
  - "cbehave 上游 make check 未注册任何测试（TESTS 为空），但自带 5 个 noinst_PROGRAMS 示例测试程序，可手动逐一运行验证全部通过 (ref: notes.md)"
  - "cbehave 上游 text_editor_test 需要前置文件 foo.txt，缺失时 FEATURE_RETURN(errno) 返回 ENOENT 导致用例失败，需先创建前置文件 (ref: notes.md)"
