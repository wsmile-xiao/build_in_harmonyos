patches_applied:
  - "0001-config.guess.patch（portability）: 上游 config.guess 为失效符号链接占位符，替换为 automake 1.16.5 真实脚本"
  - "0002-config.sub.patch（portability）: 上游 config.sub 为失效符号链接占位符，替换为 automake 1.16.5 真实脚本（含 aarch64-unknown-linux-ohos/linux-ohos triplet 支持，去除 android 残留）"
