# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cbehave/1.0.0
homepage: "https://github.com/bigwhite/cbehave"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 注: 上游 Makefile.am 仅以 noinst_PROGRAMS 构建示例测试程序, 未注册到
# `make check` (TESTS 为空, make check 输出 "Nothing to be done")。
# 以下 5 个测试程序为上游自带, 本次适配中手动逐一运行验证全部通过。
upstream_tests:
  - file: src/example/calculator_test.c
    source: cbehave-master/src/example/calculator_test.c
    description: "calculator FEATURE/SCENARIO 宏 + SHOULD_INT_EQUAL 断言 (3 features / 4 scenarios)"
    command: "./calculator_test"
  - file: src/example/string_test.c
    source: cbehave-master/src/example/string_test.c
    description: "strstr 场景测试 (1 feature / 2 scenarios)"
    command: "./string_test"
  - file: src/example/product_database_test.c
    source: cbehave-master/src/example/product_database_test.c
    description: "product database mock 场景 (1 feature / 2 scenarios)"
    command: "./product_database_test"
  - file: src/example/mock_test.c
    source: cbehave-master/src/example/mock_test.c
    description: "CBEHAVE mock 宏测试 (1 feature / 3 scenarios)"
    command: "./mock_test"
  - file: src/example/text_editor_test.c
    source: cbehave-master/src/example/text_editor_test.c
    description: "FEATURE_RETURN 用法, 需前置文件 foo.txt (1 feature / 1 scenario)"
    command: "./text_editor_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证导出的 cbehave.h 与 libcbehave 可链接, 覆盖 SHOULD_INT_EQUAL/SHOULD_STR_EQUAL/SHOULD_MEM_EQUAL/SHOULD_BE_TRUE 断言宏 (4 scenarios)"
    command: "./test_cbehave"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12