package: ctapi/1.1-nmu1
homepage: "https://tracker.debian.org/pkg/ctapi"

# The complete upstream source is one API header plus Debian packaging
# metadata. It contains no test directory, build system, or test command.
upstream_check_command: "none (upstream provides no test suite)"
upstream_test_in_build: false
upstream_test_command: "none (no upstream tests are present)"
upstream_tests: []

test_package_tests:
  - file: test_ctapi_c.c
    description: "Exercise the CT-API C declarations with a mock card-terminal implementation and APDU exchange"
    command: "test_ctapi_c"
  - file: test_ctapi_cpp.cpp
    description: "Verify C++ type signatures and extern-C linkage against the C mock implementation"
    command: "test_ctapi_cpp"
  - file: test_ctapi_ohos.c
    description: "HarmonyOS-specific aarch64 compile and runtime checks for platform macros and fixed-width CT-API ABI types"
    command: "test_ctapi_ohos"

assertion_count: 29
