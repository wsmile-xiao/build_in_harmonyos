# test_package/MANIFEST.yml
# Upstream test declaration (required by CI L0e, see docs/TEST_QUALITY_SPEC.md)

package: contourpy/1.2.1
homepage: "https://github.com/contourpy/contourpy"

upstream_check_command: "python3 -m pytest tests/"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/test_contour.py
    source: contourpy-1.2.1/tests/test_contour.py
    description: "Core contour generation tests"
    command: "python3 -m pytest tests/test_contour.py"
  - file: tests/test_chunk.py
    source: contourpy-1.2.1/tests/test_chunk.py
    description: "Chunked contour computation tests"
    command: "python3 -m pytest tests/test_chunk.py"
  - file: tests/test_enum.py
    source: contourpy-1.2.1/tests/test_enum.py
    description: "Enum (contour types) tests"
    command: "python3 -m pytest tests/test_enum.py"

test_package_tests:
  - file: test_contourpy.py
    description: "Import contourpy, verify version, filled contour + line generation via numpy grid"
    command: "python3 -S test_contourpy.py"

assertion_count: 6
