# 版本级 manifest — ctemplate 2.4
# 遵循 ARCHIVE-SPEC v2.0

version: "2.4"
software: ctemplate

status: built
build_date: "2026-09-09"
build_system: autotools(上游,需autogen)/conanfile 直编(适配侧)

source:
  url: "https://codeload.github.com/OlafvdSpek/ctemplate/tar.gz/refs/tags/ctemplate-2.4"
  sha256: "ccc4105b3dc51c82b0f194499979be22d5a14504f741115be155bd991ee93cfa"
  tar_format: tar.gz
  note: "git tag 与 Debian orig tarball 内容一致（sha256 相同）；均无预生成 configure"

build:
  system: conanfile 内直编（绕 autotools）
  configure_options:
  - "手工合成 config.h（OHOS 特性集逐项核实）"
  - ".h.in → .h 替换 7 个 @var@（unordered_map/std/attribute=1/dllexport=空）"
  - "sys.executable 跑 generate_fsm.py 生成 3 个 fsm 头"
  - "库 4 变体：threads/nothreads × release(NDEBUG)/debug（对应上游 4 套 lib）"
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
- "ctemplate git tag 无预生成 configure（autogen.sh 依赖 autoconf/automake/libtool），Debian orig tarball 与之相同——这类包只能手工完成 configure 三件事：config.h 合成 + .h.in 替换 + BUILT_SOURCES 生成"
- ".h.in 的 @ac_cv_cxx_hash_map@ 值是带尖括号的 '<unordered_map>'（#include @var@ 直接拼接），namespace 为 std；@ac_google_attribute@ 用在 #if 里取值 1/0"
- "上游 23 个测试目标可全部直编实跑：自带 mini harness（base/util.h TEST 宏）无需 gtest；模板测试需 TEMPLATE_ROOTDIR 环境变量指源码根"
- "statemachine_test 要求把 statemachine.cc 复制为 .c 以 C 模式编译（上游 BUILT_SOURCES 的 cp 规则）"
- "3 个 shell 脚本测试自带 tmpdir 参数，generate_fsm_test.sh 逐字节比对 python 生成器输出与预存 sample_fsm.c"
