# test_package/MANIFEST.yml — ctemplate 2.4
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: ctemplate/2.4
homepage: "https://github.com/OlafvdSpek/ctemplate"

# 上游测试命令（make check；需先 autogen.sh，git tag 无预生成 configure）
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试（层1）
upstream_test_in_build: true
upstream_test_command: "build() 内直接编译并实跑全部 20 个测试二进制（9 对 threads/nothreads + statemachine_test + generate_fsm_c_test）+ 3 个 shell 测试脚本"

# 上游测试真相（Makefile.am TESTS + check_SCRIPTS 全量）：
# 20 个二进制 —— compile_test、template_test_util_test、template_dictionary_
# unittest、template_modifiers_unittest、template_setglobals_unittest、
# template_cache_test、template_unittest、template_regtest、htmlparser_test
# 各分 threads/nothreads 两变体（9×2=18），加 statemachine_test（C 模式重编
# statemachine.cc）与 generate_fsm_c_test（验证生成的 sample_fsm.c 可作 C
# 编译）；3 个脚本 —— generate_fsm_test.sh（python 生成器输出与预存
# sample_fsm.c 逐字节比对）、make_tpl_varnames_h_unittest.sh、
# diff_tpl_auto_escape_unittest.sh（驱动两个辅助二进制做端到端断言）。
# 23/23 全部实跑通过，无跳过。测试自带 mini harness（src/base/util.h TEST 宏），
# 不依赖 gtest。
upstream_test_count: 23
