# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cmatrix/2.0
homepage: "https://github.com/abishekvashok/cmatrix"

# 上游测试命令（cmatrix 无测试套件，make check 空转 0 用例）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序（无测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "cmatrix -V 版本断言（非交互，无需 TTY）"
    command: "cmatrix -V"

# 测试断言总数
assertion_count: 1
