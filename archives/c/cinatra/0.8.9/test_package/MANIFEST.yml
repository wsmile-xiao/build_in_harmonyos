# test_package/MANIFEST.yml — cinatra 0.8.9
# CI L0e 要求此文件存在以声明上游测试来源。

package: cinatra/0.8.9
homepage: "https://github.com/qicosmos/cinatra"

# cinatra 上游测试: tests/ 下 doctest 套件，CMake BUILD_UNIT_TESTS=ON 注册 4 个 add_test
# 目标: test_cinatra(4 源文件聚合)、test_corofile、test_time_util、test_http_parse
upstream_check_command: "cmake -DBUILD_UNIT_TESTS=ON .. && make -j4 && ctest"
upstream_test_in_build: false
upstream_test_command: "cmake -DBUILD_UNIT_TESTS=ON -DCMAKE_CXX_COMPILER=clang++ .. && make -j4 test_cinatra test_corofile test_time_util test_http_parse && ctest"

upstream_tests:
  - name: "test_cinatra"
    command: "./tests/test_cinatra"
    expected: "79/79 通过（doctest；默认构建注册口径：87 声明 - 3 DSKIP_TIME_TEST 守卫[上游宏笔误默认未定义] - 4 CINATRA_ENABLE_SSL 守卫[默认 OFF] - 1 ENABLE_GZIP 守卫 test for gzip[默认 OFF]）"
  - name: "test_corofile"
    command: "./tests/test_corofile"
    expected: "14/14 通过（doctest）"
  - name: "test_time_util"
    command: "./tests/test_time_util"
    expected: "1/1 通过（doctest）"
  - name: "test_http_parse"
    command: "./tests/test_http_parse"
    expected: "1/1 通过（doctest）"

# test_package 测试(消费者视角)
test_package_tests:
  - file: test_package.cpp
    description: "coro_http_server 起服(127.0.0.1:18080, cpu_affinity=false/true 两轮) + coro_http_client GET/POST loopback 往返, 校验 status=200 与 body 内容 + async_start future 启动失败检查; cpu_affinity=true 轮覆盖 patch 的 sched_setaffinity(0,...) 线程内绑定路径, OHOS armv8 clang15 libc++ C++20"
    command: "./test_package"

assertion_count: 11
