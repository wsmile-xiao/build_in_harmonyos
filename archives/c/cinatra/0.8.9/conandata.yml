patches:
  - patch_file: "patches/0001-sched_setaffinity-portable.patch"
    patch_description: "Replace glibc-only pthread_setaffinity_np() (parent-thread call) with POSIX sched_setaffinity(0, ...) issued inside the worker thread in coro_io::io_context_pool::run(). sched_setaffinity(0) means the calling thread itself on POSIX and works on both glibc and musl (musl has no *_np affinity API and rejects pthread_t handles). Pure POSIX fix, no platform-specific macro; cpu_affinity=false (default) keeps behavior unchanged."
    patch_type: "portability"
    sha256: "2036e8913f5ed8f61608d848459b6c031df2d3d59ea81bbe427a9303164ee947"
