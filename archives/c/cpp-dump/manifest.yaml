software: cpp-dump
display: "cpp-dump"
description: "C++17 header-only 调试输出库，可打印任意类型（容器/元组/用户自定义类型）"
category: library
homepage: "https://github.com/philip82148/cpp-dump"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only C++17 INTERFACE 库，生产包仅安装头文件（cpp-dump.hpp + cpp-dump/）"
    - "HarmonyOS 用 libc++，unordered 容器迭代序与上游 linux（libstdc++）夹具不同——按 CMAKE_HOST_SYSTEM_NAME=HarmonyOS 选择 ohos 夹具分支（与 apple 夹具内容一致）"
    - "上游 log_label fixed_length 夹具依赖源码目录名恰为 cpp-dump（__FILE__ 尾 34 字符），构建从 <build_folder>/cpp-dump 拷贝目录 configure"
    - "上游测试需 C++17（profile compiler.cppstd=17），设备 clang15 默认 std 不足"
  common_dependencies: []

versions:
  "0.7.0":
    status: built
    build_date: "2026-09-27"
    conan_ref: "cpp-dump/0.7.0"
