# test_package/MANIFEST.yml — 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cpp-dump/0.7.0
homepage: "https://github.com/philip82148/cpp-dump"

# 上游测试命令（顶层 CMakeLists 在 IS_TOP_LEVEL 分支 enable_testing() 并注册 CTest 用例）
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试（按被审 tag v0.7.0 清点：ctest -N => Total Tests: 27）
upstream_tests:
  - file: CMakeLists.txt
    source: cpp-dump-0.7.0/CMakeLists.txt
    count: 27
    description: "顶层 CMakeLists 注册 27 个 CTest 用例：dump-indent-{normal,narrow,wide,shallow} 4 + dump-non-variable 1 + dump-variable 1 + color-indent-* 4 + color-non-variable-* 2 + color-variable-* 2 + color-rtti 1 + log-label-test 1 + readme-*.cpp 11（file(GLOB readme/*.cpp)，v0.7.0 有 11 个 cpp）= 27。取数命令：ctest -N（Total Tests: 27）。上游当前 HEAD 注册 29（readme 净 +2：新增 test-code/user-defined-class-generic/user-defined-class-ostream/user-defined-enum-generic 4 项、移除 user-defined-class2/user-defined-class3 2 项），不在被审 v0.7.0 源码内。"
    command: "ctest --output-on-failure"

# test_package 中自带的测试（消费者视角验证，不进上游分母）
test_package_tests:
  - file: test_package.cpp
    count: 3
    description: "消费者断言 3 条：export_var(std::vector<int>) 输出含 [ 1, 2, 3 ]、export_var(std::map<int,int>) 输出含 { 2: 6, 4: 6 }、export_var(std::string) 输出含带引号的 \"cpp-dump\"；经 Conan CMake interface target 编译，test() 以 self.run 执行被测二进制。"
    command: "./test_package"

# 测试断言总数（test_package 消费者断言）
assertion_count: 3
