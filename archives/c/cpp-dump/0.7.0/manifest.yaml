# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "HarmonyOS（libc++）上 unordered 容器迭代序与 libstdc++ 不同：dump_variable/color_variable 的 linux 夹具仅 2 个容器顺序不匹配，与上游 apple（libc++）夹具逐字一致——按 CMAKE_HOST_SYSTEM_NAME=HarmonyOS 选择新增 ohos 夹具分支"
  - "上游 log_label fixed_length(0,40,0) 夹具依赖 __FILE__ 尾 34 字符恰为 cpp-dump/test/...（GitHub Actions 检出目录名）——conan 构建从 <build_folder>/cpp-dump 拷贝目录 configure 才能复现"
  - "上游测试需显式 -DCMAKE_CXX_STANDARD=17：设备 clang15 默认 std 低于 17 时 -Werror 报 inline variables 是 C++17 extension"

