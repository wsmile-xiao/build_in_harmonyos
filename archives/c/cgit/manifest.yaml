software: cgit
display: "cgit"
description: "Hyperfast web frontend for git repositories written in C"
category: system
homepage: "https://git.zx2c4.com/cgit/about/"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 项目, 需先将 git 2.51.0 源码解压到 cgit 源码的 git 子目录再 make"
    - "NO_LUA=1 关闭 Lua 支持, 避免引入额外依赖"
    - "GIT_VER=2.51.0 与任务版本后缀一致, 从 cdn.kernel.org 获取"
    - "CGI 工具包, 只发布 bin/cgit 与 share/cgit 静态资源"
  common_dependencies:
    - openssl
    - zlib

versions:
  "1.2.3-git20250818.80.3346409-git2.51.0":
    status: built
    build_date: "2026-09-09"
    conan_ref: "cgit/1.2.3-git20250818.80.3346409-git2.51.0"
