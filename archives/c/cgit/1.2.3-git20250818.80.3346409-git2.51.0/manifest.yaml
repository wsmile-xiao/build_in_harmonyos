version: "1.2.3-git20250818.80.3346409-git2.51.0"
software: cgit
status: built
build_date: "2026-09-09"
build_system: "makefile"

source:
  url: "https://github.com/zx2c4/cgit/archive/334640962c7fa96d407d1c71df709c94708bcef9.tar.gz"
  sha256: "21bf72206a5e5dd18852790ba96caf05970ff90eadf575769dd9db732884ffa2"
  tar_format: tar.gz

build:
  system: makefile
  cc: clang
  configure_options:
    - "GIT_VER=2.51.0"
    - "NO_LUA=1"
    - "NO_REGEX=NeedsStartEnd"
    - "NO_GETTEXT=1"
    - "HAVE_DEV_TTY=YesPlease"
    - "NO_GETPASS=YesPlease"
    - "NO_PERL=1"
    - "NO_PYTHON=1"
    - "NO_TCLTK=1"
    - "NO_SVN_TESTS=1"
    - "CFLAGS=-g0 -O0 -Wall (stream build log line-by-line + 20s heartbeat)"
    - "make -j1 V=1"
  dependencies:
    - openssl/3.5.6.1
    - zlib/1.3.1.1

patches_applied: []

knowledge_gained:
  - "cgit 构建必须先备齐 git 源码树到 git/ 子目录, 再 make"
  - "NO_LUA=1 可完全避开 Lua 依赖, 适合 OHOS 首轮基础适配"
  - "git.zx2c4.com snapshot 端点会再生 tarball (实测 90632 vs 90640 字节), 故用 git 对象生成的 GitHub commit 归档保稳定"
  - "cgit 源码必须与捆绑 git 版本同代: v1.2.3 的 cgit.h 含 <cache.h>/<object-store.h>, git 2.51 已重命名为 odb.h, 须用 3346409 (git v2.51.0 同步点)"
  - "OHOS libc 无 REG_STARTEND, git-compat-util.h 要求加 NO_REGEX=NeedsStartEnd"
