# test_package/MANIFEST.yml — cloud-initramfs-tools 0.18.debian14
# 上游测试入口清点 + 消费者测试声明（CI build_and_test.sh L0e 强制存在）
# 详见 docs/TEST_QUALITY_SPEC.md

package: cloud-initramfs-tools/0.18.debian14
homepage: "https://launchpad.net/cloud-initramfs-tools"

# 测试类型：上游无自动化测试套件，本包只有消费者视角测试
test_type: "consumer-only"

# ── 上游测试入口清点（R51 第一步；真实命令与原始输出见 reports/test-report.md §1）──
# 上游为 Debian 原生包（Format: 3.0 (native)，lp:cloud-initramfs-tools），
# 顶层 Makefile 的目标只有 build/install/install-fedora/install-epel：
#   make -n check   → make: *** No rule to make target 'check'.  Stop.   rc=2
#   make -n test    → make: *** No rule to make target 'test'.  Stop.    rc=2
#   make -n testall → make: *** No rule to make target 'testall'.  Stop. rc=2
#   make -n build   → make: Nothing to be done for 'build'.              rc=0
# 源码树 40 个文件，无 tests/ 目录、无 *test*/*check* 文件、无 debian/tests/（autopkgtest）入口。
upstream_check_command: "make -n check / make -n test / make -n testall"
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_count: 0
upstream_tests: []
upstream_has_autopkgtest: false
upstream_test_entry_note: >-
  上游确实没有自动化测试入口。可真实执行的上游入口是 initramfs-tools 的 hook/脚本协议
  （`<entry> prereqs`）与打包的 CLI overlayroot-chroot —— 本套件组 A 对这两类入口逐项实际执行，
  覆盖全部 4 个 hook + 5 个阶段脚本 + CLI + 配置文件，无漏测。

# ── 上游可执行入口清单（组 A 逐项实际执行，无跳过）──
upstream_entrances:
  - name: overlayroot-hook-prereqs
    file: share/initramfs-tools/hooks/overlayroot
    command: "sh <pkg>/share/initramfs-tools/hooks/overlayroot prereqs"
    expected: "cryptsetup"
  - name: growroot-hook-prereqs
    file: share/initramfs-tools/hooks/growroot
    command: "sh <pkg>/.../hooks/growroot prereqs"
    expected: ""
  - name: rescuevol-hook-prereqs
    file: share/initramfs-tools/hooks/rescuevol
    command: "sh <pkg>/.../hooks/rescuevol prereqs"
    expected: ""
  - name: dyn-netconf-hook-prereqs
    file: share/initramfs-tools/hooks/cloud-initramfs-dyn-netconf
    command: "sh <pkg>/.../hooks/cloud-initramfs-dyn-netconf prereqs"
    expected: ""
  - name: overlayroot-initbottom-prereqs
    file: share/initramfs-tools/scripts/init-bottom/overlayroot
    command: "sh <pkg>/.../scripts/init-bottom/overlayroot prereqs"
    expected: ""
  - name: dyn-netconf-initbottom-prereqs
    file: share/initramfs-tools/scripts/init-bottom/cloud-initramfs-dyn-netconf
    command: "sh <pkg>/.../scripts/init-bottom/cloud-initramfs-dyn-netconf prereqs"
    expected: ""
  - name: dyn-netconf-inittop-prereqs
    file: share/initramfs-tools/scripts/init-top/cloud-initramfs-dyn-netconf
    command: "sh <pkg>/.../scripts/init-top/cloud-initramfs-dyn-netconf prereqs"
    expected: "udev"
  - name: growroot-localbottom-prereqs
    file: share/initramfs-tools/scripts/local-bottom/growroot
    command: "sh <pkg>/.../scripts/local-bottom/growroot prereqs"
    expected: ""
  - name: rescuevol-localpremount-prereqs
    file: share/initramfs-tools/scripts/local-premount/rescuevol
    command: "sh <pkg>/.../scripts/local-premount/rescuevol prereqs"
    expected: ""
  - name: overlayroot-chroot-cli
    file: bin/overlayroot-chroot
    command: "sh <pkg>/bin/overlayroot-chroot /bin/true   (无 overlayroot 挂载)"
    expected: "rc=1 且 stderr 含 'Unable to find an overlayroot filesystem'"

# ── 上游交付物运行环境受限的说明（非「跳过」，附具体技术原因与实测证据）──
upstream_test_exemption: |
  上游 5 个 initramfs 阶段脚本与 4 个 hook 的主体逻辑需在 initramfs 构建/启动环境中运行：
  它们 source 绝对路径的 initramfs-tools 运行时（hooks → /usr/share/initramfs-tools/hook-functions；
  阶段脚本 → /scripts/functions），并依赖 /conf、${rootmnt}、${ROOT}、/sys/block、
  growpart/sfdisk/udevadm/cryptsetup/blkid 等 initramfs 内部对象。OHOS PC 上：
    (1) 无 initramfs-tools 包 → 该绝对路径不存在（实测 `sh <hook>` 报
        ".: /usr/share/initramfs-tools/hook-functions: No such file or directory" rc=1）；
    (2) 根文件系统只读 → 无法构造 /scripts/functions 替身（实测 `echo x > /etc/cift-ro-probe` → Read-only file system）。
  因此主体逻辑以「协议层真实执行（prereqs）+ Toybox sh 语法自洽（sh -n）+ 包布局字节一致性」覆盖；
  上述两条限制均为实测，见 reports/test-report.md §3。

# ── 消费者测试套件（test_package/test_cloud_initramfs_tools.sh，16 用例）──
test_package_tests:
  - name: A1 upstream-hook-prereqs-protocol
    file: test_cloud_initramfs_tools.sh
    description: "4 个上游 hook 的 prereqs 协议逐项执行（overlayroot→cryptsetup，其余空）"
  - name: A2 upstream-stage-script-prereqs-protocol
    file: test_cloud_initramfs_tools.sh
    description: "5 个上游阶段脚本 prereqs 逐项执行（dyn-netconf init-top→udev）"
  - name: A3 upstream-cli-failpath-without-overlayroot
    file: test_cloud_initramfs_tools.sh
    description: "打包 CLI 在无 overlayroot 挂载时确定性失败：rc=1 + 明确报错文案"
  - name: A4 upstream-cli-xcmd-resolver-both-branches
    file: test_cloud_initramfs_tools.sh
    description: "从包内 CLI 提取 xcmd()：①原名存在走原名 ②原名缺失回退 busybox <applet>"
  - name: A5 upstream-overlayroot-conf-default-disabled
    file: test_cloud_initramfs_tools.sh
    description: "上游配置可被 sh 安全 source 且默认 overlayroot=\"\"（默认禁用）"
  - name: B1 pkg-layout-initramfs-hooks
    file: test_cloud_initramfs_tools.sh
    description: "4 个 initramfs hook 齐全且具备可执行位"
  - name: B2 pkg-layout-initramfs-stage-scripts
    file: test_cloud_initramfs_tools.sh
    description: "5 个 initramfs 阶段脚本齐全且具备可执行位"
  - name: B3 pkg-layout-conf-hooks-d-content
    file: test_cloud_initramfs_tools.sh
    description: "conf-hooks.d/overlayroot 内容为 export CRYPTSETUP=y"
  - name: B4 pkg-layout-cli-binary
    file: test_cloud_initramfs_tools.sh
    description: "bin/overlayroot-chroot 存在且可执行"
  - name: B5 pkg-layout-man-page
    file: test_cloud_initramfs_tools.sh
    description: "overlayroot-chroot.8 非空且为 roff（.TH）"
  - name: B6 pkg-layout-res-etc-assets
    file: test_cloud_initramfs_tools.sh
    description: "res/etc/overlayroot.conf（≥1000B）与 res/etc/update-motd.d/97-overlayroot 随包"
  - name: B7 pkg-layout-license
    file: test_cloud_initramfs_tools.sh
    description: "licenses/COPYING 随包"
  - name: C1 ohos-toybox-sh-syntax-all-artifacts
    file: test_cloud_initramfs_tools.sh
    description: "鸿蒙特有：平台 shell 为 Toybox，11 个 shell 交付物 sh -n 全部通过（非 OHOS 平台 SKIP 并说明原因）"
  - name: C2 ohos-multicall-applet-fallback-real
    file: test_cloud_initramfs_tools.sh
    description: "鸿蒙特有：无同名命令时 xcmd 经真实 busybox applet 回退执行（非 127），验证 umount/chroot 路径可用"
  - name: C3 ohos-readonly-system-paths-evidence
    file: test_cloud_initramfs_tools.sh
    description: "鸿蒙特有：/etc 与 /tmp 只读实测证据 → 配置资产必须落在包内 res/"
  - name: C4 ohos-install-shim-mechanism-real
    file: test_cloud_initramfs_tools.sh
    description: "鸿蒙特有：无 install(1) 时 busybox install applet 完成 coreutils 语义安装（build() shim 机制真实可用）"

assertion_count: 59

notes: |
  1) 上游 cloud-initramfs-tools 0.18.debian14（Debian 原生包）无自动化测试套件：
     Makefile 无 test/check/testall 目标（rc=2），源码树无 tests/ 与 debian/tests/
     —— 清点命令与原始输出见 reports/test-report.md §1；本套件不冒充上游测试。
  2) 上游可真实执行的入口是 initramfs-tools hook/脚本协议与打包 CLI，组 A 已逐项执行，无漏测。
  3) 本套件对「已安装包」执行（env="conanrun"），满足 CI L1e 破坏性反向验证：
     移走包内 bin/ 或 share/initramfs-tools 后 A1/A2/A3/B1/B2/B4 必然失败。
  4) 鸿蒙特有用例 4 个（C1-C4），在本机（HarmonyOS PC）全部实际执行并通过。
