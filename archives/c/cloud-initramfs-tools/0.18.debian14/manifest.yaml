# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 用户态命令可见性依赖 PATH 组成：默认进程 PATH 首段为 /system/bin（提供 install(1)/umount(1)/chroot(1)，该目录用户不可 ls，仅 PATH 查找时可执行），而交互 shell / 受限环境的 PATH 常被裁剪掉 /system/bin。上游 Makefile 的 install: 目标在裁剪 PATH 下报 `/bin/sh: install: inaccessible or not found` → `make: *** [Makefile:10: install] Error 127`（rc=2）。对策：build() 里条件化生成 busybox install shim（仅当 which('install') 为空时前置 PATH），使构建对 PATH 组成不敏感（knowledge_ref: E098 同错误面；E188 toybox install 选项差异）"
  - "打包脚本中调用核心工具时避免裸调命令名：OHOS 上 applet 存在但可能无同名入口（busybox 1.37 含 install/umount/chroot/mke2fs/blkid applet），脚本内 command -v 探测 + `busybox <applet>` 回退可在不改变上游语义的前提下提升可移植性（默认分支与上游逐字一致）。同工程内 overlayroot-chroot 的 umount/chroot 即此模式（knowledge_ref: 草稿 DRAFT-cloud-initramfs-tools-0.18.debian14-ohos-multicall-applet-command-fallback）"
  - "OHOS 沙箱/内核不放行 mount 族 syscall：真实执行 umount 时进程以 Signal 31 (SIGSYS) rc=159 结束（实测 busybox umount /nonexistent → 159；chroot <args> → 159），而 mountpoint(stat 实现)/mount(只读查询) 正常。因此 overlayroot-chroot 的改挂载/chroot 能力在本机不可行使能，需特权/initramfs 环境（knowledge_ref: E051 未实现 syscall → SIGSYS；E002 只读系统路径）"
  - "OHOS 上 /etc 与 /tmp 均为只读（实测 `echo x > /etc/...`、`echo x > /tmp/...` → Read-only file system），随包配置与 motd 片段不能落 /etc，改落包内 res/ 并由 runenv 变量指向（knowledge_ref: E002 / E479 同类只读系统路径陷阱）"
  - "HMDFS 权限归一化：install -m 755 落地后实测权限 770、-m 644 为 660（X 位保留但组权限被放宽），测试断言应以「可执行位 + 内容字节一致」为准（knowledge_ref: E046 chmod 受限）"
  - "Debian 原生包（source format 3.0 (native)）无独立 upstream orig tarball：其权威上游 VCS 即 Debian 打包仓库（debian/control 的 Vcs-Git），源应取该仓库打标签处的官方归档端点（salsa GitLab `/-/archive/<tag>/<pkg>-<tag>.tar.gz`），而不是 Debian pool 端点——后者会被 PF7/R39 的「Debian 下游重打包源」启发式误判，改用 salsa 后无需任何例外绕过；内容等价性以「与 .dsc Checksums-Sha256 校验的 pool tarball 逐文件字节一致」佐证（先例：archives/a/astromatic/1.3、archives/b/boost-defaults/1.90.0.2）"

