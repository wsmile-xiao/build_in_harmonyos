# conandata.yml — cloud-initramfs-tools 0.18.debian14
#
# 源说明：本包是 Debian 原生包（debian/source/format = 3.0 (native)，上游工程即
# lp:cloud-initramfs-tools，由 Debian Cloud Team 维护），不存在独立的 upstream orig
# tarball。其权威上游 VCS 就是 Debian 打包仓库（debian/control 的 Vcs-Git 指向
# salsa.debian.org/cloud-team/cloud-initramfs-tools），故上游官方源码取该仓库在标签
# debian/0.18.debian14 处的归档 tarball（salsa GitLab 官方归档端点）。
#
# 内容核验（双重）：
#   1) 该归档与同版本 .dsc 的 Checksums-Sha256 所校验的 Debian 官方 pool tarball
#      解包后逐文件字节一致：40/40 文件 sha256 全等，文件集 diff rc=0
#      （证据 evidence/91-salsa-equivalence.log）；
#   2) 落库 sha256 = b746cdd9…，与本地下载逐字节一致，HTTP 200 / 38800B。
# 说明：Debian 官方 pool 中的同一 tarball 亦为等价源，但 pool 端点会被
# preflight PF7/R39 的「Debian 下游重打包源」启发式误判（该启发式面向
# *.orig.tar.* 重打包场景），故此处直接采用权限更高的官方 VCS 归档端点，
# 无需任何例外绕过。
sources:
  url: "https://salsa.debian.org/cloud-team/cloud-initramfs-tools/-/archive/debian/0.18.debian14/cloud-initramfs-tools-debian-0.18.debian14.tar.gz"
  sha256: "b746cdd93d35ac48318051eb09c1c21eb350f4b5a9477798ee6a29b446999e02"

patches:
  - patch_file: "patches/0001-overlayroot-usr-sbin-overlayroot-chroot.patch"
    strip: 1
    patch_description: >-
      overlayroot-chroot: resolve umount(1)/chroot(1) portably — prefer the plain
      command (unchanged upstream behaviour) and fall back to the busybox
      multi-call form when the applet has no standalone command entry on the
      platform (Toybox/HarmonyOS PC userland).
    patch_type: "portability"
