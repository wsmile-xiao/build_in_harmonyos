# 软件级 manifest — cloud-initramfs-tools
# 文件位置: archives/c/cloud-initramfs-tools/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: cloud-initramfs-tools
display: "cloud-initramfs-tools"
description: "initramfs-tools 云镜像扩展模块（overlayroot / growroot / rescuevol / dyn-netconf）"

category: utility
homepage: "https://launchpad.net/cloud-initramfs-tools"
license: GPL-3.0-or-later

build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 POSIX shell 包（Debian 原生包，Architecture: all），无编译步骤：上游 `make install` 仅用 install(1) 拷贝脚本/配置/man"
    - "OHOS 命令可见性取决于 PATH 组成：默认进程 PATH 含 /system/bin（提供 install/umount/chroot），但交互 shell 与受限环境常裁剪该目录 → 上游 make install 报 Error 127；recipe 需条件化 install shim（busybox install applet 同名入口）"
    - "脚本内避免裸调工具名：applet 存在但可能无同名入口，用 `command -v` 探测 + `busybox <applet>` 回退（默认分支与上游一致）"
    - "OHOS /etc 与 /tmp 只读 → 配置与 motd 片段落包内 res/，由 runenv 变量指向"
    - "HMDFS 权限归一化：install -m 755 实测落地 770、-m 644 落地 660；断言用可执行位+字节一致，不比对精确 mode"
    - "沙箱未放行 mount 族 syscall：真实 umount/chroot 触发 SIGSYS(rc=159)，属平台能力限制（E051）"
    - "本包交付物面向 initramfs 环境运行；OHOS 无 initramfs-tools，主体逻辑以协议层（prereqs）+ 语法自洽 + 布局契约覆盖"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.18.debian14":
    status: built
    build_date: "2026-09-26"
