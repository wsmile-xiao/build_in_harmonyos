---
version: "1.1"
status: "adapted"
upstream_version: "1.1"
upstream_url: "http://caphgame.sourceforge.net/"
upstream_source_url: "https://sourceforge.net/projects/caphgame/files/caph/caphgame-1.1/caph-1.1.tar.bz2"
license: "GPL-3.0-or-later"
category: "application"
description: "Caph 1.1 — physics-based puzzle game adapted for HarmonyOS (SDL 1.2 software rendering, no OpenGL)"

dependencies:
  - name: "sdl"
    version: "1.2.15"
    type: "runtime"
  - name: "libpng"
    version: "1.6.58.3"
    type: "runtime"

adaptations:
  - "OpenGL removed (OHOS sandbox has no GPU context); SDL software surface used"
  - "/bin/bash shebang fixed to #!/system/bin/sh in mkgen/confg/build scripts"
  - "SYS_DATA_DIR path fixed: ../share/caph/ → ../res/caph/ (matches conan package layout)"
  - "deps_cpp_info used for compiler/linker flags (pkg-config unavailable in worker)"

knowledge_gained:
  - "caph uses custom mkgen+confg bash scripts to generate caph.mk Makefile (ref: E001-20260930-001)"
  - "caph is a GUI application with no automated upstream tests (ref: E002-20260930-002)"
