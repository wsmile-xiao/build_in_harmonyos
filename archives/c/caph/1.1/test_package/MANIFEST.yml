# test_package/MANIFEST.yml
# Caph 1.1 — upstream has no automated test framework (no tests/ directory,
# no ctest/pytest/make check). The game is a single GUI binary.
#
# Upstream test entry: none (GUI application, requires interactive display).
# Adapted test: consumer smoke test that verifies binary integrity, data
# completeness, linker contract, and headless runtime under SDL dummy driver.

package: caph/1.1
homepage: "http://caphgame.sourceforge.net/"

upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: conanfile.py
    description: "Consumer test driver — binary integrity + data completeness + linker contract, then delegates the runtime phase to harmonyos_consumer_test.py"
    command: "conan test . caph/1.1@ohpcd/stable"
  - file: harmonyos_consumer_test.py
    description: "HarmonyOS-specific end-to-end consumer case (real process launch, not an assertion list) — runs the packaged caph binary under SDL dummy video/audio drivers and requires it to stay alive for the full 10 s budget; LD_LIBRARY_PATH is built from dependency libdirs"
    command: "python3 harmonyos_consumer_test.py <caph_binary> <LD_LIBRARY_PATH>"

assertion_count: 0
