# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: coco-cpp/20120102
homepage: "https://ssw.jku.at/Research/Projects/Coco/"

# 上游无自动化测试套件：仅 Makefile all/clean/install 与 build.sh/coc.sh 编译脚本，
# 无 check/test 目标，无测试目录（R51 清点证据见 notes.md）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: "test_package/conanfile.py test()（内嵌 Sample.atg 文法）"
    description: "消费者测试：打包后的 cococpp 对真实属性文法执行生成，断言 Scanner.cpp/Parser.cpp 产出及内容（解析器含文法名、扫描器含 Scanner 类）"
    command: "conan test()（conan create 自动执行，1/1 passed）"

assertion_count: 4
