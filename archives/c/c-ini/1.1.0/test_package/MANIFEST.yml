# test_package/MANIFEST.yml — c-ini 1.1.0 上游测试声明
# 上游测试命令：meson test（默认配置，共 3 项，无跳过条件）

package: c-ini/1.1.0
homepage: "https://github.com/c-util/c-ini"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test-api.c
    source: c-ini-1.1.0/src/test-api.c
    description: "API Symbol Visibility——导出符号与 libcini.sym 一致性"
    command: "./build/src/test-api"
  - file: src/test-basic.c
    source: c-ini-1.1.0/src/test-basic.c
    description: "Basic API Behavior——reader/domain/group/entry 基础语义"
    command: "./build/src/test-basic"
  - file: src/test-reader.c
    source: c-ini-1.1.0/src/test-reader.c
    description: "Parser Capabilities——流式 reader 各种解析模式"
    command: "./build/src/test-reader"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：流式 new/feed/seal 解析并检索 group/key-value 真实行为断言"
    command: "ctest --test-dir . --output-on-failure"

# 测试断言总数 (近似值, 用于质量评估；静态统计 assert( 出现次数)
# test-api.c: 14 + test-basic.c: 32 + test-reader.c: 22
assertion_count: 68
