# 版本级 manifest — cqrlib 1.1.4
# 遵循 ARCHIVE-SPEC v2.0

version: "1.1.4"
software: cqrlib

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-09"
build_system: direct-compile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/yayahjb/cqrlib/archive/refs/tags/CQRlib-1.1.4.tar.gz"
  sha256: "98d70b5a347638754ef3a3874d4ec1ecdd9d1d12c123c44b367ff18419f92c6d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: direct-compile  # 上游仅 libtool 手写 Makefile，配方内直接编译

  configure_options:
  - "-O2 -fPIC (static default)"
  - "上游 Makefile 依赖 libtool 且默认装到 $HOME，不适用于沙箱，配方内直接编译"

  # 零第三方依赖（仅 libm）
  dependencies: []

  cc: clang
  cxx: clang

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []  # 无补丁，配方侧绕过 libtool Makefile

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "cqrlib 1.1.4 上游无 CMake/autotools，只有面向 libtool 的手写 Makefile（INSTALLDIR=$HOME、版本宏 VERSION=3:0:1 与 RELEASE 脱节），沙箱不可用 → 配方内直接编译 cqrlib.c（同仓零构建系统小库模式）"
- "上游 make tests 的判据是运行 CQRlibTest/CPPQRTest 后 diff *_orig.lst，但 GitHub tarball 内两个 *_orig.lst 均为 0 字节占位 → diff 判据不可用；实质判据 = 程序自检返回值（CQRlibTest 返回 errorcount）"
- "CPPQRTest.cpp 测的是 cqrlib.h 内 #ifdef __cplusplus 的 header-only C++ 模板，按上游 Makefile 语义不链接库（仅 -lm）"
- "库名沿用上游 libCQRlib（大小写敏感），头仅 cqrlib.h"
