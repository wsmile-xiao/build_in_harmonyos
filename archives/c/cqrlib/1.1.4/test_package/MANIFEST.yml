# test_package/MANIFEST.yml — cqrlib 1.1.4
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: cqrlib/1.1.4
homepage: "https://github.com/yayahjb/cqrlib"

# 上游测试命令（手动复现：源码树顶层 make tests）
upstream_check_command: "make tests"

# conanfile.py build() 中是否已集成上游测试（层1）
upstream_test_in_build: true
upstream_test_command: "build() 内编译并实跑上游 CQRlibTest.c + CPPQRTest.cpp（自检 errorcount/exit!=0 即失败）"

# 上游 2 个测试程序：CQRlibTest(C API 自检) + CPPQRTest(C++ 模板自检)。
# 上游 Makefile 还有 diff *_orig.lst 判据，但 tarball 内两个 .lst 是 0 字节占位，
# diff 判据不可用，实质判据为程序自检返回值（上游默认流程亦如此依赖）。
upstream_test_count: 2
upstream_test_cases_skipped: 0
