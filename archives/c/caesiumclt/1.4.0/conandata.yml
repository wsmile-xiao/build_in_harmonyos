sources:
  url: "https://github.com/Lymphatus/caesium-clt/archive/refs/tags/v1.4.0.tar.gz"
  sha256: "3dc4bc062536fcaa368d044aea873afd695feeabd9310d6118a7d45b2f0ad52e"

# Used only when the OHOS runner image does not provide cargo/rustc.
rust_toolchain:
  - name: rust
    url: "https://harmonybrew.atomgit.com/bottles/rust-1.97.1.arm64_ohos.bottle.tar.gz"
    sha256: "21b135fd7f403d08752a0fcc2bac70ee9a79909ad0e05e7c3ebbdd9afa66525e"
    # Official OHOS standalone installer (same 1.97.1, Tier-2 ohos target).
    # Used only if the Harmonybrew bottle returns 404/5xx; checksum is
    # verified against the pinned value when present, otherwise the
    # download is TLS-verified and extracted into the isolated build folder.
    fallback_urls:
      - "https://static.rust-lang.org/dist/rust-1.97.1-aarch64-unknown-linux-ohos.tar.xz"
  - name: openssl3
    url: "https://harmonybrew.atomgit.com/bottles/openssl%403-3.6.4.arm64_ohos.bottle.tar.gz"
    sha256: "e1be73c6c68e29c33ff43761045e43e23e7c369f0fb1a24f40e226ec5cb28f98"
    # The 3.6.3 bottle was removed upstream (404, silently skipped as an
    # optional bottle) and cargo then failed with "TLS_client_method: symbol
    # not found" on workers without a new-enough system OpenSSL. Fall back to
    # the 3.5 line (same libssl.so.3 soname) so a future bottle bump cannot
    # break the toolchain the same way.
    fallback_urls:
      - "https://harmonybrew.atomgit.com/bottles/openssl%403.5-3.5.8.arm64_ohos.bottle.tar.gz"
  - name: zlib
    url: "https://harmonybrew.atomgit.com/bottles/zlib-ng-compat-2.3.3_1.arm64_ohos.bottle.tar.gz"
    sha256: "1c17a31f8104701bce6b471af8dbbd14bb67d16a504eec087018feb05493a430"
  - name: ca-certificates
    url: "https://harmonybrew.atomgit.com/bottles/ca-certificates-2026-08-13.arm64_ohos.bottle.tar.gz"
    sha256: "2916654bf828a59e1fd9862299300b48c1e5e7cb09fef279d4f78aaf066cd006"
