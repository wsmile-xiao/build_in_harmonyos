package: caesiumclt/1.4.0
homepage: "https://github.com/Lymphatus/caesium-clt"

upstream_check_command: "cargo test --locked"
upstream_test_in_build: true
upstream_test_command: "cargo test --locked"

upstream_tests:
  - file: src/compressor.rs
    source: caesium-clt-1.4.0/src/compressor.rs
    description: "6 compression pipeline tests (output path, sample compression, no-upscale, resize, gif quality, min savings)"
    command: "cargo test --locked compressor"
  - file: src/options.rs
    source: caesium-clt-1.4.0/src/options.rs
    description: "9 CLI validator/enum tests (quality, verbosity, png level, range, overwrite, format, chroma, max/min size)"
    command: "cargo test --locked options"
  - file: src/scan_files.rs
    source: caesium-clt-1.4.0/src/scan_files.rs
    description: "7 file scanning tests (extension, mimetype, base folder/file/path, scan, progress)"
    command: "cargo test --locked scan_files"
  - file: src/main.rs
    source: caesium-clt-1.4.0/src/main.rs
    description: "16 CLI wiring tests (parallelism, progress, chroma map, options build, recap, stats, json output)"
    command: "cargo test --locked main"

test_package_tests:
  - file: test_caesiumclt.py
    description: "Checks --version, --help, real PNG compression to non-empty output, and --dry-run"
    command: "python3 test_caesiumclt.py <caesiumclt>"

assertion_count: 4
