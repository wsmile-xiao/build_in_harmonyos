software: caesiumclt
version: "1.4.0"
status: built
build_date: "2026-09-09"
build_system: cargo
conan_ref: "caesiumclt/1.4.0"

source:
  url: "https://github.com/Lymphatus/caesium-clt/archive/refs/tags/v1.4.0.tar.gz"
  sha256: "3dc4bc062536fcaa368d044aea873afd695feeabd9310d6118a7d45b2f0ad52e"
  tar_format: tar.gz

build:
  system: cargo
  configure_options:
    - "cargo build --release --locked"
    - "cargo test --locked (38 upstream tests)"
    - "OHOS target: aarch64-unknown-linux-ohos (override with RUST_TARGET)"
    - "OHOS fallback: checksum-pinned Harmonybrew Rust 1.97.1, OpenSSL, zlib, and CA bottles"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "caesiumclt 1.4.0 is a pure Rust CLI with one binary and no Conan dependencies."
  - "The recipe defaults to aarch64-unknown-linux-ohos and supports RUST_TARGET overrides."
  - "The OHOS runner image has no Rust/Cargo; four SHA256-pinned Harmonybrew arm64_ohos bottles provide an isolated fallback."
  - "Upstream ships 38 cargo tests across compressor/options/scan_files/main modules; GitHub tag archive (not crates.io) is required because samples/ is excluded from the crate."
  - "The software-level commands.json declares the packaged executable as an R38 tool."
