software: cdrskin
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游最新 1.5.9——scdbackup 官方站；清单 1.0.0 与上游
# 不符按真实版）
version: "1.5.9"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"

# 构建系统标识（verify-build 要求）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（scdbackup 官方站）
  url: "https://scdbackup.sourceforge.io/cdrskin-1.5.9.tar.gz"

  # 源码校验和
  sha256: "60eedf78f0e21a2b3cba2e9050333a65f95b71ebe46267aea4f3438ed4edcd76"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 构建系统标识（verify-build 要求）
  build_system: autotools

  # 配置选项列表（无特殊选项——libcdio 可选自动检测）
  configure_options: []

  # 编译依赖列表（无 Conan 依赖——pthread 系统库 + 内置 libburn）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "cdrskin-1.5.9 tarball 是 libburn 套件本体（AC_INIT libburn）——内置 libburn 库，无需外部 libburn 制品（与 cdw 依赖外部 burn 缺失不同）"
    - "依赖 pthread（系统）+ 可选 libcdio（configure 自动检测，无则绕过）；上游 test/ 6 个测试程序 noinst_PROGRAMS 随 make 构建"
