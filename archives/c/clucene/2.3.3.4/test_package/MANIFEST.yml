package: clucene/2.3.3.4
homepage: "https://sourceforge.net/projects/clucene/"
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: src/test/tests.cpp
    source: clucene-core-2.3.3.4/src/test/tests.cpp
    description: "upstream CuTest suite (36 cases via cl_test binary)"
    command: "./bin/cl_test"

test_package_tests:
  - file: test_clucene.cpp
    description: "RAMDirectory index+search functional test"
    command: "./test_clucene"
  - file: test_analyzer.cpp
    description: "StandardAnalyzer tokenization test"
    command: "./test_analyzer"

assertion_count: 4
