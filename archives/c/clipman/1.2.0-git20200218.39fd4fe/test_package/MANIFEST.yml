# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: clipman/1.2.0-git20200218.39fd4fe
homepage: "https://github.com/chmouel/clipman"

# 上游源码审计：commit 39fd4fe0e7cbb3abb41cb6e5ebb961f6b75fd4e1
#（2020-02-18）的归档树不含任何自动化测试，test_audit.py 每轮真机
# 重新下载同 URL+sha256 的归档并扫描验证。
upstream_tests_exist: false
upstream_test_audit:
  - source: "main.go"
    reason: "仅含 kingpin CLI 装配（store/pick/clear/restore）与 getHistory/serveTxt/wipeAll 实现，无 testing 引用、无 TestMain、无测试函数。"
  - source: "selector.go"
    reason: "选择器实现（dmenu/bemenu/rofi/wofi/STDOUT）+ preprocessData；无 *_test.go 配套文件。"
  - source: "storer.go"
    reason: "store/filter/write 实现；无测试函数、无测试构建标签。"
  - source: "go.mod"
    reason: "模块 github.com/yory8/clipman，go 1.13；require 仅 kingpin.v2 + 两个 indirect 依赖，无测试框架依赖。"
  - source: "go.sum"
    reason: "仅模块校验和记录，无测试相关条目可言。"
  - source: "源码树结构"
    reason: "归档顶层仅 CHANGELOG.md/CONTRIBUTING.md/COPYING/README.md/RELEASE_TODO.md/docs/go.mod/go.sum/main.go/selector.go/storer.go：无 tests/ 或 test/ 目录、无 Makefile、无 *_test.go。"
  - conclusion: "上游未提供自动化测试；由 test_package 执行消费者视角的真实二进制行为验证（--version + store -P + pick --tool STDOUT + --help），并由 test_audit.py 每轮复验归档。"

# 上游测试命令：无上游测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无。
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_clipman.sh
    description: "真实二进制行为验证：--version 输出含 1.2.0；两次 store -P 写入临时 histpath 并校验 JSON 落盘；pick --tool STDOUT 回显全部条目；--help 退出码为 0。共 6 个断言，输出 HMBS_TEST_PACKAGE_RESULT。"
    command: "bash test_clipman.sh"
  - file: test_audit.py
    description: "上游测试审计：重新下载上游归档（URL+sha256 同 conandata.yml）并扫描 Go 测试套件（*_test.go/tests 目录/Makefile test 目标），确认上游无测试；同时审计打包产物（bin/clipman 存在、ELF magic）。产出 HMBS_UPSTREAM_TEST_RESULT 标记（status=no_tests, discovered/executed/passed/failed=0）。"
    command: "python3 test_audit.py <package_folder> <workdir> <tarball>"

# 测试断言总数（近似值，用于质量评估）
# - test_clipman.sh: 6 个断言（--version 1 + store 落盘 2 + pick 回显 2 + --help 1），HMBS_TEST_PACKAGE_RESULT 的 discovered=6/passedCount=每次实跑统计
# - test_audit.py: 产物 2 项审计（bin/clipman 存在、ELF magic）+ 上游测试套件扫描（真实验证 0 测试）
assertion_count: 8
