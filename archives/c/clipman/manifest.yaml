# 软件级 manifest
# 文件位置: archives/c/clipman/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: clipman

# 显示名
display: "Clipman Wayland Clipboard Manager"

# 一句话描述
description: "A simple clipboard manager for Wayland"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://github.com/chmouel/clipman"

# 开源许可证（SPDX 标识）
license: GPL-3.0-only

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "纯 Go 项目，无 CGO 代码；CGO_ENABLED=1 仅为满足鸿蒙 ELF 签名要求"
    - "Go SDK 探测不到时从官方归档 bootstrap（复用 caddy 配方模式）"
    - "上游无测试套件，走 no_tests 审计路径（复用 bankstown-lv2 模式）"
    - "clear/restore 子命令硬依赖 wl-copy，测试仅覆盖无外部依赖路径"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2.0-git20200218.39fd4fe":
    status: built
    build_date: "2026-09-09"
    note: "首轮适配：Debian 快照版本对应的上游 commit 39fd4fe（2020-02-18）"
