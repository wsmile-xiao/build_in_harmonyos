software: clxclient
display: "clxclient"
description: "C++ wrapper library for the X11 protocol"
category: library
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"
license: "LGPL-2.1-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "Remove -march=native and the pkgconf freetype2 probe; compiler and include paths come from the Conan profile and dependencies."
    - "Parameterize INSTALL (toybox /bin/install) and drop ldconfig."
    - "Install the full shared-library symlink chain (.so -> .so.3 -> .so.3.9.2)."
    - "Declare libx11/libxft/freetype/clthreads as transitive_headers requirements so consumers inherit X11/Xft/FreeType/clthreads include dirs."
  common_dependencies:
    - libx11
    - libxft
    - freetype
    - clthreads

versions:
  "3.9.2":
    status: built
    build_date: "2026-08-31"
