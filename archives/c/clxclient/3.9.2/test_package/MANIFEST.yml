package: clxclient/3.9.2
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"

upstream_check_command: "make -C source check"
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  The 3.9.2 tarball ships only AUTHORS, COPYING and source/: the top-level
  source/Makefile defines only all, install, uninstall and clean targets.
  There is no test/check target and no test directory, so `make -C source
  check` fails with "No rule to make target 'check'". The library is
  exercised instead by the packaged consumer test below.

test_package_tests:
  - file: test_clxclient.cpp
    description: >-
      Links clxclient and exercises the X_resman resource-database API
      (XrmParseCommand-fed command line, then get/getb round-trips) without
      opening an X display connection. On OHOS the consumer is staged with the
      full runtime shared-library closure (copied + ELF-signed) and run with a
      validated RPATH, mirroring the libxft OHOS runtime pattern.
    command: "test_clxclient"

test_case_count: 1
assertion_count: 4
