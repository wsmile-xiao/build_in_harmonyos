package: cbqn/0.12.0
homepage: "https://github.com/dzaima/CBQN"

# 上游没有 make check / ctest 入口：顶层 makefile 无 test 目标，tag 归档内也没有 CI 目录。
# 官方入口只写在 test/README.md：test/run.bqn（逐用例文件调用）+ make -C test/ffi。
upstream_check_command: "./BQN test/run.bqn slow [bin=./BQN] <case-file-relative-to-test/cases>"
upstream_test_in_build: true
upstream_test_command: >-
  ./BQN test/run.bqn slow <case>（cli 用例额外带 bin=./BQN）；
  ./cbqn-debug test/run.bqn slow <TEST_UTILS 用例>；
  ./cbqn-usz32 test/run.bqn slow usz32.bqn；
  make -C test/ffi CC=<clang>

# ---- 分层账本：不同层级各自闭合，不相加冒充同一层 ----
# 口径提醒：用例名必须传相对 test/cases 的裸文件名。传 "test/cases/system.bqn" 路径形态会让
# system.bqn 的 •state/•name 两条断言拿到完整路径而假失败；带 slow 时该文件为
# 355 passed! (3 skipped tests)，路径形态那次（未带 slow）报 352/354。
levels:
  test_cases:                          # 层级 1：上游 runner test/run.bqn 的注册条目
    static_total: 2275                 # = 逐文件 (passed + failed + skipped) 累加
    case_files: 43                     # test/cases/**.bqn，扣除 windows/ 后
    executed: 2258                     # 跨三种构建配置合并后的执行数
    passed: 2256
    failed: 2                          # 全部为 proper-fills.bqn:20,21，上游自身错配
    skipped_by_upstream_flags: 17      # 上游 runner 按 %DEBUG/%HEAPVERIFY/%EACH_FILLS/%USZ32 跳过
    identity: "2275 = 2256 + 2 + 17"
  test_ffi_golden:                     # 层级 2：make -C test/ffi 的黄金输出比对目标
    targets: 3                         # test-lib / test-shared / test-extended
    passed: 3
    failed: 0
    identity: "3 = 3 + 0"
  consumer:                            # 层级 3：test_package 消费者，另列不并入上游
    programs: 1
    assertions: 21
    passed: 21

# 积分赛模板的两张表按"测试类型"分行，其"合计"行是上面层级 1+2（上游）与 1+2+3（适配后）
# 的按行求和，属于表格口径，不是同一次运行的分母；通过率一律按单层给出，不做跨层相除。
template_table_totals:
  upstream_total: 2278                 # 2275（单元）+ 3（集成）+ 0（其他）
  adapted_total: 2279                  # 再加 1 个消费者测试
  pass_rates:
    unit_level_executed: "2256/2258 (99.9%)"
    unit_level_static: "2256/2275 (99.2%)"
    ffi_level: "3/3 (100%)"
    consumer: "21/21 (100%)"
  evidence:
    log: "reports/w3-local-ci.log（本地 W3 = ci/conan/build_and_test.sh 的 conan create 日志）"
    ledger_marker: "UPSTREAM LEDGER cbqn/0.12.0 files=43 entries=2275 executed=2258 passed=2256 failed=2 skipped_by_upstream_flags=17"
    ffi_marker: "UPSTREAM FFI GOLDEN SUITE: 3/3 targets byte-identical"
    stale_marker: "UPSTREAM KNOWN-STALE proper-fills.bqn: 13/15"
    consumer_marker: "21 checks, 0 failures（直接运行安装包内的消费者程序）+ 100% tests passed（ctest）"

# ---- 层级 1 的构建配置拆分（配方在同一 conan create 内自动跑齐三种配置）----
upstream_shipped_configuration:
  name: "make o3 + make shared-o3: singeli=1 FFI=1 REPLXX=0 usz=64"
  files: 38
  entries: 2245
  executed: 2228
  passed: 2226
  failed: 2
  skipped_by_upstream_build_flags: 17
  derivation: >-
    files = 43 - 5（5 个文件按上游设计属于其它构建配置：4 个 TEST_UTILS + 1 个 usz32）；
    entries = 2275 - 30（TEST_UTILS 24 条 + usz32 6 条）；executed = entries - skipped = 2245 - 17
  note: >-
    38 个文件里 37 个整文件通过；唯一非绿是 proper-fills.bqn 的 2 条上游自身错配断言
    （见 known_stale）。17 条由上游 runner 按自身构建标志跳过，不计通过也不计失败。

upstream_variant_configurations:
  - name: "make debug（-DDEBUG ⇒ TEST_UTILS，参数集里同时带 singeli=1 以注册 mode 298）"
    cases:
      - "build-specific/test_range.bqn"
      - "build-specific/test_group_stat.bqn"
      - "fuzz/bitarr-fill.bqn"
      - "fuzz/bitcpy.bqn"
    entries: 24
    passed: 24
    evidence: >-
      src/builtins/internal.c 把 •internal.Temp 模式 201/202/203 包在 #if TEST_UTILS、
      模式 298 包在 #if TEST_UTILS && SINGELI（TEST_UTILS 默认取 DEBUG）
  - name: "make o3 usz=32（-DUSZ_32）"
    cases: ["usz32.bqn"]
    entries: 6
    passed: 6
    evidence: >-
      该文件共 6 条断言，逐条都期望抛错：第 1、3、4、5、6 行期望 "Out of memory"，第 2 行期望
      "𝕨⥊𝕩: 𝕨 too large"（第 5、6 行标 %SLOW）。usz64 发布配置实跑汇总行 "1/6"——第 1 行仍抛
      Out of memory 而通过，第 2 行 Wrong error message（实际抛 Out of memory 而非 𝕨 too large），
      第 3-6 行 Expected error, but didn't get one（这些形状在 64 位地址空间下合法）。
      `make o3 usz=32` 变体下 6 条全部按期望抛错 → "usz32.bqn: 6 passed!"

# ---- 配方自打印的层级 1 合并账本（本地 W3 与远端 CI 同源）----
upstream_ledger_line: >-
  UPSTREAM LEDGER cbqn/0.12.0 files=43 entries=2275 executed=2258 passed=2256
  failed=2 skipped_by_upstream_flags=17
upstream_ledger_identity: "entries == passed + failed + skipped（配方不成立即抛错）"

# ---- 上游清单中不属于本移植目标或未执行的部分（不混入通过率）----
upstream_platform_specific_not_executed:
  - file: "test/cases/windows/system.bqn"
    entries: 62
    reason: >-
      Windows 盘符与反斜杠路径语义专用（上游自身的用例 glob 也不含该目录）；
      在 OHOS 强行运行实测 22/62，失败签名全部是 Expected: "A:/"、"//server\share\" 之类
      Windows 专有形态，属上游按平台分目录组织的用例
upstream_not_executed_missing_assets:
  - "test/mainCfgs.sh, test/x86Cfgs.sh, test/moreCfgs.sh（需 mlochbaum/BQN 参考实现测试资产）"
  - "test/precompiled.bqn, test/readTests.bqn（需 dzaima/BQN Java 实现或额外构建产物）"
  - "test/joinReuse.bqn（需 -DPRINT_JOIN_REUSE 构建，release 产物不含该输出）"

upstream_integration_suites:
  - name: "test/ffi golden comparisons"
    command: "make -C test/ffi CC=<clang>"
    targets: ["test-lib", "test-shared", "test-extended"]
    entries: 3
    passed: 3
    evidence: >-
      配方从 make 输出里解析 "are identical" 行数并要求等于 3；本次运行得
      UPSTREAM FFI GOLDEN SUITE: 3/3 targets byte-identical

# ---- 少数不可通过断言：上游断言与该 tag 实现错配（平台无关）----
known_stale:
  - file: "test/cases/proper-fills.bqn"
    lines: [20, 21]
    observed: "13/15"
    message_expected_by_case: ">𝕩: Fill element of empty 𝕩 not known"
    reason: >-
      该错误串在 v0.12.0 的 C 源码与预编译运行时字节码 blob 中 grep 命中 0；
      src/builtins/sfns.c 的 shift_powm() 在 IA(x)==0 时先 return x，不查 fill element；
      o3 / o3+singeli=1 / debug / -DEACH_FILLS=1 四种构建结果一致（13/15）；
      上游 master 的同一断言行与同一实现分支至今未变，故与平台与工具链无关。
    recipe_behaviour: >-
      conanfile.py 仍执行该文件，并把结果钉死为 summary == "13/15" 且失败行集合恰为
      {proper-fills.bqn:20, proper-fills.bqn:21}；上游一旦改变行为，conan create 立即失败

# ---- 消费者测试（另列）----
consumer_tests: 1
consumer_passed: 1
consumer_assertions: 21
test_package_tests:
  - file: "test_cbqn.c"
    description: >-
      链接安装后的 libcbqn 并通过公共头 bqnffi.h 真实求值：2+2、+´⟨1,2,3,4⟩、↕6 的
      绑定/秩/元素、由 C 构造的 2×3 数组回读、C 构造向量交给 +´ 归约、bqn_call2、
      ⍋ 排序索引、UTF-8 码点计数（数组字节为 h, 0xC3, 0xA9, l, l, o，即 6 字节的 héllo，
      按码点必须是 5 而非 6）、空数组边界与 •Type 区分，共 21 条断言；
      任一不符即非零退出，ctest 判失败
    command: "./test_cbqn"

assertion_count: 21
