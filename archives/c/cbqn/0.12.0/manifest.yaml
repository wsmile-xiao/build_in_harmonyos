version: "0.12.0"
software: "cbqn"
status: built
build_date: "2026-09-08"
build_system: makefile

source:
  url: "https://github.com/dzaima/CBQN/archive/refs/tags/v0.12.0.tar.gz"
  sha256: "41ae3a9a7d6cfe8bd3fafdcdbf9b9823b687ae373297cfe8a6bf59638e0552ca"
  tar_format: tar.gz

build:
  system: makefile
  package_type: library
  configure_options:
    - "REPLXX=0"
    - "FFI=1"
    - "singeli=1"
    - "target_arch=aarch64"
    - "target_os=linux  (OHOS 走上游 linux 分支，见 _target_os())"
    - "nogit=1"
    - "version=0.12.0"
    - "lf=-Wl,-soname,libcbqn.so  (仅 shared 构建；CI L5a 要求 DT_SONAME)"
    - "usz 只在 usz=32 取证变体里显式传；发布构建用上游默认 64 位 usz"
  dependencies:
    - "libffi/3.5.2"
  build_inputs:
    - "dzaima/cbqnBytecode @156b47caf895f6706811c5c34bbbbaf192b8018b -> build/bytecodeLocal"
    - "mlochbaum/Singeli @5187ed3aa22a2257b63c04a5498ec756fa6263cb -> build/singeliLocal"
  cc: "/data/service/hnp/bin/clang"
  cxx: "/data/service/hnp/bin/clang++"

patches_applied: []

# 顶层四个整数只描述**一个层级**（上游 test/cases 的注册条目，由上游自带 runner 解析），
# 不做跨层求和；其它层级与积分赛表格口径放在下面两个具名块里，各自闭合。
test_results:
  type: official
  total: 2275
  passed: 2256
  failed: 2
  skipped: 17
  level: "test/cases 注册条目（runner 层，43 个适用文件，跨三种上游构建配置执行）"
  evidence:
    log: "reports/w3-local-ci.log（本地 W3 = ci/conan/build_and_test.sh 的 conan create 日志）"
    marker: "UPSTREAM LEDGER cbqn/0.12.0 files=43 entries=2275 executed=2258 passed=2256 failed=2 skipped_by_upstream_flags=17"
    identity: "entries == passed + failed + skipped，配方内断言，不成立即构建失败"
    ffi_marker: "UPSTREAM FFI GOLDEN SUITE: 3/3 targets byte-identical"
    stale_marker: "UPSTREAM KNOWN-STALE proper-fills.bqn: 13/15"
  other_levels:
    test_ffi_golden_targets: {total: 3, passed: 3, failed: 0}
    consumer_test_package: {programs: 1, assertions: 21, passed: 21}
  template_table_totals:
    upstream_declared: 2278        # 2275（单元）+ 3（集成）+ 0（其他），积分赛表格按行求和
    adapted_including_consumer: 2279
  pass_rates:
    unit_level_executed: "2256/2258 (99.9%)"
    unit_level_static: "2256/2275 (99.2%)"
    ffi_level: "3/3 (100%)"
    consumer: "21/21 (100%)"
  detail: >-
    未通过的 2 条集中在 proper-fills.bqn:20,21，属上游断言与该 tag 实现错配（平台无关，
    四件套证据见 notes.md），配方把它钉死为 13/15 + 固定失败行号；17 条由上游 runner
    按自身 %DEBUG/%HEAPVERIFY/%EACH_FILLS/%USZ32 标记跳过。跨层比值一律不给出。

