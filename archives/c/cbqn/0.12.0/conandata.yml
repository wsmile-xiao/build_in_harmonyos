sources:
  url: "https://github.com/dzaima/CBQN/archive/refs/tags/v0.12.0.tar.gz"
  sha256: "41ae3a9a7d6cfe8bd3fafdcdbf9b9823b687ae373297cfe8a6bf59638e0552ca"

# 本 tag 归档把三个 git 子模块目录留成空目录（实测条目数 0），构建实际需要其中两个。commit
# 逐字取自 tag 自身的 tree 记录（不是分支 HEAD），两处独立下载核对过同一 SHA256。解包到上游
# README 指定的 *Local 回退目录，配合 make 参数 nogit=1，构建全程不调用 git。
# build/replxxSubmodule（仅为交互式行编辑）有意不引入，理由见 notes.md 第 7 条。
#
# 这里的硬性写法约束（踩过一次，见 notes.md 第 9 条）：CI 的预下载步骤会抽取本文件任意位置的
# http(s) 字面量，下载到 predl_cache/<md5前8>_<URL最后一段> 后用**整串文本替换**改写原 URL。
# 因此本文件内所有 URL 必须互不为前缀 —— 尤其**不得**写仓库主页形式
# （owner/repo 那种短 URL），否则它会把同一条 archive URL 连带改写成指向本机缓存的畸形路径，
# conan create 在 source() 里报 NotADirectoryError。故下面只保留下载用的 archive URL，
# 仓库归属写在 commit/target 字段里，不出现第二种 URL 形态，注释里也不写任何 URL 字面量。
submodules:
  - target: "bytecodeLocal"
    commit: "156b47caf895f6706811c5c34bbbbaf192b8018b"
    url: "https://github.com/dzaima/cbqnBytecode/archive/156b47caf895f6706811c5c34bbbbaf192b8018b.tar.gz"
    sha256: "050acbe9a8d0a104c1739addeaa23a4b9b0bef9bb4dcd48ca613790fb30048d7"
  - target: "singeliLocal"
    commit: "5187ed3aa22a2257b63c04a5498ec756fa6263cb"
    url: "https://github.com/mlochbaum/Singeli/archive/5187ed3aa22a2257b63c04a5498ec756fa6263cb.tar.gz"
    sha256: "b907bcc6bfcc07d267cb7727594423461817e1ae29d7ffced1cd502979c1ff06"

# 适配全部通过上游自身的 make 变量表达（见 conanfile.py 的 _make_flags），上游源码一行未改。
patches: []
