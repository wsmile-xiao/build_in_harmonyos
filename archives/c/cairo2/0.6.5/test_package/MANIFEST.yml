# MANIFEST.yml — test_package/conanfile.py 元数据
# CI L0e 强制要求此文件存在

package: cairo2/0.6.5
homepage: "https://github.com/Chris00/ocaml-cairo"

# 上游测试命令 (dune runtest)
upstream_check_command: "dune runtest"
upstream_test_in_build: false
upstream_test_command: "dune runtest (OHOS real device, 2026-09-26)"

# 上游测试 (tests/dune 注册 7 个可执行测试)
upstream_tests:
  - file: tests/dune
    source: ocaml-cairo-0.6.5/tests/dune
    description: "image_create test"
    command: "dune runtest tests/"
  - file: tests/dune
    source: ocaml-cairo-0.6.5/tests/dune
    description: "matrix_set test"
    command: "dune runtest tests/"
  - file: tests/dune
    source: ocaml-cairo-0.6.5/tests/dune
    description: "surface_gc test"
    command: "dune runtest tests/"
  - file: tests/dune
    source: ocaml-cairo-0.6.5/tests/dune
    description: "test_for_stream test"
    command: "dune runtest tests/"
  - file: tests/dune
    source: ocaml-cairo-0.6.5/tests/dune
    description: "test_finish test"
    command: "dune runtest tests/"
  - file: tests/dune
    source: ocaml-cairo-0.6.5/tests/dune
    description: "test_path test"
    command: "dune runtest tests/"
  - file: tests/dune
    source: ocaml-cairo-0.6.5/tests/dune
    description: "test_exn test"
    command: "dune runtest tests/"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_smoke.sh
    description: "消费者用例：ocamlopt 链接 cairo.cmxa + libcairo_stubs.a，image surface 绘制 + PNG 写出 + PNG 读回（完整端到端：编译→链接→运行→断言）"
    command: "sh test_smoke.sh"
  - file: conanfile.py
    description: "Conan test_package 入口，注入 LD_LIBRARY_PATH/OCAMLLIB/PKG_LIB 后执行 test_smoke.sh"
    command: "conan test"

# 鸿蒙特有测试 (rule12)
harmony_specific_tests:
  - file: test_smoke.sh
    description: "鸿蒙特有测试：在 HarmonyOS PC 真机上以 ocamlopt 实际构建 OCaml 程序，依赖 conan 管理的 C 库（cairo/fontconfig/freetype/pixman 等）动态链接并执行真实绘制流水线，验证 OHOS 平台适配完整性"
    command: "sh test_smoke.sh"

# 测试断言总数 (近似值)
assertion_count: 8
