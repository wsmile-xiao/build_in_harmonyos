# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制）
# csstidy 1.4 官方源码包无任何测试套件（全量枚举见 reports/test-report.md），
# 上游测试列表为空；test_package 提供鸿蒙专项 CLI 功能断言测试。

package: csstidy/1.4
homepage: "https://csstidy.sourceforge.net/"

# 上游测试命令（官方包无 configure/make/ctest，此处为空）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，真实执行二进制并断言优化行为）
test_package_tests:
  - file: test.sh
    description: "csstidy 鸿蒙专项测试：CLI 真实执行 + 数字/颜色优化与去重断言（5 断言）"
    command: "bash test.sh"

assertion_count: 5