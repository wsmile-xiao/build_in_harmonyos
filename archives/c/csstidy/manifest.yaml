software: csstidy
display: "CSSTidy"
description: "CSS 解析与优化命令行工具（CSSTidy C++ 版），支持压缩、格式化与修复 CSS"
category: utility
homepage: "https://csstidy.sourceforge.net/"
license: GPL-2.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "官方源码包无 configure/make，14 个 .cpp 平铺于 csstidy/ 子目录，直接 c++ *.cpp 编译"
    - "官方 zip 的 central directory 用反斜杠路径名、local header 用正斜杠，conan tools.unzip 静默丢源文件，source() 需容错解压"
    - "产物为 CLI 工具（非库），R38 需软件级 commands.json"
    - "win32_resource.rc / csspp_private.rc / csspp_private.res 为 Windows 专属，Linux/OHOS 构建排除"
  common_dependencies: []

versions:
  - version: "1.4"
    status: published
    build_date: "2026-09-18"