package: crunch64/0.6.2
homepage: "https://github.com/decompals/crunch64"
upstream_tests_exist: true
upstream_check_command: "cargo test --locked --release --workspace --all-targets --features std,c_bindings"
upstream_test_in_build: true
upstream_test_command: "cargo test --locked --release --workspace --all-targets --features std,c_bindings; ./upstream-c-tests; python3 python_bindings/tests.py"
upstream_tests:
  - file: lib/src
    source: "crunch64-0.6.2/lib/src"
    description: "161 Rust fixture-expanded tests: Yaz0 44, Yay0 44, MIO0 40, gzip 33"
    command: "cargo test --locked --release --workspace --all-targets --features std,c_bindings"
  - file: c_bindings/tests.c
    source: "crunch64-0.6.2/c_bindings/tests.c"
    description: "Unmodified upstream C runner: 97 exact compressed/decompressed fixture comparisons"
    command: "./upstream-c-tests"
  - file: python_bindings/tests.py
    source: "crunch64-0.6.2/python_bindings/tests.py"
    description: "97 unmodified upstream Python comparisons using the freshly built PyO3 extension and original wrappers"
    command: "python3 python_bindings/tests.py"
test_package_tests:
  - file: consumer.c
    description: "Five cases: Yaz0/Yay0/MIO0 roundtrips at seven input sizes, error returns and size overflow, gzip CRC32 and size trailer across 12 configurations"
    command: "ctest --output-on-failure -R consumer_"
  - file: harmonyos_test.c
    description: "OH_GetOSFullName/OH_GetSdkApiVersion data roundtrip through Rust C API, shared file mapping, msync and remapping in private TMPDIR"
    command: "ctest --output-on-failure -R harmonyos_deviceinfo_mmap"
assertion_count: 361
