# test_package/MANIFEST.yml — cpp-lazy 9.0.1
package: cpp-lazy/9.0.1
homepage: "https://github.com/Kaaserne/cpp-lazy"

# Upstream tests: 47 translation units form one doctest executable/CTest target.
# Only dependency acquisition is adapted from FetchContent to find_package;
# test sources, registration, assertions and expected results remain unchanged.
upstream_check_command: "cmake -S tests -B build && cmake --build build --parallel 1 && ctest --test-dir build --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir . --output-on-failure --no-tests=error"

upstream_tests:
  - file: "tests/*.cpp (47 files)"
    source: "cpp-lazy-9.0.1/tests/"
    framework: "doctest"
    description: "Complete upstream lazy-view, iterator, algorithm, formatting and pipeline test suite"
    command: "./tests"
    test_cases: 290
    assertions: 12348
    passed: 290
    failed: 0
    skipped: 0

test_package_tests:
  - file: test.cpp
    description: "Consumer test using the installed CMake target and map/filter/to/range/algorithm/zip/format APIs"
    command: "./test_cpp_lazy"
    check_count: 12

assertion_count: 12360
