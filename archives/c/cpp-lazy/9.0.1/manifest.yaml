  cc: clang
  cxx: clang++
  profile: "ci/conan/profiles/ohos-aarch64"

patches_applied:
  - "patches/0001-CMakeLists.txt.patch"
  - "patches/0002-cmake-cpp-lazyConfig.cmake.in.patch"
  - "patches/0003-tests-CMakeLists.txt.patch"

knowledge_gained:
  - "cpp-lazy 9.0.1 is a C++11-compatible header-only CMake INTERFACE library with public optional fmt formatting support."
  - "The v9.0.1 tag still declares project version 9.0.0; correcting it is required for versioned find_package(cpp-lazy 9.0.1)."
  - "The upstream Clang warning set contains -Wno-unsafe-buffer-usage, which Clang 15 does not recognize; suppressing unknown-warning-option preserves all other -Werror checks."

package:
  type: header-library
  include_dir: "include"
  cmake_file_name: "cpp-lazy"
  cmake_target: "cpp-lazy::cpp-lazy"
  pkg_config_name: "cpp-lazy"

