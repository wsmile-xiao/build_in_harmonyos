# 版本级 manifest — crashme 2.8.5

version: "2.8.5"
software: "crashme"

# published | built | failed | archived
status: built
build_date: "2026-09-10"
build_system: makefile

source:
  # 上游站点在 CI worker 上不可达；使用 Debian pool 的 orig.tar.gz（与上游一致）
  url: "https://deb.debian.org/debian/pool/main/c/crashme/crashme_2.8.5.orig.tar.gz"
  sha256: "0581b050d95e90697b9eef8735041c7aa33122a33b85db305484b4497a4f3ce1"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
  - "clang -O2 -Wall -DPRNG_MT -c crashme.c -o crashme.o"
  - "clang -O2 -Wall -DPRNG_MT -c vnsq.c -o vnsq.o"
  - "clang -O2 -Wall -DPRNG_MT -c mt19937ar.c -o mt19937ar.o"
  - "clang -O2 -Wall -DPRNG_MT -c pddet.c -o pddet.o"
  - "clang -O2 -Wall -DPRNG_MT -o crashme crashme.o vnsq.o mt19937ar.o"
  - "clang -O2 -Wall -DPRNG_MT -o pddet pddet.o"
  dependencies: []
  cc: clang
  cxx: N/A

patches_applied: []

knowledge_gained:
- "crashme 上游 makefile 的 CCFLAGS 带 -DPRNG_MT，启用 mt19937ar.c 的 Mersenne Twister 伪随机源；配方必须同样定义该宏，否则 mt19937ar.o 的符号无法被 crashme.c 引用。"
- "上游 makefile 会产出两个二进制：crashme（主工具）与 pddet（能处理 SIGSEGV 的子进程检测器），两者都要打包进 bin/。"
- "crashme 的设计目的就是主动制造 SIGSEGV/SIGILL 崩溃，其上游测试目标（ptest2..ptest11）不可作为 CI 回归用例；消费者测试改为静态校验 + pddet 的安全调用（上游 ptest1 即 `./pddet`）。"
- "上游源码站（个人站点/GitHub）在 CI worker 不可达；deb.debian.org 的 orig.tar.gz 可达且内容一致，是本仓库 GitHub/debian 双通道取源的又一例证。"
