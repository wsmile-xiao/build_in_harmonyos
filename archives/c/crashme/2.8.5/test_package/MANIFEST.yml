# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: crashme/2.8.5
homepage: "https://github.com/gnu-mirror-unofficial/crashme"

# 上游自带 makefile 的测试目标（ptest1..ptest11 / test1a..test1cc）
# 但这些目标会**主动触发段错误/非法指令**（crashme 的设计目的就是制造崩溃），
# 不适合在 CI 上执行做回归，故不在 build() 中集成。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: crashme.c
    source: crashme-2.8.5
    description: "上游 makefile 的 ptest2..ptest11（./crashme <n> <seed> <ntries>）—— 主动制造崩溃，不纳入 CI"
    command: "./crashme 100 666 100"

# test_package 自带消费者测试（静态校验 + 安全加载校验，不触发崩溃路径）
test_package_tests:
  - file: test_crashme.c
    description: "消费者测试 8 条：crashme/pddet 存在/可执行/ELF64-AArch64；crashme 产物非平凡可读；pddet 安全调用未被信号杀死且非 126-127-255"
    command: "test_crashme"

# 测试断言总数：上游 0（崩溃类测试不可用于回归）+ test_package 8
assertion_count: 8
