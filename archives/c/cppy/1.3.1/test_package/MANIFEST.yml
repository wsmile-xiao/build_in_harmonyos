# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cppy/1.3.1
homepage: "https://github.com/nucleic/cppy"

upstream_test_in_build: false

upstream_tests:
  - name: tests/test_getting_include_dir.py（sdist 打包——1 个测试文件）
    count: "1"
    description: "本地 pytest 实测 1/1 = 100%（test_getting_include_directory）"

test_package_tests:
  - file: test_cppy.py
    description: "R34：import cppy + get_include() + cppy/cppy.h 存在（纯 Python 头文件库）"
    command: "python3 test_cppy.py <package>"

assertion_count: 1
