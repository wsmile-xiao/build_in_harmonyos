# conandata.yml — cppy 1.3.1
# C++ 头文件绑定库（Python 包，提供 cppy/cppy.h 给 Python C 扩展编译用）
# 上游：nucleic/cppy（kiwisolver 同作者——kiwisolver build-system 依赖
# cppy>=1.3.0，本包为 kiwisolver 的前置构建依赖）

sources:
  url:
    - "https://files.pythonhosted.org/packages/45/ed/b35645a1b285bce356f30cc0fe77a042375c385660ccd61e0cdc4c1f7c44/cppy-1.3.1.tar.gz"
    - "https://pypi.org/packages/source/c/cppy/cppy-1.3.1.tar.gz"
  sha256: "55b5307c11874f242ea135396f398cb67a5bbde4fab3e3c3294ea5fce43a6d68"

# 补丁：cppy/__init__.py 顶层 setuptools import 改为可选——CI 沙箱
# python3（/data/service/hnp/bin/python3）无 setuptools，import cppy 报
# "No module named 'setuptools'"（CI #34146 实测）——消费者 get_include()
# 不需要 setuptools
patches:
  "1.3.1":
    - patch_file: "patches/0001-lazy-setuptools-import.patch"
      patch_description: "Make setuptools import optional — CI python3 lacks setuptools"
      patch_type: "portability"
