software: canvec
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-24"

# 构建系统标识（verify-build 要求）
build_system: python3

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游无 tag——固定 commit ad2f2599 快照，PR 如实说明）
  url: "https://github.com/rskelly/canvec/archive/ad2f25990f576dd2692f2bd1151892be6ca99f4a.tar.gz"

  # 源码校验和
  sha256: "9c05beba124f9725ce66d73b69182933aef41ad87eee1909a25bdd1d50e4140f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建系统标识（verify-build 要求）
  build_system: python3

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）——纯标准库，无 Conan 依赖
  dependencies: []

  # 编译器（纯 Python 脚本——无 C/C++ 编译）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（Python 2 → 3 语法 patch 在配方 build() 内完成）
patches_applied:
    - "canvec.py: except Exception, e: -> except Exception as e:"
    - "canvec.py: print '...' -> print('...')（8 处）"
runtime_modifications:
    - "bin/canvec python3 shebang wrapper"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "2012 年 GitHub 单文件 Python 脚本为 Python 2 语法（except-as/print 语句），OHOS 仅 python3——需 patch 后才能运行"
    - "上游无 tag/release 时固定 commit 快照作源码源，manifest/PR 如实说明版本来源"
