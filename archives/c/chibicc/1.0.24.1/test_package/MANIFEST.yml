package: chibicc/1.0.24.1
homepage: "https://github.com/rui314/chibicc"

upstream_check_command: "make test && make test-stage2"
upstream_test_in_build: false
upstream_test_command: "make test && make test-stage2"
upstream_tests:
  - name: make-test
    description: "Builds 980 stage1 programs with chibicc and runs the driver suite"
  - name: make-test-stage2
    description: "Bootstraps chibicc from 13 self-hosted objects and repeats the 980 programs and driver suite"

test_package_tests:
  - file: test_chibicc.sh
    description: "Runs packaged OHOS/armv8 chibicc, compiles four fixtures, and validates the pinned corpus at the x86-64 assembly boundary"
    command: "sh test_chibicc.sh"
    source_corpus:
      origin: "Conan source cache adjacent to the tested dependency recipe folder"
      network_requests: 0
      integrity: "inherited from the parent recipe conandata.yml SHA256 verification"
      inventory_gate: "exactly 980 test/*.c files and the exact 13 top-level compiler sources"
      source_owned_gate: "exactly 607 stage1 inputs have a recursive include closure wholly owned by the pinned source tree"
      target_header_gate: "exactly 1037 unique <suite>/<case> <header> blocker pairs are derived from the pinned include graph"
      dependency_blocked:
        reason: "the pinned archive omits csmith.h and the repository has no adapted Csmith package"
        exact_sources: [csmith_102.c, csmith_275.c, csmith_4204.c]
      known_xfails:
        file: "known-xfails.txt"
        version_locked_count: 62
        category_counts:
          const_expr: 44
          primary_expression: 9
          token_paste: 6
          redefinition_main: 1
          line_directive: 1
          qualifiers_static_assert: 1
        acceptance: "exact test name and diagnostic category must both match"
        non_weakening: "XFAIL is not PASS; XPASS, diagnostic drift, and unknown failures are blocking"
    harness_normalization:
      file: "build/upstream/test/test.h"
      exact_structure_gate: true
      action: "retain the __chibicc__ branch, remove its redundant stdio.h include and inactive branch, and prepend fixed local declarations"
      test_body_changes: 0
    cases:
      - arithmetic_calls
      - pointer_array
      - struct_fields
      - recursion_control
    upstream_equivalent:
      stage1_inventory_count: 980
      stage2_source_inventory_count: 13
      command: "<package>/bin/chibicc -std=c11 -g -mavx2 -I <runtime-include> -I <source-test> -S -o <case.s> <case.c>"
      boundary: "OHOS/armv8 CI executes preprocessing, parsing, semantics, and x86-64 code generation but cannot run generated x86-64 programs"
      reporting: "all inputs terminate as PASS, exact XFAIL, XPASS, target-header blocker, dependency blocker, or unexpected failure"
      current_diagnostic_ci:
        id: 24498
        head: "84794402dc"
        stage1: "584 PASS; 62 known failures; 331 target-header blockers; 3 Csmith blockers"
        stage2: "0 PASS; 13 target-header blockers"
      verified_gate:
        ci: 24519
        head: "ce913c9c2c"
        result: "62/62 exact XFAIL, 0 XPASS, 0 unexpected failures; full package pipeline passed"

native_x86_64_validation:
  script: "test_native_x86_64.sh"
  command: "CHIBICC_SOURCE_DIR=<verified-source> bash test_native_x86_64.sh"
  environment: "QEMU 11.1.0 TCG; Linux 6.12.94-0-virt; Ubuntu 24.04.4 LTS glibc/x86_64; GCC 13.3.0; GNU Make 4.3"
  source_integrity: "same 1.0.24.1 archive pinned by SHA256 cbcdaccce25508566b77f26e2ffab41a379e05b6a0be73a5b6806796db62fecc"
  source_changes: 0
  harness_adjustment: "LDFLAGS is cleared because the Makefile's libcrypto link is unused by chibicc and the upstream test programs"
  inventory:
    stage1: "980 generated programs plus one driver suite"
    stage2: "13/13 self-hosted compiler objects, then 980 generated programs plus one driver suite"
    total: 1962
  result_manifest: "../reports/native-x86_64-results.tsv"
  result_manifest_sha256: "d27ac9551fdc05100efe55311a53111bd299776023bfc878bccf57c8906ee432"
  results:
    stage1: "962 PASS, 9 runtime failures, 7 compile failures, 3 dependency blockers; 981 total"
    stage2: "952 PASS, 10 runtime failures, 16 compile failures, 3 dependency blockers; 981 total"
    combined: "1914/1962 PASS (97.55%); 1933/1962 actually executed (98.52%); 23 compile failures; 6 dependency blockers"
    drivers: "stage1 PASS; stage2 PASS"
  non_weakening: "runtime failures, compile failures, and dependency blockers are explicit non-PASS outcomes"

infrastructure_status: "QEMU TCG completed both x86-64 stages; issues #2141 and #2142 were unrelated main defects already repaired; direct device SSH remains unreachable"
assertion_count: 1016
