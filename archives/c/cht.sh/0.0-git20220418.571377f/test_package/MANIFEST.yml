# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: cht.sh/0.0-git20220418.571377f
homepage: https://cheat.sh

# 上游 tests/ 目录为手动测试结果快照（16/19/22/24/25 号 sheet），
# 无可执行测试框架
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试
test_package_tests:
  - file: test.sh
    description: "脚本存在 + bash -n 语法检查 + --help 冒烟 + 3 个 shell 补全文件安装校验 + 鸿蒙特有测试（OHOS 无 /bin/bash 硬链接，校验打包脚本 shebang 已被补丁为可移植的 #!/usr/bin/env bash）"
    command: "sh test.sh"

# 鸿蒙特有测试（PC 特有测试）
harmony_specific_tests:
  - file: test.sh (assertion 5)
    name: "shebang-portability check"
    description: "OHOS 无 /bin/bash 硬链接，上游 #!/bin/bash 直接执行会 127；配方在 build() 阶段改写为 #!/usr/bin/env bash，此测试逐字节校验打包后脚本首行，证明平台补丁真实生效"
    count: 1

assertion_count: 5
