# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: chipmunk2d/7.0.3
homepage: "https://chipmunk-physics.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# Chipmunk2D 7.0.3 上游无独立单元测试套件（仅有 xcode/ObjectiveChipmunkTests，
# 属于 Apple 平台 Objective-C 测试，不适用于 OHOS/Linux 构建）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无适用上游测试，留空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：创建 cpSpace/cpBody/cpShape，设置重力并步进模拟，断言刚体按重力下落"
    command: "./test_chipmunk2d"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
