software: clamav-libunrar
display: "ClamAV UnRAR Library"
description: "ClamAV RAR archive unpacking library (UnRAR decoder used by ClamAV)"
category: compress
homepage: "https://www.clamav.net/"
license: GPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "仅配置上游 libclamunrar/ 子目录，避开单体构建对 Rust/Libcheck/python 的依赖"
    - "独立配置需显式提供 ENABLE_SHARED_LIB/ENABLE_STATIC_LIB、LIBCLAMAV_VERSION/SOVERSION、CMAKE_INSTALL_LIBDIR"
    - "上游不安装头文件，package() 手工复制 dll.hpp + raros.hpp"
    - "OHOS 下沿用 azure-core-cpp 的 SONAME flag 守卫"
  common_dependencies: []

versions:
  "1.4.5":
    status: built
    build_date: "2026-09-09"
    published_as: clamav-libunrar
