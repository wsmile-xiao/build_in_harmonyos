version: "1.4.5"
status: built
build_date: "2026-09-09"
build_system: "cmake"

source:
  url: "https://github.com/Cisco-Talos/clamav/archive/refs/tags/clamav-1.4.5.tar.gz"
  sha256: "afd91f024df9def18336069b9a6bf654b084574a3148bcd1da38a434f2b9434e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_SHARED_LIB=OFF"
    - "-DENABLE_STATIC_LIB=ON"
    - "-DLIBCLAMAV_VERSION=12.0.3"
    - "-DLIBCLAMAV_SOVERSION=12"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Upstream ships libclamunrar inside the monolithic ClamAV tree; configuring only libclamunrar/ avoids Rust/Libcheck/python requirements"
  - "Standalone subdir build needs parent-provided variables: ENABLE_SHARED_LIB/ENABLE_STATIC_LIB, LIBCLAMAV_VERSION/SOVERSION, CMAKE_INSTALL_LIBDIR"
  - "Upstream installs no headers; package() copies dll.hpp + raros.hpp manually"
  - "CMake has no HarmonyOS platform module; SONAME flag workaround mirrors azure-core-cpp"
