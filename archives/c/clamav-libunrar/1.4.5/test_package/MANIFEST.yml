# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: clamav-libunrar/1.4.5
homepage: "https://www.clamav.net/"

# 上游测试套件存在性 (经审计官方源码包确认，见下方 upstream_test_audit)
upstream_tests_exist: false

# 上游测试审计 (源码: clamav-1.4.5 tag archive, sha256 afd91f024df9def18336069b9a6bf654b084574a3148bcd1da38a434f2b9434e)
upstream_test_audit:
  source_tarball: "clamav-1.4.5.tar.gz (GitHub tag archive clamav-1.4.5)"
  source_sha256: "afd91f024df9def18336069b9a6bf654b084574a3148bcd1da38a434f2b9434e"
  top_level_files:
    - libclamunrar/CMakeLists.txt  # 仅 add_library(clamunrar/clamunrar_static)，无 enable_testing/add_test/CTest 条目
    - libclamunrar/*.cpp           # 纯解码器实现源，无 TEST/TEST_F (gtest) / def test_ (pytest)
    - libclamunrar/dll.hpp         # 公共 C API 头，无测试桩
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / add_test / TESTS / check_PROGRAMS 目标"
    - "tests/ / test/ 目录"
    - "ctest / make check 目标"
  scan_result: "0 matches — libclamunrar/ 下无 tests/ 目录、无测试源文件、无任何测试目标；全树 tests 仅存在于顶层 unit_tests/"
  top_level_suite: "unit_tests/ 覆盖完整 libclamav 协议栈，需 Rust 工具链 + Libcheck + python pytest，与本独立 libclamunrar 包无关且在 OHOS 预检环境不可运行"
  reason: "libclamunrar 1.4.5 为纯解码器子目录，官方不提供独立测试套件；功能验证由 test_package 真实调用 UnRAR C API (RARGetDllVersion/RAROpenArchiveEx/RAROpenArchive/RARCloseArchive) 完成"

# 上游测试命令 (无独立测试套件，故 check 命令不适用；ctest -N 在 libclamunrar 子目录下发现 0 测试)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false，见上方审计)
# 上游无测试，真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的 API
test_package_tests:
  - file: test_clamav_libunrar.cpp
    description: "真实调用 UnRAR C API：版本号断言 + 缺失压缩包 Ex/ANSI 双路径 ERAR_EOPEN 错误码 + 失败句柄关闭"
    command: "./test_clamav_libunrar"
  - file: conanfile.py
    description: "Conan test() 入口，直接运行 ./test_clamav_libunrar 并输出 HMBS 机器证据标记 (test_package discovered=4/passedCount=4 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test_clamav_libunrar.cpp 的 4 个真实检查，与 HMBS_TEST_PACKAGE_RESULT discovered=4 一致)
assertion_count: 4
