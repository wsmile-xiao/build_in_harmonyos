# 版本级 manifest
# 文件位置: archives/c/cllayerinfo/2.3.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.3.3"

software: "cllayerinfo"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-12"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 OCL-dev/ocl-icd GitHub tag 归档；cllayerinfo 与 loader 同源码树）
  url: "https://github.com/OCL-dev/ocl-icd/archive/refs/tags/v2.3.3.tar.gz"

  # 源码校验和（实测下载计算所得）
  sha256: "8cd8e8e129db3081a64090fc1252bec39dc88cdb7b3f929315e014b75069bd9d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"

  # 编译依赖列表（格式: name/version）
  # 零运行时依赖：cllayerinfo 内联 loader 源码（Makefile.am: cllayerinfo_SOURCES
  # 含 $(libOpenCL_la_SOURCES)），只链接 libc/pthread。
  # automake/libtool 仅是构建工具（tool_requires）；生成 dispatch 表需要系统 ruby。
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本适配未新增任何补丁：全部差异靠构建期参数解决）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（每条附知识库编号；新增经验见 ref: E429 草稿）
knowledge_gained:
  - "cllayerinfo 与 ocl-icd 同源码树：GitHub tag 归档不含 configure，需 autoreconf 自举（ref: E178；与归档 archives/o/ocl-icd/2.3.5.1 同结论）"
  - "自带 config.guess 无法识别 HarmonyOS，需显式 --build/--host=aarch64-unknown-linux-ohos（ref: E007）"
  - "HMDFS 下 autoreconf/configure 产物继承 umask 077，包内文件 0600-0700 消费者读不到，构建/打包期显式 umask 022（ref: E011）"
  - "cllayerinfo 把 loader 源码编进自身二进制（Makefile.am: cllayerinfo_SOURCES 含 libOpenCL_la_SOURCES），故工具包无需 libOpenCL.so，避免与 archives/o/ocl-icd 重复同名 SONAME（ref: E429 草稿）"
  - "上游 make check 是原生 autotest 套件（tests/testsuite），计数只在日志汇总横幅（All N tests were successful.），无 # TOTAL: 块，解析器需兼容两种格式（ref: E429 草稿）"
  - "上游 tests/testsuite-standard.at 自带 cllayerinfo 层枚举用例（OPENCL_LAYERS + OCL_ICD_VENDORS），消费者测试可据此复刻：无 ICD 则无层（__initLayers 在 _num_icds==0 之后），必须同时提供 dummy ICD（ref: E429 草稿）"

