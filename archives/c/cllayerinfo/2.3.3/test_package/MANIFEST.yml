# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cllayerinfo/2.3.3
homepage: "https://github.com/OCL-dev/ocl-icd"

# 上游测试命令（autotest 套件由 make check 驱动；上游 tests/Makefile.am 的
# check-local 直接执行 tests/testsuite）
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序与用例
# 源码清点（v2.3.3 tag，AT_SETUP 计数）：
#   tests/testsuite-standard.at 12 + tests/testsuite-default-platform.at 16
#   + tests/testsuite-workaround.at 3 = 31 个用例
# 其中 tests/testsuite-standard.at:103 "Our dummy layer through cllayerinfo"
# 直接用 cllayerinfo 校验层枚举输出，是本包 test_package 的复刻来源。
upstream_tests:
  - file: tests/testsuite
    source: ocl-icd-2.3.3/tests/testsuite.at
    description: "上游 autotest 套件：31 个用例（standard 12 + default-platform 16 + workaround 3），覆盖 ICD vendors 枚举、默认平台选择、Intel workaround 与 cllayerinfo 层枚举"
    command: "make check"
  - file: ocl_test.c
    source: ocl-icd-2.3.3/ocl_test.c
    description: "上游自检程序：枚举平台并校验 ICD 加载流程（make check 的 check_PROGRAMS）"
    command: "./ocl_test"
  - file: ocl_test_icdl.c
    source: ocl-icd-2.3.3/ocl_test_icdl.c
    description: "上游自检程序：校验 clGetICDLoaderInfoOCLICD 扩展信息"
    command: "./ocl_test_icdl"

# test_package 中自带的测试（消费者视角验证：真实执行被测二进制）
test_package_tests:
  - file: test_layer.c
    description: "消费者测试：独立编译 dummy OpenCL 层（clGetLayerInfo/clInitLayer），经 OPENCL_LAYERS 注入后被 bin/cllayerinfo 枚举，断言输出含 CL_LAYER_API_VERSION: 100 与 CL_LAYER_NAME: dummylayer"
    command: "./bin/cllayerinfo（OPENCL_LAYERS=libtestlayer.so）"
  - file: test_icd.c
    description: "消费者测试配套 dummy ICD：写成 vendors/dummy.icd 并导出 OCL_ICD_VENDORS。ocl_icd_loader.c 在 _num_icds==0 时直接中止、根本不会读 OPENCL_LAYERS，故没有可用 ICD 就没有层（复刻上游同时导出 OPENCL_LAYERS 与 OCL_ICD_VENDORS 的做法）"
    command: "./bin/cllayerinfo（OCL_ICD_VENDORS=vendors）"

# 测试断言总数（上游用例 31 + 消费者用例 3）
# 消费者用例：1) 无 ICD 无层时工具正常退出；2) 有 ICD 无层时不得打印层信息；
# 3) 有 ICD 有层时必须打印该层 API 版本与名字
assertion_count: 34
