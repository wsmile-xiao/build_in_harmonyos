# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cgranges/0.1.1
homepage: "https://github.com/lh3/cgranges"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cd test && make && ./bedcov-cr test1.bed test2.bed"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test/Makefile EXE 目标, 全部运行 exit 0)
upstream_tests:
  - file: test/bedcov-cr.c
    source: cgranges-0.1.1/test/bedcov-cr.c
    description: "bedcov coverage (cgranges C 实现)"
    command: "./bedcov-cr test1.bed test2.bed"
  - file: test/bedcov-itree.cpp
    source: cgranges-0.1.1/test/bedcov-itree.cpp
    description: "bedcov coverage (IntervalTree.h 实现)"
    command: "./bedcov-itree test1.bed test2.bed"
  - file: test/bedcov-iitree.cpp
    source: cgranges-0.1.1/test/bedcov-iitree.cpp
    description: "bedcov coverage (IITree.h 实现)"
    command: "./bedcov-iitree test1.bed test2.bed"
  - file: test/bedcov-iitree.cpp
    source: cgranges-0.1.1/test/bedcov-iitree.cpp
    description: "bedcov coverage (IITreeBFS.h 实现, -D_USE_BFS)"
    command: "./bedcov-iitree-bfs test1.bed test2.bed"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 公开 API cr_init/cr_add/cr_index/cr_overlap/cr_contain"
    command: "./test_cgranges"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
