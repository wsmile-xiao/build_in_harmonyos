# test_package/MANIFEST.yml — upstream and consumer test declaration
package: campania/2.009
homepage: https://github.com/MarcSabatella/Campania

# Upstream distribution is a pure font resource package and has no executable test suite.
# All upstream-provided font formats are validated by the consumer test below.
upstream_test_in_build: false
upstream_tests: []

test_package_tests:
  - file: test_fonts.py
    description: "Validate OTF/TTF/WOFF containers, required OpenType tables, Unicode cmap coverage, OTF/TTF cmap parity, feature source wiring, GSUB/GPOS declarations, and OFL documentation"
    command: "python3 test_fonts.py <fonts-dir> <licenses-dir> <features-dir>"

assertion_count: 11
assertions:
  - "Verify exact OTF/TTF/WOFF package file set"
  - "Parse OTF SFNT directory and required tables"
  - "Parse TTF SFNT directory and required tables"
  - "Parse WOFF directory, compression, lengths, and required tables"
  - "Verify Campania input characters are covered by cmap"
  - "Verify OTF and TTF cmap codepoint parity"
  - "Verify all upstream OpenType feature source files are packaged"
  - "Verify Campania.fea includes classes, GSUB, and GPOS sources"
  - "Verify GSUB liga/calt feature declarations"
  - "Verify GPOS kern/symbol_spacing declarations"
  - "Verify LICENSE and README.md are packaged and non-empty"
