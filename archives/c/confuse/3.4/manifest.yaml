# 版本级 manifest — confuse 3.4
# 遵循 ARCHIVE-SPEC v2.0

version: "3.4"
software: "confuse"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/libconfuse/libconfuse/releases/download/v3.4/confuse-3.4.tar.xz"
  sha256: "36bfa3928f9c323914c7c8317e8722cb22f41db69d7c9d4c24b4689fa955445d"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--enable-static --disable-shared（R26 默认静态）"
    - "--disable-nls（OHOS 无宿主 gettext）"
    - "CONFIG_SHELL/SHELL 内联路由 /bin/sh（E386，见 notes）"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config-guess-ohos.patch"
  - "0002-config-sub-ohos.patch"

patch_classification:
  - file: 0001-config-guess-ohos.patch
    type: manual
    platform_only: True
    guard: 'pending'
  - file: 0002-config-sub-ohos.patch
    type: manual
    platform_only: True
    guard: 'pending'

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "autotools 包在 OHOS 设备本地构建的三连坑完整闭环：E386 getcwd（profile hnp bash → 内联 env 前缀手动 configure）+ config.sub 不识别 ohos 三元组（顶部短路放行，a52dec 手法）+ config.status umask 077 × HMDFS setgid（去除包裹，E011/E114）"
  - "设备 /tmp 只读使 musl tmpfile() 固定失败的 4 项上游用例（quote_before_print/print_filter/int_types/json_lists）为环境限制，25/29=86.2% 逐项归因申报"
  - "配方级 conan Environment 压不过 profile [buildenv]——需要覆盖 profile 环境时必须命令行内联 env 前缀"
