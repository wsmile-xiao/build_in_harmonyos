version: "3.0.1"
software: cpipe
status: built
build_date: "2026-09-11"
conan_ref: "cpipe/3.0.1"

source:
  url: "https://downloads.sourceforge.net/project/cpipe.berlios/cpipe-3.0.1.tar.gz"
  sha256: "99600737b9627251fc9caaac2413a0773c7172a7421fcba29926f821cfebe787"
  tar_format: tar.gz

build:
  system: makefile
  build_command: "make CC=<Conan C compiler> CFLAGS='-O2 -Wall -Wextra -Werror=format' -j1 cpipe"
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  target_os: OHOS
  target_os_version: "6.0"
  target_arch: armv8
  isolated_build_folder: true

artifacts:
  - "bin/cpipe"
  - "share/man/man1/cpipe.1"
  - "licenses/COPYING-2.0"

patches_applied:
  - "patches/0001-fix-size-t-format.patch"

tests:
  upstream:
    status: no_tests
    cases: 0
    reason: "Official source archive has no tests directory, test source, or Makefile check/test target"
  native_consumer:
    command: "test_package/test_cpipe_native.sh"
    cases: 4
    passed: 4
  harmonyos_specific:
    source: "test_package/test_cpipe_ohos.c"
    compile_assertions:
      - "__OHOS__ is defined"
      - "__aarch64__ is defined"
      - "sizeof(void*) == 8"
      - "little-endian target"
    static_assertions:
      - "packaged bin/cpipe has Unix executable permission"
      - "cpipe ELF e_machine is EM_AARCH64 (183)"
      - "probe ELF e_machine is EM_AARCH64 (183)"
      - "dynamic interpreter is /lib/ld-musl-aarch64.so.1"

verification:
  conan_create: "PASS — forced HarmonyOS 6.0 armv8 build and test_package completed"
  native_behavior: "PASS — 4/4 deterministic CLI cases"
  aarch64_elf: "PASS — cpipe and HarmonyOS probe are ELF64 AArch64"
  aarch64_runtime: "NOT RUN — available HarmonyOS VM is x86_64 and has no AArch64 emulator"

knowledge_gained:
  - "Upstream ships generated clig outputs but cmdline.cli has a newer timestamp; normalize timestamps before Make"
  - "The 64-bit target exposes a size_t/%u format mismatch; use the portable C99 %zu format"
  - "Windows HarmonyOS SDK clang can cross-compile from WSL when WSL absolute paths are translated for the Windows compiler"
  - "Build and package from Conan's per-build folder so compiler and build-setting variants cannot reuse source-tree objects"
