package: cpipe/3.0.1
homepage: "https://sourceforge.net/projects/cpipe.berlios/"

# Upstream test audit for the official cpipe-3.0.1.tar.gz archive:
# - the 16 shipped entries are source/generated documentation/metadata only;
# - there is no tests/ or test/ directory and no test source file;
# - the raw Makefile has build/install/clean/dist targets but no check/test target;
# - there is no CTest, Meson, Autotools test harness, pytest, or shell test runner.
upstream_tests_exist: false
upstream_test_audit: "Official cpipe-3.0.1.tar.gz (sha256 99600737b9627251fc9caaac2413a0773c7172a7421fcba29926f821cfebe787) contains .CVS-Versions, .cvsignore, .version, Brasfile, CHANGES, cmdline.c, cmdline.cli, cmdline.h, COPYING-2.0, cpipe.1, cpipe.c, cpipe.spec, dir.ttml, index.html.in, makefile, and README. It has no test directory or test source; its raw Makefile has no check/test target."
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_cpipe_native.sh
    description: "Four real CLI behavior cases: non-greedy passthrough, 1 KiB buffering, throughput stderr separation, and invalid-option rejection"
    command: "bash test_cpipe_native.sh /absolute/path/to/cpipe"
  - file: test_cpipe_ohos.c
    description: "HarmonyOS-only compile test requiring __OHOS__, __aarch64__, a 64-bit ABI, and little-endian byte order"
    command: "Built with the Conan HarmonyOS AArch64 CMake toolchain"
  - file: conanfile.py
    description: "Checks require executable permission, EM_AARCH64, and the musl AArch64 interpreter for the packaged cpipe; the probe must also be an AArch64 ELF"
    command: "conan create with os=OHOS, os.version=6.0, arch=armv8"

assertion_count: 13
