software: cpipe
display: "cpipe"
description: "Copy stdin to stdout while measuring pipe throughput"
category: utility
homepage: "https://sourceforge.net/projects/cpipe.berlios/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "HarmonyOS 6.0 release is restricted to armv8/AArch64"
    - "Raw Makefile uses the C compiler from Conan tools.build:compiler_executables and builds with -j1"
    - "Normalize shipped clig output timestamps so cmdline.c/cmdline.h/cpipe.1 are reused without clig"
    - "Fix the size_t printf format for the 64-bit AArch64 ABI"
    - "Upstream has no test suite; record no_tests evidence and run package-specific consumer checks"
  common_dependencies: []

versions:
  "3.0.1":
    status: built
    conan_ref: "cpipe/3.0.1"
