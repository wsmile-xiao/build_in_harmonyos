package: cpufrequtils/008
homepage: "http://www.kernel.org/pub/linux/utils/kernel/cpufreq/cpufrequtils.html"

upstream_check_command: "N/A: 上游纯 make 工程无 check/test 目标（顶层 Makefile 无 check 规则）"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
# N_static = 0 的清点证据见本文件顶部注释与 notes.md「上游测试清点」。

test_package_tests:
  - file: test_cpufrequtils.py
    description: "驱动包内 cpufreq-info/cpufreq-set 全部主要子命令，并编译运行一个真实 include + 链接 libcpufreq 的 C 消费者。"
    command: "python3 test_cpufrequtils.py <package_folder> <work_dir> <cc>"
  - file: consumer.c
    description: "libcpufreq 公共 API 消费者：cpufreq_cpu_exists / cpufreq_get_driver / cpufreq_put_driver / cpufreq_get_hardware_limits / cpufreq_get_transition_latency。"
    command: "<cc> -Wall -I<package>/include consumer.c -L<package>/lib -o <work>/cpufreq_consumer -lcpufreq && <work>/cpufreq_consumer"

assertion_count: 21
