quality_gates:
  # 本条原为 knowledge_gained 第 5 条，2026-10-06 按主理裁决 A 逐字移入（内容移位、文字一字未改）：
  # 它是本包能力面实测记录、不是知识库条目 —— knowledge/greps 查重 cpufreq·scaling·
  # sysfs.*Permission·non-root·假通过 全 0 命中（ENOSYS 仅 E051 且是 SIGSYS 无关）⇒ 无同症状条目、
  # 挂任何号都只能写「同族」⇒ 按「不硬凑」移出知识段。原句同时逐字保留在 notes.md §3。
  # knowledge_count 5→4 是内容移位，不是 rule4 意义的缩测试分母（测试分母 0/0/0 + 21 条 consumer 断言本轮未动）。
  capability_face: "OHOS 非 root 进程下 sysfs cpufreq 是分级可见面：cpuinfo_*/scaling_driver/scaling_available_governors 可读，scaling_cur_freq 与 scaling_available_frequencies 为 system:system 440 不可读，scaling_governor/scaling_min_freq/scaling_max_freq 连 stat 都 EACCES —— cpufreq-info -f 与 -p 因此 rc=234（-EINVAL 回绕）且零输出；-y 则 rc=0 但打印 18446744073709551578（cpuinfo_transition_latency 原值 0 → /proc/cpufreq 缺失回落 -ENOSYS 被 %lu 当数字），读不到 kernel 频率与 policy 是权限/平台面而非本包缺陷。"
  W0_dependencies: "零外部 Conan 依赖（preflight_check.sh 实测：未找到依赖声明 / 预检通过）"
  W1_source: "kernel.org 官方 tarball，sha256 4e9d9cd5…45a76，size 56119 B，顶层 56 条目 / 5 个 Makefile"
  W4_local: "conan-verify 与 finish W3 本地 CI 结果见 reports/ 与 .ci-result.json"
  R38_commands_json: "软件级 archives/c/cpufrequtils/commands.json 已按 R38 提交（其 4 段路径与 PF9 冲突属既有假阳性，见 notes.md「已知闸口」）"

