software: cpufrequtils
version: "008"
status: built
build_date: "2026-10-06"
build_system: makefile

source:
  url: "https://kernel.org/pub/linux/utils/kernel/cpufreq/cpufrequtils-008.tar.gz"
  sha256: "4e9d9cd5eb573d5b4c82bcb28a8b36f9ca8e780436bc78b1f90c404888445a76"
  tar_format: tar.gz
  size_bytes: 56119
  source_identity: "cpufrequtils 008 upstream archive on kernel.org (upstream README homepage)"

build:
  system: makefile
  configure_options:
    - 'make V=true NLS=false (CC/HOSTCC/AR/RANLIB/STRIP 由 tools.build:compiler_executables 提供)'
    - 'make 目标限定为 cpufreq-info cpufreq-set —— 不构建 cpufreq-aperf（x86 专用）'
    - 'CPPFLAGS 前置私有 include 目录，提供补齐声明的 libintl.h'
    - 'OHOS: LDFLAGS="-L/lib -l:ld-musl-aarch64.so.1"（取系统 musl 的真实 gettext 符号）'
  dependencies: []
  cc: clang
  targets_built:
    - libcpufreq.so.0.0.0
    - cpufreq-info
    - cpufreq-set
  targets_not_built:
    - cpufreq-aperf
  targets_not_built_reason: "x86 专用：utils/cpuid.h 的内联汇编带 \"=a\" 约束（aarch64 报 invalid output constraint），且运行期读 IA32 APERF/MPERF MSR 与 /dev/cpu/*/msr，aarch64/HarmonyOS 不存在该接口"

# 零补丁：conandata.yml 的 patches 为 {}，磁盘 patches/ 下 000*.patch 实测 0 个 ——
# 下面这个键必须保持空列表，才能与磁盘一致（finalize 的补丁数一致性检查按列表元素计数）。
# 四处适配全部落在配方 build()/package() 内，不改上游源码、不加平台宏（R8/PF5）。
patches_applied: []

knowledge_gained:
  - "OHOS sysroot 的 libintl.h 是 353 B 空壳（零函数声明）且 SDK 链接桩 libc.so 不导出 gettext/textdomain；系统 musl loader /lib/ld-musl-aarch64.so.1（SONAME libc.so）导出 ⇒ 私有声明头 + -L/lib -l:ld-musl-aarch64.so.1 取真实符号，零 conan 依赖、非桩函数。"  # ref: DRAFT-cpufrequtils-008-ohos-libintl-stub-musl-symbol-link
  - "本机无 install 二进制（E098）⇒ package() 按上游 install 布局手工 cp+chmod。"  # ref: E098
  - "上游 STRIPCMD（llvm-strip -s）会连 .codesign 段一起剥掉，被剥段的 ELF 在 OHOS 上 exec 报 EACCES(126) ⇒ package() 必须 strip 之后再 objcopy 摘占位段 + binary-sign-tool 重签 + chmod 0755。"  # ref: E077
  - "库 + CLI 混合包须声明 package_type=library 并在 package_info 里写 runenv_info，否则消费者 conanrun 无 PATH（M19 机制）。"  # ref: E221 + M19 通用池草稿 DRAFT-PKG-VER-lib-cli-tools-missing-from-consumer-runenv

upstream_tests:
  exists: false
  test_count: 0
  command: "N/A: 上游纯 make 工程，顶层 Makefile 无 check/test 目标"
