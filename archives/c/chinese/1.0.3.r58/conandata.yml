sources:
  url: "https://codeload.github.com/WhiredPlanck/chinese-calendar/tar.gz/593d89df7956253618da38e91891fb76516daf46"
  filename: "chinese-calendar-1.0.3.r58.tar.gz"
  sha256: "dd5d6fa429a21017f6f42cd45a35cc8bbb5e87482daea11ad03abbfb18ff193b"
patches:
  - patch_file: "patches/0001-qt6-qregular-expression.patch"
    patch_description: "Replace removed Qt5 QRegExp usage with Qt6 QRegularExpression."
    patch_type: "portability"
  - patch_file: "patches/0002-qt6-remove-qtextcodec-include.patch"
    patch_description: "Remove a Qt4-only QTextCodec include from the Qt6 build."
    patch_type: "portability"
  - patch_file: "patches/0003-qt6-remove-qdesktopwidget-include.patch"
    patch_description: "Remove an unused Qt5 QDesktopWidget include removed in Qt6."
    patch_type: "portability"
  - patch_file: "patches/0004-qt6-qualify-qtsql-includes.patch"
    patch_description: "Use QtSql-qualified headers for the split Qt6 SQL module."
    patch_type: "portability"
  - patch_file: "patches/0005-qt6-replace-qdesktopwidget-api.patch"
    patch_description: "Replace the removed QDesktopWidget API with QScreen."
    patch_type: "portability"
  - patch_file: "patches/0006-qt6-replace-calendar-qdesktopwidget-api.patch"
    patch_description: "Replace the calendar note window's removed QDesktopWidget API."
    patch_type: "portability"
  - patch_file: "patches/0007-qt6-replace-ccbo-qregexp.patch"
    patch_description: "Replace the CCBO environment filter's removed QRegExp API."
    patch_type: "portability"
