# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: c2x/2.42
homepage: "https://c2x.org.uk/"

# 上游测试命令 (c2x 的 Makefile 无 test/check 目标；唯一测试资产
# test_parser.c 是带编译说明的独立程序，由本适配在设备上手动编译执行)
upstream_check_command: "clang test_parser.c parse.c -lm -o test_parser && echo '1+2*3' | ./test_parser"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - "test_parser (standalone arithmetic-parser check, echo '1+2*3' | ./test_parser => 7.000000, rc 0)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_c2x.py
    description: "c2x 二进制行为验证：binary 存在性、-h 用法、无参数优雅报错、-V 版本与无 spglib 构建标识、CASTEP .cell→XSF 真实转换（晶格 5.43 与双 Si 原子断言）"
    command: "python3 test_c2x.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
