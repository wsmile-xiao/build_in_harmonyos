knowledge_gained:
  - "c2x 源码声明 C2XSF_VER \\\"2.42\\\"，官网页面文案标 2.42a（捆绑 spglib 2.0.2 的组合命名），包版本取源码真实版本 2.42"
  - "Makefile 硬赋值 CC=gcc/CFLAGS/DEFS/LDFLAGS/LIBS，全部用 make 命令行变量覆盖；DEFS/LDFLAGS/LIBS 置空即上游文档化的 no-SPGLIB 配置"
  - "上游 #else（无 SPGLIB）分支腐烂：bands_plot() 使用未声明的 j（SPGLIB 路径不用它），1 行声明补丁 0001-band_plot.c.patch 修复，平台无关"
  - "spglib 尚未发布到 ohpcd 制品仓（conan download 实测 0 条），c2x 先行按上游支持的无 spglib 配置发布；--bravais/--symmetry 等对称性功能在该配置下不可用（-V 如实输出 Not linked with spglib），spglib 适配后可出带 spglib 的后续版本"
  - "Makefile 无 install 目标（手动打包）；无 test 目标；唯一测试资产 test_parser.c 为带编译说明的独立程序，设备实测 1+2*3=7.000000 rc 0"
  - "c2x.org.uk 证书仅覆盖 www 子域，裸域 SSL 校验失败；官方下载 URL 用 https://www.c2x.org.uk/downloads/"
  - "OHOS 执行门控按二进制内容哈希放行：strip 会剥掉 clang 链接时嵌入的 ad-hoc .codesign 段导致 Operation not permitted（E077），打包禁止 strip"

