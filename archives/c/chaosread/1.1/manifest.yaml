software: chaosread
version: "1.1"
status: built
build_date: "2026-09-07"
build_system: makefile
conan_ref: "chaosread/1.1"

source:
  url: "https://launchpad.net/ubuntu/+archive/primary/+sourcefiles/chaosread/1.1-2/chaosread_1.1.orig.tar.gz"
  sha256: "47611f2b782ad62be619244d2c2e27b33c0821d836e89b0c3964548add5971e3"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "<conan-conf-c-compiler> -std=gnu99 -O2 -Wall -fcommon -o chaosread chaosread.c <libusb-flags> -lusb-1.0"
  dependencies: []
  cc: clang
  cxx: N/A
  notes:
    - "Upstream uses autotools; conanfile drives clang directly to avoid the configure cross-compile dance for a single .c file"
    - "config.h is generated in the build() step with only the PACKAGE / VERSION / RELEASE_DATE macros the source actually consumes"
    - "libusb-1.0 is vendored: the recipe fetches libusb-1.0.27 source from the libusb GitHub release (sha256-pinned) and builds a static libusb.a inline. This makes the recipe self-contained for the conan-verify G2 clean-build gate and sidesteps the conan-center libusb recipe's autotools build, which does not survive the OH cross-toolchain flag set."

patches_applied: []

test_results:
  type: official
  total: 2
  passed: 2
  failed: 0
  notes: "Upstream ships no tests; the recipe adds 2 L2 smoke tests (--version banner + --help option list), both verified locally under qemu-aarch64-static 6.2.0"

knowledge_gained:
  - "chaosread 1.1 is packaged from the Debian primary sourcefiles authority mirror because the upstream homepage https://git.keithp.com/chaosread only serves a git view, not a signed tarball"
  - "Upstream is autotools but only a single .c file (chaosread.c, 322 lines); recipe skips autogen.sh + configure and drives clang directly to keep the build deterministic on aarch64-linux-ohos"
  - "chaosread.c references PACKAGE / VERSION / RELEASE_DATE via config.h; the recipe writes a hand-rolled config.h with these three macros instead of running autoconf"
  - "chaosread 1.1 has zero upstream tests; the test_package uses --help + --version output as the smoke gate"
  - "The binary links libusb-1.0 and is a pure CLI tool, not a library, so no /lib or /lib64 system-name conflict"
