test_type: explicit
generators: [VirtualRunEnv]
settings:
  - os
  - arch
  - compiler
  - build_type

description: |
  Consumer tests for chaosread 1.1 Conan package on HarmonyOS PC.
  All 10 assertions are implemented in test.sh and dispatched from
  conanfile.py via `self.run(...)` (L0d compliance).  Bash is used
  because (a) it gives us native access to llvm-readelf / readelf for
  ELF/NX/PIE/NEEDED checks, and (b) it keeps the test logic in the
  same place (one file) instead of splitting between Python and shell.
  On dev machines where the aarch64 binary cannot run, conanfile.py
  gates with can_run() and emits a skip message; on the OH CI runner
  all 10 assertions execute.

upstream_tests:
  total: 0
  passed: 0
  notes: "Upstream ships no automated tests; chaosread is a CLI tool"

added_tests:
  total: 10
  cases:
    - name: "binary present + executable"
      type: "existence"
      validates: "G4"
    - name: "manpage present + non-empty"
      type: "existence"
      validates: "G4"
    - name: "ELF interpreter is OH musl loader (/lib/ld-musl-aarch64.so.1)"
      type: "platform"
      validates: "OH native runtime"
    - name: "NEEDED = libc.so only (G3 system-isolation)"
      type: "platform"
      validates: "G3 + L4"
    - name: "PIE enabled (Type=DYN + FLAGS_1=PIE)"
      type: "platform"
      validates: "L4 PIE"
    - name: "NX enabled (GNU_STACK is RW, no X)"
      type: "platform"
      validates: "L4 NX"
    - name: "manpage mentions 'chaosread'"
      type: "platform"
      validates: "G4 + discoverability"
    - name: "--version reports upstream date 2019-01-07"
      type: "consumer"
      validates: "L2 smoke (identity)"
    - name: "--help lists all 5 device flags"
      type: "consumer"
      validates: "L2 smoke (CLI surface)"
    - name: "invalid flag returns non-zero exit"
      type: "consumer (negative)"
      validates: "L2 smoke (error handling)"

test_package_tests:
  - file: test.sh
    description: "End-to-end consumer test runner: 10 assertions covering binary existence, ELF platform gates (musl interp / NEEDED / PIE / NX), manpage content, and CLI smoke (--version, --help, negative)."
    command: "bash test.sh"
