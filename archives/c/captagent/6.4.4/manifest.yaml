# 版本级 manifest — archives/c/captagent/6.4.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "6.4.4"
software: "captagent"

status: built
build_date: "2026-08-30"
build_system: autotools

source:
  url: "https://github.com/sipcapture/captagent/archive/refs/tags/6.4.4.tar.gz"
  sha256: "112b3ff0f806ed0a651fc8a8f60939f5f93443549f244549889e1034928ad379"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos（E007，build 必须 gnu）"
    - "tarball 无 configure → autoreconf -fi（tool_requires automake+libtool+pkgconf）"
    - "configure 内嵌 umask 077 → build() 内联 _drop_umask_077（E011/E114）"
    - "可选功能全部默认关闭（compression/ssl/epan/pcre/redis/tls/extramodules）"
  dependencies:
    - expat/2.8.2.1.1
    - libpcap/1.10.6
    - json-c/0.18
    - libuv/1.52.1
    - automake/1.18
    - libtool/2.5.4
    - pkgconf/3.0.5
    - flex/2.6.4
    - bison/3.8.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "captagent 是 C 应用（43 .c / 0 .cpp），官方任务标 C++ 是平台自动导入误判（版本 1.0.0 同样错误）——语言/版本字段不可信，以源码实测为准"
  - "configure.ac 硬性 AC_PROG_LEX(>=2.5.33)/AC_PROG_YACC 检查 → 应用类 autotools 需 tool_requires flex+bison（CI 无系统级）"
  - "libuv 是 captagent 无条件硬依赖（configure.ac 无开关守卫，useLIBUV=yes 默认）——适配前逐行读 configure.ac 查守卫，勿只信 README"
  - "tarball 无 configure → autoreconf -fi 后 configure 内嵌 umask 077（config.status 生成阶段）——_drop_umask_077 对 configure 文本替换即可（改 configure 生效，无需事后改 config.status）"
  - "上游无集成测试：tests/test_invariant_heptester.c 是孤儿源（依赖 Check 框架，未挂 Makefile.am）；make check 各目录 Nothing to be done——test_package 用 C 驱动 popen 执行 captagent -v/-h 断言真实输出（R34）"
  - "应用类安装布局：可执行在 sbin/（非 bin/）、模块 .so 在 lib/captagent/modules/、配置在 etc/captagent/——package_info.bindirs=['bin','sbin'] + runenv PATH 注入 sbin"

patch_generation:
  method: none
  source_orig_dir: /storage/Users/currentUser/builds/captagent-6.4.4.orig
