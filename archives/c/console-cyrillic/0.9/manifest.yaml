# 版本级 manifest — console-cyrillic 0.9
# 3-0 包：orig 上游（BDF 字体 + 5 工具脚本 + windows/x-window 文档）
# + debian 打包树（makeenc 2844 行 kmap 管线 + 7 布局 cpp + kazakh 子包
#   + 16 option-kmap + 8 screenmap + 9 trans + fallback + binary 字体 +
#   cyr 脚本 + 5 quilt 补丁）——两个 tarball 合并为源根
package: console-cyrillic
version: "0.9"
license: public-domain
homepage: https://salsa.debian.org/debian/console-cyrillic

# ---------- 源码 ----------
source:
  type: dual-tarball
  orig:
    url: https://deb.debian.org/debian/pool/main/c/console-cyrillic/console-cyrillic_0.9.orig.tar.gz
    sha256: bfa3e6e369fdc24a26024bbabc4cc4c9eaed3298fe47f0fa733d125f13ae1a76
  debian:
    url: https://deb.debian.org/debian/pool/main/c/console-cyrillic/console-cyrillic_0.9-18.debian.tar.xz
    sha256: 16bf10cb8cdbfaeb6d09d6e4cbab7019eeb0483070724cd550ca437b16501034
    note: >-
      debian 打包树版本特定（0.9-18 为 Debian pool 当前版本，含
      console-kazakh 0.2b 子包数据）；orig 与 debian 合并后
      debian/ 目录在源根一级（quilt 3.0 布局）

# ---------- 构建 ----------
build:
  type: data-packaging
  c_compilation: none
  steps:
    - "patch -p1 应用 5 个 quilt 补丁（dumppsf/1063834-showconsolefont/1063760-dumppsf-mode-1-3/1030816-disable-UTF-8-if--iutf8/bad-whatis-entry，/usr/bin/patch toybox 实测支持 git 格式 diff）"
    - "5 个 perl 脚本 shebang #!/usr/bin/perl[-w] → #!/usr/bin/env perl（-w 丢弃：OHOS env 不支持解释器后带参，实测 env perl -w exec 失败）"
    - "makeenc tmpfile /tmp/csrec.$$ → ${TMPDIR:-.}/csrec.$$（OHOS /tmp 只读）"
    - "kmap 生成：makeenc <enc> | cat - <cpp> | clang-cpp -iquote . -iquote - -P [-DIO] | sed | grep（12 布局 x 10 编码 = 120，clang-cpp 替代 cpp，工作目录 keymap/）"
    - "man：4 个 Pod::Man 从 pod 源生成（hnp perl 含 Pod::Man 实测 OK）+ 2 个 debian 预渲染 roff，全部 gzip"
    - "windows 文档 9 个：python3 codecs 6 编码 + utf-8；pt154/mik 黄金字节嵌入（iconv 缺 4 编码、debian pt154.acm 是哈萨克变体不可反查）"
  kmap_matrix:
    layouts: [ru, ru_ms, by, bg_bds, bg_phon, sr, mk, ua, ua_ms, mn, kaz_gost, kaz_alt]
    encodings: [unicode, rk1048, cp1251, ibm866, iso-8859-5, koi8-r, koi8-u, mac-cyrillic, mik, pt154]
    total: 120
    golden_check: "120/120 与 .deb 黄金 diff 0 差异（归一化构建日期/姓名/时间行）实测"
  cpp_paths:
    ru: keymap/cyr-russian.cpp
    ru_ms: keymap/cyr-russian-ms.cpp
    by: keymap/cyr-belarusian.cpp
    bg_bds: debian/cyr-bulgarian-bds.cpp
    bg_phon: debian/cyr-bulgarian-phon.cpp
    sr: debian/cyr-serbian.cpp
    mk: debian/cyr-macedonian.cpp
    ua: debian/cyr-ukrainian1.cpp
    ua_ms: debian/cyr-ukrainian-ms.cpp
    mn: debian/cyr-mongolian.cpp
    kaz_gost: debian/binary/console-kazakh-0.2b/keymap/cyr-kazakh.cpp
    kaz_alt: debian/binary/console-kazakh-0.2b/keymap/cyr-kazakh.cpp (+ -DIO)
  include_deps: >-
    4 个 cpp（ukrainian1/ukrainian-ms/macedonian/mongolian）include
    "macros.inc"，在 keymap/ 下——生成时 -iquote . 锚定 keymap/ 解析

# ---------- 依赖 ----------
dependencies:
  required:
    - kbd/2.9.0   # cyr 运行期调 loadkeys/dumpkeys/kbd-config（console-common 尚未合入，脚本对缺失工具 graceful 降级）
  system:         # 不声明（基础系统/hnp 提供）
    - gzip/zcat   # .deb 内预压缩数据解压（数据文件构建期已解压落位，运行期不依赖）
    - sed/awk/grep/cat
    - perl        # hnp /data/service/hnp/bin/perl
    - iconv       # windows 文档生成已改用 python3（iconv 缺 ibm866/mac-cyrillic/pt154/mik）

# ---------- 测试 ----------
upstream_tests:
  unit: 0
  integration: 0
  other: 0
  note: >-
    上游 0 测试用例：tarball 全树无 test/ 目录、debian/rules 无
    check/override_dh_auto_test 目标、Makefile 无 make check、无
    t/ 目录（实测核对 orig + debian 两 tarball 全文件清单）
  upstream_pass_rate: N/A (0/0)

test_package:
  unit: 0
  integration: 25
  note: >-
    test_console_cyrillic.sh：6 脚本落位/shebang 适配/136 kmap 落位
    （120 生成 + 16 option）/12 布局前缀/44 psf + PSF 魔数/8 sfm.gz/
    9 acm.gz/8 screenmap/9 trans/2 fallback.gz + 组合头行/6 man.gz/
    windows 文档/cyr 双分支 RC=2/displayfont RC=0/mkvgafont RC=1/
    raw2psf 功能 PSF1 魔数 36 04

# ---------- 知识 ----------
knowledge_gained:
  - category: L1
    content: "3-0 包的 conan source() 必须下载 orig + debian 两个 tarball 合并——kmap 管线（makeenc/unicodesyms/7 布局 cpp/kazakh 子包/option-kmap/screenmap/trans/fallback/binary 字体/5 补丁）全在 debian 树，orig 只有 BDF + 5 工具脚本"
    reason: "rules 构建引用 30+ 文件全部位于 debian/ 实测"
  - category: L1
    content: "makeenc（2844 行 bash+内嵌 perl）的 tmpfile 硬编码 /tmp/csrec.$$——OHOS /tmp 只读，须 ${TMPDIR:-.} 重定向；kmap 管线 cpp 在 OHOS 用 clang-cpp 等价替代（-iquote 双锚定：. 与 - 标准输入）"
    reason: "kmap 120/120 黄金对照 0 差异实测"
  - category: L1
    content: "OHOS env 不支持解释器后带参（env perl -w 实测 exec 失败）——shebang 适配一律 #!/usr/bin/env perl 丢弃 -w（仅开警告无副作用）"
    reason: "displayfont #!/usr/bin/perl -w 实测复现"
  - category: L1
    content: "debian 数据包的黄金文件校验法：解包官方 .deb，生成产物与 .deb 逐文件 diff（归一化构建日期/姓名行）——120 kmap 全量 0 差异可复现性证据，强于抽样断言"
    reason: "console-cyrillic 120/120 实测"

# ---------- 边界 / 未适配 ----------
boundaries:
  - "cyr 交互路径：读 /etc/console/cyr 配置 + 调 kbd-config/loadkeys/dumpkeys（kbd 已声明，console-common 尚未合入）——OHOS 无 Linux VT，脚本探测式降级"
  - "displayfont：探测 /dev/console 与 vt 状态 graceful 退出（无参 RC=0 实测）"
  - "mkvgafont：依赖 bdftopcf/compress（X tools，OHOS 无）——无参 RC=1 用法提示，BDF 源文本仍随 doc 落位"
  - "makeacm：依赖 perl Unicode::String 模块（hnp perl 未含，实测 No such module）——脚本落位可被有模块环境消费"
  - "windows 文档 pt154/mik：debian pt154.acm 是哈萨克变体（0x80→Җ）与 .deb 黄金字符集不符、OHOS iconv/python codecs 均无 pt154/mik——黄金 135B 静态字节嵌入配方目录"
  - "cyrillic-graph.fallback 的 console-data graph.fallback 段：console-data 尚无 conan 包——84 行黄金字节嵌入配方目录（graph.fallback），组合结果与 .deb 黄金 bit 级一致"
