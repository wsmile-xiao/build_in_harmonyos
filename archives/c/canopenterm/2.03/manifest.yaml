# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS Conan profile 设 CMAKE_SYSTEM_NAME=HarmonyOS，CMake 的 UNIX 为 OFF：上游以平台分支选源码时必须加 elseif(UNIX OR OHOS) 复用 linux 分支（首个 OHOS CMake 平台判定适配实例）"
  - "CMake ExternalProject 子构建不继承主工程 toolchain 文件：每个 ExternalProject_Add 必须显式传 -DCMAKE_TOOLCHAIN_FILE，否则 vendored 依赖按 host 架构编译"
  - "conan apply_conandata_patches 只作用于主源码：vendored 依赖的源码补丁须经 ExternalProject PATCH_COMMAND 脚本注入"
  - "bionic: <sys/socket.h> 必须先于 <linux/can.h>，否则 <linux/socket.h> 重定义 sockaddr_storage（CANvenient SocketCAN 驱动）"
  - "cmocka 1.1.7 __WORDSIZE 启发式只识别 x86_64/sparc，aarch64 上把 uintptr_t 定义成 32 位与 OHOS 冲突，补丁把 __aarch64__ 加进 64 位分支（纯特征检测，无平台宏）"
  - "交叉构建 ExternalProject 产物无 soname 符号链接：依赖方引用 unversioned .so 名并强制 plain DT_SONAME"

