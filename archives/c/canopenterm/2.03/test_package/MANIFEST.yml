package: canopenterm/2.03
homepage: "https://github.com/CANopenTerm/CANopenTerm"

upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "cmake -DBUILD_TESTS=ON && make run_unit_tests（ctest 注册 run_unit_tests；185 个 cmocka 用例，can_read/can_write 经 -Wl,--wrap 打桩；由 test_package 对打包产物执行；用例数 N 由 `N test(s) run` 动态解析）"
upstream_tests:
  - file: src/tests/run_unit_tests.c
    description: "上游 cmocka 单元测试套件（buffer/can/codb/dbc/dict/nmt/os/pdo/scripts/sdo/table/test_report/wrapper），共 185 例（src/tests/run_unit_tests.c 内 cmocka_unit_test() 注册数，与 test_*.c 函数定义一一对应）；test_package 第 4 步以包内 share/canopenterm 副本为工作目录运行打包后的 run_unit_tests"
    runner: "test_canopenterm.sh (step 4)"

test_package_tests:
  - file: test_canopenterm.sh
    description: "消费测试: 产物完整性(9 项) + 共享库 SONAME(3) + codb2json usage 冒烟 + CANopenTerm -p 启动存活冒烟(进程捕获 SIGTERM，后台启动+存活判定+kill -9) + 上游 185 例单元测试对打包产物执行并校验 PASSED==run（N 由 `N test(s) run` 动态解析）"
    command: "bash test_canopenterm.sh"

assertion_count: 19
