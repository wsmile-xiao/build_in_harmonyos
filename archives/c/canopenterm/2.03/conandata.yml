# conandata.yml — canopenterm 2.03
# 官方来源: GitHub tag v2.03 发布 tarball, 顶层目录 CANopenTerm-2.03/
# sha256: 官方发布 tarball 实测值
sources:
  # codeload.github.com 是 GitHub 官方 archive 端点的 CDN 直链（与
  # github.com/.../archive/refs/tags/v2.03.tar.gz 重定向后同源同哈希，
  # 跳过主域名 302 跳转以提升下载稳健性）
  url: "https://codeload.github.com/CANopenTerm/CANopenTerm/tar.gz/refs/tags/v2.03"
  # 显式 filename: codeload 直链 URL 无 .tar.gz 后缀，conan get() 会按 zip 推断解压
  filename: "CANopenTerm-2.03.tar.gz"
  sha256: "46180a190bc64d3ca8779cdaf7855667c847ee6f51551a957c5bccd1287b1445"

patches:
  # 顶层项目补丁 (conan 在源码根上应用)
  - patch_file: "patches/canopenterm-2.03/0001-CMakeLists.txt.patch"
    patch_description: "OHOS adaptation: set OHOS when CMAKE_SYSTEM_NAME matches HarmonyOS/OpenHarmony; reuse upstream linux platform sources (elseif(UNIX OR OHOS)); omit Windows-only icon.rc on OHOS (CONSOLE_ICON)"
    patch_type: "portability"
  - patch_file: "patches/canopenterm-2.03/0002-cmake-codb2json.cmake.patch"
    patch_description: "OHOS adaptation: codb2json target uses CONSOLE_ICON (empty on OHOS) instead of the Windows-only icon.rc"
    patch_type: "portability"
  - patch_file: "patches/canopenterm-2.03/0003-cmake-os_linux.cmake.patch"
    patch_description: "OHOS adaptation: propagate CMAKE_TOOLCHAIN_FILE to all 8 ExternalProject dep builds (cJSON/CANvenient/pocketpy/inih/isocline/Lua/SDL3); link readline/history only on Linux (not available on OHOS, isocline provides its own line editor); reference unversioned libcjson.so on OHOS (no soname symlinks in cross build) and disable cJSON so-versioning; force plain DT_SONAME on cJSON/CANvenient/SDL3; wire dep PATCH_COMMAND scripts"
    patch_type: "portability"
  - patch_file: "patches/canopenterm-2.03/0004-cmake-patch_sdl3.cmake.patch"
    patch_description: "new: CMake script applying the SDL3 OHOS patches (patches/sdl3-3.4.12/) from the SDL3 ExternalProject PATCH_COMMAND"
    patch_type: "portability"
  - patch_file: "patches/canopenterm-2.03/0005-cmake-patch_canvenient.cmake.patch"
    patch_description: "new: CMake script applying the CANvenient OHOS patches (patches/canvenient-1.02/) from the CANvenient ExternalProject PATCH_COMMAND"
    patch_type: "portability"
  - patch_file: "patches/canopenterm-2.03/0006-cmake-patch_cmocka.cmake.patch"
    patch_description: "OHOS adaptation: patch_cmocka.cmake now applies patches/cmocka-1.1.7/0001-include-cmocka.h.patch so cmocka's __WORDSIZE heuristic (x86_64/sparc only) does not redefine uintptr_t as 32-bit on aarch64 OHOS"
    patch_type: "portability"
# 注意: patches/canvenient-1.02, patches/sdl3-3.4.12, patches/cmocka-1.1.7
# 共 8 个依赖源码补丁不在此列表——它们由 conanfile export_sources 随源码分发到
# <source_root>/patches/，构建时经 ExternalProject PATCH_COMMAND 脚本
# (cmake/patch_canvenient.cmake / patch_sdl3.cmake / patch_cmocka.cmake) 应用。
