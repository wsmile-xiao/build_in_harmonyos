# test_package/MANIFEST.yml
# 上游官方测试声明文件 (cppp-reiconv 3.0.0)
# 上游测试统计: ctest 全量 141 项 (双口径台账见回报)

package: cppp-reiconv/3.0.0
homepage: "https://github.com/cppp-project/cppp-reiconv"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (双口径: 源码声明 141 = 138 test() 宏 + 3 add_test; ctest 注册 141; 实际运行 141/141 通过)
upstream_tests:
  - file: tests/check-encoding.cpp
    source: cppp-reiconv-3.0.0/tests/check-encoding.cpp
    description: "编码校验主程序 (逐个编码表验证)"
    command: "./check-encoding"
  - file: tests/test-bom-state.cpp
    source: cppp-reiconv-3.0.0/tests/test-bom-state.cpp
    description: "BOM 状态机测试"
    command: "./test-bom-state"
  - file: tests/test-discard.cpp
    source: cppp-reiconv-3.0.0/tests/test-discard.cpp
    description: "DISCARD_ILSEQ 丢弃非法序列测试"
    command: "./test-discard"
  - file: tests/check-stateful.cpp
    source: cppp-reiconv-3.0.0/tests/check-stateful.cpp
    description: "有状态编码校验 (以编码名为参数, ctest 注册 27 项)"
    command: "./check-stateful <data_dir> <encoding>"
  - file: tests/check-stateless.cpp
    source: cppp-reiconv-3.0.0/tests/check-stateless.cpp
    description: "无状态编码校验 (以编码名为参数, ctest 注册 111 项)"
    command: "./check-stateless <data_dir> <encoding>"
  - file: tests/sort.cpp
    source: cppp-reiconv-3.0.0/tests/sort.cpp
    description: "测试数据排序工具 (GB18030 数据生成)"
    command: "./sort <in> <out>"
  - file: tests/data-generator.cpp
    source: cppp-reiconv-3.0.0/tests/data-generator.cpp
    description: "测试数据生成器 (UTF-8/GB18030 增量测试数据)"
    command: "./data-generator <encoding>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 真实 C API 转换往返 (UTF-8<->UTF-16LE, GB18030 lookup)"
    command: "./test_cppp-reiconv"

# 测试断言总数 (141 ctest 用例通过 + 消费者 6 项断言)
assertion_count: 147