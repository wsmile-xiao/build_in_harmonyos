software: coin
display: "Coin"
description: "Coin3D core — Open Inventor 2.1 API 的高层 3D 可视化场景图库（OpenGL 渲染）。注意与 COIN-OR 数值优化套件只是同名，完全无关"
category: gfx
homepage: "https://coin3d.github.io"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS 无桌面 libGL：必须依赖 gl4es（libGL.so），OPENGL_gl_LIBRARY 指向其产物"
    - "COIN_BUILD_GLX=OFF（无 X11）；COIN_BUILD_EGL 走 sysroot libEGL.so"
    - "运行时需 LIBGL_GLES=/system/lib64/libGLESv3.so、LIBGL_EGL=/system/lib64/libEGL.so（runenv_info 已定义）"
    - "SoDB::finish() 在 gl4es 栈下析构 GL glue 时 SIGSEGV（已知问题，不调即干净退出）"
  common_dependencies:
    - gl4es

versions:
  "4.0.10":
    status: built
    build_date: "2026-09-09"
    conan_ref: "coin/4.0.10"
