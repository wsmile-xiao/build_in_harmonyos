version: "4.0.10"

# published | built | failed | archived
status: built
build_date: "2026-09-09"
conan_ref: "coin/4.0.10"

source:
  url: "https://github.com/coin3d/coin/releases/download/v4.0.10/coin-4.0.10-src.tar.gz"
  sha256: "13fe68831292e7e725e7db1c6909d2b4fe5802080474c229fcac14ddf6445188"
  tar_format: tar.gz

build:
  system: cmake
  build_system: cmake
  configure_options:
    - "-DCOIN_BUILD_GLX=OFF"
    - "-DCOIN_BUILD_TESTS=OFF"
    - "-DCOIN_BUILD_EXAMPLES=OFF"
    - "-DCOIN_USE_CPACK=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DOPENGL_INCLUDE_DIR=<sysroot>/usr/include"
    - "-DOPENGL_gl_LIBRARY=<gl4es>/lib/libGL.so"
  dependencies:
    - gl4es/1.1.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS 无桌面 libGL，Coin 静态引用定点管线符号（glMatrixMode/glBegin 等），须链 gl4es 的 libGL.so"
  - "SoDB::finish() 在 gl4es 栈下析构 GL glue 时 SIGSEGV，进程退出不调用即可干净结束"
  - "上游 cmake_minimum_required(3.0...3.31) 兼容 cmake 4.x，本版本零源码补丁"
  - "zlib/bzip2/freetype 等运行时 dlopen（*_RUNTIME_LINKING 默认 ON），无 libz.so 也能构建"
