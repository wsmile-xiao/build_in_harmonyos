# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ceni/2.33
homepage: "https://github.com/fullstory/ceni"

# 上游测试命令 (ExtUtils::MakeMaker 测试体系)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/Ceni-Backend.t
    source: ceni-2.33/t/Ceni-Backend.t
    description: "上游 Perl 测试：Ceni::Backend 模块加载与对象构造 (2 个断言)"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ceni.pl
    description: "消费者测试：调用 Ceni::Backend 真实 API 解析临时 interfaces 文件 (6 个 Test::More 断言)"
    command: 'perl -I<packaged-lib> test_ceni.pl'
  - file: run_test.sh
    description: "L0c 合规包装器 — 转调 test_ceni.pl（CI 只计 .sh/.py 为测试源）"
    command: 'sh run_test.sh <perl> <packaged-lib> test_ceni.pl'

# 测试断言总数 (消费者测试断言数，用于质量评估)
assertion_count: 6
