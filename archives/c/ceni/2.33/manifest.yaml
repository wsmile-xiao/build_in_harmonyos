software: ceni
version: "2.33"
status: built
build_date: "2026-09-09"
build_system: perl-makefile
conan_ref: "ceni/2.33"

source:
  url: "https://github.com/fullstory/ceni/archive/refs/tags/debian/2.33.tar.gz"
  sha256: "5eb268f78b3a38c5a888da1ad3afc615610e0aa0b033e71fff75f2b3ec0aa335"
  tar_format: tar.gz

build:
  system: perl-makefile
  configure_options:
    - "perl Makefile.PL PREFIX=/"
    - "make -j1"
    - "make test"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-lib-Ceni-Backend-pm.patch"

artifacts:
  modules:
    - Ceni/Backend.pm
  scripts:
    - bin/Ceni
    - bin/nicinfo
    - bin/Ceni_read_config
    - bin/Ceni_write_config
    - bin/wpa_cli_scan.pl

knowledge_gained:
  - "纯 Perl 应用使用 ExtUtils::MakeMaker 构建系统 (perl Makefile.PL PREFIX=/ + make install DESTDIR)"
  - "Expect 仅用于 wireless_scan 的 wpa_cli 交互会话，懒加载后解析器与上游单测不依赖 libexpect-perl"
  - "上游测试为 t/Ceni-Backend.t 的 2 个 Test::More 断言，通过 make test 在 build() 内真实执行"
