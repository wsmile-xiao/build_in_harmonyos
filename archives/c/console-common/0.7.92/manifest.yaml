# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - category: L1
    content: "Debian native 纯脚本包（Makefile 无编译段、仅 sed 模板展开 + install）的 OHOS 适配模式：console-common 构建期只有两处 sed——dh_consoledata.in 的 @DHDIR@/@KMAPDIR@/@LCDDEP@ 占位替换、getkmapchoice.pl.in 的 /#####COMMON####$/ r common.pl 标记行后插入——conanfile package() 用 python str.replace 与行级标记插入等价复刻，零 shell 依赖；其中 @LCDDEP@ 版本号上游经 dpkg-parsechangelog 取（Debian 构建工具链，OHOS 无配方），直接取 conanfile version 硬编码即可，无需声明构建期依赖"
    reason: "上游 Makefile 两处 sed 规则全文核对 + conanfile 等价实现 + conan create 实测"
  - category: L1
    content: "sh/perl 控制台脚本包运行期外部命令归属核实：install-keymap 调 loadkeys/fgconsole/dumpkeys（kbd 包）、tempfile（debianutils 包）、dpkg --print-architecture（dpkg 包）→ 三者均已归档（kbd/2.9.0、debianutils/5.23.2、dpkg/1.23.7）声明 requires；gzip/awk/diff/md5sum 为 OHOS 基础系统工具（toybox/busybox）不声明；console-data（键图数据 + debconf 问题源）未归档 → keymap 交互声明路径记环境边界不宣称已适配"
    reason: "install-keymap/kbd-config/config.in 脚本 system()/backtick 调用全文核对 + 已发布配方清单核对"
  - category: L1
    content: "debconf 客户端脚本（use Debconf::Client::ConfModule / Debian::Debhelper::Dh_Lib）在 OHOS 无法 perl -c 语法校验（模块未提供）——此类脚本的可用断言止步于落位/shebang/0755 可执行位，不能升级为编译可解析断言；而纯 sub 定义片段（common.pl，无 use 语句）可独立 perl -c syntax OK，两者要区分对待"
    reason: "config.in/getkmapchoice.pl.in/dh_consoledata.in use 语句核对 + common.pl perl -c 实测"
  - category: L1
    content: "sh 脚本确定性退出码分支作为 CI 冒烟断言点：install-keymap 的 --help（exit 0）/无参（exit 1 + Usage）/NONE（exit 0）三分支均在任何外部命令与文件系统操作之前触发（--help/无参检查先于 keymap 解析，NONE 先于 fgconsole/loadkeys/tempfile）——非 root CI 下可实跑的确定性行为，不触达虚拟终端路径（fgconsole/loadkeys 需真实 VT，OHOS 无）"
    reason: "install-keymap 前 30 行分支顺序全文核对 + 本地非 root 实跑三分支退出码实测"
