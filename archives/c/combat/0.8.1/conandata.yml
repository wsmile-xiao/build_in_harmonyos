# conandata.yml — combat 0.8.1
# 上游原站归档仅 HTTP 且证书 SAN 不匹配，采用 Debian 源码池的同一 orig 归档
# （SHA256 与 Scout 阶段本机下载核验一致，设备侧复核一致）。

sources:
  "0.8.1":
    url: "https://deb.debian.org/debian/pool/main/c/combat/combat_0.8.1.orig.tar.gz"
    sha256: "1923fa19f55a03f720f0444d6edffe7dad246c2c4be82453b8d2c5b4922d99a8"

patches:
  "0.8.1":
    - patch_file: "patches/0001-insert-tclsh-8.6-probe.patch"
      patch_description: "sh/Tcl 双语包装脚本插入 tclsh8.6 解释器探测分支（上游硬编码 tclsh8.5，设备 Tcl 运行时为 8.6）"
      patch_type: "portability"
    - patch_file: "patches/0002-orb-combat-bundled-itcl.patch"
      patch_description: "combat.tcl 加载 Itcl 前优先发现随包分发的 orb/itcl/ 目录（设备 tcl 包的 Itcl 缺少库脚本索引）"
      patch_type: "portability"
    - patch_file: "patches/0003-tclkill-generic-kill-so.patch"
      patch_description: "tclkill 包索引优先加载随包编译的通用 kill.so（归档自带 kill-linux-x86.so 为 i386，aarch64 不可用，由 recipe 用设备 clang + Tcl stubs 编译）"
      patch_type: "portability"
