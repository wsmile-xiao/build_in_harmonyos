# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: combat/0.8.1
homepage: "http://www.fpx.de/Combat/"

# 上游测试命令（test/1..11，tcltest 框架 + 本机 IIOP 回环，可离线；
# 上游 test/Makefile 的 TESTDIRS 即排除 8 与 9）
upstream_check_command: "make -C test test"

# conanfile.py build() 方法中是否已集成上游测试
# combat 上游测试需以 IIOP 回环运行完整 ORB（客户端/服务端双 tclsh 进程），
# 由移植流程在设备上单独真实执行并保留逐目录日志（见版本级 notes.md 与
# 上游测试记录），不在 conan build() 内运行。
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试列表
upstream_tests:
  - file: test/
    source: combat-0.8.1/test/
    description: "官方 tcltest 套件 test/1,2,3,4,5,6,7,10,11（8=上游未实现 DSI，9=需外部 NamingService；test/README.txt 记载已知失败 ptypes-1.3/2.3/3.3/4.3、unions-1.4）"
    command: "cd test/N && ./dotest（patch 后由 tclsh8.6 执行）"

# test_package 中自带的测试（消费者视角验证打包产物）
test_package_tests:
  - file: test_combat.tcl
    description: "真实 IIOP 回环：加载打包 lib/combat 与 lib/tclkill，spawn CORBA server 子进程，客户端 string_to_object 后做 long 属性写读往返（42 / -1234567），并用 kill 扩展回收服务端"
    command: "tclsh8.6 test_combat.tcl <orb_dir> <tclkill_dir>"

# 断言数: test_combat.tcl 输出 4 行 PASS；上游 9 个目录约 300 个 tcltest 用例
# 由移植流程在设备上单独执行（PASS/FAIL 明细入 notes.md / 测试日志）
assertion_count: 4
