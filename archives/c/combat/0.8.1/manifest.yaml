# 版本级 manifest — combat 0.8.1
version: "0.8.1"
software: "combat"
status: built
build_date: "2026-09-11"
conan_ref: "combat/0.8.1"

source:
  url: "https://deb.debian.org/debian/pool/main/c/combat/combat_0.8.1.orig.tar.gz"
  sha256: "1923fa19f55a03f720f0444d6edffe7dad246c2c4be82453b8d2c5b4922d99a8"
  tar_format: tar.gz

build:
  system: custom
  # 纯 Tcl 包无构建系统：目录拷贝打包 + recipe 内 clang 编译 tclkill 扩展
  configure_options: []
  dependencies:
    - tcl/8.6.16
  cc: clang

patches_applied:
  - "0001-insert-tclsh-8.6-probe.patch"
  - "0002-orb-combat-bundled-itcl.patch"
  - "0003-tclkill-generic-kill-so.patch"

knowledge_gained:
  - "combat 0.8.1 归档不含 tcl++：Itcl 是事实硬依赖，无 Itcl 时 package require combat 直接失败"
  - "tcl/8.6.16 已发布包的 lib/itcl4.3.2/ 只有 .so/.a（其 recipe 按 *.so*/*.a 通配拷贝），Itcl_Init 必需的 itcl.tcl 缺失，裸 load 报 Can't find a usable itcl.tcl"
  - "Itcl_Init 按编译期前缀查库脚本，随包分发需设 ITCL_LIBRARY 指向脚本目录（在生成的 pkgIndex.tcl 内设置，消费者零配置）"
  - "tcl_platform(os)=HarmonyOS、machine=aarch64，上游 tclkill pkgIndex 平台探测算出的预编译名（kill-h-aarch64.so）不存在，补丁加通用 kill.so 分支"
  - "corba::init 支持 -ORBHostName；IIOP 回环测试服务端固定 127.0.0.1，规避设备主机名解析差异"
  - "上游 test/1..11 为 tcltest + 本机 IIOP 回环，可离线运行；已知失败（test/README.txt）：ptypes-1.3/2.3/3.3/4.3、unions-1.4（范围检查未实现）"
