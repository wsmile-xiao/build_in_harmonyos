software: combat
display: "Combat"
description: "Combat — CORBA Scripting with Tcl，纯 Tcl 实现的 CORBA ORB（含 idl2tcl/iordump 工具）"
category: network
homepage: "http://www.fpx.de/Combat/"
license: TCL
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Tcl 包：orb/*.tcl 目录拷贝安装（无 configure/make），打包为 lib/combat/ 与 lib/tclkill/"
    - "bin/idl2tcl、bin/iordump 为 sh/Tcl 双语包装脚本，上游硬编码 tclsh8.5，patch 插入 tclsh8.6 探测分支"
    - "Itcl 是事实上的硬依赖（0.8.1 归档无 tcl++ 回退物）；tcl/8.6.16 已发布包缺 Itcl 库脚本，由本包补齐 lib/combat/itcl/ 并在 pkgIndex 内设置 ITCL_LIBRARY"
    - "唯一 C 代码 tclkill/kill.c 由 recipe 用设备 clang + Tcl stubs 编译为通用 kill.so；归档自带 kill-linux-x86.so 仅 i386 不可用"
    - "IIOP 回环依赖 loopback TCP 与可写工作目录（.ior 文件）"
  common_dependencies:
    - tcl

versions:
  "0.8.1":
    status: built
    build_date: "2026-09-11"
    conan_ref: "combat/0.8.1"
