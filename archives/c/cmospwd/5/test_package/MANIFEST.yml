# test_package/MANIFEST.yml
# CI L0e requires this file; HMBS requires an explicit upstream audit for no_tests.

package: cmospwd/5
# Task-card version directory is 5; the exported Conan reference is cmospwd/v5
# because conan 2.x rejects one-character versions (see 5/conanfile.py docstring).
conan_ref: "cmospwd/v5"
homepage: "https://www.cgsecurity.org/wiki/CmosPwd"

upstream_tests_exist: false
upstream_test_audit:
  source_tarball: "cmospwd-5.0.tar.bz2"
  source_sha256: "97f48eb0770b7341e267c65bf40f145c08fc000a2387b9af920287e662c2ef32"
  version_note: >-
    The platform task asks for cmospwd 5. Upstream has no repository and no tag:
    the only 5.x artifact is cmospwd-5.0.tar.bz2 and the program banner prints
    "CmosPwd - BIOS Cracker 5.0". 5 and 5.0 are the same upstream release bytes,
    verified by the sha256 above, so no different source is claimed here.
  top_level_files:
    - src/cmospwd.c      # 2160-line single-file CMOS decode implementation, no TEST()/TEST_F/def test_
    - src/Makefile       # 5 lines: variables plus the single target 'cmospwd: cmospwd.c'
    - src/cmospwd        # prebuilt x86 binary shipped by upstream, not a test harness
    - src/ioperm-0.4-patched/   # vendored ioperm kernel-module sources (admin/install.c, ioperm.c, uninstall.c)
    - cmospwd.txt        # usage documentation
    - COPYING            # GPL-2.0 text
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile check/test target"
    - "tests/ / test/ / spec/ / t/ directory"
    - "ctest / meson test / make check target"
  scan_result: "0 matches -- src/Makefile carries exactly one build target and the tree holds one C file plus vendored ioperm module sources; no test framework, no test directory"
  make_check_output: "make -n check => make: *** No rule to make target 'check'.  Stop. (exit 2, measured on the HarmonyOS aarch64 device)"
  reason: "cmospwd 5 is a single-file x86 CMOS tool; the upstream tarball ships no test suite, its Makefile has only the build target, and no check/test target or tests directory exists"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_cmospwd.c
    description: "packaged artifacts: bin/cmospwd executable, licenses/COPYING, licenses/cmospwd.txt"
    command: "access()/stat() on the installed package folder"
  - file: test_cmospwd.c
    description: "usage path: unknown option prints the option table, exits 0, banner self-labels 5.0"
    command: "cmospwd --help"
  - file: test_cmospwd.c
    description: "file-backed decode: 128-byte zeroed backup through -l ... -m1 (load_backup size branch, module dispatch, keyboard layout default)"
    command: "cmospwd -l cmospwd_zero128.bin -m1"
  - file: test_cmospwd.c
    description: "-m digit-mask semantics: -m2 runs nothing, -m01 runs module 2 only, -m11 runs modules 1 and 2, -kfr switches layout"
    command: "cmospwd -l cmospwd_zero128.bin -m2 | -m01 | -m11 | -m1 -kfr"
  - file: test_cmospwd.c
    description: "known-plaintext decode 1: 512-byte backup with 0x82,0x84 at 0x100 is recovered as [AB] by ALGO_ACER (shr 1, AFF_ASCII)"
    command: "cmospwd -l cmospwd_acer512.bin -m1"
  - file: test_cmospwd.c
    description: "known-plaintext decode 2: 128-byte backup (0x60=0, 0x61=2, 0x62=0x21, 0x63=0x22) is recovered as [AB] by ALGO_PHOENIX_ADD (+0x20) in module 19"
    command: "cmospwd -l cmospwd_phx128.bin -m0000000000000000001"
  - file: test_cmospwd.c
    description: "negative control: the phoenix vector decoded through acer's offsets yields no [AB], so the two plaintext cases cannot pass by echoing"
    command: "cmospwd -l cmospwd_phx128.bin -m1"
  - file: test_cmospwd.c
    description: "error path: unreadable backup reports 'Unable to read' and exits non-zero"
    command: "cmospwd -l cmospwd_missing.bin -m1"
  - file: test_cmospwd.c
    description: "HarmonyOS PC specific: with no x86 I/O ports the aarch64 build of the portability patch exits non-zero and points the user at -l/-r backup files"
    command: "cmospwd (direct CMOS access, non-x86 branch)"

assertion_count: 24
