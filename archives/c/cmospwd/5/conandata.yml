# conandata.yml for cmospwd 5 (CMOS/BIOS password recovery tool)
#
# Version key note: the platform task asks for "cmospwd 5". Upstream ships a
# single release for that line, cgsecurity.org/cmospwd-5.0.tar.bz2, and the
# program banner self-labels "CmosPwd - BIOS Cracker 5.0". "5" and "5.0" are
# therefore the same upstream artifact; the recipe keeps the task's version key
# and does NOT invent a separate source. sha256 below was computed locally from
# the downloaded tarball and matches the one already recorded in this repo for
# archives/c/cmospwd/5.0.

sources:
  url: "https://www.cgsecurity.org/cmospwd-5.0.tar.bz2"
  sha256: "97f48eb0770b7341e267c65bf40f145c08fc000a2387b9af920287e662c2ef32"

patches:
  - patch_file: "patches/0001-cmospwd-c-aarch64-portability.patch"
    patch_description: "Gate x86 port I/O and ioperm behind __i386__/__x86_64__, no-op stubs elsewhere"
    patch_type: "portability"
