patches_applied:
  - "0001-cmospwd-c-aarch64-portability.patch"

knowledge_gained:
  - "cmospwd 5 is a single-file x86 CMOS tool with no test suite; src/Makefile has one target only"
  - "Conan 2.x rejects a one-character version (RecipeReference pattern in conan/api/model/refs.py needs >=2 chars), so the task-card directory stays 5 while set_version() names the artifact cmospwd/v5, as already merged for cronic/3 and rapidhash/3"
  - "aarch64 needs arch-gated stubs for outb/inb and ioperm; the file-backed decode path (-l/-m) stays testable without hardware"
  - "-m is a digit mask over tbl_func, not a module number: '-m2' runs nothing, '-m01' runs module 2, so a decode test writes one '1' per module index"
  - "known-plaintext decode vectors make the consumer test assert real algorithm output: ALGO_ACER (shr 1 at 0x100) and ALGO_PHOENIX_ADD (+0x20 at 0x62, length from cmos[0x61]) both recover 'AB'"
