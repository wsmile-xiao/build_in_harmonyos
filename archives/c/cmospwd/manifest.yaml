software: cmospwd
display: "CmosPwd"
description: "CMOS/BIOS password recovery and backup tool"
category: utility
homepage: "https://www.cgsecurity.org/wiki/CmosPwd"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "x86 port I/O is stubbed on aarch64; hardware access exits with guidance"
    - "Backup-file decode (-l/-r/-m) is the supported path on HarmonyOS PC"
    - "Upstream has no test suite; coverage comes from test_package file-decode tests"
  common_dependencies: []

versions:
  "5.0":
    status: built
    build_date: "2026-09-09"
    conan_ref: "cmospwd/5.0"
  # The task card asks for 5, which is the same upstream release as 5.0 (upstream
  # publishes no separate "5" artifact). Conan rejects one-character versions, so the
  # archive directory keeps 5 while the artifact is cmospwd/v5 - same shape as the
  # merged cronic/3 -> cronic/v3.
  "5":
    status: built
    build_date: "2026-09-20"
    conan_ref: "cmospwd/v5"
