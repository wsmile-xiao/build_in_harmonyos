# test_package/MANIFEST.yml
# CI L0e requires this file; HMBS requires explicit upstream audit for no_tests.

package: cmospwd/5.0
homepage: "https://www.cgsecurity.org/wiki/CmosPwd"

upstream_tests_exist: false
upstream_test_audit:
  source_tarball: "cmospwd-5.0.tar.bz2"
  source_sha256: "97f48eb0770b7341e267c65bf40f145c08fc000a2387b9af920287e662c2ef32"
  top_level_files:
    - src/cmospwd.c      # single-file CMOS/BIOS decode implementation, no TEST()/TEST_F/def test_
    - src/Makefile       # single target 'cmospwd: cmospwd.c' only, no check/test target
    - cmospwd.txt        # usage documentation, no test harness
    - COPYING            # license text, no test code
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile check/test target"
    - "tests/ / test/ / spec/ / t/ directory"
    - "ctest / meson test / make check target"
  scan_result: "0 matches -- only src/cmospwd.c plus two-line Makefile with single build target, no test framework or test directory"
  make_check_output: "make -n check => No rule to make target 'check' (no test target)"
  reason: "cmospwd 5.0 is a single-file x86 CMOS tool; upstream tarball has no test suite, Makefile has only one build target, no check/test target, no tests directory"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_cmospwd.c
    description: "usage output via unknown option (no hardware access)"
    command: "test_cmospwd <cmospwd> (usage case)"
  - file: test_cmospwd.c
    description: "file-backed decode with 128-byte backup and single module -m1"
    command: "test_cmospwd <cmospwd> (file decode case)"

assertion_count: 2
