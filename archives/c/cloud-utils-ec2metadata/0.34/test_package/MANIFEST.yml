# test_package/MANIFEST.yml
# 上游官方测试声明 — cloud-utils-ec2metadata 0.34 (canonical/cloud-utils tag 0.34)

package: cloud-utils-ec2metadata/0.34
homepage: "https://github.com/canonical/cloud-utils"

# 上游测试入口：Makefile 无 check 目标；上游 CI (.github/workflows/ci.yaml)
# 通过 ./test/run-all 运行 test/ 目录下的独立测试脚本（需 fdisk/sfdisk/
# gdisk/sgdisk/qemu-utils/mkfs.ext4/lvm2 等分区与镜像工具），另跑 tox
# (flake8/pylint/shellcheck) 静态检查。
upstream_check_command: "./test/run-all (上游 CI: sudo SKIP=growpart-lvm PATH=$PWD/bin:$PATH ./test/run-all)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（独立上游用例：test/ 下 7 个测试脚本；run-all 为运行器）
upstream_tests:
  - file: test/test-growpart
    source: cloud-utils-0.34/test/test-growpart
    description: "growpart 分区扩容功能测试（独立上游用例）"
    command: "./test/test-growpart"
  - file: test/test-growpart-fsimage
    source: cloud-utils-0.34/test/test-growpart-fsimage
    description: "growpart fsimage 镜像用例（独立上游用例）"
    command: "./test/test-growpart-fsimage"
  - file: test/test-growpart-fsimage-middle
    source: cloud-utils-0.34/test/test-growpart-fsimage-middle
    description: "growpart fsimage 中部扇区用例（独立上游用例）"
    command: "./test/test-growpart-fsimage-middle"
  - file: test/test-growpart-lvm
    source: cloud-utils-0.34/test/test-growpart-lvm
    description: "growpart LVM 卷用例（独立上游用例，上游 CI 亦 SKIP）"
    command: "./test/test-growpart-lvm"
  - file: test/test-growpart-overprovision
    source: cloud-utils-0.34/test/test-growpart-overprovision
    description: "growpart overprovision 用例（独立上游用例）"
    command: "./test/test-growpart-overprovision"
  - file: test/test-growpart-start-matches-size
    source: cloud-utils-0.34/test/test-growpart-start-matches-size
    description: "growpart 起始扇区与大小匹配用例（独立上游用例）"
    command: "./test/test-growpart-start-matches-size"
  - file: test/test-mic
    source: cloud-utils-0.34/test/test-mic
    description: "mount-image-callback 挂载回调用例（独立上游用例）"
    command: "./test/test-mic"
  - file: test/run-all
    source: cloud-utils-0.34/test/run-all
    description: "上游测试运行器（非独立用例）"
    command: "./test/run-all"

# test_package 中自带的测试 (消费者视角验证，OHOS 专项)
test_package_tests:
  - file: test_ohos_ec2metadata.py
    description: "OHOS 专项：ec2metadata env shebang 解析 + 本地 mock IMDSv2 token/元数据查询 + write-mime-multipart 可运行"
    command: "python3 test_ohos_ec2metadata.py"

# 测试断言总数 (近似值: OHOS 专项测试 4 项断言 + 上游 7 脚本各自含多断言)
assertion_count: 4
