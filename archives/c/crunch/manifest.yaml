software: crunch
display: "crunch"
description: "密码字典生成工具，根据指定条件和字符集生成各种组合的密码列表"
category: security
homepage: "https://sourceforge.net/projects/crunch-wordlist/"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure 脚本，需通过 Make 变量覆盖编译参数"
    - "INSTALL 变量必须覆盖为普通 install（去掉 sudo 和 root 权限选项）"
    - "LFS 变量需覆盖为空（鸿蒙 getconf 返回不兼容选项）"
  common_dependencies: []

versions:
  "3.6":
    status: published
    build_date: "2026-06-01"
    source_url: "https://sourceforge.net/projects/crunch-wordlist/files/crunch-3.6.tgz/download"