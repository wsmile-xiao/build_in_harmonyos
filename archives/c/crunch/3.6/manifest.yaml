software: crunch
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.6"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（扁平字段，供 verify-build 检查）
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://sourceforge.net/projects/crunch-wordlist/files/crunch-3.6.tgz/download"

  # 源码校验和
  sha256: "6a8f6c3c7410cc1930e6854d1dadc6691bfef138760509b33722ff2de133fe55"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（Make 变量覆盖，纯 Makefile 项目无 configure）
  configure_options:
    - "CC=clang"
    - "CFLAGS=-fPIC -O2"
    - "LFS="
    - "INSTALL=install"
    - "INSTALL_OPTIONS="

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Makefile 项目（无 configure）需通过 Make 变量覆盖: CC=clang, INSTALL=install, INSTALL_OPTIONS=（去掉 sudo 和 root 权限选项）"
  - "crunch Makefile 的 LFS 变量在鸿蒙 getconf 返回不兼容选项，需覆盖为空"
  - "clean-verify 对纯 Makefile 项目不支持（硬编码 ./configure），需手动验证 G0"
