# test_package/MANIFEST.yml
# Upstream test declaration file for c-ares 1.34.5
# CI (build_and_test.sh L0e) requires this file

package: c-ares-dev/1.34.5
homepage: "https://c-ares.org/"

# Upstream test command
upstream_check_command: "make check"

# Whether upstream tests are integrated into build()
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream test programs (from make -n check analysis)
upstream_tests:
  - file: test/arestest.cc
    source: c-ares-1.34.5/test/arestest.cc
    description: "Google Test based test suite: ares_init, ares_destroy, ares_send, ares_cancel, channel management"
    command: "./test/arestest"

# test_package consumer tests
test_package_tests:
  - file: test.c
    description: "Consumer test: ares_library_init + ares_version + ares_library_cleanup"
    command: "./test_c-ares"

# Approximate test assertion count
assertion_count: 50
