# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: c-algorithms/1.2.0
homepage: "https://github.com/fragglet/c-algorithms"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test/Makefile.am TESTS, 15 个 assert 型程序)
upstream_tests:
  - file: test/test-alloc-testing.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-alloc-testing.c
    description: "分配跟踪测试 (alloc-testing 框架)"
    command: "./test-alloc-testing"
  - file: test/test-arraylist.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-arraylist.c
    description: "arraylist 单元测试 (append/remove/index/insert)"
    command: "./test-arraylist"
  - file: test/test-avl-tree.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-avl-tree.c
    description: "AVL 树单元测试 (insert/remove/lookup)"
    command: "./test-avl-tree"
  - file: test/test-binary-heap.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-binary-heap.c
    description: "二叉堆单元测试"
    command: "./test-binary-heap"
  - file: test/test-binomial-heap.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-binomial-heap.c
    description: "二项堆单元测试"
    command: "./test-binomial-heap"
  - file: test/test-bloom-filter.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-bloom-filter.c
    description: "布隆过滤器单元测试"
    command: "./test-bloom-filter"
  - file: test/test-cpp.cpp
    source: c-algorithms-c-algorithms-1.2.0/test/test-cpp.cpp
    description: "C++ 头文件兼容测试"
    command: "./test-cpp"
  - file: test/test-list.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-list.c
    description: "双向链表单元测试 (append/prepend/nth_data/free)"
    command: "./test-list"
  - file: test/test-slist.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-slist.c
    description: "单向链表单元测试"
    command: "./test-slist"
  - file: test/test-queue.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-queue.c
    description: "双端队列单元测试 (push/pop/peek)"
    command: "./test-queue"
  - file: test/test-compare-functions.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-compare-functions.c
    description: "比较函数测试 (int/pointer/string)"
    command: "./test-compare-functions"
  - file: test/test-hash-functions.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-hash-functions.c
    description: "哈希函数测试 (int/pointer/string)"
    command: "./test-hash-functions"
  - file: test/test-hash-table.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-hash-table.c
    description: "哈希表单元测试 (insert/lookup/remove)"
    command: "./test-hash-table"
  - file: test/test-set.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-set.c
    description: "集合单元测试 (add/remove/contains)"
    command: "./test-set"
  - file: test/test-trie.c
    source: c-algorithms-c-algorithms-1.2.0/test/test-trie.c
    description: "字典树单元测试 (insert/lookup)"
    command: "./test-trie"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: queue/list/slist/arraylist/hashtable API 真实调用 + 断言"
    command: "./test_c-algorithms"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 90