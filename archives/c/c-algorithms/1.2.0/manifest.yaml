# 版本级 manifest — c-algorithms 1.2.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2.0"
software: "c-algorithms"

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-09-22"
build_system: "autotools"

source:
  url: "https://codeload.github.com/fragglet/c-algorithms/tar.gz/refs/tags/c-algorithms-1.2.0"
  sha256: "1f33f79aefd5ffc94ca886f7b9b3cb056df73bc2cfd24ed66ba61e54df946092"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-guess-ohos.patch"
  - "0002-configure-umask-022.patch"

knowledge_gained:
  - "c-algorithms 1.2.0 git-snapshot tarball 无预生成 configure/ltmain.sh，上游捆绑旧版 ltmain.sh 1.5.22 与 HarmonyOS mksh 不兼容（libtool 报 X--mode=compile inaccessible），必须用 libtool 2.4.7 removed ltmain.sh 替换后 autoreconf"
  - "autoreconf 生成 config.guess 缺 HarmonyOS 识别，需增加 ohos 分支；config.sub (2.4.7) 已原生支持 ohos，无需补丁"
  - "configure/config.guess 在 HMDFS 下 umask 077 临时目录创建失败 (E129)，需 077->022"
  - "test/Makefile.am 需 VPATH 安全 -I$(top_srcdir)/src 与 -UNDEBUG（R09: assertion 内含 queue 操作，Release -DNDEBUG 剥落后死循环）"