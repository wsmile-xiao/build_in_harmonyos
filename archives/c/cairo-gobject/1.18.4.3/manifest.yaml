version: "1.18.4.3"
software: "cairo-gobject"
status: built
build_date: "2026-09-08"
conan_ref: "cairo-gobject/1.18.4.3"
build_system: "meson"
source:
  url: "https://cairographics.org/releases/cairo-1.18.4.tar.xz"
  sha256: "445ed8208a6e4823de1226a74ca319d3600e83f6369f99b14265006599c32ccb"
  tar_format: tar.xz
build:
  system: meson
  configure_options:
    - "-Dxlib=enabled"
    - "-Dglib=enabled"
    - "-Dxcb=disabled"
    - "-Dxlib-xcb=disabled"
    - "-Dquartz=disabled"
    - "-Ddwrite=disabled"
    - "-Dlzo=disabled"
    - "-Dspectre=disabled"
    - "-Dtests=disabled"
  dependencies:
    - pixman/0.46.4
    - libpng/1.6.58
    - freetype/2.14.3
    - fontconfig/2.18.1.1
    - zlib/1.3.1.1
    - glib/2.84.0.1
    - libx11/6.4.0
    - libxext/6.4.0
    - libxrender/0.9.12
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "1.18.4.3：在 1.18.4.2 基础上启用 xlib surface（R37 版本后缀），使本包打包的 libcairo.so 带 cairo_xlib_* 符号，供 gtk X11 后端链接"
  - "libx11 为 override 钉版（压 libxrender 的 1.8.13 传递 pin），不进入 cpp_info.requires"
  - "构建期 meson 用 tool_requires（CI 无全局 meson）"
