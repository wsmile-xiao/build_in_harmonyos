  - "cvsync 使用 BSD Makefile，无 configure 步骤，需要手动指定 HASH_TYPE"
  - "鸿蒙系统缺少原生 MD5/SHA 实现，必须使用 openssl 或 libgcrypt"
  - "rcscan 和 rcscmp 的 main.c 缺少 sys/stat.h，需要手动添加"
  - "鸿蒙系统缺少 GNU install 命令，需要手动复制文件"

