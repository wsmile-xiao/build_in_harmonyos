    status: built
    build_date: "2026-06-12"
    patches_applied:
      - "0001-rcscan-main.c.patch"
      - "0002-rcscmp-main.c.patch"
    quality_notes: "补丁已添加 #ifdef __OHOS__ 守卫，符合 R8 铁律"