software: cvsync
display: "cvsync"
description: "CVS repository synchronization utility"
category: other-tool
homepage: "https://github.com/cvsync/cvsync"
license: BSD
build_system: makefile

ohos_adaptation:
  key_points:
    - "使用 BSD Makefile，无 configure 步骤"
    - "必须指定 HASH_TYPE=openssl 或 libgcrypt"
    - "rcscan/rcscmp 需要 sys/stat.h 补丁"
  common_dependencies:
    - openssl
    - zlib

versions:
