package: cppdap/1.58.0a
homepage: "https://github.com/google/cppdap"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "dap-1.58.0-a.tar.gz (official GitHub release archive, SHA-256 verified)"
  source_sha256: "5d35ca5db78570b6bef698e3365f79bd82a4f78e8393546387f78d7bdb2a2a08"
  build_system: "CMake (cmake_minimum_required 3.13, C++11, add_library(cppdap STATIC))"
  test_definition: >
    Upstream tests are 13 gtest source files under src/*_test.cpp,
    built into a single cppdap-unittests binary when CPPDAP_BUILD_TESTS=ON
    with CPPDAP_GOOGLETEST_DIR pointing at googletest sources.
    Counting unit is one gtest case (TEST/TEST_F/TEST_P macro instance),
    observed at runtime as one "[ RUN ] Suite.Case" line and summarized
    as "[==========] 143 tests from 22 test suites ran" / "[  PASSED  ] 143 tests."
    Take-number commands on upstream-tests.log:
    grep -c "^\[ *RUN *\]" upstream-tests.log -> 143 (discovered);
    tail summary "[  PASSED  ] 143 tests." -> passed 143, failed 0, skipped 0.
  dependency: >
    nlohmann_json/3.12.0 (external JSON backend, ohpcd package);
    googletest release-1.12.1 source tarball vendored at build time only
    (not a Conan dependency, not shipped in the package).
  portability_changes: []
  examples_note: >
    Upstream examples (hello_debugger, simple_net_client_server) and fuzzer
    are disabled via CPPDAP_BUILD_EXAMPLES=OFF / CPPDAP_BUILD_FUZZER=OFF;
    they are example programs, not test cases, and contribute 0 to totals.

upstream_check_command: "ctest -N (single cppdap-unittests entry) + ./cppdap-unittests --gtest_list_tests"
upstream_test_in_build: true
upstream_test_command: "./cppdap-unittests"

upstream_test_total: 143
upstream_test_count_method: gtest_macros
upstream_test_passed: 143
upstream_test_failed: 0
upstream_test_skipped: 0

upstream_tests:
  - file: src/any_test.cpp
    source: cppdap-dap-1.58.0-a/src/any_test.cpp
    description: "dap::any 单元测试"
    command: "./cppdap-unittests"
