version: "1.58.0a"
software: "cppdap"
status: built
build_date: "2026-09-10"
build_system: "cmake"

source:
  url: "https://github.com/google/cppdap/archive/refs/tags/dap-1.58.0-a.tar.gz"
  sha256: "5d35ca5db78570b6bef698e3365f79bd82a4f78e8393546387f78d7bdb2a2a08"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCPPDAP_USE_EXTERNAL_NLOHMANN_JSON_PACKAGE=ON"
    - "-DCPPDAP_BUILD_TESTS=ON"
    - "-DCPPDAP_BUILD_EXAMPLES=OFF"
    - "-DCPPDAP_BUILD_FUZZER=OFF"
    - "-DCPPDAP_WARNINGS_AS_ERRORS=OFF"
  dependencies:
    - nlohmann_json/3.12.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "发布包不含 third_party 子模块，JSON 后端必须走外部 nlohmann_json"
  - "上游库目标恒为 STATIC，BUILD_SHARED_LIBS 仅作 Conan 惯例透传"
  - "上游单测直接编译 googletest 源码，需 vendor release-1.12.1 并置 CPPDAP_GOOGLETEST_DIR"
