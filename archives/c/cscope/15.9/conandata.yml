sources:
  url:
    - "https://master.dl.sourceforge.net/project/cscope/cscope/v15.9/cscope-15.9.tar.gz"
    - "https://downloads.sourceforge.net/project/cscope/cscope/v15.9/cscope-15.9.tar.gz"
    - "https://sourceforge.net/projects/cscope/files/cscope/v15.9/cscope-15.9.tar.gz/download"
  sha256: "c5505ae075a871a9cd8d9801859b0ff1c09782075df281c72c23e72115d9f159"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Teach config.guess to detect HarmonyOS (arm64 -> aarch64-unknown-linux-ohos)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Teach config.sub to accept linux-ohos kernel-OS combinations"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "Link wide-character ncurses (libncursesw) for --with-ncurses; libncurses is not shipped by the OHOS ncurses package"
    patch_type: "portability"
  - patch_file: "patches/0004-src-main.c.patch"
    patch_description: "Relax the private temp-dir umask so it stays usable on OHOS: HMDFS resolves directory access via group bits, so the upstream umask(077) leaves <tmpdir>/cscope.N at 02700 and breaks line mode. POSIX-compatible and platform-macro free -- mkdir(..., S_IRWXU) already zeroes the group/other bits on conforming filesystems"
    patch_type: "portability"
