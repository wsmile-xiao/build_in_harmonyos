# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cscope/15.9
homepage: "https://cscope.sourceforge.net/"

# 上游测试命令
# cscope 15.9 上游不附带任何测试套件（无 tests/ 目录、无 automake TESTS 变量、
# 无 check_PROGRAMS、无 AC_CONFIG_TESTDIR、无 CI 配置），故此处为空。
# 清点证据见 reports/test-report.md 第二节。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# 上游无测试套件（N=0），适配后补全鸿蒙平台消费者验证
upstream_tests_supplemented: true
supplement_reason: "上游无测试套件（N=0），适配后补全消费者验证：冒烟 3 例 + 完整消费者端到端用例 1 个（7 例全链路）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "cscope 冒烟 3 例: -V 版本横幅 / -b 建交叉引用库 / -L 行模式符号查询"
    command: "bash test.sh"
  - file: test_e2e.sh
    description: "鸿蒙特有测试——完整消费者端到端用例（7 例）: 对 e2e-probe/ 微型 C 工程走通 cscope.files 清单 → -b 建库 → -0/-1/-2/-3/-8 行模式查询 → -u 增量更新复查；与编辑器 Cscope 集成消费通道同构"
    command: "bash test_e2e.sh"

# 测试用例总数 (test.sh 冒烟 3 例 + test_e2e.sh 端到端 7 例)
assertion_count: 10

# 完整消费者端到端用例数（test_e2e.sh，其 7 例已计入上方 assertion_count）
consumer_case_count: 1
