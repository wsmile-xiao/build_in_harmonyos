  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-src-main.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS: cscope 自带 2017 年 config.guess 为旧式 echo…exit 结构（0 处 GUESS=），官方 patch-autotools-ohos.pl 的 GUESS= 分支为死代码，必须改 *:HarmonyOS:*:* 分支"
  - "OHOS: 只补 config.guess 不够——config.sub 会静默把 aarch64-unknown-linux-ohos 规范化成 aarch64-unknown-linux-gnu-ohos，必须同时补 config.sub 识别列表"
  - "OHOS: conan ncurses/6.6 只提供宽字符库 libncursesw.a（无 libncurses.a），cscope configure.in:153 的 --with-ncurses 分支硬编码 -lncurses 必然链接失败"
  - "OHOS: 不打 --with-ncurses 时 cscope 的 curses 探测扫宿主 /usr/include 失败，退化为 SysV 分支产出 -lcurses，同样失败——打 --with-ncurses 行是正确修复"
  - "OHOS: 上游预生成 configure/Makefile.in/egrep.*/scanner.c 与宿主 autoconf/automake/bison/flex 不同代，须压时间戳禁止 make 重新生成"
  - "make -j1 required: HMDFS FIFO jobserver fails (Operation not permitted)"

