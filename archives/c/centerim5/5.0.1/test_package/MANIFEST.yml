# test_package/MANIFEST.yml — centerim5 5.0.1
# CI L0e requires this file to exist.

package: centerim5/5.0.1
homepage: "https://github.com/petrpavlu/centerim5"

# 上游测试命令 (`make check` 在 tests/ 下运行 termex 终端测试框架)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：treeview.test（termex 模拟终端 playbook）
upstream_tests:
  - file: treeview.test
    source: centerim5-5.0.1/tests/treeview.test
    description: "Terminal playbook test: renders a TreeView widget, compares screen data & attr against expected scheme, presses F10 to quit"
    command: "make check"

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Runs centerim5 --version / --help, then launches centerim5 --ascii --offline to verify the binary starts"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
