# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cppcodec/0.2
homepage: "https://github.com/tplgy/cppcodec"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build build --target test_cppcodec && ctest --test-dir build"

# 上游 Catch2 套件在 test_package/test() 中编译并执行。
# 主配方 build() 保留 pass (header-only 库无构建步骤)：
#   cppcodec 是 package_type="header-library"，Conan 2 在 binary 缓存命中时
#   (Already installed!) 会跳过 build()/package() 整个 lifecycle，导致放在
#   build() 里的上游测试逻辑从不执行。test_package 的 test() 方法每次
#   conan create 都执行，不受 binary 缓存影响，是 header-only 库跑上游
#   测试的唯一可靠 lifecycle hook。
# 上游 tarball 内 test/catch 为空的 git submodule；本地验证时需将官方
# Catch2 v2.3.0 single_include 放入 test/catch/single_include 恢复测试入口。
upstream_test_in_build: false
upstream_test_in_test_package: false
upstream_test_command: "cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build build --target test_cppcodec && ctest --test-dir build"

# 上游实际运行的测试程序
# cppcodec upstream 使用 Catch2,所有用例编译进单个 test_cppcodec 二进制,
# 共 8 个 test cases / 587 条断言 (clang 15 -std=c++11, 本机实测)。
upstream_tests:
  - file: test/test_cppcodec.cpp
    source: cppcodec-0.2/test/
    description: "All upstream Catch2 test cases (8 cases, 587 assertions)"
    command: "./test_cppcodec"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_cppcodec.cpp
    description: "Downstream consumer test — base64/base64url/base32/hex round-trip"
    command: "./test_cppcodec"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6