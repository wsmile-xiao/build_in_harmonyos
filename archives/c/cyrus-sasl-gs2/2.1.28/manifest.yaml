# 版本级 manifest
# 文件位置: archives/c/cyrus-sasl-gs2/2.1.28/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.28"

# 软件名
software: "cyrus-sasl-gs2"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 cyrus-sasl 2.1.28 同源：GS2 机制是上游源码内 plugins/gs2.c，RFC 5801）
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"

  # 源码校验和
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（GS2 专用最小闭包：启用 gssapi/GS2，其余重机制/后端全关；共享插件形式）
  configure_options:
    - "--enable-gssapi"
    - "--with-gss_impl=mit"
    - "--enable-shared"
    - "--disable-static"
    - "--with-dblib=none"
    - "--without-saslauthd"
    - "--without-openssl"
    - "--disable-sample"
    - "--disable-login"
    - "--disable-ldapdb"
    - "--disable-sql"
    - "--disable-ntlm"
    - "--disable-otp"
    - "--disable-srp"
    - "--disable-scram"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - krb5/1.22.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "GS2 是 RFC 5801 的 GSS-API 桥接机制（plugins/gs2.c），需 MIT Kerberos GSS-API，上游 README.GS2 明确需 MIT Kerberos 1.9+"
  - "GSSAPI 启用后若 krb5 提供 rfc5587+rfc5801（gss_inquire_attrs_for_mech/gss_inquire_saslname_for_mech），configure 自动同时构建 libgs2.la 与 libgssapiv2.la"
  - "上游 2.1.28 的 rfc5801 检查在 gssapi/gssapi.h 分支误用 #include <gssapi.h>，MIT krb5 下 gs2 恒为 no，需改写生成物 configure（GSSAPI 正常但 GS2 缺失即此征兆）"
  - "上游 2.1.28 无 STATIC_GS2（configure.ac/staticopen.h 均无），GS2 只能以共享插件 libgs2.so 交付，经 SASL_PATH/sasl_set_path 发现"
  - "具体 SASL 名为 GS2-KRB5 等（由 GSS 机制派生），测试须匹配 GS2- 前缀而非精确 GS2"
  - "configure 需显式喂 CC_FOR_BUILD=clang（OHOS 无 gcc/cc），并用 --enable-gssapi=<krb5 前缀> 指向 Conan krb5 包"
  - "共享插件包：包 runenv 暴露 SASL_PATH，消费者另用 sasl_set_path(SASL_PLUGIN_DIR) 锁定插件目录（库内烘焙 //lib/sasl2 重定位后不存在）"
  - "HMDFS 默认 tmp 可能不可写，TMPDIR 指到源码树内 tmp（HMBS 注入值优先）"
