# 软件级 manifest
# 文件位置: archives/c/cyrus-sasl-gs2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: cyrus-sasl-gs2

# 显示名
display: "Cyrus SASL GS2 mechanism"

# 一句话描述
description: "Cyrus SASL GS2 authentication mechanism (libsasl2 with GS2/GSSAPI support)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: security

# 官网 URL
homepage: "https://www.cyrusimap.org/sasl/"

# 开源许可证（SPDX 标识）
license: BSD-Attribution-HPND-disclaimer

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "GS2 为 RFC 5801 的 GSS-API 桥接机制（plugins/gs2.c），需 MIT Kerberos GSS-API（README.GS2：需 MIT Kerberos 1.9+）"
    - "GSS 检测通过后自动同时构建 GS2 与 GSSAPI，具体 SASL 名为 GS2-KRB5 等（测试匹配 GS2- 前缀）"
    - "依赖 krb5/1.22.1，configure 用 --enable-gssapi=<krb5 前缀> --with-gss_impl=mit 指向 Conan 包"
    - "configure 需显式喂 CC_FOR_BUILD=clang（OHOS 无 gcc/cc）"
    - "GS2 只能以共享插件 libgs2.so 交付（上游无 STATIC_GS2），运行期经 SASL_PATH/sasl_set_path 发现插件"
    - "gssapi/gssapi.h 分支的 rfc5801 检查误用 #include <gssapi.h>，MIT krb5 下需改写生成物 configure 否则 gs2 恒为 no"

  # 跨版本通用依赖
  common_dependencies:
    - krb5/1.22.1

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.1.28":
    status: built
    build_date: "2026-09-12"
    conan_ref: "cyrus-sasl-gs2/2.1.28"
    note: "GS2 机制首个适配版本；待 HMBS 真机验证通过后标 published"
