  - "ref: archives/c/capstone/5.0.7/notes.md — 无标准 make check 测试目标（CAPSTONE_BUILD_TESTS=OFF），验证以 test_package 真实反汇编替代"
  - "ref: .workbuddy/skills/adapt-lib-flow/references/pitfalls-checklist.md#1 — conandata.yml 仅保留官方 https 源，清除 gh-proxy 镜像残留（5.0.7 配方曾残留 gh-proxy.com）"
