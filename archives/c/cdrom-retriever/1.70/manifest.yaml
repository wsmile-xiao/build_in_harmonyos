# 版本级 manifest
# 文件位置: archives/c/cdrom-retriever/1.70/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.70"

# 软件名
software: "cdrom-retriever"

# 编译状态
# published | built | failed | archived
# 本地实测状态；CI 结果出来后按 CI 实际结果更新
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "none"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 源码池——Vcs 仓库为
  # salsa.debian.org/installer-team/cdrom-retriever，官方发布为
  # Debian 源码包 tarball，顶层目录 cdrom-retriever-1.70/）
  url: "https://deb.debian.org/debian/pool/main/c/cdrom-retriever/cdrom-retriever_1.70.tar.xz"

  # 源码校验和（本地 = 上游 .dsc 记录逐字节一致已核验）
  sha256: "9329632f4bcd9ef80c5ab32069ba5f139c6e4872d83fb9b87da5a9aa293d64c7"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（纯 shell 脚本包，tarball 无 Makefile，无编译）
  system: none

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # 无 registry 构建依赖。脚本运行时外部命令 udepkg/anna/logger 为
  # Debian-installer 专有工具（registry 无），debconf confmodule 为运行时
  # source 依赖（registry 有但非构建依赖），均按环境依赖记录不引入
  dependencies: []

  # 编译器（无编译）
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（纯脚本包，无补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "无 Makefile 的纯脚本包（tarball 仅脚本 + debian/ 元数据）：按 debian/*.install 文件声明的安装目标落盘（usr/lib/debian-installer/retriever 去 usr/ 前缀），G4/L5 门禁用 lib/pkgconfig/<name>.pc 声明 retrieverdir（cdrom-detect 同款先例）"
  - "case 分发器型脚本的完整性检查除 sh -n 语法解析外，还应静态断言全部分发分支标签（xconfig/xretrieve/xpackages/xerror/xcleanup）存在——丢失分支的脚本语法仍合法，纯 sh -n 检不出来"
  - "Debian 源码包版本核对：salsa tag 序列（0.21~1.70）+ pool 现存文件双向核实，避免 1.7 与 1.70 之类的版本笔误导致 404"
