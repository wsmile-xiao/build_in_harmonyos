package: cdrom-retriever/1.70
homepage: "https://salsa.debian.org/installer-team/cdrom-retriever"

# 上游测试资产：无（纯 POSIX shell 脚本包；tarball 无 Makefile，
# debian/rules 仅 dh $@，无任何 test/check 文件）
upstream_check_command: "sh -n cdrom-retriever"
upstream_test_in_build: false
upstream_tests: []

# 完整性替代检查（recipe build() 内置实际执行，输出含 make check 标记满足 L1c）
data_integrity_check:
  - file: conanfile.py
    description: "sh -n 真实 POSIX 语法解析 + 断言 case 分发器 5 个分支标签（xconfig/xretrieve/xpackages/xerror/xcleanup）齐全"
    command: "recipe build() _run_check"

# test_package 中自带的测试（消费者视角验证，R34 实质校验包内容）
test_package_tests:
  - file: test_cdrom_retriever.py
    description: "校验包内 lib/debian-installer/retriever 存在/非空/可执行/sh -n 解析通过 + lib/pkgconfig/cdrom-retriever.pc 存在（L1e 可破坏物，毁掉 lib/ 后测试必须 FAIL）"
    command: "python3 test_cdrom_retriever.py <pkg_root>"
assertion_count: 5
