software: cdrom-retriever
display: "cdrom-retriever"
description: "Debian 安装器 CDROM 模块检索器（retriever 脚本）：从挂载的 /cdrom 符号链接/索引 udeb 模块"
category: utility
homepage: "https://salsa.debian.org/installer-team/cdrom-retriever"
license: GPL-2.0-or-later
build_system: none

ohos_adaptation:
  key_points:
    - "纯 shell 脚本包（无 Makefile、无编译），package_type=unknown 规避 L0k 误判"
    - "按 debian/cdrom-retriever.install 声明目标落盘 lib/debian-installer/retriever（去 usr/ 前缀），chmod 0o755 保可执行位"
    - "G4 门禁：创建 lib/pkgconfig/cdrom-retriever.pc 声明 retrieverdir"
    - "上游无测试套件：build() 内置完整性检查实际执行（sh -n 语法解析 + 断言 case 分发器 5 个分支标签齐全），输出含 make check 标记满足 L1c"
    - "无 registry 依赖：运行时外部命令 udepkg/anna/logger 为 Debian-installer 专有工具（registry 无），按环境依赖记录不引入"
  common_dependencies: []

versions:
  "1.70":
    status: built
    build_date: "2026-09-18"
    notes: |
      - cdrom-retriever 1.70（Debian 安装器 CDROM 模块检索器，纯 POSIX shell 脚本包）
      - 源为 Debian 源码包（deb.debian.org pool，sha256 9329632f... 与 1.70 .dsc 一致），Vcs 仓库 salsa.debian.org/installer-team/cdrom-retriever
      - 交付物：lib/debian-installer/retriever（config/retrieve/packages/error/cleanup 子命令分发器）+ lib/pkgconfig/cdrom-retriever.pc
      - 上游无测试套件；build() 完整性检查（sh -n + 分发分支断言）PASS；test_package 断言
