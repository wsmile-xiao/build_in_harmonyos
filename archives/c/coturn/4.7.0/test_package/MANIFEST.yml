package: coturn/4.7.0
homepage: "https://github.com/coturn/coturn"
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check (enabled via with_upstream_tests=True; default off)"
upstream_tests:
  - file: "src/apps/common/ns_turn_utils.c"
    source: "coturn-4.7.0/turnutils_rfc5769check (RFC 5769 test vectors; OAuth token tests additionally when GCM is available)"
    description: "RFC 5769 STUN message test-vector checks"
    command: "bin/turnutils_rfc5769check"
test_package_tests:
  - file: "test_coturn.sh"
    description: "Runs the packaged RFC 5769 STUN test-vector utility and turnserver --version"
    command: "turnutils_rfc5769check; turnserver --version"
assertion_count: 14
