patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "complexity 是 GNU autotools CLI 工具：configure + make 产出 bin/complexity，gnulib 源码内嵌于 lib/，无 Conan 依赖"
  - "configure 硬依赖 GNU autogen libopts (autoopts-config)，真机预检实测无系统级 libopts（autoopts-config: command not found）；完整 autogen 需 guile 太重，改为配方内私有构建最小 getopt_long 兼容层，不新增 Conan 依赖"
  - "显式 --build/--host triplet 可绕过 config.guess 在受限文件系统上的探测失败 (E007/HMDFS，同 cflow 1.0.0 做法)"
  - "上游测试为 automake 单用例套件 tests/complexity.test，make check 生成 tests/test-suite.log，配方解析其 # TOTAL/# PASS 计数作为 HMBS 上游证据"
