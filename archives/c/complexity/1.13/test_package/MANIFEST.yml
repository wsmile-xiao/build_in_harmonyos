# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: complexity/1.13
homepage: "https://www.gnu.org/software/complexity/"

# 上游测试命令 (automake harness, TESTS=tests/complexity.test)
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/complexity.test
    source: complexity-1.13/tests/complexity.test
    description: "上游 automake 测试脚本：用刚构建的 src/complexity 对 src/*.c 做全量打分并校验双标题，对 tests/sample.c 做阈值打分并与内嵌期望输出逐行 cmp；输出为空或桩二进制会导致标题缺失而 exit 1"
    command: "make check"
  - file: tests/sample.c
    source: complexity-1.13/tests/sample.c
    description: "上游测试参照输入：5 个已标注期望分值的 C 函数体"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_complexity.sh
    description: "运行打包后的 complexity --version 校验 1.13 版本横幅；对现场编写的 sample_complexity.c 做真实打分并校验 Complexity Scores 表非空且包含 branchy，共 2 个断言"
    command: "./test_complexity.sh <pkg>/bin/complexity"
  - file: test_upstream_check.sh
    description: "上游 tests/complexity.test 的确定性部分在 test_package 中的忠实重跑：以安装后的 bin/complexity 对随包 vendored 的 upstream_sample.c（与上游 tests/sample.c 逐字节一致）先做 rcfile 全量打分并断言 Complexity Scores/Histogram 双标题，再以 -t0 打分并经与上游完全相同的 sedcmd 归一化后与上游内嵌期望表 cmp；conan create 命中包缓存时会跳过 build() 的 make check，此重跑保证每次预检（重建或缓存命中）都有真实的上游证据，桩二进制（空输出）必然在标题断言或 cmp 处 exit 1"
    command: "./test_upstream_check.sh <pkg>/bin/complexity"
  - file: upstream_sample.c
    description: "上游 tests/sample.c 的逐字节 vendored 副本，供 test_upstream_check.sh 做上游期望表比对的参照输入"
    command: "./test_upstream_check.sh <pkg>/bin/complexity"

# 测试断言总数 (test_package 侧 2 个；上游 automake 套件 1 个 TESTS 用例)
assertion_count: 2

# 审计说明：上游测试存在且已在配方 build() 中完整接入。
# 补充（2026-09-08）：test_package 新增 test_upstream_check.sh +
# upstream_sample.c，对上游 tests/complexity.test 的确定性断言做忠实重跑，
# 原因是 conan create 在包缓存命中时会跳过 build()（预检日志原文
# "Already installed! (1 of 1)"），导致当轮无 HMBS_UPSTREAM_TEST_RESULT
# 而被判 incomplete；重跑与 build() 的 make check 并存，不替代、不删减。
upstream_tests_exist: true
upstream_test_audit: >
  检查范围：官方发布包 complexity-1.13.tar.xz（ftp.gnu.org，sha256
  80a625a8…739e67，456312 字节，已下载核对）。构建文件清点：
  tests/Makefile.am 声明 TESTS=complexity.test（唯一上游测试用例），
  tests/ 下仅有 complexity.test（sh 脚本）与 sample.c（参照输入），无
  gtest/pytest/ctest 等其他测试框架。complexity.test 非空跑：
  先以 src/complexity 对 src/*.c 全量打分并要求输出同时含
  "Complexity Scores" 与 "Complexity Histogram" 双标题，再以 -t0 对样本
  打分并与脚本内嵌期望表 cmp；桩二进制（无输出/空输出）必然因标题缺失
  或 cmp 不一致而 exit 1，不存在静默跳过路径。结论：上游存在 1 个测试
  用例，配方 build() 以 make check 真实完整执行，并解析
  tests/test-suite.log 的 automake 计数作为 HMBS 上游证据。
