software: ceres-solver
# 版本级 manifest
# 文件位置: archives/c/ceres-solver/2.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.2.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"

# 构建系统 (top-level for manifest checker)
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ceres-solver/ceres-solver/archive/refs/tags/2.2.0.tar.gz"

  # 源码校验和
  sha256: "12efacfadbfdc1bbfa203c236e96f4d3c210bed96994288b3ff0c8e7c6f350d4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 质量门禁要求字段
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DMINIGLOG=ON"
    - "-DGFLAGS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - eigen/3.4.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "使用 MINIGLOG=ON 替代外部 glog（glog 未在 OHOS Conan 仓库中发布）"
  - "Bazel BUILD 文件与 CMake build 目录冲突，需在 source() 中删除 BUILD 文件"
  - "cpp_info.requires 需使用 eigen::eigen 格式声明传递依赖"
  - "miniglog 头文件安装在 include/ceres/internal/miniglog/glog/，需在 package_info() 中添加 include 路径"
  - "并行编译 -j6 可在 31GB 内存系统上正常工作"

# ============================================================
# 产物信息
# ============================================================

package:
  # 预编译包文件名
  filename: "ceres-solver-2.2.0-ohos-aarch64.tar.gz"

  # SHA256 校验和
  sha256: "64bcb3439a3fb85ecd9ab4a48d50c5300abf9ebee8722b09920174e5b6f0bb20"

  # 大小（字节）
  size: 27262976
