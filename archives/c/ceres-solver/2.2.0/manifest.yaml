software: ceres-solver
# 版本级 manifest
# 文件位置: archives/c/ceres-solver/2.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.2.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ceres-solver/ceres-solver/archive/refs/tags/2.2.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 质量门禁要求字段
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_TESTING=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - eigen/3.4.0
    - glog/0.7.1
    - gflags/2.2.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯静态库项目，无可执行文件，质量门禁G4需特殊处理"
  - "示例程序可能链接失败，建议禁用 -DBUILD_EXAMPLES=OFF"
  - "并发编译可能有路径问题，建议单线程编译"

# ============================================================
# 产物信息
# ============================================================

package:
  # 预编译包文件名
  filename: "ceres-solver-2.2.0-ohos-aarch64.tar.gz"

  # SHA256 校验和
  sha256: "64bcb3439a3fb85ecd9ab4a48d50c5300abf9ebee8722b09920174e5b6f0bb20"

  # 大小（字节）
  size: 27262976
