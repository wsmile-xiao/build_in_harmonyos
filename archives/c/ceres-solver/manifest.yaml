software: ceres-solver
category: math
description: A large scale non-linear optimization library
website: http://ceres-solver.org/
repository: https://github.com/ceres-solver/ceres-solver

versions:
  2.2.0:
    status: built
    release_date: 2023-10-13
    dependencies:
      - eigen 3.4.0
      - glog 0.7.1
      - gflags 2.2.2
    optional_dependencies:
      - SuiteSparse 4.5.6
      - LAPACK
      - CUDA
    configure_options:
      - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DBUILD_EXAMPLES=OFF"
      - "-DBUILD_TESTING=OFF"
    build_system: cmake
    compiler: clang 15.0.4

latest_version: 2.2.0