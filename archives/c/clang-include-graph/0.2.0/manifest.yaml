software: clang-include-graph
version: "0.2.0"
upstream_version: "0.2.0"
build_system: cmake
status: built
build_date: "2026-09-08"

source:
  url: "https://github.com/bkryza/clang-include-graph/releases/download/0.2.0/clang-include-graph-0.2.0.tar.gz"
  sha256: "174bbf961a2426030102bcf444eb2ca4ac10c05cfd5b993fef24bf4d492c420c"
  tar_format: tar.gz

build:
  system: cmake
  cppstd: 14          # upstream sets CMAKE_CXX_STANDARD 14
  requires:
    - boost/1.91.0.1.3   # adds compiled log/log_setup/json/unit_test_framework
  toolchain:
    compiler: ohos-sdk clang 15.0.4 / libc++15 (device native/llvm)
  libclang:
    provider: on-device OHOS SDK native/llvm (libclang.so, clang-c/Index.h,
      llvm-config 15.0.4) — no ohpcd clang recipe exists (conancenter off)
    runtime: SDK lib dir baked into executable RPATH; load probe-verified
    api: clang 15.0.4 C API (LLVM_PREFERRED_VERSION 16.0.0 is not enforced
      by upstream FindLibClang.cmake)

patches_applied: []

knowledge_gained:
  - "clang-include-graph 为 C++14 CMake CLI 工具（application），上游工程未改动即可构建；无 configure/autotools，install 无规则，产物仅单二进制"
  - "依赖 conan boost/1.91.0.1.3 的编译组件：Boost.Log(log/log_setup)、Boost.JSON、Boost.Test(unit_test_framework) + filesystem/graph/program_options（本变体此前已建）；parser 还用 boost/asio/post.hpp + thread_pool.hpp（header-only，但 asio 被移出该变体编译闭包，CMake install 不装其头 → 首次真实 verify 在 include_graph_parser.h:25 报 file not found；boost 变体已改为 package() 直接拷贝 asio 头树，非随全量头文件安装）"
  - "设备 OHOS SDK 自带可用 arm64 libclang.so（NEEDED 仅 libc.so）、clang-c/Index.h、llvm-config 15.0.4；ohpcd 无 clang 配方且 conancenter 关闭 → libclang 不能作为 conan 依赖，直接从设备 SDK 取"
  - "探针实证（非推断）：对设备 clang 编译并自签的 aarch64 可执行程序可 dlopen SDK libclang.so 并完成 clang_parseTranslationUnit；故上游 FindLibClang + 设备 llvm-config（LLVM_PREFERRED_VERSION=16 只是声明、FindLibClang 并不校验）可走通"
  - "libclang.so 非 conan 依赖、无 VirtualRunEnv 覆盖：须把 SDK lib 目录以 -Wl,-rpath 烤进可执行文件 RPATH，运行时才能解析 DT_NEEDED libclang.so"
  - "OHOS 仅加载带代码签名的 ELF：build() 内 ctest 前、package() 后均需 llvm-objcopy(去 .codesign)+binary-sign-tool(selfSign) 签名；对象库编译 Boost 头文件依赖全局 -isystem（object library 不链 Boost targets，include_directories(${Boost_INCLUDE_DIRS}) 旧变量 conan 不保证设置）"
  - "GitVersion.cmake 无 .git 时回退 0.0.0-unknown → configure 显式 -DGIT_VERSION=0.2.0 保持版本串正确"
  - "上游自带 9 个 CTest 用例（tests/ 链接 libclang + Boost::json/log/unit_test_framework），作为 build() 内门禁直接运行；test_package 以 fixture compile_commands.json 驱动真实解析验证端到端"

validation:
  status: pending
  notes: >-
    Pending HARMONY_VERIFY on WIN01: conan create ohos-aarch64 with upstream
    CTest gate (nine printer/util tests) plus a test_package smoke that parses
    a self-contained fixture TU through the packaged tool.
