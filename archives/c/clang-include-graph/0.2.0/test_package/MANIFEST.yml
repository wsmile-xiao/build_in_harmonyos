# The parser smoke drives a real libclang parse through the packaged binary;
# compile_commands.json is generated by test_package at test time over the
# committed fixture tree below.
test_package_tests:
  - file: "fixture/main.cpp"
    description: "Self-contained TU (#include graph_alpha.h -> graph_beta.h); exercises the packaged tool end-to-end"
    command: "clang-include-graph -d <fixture> -J 1 --tree"
  - file: "conanfile.py"
    description: "Version-banner smoke asserting '0.2.0' + fixture parse asserting 'graph_beta.h' edge in output"
    command: "clang-include-graph --version"

test_package_test_count: 2
