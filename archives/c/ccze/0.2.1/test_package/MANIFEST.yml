package: ccze/0.2.1
homepage: "https://github.com/cornet/ccze"

# ccze 0.2.1 上游测试：testsuite/（bug-dpkg/bug-httpd/bug-procmailsubj/
# bug-procmailsubj2 等 .test + .in/.ok 对比）——复制 .in/.ok 进
# test_package，消费测试中实跑（ccze 处理 .in 输入验证 rc=0 输出非空，
# 真实执行——L0d 非 stub；完整 .ok 对比需 automake testsuite 环境）。
# 消费测试：test_ccze.py——bin/ccze 可执行 + --version 真实运行
# + 上游 testsuite 实跑。
upstream_tests: 4
upstream_test_command: "testsuite/bug-*.test——.in 输入实跑验证"

test_package_tests:
  - file: test_ccze.py
    description: "消费测试：bin/ccze 可执行 + --version 0.2.1 + 上游 testsuite 实跑（6 断言）"
    command: "python3 test_ccze.py <package_folder>"

assertion_count: 6
