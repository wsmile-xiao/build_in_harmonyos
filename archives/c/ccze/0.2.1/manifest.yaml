software: ccze
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游最新发布版 0.2.1——NEWS/ChangeLog 确认 2003-05-13
# Fireflower；上游无 tag，清单 1.0.0 与上游不符按真实版）
version: "0.2.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"

# 构建系统标识（verify-build 要求）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（cornet/ccze master——无 tag，用 master tarball）
  url: "https://codeload.github.com/cornet/ccze/tar.gz/refs/heads/master"

  # 源码校验和
  sha256: "e8100872bac96c20af8b67813fb7f6a155f74a74ece986cbb7c1098f3abefe62"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 构建系统标识（verify-build 要求）
  build_system: autotools

  # 配置选项列表（无特殊选项）
  configure_options: []

  # 编译依赖列表（格式: name/version）——ncurses 必需；dl/PCRE 可选
  # （configure 检测到才用）。ncurses/6.4 有 cppstd=17 二进制
  # （6.5 制品仓无对应二进制）
  dependencies:
    - "ncurses/6.4"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "ccze（C 日志着色器）autotools 构建，依赖 ncurses（制品仓 6.5 可用）；上游无 tag——master tarball 作源，版本取最新发布版 0.2.1"
    - "上游测试 testsuite/（bug-*.test + .in/.ok 对比）——make check 实跑验证"
