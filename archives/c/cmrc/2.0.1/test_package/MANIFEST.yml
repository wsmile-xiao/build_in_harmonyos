# test_package/MANIFEST.yml
# 上游官方测试声明 — cmrc 2.0.1
# 上游构建系统: CMake + CTest (tests/CMakeLists.txt, 7 个 add_test 用例)

package: cmrc/2.0.1
homepage: "https://github.com/vector-of-bool/cmrc"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/ 目录, 均为 C++ 可执行用例)
upstream_tests:
  - file: tests/simple.cpp
    source: cmrc-2.0.1/tests/simple.cpp
    description: "读取 hello.txt 嵌入资源并输出, PASS_REGEX ^Hello, world!"
    command: "./simple"
  - file: tests/flower.cpp
    source: cmrc-2.0.1/tests/flower.cpp
    description: "嵌入并读取 flower.jpg 二进制资源"
    command: "./flower"
  - file: tests/prefix.cpp
    source: cmrc-2.0.1/tests/prefix.cpp
    description: "PREFIX 路径前缀资源读取, PASS_REGEX ^Hello, world!"
    command: "./prefix"
  - file: tests/whence.cpp
    source: cmrc-2.0.1/tests/whence.cpp
    description: "WHENCE 资源路径剥离读取, PASS_REGEX ^I am a file!"
    command: "./whence"
  - file: tests/whence_prefix.cpp
    source: cmrc-2.0.1/tests/whence_prefix.cpp
    description: "WHENCE+PREFIX 组合路径读取, PASS_REGEX ^I am a file!"
    command: "./whence_prefix"
  - file: tests/iterate.cpp
    source: cmrc-2.0.1/tests/iterate.cpp
    description: "目录迭代: 根目录+子目录条目名输出, PASS_REGEX ^subdir_a..."
    command: "./iterate"
  - file: tests/enoent.cpp
    source: cmrc-2.0.1/tests/enoent.cpp
    description: "打开不存在资源应抛错, WILL_FAIL 用例"
    command: "./enoent"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 find_package(cmrc) + cmrc_add_resource_library 嵌入 hello.txt 并断言内容"
    command: "./test_cmrc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
