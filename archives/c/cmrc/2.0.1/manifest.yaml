# 版本级 manifest — cmrc 2.0.1
# 遵循 ARCHIVE-SPEC v2.0

version: "2.0.1"
software: cmrc
status: built
build_date: "2026-09-06"
build_system: cmake

source:
  url: "https://github.com/vector-of-bool/cmrc/archive/refs/tags/2.0.1.tar.gz"
  sha256: "edad5faaa0bea1df124b5e8cb00bf0adbd2faeccecd3b5c146796cbcb8b5b71b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-minimum-3.5.patch"

knowledge_gained:
  - "cmrc (CMakeRC) 是 CMake 模块型资源编译器：上游只发布 CMakeRC.cmake，无库无头，消费者 include 后调用 cmrc_add_resource_library()，configure/build 期生成 cmrc.hpp 与资源静态库"
  - "CMake 模块分发包按 ecbuild 模式打包：模块装入 lib/cmake/<name>/，用 cmake_build_modules 让 CMakeDeps 生成的 config 主动 include，下游 find_package 后命令直接可用"
  - "init-build 对 URL 的后缀猜测构建系统可能误判（cmrc 曾误判 autotools），需按源码实际构建系统手动修正 conanfile.py 与 manifest"
