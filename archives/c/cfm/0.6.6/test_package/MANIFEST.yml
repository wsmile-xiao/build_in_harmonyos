# test_package/MANIFEST.yml — cfm 0.6.6
# CI L0e requires this file to exist.

package: cfm/0.6.6
homepage: "https://github.com/sophec/cfm"

# cfm has no upstream test suite: official tag tarball contains only
# cfm.c, config.def.h, Makefile, cfm.1, README.md, LICENSE, .gitignore,
# .github/workflows/cbuild.yml, screenshot.png — no tests/ dir, no test
# framework, and the Makefile has no `check` target (verified enumeration).
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: conanfile.py
    description: "Launches installed cfm binary against a real directory (closed stdin, exit 0) and drives the TUI under a pty (escape-sequence render + clean 'q' quit)"
    command: "conan test"
  - file: test.c
    description: "C consumer: fork+execvp('cfm', <mkdtemp 临时目录>) with closed stdin, asserts clean exit"
    command: "conan test"

# Approximate assertion count
assertion_count: 4
