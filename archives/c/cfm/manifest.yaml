software: cfm
display: "cfm"
description: "Cactus File Manager - simple and fast TUI file manager with no dependencies"
category: tool
homepage: "https://github.com/sophec/cfm"
license: MPL-2.0
build_system: makefile
ohos_adaptation:
  key_points:
    - "OHOS: 纯 Makefile 单文件 C 项目，无 configure，无外部依赖"
    - "OHOS: 环境无 GNU install 命令（知识 E108/E182），配方 package() 直接用 copy() 拷贝 bin/man 产物"
    - "OHOS: 消费者测试用 pty 驱动 TUI 验证渲染与干净退出（普通非 TTY 运行直接退出 0）"
versions:
  "0.6.6":
    status: built
    build_date: "2026-09-20"
    packaging: conan
    notes: "conan recipe (os=OHOS arch=armv8), Makefile build, MPL-2.0, 无依赖; package() 绕开 make install（GNU install 缺失）"
    dependencies: []
