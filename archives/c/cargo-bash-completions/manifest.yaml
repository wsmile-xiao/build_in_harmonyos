software: cargo-bash-completions
display: "Cargo Bash Completions"
description: "cargo 命令的 bash 补全脚本（子命令、子命令选项、+toolchain 与目标三元组补全）"
category: utilities
homepage: "https://github.com/rust-lang/cargo"
license: "Apache-2.0 OR MIT"
# 交付物是上游源码树中的一个 bash 脚本，安装 = 复制；配方从不调用 make/cargo
# → 取 custom，与同族先例 docker-completion / pip-completion 一致
build_system: custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 bash 脚本包（src/etc/cargo.bashcomp.sh，311 行 / 11443B，无 shebang、非可执行），无 configure/编译，安装 = 复制脚本"
    - "本包不编译任何 Rust 代码：仅从 rust-lang/cargo 源码树取补全脚本，CI 无需 rustc/cargo 工具链"
    - "上游无安装该脚本的 make 目标（Rust 发行版由 rust-installer 装成 etc/bash_completion.d/cargo）；配方按 bash-completion 规范落包内私有 share/bash-completion/completions/cargo，不写 /etc 共享前缀（R49）"
    - "版本映射：cargo 的 crate/tag minor 恒比所属 Rust 发行版大 1（上游 release.md 自述），故 CLI 1.97.0 → 仓库 tag 0.98.0；tag 0.97.0 属 Rust 1.96，误取会交付上一周期脚本"
    - "脚本挂 `command -v cargo` 守卫：无 cargo 时不注册补全，消费者测试必须提供 cargo 桩"
    - "运行期依赖 bash（complete/compgen 内建）、cargo（被补全对象）、bash-completion 框架函数（_get_comp_words_by_ref/_filedir/_comp_command_offset）；框架仅作加载与 helper 提供方，同族先例均不写入 requires"
  common_dependencies:
    - bash-completion

# 版本索引（所有已归档版本，含状态）
versions:
  "1.97.0":
    status: built
    build_date: "2026-09-21"
    conan_ref: "cargo-bash-completions/1.97.0"
