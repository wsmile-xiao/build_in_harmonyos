# 版本级 manifest — cargo-bash-completions 1.97.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.97.0"
software: "cargo-bash-completions"

# published | built | failed | archived
status: built

build_date: "2026-09-21"
# 无构建系统：交付物为上游源码树中的一个 bash 脚本，安装 = 复制
# （同族先例 docker-completion / pip-completion 同口径）
build_system: "custom"

source:
  # 包版本 1.97.0 = cargo CLI 对外版本；对应 rust-lang/cargo 仓库 tag 0.98.0
  # （crate/tag minor = Rust minor + 1，上游 release.md 自述；tag 0.97.0 属 Rust 1.96）
  url: "https://github.com/rust-lang/cargo/archive/refs/tags/0.98.0.tar.gz"
  sha256: "7c11186fb61d20a8237b777b35beedd224c1103934f35b85fdd64ea2a9c77f07"
  tar_format: tar.gz

build:
  system: custom
  configure_options: []
  dependencies: []
  # 不调用任何编译器：包内无 C/C++/Rust 编译单元
  cc: none
  cxx: none

patches_applied: []

knowledge_gained:
  - "cargo 版本映射：crate/tag 的 minor 恒比所属 Rust 发行版大 1（上游 src/doc/contrib/src/process/release.md 自述），故 CLI 1.97.0 → tag 0.98.0；可用 rust-lang/rust 同版本 tag 的 src/tools/cargo submodule sha 交叉验证"
  - "上游 bash 补全脚本路径为 src/etc/cargo.bashcomp.sh（非旧名 cargo.bash），安装名须为 cargo（bash-completion 规范：文件名 = 被补全命令名）"
  - "脚本整体挂在 `command -v cargo >/dev/null 2>&1 &&` 守卫下，PATH 无 cargo 时既不定义 _cargo 也不执行 complete 注册 —— 消费者测试必须提供 cargo 桩，否则会误判为空壳"
  - "补全候选依赖 bash-completion 框架函数 _get_comp_words_by_ref/_filedir/_comp_command_offset；CI clean 环境未必安装该框架，测试需自带轻量桩保证可复现"
  - "lang-preflight 对『上游为 Rust 仓库、交付物是其中 bash 脚本』的包默认口径判 rust 并写 env_unsupported 终态；按社区口径显式 --lang rust 如实声明后继续（本包不编译任何 Rust 代码，CI 无需 Rust 工具链）"
