package: cargo-bash-completions/1.97.0
homepage: "https://github.com/rust-lang/cargo"

# ── R51 上游测试清点（真实执行结果，非占位符）──────────────────────
# 交付物 = 上游 src/etc/cargo.bashcomp.sh 这一个 bash 补全脚本
# （源码取 tag 0.98.0 = cargo CLI 1.97.0，版本映射见 notes.md）。
#
# 1) 针对交付物的上游自动化测试：**0 个**
#    清点方式:
#      grep -rn "bashcomp" <src> --include='*.rs' --include='*.toml' --include='*.sh' \
#           --include='*.md' --include='Makefile*'
#      → 唯一命中 triagebot.toml:111 `trigger_files = ["src/etc/_cargo", "src/etc/cargo.bashcomp.sh"]`
#        （PR 自动打标签配置，不是测试）
#      find <src>/tests -iname '*completion*' → 0 命中
#    结论：上游对该补全脚本没有任何自动化测试（shellcheck/bats/单测均无）。
#
# 2) cargo 本体的上游测试（与本包交付物无交集，无法执行）：
#      tests/testsuite/*.rs = 152 个文件；`#[cargo_test]` 注册 = 4292 个；另有 tests/build-std
#    不执行的具体技术原因：这些是 Rust 集成测试，入口为 `cargo test`，需要 rustc+cargo
#    工具链；本仓库 CI（远端 clean 环境）无 Rust 工具链（SKILL W0b CI 能力矩阵：Rust ❌），
#    且它们验证的是 cargo 二进制行为，而本包既不构建也不交付 cargo 二进制。
#    —— 因此它们不计入本包的"上游用例"基数（基数以交付物为界 = 0）。
#
# upstream_check_command 取对交付物真实可执行、且适配阶段已实跑（rc=0）的静态检查，
# 与同族先例 pip-completion / docker-completion 同口径。
upstream_check_command: "bash -n src/etc/cargo.bashcomp.sh"

# conanfile.py build() 中是否集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游可实际执行的验证入口（适配阶段真实执行过，rc=0）
upstream_tests:
  - file: src/etc/cargo.bashcomp.sh
    source: cargo-0.98.0/src/etc/cargo.bashcomp.sh
    description: "静态语法检查（上游对该脚本唯一可机器化的验证入口；上游自身未注册任何测试）"
    command: "bash -n src/etc/cargo.bashcomp.sh"
  - file: src/etc/cargo.bashcomp.sh
    source: cargo-0.98.0/src/etc/cargo.bashcomp.sh
    description: "注册核验：source 后 complete -p cargo 必须输出 complete -F _cargo cargo"
    command: "bash -c 'source <installed>/cargo && complete -p cargo'"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_cargo_completion.sh
    description: "A1 产物存在非空 / A2 体积合理(11443B≥8192) / A3 bash -n / A4 负向：无 cargo 时守卫生效不注册 / A5 complete -p cargo 输出 -F _cargo / A6 cargo <TAB> 经 cargo --list+awk 真实产出子命令候选(build,check,run,test) / A7 cargo build --<TAB> 产出选项候选(--release,--target,--manifest-path) / A8 版本实证：cargo build -<TAB> 候选含 1.97 新增的 -m 短选项（对 1.96 脚本该断言实测失败，已反向验证）；bash-completion 框架函数与 cargo 均以轻量桩提供，CI clean 环境可复现"
    command: "bash test_cargo_completion.sh <completion_file_path>"

# assertion_count 只计 test_package 的 A1–A8
assertion_count: 8
