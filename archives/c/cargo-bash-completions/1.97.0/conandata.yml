# conandata.yml — cargo-bash-completions 1.97.0
#
# 源码取 rust-lang/cargo 官方 GitHub release 归档（R39：官方源，非镜像/搬运/个人 fork）。
#
# 版本映射（上游自述 + 交叉验证，详见 notes.md「源码获取」）：
#   cargo 的 crate/tag 版本号恒比其所属 Rust 发行版大一个 minor
#   （上游 src/doc/contrib/src/process/release.md：“The minor version is always 1
#    greater than the Rust release it is a part of, so cargo 0.49.0 is part of the
#    1.48 Rust release.”）。
#   因此 cargo CLI 1.97.0（随 Rust 1.97.0 分发）对应仓库 tag 0.98.0；
#   交叉验证：rust-lang/rust tag 1.97.0 的 src/tools/cargo submodule 指向
#   commit c980f4866141969fab6254a680546a277789d6f0，即 cargo tag 0.98.0。
#
# 注意：本文件只写官方 URL。W3/CI 的预下载步骤（ci/conan/build_and_test.sh）会临时把
# url 改写成 [镜像, 官方] 列表；镜像前缀入库会被 PF7 源URL闸拦截，提交前务必确认已还原。
#
# sha256 实测：对官方归档 4441392 字节 计算所得。

