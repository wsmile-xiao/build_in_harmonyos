# test_ohos/MANIFEST.yml — colorized-logs 2.7 HarmonyOS PC 专项验证
# 五项独立鸿蒙检查（run_ohos_test.sh，任一失败非零退出）：
#   T1_aarch64_elf    ELF64 AArch64（readelf -h）
#   T2_no_host_paths  无宿主绝对路径（/storage /home /Users）
#   T3_ansi_roundtrip 真实 ANSI 日志解码往返（ansi2txt 去色 + ansi2html 转义）
#   T4_ttyrec_replay  ttyrec 字节流（含 NUL 头）经管道重放
#   T5_pipetty_pty    pipetty openpty 伪终端分配并在 OHOS 内核路径可用
checks:
  - id: T1_aarch64_elf
    desc: ELF64 AArch64 (readelf -h)
  - id: T2_no_host_paths
    desc: no absolute host paths leaked into binary
  - id: T3_ansi_roundtrip
    desc: real ANSI log decode roundtrip (ansi2txt/ansi2html)
  - id: T4_ttyrec_replay
    desc: ttyrec byte stream with NUL header replayed over pipe
  - id: T5_pipetty_pty
    desc: pipetty allocates pty via openpty (OHOS kernel path)
assertion_count: 5
assertion_count_note: 5 machine checks (T1-T5)
test_language: c
test_framework: bare
framework_flavor: bare