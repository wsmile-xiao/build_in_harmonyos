# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: colorized-logs/2.7
homepage: "https://github.com/kilobyte/colorized-logs"

# 上游测试命令: ctest -N (CMake enable_testing + add_subdirectory(tests))
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure -C ."

# 上游实际运行的测试程序 (tests/testsuite Perl 脚本, 由 ctest 调度)
upstream_tests:
  - file: tests/testsuite
    source: colorized-logs-2.7/tests/testsuite
    description: "ansi2txt: 通过 unescape 管道将 ANSI 转义序列输入 ansi2txt, 校验纯文本输出"
    command: "ctest -R ansi2txt"
  - file: tests/testsuite
    source: colorized-logs-2.7/tests/testsuite
    description: "ansi2html: ANSI 文本转 HTML <pre> 块并反解校验"
    command: "ctest -R ansi2html"
  - file: tests/testsuite
    source: colorized-logs-2.7/tests/testsuite
    description: "pipetty: 子进程在 pty 中 isatty(0)=1"
    command: "ctest -R pipetty"
  - file: tests/testsuite
    source: colorized-logs-2.7/tests/testsuite
    description: "pipetty:sigobit: 信号字节位语义与 Terminated 输出"
    command: "ctest -R 'pipetty:sigobit'"
  - file: tests/testsuite
    source: colorized-logs-2.7/tests/testsuite
    description: "ttyrec2ansi: 重放 ttyrec 字节流输出可读文本"
    command: "ctest -R ttyrec2ansi"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者验证: 以真实用户方式调用安装后的 ansi2txt/ansi2html/ttyrec2ansi/pipetty, 校验可观察输出与退出码"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10