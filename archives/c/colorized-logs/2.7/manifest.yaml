# 版本级 manifest — colorized-logs 2.7
# 遵循 ARCHIVE-SPEC v2.0

version: "2.7"
software: "colorized-logs"

# 编译状态: built（conan-verify 全门禁通过；未执行远端 upload，由 CI release 流水线发布）
status: built
build_date: "2026-09-23"
build_system: cmake

source:
  url: "https://github.com/kilobyte/colorized-logs/archive/refs/tags/v2.7.tar.gz"
  sha256: "1fb97c9c90efd739f03dabd8cf5825c2afc95d1f1e0d6cacf62d53a8c540b3df"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_C_FLAGS=-fPIC -O2"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "pipetty/lesstty 依赖 openpty；OHOS 提供 util 库 openpty，libutil.h 不存在——CMake CHECK_LIBRARY_EXISTS(util openpty) 正确识别，无需补丁"
  - "OHOS mksh 的 $(...) 命令替换会丢弃二进制流中的 NUL 字节；含 NUL 的 ttyrec 头必须经临时文件/管道直接传输（与上游 testsuite 同法）"
  - "OHOS 上 `pipetty sh -c '...'` 形式不可用（返回非零且无输出），上游 `pipetty </dev/null sh <script文件>` 形式正常"
  - "colorized-logs 是纯 C 工具集（非 autotools），init-build 的构建系统猜测可能误判为 autotools，配方必须按实际 CMake 结构编写"
