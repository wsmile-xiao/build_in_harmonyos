package: critter/2.0.4
homepage: "https://github.com/mooflu/critter"

# ---------------------------------------------------------------------------
# 上游测试审计（critter 2.0.4 = mooflu/critter，SDL2 分支，非 criticalmass/1.0.2）
# 结论：上游没有任何可接入的测试套件 —— 全仓（排除 3rdparty/）grep
# "enable_testing|add_test|ctest|include(CTest)" 命中 0 行，
# grep "check|verify|BUILD_TESTING" 目标命中 0 行。
# ---------------------------------------------------------------------------
upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests_exist: false
upstream_tests: []
upstream_test_audit:
  - path: "CMakeLists.txt（顶层）"
    finding: >-
      仅 cmake_minimum_required/project/VERSION(git describe)/find_package/
      add_subdirectory，无 enable_testing()、无 add_test()、无 ctest 目标
  - path: "game/CMakeLists.txt"
    finding: "仅 add_subdirectory + add_executable + target_link_libraries，无测试目标"
  - path: "mooflu.common/tinyxml/xmltest.cpp"
    finding: >-
      全仓唯一含 test 字样的源文件，但 mooflu.common/tinyxml/CMakeLists.txt 只有
      add_library(tinyxml tinyxml.cpp tinyxmlerror.cpp tinyxmlparser.cpp)，
      从不编译 xmltest.cpp，也无 add_test/ctest 注册
  - path: "scripts/{build.sh,build-linux-no-oem.sh,build-emscripten.sh,cleanDeployments.py,server.py}"
    finding: "构建/清理/本地静态服务器脚本，无 make check / ctest / 测试命令"
  - path: "tools/"
    finding: "仅 Packer.cpp（资源打包工具），无测试"
  - path: "makefile（顶层）"
    finding: "仅 emscripten 构建路径，无 check/test/verify 目标"
  - path: ".github/workflows/native.yml、webapp.yml"
    finding: >-
      仅 cmake/make 或 emscripten 构建 + 制品上传 + Release 更新/Pages 部署，
      无任何测试步骤，也无依赖测试结果的门禁
  - path: "根目录 CI 配置"
    finding: "无 .travis.yml / .gitlab-ci.yml / Jenkinsfile / BUILD_TESTING 开关"

# ---------------------------------------------------------------------------
# 适配后由 test_package 补全的测试（6 用例 / 27 项断言）
# ---------------------------------------------------------------------------
test_package_tests:
  - file: conanfile.py
    description: >-
      静态校验 4 例（13 项断言），不依赖执行环境：
      packaged-layout（bin/critter 存在 + 可执行位 + bin/resource.dat 存在）；
      elf-ohos-aarch64（ELF64/LE、e_machine=AArch64(183)、ET_DYN(PIE)、
      PT_INTERP=/lib/ld-musl-aarch64.so.1、DT_NEEDED 含 gl4es 的 libGL.so.1）；
      resource-bundle（resource.dat 为合法 zip、CRC 校验通过、含
      system/config.txt、条目数 >= 200）；runenv-contract（VirtualRunEnv 已生成
      conanrun 脚本且其中含包导出的 LIBGL_GLES/LIBGL_EGL）。
      另含运行时候的 dep-versions-reported（6 项断言，比对运行时打印版本与
      conan 依赖版本）
    command: "<conan> create critter/2.0.4 -pr:h <ohos profile> -pr:b <ohos profile>"
  - file: test_critter.sh
    description: >-
      运行时冒烟 1 例（8 项断言）：把包内 bin/critter 复制到私有可写目录并
      self-sign 后在无头模式下启动一次，断言进程退出码 0、gl4es 初始化、
      GLES 2.0 后端生效（dlopen /system/lib64/libGLESv3.so）、gl4es 正常关闭、
      引擎版本横幅 "INFO: Critter 2.0.4"、PhysFS 挂载 ./resource.dat、
      Write Dir 已定位、~/.critter/config.txt 落盘
    command: "<CONFIG_SHELL> test_critter.sh <work dir> <pkg>/bin/critter"

assertion_count: 27
