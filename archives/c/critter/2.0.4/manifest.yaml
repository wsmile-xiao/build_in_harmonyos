version: "2.0.4"

software: "critter"

# Conan 引用（供下游与脚本按需精确引用）
conan_reference: "critter/2.0.4"

status: built

build_date: "2026-09-26"
build_system: "cmake"

source:
  url: "https://github.com/mooflu/critter/archive/refs/tags/2.0.4.tar.gz"
  sha256: "9ef67288bf409ba53abb79be15962935a4891ba903c2e04ffe1ceb509ef36584"
  tar_format: tar.gz

build:
  system: cmake
  toolchain: "conan CMakeToolchain + 显式 seed 上游遗留变量（SDL2_LIBRARIES/SDL2_IMAGE_LIBRARY/SDL2_MIXER_LIBRARY/PHYSFS_LIBRARY/PNG_LIBRARY/ZLIB_LIBRARY/OPENGL_LIBRARY）"
  configure_options:
    - "-DVERSION=2.0.4"
    - "-DCMAKE_BUILD_TYPE=<settings.build_type>（conan_toolchain.cmake 注入）"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DOPENGL_gl_LIBRARY=<gl4es>/lib/libGL.so"
    - "-DOPENGL_INCLUDE_DIR=<gl4es>/include"
    - "-DGLEW_USE_STATIC_LIBS=ON"
  dependencies:
    - zlib/1.3.1.1
    - libpng/1.6.58
    - sdl2/2.30.10
    - sdl2-image/2.8.12
    - sdl2-mixer/2.8.2
    - physfs/3.2.0.1
    - gl4es/1.1.6
    - glm/0.9.9.8
    - libwebp/1.6.0 (transitive, SDL2_image 静态库需显式链入)
    - libtiff/4.7.2 (transitive, SDL2_image 静态库需显式链入)
    - libjpeg-turbo/3.2.0 (transitive)
    - xz/5.6.2 (transitive)
    - zstd/1.5.7 (transitive)
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  # 每条均为「模式 + ref 引用」，ref 指向知识图谱条目 / 仓库既有先例 / 上游源码位置。
  - "上游版本辨识：critter 2.0.4（mooflu/critter，SDL2 分支）与 criticalmass/1.0.2 是不同代码库——前者为 SDL2+OpenGL 2.0 着色器管线，后者为 autotools SDL1 分支；所谓 'critter 1.0.2' 实为 criticalmass 1.0.2 的同源产物（同 sha256 846db2d3... 的 tar 包内 bin_PROGRAMS = critter）。reference: archives/c/criticalmass/1.0.2/manifest.yaml"
  - "gl4es 的 GL/gl.h 仅在 __EMSCRIPTEN__/__APPLE__ 下定义 GL_GLEXT_PROTOTYPES，而 glext.h 的 GL_VERSION_2_0/2_1/3_0 声明整段被该宏门控 → OHOS/Linux 上 GL 2.0+/3.0 原型缺失；C 源退化为隐式声明告警、C++ 直接硬错（同一工程 .c 过 .cpp 挂，极易误判为源码不兼容）。ref: knowledge/drafts/E702-draft-6FEC.kv"
  - "解法：下游 compat/GL/glew.h 在 include gl4es 的 <GL/gl.h> **之前**定义 GL_GLEXT_PROTOTYPES——gl4es 的 gl.h L2097 会无条件 include <GL/glext.h>，而 glext.h 的 GL 2.0+/3.0 原型块由 #ifdef GL_GLEXT_PROTOTYPES 门控，故「先定义」即让原型随 gl.h 一起可见。compat/glew-shim.c 以空实现补齐 GLEW 入口（glewInit（返回 GLEW_OK）、glewGetString、glewExperimental）与 gl4es 未导出符号（GL_KHR_debug 调试入口 glDebugMessageCallback/glDebugMessageControl + glBindBufferBase/glProgramParameteri/glBindFragDataLocation 三个 GL3 入口，均只被未被调用的辅助代码引用）。ref: knowledge/drafts/E702-draft-6FEC.kv"
  - "同类先例：GLEW 头 shim + 静态 shim 库随链接进入产物（logstalgia），以及 GL 面不可得时关闭相关构建特性而非硬造依赖（ball 的 BALL_HAS_VIEW=OFF）。reference: archives/l/logstalgia/1.1.4/conanfile.py, archives/b/ball/1.5.0-git20220524.d85d2dd/conanfile.py"
  - "禁止：把 GL_GLEXT_PROTOTYPES 定义放到 <GL/gl.h> **之后**、再靠二次 include <GL/glext.h> 补救——glext.h 的 __glext_h_ include guard 会让第二次 include 直接跳过，原型依旧缺失（这是本包首版文档写错、经 E702 复核纠正的一点）；也不得引宿主 libGLEW/系统头（ABI 与 feature 面不符，会把运行期判成支持 GL 4.x）。ref: knowledge/drafts/E702-draft-6FEC.kv（forbid_2 节）"
  - "上游 CMakeLists 的 VERSION 来自 git describe --always --tags，发布 tarball 无 git 元数据 → 必须显式 -DVERSION=，否则 FATAL_ERROR。reference: critter 2.0.4 上游 CMakeLists.txt L7-21"
  - "上游 CMakeLists 追加 -I${PROJECT_SOURCE_DIR}/3rdparty/glm，但 GitHub 发布包不含 3rdparty/ 目录 → glm 必须走制品仓（glm/0.9.9.8）。reference: critter 2.0.4 上游 CMakeLists.txt L49, game/Particles.cpp:1982"
  - "resource.dat 不在发布 tarball 内（上游由 scripts/build-linux-no-oem.sh 用 zip -9r data/ 生成），但 CMake add_executable 需要它先存在，且运行期由 PhysFS 以 ./resource.dat 相对工作目录挂载 → 构建期打包并安装到可执行文件同级目录。reference: critter 2.0.4 上游 CMakeLists.txt（RESOURCE_DAT）, game/main.cpp:79-88"
  - "上游无任何 install() 规则 → conan create 打不出产物，package() 必须手工落 bin/ + share/man/man6 + licenses。reference: critter 2.0.4 上游 game/CMakeLists.txt（无 install 语句）"
  - "gl4es 以 dlopen 方式加载 EGL/GLES 后端（不直接链接）→ 未导出 LIBGL_GLES/LIBGL_EGL 时运行期 SIGSEGV；package_info 必须导出二者指向 /system/lib64/libGLESv3.so 与 libEGL.so。reference: archives/l/logstalgia/1.1.4/conanfile.py package_info()"
  - "上游用自带 find-module（mooflu.common/utilscmake/）配遗留变量（SDL2_IMAGE_LIBRARY/PHYSFS_LIBRARY/PNG_LIBRARY/ZLIB_LIBRARY...），而 CMakeDeps 只产出现代 IMPORTED target → configure 前须显式 seed 全部遗留 cache 变量。ref: 本包 conanfile.py _cmake_args()"
  - "静态 libSDL2_image.a 编译进了 TIFF/WebP 支持，其后备库必须一起进入链接行（libwebp/libwebpdemux/libtiff），否则报 undefined reference。ref: 本包 conanfile.py _cmake_args() image_libs"
  - "OHOS 无桌面 GL/GLX，find_package(OpenGL) 须以 -DOPENGL_gl_LIBRARY=<gl4es>/lib/libGL.so + -DOPENGL_INCLUDE_DIR=<gl4es>/include 钉在 gl4es 上，避免落到系统 GL 头。ref: 本包 conanfile.py _cmake_args()"
  - "OHOS 的 /bin/sh 是 mksh 且会重置 LD_LIBRARY_PATH（导致 Error loading shared library libc++_shared.so）→ 全部 self.run 必须 env=\"conanbuild\" 走 profile 的 CONFIG_SHELL=bash。reference: archives/l/logstalgia/1.1.4/conanfile.py _bash()/_run_bash()"
  - "zlib 版本菱形（Conflict between zlib/1.3.2 与 1.3.1.1，源自 libpng 与 libtiff 的下限不一致）→ 直接 requires zlib/1.3.1.1 并与 libpng/1.6.58 对齐即可消解，运行期用 banner（zlib Version 1.3.1 / PNG Version 1.6.58）复核。reference: archives/c/criticalmass/1.0.2/conanfile.py（同款钉法）"
  - "无头环境的 SDL 驱动器选择：SDL_VIDEODRIVER=none 在缺 gl4es 后端变量时 SIGSEGV、耗时统计异常；改用 SDL_VIDEODRIVER=invalid（走失败分支、稳定 rc=0、不挂死）。ref: 本包 test_package/test_critter.sh"
  - "上游无 --version/--help（CLI 只识别 +keyword value / -keyword value / -keyword 三形式），test_package-executable 模板的默认冒烟不适用 → L2 改以「实跑 + 断言运行期横幅 Critter 2.0.4 + 退出码 0」实现。reference: mooflu.common/utilsfs/Config.cpp:78（updateFromCommandLine）"
  - "日志落点：Trace::Log → tcout() 在未定义 TRACE 时写 cout（定义 TRACE 则落 trace.txt），测试断言 stdout 即位。reference: mooflu.common/utils/Trace.cpp:29-38, Trace.hpp:34"
  - "上游测试面审计结论：顶层与 game/CMakeLists.txt 从未 enable_testing()/add_test()、无 ctest；唯一含 test 字样的 mooflu.common/tinyxml/xmltest.cpp 从未被 tinyxml/CMakeLists.txt 编译；scripts/ 与 tools/ 无 check 目标 → 属「上游无测试用例」，需下游补 test_package 并以无头运行时冒烟实质覆盖。ref: 本包 test_package/MANIFEST.yml"
  - "GLU 无需 shim：上游 mooflu.common/utilsgl/miniglu.hpp 自带 static inline gluPerspective/gluOrtho2D（且未被调用），故不引入 libGLU 依赖。reference: mooflu.common/utilsgl/miniglu.hpp:49,62"

