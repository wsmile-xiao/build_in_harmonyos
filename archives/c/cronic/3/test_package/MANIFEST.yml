# test_package/MANIFEST.yml
# Upstream test declaration for cronic 3 (required by CI L0e).
package: "cronic/3"
homepage: "http://habilis.net/cronic/"
upstream_repo: "https://github.com/justincase/cronic"

# ── R51 upstream test inventory ──────────────────────────────────────────────
# The official Cronic v3 archive (commit 6e627fbe5498c360d091d9ecd06b0ac242704566)
# contains exactly three files: LICENSE, README.md and the 854-byte `cronic`
# bash script. There is no tests/ directory, no Makefile / CMakeLists.txt /
# configure / meson.build / setup.py, no CTest/pytest registration and no
# functional test script. Upstream ships no automated test suite, so there is
# nothing to run in build(); functional verification is supplied by this
# test_package. See notes.md for the full inventory evidence.
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_count: 0
upstream_test_evidence: >-
  Flat archive with 3 regular files (LICENSE 6625 B, README.md 4121 B,
  cronic 854 B); `find . -type f` yields no other entries and no directories.
  No tests/, no build system, no test runner configuration.

# ── test_package supplied tests ──────────────────────────────────────────────
test_package_tests:
  - file: "test_cronic.sh"
    count: 6
    description: >-
      Generic behaviour of the installed cronic script (invoked as
      `bash <pkg>/bin/cronic`): silence when the command succeeds with no
      output; a report containing "Cronic detected failure" and
      "RESULT CODE: 1" on a non-zero exit; a report containing the stderr text
      and "RESULT CODE: 0" when the command succeeds but writes to stderr.
    command: "bash test_cronic.sh <package>/bin/cronic"
  - file: "test_cronic_ohos.sh"
    count: 14
    description: >-
      HarmonyOS-specific runtime constraints (6 cases / 14 assertions):
      OHOS-1 runtime tools + `#!/bin/bash` baseline (no /bin/bash on HarmonyOS,
      so direct execution fails and `bash <script>` is required);
      OHOS-2 exec-bit independence (HMDFS normalises chmod 0644 -> 0660) with
      byte-identical output; OHOS-3 writable-TMPDIR requirement (HarmonyOS /tmp
      is read-only), mktemp cleanup and loud rejection of a missing TMPDIR;
      OHOS-4 UTF-8 stdout/stderr echo plus space-in-TMPDIR never passing
      silently; OHOS-5 HNP bash (/data/service/hnp/bin/bash) parity with the
      default bash; OHOS-6 read-only-/tmp trap (TMPDIR unset must fail).
      OHOS-1(/bin/bash), OHOS-5 and OHOS-6 are platform-conditional and print
      SKIP when the host does not expose the HarmonyOS condition.
    command: "bash test_cronic_ohos.sh <package>/bin/cronic"
test_package_assertion_count: 20
harmonyos_test_count: 6
harmonyos_assertion_count: 14
assertion_count: 20
counting_policy: "Named test cases; each expect_contains/expect_empty (generic) or ok/bad (OHOS) call counts as one assertion. 6 generic + 14 OHOS = 20."
