knowledge_gained:
  - "Conan 2.x 拒绝单字符版本号（RecipeReference 正则 ^[a-z0-9_][a-z0-9_+.-]{1,100}$，>=2 字符）：目录保持任务卡 '3'，用 set_version() 得制品 cronic/v3（先例 cutmp3/4、rapidhash/3）"
  - "纯脚本包：package_type=application + package_id 清空；HMDFS 执行位不可靠，调用方须显式 bash <pkg>/bin/cronic（鸿蒙无 /bin/bash，bash 在 /data/service/hnp/bin）"

conan:
  reference: "cronic/v3"
  package_type: application
  architecture_independent: true
  user_channel: "ohpcd/stable"

