software: cronic
display: "cronic"
description: "cron 任务输出包装脚本：仅在命令失败或产生非空 stderr 时输出报告，避免 cron 邮件轰炸"
category: system
homepage: "http://habilis.net/cronic/"
license: "CC0-1.0"
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 bash 脚本包，无编译单元、无构建系统、无上游测试；解析源码后直接安装"
    - "package_type=application + package_id 清空，产物与 os/arch/compiler 无关"
    - "HMDFS 上 chmod 常被忽略、执行位不可靠；配方尽力 chmod 0755 但调用方应显式 bash <pkg>/bin/cronic"
    - "鸿蒙无 /bin/bash，bash 位于 /data/service/hnp/bin/bash（已在 PATH），不可依赖脚本 shebang"
    - "Conan 2.x 拒绝单字符版本：目录保留任务卡 '3'，制品版本经 set_version() 取上游标签 v3"
    - "鸿蒙专项测试 test_cronic_ohos.sh：6 用例 / 14 断言（无 /bin/bash 的 shebang 基线、HMDFS 执行位归一化、可写 TMPDIR 与 mktemp 清理、UTF-8、HNP bash、只读 /tmp 陷阱）；test_package 合计 9 用例 / 20 断言"
  common_dependencies: []

versions:
  "3":
    status: built
    build_date: "2026-09-14"
    conan_ref: "cronic/v3"
