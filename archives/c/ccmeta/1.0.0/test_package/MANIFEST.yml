package: ccmeta/1.0.0
homepage: "https://github.com/Alfredvc/ccmeta"

# Upstream has no test framework — only demo recording and shell skills
upstream_tests_exist: false
upstream_test_audit: "Audited upstream source tree (commit 26e7b1d): only skills/*.md, shared/*.sh, demo/*.tape/gif, hooks/pre-commit, scripts/sync-shared.sh — no tests/ directory, no Makefile/CMakeLists test target, no test harness. Extract script ci/tools/extract_upstream_tests.sh returns empty. Therefore status no_tests with reason."
upstream_test_reason: "Upstream is a Claude Code Agent Skill framework (shell + markdown), not a compiled library; no test suite provided"

# 上游测试命令 — 无测试套件，故 check 命令不适用（空串），避免 hmbs 清单器误判为存在测试
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_ccmeta.sh
    description: "Validate installed ccmeta core script, skills and wrapper"
    command: 'sh test_ccmeta.sh $PKG'

assertion_count: 4
