software: chamber
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/homebrew/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "homebrew"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统
build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/segmentio/chamber/archive/refs/tags/v3.1.5.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建命令
  build_command: "go build -o chamber ."

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "go/1.26.4"

  # 编译器
  cc: clang
  cxx: clang++

  # Go 特有信息
  go_version: "1.26.4"
  go_module: "github.com/segmentio/chamber/v3"
  go_module_version: "v3.1.5"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go 项目使用 go build 直接编译，无需 configure/make"
  - "chamber 是 Go 编写的 AWS Secrets Manager CLI，使用 cobra 框架"
  - "GitHub 直接下载超时，使用 GOPROXY=https://goproxy.cn 加速 Go 模块下载"
  - "chamber 不支持 --version flag，使用 chamber version 子命令获取版本"
  - "从 Go 模块缓存获取源码，复制到 work/orig 目录后用 --no-download 初始化"
