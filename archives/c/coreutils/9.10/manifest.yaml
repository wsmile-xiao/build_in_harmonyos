version: "9.10"
software: coreutils
status: published
build_date: "2026-08-06"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/coreutils/coreutils-9.10.tar.xz"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--prefix=$TEST_PREFIX"
    - "CFLAGS=-fPIC -O2 -g"
  dependencies: []
  cc: "Clang 15.0.4 (HarmonyOS NDK)"
  cxx: clang++

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-lib-freadahead.c.patch"
  - "0003-lib-freadptr.c.patch"
  - "0004-lib-freadseek.c.patch"
  - "0005-src-cat.c.patch"
  - "0006-src-dd.c.patch"
  - "0007-src-head.c.patch"
  - "0008-src-od.c.patch"
  - "0009-src-sort.c.patch"
  - "0010-src-split.c.patch"
  - "0011-src-tail.c.patch"
  - "0012-src-wc.c.patch"

knowledge_gained:
  - "fstat()/lseek() 对管道返回 EACCES，需要 __OHOS__ 守卫降级处理"
  - "SELinux 上下文 hmdfs:s0 限制软链接操作，toybox_exec:s0 不受限"
  - "config.status umask 077 在 HMDFS 上创建临时目录权限不足，需修改为 umask 0"
  - "automake/makeinfo 缺失时可通过 ACLOCAL=true MAKEINFO=true 绕过"
  - "101 个二进制全部编译成功，100/101 --version 通过（false 预期失败）"

binary_count: 101
man_page_count: 100
excluded_count: 0
excluded_commands: {}

test_results:
  method: "staging verification + conan test_package"
  staging_verification: "100/101 --version PASS (99%, false expected fail)"
  conan_test: "6/6 PASS (echo, cat, sort, wc, date, expr)"

patch_generation:
  method: per-file-difflib
  patches_count: 12

conan_recipe:
  conanfile: true
  conandata: true
  test_package: true
  commands_json: true
