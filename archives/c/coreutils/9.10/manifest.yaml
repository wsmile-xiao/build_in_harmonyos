software:
  name: coreutils
  version: "9.10"
  display_name: "GNU Coreutils"
  description: "GNU 核心工具集 — 文本/文件/系统操作基础命令 (86个命令, 排除14个不兼容)"
  homepage: https://www.gnu.org/software/coreutils/
  source_url: https://ftp.gnu.org/gnu/coreutils/coreutils-9.10.tar.xz
  license: GPL-3.0-or-later

status: success#final

compile_date: "2026-04-09"
build_config:
  build_system: autotools
  target_platform: aarch64-unknown-linux-ohos
  compiler: "Clang 15.0.4 (via HarmonyOS NDK)"
  c_library: musl libc
  configure_args: "--prefix=$TEST_PREFIX CFLAGS='-fPIC -O2 -g'"
  make_args: "-j1"
  install_args: "make install prefix=\$TEST_PREFIX"

dependencies: []  # 无额外依赖

compatibility:
  os_min_version: "HarmonyOS HongMeng Kernel 1.11.0"
  architecture: aarch64
  notes: |
    - 14个命令因SELinux软链接限制或syscall不支持被排除
    - 排除命令应使用 toybox 替代版本
    - od.c fstat EACCES 问题已通过补丁0003修复
    - tac >16KB单行有double-free边界case(已排除)
    - chroot syscall 不支持(已排除)

package_file: coreutils-9.10-ohos-aarch64.tar.gz
package_size: 11M
debug_package_size: 17M
binary_count: 86
man_page_count: 100

packaging:
  script_type: zsh  # v10: 从 sh 迁移为 zsh
  signing_tool: binary-sign-tool (adhoc self-sign)
  strip_mode: llvm-objcopy --strip-debug
  verified_extraction: true  # 解压后二进制可正常执行

test_results:
  total_tested: 1117
  pass: 334
  fail: 128
  skip: 573
  error: 82
  pass_rate_pct: 30
  test_method: "make check (~50min, SED路径修正后)"
  staging_verification: "82/83 --version PASS (99%)"
  extraction_verification: "14/14 排除确认 + 14/14 随机二进制执行通过"

exclude_list:
  count: 14
  category_a_selinux_link: # 12个
    - ln link unlink realpath readlink ls cp mv rm stat chmod chown chgrp
  category_b_system_compat: # 2个
    - chroot  # syscall不支持, Signal 31 core dump
    - tac     # >16KB单行 double-free (musl libc xrealloc兼容性)

patches:
  - file: "patches/0001-add-harmonyos-support.patch"
    description: "config.guess + lib/freadahead.c HarmonyOS系统检测支持"
    status: applied
  - file: "patches/0002-fix-fstat-for-harmonyos.patch"
    description: "cat/dd/head/sort/tail/wc/split fstat/lseek EACCES降级处理"
    status: applied
  - file: "patches/0003-fix-od-fstat-for-harmonyos.patch"
    description: "od.c skip()函数fstat EACCES降级处理(补丁2遗漏)"
    status: applied_and_verified

archive_status: finalized
finalized_at: "2026-04-09T00:35:00+08:00"
