# GNU coreutils 9.10 编译档案

software: coreutils
version: 9.10
status: partial
build_system: autotools
compile_date: 2024-03-19

dependencies:
  required: []
  optional: [gmp, libcap, selinux]

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
    - --disable-libcap
    - --disable-selinux
  cflags: "-fPIC -O2"
  env:
    CC: clang
    AR: llvm-ar
    RANLIB: llvm-ranlib

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: 添加 HarmonyOS 系统检测支持
    lines_changed: 30
  - file: 0002-fix-fstat-for-harmonyos.patch
    purpose: 修复 fstat 对管道/终端返回 EACCES 的问题
    lines_changed: 100
  - file: 0003-fix-musl-compat.patch
    purpose: musl libc 兼容性修复（FILE 结构体差异）
    lines_changed: 150

compatibility:
  level: medium
  issues:
    - SELinux 限制软链接访问
    - 部分命令（ls, rm, cp）无法处理软链接
    - toybox 命令可以正常处理软链接
  notes: |
    - 大部分命令正常工作
    - 涉及软链接操作的命令需要使用 toybox 版本
    - 建议设置别名使用 toybox 的 ls, rm, cp, mv
  syscalls:
    available: [stat, open, read, write]
    missing: []
    workaround: [use_toybox_for_symlink]

test_results:
  type: manual
  total: 0
  passed: 0
  failed: 0
  note: "通过实际使用验证功能"
  key_features:
    - cat, head, tail
    - grep, sed, awk
    - chmod, chown（非软链接）
    - touch, mkdir, rmdir

knowledge_gained:
  - "GNU coreutils 假设 glibc 的 FILE 结构体"
  - "musl 的 FILE 是不透明类型，需要条件编译"
  - "HarmonyOS SELinux 限制软链接访问"
  - "toybox 命令可以处理软链接"

references:
  - title: GNU coreutils 官方
    url: https://www.gnu.org/software/coreutils/
  - title: coreutils 下载
    url: https://ftp.gnu.org/gnu/coreutils/coreutils-9.10.tar.gz

maintainer: OpenHarmony Community
last_updated: "2024-03-19"
tags: [coreutils, gnu, utilities]