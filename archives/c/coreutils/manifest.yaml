software: coreutils
display: "GNU Coreutils"
description: "GNU 核心工具集 — 文本/文件/系统操作基础命令"
category: system
homepage: "https://www.gnu.org/software/coreutils/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "fstat()/lseek() 对管道/终端/Socket 返回 EACCES，需补丁降级处理"
    - "SELinux 软链接限制导致 12 个命令需使用 toybox 替代"
    - "chroot syscall 不支持，tac 有 double-free 边界 case"
    - "86 个命令正常工作，14 个排除"
    - "编译后需排除 14 个不兼容命令再打包"
  common_dependencies: []

versions:
  "9.10":
    status: published
    build_date: "2026-04-09"
