sources:
  url: "https://codeload.github.com/rwpenney/cryptmount/tar.gz/refs/tags/v6.4.0"
  sha256: "5ea65c48e854f486116230ea0fb092bdd731d36148e8083b2817a7696e28d688"

patches:
  - patch_file: "patches/0001-destdir-unprivileged-install.patch"
    patch_description: >-
      Skip root ownership and setuid changes in a Conan DESTDIR, while preserving
      direct system installation.
    patch_type: "packaging"
  - patch_file: "patches/0002-mntent-addmntent-fallback.patch"
    patch_description: >-
      Probe the GNU addmntent extension and provide an escaped mntent writer only
      when the HarmonyOS C library does not export it.
    patch_type: "portability"

  - patch_file: "patches/0003-cmtab-source-path.patch"
    patch_description: >-
      Use the source path for cmtab.example from the recursive top-level install hook.
    patch_type: "packaging"

  - patch_file: "patches/0004-omit-linux-sysinit.patch"
    patch_description: >-
      Omit Linux init scripts, systemd units and modules-load installation for HarmonyOS PC.
    patch_type: "packaging"
