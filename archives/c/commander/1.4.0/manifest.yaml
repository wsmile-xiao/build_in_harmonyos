# 知识沉淀
# ============================================================

knowledge_gained:
  - "conanfile.py 的 self.run() cwd 是 build 目录（basic_layout），编译源文件必须用 self.source_folder 绝对路径，且 conan copy() 默认 keep_path=True 会把 src/commander.h 装进 include/src/ 子目录，header 复制需 keep_path=False (knowledge_ref: DRAFT-commander-1.4.0-makefile-recipe-build-package-traps)"
  - "Conan 2.29 无 tools.build:compiler_executables:c 单项 conf，须用字典键 tools.build:compiler_executables 读取 c/ar/ranlib（R33 编译器来源）(knowledge_ref: DRAFT-commander-1.4.0-makefile-recipe-build-package-traps)"
  - "commander (clibs) 是 C 库非 CLI：上游 Makefile 仅 test/clean 目标，无 install；recipes 需自行构建静态库 libcommander.a 并将头文件装入 include/ (knowledge_ref: DRAFT-commander-1.4.0-makefile-recipe-build-package-traps)"