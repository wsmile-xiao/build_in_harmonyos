# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: commander/1.4.0
homepage: "https://github.com/clibs/commander"

# 上游测试命令 (Makefile test 目标)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./test"

# 上游实际运行的测试程序 (唯一用户测试源 test.c -> ./test)
upstream_tests:
  - file: test.c
    source: commander-1.4.0/test.c
    description: "上游唯一测试程序: 注册 -v/-r/-o/--omit-short 选项并解析 argv，校验回调/参数捕获/错误路径退出码"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_consumer.c
    description: "消费者用例: 模拟上层 CLI 组件，仅用公开头文件+libcommander.a，解析真实命令行并输出可观察结果"
    command: "./test_commander -v -o out.txt -n 3 in1 in2"
  - file: test_harmonyos.c
    description: "鸿蒙专项测试: 真实调用 commander API，断言默认选项/必需可选参数/组合短旗标/-- 分隔/致命路径退出码；打印 OHOS 编译器宏证据"
    command: "./test_harmonyos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11