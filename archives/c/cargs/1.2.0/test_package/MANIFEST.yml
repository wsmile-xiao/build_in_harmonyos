# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: cargs/1.2.0
homepage: "https://github.com/likle/cargs"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target test"

# 上游实际运行的测试程序（23个测试用例）
upstream_tests:
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_complex - 复杂选项组合测试"
    command: "./cargstest option_complex"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_mixed - 混合选项测试"
    command: "./cargstest option_mixed"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_ending - 选项结束标记测试"
    command: "./cargstest option_ending"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_long_missing_value - 长选项缺失值测试"
    command: "./cargstest option_long_missing_value"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_short_missing_value - 短选项缺失值测试"
    command: "./cargstest option_short_missing_value"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_long_space_value - 长选项空格分隔值测试"
    command: "./cargstest option_long_space_value"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_short_space_value - 短选项空格分隔值测试"
    command: "./cargstest option_short_space_value"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_long_equal_value - 长选项等号分隔值测试"
    command: "./cargstest option_long_equal_value"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_short_equal_value - 短选项等号分隔值测试"
    command: "./cargstest option_short_equal_value"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_combined - 组合短选项测试"
    command: "./cargstest option_combined"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_unknown_long - 未知长选项测试"
    command: "./cargstest option_unknown_long"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_unknown_long_shift - 未知长选项移位测试"
    command: "./cargstest option_unknown_long_shift"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_unknown_short - 未知短选项测试"
    command: "./cargstest option_unknown_short"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_unknown_short_shift - 未知短选项移位测试"
    command: "./cargstest option_unknown_short_shift"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_alias - 选项别名测试"
    command: "./cargstest option_alias"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_simple_long - 简单长选项测试"
    command: "./cargstest option_simple_long"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_simple - 简单选项测试"
    command: "./cargstest option_simple"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_boundaries - 边界测试"
    command: "./cargstest option_boundaries"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_boundaries_mix - 混合边界测试"
    command: "./cargstest option_boundaries_mix"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_long_prefix - 长选项前缀测试"
    command: "./cargstest option_long_prefix"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_print - 打印格式化测试"
    command: "./cargstest option_print"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_error_print_short - 短选项错误打印测试"
    command: "./cargstest option_error_print_short"
  - file: test/option_test.c
    source: cargs-1.2.0/test/option_test.c
    description: "option_error_print_long - 长选项错误打印测试"
    command: "./cargstest option_error_print_long"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 - 验证 cargs 库可正常链接和调用"
    command: "./test_cargs"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 100
