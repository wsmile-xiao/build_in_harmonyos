software: catcodec
display: "catcodec"
description: "OpenTTD 音效样本目录(.cat)编解码命令行工具: 在 .cat 样本目录与 PCM WAV/.sfo 文件之间转换"
category: utility
homepage: "https://www.openttd.org/"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "GNU Make 直接构建(无 autotools/cmake): 编译器取自 Conan conf (R33), SHELL 强制为 HNP bash"
    - "无源码补丁、无第三方依赖(仅 libc/C++ 标准库)"
    - "上游无测试套件; test_package 程序化构造 PCM WAV 做编解码往返 + 6 条错误路径"
  common_dependencies: []

versions:
  "1.0.5":
    status: built
    build_date: "2026-09-05"
