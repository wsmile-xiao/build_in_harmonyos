software: catcodec
version: "1.0.5"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (R39: official source)
  url: "https://cdn.openttd.org/catcodec-releases/1.0.5/catcodec-1.0.5-source.tar.xz"

  # 源码校验和
  sha256: "47ff4e6d663e19d529960c76f1e1bda5fe4cad97e2628381ec3a894ba260e0e1"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表 (Makefile 无 configure; 变量在 build() 传入)
  configure_options:
    - "make -j1 SHELL=/data/service/hnp/bin/bash CXX=<conan conf clang++>"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Makefile 构建(OpenTTD catcodec): 无 configure; Makefile 生成 src/rev.cpp 需要 $(shell)/findversion.sh/cut, 须 make SHELL=<HNP bash>"
  - "R33: build() 编译器必须来自 conan conf (tools.build:compiler_executables:cpp), 不能裸用 ${CXX}"
  - "上游无测试套件(tarball 无 tests/ 目录, Makefile 无 check/test 目标); 测试全程序化: bash 生成 RIFF/PCM WAV -> catcodec -e 编码 -> -d 解码 -> cmp 字节比对"
  - "错误路径验证要点: 全零 .cat 头(0 样本)是合法空目录解码成功, 构造损坏 .cat 需 count>=8 且主体截断才触发拒绝"
