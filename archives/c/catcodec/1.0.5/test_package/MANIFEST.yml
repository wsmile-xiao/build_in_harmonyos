# test_package/MANIFEST.yml — catcodec/1.0.5
# 上游官方测试声明 + test_package 测试统计
# 计数与 conanfile.py docstring、test_package/conanfile.py docstring、
# test.sh 头部注释、PR 描述五处同步。

package: catcodec/1.0.5
homepage: "https://www.openttd.org/"

# 上游没有测试套件: 源码树无 tests/ 目录, Makefile / Makefile.bundle 无
# check / test 目标(仅 bundle/install), 因此这里无上游测试可运行。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证; 驱动安装后的 catcodec CLI)
test_package_tests:
  - file: test.sh
    description: >
      11 个用例 / 28 断言, 全部程序化构造(零外部数据文件):
      上游行为复现 5 用例(16 断言): help/version 输出; 8bit 11025Hz WAV -> .cat
      编码; .cat -> WAV 解码字节级一致; 16bit 22050Hz 往返; 双样本目录解码后
      .sfo 元数据与两个 WAV 全部再生。
      新增错误路径/边界 6 用例(12 断言): 非 .cat 扩展名; 输入文件不存在;
      截断 .cat; 损坏 .cat 头; 不支持的 WAV 采样率; 非法 .sfo 行。
    command: "./test.sh (由 test_package/conanfile.py 以 bash 执行)"

# 测试断言总数
assertion_count: 28
