# test_package/MANIFEST.yml
# 上游测试声明文件
# CI 门禁 (build_and_test.sh L0e) 强制要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md
#
# chunkio 1.5.2 的上游测试是自带的 acutest 套件（tests/ + tests/lib/acutest），
# 由 tests/CMakeLists.txt 在 CIO_TESTS=On 时构建。
# 计数口径 = 「框架注册数」：acutest 的 TEST_LIST 条目（`<prog> --list` 输出）。
# 四种口径不混用（源码宏数 / 框架注册数 / assertion 数 / 消费者断言数），
# 本文件的 case 计数全部来自 --list 实读，assertion_count 单列。

package: chunkio/1.5.2
homepage: "https://github.com/fluent/chunkio"

# 上游测试命令 (用于 ctest -N / --list 分析)
upstream_check_command: "ctest --output-on-failure -V"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -V（4 个 ctest 注册程序）+ 直接执行 <build>/tests/cio-fs_perf 与 <build>/tests/cio-fs_fragmentation（上游 add_test 被注释的 2 个性能程序）"

# 清点方法与读数（全部为实测，取自 CIO_TESTS=On 的干净构建树）
#   ctest -N                        -> Total Tests: 4
#   <prog> --list                   -> context 3 / memfs 1 / stream 1 / fs 11 = 16
#                                       fs_perf 6 + fs_fragmentation 2 = 8
#   合计 N = 24（候选数法取最大：ctest 4 个程序口径 4、acutest 案例口径 24；
#                差额归因：ctest 以「程序」为单位 4，acutest 以「案例」为单位 24）
upstream_case_count: 24

upstream_tests:
  - file: tests/context.c
    source: chunkio-1.5.2/tests/context.c
    description: "acutest 上下文测试（context / log_level / open_flags），ctest 注册 cio-test-context"
    command: "ctest -R cio-test-context"
    cases: 3
  - file: tests/memfs.c
    source: chunkio-1.5.2/tests/memfs.c
    description: "acutest memfs 后端写入测试（memfs_write），ctest 注册 cio-test-memfs"
    command: "ctest -R cio-test-memfs"
    cases: 1
  - file: tests/stream.c
    source: chunkio-1.5.2/tests/stream.c
    description: "acutest stream 删除测试（stream_delete），ctest 注册 cio-test-stream"
    command: "ctest -R cio-test-stream"
    cases: 1
  - file: tests/fs.c
    source: chunkio-1.5.2/tests/fs.c
    description: "acutest 文件系统后端 11 个用例（fs_write/fs_checksum/fs_up_down/fs_size_chunks_up/issue_51/issue_flb_2025/issue_write_at/fs_up_down_up_append/fs_deep_hierachy/legacy_success/legacy_failure），ctest 注册 cio-test-fs"
    command: "ctest -R cio-test-fs"
    cases: 11
  - file: tests/fs_perf.c
    source: chunkio-1.5.2/tests/fs_perf.c
    description: "acutest 性能用例 6 个（write_realloc_32/128/512、write_up_down_500/1000/10000）。上游 tests/CMakeLists.txt 对该程序的 add_test() 被注释（注释原文：for dev purposes... not registered），因此 ctest 不含它；配方在 build() 中直接执行该二进制，用例仍计入上游分母（argparse/3.2 先例：分母=全部用例）。"
    command: "<build>/tests/cio-fs_perf"
    cases: 6
    registered_in_ctest: false
  - file: tests/fs_fragmentation.c
    source: chunkio-1.5.2/tests/fs_fragmentation.c
    description: "acutest 性能/裁剪用例 2 个（trim / no_trim）。同上，上游 add_test() 被注释，由配方直接执行。"
    command: "<build>/tests/cio-fs_fragmentation"
    cases: 2
    registered_in_ctest: false

# 上游未纳入 ctest 的测试程序（如实登记，不从分母中剔除）
upstream_not_registered:
  - "tests/CMakeLists.txt 中 UNIT_PERF_TESTS 的 add_test() 行被上游注释：cio-fs_perf（6 例）、cio-fs_fragmentation（2 例）—— 配方在 build() 中直接执行，均已 PASS"
  - "tests/data/gen.sh 是数据生成脚本，非测试用例"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_chunkio.c
    description: "消费者冒烟测试：两个版本指纹（安装头 + 链接库自报 1.5.2）、memfs 后端写读回环、fs 后端 mmap 文件落盘（覆盖 patch 0004 的 fallocate→ftruncate 回退路径）；17 个 CHECK，经 find_package(chunkio) + chunkio::chunkio 真实链接"
    command: "./bin/test_chunkio"

# 上游测试断言总数（TEST_CHECK/TEST_ASSERT 出现次数，单独口径，不与用例数混用）
assertion_count: 145
assertion_count_breakdown: "context 22 + memfs 5 + stream 2 + fs 98 = 135（ctest 注册程序）；fs_perf 7 + fs_fragmentation 3 = 10（未注册性能程序）；合计 145"
test_package_assertion_count: 17
