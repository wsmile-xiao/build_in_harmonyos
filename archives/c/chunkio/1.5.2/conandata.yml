# chunkio 1.5.2 — source of truth for the source archive and the patch set.
# conanfile.py reads `sources` via self.conan_data["sources"] and applies the
# list below with apply_conandata_patches() (patch_ng, default strip=0, which
# is the form these diffs are written in).

sources:
  "1.5.2":
    url: "https://github.com/fluent/chunkio/archive/refs/tags/v1.5.2.tar.gz"
    sha256: "c73e809215454c34a79ed2a7d38abc6058da99dad8564de85e2919100fb987a5"

patches:
  "1.5.2":
    # conan-center-index recipe for chunkio/1.5.2 (kept byte-identical so the
    # packaging stays in sync with CCI).
    - patch_file: "patches/0001-add-installer.patch"
      patch_description: "add install() rules for headers and libraries and stop building the cio CLI (upstream ships no install rules at all)"
      patch_type: "portability"
      strip: 0
    - patch_file: "patches/0002-disable-pic.patch"
      patch_description: "make POSITION_INDEPENDENT_CODE conditional so the conan fPIC option is honoured instead of being hardwired ON"
      patch_type: "portability"
      strip: 0
    # HarmonyOS / OHOS adaptations (device evidence in notes.md).
    - patch_file: "patches/0003-ohos-fts-to-nftw.patch"
      patch_description: "musl/HarmonyOS ships no <fts.h>: fall back to a POSIX nftw(3) recursive delete in cio_utils_recursive_delete"
      patch_type: "portability"
      strip: 0
    - patch_file: "patches/0004-ohos-fallocate-ftruncate-fallback.patch"
      patch_description: "fallocate(2)/posix_fallocate(3) are denied with EACCES on HMDFS/tmpfs: fall back to ftruncate(2) when pre-allocation is refused"
      patch_type: "platform"
      strip: 0
    - patch_file: "patches/0005-ohos-tests-tmpdir.patch"
      patch_description: "acutest suite hardcodes /tmp/ (read-only erofs on OHOS): move the test scratch tree into the writable build directory"
      patch_type: "test"
      strip: 0
