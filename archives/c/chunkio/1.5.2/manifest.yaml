# chunkio 1.5.2 — 版本级 manifest（ARCHIVE-SPEC v3.0，交叉校验元数据，CI 不读取）
# 与 conandata.yml / conanfile.py 保持一致；不一致时以 conandata.yml 为准。

version: "1.5.2"
software: "chunkio"

# built = conan verify 通过、尚未 upload（O5：合并并确认 release upload 前不得写 published）
status: built
build_date: "2026-09-26"
conan_ref: "chunkio/1.5.2"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://github.com/fluent/chunkio/archive/refs/tags/v1.5.2.tar.gz"
  sha256: "c73e809215454c34a79ed2a7d38abc6058da99dad8564de85e2919100fb987a5"
  tar_format: tar.gz

# ============================================================
# 构建配置（与 conanfile.py generate() 的 tc.variables 对应）
# ============================================================
build:
  system: cmake
  configure_options:
    - "-DCIO_LIB_STATIC=ON"
    - "-DCIO_LIB_SHARED=OFF"
    - "-DCIO_BACKEND_FILESYSTEM=ON"
    - "-DCIO_TESTS=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_POLICY_DEFAULT_CMP0042=NEW"
    - "-DCMAKE_POLICY_DEFAULT_CMP0077=NEW"
  # 0 个外部编译依赖：deps/crc32（静态辅助库）与 deps/monkey/include
  # （chunkio.h 用到的 mk_list.h）都随源码归档自带并一起构建/安装。
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁（顺序即 apply_conandata_patches 的应用顺序）
# ============================================================
patches_applied:
  - "0001-add-installer.patch"
  - "0002-disable-pic.patch"
  - "0003-ohos-fts-to-nftw.patch"
  - "0004-ohos-fallocate-ftruncate-fallback.patch"
  - "0005-ohos-tests-tmpdir.patch"

# ============================================================
# 测试（逐项清点与归因见 test_package/MANIFEST.yml）
# ============================================================
tests:
  framework: acutest
  upstream_total_cases: 24
  ctest_registered_programs: 4
  test_package_assertions: 17

# ============================================================
# 知识沉淀（§3.8：全程未踩到 engine 未命中的新坑 ⇒ 零草稿为正常终态）
# ============================================================
knowledge_gained: []
