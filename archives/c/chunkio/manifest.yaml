software: chunkio
display: "ChunkIO"
description: "Fluent Bit 的 chunk 存储库：把数据块写入内存（memfs）或内存映射文件（fs）"
category: data
homepage: "https://github.com/fluent/chunkio"
license: Apache-2.0
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "上游没有任何 install() 规则，必须打补丁补安装规则（否则 conan 包为空）；补丁同时注释掉 add_subdirectory(tools)，产物为纯库、无 bin/"
    - "src/cio_utils.c 依赖 musl 不提供的 <fts.h>：用 __has_include 探测，缺失时改走 POSIX nftw(3)（FTW_DEPTH|FTW_PHYS）"
    - "fallocate(2)/posix_fallocate(3) 在 HMDFS/tmpfs 上返回 EACCES（知识条目 E523 同族），需降级到 ftruncate(2)；否则 chunk resize 失败并连带 SIGSEGV"
    - "acutest 套件把临时目录硬编码为 /tmp/，而 /tmp 是只读 erofs：测试沙箱目录要改到构建目录下"
    - "上游 cmake_minimum_required(VERSION 3.0)，CMake 4 需要 CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "chunkio.h 公开包含 <monkey/mk_core/mk_list.h>，deps/monkey/include 必须一起安装"
  common_dependencies: []

# 版本索引
versions:
  "1.5.2":
    status: built
    build_date: "2026-09-26"
    conan_ref: "chunkio/1.5.2"
