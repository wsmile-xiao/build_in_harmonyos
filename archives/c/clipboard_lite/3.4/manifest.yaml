# 版本级 manifest — clipboard_lite 3.4

# 版本号
version: "3.4"

# 软件名
software: clipboard_lite

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag）
  url: "https://github.com/smasherprog/clipboard_lite/archive/refs/tags/3.4.tar.gz"

  # 源码校验和
  sha256: "d8206c9c97381645b1a5a6662414d199f46fb4e160d0f914774ed8dcc0369cc4"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - libx11/6.4.0
  - xorgproto/2025.1
  - libxfixes/6.1.0
  - libxtst/6.1.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（知识候选台账详见 knowledge_candidate_ledger）
knowledge_gained:
- "clipboard_lite (CMake, X11 剪贴板后端) OHOS 适配：X11 头文件分属 libx11/Xfixes/XTest/xorgproto 四个制品，CMake find_package(X11) 需通过 CMakeToolchain 注入 X11_INCLUDE_DIR 与 X11_LIBRARIES 实际 .so 路径"
- "无显示服务器环境下 X11 剪贴板库测试：XOpenDisplay 返回 NULL 后于 XCreateWindow 处确定性崩溃（RC=139），可作为消费者到达真实后端的确定性证据（clipnotify 先例）"
