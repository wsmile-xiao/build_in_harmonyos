# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: clipboard_lite/3.4
homepage: "https://github.com/smasherprog/clipboard_lite"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake --build build && ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（tag 3.4 唯一独立用例：Test/main.cpp）
upstream_tests:
  - file: Test/main.cpp
    source: clipboard_lite-3.4/Test/main.cpp
    description: "上游唯一独立测试程序（clipboard_lite_tests）：X11 剪贴板读写演示。无头 worker 无 X server 时在 XOpenDisplay 处确定性终止（SIGSEGV/显示错误），详见 reports/upstream-test-ledger.md"
    command: "./Test/clipboard_lite_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: consumer.cpp
    description: "消费者测试：仅通过公开头文件 <Clipboard_Lite.h> + libclipboard_lite 驱动公开 API（CreateClipboard/onText/onImage/run/copy）；无显示环境确认后端真实执行"
    command: "./test_clipboard_lite"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5