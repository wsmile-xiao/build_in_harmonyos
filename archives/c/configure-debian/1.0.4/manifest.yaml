knowledge_gained:
  - category: L1
    content: "Perl XS 模块在 OHOS 的适配判据：Makefile.PL 的 conftest 用 dlopen 探测 libintl 的 C 符号（musl libc 自带 gettext 符号，链接本身可行）——但 conftest 需要 <libintl.h> 头文件，OHOS musl 无此头（'gettext function not found. Please install libintl' 实测）→ XS 模块构建在此断。纯脚本消费方（configure-debian 不带 .mo catalog，gettext 恒等语义即正确行为）可用同名 namespace 的最小纯 Perl shim 替代：@ISA=Exporter + @EXPORT 导出裸函数 + 恒等/ngettext 按 $n 选单复数返回——脚本 `use Locale::gettext;` 编译与裸调 gettext() 均过（perl -c syntax OK + 非 root 实跑到 root 门禁实测）。shim 落 lib/perl5/ 经 runenv PERL5LIB 暴露，配方内自包含"
    reason: "Locale::gettext 1.07 Makefile.PL conftest 源码核对 + gettext.xs bootstrap 结构核对 + shim 下真实脚本 perl -c 与非 root 实跑实测"
  - category: L1
    content: "Debian 用户态 Perl 脚本的运行时外部命令归属核实（勿凭命令名前缀猜包）：configure-debian root 路径 shell 出 dpkg-reconfigure（属 debconf 包源码 work/dpkg-reconfigure，非 dpkg 包）、apt-cache（apt 包）、tempfile（miscfiles 包）——dpkg 包内无 dpkg-reconfigure（已发布包全树核对）；本归档环境无 debconf 二进制/debconf-2.0/apt-cache/tempfile 可用配方 → 按 acme.sh 先例不声明 requires，root 交互路径如实记为环境边界（非 root 冒烟不触达）"
    reason: "脚本 system()/backtick 调用全文核对 + debconf 1.5.77 源码 tar 树核实 dpkg-reconfigure 归属 + ohpcd remote 已发布 dpkg 包全树 find 无该二进制实测"
  - category: L1
    content: "configure 生成型 Perl 脚本的 CI 冒烟断言点：脚本 L139 的 root 门禁（EFFECTIVE_USER_ID != 0 → die 'must be run as root'）在参数解析之前触发——非 root CI 下任何参数（含 --help）都命中同一确定性 exit 1 行为，可作为'编译期依赖全部可解析'的断言（perl -w 全文件编译 + use 语句加载 + 常量表构建都通过才走到门禁）；断言必须实测环境行为（toybox id -u 对大 uid 报 bad uid RC=2 → 非 root 判定改用 HOME 存在性）"
    reason: "脚本 L133-149/L292 全文核对 + 非 root 实跑 exit 1 与 stderr 断言实测 + toybox id 实测"
