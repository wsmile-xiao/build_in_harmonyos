# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ccls/0.20250306.8
homepage: "https://github.com/MaskRay/ccls"

# 上游测试命令 (CMake 工程：make check/ctest 不存在；上游测试是 index_tests，用
# `ccls --test-index=` 驱动，且硬性要求 clang 23.0.0git，本包使用 clang 22.1.8，
# 运行时会拒绝执行——已实测确认 `Index tests must be run using clang version 23.0.0git`)
upstream_check_command: "ccls --test-index="

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（clang 版本不满足时 index_tests 不可运行，记录实测行为）
upstream_tests:
  - file: index_tests/foobar.cc
    source: ccls-66481f7b1eb1cf4d1edc12442e275a4efe286850/index_tests/foobar.cc
    description: "index_tests 索引快照对比测试（要求 clang 23.0.0git，clang 22.1.8 下被上游主动拒绝，见 notes.md）"
    command: "./ccls --test-index="

# test_package 中自带的测试 (消费者视角验证，R34：真实调用被测二进制)
test_package_tests:
  - file: test.sh
    description: "smoke test：ccls --version / --help 可执行（同时验证 libclang-cpp/libLLVM 运行时依赖可加载）"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
