# ============================================================
# 知识引用（草稿，待主编 promote）
# ============================================================

knowledge_ref: [E2162]

knowledge_gained:
  - "ccls 的 find_package(Clang) 必须解析到 clang 包自带的 LLVM ClangConfig.cmake（提供 clangIndex/... 目标与 CLANG_LINK_CLANG_DYLIB=ON），不能落到 Conan CMakeDeps 生成的 ClangConfig（只有 clang::clang 目标）；做法是 CMakeToolchain 里显式 CMAKE_PREFIX_PATH=<clang包>/... 而非用 CMakeDeps"
  - "clang 包（cmake_file_name=Clang, cmake_find_mode=config, 包内含 lib/cmake/clang/ClangConfig.cmake + lib/cmake/llvm/LLVMConfig.cmake）在 CMAKE_PREFIX_PATH 指向包目录时即可被 find_package(Clang) 命中（CMake 会匹配小写目录 lib/cmake/clang）"
  - "ccls 的 CMakeLists 依赖变量 RapidJSON_INCLUDE_DIRS，而 rapidjson 1.1.0 包自带 config 只设置 RapidJSON_INCLUDE_DIR；需在 generate() 显式传 RapidJSON_INCLUDE_DIRS"
  - "CMakeToolchain 生成的 toolchain 会把输出目录 prepend 到 CMAKE_PREFIX_PATH，导致 CMakeDeps 生成的 ClangConfig 遮蔽包自带 config——conanfile 必须只生成 CMakeToolchain（不用 CMakeDeps）"
  - "上游 index_tests 快照绑定 clang 版本（master 快照基于 clang 23.0.0git，test.cc kRequiredClangVersion）；制品仓无 clang 23.0.0git，放宽门槛至 22.1.8 后实测 43/119 用例因内置类型 USR 计算差异失败（clang 版本行为差异，非 ccls 代码缺陷），按 TEST_QUALITY_SPEC 3.3 声明豁免；上游无 make check/ctest"
  - "ccls 通过 CMakeLists 里 find_program(clang) 获取 resource dir，CMAKE_PREFIX_PATH 含 clang 包 bin 时自动取到包内 clang 22 的 resource dir"
