# 版本级 manifest — ccls 0.20250306.8

version: "0.20250306.8"
software: ccls
status: built
build_date: "2026-08-25"
compile_date: "2026-08-25"
build_system: cmake

source:
  url: "https://codeload.github.com/MaskRay/ccls/tar.gz/66481f7b1eb1cf4d1edc12442e275a4efe286850"
  sha256: "245958b063772455c5273711bdbc15092554f7836245c48577b901cfb9f594e8"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DUSE_SYSTEM_RAPIDJSON=ON"
    - "-DCMAKE_PREFIX_PATH=<clang_pkg>;<rapidjson_pkg>"
    - "-DRapidJSON_INCLUDE_DIRS=<rapidjson_pkg>/include"
    - "-DCCLS_VERSION=0.20250306.8"
  dependencies:
    - clang/22.1.8
    - rapidjson/1.1.0
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-relax-index-tests-clang-version.patch: 放宽 index_tests 的 clang 版本门槛 23.0.0git→22.1.8（制品仓无 clang 23.0.0git），使上游 index_tests 能在 clang 22.1.8 下真实运行"

