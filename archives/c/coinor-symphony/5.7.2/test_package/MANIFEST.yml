# test_package/MANIFEST.yml
# 上游官方测试声明文件 — coinor-symphony 5.7.2
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试面（SYMPHONY 顶层 Makefile.am `test:` → test/Makefile.am `test:` 注册）：
#   make test = cd test && ./unitTest -miplib3Dir= -mpsDir=<Data-Sample 1.2.13>
#   unitTest = OsiSymSolverInterfaceTest.cpp + unitTestSym.cpp（COIN OsiCppUnit 断言框架
#   + SYMPHONY 自身单测），设备实测 Severity PASSED 412 / ERROR 0 /
#   "All tests completed successfully"（$TASK_DIR/explore-test.log）。
# 未运行面（如实申报，不计入本包执行数）：
#   - `-miplib3Dir=`（test 目标自带空值）显式关闭 MIPLIB3 数据面（fulltest 才用）；
#   - Netlib 未配置（无 --with-netlib-datadir）→ 上游自报
#     "Skipped Testing of OsiSymSolverInterface on Netlib problems"；
#   - ptest/pfulltest（punitTest 并行变体）未执行（PVM 并行面未启用）。

package: coinor-symphony/5.7.2
homepage: "https://github.com/coin-or/SYMPHONY"

# 上游测试命令（在源码树 SYMPHONY/ 目录执行）
upstream_check_command: "make test (in SYMPHONY/)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 test (in <source>/SYMPHONY，运行前对 src/symphony、test/unitTest、test/punitTest 自签)"

# 上游实际运行的测试程序
upstream_tests:
  - file: SYMPHONY/test/Makefile.am
    source: SYMPHONY-5.7.2/SYMPHONY/test/Makefile.am
    description: "unitTest：OsiSymSolverInterfaceTest（COIN OsiCppUnit 框架，Sample 数据驱动）+ unitTestSym（SYMPHONY 求解器单测）；test 目标以 -miplib3Dir= 关 MIPLIB3、-mpsDir 指向 Data-Sample 1.2.13"
    command: "./unitTest -miplib3Dir= -mpsDir=<Data-Sample 1.2.13 目录>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_symphony.sh
    description: "真跑打包产物 bin/symphony：横幅 + Version 5.7.2 + 内置 MIP 求解 Optimal + 目标值 -11（=max 11）断言"
    command: "./test_symphony.sh <pkg>/bin/symphony <workdir>"

# 测试断言总数 (近似值, 用于质量评估)：test_package 侧 4 条硬断言
assertion_count: 4
