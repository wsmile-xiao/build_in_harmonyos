# 版本级 manifest — coinor-symphony 5.7.2
# 遵循 ARCHIVE-SPEC v2.0

version: "5.7.2"
software: coinor-symphony
status: built
build_date: "2026-09-23"
build_system: autotools

source:
  url: "https://github.com/coin-or/SYMPHONY/archive/refs/tags/releases/5.7.2.tar.gz"
  sha256: "0807187a907027590fb860454b20cfde29dd61a2ce21b8af6be2ece4327955da"
  tar_format: tar.gz

build:
  system: autotools
  # 仅列静态可复核项；--with-<pkg>-lib/--with-<pkg>-incdir/--with-sample-datadir
  # 按依赖包路径动态注入（含机器绝对路径，不进本表，见 notes.md 与 conanfile.py）
  configure_options:
    - "--prefix=/"
    - "--build=aarch64-unknown-linux-gnu"
    - "--enable-static"
    - "--disable-shared"
    - "--disable-dependency-tracking"
  dependencies:
    - coinutils/2.11.13
    - coin-or/0.108.12
    - clp/1.17.10
    - cgl/0.60.10.1
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []
# 无源码补丁：依赖注入（configure flags 模式）与 HMDFS 修复（shebang /
# config.guess 分支 / config.status umask077+confstat）全部在 conanfile.py
# build() 内完成（均为生成物或构建期修复，不改动上游源码；DRAFT-E678 正解口径）。

knowledge_gained:
  - "COIN-OR 老 autoconf 2.59 包的 config.status 内嵌 `umask 077 && mktemp ./confstatXXXXXX`，HMDFS 按共享属主落盘 2700 后 subs/stdout 全部 Permission denied（E114/E678 同族）：修法=configure 之前对生成器 configure 四处替换（umask 022、mktemp→固定 ./conftmp、fallback→./conftmp、mkdir→mkdir -p），AC_OUTPUT 内联与生成出的 config.status 即同时继承；生成物不进 git，免 refresh-patch 登记" # knowledge_ref: E692
  - "SYMPHONY 的老 config.sub 无 musl 词表：`--build=aarch64-unknown-linux-musl`（coinor-cbc 可用值）报 Invalid configuration 'aarch64-unknown-linux-musl': machine 'aarch64-unknown-linux' not recognized，须改用 `--build=aarch64-unknown-linux-gnu`（设备 CONFIGURE_RC=0 实证）" # knowledge_ref: E692
  - "测试面激活：--with-sample-datadir=Data-Sample 1.2.13 置 COIN_HAS_SAMPLE → make test 的 unitTest 取 -mpsDir 跑上游断言面（412 PASSED/0 ERROR 实测）；test 目标自带 `-miplib3Dir=`（空值）显式关 MIPLIB3、无 --with-netlib-datadir 则上游自报 Skipped——N 清点按 unitTest 断言数口径、MIPLIB3/Netlib/ptest 三面单列未运行" # knowledge_ref: E692

test_results:
  type: upstream_and_consumer
  upstream_test_in_build: true
  upstream_targets_registered: 1
  note: "make test → unitTest（OsiSymSolverInterfaceTest + unitTestSym）；断言数与非 PASS 面逐字见 reports/test-report.md（412 PASSED/0 ERROR 设备实测，MIPLIB3/Netlib/ptest 未运行如实单列）"
