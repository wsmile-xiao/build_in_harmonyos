# 软件级 manifest — chromono
# 遵循 ARCHIVE-SPEC v3.0

software: chromono
display: "chro.mono"
description: "chro.mono — 圆形配色益智游戏（SDL2/GLES2，C++17，GPL-2.0-or-later）"
category: gfx
homepage: "https://thp.io/2013/chromono/"
license: GPL-2.0-or-later
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游默认 CMake 分支硬编码 pkg-config（zlib/vorbisfile/sdl2）+ find_package(OpenGL) 桌面 GL；OHOS 需 CMakeDeps imported targets（SDL2::SDL2 / Vorbis::vorbisfile / Ogg::ogg / ZLIB::ZLIB）+ -DUSE_OPENGL_ES 走 ES 2.0（原生支持），桌面路径保留 else()"
    - "E092：CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64；CMAKE_POLICY_VERSION_MINIMUM=3.5；--parallel 1"
    - "数据内嵌二进制（packer.py → resources.cpp），运行时无外部数据文件"
    - "无自动化测试（GUI 游戏，无 CLI/make check/ctest）；main() 无显示环境零容错（SDL_CreateWindow 失败即空指针路径）→ headless CI 用 --version 冒烟入口（先于 SDL 初始化）验证可加载+依赖可解析，真实主循环为 GUI 验证边界"
    - "产物 bin/chromono 需 llvm-objcopy 剥 .codesign + binary-sign-tool 自签"
  common_dependencies:
    - sdl2
    - libvorbis
    - libogg
    - zlib

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.1.3":
    status: built
    build_date: "2026-09-08"
    conan_ref: "chromono/1.1.3"
