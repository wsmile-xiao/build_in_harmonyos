# conandata.yml — chromono 1.1.3
# 官方源: https://github.com/mardy/chromono/archive/refs/tags/1.1.3.tar.gz
# SHA-256 为 1.1.3 tag 的 GitHub 归档校验值；
# CI 会自动加 gh-proxy.com 镜像 fallback（build_and_test.sh 重写为列表）

sources:
  url: "https://github.com/mardy/chromono/archive/refs/tags/1.1.3.tar.gz"
  sha256: "ae60b0de0b76790617ea258c4162d93545e5be319c7bc50ec514dfe2b3ad36ac"

patches:
  "1.1.3":
    - patch_file: "patches/0001-cmake-conan-ohos-deps.patch"
      patch_description: "OHOS: gate the desktop pkg-config + find_package(OpenGL) dependency discovery behind CHROMONO_OHOS_CONAN and use Conan CMakeDeps imported targets (sdl2::sdl2, Vorbis::vorbisfile, Ogg::ogg, zlib::zlib) with -DUSE_OPENGL_ES for the ES 2.0 render path; desktop path preserved in else()"
      patch_type: "portability"
    - patch_file: "patches/0002-main-add-version-smoke.patch"
      patch_description: "OHOS CI: additive --version smoke entry at the top of main() before any SDL/display init, so the headless test_package can prove the signed binary loads and its shared deps resolve; normal game runs are unaffected"
      patch_type: "portability"
    - patch_file: "patches/0003-main-sdl2-include.patch"
      patch_description: "OHOS: the published sdl2 package lays headers out under include/SDL2 (SDL.h not at include root); switch main.cpp to <SDL2/SDL.h> so SDL.h resolves with the sdl2::sdl2 include dir; SDL2 headers cross-include via quotes so this is self-consistent"
      patch_type: "portability"
