# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: chromono/1.1.3
homepage: "https://thp.io/2013/chromono/"

# 上游测试命令
# chromono 上游无任何自动化测试（GUI 益智游戏，无 CLI、无 make check、无 ctest），
# 如实记录 upstream official tests = 0
upstream_check_command: "(none - no upstream tests)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "(none)"

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# chromono 是 SDL2/GLES2 图形游戏，main() 对无显示环境零容错 → 不能把真实主循环
# 当 headless gate。用配方新增的最小 --version 冒烟入口（0002 patch，位于 main()
# 最前、先于任何 SDL/显示初始化）验证二进制可加载 + 共享依赖可解析 + ELF 已自签；
# 再对真实启动做限时探测记录 GUI 验证边界（进主循环=完整冒烟通过；headless 下于
# 显示/GL 初始化退出=如实记录边界，非适配缺陷）。
test_package_tests:
  - file: test_chromono.sh
    description: "chromono --version → rc==0 且输出含 'chromono 1.1.3'（可加载+依赖可解析+已自签）；真实启动限时探测记录 GUI 验证边界"

# 测试断言总数
# 断言：chromono 二进制存在可执行（1）、--version 退出码 0（1）、
#      --version 输出含 "chromono 1.1.3"（1）
assertion_count: 3
