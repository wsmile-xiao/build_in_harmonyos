# 版本级 manifest — chromono 1.1.3
# 遵循 ARCHIVE-SPEC v3.0

version: "1.1.3"
software: "chromono"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/mardy/chromono/archive/refs/tags/1.1.3.tar.gz"
  sha256: "ae60b0de0b76790617ea258c4162d93545e5be319c7bc50ec514dfe2b3ad36ac"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCHROMONO_OHOS_CONAN=ON"
  dependencies:
    - "sdl2/2.30.10"
    - "libogg/1.3.6"
    - "libvorbis/1.3.7"
    - "zlib/1.3.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-cmake-conan-ohos-deps.patch"
  - "0002-main-add-version-smoke.patch"
  - "0003-main-sdl2-include.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游桌面构建硬编码 pkg-config（zlib/vorbisfile/sdl2）+ find_package(OpenGL) 桌面 GL；OHOS 用 Conan CMakeDeps imported targets，实测导出名是小写 sdl2::sdl2 / zlib::zlib（非上游 SDL2::SDL2/ZLIB::ZLIB）+ 组件 Vorbis::vorbisfile / Ogg::ogg + -DUSE_OPENGL_ES 走 ES 2.0（main.cpp/chromono_opengl.h 原生支持，渲染仅 GLES2 gl* 直调，无函数指针/EGL 直连），桌面路径保留 else() 便于上游同步"
  - "ohpcd 已发布 sdl2/2.30.10 把头文件装在 include/SDL2/ 下但导出 include 根（SDL.h 不在根）；其内部头全用引号相对 include，故仅需把 main.cpp 的 #include <SDL.h> 改 <SDL2/SDL.h>（0003 patch）即可解析，无需加 include/SDL2 到路径"
  - "chromono 无自动化测试（GUI 益智游戏，无 CLI/make check/ctest）→ 如实记录 upstream official tests = 0；验证放 test_package"
  - "main() 对无显示环境零容错：SDL_Init rc 被忽略、SDL_CreateWindow 失败即走 SDL_GL_CreateContext(NULL)/SDL_GetWindowSize(NULL) 空指针崩溃 → headless CI 无法把真实主循环当 gate；加最小 --version 冒烟入口（0002 patch，先于 SDL 初始化，纯增量不碰渲染）供 test_package 证明可加载+依赖可解析"
  - "bin/chromono 需 llvm-objcopy 剥 .codesign 段 + binary-sign-tool 自签才能运行"
  - "E092：CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64；CMAKE_POLICY_VERSION_MINIMUM=3.5；--parallel 1"
