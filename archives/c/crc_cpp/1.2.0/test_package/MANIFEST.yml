# test_package/MANIFEST.yml — crc_cpp 1.2.0

package: crc_cpp/1.2.0
homepage: "https://github.com/AshleyRoll/crc_cpp"

# 上游测试命令（上游用 CMake + Catch2 v3 集成；CATCH_DISCOVER_TESTS 注册 2 个用例）
upstream_check_command: "cmake -S . -B build && cmake --build build --target tests && ./build/test/tests"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（Catch2 注册 2 个 test case，OHOS aarch64 clang-15 实测 2/2 通过）
upstream_tests:
  - file: test/test.cpp (TEST_CASE "BitReversing")
    description: "test_reverse_bits 位反转辅助函数（uint8/32/64）"
  - file: test/test.cpp (TEST_CASE "Algorithm")
    description: "44 个 CRC 算法族已知向量校验（8/16/32/64 位，tiny/small/large 表）"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "消费者测试 — crc32/crc16_ccit/crc8 公开 API 已知向量校验"
    command: "./test_crc_cpp"
  - file: ohos_special_test.cpp
    description: "HarmonyOS 专项测试 — crc32/crc16_ccit 已知向量 + constexpr 编译期计算 + tiny/small/large 表一致性"
    command: "./test_ohos_special"

upstream_summary: "Catch2 注册 2 个独立 test case（47 assertions），实测 2/2 通过，通过率 2/2=100%"
