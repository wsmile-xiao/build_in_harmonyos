software: cloudfoundry-cli
display: "Cloud Foundry CLI"
description: "Cloud Foundry 平台命令行管理工具，用于部署和管理云应用"
category: dev_tool
homepage: "https://github.com/cloudfoundry/cli"
license: Apache-2.0
build_system: go

ohos_adaptation:
  key_points:
    - "CF CLI 使用 Go 语言编写，需要 Go >= 1.25.0 编译"
    - "使用 CGO_ENABLED=0 实现静态编译，无动态链接依赖"
    - "Go 编译的二进制需要 ELF 签名才能在 OpenHarmony 上执行"
    - "版本号显示为 '0.0.0-unknown-version' 是正常的（从源码直接编译）"
  common_dependencies:
    - go >= 1.25.0

versions:
  "8.18.3":
    status: built
    build_date: "2026-06-08"
    source_url: "https://github.com/cloudfoundry/cli/archive/refs/tags/v8.18.3.tar.gz"