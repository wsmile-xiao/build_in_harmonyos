# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: coeurl/0.3.2
homepage: "https://nheko.im/nheko-reborn/coeurl"

# 上游测试命令 (上游 .gitlab-ci.yml build job 同构)
upstream_check_command: "meson setup -Dtests=true + flask testserver(5000) + TLS testserver(5443) 后台运行后直跑 doctest 二进制"
upstream_test_in_build: false
upstream_test_command: "原生探索阶段执行（上游测试需本地 testserver，conan create 不构建测试；tests=false 为上游默认值）"

# 上游实际运行的测试程序
upstream_tests:
  - name: "tests/requests (doctest, HTTP :5000)"
    source: "tests/requests.cpp"
    description: "17 个 TEST_CASE：GET/POST/PUT/HEAD/OPTIONS/DELETE、手动 Request、重定向（1/0/max）、简单与手动全方法覆盖、Shutdown 中止路径"
    command: "./builddir/tests/requests"
    expected: "test cases: 17 | 17 passed | 0 failed | 0 skipped；assertions: 54 | 54 passed"
  - name: "tests/requests_tls (doctest, TLS :5443)"
    source: "tests/requests_tls.cpp"
    description: "17 个 TEST_CASE：同 requests 但走 https（set_verify_peer(false)，本地自签证书 flask TLS server）"
    command: "./builddir/tests/requests_tls"
    expected: "test cases: 17 | 17 passed | 0 failed | 0 skipped；assertions: 55 | 55 passed"
  - name: "examples/coeurl_example (smoke)"
    source: "examples/coeurl.cpp"
    description: "上游 CI build job 附加冒烟：spdlog trace logger + 并发 GET/POST"
    command: "./builddir/examples/coeurl_example"
    expected: "exit 0"

# 测试统计口径（审方数法一致）
# 单位 = doctest TEST_CASE（case 级）；两套件 17+17。
# TOTAL = PASS + FAIL + SKIP + NOT_RUN = 34 + 0 + 0 + 0 = 34
# 取数命令：
#   控制台口径: grep "test cases:" <log>       → 每套件一行 "test cases: 17 | 17 passed | 0 failed | 0 skipped"
#   junit 口径: grep -c "<testcase" http.xml https.xml → 17 + 17；failures="0" errors="0"
test_statistics:
  total: 34
  passed: 34
  failed: 0
  skipped: 0
  not_run: 0
  unit: "doctest TEST_CASE"
  environment: "设备原生执行；依赖 conan 消费侧 OHOS binary（spdlog 1.17.0/libevent 2.1.13/doctest 2.5.2）+ 测试专用自建 TLS curl 8.5.0（发行 libcurl 无 TLS 后端，仅测试用、不进包依赖链）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "进程内嵌迷你 HTTP 服务器（socket+thread，127.0.0.1:18080）；经安装后的公开 API 并发发起 3 个异步 GET（/ 与 /data），逐请求校验 url()/response_code()/response()/response_headers()[content-type]（12 断言），另校验 3 请求全部经回调完成与 Client 析构清理路径（1 断言）；120s 看门狗防挂起"
    command: "./test_package"
    expected: "checks=13 failures=0；输出 COEURL_TEST_PACKAGE_OK"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
