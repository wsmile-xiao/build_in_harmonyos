# 版本级 manifest — coeurl 0.3.2
# 文件位置: archives/c/coeurl/0.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.3.2"
software: "coeurl"
# published 仅在合并后 release upload 确认后成立；设备验证完成记 built
status: built
build_date: "2026-09-09"
build_system: meson

source:
  # 官方源：nheko.im 自建 GitLab（GitHub 上 Nheko-Reborn/coeurl 已 404）
  url: "https://nheko.im/nheko-reborn/coeurl/-/archive/v0.3.2/coeurl-v0.3.2.tar.gz"
  sha256: "84c1d76116bd118ee2c3a1c7913e2f2f7b20fff34628d09bd86eb349bfdaf1a7"
  tar_format: tar.gz

build:
  system: meson
  # 打包构建只编译库本体（上游默认 tests=false/examples=false）；
  # 上游测试在原生探索阶段按上游 CI 同构方式执行（见 upstream_tests）
  configure_options:
    - "--wrap-mode=nofallback"
    - "-Dtests=false"
    - "-Dexamples=false"
  dependencies:
    - libcurl/8.5.0
    - spdlog/1.17.0
    - libevent/2.1.13
    - fmt/12.2.0
  cc: clang
  cxx: clang++

patches_applied: []

# 上游测试（doctest；统计单位=doctest TEST_CASE）
# 取数命令：两套件日志的 doctest 汇总行 "test cases: 17 | 17 passed |
# 0 failed | 0 skipped"（grep "test cases:" <log>，两行合计 34）；
# junit 复核：grep -c "<testcase" http.xml https.xml（17+17，failures=0 errors=0）
upstream_tests:
  command: "doctest 二进制直跑（上游 .gitlab-ci.yml build job 同构：requests + requests_tls + example）"
  test_count: 34
  notes: "tests/requests.cpp 17 用例（HTTP :5000）+ tests/requests_tls.cpp 17 用例（TLS :5443），本地 flask testserver 按上游 scripts/run_testserver.sh 与 run_tls_testserver.sh 同构拉起（TLS 证书 openssl req 自签）。合计 34/34 用例通过、109/109 断言通过、0 失败 0 跳过；junit 报告 failures=0 errors=0。example 冒烟 exit 0。统计单位=doctest TEST_CASE；取数命令：grep 'test cases:' <log> 与 grep -c '<testcase' <junit>。"

test_package:
  assertion_count: 13
  description: "test_package 起进程内嵌迷你 HTTP 服务器（socket+thread 实现，监听 127.0.0.1:18080），消费者经安装后的 coeurl 公开 API 并发发起 3 个异步 GET，逐请求校验 URL/状态码/响应体/content-type 4 项断言（12 项），另校验 3 请求全部完成与 Client 析构清理路径（1 项）。"

knowledge_gained:
  - "ohpcd 发行 libcurl/8.5.0 为无 TLS 后端变体（无 OpenSSL 版本串、DT_NEEDED 仅 libc.so，https 运行时返回 CURLE_UNSUPPORTED_PROTOCOL=1）且 options 未暴露 with_openssl 开关（package_id 不随选项变化）"  # knowledge_ref: E563
  - "测试专用 TLS curl 的私有自建路径：源码 curl-8.5.0.tar.gz + CMake（-DCURL_USE_OPENSSL=ON -DOPENSSL_ROOT_DIR=设备 harmonybrew OpenSSL 3.6.4 -DHAVE_LINUX_TCP_H=OFF）构建到任务私有 prefix，仅测试用不进包依赖链"  # knowledge_ref: E563
  - "meson install 原位改写安装副本 .dynstr 内 DT_RUNPATH 字节使 hnp clang 产物内嵌 .codesign 哈希失效（Error loading shared library），package() 用 build-tree 原始 .so 覆盖安装副本；本机 musl 加载器不读 DT_RUNPATH，运行期依赖一律经 LD_LIBRARY_PATH 解析"  # knowledge_ref: E560
  - "CMakeDeps 对传递依赖不生成数据（gupnp 先例）：公共头含 spdlog/curl/event2 的库必须把依赖声明进 cpp_info.requires 链；spdlog.pc 声明 Requires: fmt 但 CMakeDeps 目标链不传播 fmt，静态库内联 spdlog 模板代码有未定义 fmt 符号时需将 fmt 显式声明为直接依赖"  # reference: E216
  - "ohpcd spdlog 按 external fmt 编译但配方未声明接口宏：库把 spdlog 头经公共头暴露给消费方时，须在自己的 cpp_info.defines 补 SPDLOG_FMT_EXTERNAL/SPDLOG_COMPILED_LIB/SPDLOG_SHARED_LIB（对齐上游 spdlog config targets），否则消费方 TU 落进 bundled-fmt 分支编译失败"  # knowledge_ref: E560
