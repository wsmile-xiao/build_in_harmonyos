software: coeurl
display: "coeurl"
description: "Nheko-Reborn 的 C++17 异步 HTTP 客户端库（libcurl + libevent）"
category: library
homepage: "https://nheko.im/nheko-reborn/coeurl"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "官方源为 nheko.im 自建 GitLab（GitHub 上 Nheko-Reborn/coeurl 已 404）；域名偶发 5xx/连接重置，下载失败先 /rebuild 或重试再判断"
    - "依赖经 pkg-config 探测：conan 消费侧用 PkgConfigDeps 生成 .pc，禁用发行 curl 包自带的 curl-config（prefix 固化打包机死路径，workflow §5.1）"
    - "libevent_core/libevent_pthreads 由 ohpcd libevent 包直接提供，--wrap-mode=nofallback 下不会触发上游 CMake 子项目 fallback（无需网络）"
    - "ohpcd 发行 libcurl/8.5.0 为无 TLS 后端变体（https 运行时返回 CURLE_UNSUPPORTED_PROTOCOL）；上游 TLS 测试用测试专用自建 TLS curl（私有 prefix）验证 17/17"
    - "spdlog 1.17.0 硬性要求 fmt/12.2.0（显式锁 fmt/11.1.3 会版本冲突）；0.3.2 配方已显式 require fmt/12.2.0——静态库内联 spdlog 模板代码的未定义 fmt 符号需消费者可链接，且 CMakeDeps 目标链不传播 fmt（E216 同族）"
  common_dependencies:
    - libcurl
    - spdlog
    - libevent

versions:
  "0.3.2":
    status: built
    build_date: 2026-09-09
