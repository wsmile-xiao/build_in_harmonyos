# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: chrootuid/1.3
homepage: "https://ftp.porcupine.org/pub/security/"

# 上游测试命令：Makefile 无 test/check 目标（1993 年 raw Makefile，无测试文件）
upstream_check_command: "无（Makefile 无 test/check 目标，静态清点为 0）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（静态清点证据：源码树仅 chrootuid.c + Makefile
# + man 页 + README + license，无任何测试目标或测试文件）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：真实运行包交付的 chrootuid——(A) 无参调用按源码契约 rc=0（chrootuid.c:80-83）；(B) 完整参数调用 rc=0（root 特权下 chroot+setuid+execvp 全路径可观察，非特权环境 chroot 被拒按契约静默，如实记录）"
    command: "./test_chrootuid"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
