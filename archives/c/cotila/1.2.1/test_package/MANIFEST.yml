# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁强制要求存在）

package: cotila/1.2.1
homepage: "https://github.com/calebzulawski/cotila"

upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: ""

# 上游测试套件：test/ 目录（vector_test.h 33 + matrix_test.h 32 +
# scalar_test.h 11 = 76 条编译期 static_assert；test.cpp 编译并运行）。
# 全部为零依赖编译期断言，无需 FetchContent/联网，已在 test_package 中
# 原样集成（upstream/ 子目录，零修改）并实际执行。
upstream_tests:
  - file: test/test.cpp (+ vector_test.h, matrix_test.h, scalar_test.h)
    source: cotila-1.2.1/test/
    description: "Upstream compile-time static_assert suite (76 assertions) — integrated and RUN in test_package as cotila_upstream_tests"
    command: "./cotila_upstream_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: constexpr dot/trace static_assert + runtime assert, OHOS clang/libc++ C++17"
    command: "./test_cotila"

# 测试断言总数（76 上游编译期断言 + 4 消费者断言）
assertion_count: 80
