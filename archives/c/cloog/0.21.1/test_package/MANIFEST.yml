# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: cloog/0.21.1
homepage: "https://github.com/periscop/cloog"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test/ 目录下4个shell脚本 + 1个C测试程序)
upstream_tests:
  - file: test/check_c.sh
    source: cloog-0.21.1/test/check_c.sh
    description: "C code generation tests with various cloog input files"
    command: "bash test/check_c.sh"
  - file: test/check_openscop.sh
    source: cloog-0.21.1/test/check_openscop.sh
    description: "OpenScop format input tests"
    command: "bash test/check_openscop.sh"
  - file: test/check_special.sh
    source: cloog-0.21.1/test/check_special.sh
    description: "Special case and edge case tests"
    command: "bash test/check_special.sh"
  - file: test/check_strided.sh
    source: cloog-0.21.1/test/check_strided.sh
    description: "Strided loop generation tests"
    command: "bash test/check_strided.sh"
  - file: test/generate_test_advanced.c
    source: cloog-0.21.1/test/generate_test_advanced.c
    description: "Advanced code generation unit test (C program using cloog API)"
    command: "./test/generate_test_advanced"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: verifies cloog library loads, state creation, and version query"
    command: "./test_cloog"

# 测试断言总数 (上游4个shell脚本 + 1个C程序 + 1个消费者测试)
assertion_count: 6
