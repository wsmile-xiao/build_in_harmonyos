# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 软件名
software: "clue"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39 官方 GitHub tag 归档）
  url: "https://github.com/martinmoene/clue/archive/refs/tags/v1.0.0.tar.gz"

  # 源码校验和（鸿蒙设备端实测下载计算）
  sha256: "7b369288ff0ab98ef2d471dd007f3cf8778ad4e4bdf8a5dc3b5d9e2b9cb0439c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
