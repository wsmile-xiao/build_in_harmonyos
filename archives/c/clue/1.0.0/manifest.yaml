  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零补丁：设备 clang 15 原生通过上游 -Wall -Wextra -Weffc++ -std=c++03）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "clue 短名宏 LOG_* 展开引用非限定 the_log()，消费者必须 using namespace clue"
  - "本版本 lest_cpp03 成功时静默（默认 pass=false），计数证据需 ./test_clue -p"
  - "HMDFS 上 make -j 的 jobserver mkfifo 报 Operation not permitted 但仅告警不致命（GNU make 4.4.1）"
