# test_package/MANIFEST.yml — 上游官方测试声明（clue/1.0.0）
# 数字口径：鸿蒙设备端实跑输出（clang++ 15.0.4 + 上游原生 Makefile），
# 与 notes.md、PR 正文一致。
package: clue/1.0.0
homepage: "https://github.com/martinmoene/clue"

upstream_check_command: "make -j2 -C tests"

# conanfile.py build() 已集成上游测试（Makefile all 目标 = 编译 + 运行）
upstream_test_in_build: true
upstream_test_command: "make -j2 -C tests"

# 上游测试：lest_cpp03 框架，tests/Makefile 将两个 TU 编译成单个 test_clue
# 可执行文件并直接运行（无 CTest / 无 CMake，上游不提供构建系统）。
# 注意本版本 lest 默认不选带 "[.xxx]" 隐藏标签的用例；成功时默认静默，
# 证据输出使用 ./test_clue -p。
upstream_tests:
  - file: tests/test_clue.cpp
    source: clue-1.0.0/tests/test_clue.cpp
    description: "核心单元测试（lest: is_true/text_or/text_with_or/to_module_text/to_severity_text/to_severities_text/LOG_ALERT/LOG_TO_STRING；另有 clue version 用例带隐藏标签默认不选）"
    case_count: 13        # 默认实跑 selected 数（源码 14 CASE，1 个 [.clue][.version] 隐藏）
    source_case_count: 14
    assertion_count: 23   # 实跑 passed 评估数（含 to_severity_text 10 项查表循环）
    command: "make -j2 -C tests"
    executed: true        # 设备实跑输出: All 15 selected tests passed. (与 part2 合计)
  - file: tests/test_clue_part2.cpp
    source: clue-1.0.0/tests/test_clue_part2.cpp
    description: "多 TU ODR 验证：user-provided strlog (clue_LOG_EXPRESSION 重定义) 下 LOG_ALERT/LOG_TO_STRING 正确记录"
    case_count: 2
    source_case_count: 2
    assertion_count: 2
    command: "make -j2 -C tests"
    executed: true

test_package_tests:
  - file: test_clue_consumer.cpp
    description: "消费者测试: C++98 标准编译通过，strlog 记录 severity/text、severity 文本表、text_or/to_module_text/to_severities_text、版本宏、clear 语义（14 项独立 CHECK）"
    command: "./test_clue_consumer"
    case_count: 1
    assertion_count: 14   # 设备实跑输出: clue consumer checks: 14/14 passed

assertion_count: 14       # test_package 断言数（上游 25 项断言评估见 upstream_tests）
