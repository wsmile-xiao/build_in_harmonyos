# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "上游 Makefile 硬编码 CC=gcc/CXX=g++，须在 make 命令行覆盖为 clang/clang++（Makefile 内赋值优先于环境变量）"
- "上游链接 -lz，main.c/internal 需要 zlib.h；zlib/1.3.1 已在 ohpcd registry 发布，需作为 requires 注入"
- "ssw.h 包含 sse2neon.h（SSE2->NEON 纯头翻译），arm64/OHOS 直接编译可用，无需改源码"
- "上游为纯 Makefile 项目：无 configure/CTest/Meson/make check，测试入口为官方 ssw_test/example_c/example_cpp 三个独立可执行程序"