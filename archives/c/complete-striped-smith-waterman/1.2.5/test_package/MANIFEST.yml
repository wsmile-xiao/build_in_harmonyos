# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: complete-striped-smith-waterman/1.2.5
homepage: "https://github.com/mengyao/Complete-Striped-Smith-Waterman-Library"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游为纯 Makefile 项目，无 configure/CTest/Meson，无 make check 目标；
# 测试入口 = 官方自带的独立可执行程序 ssw_test / example_c / example_cpp。
upstream_check_command: "make default && ./ssw_test -h"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（官方 tag 源码中的独立用户用例）
upstream_tests:
  - file: main.c
    source: Complete-Striped-Smith-Waterman-Library-1.2.5/src/main.c
    description: "ssw_test 命令行工具（CLI 用例）：读取 fasta/fastq 执行条带化 Smith-Waterman 比对，输出得分/SAM"
    command: "./ssw_test -h && ./ssw_test demo/1k.fa demo/query.fastq"
  - file: example.c
    source: Complete-Striped-Smith-Waterman-Library-1.2.5/src/example.c
    description: "C API 示例用例：CAGCCTT... 参考序列 vs CTGAGCCGGTAAATC read，实证 optimal score=21"
    command: "./example_c"
  - file: example.cpp
    source: Complete-Striped-Smith-Waterman-Library-1.2.5/src/example.cpp
    description: "C++ API 示例用例：通过 ssw_cpp.h 的 Aligner 类执行比对，实证 best score=21"
    command: "./example_cpp"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者用例：仅通过公开头文件 ssw.h + libssw.so 调用 ssw_init/ssw_align，断言 score1>=21 且 cigar 非空"
    command: "./test_complete-striped-smith-waterman"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
