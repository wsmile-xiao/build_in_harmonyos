knowledge_gained:
  - "cbftp 为纯 Makefile 项目（无 configure），make && 生成 bin/cbftp、bin/datafilecat、bin/datafilewrite 三个可执行文件"
  - "需要一个 C 编译器编译 src/ext/picohttpparser.c，必须显式传 CC（环境无 cc）"
  - "构建必须显式传 AR/RANLIB（llvm-ar/llvm-ranlib），Makefile 中 $(RANLIB) 为空时会报错"
  - "cbftp 需要宽字符 ncurses（libncursesw），Makefile.inc 非 Debian 平台默认 -lncurses 会链接失败，需显式传 LINKFLAGS=-lncursesw"
  - "datafilecat/datafilewrite 原使用 $(STATIC_SSL_INCLUDE)/$(SSL_LINKFLAGS) 编译，不继承 CXXFLAGS/LINKFLAGS 导致缺依赖头路径，需改为 $(CXXFLAGS)/$(LINKFLAGS)（补丁 0001）"
  - "产物动态依赖 libc++_shared.so，运行时需在 LD_LIBRARY_PATH 加入 OHOS SDK llvm/lib/aarch64-linux-ohos"
  - "cbftp 上游无测试套件（无 check 目标、无 tests 目录），补全 datafile AES-256 加解密往返 + 错误口令拒绝 + ELF 启动测试"
  - "上游 Crypto::decrypt() 不检查 EVP_DecryptFinal_ex 返回值，错误口令解密结果不确定，测试需用确定性断言（输出≠明文）"

