# test_package/MANIFEST.yml
# cbftp 1.0.0 上游测试声明
#
# 上游测试情况:
#   cbftp 是纯 Makefile 项目（make && bin/cbftp），上游仓库（cbftp/cbftp-svn）
#   Makefile 中无 check/test 目标，源码树中无 tests/ 目录（仅 examples/ 下
#   的 Python/sh 客户端示例脚本，非常规测试）。因此上游测试样例数为 0，
#   按 SKILL 要求补全为完整的功能测试集（见 test_package_tests）。

package: cbftp/1.0.0
homepage: "https://cbftp.glftpd.io/"

# 上游测试命令 (make -n check 输出为空，无测试目标)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无——上游无测试套件）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，R34 真实调用被测二进制）
# 补全测试集覆盖 cbftp 的核心功能：
#   1. 三个可执行文件存在且可执行
#   2. datafilecat 明文（ASCII）数据文件直读
#   3. datafilewrite AES-256 加密 + datafilecat 解密 往返一致
#   4. 错误口令解密结果不等于明文（AES 密钥调度确定性断言）
#   5. cbftp 主程序 ELF 可加载/启动（无 TTY 时报 ncurses 初始化失败属预期）
test_package_tests:
  - file: test_cbftp.py
    description: "cbftp 三二进制存在性 + datafile AES-256 加解密往返 + 错误口令拒绝 + 主程序启动"
    command: "python3 test_cbftp.py <bin_dir> <sdk_llvm_lib>"

# 测试断言总数 (5 个测试用例, 见 test_cbftp.py)
assertion_count: 5