software: cmix
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/21/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "21"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# 构建系统类型（顶层字段，供质量门禁检查）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/byronknoll/cmix/archive/refs/tags/v21.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-makefile.patch"
  - "0002-src-models-fxcmv1.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "makefile 中硬编码 clang++-17 需改为 clang++（系统仅有 clang++ 15.0.4）"
  - "src/models/fxcmv1.cpp 直接 #include <immintrin.h>（x86 专用），aarch64 需用 #if defined(__x86_64__) || defined(__i386__) 守卫，代码已有标量 #else 回退"
  - "cmix 无 make install 目标，需手动 cp 二进制到 staging/DEFAULT_PREFIX"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/cmix-21.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/cmix-21.work
  source_orig_hash: 69601955beb3c09a
  source_work_hash: afe2a47d0ae7f1c2
  generated_at: '2026-06-25T12:33:40'
  patches_count: 2

patch_classification:
  - file: 0001-makefile.patch
    type: platform
    platform_only: True
    guard: 'CC = clang++（系统无 clang++-17）'
  - file: 0002-src-models-fxcmv1.cpp.patch
    type: platform
    platform_only: True
    guard: '#if defined(__x86_64__) || defined(__i386__) 守卫 x86 SIMD'
