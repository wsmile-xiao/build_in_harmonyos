# test_package/MANIFEST.yml — catch 1.12.2
# CI L0e requires this file to exist.

package: catch/1.12.2
homepage: "https://github.com/catchorg/Catch2"

# catch 1.12.2 ships its own self-test suite (projects/SelfTest, CMake target
# `SelfTest`). Static count: 191 registrations across 23 .cpp files:
# 180 TEST_CASE + 2 TEST_CASE_METHOD + 2 CATCH_TEST_CASE + 3 SCENARIO +
# 1 SCENARIO_METHOD + 2 METHOD_AS_TEST_CASE + 1 REGISTER_TEST_CASE. The
# default toolchain configuration registers 111 of them; the remaining 80
# are gated on C++ standard version / feature macros, e.g. C++11-only or
# CATCH_CONFIG_ override sections, so they are not compiled into this binary.
upstream_check_command: "cmake --build build --target SelfTest && ./SelfTest"
upstream_test_in_build: true
upstream_test_command: "./SelfTest"

# Upstream self-test executed on-device (see reports/test-report.md):
# 111 test cases (109 passed + 2 failed-as-expected, i.e. deliberate failure-
# path tests shipped by upstream), 853 assertions (850 passed + 3
# failed-as-expected), runner exit code 0.
upstream_tests:
  - file: "projects/SelfTest (CMake target SelfTest)"
    description: "Framework self-test suite built with the packaged toolchain and executed; includes deliberate expected-failure cases"
    command: "cmake --build build --target SelfTest && ./SelfTest"
    static_cases: 191
    registered_cases: 111
    executed_cases: 111
    passed_cases: 109
    failed_cases: 0
    expected_failures: 2
    conditionally_unregistered: 80
    assertions: 853
    assertions_passed: 850
    assertion_expected_failures: 3

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_catch.cpp
    description: "Consumer program using CATCH_CONFIG_MAIN, TEST_CASE/SECTION/REQUIRE/REQUIRE_FALSE/Approx, built with CMake against the packaged header, signed (E077) and executed. Runner reports: All tests passed (9 assertions in 2 test cases)"
    command: "cmake build + run_check.sh (greps the runner summary)"

assertion_count: 9

consumer_tests: 2
consumer_passed: 2
consumer_assertions: 9
