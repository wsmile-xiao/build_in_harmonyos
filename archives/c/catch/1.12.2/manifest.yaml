knowledge_gained:
  - "catch 1.12.2 is the classic 1.x single-header line (single_include/catch.hpp): header-library recipe mirrors the merged catch2/2.13.10-r0 precedent (package_id clear, cmake_file_name/target Catch::Catch)"
  - "Upstream CMakeLists.txt requires cmake_minimum_required(VERSION 3.0) which CMake 4.x rejects; -DCMAKE_POLICY_VERSION_MINIMUM=3.5 configures it without touching upstream sources (used only for the on-device self-test build, not the recipe)"
  - "Upstream SelfTest contains deliberately failing cases (failure-path self-tests): the runner reports '109 passed | 2 failed as expected' and exits 0 — do not treat 'failed as expected' as a suite failure"
  - "Static SelfTest registration count (191) exceeds the executed count (111) because the suite gates some cases behind C++ standard version / feature macros; the default-configuration binary registers 111"
  - "test_package with cmake_layout runs test() from the build directory: helper scripts referenced relative to the source dir must use os.path.dirname(os.path.abspath(__file__))"

