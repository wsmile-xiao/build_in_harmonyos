software: convlit
display: "ConvertLIT"
description: "将 Microsoft Reader .LIT 文件转换为 HTML/OEBPS 的 CLI 工具"
category: utils
homepage: "https://www.kyzer.me.uk/pack/convlit/"
license: "GPL-2.0-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 C CLI 工具，Makefile 构建；依赖 libtommath（bignum）"
    - "上游 Makefile 硬编码 gcc 与本地 libtommath-0.30 路径，改为 $(CC)/$(AR) + -ltommath"
    - "源码 CRLF → LF 后应用补丁"
    - "无上游测试套件，以 clit 版本/帮助输出作运行冒烟"
  common_dependencies:
    - libtommath

versions:
  "1.8":
    status: built
    build_date: "2026-09-09"
    notes: "OHOS aarch64 原生构建；clit 可执行文件输出 ConvertLIT (Version 1.8)"
