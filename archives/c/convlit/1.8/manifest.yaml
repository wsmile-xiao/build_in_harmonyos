version: "1.8"
software: convlit
status: built
build_date: "2026-09-09"
build_system: makefile

source:
  url: "https://deb.debian.org/debian/pool/main/c/convlit/convlit_1.8.orig.tar.gz"
  # == 原始 upstream（相同字节，SHA256 一致）
  # https://www.kyzer.me.uk/pack/convlit/open_c-lit-1.8.tar.gz
  sha256: "1ff1989b419218ec4660f05d4ef62b13b3588ac61915a6a259705676c360cc0f"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "lib/: make CC=clang AR=llvm-ar CFLAGS=... (由 conan 环境注入)"
    - "clit18/: make CC=clang, 链接 -ltommath"
  dependencies:
    - "libtommath/1.3.0"

patches_applied:
  - "patches/0001-ohos-makefile-link.patch"
  - "patches/0002-source-fixes.patch"

knowledge_gained:
  - "convlit(clit) 1.8 为 2004 年的 C/Makefile 工具，源码包为 CRLF；需先统一为 LF 再打补丁"
  - "上游 Makefile 硬编码 gcc 与本地 ../libtommath-0.30 路径；OHOS 下改用 $(CC)/$(AR) 与 -ltommath"
  - "lib/ 与 clit18/ 分开 make；clit18 链接 openclit.a + libtommath"
  - "缺失隐式声明修复：string.h / sys/stat.h / ctype.h；MAX_PATH 数组改用 strdup（clit.c）"
  - "上游无独立测试套件；以 clit 运行输出版本/帮助文本作为冒烟验证（同 multitail 先例）"
