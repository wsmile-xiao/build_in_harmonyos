# test_package/MANIFEST.yml
# convlit 1.8 — CLI 工具（.LIT → OEBPS/HTML）
# CI L0e 要求此文件存在。

package: convlit/1.8
homepage: "https://www.kyzer.me.uk/pack/convlit/"

# 上游无独立测试套件（源码包仅含 Makefile 与源码，无 test/ 目录与 ctest）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: src/test_convlit.c
    description: "以 popen 调用 clit 可执行文件（无参数），校验输出包含 ConvertLIT (Version 1.8) 标题，证明二进制可运行"
    command: "conan test"

assertion_count: 2
