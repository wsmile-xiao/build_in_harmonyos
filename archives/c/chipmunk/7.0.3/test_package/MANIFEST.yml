# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: chipmunk/7.0.3
homepage: "https://github.com/slembcke/Chipmunk2D"

# 上游**没有**测试套件：Chipmunk2D 7.0.3 的 tarball 内没有 tests/ 目录、
# 无 CTest 注册（顶层与 src/ 的 CMakeLists.txt 均无 add_test/enable_testing），
# demo/ 下的程序是需要 OpenGL+GLFW 的交互式演示（本配方 BUILD_DEMOS=OFF），
# 不构成可自动执行的测试面（2026-09-15 对 Chipmunk-7.0.3 tag tarball 实测）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_chipmunk.cpp
    description: >-
      消费者功能测试（9 项断言，全部走公共 C API，TAP 输出、失败即非零退出）：
      重力场中自由落体（10 步后 y 明显下降）；静态线段接住反弹的球（240 步后
      稳定停在 y>0 且低于初速可达高度）；pin joint 保持两体 4 单位间距
      （30 步后实测距离误差 <0.3）；type 1/2 碰撞handler 的 begin 回调在
      两圆相遇时被触发；cpSpacePointQuery 命中指定圆；cpMomentForCircle
      实心圆盘转动惯量公式 m*r^2/2 精确匹配；cpBBintersects 区分相交与相离；
      cpSpaceNew/cpSpaceGetStaticBody 基础契约。
