# 版本级 manifest —— chipmunk 7.0.3
# 遵循 ARCHIVE-SPEC v2.0

version: "7.0.3"
software: chipmunk

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-15"
build_system: cmake

source:
  url: "https://github.com/slembcke/Chipmunk2D/archive/refs/tags/Chipmunk-7.0.3.tar.gz"
  sha256: "1e6f093812d6130e45bdf4cb80280cb3c93d1e1833d8cf989d554d7963b7899a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED/BUILD_STATIC/INSTALL_STATIC 按 Conan shared 选项映射（shared=True 时静态三件全 OFF，避免上游 CMake 的 INSTALL_STATIC→BUILD_STATIC FORCE 回写把两份库都装进包）"
    - "BUILD_DEMOS=OFF / INSTALL_DEMOS=OFF（demo 需要 OpenGL+GLFW，OHOS 无此栈）"
    - "FORCE_CLANG_BLOCKS 维持上游 Clang 默认 ON：库只接收并调用调用方传入的 block 指针，不创建逃逸 block 字面量，无需 blocks 运行库"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-sysctl-apple-guard.patch（沿用遗留分支 lkyz 的实现）：cpHastySpace.c 的 <sys/sysctl.h> 加 __APPLE__ 守卫并显式包含 pthread.h——OHOS musl 无 sysctl 头，调用侧上游已有 __APPLE__ 守卫"

knowledge_gained:
  - "Chipmunk2D 7.0.3 的 GitHub tag 自动 tarball 解包顶层目录是 Chipmunk2D-Chipmunk-7.0.3（repo-tag 双段），配方用扁平化解包（剥掉单一段顶层）处理"
  - "上游 src/CMakeLists.txt 引用了从未定义的 ${chipmunk_constraint_header} 变量——install(FILES 空表) 是无害 no-op，公共头实际由 include/chipmunk/*.h 的平铺 glob 全量安装，约束头也在其中，不需要为它打补丁"
  - "上游对 Clang 强制 -fblocks 且库里有 cpSpaceEachBody_b 一族 block API：块仅作为**形参类型**出现并被调用，不产生逃逸字面量，因此不需要 blocks 运行库即可在 OHOS musl 上链接——评估 -fblocks 依赖时应区分『创建块字面量』与『接收块指针』"
  - "cpHastySpace.c 使用 pthread，但 OHOS musl 的 pthread 在 libc 内，上游 target_link_libraries 只链 m 即可，无需额外线程库"
