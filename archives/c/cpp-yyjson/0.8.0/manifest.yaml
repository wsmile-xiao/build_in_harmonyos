# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS SDK libc++（LLVM 15）未实现 C++20 <format>（__cpp_lib_format 未定义，std::format 不可用）；需提供局部 format shim 或替换为 fmt"
- "OHOS SDK libc++（LLVM 15）缺失 <source_location> 头；用 __has_include(<source_location>) 守卫回退 __PRETTY_FUNCTION__"
- "OHOS SDK libc++（LLVM 15）缺失 std::ranges 算法（transform/fill/equal/uninitialized_default_construct）与 std::ranges::views；用 std 算法 + 显式迭代器替代"
- "clang 15 未实现 C++20 P1091（lambda 捕获结构化绑定）；先绑定具名引用再捕获"
- "CMake header-only 库配方需在 generate() 中同时生成 CMakeDeps（find_package(yyjson) 依赖）与 CMakeToolchain"
- "上游 CMake 安装的 config 名为 cpp_yyjsonConfig.cmake（PROJECT_NAME= cpp_yyjson），test_package 需 find_package(cpp_yyjson CONFIG REQUIRED)"

