# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cpp-yyjson/0.8.0
homepage: "https://github.com/yosh-matsuda/cpp-yyjson"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cpp_yyjson_test (gtest_discover_tests PRE_TEST 注册，build() 中实际运行)"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cpp
    source: cpp-yyjson-0.8.0/test/test.cpp
    description: "cpp-yyjson 上游 GTest 主测试源（21 个独立 TEST 用例）"
    command: "./cpp_yyjson_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：仅通过公开头文件调用 read/write/object 等公开 API"
    command: "./test_cpp-yyjson"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 21
