# test_ohos/MANIFEST.yml — crossline 1.0 HarmonyOS PC 专项验证
# 六项独立鸿蒙检查（run_ohos_test.py，任一失败非零退出）：
#   T1_aarch64_elf     ELF64 AArch64（readelf -h）
#   T2_musl_no_glibc   musl libc, 无 GLIBC 符号版本, 无 ld-linux
#   T3_no_host_paths   无宿主绝对路径 / 无 RPATH-RUNPATH
#   T4_real_readline   管道喂入一行，crossline_readline 非 TTY 路径真实返回该行
#                      （含 history save/load 往返、paging/cursor API 真实调用）
checks:
  - id: T1_aarch64_elf
    desc: ELF64 AArch64 (readelf -h)
  - id: T2_musl_no_glibc
    desc: musl libc, no GLIBC symbol versions, no ld-linux
  - id: T3_no_host_paths
    desc: no absolute host paths, no RPATH/RUNPATH
  - id: T4_real_readline
    desc: real readline pipe input + history round-trip + paging/cursor APIs
assertion_count: 4
assertion_count_note: 3 machine checks + 1 in-program run (T4, 3 in-program sub-assertions)