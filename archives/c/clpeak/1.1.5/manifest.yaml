# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.5"

# 软件名
software: "clpeak"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/krrishnarraj/clpeak/archive/refs/tags/1.1.5.tar.gz"

  # 源码校验和
  sha256: "31620ef28848108f6868e57e100412aa009399ba2cd021afd3b64563711fa49f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  # 例如:
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - opencl-headers/2026.05.29
  - opencl-icd-loader/v2024.05.08
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
