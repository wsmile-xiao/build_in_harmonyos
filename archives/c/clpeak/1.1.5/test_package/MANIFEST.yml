# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: clpeak/1.1.5
homepage: "https://github.com/krrishnarraj/clpeak"

# 上游测试命令（ctest 注册 1 个用例）
upstream_check_command: "ctest -N"

# conanfile.py build() 中已集成上游测试（cmake.test() 运行 clpeak_test_run）
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target test (ctest 运行 clpeak_test_run)"

# 上游实际运行的测试程序
# 来源：顶层 CMakeLists.txt 末尾 enable_testing() + add_test(clpeak_test_run clpeak)
upstream_tests:
  - file: CMakeLists.txt
    source: clpeak-1.1.5/CMakeLists.txt
    description: "clpeak_test_run：直接运行 clpeak 二进制；无 OpenCL ICD/平台时打印 'no platforms found' 并以 0 退出（clGetPlatformIDs 返回 -1001 被上游容忍），CTest 通过"
    command: "ctest -R clpeak_test_run"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_clpeak.sh
    description: "运行打包后的 clpeak 二进制：--version 断言 + 无参运行断言（共 2 断言）"
    command: "./test_clpeak.sh <clpeak_bin>"

# 测试断言总数（上游 1 个 CTest 用例 + test_package 2 个断言）
assertion_count: 3
