software: cbc
# 版本级 manifest
# 文件位置: archives/c/cbc/2.10.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.10.10"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/coin-or/Cbc/archive/refs/tags/releases/2.10.10.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "CC=clang"
    - "CXX=clang++"
    - "CFLAGS=-fPIC -O2"
    - "CXXFLAGS=-fPIC -O2"
    - "LDFLAGS=-L$DEFAULT_PREFIX/lib"
    - "CPPFLAGS=-I$DEFAULT_PREFIX/include -I$DEFAULT_PREFIX/include/coin"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - coinutils/2.11.10
    - osi/0.108.9
    - clp/1.17.9
    - cgl/0.60.6

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "E072: config.sub/config.guess ohos 三元组支持"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E072: autotools项目需要替换config.sub和config.guess以支持ohos三元组"
  - "cbc依赖CoinUtils/Osi/Clp/Cgl，需逐个手动构建安装"
  - "cbc二进制的--version进入交互模式不退出，安全弹窗需特殊处理"
  - "COIN-OR项目的config.sub修补最简方法是直接用cbc源码中的已修补版本替换"