# Upstream unitTest (make test) reads MPS instances from the official
# coin-or Data-Sample dataset (../../Data/Sample relative to the test build
# dir).  The Cbc release tarball does not ship them; osiUnitTest requires
# them, so the recipe fetches the official dataset itself.
