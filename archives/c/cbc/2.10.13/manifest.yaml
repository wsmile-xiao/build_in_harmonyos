software: cbc
version: "2.10.13"
status: built
build_date: "2026-09-18"

source:
  url: "https://github.com/coin-or/Cbc/archive/refs/tags/releases/2.10.13.tar.gz"
  sha256: "62fde44dcf6f3d05c5cd291d7435cdd1b7e8acd3c78ec481dd39fe49cbc40399"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--build=aarch64-unknown-linux-musl"
    - "--disable-dependency-tracking"
    - "--disable-shared"
    - "--enable-static"
  dependencies:
    - coinutils/2.11.13
    - coin-or/0.108.12
    - clp/1.17.10
    - cgl/0.60.10.1
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Cbc 2.10.13 使用 COIN-OR autotools 构建系统，依赖 CoinUtils/Osi(coin-or)/Clp/Cgl，ohpcd 中 Osi 的 Conan 包名为 coin-or。"
  - "CbcSolver.cpp:216 无条件 #include \"CglLandP.hpp\"：必须消费修复后的 cgl/0.60.10.1（含 CglLandP 头与符号），cgl/0.60.10 缺头导致编译失败（R01 外部依赖阻塞，R02 解除）。"
  - "OHOS 构建使用显式 aarch64-unknown-linux-musl 三元组、--disable-dependency-tracking 与静态链接；HMDFS umask 077 需 config.status 临时目录修复（mkdir conftmp + umask 022）。"
  - "cbc configure 探测 osi/osi-clp 的 pkg-config 名，需为 coin-or/clp 包生成 osi.pc 与 osi-clp.pc 兼容别名（同 cgl/clp 先例）。"
  - "上游 make test（gamsTest/osiUnitTest/CInterfaceTest）读取 ../../Data/Sample，需从官方 coin-or Data-Sample 获取 MPS 数据；osiUnitTest 链接需注入 -lOsiCommonTests（coin-or 包提供 libOsiCommonTests.a）。"
  - "cbc 构建产出 cbc CLI（R38 CLI 库），软件级 commands.json 已声明 type=tool。"
  - "C 接口约定 Cbc_setObjSense(-1) 表示最大化（上游 CInterfaceTest 同款）；Cbc_loadProblem 使用压缩稀疏列格式建模。"