# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cbc/2.10.13
homepage: "https://github.com/coin-or/Cbc"

# 上游自带 make test 套件（Cbc/test 下 gamsTest/osiUnitTest/CInterfaceTest，
# 依赖 COIN-OR Data-Sample 数据），已在配方 build() 中随官方数据实际运行。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make -j1 test"

# 补全测试说明：test_package 新增三个消费者/HarmonyOS 专项测试
supplementary_tests:
  - file: test_package/test_cbc.cpp
    count: 1
    description: >-
      消费者冒烟测试：链接 cbc 库，通过公开 C 接口建模 0-1 背包 MILP 并求解，
      断言最优目标值 14 与整数解 (1,0,1)（R34）。
  - file: test_package/cbc_ohos_test.cpp
    count: 1
    description: >-
      HarmonyOS 专项测试：在 OHOS 运行时下验证 Cbc_solve 完整求解流水线
      （建模 -> proven optimal -> 目标值/解断言），CglLandP cut generator 随
      cgl/0.60.10.1 正常装载（对应 R01 阻塞点）。
  - file: test_package/cbc_consumer.cpp
    count: 1
    description: >-
      消费者用例：仅使用已安装公开头/公开 API 建模生产混合 MILP 并求解，
      断言最优目标值 130，验证第三方编译、链接、调用与运行。
