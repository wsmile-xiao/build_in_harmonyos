# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制校验）

package: cpp-sort/2.2.0
homepage: "https://github.com/Morwenn/cpp-sort"

# 上游测试命令（本库为 header-only CMake 库，测试经 Catch2+CTest 运行）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 中未集成上游测试（header-only 打包构建，测试独立运行）
upstream_test_in_build: false
upstream_test_command: "cmake -S . -B build-tests -DBUILD_TESTING=ON -DCPPSORT_BUILD_TESTING=ON && ctest --test-dir build-tests"

# 上游实际运行的测试程序（2 个 CTest 可执行，Catch2 注册 1462 个独立用例）
upstream_tests:
  - file: tests/CMakeLists.txt
    source: cpp-sort-2.2.0
    description: "main-tests: 125 测试源，Catch2 注册 1406 个独立用例"
    command: "./tests/main-tests"
  - file: tests/CMakeLists.txt
    source: cpp-sort-2.2.0
    description: "heap-memory-exhaustion-tests: 3 测试源，Catch2 注册 56 个独立用例"
    command: "./tests/heap-memory-exhaustion-tests"

# test_package 中自带的测试 (消费者视角验证，实际调用 cpp-sort 排序 API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：merge_sort/adaptive_shivers_sort 正确性与稳定性"
    command: "./test_cpp-sort"

# 测试断言总数（上游 1462 个独立用例全部运行通过）
assertion_count: 1462