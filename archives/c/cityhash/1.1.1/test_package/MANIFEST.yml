# test_package/MANIFEST.yml
# Upstream test declaration file.
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: cityhash/1.1.1
homepage: "https://github.com/google/cityhash"

# Upstream test command (src/Makefile.am defines TESTS = cityhash_unittest,
# executed by automake's parallel test harness through the top-level
# `check` target)
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream test programs actually run
upstream_tests:
  - file: cityhash_unittest
    source: cityhash-1.1.1/src/city-test.cc
    description: "Self-contained reference-vector test: CityHash64/32/128 and CRC256 outputs checked against fixed expected values (14 Check() call sites)"
    command: "make check"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_cityhash.cpp
    description: "Consumer C++ program links packaged cityhash and asserts CityHash64/32 outputs against 4 fixed reference values"
    command: "conan test"

# Approximate assertion count for quality assessment
# (upstream city-test.cc: 14 Check() call sites; consumer: 4)
assertion_count: 18
