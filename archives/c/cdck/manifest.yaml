# 软件级 manifest — cdck
software: cdck
display: "cdck"
description: "CD/DVD 光盘质量检测命令行工具，按扇区读取计时评估刻录质量"
category: utility
homepage: "http://swaj.net/unix/index.html#cdck"
license: GPL-2.0-or-later

# 常用构建系统
build_system: autotools

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "Autotools 工程（预生成 configure），2001 版 config.sub 需补 aarch64 与 linux-ohos 识别"
    - "configure 强依赖 perl 且硬编码 gcc 的 libsupc++.a，补丁使其在 clang+无 perl 环境可继续"
    - "CXXLINK 改用 $(CXX) 链接 C++ 程序；发布包自带过期 src/config.h 需删除"
    - "man 页需 pod2man，无此工具时跳过文档、只交付二进制；package() 直接复制 ELF"
    - "上游无任何测试；test_package 用 -V/-h/坏设备三条真实路径验证"
  common_dependencies: []

# 版本索引
versions:
  "0.7.0":
    status: built
    build_date: "2026-09-09"
    patches: 3
    notes: "CD/DVD 计时检测工具，无外部依赖；二进制 + 许可证文本交付"
