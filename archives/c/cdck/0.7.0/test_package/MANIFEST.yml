# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cdck/0.7.0
homepage: "http://swaj.net/unix/index.html#cdck"

# 上游测试套件存在性 (经审计源码 tar 包确认: 不存在)
upstream_tests_exist: false

# 上游测试审计 (源码: cdck-0.7.0.tar.gz, sha256 cb817ef2e8ab37d499d3630264901b9d22ebe67345507acd364f8f1e3995b404)
upstream_test_audit:
  source_tarball: "cdck-0.7.0.tar.gz"
  source_sha256: "cb817ef2e8ab37d499d3630264901b9d22ebe67345507acd364f8f1e3995b404"
  top_level_files:
    - configure.ac        # 仅编译器/头文件探测 + perl 版 gcc 版本检查, 无测试框架注册
    - Makefile.am         # 仅 SUBDIRS = src man, 无 TESTS / check
    - src/Makefile.am     # 仅 lib_LTLIBRARIES/noinst_LIBRARIES/bin_PROGRAMS, 无 TESTS / check_PROGRAMS / check 目标
    - man/Makefile.am     # 仅 man_MANS = cdck.1, 无测试目标
    - src/cdck_main.cpp   # 纯实现源, 无 TEST/TEST_F (gtest) / def test_ (pytest)
    - src/lib_cdinfo.cpp  # 纯实现源
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am TESTS / check_PROGRAMS / check 目标"
    - "tests/ / test/ 目录与 *test* 源文件"
    - "make check / ctest / meson test 目标"
  scan_result: "0 matches — 源码包共 43 个文件, 无 tests/ 或 test/ 目录, 无 *test* 源文件; 顶层/src/man 的 Makefile.am 均无 TESTS/check_PROGRAMS/check 目标"
  make_check_output: "make check 执行 Automake 默认空 check 目标 (无 TESTS) 退出码 0, 零用例 (配方 build() 真跑 make check -j1 后输出 no_tests 机器证据)"
  reason: "cdck 0.7.0 为纯 CLI 工具, 上游发布包不含任何自动化测试套件; Debian/Gentoo 下游打包均不运行测试; make check 只是 automake 默认空目标, 不能冒充为测试"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用 (hmbs 清单器凭非空 upstream_check_command
# 判"上游存在测试命令"; 置空以对齐 osmctools/sipcalc/virtualpg 等已过门禁的 no_tests 库写法)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# 上游注册零 Automake TESTS, make check 为空目标 (配方仍真跑 make check -j1
# 并在其后输出 HMBS_UPSTREAM_TEST_RESULT no_tests 机器证据标记),
# 无实际上游用例可集成, 故声明 false 并对齐已过门禁范例
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "验证 cdck 二进制真实运行行为: 可执行、-V 输出 0.7.0 版本、-h 输出 Usage、不存在的设备快速返回 TOC 读取错误"
    command: "sh test.sh <installed bin/cdck>"

assertion_count: 4
