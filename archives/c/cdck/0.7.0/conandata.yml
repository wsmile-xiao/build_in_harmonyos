# conandata.yml — cdck 0.7.0
#
# Upstream publishes its tarball over plain HTTP (the host does not
# serve HTTPS; verified 2026-09-09: https handshake times out). The same
# http:// URL is used by Debian and Gentoo, so it is kept as the fallback
# source with a sha256 pin (size 240285 bytes, matching Gentoo).
# The 2026-09-08 preflight failed in source download with
# `Signal 9` + `gzip: stdin: unexpected end of file` (truncated fetch from
# the single slow http:// origin), so the Gentoo distfiles HTTPS copy of
# the identical tarball (Gentoo Manifest: DIST cdck-0.7.0.tar.gz 240285,
# same byte size; alienwah/1.13 precedent for distfiles.gentoo.org
# fallback) is listed first; the official http:// URL stays last.
# Conan get() tries the list in order with the unchanged sha256.

sources:
  url:
    - "https://distfiles.gentoo.org/distfiles/cdck-0.7.0.tar.gz"
    - "http://swaj.net/unix/cdck/cdck-0.7.0.tar.gz"
  sha256: "cb817ef2e8ab37d499d3630264901b9d22ebe67345507acd364f8f1e3995b404"

patches:
  - patch_file: "patches/0001-config.sub-ohos.patch"
    patch_description: "0001 config.sub recognize aarch64 and linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-ohos-perl-supcxx.patch"
    patch_description: "0002 configure tolerate missing perl and non-gcc toolchain"
    patch_type: "portability"
  - patch_file: "patches/0003-src-makefile-cxxlink.patch"
    patch_description: "0003 link C++ programs with CXX instead of CC"
    patch_type: "portability"
  - patch_file: "patches/0004-man-pod-cut.patch"
    patch_description: "0004 drop stray leading =cut so modern pod2man accepts cdck_man.in"
    patch_type: "portability"
