# 版本级 manifest — cdck 0.7.0
version: "0.7.0"
software: cdck

# 编译状态
status: built
build_date: "2026-09-09"
build_system: autotools

# 源码信息
source:
  url:
    - "https://distfiles.gentoo.org/distfiles/cdck-0.7.0.tar.gz"
    - "http://swaj.net/unix/cdck/cdck-0.7.0.tar.gz"
  sha256: "cb817ef2e8ab37d499d3630264901b9d22ebe67345507acd364f8f1e3995b404"
  tar_format: tar.gz

# 构建配置
build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies: []
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied:
  - "0001-config.sub-ohos.patch"
  - "0002-configure-ohos-perl-supcxx.patch"
  - "0003-src-makefile-cxxlink.patch"
  - "0004-man-pod-cut.patch"

# 知识沉淀
knowledge_gained:
  - "2001 版 config.sub 不识别 aarch64 与 linux-ohos，需同步补 CPUs 与 OS 两处模式（aalib 同年代包先例）"
  - "configure 强依赖 perl（gcc 版本探测）且硬编码 gcc 的 libsupc++.a；OHOS 下补丁使其缺 perl 可继续、SUPCXX 按 $CC 解析且仅保留真实绝对路径"
  - "CXXLINK 用 $(CC) 链接 C++ 程序在 clang+libc++ 下缺运行时，改为 $(CXX)（源码与生成 Makefile 同改）"
  - "man/Makefile 的 all-am 依赖 pod2man 生成的 cdck.1；无 pod2man 时预建最小 cdck.1 跳过文档、package() 只复制二进制，彻底绕开 install-sh 文档链"
  - "发布包自带 maintainer 生成的 src/config.h 会遮蔽 configure 产物，source() 中删除（cdecl 先例）"
  - "上游无任何测试（43 文件审计），如实声明 no_tests；test_package 用 -V/-h/坏设备三条真实路径验证（R34）"
