software: calc
display: "calc"
description: "C-style arbitrary precision calculator — 任意精度算术系统，支持 C 语言风格表达式"
category: system
homepage: "http://www.isthe.com/chongo/tech/comp/calc/"
license: LGPL-2.1
build_system: makefile
status: built

ohos_adaptation:
  key_points:
    - "自定义 Makefile 构建系统，无 configure 脚本"
    - "上游说明不支持并行编译（parallel make not supported），需使用 -j1"
    - "OHOS 上需注意 E074 (SELinux 禁止 FIFO 创建，make -j2+ 会卡住)"
    - "可选依赖 readline 库（交互式命令行历史），无 readline 也可编译"
    - "bcal 同类项目经验：纯 Makefile + readline 可无修改编译通过"
  common_dependencies:
    - readline (optional)

