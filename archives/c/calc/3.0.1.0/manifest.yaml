software: calc
display: "calc"
description: "C-style arbitrary precision calculator — 任意精度算术系统，支持 C 语言风格表达式"
category: system
homepage: "http://www.isthe.com/chongo/tech/comp/calc/"
license: LGPL-2.1
build_system: makefile
status: built

ohos_adaptation:
  key_points:
    - "自定义 Makefile 构建系统，无 configure 脚本"
    - "上游说明不支持并行编译（parallel make not supported），需使用 -j1"
    - "OHOS 上需注意 E074 (SELinux 禁止 FIFO 创建，make -j2+ 会卡住)"
    - "可选依赖 readline 库（交互式命令行历史），无 readline 也可编译"
    - "v3.0.1.0 上游已移除 have_fgetsetpos.c / file.h 中 fpos_t 用法，不再需要 2.15.1.0 的 fpos 补丁"
    - "LN=cp（HMDFS 禁止硬链接），MAN/GZIP 包装器处理 busybox 兼容"
  common_dependencies:
    - readline (optional)

versions:
  "3.0.1.0":
    status: built
    build_date: "2026-09-21"

patch_generation:
  method: none
  patches_count: 0