# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: calc/3.0.1.0
homepage: "https://github.com/lcn2/calc"

# 上游测试命令 (calc 使用 make check 运行回归测试)
upstream_check_command: "make check -j1"

# conanfile.py build() 方法中是否已集成上游测试
# 上游回归测试 (cal/regress.cal ~11031 行, 5782 独立检查点) 在 make check 中运行
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: cal/regress.cal
    source: calc-3.0.1.0/cal/regress.cal
    description: "calc 官方回归测试套件 (5782 独立编号检查点, .cal scripts driven by calc binary)"
    command: "make check -j1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 calc -v 验证版本，calc -q 验证算术表达式计算和任意精度乘法"
    command: "./test.sh"
  - file: test_fpos.cal
    description: "通用文件位置跟踪测试：fopen/fputs/rewind/ftell 返回 0/绝对定位读取/fclose 全链路，拒绝巨大乱码整数（musl fpos_t 兼容性）"
    command: "calc -q -f test_fpos.cal"

# 测试断言总数 (近似值, 用于质量评估)
# 3 (test.sh) + 13 (test_fpos.cal) = 16
assertion_count: 16
