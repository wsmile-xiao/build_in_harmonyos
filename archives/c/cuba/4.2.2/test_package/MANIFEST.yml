# test_package/MANIFEST.yml — cuba 4.2.2
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: cuba/4.2.2
homepage: "https://feynarts.de/cuba/"

# 上游无 make check 正式测试套件；官方演示程序 demo/demo-c.c 覆盖 4 算法
upstream_check_command: "make demos && ./demo-c（上游无 make check）"

# conanfile.py build() 中是否已集成上游测试（层1）
upstream_test_in_build: true
upstream_test_command: "build() 内编译实跑 demo/demo-c.c（Vegas/Suave/Divonne/Cuhre 4 算法，exit 0 + 输出齐全性 grep）"

# 上游无正式测试套件（makefile.in 无 check/test 目标；testsuite.m 是 Mathematica
# 脚本，本目标不可运行）。官方 demo-c.c 覆盖 4 个算法 = 4 个 smoke 判定点。
upstream_test_count: 4
upstream_test_cases_skipped: 0
