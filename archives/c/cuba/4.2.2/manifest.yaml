# 版本级 manifest — cuba 4.2.2
# 遵循 ARCHIVE-SPEC v2.0

version: "4.2.2"
software: cuba

status: built
build_date: "2026-09-09"
build_system: autotools

source:
  url: "https://feynarts.de/cuba/Cuba-4.2.2.tar.gz"
  sha256: "8d9f532fd2b9561da2272c156ef7be5f3960953e4519c638759f1b52fe03ed52"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
  - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu"
  - "make lib（只编 libcuba.a + cuba.h；make all 需 Mathematica/fortran 前端，不构建）"
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
- "Cuba 4.2.2 上游无 make check 正式测试套件（makefile.in 无 check/test 目标）；官方验证载体是 demo/demo-c.c（Vegas/Suave/Divonne/Cuhre 4 算法同一被积函数实跑）"
- "demo-c.c 需 -DREALSIZE=8（makefile 由 configure 注入；8=double 走 #include \"cuba.h\"，10/16 才需 sed 生成 cubal.h/cubaq.h）"
- "config.guess 年代老：显式 --build/--host=aarch64-unknown-linux-gnu 跳过写盘探针（libmatheval 同款教训复用）"
- "上游只产静态库 libcuba.a（libtool 都不用，纯 ar），包类型 static-library"
