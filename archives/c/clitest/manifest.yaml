software: clitest
display: "clitest"
description: "Unix 命令行测试器：读取文本/Markdown 文件中记录的命令，执行并与文件中写明的预期输出逐字节比对"
category: development
homepage: "https://github.com/aureliojargas/clitest"
license: "MIT"
build_system: custom

ohos_adaptation:
  key_points:
    - "单文件 POSIX shell 脚本，无编译单元；上游 Makefile 仅封装 docker 的 lint/test 流程，不是构建系统"
    - "鸿蒙无传统 /bin 目录，sh 位于 /system/bin/sh（知识条目 E165）：补丁改写 shebang，否则安装后的 clitest 无法直接执行（commands.json 声明依赖直接执行）"
    - "鸿蒙 /tmp 只读（知识条目 E002）：上游把临时目录基路径硬编码为 ${TMPDIR:-/tmp}，$TMPDIR 未设置时直接报错退出；补丁只改默认值（/tmp 可写则用 /tmp，否则回退 $HOME），显式设置的 $TMPDIR 仍原样尊重，上游『无效 TMPDIR 必须报错』语义与对应用例保持不变"
    - "package_type=application；package_id 删除 arch/compiler/build_type，保留 os（产物含鸿蒙专用 shebang）"
    - "HMDFS 上 chmod 常被忽略，配方尽力 chmod 0755 但测试一律通过显式解释器调用，不依赖执行位"
    - "上游自举测试 test.md 共 286 用例：适配环境下 bash/dash/zsh/busybox sh 及 shebang 直执行五种方式均 286/286 通过（打补丁前后一致）"
  common_dependencies: []

versions:
  "0.5.0":
    status: built
    build_date: "2026-09-21"
    conan_ref: "clitest/0.5.0"
