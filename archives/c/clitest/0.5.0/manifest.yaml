    - "share/doc/clitest/CHANGELOG.md"
    - "licenses/LICENSE.txt"

patches_applied:
  - "0001-clitest.patch"

knowledge_gained:
  - "鸿蒙无传统 /bin 目录，sh 在 /system/bin/sh（E165）：脚本类工具包必须改写 shebang，否则 commands.json 声明的直接执行不可用"
  - "鸿蒙 /tmp 只读（E002）：脚本把 ${TMPDIR:-/tmp} 硬编码为临时目录基路径时，$TMPDIR 未设置即全功能不可用；修法是只改默认值、保留显式 $TMPDIR 的原有语义，避免破坏上游『无效 TMPDIR 必须报错』的用例"
  - "lang-preflight 对『顶层有 Makefile 但零 C/C++ 源文件』的脚本类项目误判为 c（构建系统优先级压过源码统计，且 source_stats 自承『无源文件可统计』仍不降级）"
  - "上游自举测试（clitest 用自己跑 test.md）中的用例以 ./clitest 形式调用，依赖 shebang；改写 shebang 后必须用等价解释器映射才能在非鸿蒙主机复现，否则会误报大面积失败"

conan:
  reference: "clitest/0.5.0"
  package_type: application
  architecture_independent: true
  user_channel: "ohpcd/stable"

test_scope:
  upstream_functional_cases: 286
  upstream_functional_passed: 286
  upstream_test_file: "test.md"
  upstream_shell_matrix_executed:
    - "bash: 286/286"
    - "dash: 286/286"
    - "zsh: 286/286"
    - "busybox sh: 286/286"
    - "./clitest (shebang): 286/286"
  test_package_assertions: 21
  generic_assertions: 12
  harmonyos_assertions: 9
  harmonyos_test_files:
    - "test_package/test_clitest_ohos.sh"
  upstream_test_evidence: >-
    test.md = 2420 lines, test/ = 65 fixtures; Makefile target `test-%` runs
    `$* ./clitest --first --progress none test.md` over bash/dash/mksh/sh/zsh.
    Executed here: 286 of 286 tests passed, pristine and patched.

