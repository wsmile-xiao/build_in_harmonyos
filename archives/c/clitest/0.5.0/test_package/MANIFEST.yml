# test_package/MANIFEST.yml
# Upstream test declaration for clitest 0.5.0 (required by CI L0e).
package: "clitest/0.5.0"
homepage: "https://github.com/aureliojargas/clitest"
upstream_repo: "https://github.com/aureliojargas/clitest"

# ── R51 upstream test inventory ──────────────────────────────────────────────
# clitest is tested with itself: test.md (2420 lines) is a clitest document
# holding the whole suite, backed by 65 fixture/helper files under test/.
# Registration: the upstream Makefile target `test-%` runs
#   `$* ./clitest --first --progress none test.md`
# for bash, dash, mksh, sh and zsh (inside the maintainer's docker image);
# .github/workflows/check.yml runs the same matrix. There is no ctest/pytest
# registration and no compiled test binary.
#
# Inventory command and result:
#   $ ls test | wc -l            -> 65
#   $ wc -l test.md              -> 2420
#   $ sh ./clitest --progress none test.md
#     -> "OK: 286 of 286 tests passed"   (286 = N, the upstream case count)
#
# Actually executed during this adaptation (transcripts in ../notes.md):
#   pristine source, bash        : 286/286 passed
#   pristine source, dash        : 286/286 passed
#   patched source,  bash        : 286/286 passed
#   patched source,  dash        : 286/286 passed
#   patched source,  zsh         : 286/286 passed
#   patched source,  busybox sh  : 286/286 passed
#   patched source,  ./clitest   : 286/286 passed  (shebang path, with
#                                  /system/bin/sh mapped to dash on the host)
# mksh and ksh are not installed on the adaptation host, so those two rows of
# the upstream shell matrix were not reproduced.
#
# Not executed inside build(): every case in test.md invokes `./clitest`
# through the shebang, which after patching points at /system/bin/sh. Running
# the suite in build() would therefore measure the build host's shebang
# support instead of clitest, and several cases depend on perl / GNU-diff
# behaviour that HarmonyOS toybox does not provide. The suite is run outside
# build() (above) and the platform-relevant behaviour is re-asserted by the
# test_package scripts below, which do run on the CI device.
upstream_test_in_build: false
upstream_test_command: "sh ./clitest --progress none test.md"
upstream_test_count: 286
upstream_test_passed: 286
upstream_tests:
  - file: "test.md"
    count: 286
    description: >-
      clitest's self-hosted suite: option parsing, prompt/prefix handling,
      Markdown and plain-text parsing, inline matchers (--text, --lines,
      --exit, --egrep, --perl, --file, --eval), exit codes, error messages,
      --list/--list-run, ranges (--skip/--test), --pre-flight/--post-flight,
      temp dir handling and no-trailing-newline edge cases.
upstream_test_evidence: >-
  `wc -l test.md` = 2420; `ls test | wc -l` = 65 fixtures; Makefile target
  `test-%` = `$* ./clitest --first --progress none test.md` (bash/dash/mksh/
  sh/zsh matrix, mirrored by .github/workflows/check.yml). Suite executed:
  286 of 286 tests passed with bash and with dash on pristine sources, and
  286 of 286 with the patched script.

# ── test_package supplied tests ──────────────────────────────────────────────
test_package_tests:
  - file: "test_clitest.sh"
    count: 12
    description: >-
      Generic behaviour of the installed tool, each assertion running
      `sh <pkg>/bin/clitest` against a real test document: --version, --help,
      an all-passing 3-test file, a failing file (exit code + "FAIL: 1 of 2"),
      the expected/actual diff body, inline matchers --lines/--text/--exit,
      --list, --prefix tab on a Markdown-style document, --first aborting at
      the first failure, "no test found" rejection, --pre-flight, and the
      error for a missing test file.
    command: "sh test_clitest.sh <package>/bin/clitest"
  - file: "test_clitest_ohos.sh"
    count: 9
    description: >-
      HarmonyOS runtime constraints (9 assertions, 2 of them conditional):
      packaged
      shebang is #!/system/bin/sh (E165); /system/bin/sh really runs the
      packaged script — direct exec first, explicit `/system/bin/sh <script>`
      when HMDFS exec bits block direct exec (SKIP when /system/bin/sh is
      absent); $TMPDIR unset with a
      read-only /tmp must still work via the $HOME fallback (SKIP when /tmp is
      writable, i.e. off-device); an explicitly invalid $TMPDIR must still fail
      loudly (upstream semantics preserved); an explicit writable $TMPDIR is
      used and its temp dir cleaned up; exec-bit independence under HMDFS
      chmod normalisation; UTF-8 byte-exact comparison; $TMPDIR paths
      containing spaces; packaged script completeness.
    command: "sh test_clitest_ohos.sh <package>/bin/clitest"
test_package_assertion_count: 21
generic_assertion_count: 12
harmonyos_test_count: 9
harmonyos_assertion_count: 9
assertion_count: 21
counting_policy: >-
  Each ok()/no() call counts as one assertion; sk() (precondition absent)
  counts in the total but is reported as SKIP, never as a pass. Adaptation
  host result: 12/12 generic, 8 passed + 1 SKIP for HarmonyOS.
