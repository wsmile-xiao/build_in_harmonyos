knowledge_gained:
  - "Perl 5.42 @INC 不含 cwd,Configure 的 require 'perl/*.pl' 需要 PERL5LIB=$SRC"
  - "鸿蒙 utmp.h 只定义 UT_HOSTSIZE/LINESIZE/NAMESIZE(不含 UT_USERSIZE),旧代码 foo_utmp 头文件暂定定义在 clang/lld 下必然重复符号;显式 #define UT_USERSIZE 32 替代 sizeof 推导"
  - "鸿蒙无 cc 别名,make 必须显式 CC=clang"
  - "cfingerd 交互式 Install 脚本 + chown root 在沙箱不可用,package() 用 copy() 替代 make install"

