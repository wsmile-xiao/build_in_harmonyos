# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cfingerd/1.4.3
homepage: "https://www.infodrom.org/projects/cfingerd/"

# 上游测试命令: cfingerd 1.4.3 (1999) 上游不提供任何测试套件
# (无 make check target, 无 tests/ 目录; man 手册与 FAQ 亦无测试指引)
upstream_check_command: "make check"
upstream_check_result: "no-test-target"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "可执行二进制 smoke 测试: cfingerd -h 输出 usage 且 rc=0; cfingerd -v 输出版本信息"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
