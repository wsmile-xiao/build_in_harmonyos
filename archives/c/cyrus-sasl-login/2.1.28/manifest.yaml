# 版本级 manifest
# 文件位置: archives/c/cyrus-sasl-login/2.1.28/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.28"

# 软件名
software: "cyrus-sasl-login"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 cyrus-sasl 2.1.28 同源：LOGIN 机制是上游源码内 plugins/login.c）
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"

  # 源码校验和
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（LOGIN 专用最小闭包：仅启用 login，其余机制/后端全关）
  configure_options:
    - "--enable-login"
    - "--disable-shared"
    - "--enable-static"
    - "--with-staticsasl"
    - "--with-dblib=none"
    - "--without-saslauthd"
    - "--without-openssl"
    - "--disable-sample"
    - "--disable-gssapi"
    - "--disable-ldapdb"
    - "--disable-sql"
    - "--disable-ntlm"
    - "--disable-otp"
    - "--disable-srp"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "LOGIN 是自包含明文机制（plugins/login.c，由 PLAIN 派生），无需 openssl/lmdb/sqlite3，零依赖可编"
  - "上游默认关闭 LOGIN，必须显式 --enable-login（BLFS：unsupported LOGIN authentication method）"
  - "configure 用 AC_PROG_CC_FOR_BUILD 裸搜 gcc/cc，OHOS 仅有 clang，需显式喂 CC_FOR_BUILD=clang"
  - "静态构建 --with-staticsasl 把 login.c 等链入 libsasl2.a，无需运行期 SASL_PATH/dlopen"
  - "HMDFS 默认 tmp 可能不可写，TMPDIR 指到源码树内 tmp（HMBS 注入值优先）"
