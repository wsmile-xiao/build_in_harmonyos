# 软件级 manifest
# 文件位置: archives/c/cyrus-sasl-login/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: cyrus-sasl-login

# 显示名
display: "Cyrus SASL LOGIN mechanism"

# 一句话描述
description: "Cyrus SASL LOGIN authentication mechanism (libsasl2 with LOGIN support)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: security

# 官网 URL
homepage: "https://www.cyrusimap.org/sasl/"

# 开源许可证（SPDX 标识）
license: BSD-Attribution-HPND-disclaimer

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "LOGIN 为自包含明文机制（plugins/login.c），零外部依赖"
    - "上游默认关闭 LOGIN，需显式 --enable-login"
    - "configure 需显式喂 CC_FOR_BUILD=clang（OHOS 无 gcc/cc）"
    - "静态构建 --with-staticsasl，无需运行期 SASL_PATH/dlopen"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.1.28":
    status: built
    build_date: "2026-09-11"
    conan_ref: "cyrus-sasl-login/2.1.28"
    note: "LOGIN 机制首个适配版本；待 HMBS 真机验证通过后标 published"
