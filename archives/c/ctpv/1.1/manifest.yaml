version: "1.1"
software: "ctpv"
status: built
build_date: "2026-09-11"
build_system: makefile
conan_ref: "ctpv/1.1"

source:
  url: "https://github.com/NikitaIvanovV/ctpv/archive/refs/tags/v1.1.tar.gz"
  sha256: "29e458fbc822e960f052b47a1550cb149c28768615cc2dddf21facc5c86f7463"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=<OHOS Clang>"
    - "HOSTCC=<native C compiler>"
    - "CFLAGS=-O2 -fPIE"
    - "LDFLAGS=-static-pie -Wl,-z,relro,-z,now"
    - "make -j1"
  dependencies:
    - "libmagic/5.48"
    - "openssl/3.5.6.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-portable-build-and-runtime-paths.patch"
  - "0002-preserve-eof-in-lexer.patch"
  - "0003-allow-shell-from-path.patch"
  - "0004-add-long-options.patch"
  - "0005-build-ctpvclear-native-launcher.patch"
  - "0006-add-helper-command-discovery.patch"

knowledge_gained:
  - "ctpv 的 embed 工具是构建期生成器，交叉编译时必须使用宿主编译器"
  - "运行时临时文件路径必须遵循 TMPDIR，不能假定 /tmp 可写"
  - "AArch64 OHOS 的 char 默认为 unsigned，词法器必须以 int 保存 EOF"
  - "ctpv 1.1 上游未提供测试目录、测试文件、注册测试或 make check/test 目标"
  - "libmagic 的 magic.mgc 数据库需要随应用打包并通过 Conan 运行环境声明"
  - "HarmonyOS 没有传统 /bin 目录，安装命令不能依赖 #!/bin/sh；ctpvclear 改为目标架构原生启动器"

test_results:
  type: qemu_ohos_aarch64
  upstream_declared_total: 0
  upstream_executed_total: 0
  consumer_assertions_total: 12
  consumer_assertions_passed: 12
  consumer_assertions_failed: 0
  consumer_assertions_skipped: 0
  harmonyos_specific_assertions: 1
