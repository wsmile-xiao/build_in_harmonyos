sources:
  url: "https://github.com/NikitaIvanovV/ctpv/archive/refs/tags/v1.1.tar.gz"
  sha256: "29e458fbc822e960f052b47a1550cb149c28768615cc2dddf21facc5c86f7463"

patches:
  "1.1":
    - patch_file: "patches/0001-portable-build-and-runtime-paths.patch"
      patch_description: "Separate the build helper compiler and honor portable runtime paths"
      patch_type: "portability"
    - patch_file: "patches/0002-preserve-eof-in-lexer.patch"
      patch_description: "Preserve EOF as int on targets where char is unsigned"
      patch_type: "bugfix"
    - patch_file: "patches/0003-allow-shell-from-path.patch"
      patch_description: "Allow an unqualified shell name to be resolved through PATH"
      patch_type: "portability"
    - patch_file: "patches/0004-add-long-options.patch"
      patch_description: "Add conventional long option aliases for command discovery and smoke tests"
      patch_type: "portability"
    - patch_file: "patches/0005-build-ctpvclear-native-launcher.patch"
      patch_description: "Replace the hard-coded shell launcher with a native target executable"
      patch_type: "portability"
    - patch_file: "patches/0006-add-helper-command-discovery.patch"
      patch_description: "Add help and version discovery to packaged helper commands"
      patch_type: "portability"
