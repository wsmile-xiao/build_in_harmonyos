software: ctpv
display: "ctpv"
description: "使用 MIME 类型和可配置后端的终端文件预览器"
category: utility
homepage: "https://github.com/NikitaIvanovV/ctpv"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "使用宿主编译器生成构建期内嵌资源工具，目标程序由 OHOS Clang 编译"
    - "临时 IPC 和状态文件遵循 TMPDIR，默认 shell 通过 PATH 查找"
    - "应用及第三方依赖静态链接为 AArch64 PIE"
  common_dependencies:
    - libmagic
    - openssl

versions:
  "1.1":
    status: built
    build_date: "2026-09-11"
    conan_ref: "ctpv/1.1"
