# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁强制要求存在）

package: clipnotify/1.0.2
homepage: "https://github.com/cdown/clipnotify"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试套件（仓库仅 clipnotify.c/Makefile/README，无 test 目录）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "(packaged bin/clipnotify)"
    description: "Consumer test: signed ELF executes on OHOS, deterministic no-X error path (exit 1 + Can't open X display)"
    command: "bin/clipnotify (no X display)"

# 测试断言总数 (近似值)
assertion_count: 2
