# conandata.yml — cdtool 2.1.8-release（上游项目 cdtool）
#
# 单一事实源：源码 URL + SHA-256 + 补丁清单。
# conanfile.py 通过 self.conan_data["sources"] 与 apply_conandata_patches() 消费。
#
# 上游版本说明：上游官网最新发布版即 2.1.8（2006-08-09，hinterhof.net 新闻页），
# 任务卡版本串 "2.1.8-release" 取自 Debian 上游版本号（cdtool_2.1.8-release-9.dsc
# 的 Version: 2.1.8-release-9），其 orig tarball 与官网 cdtool-2.1.8.tar.gz 逐字节相同。
# 目录与配方版本保持 "2.1.8-release" 以匹配 CI L0n 分支名门禁。

sources:
  url: "https://hinterhof.net/cdtool/dist/cdtool-2.1.8.tar.gz"
  sha256: "73de81ea2de2eae64b888e1b2739ef643ccea13c79790569f8e6278369976a21"

patches:
  - patch_file: "patches/0001-configure-umask-000.patch"
    patch_description: >
      autoconf 生成的 configure 用 umask 077 建立 config.status 的临时目录
      confstatXXXXXX；OHOS 文件系统上 0700 目录对构建进程不可写，config.status
      的重定向全部报 Permission denied，config.h/Makefile 未生成，而 configure
      自身仍返回 0（静默失败），错误推迟到 make 才以 No targets specified and no
      makefile found 暴露。改为 umask 000。
    patch_type: "portability"

  - patch_file: "patches/0002-commands-include-fcntl.patch"
    patch_description: >
      commands.c 使用 open(O_RDONLY | O_NONBLOCK) 但未包含 fcntl.h，其已包含的
      sys/file.h 在 OHOS musl 上不引入 fcntl.h，clang 15 报 use of undeclared
      identifier 'O_RDONLY' / 'O_NONBLOCK'。补 fcntl.h。
    patch_type: "portability"

  - patch_file: "patches/0003-cdown-getline-rename.patch"
    patch_description: >
      cdown.c 自定义 char *getline(void)（CDDB 文本行读取）与 OHOS musl stdio.h
      声明的 POSIX.1-2008 ssize_t getline(char**, size_t*, FILE*) 冲突，clang 15 报
      conflicting types for 'getline' 及全部调用点 too few arguments。将自定义函数
      及其调用点、注释统一改名为 cdtool_getline。
    patch_type: "portability"
