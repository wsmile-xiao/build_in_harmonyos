# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求此文件存在）
# 详见 docs/TEST_QUALITY_SPEC.md
#
# 上游测试审计（2026-09-13，基于 cdtool-2.1.8.tar.gz 解包后的真实目录）：
#   1. tarball 顶层无 tests/ test/ 目录（顶层仅 CHANGES COPYING CREDITS
#      INSTALL Makefile.in README TODO 与 *.c/*.h/手册页）
#   2. Makefile.in 无 check / test 目标（`grep -nE '^(check|test)' Makefile.in`
#      零命中；仅有 all/install/install-files/install-links/clean/distclean）
#   3. configure.ac 无测试宏（无 AC_CONFIG_TESTDIR / AM_PATH_* / AX_* 测试宏）
#   结论：上游自动化测试 TOTAL=0，如实声明，不伪造通过率。

package: cdtool/2.1.8-release
homepage: "https://hinterhof.net/cdtool/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：上游无任何自动化测试
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_cdtool.py
    description: >
      消费测试：对已安装包目录校验安装布局（lib/cdtool/cdtool 主程序、
      bin/ 下 5 个独立产物 + 10 个别名符号链接、share/man/man1 16 份手册页）、
      OHOS 产物属性（aarch64 PIE + /lib/ld-musl-aarch64.so.1 加载器 + 不引用
      glibc），并真实运行 cdplay -V / cdtool -V / cdctrl -h / cdown -V /
      cdtool2cddb -h 五个命令断言 rc=0 且输出匹配
    command: "python3 test_cdtool.py <package_folder>"

# 测试断言总数（test_cdtool.py 的 PASS 检查项数）
assertion_count: 16
