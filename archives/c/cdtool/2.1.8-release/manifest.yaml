# 版本级 manifest — cdtool 2.1.8-release
# 遵循 ARCHIVE-SPEC v2.0

version: "2.1.8-release"
software: cdtool

# 编译状态: published | built | failed | archived
# built: conan-verify 通过（尚未经 CI release 上传制品仓）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-13"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================
source:
  # 官方源（hinterhof.net，HTTPS）
  url: "https://hinterhof.net/cdtool/dist/cdtool-2.1.8.tar.gz"
  sha256: "73de81ea2de2eae64b888e1b2739ef643ccea13c79790569f8e6278369976a21"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--bindir=/bin"
    - "--mandir=/share/man"
  # 零第三方依赖：socket 由 libc 提供（AC_CHECK_LIB(socket, connect)），
  # getopt.h/mntent.h/linux/cdrom.h 由 OHOS sysroot 提供
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-configure-umask-000.patch"
  - "0002-commands-include-fcntl.patch"
  - "0003-cdown-getline-rename.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "E011 实例：autoconf 生成的 configure 用 umask 077 建 config.status 临时目录 confstatXXXXXX，OHOS 上 0700 目录对构建进程不可写，config.status 全部重定向 Permission denied、config.h/Makefile 未生成，而 configure 自身仍返回 0（静默失败），错误推迟到 make 才以 No targets specified and no makefile found 暴露——必须核对产物文件而非只看退出码"
  - "缺 <fcntl.h> 的 O_NONBLOCK 报错具有误导性：源码已包含 <sys/file.h>，但 OHOS musl 的 sys/file.h 不引入 fcntl.h（与 glibc 行为不同），clang 15 报 use of undeclared identifier 'O_RDONLY'/'O_NONBLOCK'"
  - "上游自定义 char *getline(void) 与 musl stdio.h 的 POSIX.1-2008 ssize_t getline(char**, size_t*, FILE*) 冲突：clang 报 conflicting types for 'getline' 加全部调用点 too few arguments；改名（定义/调用点/注释同步）即解"
  - "上游发布的 2.1.8 tarball 内 pre-generated configure 来自更早的 configure.ac（PACKAGE_VERSION='2.1.8pre3'），而同包 configure.ac 已写 AC_INIT(CDTOOL, 2.1.8)；构建走 pre-generated configure 故二进制自报 2.1.8pre3——测试断言不可绑死上游自报版本串"
  - "单程序多名字布局：真正二进制只有 lib/cdtool/cdtool，bin/ 下 10 个命令是相对符号链接 ../lib/cdtool/cdtool（argv[0] 分派），bin/ 中没有名为 cdtool 的入口；package_info 不可想当然声明 bin/cdtool"
