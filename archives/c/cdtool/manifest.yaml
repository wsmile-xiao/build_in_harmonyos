# 软件级 manifest — cdtool
# 遵循 ARCHIVE-SPEC v2.0
#
# 命名说明：上游项目名、Debian 包名与平台任务卡软件名均为单数 cdtool；
# 本目录按平台任务卡与 CI L0n 分支名门禁取 cdtool。
# 仓库内另有历史归档 archives/c/cdtools/2.1.8（同一份上游源码，sha256 相同，
# 由另一任务 contrib-4078 于 2026-08-28 完成），两者是不同 Conan ref：
#   cdtools/2.1.8（已发布）  vs  cdtool/2.1.8-release（本目录）

software: cdtool
display: "cdtool (CD-ROM audio control tools)"
description: "命令行控制 CD-ROM 音频功能的工具集（单程序多名字：cdplay/cdpause/cdstop/cdclose/cdeject/cdir/cdinfo/cdreset/cdvolume/cdshuffle 共 10 个别名，另有 cdctrl/cdown/cdadd/cdloop/cdtool2cddb 五个独立产物）"
category: utility
homepage: "https://hinterhof.net/cdtool/"
license: GPL-2.0-only

build_system: autotools

ohos_adaptation:
  key_points:
    - "E011：configure 的 config.status 临时目录用 umask 077 创建，OHOS 上 0700 目录不可写 → configure 返回 0 但 config.h/Makefile 未生成（静默失败），改为 umask 000"
    - "commands.c 用 O_NONBLOCK 但未包含 <fcntl.h>；OHOS musl 的 <sys/file.h> 不引入 fcntl.h，clang 15 报 use of undeclared identifier"
    - "cdown.c 自定义 char *getline(void) 与 musl stdio.h 的 POSIX getline 冲突，重命名 cdtool_getline"
    - "OHOS /tmp 只读：configure 的编译器探测需 TMPDIR 指向可写构建目录"
    - "make 固定 -j1：规避 OHOS 上 jobserver fifo 被拒"
  common_dependencies: []

versions:
  "2.1.8-release":
    status: built
    build_date: 2026-09-13
    notes: "上游自动化测试 TOTAL=0（无 tests/、无 check 目标、无测试宏），如实声明；构建期 4 个二进制 -V/-h 冒烟 + 消费测试 16 断言"
