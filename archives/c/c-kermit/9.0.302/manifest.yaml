# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "musl libc FILE internals (_cnt, _IO_read_end) 不可访问；使用 conchk() 替代 stdin 缓冲窥探"
  - "vhangup syscall 在 OpenHarmony 上不可用；使用 __OHOS__ 守卫 undef CK_VHANGUP"
  - "getusershell/endusershell 在 musl libc 中不存在；使用 -DNOGETUSERSHELL 编译选项"
  - "utmp 系列函数 (getutent, setutent, updwtmp) 在 musl libc 中不存在；使用 __OHOS__ 守卫 undef 相关宏"

