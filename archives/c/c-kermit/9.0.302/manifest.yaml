version: "9.0.302"
status: built
build_date: "2026-09-06"

source:
  url: "https://www.kermitproject.org/ftp/kermit/archives/cku302.tar.gz"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make linux CC=<conan-cc> CC2=<conan-cc> SHELL=<bash> -j1"
  cc: clang

patches_applied:
  - "0001-ckcdeb.h-ohos-nogetusershell.patch"
  - "0002-ckucmd.c-ohos-stdio-musl.patch"
  - "0003-ckupty.c-ohos-no-vhangup.patch"

knowledge_gained:
  - "cku302.tar.gz 为扁平包（74 个顶层条目、无根目录），conan get 必须 strip_root=False"
  - "linuxa 硬编码 CC=gcc，配方以 make 命令行变量覆盖（自动透传给递归子 make），R9 用 -j1"
  - "musl 缺 getusershell/endusershell，需定义 NOGETUSERSHELL（ckcdeb.h 接历史 ckermit/302 方案）"
  - "musl 下 FILE 不透明：cmdgetc 的 #undef CMD_CONINC 使 cmdconchk 走 stdio 窥探分支，OHOS 上强制 conchk() 路径"
  - "musl 无 vhangup()：OHOS 上不定义 CK_VHANGUP，改走 HAVE_OPENPTY 探测到的 pty 路径"
  - "上游无任何自动化测试（无 tests 目录、无 check/test 目标），属审计确认的 no_tests 情形"
