# conandata.yml — c-kermit 9.0.302
# Official Kermit Project source archive (cku302.tar.gz, 3122219 bytes).
# sha256 verified from the downloaded archive and two independent Wayback
# captures (same size + same hash); kept unchanged for every URL below —
# conan verifies the hash per URL and tries the next one on mismatch.
# Ordered fallback (official URL kept last as required):
#   1. Minix distfiles backup (HEAD: 200, 3122219 bytes, same filename) —
#      different host, bypasses kermitproject.org HTTPS interception that
#      deterministically returned hash a7c3881f… on the device;
#   2. same-host plain-HTTP variant (HEAD: 200, 3122219 bytes) — same file,
#      bypasses TLS-layer interception;
#   3. official HTTPS URL (last resort).

sources:
  url:
    - "http://www.minix3.org/distfiles-backup/kermit-9.0.302/cku302.tar.gz"
    - "http://www.kermitproject.org/ftp/kermit/archives/cku302.tar.gz"
    - "https://www.kermitproject.org/ftp/kermit/archives/cku302.tar.gz"
  sha256: "0d5f2cd12bdab9401b4c836854ebbf241675051875557783c332a6a40dac0711"

patches:
  - patch_file: "patches/0001-ckcdeb.h-ohos-nogetusershell.patch"
    patch_description: "HarmonyOS (musl): no getusershell/endusershell, define NOGETUSERSHELL"
    patch_type: "portability"
  - patch_file: "patches/0002-ckucmd.c-ohos-stdio-musl.patch"
    patch_description: "HarmonyOS (musl): opaque FILE, use conchk() in cmdconchk()"
    patch_type: "portability"
  - patch_file: "patches/0003-ckupty.c-ohos-no-vhangup.patch"
    patch_description: "HarmonyOS (musl): no vhangup(), drop CK_VHANGUP on OHOS"
    patch_type: "portability"
