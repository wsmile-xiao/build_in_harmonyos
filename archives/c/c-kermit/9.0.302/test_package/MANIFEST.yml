# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: c-kermit/9.0.302
homepage: "https://www.kermitproject.org/ckermit.html"

# 上游源码审计：cku302.tar.gz 不含任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "源码包文件清单 (cku302.tar.gz，74 个顶层条目)"
    reason: "仅含 makefile、约 60 个 .c/.h 源码、COPYING.TXT 与 .txt/.ini 文档；无 tests/、test/ 目录，无任何 *test* / *check* 文件。"
  - source: "makefile（676 个目标）"
    reason: "全部为平台构建目标（linux/linuxa/xermit/wermit/mermit 及各 Unix 变体），无 check/test 目标、无 TESTS 变量；注释明示不用 autoconf/automake/configure。"
  - source: "构建系统"
    reason: "手写 makefile，不使用 autoconf/CMake/Meson，无测试宏、无 ctest/pytest/gtest 注册。"
  - conclusion: "上游 9.0.302 未提供自动化测试；由 test_package 执行消费者视角的 CLI 验证（版本横幅 9.0.302、命令解析器 quit 路径）。"

# 上游测试命令 (上游无 check/test 目标)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无官方测试套件；验证手段为 test_package 对打包二进制的真实执行。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_kermit.sh
    description: "真实执行打包的 kermit 二进制：--version 输出含 9.0.302 版本横幅、管道输入 quit 使命令解析器正常退出（rc=0）"
    command: "bash test_kermit.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
