software: ccollect
display: "ccollect"
description: "ccollect — (pseudo) incremental backup tool using hardlinks and rsync"
homepage: "https://www.nico.schottelius.org/software/ccollect/"
license: "GPL-3.0-or-later"
category: utility
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 POSIX sh 脚本包，无 C/C++ 编译步骤，install 为脚本拷贝"
    - "Shebang #!/bin/sh 兼容 OHOS（mksh/toybox 均可执行）"
    - "mktemp /tmp/... 改为使用 TMPDIR 环境变量，回退到 /data/local/tmp"
    - "运行时依赖 rsync/ssh/hostname 为系统命令，不作为 Conan 管理依赖"
  common_dependencies:
    - rsync
    - ssh
    - coreutils

versions:
  "1.0.0":
    status: built
    build_date: "2026-08-26"