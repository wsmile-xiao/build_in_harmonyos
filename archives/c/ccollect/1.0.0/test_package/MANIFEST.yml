# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ccollect/1.0.0
homepage: "https://www.nico.schottelius.org/software/ccollect/"

# Upstream test entry: `make test` (requires rsync + writable /tmp + conf/sources)
# rsync is an external runtime dependency not available in the build environment.
# Without rsync, the upstream test suite cannot execute.
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

# ccollect upstream has a test suite in test/ directory (sh scripts):
# - test/test-ccollect1.sh:  full backup test flow (rsync + /tmp/ccollect)
# - test/test-ccollect-tools.sh: tool script syntax checks
# - test/exec.sh, test/local.sh, test/remote.sh, test/return-value.sh
# These scripts require rsync and writable /tmp for the backup simulation.
# Without rsync, the tests cannot execute in the build environment.
upstream_tests:
  - file: test/test-ccollect1.sh
    description: "Full backup test: mktemp, mkdir, rsync (simulated), ccollect -a daily"
    required_deps: [rsync, hostname]
    runnable_here: false
  - file: test/test-ccollect-tools.sh
    description: "Tool scripts syntax check (sh -n)"
    required_deps: []
    runnable_here: true
  - file: test/exec.sh
    description: "Basic execution check"
    required_deps: []
    runnable_here: true
  - file: test/local.sh
    description: "Local backup test"
    required_deps: [rsync]
    runnable_here: false
  - file: test/remote.sh
    description: "Remote backup test (needs network + ssh)"
    required_deps: [rsync, ssh, network]
    runnable_here: false
  - file: test/return-value.sh
    description: "Exit code check"
    required_deps: []
    runnable_here: true

# test_package smoke test (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "ccollect -V version check and -h help check"
    command: "sh test.sh"

assertion_count: 3