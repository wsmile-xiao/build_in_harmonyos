package: ccd2cue/0.5
homepage: "https://www.gnu.org/software/ccd2cue/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# The 0.5 release contains no tests/ directory and no Automake TESTS target.
upstream_tests: []

test_package_tests:
  - file: test_ccd2cue.sh
    description: "Execute the packaged converter and assert version, help, CCD-to-CUE conversion, and error status"
    command: "sh test_ccd2cue.sh"

assertion_count: 8
