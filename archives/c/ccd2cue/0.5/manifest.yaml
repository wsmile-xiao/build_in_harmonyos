software: ccd2cue
version: "0.5"
status: built
build_date: "2026-09-11"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/ccd2cue/ccd2cue-0.5.tar.gz"
  sha256: "8725cfdbcb963259ff094a878aa0e49ea8284e1071ea36ac7ea47358c49b99c5"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-nls"
    - "--disable-doxygen-doc"
    - "--disable-doxygen-dot"
  dependencies:
    required:
      - "argp-standalone/1.5.0"
    optional: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-build-aux-config.guess.patch"
  - "patches/0002-build-aux-config.sub.patch"
  - "patches/0003-src-error.h.patch"
  - "patches/0004-src-i18n.h.patch"

patch_classification:
  - file: 0001-build-aux-config.guess.patch
    type: portability
    platform_only: true
    guard: "applied by apply_conandata_patches in build()"
  - file: 0002-build-aux-config.sub.patch
    type: portability
    platform_only: true
    guard: "applied by apply_conandata_patches in build()"
  - file: 0003-src-error.h.patch
    type: portability
    platform_only: true
    guard: "local GNU error() compatibility for OHOS/musl"
  - file: 0004-src-i18n.h.patch
    type: portability
    platform_only: true
    guard: "ENABLE_NLS conditional preserves upstream gettext path"

test_results:
  type: manual
  total: 0
  registered: 0
  executed: 0
  passed: 0
  failed: 0
  skipped: 0
  pass_rate: "N/A; upstream release has no TESTS targets"
  consumer_tests:
    programs: 1
    passed: 1
    failed: 0
    assertions: 8

knowledge_gained:
  - "旧 Autotools config.guess/config.sub 需识别 aarch64-unknown-linux-ohos（ref: E007,E072）"
  - "HMDFS 下 Autoconf umask 077 会使 config.status 临时文件创建失败（ref: E011）"
  - "OHOS/musl 缺少 GNU error.h；error() 兼容实现需本地补齐（ref: E545）"
  - "OHOS/musl 缺少 argp.h；使用已发布 argp-standalone/1.5.0（ref: E169）"

knowledge_ref:
  - E007
  - E011
  - E072
  - E169
  - E545
