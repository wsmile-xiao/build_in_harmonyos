sources:
  url: "https://ftp.gnu.org/gnu/ccd2cue/ccd2cue-0.5.tar.gz"
  sha256: "8725cfdbcb963259ff094a878aa0e49ea8284e1071ea36ac7ea47358c49b99c5"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: "Make the bundled config.guess recognize HarmonyOS and use writable HMDFS temporary directories"
    patch_type: "portability"
  - patch_file: "patches/0002-build-aux-config.sub.patch"
    patch_description: "Allow the bundled config.sub to validate linux-ohos host triples"
    patch_type: "portability"
  - patch_file: "patches/0003-src-error.h.patch"
    patch_description: "Provide the GNU error() API used by ccd2cue on musl/OHOS"
    patch_type: "portability"
  - patch_file: "patches/0004-src-i18n.h.patch"
    patch_description: "Use literal messages and no-op domains when NLS is disabled"
    patch_type: "portability"
