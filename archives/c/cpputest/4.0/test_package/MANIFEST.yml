# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: cpputest/4.0
homepage: "https://github.com/cpputest/cpputest"

# 上游测试命令（上游自有 dogfood 套件由 CMake TESTS 开关注册：
# tests/CppUTest + tests/CppUTestExt，cmake/Scripts/CppUTestBuildTimeDiscoverTests.cmake
# 构建期发现测试组并按组注册 ctest 条目（-sg 组名，条目内运行全组原子用例）；
# 实测 ctest -N = 78 条）
upstream_check_command: "cmake --build . --target test（TESTS=ON，ctest 驱动）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test()（TESTS=ON）"

# 上游实际运行的测试程序（N_registered=二进制原子注册 1353：CppUTestTests 835 + CppUTestExtTests 518；
# 另按组注册 78 条 ctest 条目（-sg 整组执行）。N_executed=1297 原子用例：1296 通过 + 1 平台 PRNG
# 差异失败（UtestShellPointerArrayTest/firstTestisNotTheFirstTestWithSeed1234，musl rand 序列差异，
# 如实申报不改断言；上游 AllTests.cpp main 丢弃退出值使该失败在 ctest 条目级不可见，详见 notes.md）。
# 静态全量 N_static=1363 见 notes.md）
upstream_tests:
  - file: tests/CppUTest/*.cpp + tests/CppUTestExt/*.cpp
    source: cpputest-4.0/tests/
    description: "上游 dogfood 套件：1363 个可执行原子用例（TEST 1347 + TEST_ORDERED 12 + TEST_ORDERED_C_WRAPPER 3 + TEST_C_WRAPPER 1）；57 个上游显式忽略（IGNORE_TEST 56 + IGNORE_TEST_C_WRAPPER 1）与 2 个 GTest 条件未编译用例（TEST_F）单列不计执行分母；本包补丁将 UtestShell 组 1 个 OHOS 平台阻塞用例转 IGNORE（patches/0001，见 notes.md）"
    command: "cmake.test()（构建期发现按组注册 ctest，-sg 整组执行）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: consumer_test.cpp
    description: "消费者测试 — 以 CppUTest 使用者身份编译真实断言套件（LONGS_EQUAL/CHECK_TRUE/CHECK_FALSE/BYTES_EQUAL/STRCMP_EQUAL/DOUBLES_EQUAL/POINTERS_EQUAL），CommandLineTestRunner 驱动并断言退出码（默认全量运行）"
    command: "./cpputest_consumer_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
