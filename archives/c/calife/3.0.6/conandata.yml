patches:
  "3.0.6":
    - patch_file: "patches/0001-calife-whoami-tty-undeclared.patch"
      patch_description: "whoami() utmp fallback references undefined `tty` (clang: use of undeclared identifier); compare login against utmp.ut_name"
      patch_type: "portability"
    - patch_file: "patches/0002-calife-getpass-musl-weak-fallback.patch"
      patch_description: "OHOS musl libc lacks getpass(3) (glibc/BSD extension) -> ld.lld undefined symbol at link. Add weak fallback getpass() reading /dev/tty with termios no-echo; linker prefers platform strong symbol when present"
      patch_type: "portability"
