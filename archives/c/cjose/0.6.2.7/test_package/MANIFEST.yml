package: cjose/0.6.2.7
homepage: "https://github.com/OpenIDC/cjose"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试框架为 check 0.15.2（ohpcd 未发布；任务私有前缀自建，仅测试用）
# 统计单位：check 框架 test case；取数：grep -cE ':(P|F):' test/check_cjose.log
upstream_tests:
  - name: check_cjose (base64/concatkdf/header/jwe/jwk/jws/util/version 全套件)
    command: "make check"
    expected: "pass 85/85 (100%: Checks: 85, Failures: 0, Errors: 0)"

test_package_tests:
  - file: src/test_package.c
    description: "cjose_version() 一致性 (0.6.2.7)"
    command: "./test_package"
  - file: src/test_package.c
    description: "base64url encode/decode 往返 (RFC 4648 section 5 向量)"
    command: "./test_package"
  - file: src/test_package.c
    description: "JOSE header new/set/get/release"
    command: "./test_package"
  - file: src/test_package.c
    description: "HS256 JWS import/sign/export/import/verify/明文一致 (上游 oct JWK 向量)"
    command: "./test_package"

assertion_count: 19
expected_stdout: "CJOSE TEST PACKAGE OK (version 0.6.2.7)"
