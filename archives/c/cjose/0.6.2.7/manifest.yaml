package: cjose
version: "0.6.2.7"
homepage: "https://github.com/OpenIDC/cjose"
license: MIT
status: built
build_system: autotools
build_date: "2026-09-07"

source:
  url: "https://github.com/OpenIDC/cjose/releases/download/v0.6.2.7/cjose-0.6.2.7.tar.gz"
  sha256: "80fae3ef56be6419255092374ffe059018a9a453e861de8e3a8b38d06ce8621d"

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--with-openssl=<conan openssl package dir>"
    - "--with-jansson=<conan jansson package dir>"
  dependencies:
    - jansson/2.15.1.1
    - openssl/3.5.8.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-umask-022.patch - config.status 临时目录 umask 077 在 HMDFS 上 UID 映射后不可写; 放宽为 022 (knowledge E011 口径; 先例 a52dec 0002)"
  - "0002-jwk-init-rsa-buflen-uninit.patch - _cjose_jwk_import_RSA 的 d/p/q/dp/dq/qi buflen 声明点在首个 error goto 之后; clang 15 -Werror -Wsometimes-uninitialized 阻断构建; 提升声明至函数顶部初始化"

upstream_tests:
  command: "make check"
  test_count: 85
  passed: 85
  failed: 0
  skipped: 0
  notes: "统计单位为 check 框架 test case (ck 套件行); 取数命令 grep -cE ':(P|F):' test/check_cjose.log 于构建目录; 上游汇总行 100%: Checks: 85, Failures: 0, Errors: 0; ohpcd 已发布的 check/0.15.2 binary 无 TMPDIR 适配 (check_msg.c:317 实测) 不可用于设备测试, 按提审对齐口径从源码自建至任务私有 prefix (仅测试用; 不进包依赖链); 运行环境: 沙箱 HOME + 任务可写 TMPDIR + conan 依赖 conanrun 环境"

test_package:
  case_count: 4
  assertion_count: 19
  description: "真实消费者: cjose_version 一致性; base64url 编解码往返; JOSE header set/get/release; HS256 JWS import->sign->export->import->verify->明文一致 (上游 oct JWK 向量); 全部走公开 API 且执行真实加解密"

knowledge_gained:
  - "libcheck 0.15.x open_tmp_file 的探测顺序 TEMP→P_tmpdir(/tmp)→TMPDIR→'.' 使 TMPDIR 指向可写目录无效; 设备 /tmp 只读时所有 check 用例 exit 2; 须在自建 libcheck 中提升 TMPDIR 探测并重建"  # knowledge_ref: E547
