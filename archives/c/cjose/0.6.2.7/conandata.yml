patches:
  - patch_file: "patches/0001-configure-umask-022.patch"
    patch_description: "Use umask 022 in config.status temp dir creation (HMDFS UID mapping makes umask 077 dirs unwritable on OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0002-jwk-init-rsa-buflen-uninit.patch"
    patch_description: "Hoist RSA import buflen declarations before first error goto (clang 15 -Werror sometimes-uninitialized blocks the build)"
    patch_type: "portability"
