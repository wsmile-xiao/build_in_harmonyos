# conandata.yml — cdsclient 1.0.0
# 上游：CDS (Centre de Données astronomiques de Strasbourg)
#   cdsclient 4.07 (发布包不含版本号目录前缀变更，上游 tar 包为 cdsclient-4.07.tar.gz)
# 构建：autotools (configure + make，预生成 configure 随包发布，无需 autoreconf)
# 无外部依赖（仅 libc + socket API）；产物为 aclient 可执行文件 + findxxx/vizquery 等
# shell 脚本与 man 手册。
#
# 下载可靠性（2026-08-24 实测）: cdsarc.cds.unistra.fr 直连在部分网络环境出现
# SSL 证书校验失败 / Anubis 反爬页面，使用 -k 或镜像可正常拉取（源码归档 sha256
# 与官方一致）。官方原始 URL 保留作为最终兜底。

sources:
  url: "https://cdsarc.cds.unistra.fr/ftp/pub/sw/cdsclient-4.07.tar.gz"
  sha256: "4a0a02cb1dc48bc9a0873ebb3ef9b031f9288baf13a3573f885a8504f9c317c5"

patches:
  - patch_file: "patches/0001-configure-hmfs-pwd-umask.patch"
    patch_description: "Configure 适配 HarmonyOS HMFS/HMDFS：pwd 失败时回退 $PWD（HMFS 不支持 getcwd），config.status 临时目录 umask 077→022（E114）"
    patch_type: "platform"
  - patch_file: "patches/0002-aclient-termios-getpass.patch"
    patch_description: "aclient.c 适配 HarmonyOS：libc.so 不导出 getpass()，getpasswd() 改用 POSIX termios 实现（tcgetattr/tcsetattr + termios.h）"
    patch_type: "portability"