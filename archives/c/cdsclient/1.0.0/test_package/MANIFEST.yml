# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: cdsclient/1.0.0
homepage: "https://cdsarc.cds.unistra.fr/viz-bin/cdsclient"

# 上游源码审计：cdsclient 4.07 确认无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.in"
    reason: "仅 all/install/clean/tar/export/tag 目标；无 check/test 目标、无 TESTS 变量、无 check-local 或 test-local 规则。"
  - source: "configure (Autoconf 2.69)"
    reason: "仅做编译器/头文件/函数探测（getcwd/mkdir/putenv/strdup/strerror/strstr），无测试宏。"
  - source: "aclient.c"
    reason: "主程序源码，含 -version/-h 选项（纯本地输出，无需网络），无测试 main。"
  - source: "catClient.py"
    reason: "含 --test 选项但需要连接活 CDS 服务器（runtime 选项，非自动化测试套件）。"
  - source: "源码树"
    reason: "发布包无 tests/、test/ 目录，无 *_test 文件，无 gtest/pytest 等测试框架代码。"
  - conclusion: "上游未提供自动化测试套件；由 test_package 真实执行 aclient 二进制验证（-version/-h/ELF/脚本存在性/离线参数守卫）。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_cdsclient.sh
    description: "真实执行 aclient -version 校验版本输出 + aclient -h 校验退出码 0（纯本地，无需网络/CDS 服务器）+ file(1) 报告 ELF + 关键 shell 脚本存在性 + find_gen 离线参数守卫（6 项断言）"
    command: "sh test_cdsclient.sh"

assertion_count: 6