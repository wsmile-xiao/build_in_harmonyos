software: cdsclient
version: "1.0.0"
status: built
build_date: "2026-08-25"
conan_ref: "cdsclient/1.0.0"

source:
  url: "https://cdsarc.cds.unistra.fr/ftp/pub/sw/cdsclient-4.07.tar.gz"
  sha256: "4a0a02cb1dc48bc9a0873ebb3ef9b031f9288baf13a3573f885a8504f9c317c5"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix (AutotoolsToolchain)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-hmfs-pwd-umask.patch"
  - "0002-aclient-termios-getpass.patch"

knowledge_gained:
  - "HMFS/HMDFS 不支持 getcwd：configure 的 ac_pwd=`pwd` 须追加 2>/dev/null || ac_pwd=\"$PWD\" 兜底（同 aribb24/1.0.4、xsel/1.2.1）"
  - "E114: configure 用 umask 077 建临时目录，HMDFS 下不可写 → 改为 022"
  - "HarmonyOS libc.so 不导出 getpass()，getpasswd() 须改用 POSIX termios (tcgetattr/tcsetattr/termios.h) 实现"
  - "cdsarc.cds.unistra.fr 下载 SSL 证书校验失败时可用 -k 或 pre-verified 副本（sha256 相同）"
  - "aclient 纯 clang 构建的 ELF PIE 可在 HMOS 直接执行（无需签名），但 gcc 产物的 Operation not permitted 由 AutotoolsToolchain 注入 CC=clang 解决"