# 编译中学到的知识
knowledge_gained:
  - "HMDFS umask 077 问题：HMDFS 创建文件 owner 为 file_manager 服务账户，autoconf config.status 使用 umask 077 剥离 group 权限，需 sed 替换为 umask 007"
  - "/bin/sh 为 musl sh，部分 autoconf 功能不兼容，建议使用 /data/service/hnp/bin/bash"
  - "GitHub archive 包不含 configure，需 autoreconf -i 生成"
  - "pkg.m4 需手动安装到 aclocal 目录"
  - "/tmp 只读 (E002)，使用 $HOME/tmp 替代"

