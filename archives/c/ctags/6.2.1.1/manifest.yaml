# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HarmonyOS 的 uname -s 返回 HarmonyOS 而非 Linux，上游 config.guess 无法猜测 build triple，configure 报 'cannot guess build type; you must specify one'。修复：在 config.guess 的 case 中新增 *:HarmonyOS:*:* 分支映射为 <machine>-unknown-linux-ohos（knowledge_ref: DRAFT-ctags-6.2.1.1-ohos-config-guess-harmonyos-uname）"
  - "上游 config.sub（2024-05-27）已接受 ohos* OS 与 linux-ohos* 内核组合，config.sub 无需改动（knowledge_ref: DRAFT-ctags-6.2.1.1-ohos-config-guess-harmonyos-uname）"
  - "HMDFS 上 toybox mktemp -d 创建 0700 目录且 owner 为 file_manager 服务账户，调用进程无法写入；HMDFS 忽略 chmod（E046）且 test -w 虚报可写。autoconf 的 AS_TMPDIR 因此失败（config.status: built not setup config files machinery）。修复：用 mkdir 取代 mktemp -d（knowledge_ref: DRAFT-ctags-6.2.1.1-hmdfs-mktemp-AS_TMPDIR-unwritable）"
  - "上游 release tarball 已预生成 configure，无需 autoreconf/automake（knowledge_ref: DRAFT-ctags-6.2.1.1-ohos-config-guess-harmonyos-uname）"
  - "/bin/bash 不存在于 OHOS，shell 脚本 shebang 应使用 /data/service/hnp/bin/bash（reference: E002 平台限制类）"
  - "make check 的 tmain 段在 OHOS 上多项失败：21 个上游 run.sh 硬编码 /tmp（只读），需改为 ${TMPDIR:-/tmp}（knowledge_ref: DRAFT-ctags-6.2.1.1-ohos-tmain-suite-adaptation）"
  - "toybox sh 会吞掉 grep BRE 交替中的反斜杠（grep 'a\\|b' 匹配为空），需改用 POSIX ERE（grep -E 'a|b'）；toybox sh 中局部函数名 r 与 fc history 内建冲突（报 fc: history functions not available）（knowledge_ref: DRAFT-ctags-6.2.1.1-ohos-tmain-suite-adaptation）"
  - "toybox sh 把 printf 当外部命令，32770 次循环需 ~14 分钟；批量数据生成应改用单次 awk（knowledge_ref: DRAFT-ctags-6.2.1.1-ohos-tmain-suite-adaptation）"

patch_generation:
