  source_orig_dir: "<BUILD_TMP>/builds/ctags-6.2.1.orig"
  source_work_dir: "<BUILD_TMP>/builds/ctags-6.2.1.work"
  source_orig_hash: a051b67d1f4c122d
  source_work_hash: 7914f293a957493d
  generated_at: '2026-09-26T11:22:37'
  patches_count: 2

patch_classification:
