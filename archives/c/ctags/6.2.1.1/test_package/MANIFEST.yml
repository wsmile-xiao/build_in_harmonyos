# test_package/MANIFEST.yml — ctags 6.2.1.1（上游 6.2.1）
# 上游官方测试来源声明
# CI L1 门禁通过此文件确定上游测试类型和执行方式
# 参考: ARCHIVE-SPEC.md §2 test_package/ 规范 + ci/conan/build_and_test.sh L1 检测逻辑

package: ctags
version: "6.2.1.1"

# 上游构建系统（CI 据此选择测试执行方式）
upstream:
  build_system: autotools
  # 测试类型: make_check | ctest | meson_test | pytest | none
  test_type: make_check
  # 上游官方测试命令
  test_command: "make check"
  # 测试工作目录（相对于源码根目录）
  test_directory: "."

# OHOS 平台兼容性
ohos_compatibility:
  # full | partial | none | unknown
  status: full
  detail: >-
    make check 退出码 0。主测试套件（tmain + units）共 1574 个用例：
    passed 1526、FIXED 2（预期失败转正）、failed 0、timed-out 0、skipped 46；
    tlib（mini-geany）1/1；man-test（文档示例）22/22；tutil（libvstring）11/11。失败数为 0。
  known_skips:
    - "skipped (features) 41 项：可选依赖/特性在本次构建中未启用（xpath、json、pcre2、sandbox、interactive、win32 等）"
    - "skipped (languages) 5 项：rmarkdown/rdoc/markdown 的 frontmatter 等依赖可选特性"

# Conan test_package 测试（L1 冒烟测试，CI 通过 conan create 自动执行）
conan_test:
  type: executable
  description: >-
    ctags L1 测试：--version 与 --list-languages 冒烟；
    [OpenHarmony] 二进制静态链接校验（无 PT_INTERP）；
    [OpenHarmony] 端到端标签生成（ctags -o 生成 tags 并校验符号）
  test_method: "test_ctags <path-to-ctags-binary>"
