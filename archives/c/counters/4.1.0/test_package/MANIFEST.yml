package: counters/4.1.0
homepage: "https://github.com/lemire/counters"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

upstream_tests:
  - file: test/test_bench.cpp
    source: counters-4.1.0/test/test_bench.cpp
    description: "Official benchmark smoke test exercising performance-counter availability, timing aggregation, CPU-bound work, and memcpy measurement."
    command: "test_bench"
    test_functions: 1
    assertion_failure_macros: 0

test_package_tests:
  - file: test.cpp
    description: "Consumer test constructs event_count/event_aggregate, verifies aggregation/getters, and probes platform counter availability."
    command: "./test_counters"

assertion_count: 4
