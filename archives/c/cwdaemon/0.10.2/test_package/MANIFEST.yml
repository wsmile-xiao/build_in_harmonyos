# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 强制要求）
package: cwdaemon/0.10.2
homepage: "https://sourceforge.net/projects/cwdaemon/"

# 上游测试命令（perl 脚本，需运行中的 cwdaemon + UDP socket）
upstream_check_command: "perl test/cwtest.pl"
upstream_test_in_build: false  # 交叉编译环境无法运行 aarch64 二进制
upstream_test_command: "perl test/cwtest.pl --device null"

# 上游实际测试脚本（12 个 — 2026-09-18 真机全部真实执行，详见 notes.md 实测记录）
# 真实执行: 12/12（daemon -n -d null -x n -p 6789 稳定回显）
# 通过(rc=0): 5/12（cwtest.pl、esc3、esc5、esc8、esc64）
# 挂起(rc=124): 7/12（esc2、esc7、escd、escf、escg、short_space）— null 驱动下参数扫描回包时序不匹配
upstream_tests:
  - file: cwtest.pl
    source: cwdaemon-0.10.2/test/
    description: "main CW test script (perl, requires running cwdaemon + UDP); 真机实测 PASS (--cycles=1 --nstrings=3)"
    command: "perl test/cwtest.pl --device null"
  - file: cwtest_esc2.pl
    source: cwdaemon-0.10.2/test/
    description: "escape speed test; 真机实测挂起(speed 扫描 24 down 后阻塞)"
    command: "perl test/cwtest_esc2.pl"
  - file: cwtest_esc3.pl
    source: cwdaemon-0.10.2/test/
    description: "escape tone test; 真机实测 PASS (tone 400-4000 双向扫描 + 无效值全过)"
    command: "perl test/cwtest_esc3.pl"
  - file: cwtest_esc5.pl
    source: cwdaemon-0.10.2/test/
    description: "escape exit(<ESC>5) test; 真机实测 PASS"
    command: "perl test/cwtest_esc5.pl"
  - file: cwtest_esc5.sh
    source: cwdaemon-0.10.2/test/
    description: "esc5 shell wrapper (与 esc5.pl 等价)"
    command: "sh test/cwtest_esc5.sh"
  - file: cwtest_esc64.pl
    source: cwdaemon-0.10.2/test/
    description: "escape word-mode/abort test; 真机实测 PASS"
    command: "perl test/cwtest_esc64.pl"
  - file: cwtest_esc7.pl
    source: cwdaemon-0.10.2/test/
    description: "escape test; 真机实测挂起(无输出即阻塞)"
    command: "perl test/cwtest_esc7.pl"
  - file: cwtest_esc8.pl
    source: cwdaemon-0.10.2/test/
    description: "escape sequence test (null device mode); 真机实测 PASS"
    command: "perl test/cwtest_esc8.pl"
  - file: cwtest_escd.pl
    source: cwdaemon-0.10.2/test/
    description: "escape PTT-delay test; 真机实测挂起(26->22 down 后阻塞)"
    command: "perl test/cwtest_escd.pl"
  - file: cwtest_escf.pl
    source: cwdaemon-0.10.2/test/
    description: "escape frequency test; 真机实测挂起(无输出即阻塞)"
    command: "perl test/cwtest_escf.pl"
  - file: cwtest_escg.pl
    source: cwdaemon-0.10.2/test/
    description: "escape volume test; 真机实测挂起(volume 32 up 后阻塞)"
    command: "perl test/cwtest_escg.pl"
  - file: cwtest_short_space.pl
    source: cwdaemon-0.10.2/test/
    description: "escape short-space test; 真机实测挂起(无输出即阻塞)"
    command: "perl test/cwtest_short_space.pl"

# 上游测试真实执行统计（2026-09-18 真机实测，详见 notes.md）
upstream_test_executed: 12
upstream_test_passed: 5
upstream_test_hung: 7
upstream_pass_rate: "41.7% (5/12)"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: conanfile.py
    description: "verify cwdaemon binary and license exist in package (access X_OK/R_OK 真实检查，非空壳)"
    command: "conan test test_package cwdaemon/0.10.2 -pr:h ohos-aarch64"
  - file: test_cwdaemon.c
    description: "消费者测试源：access(argv[1],X_OK) 校验二进制可执行 + access(argv[2],R_OK) 校验许可证可读"

# 测试断言总数
assertion_count: 2
