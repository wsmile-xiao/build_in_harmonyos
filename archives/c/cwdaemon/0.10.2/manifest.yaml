software: cwdaemon
version: "0.10.2"
status: built
build_date: "2026-09-14"
conan_ref: "cwdaemon/0.10.2"
build_system: autotools
language: C
homepage: "https://sourceforge.net/projects/cwdaemon/"
license: GPL-2.0-or-later

source:
  url: "https://deb.debian.org/debian/pool/main/c/cwdaemon/cwdaemon_0.10.2.orig.tar.gz"
  sha256: "316a18d2ccf5492246b31721f06d52a1989ed563cdafc92432be5280db7c5886"
  tar_format: tar.gz

build:
  system: autotools
  package_type: application
  dependencies:
    - "unixcw/3.6.1"
  system_libraries:
    - m
  build_tools:
    - python3
    - conan
    - clang
    - make
    - sh
  configure_options:
    - "--disable-silent-rules"

patches:
  - file: "patches/0001-config-guess-ohos.patch"
    description: "config.guess: add linux-ohos triplet recognition"
    type: portability
  - file: "conanfile.py:_patch_config_sub_ohos()"
    description: "config.sub: add linux-ohos triplet recognition (via replace_in_file, backslash-continuation defeats unified diff)"
    type: portability

ohos_adaptation:
  key_points:
    - "config.guess/sub OHOS triplet recognition"
    - "lp.c parallel-port code conditionally compiled (HAVE_LINUX_PPDEV_H), auto-degrades on OHOS"
    - "null device mode for hardware-free operation"
    - "umask 022 fix for OHOS autoconf tmp dirs"
  common_dependencies:
    - unixcw

test:
  method: "真机实测 12 个上游 perl 测试 (OHOS aarch64, daemon -n -d null -x n -p 6789) + test_package 消费者用例"
  upstream_tests_executed: 12
  upstream_tests_passed: 5
  upstream_tests_hung: 7
  upstream_pass_rate: "41.7% (5/12)"
  upstream_tests_detail: "PASS: cwtest.pl/esc3/esc5/esc8/esc64; HANG(null 驱动回包时序): esc2/esc7/escd/escf/escg/short_space — 详见 notes.md"
  test_package: "verify cwdaemon binary (access X_OK) + license (access R_OK) 真实检查，非空壳"

artifacts:
  binary: "sbin/cwdaemon"
  license: "licenses/COPYING"
