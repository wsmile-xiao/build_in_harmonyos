# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: cpp-smtpclient-library/1.1.14
homepage: "https://github.com/jeremydumais/CPP-SMTPClient-library"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (v1.1.14 源码 test/smtpclient_unittest/，gtest)
upstream_tests:
  - file: test/smtpclient_unittest/attachment_unittest.cpp
    source: CPP-SMTPClient-library-1.1.14/test/smtpclient_unittest/attachment_unittest.cpp
    description: "Attachment API unittest (gtest)"
    command: "./smtpclient_unittests --gtest_filter=Attachment*"
  - file: test/smtpclient_unittest/errorresolver_unittest.cpp
    source: CPP-SMTPClient-library-1.1.14/test/smtpclient_unittest/errorresolver_unittest.cpp
    description: "ErrorResolver unittest (gtest)"
    command: "./smtpclient_unittests --gtest_filter=ErrorResolver*"
  - file: test/smtpclient_unittest/stringutils_unittest.cpp
    source: CPP-SMTPClient-library-1.1.14/test/smtpclient_unittest/stringutils_unittest.cpp
    description: "StringUtils unittest (gtest)"
    command: "./smtpclient_unittests --gtest_filter=*StringUtils*"
  - file: test/smtpclient_unittest/smtpclientbase_unittest.cpp
    source: CPP-SMTPClient-library-1.1.14/test/smtpclient_unittest/smtpclientbase_unittest.cpp
    description: "SMTPClientBase unittest (gtest, 类型参数化)"
    command: "./smtpclient_unittests --gtest_filter=*SmtpClientBase*"
  - file: test/smtpclient_unittest/main.cpp
    source: CPP-SMTPClient-library-1.1.14/test/smtpclient_unittest/main.cpp
    description: "gtest main 入口，共 15 个 unittest 文件、56 套件 642 用例全量通过"
    command: "./smtpclient_unittests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：通过公开头文件构造邮件并验证 subject/MIME"
    command: "./test_cpp-smtpclient-library"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 642
