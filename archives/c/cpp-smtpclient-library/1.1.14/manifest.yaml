# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.14"

# 软件名
software: cpp-smtpclient-library

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jeremydumais/CPP-SMTPClient-library/archive/refs/tags/v1.1.14.tar.gz"

  # 源码校验和
  sha256: "de525707607b45c74467aec81f729b7f00798fae904c9d03cd68be7b72034883"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DBUILD_TESTING=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - openssl/3.5.8.1
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "CMake find_program(clang-tidy) 多行参数生成坏 build.make（missing separator），Conan 配方须用 cache_variables 禁用 clang-tidy（E6401）"
- "OHOS 环境 make jobserver FIFO 受限，cmake.build 用 -j1（E525）"
- "test_package find_package 名称须匹配库实际 CMake 导出名（smtpclient）"
- "上游 gtest 测试 642/642 通过（56 套件），含 TYPED_TEST 类型参数化展开"

# 归档文件不允许携带本机绝对路径或指向本地构建目录的引用
patch_generation:
  method: none
  patches_count: 0
