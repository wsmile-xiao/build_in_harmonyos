# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: cute_files/1.0.0
homepage: https://github.com/RandyGaul/cute_headers

# 上游测试: cute_files 是单头文件目录遍历/文件工具库，上游仓库无独立测试套件
# （cute_headers 无 test/ 目录、无 CI 测试脚本；头文件为 header-only，
#   通过 CUTE_FILES_IMPLEMENTATION 宏在一个编译单元中展开；头文件内提供
#   cf_do_unit_tests() 辅助自检，无独立可运行测试入口）
upstream_check_command: ""   # 上游无测试入口
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试（消费者视角验证鸿蒙平台可编译可运行）
test_package_tests:
  - file: test_cute_files.c
    description: "直接调用 cute_files 公开 API（cf_dir_open/cf_read_file/cf_dir_next/cf_dir_close 遍历目录、cf_file_exists 存在性、cf_match_ext/cf_get_ext 扩展名匹配）并断言遍历结果"
    command: "clang -std=c99 -DCUTE_FILES_IMPLEMENTATION test_cute_files.c && ./test_cute_files"

# 测试断言总数 (test_package 8 项)
assertion_count: 8