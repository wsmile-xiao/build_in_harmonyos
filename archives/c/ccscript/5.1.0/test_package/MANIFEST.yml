# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ccscript/5.1.0
homepage: "https://www.gnu.org/software/ccscript/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true

upstream_tests:
  - name: "test/testScript（automake TESTS 注册项，make check 执行）"
    count: "1"
    description: "上游真实行为测试：test/script.cpp 驱动解释器编译并执行 testscript.scr/mergescript.scr（含 check/check.exit/check.main/check.event/check.loop/check.refs/check.manip 断言计数与 @exit 处理器验证），退出码判定"

test_package_tests:
  - file: smoke.cpp
    description: "R34：以库使用者身份真实调用公开 API——Script::init + Script::compile 编译内联脚本并校验 getErrors()==0（编译+链接+运行+退出码）"
    command: "python3 test_ccscript.py <ccscript_pkg> <ucommon_pkg> [<extra_lib_dirs>...]"
