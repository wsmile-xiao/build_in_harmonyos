# 版本级 manifest — ccscript 5.1.0
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "5.1.0"

# 软件名
software: ccscript

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/ccscript/ccscript-5.1.0.tar.gz"

  # 源码校验和
  sha256: "bc1157a77fa05a89de3c9c69872ed74a703fd59ef18c7bb1c0ed78d4d2011c6e"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-pkg-config"
    - "--build=aarch64-unknown-linux-ohos"
    - "--prefix=/usr"
    - "--disable-shared"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ucommon/7.0.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（配方内联处理——无独立补丁文件）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - category: L1
    content: "conan 包内 .la 不可重定位的两种形态：①dependency_libs 记录构建期绝对路径（含失效路径）→ libtool 报 is not a valid libtool archive；②libdir 本身错误（实测 libgpg-error.la 的 libdir='//lib'，安装时 prefix 为 '/'）→ libtool 按 libdir 解析依赖报 sed: //lib/libxxx.la: No such file。处置：generate() 阶段把所有依赖 *.la/*.a/*.so* 复制到构建目录、清空 dependency_libs、libdir 指向副本，并置于 LDFLAGS 最前"
    reason: "ccscript 链接实测（libgpg-error.la libdir='//lib'）"
  - category: L1
    content: "gpg-error 家族的 .pc 用 prefix=/ 且 libdir=${prefix}/lib 展开为 //lib——按 prefix 行做全局路径替换会把所有 '/' 破坏（产出 //lib 类路径）。稳妥做法：不修改依赖 .pc，直接在构建目录自建所需 .pc（路径全部指向真实 package_folder）并经 PKG_CONFIG_PATH 使用"
    reason: "ccscript + --with-pkg-config 实测"
  - category: L1
    content: "依赖混合静态/动态时，复制 .la 必须连同 .so* 一起（.la 的 library_names 指向 .so）——只复制 *.la/*.a 会在链接期报 no such file or directory: deps-lib/libxxx.so"
    reason: "ccscript 链接实测（libtasn1/libgcrypt/libgpg-error 为 .so）"
  - category: L1
    content: "configure --prefix=/usr + make install DESTDIR=<package_folder> 的包布局为 usr/{include,lib}——package_info 必须显式设置 includedirs=['usr/include']/libdirs=['usr/lib']，test_package 脚本的路径拼接同样要用 usr/ 前缀（否则报 missing directory: <pkg>/include）"
    reason: "ccscript 首轮 test_package 实测"
