# test_package/MANIFEST.yml — cycfx2prog 0.47
# CI (build_and_test.sh L0e) requires this file: it declares where the upstream
# tests are and which consumer tests the package itself adds.

package: cycfx2prog/0.47
homepage: "https://www.triplespark.net/elec/periph/USB-FX2/software/"

# ── 上游测试入口台账 ─────────────────────────────────────────────────────────
# cycfx2prog 0.47（2009 年发布）上游不带任何测试套件：
#   1. `python3 -m tarfile -l cycfx2prog-0.47.tar.gz | grep -Eic '(test|check|spec)'`
#      = 0，tarball 只有 5 个成员（顶层目录 + Makefile + cycfx2dev.h +
#      cycfx2prog.cc + cycfx2dev.cc）；
#   2. 顶层 Makefile 的目标只有 all / clean / distclean / dist（外加 .cc.o 后缀规则），
#      没有 check/test 目标
#      （`python3 -c "import tarfile;print(tarfile.open('cycfx2prog-0.47.tar.gz').extractfile('cycfx2prog-0.47/Makefile').read().decode())" | grep -nE '^[a-zA-Z_.-]+:'`）。
# 因此上游用例数 = 0（“未发现可运行的上游测试入口”），既不是 PASS 也不是
# SKIP；下表的 upstream_* 字段按此如实填写。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── 适配后新增的消费者测试（conan create 自动执行）──────────────────────────
# 统计单位：test_package/test.sh 中的功能用例，每例打印一行 OK/FAIL，
# 末行打印 "cycfx2prog test_package summary: TOTAL=<n> PASS=<n> FAIL=<n>"。
test_package_tests:
  - file: conanfile.py
    description: "Consumer test entry: takes bin/ from the tested package and runs test.sh with bash in the conanrun environment (cwd = test_package source dir)"
    command: "conan create archives/c/cycfx2prog/0.47 --profile:host=ci/conan/profiles/ohos-aarch64 --profile:build=ci/conan/profiles/ohos-aarch64"
  - file: test.sh
    description: "33 个功能用例：包布局与产物形态（PATH 可见/AArch64 ELF/musl 动态加载器）、--version 精确版本行与跨次运行一致性、--help 的 usage 行与全部 12 个文档化命令、--list 的真实 libusb 初始化路径（usb_init/usb_find_busses/usb_find_devices 都必须成功）、DT_NEEDED 含 libusb-1.0.so.0、三条无设备错误路径的退出码与报错文案（无参数 / -id= 指定不存在设备 / 未知选项）"
    command: "bash test.sh"

# 硬件与软件的可验证边界（读源码确认，不是推测）：
#   * 软件路径（本测试覆盖）：参数解析、--help/--version/--list、libusb 初始化序列、
#     所有“找不到设备”的错误分支。在零 USB 设备的机器上可完整执行。
#   * 硬件路径（本测试不覆盖，见 not_covered）：-d=/-id= 命中设备后的
#     CypressFX2Device::open() → usb_set_configuration/usb_claim_interface →
#     8051 固件下载（prg:）、reset/run、bulk/control 端点收发。
not_covered:
  - "prg:FILE：需要真实 FX2 芯片，把 Intel HEX 固件写入设备 RAM"
  - "reset / run：需要真实芯片的 8051 复位与启动"
  - "dbulk: / sbulk: / fbulk: / bench_bulk: / ctrl: / altif:：需要真实芯片的端点收发"
  - "dram:ADR,LEN / set:ADR,VAL：需要已打开的真实设备句柄"
  - "reason: 上述路径全部依赖外接 Cypress EZ-USB FX2/FX2LP 硬件（USB 总线上的 04b4:8613 等 VID/PID），CI 沙箱与设备本体都无此硬件；属上游硬件依赖而非 OHOS 平台缺陷"

# 用例统计
test_case_count: 33

# 兼容旧字段：断言总数与用例数一致（每个用例一次判定）
assertion_count: 33
