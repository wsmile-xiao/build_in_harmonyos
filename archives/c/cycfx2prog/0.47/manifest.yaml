# 版本级 manifest — cycfx2prog 0.47
# 文件位置: archives/c/cycfx2prog/0.47/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "0.47"
software: "cycfx2prog"

# conan-verify/W3 通过、release upload 未确认前只能记 built（workflow 第 13 节）
status: built

build_date: "2026-09-11"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.triplespark.net/elec/periph/USB-FX2/software/cycfx2prog-0.47.tar.gz"
  sha256: "0e2669c11e81b271d26f96f252e936d81b4847dd5f47e50d17003c5330f74a36"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  # 上游手写 Makefile 无 configure；目标只有 all/clean/distclean/dist
  configure_options: []
  build_command: "make -j1 CC=<profile tools.build:compiler_executables:c> CFLAGS=<GnuToolchain cflags + 逐项 -D defines + -I 依赖头目录 + 上游自带 -fno-rtti/-fno-exceptions/-W/-Wall/-Wformat + -DCYCFX2PROG_VERSION=\\\"0.47\\\"> LDFLAGS=<GnuToolchain ldflags + -L 依赖库目录 + -lusb -lusb-1.0>"
  # 上游 CFLAGS/LDFLAGS 用 `=` 赋值，同名环境变量会被覆盖，因此 flags 以 make 命令行变量传入
  build_flags:
    - "CC=/data/service/hnp/bin/clang"
    - "CFLAGS=-O3 -DNDEBUG -fno-rtti -fno-exceptions -W -Wall -Wformat -I<libusb-compat>/include -I<libusb-1.0>/include -DCYCFX2PROG_VERSION=\\\"0.47\\\""
    - "LDFLAGS=-L<libusb-compat>/lib -L<libusb-1.0>/lib -lusb -lusb-1.0"
  dependencies:
    - libusb-compat/0.1.7
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无补丁：0.47 用 OHOS clang 15.0.4 原样编译通过，patches/ 目录不存在
patches_applied: []

