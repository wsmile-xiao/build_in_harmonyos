# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 上使用 libusb-0.1 API（<usb.h>/-lusb）的软件不缺依赖：ohpcd 已发布 libusb-compat/0.1.7（静态 fPIC，含 usb.h 与 27 个 usb_* 符号）+ libusb/1.0.27（libusb-1.0.so.0，linux_usbfs 后端），requires 一次即可真编译真链接，不需要 stub 头或空实现"  # knowledge_ref: E574
  - "raw Makefile 配方用 make 命令行变量覆盖上游 CFLAGS 时，字符串宏要两级反斜杠转义（-DNAME=\\\"0.47\\\"）：值经 make 展开与 recipe shell 解析各一次，单级转义在第二层被剥掉引号，宏静默退化成 double，唯一信号是 -Wformat 告警、运行期输出垃圾"  # knowledge_ref: E575
