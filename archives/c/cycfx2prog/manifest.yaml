# 软件级 manifest — cycfx2prog
# 文件位置: archives/c/cycfx2prog/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: cycfx2prog

display: "CycFX2Prog"

description: "Cypress EZ-USB FX2/FX2LP 编程与端点测试工具 — 通过 USB 把 8051 固件（Intel HEX）下载到 FX2 的 RAM，并可复位/启动 8051、做 bulk 与 control 端点收发"

category: utility

homepage: "https://www.triplespark.net/elec/periph/USB-FX2/software/"

license: GPL-2.0-only

build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游用 libusb-0.1 API（<usb.h>、-lusb），OHOS 上没有 libusb-0.1 本体；ohpcd 已发布 libusb-compat/0.1.7（默认静态、fPIC=True，提供 include/usb.h 与 lib/libusb.a）与 libusb/1.0.27（shared，提供 libusb-1.0.so.0）两个包，配方 requires libusb-compat/0.1.7 即可真编译真链接，无需任何 stub 或平台条件编译（R8）"
    - "手写 Makefile（无 configure，目标仅 all/clean/distclean/dist）：CFLAGS/LDFLAGS 用 `=` 赋值，同名环境变量被 makefile 赋值覆盖，因此 Conan toolchain 的 flags 必须以 make 命令行变量传入（命令行变量优先级最高）"
    - "命令行变量的值会经过 makefile 展开后由 recipe shell 再解析一次：字符串宏必须写两级反斜杠转义（-DCYCFX2PROG_VERSION=\\\"0.47\\\"），只写一级会在第二层被剥掉引号，宏静默退化成浮点常量，仅 -Wformat 告警可见"
    - "上游无 install 目标、无测试套件，配方自行安装 bin/cycfx2prog 并按消费者视角补 test_package"
    - "hnp clang 15 不传额外链接参数即产出 PIE + BIND_NOW + RELRO + NX 的产物，无需自定义加固 flag"
    - "无 USB 设备的环境里 --list 仍返回 0：usb_init/usb_find_busses/usb_find_devices 全部成功（libusb linux_usbfs 后端在 OHOS 可用），这是 CI 中可复核的真实 libusb 运行路径"
    - "需要真实 FX2 芯片的路径（-d=/-id= 命中设备后的 prg:/run/dbulk:/sbulk:/bench_bulk: 等）无法在无硬件 CI 覆盖，属上游硬件依赖而非平台缺陷"
  common_dependencies:
    - libusb-compat
    - libusb

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.47":
    status: built
    build_date: "2026-09-11"
    conan_ref: "cycfx2prog/0.47"
