# test_package/MANIFEST.yml — clamz 0.5
# CI L0e requires this file to exist.

package: clamz/0.5
homepage: "https://github.com/wlevine/clamz"

# 上游无测试套件（穷尽核查：源码包 17 个文件，无 tests/ 目录、
# Makefile.in 仅 all/install/uninstall/dist/clean/distclean 目标，
# 无 test/check/regress 目标、无测试钩子）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游无自带测试程序
upstream_tests: []

# test_package 自研测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "运行 clamz --help（含 Usage 且 rc=0）、--version（含 Clamz 0.5 且 rc=0）、无参数运行（stderr 打印 'downloaded successfully' 且 rc=0）、无效选项（打印 usage 且非零退出）"
    command: "bash test.sh"
  - file: test.sh
    description: "鸿蒙特有测试：readelf 验证 clamz 构建产物为 OHOS arm64 (aarch64) ELF（PC 鸿蒙平台特有架构验证，上游 Linux 产物为 x86_64）"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 5
