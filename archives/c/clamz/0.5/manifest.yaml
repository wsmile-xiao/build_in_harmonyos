# 版本级 manifest — clamz 0.5
# 遵循 ARCHIVE-SPEC v2.0

version: "0.5"
software: "clamz"

# 编译状态
status: published

build_date: "2026-09-07"
build_system: "autotools"

# 源码信息
source:
  url: "https://github.com/wlevine/clamz/archive/cc8d2bba6c8962bd4b6ca6466164365a1b3f2f35.tar.gz"
  sha256: "ca0c2352cfb6fd46d03e99fe78693ebd1049df7bd0838c5b18ac7ec79ad28551"
  tar_format: tar.gz

# 构建配置
build:
  system: autotools
  configure_options:
    - "PKG_CONFIG_PATH=<generators>"
    - "LIBGCRYPT_CFLAGS=-I<libgcrypt include>"
    - "LIBGCRYPT_LIBS=-L<libgcrypt lib> -lgcrypt"
  dependencies:
    - expat/2.8.2
    - curl/8.15.0
    - libgcrypt/1.12.2
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "上游 configure.ac 声明依赖 expat（AC_CHECK_LIB）、libcurl（PKG_CHECK_MODULES）、libgcrypt（AM_PATH_LIBGCRYPT）"
  - "libgcrypt >= 1.10 不再提供 libgcrypt-config，configure.ac 以 LIBGCRYPT_CFLAGS/LIBS 非空为守卫跳过 AM_PATH_LIBGCRYPT，直接注入依赖路径即可"
  - "PKG_CHECK_MODULES(libcurl) 依赖 pkg-config，通过 PkgConfigDeps 生成 .pc 并注入 PKG_CONFIG_PATH"
  - "2015 年老版 configure 用 mktemp -d ./confXXXXXX 建临时目录，OHOS HMDFS 拦截，需 E114 修复（ac_tmp 指向预建可写目录）"
  - "上游 configure 无 AC_CANONICAL_HOST，不支持 --host/--build，交叉编译依赖环境变量注入"
