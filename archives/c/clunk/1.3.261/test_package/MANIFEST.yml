package: clunk/1.3.261
homepage: "https://sourceforge.net/projects/clunk/"

upstream_check_command: "no CTest or make check target; run ./clunk-test f and ./clunk-test t"
upstream_test_in_build: true
upstream_test_command: "LD_LIBRARY_PATH=<bindir>:<sdl12-compat lib> ./clunk-test f && ./clunk-test t"
upstream_total_programs: 2
upstream_built_count: 1
upstream_case_count: 2
upstream_pass_count: 2
upstream_skipped_count: 0
upstream_test_note: "Upstream 1.3.261 ships test.cpp (modes f/t/bm/bf + interactive audio demo) and test_c.c (interactive audio only). Modes f (MDCT reference vs FFT comparison) and t (FFT roundtrip) are deterministic, headless and assertion-bearing; both are executed in build() with non-empty output and expected-section guards."

upstream_tests:
  - {file: test.cpp, command: "./clunk-test f", description: "MDCT reference vs FFT implementation comparison (deterministic DSP self-check)"}
  - {file: test.cpp, command: "./clunk-test t", description: "FFT forward/inverse roundtrip with residual printout (deterministic DSP self-check)"}

unattended_exclusions:
  interactive_audio_demo: ["default ./clunk-test run (plays helicopter.wav through SDL audio ~7s, no assertions, needs sound hardware)"]
  timing_benchmarks_without_verdict: ["./clunk-test bm (1M MDCT iterations)", "./clunk-test bf (2M FFT iterations)"]
  interactive_c_api_demo: ["test_c.c (plays scissors.wav through SDL audio, no assertions, needs sound hardware; not built by CMake)"]

test_package_tests:
  - file: test_clunk.cpp
    description: "FFT forward/inverse roundtrip residual under 1e-3 plus spectrum energy check"
    command: "./test_clunk"
  - file: test_clunk.cpp
    description: "clunk::Buffer alloc/fill/copy/dump through the compiled libclunk linkage"
    command: "./test_clunk"

assertion_count: 5
