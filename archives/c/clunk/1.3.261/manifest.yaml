software: clunk
version: "1.3.261"
status: built
build_date: "2026-09-09"
build_system: cmake

source:
  url: "https://downloads.sourceforge.net/project/clunk/clunk-1.3.261.tar.bz2"
  sha256: "1b15ce358b73b165a7d0e1a0d79fc5a8eb1b80595548e64f911e50525e8b24b7"
  tar_format: tar.bz2

build:
  system: cmake
  configure_options:
    - "BUILD_TEST=ON"
    - "WITH_SSE=OFF"
    - "BUILD_SHARED_LIBS=OFF"
  dependencies:
    - "sdl12-compat/1.2.68"
  cc: clang
  cxx: clang++

patches_applied:
  - patches/0001-cmake-ohos-compat.patch
  - patches/0002-pow10f-portability.patch

knowledge_gained:
  - "Upstream 1.3.261 has no CTest/make check; the f/t modes of test.cpp are the runnable DSP self-checks"
  - "SDL 1.2 API comes from sdl12-compat/1.2.68; legacy FindSDL fed via SDL_INCLUDE_DIR/SDL_LIBRARY cache variables"
  - "C++11 standard required (throw() specs and std::auto_ptr are C++17-removed); matches upstream master"
