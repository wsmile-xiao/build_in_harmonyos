sources:
  url: "https://downloads.sourceforge.net/project/clunk/clunk-1.3.261.tar.bz2"
  sha256: "1b15ce358b73b165a7d0e1a0d79fc5a8eb1b80595548e64f911e50525e8b24b7"
patches:
  "1.3.261":
    - patch_file: "patches/0001-cmake-ohos-compat.patch"
      patch_description: "CMake 3.5 minimum, C++11 standard (matches upstream master), shared/static control via BUILD_SHARED_LIBS, versioned SONAME"
      patch_type: "portability"
    - patch_file: "patches/0002-pow10f-portability.patch"
      patch_description: "Remove GNU pow10f dependency (missing on HarmonyOS/musl): rewrite sole call site to C99 powf(10,x), drop unused compat block, stop redefining C99 log2f"
      patch_type: "portability"
    - patch_file: "patches/0003-fft-ifft-sign.patch"
      patch_description: "Fix 8-point FFT inverse twiddle conjugation: k=2 factor must be (0,-SIGN) so ifft() inverts fft(); forward path unchanged"
      patch_type: "bugfix"
