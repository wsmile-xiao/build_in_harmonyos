software: crack
display: "crack"
description: "Crack v5.0a - the classic Unix password cracker by Alec Muffett (1991-1996)"
category: security
homepage: "https://packages.debian.org/sid/crack"
license: "Crack v5.0 LICENCE (freely distributable)"
build_system: make

ohos_adaptation:
  key_points:
    - "1996 K&R C sources: need -std=gnu89 -Wno-int-conversion with clang 15"
    - "No configure script; hand-rolled Makefile tree driven via make XDIR/XCFLAGS/XCC variables"
    - "stdlib-cracker backend uses libc crypt(3); no external crypt library required"
    - "Upstream registers one test (src/libdes destest, run in build Stage 4 with -DTERMIOS); platform tests exercise dawg roundtrip and full crack run"
  common_dependencies: []

versions:
  "5.0a":
    status: built
    build_date: "2026-09-11"
    conan_ref: "crack/5.0a"
