software: crack
version: "5.0a"
status: published
build_date: "2026-09-11"
build_system: "make"
conan_ref: "crack/5.0a"

source:
  url: "https://deb.debian.org/debian/pool/main/c/crack/crack_5.0a.orig.tar.gz"
  sha256: "328624cf679dca96a538f0a107edd8fb10a5989f22d4cb6452227d5823e8f668"
  tar_format: tar.gz

build:
  system: make
  configure_options: []
  dependencies: []
  cc: default
  cxx: N/A
  cflags: "-std=gnu89 -Wno-int-conversion -O2 -DUSE_STRING_H -DUSE_STDLIB_H -DUSE_SIGNAL_H -DUSE_SYS_TYPES_H -DUSE_UNISTD_H -DUSE_PWD_H"

patches_applied: []

knowledge_gained:
  - "K&R era code (implicit int, no prototypes, old-style varargs) fails clang 15 with -Wint-conversion errors in cracker.c Logger(); -std=gnu89 -Wno-int-conversion restores legacy semantics"
  - "crack 5.0a root Makefile refuses direct 'make'; the Crack driver script builds via 'make ARGS=... utils' which delegates to src/lib then src/util with XDIR/XCFLAGS/XCC/XLIBS variables"
  - "stdlib-cracker target in src/util/Makefile links elcid.o against libc crypt(3), avoiding the bundled libdes/ufc-crypt backends entirely"
  - "make needs the run/bin output directory to pre-exist ('ar rv' fails on missing path)"
  - "Upstream registers exactly one test target: src/libdes 'make test' -> ./destest (DES self-test); built in Stage 4 and run on target (14 case groups, exit 0)"
  - "libdes needs -DTERMIOS instead of legacy -DTERMIO on musl (termio.h absent)"
  - "Functional verification via dawg/xdawg roundtrip + cracker recovering crypt('123456') through the full mkdictgrps dictionary pipeline"
