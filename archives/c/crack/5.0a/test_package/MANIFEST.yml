test_package:
  type: functional
  entry: conanfile.py
  requires:
    - crack/5.0a
  upstream_tests: 1
  upstream_note: >-
    Upstream registers exactly one test target: src/libdes/Makefile
    "test: all" -> ./destest (libdes DES algorithm self-test). No test
    targets exist in the root Makefile, src/lib/Makefile,
    src/util/Makefile or extra/Makefile. The destest program is built
    and executed in the recipe build() (Stage 4) on the target —
    passes with exit 0 (see conan create / CI logs).
  checks:
    - "dawg/xdawg DAWG dictionary roundtrip preserves all words"
    - "cracker recovers weak password 123456 from DES crypt(3) ciphertext via full dictionary pipeline (mkdictgrps + kickdict + smartcat)"
