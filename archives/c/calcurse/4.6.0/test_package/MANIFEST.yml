# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: calcurse/4.6.0
homepage: "https://calcurse.org"

# 上游测试命令 — calcurse 用 make check（test/ 目录 73 个 shell 脚本，
# autotools 自带）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（2026-08-21 本地实测）：
# - make check 运行 test/ 目录 73 个脚本（appointment-*.sh、
#   regress-*.sh、io-*.sh 等）——见 PR 描述实测通过率
# - 消费者验证（test_package）：二进制存在 + 可执行 + ELF（R34 降级——
#   calcurse 是 ncurses 终端 UI，无头环境无法初始化终端，同 catpoint
#   'Error opening terminal'；上游 make check 已实测）
upstream_tests: []
