patches_applied:
  - "0001-CMakeLists.txt-harmonyos-platform.patch"
  - "0002-env-fs_posix.cc-hardlink-fallback.patch"
  - "0003-db-test-purge-info-logs-ohos.patch"
  - "0004-db-wal-test-fallocate-ohos.patch"
  - "0005-env-io_posix.cc-fallocate-ohos.patch"

knowledge_gained:
  - "rocksdb 8.7.3 原生使用 C++17，无需升级（6.4.6 需要从 C++11 升级）"
  - "rocksdb 8.7.3 使用 env/fs_posix.cc 与 env/io_posix.cc（非 6.4.6 的 env/env_posix.cc）；CMakeLists 添加 HarmonyOS 分支定义 OS_LINUX 后，其 #if defined(OS_LINUX) 守卫自动满足"
  - "rocksdb 8.7.3 util/channel.h 已有 mutable std::mutex，无需修补"
  - "OHOS 容器动态加载器拒绝加载用户可写路径下的共享库（dlopen Permission denied），故 zstd/gflags（ohpcd 仅 shared 变体）关闭，保留静态的 zlib/snappy/lz4/bz2 压缩支持，以确保本地 test_package 可运行并通过"
  - "OHOS 容器 /bin/sh 在 make/gcc 子进程上下文 exec 失败（Permission denied），conan build 改用 Ninja generator 直接 exec 命令绕过"
  - "GitHub 源码直连可用（需关闭 SSL 验证），Gitee 镜像 v8.7.3 返回 HTML 页面不可作为下载源"
