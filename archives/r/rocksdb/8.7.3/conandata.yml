sources:
  url: "https://github.com/facebook/rocksdb/archive/refs/tags/v8.7.3.tar.gz"
  sha256: "7d95aff5e6bcaaacad4dcaffbf7eb921d763e5f1fae840bce3e3083a60683e47"

patches:
  - patch_file: "patches/0001-CMakeLists.txt-harmonyos-platform.patch"
    patch_description: "Add HarmonyOS platform detection so OS_LINUX is defined (satisfies env/fs_posix.cc & env/io_posix.cc include guards)"
    patch_type: "portability"
  - patch_file: "patches/0002-env-fs_posix.cc-hardlink-fallback.patch"
    patch_description: "OHOS FS does not allow hard links (link() returns EPERM); fall back to CopyFile for LinkFile so checkpoint/external-sst/link-file operations work"
    patch_type: "portability"
  - patch_file: "patches/0003-db-test-purge-info-logs-ohos.patch"
    patch_description: "Make DBTest.PurgeInfoLogs robust on OHOS: recursively remove leftover db_log_dir subdir before asserting DestroyDB removed dbname_ (OHOS rmdir fails on non-empty dirs)"
    patch_type: "portability"
  - patch_file: "patches/0004-db-wal-test-fallocate-ohos.patch"
    patch_description: "DBWALTestBase::IsFallocateSupported: treat any fallocate failure (OHOS returns EPERM/EINVAL) as preallocation-unsupported and skip, so the WAL preallocated-space tests don't abort"
    patch_type: "portability"
  - patch_file: "patches/0005-env-io_posix.cc-fallocate-ohos.patch"
    patch_description: "PosixMmapFile::MapNewRegion: if fallocate/posix_fallocate fail with EPERM/ENOTSUP (OHOS FS), continue without preallocation instead of returning IOError"
    patch_type: "portability"
