package: rocksdb/8.7.3
homepage: "https://rocksdb.org/"

upstream_check_command: "cd build && make -j$(nproc) && ctest"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: db/db_test.cc
    source: rocksdb-8.7.3/db/db_test.cc
    description: "Core database operations (Put/Get/Delete/Iterator/WriteBatch)"
  - file: db/db_basic_test.cc
    source: rocksdb-8.7.3/db/db_basic_test.cc
    description: "Basic DB operations (Open/Close/CompactRange/Snapshot)"
  - file: table/table_test.cc
    source: rocksdb-8.7.3/table/table_test.cc
    description: "Table format and block cache tests"

test_package_tests:
  - file: test_rocksdb.cpp
    description: "8 functional groups: Open/Close, Put/Get, Delete, Iterator, WriteBatch, CompactRange, Snapshot, Persistence"
    command: "./test_rocksdb"

assertion_count: 20
