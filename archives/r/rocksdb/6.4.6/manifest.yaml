# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS SDK clang 15 (libc++ headers at libcxx-ohos) requires C++17 minimum, rocksdb 6.4.6 CMakeLists.txt forces c++11"
  - "musl libc headers in ~/usr/local/include conflict with OHOS SDK sysroot headers — fixed via force-include mechanism in CMakeLists.txt patch"
  - "CMAKE_SYSTEM_NAME is 'HarmonyOS' on OpenHarmony, not 'Linux' — need to add HarmonyOS to platform detection in CMakeLists.txt"
  - "const method using std::lock_guard requires mutable mutex (C++17 stricter type checking)"
  - "rocksdb 6.4.6 has env_posix.cc and io_posix.cc (no fs_posix.cc, which was added in later versions)"
  - "librocksdb.so references pthread_cond_clockwait which is not exported in OHOS sysroot libc — needs -Wl,--allow-shlib-undefined at link time but works at runtime"
  - "Functional test: 44/44 PASS (100%) — Open/Close, Put/Get/Delete, Iterator, WriteBatch, Persistence, CompactRange, Snapshot all working"

