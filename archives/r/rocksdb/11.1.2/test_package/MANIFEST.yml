# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rocksdb/11.1.2
homepage: "https://rocksdb.org/"

# 上游测试命令
upstream_check_command: "ctest   # 聚合目标 rocksdb_check = add_custom_target(... ${CMAKE_CTEST_COMMAND})"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试（未运行，如实申报）
# 实测规模（rocksdb-11.1.2 源码树）：
#   - *_test.cc 文件        : 222 个
#   - CMake TESTS 列表条目  : 213 项（CMakeLists.txt:1567）
#   - 框架                  : 内置 gtest 1.8.1（third-party/gtest-1.8.1/fused-src）
#   - 启用条件              : WITH_TESTS（CMAKE_DEPENDENT_OPTION，仅 Debug 默认 ON）
#                             + WITH_ALL_TESTS
upstream_tests:
  - file: db/db_basic_test.cc
    description: "每文件一个可执行文件（CMakeLists.txt:1593-1595），例如 db_basic_test / env_basic_test / cache_test"
    command: "./db_basic_test"
    count: 222
    executed: false
    not_run_reason: "CMakeLists.txt:1604 的 gtest_discover_tests() 会在构建期执行刚链接出的 aarch64 测试二进制来枚举用例；交叉编译下结构性不可用（见 notes.md §4.1）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_rocksdb.cpp
    description: "Consumer test: DB::Open / Put / Get / Get-missing / Delete / Iterator / Flush / Close —— 14 个断言，逐个打印 ok/FAIL"
    command: "./test_rocksdb"
    assertions: 14

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
