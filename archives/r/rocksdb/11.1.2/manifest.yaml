software: rocksdb

# 版本号
version: "11.1.2"

# 编译状态
status: built

# 编译日期
build_date: "2026-09-13"

# 构建系统
build_system: cmake

# 源码信息
source:
  url: "https://github.com/facebook/rocksdb/archive/refs/tags/v11.1.2.tar.gz"
  sha256: "3aba946031d27734eeea68ced7dd6f46629ba23a7b49945eb29aea68d1595311"
  tar_format: tar.gz

# 构建配置
build:
  system: cmake
  configure_options:
    - "-G Ninja"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DWITH_ZLIB=ON"
    - "-DWITH_SNAPPY=ON"
    - "-DWITH_LZ4=ON"
    - "-DWITH_BZ2=ON"
    - "-DWITH_ZSTD=OFF"
    - "-DWITH_GFLAGS=OFF"
    - "-DWITH_LIBURING=OFF"
    - "-DWITH_JEMALLOC=OFF"
    - "-DWITH_TESTS=OFF"
    - "-DWITH_TOOLS=OFF"
    - "-DWITH_BENCHMARK_TOOLS=OFF"
    - "-DFAIL_ON_WARNINGS=OFF"
    - "-DPORTABLE=1"
  dependencies:
    - zlib/1.3.1
    - snappy/1.2.2
    - lz4/1.10.0
    - bzip2/1.0.8
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied:
  - "0001-env-fs_posix.cc.patch"
  - "0002-env-io_posix.cc.patch"

# 知识沉淀
knowledge_gained:
  - "11.1.2 要求 C++20（CMakeLists.txt:103-105），farm profile 默认 cppstd=17 不满足，需在 recipe 中声明或被 profile 覆盖"
  - "11.1.2 的 WITH_TESTS 是 CMAKE_DEPENDENT_OPTION，默认仅在 CMAKE_BUILD_TYPE=Debug 时 ON；且 CMakeLists.txt:1604 用 gtest_discover_tests() 在构建期 *运行* 新链接的可执行文件——Release 交叉编译必须显式 WITH_TESTS=OFF"
  - "RocksDB 没有 third_party 内置压缩库，压缩编解码器完全依赖外部包；CMake 侧链接目标是 Snappy::snappy（大写 S，CMakeLists.txt:163-168）/ ZLIB::ZLIB（:172）/ ${BZIP2_LIBRARIES}（:179-186）/ lz4::lz4（:190）/ zstd::zstd（:195）"
  - "WITH_LIBURING 默认 ON（CMakeLists.txt:92），虽 find_package(uring) 非 REQUIRED，仍显式关闭以免探测"
  - "PORTABLE=1 防御性设置：若 -march=armv8-a+crc+crypto 探测失败，CMakeLists.txt:303-316 会注入 -march=native，交叉编译下 clang 会拒绝"
  - "OS_LINUX 由 CMAKE_SYSTEM_NAME MATCHES Linux 推导（CMakeLists.txt:516-517），OHOS 工具链下不成立，因此 env/fs_posix.cc 与 env/io_posix.cc 的 <sys/statfs.h>/<sys/sysmacros.h> 守卫需要 __OHOS__ 补丁"
