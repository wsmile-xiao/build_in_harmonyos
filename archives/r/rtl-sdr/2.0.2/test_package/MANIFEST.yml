package: rtl-sdr/2.0.2
homepage: "https://osmocom.org/projects/rtl-sdr/wiki"

# 上游测试：**没有**（如实声明）。顶层 CMakeLists.txt 无 enable_testing()/add_test，
# src/ 也没有测试目标；src/rtl_test.c 是需要真实 RTL2832U 电视棒的硬件自检程序
# （CI 与开发机都无该硬件，设备枚举恒为 0），不能当测试用。
# 因此 recipe 的 build() 里改为「8 个 CLI 启动冒烟」，协议/链路证据由消费者用例提供。
upstream_check_command: ""
upstream_test_in_build: false

upstream_tests: []

upstream_summary:
  registered: 0
  executed: 0
  ok: 0
  fail: 0
  note: "上游无测试套件（上游仓库内无 enable_testing/add_test/ctest 目标）"

build_time_smoke_tests:
  - description: "CLI 启动冒烟：8 个上游工具无参运行，必须秒级退出并打印 usage / “No supported devices found.”（输出为空即判失败，可发现缺库、链接与 RPATH 问题）"
    command: "(cd <build_folder>/src && ./rtl_sdr … ./rtl_biast) < /dev/null"
    tools: ["rtl_sdr", "rtl_fm", "rtl_tcp", "rtl_test", "rtl_eeprom", "rtl_adsb", "rtl_power", "rtl_biast"]
    result: "8/8 有输出（实测 rtl_sdr 469 字节 usage，其余 28~29 字节 “No supported devices found.”）"

test_package_tests:
  - file: test_rtlsdr.c
    description: "完整消费者用例（rule12 端到端业务流程）：只用交付的 librtlsdr.so + <rtl-sdr.h>，用 ELF 符号介入（ENABLE_EXPORTS/--export-dynamic + 自己定义 libusb_init/get_device_list/get_device_descriptor/free_device_list/exit/open/close/get_device/get_string_descriptor_ascii）伪造一台 VID=0x0bda PID=0x2838 的电视棒，跑通 ① rtlsdr_get_device_count()==1 ② rtlsdr_get_device_name(0) 命中上游机型表 “Generic RTL2832U OEM” ③ rtlsdr_get_device_usb_strings(0) 读回厂商/产品/序列号并与设备侧注入逐字节比对 ④ rtlsdr_get_index_by_serial() 反查命中与未知序列号返回 -3 ⑤ 越界索引的三条路径（名字回退、字符串缓冲区不被触碰、rtlsdr_open(9) 失败且不交出句柄）⑥ 设备侧计数证明请求真的穿过介入层，共 14 项可核对结果"
    command: "./test_rtlsdr"
  - file: test_layout.py
    description: "适配自检（M=23）：librtlsdr.so 是 ELF ET_DYN 且 DT_SONAME 为相对名（纯 Python 解析 .dynamic，不依赖 readelf）、lib/ 只留一份库（shared 选项）、公共头 rtl-sdr.h + rtl-sdr_export.h、8 个 CLI 可执行且为 ELF、pkg-config 契约可重定位（prefix=${pcfiledir}/../.. 且无构建机绝对路径）、GPL-2.0 COPYING、未带上游不可重定位的 lib/cmake/rtlsdr、无构建中间产物与隐藏文件（JC5）"
    command: "python3 test_layout.py <package_folder>"

assertion_count: 14
adapter_self_checks: 23
