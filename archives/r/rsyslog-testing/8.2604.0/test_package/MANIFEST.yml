# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  # ── 鸿蒙特有测试：完整消费者用例（人工评审 rule12 要求）───────────────────
  - file: test_omtesting_e2e.c
    description: >-
      鸿蒙特有测试（完整消费者用例，非纯断言）：以真实消费者（rsyslogd）身份
      dlopen(RTLD_NOW) 加载 omtesting.so → dlsym("modInit") → modInit() 触发模块
      向宿主索取 objGetObjInterface / regCFSLineHdlr 两个 core 服务并注册配置指令
      "actionomtestingechostdout" → queryEtryPt() 全入口表（13 项）→
      createInstance()（实例默认值 iWaitSeconds=1/iWaitUSeconds=0）→
      dbgPrintInstInfo()（经 core 日志回调自报实例状态）→ createWrkrInstance()
      → isCompatibleWithFeature() → tryResume()（MD_SLEEP 恢复路径）→
      doAction()（真实投递一条消息，模块经 dbgprintf 打印收到的消息文本）→
      二次 modInit（接口版本稳定性）→ freeWrkrInstance/freeInstance/modExit → dlclose；
      负例覆盖：未知入口点名称不得解析。
    command: "cc -std=gnu11 -Wl,--export-dynamic -o omtesting_e2e test_omtesting_e2e.c rsyslog_core_stub.c && ./omtesting_e2e <pkg>/lib/rsyslog/omtesting.so"
    e2e: true
    cases: 62
    executed: true
    passed: true
    execution_env: "OHOS aarch64 本机实跑：E2E_ASSERTIONS_OK=62 / FAILED=0（rc=0），指向制品 lib/rsyslog/omtesting.so（72064 字节）"
  - file: rsyslog_core_stub.c
    description: >-
      消费者进程内的 rsyslog core 符号层：实现模块在加载期引用的 5 个 core 服务
      （llvm-nm -u omtesting.so 实测：OMSRconstruct / OMSRdestruct /
      cflineParseTemplateName / randomNumber / r_dbgprintf），并以计数器与文本捕获
      记录模块的调用行为（host query 名称、配置指令名、日志文本）。作用：让
      omtesting.so 能在进程内按 RTLD_NOW 真实加载——OHOS/musl 无惰性绑定
      （RTLD_LAZY 等同 RTLD_NOW），模块的全部未定义符号必须可解析。
  - file: rsyslog_core_stub.h
    description: >-
      core 服务声明与观测接口（host query 回调、objGetObjInterface、
      regCFSLineHdlr、日志捕获缓冲），供 test_omtesting_e2e.c 断言使用。
  # ── 产物面校验 ───────────────────────────────────────────────────────────
  - file: check_omtesting.py
    description: "产物结构校验：ELF aarch64/ET_DYN、.dynstr 内 modInit/_init/_fini 导出、无 glibc 版本化符号、无 libz.so/libestr.so/libfastjson.so 动态依赖串、DT_NEEDED 仅 libc.so 且无 DT_RPATH/DT_RUNPATH（纯 ELF 字节自检）、licenses/COPYING、lib/rsyslog 仅含 omtesting.so"
    command: "python3 check_omtesting.py"
    executed: true
    passed: true
    execution_env: "OHOS aarch64 本机实跑（2026-09-30）：PASS=19 / SKIP=0 / FAIL=0，ALL CHECKS PASSED（rc=0）"
  - file: conanfile.py
    description: "L1 测试入口：定位制品内 lib/rsyslog/omtesting.so，注入 OMTESTING_MODULE/OMTESTING_PACKAGE_FOLDER 后先跑 check_omtesting.py，再编译并实跑消费者端到端用例（R34 实质验证，非空壳 print）"
    command: "conan create . --build=missing（CI 自动执行 test()）"

