# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: rsyslog-testing/8.2604.0
homepage: "https://www.rsyslog.com/"

# 上游测试清点口径（R51 三步法：清点 → 实跑 → 回填；完整台账见 notes.md 第 6 节）
#   官方源码包 rsyslog-8.2604.0.tar.gz 内 `tests/` 目录：文件 1657 个，其中 .sh 1421 个
#   （其余为 .conf/.py/.c 用例数据与 harness 辅助文件）。
#   本包构建体系为 autotools，上游用例经 tests/Makefile.am 注册
#   （check_PROGRAMS/TESTS 变量，tests/Makefile.am:1976-2166）。
#
#   与 omtesting 模块直接相关的 .sh 用例 23 个（grep -rl omtesting tests --include='*.sh'），
#   全部以 `. ${srcdir:=.}/diag.sh init` 起手、经 diag.sh 的 startup/injectmsg/
#   shutdown_when_empty 驱动**运行中的 rsyslogd**，并由 conf 内
#   `module(load="../plugins/omtesting/.libs/omtesting")` 加载本模块
#   （样例 tests/rscript_previous_action_suspended.sh:35-56）。
#   本包按「官方全量源码包 + 仅编译打包目标模块」口径构建，产物仅 lib/rsyslog/omtesting.so，
#   刻意不构建 rsyslogd（与同族 archives/k/kamailio-outbound/6.0.6 的模块打包口径一致），
#   故该 23 个用例在**包内构建流程**中无执行环境（CI 侧不做构建即执行）。
upstream_check_command: "make check（完整源码树 + rsyslogd 运行时；本包仅构建 plugins/omtesting）"
upstream_test_in_build: false
upstream_test_command: "make check"
upstream_tests_exist: true

# 实跑说明（2026-09-30，HarmonyOS PC aarch64）
#   为取得真实执行证据（R51 第二步），补测以**独立 rsyslogd testbench** 完成：
#   同一源码树 configure（--enable-testbench）→ 构建 tools/rsyslogd（3336704 字节）
#   → 补编 harness 辅助程序（test_id / diagtalker / chkseq / mangle_qi / msleep /
#   tcpflood）→ 逐用例 `cd tests && srcdir=. bash ./<case>.sh`（每例独立 rsyslogd 会话）。
#   musl 缺口（utmp/utmpx、_res、pthread_cancel）由**本地垫片**兜底，垫片与
#   关机宽限（RSTB_SHUTDOWN_GRACE）**均不进 patches/ 与制品**；方法见 notes.md 第 2、4 节。
upstream_test_audit:
  run_env: "HarmonyOS PC aarch64 + OHOS SDK 26.0.0.18 clang；自建 rsyslogd testbench（源码树 tools/rsyslogd + tests/diag.sh）"
  run_date: "2026-09-30"
  discovered: 25
  executed: 18
  passed: 18
  failed: 0
  skipped: 0
  excluded: 7
  conclusion: >-
    与 omtesting 模块相关的上游 .sh 用例 23 个（grep -rl omtesting tests --include='*.sh'），
    另计入 2 个经 driver 变量引用同一驱动片段的父用例（queue-persist.sh、daqueue-persist.sh），
    台账共 25 项。在自建 rsyslogd testbench（OHOS aarch64）中实跑：18 项 PASS / 0 项 FAIL。
    7 项排除且各有明确技术原因：5 项 queue-encryption-* 需队列加密 crypto provider，而本配方
    --disable-libgcrypt/--disable-openssl/--disable-gnutls/--disable-mbedtls/--disable-wolfssl
    且 OHOS sysroot 无 libgcrypt，该 provider 不在本包构建范围内（用例不适用，非缺陷）；
    1 项 daqueue-persist.sh 为上游自行禁用（脚本自打印 TEST is currently DISABLE because it is
    unstable，exit 77）；1 项 queue-persist-drvr.sh 非独立用例（queue-persist.sh 的 driver
    片段，自身不 source diag.sh），其功能由 queue-persist.sh 实跑覆盖。

