software: rsbackup
display: rsbackup
description: "rsync-based backup and retention tool"
category: backup
homepage: "https://www.greenend.org.uk/rjk/rsbackup/"
license: GPL-3.0-or-later
build_system: autotools
ohos_adaptation:
  key_points:
    - "Use published Boost, SQLite and rsync packages"
    - "Disable rsync ACL and xattr defaults unsupported by the published OHOS rsync and filesystem"
    - "Build graph utility only when optional Cairomm and Pangomm exist"
    - "Generate config.status temporary files in a writable directory"
  common_dependencies:
    - boost
    - sqlite3
    - rsync
versions:
  "10.0":
    status: built
    build_date: "2026-10-10"
