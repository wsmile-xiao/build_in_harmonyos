package: rsbackup/10.0
homepage: "https://www.greenend.org.uk/rjk/rsbackup/"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_test_changes:
  - file: "tests/setup.sh"
    reason: "Set an absolute test root because HMDFS getcwd can fail for nested child shells"
  - file: "tests/prune, tests/prunedecay, tests/pruneexec, tests/prunenever, tests/retire-*"
    reason: "Add ORDER BY to SQLite fixture queries whose previous row order was undefined"
  - file: "tests/store"
    reason: "Compare diagnostic lines without relying on unordered device iteration"
  - file: "tests/issue43, tests/issue71"
    reason: "Use the available bash interpreter via env"
upstream_test_exemption:
  reason: "On HarmonyOS, issue37 needs unsupported ACL preservation; issue70 requires stable HMDFS hard-link inode identity; prune-timeout expects a timeout-hook process status not returned by this platform. These three tests exit 77 with an explicit reason. The existing upstream bashisms test also skips, yielding 25 pass, 4 skip, 0 fail in the shell suite."
  spec: "TEST_QUALITY_SPEC §3.3"
  tests: ["tests/issue37", "tests/issue70", "tests/prune-timeout"]
