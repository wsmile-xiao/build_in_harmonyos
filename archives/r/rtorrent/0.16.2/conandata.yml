sources:
  url: "https://github.com/rakshasa/rtorrent/releases/download/v0.16.2/rtorrent-0.16.2.tar.gz"
  sha256: "248da813b3b6ff89016b5e11c59e6820857f5fb01dd4aad21843e5a461877cff"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Update config.guess for HarmonyOS/OHOS platform detection"
    patch_type: "portability"
  - patch_file: "patches/0003-config.sub.patch"
    patch_description: "Update config.sub to recognize ohos as a valid OS"
    patch_type: "portability"
  - patch_file: "patches/0004-src-display-attributes.h.patch"
    patch_description: "Undef curses macros (refresh, erase, clear) that conflict with C++ method names"
    patch_type: "portability"
  - patch_file: "patches/0005-libtorrent-0.16.17-api-compat.patch"
    patch_description: "Adapt to libtorrent 0.16.17 API: thread.h moved to torrent/system, Thread namespace changed from utils to system, replace removed callback_interrupt_pollling/signal_bitfield/send_event_signal APIs; SCgiTask switches to callback_id-based cancellation (cancel_callback_and_wait on close) to keep queued-callback UAF protection (mirrors upstream rtorrent 0.16.23); print_help exits via std::_Exit because exit(0) unwinds statics while disk/net/tracker threads started by torrent::initialize() are still running, which intermittently aborts on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0006-dht-controller-api-compat.patch"
    patch_description: "Adapt to libtorrent 0.16.17 DhtController API: remove throttle setters and rate counters dropped upstream (byte counters report 0, matching upstream rtorrent 0.16.23)"
    patch_type: "portability"
  - patch_file: "patches/0008-http-get-thread-arg.patch"
    patch_description: "Add Thread* argument to add_done_slot/add_failed_slot calls for libtorrent 0.16.17 HttpGet API"
    patch_type: "portability"
  - patch_file: "patches/0009-string-utf8-conversions.patch"
    patch_description: "Adapt to string_utf8 return types in libtorrent 0.16.17: copy frozen_path/frozen_root_dir/info name into std::string locals (.str()) instead of binding pointers to them"
    patch_type: "portability"
  - patch_file: "patches/0010-manager-api-compat.patch"
    patch_description: "Adapt Manager to libtorrent 0.16.17: drop removed connection_manager address_throttle hook; set_proxy_address delegates to runtime::proxy_manager()->set_proxy_url (replaces removed network_config()->set_proxy_address)"
    patch_type: "portability"
  - patch_file: "patches/0011-scheduler-api-compat.patch"
    patch_description: "Adapt to libtorrent 0.16.17 Scheduler API: time()→time_or_zero(), remove front() calls"
    patch_type: "portability"
  - patch_file: "patches/0012-tracker-api-compat.patch"
    patch_description: "Rename is_busy_not_scrape to is_requesting_not_scrape and fix lambda constness for Tracker find_if"
    patch_type: "portability"
  - patch_file: "patches/0013-path-string-utf8.patch"
    patch_description: "Add .str() on string_utf8 from Path::at() for wstring_width compatibility"
    patch_type: "portability"
  - patch_file: "patches/0014-tracker-is-busy-rename.patch"
    patch_description: "Rename is_busy/is_busy_not_scrape to is_requesting/is_requesting_not_scrape in window_tracker_list"
    patch_type: "portability"
  - patch_file: "patches/0015-download-api-compat.patch"
    patch_description: "Fix Download::HeuristicType→heuristics_enum, resolve_preferred callback_id, d.name string_utf8→Object, d.free_diskspace signature"
    patch_type: "portability"
  - patch_file: "patches/0016-free-diskspace-no-cache.patch"
    patch_description: "Use free_diskspace_no_cache() instead of free_diskspace() which now requires cache_list argument"
    patch_type: "portability"
  - patch_file: "patches/0017-command-file-string-utf8.patch"
    patch_description: "Add .str() on string_utf8 from Path iteration in command_file.cc for Object conversion"
    patch_type: "portability"
  - patch_file: "patches/0018-option-as-string-c-str.patch"
    patch_description: "Add .c_str() on option_as_string() return for variadic snprintf compatibility"
    patch_type: "portability"
  - patch_file: "patches/0019-choke-queue-enum.patch"
    patch_description: "Move HEURISTICS_* enum from choke_queue namespace to torrent namespace"
    patch_type: "portability"
  - patch_file: "patches/0020-command-network-compat.patch"
    patch_description: "Wire network.http.proxy_address / network.proxy_address commands to libtorrent 0.16.17 runtime::ProxyManager (http_proxy_url/proxy_url), replacing removed http_stack and network_config proxy APIs"
    patch_type: "portability"
  - patch_file: "patches/0021-command-tracker-compat.patch"
    patch_description: "Fix resolve_specific callback_id, is_busy→is_requesting, NetworkConfig namespace, and fix lambda return types from auto to torrent::Object for std::function conversion in command_tracker"
    patch_type: "portability"
  - patch_file: "patches/0022-test-helpers-libtorrent-0.16.17-compat.patch"
    patch_description: "Fix upstream CppUnit test helpers for libtorrent 0.16.17: drop removed this_thread::event_* mocks, use torrent/system/thread.h Thread namespace (mirrors upstream rtorrent 0.16.23); fixtures leak the never-started TestMainThread on tearDown because libtorrent 0.16.17's Thread teardown intermittently segfaults on OHOS (reproduced ~15% of runs, 0/100 after the change)"
    patch_type: "portability"
