package: rtorrent/0.16.2
homepage: https://github.com/rakshasa/rtorrent

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: test/main.cc
    source: rtorrent-0.16.2/test/main.cc
    description: "rtorrent CppUnit test driver"
    command: "./test/rtorrent_test"

test_package_tests:
  - file: test_package/test.sh
    description: "Run installed rtorrent: -h prints usage banner (exit 0), -n -h skips rtorrent.rc (exit 0)"
    command: "bash test.sh"

assertion_count: 3
