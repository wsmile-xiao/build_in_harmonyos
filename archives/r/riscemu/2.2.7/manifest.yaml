# 版本级 manifest — riscemu 2.2.7
# 遵循 ARCHIVE-SPEC v2.0

version: "2.2.7"
software: "riscemu"

# 编译状态（R29：conan_verify 通过后才可标 published；尚未上传制品仓，标 built）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub 官方 tag archive，含上游 test/ 目录；PyPI sdist 不含测试，
  # 本仓 test/ 为单数且同时含 pytest 与 lit/filecheck 两套框架）
  # 注意 tag 前缀为 "v"（v2.2.7），无 v 的 .tar.gz 会 404
  url: "https://github.com/AntonLydike/riscemu/archive/refs/tags/v2.2.7.tar.gz"
  # 源码校验和
  sha256: "d9d4da9bb4449c3de3c691e01dba5d0e8e9048cd9f32db3eab6476ea326fbd0c"
  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（纯 Python / poetry-core，由 pip 完成安装）
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）
  # 运行时 Python 依赖 pyelftools（^0.30）/ importlib-resources（^6.1.0）未发布为 conan
  # 配方，由 pip install 从配置的 pypi.cnb.cool 镜像解析并打入包内
  # （同已合并的 airthings-ble 1.2.0、aiven-client、rapt-ble 0.1.2 先例）。
  dependencies: []

  # 编译器（纯 Python 包，无 C/C++ 编译单元；此处保留 profile 默认值以保持一致）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "PyPI sdist 不含 test/ 目录，为接入上游 pytest + lit 两套套件须使用 GitHub 官方 tag archive 作为源码；上游测试目录名是单数 test/（不是 tests/），且 CI 同时跑 pytest -W error 与 lit --timeout=5 -v test/filecheck，只跑一套会漏覆盖 (ref: E432)"
  - "lit 为每个用例重建最小环境（只有 PATH + pass_vars 白名单），HOME 与 PYTHONPATH 都不转发：riscemu 的 fibs.asm 因 readline.write_history_file 抛 FileNotFoundError 而假失败，python3 -m riscemu 也可能解析到非被测包；用 lit.local.cfg 平台 shim 显式补回，且 lit --timeout 需要 psutil (ref: E429)"
  - "用 import <name> 探测命令行工具（filecheck）时，test_package 内同名目录 filecheck/ 会被当作隐式命名空间包导入成功，pip 安装被静默跳过，直到 lit 报 command not found (127)；工具类依赖必须用 shutil.which PATH 探针并在装完后复检 (ref: E430)"
  - "上游 riscemu.priv 子系统整块不可导入（priv/__main__.py 的 from riscemu import RunConfig 不存在 + PrivCPU/ElfLoader 用顶层绝对导入 from core.*）；发布版与 master 同样如此，适配时如实记录为不可用面、不擅自打补丁，并把 pyelftools 的可用性证明改走可达路径（直接 ELFFile 解析真实 ELF） (ref: E431)"
  - "纯 Python 库运行时依赖未发布为 conan 配方时，由 pip install . --prefix <stage> --ignore-installed 从 pypi.cnb.cool 镜像解析并整树打入包内，配方不声明 requires（airthings-ble 1.2.0 / aiven-client / rapt-ble 0.1.2 先例）"
  - "test_package/filecheck 的 lit 用例里 p2align.asm 用裸 riscemu 命令（console script），故 test() 的 PATH 必须含包自身 bin/ 与解释器 bin/；snitch 用例需要 python3 -m snitch，而 snitch/ 不在 wheel 内，须随 test_package 提供副本并加入 PYTHONPATH"
  - "init-build 的嵌套源码提升会把含构建脚本的文档目录误当源码根（本包是 sphinx-docs/，rapt-ble 是 docs/Makefile），须手工 tar --strip-components=1 重建 .orig/.work 后再跑 lang-preflight (ref: E466)"

# 知识条目引用（供索引/上报读取）
knowledge_ref:
  - "E429"
  - "E430"
  - "E431"
  - "E432"
