# lit.local.cfg — platform shim for the copied upstream lit suite (riscemu 2.2.7).
#
# Upstream runs this suite with `lit --timeout=5 -v test/filecheck`.
# lit does not inherit the caller's environment: it builds a minimal test
# environment from scratch (PATH plus an explicit whitelist), so neither HOME nor
# PYTHONPATH is forwarded (see lit/TestingConfig.py). This shim re-adds the two
# variables the suite needs; no upstream test file is touched.
#
#  * HOME — riscemu/debug.py writes its readline history to ~/.riscemu_history
#    when a debug session ends. Without HOME the expanduser("~") lookup fails on
#    this platform and the FileNotFoundError aborts the ebreak handling of
#    test/filecheck/fibs.asm, so its `// CHECK: [CPU] Program exited with code
#    1265227608` line never appears and that single test fails even though the
#    emulator itself is correct (the same command passes with HOME set, e.g.
#    `python3 -m riscemu -v -o ignore_exit_code,libc fibs.asm`).
#
#  * PYTHONPATH — the RUN lines invoke `python3 -m riscemu`, and the suite must
#    exercise the package that test_package/conanfile.py just verified, which is
#    only importable through PYTHONPATH (the recipe deliberately installs into
#    the package folder instead of the interpreter's site-packages).
import os
import tempfile

_home = os.environ.get("HOME") or os.path.expanduser("~")
if not os.path.isdir(_home):
    # No usable home directory on this account: give the emulator a writable
    # (throwaway) HOME instead of letting the history-file write abort the run.
    _home = tempfile.mkdtemp(prefix="riscemu-lit-home-")
config.environment["HOME"] = _home

if os.environ.get("PYTHONPATH"):
    config.environment["PYTHONPATH"] = os.environ["PYTHONPATH"]
