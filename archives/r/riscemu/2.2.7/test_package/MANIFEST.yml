# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: riscemu/2.2.7
homepage: "https://github.com/AntonLydike/riscemu"

# 上游测试命令 —— 上游 .github/workflows/ci-pytest.yml 共两套：
#   poetry run pytest -W error
#   poetry run lit --timeout=5 -v test/filecheck
upstream_check_command: "python3 -m pytest -W error && lit --timeout=5 -v test/filecheck"

# 上游测试在 test_package/conanfile.py 的 test() 中执行并输出
# HMBS_UPSTREAM_TEST_RESULT 标记（真机预检每轮必跑 test_package）。
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest test_package/tests/ -q --no-header -o addopts= -W error && lit --timeout=5 -v test_package/filecheck"

# 上游实际运行的测试程序（2026-09-29 实测记录）：
# PyPI sdist 不含 test/ 目录（上游 pytest 套件 9 个文件 + lit/filecheck 11 个用例
# 全部位于 test/ 下），GitHub 官方 tag archive（tag 前缀 v）含全部测试源码，
# sha256 已核验 d9d4da9bb4449c3de3c691e01dba5d0e8e9048cd9f32db3eab6476ea326fbd0c。
# 上游 test/*.py 原样复制进 test_package/tests/，test/filecheck/ 原样复制进
# test_package/filecheck/，均由 test_package 的 test() 运行。
upstream_tests:
  - file: test/test_tokenizer.py
    source: riscemu-2.2.7/test/test_tokenizer.py
    description: "汇编 tokenizer：注释/字符串/数字/符号切分（unittest.TestCase）"
    command: "python3 -m pytest test_package/tests/test_tokenizer.py -q --no-header -o addopts= -W error"
  - file: test/test_RV32F.py
    source: riscemu-2.2.7/test/test_RV32F.py
    description: "RV32F 浮点指令：fcvt/fmv 编解码与寄存器写入（参数化）"
    command: "python3 -m pytest test_package/tests/test_RV32F.py -q --no-header -o addopts= -W error"
  - file: test/test_integers.py
    source: riscemu-2.2.7/test/test_integers.py
    description: "Int32/UInt32：逻辑右移与 float->int 转换边界（NaN/±inf，参数化）"
    command: "python3 -m pytest test_package/tests/test_integers.py -q --no-header -o addopts= -W error"
  - file: test/test_float_impl.py
    source: riscemu-2.2.7/test/test_float_impl.py
    description: "Float32/Float64：序列化、bitcast、四则运算与开方"
    command: "python3 -m pytest test_package/tests/test_float_impl.py -q --no-header -o addopts= -W error"
  - file: test/test_helpers.py
    source: riscemu-2.2.7/test/test_helpers.py
    description: "helpers：地址对齐与数字字面量解析"
    command: "python3 -m pytest test_package/tests/test_helpers.py -q --no-header -o addopts= -W error"
  - file: test/test_instruction.py
    source: riscemu-2.2.7/test/test_instruction.py
    description: "指令参数 Immediate 解析与 NumberFormatException 行为"
    command: "python3 -m pytest test_package/tests/test_instruction.py -q --no-header -o addopts= -W error"
  - file: test/test_isa.py
    source: riscemu-2.2.7/test/test_isa.py
    description: "指令集注册：RV32I/F/M/A/D/Zicsr 及其 instruction_* 处理函数齐全性"
    command: "python3 -m pytest test_package/tests/test_isa.py -q --no-header -o addopts= -W error"
  - file: test/test_mstatus.py
    source: riscemu-2.2.7/test/test_mstatus.py
    description: "mstatus CSR：mpie/mpp/sd 位域读写"
    command: "python3 -m pytest test_package/tests/test_mstatus.py -q --no-header -o addopts= -W error"
  - file: test/test_regs.py
    source: riscemu-2.2.7/test/test_regs.py
    description: "寄存器堆：别名解析与 Float32/Int32 类型混用"
    command: "python3 -m pytest test_package/tests/test_regs.py -q --no-header -o addopts= -W error"
  - file: test/filecheck/*.asm
    source: riscemu-2.2.7/test/filecheck/
    description: "lit+filecheck 端到端用例 11 个：hello-world / register-indices / csr / fibs / p2align / rv32f-conv / rv32m-conv / libc/test-string.s / snitch/{frep_only,ssr_frep,ssr_only}"
    command: "lit --timeout=5 -v test_package/filecheck"

# test_package 中自带的测试（消费者视角验证, 纯 Python 包用 Python 脚本）
test_package_tests:
  - file: test_riscemu.py
    description: "消费者测试（L0c）：真实 API（R34）——包身份/dist 元数据、importlib_resources 读包内 libc 资源、pyelftools 真解析 ELF、Int32/UInt32/Float32/Float64 语义、decoder 反汇编、指令集注册表、mstatus、helpers、CLI 端到端模拟（含 libc 运行时与退出码传递）、console script、RiscemuMain 程序化 API，共 52 条断言"
    command: "python3 test_riscemu.py <site-packages-dir>"

# 测试断言总数（近似值, 用于质量评估）: 52 条消费者断言 + 49 个上游 pytest 用例 + 11 个上游 lit 用例
assertion_count: 52
