# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: readerwriterqueue/1.0.6
homepage: "https://github.com/cameron314/readerwriterqueue"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C tests/unittests run && make -C tests/stabtest run"

# conanfile.py build() 方法中是否已集成上游测试（header-only，无编译；未集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本机实测）
upstream_tests:
  - file: tests/unittests/unittests.cpp
    source: readerwriterqueue-1.0.6/tests/unittests/unittests.cpp
    description: "上游单元测试（SPSC enqueue/dequeue/blocking/vector/emplace/circular buffer，clang++ 编译）"
    command: "./unittests"
    result: "All tests passed (exit 0)"
  - file: tests/stabtest/stabtest.cpp
    source: readerwriterqueue-1.0.6/tests/stabtest/stabtest.cpp
    description: "上游稳定性压力测试（长时压力，2^24 迭代/测试，clang++ 编译成功，运行到 Test#31 后因设计时长被 timeout 截断，非失败）"
    command: "./stabtest"
    result: "编译成功，运行观察至 Test#31，timeout(100s) 截断，无断言失败"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：真实调用 ReaderWriterQueue/ReaderWriterCircularBuffer API（enqueue/try_dequeue 往返 + 多线程 SPSC 1000 条 + 环缓冲满队列语义断言）"
    command: "./test_readerwriterqueue"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
