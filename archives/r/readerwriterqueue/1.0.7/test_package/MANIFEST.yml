# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: readerwriterqueue/1.0.7
homepage: "https://github.com/cameron314/readerwriterqueue"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C tests/unittests run && make -C tests/stabtest run"

# conanfile.py build() 方法中是否已集成上游测试（header-only，无编译；未集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本机实测）
# 设备无 g++（上游 Makefile 硬编码 g++），以 clang++ -std=c++11 同参编译替代，
# 编译警告与 1.0.6 期一致（仅上游自身的 -Wsign-conversion 提示，非错误）。
upstream_tests:
  - file: tests/unittests/unittests.cpp
    source: readerwriterqueue-1.0.7/tests/unittests/unittests.cpp
    description: "上游单元测试（SPSC enqueue/dequeue/blocking/vector/emplace/circular buffer，clang++ 编译，minitest 用例制）"
    command: "./unittests"
    result: "17 个用例全部 passed，All tests passed（exit 0）"
  - file: tests/stabtest/stabtest.cpp
    source: readerwriterqueue-1.0.7/tests/stabtest/stabtest.cpp
    description: "上游稳定性压力测试（无限循环设计，每轮 2^25 次 enqueue/try_dequeue 校验，clang++ 编译成功）"
    command: "./stabtest"
    result: "受控观察 100s（timeout 124 截断），完成 Test#0..#39 共 40 轮，ERROR DETECTED 计数 0，非失败"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：真实调用 ReaderWriterQueue/ReaderWriterCircularBuffer API（enqueue/try_dequeue 往返 + 多线程 SPSC 1000 条 + 环缓冲满队列语义断言，共 12 条 assert）"
    command: "./test_readerwriterqueue"

# 测试断言总数 (近似值, 用于质量评估: 上游 unittests ASSERT_OR_FAIL 126 处 + 消费者 12 条 assert)
assertion_count: 138
