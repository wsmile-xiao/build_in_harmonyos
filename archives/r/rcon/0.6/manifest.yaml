# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 CMake 在检测不到 arc4random_uniform 时 REQUIRED libbsd；OHOS 制品仓未发布 libbsd。实测 OHOS libc 已内建 arc4random_uniform（CMake 检测 found），源码中基于 arc4random() 的拒绝采样回退为防御性代码（DRAFT-rdate 同族先例：musl 内建 arc4random）"
  - "CMake >= 4 移除 < 3.5 兼容，CMAKE_MINIMUM_REQUIRED 3.0/3.1 的上游项目需提升到 3.5"
  - "PKG_CHECK_MODULES 类 CMake 项目：CI worker 与 macOS 均有系统 pkg-config，无需 tool_requires pkgconf（初加 pkgconf/3.0.5 后 macOS create 报 exec format error——ohpcd 的 pkgconf 是 OHOS 二进制）"
  - "OHOS musl 的 open_memstream 缺陷：不 fflush 直接 fclose 不发布 buffer/size（*sizep 滞留 0、buffer 内容未提交；glibc/上游 musl 均正确）。open_memstream 渲染到内存的上游代码须在 fclose 前补 fflush（DRAFT-E660 mustach / DRAFT-13533 lsquic 同因，rcon 为第三个命中实例，真机 ctest 验证修复有效）"
  - "open_memstream 缺陷在同一上游库内会多处命中：rcon 的 src_rcon_serialize 与 main.c handle_arguments 两处均纯 fclose 无 fflush（OHOS 上分别导致 size 断言失败与命令体恒空）；排查时必须 grep 全库所有 open_memstream 使用点逐一补 fflush，不能只修测试暴露的第一处"

