sources:
  url: "https://github.com/n0la/rcon/archive/refs/tags/0.6.tar.gz"
  sha256: "c8d533319891534546dc23b8616aefadf8844e3f5f22674bb83fd69df1460540"
patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Drop the hard libbsd requirement (PKG_CHECK_MODULES REQUIRED) when the C library lacks arc4random_uniform; srcrcon.c ships a portable fallback instead (musl-based OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0002-main.c.patch"
    patch_description: "FFLUSH before fclose in handle_arguments open_memstream: OHOS musl only publishes the memstream buffer on an explicit flush (E660/13533), otherwise the joined command body comes out empty"
    patch_type: "portability"
  - patch_file: "patches/0003-srcrcon.c.patch"
    patch_description: "Add portable rejection-sampling fallback rcon_arc4random_uniform() based on arc4random() (musl >= 1.2.4); remove the <bsd/stdlib.h> hard include; FFLUSH before fclose in src_rcon_serialize open_memstream (E660/13533)"
    patch_type: "portability"
  - patch_file: "patches/0004-tests-CMakeLists.txt.patch"
    patch_description: "Drop libbsd linkage for the upstream srcrcontest test binary (fallback function makes it unnecessary)"
    patch_type: "portability"
