# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rcon/0.6
homepage: "https://github.com/n0la/rcon"

# 上游测试命令 (ctest -N 分析: 1 个测试 srcrcontest)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (tests/srcrcontest.c, 链接 check 框架)
upstream_tests:
  - file: tests/srcrcontest.c
    source: rcon-0.6/tests/srcrcontest.c
    description: "src_rcon 消息结构/协议字段大小与序列化校验（check 框架断言）"
    command: "./srcrcontest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "冒烟: 调用已安装的 rcon --help 并断言退出码与用法输出"
    command: "./test_rcon"
  - file: test.c
    description: "端到端消费者用例 (鸿蒙特有测试): 本地起最小 RCON 服务器 (127.0.0.1 真实 TCP socket), 驱动已安装 rcon 二进制完成真实 auth+command 往返, 服务器校验报文 (auth type=3/密码, command type=2/payload), 客户端输出响应体 e2e-ok 且退出 0"
    command: "./test_rcon"

# 测试断言总数 (近似值, 用于质量评估): srcrcontest 61 断言 + e2e 服务器侧 3 处报文校验/客户端 2 处输出断言
assertion_count: 66
