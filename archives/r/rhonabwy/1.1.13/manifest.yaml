# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 rhonabwy 的公开头 include/rhonabwy.h 是「胖头」：无条件 include <jansson.h>/<gnutls/gnutls.h>/<nettle/version.h>；而 rhonabwy 是共享库，链接链不会把依赖的 usage requirements 传给消费者。实测 CMakeDeps 只为**直接** requires 的包生成有效数据（纯传递依赖被写成空 set），且库侧 cpp_info.requires 也不会展开到消费者的 CMake graph，故 test_package / 下游消费者必须自己声明公开头依赖（knowledge_ref: E216，同类：CMakeDeps 组件头文件传播失效）"
  - "gmp/6.3.0.1 已发布 revision 的 Conan 元数据未导出 include 目录（生成的 gmp-release-*-data.cmake 中 gmp_INCLUDE_DIRS_RELEASE 为空），而 gnutls 公开头会 include <gmp.h>；补丁需把 gmp 包内 include 目录注入到 Nettle 目标（knowledge_ref: E431，草稿 knowledge/drafts/E431-draft-0755.kv）"
  - "上游 CMake 用大写目标名（Jansson::Jansson / Gnutls::Gnutls / Nettle::Nettle / Orcania::Orcania-static / Yder::Yder-static），CMakeDeps 只导出小写（jansson::jansson / gnutls::gnutls ...）；移植补丁在 find_package 之后建别名即可保持上游源码零改动（knowledge_ref: E473, E300）"
  - "OHOS 加载器忽略 LD_LIBRARY_PATH 解析共享依赖链，会绑定系统旧 libgnutls.so.30（缺新符号，报 'Error relocating ... symbol not found'）；test_package 需前置图中依赖的 lib 目录并 LD_PRELOAD 本次构建的 libgnutls.so.30（knowledge_ref: E505，同 ulfius/2.7.15 先例）"
  - "OHOS 下 make 无法创建 jobserver fifo（'make: jobserver mkfifo: Operation not permitted'），构建测试程序必须 -j1，否则整个并行构建失败（knowledge_ref: E430，草稿 knowledge/drafts/E430-draft-BDBB.kv）"
  - "refresh-patch --auto 会按「NNNN-源文件相对路径」重命名补丁文件但**不回写 conandata.yml**；用过 refresh-patch 后必须同步 patch_file，否则 conan create 报 'patch 文件路径或格式错误'（knowledge_ref: E429）"
  - "libcheck（check/0.15.2）的 'Checks: N, Failures: M' 汇总行是每个测试程序一次，可跨程序相加得到上游实际执行的用例数；本包 19 个程序合计 252，与源码 tcase_add_test 清点 253 相差 1（knowledge_ref: 本次实测未入库，证据见 test_package/MANIFEST.yml 与 reports/test-report.md）"
  - "上游 test/cert/ 目录含 5 个文件（create-cert.sh + 4 个 openssl 模板），测试引用的 5 个证书/密钥夹具由它配合 certtool 生成；这些夹具只被 6 个引用 cert/ 的测试源文件消费，而制品仓 ulfius/2.7.15 配方已合并但无 OHOS 二进制，故这 6 个程序（126 用例）本次不构建，补丁写成「找到 Ulfius 才注册」，Ulfius 发布后自动纳入（knowledge_ref: 本次实测未入库，处置见 patches/0001-CMakeLists.txt.patch 与 PR 补充说明）"

