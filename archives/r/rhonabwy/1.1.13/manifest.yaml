# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（由 conanfile.py 的 CMakeToolchain 下发）
  configure_options:
    # 由 conanfile.py 的 generate() 在配置期按图中解析到的**实际**依赖取值写入，
    # 下列为本次验证运行的实际取值（依赖升级后会随之变化，非硬编码）：
    - "-DINSTALL_HEADER=ON"
    - "-DWITH_CURL=True"
    - "-DBUILD_RHONABWY_TESTING=ON"
    - "-DORCANIA_VERSION_STRING=2.3.3"          # = self.dependencies['orcania'].ref.version
    - "-DYDER_VERSION_STRING=1.4.20"            # = self.dependencies['libyder'].ref.version
    - "-DGMP_INCLUDE_DIR=<gmp pkg>/include"     # = self.dependencies['gmp'].package_folder + /include
    - "-DCHECK_INCLUDE_DIR=<check pkg>/include" # = self.dependencies['check'].package_folder + /include
    - "-DCHECK_LIBRARY=<check pkg>/lib/libcheck.a"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gnutls/3.8.10
    - nettle/3.10.2.1
    - jansson/2.15.1.1
    - zlib/1.3.1.1
    - curl/8.15.0
    - orcania/2.3.3
    - libyder/1.4.20
    - gmp/6.3.0.1
    - check/0.15.2

  # 编译器
  cc: clang
  cxx: clang++

