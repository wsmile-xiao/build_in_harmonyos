sources:
  "1.1.13":
    url:
      - "https://github.com/babelouest/rhonabwy/archive/refs/tags/v1.1.13.tar.gz"
    sha256: "b23c996d0dff87945e0073c73bb6103c999781eb527da4d62301abb795715af0"

patches:
  "1.1.13":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: >-
        OHOS / Conan CMakeDeps portability: normalise the imported target names
        exported by CMakeDeps (jansson::jansson, nettle::nettle, gnutls::gnutls,
        Orcania::Orcania-static, Yder::Yder-static) to the names this
        CMakeLists.txt uses, inject the include directory of the gmp package
        (which the published Conan metadata does not export), resolve Check
        through the bundled module, and make the test-only Subunit / Ulfius
        dependencies optional so the runnable upstream CTest programs are built
        and executed on HarmonyOS PC.
      patch_type: portability
    - patch_file: "patches/0002-src-misc.c.patch"
      patch_description: >-
        Make the CURLcode return value of curl_easy_perform explicit in src/misc.c
        so clang 15 does not reject the implicit enum-to-int narrowing of the
        upstream -Wall -Werror -Wconversion build.
      patch_type: portability
