software: rhonabwy
category: "security"
display: "Rhonabwy"
description: "Javascript Object Signing and Encryption (JOSE) library for C - JWK, JWKS, JWS, JWE and JWT"
homepage: "https://github.com/babelouest/rhonabwy/"
license: "LGPL-2.1-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Pure C99 JOSE library; runtime deps = libc + jansson/gnutls/nettle/gmp/zlib/curl (hard) + orcania/libyder"
    - "include/rhonabwy.h is a 'fat' public header (unconditional <jansson.h>/<gnutls/gnutls.h>/<nettle/version.h>) and rhonabwy is a shared library, so link-time usage requirements are NOT forwarded: consumers must list the public-header dependencies in their own requirements() (same conclusion as the merged ulfius/2.7.15 and dwarves/1.30 test_package)"
    - "CMakeDeps exports lower-case targets (jansson::jansson, gnutls::gnutls, nettle::nettle, orcania::orcania_static, libyder::yder_static); upstream uses capitalised ones - the portability patch creates aliases after find_package() so upstream sources stay untouched"
    - "gmp/6.3.0.1 ships no include directory in its Conan metadata (gmp-release-*-data.cmake has an empty gmp_INCLUDE_DIRS_RELEASE) while nettle's public headers include <gmp.h>; the recipe hands gmp's package include dir to the build and the patch appends it to the Nettle target"
    - "Upstream gates on the ORCANIA_VERSION_STRING / YDER_VERSION_STRING module variables that CMakeDeps does not define; the recipe seeds them from the versions actually resolved in the graph so the gates stay meaningful instead of being bypassed"
    - "Subunit (upstream test dependency, not published in the repo) is made optional by the portability patch; the 6 Ulfius-based test programs are only registered when Ulfius is found, so they drop in automatically once ulfius has an OHOS binary"
    - "OHOS make cannot create the jobserver fifo ('Operation not permitted'): the recipe builds the upstream test programs with an explicit -j1"
    - "Test suite (check/0.15.2 + the upstream CTest registration) runs 19/19 buildable upstream programs (252 cases) inside conan create; test_package runs a real compact-JWS round trip against the installed package"
  common_dependencies:
    - libc
    - jansson
    - gnutls
    - nettle
    - gmp
    - zlib
    - libcurl
    - orcania
    - libyder

versions:
  "1.1.13":
    status: built
    build_date: "2026-09-26"
    notes: "Initial OHOS aarch64 adaptation. Portability patch (0001) + one source-level clang-15 -Wconversion fix (0002); 19/19 buildable upstream CTest programs pass (252 cases, 0 failures) and the test_package consumer program passes 19/19 assertions inside conan create. The release/debug artifact tarballs are produced locally under packaging/ (gitignored, not committed)."
