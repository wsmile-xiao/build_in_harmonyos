# 软件级 manifest — rgf
software: rgf
display: "rgf"
description: "正则贪心森林（Regularized Greedy Forest）决策森林机器学习命令行工具：训练/预测/联合训练预测"
category: utility
homepage: "https://github.com/RGF-team/rgf"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "路径 A：只构建原始 RGF 实现（RGF/ 子目录，与 Homebrew 公式同范围），单二进制 bin/rgf，零第三方依赖"
    - "tag 根目录无 CMakeLists：cmake.configure 定点到 <source>/RGF，不补傀儡入口"
    - "RGF C++ 核心无测试套件（无 ctest/tests/check 目标），按 no_tests 处理；test_package/test_rgf.sh 补 12 条消费侧功能断言"
    - "FastRGF（OpenMP）与 python-package/R 包装器不在本次范围内"
  common_dependencies: []

versions:
  "3.12.0":
    status: built
    build_date: "2026-09-28"
    conan_ref: "rgf/3.12.0"
