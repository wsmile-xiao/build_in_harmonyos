status: built
build_date: "2026-09-28"
build_system: "cmake"

source:
  url: "https://github.com/RGF-team/rgf/archive/refs/tags/3.12.0.tar.gz"
  sha256: "c197977b8709c41aa61d342a01497d26f1ad704191a2a6b699074fe7ee57dc86"
  tar_format: tar.gz
  upstream_tag: "3.12.0"

build:
  system: cmake
  configure_options:
    - "cmake source dir: <source>/RGF (upstream CMakeLists lives in the RGF/ subdir, same scope as the Homebrew formula)"
    - "no test target invoked: upstream registers zero ctest cases"
    - "-DCMAKE_SYSTEM_NAME stays at Conan OHOS->HarmonyOS mapping (unknown-platform warning is non-fatal per ls-hpack/2.3.5; upstream has no Linux-only branches)"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 (upstream declares no cmake_minimum_required; E103/E187; oatpp pattern: toolchain + configure CLI)"
  dependencies: []
  test_dependencies: []
  cc: clang
  cxx: clang++
  profile: "ohos-aarch64 (host == build)"

patches_applied:
  - "patches/0001-remove-hardcoded-install-prefix.patch (portability: drop hardcoded set(CMAKE_INSTALL_PREFIX <source>) so the Conan package prefix wins)"

knowledge_gained:
  - "rgf tag 包根目录无 CMakeLists，真正的构建入口是 RGF/CMakeLists.txt（单 add_executable(rgf) + install(TARGETS rgf DESTINATION bin)）；配方用 cmake.configure(build_script_folder=<source>/RGF) 定点，与 Homebrew 公式 cd RGF 行为一致"
  - "真机 compiler identification unknown 非平台名问题，而是 E557 宿主 lld 运行时故障（libxml2.so.16 不可加载）：移植 ls-hpack/2.3.5 的真实 compile+link 探针与 build-scoped LD_LIBRARY_PATH 门禁；Linux 映射仅消告警不治本，已回退"
  - "上游 RGF/CMakeLists.txt 无 cmake_minimum_required：CMake 4.x 拒配，需 CMAKE_POLICY_VERSION_MINIMUM=3.5 双通道注入（toolchain + configure variables，oatpp/1.3.1 模式；E103/E187）"
  - "上游 set(CMAKE_INSTALL_PREFIX <source>) 会覆盖工具链前缀：打补丁删除该行，否则 cmake --install 落盘到源码缓存而非包目录（Homebrew 用手抄 bin/rgf 绕过同一行）"
  - "RGF 核心零第三方依赖（仅 C++ 标准库），FastRGF 的 OpenMP 与 python-package 的 sklearn 依赖均不在本次路径 A 范围内"
  - "RGF C++ 核心无测试套件：无 enable_testing/add_test、无 tests/ 目录、无 check 目标；python-package/tests 只测 Python 包装器，不计入本包口径，按 no_tests 处理"

verification:
  upstream_tests: "0/0（上游无测试套件，审计见 test_package/MANIFEST.yml）"
  test_package: "待真机预检回填（test_rgf.sh 设计 12 条断言，计数以真机 rgf-consumer 汇总行为准）"
  target: "HarmonyOS PC arm64, os=OHOS, arch=armv8, clang/LLVM 15"
