# test_package/MANIFEST.yml
# rgf 3.12.0 — 上游官方测试声明（CI L0e 硬门禁要求存在）。

package: rgf/3.12.0
homepage: "https://github.com/RGF-team/rgf"

# 上游 C++ 核心无测试套件（经审计官方 tag 包确认，见下方）。
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

# 上游测试审计（tag 包 rgf-3.12.0.tar.gz，sha256 见 conandata.yml）。
upstream_test_audit:
  source_tarball: "rgf-3.12.0.tar.gz (https://github.com/RGF-team/rgf/archive/refs/tags/3.12.0.tar.gz)"
  source_sha256: "c197977b8709c41aa61d342a01497d26f1ad704191a2a6b699074fe7ee57dc86"
  packaged_scope: "RGF/ 子目录（与 Homebrew 公式同范围：只构建原始 RGF 实现；FastRGF/OpenMP 变体与 python-package/R 包装器不在本次基础适配范围内）"
  scanned_for:
    - "enable_testing / add_test（ctest）"
    - "tests/ / test/ 目录（RGF/ 内）"
    - "Makefile 中 check/test 目标（RGF/ 内）"
    - "gtest / pytest 注册（C++ 核心内）"
  scan_result: "RGF/CMakeLists.txt 全文无 enable_testing、无 add_test、无 TEST 宏；RGF/ 下无 tests/ 或 test/ 目录；RGF/ 构建目标唯一（add_executable(rgf) + install(TARGETS rgf DESTINATION bin)）；RGF/examples/sample/ 下 14 个文件全为训练/预测数据与 .inp 参数文件（train.data.x/train.data.y/test.data.x/...），无任何测试断言框架。python-package/tests/ 存在但只覆盖 Python 包装器（需 Python + scikit-learn/scipy/numpy），不测试被打包的 C++ 二进制，不计入本包口径。"
  reason: "被打包的 RGF C++ 核心无自动化测试套件：无 ctest 注册、无 tests/ 目录、无 check/test 目标，示例数据仅为手册式演示输入。按 no_tests 处理。"

# 上游测试命令（无测试套件，故不适用；build() 不调用 ctest，避免空跑冒充覆盖）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（upstream_tests_exist: false，见上方审计）。
upstream_tests: []

# test_package 消费者测试（真实执行已打包的 rgf 二进制）。
test_package_tests:
  - file: test_rgf.sh
    description: "真实执行包内 rgf：合成回归集 train_predict 端到端（模型/预测/info 产物非空、预测行数与测试行数一致、info 含 leaf 结构）+ 缺失输入与未知动作两条错误路径非零退出"
    command: "bash test_rgf.sh"

harmonyos_specific_tests: []

# 测试断言总数（= test_rgf.sh 输出的确定性汇总行）。
assertion_count: 12
