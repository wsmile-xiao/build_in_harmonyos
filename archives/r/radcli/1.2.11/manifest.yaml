version: "1.2.11"
software: "radcli"
status: built
build_date: "2026-09-17"
build_system: "autotools"

source:
  url: "https://github.com/radcli/radcli/releases/download/1.2.11/radcli-1.2.11.tar.gz"
  sha256: "b6210e4c7deae235bb8c4e9df20c4f82c8bc2bda6d6214d50c5667660ab38548"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--without-tls"
    - "--without-nettle"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
  - "radcli 1.2.11为Autotools项目，默认探测gnutls/nettle，缺失时回退到内置MD5，显式--without可保证可复现"
  - "上游N=14（tests/Makefile.am：12基础TESTS + ENABLE_GNUTLS的tls-tests.sh + avpair）；13个shell集成测试全部依赖SERVER_IP，无服务器时exit 77记为SKIP，不视为失败"
  - "avpair单元测试与tls-tests.sh仅在ENABLE_GNUTLS时注册（gnutls>=3.1.0）；Path-A用--without-tls，合并TESTS单次运行得TOTAL=14/PASS=1/SKIP=13；avpair逻辑可提炼为离线test_package用例"
