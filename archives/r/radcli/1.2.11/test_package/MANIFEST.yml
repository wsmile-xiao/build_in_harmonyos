upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check TESTS=\"avpair\" (counted automake run: TOTAL=1 PASS=1; 13 shells excluded: need live FreeRADIUS SERVER_IP, exit 77)"


# Upstream total N=14 (tests/Makefile.am: 12 base TESTS + tls-tests.sh +
# avpair under ENABLE_GNUTLS; tag 1.2.11 audit). Counted evidence is
