software: radsecproxy
display: "RadSecProxy"
description: "RADSEC (RADIUS over TLS/TCP/DTLS) proxy server for secure RADIUS communication"
category: network
homepage: "https://radsecproxy.sourceforge.net/"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "musl libc 不支持 res_nquery/_res，需禁用 DNS SRV/NAPTR 查询"
    - "musl mallopt 不支持 M_TRIM_THRESHOLD，需条件编译"
    - "HMDFS setgid 权限继承问题，需使用预固定临时目录"
    - "依赖: openssl, nettle"
  common_dependencies:
    - openssl
    - nettle

versions:
  "1.11.2":
    status: published
    build_date: "2026-05-21"
    notes: "首次成功编译，禁用 DNS SRV/NAPTR 查询功能"