# test_package/MANIFEST.yml — redsocks 0.5
package: redsocks/0.5
homepage: "https://github.com/darkk/redsocks"
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
test_package_tests:
