software: redsocks
version: "0.5"
status: built
build_system: makefile
build_date: "2026-09-17"
created_at: "2026-08-27"
knowledge_gained:
  - "Makefile project: AutotoolsToolchain+AutotoolsDeps then make -j1 in source folder"
  - "Makefile `LIBS := -levent_core` overrides env LIBS; upstream default links shared libevent_core from the conan package"
  - "Makefile uses uname for config.h, OHOS returns HarmonyOS not Linux -> need patch"
  - "0001-Makefile.patch: add HarmonyOS to Linux case pattern"
  - "0002-base.c.patch: replace linux/netfilter_ipv4.h with inline SO_ORIGINAL_DST"
  - "tools.build:compiler_executables is a dict conf; dotted sub-key access (':c') raises ConanException — use AutotoolsToolchain instead"
  - "basic_layout (OHOS conan): build folder is build-release/, sources in source folder — self.run needs cwd=self.source_folder"
  - "shared lib deps need requires(..., run=True) so VirtualRunEnv composes LD_LIBRARY_PATH for consumers"
patches_applied:
  - "0001-Makefile.patch"
  - "0002-base.c.patch"
source_url: https://github.com/darkk/redsocks/archive/refs/tags/release-0.5.tar.gz
configure_options: []
