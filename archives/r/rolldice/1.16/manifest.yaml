software: rolldice
# 版本级 manifest
# 文件位置: archives/r/rolldice/1.16/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.16"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sstrickl/rolldice/archive/refs/tags/v1.16.tar.gz"

  # 源码校验和
  sha256: "8bc82b26c418453ef0fe79b43a094641e7a76dae406032423a2f0fb270930775"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # readline 原为依赖，但通过源码补丁替换为 getline()，无需外部依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
  - "0002-main.c.patch"
  - "0003-rolldice.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "rolldice 使用纯 Makefile 构建，无 configure 脚本"
  - "原依赖 GNU readline 库，在 Conan remotes 中不可用，通过源码补丁用 getline() 替代"
  - "Makefile 的 CC ?= gcc 在鸿蒙上需通过环境变量 CC=clang 覆盖"
  - "make -j2 在鸿蒙上因 jobserver mkfifo 权限限制需改用 -j1"
  - "Conan 2.12 中 EnvVars 对象使用 save_script() 而非 save()"
  - "GitHub 源码下载在鸿蒙环境超时，需使用 ghfast.top 镜像"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/rolldice-1.16.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/rolldice-1.16.work
  source_orig_hash: 0ef6c9c49f3edb3a
  source_work_hash: 5e407a53c396e451
  generated_at: '2026-06-30T12:55:22'
  patches_count: 3

patch_classification:
  - file: 0001-Makefile.patch
    type: portability
    platform_only: True
    guard: 'none'
    description: "移除 LIBS = -lreadline，改为 LIBS =（空）"
  - file: 0002-main.c.patch
    type: portability
    platform_only: True
    guard: 'none'
    description: "添加 readline() 替代函数，使用 getline() 实现相同接口"
  - file: 0003-rolldice.h.patch
    type: portability
    platform_only: True
    guard: 'none'
    description: "移除 #include <readline/readline.h>"
