# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: re2c/4.3.1
homepage: "https://re2c.org/"

# 上游测试命令
upstream_check_command: "python3 run_tests.py"
upstream_test_in_build: false
upstream_test_command: "python3 run_tests.py -j2"

# 上游实际运行的测试程序
upstream_tests:
  - file: run_tests.py
    source: re2c-4.3.1/run_tests.py
    description: "re2c 官方测试套件（运行时因平台缺少 chmod 命令受限）"
    command: "python3 run_tests.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_input.c
    description: "使用 re2c 处理 .c 文件（含 re2c 指令）生成 C 代码并编译运行"
    command: "./test_re2c"

# 测试断言总数 (近似值)
assertion_count: 1
