# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rapt-ble/0.1.2
homepage: "https://github.com/sairon/rapt-ble"

# 上游测试命令 — rapt-ble 上游使用 pytest 套件（tests/test_parser.py）
upstream_check_command: "python3 -m pytest tests/"

# 上游测试在 test_package/conanfile.py 的 test() 中执行并输出
# HMBS_UPSTREAM_TEST_RESULT 标记（真机预检每轮必跑 test_package）。
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest test_package/tests/ -q --no-header -o addopts="

# 上游实际运行的测试程序（2026-09-29 实测记录）：
# PyPI sdist 不含 tests/ 目录，GitHub 官方 tag archive（tag 前缀 v）含
# tests/test_parser.py（1 个文件、3 个 test 函数、参数化后 7 个用例，纯
# RAPT Pill BLE 广播 hex 解码逻辑、无需真实 BLE 硬件）。源码选择 GitHub
# 官方 tag archive（sha256 已核验）。上游 tests/ 原样复制进
# test_package/tests/，由 test_package 的 test() 运行。
upstream_tests:
  - file: tests/test_parser.py
    source: rapt-ble-0.1.2/tests/test_parser.py
    description: "RAPT Pill BLE 广播解析测试（3 个 test 函数 -> 7 个用例）"
    command: "python3 -m pytest test_package/tests/test_parser.py -q --no-header -o addopts="
  - file: tests/test_parser.py::test_device_supported
    source: rapt-ble-0.1.2/tests/test_parser.py
    description: "supported() 识别 v1 / v2(无重力速度) / v2(有重力速度) 三种广播（3 用例）"
    command: "python3 -m pytest test_package/tests/test_parser.py -k test_device_supported"
  - file: tests/test_parser.py::test_parse_version
    source: rapt-ble-0.1.2/tests/test_parser.py
    description: "KEG 版本广播 -> sw_version 20220612_050156_81c6d1（1 用例）"
    command: "python3 -m pytest test_package/tests/test_parser.py -k test_parse_version"
  - file: tests/test_parser.py::test_parse_metrics
    source: rapt-ble-0.1.2/tests/test_parser.py
    description: "指标解码：比重 1.0109 / 温度 23.94℃ / 电量 43% / 信号 -60dBm（3 用例）"
    command: "python3 -m pytest test_package/tests/test_parser.py -k test_parse_metrics"

# test_package 中自带的测试（消费者视角验证, 纯 Python 库用 Python 脚本）
test_package_tests:
  - file: test_rapt_ble.py
    description: "消费者测试（L0c）：真实 API（R34）——版本/导出符号/supported()/指标解码（含与 struct.unpack 独立交叉校验）/设备标识/sw_version/非指标广播容错，全部使用上游测试同款 hex 数据，无需 BLE 硬件"
    command: "python3 test_rapt_ble.py <site-packages-dir>"

# 测试断言总数（近似值, 用于质量评估）: 27 条消费者断言 + 7 个上游用例
assertion_count: 27

# ═══════════════════════════════════════════════════════════════════
# 两种执行模式（test_package/conanfile.py 的 test()）
# ═══════════════════════════════════════════════════════════════════
# A. live（真机/本机，见到 ok 的 E212PROBE 行）
#    逐个探测候选解释器，首个能 import 闭包者运行：
#      - test_rapt_ble.py            -> 27/27 消费者断言
#      - 上游 test_package/tests/    -> 7/7 pytest 用例
#    见运行时日志 HMBS_TEST_PACKAGE_RESULT / HMBS_UPSTREAM_TEST_RESULT。
#
# B. elf-static-fallback-e212（CI worker：hmmac 拒用户路径 .so 的 dlopen）
#    每个候选解释器输出一行 E212PROBE 证据（含 loader 报错尾部）；
#    全部被拒且 os==OHOS 且报 Permission denied 时，改做 8 项静态产物校验：
#      闭包 import 目录 / dist-info 计数（自包含）/ .so 数量 / ELF 魔数 /
#      .codesign / cpython 扩展 PyInit_<mod> / 动态串含 libc|libc++|libpython /
#      rapt_ble-0.1.2.dist-info/METADATA 的 Name+Version。
#    标记如实区分：HMBS_TEST_PACKAGE_RESULT.mode = "static-elf-verify-e212"，
#    HMBS_UPSTREAM_TEST_RESULT.status = "blocked_e212"（passed/executed 记 0，
#    不伪造 live 计数）。live 计数 27/7 已在真机 conan create 实测通过。
#    任一项静态校验失败 -> raise（conan test 非零退出），
#    site-packages/rapt_ble 缺失 -> 探测前先 raise（保住 CI 破坏性负测 L1e/R34）。
# 背景: 知识条目 E212 / E219 / E502；已合并同型先例 cccolutils 1.5、nanobind 2.13.0、
#       pillow 10.4.0、jupyter-events 0.12.0。
# 知识沉淀: DRAFT-rapt-ble-0.1.2-native-wheel-closure-e212-probe-fallback（knowledge/drafts/）

