# 版本级 manifest — rapt-ble 0.1.2
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.2"
software: "rapt-ble"

# 编译状态（R29：conan_verify 通过后才可标 published；当前为未提交工作树，标 built）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub 官方 tag archive，含上游 tests/ 目录；PyPI sdist 不含测试）
  # 注意 tag 前缀为 "v"（v0.1.2），无 v 的 .tar.gz 会 404
  url: "https://github.com/sairon/rapt-ble/archive/refs/tags/v0.1.2.tar.gz"
  # 源码校验和
  sha256: "a5910820d3a2b6aab0cd01d306d442793977f61f11f7e5e276edfd0d6d7ebb28"
  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（纯 Python / poetry-core，由 pip 完成安装）
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）
  # 运行时 Python 依赖 bluetooth-data-tools / bluetooth-sensor-state-data /
  # home-assistant-bluetooth / sensor-state-data（及其闭包 habluetooth、bleak、
  # cryptography、cffi 等）未发布为 conan 配方
  # （conan download <dep>/* --only-recipe 针对 ohpcd remote 确认全部
  # "no matching recipe references"），
  # 由 pip install 从配置的 pypi.cnb.cool 镜像解析（同已合并的 airthings-ble 1.2.0、
  # aiven-client 先例）。
  dependencies: []

  # 编译器（纯 Python 包，无 C/C++ 编译单元；此处保留 profile 默认值以保持一致）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "PyPI sdist 不含 tests/ 目录，为接入上游 pytest 套件须使用 GitHub 官方 tag archive 作为源码（rapt-ble 的 tag 名带 'v' 前缀：v0.1.2） (ref: DRAFT-rapt-ble-0.1.2-pypi-sdist-no-tests-github-tag-archive)"
  - "纯 Python 库运行时依赖未发布为 conan 配方时，由 pip install . 从 pypi.cnb.cool 镜像自动解析（airthings-ble/aiven-client 先例），配方不声明 requires (ref: DRAFT-VENDP-PUREPY-DEP-CLOSURE)"
  - "pip install --prefix 在构建机已装有同名依赖时会判定 Requirement already satisfied 而跳过安装（本机 /usr/local/lib/python3.12/site-packages 已有 cffi/cryptography/pycparser），产物不自包含、本地假绿；加 --ignore-installed 强制整棵依赖闭包解析进 staging 前缀，并用干净 venv 验证自包含 (ref: DRAFT-rapt-ble-0.1.2-pip-prefix-skip-satisfied-deps-not-self-contained)"
  - "pypi.cnb.cool 镜像为 OHOS aarch64 提供了原生 wheel（cffi 落盘为 _cffi_backend.cpython-312-aarch64-linux-ohos.so），纯 Python 包可完整离线自包含 (ref: DRAFT-rapt-ble-0.1.2-pip-prefix-skip-satisfied-deps-not-self-contained)"
  - "init-build 的嵌套源码提升会把含 Makefile 的 docs/ 误当源码根（本包与 chardet 同型），须手工 tar --strip-components=1 重建 .orig/.work 后按 Python 包配方走 pip install 路径 (ref: E466)"
  - "pip staging 的 python-require 配方闭包含 OHOS 原生 wheel 时（本包 14 个 .so），CI worker 的 hmmac 会拒每个解释器对该用户路径 .so 闭包的 dlopen（E212/E502，与 .codesign 无关；本地真机绿、CI 红）；test_package 须逐解释器探测（每候选一行 E212PROBE 证据）→ 静态产物校验回退（mode=static-elf-verify-e212，上游 blocked_e212，不伪造 live 计数），并在 site-packages/rapt_ble 缺失时先 raise 以保住 R34/L1e 负测 (ref: DRAFT-rapt-ble-0.1.2-native-wheel-closure-e212-probe-fallback)"
