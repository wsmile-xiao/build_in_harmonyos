# 版本级 manifest
# 文件位置: archives/r/readstat/1.1.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "1.1.9"

software: "readstat"

# 编译状态
# published 仅在合并后 release upload 已确认时使用（AGENTS §1 O5）
# published | built | failed | archived
status: built

build_date: "2026-09-26"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/WizardMac/ReadStat/archive/refs/tags/v1.1.9.tar.gz"
  sha256: "89af7c785a7ae3d9a7af6e64a69028829a429f66a14b1b913be22816dc07ddca"
  tar_format: "tar.gz"

# ============================================================
# 构建配置
# ============================================================

build:
  system: "autotools"

  # 上游 tag 归档不含 configure，配方在 build() 内 autoreconf -fi 生成
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"

  # 编译依赖（zlib 为上游可选依赖，因 make check 覆盖 ZSAV 读写而显式启用）
  dependencies:
    - "zlib/1.3.1.1"

  # 构建期工具依赖（tool_requires）
  tool_dependencies:
    - "automake/1.18"
    - "libtool/2.5.4"
    - "gettext/0.22.5.1"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无补丁文件：HMDFS 临时目录族与 clang -Wstrict-prototypes 均为构建期
# 环境处理（configure 字符串归一 + CFLAGS 追加），不改上游源码
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 全程四类错误均命中既有引擎条目（E063/E007/E129/E337），按 §3.8 不新建草稿
knowledge_gained:
  - "clang 15 默认开启 -Wstrict-prototypes，上游 Makefile.am 目标级 -Werror 会把 foo() 形参空表声明判成 error；按既有条目精准追加 CFLAGS=-Wno-strict-prototypes，不改上游源码 (knowledge_ref: knowledge/doc/E063.md)"
  - "上游 tag 归档不含 config.guess/config.sub（由 automake --add-missing 在 autoreconf 时落入），无文件可打补丁 → 只能显式 --build/--host=aarch64-unknown-linux-gnu (knowledge_ref: knowledge/doc/E007.md)"
  - "HMDFS 上 config.status 的 umask 077 与 mktemp -d ./confXXXXXX 落成 2700 目录导致 subs1.awk Permission denied → 构建期归一为 umask 022 与 ${TMPDIR:-.} (knowledge_ref: knowledge/doc/E129.md)"
  - "autoreconf 需要 gettext 的 iconv.m4（AM_ICONV）与 libtoolize 的 _lt_pkgdatadir，二者由 tool_requires 的 ACLOCAL_PATH/buildenv 自动带出 (knowledge_ref: knowledge/doc/E337.md)"
  - "make check 覆盖 ZSAV 写读往返，zlib 必须显式 requires 否则上游测试真实失败 (knowledge_ref: test_package/MANIFEST.yml)"
