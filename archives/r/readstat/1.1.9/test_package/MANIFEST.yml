# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: readstat/1.1.9
homepage: "https://github.com/WizardMac/ReadStat"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# 来源: Makefile.am 的 `TESTS = test_readstat test_dta_days test_sav_date
#       test_double_decimals`（check_PROGRAMS 同四项），源码在 src/test/。
upstream_tests:
  - file: test_readstat.c
    source: readstat-1.1.9/src/test/test_readstat.c
    description: "核心写读往返套件：读取 src/test/test_list.h 的 19 组 / 99 条注册用例，逐条按 (行偏移×行上限) 2 组参数 × 命中的文件格式位执行写→读比对（loop_mask=0x7fffff），合计 1352 次写读往返"
    command: "./test_readstat"
  - file: test_dta_days.c
    source: readstat-1.1.9/src/test/test_dta_days.c
    description: "Stata 日期<->天数转换：1600-01-01..2049-12-31 共 164360 个日期往返 + 4 个非法输入负例 = 164364 次断言"
    command: "./test_dta_days"
  - file: test_sav_date.c
    source: readstat-1.1.9/src/test/test_sav_date.c
    description: "SPSS 日期<->double 转换：1582-10-14..2049-12-31 共 170648 个日期往返 + 2 个定点值 + 1 个负例 = 170651 次断言（每 1000 条打印一行，实测日志 170 行）"
    command: "./test_sav_date"
  - file: test_double_decimals.c
    source: readstat-1.1.9/src/test/test_double_decimals.c
    description: "double_decimals() 小数位判定 11 条 EXPECT_DECIMALS 断言"
    command: "./test_double_decimals"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接已打包的 libreadstat + <readstat.h>，校验解析器生命周期、sav/dta/sas7bdat 三个解析入口对缺失文件返回 READSTAT_ERROR_OPEN（拒绝假绿）、以及 3 条错误码->消息映射，共 7 条断言"
    command: "./test_readstat"

# 测试断言总数 (近似值, 用于质量评估)
# = test_readstat 1352 次写读往返 + test_dta_days 164364 + test_sav_date 170651
#   + test_double_decimals 11 = 336378（automake 层为 4 个测试程序）
assertion_count: 336378
