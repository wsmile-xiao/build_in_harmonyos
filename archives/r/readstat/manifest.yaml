# 软件级 manifest
# 文件位置: archives/r/readstat/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: readstat
display: "ReadStat"
description: "读取与写入 SAS/Stata/SPSS 统计数据文件的 MIT 许可 C 库与命令行工具集"
category: data
homepage: "https://github.com/WizardMac/ReadStat"
license: MIT

# 常用构建系统（可被版本级覆盖）
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "config.guess 不认识 uname=HarmonyOS，须显式 --build/--host=aarch64-unknown-linux-gnu"
    - "GitHub tag 归档不含 configure，须 autoreconf -fi；ACLOCAL_PATH 必须含 gettext 的 share/aclocal（AM_ICONV/iconv.m4）与 libtool 的 _lt_pkgdatadir"
    - "HMDFS 临时目录族：configure 内 umask 077 / mktemp -d ./confXXXXXX 归一为 022 / ${TMPDIR:-.}（E011 同族）"
    - "clang 15 默认开启 -Wstrict-prototypes，叠加上游 -Werror 会拦下 foo() 形参空表声明，须 CFLAGS 追加 -Wno-strict-prototypes"
    - "make check 覆盖 ZSAV 读写，必须启用 zlib，否则上游测试真实失败"
  common_dependencies:
    - zlib

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.1.9":
    status: built
    build_date: "2026-09-26"
    conan_ref: "readstat/1.1.9"
