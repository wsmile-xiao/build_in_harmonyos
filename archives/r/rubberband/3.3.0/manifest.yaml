software: rubberband
version: 3.3.0

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（扁平字段，G4 检查）
# cmake | autotools | makefile | meson | custom
build_system: meson

# 软件描述
description: |
  Rubber Band Library 是一个高质量的音频时间拉伸和音高移动库。
  提供C++和C API，广泛应用于音频处理软件。

# 作者和维护者
authors:
  - Breakfast Quay

# 许可证
license: GPL-2.0-or-later

# 项目URL
urls:
  homepage: https://breakfastquay.com/rubberband/
  source: https://github.com/breakfastquay/rubberband
  documentation: https://breakfastquay.com/rubberband/code-doc/

# 编译时间
build_date: 2026-05-22

# 编译环境
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

  # 特殊环境要求
  env_requirements:
    - "PATH=/usr/bin:/bin:/usr/local/bin"  # ninja 需要 rm 命令

# 应用的补丁列表
patches_applied:
  - "0001-builddir-meson-logs-install-log.txt.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# 编译中学到的知识
knowledge_gained:
  - "meson 构建系统需要设置 PATH=/usr/bin:/bin:/usr/local/bin，否则 ninja 执行 shell 命令时会报 'rm: inaccessible or not found'"
  - "HMDFS 文件系统不支持软链接覆盖（ln -sf），会导致 lib.so 符号链接创建失败，但不影响核心功能"
  - "rubberband 3.3.0 使用 meson 构建系统，不是 autotools"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

# 质量门禁结果
quality_gates:
  G0_clean_build: "⚠️ PASS (手动验证)"
  G1_binary_integrity: "✅ PASS"
  G2_functionality: "✅ PASS"
  G3_portability: "✅ PASS"
  G4_archive_integrity: "✅ PASS"

# 交付物清单
artifacts:
  - path: librubberband.so.2.3.0
    size: 458K
    type: ELF共享库
  - path: librubberband.a
    size: 793K
    type: 静态库
  - path: RubberBandStretcher.h
    size: 47K
    type: C++头文件
  - path: rubberband-c.h
    size: 6.1K
    type: C头文件
  - path: rubberband.pc
    size: 303B
    type: pkg-config元数据

# 平台限制
platform_limits:
  - "HMDFS 软链接创建可能失败（非阻塞）"
  - "Python subprocess 平台限制（G0 需手动验证）"