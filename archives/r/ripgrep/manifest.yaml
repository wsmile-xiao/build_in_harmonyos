software: ripgrep
# 软件级 manifest 模板
# 文件位置: archives/r/ripgrep/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: ripgrep

# 软件描述
description: ripgrep is a line-oriented search tool that recursively searches your current directory for a regex pattern. By default, ripgrep will respect your .gitignore and automatically skip hidden files/directories and binary files.

# 软件分类
# development | system | network | library | utility | security | multimedia
category: utility

# 软件官网
homepage: https://github.com/BurntSushi/ripgrep

# ============================================================
# 版本索引（关键！）
# ============================================================

# 已编译版本列表
# 格式: version: status
versions:
  "15.1.0": built

# ============================================================
# 依赖信息
# ============================================================

# 运行时依赖（用户安装时需要）
runtime_dependencies: []
# 例如:
# - openssl/1.1.1w
# - zlib/1.3.1

# 编译时依赖（编译时需要）
build_dependencies:
  - rust/1.95.0

