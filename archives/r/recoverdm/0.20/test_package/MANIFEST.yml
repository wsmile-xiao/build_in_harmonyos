# test_package/MANIFEST.yml — recoverdm 0.20
# CI L0e requires this file to exist.  Upstream test inventory is 0 (evidence
# below), so the consumer side carries all assertions.

package: recoverdm/0.20
homepage: "https://www.vanheusden.com/recoverdm"

# ---- 上游测试清点（R51 第一步：静态清点证据）------------------------------
# orig tarball 全部内容 15 个文件：Makefile、6 个 .c、5 个 .h、license.txt、
# readme.txt、recoverdm.1（0.20 里是 0 字节空文件）。
# 裸 Makefile 的目标只有：all / recoverdm / mergebad / install / clean / package
#   => grep -E '^(test|check|installcheck):' Makefile 无命中（0 个测试目标）
#   => 无 tests/ 目录、无 *.t / *test*.c、无 ctest/pytest 注册项
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游不存在任何自动化测试程序（静态清点结果，非"没去找"）
upstream_tests: []

# ---- test_package 消费者测试（R34：真实执行被打包的二进制）----------------
test_package_tests:
  - file: test.sh
    description: "25 条断言（实跑读数 25/25，见 reports/conan-create.log:121）：两枚二进制可从包内 bin/ 解析并执行；recoverdm -V 版本横幅（含 Makefile -DVERSION 注入正确的间接证据）与 -h 用法（rc=0）、无参数 rc=255；真实跑一次 recoverdm -t 1（FILE 类型）普通文件恢复并 cmp 逐字节一致 + rc=0 + 日志 Done（CR 归一后判）；mergebad -h rc=0 与无参数 rc=10 守卫；真实跑一次 mergebad 双镜像合并（坏块表 mapA=[1024,1536)、mapB 边界块）断言输出 4096B 且 [0:1024) 全取镜像 A、[1024:4096) 全取镜像 B"
    command: "bash test.sh"

# ---- 未覆盖面与原因（不编造覆盖）------------------------------------------
not_covered:
  - "裸盘/分区恢复路径（-t 10..19 FLOPPY/CDROM/DVD/DISK IDE 与 SCSI 类型、-r RAW 重试、-s 转速）：需要真实坏道介质或 root 权限的 loop 设备，HarmonyOS PC 构建主机不具备；上游亦无可用于该路径的夹具"
  - "recoverdm -l 坏扇区清单的下游消费链：需要一个真读失败的输入，本机无法伪造（伪造输入等于伪造测试）"

# 断言总数（test.sh 逐条计数；实跑读数 25/25，见 reports/conan-create.log:121）
assertion_count: 25
