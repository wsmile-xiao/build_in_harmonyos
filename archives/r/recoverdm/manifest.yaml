# recoverdm 软件级 manifest
# 文件位置: archives/r/recoverdm/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: recoverdm
display: "recoverdm"
description: "Recover data sector-by-sector from disks/CD/DVDs/images with bad sectors (incl. mergebad)"
category: system
homepage: "https://www.vanheusden.com/recoverdm"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "裸 Makefile（无 configure、无 test 目标），产物只有 recoverdm + mergebad 两枚可执行文件；零第三方依赖，只用系统 libc"
    - "Makefile 从不给 CC 赋值 ⇒ GNU make 内建默认 cc，OHOS 无该别名 ⇒ make: cc: No such file or directory (Error 127)；修法：make 命令行覆盖 CC（值取 conan conf tools.build:compiler_executables，R33），零补丁"
    - "上游 CFLAGS 用裸 = 赋值且内含 -DVERSION=\\\"$(VERSION)\\\" ⇒ 命令行覆写 CFLAGS 会整体替换掉版本宏（实测报 recoverdm.c:22: error: expected ')'）；配方刻意只覆写 CC"
    - "install 目标把文件 cp 到烧死的 /usr/local/bin，无 PREFIX/DESTDIR/install 命令变量 ⇒ 配方不调用 make install，直接 copy 到 package_folder/bin"
    - "上游 recoverdm.1 手册页在 0.20 orig tarball 中是 0 字节空文件 ⇒ 不安装手册页"
    - "上游无任何自动化测试（无 tests/ 目录、Makefile 无 test/check 目标）⇒ 消费者测试以真实执行两枚二进制为准（含 -t 1 普通文件恢复逐字节一致、mergebad 双镜像合并取块正确）"
  common_dependencies: []

versions:
  - version: "0.20"
    status: built
    build_date: "2026-09-25"
    patches: 0
    notes: "路径 A 适配 + 路径 B（裸 Makefile 未赋值 CC ⇒ make 内建 cc 在 OHOS 不存在，取用 B 池件 M18）；零补丁、零第三方依赖"
    conan_ref: "recoverdm/0.20"
