# conandata.yml - rnnoise 0.2
# 官方源: GitHub release (xiph/rnnoise, tag v0.2) 的 dist tarball（make dist 产物）。
# ⚠️ gitlab 的 /-/archive 快照 tarball 缺少构建期生成文件 src/rnnoise_data.{c,h}
# （由 download_model.sh 从 media.xiph.org 拉取模型生成），make 会因此失败；
# 本 release tarball 已包含生成的 configure / package_version / rnnoise_data.{c,h}。

sources:
  url: "https://github.com/xiph/rnnoise/releases/download/v0.2/rnnoise-0.2.tar.gz"
  sha256: "90fce4b00b9ff24c08dbfe31b82ffd43bae383d85c5535676d28b0a2b11c0d37"

patches:
  - patch_file: "patches/0001-add-missing-os_support-header.patch"
    patch_description: "Add src/os_support.h, referenced by src/vec.h (generic path) and src/vec_neon.h (ARM/NEON path) but absent from git and from the release tarball (not listed in Makefile.am noinst_HEADERS, so make dist drops it). Without it aarch64/NEON builds fail with \"vec_neon.h:35: fatal error: 'os_support.h' file not found\". Content restored from Opus celt/os_support.h (same BSD-3-Clause license), adapted to rnnoise header names."
    patch_type: "portability"