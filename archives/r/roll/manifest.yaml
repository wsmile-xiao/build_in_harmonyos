# 软件级 manifest — roll
software: roll
display: "roll"
description: "命令行骰子工具：用直观表达式模拟掷骰（1d6、4d6h3/4d6l3、4d6HX/LX、1d%、dF、1d6x10、> >= < <= != 条件筛选、逗号分隔、N{} 重复组、-s 系列求和、-p 只保留正数）"
category: utility
homepage: "https://github.com/matteocorti/roll"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "零第三方依赖；autotools 工程（roll.c + parser.y + scanner.l），dist 归档自带生成的 configure/parser.c/scanner.c，无需 flex/bison"
    - "1 个平台兼容补丁（0001-configure.patch）：HMDFS 上 umask 077 创建的临时目录不可写（setgid + UID 重映射），去掉 config.status 临时目录创建处的 umask 077（单处两行、无平台宏；回退 mkdir 同步补 2>/dev/null；E011/E114 标准解法）"
    - "上游 make check（3 个 TAP 脚本 / 15 条确定性断言）在 build() 中完整执行并三重强校验（退出码 0 + 'All 3 tests passed' + 15 行断言计数），失败即中止构建，用例零修改"
    - "autotools.make(args=[-j1])：与上游 serial-tests 一致、测试日志可复现；编译器/标志全来自 Conan toolchain"
    - "package() 走上游 make install（install-sh 在 OHOS 可用），交付 bin/roll + man 页 + bash 补全 + licenses/COPYING"
  common_dependencies: []

versions:
  "2.7.0":
    status: built
    build_date: "2026-09-20"
    conan_ref: "roll/2.7.0"
