# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）

package: roll/2.7.0
homepage: "https://github.com/matteocorti/roll"

# 上游测试命令（autotools 标准回归入口；configure.ac AC_REQUIRE_AUX_FILE tap-driver.sh）
upstream_check_command: "make check"

# conanfile.py build() 是否已集成上游测试：是（任何偏差都中止构建）
upstream_test_in_build: true
upstream_test_command: "timeout -k 5 600 make -j1 check"
upstream_test_enforcement: >-
  配方在 build() 中真实执行 `make check` 并捕获日志：要求退出码 0、automake 总结行
  "All 3 tests passed"，且 15 条 "Testing '<表达式>' = <期望>" 断言行一条不少；
  600 秒 timeout 使回归（挂起）以干净诊断失败而不是卡死构建（R9/R51）。

# 上游实际运行的测试程序（3 个 TAP 脚本，共 15 条 test_expression 断言；
# 全部走 ./roll --test，结果确定性固定：每颗骰子恒为 3）
upstream_tests:
  - file: tests/dices.test
    source: roll-2.7.0/tests/dices.test
    description: >-
      6 条断言：1d6=3、1d10=3、1d%=33（双 d10：十位 3、个位 3）、1DF=1（Fudge，
      roll(3)-2）、d10X=9（1d10×1d10）、42d0=0（零面骰合法）
    command: "make check"
    upstream_total: 6
    executed: 6
    passed: 6
    blocked: 0
    status: "PASS —— OHOS 设备实测 6/6"
  - file: tests/operations.test
    source: roll-2.7.0/tests/operations.test
    description: >-
      5 条断言：1d6 + 1=4、1d10-1=2、1d%*2=66、2D6/2=3（向上取整）、1d6x10=30
    command: "make check"
    upstream_total: 5
    executed: 5
    passed: 5
    blocked: 0
    status: "PASS —— OHOS 设备实测 5/5"
  - file: tests/special.test
    source: roll-2.7.0/tests/special.test
    description: >-
      4 条断言：4d6h3=9（保留最高 3）、4d6l3=9（保留最低 3）、4d6LX=9（丢弃最低）、
      4d6HX=9（丢弃最高）
    command: "make check"
    upstream_total: 4
    executed: 4
    passed: 4
    blocked: 0
    status: "PASS —— OHOS 设备实测 4/4"

# R51 上游测试清点证据（适配前申报）
upstream_test_inventory:
  tests_directory: true
  makefile_am_tests: true
  makefile_am_check_programs: false
  configure_test_options: 0
  make_check_cases: 3
  evidence:
    - "解压树（官方 release 归档）tests/ 目录 4 个文件：dices.test / operations.test / special.test（可执行的 POSIX sh 脚本）+ test_functions.sh（断言辅助）；tests/ 目录内无其他文件"
    - "Makefile.am 显式声明 TESTS = tests/dices.test tests/operations.test tests/special.test 与 TEST_LOG_DRIVER（tap-driver.sh，TAP 输出），AUTOMAKE_OPTIONS = serial-tests"
    - "configure.ac 无 --enable-test* 开关；AC_REQUIRE_AUX_FILE([tap-driver.sh]) 只保证 TAP 驱动随包发布"
    - "test_functions.sh 的 test_expression() 逐条执行 ./roll --test <表达式> 并比对整数期望值；--test 使骰子恒为 3，故 15 条断言全部确定性"
    - "make check 实测输出 3 条 PASS + automake 总结 'All 3 tests passed'，15 条 'Testing ' 断言线性执行通过；未修改任何上游用例（R51）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_roll.sh
    description: >-
      21 条断言，真实执行已安装二进制：PATH 上存在 roll；--version 退出码 0 且恰打印
      "roll 2.7.0"；--help 退出码 0 且宣传 --test；1d6=3；保留/丢弃算子 4d6h3=l3=HX=LX=9；
      1d%=33；1DF=1；算术 + - * /（向上取整）与 x10；42d0=0；-s 输出 "6 / sum: 6"；
      3{1d6} 重复组输出三个 3；-s 重复组最终 sum: 9；-v 打印 "d6 -> 3" 轨迹；无 --test
      时随机路径输出 1..6 的整数；-p 保留表达式值 -7 但 sum 截为 0；6 个负例——不可能
      的筛选 1d6>7、除零 1d6/0、乘法溢出 2000000000*2、保留数超骰数 3d6h5、缺表达式、
      未知符号 1d6? 全部退出码 1 且给出对应诊断
    command: "sh test_roll.sh"

# 测试断言总数（= test_roll.sh 的 [PASS]/[FAIL] 行数）
assertion_count: 21
