# 知识沉淀
knowledge_gained:
  - "dist 归档自带的 configure/config.status 用 `umask 077 && mktemp -d ./confXXXXXX`（回退 `umask 077 && mkdir`）创建临时目录；HMDFS 强制 setgid 并重映射属主 UID，得到的 drwx--S--- 目录连属主都不可写，config.status 以 `./confXXXXXX/subs1.awk: Permission denied` / 'could not setup config files machinery' 失败（configure 阶段本身能过，失败发生在 configure 结束前自动执行的 config.status 里）。单处去掉 umask 077（回退 mkdir 同步补 2>/dev/null）后 configure/make/make check 全绿；本仓库 948 个 autotools 归档采用同一解法（E011/E114）"  # knowledge_ref: E011/E114（HMDFS 上 config.status 临时目录 umask 修正，本仓库 948 例同型）
  - "roll 的 --test 开关把每颗骰子恒定为 3，故上游 15 条 test_expression 断言完全确定性；消费者测试可复用同一开关做无随机性断言，随机路径另用 1..6 区间断言验证"  # knowledge_ref: notes.md#验证结果（--test 确定性语义与断言口径）
  - "上游 make check 的 automake 总结行为 'All 3 tests passed'（3 个 TAP 脚本），且日志含 15 行 \"Testing '<表达式>' = <期望>\"；配方据此三重强校验（退出码 0 + 总结行 + 15 行计数），任一条缺失即中止构建（R9/R51）"  # knowledge_ref: R51 上游测试三步法 + notes.md#验证结果（三重强校验）
  - "GitHub release 资产从设备侧直连 objects.githubusercontent.com 会超时（国内网络），但 api.github.com / codeload 可达；本次通过官方 digest（GitHub release API 给出的 sha256）校验镜像下载字节，确保与官方资产逐字节一致，conandata.yml 仍只引用官方 URL"  # knowledge_ref: E406（创建期哈希多路径交叉验证）/ E017（镜像通道）

