# conandata.yml — roll 2.7.0
# 上游官方源码：GitHub release 资产 roll-2.7.0.tar.gz（上游 make dist 归档，
# 自带生成的 configure / parser.c / scanner.c，无需 flex/bison）。
# sha256 为下载实测值，与 GitHub release API 公布的本资产 digest 完全一致。
# 注意：本文件注释中不得出现 sources.url 的前缀型 URL——CI 预下载阶段会把文件里
# 任意 http(s) 文本改写成本地缓存路径（详见同团队 looktxt/1.4.1 的教训）；项目
# 主页在软件级 README.md 中给出。

sources:
  url: "https://github.com/matteocorti/roll/releases/download/v2.7.0/roll-2.7.0.tar.gz"
  sha256: "9e116501aaa0c8f954d31a86e8cf6dee5d98ee35a5e8e5b025646c4bee741533"

patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: "0001 configure drop umask 077 from the config.status helper tmp-dir creation (HMDFS setgid + owner UID remap make the drwx--S--- directory unwritable even for its owner, so config.status dies with 'subs1.awk: Permission denied' / 'could not setup config files machinery'; the fallback mkdir also gets 2>/dev/null like the mktemp branch; E011/E114 standard workaround, no platform macro)"
    patch_type: "portability"
