knowledge_gained:
  - "XFCE libraries (libxfce4ui, libxfce4util, xfconf, exo) not available on HarmonyOS NEXT"
  - "Created xfce_compat stub layer to provide minimal implementations of XFCE functions"
  - "xfconf_init() returns FALSE so xfconf_disabled=TRUE in settings.c, xfconf code paths never executed"
  - "libxfce4ui functions replaced with GTK3 equivalents"
  - "libxfce4util XfceRC replaced with GKeyFile-based implementation"
  - "config.status needs umask 022 on HMDFS filesystem"
  - "Must add -I${top_srcdir}/src to CFLAGS so stub XFCE header directories are found"
  - "NLS disabled on HarmonyOS NEXT — need #define _(String) fallback"