# 软件级 manifest — rio
# 遵循 ARCHIVE-SPEC v2.0

software: rio
display: "rio"
description: "Diamond Rio PMP300 便携 MP3 播放器的命令行管理工具（并口协议）"
category: utility
homepage: "https://packages.debian.org/source/rio"
license: GPL-2.0-only
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 makefile 项目（1999 年发布，无 configure、无 make check/test 目标），源码共 20 个文件"
    - "LP64 正确性：协议用的 32 位整数被 typedef 成 long（SIGNED32/UNSIGNED32），aarch64 上 long=64 位会使 CDirHeader 由 512 变 516 字节；必须改 int/unsigned int，并用 static_assert 锁定 512/128/16 字节布局"
    - "OHOS（musl）没有 <sys/perm.h>（x86 专有）与 <asm/io.h>；<sys/io.h> 存在但为空壳，故不能用 __has_include 判断端口能力，必须按架构（__i386__/__x86_64__）分支"
    - "aarch64 无 ISA I/O 端口空间：端口访问改用可移植的 /dev/port 字节流接口（pread/pwrite，偏移=端口号），x86 保留 ioperm/outb/inb"
    - "sys_errlist[] 已被 glibc(>=2.32)/musl 移除，改用 strerror(errno)；<values.h> 已被 glibc 2.30 移除"
    - "LP64 下 printf 可变参数必须严格匹配类型（%ld/%08lx 配 int 是未定义行为），源码有 6 处"
    - "上游 makefile 硬编码 g++ 并 chmod +s 设置 setuid root；HarmonyOS 拒绝 setuid，改为 $(CXX)/$(CXXFLAGS)"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.07":
    status: published
    build_date: "2026-09-29"
