# conandata.yml — rio 1.07
# 源码来源：Debian 源码归档 rio_1.07.orig.tar.gz（原作者 1999 年发布后上游站点已失效，
# Debian pool 保存的是未改动的 pristine orig 源码包）。
sources:
  url: "https://deb.debian.org/debian/pool/main/r/rio/rio_1.07.orig.tar.gz"
  sha256: "e0426cd1dc90acb1aae6a647f5e65168c345fc262456a47dba5ff1a2cae1ab6b"

patches:
  - patch_file: "patches/0001-app.cpp.patch"
    patch_description: "Remove the deprecated <values.h>/kernel-internal <linux/limits.h> includes and fix the LP64-invalid printf conversion specifiers (%-5hd/%08lx/%ld with int arguments)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "Add the missing configure wrapper: upstream only ships a plain makefile, the wrapper records --prefix in config.mk so that ./configure && make && make install works"
    patch_type: "portability"
  - patch_file: "patches/0003-makefile.patch"
    patch_description: "Honour the standard $(CXX)/$(CXXFLAGS) variables, add an install target and drop the setuid 'chmod +s' (HarmonyOS refuses setuid executables)"
    patch_type: "portability"
  - patch_file: "patches/0004-rio.cpp.patch"
    patch_description: "Provide a portable port I/O backend: keep ioperm()/inb()/outb() on x86, use the byte-stream interface of /dev/port on architectures without ISA I/O port space (aarch64/OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0005-rio.h.patch"
    patch_description: "Keep SIGNED32/UNSIGNED32 exactly 32 bit wide on LP64 systems and assert the serialised structure layout at compile time"
    patch_type: "portability"
  - patch_file: "patches/0006-std.h.patch"
    patch_description: "Replace the removed sys_errlist[] array with the portable strerror() accessor"
    patch_type: "portability"
