# test_package/MANIFEST.yml — rio 1.07
# CI L0e 要求此文件存在；R51 上游测试三步法：清点 -> 运行 -> 如实回填

package: rio/1.07
homepage: "https://packages.debian.org/source/rio"

# ── 上游测试清点结论（R51 第一步）─────────────────────────────
# rio 1.07（1999 年，The Snowblind Alliance）**没有任何自动化测试**：
#   * 源码包内无 tests/ 或 test/ 目录（唯一目录就是源码根目录）；
#   * makefile 只有 all / rio / clean 三个目标：
#       $ make -n check  -> make: *** No rule to make target 'check'.  Stop.
#       $ make -n test   -> make: *** No rule to make target 'test'.  Stop.
#   * 无 configure / CMakeLists.txt / ctest / pytest 注册；
#   * README 的 "Building and running" 一节只描述四个平台的编译方法，
#     不提供任何测试命令；
#   * 该工具的全部功能都需要真实并口连接的 Diamond Rio PMP300 播放器。
# 上游真实可用的"测试入口"= 无参数运行 rio 打印的用法/默认值，
# 以及 -p / -d / -o / -dr 等参数解析路径（本适配在 test.sh 中实跑）。
upstream_check_command: "make -n check / make -n test （两者均无此目标）"
upstream_test_in_build: false
upstream_test_command: ""

# 上游源码包内不存在任何测试程序
upstream_tests: []

# ── test_package 自带测试（消费者视角，全部真实执行包内二进制）──
test_package_tests:
  - file: test.sh
    description: "功能测试（6 条断言）：版本横幅、用法表 15 个开关、默认端口 0x378 与默认延时 20000/100/2、未知选项回退 help、-p 0x278 自定义端口基址、引号参数 -o \"5 4 3 2 1\" -d -dr 4 解析"
    command: "bash test.sh <pkg>/bin/rio"
    assertions: 6
  - file: test_ohos.sh
    description: "鸿蒙特有测试（15 条断言）：平台身份(HarmonyOS/aarch64)、ELF64/LP64、AArch64、PIE、musl 解释器 /lib/ld-musl-aarch64.so.1、无 glibc 专有 NEEDED、.note.ohos.ident 段、无 ISA I/O 端口空间时优雅降级、strerror() 诊断文案、自定义端口基址降级、/dev/port 端口后端正向路径（RIO_PORT_DEVICE 测试替身）与端口偏移写语义(0x378/0x37a)、任意 cwd 可运行、包载荷完整"
    command: "bash test_ohos.sh <pkg>"
    assertions: 15

# 测试断言总数 = 功能 6 + 鸿蒙特有 15
assertion_count: 21

# 其中鸿蒙平台特有测试用例数（ELF/ABI、musl/OHOS 标记、无 ISA 端口空间的降级与
# 端口字节流后端的真实读写语义等）
ohos_specific_assertions: 15

# 补充说明（R51 第三步：如实回填，不冒充上游覆盖）
notes: >
  上游 1.07 交付物中不存在可执行的自动化测试，故"上游测试统计"为 0/0；
  test_package 的 6 条功能断言与 15 条鸿蒙特有断言均为本适配新增的平台/消费者
  验证，不冒充上游覆盖。rio 的核心协议逻辑（32 位目录结构、块校验和、并口
  时序）需要真实 Diamond Rio PMP300 硬件，CI 环境无法构造，已在 reports/
  中说明。LP64 下的 32 位协议结构尺寸（CDirHeader=512 / CDirEntry=128 /
  CEnd512ByteBlock=16 字节）由 rio.h 中的 static_assert 在 conan create 编译期
  强制校验——这是本次适配的核心正确性保证，编译通过即该项成立。
