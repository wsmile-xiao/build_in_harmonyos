# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "LP64 关键缺陷：上游把协议用的 32 位整数 typedef 成 long/unsigned long（SIGNED32/UNSIGNED32），在 aarch64 上 long 为 64 位，导致序列化目录结构 CDirHeader 从 512 字节变成 516 字节、校验和与并口数据全错。改为 int/unsigned int，并用 static_assert 在编译期锁定 512/128/16 字节布局（ref: DRAFT-isoqlog-2.2.1-pointer-stored-through-int-lp64）"
  - "OHOS libc（musl）没有 <sys/perm.h>（x86 专有）与 <asm/io.h>，sys/io.h 虽存在但为空壳（bits/io.h 为空），ioperm()/inb()/outb() 全部未声明——因此不能用 __has_include(<sys/io.h>) 判断端口能力，必须判架构（__i386__/__x86_64__）（ref: DRAFT-rio-1.07-non-x86-isa-port-io-dev-port-backend）"
  - "aarch64 没有 ISA I/O 端口空间，x86 的 outb/inb 内联汇编不可能编译；可移植替代是 /dev/port 的字节流接口（pread/pwrite，偏移=端口号），并让设备路径可用 RIO_PORT_DEVICE 注入，使该后端在无端口设备的机器（含 CI）上仍可被真实执行与断言（ref: DRAFT-rio-1.07-non-x86-isa-port-io-dev-port-backend）"
  - "sys_errlist[] 已被 glibc(>=2.32) 与 musl 移除，OHOS 上必须改用 strerror(errno)；<values.h> 亦被 glibc 2.30 移除（OHOS musl 仍提供，但不该依赖）（ref: tevent-0.17.1-musl-strerror-sys-errlist-remap, DRAFT-irpas-0.10-musl-errlist-registry-replace）"
  - "LP64 下 printf 可变参数必须严格匹配：%ld 配 int、%08lx 配 int 都会读到 8 字节（未定义行为），上游 app.cpp 有 6 处此类缺陷（ref: DRAFT-libgal-0.5.0-scanf-long-into-int-lp64-adjacent-zeroing）"
  - "上游 makefile 硬编码 g++ 并以 chmod +s 设置 setuid root（为 ioperm 提权）；HarmonyOS 拒绝 setuid 可执行文件，改为使用 $(CXX)/$(CXXFLAGS) 且不再设置 setuid（ref: E081）"
  - "纯 Makefile 项目无 configure 时，finish 的 G0 clean-verify 会直接执行 ./configure（exit 127）；按仓库既有惯例（progress 0.17 / hints/configure）用补丁补一个 configure wrapper（写入 config.mk）+ makefile 的 install 目标，即可让 configure && make && make install 完整跑通（ref: E097）"
  - "新增文件补丁必须保持 --- /dev/null 形式：OHOS 的 GNU patch 在 --dry-run 下会真实创建 0 字节占位文件污染 .orig 基线，使 refresh-patch 下次生成 --- a/xxx 形式，conan 的 patch_ng 因 strip=0 报 source/target file does not exist。对策：每次 refresh-patch/finish 前删除 .orig 下的占位文件，生成后校验补丁头（ref: E484）"
  - "rio 1.07（1999）无任何自动化测试：makefile 只有 all/rio/clean，make -n check 与 make -n test 均报 'No rule to make target'（ref: E328）"

