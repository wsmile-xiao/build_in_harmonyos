# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: reflect-cpp/0.17.0
homepage: "https://github.com/getml/reflect-cpp"

# 上游测试命令（GoogleTest，CMake 驱动）
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: "cmake -DREFLECTCPP_BUILD_TESTS=ON && cmake --build . && ctest"

# 上游实际运行的测试程序（本机 HarmonyOS aarch64 上实测：generic + json +
# json_c_arrays_and_inheritance 三个套件，184 个测试源文件，193 个 ctest
# 用例全部通过；其余套件依赖未启用的可选第三方后端，未纳入默认构建）
upstream_tests:
  - "tests/generic (35 文件)"
  - "tests/json (142 文件)"
  - "tests/json_c_arrays_and_inheritance (7 文件)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_reflect_cpp.cpp
    description: "L1 官方测试：JSON write/read 往返、std::map、variant 解析、错误上报共 12 项断言"
    command: "./test_reflect_cpp"
  - file: harmonyos_specific_test.cpp
    description: "鸿蒙特有测试：__OHOS__/__aarch64__ 平台宏确认 + Unicode/嵌套容器/u64 边界/错误路径共 15 项断言"
    command: "./harmonyos_specific_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 27
