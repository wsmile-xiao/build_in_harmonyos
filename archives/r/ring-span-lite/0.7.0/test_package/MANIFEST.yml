# test_package/MANIFEST.yml
# 上游官方测试声明文件（ring-span-lite 0.7.0）

package: ring-span-lite/0.7.0
homepage: "https://github.com/nonstd-lite/ring-span-lite"

# 上游测试命令（CMake/CTest 列出测试）
upstream_check_command: "ctest -N"

upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（lest 框架，4 个多标准 CTest 目标）
upstream_tests:
  - file: test/ring-span.t.cpp
    source: ring-span-lite-0.7.0/test/ring-span.t.cpp
    description: "ring_span 核心单元测试（91 个 lest 用例：构造/容量/入队/出队/迭代器/popper/ring）"
    command: "./ring-span-lite-cpp17.t --pass"
  - file: test/ring-span-main.t.cpp
    source: ring-span-lite-0.7.0/test/ring-span-main.t.cpp
    description: "测试主入口与版本/配置信息用例（6 个 lest 用例）"
    command: "./ring-span-lite-cpp17.t --pass"

# test_package 中自带的测试（消费者视角验证，真实调用被测包 API）
test_package_tests:
  - file: test_ring_span_lite.cpp
    description: "消费者测试：验证 ring_span/ring 构造、capacity/size/full、push_back/pop_front、迭代器、数据自有 ring"
    command: "./test_ring_span_lite"

# 测试断言总数（近似，估算值）
assertion_count: 25
