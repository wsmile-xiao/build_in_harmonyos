software: rtmpdump
version: 2.3
status: built
build_date: 2026-05-20
compiler: clang 15.0.4
target: aarch64-unknown-linux-ohos
configure_options:
  - SYS=posix
  - CRYPTO=OPENSSL
  - prefix=/storage/Users/currentUser/usr/local
dependencies:
  - openssl 1.1.1w
  - zlib
products:
  binaries:
    - rtmpdump
    - rtmpgw
    - rtmpsrv
    - rtmpsuck
  libraries:
    - librtmp.so.0
    - librtmp.a
  headers:
    - librtmp/amf.h
    - librtmp/http.h
    - librtmp/log.h
    - librtmp/rtmp.h
patches:
  - 0001-openssl-1.1-handshake.h.patch
  - 0002-openssl-1.1-dh.h.patch
  - 0003-openssl-1.1-hashswf.c.patch
  - 0004-ohos-header-conflict-rtmpsrv.c.patch
  - 0005-ohos-header-conflict-rtmpsuck.c.patch
knowledge_gained:
  - OpenSSL 1.1+ HMAC_CTX opaque structure adaptation
  - OpenSSL 1.1+ DH structure getter/setter functions
  - HarmonyOS header conflict (sockaddr_storage redefinition)
