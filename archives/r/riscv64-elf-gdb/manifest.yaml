software: riscv64-elf-gdb
display: "riscv64-elf-gdb"
description: "GNU GDB 交叉调试器，目标 riscv64-elf 裸机 ABI"
category: build-tool
homepage: "https://www.gnu.org/software/gdb/"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 需添加 HarmonyOS / __OHOS__ 识别（E007）"
    - "19 个 configure 脚本的 umask 077 需改为 022，适配 HMDFS（E011）"
    - "顶层 configure 硬性要求 gmp+mpfr（gdb/ 存在时 require_gmp=yes）"
    - "交叉构建 --target=riscv64-elf，工具自动加 riscv64-elf- 前缀"
    - "test_package 避免 ptrace（E222），用 --version + 加载/反汇编 riscv64 ELF"
  common_dependencies: []

versions:
  "17.2":
    status: built
    build_date: "2026-08-17"
