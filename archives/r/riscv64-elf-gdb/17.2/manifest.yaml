software: riscv64-elf-gdb
version: "17.2"
status: built
build_date: "2026-08-17"
build_system: autotools

source:
  url: "https://ftpmirror.gnu.org/gnu/gdb/gdb-17.2.tar.xz"
  sha256: "1c036c0d72e4b3d1fb5c94c88632add6f9d76f4d7c4d2ea793c12a9f19a3228c"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--target=riscv64-elf"
    - "--build=aarch64-unknown-linux-ohos"
    - "--with-gmp-include=<conan:gmp>/include"
    - "--with-gmp-lib=.dep-archives（staged 目录，build-private 无 .la，缓存零改动）"
    - "--with-mpfr-include=<conan:mpfr>/include"
    - "--with-mpfr-lib=.dep-archives（staged 目录，build-private 无 .la，缓存零改动）"
    - "--with-system-readline"
    - "--with-expat"
    - "--disable-gdbserver"
    - "--disable-sim"
    - "--disable-tui"
    - "--without-python"
    - "--disable-nls"
    - "--disable-werror"
  dependencies:
    - "gmp/6.3.0"
    - "mpfr/4.2.2"
    - "readline/8.3"
    - "expat/2.8.2"
    - "zlib/1.3.2"
  cc: clang
  cxx: clang++

patches_applied:
  - file: 0001-config.guess.patch
    purpose: config.guess 添加 HarmonyOS / __OHOS__ libc 识别（E007）
  - purpose: "19 个 configure 脚本 umask 077 改 022，适配 HMDFS（E011），在 build() 内 glob 替换（flint 先例）"

compatibility:
  level: built
  notes: |
    交叉调试器：riscv64-elf-gdb 运行于 HarmonyOS PC (aarch64)，调试 riscv64-elf
    裸机目标对象。test_package 用 riscv64-elf-gdb --version + set/show architecture
    + maintenance print architecture + show data-directory 验证产物（R34），避免 ptrace（E222）。第 5 项用 clang 交叉编译 test.s → test.elf + gdb 反汇编 _start 验证 ELF 解析/加载/反汇编。

knowledge_gained:
  - "gdb 17.2 顶层 configure 在 gdb/ 存在时硬性要求 gmp+mpfr（require_gmp=yes）"
  - "gdb 17.2 tarball 内 19 个 configure 含 umask 077（比 binutils 2.46.1 多 5 个）"
  - "config.guess 需加 __OHOS__ 与 HarmonyOS uname 分支（E007）"
  - "宿主 clang 的 -fuse-ld=lld 污染 $CC -E stderr，需 CPPFLAGS 加 -Wno-unused-command-line-argument"
  - "musl 把 mallinfo/mallinfo2 作桩提供但不定义 struct，需 ac_cv_func_mallinfo=no 绕过"
  - "--disable-tui 避开 ncurses C++ 冲突（gdb 14.1 先例）"
  - "--without-python 简化构建，避免 Python 3.12 兼容风险"
  - "交叉场景无 riscv64 目标运行时 + 设备无 DejaGNU → upstream_test_in_build: false"
