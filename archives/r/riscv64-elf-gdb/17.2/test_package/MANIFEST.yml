# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）。
# 详见: docs/TEST_QUALITY_SPEC.md

package: riscv64-elf-gdb/17.2
homepage: "https://www.gnu.org/software/gdb/"

# 上游测试命令（gdb 的 gdb/testsuite 子目录带 dejagnu 测试套件）
upstream_check_command: "make check"

# conanfile.py build() 中是否集成上游测试
# gdb 官方套件需 dejagnu + expect + tclsh + 目标运行时/模拟器，
# 交叉裸机场景不具备（设备无 DejaGNU、无 riscv64 目标运行时），故未在 build 中集成。
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（代表性条目）
upstream_tests:
  - file: gdb/testsuite
    source: gdb-17.2/gdb/testsuite
    description: "gdb dejagnu 测试套件（需 dejagnu/expect/tclsh + 目标运行时，交叉场景跳过）"
    command: "make check-gdb"

# test_package 自带测试（消费者视角，验证交叉调试器真实可用）
test_package_tests:
  - file: test.sh
    description: "用 riscv64-elf-gdb --version + set/show architecture + maintenance print architecture + show data-directory 验证产物（R34 合规，避免 ptrace E222）；第 5 项用 clang 交叉编译 test.s → test.elf + gdb 反汇编 _start 验证 ELF 解析/加载/反汇编"
    command: "bash test.sh"
  - file: test.s
    description: "最小 riscv64 汇编程序（li a0,42 / li a7,93 / ecall），供 clang 交叉编译为 ELF 后 gdb 反汇编验证"
    command: "clang --target=riscv64-elf -c test.s -o test.o && clang --target=riscv64-elf -nostdlib -static test.o -o test.elf"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 5
