software: rbenv-bundler
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/carsomyr/rbenv-bundler/archive/refs/tags/1.0.1.tar.gz"

  # 源码校验和
  sha256: "6840d4165242da4606cd246ee77d484a91ee926331c5a6f840847ce189f54d74"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: makefile

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-harmonyos-md5-support.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "rbenv-bundler 是纯 Shell/Ruby 脚本插件，无需编译"
  - "通过 Makefile 实现文件安装（bin/ + etc/rbenv.d/）"
  - "使用 --complete 参数验证脚本可用性"
