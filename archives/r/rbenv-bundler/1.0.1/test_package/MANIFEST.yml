# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rbenv-bundler/1.0.1
homepage: "https://github.com/carsomyr/rbenv-bundler"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "bash -n bin/rbenv-bundler"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# rbenv-bundler is a shell script plugin with no upstream test suite
upstream_tests:
  - file: bin/rbenv-bundler
    source: rbenv-bundler-1.0.1/bin/rbenv-bundler
    description: "Shell syntax validation of the main plugin script"
    command: "bash -n bin/rbenv-bundler"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Verifies rbenv-bundler binary exists, is executable, has valid shell syntax, and responds to --complete"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
