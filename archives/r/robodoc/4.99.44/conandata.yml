# conandata.yml — robodoc 4.99.44
#
# 源码说明：上游 GitHub gumpu/ROBODoc 的 v4.99.44 官方 release 资产。
#   - 仓库 tag 归档（archive/refs/tags/v4.99.44.tar.gz）缺少 Source/makefile.in
#     （该文件被上游 .gitignore 忽略、未纳入版本控制），无法直接 configure；
#   - 官方 release 资产 robodoc-4.99.44.zip 是上游 `make dist-zip` 产出，
#     包含完整的 makefile.in / config.h.in，是可构建的官方发布源码。
# 故 sources.url 指向官方 release 资产（官方正式源，非镜像/搬运）。

sources:
  url: "https://github.com/gumpu/ROBODoc/releases/download/v4.99.44/robodoc-4.99.44.zip"
  sha256: "eeaff45f6fd7bfc2420d0b39e4b0ce44a9c1160564906d218bccd2824b0056e2"

patches:
  - patch_file: "patches/0001-Source-troff_generator.c.patch"
    patch_description: "sys/unistd.h 为 SysV 遗留头文件，OHOS（musl/clang）不提供；改用标准 <unistd.h>"
    patch_type: "portability"
  - patch_file: "patches/0002-config.guess.patch"
    patch_description: "config.guess（2018-02-24）增加 HarmonyOS 识别分支，输出 aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0003-config.sub.patch"
    patch_description: "config.sub 增加 linux-ohos 内核-OS 组合，接受 aarch64-unknown-linux-ohos 三元组"
    patch_type: "portability"
  - patch_file: "patches/0004-configure.patch"
    patch_description: "HMDFS 目录强制 setgid，umask 077 生成的临时目录（drwx--S---）不可写；改为 umask 022"
    patch_type: "portability"
