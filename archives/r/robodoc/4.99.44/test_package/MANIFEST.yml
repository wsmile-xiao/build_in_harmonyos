# test_package/MANIFEST.yml — robodoc 4.99.44
# CI L0e requires this file to exist.

package: robodoc/4.99.44
homepage: "https://github.com/gumpu/ROBODoc"

# ── 上游测试入口清点（R51 三步法 · 第 1 步）────────────────────────────
# 结论：上游没有可执行的自动化测试套件（no runnable automated suite）。
#
# 清点命令（上游 git tag v4.99.44 源码树）：
#   ls -R Test                     # 3 个子目录：Build/ Functionality/ Performance/
#   wc -c Test/makefile Test/*/makefile   # 全部为 0 字节
#   grep -rn 'TESTS\|check_PROGRAMS' --include=makefile.am .   # 无输出
# 官方 release 资产（本配方 sources.url）由 `make dist-zip` 生成，
# EXTRA_DIST 不含 Test/，故发布源码树中根本不存在测试目录。
#
# `make check` 存在但为空目标：无 TESTS / check_PROGRAMS / check-local，
# 不运行任何用例（实测 rc=0，无输出）。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游源码中与测试相关的文件（均在 git 仓库，不在发布包内；均非自动化断言）
upstream_tests:
  - file: Test/Build/test_build.sh
    source: "git tag v4.99.44: Test/Build/test_build.sh"
    runnable: false
    description: "构建烟测脚本；硬编码 version=4.99.43 与 ../../robodoc-4.99.43.tar.gz（注释标注 TODO Fetch from website），无 4.99.44 tarball 可获取，无法运行"
    command: "bash Test/Build/test_build.sh"
  - file: Test/Functionality/generate_testcase.py
    source: "git tag v4.99.44: Test/Functionality/generate_testcase.py"
    runnable: false
    description: "测试数据生成器：随机生成带 ROBODoc 头注释的源码树到 source/，不调用 robodoc、无任何断言，不是测试用例"
    command: "python3 Test/Functionality/generate_testcase.py"
  - file: Test/Performance/makefile
    source: "git tag v4.99.44: Test/Performance/makefile"
    runnable: false
    description: "空文件（0 字节），无规则"
    command: "make -f Test/Performance/makefile"
  - file: Test/makefile
    source: "git tag v4.99.44: Test/makefile"
    runnable: false
    description: "空文件（0 字节），无规则"
    command: "make -f Test/makefile"
  - file: Source/unittest.c
    source: "git tag v4.99.44: Source/unittest.c"
    runnable: false
    description: "单元测试程序，但未被 Source/makefile.am 的 SOURCES 引用（默认不编译）；源码含语法错误（注释后遗留孤立 '.'）、硬编码 /home/robodoc/test2/ 路径，无法编译运行"
    command: "cc Source/unittest.c -o unittest"

# ── test_package 自带测试（消费者视角 + 鸿蒙特有）──────────────────────
test_package_tests:
  - file: test.sh
    description: "消费者冒烟测试：robodoc --version / --help 版本横幅 + robohdrs 横幅（3 断言）"
    command: "bash test.sh"
  - file: ohos_specific_test.sh
    description: "鸿蒙特有：AArch64/musl 原生 ELF、aarch64-unknown-linux-ohos 三元组、HMDFS 上真实 HTML/ASCII 文档抽取、robohdrs（7 断言，ELF 探测工具缺失时 SKIP）"
    command: "bash ohos_specific_test.sh"

# 断言总数（test.sh 3 + ohos_specific_test.sh 7 通过 + 2 可 SKIP）
assertion_count: 10
