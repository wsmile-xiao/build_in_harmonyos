# 软件级 manifest — robodoc
# 遵循 ARCHIVE-SPEC v2.0

software: robodoc
display: "ROBODoc"
description: "从源码注释头抽取文档的工具 — 输出 HTML/LaTeX/RTF/DocBook XML/troff/ASCII，并附带 robohdrs 头插入器"
category: doc
homepage: "https://github.com/gumpu/ROBODoc"
license: "GPL-3.0-or-later"
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Autotools 项目（预生成 configure + makefile.in），无可用测试套件；make check 为空目标"
    - "config.guess（2018-02-24）不识别 uname -s = HarmonyOS，需补 HarmonyOS 分支输出 aarch64-unknown-linux-ohos；config.sub 需补 linux-ohos 组合（禁止 --build/--host 绕过，E007）"
    - "HMDFS 强制 setgid：umask 077 生成的临时目录为 drwx--S---（2700），config.status 写 subs1.awk 报 Permission denied；需将 configure 中 umask 077 改为 umask 022（E129）"
    - "Source/troff_generator.c 含 SysV 遗留头 <sys/unistd.h>，OHOS 无此头，改用 <unistd.h>"
    - "官方 release 资产 robodoc-4.99.44.zip 为可构建源码；git tag 归档缺 Source/makefile.in 不可直接 configure"
    - "构建产物是命令行工具（application），安装 bin/robodoc 与 bin/robohdrs；无外部依赖，纯 C 标准库 + POSIX"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "4.99.44":
    status: built
    build_date: "2026-09-27"
    conan_ref: "robodoc/4.99.44"
