# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rocm-hipamd/5.7.1
homepage: "https://github.com/ROCm/HIP"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 tests/ 采用 HIT 框架，需先完整构建安装 HIP 运行时后执行 build_tests
upstream_check_command: "cmake --build . --target build_tests && ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 不可运行原因（R51 清点，详见 notes.md）：依赖 ROCm clr 构建的 libamdhip64
# 运行时库与 AMD GPU 设备执行环境，OHOS PC 均不具备
upstream_tests:
  - file: tests/src/runtimeApi/memory/hipMemset.cpp
    source: hip-rocm-5.7.1/tests/src/runtimeApi
    description: "HIT 运行时 API 设备测试（需 HIP 运行时 + AMD GPU，不可运行）"
    command: "./hipMemset"
  - file: tests/src/test_common.cpp
    source: hip-rocm-5.7.1/tests/src
    description: "HIT 测试公共入口（依赖已安装的 HIP 运行时）"
    command: "./test_common"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/test_package.cpp
    description: "消费者测试：真实引用 HIP 公共 API 符号并断言（__HIP_ARCH_HAS_* 宏、hipDataType/hipLibraryPropertyType 枚举）+ 包产物完整性校验（10 项）"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
