software: rhvoice
display: "RHVoice"
description: "A free and open source speech synthesizer (TTS engine)"
category: multimedia
homepage: "https://github.com/RHVoice/RHVoice"
license: LGPL-2.1-or-later
build_system: scons
ohos_adaptation:
  key_points:
    - "SCons build with the toolchain injected as RHVOICE_SCONS_<name> construction variables"
    - "SCons installed into a private prefix inside the build folder (no registry package)"
    - "Audio backends disabled: samples leave through the C API callbacks"
    - "English language pack and the CC BY-SA 4.0 Dasha-Eng voice bundled for the engine"
  common_dependencies:
    - boost
versions:
  "1.14.0":
    status: built
    build_date: "2026-10-10"
    conan_ref: "rhvoice/1.14.0"
    upstream_version: "1.14.0"
