patches:
  "1.14.0":
    - patch_file: "patches/0001-sconstruct-allow-construction-variable-override.patch"
      patch_description: >-
        Take CC/CXX/AR/RANLIB/SHELL from RHVOICE_SCONS_<name>: SCons cannot
        discover a cross toolchain on its own, and posix_spawn does not look
        the "sh" it spawns commands with up in PATH.
      patch_type: "portability"

# The engine carries no voice data of its own: upstream keeps every language and
# voice in a separate repository (the git submodules that source archives leave
# empty) and ships them as data packages, the way Debian splits rhvoice-voice-*
# off the engine.  RHVoice_new_tts_engine() refuses to build an engine without a
# single voice, so one language (English) and one voice (Dasha-Eng, CC BY-SA
# 4.0) are fetched next to the engine and installed by data/SConscript.
#
# data/<kind>/<name> mirrors the upstream submodule layout; both archives are
# pinned to the upstream commit they were taken from.  Voice repositories ship
# their own voice.info, and the optional "fields" block rewrites it for
# archives that carry model data only (the minimal set upstream's voice builder
# emits).
data_sources:
  languages:
    English:
      url: "https://codeload.github.com/RHVoice/English/tar.gz/8a2ea34df72a190dae245460aeb20a867d64775c"
      sha256: "426536cbf954a116e434b0cf7212aa5a665236b53d3064f4ccaa300a6a0af426"
  voices:
    dasha-eng:
      url: "https://codeload.github.com/RHVoice/dasha-eng/tar.gz/3115c2666cd011debcf7fa4166ec905132338934"
      sha256: "2b4d763eb89f9ad91d16d3780f3b45d05af25eae62636fdc610b18069fb8e239"
