package: rhvoice/1.14.0
homepage: https://github.com/RHVoice/RHVoice

upstream_check_command: "none (upstream 1.14.0 has no automated test suite; .github/workflows/ci.yml only runs `scons -j2`)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests: []

test_package_tests:
  - file: src/consumer.cpp
    description: "Open a TTS engine through the installed C API, walk the voice table, check language compatibility and synthesize an utterance, counting the samples the callbacks receive"
    command: "rhvoice_consumer <package_folder>"
  - file: conanfile.py
    description: "Run the installed RHVoice-test synthesis tool"
    command: "RHVoice-test --help"

assertion_count: 12
