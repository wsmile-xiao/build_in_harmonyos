software: rhvoice
version: "1.14.0"
status: built
build_system: scons
build_date: "2026-10-10"
source:
  url: "https://codeload.github.com/RHVoice/RHVoice/tar.gz/refs/tags/1.14.0"
  sha256: "36029c0686081479bced4eb2d63d0184b4df58cc8a86677eb79acef75801e2b9"
  upstream_version: "1.14.0"
data_sources:
  - kind: languages
    name: English
    url: "https://codeload.github.com/RHVoice/English/tar.gz/8a2ea34df72a190dae245460aeb20a867d64775c"
    sha256: "426536cbf954a116e434b0cf7212aa5a665236b53d3064f4ccaa300a6a0af426"
    note: "upstream data repository (git submodule of data/languages/English)"
  - kind: voices
    name: dasha-eng
    url: "https://codeload.github.com/RHVoice/dasha-eng/tar.gz/3115c2666cd011debcf7fa4166ec905132338934"
    sha256: "2b4d763eb89f9ad91d16d3780f3b45d05af25eae62636fdc610b18069fb8e239"
    note: "CC BY-SA 4.0 voice; the archive ships its own voice.info (name=Dasha-Eng)"
build:
  system: scons
  configure_options:
    - 'audio_libs=""'
    - "enable_shared=1"
    - "dev=0"
    - 'CPPPATH="<boost include dir>"'
  dependencies:
    - "boost/1.91.0.1.3"
  tool_dependencies:
    - "scons 4.10.0 (installed with pip into a private prefix in generate())"
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-sconstruct-allow-construction-variable-override.patch"
knowledge_gained:
  - "SCons does not read the environment for CC/CXX and spawns its commands through a bare \"sh\" that posix_spawn does not look up in PATH; both are solved by letting RHVOICE_SCONS_<name> override construction variables; ref: archives/r/rhvoice/1.14.0/notes.md"
  - "SCons is not published to the ohpcd registry: pip --target into the build folder plus PYTHONPATH keeps the build reproducible on a clean CI machine; ref: archives/r/rhvoice/1.14.0/notes.md"
  - "RHVoice keeps language and voice data in separate repositories and RHVoice_new_tts_engine() refuses to start without a voice; ref: archives/r/rhvoice/1.14.0/reports/test-report.md"
knowledge_ref:
  - "archives/r/rhvoice/1.14.0/notes.md"
  - "archives/r/rhvoice/1.14.0/reports/test-report.md"
