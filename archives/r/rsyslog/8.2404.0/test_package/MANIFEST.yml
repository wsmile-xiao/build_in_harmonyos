package: rsyslog/8.2404.0
homepage: "https://www.rsyslog.com/"

upstream_check_command: "rsyslogd --version"
upstream_test_in_build: false
upstream_test_command: "rsyslogd -N1 -f minimal.conf"

# Upstream test suite inventory (R51):
# rsyslog ships a testbench in tests/ (1097 .sh scripts, 130 TESTS
# sections in tests/Makefile.am), but the whole testbench is gated
# behind --enable-testbench (default=no) and additionally requires
# --enable-imdiag plus runtime services (listening daemons, network
# ports, some tests need root). The default build's "make check" is
# therefore a no-op, and enabling the full testbench in the CI
# environment is not feasible. The plugins that the testbench needs
# (imdiag, imfile, omprog) are also the ones whose pthread_cancel
# usages are NOT covered by the portability patches — they stay
# disabled (their configure defaults), consistent with the default
# feature set shipped by upstream.
upstream_tests:
  - name: "testbench (not runnable)"
    command: "make check with --enable-testbench"
    description: "上游 testbench 默认关闭（--enable-testbench default=no），需 imdiag 插件与运行时守护环境，CI 环境不可运行；默认构建 make check 为空操作。"

test_package_tests:
  - file: test.sh
    description: "rsyslogd 版本自检 + rsyslogd -N1 配置校验运行（解析配置并初始化内置 omfile 动作）"
    command: "bash test.sh"

assertion_count: 2
