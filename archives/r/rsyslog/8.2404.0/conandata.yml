# conandata.yml — rsyslog 8.2404.0
# Primary source: official rsyslog website.
# Fallback: Yocto Project source mirror (downloads.yoctoproject.org hosts
# the pristine upstream tarball, verified byte-identical: same sha256 as
# www.rsyslog.com). www.rsyslog.com serves the tarball without
# Content-Length and transfers from the CI network class randomly
# truncate before completion; conan verifies sha256 per URL and falls
# through to the next mirror automatically.

sources:
  url:
    - "https://www.rsyslog.com/files/download/rsyslog/rsyslog-8.2404.0.tar.gz"
    - "https://downloads.yoctoproject.org/mirror/sources/rsyslog-8.2404.0.tar.gz"
  sha256: "30528d140ec1b1f079224081fa37df6e06587ff42b02e3e61f2daa0526c54d33"

# Patches (applied by apply_conandata_patches, patch_ng a/ b/ paths):
# - 0001: configure E011 HMDFS fix — umask 077 → 000 in the tmp-dir
#   creation block (same approach as libestr/libfastjson recipes)
# - 0002-0006: pthread_cancel/pthread_setcancelstate guarded with
#   HAVE_PTHREAD_CANCEL (never defined: OHOS musl libc lacks these
#   functions; rsyslog falls back to non-cancel thread termination)
# - 0007/0008: config.guess/config.sub HarmonyOS platform recognition
#   (2018-vintage scripts cannot guess "HarmonyOS" uname output)
patches:
  - patch_file: "patches/0001-configure-E011-HMDFS-fix.patch"
    patch_description: "0001 configure E011 HMDFS fix umask 077 to 000 in tmp-dir block"
    patch_type: "portability"
  - patch_file: "patches/0002-runtime-dnscache.c-pthread-cancel.patch"
    patch_description: "0002 runtime dnscache.c pthread_setcancelstate conditional compilation"
    patch_type: "portability"
  - patch_file: "patches/0003-runtime-queue.c-pthread-cancel.patch"
    patch_description: "0003 runtime queue.c pthread_setcancelstate conditional compilation"
    patch_type: "portability"
  - patch_file: "patches/0004-runtime-wti.c-pthread-cancel.patch"
    patch_description: "0004 runtime wti.c pthread_cancel conditional compilation"
    patch_type: "portability"
  - patch_file: "patches/0005-runtime-net.c-pthread-cancel.patch"
    patch_description: "0005 runtime net.c pthread_setcancelstate conditional compilation"
    patch_type: "portability"
  - patch_file: "patches/0006-threads.c-pthread-cancel.patch"
    patch_description: "0006 threads.c pthread_cancel conditional compilation"
    patch_type: "portability"
  - patch_file: "patches/0007-config.guess-harmonyos.patch"
    patch_description: "0007 config.guess recognize HarmonyOS aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0008-config.sub-linux-ohos.patch"
    patch_description: "0008 config.sub accept linux-ohos kernel-os combination"
    patch_type: "portability"
