software: rsyslog
version: "8.2404.0"
status: built
build_date: "2026-09-18"

source:
  url: "https://www.rsyslog.com/files/download/rsyslog/rsyslog-8.2404.0.tar.gz"
  sha256: "30528d140ec1b1f079224081fa37df6e06587ff42b02e3e61f2daa0526c54d33"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-fmhttp"
  dependencies:
    - "libestr/0.1.11"
    - "libfastjson/1.2609.0"
    - "libgcrypt/1.11.0"
    - "uuid/2.40.1"
    - "zlib/1.3.1.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-E011-HMDFS-fix.patch"
  - "0002-runtime-dnscache.c-pthread-cancel.patch"
  - "0003-runtime-queue.c-pthread-cancel.patch"
  - "0004-runtime-wti.c-pthread-cancel.patch"
  - "0005-runtime-net.c-pthread-cancel.patch"
  - "0006-threads.c-pthread-cancel.patch"
  - "0007-config.guess-harmonyos.patch"
  - "0008-config.sub-linux-ohos.patch"

packaging:
  package_file: "rsyslog-8.2404.0-ohos-aarch64.tar.gz"
  package_size: 1972114
  package_contents:
    binaries:
      - "sbin/rsyslogd"
    libraries:
      - "lib/rsyslog/lmregexp.so"
      - "lib/rsyslog/lmzlibw.so"
      - "lib/rsyslog/lmnet.so"
      - "lib/rsyslog/lmnetstrms.so"
      - "lib/rsyslog/lmnsd_ptcp.so"
      - "lib/rsyslog/lmcry_gcry.so"
      - "lib/rsyslog/lmtcpsrv.so"
      - "lib/rsyslog/lmtcpclt.so"
      - "lib/rsyslog/immark.so"
      - "lib/rsyslog/imuxsock.so"
      - "lib/rsyslog/imtcp.so"
      - "lib/rsyslog/imudp.so"
      - "lib/rsyslog/omtesting.so"
      - "lib/rsyslog/mmexternal.so"
      - "lib/rsyslog/imklog.so"
      - "lib/rsyslog/fmhash.so"
    documentation:
      - "share/man/man5/rsyslog.conf.5"
      - "share/man/man8/rsyslogd.8"

knowledge_gained:
  - "E011: HMDFS文件系统umask 077权限问题，configure 临时目录块需放宽 umask（000）"
  - "鸿蒙系统缺少pthread_cancel/pthread_setcancelstate函数（sysroot pthread.h 无声明、libc.so 无符号），使用HAVE_PTHREAD_CANCEL条件编译排除，走非取消式线程终止回退路径"
  - "E007: 2018版config.guess无法识别 uname -s=HarmonyOS，需补丁添加 *:HarmonyOS:*:* 分支输出 aarch64-unknown-linux-ohos，config.sub 需接受 linux-ohos"
  - "conan 依赖包（libestr/libfastjson/libgcrypt/uuid）内嵌的 .pc / *-config 文件记录 prefix=/（DESTDIR式安装），路径不可用；libestr/libfastjson 的 cpp_info.libs 名亦有误（libestr→应为estr）；下游 autotools 包需用 pkg.m4 环境变量（LIBESTR_CFLAGS等）与 *-config 包装器注入真实路径"
  - "www.rsyslog.com 无 Content-Length 且该网络类别下传输随机截断；Yocto 源镜像（downloads.yoctoproject.org/mirror/sources/）字节级同源可作回退，conan 多URL按 sha256 校验自动切换"
  - "toybox patch --silent 会静默跳过实际写盘；conan 用 patch_ng（纯Python）应用 conandata 补丁，a/ b/ 前缀自动剥离，.orig/.work 前缀在 strip=0 下无法命中"
