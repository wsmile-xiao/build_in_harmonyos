package: rakudo/2025.11
homepage: "https://rakudo.org/"

upstream_test_in_build: true
upstream_test_command: "make test"
upstream_tests:
  - path: "t/01-sanity t/02-rakudo t/04-nativecall t/05-messages t/06-telemetry t/07-pod-to-text t/08-performance t/09-moar t/10-qast t/12-rakuast t/13-experimental"
    framework: "Rakudo harness5 / TAP"
    file_count: 166
    assertion_count: 2757
    note: "Core make test suite for the MoarVM backend; excludes separately fetched Roast spectest"

test_package_tests:
  - file: test.raku
    description: "Execute packaged Raku and verify collections, hashes, Unicode encoding, classes and methods"
