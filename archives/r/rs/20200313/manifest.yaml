# ============================================================
# 构建配置
# ============================================================

build:
  # 上游是 BSD make（.include <bsd.prog.mk>），GNU make 下不可用；
  # 本配方逐编译单元直接驱动 clang（等效性论证见 notes.md），故 system=custom
  system: custom

  configure_options: []

  # 无第三方依赖（只用 libc）
  dependencies: []

  cc: clang
  cxx: ""

  # 实际编译命令（conanfile.py build() 逐字执行的形态）
  compile_command: >-
    clang -O2 -std=gnu99 -Wall -Wextra -Wformat -I. -include compat_defs.h
    -c {rs.c|utf8.c|.linked/strtonum.c|compat_reallocarray.c} -o {..}.o
    然后 clang 同参数链接为 rs

# ============================================================
# 补丁信息（"零补丁"的准确口径：无补丁文件 != 无新增文件）
# ============================================================

# 上游源码逐字节未改（本轮重下 tarball 后 7/7 文件 sha256 与构建缓存实物全 SAME；
# conandata.yml `patches: {}`；patches/ 目录为空；conanfile.py 无自定义 patch 逻辑）。
patches_applied: []

# 但构建期确有 3 个**配方侧补充件**参与（不是补丁、不改上游任何一字节），逐个点名：
shipped_sources:
  # 经 -include 注入每一个编译单元：上游移植开关 NEED_STRTONUM/MBSDPORT_H + reallocarray 声明
  - compat_defs.h
  # 额外链接 TU：reallocarray(3) 实现（派生码，来源与许可见 shipped_sources_provenance）
  - compat_reallocarray.c
  # 测试驱动：build() 内真实执行上游 check.t 的 13 条语料
  - check_t_runner.py

# 补充件的实现来源与许可披露（整改轮 1-d 补；对账读数见 notes.md §7）
shipped_sources_provenance:
  compat_defs.h: >-
    配方侧新写，不含功能代码：只定义上游 rs.h 自己预留的两个移植开关
    （NEED_STRTONUM、MBSDPORT_H，取值与上游维护者在 Debian 打包里用的同一对）
    与一个 reallocarray 函数声明。
  compat_reallocarray.c: >-
    **派生码，非从零手写**。移植自 OpenBSD src/lib/libc/stdlib/reallocarray.c
    （$OpenBSD: reallocarray.c,v 1.3 2015-09-13 08:31:47 guenther Exp $，
    Copyright (c) 2008 Otto Moerbeek，ISC 许可）：函数体 10 行中 9 行逐字符相同，
    宏名 MUL_NO_OVERFLOW 与判定式同形（阈值写法 8/2 与上游 4 数值相同）。唯一有意的
    代码偏差是溢出时 errno 由上游 ENOMEM 改为 ERANGE；未沿用上游 DEF_WEAK()（OHOS
    musl 不定义 DEF_WEAK，实测）。ISC 允许修改与再分发，条件之一是保留版权声明，故
    在此署名来源与许可；本归档 `conanfile.py` 与软件级 `manifest.yaml` 的 license 字段因此
    显式含三项（BSD-3-Clause / ISC / MirOS；第三项是 SPDX 标识符，Debian copyright 侧用词为 MirBSD）——ISC 在**配方侧只覆盖本文件这一个派生件**（上游侧另覆盖自带的 `utf8.c` 与
    `.linked/strtonum.c`；`rs.c`/`rs.1` 仍为 BSD-3-Clause、`rs.h` 与打包归第三项 MirOS（Debian 用词 MirBSD），逐文件
    归属见 notes.md「许可证」节）。行为读数（B 机实测）：本实现溢出返回 NULL/errno=34 ERANGE，
    OHOS musl 运行期实现溢出返回 NULL/errno=12 ENOMEM —— 仅返回值一致，errno 不承诺。
  check_t_runner.py: >-
    配方侧新写的等价测试驱动；上游语料 check.t 逐字节使用、未修改。上游官方驱动
    check.pl 属 mksh 源码树、不在本 tarball 内，故按语料约定复写，断言口径
    （退出码 0 + stdout 逐字节相等）与语料可表达的信息一致。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "MirOS/OpenBSD 血统的 .include <bsd.prog.mk> 在 GNU make 下 Makefile:13 直接 missing separator，且依赖不存在的 ${BSDSRCDIR} 与 BSD 的 ${VAR:Q} 修饰符 ⇒ 上游构建入口不可用，配方自备等效编译命令"  # ref: notes.md §1 硬点 (a)
  - "上游 rs.h 自带 MirBSD <sys/cdefs.h> 后备（__IDSTRING/__RCSID/__COPYRIGHT/__BEGIN_DECLS/__dead），并用 NEED_STRTONUM 与 MBSDPORT_H 两个宏做移植开关 ⇒ OpenBSD 专有符号 strtonum(3) 无需改源码，只要打开上游自己预留的开关 + 纳入上游自带 .linked/strtonum.c"  # ref: notes.md §1 硬点 (b)-1
  - "OHOS musl 的 sys/cdefs.h 不定义 __RCSID（也不定义 DEF_WEAK），所以裸编上游 .linked/strtonum.c 必失败于第 29 行 __RCSID(...)：expected parameter declarator"  # ref: notes.md §1 硬点 (b)-1
  - "OHOS 有『运行期有符号、链接期无符号』一类缺口：reallocarray(3) 在 /system/lib/ld-musl-aarch64.so.1 里是 T（导出），但 SDK 链接桩 sysroot/.../libc.so 与 sysroot 头都没有它 ⇒ 链接报 undefined symbol，而平台能力其实存在"  # ref: notes.md §1 硬点 (b)-2
  - "上述缺口的反例做法：-Wl,-Bstatic -lc -Wl,-Bdynamic 能过链接，但 musl 静态片段与动态 libc 混链会让产物一跑就 SIGSEGV（实测 check.t 13 条全部 rc=139）⇒ 必须用独立 compat TU 补定义，不能靠混链"  # ref: notes.md §1 硬点 (b)-2
  - "上游回归语料在包内（check.t，13 条 name:）但驱动脚本 check.pl 在 mksh 源码树里（${MKSHDIR}/check.pl），不在 tar 内 ⇒ 语料型测试要自备等价 runner，且断言须按 bytes 逐字节比对（语料含非法 UTF-8 字节 0xFF）"  # ref: notes.md §1 硬点 (c)
  - "check.t 的 `!` 同时是 argv 分词符与 category 取反符：arguments: !-e!0!5! 是三个 argv 元素，而 category: !os:mirbsd 是『仅非 MirBSD』；解析时须为 category 保留原文"  # ref: notes.md §1 硬点 (c)
  - "上游 rs 无 --version/-V（getopt 串里没有，实测 -V/--version 均退出 1），L2 冒烟只能改用真实功能调用做等价验证"  # ref: notes.md §5 已知限制第 3 条

