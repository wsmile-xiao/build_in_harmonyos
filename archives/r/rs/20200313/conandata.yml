# 取源说明（2026-09-28 收尾-8 换源；**只改 URL，sha256 一字未动**，收尾-4 已批）
#
# ── 为什么换（worker 侧两轮同一第一错误，/rebuild 未消）────────────────────
#   2026-09-28T02:17 build#63232 worker CI-022、2026-09-28T12:08 build#63490 worker
#   CI-007，conan source() 均首错：
#     Error downloading file https://mbsd.evolvis.org/MirOS/dist/mir/rs/rs-20200313.tar.gz
#     HTTPSConnectionPool(host='mbsd.evolvis.org', port=443): Failed to establish a new
#     connection: [Errno 111] Connection refused（各重试 2 次同错）⇒ 判决 CI 校验失败。
#   同轮日志另证 build_and_test.sh 的 pre-download 在该类 worker 上必落空：
#     [fail] [Errno 2] No such file or directory: 'curl' ⇒ 只能靠 conan 自身下载。
# ── 定性（⛔ 不是"源码站全挂"，也不是我方两端）────────────────────────────
#   A 机与 B 机对同一 URL `curl -L` 均 HTTP 200 / 12571 字节；
#   出口本身是通的——同为无 curl 的 worker CI-018 上，sff 的 codeberg.org 拿到 **HTTP 429**
#   （连接与请求均成功，只被限流）、ncurses 二进制包从 ohpcd 远端下载成功
#   ⇒ worker 出口普遍可用，只有 evolvis 这台主机拒连本 worker。
#
# ── 新 URL 与三方同哈希（收尾-4 硬条件已核）──────────────────────────────
#   https://deb.debian.org/debian/pool/main/r/rs/rs_20200313.orig.tar.gz
#   实测 curl -L：HTTP 200 / 12571 B，自算 sha256
#   = 919215dc9fe85a27a30bf63d56406cfb503f9fc9820323c4bd3bfe75a6a3bc3f
#   与本文件 sources 声明值逐字相等，且与 evolvis 实件 `cmp` 逐字节相同（三方同哈希）；
#   亦与 rs_20200313-1.dsc 的 Checksums-Sha256 同串。
#   debian/source/format = 3.0 (quilt) ⇒ Debian 的改动全在独立 .debian.tar.xz，
#   此 .orig 即 pristine 上游件；上游 7 个文件（Makefile rs.c utf8.c rs.h
#   .linked/strtonum.c check.t rs.1）一字节未动。
#
# ── PF7 口径 ────────────────────────────────────────────────────────────
#   pool 属 PF7 拉黑面 ⇒ 按 R52 记 **P1-已例外处置**：上游官方主机在 CI worker 实测
#   拒连（读数见上、notes §7.11），PR 正文落「官方托管例外」署名；⛔ 不改 sha256、
#   ⛔ 不换版本、⛔ 不手写镜像前缀。
#
# 历史（截至 2026-09-27，已被本轮取代）：原取源址为上游官方 dist 树
#   https://mbsd.evolvis.org/MirOS/dist/mir/rs/rs-20200313.tar.gz（作者 mirabilos 自家
#   Evolvis 服；www.mirbsd.de 同路径 301 即指此处、rs_20200313-1.dsc 的 Vcs-* 亦指
#   evolvis.org）。www.mirbsd.org 在本工作区 DNS 可解析（A 62.138.145.52 /
#   AAAA 2001:470:6f:94a::1）但 TCP 80/443 一律连接超时。端点与两树对账读数见 notes.md。

sources:
  - url: "https://deb.debian.org/debian/pool/main/r/rs/rs_20200313.orig.tar.gz"
    sha256: "919215dc9fe85a27a30bf63d56406cfb503f9fc9820323c4bd3bfe75a6a3bc3f"

# 「零补丁」口径（消歧）：上游 7 个文件逐字节未改，且**无补丁文件**
# （patches: {}、patches/ 目录为空、conanfile.py 无自定义 patch 逻辑）；
# strtonum 用上游自带的 .linked/strtonum.c。但构建期确有 **3 个配方侧补充件**
# 参与，逐个点名：compat_defs.h（经 -include 注入每个编译单元）、
# compat_reallocarray.c（额外链接 TU；移植自 OpenBSD 的 ISC 实现，属派生码）、
# check_t_runner.py（上游语料的等价测试驱动）。
# 即"无补丁文件 != 无新增文件"；来源与许可披露见 manifest.yaml 的
# shipped_sources / shipped_sources_provenance 与 notes.md。
patches: {}
