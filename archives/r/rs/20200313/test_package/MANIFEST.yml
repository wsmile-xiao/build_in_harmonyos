# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh 的 L0e 强制要求此文件存在）
#
# rs 20200313 的上游测试清点结论（R51 上游测试三步法之"清点"）：
#   upstream tarball（rs_20200313.orig.tar.gz，7 个文件，实测清单）：
#     Makefile  rs.c  utf8.c  rs.h  .linked/strtonum.c  check.t  rs.1
#   - 测试资产：check.t —— 声明式回归语料，`grep -c '^name:' check.t` = 13 条用例
#     （13 个 `---` 分隔、13 个 `arguments:`、13 个 `stdin:`、13 个
#      `expected-stdout:`、0 个 `expected-stderr:`）
#   - 测试驱动：**不在包内**。上游 Makefile 的 regress 目标写的是
#         perl ${MKSHDIR:Q}/check.pl -s ${SRCDIR:Q}/check.t -v -p ./${PROG:Q}
#     而 ${MKSHDIR} = ${BSDSRCDIR}/bin/mksh，即 check.pl 来自 mksh 源码树；
#     Debian 同样外挂 /usr/share/doc/mksh/check.pl.gz 才能跑这套语料。
#   ⇒ 本归档随配方提供一个**等价 runner**（check_t_runner.py），按语料约定
#     逐条真实执行 13 条用例（退出码 0 + stdout 逐字节相等），并在
#     conanfile.py 的 build() 里调用，故 conan create / CI 日志有执行痕迹。

package: rs/20200313
homepage: "https://www.mirbsd.org/MirOS/dist/mir/rs/"

# ── 上游官方测试 ────────────────────────────────────────────────────────────
# 上游原命令（BSD make 语法，GNU make 下 Makefile:13 直接 missing separator，
# 且 check.pl 不在 tar 内 ⇒ 逐字执行不了）
upstream_check_command: "make regress"
# 等效执行命令（本归档提供的等价 runner）
equivalent_check_command: "python3 check_t_runner.py ./rs check.t --allow-skip"
upstream_test_in_build: true
upstream_test_command: "check_t_runner.py <build>/rs check.t --allow-skip"

# 上游实际运行的测试程序（语料里的 13 条，逐条具名）
upstream_tests:
  - name: debian-650029-e
    arguments: ["-e", "0", "5"]
    result: pass
  - name: debian-650029-ze
    arguments: ["-ze", "0", "5"]
    result: pass
  - name: debian-668306
    arguments: ["3", "3"]
    result: pass
  - name: debian-706717-r1.10
    arguments: ["-c", "0", "2"]
    result: pass
  - name: debian-706717-r1.11-1
    arguments: ["-c", "0", "2"]
    result: pass
  - name: debian-706717-r1.11-2
    arguments: ["-c", "0", "2"]
    result: pass
  - name: empty-last-line-1
    arguments: ["0", "2"]
    result: pass
  - name: empty-last-line-2
    arguments: ["0", "2"]
    result: pass
  - name: unicode-1
    arguments: ["0", "3"]
    env: {LC_ALL: "C.UTF-8"}
    result: pass
  - name: unicode-2
    arguments: ["-z", "0", "3"]
    env: {LC_ALL: "C.UTF-8"}
    result: pass
  - name: unicode-3-utf8
    arguments: ["-z", "0", "2"]
    env: {LC_ALL: "C.UTF-8"}
    upstream_category: "!os:mirbsd"
    result: pass
  - name: unicode-3-optu8
    arguments: ["-z", "0", "2"]
    env: {LC_ALL: "C.UTF-8"}
    # 上游自声明 category: os:mirbsd —— 该期望只在 MirBSD 的 OptU8 字符集层下
    # 成立（非法 UTF-8 字节原样透出）。本平台实测为 '?' 替换，与其镜像用例
    # unicode-3-utf8（category: !os:mirbsd，本平台应通过）互为对立项，
    # 后者已 PASS ⇒ 本平台行为符合上游对"非 MirBSD"的期望。
    # 该用例**照样真实执行**，差异按 --allow-skip 记 SKIP 不记 FAIL。
    upstream_category: "os:mirbsd"
    result: skipped_upstream_declared_platform
    observed: "stdout=b'\\xff  b\\nc  \\xc0\\x80\\n' 期望逐字节不符（musl 把非法序列渲染成 '?'）"
  - name: unicode-4
    arguments: ["-z", "0", "2"]
    env: {LC_ALL: "C"}
    upstream_category: "!os:mirbsd"
    result: pass

# 五维账本（口径见 docs/TEST_QUALITY_SPEC.md 与交付手册 §10.1）
test_ledger:
  N_static: 13          # 上游语料声明的用例数（grep -c '^name:' check.t）
  N_registered: 13      # 全部纳入等价 runner，无删减、无缩分母
  N_executed: 13        # 13 条全部真实执行（含上游自声明别家平台的那一条）
  N_passed: 12
  N_skipped: 1          # unicode-3-optu8：上游 category: os:mirbsd
  N_failed: 0
  N_runner: 1           # check_t_runner.py 一个 runner，未用 runner 数替代原子用例数
  N_consumer: 1         # test_package/test_rs_consumer.py（内含 7 组行为断言）
  N_assertion: 7

# ── test_package 自带的消费者测试 ───────────────────────────────────────────
test_package_tests:
  - file: test_rs_consumer.py
    description: >-
      rs 命令行功能测试（消费者视角）：3x3 重排 / 空字段等宽 / 每行一条目转置宽列 /
      strtonum 的 invalid 与 too large 两条错误路径 / reallocarray 扩容后字段多重
      集合守恒 / C.UTF-8 下按显示宽度对齐
    command: "python3 test_rs_consumer.py <pkg>/bin/rs"

assertion_count: 7
