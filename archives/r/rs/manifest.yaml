# 软件级 manifest
# 文件位置: archives/r/rs/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: rs
display: "rs"
description: "MirOS rs：把 stdin 的字段流按列/行重排（可转置）的纯文本矩阵工具"
category: system
homepage: "https://www.mirbsd.org/MirOS/dist/mir/rs/"
# 三项分工同 conanfile.py（Debian debian/copyright 自述 "This is three-fold"）：
# BSD-3-Clause = 上游主许可（rs.c / rs.1）；ISC = 配方侧唯一派生件 compat_reallocarray.c
# 与上游自带 utf8.c / .linked/strtonum.c；MirOS（SPDX 标识符，Debian 侧用词 MirBSD）=
# rs.h（编译进二进制）与打包。逐文件归属见 20200313/notes.md「许可证」节与
# 20200313/manifest.yaml 的 provenance。
license:
  - BSD-3-Clause
  - ISC
  - MirOS
build_system: custom

ohos_adaptation:
  key_points:
    - "上游 Makefile 是 BSD make（.include <bsd.prog.mk>），GNU make 下 Makefile:13 直接 missing separator ⇒ 配方逐编译单元直接驱动 clang，上游 Makefile 不改"
    - "OpenBSD 专有符号 strtonum(3) 用上游自带 .linked/strtonum.c + 上游自己预留的 NEED_STRTONUM / MBSDPORT_H 开关解决，不手写替身、不造假头"
    - "OHOS musl 的 sys/cdefs.h 不定义 __RCSID，裸编上游 strtonum.c 必失败，必须经 MBSDPORT_H 钩子拿到 rs.h 里的 <sys/cdefs.h> 后备定义"
    - "OpenBSD reallocarray(3) 在 OHOS 是『运行期 musl 有、SDK 链接桩 libc.so 无』：链接报 undefined symbol 但平台其实能跑 ⇒ 补一个独立 compat TU；混链静态 libc 会让产物一跑就 SIGSEGV，已实测否决"
    - "上游回归语料 check.t（13 条）的驱动 check.pl 在 mksh 源码树里、不在 tar 内 ⇒ 随配方提供等价 runner 并在 build() 真实执行"
    - "上游无 --version/-V，L2 冒烟需以真实功能调用做等价验证"
    - "「零补丁」口径：无补丁文件（上游 7 文件逐字节未改、conandata.yml patches: {}、patches/ 为空），但构建期注入 3 个配方侧补充件——compat_defs.h（-include 进每个 TU）、compat_reallocarray.c（额外链接 TU）、check_t_runner.py（上游语料的测试驱动）；无补丁文件 != 无新增文件"
    - "compat_reallocarray.c 属**派生码**：移植自 OpenBSD src/lib/libc/stdlib/reallocarray.c（ISC，Copyright (c) 2008 Otto Moerbeek），函数体 9/10 行逐字符相同，唯一有意偏差是溢出时 errno 由 ENOMEM 改为 ERANGE；实测本实现溢出 NULL/ERANGE=34，OHOS musl 运行期 NULL/ENOMEM=12，两者仅返回值一致，故本包不承诺 reallocarray 的 errno 取值"
  common_dependencies: []

versions:
  "20200313":
    status: built
    build_date: "2026-09-27"
    conan_ref: "rs/20200313"
