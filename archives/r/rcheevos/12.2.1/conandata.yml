# conandata.yml — rcheevos 12.2.1
# Upstream release tag v12.2.1; CI adds gh-proxy mirror fallback automatically.

sources:
  url: "https://github.com/RetroAchievements/rcheevos/archive/refs/tags/v12.2.1.tar.gz"
  sha256: "14b3fd7d0b0b0cc33cb8ae446b357bb42bd40f9069f9af165f692aef6ff4fb22"

patches:
  - patch_file: "patches/0001-test-Makefile-default-source-for-musl-fseeko-decl.patch"
    patch_description: "musl/OHOS: fseeko64/ftello64 are unconditional macros aliasing fseeko/ftello whose declarations are hidden under strict -std=c89; -D_DEFAULT_SOURCE exposes the POSIX declarations so the upstream -Werror build compiles (no source change)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-value-c-float-to-unsigned-via-int64.patch"
    patch_description: "float->unsigned direct cast is UB and arch-divergent: MSVC/x86 reference produces the two's-complement pattern the test suite encodes (e.g. -1.0 -> 0xFFFFFFFF) while aarch64 fcvtzu saturates to 0 (5 upstream test failures on device); route through int64_t to reproduce the reference semantics on every architecture"
    patch_type: "portability"
