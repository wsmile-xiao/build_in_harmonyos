# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rcheevos/12.2.1
homepage: "https://github.com/RetroAchievements/rcheevos"

# 上游测试清点（R51 三步法第 1 步，2026-09-20 源码包实测）：
#   上游自带完整测试框架（test/test_framework.h 自研框架，非 ctest）：
#   - test/test.c 为 main 入口，注册 20 个 test_* 套件函数
#     （condition/memref/operand/condset/trigger/value/format/lboard/
#      richpresence/runtime/runtime_progress/client/libretro/rc_validate/
#      hash/hash_rom/cdreader/hash_disc/hash_zip/rapi×5）
#   - 测试构建入口：make -C test runtests（test/Makefile）
#   - 断言计数由框架输出（run_count），实测后回填 notes.md 与证据报告
# 本配方 build() 内已集成上游测试全量运行（CI L1c 证据）。
upstream_check_command: "make -C test ARCH=x64 CC=clang runtests"
upstream_test_in_build: true
upstream_test_command: "make -C test ARCH=x64 CC=clang runtests"

upstream_tests:
  - file: test/test.c
    source: rcheevos v12.2.1
    description: "main 入口：注册并运行全部测试套件"
    command: "./test/test"
  - file: test/rcheevos/test_condition.c
    source: rcheevos v12.2.1
    description: "成就条件表达式求值套件"
    command: "./test/test"
  - file: test/rcheevos/test_trigger.c
    source: rcheevos v12.2.1
    description: "触发器状态机套件（WAITING/ACTIVE/TRIGGERED）"
    command: "./test/test"
  - file: test/rcheevos/test_runtime.c
    source: rcheevos v12.2.1
    description: "runtime 激活/帧处理/进度序列化套件"
    command: "./test/test"
  - file: test/rhash/test_hash.c
    source: rcheevos v12.2.1
    description: "ROM/光盘/zip 哈希识别套件（mock 文件读取器）"
    command: "./test/test"
  - file: test/rapi/test_rc_api_user.c
    source: rcheevos v12.2.1
    description: "API 请求/响应构造解析套件"
    command: "./test/test"

# test_package 中自带的测试（消费者视角验证，真实调用 rcheevos 公开 API）
test_package_tests:
  - file: test.c
    description: "消费者测试: runtime activate/do_frame/触发态断言 + lboard 激活与值格式化 + 错误串 + 非法输入负例"
    command: "./test_rcheevos"

# 测试断言总数：上游以真机运行输出为准（待回填 run_count），消费者 8 项 CHECK
assertion_count: 8
