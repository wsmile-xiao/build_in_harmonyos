# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS musl 无 pthread_cancel，joinable 线程用 SIGUSR1 处理函数 + pthread_kill + join 回收（E513）"
  - "OHOS musl 无 rindex()，最小修复为 strrchr() 源码替换"
  - "Conan CMakeToolchain 默认 CMAKE_INSTALL_LIBEXECDIR=bin，与 bin 内同名可执行文件冲突时须覆盖为 libexec"
  - "OHOS musl 无 getpass()/program_invocation_short_name，分别用弱符号实现与 __progname"
  - "test_package 在 OHOS 运行期 dlopen 包内共享库受限时，可静态链接包内 .a 消除运行期加载依赖"

