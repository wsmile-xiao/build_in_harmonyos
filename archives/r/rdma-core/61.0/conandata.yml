    patch_type: "portability"
  - patch_file: "patches/0003-infiniband-diags-ibdiag_common.h.patch"
    patch_description: "OHOS musl libc lacks getpass(); weak declaration in ibdiag_common.h"
    patch_type: "portability"
  - patch_file: "patches/0004-librdmacm-examples-rping.c.patch"
    patch_description: "OHOS musl libc lacks pthread_cancel(); use reserved signal + join (knowledge E513)"
    patch_type: "portability"
  - patch_file: "patches/0005-librdmacm-preload.c.patch"
    patch_description: "OHOS musl libc lacks program_invocation_short_name; use __progname"
    patch_type: "portability"
  - patch_file: "patches/0006-srp_daemon-srp_daemon.c.patch"
