software: rdma-core
display: "rdma-core"
description: "RDMA core userspace libraries and daemons (libibverbs, librdmacm, libibumad)"
category: system
homepage: "https://github.com/linux-rdma/rdma-core"
license: GPL-2.0 OR BSD-2-Clause

build_system: cmake

ohos_adaptation:
  key_points:
    - "Disable libnl with ENABLE_RESOLVE_NEIGH=0"
    - "Disable Python bindings with NO_PYVERBS=1"
    - "Disable man pages with NO_MAN_PAGES=1"
    - "Disable symbol versioning with NO_COMPAT_SYMS=1 (musl/OHOS)"
    - "Disable valgrind with ENABLE_VALGRIND=0"
  common_dependencies: []

versions:
  "56.1":
    status: published
    build_date: 2026-09-04
