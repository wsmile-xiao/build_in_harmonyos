# test_package/MANIFEST.yml
# 上游官方测试声明文件
package: rdma-core/56.1
homepage: "https://github.com/linux-rdma/rdma-core"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: libibverbs/examples/devinfo.c
    source: rdma-core-56.1.tar.gz/libibverbs/examples/devinfo.c
    description: "ibv_devices device info listing"
    command: "./devinfo"

# test_package 中自带的测试
test_package_tests:
  - file: test_package/test.c
    description: "Verify libibverbs API is callable (ibv_get_device_list)"
    command: "./test_rdma_core"

# 测试断言总数
assertion_count: 2
