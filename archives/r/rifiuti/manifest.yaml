# 软件级 manifest — rifiuti
# 遵循 ARCHIVE-SPEC v2.0

software: rifiuti
display: "rifiuti"
description: "Windows 回收站 INFO2 文件解析器 — 逐条打印被删除记录的索引、删除时间、盘符、路径与大小"
category: utility
homepage: "https://packages.debian.org/source/squeeze/rifiuti"
license: BSD-3-Clause
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "构建文件只有 src/Makefile（包根目录无 Makefile），实测 215 字节、4 个目标（all/install/installwin/clean），内含两条 gcc 编译命令：src/Makefile:4（install，产物 rifiuti）与 :7（installwin，-DCYGWIN 产物 rifiuti.exe，CYGWIN 专用）；默认 all: install 只走第一条"
    - "编译命令里的编译器是字面量 gcc，Makefile 不引用 $(CC)/$(CFLAGS) ⇒ make CC=<交叉 clang> 静默无效，OHOS 设备上直接 make 报 '/bin/sh: gcc: inaccessible or not found'（command -v gcc 为空；clang 只有 /data/service/hnp/bin/clang）"
    - "适配方式：build() 从 Conan conf 取交叉编译器并逐字复刻上游那条编译命令，不改源码、不打补丁、不注入假 gcc"
    - "上游只链接 -lm -lc（libc/libm），无任何外部依赖 ⇒ W0 preflight 天然满足"
    - "2004 年 C89 代码（隐式 malloc/free/exit 声明）在 clang 15 + musl 下按上游原命令可直接编译通过，无需 -Wno-error 类放宽"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "20040505":
    status: built
    build_date: "2026-09-27"
