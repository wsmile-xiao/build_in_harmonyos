# test_package/MANIFEST.yml — rifiuti 20040505
# CI L0e 要求本文件存在；上游测试申报口径见 docs/TEST_QUALITY_SPEC.md §3 与 notes.md

package: rifiuti/20040505
homepage: "https://packages.debian.org/source/squeeze/rifiuti"

# ---- 上游官方测试清点（2026-09-27 实测，证据见 notes.md「五维测试账本」）----
# 源码包只有 4 个文件：CHANGES、Readme.txt、src/Makefile、src/rifiuti.c。
# src/Makefile 全文只有 all / install / installwin / clean 四个目标：
#   - 没有 check / test 目标，没有 TESTS 变量，没有 tests/ 或 test/ 目录，
#     也没有任何 *.c 测试程序（整个包只有 1 枚 .c，就是主程序本身）。
# ⇒ 上游测试静态总数 = 0，无"上游测试可执行数"，故不存在 make check 集成。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ---- test_package 自造断言（与上游测试数分开记账，不混进同一个总数）----
test_package_tests:
  - file: test.sh
    description: >-
      消费者视角功能测试：按 rifiuti.c 自身实现的 INFO2 字段偏移
      （记录长度 @文件 0x0C，记录首址 0x10，记录内 path@+0x04 /
      index@+0x108 / drive@+0x10C / FILETIME@+0x110 / size@+0x118）
      现场构造 3 条真实 INFO2 记录，逐条断言输出的索引、删除时间、
      盘符、路径、大小与记录条数；另覆盖默认 TAB 与 -t , 两种分隔符、
      FILETIME=0 零值分支、尾部残缺记录丢弃、声明记录长度超大时输出 0 条、
      以及无参数(exit 254)与打不开文件(exit 253)两条错误路径。
    command: "bash test.sh"

# test.sh 内的断言总数（脚本自带 SUMMARY total=.. pass=.. fail=.. 自检行）
assertion_count: 22
