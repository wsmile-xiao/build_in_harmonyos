# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "src/Makefile 的编译行把编译器写成字面量 gcc，make CC=... 与 CFLAGS=... 都不生效，只能复刻编译命令或改源码（ref: DRAFT-rifiuti-20040505-makefile-baked-compiler-name-no-override-target）"
  - "OHOS 设备侧只有 clang（/data/service/hnp/bin/clang，默认 target aarch64-unknown-linux-ohos），gcc 不存在 ⇒ 直接 make 必失败；实测为 rc=2 且末行 Error 1（分号续行使第二步 cp 再报一次 bad 'rifiuti'，故不是 Error 127 —— 与 suckless 族签名的可分辨差异）（ref: knowledge/doc/E501.md:11,15）"
  - "2004 年 C89 代码（隐式 malloc/free/exit/strcpy 声明）在 clang 15 + musl 下按上游原命令可编译通过，无需 -Wno-error 放宽（ref: knowledge/doc/E063.md:11-14,17-22）"
  - "L2 冒烟的 pass 判据是 --version 或 --help 任一 rc=0（实装 ci/conan/build_and_test.sh:1685-1693：先试 --version，其 rc 非 0 才 elif 试 --help），两者都非 0 时只打 [warn] ...（non-blocking，:1701-1707）⇒ 无 --version/--help 的单发 CLI（如本包）拿不到 L2 pass，运行期证据全由 test_package 承担（ref: ci/conan/build_and_test.sh:1685-1693,1701-1707）"

knowledge_ref:
