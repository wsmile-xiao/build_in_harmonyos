# 取源说明（2026-09-27 第 6 轮换官方直链，R39/PF7 口径）：本包取上游**官方发布物** —— SourceForge
# 项目 odessa（Debian 签名 rifiuti_20040505-4.dsc 声明的 Homepage 即 sf.net/projects/odessa）
# 的 files/Rifiuti/20040505_1/rifiuti_20040505_1.tar.gz，本件取它在官方下载主机上的规范直链
# downloads.sourceforge.net/project/odessa/…。本轮一手 GET（B 机、默认 curl UA）：HTTP 200 /
# Content-Type application/x-gzip / 2823 字节 / sha256 与下行声明值逐字相等 / 1 跳，跳转终链
# master.dl.sourceforge.net/project/…?<每次新签的时效令牌> ⇒ 不写镜像名、不写令牌。页面式
# …/download 形态 curl 侧可取，但 conan 的 get() 按 URL 末段推类型 ⇒ 末段无扩展名即 BadZipFile
# Debian 池里的 rifiuti_20040505.orig.tar.gz 不再作取源址，只作版本与哈希核验旁证：本轮一手对账
# = 两枚 tar 包 cmp 逐字节相同（各 2823B、同一 sha256）、解包树 diff -rq 零差异（differ 行数 0）、
# CHANGES / Readme.txt / src/Makefile / src/rifiuti.c 四文件 sha256 逐个全等 ⇒ 池内 .orig 与官方件
# 是**字节级同一枚发布物**。命令原文与逐字输出见 reports/source-official-url-evidence.md。
# 判"可取"的三个陷阱（本轮一手，别只看 HTTP 码）：① catch-all —— www.mirbsd.de 对任意深路径都回
# 200 + text/html + 28339 字节（首页本体，与任何 tar 无关）；② 自带浏览器 User-Agent 反被
# SourceForge 反爬拒（实测 403 + text/html 5929 字节），默认 curl UA 才拿到那 2823 字节；
# ③ www.foundstone.com（作者 2004 年的邮箱域）TCP 443 超时（curl rc=28）⇒ "作者域死了"不等于
# "上游主页无发布物"，本件旧注释正是把前者写成了后者。
