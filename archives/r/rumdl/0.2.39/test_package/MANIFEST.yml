# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51：上游测试三步法申报）

package: rumdl/0.2.39
homepage: "https://github.com/rvben/rumdl"

# 上游测试命令（cargo 项目）。上游 CI 主门 = `make test-ci` = `cargo nextest run --profile ci`。
# 本平台 rust-toolchain/1.97.1 基础设施包不含 cargo-nextest，故用等价的 `cargo test` 入口；
# doc-test 除外：包内不含 rustdoc 二进制。
upstream_check_command: "cargo nextest run --profile ci   # 上游 make test-ci（本平台无 nextest，用 cargo test 等价入口）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
# 实际命令（build() 内执行）。`--lib --test lib` 覆盖 src 单元测试与 tests/ 集成 crate。
# 跳过项：上游 CI 自身的 perf/memory 过滤 + 平台不适用用例（见 reports/test-report.md）。
upstream_test_command: >-
  cargo test --release --locked --target aarch64-unknown-linux-ohos --lib --test lib --no-fail-fast --
  --skip perf:: --skip performance --skip benchmark --skip memory --skip linear_complexity --skip scaling
  --skip test_permission_denied_config --skip preserves_unix_permissions
  --skip unreadable_file_is_a_tool_error --skip fmt_preserves_file_permissions
  --skip test_create_default_config_permission_error --skip test_cache_prevents_duplicate_validation
  --skip test_auto_discovery_vs_explicit_config --skip test_config_dir_discovery
  --skip test_config_dir_precedence --skip test_project_root_with_auto_discovery
  --skip test_user_configuration_discovery --skip test_user_configuration_file_precedence
  --skip test_per_file_ignores_with_actual_relative_path --skip test_relative_path_with_single_component
  --skip test_md051_readme_headings

# 上游测试用例清点（静态 `#[test]`/`#[tokio::test]` 计数，见 reports/test-report.md）
#   src/**           6573
#   tests/**         5207
#   tests/ 集成 crate 269 个 .rs，单一 test 目标 `lib`（tests/lib.rs）
upstream_tests:
  - file: "src/**/*.rs"
    description: "src 单元测试（lib 目标 `rumdl_lib`）：实测 6353 通过 / 2 忽略（+24 过滤）"
    command: "cargo test --release --locked --target aarch64-unknown-linux-ohos --lib -- <skips>"
  - file: "tests/**/*.rs"
    description: "集成测试（test 目标 `lib`）：实测 5170 通过 / 0 忽略（+126 过滤）"
    command: "cargo test --release --locked --target aarch64-unknown-linux-ohos --test lib -- <skips>"

# 上游真实测试入口证据
upstream_entry_points:
  - file: "Makefile"
    detail: "test: cargo nextest run --profile dev（:246）; test-legacy: cargo test（:249）; test-ci: cargo nextest run --profile ci（:273）; test-doc: cargo test --doc（:279）"
  - file: ".config/nextest.toml"
    detail: "[profile.ci] default-filter = 'not test(/^perf::/) and not test(/performance|benchmark|memory|linear_complexity|scaling/)'（上游 CI 自身排除 perf/memory 类）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_rumdl.py
    description: "消费者冒烟+功能：--version 报 0.2.39 / --help 列出 check·fmt / `check` 检出规则(MD009) / `fmt` 实改文件"
    command: "python3 test_rumdl.py"

# 鸿蒙特有测试 (HarmonyOS-specific)
harmonyos_specific_tests:
  - file: test_rumdl.py
    description: "鸿蒙特有测试 4 项（AArch64 ELF / OHOS musl loader / OHOS code signature / 产物完整性）"
    command: "PACKAGE_FOLDER=<pkg> python3 test_rumdl.py"
    assertion_count: 4

# 依赖测试：rumdl 为纯 Rust 产物，依赖闭包无 C/C++ 目标依赖包消费面，故无 dependency_tests。
dependency_tests: []

# 测试断言总数 (近似值, 用于质量评估)
# 上游 cargo 测试 11523（通过）+ test_package 消费者冒烟 4 + 鸿蒙特有测试 4
assertion_count: 11531
