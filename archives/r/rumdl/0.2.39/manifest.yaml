# 版本级 manifest — rumdl 0.2.39

version: "0.2.39"
software: "rumdl"

# 编译状态
# built：HarmonyOS PC (aarch64) 本地交叉编译 + 上游测试 + test_package 通过；
# Rust 工具链由制品仓基础设施包 rust-toolchain/1.97.1 提供（tool_requires），
# 不依赖系统 cargo、不使用 rustup 引导（rustup 无法识别 HarmonyOS 宿主）。
status: built

build_date: "2026-10-01"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39；上游 GitHub tag 归档，内含 Cargo.lock）
  url: "https://github.com/rvben/rumdl/archive/refs/tags/v0.2.39.tar.gz"
  sha256: "34791c687b2c9fde08125a6de4b748ea7dfb1765a9984179ac711d895bf72d8d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（Rust cargo 项目，配方内自管 cargo 命令）
  system: custom
  configure_options: []
  # 编译依赖列表（纯 Rust 项目，无 C/C++ 目标依赖）
  dependencies: []
  # 构建期工具依赖（tool_requires）
  build_tools:
    - "rust-toolchain/1.97.1"
  # 编译器（链接器为 OHOS SDK aarch64-unknown-linux-ohos-clang）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无：上游代码零修改，纯 Rust 无平台相关编译问题）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 Rust 工具型包在 OHOS 的通用配方形态：tool_requires rust-toolchain/1.97.1 + 自签名工具链（cargo/rustc/librustc_driver）+ harmonybrew cargo 运行库（openssl@3/zlib-ng）+ rsproxy/CA + 可写 TMPDIR"
  - "rust-toolchain/1.97.1 包内 rustc dlopen 的 librustc_driver-*.so 需自签名（OHOS 拒绝加载未签名 .so），且其依赖的 OHOS libc++_shared.so 需显式入 LD_LIBRARY_PATH"
  - "cargo test --release --locked --tests --target aarch64-unknown-linux-ohos 在真机（host=target）直接可跑"

# ============================================================
# 交付物
# ============================================================

artifacts:
  - "bin/rumdl"
