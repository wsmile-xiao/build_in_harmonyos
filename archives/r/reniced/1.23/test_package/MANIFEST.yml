# test_package/MANIFEST.yml

package: reniced/1.23
homepage: "https://github.com/mmitch/reniced"

upstream_check_command: "perl -c reniced && (cd test && bash run-tests)"
upstream_test_in_build: true
upstream_test_command: "Conan build() runs perl -c reniced plus the upstream bash run-tests suite (three no-op mode tests with mocked ps) when can_run(self) is true and bash is available"

upstream_tests:
  - file: test/
    source: "reniced-1.23/test/*.test + .expected + mocked ps"
    description: "Official tag archive contains 3 upstream shell tests (show-help, normal-run, verbose-run). All run reniced in no-op or help mode against a mocked ps command, so no privileges or real process-table access are required. bash is required by run-tests and the .test wrappers; when bash is unavailable the suite degrades with a warning and test_package provides equivalent no-op verification."
    command: "cd test && bash run-tests"

test_package_tests:
  - file: test_reniced.py
    description: "Validates packaged artifacts, the packaged RENICED_PS_CMD override, reniced -h usage/version output on the packaged file, and an upstream-equivalent no-op run of the packaged script with the ps command substituted via RENICED_PS_CMD, asserting output identical to upstream normal-run.expected."
    command: "python3 test_reniced.py <package_folder> <perl>"
  - file: conanfile.py
    description: "Checks package layout and invokes test_reniced.py through Conan VirtualRunEnv when can_run(self) is true."
    command: "conan test"

assertion_count: 5
