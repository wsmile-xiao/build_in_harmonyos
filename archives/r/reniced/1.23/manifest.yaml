software: reniced
version: "1.23"
status: built
build_date: "2026-10-01"
build_system: custom-perl

source:
  url:
    - "https://ghfast.top/https://github.com/mmitch/reniced/archive/refs/tags/v1.23.tar.gz"
    - "https://gh-proxy.com/https://github.com/mmitch/reniced/archive/refs/tags/v1.23.tar.gz"
    - "https://mirror.ghproxy.com/https://github.com/mmitch/reniced/archive/refs/tags/v1.23.tar.gz"
    - "https://github.com/mmitch/reniced/archive/refs/tags/v1.23.tar.gz"
  sha256: "237f8d54e3885eb0a4fad881ece5b51fbeaf74c63191ad0c9f017c38598be390"
  tar_format: tar.gz
  archive_root: "reniced-1.23"

dependencies:
  required:
    - perl/5.42.2.3
  optional:
    - "ps command at runtime (toybox ps on OHOS) for real process-table scans"
    - "ionice command at runtime for IO priority rules"
    - "BSD::Resource Perl module (upstream code falls back to PRIO_PROCESS=0 without it)"

build:
  system: custom
  steps:
    - "download official GitHub v1.23 tag archive (SHA256 pinned)"
    - "verify upstream artifacts (reniced, reniced.conf, COPYRIGHT, README.md)"
    - "run perl -c reniced syntax check when can_run(self)"
    - "run the 3 upstream no-op tests from a scratch copy with explicit-interpreter invocation and a mocked ps via RENICED_PS_CMD when bash is available"
    - "install reniced launcher (with one-line RENICED_PS_CMD override, default behavior unchanged), example config, docs, license"

patches_applied: []

test_results:
  type: local-static + true-device-shadow-ci
  upstream_total_files: 3
  upstream_selected_files: 3
  selected_assertions: 3
  test_package_assertions: 5
  passed: 3
  failed: 0
  note: |
    Local Windows PATH has no conan and no perl, so conan create and perl -c
    were not run locally.  Static verification completed: GitHub v1.23 tag
    tarball SHA256 matched
    237f8d54e3885eb0a4fad881ece5b51fbeaf74c63191ad0c9f017c38598be390;
    archive contains reniced, reniced.conf, COPYRIGHT, HISTORY, README.md,
    Makefile and test/.  Python compile checks, YAML key checks and
    git diff --check passed.  True-device shadow CI on OHOS aarch64
    (job reniced-1.23-20261001, run r8) passed with exit code 0 and
    100% pass rate: G0/KC/JC/L0/L1/L4/L5 pass, L2 non-blocking skip
    (direct exec of the packaged script on the HMDFS Conan cache is
    forbidden on the device, interpreter-explicit execution verified in
    test_package instead, mysqltuner precedent).  build() ran perl -c
    (syntax OK) and all 3 upstream no-op tests with output identical to
    upstream .expected files.  test_package passed 5 assertion groups
    and the L1e destructive negative test confirmed genuine dependence
    on the packaged artifacts.  Two OHOS adaptations are documented in
    notes.md: explicit-interpreter invocation for the upstream test
    harness (device forbids exec of newly created files) and a one-line
    RENICED_PS_CMD override in the packaged script (default behavior
    unchanged).

compatibility:
  level: medium
  notes: "Pure Perl CLI; no compilation. OHOS package rewrites shebang to /data/service/hnp/bin/perl. Real renice/ionice actions need root and an ionice command; upstream tests and test_package use no-op mode with a mocked ps, so no privileges are required for validation."

knowledge_drafts:
  - "knowledge/drafts/DRAFT-reniced-isolated-job-conan-setup-remote.{md,kv}"
  - "knowledge/drafts/DRAFT-reniced-external-cmd-env-prefix-override.{md,kv}"

knowledge_gained:
  - "reniced 1.23 is a single-file Perl application by Christian Garbs; the only hard runtime dependency is a perl interpreter plus the ps command."
  - "The documented 'use BSD::Resource' appears in the POD only; actual code loads it via eval with a PRIO_PROCESS=0 fallback, so no extra Perl module dependency is required for packaging."
  - "All three upstream tests run reniced in help/no-op mode against a mocked ps command, making the whole upstream suite runnable on OHOS without root or /proc access."
  - "OHOS device forbids exec'ing any newly created file regardless of permissions/SELinux partition (bad interpreter / Permission denied); shell wrappers, the reniced script and mocked ps must all be invoked through explicit interpreter paths."
  - "Isolated shadow-CI jobs created by ohos-prepare-isolated-conan-job.sh need ci/conan/setup.sh run once in their CONAN_HOME (remote 'ohpcd' is otherwise absent) and /data/service/hnp/bin prepended to PATH for bash/perl resolution."

difficulty_candidate:
  class: C
  rationale: |
    Pure Perl single-file application with a self-contained no-op upstream
    test suite.  No compilation, no external services, no privileged
    syscalls needed for validation.  Residual risk is limited to bash/diff
    availability for the upstream suite wrapper and toybox ps syntax for
    real process scans, both observable on shadow CI.

references:
  - "https://github.com/mmitch/reniced"
  - "https://github.com/mmitch/reniced/releases/tag/v1.23"
