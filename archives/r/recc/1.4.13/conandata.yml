sources:
  buildbox:
    url: "https://gitlab.com/BuildGrid/buildbox/buildbox/-/archive/1.4.13/buildbox-1.4.13.tar.gz"
    filename: "buildbox-1.4.13.tar.gz"
    sha256: "180a6cb1763116dfd540a2ff67e603061a2dc6d02f7613caafdf96a4566e66a2"

patches:
  - patch_file: "patches/0001-openssl-target.patch"
    patch_description: "Registry openssl exports openssl::openssl (not OpenSSL::Crypto); accept the registry target name in the top-level CMakeLists"
    patch_type: "portability"
  - patch_file: "patches/0002-openssl-config.patch"
    patch_description: "Same registry openssl target fallback in cmake/BuildboxCommonConfig.cmake"
    patch_type: "portability"
  - patch_file: "patches/0003-tomlplusplus-link.patch"
    patch_description: "Link tomlplusplus::tomlplusplus in common/CMakeLists.txt so toml++ headers propagate"
    patch_type: "portability"
  - patch_file: "patches/0004-filesystem-path-hash.patch"
    patch_description: "OHOS libc++ lacks std::hash<std::filesystem::path>; add platform-agnostic PathHash functor and pass it explicitly as the unordered_map hash template argument (no platform macro)"
    patch_type: "portability"
  - patch_file: "patches/0005-systypes.patch"
    patch_description: "OHOS musl does not define uid_t/gid_t transitively; include <sys/types.h> in buildboxcommon_systemutils.h"
    patch_type: "portability"
  - patch_file: "patches/0006-identity-systypes.patch"
    patch_description: "Same <sys/types.h> include for buildboxcommon_identity.h"
    patch_type: "portability"
  - patch_file: "patches/0007-platformutils-sstream.patch"
    patch_description: "buildboxcommon_platformutils.cpp uses stringstream without including <sstream>"
    patch_type: "portability"
  - patch_file: "patches/0008a-streaming-sstream.patch"
    patch_description: "buildboxcommon_streamingstandardoutputfilemonitor.cpp uses ostringstream without <sstream>"
    patch_type: "portability"
  - patch_file: "patches/0008b-streaming-ifstream-sstream.patch"
    patch_description: "buildboxcommon_streamingstandardoutputifstreamfilemonitor.cpp uses ostringstream without <sstream>"
    patch_type: "portability"
  - patch_file: "patches/0010-grpctestserver-stop_token.patch"
    patch_description: "OHOS libc++ has no <stop_token>/std::jthread; use std::thread + std::atomic<bool> and join the thread in the destructor"
    patch_type: "portability"
  - patch_file: "patches/0011-platforminfo.patch"
    patch_description: "OHOS uname -r returns non-numeric 'HongMeng Kernel 1.12.0'; make PlatformInfo version parsing tolerant and probe openat2 in a child process (POSIX, no platform macro) so seccomp SIGSYS cannot kill the caller"
    patch_type: "portability"
