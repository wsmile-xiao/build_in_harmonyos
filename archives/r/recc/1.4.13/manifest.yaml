knowledge_gained:
  - "OHOS `uname -r` 返回非数字版本串（如 'HongMeng Kernel 1.12.0'），stoi 解析需容错"
  - "OHOS 内核无 openat2 系统调用且 seccomp 拦截会 SIGSYS 杀进程，探测必须禁用"
  - "OHOS libc++ 缺 <stop_token>/std::jthread，需改用 std::thread + atomic"
  - "OHOS 系统 /tmp 只读，TemporaryFile/TemporaryDirectory 测试无法通过（上游硬编码 /tmp 断言）"
  - "OHOS 沙箱拒绝 linkat 硬链接（EPERM），CAS 硬链接功能不可用"
  - "buildbox 的 PCH 与 OHOS clang -fPIE 冲突，须禁用 PCH"

test_summary:
  total: 95
  passed: 81
  failed: 14
  pass_rate: "85.3%"
  failed_categories:
    - "OHOS /tmp 只读（EROFS）：temporaryfile/statsdpublisher/actionbuilder"
