software: rig
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.11"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-06"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/rig/rig/1.11/rig-1.11.tar.gz"

  # 源码校验和
  sha256: "00bfc970d5c038c1e68bc356c6aa6f9a12995914b7d4fda69897622cb5b77ab8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: makefile

  # 配置选项列表
  configure_options:
    - "PREFIX?=~/usr/local"
    - "CXX=clang++"
    - "CXXFLAGS=-fPIC -O2"
    - "MANDIR=${PREFIX}/share/man"
    - "DATADIR=${PREFIX}/share/rig"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Makefile 项目需要将 PREFIX 改为可覆盖模式（PREFIX?=）以支持自定义安装路径"
  - "简单 Makefile 项目编译器应使用环境变量 $(CXX) $(CXXFLAGS) 而非硬编码 g++"
  - "install 命令中的 -g 0 -o 0 参数在非 root 用户环境下会失败，需移除"
  - "binary-sign-tool 签名需使用完整参数：sign -inFile <input> -outFile <output> -selfSign 1"
  - "rig 不支持 --version 参数（设计如此），功能测试时用 --help 替代"
  - "MANDIR 传统路径 ${PREFIX}/man 应改为 ${PREFIX}/share/man 符合现代标准"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
