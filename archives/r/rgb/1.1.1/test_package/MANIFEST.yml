# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: rgb/1.1.1
homepage: "https://gitlab.freedesktop.org/xorg/app/rgb"

# 上游源码审计：rgb 1.1.1 发布包确认无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.am"
    reason: "只有 bin_PROGRAMS = showrgb、SUBDIRS = man 与 if RGB_DB 条件段；grep -E 'check|TESTS' 在 Makefile.am 上结果为空，无 TESTS / check_PROGRAMS / check-local 目标，make check 无用例可执行。静态声明用例数 N_static = 0。"
  - source: "configure.ac"
    reason: "仅 AC_CHECK_FUNCS(asprintf)、PKG_CHECK_MODULES(RGB, xproto)、--with-rgb-db-* 与 AC_CONFIG_FILES([Makefile man/Makefile])；无测试相关宏、无 AC_CONFIG_TESTDIR。"
  - source: "man/Makefile.am"
    reason: "只有 appmandir/appman_PRE/appman_DATA 与 .man.$(APP_MAN_SUFFIX) 规则；无测试目标。"
  - source: "源码树"
    reason: "发布包无 tests/、test/ 目录，无 *_test.* / *_spec.* 文件；rgb.c / showrgb.c / rgb.h 为产品代码，rgb.txt 与 others/*.txt 为数据资产（非测试语料，从不被任何 check 目标读取）。"
  - conclusion: "上游未提供自动化测试套件，make check 不执行任何用例（0 执行系上游事实而非适配遗漏）；由 test_package 真实运行 showrgb 并断言行为，共 5 条消费者断言。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_rgb.sh
    description: "真实执行打包后的 showrgb 二进制并做 5 条行为断言：(1) --version 输出上游 PACKAGE_STRING 'rgb 1.1.1'；(2) --help 退出码 0；(3) 无参运行读取编译期烧入 RGB_DB 的包内默认库（showrgb 自动补 .txt 后缀），断言解析条目数 >= 100 且 'red' 解析为 255 0 0——同时证明 make install 把 rgb.txt 放到了正确位置；(4) 显式传入本脚本自造的独立小库路径（按 man 页约定不带 .txt 后缀），断言 4 条颜色精确往返且 agentred == 255 0 0，证明 dbname 参数与 .txt 拼接逻辑真的生效；(5) 传入不存在的库路径，断言非零退出且打印上游错误串 'unable to open rgb database'。text 模式 showrgb 不链接任何 X 客户端库，故无需 LD_PRELOAD/LD_LIBRARY_PATH；脚本为 POSIX sh，以 HMBS 注入的 SHELL 执行（HMBS [shell_getcwd]）。"
    command: "$SHELL test_rgb.sh <package>/bin/showrgb <package_folder>"

assertion_count: 5
