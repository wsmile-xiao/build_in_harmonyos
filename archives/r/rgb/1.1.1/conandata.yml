# conandata.yml — rgb 1.1.1
# 源码: X.Org 官方发布归档 (https://xorg.freedesktop.org/archive/individual/app/)
# R39: 官方正式源（纯 https，不含任何本地协议 URL、无镜像注入）；
#      sha256 为真机下载后 sha256sum 实测值
#      （www.x.org/releases/... 现返回 301 并降级跳转到 xorg.freedesktop.org/archive/...，
#       本 URL 直接写重定向后的最终地址，与仓库 xeyes-1.3.1 同族配方一致）

sources:
  rgb:
    url:
      - "https://xorg.freedesktop.org/archive/individual/app/rgb-1.1.1.tar.gz"
      - "https://www.x.org/archive/individual/app/rgb-1.1.1.tar.gz"
    sha256: "9bceca0821a46ff54989ab08ab00d6dd87eb2779fc15165d848eaa0ddd742fbe"

# 持久补丁：两处 OHOS 适配点按仓内 x.org 先例（archives/l/libfontenc/1.1.7 同族同形）
# 以 conandata 声明、由 build() 的 apply_conandata_patches 真实应用——
#   0001 让 config.guess 认得 uname -s=HarmonyOS（配方因此无需写死 --build/--host 三元组）
#   0002 把 configure 内嵌 config.status 的 `umask 077` 改 022（E011/E118）并加 ac_pwd 回退
# 配方 build() 里另有的 _rewrite_configure() 运行时改写与 0002 同义，补丁到位后它是幂等兜底。
patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess recognize HarmonyOS (uname -s=HarmonyOS) -> aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "configure umask 077->022 (HMDFS mktemp dir, E011/E118) + ac_pwd fallback for missing getcwd"
    patch_type: "portability"
