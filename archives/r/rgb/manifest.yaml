software: rgb
display: "rgb"
description: "X11 rgb 颜色名数据库工具集（text 模式：showrgb 转储器 + rgb.txt 数据；同名 rgb 数据库编译器在本平台不可构建，见 1.1.1/notes.md §1-§2）"
category: gfx
homepage: "https://gitlab.freedesktop.org/xorg/app/rgb"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure.ac 只有 PKG_CHECK_MODULES(RGB, xproto)，xproto.pc 与 X11 头由已发布的 xorgproto/2025.1 提供（actiona/clipnotify/comptty 同款）；text 模式 showrgb 不链接任何 X 客户端库，无需 rpath/LD_PRELOAD"
    - "构建模式受依赖红线约束：上游 Makefile.am 的 rgb 二进制在 if RGB_DB 条件段内，而 configure.ac 的 dbm/ndbm 分支无条件 PKG_CHECK_MODULES(XORG, [xorg-server]) 并需 dbm.h/ndbm.h；xorg-server 在本仓有归档目录但未发布到 ohpcd 制品仓（preflight 精确查询 21.1.15 → 未发布）、OHOS NDK sysroot 无 dbm.h/ndbm.h（ls 零命中 + clang -c 探针 file not found） ⇒ 按 W0 只能取上游默认 text 模式"
    - "HMDFS getcwd：conan 缓存父目录 getcwd() 不可达，configure 顶部 pwd 判定 abort 'working directory cannot be determined'；固定 cwd 到 build_folder + 预置 PWD，并把 configure 的 pwd 判定改写为回退 $PWD（nspr/aribb24/libgsf/xeyes 同款）"
    - "E011/E114：configure 创建 config.status 临时目录用 umask 077，HMDFS 上后续读取失败，统一改写为 022"
    - "OHOS 内核拒绝未签名 ELF：package() 对 bin/ 下二进制用 binary-sign-tool 自签（clinfo/xeyes 同款）"
    - "上游无测试套件（Makefile.am grep -E 'check|TESTS' 为空、无 tests/ 目录），N_static=0；test_package 以 5 条真实运行 showrgb 的行为断言补上消费者测试"
    - "www.x.org/releases/individual/app/rgb-1.1.1.tar.gz 现返回 301 且 Location 降级到 xorg.freedesktop.org/archive/... ；conandata 直接写重定向后的最终官方地址（同族 xeyes-1.3.1 一致），下载必须带 -L 否则只存下 91 字节 HTML 误判为包损坏"
  common_dependencies:
    - "xorgproto/2025.1"

versions:
  "1.1.1":
    status: built
    build_date: "2026-09-23"
    source_url: "https://xorg.freedesktop.org/archive/individual/app/rgb-1.1.1.tar.gz"
