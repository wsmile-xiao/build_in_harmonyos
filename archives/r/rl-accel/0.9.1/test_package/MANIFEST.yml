# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rl-accel/0.9.1
homepage: "http://www.reportlab.com/"

# 上游测试入口（R51 如实申报）
# 上游 sdist 的 tests/ 只有 2 个可执行脚本，均无 pytest/unittest 注册：
#   tests/testcs.py  —— calcChecksum 冒烟（打印校验和）
#   tests/testrc.py  —— unicode2T1 引用计数一致性（打印前后引用计数）
upstream_check_command: "cd <src> && python3 tests/testcs.py && python3 tests/testrc.py"

# 上游测试在 conanfile.py build() 内真实执行（用 python 依赖的解释器 + 校验输出）
upstream_test_in_build: true
upstream_test_command: "python3 tests/testcs.py; python3 tests/testrc.py（cwd=源码根，PYTHONPATH=构建目录）"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/testcs.py
    source: rl_accel-0.9.1/tests/testcs.py
    description: "calcChecksum(b'Hello cruel world!') 冒烟（预期输出 =142323306）"
    command: "python3 tests/testcs.py"
  - file: tests/testrc.py
    source: rl_accel-0.9.1/tests/testrc.py
    description: "unicode2T1 调用前后的对象引用计数一致性检查（两行序列须相同且无 '!!!!!'）"
    command: "python3 tests/testrc.py"

# 测试用例统计（实测口径）
upstream_tests_total: 2
upstream_tests_passed: 2
upstream_tests_failed: 0
upstream_tests_skipped: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_rl_accel.py
    description: >-
      消费者视角真实调用全部公开 API（R34）：version + 11 个函数存在性、
      calcChecksum（与纯 Python 参考实现逐值比对）、add32/hex32、escapePDF、
      fp_str（复刻 _fp_one 参考实现）、asciiBase85 编解码（与 stdlib
      base64.a85encode 等价 + 往返）、unicode2T1 / instanceStringWidthT1/TTF
      （构造上游语义的字体对象，精确数值）、sameFrag、参数类型校验
    command: "python3 test_rl_accel.py <site-packages-dir>"
  - file: test_rl_accel_ohos.py
    description: >-
      鸿蒙专项测试（新增）：产物 ELF 为 AArch64 64 位小端、带 .codesign 段
      （OHOS 沙箱 dlopen 前提）、NEEDED 含 libpython3.12.so.1.0（musl 适配点）、
      产物名 _rl_accel.abi3.so，并在 musl 运行期复算 fp_str/calcChecksum/
      asciiBase85 确认无平台偏差
    command: "python3 test_rl_accel_ohos.py <path-to-_rl_accel.abi3.so>"

# 测试断言总数（实测计数，非近似值）
#   test_rl_accel.py        64 项
#   test_rl_accel_ohos.py   13 项
assertion_count: 77
