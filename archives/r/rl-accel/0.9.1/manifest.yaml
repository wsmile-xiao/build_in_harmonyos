# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CPython C 扩展包（setuptools + Extension、无 Python 包）会被 lang-preflight 按 pyproject.toml/setup.py 误判为 python；按 R47 D.4「辅助脚本不算主体」（setup.py 是构建脚本、tests/*.py 是测试脚本，唯一编译产物 .c 才是主体）判为 c/cpp 后继续适配。同口径见 DRAFT-cmsis-dsp/DRAFT-exr_image（main-body-first-then-compat-family）"
  - "OHOS/musl 下 Python 扩展必须显式 -lpython3.12：glibc 下 abi3 模块不需要 NEEDED libpython（符号由主解释器解析），musl 下不显式链接则符号解析失败。本体现在条目的落地场景是『上游 abi3 wheel + musl』的交叉，产物 NEEDED 里能直接看到 libpython3.12.so.1.0 (ref: E004)"
  - "无 setuptools 制品时，单文件扩展可直接调 clang 复现 setup.py build_ext（不需要 pip 引导 setuptools）——宏/产物名对齐上游 wheel 即可（-DPy_LIMITED_API + _rl_accel.abi3.so）"

