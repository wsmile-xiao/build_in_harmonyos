# ============================================================
# 软件识别
# ============================================================

software_identity:
  note: |
    rl-accel 是 ReportLab PDF 工具包的**加速扩展**，交付物只有一个 CPython
    C 扩展模块 `_rl_accel`（编译自 src/_rl_accel.c，setup.py 中 packages=[]）。
    PyPI 上发布的 wheel 内也只有一个 `_rl_accel.abi3.so`（cp37-abi3，按
    Python 3.7 有限 API 编译）。本配方按同一宏与产物名复现。
    上游仓库没有公开的 Git 代码托管页（首页即 http://www.reportlab.com/），
    PyPI 是官方唯一分发渠道（Owner=reportlab）。

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "python/3.12.9"
  optional: []
  note: |
    · python/3.12.9 —— 提供 Python.h 与 libpython3.12.so。musl 不把 Python
      符号导出到全局符号表，故扩展必须显式 `-lpython3.12`（产物 NEEDED 带
      libpython3.12.so.1.0）；glibc 下同一 abi3 模块无需该 NEEDED，这正是
      本包在 OHOS 上的适配点。
    · 上游无任何 C/C++ 三方依赖（Extension 未声明 libraries）。
    · 构建期不需要 setuptools：ohpcd 无 setuptools 制品（按 PF4 不写成
      tool_requires），本配方直接调 clang，等价上游 `setup.py build_ext`。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    上游产物为单个扩展模块，构建即等价 `setup.py build_ext`：
      clang -shared -fPIC -O2 -DPy_LIMITED_API=0x03070000 \
            -I<python>/include/python3.12 src/_rl_accel.c \
            -o _rl_accel.abi3.so -L<python>/lib -lpython3.12
    `-DPy_LIMITED_API=0x03070000` 与产物名 `_rl_accel.abi3.so` 均对齐上游
    abi3 wheel（Tag: cp37-abi3）。产物安装到 <prefix>/lib/python3.12/site-packages/。
    OHOS clang 自动为产物写入 .codesign 段（存量校验，见 package()）。

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues: []
  notes: |
    **未改动上游任何源码**。扩展在 OHOS aarch64（clang 15 / musl）上编译、
    加载、全部公开函数调用正常（消费者测试 64/64，鸿蒙专项 13/13）。

# ============================================================
# 语言判定说明（R47）
# ============================================================

language_note:
  task_language: cpp
  detected_language: python
  resolution: c/cpp（main-body-first-then-compat-family）
  detail: |
    lang-preflight 依据 pyproject.toml/setup.py 与文件名计数（python:3、c:1）
    判为 python，与任务语言 cpp 不符。按 R47 附录 D.4 边界规则「辅助脚本
    （构建脚本是 python 等）不算主体语言」，逐项核验主库主体：
      · 唯一编译产物 = src/_rl_accel.c（1342 行 C，模块全部功能所在）→ 主体 C；
      · setup.py 是构建脚本、tests/*.py 是上游测试脚本 → 辅助脚本，不计入主体。
    故按主库主体判 detected=c/cpp（c↔cpp 兼容族，conan 流程通吃）后继续。
    同口径先例：knowledge/DRAFT-cmsis-dsp-*-lang-preflight-pyproject-python-misdetect、
    knowledge/DRAFT-exr_image-*-lang-preflight-aux-manifest（rec_approach=
    main-body-first-then-compat-family）。

