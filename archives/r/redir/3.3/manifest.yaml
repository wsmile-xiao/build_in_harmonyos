# 版本级 manifest — redir 3.3
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.3"

software: "redir"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub 发布 tag）
  url: "https://github.com/troglobit/redir/archive/refs/tags/v3.3.tar.gz"

  # 源码校验和（原始发布 tarball）
  sha256: "7311731097aabd390bd4d8f390980278b16b25d0bae8e21a9e768cd824f846f7"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--with-libwrap=no"

  # 编译依赖列表（格式: name/version）
  # libwrap/tcpd 为上游可选依赖（缺失自动降级），OHOS 未发布，禁用
  dependencies: []

  # 构建工具链（tool_requires）
  tool_requires:
    - "automake/1.18"
    - "libtool/2.5.4"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ref: E443|E337 — GitHub git archive 快照不含 configure，需 tool_requires automake/1.18 + libtool/2.5.4 并 autoreconf -fi 引导（同 abiword-plugin-clarisworks 先例）"
  - "ref: E114|E129 — config.status 内 umask 077 + mktemp -d 在 HMDFS 上建 drwx--S--- 临时目录不可写（subs1.awk Permission denied）；生成 configure 后需移除 umask 077"
  - "ref: E424 — 纯 CLI 工具包（package_type=application，无库产物）须在软件级目录 archives/r/redir/commands.json 声明 type=tool（L0k/R38）"
  - "ref: E298|E428 — CLI 工具 test_package 应使用 VirtualRunEnv + env=conanrun，并将包内二进制绝对路径传给测试脚本，不依赖 PATH 解析"