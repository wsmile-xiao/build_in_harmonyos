# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# redir 3.3: 上游为单文件 CLI（redir.c），Makefile.am 仅声明
#   bin_PROGRAMS = redir（无 check/distcheck 之外的自定义测试目标，
#   上游 release 目标基于 `distcheck`，无独立单元测试）。
#   因此上游独立用例数 = 0，实际验证由本 test_package 的
#   消费者端到端 TCP 重定向测试承担。

package: redir/3.3
homepage: "https://troglobit.com/redir.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无独立测试源：单文件 C 程序，Makefile.am 无 test/check 目标。
# distcheck（发行验证）不是针对库功能的单元测试，不计入上游用例。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_redir.sh
    description: "消费者端到端验证：1) redir -h CLI 冒烟 2) 建立回显服务，经安装的 redir 二进制建立 TCP 转发隧道，往返数据精确匹配"
    command: "sh test_redir.sh <installed bin>/redir"

# 测试断言总数
assertion_count: 2