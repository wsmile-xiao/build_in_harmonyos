software: rinetd
display: "rinetd"
description: "Internet TCP redirection server"
category: network
homepage: "https://github.com/samhocevar/rinetd"
license: GPL-2.0-or-later
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "configure 脚本使用 umask 077 创建临时目录，HMDFS 文件系统上会导致目录权限异常（drwx--S---），需改为 umask 022"
    - "rinetd 安装到 sbin/ 而非 bin/，G2 功能验证需注意路径"
    - "无编译依赖，仅依赖标准 C 库和 POSIX 系统调用"
  common_dependencies: []

# 版本索引
versions:
  "0.73":
    status: built
    build_date: "2026-06-25"
