# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rsem/1.3.3
homepage: "https://github.com/deweylab/RSEM"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "none (upstream has no test target)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 RSEM 仓库无任何测试套件：
#   - 无 tests/ 目录（samtools-1.3/test/ 属于捆绑的 samtools 子项目）
#   - Makefile 无 test/check 目标（make -n check 报 "No rule to make target"）
# 因此"上游测试"一项为空，消费者验证由 test_package 功能测试补齐
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 上游无测试用例，以下为本适配补充的功能测试（可加 0.5 分项）
test_package_tests:
  - file: test_package/test_rsem.py
    source: test_package/test_rsem.py
    description: "功能流水线测试：SAM->BAM 转换、SAM 校验、read index 构建、BAM 读深统计、usage 冒烟"
    command: "python3 test_package/test_rsem.py <bin_dir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
