software: rust-toolchain
display: "rust-toolchain"
description: "Rust 编译器工具链包（rustc + cargo + aarch64-unknown-linux-ohos 目标标准库），经 rustup/rsproxy 引导，作为 tool_requires 供 Rust 配方在竞赛 CI 构建"
category: toolchain
homepage: "https://www.rust-lang.org/"
license: "MIT OR Apache-2.0"
build_system: custom

ohos_adaptation:
  key_points:
    - "工具链为构建期经 rustup（rsproxy.cn 镜像）引导安装，非源码 tarball"
    - "安装 stable rustc/cargo + aarch64-unknown-linux-ohos 目标标准库"
    - "cargo registry 指向 rsproxy 镜像（config.toml）"
    - "包内自包含 CARGO_HOME/RUSTUP_HOME，下游 tool_requires 自动获得 PATH 与环境"
  common_dependencies: []

versions:
  "1.97.1":
    status: built
    build_date: "2026-09-06"
