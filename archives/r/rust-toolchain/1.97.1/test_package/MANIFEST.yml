# test_package/MANIFEST.yml

package: rust-toolchain/1.97.1
homepage: "https://www.rust-lang.org/"

# 上游测试统计说明：
# rust 官方预编译发行包（rust-1.97.1-aarch64-unknown-linux-ohos.tar.xz，132MB）
# 共 246 个条目、0 个 test 文件——完整测试套件在 rust-lang/rust 源码仓
# （rustc/cargo 全量测试需自举构建），预编译发行包不携带，故上游用例数 = 0。
# 工具链可用性以两层验证集覆盖（见 test_package_tests）：
#   A) 静态组件验证 10 项：组件存在性 / ELF / aarch64 机器码 / sysroot rlib 完整性
#   B) 动态 exec 验证 6 项：rustc/cargo 版本、aarch64-unknown-linux-ohos target、
#      交叉编译并本机运行 hello、cargo test 上游 crate cfg-if 1.0（rsproxy 镜像）
# 本机 HarmonyOS HMDFS 沙箱（E046/hmmac）下 B 层走警告降级（exit 0），
# CI 干净环境严格执行。本机静态 A 层实测 10/10 PASS。
# 鸿蒙特有测试统计：16 项（静态 10 + 动态 6，见 test_package_tests），
# 对应 PR 描述适配后统计表「鸿蒙特有测试」行（评审规则 12 口径）。
upstream_check_command: ""

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 自带的验证 (工具链能力验证)
test_package_tests:
  - file: test.sh
    description: "静态组件验证 10 项（组件/ELF/机器码/sysroot rlib）+ 动态 exec 验证 6 项（rustc/cargo 版本、OHOS target、交叉编译并运行 hello、cargo test cfg-if）"
    command: "bash test.sh"

# 断言数：静态 10 + 动态 6 = 16 项
assertion_count: 16
