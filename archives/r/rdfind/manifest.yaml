software: rdfind
display: "rdfind"
description: "Finds duplicate files and can replace them with hardlinks or symlinks"
category: utility
homepage: "https://rdfind.pauldreik.se/"
license: "GPL-2.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "release tarball 自带 configure/Makefile.in，无需 autoreconf"
    - "HMDFS 上 autoconf 私有临时目录 (umask 077 && mktemp -d) 不可写，需补丁把两处 umask 077 改为 022"
    - "唯一强制依赖 nettle（configure 用 AC_CHECK_HEADER/AC_CHECK_LIB 探测，不走 pkg-config）"
    - "xxhash 可选，构建时显式 --without-xxhash"
    - "C++17 要求由 profile 的 compiler.cppstd=17 提供"
  common_dependencies:
    - nettle/3.10.2.1

versions:
  "1.8.0":
    status: built
    build_date: "2026-09-19"
    conan_ref: "rdfind/1.8.0"
