patches:
  - patch_file: "patches/0001-configure-hmdfs-umask.patch"
    patch_description: >-
      0001 configure: create autoconf's private temporary directory with umask 022
      instead of 077. On the OHOS worker (HMDFS) the 0700 + setgid directory produced
      by `(umask 077 && mktemp -d)` is not writable, so config.status aborted with
      "./confXXXXXX/subs1.awk: Permission denied" /
      "config.status: error: could not setup config files machinery" — the failure
      observed in CI build #50908. Same remedy as the in-tree precedent
      archives/y/yydecode/0.2.10/patches/0001-configure-hmdfs-umask.patch, and the
      knowledge entry whose rec_approach is "bypass-mktemp".
    patch_type: "portability"
