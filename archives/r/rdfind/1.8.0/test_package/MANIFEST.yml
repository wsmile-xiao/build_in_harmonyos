# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: rdfind/1.8.0
homepage: "https://rdfind.pauldreik.se/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check  (Makefile.am 的 TESTS= 声明 15 个 shell 测试用例；testcases/common_funcs.sh 属 AUXFILES 夹具，不计入)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: testcases/verify_ranking.sh
    source: rdfind-1.8.0/testcases/verify_ranking.sh
    description: "重复文件排序与 duptype 分类（FIRST_OCCURRENCE / WITHIN_SAME_TREE / OUTSIDE_TREE）"
    command: "make check"
  - file: testcases/verify_dryrun_option.sh
    source: rdfind-1.8.0/testcases/verify_dryrun_option.sh
    description: "-dryrun 选项不修改文件系统"
    command: "make check"
  - file: testcases/verify_nochecksum.sh
    source: rdfind-1.8.0/testcases/verify_nochecksum.sh
    description: "-checksum none 路径"
    command: "make check"
  - file: testcases/checksum_options.sh
    source: rdfind-1.8.0/testcases/checksum_options.sh
    description: "-checksum md5/sha1/sha256/sha512 各算法一致性"
    command: "make check"
  - file: testcases/verify_size_savings.sh
    source: rdfind-1.8.0/testcases/verify_size_savings.sh
    description: "重复文件统计与节省空间输出"
    command: "make check"
  - file: testcases/sha1collisions.sh
    source: rdfind-1.8.0/testcases/sha1collisions.sh
    description: "SHA1 碰撞样本处理（依赖 base64 与 bzip2，受限 worker 上可能缺工具）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_rdfind.sh
    description: "消费者视角：在 $TMPDIR 下构造一个重复对 + 一个唯一文件，运行打包后的 rdfind，校验 results.txt 中的 duptype 分类与唯一文件未被误判"
    command: "bash test_rdfind.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
