# test_package/MANIFEST.yml — radlib 2.12.0
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求）

package: radlib/2.12.0
homepage: "https://sourceforge.net/projects/radlib/"

# 上游测试命令：上游 automake 未注册任何测试（顶层 Makefile.am 的
# SUBDIRS = src msgRouter debug 不含 test/，test/ 整体在 EXTRA_DIST，
# 无 TESTS/check_PROGRAMS）。test/ 下共有 5 个独立测试程序（机器人实测
# 口径 N_static=5），其中 test/sha/radsha.c 由配方 build() 编译链接构建
# 出的 librad 并真实执行（SHA-256 与 SHA-1 两种模式，断言退出码 0 且
# 摘要为合法十六进制串）；make check 本身空跑。
upstream_check_command: "make check（无注册测试项，空跑）+ build() 内真实执行 test/sha/radsha"
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\") + 编译执行 test/sha/radsha.c"

# 上游测试程序逐项台账（实测口径 5 项）
upstream_tests:
  - file: test/sha/radsha.c
    source: radlib-2.12.0/test/sha/radsha.c
    description: "SHA-1/SHA-256 文件摘要测试——已真实执行：配方 build() 编译链接 librad 后运行 radsha 256/1 两种模式，退出码 0、摘要 64/40 位十六进制（执行记录见 conan-create 日志）；其正确性由补丁 0001/0003（SHA 32 位字宽修复）保障，FIPS 向量经消费者测试断言"
    command: "./radsha_test 256 sha_input.txt && ./radsha_test 1 sha_input.txt（build() 内执行，通过）"
  - file: test/multicast/multicast.c
    source: radlib-2.12.0/test/multicast/multicast.c
    description: "组播收发测试——未执行：程序为无限 RX/TX 循环（for(;;) 收包-发包，无自动退出条件），需人工值守观察，无法纳入自动构建执行"
    command: "（跳过：无自动退出条件的交互式套件）"
  - file: test/msgRouter/routetest.c
    source: radlib-2.12.0/test/msgRouter/routetest.c
    description: "消息路由测试——未执行：需先运行多个 radmrouted 守护进程组成路由拓扑（runrouters 脚本手工拉起）并设置 APPLICATION_RUN_DIRECTORY 共享目录布局，属多进程手工套件，自动化构建内无法复现其运行前提"
    command: "（跳过：依赖 radmrouted 守护进程拓扑，手工多进程套件）"
  - file: test/database/dbtest.c
    source: radlib-2.12.0/test/database/dbtest.c
    description: "数据库抽象层测试——未执行：依赖 MySQL/PostgreSQL 可选后端（raddatabase.h），上游 configure 默认 --disable-mysql/--disable-pgresql，本包按上游默认配置构建，测试无法链接"
    command: "（跳过：依赖上游默认关闭的 MySQL/PostgreSQL 可选后端）"
  - file: test/sqlite/dbtest.c
    source: radlib-2.12.0/test/sqlite/dbtest.c
    description: "SQLite 测试——未执行：依赖 SQLite 可选后端（radsqlite.h），上游 configure 默认 --disable-sqlite，本包按上游默认配置构建，测试无法链接"
    command: "（跳过：依赖上游默认关闭的 SQLite 可选后端）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_radlib.c
    description: "消费者测试：编译链接 radlib，断言 SHA-1/SHA-256 FIPS 180 测试向量（SHA1('abc')/SHA1('')/SHA256('abc')，同时验证补丁 0001/0003 的 32 位字宽修复）与 radCRC32Calculate/radCRC16Calculate 返回值（期望值由 src/radcrc.c 的表+循环逐位复现计算），共 6 处断言"
    command: "./test_radlib"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 6
