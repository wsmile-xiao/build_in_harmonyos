sources:
  url:
    - "https://downloads.sourceforge.net/project/radlib/radlib/radlib-2.12.0/radlib-2.12.0.tar.gz"
  filename: "radlib-2.12.0.tar.gz"
  sha256: "82b98bb5e08a500dea1e4252843b9c772fa1fb67ac8ab89ed64abdd5e22eca66"

# 本地 bootstrap 用 GNU 官方工具源码（CI worker 可能缺 automake；
# conan 打包的 perl 在 OHOS 上 Cwd.so 损坏不可用，见 notes.md）
build_tools:
  automake:
    url:
      - "https://mirrors.tuna.tsinghua.edu.cn/gnu/automake/automake-1.18.tar.gz"
      - "https://mirrors.ustc.edu.cn/gnu/automake/automake-1.18.tar.gz"
      - "https://mirrors.aliyun.com/gnu/automake/automake-1.18.tar.gz"
      - "https://ftp.gnu.org/gnu/automake/automake-1.18.tar.gz"
    sha256: "af6043a5d4b3beef0c48161f4a6936259321cd101a34c1ab0768328515626c8a"
  libtool:
    url:
      - "https://mirrors.tuna.tsinghua.edu.cn/gnu/libtool/libtool-2.5.4.tar.gz"
      - "https://mirrors.ustc.edu.cn/gnu/libtool/libtool-2.5.4.tar.gz"
      - "https://mirrors.aliyun.com/gnu/libtool/libtool-2.5.4.tar.gz"
      - "https://ftp.gnu.org/gnu/libtool/libtool-2.5.4.tar.gz"
    sha256: "da8ebb2ce4dcf46b90098daf962cffa68f4b4f62ea60f798d0ef12929ede6adf"

patches:
  - patch_file: "patches/0001-src-radsha.c.patch"
    patch_description: "LP64/aarch64 移植性修复：SHA 实现按 32 位字设计却使用 unsigned long（LP64 上 64 位），导致 W256[15] 越界 64 字节砸栈（SIGBUS/SIGSEGV）且摘要全错；SHA 段 ULONG 全部改用 uint32_t（ULONGLONG 位宽不变），FIPS 180 向量验证通过"
    patch_type: "portability"
  - patch_file: "patches/0002-src-radsysutils.c.patch"
    patch_description: "musl/clang15: radsysutils.c 使用 open()/O_RDWR 但未包含 <fcntl.h>（隐式函数声明在 clang 15 下为错误）"
    patch_type: "portability"
  - patch_file: "patches/0003-h-radsha.h.patch"
    patch_description: "与 0001 配套：radsha.h 中 SHA1Context/lbyte/SHA256_CTX 结构体的字宽同步改为 uint32_t（内存布局与算法假设一致）"
    patch_type: "portability"
