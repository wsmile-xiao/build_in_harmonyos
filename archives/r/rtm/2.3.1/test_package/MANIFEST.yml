# test_package/MANIFEST.yml
# 上游官方测试声明文件（rtm 2.3.1）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 清点方法：解压官方 v2.3.1 源码包后
#   tests/main_generic/ 由 Catch2 (external/catch2) 驱动 ctest；
#   ctest -N 可见全部已注册测试用例。

package: rtm/2.3.1
homepage: "https://github.com/nfrechette/rtm"

# 上游测试命令（用于 ctest -N 分析）
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试（header-only：无 build()）
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（Catch2 注册的 ctest 用例汇总于 rtm_unit_tests）
upstream_tests:
  - file: test_vector4f.cpp
    source: rtm-2.3.1/tests/sources/test_vector4f.cpp
    description: "vector4f 标量/SIMD 运算单元测试"
    command: "./rtm_unit_tests"
  - file: test_quat.cpp
    source: rtm-2.3.1/tests/sources/test_quat.cpp
    description: "四元数运算单元测试"
    command: "./rtm_unit_tests"
  - file: test_matrix4x4.cpp
    source: rtm-2.3.1/tests/sources/test_matrix4x4.cpp
    description: "矩阵运算单元测试"
    command: "./rtm_unit_tests"

# test_package 中自带的测试（消费者视角验证，真实调用 API）
test_package_tests:
  - file: test.cpp
    description: "vector_add/点积结果断言（R34 实质测试）"
    command: "./test_rtm"

# 测试断言总数（上游 Catch2 用例数 + test_package 断言，近似）
assertion_count: 300