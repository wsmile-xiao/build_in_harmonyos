software: recode
display: "GNU Recode"
description: "Converts files between various character sets and text formats"
category: data
homepage: "https://github.com/rrthomas/recode"
license: GPL-3.0-or-later
build_system: autotools

# OHOS 适配知识
ohos_adaptation:
  key_points:
    - "需要替换 config.guess/config.sub 为支持 OpenHarmony 平台识别的版本"
    - "configure 脚本中的 umask 077 需要修改为 umask 022（HMDFS 文件系统限制）"
    - "测试套需要 cython（非关键依赖，可跳过）"
  common_dependencies: []

# 版本索引
versions:
  "3.7.12":
    status: built
    build_date: "2026-06-03"