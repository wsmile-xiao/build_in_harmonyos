# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: raft-cowsql/0.22.1
homepage: "https://github.com/cowsql/raft"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/unit/main_core.c
    source: raft-0.22.1/test/unit/main_core.c
    description: "Unit tests for raft core (raft_strerror, raft_init, etc.)"
    command: "make check"
  - file: test/integration/main_core.c
    source: raft-0.22.1/test/integration/main_core.c
    description: "Integration tests for raft core (election, replication, membership)"
    command: "make check"
  - file: test/fuzzy/main_core.c
    source: raft-0.22.1/test/fuzzy/main_core.c
    description: "Fuzzy tests for raft core (liveness, election, membership, replication)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_raft.c
    description: "Verify raft_strerror() API returns correct string for unknown error code"
    command: "./test_raft"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
