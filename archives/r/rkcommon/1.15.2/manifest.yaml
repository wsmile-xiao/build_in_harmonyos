# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游对齐内存分配器平台守卫缺 Linux/OHOS aarch64 分支（落入 x86 专属 _mm_malloc/xmmintrin.h）：把 Apple-arm64 条件放宽为通用 __aarch64__/__arm64__ 走 posix_memalign/free；已沉淀 DRAFT-rkcommon-1.15.2-aarch64-aligned-malloc-posix-memalign（draft-review 判 create）"
  - "RenderKit/OSPRay 系 tasking 后端由缓存变量 RKCOMMON_TASKING_SYSTEM 控制（默认 TBB）；RKCOMMON_TASKING_TBB 是宏输出变量、配方设置会被覆盖——OHOS 零依赖适配应设 RKCOMMON_TASKING_SYSTEM=Internal（Embree/openvkl 同族同款风险）"
  - "bundled catch v2 单套件 137 个 TEST_CASE 经 16 个 [tag] add_test 注册项全量执行：ctest 16/16 通过；消费者测试 test_probe 10 断言通过"
