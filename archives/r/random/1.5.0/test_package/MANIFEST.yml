# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: random/1.5.0
homepage: "https://github.com/ilqvya/random"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# CMake 构建: Random_BuildTests=ON -> test/ 子目录生成 3 个 Catch2 测试可执行
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# header-only 配方无 build()；上游测试在适配 worktree 内本地完整执行（见测试台账）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/random_test.cpp
    source: random-1.5.0/test/random_test.cpp
    description: "Catch2 测试源（RANDOM_STATIC/RANDOM_THREAD_LOCAL/RANDOM_LOCAL 三编译变体共用）"
    command: "./random_static_test ./random_thread_local_test ./random_local_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：include effolkronium/random.hpp 并实际调用 get/shuffle/weighted 接口"
    command: "./test_random"

# 测试断言总数 (近似值, 用于质量评估；上游 Catch2 TEST_CASE 详见测试台账)
assertion_count: 49
