# conandata.yml — reliable 1.3.5
# 位置: archives/r/reliable/1.3.5/conandata.yml
# 本文件是源码 URL + SHA256 + 补丁的唯一权威来源。
# conanfile.py 通过 self.conan_data["sources"] 与 apply_conandata_patches() 读取。

sources:
  # URL 列表的三条硬规则（与仓库内 ohc-run.py conan-init 生成的配方一致）：
  #
  # 1. 第一项必须是 **官方源**（R39 / PF7 源URL闸：镜像域名在黑名单内，
  #    gh-proxy.com / ghfast.top / cnb.cool 等 14 个域名字面量单独出现会被拦，
  #    只允许作为官方源之后的兜底项）。
  # 2. 列表必须**含 ghfast.top 一项**——本地 `ohc-run.py conan-verify` 的 G2
  #    会对含 github.com 且不含 ghfast.top 的 conandata **临时注入** ghfast.top
  #    镜像（E017 预防）。缺少该项会被改写成
  #    `https://gh-proxy.com/https://ghfast.top/https://github.com/...` 的双重代理，
  #    虽然 conan get() 会回退到下一项，但属于无必要的脆弱路径，且进程被中断时
  #    会残留 .ghfast-bak（JC1 垃圾文件门禁的敏感后缀）。
  # 3. 其余镜像项一律写成「镜像前缀 + 官方完整 URL」的形态，不得裸用镜像域名。
  #
  # 实测（2026-09-27，同一份字节，三个通路 sha256 完全一致）：
  #   官方直连 / ghfast.top / gh-proxy.com  →  均返回 35375 bytes,
  #   sha256 = e4b6f1c4955fb8a26e4d5a051c3f37559c8c86ca925b2519dfcbfa1ed554aa17
  url:
    - "https://github.com/mas-bandwidth/reliable/archive/refs/tags/v1.3.5.tar.gz"
    - "https://ghfast.top/https://github.com/mas-bandwidth/reliable/archive/refs/tags/v1.3.5.tar.gz"
    - "https://gh-proxy.com/https://github.com/mas-bandwidth/reliable/archive/refs/tags/v1.3.5.tar.gz"
  sha256: "e4b6f1c4955fb8a26e4d5a051c3f37559c8c86ca925b2519dfcbfa1ed554aa17"

patches:
  # 本版本无补丁：上游源码零改动即可在 clang/musl 生态（含 OHOS）构建。
  # List format (Conan 2.x standard — compatible with apply_conandata_patches):
  # - patch_file: "patches/0001-fix-config-sub.patch"
  #   patch_description: "..."
  #   patch_type: "portability"
