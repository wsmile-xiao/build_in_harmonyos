# test_package/MANIFEST.yml — reliable 1.3.5
# 位置: archives/r/reliable/1.3.5/test_package/MANIFEST.yml
# 用途: 声明上游测试来源与数量口径（L0e 门禁要求本文件存在）

package: reliable/1.3.5
homepage: "https://github.com/mas-bandwidth/reliable"

# ── 上游测试 ─────────────────────────────────────────────────────────
# 上游 CMakeLists.txt 在 RELIABLE_BUILD_TESTS=ON 时注册 4 条 ctest：
#   add_test(NAME test          COMMAND reliable_test)
#   add_test(NAME fuzz          COMMAND fuzz 20000 12345)
#   add_test(NAME soak          COMMAND soak 8192 --quiet)
#   add_test(NAME fuzz_target   COMMAND fuzz_target_standalone 500 12345)
# 本配方在 build() 内以 cmake.test()（等价 ctest --output-on-failure）真实执行。
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: test.cpp
    source: reliable-1.3.5/test.cpp
    description: >-
      可靠传输核心行为套件。test.cpp 调用 reliable.c 内嵌的 reliable_test()
      （编译时 RELIABLE_ENABLE_TESTS=1），内含 14 个 RUN_TEST 子用例、
      87 个 check() 断言，全部通过后打印 "*** ALL TESTS PASSED ***"。
    command: "ctest -R '^test$'"
  - file: fuzz.c
    source: reliable-1.3.5/fuzz.c
    description: >-
      固定随机种子 12345 的 20000 轮不确定性输入回归，验证任意字节流不会
      破坏 endpoint 内部状态。
    command: "ctest -R '^fuzz$'"
  - file: soak.c
    source: reliable-1.3.5/soak.c
    description: "8192 轮长时间收发压力（--quiet 静默），验证无泄漏与无状态退化。"
    command: "ctest -R '^soak$'"
  - file: fuzz_target.c
    source: reliable-1.3.5/fuzz_target.c
    description: >-
      以 RELIABLE_FUZZ_STANDALONE 编译的 libFuzzer 单机驱动器，500 轮固定种子。
    command: "ctest -R '^fuzz_target$'"

# ── 本包自带的消费者用例 ─────────────────────────────────────────────
test_package_tests:
  - file: test_reliable.c
    description: >-
      消费者测试：以库的使用者身份建立两个 endpoint 并通过 transmit 回调互投
      线包，验证 ①小包往返与按序号 ACK、②5000 字节大包的分片发送与重组后
      正文逐字节相符、③packets/fragments/invalid 计数器契约、④rtt/jitter/
      packet_loss/bandwidth 返回值范围、⑤两端 reset 后计数器归零且端点可复用。
      驱动方式与上游 test.cpp 的 test_acks() 一致：每轮两个端点各发一个 8 字节
      心跳包 —— reliable 的 ACK 只能搭在出站包头上回传，接收方不发包时发送方
      永远收不到 ACK（详见 notes.md §4.2）。
    command: "./test_reliable"

# ── 数量口径 ─────────────────────────────────────────────────────────
# 上游以 ctest 注册条目为口径：CI 实际执行并在日志中报告的就是这 4 条。
# （其内部粒度见上方 test.cpp 条目：14 个 RUN_TEST 子用例 / 87 个断言，
#   但 ctest 只注册 1 条聚合条目，故不与 4 相加，避免重复计数。）
upstream_test_total: 4
upstream_test_count_method: "auto"
upstream_test_audit: >-
  源码级审计（v1.3.5 tarball）：CMakeLists.txt 内 if(RELIABLE_BUILD_TESTS) 分支
  注册 add_test ×4（test / fuzz / soak / fuzz_target）；test 目标由 test.cpp
  驱动 reliable_test()，该函数内 RUN_TEST 宏出现 14 次；可靠传输测试区段
  （reliable.c:1761-3024）内 check() 宏出现 87 次。ctest 粒度计数为 4。

test_counting:
  # 上游独立的 ctest 条目数
  upstream_independent_total: 4
  # 消费者用例：每个 CHECK 自带且仅带一条断言，用例数 == 断言数，
  # 使"通过率"的分母无歧义
  integration_independent_total: 35
  shared_static_counted_once: true
  counting_note: >-
    消费者用例采用 NDEBUG 安全的自研 CHECK 宏（CMake Release 会定义 NDEBUG，
    assert() 会被预处理掉，用它会让测试退化为必然通过的假测试）。
    CHECK 调用总数固定为 35，不随 update 循环轮数变化。

test_case_count: 35
assertion_count: 35
