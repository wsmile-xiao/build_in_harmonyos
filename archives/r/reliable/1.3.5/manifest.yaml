# 版本级 manifest
# 文件位置: archives/r/reliable/1.3.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.3.5"

# 软件名
software: "reliable"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "cmake"
conan_ref: "reliable/1.3.5"

# 源码信息
source:
  # 源码下载 URL（与 conandata.yml 的官方 URL 一致；conandata 里额外带镜像列表）
  url: "https://github.com/mas-bandwidth/reliable/archive/refs/tags/v1.3.5.tar.gz"

  # 源码校验和
  sha256: "e4b6f1c4955fb8a26e4d5a051c3f37559c8c86ca925b2519dfcbfa1ed554aa17"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# 构建配置
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py 的 generate() 一致）
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DRELIABLE_BUILD_TESTS=ON"
    - "-DRELIABLE_SANITIZE=OFF"
    - "-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY"

  # 编译依赖列表（格式: name/version）
  # reliable 零外部依赖，只用 C 标准库 + libm
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# 应用的补丁列表（本版本零补丁）
patches_applied: []

# 编译中学到的知识
knowledge_gained:
  - "上游 RELIABLE_BUILD_TESTS 默认值等于 RELIABLE_TOP_LEVEL：包构建时会连带编出 example/soak/stats/fuzz 等示例程序，它们没有 install 规则所以不进包，但会显著拉长 build 阶段"
  - "纯 C 库的消费者链接必须显式带 -lm：reliable.c 用 fabs(5 处)/pow(1 处) 计算 rtt/jitter/bandwidth，OHOS clang 驱动不隐式链接 libm；先例 archives/z/zxcvbn-c/2.6 同样按 os in ('Linux','OHOS') 声明 system_libs"
  - "reliable_endpoint_packet_loss() 返回的是百分比(0~100)，不是 0~1 的比例（reliable.c 内算式为 (num_dropped/num_sent)*100.0f）；消费者用例若按比例断言上界 1.0 会误判"
  - "CMake Release 配置会定义 NDEBUG，而 assert() 在 NDEBUG 下被预处理成空语句 —— 消费者用例若用 assert() 会退化成必然通过的假测试（CI 的 L1e 破坏性反向验证正是针对此）。正确做法是自研不受 NDEBUG 影响的 CHECK 宏并以非 0 退出码上报失败"
  - "官方 test_package/conanfile.py 模板只写 cmake.test()，不含 self.run()；而 L0d 门禁做的是裸 grep 'self.run'，照抄官方模板会直接被判 stub_test_method"
  - "上游许可证文件名拼写为 LICENCE（不是 LICENSE），copy() 时写错会静默漏掉许可证文件"
  - "上游把 reliable.pc 装到 lib/pkgconfig，其中的 prefix 是构建机的绝对路径；包内应删除该目录，CMakeDeps 消费者不使用 pkgconfig"
  - "上游没有 install(EXPORT)，包内不存在上游自带的 CMake config，因此不会与 CMakeDeps 生成的 reliable-config.cmake 碰撞 —— 与本仓库多数需要移除上游 lib/cmake/* 的库不同，本包无需该处理步骤"
