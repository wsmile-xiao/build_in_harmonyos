# 软件级 manifest
# 文件位置: archives/r/reliable/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: reliable

# 显示名
display: "Reliable"

# 一句话描述
description: "Reliable UDP protocol library: packet acks, fragmentation and reassembly, plus rtt / jitter / packet loss / bandwidth statistics"

# 分类标签
category: network

# 官网 URL
homepage: "https://github.com/mas-bandwidth/reliable"

# 开源许可证（SPDX 标识）
license: BSD-3-Clause

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "纯 CMake 项目，导出单个目标 reliable（默认静态库）；上游源码零改动即可在 clang/musl 生态构建"
    - "零外部依赖：只用 C 标准库 + libm，因此不存在依赖链阻塞，也不涉及依赖必须带 @ohpcd/stable 的问题"
    - "消费者链接需显式带 -lm（reliable.c 使用 fabs/pow 计算 rtt/jitter/bandwidth），已在 package_info 声明 system_libs=[m]"
    - "RELIABLE_BUILD_TESTS 默认等于 RELIABLE_TOP_LEVEL：作为包构建时会连带编出 example/soak/stats/fuzz 等示例程序，它们无 install 规则、不进入 package/"
    - "上游许可证文件名拼写为 LICENCE（不是 LICENSE）"
    - "上游把 reliable.pc 装到 lib/pkgconfig（prefix 为构建机绝对路径），包内应删除"
    - "上游没有 install(EXPORT)，包内无上游自带 CMake config，消费者直接 find_package(reliable CONFIG REQUIRED) 即可"
    - "上游测试套件为 reliable.c 内嵌实现（RELIABLE_ENABLE_TESTS=1）：ctest 注册 test/fuzz/soak/fuzz_target 共 4 条"
  common_dependencies: []

# 版本索引
versions:
  "1.3.5":
    conan_ref: "reliable/1.3.5"
    status: built
    build_date: "2026-09-27"
