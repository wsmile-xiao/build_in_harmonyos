package: rpge/0.0.3
homepage: https://www.gnu.org/software/rpge/

upstream_check_command: "grep -R -nE 'check_PROGRAMS|TESTS[[:space:]]*=' Makefile.am src/Makefile.am conf/Makefile.am examples/Makefile.am"
upstream_test_in_build: false
upstream_test_command: "none (the upstream Automake files define no test or check targets; the example game is interactive)"
upstream_tests: []

test_package_tests:
  - file: test_commands.py
    description: "Run rpge --help and verify the documented usage path on HarmonyOS PC"
    command: "python3 test_commands.py <package>/usr/bin/rpge"
  - file: test_commands.py
    description: "Run rpge --version and verify the packaged version on HarmonyOS PC"
    command: "python3 test_commands.py <package>/usr/bin/rpge"

assertion_count: 2
