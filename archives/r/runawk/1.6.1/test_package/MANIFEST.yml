package: runawk/1.6.1
homepage: "https://github.com/cheusov/runawk"

upstream_check_command: "sh ./test/test.sh (compare with test/test.out) + sh ./test/ohos.sh"
upstream_test_in_build: true
upstream_test_command: "sh ./test.sh && sh ./ohos.sh"
upstream_test_count: 133
upstream_test_scope: "132 upstream regressions from test/test.sh (diffed against the upstream baseline test/test.out) plus 1 HarmonyOS case added by patches/0002 (test/ohos.sh). All run from build() against the freshly built binary."

upstream_tests:
  - file: test/test.sh
    source: runawk-1.6.1/test/test.sh
    description: "Upstream regression suite: 132 cases covering argv assembly (-d), option parsing, #use module resolution, AWKPATH handling, the example programs and error paths; output is diffed against test/test.out."
    command: "sh ./test.sh"
  - file: test/ohos.sh
    source: runawk-1.6.1/test/ohos.sh
    description: "HarmonyOS case added by this adaptation: aarch64 ELF launcher check, module system with a read-only /tmp, interpreter resolution and a consumer script using the shquote module."
    command: "sh ./ohos.sh"

test_package_tests:
  - file: test.sh
    description: "Runs the packaged runawk in the conanrun environment: version report, inline program, pipeline (2>&1) usage, stdin driven program, bundled abs/min/max modules, a consumer script using shquote, alt_getopt presence, ELF64 aarch64 check and the read-only /tmp module run."
    command: "bash test.sh"

assertion_count: 14
