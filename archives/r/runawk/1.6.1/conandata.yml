patches:
  "1.6.1":
    - patch_file: patches/0001-runawk-runawk.c.patch
      patch_description: "Resolve the generated-program temp file at run time (RUNAWK_TMPDIR > TMPDIR > TEMPDIR) instead of hardcoding /tmp, which is read-only on HarmonyOS"
      patch_type: portability
    - patch_file: patches/0002-test-ohos.sh.patch
      patch_description: "Add test/ohos.sh: HarmonyOS regression asserting the aarch64 OHOS ELF launcher, the module system with a read-only /tmp, interpreter resolution and a consumer script using the shquote module"
      patch_type: test
