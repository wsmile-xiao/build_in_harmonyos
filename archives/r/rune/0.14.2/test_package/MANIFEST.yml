package: rune/0.14.2
homepage: "https://github.com/rune-rs/rune"

upstream_check_command: "cargo test"
upstream_test_in_build: true
upstream_test_command: "cargo test --release -p rune --lib"

upstream_tests:
  - file: crates/rune/src
    source: "crates/rune/src/**/* #[cfg(test)] and crates/rune/src/tests.rs"
    description: "Rune parser, compiler, runtime, macros, and virtual machine unit tests; 293 passed and 1 ignored on OHOS arm64"
    command: "cargo test --release -p rune --lib"

test_package_tests:
  - file: test.sh
    description: "Consumer tests for version and help output, syntax checking, script execution, and invalid-source rejection"
    command: "zsh test.sh <bin/rune>"

assertion_count: 299
