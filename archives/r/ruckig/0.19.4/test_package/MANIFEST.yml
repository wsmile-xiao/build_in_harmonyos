package: ruckig/0.19.4
homepage: "https://github.com/pantor/ruckig"

upstream_check_command: "ctest --test-dir build --output-on-failure && ./build/test-target 5000000"
upstream_test_in_build: true
upstream_test_command: "cmake.test() plus test-target 5000000 and six local examples"

upstream_tests:
  - file: "test/test_target.cpp"
    framework: "doctest 2.4.11"
    description: "15 test cases covering trajectory generation, validation, synchronization, dynamic DOFs, limits, custom vectors, and randomized position/velocity profiles"
    command: "test-target 5000000"
  - file: "examples/01_position.cpp"
    description: "Online position trajectory example"
    command: "example-01_position"
  - file: "examples/02_position_offline.cpp"
    description: "Offline calculation and trajectory sampling example"
    command: "example-02_position_offline"
  - file: "examples/05_velocity.cpp"
    description: "Velocity-control trajectory example"
    command: "example-05_velocity"
  - file: "examples/06_stop.cpp"
    description: "Stop trajectory example"
    command: "example-06_stop"
  - file: "examples/07_minimum_duration.cpp"
    description: "Minimum-duration constraint example"
    command: "example-07_minimum_duration"
  - file: "examples/09_dynamic_dofs.cpp"
    description: "Dynamic degrees-of-freedom example"
    command: "example-09_dynamic_dofs"

test_package_tests:
  - file: "test_main.cpp"
    description: "Valid-input and offline-calculation checks"
    command: "bash run_test.sh ruckig_test"
  - file: "test_main.cpp"
    description: "Start, midpoint, and terminal trajectory sampling checks"
    command: "bash run_test.sh ruckig_test"
  - file: "test_main.cpp"
    description: "Online update loop and final-state accuracy checks"
    command: "bash run_test.sh ruckig_test"
  - file: "test_main.cpp"
    description: "Invalid negative jerk limit rejection"
    command: "bash run_test.sh ruckig_test"

negative_control:
  file: "run_test.sh"
  description: "Separate harness check proves assertion and wrapper failures return nonzero"
  command: "bash run_test.sh ruckig_test --self-test-failure"
  expected_exit_code: 1

upstream_test_count: 21
upstream_doctest_case_count: 15
upstream_example_count: 6
upstream_random_trajectory_count: 5000000
upstream_runtime_assertion_count: 26250188
host_runtime_assertion_count: 26250183
test_package_test_count: 4
assertion_count: 18

upstream_modifications: []
upstream_skips: []
