software: redict
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/7.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.3.0"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-13"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeberg.org/redict/redict/archive/7.3.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "CXX=clang++"
    - "MALLOC=libc"
    - "CFLAGS=-fPIC -O2"
    - "LDFLAGS=-lm"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - musl/1.2
    - clang/15.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "redict 默认使用 jemalloc，HarmonyOS/musl 上需使用 MALLOC=libc 替代"
  - "redict 是 Redis OSS 7.2.4 的 LGPL-3.0 分支，基于 Makefile 构建（无 configure 脚本）"
  - "二进制名称从 redis-* 改为 redict-*"

