package: rgxg/0.1.2
upstream_test_in_build: true
upstream_tests:
  - command: "make -j1 check"
    total: 1050
    passed: 1050
    note: >-
      上游只有一个 Check 测试程序 tests/check_rgxg.c：2 个 tcase_add_loop_test
      循环用例分别遍历 cidr_regex[] 的 600 条与 range_tests[] 的 450 条向量，
      逐条 strcmp 比对生成的正则。声明按最大口径取数据向量数 1050
      （Check 注册用例数 2、源码内 ck_assert 调用点数 4，取数命令见 notes.md），
      避免少报。
test_package_tests:
  - file: test_rgxg.c
    description: "消费者链接 librgxg：上游已知答案向量 + 用真机 libc POSIX 引擎实跑生成的正则 + 选项语义 + 错误返回码 + 包内产物与 AArch64 ELF 头校验"
    command: "./test_rgxg <package_folder>"
    assertion_count: 42
  - file: test_cli.sh
    description: "命令行 rgxg 的 cidr/range/escape/alternation/version/help 输出与上游答案表逐字一致，未知命令与非法输入以非零退出码失败"
    command: "sh test_cli.sh <package_folder>"
    assertion_count: 17
