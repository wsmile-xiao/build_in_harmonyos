  test_dependencies:
    - "check/0.15.2"
  cc: clang
  cxx: clang++
  profile: "ohos-aarch64 (host == build)"

patches_applied: []

knowledge_gained:
  - "config.guess/config.sub（2020 版）不认 HarmonyOS：真机实测 `configure: error: /bin/sh build-aux/config.sub aarch64-unknown-linux-ohos failed`（machine `aarch64-unknown-linux' not recognized），而 autoconf 只把**用户传入的 --host** 送进 config.sub 校验（--build 走 config.guess 的机器可读输出，不校验）→ 只钉 `--build=aarch64-unknown-linux-gnu`、完全不给 --host，config.guess 的结论被覆盖、config.sub 根本不参与；目标三元组由 profile 的 OHOS SDK clang 决定，产物仍是 aarch64/musl（pexec/1.0 同法）。不把 ~1800 行生成文件差异带进 PR（rule6 ③：PR 过大会被跳过检视）"
  - "E114: configure 里的 `(umask 077 && mktemp -d ...)` 在 HMDFS 上造出目录内不可写的 0700 临时目录，config.status 随后读不到自己的 conf*/subs*.sed → 打包前把该子串里的 umask 去掉"
  - "上游用 PKG_CHECK_MODULES(CHECK, ... [, 找不到就关闭 make check]) 守卫测试套件；真机没有 pkg-config 二进制（worker 有 /data/service/hnp/pkg-config.org），走探测路径会静默得到 HAVE_CHECK=false → 0 个上游用例。改法：把 CHECK_CFLAGS/CHECK_LIBS 从 conan 的 check 依赖直接算出来当 configure 命令行变量传进去，并在 configure 之后断言生成的 Makefile 里出现 check_rgxg，防「绿但没测」。同型机制见 knowledge/drafts/DRAFT-10251-libnfc-tools-1.8.0-autotools-test-framework-guard"
  - "E074: make -j1；HMDFS jobserver fifo 在并行下 EPERM"
  - "Check 0.15.2 的 fork runner 要在目录下建再 unlink 的 IPC 文件，HMDFS 会把权限归一化掉 → make check 期间 CK_FORK=no（进程内跑，用例数不变）；同时 TEMP/TMP/TMPDIR 全部指到构建目录，真机 /tmp 只读"
  - "check 若为动态库，make check 需要 LD_LIBRARY_PATH 指向 check 的 lib 目录，且只在该命令里注入，不污染编译/链接探测"
  - "包内 bin/rgxg 静态链 librgxg.a → 运行期无需 LD_LIBRARY_PATH，也不需要按 E077 重签（没有安装期被改写 DT_RUNPATH 的 .so）"

verification:
  upstream_tests: "1050/1050（真机 make check 上报 `100%: Checks: 1050, Failures: 0, Errors: 0`）"
  test_package: "test_rgxg.c 42/42 + test_cli.sh 17/17，全部 [PASS]"
  negative_test_R34: "移走 lib/ → `-lrgxg` 链接失败；移走 include/ → `rgxg/net.h` 找不到；只移走 bin/ → 测试自报 [FAIL]，还原后 exit 0"
  artifact: "bin/rgxg e_machine=b700 (EM_AARCH64)、NEEDED 仅 libc.so"
  conan_home: "~/work/psj/ch-rgxg（隔离缓存，未写共享 ~/.conan2）"
  target: "HarmonyOS PC arm64, os=OHOS, arch=armv8, clang/LLVM 15"
