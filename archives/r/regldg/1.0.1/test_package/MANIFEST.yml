# test_package/MANIFEST.yml — regldg 1.0.1 上游测试声明（L0e 强制要求的文件）

package: regldg/1.0.1
homepage: "https://regldg.com/"

# ---- 上游测试审计（上游确无测试） -------------------------------------------
upstream_tests_exist: false
upstream_test_audit:
  - source: "regldg-1.0.1 source tree (root)"
    reason: "No tests/ or test/ directory and no *test* harness file exist; the tree holds only the application sources (*.c/*.h), Makefile, docs/, README, LICENSE and CHANGELOG.md."
  - source: "Makefile (sole build file)"
    reason: "It defines only the `all` (link regldg binary) and `clean` targets; there is no check, test or TESTS/check_PROGRAMS target of any kind."
  - source: "Homebrew homebrew-core Formula/r/regldg.rb (`test do` block)"
    reason: "The distribution package test is a single smoke invocation (`regldg test`), not a test suite; upstream provides nothing for it to enumerate."
  - conclusion: "Upstream 1.0.1 provides no automated tests; the adaptation adds an installed-binary functional test (6 assertions) without presenting it as upstream coverage."

# rule4 强制字段：upstream_test_total 缺失（而非 0）会被直接拒绝。
# regldg 1.0.1 经逐项审计确认确实无任何自动测试，源码树无 tests/、
# Makefile 无 TESTS/check_PROGRAMS，`make check` 无目标可执行，故总量为 0，
# 口径为 autotools_tests（Makefile 系测试注册口径）。
upstream_test_total: 0
upstream_test_count_method: autotools_tests
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_skipped: 0

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ---- Consumer tests (test_package) -----------------------------------------
# test_package/conanfile.py runs test_regldg.sh against the packaged
# bin/regldg, parses its deterministic "RESULT: P passed, F failed" trailer
# into HMBS_TEST_PACKAGE_RESULT, and emits HMBS_UPSTREAM_TEST_RESULT
# (status=no_tests, 0 counts).
test_package_tests:
  - file: test_regldg.sh
    description: "Run the packaged `regldg` through 6 real assertions: (1) `regldg test` outputs exactly the single word `test` (Homebrew smoke equivalent), (2) `-n 2 'a|b'` outputs lines a and b, (3) `--num-words-output=1 'ab?'` exits 0 with non-empty output (long-option path), (4) `-p 'a(b|c)'` parse-only exits 0, (5) negative control - no-arg invocation must fail (proving the harness observes real failures), (6) OHOS form - `-n 5 'a*'` redirected to an HMFS writable-dir file is non-empty. Emits a machine-readable RESULT trailer parsed by test_package/conanfile.py."
    command: "sh test_regldg.sh <package>/bin/regldg <workdir>"

assertion_count: 6
