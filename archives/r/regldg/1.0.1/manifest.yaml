# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.0.1"
software: regldg

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: makefile（上游纯 Makefile：无 configure、无 install、无 check/test 目标；`make` 直出单二进制 regldg）

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/PatrickCronin/regldg/releases/download/v1.0.1/regldg-1.0.1.tar.gz"
  sha256: "f5f401c645a94d4c737cefa2bbcb62f23407d25868327902b9c93b501335dc99"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - patches/0001-makefile-clang-int-conversion.patch

patch_classification:
  - patch: patches/0001-makefile-clang-int-conversion.patch
    type: portability
    target: Makefile（COMPILE 定义行）
    reason: >-
      新版 Clang 对上游旧式 int 转换写法告警（-Wall 下 -Wint-conversion）；
      补丁在 COMPILE 标志中追加 -Wno-int-conversion。补丁逐字复用 Homebrew
      homebrew-core Formula/r/regldg.rb 的 DATA 补丁（发行版级验证），非自研。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "regldg 官方上游是 github.com/PatrickCronin/regldg（Patrick Cronin，MIT）；v1.0.1 为 2022-06-20 唯一 release，tarball sha256 经 Homebrew formula 声明值与本机实下双源交叉核验逐字符一致（f5f401c6…501335dc99）"
  - "上游构建形态为裸 Makefile（仅 all/clean 目标）：COMPILE=cc / LINK=gcc 写死，OHOS 移植以 make 命令行变量覆盖为工具链（命令行变量优先级高于 Makefile 内定义），-j1"
  - "上游无任何自动化测试（源码树无 tests/、Makefile 无 check/test 目标、Homebrew test 块仅为单条 smoke），test_package 以 6 项断言做安装后功能验证，不冒充上游覆盖"

patch_generation:
  method: reuse（Homebrew homebrew-core DATA patch 逐字复用，仅剥离 formula 上下文为标准 unified diff）
  patches_count: 1

