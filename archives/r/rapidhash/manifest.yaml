# 软件级 manifest — rapidhash
# 遵循 ARCHIVE-SPEC v2.0
software: rapidhash
display: "rapidhash"
description: "Very fast, high quality, platform-independent 64-bit hash functions (header-only C/C++)"
category: data
homepage: "https://github.com/Nicoshev/rapidhash"
license: MIT

build_system: custom

ohos_adaptation:
  key_points:
    - "Header-only 库（rapidhash.h + secret.h），上游无构建系统、无第三方依赖，仅含 <stdint.h>/<string.h>"
    - "上游版本 3 的唯一发布形态是 git tag rapidhash_v3（无 v3.0/v3.0.0 形态）"
    - "rapidhash.h 的 constexpr 标注在 C++17/20 常量表达式中不可求值（internal 的 (const void*) 转换，P2738 需 clang>=19）；消费方 KAT 断言走运行期"
    - "test_package 编译需显式 -stdlib=libc++（OHOS clang 15 仅提供 libc++）并将 CMAKE_SYSTEM_NAME 映射为 Linux"
    - "secret.h 非自包含（依赖 rapidhash.h 的 rapid_mix），随头文件成对安装到 include/rapidhash/"

versions:
  "3":
    status: built
    build_date: "2026-09-08"
