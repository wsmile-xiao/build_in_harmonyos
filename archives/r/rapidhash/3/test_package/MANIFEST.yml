# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rapidhash/v3
homepage: "https://github.com/Nicoshev/rapidhash"

# 上游测试命令 — rapidhash_v3 tag 树无测试套件
# (无 CMake/CTest/autotools check 目标；bench/ 与 collisions/ 为研究工具而非测试)
# 取数口径（审方可复核，N=0）:
#   tar xzf rapidhash-rapidhash_v3.tar.gz
#   find rapidhash-rapidhash_v3 -type f \( -iname '*test*' -o -iname 'check*' \)   # 空
#   grep -R "add_test\|enable_testing" rapidhash-rapidhash_v3                       # 空
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (rapidhash 上游无测试程序)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须真实编译并运行消费方程序（直跑非 print-only）
test_package_tests:
  - file: test_package.c
    description: "C99 消费方: 789 组冻结 KAT 向量 + 确定性/种子敏感性/README 等价性属性断言"
    command: "./test_rapidhash"
  - file: test_package_cpp.cpp
    description: "C++17 消费方: 同一冻结 KAT + std::string/std::vector data() 消费路径"
    command: "./test_rapidhash_cpp"
  - file: ohos_platform_test.cpp
    description: "鸿蒙平台专项: 平台宏/小端序与头内判定一致/__int128 乘法路径/非对齐安全/KAT 抽查"
    command: "./ohos_platform_test"

# 测试断言总数 (运行期检查计数; 向量生成器与冻结向量复核命令见 notes.md)
# N 的取数命令: 各消费者运行输出 "OK: <N> checks passed, 0 failed" 行的 N 之和
#   832 (test_rapidhash) + 835 (test_rapidhash_cpp) + 13 (ohos_platform_test) = 1680
assertion_count: 1680
