# conandata.yml — robtk 0.8.6 (HarmonyOS/OpenHarmony port)
#
# Single source of truth for the source archive, its checksum and the patches
# that add the HarmonyOS / OpenGL ES backend.

sources:
  url: "https://github.com/x42/robtk/archive/refs/tags/v0.8.6.tar.gz"
  sha256: "ac68271db9605d83855460794b13826360841bff8aa76bb011c15454c56008a8"

patches:
  - patch_file: "patches/0001-gl-gles_present.h.patch"
    patch_description: "gl: add the OpenGL ES presentation layer (cairo canvas blit)"
    patch_type: "portability"
  - patch_file: "patches/0002-gl-ohosui.h.patch"
    patch_description: "gl: add the HarmonyOS host interface (view access + frame grab)"
    patch_type: "portability"
  - patch_file: "patches/0003-pugl-pugl_internal.h.patch"
    patch_description: "pugl_internal.h: build without the legacy fixed-function GL pipeline"
    patch_type: "portability"
  - patch_file: "patches/0004-pugl-pugl_ohos.c.patch"
    patch_description: "pugl: add the HarmonyOS backend (EGL + OpenGL ES + OHNativeWindow, offscreen pbuffer)"
    patch_type: "portability"
  - patch_file: "patches/0005-pugl-pugl_ohos.h.patch"
    patch_description: "pugl: declare the HarmonyOS extensions (input bridge, frame read-back)"
    patch_type: "portability"
  - patch_file: "patches/0006-robtk.mk.patch"
    patch_description: "robtk.mk: build the UI with the OpenGL ES / EGL backend (RTK_OHOS=1)"
    patch_type: "portability"
  - patch_file: "patches/0007-rtk-common.h.patch"
    patch_description: "rtk: bound text measurements so garbage font metrics cannot break the layout"
    patch_type: "portability"
  - patch_file: "patches/0008-ui_gl.c.patch"
    patch_description: "ui_gl.c: use the OpenGL ES backend and allow offscreen rendering"
    patch_type: "portability"
