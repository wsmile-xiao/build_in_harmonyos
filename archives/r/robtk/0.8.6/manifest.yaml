knowledge_gained:
  - "HarmonyOS 无 X11/GLX 与桌面 OpenGL：GL UI 需移植到 EGL + OpenGL ES（libGLESv3.so），并用 OHNativeWindow 作为 drawable"
  - "robtk 的组件/布局内核（rtk/common.h + gl/layout.h + widgets/*.h）平台无关，平台耦合只集中在 ui_gl.c 的 3 个呈现函数与 pugl 窗口后端"
  - "EGL pbuffer 离屏渲染可在无显示器 CI 上真实验证 GL UI 代码，并用 glReadPixels 做像素级断言"
  - "HarmonyOS 上链接 -lGLESv2 会解析到 NDK 桩库（glGetString 返回 NULL、着色器编译失败），必须链接 -lGLESv3 才能拿到真实驱动"
  - "GLES 无 GL_TEXTURE_RECTANGLE_ARB/GL_DECAL 与可靠的 GL_BGRA 上传：cairo ARGB32 应上传为 GL_RGBA 并用片元着色器 .bgra swizzle 还原"
  - "CI worker 无字体配置时 pango 文本度量退化为数十万像素的垃圾值（且每次不同）→ 组件尺寸爆炸 → EGL 以 EGL_BAD_ATTRIBUTE 拒绝 pbuffer → UI 实例化失败；对策：约束文本度量 + 后端钳制几何 + 测试不依赖字体"
  - "GL program/纹理名是 per-EGL-context 的：UI 实例销毁（eglTerminate）后重建会拿到新上下文，缓存的文件级 static program 名失效（glUseProgram 报 GL_INVALID_VALUE、绘制静默失败），必须按 eglGetCurrentContext() 判定并重建"

