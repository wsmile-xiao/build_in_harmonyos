    上游 0.8.6 无构建系统、无 tests/ 目录、无 check/ctest/pytest 入口（清点证据见 notes.md §2），
    因此上游自动化测试项为 0，未运行也未修改任何上游测试。
    conan create 的 test_package 阶段在真机 HarmonyOS(Maleoon 916 / EGL 1.4 / OpenGL ES 3.2)上
    真实执行两个可执行文件：
      - test_pugl_ohos（鸿蒙特有测试，EGL/GLES 后端层，含退化尺寸钳制回归）：29 项断言，通过 29，失败 0
      - test_robtk_ui（LV2 UI 入口 + 组件 + cairo + GLES 呈现 + 输入回传 + 生命周期）：31 项断言，通过 31，失败 0
    测试 UI 仅使用 dial（字体无关）：CI worker 无可用字体配置，pango 度量会退化为垃圾值，
    故文本渲染不在测试中断言（工具箱已约束该度量，见补丁 0007）。

