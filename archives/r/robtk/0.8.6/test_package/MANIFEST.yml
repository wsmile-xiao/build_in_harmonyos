package: "robtk/0.8.6"
homepage: "https://github.com/x42/robtk"

upstream_check_command: ""
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  The robtk 0.8.6 release archive ships no build system and no tests: there is
  no Makefile/CMakeLists.txt/configure.ac and no tests/, test/ or check target
  in the tree (only robtk.mk, a makefile fragment included by downstream LV2
  plugins, plus widget headers and the backend sources).  There is therefore no
  upstream test entry point to run, and none is removed or modified by this
  package.

test_package_tests:
  - id: "pugl-ohos-backend"
    source: "test_pugl_ohos.c"
    command: "test_pugl_ohos"
    description: >-
      HarmonyOS specific test of the new pugl backend (29 assertions): EGL
      display/config/ES context on an offscreen pbuffer, real OpenGL ES 3
      rendering with pixel read-back, the ArkUI input bridge (motion/button/
      scroll/special/focus), redisplay, drawable re-creation on resize, the
      hide/show cycle, EGL context release on teardown and a degenerate
      (-1x-1) size that must be clamped instead of reaching EGL.
  - id: "robtk-ui-stack"
    source: "test_robtk_ui.c"
    command: "test_robtk_ui"
    description: >-
      End-to-end test of the toolkit on HarmonyOS (31 assertions): the LV2 UI
      entry point (lv2ui_descriptor) builds the widget tree through the
      packaged toolkit, cairo draws it into the OpenGL ES framebuffer (dial
      gradient verified pixel by pixel, no text widget so that the result does
      not depend on the host's font stack), synthetic pointer events drive the
      dial (value reported to the host through the LV2 write function), and a
      second UI instance is built after cleanup() to prove the lifecycle (which
      caught a per-EGL-context GL program defect).

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 60
