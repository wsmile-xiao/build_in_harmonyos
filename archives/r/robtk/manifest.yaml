software: robtk
display: "robtk (rob's LV2 UI tool kit)"
description: "LV2 plugin UI toolkit: cairo/pango widgets, GTK+ and OpenGL ES backends"
category: gfx
homepage: "https://github.com/x42/robtk"
license: GPL-2.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "工具箱（源码形态交付）：下游插件把 robtk 源码编进自己的 UI 共享对象（RW=<robtk 目录>）"
    - "HarmonyOS 无 X11/GLX 与桌面 OpenGL：新增 pugl/pugl_ohos.c 后端（EGL + OpenGL ES 3 + OHNativeWindow）"
    - "ui_gl.c 的固定管线呈现层替换为 gl/gles_present.h（GLES blit + .bgra swizzle，无需 BGRA 扩展）"
    - "parent==0 时走 EGL pbuffer 离屏渲染，可在无显示器的 CI 上真实验证 GL UI 并做像素断言"
    - "宿主（ArkUI/XComponent）通过 LV2 extension_data 的 #ohosUi 接口拿到视图、转发输入、回读帧"
    - "下游构建：make RTK_OHOS=1（robtk.mk 自动选 pugl_ohos.c + -DRTK_GLES + -lEGL -lGLESv3 -lnative_window）"
    - "上游 0.8.6 无构建系统、无 tests/，无上游测试入口（清点证据见版本 notes）"
  common_dependencies:
    - cairo
    - pango
    - lv2

versions:
  "0.8.6":
    status: built
    build_date: "2026-09-26"
    conan_ref: "robtk/0.8.6"
