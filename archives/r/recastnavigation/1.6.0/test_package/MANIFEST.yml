# test_package/MANIFEST.yml — recastnavigation 1.6.0
# CI L0e requires this file to exist.

package: recastnavigation/1.6.0
homepage: "https://github.com/recastnavigation/recastnavigation"

# Upstream test suite: Tests/ executable (Catch2-based), built only when
# RECASTNAVIGATION_TESTS=ON. Not run in the conan recipe build (tests disabled
# for the core library package; Catch2 is a test-only dependency).
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs exist in the tarball but are not run in this
# library-only conan build.
upstream_tests:
  - name: detour_tests
    command: "Tests"
    expected: "not-run: RECASTNAVIGATION_TESTS=OFF in library recipe; requires Catch2"
  - name: recast_tests
    command: "Tests"
    expected: "not-run: RECASTNAVIGATION_TESTS=OFF in library recipe; requires Catch2"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.cpp
    description: "Links RecastNavigation::Recast and RecastNavigation::Detour, calls rcContext/dtNavMeshParams/rcSqrt"
    command: "./recastnavigation_test"

# Approximate assertion count (rcSqrt numeric check + API construction)
assertion_count: 2
