# conandata.yml — rtags 2.44
# 官方源（R39）：GitHub 上游 release tag；src/rct 为 git submodule，
# GitHub 自动 tarball 不含子模块，故用 rct 仓库 pinned commit（v2.44 对应 9121fb0a）官方归档补齐。
sources:
  - url: "https://codeload.github.com/Andersbakken/rtags/tar.gz/refs/tags/v2.44"
    sha256: "4343df5d4d3fefb01d28bed209c27ba2a15f55a3a7437bf06b225e73ef70b521"
  - url: "https://codeload.github.com/Andersbakken/rct/tar.gz/9121fb0a56481e11805648216e46dcd9cc6cf01e"
    sha256: "d2a6dc881382d2dbd6d30d5da35ce3b8f02d8eec9e26b8cd15e1fcb978647235"
    destination: "src/rct"

patches:
  - patch_file: "patches/0001-cmake-uninstall-path.patch"
    patch_description: "configure_file 用 CMAKE_MODULE_PATH 列表拼路径报错，改为 PROJECT_SOURCE_DIR 固定路径"
    patch_source: "https://github.com/Andersbakken/rtags/issues"
    patch_type: "portability"
  - patch_file: "patches/0002-rct-capability-probe.patch"
    patch_description: "rct 能力探测适配：MemoryMonitor 以编译器内建 __linux__ 探测 Linux 内核 /proc/self/smaps；pthread_cancel 由 rct.cmake check_symbol_exists 构建期探测（RCT_HAVE_PTHREAD_CANCEL），无该符号的 libc（OHOS musl）Thread 析构兜底 pthread_detach"
    patch_source: "https://github.com/Andersbakken/rct"
    patch_type: "portability"
  - patch_file: "patches/0003-server-tcp-fallback.patch"
    patch_description: "OHOS SELinux 禁止 AF_UNIX bind：initServers 在指定 --tcp-port 时 unix 监听失败降级为 TCP-only 模式"
    patch_source: "https://github.com/Andersbakken/rtags"
    patch_type: "portability"
  - patch_file: "patches/0004-compiler-check-tmpdir.patch"
    patch_description: "isCompiler 探测临时文件硬编码 /tmp（鸿蒙PC /tmp 只读），改为优先 TMPDIR"
    patch_source: "https://github.com/Andersbakken/rtags"
    patch_type: "portability"
  - patch_file: "patches/0005-indexer-tcp-connect.patch"
    patch_description: "ClangIndexer/rp 支持 tcp@host:port 回连 rdm（OHOS SELinux 禁止 AF_UNIX，配合 0003 TCP-only 模式）"
    patch_source: "https://github.com/Andersbakken/rtags"
    patch_type: "portability"
