# MANIFEST — rtags 2.44 test_package
# 基于 libclang 的 C/C++ 代码索引器（rdm 守护进程 + rc 客户端, C++/CMake/libclang）

name: rtags
version: "2.44"
description: "基于 libclang 的 C/C++ 代码索引器（rdm + rc，符号跳转/引用查找）"
homepage: "https://github.com/Andersbakken/rtags"
license: "GPL-3.0-only"
language: C++
build_system: cmake

# 上游测试（无正式测试套件可在此环境运行）
upstream_tests:
  - description: "tests/automated 为 pytest 套件（29 例），依赖 unix socket 与 emacs，鸿蒙PC 受 SELinux AF_UNIX 限制无法原样运行；以 test_package E2E 等价覆盖索引/引用/查询核心链路"
    count: 29
    status: "SKIPPED (等价 E2E 覆盖, 见 reports/test-report.md)"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: run_test.sh
    description: "E2E 功能测试：rc --version smoke；rdm --tcp-port 启动（TCP-only 降级验证）；rc -J 装载 compile_commands.json；libclang 真实解析索引 test_project.c；rc -T 索引完成；rc -R 引用查询断言（6 段验证）"
    command: "conan test（conanfile.py test() 经 self.run 调用本脚本）"
