# 版本级 manifest — rtags 2.44
# 遵循 ARCHIVE-SPEC v2.0

version: "2.44"
software: "rtags"
status: built
build_date: "2026-10-03"
build_system: cmake

source:
  url: "https://codeload.github.com/Andersbakken/rtags/tar.gz/refs/tags/v2.44"
  sha256: "4343df5d4d3fefb01d28bed209c27ba2a15f55a3a7437bf06b225e73ef70b521"
  tar_format: tar.gz
  # rct submodule（GitHub tarball 不含子模块，双官方源方案）
  extra_sources:
    - url: "https://codeload.github.com/Andersbakken/rct/tar.gz/9121fb0a56481e11805648216e46dcd9cc6cf01e"
      sha256: "d2a6dc881382d2dbd6d30d5da35ce3b8f02d8eec9e26b8cd15e1fcb978647235"
      destination: "src/rct"

build:
  system: cmake
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DLIBCLANG_ROOT_DIR=<clang包>"
  - "-DLIBCLANG_LLVM_CONFIG_EXECUTABLE=<clang包>/bin/llvm-config"
  - "-DWITH_TESTS=OFF"
  - "-DWITH_MANUAL_TESTS=OFF"
  - "-DSKIP_CTEST=ON"
  dependencies:
  - clang/22.1.8
  cc: clang
  cxx: clang++

patches_applied:
- "0001-cmake-uninstall-path.patch"
- "0002-rct-capability-probe.patch"
- "0003-server-tcp-fallback.patch"
- "0004-compiler-check-tmpdir.patch"
- "0005-indexer-tcp-connect.patch"

knowledge_gained:
- "rct 平台宏 OS_<CMAKE_SYSTEM_NAME> 与 libc 能力均不宜在补丁里手写平台宏：MemoryMonitor 用编译器内建 __linux__ 探测 Linux 内核 /proc/self/smaps 路径；pthread_cancel 由 rct.cmake check_symbol_exists 构建期探测生成 RCT_HAVE_PTHREAD_CANCEL（本机验证 OHOS musl 链接报 undefined symbol pthread_cancel，探测自动关停 cancel 分支）"
- "OHOS musl libc 链接不到 pthread_cancel，Thread 析构经构建期能力探测自动走 pthread_detach 兜底（正常退出路径不经过该分支）"
- "鸿蒙PC SELinux 全局禁止 AF_UNIX bind（/dev/shm errno 13、HMDFS errno 1），rdm 需 --tcp-port + 补丁降级 TCP-only，rc 用 --socket-address 127.0.0.1:port，rp/ClangIndexer 需支持 tcp@host:port 回连"
- "isCompiler 探测硬编码 /tmp mkstemp（鸿蒙PC /tmp 只读 errno 30），需改用 TMPDIR"
- "rc -c/-J 索引依赖 project root 标记（compile_commands.json/.git/.rtags-project）"
- "conan clang 包含 libclang+llvm-config（llvm 配方 ENABLE_PROJECTS 不含 clang），rtags 用 -DLIBCLANG_ROOT_DIR 指向 clang 包即可"
- "binary-sign-tool 签名语法：sign -inFile <f> -outFile <f> -selfSign 1（非 sign -f -p）"
