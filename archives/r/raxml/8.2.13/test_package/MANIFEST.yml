# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: raxml/8.2.13
homepage: "https://github.com/stamatak/standard-RAxML"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 清点结论: 上游源码包无 test 目录、无 check 测试目标、无测试脚本钩子、
# 无示例数据文件（唯一 .txt 为 GPL 许可证），README 亦无测试说明。
# Makefile 变体（Makefile.gcc 等）仅含 all/clean/dev 目标，无 test/check。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试，空列表）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_raxml.py
    description: "消费者测试：运行 raxmlHPC -v 版本横幅（8.2.x 系列，上游 v8.2.13 tag 内版本串为 8.2.12 未同步）+ 最小 PHYLIP 序列数据的 GTRCAT 最大似然搜索，验证生成 RAxML_bestTree 结果树"
    command: "python3 test_raxml.py <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
# test_raxml.py 含 4 个断言点: 二进制存在 / 版本横幅含 8.2.x 系列（上游 tag 内版本串 8.2.12 未同步，断言放宽）/ 结果树生成 / 结果树 Newick 格式
assertion_count: 4
