# test_package/MANIFEST.yml - re-flex 6.3.0
# Upstream test declaration (CI L0e gate).  Census 2026-09-22, upstream
# tag archive v6.3.0 (sha256 c9e448b6...):

package: re-flex/6.3.0
homepage: "https://github.com/Genivia/RE-flex"

# Top-level `make check` only builds tests/rtest (no automake TESTS); the
# runnable upstream tests are wired in tests/Make (`all` target + lazytest).
upstream_check_command: "make check (builds tests/rtest only; runnable tests are driven by tests/Make)"
upstream_test_in_build: true
upstream_test_command: "sh ohos_run_selfcontained.sh (six self-contained tests/Make programs, run in build())"

# Census: 13 test .cpp files under tests/.  10 are wired as runnable
# programs in tests/Make (9 in the `all` target + lazytest); 3
# (test_lorem_filter/splitter/tokenizer.cpp) have no main() and are
# #include components of lorem.cpp.  Four programs (test, lorem, ptest,
# btest) unconditionally include <boost/regex.hpp> / <pcre2.h> - the
# optional Boost.Regex / PCRE2 backends that re-flex itself never links -
# and are not run on OHOS; rtest + stest cover the native engine and the
# std::regex backend instead.  Detail: archives/r/re-flex/6.3.0/notes.md.
upstream_tests:
  - file: tests/test_bits.cpp
    source: https://github.com/Genivia/RE-flex/archive/refs/tags/v6.3.0.tar.gz
    description: "reflex::Bits set algebra (assert-based)"
    command: "./test_bits"
  - file: tests/test_ranges.cpp
    source: https://github.com/Genivia/RE-flex/archive/refs/tags/v6.3.0.tar.gz
    description: "reflex::Ranges interval arithmetic (assert-based)"
    command: "./test_ranges"
  - file: tests/streams.cpp
    source: https://github.com/Genivia/RE-flex/archive/refs/tags/v6.3.0.tar.gz
    description: "reflex::Input stream buffers, UTF-16 -> UTF-8 conversion (reads utf16lorem.txt)"
    command: "./streams"
  - file: tests/lazytest.cpp
    source: https://github.com/Genivia/RE-flex/archive/refs/tags/v6.3.0.tar.gz
    description: "lazy quantifier engine behavior (62 OK lines)"
    command: "./lazytest"
  - file: tests/stest.cpp
    source: https://github.com/Genivia/RE-flex/archive/refs/tags/v6.3.0.tar.gz
    description: "pattern corpus against the std::regex backend (117-entry table, -std=c++11)"
    command: "./stest"
  - file: tests/rtest.cpp
    source: https://github.com/Genivia/RE-flex/archive/refs/tags/v6.3.0.tar.gz
    description: "pattern corpus against the native RE/flex DFA engine (155-entry table, built by default make)"
    command: "./rtest"

test_package_tests:
  - file: test_package/tp_consumer.cpp
    description: "packaged-lib consumer contract: find()/matches()/text() assertions"
    command: "./tp_consumer"
  - file: test_package/smoke.l
    description: "end-to-end: packaged reflex generates + compiles + runs a scanner, output asserted"
    command: "./smoke_bin < input"

# 6 upstream program-level results (exit code + OK/ERRORFAIL counters)
# + 5 explicit test_package assertions (2 consumer + 3 output greps).
assertion_count: 11
