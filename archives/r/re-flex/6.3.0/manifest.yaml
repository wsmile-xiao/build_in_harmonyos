# 版本级 manifest
# 文件位置: archives/r/re-flex/6.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.3.0"

# 软件名
software: "re-flex"

# 编译状态
# published | built | failed | archived
# O5: 合并且 release upload 确认前一律 built
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游 GitHub tag 归档；v6.3.0 release 无二进制资产，
  # codeload tag 归档即权威发行渠道，sha256 经两次独立下载比对一致）
  url: "https://github.com/Genivia/RE-flex/archive/refs/tags/v6.3.0.tar.gz"

  # 源码校验和
  sha256: "c9e448b621734238c22352f54562bb88c1c6c18450f89d8fe6a2eb2bcce68a2b"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表（tarball 自带预生成 bootstrap，无需 autoreconf；
  # --build/--host 由配方显式传入，config.guess 不识别 HongMeng 内核）
  configure_options: []

  # 编译依赖列表（格式: name/version）— re-flex 无外部硬依赖，
  # 可选 Boost.Regex / PCRE2 后端未启用（仅 4 个上游测试程序需要）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁：上游源码零修改可构建）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  # GitHub tag 归档 autotools 包：config.guess 无法识别 HongMeng 内核，
  # configure 需显式传 --build/--host <arch>-linux-ohos（原生构建 build==host）
  - "config.guess 报 cannot guess build type 时显式传 --build/--host <arch>-linux-ohos 三元组" # knowledge_ref: DRAFT-E656-hongmeng-config-guess-and-mtime
  # 归档解包/拷贝丢 mtime 会触发 automake maintainer-mode 重生成规则（需 aclocal-X.Y，
  # 设备与 CI worker 均无）；用保 mtime 的物化方式（tar 解包 / copytree→copy2）使其休眠
  - "构建树物化必须保 mtime，否则 automake 重生成规则触发 aclocal 缺失假故障" # knowledge_ref: DRAFT-E656-hongmeng-config-guess-and-mtime
