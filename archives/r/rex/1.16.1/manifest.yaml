software: rex
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.16.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.16.1"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统
build_system: perl-makefile-pl

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/F/FE/FERKI/Rex-1.16.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.2"
    - "Sort::Naturally (CPAN)"
    - "Hash::Merge (CPAN)"
    - "JSON::MaybeXS (CPAN)"
    - "Text::Glob (CPAN)"
    - "YAML (CPAN)"
    - "String::Escape (CPAN)"
    - "Sub::Override (CPAN)"
    - "Digest::HMAC (CPAN)"
    - "Net::OpenSSH (CPAN)"
    - "Devel::Caller (CPAN)"
    - "Data::Validate::IP (CPAN)"
    - "XML::Simple (CPAN)"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Rex 是纯 Perl 模块，使用 ExtUtils::MakeMaker 构建系统（perl Makefile.PL）"
  - "需要通过 cpan 安装多个 Perl 运行时依赖（Sort::Naturally, Hash::Merge, JSON::MaybeXS 等）"
  - "ExtUtils::MakeMaker 的 fixin 在鸿蒙平台未正确替换 shebang 行，需手动修复"
  - "make install 后文件缺少执行权限，需手动 chmod +x"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
