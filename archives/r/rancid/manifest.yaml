software: rancid
display: "rancid"
description: "Rancid - Really Awesome New Cisco confIg Differ: 收集并版本化网络设备配置"
category: network
homepage: "https://www.shrubbery.net/rancid/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 对 expect/mktemp/ping 三个纯运行时辅助工具做硬性 AC_PATH_PROG+as_fn_error 探测，任一缺失整体中止；补丁改为 WARNING+置空（语义与上游对 sendmail 的 WARNING 一致）"
    - "HMFS 部分挂载点不实现 getcwd(3)，configure 顶部 ac_pwd= 空导致 working directory cannot be determined；补丁回退 $PWD（配方预置 os.environ['PWD']）"
    - "config.status 在 cwd 用 mktemp -d(umask 077) 建临时目录写 subs1.awk，HMFS 对 0700 目录不可写；补丁恒走 autoconf mkdir 回退并把 umask 放宽为 000"
    - "configure 找到的 INSTALL 是 HMBS 运行时 install shim，不支持 automake 多文件 -m 644 f1..fn dir/ 调用(Error 64)；package() 写只依赖 cp/mkdir/chmod 的 POSIX 安装包装器，经 INSTALL=<wrapper> -c + MKDIR_P=mkdir -p 传给 make install"
  common_dependencies:
    - "perl (>=5, Socket.pm >= 2.006)"

versions:
  "3.14":
    status: built
    build_date: "2026-10-09"
