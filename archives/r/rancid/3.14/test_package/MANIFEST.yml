# test_package/MANIFEST.yml — rancid 3.14
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见 docs/TEST_QUALITY_SPEC.md
#
# 结论：上游 rancid 3.14 发布 tarball 没有任何自动化测试（upstream_tests_exist: false）。
# 完整审计见下方 upstream_test_audit 结构化列表；计数口径与官方一致（manual_audit，总数 0）。

package: rancid/3.14
homepage: "https://www.shrubbery.net/rancid/"

# ── 上游测试套件存在性（经审计官方 3.14 发布 tarball 确认）──────────────
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

upstream_test_audit:
  - source: "rancid-3.14 发布 tarball 自带的各层 Makefile.am（顶层 + bin/ + bin/lg/ + share/ 等）"
    finding: "所有 Makefile.am 只声明安装目标（bin_PROGRAMS / bin_SCRIPTS / my_pkglib_DATA / dist_doc_DATA / dist_man_MANS / dist_noinst_DATA 等），无任何 TESTS / check_PROGRAMS / check-local / check_SCRIPTS 自动化测试目标。grep -rnE '(^|[^A-Za-z_])TESTS|check_PROGRAMS|check-local|check_SCRIPTS' */Makefile.am configure.ac 无命中（真机诊断命令同款）。"
  - source: "rancid-3.14 configure.ac"
    finding: "configure.ac 仅含 AC_PATH_PROG / AC_CHECK_HEADERS / AC_CHECK_FUNCS 依赖探测（expect/mktemp/ping/perl 等）与 AC_CONFIG_FILES，没有任何测试宏（无 AC_CONFIG_TESTDIR、AM_CONDITIONAL 测试开关、无 check_PROGRAMS 条件块），make check 无注册用例。"
  - source: "rancid-3.14 发布包目录布局"
    finding: "包内无 t/ tests/ test/ 测试目录，无任何 *.t Perl 测试文件；share/ 下的 *.exp 是 expect/tcl 登录辅助脚本模板（clogin/*login 的运行时工具），并非自动化测试；packages/ 下是各发行版打包元数据（spec/control/PKGBUILD），非测试。"
  - source: "conclusion"
    finding: "上游 rancid 3.14 没有任何可注册/可执行的自动化测试；按 no_tests 如实上报（status=no_tests, discovered=0, executed=0）。功能/语法/模块加载的消费者视角验证由 test_package 的 test.sh 在真机实跑（C 助手 EX_USAGE 64 + perl -c 语法 + use rancid 模块加载）。"

upstream_tests: []

# 上游测试命令（上游无测试套件，故不适用；build() 未集成任何上游测试）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# ── test_package 自带的消费者视角测试（上游无测试，适配后补全，真机实跑）──
test_package_tests:
  - file: test.sh
    description: >-
      5 个独立消费者断言（test.sh 确定性计数 RANCID_TEST_*，discovered/passedCount=5）：
      (A) C 助手 bin/hpuifilter 无参数 → 打印用法 + 退出码 64 (EX_USAGE)；
      (B) C 助手 bin/par -h → 退出码 64 (EX_USAGE)；
      (C) perl 模块 lib/rancid/rancid.pm 已安装且 perl -c 语法有效；
      (D) 'use rancid' 模块可加载（证明 perl 脚本的模块依赖在包内齐全）；
      (E) perl 主脚本 bin/rancid 已安装且 perl -c 语法有效。
    command: 'bash test.sh <package_folder>（由 test_package/conanfile.py test() 经 self.run 实跑，解析 RANCID_TEST_* 生成 HMBS_TEST_PACKAGE_RESULT）'
    assertion_count: 5

# 测试断言总数（test_package 消费者视角断言）
assertion_count: 5
test_package_test_count: 5
