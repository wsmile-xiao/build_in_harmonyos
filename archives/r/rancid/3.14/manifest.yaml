  - "0003-configure-config.status-tmpdir-hmfs.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "rancid 是自包含 prefix 的 autotools 包：脚本里把 @prefix@ 焙进 @INC/路径，放 lib/rancid/*.pm，bin/ 是 C 助手(par,hpuifilter)+大量 perl 脚本，etc/ 是样本配置；用 --prefix=/ + make install DESTDIR= 归一到 package_folder/{bin,etc,lib,share,var}"
  - "rancid 的 configure 对三个纯运行时辅助工具(expect/mktemp/ping)做硬性 AC_PATH_PROG+as_fn_error 探测，任一缺失即整个配置中止；三者都不是编译所必需，补丁把 'not found' 分支改成 WARNING+置空(参照上游本就对 sendmail 用 WARNING)，工具存在时行为与上游一致"
  - "perl(>=5, Socket.pm>=2.006) 是每支脚本的真正硬依赖，configure 也会硬校验；OHOS/发行版自带 perl 时无需特殊处理"
  - "rancid 无任何上游自动化测试(无 TESTS/check 目标、无 t/、无 tests/ 目录)；测试由 test_package 消费者视角验证: C 二进制退出码 64(EX_USAGE)+ perl 模块/脚本 perl -c 语法与加载"
  - "rancid 的自包含 autoconf configure 末尾 config.status 用 `mktemp -d ./confXXXXXX`(umask 077) 在 cwd 建临时目录写 subs1.awk；HMFS 部分挂载点对该 0700/0770 目录不可写(报 can't create ./confXXX/subs1.awk: Permission denied, cln/1.3.7、libapreq2 2.17 同指纹)。把 mktemp 改为 false 恒走 autoconf mkdir 回退并把回退 umask 077 放宽为 000(0777) 即修复"
  - "rancid 的 configure-made INSTALL 是 HMBS 运行时 install shim，支持 GNU 参数面子集有限：单文件探针可过但 automake 多文件 `-m 644 f1..fn dir/`(及 -d/-t) 调用报 Error 64 (EX_USAGE, package 阶段)。package() 写一个只依赖 cp/mkdir/chmod 的 POSIX 安装包装器并经命令行 INSTALL=<wrapper> -c + MKDIR_P=mkdir -p 传给 make install 即修复；包装器脚本里 `${1#-m}`/`${1#-t}` 在 Python str.format 要写成 `${{1#-m}}` 转义"


