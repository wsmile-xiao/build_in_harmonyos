# conandata.yml — rancid 3.14
# 上游: rancid — Really Awesome New Cisco confIg Differ
#       https://www.shrubbery.net/rancid/  (官方发布站, 维护设备配置版本库)
# 源: 官方 shrubbery.net 发布 tarball
# sha256: cbf608d8508b55dffb6b30c7a1c45c16ea53af7611a466e0cc47a863252f6e49
#
# ★ URL 按「最可能可达」排序，官方源放在最后回退 (守则下载可靠性规则)。
#   official 源 shrubbery.net 不在 ci/conan/build_and_test.sh 的 get_mirrors()
#   映射表内 (它只覆盖 github/gnu/gnome/kernel/sourceforge 等)，因此这里在
#   conandata.yml 里直接给有序列表：
#   1) Alpine Linux distfiles 镜像 (distfiles.alpinelinux.org)，v3.23 社区源
#      即为 rancid-3.14-r0 的构建来源；已实测与官方 tar.gz **sha256 逐字节
#      一致** (cbf608d8...) 且文件大小同为 534205 字节。
#   2) 官方 https://shrubbery.net/pub/rancid/rancid-3.14.tar.gz 回退。
sources:
  url:
    - "https://distfiles.alpinelinux.org/distfiles/v3.23/rancid-3.14.tar.gz"
    - "https://shrubbery.net/pub/rancid/rancid-3.14.tar.gz"
  sha256: "cbf608d8508b55dffb6b30c7a1c45c16ea53af7611a466e0cc47a863252f6e49"

patches:
  - patch_file: "patches/0001-configure-expect-mktemp-ping-nonfatal.patch"
    patch_description: >-
      rancid 的 configure 对三个纯运行时辅助工具 (expect/mktemp/ping) 做硬性
      as_fn_error 探测；任一缺失即中止。三者都不是编译所必需 (expect 仅给
      clogin/*login 登录脚本、mktemp 仅用于生成 etc/rancid.conf 的 PATH、
      ping 仅用于 lg 网路状态 CGI)，与上游本就把 sendmail 当 WARNING 同一
      语义。补丁把三个 "not found" 分支改为 WARNING + 置空并跳过 ping 语法
      探测；工具存在时行为与上游完全一致。
    patch_type: "portability"
  - patch_file: "patches/0002-configure-hmfs-getcwd-fallback.patch"
    patch_description: >-
      OHOS/HMFS 适配：rancid 是自包含 prefix 的 autotools 包，在 conan build
      的 in-source 目录直接运行生成的 configure。configure 开头用
      `pwd`(getcwd(3)) 计算 ac_pwd 并做 ls -di 目录一致性校验；HMFS 部分挂载点
      不实现 getcwd(3)（报 "getcwd: cannot access parent directories"），导致
      `pwd` 输出为空、configure 直接以 "working directory cannot be determined"
      中止（adms 2.3.7 / nspr 4.37 / aribb24 1.0.4 已过门禁的同款改写）。该目录
      本身可正常 cd/访问（仅 getcwd 不可用），且调用 shell 总把绝对工作目录记录在
      $PWD，同时配方在运行 configure 前预置 os.environ["PWD"]=source_folder。
      补丁把 ac_pwd 判定改为 `pwd` 失败(含 2>/dev/null 抑制其噪音输出)时回退 $PWD，
      随后保留原有 test -n ac_pwd + ls -di 一致性校验；$PWD 也为空时仍按上游报错
      退出，等价于上游行为。
    patch_type: "portability"
  - patch_file: "patches/0003-configure-config.status-tmpdir-hmfs.patch"
    patch_description: >-
      OHOS/HMFS 适配（config.status 临时目录）：configure 末尾调用 config.status
      生成 Makefile 时，autoconf 会先在当前目录创建临时目录并写 subs1.awk，模板为
      `tmp=`(umask 077 && mktemp -d "./confXXXXXX")` + 回退 `(umask 077 && mkdir)`
      （cln/1.3.7、libapreq2 2.17 同指纹：真机报 can't create ./confXXX/subs1.awk:
      Permission denied → could not setup config files machinery）。HMFS 部分挂载
      点对 mktemp 以 0700 建出的目录不可写（unsafe_local_mktemp），回退的 mkdir 因
      继承 umask 077 同样建出不可写目录。补丁在 configure 模板上把
      `mktemp -d "./confXXXXXX"` 改为 `false`（恒走 mkdir 回退），并仅把该回退的
      `(umask 077 && mkdir` 放宽为 `(umask 000 && mkdir`（0777），使 config.status
      落地临时目录可写；其余安全临时用法不受影响。通用平台不受 getcwd 限制，行为
      仍是 autoconf 标准临时目录流程。
    patch_type: "portability"
