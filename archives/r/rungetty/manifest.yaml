software: rungetty
display: "rungetty"
description: "Console getty that runs an arbitrary program on a tty line"
category: system
homepage: "http://ibiblio.org/pub/Linux/system/serial/getty/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Upstream ships one C file and a bare Makefile; the recipe builds the `rungetty` target with the compiler taken from the Conan conf (R33)."
    - "sys_errlist[] is glibc-only and is not visible in the OHOS libc headers even with _GNU_SOURCE; patched to strerror(errno) (R51 notes)."
    - "vhangup() has no libc wrapper on OHOS and the syscall itself is refused by the platform filter (SIGSYS), so the reference is made weak and the call is skipped when absent."
    - "Upstream `make install` is unusable here (hardcoded `-o root -g root`, missing install(1), non-FHS $(ROOT)/usr/man); the recipe installs bin/rungetty and share/man/man8/rungetty.8 itself."
    - "Console TTY capability probe (TIOCSCTTY/TCFLSH/TIOCCONS/vhangup) run on the device is recorded in 1.2/notes.md 附录 A/B."
  common_dependencies: []

versions:
  "1.2":
    status: built
    build_date: "2026-09-25"
