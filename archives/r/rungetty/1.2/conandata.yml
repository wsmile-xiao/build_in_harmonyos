patches:
  - patch_file: "patches/0001-libc-portability.patch"
    patch_description: >-
      Replace the glibc-only sys_errlist[] with strerror() and make the
      vhangup() libc wrapper optional: OHOS libc does not export vhangup, so an
      unconditional reference does not even link.
    patch_type: "portability"
