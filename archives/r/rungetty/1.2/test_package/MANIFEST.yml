package: rungetty/1.2
homepage: http://ibiblio.org/pub/Linux/system/serial/getty/

# ── 上游测试清点（R51）────────────────────────────────────────────
# rungetty 1.2 上游**没有任何测试**，清点证据：
#   1) 官方包 rungetty-1.2.tar.gz（sha256 5a2b7831…069a，15653 B）解包后只有 8 个
#      文件：CHANGELOG COPYING Makefile README THANKS mingetty.comment rungetty.8
#      rungetty.c —— 无 tests/ 目录、无 t/、无 *.t、无 check 目标。
#   2) Makefile 目标全集只有 all / install / rungetty / clean（18 行），
#      `make -n check` → "No rule to make target 'check'"。
#   3) rungetty.c 内不含断言/测试框架代码（无 assert( 除 libc 头之外的用点）。
# 结论：上游 0 用例 → 按"上游无测试、适配后补全"口径申报，鸿蒙特有用例见 T6。
upstream_check_command: "none (upstream ships no test suite)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests: []

# ── 适配后消费者测试（test_package/test_rungetty.py）───────────────
test_package_tests:
  - file: test_rungetty.py
    description: "T0 打包二进制存在且可执行（L1e 反向验证的挂钩点）"
    command: "python3 test_rungetty.py <pkg>/bin/rungetty <pkg>"
  - file: test_rungetty.py
    description: "T1/T2 --help 走 getopt 未知选项 → usage 路径退出码 1，且 stderr 给出 musl getopt 的 'unrecognized option' 原文"
    command: "python3 test_rungetty.py <pkg>/bin/rungetty <pkg>"
  - file: test_rungetty.py
    description: "T3 缺 tty 操作数 → usage() → 退出码 1"
    command: "python3 test_rungetty.py <pkg>/bin/rungetty <pkg>"
  - file: test_rungetty.py
    description: "T4 任何调用都不得死于信号（负返回码 = SIGSYS/SIGSEGV 类）——断言的是本包实际可达的五条调用路径（无参 / --help / tty1 / 不存在的 tty / -d 0 -n 0 tty1）均以 exit 终止；⚠ 不覆盖 vhangup 运行时路径：`vhangup()` 的调用点位于 open_tty() 内 ioctl(TIOCSCTTY) 成功之后，非 root 且无 /dev/tty1 的构建主机到不了，故 vhangup 弱符号可选化的证据只有链接期对照（pristine 源码 ld.lld: error: undefined symbol: vhangup  vs  打补丁后 conan create 成功）+ 补丁本身"
    command: "python3 test_rungetty.py <pkg>/bin/rungetty <pkg>"
  - file: test_rungetty.py
    description: "T5 ELF 可被动态加载器接受（返回码不是 126/127）"
    command: "python3 test_rungetty.py <pkg>/bin/rungetty <pkg>"
  - file: test_rungetty.py
    description: "T6【鸿蒙特有】按真机探针对账：/dev/tty1 在本平台不存在（ENOENT），rungetty tty1 必须以 1 失败而不是假成功"
    command: "python3 test_rungetty.py <pkg>/bin/rungetty <pkg>"
  - file: test_rungetty.py
    description: "T7 不存在的 tty 线路同样以 1 失败"
    command: "python3 test_rungetty.py <pkg>/bin/rungetty <pkg>"
  - file: test_rungetty.py
    description: "T8 -d/-n 等文档化短选项仍被解析（未被当成 tty 操作数）"
    command: "python3 test_rungetty.py <pkg>/bin/rungetty <pkg>"
  - file: test_rungetty.py
    description: "T9 man8 手册页落到 FHS 的 share/man/man8/rungetty.8（上游是 $(ROOT)/usr/man/man8，非 FHS）"
    command: "python3 test_rungetty.py <pkg>/bin/rungetty <pkg>"
  - file: test_rungetty.py
    description: "T10 application 包不得产出 lib/ 内容"
    command: "python3 test_rungetty.py <pkg>/bin/rungetty <pkg>"

assertion_count: 11
