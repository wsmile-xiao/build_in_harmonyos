# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: replxx/0.0.4
homepage: "https://github.com/AmokHuginnsson/replxx"

# 上游测试入口: tests.py (pexpect + unittest 交互式终端测试), 无 CTest
upstream_check_command: "python3 tests.py"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (88 个独立测试方法, 见测试台账)
upstream_tests:
  - file: tests.py
    source: replxx-release-0.0.4/tests.py
    description: "ReplxxTests 单测: 编辑/补全/历史/终止键/Unicode 等 88 个交互式用例"
    command: "TERM=xterm python3 tests.py"
    result: "Ran 88 tests; 86 passed (2 个 PTY 时序/参数解析环境差异失败, 原生构建未改码)"

# test_package 中自带的测试 (消费者视角验证, 实质调用 replxx API)
test_package_tests:
  - file: ohos_spec_test.cxx
    description: "HarmonyOS 专项测试: replxx 对象生命周期/历史记录/去重/状态接口断言"
    command: "./test_replxx"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9