# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rtmidi/6.0.0
homepage: "https://github.com/thestk/rtmidi"

# 上游测试清点（R51 三步法第 1 步，2026-09-20 源码包实测）：
#   上游 tests/ 目录为 8 个示例程序（非断言型测试框架，无 ctest 注册）：
#   cmidiin/midiclock/midiout/midiprobe/qmidiin/sysextest（交互式演示）
#   apinames（真实断言：编译 API 列表与名称映射，exit 1 on failure）
#   testcapi（C 包装 API 冒烟）
#   → 本配方 build() 内运行 apinames 与 testcapi（R51 可运行项全执行，
#     交互式演示程序不适用自动化，原因：需要实时 MIDI 输入/音频硬件）
upstream_check_command: "./tests/apinames && ./tests/testcapi"
upstream_test_in_build: true
upstream_test_command: "apinames + testcapi（conanfile build() 内 self.run）"

upstream_tests:
  - file: tests/apinames.cpp
    source: rtmidi 6.0.0
    description: "编译 API 名称映射断言（含非法 API 返回 Unknown 校验）"
    command: "./tests/apinames"
  - file: tests/testcapi.c
    source: rtmidi 6.0.0
    description: "C 包装 API 冒烟（OHOS 上以 dummy 后端运行）"
    command: "./tests/testcapi"

# test_package 中自带的测试（消费者视角验证 dummy 回退契约与完整流程）
test_package_tests:
  - file: test.cc
    description: "消费者测试: getCompiledApi 含 DUMMY + 名称非空 + 构造 + portCount=0 + openPort no-op + sendMessage 不崩 + 非法 API 显示名 Unknown"
    command: "./test_rtmidi"
  - file: consumer_workflow.cc
    description: "鸿蒙特有完整消费者用例: 真实链接 rtmidi::rtmidi，执行 dummy API 发现、输入/输出会话创建、虚拟端口生命周期、NoteOn/NoteOff 投递与关闭流程"
    command: "./rtmidi_dummy_workflow"

# 消费者断言数（CHECK 宏）；另有 1 个完整端到端消费者流程；上游
# apinames 内部断言以其退出码计 2 项。
assertion_count: 8
