  - patch_file: "patches/0001-RtMidi-cpp-list-dummy-in-compiled-apis.patch"
    patch_description: "upstream 6.0.0 lists every compiled backend in rtmidi_compiled_apis[] EXCEPT the auto-fallback dummy (RtMidi.cpp:88-90 defines __RTMIDI_DUMMY__ when no backend exists, but the array has no dummy entry): on backends-less targets getCompiledApi returns an empty list, the default constructor throws 'no compiled API', and the C wrapper's error path dereferences an uninitialized ptr (testcapi SIGSEGV, device-reproduced); add the dummy entry so the fallback is actually selectable"
    patch_type: "portability"
