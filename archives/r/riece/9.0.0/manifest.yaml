  ohos_specific_passed: 1

knowledge_gained:
  - "riece is a pure Emacs Lisp package: Emacs is both the byte-compilation toolchain and the runtime host; no C/C++ toolchain is used."
  - "config.status creates its temp dir with umask 077, which HMDFS turns into an unwritable directory (E129) - patch configure to umask 022."
  - "automake's doc stamp-vti/stamp-1 recipes call mdate-sh, which cannot parse the ISO-8601 dates of the HarmonyOS toybox ls and dump the whole environment into doc/version-*.texi (DRAFT-11103) - make them no-ops and keep the shipped version texi/info."
  - "GNU Emacs 29's make-face takes a single argument (faces.el: (defun make-face (face)), arity (1 . 1)). Upstream riece has THREE isomorphic two-argument call sites in top-level unless-blocks - riece-highlight.el, riece-history.el and riece-unread.el. Each aborts its own module load, and riece-history/riece-unread are in the default riece-addons list, so resolving addons (the `M-x riece' startup path) fails until all three are fixed; the docstring is restored via the face-documentation symbol property."
  - "Emacs resolves external helpers through exec-path (seeded from PATH); on OHOS /system/bin must precede /usr/bin or the sandbox refuses to execve the toybox symlinks (ls/true)."

