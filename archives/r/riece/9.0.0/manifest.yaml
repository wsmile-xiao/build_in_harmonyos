source:
  url: "https://download.savannah.nongnu.org/releases/riece/riece-9.0.0.tar.gz"
  filename: "riece-9.0.0.tar.gz"
  sha256: "88928dc21df3f3b15158e64b77268882544e6afa1d93f3545435ce430837fd2d"
  tar_format: tar.gz

build:
  system: elisp
  # Actual conanfile.py::build() / package() steps (NOT plain "make install":
  # the automake install machinery shells out to the HMDFS install-sh script,
  # which cannot be execve'd in this environment, so package() drives the
  # upstream `riece-install` helper through Emacs directly).
  configure_options:
    - "./configure --prefix=<package_folder> EMACS=<conan emacs>   # run through a system shell on OHOS"
    - "make                                                        # Emacs byte-compiles every module"
    - "make check                                                  # upstream lunit test-suite"
    - "emacs -batch -q -no-site-file -l lisp/COMPILE -f riece-install <src>/lisp <pkg>/share/emacs/site-lisp   # packaging"
  dependencies:
    - "emacs/29.1"
  cc: N/A
  cxx: N/A

patches_applied:
  - "0001-configure.patch"
  - "0002-doc-Makefile.in.patch"
  - "0003-lisp-riece-highlight.el.patch"
  - "0004-lisp-riece-history.el.patch"
  - "0005-lisp-riece-unread.el.patch"

artifacts:
  lisp:
    - "share/emacs/site-lisp/riece/*.el"
    - "share/emacs/site-lisp/riece/*.elc"
    - "share/emacs/site-lisp/riece/*.xpm"
    - "share/emacs/site-lisp/riece/*.rb"

test_results:
  upstream_total: 29
  upstream_passed: 29
