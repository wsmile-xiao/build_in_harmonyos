# conandata.yml — riece 9.0.0

sources:
  "9.0.0":
    url: "https://download.savannah.nongnu.org/releases/riece/riece-9.0.0.tar.gz"
    filename: "riece-9.0.0.tar.gz"
    sha256: "88928dc21df3f3b15158e64b77268882544e6afa1d93f3545435ce430837fd2d"

patches:
  "9.0.0":
    - patch_file: "patches/0001-configure.patch"
      patch_description: >-
        HMDFS/OHOS portability: use umask 022 for the config.status temporary
        directory.  HMDFS force-sets the setgid bit, so the automake default
        umask 077 yields a temp directory that rejects writes even from its
        owner ("could not setup config files machinery", knowledge base E129).
        Trade-off: the ./confXXXXXX scratch dir (config.log, subs*.awk) becomes
        group/other readable during configuration; acceptable on single-user
        build workers, and required for the build to proceed at all on HMDFS.
      patch_type: "portability"
    - patch_file: "patches/0002-doc-Makefile.in.patch"
      patch_description: >-
        HMDFS/OHOS portability: turn the automake stamp-vti / stamp-1 recipes
        into no-ops.  They call mdate-sh, which cannot parse the ISO-8601 dates
        printed by the HarmonyOS toybox ls (and dump the environment into
        doc/version-*.texi when the parse fails), while texinfo/makeinfo are
        unavailable on the target.  The release tarball's doc/version-*.texi
        and prebuilt info files stay as shipped (knowledge draft DRAFT-11103).
      patch_type: "portability"
    - patch_file: "patches/0003-lisp-riece-highlight.el.patch"
      patch_description: >-
        GNU Emacs 29 API compatibility (NOT OHOS-specific - it also fails on
        Linux + Emacs 29): call make-face with a single argument.  Emacs 29's
        make-face accepts only the face name (faces.el: (defun make-face
        (face)), arity (1 . 1)), while riece passes an XEmacs-style docstring as
        the second argument.  Site 1 of 3: riece-highlight.el.  The
        documentation string is preserved through the face-documentation symbol
        property.
      patch_type: "portability"
    - patch_file: "patches/0004-lisp-riece-history.el.patch"
      patch_description: >-
        GNU Emacs 29 API compatibility: same single-argument make-face fix as
        0003 for riece-history.el (site 2 of 3).  This defect lives in the file
        itself - riece-history.el is not merely a victim of riece-highlight.el;
        when addons are resolved (riece.el's riece function loads the default
        addon list, which includes riece-history), the two-argument call aborts
        the whole startup.
      patch_type: "portability"
    - patch_file: "patches/0005-lisp-riece-unread.el.patch"
      patch_description: >-
        GNU Emacs 29 API compatibility: same single-argument make-face fix as
        0003 for riece-unread.el (site 3 of 3).  This defect lives in the file
        itself - riece-unread.el is not merely a victim of riece-highlight.el;
        when addons are resolved (riece.el's riece function loads the default
        addon list, which includes riece-unread), the two-argument call aborts
        the whole startup.
      patch_type: "portability"
