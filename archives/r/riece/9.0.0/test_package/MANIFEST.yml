package: riece/9.0.0
homepage: "https://www.nongnu.org/riece/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: lisp/test/test-riece-addon.el
    description: "add-on resolution"
    command: "make check"
    count: 2
  - file: lisp/test/test-riece-alias.el
    description: "nickname / alias expansion"
    command: "make check"
    count: 7
  - file: lisp/test/test-riece-cache.el
    description: "channel cache management"
    command: "make check"
    count: 4
  - file: lisp/test/test-riece-eval.el
    description: "server-side expression evaluation"
    command: "make check"
    count: 5
  - file: lisp/test/test-riece-log.el
    description: "log file encoding/decoding and display"
    command: "make check"
    count: 7
  - file: lisp/test/test-riece-shrink-buffer.el
    description: "buffer shrinking"
    command: "make check"
    count: 1
  - file: lisp/test/test-riece-url.el
    description: "URL detection"
    command: "make check"
    count: 2
  - file: lisp/test/test-riece-yank.el
    description: "yank helper"
    command: "make check"
    count: 1

test_package_tests:
  - file: test_riece.el
    description: >-
      Loads the packaged riece.elc from RIECE_LISPDIR, validates the upstream
      version, loads the three make-face sites (riece-highlight.el /
      riece-history.el / riece-unread.el) proving the GNU Emacs 29 adaptation,
      and mirrors riece.el's default addon resolution
      (riece-resolve-addons) to prove the `M-x riece' startup path works
    command: "emacs -Q --batch -L $RIECE_LISPDIR -l test_riece.el"
    count: 13

ohos_specific_tests: 1
assertion_count: 13
