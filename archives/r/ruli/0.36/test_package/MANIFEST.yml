# test_package/MANIFEST.yml — ruli/0.36
# 本包构建面（C 库 libruli.a / libruli.so.4）无自动化测试套件：显式审计
# （upstream_tests_exist: false + 非空 upstream_test_audit）。
# 口径澄清（2026-09-25 审计整改，原 P2）：上游发布包内**确有**一条只属语言绑定
# 生态的已注册用例 —— perl/RULI/t/RULI.t（Test::More，plan=12，经
# perl/RULI/Makefile.PL 注册的 make test）。它已逐条清点进下方
# upstream_test_audit（见 is_test 字段口径注），不由本包构建或执行，故不进本包
# 分母；本包消费者测试账（12 项）不受影响。

package: ruli/0.36
homepage: "https://www.nongnu.org/ruli/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# upstream_tests / upstream_tests_exist 的口径 = 「会被本包 build() 调用的上游测试
# 套件」（conanfile.py build() 只跑 make -C src，注释已声明不运行任何测试目标），
# 不是「tarball 里有没有任何测试文件」的存在性断言 —— 后者见下方 top_level_files
# 与 scan_result 的如实枚举。
upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  source_tarball: "ruli_0.36.orig.tar.gz (https://download.savannah.nongnu.org/releases/ruli/ruli_0.36.orig.tar.gz)"
  source_sha256: "11d32def5b514748fbd9ea8c88049ae99e1bb358efc74eb91a4d268a3999dbfa"
  source_entries: 185
  makefiles_scanned:
    - "Makefile"
    - "src/Makefile"
    - "tools/Makefile"
    - "sample/Makefile"
    - "guile/Makefile"
    - "lua/Makefile"
    - "java/Makefile"
    - "java/src/jni/Makefile"
  # is_test 字段口径（审计整改注）：false = 「不由本包（ruli/0.36 配方）构建或执行」，
  # 不等于「这不是一个测试」。下方 guile / lua / php / perl 四条同属此口径，
  # 其中 perl/RULI/t/RULI.t 是本轮清点新**入账**的上游已注册用例（原先被聚合条目漏记）。
  top_level_files:
    - file: "Makefile"
      role: "顶层递归入口，仅 default/clean/install/dpkg/dpkg-clean/release-clean 五个目标，逐个 $(MAKE) -C src 与 -C sample"
      test_targets: "none（无 check / test / check-local，且连 tools/ 都不进 default）"
      is_test: false
    - file: "src/Makefile"
      role: "核心库构建：LIBOBJ(20 个 .c) -> libruli.a 与 libruli.so.4，另有 SOFT_* 规则对 5 个文件关掉 -Werror"
      test_targets: "none（default/build/clean/strip/install 四目标，无任何测试规则）"
      is_test: false
    - file: "tools/Makefile"
      role: "19 个手工命令行演示程序（list/resolve/hostsolver/srvsolver/syncsolver/addrsolver/ruli-host/cycle_res/ipv6/rfc3484/in6_addr/rand…），多数从 stdin 读域名并打印结果"
      test_targets: "none（default 目标仅链接可执行文件，无 check 注册，无断言、无非零退出码约定）"
      is_test: false
    - file: "sample/Makefile"
      role: "12 个 API 示例（srvsearch/smtpsearch/httpsearch 及 sync_ 变体、ruli-getaddrinfo、getaddrinfo）"
      test_targets: "none（同上，全部是需要真实网络与人工判读的前台程序）"
      is_test: false
    - file: "guile/ruli-test.scm"
      role: "Guile 绑定的手工脚本：先 (ruli-sync-query \"_http._tcp\" \"isc.org\" -1 0) 打真实 ISC 域名，再用 Scheme 数据比对手写 SRV 列表"
      test_targets: "none（需 guile 解释器 + 由 guile/Makefile 用 `guile-config` 现造的 libguile-ruli.so；目标机两者皆无，且脚本自身不被任何 make 目标调用）"
      is_test: false
    - file: "lua/test.lua"
      role: "Lua 绑定的手工脚本（shebang `#!/usr/bin/env lua`）"
      test_targets: "none（需 lua 解释器 + liblua-ruli.so，lua/Makefile 链接的是 `-llua50`，目标机无 lua50；且 /usr/bin/env 指向 toybox 而 lua 不在 PATH）"
      is_test: false
    - file: "php/ruli/tests/001.phpt"
      role: "PHP 扩展的单个 PHPT 片段（--TEST--/--FILE--），需 `phpize + make && php run-tests.php` 才成立"
      test_targets: "none（php/ 目录无 Makefile，不由顶层 Makefile 递归进入；目标机无 php 解释器，也无 ruli PHP 扩展）"
      is_test: false
    - file: "perl/RULI/t/RULI.t"
      role: >-
        本轮清点新入账的上游已注册用例（原先被「其余绑定目录」聚合条目漏记）：
        Perl 绑定 Net::RULI 的 Test::More 用例，计划数 12。全文 74 行，第 6 行
        「use Test::More tests => 12;」给出 plan，第 7 行「BEGIN { use_ok(...) }」
        加载模块；11 处 ok() 调用 + 这 1 处 use_ok() 正好 12 个断言，与 plan 逐字一致。
        文件头两行自述「Before make install is performed this script should be
        runnable with make test. After make install it should work as perl RULI.t」
        ⇒ 它是经同目录 perl/RULI/Makefile.PL（ExtUtils::MakeMaker）生成 Makefile 后
        由 make test 注册执行的上游正式用例，属真实注册，不是散落脚本。
      upstream_plan_count: 12
      test_targets: >-
        对 C 构建系统为 none：顶层 Makefile（实测 565 B，$Id: Makefile,v 1.9 2004-06-24）只有
        default、clean、install、dpkg、dpkg-clean、release-clean 六个目标，default 只
        $(MAKE) -C src 与 -C sample（连 tools 都不进），全 tarball grep SUBDIRS 与 DIST_SUBDIRS
        零命中，perl 在顶层与 src/tools/sample 四个 Makefile 中零出现；perl/RULI 只带
        Makefile.PL（需现场 perl Makefile.PL && make 才生成 test 目标，本配方不走语言绑定）；
        顶层/src/tools/sample 四个 Makefile 里 check:、test:、check-local:、TESTS、
        check_PROGRAMS 全部零命中（裸 Makefile 工程，连 automake 的隐式空 check 都没有），
        make check 在这四个目录里都是未定义规则。
      not_built_or_run_reasons: >-
        三条独立技术原因，逐条对应本交付面：1) 构建面不覆盖 —— conanfile.py 的
        build() 只执行 make -C src 产出 libruli.a 与 libruli.so.4，package() 只
        copy src 下的 .h 与库文件，本配方不构建任何语言绑定，被测对象 Net::RULI
        这个 XS 模块在本包内根本不存在；2) 运行时不具备 —— 该 .t 需 perl 解释器，
        并需先 perl Makefile.PL 且 make 生成 MakeMaker 的 test 目标，目标机与 CI 的
        Conan 工具链都不提供这套 Perl 开发栈；3) 非确定且无回归基线 —— 它的 ok()
        断言的是对 bocaaberta.com.br、uol.com.br、aol.com、kensingtonlabs.com、
        registro.br 五个活域名真发 SRV/SMTP/HTTP 查询能否拿到非空应答列表，
        结果随公网链路与权威区数据变化，不能当平台判定依据。
        综上，本条与已逐条披露并判 is_test:false 的 guile/ruli-test.scm、
        lua/test.lua、php/ruli/tests/001.phpt **同类同级**：同为语言绑定生态、
        同需绑定专属解释器/扩展、同打真实域名、同不被本包构建系统进入。
      is_test: false
    - file: "java/ (其余绑定目录)"
      role: "JNI 绑定源码与说明（java/Makefile、java/src/jni/Makefile），不参与顶层 make"
      test_targets: "none（两个 Makefile 里无 check / test / TESTS 注册，也无断言型用例）"
      is_test: false
  scanned_for:
    - "Makefile 中的 check: / test: / check-local: / TESTS / check_PROGRAMS"
    - "TEST( / TEST_F( (gtest)"
    - "def test_ / pytest 入口"
    - "enable_testing / add_test (ctest)"
    - "meson test 入口"
    - "tests/ / test/ / t/ / spec/ 目录"
    - "*_test.c / test_*.c / *check*.c 自动化 C 用例"
    - "DejaGnu .dg / libcunit / check.h / libtap"
  scan_result: >-
    分两个口径逐条如实枚举（2026-09-25 审计整改：原写法「0 matches … 无 tests/
    或 test/ 目录」漏记了下式第（1）条，且与本文件 scanned_for 第 6 项自述的
    「t/ 目录」自相矛盾，已更正）。


    一、C 构建系统侧：0 命中。对官方 ruli_0.36.orig.tar.gz 全 185 条目扫描，
    8 个 Makefile 中无 check:、test:、check-local:、TESTS、check_PROGRAMS 任一目标；
    无 gtest（TEST( / TEST_F(）、无 ctest（enable_testing / add_test）、无 pytest
    （def test_）、无 meson test 入口、无 DejaGnu .dg、无 libcunit / check.h / libtap
    注册；C 侧 20 个库源文件 + 31 个 tools/sample 演示源文件全部为前台程序，无断言、
    无非零退出码约定、不读回归基线。⇒ 本包构建面可执行的上游测试数为 0。


    二、目录名口径：命中 2 处，均在语言绑定生态、均不由本包构建系统进入。
    (1) perl/RULI/t/ 目录含 RULI.t —— Test::More 正式注册用例，plan=12，
    本文件已在 top_level_files 单列条目并逐条给出三条不构建/不执行理由；
    (2) php/ruli/tests/ 目录含 001.phpt —— PHP 扩展 PHPT 片段，需 phpize +
    run-tests.php 才成立，本文件亦已单列并判 is_test:false。
    另 guile/ruli-test.scm 与 lua/test.lua 两个手工脚本按文件名口径命中，同判
    is_test:false。


    三、其余目录名口径无命中：全 tarball 只有 perl/RULI/t 这一个 t/ 目录，无顶层
    tests/、test/ 或 spec/ 目录。


    ⇒ 结论：上游测试静态总数（清单口径）= 12，全部来自 perl/RULI/t/RULI.t 一条
    用例的 Test::More plan；其中由本包构建面进入的可执行数 = 0。本包账本维持
    分母 12 = 0（上游可执行）+ 12（消费者集成），既未缩分母，也未把上游的 12 并进
    通过数。
  make_check_output: >-
    不适用（口径限 C 构建面，即本配方 make -C src 所及的顶层/src/tools/sample 四个
    Makefile）：`make check` 在这四个 Makefile 里都是未定义目标（裸 Makefile 工程，
    非 automake，因此也没有 automake 的隐式空 check 规则），执行即报
    "No rule to make target 'check'"。build() 因此不调用任何测试目标
    （upstream_test_in_build: false），证据由 test_package 每轮的
    HMBS_UPSTREAM_TEST_RESULT status=no_tests 标记给出。语言绑定侧的 make test
    （perl/RULI/t/RULI.t）不在本包 make 面上，见上方 top_level_files 条目。
  reason: >-
    ruli 0.36 是 2002-2005 年间的裸 Makefile C 库：就 **C 构建面** 而言，发布包只带
    人工前台演示程序，从未包含可自动化运行的 C 测试套件，也没有任何测试运行器注册。
    注册过测试运行器的只有语言绑定生态两处 —— perl/RULI/t/RULI.t 经
    perl/RULI/Makefile.PL（ExtUtils::MakeMaker）的 make test 注册（plan=12）、
    php/ruli/tests/001.phpt 经 PHP 的 run-tests.php 注册 —— 外加 guile/ruli-test.scm
    与 lua/test.lua 两个不被任何 make 目标调用的手工脚本。这四处全部在本配方的构建面
    之外（本包不构建任何语言绑定），逐条理由见上方 top_level_files 对应条目。

test_package_tests:
  - file: test_ruli.c
    description: >-
      消费者功能测试：只 #include <ruli.h> 并 target_link_libraries(ruli::ruli)，
      完成 12 项真实断言——1) ruli_dname_encode 生成 RFC1035 wire 形式并与
      ruli_dname_encode_size 自洽、带尾点拼写等价；2) ruli_dname_decode 回环为
      "www.example.org." 且 dst_name_len 精确、压缩指针必须被拒；3) 缓冲不足/
      超长名单两个负例分支；4) ruli_dname_match 大小写与尾点不敏感、不同长度与
      不同域必须不匹配；5) ruli_dname_expand 经 0xC00C 标签偏移展开出与明文
      完全一致的域名，越界指针必须被拒；6) ruli_get_qtype_code/qclass_code/
      get_qtype_name/rr_type_is_address 四张表的取值与未知项 0 码；
      7) ruli_addr_parse 的 v4/v6 解析（含八位组逐一校验）、ruli_addr_snprint
      回环、垃圾输入落 PF_UNSPEC；8) ruli_addr_rfc3484_sort 对 global 作用域
      v4+v6 混合表按 rule 9 产出 v6 在前的排列；9) ruli_mem_malloc/realloc/free
      （实连 liboop oop_malloc）+ ruli_malloc 钩子替换确实被调用 +
      ruli_list_new_cap/push/insert_at/shift_at/pop/top/get/prune/capacity
      容器语义；10) ruli_res_errstr 与 ruli_list_errstr 两张表互不相同；
      11) 真发一次 DNS 查询 —— 全文唯一联网项（test_package/conanfile.py 第 32 行
      NETWORK_CHECKS = 1）：ruli_sync_query("_rulitest","example.invalid",0,0)
      走 resolv.conf 装载 + UDP/53 收发 + ruli_parse 解头，必须拿到
      RULI_RCODE_NAMEERROR 的权威否定答复；重试 SYNC_ATTEMPTS 次仍拿不到答复时
      打印 CHECK-SKIP + 原因 + srv_code/rcode 证据，rcode 落在协议可表达区间但
      非 NAMEERROR（递归解析器对保留 TLD 回 SERVFAIL/REFUSED）同样记 CHECK-SKIP
      并附证据，只有保留 TLD 真回 NOERROR 才判 CHECK-FAIL，分母 12 不缩；
      12) ruli_getaddrinfo() 分发 + 选项访问器回环 —— check_getaddrinfo_dispatch
      （test_ruli.c 第 736-787 行，**不联网**、确定性）：
      ruli_getaddrinfo_setoptions/getoptions 确实写入并读回
      RULI_RES_OPT_SRV_NOINET6 且随后还原原值；再以
      AI_NUMERICHOST|AF_INET|SOCK_STREAM 调 ruli_getaddrinfo("127.0.0.1","80")，
      断言返回码为 0 且 addrinfo 非空、ai_family 为 AF_INET、ai_addrlen 不短于
      sockaddr_in，并逐字段核 sockaddr_in 的 port 等于 htons(80)、
      addr 等于 htonl(0x7F000001)。该项走 ruli 内部的 NUMERICHOST 短路分支，
      不发任何 DNS 报文。
    command: "test_ruli（CMake 构建后经 conanrun 与直调双重执行并计数 CHECK-OK/CHECK-SKIP/CHECK-FAIL 行）"

assertion_count: 12
test_case_count: 12
test_counting:
  # 口径（2026-09-25 审计整改注）：下面两个 *_total 是「进本包账本」的数，不是
  # 「tarball 里存在多少个被注册的用例」。上游清单口径的静态总数是 12
  # （perl/RULI/t/RULI.t 的 Test::More plan），但这 12 条全部不被本包构建或执行
  # （三条技术理由见 top_level_files 对应条目的 not_built_or_run_reasons），
  # 因此计入本包账本的上游独立测试数为 0 —— 未从清单里删掉、也未并进通过数。
  upstream_independent_total: 0
  integration_independent_total: 12
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false
