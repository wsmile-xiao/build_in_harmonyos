version: "0.36"
software: "ruli"
status: built
build_date: "2026-09-25"
build_system: "makefile"

source:
  url: "https://download.savannah.nongnu.org/releases/ruli/ruli_0.36.orig.tar.gz"
  tar_format: tar.gz
  sha256: "11d32def5b514748fbd9ea8c88049ae99e1bb358efc74eb91a4d268a3999dbfa"

build:
  system: makefile
  configure_options: []
  make_targets:
    - "libruli.a (static, default option)"
    - "libruli.so.4 (shared, built by upstream default rule; packaged only with -oshared=True)"
  make_variables:
    CC: "resolved from tools.build:compiler_executables (upstream hardcodes `CC = gcc`; no gcc on target)"
    CFLAGS: "-O2 -pipe -Wall -g -shared -D_REENTRANT -I. -I<liboop include> (replaces upstream `$(WARN) -Werror $(FLAGS)`)"
    LDFLAGS: "-L<liboop lib>"
    OOP_INCLUDE_DIR: "liboop cpp_info.includedirs[0]"
    OOP_LIB_DIR: "liboop cpp_info.libdirs[0]"
  dependencies:
    - "liboop/1.0.1"
  cc: clang

patches_applied: []

knowledge_gained:
  - "ruli is not dependency-free: src/ruli_mem.c wraps oop_malloc/realloc/free, src/ruli_sync.c drives oop_sys_new/source/run/delete and src/ruli_fsm.c calls the oop_source on_fd/on_time vtable, so liboop is a hard link-time requirement (`-loop` in src/Makefile); the public header chain ruli.h -> ruli_res.h -> ruli_oop.h does `#include <oop.h>`, so the requirement must be declared with transitive_headers=True as well as transitive_libs=True"
  - "Bare-Makefile projects whose Makefile *assigns* (not appends to) CC/CFLAGS cannot be steered by environment variables, but GNU make re-expands command-line variable values, so `make 'CFLAGS=$(WARN) $(FLAGS)'`-style overrides — and here a fully explicit replacement flag set — remove upstream's `-Werror` without a single source patch (R1/R49 minimal-intervention, R33 compiler from conf only)"
  - "E092 family again for a Makefile project: the CI profile's absolute clang path plus a PATH containing the same bin dir (VirtualBuildEnv + buildenv_info.prepend_path) is enough — the Makefile's hardcoded lowercase `ar`/`make` still resolve, so no `AR=` indirection patch is needed"
  - "ruli 0.36 ships no automated C test suite (185-entry audit, 8 Makefiles, zero check/test/TESTS targets), while upstream does register 12 perl-side cases in perl/RULI/t/RULI.t (Test::More plan=12, wired by Makefile.PL) that this recipe neither builds nor runs (top-level Makefile only recurses src and sample; grep SUBDIRS is empty in the tarball) - the 12 are booked into the upstream static denominator, not into the pass count; `make check` is an undefined rule, not an automake no-op, so upstream_test_in_build must be false and the denominator is carried by 12 hand-written consumer checks"
  - "Exactly one of those twelve consumer checks (the .invalid/nxdomain one) really speaks DNS over UDP/53 through ruli's own resolv.conf loader: the RFC 6761 `.invalid` TLD must come back as RULI_RCODE_NAMEERROR, which is what distinguishes a decoded authoritative negative answer from a silent transport failure"
