software: repo
# 版本级 manifest - ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2"

build_system: python

status: built

build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/GerritCodeReview/git-repo/archive/refs/heads/main.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom

  configure_options: []

  dependencies:
    - git/2.46.0  # repo 需要 git 命令
    - python/3.12.8  # repo 是 Python 脚本

  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "repo 是纯 Python 脚本，无需编译，只需打包"
  - "repo launcher 脚本会自动从网络下载完整工具"
  - "预编译包包含 launcher + Python 模块文件"

# ============================================================
# 软件描述
# ============================================================

description: |
  Repo is a tool built on top of Git. Repo helps manage many Git repositories,
  does the uploads to revision control systems, and automates parts of the
  development workflow. Repo is not meant to replace Git, only to make it
  easier to work with Git in Android development.

homepage: https://gerrit.googlesource.com/git-repo/

category: development

license: Apache-2.0

# ============================================================
# 安装说明
# ============================================================

install_guide: |
  # 方式1: 只使用 launcher 脚本（推荐）
  # 第一次运行时会自动从网络下载完整的 repo 工具
  tar -xzf repo-2-ohos-aarch64.tar.gz -C $HOME/usr/local
  export PATH=$HOME/usr/local/bin:$PATH
  repo --version

  # 方式2: 使用本地安装的完整工具
  # 需要修改 launcher 脚本以使用本地 Python 模块
  # 设置 REPO_URL 环境变量指向本地目录

maintainer: OpenHarmony PC Developer社区
last_updated: "2026-06-04"
tags: [repo, git, android, python, version-control]