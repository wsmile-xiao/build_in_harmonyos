# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 Python CLI：copytree 源码包到 site-packages + 由 setup.py console_scripts 生成 bin/ 入口脚本（docutils 0.23 先例），无 pip 网络解析 (ref: notes.md)"
  - "cli.py 在 import 期读取包内 VERSION 文件（include_package_data），打包必须保留该文件，否则 import 失败 (ref: conanfile.py)"
  - "运行时依赖 docutils 经 conan 消费 docutils/0.23（requirements.txt: >=0.11,<1.0 被 0.23 满足）；docutils recipe 不导出 PYTHONPATH，需在本包 package_info 中追加其 site-packages (ref: reports/conan-verify-report.md)"
  - "上游测试入口 test.sh = flake8 --max-line-length=120 + nosetests --nocapture；实测 16/16 通过（nose-py3 1.8.0 在 Python 3.12 可用） (ref: reports/test-report.md)"
