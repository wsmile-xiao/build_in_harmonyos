# test_package/MANIFEST.yml — rst-lint 2.0.2
# 上游官方测试声明文件（CI 门禁 L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: rst-lint/2.0.2
homepage: "https://github.com/twolfson/restructuredtext-lint"

# 上游测试入口（真实存在并已实际执行）：仓库根 test.sh
#   test.sh = flake8 --max-line-length=120 restructuredtext_lint && nosetests --nocapture
upstream_check_command: "./test.sh"
upstream_test_in_build: false
upstream_test_command: "./test.sh  (flake8 --max-line-length=120 restructuredtext_lint; nosetests --nocapture)"

# 上游实际运行的测试程序与用例（restructuredtext_lint/test/test.py，共 16 个用例）
upstream_tests:
  - file: restructuredtext_lint/test/test.py
    source: restructuredtext_lint-2.0.2/restructuredtext_lint/test/test.py
    description: >-
      TestRestructuredtextLint (9) + TestRestructuredtextLintCLI (7) ——
      unittest.TestCase 结构，由 test.sh 的 nosetests --nocapture 发现并执行
    command: "nosetests --nocapture"
    test_count: 16
    cases:
      - restructuredtext_lint.test.test.TestRestructuredtextLint.test_passes_valid_rst
      - restructuredtext_lint.test.test.TestRestructuredtextLint.test_raises_on_invalid_rst
      - restructuredtext_lint.test.test.TestRestructuredtextLint.test_encoding_utf8
      - restructuredtext_lint.test.test.TestRestructuredtextLint.test_second_heading_short_line_number
      - restructuredtext_lint.test.test.TestRestructuredtextLint.test_invalid_target
      - restructuredtext_lint.test.test.TestRestructuredtextLint.test_invalid_line_mismatch
      - restructuredtext_lint.test.test.TestRestructuredtextLint.test_invalid_link
      - restructuredtext_lint.test.test.TestRestructuredtextLint.test_rst_prolog_basic
      - restructuredtext_lint.test.test.TestRestructuredtextLint.test_rst_prolog_line_offset
      - restructuredtext_lint.test.test.TestRestructuredtextLintCLI.test_rst_lint_filepaths_not_given
      - restructuredtext_lint.test.test.TestRestructuredtextLintCLI.test_rst_lint_correct_file
      - restructuredtext_lint.test.test.TestRestructuredtextLintCLI.test_rst_lint_folder
      - restructuredtext_lint.test.test.TestRestructuredtextLintCLI.test_rst_lint_missing_file
      - restructuredtext_lint.test.test.TestRestructuredtextLintCLI.test_rst_lint_many_files
      - restructuredtext_lint.test.test.TestRestructuredtextLintCLI.test_level_fail
      - restructuredtext_lint.test.test.TestRestructuredtextLintCLI.test_level_high

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_rst_lint.py
    description: >-
      消费者断言：import 已安装的 restructuredtext_lint（__version__）+
      lint()/lint_file() 经打包 docutils/0.23 解析 reST + bin/rst-lint
      --version / 干净文件 / 破损文件 / 目录输入 + [OHOS] 平台用例
      （POSIX entry script + $TMPDIR 路径语义）
    command: "python3 test_rst_lint.py <bin/rst-lint>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 8
