# 软件级 manifest — rst-lint
# 遵循 ARCHIVE-SPEC v2.0

software: rst-lint
display: "rst-lint"
description: "reStructuredText 语法/结构检查器（reST linter CLI，PyPI 包名 restructuredtext-lint）"
category: utility
homepage: "https://github.com/twolfson/restructuredtext-lint"
license: Unlicense
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Python 应用（无 C/C++ 扩展）：无编译器/链接步骤，产物为 site-packages/restructuredtext_lint/ + bin/ 入口脚本"
    - "上游 sdist 仅含 setup.py（setuptools，无 pyproject.toml）；采用 copytree staging + 生成 bin/ 入口脚本（docutils/0.23 先例），确定性且不依赖 pip 网络"
    - "运行时唯一第三方依赖 docutils（>=0.11,<1.0）由 conan 消费 docutils/0.23，禁止 pip --build=missing 绕过（R36）"
    - "OHOS /tmp 只读（Gotcha E002）：消费侧与测试均使用 $TMPDIR"
    - "工具类型：软件级目录需 commands.json 声明（R38）；入口脚本用 POSIX shebang #!/usr/bin/env python3（OHOS python3 在 PATH）"
  common_dependencies:
    - docutils

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.0.2":
    status: built
    build_date: "2026-10-02"
    conan_ref: "rst-lint/2.0.2"
