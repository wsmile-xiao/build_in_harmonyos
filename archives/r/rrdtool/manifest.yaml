# manifest.yaml - rrdtool 软件级元数据
software: rrdtool
display: "RRDtool"
description: "高性能时序数据记录与绘图系统：环形数据库（RRD）+ rrdtool 多路命令（create/update/fetch/graph 等）与 rrdupdate/rrdcached/rrdcgi 辅助工具"
category: "database"
homepage: "https://oss.oetiker.org/rrdtool/"
license: GPL-2.0-or-later
build_system: "autotools（tarball 自带生成版 configure）"

ohos_adaptation:
  key_points:
    - "musl rindex() 假依赖：OHOS libc 连符号都未导出（ld.lld 链接级实测），0003 补丁 rindex→strrchr（ntopng/6.6-0004 同家族，E534 相邻）"
    - "E011/E114：configure 的 umask 077 临时目录在 HMDFS 不可写，配方内 replace_in_file 移除（zile/radvd/probabel 先例）"
    - "E386：configure 以能力探针选定的 CONFIG_SHELL 直接钉在命令行上（profile buildenv 的 hnp bash 无法保持 getcwd）"
    - "图渲染栈保留：glib/pango/cairo/libpng/libxml2 制品仓均有 OHOS 二进制（--build=never 实测），不砍 rrd_graph"
    - "cairo/libpng 钉在 pango 解析版本（1.18.4/1.6.58）：高版本触发 Conan 版本冲突"
    - "语言绑定（perl/python/ruby/lua/tcl）与 docs 显式关闭；libdbi/librados/libwrap 显式关闭保证可复现"
    - "打包 ELF 自签（binary-sign-tool），否则 HarmonyOS PC 拒绝执行"

versions:
  "1.9.0":
    status: built
    build_date: "2026-09-25"
    source_url: "https://github.com/oetiker/rrdtool-1.x/releases/download/v1.9.0/rrdtool-1.9.0.tar.gz"
    source_sha256: "5e65385e51f4a7c4b42aa09566396c20e7e1a0a30c272d569ed029a81656e56b"
