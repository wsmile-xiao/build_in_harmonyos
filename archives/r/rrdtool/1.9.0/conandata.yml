# conandata.yml — rrdtool 1.9.0
#
# Official upstream release tarball for tag v1.9.0 of oetiker/rrdtool-1.x.
# sha256 measured on the tarball fetched to the HarmonyOS PC build host:
#   5e65385e51f4a7c4b42aa09566396c20e7e1a0a30c272d569ed029a81656e56b  2972593 bytes
# (gzip stream verified with `gzip -t` before hashing, so a truncated or
# HTML-error body cannot masquerade as a valid download).
#
# The Conan mirror-rewrite step in ci/conan/build_and_test.sh adds fallback mirrors for github.com URLs automatically; the declared URL
# stays the official one (R39).

sources:
  url:
    - "https://github.com/oetiker/rrdtool-1.x/releases/download/v1.9.0/rrdtool-1.9.0.tar.gz"
  sha256: "5e65385e51f4a7c4b42aa09566396c20e7e1a0a30c272d569ed029a81656e56b"

patches:
  - patch_file: "patches/0001-conftools-config.guess.patch"
    strip: 1
    patch_description: "Teach the bundled 2018-02-24 config.guess the HarmonyOS sysname so configure can guess the build type natively (it emits aarch64-unknown-linux-ohos); verified by executing the patched script"
    patch_type: "portability"
  - patch_file: "patches/0002-conftools-config.sub.patch"
    strip: 1
    patch_description: "Accept the linux-ohos OS in the bundled config.sub (maybe_os split list and the accepted-OS pattern list), otherwise config.sub rejects the tuple config.guess just produced"
    patch_type: "portability"
  - patch_file: "patches/0003-rrd-daemon-rindex-to-strrchr.patch"
    strip: 1
    patch_description: "Replace the single rindex() call in src/rrd_daemon.c:4026 with strrchr(): rrd_daemon.c pins _POSIX_C_SOURCE/_XOPEN_SOURCE at the top so musl never declares rindex, and the OHOS libc does not even export the symbol (ld.lld: undefined symbol: rindex, measured on-device 2026-09-25). Same mechanism as archives/n/ntopng/6.6 patches/0004 (rrdtool-1.4.8 rrd_client.c), rewritten for the 1.9.0 context"
    patch_type: "portability"
