software: rtaudio
version: "4.1.2"
build_system: autotools
status: built
build_date: "2026-05-29"

source:
  url: "https://github.com/rtaudio/RtAudio/archive/refs/tags/4.1.2.tar.gz"
  sha256: "187f262ec5c57685162b73ce126139d27b8ca3a0d8b9867c54aef88d33b37e23"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies:
    - "alsa-lib/1.2.12"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-pthread-testcancel-ohos.patch"

ohos_adaptation:
  key_points:
    - "需要 autoreconf --verbose --install --force 生成 configure（原始 tarball 无 configure 脚本）"
    - "需要先运行 libtoolize --copy --install 创建 m4 目录和 libtool m4 文件"
    - "pthread_testcancel() 在 OpenHarmony musl libc 中不可用，需添加 #ifdef __OHOS__ 守卫的空宏定义"
  common_dependencies:
    - alsa-lib

knowledge_gained:
  - "pthread_testcancel not available on OpenHarmony/musl libc, needs #define to no-op with __OHOS__ guard"
  - "autotools projects without configure script need autoreconf bootstrap step"
