# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rtaudio/6.0.1
homepage: "https://github.com/thestk/rtaudio"

# 上游测试命令（tests/ 需真实音频设备：audioprobe/playsaw/record 等均执行音频 I/O）
upstream_check_command: "./tests/apinames"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 tests/ 为运行期音频 I/O 程序（playsaw/record/duplex 需真实声卡），
# OHOS dummy 后端无音频硬件，运行期断言不成立；apinames（列出编译的 API）
# 与本包测试面重叠。故未集成上游测试，以下游消费者边界断言替代。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（tests/*.cpp）
upstream_tests:
  - file: tests/apinames.cpp
    source: rtaudio-6.0.1/tests/apinames.cpp
    description: "列出编译的 API 名称（无音频设备也可运行）"
    command: "./tests/apinames"
  - file: tests/audioprobe.cpp
    source: rtaudio-6.0.1/tests/audioprobe.cpp
    description: "探测音频设备（需真实音频硬件，OHOS 边界外）"
    command: "./tests/audioprobe"
  - file: tests/playsaw.cpp
    source: rtaudio-6.0.1/tests/playsaw.cpp
    description: "播放锯齿波（需真实音频硬件，OHOS 边界外）"
    command: "./tests/playsaw"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者边界测试：编译 API 表含 dummy、getCurrentApi=dummy、getDeviceCount=0、API 显示名非空"
    command: "./test_rtaudio"

# 测试断言总数 (近似值)
assertion_count: 4
