package: rulesync/14.2.0
homepage: "https://github.com/dyoshikawa/rulesync"

upstream_test_entry: "vitest.config.ts (pnpm test) + vitest.e2e.config.ts (pnpm test:e2e)"
upstream_test_in_build: false
upstream_test_status: "executed"
upstream_test_runner_note: >-
  Executed with vitest 3.2.7 + vite 7.3.7 on OpenHarmony PC, with rollup replaced by the
  official WASM build (@rollup/wasm-node@4.59.0) via pnpm overrides, because the upstream
  default runner (vitest 4.1.10 + vite 8.1.4 -> rolldown) needs a native N-API binding whose
  dlopen is refused in this HMDFS workspace (ERR_DLOPEN_FAILED: Permission denied; WASI
  fallback unavailable). Test sources are unmodified.

upstream_tests:
  - name: unit-vitest
    source: "rulesync-14.2.0/src/**/*.test.ts + scripts/**/*.test.ts"
    description: "Upstream vitest unit/behaviour suites."
    command: "node node_modules/vitest/vitest.mjs run --silent=true"
    fixture_files: 329
    count: 7456
    passed: 7448
    failed: 8
    skipped: 0
    executed: true
  - name: e2e-vitest
    source: "rulesync-14.2.0/src/e2e/**/*.spec.ts"
    description: "Upstream vitest E2E suites driving the packaged CLI (RULESYNC_CMD)."
    command: "RULESYNC_CMD=dist-bun/rulesync-ohos-arm64 node node_modules/vitest/vitest.mjs run --config vitest.e2e.config.ts"
    fixture_files: 16
    count: 720
    passed: 719
    failed: 1
    skipped: 0
    executed: true

upstream_failures_by_cause:
  platform_matrix_not_applicable: 6     # src/lib/update.test.ts（上游自更新二进制无 openharmony 资产）
  platform_filesystem_difference: 1     # src/utils/file.test.ts（HMDFS realpath/符号链接环）
  environment_missing_runtime: 1        # src/features/hooks/amp-hooks.test.ts（需 bun，OHOS 无构建）
  environment_related: 1                # src/e2e/e2e-convert.spec.ts（dry-run stdout 断言；人工等价验证通过）

test_package_tests:
  - file: test.sh
    description: >-
      Runs the installed launcher: version/help surface, launcher/--jitless and OHOS
      runtime-platform assertions, plus a real init -> generate(cursor) round trip
      producing a Cursor rule file.
    command: "sh test.sh <rulesync-path>"
    count: 8
    ohos_specific:
      - name: launcher-uses-node-jitless
        description: "shipped bin/rulesync launcher must exec `node --jitless` (OHOS runtime constraint)"
      - name: runtime-platform-openharmony
        description: "node --jitless reports platform openharmony (accepts linux fallback)"

