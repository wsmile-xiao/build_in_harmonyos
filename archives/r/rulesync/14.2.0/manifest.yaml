knowledge_gained:
  - "rulesync 是纯 Node.js/TypeScript（npm）CLI：上游无 C/C++ 源码，运行时闭包 224 包（16 直接 + 207 传递）全为纯 JS/TS，无 gypfile/node-gyp/binding.gyp/原生 .node 运行时依赖；conan 制品仓层面强制第三方依赖为 0"
  - "npm 发布包已含 bundle 后的 dist/（ESM+CJS），build() 仅需 `npm install --ignore-scripts --omit=dev` 物化运行时依赖树（258 包），与 bruno-cli 3.4.2 先例同构"
  - "社区 npm 镜像（npm.cnb.cool）上的 esbuild@0.28.1 / lightningcss@1.32.0 tarball 与上游 pnpm-lock.yaml 记录的 integrity 不一致（ERR_PNPM_TARBALL_INTEGRITY）；改用官方 registry https://registry.npmjs.org/ 后安装成功"
  - "本机 Node 运行时：cmd-pkgs 版 node v24.19.0 直接执行 SIGABRT(134)，hnp 版 /data/service/hnp/node.org/node_v24.13.0/bin/node 可正常执行"
  - "OHOS 本机 dlopen 受限：HMDFS 工作区下的原生 Node 扩展（rolldown binding .node）即使经 binary-sign-tool -selfSign 1 签名（.codesign 段已写入，execve 可执行验证通过）仍报 ERR_DLOPEN_FAILED/Permission denied；因此依赖 rolldown native binding 的 tsdown 构建与 vitest 上游测试在本机不可执行，WASI 回退亦因 node:wasi uvwasi_init 报 UVWASI_EBADF 失败"
