# conandata.yml — rsynth 2.0

sources:
  url: "https://snapshot.debian.org/archive/debian-archive/20090802T004153Z/debian/pool/non-free/r/rsynth/rsynth_2.0.orig.tar.gz"
  sha256: "af4c849c62dc77405c12ebfec1e85ec2955322a5431567f8da36e580d10e583f"

patches:
  - patch_file: "patches/0001-Makefile.in.patch"
    strip: 1
    patch_description: "Makefile.in: 安装规则增加 DESTDIR 支持，使 conan Autotools.install() 能将 say 安装到 package 目录（1994 年 Makefile 不支持 DESTDIR）"
    patch_type: "portability"
  - patch_file: "patches/0002-config.guess.patch"
    strip: 1
    patch_description: "config.guess: 1994 版无法识别 aarch64，替换为含 OHOS/__OHOS__ 检测的现代版本，正确输出 aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0003-config.sub.patch"
    strip: 1
    patch_description: "config.sub: 1994 版不认识 aarch64/ohos 三元组，替换为支持 aarch64-unknown-linux-ohos 的现代版本"
    patch_type: "portability"
