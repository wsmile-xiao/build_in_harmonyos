# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "1994 年 autoconf 2.0 生成的 configure 只识别 --prefix 等少量选项，Conan AutotoolsToolchain 默认追加的 --bindir/--libdir 等 flag 必须裁剪，否则 configure: error: invalid option (ref: E545)"
- "1994 年 Makefile 安装规则无 DESTDIR 概念，需补丁 Makefile.in 增加 $(DESTDIR) 前缀，否则 Conan Autotools.install() 会把二进制装进真实 /usr/local (ref: E336)"
- "1994 年 config.guess/config.sub 无法识别 aarch64/ohos，需替换为含 __OHOS__ 检测的现代版本，输出 aarch64-unknown-linux-ohos (ref: E007, E072)"
- "rsynth 为纯工具（say 可执行文件）非库，package_type=application；linuxplay 音频驱动在 OHOS 无 /dev/dsp 设备时无害降级，文件输出路径不受影响 (ref: E221)"

