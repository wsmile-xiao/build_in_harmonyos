# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rsynth/2.0
homepage: "http://www.speech.cs.cmu.edu/rsynth/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile
    source: rsynth-2.0/Makefile.in
    description: "make check: 运行 `./say -W 'Hello there'` 完整走通 文本→音素→Klatt/Holmes 共振峰合成 流水线（无音频设备依赖，-W 仅静默合成）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：执行 say --help；say -o xxx.au 'hello world' 并校验 .snd 魔数与非空；say -l xxx.raw 'numbers 12345' 校验 raw 输出非空"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
