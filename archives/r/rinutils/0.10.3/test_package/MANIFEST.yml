# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rinutils/0.10.3
homepage: "https://github.com/shlomif/rinutils"

# 上游测试命令（上游用 run-tests.pl 驱动 t/*.{t.exe,t}；CMake WITH_TEST_SUITE=ON
# 另编译 cmocka 用例 t/bit-reader-and-writer-test.c）
upstream_check_command: "perl run-tests.pl (或 cmake -DWITH_TEST_SUITE=ON && 直接执行 t/bit-reader-and-writer-test.t.exe)"

# conanfile.py build() 已集成并实际执行上游 cmocka C 用例
upstream_test_in_build: true
upstream_test_command: "conan create 的 build() 构建并运行 ./bit-reader-and-writer-test.t.exe（cmocka，6 个断言）"

# 上游实际运行的测试程序
upstream_tests:
  - file: bit-reader-and-writer-test.c
    source: rinutils-0.10.3/t/bit-reader-and-writer-test.c
    description: "上游 cmocka 单元测试：bit 读写器写入/覆盖/读取往返（6 个 assert_int_equal），build() 中真实执行"
    command: "./bit-reader-and-writer-test.t.exe   # 默认 cmocka 输出，rc=0"
  - file: unit-count.t / unit-ll-formats.t / unit-min-and-max.t / unit-str-utils.t
    source: rinutils-0.10.3/t/
    description: "上游 Perl 用例（内部用 Inline::C 现场编译 C 片段）：OHOS 缺 CPAN 依赖（Env::Path/Path::Tiny/Test::Differences/Inline/Inline::C）不可运行，逐项原因见版本目录 notes.md"
    command: "perl run-tests.pl   # not runnable on OHOS (CPAN Inline::C toolchain absent)"
  - file: build-process.t / style-trailing-space.t / tidyall.t
    source: rinutils-0.10.3/t/
    description: "上游 Perl 构建/风格用例：分别依赖 Test::More+cmake/make/tar、Test::TrailingSpace、Code::TidyAll 等 CPAN 模块，OHOS 不可运行（详见 notes.md）"
    command: "perl run-tests.pl   # not runnable on OHOS (CPAN modules absent)"

# test_package 中自带的测试 (消费者视角验证，鸿蒙特有测试)
test_package_tests:
  - file: test.c
    description: "消费者测试：13 个安装头文件全部编译消费，其中 12 个含运行时断言（COUNT/LAST、min/max、字符串工具、alloc 包装、bit 读写器往返、RIN_LL_FMT、portable_time、likely/typeof/unused/dllexport；exit_error.h 为 compile-only，其 noreturn 语义无法进程内断言），含负向用例；经 find_package(Rinutils) + Rinutils::Rinutils 消费"
    command: "./test_rinutils"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 36
