# conandata.yml — rinutils 0.10.3
# 官方源：GitHub 官方 tag 归档。设备与 CI worker 无法直连 github.com，但可直连
# GitHub 官方 tar 入口 codeload.github.com（github.com/archive 302 的跳转目标，
# 字节完全一致；仓库内 284 个既有配方同源）。sha256 已与 github.com/archive
# 下载件二次核对一致。

sources:
  url: "https://codeload.github.com/shlomif/rinutils/tar.gz/refs/tags/0.10.3"
  sha256: "6e4af1edb5cedb660d97607a7b02bec0eb25137d4a832ca00b42238753f0e02a"

patches:
  - patch_file: "patches/0001-cmake-Shlomif_Common.cmake.patch"
    patch_description: "内置 cmake/Shlomif_Common.cmake（上游 shlomif-cmake-modules 模块的裁剪副本，保留 MIT 版权声明）：仅保留 CMakeLists 实际用到的宏，去掉 configure 期从 GitHub FILE(DOWNLOAD) 拉取与 perl 强制依赖，构建离线可复现"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-shlomif_common_bootstrap.cmake.patch"
    patch_description: "bootstrap 不再在 configure 期下载 Shlomif_Common.cmake；模块缺失时直接 FATAL_ERROR（配合内置副本，保证 hermetic 构建）"
    patch_type: "portability"
