# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
package: rvvm/0.6
homepage: "https://github.com/LekKit/RVVM"

# 上游测试命令：make test 需要外部 riscv-tests.tar.gz（RISC-V compliance 测试二进制
# + 固件），不在源码归档内，故 build() 不执行（不具自包含性）。
# 编译验证由 make lib all 完成，消费者级验证由 test_package 完成。
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "N/A (requires external riscv-tests.tar.gz)"

upstream_tests:
  - file: Makefile (test target)
    source: "RVVM v0.6 official GitHub tag archive"
    description: "RISC-V compliance/torture tests (RV32/RV64 .bin). Requires external riscv-tests.tar.gz + firmware, not bundled in the source archive."
    command: "make test"

test_package_tests:
  - file: test.c
    description: "Consumer test: create a machine, write/read guest RAM, read machine options through the packaged librvvm public API."
    command: "./test_probe"

upstream_case_count: 0
test_package_assertion_count: 6
assertion_count: 6
