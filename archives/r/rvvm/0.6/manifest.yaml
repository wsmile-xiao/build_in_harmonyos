software: rvvm
version: "0.6"
status: built
build_date: "2026-09-16"
build_system: makefile
conan_ref: "rvvm/0.6"

source:
  url: "https://github.com/LekKit/RVVM/archive/refs/tags/v0.6.tar.gz"
  sha256: "97e98c95d8785438758b81fb5c695b8eafb564502c6af7f52555b056e3bb7d7a"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "USE_FB=0"
    - "USE_SDL=0"
    - "USE_XSHM=0"
    - "USE_JNI=0"
    - "USE_TAP_LINUX=0"
    - "BUILDDIR=build"
    - "BINARY=rvvm"
    - "JOBS=1"
  dependencies: []
  cc: clang
  cxx: N/A

patches_applied: []

artifacts:
  libraries:
    - lib/librvvm_static.a
  headers:
    - include/rvvm/rvvmlib.h
    - include/rvvm/fdtlib.h
    - include/rvvm/devices/*.h
  binaries:
    - bin/rvvm
  documentation:
    - licenses

knowledge_gained:
  - "RVVM 0.6 is a self-contained C11 RISC-V emulator with no external Conan dependencies (only libc/libm/pthread)."
  - "Framebuffer (X11/SDL) and JNI binding are disabled on OHOS: no X11/SDL backend and no JDK jni.h in the build toolchain."
  - "The upstream `make test` target requires an external riscv-tests.tar.gz, so it is not run in build(); compile verification + test_package cover the build."
  - "Only the static library is packaged: the upstream shared librvvm.so is linked without DT_SONAME (CI L5a gate), and static linking is safer on OHOS."
  - "Verified on device shadow CI (2026-09-16): make lib all with clang 15.0.4/arm64, test_package passes, L0-L5 all pass. package_type must be static-library (Conan 2 rejects 'library' without a shared option)."
