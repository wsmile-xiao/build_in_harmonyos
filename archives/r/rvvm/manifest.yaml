software: rvvm
display: "RVVM"
description: "RISC-V 虚拟机（RISC-V Virtual Machine），支持 RV64/RV32、tracing JIT、PCI/NVMe 设备模拟与可嵌入公共 API"
category: system
homepage: "https://github.com/LekKit/RVVM"
license: GPL-3.0-only OR MPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "自包含 C11 实现，无外部 Conan 依赖（仅 libc/libm/pthread）。"
    - "禁用 X11/SDL 帧缓冲与 JNI 绑定（USE_FB=0 / USE_JNI=0）。"
    - "打包静态库 librvvm_static.a + 公共头文件 rvvmlib.h + rvvm CLI。"
    - "上游 make test 依赖外部 riscv-tests.tar.gz，构建阶段不执行，由 test_package 做消费者级验证。"
  common_dependencies: []

versions:
  "0.6":
    status: built
    build_date: "2026-09-16"
    path: archives/r/rvvm/0.6
