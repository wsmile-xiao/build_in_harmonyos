# 版本级 manifest
# 文件位置: archives/r/reactphysics3d/0.10.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10.2"

# 软件名
software: "reactphysics3d"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag tarball）
  url: "https://github.com/DanielChappuis/reactphysics3d/archive/refs/tags/v0.10.2.tar.gz"

  # 源码校验和
  sha256: "95b4f3ed87cbb6515d751b4df90b5860cf62b7e03306f05340639f81e60bfb32"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DRP3D_COMPILE_LIBRARY=ON"
  - "-DRP3D_COMPILE_TESTBED=OFF"
  - "-DRP3D_COMPILE_TESTS=OFF"
  - "-DRP3D_PROFILING_ENABLED=OFF"
  - "-DRP3D_GENERATE_DOCUMENTATION=OFF"
  - "-DRP3D_CODE_COVERAGE_ENABLED=OFF"
  - "-DRP3D_DOUBLE_PRECISION_ENABLED=OFF"

  # 编译依赖列表（格式: name/version）——无外部依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无平台宏补丁，0.10.2 在 OHOS 工具链下原生编译通过）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "reactphysics3d 0.10.2 纯 C++17 CMake 库，无外部依赖，OHOS aarch64 clang 工具链原生编译通过"
- "上游测试为自研 TestSuite 框架（24 个独立 Test 用例类，2986 条断言），单可执行文件 ./test/tests"
- "test_package 消费者测试需显式 self.run(env='conanrun') 而非 cmake.test()（E298）"
