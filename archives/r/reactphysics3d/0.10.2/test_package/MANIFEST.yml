    description: "世界查询（重叠/射线/AAAB）测试"
    command: "./test/tests (suite: Test WorldQueries)"
  - file: test/tests/collision/TestDynamicAABBTree.h
    source: reactphysics3d-0.10.2/test/tests/collision/TestDynamicAABBTree.h
