  - file: test/tests/mathematics/TestMathematicsFunctions.h
    source: reactphysics3d-0.10.2/test/tests/mathematics/TestMathematicsFunctions.h
    description: "数学公共函数（clamp/approxEqual 等）测试"
    command: "./test/tests (suite: Test Maths Functions)"
  - file: test/tests/collision/TestAABB.h
    source: reactphysics3d-0.10.2/test/tests/collision/TestAABB.h
    description: "AABB 轴对齐包围盒测试"
    command: "./test/tests (suite: Test AABB)"
  - file: test/tests/collision/TestPointInside.h
    source: reactphysics3d-0.10.2/test/tests/collision/TestPointInside.h
    description: "点在形状内判断（isPointInside）测试"
