    description: "半边结构（HalfEdgeStructure）测试"
    command: "./test/tests (suite: Test HalfEdgeStructure)"
  - file: test/tests/collision/TestConvexMesh.h
    source: reactphysics3d-0.10.2/test/tests/collision/TestConvexMesh.h
    description: "凸网格（ConvexMesh）测试"
    command: "./test/tests (suite: Test ConvexMesh)"
  - file: test/tests/collision/TestTriangleMesh.h
