# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: reactphysics3d/0.10.2
homepage: "https://www.reactphysics3d.com"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -DRP3D_COMPILE_TESTS=ON .. && cmake --build . && ./test/tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（自研 TestSuite 框架，24 个独立 Test 用例类，single executable）
upstream_tests:
  - file: test/tests/mathematics/TestVector2.h
    source: reactphysics3d-0.10.2/test/tests/mathematics/TestVector2.h
    description: "数学库 Vector2 运算测试（自研 Test 框架独立用例）"
    command: "./test/tests (suite: Test Vector2)"
  - file: test/tests/mathematics/TestVector3.h
    source: reactphysics3d-0.10.2/test/tests/mathematics/TestVector3.h
    description: "数学库 Vector3 运算测试"
    command: "./test/tests (suite: Test Vector3)"
  - file: test/tests/mathematics/TestTransform.h
    source: reactphysics3d-0.10.2/test/tests/mathematics/TestTransform.h
    description: "Transform 变换（平移/旋转/组合）测试"
    command: "./test/tests (suite: Test Transform)"
  - file: test/tests/mathematics/TestQuaternion.h
    source: reactphysics3d-0.10.2/test/tests/mathematics/TestQuaternion.h
    description: "四元数运算测试"
    command: "./test/tests (suite: Test Quaternion)"
  - file: test/tests/mathematics/TestMatrix2x2.h
    source: reactphysics3d-0.10.2/test/tests/mathematics/TestMatrix2x2.h
    description: "2x2 矩阵运算测试"
    command: "./test/tests (suite: Test Matrix2x2)"
  - file: test/tests/mathematics/TestMatrix3x3.h
