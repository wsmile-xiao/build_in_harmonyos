  - file: test/tests/engine/TestRigidBody.h
    source: reactphysics3d-0.10.2/test/tests/engine/TestRigidBody.h
    description: "RigidBody 动力学刚体测试"
    command: "./test/tests (suite: Test RigidBody)"

# test_package 中自带的测试 (消费者视角验证, R34 真实调用库 API)
test_package_tests:
  - file: test.cpp
    description: "真实物理引擎消费者测试：创建世界/刚体/盒碰撞，模拟 5 秒验证重力下落与地面接触"
    command: "./test_reactphysics3d"

# 测试断言总数 (近似值, 用于质量评估)：上游 24 用例实际执行断言 2986 条全部通过
assertion_count: 2986