software: rpki-client
# 版本级 manifest
# 文件位置: archives/r/rpki-client/9.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "9.6"
status: published
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.savannah.nongnu.org/releases/rpki-client/rpki-client-9.6.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 手动编译绕过 HMDFS 限制
  system: custom

  # 手动编译命令
  configure_options:
    - "手动创建 config.h"
    - "手动编译 src/*.c 和 compat/*.c"
    - "手动链接: -lfts -ltls -lssl -lcrypto -lexpat -lz"

  # 编译依赖
  dependencies:
    - "libressl/3.9.2"
    - "musl-fts/1.2.1"
    - "expat/2.6.4"
    - "zlib/1.3.1"
    - "rsync/3.3.0"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-include-unistd-harmony.patch"
  - "0002-include-endian-harmony.patch"
  - "0003-config-h-manual.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS 文件系统限制导致 configure 无法创建临时文件，需手动编译"
  - "OpenHarmony 需要兼容性头文件 unistd.h 和 endian.h"
  - "rpki-client 需要 LibreSSL（不是 OpenSSL）提供 libtls"
  - "fts 文件树遍历函数需要 musl-fts 库"
