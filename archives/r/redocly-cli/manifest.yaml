software: redocly-cli
display: "Redocly CLI"
description: "All-in-one OpenAPI utility for building, managing, and quality-checking API descriptions"
category: doc              # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data
homepage: "https://redocly.com/docs/cli"
license: MIT
build_system: npm           # npm for Node.js packages

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Node.js runtime required (>=22.12.0 or >=20.19.0)"
    - "Not a traditional compiled C/C++ software"
    - "npm registry package is precompiled JavaScript"
    - "Requires wrapper scripts to ensure Node.js path"
  common_dependencies:
    - node

# 版本索引（所有已归档版本，含状态）
versions:
  "2.31.6":
    status: published             # published | built | failed | archived
    build_date: "2026-06-05"
    published_as: redocly-cli     # 在 cmd-pkgs 中发布的软件名