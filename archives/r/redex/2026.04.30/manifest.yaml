software: redex
version: "2026.04.30"
upstream_version: "2026.04.30"
status: built
build_date: "2026-10-08"
conan_ref: "redex/2026.04.30"
build_system: cmake

source:
  url: "https://github.com/facebook/redex/archive/refs/tags/v2026.04.30.tar.gz"
  sha256: "60c638403ce608b7d96d76592f4e2bfcb5e541b2eee33f97d06f771f2c147880"

build:
  system: cmake
  dependency_linkage: shared
  internal_libraries: static
  dependencies:
    - boost/1.91.0.1.1
    - jsoncpp/1.9.8
    - zlib-ng-compat/2.3.3

patches_applied:
  - file: "patches/0001-cmake-use-conan-config-dependencies.patch"
    description: "Use exact Conan dependency targets and executable script installation"
  - file: "patches/0002-autotools-detect-header-only-boost-regex.patch"
    description: "Use a real link probe when Boost.Regex has no compiled library"
  - file: "patches/0003-only-include-boost-stacktrace-on-windows.patch"
    description: "Avoid requiring the unused Boost.Stacktrace header on non-Windows targets"
  - file: "patches/0004-include-string-in-plugin-registry.patch"
    description: "Make PluginRegistry self-contained by including the std::string definition"
  - file: "patches/0005-encode-code-point-without-boost-locale.patch"
    description: "Encode one Unicode code point without the unselected Boost.Locale component"
  - file: "patches/0006-format-resource-ids-with-standard-streams.patch"
    description: "Format resource IDs with standard streams instead of the unselected Boost.Format component"
  - file: "patches/0007-remove-remaining-boost-format-dependency.patch"
    description: "Replace all remaining fixed Boost.Format consumers with equivalent standard stream formatting"
  - file: "patches/0008-use-classic-any-of-for-libcxx-compatibility.patch"
    description: "Use the classic iterator any_of overload available in the target libc++"
  - file: "patches/0009-fallback-for-missing-python-packaging.patch"
    description: "Use a constrained numeric version fallback when Python packaging is unavailable"
  - file: "patches/0010-preserve-cxx-standard-for-googletest-probe.patch"
    description: "Preserve the caller C++ standard while probing GoogleTest headers"
  - file: "patches/0011-use-int-for-getopt-result.patch"
    description: "Keep the getopt_long failure sentinel representable under target Clang -Werror"
  - file: "patches/0012-autotools-run-bundler-with-detected-bash.patch"
    description: "Run the Autotools Python bundler with the Bash executable detected at configure time"
  - file: "patches/0013-autotools-use-hash-bound-prebuilt-sample-apks.patch"
    description: "Verify and consume frozen prebuilt sample APKs instead of executing the Android SDK host aapt2 on the target"
  - file: "patches/0014-use-tmpdir-for-dead-class-test-fixtures.patch"
    description: "Create dead-class-list GoogleTest fixtures under task-local TMPDIR with a host-compatible /tmp fallback"
  - file: "patches/0015-reserve-fbjni-method-argument-storage.patch"
    description: "Reserve stable backing storage before exposing Fbjni method argument string views"
  - file: "patches/0016-match-boxed-booleans-by-descriptor.patch"
    description: "Classify boxed Boolean fields and methods by current-context descriptors instead of cached pointer identity"
  - file: "patches/0017-stabilize-target-test-semantics.patch"
    description: "Prefer current raw boxed Boolean definitions, reject raw/resolved semantic drift, and stabilize cross-ABI test expectations"
  - file: "patches/0018-use-full-descriptor-for-boolean-value.patch"
    description: "Match the full boxed Boolean field descriptor when folding booleanValue results"

validation:
  status: native_pass_official_w3_pass_submission_pending
  upstream_tests: "r376: 174/174 GoogleTest wrappers; 2009/2009 leaves; 1/1 Shell"
  gtest_leaves: "2009/2009"
  shell_tests: "1/1"
  harmony_tests: "official-finish-r001: 1/1 signed AArch64 HMDFS execution test"
  official_finish: "PARTIAL_POST_W3; original aggregate RC1; post-W3 failures step5b,step8"
  report: "reports/test-report.md"
  note: "Native r376 and official-finish-r001 retain separate run/tree/archive identities. Recipe and patch bytes are unchanged between these snapshots; r001 adds Harmony consumer coverage. Later metadata changes do not rewrite either terminal. Platform AI Review, CI and submission remain pending; built does not mean published."
