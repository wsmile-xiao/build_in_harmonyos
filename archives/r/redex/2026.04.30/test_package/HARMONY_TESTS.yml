platform: "HarmonyOS PC"
test_count: 1
command: "python3 harmony_tests/test_signed_hmdfs.py <installed-package>/bin/redex-all"
tests:
  - name: "signed_aarch64_optimizer_hmdfs_execution"
    file: "harmony_tests/test_signed_hmdfs.py"
    description: "Require the actual OHOS runtime, an installed AArch64 ELF with nonempty codesign data in the HMDFS user view, successful native execution, and unchanged executable hash."
    boundary: "Does not claim cryptographic signature verification, unsigned-image rejection, Android execution, or general optimization coverage."
# HARMONY_TEST_COUNT=1
