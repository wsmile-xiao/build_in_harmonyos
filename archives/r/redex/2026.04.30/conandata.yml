sources:
  url: "https://github.com/facebook/redex/archive/refs/tags/v2026.04.30.tar.gz"
  sha256: "60c638403ce608b7d96d76592f4e2bfcb5e541b2eee33f97d06f771f2c147880"

patches:
  - patch_file: "patches/0001-cmake-use-conan-config-dependencies.patch"
    patch_description: "Use Conan CMake config targets and install redex.py as an executable program"
    patch_type: "portability"
  - patch_file: "patches/0002-autotools-detect-header-only-boost-regex.patch"
    patch_description: "Allow the upstream Autoconf probe to validate header-only Boost.Regex"
    patch_type: "portability"
  - patch_file: "patches/0003-only-include-boost-stacktrace-on-windows.patch"
    patch_description: "Include Boost.Stacktrace only on the Windows code path that uses it"
    patch_type: "portability"
  - patch_file: "patches/0004-include-string-in-plugin-registry.patch"
    patch_description: "Include the complete std::string definition used by PluginRegistry"
    patch_type: "portability"
  - patch_file: "patches/0005-encode-code-point-without-boost-locale.patch"
    patch_description: "Encode the single parsed code point without requiring the unselected Boost.Locale component"
    patch_type: "portability"
  - patch_file: "patches/0006-format-resource-ids-with-standard-streams.patch"
    patch_description: "Format resource IDs without requiring the unselected Boost.Format component"
    patch_type: "portability"
  - patch_file: "patches/0007-remove-remaining-boost-format-dependency.patch"
    patch_description: "Format remaining hashes and resource IDs with standard streams instead of Boost.Format"
    patch_type: "portability"
  - patch_file: "patches/0008-use-classic-any-of-for-libcxx-compatibility.patch"
    patch_description: "Use the classic any_of iterator API supported by the target libc++"
    patch_type: "portability"
  - patch_file: "patches/0009-fallback-for-missing-python-packaging.patch"
    patch_description: "Use a constrained numeric version fallback when Python packaging is unavailable"
    patch_type: "portability"
  - patch_file: "patches/0010-preserve-cxx-standard-for-googletest-probe.patch"
    patch_description: "Preserve the caller C++ standard while probing GoogleTest headers"
    patch_type: "portability"
  - patch_file: "patches/0011-use-int-for-getopt-result.patch"
    patch_description: "Store the getopt_long result in int so the -1 sentinel remains representable"
    patch_type: "portability"
  - patch_file: "patches/0012-autotools-run-bundler-with-detected-bash.patch"
    patch_description: "Run the Autotools Python bundler with the Bash executable detected at configure time"
    patch_type: "portability"
  - patch_file: "patches/0013-autotools-use-hash-bound-prebuilt-sample-apks.patch"
    patch_description: "Use SHA-256-bound prebuilt sample APKs when the target cannot execute the Android SDK host aapt2"
    patch_type: "portability"
  - patch_file: "patches/0014-use-tmpdir-for-dead-class-test-fixtures.patch"
    patch_description: "Create dead-class-list test fixtures under TMPDIR when the target /tmp is read-only"
    patch_type: "portability"
  - patch_file: "patches/0015-reserve-fbjni-method-argument-storage.patch"
    patch_description: "Keep Fbjni method argument string views valid across libc++ short-string vector moves"
    patch_type: "portability"
  - patch_file: "patches/0016-match-boxed-booleans-by-descriptor.patch"
    patch_description: "Match boxed Boolean constants by their current-context descriptors instead of cached pointer identity"
    patch_type: "portability"
  - patch_file: "patches/0017-stabilize-target-test-semantics.patch"
    patch_description: "Fail closed on boxed Boolean identity drift and make target test output ordering and byte formatting deterministic"
    patch_type: "portability"
  - patch_file: "patches/0018-use-full-descriptor-for-boolean-value.patch"
    patch_description: "Use the complete boxed Boolean field descriptor when folding booleanValue results"
    patch_type: "portability"
