software: racon
display: "racon"
description: "Ultrafast consensus module for raw de novo genome assembly of long uncorrected reads"
category: science
homepage: "https://github.com/lbcb-sci/racon"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake C++11 library + CLI; CUDA and wrapper always OFF on OHOS"
    - "Conan provides bioparser/edlib/spoa; rvaser thread_pool via FetchContent"
    - "Upstream tests run via racon_test binary (no ctest registration)"
  common_dependencies:
    - bioparser
    - edlib
    - spoa

versions:
  "1.5.0":
    status: built
    build_date: "2026-09-27"
