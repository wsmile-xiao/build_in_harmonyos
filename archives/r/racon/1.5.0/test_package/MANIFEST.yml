# test_package/MANIFEST.yml
# Upstream test declaration for racon 1.5.0 (CI L0e gate).

package: racon/1.5.0
homepage: "https://github.com/lbcb-sci/racon"

# Upstream tests run inside conanfile.py build() (racon_test binary, gtest).
upstream_check_command: "racon_test"
upstream_test_in_build: true
upstream_test_command: "racon_test"

# Upstream test inventory (source: test/racon_test.cpp, 15 TEST/TEST_F).
upstream_tests:
  - file: test/racon_test.cpp
    source: racon-1.5.0/test/racon_test.cpp
    description: "5 RaconInitializeTest death tests (invalid type/paths) + 10 RaconPolishingTest consensus/fragment cases (PAF/SAM/MHAP, qualities, windows, edit-distance params)"
    command: "racon_test"
  - file: test/data/sample_*.gz
    source: racon-1.5.0/test/data/
    description: "Compressed fixtures (reads/layout/overlaps/reference) used by all polishing tests via TEST_DATA macro"

# Consumer tests built by test_package/CMakeLists.txt.
test_package_tests:
  - file: test_sequence.cpp
    description: "Sequence API: createSequence name/data, reverse_complement(AAA->TTT, ACGT->ACGT), empty quality"
    command: "ctest -R test_sequence"
  - file: test_polisher_types.cpp
    description: "PolisherType enum kC/kF + long-sequence reverse-complement involution + empty-name edge case"
    command: "ctest -R test_polisher_types"

assertion_count: 16
upstream_test_total: 15
upstream_test_count_method: "gtest_macros"
upstream_tests_exist: true
