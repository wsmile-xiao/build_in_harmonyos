software: rc
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.7.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.7.4"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/rakitzis/rc/archive/refs/tags/v1.7.4.tar.gz"
  # 原始 URL (web.archive.org) 超时不可用
  original_url: "https://web.archive.org/web/20200227085442/static.tobold.org/rc/rc-1.7.4.tar.gz"

  # 源码校验和
  sha256: "0b83f8698dd8ef44ca97b25c4748c087133f53c7fff39b6b70dab65931def8b0"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--prefix=/storage/Users/currentUser/usr/local"
  - "# Note: requires autoreconf --force --install before configure (no pre-built configure in GitHub archive)"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-INSTALL.patch (autoreconf: auto-generated)"
  - "0002-config.h.in.patch (autoreconf: auto-generated)"
  - "0003-config.status.patch (platform: remove umask 077 from mktemp to fix HMDFS SGID issue)"
  - "0004-configure.patch (platform: remove umask 077 from mktemp to fix HMDFS SGID issue)"
  - "0005-install-sh.patch (autoreconf: auto-generated)"
  - "0006-mkinstalldirs.patch (autoreconf: auto-generated)"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS SGID+umask077 creates drwx--S--- directories that are unwritable; must remove umask 077 from autoconf mktemp calls"
  - "GitHub archive lacks pre-built configure script; must run autoreconf --force --install"
  - "make check (trip.rc) fails umask test because HMDFS restricts file permissions to max 660"
  - "rc shell does not support --version flag; staging verification needs manual pass"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/rc-1.7.4.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/rc-1.7.4.work
  source_orig_hash: f5d8c7b48a82f80c
  source_work_hash: 4eafb50291f81bec
  generated_at: '2026-06-18T00:52:33'
  patches_count: 6

patch_classification:
