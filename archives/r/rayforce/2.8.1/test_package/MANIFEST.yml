# test_package/MANIFEST.yml
# 上游官方测试声明文件 (rayforce 2.8.1)

package: rayforce/2.8.1
homepage: "https://github.com/RayforceDB/rayforce"

# 上游测试命令: 纯 Makefile 项目, `make test` 构建 rayforce.test 并运行全部用例
upstream_check_command: "make test"

# conanfile.py build() 中未集成上游测试(上游测试依赖 /tmp 可写, OHOS 平台 /tmp 为 erofs 只读,
# 详见 notes.md), test_package 提供消费者视角验证
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (75 个 test_*.c 注册 3319 项编译用例 + 509 个 .rfl 动态用例)
upstream_tests:
  - file: test/main.c
    source: rayforce-2.8.1/test/main.c
    description: "上游测试主入口(编译组 + 动态 .rfl 组)"
    command: "./rayforce.test"

# test_package 中自带的测试 (消费者视角验证, 调用公开 API)
test_package_tests:
  - file: test.c
    description: "消费者测试: 公开头文件 rayforce.h + librayforce.a, 验证向量/表/空值 API"
    command: "./test_rayforce"
  - file: test_ohos.c
    description: "HarmonyOS 专项测试: 版本探针 + 向量/表/字典 API 可观测验证"
    command: "./test_rayforce_ohos"

# 测试断言总数
assertion_count: 18