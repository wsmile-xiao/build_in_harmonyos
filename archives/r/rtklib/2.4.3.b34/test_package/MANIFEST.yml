package: rtklib/2.4.3.b34
upstream_test_in_build: false
upstream_tests:
  - file: test/utest/makefile
    description: "上游单元测试驱动：13 个 utestN 目标（BIN 列表 13 个 t_*.c 程序），链接 -llapack -lblas"
    command: "make -C test/utest all && make -C test/utest utest"
  - file: app/consapp/rnx2rtkp/gcc/makefile
    description: "上游 rnx2rtkp 集成测试：25 个 testN 目标，跑 test/data/rinex 真实观测/星历"
    command: "make -C app/consapp/rnx2rtkp/gcc test1 ... test25"
  - file: app/consapp/rnx2rtkp/gcc_mkl/makefile
    description: "上游 rnx2rtkp 集成测试的 Intel MKL 变体：25 个 testN 目标，与 gcc/ 版逐条同名同命令（仅 LDLIBS 换成 MKL）；计入上游注册面 N，设备无 MKL 故不重复执行"
    command: "make -C app/consapp/rnx2rtkp/gcc_mkl test1 ... test25"
  - file: app/consapp/convbin/gcc/makefile
    description: "上游 convbin 集成测试：18 个 testN 目标，跑 test/data/rcvraw 各厂商原始日志"
    command: "make -C app/consapp/convbin/gcc test1 test2 test3 test4 test5 test7 test8 test9 test10 test11 test12 test13 test14 test15 test16 test17 test18 test21"
  - file: app/consapp/str2str/gcc/makefile
    description: "上游 str2str 流测试：6 个 testN 目标（串口/NTRIP 需真实设备或服务器）"
    command: "make -C app/consapp/str2str/gcc test1 ... test6"
  - file: app/consapp/rtkrcv/gcc/makefile
    description: "上游 rtkrcv 实时服务测试：3 个 testN 目标（需串口与 TCP 端口）"
    command: "make -C app/consapp/rtkrcv/gcc test1 test2 test3"
  - file: util/rnx2rtcm/makefile
    description: "上游 rnx2rtcm 工具测试：11 个 testN 目标（需 inp/ 观测数据，未随源码分发）"
    command: "make -C util/rnx2rtcm test1 ... test11"
  - file: util/testlex/makefile
    description: "上游 testlex 工具测试：4 个 testN 目标（需 ../lexdata、../lexerrdata，未随源码分发）"
    command: "make -C util/testlex test1 ... test4"
  - file: util/geniono/makefile
    description: "上游 geniono 工具测试：2 个 testN 目标（硬编码 /proj/data_gsi 路径与 igs05.atx）"
    command: "make -C util/geniono test1 test2"
test_package_tests:
  - file: test_consumer.c
    description: "库消费者：CMake find_package(rtklib) 对被安装的 include/rtklib.h 与 lib/libRTK.a 编译链接，真跑并断言 19 项 RTKLIB API 数值（时间/GPS 周秒往返 4、ECEF↔大地坐标 2、几何距离与单位视线向量 2、satazel 2、dot/norm/cross3 3、2x2 求逆与 A*inv(A)=I 3、卫星编号 3）"
    command: "./rtklib_consumer"
  - file: conanfile.py
    description: "裸环境 CLI smoke：convbin/rnx2rtkp/pos2kml/str2str/rtkrcv 在 env -u LD_LIBRARY_PATH 下逐个执行，每个工具 1 条断言（rc != 127，即内核成功装载），共 5 条（防 RUNPATH/加载失败被 conanrun 掩盖）"
    command: "env -u LD_LIBRARY_PATH <pkg>/bin/<tool> -h"
  - file: smoke.pos
    description: "端到端数据通路：pos2kml 把 RTKLIB 解算文件转 KML，3 条内容断言（存在 <Placemark>、首条坐标 == 139.613829262,35.160867778,0.000、Placemark 数 == 11）"
    command: "env -u LD_LIBRARY_PATH <pkg>/bin/pos2kml smoke.pos -o smoke.kml"
assertion_count: 27
