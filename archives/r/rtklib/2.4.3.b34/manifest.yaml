  sha256: 'a9ce13293ef71b028036cb98a114b9bba96bdd439a0aeebca8e9c73156e461cf'
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - 'make -j2 CC=clang AR=llvm-ar RANLIB=llvm-ranlib CFLAGS="-O2" LDLIBS="-lm -lrt -lpthread"'
    - 'make install DESTDIR=<package_folder> PREFIX=/'
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - '0001-makefile.patch'

patch_classification:
  # refresh-patch --auto 默认写 type: auto / platform_only: True / guard: pending；
  # 人工核对后修正：本补丁只是补一个上游缺失的顶层 makefile（纯构建系统补全），
  # 不含任何平台宏、也不改变任何平台相关行为，故 platform_only=false、guard=none。
  - file: 0001-makefile.patch
    type: build-system
    platform_only: false
    guard: none

knowledge_gained:
  - '上游是手写 Makefile 工程而非 autotools：无 configure、无顶层 makefile，init-build 的入口探测因设备文件系统大小写不敏感把 app/consapp/makefile 当成 Makefile 标记，将 app/consapp 误提升为源码根（.orig/.work 只剩 45/48 个文件）；修法是按 --strip-components=1 重建 .orig/.work 并重跑 edit_tracker.snapshot()'  # knowledge_ref: DRAFT-E628-rtklib-handwritten-makefile-multi-app-adaptation
  - 'app/consapp/*/gcc/makefile 的 LDLIBS 无条件引用 lib/iers/gcc/iers.a 与 -lgfortran，而该 .a 只在定义 -DIERS_MODEL 时才有意义且上游 Linux 侧不生成，直接 make 必然链接失败；必须用命令行变量覆盖 LDLIBS'  # knowledge_ref: DRAFT-E628-rtklib-handwritten-makefile-multi-app-adaptation
  - '上游 CFLAGS 含 -ansi -pedantic，在 OHOS/musl 头文件下隐藏 gethostbyname 的声明（netdb.h 受 __STRICT_ANSI__ 守卫），src/stream.c 报 incompatible integer to pointer conversion；改用 -std=gnu11（或去掉 -ansi）即全量编译通过'  # knowledge_ref: DRAFT-E628-rtklib-handwritten-makefile-multi-app-adaptation
  - '接收机原始数据解码器不在 src/ 而在 src/rcv/（novatel/ublox/crescent/skytraq/javad/nvs/binex/rt17/septentrio/ss2）；只编 src/*.c 会以 input_*f 未定义符号链接失败'  # knowledge_ref: DRAFT-E628-rtklib-handwritten-makefile-multi-app-adaptation
  - 'GNU make 的 pattern rule 前提里只能有一个 %：app/consapp/%/%.c 这类双 % 写法不报错、只静默匹配失败（No rule to make target bin/xxx），必须逐应用写显式规则'  # knowledge_ref: DRAFT-E628-rtklib-handwritten-makefile-multi-app-adaptation
  - '静态链接的策略性收益：libRTK.a + 全静态 CLI 使 5 个交付二进制的 DT_NEEDED 只有 libc.so，DT_RUNPATH/DT_RPATH 完全不存在，从根上规避"无 SONAME/相对 RUNPATH 导致运行期装载失败"与 conanrun 掩盖 RUNPATH 两类假绿'  # knowledge_ref: DRAFT-E628-rtklib-handwritten-makefile-multi-app-adaptation
  - '上游自带 107 个 makefile 注册测试目标，但 test/utest 的 t_time.c（未声明变量 j）与 t_rinex.c（nav_t 已无 leaps 成员）无法编译，t_preceph/t_gloeph/t_ppp 依赖的 src/qzslex.c 在本版本不存在，util/* 的 testN 依赖未随源码分发的 inp/lexdata 数据；且 utest10 配方被整行注释，make 返回 rc=0 却无产出，不能记 PASS'  # knowledge_ref: DRAFT-E628-rtklib-handwritten-makefile-multi-app-adaptation
