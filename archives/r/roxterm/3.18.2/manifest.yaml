knowledge_gained:
  - "E527: conan 缓存中的 ELF 工具在 HMFS 上不可执行（无 .codesign），须 staging 复制 + objcopy 去段 + binary-sign-tool selfSign 重签"
  - "E463: /data/service/hnp/bin 的 ambient glib-compile-resources 缺 libffi.so.8，不能用"
  - "CMake add_custom_command 裸命令名在 configure 期用 find_program 解析，不受构建期 PATH 影响；补丁改为显式 find_program 并用 CMAKE_PROGRAM_PATH 引导到 staged 副本"
  - "libintl.so.8 SONAME 冲突：gettext 与 glib proxy-libintl 符号集不同（gettext() vs g_libintl_*()）；聚合 conanbuildenv 无条件重写 LD_LIBRARY_PATH 且总在自定义脚本之后 source，只能用 shell wrapper 在 exec 前强制 glib libdir 置前来解除遮蔽（HMFS 上 patchelf 不可写）"
  - "OHOS 工具链 --as-needed：仅使用 GDBus(gio) 符号的应用，libdbus-1/libdbus-glib-1 不出现在直接 NEEDED（断言需按实际闭包收紧）"
  - "man 页用 xsltproc 在线拉 docbook.xsl，离线 CI 必须可关（BUILD_MANPAGES 选项）"

