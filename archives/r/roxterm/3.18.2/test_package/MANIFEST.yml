# test_package/MANIFEST.yml — roxterm/3.18.2
#
# 上游测试实证（2026-09-30，roxterm-3.18.2 官方 GitHub tag tarball 源码清点）：
# - 全仓 `grep -rn "enable_testing\|add_test" --include=CMakeLists.txt`：无命中
# - 无 tests/ / test/ 目录；CMakeLists.txt / src/CMakeLists.txt 均无测试目标
# - INSTALL / INSTALL.Debian / README：无 make check / ctest 相关说明
# → 上游 roxterm 3.18.2 无自动化测试套件（N=0），CI 仅做构建
#
# 消费者侧（test_package）以二进制/ELF/加载器三层探针替代（R34/R40），
# 并补 2 项鸿蒙特有验证（NEEDED 闭包含 VTE/D-Bus 栈、headless 加载器
# 全链解析探测），详见 test_package/conanfile.py。

package: roxterm/3.18.2
homepage: "https://github.com/realh/roxterm"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
# 上游无测试（N=0，证据见文件头注释）

test_package_tests:
  - file: test.c
    description: "消费者探针：编译期确认被测包引用（占位源，实际验证在 conanfile.py 的 ELF/NEEDED/加载器三层探针）"
    command: "conan create test_package（ELF magic/AArch64/NEEDED 闭包/加载器解析）"

# 断言计数：
# - ELF magic (2 个二进制) + AArch64 e_machine (2) + NEEDED 闭包 7 项 (7)
#   + 加载器全链解析 (1) = 12 项断言
