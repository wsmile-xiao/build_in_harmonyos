# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 强制要求 (build_and_test.sh L0e)
# 详见: docs/TEST_QUALITY_SPEC.md

package: rapidfuzz/3.12.2
homepage: "https://github.com/rapidfuzz/RapidFuzz"

# 上游测试命令 — rapidfuzz 3.12.2 上游使用 pytest 套件
# (sdist 的 pyproject.toml [tool.pytest.ini_options] testpaths = ["tests"])
upstream_check_command: "python3 -m pytest tests/"

# 上游测试在 test_package/conanfile.py 的 test() 中真实执行并输出
# HMBS_UPSTREAM_TEST_RESULT 标记：
#   * rapidfuzz 是 CPython 扩展，只有 package() 之后才落进
#     lib/python3.12/site-packages，消费者视角 import 就是上游用例的真实前提；
#   * HMBS gate 只扫 test_package 阶段 stdout，且 conan create 命中缓存二进制时
#     build() 会被整体跳过，marker 必须在 test() 阶段发出；
#   * airthings-ble / ld2410-ble / python-didl-lite 同为此模式。
upstream_test_in_build: false
upstream_test_command: "python3.12 -m pytest test_package/tests/ -q --no-header --color=no -p no:cacheprovider -o addopts="

# 上游 tests/ 目录已逐字 vendor 进 test_package/tests/（23 个 .py，与
# rapidfuzz-3.12.2 sdist 的 tests/ 逐字节一致；__pycache__ 未纳入）。
# 实测规模（2026-09-28，本机 python3.12 + pytest 9.1.1 + numpy/pandas 可用）：
#   * 18 个 test_*.py 测试文件，另有 common.py x2、__init__.py x2、freezeTools/script.py
#   * 129 个 `def test_` 测试函数（与评审按 `grep -c '^\s*def test_'` 的口径一致）
#   * pytest 参数化展开后 386 个用例项，全部执行通过（386 passed / 0 skipped / 0 failed）
# 由 test_package 的 test() 用 conan python/3.12.9 运行；16 项 numpy 门控用例依赖
# conan numpy/2.5.2，2 项 pandas 门控用例依赖 pip 可得的 pandas（不可得则按上游
# 设计 importorskip 跳过并在 HMBS 标记里如实计数）。
upstream_tests:
  - file: tests/test_fuzz.py
    source: rapidfuzz-3.12.2/tests/test_fuzz.py
    description: "fuzz scorer 测试（ratio / partial_ratio / token_set_ratio / WRatio 等，20 个测试函数）"
    command: "python3 -m pytest tests/test_fuzz.py"
  - file: tests/test_utils.py
    source: rapidfuzz-3.12.2/tests/test_utils.py
    description: "utils.default_process 行为测试（1 个测试函数）"
    command: "python3 -m pytest tests/test_utils.py"
  - file: tests/test_process.py
    source: rapidfuzz-3.12.2/tests/test_process.py
    description: "process.extract/extractOne/cdist/cpdist 与 numpy、pandas 门控用例（32 个测试函数）"
    command: "python3 -m pytest tests/test_process.py"
  - file: tests/test_hypothesis.py
    source: rapidfuzz-3.12.2/tests/test_hypothesis.py
    description: "hypothesis 属性测试：C 实现 vs 纯 Python 参考实现等价性（21 个测试函数，需 hypothesis）"
    command: "python3 -m pytest tests/test_hypothesis.py"
  - file: tests/test_cpp_fallback.py
    source: rapidfuzz-3.12.2/tests/test_cpp_fallback.py
    description: "C++ 实现（RAPIDFUZZ_IMPLEMENTATION=cpp）符号覆盖检查（模块级断言，无 test_ 函数）"
    command: "python3 -m pytest tests/test_cpp_fallback.py"
  - file: tests/test_pure_python_fallback.py
    source: rapidfuzz-3.12.2/tests/test_pure_python_fallback.py
    description: "纯 Python 实现（RAPIDFUZZ_IMPLEMENTATION=python）符号覆盖检查（模块级断言，无 test_ 函数）"
    command: "python3 -m pytest tests/test_pure_python_fallback.py"
  - file: tests/distance/test_init.py
    source: rapidfuzz-3.12.2/tests/distance/test_init.py
    description: "distance 包初始化与公共出口测试（14 个测试函数）"
    command: "python3 -m pytest tests/distance/test_init.py"
  - file: tests/distance/test_distance.py
    source: rapidfuzz-3.12.2/tests/distance/test_distance.py
    description: "distance 公共行为测试（8 个测试函数）"
    command: "python3 -m pytest tests/distance/test_distance.py"
  - file: tests/distance/test_Levenshtein.py
    source: rapidfuzz-3.12.2/tests/distance/test_Levenshtein.py
    description: "Levenshtein 距离/归一化/操作模式测试（8 个测试函数）"
    command: "python3 -m pytest tests/distance/test_Levenshtein.py"
  - file: tests/distance/test_Hamming.py
    source: rapidfuzz-3.12.2/tests/distance/test_Hamming.py
    description: "Hamming 距离测试（4 个测试函数）"
    command: "python3 -m pytest tests/distance/test_Hamming.py"
  - file: tests/distance/test_Jaro.py
    source: rapidfuzz-3.12.2/tests/distance/test_Jaro.py
    description: "Jaro 相似度测试（2 个测试函数）"
    command: "python3 -m pytest tests/distance/test_Jaro.py"
  - file: tests/distance/test_JaroWinkler.py
    source: rapidfuzz-3.12.2/tests/distance/test_JaroWinkler.py
    description: "JaroWinkler 相似度测试（4 个测试函数）"
    command: "python3 -m pytest tests/distance/test_JaroWinkler.py"
  - file: tests/distance/test_Indel.py
    source: rapidfuzz-3.12.2/tests/distance/test_Indel.py
    description: "Indel 距离测试（3 个测试函数）"
    command: "python3 -m pytest tests/distance/test_Indel.py"
  - file: tests/distance/test_LCSseq.py
    source: rapidfuzz-3.12.2/tests/distance/test_LCSseq.py
    description: "最长公共子序列距离测试（2 个测试函数）"
    command: "python3 -m pytest tests/distance/test_LCSseq.py"
  - file: tests/distance/test_OSA.py
    source: rapidfuzz-3.12.2/tests/distance/test_OSA.py
    description: "OSA（受限编辑距离）测试（5 个测试函数）"
    command: "python3 -m pytest tests/distance/test_OSA.py"
  - file: tests/distance/test_DamerauLevenshtein.py
    source: rapidfuzz-3.12.2/tests/distance/test_DamerauLevenshtein.py
    description: "Damerau-Levenshtein 距离测试（1 个测试函数）"
    command: "python3 -m pytest tests/distance/test_DamerauLevenshtein.py"
  - file: tests/distance/test_Postfix.py
    source: rapidfuzz-3.12.2/tests/distance/test_Postfix.py
    description: "Postfix 相似度测试（2 个测试函数）"
    command: "python3 -m pytest tests/distance/test_Postfix.py"
  - file: tests/distance/test_Prefix.py
    source: rapidfuzz-3.12.2/tests/distance/test_Prefix.py
    description: "Prefix 相似度测试（2 个测试函数）"
    command: "python3 -m pytest tests/distance/test_Prefix.py"

# test_package 中自带的测试（消费者视角验证，Python 扩展库用 Python 脚本）
test_package_tests:
  - file: test_rapidfuzz.py
    description: "消费者测试（L0c/R34）：真实 import 打包产物并调用 fuzz / distance / process / utils 公开 API，共 15 项断言"
    command: "python3.12 test_rapidfuzz.py"

# 测试规模总计（用于质量评估）：
#   上游 129 个测试函数 → pytest 386 个用例项
#   + 消费者 15 项断言
assertion_count: 401
