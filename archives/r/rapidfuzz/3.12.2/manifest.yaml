build_system: cmake

source:
  url: "https://pypi.tuna.tsinghua.edu.cn/packages/f9/be/8dff25a6157dfbde9867720b1282157fe7b809e085130bb89d7655c62186/rapidfuzz-3.12.2.tar.gz"
  url_fallbacks:
    - "https://mirrors.aliyun.com/pypi/packages/f9/be/8dff25a6157dfbde9867720b1282157fe7b809e085130bb89d7655c62186/rapidfuzz-3.12.2.tar.gz"
    - "https://repo.huaweicloud.com/repository/pypi/packages/f9/be/8dff25a6157dfbde9867720b1282157fe7b809e085130bb89d7655c62186/rapidfuzz-3.12.2.tar.gz"
    - "https://mirrors.cloud.tencent.com/pypi/packages/f9/be/8dff25a6157dfbde9867720b1282157fe7b809e085130bb89d7655c62186/rapidfuzz-3.12.2.tar.gz"
    - "https://files.pythonhosted.org/packages/f9/be/8dff25a6157dfbde9867720b1282157fe7b809e085130bb89d7655c62186/rapidfuzz-3.12.2.tar.gz"
  sha256: "b0ba1ccc22fff782e7152a3d3d0caca44ec4e32dc48ba01c560b8593965b5aa3"
  tar_format: tar.gz
  official_url: "https://files.pythonhosted.org/packages/source/r/rapidfuzz/rapidfuzz-3.12.2.tar.gz"
  note: "镜像与官方逐字节一致（同一 sha256）；换 host 以绕开 worker 到 files.pythonhosted.org 仅 ~10KB/s 的稳态带宽（CI #62819/#62860 3600s 超时）。见 notes.md #13"

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DPython_EXECUTABLE=<conan-python>/bin/python3.12"
  dependencies:
    - python/3.12.9
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "rapidfuzz 3.12.2 是 Python 包（PyPI RapidFuzz），C++ 核心 vendored 在 extern/rapidfuzz-cpp@3.2.0"
  - "上游 rapidfuzz-cpp 独立发布线止于 v3.3.4（已在本仓发布为 rapidfuzz-cpp/3.3.4）"
  - "OHOS CMake FindPython 需运行解释器获取版本/SOABI：不设置 CMAKE_SYSTEM_NAME，由 clang shim 强制 --target=aarch64-linux-ohos"
  - "OHOS 上有两种 clang-15 C++ 环境，不可互换：SDK 原生 clang 自带 libcxx-ohos（musl xlocale.h 已定义 strtoll_l/strtoull_l），DevEco Studio clang 既无默认 C++ 头路径又缺这两个函数"
  - "因此不能用硬编码的 locale stub/include 路径：SDK clang 上会 error: redefinition of 'strtoll_l'，CI worker 上 /mnt/d/apps/DevEco Studio 路径根本不存在。改为编译探测（_probe）按实际工具链决定"
  - "-D_LIBCPP_PROVIDES_DEFAULT_RUNE_TABLE 两种环境都需要"
  - "rapidfuzz sdist 有 57.9MB（本仓 PyPI 源码包最大），worker 到 files.pythonhosted.org 的链路会中途 Read timed out；conan get() 默认 retry=2 只有 3 次机会，需放宽到 retry=6/retry_wait=15（同 openfast）。worker 无 curl，故 CI 的 mirror 预下载对该 host 不起作用"
  - "上条只解决抖动，解决不了稳态带宽不足：实测 worker→files.pythonhosted.org 仅 ~10KB/s，57907839/10355≈5592s > DEFAULT_BUILD_TIMEOUT 3600s，零失败也必然超时（CI #62819/#62860 两个不同 worker 都死在 93%）。加大 retry 对此无效，必须换源"
  - "get_mirrors() 对 files.pythonhosted.org 显式 return [url]（注释『conandata.yml 不太可能引用这里』），所以 CI 镜像注入对 PyPI host 是空操作；pre-download 又因 worker 缺 curl 跳过——两道保险同时失效"
  - "国内 PyPI 镜像对同一归档快约 2700 倍（TUNA 28MB/s、阿里 18、华为 10、腾讯 2.2），实测四者下载后 sha256 与官方完全一致，可复用同一 sha256（R37 换 host 语义等价）。先例：astlib/0.13.2（PR #7425 #36249 同 host 同故障）、contourpy/numpy/pillow/python-cairo 用单值 TUNA"
  - "镜像只镜像带内容哈希的规范路径 /packages/<xx>/<yy>/<hash>/<file>；旧的 /packages/source/<字母>/<包>/<file> 跳转形式在 TUNA 返回 404"
  - "判超时是抖动还是稳态带宽不足：content-length ÷ 日志实际下载耗时 > DEFAULT_BUILD_TIMEOUT 即稳态不足，调 retry 无用"
  - "源码只能是 PyPI sdist：GitHub tag 归档 v3.12.2.tar.gz 是不同产物（sha256 400d0b53ce27a11e5896dfe139429b78a74562d8e0c16999b7f0bd58f521c14a vs sdist b0ba1ccc...），且归档无预生成 .cxx、extern 子模块为空，CMake 构建不可用"
  - "工具链探测必须用 -fsyntax-only 判定头文件可达性；不要用链接结果判定，也不要在配方里对 include 路径做 ohos-sdk / /data/service/hnp 之类的宿主路径白名单，否则本地 WSL 的 DevEco SDK 会被误判"
  - "上游 pytest 套件必须真跑：把 sdist 的 tests/ 逐字 vendor 进 test_package/tests/，由 test() 用 conan python/3.12.9 执行（18 个测试文件 / 129 个测试函数 / pytest 386 个用例项），HMBS_UPSTREAM_TEST_RESULT 只在 test_package 阶段发（HMBS gate 只扫该阶段 stdout，且 build() 命中缓存二进制会被跳过）。pytest/hypothesis 是纯 Python 包，pip --target + PYTHONPATH 注入即可给 conan python 用；numpy 走 requires(\"numpy/2.5.2\")（制品仓已发布）"
  - "conan python/3.12.9 的解释器不导出 libpython 符号，而上游 CMakeLists 只请求 FindPython 的 Development.Module（扩展不链接 libpython，符号留给解释器进程），因此第三方 CPython 扩展必须显式 -DCMAKE_MODULE_LINKER_FLAGS=<libpython3.12.so> 才能 dlopen（否则报 PyModuleDef_Init: symbol not found）。更隐蔽的是 rapidfuzz 在扩展载入失败时静默回退到纯 Python 实现，import 不报错、测试照样全绿——所以消费者测试必须断言绑定函数的 __module__ 含 _cpp"
  - "python/3.12.9 依赖 libffi/3.5.2，但 libffi 的 lib/ 不在下游包的依赖图 LD_LIBRARY_PATH 里，会让 lib-dynload/_ctypes*.so 载入失败（ffi_prep_closure_loc: symbol not found），进而让依赖 ctypes 的 pandas 无法 import；需要在 test_package 里显式 requires 该 libffi"
