# conandata.yml — rapidfuzz 3.12.2
#
# 源码必须是 PyPI 官方 sdist，**不能**换成 GitHub tag 归档
# (github.com/rapidfuzz/RapidFuzz/archive/refs/tags/v3.12.2.tar.gz)：
#   * 二者内容不同 —— 归档的 sha256 是 400d0b53ce27a11e5896dfe139429b78a
#     74562d8e0c16999b7f0bd58f521c14a，与下面 sdist 的 b0ba1ccc... 不匹配；
#   * 归档里 0 个 .cxx（Cython 未预生成），且 extern/rapidfuzz-cpp、
#     extern/taskflow 是空的 submodule —— CMake 构建直接不可用。
# 详见 notes.md #10。
#
# 为什么用有序 URL 列表（而不是单条 files.pythonhosted.org）：
#   本 sdist 57.9MB（本仓 PyPI 源码包最大）。到 files.pythonhosted.org 的链路在
#   CI worker 上只有 ~10-15KB/s（实测 10KB/s），CI #62819 / #62860 两个不同
#   worker 的 conan create 都在 3600s 上限被 KILL —— 一次都没下完。
#   build_and_test.sh 的 get_mirrors() 对 files.pythonhosted.org 明确返回 [url]
#   （"不太可能引用这里"），镜像注入对本 host 是空操作；pre-download 又因 worker
#   无 curl 直接 [Errno 2] 跳过。所以重试预算调多大都没用：零失败也需要 ~4000s。
#   实测国内 PyPI 镜像对同一归档（TUNA 28MB/s、阿里 18MB/s、华为 10MB/s），
#   比官方快约 2700 倍；四者下载后 sha256 均为 b0ba1ccc...，与官方逐字节一致，
#   因此复用同一 sha256 校验（R37 换 host 语义等价）。conan get() 逐个尝试，
#   官方 URL 留在最后兜底。同 astlib/0.13.2（PR #7425 #36249 同 host 同故障）。
#
# 注意：官方条目用的是带内容哈希的规范路径 /packages/<xx>/<yy>/<hash>/<file>，
# 不是旧的 /packages/source/<字母>/<包>/<file> 跳转形式 —— 各镜像只镜像前者
# （TUNA 对旧形式返回 404）。
