# test_package/MANIFEST.yml
# 上游官方测试声明文件 —— rephrase 0.2
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rephrase/0.2
homepage: "https://www.roguedaemon.net/rephrase/"

upstream_check_command: ""
upstream_tests_exist: false
upstream_test_audit: "Audited the actual source artifact rephrase-0.2.tar.gz (8 entries: 1 top-level dir + 7 files: CHANGELOG, COPYING, Makefile, README, install-sh, mkinstalldirs, rephrase.c): the single Makefile declares only the all / dist / install / clean / distclean targets -- there is no check, test or TESTS target, no test/ or tests/ directory, no gtest/pytest/criterion binding, and the .PHONY list is limited to those five. Upstream ships no test harness."
reason: "rephrase 0.2 上游不提供任何测试套件：Makefile 无 check/test 目标、无测试目录、无测试框架绑定。"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "鸿蒙消费者断言（执行已安装二进制，按退出码与 stderr 判定）：T1 裸调用 exit=7，同时证明 mlock(2) 门禁在无 setuid 的 0755 安装下通过（失败会 exit 2）；T2 版本横幅含 rephrase (Rephrase) 0.2，证明上游 Makefile DEFS 的 -DVERSION 已进入 ELF；T3 Usage 行与编译期 profiles[] 表逐字一致；T4 --luks 参数 → exit 4 且报 /sbin/cryptsetup，证明烧死的 CRYPTSETUP 绝对路径与 stat() 守卫先于 /dev/tty 生效；T5 未知 profile 选项 → exit 7，证明参数解析分支正确。五条均可在无控制终端、无 gpg/cryptsetup 的环境下确定性执行。"
    command: "sh test.sh 5"

# 口径说明：test.sh 打印 5 条断言行（ok() -> "[PASS] <Tn>"），另有 test.sh:80 的汇总行
# 也以 "[PASS] counted=..." 开头 => 对日志 `grep -c "^\[PASS\]"` 得 6 行而非 5 行。
# 断言数本身仍为 5，与 assertion_count / test_package/conanfile.py 下限 / notes §5 四处同源。
test_scenario_count: 5
assertion_count: 5
