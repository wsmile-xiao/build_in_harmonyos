knowledge_gained:
  - "OHOS libc（musl 系裁剪）未导出 rindex 符号（index 在、rindex 不在），legacy BSD rindex(s,c) 须换成逐字等价的 strrchr(s,c)；属符号裁剪而非无 BSD 兼容层"
  - "鸿蒙内核对 setreuid()/setregid() 直接判 Bad system call，SIGSYS(exit 159) 不可捕获（E051）；无平台宏的等价替换是 setuid(getuid())/setgid(getgid())，euid==0 时连 saved-set 一并清除，丢权严格更强"
