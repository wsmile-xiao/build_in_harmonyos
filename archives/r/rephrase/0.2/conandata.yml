sources:
  url: "https://www.roguedaemon.net/rephrase/rephrase-0.2.tar.gz"
  sha256: "54d5bb9f3d7a0e179af1a4569d1ad67a90037ab501380da096ec0eb1fcd473bf"

patches:
  - patch_file: "patches/0001-musl-no-rindex-use-strrchr.patch"
    patch_description: "OHOS libc (musl-derived, symbol-trimmed) does not export the legacy BSD rindex while index is present, so ld.lld fails on the single call site; replaced by the semantically identical standard strrchr"
    patch_type: "portability"
  - patch_file: "patches/0002-portability-setreuid-setregid-to-setuid-setgid.patch"
    patch_description: "HongMeng raises an undeliverable SIGSYS for setreuid()/setregid() (E051); replaced unconditionally by the permitted POSIX equivalents setuid(getuid())/setgid(getgid()), which keep the same privilege-dropping intent and also clear the saved-set id when euid is 0.  No platform macro is used, per R8/PF5."
    patch_type: "portability"
