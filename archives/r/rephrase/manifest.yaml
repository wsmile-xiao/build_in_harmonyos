# 软件级 manifest
# 遵循 ARCHIVE-SPEC v2.0

software: rephrase
display: "Rephrase"
description: "GnuPG 与 Cryptsetup/LUKS 口令变体恢复工具（按记住的模式组合穷举尝试）"
category: utility
homepage: "https://www.roguedaemon.net/rephrase/"
license: GPL-3.0-only

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 的 install 规则要求 root 且 binmode=4711（setuid root）；配方改为 package() 直接 copy 0755，不走 make install"
    - "main() 以 mlock(2) 作为硬门禁（失败即 exit(2) 并提示需要 setuid root）；OHOS 上 RLIMIT_MEMLOCK 为 unlimited，故 0755 无 setuid 也能通过"
    - "零外部库依赖：Makefile 无 LDLIBS/LIBS/LDFLAGS，仅 libc（termios/mlock/fork+execv+waitpid）"
    - "prefix=/usr/local 是普通 = 赋值，可被 make 命令行覆盖；本配方不使用 install 目标"
    - "运行期依赖 gpg 与 cryptsetup（编译期宏 GPG=/usr/local/bin/gpg、CRYPTSETUP=/sbin/cryptsetup 烧死），OHOS PC 均未提供"
  common_dependencies: []

versions:
  "0.2":
    status: built
    build_date: "2026-09-25"
