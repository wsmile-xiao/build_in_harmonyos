# test_package/MANIFEST.yml — upstream test declaration (CI L0e).
package: robin/1.4.1
homepage: "https://github.com/Tessil/robin-map"

upstream_test_in_build: true
upstream_test_command: "python3 test_package/run_upstream_tests.py <build>/robin_upstream_tests"

upstream_tests:
  - file: upstream_tests/main.cpp
    source: robin-map-1.4.1/tests/main.cpp
    description: "Boost.Test main module"
  - file: upstream_tests/custom_allocator_tests.cpp
    source: robin-map-1.4.1/tests/custom_allocator_tests.cpp
    description: "custom allocator integration tests"
  - file: upstream_tests/policy_tests.cpp
    source: robin-map-1.4.1/tests/policy_tests.cpp
    description: "growth policy tests"
  - file: upstream_tests/robin_map_tests.cpp
    source: robin-map-1.4.1/tests/robin_map_tests.cpp
    description: "robin_map API and regression tests"
  - file: upstream_tests/robin_set_tests.cpp
    source: robin-map-1.4.1/tests/robin_set_tests.cpp
    description: "robin_set API and regression tests"

test_package_tests:
  - file: run_upstream_tests.py
    description: "run the unmodified upstream Boost.Test binary"
    command: "python3 run_upstream_tests.py <build>/robin_upstream_tests"

assertion_count: 342
