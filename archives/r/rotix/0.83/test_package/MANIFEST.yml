# test_package/MANIFEST.yml
# 上游官方测试声明文件
# rotix 0.83 上游**无任何测试**：源码归档中不存在 tests/ 目录、Makefile 无
# test/check 目标、无 ctest/pytest/meson 测试注册。上游 README 只说明
# `./configure && make && make install`，未提供验证步骤。故上游可运行测试数 = 0，
# 本 test_package 采用消费者视角的确定性断言验证已安装二进制。

package: rotix/0.83
homepage: "https://github.com/shemminga/rotix"

# 上游测试命令探测结果
upstream_check_command: "make check (无此目标；Makefile 仅含 all/install/uninstall/clean 等)"

# conanfile.py build() 中未集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试源文件
upstream_tests: []

# test_package 自带测试（消费者视角，调用已安装二进制）
test_package_tests:
  - file: test.sh
    description: >-
      消费者测试 — 调用已安装 rotix 二进制，覆盖默认 ROT13、往返、rotor 0/26
      恒等、左旋、大小写、-v/-h、stdin/-f - 读取、-t 与 -f 冲突拒绝、
      -a 全 25 行输出
    command: "bash test.sh"

# test_package 断言总数（见 test.sh）
assertion_count: 13
