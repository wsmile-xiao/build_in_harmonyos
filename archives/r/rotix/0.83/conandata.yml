# conandata.yml — rotix 0.83
# 上游官方 GitHub 标签归档。SHA-256 已核验，且与 Debian orig tarball
# (rotix_0.83.orig.tar.gz) 解压内容逐字节一致。
# URL 以 .tar.gz 结尾，Conan 选用 gzip 解压器（规避无扩展名 codeload URL 的
# BadZipFile 误选，见知识条目 E392）。

sources:
  url: "https://github.com/shemminga/rotix/archive/refs/tags/0.83.tar.gz"
  sha256: "99967f9308859268c8c8fbfecc970faa9a98e5621f97951d8600be0bbe69e2e4"

patches:
  - patch_file: "patches/0001-help-i18n-guard.patch"
    patch_description: >-
      help.c 无条件包含 <libintl.h> 并展开 gettext，而 rotix.c 同一处用
      #ifdef I18N 守卫。OHOS musl 的 libintl.h 是空壳（只有宏、不声明函数），
      导致 gettext 变隐式 int，help.c 出现 14 处 -Wint-conversion 编译错误。
      补丁把 help.c 的包含/宏改为与 rotix.c 一致的 I18N 守卫，关闭 i18n 时
      展开为恒等宏，行为与上游一致。
    patch_type: "portability"
