# 版本级 manifest
# 文件位置: archives/r/rotix/0.83/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.83"
software: rotix
status: built
build_date: "2026-09-27"
build_system: makefile
conan_ref: "rotix/0.83"
status_notes: >-
  真机 shadow CI（r1）一次通过：conan create 成功、test_package 13/13 断言 PASS、
  L0/L1/L4/L5 pass、L1e 确认真依赖、exit code 0。L2=skip（non-blocking）：上游 rotix
  只注册短选项 -v/-h，CI 冒烟固定执行 --version/--help 而失败，属上游 CLI 惯例缺失
  （真机取证 -v/-h exit 0、--version/--help exit 1）。本机无 Conan，W3 本地 conan
  create 未执行，目标验证以真机 shadow CI 完成。

source:
  url: "https://github.com/shemminga/rotix/archive/refs/tags/0.83.tar.gz"
  sha256: "99967f9308859268c8c8fbfecc970faa9a98e5621f97951d8600be0bbe69e2e4"
  tar_format: tar.gz

build:
  system: makefile
  # rotix 自带手写 POSIX ./configure，非 autotools
  configure_options:
    - "--i18n=0"   # 关闭 NLS：OHOS 无 gettext/libintl 运行时
    - "--strip=0"  # 不 strip：ELF 签名/剥离由 CI 处理
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-help-i18n-guard.patch"

knowledge_gained:
  - "rotix 自带手写 configure 只探测 gcc/cc 且硬写 CC=gcc；OHOS sysroot 无 gcc，需在 build() 注入 gcc->target clang 的 shim 并在 make 命令行钉住 CC。"
  - "help.c 无条件 include <libintl.h> 展开 gettext，而 rotix.c 同一处用 #ifdef I18N 守卫；OHOS musl 的 libintl.h 是空壳（有宏无函数声明），导致 14 处 -Wint-conversion 编译失败（与 DRAFT-13410 / DRAFT-desktop-file-utils 同族）。"
  - "Makefile 默认 all 目标会构建 po/NL.mo，需要 gettext 的 msgfmt；只构建 rotix 目标可规避该工具依赖。"
  - "configure --i18n=0 时 --strip=1 会写入 STRIP=0，而 Makefile 对已定义变量直接当命令执行，需用 make STRIP=true 中和。"

validation:
  local_windows:
    ohos_cross_compile: passed
    method: >-
      DevEco OHOS SDK clang 15.0.4，-target aarch64-linux-ohos --sysroot=<sdk>/sysroot；
      打补丁后 rot.c/help.c/rotix.c 全部编译通过并链接为 AArch64 ELF，
      --dyn-syms 无 gettext/textdomain 符号，NEEDED 仅 libc.so。
    unpatched_reproduced: >-
      未打补丁时 help.c 报 14 处 -Wint-conversion（gettext 隐式 int），与本补丁根因一致。
    sha256_check: passed
    debian_orig_match: passed
    conan_create: not_run
    reason: "本机（Windows）未安装 Conan，也无 OHOS 运行时可执行目标二进制。"
  ohos:
    conan_create: passed
    method: >-
      真机 shadow CI（r1，2026-09-27）：隔离 job + 全局锁排队（wait_seconds=6），
      ci/conan/build_and_test.sh 全流程。conan create 成功（镜像 fallback 下载、
      补丁应用、configure 识别 HarmonyOS 并回退 NO_GETOPT_LONG、make CC 钉住
      目标 clang、STRIP=true 中和生效），打包 COPYING/rotix/README/rotix.1。
    gates: "L0=pass L1=pass(incl L1e genuine) L2=skip(non-blocking) L4=pass L5=pass"
    test_package: "13/13 assertions PASS"
    exit_code: 0
