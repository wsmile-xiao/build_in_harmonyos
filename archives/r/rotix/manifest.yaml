# 软件级 manifest
# 文件位置: archives/r/rotix/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: rotix
display: "rotix"
description: "生成旋转混淆（ROT-x，如 ROT13）的命令行工具，支持文件、标准输入与命令行文本"
category: utility
homepage: "https://github.com/shemminga/rotix"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - >-
      上游自带手写 POSIX ./configure（非 autotools），只探测 gcc/cc 且硬写 CC=gcc；
      OHOS sysroot 无 gcc，需在 build() 注入 gcc→target clang 的 shim，并在 make
      命令行钉住 CC。
    - >-
      help.c 无条件 include <libintl.h> 展开 gettext（rotix.c 同处有 #ifdef I18N
      守卫）。OHOS musl 的 libintl.h 是空壳（有宏无函数声明），导致 14 处
      -Wint-conversion；补丁 0001 对齐 rotix.c 的守卫，并以 --i18n=0 关闭 NLS。
    - >-
      Makefile 默认 all 目标会构建 po/NL.mo（需 gettext 的 msgfmt）；只构建 rotix 目标。
    - >-
      configure --i18n=0 时会写 STRIP=0，而 Makefile 会把已定义变量当命令执行；
      用 make STRIP=true 中和。
  common_dependencies: []

versions:
  "0.83":
    status: built
    build_date: "2026-09-27"
    path: archives/r/rotix/0.83
