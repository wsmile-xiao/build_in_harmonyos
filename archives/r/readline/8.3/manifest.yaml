software: readline
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/8.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.3"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "ftp://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz"

  # 源码校验和
  sha256: "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "CFLAGS=-fPIC -O2"
    - "--with-curses"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ncursesw

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess-harmonyos.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "必须设置 CFLAGS=-fPIC -O2，否则静态库链接到共享库会报错"
  - "需要应用 config.guess 补丁以识别 HarmonyOS 平台"
  - "静态链接编译完全可用，动态链接需要系统配置正确的动态链接器路径"
  - "使用 --with-curses 参数指定 ncurses 库支持"
