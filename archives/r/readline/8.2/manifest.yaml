software: readline
version: "8.2"
status: success
build_system: autotools
compile_date: "2026-04-01"
last_updated: "2026-04-01"

dependencies:
  required:
    - name: ncurses
      version: "6.4"
      archive_path: archives/n/ncurses/6.4
      note: "编译为静态库(--without-shared)，被静态嵌入到 libreadline.so"
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
    - --with-curses
  cflags: "-fPIC -O2"
  ldflags: ""
  env:
    CC: clang

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: 添加 HarmonyOS 系统检测（config.guess + config.sub）
    lines_changed: 30
    files_modified:
      - support/config.guess
      - support/config.sub
  - file: 0002-fix-shlib-termcap-link.patch
    purpose: 修复共享库链接时未包含 TERMCAP_LIB 导致 tputs 符号缺失
    lines_changed: 4
    files_modified:
      - shlib/Makefile.in

compatibility:
  level: high
  issues:
    - desc: "ncurses 代码静态嵌入 libreadline.so（约+100KB），与其他 ncurses 共享库存在符号冲突风险"
      severity: low
  notes: "bash 依赖 readline。Python 3.12 readline 模块验证通过。"

test_results:
  type: manual
  note: "Python import readline/rlcompleter 成功，tab 补全功能正常"
  key_features:
    - "Python readline 模块导入"
    - "rlcompleter tab 补全"
    - "共享库动态加载（ctypes.CDLL 验证）"

knowledge_gained:
  - "readline 8.2 构建系统 bug：--with-curses 设置了 TERMCAP_LIB 但未传递给 SHLIB_LIBS，需补丁修复 shlib/Makefile.in"
  - "ncurses --without-shared 时，readline 需要静态嵌入 ncurses 代码到 .so 中"
  - "不能将第三方 ncurses.so 放入 LD_LIBRARY_PATH 搜索路径（会破坏系统 ncurses 动态链接）"
  - "HMDFS 不支持符号链接，make install 后必须将 .so 软链接替换为文件拷贝"

knowledge_ref:
  - knowledge/harmonyos-specifics.md#软链接处理

maintainer: OpenHarmony PC Developer社区
tags: [readline, library, gnu, ncurses, python-extension]

references:
  - title: GNU readline 官方下载
    url: https://ftp.gnu.org/gnu/readline/
  - title: GNU readline 官方下载（阿里云镜像）
    url: https://mirrors.aliyun.com/gnu/readline/
