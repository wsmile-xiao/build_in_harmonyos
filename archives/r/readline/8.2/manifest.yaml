software: readline
version: "8.2"
status: success
build_system: autotools
compile_date: "2024-03-16"

dependencies:
  required: [ncurses]
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
    - --with-shared
  cflags: "-fPIC -O2"

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: 添加 HarmonyOS 系统检测
    lines_changed: 30

compatibility:
  level: high
  issues: []
  notes: bash 依赖 readline

test_results:
  type: manual
  note: 通过实际使用验证功能正常

knowledge_gained:
  - readline 依赖 ncurses
  - 使用 --with-shared 生成共享库

maintainer: OpenHarmony Community
tags: [readline, library, gnu]