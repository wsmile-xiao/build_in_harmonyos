software: readline
display: "GNU Readline"
description: "Library for line editing and command line history management"
category: system
homepage: "https://tiswww.cwru.edu/php/chet/readline/rltop.html"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "必须设置 CFLAGS='-fPIC -O2'，否则静态库链接到共享库会报错"
    - "需要 config.guess + config.sub 补丁添加 HarmonyOS 检测"
    - "TERMCAP_LIB 需改为 -lncursesw（不是 -lncurses）"
    - "ncurses --without-shared 时自动静态嵌入 libreadline.so"
  common_dependencies:
    - ncurses

versions:
  "8.2":
    status: published
    build_date: "2026-04-12"
