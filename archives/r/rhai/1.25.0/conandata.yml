# conandata.yml — rhai 1.25.0
# Source: GitHub tag archive (official release v1.25.0)，官方源（R39/PF7）
# sha256 为真机实测值（curl 下载后 sha256sum）
sources:
  url: "https://github.com/rhaiscript/rhai/archive/refs/tags/v1.25.0.tar.gz"
  sha256: "5862084ee0c55882b58cdbb9fbee66a5817eac8f4ef16e76e56bcb98b486e03f"

# cargo 运行期依赖的共享库（OHOS loader 不解析软链 DT_NEEDED，必须提供实体文件）。
# 来源：Harmonybrew OHOS 预编译 bottle（argc/1.24.0、below/0.11.0、lemmeknow/0.8.0 先例），
# sha256 为真机实测值。cargo 1.97.1 动态链接 libssl.so/libcrypto.so/libz.so。
rust_runtime_bottles:
  - name: "openssl3"
    url: "https://harmonybrew.atomgit.com/bottles/openssl%403-3.6.4_1.arm64_ohos.bottle.tar.gz"
    sha256: "29caefb982dc01671e67232f3862b50ce69a34a4f4135a1495078830bb12b81b"
  - name: "zlib-ng-compat"
    url: "https://harmonybrew.atomgit.com/bottles/zlib-ng-compat-2.3.3_2.arm64_ohos.bottle.tar.gz"
    sha256: "99356b80ddb81e0b8267debb44df459f2b5e27e7800406d3b4cf7f8f744beb89"

patches:
  - patch_file: "patches/0001-drop-rustyline-git-patch.patch"
    patch_description: "Drop the [patch.crates-io] git redirect for rustyline. Upstream points rustyline at a third-party git fork (schungx/rustyline, branch v15_fake) only to add Windows bracketed-paste support to the optional rhai-repl binary. Git dependencies are not reproducible and github.com:443 is not reachable from the OHOS build network; the OHOS build does not enable bin-features, so rustyline is resolved from crates.io (rsproxy mirror) instead."
    patch_type: "portability"
