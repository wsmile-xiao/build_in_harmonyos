# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51：上游测试三步法申报）

package: rhai/1.25.0
homepage: "https://github.com/rhaiscript/rhai"

# 上游测试命令（Cargo workspace，无 make check / ctest / meson test）
# --tests 覆盖 tests/ 下 58 个集成测试文件 + src/lib.rs 单元测试；
# 使用上游 CI build.yml 同源的 feature 子集（testing-environ 等）。
upstream_check_command: "cargo test --release --tests --features testing-environ,decimal,serde,metadata,internals,debugging"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cargo test --release --tests --features testing-environ,decimal,serde,metadata,internals,debugging --target aarch64-unknown-linux-ohos"

# 上游实际运行的测试程序（cargo 测试，静态统计：tests/ 58 个 .rs + src 单元测试）
# 运行结果：61 个 test binary、281 passed / 0 failed / 0 ignored（真机 host=target）
upstream_tests:
  - file: "tests/*.rs"
    source: "rhai-1.25.0/tests/*.rs (58 files)"
    description: "上游集成测试：语言语义（arrays/string/maps/closures/modules/custom_syntax/operators/optimizer/stack/serde/parse_json/debugging 等）共 280 用例真机全通过"
    command: "cargo test --release --tests --features testing-environ,decimal,serde,metadata,internals,debugging --target aarch64-unknown-linux-ohos"
  - file: "src/lib.rs"
    source: "rhai-1.25.0/src/lib.rs"
    description: "库单元测试 1 用例（test_rational_multiply）"
    command: "cargo test --release --tests --target aarch64-unknown-linux-ohos --lib"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_rhai.py
    description: "消费者功能测试：脚本执行/运算结果/语法错误诊断/缺失文件退出码"
    command: "python3 test_rhai.py <package_folder>"

# 鸿蒙特有测试 (HarmonyOS-specific)：断言产物在本平台可用所必需的特性
harmonyos_specific_tests:
  - file: test_rhai.py
    description: "鸿蒙特有测试 4 项（B1 ELF machine=AArch64 / B2 PT_INTERP=ld-musl-aarch64.so.1 / B3 含 OHOS code signature / B4 非空可执行）"
    command: "python3 test_rhai.py <package_folder>"
    assertion_count: 4

# 依赖测试：rhai 为纯 Rust 产物，无 C/C++ 依赖包消费面
dependency_tests: []

# 测试断言总数（上游 281 + 消费者功能 7 + 鸿蒙特有 4）
assertion_count: 292
