# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "rust-toolchain/1.97.1 的 cargo/rustc/librustc_driver 需 binary-sign-tool -selfSign 1 自签名，且签名输出会丢失可执行位，必须再 chmod +x，否则 OHOS loader 报 permission denied（EACCES）"
  - "sysroot 的 lib/rustlib 若为软链，rustc 会报 can't find crate for `std`（附带 `rustup target add` 误导提示）；必须真实复制 rustlib 目录（可跳过 bin/ 与 analysis/ 以减小体积）"
  - "OHOS loader 不解析软链形式的 DT_NEEDED：cargo 需要的 libssl.so/libcrypto.so/libz.so 必须是实体文件（每个 SONAME 都要有）；软链会导致 Error loading shared library libssl.so"
  - "OHOS SDK 的 aarch64-unknown-linux-ohos-clang 是 shell 包装脚本，调用 readlink/dirname；若 PATH 中缺 /usr/bin 会报 readlink/dirname: inaccessible or not found 并以 127 退出，表现为链接失败"
  - "上游 [patch.crates-io] 的 git 依赖（rustyline fork）会被 cargo 在解析阶段强制拉取，构建网络不可达 github.com 时 fetch 失败；去除后 rustyline 改由 crates.io(rsproxy) 解析"
  - "上游 rhai-run 对脚本语法/运行时错误仅打印诊断、退出码为 0（仅文件缺失返回 1），消费者测试应据此断言"
