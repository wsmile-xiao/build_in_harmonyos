# 软件级 manifest — rhai
# 遵循 ARCHIVE-SPEC v2.0

software: rhai
display: "rhai"
description: "嵌入式脚本语言与求值引擎（Rust 实现）— 面向 Rust 应用的沙箱化脚本扩展，提供解释器 CLI: rhai-run / rhai-dbg"
category: utility
homepage: "https://github.com/rhaiscript/rhai"
license: MIT OR Apache-2.0
build_system: cargo

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Rust Cargo workspace（无 C/C++ 依赖，依赖闭包无任何链接外部 C 库的 -sys crate）；构建产物为 CLI（rhai-run / rhai-dbg），库以 rlib 形式内建"
    - "设备无 cargo/rustc：经 tool_requires 引用制品仓基础设施包 rust-toolchain/1.97.1（宿主与目标均为 aarch64-unknown-linux-ohos）"
    - "rust-lang dist 工具链二进制无 code signature，OHOS 拒绝 execve（EACCES）：配方内 binary-sign-tool -selfSign 1 自签名 cargo/rustc/librustc_driver；签名的输出会丢失可执行位，须再 chmod +x"
    - "sysroot 的 lib/rustlib 必须为真实目录（复制），软链会导致 rustc 报 can't find crate for `std`（误导性 rustup 提示）"
    - "cargo 自身动态链接 OpenSSL/zlib：harmonybrew openssl@3/zlib-ng-compat bottle 提供运行库；OHOS loader 忽略 DT_RUNPATH 且不解析软链 DT_NEEDED，须按 SONAME 提供实体文件（libssl.so/libssl.so.3/libcrypto.so/libcrypto.so.3/libz.so/libz.so.1）"
    - "OHOS SDK clang 包装脚本依赖 readlink/dirname，PATH 必须包含 /usr/bin"
    - "设备无默认 CA store：SSL_CERT_FILE/CURL_CA_BUNDLE 指向系统 cacert.pem，crates 索引走 rsproxy.cn sparse 镜像"
    - "禁止 rustup 引导（rustup 无法识别 HarmonyOS 宿主，E105/E154）"
    - "OHOS /tmp 只读（E002）：构建与上游测试需可写 TMPDIR"
    - "上游 [patch.crates-io] 将 rustyline 指向第三方 git fork（仅 rhai-repl 的 Windows 括号粘贴需要）：git 依赖不可复现且构建网络不可达 github.com，配方 patches/0001 去除之"
  common_dependencies:
    - rust

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.25.0":
    status: built
    build_date: "2026-10-01"
    published_as: rhai/1.25.0
