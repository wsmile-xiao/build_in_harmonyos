software: rhash
build_system: makefile
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.4.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.6"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-20"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/rhash/RHash/archive/refs/tags/v1.4.6.tar.gz"

  # 源码校验和
  sha256: "9f6019cfeeae8ace7067ad22da4e4f857bb2cfa6c2deaa2258f55b2227ec937a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "--prefix=/"
    - "--enable-static"
    - "--disable-lib-shared"
    - "--disable-gettext"
    - "--disable-openssl"
    - "--disable-symlinks"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 编译标志
  cflags: "-O2 -DNDEBUG"
  ldflags: "-static"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 使用 CONFIG_SHELL，且固定 make -j1 避免真机资源争用"
  - "OpenSSL 仅为上游可选哈希加速后端；显式禁用以保持静态包无外部依赖，算法功能由内置实现保留"
  - "OHOS aarch64 shadow CI 已通过上游 test/test-lib、Conan test_package 和 L0/L1/L2/L4/L5 门禁"
  - "CLI 元数据补充 archives/r/rhash/commands.json 后，PR CI #28842 的 L0/R38、L1 和 conan-build-test 全部通过"
  - "知识草稿: knowledge/drafts/E321-draft-RH46.kv 和 knowledge/drafts/E321-draft-RH46.md"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
