# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rhash/1.4.6
homepage: "http://rhash.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test test-lib"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 test test-lib"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_rhash.sh
    source: rhash-1.4.6/tests/test_rhash.sh
    description: "RHash CLI 测试套件 (25 个测试用例)"
    command: "make -j1 test"
  - file: librhash/test_lib.c
    source: rhash-1.4.6/librhash/test_lib.c
    description: "LibRHash 库测试 (所有哈希算法验证)"
    command: "make -j1 test-lib"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 使用 librhash API 计算 MD5 并验证结果"
    command: "./test_rhash"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 32
