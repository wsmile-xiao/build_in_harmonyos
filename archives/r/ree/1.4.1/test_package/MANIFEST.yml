# test_package/MANIFEST.yml
# ree 1.4.1 - upstream test declaration.

package: ree/1.4.1
homepage: "https://github.com/alexmyczko/ree"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream 1.4.1 ships ree.c, fontdump.c, a hand-written `makefile`, man pages,
  a README and a legacy ree.sh. There is no test suite (no `make check`, no
  ctest, no tests/ directory).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_ree.sh
    description: "fontdump usage path plus extraction of a synthetic 8x8 VGA font from a crafted ROM image (byte-exact); ree must terminate with its known /dev/mem or scanning banner"
    command: "sh test_ree.sh"

test_files:
  - path: "test_package/test_ree.sh"
    test_type: "R34"
    assertion_count: 9

test_package_test_count: 1
consumer_assertion_count: 9
upstream_test_cases: 0
assertion_count: 9
