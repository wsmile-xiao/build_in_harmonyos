# test_package/MANIFEST.yml
# 上游官方测试声明文件
package: rset/3.3
homepage: "https://github.com/eradman/rset"

# 上游测试命令 (rset 无 make check；tests/ 目录为 Ruby 脚本，需 ruby + bundler)
upstream_check_command: "make -C tests CC=clang LD=ld.lld"
upstream_test_in_build: false
upstream_test_command: "ruby tests/test_*.rb（需 ruby 3.4 + webrick gem）"
upstream_test_case_counting: "每个 tests/test_*.rb 中的 try 块记为 1 个测试用例（脚本在首个失败用例处 abort，完整执行需逐例 rescue 插桩）"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_renv.rb
    source: rset-3.3/tests/test_renv.rb
    description: "renv 环境过滤/引用/-q 行为（7 例）"
    command: "ruby tests/test_renv.rb"
  - file: tests/test_rsub.rb
    source: rset-3.3/tests/test_rsub.rb
    description: "rsub 块编辑行为（8 例）"
    command: "ruby tests/test_rsub.rb"
  - file: tests/test_miniquark.rb
    source: rset-3.3/tests/test_miniquark.rb
    description: "miniquark HTTP 服务 GET/HEAD 行为（16 例）"
    command: "ruby tests/test_miniquark.rb"
  - file: tests/test_rinstall.rb
    source: rset-3.3/tests/test_rinstall.rb
    description: "rinstall 本地/URL 安装与权限（11 例）"
    command: "ruby tests/test_rinstall.rb"
  - file: tests/test_labelgrep.rb
    source: rset-3.3/tests/test_labelgrep.rb
    description: "labelgrep pln(5) 模式匹配（2 例）"
    command: "ruby tests/test_labelgrep.rb"
  - file: tests/test_rset.rb
    source: rset-3.3/tests/test_rset.rb
    description: "rset 本地执行/ssh 会话/归档/路由解析（38 例）"
    command: "ruby tests/test_rset.rb"
  - file: tests/test_rset_worker.rb
    source: rset-3.3/tests/test_rset_worker.rb
    description: "worker 并行/日志汇总（7 例）"
    command: "ruby tests/test_rset_worker.rb"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "rset -V 版本断言 / renv 过滤与 -q 错误路径 / labelgrep 标签匹配 / rinstall staging 安装 / miniquark 可执行性"
    command: "./test.sh"

# 上游测试用例总数（try 块口径，2026-10-11 本机逐例实测）
# 7+8+16+11+2+38+7 = 89
upstream_test_count: 89

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 89
