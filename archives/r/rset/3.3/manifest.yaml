# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.3"

# 软件名
software: "rset"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-03"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/eradman/rset/archive/refs/tags/3.3.tar.gz"

  # 源码校验和
  sha256: "6d3eee35ce7db34ac15733f91ccfda7cbac14994e4dc8e1f9e4b7266bcc60e4a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
  - "TARGET_OS=Linux（OHOS musl 兼容 Linux 移植层，启用 -D_GNU_SOURCE -D_LINUX_PORT）"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-renv.awk.patch"
- "0002-rutils.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "uname 返回 HarmonyOS 导致上游 configure 误选 bsd Makefile，需 TARGET_OS=Linux 显式覆盖"
- "toybox awk 将脚本参数 -q 误解析为 awk 选项，renv.awk 改为 sh+awk polyglot 绕过"
- "HMDFS 上 ELF 未签名不可执行（E077），需 binary-sign-tool selfSign；chmod 固定 660（E046）导致权限断言类测试无法通过"
- "OHOS ruby 3.4.5 IO.copy_stream 走 copy_file_range 返回 EBADF，测试环境用 preload 补丁回退读写循环"
- "上游 copyfile 硬编码 /usr/bin/install，本机仅有 /bin/install，补丁增加回退"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/rset-3.3.orig
  source_work_dir: /storage/Users/currentUser/builds/rset-3.3.work
  source_orig_hash: 5752987ba798b413
  source_work_hash: 16007e2e5f081648
  generated_at: '2026-10-03T09:17:54'
  patches_count: 2

patch_classification:
  - file: 0001-renv.awk.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-rutils.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
