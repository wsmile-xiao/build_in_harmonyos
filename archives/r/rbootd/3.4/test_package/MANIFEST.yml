# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rbootd/3.4
homepage: "https://git.kernel.org/pub/scm/linux/kernel/git/deller/rbootd.git"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: rbootd_3.4.tar.xz, sha256 8a6543af25237f6553e40c47bcc42edf8d743e6d37516611e4a06973c5913225)
upstream_test_audit:
  source_tarball: "rbootd_3.4.tar.xz"
  source_sha256: "8a6543af25237f6553e40c47bcc42edf8d743e6d37516611e4a06973c5913225"
  top_level_files:
    - Makefile          # 仅 rbootd/clean/all/install/rbootd.8.gz 目标, 无 check/test/TESTS 目标
    - README            # 项目说明文本
    - pcap.c            # Linux 抓包后端 (libpcap), 主实现源
    - bpf.c             # BSD BPF 后端 (Linux 分支不编译), 主实现源
    - conf.c            # 配置文件读取, 纯实现源
    - parseconf.c       # 配置解析, 纯实现源
    - rbootd.c          # 主程序 (getopt + daemon 主循环), 无 TEST()/TEST_F/def test_
    - rmpproto.c        # RMP 协议处理, 纯实现源
    - utils.c           # 辅助函数, 纯实现源
    - defs.h            # 公共定义与原型头
    - rmp.h             # RMP 协议结构头
    - rmp_var.h         # RMP 协议变长结构头
    - pathnames.h       # 路径常量头
    - rbootd.8          # man 手册
    - rbootd.service    # systemd 单元
    - skeleton          # 临时配置模板
    - debian/           # Debian 打包目录 (control/rules/copyright/changelog/init 等, 无 debian/tests)
    - etc-rbootd/       # 默认配置文件 (rbootd.conf)
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile check / test / TESTS / check_PROGRAMS 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "debian/tests (autopkgtest)"
    - "configure.ac / CMakeLists.txt / meson.build 测试声明"
    - "find . -name '*test*' (全树)"
  scan_result: "0 matches — 全树无 tests/ 目录, 无 debian/tests (autopkgtest); find 无测试源文件; Makefile 无 check/test 目标"
  make_check_output: "make check 无规则可执行 (No rule to make target 'check') — 上游未定义任何测试目标"
  reason: "rbootd 3.4 为系统守护进程, Debian native 源码包不含任何测试套件: 无 tests/ 目录、无 debian/tests、无测试源文件、无 check/test 目标。功能验证由 test_package 真实执行 rbootd 二进制 (getopt 启动路径) 与 OHOS 交叉构建属性校验完成"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质执行被测包的二进制
test_package_tests:
  - file: test.sh
    description: "功能测试: rbootd -d -Z 执行并 getopt 拒绝无效选项; OHOS 特有: 产物为 aarch64/musl OHOS ELF + 静态链接 libpcap (共 3 断言, 其中 OHOS 特有 2 项)"
    command: "bash test.sh"
  - file: conanfile.py
    description: "Conan test() 入口, 执行 test.sh 并输出 HMBS 机器证据标记 (test_package discovered=3/passedCount=3 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test.sh 的 3 个真实断言, 与 HMBS_TEST_PACKAGE_RESULT discovered=3 一致)
assertion_count: 3

# OHOS 特有测试用例数 (Test 2 + Test 3: OHOS aarch64/musl ELF 身份 + 静态 libpcap 链接)
ohos_specific_test_count: 2
