patches_applied:
  - "0001-Makefile.patch"
  - "0002-defs.h.patch"
  - "0003-rmpproto.c.patch"

knowledge_gained:
  - "Makefile 用 uname -s 判定平台; HarmonyOS 返回 'HarmonyOS' 而非 'Linux', 会落进 BSD 分支 (.include <bsd.prog.mk>) 直接报 missing separator; 补丁让 Linux 分支同时匹配 HarmonyOS"
  - "defs.h 在包含任何系统头之前先 include rmp.h (使用 u_int8_t/u_char/caddr_t); glibc 的 <sys/param.h> 传递提供 sys/types.h, OHOS/musl 的不提供, 需显式 #include <sys/types.h>"
  - "defs.h 的 BSD 原型宏 __P() 由 glibc 的 <sys/cdefs.h> 提供, OHOS/musl 未定义, 需补可移植回退定义"
  - "rmpproto.c 使用 legacy rindex(), musl libc 不导出该符号 (链接 undefined symbol), 改用可移植 strrchr()"
  - "OHOS worker 以 socket 作为 stdin 传给进程; 经 /bin/sh -> make -> /bin/sh 链继承该 socket 时 clang 静默退出 1 且不产出目标文件; 需 make ... < /dev/null > log 2>&1 并在 Python 侧回放日志"
  - "向自研 conanfile 的 self.run 传 cwd= 会触发 HMDFS getcwd 问题; 用命令内 cd 代替"
  - "rbootd 3.4 上游无测试套件: Makefile 仅 rbootd/clean/all/install 目标, 功能验证由 test_package 真实执行 rbootd 二进制完成"

