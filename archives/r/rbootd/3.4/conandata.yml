# conandata.yml — rbootd 3.4
# Official source: Debian native package rbootd 3.4 (the upstream project,
# git.kernel.org/pub/scm/linux/kernel/git/deller/rbootd.git, is packaged by
# Debian in native format, so deb.debian.org/debian/pool is the author's
# canonical release channel). sha256 verified against the 31584-byte tarball.

sources:
  url: "https://deb.debian.org/debian/pool/main/r/rbootd/rbootd_3.4.tar.xz"
  sha256: "8a6543af25237f6553e40c47bcc42edf8d743e6d37516611e4a06973c5913225"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "Accept HarmonyOS in the Makefile OS detection (uname -s returns HarmonyOS, not Linux)"
    patch_type: "portability"
  - patch_file: "patches/0002-defs.h.patch"
    patch_description: "Include <sys/types.h> for BSD types and add a portable __P() fallback for musl/OHOS libc"
    patch_type: "portability"
  - patch_file: "patches/0003-rmpproto.c.patch"
    patch_description: "Use portable strrchr() instead of the legacy rindex() (not provided by musl libc)"
    patch_type: "portability"
