software: rbootd
display: "rbootd"
description: "HP 工作站远程引导守护进程（Remote Boot Daemon）"
category: network
homepage: "https://git.kernel.org/pub/scm/linux/kernel/git/deller/rbootd.git"
license: BSD-4-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 以 uname -s 判定平台；HarmonyOS 返回值非 Linux，补丁让 Linux 分支同时匹配 HarmonyOS"
    - "defs.h 提前包含 <sys/types.h> 提供 BSD 类型 (u_int8_t/u_char/caddr_t)，OHOS/musl 的 <sys/param.h> 不再传递提供"
    - "defs.h 补 __P() 原型宏回退定义（glibc 由 <sys/cdefs.h> 提供，musl 无）"
    - "rmpproto.c 的 rindex() 改为可移植 strrchr()（musl 无 rindex）"
    - "依赖 libpcap/1.10.6，静态链接，从 Conan 依赖取 -I/-L/-l（dhcpdump/cdpr 先例）"
    - "命令行工具：软件级 commands.json 声明（R38）"
  common_dependencies:
    - libpcap

versions:
  "3.4":
    status: built
    build_date: "2026-10-01"
