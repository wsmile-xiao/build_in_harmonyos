# 版本级 manifest
# 文件位置: archives/r/ryu/2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0"

# 软件名
software: "ryu"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-12"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档）
  url: "https://github.com/ulfjack/ryu/archive/refs/tags/v2.0.tar.gz"

  # 源码校验和（设备上两次独立下载比对一致）
  sha256: "a362882dca2b692810aa1508b4fa16572590babd3db394442fb77c89bc1ce9b7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # 上游为 Bazel（BUILD 文件），无 configure/CMake 入口；
  # 配方按本仓 alac 0.0.7 先例以 export_sources 自带最小 CMakeLists.txt 编译
  # 上游默认 cc_library 目标 //ryu（d2s.c + f2s.c + ryu.h）
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_SHARED_LIBS=OFF（默认静态）"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 上游测试四维账本（R51/§10.1 口径）
# ============================================================

test_census:
  # 1. 上游源码静态声明总数（按 ryu/tests/BUILD 的 6 个 cc_test 目标内
  #    TEST( 宏逐个统计）
  n_static: 62
  # 2. 构建系统实际注册目标数（Bazel cc_test）
  n_registered_targets: 6
  # 3. 实际执行（设备上以 vendored gtest 编译 6 个测试可执行文件并全部运行，
  #    62/62 个原子用例均实际执行）
  n_executed: 62
  passed: 61
  failed: 1
  # 4. 未执行/跳过：0 个（无因资源/条件跳过项）；
  #    失败 1 项为 upstream generic_128 long double 布局问题，详见 notes.md
  skipped: 0
  # 新增消费者测试
  n_consumer_programs: 1
  n_consumer_assertions: 25

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 ryu v2.0 使用 Bazel（无 configure/CMake/Makefile），按 alac 0.0.7 先例以 export_sources 自带最小 CMakeLists.txt 编译上游默认 //ryu 目标"
  - "上游 ryu/tests 依赖 gtest，但 third_party/gtest 为单文件 amalgamation（gtest-all.cc + gtest_main.cc + gtest.h），无需外部 gtest 依赖即可真实运行上游测试"
  - "generic_128.c 的 long_double_to_fd128 硬编码 x86 80-bit 扩展精度布局（尾数 64 位+指数 15 位、符号 bit79）；aarch64 OHOS 的 long double 为 IEEE binary128 quad（sizeof=16、符号 bit127、1.0L 指数字段 16383 已探针实证）→ 该函数在 aarch64 上错误，属上游可移植性缺陷（与 OS 无关，aarch64 Linux 同样命中）"
  - "纯计算 C 库交叉编译至 OHOS aarch64 一次通过：CMake + CMakeToolchain，无任何平台补丁"
  - "包范围决策：generic_128 与 ryu_printf(d2fixed) 是上游 Bazel 中独立 cc_library，不属于默认 //ryu 目标；为避免在 aarch64 上发布静默出错的 long double API，包只含上游默认目标"

patch_generation:
  method: none
  patches_count: 0

# verify-build兼容字段
build_system: cmake
