# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# ryu v2.0 上游使用 Bazel 构建，ryu/tests/BUILD 注册 6 个 cc_test 目标，
# 共 62 个 gtest TEST 原子用例（逐个按 TEST( 宏静态统计）。

package: ryu/2.0
homepage: "https://github.com/ulfjack/ryu"

# 上游测试命令 (Bazel BUILD 注册)
upstream_check_command: "bazel test //ryu/..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（已在 OHOS aarch64 设备上用 vendored gtest 实际编译运行）
upstream_tests:
  - file: ryu/tests/d2s_test.cc
    source: ryu-2.0/ryu/tests/d2s_test.cc
    description: "gtest d2s double 最短表示转换（9 个 TEST 原子用例），设备实跑 9/9 通过"
    command: "./d2s_test"
  - file: ryu/tests/d2s_table_test.cc
    source: ryu-2.0/ryu/tests/d2s_table_test.cc
    description: "gtest d2s 查表路径（4 个 TEST 原子用例），设备实跑 4/4 通过"
    command: "./d2s_table_test"
  - file: ryu/tests/f2s_test.cc
    source: ryu-2.0/ryu/tests/f2s_test.cc
    description: "gtest f2s float 最短表示转换（9 个 TEST 原子用例），设备实跑 9/9 通过"
    command: "./f2s_test"
  - file: ryu/tests/d2fixed_test.cc
    source: ryu-2.0/ryu/tests/d2fixed_test.cc
    description: "gtest ryu_printf d2fixed 定长格式化（24 个 TEST 原子用例），设备实跑 24/24 通过"
    command: "./ryu_printf_test"
  - file: ryu/tests/generic_128_test.cc
    source: ryu-2.0/ryu/tests/generic_128_test.cc
    description: "gtest generic_128 通用 128 位实现（15 个 TEST 原子用例），设备实跑 14/15 通过，1 失败见 notes.md"
    command: "./generic_128_test"
  - file: ryu/tests/d2s_intrinsics_test.cc
    source: ryu-2.0/ryu/tests/d2s_intrinsics_test.cc
    description: "gtest d2s 内联算术辅助函数 header-only（1 个 TEST 原子用例），设备实跑 1/1 通过"
    command: "./d2s_intrinsics_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: d2s/f2s 最短表示断言（上游测试向量）+ buffered_n 返回长度 + d2s()/f2s() 堆分配 API + strtod/strtof 位级往返"
    command: "./test_ryu"

# 测试断言总数 (消费者测试显式断言数)
assertion_count: 25
