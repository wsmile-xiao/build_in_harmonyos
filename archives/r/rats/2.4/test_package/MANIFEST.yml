# test_package/MANIFEST.yml — rats 2.4
# CI L0e 要求本文件存在；按 TEST_QUALITY_SPEC §4.3 声明上游测试来源。

package: rats/2.4
homepage: "https://github.com/andrew-d/rough-auditing-tool-for-security"

# ── 上游测试审计 ────────────────────────────────────────────────────────
# RATS 上游无自动化测试套件（无 test/、tests/ 目录，Makefile 仅有 `clean`/
# `distclean`/`major`/`minor`，无 `check`/`TESTS`/`check_PROGRAMS`）。
upstream_tests_exist: false
upstream_test_audit:
  - source: "rats 2.4 source tree"
    reason: "No test/ or tests/ directory is present."
  - source: "Makefile.in"
    reason: "Defines only bin_PROGRAMS (rats), clean, distclean, major, minor; there is no check target or TESTS."
  - conclusion: "Upstream 2.4 provides no automated tests; the adaptation adds an installed-binary end-to-end consumer test (audit a crafted C sample and a clean file)."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── test_package 自带验证（消费者视角，端到端） ─────────────────────────
test_package_tests:
  - file: test_rats.sh
    description: >-
      Run packaged rats --help (validates the signed ELF + runenv), then audit a
      crafted insecure C sample and require at least one vulnerability finding
      (validates expat-parsed rats-*.xml DB at DATADIR + the C scanner), then
      audit a trivially clean file and require no High/Medium finding.
    command: "sh test_rats.sh <package>/bin/rats"

test_scenario_count: 3
assertion_count: 3
assertion_count_note: >-
  1) rats --help exits 0; 2) insecure sample yields a finding
  (strcpy|strcat|sprintf|High|Medium|Low); 3) clean file yields no High/Medium
  finding. On the Linux build host can_run() is False (cross-compiled OHOS ELF)
  so the script is exercised on-device where can_run() is True.
hardware_playback_required: false
