# 版本级 manifest
# 文件位置: archives/r/rats/2.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4"

# 软件名
software: "rats"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "autotools"

# 测试结果统计（供 PR body 自动化统计；实测消费者端到端断言数）
test_passed: 3
test_failed: 0

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/andrew-d/rough-auditing-tool-for-security/archive/4ba54ce278e9fb004d978e924fd63c29e449ca81.tar.gz"

  # 源码校验和
  sha256: "04da6f13208582136443c02a5cb675db98e6300324279bacfe6502886eeab82f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - expat/2.8.4
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "RATS 2.4 源码自带已生成 configure + Makefile.in（无 Makefile.am），构建期不需要 automake；lexers 已预生成为 lex.yy*.c，不需要 flex"
  - "Makefile.in 编译规则仅引用 $(CFLAGS) 不引用 $(CPPFLAGS)，expat 的 include 路径须并入 CFLAGS 才能被 vuln_db.c 找到 expat.h"
  - "OHOS 交叉构建须显式 --host=aarch64-unknown-linux-ohos --build=x86_64-pc-linux-gnu 强制 cross 模式，否则 conan-verify 同 profile 下 autoconf 会尝试运行探针 ELF"
  - "AutotoolsToolchain 注入的 --prefix 可能为 /，须在 configure 末尾显式追加 --prefix={package_folder} 覆盖"
