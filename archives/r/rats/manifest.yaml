software: rats
display: "rats"
description: "RATS - Rough Auditing Tool for Security, a C/C++ source-code security audit scanner"
category: security
homepage: "https://github.com/andrew-d/rough-auditing-tool-for-security"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "老式 autotools 项目，上游已生成 configure + Makefile.in（无 Makefile.am，无需 automake）；lexers 已预生成，无需 flex"
    - "expat include 路径须并入 CFLAGS（Makefile.in 编译规则只用 $(CFLAGS)，不引用 $(CPPFLAGS)）"
    - "OHOS 交叉构建须显式 --host=aarch64-unknown-linux-ohos --build=x86_64-pc-linux-gnu 强制 cross 模式，并显式 --prefix 覆盖工具链注入的 /"
    - "bin/rats 需 OHOS ELF 自签；运行期依赖 expat/2.8.4（libexpat.so 经 package_info 注入 LD_LIBRARY_PATH）"
  common_dependencies:
    - expat

versions:
  "2.4":
    status: built
    build_date: "2026-09-29"
