# conandata.yml — rsyslog-cisco 8.2604.0 (rsyslog Cisco parser modules:
# pmciscoios + pmcisconames)
#
# Primary source: official rsyslog website (same upstream tarball as the sibling
# rsyslog/8.2404.0 and rsyslog-testing/8.2604.0 recipes; only the packaged module
# scope differs).
# Fallback: Yocto Project source mirror, which hosts the pristine upstream
# tarball byte-identical to www.rsyslog.com (sha256 verified locally).
# www.rsyslog.com serves without Content-Length and transfers from the CI
# network class occasionally truncate; conan verifies sha256 per URL and
# falls through to the next mirror automatically.

sources:
  url:
    - "https://www.rsyslog.com/files/download/rsyslog/rsyslog-8.2604.0.tar.gz"
    - "https://downloads.yoctoproject.org/mirror/sources/rsyslog-8.2604.0.tar.gz"
  sha256: "2a04b1cd6f0a5e2b60eec231acce3cf9927c4ed02bc5fbbe5dc4c35fcf887b64"

# Patches (applied in order by apply_conandata_patches):
# - 0001: config.guess HarmonyOS recognition — the shipped script (dated 2022)
#   cannot classify uname -s = "HarmonyOS", so configure aborts with
#   "cannot guess build type" (E007); after the patch config.guess reports
#   aarch64-unknown-linux-ohos.
# - 0002: config.sub linux-ohos kernel-os combination acceptance (companion
#   of 0001 for the --host=aarch64-linux-ohos triple).
# - 0003: configure E011/HMDFS fix — the temp-dir block uses
#   "umask 077 && mktemp -d", whose directories are not writable under
#   HMDFS group-permission semantics; relax the umask to 000 (same
#   approach as the libestr/libfastjson/rsyslog-8.2404.0 recipes).
patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "0001 config.guess recognize HarmonyOS aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "0002 config.sub accept linux-ohos kernel-os combination"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "0003 configure E011 HMDFS fix umask 077 to 000 in tmp-dir block"
    patch_type: "portability"
