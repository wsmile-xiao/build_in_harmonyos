# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 config.guess/config.sub 不识别 HarmonyOS（uname -s = HarmonyOS）→ 补丁补齐 aarch64-unknown-linux-ohos（E007）"
  - "configure 临时目录块 umask 077 && mktemp -d 在 HMDFS 组权限语义下不可写 → 放宽为 umask 000（E011）"
  - "autotools 模块 `.so` 会被 $(LIBS) 带入无关 DT_NEEDED（libz）→ 仅对模块目标显式传 LIBS= 清空"
  - "rsyslog parser 模块（MODULE_TYPE_PARSER）为运行时插件：不依赖本体包、cpp_info.libs 为空、无 commands.json"
  - "ParseTIMESTAMP3164 成功路径消费 17 字节（15 字符时间戳 + ': '），游标偏差会把 parse2 误判为 COULD_NOT_PARSE(-2160)"
  - "parser 入口 ABI：GetParserName(uchar **ppSz) 带出参，按 void 调用会 SIGSEGV"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/rsyslog-cisco-8.2604.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/rsyslog-cisco-8.2604.0.work
  source_orig_hash: cbd9f5dc96ed3622
  source_work_hash: 98e4b545d0371cb2
  generated_at: '2026-09-27T20:09:37'
  patches_count: 3

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'config.guess 平台识别分支，仅在 HarmonyOS 上生效（其他平台走原分支，行为不变）'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'config.sub 新增 linux-ohos 组合识别，仅 HarmonyOS 三元组命中（其他组合不受影响）'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'configure 临时目录块 umask 放宽，任何平台均可安全应用（仅影响临时目录权限位）'
