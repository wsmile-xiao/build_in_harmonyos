# 软件级 manifest — reptyr（ARCHIVE-SPEC v3.0 人读索引）

software: reptyr
display: "reptyr"
description: "把一个正在运行的进程重挂到新终端的小工具（基于 ptrace 夺取进程的控制终端）"
category: utility
homepage: "https://github.com/nelhage/reptyr"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 用 uname -s 选择平台后端，OHOS 返回 HarmonyOS：补丁令其与 Linux 同分支（E007 家族）"
    - "musl 系系统 sockaddr_storage 双重定义：在包含 linux 头文件期间以 __GLIBC__ 守卫改名（E091 同类）"
    - "OHOS 无 install(1)：由 conan package() copy() 显式安装"
    - "平台边界：OHOS 对非特权进程禁用 ptrace（ATTACH/SEIZE/TRACEME 全 EPERM，进程带 seccomp 过滤器），reptyr 的附加功能（PID/-T/-s）不可用；-l/-L 的 pty 管理功能正常"
  common_dependencies: []

versions:
  "0.10.0":
    status: built
    build_date: "2026-09-27"
    conan_ref: "reptyr/0.10.0"
