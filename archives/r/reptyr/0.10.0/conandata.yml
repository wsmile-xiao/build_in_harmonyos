patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "Makefile: select the Linux backend for HarmonyOS as well — uname -s returns HarmonyOS on OHOS, so the Linux platform objects were omitted and the link failed; pure platform detection, no platform macro (knowledge E007 family)"
    patch_type: "portability"
  - patch_file: "patches/0002-platform-linux-linux.h.patch"
    patch_description: "platform/linux/linux.h: avoid struct sockaddr_storage redefinition between <linux/socket.h> (pulled via <linux/net.h>) and <sys/socket.h> on musl-based systems such as OHOS; kernel-side struct renamed while the linux headers are included, glibc builds unaffected (knowledge E091)"
    patch_type: "portability"
