knowledge_gained:
  - "E007 家族（手写 Makefile 变体）：Makefile 以 $(shell uname -s) 选择平台后端，OHOS 返回 HarmonyOS 不匹配 Linux 分支，platform/linux/*.o 未编译、链接失败；补丁让 HarmonyOS 与 Linux 同分支（knowledge_ref: E007）"
  - "E091（同类处置）：musl 系系统上 <linux/net.h> 经 <linux/socket.h> 定义 struct sockaddr_storage，与随后 <sys/socket.h> 冲突（-Werror 直接失败）；在包含 linux 头文件期间用 __GLIBC__ 守卫改名；accel-ppp 先例形态（knowledge_ref: E091）"
  - "OHOS 无 install(1)：上游 Makefile 的 install 目标不可用，conan package() 用 copy() 显式安装产物（knowledge_ref: E188）"
  - "平台能力边界（本任务核心发现）：OHOS 对非特权进程禁用 ptrace——父→子/祖父→孙 PTRACE_ATTACH 与 SEIZE、PTRACE_TRACEME、process_vm_readv 全部 EPERM（进程 Seccomp: 2 + 1 filter，CapEff 无 CAP_SYS_PTRACE）；PR_SET_PTRACER 返回 EINVAL；/proc/sys/kernel/yama/pdebug_scope 读取 ENOSYS。ptrace 类工具（debugger/tracer/reptyr）的核心功能在该平台被系统策略阻断，补丁无法绕过（knowledge_ref: DRAFT-10103-reptyr-ptrace-capability-boundary，本 PR 新增路径 B 草稿）"
  - "上游测试 2 用例（basic.py / tty-steal.py）在该边界失败 0/2；R51 由 test_package 18 条消费侧断言覆盖可用行为面（pty 分配、参数校验、错误报告）（knowledge_ref: DRAFT-10103-reptyr-ptrace-capability-boundary）"
  - "reptyr -l 在 stdin 为 EOF 时忙等（上游 read()==0 未处理），自动化需看护/超时（reference: archives/r/reptyr/0.10.0/test_package/test_reptyr.sh 的看护收尾）"

