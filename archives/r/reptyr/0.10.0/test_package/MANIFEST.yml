# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）

package: reptyr/0.10.0
homepage: "https://github.com/nelhage/reptyr"

# 上游测试命令（用于 make -n / pytest 清点）
upstream_check_command: "make test PYTHON_CMD=python3（Makefile test 目标；无 check 目标）"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成：上游测试需要 PTRACE_ATTACH（OHOS 上非特权进程被拒 EPERM）与真实终端，
# 无法在 conan create 的无终端环境里通过；已在真机单独执行并如实记录结果
upstream_test_in_build: false
upstream_test_command: "make test PYTHON_CMD=python3（真机执行：2 个用例，0 通过，2 失败——平台边界）"

# 上游测试程序：2 个（test/basic.py、test/tty-steal.py），依赖 pexpect（python-prctl 可选）
upstream_tests:
  - program: test/basic.py
    description: "pexpect 驱动 BasicTest：victim 进程被 reptyr 重挂到新 pty 后继续应答（hello/world）"
    result_on_ohos: "FAIL — preflight PTRACE_ATTACH 被拒 EPERM（见 reports/upstream-basic.log）"
    technical_reason: "OHOS 对非特权进程禁用 ptrace：本机探针显示 ATTACH/SEIZE/TRACEME 全部 EPERM（进程 Seccomp 过滤器生效，CapEff 无 CAP_SYS_PTRACE）"
  - program: test/tty-steal.py
    description: "pexpect 驱动 TtyStealTest：reptyr -T 夺取 victim 的整个终端会话（含 PR_SET_PTRACER 可选分支）"
    result_on_ohos: "FAIL — 同一 EPERM 边界（victim 程序的 PR_SET_PTRACER 返回 EINVAL，证据见 reports/upstream-basic.log 与 reports/ptrace-capability-probe.txt）"
    technical_reason: "同 basic.py；-T 模式同样以 PTRACE_ATTACH 为入口"

# R51 上游测试清点证据（适配前申报）
upstream_test_inventory:
  tests_directory: true
  test_files: ["test/basic.py", "test/tty-steal.py", "test/util.py", "test/victim.c", "test/matrix.sh", "test/requirements.txt"]
  makefile_test_targets: "make test 运行 basic.py + tty-steal.py；无 make check 目标"
  make_check_cases: 0
  upstream_registered_cases: 2
  evidence:
    - "Makefile: test: reptyr test/victim PHONY → $(PYTHON_CMD) test/basic.py; $(PYTHON_CMD) test/tty-steal.py（PYTHON_CMD ?= python2，basic.py 兼容 py3）"
    - "test/requirements.txt: pexpect + python-prctl>1.6（prctl 仅 tty-steal.py 可选分支使用，缺失时打印提示继续）"
    - "真机执行 python3 test/basic.py 与 python3 test/tty-steal.py（pexpect 4.9.0）：两者均在 preflight 阶段失败，errno EPERM（日志见 reports/upstream-*.log）"
    - "make check 无此目标（上游未注册；matrix.sh 仅做 32/64 位构建矩阵，均以 make test 为入口）"

# test_package 中自带的测试（消费者视角验证，R51 平台受限场景）
test_package_tests:
  - file: test_reptyr.sh
    description: >-
      18 条 TAP 断言，真实执行已安装二进制：PATH 可见性；-v/-h 退出码与输出；
      缺 pid/非数字 pid/未知选项的参数校验与报错；不存在 pid 的附加报错
      （No such process）；-l 新建 pty 对并播报 slave 路径；-L 在新建 pty slave 上
      运行子命令、导出 REPTYR_PTY（与播报路径一致）、转发子进程 stdout、
      子进程确认 slave 为字符设备
    command: "sh test_reptyr.sh"

# 测试断言总数（= test_reptyr.sh 输出的 TAP 行数）
assertion_count: 18
