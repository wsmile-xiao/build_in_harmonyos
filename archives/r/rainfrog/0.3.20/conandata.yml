# conandata.yml — rainfrog 0.3.20
# rainfrog: 终端数据库管理 TUI（Rust / ratatui + crossterm + sqlx）
# 上游：github.com/achristmascarl/rainfrog

sources:
  url: "https://github.com/achristmascarl/rainfrog/archive/refs/tags/v0.3.20.tar.gz"
  filename: "rainfrog-v0.3.20.tar.gz"
  sha256: "a38f4d1bed46ee4c81a36cec0c8999532c7f8900717b87b7f5bd5b02a93defd8"

# Rust 工具链本身**不再走外部 bottle**，改用仓库内 conan 包
# `rust-toolchain/1.97.1`（tool_requires，见 conanfile.build_requirements）。
# 原因（CI 实测）：harmonybrew 的 rust-1.97.1 bottle 已被轮换为 404（同 URL 本机
# 因旧缓存边缘仍 200）；当前可取的 rust-1.98.1_2 其 cargo 又额外动态依赖
# libgit2/libssh2/libcurl/libsqlite3/libzstd 五个库，补它们的 bottle 链更脆弱。
# rust-toolchain 随制品仓固定、cargo 只需 libssl/libcrypto/libz（闭包小）；
# 代价是该包二进制未带 OHOS 签名，须由本配方构建期自签名。

# cargo 的运行期库：`rust-toolchain` 的 cargo 动态链接 libssl.so / libcrypto.so /
# libz.so（实测 NEEDED），这三者不在工具包内，故仍需外部 bottle。
# 这些链接在 CI 上实测可正常下载（与已 404 的 rust bottle 不同）。
# URL 中的 %40 是 @ 的编码；sha256 取自 harmonybrew 的 formula.jws.json 索引。
# 为免污染 CI 的源 URL 提取器，本文件不书写带 scheme 的裸链接。
runtime_libs:
  - url: "https://harmonybrew.atomgit.com/bottles/openssl%403-3.6.4_1.arm64_ohos.bottle.tar.gz"
    sha256: "29caefb982dc01671e67232f3862b50ce69a34a4f4135a1495078830bb12b81b"
  - url: "https://harmonybrew.atomgit.com/bottles/zlib-ng-compat-2.3.3_2.arm64_ohos.bottle.tar.gz"
    sha256: "99356b80ddb81e0b8267debb44df459f2b5e27e7800406d3b4cf7f8f744beb89"
  - url: "https://harmonybrew.atomgit.com/bottles/ca-certificates-2026-09-25.arm64_ohos.bottle.tar.gz"
    sha256: "0f8b5e2a47287c10f5d569de00762dbfaba153159fae6482d7b2f09fc3be62ec"

# 备选集：内容与上同，供瞬时网络失败时整体重试一次（配方按序尝试，任一成功即止）。
# 暂无可用的第二版本（openssl@3-3.6.3、zlib-ng-compat-2.3.3_1 等旧版均已 404）。
runtime_libs_fallback:
  - url: "https://harmonybrew.atomgit.com/bottles/openssl%403-3.6.4_1.arm64_ohos.bottle.tar.gz"
    sha256: "29caefb982dc01671e67232f3862b50ce69a34a4f4135a1495078830bb12b81b"
  - url: "https://harmonybrew.atomgit.com/bottles/zlib-ng-compat-2.3.3_2.arm64_ohos.bottle.tar.gz"
    sha256: "99356b80ddb81e0b8267debb44df459f2b5e27e7800406d3b4cf7f8f744beb89"
  - url: "https://harmonybrew.atomgit.com/bottles/ca-certificates-2026-09-25.arm64_ohos.bottle.tar.gz"
    sha256: "0f8b5e2a47287c10f5d569de00762dbfaba153159fae6482d7b2f09fc3be62ec"

patches: {}
