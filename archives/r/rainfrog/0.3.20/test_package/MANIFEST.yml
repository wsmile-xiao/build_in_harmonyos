# test_package/MANIFEST.yml
# 上游测试声明文件（CI 门禁 build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: rainfrog/0.3.20
homepage: "https://github.com/achristmascarl/rainfrog"

# 上游测试命令（本配方 build() 内真实执行）
upstream_check_command: "cargo test --release --locked --no-default-features --tests"
upstream_test_in_build: true
upstream_test_command: "cargo test --release --locked --no-default-features --tests"

# ── 上游测试存在性审计（2026-09-27，对本 PR 取得的 v0.3.20 源码树核验）──────
# 上游**含**测试，但**不是**独立 tests/ 目录，而是 `src/**/*.rs` 内的内联单元测试：
#   · 顶层 `tests/` 目录：**不存在**
#   · `#[test]` 出现次数：**69**（`grep -rn '#\[test\]' src --include=*.rs`）
#   · `#[tokio::test]`：0
# 故测试经 `cargo test`（bin 单元测试）执行；`--tests` 限定测试目标。
upstream_tests_exist: true
upstream_test_audit: |
  rainfrog v0.3.20 ships no top-level tests/ directory; its tests are inline
  #[test] unit tests inside src/**/*.rs. A grep of the extracted v0.3.20 tree
  counts 69 occurrences of `#[test]` (0 of `#[tokio::test]`); `cargo test`
  actually executes 67 of them (the difference comes from cases excluded by
  cfg or sitting in doc comments), and the reported figures are the measured
  ones, not the grep count.
  MEASURED (2026-09-27, local `conan create`):
    test result: ok. 67 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out
    HMBS_UPSTREAM_TEST_RESULT={"status":"passed","framework":"cargo-test",
      "discovered":67,"executed":67,"passed":67,"failed":0,"skipped":0}
  The suite is run in build() via
  `cargo test --release --locked --no-default-features --tests`; nothing is
  skipped or exempted, and --no-default-features only drops the duckdb/arboard
  optional features (they do not gate tests).

upstream_tests:
  - file: "src/**/*.rs（内联 #[test] 单元测试，实测执行 67 项）"
    source: "rainfrog-0.3.20/src/"
    description: "上游内联单元测试（grep #[test] 69 处，实跑 67 项）；无顶层 tests/ 目录"
    command: "cargo test --release --locked --no-default-features --tests"
    run_2026_09_27:
      executed: 67
      passed: 67
      failed: 0
      skipped: 0
      pass_rate: "67/67 = 100.0%"

# test_package 中自带的测试（消费者视角）
test_package_tests:
  - file: test_rainfrog.sh
    description: >-
      真实执行交付的 bin/rainfrog 并断言：①--version 报出 0.3.20；
      ②--help 列出 query 子命令；③query --help 可用（命令树不止顶层）；
      ④未知参数以非零退出（错误路径未被吞掉）
    command: "sh test_rainfrog.sh <pkg_dir>"

assertion_count: 4
