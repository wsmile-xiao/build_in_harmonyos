# 版本级 manifest — rainfrog 0.3.20
# 位置: archives/r/rainfrog/0.3.20/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: rainfrog
version: "0.3.20"
status: built
build_system: cargo
build_date: "2026-09-27"

source:
  url: "https://github.com/achristmascarl/rainfrog/archive/refs/tags/v0.3.20.tar.gz"
  sha256: "a38f4d1bed46ee4c81a36cec0c8999532c7f8900717b87b7f5bd5b02a93defd8"
  tar_format: tar.gz

build:
  system: cargo
  dependencies: []            # 无 conan 依赖：Rust 侧依赖由 crates.io（rsproxy 镜像）解析
  configure_options:
    - "cargo build --release --locked --no-default-features"
    - "CC/CXX 取自 Conan tools.build:compiler_executables（回退 /data/service/hnp/bin/clang[++]）"
    - "RUSTFLAGS=-C linker=<Conan C compiler>；CARGO_BUILD_JOBS=1（规避设备上的 ETXTBSY 类间歇失败）"
    - "--no-default-features：上游 default = [duckdb, arboard]，前者是 bundled C++ 全量构建、后者需 Wayland/X11 剪贴板，均与「数据库 TUI 可运行」无关"
    - "OHOS 工具链：tool_requires rust-toolchain/1.97.1（仓库内 conan 包，rust-lang 官方 dist，随制品仓固定、不依赖外部 CDN）"
    - "该包二进制未带 OHOS 签名，构建期用 binary-sign-tool 逐个自签名（cargo / rustc / rustc 会 dlopen 的 librustc_driver-*.so）"
    - "签名副本搬离包目录后 rustc 推导不到 sysroot（E0463 can't find crate for `std`）→ 以 --sysroot=<包目录> 显式指定，~890MB 只读负载留在包内不动"
    - "运行期库（cargo 动态依赖 libssl/libcrypto/libz）：SHA256 固定的 Harmonybrew bottle（openssl@3 3.6.4_1 + zlib-ng-compat 2.3.3_2 + ca-certificates 2026-09-25）"

patches_applied: []

test_results:
  type: automated
  total: 67
  passed: 67
  failed: 0
  skipped: 0
  reason: "本机 conan create 实测：cargo test --release --locked --no-default-features --tests 报 test result: ok. 67 passed; 0 failed; 0 ignored；test_package 4/4 断言通过"

test_results_passed: 67
test_results_failed: 0

knowledge_gained:
  - "rainfrog 0.3.20 要求 rust-version 1.88 / edition 2024；rust-toolchain/1.97.1（conan 工具包）满足要求"
  - "上游 default features = [duckdb, arboard]：duckdb 为 bundled 特性（内嵌 C++ 全量构建）+ arboard 依赖 Wayland/X11 剪贴板，二者均与「数据库 TUI 在 OHOS 运行」无关，适配时以 --no-default-features 关闭"
  - "sqlx 以 tls-rustls 配置（纯 Rust TLS）→ 本适配不依赖 OpenSSL 动态库做 TLS"
  - "★ 工具链的 cargo 动态链接 libssl.so / libcrypto.so / libz.so（rust-toolchain 的 cargo 实测 NEEDED 含此三者），故仍须提供 openssl / zlib / 根证书；缺失时报 Error loading shared library libssl.so；rustc 另需 librustc_driver-*.so（同包内）"
  - "★ Harmonybrew 的 rust bottle 会轮换：CI 实测 rust-1.97.1 已 404（同 URL 本机命中旧缓存边缘仍 200），而当前可取的 rust-1.98.1_2 其 cargo 又额外动态依赖 libgit2/libssh2/libcurl/libsqlite3/libzstd 五库 —— 故 Rust 工具链改走仓库内 rust-toolchain/1.97.1 包，彻底去掉该 CDN 依赖"
  - "★ rust-toolchain 包的二进制是 rust-lang 官方 dist，未带 OHOS 签名：直接 exec 报 Permission denied（errno 13，与 mode 位/路径无关）；自签名后 cargo/rustc 正常工作（实测 cargo 1.97.1 / rustc 1.97.1）"
  - "★ 本机 /storage/Users/currentUser/usr/local/bin/{cargo,rustc} 的权限位看似可执行（0o750、组 file_manager），os.access(X_OK) 返回 True，但构建 uid 实际 exec 报 Permission denied —— 工具链可用性检测必须用「实执行 + 查退出码」，不能用 os.access（照抄 alass 的 os.access 写法会让 conan create 直接崩在 PermissionError，而不会退到 bottle 引导）"
  - "★ alass/2.0.0 conandata 里那 4 个 bottle URL 中，openssl@3-3.6.3 / zlib-ng-compat-2.3.3_1 / ca-certificates-2026-08-13 均已 404（版本过期）；正确来源是 Harmonybrew 权威索引 https://harmonybrew.atomgit.com/api/formula.jws.json 的 payload 字段（当前版本：openssl@3 3.6.4_1 / zlib-ng-compat 2.3.3_2 / ca-certificates 2026-09-25）"
  - "bottle 内的 bin/cargo 是包装脚本，硬编码指向 .harmonybrew/Cellar/rust/<ver>/bin/cargo.real（解包位置无此路径）→ 引导逻辑应直接用 bin/cargo.real，不要走包装脚本"
  - "上游测试为 src/**/*.rs 内联 #[test]（无顶层 tests/ 目录）：grep #[test] 计数 69，而 cargo test 实际执行 67（差值来自被 cfg 排除/文档注释中的用例）——申报应以实跑计数为准"
  - "上游 CLI 面只有 edit 与 help 两个子命令；TUI 是无子命令时的默认行为，不存在 query 子命令（首版 test_package 曾按 query 断言，实测 rc=2 失败）"
  - "--version 实测输出 rainfrog 0.3.20-VERGEN_IDEMPOTENT_OUTPUT (2026-09-27)：源码 tarball 无 git 仓库，vergen 取不到 git 描述而落到占位段；断言应只匹配核心版本号 0.3.20 子串"
