# test_package/MANIFEST.yml
# RetroArch 1.22.2 (OpenHarmony PC)
#
# Upstream ships a libcheck-based unit-test suite for its bundled
# libretro-common runtime under libretro-common/test/, driven by
# libretro-common/Makefile.test. The suites are NOT wired into the normal
# build upstream and have bit-rotted; patch 0005 repairs them exactly as
# upstream later did, and the recipe's build() compiles and *executes* all
# five suites (127 checks). test_package then smoke-tests the packaged
# binary itself.

package: retroarch/1.22.2
homepage: https://www.retroarch.com

upstream_tests_exist: true
upstream_test_audit: >-
  libretro-common/test/{hash,lists,queues,string,utils}/test_*.c, 5 libcheck
  suites driven by libretro-common/Makefile.test; never built by the normal
  RetroArch build.
upstream_check_command: "make -C libretro-common -f Makefile.test"
upstream_test_in_build: true
upstream_test_command: "conanfile build() -> clang <suite>.c ... -lcheck; run each suite binary"
upstream_suites: 5
upstream_test_count: 127
upstream_passed: 127
upstream_failed: 0
upstream_errors: 0

upstream_tests:
  - suite: test_hash
    file: libretro-common/test/hash/test_hash.c
    checks: 3
    passed: 3
    failed: 0
  - suite: test_linked_list
    file: libretro-common/test/lists/test_linked_list.c
    checks: 89
    passed: 89
    failed: 0
  - suite: test_generic_queue
    file: libretro-common/test/queues/test_generic_queue.c
    checks: 16
    passed: 16
    failed: 0
  - suite: test_stdstring
    file: libretro-common/test/string/test_stdstring.c
    checks: 16
    passed: 16
    failed: 0
  - suite: test_utils
    file: libretro-common/test/utils/test_utils.c
    checks: 3
    passed: 3
    failed: 0

test_package_tests:
  - file: test_retroarch.sh
    description: >-
      运行安装后的 retroarch 二进制：--version / --help / --features 输出检查，
      以及未知选项必须非零退出（消费者视角）
    command: 'RETROARCH_BIN="<pkg>/bin/retroarch" sh test_retroarch.sh'

test_files:
  - path: "test_package/test_retroarch.sh"
    test_type: "consumer"
    assertion_count: 4
    description: "packaged binary version/help/features + argument-validation error path"

# R40: RetroArch 是图形/多媒体前端，本包为无头、无 GPU 目标构建；
# 消费者测试仅覆盖 CLI 表面——「适配完整性需人工确认」：
# 加载 libretro 核心并渲染需要 OHOS 上尚不存在的 GPU/音频后端。
manual_verification_required: true
manual_verification_note: >-
  加载核心渲染画面、音频输出与输入子系统需 GPU/音频后端（平台不可行级），
  待后续提供后人工确认；当前自动化覆盖为编译链接 + 无头 CLI + 上游 127 项单测。

test_package_test_count: 1
consumer_assertion_count: 4
