knowledge_gained:
  - "quickbuild 以 `uname -s` 判平台：HarmonyOS 需并入 Linux 分支，否则落 Win32 并因缺 windres 中止"
  - "OHOS bionic 无 pthread 取消族；可选线程特性用 HAVE_PTHREAD_CANCEL 守卫"
  - "内置 glslang 已有 __ANDROID__ 跳过 pthread 取消清理的分支，OHOS 可直接并入"
  - "上游 libretro-common libcheck 套件在 tag 上从未编译、已腐化（3 参 string_replace_substring、NULL 传入 non-NULL-only 叶函数）；1.22.2 之后上游才修"
  - "bionic tmpnam() 硬编码 P_tmpdir=/tmp，OHOS /tmp 只读；测试临时文件应走 TEMP/TMPDIR"
  - "无头最小 profile：关闭 GPU/音频/网络后端仍可完整编译链接出可用 retroarch"
