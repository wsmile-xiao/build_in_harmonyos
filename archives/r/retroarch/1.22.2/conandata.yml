sources:
  url: "https://github.com/libretro/RetroArch/archive/refs/tags/v1.22.2.tar.gz"
  filename: "RetroArch-1.22.2.tar.gz"
  sha256: "245ef18c8fa8fbd9fbb5eb25cf43e17c6aace2f95c1ed99873cbd794012bb232"

patches:
  - patch_file: "patches/0001-ohos-recognize-harmonyos-as-linux.patch"
    patch_description: "quickbuild: treat uname -s 'HarmonyOS' as Linux instead of Win32"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-guard-pthread-cancellation.patch"
    patch_description: "guard optional IIO illuminance-sensor pthread cancellation (absent in OHOS bionic)"
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-glslang-pthread-cancellation.patch"
    patch_description: "bundled glslang: skip pthread cancellation cleanup on OHOS, as already done for Android"
    patch_type: "portability"
  - patch_file: "patches/0004-ohos-string-hex-single-char.patch"
    patch_description: "libretro-common: string_hex_to_unsigned must accept single-character hex (backport of upstream fix)"
    patch_type: "bugfix"
  - patch_file: "patches/0005-ohos-portable-libretro-common-tests.patch"
    patch_description: "libretro-common test suites: make the never-built suites compile and run (upstream rot + OHOS read-only /tmp)"
    patch_type: "portability"
