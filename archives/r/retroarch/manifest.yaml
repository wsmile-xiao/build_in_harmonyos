software: retroarch
display: "RetroArch"
description: "libretro API 的官方参考前端：模拟器/游戏前端，支持大量 libretro 核心、着色器、回放与成就系统"
category: emulator
homepage: "https://www.retroarch.com"
license: GPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "上游自研 quickbuild（configure + Makefile）以 `uname -s` 判平台；HarmonyOS 返回 'HarmonyOS' 落到 Win32 分支并中止，补丁 0001 将其按 Linux（musl/bionic 用户态）处理"
    - "OHOS bionic 无 pthread 取消（pthread_cancel/setcancelstate/setcanceltype）；补丁 0002 守卫可选 IIO 光照传感器线程、补丁 0003 让内置 glslang 复用既有 __ANDROID__ 分支"
    - "补丁 0004 回移上游 1.22.2 之后才修的单字符十六进制解析缺陷（string_hex_to_unsigned(\"a\") 返回 0）"
    - "libretro-common 的 libcheck 单测上游从未纳入构建、已腐化；补丁 0005 按上游后续修复方式修好（陈旧 3 参 API 调用、NULL 传入 non-NULL-only 叶函数），并把临时文件改走 TEMP/TMPDIR（OHOS 无可写 /tmp）"
    - "以无头/无 GPU 目标的最小 profile 构建（关闭 vulkan/opengl/egl/x11/wayland/sdl/alsa/pulse/ffmpeg/networking/cheevos 等），图形/音频后端由运行期加载的核心选择"
    - "命令行应用，软件级提供 commands.json（R38）"
  common_dependencies:
    - "check/0.15.2（仅用于构建并执行上游 libretro-common 单测，不链接进产物）"

versions:
  "1.22.2":
    status: built
    build_date: "2026-10-05"
    conan_ref: "retroarch/1.22.2"
    path: "archives/r/retroarch/1.22.2"
