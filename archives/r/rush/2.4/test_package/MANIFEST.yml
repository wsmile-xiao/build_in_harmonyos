# test_package/MANIFEST.yml — rush 2.4
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。

package: rush/2.4
homepage: "https://www.gnu.org/software/rush/"

upstream_check_command: "make check"
upstream_tests_exist: true
upstream_test_audit: "rush 2.4 (GNU) 使用 Automake testsuite：tests/testsuite.at 为入口，tests/ 下 41 个 .at 文件 + tests/legacy/ 下 20 个，共 79 个用例分属 10 个 AT_BANNER 组（Base / Simple Conditions / Complex Conditions / Transformations / Rule attributes / Environment / Features / Flow control / Includes / Legacy config）。configure.ac 声明 AC_CONFIG_TESTDIR，Makefile.am 声明 TESTSUITE_AT 与 check-local。"

upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  - name: testsuite
    file: tests/testsuite.at
    source: rush-2.4/tests/
    description: "Automake testsuite：79 用例 / 10 个 AT_BANNER 组；tests/ 下 41 个 .at（50 个 AT_SETUP）+ tests/legacy/ 下 20 个"
    command: "make check"
    executed: true
    result: "79 run / 10 passed (lex 组，纯配置解析) / 69 failed"
    failure_reason: "69 个失败全部为 'rush: Error: invalid uid 20420178' —— OHOS 沙箱 getpwuid(20420178) 返回 NULL（沙箱 uid 无 passwd 条目），属平台环境限制，非源码或配方缺陷"

test_package_tests:
  - file: test.sh
    description: "鸿蒙消费者功能用例 ×6：①rush --version → rc0 + 'GNU rush 2.4'（校验 configure 期 VERSION 代入与数据路径）；②rush -T（scanner test mode）分词 'ls /tmp' → rc0 + IDENT '/' EOL token（真实 lexer，不调用 getpwuid）；③rush -T 分词 'ls /tmp | grep x' → rc0 + '|' 作独立操作符 token；④rush -T 引号 'echo \"hello world\"' → rc0 + 引号 token + 内部 IDENT；⑤rush -t -u root → rc1 + 'superuser only'（OHOS 非特权 uid 下权限门正确拒绝）；⑥rushwho/rushlast --help → rc0 + 用法输出（证明同包辅助二进制在 OHOS 上可加载运行，坏链接将 rc127）。全部为真实执行+行为校验，非存在性断言。"
    command: "sh test.sh"

assertion_count: 6
