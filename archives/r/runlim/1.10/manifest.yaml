knowledge_gained:
  - "RLIMIT_AS 单位缺陷（runlim 1.10）：space_limit 以 MB 计却被原样作为字节传给 setrlimit；-t/--time-limit（及 -t -s）触发 setrlimit 块后，子进程 execvp 恒失败 ENOMEM（rc=1 execvp failed）。设备实测修复前/后：rc=1 → rc=2 out of time；修复为 ((rlim_t) space_limit << 20)"
  - "OHOS（HongMeng Kernel 1.12）的 /proc/<pid>/stat 字段布局与标准 Linux 一致：field 23=vsize（字节）、field 24=rss（页）、field 14/15=utime/stime（jiffies，USER_HZ=100）；runlim 的 VSIZE_POS/RSIZE_POS/UTIME_POS/STIME_POS 解析无需适配，CPU 时间采样与 -r 限制在设备上实测正确"
  - "runlim 的状态码是自身语义（0 ok / 2 out of time / 3 out of memory / 4 SIGSEGV / 11 其他信号 / 1 exec 失败），子进程退出码被 switch(ok) 分支重置为 0——消费侧断言必须按此语义编写"
  - "makefile.in 将 @CC@/@CFLAGS@ 字面代入编译规则（非 make 变量），因此控制编译器只能经 configure.sh 的 $CC/$CFLAGS 环境（环境已定义则原样采用，否则回退 gcc/-W）"
  - "上游无测试套件（无 tests/、makefile.in 无 check 目标、configure.sh 无测试开关、无测试链接步骤）；R51 以 test_package/test_runlim.sh 31 条消费侧断言补足（含 -t 路径的 RLIMIT_AS 修复回归用例）"

