# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）

package: runlim/1.10
homepage: "https://fmv.jku.at/runlim/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 1.10 不含任何测试套件；makefile.in 也没有 check 目标
upstream_test_in_build: false
upstream_test_command: "（无：makefile.in 仅定义 runlim/clean 两个目标，不存在 check 目标可执行）"

# 上游实际运行的测试程序：无（清点证据见 upstream_test_inventory）
upstream_tests: []

# R51 上游测试清点证据（适配前申报）
upstream_test_inventory:
  tests_directory: false
  makefile_tests: false
  makefile_check_target: false
  configure_test_options: 0
  make_check_cases: 0
  evidence:
    - "解压树（.orig，8 个文件：LICENSE NEWS README VERSION configure.sh makefile.in runlim.c .tarball-sha256）无 tests/test/Test 目录；find . -iname '*test*' -o -iname '*check*' 无结果"
    - "makefile.in 全文 5 行，仅定义 runlim 与 clean 两个目标，无 check/test 目标"
    - "configure.sh 全文 43 行，仅接受 -h/--help/-g 三个选项，无任何测试开关"
    - "构建仅一次编译器调用（makefile.in 规则直接编译 runlim.c），无测试链接步骤"

# test_package 中自带的测试（消费者视角验证，R51 无上游测试场景）
test_package_tests:
  - file: test_runlim.sh
    description: >-
      31 条 TAP 断言，真实执行已安装二进制：--version/-h/参数错误路径；
      pass-through 与 -o 日志内容；子进程退出码被忽略的 status 语义（rc=0）；
      -r 实时限制 rc=2；-t/--time-limit CPU 限制 rc=2（RLIMIT_AS 单位修复的
      回归用例：未修复时 execvp 失败 rc=1）；--real-time-limit rc=2；
      -s/--space-limit 采样击杀 rc=3；子进程 SIGSEGV rc=4 与日志
      "segmentation fault"；-k 信号传播（128+11）；默认日志输出到 stderr
    command: "sh test_runlim.sh"

# 测试断言总数（= test_runlim.sh 输出的 TAP 行数）
assertion_count: 31
