# 软件级 manifest — runlim
software: runlim
display: "runlim"
description: "采样并限制程序及其子进程的时间与内存用量（/proc 采样，超限击杀）"
category: utility
homepage: "https://fmv.jku.at/runlim/"
license: BSD-4-Clause

build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C + 极简 POSIX 构建（configure.sh + makefile.in，无 install 目标，package() 直接拷贝 bin/runlim）"
    - "RLIMIT_AS 单位修复：space_limit（MB）被当字节传入 setrlimit，-t/-t -s 路径子进程 execvp 恒失败 ENOMEM；补丁按字节换算（上游缺陷，无平台宏）"
    - "OHOS /proc/<pid>/stat 布局与标准 Linux 一致（field 23=vsize、field 24=rss 页），采样解析无需适配"
    - "上游无测试套件（无 tests/、makefile.in 无 check 目标、configure.sh 无测试开关）；test_package/test_runlim.sh 补 31 条消费侧功能断言（R51 无上游测试场景）"
    - "子进程退出码被 runlim 忽略（状态码为 runlim 自身语义：0/1/2/3/4/5/6/7/11），测试按此断言"
  common_dependencies: []

versions:
  "1.10":
    status: built
    build_date: "2026-09-20"
    conan_ref: "runlim/1.10"
