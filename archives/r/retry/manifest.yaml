# 软件级 manifest — retry
software: retry
display: "retry"
description: "重复执行命令直到满足条件（默认直到成功）的命令行工具；stdin 捕获重放、失败尝试 stdout 转 stderr"
category: utility
homepage: "https://github.com/minfrin/retry"
license: Apache-2.0

build_system: autotools

ohos_adaptation:
  key_points:
    - "单文件 C + Autotools；官方 release tarball 自带 configure/Makefile.in，零第三方依赖（仅系统 libc）"
    - "2018 年版 config.guess/config.sub 不认识 HarmonyOS/linux-ohos：补丁分别补 HarmonyOS 分支（native 构建）与 linux-ohos 模式（交叉构建），纯可移植性修复、无平台宏"
    - "configure 以 umask 077 创建 config.status 临时目录，HMDFS UID 映射下不可写（E011）——补丁放宽为 022"
    - "上游无测试套件（make check 0 用例）；test_package/test_retry.sh 补 28 条消费侧功能断言（R51 无上游测试场景）"
    - "retry 会捕获并重放 stdin：自动化脚本中调用需显式 </dev/null，避免吞掉调用方输入"
  common_dependencies: []

versions:
  "1.0.6":
    status: built
    build_date: "2026-09-18"
    conan_ref: "retry/1.0.6"
