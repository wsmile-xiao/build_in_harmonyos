# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）

package: retry/1.0.6
homepage: "https://github.com/minfrin/retry"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 1.0.6 不含任何测试套件；build() 仍执行 make check 作为"零用例"证据
upstream_test_in_build: false
upstream_test_command: "make check（automake 空目标，实测执行 0 用例）"

# 上游实际运行的测试程序：无（清点证据见 upstream_test_inventory）
upstream_tests: []

# R51 上游测试清点证据（适配前申报）
upstream_test_inventory:
  tests_directory: false
  makefile_am_tests: false
  makefile_am_check_programs: false
  configure_test_options: 0
  make_check_cases: 0
  evidence:
    - "解压树（.orig，28 个文件）无 tests/、test/、Test/ 目录；find . -iname '*test*' -o -iname '*check*' 无结果"
    - "Makefile.am 仅 bin_PROGRAMS = retry；无 TESTS / check_PROGRAMS / check-local / TESTS_ENVIRONMENT"
    - "configure 无 --enable-test* 开关（grep -c 'enable.*test' configure = 0）"
    - "make check 退出码 0 且不执行任何用例（automake 默认空目标）"

# test_package 中自带的测试（消费者视角验证，R51 无上游测试场景）
test_package_tests:
  - file: test_retry.sh
    description: >-
      28 条 TAP 断言，真实执行已安装二进制：-v/--help；首次即成功不重试；
      --until=success 第 3 次尝试成功且仅成功尝试的 stdout 进入 stdout（失败尝试
      stdout 转入 stderr）；--times 耗尽后 giving up 且返回 rc=1；退出码透传（42）；
      stdin 捕获并逐次重放到重试尝试（两次尝试均收到完整 stdin）；--until=fail
      首次失败即停；--while=fail 对立即成功的命令不重试；非法 --while 报错 rc=1；
      不可执行命令报错 rc=1；-m 自定义退避消息
    command: "sh test_retry.sh"

# 测试断言总数（= test_retry.sh 输出的 TAP 行数）
assertion_count: 28
