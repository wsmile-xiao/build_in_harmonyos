knowledge_gained:
  - "E007 家族：2018 年版 config.guess 不识别 HarmonyOS；native 构建（build==host）时 AutotoolsToolchain 不传 --host/--build，configure 走 config.guess 并报 cannot guess build type——补 HarmonyOS 分支输出 aarch64-unknown-linux-ohos"
  - "GNU config.sub（2018-08-29）需在 maybe_os 列表（三字段 aarch64-linux-ohos）与大 OS 列表（四字段 linux-ohos）两处接受 ohos，否则交叉三元组 canonicalize 失败或 linux-ohos 被误改写为 linux-gnu-ohos"
  - "E011：configure 以 umask 077 创建 config.status 临时目录，HMDFS UID 映射下目录不可写；补丁放宽为 022"
  - "上游无测试套件（无 tests/、Makefile.am 无 TESTS/check_PROGRAMS、configure 无测试开关），make check 实测 0 用例；R51 以 test_package/test_retry.sh 28 条消费侧断言补足"
  - "retry 会捕获 stdin 并重放，自动化脚本或测试中执行时应显式重定向 stdin（</dev/null），否则会吞掉调用方的 stdin 流"

