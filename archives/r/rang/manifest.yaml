software: rang
display: "rang"
description: "Minimal, header-only C++ library for colors in your terminal"
category: console
homepage: "https://github.com/agauniyal/rang"
license: Unlicense
build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only 库，无二进制文件"
    - "OHOS 工具链预定义 __unix__/__linux__，rang.hpp 内部走 OS_LINUX 分支"
    - "rang.hpp 文件末尾 #undef OS_LINUX/OS_WIN/OS_MAC（内部宏不污染用户代码）"
    - "OHOS clang 15 仅提供 libc++，test_package 需显式 -stdlib=libc++ 并映射 CMAKE_SYSTEM_NAME=Linux"

versions:
  "3.3":
    status: built
    build_date: "2026-09-02"
