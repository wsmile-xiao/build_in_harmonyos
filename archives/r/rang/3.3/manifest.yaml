# rang 3.3 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "3.3"
software: rang
status: built
build_date: "2026-09-02"
build_system: cmake

source:
  url: "https://github.com/agauniyal/rang/archive/refs/tags/v3.3.tar.gz"
  sha256: "e835f79e71e1befb0b0c2906cfaa5cb07e12c6f88789931cd3c86c80c852453a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-stdlib=libc++"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "rang.hpp 在文件末尾 #undef OS_LINUX/OS_WIN/OS_MAC（内部实现宏不污染用户代码）；测试校验平台需用编译器宏 __OHOS__/__unix__/__linux__"
  - "OHOS clang 15 仅提供 libc++，conan CMakeToolchain 在 OHOS 下会错误生成 -stdlib=libstdc++，test_package 需在 generate() 显式追加 -stdlib=libc++"

# 知识路径判断见 reports/（R01 为【依赖项】任务，未创建知识库扩展 PR）
