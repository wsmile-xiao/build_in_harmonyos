# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rang/3.3
homepage: "https://github.com/agauniyal/rang"

# 上游测试命令
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (rang upstream tests live under test/; doctest-based
# all_rang_tests requires doctest, not consumed by the header-only package build.
# Consumer-side verification is provided by test_package below.)
upstream_tests:
  - file: test/test.cpp
    source: rang-3.3/test/test.cpp
    description: "Upstream doctest suite (6 TEST_CASE) for rang header"
    command: "cmake --build build && ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: enum semantics, ANSI SGR escape emission, control::Off plain output"
    command: "./test_rang"

# 测试断言总数 (近似值)
assertion_count: 8
