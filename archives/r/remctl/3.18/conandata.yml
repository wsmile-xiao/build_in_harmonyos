# remctl 3.18 —— 配方草稿（hw-7，2026-09-27，设备不可达期间起草，未经真机构建验证）
# 状态：仅草稿。所有 sha/URL 均已实测；deps 中 libevent 的制品可用性尚未验证（见 README-draft-notes）
sources:
  # 官方件真名已定（此前 3 种猜测 URL 全 404，正解在 archives 子域而非站点软件页根目录）：
  #   https://www.eyrie.org/~eagle/software/remctl/ 页面 href -> archives.eyrie.org/software/kerberos/remctl-3.18.tar.gz(+.asc)
  # 实测 909365B；与 Debian 池件 remctl_3.18.orig.tar.xz(612028B) 解包后 diff -r 逐字节一致（仅压缩不同）
  url: "https://archives.eyrie.org/software/kerberos/remctl-3.18.tar.gz"
  sha256: "393c896b6bd9585e75fbc33d8299e23785b5e6418c5b15456c8d27b04f357d42"

patches:
  # 上游回补（GNU config 2023 版已有、本包随发 2022-01-09 版没有）：让 config.sub 认 OHOS 三元组。
  # 实测依据：build-aux/config.sub timestamp='2022-01-03'、全文 grep -i ohos **0 命中**，
  # 直跑 `sh build-aux/config.sub aarch64-unknown-linux-ohos` 报
  #   Invalid configuration ...: OS `ohos' not recognized
  # 加两处白名单（os 表 `| ohos*`、kernel-os 表 `| linux-ohos*`）后同命令输出规范三元组，
  # 且 gnu/musl/android/powerpc 四组回归输入全部不变；补丁对新鲜解包件 apply+反向 revert
  # 均通过（revert 后与原件 diff -q 一致）。
  # 不用框架的 patch-autotools-ohos.pl：CI worker 上 OHC_SKILL_ROOT 不可达（lksctp 已证）。
  # 形态与仓库既有条目一致（扁平列表，不套版本号）。
  - patch_file: "patches/0001-config-sub-ohos-triplet.patch"
    patch_type: "portability"
    patch_description: "backport OHOS triplet support to the bundled config.sub (2022-01-03 vintage)"
    strip: 1
  # 六个测试脚本的 shebang 写死 /usr/bin/perl，而本机 perl 实为 ~/usr/local/bin/perl
  # （/usr/bin/perl、/system/bin/perl 实测均不存在）⇒ make check 里这 6 个集一律
  # ABORTED (execution failed -- not found?)，连它们自带的 skip_all 门都进不去。
  # 改成 #!/usr/bin/env perl（构建期 PATH 含 ~/usr/local/bin，profile [buildenv] 已注入）。
  # 实测依据：head -1 逐字为 '#!/usr/bin/perl'；补丁 6 文件 6 hunk，对新鲜解包件
  # apply 后首行变 '#!/usr/bin/env perl'，再 -R 反向后与原件 diff -q 全部一致。
  - patch_file: "patches/0002-ohos-relocatable-perl-shebang.patch"
    patch_type: "portability"
    patch_description: "make the test scripts' perl interpreter relocatable (/usr/bin/perl -> /usr/bin/env perl)"
    strip: 1
