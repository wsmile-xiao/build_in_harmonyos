# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (ci/conan/build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: remctl/3.18
homepage: "https://www.eyrie.org/~eagle/software/remctl/"

# 上游测试命令：官方件自带完整 C TAP 套件，且**不是** automake 的 TESTS= 机制，
# 而是自研驱动 —— Makefile.am:609 `check-local: $(check_PROGRAMS)` 体内执行
# `tests/runtests -l '$(abs_top_srcdir)/tests/TESTS'`。因此 `make check` 真的会跑用例
# （与 lksctp-tools 那种"只有 check_PROGRAMS、make check 静默零执行还返回 0"的形态不同，
# 本包已在真机逐字核实：All tests successful, 63 tests skipped. / Files=57,  Tests=975）。
upstream_tests_exist: true
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: 'autotools.make(target="check", args=["-j1"])'

upstream_test_audit:
  - source: "tests/TESTS"
    reason: "非注释非空行共 57 项 = 注册测试集数（47 个 C 程序 + 10 个脚本），逐项映射 tests/<entry>-t.c 或 -t 核实存在。这是本包的分母来源，不是从日志反推的。"
  - source: "Makefile.am"
    reason: "383 行 check_PROGRAMS 注册测试程序、408 行 check_LIBRARIES = tests/tap/libtap.a、609 行 check-local 用 tests/runtests -l 驱动 57 个集；另有 check-valgrind(667) 与 check-cppcheck(652) 两类维护者目标，非默认 check 路径，不计入分母。"
  - source: "各 *-t.c / *-t 的字面 plan(N)"
    reason: "N_static = 1319（下界口径）：41 个 *-t.c 字面 plan 求和 1239 + 4 个脚本 plan 求和 80（client/remctl-t 14、server/misc-t 7、server/shell-misc-t 18、util/xmalloc-t 41）。另 8 个 *-t.c 的 plan 为运行时计算（如按语料条数），静态无法核验，故 1319 是下界而非全量，未把不可核验部分谎计为已跑。"
  - source: "tests/tap/kerberos.c"
    reason: "318/338 行 skip_all(\"Kerberos tests not configured\")、391 行 PKINIT 同型 —— 需活 KDC/keytab 的集由**上游自身**以 TAP 整集 skip 退出（贡献 0 计划数），不是适配方删用例。22 个集走此路径。"
  - source: "tests/tap/perl/Test/RRA.pm"
    reason: "112 行 skip_unless_author（守卫变量 AUTHOR_TESTING）、129 行 skip_unless_automated（AUTOMATED_TESTING/RELEASE_TESTING/AUTHOR_TESTING）—— 维护者用测试（docs/pod、docs/pod-spelling、docs/spdx-license、perl/module-version、style/obsolete-strings）随包交付但按上游设计默认跳过；另 valgrind/logs 需 valgrind、util/xmalloc 需作者位。共 7 个集。"
  - conclusion: "上游有真实可执行的自动化测试且本包在 build() 内以 make check 完整执行：57 个注册集中 28 集真跑（912 条断言全通过、63 条为文件内条件 # skip）、29 集由上游自身带因整集跳过（22 集缺 krb5 客户端配置与 KDC、7 集为作者/自动化门），0 失败。**未删除任何用例、未缩小分母、未把任何未执行项计入通过**。"

