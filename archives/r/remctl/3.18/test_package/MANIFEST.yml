# ---- 五维账本（AGENTS §10.1；与 PR 正文两张表、notes.md §6 同源）----
N_static: 1319            # 上游静态声明（字面 plan 求和，下界；8 个 C 文件 plan 运行时计算不可核验）
N_registered: 975         # 真机 harness 逐字 Files=57, Tests=975（整集 skip 者按 TAP 协议贡献 0）
N_executed: 912           # 实际执行并通过的原子断言（= 975 - 63 条文件内 # skip）
N_skipped_intra_file: 63  # 文件内条件跳过（IPv4/IPv6 分支、glibc 行为差异等，逐条由上游打印原因）
N_not_executed_sets: 29   # 整集带因跳过的测试集（其声明合计约 344 条 = N_static - N_registered，含 8 个动态 plan 文件的运行时贡献，故为近似差值）
N_consumer: 5             # test_package 新增消费者断言数（独立 test_remctl.c，满足 CI L0c standalone-test-source）

test_package_tests:
  - file: test_remctl.c
    description: "以 libremctl 使用者身份真实编译 + 链接 + 调用公开 API，5 条断言全部走『无服务端环境下的确定性失败路径』，因此不依赖 KDC/remctld 即可在真机与 CI worker 上稳定复现：(1) remctl_new() 返回非空句柄；(2) remctl_open(r, \"127.0.0.1\", 1, NULL) 连本机确定关闭的端口必须失败（该函数按 DRAFT-6487 同源约定以 0/false 表示失败，client/api.c:341 起）；(3) 紧随其后的 remctl_error(r) 必须给出非空错误串（证明失败被真实记录而非静默）；(4) 一次性 API remctl(host, port, principal, const char **command)（**4 参、command 为 NULL 结尾 argv 向量**，client/remctl.h:152）返回非空 result 结构而非崩溃；(5) 该 result 报告失败（status != 0 或 error != NULL）且可被 remctl_result_free 安全释放。"
    command: '"./test_remctl"（由 conan test 在 env="conanrun" 下执行，逐字读数 ok 1..5 / 1..5）'

assertion_count: 5
max_rss_mb: 2500          # memcap-run.py --slow --mb 2500 硬预算（超限 SIGTERM→SIGKILL，rc=90）；实测峰值 205MB
