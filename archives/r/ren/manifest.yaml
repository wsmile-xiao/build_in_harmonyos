software: ren
display: "ren"
description: "Rename multiple files in a directory using wildcard search and replacement patterns"
category: utility
homepage: "https://www.ibiblio.org/pub/Linux/utils/file/"
license: LicenseRef-comp.sources.unix
build_system: makefile

ohos_adaptation:
  key_points:
    - "Plain Makefile project with no configure step or third-party dependencies."
    - "The recipe passes CC from the Conan profile and compiles the 1988 K&R C source with -std=gnu89."
    - "musl <dirent.h> does not define MAXNAMLEN; a one-line patch includes <sys/param.h>."
    - "The libc-only tool is linked as a static PIE, so it needs no dynamic loader."
  common_dependencies: []

versions:
  "1.0":
    status: built
    build_date: "2026-09-24"
    conan_ref: "ren/1.0"
