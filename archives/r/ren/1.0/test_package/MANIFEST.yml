package: ren/1.0
homepage: "https://www.ibiblio.org/pub/Linux/utils/file/"

upstream_tests_exist: false
upstream_test_audit: "The ren-1.0 archive has exactly six files: Makefile, README, ren.1, ren.c, ren.c.linux-patch and rename-files.orig (the 1988 comp.sources.unix shar). There is no test/ or tests/ directory, no test script, and the Makefile targets are all, ren, install (only echoes a message) and clean; no check or test target exists."
upstream_check_command: "none — upstream Makefile has no check/test target"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Runs the packaged AArch64 ren binary (directly on AArch64, through qemu-aarch64 elsewhere) in 13 scenarios taken from ren(1): usage error, '*' rename with -v and dot-file skipping, the man page example abc*.*.* -> xyz#1.#3, path prefix with a two-file rename cycle, chain ordering, collision abort, -k/-a/-d, interactive n/y prompts, invalid replacement patterns, no-match and empty-name errors, and an escaped #."
    command: "bash test.sh <ren> <work-dir>"

assertion_count: 53
