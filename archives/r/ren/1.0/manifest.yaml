software: ren
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0"

# 构建系统类型
build_system: makefile

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-13"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.ibiblio.org/pub/Linux/utils/file/ren-1.0.tar.gz"

  # 源码校验和
  sha256: "6ccf51b473f07b2f463430015f2e956b63b1d9e1d8493a51f4ebd70f8a8136c9"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
  - "--prefix=$DEFAULT_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
  - "0002-configure.patch"
  - "0003-ren.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E081: MAXNAMLEN undeclared on musl/HarmonyOS - need limits.h + #ifdef __OHOS__ guard"
  - "Local function name conflicts with stdlib (bsearch) - use #define ren_bsearch with __OHOS__ guard"
  - "Old K&R C code needs stdlib.h/string.h on HarmonyOS - guard conflicting extern declarations with #ifndef __OHOS__"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/ren-1.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/ren-1.0.work
  source_orig_hash: bb22d32d7981455f
  source_work_hash: 70107bccd51608d1
  generated_at: '2026-06-13T18:13:21'
  patches_count: 3

patch_classification:
