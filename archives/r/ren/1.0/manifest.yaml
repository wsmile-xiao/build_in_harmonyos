    type: auto
    platform_only: True
    guard: '#ifdef __OHOS__'
  - file: 0002-configure.patch
    type: auto
    platform_only: True
    guard: '#ifdef __OHOS__'
  - file: 0003-ren.c.patch
    type: auto
    platform_only: True
