software: rtosc
display: "RtOsc"
description: "Realtime safe OSC packet serialization and dispatch library"
category: library
homepage: "https://github.com/fundamental/rtosc"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "无强制第三方依赖，核心库 rtosc（C）与 rtosc-cpp（C++）均为纯计算代码"
    - "上游 CMake 最低版本为 2.8，需经 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容 CMake 4"
    - "os=OHOS 映射为 CMAKE_SYSTEM_NAME=HarmonyOS，官方源码未知该平台，需在配方内固定为 Linux 以启用 GNUInstallDirs 与 install 规则"
    - "可选依赖 liblo/jack/FLTK/Ruby/Doxygen 在 OHOS 均不存在，保持默认关闭，仅构建核心库与 ctest"
  common_dependencies: []

versions:
  "0.3.1":
    status: built
    build_date: "2026-09-24"
    conan_ref: "rtosc/0.3.1"
