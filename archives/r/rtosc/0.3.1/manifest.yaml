version: "0.3.1"
software: "rtosc"
status: built
build_date: "2026-09-24"
build_system: "cmake"
conan_ref: "rtosc/0.3.1"

source:
  url: "https://github.com/fundamental/rtosc/archive/refs/tags/v0.3.1.tar.gz"
  sha256: "41989b5811ae5a05667b3743b1fc8309010609a68e78a5eebb2a85cfe2aa1743"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=Linux (OHOS 下固定，启用 GNUInstallDirs 与 install 规则)"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DRTOSC_BUILD_SHARED_LIBS=OFF"
    - "-DBUILD_RTOSC_EXAMPLES=OFF"
    - "-DPERF_TEST=OFF"
    - "ctest --output-on-failure (upstream, 28/28 ctest entries)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "v0.3.1 上游 cmake_minimum_required 为 2.8，CMake 4 下需 CMAKE_POLICY_VERSION_MINIMUM=3.5，不改源码"
  - "上游 install 与 GNUInstallDirs 仅在 CMAKE_SYSTEM_NAME MATCHES Linux 时启用，OHOS 下固定为 Linux（rttr/zstr 同款）"
  - "默认配置无强制依赖；liblo/JACK/FLTK/Ruby/Doxygen 在 OHOS 均不存在，28 项默认 ctest 即全量"
  - "v0.3.1 测试分母为 28（C 15 + C++ 13），master 分支为 31，不可混用；口径 ctest_entries"

verification:
  real_device:
    date: "2026-09-24"
