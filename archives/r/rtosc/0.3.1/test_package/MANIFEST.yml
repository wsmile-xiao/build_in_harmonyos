# test_package/MANIFEST.yml — rtosc 0.3.1
# 上游官方测试声明文件（CI L0e 硬门禁要求存在）

package: rtosc/0.3.1
homepage: "https://github.com/fundamental/rtosc"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "rtosc-0.3.1.tar.gz (official GitHub tag archive v0.3.1)"
  source_url: "https://github.com/fundamental/rtosc/archive/refs/tags/v0.3.1.tar.gz"
  source_sha256: "41989b5811ae5a05667b3743b1fc8309010609a68e78a5eebb2a85cfe2aa1743"
  build_system: "CMake"
  test_definition: >
    CMakeLists.txt (v0.3.1 tag) registers tests via maketest/maketestcpp
    macros plus enable_testing(). Default configuration (BUILD_RTOSC_EXAMPLES
    OFF, PERF_TEST OFF, no liblo/JACK/Ruby on OHOS) registers 15 C tests and
    13 C++ tests, 28 in total. Conditional entries (liblo, performance,
    serializer, port-checker*) require absent optional dependencies and do
    not exist in the OHOS build. Counting unit is the ctest entry.
  dependency: "none (core libraries need only C99/C++11; optionals stay OFF)"
  portability_changes: []

upstream_check_command: "ctest -N && ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# Counting unit: one ctest entry (CMakeLists.txt maketest/maketestcpp).
# Take-number command in the v0.3.1 source tree:
#   ctest -N  ->  "Total Tests: 28"
upstream_test_total: 28
upstream_test_count_method: ctest_entries

