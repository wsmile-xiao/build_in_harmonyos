# Consumer-perspective checks exercise the packaged C + C++ APIs end to end.
# Each CHECK has a CHECK-FAIL exit path (counter + non-zero return).
test_package_tests:
  - file: test_rtosc.cpp
    scenario: "consumer-api"
    description: >
      Conan 消费者同时链接 librtosc 与 librtosc-cpp：C 消息构造与参数查询、
      参数值往返、0.3.1 版本断言、双消息 Bundle 往返、消息校验与模式匹配、
      C++ Ports 分发回调。每项断言exactly一行 CHECK-OK，失败即 CHECK-FAIL。
    command: "./test_rtosc"
    assertions: 11

assertion_count: 11
