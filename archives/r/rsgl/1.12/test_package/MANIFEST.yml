# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 三步法清点）
# RSGL 1.12 上游无独立 tests/ 目录或 ctest 注册项；上游以 examples/ 下
# 15 个示例程序作为可运行入口（需要 X11/GLFW 窗口环境，OHOS 无 X11，
# 使用 RSGL_NO_RGFW + EGL/GLES3 无头模式等价验证渲染管线）。
# 详细清点见 archives/r/rsgl/1.12/notes.md 上游测试台账。

package: rsgl/1.12
homepage: "https://github.com/ColleagueRiley/RSGL"

# 上游测试命令 (RSGL 无 ctest/meson；examples Makefile 即入口)
upstream_check_command: "make -C examples all"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（全部为上游 examples，独立于 test_package 消费者测试）
upstream_tests:
  - file: examples/basics/basic.c
    source: rsgl-1.12/examples/basics/basic.c
    description: "上游基础示例：窗口创建与清屏（需要 X11/GL 窗口环境，OHOS 无 X11，列为不可运行-平台限制）"
    command: "./basic"
  - file: examples/basics/shapes.c
    source: rsgl-1.12/examples/basics/shapes.c
    description: "上游形状绘制示例（需要窗口环境，平台限制不可运行）"
    command: "./shapes"
  - file: examples/basics/events.c
    source: rsgl-1.12/examples/basics/events.c
    description: "上游事件处理示例（需要窗口环境，平台限制不可运行）"
    command: "./events"
  - file: examples/basics/textures.c
    source: rsgl-1.12/examples/basics/textures.c
    description: "上游纹理示例（需要窗口环境，平台限制不可运行）"
    command: "./textures"
  - file: examples/basics/text.c
    source: rsgl-1.12/examples/basics/text.c
    description: "上游文本渲染示例（需要窗口环境，平台限制不可运行）"
    command: "./text"
  - file: examples/widgets/button.c
    source: rsgl-1.12/examples/widgets/button.c
    description: "上游按钮控件示例（需要窗口环境，平台限制不可运行）"
    command: "./button"
  - file: examples/widgets/styles.c
    source: rsgl-1.12/examples/widgets/styles.c
    description: "上游样式示例（需要窗口环境，平台限制不可运行）"
    command: "./styles"
  - file: examples/widgets/container.c
    source: rsgl-1.12/examples/widgets/container.c
    description: "上游容器控件示例（需要窗口环境，平台限制不可运行）"
    command: "./container"
  - file: examples/widgets/textbox.c
    source: rsgl-1.12/examples/widgets/textbox.c
    description: "上游文本框示例（需要窗口环境，平台限制不可运行）"
    command: "./textbox"
  - file: examples/advanced/glVer.c
    source: rsgl-1.12/examples/advanced/glVer.c
    description: "上游 GL 版本探测示例（需要窗口环境，平台限制不可运行）"
    command: "./glVer"
  - file: examples/advanced/shader.c
    source: rsgl-1.12/examples/advanced/shader.c
    description: "上游着色器示例（需要窗口环境，平台限制不可运行）"
    command: "./shader"
  - file: examples/advanced/glfw.c
    source: rsgl-1.12/examples/advanced/glfw.c
    description: "上游 GLFW 接入示例（需要 GLFW+X11 环境，平台限制不可运行）"
    command: "./glfw"
  - file: examples/custom_render_samples/custom_render_pgl.c
    source: rsgl-1.12/examples/custom_render_samples/custom_render_pgl.c
    description: "上游自定义渲染示例 PGL（需要窗口环境，平台限制不可运行）"
    command: "./custom_render_pgl"
  - file: examples/custom_render_samples/custom_render_rgl.c
    source: rsgl-1.12/examples/custom_render_samples/custom_render_rgl.c
    description: "上游自定义渲染示例 RGL（需要窗口环境，平台限制不可运行）"
    command: "./custom_render_rgl"
  - file: examples/custom_render_samples/custom_render_template.c
    source: rsgl-1.12/examples/custom_render_samples/custom_render_template.c
    description: "上游自定义渲染模板（需要窗口环境，平台限制不可运行）"
    command: "./custom_render_template"

# test_package 中自带的测试 (消费者视角验证 — 真实编译链接运行)
test_package_tests:
  - file: test.c
    description: "消费者验证：EGL pbuffer + GLES3 初始化 RSGL，调用公开 API 绘制矩形并读回像素 + 碰撞检测"
    command: "./test_rsgl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
