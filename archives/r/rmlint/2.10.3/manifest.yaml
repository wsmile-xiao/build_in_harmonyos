# 版本级 manifest
# 文件位置: archives/r/rmlint/2.10.3/manifest.yaml

version: "2.10.3"

software: rmlint

# 状态取值口径: published | built | failed | archived
# 本轮未拿到 W3/conan create 判决（两台共享构建主机槽位整场为满，见 notes.md §4），
# 按 R29 不伪造 built/published。主代理跑通 conan-verify / finish 后由工具改写。
status: built

build_date: "2026-09-24"
build_system: scons

source:
  url: "https://codeload.github.com/sahib/rmlint/tar.gz/refs/tags/v2.10.3"
  sha256: "8ffdbd5d09d15c8717ae55497e90d6fa46f085b45ac1056f2727076da180c33e"
  tar_format: tar.gz
  filename: "rmlint-2.10.3.tar.gz"

build:
  system: scons
  configure_options:
    - "-j1"
    - "CC=<conan conf tools.build:compiler_executables.c>"
    - "AR=<ar>"
    - "RANLIB=<ranlib>"
    - "--without-blkid"
    - "--without-json-glib"
    - "--without-libelf"
    - "--without-gettext"
    - "--without-gui"
    - "--without-compile-glib-schemas"
  dependencies:
    - "glib/2.84.0.1"
    - "pkgconf/3.0.5 (tool)"
    - "scons/4.10.1 (pip, 构建沙箱内私有前缀自举)"
  cc: clang

patches_applied: []

knowledge_gained:
  - "SCons 既不在设备镜像里（无 scons 二进制、无 SCons python 模块），也不在 ohpcd 制品仓（conan download scons → 'system acceleration policy not enabled'），仓内三份已合并配方 gpsd/dxx-rebirth/vixl 一致采用 'pip --target=<build_folder>/_scons_env + PYTHONPATH + python3 -m SCons' 自举形态"
  - "SConstruct 建 Environment 时把子进程 ENV 裁剪为 ['PATH','TERM','HOME','PKG_CONFIG_PATH'] ⇒ 依赖发现只能走 PKG_CONFIG_PATH，经 CFLAGS/LDFLAGS 注入 glib 头/库路径对该包完全无效"
  - "glib 包自带的 glib-2.0.pc 里 prefix=/（不可直接用），必须取 PkgConfigDeps 生成的那份；而 PkgConfigDeps 不生成 gio-unix-2.0.pc（Conan glib 配方无该 component）⇒ 上游 required=False 的 gio-unix 探测必然落空，只影响非旋转盘优化"
  - "docs/SConscript 把 sphinx man page 同时挂成 default 与 install 目标 ⇒ 不能用 scons install 打包（rst2man/sphinx 本平台不存在）；直接 copy 源根 ./rmlint 二进制（abr2gbr/vamps 同法）"
  - "rmlint 2.10.3 全树无 yaml 引用 ⇒ 常见认知里的 'rmlint 需要 libyaml' 不成立，配置解析自研于 lib/cfg.c"
  - "HMDFS 拒绝 link(2)（EPERM）但支持 symlink(2) 与 user.* xattr 读写；fallocate 返回 EACCES；Python 侧无 os.SEEK_HOLE/SEEK_DATA 常量 ⇒ 扫描-报告能力完好，改写-去重类模式受限"

upstream_tests_exist: true
upstream_test_audit: >-
  os.walk 审计 rmlint-2.10.3 归档：tests/ 66 文件、test_*.py 44 个、注册 def test_ 函数 149 个；
  tests/SConscript 的 test alias 调 "pytest -s -v -k 'not slow'"；
  tests/requirements.txt 钉 pytest==8.* / psutil==7.* / xattr==1.*。
  平台 pytest ABSENT（command -v 与 import 双向实测），且 tests/utils.py:326 create_link()
  以 os.link() 建硬链接夹具而 HMDFS link(2) 实测 EPERM ⇒ 本轮未执行（0 跑/149 未跑，
  逐条原因见 test_package/MANIFEST.yml 的 44 条 upstream_tests）。

reason: >-
  路径 A 交付：只构建并测试扫描/报告能力的 stock rmlint，关闭 blkid/json-glib/libelf/gettext/gui
  等可选面（各自原因见 notes.md §3 与上游开关名）。上游 149 项 pytest 未执行，如实记 not_run 并给逐条技术原因，
  改以 6 个不依赖硬链接/xattr 写/fallocate 的鸿蒙消费者用例覆盖二进制实质功能（R34）。
