# conandata.yml — rmlint 2.10.3
#
# 源码：GitHub 官方仓库 tag 归档（R39/PF7 官方源）。
#   https://github.com/sahib/rmlint  tag v2.10.3（.version 文件实测 "2.10.3 Ludicrous Lemur"）
# codeload.github.com 是 GitHub 官方归档 CDN（github.com/.../archive/... 302 指向它）。
#
# 真机实测（B 机 HarmonyOS aarch64，2026-09-24）：
#   curl -sIL → 两种 URL 均返回 000（HEAD 不被放行）
#   curl -sL  → codeload 官方 URL 成功，2504233 字节，
#               sha256 = 8ffdbd5d09d15c8717ae55497e90d6fa46f085b45ac1056f2727076da180c33e
#   证据：~/tmp/uc2/z24-rmlint/getsrc.out（下载日志）与 getsrc/src/sha256.txt
#   ⇒ 结论：判可达性必须用 GET，不能用 HEAD/-I。
#
# URL 末段是 tag 名、无 .tar.gz 后缀，conan get() 会误判压缩包类型导致
# strip_root 失败 ⇒ 显式 filename（与 vamps/abr2gbr 同类坑）。
# tar 包顶层目录为 rmlint-2.10.3/ ⇒ strip_root=True 成立。

sources:
  url: "https://codeload.github.com/sahib/rmlint/tar.gz/refs/tags/v2.10.3"
  sha256: "8ffdbd5d09d15c8717ae55497e90d6fa46f085b45ac1056f2727076da180c33e"
  filename: "rmlint-2.10.3.tar.gz"

patches:
  - patch_file: "patches/0001-lib-utilities-null-check-getpwuid.patch"
    patch_description: "0001 lib utilities null check getpwuid"
    patch_type: "portability"
