test_package_tests:
  - file: test.sh
    description: >-
      鸿蒙消费者实测用例 ×6（不建硬链接、不写 xattr、不用 fallocate/reflink）：
      ①--version 退出 0 且输出含程序名与版本号；②--help 退出 0 且含 usage 与 xattr
      选项组（证明配置解析与终端格式化路径可用）；③真实重复文件被检出并逐条列出两个
      孪生路径 + duplicate 汇总行 + 退出码 1；④-o json -O 报告文件同时含两个孪生路径与
      size/checksum 字段（机器可读输出面可用）；⑤负向对照：内容互异的目录必须退出码 0
      且不出现 duplicate（排除"全都报重复"的假绿）；⑥-T ed 空目录类型可路由并点名空目录。
    command: "sh test.sh <bin_dir> <work_dir> <summary_file>"

assertion_count: 6
