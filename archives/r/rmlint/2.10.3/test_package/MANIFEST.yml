# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rmlint/2.10.3
homepage: "https://github.com/sahib/rmlint"

upstream_check_command: "scons test"
upstream_tests_exist: true
upstream_test_audit: >-
  Audited the rmlint-2.10.3 source archive (sha256
  8ffdbd5d09d15c8717ae55497e90d6fa46f085b45ac1056f2727076da180c33e) with an
  os.walk based counter (shell globs are unreliable on HMDFS): tests/ holds 66
  files, of which 44 are test_*.py, declaring 149 "def test_" functions.
  tests/SConscript registers a "test" alias that shells out to
  "pytest -s -v -k 'not slow'"; tests/requirements.txt pins pytest==8.*,
  psutil==7.* and xattr==1.*. pytest.ini only declares the "slow" marker.
  Counting evidence: ~/tmp/uc2/z24-rmlint/ (probe output recorded in notes.md).

reason: >-
  The upstream pytest suite is declared but was NOT executed in this adaptation
  session. Two independently measured platform blockers, plus one process
  constraint: (1) no pytest/psutil/xattr on the host (measured:
  "command -v pytest" -> ABSENT, "python3 -c 'import pytest'" ->
  ModuleNotFoundError); (2) HMDFS rejects link(2) with EPERM (measured), while
  tests/utils.py:create_link() uses os.link() to build the duplicate fixtures
  that most test groups depend on; (3) fallocate() returns EACCES (measured),
  which the sparse-file and reflink cases need. A run WAS attempted in the 2026-09-25 session: pytest 8.4.2 installs
  from the community PyPI mirror, but the mirror ships no psutil/xattr
  distribution at all and the psutil-7.2.2 sdist from official PyPI fails to
  compile against the OHOS sysroot (linux/socket.h:23 redefinition of
  sockaddr_storage in psutil/arch/linux/net.c), so collection aborts at
  tests/utils.py:12 import psutil (measured via pytest --collect-only).
  The 6 consumer cases below were authored to exercise the shipped binary
  without hard links, xattr writes, fallocate or reflink.

upstream_test_in_build: false
upstream_test_command: "pytest -s -v -k 'not slow'"

# 44 files / 149 registered functions, per-file counts from the os.walk audit.
# status: not_run  +  one of the reason codes below.
#   R1 = requires hard link creation via tests/utils.create_link (link(2) -> EPERM on HMDFS)
#   R2 = requires pytest/psutil/xattr python packages (absent on host)
#   R3 = requires fallocate/reflink/sparse file support (fallocate -> EACCES, FICLONE unproven)
#   R4 = requires /sys/block or block device resolution (blkid disabled, /sys/block access unproven)
# R2 applies to every entry (the runner itself is missing); the second code
# listed per file is the additional functional blocker.
