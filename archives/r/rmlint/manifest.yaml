# 软件级 manifest — rmlint
software: rmlint
display: "rmlint"
description: "冗余文件/空目录/坏软链等磁盘垃圾查找与报告工具（校验和与尺寸双模检测）"
category: tools
homepage: "https://github.com/sahib/rmlint"
license: GPL-3.0-or-later

build_system: scons

ohos_adaptation:
  key_points:
    - "构建系统是 SCons，而 scons 二进制/SCons python 模块在设备上都不存在、ohpcd 制品仓亦无该配方 ⇒ 沿用仓内 gpsd/dxx-rebirth/vixl 已合并形态：generate() 里 pip --target=<build_folder>/_scons_env 私有前缀自举 + PYTHONPATH + python3 -m SCons（不写用户环境）"
    - "唯一必需依赖 glib-2.0 >= 2.64（SConstruct required=True）；libyaml 在 2.10.3 已不使用（全树零 yaml 引用），常见认知需纠正"
    - "SConstruct 把子进程 ENV 裁剪为 PATH/TERM/HOME/PKG_CONFIG_PATH ⇒ 依赖发现必须走 PKG_CONFIG_PATH，且要先 append_path 再 VirtualBuildEnv.generate()"
    - "glib 自带 .pc 的 prefix=/ 不可用 ⇒ 取 PkgConfigDeps 生成的那份；PkgConfigDeps 不产出 gio-unix-2.0.pc（该探测在上游为 required=False，只影响非旋转盘优化）"
    - "不用 scons install 打包：docs/SConscript 把 sphinx man page 挂进 install alias，而 sphinx/rst2man 本平台不存在 ⇒ package() 直接 copy 源根 ./rmlint（同 abr2gbr/vamps）"
    - "路径 A 关闭 blkid / json-glib / libelf / gettext / gui / compile-glib-schemas 六个可选面（各自技术原因见 2.10.3/notes.md §3）"
    - "HMDFS 拒绝 link(2)、fallocate EACCES ⇒ 交付「扫描-报告」能力，不承诺「改写-去重」能力；上游 149 项 pytest 因此（并叠加本机无 pytest）未执行，如实记 not_run"
  common_dependencies:
    - glib
    - pkgconf

versions:
  "2.10.3":
    status: pending_w3_verification
    build_date: "2026-09-24"
    conan_ref: "rmlint/2.10.3"
