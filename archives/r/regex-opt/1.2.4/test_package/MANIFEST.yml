    reason: "归档共 16 个文件：COPYING、Makefile、Makefile.sets、README.html、autoptr、depfun.mak、docmaker.php、libregex.cc、libregex.hh、main.cc、makediff.php、progdesc.php、range.hh、range.tcc、rangeset.hh、rangeset.tcc。无 test/、tests/ 目录，无 *_test.* / *_spec.* 文件。"
  - source: "Makefile"
    reason: "目标只有 all、regex-opt、libregex.a、clean、distclean、realclean；无 check / check-local / test 目标，无 TESTS / check_PROGRAMS 变量。grep -E 'check|TESTS' 在 Makefile 与 Makefile.sets 上结果为空。"
  - source: "depfun.mak"
    reason: "git_test_release 是 git 发布流程辅助目标（打包/打 tag/生成 test_release 目录供人工试用），不是自动化测试套件；不含任何断言。"
