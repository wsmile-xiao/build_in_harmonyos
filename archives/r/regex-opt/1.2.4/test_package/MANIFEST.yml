    reason: "TestSet() 是一个未被任何路径调用的死函数（无测试入口），不是被接线的测试 harness。"
  - conclusion: "上游未提供自动化测试套件，make check 无目标可执行（0 执行系上游事实而非适配遗漏）；由 test_package 真实运行打包的 regex-opt 二进制并断言 8 条消费者行为。"

# 上游无任何测试框架，故未运行用例总数为 0（经上述审计确认，非归零真实计数）。
upstream_test_total: 0
upstream_test_count_method: "none"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_regexopt.sh
    description: "真实执行打包后的 regex-opt 二进制并做 8 条行为断言：(1) xaz|xbz|xcz -> x[a-c]z；(2) aaa* -> a{2,}；(3) (a?){3} -> a{0,3}；(4) xyzyzxyzyz -> (?:x(?:yz){2}){2}；(5) a+|aa+ -> a+；(6) dxxxxb|dxxxb|dxxb|dxb -> dx{1,4}b；(7) 字符集合并 y|[yp]|[zx] -> [px-z]；(8) 非法正则 '[abc' 必须非零退出且打印 'Error:' 前缀（错误路径断言）。1-7 断言 stdout 精确等于期望输出且退出码为 0，期望输出通过本机 g++ 实测上游 v1.2.4 源码得到、与 bisqwit.iki.fi README 示例一致。regex-opt 为纯 C++ 工具（main.cc + libregex.a），不链接第三方库，无需 LD_PRELOAD/LD_LIBRARY_PATH；打包二进制已在 package() 按 E077 自签名，可直接执行；脚本为 POSIX sh，以 HMBS 注入的 SHELL 执行（HMBS [shell_getcwd]）。"
    command: "$SHELL test_regexopt.sh <package>/bin/regex-opt"

assertion_count: 8
