# 软件级 manifest
# 文件位置: archives/r/regex-opt/manifest.yaml
# 版本级细节见 1.2.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: regex-opt
display: "regex-opt"
description: "Perl-compatible regular expression optimizer (Bisqwit)"
category: build-tool
homepage: "https://bisqwit.iki.fi/source/regexopt.html"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建（无 configure/autoreconf），g++ 直接编译 main.cc + libregex.cc"
    - "产物为 bin/regex-opt 可执行文件 + lib/libregex.a 静态库（链接 libregex.hh 公共 API）"
    - "上游无任何测试框架：无 test/ 目录、无 make check 目标（已审计，见 notes.md）"
    - "OHOS 上执行 ELF 需 binary-sign-tool 自签名（E077），bin/regex-opt 与 test_package 消费者均处理"
  common_dependencies: []

versions:
  "1.2.4":
    status: built
    build_date: "2026-09-29"
