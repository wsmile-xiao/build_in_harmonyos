# 软件级 manifest — roblox-ts
# 文件位置: archives/r/roblox-ts/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: roblox-ts
display: "roblox-ts (rbxtsc)"
description: "A TypeScript-to-Luau Compiler for Roblox — 把 TypeScript 编译为 Roblox Luau 的命令行编译器"
category: utility
homepage: "https://github.com/roblox-ts/roblox-ts"
license: MIT

build_system: none

ohos_adaptation:
  key_points:
    - "npm 预编译发布包（tarball 内含 out/**/*.js + include/*.lua），按 application 打包：libexec/roblox-ts + bin/rbxtsc"
    - "上游入口 shebang 为 #!/usr/bin/env node；OHOS 上 /usr/bin/env 在部分运行 uid 下不可执行 → 配方生成 POSIX sh 启动器，不依赖 shebang"
    - "OHOS 上 PATH 首位的 node 可能是启动即崩（Native stack trace / SIGABRT rc=134）的工具链二进制 → 启动器探测候选解释器（RBXTSC_NODE > PATH > /data/service/hnp/bin/node），取第一个可用者"
    - "运行时依赖系统 Node.js（OHOS 自带 hnp node v24.13.0 已验证）；不引入任何 conan 依赖"
  common_dependencies: []

versions:
  "3.0.0":
    status: built
    build_date: 2026-09-29
