# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rapidobj/1.1
homepage: "https://github.com/guybrush77/rapidobj"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/unit-tests/src/test_parsing.cpp
    source: rapidobj-1.1/tests/unit-tests/src/test_parsing.cpp
    description: "rapidobj::detail::ParseReals / ParseFace 单元测试"
    command: "./unit-tests"
  - file: tests/unit-tests/src/test_material_parsing.cpp
    source: rapidobj-1.1/tests/unit-tests/src/test_material_parsing.cpp
    description: "rapidobj::detail::ParseTextureOption / ParseMaterials 单元测试"
    command: "./unit-tests"
  - file: tests/unit-tests/src/test_mtllib.cpp
    source: rapidobj-1.1/tests/unit-tests/src/test_mtllib.cpp
    description: "rapidobj::ParseFile/ParseStream(MaterialLibrary) 单元测试"
    command: "./unit-tests"
  - file: tests/func-tests/src/test_rapidobj.cpp
    source: rapidobj-1.1/tests/func-tests/src/test_rapidobj.cpp
    description: "12 个功能用例: color/cube/mario/primitives/sponza/teapot 及 triangulated 变体"
    command: "./func-tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: ParseStream 解析 cube.obj (8 顶点/12 三角形) + Triangulate"
    command: "./test_rapidobj"
  - file: test_ohos_quad.cpp
    description: "HarmonyOS 专项测试: quad 三角化几何等价验证 (Triangulate 前后属性逐位一致, quad->2 三角形), 覆盖 R02 FMA 根因"
    command: "./test_ohos_quad"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
