# test_package/MANIFEST.yml — 上游测试声明 (CI L0e 强制)
package: rutabaga/0.1.80
homepage: "https://github.com/magma-gpu/rutabaga_gfx"

# 上游测试命令（Rust cargo 单元测试；crate 内 autotests=false，无集成测试目标）
upstream_check_command: "cargo test --release --lib --target aarch64-unknown-linux-ohos"
upstream_test_in_build: true
upstream_test_command: "cargo test --release --lib --target aarch64-unknown-linux-ohos"

# 上游真实执行的测试（crate 内 8 个 #[test]，共 3 个模块）
# 逐项名称由 build() 中 `cargo test` 输出解析，以 HMBS_UPSTREAM_TEST_RESULT 标记为准。
upstream_tests:
  - file: src/rutabaga_core.rs
    source: rutabaga_gfx-0.1.80/src/rutabaga_core.rs
    description: "Rutabaga 核心 2D 快照/恢复单元测试（snapshot_restore_2d_no_resources, snapshot_restore_2d_one_resource）"
    command: "cargo test --release --lib --target aarch64-unknown-linux-ohos"
  - file: src/rutabaga_gralloc/formats.rs
    source: rutabaga_gfx-0.1.80/src/rutabaga_gralloc/formats.rs
    description: "DRM 像素格式与需求推导单元测试（format_debug, canonical_formats, canonical_planar_formats）"
    command: "cargo test --release --lib --target aarch64-unknown-linux-ohos"
  - file: src/rutabaga_gralloc/gralloc.rs
    source: rutabaga_gfx-0.1.80/src/rutabaga_gralloc/gralloc.rs
    description: "Gralloc 分配/映射单元测试（create_render_target, create_video_buffer, export_and_map）"
    command: "cargo test --release --lib --target aarch64-unknown-linux-ohos"

# test_package 自带的消费者测试（R34: 真实调用被测包 API）
test_package_tests:
  - file: consumer.rs
    description: "消费者测试：链接打包库，真实调用 DrmFormat/RutabagaBuilder/Rutabaga::snapshot/restore（4 项 CHECK-OK，其中 2 项为鸿蒙特有断言）"
    command: "./rutabaga_consumer_test"

# 测试断言总数（test_package 4；上游 cargo test 以真机实测 8 项为准）
assertion_count: 4
