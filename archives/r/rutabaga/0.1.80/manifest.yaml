version: "0.1.80"
software: "rutabaga"
status: built
build_date: "2026-10-01"
build_system: "custom"

source:
  url: "https://crates.io/api/v1/crates/rutabaga_gfx/0.1.80/download"
  sha256: "2817d168222af3c49269f583dd8e67429912953ae608f715fd97683ed50320a5"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "cargo build --release --target aarch64-unknown-linux-ohos"
    - "cargo test --release --lib --target aarch64-unknown-linux-ohos"
  dependencies:
    - rust-toolchain/1.97.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "rutabaga 0.1.80 == crates.io crate rutabaga_gfx 0.1.80（纯 Rust 图形半虚拟化库，librutabaga_gfx.rlib，无 C API、无二进制） — knowledge_ref: knowledge/drafts/rutabaga-0.1.80-rust-ohos-rlib-adaptation.md"
  - "OHOS loader 拒绝执行/加载未签名 ELF（EACCES / Permission denied / Error loading shared library）：cargo/rustc 与 librustc_driver*.so 必须 binary-sign-tool -selfSign 1 自签 — knowledge_ref: knowledge/drafts/rutabaga-0.1.80-rust-ohos-rlib-adaptation.md"
  - "rust-toolchain/1.97.1 包内 lib/rustlib 必须以真实目录复制，符号链接会导致 rustc 报 E0463 can't find crate for std — knowledge_ref: knowledge/drafts/rutabaga-0.1.80-rust-ohos-rlib-adaptation.md"
  - "cargo 1.97 动态链接 OpenSSL 且需要 SSL_get0_group_name（OPENSSL_3.2.0 版本符号）：设备镜像自带 OpenSSL 过旧，须用 Harmonybrew openssl@3-3.6.4 bottle 并加入 LD_LIBRARY_PATH；libz 取平台 /system/lib64/platformsdk（旧 harmonybrew zlib bottle 已 404） — knowledge_ref: knowledge/drafts/rutabaga-0.1.80-rust-ohos-rlib-adaptation.md"
  - "SDK 的 aarch64-unknown-linux-ohos-clang 是 /bin/sh 包装脚本，作为 rustc linker 时 exec 报 Permission denied 或 sysroot 推导错误（Scrt1.o/-lc 找不到）；须直接用 clang-15 ELF + --target aarch64-linux-ohos --sysroot=<sdk>/native/sysroot -D__MUSL__ — knowledge_ref: knowledge/drafts/rutabaga-0.1.80-rust-ohos-rlib-adaptation.md"
  - "上游单元测试：crate 注册 8 个 #[test]（autotests=false 无集成测试目标），cargo test --release --lib 实测 8 passed / 0 failed / 0 ignored — knowledge_ref: knowledge/drafts/rutabaga-0.1.80-rust-ohos-rlib-adaptation.md"
