# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: razercfg/0.44
homepage: "https://bues.ch/h/razercfg"

# 上游测试清点结论（R51）：
# razercfg 0.44 源码包无任何测试：
#   - 无 test/ tests/ 目录
#   - 根 CMakeLists.txt / librazer/CMakeLists.txt / razerd/CMakeLists.txt
#     无 enable_testing / add_test / CTest 注册
#   - README.md / HACKING.md 无测试运行说明
# 上游无测试，自研测试集见下方 test_package_tests。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "librazer 库级 API 断言（razer_strlcpy 边界/截断、UTF-16 长度、ASCII→UTF-16 转换）"
    command: "./test_razercfg"
  - file: conanfile.py
    description: "razerd 守护进程可运行性（-v 版本帮助输出）"
    command: "razerd -v"

# 测试断言总数（test.c 内 9 条 assert 语句，按逻辑场景归为 6 组：
# strlcpy 正常拷贝/截断/空串、utf16 长度、ascii→utf16 转换/终止符；
# 另含 razerd -v 运行验证 1 项）
assertion_count: 9
