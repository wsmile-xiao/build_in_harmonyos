build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=<conan_toolchain>"
    - "-DCMAKE_INCLUDE_PATH=<libusb>/include/libusb-1.0"
