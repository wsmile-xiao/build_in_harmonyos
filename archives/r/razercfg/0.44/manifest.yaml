    - "-DCMAKE_SHARED_LINKER_FLAGS=-L<libusb>/lib"
    - "-DCMAKE_EXE_LINKER_FLAGS=-L<libusb>/lib"
    - "-DRAZERCFG_PKG_BUILD=1"

  # 编译依赖列表（格式: name/version）
