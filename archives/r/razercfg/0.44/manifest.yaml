# 编译中学到的知识
knowledge_gained:
  - "CMake 4.1.2 不识别 HarmonyOS 平台，VERSION/SOVERSION 链接命名机制未应用，共享库无 SONAME；需 LINK_FLAGS 显式 -Wl,-soname + 可执行文件 -Wl,-rpath,$ORIGIN/../lib 修复（草稿 E000-draft-49C8）"
  - "上游 CMake 系统级安装（udev.rules/pm-hook/systemd）用 RAZERCFG_PKG_BUILD 环境变量保护，避免 conan 构建写 /etc 系统路径"
  - "razercfg 为库+工具混合型，package_type 须用 library + shared/fPIC（application 类型 CMakeDeps 不导出 cpp_info.libs）"

