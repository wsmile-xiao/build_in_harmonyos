patches:
  - patch_file: "patches/0001-src-resolv_wrapper.c.patch"
    patch_description: "OHOS/musl lack the thread-safe res_n* resolver API; bind libc's classic res_* symbols via dlsym and export wrapper-provided res_n* symbols."
    patch_type: "portability"
  - patch_file: "patches/0002-tests-CMakeLists.txt.patch"
    patch_description: "OHOS: force-include the res_n* compat shim and link the wrapper's exported symbols for the test executables."
    patch_type: "portability"
  - patch_file: "patches/0003-tests-test_dns_fake.c.patch"
    patch_description: "OHOS ns_initparse() rejects a buffer-size argument; pass the real reply length so all fake-DNS tests pass."
    patch_type: "portability"
