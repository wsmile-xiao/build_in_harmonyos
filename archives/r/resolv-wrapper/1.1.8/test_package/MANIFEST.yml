# test_package/MANIFEST.yml — resolv-wrapper 1.1.8
# 上游官方测试声明文件 (CI L0e 强制要求存在)

package: resolv-wrapper/1.1.8
homepage: "https://cwrap.org/resolv_wrapper.html"

# 上游测试命令 (仅 UNIT_TESTING=ON 时生成; CMake ctest)
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (UNIT_TESTING=ON)
upstream_tests:
  - file: tests/test_res_init.c
    source: resolv_wrapper-1.1.8/tests/test_res_init.c
    description: "res_init()/res_ninit() 与 resolv.conf 解析验证 (2 用例)"
    command: "./test_res_init"
  - file: tests/test_dns_fake.c
    source: resolv_wrapper-1.1.8/tests/test_dns_fake.c
    description: "DNS faking 应答构造验证 (16 用例: A/AAAA/SRV/URI/SOA/CNAME/PTR/TXT)"
    command: "./test_dns_fake"

# test_package 中的消费者用例 (调用库公开 API)
test_package_tests:
  - file: test.c
    description: "消费者用例: 调用 res_ninit/res_nquery/res_nclose 公开 API 做 fake A 查询并解析应答"
    command: "./test_resolv-wrapper"

# 测试断言总数 (近似)
assertion_count: 40
