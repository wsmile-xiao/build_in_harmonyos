# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "OHOS libc 只提供经典 res_init/res_query/res_search，无线程安全 res_n* 系列且 libresolv.a 为空壳；wrapper 需经 dlsym 绑定 libc 经典符号并对调用方导出自身 res_n* 符号"
  - "OHOS ns_initparse() 需真实应答长度而非缓冲区大小（传缓冲区大小 256 时 SRV 应答解析失败）"
  - "LD_PRELOAD interposer 内直接调用同名导出符号会递归拦截自身导致栈溢出，须 dlsym 绑定真实符号"

