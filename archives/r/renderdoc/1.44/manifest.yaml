knowledge_gained:
  - "HarmonyOS (musl libc) does not define RTLD_DEEPBIND; must define as 0 for compilation"
  - "plthook_elf.c uses glibc-specific dlinfo, dladdr1, _r_debug, RTLD_DL_LINKMAP not available on musl"
  - "All graphics APIs (GL, GLES, EGL, Vulkan) must be disabled on HarmonyOS due to missing headers/libs"
  - "Qt5 core modules (Qt5Core, Qt5Widgets, Qt5Gui, Qt5Svg, Qt5X11Extras) are not available"
  - "CMAKE_SYSTEM_NAME must be set to Linux for cmake to detect UNIX platform on HarmonyOS"
  - "X11/XCB/Wayland pkg-config packages are missing, so all windowing support must be disabled"
patches_applied:
  - "0001-linux-hook-musl-rtld-deepbind.patch"
