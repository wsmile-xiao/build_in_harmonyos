package: rulex/3.8.6
homepage: "https://github.com/poretsky/rulex"

upstream_tests_exist: true
upstream_test_audit: >-
  The official r3.8.6 source defines `make test` in the root and data
  Makefile.am files. It builds the complete six-dataset Berkeley DB lexicon,
  then lexholder checks every line of data/lexicon.test. The immutable tag
  archive contains exactly 430015 lines. A mismatch is written to
  data/lexicon.dump, so the recipe requires both a successful command and an
  empty dump. No upstream test source or expectation is modified.
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make -j1 test"
upstream_tests:
  - file: "data/lexicon.test"
    source: "rulex r3.8.6 official tag archive"
    description: "430015 Russian word/pronunciation records checked against the generated six-dataset lexicon"
    command: "lexholder -v -f lexicon.dump -t data/lexicon.test data/lexicon"
    discovered: 430015
    executed: 430015
    passed: 430015
    failed: 0
    skipped: 0
upstream_test_total: 430015
upstream_test_count_method: "one assertion per input record reported by lexholder"
upstream_test_passed: 430015
upstream_test_failed: 0
upstream_test_skipped: 0

test_package_tests:
  - file: "test_rulex.c"
    description: "18 real public C API assertions covering create, reopen modes, metadata, insert, retrieve, search, sequence, duplicate, remove and negative lookup"
    command: "test_rulex <consumer.db>"
    assertion_count: 18
  - file: "test_rulex.py"
    description: "Four HarmonyOS-specific locale fallback assertions plus a full rerun of all 430015 upstream records from the installed package"
    command: "python3 test_rulex.py <lexholder> <consumer.db> <rulex.db> <lexicon.test> <output-dir>"
    harmonyos_assertion_count: 4

upstream_assertion_count: 430015
test_package_assertion_count: 22
assertion_count: 430037
