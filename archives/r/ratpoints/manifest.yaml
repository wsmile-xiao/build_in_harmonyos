software: ratpoints
display: "ratpoints"
description: "Library and command-line program for finding rational points on hyperelliptic curves"
category: mathematics
homepage: "https://www.mathe2.uni-bayreuth.de/stoll/programs/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Build the upstream C sources directly with the compiler selected by the Conan profile"
    - "Correct the upstream static-library link order without modifying upstream sources"
    - "Run the complete 1000-curve upstream regression data set on OHOS armv8"
  common_dependencies:
    - "gmp/6.3.0.1"

versions:
  "2.1.3":
    status: built
    build_date: "2026-10-08"
    conan_ref: "ratpoints/2.1.3"
