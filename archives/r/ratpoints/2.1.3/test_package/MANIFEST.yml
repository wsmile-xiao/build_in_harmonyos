package: ratpoints/2.1.3
homepage: "https://www.mathe2.uni-bayreuth.de/stoll/programs/"

upstream_check_command: "make test"
upstream_tests_exist: true
upstream_test_audit: >
  ratpoints 2.1.3 ships rptest.c, testdata.h, and the expected-output file
  testbase. NUM_TEST is 1000. The recipe compiles the official rptest program,
  executes all 1000 curves, and byte-compares its 1000 output lines with
  testbase. The upstream Makefile only prints "Test failed" on mismatch, so
  the recipe performs a strict failing comparison instead.

upstream_test_in_build: true
upstream_test_command: "rptest > rptest.out && cmp testbase rptest.out"

upstream_tests:
  - file: rptest.c
    source: ratpoints-2.1.3/rptest.c
    description: "Official 1000-curve library regression harness"
    command: "./rptest > rptest.out && cmp testbase rptest.out"

test_package_tests:
  - file: test_ratpoints.c
    description: "Eight public API and algorithm assertions for x^2 - 1"
    command: "./test_ratpoints"
  - file: test_ratpoints.c
    description: "Two HarmonyOS arm64 ABI assertions for pointer and long width"
    command: "./test_ratpoints"
  - file: test_package/conanfile.py
    description: "Three installed CLI output assertions"
    command: "ratpoints '-1 0 1' 10"

upstream_test_case_count: 1000
assertion_count: 1013
