package: raku-log/0.3.1
homepage: "https://git.tyil.nl/raku/log"

# The v0.3.1 release archive and the v0.3.1 Git tag both contain no test
# directory, so there is no upstream suite to run or to modify.
upstream_tests:
  files_inventory: 0
  status: not_provided
  note: "The v0.3.1 upstream release archive and Git tag contain no test directory or test files."

# test_files counts every file that makes up the test entry; assertions counts
# only executable TAP assertions. File count (3) and assertion-bearing files (2)
# therefore intentionally differ.
test_package_tests:
  - file: test_module.raku
    description: "Validate the Log severity scale, role conformance, shared instance and the documented with-guard idiom"
    assertions: 6
  - file: test_ohos.raku
    description: "Validate HarmonyOS kernel identification and UTF-8 round trip on the HarmonyOS cache filesystem"
    assertions: 5
  - file: test_runner.py
    description: "Launch Raku tests with package runtime paths and an isolated writable temp directory"
    assertions: 0

test_files: 3
assertion_count: 11
