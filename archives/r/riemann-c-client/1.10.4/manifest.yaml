  source_work_dir: "/storage/Users/currentUser/tmp/riemann-c-client-1.10.4/pathtool/work"
  source_orig_hash: "f776cbeae1873b64"
  source_work_hash: "8bb0137c57762d7d"
  hash_method: "sha256(排序后的 sha256sum 清单) 前 16 位"
  generated_at: "2026-09-25T03:12:00+08:00"
  patches_count: 5
  # 三关门禁（止损先例 18）：NUL=0 ∧ @@ hunk≥1 ∧ patch_ng/patch 真 apply 后
