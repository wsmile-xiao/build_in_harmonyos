version: "1.10.4"
software: "riemann-c-client"
conan_ref: "riemann-c-client/1.10.4"

# 编译状态：published | built | failed | archived
# O5（AGENTS §1）：只有合并后 release upload 确认才 published，此阶段一律 built
status: built
build_date: "2026-09-25"
build_system: autotools

source:
  # 2026-09-25 换源（CI 下载面）：原官方 forge tag 归档在 CI worker 连续 2 轮
  # 返回非确定性坏字节；换用同一发行物的 Debian/Ubuntu 官方归档（内容树与
  # tag 树 diff -r 逐字节一致），sha256 按 Debian 官方 .dsc 公布值重锚。
  # 详情与三方取证见 conandata.yml 头部注释。
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/r/riemann-c-client/riemann-c-client_1.10.4.orig.tar.xz"
  sha256: "14b46c073a68401d57d2e309f992577dc9cd07b0da5c912ac30855acd4d9c879"
  tar_format: tar.xz

build:
  system: autotools
  # 上游默认双态构建（LT_INIT([shared])）；打包时按 shared 选项保留单态。
  # 双态原因：上游 Check 套件用测试对象覆盖库符号（tests/mocks.c 拦截
  # riemann_message_to_buffer 等），静态链接会 duplicate symbol——上游 CI
  # 正是链接共享对象通过的。
  configure_options:
    - "--enable-shared"
    - "--enable-static"
  dependencies:
    - "protobuf-c/1.5.1"
    - "gnutls/3.8.10"
    - "json-c/0.18"
  build_dependencies:
    - "autoconf/2.72"
    - "automake/1.18"
    - "libtool/2.5.4"
    - "pkgconf/3.0.6"
  test_dependencies:
    - "check/0.15.2"
  cc: clang
  cxx: clang++
  profile: "ci/conan/profiles/ohos-aarch64"

patches_applied:
  - "0001-configure.ac-protoc-c-optional.patch"
  - "0002-Makefile.am-use-pre-generated-pb-c.patch"
  - "0003-pre-generated-protobuf-c-sources.patch"
  - "0004-build-config.guess-ohos.patch"
  - "0005-Makefile.am-static-cli-link.patch"

knowledge_gained:
  - "OHOS 构建主机与 CI 均无 protoc-c：本机 bootstrap protoc-gen-c（protobuf/3.17.3 的 protoc + protobuf-c 1.5.1 源码构建插件）一次性生成 riemann.pb-c.[ch]，以补丁随包分发，configure/Makefile 改为拷贝（同族先例 ocserv 1.5.0）"  # knowledge_ref: knowledge/drafts/DRAFT-E725-ohos-protoc-c-pregenerated-pb-c.md
  - "ohpcd protobuf/3.17.3 的 protobuf-targets.cmake 在 INTERFACE_LINK_LIBRARIES 引用 zlib::zlib 却无 find_dependency：CMake 消费方报 target not found，用 -DCMAKE_PROJECT_INCLUDE 注入 zlib::zlib IMPORTED target shim 即可（本任务 protoc-gen-c bootstrap 实测）"  # knowledge_ref: knowledge/drafts/DRAFT-E725-ohos-protoc-c-pregenerated-pb-c.md
  - "ohpcd gnutls/libgcrypt 等包 conaninfo 标 shared=False 但实物只打包 .so：conftest/测试/CLI 全链路需 LD_LIBRARY_PATH 注入实测含 .so 的依赖 lib 目录；VirtualRunEnv 按声明选项生成会漏掉该目录"  # knowledge_ref: knowledge/drafts/DRAFT-E725-ohos-protoc-c-pregenerated-pb-c.md
  - "git archive 形态（无 configure/）的 autotools 老项目：bootstrap 后 automake 落盘的 config.guess 不识 uname -s=HarmonyOS——把补过 HarmonyOS 分支的 config.guess 作为新件入树补丁（automake --add-missing 不覆盖既有文件），config.sub 2024-05-27 已原生接受 linux-ohos 无需补"  # knowledge_ref: knowledge/drafts/DRAFT-E725-ohos-protoc-c-pregenerated-pb-c.md
  - "Check 套件靠测试对象覆盖库符号的项目（mock 拦截）静态链接必 duplicate symbol：双态构建让测试链接共享对象（上游原生形态），打包按选项留单态、CLI 用 per-target -static 钉静态归档"  # knowledge_ref: knowledge/drafts/DRAFT-E725-ohos-protoc-c-pregenerated-pb-c.md
  - "ohpcd 二进制包 .la 文件带 //lib 残留路径（prefix=/ DESTDIR bug，E236 族）：消费者侧修正器把 libdir/dependency_libs 改写为实际缓存路径（cattle-1.0/arm-none-eabi-gdb 先例），本任务修 libtasn1/libgcrypt/libgpg-error/gmp 四个 .la"  # knowledge_ref: knowledge/drafts/DRAFT-E725-ohos-protoc-c-pregenerated-pb-c.md

