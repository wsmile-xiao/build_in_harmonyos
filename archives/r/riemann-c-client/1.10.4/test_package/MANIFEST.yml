# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 数据来源：riemann-c-client 1.10.4 tag 源码树清点（2026-09-25）：
#   START_TEST == END_TEST == tcase_add_test 三口径逐文件一致，共 54 项；
#   ck_assert* 断言 374 项。

package: riemann-c-client/1.10.4
homepage: "https://git.madhouse-project.org/algernon/riemann-c-client"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"
# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "autotools.make(target='check') —— automake serial-tests，3 个 Check 程序，AM_TESTS_ENVIRONMENT 内 CK_FORK=no"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/check_libriemann.c
    source: riemann-c-client-1.10.4.tar.gz/tests/check_libriemann.c
    description: "核心库单元测试：library/attributes/queries/events/messages/client 六个 tcase，37 个用例"
    command: "./tests/check_libriemann"
  - file: tests/check_symver.c
    source: riemann-c-client-1.10.4.tar.gz/tests/check_symver.c
    description: "符号版本（RIEMANN_C_1.0 .symver）测试，2 个用例（HAVE_VERSIONING 下注册）"
    command: "./tests/check_symver"
  - file: tests/check_networked.c
    source: riemann-c-client-1.10.4.tar.gz/tests/check_networked.c
    description: "网络测试 15 个用例（含 2 个 TLS）——注册只由 RCC_NETWORK_TESTS 环境变量门控（网络测试用例仅在该变量非空非 0 时 suite_add_tcase），设备不设该变量即按上游默认跑空套件，15 项计 NOT_RUN；真实服务可用性是上游 CI 中这些用例的通过条件而非注册条件"
    command: "./tests/check_networked"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.c
    description: "消费者视角：头文件发现 + 静态链接 libriemann-client（含传递 protobuf-c）+ message 序列化冒烟（3 断言）"
    command: "./test_riemann-c-client"
  - file: test_package/conanfile.py (test())
    description: "鸿蒙特有：目标设备上执行 riemann-client --help / --version（CLI 可运行性，退出码 0）"
    command: "<package_folder>/bin/riemann-client --help"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 374
