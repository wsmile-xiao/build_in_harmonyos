# conandata.yml — riemann-c-client 1.10.4
#
# 上游为 git archive（无 configure/，protoc-c 生成物不入库）。
# - 三个补丁把 protoc-c 生成步骤替换为随包分发的预生成文件
#   （OHOS 构建主机与 CI 均无 protoc/protoc-c，先例 ocserv 1.5.0）。
#
# 源码获取（2026-09-25 换源留痕，PR #12547 CI 下载面返修）：
# - 原源为官方 forge 的 tag 归档（sha256 6b1e3aa6…，本机两次独立下载同值、
#   解包树与 tag 树 diff -r 逐字节一致，tag 归档 pax comment=1e381b97…）；
#   该归档在 CI worker 侧连续 2 轮返回非确定性坏字节（Provided 恒定、
#   Computed 两轮不同：a2ab3d19…→fb3db2e0…，build 60504/60512 跨 worker
#   同签名，前置 curl 三连败回落 conan 自下载），配方 sha 无错、属下载面问题。
# - 换用同一发行物的 Debian/Ubuntu 官方归档（.orig.tar.xz，上游 tag 树
#   gzip→xz 重压缩），三方取证后重锚 sha256：
#     ① 官方公布：Debian riemann-c-client_1.10.4-5.dsc 的 Checksums-Sha256
#        公布 14b46c07… = archive.ubuntu.com / mirrors.tuna / launchpad
#        +sourcefiles 三通道独立下载实测同值（54156 B）；
#     ② 内容同一：解包树 diff -r 与原源归档（= tag 树）57 文件逐字节一致；
#     ③ tag 关联：原源归档 pax comment=1e381b9769ac3427e3686edf91ef466d78b51fd7
#        == 上游 tag riemann-c-client-1.10.4 指向（git ls-remote 实测）。
# - 三条 URL 为同一字节的镜像回退（conan get() 列表语义：逐 URL 尝试至
#   sha256 校验通过；CI get_mirrors 镜像表不覆盖这些域，故手工列出）。

sources:
  "1.10.4":
    url:
      - "https://archive.ubuntu.com/ubuntu/pool/universe/r/riemann-c-client/riemann-c-client_1.10.4.orig.tar.xz"
      - "https://mirrors.tuna.tsinghua.edu.cn/ubuntu/pool/universe/r/riemann-c-client/riemann-c-client_1.10.4.orig.tar.xz"
      - "https://launchpad.net/ubuntu/+archive/primary/+sourcefiles/riemann-c-client/1.10.4-2/riemann-c-client_1.10.4.orig.tar.xz"
    sha256: "14b46c073a68401d57d2e309f992577dc9cd07b0da5c912ac30855acd4d9c879"

patches:
  "1.10.4":
    - patch_file: "patches/0001-configure.ac-protoc-c-optional.patch"
      patch_description: "configure.ac: treat a missing protoc-c as a warning and build from the shipped pre-generated protobuf-c sources"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0002-Makefile.am-use-pre-generated-pb-c.patch"
      patch_description: "Makefile.am: copy the shipped riemann.pb-c.[ch] instead of invoking protoc-c"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0003-pre-generated-protobuf-c-sources.patch"
      patch_description: "Add pre-generated lib/riemann/proto/riemann.pb-c.c/.h (protoc 3.17.3 + protoc-gen-c from protobuf-c 1.5.1)"
      patch_type: "portability"
      # /dev/null-source patch: paths are already root-relative, no stripping
      # (strip=1 would eat the leading `lib/` component — patch_ng quirk).
      strip: 0
    - patch_file: "patches/0004-build-config.guess-ohos.patch"
      patch_description: "config.guess (new aux file, automake 1.18 base): recognize HarmonyOS uname and emit aarch64-unknown-linux-ohos"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0005-Makefile.am-static-cli-link.patch"
      patch_description: "Makefile.am: link the riemann-client CLI against the static archive (package ships one library flavour; the Check suite itself links the shared object as upstream intends)"
      patch_type: "portability"
      strip: 1
