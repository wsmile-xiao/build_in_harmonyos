# 版本级 manifest — ruamel-yaml 0.19.1
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "0.19.1"

# 软件名
software: ruamel-yaml

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"
build_system: python

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（PyPI sdist）
  url: "https://files.pythonhosted.org/packages/c7/3b/ebda527b56beb90cb7652cb1c7e4f91f48649fbcd8d2eb2fb6e77cd3329b/ruamel_yaml-0.19.1.tar.gz"

  # 源码校验和（sha256，实测）
  sha256: "53eb66cd27849eff968ebf8f0bf61f46cdac2da1d1f3576dd4ccee9b25c31993"

  # 压缩格式
  compression: tar.gz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "ruamel.yaml-0.19.1"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional:
    - "ruamel.yaml.clib/clibz（extra=oldlibyaml/libyaml 可选 C 加速——默认不启用）"

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: "package_type=python-require；build() copytree 源码到源外 staging（/data/storage/el2/base/cache/ruamel-yaml-stage——OHOS /tmp 只读），package() 平铺复制为 ruamel/yaml/ 命名空间包 + 空 ruamel/__init__.py（pip 实测布局）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues:
    - "上游 test_deprecation.TestYamlTyp.test_full_rt 在 HarmonyOS 失败——平台包装层 _harmonyos_compat 替换 os.system，tag 断言 'posix.system' 不成立（平台行为差异，非适配缺陷）"
    - "上游 test_cyaml 3 个用例在纯 Python 运行时失败——clib 为可选 extra 默认未装，__with_libyaml__=False（设计内行为）"
  notes: "纯 Python 库，无 C 扩展，跨平台兼容性好；sdist 与 git tag 0.19.1（b6b5921）源码 36 文件逐一比对一致（README.md 除外，sdist 生成物）"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 442
  failed: 4
  note: |
    上游测试：_test/test_*.py（tox 官方入口）pytest 套件，HarmonyOS
    PC aarch64 真机实测 **472 收集 / 442 通过 / 4 失败 / 4 跳过 /
    22 xfail = 442/472（93.6%）**。
    失败明细（如实分类，均为平台/运行时环境差异，非适配缺陷）：
    - test_cyaml::test_load_cyaml / test_load_cyaml_1_2 /
      test_dump_cyaml_1_2 —— clib C 扩展为可选 extra 默认未装
      （__with_libyaml__=False），纯 Python 运行时按设计不启用
    - test_deprecation::TestYamlTyp.test_full_rt —— HarmonyOS
      包装层 _harmonyos_compat 替换 os.system，dump 出的 python/name
      tag 为 _harmonyos_compat._wrapped_os_system，'posix.system'
      断言不成立（平台行为差异）
    适配后：test_package 冒烟测试 test_ruamel_yaml.py（load +
    roundtrip）+ 鸿蒙特有测试 test_ohos_compat.py（4 用例：平台
    导入/注释保留 roundtrip/Unicode+CRLF/YAMLFile 真文件 IO）
    5/5 全过（100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ruamel.yaml 是纯 Python 命名空间包（ruamel/yaml/，需补空 ruamel/__init__.py）——pip 实测布局，零必需依赖"
  - "PyPI sdist 不含 _test/（上游 tar.gz 实测 0 个测试文件）——上游测试需从 git 仓库（SourceForge git 或 GitHub 镜像 pycontribs/ruamel-yaml）获取；sdist 与 tag 0.19.1 源码比对一致（36 文件 identical）"
  - "HarmonyOS 对 os.system 有 _harmonyos_compat 包装——依赖 os.system 类型名/行为的上游测试需按平台行为差异分类，不是适配缺陷"

references:
  - https://sourceforge.net/p/ruamel-yaml/
  - https://github.com/pycontribs/ruamel-yaml
