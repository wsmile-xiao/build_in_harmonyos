software: ruamel-yaml
display: "ruamel.yaml"
description: "YAML 1.2 解析器/生成器，支持注释保留 roundtrip（纯 Python，零必需依赖）"
category: foundation
homepage: "https://sourceforge.net/p/ruamel-yaml/"
license: MIT
build_system: python

ohos_adaptation:
  key_points:
    - "纯 Python 库零必需依赖（clib/clibz 仅 extra=oldlibyaml/libyaml 可选——默认不启用，纯 Python 运行时）"
    - "pip metadata 构建在 CI 不可靠——copytree 源码到源外 staging 目录，零编译"
    - "sdist 未打包 _test/ 测试套件（PyPI tar.gz 实测 0 个测试文件）——build() 阶段从 GitHub 镜像下载源码树真实执行 pytest 回填通过率"
    - "HarmonyOS 包装层 _harmonyos_compat 替换 os.system——上游 test_full_rt 的 tag 断言按平台行为差异失败（非适配缺陷，如实分类）"
  common_dependencies: []

versions:
  "0.19.1":
    status: built
    build_date: "2026-09-01"
    conan_ref: "ruamel-yaml/0.19.1"
