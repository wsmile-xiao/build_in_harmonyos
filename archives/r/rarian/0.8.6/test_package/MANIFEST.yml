package: rarian/0.8.6
homepage: "https://rarian.freedesktop.org/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# rule4: official upstream registration total (not a runnable subset).
# rarian 0.8.6 ships 8 libcheck suites in tests/ (check-main.c registers
# rarian_utils/reg_utils/list_utils/man/language/info/ht_utils/main) with
# 29 START_TEST cases total (2+2+3+10+2+4+2+4). Counted by grepping
# START_TEST over tests/check-*.c in the 0.8.6 tarball.
upstream_tests_exist: true
upstream_test_total: 29
upstream_test_count_method: autotools_tests
upstream_test_count_detail: "29 libcheck START_TEST cases (check-rarian-language.c 2 + check-rarian-ht-utils.c 2 + check-rarian-info.c 3 + check-rarian-utils.c 10 + check-rarian-reg-utils.c 2 + check-rarian-main.c 4 + check-rarian-list-utils.c 2 + check-rarian-man.c 4) in 1 automake TESTS program (tests/check_rarian); counted by grep START_TEST over the 0.8.6 tarball"
upstream_test_audit: "Upstream tests exist: tests/Makefile.am defines TESTS=check_rarian; tests/check-main.c registers 8 suites; 9 test sources contain 29 START_TEST cases. This recipe runs `make -j1 check` in build() and parses tests/check_rarian.log libcheck summary (Checks/Failures/Errors) as the single deterministic count source."

upstream_tests:
  - file: tests/check-main.c
    source: rarian-0.8.6/tests/check-main.c
    description: "libcheck runner registering 8 suites (utils/reg-utils/list-utils/man/language/info/ht-utils/main)"
    command: "make -j1 check"
  - file: tests/check-rarian-*.c
    source: rarian-0.8.6/tests/
    description: "29 START_TEST cases across 8 test sources executed via tests/check_rarian"
    command: "make -j1 check (parse tests/check_rarian.log Checks/Failures/Errors)"

test_package_tests:
  - file: test_rarian.c
    description: "Consumer links librarian and walks real APIs: info-categories query, registry/info/man foreach, shutdown sequence (7 CHECK-OK groups)"
    command: "./test_rarian"

assertion_count: 7
