software: rarian
version: "0.8.6"
status: built
build_system: autotools
build_date: "2026-09-24"
conan_ref: "rarian/0.8.6"

source:
  url: "https://gitlab.freedesktop.org/rarian/rarian/-/releases/0.8.6/downloads/assets/rarian-0.8.6.tar.bz2"
  sha256: "9d4f7873009d2e31b8b1ec762606b12bee5526e1fe75de48e9495382bfef2bea"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--disable-skdb-update"
    - "--disable-dependency-tracking"
    - "--with-check"
    - "--localstatedir=${prefix}/var"
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - tinyxml2 11.0.0 vendored from official upstream tarball (private static lib, no external requires; see notes.md issue 5)
    - check/0.15.2 (test_requires, upstream make check only)
    - pkgconf/3.0.5 (tool_requires, PKG_CHECK_MODULES for check)
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "RARIAN_LIBS is only -ltinyxml2; libxslt is not linked (xsltproc is an optional runtime helper for rarian-sk-extract, configure degrades gracefully)"
  - "Upstream tests are 29 libcheck START_TEST cases in a single automake TESTS program (tests/check_rarian); case counts come from check_rarian.log Checks/Failures/Errors line"
  - "Install runs rarian-sk-update when ENABLE_SKDB_UPDATE is on; --disable-skdb-update keeps Conan packaging side-effect free"
