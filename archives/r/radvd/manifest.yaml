# 软件级 manifest
# 文件位置: archives/r/radvd/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: radvd
display: "radvd"
description: "IPv6 Router Advertisement daemon (with radvdump diagnostic tool)"
category: network
homepage: "https://github.com/radvd-project/radvd"
license: BSD-4-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "官方 release 包自带预生成 configure / Makefile.in / config.h.in，但不含 gram.c / lex.yy.c ⇒ bison/flex 必须是 tool_requires"
    - "config.guess(2018-02-24) 不识别 uname -s=HarmonyOS、config.sub(2018-02-22) 的 OS 白名单不含 ohos ⇒ 补丁 0001/0002 补三元组 aarch64-unknown-linux-ohos"
    - "HMDFS 上 config.status 以 umask 077 建的 ./confXXXXXX 不可写 ⇒ could not setup config files machinery，补丁 0003 改 022（E011/E052/E112/E114/E129 家族）"
    - "includes.h 在 !__FreeBSD__ 下无条件 #include <bsd/string.h>，而 OHOS musl libc 自身已导出 strlcpy/strlcat ⇒ 补丁 0004 改为需显式 -DUSE_LIBBSD_STRLCPY，不新增依赖"
    - "Conan VPATH 外树构建下上游测试的 #include \"../config.h\"（补丁 0005）与字面量 test/test1.conf（build() 内 files.copy stage）两处数据/头错位 ⇒ 修好后 make check 由 17/36 变 36/36"
    - "RA 发送与 radvdump 抓包需 raw ICMPv6，鸿蒙 PC 无 CAP_NET_RAW ⇒ EPERM，属权限面，按未执行 + 证据申报，不缩测试分母"
    - "configure 的 netlink 探测在 OHOS musl sysroot 上因 sockaddr_storage 重定义失败 ⇒ HAVE_NETLINK 未定义，走 ioctl/getifaddrs 分支（上游自身降级分支，未用平台宏强开）"
  common_dependencies: []

versions:
  "2.20":
    status: built
    build_date: "2026-09-25"
    conan_ref: "radvd/2.20"
    note: "上游官方 tarball sha256 af37c5a8...4220 未做任何变更；本地取源靠 core.sources:download_cache 命中"
