package: radvd/2.20
homepage: "https://github.com/radvd-project/radvd"

upstream_check_command: "./configure --with-check && make && make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# ── 静态清点口径（R51 第 1 步：适配前先清点上游测试）────────────────
# 依据 Makefile.am 末段：
#     TESTS = check_all
#     check_PROGRAMS = check_all
#     check_all_SOURCES = test/print_safe_buffer.c test/check.c
#                         device-common.c interface.c log.c send.c timer.c util.c
# 以及 test/check.c main()：
#     SRunner *sr = srunner_create(util_suite());
#     srunner_add_suite(sr, send_suite());
# 用例注册数按 tcase_add_test 逐条数（与 START_TEST 定义数一致）：
#     test/util.c: 16 条（6 个 TCase：safe_buffer/safe_buffer_list/str/ion/presence/misc）
#     test/send.c: 20 条（2 个 TCase：update/build）
# ⇒ Suite = 2，TCase = 8，注册用例 = 36，automake TESTS 条目 = 1（check_all 单程序）。
# 前置条件：configure 必须带 --with-check；否则 Makefile.am 的
# `check:` 目标直接 `$(error libcheck not available)`（上游默认 with_check=no）。
# test/test_build.sh 不是测试：它是按发行版名 apt/apk/dnf 装构建依赖的引导脚本。
upstream_tests:
  - file: test/check.c
    source: radvd-2.20/test/check.c
    description: "libcheck 运行器 main()：组装 util_suite + send_suite 并跑 36 个注册用例"
    command: "./check_all"
  - file: test/util.c
    source: radvd-2.20/test/util.c
    description: "util_suite：safe_buffer/字符串/读写/presence/杂项，16 个注册用例"
    command: "./check_all -s util"
  - file: test/send.c
    source: radvd-2.20/test/send.c
    description: "send_suite：RA 报文构造与 lifetime 递减，20 个注册用例"
    command: "./check_all -s send"

upstream_test_ledger:
  n_static_registered: 36
  n_automake_TESTS_entries: 1
  suites: 2
  tcases: 8

test_package_tests:
  - file: test.sh
    description: >-
      消费者测试：定位 radvd 与 radvdump 两个已安装可执行文件；radvd -v 断言版本号
      含 2.20；radvd -h 断言 usage 含 --configtest 与 --nodaemon（证明 getopt_long
      分支已编进去）；radvd -c -C good.conf 断言合法配置解析返回 0（走 bison/flex
      生成的真实解析器）；两条反向断言——AdvSendAdvert maybe 与未知指令必须被拒
      （非 0 退出），证明解析器真在校验而不是空转；radvdump 喂未知长选项必须非 0。
      注意 radvd 的 -c 才是 configtest，-t 是 --chrootdir（勿混用）。
    command: "bash test.sh"

assertion_count: 7
assertion_count_note: >-
  test.sh 内 7 组逻辑断言（binary 定位 / -v 版本 / -h usage / 合法配置通过 /
  非法取值被拒 / 未知指令被拒 / radvdump 未知选项被拒）；消费者侧程序数 N_consumer=1。
  上游官方套件在 recipe build() 里以 make check 真跑（不是冒烟子集），
  实测数与五维账本记在 ../notes.md。
