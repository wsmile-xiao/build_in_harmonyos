sources:
  "2.20":
    url: "https://github.com/radvd-project/radvd/releases/download/v2.20/radvd-2.20.tar.gz"
    filename: "radvd-2.20.tar.gz"
    sha256: "af37c5a81d59f3bdc00d83056606ffa1810d4550beed6caa4f81181246494220"

patches:
  "2.20":
    - patch_file: "patches/0001-config.guess-ohos.patch"
      patch_description: >-
        config.guess（timestamp 2018-02-24）不识别 uname -s=HarmonyOS
        （HongMeng Kernel 1.12.0 / aarch64），configure 起手即
        "cannot guess build type; you must specify one"。加 HarmonyOS
        分支输出 aarch64-unknown-linux-ohos。注意本版 config.guess 的
        case 分支风格是 `echo ...; exit ;;`（不是新版 acpid/2022 的
        `GUESS=` 变量），照抄新版写法会命中分支却不输出、
        落到末尾 "unable to guess system type" 兜底 —— 实测踩过。
        验证：./config.guess 输出 aarch64-unknown-linux-ohos，RC=0。
      patch_type: "portability"
    - patch_file: "patches/0002-config.sub-ohos.patch"
      patch_description: >-
        config.sub（timestamp 2018-02-22）的两处 OS 白名单（KERNEL-OS
        组合表 + OS 后缀表）不含 ohos，导致上一步 guess 出来的
        aarch64-unknown-linux-ohos 被 AC_CANONICAL_* 判为
        "Invalid configuration ... system `ohos' not recognized"。
        补入 linux-ohos* / -linux-ohos* 后
        ./config.sub aarch64-unknown-linux-ohos 原样输出、RC=0。
        上游 configure.ac 的 arch 闸门按 case "$target" in *linux* 分派，
        该三元组含 linux ⇒ arch=linux，同时定义 _GNU_SOURCE（musl 下
        暴露 in6_pktinfo 必需）。
      patch_type: "portability"
    - patch_file: "patches/0003-configure-hmdfs-umask.patch"
      patch_description: >-
        HMDFS 上 config.status 以 `umask 077` 建的 ./confXXXXXX 临时目录不可写，
        写 subs1.awk 时报 "Permission denied" ⇒
        "config.status: error: could not setup config files machinery"
        （知识图谱 E011/E052/E112/E114/E129 家族；zile 2.6.4 补丁 0002 同法）。
        两处 umask 077 → 022。
      patch_type: "portability"
    - patch_file: "patches/0004-includes-h-libbsd-strlcpy.patch"
      patch_description: >-
        includes.h 在 !__FreeBSD__ 下无条件 #include <bsd/string.h>（libbsd 的
        strlcpy 兜底）。目标平台全盘没有任何 bsd/string.h，第一个 .c 即
        fatal error；而 libc 本身就导出 strlcpy/strlcat
        （nm -D libc.so ⇒ "T strlcpy"；sysroot <string.h> 有声明；
        只链 libc 的程序实测编译+运行通过；configure 的
        AC_SEARCH_LIBS(strlcpy, bsd) 也报 "none required"）。
        改成需要显式 -DUSE_LIBBSD_STRLCPY 才走 libbsd 路径，不新增依赖。
      patch_type: "portability"
    - patch_file: "patches/0005-test-config-h-vpath.patch"
      patch_description: >-
        test/print_safe_buffer.{c,h} 用 #include "../config.h" 取生成头。
        Conan 走 VPATH 外树构建（源码在 src/、config.h 生成在构建树），
        相对路径按包含者目录解析到源码根 ⇒ make check 起手即
        error: '../config.h' file not found。改成 #include "config.h"
        后由 -I/-I$(srcdir) 兜住，树内树外都成立；同目录的 test/check.c
        本来就是 "config.h" 写法，这里只是把两个漏网文件对齐。
      patch_type: "portability"
