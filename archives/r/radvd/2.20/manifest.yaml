# 版本级 manifest
# 文件位置: archives/r/radvd/2.20/manifest.yaml

version: "2.20"
software: "radvd"
status: built
build_date: "2026-09-25"
build_system: "autotools"
conan_ref: "radvd/2.20"

source:
  url: "https://github.com/radvd-project/radvd/releases/download/v2.20/radvd-2.20.tar.gz"
  sha256: "af37c5a81d59f3bdc00d83056606ffa1810d4550beed6caa4f81181246494220"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-check（打开上游 libcheck 测试套件；不带则 Makefile.am 的 check: 目标 $(error libcheck not available)）"
    - "其余为 AutotoolsToolchain 默认（--prefix/--build/--host/--target），参数最少化"
  dependencies: []
  build_dependencies:
    - bison/3.8.2
    - flex/2.6.4
  test_dependencies:
    - check/0.15.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess-ohos.patch"
  - "0002-config.sub-ohos.patch"
  - "0003-configure-hmdfs-umask.patch"
  - "0004-includes-h-libbsd-strlcpy.patch"
  - "0005-test-config-h-vpath.patch"

knowledge_gained:
  - "radvd 官方 release 包自带预生成 configure/Makefile.in，但不含 gram.c/lex.yy.c ⇒ bison/flex 必须是 tool_requires"
  - "上游 test/*.c 用字面量 test/test1.conf 读数据，Conan VPATH 外树构建下构建树无该文件 ⇒ libcheck 只跑到 17/36 并报 3 处 failure；package 前用 files.copy 把 test/*.conf stage 进构建树即 36/36，不动上游源码"
  - "includes.h 在 !__FreeBSD__ 下无条件 #include <bsd/string.h>；OHOS musl libc 自身已导出 strlcpy/strlcat（nm -D libc.so 有 T strlcpy，configure 的 AC_SEARCH_LIBS(strlcpy,bsd) 报 none required）⇒ 补丁改成需显式 -DUSE_LIBBSD_STRLCPY 才走 libbsd，不新增依赖"
  - "OHOS musl sysroot 上 <sys/socket.h> 与 <linux/netlink.h> 同含导致 sockaddr_storage 重定义（config.log:170-173），configure 的 netlink 探测判 no ⇒ HAVE_NETLINK 未定义（config.h:35），radvd 走 ioctl/getifaddrs 分支，属上游 configure.ac 自身的降级分支"
  - "本地 W3（ci/conan/build_and_test.sh）会把 conandata.yml 的单值 url 改写为含镜像前缀的列表，且 predl 备份发生在改写之后 ⇒ W3 跑完 conandata 必然残留 gh-proxy.com，提交前必须核对还原（本次即因该机制把 ghfast.top 误提交）"
