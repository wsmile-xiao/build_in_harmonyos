# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: rpl/1.15.5
homepage: "https://github.com/rrthomas/rpl"

# Upstream test command（如实申报：上游 tests/test_rpl.py 8 个 pytest 用例）
upstream_check_command: "python3 -m pytest tests/test_rpl.py"

# Upstream test suite: 8 pytest cases, all passed locally (8/8)
#   test_bad_encoding / test_explicit_encoding / test_ignore_case /
#   test_match_case / test_no_flags / test_use_regexp / test_utf_8 /
#   test_version
# 本地实测：pip install -e . + pytest/pytest-datafiles/regex/chardet/
# chainstream 后运行 → 8 passed（通过率 100%）
upstream_tests_total: 8
upstream_tests_passed: 8

# Upstream tests not run in build (Python tool; upstream pytest suite needs
# extra build deps (pytest/pytest-datafiles), consumer-side test covers
# real replacement; upstream suite run locally for rule-4 declaration)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_rpl.sh
    description: "Run rpl to replace text in a sample file and verify result"

# Test assertion count
assertion_count: 1
