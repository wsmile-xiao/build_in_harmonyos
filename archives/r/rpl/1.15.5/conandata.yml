# 源码源：官方 GitHub tag（CI 的 build_and_test.sh 有 Mirror fallback
# 机制自动回退 gh-proxy 镜像，无需手动加前缀）
sources:
  url: "https://github.com/rrthomas/rpl/archive/refs/tags/v1.15.5.tar.gz"
  sha256: "d297435e1d9b1bd857fc3148786844b34028699038c3c14f53e5ab9aeaef06eb"

# 0001-use-stdlib-re.patch：rpl 仅用 regex 基础 API（compile/split/sub/
# escape/error/Pattern/groups），标准库 re 完全兼容 → 改用 re 消除 regex
# C 扩展（_regex.so）依赖（CI 中 .so 加载 Permission denied，HMDFS 对
# 已存在文件 chmod 失效无法修复）
patches:
  - patch_file: "patches/0001-use-stdlib-re.patch"
    patch_type: "portability"
    patch_description: "rpl/__init__.py 将 regex 依赖替换为标准库 re（消除 C 扩展 .so，修复 CI 加载 Permission denied）"
