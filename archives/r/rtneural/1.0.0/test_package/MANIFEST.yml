# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rtneural/1.0.0
homepage: "https://github.com/jatinchowdhury18/RTNeural"

# 上游测试命令 — RTNeural BUILD_TESTS（accuracy tests，CPM 拉 googletest）
upstream_check_command: "cmake -DBUILD_TESTS=ON .. && cmake --build . && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-17 实测尝试记录）：
# - tests/functional/（12 个测试源：bad_model/conv2d/model/sample_rate_rnn/
#   templated/torch_*）——gtest 准确率测试
# - tests/unit/（activation_test 等）——gtest 单元测试
# - 实测受阻：CMake BUILD_TESTS 需 CPM 从 GitHub 下载 CPM.cmake +
#   googletest 1.14.0（网络超时 status 28，已尝试 3 次）；手动编译 gtest
#   测试遇 RTNeural 头文件 Layer 命名空间编译错误（activation.h 内
#   `Layer<T>` 未解析）——通过率无法实测，如实记录，待网络/编译环境
#   恢复后补测（不臆造通过率）
upstream_tests:
  - file: tests/functional/
    source: RTNeural-main/tests/functional/
    description: "上游 gtest 准确率测试（12 个测试源，BUILD_TESTS=ON 构建）"
    command: "cmake -DBUILD_TESTS=ON .. && cmake --build . && ctest"
  - file: tests/unit/
    source: RTNeural-main/tests/unit/
    description: "上游 gtest 单元测试（activation_test 等）"
    command: "cmake -DBUILD_TESTS=ON .. && cmake --build . && ctest"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_rtneural.cpp
    description: "消费者测试：DenseLayer 真实 forward（权重/偏置数学验证）+ ModelT 微型模型前向（R34 真实 API）"
    command: "clang++ test_rtneural.cpp -std=c++17 -I<include> -DRTNEURAL_STL=1 -o test_rtneural_cpp && ./test_rtneural_cpp"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
