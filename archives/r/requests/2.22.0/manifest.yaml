knowledge_gained:
  - "requests 2.22.0 的依赖范围（chardet>=3.0.2,<3.1.0 / idna>=2.5,<2.9 / urllib3>=1.21.1,<1.26）与 ohpcd 已发布版本（chardet 5.2.0 / idna 3.18 / urllib3 2.7.0）不符，但**实测可正常工作**：真实 HTTPS GET 200、重定向、Retry 配置、超时传播（ConnectTimeout）、idna 非 ASCII 域名编码全部通过。代价仅是 import 时一条 RequestsDependencyWarning（check_compatibility 的 assert 被 except 捕获）。用已发布新版可避免把 4 个遗留 pin 拖进依赖图。"
  - "上游测试 bootstrap（tests/__init__.py）`from urllib3.exceptions import SNIMissingWarning` 在 urllib3 2.x 已移除该符号 → 整个测试套件连 import 都失败（collected 0）。需补丁使其可选（try/except -> None + 条件 simplefilter）。注意 requests/ 运行时**不引用**该符号，补丁纯属测试侧。"
  - "requests 2.22.0 上游测试大量依赖外部服务与旧插件生态：test_requests.py 209 个 test 中 144 处依赖 httpbin 夹具（外部服务）+ mocker 夹具（pytest-mock）；test_utils.py 的 TestSuperLen 用 pytest pre-3.0 的 parametrize 写法（元组内嵌 pytest.mark.skipif(...)），现代 pytest 收集期即 TypeError: object of type 'MarkDecorator' has no len()——自足可跑子集为 test_structures/test_packages/test_hooks/test_testserver 四组（36 passed/1 skipped，最后一组由 requests 自带本地 test server 驱动）。"

