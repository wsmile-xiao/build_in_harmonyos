# conandata.yml — requests 2.22.0
# 源码来自 PyPI 官方文件托管（files.pythonhosted.org，R39 合规）

sources:
  url: "https://files.pythonhosted.org/packages/01/62/ddcf76d1d19885e8579acb1b1df26a852b03472c0e46d2b959a714c90608/requests-2.22.0.tar.gz"
  sha256: "11e007a8a2aa0323f5a921e9e6a2d7e4e67d9877e85773fba9ba6419025cbeb4"

patches:
  - patch_file: "patches/0001-tests-snimissingwarning-optional.patch"
    patch_description: "Make the upstream test bootstrap tolerate urllib3 2.x — SNIMissingWarning was removed there, so `from urllib3.exceptions import SNIMissingWarning` in tests/__init__.py made the whole suite un-importable."
    patch_type: "portability"

  # 测试可运行性：让上游套件在本平台尽可能多地真正跑起来（R51 覆盖度）。
  # 三处均为 test-only，requests/ 包本体零改动：
  #   1) tests/_shim_mocker.py（新增）—— 用 stdlib unittest.mock 提供
  #      pytest-mock 的 `mocker` 夹具（pytest-mock 未发布到 ohpcd，不能作为
  #      test_requires 引入；本套件只用到 patch / patch.dict / Mock 三处）；
  #   2) tests/conftest.py —— 引入上述 shim；httpbin 夹具在无 pytest-httpbin
  #      时降级为 skip（原本报 "recursive dependency involving fixture
  #      'httpbin'"，是 149 个 error 的根因）；
  #   3) tests/test_utils.py —— TestSuperLen 使用 pytest pre-3.0 的 parametrize
  #      写法（参数元组内嵌 pytest.mark.skipif），现代 pytest 收集期即报
  #      "object of type 'MarkDecorator' has no len()"，改用 pytest.param 表达
  #      同一 skipif 语义。
  - patch_file: "patches/0002-tests-pytest-mock-shim-and-modern-parametrize.patch"
    patch_description: "Make more of the upstream suite runnable: stdlib-based `mocker` fixture (pytest-mock is not on ohpcd), httpbin fixture degraded to skip when pytest-httpbin is absent, and the pre-3.0 parametrize idiom in test_utils.py modernised to pytest.param. Test-only; no change to the requests package itself."
    patch_type: "portability"
