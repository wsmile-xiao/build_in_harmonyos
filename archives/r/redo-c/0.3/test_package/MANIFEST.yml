# test_package/MANIFEST.yml

package: redo-c/0.3
homepage: "https://github.com/leahneukirchen/redo-c"

# 上游测试：redo-c 没有内建测试套件（无 tests/ 目录、无 ctest/pytest 注册、无 test framework 头文件）。
# 官方 tag 源码共 7 个文件（README.md、all.do、links.do、redo-sources、redo-targets、redo.c、redo.do），
# 其中 redo-sources/redo-targets 是辅助 shell 脚本，all.do/links.do/redo.do 是 redo 构建脚本。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: conanfile.py
    description: >
      消费者用例：安装产物 redo 可执行文件 + redo 的 .do 构建流程端到端运行 ——
      在临时目录创建 hello.do，调用 redo 构建目标 hello，校验目标文件内容。
      覆盖公开 CLI（redo）、公开构建语义（.do 文件驱动、$3 目标文件写入）。
    command: "conan test test_package -c tools.build:compiler_executables=... "
    case_count: 1
    assertion_count: 2

assertion_count: 2