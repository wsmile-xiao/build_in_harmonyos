# 版本级 manifest — rapidyaml 0.7.2
# 遵循 ARCHIVE-SPEC v2.0

version: "0.7.2"
software: "rapidyaml"
status: built
build_date: "2026-09-06"
build_system: "cmake"

source:
  url: "https://github.com/biojppm/rapidyaml/archive/refs/tags/v0.7.2.tar.gz"
  sha256: "0219147dfc8cb0ed9603fd3a36d76159a349873ff280311284f5b590323fbd63"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DRYML_BUILD_TESTS=OFF"
    - "-DRYML_BUILD_TOOLS=OFF"
    - "-DRYML_BUILD_BENCHMARKS=OFF"
    - "-DRYML_BUILD_API=OFF"
    - "-DRYML_INSTALL=ON"
  dependencies:
    - c4core/0.2.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-c4Project-harmonyos.patch"
  - "0002-cmake-c4Project-cmp0037.patch"

knowledge_gained:
  - "官方 GitHub tarball 不含 git 子模块内容：rapidyaml v0.7.2 的 ext/c4core（c4core v0.2.2）与其 cmake/、debugbreak/ 子模块均为空目录，必须在 conan 配方 export_sources 打包恢复"
  - "CMake >= 4.0 移除 cmake_policy(SET CMP0037 OLD)（target 名 test 保留字策略），需 if(CMAKE_VERSION VERSION_LESS 4.0) 版本守卫"
  - "c4core v0.2.2 的 c4Project.cmake c4_install_exports() 不识别 CMAKE_SYSTEM_NAME=HarmonyOS，需增加平台分支"