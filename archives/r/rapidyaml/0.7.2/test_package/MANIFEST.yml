# test_package/MANIFEST.yml
# 上游官方测试声明文件 (L0e 强制要求)
package: rapidyaml/0.7.2
homepage: "https://github.com/biojppm/rapidyaml"

# 上游测试命令 (ctest -N 与各 gtest 二进制 --gtest_list_tests 已实测)
upstream_check_command: "ctest --test-dir build-native/test; 各 ryml-test-* 二进制直接运行"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (57 个 ctest 目标, gtest 用例级 27069 全部通过)
upstream_tests:
  - file: test_parser.cpp 及其他 55 个用户测试源 + test_lib
    source: rapidyaml-0.7.2/test/
    description: "上游 gtest 套件: 57 个 ryml-test-* 可执行 (ctest 全过 57/57), 用例级 27069/27069 通过, 0 失败"
    command: "ctest --output-on-failure -j4 (或逐个 ryml-test-*-0.7.2)"

# test_package 中自带的测试 (消费者视角验证, R34 实质调用被测包 API)
test_package_tests:
  - file: main.cpp
    description: "消费者测试: 解析/遍历/修改/发射 YAML 并断言 round-trip 正确性"
    command: "./test_rapidyaml"

# 测试断言总数
assertion_count: 10