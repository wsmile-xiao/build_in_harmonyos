software: rcs
display: "GNU RCS"
description: "Revision Control System: manage multiple revisions of files"
category: build-tool
homepage: "https://www.gnu.org/software/rcs/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub need the linux-ohos triplet patches (E007/E072)"
    - "configure temp dirs use umask 022 (E011: HMDFS umask 077 breaks 0700 dirs)"
    - "/tmp is read-only on device; TMPDIR must be honored (tmpfile/maketemp patches)"
    - "device sessions have an empty LOGNAME and no passwd entry; getusername needs a non-empty LOGNAME for ci/co"
    - "HMDFS ignores chmod(2), so RCS read-only working files appear writable; upstream tests t790/t900/t999 cannot pass on-device"
    - "upstream test suite must run with `make check SHELL=<bash>`; system mksh heredocs/command substitution break on this device"
  common_dependencies:
    - "ed (configure-time only, via tool_requires)"

versions:
  "5.10.1":
    status: built
    build_date: "2026-09-07"
    conan_ref: "rcs/5.10.1"
