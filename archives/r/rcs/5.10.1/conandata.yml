sources:
  url: "https://deb.debian.org/debian/pool/main/r/rcs/rcs_5.10.1.orig.tar.xz"
  sha256: "37b5b39d2395ae21eb246d2ebf5ee242d54a72d11e8f8a3a4d818368e45a6bff"

patches:
  - patch_file: "patches/0001-recognize-ohos-triplet-config-guess.patch"
    patch_description: "Teach config.guess to report linux-ohos on HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0002-recognize-ohos-triplet-config-sub.patch"
    patch_description: "Teach config.sub to accept linux-ohos triplets"
    patch_type: "portability"
  - patch_file: "patches/0003-use-readable-configure-tempdirs.patch"
    patch_description: "Avoid 0700 configure temp directories on HMDFS"
    patch_type: "portability"
  - patch_file: "patches/0004-treat-empty-login-as-unset.patch"
    patch_description: "Treat empty LOGNAME/USER/getlogin_r results as unset so later identity sources are tried"
    patch_type: "portability"
  - patch_file: "patches/0005-honor-tmpdir-in-tmpfile.patch"
    patch_description: "Make rcs tmpfile(3) users honor TMPDIR because /tmp is read-only on HMDFS"
    patch_type: "portability"
  - patch_file: "patches/0006-fallback-tempdir-to-cwd.patch"
    patch_description: "Fall back to cwd when the system temporary directory cannot host mkstemp files"
    patch_type: "portability"
