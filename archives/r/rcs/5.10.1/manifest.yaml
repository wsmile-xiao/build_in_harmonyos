version: "5.10.1"
status: built
build_date: "2026-09-07"
conan_ref: "rcs/5.10.1"

source:
  url: "https://deb.debian.org/debian/pool/main/r/rcs/rcs_5.10.1.orig.tar.xz"
  sha256: "37b5b39d2395ae21eb246d2ebf5ee242d54a72d11e8f8a3a4d818368e45a6bff"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--prefix=/"
    - "--bindir=${prefix}/bin"
    - "--sbindir=${prefix}/bin"
    - "--libdir=${prefix}/lib"
    - "--includedir=${prefix}/include"
    - "--oldincludedir=${prefix}/include"
    - "--datarootdir=${prefix}/res"
    - "--disable-dependency-tracking"
    - "--disable-silent-rules"
    - "--disable-suid"
  dependencies:
    - "ed/1.20 (tool_requires: configure requires an ed program; unused at runtime when diff3 is sane)"
  cc: /data/service/hnp/bin/clang
  cxx: /data/service/hnp/bin/clang++

patches_applied:
  - "0001-recognize-ohos-triplet-config-guess.patch"
  - "0002-recognize-ohos-triplet-config-sub.patch"
  - "0003-use-readable-configure-tempdirs.patch"
  - "0004-treat-empty-login-as-unset.patch"
  - "0005-honor-tmpdir-in-tmpfile.patch"
  - "0006-fallback-tempdir-to-cwd.patch"

knowledge_gained:
  - "HMDFS ignores chmod(2): RCS read-only working files always appear writable, so t790/t900/t999 cannot pass on-device"
  - "getlogin_r returns success with an empty string and /etc/passwd has no entry for HMDFS uids; LOGNAME must be non-empty for ci/co lock operations"
  - "/tmp is read-only on device; TMPDIR-honoring and cwd-fallback temp file patches keep rcs usable when TMPDIR is unset"
  - "GNU make ignores $SHELL from the environment; tests must run with `make check SHELL=<bash>` so mksh heredoc/substitution quirks are avoided"
  - "bash calls getcwd(3) only when its PWD env is inconsistent with cwd, and conan-spawned processes get ENOTSUP from getcwd(3) on HMDFS; recipe keeps PWD env fresh (os.environ['PWD'], and `cd tests && PWD=... make check` inside the tests leaf) so test output stays clean"
