package: rcs/5.10.1
homepage: "https://www.gnu.org/software/rcs/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check MAKEINFO=true SHELL=<bash> (run in build() on OHOS; gated on 60/63 passes with the 3 HMDFS-chmod-affected tests t790/t900/t999 tolerated)"

upstream_tests:
  - file: tests/Makefile.am
    source: rcs-5.10.1/tests/Makefile.am
    description: "Upstream test suite: 63 pure POSIX shell tests (t010-t999) driven by automake's serial harness; no perl/Expect/ed needed."
    command: "make -j1 check MAKEINFO=true SHELL=/data/service/hnp/bin/bash"

test_package_tests:
  - file: test.sh
    description: "Consumer test asserts --version for all 9 commands and performs a real ci/co/rcsdiff/rlog/ident/rcsclean/rcsmerge round trip on a live ,v repository."
    command: "sh test.sh"

assertion_count: 18
test_modifications:
  - "No upstream tests are modified or removed."
  - "On OHOS, build() runs the full upstream make check and fails on any unexpected failure; only t790/t900/t999 are tolerated, each traced to HMDFS ignoring chmod(2) (read-only working files cannot be represented). Evidence: build log upstream-check.log, device validation 60/63 PASS."
  - "MAKEINFO=true prevents makeinfo from rebuilding prebuilt doc/rcs.info; SHELL=<bash> prevents the system mksh (whose heredocs/command substitution break on device) from running the tests."
