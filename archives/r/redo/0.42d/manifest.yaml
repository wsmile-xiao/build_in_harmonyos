software: redo
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.42d/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.42d"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/apenwarr/redo/archive/refs/tags/redo-0.42d.tar.gz"

  # 源码校验和
  sha256: "47056b429ff5f85f593dcba21bae7bc6a16208a56b189424eae3de5f2e79abc1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: redo

  # 配置选项列表
  configure_options:
    - "DESTDIR=$TEST_PREFIX"
    - "PREFIX=$DEFAULT_PREFIX"
    - "./do install"
  # 实际构建命令: ./do -j$(nproc) test && DESTDIR=$TEST_PREFIX PREFIX=$DEFAULT_PREFIX ./do install

  # 编译依赖列表（格式: name/version）
  dependencies:
    - python/3.x
    - bash/5.x
    - zsh/5.x
  # redo 是 Python 项目，需要 Python 和兼容的 shell

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "redo 使用自身的构建系统 ./do，无需 configure"
  - "测试套件耗时较长（5分钟超时），但可后台继续完成"
  - "安装需要设置 DESTDIR 和 PREFIX 环境变量"
  - "缺少 markdown Python 模块不影响核心功能（仅影响 manpage 生成）"
  - "shell 检测机制会自动选择兼容的 shell（zsh 在 HongMeng 上可用）"
  - "GIT_DISCOVERY_ACROSS_FILESYSTEM 环境限制通过 fallback 机制处理"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
