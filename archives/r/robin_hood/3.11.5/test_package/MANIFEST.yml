# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: robin_hood/3.11.5
homepage: "https://github.com/martinus/robin-hood-hashing"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: "cmake --build . --target rh && ./rh --duration=true"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (doctest 单元测试套件)
upstream_tests:
  - file: src/test/unit/main.cpp
    source: robin-hood-hashing-3.11.5/src/test/unit/main.cpp
    description: "doctest 入口，汇总全部单元测试（129 用例 / 2165108 断言）"
    command: "./rh --duration=true"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：robin_hood::unordered_map + unordered_set 插入/查找/成员验证"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2165108
