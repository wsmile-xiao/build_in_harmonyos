package: raku-protocol-mqtt/0.0.4
homepage: "https://github.com/Leont/raku-protocol-mqtt"

upstream_test_in_build: true
upstream_test_command: "run each of t/01-filter.rakutest, t/02-messages.rakutest, t/03-dispatcher.rakutest and t/04-client.rakutest with raku -Ilib"
upstream_tests:
  - path: "t/*.rakutest"
    framework: "Raku Test / TAP"
    file_count: 4
    assertion_count: 185
    note: "All upstream tests run; no upstream test is modified or skipped"

test_package_tests:
  - file: test_mqtt.raku
    description: "Import version 0.0.4 and verify CONNECT/PUBLISH wire encoding, PUBLISH decoding, topic filters and malformed Remaining Length rejection"
    command: "raku test_mqtt.raku"
  - file: test_mqtt.py
    description: "Assert ten exact consumer behavior results"
    command: "python3 test_mqtt.py raku test_mqtt.raku"

assertion_count: 10
