  sha256: "8f6af8046ee6b0293b26389d08cb6950c7f7ddfffc1f74eefcb087bd49d44f62"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$PREFIX"
  dependencies:
    - perl/5.42.2
    - rsync/3.3.0
    - openssh/10.0p1
  compiler: clang

patches_applied: []

knowledge_gained:
  - "rsnapshot 为纯 Perl 脚本工具（零 C 编译），configure 仅做解释器/工具路径探测与替换"
  - "E114 同类：HMDFS 上 config.status 的 mktemp -d ./confXXXXXX 失败，需 --no-create + 重定向临时目录 + bash config.status（对齐 rsync 配方做法）"
  - "E049：安装后脚本 shebang 改为 #!/usr/bin/env perl，避免固化构建机 perl 绝对路径"
  - "本机（HMFS）所有可写文件系统均不支持硬链接，上游 9/63 子测试失败皆因 link() Operation not permitted——平台限制，非功能缺陷"

