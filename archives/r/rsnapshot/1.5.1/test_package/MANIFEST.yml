# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rsnapshot/1.5.1
homepage: "https://rsnapshot.org/"

# 上游测试命令
upstream_check_command: "make test"

upstream_test_in_build: false
upstream_test_command: ""

# 上游测试套件: t/ 目录 17 个测试程序 / 63 子测试（Test::Harness）
# 本机（HMDFS 文件系统）实测 54/63 通过（85.7%）；
# 9 个失败子测试全部源于 HMDFS 不支持硬链接（link(): Operation not permitted，
# E046 平台限制），rsnapshot 核心快照机制依赖硬链接，在支持硬链接的文件系统
# （如 CI worker 的 ext4/tmpfs 或真机本地存储）上可全部通过。
upstream_tests:
  - file: t/cmd-post_pre-exec/cmd-post_pre-exec.t
    source: rsnapshot-1.5.1/t/cmd-post_pre-exec/cmd-post_pre-exec.t
    description: "cmd_postexec 钩子执行测试（4 子测试，3 通过，1 失败=硬链接限制）"
  - file: t/configtest/configtest.t
    source: rsnapshot-1.5.1/t/configtest/configtest.t
    description: "配置文件解析测试"
  - file: t/gnu_cp_al/gnu_cp_al.t
    source: rsnapshot-1.5.1/t/gnu_cp_al/gnu_cp_al.t
    description: "GNU cp -al 快照链接测试"
  - file: t/include/include.t
    source: rsnapshot-1.5.1/t/include/include.t
    description: "include_conf 指令测试"
  - file: t/link-dest_-t_when_only_one_snapshot/link-dest_-t_when_only_one_snapshot.t
    source: rsnapshot-1.5.1/t/link-dest_-t_when_only_one_snapshot/
    description: "link_dest 时间戳参数测试"
  - file: t/long_and_short_args/long_and_short_args.t
    source: rsnapshot-1.5.1/t/long_and_short_args/long_and_short_args.t
    description: "长/短命令行参数测试"
  - file: t/numtries/numtries.t
    source: rsnapshot-1.5.1/t/numtries/numtries.t
    description: "rsync 重试次数测试"
  - file: t/rsnapshot_meta/rsnapshot_meta.t
    source: rsnapshot-1.5.1/t/rsnapshot_meta/rsnapshot_meta.t
    description: "元数据目录生成测试"
  - file: t/rsync/rsync.t
    source: rsnapshot-1.5.1/t/rsync/rsync.t
    description: "rsync 快照基础功能测试"
  - file: t/ssh_args/ssh_args.t
    source: rsnapshot-1.5.1/t/ssh_args/ssh_args.t
    description: "ssh_args 参数传递测试"
  - file: t/backup_exec/backup_exec.t
    source: rsnapshot-1.5.1/t/backup_exec/backup_exec.t
    description: "backup_exec 脚本备份测试"
  - file: t/backup_script/backup_script.t
    source: rsnapshot-1.5.1/t/backup_script/backup_script.t
    description: "backup_script 脚本备份测试"
  - file: t/rsync-exitcode/rsync-exitcode.t
    source: rsnapshot-1.5.1/t/rsync-exitcode/rsync-exitcode.t
    description: "rsync 退出码处理测试（2 子测试，1 失败=硬链接限制）"
  - file: t/rsync_wait_between_tries/rsync_wait_between_tries.t
    source: rsnapshot-1.5.1/t/rsync_wait_between_tries/
    description: "rsync 重试等待间隔测试"
  - file: t/native_cp_al/native_cp_al.t
    source: rsnapshot-1.5.1/t/native_cp_al/native_cp_al.t
    description: "原生 cp -al 测试（6 子测试，5 通过，1 失败=硬链接限制）"
  - file: t/relative_delete_bugfix/relative_delete_bugfix.t
    source: rsnapshot-1.5.1/t/relative_delete_bugfix/
    description: "相对路径删除修复测试（7 子测试，6 通过，1 失败=硬链接限制）"
  - file: t/rotate_only_when_0_avail/rotate_only_when_0_avail.t
    source: rsnapshot-1.5.1/t/rotate_only_when_0_avail/
    description: "轮转条件测试（11 子测试，8 通过，3 失败=硬链接限制）"
  - file: t/snapshot_root_with_space/snapshot_root_with_space.t
    source: rsnapshot-1.5.1/t/snapshot_root_with_space/
    description: "含空格快照根路径测试（5 子测试，4 通过，1 失败=硬链接限制）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py (test())
    description: "运行 rsnapshot --version / configtest，并执行一次真实 hourly 快照备份，验证 hourly.0/localhost/data 内容落地（R34 合规）"
    command: "rsnapshot configtest && rsnapshot hourly"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 65
