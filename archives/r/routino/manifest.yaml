software: routino
display: "routino"
description: "OpenStreetMap 路由软件：router/planetsplitter 工具与 libroutino 路由库"
category: library
homepage: "https://www.routino.org/"
license: AGPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "自定义 Makefile（Makefile.conf），无 configure；编译器经 generate() 注入 conanbuild 环境"
    - "FASTMATHS=0 关闭 -ffast-math，保证路由测试严格比对"
    - "HMDFS 无 symlink：OHOS 只出静态包（validate 拒绝 shared），测试用实文件拷贝代替 soname 链接"
    - "只打包 src（库+工具）与 xml（路由数据）；web 为演示站，python 绑定需 swig"
  common_dependencies:
    - zlib
    - bzip2

versions:
  "3.4.3":
    status: built
    build_date: "2026-09-27"
