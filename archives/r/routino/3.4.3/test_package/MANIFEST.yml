# test_package/MANIFEST.yml for routino 3.4.3
package: routino/3.4.3
homepage: "https://www.routino.org/"

# Upstream suites: src/test/run-all-tests.sh matrix + src/xml test-skeleton.
# conanfile.py build() drives both and counts process exit codes only.
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "run-one-test.sh (15 osm x 6 configs) + diff x3 + test-skeleton (1 good + 32 bad)"

# 15 OSM routing fixtures; each runs in 6 configs (normal/lib/pruned x
# non-slim/slim) via run-one-test.sh, exit code decides pass/fail.
upstream_tests:
  - file: src/test/coincident-waypoint.sh
    source: routino-3.4.3.tgz/src/test/coincident-waypoint.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh coincident-waypoint.sh {fat,slim} [{lib,prune}]"
  - file: src/test/cycle-both-ways.sh
    source: routino-3.4.3.tgz/src/test/cycle-both-ways.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh cycle-both-ways.sh {fat,slim} [{lib,prune}]"
  - file: src/test/dead-ends.sh
    source: routino-3.4.3.tgz/src/test/dead-ends.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh dead-ends.sh {fat,slim} [{lib,prune}]"
  - file: src/test/fake-node-with-loop.sh
    source: routino-3.4.3.tgz/src/test/fake-node-with-loop.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh fake-node-with-loop.sh {fat,slim} [{lib,prune}]"
  - file: src/test/invalid-turn-relations.sh
    source: routino-3.4.3.tgz/src/test/invalid-turn-relations.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh invalid-turn-relations.sh {fat,slim} [{lib,prune}]"
  - file: src/test/loop-and-reverse.sh
    source: routino-3.4.3.tgz/src/test/loop-and-reverse.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh loop-and-reverse.sh {fat,slim} [{lib,prune}]"
  - file: src/test/loops.sh
    source: routino-3.4.3.tgz/src/test/loops.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh loops.sh {fat,slim} [{lib,prune}]"
  - file: src/test/no-super.sh
    source: routino-3.4.3.tgz/src/test/no-super.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh no-super.sh {fat,slim} [{lib,prune}]"
  - file: src/test/node-restrictions.sh
    source: routino-3.4.3.tgz/src/test/node-restrictions.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh node-restrictions.sh {fat,slim} [{lib,prune}]"
  - file: src/test/oneway-loop.sh
    source: routino-3.4.3.tgz/src/test/oneway-loop.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh oneway-loop.sh {fat,slim} [{lib,prune}]"
  - file: src/test/prune-short.sh
    source: routino-3.4.3.tgz/src/test/prune-short.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh prune-short.sh {fat,slim} [{lib,prune}]"
  - file: src/test/prune-straight.sh
    source: routino-3.4.3.tgz/src/test/prune-straight.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh prune-straight.sh {fat,slim} [{lib,prune}]"
  - file: src/test/roundabout-waypoints.sh
    source: routino-3.4.3.tgz/src/test/roundabout-waypoints.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh roundabout-waypoints.sh {fat,slim} [{lib,prune}]"
  - file: src/test/super-or-not.sh
    source: routino-3.4.3.tgz/src/test/super-or-not.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh super-or-not.sh {fat,slim} [{lib,prune}]"
  - file: src/test/turns.sh
    source: routino-3.4.3.tgz/src/test/turns.sh
    description: "OSM routing fixture + expected/ outputs, 6 configs"
    command: "run-one-test.sh turns.sh {fat,slim} [{lib,prune}]"
  - file: src/xml/test-skeleton
    source: routino-3.4.3.tgz/src/xml/test/good.xml + 32 bad*.xml
    description: "XML parser checks: good must parse, bad must be rejected"
    command: "./test-skeleton < test/{good,bad}*.xml"

test_package_tests:
  - file: test_routino.c
    description: "consumer test: CheckAPIVersion rc, LoadDatabase error path, constants"
    command: "./test_routino"

# 90 routing runs (15 osm x 6) + 3 slim-vs-fat diffs + 33 xml checks
# (1 good + 32 bad) = 126. python/ bindings tests are swig-gated upstream
# (HAVE_SWIG) and not counted. No upstream test is modified.
upstream_test_total: 126
upstream_test_count_method: "auto"
upstream_test_audit: >-
  Tarball audit (routino-3.4.3.tgz, 1270 entries, sha256 verified):
  src/test contains 23 *.sh = 15 *.osm fixtures each with a matching
  *.sh and expected/*.txt outputs + 6 helper scripts (a-b.sh, a-b-c.sh,
  a-b-c-d.sh, cycle-drive.sh, only-split.sh, start-1-finish.sh, called
  by fixtures, not independent) + 2 runners (run-all-tests.sh,
  run-one-test.sh, not counted). Non-runner scripts = 21, matching the
  reviewer file-count N=21; expanded runs = 15 x 6 configs
  (normal/lib/pruned x non-slim/slim via run-all-tests.sh type 1/2/3) =
  90, plus 3 fat-vs-slim diff comparisons = 93. src/xml test corpus =
  test/good*.xml (1 file, must parse) + test/bad*.xml (32 files, must be
  rejected) = 33 via test-skeleton. Total 126 run units (93 + 33).
  Method auto: single shell harness; every unit is one subprocess whose
  exit code decides pass/fail (run-one-test.sh/test-skeleton/diff return
  codes), never from counting stdout words; no fallback arithmetic.
  python/ bindings tests are gated upstream on swig (Makefile: test only
  if HAVE_SWIG and HAVE_PYTHON) and excluded with reason, not zeroed.

test_counting:
  upstream_independent_total: 126
  integration_independent_total: 3
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 3
# 126 upstream run verdicts (one assertion each: exit-code pass/fail) +
# 7 CHECK assertions in test_routino.c.
assertion_count: 133
