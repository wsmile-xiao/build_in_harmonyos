# test_package/MANIFEST.yml
# 上游官方测试声明文件
# restclient-cpp 0.5.3 上游测试：test/ 下 3 个 gtest 源文件，经 CMake 的
# gtest_discover_tests 注册为 ctest 用例；配方 build() 内用回环替身
# （test/loopback_httpbin.py）真实执行，不依赖公网 httpbin/squid。

package: restclient-cpp/0.5.3
homepage: "https://github.com/mrtazz/restclient-cpp"

# 上游测试注册入口（用于 ctest -N 静态复核，配方内有硬门禁）
upstream_check_command: "ctest --test-dir <build> -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: >-
  ctest --test-dir <build> -E RestClientTest.TestRestClientGETHTTP2Code
  --timeout 60 --output-on-failure

# 上游实际运行的测试程序（静态活跃用例 26 + 22 + 3 = 51）
upstream_tests:
  - file: test/test_restclient.cc
    source: restclient-cpp-0.5.3/test/test_restclient.cc
    description: "RestClientTest 夹具 26 例 — 自由函数 get/post/put/patch/delete/head/options 的状态码、响应体、响应头与失败码"
    command: "ctest -R '^RestClientTest\\.'"
  - file: test/test_connection.cc
    source: restclient-cpp-0.5.3/test/test_connection.cc
    description: "ConnectionTest 16 例（超时/重试/头设置/进度回调/写回调/信号/代理参数）+ ConnectionTestRemote 6 例（TLS 校验、CA 加载、insecure、代理 CONNECT）；另有 1 例 TestSSLCert 在上游源码中即被注释掉，不计入静态数"
    command: "ctest -R '^ConnectionTest'"
  - file: test/test_helpers.cc
    source: restclient-cpp-0.5.3/test/test_helpers.cc
    description: "HelpersTest 3 例 — TrimBoth/TrimLeft/TrimRight 字符串裁剪"
    command: "ctest -R '^HelpersTest\\.'"

# 未执行项（逐项披露，不改判为通过，也不删除用例）
excluded_cases:
  - name: RestClientTest.TestRestClientGETHTTP2Code
    stage: excluded
    reason: "需要与公网主机完成 HTTP/2 协商；回环替身不提供 HTTP/2，构建与 CI 环境均无公网出口"
skipped_cases:
  - name: RestClientTest.TestRestClientOPTIONSCode
    stage: upstream-gtest-skip
    reason: "上游源码内 GTEST_SKIP()，注释理由是 httpbin 不支持 OPTIONS 且原目标为公网 api.reqbin.com；本次沿用上游判断未改判"

# test_package 自带的消费者测试（编译 + 链接 + 运行已安装库并断言行为）
test_package_tests:
  - file: test_package.cpp
    description: "以库使用者身份调用 RestClient::init/get/head/post、Connection::SetHeaders/GetInfo/get、RestClient::disable，对 15 条公开 API 行为断言取退出码"
    command: "test_package <loopback-base-url>"

# 上游静态声明的活跃用例总数（N_static）
assertion_count: 51
# 消费者断言条数（N_consumer）
consumer_assertion_count: 15

# 真机 conan create 实测（build() 内 ctest 汇总，与 notes.md / manifest.yaml / PR 正文同源）
registered_count: 51          # ctest -N 复核值，配方内有 == 51 的硬门禁
executed_count: 50            # 51 - 1 例公网 HTTP/2 用例（excluded_cases）
passed_count: 50
failed_count: 0
upstream_skipped_count: 1     # skipped_cases：上游自带 GTEST_SKIP

# 资源证据（conan create 真机两轮，memcap-run 汇总整个进程组峰值；预算 4000MB）
max_rss_mb: 333
