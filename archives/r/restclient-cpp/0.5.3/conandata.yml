sources:
  url: "https://github.com/mrtazz/restclient-cpp/archive/refs/tags/0.5.3.tar.gz"
  sha256: "ca450e15d9b9724234d234686f22862eef97b776cbebb433382830974949d6f2"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    strip: 1
    patch_description: "test-program 改用 Conan 提供的 GTest::gtest 与 jsoncpp 导入目标，注入回环 TLS CA 路径，不再编译 vendor/jsoncpp-0.10.5"
    patch_type: "portability"
  - patch_file: "patches/0002-test-test_connection.cc.patch"
    strip: 1
    patch_description: "ConnectionTestRemote 端点由公网 https://httpbin.org 改为回环 TLS 端点并加载本地测试 CA；TestInvalidProxy 的 curl 错误文案断言放宽为两种拼写都接受"
    patch_type: "portability"
  - patch_file: "patches/0003-test-test_restclient.cc.patch"
    strip: 1
    patch_description: "TestRestClientGETFailureCode 的 CURLE_COULDNT_RESOLVE_HOST 文案断言放宽：curl 8.x 把 'Couldn't resolve host name' 改写为 'Could not resolve hostname'"
    patch_type: "portability"
  - patch_file: "patches/0004-test-tests.cpp.patch"
    strip: 1
    patch_description: "共享端点常量支持环境变量覆盖，并新增 TestUrlTls"
    patch_type: "portability"
  - patch_file: "patches/0005-test-tests.h.patch"
    strip: 1
    patch_description: "声明新增的 TestUrlTls 外部常量"
    patch_type: "portability"
