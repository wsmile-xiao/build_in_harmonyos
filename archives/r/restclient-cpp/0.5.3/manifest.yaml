# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "conan 2 默认不传播间接依赖的头文件：库的公开头 include 了依赖头（此处 <curl/curl.h>）时，必须 self.requires('curl/8.15.0', transitive_headers=True, transitive_libs=True)，否则 test_package 侧 curl_INCLUDE_DIRS 为空、报 curl/curl.h not found（库本体能编过，因为对它而言 curl 是直接依赖）（ref: conanfile.py requirements()）"
  - "上游 cmake --install 会装自己的 restclient-cppConfig.cmake/Targets，与 conan CMakeDeps 生成的同名文件互相遮蔽，而那份 config 的 INTERFACE 里没有 curl 头路径（公开头 #include <curl/curl.h> 在上游是按 PRIVATE 依赖声明的）⇒ package() 必须 rmdir lib/cmake，否则消费者 test_package 报 curl/curl.h file not found（ref: conanfile.py package()）"
  - "httpbin 跑在 Go net/http 上会把请求头名规范化（foo → Foo），上游 TestSetHeaders 按 Foo 取值；回环替身必须同样规范化 header key，直接回显原大小写会拿到空串（ref: files/loopback_httpbin.py）"
  - "curl 8.x 改写了 CURLE_* 文案（Couldn't connect to server → Could not connect to server，Couldn't resolve host name → Could not resolve hostname），上游两处按旧文案断言的用例改为两种拼写都接受并打印实际 body，错误码断言保持不变（ref: patches/0002-test-test_connection.cc.patch + patches/0003-test-test_restclient.cc.patch）"
  - "conan 2 的 self.run(env=...) 不拆逗号：env='conanbuild,conanrun' 会被当成一个不存在的 env 脚本名而静默不注入任何环境，必须传列表 env=['conanbuild', 'conanrun']（ref: conanfile.py _run_upstream_suite()）"
  - "ctest -N 在 PRE_TEST 模式下会真的执行 test-program；musl 的 ld.so 忽略构建树的 DT_RUNPATH，必须把 CMake 二进制目录与依赖 lib 目录写进 LD_LIBRARY_PATH，否则报 Error loading shared library 并发现 0 个用例（ref: conanfile.py generate()）"
  - "上游把 CMAKE_CXX_STANDARD 锁在 11，gtest 1.17 头文件要求 C++17；只对 test-program 单目标置 CXX_STANDARD 17，不改全局（库本体保持 C++11）（ref: patches/0001-CMakeLists.txt.patch）"
  - "CMakeLists 里上游遗留闸门 if(GTEST_FOUND) 在 config-mode 下永远为假（find_package(GTest) 只置 GTest_FOUND），test-program 被静默跳过、ctest -N 报 0；改为 if(GTEST_FOUND OR GTest_FOUND)（ref: patches/0001-CMakeLists.txt.patch）"
  - "上游 test/Makefile.am 用 httpbin(python) + squid 代理提供测试端点；改用 recipes 自带的 test/loopback_httpbin.py 纯标准库替身即可在 CI 内实跑 51 个 gtest 用例（ref: knowledge/drafts/DRAFT-restclient-cpp-0.5.3-loopback-httpbin-standin.md）"
  - "gtest_discover_tests 默认 PRE_BUILD 会在 build 阶段执行 test-program；OHOS 交叉构建下必须置 CMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST（ref: conanfile.py generate()）"
  - "CMakeLists 里 find_package(GTest) 会命中 vendor/jsoncpp-0.10.5 与系统路径，须用 Conan 的 *DIR 缓存变量显式锁定包内 config 目录（ref: patches/0001-CMakeLists.txt.patch）"
  - "ConnectionTestRemote 需要真实 TLS 握手：用仅绑定 127.0.0.1 的自签名测试证书 + SetCAInfoFilePath 编译期注入，TestFailForInvalidCA 才有确定语义（ref: files/localhost-test-only.crt + patches/0002-test-test_connection.cc.patch）"
  - "上游 test_connection.cc 中 TestSSLCert 是被注释掉的（静态 51 个活跃用例，非 52）（ref: notes.md 问题表 #7）"
