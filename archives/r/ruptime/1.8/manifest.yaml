# 版本级 manifest
# 文件位置: archives/r/ruptime/1.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8"

# 软件名
software: "ruptime"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-04"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/alexmyczko/ruptime/archive/refs/tags/1.8.tar.gz"

  # 源码校验和
  sha256: "c7115c34e11d79d1d0e966516818f3e5f7a0417aadb6cdddfb415cb103f688eb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - bash/5.3

  # 编译器（本包为纯 shell 脚本，无编译步骤；conanfile 仅拷贝文件 + bash -n 检查）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# shebang 改写在 conanfile.py build() 内以代码完成（cht.sh/adr-tools 同款做法），
# 未使用 patches/ 补丁文件。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 shell 包无上游测试时，test_package 用 hermetic 冒烟覆盖存在性/shebang/语法/配置守卫/版本输出/daemon 探测，不依赖 nc/xz/openssl 等运行时服务"
  - "OHOS 无 /bin/bash：requires bash/5.3 + shebang 改写为 #!/usr/bin/env bash + runenv PATH 前置"
