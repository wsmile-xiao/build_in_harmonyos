software: rt-app
display: "rt-app"
description: "Real-time scheduling test application that drives periodic synthetic workloads"
category: utility
license: GPL-2.0-only
homepage: "https://github.com/scheduler-tools/rt-app"
repository: "https://github.com/scheduler-tools/rt-app"
keywords:
  - realtime
  - scheduling
  - benchmark
  - load-generator

ohos_adaptation:
  key_points:
    - "musl-based OHOS libc does not provide the glibc-only GNU extensions pthread_getaffinity_np/pthread_setaffinity_np/pthread_yield; rt-app is ported to the POSIX sched_getaffinity/sched_setaffinity/sched_yield (pid 0 == calling thread on Linux), keeping identical semantics without any platform macro"
    - "OHOS sched.h exposes cpu_set_t and the CPU_* macros only inside #ifdef _GNU_SOURCE, so rt-app_args.c and rt-app_utils.c must define _GNU_SOURCE before their system includes"
    - "upstream tag v1.0 references TRUE/FALSE without ever defining them, which breaks the build on any libc; the missing definitions are supplied in the shared header"
    - "the bundled config.sub rejects the aarch64-linux-ohos triplet, so configure targets the canonical aarch64-linux-gnu triple while the toolchain keeps emitting aarch64-linux-ohos objects"
  common_dependencies:
    - json-c

versions:
  1.0:
    status: built
    build_date: "2026-10-02"
    patches: 3