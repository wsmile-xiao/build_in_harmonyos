sources:
  url: "https://github.com/scheduler-tools/rt-app/archive/refs/tags/v1.0.tar.gz"
  sha256: "7562bd5fea657fec0fdc4e01fc78a3afd332ee8151424dbae4bf7767400259f6"

patches:
  - patch_file: "patches/0001-define-bool-and-include-sched.patch"
    patch_description: "Define TRUE/FALSE and include <sched.h> in rt-app_types.h (upstream v1.0 uses TRUE/FALSE without defining them, and stores cpu_set_t without including <sched.h>)"
    patch_type: build
  - patch_file: "patches/0002-enable-gnu-source-for-cpuset.patch"
    patch_description: "Define _GNU_SOURCE before the system includes in rt-app_args.c and rt-app_utils.c so cpu_set_t/CPU_* are visible (musl-based libc gates them behind _GNU_SOURCE)"
    patch_type: portability
  - patch_file: "patches/0003-use-posix-sched-affinity-api.patch"
    patch_description: "Replace pthread_yield/pthread_getaffinity_np/pthread_setaffinity_np with the POSIX sched_yield/sched_getaffinity/sched_setaffinity, which musl-based libc provides (the *_np GNU extensions are absent)"
    patch_type: portability
