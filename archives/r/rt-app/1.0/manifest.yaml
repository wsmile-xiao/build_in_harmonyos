package: rt-app
version: "1.0"
homepage: "https://github.com/scheduler-tools/rt-app"
license: GPL-2.0-only
status: built
build_system: autotools
build_date: "2026-10-02"

source:
  url: "https://github.com/scheduler-tools/rt-app/archive/refs/tags/v1.0.tar.gz"
  sha256: "7562bd5fea657fec0fdc4e01fc78a3afd332ee8151424dbae4bf7767400259f6"

patches_applied:
  - "0001-define-bool-and-include-sched.patch"
  - "0002-enable-gnu-source-for-cpuset.patch"
  - "0003-use-posix-sched-affinity-api.patch"

upstream_tests:
  command: "make check"
  test_count: 0
  notes: >-
    rt-app 1.0 declares no TESTS, check_PROGRAMS or check-local target in any
    Makefile.am and ships no tests/ directory, so `make check` runs zero cases
    and asserts nothing. The audit is recorded in test_package/MANIFEST.yml.

test_package:
  assertion_count: 12
  ohos_assertion_count: 2
  description: >-
    Executes the packaged rt-app binary: usage contract, configuration
    rejection (exit 2 for malformed JSON and for a wrong value type), and a
    real duration-bounded synthetic workload pinned to CPU 0 that must exit 0
    and write a result log with real timing measurements. The two
    HarmonyOS-specific cases verify the delivered binary is a 64-bit AArch64
    ELF and that cpu_set_t plus the POSIX sched_getaffinity/sched_setaffinity/
    sched_yield surface introduced by the porting patches works on the target.