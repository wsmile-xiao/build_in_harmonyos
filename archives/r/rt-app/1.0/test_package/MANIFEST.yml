# test_package/MANIFEST.yml
# Upstream test declaration - required by ci/conan/build_and_test.sh (L0e).
package: rt-app/1.0
homepage: "https://github.com/scheduler-tools/rt-app"

# ── upstream automated tests ────────────────────────────────────────────────
# rt-app 1.0 ships NO automated test suite. Inventory of the official tag
# archive (github.com/scheduler-tools/rt-app, tag v1.0, 44 tracked files):
#   `grep -rn "TESTS\|check_PROGRAMS\|check-local\|noinst_PROGRAMS" --include=Makefile.am .`
#     -> no match (top-level Makefile.am only sets SUBDIRS; src/Makefile.am only
#        declares bin_PROGRAMS = rt-app and dist_bin_SCRIPTS);
#   no tests/ or test/ directory exists (`find . -type d -name "test*"` -> none);
#   `make check` is therefore a no-op: automake only runs it for TESTS, of which
#     there are none, so it succeeds vacuously and asserts nothing.
# The doc/examples/cpufreq_governor_efficiency/test.sh script is a hand-written
# demo driver for a specific calibration workflow (not wired into the build and
# not shipped in the release archive), so it is not counted as an upstream test.
upstream_tests_exist: false
upstream_test_audit: >-
  No TESTS / check_PROGRAMS / check-local declaration in any Makefile.am; no
  tests/ or test/ directory; `make check` runs no case and asserts nothing; the
  only file named *test.sh (doc/examples/cpufreq_governor_efficiency/test.sh) is
  an un-wired demo script outside the release archive.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── test_package (consumer view, runs inside `conan create`) ────────────────
test_package_tests:
  - file: "run_tests.sh"
    description: >-
      12-case suite driving the packaged rt-app executable: CLI usage contract
      (no argument and absent config file), configuration rejection (malformed
      JSON and wrong value type, both exit 2), and a real duration-bounded
      synthetic workload that must terminate 0 and write a well-formed result
      log with real timing measurements.
    command: "sh run_tests.sh <packaged-rt-app> <cc> <work-dir> <src-dir>"
  - file: "ohos_sched_test.c"
    description: >-
      HarmonyOS-specific verification compiled by the same cross toolchain that
      built the package. Parses the ELF header of the delivered rt-app binary to
      prove it is a 64-bit AArch64 executable, then exercises exactly the
      scheduling surface the OHOS adaptation rewired: cpu_set_t plus the POSIX
      sched_getaffinity/sched_setaffinity/sched_yield calls that replaced the
      glibc-only pthread_*_affinity_np/pthread_yield GNU extensions.
    command: "./ohos_sched_test <packaged-rt-app>"

assertion_count: 12
ohos_assertion_count: 2