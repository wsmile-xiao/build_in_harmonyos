# 软件级 manifest — rocm-core
# 遵循 ARCHIVE-SPEC v3.0

software: rocm-core
display: "ROCm Core"
description: "ROCm core component: query the ROCm release version and the ROCm install path"
category: system
homepage: "https://github.com/ROCm/rocm-core"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "只构建主机侧 C++ 库：OHOS clang 15.0.4（aarch64-unknown-linux-ohos）只注册 CPU 后端，没有 AMDGCN/amdgcn target，设备也没有 /dev/kfd、/dev/dri，因此不使用任何 GPU/hipcc 代码路径"
    - "上游要求 -DROCM_VERSION=<x.y.z>；由 conan 版本号经 CMakeToolchain 传入"
    - "上游从不调用 enable_testing()；配方注入顶层 CMAKE_PROJECT_INCLUDE（enable_testing()）使 conan cmake.test() 的 `test` 目标存在"
    - "上游 bin/ 下的 python 辅助工具（rdhc.py 需 prettytable/PyYAML，runpath_to_rpath.py 需 pyelftools）OHOS 无对应模块，打包时移除"
  common_dependencies: []

versions:
  "7.2.4":
    status: built
    build_date: "2026-10-07"
    conan_ref: "rocm-core/7.2.4"
