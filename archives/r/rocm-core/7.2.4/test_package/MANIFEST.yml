package: rocm-core/7.2.4
homepage: "https://github.com/ROCm/rocm-core"

# Upstream check entry point. The upstream release tarball registers zero
# CTest cases, but conanfile.py build() still drives the upstream test entry
# point so the conan build log carries the ctest execution trace.
upstream_check_command: "cmake.test() -> ctest --output-on-failure (CMake build folder)"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure (executed from conanfile.py build() via cmake.test())"

# rocm-core 7.2.4 ships NO upstream tests. Counting method (all three agree):
#   1. tar tf rocm-core-rocm-7.2.4.tar.gz | grep -i test  -> 0 paths
#   2. grep -Rn "add_test|enable_testing|include(CTest)" CMakeLists.txt utils.cmake
#      -> 0 hits (upstream never registers a test)
#   3. ctest --test-dir <build>  ->  "No tests were found!!!"
# Therefore the upstream suite is 0 cases; there are no cases to exclude.
upstream_tests: []

# Layer-2 consumer validation (executed by conan create's test_package step).
test_package_tests:
  - file: test_rocm_core.cpp
    description: >
      Links the packaged librocm-core and asserts the real C API, covering both
      the happy path and the error/boundary paths that the enum-typed return
      values exist for. Happy path: getROCmVersion() vs the ROCM_VERSION_*
      macros, the ROCM_BUILD_INFO string, printBuildInfo(), getROCmInstallPath()
      with ROCM_PATH=/opt/rocm and its re-read on a second call. Error/boundary
      coverage: getROCmVersion() with each of the three out-parameters NULL
      (-> VerIncorrectParameters), getROCmInstallPath() with InstallPath NULL /
      InstallPathLen NULL / both NULL (-> PathIncorrecPararmeters), ROCM_PATH
      unset and ROCM_PATH empty on the static build (-> PathLinuxRuntimeErrors)
      including the out-parameter reset contract (*InstallPath NULL,
      *InstallPathLen 0, asserted with sentinel values), ROCM_PATH longer than
      PATH_MAX (-> PathValuesTooLong, same reset contract), and the documented
      trailing-slash quirk (ROCM_PATH=/opt/rocm/ -> "/opt/rocm//", len 11).
    command: "./test_rocm_core"
  - file: test_rocm_core_ohos.cpp
    description: >
      HarmonyOS-specific complete consumer end-to-end flows (rule 12), built and
      run only when settings.os == "OHOS" (CMake option ROCM_CORE_TEST_OHOS; the
      source also carries #ifndef __OHOS__ #error). Three named cases, each a
      full flow rather than an assertion set: HC-1 installation discovery ->
      real artifact consumption (ROCM_PATH -> getROCmInstallPath -> read the
      resolved tree's version marker / archive magic / CMake package config /
      public header -> cross-check against getROCmVersion); HC-2 downstream
      version gate -> accept/reject branches, diagnostic banner, decision
      record written and read back; HC-3 installation-root relocation ->
      getROCmInstallPath follows the new root, then the original tree is
      authoritative again (no stale resolution).
    command: "./test_rocm_core_ohos <installed-prefix> <workdir>"

# Number of assertions actually executed by test_package/test_rocm_core.cpp
# (observed: "rocm-core consumer checks: 31 executed, 0 failed").
assertion_count: 31

# ── 鸿蒙特有测试（完整消费者端到端用例，rule 12 口径）────────────────────
# 计数口径：完整端到端用例数（HC-1 / HC-2 / HC-3），不按内部断言数计。
# 每个用例 = 构造输入 → 调用包内 API → 用返回数据做真实文件 I/O → 产出可校验结果。
test_counting:
  upstream_independent_total: 0
  integration_independent_total: 0
  harmony_specific_total: 3
  internal_assertions_counted_as_cases: false

execution:
  status: "pass"
  target: "HarmonyOS/OHOS 6.0 aarch64"
  upstream_passed: 0
  integration_passed: 0
  harmony_specific_passed: 3
