# 版本级 manifest — rocm-core 7.2.4
# 遵循 ARCHIVE-SPEC v3.0

version: "7.2.4"
software: "rocm-core"
status: built
build_date: "2026-10-12"
build_system: "cmake"
conan_ref: "rocm-core/7.2.4"

source:
  url: "https://github.com/ROCm/rocm-core/archive/refs/tags/rocm-7.2.4.tar.gz"
  sha256: "32dab2f00e22fb5462beffae03cc642403925d22a42662e15ac0f68d8e885dea"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DROCM_VERSION=7.2.4"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

# 上游测试清点（R51）
upstream_tests:
  command: "cmake.test() -> ctest --output-on-failure"
  test_count: 0
  notes: >
    rocm-core 7.2.4 不附带测试：tar 内 0 个 test 路径、CMakeLists/utils.cmake 中
    add_test/enable_testing/include(CTest) 0 处命中、配置后 ctest 报
    "No tests were found!!!"。三处计数一致，故上游用例数为 0。

# 适配后补全的测试（上游无用例，按交付要求自行补全）
test_package:
  file: "test_package/test_rocm_core.cpp"
  assertion_count: 31
  description: >
    真实链接 librocm-core 并调用导出 C API。正常路径 14 项 + 错误/边界 17 项：
    getROCmVersion 三个出参分别为 NULL（-> VerIncorrectParameters=1）；
    getROCmInstallPath 的 InstallPath NULL / InstallPathLen NULL / 两者皆 NULL
    （-> PathIncorrecPararmeters=-994）；ROCM_PATH 未设置与空串（->
    PathLinuxRuntimeErrors=-998）；ROCM_PATH 超长 8191B（-> PathValuesTooLong=-996）；
    失败时出参重置契约（*InstallPath=NULL、*InstallPathLen=0，哨兵值验证）；
    尾斜杠怪癖（/opt/rocm/ -> "/opt/rocm//", len=11）。
  verified_result: "31 executed, 0 failed"
  # 鸿蒙特有测试（完整消费者端到端用例，rule 12 口径：按用例数计，不按断言数）
  harmony_specific:
    file: "test_package/test_rocm_core_ohos.cpp"
    case_count: 3
    cases:
      - "HC-1 安装树发现与真实产物消费"
      - "HC-2 下游版本门禁决策流程"
      - "HC-3 安装根重定位流程"
    target: "HarmonyOS/OHOS 6.0 aarch64"
    verified_result: "3/3 cases passed (35 checks, 0 failed)"

patches_applied: []

knowledge_gained:
  - "OHOS clang 只注册 CPU 后端（无 amdgcn/AMDGCN）；rocm-core 无设备代码，只编译主机侧库即可，不需要 hipcc/GPU 工具链"
  - "上游 CMakeLists 从不调用 enable_testing()，conan cmake.test()（cmake --build --target test）会报 'No rule to make target test'；注入顶层的 CMAKE_PROJECT_INCLUDE（enable_testing()）解决"
  - "conan/OHOS 安装布局把 CMAKE_INSTALL_LIBEXECDIR 映射到 bin/，上游 rdhc.py/runpath_to_rpath.py 因此落在 bin/ 下；打包时删除 bin/ 以免库包被判为 CLI 并被 L2 smoke test 拒绝"
  - "上游 set_variables() 探测 git，非 git 源码树下打印 fatal: not a git repository 并令 VERSION_HASH=unknown；无害，ROCM_BUILD_INFO 变为 7.2.4.0-9999-unknown"
  - "★ __attribute__((nonnull)) + -O1 以上会让 clang 删除上游 NULL_CHECK 守卫：同一份 rocm-core 源码 -O0 返回 VerIncorrectParameters(1)、-O3 直接 SIGSEGV(139)，汇编可见 'str w9,[x8]' 写穿 NULL。修复=构建期注入 add_compile_options(-fno-delete-null-pointer-checks)，恢复 API 契约且无需改上游源码"
