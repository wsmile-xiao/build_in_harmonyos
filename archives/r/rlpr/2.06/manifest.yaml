version: "2.06"
software: rlpr
status: built
build_system: autotools
source:
  url: "https://deb.debian.org/debian/pool/main/r/rlpr/rlpr_2.06.orig.tar.gz"
  sha256: "32ae5893f4b9250b7a02c98a41b5929cfdd5731b6efbd7edfc77c2c5314388f7"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu (OHOS only)"
    - "--host=aarch64-unknown-linux-musl (OHOS only)"
    - "--disable-nls"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "The old configure script has an AC_RUN_IFELSE off_t probe; a cross-style build uses its documented guessed-long branch."
  - "The bundled config.sub predates musl; add only the Linux-musl spelling in the temporary build copy and use an existing target shell."
  - "The optional setuid and BSD-link installation targets modify ownership and /usr/bin; plain install avoids them."
  - "The target supplies ld.lld and llvm-ar, not ld and ar; explicit tool paths preserve the old Autotools build without altering system PATH."
  - "OHOS app UID can be absent from passwd; use a numeric UID fallback in temporary client sources rather than trusting USER or LOGNAME."
  - "The version option is parsed after client configuration, so consumer tests provide an inert loopback printer; W3 rlpr-w3-20261006T090848Z passed upstream 0/0 and consumer 4/4, not yet published."
