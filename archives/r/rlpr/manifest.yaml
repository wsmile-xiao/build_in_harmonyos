software: rlpr
display: "rlpr"
description: "Remote line-printer client and proxy commands"
category: utility
homepage: "https://packages.debian.org/source/sid/rlpr"
license: GPL-2.0-or-later
build_system: autotools
ohos_adaptation:
  key_points:
    - "Use distinct accepted build and host triples on OHOS to avoid the unsigned off_t configure run probe."
    - "Never invoke upstream install-setuid, install-proxy or bsdlinks targets."
    - "Sign all four packaged commands before consumer execution."
  common_dependencies: []
versions:
  "2.06":
    status: built
