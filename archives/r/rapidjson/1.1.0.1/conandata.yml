# R39: official GitHub URL only — CI injects mirror fallbacks; do not list gh-proxy prefixes.

sources:
  url: "https://github.com/Tencent/rapidjson/archive/refs/tags/v1.1.0.tar.gz"
  sha256: "bf7ced29704a1e696fbccf2a2b4ea068e7774fa37f6d7dd4039d0787f8bed98e"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Relax upstream -Werror flags, build tests as C++17 (packaged gtest 1.17 requires it), guard example install behind RAPIDJSON_BUILD_EXAMPLES, and drop the removed export(PACKAGE) call"
    patch_type: "portability"
  - patch_file: "patches/0002-test-CMakeLists.txt.patch"
    patch_description: "Replace the source-based GTestSrc lookup (unresolvable in release tarballs) with find_package(gtest) plus a local gtest_main shim; skip the perftest benchmark suite"
    patch_type: "portability"
  - patch_file: "patches/0003-test-unittest-CMakeLists.txt.patch"
    patch_description: "Drop -Werror/-Weverything from the unittest build, link the namespacetest library to gtest, and remove valgrind/Debug-only developer test registrations"
    patch_type: "portability"
  - patch_file: "patches/0004-test-unittest.h.patch"
    patch_description: "Create test temp files in the current working directory instead of /tmp, which does not exist / is not writable on HarmonyOS (mkstemp fails there, causing 6 file-stream test failures and one segfault)"
    patch_type: "portability"
