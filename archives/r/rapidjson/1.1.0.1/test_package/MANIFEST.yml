package: rapidjson/1.1.0.1
homepage: "https://github.com/Tencent/rapidjson"

upstream_check_command: "ctest --test-dir build --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure --no-tests=error"

# Logical tests are counted once. The upstream suite is a single gtest
# executable (`unittest`) built from 25 sources under test/unittest/;
# namespacetest contributes a compile-time namespace-collision check plus
# two TEST declarations to that same executable.
upstream_tests:
  - file: test/unittest/*.cpp
    source: rapidjson-1.1.0/test/unittest
    description: "All registered gtest suites of the upstream unittest executable; case_count is the actual gtest runtime report (343 tests / 29 suites — the static 738 declaration count includes macro-generated and non-registered lines, see UPSTREAM-TEST-INVENTORY.md)"
    command: "ctest --test-dir build -R '^unittest$' --output-on-failure"
    case_count: 343
    excluded_count: 0

test_package_tests:
  - file: unit.cpp
    description: "One consumer flow covering DOM parse, member access, mutation, serialization, and round-trip"
    command: "ctest --test-dir build -R '^rapidjson_unit_consumer$' --output-on-failure"
  - file: ohos_portability.cpp
    description: "One HarmonyOS flow covering target identity, arm64 ABI, Unicode parsing, and full-precision int64"
    command: "ctest --test-dir build -R '^rapidjson_ohos_portability$' --output-on-failure"

assertion_count: 14
