# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ranger/1.9.4
homepage: "https://ranger.github.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test PYTHON=python3"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests/"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/ranger/container/test_bookmarks.py
    source: ranger-1.9.4/tests/ranger/container/test_bookmarks.py
    description: "Bookmark functionality tests"
    command: "python3 -m pytest tests/ranger/container/test_bookmarks.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ranger.py
    description: "Import ranger module, verify version, check rifle accessibility"
    command: "python3 test_ranger.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
