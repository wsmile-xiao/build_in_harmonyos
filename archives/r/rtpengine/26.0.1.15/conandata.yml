sources:
  "26.0.1.15":
    url: "https://github.com/sipwise/rtpengine/archive/refs/tags/mr26.0.1.15.tar.gz"
    sha256: "3ee53cc342c64db21cc67c18f69235d8645563470f2d42ae011d98efa1e1720a"
    strip_root: true
patches:
  "26.0.1.15":
    - patch_file: "patches/0001-daemon-Makefile.patch"
      patch_description: "daemon: 注入 libpcap/hiredis CFLAGS（上游假设系统路径）；without_nftables=yes 时排除 netfilter_api.c（唯一无 #ifdef 守卫缺口）；install 目标摘除 $(MANS)（OHOS 无 pandoc）"
      patch_type: "portability"
    - patch_file: "patches/0002-daemon-media_player.c.patch"
      patch_description: "daemon: #include <mysql/errmsg.h> → <errmsg.h>（mariadb-connector-c 包布局：errmsg.h 在 include/mariadb/ 顶层）"
      patch_type: "portability"
    - patch_file: "patches/0003-daemon-media_socket.c.patch"
      patch_description: "daemon: 文件作用域静态结构体 .handler 值拷贝 → 内联嵌套指定初始化器（clang 静态初始化器拒静态对象值，gcc 宽松接受）"
      patch_type: "portability"
    - patch_file: "patches/0004-kernel-module-gen-rtpengine-kmod-flags.patch"
      patch_description: "kernel-module: shebang #!/bin/bash → #!/usr/bin/env bash（OHOS 无 /bin/bash）"
      patch_type: "portability"
    - patch_file: "patches/0005-lib-common.Makefile.patch"
      patch_description: "lib: 摘除硬编码 LDLIBS += -latomic（OHOS 工具链无 libatomic）；all 目标摘除 $(MANS)（无 pandoc）；SRCS 追加 ohos_pthread_stubs.c"
      patch_type: "portability"
    - patch_file: "patches/0006-lib-ohos_pthread_stubs.c.patch"
      patch_description: "lib: 新增 ohos_pthread_stubs.c — OHOS libc 缺失的 pthread 取消 API（pthread_cancel/pthread_testcancel/pthread_setcancelstate）weak 实现（glibc 强符号优先，跨平台安全）"
      patch_type: "portability"
    - patch_file: "patches/0007-recording-daemon-Makefile.patch"
      patch_description: "recording-daemon: install 目标摘除 $(MANS) 及 man 安装行"
      patch_type: "portability"
    - patch_file: "patches/0008-t-Makefile.patch"
      patch_description: "t: 注入 libpcap/hiredis CFLAGS（上游假设系统路径）；COMMONOBJS 追加 pthread stub 对象（per-test 链接规则显式列对象）"
      patch_type: "portability"
    - patch_file: "patches/0009-t-auto-test-helper.patch"
      patch_description: "t: shebang #!/bin/bash → #!/usr/bin/env bash"
      patch_type: "portability"
    - patch_file: "patches/0010-utils-const_str_hash.patch"
      patch_description: "utils: const_str_hash shebang #!/usr/bin/perl → #!/usr/bin/env perl（构建期 perl 脚本）"
      patch_type: "portability"
    - patch_file: "patches/0011-utils-gen-bcg729-flags.patch"
      patch_description: "utils: shebang #!/bin/bash → #!/usr/bin/env bash"
      patch_type: "portability"
    - patch_file: "patches/0012-utils-gen-codec-chain-flags.patch"
      patch_description: "utils: shebang #!/bin/bash → #!/usr/bin/env bash"
      patch_type: "portability"
    - patch_file: "patches/0013-utils-gen-common-flags.patch"
      patch_description: "utils: shebang #!/bin/bash → #!/usr/bin/env bash（构建期 pkg-config 探测主脚本）"
      patch_type: "portability"
    - patch_file: "patches/0014-utils-rtpengine-ctl.patch"
      patch_description: "utils: shebang #!/usr/bin/perl → #!/usr/bin/env perl（运行时控制 CLI）"
      patch_type: "portability"
    - patch_file: "patches/0015-utils-rtpengine-get-table.patch"
      patch_description: "utils: shebang #!/usr/bin/perl → #!/usr/bin/env perl（运行时辅助工具）"
      patch_type: "portability"
    - patch_file: "patches/0016-utils-rtpengine-ng-client.patch"
      patch_description: "utils: shebang #!/usr/bin/perl → #!/usr/bin/env perl（运行时新控制协议客户端）"
      patch_type: "portability"
