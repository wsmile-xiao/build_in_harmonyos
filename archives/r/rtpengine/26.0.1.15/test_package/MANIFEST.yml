# test_package/MANIFEST.yml
# 上游官方测试声明文件
# rtpengine 26.0.1.15 上游测试：65 个 Perl TAP（t/auto-daemon-tests*.pl，主入口
# auto-daemon-tests.pl，需 daemon 常驻 + ip netns 拓扑 — OHOS 无 ip 命令，全 N/A）+
# 13 个 C 单元测试（t/Makefile TESTS 注册，`make -C t unit-tests` 触发）。
# 实测（2026-10-08 OHOS arm64 本机）：9/13 PASS；test-stats 290s+ 未完成（疑本机无
# Redis 阻塞）；test-transcode SIGABRT（codec 表注册阶段）。详见 notes.md。

package: rtpengine/26.0.1.15
homepage: "https://github.com/sipwise/rtpengine"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C t unit-tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/auto-daemon-tests.pl
    source: rtpengine-mr26.0.1.15/t/auto-daemon-tests.pl
    description: "Perl TAP 主入口 — 65 个 auto-daemon-tests*.pl；需 daemon 常驻 + ip netns 隔离拓扑，OHOS N/A"
    command: "make -C t daemon-tests-main"
  - file: t/test-bitstr.c
    source: rtpengine-mr26.0.1.15/t/test-bitstr.c
    description: "C 单元测试（TESTS 注册 13 项：bitstr/aes-crypt/aead-aes-crypt/const_str_hash/transcode/dtmf-detect/payload-tracker/resample/stats/mix-buffer/s3-auth）"
    command: "make -C t unit-tests"

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 已安装 rtpengine 二进制 --version 实质执行 + 版本断言 + CLI 脚本存在性"
    command: "bash test.sh"

# 上游测试断言总数（TESTS 注册的 C 单元测试数；TAP 断言动态）
assertion_count: 13
