# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "裸 Make + pkg-config 22 名探测（gen-common-flags 任一缺失即 exit 1）；conan 配方 pc 名错配用 wrapper .pc 桥接（libcrypto/libpcre2-8/libmariadb/libjwt），不改共享配方"
  - "FIFO 系统级不可用（mkfifo EPERM，HMDfs/FUSE）→ make jobserver 不可用 → -j1 串行（CI 同设备类型同约束）"
  - "config.mk 的 dpkg-buildflags 缺失回退值含 LTO（-flto=auto）→ clang 对 LTO 链接自动追加 -latomic，OHOS 工具链无 libatomic → CFLAGS_DEFAULT=/LDFLAGS_DEFAULT= 必须剥离"
  - "lib/common.Makefile 硬编码 LDLIBS += -latomic（发行版假设）→ 摘除"
  - "clang15 拒绝文件作用域静态结构体值拷贝作为静态初始化器（C 标准下静态对象值非常量表达式，gcc 宽松接受）→ 内联展开指定初始化器；复合字面量本身合法（探针实证）"
  - "libjwt 世代分裂：libjwt/3.3.3 = mihaimaruseac builder/checker 新 API；libjwt2/2.1.3 = maddevs/libjwt v2 经典 API（jwt_add_grant 系，rtpengine 实际消费）"
  - "mariadb-connector-c 包布局：errmsg.h 在 include/mariadb/ 顶层，非 mysql/ 子目录（上游 MySQL 布局差异）"
  - "OHOS libc 无 pthread_cancel/pthread_testcancel/pthread_setcancelstate（POSIX 线程取消 API 家族）→ weak stub 填补（glibc 强符号动态链接优先，跨平台安全）"
  - "构建期 const_str_hash 是 perl 脚本（生成 *.strhash.c）→ tool_requires perl/5.42.2.3；.harmonybrew/bin/perl 不在 CI profile PATH，必须走 conan tool_requires"
  - "OHOS 无 pandoc/ronn → all/install 目标摘除 MANS；coreutils install 不在 PATH（/system/bin/install 存在，仅本地 staging 需要）"
  - "t/ 与 daemon/ Makefile 依赖系统 /usr/include 兜底 libpcap/hiredis 头 → 必须显式注入 CFLAGS_LIBPCAP/CFLAGS_LIBHIREDIS"
  - "依赖世代对齐：registry zlib 世代分裂（glib/2.88.3 系 1.3.2，ffmpeg/libcurl 系 1.3.1.1）→ 取 glib 2.84 世代全图原生一致零 force"

