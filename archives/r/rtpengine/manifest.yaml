software: rtpengine
display: "rtpengine"
description: "高性能媒体转换引擎（Sofia-SIP 生态）：RTP 媒体流转发、转码（G.711/G.722/Opus/BCG729）、录音与 NAT 穿透"
category: media
homepage: "https://github.com/sipwise/rtpengine"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "裸 GNU Make + pkg-config 22 名探测（gen-common-flags 缺一即 exit 1），非 autotools"
    - "make -j1 串行（HMDfs/FUSE 文件系统 FIFO 系统级不可用，make jobserver 依赖 mkfifo）"
    - "LTO 必须关闭（CFLAGS_DEFAULT=/LDFLAGS_DEFAULT=，OHOS 工具链无 libatomic）"
    - "4 个 wrapper .pc 文件桥接 conan 依赖与上游探测的 pc 名差异（openssl/pcre2/mariadb-connector-c/libjwt2），不改共享依赖配方"
    - "weak pthread 取消 API stub 填补 OHOS libc 缺口（跨平台安全：glibc 强符号动态链接优先）"
  common_dependencies:
    - glib
    - json-glib
    - libcurl
    - openssl
    - libevent
    - pcre2
    - libwebsockets
    - opus
    - libjwt2
    - hiredis
    - libpcap
    - ffmpeg
    - spandsp
    - mariadb-connector-c

versions:
  "26.0.1.15":
    status: built
    build_date: "2026-10-08"
    conan_ref: "rtpengine/26.0.1.15"
    note: "首次适配（上游 mr26.0.1.15）；16 个 portability 补丁；C 单元测试 9/11 PASS（详见 reports/test-report.md）"
