# test_package/MANIFEST.yml
# rmw 0.9.5
#
# rmw's upstream test suite is a set of shell-script functional tests
# (test/test_basic.sh, test_restore.sh, test_purging.sh ...; some require
# root or a btrfs test image), registered as meson test() entries behind the
# build_tests option.  This recipe builds with build_tests=false and instead
# exercises the complete consumer workflow against the installed binary:
# version banner -> config parse -> move-to-waste -> trashinfo -> restore.

package: rmw/0.9.5
homepage: https://github.com/theimpossibleastronaut/rmw

upstream_tests_exist: true
upstream_test_audit: "6 meson-registered shell-script tests (test/*.sh); some require root or a btrfs image"
upstream_check_command: "meson test -C <build-folder> (requires build_tests=true)"
upstream_test_in_build: false
upstream_test_count: 6
upstream_passed: 0
upstream_failed: 0

test_package_tests:
  - file: test_rmw.sh
    description: "11-assertion end-to-end consumer workflow: version/help banner, config parsing (-c/-o), move-to-waste (FreeDesktop files/ layout), trashinfo generation, and restore via -z"
    command: "RMW_BINDIR=<pkg>/bin sh test_rmw.sh"

test_files:
  - path: "test_package/test_rmw.sh"
    test_type: "OHOS consumer end-to-end"
    assertion_count: 11
    description: "11 assertions against the installed rmw executable"

test_package_test_count: 11
consumer_assertion_count: 11
assertion_count: 11
