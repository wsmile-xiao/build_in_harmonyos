# 版本级 manifest — archives/r/rmw/0.9.5/manifest.yaml

version: "0.9.5"
software: rmw
status: built
build_date: "2026-09-29"
build_system: meson
conan_ref: "rmw/0.9.5"

source:
  url: "https://github.com/theimpossibleastronaut/rmw/releases/download/v0.9.5/rmw-0.9.5.tar.xz"
  sha256: "5fa336da39228d4ef6d1314fd86b5dfb0622e80485ebf7b78152198278090050"
  tar_format: tar.xz

build:
  system: meson (ohpcd 预构建工具包 meson/1.11.0, tool_requires)
  meson_options:
    - "-Dwithout-curses=false (保留交互式恢复菜单)"
    - "-Dnls=false (musl 无 libintl, src/gettext.h 内联 stub 兜底)"
    - "-Dwant_btrfs_clone=false (OHOS host_machine.system()='harmonyos' 本就不启用, 显式关闭求确定; 同时使 test_btrfs_clone.sh 不注册)"
    - "-Dbuild_tests=true (真实执行上游测试套件, 见 test_results)"
    - "-Dinstall_shell_completions=false"
  dependencies:
    - "canfigger/0.3.2 (conan requires)"
    - "ncurses/6.6 (conan requires, 静态库 libncursesw.a/libmenuw.a 链接)"
    - "musl-fts 1.2.7 (vendored, 编入 bsdutilsrm 静态库)"
  parallelism: 1

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "meson test (build() 内真实执行; OHOS 注册 8 项: 3 个 C 单元测试 + 4 个 shell 脚本 + 1 个 bsdutils rm 测试; btrfs_clone 因 want_btrfs_clone=false 不注册)"
  upstream_passed: 8
  upstream_failed: 0
  upstream_notes: "symlink 相关子断言在 OHOS 被平台 SELinux 域限制(未签名进程 symlink(2)/lstat() 一律 EACCES, 与卷无关), 补丁 0004/0007 先探测能力、被拒时优雅跳过该子段, 其余断言全部真实执行; test_media_root.sh 的媒体根由只读 erofs /tmp 改为用户存储 tmpfs 挂载点 (0006); id(1) 对多用户 uid 报 bad uid 且 CI worker 上目录 owner 与进程 uid 可能错位, 0005 期望值改从 /proc/self/status 读进程真实 uid (grep+cut), 0006 的 stat 用法自洽保留"
  test_package_passed: 11
  test_package_failed: 0
  test_package_assertions: 11
  execution: "conan create rc=0; meson test --timeout 180 --print-errorlogs 8/8 OK; test_package 端到端消费者工作流 11 断言全过"

test_passed: 19
test_failed: 0

patches_applied:
  - "patches/0001-meson-build.patch (canfigger 依赖改 cc.find_library)"
  - "patches/0002-src-meson-build.patch (curses/menu 改 cc.find_library('ncursesw'/'menuw'))"
  - "patches/0003-src-bsdutils-meson-build.patch (vendored fts(3) 编入 bsdutilsrm)"
  - "patches/0004-src-utils-c.patch (上游测试: symlink 断言探测能力后被拒跳过)"
  - "patches/0005-test-test_basic-sh.patch (上游测试: 期望值 uid 改从 /proc/self/status 读进程真实 uid, 规避 toybox id bad uid 与 CI 上目录 owner 错位)"
  - "patches/0006-test-test_media_root-sh.patch (上游测试: 媒体根改用户存储 tmpfs; id -u 同上)"
  - "patches/0007-test-test_restore-sh.patch (上游测试: symlink 段探测后跳过)"
  - "patches/0008-test-meson-build.patch (上游测试: shell 测试经 sh 解释器执行, 规避 HMDFS 新文件 execve EACCES)"

knowledge_gained:
  - "Meson 项目的 conan 消费者配方中, MesonToolchain 的 tc.c_args/tc.c_link_args 是普通实例属性可直接 append, 但依赖包 cpp_info.includedirs/libdirs 返回的是相对路径(如 'include'/'lib'), 必须用 os.path.join(dep.package_folder, x) 拼成绝对路径, 否则 -I/-L 静默失效, meson 的 has_header/find_library 探测全部失败 (reference: archives/r/rmw/0.9.5/conanfile.py generate() 实现)"
  - "meson 内置选项 c_args 只作用于编译目标, cc.has_header/cc.find_library 的探测不受 [built-in options] c_args 之外的环境变量影响; OHOS 上 pkg-config 不可依赖(ncurses 包 .pc prefix=/ 且 PkgConfigDeps 未生成产物), 最可靠路径是配方注入绝对 -I/-L + 补丁把 dependency() 改写为 cc.find_library(name, has_headers:) (reference: archives/r/rmw/0.9.5/patches/0002-src-meson-build.patch)"
  - "musl/OHOS 无 fts(3) 且 rm.c 硬依赖 fts_* API; 以 void-linux/musl-fts 1.2.7 (NetBSD 实现, BSD-3-Clause) 随包 vendored, build() 时拷入 src/bsdutils/ 并补最小 config.h(#define HAVE_DIRFD 1, musl 有 dirfd; 不定义 HAVE_STRUCT_DIRENT_D_NAMLEN), 即可编入宿主静态库, 无需新增 conan 依赖 (reference: archives/r/rmw/0.9.5/patches/0003-src-bsdutils-meson-build.patch)"
  - "conan 本地构建绕过 GitHub 直连超时的确定性方法: global.conf 设 core.sources:download_cache=<绝对路径>(注意不是 core.download:download_cache), 把 tarball 以内容 sha256 命名放入 <cache>/s/ 子目录, 下载失败时 conan 自动命中本地 backup sources (reference: conan 2.29 internal/rest/caching_file_downloader.py SourcesCachingDownloader)"
  - "rmw 0.9.5 的 WASTE 目录遵循 FreeDesktop Trash 布局(文件在 <WASTE>/files/, trashinfo 在 <WASTE>/info/*.trashinfo, Path= 记录绝对原路径), 恢复命令为 rmw -z <WASTE>/files/<name>; 旧版旁挂 .trashinfo 布局的断言会全部落空 (reference: archives/r/rmw/0.9.5/test_package/test_rmw.sh)"
  - "OHOS ncurses 6.6 conan 包 include/ 为扁平布局(curses.h/menu.h 在根, 无 ncursesw/ 子目录)且仅静态库(libncursesw.a/libmenuw.a); 消费方 cc.find_library('ncursesw'/'menuw') 静态链接进可执行文件, 反而规避了运行期 LD_LIBRARY_PATH/symlink 加载问题 (reference: archives/n/ncurses/6.6/conanfile.py 与 rmw 0.9.5 构建日志)"
  - "OHOS 平台 SELinux 策略对未签名(自编译)进程拒绝 symlink(2) 创建和对 symlink 的 lstat(), 一律 EACCES(与文件卷无关: el2 cache/storage/Users 均如此; 系统 toybox ln 因签名域不受限); 涉及 symlink 的上游测试须先探测能力、被拒时优雅跳过该子段, 跳过属平台限制须在 PR 披露 (reference: archives/r/rmw/0.9.5/patches/0004-src-utils-c.patch)"
  - "OHOS 上 toybox id(1) 对多用户 uid 空间(uid 20020170 > 65535)报 bad uid 返回空; 获取进程真实 uid 须用 grep ^Uid: /proc/self/status 再 cut -f2 (内核提供, 不经 id 校验, grep/cut 均为 toybox 核心命令); stat -c %u . 返回的是目录 owner, 在 CI worker 上与进程 uid 错位(rmw 对 config $UID 展开用的进程 uid 20020101 vs 目录 owner 20020170)导致期望值不匹配——仅当 config 与断言两侧都用同一 stat 值(自洽)时才可用; OHOS /tmp 是只读 erofs 挂载, 需要可写媒体根的测试改用用户存储 tmpfs 挂载点 /storage/Users (reference: archives/r/rmw/0.9.5/patches/0005-test-test_basic-sh.patch 与 0006)"
  - "HMDFS 上新解压的 shell 脚本 execve 偶发 EACCES(权限模型对新文件可执行的限制); meson test 对脚本测试的可靠做法是 patch meson.build 让脚本经 find_program('sh', native: true) 以参数方式读取执行, 绕开 execve (reference: archives/r/rmw/0.9.5/patches/0008-test-meson-build.patch)"
