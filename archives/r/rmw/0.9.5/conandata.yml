# conandata.yml — rmw 0.9.5
# 源码: 官方 GitHub release 发布物 (tar.xz)，SHA-256 已真机下载核对。
# CI 预下载器会自动附加镜像回退，此处按 R39 只写官方 URL。

sources:
  url:
    - "https://github.com/theimpossibleastronaut/rmw/releases/download/v0.9.5/rmw-0.9.5.tar.xz"
  sha256: "5fa336da39228d4ef6d1314fd86b5dfb0622e80485ebf7b78152198278090050"

patches:
  - patch_file: "patches/0001-meson-build.patch"
    patch_description: "canfigger 依赖改走 cc.find_library（conan 注入 -I/-L；pkg-config 查找与 wrap-git fallback 在 OHOS 均不可用）"
    patch_type: "portability"
  - patch_file: "patches/0002-src-meson-build.patch"
    patch_description: "curses/menu 改走 cc.find_library('ncursesw'/'menuw')（ncurses 包只导出 ncursesw.pc，无 curses.pc）"
    patch_type: "portability"
  - patch_file: "patches/0003-src-bsdutils-meson-build.patch"
    patch_description: "musl/OHOS 无 fts(3)，改用随包 vendored musl-fts 1.2.7 (NetBSD 实现, BSD-3-Clause) 编入 bsdutilsrm 静态库"
    patch_type: "portability"
  - patch_file: "patches/0004-src-utils-c.patch"
    patch_description: "上游测试适配: OHOS SELinux 拒绝未签名进程的 symlink(2)/lstat()（EACCES），utils 测试的 symlink 断言先探测能力、被拒时优雅跳过"
    patch_type: "portability"
  - patch_file: "patches/0005-test-test_basic-sh.patch"
    patch_description: "上游测试适配: OHOS toybox id(1) 对多用户 uid 空间报 bad uid，且 CI worker 上目录 owner 与进程 uid 可能错位，期望值改从 /proc/self/status 读内核提供的进程真实 uid (grep+cut)"
    patch_type: "portability"
  - patch_file: "patches/0006-test-test_media_root-sh.patch"
    patch_description: "上游测试适配: OHOS /tmp 为只读 erofs，媒体根优先改用可写的用户存储 tmpfs 挂载点 (/storage/Users)；uid 用 stat -c %u 但配置与断言两侧同源自洽"
    patch_type: "portability"
  - patch_file: "patches/0007-test-test_restore-sh.patch"
    patch_description: "上游测试适配: symlink 移动/恢复段先探测 rmw 能否处理 symlink（SELinux 域拒绝时跳过），其余断言照常执行"
    patch_type: "portability"
  - patch_file: "patches/0008-test-meson-build.patch"
    patch_description: "上游测试适配: OHOS (HMDFS) 上新解压脚本 execve 偶发 EACCES，shell 测试改为经 sh 解释器读取执行（仅 harmonyos host）"
    patch_type: "portability"
