software: rmw
display: "rmw"
description: "Command-line recycle bin tool (ReMove to Waste) following the FreeDesktop Trash specification"
category: utils
homepage: "https://github.com/theimpossibleastronaut/rmw"
license: GPL-3.0
build_system: meson

ohos_adaptation:
  key_points:
    - "meson dependency() 不可用（pkg-config/wrap-git 均不可达），canfigger/curses/menu 全部改 cc.find_library 解析"
    - "musl 无 fts(3)，vendored musl-fts 1.2.7 (NetBSD, BSD-3-Clause) 编入 bsdutilsrm 静态库"
    - "musl 无 libintl，-Dnls=false 走上游 gettext.h stub，零补丁"
    - "btrfs 克隆在 OHOS host_sys 下自动不启用"
  common_dependencies:
    - canfigger
    - ncurses

versions:
  "0.9.5":
    status: built
    build_date: "2026-09-29"
