software: redstore
display: "RedStore"
description: "Lightweight RDF triplestore powered by Redland"
category: db
homepage: "https://www.aelius.com/njh/redstore/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools build with PkgConfigDeps for raptor2/rasqal/redland"
    - "Force --build triplet because 0.5.4 config.guess predates HarmonyOS"
    - "mktemp wrapper forces autoconf mkdir fallback on HarmonyOS"
    - "Upstream suite is 12 automake TESTS (check + perl Test::Harness)"
  common_dependencies:
    - raptor2
    - rasqal
    - redland
    - check

versions:
  "0.5.4":
    status: built
    build_date: "2026-09-29"
