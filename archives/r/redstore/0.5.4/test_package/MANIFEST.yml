# test_package/MANIFEST.yml -- redstore 0.5.4
# Upstream official test declaration (CI build_and_test.sh L0e requires this file)

package: redstore/0.5.4
homepage: "https://www.aelius.com/njh/redstore/"

# Upstream test suite existence (audited from the official source tarball)
upstream_tests_exist: true

# Upstream test audit (source: redstore-0.5.4.tar.gz,
# sha256 58bd65fda388ab401e6adc3672d7a9c511e439d94774fcc5a1ef6db79c748141)
upstream_test_audit: >
  Unpacked the official tarball and read configure.ac/Makefile.am plus the
  tests/ tree: tests/Makefile.am sets SUBDIRS = redhttp unit integration.
  tests/redhttp/Makefile.am registers 6 check_PROGRAMS (check_headers,
  check_negotiate, check_request, check_response, check_server, check_url)
  built from .tc sources via checkmk against src/redhttp/libredhttp.la.
  tests/unit/Makefile.am registers 1 check_PROGRAMS (check_utils) built
  from check_utils.tc plus src/globals.c and src/utils.c. tests/integration/
  Makefile.am registers 5 dist_check_SCRIPTS (redstore-http_test.pl,
  sparql11-http-rdf-update_test.pl, sparql11-protocol_test.pl,
  sparql11-service-description_test.pl, redstore-storage_test.pl) executed
  through perl Test::Harness with REDSTORE pointing at the just-built
  src/redstore binary. The 6 + 1 + 5 = 12 automake TESTS entries are the
  harness containers. Leaf-assertion audit (rule4少报 fix 2026-10-08,
  reviewer N=429): grep ^#test in the 7 .tc files gives 127 check units
  (check_request 42, check_url 3, check_headers 10, check_negotiate 20,
  check_response 18, check_server 12, check_utils 22; each #test block is one
  libcheck test and the binary summary `Checks: N` equals it); grep
  `use Test::More tests => N` in the 5 .pl files gives 302 TAP assertions
  (redstore-http 87, sparql11-http-rdf-update 64, sparql11-protocol 88,
  redstore-storage 33, sparql11-service-description 30). Total 127 + 302 =
  429 leaf assertions, all run by `make check`. The check framework
  (check >= 0.9.4) plus checkmk and a working perl are required for the full
  suite; without checkmk the unit directories are skipped by HAVE_CHECK.
upstream_test_total: 429
upstream_test_count_method: check_macros+tap_plans

# Upstream test command
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream tests actually run
upstream_tests:
  - file: tests/redhttp/check_headers.tc
    source: redstore-0.5.4/tests/redhttp/check_headers.tc
    description: "redhttp header handling unit test (check framework)"
    command: "./check_headers"
  - file: tests/redhttp/check_negotiate.tc
    source: redstore-0.5.4/tests/redhttp/check_negotiate.tc
    description: "HTTP content negotiation unit test (check framework)"
    command: "./check_negotiate"
  - file: tests/redhttp/check_request.tc
    source: redstore-0.5.4/tests/redhttp/check_request.tc
    description: "HTTP request parsing unit test (check framework)"
    command: "./check_request"
  - file: tests/redhttp/check_response.tc
    source: redstore-0.5.4/tests/redhttp/check_response.tc
    description: "HTTP response unit test (check framework)"
    command: "./check_response"
  - file: tests/redhttp/check_server.tc
    source: redstore-0.5.4/tests/redhttp/check_server.tc
    description: "HTTP server unit test (check framework)"
    command: "./check_server"
  - file: tests/redhttp/check_url.tc
    source: redstore-0.5.4/tests/redhttp/check_url.tc
    description: "URL parsing unit test (check framework)"
    command: "./check_url"
  - file: tests/unit/check_utils.tc
    source: redstore-0.5.4/tests/unit/check_utils.tc
    description: "redstore utils unit test (check framework)"
    command: "./check_utils"
  - file: tests/integration/redstore-http_test.pl
    source: redstore-0.5.4/tests/integration/redstore-http_test.pl
    description: "HTTP interface integration test (perl Test::Harness)"
    command: "REDSTORE=src/redstore perl redstore-http_test.pl"
  - file: tests/integration/sparql11-http-rdf-update_test.pl
    source: redstore-0.5.4/tests/integration/sparql11-http-rdf-update_test.pl
    description: "SPARQL 1.1 Graph Store HTTP Protocol test (perl)"
    command: "REDSTORE=src/redstore perl sparql11-http-rdf-update_test.pl"
  - file: tests/integration/sparql11-protocol_test.pl
    source: redstore-0.5.4/tests/integration/sparql11-protocol_test.pl
    description: "SPARQL 1.1 Protocol test (perl)"
    command: "REDSTORE=src/redstore perl sparql11-protocol_test.pl"
  - file: tests/integration/sparql11-service-description_test.pl
    source: redstore-0.5.4/tests/integration/sparql11-service-description_test.pl
    description: "SPARQL 1.1 Service Description test (perl)"
    command: "REDSTORE=src/redstore perl sparql11-service-description_test.pl"
  - file: tests/integration/redstore-storage_test.pl
    source: redstore-0.5.4/tests/integration/redstore-storage_test.pl
    description: "Storage backend integration test (perl)"
    command: "REDSTORE=src/redstore perl redstore-storage_test.pl"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "redstore binary smoke test: -h version+usage and -q/-v conflict rejection"
    command: "bash test.sh"
  - file: conanfile.py
    description: "Conan test() entry, runs test.sh and reports HMBS_TEST_PACKAGE_RESULT (discovered=2)"
    command: "conan test test_package"

# Assertion count (test.sh performs 2 real checks)
assertion_count: 2
