# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: randomio/1.4
homepage: "http://www.arctic.org/~dean/randomio/"

# 上游测试注册口径：randomio 1.4 的 makefile 只有默认目标与 clean 目标，
# 无 check/test 目标；源码树不含任何测试文件或测试框架。
# 清点证据: tarball 顶层仅 randomio.c / Makefile / README / Changelog /
# .cvsignore 共 5 个文件，无任何 test 文件
upstream_check_command: "make -n check   # -> make: *** No rule to make target 'check'"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_randomio.py
    description: >
      运行安装后的 randomio：usage 探测（无参数时打印 usage 行、含 512 字节
      对齐说明、退出码非 0）+ 端到端基准（对预分配 8MiB 普通文件执行
      2 线程、100% 写、0 fsync、4KiB I/O、1s 采样 1 次，需 O_DIRECT 支持），
      断言表头两行、至少一条数值数据行、stderr 无 open/thrasher 运行错误、
      退出码 0
    command: "python3 test_randomio.py <package>/bin/randomio"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
