software: randomio
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.4"
status: built
build_system: makefile
build_date: "2026-10-04"

source:
  url: "http://www.arctic.org/~dean/randomio/randomio-1.4.tar.bz2"
  sha256: "384da98a7d3da1df2a1bffb9fb499fce6d043588bbf225673fda028bdfd2386f"
  tar_format: tar.bz2
  # 上游无版本控制 tag（作者站点直接分发 tarball），1.4 为最终版本
  upstream_version: "1.4"

build:
  system: makefile
  configure_options:
    - 'CC=<ohos clang from tools.build:compiler_executables>'
    - "target: all (makefile 默认规则 randomio: randomio.o，隐式规则链接)"
  dependencies: []
  cc: clang
  cxx: ""

patches_applied:
  - "patches/0001-open-einval-buffered-io-fallback.patch (HarmonyOS HMDFS 对已存在文件的 open(O_DIRECT) 返回 EINVAL（创建时却接受），EINVAL 时回退缓冲 IO 并告警；镜像上游 __APPLE__ OPEN_FLAGS=0 可移植分支，本机 OHOS clang 交叉编译 0 警告)"

knowledge_gained:
  - "randomio 1.4 是单文件 C 程序(9.7KB) + 手写 makefile，无 configure/install/check 目标，上游无版本控制仓库，tarball 仅 5 个文件"
  - "许可证(MIT)只存在于 randomio.c 源码头注释(第7-25行)，无独立 LICENSE 文件；package() 从源码确定性截取生成 licenses/LICENSE"
  - "musl 定义 O_DIRECT(fcntl.h)，'#error Needs O_DIRECT' 守卫在 aarch64-linux-ohos 上可通过；termios.h/sys/ioctl.h/pthread/drand48/pread/pwrite 均为 musl 提供"
  - "makefile 隐式链接规则使用 $(CC) $(LDFLAGS)，LDFLAGS=-pthread -lm；musl 的 libm 并入 libc，-lm 为空链接；命令行 CC= 覆盖即可交叉编译，CFLAGS 保留上游默认(-O2 -g -Wall -pthread -std=gnu99)"
  - "运行时强依赖文件系统 O_DIRECT 支持：文件系统不支持时 open() 直接失败(open: Invalid argument)；ext4/f2fs 支持，OHOS PC 需真机确认"
  - "上游 EINTR 重试判断写错(while rc<0 && rc==EINTR，应为 errno==EINTR)，为无害上游缺陷，不做补丁保持源码忠实"
  - "上游无单元测试套件，验证方式=完整构建 + 消费端 usage 探测 + 对预分配普通文件的端到端写入基准(2线程/纯写/无fsync/4KiB/1s×1次，~2秒完成)"
  - "真机实测(HMDFS)：新文件 open(O_CREAT|O_DIRECT) 成功、已存在文件 open(O_DIRECT) 报 EINVAL，需要 0001 缓冲 IO 回退补丁才能端到端运行；回退后延迟含页缓存，不等价于真直 IO 基准"

conan_adaptation:
  recipe: conanfile.py
  conandata: null
  test_package: test_package/
  package_type: application
  commands_json: true
