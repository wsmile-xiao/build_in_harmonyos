# 软件级 manifest
# 文件位置: archives/r/ruy/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: ruy

# 显示名
display: "ruy"

# 一句话描述
description: "ruy: a matrix multiplication library covering the needs of neural-network inference engines (GEMM kernels, packed paths and quantized integer paths)"

# 分类标签
category: math

# 官网 URL
homepage: "https://github.com/google/ruy"

# 开源许可证（SPDX 标识）
license: Apache-2.0

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "纯 CMake 项目（自研 ruy_cc_library / ruy_cc_test 等规则函数，由 bazel_to_cmake 生成），C++14"
    - "外部依赖只有 cpuinfo，且必须写成裸 ref（制品仓不带 user/channel；仓库模板注释里的 R27 要求写 @ohpcd/stable，但那样会报 Unable to find in remotes，属模板缺陷）。平台版 cpuinfo 的 cmake_target_name 与 ruy 的 find_package(cpuinfo REQUIRED) 判据天然吻合，无需改上游"
    - "必须 vendor googletest 到 third_party/googletest：上游该目录是未 checkout 的子模块（空目录），引用带 EXISTS 保护会静默跳过，导致测试目标链接期找不到 gtest 目标。同时设 INSTALL_GTEST=OFF 防止 gtest 混入安装产物"
    - "不要照抄 Conan Center 的 RUY_MINIMAL_BUILD=True：那会让 33 条上游 ctest 一条都不注册（ruy_cc_test 首句即 return），上游测试证据全失。保持顶层默认 OFF"
    - "上游 ruy_cc_library 硬编码 add_library(... STATIC)，需打补丁去掉才能支持 shared（本仓库模板 R26 要求 options 含 shared）"
    - "上游把 cmake_minimum_required() 写在 project() 之后（ruy issue #328），CMake 4.x 下需移到文件开头"
    - "CMake 不识别 HarmonyOS：须强制 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64，否则架构分支全部走空"
    - "包内须移除上游 install(EXPORT ruyTargets) 生成的 lib/cmake/ruy，避免与 CMakeDeps 的 ruy-config.cmake 碰撞"
    - "包内无 bin/（上游 ruy_cc_binary 无 install 规则，example 不进包），故不需要 commands.json"
    - "产出 30 个静态库；消费者需显式链接 m/pthread（OHOS 侧 clang 驱动不隐式带入）"
    - "构建步骤输出必须绑定日志文件：conan 的 run() 把 recipe 输出流继承给子进程时，OHOS 上 clang 会在第一个编译单元静默失败（make 只报 Error 1、零诊断）"
  common_dependencies:
    - "cpuinfo/0.0-git20250905.877328f"

# 版本索引
versions:
  "0.0.0-git20230215.21a85fe":
    conan_ref: "ruy/0.0.0-git20230215.21a85fe"
    status: built
    build_date: "2026-09-29"
