# 版本级 manifest
# 文件位置: archives/r/ruy/0.0.0-git20230215.21a85fe/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "0.0.0-git20230215.21a85fe"

# 软件名
software: "ruy"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "cmake"
conan_ref: "ruy/0.0.0-git20230215.21a85fe"

# 源码信息
source:
  # 源码下载 URL（与 conandata.yml 的官方 URL 一致；conandata 里额外带镜像列表）
  url: "https://github.com/google/ruy/archive/21a85fef159f9942f636a43b14c64b481c2a05b2.tar.gz"

  # 源码校验和
  sha256: "e151a5b55059a6e83ded001787e1a8889ba1e5e4eaa5bc836b9b660e7e1cb519"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# 构建配置
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py 的 generate() 一致）
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DRUY_MINIMAL_BUILD=OFF"
    - "-DRUY_FIND_CPUINFO=ON"
    - "-DRUY_ENABLE_INSTALL=ON"
    - "-DBUILD_GMOCK=OFF"
    - "-DINSTALL_GTEST=OFF"
    - "-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表（格式: name/version；制品仓为裸 ref，不带 @user/channel）
  dependencies:
    - "cpuinfo/0.0-git20250905.877328f"

  # 编译器
  cc: clang
  cxx: clang++

# 应用的补丁列表
patches_applied:
  - "patches/0001-cmake-minimum-required-before-project.patch"
  - "patches/0002-ruy-cc-library-allow-shared.patch"

# 编译中学到的知识
knowledge_gained:
  - "Conan Center 的 ruy 配方设 RUY_MINIMAL_BUILD=True，而 ruy_cc_test() 首句就是 if(RUY_MINIMAL_BUILD) return()：该设置让 33 条上游 ctest 一条都不注册、enable_testing() 也不被调用。要拿到上游测试证据必须保持该变量为默认 OFF（ruy 作为顶层项目时其默认值即为 OFF）"
  - "tarball 内 third_party/googletest 与 third_party/cpuinfo 都是未 checkout 的子模块（空目录），而上游对它们的引用都带 EXISTS 保护 ⇒ 缺失时静默跳过而非报错。测试目标因此会在链接期找不到 gtest 目标，必须在 source() 阶段把 googletest 源码放到 third_party/googletest 才能让 add_subdirectory 生效"
  - "googletest 需选 v1.14.0：其 CMakeLists 声明 cmake_minimum_required 3.13，可在设备侧 CMake 4.x 上 configure；1.11.0 声明 < 3.5，在 CMake 4.x 下直接被拒"
  - "googletest 必须设 INSTALL_GTEST=OFF：add_subdirectory 引入的安装规则会被 cmake.install() 一并执行，否则 gtest 的头文件与库会混进 ruy 的安装产物；BUILD_GMOCK=OFF 可省一份编译量（ruy 全树无 gmock 引用）"
  - "ruy 的 x86_64 判据只影响编译选项（-mavx*/-mfma 等），不裁剪库目标 —— ruy/CMakeLists.txt 第 693/765/837 行三处 if(...x86_64...) 都只 set(COPTS)，紧随其后的是无条件的 ruy_cc_library(...)。因此 Conan Center 的 30 项 cpp_info.libs 清单在 aarch64 上同样成立"
  - "上游 ruy_cc_binary 没有任何 install 规则（逐行核对 cmake/ruy_cc_binary.cmake），example 目标会被编译但不会进包 ⇒ 包内无 bin/，无需声明 commands.json（L0k 不适用）"
  - "上游带 install(EXPORT ruyTargets DESTINATION lib/cmake/ruy)，与 CMakeDeps 生成的 ruy-config.cmake 在 lib/cmake/ 下同名碰撞，package() 必须移除该目录"
  - "依赖必须写成裸 ref（cpuinfo/0.0-git20250905.877328f，不带 @user/channel）：ohpcd 制品仓发布时不带 channel，写 @ohpcd/stable 会直接报 Unable to find in remotes。仓库模板注释里的 R27 是模板缺陷，以已合入包（ffmpeg / gnuit / gcr-base / kxl）的实际写法为准。平台版 cpuinfo 的 cmake_target_name 正好是 cpuinfo::cpuinfo，与 ruy 顶层 CMakeLists 的 if(NOT TARGET cpuinfo::cpuinfo) / find_package(cpuinfo REQUIRED) 判据直接对接，无需改动 ruy"
  - "CMake 不识别 HarmonyOS：CMAKE_SYSTEM_NAME 会退化、CMAKE_SYSTEM_PROCESSOR 变成 unknown。必须经 toolchain 变量强制 Linux/aarch64，否则架构相关分支全部走空"
  - "上游 ruy_add_all_subdirs() 的第 26 行 if((NOT(subdir MATCHES third_party))...) 使用了未定义变量 subdir（应为 _CHILD），实际恒为真 —— 该函数会纳入当前目录下所有含 CMakeLists.txt 的子目录，ruy/profiler 正是由此被自动纳入"
