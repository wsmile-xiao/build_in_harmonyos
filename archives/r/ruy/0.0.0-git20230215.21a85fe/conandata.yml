# conandata.yml — ruy 0.0.0-git20230215.21a85fe
# 位置: archives/r/ruy/0.0.0-git20230215.21a85fe/conandata.yml
# 本文件是源码 URL + SHA256 + 补丁的唯一权威来源。
# conanfile.py 通过 self.conan_data["sources"] / ["googletest"] 与
# apply_conandata_patches() 读取。

sources:
  # URL 列表的三条硬规则（与 archives/r/reliable/1.3.5 一致）：
  #   1) 第一项必须是官方源；
  #   2) 必须含 ghfast.top 一项（本地 conan-verify 的 G2 会对此做 E017 预防）；
  #   3) 其余镜像项写成「镜像前缀 + 官方完整 URL」，不得裸用镜像域名。
  #
  # 实测（2026-09-29）：本机 curl 直连 github.com 返回 http=000（不可达），
  # 加 ghfast.top 前缀返回 200。镜像项在本环境下不是"可选兜底"而是必需通路。
  #
  # 任务版本号 git20230215.21a85fe 与上游 commit 精确对应：
  #   21a85fef159f9942f636a43b14c64b481c2a05b2  dated 2023-02-15T19:37:59Z
  # 短 hash 与全 hash 两种取法得到的 tarball sha256 一致、顶层目录名均为全 hash
  # （该差异已实测排除），故此处直接用全 hash 形式。
  url:
    - "https://github.com/google/ruy/archive/21a85fef159f9942f636a43b14c64b481c2a05b2.tar.gz"
    - "https://ghfast.top/https://github.com/google/ruy/archive/21a85fef159f9942f636a43b14c64b481c2a05b2.tar.gz"
    - "https://gh-proxy.com/https://github.com/google/ruy/archive/21a85fef159f9942f636a43b14c64b481c2a05b2.tar.gz"
  sha256: "e151a5b55059a6e83ded001787e1a8889ba1e5e4eaa5bc836b9b660e7e1cb519"

# googletest 供应条目（非 sources：它在 source() 阶段被 vendor 到
# third_party/googletest，不走 strip_root 的源码树）。
#
# 为什么必须有它：ruy 的上游测试全部由 gtest 驱动，而 GitHub archive 里
# third_party/googletest 是**未 checkout 的子模块（空目录）**。上游顶层
# CMakeLists 对它的引用带 EXISTS 保护：
#     if (NOT RUY_MINIMAL_BUILD AND NOT TARGET gtest
#         AND EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/third_party/googletest/CMakeLists.txt")
#       add_subdirectory("third_party/googletest" EXCLUDE_FROM_ALL)
#     endif()
# 空目录 ⇒ EXISTS 为假 ⇒ 静默跳过 ⇒ 测试目标在链接期找不到 gtest 目标。
# 把 googletest 源码放到该路径即可让这段逻辑生效并定义 gtest 目标。
#
# 版本取 v1.14.0 的依据：其 CMakeLists 声明 cmake_minimum_required 3.13，
# 在设备侧 CMake 4.x 上可正常 configure（1.11.0 声明 < 3.5，CMake 4.x 直接拒绝）。
# 该资源与 archives/c/cpuinfo 使用的是同一份，sha256 已在本机下载复核一致。
googletest:
  url:
    - "https://github.com/google/googletest/archive/refs/tags/v1.14.0.zip"
    - "https://ghfast.top/https://github.com/google/googletest/archive/refs/tags/v1.14.0.zip"
    - "https://gh-proxy.com/https://github.com/google/googletest/archive/refs/tags/v1.14.0.zip"
  sha256: "1f357c27ca988c3f7c6b4bf68a9395005ac6761f034046e9dde0896e3aba00e4"

patches:
  # List format (Conan 2.x standard — compatible with apply_conandata_patches).
  # 两个补丁都是"让上游在 CMake 4.x / CMakeDeps 环境下按预期工作"所必需，
  # 不是 OHOS 专属改动（上游 issue #328 已记录第一处）。
  - patch_file: "patches/0001-cmake-minimum-required-before-project.patch"
    patch_description: "Move cmake_minimum_required() to the top of CMakeLists.txt (CMake requires it before project(); upstream issue #328)"
    patch_type: "portability"
  - patch_file: "patches/0002-ruy-cc-library-allow-shared.patch"
    patch_description: "Drop the hardcoded STATIC in ruy_cc_library so BUILD_SHARED_LIBS is honoured"
    patch_type: "portability"
