# test_package/MANIFEST.yml — ruy 0.0.0-git20230215.21a85fe
# 位置: archives/r/ruy/0.0.0-git20230215.21a85fe/test_package/MANIFEST.yml
# 用途: 声明上游测试来源与数量口径（L0e 门禁要求本文件存在）

package: ruy/0.0.0-git20230215.21a85fe
homepage: "https://github.com/google/ruy"

# ── 上游测试 ─────────────────────────────────────────────────────────
# 上游顶层 CMakeLists.txt 仅在 NOT RUY_MINIMAL_BUILD 时调用 enable_testing()，
# 而 ruy_cc_test() 的首句就是 `if(RUY_MINIMAL_BUILD) return()`。
# 本配方**不设** RUY_MINIMAL_BUILD（保持顶层默认 OFF），因此 33 条 ctest 全部
# 被注册并在 build() 内以 cmake.test()（等价 ctest --output-on-failure）真实执行。
#
# 与之相对，Conan Center 的 ruy 配方设 RUY_MINIMAL_BUILD=True —— 那会让
# 33 条测试一条都不注册、enable_testing() 也不被调用（即"零上游测试"）。
# 本配方刻意不沿用该做法，以满足 L1c"上游测试真实执行并留下痕迹"。
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 注册点：ruy/CMakeLists.txt 32 条 + ruy/profiler/CMakeLists.txt 1 条 = 33 条。
# profiler 目录经 ruy/CMakeLists.txt 末尾的 ruy_add_all_subdirs() 自动纳入，
# 其 ruy_cc_test 无任何条件守卫（RUY_PROFILER 只影响要不要定义 RUY_PROFILER 宏）。
upstream_tests:
  # ---- 矩阵乘法主路径：快路径内核（test_fast.cc，11 条不同类型组合）----
  - file: ruy/test_fast.cc
    source: ruy-21a85fe/ruy/test_fast.cc
    description: >-
      快路径 GEMM 内核的端到端数值对拍，按 <LhsScalar, RhsScalar, AccumScalar,
      DstScalar> 组合注册 11 条 ctest（f32/f32、f64/f32、f32/f64、u8/u8→u8、
      i8/i8→i8、i8/u8→i8、u8/u8→i16、i8/i8→i32、i8/u8→i32、i8/i16→i16、i16/i8→i16）。
      测试自身以参考实现逐元素比对，覆盖 packing、kernel dispatch 与后处理链路。
    command: "ctest -R '^ruy_test_fast_'"
  # ---- 慢路径参考实现（test_slow.cc，8 条）----
  - file: ruy/test_slow.cc
    source: ruy-21a85fe/ruy/test_slow.cc
    description: >-
      slow/full 路径（未特化的 C++ 参考内核）的同类数值对拍，注册 8 条 ctest。
      快慢路径互为标尺，是本项目"测试有效性"的天然证据。
    command: "ctest -R '^ruy_test_slow_'"
  # ---- 核心组件单元测试（13 条）----
  - file: ruy/*_test.cc
    source: ruy-21a85fe/ruy/
    description: >-
      组件级单元测试 13 条：check_macros / wait / size_util / tune /
      prepacked_cache / allocator / block_map / matrix / mul_params /
      apply_multiplier / context / ctx / perchannel_buffers_reallocation。
    command: "ctest -R '^ruy_(check_macros|wait|size_util|tune|prepacked_cache|allocator|block_map|matrix|mul_params|apply_multiplier|context|ctx|perchannel)'"
  # ---- 溢出保护专项（1 条）----
  - file: ruy/test_overflow_dst_zero_point.cc
    source: ruy-21a85fe/ruy/test_overflow_dst_zero_point.cc
    description: "dst zero point 造成的定点溢出路径回归。"
    command: "ctest -R '^ruy_test_overflow_dst_zero_point$'"
  # ---- profiler 子目录（1 条）----
  - file: ruy/profiler/test.cc
    source: ruy-21a85fe/ruy/profiler/test.cc
    description: >-
      profiler 插桩的采集与落盘测试（依赖上面 ctest 之外的 ruy_profiler_test
      目标，其 DEPS 含 ruy_profiler_test_instrumented_library）。
    command: "ctest -R '^ruy_profiler_test$'"

# ── 本包自带的消费者用例 ─────────────────────────────────────────────
test_package_tests:
  - file: test_ruy.cpp
    description: >-
      消费者测试：以库的使用者身份只经 ruy/ruy.h 调用 ruy::Mul，
      ①2×2 float（row-major × col-major）逐元素校验；
      ②3×2 × 2×4 非方阵与 CPU 三重循环参考实现对拍；
      ③bias 逐列相加 + clamp 上下界；
      ④int8 → int32 原始累加器路径（量化内核，整数点积精确可预期）；
      ⑤1×1 退化形状与同一 Context 复用的一致性。
      不使用 assert()：CMake Release 会定义 NDEBUG 把 assert 预处理成空语句，
      会使测试退化成必然通过的假测试。改用自研 CHECK 宏累计失败数并以非零
      退出码上报，程序自报 checks/failures 计数。
    command: "./test_ruy"

# ── 数量口径 ─────────────────────────────────────────────────────────
# 上游以 ctest 注册条目为口径：CI 实际执行并在日志中报告的就是这 33 条。
upstream_test_total: 33
upstream_test_count_method: "auto"
upstream_test_audit: >-
  源码级审计（commit 21a85fe tarball）：ruy/CMakeLists.txt 内 ruy_cc_test(
  出现 32 次（NAME 唯一），ruy/profiler/CMakeLists.txt 内 1 次，合计 33；
  两处 CMakeLists 的 ruy_cc_test 均在 RUY_MINIMAL_BUILD=OFF 时走到
  add_executable + add_test。enable_testing() 由顶层 CMakeLists 第 31-33 行
  在 NOT RUY_MINIMAL_BUILD 时调用。ctest 粒度计数为 33。

test_counting:
  # 上游独立的 ctest 条目数
  upstream_independent_total: 33
  # 消费者用例：CHECK_* 调用点（源码层面静态可数，且每点只执行一次）
  integration_independent_total: 28
  shared_static_counted_once: true
  counting_note: >-
    消费者用例的断言数为**源码层面的静态调用点数**：T1=4、T2=12、T3=4、T4=4、T5=4，
    合计 28。T2 的 3x4 逐元素比较与 T5 的重复调用都已显式展开（不使用循环），
    因此静态调用点 == 运行时执行次数 == 28，不存在"循环放大分母"的歧义；
    程序结束时打印 checks=28 可自证。断言不随任何循环轮数变化。
    shared/static 只按一次计入，不重复计数。

test_case_count: 28
assertion_count: 28
