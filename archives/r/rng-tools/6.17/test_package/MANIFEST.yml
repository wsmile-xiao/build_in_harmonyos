# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点（rng-tools 6.17 tests/Makefile.am）：
#   dist_check_SCRIPTS = rngtesturandom.sh rngtestzero.sh rngtestjitter.sh
#   TESTS = $(dist_check_SCRIPTS)  → N_static = 3（shell 用例，无 C 测试源）
# 三个用例均通过顶层 `make check`（SUBDIRS=contrib tests）由
# automake test harness 真实执行，build() 内 target="check" 集成。

package: rng-tools/6.17
homepage: "https://github.com/nhorman/rng-tools"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/rngtesturandom.sh
    source: rng-tools-6.17/tests/rngtesturandom.sh
    description: "cat /dev/urandom 100 块过 rngtest FIPS-140-2 检测（无 /dev/urandom 或偶发失败时 exit 77 跳过，脚本自带）"
    command: "make check (tests/rngtesturandom.sh)"
  - file: tests/rngtestzero.sh
    source: rng-tools-6.17/tests/rngtestzero.sh
    description: "反向断言：cat /dev/zero 必须被 rngtest FIPS 检测拒绝（未拒绝则 exit 1 判失败）"
    command: "make check (tests/rngtestzero.sh)"
  - file: tests/rngtestjitter.sh
    source: rng-tools-6.17/tests/rngtestjitter.sh
    description: "rngd 仅启用 jitter 熵源产出熵流喂 rngtest -c 100，30 秒后 killall -9 rngd 兜底"
    command: "make check (tests/rngtestjitter.sh)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实驱动 rngtest（/dev/zero 必须被 FIPS 拒绝、/dev/urandom 输出 FIPS 报告）与 rngd -v（版本响应）"
    command: "./test_rng-tools"

# 测试断言总数 (test_package/test.c 中 if-guard 断言的实数，逐行核对:
# 38/44/51/55/62/66 共 6 处；第 20/25 行是 run_capture() 的错误分支而非断言，
# 不计入；上游 3 个 shell 用例的断言计入 upstream_tests，亦不在此数内)
assertion_count: 6
