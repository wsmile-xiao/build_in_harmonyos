# 版本级 manifest
# 文件位置: archives/r/rng-tools/6.17/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# 本文件全部字段按 2026-09-23 设备实跑读数回填（同源见 notes.md「验证结果」与
# test_package/MANIFEST.yml；未回填的模板占位符会同时破坏 review 第 4/6 项与
# "正文数字与证据同源"要求）

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.17"

# 软件名
software: rng-tools

# 编译状态
# published | built | failed | archived
# R29: 本地 conan create 通过、尚未发布到制品仓 => built，不伪造 published
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: autotools

# ============================================================
# 测试读数（与 notes.md 五维账本、conan-create.log 的 automake 汇总同源）
# scripts/ohc/submission.py 的 review 第 4 项读这两个键，缺了就落 0
# ============================================================

# 上游 make check 注册并真实执行的用例（3 个 shell 用例，# PASS: 3 / # SKIP: 0 / # FAIL: 0）
test_passed: 3
test_failed: 0
test_skipped: 0
# test_package 消费者测试：1 个程序、6 处 if-guard 断言（不计入上面两个计数）
consumer_tests: 1
consumer_assertions: 6

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/nhorman/rng-tools/archive/refs/tags/v6.17.tar.gz"

  # 源码校验和
  sha256: "4aa50994232da74499b60b3ebf79118e30a1943be375b7d931dcf18df5442fd3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（与 conanfile.py generate() 注入的 AutotoolsToolchain 参数一致；
  # --prefix/--bindir/--sbindir/--libdir/--includedir/--oldincludedir 由 conan
  # 工具链自动注入，不在此列）
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--without-nistbeacon"
    - "--without-qrypt"
    - "--without-pkcs11"
    - "--without-rtlsdr"

  # 编译依赖列表（格式: name/version）—— conanfile.py requirements() 的 4 项
  dependencies:
    - "openssl/3.5.8.1"
    - "libcap/2.73"
    - "argp-standalone/1.5.0"
    - "jitterentropy-library/3.6.3"

  # 构建期工具依赖（tool_requires，不进产物运行时依赖）:
  #   automake/1.18, libtool/2.5.4（tag 归档无预生成 configure，需 autoreconf 自举）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表：上游源码零改动，亲和性垫片是 build() 生成的配方侧文件（不是补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（对应路径 B 草稿
# knowledge/drafts/DRAFT-rng-tools-6.17-musl-pthread-affinity-decl-and-link-shim.kv）
knowledge_gained:
  - "OHOS musl 对 pthread_setaffinity_np / pthread_attr_setaffinity_np 声明层与符号层双缺（glibc-only _np 扩展），-D_GNU_SOURCE 零效果：四态对照实验 S1（全裸）与 S2（仅 -D_GNU_SOURCE）的 configure 日志逐字节相同（sha256 一致），同一处 AC_MSG_ERROR 硬中止；configure.ac:117-121 的嵌套双探测双失败即硬错误 => 包连 configure 都过不去"
  - "非侵入两层垫片，缺一即失败：-include 生成的 rngtools_np_affinity.h 让 AC_CHECK_DECL 转绿（故意只声明 plain 变体 => configure 落 else 分支 AC_DEFINE(HAVE_PTHREAD_SETAFFINITY)），llvm-ar 打的 librngnpcompat.a 转发 sched_setaffinity(2) 经 LDFLAGS=-L + LIBS=-lrngnpcompat 进链接；只补声明层时 make 报 undefined symbol: pthread_setaffinity_np（rngd_jitter.c 两处引用）"
  - "把 .o 绝对路径塞进 LDFLAGS 与 -L 目录 + -l 名字语义不同：只有后者能被 configure 的 conftest 与生成的 Makefile 稳定解析"
  - "设备级 SHELL 坑（KB §12.49）：profile [buildenv] 的 SHELL/CONFIG_SHELL 指向 harmonybrew bash 5.3，该 bash 在 HMDFS 任意目录 getcwd 必挂，autoconf 经 $CONFIG_SHELL 重 exec 自身 => configure: error: working directory cannot be determined（伴随 34 条 shell-init/job-working-directory getcwd 报错、errno 乱值）；配方内用 CONFIG_SHELL=/bin/sh SHELL=/bin/sh /bin/sh <configure> <args> 绕开（命令行赋值优先于 conanbuild.sh 的 export），不改框架 profile"
  - "CONAN_HOME 路径含非 ASCII 时 conan-verify 会崩：scripts/ohc/conan_verify.py 用 subprocess.run(capture_output=True, text=True) 严格 utf-8 解码，构建日志里的 CJK 路径在管道分块边界被切断 => UnicodeDecodeError(0xe4)，rc=2 且拿不到判决；换 ASCII CONAN_HOME 即恢复"
  - "musl 无 argp 时只能外链 argp-standalone/1.5.0，--without-libargp 会直接 AC_MSG_FAILURE（该选项在本平台是死路）"
  - "libcap/2.73 包不自带 .pc，而 configure.ac 对 openssl/libcap 用 PKG_CHECK_MODULES => 必须 PkgConfigDeps 生成并把 generators_folder 放 PKG_CONFIG_PATH 最前；jitterentropy 走 AC_SEARCH_LIBS，靠 cpp_info 注入的 -I/-L 命中"
  - "GitHub tag 归档不含预生成 configure => autoreconf --force --install + tool_requires(automake/1.18, libtool/2.5.4)；随后 E490 恢复 8 个 helper 可执行位、E011 把自举产物里的 umask 077 改 022，并把 ACLOCAL/AUTOMAKE/AUTOCONF/AUTOHEADER/AUTOM4TE 设为 : 防 make 重生成"
  - "config.guess 不识 HarmonyOS 且 HMDFS 禁执行探测程序 => 显式单三元组 --build=aarch64-unknown-linux-ohos（E007）"
  - "上游 rngtestjitter.sh 受 rngd -O jitter:timeout 默认 5s 约束，多窗口并发高负载下 jitter 线程调度延迟可超 5s => 用上游自带旋钮 RNGD_JITTER_TIMEOUT=120 避免假失败；autotools 语义里只有 exit 77 才是 SKIP，本包三条用例 .log 尾部均为 exit status: 0"
  - "平台无用且依赖沉重的可选熵源显式关闭：--without-nistbeacon(libxml2+libcurl+jansson) --without-qrypt(libcurl) --without-pkcs11(libp11) --without-rtlsdr；jitter 与 RNDR（musl 提供 sys/auxv.h + getauxval）保留"
