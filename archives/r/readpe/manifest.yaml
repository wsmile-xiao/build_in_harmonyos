software: readpe
display: "PE Analysis Toolkit (pev)"
description: "PE文件分析工具包，包含11个工具用于解析PE格式二进制文件（readpe, pehash, pesec, pescan, pedis等）"
category: analysis
homepage: "https://pev.sourceforge.net/"
license: GPL-3.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "OpenHarmony使用XSI-compliant strerror_r，需添加#ifdef __OHOS__检测"
    - "Makefile不识别HarmonyOS平台，需手动创建静态库libpe.a"
    - "链接方式改为静态库libpe.a替代动态库-lpe"
    - "使用-fuse-ld=bfd避免lld的libxml2依赖问题"
    - "OpenHarmony缺少install命令，需手动cp复制文件"
    - "二进制需要ELF签名才能执行"
    - "plugins需要共享库支持，当前未编译"
  common_dependencies:
    - openssl

versions:
  "0.81":
    status: built
    build_date: "2026-06-16"
    source_url: "https://downloads.sourceforge.net/project/pev/pev-0.81/pev-0.81.tar.gz"