sources:
  url: "https://github.com/gbdev/rgbds/archive/refs/tags/v1.0.1.tar.gz"
  sha256: "193469d38229a653bb33a25ebb73fd0ae33da4be80191d83bce8d427d23b7704"

patches:
  - patch_file: "patches/0001-run-tests-ohos-shebang.patch"
    patch_description: "Invoke test.sh via bash so the upstream /usr/bin/env shebang is bypassed on OHOS (E037)"
    patch_type: "portability"
  - patch_file: "patches/0002-gfx-test-ohos-png-flags.patch"
    patch_description: "Pass PNG flags from the recipe environment when building the rgbgfx test helpers (no pkg-config on OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0003-fix-test-ohos-pwd.patch"
    patch_description: "Derive the fix-test source dir from the script path instead of $PWD (unbound when bash getcwd fails on OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0004-gfx-test-ohos-process-substitution.patch"
    patch_description: "Replace bash process substitution (</dev/fd> blocked on OHOS) with a temp file in the gfx stdin-variant diff"
    patch_type: "portability"
  - patch_file: "patches/0005-gfx-test-posix-spawn-environ.patch"
    patch_description: "Pass environ to posix_spawn so the rgbgfx_test helper children inherit LD_LIBRARY_PATH (libpng on OHOS)"
    patch_type: "portability"
