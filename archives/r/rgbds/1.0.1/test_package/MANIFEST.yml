package: rgbds/1.0.1
homepage: "https://rgbds.gbdev.io/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream ships a large regression suite under test/ driven by
# test/run-tests.sh, which requires the external codebase fetch step
# (test/fetch-test-deps.sh) and is therefore not run inside the recipe.
upstream_tests: []

test_package_tests:
  - file: test_rgbds.sh
    description: "Version-check the four tools, then assemble, link, and fix a minimal Game Boy ROM"
    command: "bash test_rgbds.sh"

assertion_count: 8
