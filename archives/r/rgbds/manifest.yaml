software: rgbds
display: "RGBDS"
description: "Rednex Game Boy Development System——任天堂 Game Boy/Game Boy Color 汇编工具链"
category: build-tool
homepage: "https://rgbds.gbdev.io/"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "C++20 编译，需 bison 生成 parser（tag 归档不含生成源码）"
    - "rgbgfx 链接 libpng，配方直接取依赖 flag，避免 pkg-config 工具依赖"
    - "上游 make install 依赖 GNU install，配方改用 copy() 手动打包（E098）"
  common_dependencies:
    - libpng
    - bison

versions:
  "1.0.1":
    status: built
    build_date: "2026-09-11"
