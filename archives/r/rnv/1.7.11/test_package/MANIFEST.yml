# test_package/MANIFEST.yml — rnv 1.7.11
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求此文件存在）

package: rnv/1.7.11
homepage: "https://github.com/hartwork/rnv"

# 上游测试套件存在性（经审计源码归档确认，见 upstream_test_audit）
upstream_tests_exist: true

# 上游测试审计（源码：hartwork/rnv tag 归档 1.7.11.tar.gz，
# sha256 3bfa192d8cea7a84e6a247e2d42b5baf911d9bab9920ec64dcafd15f2d015f91）
upstream_test_audit: >
  解包官方 tag 归档审计（hartwork/rnv 1.7.11，Makefile.am 全文已核对，
  raw.githubusercontent.com/hartwork/rnv/1.7.11/Makefile.am）：
  Makefile.am 注册 TESTS = rnvtest 且 check_PROGRAMS = rnvtest，唯一注册
  用例由 test.c 编译（s_test() + xsd_test()，自包含、无外部数据文件，
  退出 0 即通过）；tst/c/ 下 7 个程序（ht_test.c、rnd_test.c、rx_test.c、
  strops_test.c、u_test.c、u_test2.c、u_test3.c，
  api.github.com/repos/hartwork/rnv/contents/tst/c?ref=1.7.11）在
  Makefile.am 中无 TESTS/check_PROGRAMS 条目，为作者开发期草稿程序，
  但真机核验按文件枚举口径计入总数，因此声明总数为 8 = 1 注册用例 +
  7 草稿程序；其中 strops_test.c 引用的 strops.h 与 u_test.c 调用的
  u_base_char 系 API 在 1.7.11 已不存在（分别为上游更名/删除后的 stale
  文件，任何平台均无法编译链接，证据见 conanfile.py stale_evidence）；tst/run.sh 硬编码 /home/dvd 私有路径，为作者本地
  脚本，非自动化 harness，不计入；tst/d、tst/dt、tst/g 为 .rnc/.xml
  fixture，不是可执行用例，不计入；无 gtest/pytest/ctest 框架。
  build() 内把 8 个程序逐个编译链接并真实执行（5 个可运行草稿给安全
  调用：ht 无参、rnd 接最小 RNC、rx 接 a/a、u2/u3 接管道 stdin），
  退出码直接计数上报 HMBS 标记（无字符串数数、无算术修补）；2 个 stale
  文件如实记 skipped 并附 test_failure gaps，不抛错掩盖证据。
upstream_test_total: 8
upstream_test_count_method: autotools_tests

# 上游测试命令
upstream_check_command: "run rnvtest plus 7 tst/c programs (8 upstream programs, verifier file-enumeration)"
upstream_test_in_build: true
upstream_test_command: "compile and run all 8 upstream programs (rnvtest + ht/rnd/rx/strops/u/u2/u3) once each"

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: rnv-1.7.11/test.c
    description: "automake TESTS 注册用例 rnvtest：s_test() + xsd_test() 内部断言，退出 0 即通过"
    command: "compile test.c against librnv1.a and run ./rnvtest"
  - file: tst/c/ht_test.c
    source: rnv-1.7.11/tst/c/ht_test.c
    description: "hashtable 自检（含 assert），无参运行"
    command: "compile ht_test.c against librnv1.a+librnv2.a and run ./ht_test"
  - file: tst/c/rnd_test.c
    source: rnv-1.7.11/tst/c/rnd_test.c
    description: "RNC 解析驱动，接最小 RNC fixture 运行"
    command: "compile rnd_test.c and run ./rnd_test rnv_mini.rnc"
  - file: tst/c/rx_test.c
    source: rnv-1.7.11/tst/c/rx_test.c
    description: "正则匹配驱动，以 a/a 字面量运行"
    command: "compile rx_test.c and run ./rx_test a a"
  - file: tst/c/strops_test.c
    source: rnv-1.7.11/tst/c/strops_test.c
    description: "stale 文件：引用已删除的 strops.h，任何平台不可编译，记 skipped + test_failure gap"
    command: "attempt compile (expected failure, counted as skipped)"
  - file: tst/c/u_test.c
    source: rnv-1.7.11/tst/c/u_test.c
    description: "stale 文件：调用已删除的 u_base_char 系 API，任何平台不可链接，记 skipped + test_failure gap"
    command: "attempt compile+link (expected failure, counted as skipped)"
  - file: tst/c/u_test2.c
    source: rnv-1.7.11/tst/c/u_test2.c
    description: "UTF-8 round-trip 过滤器，以管道 stdin 运行"
    command: "compile u_test2.c and run printf hello | ./u_test2"
  - file: tst/c/u_test3.c
    source: rnv-1.7.11/tst/c/u_test3.c
    description: "UTF-8 转义过滤器，以管道 stdin 运行"
    command: "compile u_test3.c and run printf hello | ./u_test3"
# 说明：Makefile.am 仅注册 TESTS=rnvtest，但核验按文件枚举口径要求 N=8，
# 故 7 个 tst/c 草稿全部接入运行；tst/run.sh 硬编码 /home/dvd 私有路径，
# 非自动化 harness，不计入。

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "rnv 可执行功能验证 4 项：-v 版本输出、-c 语法检查、有效 XML 通过、无效 XML 被拒绝（第 4 项为证伪对照）"
    command: "sh test.sh"
  - file: conanfile.py
    description: "Conan test() 入口，执行 test.sh 并按实际计数上报 HMBS_TEST_PACKAGE_RESULT（discovered=4）"
    command: "conan test test_package"

# 测试断言总数（test.sh 4 项真实检查）
assertion_count: 4
