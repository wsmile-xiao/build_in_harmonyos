# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: randmac/0.2
homepage: "https://github.com/virtualsquare/randmac"

# 上游测试清点（R51 三步法，2026-09-18，tag 0.2）：
# 上游无任何测试——源码树仅 randmac.c/CMakeLists.txt/man/COPYING/README，
# 无 test/ 目录；CMakeLists.txt 无 enable_testing/add_test，构建树无
# CTestTestfile.cmake（清点证据见 notes.md）。注册测试数 = 0，故本表
# 上游运行清单为空。验证由 test_package 消费者测试承载。
upstream_check_command: "ctest -N（无注册测试，清单为空）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试，故为空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_randmac.sh
    description: "消费者测试：真机运行 randmac 二进制，断言 MAC 格式/qemu-xen OUI/strcase 大小写无关分支/EUI-64/本地与组播单播位/--help 退出码"
    command: "./test_randmac.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
