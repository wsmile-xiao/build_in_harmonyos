knowledge_gained:
  - "上游 CMakeLists 的 check_include_file 探测需经 CMakeToolchain 注入 CMAKE_REQUIRED_INCLUDES，编译 -I 需注入 CMAKE_C_FLAGS（R33：经 Toolchain 而非裸 shell 变量）"
