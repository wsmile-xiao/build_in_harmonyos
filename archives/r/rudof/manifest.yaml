# 软件级 manifest — rudof
# 遵循 ARCHIVE-SPEC v2.0

software: rudof
display: "rudof"
description: "RDF 数据形状与知识图谱处理工具箱 — ShEx/SHACL 校验、SPARQL 查询、DCTAP/PGSchema、格式转换与合成数据生成"
category: utility
homepage: "https://github.com/rudof-project/rudof"
license: MIT OR Apache-2.0
build_system: cargo

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Rust cargo 项目（workspace，CLI crate=rudof_cli，edition 2024）：依赖闭包 518 包全为纯 Rust / 自带 C 源码（ring 随 cc 就地编译），cargo build --release --locked 直接编译"
    - "设备无 cargo/rustc：经 tool_requires 引用制品仓基础设施包 rust-toolchain/1.97.1（宿主与目标均为 aarch64-unknown-linux-ohos）"
    - "rust-lang dist 工具链二进制无 code signature，OHOS 拒绝 execve（E318）：配方内 binary-sign-tool -selfSign 1 自签名 cargo/rustc/librustc_driver，其余负载软链"
    - "cargo 自身动态链接 OpenSSL/zlib：harmonybrew openssl@3/zlib-ng-compat bottle 提供运行库，OHOS loader 忽略 DT_RUNPATH 须显式 LD_LIBRARY_PATH"
    - "设备无默认 CA store：SSL_CERT_FILE/CURL_CA_BUNDLE 指向系统 cacert.pem，crates 索引走 rsproxy.cn sparse 镜像"
    - "禁止 rustup 引导（rustup 无法识别 HarmonyOS 宿主，E105/E154）"
    - "OHOS /tmp 只读（E002）：构建与上游测试需可写 TMPDIR"
    - "上游测试 cargo test --release --locked 全离线（rudof_cli crate 11 个单元测试），真机可直接运行"
    - "源码选 crates.io rudof_cli 归档（内含发布时一致的 Cargo.lock，--locked 可复现）；GitHub tag 0.3.6 根锁陈旧（成员记 0.3.5）且 shexTest/data-shapes 为未随归档附带的 git 子模块"
  common_dependencies:
    - rust

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.3.6":
    status: built
    build_date: "2026-10-01"
    published_as: rudof/0.3.6
