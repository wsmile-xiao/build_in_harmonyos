# conandata.yml — rudof 0.3.6
# 官方源：crates.io 归档（rudof_cli crate，由上游 rudof-project/rudof 发布；
# 内含发布时验证过的 Cargo.lock，支持 `cargo --locked` 可复现构建）。
# 说明：GitHub tag 0.3.6 tarball 的根 Cargo.lock 仍记录成员为 0.3.5
# （release.yml 只 bump Cargo.toml 不更新锁），--locked 会失败；
# 且其 shexTest / data-shapes 为未随归档附带的 git 子模块，
# cargo test --workspace 无法完整运行 —— 故选用 crates.io 归档。

sources:
  url: "https://static.crates.io/crates/rudof_cli/rudof_cli-0.3.6.crate"
  sha256: "537b1c355bb4d11a1063a69bcdd7c616ed9cc4a0c84d81b289fe586af2c0b948"
  # .crate 归档实为 gzip+tar；显式声明文件名让 conan get() 按 tar.gz 解包
  # （否则 conan 2 按 zip 尝试解压报 BadZipFile）
  filename: "rudof_cli-0.3.6.tar.gz"
