# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51：上游测试三步法申报）

package: rudof/0.3.6
homepage: "https://github.com/rudof-project/rudof"

# 上游测试命令（cargo 项目，无 make check / ctest / meson test）
# rudof_cli crate 上游单元测试全部位于 src/cli/wrappers/backend.rs 的
# #[cfg(test)] tests 模块（11 个 #[test]）。`--tests` 覆盖 lib + bin 测试目标；
# doc-test 除外：rust-toolchain/1.97.1 基础设施包不含 rustdoc 二进制。
upstream_check_command: "cargo test --release --locked --tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cargo test --release --locked --tests --target aarch64-unknown-linux-ohos"

# 上游实际运行的测试程序（cargo 测试，静态统计 11 个 #[test] 函数）
upstream_tests:
  - file: "src/cli/wrappers/backend.rs"
    source: "rudof_cli-0.3.6/src/cli/wrappers/backend.rs"
    description: "11 个单元测试（backend 参数解析与解析策略）：parses_memory / parses_qlever / parses_endpoint_url / parses_endpoint_name / preserves_case_in_endpoint_value / rejects_bare_endpoint / rejects_unknown_value / display_round_trips / resolve_backend_prefers_endpoint_shortcut / resolve_backend_uses_backend_when_endpoint_absent / resolve_backend_defaults_to_memory_when_both_absent"
    command: "cargo test --release --locked --tests --target aarch64-unknown-linux-ohos --lib"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_rudof.py
    description: "消费者冒烟+功能测试：--help / --version / `rudof data` 真实加载并重新序列化 Turtle 图"
    command: "python3 test_rudof.py"

# 鸿蒙特有测试 (HarmonyOS-specific)：断言产物在本平台可用所必需的特性
# B1 ELF machine = AArch64；B2 PT_INTERP = OHOS musl loader（证明是 OHOS
# musl 二进制而非 glibc Linux）；B3 含 OHOS code signature（未签名 ELF 在
# HarmonyOS 上无法 execve，EACCES errno 13，正是配方 _sign_binaries() 修复的
# 失败点）；B4 非空可执行文件
harmonyos_specific_tests:
  - file: test_rudof.py
    description: "鸿蒙特有测试 4 项（AArch64 / musl 解释器 / code signature / 产物完整性）"
    command: "PACKAGE_FOLDER=<pkg> python3 test_rudof.py"
    assertion_count: 4

# 依赖测试：rudof 为纯 Rust 产物，依赖闭包（518 包）全为纯 Rust / 自带 C 源码，
# 无 C/C++ 目标依赖包消费面，故无 dependency_tests。
dependency_tests: []

# 测试断言总数 (近似值, 用于质量评估)
# 上游 cargo 测试 11 + test_package 消费者冒烟 4 + 鸿蒙特有测试 4
assertion_count: 19
