# 版本级 manifest — rudof 0.3.6

version: "0.3.6"
software: "rudof"

# 编译状态
# built：HarmonyOS PC (aarch64) 本地交叉编译 + 上游测试 + test_package 通过；
# Rust 工具链由制品仓基础设施包 rust-toolchain/1.97.1 提供（tool_requires），
# 不依赖系统 cargo、不使用 rustup 引导（rustup 无法识别 HarmonyOS 宿主）。
status: built

build_date: "2026-10-01"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39；选 crates.io 归档因内含发布时一致的
  # Cargo.lock，GitHub tag 0.3.6 tarball 根锁仍记成员为 0.3.5）
  url: "https://static.crates.io/crates/rudof_cli/rudof_cli-0.3.6.crate"
  sha256: "537b1c355bb4d11a1063a69bcdd7c616ed9cc4a0c84d81b289fe586af2c0b948"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（Rust cargo 项目，配方内自管 cargo 命令）
  system: custom
  configure_options: []
  # 编译依赖列表（纯 Rust 项目，无 C/C++ 目标依赖）
  dependencies: []
  # 构建期工具依赖（tool_requires）
  build_tools:
    - "rust-toolchain/1.97.1"
  # 编译器（链接器为 OHOS SDK aarch64-unknown-linux-ohos-clang）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无：上游代码零修改，纯 Rust 无平台相关编译问题）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Rust workspace 项目仅需发布 CLI crate：rudof_cli 的 crates.io 归档即自洽可 --locked 构建，其 Cargo.lock 已把 path 依赖归一化为 registry 版本（dctap/rudof_lib/... 0.3.6），无需下载 22 成员工作区"
  - "GitHub tag tarball 的根 Cargo.lock 可能滞后（release.yml 只 bump Cargo.toml），--locked 会失败；且子模块（shexTest/data-shapes）不随归档附带 —— 选 crates.io 归档更可复现"
  - "纯 Rust 工具型包在 OHOS 的通用配方形态：tool_requires rust-toolchain/1.97.1 + 自签名工具链 + harmonybrew cargo 运行库（openssl@3/zlib-ng）+ rsproxy/CA + 可写 TMPDIR"
  - "cargo test --release --locked --tests --target aarch64-unknown-linux-ohos 在真机（host=target）直接可跑：cargo 编译的测试二进制无需签名即可执行，只有 rust-lang dist 包内 cargo/rustc 需自签名"

# ============================================================
# 交付物
# ============================================================

artifacts:
  - "bin/rudof"
