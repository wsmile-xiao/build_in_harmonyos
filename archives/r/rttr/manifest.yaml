software: rttr
display: "rttr"
description: "RTTR（Run Time Type Reflection）C++11 运行时类型反射库：运行时枚举/调用类的方法、属性与构造函数"
category: library
homepage: "https://www.rttr.org"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "官方源为 GitHub rttrorg/rttr（v0.9.6 标签归档，设备可直接下载）；零第三方依赖（Catch/RapidJSON/Nonius 为内置 vendor，Boost 仅 benchmarks 需要且已关闭）"
    - "os=OHOS 映射的 CMAKE_SYSTEM_NAME=HarmonyOS 下 UNIX 未定义，上游 config.cmake 直接 fatal；配方统一覆盖 CMAKE_SYSTEM_NAME=Linux"
    - "上游 cmake_minimum_required 3.0 被 CMake 4 拒绝；经 CMAKE_POLICY_VERSION_MINIMUM=3.5 兜底，不改源码"
    - "clang 15 -Werror（上游自加）下需 4 个库头移植补丁：aarch64 架构探测缺失、浮点/整型边界比较隐式窄化、函数指针有序比较；单元测试另有 C++17 std::variant 二义等 20 个测试源补丁（仅测试目标）"
    - "安装规则门在 BUILD_INSTALLER 之后，OFF 时 cmake --install 静默零安装"
  common_dependencies: []

versions:
  "0.9.6":
    status: built
    build_date: 2026-09-17
