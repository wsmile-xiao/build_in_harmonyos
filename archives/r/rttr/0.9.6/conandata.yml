sources:
  "0.9.6":
    # 官方源：GitHub rttrorg/rttr 官方仓库 v0.9.6 标签归档。
    url:
      - "https://github.com/rttrorg/rttr/archive/refs/tags/v0.9.6.tar.gz"
    sha256: "058554f8644450185fd881a6598f9dee7ef85785cbc2bb5a5526a43225aa313f"

patches:
  # ---- 库头文件移植修复（aarch64-OHOS / clang 15，-Werror 下编译所必需）----
  - patch_file: "patches/0001-src-rttr-detail-base-core_prerequisites.h.patch"
    patch_description: "RTTR_ARCH_TYPE 64 位探测补 __aarch64__/_M_ARM64：原列表缺 aarch64，导致 64 位平台误判 32 位（type::get_sizeof 断言走错分支，设备实测失败）"
    patch_type: "portability"
  - patch_file: "patches/0002-src-rttr-detail-comparison-compare_less_impl.h.patch"
    patch_description: "compare_less_than 对函数指针做 < 有序比较（合法 C++，仅次序未指定），clang 15 在 -Werror 下报 -Wordered-compare-function-pointers；以 clang 守卫的局部 pragma 保持语义不变"
    patch_type: "portability"
  - patch_file: "patches/0003-src-rttr-detail-conversion-number_conversion.h.patch"
    patch_description: "浮点→整型边界比较改显式 static_cast<F>：std::numeric_limits<T>::max() 隐式转浮点丢精度，clang 15 报 -Wimplicit-const-int-float-conversion（-Werror，设备实测 9 处实例化失败）；运行时语义与原隐式转换完全一致"
    patch_type: "portability"
  - patch_file: "patches/0004-src-rttr-detail-misc-misc_type_traits.h.patch"
    patch_description: "has_less_than_operator 探针的未求值 < 同样命中函数指针有序比较警告；同 0002 以局部 pragma 抑制，trait 结果不变"
    patch_type: "portability"
  # ---- 单元测试源码修复（仅 BUILD_UNIT_TESTS=ON 的上游测试目标，不进包；PR 正文“上游测试用例修改说明”逐条申报）----
  - patch_file: "patches/0005-src-unit_tests-enumeration-enumeration_misc.cpp.patch"
    patch_description: "C++17 下 using namespace rttr + using namespace std 使裸 variant 与 libc++ std::variant 二义；裸引用限定为 rttr::variant（其余同族补丁 0007-0014/0017-0024 同因，仅机械限定，不改断言）"
    patch_type: "test_fix"
  - patch_file: "patches/0006-src-unit_tests-instance-instance_test.cpp.patch"
    patch_description: "instance_base 有虚函数（RTTR_ENABLE）但无虚析构，经基类智能指针删除触发 clang -Wdelete-non-abstract-non-virtual-dtor（-Werror）；补 virtual ~instance_base()=default（置于 RTTR_ENABLE 之前，宏以 private: 结尾）"
    patch_type: "test_fix"
  - patch_file: "patches/0007-src-unit_tests-method-method_invoke_test.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0008-src-unit_tests-method-method_misc_test.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0009-src-unit_tests-method-test_method_reflection.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0010-src-unit_tests-property-property_class_inheritance.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0011-src-unit_tests-property-property_class_invoke_wrapper.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0012-src-unit_tests-property-property_global_function.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0013-src-unit_tests-property-property_member_function.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0014-src-unit_tests-property-property_member_object.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0015-src-unit_tests-test_classes.h.patch"
    patch_description: "CLASS 宏夹具类有虚函数（getType/RTTR_ENABLE）但无虚析构，经基类智能指针删除触发 -Wdelete-non-abstract-non-virtual-dtor；宏体最前补 virtual ~CLASS_NAME()=default（放在 RTTR_ENABLE 前保持 public），整条继承链自动获得虚析构"
    patch_type: "test_fix"
  - patch_file: "patches/0016-src-unit_tests-variant-variant_assign_test.cpp.patch"
    patch_description: "自赋值用例 a = a 被clang -Wself-assign-overloaded 判错（-Werror）；测试意图是验证 operator= 的自赋值安全性，改为经引用别名 self_ref 完成同一对象赋值（a = self_ref），语义与原断言不变"
    patch_type: "test_fix"
  - patch_file: "patches/0017-src-unit_tests-variant-variant_cmp_greater_or_equal.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0018-src-unit_tests-variant-variant_cmp_greater_test.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0019-src-unit_tests-variant-variant_cmp_less_or_equal.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0020-src-unit_tests-variant-variant_cmp_less_test.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0021-src-unit_tests-variant-variant_ctor_test.cpp.patch"
    patch_description: "__GNUG__ && __GNUC__ < 5 分支在 clang 下误入（clang 定义 __GNUG__ 且 __GNUC__=4.2.1），使用已废弃内建 __has_trivial_copy 触发 -Wdeprecated-builtins；分支条件补 !defined(__clang__)，clang 走 std::is_trivially_copyable 断言（上游本意）"
    patch_type: "test_fix"
  - patch_file: "patches/0022-src-unit_tests-variant-variant_misc_test.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0023-src-unit_tests-variant_associative_view-variant_associative_view_test.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
  - patch_file: "patches/0024-src-unit_tests-variant_sequential_view-variant_sequential_view_test.cpp.patch"
    patch_description: "同 0005：variant 二义限定"
    patch_type: "test_fix"
