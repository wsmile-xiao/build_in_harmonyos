# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_RTTR_DYNAMIC/-DBUILD_STATIC（shared 选项二选一）"
  - "-DBUILD_UNIT_TESTS=OFF"
  - "-DBUILD_BENCHMARKS=OFF"
  - "-DBUILD_EXAMPLES=OFF"
  - "-DBUILD_DOCUMENTATION=OFF"
  - "-DBUILD_INSTALLER=ON（安装规则在该选项之后）"
  - "-DBUILD_PACKAGE=OFF"
  - "-DUSE_PCH=OFF"
  - "-DCMAKE_SYSTEM_NAME=Linux（os=OHOS 映射的 HarmonyOS 平台名下 UNIX 未定义，config.cmake 直接中止）"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5（上游要求 CMake 3.0，CMake 4 拒绝）"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

