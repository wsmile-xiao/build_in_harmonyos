# 编译中学到的知识
knowledge_gained:
  - "os=OHOS 映射的 CMAKE_SYSTEM_NAME=HarmonyOS 下 UNIX 变量未定义，上游 config.cmake 的 if(UNIX) 直接 fatal——CMake 配方需覆盖 CMAKE_SYSTEM_NAME=Linux"
  - "上游安装规则门在 BUILD_INSTALLER 之后：该选项 OFF 时 cmake --install 静默零安装（仅打印 Install configuration）"
  - "RTTR_ARCH_TYPE 64 位探测缺 __aarch64__：aarch64 目标全按 32 位断言，单测 get_sizeof<int*>==4 失败"
  - "clang 定义 __GNUG__ 且 __GNUC__=4.2.1，上游 `#if __GNUG__ && __GNUC__ < 5` 的废弃内建分支在 clang 误入"

