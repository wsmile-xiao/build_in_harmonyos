# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rttr/0.9.6
homepage: "https://www.rttr.org"

# 上游测试命令 (上游 CMake BUILD_UNIT_TESTS 同构)
upstream_check_command: "cmake -DBUILD_UNIT_TESTS=ON（其余子项目 OFF）+ ninja 构建 unit_tests 后直跑单二进制"
upstream_test_in_build: false
upstream_test_command: "原生探索阶段在设备实跑（上游测试目标是可执行文件 unit_tests，需要 RTTR::Core 动态库一同部署；conan create 的打包构建不编测试，BUILD_UNIT_TESTS=OFF）"

# 上游实际运行的测试程序
upstream_tests:
  - name: "unit_tests (Catch 1.12 单二进制，62 个编入源文件)"
    source: "src/unit_tests/（loadFolder 加载 unit_tests.cmake 显式清单）"
    description: "覆盖 type/method/property/constructor/destructor/enumeration/instance/variant/variant_associative_view/variant_sequential_view/misc/plugin 全部反射 API；断言风格为 Catch CHECK/REQUIRE"
    command: "LD_LIBRARY_PATH=<build>/lib ./bin/unit_tests"
    expected: "All tests passed (4891 assertions in 531 test cases)"

# 测试统计口径（审方数法一致）
# 单位 = Catch TEST_CASE（case 级）；N = 源码 TEST_CASE 宏清点数（65 个 .cpp 中 546 个）。
# N′ = 531（上游 unit_tests.cmake 显式清单未纳入 variant_array_view/variant_array_view_test.cpp，
#      共 15 个用例；该文件测的 variant_array_view API 在 0.9.6 不存在——源内只有 variant_array，
#      单文件编译实证 "unknown type name 'variant_array_view'"。属上游清单排除，非本次适配裁剪）。
# TOTAL = PASS + FAIL + SKIP + NOT_RUN = 531 + 0 + 0 + 15 = 546
# 取数命令：
#   清点:   grep -rc "^TEST_CASE" src/unit_tests --include=*.cpp   → 合计 546
#   注册数: ./bin/unit_tests --list-test-names-only | wc -l        → 531
#   结果:   ./bin/unit_tests 末行                                   →
#           "All tests passed (4891 assertions in 531 test cases)"
test_statistics:
  total: 546
  passed: 531
  failed: 0
  skipped: 0
  not_run: 15
  not_run_reason: "variant_array_view/variant_array_view_test.cpp 整文件（15 个 TEST_CASE）：所测 variant_array_view API 在 0.9.6 不存在，上游 unit_tests.cmake 未将其列入构建清单；按上游构建定义执行"
  unit: "Catch TEST_CASE"
  environment: "设备原生执行（aarch64 OHOS，clang 15.0.4，shared librttr_core.so + unit_test_plugin；适配后源码 + 移植补丁，531/531 全通过）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者以 find_package(RTTR) 链接安装后的 RTTR::Core：编译期断言版本宏为 0.9.6（2 个 static_assert）；运行期经 RTTR_REGISTRATION 注册 product 类，反射构造 product(42,\"widget\")，按名读写属性 id/name、调用方法 get_id、校验属性/方法枚举计数与 get_sizeof（14 个运行期 CHECK）"
    command: "./test_package"
    expected: "输出 RTTR_TEST_PACKAGE_OK (15 checks)；exit 0"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17
