package: rapmap/0.15.0
homepage: "https://github.com/COMBINE-lab/RapMap"

# 上游测试入口：CMake 注册的 2 个 CTest 用例（enable_testing() 在
# CMakeLists.txt:16，add_test 在 src/CMakeLists.txt:172-173）。
# 语料随源码包分发（sample_data/），不需要联网。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - name: quasi_map_test
    file: cmake/TestQuasiMap.cmake
    source: RapMap-salmon-v0.15.0/cmake/TestQuasiMap.cmake
    description: >-
      端到端功能回归：在 sample_data/ 下执行 `rapmap quasiindex -t transcripts.fasta
      -i sample_quasi_index` 建准索引，再执行
      `rapmap quasimap -t 2 -i sample_quasi_index -1 reads_1.fastq -2 reads_2.fastq
      -o sample_quasi_map.sam` 做 paired-end 比对，最后断言 sample_quasi_map.sam
      存在；任一步 RESULT 非零或产物缺失即 FATAL_ERROR。语料为包内
      transcripts.fasta（29213 B）+ reads_1/2.fastq（各 1283063 B），无联网需求。
    command: 'cmake -DTOPLEVEL_DIR=<src> -P cmake/TestQuasiMap.cmake'
  - name: quasi_map_test_ph
    file: cmake/TestQuasiMapPerfectHash.cmake
    source: RapMap-salmon-v0.15.0/cmake/TestQuasiMapPerfectHash.cmake
    description: >-
      与 quasi_map_test 同构，但索引走 `quasiindex --perfectHash` 分支
      （perfect-hash minimizer 表），产出并断言 sample_quasi_map_ph.sam。
    command: 'cmake -DTOPLEVEL_DIR=<src> -P cmake/TestQuasiMapPerfectHash.cmake'

upstream_test_notes: "N_static=2，来自 `grep -rn add_test` 的全量清点（仅 src/CMakeLists.txt:172-173 两处），另 enable_testing() 位于 CMakeLists.txt:16。上游无 tests/ 目录、无 gtest/catch2、无 ctest 之外的自检入口；TestingScripts/ 是作者手工脚本，非注册测试。两例在配方 build() 内通过 ctest 运行，实测数字与跳过/失败明细见 notes.md §7。"

test_package_tests:
  - file: test.sh
    description: >-
      消费者视角的真实闭环：确认打包后的 rapmap 在 conanrun 环境可见；断言
      --version 输出 rapmap 横幅（并显式说明上游内部版本串硬编码为 0.6.0，
      故不比对 0.15.0）；断言 --help 列出 quasiindex 与 quasimap 两个子命令；
      用确定性同余生成 2 条 600bp 转录本与 4 对 100bp reads（read/quality
      等长校验），跑 quasiindex（plain）+ quasiindex --perfectHash 两轮建索引，
      断言索引目录含 quasi_index.log 与 refInfo.json（文件名取自
      src/RapMapSAIndexer.cpp:1002,1036）且文件数 >= 3；随后对两个索引分别跑
      quasimap，断言 SAM 非空、首行 @HD、@SQ 恰为 2 条、存在
      flag&4==0 且 RNAME!="*" 的比对记录，并断言所有比对记录的 RNAME 只落在
      自造的 TRNA/TRNB 上；最后确认随包 RunRapMap.sh 已安装可执行，
      并真的以它调起打包后的 rapmap 拿到横幅（该 helper 的上游 shebang 写死
      /bin/bash，OHOS 无此解释器路径，由补丁 0004 改为 env 形式后才可执行）。
      SAM flag 位判定用 int($2/4)%2 的可移植 awk 写法，不依赖 gawk 的 and()。
    command: "bash test.sh"
  - file: conanfile.py
    description: >-
      test() 通过 CONFIG_SHELL 指向的 bash 执行 test.sh（OHOS 的
      /system/bin/sh 为 mksh，无法执行 ELF 二进制），并带 env="conanrun"
      以便解析打包二进制的运行时依赖。
    command: 'bash test.sh'

assertion_count: 27
assertion_count_note: >-
  test.sh 内 27 个 ok()/bad() 判定站点（脚本自报 "N passed, M failed" 即按此计数），
  覆盖 1 个消费者程序（打包的 rapmap 二进制，另含经 RunRapMap.sh 的一次转调）；
  上游 2 例 CTest 另按 upstream_tests 单独申报，不与本数字混算。
