software: rapmap
version: "0.15.0"
status: built
build_date: "2026-09-28"
conan_ref: "rapmap/0.15.0"
build_system: cmake

source:
  url: "https://github.com/COMBINE-lab/RapMap/archive/refs/tags/salmon-v0.15.0.tar.gz"
  sha256: "cf0537c9cd4e8ce3b28ecca7eb78ee5c59e98a09f5390a5c548d0a5494bb54fc"
  tar_format: tar.gz
  upstream_tag: "salmon-v0.15.0"
  upstream_commit: "de73d6841932"

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DNO_NATIVE_ARCH=ON"
  dependencies:
    - zlib/1.3.1
    - cereal/1.3.2
    - libdivsufsort/2.0.1
  # jemalloc/5.3.0 从依赖中移除（2026-09-28 收尾-1B 实测：OHOS 包链入后
  # 进程启动即 SIGSEGV，--version 亦崩 RC=139；同源码去 allocator 后
  # ctest 2/2 + consumer 27/27 全绿）→ HarmonyOS PC 用系统分配器，
  # 决策记录见补丁 0001/0010 与 conanfile.py
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-consume-conan-dependencies-offline.patch"
  - "0002-src-cmake-imported-targets-and-non-x86-ksw2pp.patch"
  - "0003-ksw2pp-guard-cpuid-and-simd-entry-points-by-arch.patch"
  - "0004-runrapmap-use-env-shebang.patch"
  - "0005-rapmapfilesystem-no-accessperms.patch"
  - "0006-boophf-use-stdint-uint64-t.patch"
  - "0007-zstr-select-strerror-r-by-return-type.patch"
  - "0008-fastxparserthreadutils-guard-pause-by-arch.patch"
  - "0009-drop-unused-gomp-link-after-conan-libdivsufsort.patch"
  - "0010-link-zlib-and-jemalloc-imported-targets.patch"

knowledge_gained:
  - "上游 3 处 ExternalProject_Add 中只有 libdivsufsort 无开关（走包内本地 tarball），cereal 与 jemalloc 两处真联网拉取都被 find_package 的 FOUND 判定保护，制品仓齐货即可整块不生成"
  - "if (${UNSET_VAR}) 在 CMake 里展开成 if() 并按假处理（本机 cmake 4.1.2 实测不报错），故上游 if (${FETCHED_JEMALLOC}) add_dependencies(rapmap libjemalloc) 是从不生效的死代码"
  - "ksw2 的 SSE 内核整个函数体都在 #ifdef __SSE2__ 内，非 x86 上编出空目标文件，于是失败点从「编译期 intrinsic 报错」变成「链接期 undefined symbol」"
  - "OHOS clang 15 对 aarch64 传 -msse2 / -msse4.1 只报 -Wunused-command-line-argument 警告，RC=0，不是错误源"
  - "KSW2Aligner 运行时 SIMD 探测用 x86 cpuid 内联汇编，两个分支（64 位与 32 位）都是 x86 指令，非 x86 连汇编都过不去"
  - "上游 ksw2_extz2_sse 与标量 ksw_extz 参数表差一个 end_bonus，而作者自己在非 SIMD 分支里就是拿 ksw_extz 顶替（丢 end_bonus），退化映射有上游先例"
  - "libdivsufsort 制品包导出两个组件目标 divsufsort::divsufsort 与 divsufsort64::divsufsort64，头文件随 INTERFACE_INCLUDE_DIRECTORIES 传播，可替代 external/install 硬路径"
  - "conan-verify 会把含 github.com 的 conandata URL 整体换成 ghfast.top 前缀，该镜像实测 HTTP=000；把官方 URL 写成列表且首条不被该字符串替换命中，可让 Conan 顺序回落到可用端点"
  - "RapMap 内部版本串硬编码 0.6.0（include/RapMapConfig.hpp 与 current_version.txt），rapmap --version 不打印 tag 版本 0.15.0"
  - "上游 install(FILES scripts/RunRapMap.sh) 进 bin/ 的 shebang 写死 /bin/bash；OHOS 无该解释器路径（实测 /bin/bash 与 /usr/bin/bash 均不存在，/usr/bin/env 与 /data/service/hnp/bin/bash 存在），内核按字面解析 shebang ⇒ 与 PATH 无关必 ENOENT，改 env 形式后可执行"

test_results:
  type: official
  total: 2
  executed: 2
  passed: 2
  failed: 0
  skipped: 0
  consumer_assertions: 27
  notes: "上游 CTest 2 例（quasi_map_test / quasi_map_test_ph）全部执行全部通过：conan-verify G2 轮 100% tests passed（reports/conan-create.log），W3 本地 CI 轮同口径复现；test_package 消费者断言 27 通过 0 失败。详见 reports/test-report.md 与 notes.md §7"

knowledge_gained_extra:
  - "OHOS jemalloc/5.3.0 包二进制可链接但不可运行：rapmap 链入后 --version 即 SIGSEGV（RC=139，main 之前）；二分实验（同源码去 allocator）ctest 2/2 + consumer 27/27 全绿 ⇒ allocator 级不兼容，应用侧只能退化系统分配器并如实申报"
  - "Conan 包经 CMakeDeps 消费时遗留单值变量（如 ZLIB_LIBRARY）为空，必须用生成配置里的 imported target（zlib::zlib）链接，否则符号在链接期才暴露（deflateInit2_ 等）"

