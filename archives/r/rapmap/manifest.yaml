software: rapmap
display: "RapMap"
description: "基于 quasi-mapping 的转录组短序列比对器，提供 rapmap quasiindex/quasimap 命令行"
category: science
homepage: "https://github.com/COMBINE-lab/RapMap"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游用 ExternalProject_Add 拉三个依赖：libdivsufsort（包内 tarball + 嵌套 CMake，不继承交叉工具链）、cereal 1.2.2 与 fork 版 jemalloc 4.5.0（curl -k -L 联网 + autogen.sh）；制品仓四包齐货，全部改为消费 Conan 包，构建期零联网"
    - "cereal / jemalloc 两处拉取原本被 find_package 的 FOUND 判定保护，libdivsufsort 一处无开关；jemalloc 的兜底分支改成 configure 期 FATAL_ERROR，杜绝静默联网"
    - "ksw2 的 SIMD 内核（ksw2_extd2_sse.c / ksw2_extf2_sse.c / ksw2_extz2_sse.c / ksw2_gg2_sse.c）函数体整体包在 #ifdef __SSE2__ 内，aarch64 上编成空文件，症状从编译错变成链接期 undefined symbol"
    - "KSW2Aligner 的运行时 SIMD 探测是 x86 cpuid 内联汇编（64 位与 32 位两个分支都是），非 x86 无法汇编；按架构屏蔽后 haveSSE2/haveSSE41 保持默认 false"
    - "非 SSE2 架构上 ksw_extz2_sse2/sse41 退化为标量 ksw_extz、ksw_gg2_sse 退化为标量 ksw_gg2，正是上游自己非 SIMD 分支采用的映射（ksw_gg2 形参表与 ksw_gg2_sse 完全一致，含 CIGAR 输出）"
    - "OHOS clang 15 对 aarch64 的 -msse2 / -msse4.1 只给 -Wunused-command-line-argument 警告（RC=0），因此只需在非 x86 不建那两个 OBJECT 库"
    - "上游无条件追加 -march=native，配方使用上游自带的 NO_NATIVE_ARCH 开关关掉，避免产物钉死构建机指令集"
    - "上游内部版本串硬编码 0.6.0（include/RapMapConfig.hpp:31 与 current_version.txt），rapmap --version 输出 rapmap 0.6.0 而非 tag 版本 0.15.0，未改上游串"
    - "随包 install 进 bin/ 的 RunRapMap.sh 写死 #!/bin/bash，而 OHOS 无 /bin/bash 解释器路径（内核按字面解析 shebang，与 PATH 无关必 ENOENT）；改为 #!/usr/bin/env bash 后实测可执行"
  common_dependencies:
    - zlib
    - cereal
    - libdivsufsort
    - jemalloc

versions:
  "0.15.0":
    status: built
    build_date: "2026-09-24"
    conan_ref: "rapmap/0.15.0"
