# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# rocminfo 6.4.3 上游测试清点（R51 三步法）：
#   · `CMakeLists.txt` **无** `enable_testing()` / `add_test`；
#   · 全树 **无** tests/ 目录、无 ctest / pytest / HIT 注册；
#   · 上游 CI（`.github/workflows/rocm_ci_caller.yml`、`.azuredevops/rocm-ci.yml`）
#     只做 cmake 构建，**不跑任何测试**。
#   ⇒ 上游测试用例数 N = 0，无 `make check` 目标可集成到 build()。

package: rocminfo/6.4.3
homepage: "https://github.com/ROCm/rocminfo"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 实测：以下命令在上游源码树中均无对应目标 —— CMakeLists.txt 无 enable_testing()
upstream_check_command: "ctest --test-dir build   # 上游未注册任何测试（N=0）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者端到端测试 — 以消费者身份运行已安装的 rocm_agent_enumerator：① 交付件完整性（bin/ 脚本 + docs/ + licenses/，且存在可执行的 python 解释器）；② 文档化方式 2（脚本同目录的 target.lst）：注释行/空行解析、输出精确等于 `gfx906 gfx908 gfx1030`、退出码 0；③ 文档化方式 1（ROCM_TARGET_LST 环境变量）：输出精确等于 `gfx90a gfx942`、退出码 0；④ 文档化优先级：ROCM_TARGET_LST 必须胜过同目录 target.lst；⑤ 负对照：无任何目标来源时不得凭空输出目标（防“总是打印固定内容”的假实现）。共 5 组断言、9 个断言点，全部以真实运行交付件 + 校验 stdout/退出码的方式完成。"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
