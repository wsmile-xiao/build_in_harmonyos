knowledge_gained:
  - "musl 无 strtoq（glibc/BSD 扩展）：编译期只有 implicit-function-declaration 告警，真正失败发生在链接期（ld.lld: undefined symbol: strtoq），须改 strtoll (ref: knowledge/operations/build-systems.md)"
  - "musl printf 不支持 %q 长度修饰符：sprintf(id, \"!%qX\", v) 返回 -1 且输出被截断为 \"!\"，长整型须显式写 %llX + (long long) (ref: knowledge/operations/ohos-adaptation-patterns.md)"
  - "clang 15 默认把 int 返回值函数中的裸 return 判为 error（-Wreturn-type），2001 年前后的老代码常见，补 return 0 即可 (ref: knowledge/operations/harmonyos-specifics.md)"
  - "上游 Makefile 把 mSQL/PostgreSQL/MySQL 的 CFLAGS/LIBS 全部注释掉：默认构建零数据库依赖，适配时不要顺手打开 -DUSE_POSTGRESQL（否则凭空引入 libpq 依赖）(ref: knowledge/operations/dependencies.md)"

