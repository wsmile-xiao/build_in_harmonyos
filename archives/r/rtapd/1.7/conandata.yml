sources:
  "1.7":
    url: "https://downloads.sourceforge.net/rtnppd/rtapd-1.7.tar.gz"
    sha256: "cb10617032d7e3da23b3e7fe153aeb1751ac6a559fc43725b9ba5fe91296ddd7"

patches:
  "1.7":
    - patch_file: "patches/0001-rtapd.c.patch"
      patch_description: >-
        send_tnpp_packet() 在 int 返回值函数中裸 return，clang 15 默认把 -Wreturn-type 判为 error；
        同一文件里 strtoq 是 glibc/BSD 扩展（musl 无此符号，aarch64-linux-ohos 链接期 undefined symbol），
        且 "%qX" 不是 musl printf 支持的转换符（实测 sprintf 返回 -1、输出被截断为 "!"，导致 CAP 页面 ID 丢失）
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0002-vsnppd.c.patch"
      patch_description: >-
        vsnppd.c 的 send_tnpp_packet() 存在同一处"int 函数裸 return"，clang 15 直接报错
      patch_type: "portability"
      strip: 1
