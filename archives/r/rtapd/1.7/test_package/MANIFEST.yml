# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
package: rtapd/1.7
homepage: "https://sourceforge.net/projects/rtnppd/"

# 上游无任何自动化测试入口：
#   - Makefile 仅有 default/rtapd/vsnppd/clean/install.config/install 目标，无 check/test
#   - 源码包内无 tests/ 目录、无测试源码文件
#   - Alpine aports 的 rtapd APKBUILD 显式声明 options="!check"
# 因此上游测试 N=0、N′=0；功能验证由本目录的鸿蒙消费者用例提供。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: >-
      鸿蒙消费者用例: 先在候选目录中真实 bind 探测出允许 AF_UNIX 的沙箱目录（详见下方
      sandbox_note），再在自包含沙箱（socket/pidfile/lockdir/设备文件/路由表全部落在临时目录，
      不需要 /var/run 与串口硬件）内以前台方式启动打包的 rtapd，断言 usage 与退出码、
      AF_UNIX 数据报 socket 绑定、-p 配置转储覆盖项、SIGTERM 优雅退出
    command: "bash test.sh <check_rtapd> <package-bin-dir>"
  - file: check_rtapd.c
    description: >-
      消费者 C 客户端: 由 test_package build() 用 OHOS 工具链编译，扮演 rtnppd 按 rtapd 自身
      的 TNPP 线上格式（含 CRC-16/ARC）向 ExtSocketIn 投递 CAP 页面，验证端到端路由落盘；
      另提供 --pick-sockdir 模式，用真实 bind()（与 rtapd 同 socket 类型/addrlen）探测可用的
      沙箱目录
    command: "check_rtapd <socket> <to-hex> <from-hex> <pager-hex> <body>"
    extra_command: "check_rtapd --pick-sockdir"

# OHOS 沙箱限制（CI 实测，PR #15109 首轮 CI 失败根因）：
#   只有部分目录允许 AF_UNIX bind()。/tmp 只读；用户数据目录（$HOME，以及 CI Worker 的
#   TMPDIR=$HOME/.cache/tmp）可写但 bind() 返回 EPERM("Operation not permitted")，
#   于是裸 `mktemp -d` 会让 rtapd 以 "Error Operation not permitted (1) at bind unix socket"
#   退出。故 test.sh 逐一真实 bind 探测 $TMPDIR/$TMP/$TEMP、/data/storage/el2/base/temp、
#   /data/storage/el2/base/cache、/data/storage/el1/base、/dev/shm、/tmp，取第一个可用目录，
#   全部不可用时按平台限制显式 SKIP（同 archives/l/libmilter 的既有做法）。
sandbox_note: "AF_UNIX bind() 仅部分沙箱目录允许；test.sh 用真实 bind 探测后选目录"

# 测试断言总数（test.sh 内检查点计数；逐条清单见 reports/test-report.md 第二节）
assertion_count: 30
