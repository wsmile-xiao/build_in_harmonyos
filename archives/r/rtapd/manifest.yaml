software: rtapd
display: "rtapd"
description: "TAP/TNPP 寻呼守护进程：接收 rtnppd 通过 AF_UNIX 外部队列送来的 TNPP 寻呼包，重组 TAP 页面块并按路由表投递到调制解调器/文件/过滤程序/其他 TNPP 地址；同包附带 vsnppd"
category: utility
homepage: "https://sourceforge.net/projects/rtnppd/"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure；Makefile 不指定编译器，需命令行覆盖 CC（取自 conan tools.build:compiler_executables）"
    - "上游 Makefile 默认关闭全部 SQL 后端（mSQL/PostgreSQL/MySQL 行均为注释，LIBS 为空），故本包零外部依赖；不加 -DUSE_POSTGRESQL"
    - "clang 15 默认把 int 返回值函数中的裸 return 判为 error（-Wreturn-type），rtapd.c/vsnppd.c 的 send_tnpp_packet() 各一处，补丁补 return 0"
    - "musl 无 strtoq（glibc/BSD 扩展）：编译期仅告警隐式声明，链接期 aarch64-linux-ohos 报 undefined symbol strtoq，须改 strtoll"
    - "musl printf 不支持 %q 长度修饰符：实测 sprintf(\"!%qX\") 返回 -1 且输出截断为 \"!\"，CAP 页面 ID 完全丢失；须改为 %llX + (long long)"
    - "上游 make install 会 mkdir /var/spool/psheduler（需 root），配方改为 package() 直接复制 rtapd/vsnppd"
  common_dependencies: []

versions:
  - version: "1.7"
    status: built
    build_date: "2026-10-08"
