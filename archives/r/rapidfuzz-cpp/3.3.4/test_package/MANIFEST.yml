# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rapidfuzz-cpp/3.3.4
homepage: "https://github.com/rapidfuzz/rapidfuzz-cpp"

# 上游测试命令 (ctest 枚举)
upstream_check_command: "ctest --test-dir build -N"

# conanfile.py build() 中是否已集成上游测试 (header-only 库无编译, 上游测试在适配期于 HarmonyOS 主机验证)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (适配期于 HarmonyOS arm64 主机运行, 10/10 通过)
upstream_tests:
  - file: test/tests-common.cpp
    source: rapidfuzz-cpp-3.3.4/test/tests-common.cpp
    description: "remove affix 公共用例 (Catch2 TEST_CASE)"
    command: "./test_common"
  - file: test/tests-fuzz.cpp
    source: rapidfuzz-cpp-3.3.4/test/tests-fuzz.cpp
    description: "RatioTest 模糊比率用例"
    command: "./test_fuzz"
  - file: test/distance/tests-Levenshtein.cpp
    source: rapidfuzz-cpp-3.3.4/test/distance/tests-Levenshtein.cpp
    description: "Levenshtein 距离/编辑序列/band/SIMD 等 10 个 TEST_CASE"
    command: "./test_Levenshtein"
  - file: test/distance/tests-Hamming.cpp
    source: rapidfuzz-cpp-3.3.4/test/distance/tests-Hamming.cpp
    description: "Hamming 距离/编辑序列 (2 TEST_CASE)"
    command: "./test_Hamming"
  - file: test/distance/tests-Indel.cpp
    source: rapidfuzz-cpp-3.3.4/test/distance/tests-Indel.cpp
    description: "Indel 距离用例"
    command: "./test_Indel"
  - file: test/distance/tests-LCSseq.cpp
    source: rapidfuzz-cpp-3.3.4/test/distance/tests-LCSseq.cpp
    description: "LCSseq 距离 + SIMD wraparound (2 TEST_CASE)"
    command: "./test_LCSseq"
  - file: test/distance/tests-DamerauLevenshtein.cpp
    source: rapidfuzz-cpp-3.3.4/test/distance/tests-DamerauLevenshtein.cpp
    description: "DamerauLevenshtein 用例"
    command: "./test_DamerauLevenshtein"
  - file: test/distance/tests-OSA.cpp
    source: rapidfuzz-cpp-3.3.4/test/distance/tests-OSA.cpp
    description: "OSA 距离用例"
    command: "./test_OSA"
  - file: test/distance/tests-Jaro.cpp
    source: rapidfuzz-cpp-3.3.4/test/distance/tests-Jaro.cpp
    description: "Jaro 相似度用例"
    command: "./test_Jaro"
  - file: test/distance/tests-JaroWinkler.cpp
    source: rapidfuzz-cpp-3.3.4/test/distance/tests-JaroWinkler.cpp
    description: "JaroWinkler 相似度用例"
    command: "./test_JaroWinkler"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: fuzz::ratio/partial_ratio/token_set_ratio + distance 算法实际调用并断言"
    command: "./test_rapidfuzz_cpp"

# 测试断言总数 (上游 21 个独立 TEST_CASE + 消费者 5 项断言)
assertion_count: 21