# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.1"

# 软件名
software: "rampler"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://127.0.0.1:8899/r-2.1.1.tgz"

  # 源码校验和
  sha256: "9f6bd2a461e87a1f6eaa9bfd8a287da187718af5f892d05fd4cf6dd13c33fd45"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "M2 变体解法：CMakeLists 用 find_package(QUIET)+FetchContent 兜底引用 vendored 子模块时，若子模块对应包已发布，声明 conan requires + CMakeDeps 即使命中 find_package，空子模块不被触碰（区别于 E150 的手工拷入）"
  - "新 CONAN_HOME 必须有 extensions/plugins（含 profile.py）/migrations/profiles 骨架，仅 cp global.conf/remotes.json/settings.yml 会报 The profile.py plugin file doesn't exist"
  - "驱动会把 conandata URL 改写为 ghfast.top 镜像；镜像超时用 core.sources:download_cache 共享 dlcache（sha256 文件名 + references json 边车）种入源码"

# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
