# test_package/MANIFEST.yml
package: rampler/2.1.1
homepage: "https://github.com/rvaser/rampler"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游 tag 归档无测试目标（仅 src/ 3 个文件 + CMakeLists，无 tests/ 目录）
upstream_tests: []

test_package_tests:
  - file: "(packaged bin/rampler)"
    description: "Consumer test: `rampler --version` prints 2.1.1; `-o .` hits `missing arguments`; bare invocation prints usage"
    command: "bin/rampler -v ; bin/rampler"

assertion_count: 3
