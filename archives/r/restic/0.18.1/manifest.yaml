software: restic
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.18.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.18.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/restic/restic/archive/refs/tags/v0.18.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
build_system: custom

  # 配置选项列表
  configure_options:
    - "go build -tags release -ldflags=-s -w -o restic ./cmd/restic"
    - "CGO_ENABLED=0"
    - "GOPROXY=https://goproxy.cn,direct"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.24.4
    - goenv/3.1.1

  # 编译器
  cc: clang
  cxx: clang++
  go: "1.24.4"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go项目需要签名整个Go工具链才能在鸿蒙执行"
  - "goenv需设置local override以覆盖go.mod版本指令"
  - "CGO_ENABLED=0是Go项目静态编译的标准做法"
  - "Go项目build_system应标记为custom而非autotools"
  - "GOPROXY=https://goproxy.cn,direct 加速国内Go模块下载"
