# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rich/15.0.0
homepage: "https://github.com/Textualize/rich"

# 上游测试在 GitHub tests/ 目录（pytest 套件——68 个条目）；PyPI sdist 不含
# test/（纯包）。配方 build() 从 GitHub v15.0.0 tag 下载 tests/ 并运行 pytest
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest tests/ -q"

upstream_tests:
  - name: tests/（test_align/test_ansi/test_bar/test_box/test_cells 等 pytest 套件——GitHub 仓库核验）
    count: "981"
    description: "上游测试实测回填（rule 4）：build() 集成运行 pytest——956 passed / 0 failed / 25 skipped = 956/981（97.45%，skipped 计入分母）；25 个跳过均为上游标记：19 个 Windows 专属（test_windows_renderer/test_tree）+ 6 个 Python 版本差异（test_inspect/test_pretty py3.12 渲染、test_traceback 3.11+ 不适用）；sitecustomize 修 posix_spawn PATH 搜索后 0 failed"

test_package_tests:
  - file: test_rich.py
    description: "R34：import rich + Console/Table/Syntax 真实调用（pygments 高亮）"
    command: "python3 test_rich.py <package>"

assertion_count: 1
