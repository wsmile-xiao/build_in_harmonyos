# 软件级 manifest — rich
# 遵循 ARCHIVE-SPEC v3.0

software: rich
display: "rich"
description: "rich — 终端富文本/美化格式化（纯 Python）"
category: library
homepage: "https://github.com/Textualize/rich"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Python noarch 包——无 C/C++ 编译，直接拷贝源码 rich/ 模块到 site-packages"
    - "运行时依赖 pygments（必填，ohpcd 已发布）；markdown-it-py 仅 Markdown 渲染用（可选，未纳入最小依赖集）"
    - "PYTHONPATH 注入 site-packages——消费者 import rich 使用"
  common_dependencies:
    - pygments

versions:
  "15.0.0":
    status: built
    build_date: "2026-08-28"
    conan_ref: "rich/15.0.0"
