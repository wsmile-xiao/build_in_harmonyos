knowledge_gained:
  - "raul 2.0.0 为纯头文件 C++17 库（上游 Meson 无库目标，仅 install_headers + pkg.generate）：package_type=header-library + package_id clear，产物为 include/raul-2/raul/*.hpp + lib/pkgconfig/raul-2.pc [ref: notes.md#遇到的问题与解决方案]"
  - "OHOS 适配版 conan 的 MesonToolchain 将 os=OHOS 映射为 system=harmonyos（conan/tools/meson/helpers.py），无需手写 cross file（与 build-systems.md 的 linux+musl 口径不同，以适配版 conan 实测为准） [ref: notes.md#遇到的问题与解决方案]"
  - "OHOS 安全策略整体拒绝 AF_UNIX bind：/tmp 只读（EROFS=30），可写目录亦 EPERM=1（python 探针实证）；TCP 回环 bind 正常。上游 Linux 语义的 socket 测试应做平台能力探测 + meson exit 77 skip，而非仅改路径 [ref: knowledge/drafts/raul-2.0.0-af-unix-bind-blocked-meson-skip.kv]"
  - "meson 配方需 tool_requires meson/1.11.0（制品仓有 OHOS aarch64 二进制），并在 generate() 从 profile compiler_executables 推导 llvm-ar/llvm-ranlib 写入 machine file（CI worker PATH 无 llvm-ar，c-list 先例） [ref: archives/c/c-list/3.1.0/conanfile.py]"

