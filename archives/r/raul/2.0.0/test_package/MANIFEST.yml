# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: raul/2.0.0
homepage: "https://gitlab.com/drobilla/raul"

# 上游测试命令 (meson test --list 可列出全部 11 个用例)
upstream_check_command: "meson test -C build --list"

# conanfile.py build() 方法中已集成上游测试 (meson test，真机执行)
upstream_test_in_build: true
upstream_test_command: "meson test -C . --print-errorlogs"

# 上游实际运行的测试程序 (test/meson.build 注册，11 个；socket_test 平台 skip，见下)
upstream_tests:
  - file: test/headers/test_headers.cpp
    source: raul-2.0.0/test/headers/test_headers.cpp
    description: "头文件自包含编译检查（10 个头文件全量 include）"
    command: "./test_headers"
  - file: test/array_test.cpp
    source: raul-2.0.0/test/array_test.cpp
    description: "Array 构造/填充/扩容/拷贝单元测试"
    command: "./array_test"
  - file: test/build_test.cpp
    source: raul-2.0.0/test/build_test.cpp
    description: "全量类型实例化 + Process::launch/Socket 构造冒烟测试"
    command: "./build_test"
  - file: test/double_buffer_test.cpp
    source: raul-2.0.0/test/double_buffer_test.cpp
    description: "DoubleBuffer 原子读写单元测试"
    command: "./double_buffer_test"
  - file: test/maid_test.cpp
    source: raul-2.0.0/test/maid_test.cpp
    description: "Maid 延迟回收单元测试"
    command: "./maid_test"
  - file: test/path_test.cpp
    source: raul-2.0.0/test/path_test.cpp
    description: "Path/Symbol 解析与父子关系单元测试"
    command: "./path_test"
  - file: test/ringbuffer_test.cpp
    source: raul-2.0.0/test/ringbuffer_test.cpp
    description: "RingBuffer 读写/回绕单元测试"
    command: "./ringbuffer_test"
  - file: test/sem_test.cpp
    source: raul-2.0.0/test/sem_test.cpp
    description: "Semaphore post/wait/timed_wait 单元测试"
    command: "./sem_test"
  - file: test/socket_test.cpp
    source: raul-2.0.0/test/socket_test.cpp
    description: "UNIX/TCP Socket bind/listen/accept；OHOS 安全策略拒绝 AF_UNIX bind（/tmp 只读 EROFS=30，可写目录 EPERM=1，python 探针实证；TCP 回环正常），补丁 0001 按 meson 约定以 77 跳过"
    command: "./socket_test"
  - file: test/symbol_test.cpp
    source: raul-2.0.0/test/symbol_test.cpp
    description: "Symbol 校验/symbolify 单元测试"
    command: "./symbol_test"
  - file: test/thread_test.cpp
    source: raul-2.0.0/test/thread_test.cpp
    description: "线程创建/join 单元测试"
    command: "./thread_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_raul.cpp
    description: "消费者测试：真实调用 Symbol/Path/Array/RingBuffer/Semaphore/DoubleBuffer/Maid 公共 API（40 项断言）"
    command: "./test_raul"

# 测试断言总数: 上游 11 个测试程序（meson test 注册用例 11 个，其中 socket_test 平台 skip）+ test_package 40 项断言
assertion_count: 51
