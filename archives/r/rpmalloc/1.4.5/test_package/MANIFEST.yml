# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rpmalloc/1.4.5
homepage: "https://github.com/mjansson/rpmalloc"

# 上游测试命令 (configure.py 生成 Ninja 构建, ninja 编译后运行测试二进制)
upstream_check_command: "python3 configure.py --target linux --toolchain clang --config release --arch arm64 && ninja && ./bin/linux/release/arm64/rpmalloc-test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test/main.c, 由 configure.py 生成 rpmalloc-test 二进制)
upstream_tests:
  - file: test/main.c
    source: rpmalloc-1.4.5/test/main.c
    description: "上游完整测试套件: 分配/重分配/超大对齐/跨线程释放/多线程/线程风暴/一等堆/大页/命名页/错误处理, 全量通过 (All tests passed)"
    command: "./bin/linux/release/arm64/rpmalloc-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 rpmalloc/rpfree/rprealloc API 验证分配与内容完整性"
    command: "./test_rpmalloc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2000
