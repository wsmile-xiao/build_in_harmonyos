# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: rapidcsv/9.07
homepage: "https://github.com/d99kris/rapidcsv"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-tests"

upstream_tests:
  - name: tests/（自定义 unittest 框架——test001~test110 单元测试 + ptest001/ptest002 perf 测试，CMake RAPIDCSV_BUILD_TESTS=ON 构建 + ctest 运行）
    count: "112"
    description: "上游测试实测（rule 4，分母=全部 112 用例）：112 passed / 0 failed / 0 skipped（100%）——必须 Debug 构建（上游 add_unit_test 宏只在 Debug 注册，Release 只注册 2 个 perf）；test085/088、ptest 读 '../tests/*.csv' 相对路径失败（ios_base::clear 实测）——把源码 tests/*.csv 样本拷到相对位置后 112/112 通过"

test_package_tests:
  - file: test_rapidcsv.py
    description: "R34：头文件存在 + 编译运行使用 rapidcsv 的 smoke（Document 读 CSV）"
    command: "python3 test_rapidcsv.py <package>"

assertion_count: 2
