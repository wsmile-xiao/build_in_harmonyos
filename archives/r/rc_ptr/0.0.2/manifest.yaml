# 版本级 manifest — rc_ptr 0.0.2
# 文件位置: archives/r/rc_ptr/0.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
#
# 包定位：平台任务 id=14456（依赖项 / C++ 单线程引用计数指针）；上游
# github.com/Chylynsky/rc_ptr，包名与 conan-center-index recipes/rc_ptr 一致
# （config.yml 仅收录 0.0.2）；分支名门禁 feat/rc_ptr-0.0.2 == 包目录名-版本。
# 上游为 header-only 库（package_type=header-library），requires() = 0。

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.0.2"

# 软件名
software: "rc_ptr"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档，与 conan-center-index conandata 同条目）
  url: "https://github.com/Chylynsky/rc_ptr/archive/refs/tags/v0.0.2.tar.gz"

  # 源码校验和（与 conan-center-index recipes/rc_ptr/all/conandata.yml 的 "0.0.2"
  # 条目逐字一致；2026-09-29 设备实测下载复核通过，42131 字节）
  sha256: "4682e0235b6def843b52e9327c7f1f87c98998b58c1b39a27cbf13dae27f7977"

  # 压缩格式: tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

  # 上游 tag 与指向 commit（git ls-remote --tags 2026-09-29 实测：上游 2 个 tag 全量命中）
  tag: "v0.0.2"
  tag_commit: "82234b415df9aaf31668fddf6713ca0967d3c14f"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游根 CMakeLists 为 INTERFACE 目标；测试面走 CMake + CTest）
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  # RC_PTR_BUILD_TESTS=ON 打开上游测试面（test/*.cpp 的 Catch2 v2.13.7 套件）；
  # FetchContent 的 Catch2 源由 conandata 第二源预置到 _deps/catch2-src
  # （CI worker 对 GitHub git 协议不通，构建期零网络）
  configure_options:
    - "RC_PTR_BUILD_TESTS=ON"
    - "FETCHCONTENT_SOURCE_DIR_CATCH2=_deps/catch2-src"

  # 编译依赖列表（格式: name/version）
  # 软件本体 0 依赖（header-only，仅依赖 C++17 标准库）；Catch2 为测试面预置源，不进依赖链
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试统计（四口径并列，不混用；N 取 case 级候选数法最大值）
# ============================================================

test_summary:
  # 口径一：源码宏数（test/*.cpp 的 TEST_CASE 词面，grep -rEho 'TEST_CASE\s*\(' | wc -l = 112）
  upstream_source_macros_tag: 112

  # 口径二：框架注册数（Catch2 运行自报 test cases = 110；
  # 差额 2 = allocator.cpp 的 pmr 用例被上游 #if (__has_include(<memory_resource>)) 排除）
  upstream_framework_registered: 110

  # 口径三：断言宏数（源码词面 307 = 305 REQUIRE + 2 REQUIRE_THROWS_AS）
  upstream_assertion_macros: 307

  # 口径四：断言执行数（Catch2 运行自报 305；统计单位是 assertion 不是 case，不作 N。
  # 归因：307 - 6（pmr 两用例 6 条 REQUIRE 未编译）+ 4（owner_before 两处循环内
  # REQUIRE 各展开 3 次）= 305）
  upstream_assertions_executed: 305

  # 消费者断言数（test_package，不进上游分母，计入 PR「鸿蒙特有测试」行）
  consumer_assertions: 18

  # 申报 N = case 级候选最大值 max(112, 110) = 112；N' = 实际运行 110
  upstream_declared_n: 112
  upstream_n_prime: 110
  upstream_pass: 110
  upstream_fail: 0
  upstream_skip: 0
  upstream_not_run: 2
  # NOT_RUN=2 的技术原因与证据：allocator.cpp 两个 pmr 用例在上游源码内以
  # `#if (__has_include(<memory_resource>))` 条件编译，OHOS SDK libc++ 无该头
  # （探针：`__has_include` = 0；直接 include 报 `fatal error: 'memory_resource' file not found`）

  # 差额归因：源码宏 112 → 框架注册 110 = -2（条件编译排除，见上）；
  # 断言宏 307 / 执行 305 属另一统计单位，不参与 N 取值
  upstream_test_programs: 1            # rc_ptr-test（Catch2 v2.13.7 单可执行）
  upstream_test_files: 18              # test/*.cpp 18 个（17 个用例文件 + test_main.cpp）
  test_package_programs: 1

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "header-only C++17 库配方模式：package_type=header-library + package_id 清空 + 包内无 bin/lib 时 conan-verify G4/L2/L4/L5 走跳过分支须人工补测（reports/conan-verify-supplement.md）"
  - "上游测试框架走 FetchContent 时用 conandata 第二源预置 + FETCHCONTENT_SOURCE_DIR_* 指向本地，构建期零网络（CI worker GitHub git 协议不通）"
