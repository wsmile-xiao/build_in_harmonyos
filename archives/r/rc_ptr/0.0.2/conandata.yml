# 上游测试框架 Catch2 —— test/CMakeLists.txt 用 FetchContent 固定拉取 v2.13.7
# （GIT_REPOSITORY https://github.com/catchorg/Catch2.git GIT_TAG v2.13.7）。
# CI worker 的 git 协议不通 github.com（FetchContent git clone 必失败），故在 source()
# 阶段把 Catch2 官方 tag tarball 预置到 _deps/catch2-src，并由 generate() 用
# FETCHCONTENT_SOURCE_DIR_CATCH2 指向本地目录，构建期零网络、零协议依赖
# （observable_unique_ptr/0.7.3 预置 snitch 的同款先例）。
# 该键是测试面依赖，不进配方 requires/tool_requires —— 软件本体仍是 0 依赖。
catch2:
  url: "https://github.com/catchorg/Catch2/archive/refs/tags/v2.13.7.tar.gz"
  sha256: "3cdb4138a072e4c0290034fe22d9f0a80d3bcfb8d7a8a5c49ad75d3a5da24fae"

