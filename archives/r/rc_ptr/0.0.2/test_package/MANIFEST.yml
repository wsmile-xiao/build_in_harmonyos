# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rc_ptr/0.0.2
homepage: "https://github.com/Chylynsky/rc_ptr"

# 上游测试入口（上游 CI .github/workflows/test-master.yml：
#   cmake -B build -DRC_PTR_BUILD_TESTS=ON && cmake --build build
#   && (cd build && ctest -VV)）
# 上游测试框架为 Catch2 v2.13.7（test/CMakeLists.txt 用 FetchContent GIT_TAG v2.13.7
# 固定拉取），用例注册宏是 TEST_CASE，运行自报 `N assertions in M test cases`。
upstream_check_command: "cmake -S . -B build -DRC_PTR_BUILD_TESTS=ON -DFETCHCONTENT_SOURCE_DIR_CATCH2=_deps/catch2-src && cmake --build build --target rc_ptr-test && ./build/rc_ptr-test/rc_ptr-test"

# conanfile.py build() 方法中是否已集成上游测试
# rc_ptr 为 header-only 库，但上游测试面已在 build() 内真实执行：Catch2 v2.13.7 随
# conandata 第二源预置到 _deps/catch2-src（FetchContent git clone 在 CI worker 不通），
# 构建期零网络；配方对用例/断言计数做硬校验（110/305 或 112/311），其余计数一律失败。
upstream_test_in_build: true
upstream_test_command: "build() 内：cmake configure（RC_PTR_BUILD_TESTS=ON）→ cmake --build --target rc_ptr-test → 运行 rc_ptr-test/rc_ptr-test → 解析 Catch2 摘要硬校验"

# ============================================================
# N 口径（四口径并列、不混用；申报 N = case 级候选数法最大值）
# ============================================================
# 1) 源码宏数 @v0.0.2 = 112
#      grep -rEho 'TEST_CASE\s*\(' test/*.cpp | wc -l → 112（18 个 test/*.cpp，无 SECTION、无模板注册）
# 2) 框架注册数 @v0.0.2 = 110
#      Catch2 运行自报 `110 test cases`（./rc_ptr-test --list-tests → 110 test cases）
#      差额 2 = test/allocator.cpp 的 `rc_ptr, construct with pmr allocator` 与
#      `rc_ptr, construct array with pmr allocator` 被上游自己的
#      `#if (__has_include(<memory_resource>))` 条件编译排除（OHOS SDK libc++ 无该头：
#      探针 `__has_include` = 0；直接 include 报 `fatal error: 'memory_resource' file not found`）
# 3) 断言宏数 @v0.0.2 = 307（305 REQUIRE + 2 REQUIRE_THROWS_AS，源码词面）
# 4) 断言执行数 = 305（Catch2 运行自报）——次口径（统计单位是 assertion 不是 case），
#      按「四口径不得混用」单列，不作 N。
#      归因：307 - 6（pmr 两用例 6 条 REQUIRE 未编译）+ 4（owner_before 两处循环内
#      REQUIRE 各展开 3 次：1 宏 × 3 次 × 2 = 6 执行、2 宏 ⇒ +4）= 305
# 5) 消费者断言数（test_package）= 18 —— 不进上游分母，计入 PR「鸿蒙特有测试」行
#
# 差额归因：源码宏 112 → 框架注册 110 = -2（条件编译排除，见上）
# ============================================================

upstream_declared_n: 112
upstream_n_prime: 110
upstream_pass: 110
upstream_fail: 0
upstream_skip: 0
upstream_not_run: 2

# 上游实际运行的测试面
upstream_tests:
  - file: test/rc_ptr-test
    source: rc_ptr-0.0.2/test/*.cpp（18 个 .cpp：17 个用例文件 + test_main.cpp）
    description: "Catch2 v2.13.7 单可执行：注册 110 个用例 / 执行 305 条断言全部通过（源码宏 112，其中 2 个 pmr 用例因 <memory_resource> 缺失被上游 #if 排除 => NOT_RUN=2）"
    command: "./build/rc_ptr-test/rc_ptr-test"

test_package_tests:
  - file: test_rc_ptr.cpp
    description: "消费者面：交付头内容断言 2 条 + memory:: 公共 API 运行期断言 16 条 = 18 条，逐条打印 [consumer] PASS，末行 [consumer] TOTAL=18 FAIL=0；另含 3 条 static_assert 编译期约束"
    command: "./test_rc_ptr"

# 测试断言总数（运行期断言数 18；3 条 static_assert 属编译期约束，不计入）
assertion_count: 18
