package: rumur/2026.03.11
homepage: "https://github.com/Smattr/rumur"

upstream_check_command: "python3 -m pytest tests/tests.py"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests/tests.py -v"

upstream_tests:
  - name: pytest integration suite (tests/tests.py, 350 .m models x 4 dimensions)
    command: "python3 -m pytest tests/tests.py -v"
    expected: "pass on OHOS with built binaries in PATH (see notes.md for the bare-name spawn shim)"

test_package_tests:
  - file: test_rumur.sh
    description: "The packaged artifact is present and executable"
    command: "test -x $PKG/bin/rumur"
  - file: test_rumur.sh
    description: "rumur --version executes and links"
    command: "rumur --version"
  - file: test_rumur.sh
    description: "OHOS consumer case: rumur compiles the model fixture and discards the verifier"
    command: "rumur --output=/dev/null model.m"
  - file: test_rumur.sh
    description: "OHOS-specific: rumur regenerates the verifier onto /dev/stdout (the invocation used by the upstream rumur-run wrapper; /dev/stdout cannot be re-opened on OHOS, exercised via the recipe patch); asserts a zero exit status and a non-empty verifier without writing to disk"
    command: "rumur --output=/dev/stdout model.m"

fixtures:
  - file: model.m
    description: "Minimal Murphi model (one boolean state variable, one toggling rule) consumed by the smoke test"

assertion_count: 4
