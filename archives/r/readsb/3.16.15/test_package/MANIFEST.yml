# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: readsb/3.16.15
homepage: "https://github.com/wiedehopf/readsb"

# 上游测试命令（readsb 无独立 test/ 目录；仅 checkapi.sh 为 API 连通性测试，
# 需联网访问外部 API，受限环境不可运行）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（实测 2026-08-15，OHOS 环境）：
# - 上游 sdist 无独立测试目录：仅 checkapi.sh（API 连通性，需联网+真实
#   接口，CI 受限网络不可运行，按规则豁免）
# - 解码功能以 test_package 离线 Mode-S 流冒烟替代验证
upstream_tests:
  - file: checkapi.sh
    source: readsb-3.16.15/checkapi.sh
    description: "API 连通性测试（curl 访问外部接口，需联网；受限环境无法运行，豁免）"
    command: "bash checkapi.sh"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_readsb.py
    description: "消费者测试：readsb --version 断言 + 离线 Mode-S 流解码冒烟（--no-interactive --raw，无需 SDR 设备）"
    command: "python3 test_readsb.py <readsb-bin>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
