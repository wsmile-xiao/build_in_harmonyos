# test_package/MANIFEST.yml — rtl-wmbus 1.1.0
# 上游测试来源声明。CI build_and_test.sh L0e 强制要求本文件存在。

package: rtl-wmbus/1.1.0
homepage: "https://github.com/wmbusmeters/rtl-wmbus"

# 上游没有 `make check` 目标：1.1.0 的 Makefile 只有 all/release/debug/pi1/
# rebuild/install/clean。上游的"测试"是 README 中记录的真实录波回放流程 ——
# 把 samples/*.cu8 原始 IQ 灌进解码器并核对输出的报文。
upstream_check_command: "cat samples/<capture>.cu8 | rtl_wmbus [options]"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清点（README "Usage"/samples 说明 + samples/ 目录实有 4 个录波）：
#   1. rtlsdr_868.950M_1M6_samples2.cu8  → 4 行（2 条 CRC_OK + 2 条 T1;0;0 误码帧）
#   2. rtlsdr_868.625M_2M4_issue48.cu8   → 2 行（`-d 3 -s -o`，README 原文用例）
#   3. rtlsdr_868.950M_1M6_issue47.cu8   → 多行（`-o`，含 T1 与 C1 两种模式）
#   4. rtlsdr_868.950M_1M6_issue49.cu8   → 多行（`-o`）
# 4 个用例全部在 OHOS aarch64 交叉编译产物上实测执行并通过（见 notes.md 实测记录）。
# 受 CI 制品体积约束，仅用例 2（README 原文用例，且体积最小）以 base64(gzip) 形式
# 随包提交作为自动化 fixture；其余 3 个用例的实测输出记录在 notes.md。
upstream_tests:
  - file: samples/rtlsdr_868.625M_2M4_issue48.cu8
    source: rtl-wmbus-1.1.0/samples/rtlsdr_868.625M_2M4_issue48.cu8
    description: "868.625 MHz 实录 IQ；README 原文用例 `rtl_wmbus -d 3 -s -o`，解码出 2 条 CRC_OK 的 T1 报文（表地址 60168569）"
    command: "cat data/issue48.cu8 | rtl_wmbus -d 3 -s -o"
    embedded_as_fixture: "data/issue48.cu8.gz.b64"
  - file: samples/rtlsdr_868.950M_1M6_issue47.cu8
    source: rtl-wmbus-1.1.0/samples/rtlsdr_868.950M_1M6_issue47.cu8
    description: "868.950 MHz 实录 IQ；`rtl_wmbus -o`，含 T1 与 C1 两种模式的报文"
    command: "cat samples/rtlsdr_868.950M_1M6_issue47.cu8 | rtl_wmbus -o"
    embedded_as_fixture: false
  - file: samples/rtlsdr_868.950M_1M6_issue49.cu8
    source: rtl-wmbus-1.1.0/samples/rtlsdr_868.950M_1M6_issue49.cu8
    description: "868.950 MHz 实录 IQ；`rtl_wmbus -o`，T1 模式报文"
    command: "cat samples/rtlsdr_868.950M_1M6_issue49.cu8 | rtl_wmbus -o"
    embedded_as_fixture: false
  - file: samples/rtlsdr_868.950M_1M6_samples2.cu8
    source: rtl-wmbus-1.1.0/samples/rtlsdr_868.950M_1M6_samples2.cu8
    description: "868.950 MHz 实录 IQ；README 示意两台 T1 设备的样例，同时覆盖 CRC 失败帧（T1;0;0）"
    command: "cat samples/rtlsdr_868.950M_1M6_samples2.cu8 | rtl_wmbus"
    embedded_as_fixture: false

# test_package 自带测试（消费者视角，直接驱动被测可执行文件）
test_package_tests:
  - file: test_decode.c
    description: "功能测试：fork/exec 打包后的 rtl_wmbus，灌入真实 IQ 录波，逐字段断言解码报文（模式/CRC/表地址/载荷/RSSI），并验证 -V 版本横幅、非法参数退出码、-p 模式过滤、空输入容错"
    command: "./test_decode"
  - file: ohos_special_test.c
    description: "HarmonyOS 专项测试：解析 ELF 头断言 EM_AARCH64 / ET_DYN / PT_GNU_STACK 不可执行(NX)，并由 settings 下发的 TARGET_IS_OHOS_AARCH64 门控 musl 判定（DT_NEEDED 精确 soname 比对，无 libc.so.6 等 glibc soname）；实测 alarm+SIGALRM 流控(-f)、getopt 非法参数(-p X)、-s 组合模式"
    command: "./ohos_special_test"

# 断言总数（以 test 输出末尾 "N checks, 0 failure(s)" 为准）
assertion_count: 32
