# archives/r/rtl-wmbus/1.1.0/conandata.yml
# Single source of truth for the source URL + SHA256.
# conanfile.py reads `self.conan_data["sources"]` (via get()) and
# `self.conan_data["commit"]` (version banner for build/version.h).
#
# Upstream publishes no release tarball — only the git tag `1.1.0`. The URL below
# is the official GitHub tag archive of the upstream repository wmbusmeters/rtl-wmbus.
# R39 requires an official source; CI adds a github.com mirror fallback by itself.
#
# Keep `url:` as a SINGLE quoted value. Do not hand-write a mirror fallback here:
#   * R39 / preflight PF7 mechanically block mirror prefixes (gh-proxy.com is on the
#     14-domain blacklist: "手写即 R39 违规"); CI injects the fallback itself.
#   * ci/conan/build_and_test.sh rewrites `url:` to a mirror list with the regex
#     `^([ \t]*)url:[ \t]*(["'])(https?://...)\2[ \t]*$`, which matches ONLY the
#     single-value form. Committing an already-expanded list silently disables
#     CI's mirror injection, so the recipe can never pick up a fixed/newer mapping.
#
# NOTE: do not put any bare http(s) URL in these comments — the CI pre-download
# step regex-extracts every URL from this file (comments included) and rewrites
# each one to a local file:// path.

# Tag `1.1.0` -> commit 34684e655df70867ac86e799561ec6512c45be0a
commit: "34684e655df70867ac86e799561ec6512c45be0a"

sources:
  url: "https://github.com/wmbusmeters/rtl-wmbus/archive/refs/tags/1.1.0.tar.gz"
  sha256: "0da72c7f5b026a4c0d8dc9beabba021f147c950f52eb8e09f4e41884d4f32ebf"

# No `patches:` key on purpose: upstream 1.1.0 cross-compiles for
# aarch64-linux-ohos unmodified (zero source changes, zero platform macros —
# see notes.md), so there is nothing for export_conandata_patches() to carry.
