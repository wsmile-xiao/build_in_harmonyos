package: rtl-wmbus
version: "1.1.0"
homepage: "https://github.com/wmbusmeters/rtl-wmbus"
license: BSD-2-Clause
status: built
build_system: makefile
build_date: "2026-10-01"
category: radio

source:
  url: "https://github.com/wmbusmeters/rtl-wmbus/archive/refs/tags/1.1.0.tar.gz"
  sha256: "0da72c7f5b026a4c0d8dc9beabba021f147c950f52eb8e09f4e41884d4f32ebf"
  tar_format: tar.gz
  tag: "1.1.0"
  commit: "34684e655df70867ac86e799561ec6512c45be0a"

build:
  system: makefile
  configure_options: []
  # 纯 stdin/stdout 命令行过滤器；RTL-SDR 是运行时对等进程（shell 管道），
  # 不是链接期依赖 —— Makefile 只链接 -lm，故无 requires。
  dependencies: []
  cc: clang
  target_triplet: aarch64-linux-ohos

# 上游 1.1.0 交叉编译到 aarch64-linux-ohos 零改动、零平台宏。
patches_applied: []

# Makefile 的版本横幅来自 git（git describe / rev-parse --abbrev-ref）。
# Conan 源码目录无 .git，经 GnuToolchain.extra_env 注入 BRANCH/TAG/COMMIT_HASH/CHANGES
# （环境变量优先级低于 makefile 赋值，Makefile 自身的 BRANCH:= 重写仍生效，
#  横幅与 tag 版 master 检出完全一致 = "1.1.0"）。
version_banner:
  source: make_env_injection
  method: "GnuToolchain.extra_env.define(BRANANCH=master, TAG=1.1.0, COMMIT_HASH, CHANGES='')"

upstream_tests:
  check_command: "cat samples/<capture>.cu8 | rtl_wmbus [options]"
  note: "上游无 make check 目标；'测试' 为 README 记录的录波回放流程"
  total: 4
  executed_on_ohos: 4
  passed: 4
  embedded_as_ci_fixture: 1
  cases:
    - file: samples/rtlsdr_868.625M_2M4_issue48.cu8
      args: "-d 3 -s -o"
      lines: 2
      modes: "T1"
    - file: samples/rtlsdr_868.950M_1M6_issue47.cu8
      args: "-o"
      lines: 8
      modes: "T1+C1"
    - file: samples/rtlsdr_868.950M_1M6_issue49.cu8
      args: "-o"
      lines: 4
      modes: "T1"
    - file: samples/rtlsdr_868.950M_1M6_samples2.cu8
      args: "(default)"
      lines: 4
      modes: "T1 (含 CRC 失败帧 0;0)"

test_package:
  assertion_count: 32
  ohos_specific_assertion_count: 13
  description: "test_decode 用真实 868.625 MHz IQ 录波 fork/exec 打包后的 rtl_wmbus 并逐字段断言解码报文；ohos_special_test 解析 ELF 断言 EM_AARCH64 / ET_DYN / PT_GNU_STACK 不可执行(NX)，并由 settings 下发的 TARGET_IS_OHOS_AARCH64 门控 musl 判定（DT_NEEDED 精确 soname 比对，无 libc.so.6/libgcc_s.so.1 等 glibc soname）；并实测 alarm+SIGALRM 流控等 POSIX 路径"
  fixture: "test_package/data/issue48.cu8.gz.b64 (base64(gzip(180224B 前缀))，构建期由 CMake find_package(Python3) 定位解释器解码还原，fallback python3)"
  cross_check: "OHOS aarch64 与原生 x86 gcc 产物解码输出逐字段一致，DSP 数值行为未因交叉编译改变"

artifact:
  bin/rtl_wmbus: "ELF 64-bit LSB PIE, ARM aarch64, interpreter /lib/ld-linux-aarch64.so.1, NEEDED libc.so"

knowledge_gained:
  - "Conan 2.29 的 GnuToolchain 用 tc.extra_env.define()，旧的 tc.vars 已移除"
  - "本仓 OHOS 适配版 conan 的 self.run(env=) 语义是环境文件名列表，不是环境变量表"
  - "GNU make 命令行赋值会击穿 Makefile 的 ?=/:= 组合：想让 Makefile 内部重写逻辑生效必须用环境变量注入"
  - "RTL-SDR 类工具（如 rtl-wmbus）把 rtl_sdr 当运行时管道对等进程，不是链接依赖，requirements 可为空"
  - "自制 harness 捕获子进程 stdout 后必须显式 NUL 结尾，否则会串入上一次调用的输出尾巴"
