# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: random123/1.14.0
homepage: "https://github.com/DEShawResearch/random123"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cd tests && make runcore"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（独立上游用例 13 项，均已在本地 OHOS 工具链构建并运行，
# 详见 notes.md 完整枚举台账与 .ohc-logs/upstream_tests_run.log）
upstream_tests:
  - file: kat_c.c
    source: random123-1.14.0/tests/kat_c.c
    description: "KAT 已知答案测试 (C)，60 项通过"
    command: "./kat_c"
  - file: kat_cpp.cpp
    source: random123-1.14.0/tests/kat_cpp.cpp
    description: "KAT 已知答案测试 (C++)"
    command: "./kat_cpp"
  - file: ut_ars.c
    source: random123-1.14.0/tests/ut_ars.c
    description: "ARS 生成器单元测试"
    command: "./ut_ars"
  - file: ut_gsl.c
    source: random123-1.14.0/tests/ut_gsl.c
    description: "GSL 适配单元测试（依赖 GSL/2.8 制品）"
    command: "./ut_gsl"
  - file: ut_carray.cpp
    source: random123-1.14.0/tests/ut_carray.cpp
    description: "数组类型单元测试"
    command: "./ut_carray"
  - file: ut_Engine.cpp
    source: random123-1.14.0/tests/ut_Engine.cpp
    description: "引擎封装单元测试"
    command: "./ut_Engine"
  - file: ut_features.cpp
    source: random123-1.14.0/tests/ut_features.cpp
    description: "特性宏单元测试"
    command: "./ut_features"
  - file: ut_M128.cpp
    source: random123-1.14.0/tests/ut_M128.cpp
    description: "SSE 128 位测试（OHOS arm64 无 SSE，编译为文档化 no-op stub）"
    command: "./ut_M128"
  - file: ut_ReinterpretCtr.cpp
    source: random123-1.14.0/tests/ut_ReinterpretCtr.cpp
    description: "计数器重解释单元测试"
    command: "./ut_ReinterpretCtr"
  - file: ut_aes.cpp
    source: random123-1.14.0/tests/ut_aes.cpp
    description: "AES-NI 测试（OHOS arm64 无 SSE，编译为文档化 no-op stub）"
    command: "./ut_aes"
  - file: ut_ua.cpp
    source: random123-1.14.0/tests/ut_ua.cpp
    description: "uniform.hpp 单元测试"
    command: "./ut_ua"
  - file: ut_uniform.cpp
    source: random123-1.14.0/tests/ut_uniform.cpp
    description: "均匀分布转换单元测试"
    command: "./ut_uniform"
  - file: ut_uniform_IEEEkat.cpp
    source: random123-1.14.0/tests/ut_uniform_IEEEkat.cpp
    description: "IEEE KAT（上游文档记载在 ARM FMA 平台失败不必然有问题；本地实测记录）"
    command: "./ut_uniform_IEEEkat"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：philox4x32 C API 确定性校验和"
    command: "./test_random123"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 73
