software: restinio
version: "0.6.19"
status: built
build_date: "2026-08-18"
conan_ref: "restinio/0.6.19"
build_system: header-only-cmake

source:
  url: "https://github.com/Stiffstream/restinio/archive/refs/tags/v.0.6.19.tar.gz"
  sha256: "5a739cac8f3148e7e94f05bb08f5cf569dd31f6f3ea2b893eddfffb0a155eb52"
  tar_format: tar.gz

build:
  dependencies:
    - "fmt/8.1.1 (ohpcd, Conan requires)"
    - "http-parser/2.9.4 (ohpcd, Conan requires)"
  bundled:
    - "asio 1.28.1 snapshot (Boost-1.0), bundled headers only"
  output:
    - "129 restinio public headers under include/restinio/"
    - "bundled standalone-asio snapshot under include/asio/"
    - "cpp_info.defines: ASIO_STANDALONE, ASIO_HAS_STD_CHRONO, ASIO_DISABLE_STD_STRING_VIEW"

tests:
  upstream:
    total: 0
    result: >-
      upstream single-test suite (catch_main) not compiled for this
      header-only Conan recipe; see E327 draft for the upstream test
      probe record and the sendfile platform boundary
  adapted:
    test_package_cases: 1
    test_package_assertions: 3
