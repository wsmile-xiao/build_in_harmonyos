# conandata.yml — rlog 1.4
# 源码：上游原站 arg0.net 已失效（现为 Google Sites 个人站，rlog 页面 404）；
# MacPorts distfiles 保存的原始 tarball 与 Debian pool 的 rlog_1.4.orig.tar.gz
# 字节一致（sha256 a938eeed…，640641 bytes），取前者作为权威镜像源。
sources:
  url: "https://distfiles.macports.org/rlog/rlog-1.4.tar.gz"
  sha256: "a938eeedeb4d56f1343dc5561bc09ae70b24e8f70d07a6f8d4b6eed32e783f79"

patches:
  - patch_file: "patches/0001-config-config.guess.patch"
    patch_description: "Teach the bundled 2007 config.guess to report aarch64-unknown-linux-gnu on HarmonyOS so a bare ./configure can determine the build type (the pristine script fails with 'unable to guess system type')"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "Create the config.status temporary directory with umask 022 (HMDFS rejects writes inside the 0700 dir made by mktemp -d) and add clang++ to the C++ compiler candidate list (2006-era autoconf does not know clang)"
    patch_type: "portability"
  - patch_file: "patches/0003-docs-Makefile.in.patch"
    patch_description: "Use $(top_srcdir)/$(srcdir) in docs install-data-local: the hardcoded ../mkinstalldirs and html/* paths do not exist in a VPATH build directory"
    patch_type: "portability"
