# 版本级 manifest — rlog 1.4
# 文件位置: archives/r/rlog/1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4"

# 软件名
software: "rlog"

# 许可证（经核实：COPYING 为 LGPL v2.1；源码头声明 "either version 2.1
# of the License, or (at your option) any later version" → -or-later）
license: LGPL-2.1-or-later

# 主页
homepage: "https://rlog.sourceforge.net/"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游原站 arg0.net 已失效，MacPorts distfiles 保存的
  # 原始 tarball 与 Debian .orig.tar.gz 字节一致）
  url: "https://distfiles.macports.org/rlog/rlog-1.4.tar.gz"

  # 源码校验和
  sha256: "a938eeedeb4d56f1343dc5561bc09ae70b24e8f70d07a6f8d4b6eed32e783f79"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项（除 conan 自动的 --prefix 等之外，配方显式追加的部分）。
  # 内联单行：G0 干净构建验证按同一行读取这些选项（列表形式读取不到，
  # configure 会退到 2008 版 config.guess 而在 HarmonyOS 上失败）。
  configure_options: "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu --enable-shared --disable-static"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-configure.patch"
  - "0003-docs-Makefile.in.patch"

# ============================================================
# 测试申报
# ============================================================

upstream_tests:
  command: "make check"
  test_count: 0
  notes: "上游 rlog/Makefile.am 只有 noinst_PROGRAMS = test testlog，没有 TESTS 变量，make check 为空（Nothing to be done）。两个 noinst 程序才是上游真实调用 API 的程序，由 conanfile.py build() 显式运行：test（订阅-发布/rDebug-rWarning-rError/rAssert→Error/计时，exit 0）、testlog（日志调用开销基准，exit 0）。"

test_package:
  assertion_count: 11
  description: "消费者程序调用 librlog 公开 API：RLogVersion/CURRENT_RLOG_VERSION、GetGlobalChannel 命名与实例稳定、RLogNode 订阅-发布、通道层级投递与无关通道过滤、消息格式化、rAssert→rlog::Error 的 file() 位置、rlog_get_time/rlog_time_diff/rlog_time_unit；全部断言通过（checks=11 failures=0）。"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "2007 版 config.guess 早于 HarmonyOS：设备实测直接运行 exit 1（unable to guess system type），需对 HarmonyOS:aarch64 直接给出三元组（裸 ./configure 才有 build type）；自带 config.sub 实测已接受 aarch64-unknown-linux-gnu，无需补丁"
  - "2006 版 autoconf 的 C++ 编译器候选表不含 clang：设备没有 g++/c++ 时 configure 退化为 g++ 并报 C++ compiler cannot create executables，需把 clang++ 加入 configure 的候选表（或用 conan 的 AutotoolsToolchain 显式给 CXX）"
  - "HMDFS 上 config.status 的 (umask 077 && mktemp -d) 临时目录不可写，Makefile/config.h 生成全部失败；改为 (umask 022 && mkdir)"
  - "HMDFS 不允许 mkfifo：并行 make 的 jobserver fifo 创建报 Operation not permitted，autotools 配方用 -j1 规避"
  - "上游 Makefile.am 硬编码相对路径（../mkinstalldirs、html/*）在 Conan 的 VPATH 构建目录中失效，需改为 $(top_srcdir)/$(srcdir)"
  - "libtool wrapper 的 relink 命令在 VPATH 构建下形如 (cd ; ... test.o ./.libs/librlog.so)（cd 无参数），HMDFS 上 getcwd 失效时相对路径解析失败，运行 .libs 真实二进制并显式给 LD_LIBRARY_PATH 更稳"
