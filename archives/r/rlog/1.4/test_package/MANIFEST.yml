# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试入口清点（rlog-1.4 tarball，2026-09-18 实地核对）：
#   rlog/Makefile.am 只有 noinst_PROGRAMS = test testlog；无 TESTS 变量、
#   无 tests/ 目录，因此 `make check` 不注册任何测试（0/0，见 notes.md）。
#   两个 noinst 程序随 `make all` 编译，是上游唯一真实调用 API 的程序。

package: rlog/1.4
homepage: "https://rlog.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./rlog/test && ./rlog/testlog"

# 上游实际运行的测试程序（未注册进 make check，作为独立功能证据运行）
upstream_tests:
  - file: rlog/test.cpp
    source: rlog-1.4/rlog/test.cpp
    description: "上游 noinst 程序 test：订阅/发布链路、rDebug/rWarning/rError、rAssert 抛错、计时 API"
    command: "./rlog/test"
  - file: rlog/testlog.cpp
    source: rlog-1.4/rlog/testlog.cpp
    description: "上游 noinst 程序 testlog：日志调用开销基准，覆盖同一 API 路径"
    command: "./rlog/testlog"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "调用 librlog 公开 API：版本符号、通道注册/命名、订阅-发布、通道层级与过滤、rAssert→rlog::Error 位置、计时 API"
    command: "./test_rlog"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11
