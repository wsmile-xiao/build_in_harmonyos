software: rlog
display: "RLog"
description: "Flexible message logging library for C++ (channels, nodes, log levels, rAssert)"
category: library
homepage: "https://rlog.sourceforge.net/"
license: "LGPL-2.1-or-later"
language: cpp
build_system: autotools

ohos_adaptation:
  status: built
  build_date: "2026-09-18"
  notes: |
    - 上游 tarball 自带 2008 年生成的 configure/Makefile.in，无需 autoreconf
      （CI 无 autotools 自举链，保持自带 configure 是关键）
    - 2007 版 config.guess 不认识 HarmonyOS，且 2006 版 autoconf 的 C++ 候选表不含
      clang：补丁 0001 让 config.guess 在 HarmonyOS 上给出 aarch64-unknown-linux-gnu，
      补丁 0002 把 clang++ 加入 configure 的候选表（裸 ./configure 因此可用）；
      自带 config.sub 实测接受该三元组，未打补丁
    - HMDFS 平台限制两处：config.status 的 0700 临时目录不可写（补丁 0002 改
      umask 022 + mkdir）；并行 make 的 jobserver fifo 不能 mkfifo（配方 -j1）
    - VPATH 构建下 docs 安装的相对路径失效（补丁 0003 改用 $(top_srcdir)/$(srcdir)）
    - librlog 不是 OHOS 系统同名库（系统与 sysroot 均无），默认动态（shared=True）
    - 上游只以 noinst_PROGRAMS 提供 test/testlog，无 TESTS 注册；build() 实跑两者
      （直接执行 .libs 真实二进制，绕开 libtool wrapper 的 relink 相对路径问题）

versions:
  "1.4":
    status: built
    build_date: "2026-09-18"
    conan_ref: "rlog/1.4"
    notes: |
      - 源码取自 MacPorts distfiles（上游 arg0.net 与 sourceforge 项目页均已失效），
        与 Debian pool 的 rlog_1.4.orig.tar.gz 字节一致（sha256 a938eeed…）
      - 产物：librlog.so.5.0.0 + 16 个头文件 + librlog.pc + 上游 html 文档
      - 3 个可移植性补丁（config.guess / configure / docs Makefile.in）
      - 消费者测试 test_package/test.cpp 11 项断言全过；上游 test/testlog 实跑 exit 0
