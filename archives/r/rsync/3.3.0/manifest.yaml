software: rsync
version: 3.3.0
status: partial
build_system: autotools
category: network
description: rsync - A fast, versatile, remote (and local) file-copying tool

harmonyos:
  triplet: aarch64-unknown-linux-ohos
  libc: musl
  compiler: clang 15.0.4

build:
  source: https://download.samba.org/pub/rsync/src/rsync-3.3.0.tar.gz
  system: autoconf
  dependencies:
    - clang
    - make
  
  configure_flags:
    - --prefix=${HOME}/usr/local
    - --disable-xxhash
    - --disable-zstd
    - --disable-lz4
  
  patches:
    - 0001-config-guess-harmonyos.patch
    - 0002-config-sub-harmonyos.patch

features:
  ipv6: yes
  acl: no
  xattr: yes (Linux xattrs)
  openssl_crypto: yes
  xxhash: no (disabled)
  zstd: no (disabled)
  lz4: no (disabled)

test:
  official_suite:
    total: 44
    passed: 0
    failed: 44
  issues:
    - "whoami: 无法解析用户 ID 20020081（已通过修改 runtests.sh 绕过）"
    - "软链接创建: SELinux 限制导致测试无法创建 testlink"
  root_cause: "鸿蒙 SELinux 策略限制用户进程创建软链接，导致测试框架无法正常运行"
  manual_tests:
    - "基本同步 (-av): ✅ 通过"
    - "增量传输: ✅ 通过"
    - "--delete 选项: ✅ 通过"
  conclusion: "核心功能正常，测试套件失败是 SELinux 软链接限制问题"

install:
  binaries:
    - $HOME/usr/local/bin/rsync
    - $HOME/usr/local/bin/rsync-ssl

build_date: 2026-03-23