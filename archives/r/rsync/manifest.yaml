software: rsync
display: "rsync"
description: "Fast incremental file transfer and synchronization tool"
category: network
homepage: "https://rsync.samba.org/"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 config.guess/config.sub 补丁添加 HarmonyOS 检测"
    - "官方测试套件因 SELinux 软链接限制全部失败，但核心功能正常"
    - "whoami 无法解析鸿蒙数字格式用户 ID"
    - "禁用 xxhash/zstd/lz4（缺少依赖）"
  common_dependencies:
    - openssl

versions:
  "3.3.0":
    status: built
    build_date: "2026-03-23"
