# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 要求存在）
# 口径: docs/TEST_QUALITY_SPEC.md / R51 上游测试三步法

package: ries/2018.08.05
homepage: "https://mrob.com/pub/ries/"

# 上游测试命令：不存在。判据（B 机 aarch64 / GNU Make 4.4.1 实测，见
# reports/knowledge-candidate-ledger.md 与 notes.md 的 R51 清点节）：
#   $ make -f GNUmakefile -n check   -> make: *** No rule to make target 'check'.  Stop.   (rc=2)
#   $ make -f GNUmakefile -n test    -> make: *** No rule to make target 'test'.   Stop.   (rc=2)
# GNUmakefile 定义的全部目标：ries（默认）、install、clean（.PHONY: install clean）。
# 上游源码包内亦无 tests/ 目录、无 ck_assert/assert()/单元测试框架（ries.c 计数 0）。
upstream_check_command: "none (GNUmakefile 无 check/test 目标)"

# conanfile.py build() 是否集成上游测试：没有可集成的上游测试。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无。
upstream_tests: []

# test_package 自带的消费者用例（9 条，全部真实调用安装后的 ries 二进制）
test_package_tests:
  - file: test.sh
    description: "9 条黑盒用例：--version / -n3 精确 3 条匹配 / -r 精确有理解 / -i 整数解 / -a 代数解 / -S 符号表 / 缺参数报 usage(rc=1) / 未知选项报错(rc=255) / 重复运行除上游自报的 Time 秒表字段外逐字节一致"
    command: "bash test.sh"

# 上游测试断言总数（上游为 0；本包新增消费者断言 9 条，实测 9 通过 0 失败 0 跳过）
assertion_count: 0
adapted_assertion_count: 9
