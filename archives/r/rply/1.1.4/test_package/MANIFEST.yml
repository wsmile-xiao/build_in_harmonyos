# test_package/MANIFEST.yml
# rply 1.1.4 - upstream test declaration.

package: rply/1.1.4
homepage: "https://w3.impa.br/~diego/software/rply/"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream 1.1.4 has no build system and no test suite: the tarball contains
  rply.c, rply.h, rplyfile.h, LICENSE, an etc/ directory with three example
  programs (convert.c, dump.c, sconvert.c) and the HTML manual. There is no
  make check, no ctest and no tests/ directory.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_rply.c
    description: "C consumer: write an ASCII PLY via the public API, then read it back and verify element/property metadata and vertex values"
    command: "clang test_rply.c -lrply && ./test_rply"

test_files:
  - path: "test_package/test_rply.c"
    test_type: "R34"
    assertion_count: 18

test_package_test_count: 1
consumer_assertion_count: 18
upstream_test_cases: 0
assertion_count: 18
