# rocm-cmake 上游测试声明
name: rocm-cmake
version: 0.12.0
upstream_url: https://github.com/ROCm/rocm-cmake

test_manifest:
  - type: test
    build_system: CMake
    source:
      - "CMakeLists.txt"
      - "test_package.cpp"
    description: |
      编译并运行 test_package，验证 find_package(ROCM) 能否正确找到
      ROCMConfig.cmake，确保 rocm-cmake CMake 模块可用。
