# test_package/MANIFEST.yml — rocm-cmake 0.4.0
# 字段名与结构对齐仓内真实先例（如 archives/a/a52dec/0.7.4/test_package/MANIFEST.yml、
# archives/a/abcm2ps/8.14.15/test_package/MANIFEST.yml、archives/7/7bitdi/3.4.0/test_package/MANIFEST.yml）：
#   upstream_check_command / upstream_test_in_build / upstream_test_command /
#   upstream_tests / test_package_tests / assertion_count
#
# ── 统计命令与命中项核实口径 ──────────────────────────────────────────────
# 上游用例总数：
#   ls <src>/test/pass/*.cmake | wc -l   # = 17
#   ls <src>/test/fail/*.cmake | wc -l   # = 2
#   => 19（均由 test/test.cmake 驱动，逐用例真实 configure/build/install）
#   等价核验：ctest -N 在构建目录列出 19 个 test。
# upstream_test_in_build 命中核实：conanfile.py 的 build() 末尾确实调用
#   cmake.ctest(cli_args=["--output-on-failure", "-E", "<4 个受限用例 regex>"])。
# upstream_test_command 命中核实：即 build() 中实跑的 ctest 命令行（含 -E 排除集）。
# 本次实测：19 用例中 15 通过、4 平台受限豁免（逐条见下 excluded_tests 与 notes.md）。

package: rocm-cmake/0.4.0
homepage: "https://github.com/ROCm/rocm-cmake"

# 上游测试命令（用于 ctest -N / test/CMakeLists.txt 分析的等价命令）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true

# 本次实跑命令（-E 显式排除 4 个平台受限用例；禁止静默跳过、禁止改上游测试文件）
upstream_test_command: "ctest --output-on-failure -E 'pass-simple-soversion|pass-simple-soversion-env|pass-version-norepo|pass-version-parent'"

# 上游实际运行的测试程序（rocm-cmake 0.2.x/0.4.0 无独立测试二进制，测试即 CMake 用例）
upstream_tests:
  - file: "test/test.cmake"
    source: "test/test.cmake"
    description: "上游 ctest 驱动脚本：为每个 pass/fail 用例真实执行 configure/build/install（非空壳）"
    command: "ctest --output-on-failure"
  - file: "test/pass/*.cmake"
    source: "test/pass"
    count: 17
    description: "17 个应通过用例（真实 CMake configure/build/install）"
    command: "ctest -R '^pass-' --output-on-failure"
  - file: "test/fail/*.cmake"
    source: "test/fail"
    count: 2
    description: "2 个应失败用例（断言 configure 必须报错）"
    command: "ctest -R '^fail-' --output-on-failure"

# 平台受限用例豁免（TEST_QUALITY_SPEC §3.3 路径 3）：逐条声明 + 根因
excluded_tests:
  - name: "pass-simple-soversion"
    reason: "OHOS 不生成 .so 版本化符号链接（libsimple.so.1 缺失）；普通 CMake SOVERSION 工程实测同样不产版本化软链。平台能力差异，非配方缺陷（先例 rocm-cmake 0.12.0 同因豁免）。"
  - name: "pass-simple-soversion-env"
    reason: "同 pass-simple-soversion（env 变量变体），OHOS 无版本化软链。"
  - name: "pass-version-norepo"
    reason: "上游版本测试框架依赖 git 元数据：tarball 非 git 树内 git describe 失败，期望值 0 与 PROJECT_VERSION_TWEAK 空值不等；且 ROCMSetupVersion 用 --match [0-9]*、测试框架用 --always，取值口径不一致。"
  - name: "pass-version-parent"
    reason: "同 pass-version-norepo，同一 git 元数据假设。"

# test_package 中自带的测试（消费者视角端到端验证，R34：必须实质调用被测包）
test_package_tests:
  - file: "CMakeLists.txt"
    description: "消费者 CMake：find_package(ROCM REQUIRED) 找包；真实调用 rocm_setup_version（断言 0.4.0）、rocm_get_patch_version（读 ROCM_LIBPATCH_VERSION）、rocm_install_targets + rocm_export_targets（安装库 + 导出 CMake config）；断言失败即 FATAL_ERROR"
    command: "cmake --build <build> (conan create)"
  - file: "test_package.cpp"
    description: "运行期二进制：解析 rocm_setup_version 注入的版本串，二次校验 major.minor.patch==0.4.0 与 patch 字段=='0'，并做版本校验和断言；失败返回非零退出码（非空壳打印）"
    command: "./test_package"

# 测试断言总数（实测口径，用于质量评估）
# 口径 = 上游 19 个 ctest 用例 + test_package 10 项断言 = 29
#   configure 期 4 项：find_package 成功 / version==0.4.0 / patch值=="0" /
#                      导出 config 存在（FATAL_ERROR 兜底）
#   install 期 2 项：librocm_consumer_core.a 与
#                    lib/cmake/test_package/test_package-config.cmake 真实落盘
#                    （build() 已调 cmake.install()，实测均已执行）
#   运行期 4 项：parse / version==0.4.0 / patch=="0" / checksum==40
# 实测上游 15/15 通过（4 例平台受限显式豁免）；test_package 10/10 通过，退出码 0。
assertion_count: 29
