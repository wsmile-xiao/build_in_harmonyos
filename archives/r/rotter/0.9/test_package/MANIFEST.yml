# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rotter/0.9
homepage: "https://www.aelius.com/njh/rotter/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# R51 清点证据: Makefile.am 仅 SUBDIRS=src，无 tests/ 目录、无 check 目标；
# 实测 `make check` 输出 "Nothing to be done for 'check-am'"（automake 空目标），
# 上游 rotter 0.9 无自动化测试套件。清点证据见 notes.md「上游测试三步法」一节。
upstream_tests: []
upstream_test_inventory: "上游无自动化测试套件：Makefile.am SUBDIRS=src（无 tests/、无 check 规则），实测 make check 为 automake 空目标，0 个用例"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: consumer_test.c
    description: "鸿蒙消费者用例：第三方 C 消费者真实链接并调用 rotter 依赖栈——libsndfile WAV 写读回环、lame MP3 编码/flush、twolame MP2 编码/flush，验证适配后的依赖栈在 HarmonyOS 上可被下游 C 代码消费"
    command: "./rotter_consumer_test (ctest: rotter_consumer_test)"
  - file: conanfile.py (test())
    description: "打包产物冒烟：在 HarmonyOS 上真实执行 rotter 二进制 --help，校验版本横幅 'rotter version 0.9' 输出（同时验证 libjack 等运行时依赖可加载）"
    command: "rotter --help (bash 包装, conanrun env)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
