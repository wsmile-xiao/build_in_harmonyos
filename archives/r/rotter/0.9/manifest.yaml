# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "2009 版 config.guess 无 GUESS 变量（逐 case echo+exit），patch-autotools-ohos.pl 插入的 HarmonyOS 分支用 GUESS= 赋值会静默失效，需改为 echo+exit"
  - "2009 版 config.sub 不识别 aarch64，需同时补 CPU 列表（aarch64|aarch64be 与 aarch64-*/aarch64be-*）+ maybe_os linux-ohos* + OS 列表 -linux-ohos* + -linux 归一化特判，共四处"
  - "rotter.h 全局变量无 extern（2010 年 GCC -fcommon 语义），clang>=10 默认 -fno-common 导致重复符号链接失败，需 -fcommon"
  - "HMDFS 上 conan full_deploy/cache 出的依赖 .so 属主为其他 uid 时动态加载器读取失败（conftest 报 Error loading shared library），需用自有权限副本构建；test_package 需把依赖 .so 拷为自有副本（rtlibs）再执行"
  - "autotools conftest 运行时需 LD_LIBRARY_PATH 指向依赖 lib 目录（PkgConfigDeps/AutotoolsToolchain 不会自动设置），通过 AutotoolsToolchain.generate(env=tc.environment() 后追加) 注入；注意自定义 env 会整体替换 toolchain 默认 env，extra_cflags 必须先于 env=tc.environment() 设置"
  - "lame 无 .pc 文件且 AutotoolsToolchain 不注入依赖 -I/-L，AC_CHECK_LIB(mp3lame) 需配方显式注入 CPPFLAGS/LDFLAGS"
  - "HMDFS 对不存在路径的 stat 返回 EACCES（应为 ENOENT）：GNU coreutils 9.x 的 sort -/cat - 视为致命错误；toybox 正常。本机需 scratch profile 将 /system/bin 置于 PATH 最前，CI ext4 不受影响"
  - "平台沙箱 BASH_ENV + bash 函数 rm() 包装 safe-bin/rm（shebang /bin/bash 缺失）会劫持 make 内每条命令（Error 126）；需 env -u BASH_ENV -u BASH_FUNC_rm%% 运行 conan create"

