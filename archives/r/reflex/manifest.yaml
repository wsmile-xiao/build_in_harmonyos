software: reflex
display: "REFLEX"
description: "Relocalizable Fast Lexical Scanner — Thomas Dickey's maintained fork of flex 2.5.4; generates C and C++ scanners and ships the librefl runtime"
category: build-tool
homepage: "https://invisible-island.net/reflex/"
license: BSD-3-Clause-flex
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 无法识别 HongMeng 内核 → 显式传 --build=aarch64-linux-ohos --host=aarch64-linux-ohos；两者 canonical 后相等故 cross_compiling=no，@no_cross@ 守卫下的自举自检（make check）才会启用"
    - "发布包 skel.c 与 flex.skl 内容不一致却 mtime 相同（均为 2025-01-01 05:56）→ make 不会重生成 skel.c，真正生效的构建输入是发布版 skel.c；补丁必须打 skel.c，并在 build() 用 os.utime 强制其 mtime 更新以保证确定性"
    - "C++ 生成路径上游缺陷：骨架把 C-only 的 yy_init_globals()/yylex_destroy() 放在 non-C++ 守卫区块之外，导致 reflex++ 生成的 C++ 扫描器无法编译 → 补丁 0001 用骨架的 %- … %* 标记把两个函数包进 non-C++ 区"
    - "C++ 消费需走 stdout 形式 reflex++ -t foo.l > foo.cc；用 -o 时 #include <reFlexLexer.h> 由 outn() 在重定向前写入 stdout 而丢失"
    - "HMDFS 临时目录坑：CI worker 上构建进程的 TMPDIR 落在 $HOME/.cache/tmp（HMDFS 用户卷）时，config.status 自建临时目录后立即重定向写入会报 Permission denied（本地全绿、CI 间歇失败，同一代码一次失败一次通过，属时序竞态而非必现）→ 补丁 0002 显式 chmod 700 临时目录，且 recipe 的 _pin_tmpdir() 在 configure 前把 TMPDIR/TMP/TEMP 钉到经写探针验证的可写根（优先非 HMDFS 的 /data/storage/el2/base/cache）"
    - "R26 要求终端工具静态链接 → package_type=static-library，AutotoolsToolchain 默认 --disable-shared --enable-static"
    - "R38 要求产可执行文件的包声明软件级 commands.json → 已在 archives/r/reflex/commands.json 登记 bin/reflex 与 bin/reflex++"
    - "E077：OHOS 上 ELF 须带 .codesign 才能执行 → build() 内对 flex 签名（make check 需执行它），package() 内对安装出的 bin/reflex、bin/reflex++ 签名"
  common_dependencies:
    - "bison"
    - "diffutils"
  status: built

versions:
  "20241231":
    status: built
    build_date: "2026-09-29"
