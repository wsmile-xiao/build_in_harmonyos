# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 要求此文件存在且非空
# 详见: docs/TEST_QUALITY_SPEC.md

package: reflex/20241231
homepage: "https://invisible-island.net/reflex/"

# 上游测试命令（自举自检：用刚构建出的生成器重新生成自己的扫描器并与
# 发布包预生成的 initscan.c 逐字节比对；.bootstrap 规则把 initscan.c
# 复制成 scan.c 后 check 才 diff 得起来）
upstream_check_command: "make check"

# conanfile.py build() 已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check + make COMPRESSION=<mode> check（6 种压缩模式补扫）"

# 上游测试总量（静态审计）
# 口径：reflex 的 make check 是"自举回归"单断言（重新生成的 scan.c 与发布版
# initscan.c 必须逐字节相同），Makefile 另提供 bigcheck 目标把同一断言在 7 种
# 表压缩模式下各跑一遍。bigcheck 首项是裸 -C，而本版选项解析器把紧随其后的
# 独立参数当作压缩后缀（报 `./flex: unknown -C option '/'`），故 bigcheck 在
# 上游即不可用；recipe 改为显式驱动其余 6 种模式。
upstream_test_total: 1
upstream_test_count_method: autotools_tests
upstream_test_audit: >-
  静态清点：Makefile.in 中 check 目标为单条断言
  （mkscan.sh $(FLEX_EXEC) ... scan.l | diff scan.c -，失败即 exit 1），
  bigcheck 目标重复该断言 7 次（COMPRESSION 依次为 -C / -Ce / -Cm / -f /
  -Cfea / -CFer / -l）。因此声明口径 1（自举回归断言），真机执行 7 次
  （默认模式 + 6 种压缩模式，裸 -C 因上游选项解析缺陷排除，见 notes.md）。

# make check 实际运行的测试集合
upstream_tests:
  - name: "self-hosting regeneration"
    source: "reflex-20241231/scan.l → scan.c vs initscan.c"
    description: >-
      用刚构建的 reflex 重新生成自身的扫描器（scan.l → scan.c），与发布包
      预生成的 initscan.c（由 .bootstrap 复制为 scan.c）逐字节比对
    command: "make check"
  - name: "compression-mode sweep"
    source: "reflex-20241231/scan.l"
    description: >-
      在 -Ce / -Cm / -f / -Cfea / -CFer / -l 六种表压缩模式下重复上述自举
      回归（上游 bigcheck 的剩余模式；裸 -C 上游即失败，见 notes.md）
    command: "make COMPRESSION=<mode> check"

# test_package 中自带的测试 (消费者视角验证，R34: 真实执行被测二进制)
test_package_tests:
  - file: test_reflex.py
    description: "reflex --version 退出码 0 且输出同时含 2.5.4 与 20241231"
    command: "python3 test_reflex.py <package_folder> <cc> <cxx>"
  - file: test_reflex.py
    description: "reflex++ --version 可用（安装期创建的同名符号链接已随包发布）"
    command: "python3 test_reflex.py <package_folder> <cc> <cxx>"
  - file: test_reflex.py
    description: "include/reFlexLexer.h 同时声明 FlexLexer 基类与 yyFlexLexer"
    command: "python3 test_reflex.py <package_folder> <cc> <cxx>"
  - file: test_reflex.py
    description: "lib/librefl.a 为合法 ar 归档且导出 yywrap"
    command: "python3 test_reflex.py <package_folder> <cc> <cxx>"
  - file: test_reflex.py
    description: "share/man/man1/reflex.1 已安装且非空"
    command: "python3 test_reflex.py <package_folder> <cc> <cxx>"
  - file: test_reflex.py
    description: >-
      C 端到端：reflex 生成扫描器 → clang 编译并以 librefl.a 提供 main/yywrap
      → 运行并对固定输入断言词法流 NUM:42,ID:alpha,NUM:7,ID:_b9
    command: "python3 test_reflex.py <package_folder> <cc> <cxx>"
  - file: test_reflex.py
    description: >-
      C++ 端到端：reflex++ 生成扫描器（首行即 #include <reFlexLexer.h>）→
      clang++ -std=c++17 编译链接 librefl.a → 运行并断言同一词法流
    command: "python3 test_reflex.py <package_folder> <cc> <cxx>"

# 测试断言总数（消费者 7 项检查，其中 2 项为完整端到端编译执行链路）
assertion_count: 7
