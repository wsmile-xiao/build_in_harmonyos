knowledge_gained:
  - "reflex 发布包内 skel.c 与 flex.skl 内容不一致且 mtime 相同：skel.c（及由它生成的 initscan.c）用 `(char *) 0`，而 flex.skl 仍写 `NULL`。mtime 相等时 make 不触发 skel.c: flex.skl 规则，故构建实际用的是发布版 skel.c —— 补丁必须打在 skel.c 上，并在 build() 里 os.utime 强制它比 flex.skl 新，否则 mkskel.sh 重生成会覆盖补丁，且 C 输出与 initscan.c 不再一致导致 make check 失败。（knowledge_ref: knowledge/drafts/reflex-20241231-skel-c-flex-skl-mtime-divergence.kv）"
  - "reflex 20241231 的 C++ 生成路径存在上游缺陷：骨架把 C-only 的 yy_init_globals() / yylex_destroy() 放在 non-C++ 守卫区块之外，C++ 输出里这两个函数引用的是 yyFlexLexer 成员名而非文件级全局，使 `reflex++` 生成的所有 C++ 扫描器都无法编译（10 个 undeclared identifier）。（knowledge_ref: knowledge/drafts/reflex-20241231-cxx-skeleton-guard-misplacement.kv）"
  - "C++ 消费流程必须用 stdout 形式：`reflex++ -t foo.l > foo.cc`。用 `-o foo.cc` 时 `#include <reFlexLexer.h>` 由 outn() 在输出文件重定向前写到 stdout 而丢失，生成物缺少类声明无法编译。（knowledge_ref: knowledge/drafts/reflex-20241231-reflexpp-stdout-form-required.kv）"
  - "reflex 的 make check 是自举回归：用刚构建的生成器重新生成 scan.l → scan.c，与发布包预生成的 initscan.c（.bootstrap 复制为 scan.c）逐字节比对；只有 --build/--host 同为 aarch64-linux-ohos（canonical 后相等 → cross_compiling=no，@no_cross@ 为空）时才启用；反之交叉构建下该规则被静默置空，make check 退出码 0 但一条断言都没跑。（knowledge_ref: knowledge/drafts/reflex-20241231-bootstrap-check-build-host-equality.kv）"
  - "上游 bigcheck 目标首项是裸 -C，本版选项解析器会把紧随其后的独立参数当作压缩后缀（`./flex: unknown -C option '/'`）→ bigcheck 在上游即失败；其余 6 种模式（-Ce/-Cm/-f/-Cfea/-CFer/-l）均通过。（knowledge_ref: knowledge/drafts/reflex-20241231-bigcheck-bare-c-compression-option.kv）"
  - "本地全绿但 CI 间歇失败的一种 autotools 失败模式：CI worker 上某次构建进程的 TMPDIR 落在 HMDFS 用户卷（实测 $HOME/.cache/tmp），而 config.status 用 umask 077 && mktemp -d -q \"$TMPDIR/csXXXXXX\" 建目录后立刻重定向写入 → 新目录属主/权限元数据未生效，第一次写入即 Permission denied（subs.sed/subs.frag/out/in/undefs.sed 全中），configure 本身却通过，症状极像随机抖动。注意：本包实测为间歇竞态（同一份修复前代码 #65023 失败、#65046 通过），不能仅凭『同点复现』断言确定性，但根因真实存在、重试不可依赖。修法：configure 侧显式 chmod 700 临时目录（补丁 0002），recipe 侧在 configure 前把 TMPDIR/TMP/TEMP 钉到经『写入刚建目录并回读』探针验证的可写根（_pin_tmpdir，优先非 HMDFS 的 /data/storage/el2/base/cache）。（knowledge_ref: knowledge/drafts/reflex-20241231-hmdfs-tmpdir-config-status-eacces.kv）"

