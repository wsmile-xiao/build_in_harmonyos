# conandata.yml — reflex 20241231
# REFLEX (Thomas Dickey's "relocalizable fast lexical scanner"), the
# maintainer fork of flex 2.5.4.

sources:
  url: "https://invisible-island.net/archives/reflex/reflex-20241231.tgz"
  sha256: "06a8c57fb666d74c8450e6aa2e471835a0ca2995b3621fb64f9cc4ce9daad6b6"

patches:
  - patch_file: "patches/0001-skel.c.patch"
    patch_description: >-
      The generated-skeleton array skel.c emits yy_init_globals() and
      yylex_destroy() — the C-only helpers that reset the file-scope scanner
      globals — outside the "standard (non-C++)" skeleton region, so every
      C++ scanner produced by `reflex -+` / `reflex++` references names that
      are yyFlexLexer members in C++ mode and cannot compile.  Wrap the two
      helpers in the skeleton's non-C++ guard markers.
    patch_type: "bugfix"
  - patch_file: "patches/0002-configure-hmdfs-tmpdir.patch"
    patch_description: >-
      Portability fix for the HMDFS-backed user volume: config.status creates
      its scratch directory through `umask 077 && mktemp -d -q
      "$TMPDIR/csXXXXXX"`.  On a CI worker whose TMPDIR resolves onto HMDFS
      the freshly created directory comes back without usable owner
      permissions, so the very first redirect into it — `> "$tmp"/subs.sed` —
      dies with "Permission denied" and config.status never generates
      install-man (observed on two independent workers).  Drop the umask
      dependency and chmod the directory explicitly so the mode is
      deterministic on every filesystem.  Not a platform-behaviour change:
      mktemp already requests 0700, the patch only makes it stick.
    patch_type: "portability"
