name: radare2
version: 6.0.7
software: radare2
status: built
build_system: autotools
configure_options:
  - --prefix=$DEFAULT_PREFIX
  - --without-qjs
  - WANT_QJS=0
  - USERCC=clang
  - HOST_CC=clang
dependencies:
  - name: capstone
    version: ">=4.0"
    required: false
source_url: https://github.com/radareorg/radare2/releases/download/6.0.7/radare2-6.0.7.tar.gz
patches:
  - 0001-pthread_cancel-harmonyos.patch
  - 0002-host-cc-clang.patch
  - 0003-sdb-cc-clang.patch
knowledge_gained:
  - pthread_cancel 在 HarmonyOS 不支持，需使用 pthread_kill(tid, 9) 替代
  - HOST_CC 需设置为 clang，因为 gcc 不可用
  - subprojects/sdb/config.mk 中 CC 需设置为 clang
