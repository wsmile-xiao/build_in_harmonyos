# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: rblcheck/20231210
homepage: "https://github.com/rfc1036/rblcheck"

# 上游测试命令：automake 的 `make check`
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# build() 在 make() 之后调用 autotools.make(target="check")，因此为 true
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序：Makefile.am 的 TESTS 变量声明的 3 个脚本
#
#   TESTS = tests/clearlist tests/addlisting tests/removelisting
#
# 三个脚本均为 /bin/sh，全部只操作 rblcheck 的**本地 zone 列表**
# （-c 清空 / -s <zone> 切换 / -l 列出并 exit），其中 -l 在任何地址被检查之前
# 就 exit(0)，因此**三者都不访问网络或 DNS**。
upstream_tests:
  - file: tests/clearlist
    source: "rblcheck-20231210/tests/clearlist"
    description: >-
      清空 zone 列表后 `-c -l` 应输出为空。断言脚本自身以空输出为通过条件。
    command: "./rblcheck -c -l"
  - file: tests/addlisting
    source: "rblcheck-20231210/tests/addlisting"
    description: >-
      清空后加入 testlisting 再列出：`-c -s testlisting -l | grep -v '^#' | uniq`
      必须恰好等于 "testlisting"。
    command: "./rblcheck -c -s testlisting -l"
  - file: tests/removelisting
    source: "rblcheck-20231210/tests/removelisting"
    description: >-
      同一 zone 连续切换两次（加入后再移除）后列出应为空：
      `-c -s testlisting -s testlisting -l` 必须无输出。
    command: "./rblcheck -c -s testlisting -s testlisting -l"

# 上游测试总数（如实申报；Makefile.am 的 TESTS 变量恰好 3 项）
upstream_total: 3
upstream_executed: 3

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_rblcheck.sh
    description: >-
      打包产物消费者冒烟 10 项断言：二进制可执行、`-v` 报告 20231210 且退出码 0、
      `-h` 打印用法且退出码 0、无参数退出码非 0、`-c -l` 为空、
      `-c -s testlisting -l` 恰好列出 testlisting、双重切换后为空、
      加入后再清空为空、对保留 TLD `.invalid` 的真实查询进程干净退出（不崩溃）。
    command: "bash test_rblcheck.sh <pkg_bin>"

# 关于网络依赖的说明
network_notes:
  upstream_tests_need_network: false
  detail: >-
    3 个上游测试全部为本地 zone 列表操作，-l 在地址检查前 exit，不触发任何 DNS 查询。
    test_package 中唯一涉及解析器的一条断言使用保留 TLD `.invalid`（保证不解析），
    不依赖任何外部 DNSBL 服务，因此本库**没有**因公网服务不可用而无法执行的用例。
  crypto: >-
    保留上游默认的加密后端（--with-crypto-library=openssl），hashed DNSBL 支持
    已编译进产物；openssl 因此是**运行期**依赖（动态链接 libcrypto），
    已在 conanfile 中声明为 requires()。

# 测试断言总数 (近似值, 用于质量评估)
# test_package 10 项 + 上游 3 项
assertion_count: 13
