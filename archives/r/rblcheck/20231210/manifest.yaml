software: rblcheck
version: "20231210"
build_system: autotools
status: pending
build_date: ""

source:
  url: "https://github.com/rfc1036/rblcheck/archive/refs/tags/v20231210.tar.gz"
  sha256: "3ff6c22a6b798ce4f27266670c07b2e33b8ccf095bb989355795c0f3305e6a8f"
  tar_format: tar.gz
  note: "上游仓库 github.com/rfc1036/rblcheck 的 v20231210 标签（commit bdbf04574a83）。"

build:
  system: autotools
  cc: clang
  crypto_backend: "openssl (上游默认 --with-crypto-library=openssl，保留 hashed DNSBL 支持)"
  dependencies:
    - "openssl/3.5.7 (libcrypto，运行期动态链接)"

patches_applied: []
ohos_source_changes: none
build_time_transformations:
  - "autoreconf --install 生成 configure 后，将其中的两处 `umask 077` 放宽为 `umask 022`
     （config.status 的临时目录）。这是对本步骤自行生成的文件的构建期改写，不是对上游源码的修改。"

knowledge_gained:
  - "**OHOS libc 提供 res_query**：configure 的 `checking for res_query... yes` 与
     `checking for getaddrinfo... yes` 均通过，<resolv.h> / <arpa/nameser.h> 存在，
     实测 res_query 可直接链接 libc 无需 -lresolv。因此 musl 缺少 res_query 的常见担忧
     在 OHOS 上不成立，rblcheck 不需要解析器 shim"
  - "**HMDFS 上 700 权限目录不可写（含属主）**：`(umask 077 && mkdir d)` 得到 drwx--S---，
     随后向其中写文件报 Permission denied；同一位置 `(umask 022 && mkdir d)` 得到
     drwxr-s--x，写入正常。autoconf 的 config.status 正是用 `(umask 077 && mktemp -d ./confXXXXXX)`
     建临时目录，因此在本平台必然失败：
     `./config.status: can't create ./confXXXXXX/subs1.awk: Permission denied` +
     `config.status: error: could not setup config files machinery`。
     最小修复：把生成的 configure 中两处 umask 077 放宽为 022。
     注意 `umask 022` 外挂无效 —— config.status 在子 shell 内显式设置 umask 077"
  - "上游 TESTS = tests/clearlist tests/addlisting tests/removelisting 三项且**全部不访问网络**：
     -l 在地址检查之前 exit(0)，三个脚本只操作本地 zone 列表，因此公网 DNSBL 可用性
     不影响上游测试执行；本库没有因外部服务而 blocked 的用例"
  - "上游 tarball 不含预生成的 configure，必须先 `autoreconf --install`（需要 autoconf/automake/
     libtool/pkg-config，OHOS 构建镜像均已提供）"
