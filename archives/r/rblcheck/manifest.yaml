software: rblcheck
display: "rblcheck"
description: "DNSBL/RBL 黑名单查询工具（构造反向查询名交给系统解析器解析，判断 IP/域名是否被列入黑名单）"
category: net
homepage: "https://github.com/rfc1036/rblcheck"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "OHOS libc **提供 res_query**：configure 的 res_query/getaddrinfo 探测均通过，<resolv.h>/<arpa/nameser.h> 存在，可直接链接 libc 无需 -lresolv —— 常见的『musl 缺 res_query』担忧在此不成立，无需解析器 shim"
    - "HMDFS 上 mode 700 目录连属主也不可写：`(umask 077 && mkdir d)` 得到 drwx--S--- 且随后写入报 Permission denied；`(umask 022 && mkdir d)` 得到 drwxr-s--x 写入正常。autoconf 的 config.status 恰用 umask 077 建临时目录，故 configure 必然失败（can't create ./confXXXXXX/subs1.awk）。修复：把**生成的** configure 中两处 umask 077 放宽为 022（构建期对自生成文件的改写，非上游源码修改）"
    - "外挂 umask 022 无效：config.status 在子 shell 内显式设置 umask 077"
    - "上游 tarball 不含预生成 configure，须先 autoreconf --install（autoconf/automake/libtool/pkg-config 在 OHOS 构建镜像齐备）"
    - "上游 TESTS = clearlist / addlisting / removelisting 共 3 项，全部只操作本地 zone 列表（-l 在地址检查前 exit），**不访问网络** —— 无因外部 DNSBL 服务而 blocked 的用例；build() 中 make check 全量执行 3/3 PASS"
    - "保留上游默认加密后端 openssl，hashed DNSBL 支持已编译；libcrypto 为运行期动态依赖，声明 requires(openssl/3.5.7)"
  common_dependencies:
    - "openssl/3.5.7"

versions:
  "20231210":
    status: pending
    build_date: ""
