software: redis_plus_plus
version: "1.2.3"
status: published
build_date: "2026-06-24"

source:
  url: "https://github.com/sewenew/redis-plus-plus/archive/refs/tags/1.2.3.tar.gz"
  sha256: ""
  tar_format: tar.gz

build_system: cmake

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DREDIS_PLUS_PLUS_BUILD_TEST=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_CXX_FLAGS=-fPIC -O2"
  dependencies:
    - "hiredis/1.2.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMakeLists.txt 要求 cmake_minimum_required(VERSION 3.1)，CMake 4.x 需要 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "依赖 hiredis，需先编译安装 hiredis 库"
