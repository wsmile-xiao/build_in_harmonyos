software: rt-tests
display: "rt-tests"
description: "Linux 实时测试套件：cyclictest、signaltest、hackbench、pi_stress、oslat 等，用于测量实时延迟与调度行为"
category: utility
homepage: "https://git.kernel.org/pub/scm/utils/rt-tests/rt-tests.git/"
license: GPL-2.0-or-later
build_system: make

ohos_adaptation:
  key_points:
    - "手写 Makefile；bionic 特性宏缺失但运行时可用的，用 -D 启用（_POSIX_THREAD_PRIO_INHERIT）"
    - "无 getcpu() → HAVE_SCHED_GETCPU/sched_getcpu()；无 libnuma → RT_NO_NUMA 单节点降级"
    - "bionic 无 pthread_setaffinity_np 系列 → bionic.h 补 shim（仅 affinity，barrier 齐全）"
    - "无 SIGEV_THREAD_ID → 回退 SIGEV_SIGNAL"
    - "POSIX mq_* 只在静态 libc.a → 不构建 pmqtest"
  common_dependencies: []

versions:
  "2.10":
    status: built
    build_date: "2026-09-26"
    conan_ref: "rt-tests/2.10"
