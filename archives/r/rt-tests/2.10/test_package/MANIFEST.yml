# test_package/MANIFEST.yml
# rt-tests 2.10
#
# rt-tests has no separate automated test suite: the shipped tools *are* the
# tests. On OHOS non-root cannot obtain SCHED_FIFO (EPERM, no CAP_SYS_NICE), so
# the real-time measurement tools cannot run their measurement loop; the harness
# verifies their build/version/help surface and actually executes the tools that
# do not need realtime privileges.

package: rt-tests/2.10
homepage: https://git.kernel.org/pub/scm/utils/rt-tests/rt-tests.git/

upstream_tests_exist: false
upstream_test_audit: "no test suite / no `make check`; the -tests binaries themselves are the deliverable"
upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_count: 0
upstream_passed: 0
upstream_failed: 0

test_package_tests:
  - file: test_rt_tests.sh
    description: "13 version/help checks + hackbench execution against the installed binaries"
    command: "RT_BINDIR=<pkg>/bin sh test_rt_tests.sh"

test_files:
  - path: "test_package/test_rt_tests.sh"
    test_type: "OHOS consumer"
    assertion_count: 14
    description: "14 assertions against the installed binaries"

test_package_test_count: 14
consumer_assertion_count: 14
assertion_count: 14
