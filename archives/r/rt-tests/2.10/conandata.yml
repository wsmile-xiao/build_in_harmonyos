# conandata.yml - rt-tests 2.10
#
# The Debian orig tarball rt-tests_2.10.orig.tar.gz preserves the upstream
# release layout and its sha256 was checked character-for-character against
# rt-tests_2.10-1.dsc. (kernel.org also publishes rt-tests-2.10.tar.gz but it is
# repacked with a different file order/hash, so it cannot share this sha256.)
# Uses the HTTPS Debian pool URL.

sources:
  url: "https://deb.debian.org/debian/pool/main/r/rt-tests/rt-tests_2.10.orig.tar.gz"
  sha256: "2c7962842ee8b6e3ffc975e26745dd438812a7218a5faa95bc6a28b96abb0b23"

patches:
  - patch_file: "patches/0001-no-libnuma-stub.patch"
    patch_description: "Stub the libnuma-only helpers when built RT_NO_NUMA (no libnuma on OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0002-makefile-clang-flags.patch"
    patch_description: "Clang-compatible default CFLAGS, drop -lnuma under RT_NO_NUMA, guard MANPAGES on PYLIB"
    patch_type: "portability"
  - patch_file: "patches/0003-cyclictest-sigev-thread-id.patch"
    patch_description: "Fall back to SIGEV_SIGNAL when bionic lacks SIGEV_THREAD_ID"
    patch_type: "portability"
  - patch_file: "patches/0004-oslat-nonuma.patch"
    patch_description: "oslat: use the online CPU count when built RT_NO_NUMA"
    patch_type: "portability"
  - patch_file: "patches/0005-cyclictest-numa-include.patch"
    patch_description: "cyclictest: guard the libnuma include with RT_NO_NUMA"
    patch_type: "portability"
  - patch_file: "patches/0006-bionic-np-affinity-shim.patch"
    patch_description: "bionic.h: gate the pthread_barrier shims and add the affinity shims"
    patch_type: "portability"
