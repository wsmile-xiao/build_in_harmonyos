patches_applied:
  - "patches/0001-no-libnuma-stub.patch"
  - "patches/0002-makefile-clang-flags.patch"
  - "patches/0003-cyclictest-sigev-thread-id.patch"
  - "patches/0004-oslat-nonuma.patch"
  - "patches/0005-cyclictest-numa-include.patch"
  - "patches/0006-bionic-np-affinity-shim.patch"

knowledge_gained:
  - "bionic 在 <unistd.h> 不定义 _POSIX_THREAD_PRIO_INHERIT，但运行时 PI mutex 可用 → 用 -D 启用而非关掉 pi_stress"
  - "bionic 无 getcpu()（且有 __NR_getcpu 但被 SIGSYS 拦截）→ 用 HAVE_SCHED_GETCPU/sched_getcpu()"
  - "无 libnuma + 无 NUMA 拓扑 → RT_NO_NUMA 单节点降级"
  - "bionic 无 pthread_[sg]etaffinity_np/pthread_attr_setaffinity_np；有 barrier（不能用 PTHREAD_BIONIC 全套）"
  - "bionic 无 SIGEV_THREAD_ID → 回退 SIGEV_SIGNAL"
  - "POSIX mq_* 只在静态 libc.a、不在共享 libc.so → pmqtest 不构建"
  - "非 root 无 CAP_SYS_NICE：cyclictest 等强制 SCHED_FIFO 无法实跑，测试只验 help/version"
