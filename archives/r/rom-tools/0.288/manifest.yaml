build:
  system: custom
  configure_options: []
  dependencies:
    - zlib/1.3.1
    - expat/2.7.1
    - flac/1.4.3
    - zstd/1.5.6
    - utf8proc/2.11.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "MAME build system requires genie + SDL2; standalone build bypasses this"
  - "chdman/romcmp are pure CLI tools that don't need SDL"
  - "osdlib_unix.cpp includes SDL headers for clipboard functions; stubbed for CLI tools"
  - "LZMA AesOpt.c and Sha256Opt.c use ARM crypto intrinsics not available on HarmonyOS clang 15"
  - "MAME needs C++20 for char8_t, std::span, std::u8string_view"

