# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - patches/0001-radamsa-do_poll-ohos-chardev-writable.patch

patch_classification:
  - patch: patches/0001-radamsa-do_poll-ohos-chardev-writable.patch
    type: portability
    target: 构建期生成物 radamsa.c（bin/ol 生成后、cc 编译前由 build() 显式套用；
            不能在构建前套源码补丁——届时文件尚不存在）
    reason: >-
      OHOS musl/内核对字符设备（/dev/null、/dev/zero 等）poll(2)/select(2) 永不
      报告写就绪（POLLOUT），即使 write(2) 立即成功；而 Owl Lisp VM 在向 stdout
      端口写入前以无限超时 poll 写就绪，导致 stdout 重定向到 /dev/null 时进程在
      select() 中永久休眠。上游 README 的标准用法 `radamsa ... -n 100000 ... >
      /dev/null` 与上游测试套件（tests/1k.sh 等）在 OHOS 上全部踩中。补丁将
      do_poll 写集中的字符设备 fd 直接判为可写；管道/套接字/普通文件保持原生
      poll 语义（实测管道与普通文件的 POLLOUT 在 OHOS 上报告正确）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "radamsa 官方上游是 gitlab.com/akihe/radamsa（Aki Helin/OUSPG）；任务卡别名路径 aoh/radamsa 2026-09 已非公开（匿名访问 302→sign_in、API 404），版本锚点以 akihe 仓库 tag + Homebrew formula 双源交叉核验（sha256 逐字符一致）"  # knowledge_ref: knowledge/drafts/DRAFT-E655-scheme-bootstrap-generated-artifact-patch.md
  - "上游构建形态为 Scheme 自举：rad/*.scm 用 Owl Lisp 引导编译器（ol-0.2.2.c.gz，即 Makefile OWLURL）现场编译出 bin/ol，再 `bin/ol -O1 -o radamsa.c rad/main.scm` 生成单文件 C，最后 cc 编译；(lib hex core) 库由 Makefile 构建期 git clone owl-lisp/hex 取得——移植时三份输入全部以 conandata 预置消除构建期网络"  # knowledge_ref: knowledge/drafts/DRAFT-E655-scheme-bootstrap-generated-artifact-patch.md
  - "生成物 radamsa.c 字节级确定（两次独立构建 sha256 一致：2d70a4ce…014095），因此对生成物打平台补丁可稳定套用；补丁必须在生成步之后、最终编译之前由 build() 显式应用，不能走构建前的常规源码补丁机制"  # knowledge_ref: knowledge/drafts/DRAFT-E655-ohos-chardev-pollout-select-hang.md
  - "OHOS 平台缺陷（一手实测）：/dev/null、/dev/zero 的 poll(2)/select(2) 永不报告 POLLOUT（零超时/有限超时返回 0、无限超时永不返回），而普通文件与管道的 POLLOUT 报告正确、/dev/null 的 POLLIN 也正确——任何『先 poll stdout 写就绪再写』的运行时（如 Owl Lisp VM、可能的其它脚本语言 VM）在 OHOS 上都会被 stdout>/dev/null 挂死"  # knowledge_ref: knowledge/drafts/DRAFT-E654-ohos-chardev-pollout-select-hang.md
  - "上游测试入口 tests/run 遍历 tests/*.sh（28 项）逐项最多重试 40 次（模糊断言是概率性的），且依赖 bin/ol 生成随机序列；`*.sh_` 后缀是上游停用测试的命名约定（tcp-client/tcp-serve/blank 共 3 项），tests/pcapng/ 子目录 2 项未接入 runner"  # knowledge_ref: knowledge/drafts/DRAFT-E655-ohos-chardev-pollout-select-hang.md
  - "文件输入 n>=1000 的模糊生成在设备上需数十秒（n=5000 约 51s，超线性于样本大小），验证脚本的逐用例超时须给到 90s 量级，不能按普通 CLI 工具的秒级经验值设置"  # knowledge_ref: knowledge/drafts/DRAFT-E655-ohos-chardev-pollout-select-hang.md

