# test_package MANIFEST — radamsa 0.7
software: radamsa
version: "0.7"
test_type: cli_functional

# 上游官方测试：tests/run（上游 Makefile `test:` 目标 → `.seal-of-quality`），
# 遍历 tests/*.sh 共 28 项，每项最多重试 40 次（模糊测试断言是概率性的），
# 依赖构建树内 bin/ol 生成随机尝试序列。
# 上游测试在平台验证流程中于构建树内执行并留档（reports/upstream-tests.md）：
# TOTAL=28（PASS=28 / FAIL=0 / SKIP=0 / NOT_RUN=0）。
# 上游 runner 未接入的入口（不计入本表分母，逐项归因）：
#   - tests/blank.sh_（空模板）、tests/tcp-client.sh_、tests/tcp-serve.sh_
#     （网络守护进程形态，上游以 .sh_ 后缀停用）——3 项；
#   - tests/pcapng/ 子目录 2 项（pcapng_identity_test.sh /
#     pcapng_well_formedness_test.sh，tests/run 的 tests/*.sh glob 不下探）；
#   - tests/benchmark（性能基准，非 .sh 测试，1 项）。
upstream_check_command: "sh tests/run bin/radamsa（构建树内，见 reports/upstream-tests.md）"
upstream_check_count: 28

# test_package 测试：test.sh 8 项断言（4 项上游功能复验 + 4 项鸿蒙特有）。
#   上游功能复验：--version、--about、固定种子逐字节确定性、-m nop 恒等
#                 （等价上游 tests/nop.sh 语义）。
#   鸿蒙特有：stdout>/dev/null 与 stdout>/dev/zero 完成不挂起（OHOS 字符设备
#             poll/select 永不报告 POLLOUT 的直接回归路径，验证 patches/0001）；
#             -o 输出到 HMFS 可写目录且 %n 序号展开；stdin 管道进 + stdout
#             管道出的标准管线上下游形态。
test_package_tests:
  - "--version 输出版本号 Radamsa 0.7"
  - "--about 含 general purpose fuzzer 自述"
  - "固定种子 (-s 42) 两次输出逐字节一致（fuzzer 核心确定性语义）"
  - "-m nop -p od 恒等输出（上游 tests/nop.sh 语义）"
  - "鸿蒙特有：stdout>/dev/null 完成不挂起（字符设备 poll 缺陷回归，patches/0001）"
  - "鸿蒙特有：stdout>/dev/zero 完成不挂起（字符设备族覆盖）"
  - "鸿蒙特有：-o HMFS 可写路径 %n 展开生成 3 个输出文件"
  - "鸿蒙特有：stdin 管道输入 + stdout 管道输出（cat | radamsa | 消费 形态）"
assertion_count: 8
fixture_count: 1
fixture_origin: "test.sh 运行时在可写构建目录生成 sample.txt（46 字节固定文本样本）"
