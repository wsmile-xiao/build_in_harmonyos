# conandata.yml — radamsa 0.7
# 事实源：上游官方仓库 gitlab.com/akihe/radamsa（Aki Helin / OUSPG）。
# 任务卡上的 gitlab.com/aoh/radamsa 是同一上游的别名路径，2026-09 已转为
# 非公开（匿名 302 → sign_in，API 404）；v0.7 tag 的权威可取发行物在
# akihe/radamsa（Homebrew homebrew-core Formula/r/radamsa.rb 同样锚定该仓库）。
#
# 三份源均于 2026-09-22 实机下载并核验 sha256：
#   - 主源 tarball 与 Homebrew formula 声明值逐字符一致
#     （d9a6981b…f622a2）；tag 实核：v0.7 → commit 40d5dec416fb5277dbbd72c04b82ba2ae039778a。
#   - ol-0.2.2.c.gz 与 Homebrew formula 的 `resource "ol.c"` 声明值逐字符一致
#     （fca85dae…aefc55c）；该 URL 即上游 Makefile 的 OWLURL（上游自己 pin 的
#     bootstrap 编译器发行物）。
#   - hex 归档为 gitlab.com/owl-lisp/hex 仓库归档（上游 Makefile 在构建期
#     `git clone` 的同一仓库；其 main 分支 tip 即 e95ebd38e4f7ef8e3d4e653f432e43ce0a804ca6，
#     2021-01-12 后无新提交，pin tip 与 clone main 等价且可复现）。归档由
#     GitLab 按需生成，无第三方 sha256 可交叉核对，取本机下载值。

sources:
  "0.7":
    url: "https://gitlab.com/akihe/radamsa/-/archive/v0.7/radamsa-v0.7.tar.gz"
    sha256: "d9a6981be276cd8dfc02a701829631c5a882451f32c202b73664068d56f622a2"

# Owl Lisp 0.2.2 预编译 C 引导源（上游 Makefile: OWLURL）。构建期
# `cc -o bin/ol` 得到 Scheme→C 生成器，再 `bin/ol -O1 -o radamsa.c rad/main.scm`。
# 以 download() 原件下载（不解包），build() 显式 `gzip -dc` 还原为上游 Makefile
# 使用的文件名 ol.c。
owl_bootstrap:
  "0.7":
    url: "https://haltp.org/files/ol-0.2.2.c.gz"
    sha256: "fca85dae36910108598d8a4a244df7a8c2719e7803ac46d270762ece4aefc55c"

# (lib hex core) 库（rad/digest.scm 的 sha256 digest 依赖）。上游 Makefile 的
# `lib/hex:` 目标在构建期 git clone 该仓库；本配方改为归档预置以消除构建期网络依赖。
# URL 取 GitLab API 归档端点：`-/archive/` Web 端点对非浏览器 UA 实测 403（conan
# 下载器与 curl 均复现），API 端点对两者均 200。两端点解包内容一致、仅顶层目录
# 命名与 gzip 压缩字节不同，故 sha256 以本 URL 实测值为准。
# 仓库 main 分支 tip 即 e95ebd38e4f7ef8e3d4e653f432e43ce0a804ca6（2021-01-12 后
# 无新提交），pin 该 commit 与 clone 默认分支等价且可复现。
hex_library:
  "0.7":
    url: "https://gitlab.com/api/v4/projects/owl-lisp%2Fhex/repository/archive.tar.gz?sha=e95ebd38e4f7ef8e3d4e653f432e43ce0a804ca6"
    sha256: "ad4c2b5b71cf8089da72c0e4b7d4d97e4fb36f43ce10b36e2192be06185cc9a0"

patches:
  # 目标文件 radamsa.c 是**构建期生成物**（bin/ol -o radamsa.c rad/main.scm），
  # 因此本补丁不能由 conan 的常规源码补丁机制在构建开始前套用（届时文件尚不存在），
  # 由 conanfile.py build() 在生成步之后显式 `patch -p1` 应用。登记于此仅为
  # 补丁元数据可见性；重复套用会因 hunk 不匹配而安全失败（上下文行已改写）。
  "0.7":
    - patch_file: "patches/0001-radamsa-do_poll-ohos-chardev-writable.patch"
      patch_description: "OHOS 字符设备（/dev/null、/dev/zero）poll/select 永不报告写就绪，Owl Lisp VM 无限等待导致 stdout 重定向 /dev/null 时挂死；写集中的字符设备 fd 直接视为可写"
      patch_type: "portability"
      patch_source: "本地移植（OHOS 平台缺陷绕行；上游 Linux/macOS 不受影响）"
