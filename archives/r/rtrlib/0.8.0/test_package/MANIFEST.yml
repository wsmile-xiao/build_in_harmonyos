# test_package/MANIFEST.yml — rtrlib 0.8.0
# 上游测试盘点方法：读取上游 tests/ 目录顶层源码文件，共 9 项
# （其中 test_pfx_locks.c 上游仅构建、ADD_TEST 已注释未注册），
# 与 tests/CMakeLists.txt 的 ADD_TEST 注册项（8 项）一致。

package: rtrlib/0.8.0
homepage: "https://github.com/rtrlib/rtrlib"

# 上游测试命令（conanfile.py build() 中真实执行）
upstream_check_command: "cmake -S . -B build && cmake --build build && ctest --test-dir build"
upstream_test_in_build: true
upstream_test_command: "ctest -E \"live_validation|dynamic_groups\" --output-on-failure"

# 上游实际测试程序：共 9 项（按 tests/ 目录源码文件盘点）
# 离线真机实际执行 6 项（2 项在线用例用 -E 排除）；test_pfx_locks 上游仅构建未注册，不纳入执行。
upstream_tests:
  - file: tests/test_pfx.c
    source: rtrlib-0.8.0/tests/test_pfx.c
    description: "pfx 表增删查与合法性校验（含约 19 万条记录的批量用例）"
    command: "./test_pfx"
  - file: tests/test_trie.c
    source: rtrlib-0.8.0/tests/test_trie.c
    description: "trie 前缀树插入/删除/查找"
    command: "./test_trie"
  - file: tests/test_pfx_locks.c
    source: rtrlib-0.8.0/tests/test_pfx_locks.c
    description: "pfx 表并发锁（上游仅构建、ADD_TEST 已注释未注册，不纳入 ctest 执行）"
    command: ""
  - file: tests/test_ht_spkitable.c
    source: rtrlib-0.8.0/tests/test_ht_spkitable.c
    description: "SPKI 哈希表基本操作"
    command: "./test_ht_spkitable"
  - file: tests/test_ht_spkitable_locks.c
    source: rtrlib-0.8.0/tests/test_ht_spkitable_locks.c
    description: "SPKI 哈希表并发锁"
    command: "./test_ht_spkitable_locks"
  - file: tests/test_live_validation.c
    source: rtrlib-0.8.0/tests/test_live_validation.c
    description: "在线校验（需联网访问公网 RPKI 缓存；离线环境 -E 排除，未执行）"
    command: "./test_live_validation"
  - file: tests/test_ipaddr.c
    source: rtrlib-0.8.0/tests/test_ipaddr.c
    description: "IP 地址解析与转换"
    command: "./test_ipaddr"
  - file: tests/test_getbits.c
    source: rtrlib-0.8.0/tests/test_getbits.c
    description: "位操作工具函数"
    command: "./test_getbits"
  - file: tests/test_dynamic_groups.c
    source: rtrlib-0.8.0/tests/test_dynamic_groups.c
    description: "RTR 管理器动态分组（硬编码连接公网 RPKI 缓存等待同步；离线环境 -E 排除，未执行）"
    command: "./test_dynamic_groups"

# test_package 中的消费者测试（链接已安装的 librtr 真实调用 API）
test_package_tests:
  - file: test_pfx_validation.c
    description: "离线 pfx 表增/查/删全流程（IPv4 + IPv6，共 19 项检查）"
    command: "./test_pfx_validation"
  - file: test_version_utils.c
    description: "版本宏与 IP 解析/格式化/比较工具（共 11 项检查）"
    command: "./test_version_utils"

# test_package 断言总数（两处 CHECK 宏计数之和：19 + 11）
assertion_count: 30
