# 软件级 manifest
# 文件位置: archives/r/rtrlib/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: rtrlib
display: "rtrlib"
description: "轻量级 C 语言 RPKI/RTR 协议客户端库，支持前缀源验证"
category: network
homepage: "https://github.com/rtrlib/rtrlib"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "SSH 传输默认关闭（libssh 在制品仓尚未发布，按 R36 不引入未发布依赖）"
    - "上游 test_live_validation 需联网访问公网 RPKI 缓存，离线环境用 ctest -E 排除"
    - "CMAKE_SYSTEM_NAME 映射为 Linux（仓库内同类 C 网络库既有做法）"
  common_dependencies: []

versions:
  "0.8.0":
    status: built
    build_date: "2026-09-15"
    conan_ref: "rtrlib/0.8.0"
