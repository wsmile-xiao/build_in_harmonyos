# test_package/MANIFEST.yml
package: rpm/6.0.2
homepage: "https://rpm.org"

upstream_check_command: "ctest -N"

upstream_test_in_build: false
upstream_test_command: ""

# 上游测试使用 ctest 框架 (tests/ 目录), 但 ENABLE_TESTSUITE=OFF 未构建运行
upstream_tests: []

test_package_tests:
  - file: test_rpm.c
    description: "消费者测试: 验证 librpm 可链接且 API 可调用"
    command: "./test_rpm"

assertion_count: 1
