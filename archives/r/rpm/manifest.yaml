# 软件级 manifest
# 文件位置: archives/r/rpm/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: rpm
display: "RPM"
description: "The RPM Package Manager — 构建、安装和管理 RPM 格式软件包"
category: system
homepage: "https://rpm.org"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建, 产出 librpm/librpmio/librpmbuild/librpmsign 动态库及 rpm 命令行工具"
    - "通过补丁将 libmagic 从必需依赖改为可选, 兼容缺少 magic 库的平台"
    - "GLOB_BRACE 条件编译守卫, 兼容缺少 brace expansion 支持的平台"
    - "禁用 SELinux/DBus/Audit/ACL/CAP 等非必要模块, 启用 OpenSSL/Zstd/LZMA 核心功能"
    - "需设置 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64"
  common_dependencies:
    - popt
    - zlib
    - bzip2
    - sqlite3
    - xz
    - zstd
    - readline
    - openssl
    - libarchive
    - lua

versions:
  "6.0.2":
    status: built
    build_date: 2026-07-24
