version: "2026.03.6"
software: "rdkit"
status: published
build_date: "2026-09-01"
build_system: cmake

source:
  url: "https://github.com/rdkit/rdkit/archive/refs/tags/Release_2026_03_6.atr.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DRDK_BUILD_PYTHON_WRAPPERS=OFF"
    - "-DRDK_BUILD_CPP_TESTS=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DRDK_INSTALL_INTREE=OFF"
  dependencies:
    - "boost/1.91.0.1"
    - "eigen/3.4.1"
    - "freetype/2.14.3"
    - "libpng/1.6.58.1"
    - "zlib/1.3.1.1"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMAKE_SYSTEM_NAME=Linux needed for OHOS (E092)"
  - "RDK_BUILD_PYTHON_WRAPPERS=OFF to disable Python bindings"
  - "RDK_BUILD_INCHI_SUPPORT=OFF (InChI external code not available)"
