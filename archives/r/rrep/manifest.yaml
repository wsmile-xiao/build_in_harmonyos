software: rrep
display: "rrep"
description: "Replace strings with regular expressions in files and directories"
category: utility
homepage: "https://sourceforge.net/projects/rrep/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools CLI tool, single binary (bin/rrep), zero external C library dependencies (bundled gnulib, --disable-nls)"
    - "config.guess 2022-01-09 has no HarmonyOS branch: patch adds *:HarmonyOS mapping to aarch64-unknown-linux-ohos"
    - "config.sub has no linux-ohos kernel-os validation: patch adds linux-ohos to the allow list"
    - "autoconf 2.71 config.status uses umask 077 mktemp dir which is unwritable on HMDFS (E114): patch drops umask"
    - "OHOS has no makeinfo: MAKEINFO=true skips doc regeneration"
  common_dependencies: []

versions:
  "1.3.7":
    status: built
    build_date: "2026-10-03"
    conan_ref: "rrep/1.3.7"
