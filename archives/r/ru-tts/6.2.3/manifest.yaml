version: "6.2.3"
software: ru-tts
status: built
build_date: "2026-09-29"
build_system: autotools

source:
  url: "https://github.com/poretsky/ru_tts/archive/refs/tags/v6.2.3.tar.gz"
  sha256: "0276e76356acd6550f78f987c87b9bb005d0d0ef6eb2d4095cdda21d2006648d"
  tar_format: tar.gz

build:
  system: custom
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-src-ru_tts.c.patch"
    description: "Store getopt() results in int so the option loop terminates when plain char is unsigned on AArch64."

knowledge_gained:
  - "ru-tts 6.2.3 ships a C library, a native CLI, and a shell wrapper; the optional RuLex dictionary is loaded at runtime and is not a build dependency."
  - "On AArch64 OHOS, plain char is unsigned, so storing getopt()'s -1 sentinel in char makes the CLI option loop non-terminating."
  - "A direct Clang build avoids obsolete Autotools host probing while preserving the upstream ABI, SONAME, symbol version script, CLI, wrapper, and manual pages."
