# 编译中学到的知识
knowledge_gained:
  - "clang 15+ 弃用 __has_trivial_copy；clang 定义了 __GNUC__=4 会误入 g++<5 兼容分支，需用 !defined(__clang__) 排除，改用 std::is_trivially_copyable"
  - "header-only 库的 test_package 源文件必须用 .cpp 后缀（CMake 按扩展名判定语言，.c 内容含 C++ 语法会触发 Cannot determine link language）"
  - "conan2 copy() 的 src/dst 应使用 os.path.join(source_folder/package_folder) 绝对路径，pattern 用文件名即可"

