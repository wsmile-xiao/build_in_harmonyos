# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: robin-hood-hashing/3.11.5
homepage: "https://github.com/martinus/robin-hood-hashing"

# 上游测试命令 (cmake 构建单一 rh 可执行，doctest 2.4.6 驱动)
upstream_check_command: "cmake .. && make rh && ./rh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (127 test cases / 2,164,686 assertions, 0 failed)
upstream_tests:
  - file: src/test/unit/main.cpp
    source: robin-hood-hashing-3.11.5/src/test/unit/main.cpp
    description: "robin-hood-hashing 上游单元测试主入口 (doctest)"
    command: "./rh"
    assertion_count: 2164686

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：实际 include robin_hood.h 并验证 unordered_map/unordered_set API"
    command: "./test_robin-hood-hashing"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2164686
