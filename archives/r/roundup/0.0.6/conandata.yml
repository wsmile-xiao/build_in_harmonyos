    patch_description: "edge 测试用不存在目录替代空 $PATH（mksh 空 PATH 回退默认搜索路径，bash 仅搜当前目录）"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-test.sh.patch"
    patch_description: "新增鸿蒙消费者可行性测试 plan（PATH 安装/版本探测/mktemp//bin/sh 四项检查）"
    patch_type: "test"
  - patch_file: "patches/0003-roundup.sh.patch"
    patch_description: "mksh 兼容：set -E 子壳探测（mksh 特殊内建致命错误）、信号发射前恢复 $PATH（mksh 无 printf 内建）、沙箱清空预置别名（alias 查找先于 PATH）、对齐 ROUNDUP_VERSION 至 0.0.6"
    patch_type: "portability"
