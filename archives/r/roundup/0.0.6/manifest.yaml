knowledge_gained:
  - "OHOS /bin/sh 为 mksh R59：`set -E`（bash errtrace）属特殊内建致命错误会终止 shell，需子壳探测降级；mksh 支持 ERR trap"
  - "mksh 无 printf 内建（bash 有）：test plan 置空/破坏 $PATH 后依赖外部 printf 的信号发射会失败，运行器需备份/恢复自身 PATH"
  - "OHOS mksh 预置大量 applet 别名（alias 查找先于 PATH），shell 工具沙箱需 unalias -a 隔离"
  - "mksh 对空 $PATH 回退默认搜索路径 /bin:/usr/bin（bash 仅搜当前目录），可移植的『无 PATH』表达为 PATH=/nonexistent"

