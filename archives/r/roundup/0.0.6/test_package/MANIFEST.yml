package: roundup/0.0.6
homepage: "https://bmizerany.github.io/roundup"

upstream_check_command: "./roundup（自举运行 *-test.sh，OHOS /bin/sh=mksh R59 实测）"
upstream_test_in_build: true
upstream_test_command: "./roundup"

upstream_tests:
  - name: edge-test.sh
    command: "./roundup edge-test.sh"
    expected: "3/3 pass"
  - name: ohos-test.sh（本次适配新增的鸿蒙消费者用例）
    command: "./roundup ohos-test.sh"
    expected: "4/4 pass"
  - name: roundup-1-test.sh
    command: "./roundup roundup-1-test.sh"
    expected: "3/3 pass"
  - name: roundup-5-test.sh
    command: "./roundup roundup-5-test.sh"
    expected: "5 pass / 3 fail（it_fails、it_runs_after_if_a_test_fails_part_1、it_outputs_the_return_code_7 为上游设计性失败，驱动 roundup-1 的 exit code 2 断言）"

test_package_tests:
  - file: ohos-test.sh
