# manifest.yaml - rdate 软件级元数据
software: rdate
display: "rdate (openrdate)"
description: "从 RFC 868 TCP 或 SNTP(NTP) 服务器查询/设置系统时间的命令行工具（Debian rdate 包的上游 openrdate）"
category: "system"
homepage: "https://github.com/resurrecting-open-source-projects/openrdate"
license: GPL-2.0-or-later
build_system: "autotools (autoreconf -fi；tarball 未带生成版 configure)"

ohos_adaptation:
  key_points:
    - "libbsd 假依赖：configure.ac 硬检 bsd/stdlib.h 仅为 ntp.c 单点 arc4random()；OHOS musl 的 stdlib.h 已内建 arc4random（链接探针 rc=0），补丁 0001 改直连标准头并移除硬检"
    - "tarball 未带生成版 configure，构建期先 autoreconf -fi（E386 下以 env -u CONFIG_SHELL SHELL=/bin/sh 路由）"
    - "configure umask 077 在 HMDFS 需移除（E011/E114 家族）"
    - "aux 脚本代际差异：宿主 automake 1.16.5 的 2023 版 config.guess/config.sub 原生识别 aarch64-unknown-linux-ohos，但 CI worker 无 automake ⇒ 配方按 E178 tool_requires ohpcd 唯一在册的 automake/1.18，其 2024-07-27 版 aux 件无 HarmonyOS 分支，故按 E007 在 autoreconf 之后补成对补丁（否则 configure 报 cannot guess build type）"

versions:
  "1.11":
    status: built
    build_date: "2026-09-25"
    source_url: "https://deb.debian.org/debian/pool/main/r/rdate/rdate_1.11.orig.tar.gz"
    source_sha256: "$SHA"
