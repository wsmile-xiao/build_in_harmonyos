# conandata.yml — rdate 1.11
#
# Debian pool orig tarball of openrdate 1.11 (upstream:
# https://github.com/resurrecting-open-source-projects/openrdate).
# sha256 measured on-device against the Debian index Checksums-Sha256.
# NOTE (CI source-fetch risk, pre-declared): the CI mirror-rewrite step
# only proxies github.com URLs; deb.debian.org is fetched directly.

sources:
  url: "https://deb.debian.org/debian/pool/main/r/rdate/rdate_1.11.orig.tar.gz"
  sha256: "931c4ad143421e516bfd8c964a6e125ec193d5f1e524262a8a6a011181df4721"

patches:
  - patch_file: "patches/0001-musl-builtin-arc4random-drop-bsd-stdlib-header.patch"
    strip: 1
    patch_description: "Drop the libbsd dependency: configure.ac hard-required bsd/stdlib.h (exit -1) and ntp.c included it solely for one arc4random() call (src/ntp.c:287); OHOS musl provides arc4random() directly from stdlib.h (on-device clang link probe rc=0). The bsd/stdlib.h include becomes <sys/types.h> for the u_char typedefs ntp.c uses throughout: openrdate defines no feature-test macro of its own, so musl auto-defaults _BSD_SOURCE and the typedefs are visible (verified by compiling ntp.c on-device); glibc exposes them the same way. src/Makefile.am's hardcoded rdate_LDADD -lbsd is dropped with it (nothing links against libbsd any more)"
    patch_type: "portability"
  - patch_file: "patches/0002-adjtime-shim-via-adjtimex-for-musl.patch"
    strip: 1
    patch_description: "musl has adjtimex(2) but no adjtime(3): rdate.c's -a (slow adjustment) mode calls adjtime and the link fails with undefined symbol adjtime (ld.lld suggests adjtimex; measured on-device). Add the thin adjtime shim in terms of adjtimex — the same layering glibc uses internally — guarded by !HAVE_ADJTIME so a libc that provides the real one can opt out"
    patch_type: "portability"
