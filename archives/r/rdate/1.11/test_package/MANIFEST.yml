package: rdate/1.11
homepage: "https://github.com/resurrecting-open-source-projects/openrdate"

upstream_check_command: "无——上游 Makefile.am 未接线任何 TESTS/check 目标（仅 SUBDIRS=src + man 文档）"
upstream_test_in_build: false
upstream_test_command: "无"

upstream_tests: []

test_package_tests:
  - file: test_rdate.sh
    description: "消费者测试：以使用者身份真实执行打包产物 bin/rdate，4 组断言——1) 打包二进制在 runenv PATH 可解析；2) 无参调用打印 Usage 且非零退出；3) 非法选项 -Z 被拒绝（非零退出）；4) 对闭端口 127.0.0.1:1 的 RFC868 查询干净失败（rc=1 且报 Could not connect socket: Connection refused，真实走通 getaddrinfo/socket/connect 错误路径）"
