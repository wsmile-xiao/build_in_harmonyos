knowledge_gained:
  - refl-cpp 是 header-only C++17 反射库，根目录单头 refl.hpp，无构建系统
  - header-only 库用 conanfile-headeronly 模板：package_type=header-library、copy refl.hpp+LICENSE、package_info 清空 bindirs/libdirs
  - conan-verify G1 要求 conanfile.py 含 build()/export_sources()/apply_conandata_patches（header-only 可用 no-op build() 通过）
