# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: refl-cpp/0.9.1
homepage: "https://github.com/veselink1/refl-cpp"

# 上游测试命令: refl-cpp 为单头文件库（无 ctest/configure），
# 上游唯一测试程序为 test/refl.tests.cpp（281 行，111 处 assert），
# 通过手工编译运行验证。
upstream_check_command: "clang++ -std=c++17 -I. test/refl.tests.cpp -o refl_tests && ./refl_tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/refl.tests.cpp
    source: refl-cpp-0.9.1/test/refl.tests.cpp
    description: "上游反射库功能测试（字段/函数/模板/代理反射，111 处 assert）"
    command: "./refl_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：实际 include refl.hpp 并调用字段反射与运行时迭代 API"
    command: "./test_refl-cpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 114