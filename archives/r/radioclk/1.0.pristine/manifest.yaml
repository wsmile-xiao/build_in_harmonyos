# 版本级 manifest
# 文件位置: archives/r/radioclk/1.0.pristine/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.pristine"

# 软件名
software: radioclk

# 许可证（源码头声明 "either version 2, or (at your option) any later version"）
license: GPL-2.0-or-later

# 编译状态
# published | built | failed | archived
# 说明: 真机 shadow CI 全绿（2026-10-02 r3）：conan create 成功、
# test_package 5 组断言全过、L0/L1/L2/L4/L5 全 pass、L1e 反向验证确认；
# 待 submit 后升级 published
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-02"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游作者站点 buzzard.org.uk 已停泊（Debian watch 文件同判），
  # 采用 Debian pool 的 pristine orig tarball（无 Debian 修改，
  # 仓库先例：cgvg / unzoo / libbrahe 等 R39 路线）
  url: "https://deb.debian.org/debian/pool/main/r/radioclk/radioclk_1.0.pristine.orig.tar.gz"
  sha256: "8C63F60ECA6CC5F2999B5CE55E7DD5CFE65812FB3DDBB33E8206AC7E659CF74C"
  tar_format: tar.gz
  # orig tarball 内容（strip_root 后）：Makefile, radioclkd.c,
  # refclock_shm.c, radioclkd.1, README, COPYING, ChangeLog (+ debian/)
  # 无 test/ 目录，上游无测试套件

# ============================================================
# 构建配置
# ============================================================

build:
  # 上游 Makefile：单翻译单元 radioclkd.c -> radioclkd；
  # install 目标硬编码 /usr/bin/install 与 /sbin 布局（OHOS 无
  # install 命令，E098），故配方只驱动 make radioclkd 编译目标，
  # 安装由 package() 自行 copy 完成
  system: makefile
  configure_options:
    - "make -j1 radioclkd CC=<conf tools.build:compiler_executables.c>（命令行覆盖 Makefile 的 /usr/bin/gcc 硬编码；R33 从 Conan conf 取编译器）"
    - "C 标准：上游默认（C89 + GNU 扩展），无 -std 覆盖"
    - "不构建 refclock_shm.c：它是 ntp 发行版的替换文件，非本包产物"
  dependencies: []
  cc: clang

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本包无 .patch 文件，源码可移植性修改在
# conanfile.py source() 内以 replace_in_file 完成，见 notes.md）
patches_applied: []

# 源码修改清单
source_modifications:
  - "radioclkd.c: #include<termio.h>（musl 无此遗留头文件）替换为 #include<termios.h> + #include<sys/ioctl.h>——上游靠 glibc 头文件链隐式获得 TIOCM_* modem 线宏与 ioctl() 原型，musl 把它们放在 <termios.h>（r2 真机实测 19 个 undeclared identifier 编译错）"
  - "radioclkd.c: 增加 #ifndef TIOCMIWAIT 回退定义 0x5452（该 ioctl 号是 x86 侧的，aarch64 的 asm-generic/musl 头不定义；运行期若内核串口驱动拒绝该 ioctl，WaitOnSerialChange() 返回 -1，上游文档化的 -p 轮询模式为降级路径）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 buzzard.org.uk 已停泊，Debian pool 的 radioclk_1.0.pristine.orig.tar.gz 是权威 pristine 源（R39 先例）"
  - "musl 无遗留 <termio.h>：本例为死包含，直接删除即可，不需要换 termios（代码未用任何终端属性 API）"
  - "TIOCMIWAIT 不在 asm-generic ioctl 表中（x86 专属）：#ifndef 回退定义保证 aarch64/musl 可编译；功能降级走上游 -p 轮询模式"
  - "上游 Makefile 的 CC 用 = 赋值硬编码 /usr/bin/gcc，可用 make 命令行变量覆盖；install 目标依赖 /usr/bin/install（OHOS 缺失，E098）与 /sbin 布局，安装逻辑必须在配方 package() 中替代"
  - "radioclk 是应用包（ntp refclock 守护进程），test_package 走 --version/--help/无参数/坏设备四条无硬件确定性路径，不触碰真实串口与 SysV shm"

# ============================================================
# 测试计数（与 test_package/MANIFEST.yml 口径一致）
# ============================================================

test_counting:
  upstream_collected: 0
  upstream_passed_on_ohos: 0
  upstream_note: "上游无测试套件（无 test/ 目录、无 make check）"
  test_package_case_count: 5
  test_package_assertion_count: 10
