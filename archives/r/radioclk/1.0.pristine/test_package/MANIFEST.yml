# test_package/MANIFEST.yml — radioclk/1.0.pristine
package: radioclk/1.0.pristine
homepage: "http://www.buzzard.org.uk/jonathan/radioclock.html"

# 上游盘点：orig tarball 仅含 Makefile / radioclkd.c / refclock_shm.c /
# README / COPYING / radioclkd.1 / ChangeLog，无 test/ tests/ 目录，
# 无 make check / ctest。上游测试 0/0 (N/A)。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 自带测试（消费者视角验证安装后的包）：
# radioclkd 是应用包，无需编译消费者代码；直接运行安装后的二进制，
# 只走确定性的无硬件路径（参数解析、版本/用法输出、两个早期错误路径），
# 不触碰真实串口、SysV 共享内存或系统日志。
test_package_tests:
  - file: test_radioclk.py
    description: "消费者测试：--version/-v 版本横幅与退出码 0；--help 用法横幅与退出码 0；无参数错误诊断与退出码 1；不存在设备路径的 open 失败诊断与退出码 1"
    command: "python3 test_radioclk.py <bindir>/radioclkd"

# 计数口径：上游 0 个测试；test_package 5 组共 10 个断言
test_counting:
  upstream_independent_total: 0
  integration_independent_total: 0
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 5
assertion_count: 10
