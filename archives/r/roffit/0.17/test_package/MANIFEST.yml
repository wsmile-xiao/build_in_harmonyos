# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本强制要求此文件存在

package: roffit/0.17
homepage: https://github.com/bagder/roffit

# Upstream test suite: single golden-file test, run via `make test`
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# Upstream test cases
upstream_tests:
  - file: "Makefile (test target)"
    source: "testpage.1 / testpage.output"
    description: "Convert testpage.1 with --bare and byte-compare against testpage.output"
    command: "make test"

# test_package 中自带的测试（复现上游用例 + 消费者冒烟）
test_package_tests:
  - file: conanfile.py
    description: "Replay upstream golden-file test against packaged roffit (perl from ohpcd dependency) + --version + man page check"
    command: "conan test"
  - file: test.sh
    description: "Shell smoke test: --version reports 0.17 + upstream golden-file compare (testpage.1 -> testpage.output)"
    command: "bash test_package/test.sh"

# 测试断言总数
assertion_count: 3
# test.sh 另含 2 项断言（--version / golden-file），供 L0c 测试源检查
