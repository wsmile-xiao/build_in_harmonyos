software: redis
version: 7.4.2
status: partial
build_system: makefile
created_at: 2026-04-27
source_url: https://download.redis.io/releases/redis-7.4.2.tar.gz
configure_options:
  - MALLOC=libc
patches_applied:
  - 0001-setproctitle-musl-compat.patch
  - 0002-server-h-musl-compat.patch
  - 0003-musl-compat-files.patch
knowledge_gained:
  - musl 不支持 pthread_cancel、pthread_setcancelstate、pthread_setcanceltype 函数，需要提供 stub 实现
  - program_invocation_name 和 program_invocation_short_name 是 glibc 特有变量，musl 不提供，需要用静态变量替代
binaries:
  - redis-server
  - redis-cli
  - redis-benchmark
  - redis-sentinel (symlink to redis-server)
  - redis-check-rdb (symlink to redis-server)
  - redis-check-aof (symlink to redis-server)
notes:
  - Redis 7.4.2 使用 Makefile 构建，无 configure 步骤
  - 使用 MALLOC=libc 避免 jemalloc 在 musl 上可能的问题
  - 需要新增 musl-compat.h 和 musl-compat.c 文件
  - 需要在 Makefile 中添加 musl-compat.o 到 REDIS_SERVER_OBJ