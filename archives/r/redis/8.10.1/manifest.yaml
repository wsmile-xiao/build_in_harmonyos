software: redis
# 版本级 manifest
# 文件位置: archives/r/redis/8.10.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.10.1"

# 构建系统类型（顶级字段，用于验证）
build_system: makefile

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/redis/redis/archive/refs/tags/8.10.1.tar.gz"

  # 源码校验和
  sha256: "b0f0cf1927b6ff8d5a523eb7f97c5bcaafbfbef96ffa23f643494bd4af527eee"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # redis 使用 make 直接编译，不需要 configure

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # redis 依赖内置在 deps/ 目录中

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-threads_mngr-atomic-init.patch"
- "0002-setproctitle-musl-compat.patch"
- "0003-makefile-pthread-compat.patch"
- "0004-pthread_compat-stub.patch"
- "0005-disable-unixsocket-ohos.patch"
# 补丁说明：
# 0001: C11 atomic 变量无法静态初始化为 NULL，改为动态初始化
# 0002: musl libc 不提供 GNU 扩展 program_invocation_name
# 0003: 将 pthread_compat.o 加入编译目标（8.10.1 版本更新了对象列表）
# 0004: 提供 pthread_cancel 等函数的 stub 实现（E085）
# 0005: 禁用 Unix domain socket（OHOS HMMAC 安全策略阻止 S_IFSOCK 创建）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "E085: musl libc 不实现 pthread_cancel 等 POSIX 线程取消 API，需要提供 stub 实现"
- "C11 _Atomic 变量无法静态初始化为非编译时常量（如 NULL），需要动态初始化"
- "GNU libc 扩展 program_invocation_name/program_invocation_short_name 在 musl 中不存在"
- "redis 8.10.1 相比 8.6.0 新增了 t_array.o sparsearray.o gcra.o vector.o fast_float_strtod.o client_comp.o 等对象文件"
- "Makefile 补丁需要更新以匹配 8.10.1 的 REDIS_SERVER_OBJ 列表"
- "make install 也需要传递 CC=clang，否则会触发重新编译时使用默认 cc"
- "OHOS HMMAC 安全策略阻止用户进程创建 Unix domain socket (S_IFSOCK)，bind() 返回 EPERM"
- "tcl/8.6.16 制品仓预编译包可在 OHOS 上运行 Redis 上游 Tcl 测试套件"
- "上游测试 8 个单元 1132 个用例全部通过，证明 musl 兼容性补丁不影响核心功能"
