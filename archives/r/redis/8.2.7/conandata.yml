sources:
  url: "https://github.com/redis/redis/archive/refs/tags/8.2.7.tar.gz"
  sha256: "4b5b129565569a1564cf0196e17deff23298980e81deced3266cda58180d6506"

patches:
  - patch_file: "patches/0001-fix-atomic-callback-initialization.patch"
    patch_description: "Use implicit zero initialization for the atomic callback pointer"
    patch_type: "portability"
  - patch_file: "patches/0002-guard-glibc-process-name-globals.patch"
    patch_description: "Guard glibc-only process-name globals using libc feature detection"
    patch_type: "portability"
  - patch_file: "patches/0003-add-ohos-pthread-cancel-compat.patch"
    patch_description: "Provide non-glibc Linux pthread cancellation fallbacks without reporting false cancellation success"
    patch_type: "portability"
  - patch_file: "patches/0004-run-release-header-script-through-sh.patch"
    patch_description: "Run the release header generator through sh without requiring a directly executable source file"
    patch_type: "portability"
  - patch_file: "patches/0005-run-test-scripts-through-sh.patch"
    patch_description: "Run all upstream Tcl suite launchers through sh on HarmonyFS"
    patch_type: "portability"
  - patch_file: "patches/0006-configurable-test-temp-root.patch"
    patch_description: "Allow Redis Tcl tests to use an executable OHOS user-cache temporary root"
    patch_type: "portability"
  - patch_file: "patches/0007-use-path-env-in-tests.patch"
    patch_description: "Resolve env from PATH instead of assuming a directly executable /usr/bin/env"
    patch_type: "portability"
  - patch_file: "patches/0008-account-for-unavailable-process-suspension.patch"
    patch_description: "Explicitly account for tests requiring unavailable process suspension semantics"
    patch_type: "test"
  - patch_file: "patches/0009-return-after-release-mode-assertions.patch"
    patch_description: "Return defensively after assertions that compile out in release mode"
    patch_type: "portability"
  - patch_file: "patches/0010-return-from-module-test-errno-handler.patch"
    patch_description: "Return defensively from the module test errno handler after its assertion"
    patch_type: "test"
