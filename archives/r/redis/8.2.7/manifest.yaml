knowledge_gained:
  - "Redis 8.2.7 uses a raw Makefile and vendors its required runtime dependencies."
  - "MALLOC=libc removes the jemalloc build path for the minimal OHOS package."
  - "Unsupported pthread cancellation must return ENOSYS rather than false success."
  - "HarmonyFS may require explicit shell execution and a trusted system install tool."
  - "HarmonyFS package symlink failures can require real signed command files."
  - "Target integration tests must run after signing and before packaging the same binaries."
  - "Unavailable process suspension must be accounted per test with visible totals and a fail-closed helper guard."
