    description: "Default Tcl integration harness; part of the 212-file upstream Tcl tree"
    command: "sh ./runtest"
  - file: runtest-moduleapi
    source: redis-8.2.7/runtest-moduleapi
    description: "Redis Module API integration suite"
    command: "sh ./runtest-moduleapi"
  - file: tests/sentinel/run.tcl
    source: redis-8.2.7/tests/sentinel/run.tcl
    description: "Redis Sentinel integration suite"
    command: "sh ./runtest-sentinel"
  - file: tests/cluster/run.tcl
    source: redis-8.2.7/tests/cluster/run.tcl
    description: "Redis Cluster integration suite"
    command: "sh ./runtest-cluster"

test_package_tests:
  - file: test.sh
    description: "Exercise packaged commands across data types, transactions, scripting, ACL, expiration, blocking and pub/sub operations, RDB/AOF recovery and corruption checks, replication acknowledgement and controlled failover, Sentinel promotion, Cluster failure/recovery, benchmark load, and invalid-input paths"
