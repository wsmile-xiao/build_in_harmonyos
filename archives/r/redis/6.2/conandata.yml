sources:
  url: "https://download.redis.io/releases/redis-6.2.0.tar.gz"
  sha256: "67d624c25d962bd68aff8812a135df85bad07556b8825f3bcd5b522a9932dbca"

patches:
  - patch_file: "patches/0001-ohos-pthread-cancellation-stubs.patch"
    patch_description: "Provide non-glibc Linux pthread cancellation fallbacks without reporting false cancellation success"
    patch_type: "portability"
  - patch_file: "patches/0002-run-test-scripts-through-sh.patch"
    patch_description: "Run release generation and the Tcl test launcher through sh"
    patch_type: "portability"
  - patch_file: "patches/0003-avoid-sizeof-in-preprocessor-condition.patch"
    patch_description: "Make the libc allocation overflow assertion valid on non-glibc platforms"
    patch_type: "portability"
  - patch_file: "patches/0004-make-libatomic-optional.patch"
    patch_description: "Allow OHOS AArch64 builds to use compiler-native atomics without an external libatomic"
    patch_type: "portability"
  - patch_file: "patches/0005-configurable-test-temp-root.patch"
    patch_description: "Allow OHOS tests to use a short temporary root for Unix sockets"
    patch_type: "portability"
  - patch_file: "patches/0006-ohos-read-uid-from-proc.patch"
    patch_description: "Read the numeric UID from procfs when OHOS cannot map the current user through id"
    patch_type: "portability"
