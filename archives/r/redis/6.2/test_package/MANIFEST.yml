package: redis/6.2
homepage: "https://redis.io/"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

upstream_tests:
  - file: tests/test_helper.tcl
    source: redis-6.2.0/tests/test_helper.tcl
    description: "Redis Tcl integration suite covering 138 Tcl files"
    command: "sh ./runtest"

test_package_tests:
  - file: test.sh
    description: "Start the packaged server and verify version, PING, SET, GET, and DEL through packaged redis-cli"
    command: "bash test.sh"

assertion_count: 6
