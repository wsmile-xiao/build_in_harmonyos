# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: hsluv-c/1.0.0
homepage: "https://github.com/hsluv/hsluv-c"

# 上游测试命令 (CTest 注册的唯一测试目标)
upstream_check_command: "ctest --test-dir build -V"

# conanfile.py build() 方法中已集成上游测试 (HSLUV_C_TESTS=ON + cmake.test())
upstream_test_in_build: true
upstream_test_command: "ctest -V (via conanfile build())"

# 上游实际运行的测试程序（acutest：4 个独立 TEST_LIST 用例）
upstream_tests:
  - file: tests/test_hsluv.c
    source: hsluv-c-1.0.0/tests/test_hsluv.c
    description: "acutest 框架 4 个独立用例：hsluv2rgb / rgb2hsluv / hpluv2rgb / rgb2hpluv，各遍历 4096 条官方快照"
    command: "./test_hsluv"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_hsluv_consumer.c
    description: "消费者测试：rgb2hsluv/hsluv2rgb 与官方 #ff0000 参考值对照 + HPLuv 往返"
    command: "./test_hsluv_consumer"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4096
