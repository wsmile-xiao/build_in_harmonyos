# 版本级 manifest — hsluv-c 1.0.0

# ============================================================
# 必须字段
# ============================================================
version: "1.0.0"
software: "hsluv-c"
status: built
build_date: "2026-09-27"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://github.com/hsluv/hsluv-c/archive/refs/tags/1.0.0.tar.gz"
  sha256: "bd37d8318aeacb4fd25481b70e0d5b628055b018b90a8e3ff88a741c8b629778"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: cmake
  configure_options:
    - "-DHSLUV_C_TESTS=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "上游 CMakeLists 声明 cmake_minimum_required(VERSION 3.1)，CMake 4.x 已移除 <3.5 兼容；用 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 在不改上游文件的前提下完成配置"
  - "hsluv-c 为纯 C99 单转换单元静态库，无任何外部依赖（仅 libm），acutest 框架 4 独立用例 × 4096 官方快照"
