# 软件级 manifest — hsluv-c
# 遵循 ARCHIVE-SPEC v2.0

software: hsluv-c
display: "hsluv-c"
description: "HSLuv / HPLuv 人眼友好 HSL 色彩空间转换库（纯 C99 单转换单元，零依赖）"
category: graphics
homepage: "https://github.com/hsluv/hsluv-c"
license: MIT
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 C99 静态库（上游 add_library STATIC，无 install 规则），配方手动打包 hsluv.h + libhsluv-c.a（R26 静态交付）"
    - "上游 cmake_minimum_required(VERSION 3.1) 与 CMake 4.x 不兼容：配方 configure 注入 -DCMAKE_POLICY_VERSION_MINIMUM=3.5，不改上游文件（E187/E103 同法，勿用 tc.variables）"
    - "上游测试为 acutest 框架 4 独立用例 × 4096 官方快照（tests/snapshot.h 为生成数据，非独立用例），OHOS clang 15 零告警编译全过"
    - "GitHub 直连超时环境用 ghfast.top 镜像下载官方 tag（E017 同法），conandata 仍写官方 URL，SHA-256 双通道交叉核验一致"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================
versions:
  "1.0.0":
    status: built
    build_date: "2026-09-27"
    patches: 0