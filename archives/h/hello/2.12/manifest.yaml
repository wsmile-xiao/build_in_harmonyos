software: hello
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.12/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.12"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型 (G4 验证必需的顶级字段)
# cmake | autotools | makefile | meson | custom
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/hello-2.12.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（--prefix 由脚本硬编码，此字段留空）
  configure_options: ""

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - file: 0001-Makefile.in.patch
    purpose: "跳过文档构建，注释 info_TEXINFOS 等变量，防止自动生成文档文件补丁"
  - file: 0002-build-aux-config.guess.patch
    purpose: "添加 HarmonyOS 系统识别分支，输出 aarch64-unknown-linux-ohos"
  - file: 0003-build-aux-config.sub.patch
    purpose: "添加 linux-ohos* 到 kernel-os 白名单，支持三元组验证"
  - file: 0004-configure.patch
    purpose: "修改 umask 077 为 umask 022，解决 HMDFS UID 映射导致的临时目录权限问题（E011）"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "config.guess 需要在 HarmonyOS 分支中添加 echo 和 exit，否则会继续执行到后面的错误检测"
  - "config.sub 需要在 kernel-os 白名单中添加 linux-ohos*，否则三元组验证失败"
  - "configure 脚本中的 umask 077 在 HMDFS 上会导致临时目录权限问题（E011），需要改为 umask 022"
  - "makeinfo 缺失会导致文档编译失败，可以通过跳过文档编译（SUBDIRS=lib src）绕过"
  - "gnulib 的替换函数（rpl_optarg等）需要手动编译 getopt.o、getopt1.o、error.o 并重新打包到静态库"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/hello-2.12.orig
  source_work_dir: /storage/Users/currentUser/builds/hello-2.12.work
  source_orig_hash: fc991311ff075ec4
  source_work_hash: 25d7378cd4a4e1f7
  generated_at: '2026-05-21T17:XX:XX'
  patches_count: 4

patch_classification:
  - file: 0001-Makefile.in.patch
    type: manual
    platform_only: true
    guard: 'pending'
  - file: 0002-build-aux-config.guess.patch
    type: auto
    platform_only: true
    guard: 'pending'
  - file: 0003-build-aux-config.sub.patch
    type: auto
    platform_only: true
    guard: 'pending'
  - file: 0004-configure.patch
    type: auto
    platform_only: true
    guard: 'pending'
