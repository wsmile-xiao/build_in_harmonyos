# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hyprwayland-scanner/0.4.0
homepage: "https://github.com/hyprwm/hyprwayland-scanner"

# 上游测试命令：上游无测试套件（CMakeLists 无 add_test/enable_testing）
upstream_check_command: "make"
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序（无独立测试套件，构建即验证编译链接）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_hyprwayland-scanner.sh
    description: "真实消费验证：①bin/hyprwayland-scanner 存在且可执行（1 断言）②传入最小协议 XML 运行扫描器生成 minimal.cpp/minimal.hpp 并校验（2 断言；--help/-h 被工具当 XML 路径解析不可用）③失败区分：仅沙箱 EPERM（Operation not permitted/Permission denied）SKIP，其余失败 FAIL"
    command: "bash test_hyprwayland-scanner.sh <bin_dir>"
  - file: conanfile.py
    description: "验证 bin/hyprwayland-scanner 二进制存在（1 个断言）"
    command: "conan test"

# 测试断言总数：上游无独立测试用例（0），test_package 4 个断言
#（含 1 个运行断言，沙箱 EPERM 时 SKIP 不计失败）
assertion_count: 4
