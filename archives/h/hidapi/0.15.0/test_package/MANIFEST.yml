# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: hidapi/0.15.0
homepage: "https://github.com/libusb/hidapi"

# 上游测试命令：hidapi 上游用 CMake 构建，测试程序为 hidtest/test.c
# 生成 hidtest_hidraw / hidtest_libusb 两个可执行（Linux 平台）
upstream_check_command: "cmake --build . --target hidtest_hidraw hidtest_libusb"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：hidtest/test.c（设备枚举/报告描述符读取，
# 需要真实 USB HID 设备；无头构建环境无法运行，仅编译验证 + 符号解析）
upstream_tests:
  - file: test.c
    source: hidapi-0.15.0/hidtest/test.c
    description: "hidtest：枚举 HID 设备、读取报告描述符（需要真实 USB 设备）"
    command: "./hidtest_libusb"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 hid_version_str/hid_init/hid_enumerate/hid_exit 验证库加载与 API 可调用（容忍无头系统 hid_init 失败）"
    command: "./test_hidapi"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
