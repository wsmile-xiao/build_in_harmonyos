# 版本级 manifest — half 7.2.4 (ROCm release train)
# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-version.yaml

version: "7.2.4"
software: "half"
status: built
build_date: "2026-10-07"
conan_ref: "half/7.2.4"

build_system: "custom"

source:
  url: "https://github.com/ROCm/half/archive/refs/tags/rocm-7.2.4.tar.gz"
  sha256: "8cbe655d3ef19675e953934cf0cb49fdf899459407fbc6848af52282269fc7f9"
  tar_format: tar.gz

build:
  # 上游为 CMake，但 CMakeLists.txt 依赖未发布的 rocm-cmake 模块集，
  # 且 half 本身 header-only 无需编译 —— 采用自包含配方（package_type =
  # header-library，仅安装 include/half/half.hpp + LICENSE.txt）。
  system: custom
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

# 上游测试清点与实测结果（R51；口径：通过率按"实测通过/实测执行"计，不按注册数）
upstream_tests:
  command: "clang++ test/src/test03.cpp && ./test03 ; clang++ -std=c++0x test/src/test11.cpp && ./test11 -fast"
  test_count: 141        # test11.cpp 注册用例数（test03.cpp 为打印式冒烟，0 断言）
  cases_passed: 136
  cases_failed: 5
  exit_code: 5
  exemptions:            # 5 项为 half.hpp 单精度实现 vs std::<func>(double) 参考基准的 1 half-ULP 差异
    - atan2
    - hypot
    - asinh
    - acosh
    - lgamma

test_package:
  file: "test_package/test_half.cpp"
  assertion_count: 41
  cases_passed: 41
  cases_failed: 0

# 实测汇总：executed = 141 + 41 = 182；passed = 136 + 41 = 177（97.3%）
tests_summary:
  executed: 182
  passed: 177
  failed: 5
  pass_rate: "177/182 = 97.3%"
  test_package_pass_rate: "41/41 = 100%"

knowledge_gained:
  - "half 为 header-only（唯一产物 include/half.hpp），package_type=header-library"
  - "上游 CMakeLists.txt 需 find_package(ROCM) + rocm_setup_version/rocm_create_package（rocm-cmake 包），该包未发布到 ohpcd 制品仓 → 按 PF4/R36 不得声明不可解依赖，改为自包含安装 header"
  - "包版本跟随 ROCm 发布列车 7.2.4，而 half.hpp 头部自报版本为 1.12.0（上游 header 版本）"
  - "上游测试 test/Makefile 用 g++ 编译 test03.cpp/test11.cpp；OHOS 用 clang++ 直接编译执行（无 make check 目标）"
  - "test11.cpp 的数学函数用例以 std::<func>(double) 为基准，而 half.hpp 以小端 float 实现 —— atan2/hypot/asinh/acosh/lgamma 在平台上呈现 1 个 half-ULP 差异（README 已声明单精度实现），属已知参考差异而非缺陷"
