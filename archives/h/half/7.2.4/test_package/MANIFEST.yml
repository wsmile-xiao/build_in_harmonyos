# test_package/MANIFEST.yml
# Upstream test declaration for half (ROCm 7.2.4 release train).
# CI gate L0e requires this file to exist (docs/TEST_QUALITY_SPEC.md).
#
# Upstream `test/Makefile` builds two hand-run programs with g++ (targets
# `test03` and `test11`); upstream ships no `make check` / `ctest` target.
# Both are compiled with the OHOS clang++ and executed inside conanfile.py's
# build() (layer-1), see docs/TEST_QUALITY_SPEC.md 3.1.

package: half/7.2.4
homepage: "https://github.com/ROCm/half"

# Upstream has no `make check`; the test programs are the Makefile targets.
upstream_check_command: "make -C test test03 && make -C test test11"

# conanfile.py build() integrates + executes the upstream test programs.
upstream_test_in_build: true
upstream_test_command: >-
  clang++ test/src/test03.cpp (run ./test03) ; clang++ -std=c++0x
  test/src/test11.cpp (run ./test11 -fast)

# Upstream test programs actually compiled and executed in build().
upstream_tests:
  - file: test/src/test03.cpp
    source: half-rocm-7.2.4/test/src/test03.cpp
    description: "smoke program: half arithmetic + sin(ilogb); exit code must be 0"
    command: "./test03"
  - file: test/src/test11.cpp
    source: half-rocm-7.2.4/test/src/test11.cpp
    description: >-
      full `half_test` suite, 141 registered cases (conversion/classification/
      operators/math/rounding): main() returns the number of failed cases
    command: "./test11 -fast"

# test_package (layer-2 consumer validation).
test_package_tests:
  - file: test_half.cpp
    description: >-
      consumer: #include <half/half.hpp>, half<->float conversions, arithmetic,
      numeric_limits and edge values, enforced by 41 hard checks (require())
    command: "./test_half"

# ── 实测结果（不得按"注册数"或"执行数"冒充当通过数）────────────────────
# 层 1 上游套件（test/src/test11.cpp，`./test11 -fast`）：
#   注册/执行 141 例，通过 136 例，失败 5 例 —— 退出码 5
#   失败项：atan2 / hypot / asinh / acosh / lgamma（5 项，已逐条声明，见下）
#   另有 test/src/test03.cpp：print-only 冒烟程序，0 条断言，退出码 0
# 层 2 test_package/test_half.cpp：41 条 require() 检查，41 通过，失败 0
#
# 通过口径（实测）：
#   executed = 141 + 41 = 182
#   passed   = 136 + 41 = 177
#   pass_rate = 177/182 = 97.3%
# 这 5 个失败是 half.hpp 以单精度 float 实现数学函数、而上游测试以
# std::<func>(double) 为参考基准所致的 1 half-ULP 参考差异（上游 README
# 明确记载单精度实现），非适配缺陷；配方按 TEST_QUALITY_SPEC §3.3 处理：
# 不删除测试调用、不修改上游测试文件，失败集合受控（仅这 5 项已知参考差异
# 允许告警，出现集合外任何失败即抛 ConanException 令构建失败）。
upstream_case_count: 141
upstream_cases_passed: 136
upstream_cases_failed: 5
upstream_exemptions:
  - case: atan2
    reason: "half.hpp 以 float 实现（half.hpp:1501），上游测试以 std::atan2(double) 为参考 → 1 half-ULP 参考差异"
  - case: hypot
    reason: "同上：单精度实现 vs double 参考基准"
  - case: asinh
    reason: "同上：单精度实现 vs double 参考基准"
  - case: acosh
    reason: "同上：单精度实现 vs double 参考基准"
  - case: lgamma
    reason: "同上：单精度实现 vs double 参考基准"

# 实测通过断言数（层1 136 通过 + 层2 41 通过）。
assertion_count: 177
