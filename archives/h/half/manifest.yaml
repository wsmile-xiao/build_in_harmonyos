# 软件级 manifest — half
# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-software.yaml

software: half
display: "half"
description: "IEEE 754 half-precision (binary16) C++ floating point library (header-only, ROCm/half)"
category: library

homepage: "https://github.com/ROCm/half"
license: MIT

build_system: custom

ohos_adaptation:
  key_points:
    - "header-only：唯一交付物为 include/half.hpp，安装为 include/half/half.hpp"
    - "上游 CMakeLists.txt 依赖未发布的 rocm-cmake（find_package(ROCM) + rocm_setup_version/rocm_create_package）→ 采用自包含配方，不声明不可解依赖（PF4/R36）"
    - "包版本跟随 ROCm 发布列车（如 7.2.4）；half.hpp 头部自报版本为 1.12.0"
    - "上游测试 test/Makefile 用 g++ 编译 test03.cpp/test11.cpp → OHOS 用 clang++ 直接编译执行"
    - "test11 数学用例以 std::<func>(double) 为基准，half.hpp 单精度实现导致 atan2/hypot/asinh/acosh/lgamma 出现 1 half-ULP 参考差异（平台已知）"
  common_dependencies: []

versions:
  "7.2.4":
    status: built
    build_date: "2026-10-07"
    conan_ref: "half/7.2.4"
