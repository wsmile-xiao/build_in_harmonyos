# 软件级 manifest — hf-mount
# 遵循 ARCHIVE-SPEC v2.0

software: hf-mount
display: "hf-mount"
description: "Hugging Face Buckets 与仓库本地挂载工具 — 通过 FUSE/NFS 将 HF 存储桶和仓库暴露为本地文件系统，按需懒加载文件内容"
category: storage
homepage: "https://github.com/huggingface/hf-mount"
license: Apache-2.0
build_system: cargo

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Rust Cargo 项目，cargo build --release 直接编译，无 configure 步骤"
    - "OHOS 预检沙盒 cargo/rustc 可能不在 PATH，经 Harmonybrew 安装 Rust 工具链（argc/martin 先例）"
    - "设置 CC/CXX=clang 与 RUSTFLAGS='-C linker=clang'，OHOS 无 cc 符号链接"
    - "Rust 二进制默认静态链接，无需 RPATH；产物 bin/hf-mount + bin/hf-mount-nfs 需 ELF 签名（真机工具链处理）"
    - "OHOS /tmp 只读，构建与测试需用可写 TMPDIR"
    - "上游 src/ 单元测试用 MockHub/MockXet test double，全离线可执行（379 个 #[test]）；tests/ 集成测试需 HF_TOKEN + 网络，离线不可运行"
    - "构建 NFS 后端（--features nfs）：无系统依赖，OHOS 可用；FUSE 后端需 libfuse3 + root，沙盒不可用"
    - "git 依赖（xet-core, fuser fork）由 cargo 直接拉取，需网络可达 github.com"
  common_dependencies:
    - rust
    - openssl
    - zlib

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.9.0":
    status: built
    build_date: "2026-08-16"
    published_as: hf-mount/0.9.0
