# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: hash-library/8
homepage: "https://create.stephan-brumme.com/hash-library/"

# 上游测试命令: hash-library 无构建系统（纯源码库），无 make check/ctest；
# 上游在 tests/ 目录提供 3 个独立可执行测试源
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（源码声明口径，全部独立用户用例）
upstream_tests:
  - file: tests/tests.cpp
    source: hash-library-8/tests/tests.cpp
    description: "主套件：100 组自动向量(CRC32/MD5/SHA1/SHA256/SHA3-256) + SHA1/SHA2/SHA3-512/224/Keccak-224 + HMAC(MD5/SHA1/SHA256) RFC2202/4231 向量"
    command: "./tests-run"
  - file: tests/github-issue2.cpp
    source: hash-library-8/tests/github-issue2.cpp
    description: "issue#2 回归：重复 getHash() 幂等（SHA1/SHA256/SHA3/Keccak/MD5）"
    command: "./issue2"
  - file: tests/github-issue6.cpp
    source: hash-library-8/tests/github-issue6.cpp
    description: "issue#6 回归：SHA3-512 已知向量 (72a5f501151ca974002f34)"
    command: "./issue6"

# test_package 中自带的测试 (消费者视角验证，R34 真实调用公开 API)
test_package_tests:
  - file: test_consumer.cpp
    description: "消费者测试：SHA256/MD5/SHA1/CRC32/SHA3/Keccak/HMAC 已知向量断言 + 流式 API"
    command: "./test_hash-library"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 560