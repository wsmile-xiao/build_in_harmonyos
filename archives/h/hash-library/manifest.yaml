software: hash-library
display: "hash-library"
description: "Portable C++ hashing library: CRC32, MD5, SHA1, SHA256, SHA3, Keccak and HMAC"
category: crypto
homepage: "https://create.stephan-brumme.com/hash-library/"
license: zlib
build_system: custom
ohos_adaptation:
  key_points:
    - "Header-only style API with .cpp implementations; upstream ships no build system"
    - "Compile six algorithm implementations (crc32/md5/sha1/sha256/sha3/keccak) into libhash-library.a with clang++ -fPIC -O2 -std=c++17"
    - "digest.cpp is an upstream CLI example (file digest tool); declared in commands.json per R38"
    - "Upstream tests: 3 independent executables under tests/ (tests.cpp main suite with 100 vectors + HMAC; github-issue2/6 regressions), all pass"
versions:
  "8":
    status: built
    build_date: "2026-09-22"
    packaging: conan
    notes: "conan recipe (os=OHOS arch=armv8), no external deps; static lib + digest CLI; tests 3/3 pass; test_package consumer asserts known-answer vectors"
