# test_package/MANIFEST.yml
# 上游官方测试声明文件 (L0e 强制)

package: hashids.c/1.2.2
homepage: "https://github.com/tzvetkoff/hashids.c"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 已集成上游测试 (make check)
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (Makefile.am: TESTS=test, noinst_PROGRAMS=test, src/test.c)
upstream_tests:
  - file: test.c
    source: hashids.c-1.2.2/src/test.c
    description: "上游唯一测试程序: testcases 表逐项断言 hashids_encode 输出与解码往返 (含 salt/min_hash_length/alphabet 组合)"
    command: "./test"

# test_package 自带测试 (消费者视角验证 + 鸿蒙专项)
test_package_tests:
  - file: test.c
    description: "消费者测试: 公开 API 编码/解码往返 + 文档示例断言 (encode ADf9h9i0sQ / encode_one j0gW / encode_hex k7AVov)"
    command: "./test_hashids.c"
  - file: harmonyos_specific_test.c
    description: "鸿蒙专项测试: 平台宏 __OHOS__/__aarch64__ 编译期断言 + 边界值 (0/ULLONG_MAX/42) 编码解码往返设备实测"
    command: "./harmonyos_specific_test"

# 测试断言总数 (上游 testcases 条目数, 不含哨兵行)
assertion_count: 63
