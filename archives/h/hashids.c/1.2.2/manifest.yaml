# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.2"

# 软件名
software: hashids.c

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/tzvetkoff/hashids.c/archive/refs/tags/v1.2.2.tar.gz"

  # 源码校验和
  sha256: "91e556797692cb877755b98fa10a9f3c3d0bf1d82662e4832ea739f8f3ed334c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E058/E041: 上游 tag 归档无 configure，conan build() 先 autoreconf -fi（tool_requires automake/1.18 + libtool/2.5.4），同 abiword-plugin-clarisworks/argp-standalone"
  - "E011/E114: HMDFS setgid + umask 077 导致 config.status 临时目录不可写，build() 中 drop umask 077"
  - "E007/E072: config.guess 无法识别 HarmonyOS，configure 显式 --build/--host=aarch64-unknown-linux-ohos"
  - "E540: 工具路径前插 /data/service/hnp/bin（runner-path-prepend）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
