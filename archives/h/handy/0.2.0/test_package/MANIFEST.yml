package: handy/0.2.0
homepage: "https://github.com/yedf/handy"

upstream_check_command: "grep '^TEST(' test/*.ut.cc | wc -l (11 registered: conf.ut.cc 1 + handy.ut.cc 5 + tcpcli.ut.cc 1 + threads.ut.cc 2 + util.ut.cc 2)"
upstream_test_in_build: true
upstream_test_command: "make handy_test (Makefile path, TARGET_OS=Linux) && ./handy_test — run inside conanfile.py build() on the OHOS worker, binary signed then executed with cwd=source root so conf.ut.cc reads test/files/*.ini; harness prints '==== PASSED <n> tests', recipe enforces n == 11"

upstream_tests:
  - file: test/conf.ut.cc
    source: handy-0.2.0/test/conf.ut.cc
    description: "allFiles — parses 6 ini fixtures (test/files/): 3 malformed (rc!=0) + 3 well-formed (rc=0); PASS"
  - file: test/handy.ut.cc
    source: handy-0.2.0/test/handy.ut.cc
    description: "Ip4Addr / EventBase / Timer / TcpServer1 / kevent — endpoint parsing (incl. www.baidu.com DNS), epoll loop safeCall/exit, timer schedule+cancel, echo TcpServer round-trip over localhost:2099, upstream kevent-named epoll integration; 5 PASS"
  - file: test/tcpcli.ut.cc
    source: handy-0.2.0/test/tcpcli.ut.cc
    description: "tcpcli — connects www.baidu.com:80/81 (expect Handshaking on unreachable port) + localhost:10000 (expect Failed); needs outbound network; PASS on OHOS worker"
  - file: test/threads.ut.cc
    source: handy-0.2.0/test/threads.ut.cc
    description: "ThreadPool / SafeQueue — producer-consumer task queue (10 tasks) and bounded queue pointer/value delivery; 2 PASS"
  - file: test/util.ut.cc
    source: handy-0.2.0/test/util.ut.cc
    description: "static_func / ExitCaller — util::format 5000-byte string round-trip, RAII exit-callback invocation order; 2 PASS"

test_package_tests:
  - file: main.cc
    description: "HarmonyOS consumer: Slice toString, util::format, Conf missing-file error path, Ip4Addr formatting, EventBase epoll loop with safeCall + runAfter timer + exit (real poller driven on OHOS)"
    command: "./handy_consumer_test"
