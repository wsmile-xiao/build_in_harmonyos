software: hermes
version: "1.9"
status: built
build_date: "2026-08-06"

source:
  url: "https://github.com/facebook/hermes/archive/refs/tags/hermes-v260318099.0.1.tar.gz"
  sha256: "f184e7e45b04d35680bc1687d69966fff7c47b798087eed5a8c57aedacf06a8e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DHERMES_UNICODE_LITE=ON"
    - "-DHERMES_ENABLE_WIN10_ICU_FALLBACK=OFF"
    - "-DBOOST_CONTEXT_ARCHITECTURE=arm64"
    - "-DBOOST_CONTEXT_ABI=aapcs"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-modules-Hermes.cmake.patch"
  - "0002-external-llvh-cmake-modules-GetHostTriple.cmake.patch"

knowledge_gained:
  - "CMake on HarmonyOS does not set UNIX variable, causing LLVM_ON_UNIX detection failure"
  - "CMAKE_SYSTEM_PROCESSOR is empty on OHOS, causing Boost.Context to default to x86_64"
  - "config.guess in external/llvh does not recognize HarmonyOS, needs platform detection in GetHostTriple.cmake"
