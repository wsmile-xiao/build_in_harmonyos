software: "harfbuzz"
version: "14.2.0.1"
status: built
build_date: "2026-08-03"
build_system: meson

source:
  url: "https://github.com/harfbuzz/harfbuzz/releases/download/14.2.0/harfbuzz-14.2.0.tar.xz"
  tar_format: tar.xz
  upstream_version: "14.2.0"

configure_options:
  - "-Dwrap_mode=nodownload"
  - "-Dglib=enabled"
  - "-Dgobject=disabled (OHOS; enabled on other platforms)"
  - "-Dfreetype=enabled"
  - "-Dzlib=enabled"
  - "-Dcairo=disabled"
  - "-Dtests=enabled"
  - "-Dutilities=enabled"

build:
  system: meson
  dependencies:
    - glib/2.84.0.1
    - freetype/2.14.3
    - graphite2/1.3.14
    - zlib/1.3.1.1

patches_applied:
  - "patches/0001-static-tests.patch"
  - "patches/0002-subset-repack-no-fonttools.patch"

notes: |
  R37 revision over archived 14.2.0. Conan meson recipe; cairo disabled
  (pango brings cairo separately; hb-view not built). tests=enabled and
  utilities=enabled; vtable link issue resolved by graphite2 system_libs
  (c++). Patch 0001 creates static archives for OHOS test linkage.
