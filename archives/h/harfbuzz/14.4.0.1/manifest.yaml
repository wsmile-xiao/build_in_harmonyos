software: "harfbuzz"
version: "14.4.0.1"
status: built
build_date: "2026-09-18"
build_system: meson

source:
  url: "https://github.com/harfbuzz/harfbuzz/releases/download/14.4.0/harfbuzz-14.4.0.tar.xz"
  sha256: "2357ed966c6ced7bfa720b0640c0231065af01158fbea215093ffa15aed44371"
  upstream_version: "14.4.0"

configure_options:
  - "icu=enabled (ICU component libharfbuzz-icu)"
  - "glib/gobject/cairo/zlib/graphite2=disabled"
  - "freetype=enabled"
  - "subset/raster/vector/gpu=enabled"
  - "tests/utilities=enabled"
  - "gpu_demo/introspection/docs/benchmark=disabled"

build:
  system: meson
  dependencies:
    - freetype/2.14.3
    - icu4c/78
  jobs: 1

patches_applied: []

notes: |
  14.4.0.1 = upstream 14.4.0 source with the ICU integration component
  enabled (Meson `icu=enabled`, `icu_builtin=false` → standalone
  libharfbuzz-icu.so + harfbuzz-icu.pc + installed hb-icu.h), plus a Conan
  icu4c/78 requirement. icu4c/78 provides icu-uc.pc (Version 78.3) which
  satisfies harfbuzz's icu_min_version >= 49.0; generate() forwards
  icu4c.pc → icu-uc.pc for the meson `dependency('icu-uc')` lookup.

  Motivation: WebKitGTK 2.48.1 OptionsGTK.cmake requires
  `find_package(HarfBuzz 2.7.4 REQUIRED COMPONENTS ICU)` and the WebCore
  text stack calls hb_icu_script_to_script(); all previously published
  harfbuzz versions (14.2.0.x ~ 14.4.0) shipped icu=disabled with no
  libharfbuzz-icu, so this revision adds the missing ICU component while
  keeping the rest of the 14.4.0 option surface and upstream tests intact.
