software: "harfbuzz"
version: "14.4.0"
status: built
build_date: "2026-09-13"
build_system: meson

source:
  url: "https://github.com/harfbuzz/harfbuzz/releases/download/14.4.0/harfbuzz-14.4.0.tar.xz"
  sha256: "2357ed966c6ced7bfa720b0640c0231065af01158fbea215093ffa15aed44371"
  upstream_version: "14.4.0"

configure_options:
  - "glib/gobject/cairo/zlib/icu/graphite2=disabled"
  - "freetype=enabled"
  - "subset/raster/vector/gpu=enabled"
  - "tests/utilities=enabled"
  - "gpu_demo/introspection/docs/benchmark=disabled"

build:
  system: meson
  dependencies:
    - freetype/2.14.3
  jobs: 1

patches_applied: []

notes: |
  Version bump 14.3.0 -> 14.4.0 on the same Meson recipe; upstream
  meson_options.txt is byte-identical between the two releases, so the
  option surface (freetype=enabled, glib/gobject/cairo/zlib/icu/graphite2
  disabled, subset/raster/vector/gpu + tests/utilities enabled) is
  unchanged. Source is the official Meson dist tarball from the upstream
  GitHub release, pulled through the same sha256-pinned get() path.
