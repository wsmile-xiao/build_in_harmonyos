software: "harfbuzz"
version: "14.2.0"
status: built
build_date: "2026-05-22"
build_system: meson

source:
  url: "https://github.com/harfbuzz/harfbuzz/releases/download/14.2.0/harfbuzz-14.2.0.tar.xz"
  tar_format: tar.xz

configure_options: ""

build:
  system: meson
  dependencies:
    - freetype
    - glib-2.0
  cc: clang
  cxx: clang++

patches_applied:
  - "hb-features.h configuration patch"

knowledge_gained:
  - "harfbuzz 依赖 freetype 影成循环依赖，需要先编译不带 harfbuzz 的 freetype"
  - "meson 构建支持较好，但在 HMDFS 上 subprocess 有问题"
  - "使用 amalgamated 源码编译可绕过 meson subprocess 问题"
  - "需要手动创建 hb-features.h 配置文件"
