version: "0.11.9"
status: published
build_date: "2026-04-20"

source:
  url: "https://github.com/HdrHistogram/HdrHistogram_c/archive/refs/tags/0.11.9.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DHDR_LOG_REQUIRED=OFF"
    - "-DHDR_HISTOGRAM_BUILD_PROGRAMS=ON"
    - "-DBUILD_TESTING=ON"
  dependencies:
    - pthread
    - rt
    - m
  cc: clang

patches_applied:
  - "0001-fix-openharmony-clock-functions.patch"

knowledge_gained:
  - "OpenHarmony time.h 未定义 CLOCK_MONOTONIC/CLOCK_REALTIME，需添加头文件和宏定义"
  - "GitHub 无法直接访问时可用 jsdelivr CDN 镜像下载"
  - "usleep/clock_gettime 隐式声明为警告级别，不影响功能"
