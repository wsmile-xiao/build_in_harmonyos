version: "0.11.8"
status: built
build_date: "2026-09-06"

source:
  url: "https://github.com/HdrHistogram/HdrHistogram_c/archive/refs/tags/0.11.8.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DHDR_LOG_REQUIRED=ON"
    - "-DHDR_HISTOGRAM_BUILD_PROGRAMS=ON"
    - "-DBUILD_TESTING=ON"
  dependencies:
    - pthread
    - rt
    - m
    - zlib (sysroot 系统库，用于 HDR_LOG 组件)
  cc: clang

patches_applied:
  - "0001-src-hdr_time.c.patch"
  - "0002-test-hdr_histogram_perf.c.patch"
  - "0003-test-CMakeLists.txt.patch"

knowledge_gained:
  - "OpenHarmony time.h 未定义 CLOCK_MONOTONIC/CLOCK_REALTIME，需添加头文件和宏定义"
  - "OHOS conan 工具链不搜 sysroot，find_package(ZLIB) 失败导致 log_test(25 例) 未实例化；配方 generate() 注入 sysroot zlib 路径可恢复测试入口"
  - "上游 if(UNIX) 守卫在 OHOS 不成立，需扩展 OHOS/HarmonyOS 判定以纳入并发测试"
  - "hdr_max() 返回最高非空桶上界值，测试断言应使用 hdr_values_are_equivalent 做桶级等价判定"

patch_generation:
  method: per-file-difflib
  source_orig_dir: builds/hdrhistogram-c/0.11.8/pristine_extract
  source_work_dir: builds/hdrhistogram-c/0.11.8/HdrHistogram_c-0.11.8
  generated_at: '2026-09-06'
  patches_count: 3

patch_classification:
  - file: 0001-src-hdr_time.c.patch
    type: portability
    platform_only: True
    guard: conditional clock macro fallback for OpenHarmony time headers
  - file: 0002-test-hdr_histogram_perf.c.patch
    type: command-probe
    platform_only: False
    guard: argc-gated --version/--help fast path only
  - file: 0003-test-CMakeLists.txt.patch
    type: portability
    platform_only: True
    guard: enable concurrency test on OHOS/HarmonyOS by extending if(UNIX) guard
