package: hdrhistogram/0.11.8
homepage: "https://github.com/HdrHistogram/HdrHistogram_c"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build --output-on-failure"

upstream_tests:
  - file: test/hdr_histogram_test.c
    source: HdrHistogram_c-0.11.8/test/hdr_histogram_test.c
    description: "Core histogram API tests (18 cases)"
    command: "./test/hdr_histogram_test"
  - file: test/hdr_histogram_atomic_test.c
    source: HdrHistogram_c-0.11.8/test/hdr_histogram_atomic_test.c
    description: "Atomic histogram API tests (16 cases)"
    command: "./test/hdr_histogram_atomic_test"
  - file: test/hdr_atomic_test.c
    source: HdrHistogram_c-0.11.8/test/hdr_atomic_test.c
    description: "Atomic primitive tests (4 cases)"
    command: "./test/hdr_atomic_test"
  - file: test/hdr_histogram_log_test.c
    source: HdrHistogram_c-0.11.8/test/hdr_histogram_log_test.c
    description: "Log component tests (25 cases, enabled via sysroot zlib injection)"
    command: "./test/hdr_histogram_log_test"
  - file: test/hdr_histogram_atomic_concurrency_test.c
    source: HdrHistogram_c-0.11.8/test/hdr_histogram_atomic_concurrency_test.c
    description: "Concurrent atomic recording test (1 case, enabled via OHOS platform guard patch)"
    command: "./test/hdr_histogram_atomic_concurrency_test"

test_package_tests:
  - file: test.c
    description: "Consumer smoke test for hdr_init, hdr_record_value, hdr_record_values, total_count field, and hdr_max"
    command: "./test_hdrhistogram"
  - file: test_ohos_platform.c
    description: "HarmonyOS platform test: hdr_gettime/hdr_getnow clock API, 4-thread atomic concurrent recording, accumulation and percentile"
    command: "./test_ohos_platform"

assertion_count: 64