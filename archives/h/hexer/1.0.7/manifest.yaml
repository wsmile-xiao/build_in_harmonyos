# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "clang 15 的 -Wdeprecated-non-prototype 是硬错误，无法用 -Wno- 或 pragma 抑制，必须修改源码使用正确原型的函数指针"
  - "OpenHarmony term.h 仅声明 tputs，缺少 tgoto/tgetent/tgetstr/tgetnum/tgetflag 声明（函数存在于 libncursesw.a），编译时需手动 extern"
  - "Makefile 中 CFLAGS_STD ?= 在 G0 clean-verify 环境中行为异常，改为 CFLAGS_STD = 确保始终生效"
  - "G0 验证脚本默认执行 ./configure，makefile 项目需提供 configure wrapper 脚本"

