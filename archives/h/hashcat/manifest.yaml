# hashcat 软件级 manifest
# 文件位置: archives/h/hashcat/manifest.yaml

software: hashcat
name: hashcat
description: 高性能密码恢复工具，支持 300+ 种哈希算法

# 软件分类
category: security

# 官网
homepage: https://hashcat.net/hashcat/

# 源码仓库
repository: https://github.com/hashcat/hashcat

# 版本索引
versions:
  - version: "7.1.2"
    status: published
    build_date: "2026-05-20"
    patches: 3

# 平台支持
platform_support:
  harmonyos: true
  limitations:
    - "CPU 亲和性禁用"
    - "HMDFS 不支持 FIFO"
    - "Python/Rust 插件可选"