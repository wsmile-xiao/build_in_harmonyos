# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: handmade-math/2.0.0
homepage: "https://github.com/HandmadeMath/HandmadeMath"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/hmm_test.c
    source: handmade-math-2.0.0/test/hmm_test.c
    description: "C 语言测试（含 SSE 与 no-SSE 两变体）：向量/矩阵/四元数/三角函数/投影变换全套单元测试"
    command: "make c / make c_no_sse"
  - file: test/hmm_test.cpp
    source: handmade-math-2.0.0/test/hmm_test.cpp
    description: "C++ 语言测试（含 SSE 与 no-SSE 两变体）：含运算符重载与 C++ 模式 API"
    command: "make cpp / make cpp_no_sse"
  - file: test/categories/*.h
    source: handmade-math-2.0.0/test/categories/*.h
    description: "测试用例分类：Addition/Division/Equality/Initialization/MatrixOps/Multiplication/Projection/QuaternionOps/ScalarMath/SSE/Subtraction/Transformation/VectorOps"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：include HandmadeMath.h 并实际调用 HMM_V4/HMM_NormV4/HMM_LenV4/HMM_DotV4/HMM_M4D/HMM_MulM4 验证 API 可用"
    command: "./test_handmade-math"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 87