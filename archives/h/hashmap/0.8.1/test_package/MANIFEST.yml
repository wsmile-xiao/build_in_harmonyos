# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: hashmap/0.8.1
homepage: "https://github.com/tidwall/hashmap.c"

# 上游无 make/ctest/meson：单文件库，官方内置测试入口为
#   cc -DHASHMAP_TEST hashmap.c && ./a.out
upstream_check_command: "cc -DHASHMAP_TEST hashmap.c && ./a.out"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "cc -DHASHMAP_TEST hashmap.c && ./a.out"

# 上游实际运行的测试程序（内置自检，源码在 hashmap.c 内部）
upstream_tests:
  - file: hashmap.c
    source: hashmap-0.8.1/hashmap.c
    description: "官方内置自检：插入/查找/更新/删除/迭代/压力随机测试（seed 随机、2000 项）"
    command: "./a.out"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过公开头文件 hashmap.h 调用 new/set/get/delete/count/iter"
    command: "./test_hashmap"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
