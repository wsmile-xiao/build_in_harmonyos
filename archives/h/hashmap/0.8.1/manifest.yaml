# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.8.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.1"

# 软件名
software: "hashmap"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/tidwall/hashmap.c/archive/refs/tags/v0.8.1.tar.gz"

  # 源码校验和
  sha256: "ebd1396d65fbe1081d5b3ed93a53c29d8c10c212a3a8c51ae990c84aaeda1c1e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "hashmap_set() 成功插入返回 NULL、仅替换返回旧值指针，失败须用 hashmap_oom() 判据（DRAFT-hashmap-0.8.1-set-returns-null-on-insert）"
- "无构建系统单 TU C 源库（.c+.h）用 custom 配方直接编译上游 .c 为静态库，勿用 autotools/makefile 模板或 header-only 形态（DRAFT-hashmap-0.8.1-no-build-system-single-tu-lib）"
- "Conan 2.29.1 tools.build:compiler_executables 是 dict，须 check_type=dict 整体获取后取 ['c']（复用 E392）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
