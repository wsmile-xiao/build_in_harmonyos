# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hyprpicker/0.4.7
homepage: "https://github.com/hyprwm/hyprpicker"

# 上游测试命令：上游无测试套件（CMakeLists 无 add_test/enable_testing）
upstream_check_command: "make"
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序（无独立测试套件，构建即验证编译链接）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_hyprpicker.sh
    description: "验证 hyprpicker 可执行文件存在且可运行（1 个断言；沙箱 ELF 隔离时 SKIP 仅验证产物存在）"
    command: "bash test_hyprpicker.sh <bin_dir>"
  - file: conanfile.py
    description: "验证 bin/hyprpicker 二进制存在（1 个断言）"
    command: "conan test"

# 测试断言总数：上游无独立测试用例（0），test_package 2 个断言
assertion_count: 2
