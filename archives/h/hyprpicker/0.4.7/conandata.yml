sources:
  url: "https://github.com/hyprwm/hyprpicker/archive/refs/tags/v0.4.7.tar.gz"
  sha256: "cde02b92abe372187c9d59a7cb2ca07ede5c3e1a8c81ed8b209dc0d3ac5f0339"
patches:
  - patch_file: "patches/0001-use-fmt.patch"
    patch_description: "hyprpicker.cpp/main.cpp/Notify.cpp：std::format 约 30 处改用 fmt::format（#include <format> → <fmt/format.h>）——OHOS libc++ 15 无 <format> 头（clang 15 工具链限制）"
    patch_type: "portability"
  - patch_file: "patches/0002-rename-version.patch"
    patch_description: "CMakeLists 读取 VERSION.txt（VERSION → VERSION.txt 重命名见 conanfile source()）——OHOS 文件系统大小写不敏感，源码根 VERSION 文件会被 <version> 标准头误解析（-I. 搜索路径命中），改读 VERSION.txt 避免冲突"
    patch_type: "portability"
  - patch_file: "patches/0003-use-fmt-print.patch"
    patch_description: "Log.cpp：std::print 改用 fmt::print（#include <print> → <fmt/format.h>）——OHOS libc++ 15 无 <print> 头（同 <format> 缺失，clang 15 工具链限制）"
    patch_type: "portability"
  - patch_file: "patches/0004-fix-from-chars.patch"
    patch_description: "main.cpp：std::from_chars 浮点解析改用 strtof——OHOS libc++ 15 的 charconv 无浮点 from_chars 重载（仅整型，浮点版本为 deleted）"
    patch_type: "portability"
