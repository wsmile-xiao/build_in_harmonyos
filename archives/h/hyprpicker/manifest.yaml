software: hyprpicker
display: "Hyprpicker"
description: "A wlroots-compatible Wayland color picker that does not suck（Wayland 取色器）"
category: utilities
homepage: "https://github.com/hyprwm/hyprpicker"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "Wayland 取色器，CMake C++23 构建"
    - "依赖链：wayland/1.22.0 + wayland-protocols + libxkbcommon + cairo + pango + libjpeg-turbo + hyprutils + hyprwayland-scanner（均为本仓库/制品仓已有适配）"
    - "std::format 改用 fmt::format（OHOS libc++ 15 无 <format> 头）"
    - "上游无测试套件，构建期验证编译链接"
  common_dependencies:
    - "wayland/1.22.0"
    - "wayland-protocols/1.27"
    - "libxkbcommon/1.6.0"
    - "cairo/1.18.4"
    - "pango/1.56.4"
    - "libjpeg-turbo/3.2.0"
    - "hyprutils/0.2.0"
    - "hyprwayland-scanner/0.4.0"
    - "fmt/8.1.1"

versions:
  "0.4.7":
    status: in-progress
    build_date: "2026-08-23"
    source_url: "https://github.com/hyprwm/hyprpicker/archive/refs/tags/v0.4.7.tar.gz"
    packaging: "packaging/"
