# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/9.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.6"

# 软件名
software: "hydra"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-17"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/vanhauser-thc/thc-hydra/archive/refs/tags/v9.6.tar.gz"

  # 源码校验和
  sha256: "c839e5c64ef60185c69a07a9a59831bd2cfe9ac2eac0c4d9e87fdf38dbf04c40"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
  - "--disable-xhydra"
  - "--nostrip"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - openssl/3.5.6
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "package() 用 shutil.copyfile 拷贝可执行产物时不会保留源文件权限位，缺执行位会导致 test_package 运行二进制报 Error 126；须显式 os.chmod 0o755 (knowledge_ref: E098)"
  - "hydra 帮助命令（-h/-H/--help）退出码恒为 255（上游行为），test_package 不能依赖 self.run 退出码，应捕获 stdout 断言版本信息；自写 configure 非标准 autotools，产物为纯可执行文件（application） (knowledge_ref: E095)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
