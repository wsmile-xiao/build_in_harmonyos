knowledge_gained:
  - "OHOS sysroot 中 linux/netfilter_ipv4.h 间接引入 linux/socket.h，与 musl sys/socket.h 重复定义 sockaddr_storage（E091/E119 模式）；用 define-guard 临时重命名绕过"
  - "OHOS sysroot 中 linux/prctl.h 与 sys/prctl.h 重复定义 struct prctl_mm_map；sys/prctl.h 已含所需 PR_* 常量，删除 linux/prctl.h 引入即可"
  - "HMDFS 账户共享把新建文件属主映射为 account uid（与本进程 uid 不一致），autoconf config.status 的 mktemp -d（umask 077）生成的 0700 临时目录对本进程不可写，configure 失败；用 mkdir 回退替代（4ti2 同款修复）"

