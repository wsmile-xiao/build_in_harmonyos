# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: hashrat/1.25
homepage: "https://github.com/ColumPaget/Hashrat"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 check.sh 需 bash + 完整 tests/ fixture，本地已实测；CI 侧经 test_package 冒烟
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（check.sh 为 bash 脚本，含 49 项断言组）
upstream_tests:
  - file: check.sh
    source: hashrat-1.25/check.sh
    description: >
      上游唯一测试入口 make check（check.sh）：哈希类型(10)、1000 次迭代(6)、
      HMAC(5)、编码(10)、杂项功能(8)、文件定位(4)、hook(2)、退出码(4)，
      共 49 项断言组。本机实测 48/49 通过；1 项 "Checking files" 为
      stdout/stderr 管道字节序差异（上游期望 stderr 先于 stdout 写入，
      OHOS/musl 缓冲顺序不同），功能正确（exit codes 用例验证 -c 检查通过）。
    command: "/data/service/hnp/bin/bash ./check.sh"

# test_package 中自带的测试 (消费者视角验证，CLI 应用直接执行二进制)
test_package_tests:
  - file: test_hashrat.sh
    description: >
      物理测试源文件（L0c 门禁要求）：以安装产物 bin/hashrat 为被测对象，
      断言 -version 输出 "version: 1.25"、SHA-256 已知向量
      (The sky above the port was the color of television, tuned to a dead channel. )
      == c7fadad016311a935a56dcdfb585cf5a4781073f7da13afa22177796e566434f，
      以及退出码语义（命中=0、未命中=1，与 check.sh TestExitCodes 一致）。
    command: "bash test_hashrat.sh <bin/hashrat 绝对路径>"
  - file: conanfile.py
    description: >
      test() 通过 self.run 实际执行 test_hashrat.sh（非空壳）：校验二进制
      存在并运行脚本，脚本失败则 conan create 失败。
    command: "conan create 内 test_package 阶段自动执行"

# 测试断言总数 (上游 49 断言组 + test_package 3 项)
assertion_count: 52
