# conandata.yml — hashrat 1.25
# 官方 GitHub tag v1.25 tarball；SHA-256 在 codeload 与本地两端一致
sources:
  url:
    - "https://gh-proxy.com/https://github.com/ColumPaget/Hashrat/archive/refs/tags/v1.25.tar.gz"
    - "https://github.com/ColumPaget/Hashrat/archive/refs/tags/v1.25.tar.gz"
  sha256: "4414dcfbb8c3c9c53a326767ae21aa1f5a42799d2088dc26d3bb2ff4974b7a41"

patches:
  - patch_file: "patches/0001-libUseful-bundled-Process.c.patch"
    patch_description: >
      OHOS sysroot 头文件冲突修复（E091/E119 模式）：
      libUseful-bundled/Process.c 的 linux/prctl.h 与 sys/prctl.h
      重复定义 struct prctl_mm_map，OHOS 下删除 linux/prctl.h 引入
      （sys/prctl.h 已提供所需全部 PR_* 常量）。仅 OHOS 平台宏守卫，
      其他平台行为不变。
    patch_type: "portability"
  - patch_file: "patches/0002-libUseful-bundled-Socket.c.patch"
    patch_description: >
      OHOS sysroot 头文件冲突修复（E091/E119 模式）：
      libUseful-bundled/Socket.c 的 linux/netfilter_ipv4.h 间接引入
      linux/socket.h，与 musl sys/socket.h 重复定义 sockaddr_storage，
      以 define-guard 临时重命名解决。仅 OHOS 平台宏守卫，其他平台
      行为不变。
    patch_type: "portability"
  - patch_file: "patches/0003-main.c.patch"
    patch_description: >
      OHOS 输出缓冲语义修复：OHOS musl 对管道 stdout 逐行冲刷，使
      `-c 2>&1` 合并流字节序相对上游参考环境（glibc 管道 stdout 全缓冲，
      stderr 摘要先行）反转，导致上游 check.sh "Checking files" 断言
      （整流哈希 d50f1b64...）失败。main() 启动时对非 tty stdout 强制
      全缓冲（setvbuf _IOFBF），恢复上游参考字节序；tty 交互行为不变。
      实测修复后整流哈希恢复 d50f1b64...，功能输出内容不变。
    patch_type: "portability"
