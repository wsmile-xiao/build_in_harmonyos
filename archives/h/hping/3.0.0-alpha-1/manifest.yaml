software: hping
version: 3.0.0-alpha-1
status: built
build_system: makefile
configure_options: []
dependencies:
  - libpcap
external_dependencies:
  - name: libpcap
    version: 1.10.5
    source: Alpine Linux 预编译包
    reason: 绕过 bison/flex pipe 限制

build_environment:
  compiler: clang
  target_platform: HarmonyOS
  
notes: |
  hping 是网络探测工具，支持 TCP/UDP/ICMP 协议。
  
  ## 编译要点
  
  1. **libpcap 依赖**：从 Alpine Linux 预编译包获取 libpcap.a
  2. **平台适配**：创建 systype.h 和 byteorder.h 适配 HarmonyOS
  3. **编译器**：使用 clang（HarmonyOS 默认）
  
  ## 外部依赖说明
  
  libpcap 使用 Alpine Linux 预编译包的原因：
  - HarmonyOS 上 bison/flex 编译 libpcap 时遇到 pipe 限制
  - Alpine 预编译包为静态库，可直接链接
  - 已包含必要的 ELF 签名
  
  ## 已知问题
  
  - 部分高级功能可能需要 root 权限
  - 需要验证所有网络功能在 HarmonyOS 上的兼容性

patches_applied:
  - 0001-platform-harmonyos.patch
  - 0002-byteorder-harmonyos.patch

build_date: 2026-05-14
binary_size: 682KB
binary_path: ~/usr/local/bin/hping3