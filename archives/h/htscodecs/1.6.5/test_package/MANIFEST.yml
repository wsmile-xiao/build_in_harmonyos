package: htscodecs/1.6.5
homepage: "https://github.com/jkbonfield/htscodecs"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（来自官方 tag v1.6.5 完整枚举，见 notes.md 台账）
upstream_tests:
  - file: tests/entropy.test
    source: htscodecs-1.6.5/tests/entropy.test
    description: "entropy 测试脚本（small/large buffer histogram 变体），调用 entropy 程序，入口 tests/Makefile.am TESTS"
    command: "make check (tests/entropy.test)"
  - file: tests/rans4x8.test
    source: htscodecs-1.6.5/tests/rans4x8.test
    description: "rANS 4x8 往返压缩/解压 + 预压缩数据解压，覆盖 dat/q* 语料，入口 TESTS"
    command: "make check (tests/rans4x8.test)"
  - file: tests/rans4x16.test
    source: htscodecs-1.6.5/tests/rans4x16.test
    description: "rANS 4x16/32x16pr 多 order 往返 + SIMD/scalar 交叉兼容，入口 TESTS"
    command: "make check (tests/rans4x16.test)"
  - file: tests/arith.test
    source: htscodecs-1.6.5/tests/arith.test
    description: "arith_dynamic 多 order 往返 + 预压缩数据解压，覆盖 dat/q*、dat/u32，入口 TESTS"
    command: "make check (tests/arith.test)"
  - file: tests/tok3.test
    source: htscodecs-1.6.5/tests/tok3.test
    description: "tokenise_name3 名称 token 化 11 个 names 语料 × 10 级往返，入口 TESTS"
    command: "make check (tests/tok3.test)"
  - file: tests/fqzcomp.test
    source: htscodecs-1.6.5/tests/fqzcomp.test
    description: "fqzcomp_qual 质量值压缩 s0-3 变体往返 + 预压缩数据解压，入口 TESTS"
    command: "make check (tests/fqzcomp.test)"
  - file: tests/varint_test.c
    source: htscodecs-1.6.5/tests/varint_test.c
    description: "varint 变长编码单元测试（独立可执行，直接注册于 TESTS）"
    command: "make check (tests/varint)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 htscodecs_version() + rANS 往返压缩/解压并校验字节一致"
    command: "./test_htscodecs"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 65536
