software: htop
version: 3.4.1
status: partial
build_system: autotools
category: utility
description: htop - an interactive process viewer

harmonyos:
  triplet: aarch64-unknown-linux-ohos
  libc: musl
  compiler: clang 15.0.4

build:
  source: https://github.com/htop-dev/htop/releases/download/3.4.1/htop-3.4.1.tar.xz
  system: autotools
  dependencies:
    - clang
    - make
    - ncurses
  
  configure_flags:
    - --prefix=${HOME}/usr/local
  
  patches:
    - 0001-config-guess-harmonyos.patch
    - 0002-config-sub-harmonyos.patch
    - 0003-fix-include-path.patch

issues:
  - "linux/IOPriorityPanel.h 中的 #include \"Panel.h\" 路径不正确"
  - "修复：改为 #include \"../Panel.h\""
  - "这是 htop 3.4.1 的 bug"

limitations:
  - "普通用户无法运行 htop，因为鸿蒙 SELinux 策略限制 /proc 文件系统访问"
  - "错误信息: Cannot open /proc/stat: Permission denied"
  - "解决方案: 需要 sudo 权限运行"
  - "SELinux 上下文: u:object_r:proc_stat_file:s0"

ncurses_issue:
  problem: "系统 libncursesw.so.6 也受 SELinux 限制，无法被普通用户加载"
  solution: "使用静态链接 ncursesw 编译 htop"
  result: "静态链接后 htop 本身可加载，但 /proc 权限问题仍需要 sudo"

fkeys_issue:
  problem: "sudo 后 F10 等功能键无法工作"
  cause: "sudo 后 TERM 和 TERMINFO 环境变量丢失"
  solution: "使用 sudo -E 并显式设置环境变量"
  command: "sudo -E TERM=xterm-256color TERMINFO=$HOME/usr/local/share/terminfo htop"

build_options:
  ldflags: "-static"
  ncurses_cflags: "-I$HOME/usr/local/include"
  ncurses_libs: "-L$HOME/usr/local/lib -lncursesw"

test:
  has_test_suite: false
  note: "htop 没有官方测试套件"
  core_function_test: "FAILED - 需要 sudo 权限"

install:
  binaries:
    - $HOME/usr/local/bin/htop

build_date: 2026-03-23
