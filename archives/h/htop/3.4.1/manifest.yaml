software: htop
version: "3.4.1"
status: partial
build_system: autotools
compile_date: "2026-04-14"

dependencies:
  required: [clang, make, ncurses]
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  source: https://github.com/htop-dev/htop/releases/download/3.4.1/htop-3.4.1.tar.xz
  configure_options:
    - --prefix=$HOME/usr/local
    - NCURSES_CFLAGS=-I$HOME/usr/local/include
    - NCURSES_LIBS=-L$HOME/usr/local/lib -lncursesw
    - LDFLAGS=-L$HOME/usr/local/lib
  cflags: -fPIC -O2
  ldflags: null

patches_applied:
  - file: 0001-build-aux-config.guess.patch
    purpose: build-aux/config.guess 添加 HarmonyOS 系统检测
  - file: 0002-build-aux-config.sub.patch
    purpose: build-aux/config.sub 添加 HarmonyOS 操作系统支持（含 kernel-os 白名单 linux-ohos*）
  - file: 0003-linux-IOPriorityPanel.h.patch
    purpose: 修复 linux/IOPriorityPanel.h 中 #include "Panel.h" 路径不正确 → #include "../Panel.h"

compatibility:
  level: partial
  issues:
    - "普通用户无法运行 htop，鸿蒙 SELinux 限制 /proc 文件系统访问（Cannot open /proc/stat: Permission denied）"
    - "sudo 后 F10 等功能键无法工作（TERM 和 TERMINFO 环境变量丢失）"
  notes: |
    需要 sudo 权限运行。ncursesw 已静态嵌入（NEEDED 仅 libc.so），无需运行时 ncurses 库。
    使用 sudo -E TERM=xterm-256color TERMINFO=$HOME/usr/local/share/terminfo htop 可解决功能键问题。
    htop 没有官方测试套件。

test_results:
  type: manual
  passed: 3
  failed: 1
  note: "--version 通过, 二进制签名通过, ncursesw 静态链接通过。/proc/stat 需 sudo（平台限制）"

knowledge_gained:
  - "htop 3.4.1 有 bug：linux/IOPriorityPanel.h 中 #include \"Panel.h\" 路径不正确，需改为 #include \"../Panel.h\""
  - "鸿蒙 SELinux 策略限制 /proc 文件系统访问，普通用户无法读取 /proc/stat"
  - "sudo 后需使用 sudo -E 保留环境变量，并显式设置 TERM 和 TERMINFO"
  - "htop config.guess/config.sub 在 build-aux/ 子目录（不在根目录），与 wget 类似"
  - "patch-autotools-ohos.pl 漏加 kernel-os 白名单 linux-ohos*，需手动补充"

packaging:
  format: tar.gz
  binary: bin/htop
  size: 539K
  debug_size: 117K
  install_hint: "sudo $PREFIX/bin/htop"

