software: htop
version: "3.4.1"
status: partial
build_system: autotools
compile_date: "2026-03-23"

dependencies:
  required: [clang, make, ncurses]
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  source: https://github.com/htop-dev/htop/releases/download/3.4.1/htop-3.4.1.tar.xz
  configure_options:
    - --prefix=$HOME/usr/local
  cflags: null
  ldflags: "-static"
  ncurses_cflags: "-I$HOME/usr/local/include"
  ncurses_libs: "-L$HOME/usr/local/lib -lncursesw"

patches_applied:
  - file: 0001-config-guess-harmonyos.patch
    purpose: config.guess 添加 HarmonyOS 系统检测
  - file: 0002-config-sub-harmonyos.patch
    purpose: config.sub 添加 HarmonyOS 操作系统支持
  - file: 0003-fix-include-path.patch
    purpose: 修复 linux/IOPriorityPanel.h 中 #include "Panel.h" 路径不正确

compatibility:
  level: partial
  issues:
    - "普通用户无法运行 htop，鸿蒙 SELinux 限制 /proc 文件系统访问（Cannot open /proc/stat: Permission denied）"
    - "系统 libncursesw.so.6 受 SELinux 限制，普通用户无法加载，需静态链接 ncursesw"
    - "sudo 后 F10 等功能键无法工作（TERM 和 TERMINFO 环境变量丢失）"
  notes: |
    需要 sudo 权限运行。使用静态链接 ncursesw 编译可解决库加载问题，但 /proc 权限问题仍需 sudo。
    使用 sudo -E TERM=xterm-256color TERMINFO=$HOME/usr/local/share/terminfo htop 可解决功能键问题。
    htop 没有官方测试套件。

test_results:
  type: manual
  passed: 0
  failed: 1
  note: "核心功能测试需要 sudo 权限，无法通过。SELinux 上下文: u:object_r:proc_stat_file:s0"

knowledge_gained:
  - "htop 3.4.1 有 bug：linux/IOPriorityPanel.h 中 #include \"Panel.h\" 路径不正确，需改为 #include \"../Panel.h\""
  - "鸿蒙 SELinux 策略限制 /proc 文件系统访问，普通用户无法读取 /proc/stat"
  - "系统动态库受 SELinux 限制，需静态链接解决"
  - "sudo 后需使用 sudo -E 保留环境变量，并显式设置 TERM 和 TERMINFO"
