version: "3.4.1"
status: partial
build_date: "2026-04-14"

source:
  url: "https://github.com/htop-dev/htop/releases/download/3.4.1/htop-3.4.1.tar.xz"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--prefix=$HOME/usr/local"
    - "NCURSES_CFLAGS=-I$HOME/usr/local/include"
    - "NCURSES_LIBS=-L$HOME/usr/local/lib -lncursesw"
    - "LDFLAGS=-L$HOME/usr/local/lib"
  dependencies:
    - ncursesw
  cc: clang

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0003-linux-IOPriorityPanel.h.patch"

knowledge_gained:
  - "htop 3.4.1 有 bug: linux/IOPriorityPanel.h 中 #include \"Panel.h\" 路径不正确"
  - "鸿蒙 SELinux 策略限制 /proc 文件系统访问，普通用户无法读取 /proc/stat"
  - "sudo 后需使用 sudo -E 保留环境变量"
  - "htop config.guess/config.sub 在 build-aux/ 子目录"
  - "patch-autotools-ohos.pl 漏加 kernel-os 白名单 linux-ohos*"
