software: htop
display: "htop"
description: "Interactive process viewer for Unix systems"
category: system
homepage: "https://htop.dev/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 sudo 权限运行，鸿蒙 SELinux 限制 /proc 文件系统访问"
    - "ncursesw 需静态链接以避免 SELinux 限制"
    - "sudo 后需使用 sudo -E 保留环境变量并设置 TERM 和 TERMINFO"
    - "config.guess/config.sub 在 build-aux/ 子目录（不在根目录）"
    - "htop 3.4.1 有 bug: linux/IOPriorityPanel.h 中 #include \"Panel.h\" 路径不正确"
    - "patch-autotools-ohos.pl 漏加 kernel-os 白名单 linux-ohos*，需手动补充"
  common_dependencies:
    - ncursesw

versions:
  "3.4.1":
    status: partial
    build_date: "2026-04-14"
