# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hlslpp/3.7
homepage: "https://github.com/redorav/hlslpp"

# 上游测试命令
# 上游使用 premake5（hlsl++.lua）生成工程，无 CMake/autotools/meson 测试入口；
# 本配方自带 test_upstream/CMakeLists.txt 编译同一批 unit_tests/*.cpp 源文件。
upstream_check_command: "./Linux.sh && make -C workspace/gmake2 config=release_linux64_clang"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --test-dir <build_folder>   # 命令: hlslpp_unit_tests unit_tests appveyor"

# 上游实际运行的测试程序
# 上游 unit_tests/unit_tests.cpp 内含 main() 与 hlslpp_unit 断言框架实现，
# 其余 .cpp 提供各分类测试函数。argv[1]="unit_tests" 只跑单元测试，
# argv[2]="appveyor" 逐用例输出 -Name/-Filename/-Outcome Passed|Failed。
upstream_tests:
  - file: unit_tests/unit_tests.cpp
    source: hlslpp-3.7/unit_tests/unit_tests.cpp
    description: "断言框架实现 + main()；含 experiments 与性能测试入口（本配方仅执行 unit_tests）"
    command: "./hlslpp_unit_tests unit_tests appveyor"
  - file: unit_tests/unit_tests_vector_float.cpp
    source: hlslpp-3.7/unit_tests/unit_tests_vector_float.cpp
    description: "float1~float4 向量：初始化/数组下标/赋值与 swizzle/踩踏/四则/比较/取负/函数/存取（12 用例）"
    command: "./hlslpp_unit_tests unit_tests appveyor"
  - file: unit_tests/unit_tests_vector_int.cpp
    source: hlslpp-3.7/unit_tests/unit_tests_vector_int.cpp
    description: "int/uint 向量：初始化/赋值与 swizzle/踩踏/四则/比较/位运算/整浮重解释/转换（12 用例）"
    command: "./hlslpp_unit_tests unit_tests appveyor"
  - file: unit_tests/unit_tests_vector_double.cpp
    source: hlslpp-3.7/unit_tests/unit_tests_vector_double.cpp
    description: "double 向量（NEON aarch64 自动开启 HLSLPP_DOUBLE）：初始化/赋值/踩踏/四则/取负/函数/存取（10 用例）"
    command: "./hlslpp_unit_tests unit_tests appveyor"
  - file: unit_tests/unit_tests_matrix_float.cpp
    source: hlslpp-3.7/unit_tests/unit_tests_matrix_float.cpp
    description: "float 矩阵 1x1~4x4：初始化/AllAny/乘法/转置/行列式/伴随/逆/存取（8 用例）"
    command: "./hlslpp_unit_tests unit_tests appveyor"
  - file: unit_tests/unit_tests_matrix_transform.cpp
    source: hlslpp-3.7/unit_tests/unit_tests_matrix_transform.cpp
    description: "变换矩阵（HLSLPP_FEATURE_TRANSFORM）：缩放/平移/旋转/相机 look_at+perspective+orthographic（4 用例）"
    command: "./hlslpp_unit_tests unit_tests appveyor"
  - file: unit_tests/unit_tests_quaternion.cpp
    source: hlslpp-3.7/unit_tests/unit_tests_quaternion.cpp
    description: "四元数：旋转轴/欧拉/与矩阵互转/共轭；并入 Vector Float 用例组上报"
    command: "./hlslpp_unit_tests unit_tests appveyor"
  - file: unit_tests/unit_tests_types_only.cpp
    source: hlslpp-3.7/unit_tests/unit_tests_types_only.cpp
    description: "仅包含类型头文件的编译可用性检查（无用例入口）"
    command: "./hlslpp_unit_tests unit_tests appveyor"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_hlslpp.cpp
    description: "消费者端到端：find_package(hlslpp) + include <hlsl++.h>，走 look_at/perspective 构造 MVP → 顶点变换（与手写参照逐分量比对）→ 四元数/矩阵/四元数转矩阵三条旋转路径互验 → 逆矩阵回环 → 关联性 → int4/标量缩放（30 项检查）"
    command: "./test_hlslpp"

# 测试断言总数
# 上游 unit_tests/*.cpp 中 hlslpp_check(...) 断言调用共 1061 处（grep -c hlslpp_check），
# 归入 46 个 BeginTest/EndTest 用例（appveyor 模式逐用例上报 Passed/Failed）。
assertion_count: 1061
