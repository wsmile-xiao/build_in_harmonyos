version: "3.7"

software: hlslpp

# 编译状态
# published | built | failed | archived
status: built

build_date: "2026-10-01"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/redorav/hlslpp"

  sha256: "819a3d20e5dcea27ee16903b6c96c309d1432c950f282791c06c8f27c2cb12f0"

  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 上游为 premake5 工程（hlsl++.lua / Linux.sh），无 CMake 入口；
  # 配方自带 test_upstream/CMakeLists.txt 驱动上游测试编译
  system: custom

  configure_options: []
  # 测试工程关键选项：
  # - "-DHLSLPP_SRC_DIR=<conan source_folder>"
  # - "-DCMAKE_CXX_FLAGS=-ffp-contract=off   # 仅上游测试翻译单元"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 库源码零修改（header-only 直接打包 include/）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "hlslpp 为 header-only 单头文件库，aarch64 由 config.h 依据 __aarch64__ 自动选择 NEON 后端（platforms/neon.h），无需任何编译选项"
  - "aarch64 的 NEON 路径在 __aarch64__ 下自动定义 HLSLPP_DOUBLE，double 向量测试默认启用；HLSLPP_FLOAT8 仅 SSE 定义，NEON 下不存在"
  - "aarch64 上 clang 默认 -ffp-contract=fast 且 ARMv8 强制具备 FMA，会让 a*b+c 融合成 fmla，对 tolerance=0.0f 的精确比较用例产生 +1 ULP 偏差；对测试翻译单元加 -ffp-contract=off 可恢复上游期望值（强制性 scalar 后端同样复现，证明与 NEON 实现无关）"
  - "Conan os=OHOS 交叉编译时 can_run() 恒为 False，但 profile 配置了 CMAKE_CROSSCOMPILING_EMULATOR 时二进制实际可执行；需显式回读该 conf 才能避免上游测试被静默跳过（rule4）"
  - "Conan 2.29.1 无 conan.tools.cmake.CTest 类，且 CMake.test(cli_args=[...]) 会把参数传给底层 make；应直接 self.run('ctest --output-on-failure --test-dir <build_folder>')"
  - "hlslpp 默认行主序且乘法顺序为 mul(vector, matrix)，元素映射 out[c] = sum_r v[r]*m[r][c]；矩阵下标 m[c][r] 先列后行"
