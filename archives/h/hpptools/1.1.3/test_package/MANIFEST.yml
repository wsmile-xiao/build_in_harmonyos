# test_package/MANIFEST.yml — hpptools 1.1.3 上游测试声明
# 上游测试入口: examples/ 目录下的 .make 文件（header-only 库，无 configure/ctest）
# 详见 docs/TEST_QUALITY_SPEC.md

package: hpptools/1.1.3
homepage: "https://github.com/mateidavid/hpptools"

# 上游测试命令: examples 下各 test/sample make 目标
upstream_check_command: "make -f examples/test-alg.make test && make -f examples/test-strict_fstream.make test"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（独立用户用例，均实际编译并运行通过）
upstream_tests:
  - file: examples/test-alg.cpp
    source: hpptools-1.1.3/examples/test-alg.cpp
    description: "alg.hpp 算法头文件 Catch 单元测试（9 个 TEST_CASE，410 断言）"
    command: "./test-alg"
  - file: examples/test-strict_fstream.cpp
    source: hpptools-1.1.3/examples/test-strict_fstream.cpp
    description: "strict_fstream.hpp 文件模式/错误处理测试（无 Catch TEST_CASE，main 直接断言）"
    command: "./test-strict_fstream"
  - file: examples/ztxtpipe.cpp
    source: hpptools-1.1.3/examples/ztxtpipe.cpp
    description: "zstr.hpp 无压缩管道与 gzip 输入往返一致性测试"
    command: "make -f test-strict_fstream.make test (ztxtpipe 往返用例)"
  - file: examples/zpipe.cpp
    source: hpptools-1.1.3/examples/zpipe.cpp
    description: "zstr.hpp 压缩/解压管道往返一致性测试"
    command: "make -f test-strict_fstream.make test (zpipe 往返用例)"
  - file: examples/zc.cpp
    source: hpptools-1.1.3/examples/zc.cpp
    description: "zstr.hpp 命令行压缩/解压工具（-c/-o）往返一致性测试；OHOS 补 #include <getopt.h>"
    command: "make -f test-strict_fstream.make test (zc 往返用例)"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package.cpp
    description: "消费者用例：仅用公开头文件调用 alg::for_each_it_advance/min_of/os_join 与 p7_FLogsum 并断言"
    command: "./test_hpptools"

# 测试断言总数（上游 test-alg 410 断言 + 本包消费者断言）
assertion_count: 415