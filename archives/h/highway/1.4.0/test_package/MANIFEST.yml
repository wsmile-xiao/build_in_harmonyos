package: highway/1.4.0
homepage: https://github.com/google/highway
upstream_check_command: "ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error"
upstream_inventory_method: "Full CTest JSON discovery from frozen CMake HWY_TEST_FILES configuration; require every discovered case, no disabled/skipped cases"
upstream_tests:
  - file: CMakeLists.txt
    source: highway-1.4.0/CMakeLists.txt
    description: "All core and contrib upstream cases via maintained HWY_TEST_STANDALONE assertion runner, all attainable native SIMD targets"
    command: "ctest --output-on-failure --no-tests=error"
test_package_tests:
  - file: consumer.cpp
    description: "Installed core and contrib targets, aligned SIMD add, runtime-dispatched integer sorting and OHOS private file roundtrip"
    command: "./bin/consumer"
assertion_count: 11
