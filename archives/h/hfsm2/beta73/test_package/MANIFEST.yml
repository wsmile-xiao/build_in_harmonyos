# test_package 自带测试（消费者视角验证，2 个可执行）
test_package_tests:
  - file: test_hfsm2.cpp
    description: "消费者 API 冒烟：PeerRoot/Composite/changeTo 迁移链 + isActive 轮询，断言 cycles=3"
    command: "ctest --output-on-failure -R test_hfsm2"
    result: "conan create 内构建+运行 PASS（PASS: hfsm2 header-only API OK (cycles=3)）"
  - file: test_hfsm2_ohos.cpp
    description: "HarmonyOS 专项测试：entry guard 首次拒绝/二次放行 + Orthogonal 区域 + changeTo 迁移链，断言 entryGuardHits=2、transitions=2"
    command: "ctest --output-on-failure -R test_hfsm2_ohos"
    result: "conan create 内构建+运行 PASS（PASS: hfsm2 OHOS guard+orthogonal+transition test OK）"

# 测试断言总数（上游 35691 断言 / 17 cases；test_package 2 个可执行）
assertion_count: 35691