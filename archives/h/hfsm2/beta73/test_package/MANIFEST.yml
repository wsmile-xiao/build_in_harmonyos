# test_package/MANIFEST.yml
# 上游官方测试声明 — hfsm2 Beta73（台账以实际运行结果为准；Conan 包引用为 hfsm2/beta73@ohpcd/stable）
package: hfsm2/beta73
homepage: https://github.com/andrew-gresyk/HFSM2

# 上游使用 Catch2 v2（bundled external/catch2），CMake 生成 hfsm2_test 单一可执行
# （project(hfsm2_test)，file(GLOB test/*.cpp test/shared/*.cpp)）
upstream_check_command: "clang++ -std=c++17 -fsigned-char -I external -I include test/*.cpp test/shared/*.cpp -o hfsm2_test && ./hfsm2_test"
upstream_test_in_build: false

# 上游 Catch2 测试 — 逐入口台账（17 个独立 TEST_CASE，双口径 17/17 通过）
upstream_tests:
  - file: test/deprecated_test.cpp
    source: hfsm2-Beta73/test/deprecated_test.cpp
    description: "FSM.Deprecated"
    command: "./hfsm2_test \"FSM.Deprecated\""
    result: "PASS"
  - file: test/test_composite_bst.cpp
