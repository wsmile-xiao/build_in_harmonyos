# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hackrf/2024.02.1-r1
homepage: "https://github.com/greatscottgadgets/hackrf"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# hackrf 上游无标准 make check 测试套件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 hackrf_library_version() 和 hackrf_init()/hackrf_exit() 验证库功能"
    command: "./test_hackrf"

# 测试断言总数
assertion_count: 3
