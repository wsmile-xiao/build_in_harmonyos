software: hyperfine
version: "1.20.0-r0"
status: published
build_date: "2026-06-02"
build_system: rust

source:
  url: "https://github.com/sharkdp/hyperfine/archive/refs/tags/v1.20.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: rust
  configure_options:
    - "precompiled_binary_from_alpine_musl"
  dependencies: []
  cc: clang
  cxx: clang++
  notes: "rustc SIGSEGV on musl platform; used Alpine aarch64 musl precompiled binary (hyperfine-1.20.0-r0.apk)"

patches_applied: []

knowledge_gained:
  - "E072: rustc SIGSEGV on musl platform - Rust projects must use precompiled binaries"
  - "E072: Alpine Linux aarch64 APK packages provide musl-linked binaries suitable for OpenHarmony"
  - "E072: hyperfine GitHub releases lack aarch64-musl variant; Alpine APK is the best source"
