software: h264bitstream
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# 构建系统类型（必填）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/h264bitstream/h264bitstream/0.2.0/h264bitstream-0.2.0.tar.gz"

  # 源码校验和
  sha256: "94912cb07ef67da762be9c580b325fd8957ad400793c9030f3fb6565c6d263a7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS umask 077 导致 autoconf config.status 临时目录无法写入（owner UID 不匹配），需改为 umask 007"
  - "h264bitstream 需要先用 autoreconf -fi 生成 configure 脚本"
  - "h264bitstream 无自带测试套件"
  - "h264_analyze --version 导致 segfault（软件自身bug），--help 正常"
  - "OpenHarmony patch 命令不支持 --input/-i 选项（E999 知识图谱草稿）"
  - "R6: 生成文件补丁（Makefile/config.log/config.status/libtool）不应保留"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/h264bitstream-0.2.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/h264bitstream-0.2.0.work
  source_orig_hash: 0e43ed00a657063e
  source_work_hash: 1c9577614825f9ce
  generated_at: '2026-06-17T17:01:03'
  patches_count: 4

patch_classification:
  - file: 0001-Makefile.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.log.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-config.status.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0004-libtool.patch
    type: auto
    platform_only: True
    guard: 'pending'
