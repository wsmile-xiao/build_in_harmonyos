# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: htmldoc/1.9.21
homepage: "https://michaelrsweet.github.io/htmldoc/"

# 上游测试命令（htmldoc 无 make check/ctest 目标；sdist 仅 htmldoc/testhtml.cxx
# 一个测试源文件，无独立测试套件）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（实测 2026-08-15，OHOS 环境）：
# - 上游 sdist 无独立测试套件（仅 htmldoc/testhtml.cxx 源文件，未构建为测试目标）
# - 功能验证以 test_package 冒烟替代：--version + 真实 HTML→PDF 转换
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_htmldoc.py
    description: "消费者测试：htmldoc --version（1.9.21）+ 真实 HTML→PDF 转换冒烟（验证 PDF 头 %PDF-）"
    command: "python3 test_htmldoc.py <htmldoc-bin>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
