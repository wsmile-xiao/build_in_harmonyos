# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hyprutils/0.3.0
homepage: "https://github.com/hyprwm/hyprutils"

# 上游测试命令：ctest（include(CTest) + add_test 6 个用例）
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（ctest 自动发现）
upstream_tests:
  - file: tests/memory.cpp
    description: "Memory 工具类单元测试（hyprutils_memory）"
    command: "ctest -R Memory"
  - file: tests/string.cpp
    description: "String 工具类单元测试（hyprutils_string）"
    command: "ctest -R String"
  - file: tests/signal.cpp
    description: "Signal 工具类单元测试（hyprutils_signal）"
    command: "ctest -R Signal"
  - file: tests/math.cpp
    description: "Math 工具类单元测试（hyprutils_math）"
    command: "ctest -R Math"
  - file: tests/os.cpp
    description: "OS 工具类单元测试（hyprutils_os，0.3.0 新增）"
    command: "ctest -R OS"
  - file: tests/filedescriptor.cpp
    description: "FileDescriptor 工具类单元测试（hyprutils_filedescriptor，0.3.0 新增）"
    command: "ctest -R Filedescriptor"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_hyprutils.sh
    description: "验证 hyprutils 头文件/libhyprutils.so/hyprutils.pc 存在（3 个断言）"
    command: "bash test_hyprutils.sh <pkg_dir>"
  - file: conanfile.py
    description: "验证 include/hyprutils 头文件目录存在（1 个断言）"
    command: "conan test"

# 测试断言总数：上游 6 个 ctest 用例 + test_package 4 个断言
assertion_count: 6
