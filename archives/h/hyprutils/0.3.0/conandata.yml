sources:
  url: "https://github.com/hyprwm/hyprutils/archive/refs/tags/v0.3.0.tar.gz"
  sha256: "07bf2d199aeb0e41e1bfe072572742acaf201f0af2bf76ff86a718605d2431bb"
patches:
  - patch_file: "patches/0001-disable-format-formatter.patch"
    patch_description: "Vector2D.hpp：std::format formatter 特化用 __cpp_lib_format 条件编译保护——OHOS libc++ 15 无 <format> 头（clang 15 工具链限制）；hyprpicker 不使用 Vector2D 的格式化功能"
    patch_type: "portability"
  - patch_file: "patches/0002-fix-ranges.patch"
    patch_description: "VarList.cpp：std::ranges::replace_if / std::views::split 在 libc++ 15 支持不完整，改为传统循环等价实现（先替换分隔符为 '\\0' 再按 '\\0' 切分）"
    patch_type: "portability"
  - patch_file: "patches/0003-fix-mat3x3-format.patch"
    patch_description: "Mat3x3.cpp：std::format 改用 snprintf 等价实现——OHOS libc++ 15 无 <format> 头（clang 15 工具链限制）；toString() 输出 9 个浮点数"
    patch_type: "portability"
