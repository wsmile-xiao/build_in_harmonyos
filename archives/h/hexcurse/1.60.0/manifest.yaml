knowledge_gained:
  - "旧版 config.guess 不识别 HarmonyOS，需从 automake-1.17 复制新版"
  - "configure 中 umask 077 与目录 SGID 位冲突导致权限拒绝"
  - "hexcurse 不支持 GNU --version/--help 长选项，需 patch parseArgs"
  - "系统 automake 版本与 tarball 不匹配时设 AUTOMAKE=/bin/true 阻止重生成"
  - "ncurses 可作为系统静态库使用，无需 Conan 依赖"

