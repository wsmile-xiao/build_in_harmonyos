software: html2text
version: "2.4.0"
status: published
build_date: "2026-05-19"

source:
  url: "https://gitlab.com/-/project/48313341/uploads/8526650dd42218b3493ce7ca0a3eeb1e/html2text-2.4.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--build=aarch64-unknown-linux-gnu"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "config.status 在 HMDFS 文件系统上无法创建临时文件，需要硬编码 tmp 目录"
  - "需要指定 CXX=clang++ 以正确链接 C++ 标准库"
  - "config.guess 无法识别 HarmonyOS，需要使用 --build=aarch64-unknown-linux-gnu"
