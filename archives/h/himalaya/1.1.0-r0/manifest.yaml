software: himalaya
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.0-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/pimalaya/himalaya/archive/refs/tags/v1.1.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: cargo

  # 配置选项列表
  configure_options:
    - "precompiled-musl-binary"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libc.musl-aarch64.so.1/system"
    - "libgcc_s.so.1/precompiled"

  # 编译器
  cc: clang
  cxx: clang++

  # 构建方式说明
  build_method: "pre-compiled-musl-binary"
  build_notes: "Rust项目，GitHub v1.1.0预编译glibc静态二进制在HarmonyOS上SIGSEGV。rustc本身在HarmonyOS上也崩溃(SIGSEGV)无法从源码编译。使用Alpine Linux himalaya 1.2.0-r0 aarch64 musl动态链接二进制作为替代部署方案。二进制报告版本为1.2.0而非1.1.0。"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Rust glibc静态二进制在HarmonyOS(musl)上SIGSEGV - 即使file显示static也不可用"
  - "rustc 1.96.0 musl版本在HarmonyOS上崩溃(SIGSEGV) - 无法从源码编译Rust项目"
  - "Alpine Linux musl预编译二进制可在HarmonyOS上运行 - 只需libc.musl-aarch64.so.1和libgcc_s.so.1"
  - "libc.musl-aarch64.so.1可由/lib/ld-musl-aarch64.so.1 symlink提供"
  - "binary-sign-tool self-sign可用于签名外部预编译二进制使其在HarmonyOS上可执行"
