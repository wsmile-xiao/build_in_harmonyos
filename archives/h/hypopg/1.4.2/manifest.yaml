software: hypopg
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.4.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-13"

# 构建系统类型（顶层字段，用于 G4 门禁检索）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/HypoPG/hypopg/archive/refs/tags/1.4.2.tar.gz"

  # 源码校验和
  sha256: "30596ca3d71b33af53326cdf27ed9fc794dc6db33864c531fde1e48c1bf7de7d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # PGXS (PostgreSQL Extension Building Infrastructure)
  system: custom

  # 配置选项列表 — PGXS 无 configure，需传递 pkgincludedir
  configure_options:
  - "pkgincludedir=/storage/Users/currentUser/usr/local/include"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - postgresql/16.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "hypopg 使用 PGXS 构建系统，不需要传统 configure 步骤"
  - "pg_config 缺少 --pkgincludedir 支持，需要手动传递 pkgincludedir 参数给 make"
  - "PGXS 扩展的产物是 .so 文件 + .control 文件 + SQL 脚本，非独立可执行程序"
