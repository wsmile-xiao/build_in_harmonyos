software: hash
display: "hash"
description: "C hash implementation based on khash (string-keyed pointer hash table, clibs)"
category: data
homepage: "https://github.com/clibs/hash"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "无独立库构建目标：上游 Makefile 只有 test 目标（-DTEST_HASH），库需配方直接编译 hash.c 并打包头文件"
    - "纯 C99 + POSIX，无外部依赖，clang 直接编译通过"
    - "C99 inline 定义函数（hash_set/get/has/del）经 -std=c99 编译为外部 T 符号，可正常链接为静态库"
  common_dependencies: []

versions:
  "0.0.1":
    status: published
    build_date: "2026-09-18"