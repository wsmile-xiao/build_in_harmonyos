# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hcxtools/7.1.2
homepage: "https://github.com/ZerBea/hcxtools"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# hcxtools Makefile has no "check" target — upstream testing is manual
# (running each tool with --version / --help to verify functionality)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# hcxtools has no automated test suite; verification is via --version flags
upstream_tests:
  - file: hcxpcapngtool.c
    source: hcxtools-7.1.2/hcxpcapngtool.c
    description: "Main pcapng conversion tool — verified via --version"
    command: "hcxpcapngtool --version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "Runs hcxpcapngtool --version to verify the installed binary works"
    command: "hcxpcapngtool --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
