software: hdf5
build_system: cmake
version: "1.14.4"
status: built
build_date: "2026-05-20"

source:
  url: "https://gh-proxy.com/https://github.com/HDFGroup/hdf5/archive/refs/tags/hdf5-1_14_4.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DHDF5_BUILD_CPP_LIB=ON"
    - "-DHDF5_BUILD_HL_LIB=ON"
    - "-DHDF5_BUILD_TOOLS=ON"
    - "-DHDF5_ENABLE_THREADSAFE=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained: []
