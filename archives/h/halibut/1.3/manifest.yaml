software: halibut
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-01"

# 构建系统（扁平字段，verify-build 检查）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.chiark.greenend.org.uk/~sgtatham/halibut/halibut-1.3/halibut-1.3.tar.gz"

  # 源码校验和
  sha256: "aaa0f7696f17f74f42d97d0880aa088f5d68ed3079f3ed15d13b6e74909d3132"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "cmake项目 charset/CMakeLists.txt cmake_minimum_required(VERSION 3.0) 与 CMake 4.x 不兼容，需要 CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "init-build 可能误识别 cmake 项目为 autotools，需手动修正 manifest.yaml 的 build_system"
    - "G0 clean-verify 脚本不支持 cmake 项目（尝试运行 ./configure），需手动验证干净构建"
    - "verify-build 检查顶级字段 build_system，manifest 嵌套格式 build.system 不被识别，需同时添加顶级字段"
