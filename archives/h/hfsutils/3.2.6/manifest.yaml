# 编译中学到的知识
knowledge_gained:
  - id: E111
    summary: "setreuid/setregid是OpenHarmony未实现syscall(E051),需用__OHOS__守卫替代为setuid/setgid"
    patch: 0002-suid.c.patch
    confidence: high
  - id: E110
    summary: "HMDFS不支持硬链接,hfsutils安装需改用符号链接并保留原始二进制"
    patch: 0001-Makefile.in.patch
    confidence: high
  - id: E112
    summary: "老式autotools Makefile不支持DESTDIR,需手动添加$(DESTDIR)前缀和mkdir -p"
    patch: 0001-Makefile.in.patch
    confidence: high
