# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: hunspell/1.7.3
homepage: "https://hunspell.github.io"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
# CI 实测证据：曾在 OHOS aarch64 worker 集成 make check（PR #8449 build #40559），
# 145 项回归 133 FAIL / 11 PASS / 1 SKIP。根因：conan 分离构建（out-of-tree VPATH）
# 下 tests/ 数据（.aff/.dic/.good/.wrong 全量随源码，无网络依赖）未复制到 builddir，
# 且 test.sh 驱动新编译 hunspell CLI 逐词典跑输出 diff —— OHOS 沙箱/构建模式限制，
# 非产物缺陷。由 test_package 消费者视角实跑 spell() 承担实质验证（R34）。
upstream_test_command: "make check (attempted on OHOS CI #40559: 133/145 FAIL, env-level)"

# 上游实际运行的测试程序（tests/ 目录 145 项 .dic/.test 回归）
upstream_tests:
  - file: tests/test.sh
    source: hunspell-1.7.3/tests/test.sh
    description: "上游 spell 引擎回归（.dic 词典 + .good/.wrong/.root/.morph/.sug 期望）"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "链接 libhunspell-1.7 加载迷你词典 test.aff/test.dic，spell() 命中 hello/world、未命中 helo"
    command: "./test_hunspell"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
