software: hunspell
display: "Hunspell"
description: "开源拼写检查库和工具，支持多种语言词典"
category: doc
homepage: "https://hunspell.github.io"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 需添加 HarmonyOS case 分支（E007）"
    - "config.sub 需在三处添加 ohos 支持（E072）"
    - "HMDFS 临时目录限制：umask 077 导致 setgid 位，需移除并使用 TMPDIR"
    - "HMDFS 符号链接问题：动态链接器无法解析，需 cp -a 替换为实际文件"
  common_dependencies: []

versions:
