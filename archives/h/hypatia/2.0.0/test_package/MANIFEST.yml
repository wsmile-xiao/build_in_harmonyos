# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hypatia/2.0.0
homepage: "https://github.com/dagostinelli/hypatia"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
# Header-only 库无 build() 阶段，上游测试在独立的 test/ 目录
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (CMake CTest)
upstream_tests:
  - file: test/main.c + test/implementation.c + test/test_*.c
    source: hypatia-2.0.0/test/
    description: "单精度浮点数学函数测试 (vector2/3, matrix3/4, quaternion, experimental)"
    command: "test_hypatia_single_precision"
  - file: test/main.c + test/implementation.c + test/test_*.c
    source: hypatia-2.0.0/test/
    description: "双精度浮点数学函数测试 (vector2/3, matrix3/4, quaternion, experimental)"
    command: "test_hypatia_double_precision"

# 上游测试说明
# - test_vector2.c: 2D 向量运算
# - test_vector3.c: 3D 向量运算（叉积、点积、归一化等）
# - test_matrix3.c: 3x3 矩阵运算
# - test_matrix4.c: 4x4 矩阵运算（变换矩阵、投影等）
# - test_quaternion.c: 四元数运算（旋转等）
# - test_experimental.c: 实验性功能
# Header-only 库无需编译，上游测试完整覆盖所有数学函数

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：验证 header-only 库可正常 include 并使用 vector3 叉积 API"
    command: "./test_hypatia"

# 测试断言总数 (近似值, 用于质量评估)
# 基于上游 test/*.c 文件中的 assert 语句数量估算
assertion_count: 150
