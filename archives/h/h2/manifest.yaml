software: h2
display: "H2 Database Engine"
description: "H2 is a relational database management system written in Java. It can be embedded in Java applications or run in client-server mode."
category: db
homepage: "https://h2database.com"
license: MPL-2.0
build_system: maven

ohos_adaptation:
  key_points:
    - "Java-based project, no ELF signature needed"
    - "Requires OpenJDK 17+ (BiSheng JDK available)"
    - "Maven repository should use cache directory to avoid HMDFS permission issues"
  common_dependencies:
    - java >= 8
    - maven >= 3.6

versions:
