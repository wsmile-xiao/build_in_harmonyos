package: hamlib/4.7.2
homepage: "https://hamlib.github.io/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: build-check
    command: "make check"
    expected: "run on a target-capable OHOS worker; cross builds defer execution"
  - file: tests/rigctl.c
    description: "Upstream rigctl command test source"
  - file: tests/rig_tests.c
    description: "Upstream rig capability test source"

test_package_tests:
  - file: test.c
    description: "Load Hamlib backends, query dummy capabilities, initialize and clean up a dummy rig"
    command: "./hamlib_test"

assertion_count: 4
