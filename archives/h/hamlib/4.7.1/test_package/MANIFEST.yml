# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hamlib/4.7.1
homepage: "https://hamlib.github.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 实跑证据: reports/conan-create.log -> "# TOTAL: 11 / # PASS: 11 / # FAIL: 0"
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\", args=[\"-j1\"]) in conanfile.py build()"

# 上游实际运行的测试程序 (tests/Makefile.am TESTS = $(check_SCRIPTS), 11 个脚本)
upstream_tests:
  - file: amptest.sh
    source: hamlib-4.7.1/tests/amptest.sh
    description: "功放(amp)生命周期与 caps 测试"
    command: "make check (tests/)"
  - file: test2038.sh
    source: hamlib-4.7.1/tests/test2038.sh
    description: "2038 年时间溢出测试"
    command: "make check (tests/)"
  - file: testbcd.sh
    source: hamlib-4.7.1/tests/testbcd.sh
    description: "BCD 编码测试"
    command: "make check (tests/)"
  - file: testcache.sh
    source: hamlib-4.7.1/tests/testcache.sh
    description: "缓存超时机制测试"
    command: "make check (tests/)"
  - file: testcaps.sh
    source: hamlib-4.7.1/tests/testcaps.sh
    description: "caps 表完整性测试"
    command: "make check (tests/)"
  - file: testcookie.sh
    source: hamlib-4.7.1/tests/testcookie.sh
    description: "cookie 机制测试"
    command: "make check (tests/)"
  - file: testfreq.sh
    source: hamlib-4.7.1/tests/testfreq.sh
    description: "频率格式化/解析测试"
    command: "make check (tests/)"
  - file: testgrid.sh
    source: hamlib-4.7.1/tests/testgrid.sh
    description: "Maidenhead 网格坐标换算测试"
    command: "make check (tests/)"
  - file: testloc.sh
    source: hamlib-4.7.1/tests/testloc.sh
    description: "定位换算测试"
    command: "make check (tests/)"
  - file: testrig.sh
    source: hamlib-4.7.1/tests/testrig.sh
    description: "rig_init/open/close/cleanup 生命周期测试"
    command: "make check (tests/)"
  - file: testrigcaps.sh
    source: hamlib-4.7.1/tests/testrigcaps.sh
    description: "全型号 rig caps dump 一致性测试"
    command: "make check (tests/)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 版本校验 + 全后端型号枚举 + Dummy rig init/open/set_freq/get_freq/close/cleanup + mode 解析回环"
    command: "./test_hamlib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
