# conandata.yml — hamlib 4.7.1
# 官方 release tarball（make dist 产物，自带 configure，无需 autoreconf/bootstrap）
#
# R39: 只登记官方源，镜像由 CI 兜底注入。ci/conan/build_and_test.sh 的
# "Mirror fallback" 步骤会把单值 `url:` 自动改写为 [gh-proxy, 官方] 列表
# （函数 get_mirrors()），因此**不要**在配方里硬编码镜像域名：
#   - 列表形式的 `url:`（多项）不匹配该步骤的正则 → CI 的镜像注入被静默跳过；
#   - 实测 worker 上 github.com 直连 30s×2 次超时（~70s）才回退镜像；
#     单值形式下 CI 会把 gh-proxy 放在首位，首次尝试即命中。
sources:
  url: "https://github.com/Hamlib/Hamlib/releases/download/4.7.1/hamlib-4.7.1.tar.gz"
  sha256: "d197a08a3d5d936d7571ae573f745bbba619e88998742c8267e3fcb0fb3d5974"

patches:
  # --- 上游源码缺陷（musl libc 暴露）---
  - patch_file: "patches/0001-src-misc.c.patch"
    patch_description: >-
      Add a pthread_cancel() shim for musl libc (OHOS). musl does not implement
      pthread_cancel(); rig.c/ars.c call it to asynchronously tear down helper
      threads. The shim returns 0 and the callers keep their normal join-based
      cleanup path. Guarded by a libc probe (musl has no __GLIBC__), so
      glibc/Android builds keep the platform implementation.
    patch_type: "portability"
  - patch_file: "patches/0002-src-network.c.patch"
    patch_description: >-
      Guard <linux/wireless.h> with a libc probe: on OHOS the kernel uapi
      header linux/socket.h redefines struct sockaddr_storage and clashes with
      musl's sys/socket.h. Wireless-extension probing (is_wireless_linux) is
      non-essential, so it is limited to glibc-based Linux.
    patch_type: "portability"
  - patch_file: "patches/0004-rigs-harris-harris.h.patch"
    patch_description: >-
      Fix upstream typo: harris_get_bw() prototype used mode_t instead of the
      hamlib type rmode_t. glibc leaks mode_t via sys/types.h so it compiled
      there; musl/OHOS does not, and the build fails with "unknown type name
      'mode_t'".
    patch_type: "portability"
  # --- Autotools / 平台适配 ---
  - patch_file: "patches/0003-build-aux-config.guess.patch"
    patch_description: >-
      E007: the config.guess shipped in this release has no HarmonyOS support,
      so on the device (uname -s = HarmonyOS) configure aborts with "cannot
      guess build type". Adds an __OHOS__ -> LIBC=ohos probe to the libc
      sniffer and a `*:HarmonyOS:*:*` branch that emits
      <machine>-unknown-linux-ohos. Note: config.sub of this release already
      accepts that triplet (ohos* in the OS list, linux-ohos* in the kernel
      list), so no config.sub patch is needed.
    patch_type: "portability"
  - patch_file: "patches/0005-configure-umask.patch"
    patch_description: >-
      E114: drop `umask 077` from the config.status temp-dir creation inside
      the generated configure. HMDFS ignores chmod and forces setgid on
      directories, so `umask 077 && mktemp -d ./confXXXXXX` yields a temp dir
      that is not writable even by its owner and configure dies with "could
      not setup config files machinery" (Permission denied on subs1.awk).
    patch_type: "platform"
