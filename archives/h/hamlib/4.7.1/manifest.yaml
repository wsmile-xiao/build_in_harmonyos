  note: "上游 tests/Makefile.am TESTS 11 个脚本全部执行并通过（build() 内 autotools.make(target=\"check\", args=[\"-j1\"])），另有 src/testcpp 1/1；consumer test_package 1/1 Passed（ctest 驱动 + test() 内直接执行安装后的 test_hamlib，310 rig models 枚举 / Dummy rig 频率往返 / 模式往返）。本地 CI 全流程（ci/conan/build_and_test.sh）L0/KC/JC/G0/G0e/L1/L2/L4/L5 全部通过。"

knowledge_gained:
  - "hamlib 的 GitHub tag 归档不含 configure，必须用官方 release tarball（make dist 产物），否则 CI 需要 autoreconf/bootstrap。"
  - "musl/OHOS 下 harris.h 的 mode_t 原型笔误、pthread_cancel 未定义、<linux/wireless.h> 与 sys/socket.h 的 sockaddr_storage 冲突三处均需补丁，且用 libc 探针而非 __OHOS__ 宏。"
  - "G0 clean-verify 不执行 build()，因此 configure 内的 HMDFS umask 077 问题必须落成 patches/0005 补丁而不能用配方运行时改写。"
  - "clean_verify.py 默认 CONFIG_SHELL=/data/service/hnp/bin/bash 在 HMDFS 子目录 getcwd() 失败，需 CONFIG_SHELL=/bin/sh 覆盖。"

