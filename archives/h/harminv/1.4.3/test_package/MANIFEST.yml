# test_package/MANIFEST.yml — harminv 1.4.3

package: harminv/1.4.3
homepage: https://github.com/NanoComp/harminv

# 上游测试命令
upstream_check_command: "sines-test.sh (uses ./sines | ./harminv)"

# 上游实际运行的测试程序
upstream_tests:
  - file: sines-test.sh
    source: harminv-1.4.3/sines-test.sh
    description: "End-to-end test: generates known sinusoidal signal, runs harminv inversion, verifies frequency/decay recovery"
    command: "sh sines-test.sh"
    evidence_log: ../reports/upstream-test.log

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "Consumer API test: exercises harminv_data_create / harminv_solve / harminv_get_freq on known data (not a trivial printf assertion)"
    command: "./test_harminv"

# rule12: OHOS 特有的非断言消费者可行性测试
ohos_specific_tests:
  - location: conanfile.py::HarminvTestConan._ohos_consumer_feasibility
    description: "Non-assertion OHOS consumer feasibility check: walks the DT_NEEDED shared-library closure of the packaged bin/harminv ELF, reports per-entry resolvability in the OHOS runtime (/system/lib64 probe). Reports via output only — never hard-fails."
    type: "non-assertion (informational reporting)"

# 测试断言总数 (近似值)
assertion_count: 4
