software: http-parser
display: "http-parser"
description: "HTTP request/response parser for C (nodejs/http-parser)"
category: library
homepage: "https://github.com/nodejs/http-parser"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建，无 configure、无外部依赖，HNP clang 直接编译通过"
    - "-Wall -Wextra -Werror 下无告警，无需补丁"
    - "静态库对象以 -fPIC 编译（CFLAGS_FAST_EXTRA=-fPIC），便于下游链入共享库"
    - "上游测试 make test（test_g + test_fast）在 OHOS 上完整通过"
    - "编译器路径从 Conan conf 获取 (R33)"
  common_dependencies: []

versions:
  "2.9.4":
    status: built
    build_date: "2026-08-16"
