# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: http-parser/2.9.4
homepage: "https://github.com/nodejs/http-parser"

# 上游测试命令 (make -n test 分析: test → test_g + test_fast 并运行)
upstream_check_command: "make test"

# conanfile.py build() 中已集成上游测试 (make test)
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序 (test.c 单一二进制, strict/fast 两个变体)
upstream_tests:
  - file: test.c
    source: http-parser-2.9.4.tar.gz/test.c
    description: "上游官方测试: 26 组 test_* 函数(API/URL/头字段/溢出/请求响应扫描), 50 处 assert"
    command: "./test_g"
  - file: test.c
    source: http-parser-2.9.4.tar.gz/test.c
    description: "上游官方测试 (HTTP_PARSER_STRICT=0 快速模式)"
    command: "./test_fast"

# test_package 中自带的测试 (消费者视角验证, R34: 真实调用被测库 API)
test_package_tests:
  - file: test_http_parser.c
    description: "消费者视角: 版本/请求解析/响应解析/chunked/parse_url/辅助 API, 53 个断言"
    command: "./test_probe"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 103
