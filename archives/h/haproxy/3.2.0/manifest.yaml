# HAProxy 3.2.0 构建清单
# HAProxy 3.2.0 Build Manifest

software:
  name: haproxy
  version: 3.2.0
  description: HAProxy - Reliable, High Performance TCP/HTTP Load Balancer
  homepage: https://www.haproxy.org/
  license: GPL-2.0-or-later

status: published

build:
  platform: OpenHarmony
  architecture: aarch64
  date: 2026-05-23
  compiler: gcc
  build_env: TMPDIR=/data/storage/el2/base/cache
  
dependencies:
  - name: openssl
    version: ">=1.1.1"
    required: true
    description: SSL/TLS 加密库
  - name: zlib
    version: ">=1.2.11"
    required: true
    description: 压缩库
  - name: pcre2
    version: ">=10.0"
    required: true
    description: 正则表达式库
    
features:
  - ssl
  - compression
  - pcre2
  - http2
  - prometheus-exporter

artifacts:
  bin:
    - name: haproxy
      type: executable
      size: 14M
      format: ELF 64-bit LSB arm64, dynamic linked

notes:
  - HAProxy is a dynamic executable linked against musl libc
  - Requires OpenSSL, zlib, and pcre2 libraries at runtime
  - Suitable for production use on OpenHarmony aarch64 systems