# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: haproxy/3.2.0
homepage: "https://www.haproxy.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make reg-tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (reg-tests 需要 vtest 程序，OHOS 上不可用)
upstream_tests:
  - file: "reg-tests/"
    source: "haproxy-3.2.0/reg-tests/"
    description: "Regression tests (require vtest program, not available on OHOS)"
    command: "make reg-tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "conanfile.py"
    description: "Verify haproxy binary can execute and report version"
    command: "haproxy -v"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
