# test_package/MANIFEST.yml
package: hedley/15
homepage: "https://github.com/nemequ/hedley"

upstream_check_command: "make all (test/Makefile): build 35 compile-check sources as C and as C++"
upstream_test_in_build: true
upstream_test_command: "compile checks + execution of all produced binaries"

upstream_tests:
  - file: test/*.c
    source: hedley-15/test/*.c (35 files)
    description: >-
      Upstream ships no runtime test framework. test/Makefile (make all)
      compiles each of the 35 compile-check sources once as C and once as
      C++ (.c copied to .cpp); passing = compiles cleanly, validating that
      every hedley macro expands to valid code for the target compiler.
      build() reproduces this (70 compile checks, 70/70 OK) and also runs
      all 70 produced binaries; 24 of them return computed values by design
      (upstream never runs them), so non-zero exits are informational.
    command: "70 compile checks + 70 binary executions"

test_package_tests:
  - file: test.c
    description: >-
      Consumer-side API validation: 10 CHECKs exercising real hedley macros
      (HEDLEY_VERSION, version encode/decode, LIKELY/UNLIKELY, CONST/PURE
      functions, STATIC_CAST, CONCAT, STRINGIFY, DIAGNOSTIC_PUSH/POP).
      Returns non-zero on any failed check.
    command: "./test_hedley"

assertion_count: 10
