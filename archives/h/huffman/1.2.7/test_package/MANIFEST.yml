# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: huffman/1.2.7
homepage: "https://github.com/drichardson/huffman"

# 上游测试命令 (run_tests.sh，OHOS 无 /bin/bash，recipe build() 用 bash 显式调用)
upstream_check_command: "bash run_tests.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "bash run_tests.sh"

# 上游实际运行的测试程序
upstream_tests:
  - file: run_tests.sh
    source: huffman-1.2.7/run_tests.sh
    description: "压缩-解压往返一致性测试（compress_test：9 组 test_data 文件）"
    command: "./huffcode -i <in> -o <out>.compressed && huffcode -d -i <out>.compressed -o <out>.decompressed && diff <out>.decompressed <in>"
  - file: run_tests.sh
    source: huffman-1.2.7/run_tests.sh
    description: "Issue 2 回归：损坏码表拒绝解码（decompress_test，期望退出码 1 不崩溃）"
    command: "./huffcode -d -i <corrupt> -o <out>.decompressed; expect exit 1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：huffman_encode_memory / huffman_decode_memory 内存往返一致性"
    command: "./test_huffman"

# 测试断言总数 (近似值: 9 组往返 diff + 14 个 issue2 回归用例 + 1 个消费者往返)
assertion_count: 24
