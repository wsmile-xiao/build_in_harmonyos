software: hellwal
display: "hellwal"
description: "快速、可扩展的调色板生成器 — 从图片或主题生成终端配色方案"
category: utils
homepage: "https://github.com/danihek/hellwal"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "实际是 Makefile 项目（非 autotools），registry 标记有误"
    - "原始 Makefile DESTDIR 用法非标准（作为安装路径而非 staging 根），需改为标准 DESTDIR+PREFIX 模式 (ref:E035)"
    - "CFLAGS/LDFLAGS 使用 = 覆盖环境变量，需改为 += 兼容 -fPIC 等环境参数"
    - "PATH 中无 cc 软链接，使用 CC=clang 解决 (ref:E001)"
  common_dependencies: []

versions:
  "1.0.7":
    status: published
    build_date: "2026-06-12"