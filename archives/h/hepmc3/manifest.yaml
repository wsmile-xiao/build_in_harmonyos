software: hepmc3
display: "HepMC3"
description: "C++ Event Record library for High Energy Physics (Monte Carlo)"
category: science
homepage: "https://hepmc.hepforge.org/"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "零外部依赖（纯C++标准库+pthread），适配简单"
    - "CMake构建，无补丁需求"
    - "禁用ROOT I/O和外部接口（Pythia8/Photos/Tauola），仅编译核心库+search库"
    - "静态库使用_static后缀（libHepMC3_static.a / libHepMC3search_static.a）"
    - "shared=False时手动删除.so文件（上游CMake无条件构建双版本）"
  common_dependencies: []

versions:
  "3.1.2":
    status: built
    build_date: "2026-08-10"
    note: "ctest 14/14 PASSED + test_package OK (2026-08-10 鸿蒙PC实机验证)"
