# 编译中学到的知识
knowledge_gained:
  - "aarch64/OHOS 上 hippomocks CFUNC 打桩不可用：上游 ARM 路径仅写 32 位 ARM 指令，且文本页 mprotect RWX 被 OHOS W^X 拒绝（EINVAL）；禁用该特性后虚拟函数打桩不受影响（DRAFT-hippomocks-5.0-cfunc-mock-aarch64-wx）"
  - "clang 将 __clear_cache 作为内建函数（void(void*,void*)），上游 char* 重声明冲突，改为 void* 即可"

