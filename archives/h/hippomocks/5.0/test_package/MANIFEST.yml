# 上游官方测试声明文件 — hippomocks 5.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: hippomocks/5.0
homepage: "https://github.com/dascandy/hippomocks"

# 上游测试入口：HippoMocksTest/ 自研轻量框架（Framework.h 的 TEST() 宏）
# 枚举规则：对 HippoMocksTest/*.cpp 中 `TEST (...)` 声明行可复制枚举
upstream_check_command: "cmake -S . -B build && cmake --build build && ./build/HippoMocksTest/HippoMocksTests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: HippoMocksTest/*.cpp (28 个测试源文件)
    source: hippomocks-5.0/HippoMocksTest/
    description: "上游 TEST() 宏声明共 84 个独立用例；OHOS aarch64 配置下实例化 75 个并全部通过（75/75），9 个未实例化：6 个 MSVC-only stdcall 用例、3 个 CFUNC 用例（aarch64 禁用该特性且上游 ARM 路径仅支持 32 位）"
    command: "./build/HippoMocksTest/HippoMocksTests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者用例：仅通过公开头文件与公开 API（MockRepository/Mock/ExpectCall/Return/With）模拟业务组件验证编译链接运行，调用公开 API 并核对可观察结果"
    command: "./test_hippomocks"
  - file: test_ohos.cpp
    description: "鸿蒙专项测试：在 OHOS aarch64 平台验证虚拟函数打桩可运行、CFUNC 禁用补丁后头文件仍可完整编译、公开 API 返回可观察结果（与上游测试、消费者用例分别计数）"
    command: "./test_hippomocks_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 84