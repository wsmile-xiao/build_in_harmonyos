name: heimdal
version: 7.8.0
description: Heimdal — Kerberos 5 implementation
license: BSD-3-Clause
homepage: https://www.h5l.org/
upstream: https://github.com/heimdal/heimdal
adaptation:
  path: A
  toolchain: clang 15 / autotools (configure + make)
  notes: |
    heimdal 是 Kerberos 5 认证协议实现（KTH 开发），含 KDC/kinit/klist 等
    客户端+服务端。autotools 构建（官方 tar.gz 含 configure 产物，无需
    autogen 自举），自带 hcrypto/roken/com_err/wind 子库自包含。
    鸿蒙适配（同 krb5/1.22.1 先例 + E114/E216 知识）：
    1) config.guess/config.sub 补鸿蒙识别（0001/0002 patch，同 krb5）；
    2) E114 ac_tmp/TMPDIR patch（0003）：configure conftest 在 HMDFS 沙箱
       写临时文件被拦（"C compiler cannot create executables"），ac_tmp
       重定向到可写目录；
    3) 依赖 sqlite3（--with-db-type-preference=sqlite）、libedit、gettext
       （libintl）、libxcrypt 均制品仓已发布，flex 作 tool_requires；
    4) configure 参数参考 Chimera cports：--enable-kcm --without-openssl
       --with-hcrypto-default-backend=hcrypto。
test:
  assert_count: 2
  cases:
    - 上游 make check（上游自带测试套件）
    - test_package 链接 heimdal 库并调用 API
