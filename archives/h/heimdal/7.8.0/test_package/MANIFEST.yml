# test_package/MANIFEST.yml — heimdal 7.8.0
# 上游官方测试声明文件（L0e 门禁要求）
package: heimdal/7.8.0
homepage: "https://www.h5l.org/"

# 上游测试命令（heimdal Makefile 中的 make check）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/check
    source: heimdal-7.8.0/tests/
    description: "heimdal 上游测试套件（make check 驱动）"
    command: "make check"

# test_package 中自带的测试（消费者视角验证库可用）
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libkrb5 并调用 krb5_init_context() 初始化 Kerberos 上下文"
    command: "test_heimdal"

# 测试断言总数
assertion_count: 1
