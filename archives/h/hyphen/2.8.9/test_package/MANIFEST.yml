# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hyphen/2.8.9
homepage: "https://github.com/hunspell/hyphen"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 来源: tests/Makefile.am TESTS 声明 37 项 .test（每项经 test.sh 调用 example
#       程序并对 .hyph 期望输出做 diff），本地实测 37/37 PASS
upstream_tests:
  - file: tests/basealt2.test
    source: hyphen-2.8.9/tests/basealt2.test
    description: "basealt2 断词测试 (test.sh basealt2.pat basealt2.word basealt2.hyph)"
    command: "make check"
  - file: tests/basealt.test
    source: hyphen-2.8.9/tests/basealt.test
    description: "basealt 断词测试"
    command: "make check"
  - file: tests/base.test
    source: hyphen-2.8.9/tests/base.test
    description: "base 基础断词测试"
    command: "make check"
  - file: tests/conv.test
    source: hyphen-2.8.9/tests/conv.test
    description: "conv 转换测试"
    command: "make check"
  - file: tests/unicode.test
    source: hyphen-2.8.9/tests/unicode.test
    description: "unicode 多字节断词测试"
    command: "make check"
  - file: tests/alt.test
    source: hyphen-2.8.9/tests/alt.test
    description: "alt 交替模式测试"
    command: "make check"
  - file: tests/compound.test
    source: hyphen-2.8.9/tests/compound.test
    description: "compound 复合词测试"
    command: "make check"
  - file: tests/settings.test
    source: hyphen-2.8.9/tests/settings.test
    description: "settings 设置项测试"
    command: "make check"
  - file: tests/lhmin.test
    source: hyphen-2.8.9/tests/lhmin.test
    description: "lhmin 左侧最小断词数测试"
    command: "make check"
  - file: tests/rhmin.test
    source: hyphen-2.8.9/tests/rhmin.test
    description: "rhmin 右侧最小断词数测试"
    command: "make check"
  - file: tests/lig.test
    source: hyphen-2.8.9/tests/lig.test
    description: "lig 连字测试"
    command: "make check"
  - file: tests/hyphen.test
    source: hyphen-2.8.9/tests/hyphen.test
    description: "hyphen 主测试"
    command: "make check"
  - file: tests/num.test
    source: hyphen-2.8.9/tests/num.test
    description: "num 数字断词测试"
    command: "make check"
  - file: tests/boundary.test
    source: hyphen-2.8.9/tests/boundary.test
    description: "boundary 边界测试"
    command: "make check"
  - file: tests/recursion.test
    source: hyphen-2.8.9/tests/recursion.test
    description: "recursion 递归测试"
    command: "make check"
  - file: tests/nohyphen2.test
    source: hyphen-2.8.9/tests/nohyphen2.test
    description: "nohyphen2 禁断词测试"
    command: "make check"
  - file: tests/nohyphen3.test
    source: hyphen-2.8.9/tests/nohyphen3.test
    description: "nohyphen3 禁断词测试"
    command: "make check"
  - file: tests/utf8cut.test
    source: hyphen-2.8.9/tests/utf8cut.test
    description: "utf8cut UTF-8 边界截断测试"
    command: "make check"
  # 其余 19 项同模式（alt2-alt7、compound2-compound7、settings2-settings4、
  # rhmin2、replindex、matchindex），源码 tests/Makefile.am TESTS 共 37 项，
  # 本地 make check 实测 37/37 PASS，完整台账见 archives/.../notes.md

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "L1 测试：加载已安装 hyph_en_US.dic 并对 example/abbreviations 调用 hnj_hyphen_hyphenate2 验证断词点"
    command: "./test_hyphen <dict路径>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
