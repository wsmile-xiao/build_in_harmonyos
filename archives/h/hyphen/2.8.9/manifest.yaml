# 版本级 manifest — hyphen 2.8.9
# 遵循 ARCHIVE-SPEC v2.0

version: "2.8.9"

# 软件名
software: hyphen

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39；CI 会自动添加镜像 fallback）
  url: "https://github.com/hunspell/hyphen/releases/download/v2.8.9/hyphen-2.8.9.tar.gz"

  # 源码校验和（SHA-256，与 conandata.yml 一致）
  sha256: "783743daf477de8c4d16e3c74b4d2827377017718d8e17e2d9440210246f6abe"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"
    - "--disable-shared"

  # 编译依赖列表（格式: name/version），本库无外部 Conan 依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（refresh-patch --auto 生成）
patches_applied:
  - "patches/0001-config.guess.patch"
  - "patches/0002-config.sub.patch"
  - "patches/0003-configure.patch"
  - "patches/0004-tests-test.sh.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（可跨库复用候选，详见 notes.md 知识候选台账）
knowledge_gained:
  - "config.guess/config.sub 需注入 __OHOS__/ohos-linux 支持（E007/E160/E268 标准方案，patch-autotools-ohos.pl）"
  - "configure/config.status 临时目录 umask 077 在 HMDFS 上不可写：toybox mktemp 遵循 umask（002→2771 可写），GNU mktemp 恒 0700 需 mkdir -m 0777（E011 家族 + toybox/GNU 分诊，草稿 hyphen-2.8.9-autotools-mktemp-umask-toybox-gnu）"
  - "test.sh 等脚本 #!/bin/bash shebang 在 OHOS 无 /bin/bash：改为 #!/usr/bin/env bash（E037/E049/E165）"

patch_generation:
  method: per-file-difflib
  patches_count: 4

patch_classification:
  - file: 0001-config.guess.patch
    type: portability
    platform_only: True
    guard: confirmed
  - file: 0002-config.sub.patch
    type: portability
    platform_only: True
    guard: confirmed
  - file: 0003-configure.patch
    type: portability
    platform_only: True
    guard: confirmed
  - file: 0004-tests-test.sh.patch
    type: portability
    platform_only: True
    guard: confirmed