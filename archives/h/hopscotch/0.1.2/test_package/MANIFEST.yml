schema_version: 1
package: hopscotch
version: 0.1.2
homepage: https://github.com/silentbicycle/hopscotch
upstream_test_in_build: false
upstream_tests:
  - file: Makefile
    description: upstream make test (requires external greatest.h/theft)
    command: make test
    status: not_run
    result: "TOTAL=1 PASS=0 FAIL=0 SKIP=0 NOT_RUN=1"
    reason: "The release tarball references vendor/greatest.h as a broken absolute symlink; greatest/theft are not available on this worker, so compilation never reached test execution."
test_package_tests:
  - file: test.c
    description: compile and run a real C API consumer through Conan self.run on native host
    command: self.run(test_package)
    api_calls:
      - hopscotch_new
      - hopscotch_add
      - hopscotch_seal
      - hopscotch_solve
      - hopscotch_free
    result: "TOTAL=1 PASS=1 FAIL=0 SKIP=0 NOT_RUN=0"
assertion_count: 5
build_files:
  - conanfile.py
  - CMakeLists.txt
  - test.c
outputs:
  - include/hopscotch.h
  - lib/libhopscotch.a
  - bin/hopscotch
require_nonempty: true
