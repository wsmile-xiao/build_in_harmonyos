software: herdr
display: "herdr"
description: "Terminal workspace manager for AI coding agents (tmux-like multiplexer)"
category: terminal
homepage: "https://herdr.dev"
license: Apache-2.0
build_system: cargo

ohos_adaptation:
  key_points:
    - "Rust CLI + vendored libghostty-vt (Ghostty VT engine, requires Zig 0.15.2 exactly)"
    - "OHOS zig build runner/中间工具为未签名 ELF 无法执行，需 binary-sign-tool 签名循环（conanfile.py _build_libghostty_vt）"
    - "zig 无 OHOS libc headers，用 aarch64-linux-musl target（OHOS libc 为 musl 系）"
    - "workspace create 依赖 SHELL 环境变量，OHOS 上需设置 SHELL=/data/app/bin/bash"
    - "Rust target: aarch64-unknown-linux-ohos；R38 commands.json 已声明"
  common_dependencies: []