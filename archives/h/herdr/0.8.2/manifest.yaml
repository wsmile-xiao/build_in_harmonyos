software: herdr
version: "0.8.2"
status: built
build_date: "2026-08-23"
build_system: cargo
conan_ref: "herdr/0.8.2"

source:
  url: "https://github.com/herdrdev/herdr/archive/refs/tags/v0.8.2.tar.gz"
  sha256: "60453051025ee44ebf055d26cdaf665a0accd99a992cddd22c166a26c49cd161"
  tar_format: tar.gz

build:
  system: cargo
  configure_options:
    - "cargo build --release --locked"
    - "OHOS target: aarch64-unknown-linux-ohos (override with RUST_TARGET)"
    - "vendored libghostty-vt via Zig 0.15.2, zig target aarch64-linux-musl (OHOS libc is musl-based)"
    - "OHOS fallback: checksum-pinned Harmonybrew Rust 1.97.1 bottles + official Zig 0.15.2 tarball"
    - "OHOS zig build runner/signed-ELF retry loop in conanfile.py _build_libghostty_vt()"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-build.rs.patch"

knowledge_gained:
  - "herdr 0.8.2 is a Rust CLI with vendored libghostty-vt (Ghostty VT engine, 527 Zig files) that requires Zig 0.15.2 exactly (build.zig version check rejects 0.16+)."
  - "Official Zig 0.15.2/0.16.0 have no OpenHarmony libc headers; use aarch64-linux-musl target instead (OHOS libc is musl-derived, binary compatible)."
  - "On OHOS, zig-generated ELFs (build runner + intermediate tools) cannot be executed without codesign: binary-sign-tool sign -selfSign 1, then retry zig build."
  - "build.rs zig_target() must map aarch64-unknown-linux-ohos to aarch64-linux-musl; prebuilt libghostty-vt.a lets the recipe skip zig in build.rs."
  - "herdr workspace create spawns SHELL; on OHOS set SHELL=/data/app/bin/bash."
  - "clang-linked ELFs execute on OHOS without extra signing; zig static-linked ELFs do not."
  - "init-build's _BUILD_MARKERS lacks Cargo.toml, mis-promotes vendor/libghostty-vt as source."
  - "The software-level commands.json declares the packaged executable as an R38 tool."