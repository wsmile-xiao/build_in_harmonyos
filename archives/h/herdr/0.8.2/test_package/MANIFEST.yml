# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: herdr/0.8.2
homepage: "https://herdr.dev"

# 上游测试命令 (Rust 项目, 使用 just 任务)
upstream_check_command: "cargo test"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# herdr 上游测试为 Rust 单元测试 (cargo test)，本适配不修改上游测试源码。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 参考 Homebrew formula 的 test 方法：version + server + workspace API
test_package_tests:
  - file: conanfile.py
    description: "herdr --version 版本检查 + server 生命周期 + workspace 创建/列表 API"
    command: "herdr --version && herdr server && herdr status server && herdr workspace create/list"

# 测试断言总数
assertion_count: 10