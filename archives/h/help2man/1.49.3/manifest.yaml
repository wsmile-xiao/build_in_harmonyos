software: help2man
version: "1.49.3"
status: success
build_system: script
category: development
description: GNU help2man - generate man pages from --help output

patches_applied: []

compatibility:
  level: high
  issues: []
  notes: "纯 Perl 脚本，无平台依赖"

test_results:
  type: manual
  passed: 1
  failed: 0
  note: "首次运行需要用户确认（鸿蒙安全机制），核心功能正常"

dependencies:
  required:
    - perl
    - sed
  optional: []

harmonyos:
  triplet: aarch64-unknown-linux-ohos
  libc: musl
  compiler: perl

build:
  source: https://ftp.gnu.org/gnu/help2man/help2man-1.49.3.tar.xz
  system: script
  dependencies:
    - perl
    - sed
  
  install_method: "perl help2man.PL --stdout > $HOME/usr/local/bin/help2man"

features:
  pure_perl: yes
  no_compile: yes
  auto_shebang: yes

notes:
  - "纯 Perl 脚本，不需要编译"
  - "help2man.PL 自动检测并嵌入正确的 perl 路径"
  - "首次运行需要用户确认（鸿蒙安全机制）"

install:
  binaries:
    - $HOME/usr/local/bin/help2man

build_date: 2026-03-16