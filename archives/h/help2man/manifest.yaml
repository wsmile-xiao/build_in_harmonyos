description: "Generate man pages from --help and --version output"
category: doc
homepage: "https://www.gnu.org/software/help2man/"
license: GPL-3.0+
build_system: script

ohos_adaptation:
  key_points:
    - "纯 Perl 脚本，不需要编译"
