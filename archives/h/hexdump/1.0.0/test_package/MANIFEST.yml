# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: hexdump/1.0.0
homepage: "https://github.com/FernandoVelcic/hexdump"

# 上游测试命令：官方 tag 1.0.0 源码无任何测试套件
# （Makefile 仅 all/clean 两个目标，无 check 目标；无 tests/ 目录；
#   无 gtest/catch2/doctest/cmocka 等测试框架引用；无 ctest/pytest 注册）
upstream_check_command: "make check"
upstream_check_command_available: false

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（官方源码无独立测试用例，示例程序 hexdumpExample 已在本机
# 用 clang++ -std=c++14 编译并运行验证，49 行输出与 README 一致，退出码 0）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，真实调用 hexdump.hpp 公开 API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：Hexdump/CustomHexdump/CustomHexdumpBase 公开 API 输出断言"
    command: "./test_hexdump"

# 测试断言总数
assertion_count: 14
