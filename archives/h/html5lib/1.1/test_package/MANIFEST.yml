# test_package/MANIFEST.yml — html5lib 1.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: html5lib/1.1
homepage: "https://github.com/html5lib/html5lib-python"

# 上游测试套件：pytest（html5lib/tests/，pytest-expect 驱动）
upstream_check_command: "pytest -q"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: html5lib/tests/
    source: html5lib-1.1/html5lib/tests/
    description: "pytest 套件：本地实测 **21532 passed / 10913 skipped / 995 xfailed**（通过率 100%，skipped/xfailed 不计分母），含 tokenizer/tree-construction/sanitizer 等"
    command: "pytest -q"

# test_package 消费者测试（R34 真实 API：python 加载打包的 html5lib + parse 真实 HTML）
test_package_tests:
  - file: test_html5lib.py
    description: "Loads packaged html5lib via PYTHONPATH and parses a real HTML document with html5lib.parse(), asserting the parsed <p>hello</p> tree"
    command: "python3 test_html5lib.py"

# 断言总数：1（HTML parse 校验）
assertion_count: 1
