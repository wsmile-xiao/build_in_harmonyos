# 版本级 manifest — html5lib 1.1
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.1"

# 软件名
software: html5lib

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"
build_system: python

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（PyPI 官方 sdist）
  url: "https://files.pythonhosted.org/packages/ac/b6/b55c3f49042f1df3dcd422b7f224f939892ee94f22abcf503a9b7339eaf2/html5lib-1.1.tar.gz"

  # 源码校验和（sha256，实测）
  sha256: "b2e5b40261e20f354d198eae92afc10d750afb487ed5e50f9c4eaf07c184146f"

  # 压缩格式
  compression: tar.gz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "html5lib-1.1"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - six/1.17.0
    - webencodings/0.6.1
  optional:
    - lxml/genshi/chardet (extras，可选)

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: "package_type=application（本环境 python-require 型 conan create 静默跳过构建——webencodings/dataproperty/pytablewriter 先例）；纯 Python 库（html5lib/ 包），build() 用 copytree 到 staging，package() 拷到 site-packages/python3.12；requires six/1.17.0 + webencodings/0.6.1（均已发布）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: "纯 Python HTML5 解析库（符合 WHATWG HTML 规范），依赖 six>=1.9 + webencodings>=0.5.1（均已发布）；lxml/genshi/chardet 为 extras 可选"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 21532
  failed: 0
  note: |
    上游测试：pytest 套件（html5lib/tests/，pytest-expect 驱动），
    本地实测 **21532 passed / 10913 skipped / 995 xfailed**——
    通过率 100%（passed/(passed+failed+errors)，skipped/xfailed 不计分母）。
    注：pytest 5.4.3 + --assert=plain + 显式 -p pytest_expect 才能兼容
    Python 3.12（新 pytest 的 hook 签名/断言重写不兼容 html5lib 1.1 的
    旧 conftest）。
    适配后：test_package R34 真实 python 加载打包的 html5lib 并 parse
    真实 HTML 校验 DOM（1/1 = 100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "html5lib 是纯 Python WHATWG HTML 解析库，依赖 six + webencodings（均已发布）；上游测试用 pytest-expect 驱动且为旧 conftest hook，需 pytest 5.4.3 + --assert=plain + 显式 -p pytest_expect 才能在 Python 3.12 跑通；site-packages 打包 + application 型配方 + commands.json（R38）"

references:
  - https://github.com/html5lib/html5lib-python
