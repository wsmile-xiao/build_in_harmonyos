# test_package/MANIFEST.yml

package: httpserver-h/0.0-git9029347a82
homepage: "https://github.com/jeremycw/httpserver.h"

# 上游测试套件（test/unit + test/functional）另行枚举并在适配流程中真实运行，
# 详见最终回报台账；test_package 提供消费者视角验证。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试文件列表（详见双口径台账，此处列出主要测试源）
upstream_tests:
  - file: test/unit/test_parser.c
    description: "munit HTTP 请求解析器单元测试"
  - file: test/unit/test_read_socket.c
    description: "munit socket 读取单元测试"
  - file: test/unit/test_request_util.c
    description: "munit 请求工具函数单元测试"
  - file: test/unit/test_respond.c
    description: "munit 响应构造单元测试"
  - file: test/unit/test_write_socket.c
    description: "munit socket 写入单元测试"
  - file: test/functional/main.c
    description: "功能测试 HTTP 服务器（/echo /host /headers 等路由）"
  - file: test/fuzz/random_parser.c
    description: "随机模糊解析器（基于 libfuzzer 的随机 fuzzer）"

# test_package 自带测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "启动 epoll HTTP 服务器，客户端 GET /hello，验证 200 OK 与响应体"
    command: "./test_httpserver_h"
  - file: test_hos.c
    description: "HarmonyOS 专项：同一连接 keep-alive 双请求（200+404），验证 OHOS epoll 事件循环"
    command: "./test_hos"

assertion_count: 5  # test: handler_called/200 OK/body; test_hos: 200/404/body1/body2