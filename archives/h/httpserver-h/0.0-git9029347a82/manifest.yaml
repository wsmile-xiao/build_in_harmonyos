knowledge_gained:
  - "httpserver.h 是单头文件 C 库（HTTPSERVER_IMPL 模式），事件后端需消费者在 include 前定义 EPOLL（OHOS 有 epoll_wait，无 kqueue）。"
  - "上游代码生成链：httpserver.m4 + parser.rl 经 m4/ragel 生成 httpserver.h；根目录已提交生成的 httpserver.h，无需在 CI 引入 m4/ragel。"
  - "上游测试分三套：test/unit（munit 5 个测试源）、test/functional（功能测试服务器）、test/fuzz（随机 fuzzer），构建需 m4 + ragel。"
  - "GitHub 直连超时环境下，官方 tarball 可通过 codeload.github.com 下载（同字节，SHA-256 一致），conandata 仍用官方 archive URL。"
