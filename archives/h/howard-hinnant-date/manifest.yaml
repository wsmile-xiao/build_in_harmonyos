software: howard-hinnant-date
display: "Howard Hinnant Date"
description: "现代 C++ 日期时间处理库，提供 header-only 日期功能和可选的时区编译库"
category: data                      # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data
homepage: "https://github.com/HowardHinnant/date"
license: MIT
build_system: cmake                 # autotools | cmake | meson | makefile | custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "date-tz 需要时区数据库，OpenHarmony 无 /usr/share/zoneinfo，需用 MANUAL_TZ_DB=ON 模式"
    - "MANUAL_TZ_DB=ON 避免对 libcurl 的依赖（无预编译 curl-devel 包）"
    - "cmake 对 HarmonyOS 输出 'System is unknown' 警告，非致命不影响编译"
    - "C++17 是默认标准要求"
  common_dependencies:
    - pthread

# 版本索引
versions:
  "3.0.4":
    status: published
    build_date: "2026-06-03"