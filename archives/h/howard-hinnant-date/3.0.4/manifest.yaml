software: howard-hinnant-date
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# 构建系统类型
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/HowardHinnant/date/archive/refs/tags/v3.0.4.tar.gz"

  # 源码校验和
  sha256: "56e05531ee8994124eeb498d0e6a5e1c3b9d4fccbecdf555fe266631368fb55f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_TZ_LIB=ON"
    - "-DMANUAL_TZ_DB=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - pthread

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "BUILD_TZ_LIB=ON 必须显式启用才能编译 date-tz 时区库（默认OFF只安装头文件）"
  - "MANUAL_TZ_DB=ON 避免 libcurl 依赖（无预编译curl-devel包）"
  - "C++17 标准是默认要求（CMAKE_CXX_STANDARD=17）"
  - "官方测试套件需 ENABLE_DATE_TESTING=ON 启用，date_test 28/28 PASS，3个 TZDB FAIL"

# ============================================================
# 测试信息
# ============================================================

test:
  # 测试类型
  type: cmake-ctest

  # 测试结果
  results:
    total: 35
    pass: 32
    fail: 3
    skip: 0

  # FAIL 原因
  fail_reason: "3个测试因 MANUAL_TZ_DB=ON 模式缺少时区数据库而运行时异常（std::runtime_error: Timezone database not found）"

  # date_test 通过列表
  pass_categories:
    - "date_test: 28个全部通过（纯日期功能不依赖时区）"
    - "clock_cast_test: 1/3 通过（2个需时区数据库）"
    - "solar_hijri_test: 0/1 通过（需时区数据库）"
