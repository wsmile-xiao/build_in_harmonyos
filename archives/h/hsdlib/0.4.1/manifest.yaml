# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Makefile 项目：OHOS uname -s 返回 HarmonyOS，OS 分支必须显式识别（否则 SHARED_LIB_EXT 为空，产物名 lib/hsd.）"
  - "Makefile 硬编码 SHELL := /bin/bash 在 OHOS 不可用，需回退 $(shell command -v bash 2>/dev/null || echo /bin/sh)"
  - "conan copy() 保留匹配文件相对目录结构，package() 需 src 指向子目录 + 无前缀模式，否则 include/include、lib/lib 双重嵌套"
  - "hsdlib 库文件名为 libhsd.a/.so，cpp_info.libs 用 hsd（非包名 hsdlib）"

