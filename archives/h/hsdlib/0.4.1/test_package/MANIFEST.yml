# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 上游测试三步法）

package: hsdlib/0.4.1
homepage: "https://github.com/habedi/hsdlib"

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序（aarch64 OHOS 本机实测，双口径台账见 reports/upstream-test-ledger.md）
# 可复制枚举规则: tests/*.c 中每个 run_test_*() 调用 = 1 个独立用户用例声明
upstream_tests:
  - file: tests/main.c
    source: hsdlib-0.4.1/tests/main.c
    description: "C 测试套件入口：注册 7 个套件（sqeuclidean/manhattan/hamming/cosine/dot/jaccard/utils），make test 编译并运行"
    command: "make test  # 160/160 用例通过（166 条 Running test 日志行，166 PASS / 0 FAIL，Overall Result: PASS）"
  - file: tests/test_cosine.c
    source: hsdlib-0.4.1/tests/test_cosine.c
    description: "余弦相似度套件：33 callsite（含维度扫描与 Large Vector）"
    command: "make test"
  - file: tests/test_dot.c
    source: hsdlib-0.4.1/tests/test_dot.c
    description: "点积套件：33 callsite"
    command: "make test"
  - file: tests/test_euclidean.c
    source: hsdlib-0.4.1/tests/test_euclidean.c
    description: "平方欧氏距离套件：25 callsite"
    command: "make test"
  - file: tests/test_manhattan.c
    source: hsdlib-0.4.1/tests/test_manhattan.c
    description: "曼哈顿距离套件：24 callsite"
    command: "make test"
  - file: tests/test_hamming.c
    source: hsdlib-0.4.1/tests/test_hamming.c
    description: "汉明距离套件：25 callsite"
    command: "make test"
  - file: tests/test_jaccard.c
    source: hsdlib-0.4.1/tests/test_jaccard.c
    description: "Jaccard 相似度套件：17 callsite"
    command: "make test"
  - file: tests/test_utils.c
    source: hsdlib-0.4.1/tests/test_utils.c
    description: "工具函数检查：3 个检查块（backend/avx512/fp-mode）"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：仅经公开 hsdlib.h + libhsd 调用 6 个公开 API（sqeuclidean/manhattan/hamming/dot/cosine/jaccard），与手工推导参考值比对"
    command: "./test_hsdlib"
  - file: test_ohos.c
    description: "鸿蒙专项测试：运行时 SIMD 后端调度验证（AUTO 非空、非 x86 avx512=false、AUTO/SCALAR/NEON 结果一致）"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 166
