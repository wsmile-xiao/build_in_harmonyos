# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hashchop/0.8-0
homepage: "https://github.com/silentbicycle/hashchop"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test CC=clang && ./test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (静态 8 个 TEST 定义, 参数化后实际执行 81 次)
upstream_tests:
  - file: test.c
    source: hashchop-0.8-0/test.c
    description: "greatest 测试套件: 8 个 TEST 定义, 主套件参数化后执行 81 个用例"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 5 个用例, 调用 hashchop_new/sink/poll/finish/reset/free 真实 API 并断言行为"
    command: "./test_hashchop"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 25
