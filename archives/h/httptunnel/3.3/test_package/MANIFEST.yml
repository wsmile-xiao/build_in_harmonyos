# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: httptunnel/3.3
homepage: "https://ftp.gnu.org/gnu/httptunnel/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无自动化测试（R51 清点证据）：httptunnel 3.3 源码无 tests/ 目录，
# Makefile.am/Makefile.in 无 check 目标，make -n check 输出为空。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_httptunnel.sh
    description: "真实运行 hts/htc：版本输出、htc 前转端口 accept、hts 隧道端口 accept、隧道握手后目的端口转发（echo 服务器 marker 文件）"
    command: "sh test_httptunnel.sh hts htc ."

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
