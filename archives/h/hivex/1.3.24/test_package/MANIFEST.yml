# test_package/MANIFEST.yml — hivex 1.3.24 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hivex/1.3.24
homepage: "https://libguestfs.org/"

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试清点证据 (R51 三步法 第 1 步):
#   hivex 1.3.24 tarball 中只有 lib/Makefile.am 注册了 C 测试:
#     check_PROGRAMS = test-just-header
#     TESTS = test-just-header
#   即 `make check` 只编译并运行 lib/test-just-header.c 一个测试。它是一个真
#   功能测试: hivex_open("../images/minimal", 0) 打开随包分发的注册表镜像，
#   句柄为空即失败。其余被测目录 (ocaml/ perl/ python/ ruby/ extra-tests)
#   分属语言绑定与需外部 hivex-test-data 数据的额外测试, 本配方已通过
#   --disable-ocaml/--disable-perl/--disable-python/--disable-ruby 关闭绑定,
#   且 extra-tests 在 Makefile.am 中被 ALWAYS_FALSE 永久排除。
#   故上游实际可运行 native 测试数为 1。
upstream_tests:
  - file: lib/test-just-header.c
    source: "hivex-1.3.24/lib/test-just-header.c"
    command: "make check"
    description: >
      仅断言 hivex_open() 能打开上游 images/minimal 注册表镜像 (返回非 NULL
      句柄即通过), 不做任何键值读写。本配方 package() 后以 test_package
      取代之, 覆盖完整的生产者/消费者往返流程。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_hivex.c
    source: test_package/test_hivex.c
    description: >
      无头消费者端到端工作流, 两阶段。阶段一 (生产者): 以
      HIVEX_OPEN_WRITE 打开上游 images/minimal 镜像, 经
      hivex_node_add_child() 建出 root/Software/OHOSVendor/hivex 键树, 用
      hivex_node_set_value() 写入 REG_SZ/REG_DWORD/REG_QWORD/REG_MULTI_SZ/
      REG_BINARY 五种类型, 再 hivex_commit() 落盘为新 hive 文件。阶段二
      (消费者): 只读重开该文件, 用 hivex_node_get_child() 按名字定位键、
      hivex_value_string()/hivex_value_dword()/hivex_value_qword()/
      hivex_value_multiple_strings()/hivex_value_value() 读回全部值并逐项
      比对类型与长度, 校验 child/value 计数、parent 链、整树递归遍历结果,
      并覆盖两个错误路径 (未知键名/未知值名返回 0, 打开不存在的文件返回
      NULL)。夹具 test_package/minimal 与上游 images/minimal 逐字节一致
      (sha256 4d97a594c11e5b56a0e0370ee181b9c7c9493ac16b7e7fc2b4e1b0199b6085e1),
      原因是上游无法从零创建 hive。
    command: "ctest --output-on-failure (test_hivex minimal.b64 hivex-test-out.hive); 同一二进制再由 conanfile.py 的 test() 用 self.run() 直接驱动一次, 使 CI 日志留下 37 条断言全文"

# 测试断言总数 (用于质量评估)
assertion_count: 37
