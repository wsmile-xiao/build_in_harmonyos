# 版本级 manifest
# 文件位置: archives/h/hivex/1.3.24/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.24"

# 软件名
software: "hivex"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.libguestfs.org/hivex/hivex-1.3.24.tar.gz"

  # 源码校验和
  sha256: "a52fa45cecc9a78adb2d28605d68261e4f1fd4514a778a5473013d2ccc8a193c"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-ocaml"
    - "--disable-perl"
    - "--disable-python"
    - "--disable-ruby"
    - "--disable-nls"
    - "--without-readline"

  # 编译依赖列表（格式: name/version）
  # 库本体无外部依赖：readline（hivexsh 行编辑）与 libxml2（hivexml）
  # 均为可选且本配方不提供，语言绑定全部关闭。
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无 .patch 文件：上游 tarball 自带 configure 且 OHOS sysroot 已
# 提供所需头文件。唯一的源码改写是 build() 内的 E007 变换——把 HarmonyOS 分支写进
# build-aux/config.guess/config.sub，见 knowledge_gained 第一条）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 原生（host=build）autotools 构建必须给 config.guess/config.sub 补 HarmonyOS 分支，否则 configure 在第一步就死：profile 不传 --host，configure 回落到 build-aux/config.guess，输出 aarch64-unknown-linux-ohos 之前先报 'unable to guess system type'；只用 --build/--host 绕过是禁手（autoconf 会当成交叉编译，跳过全部 AC_RUN_IFELSE 产出错误 config.h）。本包用仓内 scripts/patch-autotools-ohos.pl 的等价变换（knowledge_ref: knowledge/doc/E007.md）"
  - "config.sub 的内核兼容列表（`case $kernel-$os in linux-gnu* | ... | linux-uclibc* )`）必须单独补 `linux-ohos*`，否则即使三元组猜对也会被拒：'Invalid configuration aarch64-unknown-linux-ohos: Kernel linux not known to work with OS ohos'。仓内 patch-autotools-ohos.pl 的第 2.3 步守卫是 `unless (/linux-ohos/)`，而它自己的第 2.1 步刚写入 `basic_os=linux-ohos` 文本，守卫因此命中、该步被静默跳过（脚本仍自评 4/5 通过）；本配方在调用脚本后按幂等变换补齐，并把 2.3 的守卫改为 `linux-ohos*`（knowledge_ref: knowledge/doc/E072.md）"
  - "autotools 包需检查 configure.ac 对 /usr/bin/ld 的探测：hivex 用 `/usr/bin/ld --help` 判定 VERSION_SCRIPT_FLAGS，OHOS 无 /usr/bin/ld 时退化到 Solaris 形式 `-Wl,-M -Wl,`，lld 无法解析；该标志只用于链接 libhivex.so，故静态构建不受影响（knowledge_ref: references/compile-guide.md §1.2 profile 静态默认 R26）"
  - "上游工具无 --version/--help 时不应打包进 bin/：hivexsh/hivexml 的 getopt 串为 \"df:wu\"/\"dku\"，`--version`/`--help` 都被判为非法选项并以 EXIT_FAILURE 退出，会让 conan-verify L2 smoke test 全红；改为纯库包（package() 移除 bin/）后 L2 按「无 bin/ 目录」跳过（knowledge_ref: docs/TEST_QUALITY_SPEC.md §5.3 L2/L4/L5 门禁）"
  - "AM_GNU_GETTEXT([external]) 类 autotools 项目在缺 gettext 工具链时用 --disable-nls 规避 msgfmt/xgettext 依赖：hivex configure.ac 无条件调用 AM_GNU_GETTEXT，关闭 NLS 后不再需要 libintl（knowledge_ref: references/compile-guide.md §2.3 conan-init 检查项）"
  - "hivex_value_multiple_strings() 的返回数组把 MULTI_SZ 的结尾空串也当成一个元素返回（lib/value.c 的 while (p < data+len) 循环），两字符串的 REG_MULTI_SZ 读回是 {alpha, beta, \"\", NULL} 而不是 {alpha, beta, NULL}；测试按「数组以 NULL 结尾 + 前导非空元素」断言才不会误报（knowledge_ref: references/compile-guide.md §4.1 错误分类与对策）"
