# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: hoedown/3.0.7
homepage: "https://github.com/hoedown/hoedown"

# 上游测试命令：`make test` 即运行 python test/runner.py（MarkdownTest 1.0.3
# 套件：config.json 注册 28 个用例，经 hoedown CLI 渲染后与期望 HTML 对比，
# 输出经 tidy 归一化）。本地实测 28/28 全部通过。
upstream_check_command: "make test  (python test/runner.py, MarkdownTest 1.0.3, 28 cases)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/runner.py
    source: hoedown-3.0.7/test/runner.py
    description: "MarkdownTest 1.0.3 suite: 28 cases, hoedown CLI vs expected HTML (tidy-normalized)"
    command: "python3 test/runner.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 libhoedown 公共 API 渲染 Markdown 并断言输出含 <h1>"
    command: "./test_hoedown"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 28
