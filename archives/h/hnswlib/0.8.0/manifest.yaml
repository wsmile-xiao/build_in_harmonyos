software: hnswlib
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.8.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
compile_date: "2026-06-25"

# 构建系统（顶层字段，用于 G4 门禁检查）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/nmslib/hnswlib/archive/refs/tags/v0.8.0.tar.gz"

  # 源码校验和
  sha256: "cf61d7dd8dc9bfba7f4abe0ed26698e90ac9f49a0badb2e1b0f3ba89b72cf3bb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_CXX_COMPILER=clang++"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # hnswlib is a header-only library with no external dependencies

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "hnswlib 0.8.0 是 header-only C++ 库，无二进制库文件输出"
  - "构建系统为 CMake，使用 INTERFACE library 类型"
  - "安装产物仅包含头文件和 CMake 配置文件"
  - "无外部依赖，无需补丁，开箱即编译"
  - "clean_verify.py 不支持 CMake 项目，G0 需手动验证"
  - "ARM aarch64 平台无 SSE/AVX，自动降级标量实现，功能无影响"
  - "L2 空间 kNN 召回率 1.0（1000向量, k=10, ef=50），精度无损"
  - "多线程并发安全（4线程搜索+2线程插入，18486次搜索无崩溃）"
  - "saveIndex/loadIndex 序列化可靠，加载后搜索结果完全一致"
  - "全核心 API 在鸿蒙平台验证通过：L2Space/InnerProductSpace/BruteforceSearch/addPoint/searchKnn/searchKnnCloserFirst/saveIndex/loadIndex/markDelete/unmarkDelete/resizeIndex/setEf/BaseFilterFunctor"

# 功能测试结果
functional_test:
  date: "2026-06-25"
  test_program: "hnswlib_func_test.cpp"
  compile_cmd: "clang++ -std=c++11 -O2 -I ~/usr/local/include -o hnswlib_func_test hnswlib_func_test.cpp -lpthread"
  total: 23
  passed: 23
  failed: 0
  skipped: 0
  result: "ALL PASS"
  coverage:
    - "L2 空间 (L2Space, addPoint, searchKnn, setEf)"
    - "InnerProduct 空间 (InnerProductSpace)"
    - "序列化 (saveIndex, loadIndex)"
    - "删除/恢复 (markDelete, unmarkDelete, isMarkedDeleted)"
    - "索引扩容 (resizeIndex)"
    - "过滤搜索 (BaseFilterFunctor)"
    - "排序搜索 (searchKnnCloserFirst)"
    - "多线程并发 (addPoint + searchKnn)"
    - "暴力搜索 (BruteforceSearch)"
    - "平台兼容性 (ARM SIMD 路径)"
