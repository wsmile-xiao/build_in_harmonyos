# hurl 软件级 manifest
# 文件位置: archives/h/hurl/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: hurl
category: network
description: "Hurl is a command line tool that runs HTTP requests defined in a plain text format. It can be used for testing HTTP endpoints, capturing data, and performance testing."

# ============================================================
# 版本索引
# ============================================================

versions:
  - version: "8.0.1"
    status: built
    build_date: "2026-05-29"
    build_system: cargo

# ============================================================
# 软件信息
# ============================================================

homepage: https://hurl.dev
source_url: https://github.com/Orange-OpenSource/hurl

# ============================================================
# 依赖信息
# ============================================================

runtime_dependencies:
  - openssl/1.1.1w
  - libcurl/8.7.1

build_dependencies:
  - rust/1.95.0
  - cargo/1.95.0