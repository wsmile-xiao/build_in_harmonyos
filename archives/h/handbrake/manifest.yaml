software: handbrake
display: "HandBrake"
description: "开源的跨平台视频转码工具（HandBrakeCLI 命令行版）"
category: gfx
homepage: "https://handbrake.fr"
license: GPL-2.0-only
build_system: custom

ohos_adaptation:
  key_points:
    - "HandBrake 顶层使用自定义 configure（Python 驱动）生成 build/ 下的 GNUmakefile，非 Autotools"
    - "33 个 contrib（ffmpeg/x264/x265/libvpx/libass/dav1d/svt-av1 等）全部在树内构建，无 Conan 包依赖"
    - "make/config.guess 需补 HarmonyOS build tuple（aarch64-unknown-linux-ohos），contrib 内逐个打 A01-config-guess 补丁"
    - "硬件编码器全部禁用（--disable-nvenc/nvdec/qsv/vce/mf），GTK 禁用，仅产出 HandBrakeCLI"
    - "OHOS 要求 ELF codesign 自签名，否则二进制 Operation not permitted 无法执行"
    - "make 的 jobserver mkfifo 在 HMDFS 上不可用（警告无害，自动退化为串行）"
  common_dependencies:
    - "ffmpeg (contrib, in-tree)"
    - "x264/x265 (contrib, in-tree)"
    - "libvpx/libass/dav1d/svt-av1 (contrib, in-tree)"

versions:
  "1.11.2":
    status: built
    build_date: "2026-08-13"
    conan_ref: "handbrake/1.11.2"
