# conandata.yml - handbrake 1.11.2 (HandBrakeCLI)
# 官方 release source asset；conandata 只保留原始 URL，镜像 fallback
# 由 CI/recipe 的下载逻辑处理，避免在元数据中手写代理 URL。
# 所有 OHOS 适配补丁以 list 格式声明（L0f 门禁要求）

sources:
  url: "https://github.com/HandBrake/HandBrake/releases/download/1.11.2/HandBrake-1.11.2-source.tar.bz2"
  sha256: "12b046350f2422dc28783ff94229aff4ba5fe5e683431e057355d36163b2593a"

patches:
  - patch_file: "patches/0001-make-config.guess.patch"
    patch_description: "HandBrake make/config.guess: recognize HarmonyOS build tuple aarch64-unknown-linux-ohos (E007)"
    patch_type: "portability"
  - patch_file: "patches/0002-make-include-main.defs.patch"
    patch_description: "Treat HOST.systemf=HarmonyOS as Linux-like in main.defs platform filters"
    patch_type: "portability"
  - patch_file: "patches/0003-contrib-ffmpeg-module.defs.patch"
    patch_description: "ffmpeg contrib: force --target-os=linux and disable vulkan on OHOS (sysroot lacks vulkan_beta.h)"
    patch_type: "portability"
  - patch_file: "patches/0004-contrib-harfbuzz-module.defs.patch"
    patch_description: "harfbuzz contrib: point FREETYPE_LIBRARY at the in-tree static libfreetype.a"
    patch_type: "portability"
  - patch_file: "patches/0005-contrib-libass-module.defs.patch"
    patch_description: "libass contrib: include HarmonyOS in platform filters, disable system font provider requirement"
    patch_type: "portability"
  - patch_file: "patches/0006-contrib-x264-module.defs.patch"
    patch_description: "x264 contrib: enable PIC, avoid missing /bin/bash, and use Linux aarch64 host tuple on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0007-contrib-x265-module.defs.patch"
    patch_description: "x265 contrib: use .obj object suffix on HarmonyOS (OHOS cmake objects)"
    patch_type: "portability"
  - patch_file: "patches/0008-test-module.defs-contrib-link-order.patch"
    patch_description: "HandBrakeCLI link: search in-tree contrib libraries before worker-local libraries on HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0009-contrib-freetype-A01-config-guess-ohos.patch.patch"
