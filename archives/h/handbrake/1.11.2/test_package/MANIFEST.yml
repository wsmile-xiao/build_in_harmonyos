# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 门禁要求)
# HandBrake 1.11.2 官方无 make check 自检（CLI 工具，无测试套件）;
# test_package 通过执行真实二进制 HandBrakeCLI --version/--help 做消费者验证。

package: handbrake/1.11.2
homepage: "https://handbrake.fr"

# 上游测试命令 (HandBrake CLI 无官方自检命令)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证 — R34: 真实执行被测二进制)
test_package_tests:
  - file: test.sh
    description: "执行打包产物 HandBrakeCLI --version，断言退出码为 0"
    command: "HandBrakeCLI --version"
  - file: test.sh
    description: "执行打包产物 HandBrakeCLI --help，断言退出码为 0"
    command: "HandBrakeCLI --help"

# 测试断言总数 (与 test.sh / reports/test-report.md 一致)
assertion_count: 2
