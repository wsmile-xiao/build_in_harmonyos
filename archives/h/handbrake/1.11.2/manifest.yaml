# 版本级 manifest — handbrake 1.11.2
# 交叉校验元数据（CI 不读取；以 conandata.yml 为准）

version: "1.11.2"
software: handbrake
status: built
build_date: "2026-08-13"
build_system: custom
conan_ref: "handbrake/1.11.2"

source:
  url: "https://github.com/HandBrake/HandBrake/releases/download/1.11.2/HandBrake-1.11.2-source.tar.bz2"
  sha256: "12b046350f2422dc28783ff94229aff4ba5fe5e683431e057355d36163b2593a"
  tar_format: tar.bz2

build:
  system: custom
  configure_options:
    - "--disable-gtk"
    - "--disable-numa"
    - "--disable-nvenc"
    - "--disable-nvdec"
    - "--disable-qsv"
    - "--disable-vce"
    - "--disable-mf"
    - "--disable-libdovi"
  dependencies: []
  cc: clang (15, /storage/Users/currentUser/usr/local/bin/clang)
  cxx: clang++ (15, /storage/Users/currentUser/usr/local/bin/clang++)

patches_applied:
  - "0001-make-config.guess.patch"
  - "0002-make-include-main.defs.patch"
  - "0003-contrib-ffmpeg-module.defs.patch"
  - "0004-contrib-harfbuzz-module.defs.patch"
  - "0005-contrib-libass-module.defs.patch"
  - "0006-contrib-x264-module.defs.patch"
  - "0007-contrib-x265-module.defs.patch"
  - "0009..0018-contrib-A01-*.patch (freetype/lame/libass/libdav1d/libgnurx/libiconv/libspeex/libvorbis/x264/xz)"
  - "0020-contrib-libiconv-A02-config-status-umask-ohos.patch.patch"

knowledge_gained:
  - "E007: HandBrake make/config.guess 与各 contrib config.guess 均需 HarmonyOS build tuple"
  - "HandBrake 顶层 build 系统是自定义 Python configure，产物在 build/HandBrakeCLI，无 make install 需求"
  - "OHOS clang 默认 PIE，x264 asm 必须 --enable-pic 否则链接报 R_AARCH64_ABS64"
  - "ffmpeg contrib 在 OHOS 上报 target_os=harmonyos（未知），须强制 --target-os=linux"
  - "OHOS sysroot vulkan.h 缺 vulkan_beta.h，ffmpeg 须 --disable-vulkan"
  - "OHOS cmake 产物对象后缀为 .obj，x265 需 X265.O.ext=.obj"
  - "make jobserver mkfifo 在 HMDFS 上不可用（警告无害，退化为串行）"
  - "OHOS 二进制须 binary-sign-tool selfSign 自签名，否则 Operation not permitted"
  - "官方 release source asset 自带 version.txt，避免为 GitHub tag archive 额外补 release 元数据"
  - "新端口设备没有旧 HNP bash 路径，需从 CONFIG_SHELL/SHELL/zsh/sh 中选择实际可执行 shell"
  - "GNU patch 可从官方 2.8 源码自举；OHOS/HMDFS 下需放宽 Autoconf confXXXXXX 临时目录 umask"
  - "新端口设备无裸 ar/ranlib/nm/strip；需用 recipe 私有 wrapper 指向 llvm-* 工具"
  - "新端口设备无系统 gm4/m4；需通过 m4/1.4.19 build requirement 注入 PATH"
  - "新端口设备无系统 autoconf；需通过 autoconf/2.72 build requirement 注入 PATH"
  - "新端口设备无 pkg-config/pkgconf 且 ohpcd 无对应包；需从官方 pkgconf 2.5.1 源码自举 host tool"
  - "新端口设备有 ld.lld 但无裸 ld；需用 recipe 私有 wrapper 暴露 ld"
  - "Conan autoconf 包脚本调用裸 perl；需用 Conan Perl 包装 autoconf 系列命令"
  - "HandBrake make 自带 urllib 下载器在新端口证书/超时失败不可控；实际构建 contrib distfile 必须由 recipe 在 make 前用 curl 补齐"
  - "contrib 预取需同名 tarball 去重，避免 x265 多变体并发写同一个 .tmp"
  - "新 build folder 重拉 contrib distfile 会受新端口网络波动影响；同一 CONAN_HOME 内既有 distfile 只能在 SHA256 匹配后作为迭代兜底复用"
  - "HandBrake contrib 模块名可包含连字符（如 SVT-AV1.FETCH.url）；预取/URL 改写正则必须允许 '-'"
  - "新端口 /usr/bin/tar 是 toybox tar，解 .tar.bz2 会触发坏的 toybox/bunzip2 路径；configure 前需用私有 tar/gtar wrapper"
  - "contrib 子项目 configure 也可能直接调用裸 perl；除 autoconf/automake wrapper 外，PATH 中还需提供指向 Conan Perl 的 perl wrapper"
  - "libvpx configure 会把环境变量 LD 当最终链接 driver 调用；PATH 可提供裸 ld wrapper，但 LD 本身应指向 clang driver 以接受 HandBrake LDFLAGS"
  - "新端口 /bin/sh 运行部分 Autoconf 脚本会触发 /tmp 只读与参数污染；libiconv configure 需优先 CONFIG_SHELL=/usr/bin/zsh"
  - "OHOS clang launcher 会在 compile-only 探测中注入 -Wl,--code-sign；Meson -Werror=unused-command-line-argument 下需用 clang wrapper 加 -Qunused-arguments"
  - "Autotools Makefile 的 SHELL 不宜全局改成 zsh；CONFIG_SHELL 可用 zsh 跑 configure，make/install 需用命令行变量 SHELL=/bin/sh 覆盖 Makefile"
  - "HandBrake 顶层 configure 是 POSIX sh 的 Python launcher，需用 /bin/sh 启动；CONFIG_SHELL=/usr/bin/zsh 只留给 contrib Autoconf configure"
  - "HandBrake contrib 命令会在顶层 configure 时生成进 build/GNUmakefile；需要在 configure 前通过 module.defs 的 CONFIGURE.env.args 显式给 libiconv 注入 CONFIG_SHELL=/usr/bin/zsh"
  - "libiconv configure 在 OHOS 上必须由 zsh 直接执行；只传 CONFIG_SHELL 不够，因为 shebang /bin/sh 路径仍会先触发 /tmp 只读问题"
  - "OHOS /bin/expr 在 Autoconf 去掉长 --prefix 尾斜杠的 alternation 表达式上会污染输出；libiconv 的 CONFIGURE.prefix 需去掉尾斜杠"
  - "libiconv 在 zsh configure 后生成的 make/install 阶段仍应通过 BUILD.extra/INSTALL.extra 传 SHELL=/bin/sh，避免 Autotools Makefile 使用 zsh 递归语义"
  - "libiconv Autoconf config.status 与 GNU patch 自举一样会在 OHOS/HMDFS 上被 umask 077 临时目录卡住；contrib A02 patch 将 configure/libcharset configure 中该临时目录创建放宽为 umask 022"
  - "Autoconf autoreconf 会通过 ACLOCAL/AUTOMAKE/AUTOCONF/AUTOM4TE 等环境变量解析递归工具；私有 wrapper 需自带 wrapper-first PATH 和这些变量，否则会落回 Conan automake 包原始 wrapper"
  - "libopus autoreconf 会重新生成 configure；module.defs 中需在 CONFIGURE.bootstrap 后补丁 generated configure 的 umask 077，并像 libiconv 一样使用 zsh + 无尾斜杠 prefix"
  - "libopus autoreconf 还会安装新的 config.guess 并覆盖 A01；显式传 --build/--host=aarch64-unknown-linux-ohos 可绕开 config.guess 写临时 dummy.c 的 HMDFS 权限问题"
  - "Windows checkout/overlay 可能让 test_package/test.sh 在真机端带 CRLF；test_package 执行前复制 LF-only 副本可避免 zsh 把 ^M 当作命令文本"

