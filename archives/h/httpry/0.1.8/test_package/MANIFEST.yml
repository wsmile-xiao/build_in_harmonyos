# test_package/MANIFEST.yml
# Upstream test declaration for httpry 0.1.8

package: httpry/0.1.8
homepage: "https://github.com/jbittel/httpry"

# Upstream test command
upstream_check_command: "make check"

# httpry has no make check target; test is running the binary with -h
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (none — httpry has no test suite)
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: conanfile.py
    description: "Run httpry -h to verify binary is installed and functional"
    command: "conan test"

# Approximate assertion count
assertion_count: 1
