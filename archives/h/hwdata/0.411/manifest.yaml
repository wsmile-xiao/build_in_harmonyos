version: "0.411"
software: "hwdata"
status: built
build_date: "2026-09-16"
build_system: make
difficulty: A

source:
  url: "https://github.com/vcrhonek/hwdata/archive/refs/tags/v0.411.tar.gz"
  sha256: "d75462181fbd307228e0a48b8d1449f1773ea4b1f17e8a1d56346907f999ce33"
  tar_format: tar.gz

build:
  system: make
  data_only: true
  output: "share/hwdata/{pci.ids,usb.ids,oui.txt,iab.txt,pnp.ids} + share/pkgconfig/hwdata.pc"
  configure_options: ["--disable-blacklist"]
  dependencies: []
  cc: null
  cxx: null

runtime_dependencies: []

patches_applied: []

knowledge_gained:
  - "hwdata 是**纯数据包**（无需编译）：上游 make install 把 IDFILES = pci.ids usb.ids oui.txt iab.txt pnp.ids 装到 $(datadir)/hwdata，并在 $(datadir)/pkgconfig 装 hwdata.pc（由 hwdata.pc.in 经 sed 生成，@pkgdatadir@ → ${datadir}/hwdata）。被下游消费的关键不是文件本身，而是 .pc 里的 **pkgdatadir** —— meson 的 dependency('hwdata') 正是靠它定位 pnp.ids。"
  - "同源双包的边界：仓内既有 hwdata-usb/0.409 只打 usb.ids（供 gusb 自测），本包打上游完整 IDFILES + hwdata.pc。两者同 upstream 仓库（vcrhonek/hwdata）但包名与打包范围不同，不是重复适配；查重时若只搜 `hwdata` 会漏掉 `hwdata-usb` 变体名（本任务实测踩过）。"
  - "libdisplay-info/0.3.0 的既有配方记录了**手工绕过**：从 raw.githubusercontent.com 下载 pnp.ids 到 generators/hwdata 并自造 hwdata.pc（Version 硬写 0.366）。本包发布后该场景可由 self.requires(\"hwdata/0.411\") 直接满足，无需联网下载与手写 .pc。"
  - "数据包需清空 package_id：ID 数据库是纯文本且架构无关，若不清空会因 compiler/arch 差异产生多个无意义二进制包（同 hwdata-usb 的 self.info.clear() 做法）。"

verification:
  w0_dependency_check: pass_no_dependencies
  local_source_check: pass
  upstream_tests: "pass（make check 的可复现子集：check-pci-ids.py + 5 文件 UTF-8 + Date: 头；另 2 项需 lspci/podman 宿主工具，已显式 warning 申报）"
  conan_verify: pending
  shadow_ci: pending
  device_test: pending
