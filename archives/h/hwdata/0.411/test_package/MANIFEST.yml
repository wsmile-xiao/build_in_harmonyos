# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: hwdata/0.411
homepage: "https://github.com/vcrhonek/hwdata"

# 上游测试命令 — 上游 Makefile 的 `check` 目标
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 check-pci-ids.py + IDFILES 逐个 iconv UTF-8 校验 + pci/usb.ids 的 Date: 头校验（等价上游 make check 的可复现部分）"

# 上游 Makefile 的 `check` 目标共 6 类步骤（2026-09-16 实测清点）：
#   1. lspci -A dump -O dump.name=lspci-dump.txt -i pci.ids   ← 需 pciutils（宿主工具）
#   2. ./check-pci-ids.py                                     ← 纯 Python，本配方已实跑
#   3. ./check-usb-ids.sh                                     ← 需 podman（宿主工具）
#   4. for file in $(IDFILES); iconv -f UTF-8 → 5 个文件 UTF-8 校验（已实跑）
#   5. grep "Date:" pci.ids / usb.ids 报日期（已实跑）
#   6. tests/ 目录另有 ids-files / python-hwdata / syntax 三组（下游发行版集成）
#
# 本配方 build() 实跑可复现部分 1、3（UTC-8 + Date 头 + check-pci-ids.py），
# 对需宿主工具的两项（lspci/podman）**显式 warning 申报**，不静默跳过（R51）。
upstream_tests:
  - file: check-pci-ids.py
    source: hwdata-0.411/check-pci-ids.py
    description: "上游自带 PCI 数据库校验器（纯 Python，无宿主工具依赖）；本配方 build() 内实跑，失败即中止构建"
    command: "python3 check-pci-ids.py"
  - file: IDFILES (pci.ids/usb.ids/oui.txt/iab.txt/pnp.ids)
    source: hwdata-0.411/
    description: "上游 make check 第 4/5 步：5 个数据文件逐个 UTF-8 校验 + pci/usb.ids 的 Date: 头解析；本配方 build() 内实跑"
    command: "for f in pci.ids usb.ids oui.txt iab.txt pnp.ids; do iconv -f UTF-8 $f >/dev/null; done"
  - file: check-usb-ids.sh
    source: hwdata-0.411/check-usb-ids.sh
    description: "上游 USB 数据库校验（脚本内驱动 podman 容器），CI 无 podman → 已显式 warning 申报未执行"
    command: "bash check-usb-ids.sh"
  - file: (lspci -A dump)
    source: hwdata-0.411/Makefile
    description: "上游 make check 第 1 步依赖 pciutils 的 dump 后端；CI 无 lspci → 已显式 warning 申报未执行"
    command: "lspci -A dump -O dump.name=lspci-dump.txt -i pci.ids"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_hwdata.py
    description: "消费者测试：真实数据（R34）——5 个 IDFILES 存在性、pnp.ids 逐记录解析（AAA=Avolites Ltd 锚点）、pci/usb.ids 真实记录正则、hwdata.pc 契约（Name/Version/pkgdatadir 指向实际含 pnp.ids 的目录）"
    command: "python3 test_hwdata.py <share/hwdata dir> <hwdata.pc>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 22
