software: hstr
version: "3.2"
build_system: autotools
compile_date: "2026-05-22"
source_url: https://github.com/dvorka/hstr/archive/refs/tags/v3.2.tar.gz
status: built
configure_options: "--prefix=/storage/Users/currentUser/usr/local"
dependencies:
  - ncursesw (static)
  - readline
  - libm
patches:
  - 0001-configure-ac-disable-bash-completion.patch
  - 0002-hstr-h-fix-ncurses-headers.patch
  - 0003-hstr-curses-h-fix-ncurses-header.patch
  - 0004-makefile-am-fix-hardlink.patch
knowledge_gained:
  - ncursesw header path adaptation (ncursesw/curses.h -> curses.h)
  - KEY_ macro definitions for incomplete curses.h
  - HMDFS hardlink to symlink conversion
  - PKG_CHECK_MODULES absence handling
