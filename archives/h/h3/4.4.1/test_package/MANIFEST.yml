# test_package/MANIFEST.yml
# 上游官方测试声明 (h3 4.4.1)

package: h3/4.4.1
homepage: "https://h3geo.org"

# 上游测试命令 (CMake CTest)
upstream_check_command: "ctest"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ctest -N 注册的测试)
upstream_tests:
  - file: src/apps/testapps/testH3Api.c
    source: h3-4.4.1/src/apps/testapps/testH3Api.c
    description: "H3 核心 API 单元测试 (latLngToCell/cellToLatLng/gridDisk 等)"
    command: "./testH3Api"
  - file: src/apps/testapps/testCellToBoundary.c
    source: h3-4.4.1/src/apps/testapps/testCellToBoundary.c
    description: "cellToBoundary 单元测试"
    command: "./testCellToBoundary"
  - file: src/apps/testapps/testGridDisk.c
    source: h3-4.4.1/src/apps/testapps/testGridDisk.c
    description: "gridDisk 单元测试"
    command: "./testGridDisk"
  - file: src/apps/testapps/testGridDistance.c
    source: h3-4.4.1/src/apps/testapps/testGridDistance.c
    description: "gridDistance 单元测试"
    command: "./testGridDistance"
  - file: src/apps/testapps/testCompact.c
    source: h3-4.4.1/src/apps/testapps/testCompact.c
    description: "compact/uncompact 单元测试"
    command: "./testCompact"
  - file: src/apps/testapps/testLocalIj.c
    source: h3-4.4.1/src/apps/testapps/testLocalIj.c
    description: "localIj 单元测试"
    command: "./testLocalIj"
  - file: src/apps/testapps/testH3SetToLinkedPolygon.c
    source: h3-4.4.1/src/apps/testapps/testH3SetToLinkedPolygon.c
    description: "polygon 相关单元测试"
    command: "./testH3SetToLinkedPolygon"
  - file: src/apps/testapps/testDirectedEdge.c
    source: h3-4.4.1/src/apps/testapps/testDirectedEdge.c
    description: "directedEdge 单元测试"
    command: "./testDirectedEdge"
  - file: tests/cli/h3.txt
    source: h3-4.4.1/tests/cli/h3.txt
    description: "h3 CLI 命令行测试"
    command: "ctest -R h3"

# test_package 自带的消费者测试
test_package_tests:
  - file: test.c
    description: "消费者验证：latLngToCell + cellToLatLng 真实 API 调用"
    command: "./test_h3"

# 测试断言总数 (近似值, 上游 ctest 全部用例)
assertion_count: 60
