knowledge_gained:
  - "上游 Makefile 的 CFLAGS += 不能用 make 命令行 CFLAGS+=... 追加: 命令行变量优先级最高, 会使上游 -std=c99 -g -O3 全部失效, 库退化为 -O0; 上游 heatshrink_decoder_free 对 NULL 的死代码解引用在 -O0 显形, greatest decoder_sink_should_reject_null_input_pointer 即段错误。追加 flags 须经环境变量或上游变量。"
  - "上游 heatshrink_decoder_free/heatshrink_encoder_free 不 NULL-safe (先解引用后 free), -O3 下为消除后的 tail-call, -O0 下 free(NULL) 段错误; 消费者与测试均在 -O3 口径。"
  - "两个静态库导出同名核心 API 但结构体布局随 HEATSHRINK_DYNAMIC_ALLOC 不同, 必须用两个 conan component 分别声明并各带 define, 消费者二选一链接。"

