# test_package/MANIFEST.yml — heatshrink 0.4.1
# 上游官方测试声明文件 (CI build_and_test.sh L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 统计口径: greatest 测试运行器输出的单个 test case（含参数化实例）。
# 上游测试在适配设备（OHOS aarch64）上以 CC=clang 原生构建后运行，
# 两个运行器各输出一个 "Total: N tests" 汇总行，为取数命令
# `./test_heatshrink_static | grep Total` / `./test_heatshrink_dynamic | grep Total`。

package: heatshrink/0.4.1
homepage: "https://github.com/atomicobject/heatshrink"

# 上游测试命令 (Makefile test 目标: ./test_heatshrink_static + ./test_heatshrink_dynamic)
upstream_check_command: "make test"
# 本配方 build() 在 conan create 内真实执行上述两条测试命令（CI worker 为
# OHOS 设备，可直接运行 aarch64-ohos 测试二进制），失败即 conan create 失败。
upstream_test_in_build: true
upstream_test_command: "./test_heatshrink_static && ./test_heatshrink_dynamic"

# 上游实际运行的测试程序 (greatest 框架)
upstream_tests:
  - file: test_heatshrink_static.c
    source: heatshrink-0.4.1.tar.gz/test_heatshrink_static.c
    description: "静态分配构建上的 greatest 集成套件（设备实测 Total 1600 个参数化用例，6938281 断言）"
    command: "./test_heatshrink_static"
  - file: test_heatshrink_dynamic.c
    source: heatshrink-0.4.1.tar.gz/test_heatshrink_dynamic.c
    description: "动态分配构建上的 greatest encoding/decoding/regression/integration 套件（设备实测 Total 12282 个用例，96647621 断言；properties 套件为上游可选 libtheft 属性测试，上游默认构建不启用，见 notes.md）"
    command: "./test_heatshrink_dynamic"
  - file: test_heatshrink_dynamic_theft.c
    source: heatshrink-0.4.1.tar.gz/test_heatshrink_dynamic_theft.c
    description: "属性测试套件本体；整体位于 #ifdef HEATSHRINK_HAS_THEFT 内，上游默认 Makefile 不定义该宏、不链接 libtheft，本适配与上游默认保持一致（设备实测贡献 0 个用例）"
    command: "（上游默认未编译，不执行）"

# test_package 中自带的测试 (消费者视角验证, 真实编码->解码往返)
test_package_tests:
  - file: test_package/test_heatshrink_dynamic.c
    description: "动态分配模式消费者：版本宏、分配/参数错误路径、3 组真实往返、reset 复用确定性，共 6 个用例（每用例含多次 EXPECT 断言）"
    command: "./test_heatshrink_dynamic"
  - file: test_package/test_heatshrink_static.c
    description: "静态分配模式消费者：配置头校验、重复文本往返、二进制与小数据往返，共 3 个用例"
    command: "./test_heatshrink_static"

# 测试断言总数 (近似值, 用于质量评估)
# 上游: 6938281 + 96647621 = 103585902（设备实测 greatest 输出）
# test_package 源码级 EXPECT 断言: dynamic 50 处 + static 31 处（部分位于循环内，
# 实际执行次数更高）
assertion_count: 103585983
