software: httpd
display: "Apache HTTP Server"
description: "The Apache HTTP Server is a powerful, flexible, and open-source web server."
category: network
homepage: "https://httpd.apache.org"
license: Apache-2.0
build_system: autotools

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "需要修改 config.guess/config.sub 添加 HarmonyOS 支持"
    - "需要显式指定 apr/apr-util/pcre 路径"
    - "config.status 临时目录创建可能失败，需使用固定目录"
  common_dependencies:
    - apr
    - apr-util
    - pcre

# 版本索引
versions:
  "2.4.67":
    status: published
    build_date: "2026-05-26"