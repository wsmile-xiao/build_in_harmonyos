software: httpd
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.4.67/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4.67"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/downloads/httpd-2.4.67.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 构建系统标记（档案完整性检查）
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--with-apr=$DEFAULT_PREFIX"
    - "--with-apr-util=$DEFAULT_PREFIX"
    - "--with-pcre=$DEFAULT_PREFIX/bin/pcre-config"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - apr/1.7.6
    - apr-util/1.6.3
    - pcre/8.45

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 需要添加 HarmonyOS 支持"
  - "config.status 临时目录创建失败，需使用固定目录绕过"
