package: words-fi/2.1
homepage: "https://ftp.gnu.org/gnu/aspell/dict/fi/"

upstream_check_command: "none (the upstream Finnish dictionary release has no test target)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests:
  counting_basis: "No upstream test program or test target is shipped"
  total: 0

test_package_tests:
  - file: test_words_fi.cpp
    scenario: normal
    description: "Validate count, strict dictionary order, uniqueness, RFC 3629 UTF-8, Finnish samples, and negative lookup"
    command: "./test_words_fi --expect-count=88328 (WORDS_FI_FILE from Conan run environment)"
  - file: test_words_fi.cpp
    scenario: fault-injection
    description: "Verify that a missing word-list path is rejected"
    command: "./test_words_fi --word-list=<missing-path> --expect-missing"
  - file: test_words_fi.cpp
    scenario: negative-control
    description: "Verify that a native non-HarmonyOS binary rejects --require-ohos"
    command: "./test_words_fi --word-list=<path> --require-ohos"
  - file: test_harmony.py
    scenario: harmonyos-aarch64-device
    description: "Validate OpenHarmony AArch64 and execute the consumer over SSH/SCP; both device-side clang++ and Conan 2.29.1 conan create/test_package passed"
    command: "python test_harmony.py --remote-clang /data/service/hnp/bin/clang++ --host <device> --port <port> --user <user> --identity <key> --word-list <path> --remote-root <writable-executable-temp-root>"
  - file: test_words_fi.cpp
    scenario: harmonyos-x86_64-emulator
    description: "Cross-compile the same consumer and execute its OHOS-only checks on OpenHarmony 6.0.0.47/API 20/x86_64 using SDK HDC"
    command: "clang++ --target=x86_64-linux-ohos --sysroot=<sdk>; hdc file send <consumer-and-word-list>; hdc shell <consumer> --require-ohos --expect-machine=x86_64 --expect-count=88328"

assertion_count: 23

aarch64_conan_verification:
  device: "OpenHarmony-6.1.0.115; API 23; aarch64"
  conan: "2.29.1"
  profile: "os=OHOS; os.version=6.1; arch=armv8; compiler=clang-15; compiler.libcxx=libc++"
  result: "conan create and test_package exited 0; WORDS_FI_TEST_OK entries=88328; missing word-list path rejected"
  source_transport: "pinned archive SHA-256 verified on device; a temporary recipe copy used file:// because direct device HTTPS timed out"

formal_w3:
  device: "OpenHarmony-6.1.0.115; API 23; aarch64"
  conan: "2.29.1"
  profile: "repository ohos-aarch64 profile: OHOS 6.0; armv8; Clang 15; libc++"
  setup: "passed"
  build_and_test: "passed; 1/1 package; L0/L1/L4 passed; L2 skipped for data-only package; L5 had no bin/lib artifacts"
  ci_result: "generated by the repository finish W3 step; exit_code 0; its log_sha256 matches reports/w3-local-ci-aarch64.log"
