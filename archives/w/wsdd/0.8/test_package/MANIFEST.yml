# test_package/MANIFEST.yml - wsdd 0.8
# Upstream test/regressions/run-regressions.sh discovers three shell tests.
# The recipe runs those entries in build() and records environment skips.
package: wsdd/0.8
homepage: "https://github.com/christgau/wsdd"

upstream_check_command: "test/regressions/run-regressions.sh"
upstream_test_in_build: true
upstream_test_command: "test/regressions/run-regressions.sh (individual scripts are executed by build())"
upstream_test_count: 3

upstream_tests:
  - file: test/regressions/01_asyncio_changes_python310/run_tcp.sh
    status: "environment skip: requires Python 3.7-3.11 and netcat"
  - file: test/regressions/01_asyncio_changes_python310/run_unix.sh
    status: "environment skip: requires Python 3.7-3.11 and netcat"
  - file: test/regressions/02_non_existing_interface/run.sh
    status: "executed with Python 3.12; verifies the issue #201 regression"

upstream_test_audit:
  - file: test/netlink_monitor.py
    result: "hardware/environment probe only; not counted as a test"
  - file: test/routesocket_monitor.py
    result: "hardware/environment probe only; not counted as a test"

test_package_tests:
  - file: test_wsdd.py
    description: "Run the packaged wsdd --version and assert version 0.8; run --help and assert the documented interface/hostname options"
    command: "python3 test_wsdd.py <packaged-bin/wsdd>"

assertion_count: 4
