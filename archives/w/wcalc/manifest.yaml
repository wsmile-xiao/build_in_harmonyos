software: wcalc
display: "wcalc"
description: "Arbitrary-precision command-line scientific calculator"
category: utility
homepage: "https://wcalc.sourceforge.net/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Configure with --without-readline; interactive standard input remains available without history or completion"
    - "Patch configure to use umask 022 for config.status temporary files on OHOS HMDFS"
    - "Run all upstream tests and packaged CLI behavior tests in Conan"
  common_dependencies:
    - "gmp/6.3.0"
    - "mpfr/4.2.2.1"

versions:
  "2.5":
    status: built
    build_date: "2026-09-28"
    conan_ref: "wcalc/2.5"
