# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wxwidgets-gtk3/3.2.10
homepage: https://www.wxwidgets.org

# 上游测试套件需要显示连接；鸿蒙 broadway 后端环境下配方明确 wxBUILD_TESTS=OFF。
# 评审复核的上游测试面总量为 858，其中实际在真机运行的非 GUI Catch 子集为 295。
upstream_check_command: "make -C tests all && ./tests/test"
upstream_test_in_build: false
upstream_test_command: "./tests/test"

upstream_tests:
  - file: tests/
    source: wxWidgets-3.2.10/tests/
    description: "上游测试面总量 858（评审复核口径）；其中 tests/test 非 GUI Catch 套件实际运行 295（267 通过、28 失败），其余测试入口因 GUI 显示连接或 OHOS 构建/运行边界未执行"
    command: "./tests/test"

upstream_case_count: 858
upstream_executed_count: 295
upstream_passed_count: 267
upstream_failed_count: 28
upstream_not_run_count: 563
upstream_test_note: "Native HarmonyOS execution: 267/295 executed non-GUI Catch cases passed (assertion-level 1229496/1229604); 563 not-run entries require a display connection or fall outside the tests/test build boundary (see reports/upstream-tests-report.md); not counted as passed."

test_package_tests:
  - file: test_wxgtk3.cpp
    description: "wxGetLibraryVersionInfo/wxColour/wxSize/wxString 无显示 API 消费验证"
    command: "./test_wxgtk3"

assertion_count: 4
