software: wxwidgets-gtk3
# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "3.2.10"
status: built
build_date: "2026-09-02"
build_system: cmake

source:
  url: "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.10/wxWidgets-3.2.10.tar.bz2"
  sha256: "d66e929569947a4a5920699539089a9bda83a93e5f4917fb313a61f0c344b896"
  tar_format: tar.bz2

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DwxBUILD_SHARED=OFF"
    - "-DwxBUILD_SAMPLES=OFF"
    - "-DwxBUILD_TESTS=OFF"
    - "-DwxUSE_GUI=ON"
    - "-DwxBUILD_TOOLKIT=gtk3"
    - "-DwxUSE_THREADS=ON"
    - "-DwxUSE_WEBREQUEST=OFF"
    - "-DwxUSE_LIBPNG=builtin"
    - "-DwxUSE_LIBJPEG=builtin"
    - "-DwxUSE_LIBTIFF=OFF"
    - "-DwxUSE_EXPAT=builtin"
    - "-DwxUSE_OPENGL=OFF"
    - "-DwxUSE_GLCANVAS=OFF"
    - "-DwxUSE_MEDIACTRL=OFF"
    - "-DwxUSE_SOUND=OFF"
    - "-DwxUSE_LIBNOTIFY=OFF"
    - "-DwxUSE_WEBVIEW=OFF"
    - "-DwxUSE_XLOCALE=OFF"
  dependencies:
    - gtk/3.24.43
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-support-ohos-platform.patch"

knowledge_gained:
  - "wx 3.2.10 GTK 端口的 X11 代码全部有 GDK_WINDOWING_X11 编译守卫，可对 broadway-only 的 gtk/3.24.43 构建"
  - "toolkit.cmake 仅在 FindGTK3 检测到 wxHAVE_GDK_X11 时才 find_package(X11 REQUIRED)，broadway 后端下不触发"
  - "png/jpeg 用 wx 内置源码（builtin）避免 libjpeg 与 libjpeg-turbo 同图共存冲突"
  - "3.2.10 上游 tests/ 只能用 autoconf 构建（CMake 无 tests 支持）；autoconf 路径在 OHOS 真机需三处环境修复：config.sub 加 ohos 三元组、mktemp shim 规避 HMDFS ACL、移除 configure 无条件追加的 -lX11（详见 notes.md r8）"
  - "上游非 GUI 测试套件真机实测 295 用例 267 通过/28 失败，失败全部为平台环境差异（沙箱 FS、/tmp 只读、musl locale、HMDFS inotify），与 3.3.3 wxBase 变体观察一致"
