software: wxwidgets-gtk3
display: "wxWidgets (GTK3 GUI variant)"
description: "Cross-platform C++ GUI framework - wxGTK3 variant for HarmonyOS PC"
category: gui
homepage: "https://www.wxwidgets.org"
license: wxWindows Library Licence (LGPL-compatible)
build_system: cmake

ohos_adaptation:
  key_points:
    - "GUI 变体：wxUSE_GUI=ON + wxBUILD_TOOLKIT=gtk3，链接制品仓 gtk/3.24.43（broadway 后端）"
    - "wx GTK 端口的 X11 代码全部有 GDK_WINDOWING_X11 守卫，broadway 后端下编译为空，无需 X11 客户端库"
    - "OHOS 平台检测：toolkit.cmake 补丁（0001）让 CMAKE_SYSTEM_NAME=OHOS 命中 UNIX 分支"
    - "png/jpeg 用 wx 内置（builtin），避免 libjpeg/libjpeg-turbo 同图冲突；TIFF 关闭"
    - "socket 栈保持开启：private/socket.h 的 WX_SOCKLEN_T/SOCKOPTLEN_T 兜底定义在 POSIX 分支改用 socklen_t（OHOS getsockopt/setsockopt 为 socklen_t*）"
    - "musl 无 xlocale：wxUSE_XLOCALE=OFF"
  common_dependencies:
    - "gtk/3.24.43"

versions:
  "3.2.10":
    status: built
    build_date: "2026-09-02"
