# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wren/0.4.0
homepage: "https://wren.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# wren 0.4.0 无 `make check`；官方 CI (.travis.sh) 使用 util/test.py 驱动 wren_test
upstream_check_command: "python3 ./util/test.py"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "python3 ./util/test.py"

# 上游实际运行的测试程序
upstream_tests:
  - file: util/test.py
    source: wren-0.4.0/util/test.py
    description: "官方测试运行器（862 用例 / 3855 expectations，release_64bit 全过）"
    command: "python3 ./util/test.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：创建 Wren VM 并解释执行 Fib(10) 脚本"
    command: "./test_wren"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3855