# 版本级 manifest — wev 1.1.0
# 文件位置: archives/w/wev/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 软件名
software: "wev"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方 archive）
  url: "https://git.sr.ht/~sircmpwn/wev/archive/1.1.0.tar.gz"

  # 源码校验和
  sha256: "89b8d9bc756631795ee91c99a0d5b0877c9f5c3acfe81f77a2b69ecfc15daf16"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游仅提供手写 Makefile，无 configure/cmake）
  system: makefile

  # 无 configure 步骤：Makefile 通过 pkg-config 自行取值
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - wayland/1.24.0           # wayland-client + wayland-scanner
    - libxkbcommon/1.13.1      # 键盘事件名解析
    - libffi/3.4.4             # wayland-client.pc 的 Requires.private
    - wayland-protocols/1.47   # xdg-shell / tablet 协议 XML
    - scdoc/1.11.0             # 生成 wev.1 man page
    - pkgconf/3.0.6            # 提供 pkg-config 实现

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 未改动上游源码：协议生成器/工具差异全部在 conanfile.py 的 generate() 中
# 通过私有目录与合成 .pc 解决
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E077: 制品仓 wayland/1.24.0 的 bin/wayland-scanner 未带 .codesign，HMDFS 上执行报 EPERM(rc=126)；必须先 copy 到私有目录再用 binary-sign-tool 签名才能调用（grim 1.4.0 先例，同一处理）knowledge_ref: E077"
  - "发布机把依赖绝对路径烘进 scanner 的 DT_NEEDED（/…/.cache/conan2/p/expat<hash>/p/lib/libexpat.so）：CONAN_HOME 非该布局的机器上，签名后仍报 'Error loading shared library …/libexpat.so'——须让 conan 缓存同时出现在该路径（CI/release worker 本身即 ~/.cache/conan2 布局）knowledge_ref: E019, E042"
  - "patchelf 不可用于该修法：--replace-needed 之后 binary-sign-tool 报 WriteCodeSignBlock error；先签名再 patchelf 则 open EPERM。绝对路径问题只能靠环境布局对齐，不能靠改写 ELF knowledge_ref: E042, E077"
  - "scdoc 上游不装 .pc，而 wev Makefile 用 pkg-config --variable=scdoc scdoc 取 man 页生成器：合成 scdoc.pc 优于改源码 knowledge_ref: E075"
  - "pkgconf 只装 bin/pkgconf，Makefile 调 pkg-config：在构建目录内建同名 shim 并前置 PATH（不注入共享 /usr/local，R49）knowledge_ref: E075"
  - "basic_layout() 下 make 必须在 source_folder 内执行（协议源文件在源码树内生成），与 scdoc 配方同惯例 knowledge_ref: E232"
