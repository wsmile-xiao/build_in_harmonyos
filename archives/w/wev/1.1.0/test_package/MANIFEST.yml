# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点证据 (R51):
#   1. 上游 1.1.0 tarball 根目录仅含 Makefile/wev.c/shm.c/shm.h/wev.1.scd/LICENSE/README.md
#      —— 无 tests/ 目录、无 *_test.c、无 CI 测试配置
#   2. `make -n` 可见目标只有 all/install/clean（+隐式协议生成目标），
#      不存在 check/test 目标
#   结论：上游 wev 1.1.0 无自测套件，无可运行的上游测试

package: wev/1.1.0
homepage: "https://git.sr.ht/~sircmpwn/wev"

# 上游测试命令（wev 上游 Makefile 无 check/test 目标，故为空）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试，此处为空列表）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "运行 wev 二进制：usage 路径 + 无显示服务器连接失败路径 + 动态依赖链接校验"
    command: "bash test.sh"

# 测试断言总数（test.sh 内 3 组断言：usage 退出码/usage 文本、
# 连接失败退出码/报错文本、readelf 依赖校验）
assertion_count: 6
