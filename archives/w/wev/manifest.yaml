software: wev
display: "wev"
description: "Wayland event viewer（xev for Wayland：查看键盘/指针/触摸板事件）"
category: development-tools
homepage: "https://git.sr.ht/~sircmpwn/wev"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游仅提供手写 Makefile（无 configure/cmake），全部参数经 pkg-config 获取"
    - "依赖 wayland（wayland-client + wayland-scanner）、libxkbcommon、wayland-protocols"
    - "E077：制品仓 wayland 包的 wayland-scanner 未带 .codesign，需私有副本签名后才能执行"
    - "0 补丁：平台差异全部落在 conanfile.py 的 generate()（私有 .pc + shim + 签名副本）"
  common_dependencies:
    - "wayland/1.24.0"
    - "libxkbcommon/1.13.1"
    - "libffi/3.4.4"
    - "wayland-protocols/1.47"
    - "scdoc/1.11.0"
    - "pkgconf/3.0.6"

versions:
  "1.1.0":
    status: published
    build_date: "2026-09-25"
    source_url: "https://git.sr.ht/~sircmpwn/wev/archive/1.1.0.tar.gz"
