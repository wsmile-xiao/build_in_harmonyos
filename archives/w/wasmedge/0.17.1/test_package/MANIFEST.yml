package: wasmedge/0.17.1
homepage: https://github.com/WasmEdge/WasmEdge

upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: "test_package self.run executes 6 portable C API / VM / loader-validation modes and keeps matching ctest --output-on-failure diagnostics"

upstream_tests:
  - path: test/api
    type: upstream C/C++ API and VM runtime tests
    case_count: 6
  - path: test/common
    type: upstream common utility tests
    case_count: 2
  - path: test/executor
    type: upstream executor runtime tests
    case_count: 2
  - path: test/loader
    type: upstream loader tests
  - path: test/validator
    type: upstream validator tests
  - path: test/component
    type: upstream component model tests
  - path: test/host
    type: upstream host/WASI tests
  - path: test/aot
    type: upstream AOT tests requiring LLVM/AOT support

excluded_upstream_tests:
  - command: "full WasmEdge upstream CTest suite"
    reason: "The contest recipe intentionally disables LLVM/AOT, plugins, examples, and tools to keep the base runtime portable in OHOS CI. Full upstream runtime coverage contains AOT/plugin/WASI/socket/tool cases that require dependencies and runtime services outside this base package. The test_package now runs the portable foundation as 6 self.run checks covering version APIs, configure/VM lifecycle, in-memory wasm execution, repeated VM execution, invalid module rejection, and missing exported function rejection, with matching CTest entries for diagnostics."

coverage:
  enabled: false
  reason: "The OHOS contest build executes package-level C API and VM execution validation but does not enable compiler coverage instrumentation or provide a stable gcov/lcov collection step for the cross-built runtime."

test_package_tests:
  - file: test_wasmedge.c
    description: Consumer C API tests are split into 6 runtime modes for version APIs, VM lifecycle, wasm execution, repeated execution, invalid module rejection, and missing function rejection.
    command: "./test_wasmedge --version-api, --vm-lifecycle, --vm-execute-add, --vm-repeat-execute, --reject-invalid-module, --reject-missing-function"
  - file: CMakeLists.txt
    description: Registers six independent CTest entries rather than a single aggregate smoke test.
    command: ctest -N / ctest --output-on-failure

assertion_count: 14
pass_rate: "6/6 package runtime checks pass when target execution is available; cross profiles compile and register all six core runtime tests and defer runtime pass counting to a runnable target profile."
