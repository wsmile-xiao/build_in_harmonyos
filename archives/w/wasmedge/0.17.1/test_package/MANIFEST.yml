package: wasmedge/0.17.1
homepage: https://github.com/WasmEdge/WasmEdge

upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: "upstream CTest inventory reviewed; full runtime suite is not enabled in this reduced LLVM/AOT/plugins/tools-free Conan recipe"

upstream_tests:
  - file: test/
    source: WasmEdge-0.17.1/test/
    description: Upstream CTest-based runtime tests; many cases target full runtime/tool/plugin configurations that are intentionally disabled in this base OpenHarmony PC package.
    command: ctest

excluded_upstream_tests:
  - command: "full WasmEdge upstream CTest suite"
    reason: "The contest recipe intentionally disables LLVM/AOT, plugins, examples, and tools to keep the base runtime portable in OHOS CI. Full upstream runtime coverage should be handled by a separate high-dependency/full-feature recipe."

coverage:
  enabled: false
  reason: "The OHOS contest build executes package-level C API validation but does not enable compiler coverage instrumentation or provide a stable gcov/lcov collection step for the cross-built runtime."

test_package_tests:
  - file: test_wasmedge.c
    description: Consumer C API smoke test links against the packaged wasmedge library and validates public API availability.
    command: test_wasmedge
  - file: CMakeLists.txt
    description: CTest registration for the consumer smoke test.
    command: ctest -N / ctest

assertion_count: 2
