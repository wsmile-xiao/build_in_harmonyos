package: wasmedge/0.17.1
homepage: https://github.com/WasmEdge/WasmEdge

upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: "upstream CTest inventory reviewed; full runtime suite is not enabled in this reduced LLVM/AOT/plugins/tools-free Conan recipe"

upstream_tests:
  - path: test/api
    type: upstream C/C++ API and VM runtime tests
    case_count: 6
  - path: test/common
    type: upstream common utility tests
    case_count: 2
  - path: test/executor
    type: upstream executor runtime tests
    case_count: 2
  - path: test/loader
    type: upstream loader tests
  - path: test/validator
    type: upstream validator tests
  - path: test/component
    type: upstream component model tests
  - path: test/host
    type: upstream host/WASI tests
  - path: test/aot
    type: upstream AOT tests requiring LLVM/AOT support

excluded_upstream_tests:
  - command: "full WasmEdge upstream CTest suite"
    reason: "The contest recipe intentionally disables LLVM/AOT, plugins, examples, and tools to keep the base runtime portable in OHOS CI. Full upstream runtime coverage contains AOT/plugin/WASI/socket/tool cases that require dependencies and runtime services outside this base package. The test_package covers the portable upstream C API, VM lifecycle, and in-memory wasm execution path instead."

coverage:
  enabled: false
  reason: "The OHOS contest build executes package-level C API and VM execution validation but does not enable compiler coverage instrumentation or provide a stable gcov/lcov collection step for the cross-built runtime."

test_package_tests:
  - file: test_wasmedge.c
    description: Consumer C API test checks version APIs, configuration creation, VM lifecycle, successful in-memory wasm execution, and rejection of an invalid wasm module through WasmEdge_VMRunWasmFromBuffer.
    command: test_wasmedge
  - file: CMakeLists.txt
    description: CTest registration for the consumer runtime smoke test.
    command: ctest -N / ctest

assertion_count: 10
