software: wla-dx
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/10.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "10.6"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/vhelin/wla-dx/archive/refs/tags/v10.6.tar.gz"

  # 源码校验和
  sha256: "010c4d426fd1733b978cbca7530a5e68bdfb6f62976c0d5ff7bff447894e19a8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Conan profile 的 generator=Make 在 CMake 4.x 下不工作，需在 conanfile.py 中覆盖为 Unix Makefiles"
  - "conan cache path 返回导出源码目录而非二进制包目录，conan-verify G4 需要符号链接 workaround"
  - "wla-dx 的 CMakeLists.txt 使用 cmake_minimum_required(VERSION 2.8.12)，CMake 4.x 需设置 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "wla-* 汇编器在 OpenHarmony 上因 /tmp 只读无法创建临时文件，但 wlalink 和 wlab 可正常使用"
  - "conan-init 默认生成 Autotools 模板，CMake 项目需手动改写 conanfile.py"
