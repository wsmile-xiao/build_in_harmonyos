package: wmtop/0.85
homepage: "https://www.dockapps.net/"

# 上游测试入口
#
# 上游发布包只有 Makefile.am，未声明 TESTS / check_PROGRAMS，也没有 tests/
# 目录或 configure.ac 测试宏。`make check` 是 automake 在配置阶段始终生成的
# 标准目标，recipe 的 build() 每次构建都会执行它，但该目标没有注册任何用例
# —— 实测上游自动化测试数 = 0（不是"未执行"，是"上游确实没有"）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []

# test_package 自带的消费者视角测试（安装后二进制 + 真实动态库链）
test_package_tests:
  - file: "test.sh"
    description: >-
      Drives the installed wmtop binary on its display-independent paths
      (-v version, unknown-option usage banner, argument validation), asserts
      the AArch64/ELF64 OHOS shape, the real libdockapp/libX11/libXext/libXpm
      DT_NEEDED chain, the absence of RPATH/RUNPATH and the installed man page,
      and checks that the LINUX-only '-m' option (the HarmonyOS -> linux*
      classification in configure.ac) was compiled in.  Additionally executes
      one HarmonyOS-specific consumer use-case: gated on the host kernel, the
      installed binary is launched end-to-end the way a dockapp consumer
      would; the expected clean refusal "can't open display" (exit 1) proves
      the runtime shared-library chain resolves and libdockapp's X11 init is
      reached on HarmonyOS.  The gate is not an assertion; the use-case is an
      executed behaviour test.
    command: "bash test.sh"

# 18 plain assertions + 1 executed HarmonyOS consumer use-case (not counted as
# an assertion; it contributes its own PASS/FAIL to the RESULT line).
assertion_count: 18
harmonyos_consumer_usecase: "executed in test.sh section 8 (gated on host kernel, not an assertion)"
