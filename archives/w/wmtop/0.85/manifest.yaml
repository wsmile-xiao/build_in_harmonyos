# 版本级 manifest
# 文件位置: archives/w/wmtop/0.85/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.85"

software: "wmtop"

# published | built | failed | archived
status: published

build_date: "2026-09-27"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.dockapps.net/download/wmtop-0.85.tar.gz"
  sha256: "a1b7640aac041db98afc4ef65ee288319c06b1104071b14c461dd57500438d02"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    # config.guess 在 HarmonyOS 上无法识别本机，需显式指定 build/host 三元组
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
    - "--prefix=/"
  # 宿主依赖（conan requires）
  dependencies:
    - libdockapp/0.7.3
    - libx11/6.4.0
    - libxext/6.4.0
    - libxpm/3.5.17
  cc: clang
  cxx: clang++

# 构建期工具依赖（conan tool_requires，按 build profile 解析）
build_requires:
  - automake/1.18

# ============================================================
# 补丁信息
# ============================================================

# 上游源码零补丁：configure.ac 的 AS_CASE([$host_os],[linux*]) 直接匹配
# aarch64-linux-ohos 三元组（LINUX 后端含 -m 内存视图与 /proc 读取器）；
# automake 1.18 的 config.sub 接受 aarch64-linux-ohos。
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained: ["OHOS 上 conan 构建树内禁止 execve HMDFS 上的脚本（EACCES/exit 13），解释器二进制不受限：autoreconf 链不可用，须用 perl 直调 .aclocal-real/.automake-real 并显式传 acdir 参数（复刻包内 wrapper 语义），knowledge_ref: 本包 conanfile.py _bootstrap_configure 与 notes.md 问题表 #1", "configure 须用 sh 显式解释执行（sh <configure>），Autotools.configure 的 execve 路径同样被拒，knowledge_ref: notes.md 问题表 #1/#2", "--build == --host 时 configure 判定本地编译并运行 conftest，conftest 链接共享依赖链，必须在运行时内联 LD_LIBRARY_PATH 指向各依赖包 lib 目录，knowledge_ref: notes.md 问题表 #2", "conanbuildenv 导出 SHELL=/data/service/hnp/bin/bash 并被 configure 固化进 Makefile，该 bash 经 BASH_ENV source 的 safe-bin/rm shim（#!/bin/bash 不存在）会导致链接规则 Error 126；须以 SHELL=/bin/sh CONFIG_SHELL=/bin/sh 覆盖并把 /system/bin 前置到 PATH，knowledge_ref: notes.md 问题表 #3", "上游 tarball 无生成好的 configure（仅 configure.ac/Makefile.am），pkg.m4 位于 /data/service/hnp/*/pkg-config*/share/aclocal，须注入 ACLOCAL_PATH 供 PKG_CHECK_MODULES 展开，knowledge_ref: notes.md 编译步骤与问题表 #5"]
