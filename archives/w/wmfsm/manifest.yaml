software: wmfsm
display: "wmfsm"
description: "Window Maker dockapp for monitoring filesystem usage"
category: system
homepage: "https://www.dockapps.net/wmfsm"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "The upstream mount-table reader uses /etc/mtab; the HarmonyOS build falls back to /proc/mounts when that file cannot be opened."
    - "The fallback is generic POSIX C and does not rely on an __OHOS__ preprocessor macro."
    - "The Conan configure command unsets the HMDFS-incompatible CONFIG_SHELL at execution time and supplies the dependency library path for Autoconf probes."
    - "The upstream XPM configuration uses srcdir-relative paths, so the recipe can retain Conan's out-of-source build directory."
    - "This is an application package: package_info exports bin/wmfsm and share resources, not a library. commands.json declares the CLI tool."
    - "Window rendering requires an X server and a dock-capable window manager; headless validation stops after real mount enumeration."
  common_dependencies:
    - libdockapp
    - libx11
    - libxext
    - libxpm

versions:
  "0.36":
    status: built
    build_date: "2026-09-28"
    conan_ref: "wmfsm/0.36"
