package: "wmfsm/0.36"
target: "OHOS/armv8"

upstream_tests_exist: false
upstream_test_audit:
  - source: "upstream archive directory inventory"
    reason: >-
      The extracted 0.36 release has no test/ or tests/ directory and no test-named
      source file.
  - source: "Makefile.am and configure.ac registration scan"
    reason: >-
      Neither file declares TESTS or check_PROGRAMS; the only program target is
      wmfsm. The Automake check target therefore registers no upstream case.
  - source: "upstream make check execution"
    reason: >-
      `make -j1 check` is executed by the package recipe. It completes without
      running any test case; this is an upstream inventory result, not a skipped
      test caused by the HarmonyOS environment.
  - conclusion: >-
      Upstream static tests: 0; executable: 0; ran: 0; passed: 0; skipped: 0;
      failed: 0. The consumer test_package supplies the port-specific runtime
      coverage listed below.

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"
upstream_test_count: 0
upstream_tests_executable: 0
upstream_tests_ran: 0
upstream_tests_passed: 0
upstream_tests_skipped: 0
upstream_tests_failed: 0
upstream_tests_note: >-
  No upstream test was skipped or blocked; the upstream source declares none.

test_package_tests:
  - file: "test_wmfsm.sh"
    description: >-
      Executes the packaged binary's --version and --help modes, then forces the
      /etc/mtab fopen to fail while allowing the real /proc/mounts read. The shim
      bypasses only X window setup, lets wmfsm parse mount entries, and observes
      a successful real statfs call on a parsed mount before reporting success.
    command: "bash test_wmfsm.sh <packaged binary> <test shim> <scratch directory>"
    assertion_count: 3
  - file: "conanfile.py"
    description: >-
      Enforces the native OHOS armv8 consumer host and checks packaged ELF64/
      AArch64 metadata as execution preconditions; these metadata checks are not
      counted as consumer behavior tests.
    command: "conan create archives/w/wmfsm/0.36 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"
    assertion_count: 0

test_package_test_count: 2
consumer_assertion_count: 3
assertion_count: 3
test_case_count: 3
