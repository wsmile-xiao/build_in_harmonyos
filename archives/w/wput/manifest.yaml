software: wput
display: "Wput"
description: "Command-line FTP file uploader"
category: network
homepage: "https://wput.sourceforge.net/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Targets HarmonyOS PC AArch64."
    - "Disables the optional upstream TLS backend because the published HarmonyOS GnuTLS package lacks the compatibility interface this snapshot requires."
    - "Runs configure and make in the source tree because the pinned hand-written Makefiles are not VPATH-safe."
  common_dependencies: []

versions:
  "0.6.2-git20130413":
    status: built
    build_date: "2026-09-26"
