knowledge_gained:
  - "Wput 0.6.2 is a command-line FTP uploader; package only the wput executable and its manual page."
  - "The official SourceForge Git commit 4af565604695b397e50c0595e03dd0062066648e is dated 2013-04-13 and is pinned directly."
  - "The hand-written Makefiles in this snapshot are not VPATH-safe, so configure and make run in the source checkout."
  - "The published OHOS GnuTLS package lacks the OpenSSL-compatibility header and library required by this snapshot, so SSL support is disabled."
  - "The upstream header defines opt as a tentative global in every translation unit; the port uses extern in the header and one definition in wput.c, following repository rule E491 instead of -fcommon."
  - "On HarmonyOS/HMDFS, Autoconf's umask 077 creates a setgid confXXXXXX directory that config.status cannot write. The portability patch changes umask to 007 for both mktemp and mkdir paths so group traversal and writes are retained."
