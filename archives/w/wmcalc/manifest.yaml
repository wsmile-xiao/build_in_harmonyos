software: wmcalc
display: "wmcalc"
description: "WindowMaker 系 X11 dockapp 四则计算器（64x64 桌面小计算器）"
category: utility
homepage: "https://www.dockapps.net/wmcalc"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "依赖三件套 libx11/libxext/libxpm 全部走 ohpcd 已发布的 cmd-pkgs 6.4.0 轨，XPM 贴图面完整保留（对照 asmix/1.5 当年剔 XPM 的补丁路线）"
    - "autoconf 2.69 release tarball：必须 --build/--host 进交叉模式并用 /system/bin/sh 承载 CONFIG_SHELL，否则 conan 缓存目录下 getcwd 不可达直接中断 configure"
    - "PKG_CHECK_MODULES 的 AC_ARG_VAR 逃逸口经 build 环境变量注入六个 *_CFLAGS/*_LIBS，避开 pkgconf tool_requires 与各包 .pc 是否齐备的不确定性"
    - "上游无自动化测试（Makefile.am 无 check、30 文件树无测试代码）；test_package 以 6 条断言真机执行二进制"
    - "鸿蒙 PC 无真实 X display：交付口径为编译 + 交付件硬校验 + 真实失败形态（-d :99 退出码 81）"
  common_dependencies:
    - "libx11/6.4.0"
    - "libxext/6.4.0.1"
    - "libxpm/3.5.17"
    - "xorgproto/2025.1"

versions:
  "0.7":
    status: built
    build_date: "2026-09-27"
    source_url: "https://www.dockapps.net/download/wmcalc-0.7.tar.gz"
