# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: wmcalc/0.7
homepage: "https://www.dockapps.net/wmcalc"

# 上游源码审计（发布包一手清点，非推断）：wmcalc 0.7 无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.am"
    reason: "只有 bin_PROGRAMS = wmcalc、dist_man_MANS、dist_sysconf_DATA、icon/desktop 四条数据规则；grep -c check Makefile.am 实测 0，无 TESTS/check_PROGRAMS/check-local 目标，`make check` 无用例。"
  - source: "configure.ac"
    reason: "仅 AC_INIT/AM_INIT_AUTOMAKE/AC_PROG_CC/三个 PKG_CHECK_MODULES(x11,xext,xpm)/AC_SEARCH_LIBS(pow,m)/AC_CONFIG_FILES([Makefile])；无测试相关宏、无 AC_CONFIG_TESTDIR、没有 AM_INIT_AUTOMAKE 之外的 check 通道。"
  - source: "源码树"
    reason: "发布包 30 个文件实测清单（find -type f | wc -l = 30）：readln.c wmcalc.c wmcalcfunc.c wmcalcswitch.c + 6 个头 + backdrop.xpm calcbuttons.xpm charmap.xpm mask.xbm + autotools 生成物 + README/COPYING/ChangeLog/wmcalc.1/wmcalc.conf/wmcalc.desktop/wmcalc.png；无 tests/、test/、t/ 目录，无 *_test.*/test_*.c 文件。"
  - conclusion: "上游未提供自动化测试套件（清点证据见上三条），故本包真实测试数为 0；消费者验证由 test_package 真机执行被测二进制承担（6 条断言，见 assertion_count）。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_wmcalc.sh
    description: "真实执行 wmcalc 二进制：`-h` 路径（show_usage 在 XOpenDisplay 之前 exit(OKAY)）验退出码 0、banner 程序名、编译期 PACKAGE_VERSION=0.7、usage 选项面板与 man 同源；`-d :99` 路径验鸿蒙 PC 无 X display 的真实失败形态（非 0 退出 + Could not open display）。POSIX sh 写法，经注入的 SHELL=/bin/sh 执行。"
    command: "$SHELL test_wmcalc.sh <package>/bin/wmcalc"

assertion_count: 6
