# 版本级 manifest — wmcalc 0.7
# 文件位置: archives/w/wmcalc/0.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "0.7"
software: "wmcalc"
upstream_name: wmcalc
upstream_version: "0.7"
status: built
build_date: "2026-09-27"
compile_date: "2026-09-27"
build_system: autotools
target_platform: aarch64-unknown-linux-ohos

source:
  # dockapps.net 是 WindowMaker 系聚合站，不是发布点；从其下载页 grep 出 href
  # `/download/wmcalc-0.7.tar.gz` 得到官方址。设备侧连采 3 次 HTTP 200、
  # 119785 B，sha256 与 Debian 池件 wmcalc_0.7.orig.tar.gz 逐字节同值
  # （仅交叉校验，池址按 PF7 不入 conandata）。
  url: "https://www.dockapps.net/download/wmcalc-0.7.tar.gz"
  sha256: "422705d41c2d3a7ff5b88da758a73003fb4dfbab8649e7146bde426cec784040"
  tar_format: tar.gz
  size_bytes: 119785
  version_mapping: "Conan wmcalc/0.7 == 上游 wmcalc 0.7（任务原文串 0.7，未做归一化）"

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--srcdir=<source_folder>"
  build_command: >-
    /system/bin/sh <build_folder>/configure-ohos <configure_options> &&
    make -j1 && make -j1 install DESTDIR=<package_folder>
    （SHELL/CONFIG_SHELL 固定 /system/bin/sh；TMPDIR、MKDIR_P 与六个
    X*_CFLAGS/X*_LIBS 由 build 环境变量注入）
  dependencies:
    - "libx11/6.4.0"
    - "libxext/6.4.0.1"
    - "libxpm/3.5.17"
    - "xorgproto/2025.1"
  cc: clang
  cxx: clang++

patches_applied: []

patch_classification: []

verification:
  preflight:
    command: "bash ci/scripts/preflight_check.sh wmcalc/0.7"
    result: "PASS（配方落地前无依赖声明 -> 预检通过；配方落地后精确依赖按 notes 的 --build=never 逐条复核，同轮对照包 ncurses/6.5 亦 rc=0）"
  conan_create:
    command: "conan create archives/w/wmcalc/0.7 -pr:h=<abs>/ci/conan/profiles/ohos-aarch64 -pr:b=<abs>/ci/conan/profiles/ohos-aarch64"
    result: "PASS（EXIT=0；日志含 Calling build() 与 RUN: make -j1，真跑而非 Cache）"
    log: "reports/conan-create.log"   # 盘上实物；reports/ 整目录被仓根 .gitignore 的 reports/ 通配排除，不随 PR 入库
  test_package:
    command: "conan create 自动执行：/bin/sh test_wmcalc.sh <package_folder>/bin/wmcalc"
    result: "PASS（6/6：二进制存在且非空、-h 退出码 0、banner 程序名、banner 版本 0.7（configure DEFS 的 PACKAGE_VERSION）、usage 五选项面板、无 X display 时 -d :99 非零退出（rc=81 ERR_X_DISPLAY）且输出 Could not open display）"
  upstream_tests:
    result: "N/A（上游 0 条自动化测试：grep -c check Makefile.am = 0；find -type f = 30 个文件无 tests/、test/、*_test 源文件；configure.ac 无测试宏）"
    detail: "见 test_package/MANIFEST.yml 的 upstream_test_audit 小节"

knowledge_gained:
  - "wmcalc 的依赖面只能从 configure.ac 一手读：三个 PKG_CHECK_MODULES(x11/xext/xpm) + AC_SEARCH_LIBS([pow],[m])，Makefile.am 把三组 flag 直接吃进 AM_CFLAGS/LIBS；台账写的档位与依赖描述都需这样复核"  # knowledge_ref: 无（理由：配方取证方法，非 OHOS 平台机制）
  - "profile 的 [buildenv] 把 SHELL/CONFIG_SHELL 设成 hnp bash，而 conan 缓存目录下 bash 的 getcwd() 不可达 ⇒ autoconf 自重解释时直接 'working directory cannot be determined'；必须显式用 /system/bin/sh 跑 configure/make 并覆盖 SHELL/CONFIG_SHELL"  # knowledge_ref: E386
  - "HMDFS 新建目录恒带 setgid，config.status 的 umask 077 临时目录连 owner 都写不进，需在 configure 生成物副本里放宽为 022（并按字面命中数校验，防静默未打上）"  # knowledge_ref: E114, E129
  - "OHOS 沙箱不能执行 conftest，autotools 必须 --build/--host 进交叉模式；wmcalc 的 configure 无 AC_RUN_IFELSE 语义依赖（只 AC_SEARCH_LIBS 链接型检查 + PKG_CHECK_MODULES），跳过运行检查不改变判定结果"  # knowledge_ref: E007
  - "PKG_CHECK_MODULES 的 AC_ARG_VAR 逃逸口只能用环境变量传值：写成 configure 命令行参数时引号被 config.status 原样烘进 Makefile，clang 收到单个带引号参数并静默忽略，症状是 X11/Xlib.h file not found"  # knowledge_ref: DRAFT-WMCALC-0.7-AC-ARG-VAR-CONFIG-STATUS-QUOTE-BAKE-CFLAGS-LOST
  - "libxpm/3.5.17 已发布 OHOS armv8 二进制后，X11 dockapp 的 XPM 贴图面可整体保留，不必再走 asmix/1.5 的剔 XPM 补丁路线"  # knowledge_ref: 无（理由：同族先例增量，非平台机制；对照 archives/a/asmix/1.5/conandata.yml 的 0001 描述）
  - "application 型 X11 包的无头交付口径：-h 走 XOpenDisplay 之前的路径验真实功能与编译期版本宏，-d :99 验失败形态并记录 exit code（本包 81=ERR_X_DISPLAY），比只报编译通过可审"  # knowledge_ref: 无（理由：交付口径先例见 archives/b/bridge-utils/1.5/notes.md 与 archives/m/memdump/1.01）
  - "上游硬编码 CONFTEMPFILE=/tmp/wmcalc.tmp 与 CONFIGGLOBAL=CONF/wmcalc.conf（CONF=sysconfdir）：OHOS 上 /tmp 只读、/etc 不由包放置 ⇒ 保存配置分支在本平台结构性失败，如实申报不裁剪上游功能面"  # knowledge_ref: E002
  - "E490（恢复 autotools 辅助脚本执行位）判真不适用：官方 tarball 解包后 configure=770、install-sh=770、missing=770、compile=770、depcomp=770，执行位本来就在；本包既没丢位也没走 autoreconf 重生成 ⇒ 无可作用载体（一手：stat -c %a 实算）"  # knowledge_ref: E490
