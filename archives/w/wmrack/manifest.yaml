software: wmrack

display: "WMRack — Window Maker Sound Control Panel"
description: "Window Maker / AfterStep dock applet (Wharf swallowable) that controls the CD-ROM drive and the OSS mixer: track & time display, play/pause/stop/eject/load, random play, play lists, volume/balance and record-source control"
category: utility
homepage: "https://sourceforge.net/projects/wmrack/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools package: configure.in is 1997-era but the shipped `configure` was regenerated with GNU Autoconf 2.61 in the 1.4 release tarball."
    - "AC_PATH_X cannot probe X11 in this environment: the X11 headers/libraries live inside Conan packages, not /usr/X11R6. Without --x-includes/--x-libraries configure aborts with 'WMRack needs X Windows!!!'."
    - "configure.in builds the link line from AC_PATH_X + AC_CHECK_LIB: -lX11 comes from x_libraries, -lXpm/-lXext are appended by AC_CHECK_LIB. The -L search paths for the Xpm/Xext packages must be supplied via LIBS/LDFLAGS, otherwise ld.lld fails with 'unable to find library -lXpm/-lXext'."
    - "AC_CHECK_LIB only compiles and links (never executes) its conftest, so this package builds with cross_compiling=no; --host=aarch64-linux-ohos is still passed so a worker that cannot execute aarch64 conftests falls back to cross mode instead of erroring out."
    - "wmrack.c includes <sys/time.h> but not <time.h>: time() is implicitly declared (returns int) which truncates the 64-bit time_t on arm64."
    - "wmrack.c passes a whole TrackInfo struct to a %02d sprintf conversion (undefined behaviour); the intended field is .num."
    - "E114: the Autoconf 2.61 generated `configure` creates its scratch dirs with 'umask 077 && mktemp -d', which on HMDFS yields an unwritable directory; build() rewrites those two spots to umask 022."
    - "E074: make must run with -j1 (SELinux denies the FIFO jobserver)."
    - "E002: /tmp is a read-only erofs mount, TMPDIR is redirected into the Conan build folder."
    - "GUI dockapp needing an X server: at runtime only the dependency chain can be exercised on OHOS (XOpenDisplay is expected to fail with \"can't open display\")."
  common_dependencies:
    - "libxpm/3.5.17"
    - "libx11/6.4.0"
    - "libxext/6.4.0.1"

versions:
  "1.4":
    status: built
    build_date: "2026-09-27"
