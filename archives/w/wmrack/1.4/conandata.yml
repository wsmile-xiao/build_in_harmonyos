# conandata.yml — wmrack 1.4
# Single source of truth for the source URL + SHA256 and the applied patches
# (read by conanfile.py through self.conan_data["sources"] and
# apply_conandata_patches()).

sources:
  url: "https://downloads.sourceforge.net/project/wmrack/wmrack/1.4/wmrack-1.4.tar.gz"
  sha256: "198855b1672cf78c2fa6d486e5490c9fb0d09f850e4e7ad80b478aad36bfb219"

patches:
  - patch_file: "patches/0001-wmrack.c.patch"
    patch_description: "Add the missing #include <time.h> (implicit time() returns int and truncates the 64-bit time_t on arm64), give `static flash` its explicit int type, pass TrackInfo.num instead of the whole struct to the %02d conversion and char[] instead of char(*)[1024] to the %s conversion of sscanf"
    patch_type: "portability"
  - patch_file: "patches/0002-xpmicon.c.patch"
    patch_description: "Pass a literal format string to fprintf(stderr, ...) so the buffer is not interpreted as a format (-Wformat-security)"
    patch_type: "portability"
