# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源（SourceForge 项目发布目录）；tarball 内 configure 由 GNU Autoconf 2.61 生成
  url: "https://downloads.sourceforge.net/project/wmrack/wmrack/1.4/wmrack-1.4.tar.gz"
  sha256: "198855b1672cf78c2fa6d486e5490c9fb0d09f850e4e7ad80b478aad36bfb219"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  # R1 参数最少化。--x-includes/--x-libraries 是 AC_PATH_X 在交叉编译下的必需补偿：
  # X11 头/库位于 Conan 依赖包内而不是 /usr/X11R6（详见 notes.md）
  configure_options:
    - "--x-includes=<libx11 include dir>"
    - "--x-libraries=<libx11 lib dir>"
  dependencies:
    - libx11/6.4.0
    - libxpm/3.5.17
    - libxext/6.4.0.1
    - xorgproto/2025.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-wmrack.c.patch"
  - "patches/0002-xpmicon.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ref: kic 2.4c 先例. AC_PATH_X 无法在交叉编译下探测 X11：X11 位于 Conan 依赖包，必须用 --x-includes/--x-libraries 显式注入，否则 configure 报 'WMRack needs X Windows!!!'"
  - "ref: wmrack 1.4 上游 configure.in. configure 的 AC_CHECK_LIB 只编译链接、不执行 conftest，故本包不加 --host 也能过；仍以 --host=aarch64-linux-ohos 更稳（cross_compiling=maybe 兜底）"
  - "ref: wmrack 1.4 上游 Makefile.in. Makefile LIBS 由 configure 注入 -lX11/-lXpm/-lXext，但 -L 搜索路径来自命令行 LIBS/LDFLAGS，需与 pkg-config libdir 对齐，否则 ld.lld 报 unable to find library -lXpm/-lXext"
  - "ref: wmrack 1.4 上游 wmrack.c. 只 include <sys/time.h> 未 include <time.h>：arm64 上 time() 隐式声明返回 int，64 位 time_t 被截断（补丁 0001）"
  - "ref: wmrack 1.4 上游 wmrack.c. 用 %02d 打印 TrackInfo 结构体（向 varargs 传结构体，真 UB），应取 .num 字段（补丁 0001）"
  - "ref: E074. make 必须 -j1（SELinux 禁止 FIFO jobserver，make -j 会卡死/报错）"
  - "ref: E114. autoconf 2.61 的 configure 用 'umask 077 && mktemp -d' 建临时目录，HMDFS 上会产生不可写目录（drwx--S---），build() 内改写为 umask 022"
  - "ref: E490. HMDFS 适配路径会保留脚本内容但丢失可执行位，build() 内对 configure/install-sh 幂等 chmod +x 并自校验（_restore_autotools_script_modes）"

