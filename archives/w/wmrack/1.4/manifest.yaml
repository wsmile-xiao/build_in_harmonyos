# 版本级 manifest — wmrack 1.4

# 版本号
version: "1.4"

# 软件名
software: "wmrack"

# 编译状态：published = verify 通过 + CI upload；built = verify 通过未 upload
status: built

# 编译日期
build_date: "2026-09-27"
