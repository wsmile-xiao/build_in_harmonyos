# test_package/MANIFEST.yml — wmrack 1.4
# CI L0e requires this file to exist (upstream test declaration).

package: wmrack/1.4
homepage: "https://sourceforge.net/projects/wmrack/"

# ── R51 upstream test inventory (checked against the 1.4 tarball) ──────────
#   * no tests/ (test/, checks/) directory exists in the tarball
#   * configure.in declares no AC_CONFIG_TESTDIR and no TESTSUITE
#   * the Makefiles only define all / install / clean / binclean / distclean /
#     depend plus the XPM style targets — no `check` or `test` target
#   * the tarball contains no test program or test data
# Upstream simply has no automated test suite, so there is nothing to run.
upstream_check_command: "make"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── test_package tests (consumer perspective) ─────────────────────────────
test_package_tests:
  - file: test.sh
    description: |
      Consumer tests for the installed wmrack package — 7 groups, ~19 assertions:
      1. wmrack is installed on PATH.
      2. the packaged artifact is an AArch64 ELF64 executable (ELF magic,
         ei_class and e_machine read with od).
      3. the dynamic dependency chain is recorded in the artifact
         (libX11.so.6 / libXpm.so.4 / libXext.so.6 DT_NEEDED entries plus the
         XOpenDisplay import).
      4. the XPM style selected at build time is compiled into the binary:
         "296 11 4 1" is the alphaled geometry of grey.style only (clean.style
         uses "296 11 2 1"), which proves the Makefile's
         standart.style -> grey.style symlink was really followed by the
         compiler (#include "XPM/standart.style").
      5. `wmrack --help` reproduces the upstream CLI contract: the version
         banner and the usage line go to stderr and the process exits with
         status 1 (upstream usage() calls exit(1)).
      6. running wmrack executes main() up to its device/display stage.
         wmrack opens the OSS mixer before contacting the X server, so the
         stopping point is environment dependent: on OHOS (no /dev/mixer) it
         prints "wmrack: can't read mixer file", on a displayless desktop it
         reaches "can't open display".  Reaching either proves the
         Xpm/X11/Xext dependency chain was loaded, exec-mapped and relocated.
      7. the installed data files exist and are non-empty: bin/wmrack,
         lib/WMRack/grey.style, lib/WMRack/clean.style and
         share/man/man1/wmrack.1.
    command: "bash test.sh"

# Approximate assertion count: test 1 -> 1, test 2 -> 4, test 3 -> 5,
# test 4 -> 1, test 5 -> 3, test 6 -> 1, test 7 -> 4.
assertion_count: 19
