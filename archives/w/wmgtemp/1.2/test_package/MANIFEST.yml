# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e
package: wmgtemp/1.2
homepage: "https://www.dockapps.net/wmgtemp"

# Upstream uses autotools but has no check_PROGRAMS or TESTS in Makefile.am.
# `make check` is the canonical automake target (no-op): "Nothing to be done
# for 'check'" with exit 0.
upstream_check_command: "make check"

# Upstream test integration in build (canonical check target, no-op)
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# Zero upstream automated tests — verified on the wmgtemp 1.2 tarball:
# (1) No tests/ directory: tarball contains Artistic, BUGS, CREDITS,
#     ChangeLog, INSTALL, Makefile.am, Makefile.in, README, TODO, aclocal.m4,
#     configure, configure.ac, wmgtemp.1, examples/wmgtemprc, src/wmgtemp.c,
#     src/wmgtemp-interface.xpm, src/wmgtemp-interface-mask.xbm — no tests/ dir.
# (2) No check_PROGRAMS or TESTS in Makefile.am: only bin_PROGRAMS=wmgtemp,
#     dist_man_MANS=wmgtemp.1, AM_CFLAGS and LIBS. `make -n check` reports
#     "Nothing to be done for 'check'" (rc=0) — a no-op canonical target.
# (3) No test source file and no harness: `make -qp` shows only standard
#     automake targets plus wmgtemp, wmgtemp.o, wmgtemp.c. No gtest/catch2/
#     CUnit/check.h references.
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "HarmonyOS consumer case 1 — wmgtemp -h prints Usage banner and exits 0"
    command: "bash test.sh"
  - file: test.sh
    description: "HarmonyOS consumer case 2 — wmgtemp -h prints version v1.2"
    command: "bash test.sh"
  - file: test.sh
    description: "HarmonyOS consumer case 3 — runtime linkage feasibility: ELF + libsensors + libdockapp/X11 closure loads natively on OHOS"
    command: "bash test.sh"

# Upstream assertion count (0 upstream + 3 consumer)
assertion_count: 3
