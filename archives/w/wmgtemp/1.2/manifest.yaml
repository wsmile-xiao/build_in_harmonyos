# 版本级 manifest — wmgtemp 1.2
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2"
software: "wmgtemp"
status: published
build_date: "2026-09-29"
build_system: autotools

source:
  url: "https://www.dockapps.net/download/wmgtemp-1.2.tar.gz"
  sha256: "dabf70bfaa11c35ec630b1e5d7455570165c937bfe826a3b4d1278d21f0ff6cb"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--host=aarch64-linux-ohos"
  dependencies:
    - libdockapp/0.7.3
    - lm-sensors/3.6.0
  cc: clang
  notes: |
    wmgtemp 1.2 does not ship separate config.guess/config.sub files;
    platform detection is embedded directly in configure. The host
    triplet is passed via --host=aarch64-linux-ohos. lm-sensors ships
    only static libs (libsensors.a), staged in a conan-owned linker-view
    for ld.lld on HMDFS. umask 077→022 patched in configure for FUSE
    filesystem compatibility.

patches_applied: []

knowledge_gained:
  - "wmgtemp 1.2 embeds platform detection directly in configure and ships no config.guess/config.sub copies, so the OHOS port passes --host=aarch64-linux-ohos instead of patching GNU config scripts (ref: E160)."
  - "autoconf-generated configure hardcodes umask 077 around mktemp -d, which breaks on HMDFS/FUSE where 0700 dirs deny child access; rewrite to umask 022 in the recipe build() step (ref: E011)."
  - "lm-sensors ships only a static libsensors.a and ld.lld on HMDFS cannot open dependency libraries straight from the conan cache, so configure/make need a conan-owned linker-view staging dir plus explicit -I/-L for the static-only dependency (ref: E544)."
