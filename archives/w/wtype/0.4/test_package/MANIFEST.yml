# 上游官方测试清点与消费者测试声明；CI L0e 要求此文件。
package: wtype/0.4
homepage: "https://github.com/atx/wtype"

# v0.4 release tarball 不含上游 tests/ 目录或 Meson test target。
upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test"
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "验证已安装 ELF 为无 Conan RPATH 的 AArch64 工具，并在鸿蒙允许执行的 Conan build 目录验证未知 keysym 在 Wayland 连接前被拒绝"
    command: "bash test.sh <package_folder> <build_folder>"

assertion_count: 9
