software: "wtype"
version: "0.4"
description: "Wayland virtual-keyboard command-line tool"
license: "MIT"
category: "tools"
status: "built"
build_date: "2026-09-26"
homepage: "https://github.com/atx/wtype"
source:
  url: "https://github.com/atx/wtype/archive/refs/tags/v0.4.tar.gz"
  sha256: "da91786d828b6a6e29b884bc510473939eda052658ebef87d7bdeafa6a8746f9"
  tar_format: "tar.gz"
build:
  system: "meson"
  dependencies:
    - "wayland/1.24.0"
    - "libxkbcommon/1.8.0"
  configure_options:
    - "wrap_mode=nodownload"
  runtime_linkage: "static Conan Wayland and xkbcommon libraries; system libc.so"
patches_applied: []
knowledge_gained:
  - "wtype embeds the virtual-keyboard XML but still needs wayland-scanner at build time; use the repository's static scanner workaround because the cached dynamic scanner cannot run in the OHOS sandbox (knowledge_ref: knowledge/drafts/DRAFT-ohos-static-tool-bypass-dlopen-limit.kv)."
