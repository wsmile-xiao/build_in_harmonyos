software: webforcpp
display: "WebForCPP"
description: "Modern C++17 header-only library for web services"
category: network
homepage: "https://gitlab.com/tychosoft/webforcpp"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only, CMake 安装头文件与 pkgconfig, 无需编译实体库"
    - "依赖 OpenSSL (https) 与 Threads, httplib 使用阻塞 I/O 与 poll"
    - "上游 ctest 2 用例 (test_json, test_https), 无需补丁"
  common_dependencies:
    - openssl

versions:
  "0.2.0":
    status: built
    build_date: "2026-09-19"
    conan_ref: "webforcpp/0.2.0"
