# test_package/MANIFEST.yml
# Upstream official test declaration — required by CI L0e

package: webforcpp/0.2.0
homepage: "https://gitlab.com/tychosoft/webforcpp"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# Upstream ctest: 2 tests (test_json, test_https) — see CMakeLists.txt add_test
upstream_tests:
  - file: test/json.cpp
    source: webforcpp-v0.2.0/test/json.cpp
    description: "JSON parsing and building (ast_t, parse, make_json, make_array)"
    command: "./test_json"
  - file: test/https.cpp
    source: webforcpp-v0.2.0/test/https.cpp
    description: "HTTPS client creation and net_address parsing"
    command: "./test_https"

# Declared totals for rule4 (must match ctest -N discovered)
upstream_test_total: 2
upstream_test_count_method: ctest_entries

test_package_tests:
  - file: test.cpp
    description: "Consumer test: exercises json parse/build, net_address, url encode/decode, https/http client creation"
    command: "./test_webforcpp"

assertion_count: 12
