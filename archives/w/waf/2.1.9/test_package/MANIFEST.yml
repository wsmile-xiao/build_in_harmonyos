# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点证据（R51 三步法）:
#   * 分发形态清点: waf.io 分发的 waf-2.1.9 为单文件脚本（内嵌 waflib zip），
#     不含 tests/ 目录，无 ctest/pytest 注册项——分发包确无上游测试套件
#   * 上游源码仓清点: https://gitlab.com/ita1024/waf 的 tests/ 目录仅在
#     源码 checkout 中可运行（依赖 waflib 源码树布局），不随发行脚本分发
#   * 功能验证: waf 是构建工具，其等效"测试"是执行一次真实构建——
#     test_package 在 OHOS 真机执行 `waf configure build`
#     （configure 上下文 + check_waf_version 门禁 + rule-based 任务引擎）

package: waf/2.1.9
homepage: "https://waf.io/"

# 分发的单文件脚本不含上游测试命令
upstream_check_command: ""
upstream_test_in_build: false

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试：1) `waf --version` 验证安装与版本；2) 临时目录中真实执行 `waf configure build`（rule-based wscript，check_waf_version 版本门禁 + 任务生成 out.txt），断言构建产物存在且内容正确"
    command: "waf --version && waf configure build"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
