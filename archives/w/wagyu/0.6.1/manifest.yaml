# 版本级 manifest — wagyu 0.6.1
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.6.1"

# 软件名
software: "wagyu"

# 编译状态
# built：本地 OHOS aarch64 设备构建 + 上游 cargo 测试 608/608 + test_package
# 消费端 12/12 通过；未上传发布（合并后确认 release upload 才置 published）。
# Rust 工具链由制品仓基础设施包 rust-toolchain/1.97.1 提供（tool_requires），
# 不依赖系统 cargo、不使用 rustup 引导（rustup 无法识别 HarmonyOS 宿主，E105/E154）。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "cargo"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://github.com/howardwu/wagyu/archive/refs/tags/v0.6.1.tar.gz"

  # 源码校验和（实测 sha256；ArgusHQ/AleoHQ 别名 URL 字节一致）
  sha256: "2458b3d49653acd5df5f3161205301646527eca9f6ee3d84c7871afa275bad9f"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（Rust cargo workspace，无 configure/cmake 入口）
  system: custom

  # 配置选项列表（cargo 无 configure 选项）
  configure_options: []

  # 编译依赖列表（格式: name/version）——纯 Rust 依赖树，无 Conan 运行期依赖
  dependencies: []

  # 构建期工具依赖（tool_requires）
  build_tools:
    - "rust-toolchain/1.97.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Cargo.lock.patch"
  - "0002-main.rs-version-string.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（路径 B 草稿 E674）
knowledge_gained:
  - "Rust 老锁文件（2019 年 Cargo.lock）适配 OHOS aarch64 的组合修复：libc 0.2.61→0.2.189（旧 libc 不识别 aarch64-unknown-linux-ohos，662 个 E0425/E0573）、cc 1.0.40→1.0.41、registry 源补丁 getrandom 0.1.9 加 target_os=ohos（否则 compile_error! target is not supported）与 rustc-serialize 0.3.24 Cow Decodable 补 'static（E0310，0.3.25 未修） # knowledge_ref: E674"
  - "rust-toolchain/1.97.1 基础设施包的二进制无 code signature，OHOS 拒绝 execve（Permission denied / errno 13）：须把 cargo/rustc/librustc_driver 复制进 build folder 用 binary-sign-tool -selfSign 1 签名后再用；cargo 动态链接 libssl/libcrypto/libz 而 OHOS loader 忽略 DT_RUNPATH，须用 conandata rust_runtime 的 Harmonybrew bottle 注入 LD_LIBRARY_PATH # knowledge_ref: E674"
  - "老 build script（gcc-0.3.55，rust-crypto/backtrace-sys 传递依赖）不认 CC_<target> 环境命名，只找裸名 cc：host==target==ohos 时把通用 CC/CXX/AR/RANLIB 也指向 OHOS SDK clang 即可（Failed to find tool. Is cc installed? 的根因） # knowledge_ref: E674"
  - "Harmonybrew bottle 对象存储会随 revision 更新 404（zlib-ng-compat-2.3.3_1、ca-certificates-2026-08-13、rust-1.97.1 实测 404，_2/_1 新版 200）：配方 pin bottle 必须当日实测可达并自己下载复核 sha256，不能照抄历史配方 pin # knowledge_ref: E674"
  - "同名 tag 与 branch 并存时取源陷阱：wagyu 仓库 refs/tags/v0.6.1（9d2bd3a，发行内容）与 refs/heads/v0.6.1（70250ad）同名，git clone --branch 优先命中 branch，只有 archive/refs/tags/ URL 才是发行内容——版本实核必须以 tag archive 的 sha256 为准 # knowledge_ref: E674"
