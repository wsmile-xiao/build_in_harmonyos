# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51：上游测试三步法申报）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: wagyu/0.6.1
homepage: "https://github.com/howardwu/wagyu"

# 上游测试命令（cargo workspace，无 make check / ctest / meson test 入口）
upstream_check_command: "cargo test --release --target aarch64-unknown-linux-ohos --workspace --locked --all-targets"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cargo test --release --target aarch64-unknown-linux-ohos --workspace --locked --all-targets"

# 上游实际运行的测试程序（cargo 单元测试，`#[test]` 宏静态清点 608 个，
# 框架注册（cargo 逐套件 `running N tests`）同为 608 —— 两口径一致，无差额需归因）
upstream_tests:
  - file: "bitcoin/src、ethereum/src、model/src、monero/src、zcash/src（含 zcash 内嵌 field_derive 过程宏 crate）内的 #[test] 单元测试"
    source: "wagyu-0.6.1/<crate>/src/*.rs"
    description: "上游单元测试 608 个（bitcoin 175 / ethereum 74 / model 12 / monero 91 / zcash 255 + field_derive 1；doc-tests 7 个套件注册 0 个用例），608/608 全部通过"
    command: "cargo test --release --target aarch64-unknown-linux-ohos --workspace --locked --all-targets"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_wagyu.py
    description: "消费者冒烟 + 真实功能测试 8 项（--help 版本自证 v0.6.1、bitcoin/ethereum 钱包真实生成、JSON 输出结构、testnet 网络参数）"
    command: "python3 test_wagyu.py"

# 鸿蒙特有测试 (HarmonyOS-specific)：断言产物在本平台可用所必需的特性
# B1 ELF machine = AArch64；B2 PT_INTERP = OHOS musl loader；B3 含 OHOS code
# signature（未签名 ELF 无法 execve，errno 13）；B4 非空可执行文件
harmonyos_specific_tests:
  - file: test_wagyu.py
    description: "鸿蒙特有测试 4 项（AArch64 / musl 解释器 / code signature / 产物完整性）"
    command: "PACKAGE_FOLDER=<pkg> python3 test_wagyu.py"
    assertion_count: 4

# 测试断言总数 (近似值, 用于质量评估)
# 上游 cargo 测试 608（全部通过） + test_package 消费者断言 12（8 冒烟/功能 + 4 鸿蒙平台特性）
assertion_count: 620
