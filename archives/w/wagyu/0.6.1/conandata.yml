# 三个别名 URL 实测字节一致）tag v0.6.1 = 提交 9d2bd3aab61657553c562ba8436f4379c7893a87
# （轻量 tag；注意仓库另有同名**分支** refs/heads/v0.6.1 指向 70250ad，内容不同——
#  `git clone --branch v0.6.1` 会优先命中分支，取源必须用 archive/refs/tags/ URL）

sources:
  url: "https://github.com/howardwu/wagyu/archive/refs/tags/v0.6.1.tar.gz"
  sha256: "2458b3d49653acd5df5f3161205301646527eca9f6ee3d84c7871afa275bad9f"

patches:
  "0.6.1":
    - patch_file: "patches/0001-Cargo.lock.patch"
      patch_description: "Cargo.lock: libc 0.2.61→0.2.189、cc 1.0.40→1.0.41 —— 2019 年锁文件的 libc 不识别 aarch64-unknown-linux-ohos 目标（662 个 E0425/E0573 编译错误），cc 需能识别 ohos 交叉编译；均为 semver 兼容范围内 bump，不改上游依赖声明"
      patch_type: "portability"
    - patch_file: "patches/0002-main.rs-version-string.patch"
      patch_description: "wagyu/main.rs: CLI 自报版本 v0.6.0 → v0.6.1 —— 上游 0.6.1 tag 未同步 bump 硬编码版本串（且 AppSettings::DisableVersion 禁用了 --version），产物 help 头部自报版本必须与打包版本一致，否则消费者版本自证失真"
      patch_type: "bugfix"

# cargo 运行期共享库（OHOS loader 忽略 DT_RUNPATH，需显式 LD_LIBRARY_PATH）。
# rust-toolchain 包内 cargo 动态链接 libssl.so/libcrypto.so/libz.so（readelf -d 实测），
# 设统系统 OpenSSL 版本过低（cargo 1.97 需 3.5+，argc/below 同口径），故用
# Harmonybrew OHOS 预编译 bottle；sha256 为设备实测值（2026-09-23 下载复核）。
# 注意：历史配方 pin 的 zlib-ng-compat-2.3.3_1 / ca-certificates-2026-08-13 /
# rust-1.97.1 bottle 对象存储已 404，本文件只 pin 当日实测 200 的对象。
rust_runtime:
  - name: openssl3
    url: "https://harmonybrew.atomgit.com/bottles/openssl%403-3.6.4.arm64_ohos.bottle.tar.gz"
    sha256: "e1be73c6c68e29c33ff43761045e43e23e7c369f0fb1a24f40e226ec5cb28f98"
  - name: zlib
    url: "https://harmonybrew.atomgit.com/bottles/zlib-ng-compat-2.3.3_2.arm64_ohos.bottle.tar.gz"
    sha256: "99356b80ddb81e0b8267debb44df459f2b5e27e7800406d3b4cf7f8f744beb89"
