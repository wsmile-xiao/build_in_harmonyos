software: workflow
display: "Sogou Workflow"
description: "Sogou C++ Parallel Computing and Asynchronous Network Engine (async HTTP/Redis/MySQL/DNS clients & servers, taskflow graph tasks, algorithm and file tasks)"
category: network
homepage: "https://github.com/sogou/workflow"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS 内核 AIO 的 IOCB_FLAG_RESFD eventfd 完成通知路径无效：io_submit 成功但 epoll_wait 永不唤醒 → 文件任务挂起；USE_THREAD_IOSERVICE 切线程池版 IOService（上游自带备胎，pthread+pipe 通知）"
    - "thread/linux 两版 IOService 类布局不同：WORKFLOW_USE_THREAD_IOSERVICE 宏必须全局定义（顶层 CMakeLists），子目录级定义导致 vtable/字段错乱（pipe_fd 写进 io_ctx 指针）"
    - "消费者必须获得 WORKFLOW_USE_THREAD_IOSERVICE 定义（cpp_info.defines 导出），否则安装头 Communicator.h 会 include 不存在的 IOService_linux.h"
    - "musl msghdr.msg_iovlen 是 int（glibc 为 size_t）：__linux__ 分支的 (size_t)cnt 强转在 C++11 列表初始化构成窄化错误，判定加 __GLIBC__"
    - "上游一致性哈希测试硬编码 libstdc++ std::hash 值，libc++ 上稳定命中另一节点（语义正确，平台豁免）"
    - "Bazel BUILD/WORKSPACE 与 conan build/ 目录在 HMDFS 大小写不敏感冲突（NotADirectoryError），source() 删除"
  common_dependencies:
    - openssl

versions:
  "1.1.0":
    status: published
    build_date: "2026-09-12"
    upstream_test: "37/37 passed + 1 platform-exempt (std::hash STL implementation binding)"
    test_package: "HTTP server+client loopback 200 OK"
