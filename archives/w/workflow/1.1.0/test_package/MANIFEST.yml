# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: workflow/1.1.0
homepage: "https://github.com/sogou/workflow"

# 上游测试命令（gtest 二进制，test/ 下 12 个套件）
upstream_check_command: "cd test/build.cmake && ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试（全部套件在 build() 内构建运行，
# 见 conanfile.py _run_upstream_tests）
upstream_test_in_build: true
upstream_test_command: "cmake --build upstream-tests && ./<suite>_unittest"

# 上游实际运行的测试程序（12 个 gtest 套件，TEST() 总数 30）
upstream_tests:
  - file: test/task_unittest.cc
    source: test/task_unittest.cc
    description: "task 生命周期/counter/timer/file 任务测试"
    command: "./task_unittest"
  - file: test/algo_unittest.cc
    source: test/algo_unittest.cc
    description: "算法任务（sort/parallel_sort）测试"
    command: "./algo_unittest"
  - file: test/http_unittest.cc
    source: test/http_unittest.cc
    description: "HTTP client/server 回环 + TLS server 测试"
    command: "./http_unittest"
  - file: test/redis_unittest.cc
    source: test/redis_unittest.cc
    description: "Redis 协议内置 server 回环测试"
    command: "./redis_unittest"
  - file: test/mysql_unittest.cc
    source: test/mysql_unittest.cc
    description: "MySQL 协议内置 server 回环测试"
    command: "./mysql_unittest"
  - file: test/facilities_unittest.cc
    source: test/facilities_unittest.cc
    description: "WFFacilities WaitGroup/sleep 等设施测试"
    command: "./facilities_unittest"
  - file: test/graph_unittest.cc
    source: test/graph_unittest.cc
    description: "WFGraphTask DAG 图任务测试"
    command: "./graph_unittest"
  - file: test/memory_unittest.cc
    source: test/memory_unittest.cc
    description: "任务 dismiss 内存管理测试"
    command: "./memory_unittest"
  - file: test/upstream_unittest.cc
    source: test/upstream_unittest.cc
    description: "UpstreamManager 负载均衡策略（round robin/weighted/consistent hash/manual）测试"
    command: "./upstream_unittest"
  - file: test/dns_unittest.cc
    source: test/dns_unittest.cc
    description: "DNS 任务创建与解析测试（外部 DNS 弱断言）"
    command: "./dns_unittest"
  - file: test/resource_unittest.cc
    source: test/resource_unittest.cc
    description: "WFResourcePool 资源池测试"
    command: "./resource_unittest"
  - file: test/uriparser_unittest.cc
    source: test/uriparser_unittest.cc
    description: "URIParser URI 解析测试"
    command: "./uriparser_unittest"

# test_package 中自带的测试（消费者视角：WFHttpServer + create_http_task 回环）
test_package_tests:
  - file: test_package.cc
    description: "起 WFHttpServer(127.0.0.1) 并用 create_http_task GET 回环校验 200"
    command: "./test_package"

# 测试断言总数（gtest EXPECT/ASSERT 近似计数）
assertion_count: 30
