# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "1.1.0"
software: "workflow"
status: published
build_date: "2026-09-12"

# 上游信息
upstream:
  homepage: "https://github.com/sogou/workflow"
  url: "https://github.com/sogou/workflow/archive/refs/tags/v1.1.0.tar.gz"
  sha256: "321152d9c9c1d5d0182c098e631f5ccb23f4675760933930f18395a0bb69fac3"
  license: "Apache-2.0"
  lang: "cpp"

# 构建系统
build_system: cmake
compiler: clang 15.0.4 (aarch64-linux-ohos, musl, libc++)
build_type: Release

# 依赖（W0 实测已发布）
dependencies:
  - name: openssl
    version: "3.5.6"
    scope: required  # https/TLS；公共头直接 include <openssl/ssl.h>（transitive_headers）

# 可裁剪组件（上游 GNUmakefile 默认形态）
features:
  kafka: off      # 需 zlib/snappy/zstd/lz4（部分不在制品仓），默认关闭
  redis: on       # 内置协议实现，无外部库依赖
  mysql: on       # 内置协议实现，无外部库依赖
  consul: on      # 内置实现
  upstream: on    # 内置实现
  io_service: thread  # OHOS 内核 AIO RESFD 通知无效，切线程池版（补丁 0002）

# 补丁
patches:
  - file: patches/0001-musl-msg_iovlen.patch
    type: portability
  - file: patches/0002-thread-ioservice-option.patch
    type: portability

# 测试结果
test:
  upstream:
    framework: gtest
    suites: 12
    total: 38
    passed: 37
    failed: 0
    exempt: 1
    exempt_detail: "upstream_unittest.BasicPolicy：一致性哈希 vnode 断言硬编码 libstdc++ std::hash 值（4250947057），libc++ 实现不同导致稳定命中另一节点；哈希语义本身正确（同 key 稳定映射），确定性失败非功能缺陷"
  test_package:
    result: passed
    detail: "WFHttpServer(127.0.0.1:18811) + create_http_task 回环 GET 校验 200 + Content-Type"

