sources:
  url: "https://github.com/sogou/workflow/archive/refs/tags/v1.1.0.tar.gz"
  sha256: "321152d9c9c1d5d0182c098e631f5ccb23f4675760933930f18395a0bb69fac3"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "顶层 CMakeLists 新增 USE_THREAD_IOSERVICE 选项并全局 add_definitions(-DWORKFLOW_USE_THREAD_IOSERVICE)。OHOS 内核 AIO 的 IOCB_FLAG_RESFD eventfd 完成通知无效（io_submit 成功、epoll_wait 永不唤醒，独立 syscall 复现实测），文件任务全部挂起；切线程池版 IOService。宏必须全局定义：thread/linux 两版 IOService 类布局不同，任何翻译单元看到不同布局即 vtable/字段错乱（pipe_fd 写进 io_ctx 指针）。"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-CMakeLists_Headers.txt.patch"
    patch_description: "安装头清单联动：USE_THREAD_IOSERVICE 时安装 IOService_thread.h（消费者需要正确的 IOService 头）。"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-src-kernel-CMakeLists.txt.patch"
    patch_description: "kernel 源文件选择联动：USE_THREAD_IOSERVICE 时编译 IOService_thread.cc（pthread 线程池模拟 AIO，接口与 linux 版一致）。"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0004-src-kernel-Communicator.cc.patch"
    patch_description: "musl msghdr.msg_iovlen 类型修复：glibc 的 msg_iovlen 是 size_t（内核 UAPI 实为 int），musl/OHOS 按内核原型为 int。上游 __linux__ 分支强转 (size_t)cnt 在 C++11 列表初始化构成窄化错误（clang -Wc++11-narrowing）。判定改 __linux__ && __GLIBC__ 仅 glibc 走强转分支；同时 io_bind/io_unbind/shutdown_io_service 的 __linux__ 分支加 !WORKFLOW_USE_THREAD_IOSERVICE（thread 模式走 pipe+PD_OP_NOTIFY 路径）。"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0005-src-include-workflow-Communicator.h.patch"
    patch_description: "公开头 IOService include 选择联动：__linux__ && !WORKFLOW_USE_THREAD_IOSERVICE 时选 IOService_linux.h，否则 IOService_thread.h（与库构建一致）。"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0006-src-kernel-Communicator.h.patch"
    patch_description: "内核侧 Communicator.h 的 IOService include 选择联动（同 0005，双份头必须同步改）。"
    patch_type: "portability"
    strip: 1
