    type: portability
    platform_only: false
    guard: none
    # 人工修正说明：以上 type/platform_only/guard 覆盖 refresh-patch --auto 的默认值
    # （type: auto / platform_only: True / guard: pending）。理由：0001-pom.xml.patch 仅把
    # pom.xml 中 maven-compiler-plugin 的 source/target 由 1.5 改为 8（+2/-2），不含任何
    # 平台宏、也没有平台守卫，属无条件生效的可移植性修复。
    # 注意：finish 的 step [1/10] 会重跑 refresh-patch --auto 并用默认值覆写这三个字段，
