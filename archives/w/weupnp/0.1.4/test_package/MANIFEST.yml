# test_package/MANIFEST.yml
# Upstream test declaration — required by ci/conan/build_and_test.sh (L0e).
package: weupnp/0.1.4
homepage: "https://github.com/bitletorg/weupnp"

# ── upstream automated tests ────────────────────────────────────────────────
# weupnp 0.1.4 has NO automated test entry point. The upstream build itself
# states it: `mvn clean package -B -DskipTests=false` logs
#   [INFO] --- maven-surefire-plugin:3.6.0:test (default-test) @ weupnp ---
#   [INFO] No tests to run.
# and produces no target/surefire-reports.
upstream_tests_exist: false
upstream_test_audit: >-
  Inventory of the official tag archive (weupnp-0.1.4.tar.gz, 11 files):
  `ls src/test` -> No such file or directory; `find . -iname "*test*" | wc -l` -> 0;
  `grep -rn -E "junit|testng|@Test|assertEquals" . | wc -l` -> 0;
  no surefire (or any test) plugin declared in pom.xml;
  pom.xml has no <dependencies> section at all, hence no JUnit/TestNG dependency;
  no CI configuration (*.yml/*.yaml -> 0); no mvnw/gradlew wrapper.
upstream_check_command: "mvn clean package -B -DskipTests=false"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# Only runnable upstream entry point: the demo `Main` class inside the JAR
# (`java -jar weupnp-0.1.4.jar`). Executed as test_package case
# Upstream_Main_entrypoint and separately recorded in
# reports/upstream-verification.md.
upstream_runnable_samples:
  - file: "src/main/java/org/bitlet/weupnp/Main.java"
    source: "weupnp-0.1.4.tar.gz/src/main/java/org/bitlet/weupnp/Main.java"
    description: "Upstream demo entry point: SSDP discovery and port-mapping round trip"
    command: "java -jar libexec/weupnp-0.1.4.jar"

# ── test_package (consumer view, runs inside `conan create`) ────────────────
test_package_tests:
  - file: "TestWeupnp.java"
    description: >-
      23-case consumer suite that drives the real weupnp API through the
      packaged JAR: PortMappingEntry, NameValueHandler, GatewayDeviceHandler
      (incl. the CIF/WAN service state machine), the GatewayDevice SOAP layer
      against a local mock IGD (all six UPnP actions, SOAPAction/Content-Type
      headers, UPnP error path, device description over HTTP), GatewayDiscover
      (constructors, timeout API, live SSDP discovery) and the upstream Main
      entry point — plus 3 OHOS-specific cases.
    command: "javac -cp <jar> TestWeupnp.java && java -Dweupnp.jar=<jar> -cp <jar>:classes TestWeupnp"
  - file: "test.sh"
    description: >-
      POSIX sh compile+run driver; emits HMBS_TEST_PACKAGE_RESULT with total /
      passed / failed / skipped and the OHOS case counts.
    command: "sh test.sh <java> <javac> <jar> <source-dir> <work-dir>"

# Assertion call sites in TestWeupnp.java, reproducible with:
#   grep -o -E '(^|[^A-Za-z0-9_.])(check|eq|contains)\(' TestWeupnp.java | wc -l   -> 101
#   grep -n -E 'static void (check|eq|contains)\(' TestWeupnp.java                  -> the 3 helper definitions
#   101 - 3 = 98 assertion call sites spread over the 23 cases (3 OHOS-specific).
assertion_count: 98
ohos_specific_cases: 3
# Note on naming vs .gitcode/code-style.md §11 ("test_package source files in
# lowercase", examples in C/C++): TestWeupnp.java keeps CamelCase deliberately.
# Java requires a public class name to equal its file name, and every .java test
# source in this repo follows CamelCase (e.g. archives/j/jackson-core/2.14.1/
# test_package/TestJacksonCore.java, archives/j/jflex/1.9.1/test_package/TestLexer.java).
# This is a language-driven deviation from the C/C++ naming example, not a defect.
