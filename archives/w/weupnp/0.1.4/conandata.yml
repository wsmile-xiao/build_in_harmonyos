# conandata.yml — weupnp 0.1.4
#
# 源码：上游官方 GitHub tag 归档（bitletorg/weupnp，tag 全名 weupnp-0.1.4）。
# SHA-256 与 Debian pool 中 weupnp_0.1.4.orig.tar.gz 逐字节一致（双通道身份核验，
# 见 reports/upstream-verification.md）。
sources:
  url: "https://github.com/bitletorg/weupnp/archive/refs/tags/weupnp-0.1.4.tar.gz"
  sha256: "32f80e4249272c1809fd5e4e505a5e67af9600bb72b7993d1cea0a2c9515c333"

patches:
  - patch_file: "patches/0001-pom.xml.patch"
    patch_description: >-
      Raise maven-compiler-plugin source/target from 1.5 to 8. The upstream pom
      hardcodes <source>1.5</source>/<target>1.5</target>, and JDK 17 (the only
      JVM available on OHOS) rejects any source/target below 7. Because the
      values are explicit plugin configuration they cannot be overridden from
      the Maven command line, so the build file itself has to change.
    patch_type: "portability"
