# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: wmload

# 显示名
display: "wmload"

# 一句话描述
description: "Window Maker 风格的系统负载监视器：X11 dockapp，64x64 图标窗口按 /proc/stat 绘制 user/nice/system/idle CPU 占用柱状图"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://www.dockapps.net/wmload"

# 开源许可证（SPDX 标识）
license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "上游是纯手写 Makefile 工程且 CC/CPPFLAGS/CFLAGS/LDFLAGS 全部未赋值（只赋值 LIBS）⇒ 工具链由 conanbuild 环境注入即可，零补丁；固定 LIBS 的 -lX11 -lXpm -lXext 由 AutotoolsDeps 提供的 -L 解析"
    - "上游 install 规则硬编码 PREFIX=/usr/local 且会先重编译 ⇒ 配方直接 collect 产物，不走上游 install（实测 make install rc=2：make: cc: No such file or directory）"
    - "X11 侧本包走 cmd-pkgs 6.4.0 轨（libx11/6.4.0 + libxext/6.4.0 + libxpm/3.5.17），与 libdockapp 系 dockapp 包同轨；混入 1.8.13 轨会产出绑定两套 libX11 soname 的制品"
    - "OHOS SELinux 策略 u:object_r:proc_stat_file:s0 拒绝非特权进程读 /proc/stat（errno=13），与 archives/h/htop/3.4.1 记录一致 ⇒ 上机绘制 CPU 柱状图需提权运行，属平台限制"
    - "选项解析为 switch(argv[i][1])（只看第二字符），长选项会被前缀静默接受；usage() 走 stderr 且首行回显 argv[0] 全路径"
    - "无 X server 的构建宿主：消费者测试分层判定（ARTIFACT / 鸿蒙 procfs / LOADER-PROCESS），GUI 渲染、点击钩子、采样循环逐条 SKIP 带签名与 reason"
  # 跨版本通用依赖
  common_dependencies:
    - libx11
    - libxext
    - libxpm

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.9.7":
    status: built
    build_date: "2026-09-27"
    conan_ref: "wmload/0.9.7"
