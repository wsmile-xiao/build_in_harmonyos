patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 Makefile 只赋值 LIBS（= -lX11 -lXpm -lXext -lm）而完全不赋值 CC/CPPFLAGS/CFLAGS/LDFLAGS：make 从环境取这四项、LIBS 被 Makefile 遮蔽。这个「一半赋值一半不赋值」的切分正是本包可以零补丁的原因——Conan 的 conanbuild 环境提供工具链与 -L 搜索路径（R33），固定的 -l 列表照旧生效"
  - "上游 install 规则硬编码 PREFIX=/usr/local 且 install 依赖 wmload 目标：实测 `make install PREFIX=/ DESTDIR=...` 会先触发重编译并以 `make: cc: No such file or directory` rc=2 失败（未赋值的 CC 退回字面 cc）。配方因此改为直接 collect wmload / wmload.1 / COPYING，不由上游 install 规则产出"
  - "选项解析是 `switch (argv[i][1])`——只看第二个字符。`-wmload-invalid-flag` 的第二字符是 'w'，命中 case 'w' 故被静默接受（等价 -withdrawn），并不报 usage。真正触发 usage() 的只有三条路径：未知开关（default）、开关缺操作数（`if(++i >= argc) usage()`）、非 '-' 开头参数（先打 Invalid argument 再 usage）"
  - "usage() 输出到 stderr 且首行是 `usage:  <argv[0]> [-options ...]`，回显的是调用时的完整路径，所以断言必须绑定不变部分（`[-options ...]` 与 `where options include:`），绑定字面程序名必假失败"
  - "OHOS SELinux 策略（u:object_r:proc_stat_file:s0）拒绝非特权进程读取 /proc/stat：本机实测 open() 返回 errno=13 EACCES，而 /proc/meminfo、/proc/self/status 可读。与 archives/h/htop/3.4.1 记录的「/proc/stat 需 sudo（平台限制）」一致 ⇒ wmload 在鸿蒙 PC 上真正绘制 CPU 柱状图需提权运行，属平台限制而非配方问题"
  - "无头能力按层实测：ARTIFACT 层用 readelf 判架构/.codesign/NEEDED/宿主路径；鸿蒙 procfs 层用合成报文实测上游 skip_token+strtoul 解析与 delta/百分比算术（确定性，不靠采样运气），并对被 SELinux 拦住的真实 /proc/stat 逐条 SKIP 带 errno；LOADER/PROCESS 层以稳定诊断签名 can't open display 为准，GUI 渲染/点击钩子/采样循环三类真不可执行用例逐条 SKIP 带 reason，绝不记成通过"
