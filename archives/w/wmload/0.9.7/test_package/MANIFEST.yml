package: wmload/0.9.7
homepage: "https://www.dockapps.net/wmload"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  Zero upstream automated tests, established by three independent counts on the
  verified 0.9.7 tarball (sha256 efaf701799ca187e4f45ac11240db9461253d4b34158d50d2fdb6693a8ddb6b1,
  checked by the recipe's get() before unpacks). (1) There is no test directory:
  the tarball ships exactly COPYING, ChangeLog, INSTALL, Makefile, README,
  back.xpm, mask.xpm, mask2.xbm, wmload.1 and wmload.c — ten files, one
  translation unit, and `test -d tests` reports ABSENT. (2) There is no check
  target: `make -n check` aborts with "make: *** No rule to make target 'check'.
  Stop." (rc=2) and `make -n test` likewise (rc=2). (3) There is no test source
  file and no harness: `make -qp` shows the only real targets are clean,
  install, wmload, wmload.o and wmload.c (everything else is a make built-in
  suffix rule), and a grep for gtest/catch2/CUnit/ctest/check.h returns nothing.
  This is not an environment limitation; the upstream release simply ships no
  tests. The consumer tests below exercise the built package instead and are
  counted separately from upstream statistics. Note that "make install" IS a
  real target but fails on this host (rc=2, `make: cc: No such file or
  directory`) because it depends on the wmload target and re-enters make with
  the unassigned CC default; the recipe therefore collects artifacts directly
  instead of invoking it (see notes.md problem 2). Because no upstream test
  entry point exists, this package is NOT registered in
  ci/config/no_official_test.txt (that whitelist is for packages that have
  tests which cannot run in CI).

test_package_tests:
  # ---- ARTIFACT layer: asserted in test_package/conanfile.py -------------
  - file: conanfile.py
    name: artifact-elf-architecture
    outcome: passed
    description: >-
      llvm-readelf -h on the packaged bin/wmload must report "Machine: AArch64".
    command: "readelf -h <pkg>/bin/wmload"
  - file: conanfile.py
    name: artifact-codesign-section
    outcome: passed
    description: >-
      The packaged binary carries exactly one .codesign section after OHOS
      self-signing (0 means it cannot be exec'd, >1 means a botched re-sign).
    command: "readelf -SW <pkg>/bin/wmload"
  - file: conanfile.py
    name: artifact-needed-basenames
    outcome: passed
    description: >-
      Every DT_NEEDED entry is a bare soname. Observed set on the device:
      libX11.so.6, libXpm.so.4, libXext.so.6, libc.so — none may contain a
      slash, which would mean an absolute path was baked in. RPATH/RUNPATH
      count is 0.
    command: "readelf -d <pkg>/bin/wmload"
  - file: conanfile.py
    name: artifact-no-host-prefix-leak
    outcome: passed
    description: >-
      The raw bytes of bin/wmload contain no "/usr/local". This is a direct
      consequence of collecting artifacts instead of running upstream's install
      rule, whose PREFIX is hard-coded to /usr/local.
    command: "grep -c /usr/local in bin/wmload byte scan"
  # ---- HARMONYOS PROCDFS layer: ohos_procfs_probe.c ----------------------
  - file: ohos_procfs_probe.c
    name: procfs-abi-widths
    outcome: passed
    description: >-
      LP64 pointer width 8 and 8-byte unsigned long, the widths upstream
      cp_time[] / strtoul() arithmetic relies on. Probes 1-2.
    command: "./ohos_procfs_probe (probes 1-2)"
  - file: ohos_procfs_probe.c
    name: procfs-parse-contract-fixture
    outcome: passed
    description: >-
      The upstream skip_token()+strtoul(x4, base 0) sequence, the aggregate
      "cpu " vs per-cpu "cpuN" discrimination, the delta model and the
      round-half-up percentage split are all driven over synthetic
      /proc/stat-shaped fixtures, plus a truncated record that must be
      REJECTED (-2) so a broken read can never be read as a valid zero sample.
      Deterministic: no dependence on machine load. Probes 3-13.
    command: "./ohos_procfs_probe (probes 3-13)"
  - file: ohos_procfs_probe.c
    name: procfs-live-control-meminfo
    outcome: passed
    description: >-
      /proc/meminfo is opened and read as a control proving this process can
      reach procfs, which is what turns the /proc/stat SKIP below into evidence
      rather than an excuse. Probe 14.
    command: "./ohos_procfs_probe (probe 14)"
  - file: ohos_procfs_probe.c
    name: procfs-live-stat-readable
    outcome: skipped
    description: >-
      open("/proc/stat") — the literal path wmload.c:522 opens — returns
      errno=13 EACCES on this platform: the HarmonyOS SELinux label
      u:object_r:proc_stat_file:s0 denies the file to unprivileged processes.
      The same limitation is already recorded in this repository for htop
      3.4.1 ("/proc/stat 需 sudo（平台限制）"). Reported as SKIP with the errno
      and the label, never as a pass. Environment-dependent branch: on a host
      whose kernel exposes /proc/stat (the CI worker) this probe executes and
      passes, and the two live-delta probes below run for real. Probe 15.
    command: "./ohos_procfs_probe (probe 15)"
  - file: ohos_procfs_probe.c
    name: procfs-live-delta-advance
    outcome: skipped
    description: >-
      The two-sample delta model cannot run here because the data source
      itself is unreadable; skipped for the same reason and with the same
      signature. Environment-dependent branch: on a probe-readable host the
      probe samples up to five 100 ms windows (the nanosleep() idiom of
      wmload.c:375) and asserts, on the final sample, that the cumulative
      counters never regress and that the kernel advanced them so the dockapp
      graph would move. Probes 15-20 on that branch (20/20 pass, CI run
      #62888 after the accumulator fix). Probe 16 here.
    command: "./ohos_procfs_probe (probe 16)"
  # ---- LOADER / PROCESS layer: test_wmload.sh ----------------------------
  - file: test_wmload.sh
    name: loader-version-banner
    outcome: passed
    description: >-
      `wmload -ver` prints "wmload version: 0.9.7". The banner is emitted at
      wmload.c:231 before any X call, so reaching it proves the loader accepted
      the ELF and the whole libX11/libXpm/libXext closure resolved.
    command: "wmload -ver"
  - file: test_wmload.sh
    name: loader-version-exit-code
    outcome: passed
    description: >-
      `wmload -ver` returns exit 0, which is upstream's own `if (argc == 2)
      exit(0)` — not 127 (loader rejection) and not a signal death.
    command: "wmload -ver; echo $?"
  - file: test_wmload.sh
    name: loader-usage-unknown-switch
    outcome: passed
    description: >-
      `wmload -z` reaches usage() through the switch's `default:` branch:
      stderr carries "[-options ...]" and "where options include:", exit 1.
    command: "wmload -z"
  - file: test_wmload.sh
    name: loader-usage-missing-operand
    outcome: passed
    description: >-
      `wmload -u` (operand missing) reaches usage() through the
      `if (++i >= argc) usage()` guard, exit 1. A different parser branch from
      the unknown-switch case.
    command: "wmload -u"
  - file: test_wmload.sh
    name: loader-usage-non-option
    outcome: passed
    description: >-
      `wmload wmload-not-an-option` hits the non-option branch: stderr carries
      "Invalid argument: wmload-not-an-option" followed by usage(), exit 1
      (wmload.c:238-241).
    command: "wmload wmload-not-an-option"
  - file: test_wmload.sh
    name: loader-usage-option-table
    outcome: passed
    description: >-
      The usage table is the tool's whole CLI surface: all eight documented
      entries are present (-u <secs>, -exe <program>, -led <color>,
      -position [+|-]x[+|-]y, -shape, -iconic, -withdrawn, -ver). The needle
      contains bracket groups, so the comparison is a literal substring test.
    command: "wmload -z (stderr) vs help_message[]"
  - file: test_wmload.sh
    name: process-x-display-signature
    outcome: passed
    description: >-
      `wmload` with no argument gets past the loader and fails inside
      XOpenDisplay() with the exact upstream text "can't open display",
      exiting 1. The failure is attributed to the missing X server, not to a
      missing shared library.
    command: "wmload (stderr captured)"
  - file: test_wmload.sh
    name: process-switch-consumption
    outcome: passed
    description: >-
      All seven operand-taking/state switches (-u 1, -exe /bin/echo, -led
      green, -position +0+0, -iconic, -withdrawn, -shape) are consumed by the
      dispatcher without any of them falling through to usage().
    command: "wmload -u 1 | -exe … | -led … | -position … | -iconic | -withdrawn | -shape"
  - file: test_wmload.sh
    name: process-switch-second-character
    outcome: passed
    description: >-
      The dispatcher is `switch (argv[i][1])`, i.e. it keys on the second
      character only, so `-wmload-invalid-flag` is ACCEPTED (its 'w' matches
      `case 'w'`, equivalent to -withdrawn) and produces no usage banner. This
      is asserted positively so that a future refactor to exact-match parsing
      cannot silently change the accepted CLI surface.
    command: "wmload -wmload-invalid-flag"
  # ---- CAPABILITY layer: declared skipped, with observed signatures ------
  - file: test_wmload.sh
    name: gui-dockapp-render
    outcome: skipped
    description: >-
      Drawing the 64x64 load graph needs a live display server; the headless
      build host has none, and the code path starts only after XOpenDisplay()
      succeeds. Reported as WMLOAD_TEST_SKIP with exit code and reason, never
      as a pass.
    command: "wmload -shape"
  - file: test_wmload.sh
    name: click-execute-hook
    outcome: skipped
    description: >-
      The -exe click hook fires from a ButtonPress event, which requires both a
      display server and a pointer device. Reported as WMLOAD_TEST_SKIP.
    command: "wmload -exe /bin/echo"
  - file: test_wmload.sh
    name: procfs-sampling-loop
    outcome: skipped
    description: >-
      GetLoad()'s periodic sampling loop is entered only after XOpenDisplay()
      succeeds, so it cannot run headless; its data source is covered instead
      by ohos_procfs_probe (which reports the platform's SELinux denial of
      /proc/stat as a SKIP with errno, and the live two-sample delta evidence
      on hosts whose kernel exposes the file). Reported as WMLOAD_TEST_SKIP
      rather than silently omitted.
    command: "wmload -u 1"

# Accounting, from the two recorded runs (full signatures in notes.md):
#   conan create exit code 0, log .ci_logs/conan_build_wmload_0.9.7.log
#   - Probe-denied host (local run): probe 16 = 14 pass + 2 skip; smoke 12 =
#     9 pass + 3 skip; 0 failures. This is the locally reproducible accounting
#     used for the numbers below.
#   - Probe-readable host (CI worker, run #62888): the kernel exposes
#     /proc/stat, the probe reports 20 assertions and, after the live
#     accumulator fix (first_total carried the L2 fixture totals into the
#     live comparison while second_total restarted from zero), passes 20/20;
#     smoke unchanged.
static_upstream_test_files: 0
executable_test_cases: 23
measured_passed: 23
measured_skipped: 5
measured_failed: 0

test_case_count: 28
assertion_count: 28
