package: wiggle/1.3
homepage: https://github.com/neilbrown/wiggle

upstream_check_command: "make wiggle && ./dotest"
upstream_test_in_build: true
upstream_test_command: "./dotest"
upstream_tests:
  - "tests/simple/** (33 merge/extract cases)"
  - "tests/linux/** (28 kernel-tree merge cases)"
  - "tests/contrib/** (8 cases)"
  - "tests/lustre/** (1 case)"
  - "tests/mdadm/** (1 case)"
upstream_test_notes: "N_static=71, counted from dotest's registration entries (files named script/diff/ldiff/rediff/merge/wmerge/lmerge/replace/Wmerge/bmerge under tests/): simple=33, linux=28, contrib=8, lustre=1, mdadm=1. The suite runs in recipe build() via ./dotest and passed 71/71 on the device. Note: the `all` make target is not used because it renders the man page via nroff (absent); the `wiggle` target plus ./dotest covers build and tests."

test_package_tests:
  - file: test.sh
    description: "Runs the installed wiggle binary: asserts --version reports wiggle 1.3, merges a 1-hunk patch with -m and compares output byte-exactly against the expected file (no conflict markers), then extracts with -dw and asserts wiggle's annotated change markers (<<<++BRAVO++>>> added / <<<--bravo-->>> removed). Note: wiggle -d exits diff(1)-style 1 when files differ and -w emits wiggle's annotated display rather than a unified diff."
    command: "bash test.sh"

assertion_count: 7
assertion_count_note: "7 logical assertion groups in test.sh; N_consumer=1 program"
