software: wildmidi
version: "0.5.0"
build_system: cmake
status: built
build_date: "2026-09-13"

source:
  url: "https://github.com/Mindwerks/wildmidi/archive/refs/tags/wildmidi-0.5.0.tar.gz"
  sha256: "2164396d5fe80153fd2af9764fcd991883d06fbf1fdfd96efbc99eed21ed1a2f"
  tar_format: tar.gz

build:
  system: cmake
  toolchain: "自发现 ohos.toolchain.cmake + 裸 cmake (libdeflate/wavpack 模式)"
  configure_options:
    - "-DWANT_PLAYER=OFF"
    - "-DWANT_PLAYERSTATIC=OFF"
    - "-DWANT_ALSA=OFF"
    - "-DWANT_OSS=OFF"
    - "-DWANT_SNDIO=OFF"
    - "-DWANT_OPENAL=OFF"
    - "-DWANT_DEVTEST=OFF"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DWANT_SF2=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DBUILD_TESTING=ON"
  dependencies: []
  cc: clang
  sign_so: true

patches_applied: []

knowledge_gained:
  - "wildmidi 0.5.0 库无强制外部依赖: 内置 OPL3 FM 合成器 (Nuked-OPL3-fast + 嵌入式 DMXOPL 音色库) 无需 GUS pat/SF2 文件即可运行"
  - "WANT_PLAYER=OFF 关闭命令行播放器: OHOS 无 ALSA/OSS/SNDIO 音频栈, 播放器不可用; WANT_ALSA/OSS 在非 Linux/BSD 系统上默认 OFF 且依赖 WANT_PLAYER"
  - "上游 CMakeLists cmake_minimum_required(VERSION 3.4...3.10), CMake 4.x 需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "库产物名 libWildM.so.2.2.0 (SONAME libWildMidi.so.2), cmake 导出目标 WildMidi::libwildmidi / WildMidi::libwildmidi-static"
  - "上游测试 test/test_tokenize.c 链接 libwildmidi-static, ctest 原生运行于 OHOS; SF2 支持经内嵌 TinySoundFont"
  - "库为 LGPL-3.0-or-later, 播放器为 GPLv3 (未构建); SPDX 取 LGPL-3.0-or-later"
  - "OHOS SDK llvm/bin 缺 llvm-ranlib (ohos.toolchain.cmake 指向它), 需 -DCMAKE_RANLIB 覆盖 (E385 坑, brotli 同款)"
