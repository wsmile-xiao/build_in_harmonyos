# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求存在)

package: wildmidi/0.5.0
homepage: https://github.com/Mindwerks/wildmidi

# 上游测试命令 (test/ 目录, ctest 注册)
upstream_check_command: "ctest --test-dir build-ohos --output-on-failure"

# conanfile.py build() 中已集成上游测试 (BUILD_TESTING=ON → test_tokenize)
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-ohos --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_tokenize.c
    source: wildmidi-0.5.0.tar.gz/test/test_tokenize.c
    description: "WM_LC_Tokenize_Line 配置行解析单元测试 (带引号路径/空引号/未闭合引号/注释剥离), assert 断言"
    command: "./test_tokenize"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_wildmidi.c
    description: "公开 API 全生命周期: GetString/GetVersion → Init(@opl3 内置合成器) → OpenBuffer(内存生成 MIDI) → GetInfo → GetOutput 合成 PCM → Close/Shutdown"
    command: "ctest test_wildmidi"

# 测试断言总数 (近似值)
assertion_count: 10
