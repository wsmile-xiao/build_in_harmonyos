# 软件级 manifest - wildmidi
# 遵循 ARCHIVE-SPEC v2.0

software: wildmidi
display: "WildMIDI"
description: "WildMIDI - 软件MIDI合成器库（libWildMidi）"
category: multimedia
homepage: "https://mindwerks.net/wildmidi/"
license: LGPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS 无 ALSA/OSS/OpenAL，按上游开关切纯库模式：WANT_PLAYER=OFF、WANT_DEVTEST=OFF"
    - "上游 cmake_minimum_required 下限低于 3.5（0.4.5 为 3.1、0.4.6 为 3.4...3.5）被 CMake 4 拒绝，cmake.configure 命令行 -D CMAKE_POLICY_VERSION_MINIMUM=3.5（E103；toolchain 文件内 set 时机无效）"
    - "上游库产物名为 libWildMidi（大写 WM），cpp_info 按实际产物声明 libs=[WildMidi]"
    - "公开 API 拼写为 WildMidi_*（小写 i），非 WildMIDI_*"
    - "conandata 使用 codeload.github.com 官方 tag 端点（与 /archive/ 同字节流），codeload URL 无后缀需 get(filename=) 防误判 ZIP"
  common_dependencies: []

versions:
  "0.4.5":
    status: published
    build_date: "2026-09-14"
  "0.4.6":
    status: built
    build_date: "2026-09-19"
