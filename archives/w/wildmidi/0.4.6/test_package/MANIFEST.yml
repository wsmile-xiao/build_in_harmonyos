# test_package/MANIFEST.yml — wildmidi 0.4.6 上游测试声明
package: wildmidi/0.4.6
homepage: "https://mindwerks.net/wildmidi/"

# 上游 0.4.6 无任何自动化测试目标：
#   grep -rn "enable_testing\|add_test\|include(CTest)" <src> --include=CMakeLists.txt
#   → 0 命中
# test/test.c 是手工播放示例（需自备 wildmidi.cfg 与 MIDI 资产、无断言），
# src/DevTest.c 是 WANT_DEVTEST 开发工具，二者都不算自动化测试。
upstream_check_command: "ctest -N（CMake 无测试目标，输出 0 项）"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_wildmidi.c
    description: "消费者测试：编译链接 libWildMidi，断言版本宏/GetVersion/GetString(WM_GS_VERSION)、Init 失败路径、GetError、ClearError 清态、未初始化 Shutdown 置 WM_ERR_NOT_INIT（6 组断言）"
    command: "./test_wildmidi（conanrun env，设备真机运行）"

assertion_count: 6
