# test_package/MANIFEST.yml
# wyhash 0-2.gbp234f0c6 (upstream commit 234f0c6).
#
# The pinned snapshot ships a single upstream test program, test_vector.cpp
# (makefile target `test_vector`); there is no ctest/assert harness upstream.
# It prints wyhash(key, seed) for seven official vectors.  The expected stdout
# is recorded in conanfile.py and compared byte-for-byte in build().

package: wyhash/0-2.gbp234f0c6
homepage: https://github.com/wangyi-fudan/wyhash

upstream_tests_exist: true
upstream_test_audit: "commit 234f0c6 contains one upstream test program: test_vector.cpp (makefile: test_vector target)"
upstream_check_command: "compile and run test_vector.cpp; compare stdout with the recorded 7-line baseline"
upstream_test_in_build: true
upstream_test_command: "conanfile.py::build (upstream test_vector.cpp baseline comparison)"
upstream_test_count: 1
upstream_passed: 1
upstream_failed: 0

upstream_tests:
  - file: test_vector.cpp
    source: test_vector.cpp
    description: "prints wyhash(key, seed, _wyp) for 7 official vectors"
    command: "./upstream_test_vector"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_wyhash.cpp
    description: "7 official vectors + wyhash64/wyrand/wy2u0k/wy2u01/wy2gau + >64-byte path through the installed CMake target"
    command: "./test_wyhash"

test_files:
  - path: "test_package/test_wyhash.cpp"
    test_type: "R34"
    assertion_count: 22
    description: "22 checks: 7 upstream vectors, 4 wyhash64, 5 wyrand, 2 wy2u0k, 2 large-buffer, 2 normalization-range"

test_package_test_count: 1
consumer_assertion_count: 22
assertion_count: 22
