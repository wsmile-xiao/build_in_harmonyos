package: words/2.1
homepage: "https://ftp.gnu.org/gnu/aspell/dict/0index.html"

upstream_check_command: "none (the Arch packaging source defines no check() target)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests:
  counting_basis: "The upstream dictionary archives contain data and licenses; the Arch PKGBUILD has no test target"
  total: 0

test_package_tests:
  - file: test_words.py
    scenario: conan-consumer
    description: "Verify all installed dictionary names, UTF-8 content, sorting, uniqueness, aliases, language samples, and upstream licenses"
    command: "conan create archives/w/words/2.1"
  - file: test_harmony.py
    scenario: harmonyos-pc-hdc
    description: "Verify the OpenHarmony API level, stage packaged lists through HDC, and perform on-device language lookups"
    command: "python test_harmony.py <conan-package-folder> --hdc <HarmonyOS-SDK-hdc> --native-consumer <x86_64-HarmonyOS-test-binary>"
  - file: test_words_native.cpp
    scenario: harmonyos-sdk-cross-consumer
    description: "Cross-compile a native dictionary consumer for HarmonyOS x86_64 and AArch64; run x86_64 on the PC emulator"
    command: "<HarmonyOS-SDK-target-clang++> test_words_native.cpp -o test_words_native"

assertion_count: 10
