# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: wiliki/0.6.2
homepage: "https://practical-scheme.net/wiliki/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (wiliki 的 test/ 目录，由 gosh 驱动)
upstream_tests:
  - file: test/core.scm
    source: wiliki-0.6.2/test/core.scm
    description: "核心页面/文本处理测试"
    command: "gosh -I. -I../src core.scm"
  - file: test/format.scm
    source: wiliki-0.6.2/test/format.scm
    description: "格式化输出测试"
    command: "gosh -I. -I../src format.scm"
  - file: test/log.scm
    source: wiliki-0.6.2/test/log.scm
    description: "变更日志测试"
    command: "gosh -I. -I../src log.scm"
  - file: test/edit.scm
    source: wiliki-0.6.2/test/edit.scm
    description: "编辑功能测试"
    command: "gosh -I. -I../src edit.scm"
  - file: test/rss.scm
    source: wiliki-0.6.2/test/rss.scm
    description: "RSS 输出测试"
    command: "gosh -I. -I../src rss.scm"
  - file: test/auth.scm
    source: wiliki-0.6.2/test/auth.scm
    description: "认证机制测试"
    command: "gosh -I. -I../src auth.scm"
  - file: test/test-wiliki.scm
    source: wiliki-0.6.2/test/test-wiliki.scm
    description: "CGI 集成测试（数据库/页面增删/搜索）"
    command: "gosh -I. -I../src test-wiliki.scm"

# test_package 中自带的测试 (消费者视角验证, gosh 加载被测包并调用 API)
test_package_tests:
  - file: test_wiliki.scm
    description: "加载 wiliki.parse 并调用 wiliki-parse-string 验证包内容 (R34)"
    command: "gosh test_wiliki.scm"
