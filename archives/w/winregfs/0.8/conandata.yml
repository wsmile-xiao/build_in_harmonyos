# conandata.yml — winregfs 0.8
# 官方仓库: https://codeberg.org/jbruchon/winregfs (Windows Registry FUSE filesystem)
# 版本标签 v0.8 (2021-09-15)，源码 SHA-256 已核验

sources:
  url: "https://codeberg.org/jbruchon/winregfs/archive/v0.8.tar.gz"
  sha256: "de53ba04050edb45d0b8f9c485bf72502f1782a32ba672a9d8290dbd43aad299"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "Make FUSE_CFLAGS/FUSE_LDFLAGS overridable and add a BUILD_PTHREAD_COMPAT hook, so the OHOS build can inject the libfuse paths (the OHOS libfuse package ships no fuse.pc for pkg-config)"
    patch_type: "portability"
  - patch_file: "patches/0002-pthread_compat.c.patch"
    patch_description: "Add pthread_compat.c supplying the POSIX thread cancellation symbols that libfuse.a references but OHOS musl libc does not export (E085)"
    patch_type: "portability"
