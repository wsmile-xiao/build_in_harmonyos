# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 门禁 L0e 强制要求存在）
#
# winregfs 0.8 上游测试情况（已清点 v0.8 tarball，证据见 notes.md）：
#   上游**没有**自动化测试套件——源码包内无 tests/ 目录、无 ctest/pytest/meson
#   test 注册、无 `make check` 目标（Makefile 仅有 all / install / package 目标）。
#   唯一的测试入口是随包发布的两个可执行工具本身：
#     * fsck.winregfs [-v] <hive>          — 遍历 hive 全部键/值并报告错误
#     * mount.winregfs [-o ro] <hive> <mnt> — FUSE 挂载（需 /dev/fuse + root）
#   因此 test_package 以“调用已安装二进制 + 真实 hive 样本”的方式做消费者验证。

package: winregfs/0.8
homepage: "https://codeberg.org/jbruchon/winregfs"

# 上游测试命令（本包为空：上游无 make check / ctest / meson test 入口）
upstream_check_command: ""

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无自动化测试，故为空列表）
upstream_tests: []

# test_package 中自带的消费者测试（调用已安装二进制）
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 用生成的合法 hive 运行 fsck.winregfs（断言 Keys:2/Values:3/clean），用损坏 hive 验证错误检测，并核验 mount.winregfs -V"
    command: "bash test.sh <bindir>"
  - file: mkhive.py
    description: "测试夹具生成器 — 构造结构合法的 8KB NT registry hive（ntreg.h 布局）"
    command: "python3 mkhive.py <out.hiv>"

# 测试断言总数
assertion_count: 4
