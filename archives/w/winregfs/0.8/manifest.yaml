knowledge_gained:
  - "OHOS libfuse 包不含 fuse.pc，上游 pkg-config fuse 取不到路径 → 需让 Makefile 可注入 FUSE_CFLAGS/FUSE_LDFLAGS（E085 之外的独立问题）"
  - "OHOS musl libc.so 不导出 pthread_cancel/pthread_setcancelstate/pthread_setcanceltype/pthread_testcancel，而 libfuse.a 引用之（E085）→ 提供 pthread_compat.c 以满足链接"
  - "make -jN 在本机 HMDFS 上创建 jobserver FIFO 失败（Operation not permitted）→ 固定 -j1"

