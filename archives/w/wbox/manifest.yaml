software: wbox
display: "Wbox"
description: "HTTP 测试工具：客户端基准测试/压力测试与免配置 HTTP 服务器模式"
category: utility
homepage: "https://www.hping.org/wbox/"
license: BSD-3-Clause

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建（all/clean/dep），无 configure/generate 步骤，OHOS clang 直接编译，零补丁"
    - "仅依赖 libc/POSIX（socket/fork/signal/getaddrinfo），无第三方依赖"
    - "Release 构建需清空上游 Makefile 默认的 DEBUG=-g，否则调试信息会嵌入宿主构建路径"
    - "clients 选项依赖 fork()，在 OHOS 上工作正常；行缓冲统计输出在 SIGINT/正常结束时都会打印"
  common_dependencies: []

versions:
  "5.0":
    status: built
    build_date: "2026-09-23"
    ref: "wbox/5.0"
