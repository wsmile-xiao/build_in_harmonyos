version: "5.0"

software: wbox

# published | built | failed | archived
status: built

build_date: "2026-09-23"
build_system: makefile

source:
  # 上游 www.hping.org/wbox/wbox-5.tar.gz 已 404（hping.org 站点改版），
  # 此处使用 Fedora 权威镜像缓存的上游原样 tarball：
  #   sha256 与 Debian 的 wbox_5.orig.tar.gz 完全一致，解包树 diff -r 无差异
  url: "https://src.fedoraproject.org/lookaside/pkgs/wbox/wbox-5.tar.gz/a95ca2c69982db10704b5ed482c9c722/wbox-5.tar.gz"
  sha256: "1589d85e83c8ee78383a491d89e768ab9aab9f433c5f5e035cfb5eed17efaa19"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "wbox 的 Makefile 用 CFLAGS?= / DEBUG?= -g 的可选赋值，Release 包必须显式传 DEBUG= 清空，否则 -g 会把宿主构建路径写进二进制（鸿蒙专项测试 T3 会因此失败）"
  - "make -jN 在鸿蒙 $TMPDIR 上会因 jobserver mkfifo 不被允许而告警，构建统一用 -j1"
