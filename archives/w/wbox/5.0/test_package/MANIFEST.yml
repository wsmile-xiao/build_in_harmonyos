# test_package/MANIFEST.yml
# 上游测试声明文件（CI 门禁 L0e 强制要求存在）
#
# ── 上游测试清点证据（2026-09-23，源码包 wbox-5.tar.gz，sha256 1589d85e…）──
# 1. 源码包顶层文件清单（tar tzf wbox-5.tar.gz）：
#      wbox-5/{AUTHORS,COPYING,Changelog,Makefile,README,TODO,
#              anet.c,anet.h,sds.c,sds.h,wbox.c,wbsignal.c,wbsignal.h}
#    → 无 tests/ 或 test/ 目录，无 test_*.c / *_test.c 源文件。
# 2. Makefile 目标清单（grep '^[a-z]*:' Makefile）：
#      all / wbox / clean / dep  → 没有 check / test / unittest 目标。
# 3. 源码内自测设施：grep -c 'assert(' *.c → 0，无断言式自测代码。
# 4. 上游无 CI 配置文件（无 .travis.yml / .github/ / configure.ac / CMakeLists.txt）。
# 结论：上游 wbox 5 未提供任何自动化测试入口，可统计的上游用例总数 = 0。
#       上游唯一的"测试入口"是人工按 hping.org/wbox/ 教程操作：
#         client 模式  `wbox 127.0.0.1:<port>/index.html 1 showhdr dump`
#         server 模式  `wbox servermode webroot <dir> serverport <port>`
#       本归档据此实现了可自动执行的等价端到端验证（test_wbox_ohos.sh T5）。

package: wbox/5.0
homepage: "https://www.hping.org/wbox/"

# 上游构建/测试入口（无 check target，`make` 即上游唯一构建入口）
upstream_check_command: "make"
upstream_test_in_build: false
upstream_test_command: ""

# 上游自动化测试用例（清点结果为空）
upstream_tests: []

# test_package 中自带的测试（消费者视角 + OHOS 专项）
test_package_tests:
  - file: test.sh
    description: "smoke：wbox -v 版本串 + 无参 usage 横幅"
    command: "wbox -v"
  - file: test_wbox_ohos.sh
    description: "鸿蒙特有测试：ELF64/PIE/musl/NX 校验 + servermode/client 端到端（200 payload、404、clients 2 fork、连接拒绝退出码 3）"
    command: "wbox servermode webroot <dir> serverport <port> & wbox 127.0.0.1:<port>/index.html 1 showhdr dump"

# 断言总数（test.sh 2 项 + test_wbox_ohos.sh 12 项）
assertion_count: 14
