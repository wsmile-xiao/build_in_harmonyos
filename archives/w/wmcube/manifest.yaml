# Software-level manifest -- wmcube
# Format: ARCHIVE-SPEC v3.0 (see knowledge/ARCHIVE-SPEC.md)

software: wmcube
display: "wmcube"
description: "X11 dockapp showing the current CPU load as a spinning 3D object"
category: utility
homepage: "https://www.dockapps.net/wmcube"
license: GPL-3.0-or-later
build_system: makefile

# ============================================================
# OHOS adaptation notes
# ============================================================

ohos_adaptation:
  key_points:
    - "Hand-written GNU Makefile: wmcube/Makefile plus Makefile.LINUX/FREEBSD/NETBSD/OPENBSD/SOLARIS. No configure, no automake, and no check target at all (only all/clean/install/uninstall)."
    - "The Makefile assigns exactly five relevant variables (CC / CFLAGS / LIBDIR / INCDIR / LIBS); CPPFLAGS and LDFLAGS are used but never assigned, so the Conan conanbuild environment supplies every dependency -I/-L through those two free channels while CFLAGS keeps upstream -Wall -O2."
    - "make command-line variables replace a Makefile assignment instead of appending: overriding CFLAGS=-O0 -g would silently drop -Wall -O2. Only LIBDIR and INCDIR are emptied (stale /usr/X11R6 paths) and CC is taken over (hard-coded gcc); CFLAGS is not overridden."
    - "Link rule is $(CC) $(LDFLAGS) -o wmcube $^ -lXext $(LIBDIR) $(LIBS): the -lXext appears before any -L, so LDFLAGS (delivered by the environment, ahead of -lXext) is what makes libXext findable."
    - "make install is unusable: it runs chown root:root, writes under /usr, and copies the man page into $(MANDIR) without mkdir -p $(MANDIR). package() reproduces the layout with copy() into bin / share/wmcube / share/doc / share/man/man1 / licenses."
    - "Real library set is libx11 + libxext + libXpm: XpmCreatePixmapFromData in wmcube.c, XShapeCombineMask in the bundled wmgeneral/ sources. The app embeds its own wmgeneral library and does not link libdockapp (upstream LIBS has no -ldockapp)."
    - "X11 dockapp => no X server on CI workers. Evidence is limited to ELF machine + DT_NEEDED + the compiled-in usage banner. The -h / rc=1 statement is a STATIC reading of wmcube.c (case 'h': print_help(); return 1, inside the getopt loop, reached before set_plugin/init_calc_cpu/openXwindow), not an executed run: the only execution-side readout this round is the framework L2 probe, which came back as skip, and a skipped probe is NOT product-execution evidence (same split is spelled out in notes.md section 3 repro D and in its runtime capability boundary section). CPU load comes from /proc/stat, whose availability on OHOS was not tested; the default 3D-object directory is the hard-coded /usr/share/wmcube unless -o gives a readable path."
  common_dependencies:
    - libx11
    - libxext
    - libxpm

# ============================================================
# Versions
# ============================================================

versions:
  "1.0.2":
    status: built
    build_date: "2026-09-26"
    conan_ref: "wmcube/1.0.2"
