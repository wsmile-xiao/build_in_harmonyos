# ============================================================
# Knowledge
# ============================================================

knowledge_gained:
  - "A raw Makefile that assigns CFLAGS/LIBDIR/INCDIR but never CPPFLAGS/LDFLAGS: Conan's conanbuild environment reaches the compile and link rules only through the unassigned variables, and because LDFLAGS expands before the hard-coded -lXext it also fixes the -L/-l ordering. Take over on the make command line only what the Makefile assigns, and leave CFLAGS alone so -Wall -O2 is not silently lost. knowledge_ref: knowledge/graph/E465.kv:27 (its forbid_1_reason records that only a make command-line variable overrides a Makefile assignment, which is why CFLAGS is deliberately not taken over) and knowledge/drafts/DRAFT-11940-wmcube-1.0.2-makefile-unassigned-flag-channel.kv:25-35; the applied actions are the two take-over bullets at notes.md:49-55 and the make command line at notes.md:102."
  - "Upstream install rules that call chown root:root / write under /usr / copy into an uncreated $(MANDIR) are reproduced in package() with copy() instead of being patched. knowledge_ref: archives/c/coolmail/1.3/conanfile.py:116 (coolmail records the same reason for the same treatment, so this is reuse of an existing mechanism, not new knowledge); the applied action is the packaging bullet at notes.md:103, cross-checked in the M2 row at notes.md:144."
  - "X11 dockapp family check: an app that ships its own wmgeneral/ sources does not need libdockapp; the real LIBS list (-lXpm -lXext -lX11) plus the symbol scan (XShapeCombineMask -> libXext, XpmCreatePixmapFromData -> libXpm) is the authority. knowledge_ref: no knowledge/graph entry covers this discriminator (the keyword dockapp has 0 hits across graph/drafts/notes, see notes.md:145), so it was established by this package at notes.md:20 with the DT_NEEDED readout at notes.md:120; the no-X-server evidence boundary follows the existing precedent at archives/c/coolmail/manifest.yaml:23."
knowledge_ref:
  - "knowledge/graph/E465.kv:27"
  - "knowledge/graph/E491.kv:21"
  - "knowledge/graph/E491.kv:33"
  - "knowledge/drafts/DRAFT-11940-wmcube-1.0.2-makefile-unassigned-flag-channel.kv:25-35"
  - "archives/c/coolmail/1.3/conanfile.py:116"
  - "archives/c/coolmail/manifest.yaml:23"

