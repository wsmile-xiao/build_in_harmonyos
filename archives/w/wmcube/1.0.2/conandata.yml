patches:
  "1.0.2":
    - patch_file: "patches/0001-wmgeneral-tentative-definition-display.patch"
      patch_description: "wmgeneral/wmgeneral.h:39 held a tentative definition of the global X11 display connection, so the two units that include it (wmcube/wmcube.c:72 and wmgeneral/wmgeneral.c:52, i.e. wmcube.o and wmgeneral/wmgeneral.o) each emitted their own copy, while misc.c and list.c do not include that header at all; two copies are enough - a 1998-era compiler merged those common symbols but clang 15 defaults to -fno-common and the link aborts with `ld.lld: error: duplicate symbol: display`. Declare it extern in the header and keep the single definition in wmgeneral.c, which is rec_priority 1 of knowledge/graph/E491.kv for this class (its forbid_1 bans the -fcommon shortcut). No platform macro is introduced."
      patch_type: "portability"
      strip: 1
