# test_package/MANIFEST.yml — wmcube 1.0.2
# Read by CI (build_and_test.sh L0e). See docs/TEST_QUALITY_SPEC.md.
#
# Upstream test inventory (R51 — counted on the device, not assumed):
#   $ cd wmcube-1.0.2/wmcube && make -n check
#     make: *** No rule to make target 'check'.  Stop.      (rc = 2)
#   $ grep -hoE '^[a-zA-Z_]+::?' Makefile Makefile.* | sort -u
#     all::  clean::  install::  uninstall::  wmcube:      (no check/test target)
#   $ tar tzf wmcube_1.0.2.orig.tar.gz | grep -cE '(^|/)(tests?|testsuite)/'
#     0       (the 68 files of the tarball contain no tests/ directory)
#   $ tar tzf wmcube_1.0.2.orig.tar.gz | grep -c '\.c$'
#     4       (wmcube/wmcube.c, wmgeneral/{list,misc,wmgeneral}.c — none is a test)
#
# Upstream contributes 0 declared and 0 runnable tests; the denominator is never
# reduced and no --disable-* flag is used anywhere in this recipe.

package: wmcube/1.0.2
homepage: "https://www.dockapps.net/wmcube"

# Upstream has no test runner at all: `make check` does not exist.
upstream_check_command: ""
upstream_check_command_evidence: "make -n check -> rc=2, \"make: *** No rule to make target 'check'.  Stop.\"; targets are only all/clean/install/uninstall/wmcube"

# Upstream tests are not compiled/run during build() (there is nothing to run).
upstream_test_in_build: false
upstream_test_command: ""

# Static upstream test count = 0 (see the counted inventory above).
upstream_tests_total: 0
upstream_tests: []

# Adaptation-side tests (this package only).
test_package_tests:
  - file: test.c
    description: "L1 harness over the packaged binary: ELF identity (magic/class/endian/machine/type), section table sanity, DT_NEEDED closure must contain libX11+libXext+libXpm, and the compiled-in -h usage banner / version 1.0.2 / -o plugin help line / default /usr/share/wmcube/ data path"
    command: "./test_wmcube"

assertion_count: 16
