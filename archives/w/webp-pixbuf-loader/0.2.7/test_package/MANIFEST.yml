# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: webp-pixbuf-loader/0.2.7
homepage: "https://github.com/aruiz/webp-pixbuf-loader"

# 上游测试命令 (用于 meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/t1.c
    source: webp-pixbuf-loader-0.2.7/tests/t1.c
    description: "Load 1x1 WebP image via gdk_pixbuf_new_from_file"
    command: "./t1"
  - file: tests/t2.c
    source: webp-pixbuf-loader-0.2.7/tests/t2.c
    description: "Load 200x200 WebP image"
    command: "./t2"
  - file: tests/t3.c
    source: webp-pixbuf-loader-0.2.7/tests/t3.c
    description: "Load WebP animation"
    command: "./t3"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "dlopen pixbufloader-webp module, call fill_info(), verify format name is 'webp'"
    command: "./test_webp_pixbuf_loader"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
