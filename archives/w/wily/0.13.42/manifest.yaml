software: wily
version: "0.13.42"
status: built
build_system: autotools
build_date: "2026-09-27"

source:
  url: "https://deb.debian.org/debian/pool/main/w/wily/wily_0.13.42.orig.tar.gz"
  sha256: "5f5498b11c28c8d1fde7750f133a4ab2faca4b23f2ca0a563103ea34e667c4cb"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build/--host=aarch64-unknown-linux-gnu on OHOS"
    - "--with-x"
    - "--x-includes=<private staged include tree from Conan dependencies>"
    - "--x-libraries=<private staged lib tree from Conan dependencies>"
    - "CFLAGS += -std=gnu89 -fcommon"
    - "X_CFLAGS/X_LIBS point at the private X11 stage"
  dependencies:
    - "libxt/1.3.1 (direct X Toolkit dependency)"
    - "libx11/1.8.13 (direct Xlib dependency and pinned common ABI)"
    - "libsm/1.2.6, libice/1.1.2, xorgproto/2025.1 (transitive through libxt)"
    - "libxcb/1.17.0, libxau/1.0.11, xtrans/1.4.0, xcb-proto/1.17.0 (transitive through libx11)"
    - "libxmu/1.3.1 and libxi/1.8.3 are available in the archive but are not required by this source tree"
  cc: clang
  cxx: clang++

patches_applied: []

tests:
  upstream:
    total: 0
    passed: 0
    failed: 0
    result: "NO_AUTOMATED_UPSTREAM_TEST_SUITE"
    reason: "No TESTS/check target or test harness is wired into the generated Makefiles. libXg/test.c is an interactive GUI demo and tools/python/testwily.py is a Python 1.x manual integration script; neither is an automated test."
  adapted:
    total: 3
    failed: 0
    executed: 3
    passed: 3
    result: "PASS"
    reason: "OpenDesk verified test_wily.sh on the packaged OHOS binary: 3/3 checks passed. The process loaded the packaged X11 dependencies, reached Xt/Xlib startup, and returned the expected missing-display failure."

validation:
  compile: "PASS on OHOS arm64 with clang 15 and the Conan X11 dependency graph."
  artifact: "PASS: bin/wily was built, installed, signed with binary-sign-tool, and exercised by test_package."
  runtime:
    executed: true
    strategy: "Invalid-display startup/load check; no GUI or editing workflow is claimed."

knowledge_gained:
  - "wily initializes Xt in xtbinit() before getopt, so there is no non-GUI version/help smoke path."
  - "wily directly requires libXt and libX11 only; libXmu and libXi are unnecessary despite being present in the archive."
  - "Autoconf 2.4 predates the later getcwd/umask probes; the recipe still uses a private build tree and sets PWD for HMDFS safety, and X_CFLAGS must point at a combined staged X11 prefix."
