package: wily/0.13.42
homepage: "https://packages.debian.org/sid/wily"

upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.in and all subdirectory Makefile.in files"
    reason: "No TESTS, check, check-local, or check_PROGRAMS target is defined. The top-level install rule only copies the built wily binary."
  - source: "configure.in and generated configure"
    reason: "No AC_CONFIG_TESTDIR or other test harness macro is present."
  - source: "libXg/test.c"
    reason: "Interactive X11 graphics demonstration with mouse and keyboard input; it is not included in the build or install targets and is not an automated test."
  - source: "tools/python/testwily.py"
    reason: "Legacy Python 1.x integration/demo script requiring a running wily and Python 1.x syntax; it is not wired into the build and is not a reproducible test suite."
  - conclusion: "wily 0.13.42 has zero automated upstream tests. The recipe truthfully performs no make check."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_wily.sh
    description: "Require bin/wily to be executable, run it with DISPLAY=:65535 and a temporary HOME, require a nonzero exit, and require the Xt/Xlib missing-display diagnostic. This validates dynamic loading and real startup but not GUI creation or editing workflows."
    command: "$SHELL test_wily.sh <package>/bin/wily <LD_PRELOAD_libraries>"

assertion_count: 3

limitations:
  - "wily calls xtbinit() before getopt, so no --version or --help non-GUI path exists."
  - "No X server or GUI workflow is exercised by this test package."
  - "The test does not validate rendering, keyboard/mouse interaction, fonts, clipboard integration, or file editing."
