software: wakeonlan
# 版本级 manifest 模板
# 文件位置: archives/w/wakeonlan/0.42/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.42"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（G4门禁必检字段）
build_system: custom-perl

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (GitHub via gh-proxy mirror due to network restrictions)
  url: "https://gh-proxy.com/https://github.com/jpoliv/wakeonlan/archive/refs/tags/v0.42.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom-perl

  # 配置选项列表 (Perl Makefile.PL, minimal options needed)
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表
  dependencies:
    - perl/5.42.0

  # 编译器
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（如有）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl脚本工具: wakeonlan是一个纯Perl脚本,使用ExtUtils::MakeMaker构建系统"
  - "Perl Makefile.PL构建: perl Makefile.PL生成Makefile, 然后make安装"
  - "纯脚本项目不需要ELF签名(无二进制文件)"
  - "需要修改shebang适配鸿蒙平台"

