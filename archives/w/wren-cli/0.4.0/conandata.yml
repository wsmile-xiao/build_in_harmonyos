# conandata.yml — wren-cli 0.4.0
#
# url 必须是「单值字符串」：CI 的 ci/conan/build_and_test.sh 里 replace_url() 只重写
# 单值带引号的 `url:`，写成 list 会关掉 worker 侧镜像注入（openssl #11127 实录：
# worker 无 curl，直连 github.com 在 20 MiB 处断，日志里根本进不了编译）。
# codeload 与 github.com/…/archive/… 是同一份归档生成器，实测字节一致
# （两端 sha256 均为下面这个值），取 codeload 是因为真机直连 github.com 常超时。
# codeload 的末段是 tag 名、没有 .tar.gz 后缀，所以 conanfile 的 get() 必须显式给
# filename=，否则 conan 按扩展名猜成 zip 报 BadZipFile。
sources:
  url: "https://codeload.github.com/wren-lang/wren-cli/tar.gz/refs/tags/0.4.0"
  sha256: "fafdc5d6615114d40de3956cd3a255e8737dadf8bd758b48bac00db61563cb4c"

patches: []
