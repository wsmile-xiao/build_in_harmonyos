# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wren-cli/0.4.0
homepage: "https://github.com/wren-lang/wren-cli"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# wren-cli 0.4.0 的 dist 树里没有 `make check`，也没有 CMake/CTest：
# 上游官方 CI（.travis.sh）的做法是先 `make -C projects/make config=<配置>`，
# 再用 util/test.py 驱动刚编出来的 bin/wren_cli。本配方沿用这个官方入口。
upstream_check_command: "python3 ./util/test.py"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "\"build/Release/upstream-unit/path_test\" && python3 ./util/test.py"

# 上游实际运行的测试程序
upstream_tests:
  - file: util/test.py
    source: wren-cli-0.4.0/util/test.py
    description: "官方集成测试运行器：逐个跑 test/ 下 95 个 .wren（其中 5 个标 // nontest 是被 import 的模块夹具，不作独立用例；3 个标 // skip: 由上游自身跳过），断言取自 .wren 内的 // expect: 与 // expect runtime error: 标记行；另跑 example/ 下可离线运行的示例。退出码非 0 即有用例失败。"
    command: "python3 ./util/test.py"
  - file: test/unit
    source: wren-cli-0.4.0/test/unit/{main,test,path_test}.c
    description: "上游针对 src/cli/path.c 的 C 单元测试（expectNormalize 52 条），官方 CI 未接入，本配方编译并运行。"
    command: "./build/Release/upstream-unit/path_test"

# test_package 中自带的测试（消费者视角验证，跑的是安装包里的 bin/wren_cli）
test_package_tests:
  - file: test_wren_cli.sh
    description: "端到端消费者套件：--version/--help、语言求值、编译期/运行期错误码（65/70）、io/os/timer 模块（libuv 支撑）、管道 stdin；含一条反向对照断言，证明比较的是真实程序输出。"
    command: "sh test_wren_cli.sh <包目录>/bin/wren_cli"

# 测试断言总数（近似值，用于质量评估）
# = 上游单元 52 + 上游集成期望 216 + 消费者断言 36
assertion_count: 304
