software: wren-cli
display: "wren-cli"
description: "Command-line tool and REPL for the Wren programming language"
category: language
homepage: "https://github.com/wren-lang/wren-cli"
license: MIT
build_system: cmake
ohos_adaptation:
  key_points:
    - "上游 projects/make/*.make 由 premake 生成，release_64bit 配置把 -m64 与 -L/usr/lib64 写死，aarch64/OHOS 上不可用；配方改用 CMake 只编 CLI 自身源码"
    - "tarball 内 deps/wren 与制品仓 wren/0.4.0 逐字节等价（唯一差异是 wren_compiler.c 一处注释拼写），改链发布包而不是重复编虚拟机"
    - "tarball 内 deps/libuv 是 1.38.0 且无 configure/OHOS 支持，改链制品仓已带 OHOS 移植补丁的 libuv/1.52.1.1（CLI 只用 uv_* 公共 API）"
    - "util/test.py 用 relpath 定位测试文件、并固定到 <源码根>/bin/wren_cli 取被测程序，故 CMake 输出目录要钉到源码根 bin/、且必须在源码根运行"
    - "运行上游测试用 env=\"conanbuild conanrun\"：python3 来自 profile [buildenv] 的 PATH，libuv.so 的 LD_LIBRARY_PATH 来自 runenv"
versions:
  "0.4.0":
    status: built
    build_date: "2026-09-20"
    packaging: conan
    notes: "CMake 配方（自写 CMakeLists.txt 导出到源码根）；实跑上游 util/test.py 集成套件 + test/unit C 单测；test_package 端到端消费者用例"
    dependencies:
      - wren/0.4.0
      - libuv/1.52.1.1
