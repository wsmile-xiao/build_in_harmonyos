# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "鸿蒙 PC 的 uname -s 返回 HarmonyOS、内核串为 HongMeng Kernel，2018 版 config.guess 直接 `unable to guess system type`；补一支 `*:HarmonyOS:*:*` 分支映射到 aarch64-unknown-linux-ohos 即可，无需在配方里硬编码 --build/--host（硬编码反而让 configure 走交叉编译分支） (ref: knowledge/drafts/E429-draft-9064)"
  - "config.guess 改完还会被 config.sub 拦住：`machine 'aarch64-unknown-linux' not recognized`。config.sub 的 OS 白名单必须同时补 `linux-ohos*`（maybe_os 分支）与 `-linux-ohos*`（校验列表），只补一处仍报错 (ref: patches/0002-config.sub.patch)"
  - "Conan 2.29 的 AutotoolsToolchain 只下发 defines（CPPFLAGS 里仅 -DNDEBUG），**不下发依赖的 -I/-L**：依赖的头/库目录必须由配方自己 append 到 CPPFLAGS/LDFLAGS，否则 AC_HAVE_LIBRARY(X11) 直接 `configure: error: X11 library is required`（本次 G2 的首个失败点） (ref: knowledge/drafts/E430-draft-0638)"
  - "configure 的 AC_CHECK_SIZEOF 探针要真正运行链接出的 conftest，X11 依赖是共享库且不在默认搜索路径，缺 LD_LIBRARY_PATH 时探针以 127（Error loading shared library libX11.so.6）退出，config.h 里 SIZEOF_UNSIGNED_INT/LONG 被静默写成 0 —— 不报错但产出错配置，比 configure 直接失败更危险；修好后实测为 4 / 8 (ref: knowledge/drafts/E430-draft-0638)"
  - "OHOS clang 链接时已在 ELF 里预留一个 .codesign 节区，但内核只加载经 binary-sign-tool 自签过的包；package() 里自签后用 llvm-readelf -SW 校验 .codesign 计数（重签是覆写既有节区，计数恒为 1，不是新增第二个） (ref: knowledge/doc/E549.md)"
  - "本机（鸿蒙 PC）本地 conan create 有两个与配方无关的环境陷阱：① conan 客户端经 ~/usr/local/bin/python3（HMDFS 上的无签 ELF）启动会落入 SELinux 域 u:r:adhoc_bin:s0，该域被禁止执行用户可写挂载上的任何文件，./configure 恒报 Permission denied(126)，且 chmod / 重建文件都无效（E490 那套在此不生效，真正原因是安全域而非权限位）；② 同一域也无法从 HMDFS 加载 .so，打包出的 wmnd（HMDFS 上的 ELF）运行时报 libX11.so.6 Error loading shared library。绕开方式：用受信任的 bundle 解释器启动 conan，并把 CONAN_HOME 放在非 HMDFS 文件系统上 (ref: knowledge/drafts/E429-draft-9064)"

