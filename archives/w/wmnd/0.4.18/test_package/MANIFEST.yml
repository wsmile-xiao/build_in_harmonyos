# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 清点方法:
#   1. 解压上游源码包 → 列出全部文件（39 个文件，无 tests/ 或 test/ 目录）
#   2. 检查 Makefile.am / src/Makefile.am / configure.ac 的测试注册
#   3. 实测 make check

package: wmnd/0.4.18
homepage: "https://www.thregr.org/~wavexx/software/wmnd/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实测：make check 无注册用例，输出 "Nothing to be done for 'check'"
upstream_tests_exist: false
upstream_test_audit:
  - source: "wmnd-0.4.18 发布包目录树（39 个文件）"
    reason: "不存在 tests/ 或 test/ 目录；仅 src/ 源码、doc/ 手册页与 examples/ 示例配置。"
  - source: "Makefile.am"
    reason: "只声明 SUBDIRS = src 与 man_MANS/dist_examples_DATA；无 TESTS、check_PROGRAMS、check-local。"
  - source: "src/Makefile.am"
    reason: "只声明 bin_PROGRAMS = wmnd 与其源文件列表；没有任何测试程序或测试驱动。"
  - source: "configure.ac"
    reason: "无 AC_CONFIG_TESTDIR / 测试专用 AC_CONFIG_FILES；唯一的 test 相关项是 testing_dummy 显示驱动，属于运行时回退驱动而非测试套件。"
  - source: "make check（鸿蒙真机实测，2026-09-27）"
    reason: "make[2]: Nothing to be done for 'check'. 退出码 0，注册用例数 0。"
  - conclusion: "上游 0.4.18 无自动化测试。本适配新增的是安装产物的消费者用例，不宣称为上游测试覆盖。"

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_wmnd.sh
    description: "T1 交付布局：安装的 bin/wmnd、share/man/man1/wmnd.1、share/doc/wmnd/examples/wmndrc 均存在。"
    command: "sh test_wmnd.sh <package>/bin/wmnd"
  - file: test_wmnd.sh
    description: "T2 版本：wmnd -v 退出 0 且输出 0.4.18。"
    command: "sh test_wmnd.sh <package>/bin/wmnd"
  - file: test_wmnd.sh
    description: "T3 用法：内建驱动表必须包含鸿蒙所用的 linux_proc 驱动与 testing_dummy，且 10 种显示模式全部编入。"
    command: "sh test_wmnd.sh <package>/bin/wmnd"
  - file: test_wmnd.sh
    description: "T4（新增鸿蒙消费者用例）无 X 服务器环境下实际初始化 linux_proc（/proc/net/dev 后端）驱动：输出 forced 接口诊断、未提前退出、进入 X 显示阶段、缺少 X 服务器时退出码 255。"
    command: "sh test_wmnd.sh <package>/bin/wmnd"
  - file: test_wmnd.sh
    description: "T5 回退驱动：testing_dummy 在无显示环境下枚举出合成设备。"
    command: "sh test_wmnd.sh <package>/bin/wmnd"
  - file: test_wmnd.sh
    description: "T6（新增鸿蒙消费者用例）交付 ELF 经 package() 用 binary-sign-tool 重新签名后仍只暴露一个 .codesign 段。"
    command: "sh test_wmnd.sh <package>/bin/wmnd"
  - file: test_wmnd.sh
    description: "T7 隔离性：消费者运行不得在真实 HOME 下生成 ~/.wmndrc。"
    command: "sh test_wmnd.sh <package>/bin/wmnd"
  - file: test_wmnd.sh
    description: "T8（完整消费者用例，端到端执行）在 HarmonyOS 真机上按消费者方式启动安装后的 wmnd（自动发现接口、不强制 -I）：内核接受重签名 ELF → linux_proc 驱动实读内核 /proc/net/dev 并完成接口表初始化 → 流程推进到 X11 显示阶段 → 因镜像无 X 服务器干净退出（exit 255）。整体流程一次判定：exit 127 = 加载器/.codesign 交付损坏，信号死亡 = 移植不稳定，均为失败。"
    command: "sh test_wmnd.sh <package>/bin/wmnd"

# 测试断言总数 (近似值, 用于质量评估)
test_scenario_count: 8
assertion_count: 17
consumer_usecase_count: 1
assertion_count_basis:
  package_layout: 3
  version: 2
  usage_and_driver_set: 5
  ohos_linux_proc_headless: 4
  fallback_driver: 1
  ohos_elf_signing: 1
  home_isolation: 1

# 运行环境说明
x_server_required: false
display_note: "鸿蒙 PC 无 X 服务器，wmnd 在 XOpenDisplay 处按设计退出（exit(-1)=255）；T4/T5 断言的是驱动与设备初始化在其之前已完成。"
proc_net_dev_note: "linux_proc 驱动的自动枚举依赖可读的 /proc/net/dev；沙箱/受限环境下该文件对用户编译产物不可读（EACCES），因此自动枚举结果只作为 info 输出，不作断言。"
