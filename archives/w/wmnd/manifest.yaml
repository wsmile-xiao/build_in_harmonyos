# 软件级 manifest
# 文件位置: archives/w/wmnd/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: wmnd

# 显示名
display: "wmnd"

# 一句话描述
description: "Window Maker 网络设备流量监视 dockapp：X11 64x64 图标窗口按 /proc/net/dev 实时绘制各网络接口收发速率，支持 10 种显示模式与多种数据来源驱动"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: network

# 官网 URL
homepage: "https://www.thregr.org/~wavexx/software/wmnd/"

# 开源许可证（SPDX 标识）
license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "上游 autotools 的 config.guess（2018-02-24 版）不识别 uname -s=HarmonyOS ⇒ 需打 portability 补丁加 *:HarmonyOS:*:* 分支输出 aarch64-unknown-linux-ohos；config.sub 需在 maybe_os 与 OS 校验列表加 linux-ohos*"
    - "Conan 2.29 AutotoolsToolchain 不向 CPPFLAGS/LDFLAGS 下发依赖的 -I/-L（仅 defines）⇒ configure 的 AC_CHECK_LIB(-lX11) 失败报 'X11 library is required'；须在 generate() 里把依赖 cpp_info.includedirs/libdirs 显式拼进 CPPFLAGS/LDFLAGS"
    - "configure 的 AC_CHECK_SIZEOF 编译并运行 conftest ⇒ 依赖共享库必须在 LD_LIBRARY_PATH（否则 SIZEOF_UNSIGNED_INT/LONG 静默为 0），且 pkg-config 需要 PkgConfigDeps 生成的 .pc 目录（xcb required by x11）"
    - "OHOS 上从 HMDFS 执行的 ELF（如 pip 安装的 conan/python3 包装器）会把进程降级到受限 SELinux 域 u:r:adhoc_bin:s0：该域不能 execve HMDFS 上任何文件（含自己刚创建/chmod 的脚本）也不能加载 HMDFS 上的 .so ⇒ conan/ohc-run 必须经受信任 bundle python（/data/storage/el1/bundle/libs/arm64/python/bin/python3，域 u:r:develop_tools_hap:s0）垫片调用"
    - "test_package 运行期同样受 adhoc_bin 域限制：Conan 缓存在 HMDFS 上时 libX11.so.6 加载失败（Error loading shared library）；CONAN_HOME 指向 /data/storage/el2/base/cache（appdat）也不行 ⇒ 完整验证需把 CONAN_HOME 放到非 HMDFS 挂载的 el2 cache 专用 conan-home"
    - "OHOS SELinux 策略拒绝非特权进程读取 /proc/net/dev（errno=13，shell cat 可读但程序 open/stat 均 EACCES，同 htop/wmload 的 procfs 限制家族）⇒ 自动枚举接口在测试中降级为 info，不作断言"
    - "无 X server 的构建宿主：消费者测试以 CLI 模式验证（-v/-h/-F -Q -D linux_proc -I lo/testing_dummy），X11 仅作为链接依赖，x_server_required: false"
    - "上游产出单一可执行文件 ⇒ 需软件级 commands.json（R38）；OHOS 只加载带有效 .codesign 段的 ELF ⇒ package() 用 binary-sign-tool 自签并用 llvm-readelf 校验段计数"
  # 跨版本通用依赖
  common_dependencies:
    - libx11
    - libxext
    - libxpm
    - xorgproto

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.4.18":
    status: published
    build_date: "2026-09-27"
    conan_ref: "wmnd/0.4.18"
