# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: whois/5.6.6
homepage: "https://github.com/rfc1036/whois"

# whois uses Makefile, no configure or check target
upstream_check_command: "make whois"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# whois has no upstream test suite — verified via --version smoke test
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Run whois --version and verify output contains version string"
    command: "whois --version"

# 测试断言总数
assertion_count: 1
