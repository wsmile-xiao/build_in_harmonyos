# test_package/MANIFEST.yml — werkzeug 3.1.8
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: werkzeug/3.1.8
homepage: "https://github.com/pallets/werkzeug"

# 上游测试命令 — pytest（tests/ 目录，25 个 test_*.py 模块 + conftest.py + 资源）
upstream_check_command: "python3 -m pytest tests -q"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
# build() 实际执行的等价命令（<test-venv> = 构建期建的隔离 venv，
# 即 os.path.join(self.build_folder, "test-venv")；basetemp 落在 $HOME 短路径，
# 见下方平台限制说明中 sun_path 108 字节的坑）
upstream_test_command: "<test-venv>/bin/python -m pytest tests -q --no-header -p no:cacheprovider -p timeout --timeout=120 --timeout-method=thread --basetemp=$HOME/.ohc-pytest-basetemp-werkzeug-3.1.8"

# 上游实际运行的测试程序（2026-09-20 实测记录）：
# - tests/ 目录 **25 个 test_*.py 模块**（顶层 16 + tests/middleware/ 6 +
#   tests/sansio/ 3）+ conftest.py + live_apps/ + res/ 资源
# - 实测结果：**967 passed, 1 skipped, 1 deselected**（conan create 内同一结果）
# - 1 skipped 为上游自身 skipif（与平台无关）；1 deselected 见下方平台限制说明
#
# 测试执行方式（本包与 jinja2 3.1.6 的决定性差异）：
#   werkzeug 上游套件含 dev_server 类用例（@pytest.mark.dev_server），经
#   tests/conftest.py 的 DevServerClient **以子进程**启动真实开发服务器，
#   子进程 env 为 {**os.environ, PYTHONUNBUFFERED: 1, PYTHONPATH: tmp_dir}
#   —— 即整体覆盖 PYTHONPATH 且用 sys.executable。因此「把源码目录注入
#   PYTHONPATH」（jinja2 3.1.6 可用）对本包必然失效。
#   本配方按上游 tox（uv-venv-lock-runner、package="wheel"）同一思路：构建期
#   建独立 venv → pip install 被测源码（同时获得包元数据，dev server 需要
#   importlib.metadata.version("werkzeug")）→ 装测试依赖 → 用该 venv 的
#   python 跑套件。markupsafe 是 C 扩展，只能由 Conan 提供，以 .pth 挂入 venv。
#   pytest 须显式 `-p timeout`（PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 后上游
#   test_debug.py 的 @pytest.mark.timeout 会变成未知标记 → 收集报错）。
upstream_tests:
  - file: tests/
    source: werkzeug-3.1.8/tests/
    description: "上游 pytest 套件（25 个 test_*.py 模块：顶层 16 + tests/middleware/ 6 + tests/sansio/ 3，另加 conftest.py + live_apps/ + res/ 资源；实测 967 passed / 1 skipped / 1 deselected）"
    command: "python3 -m pytest tests -q"

# 平台限制（R51 如实申报，非库缺陷）
platform_limitations:
  - test: "tests/test_serving.py::test_server[unix socket]"
    reason: >-
      OHOS SELinux 策略禁止 AF_UNIX 路径型 socket 的 bind()（实测
      `PermissionError: [Errno 1] Operation not permitted`，短路径与 HMDFS 目录
      均被拒；AF_UNIX 常量与 inotify 均正常），进程内自行退避为死等 →
      pytest-timeout 超时。
    classification: "平台限制（知识 E024），仓内先例众多：libfstrm 0.6.1 /
      libmalcontent 0.10.2 / kdbusaddons 6.14.0 / carbon-c-relay 3.7.3 同一处置"
    handling: >-
      配方内 _unix_socket_bindable() **先探针实测**：能 bind 就照常跑该用例，
      被拒才 --deselect 并如实记录——不写死跳过，平台若放开该能力用例自动恢复。
    note: >-
      ⚠️ sun_path 上限约 108 字节；conan build_folder 路径实测 >108 字符，若把
      basetemp 放 build_folder 下，用例会先撞 ENAMETOOLONG 而**掩盖**真实根因
      （EPERM）。配方因此把 basetemp 放在 $HOME 短路径下，探针才能报出准确原因。

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_werkzeug.py
    description: >-
      消费者测试（22 断言，R34 真实 API）：import + **.dist-info 元数据**
      （importlib.metadata.version == 3.1.8，dev server 依赖此项）+ 路由
      （int/path 转换器 + NotFound）+ Request.args 多值与单值 + Response
      status/mimetype + Client GET 往返 + http_date 往返 + dump_cookie
      （默认值断言 **HttpOnly/Secure 不在**，及显式 httponly+samesite）+
      parse_accept_header 质量因子 + BadRequest code/响应 + security
      （generate/check_password_hash 正反例）+ escape 转义（负例）+
      make_server 可导入。含 **3 个负例**（routing NotFound、
      check_password_hash 拒绝错密码、escape 转义 markup）。
    command: "python3 test_werkzeug.py <site-packages-dir>"

# 测试断言总数（实测：22）
assertion_count: 22

# 上游测试实测结果（R51 如实申报）
upstream_test_note: >-
  上游 pytest 套件在 build() 内真实运行，实测 **967 passed, 1 skipped,
  1 deselected**（`conan create` 内 21.5s）。**零失败**：套件退出码非 0
  （含超时 7200s，超时抛 subprocess.TimeoutExpired）时 conan create 直接失败，杜绝
  「测试没跑通但构建成功」。通过率 = 967/(967+0) = **100%**（分母不含上游自身
  skip 与平台限制 deselect）。测试依赖由构建期从平台 pip 镜像取到独立 venv；
  建 venv / 取依赖 / 装被测包任一失败均显式抛错，不以跳过冒充通过。
  test_package 消费者测试：**22/22 passed**。
