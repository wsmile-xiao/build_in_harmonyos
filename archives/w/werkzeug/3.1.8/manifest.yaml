  url: "https://files.pythonhosted.org/packages/dd/b2/381be8cfdee792dd117872481b6e378f85c957dd7c5bca38897b08f765fd/werkzeug-3.1.8.tar.gz"
  sha256: "9bad61a4268dac112f1c5cd4630a56ede601b6ed420300677a869083d70a4c44"
  compression: tar.gz
  archive_root: "werkzeug-3.1.8"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "markupsafe/3.0.3"
  optional: []
  note: |
    pyproject.toml: dependencies = ["markupsafe>=2.1.1"]，requires-python = ">=3.9"。
    ohpcd 已发布 markupsafe/3.0.3（满足 >=2.1.1），实测 conan download 可拉取。

    测试依赖（上游 pyproject.toml [dependency-groups] tests 的子集）：
    pytest>=7 + pytest-timeout + ephemeral-port-reserve + watchdog + cffi +
    cryptography。均**未**发布到 ohpcd（cffi 只有 Common Lisp 的 0.24.1，
    与 Python cffi 无关），按 PF4 不写成 test_requires，改为构建期从平台 pip
    镜像取到独立 venv 中运行。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Python 无编译产物；不产生 bindirs，故无需
    commands.json，R38 不适用）。

    上游 3.1.8 采用 **src 布局**（`src/werkzeug/`）与 flit_core 构建后端
    （pyproject.toml: requires = ["flit_core<4"], build-backend =
    flit_core.buildapi）。纯 Python 无需编译，故 package() 直接把
    `src/werkzeug` 拷入 `<pkg>/lib/python3.12/site-packages/werkzeug`。

    **必须同时补一个最小 .dist-info**：werkzeug/serving.py:813 在构造 WSGI
    server 时调用 `importlib.metadata.version("werkzeug")`；仅把源码放进
    site-packages 会报 PackageNotFoundError（实测：dev server 起不来，
    dev_server 类用例全部超时）。纯复制策略下没有 PEP 517 构建产物，故按
    cookiecutter 2.7.1 先例手写 METADATA + RECORD。

    package_info() 同时声明 runenv_info 与 buildenv_info 的 PYTHONPATH
    （aiohttp 教训：仅 print 不够，CI 会报 "No module named ..."）。

    **测试执行方式（本包与 jinja2 3.1.6 的决定性差异）**：werkzeug 上游套件
    含 dev_server 类用例，它们经 tests/conftest.py 的 DevServerClient
    **以子进程**启动真实开发服务器，子进程 env 为
    `{**os.environ, "PYTHONUNBUFFERED": "1", "PYTHONPATH": tmp_dir}` ——
    即**整体覆盖 PYTHONPATH** 且用 `sys.executable`。因此"往 PYTHONPATH 注入
    源码目录"的做法对本包**无效**（jinja2 那套可用的前提是它没有子进程用例）。
    本配方改按上游 tox（uv-venv-lock-runner + package = "wheel"）的同一思路：
    构建期建独立 venv → 把被测源码 `pip install` 进去（同时得到包元数据）→
    安装测试依赖 → 用该 venv 的 python 跑套件。这样子进程继承 venv 的
    executable，site-packages 与 importlib.metadata 都能命中。
    markupsafe 是 C 扩展、只能由 Conan 提供，故以 .pth 挂进 venv。

    pytest 需显式 `-p timeout` 加载（PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 屏蔽
    autoload 后，上游 test_debug.py 的 @pytest.mark.timeout 会变成未知标记报错）。

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues:
    - "tests/test_serving.py::test_server[unix socket]：OHOS SELinux 禁止 AF_UNIX 路径型 socket bind（EPERM），平台限制 E024，已在配方内探针判定后 deselect"
  notes: |
    纯 Python，无 C 扩展、无平台相关代码，aarch64-ohos 与上游行为一致。
    唯一未通过项是平台能力限制（AF_UNIX bind 被 SELinux 拒绝，非库缺陷），
    知识库已有登记 E024 且仓内先例众多（libfstrm / libmalcontent /
    kdbusaddons / carbon-c-relay 等同一处置）。

    ⚠️ AF_UNIX 的 sun_path 上限约 108 字节，而 conan 的 build_folder 路径很长
    （实测容器内 >108 字符）→ 直接把 basetemp 放在 build_folder 下会让用例先撞
    ENAMETOOLONG，**掩盖**真实根因。配方因此把 basetemp 放在 $HOME 下的短路径，
    使探针报出准确的 EPERM。这是本包踩到的真实坑，已写入 notes.md。

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  total: 969
  passed: 967
  failed: 0
  skipped: 1
  note: |
    上游测试（R51，2026-09-20 实测）：tests/ 目录 **25 个 test_*.py 模块**
    （顶层 16 + tests/middleware/ 6 + tests/sansio/ 3）+ conftest.py +
    live_apps/ + res/ 资源，实测
    **967 passed, 1 skipped, 1 deselected**（`conan create` 内同一结果，
    耗时 21.5s）。
    通过率口径 = passed/(passed+failed) = 967/967 = **100%**，零失败。
      · 1 skipped：上游自身 skipif（与本平台无关）
      · 1 deselected：test_server[unix socket]，AF_UNIX bind 被平台拒绝
        （EPERM，E024），配方内探针实测后按容器内既有惯例 deselect 并如实记录；
        探针能力检测意味着**平台若放开该能力，该用例会自动恢复执行**，
        不会写死跳过。
    上游测试已集成进 build()（upstream_test_in_build: true）。
    适配后：test_package 消费者测试（R34 真实 API）**22/22 = 100%**。
    - 2026-09-21 修复：CI #54059 全套件超时且**无法归因**——日志只有
      `+++++++++++ Timeout +++++++++++` 与 `conftest.py:198 wait_ready` 的栈，
      没有用例名/失败清单/汇总行。两个叠加因素：① 上游 `wait_ready()` 是
      **无界 `while True`**，dev-server 子进程起不来即挂死而非失败；
      ② 原用 `--timeout-method=thread`，pytest-timeout 在 dump 栈后调
      **`os._exit(1)`**，把**整个 run** 杀掉（连"哪个用例挂死"都留不下来）。
      修复：改用 `--timeout-method=signal`（仓内先例 afl-utils 1.35a），把挂死
      变成该用例的一次**普通失败**，run 继续、失败可归因；并加**定向重跑**
      （仅一次、且仅当失败**全部**是超时）——按 node id 原样重跑超时用例，
      不跳过、不改断言、不删用例；重跑仍超时才抛错，两次输出均写入
      `upstream-pytest-report.txt`。**非超时**失败一律不重跑，直接失败。
      实测：`signal` 法下完整套件仍 **967 passed, 1 skipped, 1 deselected**；
      定向重跑命令形态实测 `2 passed`。同一 PR 前两次构建分别栽在
      `mkdir: resource temporarily unavailable` 与 `curl: No such file or
      directory`，与本次超时同属 worker 基础设施瞬时状态。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Python 包的 pytest 套件若含『以子进程起服务』的用例（werkzeug dev_server 经 conftest 用 {**os.environ, PYTHONPATH: tmp} 覆盖 PYTHONPATH 并以 sys.executable 启动），则『把源码目录注入 PYTHONPATH』的做法（jinja2 3.1.6 可用）必然失效——子进程看不到该注入；正解是按上游 tox 思路建独立 venv 把被测包 pip install 进去，使子进程的 site-packages 与 importlib.metadata 都能命中 (ref: DRAFT-ohos-test-subprocess-overrides-pythonpath-needs-venv)"
  - "Python 包若在运行期调用 importlib.metadata.version(自身)，则仅复制源码目录到 site-packages 会在纯 Python 路径上抛 PackageNotFoundError：必须随包交付最小 .dist-info（METADATA + 空 RECORD）(ref: DRAFT-ohos-source-copy-python-no-dist-info-version-unavailable)"
  - "AF_UNIX 路径型 socket 的 sun_path 上限约 108 字节：在深路径（如 conan build_folder）下做 socket 用例会先撞 ENAMETOOLONG，**掩盖**真实平台限制（OHOS SELinux 拒绝 bind → EPERM）；诊断平台性 socket 失败时须先把 basetemp 换到短路径（$HOME），否则会误判根因。108 字节这一点**非新知**，DRAFT-10004-qtwayland-qt-tests-deep-path-socket-tmpdir-qpa 已载（libwayland 报 \"socket path ... exceeds 108 bytes\" 后须改用短 runtime dir）；本条新增的是它与 **E024**（AF_UNIX bind 被 SELinux 拒）叠加时的误导效应——深路径会把 EPERM 伪装成 ENAMETOOLONG (ref: DRAFT-10004-qtwayland-qt-tests-deep-path-socket-tmpdir-qpa, E024)"
  - "用 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 屏蔽宿主不兼容插件后，上游用到 @pytest.mark.timeout 的用例会因标记未知而收集报错（pyproject filterwarnings=error 放大为 ERROR）；须显式 `-p timeout` 载入 pytest-timeout，并传 --timeout/--timeout-method 才能把『挂起』转成可诊断的失败 (ref: DRAFT-ohos-pytest-host-py312-incompat)"
  - "OHOS 的 Python 常缺可用 ensurepip（ensurepip/_bundled 下 pip wheel 缺失），而 `python -m venv` 默认含一步 `ensurepip --upgrade --default-pip` 装 pip，于是 venv **建不出来**——报 \"Command '[...]', '-m', 'ensurepip', '--upgrade', '--default-pip']' returned non-zero exit status 1\"，上游套件 0 条执行；且开发机解释器自带该 wheel、CI worker 不带，故表现为**同一 commit 本地全绿、CI 全红**（易被误判为 flaky/平台故障而反复重跑）。修法：常规 venv 失败则回退 `venv --clear --without-pip`，再用**外层**解释器的 pip `install --no-deps --target <venv site-packages> pip` 自举（venv 自身此刻无 pip，无法自举），最后 `pip --version` 实测复检。venv 隔离与用例不变，只换 pip 来源。已沉淀为独立条目 (ref: DRAFT-ohos-python-venv-ensurepip-fallback, E544, E543)"

