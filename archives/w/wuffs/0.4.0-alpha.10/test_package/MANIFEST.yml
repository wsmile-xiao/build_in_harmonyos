# ── 上游默认未编译 / 本环境未运行的部分 ───────────────────────
not_run:
  - what: "`wuffs test` / `wuffs bench` 的 Go 工具链驱动层（含 .wuffs 源码转译与证明检查、`wuffs genlib`）"
    reason: >-
      上游库的 C 形态是「已生成并入库」的单文件产物（BUILD.md: "It's done by
      whoever checks in code changes"），CI 镜像不含 Go 工具链（`command -v go`
      为空）。驱动层做的是：转译 std/*.wuffs → release/c/*.c、再用 wuffs-c test
      编译运行下游 C 测试。本包不修改任何 .wuffs 源，转译结果与入库产物相同；
      而其下游 C 测试正是上面 30 个程序，已全部在本包 build() 内真实编译执行。
      影响范围仅限「Wuffs 语言编译器/证明检查器自身的测试」，与所发布的 C 产物无关。
  - what: "test/c/mimiclib 的对比测试（-DWUFFS_MIMIC，需 libpng/giflib/libjpeg/libwebp/zlib 等第三方库）"
    reason: >-
      上游默认不编译（#ifdef WUFFS_MIMIC）。本包按上游默认口径，未定义该宏，
      故该宏下的 63 个测试过程既不编译也不执行，不计入 232。对应的非 mimic
      用例（232）全部执行。63 的取数（可直接复现的四步，注意不能整文件预处理）：
      1) 从 test/c/std/*.c 里按花括号配平取出 `proc g_tests[] = { ... }` 块文本
      ——因为整文件带 `-DWUFFS_MIMIC` 预处理会因缺 bzlib.h/gif_lib.h/jpeglib.h/
      lzma.h/png.h/openssl/evp.h/webp/decode.h/xxhash.h 等未发布第三方头文件而
      在 30 个文件里有 10 个直接失败；2) 把该块交给 `clang -E [-DWUFFS_MIMIC]
      -x c -` 预处理；3) 滤掉 `# <line> "<file>"` linemarker 行；
      4) 按顶层逗号切分，去掉末尾 NULL 哨兵 → 元素数。
      不带宏逐文件求和 = 232（与实跑产生的 30 条 `PASS (N tests)` 逐文件 30/30
      吻合）；带宏 = 295；两者之差 = 63。该 30 行的原始输出见
      `reports/upstream-c-tests-log.md`（逐字留档）；`conan create` 日志中只有汇总行
      `upstream C tests: 30 programs, 232 test cases, all PASS`，因为配方把每个
      程序的 stdout 重定向到 `<name>.out` 后再断言其含 PASS 行。

# ── test_package 中自带的测试（消费者视角验证） ────────────────
# R34: 真实编译并运行消费方程序（直跑非 print-only）
test_package_tests:
  - file: test_wuffs.c
    description: >-
      C99 消费方实现翻译单元（定义 WUFFS_IMPLEMENTATION）：校验 WUFFS_VERSION /
      WUFFS_VERSION_STRING 确为 0.4.0-alpha.10 版本化产物；CRC-32/adler32 标准
      校验值；解码内嵌 4x4 PNG 到 24bpp RGB 并与独立计算的像素哈希比对；错误路径
      （版本不匹配的 initialize、截断且 closed 的输入）
    command: "./test_wuffs"
  - file: test_wuffs_header_only_tu.c
    description: >-
      C99 第二个翻译单元，仅以头文件方式包含（不定义 WUFFS_IMPLEMENTATION）：
      用 sizeof__wuffs_crc32__ieee_hasher() 分配不透明结构体并调用 API，验证
      单文件库可作头文件在多翻译单元中使用且能链接到唯一实现
    command: "./test_wuffs"
  - file: test_wuffs_cpp.cpp
    description: >-
      C++17 翻译单元：用 wuffs_png__decoder::alloc() / 成员方法（C++ 便捷层）
      独立解码同一 PNG 并校验像素哈希，验证封装产物被 C++ 接受且与 C 实现
      共存于同一程序
    command: "./test_wuffs"

# ── 鸿蒙/aarch64 平台专项测试（同一源文件编译两次） ─────────────
# wuffs 在编译期按 CPU 架构选择代码路径（release/c/wuffs-v0.4.c 的
# WUFFS_CONFIG__AVOID_CPU_ARCH 段）：OHOS PC（aarch64）上默认构建立即走
# NEON 路径，而该路径以「小端序 + 可用的非对齐访存」为前提。下面的两个
# 可执行文件来自同一个 ohos_platform_test.c：
#   ohos_platform_test           默认标志        → aarch64 快速路径启用
#   ohos_platform_test_portable  -DWUFFS_CONFIG__AVOID_CPU_ARCH → 纯可移植 C
# 源文件在两个方向上都断言库自报选中的路径（wuffs_base__cpu_arch__have_arm_neon()
# 预期分别为 1 / 0），因此两次构建可证明真的走了不同实现；随后两者又都必须
# 满足同一组已知答案断言（含从 16 个非对齐输入偏移解码同一 PNG）。
# 故「两者结果一致」是真实的 NEON-vs-可移植等价性结论，而非同义反复。
ohos_platform_tests:
  - file: ohos_platform_test.c
    description: >-
      aarch64/鸿蒙平台专项（默认构建）：断言平台前提（小端序、LP64、非对齐
      64 位读写往返）；断言库选中 NEON 路径（have_arm_neon()==1）且未误选
      x86 SSE4.2/AVX2；从 16 个非对齐输入偏移解码内嵌 PNG 并逐一比对独立
      算出的像素 CRC-32；校验所选 CRC-32 实现与标准校验值 0xCBF43926 一致
      （实测本构建 __ARM_FEATURE_CRC32 未定义、have_arm_crc32()=0，即走可移植
      实现；该断言校验的是取值契约而非机制）
    command: "./ohos_platform_test"
    selected_path: "NEON（aarch64 快速路径）"
  - file: ohos_platform_test.c
    description: >-
      aarch64/鸿蒙平台专项（WUFFS_CONFIG__AVOID_CPU_ARCH 可移植构建）：同一源
      文件、同一组断言，但断言库未选中 NEON 路径（have_arm_neon()==0）
    command: "./ohos_platform_test_portable"
    selected_path: "可移植 C（架构特化代码禁用）"

# 测试断言总数 (运行期检查计数)
# N 的取数命令: 三个程序各自运行输出 "OK: <N> checks passed, <M> failed" 行的 N 之和
#   ./test_wuffs                  →   OK: 15 checks passed, 0 failed
#   ./ohos_platform_test          →   OK: 32 checks passed, 0 failed
#   ./ohos_platform_test_portable →   OK: 32 checks passed, 0 failed
#   合计 = 79
# 其中「鸿蒙/aarch64 平台专项测试」= 32 + 32 = 64（两个架构构建）
assertion_count: 79
harmony_specific_assertion_count: 64
