# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wuffs/0.4.0-alpha.10
homepage: "https://github.com/google/wuffs"

# ── 上游测试命令 ──────────────────────────────────────────────
# wuffs 上游没有 configure/make/ctest：BUILD.md 明确写 "There's no build
# step"。上游的一致性检查脚本是 build-all.sh，测试入口是 `wuffs test`
# （Go 工具链）→ `wuffs-c test`（对每个 test/c/std/*.c 逐程序
# `-std=c99 -Wall -Werror` 编译并直接运行）。
#
# 取数口径（审方可复核，N=232）：
#   1) 列出上游 C 测试程序（30 个，每个是一个独立的单翻译单元测试二进制）：
#        ls <src>/test/c/std/*.c | wc -l                      # 30
#   2) 每个程序自报用例数，本包 build() 已逐程序断言 N>0 且必须打印
#      "PASS (N tests)" 行；等价的手工命令：
#        for f in test/c/std/*.c; do
#          T="${TMPDIR:-$HOME/tmp}/wuffs-count"; mkdir -p "$T"
#          clang -std=c99 -Wall -Werror "$f" -o "$T/t" && (cd . && "$T/t")
#        done | sed -n 's/.*PASS (\([0-9]*\) tests*).*/\1/p' | paste -sd+ | bc
#      → 232
#      （临时文件必须落在可写目录：本设备 /tmp 是只读挂载，写 /tmp/t 会让 30 次
#        链接全部失败并静默得到空输出，从而误判为「静态计数不可复现」。）
#   3) 本包 conan create 日志中的汇总行：
#        "upstream C tests: 30 programs, 232 test cases, all PASS"
#      （reports/conan-create-log.md）
#
# 统计单位：上游测试过程（test/c/std/*.c 的 g_tests[] 数组元素，每个元素
# 是 testlib 的一个 proc 函数 = 一个被计数的 test）。上游 testlib 在其
# PASS 行里自报同一口径：`std/png clang15 PASS (12 tests)`。
upstream_check_command: "./build-all.sh  # 需 Go 工具链；CI 镜像无 Go，见下"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: >-
  test/c/std/*.c 逐程序 `clang -std=c99 -Wall -Werror <prog>.c -o <bin>` 后运行，
  必须打印 "PASS (N tests)" 且 N>0；另加 build-all.sh 的 4 项单文件编译一致性
  检查与 2 项黄金回归数据比对

