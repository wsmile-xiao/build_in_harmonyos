# conandata.yml — wuffs 0.4.0-alpha.10
#
# 源码：上游 Google 官方仓库 tag v0.4.0-alpha.10 的 GitHub 归档（官方源，非镜像）。
# 使用 github.com/.../archive/refs/tags/ 形态而不是等价的 codeload 直连形态，
# 原因有二：
#   1) 末段带 .tar.gz 扩展名，Conan get() 能直接判定归档类型；
#   2) CI 的镜像改写正则（ci/conan/build_and_test.sh）只匹配 github.com 等域名，
#      该形态在 worker 直连失败时可被改写成 gh-proxy 镜像列表兜底。
# 两种形态实测字节与 SHA-256 完全一致（sha256sum 同值），sha256 唯一锚定。
#
# 打包内容说明：本包只安装 "single file C library"
# release/c/wuffs-v0.4.c（0.4.0-alpha.10 的版本化单文件产物）。
# 该文件的 API 自包含，不依赖仓库其它文件；同一目录下的
# wuffs-unsupported-snapshot.c 是未版本化的开发快照，上游明确标注
# "not supported"，故不安装。
sources:
  url: "https://github.com/google/wuffs/archive/refs/tags/v0.4.0-alpha.10.tar.gz"
  # 显式 filename 是防御性声明：若后续换回无扩展名的 codeload 形态，
  # 缺它会报 BadZipFile: File is not a zip file（见 notes.md 第 4.1 节）。
  filename: "wuffs-0.4.0-alpha.10.tar.gz"
  sha256: "3cc205d24d5a3ec01d6b1baa72da7cab534148cf115363fb79576e110203f5b3"

# 补丁说明：
# 上游 test/c/std/*.c 这 30 个 C 测试程序都 #include 开发期快照
# release/c/wuffs-unsupported-snapshot.c，而该快照的 WUFFS_VERSION 被置为 0
# （"¡ Some code generation programs can override WUFFS_VERSION"），它只能配合
# `wuffs test`/`wuffs genlib` 生成的代码使用。本包追踪的是版本化产物
# wuffs-v0.4.c，因此把测试程序的 include 指向它，使上游测试真正覆盖被安装的
# 那个文件，且 WUFFS_VERSION 校验（decoder initialize 会比对版本）成立。
# 补丁只改 include 行；不改任何测试逻辑、断言或数据。
patches:
  - patch_file: "patches/0001-test-c-std-adler32.c.patch"
    patch_description: "Point the adler32 C test at the versioned single-file release instead of the unversioned development snapshot"
    patch_type: "portability"
  - patch_file: "patches/0002-test-c-std-bmp.c.patch"
