knowledge_gained:
  - "wuffs 把「库」以 single file C library 形式随源码树发布（release/c/wuffs-vMAJOR.MINOR.c），版本号只体现在文件名与文件内 WUFFS_VERSION；release/c/wuffs-unsupported-snapshot.c 的 WUFFS_VERSION 恒为 0，只配合 `wuffs test`/`wuffs genlib` 生成的代码使用，不是可交付产物"  # reference: notes.md
  - "上游 test/c/std/*.c 这 30 个 C 测试程序默认 include 未版本化快照，且解码器 initialize 会比对 WUFFS_VERSION；要断言「测试覆盖的正是被安装的文件」必须把 include 指向版本化单文件产物（本包 30 个补丁只改 include 行），否则测试覆盖的是没人安装的文件"  # reference: notes.md
  - "Conan get() 按 URL 末段猜解压器：codeload 形态 URL（.../tar.gz/refs/tags/<tag>）末段不含扩展名，sources 缺 filename 键时报 BadZipFile: File is not a zip file（HTTP 200、sha256 校验都正常，只在解压阶段炸）；sources 需显式声明 filename: <name>.tar.gz"  # reference: notes.md
