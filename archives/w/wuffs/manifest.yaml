# software-level manifest — wuffs
# 遵循 ARCHIVE-SPEC v3.0
software: wuffs
display: "Wuffs"
description: "内存安全的图像/压缩/JSON 编解码与哈希标准库，以单文件 C 库形式发布"
category: library
homepage: "https://github.com/google/wuffs"
license: Apache-2.0 OR MIT

build_system: custom

ohos_adaptation:
  key_points:
    - "上游库本体无构建系统（BUILD.md: \"There's no build step\"）；包只安装 release/c/wuffs-v0.4.c 一个文件，消费方 #include 或定义 WUFFS_IMPLEMENTATION 后编译"
    - "包只装版本化产物 wuffs-v0.4.c；release/c/wuffs-unsupported-snapshot.c 的 WUFFS_VERSION 为 0 且上游标注 unsupported，不打包"
    - "build() 移植 build-all.sh 中不依赖 Go 工具链的部分：4 项单文件编译一致性检查（C99/C++11 × 头模式/实现模式，用上游自己的 warning 集）+ 30 个上游 C 测试程序（232 用例）+ 2 项黄金回归数据比对"
    - "C++ 侧编译一致性检查需在 -Wpedantic 之上补 -Wno-c99-extensions：上游自动生成的 AArch64/NEON 代码路径使用 C99 复合字面量，-Wpedantic 下是 8 条硬诊断"
    - "未定义 WUFFS_IMPLEMENTATION 的翻译单元里编解码结构体是不透明类型（默认构造被 delete、sizeof 被故意放大），须用 sizeof__wuffs_xxx() 分配或 C++ 的 alloc()/成员方法层"
    - "wuffs 在编译期按 CPU 架构选择代码路径：aarch64 上默认走 NEON，前提是「小端序 + 可用非对齐访存」；test_package 用同一源文件的默认/AVOID_CPU_ARCH 两次构建对照验证该路径确实被选中且行为与可移植回退等价"
  common_dependencies: []

versions:
  "0.4.0-alpha.10":
    status: built
    build_date: "2026-09-10"
    conan_ref: "wuffs/0.4.0-alpha.10"
