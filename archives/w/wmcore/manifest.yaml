# 软件级 manifest — wmcore
# 遵循 ARCHIVE-SPEC v3.0

software: wmcore
display: "wmcore"
description: "X11 dockapp：把每个 CPU 核心的占用画成一格条形图（上半为整机均值，下半逐核），运行在 Window Maker 等支持 dock 的窗口管理器的停靠槽里"
category: utility
homepage: "https://www.dockapps.net/wmcore"
license: GPL-2.0-or-later
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "package_type=application 的 dockapp：package_info 不导出 cpp_info.libs（只声明 bindirs=bin、resdirs=share），命令行为由软件级 commands.json 声明（R38/L0k）"
    - "configure.ac 只有一句 PKG_CHECK_MODULES([pkg_config], [x11 xext xpm dockapp]) ⇒ generate() 必须出 PkgConfigDeps（实测 configure 打 `checking for x11 xext xpm dockapp... yes`），顺序按已发布 libdockapp/0.7.3：AutotoolsDeps → PkgConfigDeps → AutotoolsToolchain"
    - "依赖版本轨跟着已发布 libdockapp/0.7.3 的 6.4.0（libx11/6.4.0 + libxext/6.4.0 + libxpm/3.5.17），不要引 main 里另一套 libxext/1.3.x，否则 X11 图被 fork 成两套闭包"
    - "E386：profile [buildenv] 导出 CONFIG_SHELL=/data/service/hnp/bin/bash，该 bash 在 HMDFS 上 getcwd 失败，autoconf 的 configure 会用 $CONFIG_SHELL 重新 exec 自身并在启动期报 working directory cannot be determined；必须在**同一条命令**里 unset（generate() 期 env.unset 会被运行期重注入击败）"
    - "E011/E114：config.status 以 `(umask 077 && mktemp -d)` 建临时目录，HMDFS 上该目录回读为 0660 无检索位 ⇒ `can't create ./conffXXXXXX/subs1.awk: Permission denied`；在 build() 里把 configure 内的 umask 077 就地改写为 022（生成文件不入 patches/）"
    - "AutotoolsDeps 会把整条闭包的 -l 放进 $LIBS，autoconf 第一个『运行程序』测试因此链接 X11 闭包；必须内联注入 LD_LIBRARY_PATH，否则加载器拒载被误报成 cannot run C compiled programs（症状像需要 --host，根因是运行期搜索路径）"
    - "无头判据（本包实测）：`wmcore -h` 退出码 0 并打印 usage；无 DISPLAY 运行退出码 1 且打印 libdockapp 的 `wmcore: can't open display`，即运行期 loader 已放行、失败发生在 X 连接层。窗口绘制本身需要 X server（设备与 CI worker 都没有），明确记为未覆盖"
    - "OHOS clang 链接阶段自动写入 .codesign 段，产物可直接执行 ⇒ 配方不再手工 self-sign（与改过 RPATH 的 libdockapp 不同）；产物无 RPATH/RUNPATH，去掉 Conan 运行库路径即 rc=127 拒载，用作 R34 反证"
  common_dependencies:
    - libdockapp
    - libx11
    - libxext
    - libxpm

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.0.4":
    status: built
    build_date: "2026-09-26"
    conan_ref: "wmcore/0.0.4"
