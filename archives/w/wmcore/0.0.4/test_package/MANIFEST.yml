# test_package/MANIFEST.yml — wmcore 0.0.4
# CI L0e requires this file to exist; PF3 additionally requires it to be non-empty.

package: wmcore/0.0.4
homepage: "https://www.dockapps.net/wmcore"

# ── 上游测试清点（R51 三步法：在解包树上实测，命令与输出逐条留档）────────────
upstream_tests_exist: false
upstream_test_audit:
  - source: "目录探测 ls -d tests test"
    reason: >-
      在解包树 /storage/Users/currentUser/tmp/uc2/z63-wmcore/src/wmcore-0.0.4 内实测，
      输出为 `ls: tests: No such file or directory` 与 `ls: test: No such file or
      directory`，rc=1。上游 0.0.4 发布包没有任何 tests/ 或 test/ 目录。
  - source: "Makefile.am + configure.ac 的 TESTS / check_PROGRAMS 声明"
    reason: >-
      `grep -nE "TESTS|check_PROGRAMS" Makefile.am configure.ac` 无任何输出（rc=1）。
      Makefile.am 实测只有 `bin_PROGRAMS = wmcore`、`wmcore_SOURCES = wmcore.c
      wmcore_mask.xbm wmcore_master.xpm`、`man_MANS = wmcore.1`、`EXTRA_DIST =
      wmcore.1.in`，没有 automake 的 TESTS/check_PROGRAMS 测试登记。
  - source: "文件清单与 make -n check 干跑"
    reason: >-
      `find . -type f | wc -l` = 17，`find . -name "*.c" | wc -l` = 1（只有 wmcore.c
      本体），`find . -iname "*test*" -o -iname "*check*"` 无输出。已 configure 的构建目录内
      `make -n check` 展开出的 check/check-am 配方只有「重编译并链接 wmcore」两条命令
      （clang -… -c wmcore.c / clang -o wmcore …），既没有 test-driver、也没有
      任何测试程序或 LOG_DRIVER 行 ⇒ automake 生成的 check 目标在本包实际为空。
  - conclusion: >-
      上游确无自动化测试（静态总数 0）；层 1 无可执行用例，验证由 test_package 承担：
      9 条行为断言真的执行被打包的程序（-h 路径、版本横幅、usage、无头运行的 X 层失败签名、
      DISPLAY 生效、去掉运行库路径后的加载器拒载对照、生成的 man page、许可证），
      另有 4 条平台断言直接解析打包 ELF（AArch64/ELF64、NEEDED 依赖闭包、.codesign 段、
      构建机绝对路径零泄漏）。窗口绘制本身需要一个 X server，设备与 CI worker 都没有
      （镜像内无 Xorg/Xvfb，制品仓未发布 OHOS xorg-server），因此该部分明确记为未覆盖，
      而不是拿"平台限制"当作 0 执行的理由——上游本来就没有测试可跑。

# 层 1 口径：本包 automake 生成的 check 目标存在但为空；配方 build() 仍执行一次
# `make -j1 check`，让构建日志留下"没有测试可跑"的原始痕迹（L1c 要求的执行证据）。
upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests: []

# ── 五维账本（静态 / 可执行 / 实测通过 / 跳过 / 失败），上游维度全为 0 ──────
upstream_test_count: 0
upstream_tests_executable: 0
upstream_tests_ran: 0
upstream_tests_passed: 0
upstream_tests_skipped: 0
upstream_tests_failed: 0
upstream_tests_note: >-
  上游静态测试数 0 是清点结论而非环境结论（见上面三条实测证据），因此"可执行数/实测通过数/
  跳过数/失败数"四项同样为 0，没有任何用例被跳过或被环境阻塞。
  `make -j1 check` 在 build() 中真实执行（create 日志见 `RUN: make check -j1`），
  该目标在本次实测中未打印任何测试行——空目标，非失败。

test_package_tests:
  - file: test_wmcore.sh
    description: >-
      真实执行打包后的 wmcore 程序，9 条运行期累加断言：程序存在且可执行；`wmcore -h`
      退出码 0（上游在连接 X 之前处理 -h 并 exit(0)）；横幅 `wmcore 0.0.4` 来自
      config.h 的 PACKAGE_STRING，证明 config.status  substitution 真的跑过；usage
      列出文档化的 `-d n`；无 DISPLAY 运行退出码 1 且输出 libdockapp 的
      `can't open display`，同时**不含**任何加载器诊断（区分"包能跑、只是没显示器"与
      "包坏了"）；DISPLAY=:99 时诊断里点名 :99，证明 DISPLAY 被真实读取；对照组：去掉
      Conan 运行库路径后加载器拒载（rc=127 + `Error loading shared library`），即被测
      二进制确实依赖本包依赖闭包里的 libdockapp/libX11/libXext/libXpm 而不是系统同名库
      （R34）；man page 已安装且带替换后的版本号 0.0.4、无残留 @PACKAGE_VERSION@；
      GPL 许可证文件已打包。
    command: "sh test_wmcore.sh <package_folder> <package_folder>/bin/wmcore <build_folder>/scratch <依赖 libdir 列表>"
    assertion_count: 9
  - file: conanfile.py
    description: >-
      test() 内用纯 Python 解析打包 ELF 头/程序头/段头，做 4 条平台断言并逐条打印 OK 行：
      ELF64 + e_machine=183(AArch64)；DT_NEEDED 集合含 libdockapp.so*、libX11.so*、
      libXext.so*、libXpm.so*（实测 33 条，且无 RPATH/RUNPATH）；存在 .codesign 段
      （实测 38 段）；二进制字节内不出现任何构建机绝对路径（CONAN_HOME 根、构建目录、
      包目录三种前缀各扫描 0 命中，55680 字节全量扫描）。脚本还断言行为断言条数与
      本文件申报值一致（SCRIPT_CHECKS=9），并把 13 这个总数以机器可读行
      `HMBS_TEST_PACKAGE_RESULT={...}` 打印，供报告与正文同源引用。
    command: "conan create . （自动执行 test_package）；反向验证：临时移走 bin/wmcore 后 conan test 必须转红"
    assertion_count: 4

# ── 申报数（静态声明 ↔ 运行汇总双向一致）──────────────────────────────────
test_package_test_count: 2
consumer_assertion_count: 13
assertion_count: 13
test_case_count: 13
