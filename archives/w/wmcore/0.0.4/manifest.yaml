# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "0.0.4"
software: "wmcore"
status: built
build_date: "2026-09-26"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游官方直链（dockapps.net 是该系列的官方分发站）。同一 sha256 与 Debian
  # wmcore_0.0.4.orig.tar.xz 逐字节相同，但 conandata 只写官方源：deb.debian.org
  # 域名被 create-pr 前置硬闸 PF7 列入黑名单（Debian 重打包源一律拦）。
  url: "https://www.dockapps.net/download/wmcore-0.0.4.tar.xz"
  sha256: "ecefdd498c52e37e22c6ddd434b6ccc5c10af8e620d44411b1506c13bfb34d20"
  tar_format: tar.xz
  size_bytes: 77104
  file_count: 17

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=/ （AutotoolsToolchain 默认，安装期由 DESTDIR=<package_folder> 落包）"
    - "其余 --bindir/--sbindir/--libdir/--includedir/--oldincludedir 全部由 AutotoolsToolchain 写入，配方不自加编译开关（R1/R33/R49）"
  build_command: >-
    unset CONFIG_SHELL; LD_LIBRARY_PATH=<依赖 libdir 列表> ../configure <工具链参数>
    && make -j1 && make -j1 check
  configure_note: >-
    不使用 autotools.configure()：profile [buildenv] 导出的
    CONFIG_SHELL=/data/service/hnp/bin/bash 在 HMDFS 上 getcwd() 失败，autoconf
    2.69 生成的 configure 会用 $CONFIG_SHELL 重新 exec 自身，从而在启动阶段即报
    "working directory cannot be determined"（E386，本包 A/B 实测复现）。正解是在
    **同一条 shell 命令里** unset（generate() 期 env.unset 会被运行期重注入击败）。
    configure 参数仍取 AutotoolsToolchain 写入的 conf（Autotools._configure_args）。
  install_method: "make install DESTDIR=<package_folder>（Autotools.install，上游 install-sh/ginstall 可用，未复现 E386 install 侧问题）"
  dependencies:
    - "libdockapp/0.7.3（dockapp.pc / libdockapp/wmgeneral.h，直接依赖）"
    - "libx11/6.4.0（X11/Xlib.h + -lX11，直接依赖；传递 libxcb/1.16、libxau、libxdmcp、xorgproto/2025.1、xtrans）"
    - "libxext/6.4.0（X11/extensions/shape.h + -lXext，直接依赖）"
    - "libxpm/3.5.17（X11/xpm.h + -lXpm，直接依赖）"
  dependency_track_note: >-
    四个依赖都按已发布 libdockapp/0.7.3 自己 requires 的那条 6.4.0 轨声明
    （libdockapp 对 libx11/6.4.0 用 force=True），避免把 main 里另一套
    libxext/1.3.x 拉进图里 fork 出第二个 X11 闭包。
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

patch_classification: []

in_build_source_transformations:
  - file: configure
    type: platform-build-environment
    applied_by: "conanfile._fix_configure_umask()（build() 内就地改写，不落 patches/）"
    change: "umask 077 → umask 022（命中 2 处：mktemp -d 分支与 mkdir 分支）"
    reason: >-
      E011/E114：config.status 用 `(umask 077 && mktemp -d "./confXXXXXX")` 建临时目录，
      HMDFS 上 0700 目录回读为 0660（无检索位），随后
      `cat >"$ac_tmp/subs1.awk"` 报 `Permission denied` →
      `config.status: built: could not setup config files machinery`。
      configure 是发布包内的生成文件，按 CONTRIBUTING 补丁规范不得用 .patch 改生成文件，
      故与 1000+ 存量配方一致，在 build() 内就地改写并对未命中情形打 warning。

# ============================================================
# 知识沉淀（引用的既有知识条目）
# ============================================================

knowledge_ref:
  - "E011"   # HMDFS umask 077 → config.status 临时目录不可用
  - "E114"   # 同一族的 mktemp/setgid 变体（corpus 里 1000+ 配方的 umask 改写形态）
  - "E386"   # CONFIG_SHELL 指向 HMDFS 上 getcwd 失败的 shell：capability-probe + 同命令内 unset
  - "E471"   # OHOS 无原生显示后端：显示依赖测试按真实原因分类，不写"没环境"当 0 执行理由
  - "E530"   # X11 客户端无 X server 时的消费者测试口径（活重定位/ABI 固定；本包用等价的行为+ELF 断言）

knowledge_gained:
  - "wmcore 的 configure.ac 只有一句 PKG_CHECK_MODULES([pkg_config], [x11 xext xpm dockapp]) ⇒ generate() 必须出 PkgConfigDeps；实测 configure 打印 `checking for x11 xext xpm dockapp... yes`，仅 AutotoolsDeps 不足以喂给 pkg-config"
  - "AutotoolsDeps 把整条依赖闭包的 -l 塞进 $LIBS，autoconf 的第一个『运行程序』测试（checking whether we are cross compiling）链接的是带 X11 闭包的 conftest；不带 LD_LIBRARY_PATH 时加载器拒载，configure 把它误报成 `cannot run C compiled programs / If you meant to cross compile, use --host`——症状像交叉编译问题，根因是运行期库搜索路径"
  - "本包树内没有 config.guess/config.sub，configure.ac 也没有 AC_CANONICAL_HOST ⇒ config.* 家族补丁与 E160/E490 在本包不适用；全树 -Werror 只出现在 aclocal.m4 的宏注释里，属假信号，未据此加任何补丁"
  - "OHOS clang 链接阶段已给产物写入 .codesign 段（实测 readelf -SW 有 .codesign，且二进制可直接执行），配方不必再手工 self-sign；这与 libdockapp（改过 RPATH 后必须重签）不同"
  - "产物无 RPATH/RUNPATH：去掉 Conan 运行库路径后 wmcore 以 rc=127 + Error loading shared library 拒载，正是 R34 需要的『被测包真的被动态消费』反证"
  - "application 型包在 conan-verify 里 G4/L2/L4/L5 命中『无 cache 路径』跳过（报告同时打印 ✅ PASS 与 ⏭️ 跳过），必须人工补测，见 ~/tmp/uc2/z63-wmcore/reports/conan-verify-supplement.md（reports/ 被 .gitignore 忽略，不入 PR）"

