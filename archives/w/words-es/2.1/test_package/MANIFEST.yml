package: words-es/2.1
homepage: "https://ftp.gnu.org/gnu/aspell/dict/es/"

# The source archive contains a precompressed word list and build metadata,
# but no upstream check target or test program.
upstream_check_command: "none (archive inventory: Makefile.pre, configure, es.cwl, metadata)"
upstream_test_in_build: false
upstream_test_command: "none; no upstream tests are shipped"
upstream_tests: []

test_package_tests:
  - file: test_words_es.cpp
    description: "Reads the packaged resource through WORDS_ES_FILE, validates its canonical UTF-8 entries, and checks HarmonyOS machine identity when requested."
    command: "./test_words_es --expect-count=56329"

assertion_count: 10
