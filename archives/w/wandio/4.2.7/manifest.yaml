version: "4.2.7"
status: built
build_date: "2026-09-25"

source:
  url: "https://github.com/LibtraceTeam/wandio/archive/refs/tags/4.2.7-1.tar.gz"
  sha256: "45021795b5c4d1609ba509358e730ea605c4c9621704d75214abb003f37602ab"
  tar_format: tar.gz

build:
  system: custom
  method: "direct cc build (no autotools): 6 lib sources + wcat.c, generated config.h with all backends off"
  sources:
    - "lib/wandio.c"
    - "lib/ior-peek.c"
    - "lib/ior-stdio.c"
    - "lib/ior-thread.c"
    - "lib/iow-stdio.c"
    - "lib/iow-thread.c"
    - "tools/wandiocat/wcat.c"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "wandio portable core needs only 6 lib sources when every optional backend is off (mirrors lib/Makefile.am conditionals)"
  - "upstream 4.2.7 ships no TESTS/check target, so build() runs no upstream suite and coverage comes from test_package"
  - "autotools bootstrap is unviable in the HarmonyOS build sandbox (no system autotools; autoconf tool_require drags m4 whose configure re-execs a missing bash); direct cc build like cbm/0.4-1 avoids the whole chain"
  - "a minimal generated config.h (all HAVE_* off) degrades wandio.c conditionals to the stdio fallback exactly like upstream --without-* configure"
