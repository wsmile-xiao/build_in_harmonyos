package: wandio/4.2.7
homepage: "https://github.com/LibtraceTeam/wandio"

# Upstream 4.2.7 defines no automake TESTS/check target (`make check` is a
# no-op), so the recipe build() invokes no upstream suite. Upstream does ship
# a standalone wandiocat roundtrip harness (test/do-basic-tests.sh, 7 read +
# 7 write checks) that is NOT wired to `make check` and requires the optional
# compression backends plus external compressor binaries; with this recipe's
# zero-dependency minimal core only the text cases would apply, so coverage
# comes from the consumer exercise below.
upstream_tests_exist: false
upstream_test_audit:
  - source: "wandio 4.2.7-1 source tree (Makefile.am)"
    reason: "Top-level Makefile.am only defines SUBDIRS = lib tools/wandiocat; no TESTS, check_PROGRAMS, or check target, so `make check` is a no-op."
  - source: "wandio 4.2.7-1 source tree (lib/Makefile.am)"
    reason: "Defines only lib_LTLIBRARIES = libwandio.la plus conditional compression sources; no TESTS or check target."
  - source: "wandio 4.2.7-1 source tree (configure.ac)"
    reason: "Runs compiler / libtool / optional-backend probes only; no AC_CONFIG_TESTDIR or test-harness setup."
  - source: "wandio 4.2.7-1 source tree (test/do-basic-tests.sh + test/files/)"
    reason: "Standalone wandiocat roundtrip harness (7 read + 7 write checks: text/gzip/bzip2/multistream-bzip2/lzma/lz4/zstd plus lzo write); driven by run-tests.sh via Debian packaging flow, not registered as automake TESTS, and every compression case needs its optional backend plus the matching external tool."
  - conclusion: "No automake TESTS/check suite exists (autotools_tests total 0); the standalone harness is inapplicable to this zero-dependency minimal-core build, so coverage comes from the consumer exercise below."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

upstream_test_total: 0
upstream_test_count_method: autotools_tests

test_package_tests:
  - file: test_wandio.c
    description: "Compression-type lookup (gzip/zstd resolve, unknown returns NULL)"
    command: "./test_wandio"
  - file: test_wandio.c
    description: "Extension-based detection (.gz/.zst resolve, plain name is NONE)"
    command: "./test_wandio"
  - file: test_wandio.c
    description: "Plain-file write/read roundtrip via wandio_wcreate/wandio_create"
    command: "./test_wandio"
  - file: test_wandio.c
    description: "Text API: printf/fgets/peek/tell/seek on a plain-text file"
    command: "./test_wandio"

# 4 test functions; 21 explicit failure-checked assertions inside:
# lookup 4 + detect 3 + roundtrip 5 + text API 9.
assertion_count: 21
