# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wayland-protocols/1.36.1
homepage: "https://wayland.freedesktop.org/"

# 上游测试命令：meson test -Dtests=true（需 wayland-scanner）
upstream_check_command: "meson setup -Dtests=true"
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际测试程序（131 项，全部因 wayland-scanner 不可用而跳过）
# 44 scan 测试 + 44 pedantic C99 测试 + 43 C++ 测试
upstream_tests:
  - category: scan
    count: 44
    description: "每个协议 XML 通过 wayland-scanner 扫描（client-header/server-header/private-code/public-code）"
    status: skipped
    reason: "wayland-scanner 不在 OHOS 平台"
  - category: pedantic-c99
    count: 44
    description: "每个协议用 -std=c99 -pedantic -Werror 编译验证"
    status: skipped
    reason: "wayland-scanner 不在 OHOS 平台"
  - category: cxx
    count: 43
    description: "每个协议头文件用 C++ -Wall -Werror 编译（xdg-foreign-unstable-v1 除外）"
    status: skipped
    reason: "wayland-scanner 不在 OHOS 平台"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_wayland-protocols.sh
    description: "验证 wayland-protocols.pc 存在 + pkgdatadir 下 stable/ 协议 XML 存在（3 个断言）"
    command: "bash test_wayland-protocols.sh <pkg_dir>"
  - file: conanfile.py
    description: "验证 share/pkgconfig/wayland-protocols.pc 存在 + stable/ 协议目录存在（1 个断言）"
    command: "conan test"

# 测试断言总数：上游 131 项（全跳过），test_package 4 个断言
assertion_count: 4
