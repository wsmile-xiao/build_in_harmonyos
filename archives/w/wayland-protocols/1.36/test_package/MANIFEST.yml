# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wayland-protocols/1.36
homepage: "https://wayland.freedesktop.org/"

# 上游测试命令：上游无测试套件（meson.build 无 test 目标，
# data 包仅安装 XML 协议定义）
upstream_check_command: "meson setup"
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序（无独立测试套件，构建即验证安装）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_wayland-protocols.sh
    description: "验证 wayland-protocols.pc 存在 + pkgdatadir 下 stable/ 协议 XML 存在（3 个断言）"
    command: "bash test_wayland-protocols.sh <pkg_dir>"
  - file: conanfile.py
    description: "验证 lib/pkgconfig/wayland-protocols.pc 存在（1 个断言）"
    command: "conan test"

# 测试断言总数：上游无独立测试用例（0），test_package 4 个断言
assertion_count: 4
