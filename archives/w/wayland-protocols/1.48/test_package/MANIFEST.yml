# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wayland-protocols/1.48
homepage: "https://wayland.freedesktop.org/"

# 上游测试命令：meson setup -Dtests=true + meson test
# （配方 build() 内构建静态 wayland-scanner 后直接执行，非跳过）
upstream_check_command: "meson setup -Dtests=true"
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际测试程序（191 项）
# 计数来源：meson.build 协议字典（stable 5 + staging 31 + unstable 22 +
# experimental 6 = 64 个协议文件，与 release tarball 64 个 XML 一一对应），
# tests/meson.build 对每个 protocol_file 生成 1 scan + 1 pedantic-c99 +
# 1 cxx（xdg-foreign-unstable-v1 除外）= 64 + 64 + 63 = 191。
# 平台适配（0001）：HMDFS 禁止 exec 脚本文件（EACCES，chmod 无效），
# tests/meson.build 的 scan.sh / replace.py 调用经解释器前缀执行
# （sh scan.sh / python3 replace.py），测试逻辑零修改。
upstream_tests:
  - category: scan
    count: 64
    description: "每个协议 XML 经 wayland-scanner 四种模式 --strict 扫描（client-header/server-header/private-code/public-code，tests/scan.sh）"
    status: run_in_build
    note: "静态 wayland-scanner（wayland 1.24.0 源码 -static 编译，仅依赖 libc）；scan.sh 经 sh 前缀执行（0001，HMDFS 禁 exec 脚本）"
  - category: pedantic-c99
    count: 64
    description: "每个协议的 client/server 头 + private-code 以 -std=c99 -pedantic -Wall -Werror 编译并运行（tests/build-pedantic.c.in）"
    status: run_in_build
    note: "测试可执行文件仅依赖 libc（静态 libwayland-protocol.a 提供接口符号）；生成器 replace.py 经 python3 前缀执行（0001）"
  - category: cxx
    count: 63
    description: "每个协议的 client/server 头以 C++ -Wall -Werror 编译并运行（xdg-foreign-unstable-v1 除外，tests/build-cxx.cc.in）"
    status: run_in_build
    note: "同上（replace.py 经 python3 前缀执行）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/consumer_e2e.c
    description: "7 个代表协议 × 4 检查点（接口名/版本号/请求计数/包内XML一致）= 28 项；协议全部取自安装集（stable ×2 / staging ×3 含 1.48 唯一进入安装集的新协议 xdg-session-management / unstable ×2；上游 installed_protocol_files 仅此三类，experimental 设计不安装，3 个 experimental 新协议由上游 191 项测试覆盖），client-header + private-code 经静态 scanner 由包内 XML 生成，编译态接口数据与包内 XML 运行时比对，逐例 TEST PASS/FAIL + 末行 TEST SUMMARY，任一失败退出码 1"
    command: "consumer_e2e <pkgdatadir>"
  - file: conanfile.py
    description: "构建期消费 wayland-protocols.pc（VAR=value 解析 + ${var} 递归展开）定位 pkgdatadir；scanner 源码优先复用主配方 source() 已下载的缓存副本（同 p/<hash>/s 兄弟目录，规避 CI 对 gitlab.freedesktop.org 二次下载 429 限流，CI#65173 实测），取不到才回退 get() 下载并 sha256 校验（conan 2.29 不调用 in-place test_package 的 source()，真机实测）；静态 scanner 编译与主配方同款"
    command: "conan test"

# 测试总数：上游 191 项（构建期 meson test 实测），test_package 28 项
assertion_count: 28
