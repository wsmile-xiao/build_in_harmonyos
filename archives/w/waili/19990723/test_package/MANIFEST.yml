# test_package/MANIFEST.yml - upstream and consumer test accounting for waili
package: waili/19990723
homepage: "https://deb.debian.org/debian/pool/main/w/waili/"

# test/Makefile has no check target and there is no upstream test runner.
# It only builds six standalone demonstration programs.
upstream_check_command: "make -C test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/Example.C
    description: "Runs the documented wavelet thresholding example against image.pgm and passes on the inspected source."
  - file: test/Demo.C
    description: "Interactive demonstration; the consumer runner supplies quit and verifies the command prompt was reached."
  - file: test/Proof.C
    description: "Counter-example program; runs on image.pgm and writes four PGM outputs."
  - file: test/Test.C
    description: "Miscellaneous transform test; runs on image.pgm and reports Maxerr = 0.000000."
  - file: test/Histogram.C
    description: "Requires gnuplot for the real plotting workflow; the recipe records this as a conditional limitation."
  - file: test/Rangecheck.C
    description: "Upstream bug: program requires a 64-bit PixType while Types.h defines PixType as s16; expected early failure is asserted and recorded."

upstream_inventory:
  formal_test_runner: false
  demonstration_programs: 6
  functional_without_optional_tools: 4
  conditional_histogram: 1
  known_upstream_failure_rangecheck: 1

test_package_tests:
  - file: test_waili.py
    description: >-
      Verifies all six packaged executables exist; runs Example, Demo (quit),
      Proof, and Test end to end; checks Histogram's usage smoke and only runs
      plotting when gnuplot is present; asserts the documented Rangecheck
      PixType failure and prints both limitations explicitly.
    command: "python3 test_waili.py <package>/bin"

assertion_count: 22
conditional_assertion_count: 2
result_accounting: "4 functional passes + 1 conditional Histogram limitation + 1 known Rangecheck failure; never 6/6"
