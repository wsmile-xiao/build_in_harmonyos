software: waili
version: "19990723"
status: built
build_system: custom
build_date: "2026-09-27"

source:
  url: "https://deb.debian.org/debian/pool/main/w/waili/waili_19990723.orig.tar.gz"
  sha256: "0dc5e599189640b55d038f85f01f3b9d98ec2c461c72e6bd28fc4e8cd9433184"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "config/Configure via the OHOS POSIX shell"
    - "make -C lib -j1 CXX=<profile cpp> AR=<llvm-ar> RANLIB=<llvm-ranlib>"
    - "make -C test -j1 CXX=<profile cpp> ... CFLAGS=-std=c++17 -stdlib=libc++"
  dependencies: []
  cc: none
  cxx: clang++

patches_applied:
  - "0001-clang-ohos.patch"

knowledge_gained:
  - "The release predates standard C++ headers and GNU extension removal; modern clang needs the documented minimal syntax/header patch."
  - "test/Makefile has no check target. Of its six programs, Example, Demo (quit), Proof, and Test are functional without optional host tools."
  - "Histogram writes gnuplot scripts and requires gnuplot for its plotting workflow; Rangecheck intentionally exits because it requires a 64-bit PixType while upstream defines PixType as s16."

test_strategy:
  upstream_programs: 6
  functional_without_optional_tools: 4
  conditional_histogram: 1
  known_upstream_failure_rangecheck: 1
  test_package_runner: "test_package/test_waili.py"
  limitation_reporting: "The runner prints both limitations explicitly and never reports 6/6."

test_results:
  upstream_test_count: 0
  upstream_test_result: "NO_AUTOMATED_TEST_SUITE"
  test_package_checks: 4
  test_package_passed: 4
  harmonyos_device: "OpenDesk HarmonyOS aarch64; job 20260927-043300-847b5f-batch6-waili-ci2; 4/4 runnable workflows passed, Histogram skipped without gnuplot, Rangecheck documented as an upstream PixType failure"
