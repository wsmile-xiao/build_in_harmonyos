sources:
  url: "https://deb.debian.org/debian/pool/main/w/waili/waili_19990723.orig.tar.gz"
  sha256: "0dc5e599189640b55d038f85f01f3b9d98ec2c461c72e6bd28fc4e8cd9433184"

patches:
  - patch_file: "patches/0001-clang-ohos.patch"
    patch_description: >-
      Minimal clang 15/libc++ port: replace removed pre-standard headers and
      array-new syntax, remove default arguments repeated on out-of-class
      definitions, replace obsolete GNU <? and >? operators, repair the
      ClearRect forward call, and supply CLK_TCK where POSIX exposes it only
      through sysconf(). Rangecheck is made buildable but retains its
      upstream 64-bit PixType runtime precondition.
    patch_type: "portability"
