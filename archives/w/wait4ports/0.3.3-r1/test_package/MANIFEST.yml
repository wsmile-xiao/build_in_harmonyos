# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: wait4ports/0.3.3-r1
homepage: "https://github.com/erikogan/wait4ports"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile
    source: wait4ports-v0.3.3/Makefile
    description: "Check that wait4ports exits correctly when connecting to unreachable port"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify wait4ports -v, usage exit code, and timeout behavior"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
