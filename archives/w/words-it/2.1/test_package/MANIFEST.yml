package: words-it/2.1
homepage: "https://ftp.gnu.org/gnu/aspell/dict/it/"

upstream_check_command: "none (no upstream test target; distcheck only re-extracts, configures, and builds)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests:
  counting_basis: >-
    Audited GNU archive aspell6-it-2.2_20050523-0.tar.bz2 (SHA-256
    3b19dc709924783c8d87111aa9653dc6c000e845183778abee750215d83aaebd).
    `tar -tf` listed 22 members, with no tests/ directory or test source files.
    Makefile.pre has no test or check target; it has a separate distcheck target
    whose recipe only extracts the distribution archive, runs ./configure, and
    runs make. No ctest or pytest registration exists; there are no upstream
    functional test cases to execute.
  total: 0

test_package_tests:
  - file: test_words_it.cpp
    scenario: normal
    description: "Read the packaged list; check its count, ordering, uniqueness, and Italian UTF-8 entries"
    command: "./test_words_it"
  - file: test_words_it.cpp
    scenario: fault-injection
    description: "Verify that a missing word-list path is rejected"
    command: "./test_words_it --expect-missing <missing-path>"
  - file: test_words_it_ohos.cpp
    scenario: harmonyos-aarch64
    description: "On HarmonyOS AArch64, verify the Conan run environment resolves the installed UTF-8 word list"
    command: "./test_words_it_ohos"

assertion_count: 16
