software: wxWidgets
version: 3.2.6
status: published
build_date: "2026-05-20"

source:
  url: "https://github.com/wxWidgets/wxWidgets"
  tag: v3.2.6
  method: git

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DwxBUILD_SHARED=OFF"
    - "-DwxBUILD_TESTS=OFF"
    - "-DwxUSE_GUI=OFF"
    - "-DwxUSE_XLOCALE=OFF"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

patches_applied:
  - 0001-harmonyos-socket-fix.patch

artifacts:
  packaging:
    - wxWidgets-3.2.6-ohos-aarch64.tar.gz
  patches:
    - 0001-harmonyos-socket-fix.patch

quality_gates:
  G1_binary_integrity: PASS
  G2_functional: PASS
  G3_portability: PASS
  G4_archive: PASS

libraries:
  - name: libwx_baseu-3.2.a
    size: "5.4MB"
    description: "核心基础库"
  - name: libwx_baseu_net-3.2.a
    size: "648KB"
    description: "网络库（socket、TCP）"
  - name: libwxregexu-3.2.a
    size: "372KB"
    description: "正则表达式库（PCRE）"
  - name: libwxzlib-3.2.a
    size: "126KB"
    description: "zlib 压缩库"

knowledge_gained:
  - category: platform
    content: "HarmonyOS 使用 musl libc，不支持 glibc 扩展函数如 gethostbyname_r"
  - category: build_system
    content: "autotools 在 HarmonyOS 上失败，必须使用 CMake"
  - category: type
    content: "socklen_t 在 HarmonyOS 上是 unsigned int，而非 int"