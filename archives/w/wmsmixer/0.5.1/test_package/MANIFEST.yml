# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: wmsmixer/0.5.1
homepage: "https://www.hibernaculum.net/wmsmixer.html"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试套件：Imakefile 仅有编译目标，无 check 目标，
# tarball 内无 tests 目录，源码仅 wmsmixer.cc + mixctl.h，无任何测试注册）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：产物 arm64 ELF 校验 + 端到端执行 wmsmixer --version 验证版本输出"
    command: "./test_wmsmixer"

# 测试断言总数
assertion_count: 3
