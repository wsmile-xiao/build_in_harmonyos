# 版本级 manifest
# 文件位置: archives/w/wmsmixer/0.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.5.1"

# 软件名
software: wmsmixer

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方 hibernaculum.net 当前 DNS 不可达；dockapps.net 为
  # Window Maker dockapps 官方站点提供的 0.5.1 官方 tarball）
  url: "https://www.dockapps.net/download/wmsmixer-0.5.1.tar.gz"

  # 源码校验和
  sha256: "eee60a40ba92e4c2c9a038c6e51cd3bd62b24b38a096d091dc60dfd26f0c5daa"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游 Imakefile/xmkmf，环境无 imake，配方中改为直接 clang++ 编译）
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libx11/6.4.0
    - libxpm/3.5.17
    - libxext/6.4.0.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Imakefile/xmkmf 构建的项目在无 imake 环境中可直接用 clang++ 编译单一源文件并链接依赖库，无需生成 Makefile"
  - "OHOS SDK 链接器 lld 运行时依赖 llvm/lib 下的 libxml2.so.16，编译命令需注入 LD_LIBRARY_PATH"
