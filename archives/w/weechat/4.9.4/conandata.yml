sources:
  "4.9.4":
    url: "https://weechat.org/files/src/weechat-4.9.4.tar.xz"
    sha256: "3fc50359f3a3b258c9f03148b02f3b9c59194535d1b465c481fb85a76c2ed005"
patches:
  "4.9.4":
    - patch_file: "patches/0001-hook-url-ohos-cooperative-stop.patch"
      patch_description: "hook-url: cooperative transfer stop when pthread_cancel() is unavailable (feature-detected)"
      patch_type: "portability"
    - patch_file: "patches/0002-cmake-ohos-portability.patch"
      patch_description: "CMake: keep RPATH on OHOS, accept ZLIB from config mode, fix CppUTest link flags, detect pthread_cancel availability"
      patch_type: "portability"
    - patch_file: "patches/0003-cmake-ohos-skip-curses-symlink.patch"
      patch_description: "CMake: skip the legacy weechat-curses symlink on OHOS (HMDFS does not support symlinks)"
      patch_type: "portability"
    - patch_file: "patches/0004-cmake-ohos-ncurses-config-fallback.patch"
      patch_description: "CMake: accept the config-mode ncurses::ncurses imported target as NCURSES_FOUND/NCURSES_LIBRARY (Conan toolchain prefers config mode)"
      patch_type: "portability"
    - patch_file: "patches/0005-cmake-ohos-sh-invoke-set-git-version.patch"
      patch_description: "CMake: invoke the version_git helper via /bin/sh (HMDFS refuses to execve script files directly)"
      patch_type: "portability"
    - patch_file: "patches/0006-cmake-ohos-tests-plugin-preload.patch"
      patch_description: "CMake: preload the plugin shared objects into the unit-test process on OHOS (the loader does not make RTLD_GLOBAL-opened symbols available to libraries opened later)"
      patch_type: "portability"
    - patch_file: "patches/0007-tests-ohos-suite-adaptations.patch"
      patch_description: "tests: adapt to this OHOS build (relay RecvJson: disable the CppUTest new/delete tracking for runtime-internal one-time allocations, mirroring the upstream javascript exemption; plugin infolist: search for the relay plugin since spell is not built; GuiBarWindow: allocator-independent invalid-pointer check)"
      patch_type: "portability"
    - patch_file: "patches/0008-cmake-ohos-sh-invoke-version-sh.patch"
      patch_description: "CMake: invoke the version.sh helper via /bin/sh at configure time (HMDFS refuses to execve script files directly); without this VERSION_MAJOR/MINOR/PATCH are empty and PACKAGE_VERSION becomes '.'"
      patch_type: "portability"
