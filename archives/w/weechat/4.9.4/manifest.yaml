# 版本级 manifest — weechat 4.9.4
# 遵循 ARCHIVE-SPEC v3.0

version: "4.9.4"
software: "weechat"
status: built
build_date: "2026-10-11"
build_system: "cmake"

source:
  url: "https://weechat.org/files/src/weechat-4.9.4.tar.xz"
  sha256: "3fc50359f3a3b258c9f03148b02f3b9c59194535d1b465c481fb85a76c2ed005"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DENABLE_HEADLESS=ON"
    - "-DENABLE_TESTS=ON"
    - "-DENABLE_SCRIPTS=OFF"
    - "-DENABLE_PERL=OFF"
    - "-DENABLE_PYTHON=OFF"
    - "-DENABLE_RUBY=OFF"
    - "-DENABLE_LUA=OFF"
    - "-DENABLE_TCL=OFF"
    - "-DENABLE_GUILE=OFF"
    - "-DENABLE_PHP=OFF"
    - "-DENABLE_JAVASCRIPT=OFF"
    - "-DENABLE_SPELL=OFF"
    - "-DENABLE_NLS=OFF"
    - "-DCMAKE_EXE_LINKER_FLAGS=... -Wl,-rpath,<全部依赖 libdir（冒号连接）>（SHARED/MODULE 同）"
  dependencies:
    - "ncurses/6.6"
    - "zlib/1.3.1.1"
    - "gnutls/3.8.10"
    - "libgcrypt/1.11.0"
    - "curl/8.15.0"
    - "zstd/1.5.7.1"
    - "cjson/1.7.19"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-hook-url-ohos-cooperative-stop.patch"
  - "0002-cmake-ohos-portability.patch"
  - "0003-cmake-ohos-skip-curses-symlink.patch"
  - "0004-cmake-ohos-ncurses-config-fallback.patch"
  - "0005-cmake-ohos-sh-invoke-set-git-version.patch"
  - "0006-cmake-ohos-tests-plugin-preload.patch"
  - "0007-tests-ohos-suite-adaptations.patch"
  - "0008-cmake-ohos-sh-invoke-version-sh.patch"

knowledge_gained:
  - "OHOS musl 不提供 pthread_cancel 符号（构建期 check_symbol_exists 实测缺失）：URL hook 的传输线程停止需以特性检测替代——CMake check_symbol_exists(pthread_cancel) → config.h.cmake #cmakedefine HAVE_PTHREAD_CANCEL → C 侧 #ifdef/#ifndef 条件编译，而不是在补丁里引入平台宏。（ref: notes.md 知识积累节）"
  - "特性检测下的协作式停线程：置 stop_transfer 标志（传输循环周期性检查）→ 轮询 thread_running 短等待（30×1ms）→ hook_url_free_data() 的 pthread_join 回收。core-url 传输循环在调用方已记录 error_code（如超时）时不再覆盖，保留原始错误。free_data 中的 pthread_cancel 分支同样以 #ifdef HAVE_PTHREAD_CANCEL 圈定，经典平台路径不变。（ref: notes.md 知识积累节）"
  - "HMDFS 不支持符号链接（symlink EPERM）：上游 curses 目标 POST_BUILD 造 weechat-curses 兼容链接、install 规则同样安装该链接，在 OHOS 上必须整体跳过（NOT CMAKE_SYSTEM_NAME MATCHES \"OHOS|HarmonyOS\" 条件包裹，POSIX 兼容形态，不引入平台宏）。（ref: notes.md 知识积累节）"
  - "上游顶层 CMakeLists 无条件 set(CMAKE_SKIP_RPATH ON)：OHOS 上依赖库位于 conan 包缓存/包内路径，跳过 RPATH 会导致运行时找不到 .so——SKIP_RPATH 改为仅对非 OHOS/HarmonyOS 生效（平台串判断见末条）。注意仅豁免 SKIP_RPATH 并不足够：设备 cmake 不产出自身计算的 rpath 标志（见 rpath 直注条），配方改以 -Wl,-rpath,<冒号连接的全部依赖 libdir（含 conan home 与 cache 两种布局）> 直接注入 CMAKE_EXE/SHARED/MODULE_LINKER_FLAGS，产物 DT_RUNPATH 实测在位；消费者 version/help 用例在移除 LD_LIBRARY_PATH 的环境执行两二进制验证自寻址。（ref: notes.md 知识积累节）"
  - "zlib 以 CMake config 模式提供 ZLIB::ZLIB imported target 而无 ZLIB_LIBRARY 变量：上游 find_package(ZLIB REQUIRED) + list(APPEND EXTRA_LIBS ${ZLIB_LIBRARY}) 会静默链接空值，需补 target 映射与 include_directories。（ref: notes.md 知识积累节）"
  - "Conan 工具链的 CMAKE_FIND_PACKAGE_PREFER_CONFIG 同样作用于 test_requires：find_package(CppUTest) 解析到 CMakeDeps 生成的 CppUTest::CppUTest（制品仓 cpputest 配方设置了 cmake_file_name/cmake_target_name），树内 FindCppUTest.cmake（pkg_search_module）不执行，CPPUTEST_INCLUDE_DIRS 与 CPPUTEST_LDFLAGS 均不会设置——上游 tests/unit/CMakeLists.txt 正以它们做 include_directories() 与 tests 链接行，实测编译期报 'CppUTest/TestHarness.h' file not found。配方 generate() 从 cpputest 包注入两个缓存变量（include 目录 + -L<libdir>/-l<libs> 链接参数，库名取 cpp_info.libs）；补丁 0002 将上游链接行的 ${CPPUTEST_LIBRARIES} 改为 ${CPPUTEST_LDFLAGS} 与之配套。（ref: notes.md 知识积累节）"
  - "Conan 工具链默认 set(CMAKE_FIND_PACKAGE_PREFER_CONFIG ON)：find_package(Ncurses) 解析到 CMakeDeps 生成的 ncurses-config.cmake（日志 'Conan: Target declared ncurses::ncurses'），只提供 imported target、不设置 NCURSES_FOUND，树内 FindNcurses.cmake（raw find_path/find_library + pkg-config 分支）完全不执行，上游 if(NCURSES_FOUND) 判定即 SEND_ERROR 'Ncurses not found'。补丁 0004 按 ZLIB 同一模式回填：if(NOT NCURSES_FOUND AND TARGET ncurses::ncurses) → set(NCURSES_FOUND TRUE) + set(NCURSES_LIBRARY ncurses::ncurses)。配方另预置 NCURSES_INCLUDE_PATH 缓存变量供 include_directories() 使用，并注入 CMAKE_REQUIRED_INCLUDES 与 CMAKE_EXE_LINKER_FLAGS=-L<ncurses libdir>。制品仓 ncurses/6.6 的 include 为扁平布局（ncurses.h/curses.h 直接位于 include/ 下，无 ncursesw/ 子目录），链接库为自含的 libncursesw.a（lib/ 同时装 form/menu/panel 与 pkgconfig）。（ref: notes.md 知识积累节）"
  - "OHOS SDK sysroot 内置 musl 的 iconv：iconv.h 位于 <sdk>/native/sysroot/usr/include，iconv_open() 由 libc 导出（无需 libiconv）。上游 FindIconv.cmake 的 find_path 只搜 /usr/include 等宿主路径，设备上全部落空（CMakeCache 实测 ICONV_INCLUDE_PATH-NOTFOUND）→ ICONV_FOUND 未置 → charset 插件 SEND_ERROR 'Iconv not found'、top-level HAVE_ICONV 缺失。配方在 generate() 定位 sysroot include 目录（OHOS_SDK_* 环境变量候选 + /data/service/hnp/ohos-sdk.org/*/ohos/native/sysroot 布局 glob）并预置 ICONV_INCLUDE_PATH，FindIconv 随即走 check_function_exists(iconv_open) 分支置 ICONV_FOUND。musl 的 iconv() 第二参数为 char**（非 const），FindIconv 的 -Werror 探测令 ICONV_2ARG_IS_CONST 不定义，core-string.c 以 ICONV_CONST 空展开调用，与 musl 签名一致。（ref: notes.md 知识积累节）"
  - "cjson 制品包安装的 pkg-config 文件名为 libcjson.pc，上游 pkg_check_modules(cjson) 按 cjson 查找：配方在依赖 pkgconfig 目录生成 cjson.pc 别名。（ref: notes.md 知识积累节）"
  - "上游 ENABLE_TESTS=ON 强制要求 ENABLE_HEADLESS=ON（CMake FATAL_ERROR 硬校验）：单元测试与消费者测试均构建 headless 形态。ENABLE_SCRIPTS/ENABLE_SPELL/ENABLE_NLS 关闭属裁剪：perl/python/ruby/lua/tcl/guile/php 语言运行时不在制品仓供应范围；spell（aspell/enchant）与 NLS（gettext）为可选扩展未纳入（保持最小依赖面；制品仓实际可解析 aspell/enchant）。（ref: notes.md 知识积累节）"
  - "上游脚本语言开关存在双门不同源：单元测试的 HAVE_<LANG> 宏取自各语言开关（tests/unit/CMakeLists.txt 的 if(ENABLE_PYTHON) add_definitions(-DHAVE_PYTHON) 等 8 处），而插件构建门是 ENABLE_SCRIPTS AND ENABLE_<LANG>（src/plugins/CMakeLists.txt）——只关 ENABLE_SCRIPTS 会造成测试预期（python/perl 等插件已加载）与实际插件集合不一致（TEST(Scripts, API) 失败：plugin python is not loaded）；裁剪脚本运行时须把 8 个语言开关一并显式关闭，使两门同源。（ref: notes.md 知识积累节）"
  - "CppUTest 泄漏检测会计入 C++ 运行时内部一次性分配：经可执行文件 interpose 的 operator new（readelf 实证可执行文件 _Znwm/_Znam/_ZdlPv 为 GLOBAL DEFAULT，libc++_shared.so 内部 new 被拦截）产生的 48/48/804 字节分配被记入当前测试的泄漏账，源位置为 <unknown> line: 0；设备侧 OHOS 禁用 ptrace（gdb/lldb 均 Permission denied），无法调试器回溯。移植遇同类误报时照上游先例（test-scripts.cpp javascript 分支）以 MemoryLeakWarningPlugin::turnOffNewDeleteOverloads() / turnOnThreadSafeNewDeleteOverloads() 圈定豁免窗口，勿发明机制。（ref: notes.md 知识积累节）"
  - "上游单元测试对构建配置存在硬假设两例：InfolistPluginCb 硬编码查询 spell 插件（ENABLE_SPELL=OFF 即得到空清单，替换为恒在售插件后用例结构与校验点不变）；GuiBarWindow.Valid 以结构体 sizeof 偏移 +1 构造无效指针——完整套件运行的分配历史下该地址可偶发恰为另一活跃对象起点（真机 ~25% 间歇失败），改字节偏移指针即与分配器布局无关。裁剪上游可选组件后应预检测试套件中同类硬假设。（ref: notes.md 知识积累节）"
  - "上游测试清点口径：全树静态 TEST( 声明数（1880）≠ CMake 实际登记执行数（1854）——tests/unit/CMakeLists.txt 为显式源清单，plugins/relay/api/remote/test-relay-remote-event.cpp（TEST_GROUP(RelayRemoteEvent)，26 例）未被上游自身引用（原始 tarball 同此，任意平台都不编译，属上游清单遗漏）；申报与核对测试执行数时应以清单登记数为口径。（ref: notes.md 知识积累节）"
  - "OHOS 包内可执行文件与共享库需签名（objcopy --remove-section .codesign + binary-sign-tool -selfSign），配方 package() 对 bin/、libexec/、lib/**/*.so* 统一处理。（ref: notes.md 知识积累节）"
  - "设备用户文件系统为 HMDFS（hmmac=genfs）：拒绝 execve 直接执行脚本文件（chmod 777 亦被拒，chmod 本身返回 Permission denied；ELF 二进制不受影响）。构建系统中以脚本文件为 COMMAND 的目标（如上游 version_git 调 tools/set_git_version.sh）须改为 /bin/sh <script> 解释器调用（sh 逐行读取，不触发脚本 execve）。同源文件系统限制：symlink EPERM（见 0003）、mkfifo EPERM（GNU make jobserver 自动降级为非 jobserver 模式，不致命）。（ref: notes.md 知识积累节）"
  - "上一限制的遗漏路径：configure 期 execute_process 同样受影响——顶层 CMakeLists 三处 execute_process(COMMAND \"${CMAKE_SOURCE_DIR}/version.sh\" devel-major/minor/patch ...) 在设备上返回空串（实证 Permission denied rc=126；/bin/sh version.sh devel-major → 4，rc=0），VERSION 退化为 \".\"、config.h PACKAGE_VERSION \".\"——构建 100%、ctest 全过、打包签名全过，仅消费者 --version 校验失败，形态极隐蔽（0005 只覆盖了 build 期 add_custom_target，0008 补齐 configure 期）。构建系统内一切以脚本文件为执行入口者（configure 期 execute_process 与 build 期 custom target 是两条独立路径）均须逐一改造为 /bin/sh 解释器调用。（ref: notes.md 知识积累节）"
  - "适配版 Conan 的 CMakeToolchain 将 os=OHOS 映射为 CMAKE_SYSTEM_NAME=HarmonyOS（设备真机 CMakeSystem.cmake 实测 set(CMAKE_SYSTEM_NAME \"HarmonyOS\")；OHOS SDK 工具链自身为 OHOS 串）。CMake 侧平台判断若写死 STREQUAL \"OHOS\" 则恒为假——真机实证后果：符号链接创建照常执行（HMDFS EPERM，构建失败）且 SKIP_RPATH 豁免不生效（产物无 RUNPATH，readelf 实测）。统一以 MATCHES \"OHOS|HarmonyOS\" 兼容双串。（ref: notes.md 知识积累节）"
  - "设备 cmake（4.1.2，OHOS 版）不产出其自身计算的任何 rpath 链接标志：CMAKE_INSTALL_RPATH、CMAKE_BUILD_RPATH、CMAKE_BUILD_WITH_INSTALL_RPATH 三种机制在最小工程同参数复现全部无效（link.txt 无 -rpath、产物无 DT_RUNPATH），仅裸链接器标志可穿透——以 -DCMAKE_EXE/SHARED/MODULE_LINKER_FLAGS=-Wl,-rpath,<冒号连接目录> 直注（最小工程与最终产物 DT_RUNPATH 双重实测）。同类任务若依赖 CMAKE_INSTALL_RPATH 机制自寻址，须改走 linker flag 通道。（ref: notes.md 知识积累节）"
  - "适配版 conan 的 CMake.test() 与上游语义一致：cli_args 被拼进 cmake --build 命令行本身而非 ctest 参数——cmake.test(cli_args=[\"--output-on-failure\"]) 在构建全过后首次执行即报 `Unknown argument --output-on-failure`（生成 cmake --build ... --target test --output-on-failure）。配方改为构建目录内直接 self.run(\"ctest --output-on-failure\", cwd=self.build_folder)（保留 can_run 与 tools.build:skip_test 语义）；ctest 行为参数应经 CTEST_* 环境变量或直接 ctest 调用传递。（ref: notes.md 知识积累节）"
  - "OHOS 加载器不把 RTLD_GLOBAL 已打开库的符号提供给之后打开的库（真机最小工程实证：dlopen(libp, RTLD_GLOBAL|RTLD_NOW) 成功后，dlopen(引用 libp 符号的 libm, RTLD_GLOBAL|RTLD_NOW) 报 `M FAIL: Error relocating libm.so: exp_sym: symbol not found`，与 weechat 的 alias_new 失败同形；glibc 上该路径可用）。后果：weechat 测试二进制运行期 dlopen 的插件测试模块（libweechat_unit_tests_plugins.so，对 alias_new 等插件函数全为未定义引用）无法解析符号。解法=LD_PRELOAD：把插件 .so 清单挂进 ctest unit 测试 ENVIRONMENT（patches/0006），预载使符号进入初始全局作用域——最小工程对照实证 LD_PRELOAD 场景加载成功且调用值正确，预载库对主程序 -rdynamic 导出符号的引用亦可解析，冒号分隔多路径同验；预载对象与 weechat 自动加载为同一批文件路径（加载器按路径去重=同一实例）。凡依赖「dlopen 插件 A + dlopen 后续模块引用 A 符号」模式的移植均须走 LD_PRELOAD 通道。（ref: notes.md 知识积累节）"
