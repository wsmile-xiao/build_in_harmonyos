package: weechat/4.9.4
homepage: "https://weechat.org/"

upstream_check_command: "ctest --output-on-failure (runs tests -v)"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - name: "WeeChat CppUTest unit tests"
    command: "ctest --output-on-failure"
    integrated: true
    declared_tests: 1854  # registered by tests/unit/CMakeLists.txt (the executed count); 26 further TEST declarations sit in test-relay-remote-event.cpp, which upstream's own CMakeLists never references (not compiled on any platform)
    source_files: 100  # .cpp files referenced by tests/unit/CMakeLists.txt (101 on disk; the unreferenced one carries the 26 orphan declarations)

test_package_tests:
  - file: test_weechat.py
    description: "Runs the curses binary --version without LD_LIBRARY_PATH and requires the exact packaged version."
    command: "python test_weechat.py <package_folder> <workdir>"
  - file: test_weechat.py
    description: "Runs the headless binary --version without LD_LIBRARY_PATH and requires the exact packaged version."
    command: "python test_weechat.py <package_folder> <workdir>"
  - file: test_weechat.py
    description: "Runs weechat-headless --help and verifies scripted run support is exposed."
    command: "python test_weechat.py <package_folder> <workdir>"
  - file: test_weechat.py
    description: "Starts headless WeeChat with -r commands and verifies all 13 bundled plugins load."
    command: "python test_weechat.py <package_folder> <workdir>"

assertion_count: 6
