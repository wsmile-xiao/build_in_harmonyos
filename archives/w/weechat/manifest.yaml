software: weechat
display: "WeeChat"
description: "Modular extensible chat client: curses and headless binaries, 13 built-in plugins, /set-driven configuration, relay-friendly architecture"
category: chat
homepage: "https://weechat.org/"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS musl 不提供 pthread_cancel：以 check_symbol_exists(pthread_cancel) 特性检测（HAVE_PTHREAD_CANCEL）条件编译传输线程停止——缺失时协作式停止（stop_transfer 标志 + 短等待 + pthread_join 回收），不以平台宏打补丁。"
    - "HMDFS 不支持符号链接：weechat-curses 兼容符号链接的后置构建与安装规则在 OHOS 上跳过（CMAKE_SYSTEM_NAME MATCHES \"OHOS|HarmonyOS\" 条件）。"
    - "平台判断串：适配版 Conan 的 CMakeToolchain 将 os=OHOS 映射为 CMAKE_SYSTEM_NAME=HarmonyOS（真机 CMakeSystem.cmake 实测），CMake 侧条件须用 MATCHES \"OHOS|HarmonyOS\" 兼容双串，写死 STREQUAL \"OHOS\" 恒为假。"
    - "上游无条件 CMAKE_SKIP_RPATH ON 不可用于 OHOS：SKIP_RPATH 仅对非 OHOS/HarmonyOS 生效（同平台串条件）；设备 cmake 不产出 CMAKE_INSTALL_RPATH 系计算的标志（最小工程实测全部无效），配方改以 -Wl,-rpath 直注 CMAKE_EXE/SHARED/MODULE_LINKER_FLAGS（产物 DT_RUNPATH 实测在位）。"
    - "conan cmake.test() 的 cli_args 被拼进 cmake --build（非 ctest 参数），--output-on-failure 非法：配方改为构建目录内直接 ctest --output-on-failure。"
    - "OHOS 加载器不把 RTLD_GLOBAL 已打开库的符号提供给之后打开的库（真机最小工程实证）：测试模块对插件函数的未定义引用须改走 LD_PRELOAD 通道（补丁 0006 把 13 个插件 .so 挂进 ctest unit 测试 ENVIRONMENT）。"
    - "上游脚本语言开关双门不同源：单元测试 HAVE_<LANG> 宏取自各语言开关、插件构建门为 ENABLE_SCRIPTS AND ENABLE_<LANG>——裁剪脚本运行时须把 8 个语言开关一并显式关闭，否则测试预期与插件集合不一致。"
    - "CppUTest 泄漏检测会计入运行时内部经可执行文件 interpose 的 operator new 分配（源位置 <unknown>）：照上游先例以 MemoryLeakWarningPlugin::turnOffNewDeleteOverloads()/turnOnThreadSafeNewDeleteOverloads() 圈定豁免；上游用例另有构建配置硬假设（硬编码 spell 插件、结构体 +1 偏移指针依赖分配器布局致间歇失败），裁剪组件后需最小改动适配（补丁 0007）。"
    - "上游测试清点口径：静态 TEST 声明数（1880）≠ CMake 清单登记执行数（1854）——上游自身未引用 test-relay-remote-event.cpp（26 例，任意平台不编译）；申报与核对执行数应以清单登记为口径。"
    - "zlib 以 config 模式提供 ZLIB::ZLIB 而非 ZLIB_LIBRARY 变量，需 target 映射；cpputest 以 CPPUTEST_LDFLAGS 提供链接参数。"
    - "cjson 制品包 pkg-config 文件名为 libcjson.pc，配方生成 cjson.pc 别名。"
  common_dependencies:
    - ncurses
    - zlib
    - gnutls
    - libgcrypt
    - curl
    - zstd
    - cjson

versions:
  "4.9.4":
    status: built
    build_date: "2026-10-11"
