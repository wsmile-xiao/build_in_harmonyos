# test_package/MANIFEST.yml — webfs 1.21
package: webfs/1.21
homepage: "https://linux.bytesex.org/misc/webfs.html"

# Source inspection: GNUmakefile and included mk/*.mk contain no upstream test/check target.
upstream_check_command: "none — no upstream test target"
upstream_test_command: "none"
upstream_test_in_build: false
upstream_tests: []
upstream_test_total: 0
upstream_test_count_method: source_inspection

test_package_tests:
  - file: test_webfs.py
    description: "A1-A2: help text and TLS option"
    command: "webfsd -h"
  - file: test_webfs.py
    description: "A3-A5: HTTP response, exact payload, and 404"
    command: "HTTP GET /index.bin and /missing.bin"
  - file: test_webfs.py
    description: "A6-A8: HarmonyOS buffered sendfile fallback returns correct 206, Content-Range, and exact bytes"
    command: "GET /index.bin with Range: bytes=3-11 on OHOS"
  - file: test_webfs.py
    description: "A9-A10: TLS handshake, HTTPS status, and exact payload"
    command: "HTTPS GET /index.bin"

# A1-A10; A6 explicitly exercises the HarmonyOS-specific buffered sendfile path.
assertion_count: 10
