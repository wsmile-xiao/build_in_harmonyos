software: wpa_supplicant
version: "2.11"
status: built
build_date: "2026-08-25"

source:
  url: "https://w1.fi/cgit/hostap/snapshot/hostap_2_11.tar.gz"
  sha256: "e9d887aa916963ef4c4e02074f238dae562c6757b9e549d5e24120520be28194"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CONFIG_DRIVER_NONE=y"
    - "CONFIG_AP=y"
    - "NEED_AP_MLME=y"
  dependencies:
    - openssl/1.1.1w
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "wpa_supplicant uses custom Makefile build system with .config (not autotools/cmake)"
  - "CONFIG_DRIVER_NL80211 requires libnl (not available on OHOS) - disabled, CONFIG_DRIVER_NONE enabled instead"
  - "struct probe_resp_params defined inside #ifdef NEED_AP_MLME but used outside it - fix by enabling CONFIG_AP and NEED_AP_MLME"
  - "CONFIG_SMARTCARD requires pcsclite - disabled on OHOS"
  - "CONFIG_CTRL_IFACE_DBUS requires dbus - disabled on OHOS"
  - "Source downloaded via git smart HTTP protocol (cgit snapshot URL blocked by bot detection)"
