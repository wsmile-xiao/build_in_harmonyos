sources:
  "3.3.3.1":
    url: "https://github.com/wxWidgets/wxWidgets/releases/download/v3.3.3/wxWidgets-3.3.3.tar.bz2"
    sha256: "81b09d6dd9f1ed9301f8c55a968a488d0491f264dc2bab19a7e407ac67009482"

patches:
  "3.3.3.1":
    - patch_file: "patches/0001-probe-getservbyname-r-signature.patch"
      patch_description: "Probe getservbyname_r independently from gethostbyname_r"
      patch_type: "portability"
    - patch_file: "patches/0002-build-cmake-modules-FindICONV.cmake.patch"
      patch_description: "Detect iconv symbols provided by libc"
      patch_type: "portability"
    - patch_file: "patches/0003-src-common-datetime.cpp.patch"
      patch_description: "Handle strftime trailing percent on the target libc"
      patch_type: "portability"
    - patch_file: "patches/0004-src-unix-uilocale.cpp.patch"
      patch_description: "Reject unsupported locales without a locale_t fallback"
      patch_type: "portability"
    - patch_file: "patches/0005-tests-file-dir.cpp.patch"
      patch_description: "Keep directory tests within target-accessible paths"
      patch_type: "portability"
    - patch_file: "patches/0006-tests-filename-filenametest.cpp.patch"
      patch_description: "Avoid filename cases unsupported by target filesystem semantics"
      patch_type: "portability"
    - patch_file: "patches/0007-tests-fswatcher-fswatchertest.cpp.patch"
      patch_description: "Gate filesystem watcher cases on observed target capabilities"
      patch_type: "portability"
    - patch_file: "patches/0008-tests-events-stopwatch.cpp.patch"
      patch_description: "Treat target timer scheduling jitter as an explicit test capability"
      patch_type: "portability"
    - patch_file: "patches/0009-tests-intl-uilocale-capabilities.cpp.patch"
      patch_description: "Gate locale data and collation cases on observed target capabilities"
      patch_type: "portability"
    - patch_file: "patches/0010-tests-mbconv-cp932-capability.cpp.patch"
      patch_description: "Gate CP932 conversion cases on observed target encoding capabilities"
      patch_type: "portability"
    - patch_file: "patches/0011-tests-filename-tmp-capability.cpp.patch"
      patch_description: "Treat an unwritable target /tmp as an explicit test capability"
      patch_type: "portability"
    - patch_file: "patches/0012-tests-mbconv-cp1252-capability.cpp.patch"
      patch_description: "Gate CP1252 conversion cases on observed target encoding capabilities"
      patch_type: "portability"
    - patch_file: "patches/0013-tests-mbconv-latin1-capability.cpp.patch"
      patch_description: "Gate ISO-8859-1 conversion cases on observed target encoding capabilities"
      patch_type: "portability"
    - patch_file: "patches/0014-tests-mbconv-fontmap-capability.cpp.patch"
      patch_description: "Gate fontmap CP1252 conversion cases on observed target encoding capabilities"
      patch_type: "portability"
    - patch_file: "patches/0015-tests-mbconv-fromwchar-capability.cpp.patch"
      patch_description: "Gate CP950 FromWChar cases on observed target encoding capabilities"
      patch_type: "portability"
    - patch_file: "patches/0016-tests-mbconv-nonbmp-capability.cpp.patch"
      patch_description: "Gate non-BMP UTF-16 cases on observed target encoding capabilities"
      patch_type: "portability"
    - patch_file: "patches/0017-tests-strings-numformatter-capabilities.cpp.patch"
      patch_description: "Gate locale-dependent number formatting on observed locale data"
      patch_type: "portability"
    - patch_file: "patches/0018-tests-xml-encoding-capabilities.cpp.patch"
      patch_description: "Gate XML windows-1252 cases on observed encoding capabilities"
      patch_type: "portability"
    - patch_file: "patches/0019-tests-catch-output-width.patch"
      patch_description: "Keep structured expected-skip markers on one Catch output line"
      patch_type: "portability"
    - patch_file: "patches/0020-tests-numformatter-locale-fixture-init.patch"
      patch_description: "Initialize alternate locale fixtures behind the existing capability guard"
      patch_type: "portability"
