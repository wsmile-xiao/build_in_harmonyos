# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wxwidgets/3.2.10
homepage: https://www.wxwidgets.org

# wxWidgets 上游测试套件需要 GUI 支持，鸿蒙适配仅构建 base toolkit (wxUSE_GUI=OFF)
# 因此上游测试无法在鸿蒙环境运行，验证通过 test_package 消费者测试完成
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "wxString 基本操作（wxRegEx 移除——wxRegExImpl 引用 libwx_baseu 缺失的 wxThread/wxMutex 符号——OHOS CMake 构建 base 库不完整如实记录）"
    command: "./test_wxwidgets"

# 测试断言总数
assertion_count: 1
