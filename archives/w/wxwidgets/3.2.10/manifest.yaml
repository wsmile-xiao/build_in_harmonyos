software: wxwidgets
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.2.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.2.10"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.10/wxWidgets-3.2.10.tar.bz2"

  # 源码校验和
  sha256: "d66e929569947a4a5920699539089a9bda83a93e5f4917fb313a61f0c344b896"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=OHOS"
    - "-DwxBUILD_SHARED=OFF"
    - "-DwxBUILD_SAMPLES=OFF"
    - "-DwxBUILD_TESTS=OFF"
    - "-DwxUSE_GUI=OFF"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"

  # 编译依赖列表（格式: name/version）
  # 与 conanfile.py requirements() 保持一致，使用制品仓已有版本
  dependencies:
    - zlib/1.3.1.1
    - expat/2.8.2
    - curl/8.15.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "wxWidgets 在鸿蒙上不支持 GUI，需设置 wxUSE_GUI=OFF 构建 base toolkit"
  - "CMake 构建需要将 OHOS SDK 的 lib 目录加入 LD_LIBRARY_PATH，否则 lld 链接器找不到 libxml2.so.16"
  - "生成的静态库文件名包含 OHOS 标识：libwx_baseu-3.2-OHOS.a"
  - "wxWidgets base toolkit 包含：正则表达式库(wxregex)、基础库(wx_baseu)、网络库(wx_baseu_net)"
