# 软件级 manifest - waon
# 遵循 ARCHIVE-SPEC v2.0

software: waon
display: "WaoN"
description: "WaoN - Wave-to-Notes 转写器（PCM WAV → Standard MIDI File）"
category: multimedia
homepage: "https://github.com/kichiki/WaoN"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游只有 3 个目标：waon(离线转写)、pv(需 libao/jack/ncurses)、gwaon(需 GTK2)；OHOS 制品仓无 GTK2/libao/jack，只交付 waon（同 wildmidi 关掉 player/devtest 的取舍）"
    - "Makefile.waon 里 CC/CFLAGS/LDFLAGS 是硬赋值且带 x86 专属 -march=pentium，交叉编译直接被 clang 拒；补丁 0001 改成 ?= 并删掉 -march=pentium，让 conan 导出的参数生效"
    - "依赖只 fftw/3.3.11 + libsndfile/1.2.2，都用 AutotoolsDeps 的 CFLAGS/LDFLAGS 传入，不再调 pkg-config（CI 沙箱不保证有 pkgconf）"
    - "上游 0.11 无自动化测试（Makefile 无 check/test 目标，无 tests/ 目录），上游用例数记 0，交付验证在 test_package：本地合成 440Hz WAV → 真机转 MIDI → 逐字节解析 SMF"
    - "waon --help/--version 之后上游 exit(1)（main.c 里 print_usage/print_version 后固定退出），消费者测试按这个事实断言，不改上游行为"
  common_dependencies:
    - fftw
    - libsndfile
