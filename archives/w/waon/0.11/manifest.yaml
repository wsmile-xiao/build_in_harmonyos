# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.11"

software: "waon"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-03"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://codeload.github.com/kichiki/WaoN/tar.gz/refs/tags/v0.11"
  sha256: "75d5c1721632afee55a54bcbba1a444e53b03f4224b03da29317e98aa223c30b"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile

  configure_options:
  - "make -f Makefile.waon waon"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - fftw/3.3.11
  - libsndfile/1.2.2

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
- patches/0001-makefile-waon-honor-environment-flags.patch

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "上游手写 Makefile 用 `VAR = ` 硬赋值会盖掉 conan 导出的 CC/CFLAGS/LDFLAGS，交叉编译需改成 `?=`"
- "conan AutotoolsDeps 把依赖头目录放 CFLAGS、-L 放 LDFLAGS、而 -l 库名放 LIBS；上游链接行不引用 $(LIBS) 就会编译全过、链接 undefined symbol"
- "-march=pentium 是 x86 专属参数，aarch64 clang 直接报 unknown argument，需在补丁里删除"
- "waon 的 --help/--version 分支执行完打印后 exit(1)，不是 0；消费者测试要按上游事实断言"
