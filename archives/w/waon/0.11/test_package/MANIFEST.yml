# test_package/MANIFEST.yml — waon 0.11 上游测试声明
package: waon/0.11
homepage: "https://github.com/kichiki/WaoN"

# 上游 0.11 没有任何自动化测试：
#   ls                        → 无 test/ 与 tests/ 目录
#   grep -nE '^check|^test|TESTS|ctest' Makefile Makefile.*    → 0 命中
#   grep -rn 'assert' *.c     → 0 命中
# 仓库里的 test.*.txt / sample.wav 是文档样例与手工听音素材，没有可执行入口，
# 因此上游用例数记 0（不是「有测试没跑」）。
upstream_check_command: "无：上游 Makefile 无 check/test 目标（grep -nE '^check|^test|TESTS' Makefile* → 0 命中）"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_waon.c
    description: "消费者测试：本地合成 440Hz 单声道/立体声 PCM WAV，调用打包后的 waon 真机转 MIDI，逐字节解析 SMF 断言 MThd/MTrk、note-on/note-off 计数与 A440→MIDI 音高窗口，并覆盖 --version 输出与缺输入文件的失败路径（15 项断言）"
    command: "./test_waon（conanrun env，设备真机运行）"

assertion_count: 15
