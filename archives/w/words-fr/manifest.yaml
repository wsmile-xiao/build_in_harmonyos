software: words-fr
display: "GNU Aspell French word list"
description: "Architecture-independent French word-list data normalized from GNU Aspell"
category: data
homepage: "https://ftp.gnu.org/gnu/aspell/dict/fr/"
license: GPL-2.0-or-later
build_system: data

ohos_adaptation:
  key_points:
    - "Package the default fr-60 dictionary as normalized UTF-8 data without target binaries."
    - "Expose the installed dictionary path through WORDS_FR_FILE in Conan build and run environments."
    - "Validate the package with Python consumers and a native HarmonyOS AArch64 C++ consumer."
  common_dependencies: []

versions:
  "2.1":
    status: built
    build_date: "2026-09-29"
    conan_ref: "words-fr/2.1"
    notes: "The default fr-60 list contains 629,569 entries; ConanVerifier and AArch64 W3 pass."
