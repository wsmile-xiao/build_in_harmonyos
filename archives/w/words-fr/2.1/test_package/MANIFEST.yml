# Conan consumer and HarmonyOS/AArch64 runtime test inventory.
package: words-fr/2.1
homepage: https://ftp.gnu.org/gnu/aspell/dict/fr/

upstream_check_command: "No upstream test suite; see ../notes.md source census"
upstream_test_in_build: false
upstream_test_command: "No upstream test executable or registered ctest/pytest command"

upstream_tests: []

test_package_tests:
  - file: test_words_fr.py
    description: "Consumes WORDS_FR_FILE from the Conan run environment and validates installed UTF-8 dictionary count, normalization, order, French samples, lookup miss, and licenses."
    command: "python test_words_fr.py"
    count: 19
  - file: test_words_fr.py
    description: "Confirms a missing consumer path is rejected through the expected-failure case."
    command: "python test_words_fr.py --word-list missing-words-fr --expect-missing"
    count: 1
  - file: test_words_fr.cpp
    description: "Built for HarmonyOS/AArch64; on a native HarmonyOS AArch64 Conan runner, consumes the packaged WORDS_FR_FILE and checks target identity, entries, normalization, UTF-8, ordering, and French samples."
    command: "./test_words_fr --require-ohos --expect-machine=aarch64"
    count: 14
  - file: test_words_fr.cpp
    description: "On a native HarmonyOS AArch64 Conan runner, confirms the compiled consumer rejects a missing package data path."
    command: "./test_words_fr --word-list missing-words-fr --expect-missing --require-ohos --expect-machine=aarch64"
    count: 1

assertion_count: 35
