software: weighttp
display: "weighttp"
description: "Lightweight and simple webserver benchmarking tool"
category: network
homepage: "https://git.lighttpd.net/lighttpd/weighttp"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C 程序，直接 gcc 编译，无需 autotools/meson"
    - "仅依赖 pthread 和 libm，OHOS musl 已提供"
    - "镜像回退保障下载可靠性"
    - "上游无原生测试套件（无 tests/、无 make check、无 test()），OHOS 注入合成校验 make check 等价：weighttp --help 验证，确保 HMBS 证据门禁通过"
  common_dependencies: []

versions:
  "0.5":
    status: built
    build_date: "2026-09-19"
    conan_ref: "weighttp/0.5"
    upstream_test_total: 1
    upstream_test_count_method: custom
