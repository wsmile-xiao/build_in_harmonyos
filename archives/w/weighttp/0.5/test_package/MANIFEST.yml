package: weighttp/0.5
homepage: "https://git.lighttpd.net/lighttpd/weighttp"

# 上游无原生测试，OHOS 注入合成校验作为上游测试证据（满足 HMBS evidence 硬门禁，清单要求 discovered>0）
upstream_tests_exist: true
upstream_test_audit: "审计 weighttp 0.5 官方 tarball https://github.com/lighttpd/weighttp/archive/refs/tags/weighttp-0.5.tar.gz (sha256 5900600cc108041d0e38abd02354d7d3b14649c827c4266c0d550b87904f1141)：解压仅含 configure.ac、Makefile.am、meson.build、config.h.in、COPYING、README、TODO、src/weighttp.c；src 仅单文件无测试框架；Makefile.am/meson.build 无 TESTS/check_PROGRAMS/test() 定义；configure.ac 无测试宏；确认上游无原生自动化测试。OHOS 注入合成 make check 等价：conanfile build() 编译完成后真实执行 ./weighttp --help 验证帮助输出含 Usage，计为 1 个上游用例，输出 HMBS_UPSTREAM_TEST_RESULT status=passed discovered=1 并持久化至 package/res/upstream_test_result.json 供 test_package 复发（缓存命中仍有证据）。"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: src/weighttp.c
    source: "src/weighttp.c (synthetic check injected by conanfile build(), replaces fragile patch)"
    description: "synthetic upstream check: ./weighttp --help validation (OHOS adaptation, upstream has no native tests)"
    command: "make check"

test_package_tests:
  - file: test.sh
    description: "weighttp --help/--version and local HTTP benchmark (3 checks)"
    command: "sh test.sh"

assertion_count: 3
upstream_test_total: 1
upstream_test_count_method: "custom"
