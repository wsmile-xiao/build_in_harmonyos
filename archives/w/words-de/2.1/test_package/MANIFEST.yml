package: words-de/2.1
homepage: "https://ftp.gnu.org/gnu/aspell/dict/"

upstream_check_command: "none (the source dictionary archives ship no tests)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests:
  counting_basis: "The two upstream archives contain no test files or test target"
  total: 0

test_package_tests:
  - file: test_words_de.cpp
    scenario: normal
    description: "Consume new and old German lists; verify counts, ordering, uniqueness, UTF-8 spellings, and the german alias"
    command: "./test_words_de <dictionary-directory>"
  - file: test_words_de.cpp
    scenario: fault-injection
    description: "Verify that a missing dictionary path is rejected"
    command: "./test_words_de --expect-missing <missing-path>"
  - file: test_words_de.cpp
    scenario: harmonyos-runtime
    description: "Run the OHOS-targeted consumer on the HarmonyOS PC x86_64 emulator and verify target macro, runtime architecture, and packaged wordlists"
    command: "hdc shell /data/local/tmp/test_words_de --harmonyos-runtime /data/local/tmp/words-de-dict"

assertion_count: 12
