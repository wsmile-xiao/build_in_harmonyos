software: wdisplays
display: "wdisplays"
description: "GTK+3 Wayland client for arranging displays (wlr-output-management-unstable-v1)"
category: application
homepage: "https://github.com/artizirk/wdisplays"
license: GPL-3.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "OHOS GTK 3 (gtk/3.24.43) 只有 broadway(HTML5) 后端，无 GDK Wayland 后端/<gdk/gdkwayland.h>——补丁 0001 以 wayland-client 实现 gdkwayland 访问器（wl_display 真连接，Broadway 窗口无 wl_surface 时返回 NULL），并放宽 meson 的 GDK wayland 后端硬断言"
    - "wayland-scanner（wayland 包 bin/）在 HMFS 上直接执行 EPERM，且 DT_NEEDED 记录构建机绝对路径——staging 时 patchelf 改写为 soname + 重签名 + wrapper 注入 LD_LIBRARY_PATH"
    - "gnome.compile_resources 依赖 glib-compile-resources（glib 包 bin/ OHOS ELF）——staging/重签名 + 注入 gio-2.0.pc 变量"
    - "wayland-protocols 的 pkgdatadir 与 gdk-3.0.pc（targets=broadway）由配方手工注入 PkgConfigDeps 生成物"
    - "运行时需 wlr-output-management-unstable-v1 compositor；OHOS GDK 为 broadway，故本包在 OHOS 上以编译/链接适配为主，交互运行需 Wayland compositor"
  common_dependencies:
    - gtk
    - wayland
    - wayland-protocols
    - libepoxy

versions:
  "1.1.3":
    status: built
    build_date: "2026-09-24"
    conan_ref: wdisplays/1.1.3
    archive: archives/w/wdisplays/1.1.3
