# OHOS 适配补丁组（refresh-patch --auto 生成，应用后与适配工作树逐字节一致）
# 背景：OHOS GTK 3（gtk/3.24.43）只有 broadway(HTML5) 后端，既无 GDK Wayland
# 后端也无 <gdk/gdkwayland.h>，而 wdisplays 依赖 GDK 的 Wayland 访问器。
patches:
  - patch_file: "patches/0001-src-gdkwayland-compat.c.patch"
    patch_description: >
      新增 GDK Wayland 访问器兼容层实现：用 wayland-client 真实
      wl_display_connect() 提供 gdk_wayland_display_get_wl_display，wl_output
      经 wl_registry 绑定提供 gdk_wayland_monitor_get_wl_output；Broadway 窗口
      背后无 wl_surface，gdk_wayland_window_get_wl_surface 如实返回 NULL
    patch_type: "portability"
  - patch_file: "patches/0002-src-gdkwayland-compat.h.patch"
    patch_description: >
      新增兼容层头文件：声明上述访问器，并以“本进程是否建立 Wayland 连接”
      语义化补充 <gdk/gdkwayland.h> 的 GDK_IS_WAYLAND_DISPLAY 宏
    patch_type: "portability"
  - patch_file: "patches/0003-src-main.c.patch"
    patch_description: >
      main.c 改用 gdkwayland-compat.h（替代 <gdk/gdkwayland.h>）；activate()
      中 wl_display 为 NULL 时给出明确致命错误，避免对 NULL 连接调用
      wl_display_get_registry 而段错误
    patch_type: "portability"
  - patch_file: "patches/0004-src-meson.build.patch"
    patch_description: >
      src/meson.build：把“GDK 必须含 wayland 后端”的硬断言放宽为
      “wayland 或 broadway 二者之一”，并把新增的 gdkwayland-compat.c 纳入
      可执行文件源列表
    patch_type: "portability"
  - patch_file: "patches/0005-src-overlay.c.patch"
    patch_description: >
      overlay.c 改用 gdkwayland-compat.h；resize() 对 NULL wl_surface /
      wl_display 安全跳过，window_map() 在无 wl_surface 时跳过 layer surface
      创建（Broadway 后端下不崩溃）
    patch_type: "portability"
