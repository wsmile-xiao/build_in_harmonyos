# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wdisplays/1.1.3
homepage: "https://github.com/artizirk/wdisplays"

# 上游测试命令：上游无测试套件
# 核验证据：仓库文件树无 tests/ 目录；全量 meson.build 无 test()/benchmark()
# 注册；无 CI 测试 workflow。构建即验证编译链接。
upstream_check_command: "meson compile"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无独立测试套件）
upstream_tests: []

# test_package 中自带的测试（消费者视角 + 鸿蒙平台视角验证）
test_package_tests:
  - file: test.sh
    description: >
      鸿蒙特有测试：6 组断言——(1) bin/wdisplays 存在可执行；(2) ELF 为
      AArch64 且带 .codesign 段（HMFS 未签名 ELF 不可执行）；(3) 动态链接
      libwayland-client/libgtk-3/libepoxy（OHOS 制品仓依赖）；(4) 鸿蒙
      GDK-Wayland 兼容层符号 gdk_wayland_display_get_wl_display 已编入
      （证明补丁 0001 真实生效）；(5) gnome.compile_resources 产出的
      GResource 已编入；(6) 真机运行 wdisplays --help 退出码 0
    command: "bash test.sh <package bin dir>"
  - file: conanfile.py
    description: "验证 test_package 能消费 wdisplays/1.1.3 并运行 test.sh"
    command: "conan test"

# 测试断言总数：上游无独立测试用例（0），test_package 6 组断言
assertion_count: 6
