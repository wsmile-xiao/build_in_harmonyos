knowledge_gained:
  - "OHOS GTK3 只有 broadway 后端：依赖 <gdk/gdkwayland.h> 的 Wayland 客户端需自建 gdkwayland 访问器（wayland-client 真连接 + broadway 下 wl_surface 返回 NULL）并放宽 meson 的 GDK wayland 后端断言（knowledge_ref: E527, E463）"
  - "wayland 包 wayland-scanner 在 HMFS 直接执行 EPERM 且 DT_NEEDED 携带构建机绝对路径——拷贝+patchelf --replace-needed 改 soname+重签名+wrapper 注入 LD_LIBRARY_PATH，patchelf 必须早于重签（knowledge_ref: E537, E463）"
  - "gnome.compile_resources 在 OHOS 需 staging glib-compile-resources 并向 gio-2.0.pc 注入 glib_compile_resources 变量（knowledge_ref: E463）"
  - "wayland-protocols 协议 XML 目录经 .pc 的 pkgdatadir 暴露，PkgConfigDeps 生成物需手工补；gdk-3.0.pc 需手工生成（targets=broadway）（knowledge_ref: E527）"

