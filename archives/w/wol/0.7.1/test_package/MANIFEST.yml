package: wol/0.7.1
homepage: "https://sourceforge.net/projects/wake-on-lan/"
# make check is a build-consistency target in this release, not a test case.
upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"
upstream_tests: []
test_package_tests:
  - file: test_packet.py
    description: "Installed command emits exact normal and SecureON UDP packets over loopback"
    command: "python3 test_packet.py <installed wol>"
assertion_count: 7
