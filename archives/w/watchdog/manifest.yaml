# 软件级 manifest — watchdog
# 遵循 ARCHIVE-SPEC v2.0

software: watchdog
display: "watchdog"
description: "Linux 看门狗守护进程 — 监控系统健康状态，在系统无响应时自动重启"
category: utility
homepage: "https://sourceforge.net/projects/watchdog/"
license: "GPL-2.0-or-later"
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Autotools 项目（预生成 configure + Makefile.in），无 make check 测试目标"
    - "HMDFS FUSE 文件系统 remaps 文件所有权，导致 config.status 的 umask 077 创建不可访问的临时目录（drwx------ = 700），需将 umask 077 改为 umask 0"
    - "watchdog 是命令行工具（application），非库；产物安装到 sbin/"
    - "构建产物：3 个可执行文件 — watchdog（主守护进程）、wd_keepalive（保活助手）、wd_identify（设备识别）"
    - "无外部依赖，纯 C 标准库 + POSIX + -lrt"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "5.16":
    status: built
    build_date: "2026-09-04"
