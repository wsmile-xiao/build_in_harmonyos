# test_package/MANIFEST.yml — watchdog 5.16
# CI L0e requires this file to exist.

package: watchdog/5.16
homepage: "https://sourceforge.net/projects/watchdog/"

# watchdog has no upstream test suite (no test targets in Makefile.am)
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: ""

# No upstream test programs in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Verifies watchdog, wd_keepalive, and wd_identify binaries are installed and executable"
    command: "bash test.sh"

# Approximate assertion count (3 binary checks + output verification)
assertion_count: 4
