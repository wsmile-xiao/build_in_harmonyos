# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁强制要求存在）

package: wmname/0.1
homepage: "https://tools.suckless.org/wmname/"

# 上游源码静态清点（2026-09-30，对 wmname-0.1.tar.gz 实测）：
#   tarball 内容 = wmname.c / Makefile / config.mk / README / LICENSE
#   —— 无 test 目录、无 make check 目标、无任何测试框架注册入口。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试套件
upstream_tests: []

# test_package 中自带的测试（消费者视角，真实执行打包产物）
test_package_tests:
  - file: "test_wmname.sh"
    description: "Consumer test: runs the signed packaged ELF and asserts the three deterministic upstream branches (usage / -v / cannot open display, each exit 1), the three atom name literals baked into the linked binary (portable strings/byte search, not grep -a), the libX11 DT_NEEDED SONAME, and the ELF64/LSB-AArch64 header"
    command: "bash test_wmname.sh <packaged-bin/wmname> <workdir>"

# 测试断言总数（A1-A12；2026-09-30 返修：A8-A10 改为可移植口径并新增 A11/A12，10 → 12）
assertion_count: 12
