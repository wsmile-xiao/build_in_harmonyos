# 版本级 manifest
# 文件位置: archives/w/wmname/0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.1"
software: wmname
status: built
build_date: "2026-09-30"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://dl.suckless.org/tools/wmname-0.1.tar.gz"
  sha256: "559ad188b2913167dcbb37ecfbb7ed474a7ec4bbcb0129d8d5d08cb9208d02c5"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "沿用上游 Makefile/config.mk，仅把 X11INC/X11LIB/INCS/LIBS 覆盖为 conan 依赖真实路径（libx11/6.4.0 + xorgproto/2025.1）"
    - "CFLAGS/LDFLAGS 结构、-DVERSION 版本宏与链接后 strip 步骤保持上游不变"
    - "make -j1（R9，单文件直编）"
  dependencies:
    - libx11/6.4.0
    - xorgproto/2025.1
  cc: clang
  cxx: clang++

build_command: "cd $SRC && make -j1 CC=$CC LD=$CC X11INC=<libx11 inc> X11LIB=<libx11 lib> INCS=<deps inc> LIBS=<deps lib> -lX11（env=conanbuild）"
install_command: "拷贝 bin/wmname + LICENSE；在最终包内 ELF 上移除失效 .codesign 后 binary-sign-tool 自签名"

# ============================================================
# 测试信息
# ============================================================

test_command: "test_package/test_wmname.sh：执行打包产物，断言 usage / -v / cannot open display 三条确定性路径（各 exit 1）+ 二进制内 _NET_WM_NAME / _NET_SUPPORTING_WM_CHECK / UTF8_STRING 字面量（strings|grep + grep -a 双探测器，不依赖 grep 实现）+ libX11 DT_NEEDED SONAME + ELF64/LSB-AArch64 头（od 直读）"
test_result: "12/12"
test_status: "pass"
test_note: "上游无测试套件（源码仅 wmname.c/Makefile/config.mk/README/LICENSE，无 make check）⇒ 消费者测试补位，详见 test_package/MANIFEST.yml；A8-A10 于 2026-09-30 由 `grep -a <字面量> <ELF>` 改为可移植口径并新增 A11/A12（10→12），原因与读数见 notes.md「CI 返修」节"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained: []

