# 版本级 manifest -- wrapsrv 1.0.0

version: "1.0.0"
software: "wrapsrv"
# 'built' until the release pipeline uploads the binary; commands.json
# declares "binary": false, so 'published' would contradict it pre-PR (R29).
status: built
build_date: "2026-10-01"
build_system: makefile

source:
  url: "https://github.com/farsightsec/wrapsrv/archive/refs/tags/tags/v1.0.0.tar.gz"
  sha256: "df317fe09be9e00816453676114cdb7573420b7e1082eec1a74f780421520b23"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-replace-ns_name_ntop-with-portable-wire-name-renderer.patch"

knowledge_gained:
  - "OHOS' musl libc declares BIND's ns_name_ntop() in <arpa/nameser.h> but does not implement it, so any program calling it fails to link with 'ld.lld-15: error: undefined symbol: ns_name_ntop'. It does ship ns_name_uncompress(), dn_expand(), dn_skipname(), ns_initparse(), ns_parserr(), res_query() and herror(). An in-tree RFC 1035 wire-to-presentation renderer covers the gap [knowledge_ref: DRAFT-10050]"
  - "wrapsrv's Makefile hardcodes LDFLAGS = -lresolv. OHOS has no libresolv at all (the resolver lives in libc), so the flag has to be overridden to empty; nothing is lost because res_query()/ns_parserr() are libc symbols [knowledge_ref: DRAFT-10050]"
  - "The upstream release tag of wrapsrv is literally named 'tags/v1.0.0', so the archive URL is .../archive/refs/tags/tags/v1.0.0.tar.gz and the extracted root directory is wrapsrv-tags-v1.0.0 [knowledge_ref: DRAFT-10050]"
  - "wrapsrv exits with EXIT_FAILURE(1) for every non-success path: too few arguments, unresolvable name, non-zero rcode, empty answer section, and the exit status of the command it finally ran. There is no --version/--help flag, so a smoke test must assert the usage text instead [knowledge_ref: DRAFT-10050]"
  - "wrapsrv implements the RFC 2782 selection order: the whole lowest-priority group is exhausted before the next priority, and the next record is only tried when the command exits non-zero. A canned answer listing the priority-20 record first therefore proves the ordering [knowledge_ref: DRAFT-10050]"
  - "Upstream ships no test suite at all (no tests/ directory, no check/test target in the Makefile), so N=0 upstream functional tests holds; the Makefile's only extra target is 'install', which writes $(DESTDIR)$(PREFIX)/bin and /share/man/man1 [knowledge_ref: DRAFT-10050]"

patch_classification:
  - file: 0001-replace-ns_name_ntop-with-portable-wire-name-renderer.patch
    type: auto
    platform_only: false
    guard: "verified: without the patch the OHOS link fails with 'ld.lld-15: error: undefined symbol: ns_name_ntop' and no binary is produced; with it 'make CC=<clang> LDFLAGS=' exits 0 under upstream's own -Wall -Wextra -Werror and the packaged test decodes SRV target names correctly"
