# test_package/MANIFEST.yml -- wrapsrv 1.0.0 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
# 详见: docs/TEST_QUALITY_SPEC.md

package: wrapsrv/1.0.0
homepage: "https://github.com/farsightsec/wrapsrv"

# 上游测试审计（R51 清点，实测纯净上游 tarball
# wrapsrv-tags-v1.0.0/ 解包结果）：
#   - tarball 共 9 个文件：.gitignore COPYRIGHT LICENSE Makefile README.md
#     list.h wrapsrv.1 wrapsrv.c wrapsrv.docbook —— 无任何测试文件。
#   - 无 tests/ test/ 目录（find -type d -iname '*test*' 命中 0）。
#   - Makefile 只有 5 个目标：all（:16）/ $(BIN)（:18）/ $(MAN)（:21）/
#     clean（:24）/ install（:27），既无 check 也无 test 目标。
#   - $(MAN) 目标需要 docbook2x-man（docbook2x 工具链），属于文档生成而非测试。
#   => 上游可运行功能测试用例数 N=0 成立。
upstream_check_command: "make check"
upstream_check_command_runnable: false
upstream_check_command_blocked_reason: "upstream Makefile has no check/test target at all (only all/$(BIN)/$(MAN)/clean/install) and the tarball ships no test source"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_blocked_reason: "no runnable upstream functional test suite (see upstream_check_command_blocked_reason)"

# 上游实际运行的测试程序（无，见上）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_wrapsrv.sh
    description: "27 项断言，全部落在真实交付二进制上：①CLI 契约（无参/单参/--help 均 exit 1 + 精确 usage 文本）；②单条 SRV 应答下 %h/%p 独立占位符替换 + 被替换命令行真实执行（stdout 精确比对）；③行内替换 x%hy%pz -> xprimary.example.comy8080z；④RFC 2782 优先级（应答里 priority-20 记录排在前面，必须仍选 priority-10 的 primary）；⑤命令失败时按优先级回退到 backup 并透传 exit 1；⑥NXDOMAIN rcode 3 / 空应答段两条负向路径；⑦不挂桩的真实 libc resolver 查询必须失败"
    command: "bash test_wrapsrv.sh"
  - file: res_stub.c
    description: "测试用 DNS 传输层桩（LD_PRELOAD），只替换 res_init()/res_query()，返回逐字节正确的 RFC 1035 应答；res_query() 之后的 ns_initparse/ns_parserr/SRV rdata 解析/RFC 2782 选择/%h%p 替换/system() 全部走交付的上游代码"
    command: "compiled by test_package/conanfile.py into a throwaway temp dir"

# 测试断言总数（test_wrapsrv.sh 内 t() + check() 调用之和 = 27，
# 与本地 conan create 输出 'TOTAL=27 PASS=27 FAIL=0' 一致）
assertion_count: 27
