# test_package/MANIFEST.yml — wwwoffle 2.9j
# 上游测试声明文件。CI/真机门禁读取此文件校验上游测试接入与计数口径。

package: wwwoffle/2.9j
homepage: "http://www.gedanken.org.uk/software/wwwoffle/"

# ─── 上游测试存在性审计（rule4）───────────────────────────────────────
upstream_tests_exist: true

upstream_test_audit:
  source: "www.gedanken.org.uk/software/wwwoffle/download/wwwoffle-2.9j.tgz (wwwoffle 2.9j 官方发布包)"
  build_system: autotools
  audit_note: >
    上游发布包 src/testprogs/ 目录自带 5 个诊断测试程序：test-doc.c、test-msg.c、
    test-modify.c、test-gif.c、test-io.c（见 src/testprogs/README）。
    上游 Makefile 没有 `make check` 目标；这些程序随 `make`（src/Makefile compile =>
    cd testprogs && make compile）自动编译为 src/testprogs/ 下的可执行文件。
    程序为手动诊断工具（非断言框架）：按输入做解析/IO 并返回 0，出错时 Fatal 分支 exit(2)。
    因此“一条用例”= 一个测试程序被编译并成功执行（exit 0）。共计 5 个。
  test_definition: "src/testprogs/{test-doc,test-msg,test-modify,test-gif,test-io}"
  dependency: 无外部测试依赖（测试程序复用主程序对象文件与系统库；zlib/gnutls/gcrypt 已用 --with-*=no 关闭）

# 计数字段（rule4）：上游测试总数 = 5 个 testprogs 程序
upstream_test_total: 5
upstream_test_count_method: autotools_tests
upstream_test_count_note: >
  上游无 ctest/automake-check/gtest 等可解析框架；按与官方发布一致的口径统计：
  随 autotools 构建（src/testprogs）编译并逐个执行的 5 个测试程序即全部上游测试。

# 上游实际运行的测试程序
upstream_check_command: "（无 make check；在 src/testprogs 下逐个运行 5 个测试程序）"
upstream_test_in_build: true
upstream_test_command: "排程在 conanfile.py build() 内运行 src/testprogs 下 5 个测试程序"

upstream_tests:
  - name: test-io
    source: wwwoffle-2.9j/src/testprogs/test-io.c
    description: "IO 函数回环测试（普通/zlib/chunked 读写与行读取）"
    command: "./test-io"
  - name: test-msg
    source: wwwoffle-2.9j/src/testprogs/test-msg.c
    description: "消息模板渲染测试（HTMLMessageBody）"
    command: "./test-msg PageNotFound"
  - name: test-doc
    source: wwwoffle-2.9j/src/testprogs/test-doc.c
    description: "Document 解析器测试（喂 HTML 到 stdin）"
    command: "./test-doc http://localhost/ < html"
  - name: test-modify
    source: wwwoffle-2.9j/src/testprogs/test-modify.c
    description: "HTML 修改代码测试（喂 HTML 到 stdin）"
    command: "./test-modify http://localhost/ < html"
  - name: test-gif
    source: wwwoffle-2.9j/src/testprogs/test-gif.c
    description: "GIF 修改/转码测试（喂 1x1 GIF 到 stdin）"
    command: "./test-gif < gif"

# test_package 中自带的测试（消费者视角验证）
# 说明：OHOS 上打包 ELF 用 `sh`+PATH 执行会报 "inaccessible or not found"，故 test() 用
# bash + package_folder 绝对路径调用打包二进制（范式同 templates/test_package-executable / keychain）。
test_package_tests:
  - file: test.sh
    description: "执行打包产物 wwwoffle --version 验证可运行（bash + package 绝对路径调用）"
    command: "bash test.sh <pkg>/bin/wwwoffle <pkg>/bin/wwwoffle-tools"

# 测试断言总数（近似值）：上游 5 个测试程序 + test_package 1 个消费者冒烟测试
assertion_count: 6
