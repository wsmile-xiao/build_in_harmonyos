software: wwwoffle
version: "2.9j"
status: built
build_date: "2026-09-29"

source:
  url: "http://www.gedanken.org.uk/software/wwwoffle/download/wwwoffle-2.9j.tgz"
  sha256: "b16dd2549dd47834805343025638c06a0d67f8ea7022101c0ce2b6847ba011c6"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-zlib=no"
    - "--with-gnutls=no"
    - "--with-gcrypt=no"
  cc: clang

dependencies: []

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-pwd.patch"
  - "0004-configure-mktemp-fallback.patch"

knowledge_gained:
  - "wwwoffle 自带的是 2010 年的 config.guess/config.sub，不认识 aarch64 和 HarmonyOS/OHOS 主机三元组；替换为现代版本并加入 OHOS 检测后 configure 才能在本机进行原生构建"
  - "HMDFS 下 out-of-source VPATH 构建目录 getcwd() 失败会导致 autoconf 'working directory cannot be determined'；build() 里 os.chdir + 预置 $PWD，并修改 configure 的 ac_pwd 回退到 $PWD 即可绕过"
  - "HMFS 上 config.status 用 mktemp -d 建的 0700 临时目录继承 setgid 父目录 owner 而当前用户写不进去（subs1.awk Permission denied）；通过 configure 补丁强制走 mkdir 回退（建当前用户拥有的目录）解决，且该代码块位于 config.status heredoc 内会同时传播到生成的 config.status"
  - "上游 Makefile 没有 `make check` 目标；src/testprogs/ 下编译了 5 个测试程序（test-doc/test-msg/test-modify/test-gif/test-io），作为诊断工具随 make 一起编译"
  - "`make install` 会把配置安装到 /etc/wwwoffle、缓存到 /var/spool/wwwoffle 并运行 fixup-install.sh，不适合 conan 打包；改用直接复制可执行文件的方式"
  - "zlib/gnutls/gcrypt 均为可选功能，本阶段通过 configure 关闭以避免外部依赖，后续可开启"
