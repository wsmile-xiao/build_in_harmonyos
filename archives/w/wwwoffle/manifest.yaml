software: wwwoffle
display: "WWWOFFLE"
description: "WWW Offline Explorer - 带缓存的 HTTP/FTP/finger 代理服务器，支持离线浏览"
category: network
homepage: "http://www.gedanken.org.uk/software/wwwoffle/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "替换 2010 版 config.guess/config.sub 为现代版本并加入 HarmonyOS/OHOS 检测，使 configure 能识别 aarch64-*-linux-ohos"
    - "可选依赖 zlib/gnutls/gcrypt 通过 configure 关闭，降低 OHOS 外部依赖面"
    - "wwwoffle 为独立工具，非系统同名库，不强制静态链接（R26 仅针对系统同名库）；避免因静态 libc 缺失导致链接失败"
    - "package() 直接打包可执行文件代替 make install（后者会装到 /etc、/var 并跑 fixup-install.sh）"
  common_dependencies: []

versions:
  "2.9j":
    status: built
    build_date: "2026-09-29"
