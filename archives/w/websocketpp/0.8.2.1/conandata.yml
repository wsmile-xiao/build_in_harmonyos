# conandata.yml — websocketpp 0.8.2.1
# 上游源码仍是 0.8.2 tag（设备端实测 200，sha256 与 0.8.2 完全一致）；
# ".1" 是适配修订（R37）：配方把 boost 钉到 boost/1.90.0.4，并在 build() 中
# 集成上游官方测试（upstream_tests/CMakeLists.txt + ctest，见 notes.md §4）。
# 0001-0003 与 0.8.2 逐字节相同；0004/0005 只改 test/ 源码，不触碰被打包的
# websocketpp/ 头文件。

sources:
  url: "https://github.com/zaphoyd/websocketpp/archive/refs/tags/0.8.2.tar.gz"
  sha256: "6ce889d85ecdc2d8fa07408d6787e7352510750daa66b5ad44aacb47bea76755"

patches:
  - patch_file: "patches/0001-websocketpp-common-asio.hpp.patch"
    patch_description: "common/asio.hpp: add a Boost.Asio >= 1.31 (Boost >= 1.88) compatibility layer - io_service/io_context alias, work -> executor_work_guard, is_expired() replacing the removed expires_from_now() getter, free post()/restart() wrappers, and resolver wrappers (query/iterator -> results_type)"
    patch_type: "portability"
    sha256: "290579891a8c00d141515812d8d287f2fe23c5dcfb2a4c27506165ee7d90e81f"
  - patch_file: "patches/0002-websocketpp-transport-asio-connection.hpp.patch"
    patch_description: "transport/asio/connection.hpp: route timer-expiry checks through lib::asio::is_expired() and io_service posting through lib::asio::post_handler()"
    patch_type: "portability"
    sha256: "022f9de81560e3ee18be3b42741ab8d5c40be7449baf8c56c42fe28b2c183538"
  - patch_file: "patches/0003-websocketpp-transport-asio-endpoint.hpp.patch"
    patch_description: "transport/asio/endpoint.hpp: build the perpetual work guard through make_work_guard(), use socket_base::max_listen_connections, wrap reset() -> restart(), and use resolver results in listen()/async_resolve()/handle_resolve()"
    patch_type: "portability"
    sha256: "5bc89dd35ff6691af509c2d496d8d39eb7caa1339d1ea89c9db6e55f8dc9c411"
  # 0004/0005 只修改 test/ 源码（打包产物与 0.8.2 完全一致）：让上游测试在本
  # 环境可编译，因为上游自己的 SCons 路径在这里无法使用（见 notes.md §4）。
  - patch_file: "patches/0004-test-boost-test-header-only.patch"
    patch_description: "test/*: switch <boost/test/unit_test.hpp> to the header-only <boost/test/included/unit_test.hpp>; the boost package in this repo ships no libboost_unit_test_framework, so the separately-linked Boost.Test entry point is unavailable"
    patch_type: "portability"
    sha256: "c1b3349ead79bea42c5360e64e696f797ec3a5cadd7b4b4a79f790c1ca9e71d3"
  - patch_file: "patches/0005-test-asio-modern-api.patch"
    patch_description: "test/endpoint/endpoint.cpp, test/transport/integration.cpp, test/transport/asio/timers.cpp: migrate to Boost.Asio >= 1.31 (io_service -> io_context, removed resolver query/iterator -> results, address::from_string -> make_address, deadline_timer/posix_time -> steady_timer/std::chrono); the same compatibility work patches 0001-0003 do for the library headers"
    patch_type: "portability"
    sha256: "c88cbac0267a320f728511af8ed3f82c7e272907bd81ce217dbb0e29c4817276"
