# 软件名称
name: websocketpp
software: websocketpp

# 软件描述
description: "C++ WebSocket client/server library built on Boost.Asio (header-only)"

# 软件主页
homepage: https://github.com/zaphoyd/websocketpp

# 软件类别
category: network

# 版本号
version: "0.8.2.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"

# ============================================================
# 本版本为什么存在（R37 适配修订）
# ============================================================
# 上游源码仍是 0.8.2 tag，三个补丁与 archives/w/websocketpp/0.8.2 逐字节相同。
# 唯一实质差异：requires boost/1.90.0 → boost/1.90.0.4。
# 原因：下游 autobahn-cpp 的 CMake 需要已编译的 Boost.Thread / ProgramOptions，
# 而本仓库只有 boost/1.90.0.4 这一变体**同时**提供 asio 头与这些 .a；
# 同一 Conan 依赖图里 boost 只能有一个版本，故必须另开一个适配修订，
# 不能回改已经提交的 0.8.2（那会让已评审的配方与已验证的依赖组合失配）。

revision_reason: "boost flavor alignment for autobahn-cpp (boost/1.90.0.4); upstream source and patches identical to 0.8.2"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag，与 0.8.2 同；设备端实测 200 + sha256 核验）
  url: "https://github.com/zaphoyd/websocketpp/archive/refs/tags/0.8.2.tar.gz"

  # 源码校验和
  sha256: "6ce889d85ecdc2d8fa07408d6787e7352510750daa66b5ad44aacb47bea76755"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 顶层构建系统标识（verify-build G4 检查）：上游是 cmake 工程，但本配方
# 不调用它（header-only，package() 直接 copy 头文件）
build_system: cmake

build:
  system: cmake

  # 配方为纯头文件安装（package() copy headers），不调用 cmake configure
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - boost/1.90.0.4
    - openssl/3.5.6

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（与 0.8.2 同名同内容，sha256 逐条一致）
patches_applied:
  - patches/0001-websocketpp-common-asio.hpp.patch
  - patches/0002-websocketpp-transport-asio-connection.hpp.patch
  - patches/0003-websocketpp-transport-asio-endpoint.hpp.patch

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ref: E103 - CMake 4.x × cmake_minimum_required(2.8.8)（本配方不走上游 CMake，免用）"
  - "ref: E074 - make -j 触发 jobserver mkfifo: Operation not permitted（诊断与构建统一 -j1）"
  - "DRAFT-asio-classic-executor-boost-1-88.kv 的复用面在本版本得到二次验证：换到 boost/1.90.0.4（同样 BOOST_ASIO_VERSION 103800，Asio 1.38）后，三个补丁原样应用、8 道门禁全 PASS、38 断言真实 WebSocket 会话测试通过 → 兼容层按 Asio 版本门控而非按 boost 包变体门控，跨变体可移植"
  - "本仓库 boost 变体差异是真实选型约束：boost/1.90.0 只给头 + unit_test_framework；boost/1.90.0.4 才同时有 asio 头与 libboost_thread.a/libboost_program_options.a；boost/1.91.x 有 random 但 include 树里没有 boost/asio（websocketpp 在其上编不了）"
  - "同一依赖图内 boost 只能一个版本：下游需要已编译 boost 组件时，必须以新适配修订（0.8.2.1）对齐 pin，而不是回改已提交的 0.8.2"
  - "boost/1.90.0.4 配方自身无 self.requires（不传递 openssl），所以 websocketpp 仍需显式 requires openssl/3.5.6（config/asio*.hpp → boost/asio/ssl.hpp → openssl 头）"

