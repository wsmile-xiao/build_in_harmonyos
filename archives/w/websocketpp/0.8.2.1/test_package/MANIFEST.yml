    command: "ctest -R test_http"
  # ── test/logger ──
  - file: test/logger/basic.cpp
    source: websocketpp-0.8.2/test/logger/basic.cpp
    description: "basic logger 通道开关与动态等级（8 assertions / 5 cases，passed）"
    command: "ctest -R logger_basic"
  # ── test/random ──
  - file: test/random/none.cpp
    source: websocketpp-0.8.2/test/random/none.cpp
    description: "none random 策略（1 assertion / 1 case，passed）"
