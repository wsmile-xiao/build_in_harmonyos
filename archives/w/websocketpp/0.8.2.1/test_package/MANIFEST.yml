# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: websocketpp/0.8.2.1
homepage: "https://github.com/zaphoyd/websocketpp"

# 上游官方测试命令：上游是 SCons（`scons test`）。SConstruct 在本环境不可用：
#   1) Python2 专用（L31/L35/L178 的 os.environ.has_key()），且设备与 CI 都没有 scons；
#   2) L35/L176-180 要求 BOOST_ROOT/stage/lib 预编译树，Conan 不提供该布局。
# 因此按 PR #7144 评审意见，把上游 test/ 官方套件转换为 CMake harness + ctest，
# 在 conanfile.py build() 中真实编译并运行（TEST_QUALITY_SPEC layer 1）。
# 下面 31 个二进制逐一对应 SConstruct to_test 的 13 个目录中 SConscript 声明的
# 31 个 env.Program('..._boost')；*_stl 目标是同一批 .cpp 的第二种编译形态
# （仅多 -D_WEBSOCKETPP_CPP11_STL_，而 clang15 的 __cplusplus>=201103L 已使该 define 冗余），
# 故不重复构建。完整论证见 notes.md §上游测试。
upstream_check_command: "ctest (upstream_tests/CMakeLists.txt harness)"

# conanfile.py build() 中是否已集成上游测试：是。
# build() = apply_conandata_patches + CMake configure/build + self.run("ctest --output-on-failure")。
# 任一上游用例失败 → conan create 失败，与 make check 同语义；日志含字面 ctest（L1c 门禁）。
# ctest 之后 build() 再打印一行机器可读结果（数字来自 ctest 自身输出，非硬编码）：
#   HMBS_UPSTREAM_TEST_RESULT={"status":"passed","framework":"ctest",...,"discovered":31,"passed":31,"failed":0,"skipped":0}
upstream_test_in_build: true
upstream_test_command: 'self.run("ctest --output-on-failure", cwd=self.build_folder)'

# 为使上游测试可编译而新增的测试源码补丁（只改 test/，不触碰被打包的 websocketpp/ 头文件）：
#   patches/0004: <boost/test/unit_test.hpp> → header-only <boost/test/included/unit_test.hpp>
#   patches/0005: endpoint.cpp / integration.cpp / timers.cpp 的 Boost.Asio>=1.31 迁移
# 更正 websocketpp/0.8.2 归档里的一条旧声明：上游用例并非使用已删除的旧入口
# `init_unit_test_suite` —— 33 个测试源文件全部用现代 BOOST_TEST_MODULE；
# 真正缺口是本版本 pin 的 boost/1.90.0.4 包内没有 libboost_unit_test_framework.a
# （设备端 conan cache path 实测其 12 个 .a 里无此项），故改用 header-only Boost.Test。
#
# 设备端实测（HarmonyOS aarch64, clang 15.0.4, boost/1.90.0.4, openssl/3.5.6 静态,
# zlib 来自 OHOS SDK sysroot —— 上游 SConscript 对 processors/extension 同样链接 'z'）：
#   ctest: 100% tests passed, 0 tests failed out of 31 → 通过率 31/31 = 100%，用时 17.36s
#   逐二进制 --report_level=detailed 汇总：31 binaries / 316 test cases / 1590 assertions，rc 全 0
# 端到端（与 CI 同源入口）也已实测：conan-verify G0/G1/G2/G3/G4/L2/L4/L5 全 PASS，
#   conan create 日志内 5 条 Apply patch → build() 中 ctest "100% tests passed, 0 tests failed
#   out of 31"（17.37s）→ test_package "test_websocketpp: all checks passed"；
#   包内容仍为 93 个 .hpp + licenses/COPYING（测试源码零泄漏）。
# 下面每条 description 里的 "N assertions / M test cases" 均为 Boost.Test 运行时报告值（非宏站点计数）。

upstream_tests:
  # ── test/utility ──
  - file: test/utility/uri.cpp
    source: websocketpp-0.8.2/test/utility/uri.cpp
    description: "URI 解析（82 assertions / 20 test cases，passed）"
    command: "ctest -R test_uri"
  - file: test/utility/utilities.cpp
    source: websocketpp-0.8.2/test/utility/utilities.cpp
    description: "base64/字符串工具（5 assertions / 5 cases，passed）"
    command: "ctest -R test_utility"
  - file: test/utility/frame.cpp
    source: websocketpp-0.8.2/test/utility/frame.cpp
    description: "RFC6455 帧编解码（101 assertions / 20 cases，passed）"
    command: "ctest -R test_frame"
  - file: test/utility/close.cpp
    source: websocketpp-0.8.2/test/utility/close.cpp
    description: "close 状态码与载荷编解码（33 assertions / 6 cases，passed）"
