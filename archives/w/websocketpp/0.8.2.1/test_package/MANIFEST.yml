# 未纳入的上游 test/ 源文件（逐条实证，即评审要求的 1-e 申报；三者都不是上游 SCons 构建目标）：
excluded_sources:
  - file: test/message_buffer/pool.cpp
    source: websocketpp-0.8.2/test/message_buffer/pool.cpp
    reason: "上游 test/message_buffer/SConscript 不构建它（只构建 message.cpp/alloc.cpp）。设备端实测编译报错指向 0.8.2 之前版本的 API（hybi00 模板参数过多、websocketpp::uri_exception、URI_DEFAULT_PORT 均已不存在），是上游遗留死测试源，不属于上游官方测试面。"
  - file: test/transport/hybi_util.cpp
    source: websocketpp-0.8.2/test/transport/hybi_util.cpp
    reason: "上游 test/transport/SConscript 不构建它。设备端实测 fatal error: '../../src/processors/hybi_util.hpp' file not found —— 引用的 src/ 路径在发布 tarball 中自 0.3.x 起不存在，任何平台都无法编译。"
  - file: test/processors/parser_perf.cpp
    source: websocketpp-0.8.2/test/processors/parser_perf.cpp
    reason: "无 BOOST_TEST_MODULE 的手动性能工具，不在任何 SConscript 中，非单元/集成测试。"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "两层：(1) 纯单元面——URI 解析(wss 默认端口/resource 含 query/分段访问)、base64 RFC6455 往返、UTF-8 校验、close 状态码、user-agent 往返；(2) 真实 WebSocket 会话——同进程 server<config::asio> + client<config::asio_client>，两个 io_context 各跑一个线程，ephemeral 端口，走同步 resolver 的 listen(host,service)、走异步 resolver 的 ws://localhost:PORT/ 连接、start_perpetual/stop_perpetual 的 work guard、set_timer 看门狗、strand+post 的 interrupt、文本帧 echo、正常关闭握手(1000/done)与会话状态收敛。自带 10s 业务超时 + 60s SIGALRM 双保险，不会挂住 CI"
    command: "./test_websocketpp"

# 测试断言总数：上游 ctest 1590（31/31 通过、316 test cases，设备端 2026-08-30 实测）+ test_package 38
assertion_count: 1628
