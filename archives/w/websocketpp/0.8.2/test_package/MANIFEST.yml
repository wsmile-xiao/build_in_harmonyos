# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: websocketpp/0.8.2
homepage: "https://github.com/zaphoyd/websocketpp"

# 上游测试命令 (SCons 构建，见源码树 SConstruct to_test 列表)
upstream_check_command: "scons test"

# conanfile.py build() 方法中是否已集成上游测试
# 否 —— 三条已在设备端实证的原因（原始证据见 reports/notes.md，非推断）：
#   1) SConstruct 是 Python 2 专用：L31/L35/L178 用 os.environ.has_key()，
#      在设备端 Python 3.12.8 下直接 AttributeError；且 scons 本身不存在
#      （`command -v scons` 无输出，设备与 CI 均无）。
#   2) SConstruct L35 要求 BOOST_ROOT 或 BOOST_INCLUDES+BOOST_LIBS 指向
#      boost 的 stage/lib 预编译树；本仓库 boost/1.90.0 由 Conan 提供，
#      只有头文件与 libboost_unit_test_framework.a，没有 stage 树。
#   3) 绕过 SCons 直接编译 test/*.cpp 也连不通：上游用例用的是 Boost.Test
#      旧版模块 API（`init_unit_test_suite(int, char**)`），Boost 1.90 的
#      Boost.Test 已不再提供该入口——静态库链接与 header-only
#      (-include boost/test/included/unit_test.hpp) 两种接法都在该符号上
#      报 undefined symbol，属于上游测试代码与 boost≥1.90 的不兼容，
#      与本平台无关（要跑必须再改测试源码，超出依赖项 PR 范围）。
# 因此上游测试面由 test_package 以消费者视角复现（含一次真实 WebSocket 会话）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清单：11 个目录 / 35 个 .cpp（SConstruct to_test =
# utility,http,logger,random,processors,message_buffer,extension,
# transport/iostream,transport/asio,roles,endpoint,connection,transport）
upstream_tests:
  - file: test/utility/uri.cpp
    source: websocketpp-0.8.2/test/utility/uri.cpp
    description: "URI 解析上游用例；等价断言已在 test.cpp unit_checks() 中复现（wss 默认端口、resource 含 query、host/port 解析）"
    command: "scons test (upstream, not run — 见上方三条实证)"
  - file: test/http/parser.cpp
    source: websocketpp-0.8.2/test/http/parser.cpp
    description: "HTTP 响应/请求解析（握手依赖）；未运行，握手正确性由 test.cpp 的真实 101 响应断言覆盖"
    command: "scons test (upstream, not run)"
  - file: test/utility/close.cpp
    source: websocketpp-0.8.2/test/utility/close.cpp
    description: "close 帧/状态码编解码；未运行，RFC6455 状态码与真实关闭握手由 test.cpp 覆盖"
    command: "scons test (upstream, not run)"
  - file: test/transport/asio/timers.cpp
    source: websocketpp-0.8.2/test/transport/asio/timers.cpp
    description: "asio 定时器状态机；未运行，steady_timer/expiry 路径由 test.cpp 的 set_timer 看门狗与 websocketpp 内建 5s DNS/connect 超时真实执行"
    command: "scons test (upstream, not run)"
  - file: test/transport/integration.cpp
    source: websocketpp-0.8.2/test/transport/integration.cpp
    description: "端到端集成测试（使用已被 Boost 1.90 移除的旧 resolver API）；未运行，等价回路已在 test.cpp 用打过补丁的 asio transport 真跑"
    command: "scons test (upstream, not run)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "两层：(1) 纯单元面——URI 解析(wss 默认端口/resource 含 query/分段访问)、base64 RFC6455 往返、UTF-8 校验、close 状态码、user-agent 往返；(2) 真实 WebSocket 会话——同进程 server<config::asio> + client<config::asio_client>，两个 io_context 各跑一个线程，ephemeral 端口，走同步 resolver 的 listen(host,service)、走异步 resolver 的 ws://localhost:PORT/ 连接、start_perpetual/stop_perpetual 的 work guard、set_timer 看门狗、strand+post 的 interrupt、文本帧 echo、正常关闭握手(1000/done)与会话状态收敛。自带 10s 业务超时 + 60s SIGALRM 双保险，不会挂住 CI"
    command: "./test_websocketpp"

# 测试断言总数 (CHECK 站点数：unit 18 + session 20)
assertion_count: 38
