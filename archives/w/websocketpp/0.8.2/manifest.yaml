software: websocketpp
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.8.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-23"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/.opendesk-tmp/websocketpp-0.8.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
    # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

# 顶层构建系统标识（verify-build G4 检查）
build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ref: E103 - CMake 4.x 需要 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 兼容 cmake_minimum_required(VERSION 2.8.8)"
  - "ref: E112-draft - HarmonyOS clang++ 链接器缺少 libc++/libc++abi，header-only 库可用 -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY 绕过编译器链接测试"
  - "ref: E074 - make -j2 在 HarmonyOS 上失败 (jobserver mkfifo: Operation not permitted)，使用单线程 make"
  - "ref: websocketpp 是 header-only 库，BUILD_TESTS=OFF 时无 make check 目标"
