# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ref: E103 - CMake 4.x 需要 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 兼容 cmake_minimum_required(VERSION 2.8.8)（本配方绕开上游 CMake 直接装头文件，不再需要）"
  - "ref: E074 - make -j2 在 HarmonyOS 上失败 (jobserver mkfifo: Operation not permitted)，使用单线程 make"
  - "websocketpp 是 header-only 库；上游 CMake install 仅复制 *.hpp 头树，配方用 copy() 直接安装等价且免踩 CMake 2.8.8 兼容坑"
  - "websocketpp 的 asio transport 无条件 include <boost/asio.hpp>，配方 requires boost；消费者（autobahn-cpp FindWebsocketpp）按 Websocketpp 包名 find_package"
  - "config/asio.hpp 与 config/asio_client.hpp 会 include <boost/asio/ssl.hpp>，因此本包还必须 requires openssl——本仓库 boost/1.90.0 配方不带 openssl 依赖，缺失时消费者编译报 openssl/conf.h not found"
  - "boost>=1.88(Asio>=1.31) 一次性移除了 io_service、io_service::work、io_context::post/reset、basic_waitable_timer::expires_from_now() 与旧 resolver(query/iterator)、socket_base::max_connections；websocketpp 0.8.2 五个面全中，详见 0001 补丁与知识草稿"
  - "上游测试无法运行有三条实证：SConstruct 是 Python2-only(os.environ.has_key) 且设备/CI 无 scons；boost 包无 stage/lib 预编译树；上游用例用 Boost.Test 旧入口 init_unit_test_suite，Boost 1.90 只提供 init_unit_test（原始日志 reports/upstream-test-probe.log）"
  - "历史归档 notes 记录 2026-06-23 曾以 file:// 本地 tarball 构建并标 published，但制品仓无配方、git 历史无提交，属伪发布；本次以官方 URL + sha256 重新适配"
  - "工具坑：conan-verify G2 会用残留的 conandata.yml.ghfast-bak 覆盖 conandata.yml（崩溃恢复分支），若归档里留着该 .bak，刚写好的 patches: 段会被静默回退成旧内容，导致编译的是未打补丁源码；且 G2 每次跑完都会重新留下该 .bak。对策见 notes.md"
  - "工具坑：refresh-patch --auto 只把补丁写进 patches/ 与 manifest.yaml，不会更新 conandata.yml 的 patches: 段，需手工登记 patch_file/description/sha256，否则 apply_conandata_patches 应用 0 个补丁"

