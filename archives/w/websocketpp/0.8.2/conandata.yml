# conandata.yml — websocketpp 0.8.2
# sha256 verified on HarmonyOS device (curl 200, gzip -t OK)

sources:
  url: "https://github.com/zaphoyd/websocketpp/archive/refs/tags/0.8.2.tar.gz"
  sha256: "6ce889d85ecdc2d8fa07408d6787e7352510750daa66b5ad44aacb47bea76755"

patches:
  - patch_file: "patches/0001-websocketpp-common-asio.hpp.patch"
    patch_description: "common/asio.hpp: add a Boost.Asio >= 1.31 (Boost >= 1.88) compatibility layer - io_service/io_context alias, work -> executor_work_guard, is_expired() replacing the removed expires_from_now() getter, free post()/restart() wrappers, and resolver wrappers (query/iterator -> results_type)"
    patch_type: "portability"
    sha256: "290579891a8c00d141515812d8d287f2fe23c5dcfb2a4c27506165ee7d90e81f"
  - patch_file: "patches/0002-websocketpp-transport-asio-connection.hpp.patch"
    patch_description: "transport/asio/connection.hpp: route timer-expiry checks through lib::asio::is_expired() and io_service posting through lib::asio::post_handler()"
    patch_type: "portability"
    sha256: "022f9de81560e3ee18be3b42741ab8d5c40be7449baf8c56c42fe28b2c183538"
  - patch_file: "patches/0003-websocketpp-transport-asio-endpoint.hpp.patch"
    patch_description: "transport/asio/endpoint.hpp: build the perpetual work guard through make_work_guard(), use socket_base::max_listen_connections, wrap reset() -> restart(), and use resolver results in listen()/async_resolve()/handle_resolve()"
    patch_type: "portability"
    sha256: "5bc89dd35ff6691af509c2d496d8d39eb7caa1339d1ea89c9db6e55f8dc9c411"
