sources:
  url: "https://deb.debian.org/debian/pool/main/w/wreport/wreport_3.36.orig.tar.gz"
  sha256: "fd9ba6f58eb92a06acf9e6950723fb7f48b1fe59fe3d99c5cfc71ac59e886ae9"

patches:
  - patch_file: "patches/0001-python-vartable.cc.patch"
    patch_description: "Preserve Python KeyError for missing descriptor across shared objects"
    patch_type: "portability"
  - patch_file: "patches/0002-wreport-utils-subprocess.cc.patch"
    patch_description: "Use musl-compatible stderr expression"
    patch_type: "portability"
  - patch_file: "patches/0003-wreport-utils-tests.cc.patch"
    patch_description: "Replace GNU exp10 extension with standard C++ pow"
    patch_type: "portability"
  - patch_file: "patches/0004-meson.build.patch"
    patch_description: "Find Conan Lua 5.4 pkg-config module"
    patch_type: "portability"
  - patch_file: "patches/0005-python-meson.build.patch"
    patch_description: "Link OHOS Python extension and install it under package prefix"
    patch_type: "portability"
  - patch_file: "patches/0006-python-utils-core.h.patch"
    patch_description: "Include complete C++ string declaration"
    patch_type: "portability"
  - patch_file: "patches/0007-tables-meson.build.patch"
    patch_description: "Use discovered Python interpreter for table check"
    patch_type: "portability"
  - patch_file: "patches/0008-wreport-var.h.patch"
    patch_description: "Initialize full pointer storage in Var union on AArch64"
    patch_type: "portability"
  - patch_file: "patches/0009-meson-python-interpreter.patch"
    patch_description: "Allow Conan to bind the Python interpreter used for extensions and tests"
    patch_type: "portability"
