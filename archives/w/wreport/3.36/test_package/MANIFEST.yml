package: wreport/3.36
homepage: "https://github.com/ARPA-SIMC/wreport"

upstream_check_command: "meson test --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson test --print-errorlogs"

upstream_tests:
  - file: "wreport/utils/tests-main.cc"
    source: "wreport-3.36/wreport/utils/tests-main.cc"
    description: "Registered native C++ test suite"
    command: "./wreport/test-wreport"
  - file: "python/test-var.py"
    source: "wreport-3.36/python/test-var.py"
    description: "Python unittest discovery suite"
    command: "python3 -m unittest discover -s python"

test_package_tests:
  - file: "test.cpp"
    description: "BUFR vartable lookup, string assignment and Var copying"
    command: "./test_wreport"

assertion_count: 4
