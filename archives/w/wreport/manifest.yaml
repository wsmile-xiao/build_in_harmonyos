software: wreport
display: "wreport"
description: "Weather report library for BUFR and CREX data"
category: library
homepage: "https://github.com/ARPA-SIMC/wreport"
license: GPL-2.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Use Conan Lua 5.4 pkg-config metadata and a writable TMPDIR for upstream tests."
    - "Initialize the pointer member of Var's union before string copying."
    - "Install the Python extension under the package prefix, not the system interpreter."
  common_dependencies:
    - lua

versions:
  "3.36":
    status: built
    build_date: 2026-09-27
