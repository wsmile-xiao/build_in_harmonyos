package: words-en/2.1
homepage: "https://ftp.gnu.org/gnu/aspell/dict/0index.html"

upstream_check_command: "none (the Aspell dictionary release has no test target)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests:
  counting_basis: "The release contains dictionary data and no upstream test program or target"
  total: 0

test_package_tests:
  - file: test_words_en.py
    scenario: normal
    description: "Read the installed word list and verify exact content, count, and American spellings"
    command: "python test_words_en.py (Conan run environment)"
  - file: test_words_en.py
    scenario: fault-injection
    description: "Reject a missing word-list path"
    command: "python test_words_en.py --expect-missing <missing-path>"
  - file: test_words_en.py
    scenario: harmonyos-device
    description: "On HarmonyOS 6.0/aarch64, verify kernel identity and read the installed package data"
    command: "python3 test_words_en.py --harmony <path-to-words-en>"

assertion_count: 11
