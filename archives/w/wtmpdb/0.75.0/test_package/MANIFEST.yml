package: wtmpdb/0.75.0
homepage: "https://github.com/thkukuk/wtmpdb"

upstream_check_command: "meson test (6 registered tests executed in build())"
upstream_test_in_build: true
upstream_test_command: "meson test (tst-dlopen, tst-y2038-64bit-time_t, tst-logwtmpdb, tst-login-logout, tst-get_id, tst-varlink)"

upstream_tests:
  # Per-test results bound to the W3 run on HarmonyOS PC; the meson test summary
  # for this build printed "Ok: 4 / Fail: 0 / Skipped: 2" (same ledger as
  # ../manifest.yaml upstream_tests.notes and notes.md).
  - name: tst-dlopen
    command: "meson test tst-dlopen"
    expected: "dlopen() of pam_wtmpdb.so succeeds"
    result: 'ok - stdout: dlopen of ./pam_wtmpdb.so succeeded'
  - name: tst-y2038-64bit-time_t
    command: "meson test tst-y2038-64bit-time_t"
    expected: "pass"
    result: 'ok'
  - name: tst-logwtmpdb
    command: "meson test tst-logwtmpdb"
    expected: "pass"
    result: 'ok'
  - name: tst-login-logout
    command: "meson test tst-login-logout"
    expected: "pass"
    result: 'ok'
  - name: tst-get_id
    command: "meson test tst-get_id"
    expected: "pass only when the default db path /var/lib/wtmpdb is writable (root)"
    result: 'skip (exit 77, upstream self-guard) - SQLITE_CANTOPEN (-14) as non-root on HarmonyOS PC, /var/lib/wtmpdb not creatable'
  - name: tst-varlink
    command: "meson test tst-varlink"
    expected: "pass only as root with the wtmpdbd varlink service reachable"
    result: 'skip (exit 77, upstream self-guard) - getuid() != 0, and wtmpdbd is disabled here (no systemd on OHOS)'

upstream_test_ledger:
  registered: 6
  executed: 6
  ok: 4
  skipped_exit_77: 2
  failed: 0

test_package_tests:
  - file: test.c
    description: "Links libwtmpdb and exercises exported public API against a temp sqlite db: login id, get_id, read_all field-exact row, logout, no-open-session after logout, logout timestamp visible"
    command: "test_wtmpdb"

assertion_count: 6
