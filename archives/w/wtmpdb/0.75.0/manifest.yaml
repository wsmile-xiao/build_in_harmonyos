patches_applied: []

upstream_tests:
  command: "meson test (executed in build())"
  test_count: 6
  notes: "6 registered: 4 Ok + 2 upstream-self-skipped (exit 77): tst-get_id needs writable /var/lib/wtmpdb (non-root), tst-varlink needs root + wtmpdbd daemon (disabled on OHOS, no systemd). tst-dlopen proves pam_wtmpdb.so builds AND dlopens on OHOS."

test_package:
  assertion_count: 6
  description: "Consumer links libwtmpdb and exercises version-script-exported API (wtmpdb_login/logout/read_all/get_id) against a temp sqlite db on HMDFS with behavioral assertions."

knowledge_gained:
  - "OHOS sysroot/harmonybrew have no libpam; the published linux-pam/1.7.2 package provides libpam.so + security/*.h, so PAM-side packages are rescued as a dependency, not stubbed out"
  - "meson find_library() ignores pkg-config injection: LIBRARY_PATH/CPATH/LD_LIBRARY_PATH must be prepended via Environment(scope=build) to make conan deps visible to configure probes and meson-test runtime dlopen"
  - "conan's meson prefix=/ + DESTDIR install conflicts with upstream distro rootprefix checks; explicit -Dsplit-usr=true makes rootprefix='/' pass and lands the PAM module under package_folder/lib/security via DESTDIR"
  - "wtmpdb_get_id return semantics on OHOS probe: -2 = no open session (found via err text), -14 (SQLITE_CANTOPEN) = db path not openable (non-root /var) — upstream tests use these to self-skip with exit 77"
