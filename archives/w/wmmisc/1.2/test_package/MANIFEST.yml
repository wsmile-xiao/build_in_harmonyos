# test_package/MANIFEST.yml
# 上游官方测试声明文件
# wmmisc 1.2 上游测试：无。Makefile.am 只声明 bin_PROGRAMS/dist_man_MANS/
# dist_desktop_DATA，无 check 目标、无 tests/ 目录、无 TESTS/check_PROGRAMS。
# `make check`（automake 提供的 canonical 空目标）实测输出
# "Nothing to be done for 'check'" 且 exit 0 —— 上游不存在自动化测试入口。

package: wmmisc/1.2
homepage: "https://www.dockapps.net/wmmisc"

# 上游测试命令 (make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的测试程序 (上游无自动化测试：无 tests/ 目录、无 check 程序)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制; 均为本次适配
# 新增的 HarmonyOS 消费者用例)
test_package_tests:
  - file: test.sh
    description: "HarmonyOS 消费者用例 1 — 调用已安装 wmmisc 二进制执行 -h，断言 Usage 输出与上游 exit(1) 怪癖"
    command: "bash test.sh"
  - file: test.sh
    description: "HarmonyOS 消费者用例 2 — 依赖闭包落盘沙箱后原生执行，断言 libdockapp/X11 全链路加载重定位成功且无 DISPLAY 时优雅失败 (can't open display)"
    command: "bash test.sh"

# 上游测试断言总数 (上游 0 + test_package 消费者断言 2)
assertion_count: 2
