compatibility:
  issues:
    - "运行期需 MAGIC 指向 libmagic 制品内 magic.mgc；已由 package_info() 写入 runenv/buildenv"
    - "make check 需 LOG_COMPILER=bash（OHOS 无 /bin/bash，14 条测试脚本 shebang 为 #!/bin/bash）"
    - "libmagic/5.48 制品仅有静态 libmagic.a，与 weborf 内部 buffer_init 撞名，需 0004 改名"
    - "上游 GitHub 无 1.6 tag，源码取 Ubuntu 官方档案池 .orig 包（sha256 双源核对一致）"

knowledge_refs:
  - E007
  - E011
  - E160
  - E037
  - E049
  - E074
  - E265
  - E193

knowledge_gained:
  - "autotools TESTS shell 套件在 OHOS 真跑：注入点必须是 LOG_COMPILER 而非 TESTS_ENVIRONMENT"
  - "静态 libmagic 缺 magic.mgc 时 weborf 进程存活但不监听（四臂 none/magic/ssl/both 对照实测）"
  - "libmagic.a 导出 buffer_init 与程序内部同名 ⇒ lld duplicate symbol，llvm-nm 求交集定位"
  - "2024-07-27 世代的 config.sub 已认 aarch64-unknown-linux-ohos，只有 config.guess 需补"
  - "OHOS 无 /bin/bash：14 条测试脚本 shebang 为 #!/bin/bash 时 automake 报 exit 126"

upstream_test_modifications:
  - file: testsuite/cgi
    reason: "OHOS 无 /usr/bin/python3（E037/E049）"
    change: "--cgi .py,/usr/bin/python3 -> --cgi .py,${WEBORF_CGI_PYTHON:-/usr/bin/python3}"
    result: "该用例由必然 500 变为 PASS；默认值与上游逐字相同，断言条数与逻辑未改"
