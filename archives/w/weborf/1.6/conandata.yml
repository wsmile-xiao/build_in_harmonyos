sources:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/w/weborf/weborf_1.6.orig.tar.gz"
  sha256: "cad1e4067ddd2bfe4ec0c840b9e5d56299a11a4f6f89615497cee192b1bab822"

patches:
  - patch_file: "patches/0001-config-guess-harmonyos.patch"
    patch_description: "config.guess(2024-07-27) 无 HarmonyOS 分支导致 cannot guess build type：在编译 dummy C 兜底前插入 uname -s=HarmonyOS -> <arch>-unknown-linux-ohos 识别"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-cgi-rindex-strrchr.patch"
    patch_description: "OHOS musl 无 BSD 遗留函数 rindex（ld.lld: undefined symbol: rindex），cgi_child_chdir() 改用等价的 strrchr"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-testsuite-cgi-python-interpreter.patch"
    patch_description: "testsuite/cgi 把 CGI 解释器绝对路径硬编码为 /usr/bin/python3（OHOS 无此路径）：改为 ${WEBORF_CGI_PYTHON:-/usr/bin/python3}，默认值保持上游不变，仅允许构建期注入；断言逻辑与条数一字未改"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0004-rename-buffer-init-libmagic-clash.patch"
    patch_description: "libmagic/5.48 制品只有静态 libmagic.a，其导出的全局符号 buffer_init 与 weborf 内部 buffered_reader 的 buffer_init 撞名，lld 报 duplicate symbol 拒链：将 weborf 侧该函数改名为 weborf_buffer_init（定义 1 + 声明 1 + 调用 2，共 4 处），不改任何行为"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0005-testsuite-tar-capability-guard.patch"
    patch_description: "testsuite/tar 是 15 条用例里唯一依赖外部 tar 二进制的一条（curl --tar 流 | tar -z --list），而 weborf 的 --tar 处理本身也是 execlp(\"tar\",\"tar\",\"-cz\",dir)：在用例开头按同一条管道探测运行时的 tar 能力，不满足则按 automake 惯例 exit 77 报 SKIP 并打印原因（真机 tar 可用 ⇒ 15/15 全过不受影响），不改任何断言、不缩小分母"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0006-testsuite-tar-curl-follow-to-location.patch"
    patch_description: "testsuite/tar 用非标准选项 curl --follow（上游写法）。worker 侧 /usr/bin/curl 8.8.0-DEV 回 'option --follow: is unknown'，空响应喂给 tar 得到 'zcat: inflate EOF' 与 'tar: had errors'；设备侧 curl 8.22 恰好接受该别名 ⇒ 同一用例两端结果相反（本条即探针取到的首现场）。改成语义等价的标准写法 curl -L（follow redirect，正是该用例注释 it should redirect and work 的意图），断言与条数一字未改"
    patch_type: "portability"
    strip: 1
