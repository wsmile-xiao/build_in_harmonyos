# test_package/MANIFEST.yml — weborf 1.6
# CI 脚本 (build_and_test.sh L0e) 要求此文件存在
package: weborf/1.6
homepage: "https://github.com/vsalvino/weborf"

# 上游测试命令：Makefile.am 的 TESTS 段注册 15 条 shell 测试脚本，
# 全部以 curl 对 127.0.0.1 的 HTTP 往返做断言（41 处 curl、13 个文件命中 localhost）。
upstream_check_command: "make check"

# 配方 build() 已真实集成上游测试：
#   if not cross_building(self):
#       autotools.make(target="check", args=["-j1", "LOG_COMPILER=bash"])
# 未使用 ignore_errors；本机为 HarmonyOS PC 原生 aarch64 构建（cross_building=False）
# 故分支命中。必须带 LOG_COMPILER=bash：14 条脚本 shebang 是 #!/bin/bash，
# 而 OHOS 无 /bin/bash，默认驱动报 exit 126；TESTS_ENVIRONMENT 不是正确注入点
# （实测会被展开到整个驱动之前，变成 bash /bin/sh test-driver ⇒ cannot execute binary file）。
upstream_test_in_build: true
upstream_test_command: "make check -j1 LOG_COMPILER=bash"

# 上游注册并真实执行的 15 条（Makefile.am TESTS 逐条对应，含 helper functions.sh）
upstream_tests:
  - version_and_help
  - site1http
  - site1https
  - ip_listener
  - etag
  - index_file
  - tar
  - no_propfind
  - propfind
  - range
  - cgi
  - cachedir
  - site1mimetype
  - vhost
  - functions.sh

# test_package 自带的消费者测试（以使用者身份真实运行被测二进制并断言行为）
test_package_tests:
  - file: weborf_consumer_check.py
    description: "A1-A4 真实执行 bin/weborf 的 --version/--help 并断言退出码与输出契约"
    command: "weborf --version / --help"
  - file: weborf_consumer_check.py
    description: "A5-A6 临时 docroot + 空闲端口真实起 HTTP 服务，GET /index.txt 断言 200 且响应体与语料逐字节一致"
    command: "weborf -b <docroot> -p <free-port>"
  - file: weborf_consumer_check.py
    description: "A7 GET 缺失文件断言返回 404（防『起了服务但任何请求都成功』的假通过）"
    command: "GET /no-such-file-hw2"

# 消费者脚本实测断言条数 A1-A7（test() 经 self.run(..., env="conanrun") 真实执行，失败即非零退出）
assertion_count: 7
