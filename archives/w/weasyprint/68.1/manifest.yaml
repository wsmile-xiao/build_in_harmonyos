software: weasyprint
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/68.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "68.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/source/w/weasyprint/weasyprint-68.1.tar.gz"

  # 源码校验和
  sha256: "7195c741867a26f16db93bf3d5e275c3460781725bbaf202762535bcd8399444"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | pip
  system: pip

  # 配置选项列表
  configure_options: ["--prefix=/storage/Users/currentUser/usr/local"]

  # 编译依赖列表（格式: name/version）
  dependencies:
    - cffi/1.17.1
    - pillow/12.2.0
    - pydyf/0.12.1
    - tinycss2/1.5.1
    - cssselect2/0.9.0
    - tinyhtml5/2.1.0
    - pyphen/0.17.2
    - fonttools/4.59.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "weasyprint 是纯 Python pip 包（flit 构建），使用 pip install 安装"
  - "pip 包需要将所有 Python .so C 扩展一起打包（cffi、Pillow、brotli 等）"
  - "HMDFS 上 Python .so C 扩展模块无法从 /storage/Users/currentUser/ 路径下通过 dlopen() 加载（Permission denied）"
  - "cffi 需要 ffi.h 头文件（来自 /data/service/hnp/libffi.org/libffi_3.4.4/include/）和 libffi.so（来自 /data/service/hnp/libffi.org/libffi_3.4.4/lib/）"
  - "HMDFS 上 sign-elf 会将文件权限改为 770（rwxrwx---），导致 'others' 无法读取 .so 文件"
  - "HMDFS 上 os.chmod() 和 shell chmod 命令均无效，文件权限由 HMDFS 管理"
  - "系统 Python site-packages（/data/service/hnp/）中的 .so 文件可以正常加载（权限 755）"
