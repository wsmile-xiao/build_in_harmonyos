# test_package/MANIFEST.yml - wordplay 9.0.1
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）。详见 docs/TEST_QUALITY_SPEC.md
#
# 计数口径（唯一口径，贯穿 MANIFEST / notes.md / 测试日志 / PR 两张表）：
#   按「独立检查项数量」计数 —— 每个检查项可单独判定成败、单独打印 ok/FAIL，
#   同一检查项在 build() 与 test_package 各执行一次也只计 1 项。
#   适配后合计 29 项 = 功能补全 20 项（F1-F20）+ 鸿蒙特有 9 项（A1-A9）。

package: wordplay/9.0.1
homepage: "https://github.com/mendelmunkis/wordplay"

# ── 上游测试套件存在性（经审计 wordplay_9.0.1.orig.tar.gz 确认）────────
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

upstream_test_audit:
  source_tarball: "9.0.1.tar.gz (https://github.com/mendelmunkis/wordplay/archive/refs/tags/9.0.1.tar.gz)"
  source_sha256: "a4bb8615194898054ddaa974ce3851166556ba8586f241d4c523747efc3c60be"
  upstream_tag_commit: "29ff967a92222b91e38e04b1c27a02080d51f45b (tag 9.0.1；与 Debian wordplay_9.0.1.orig.tar.gz 字节一致)"
  build_system: "手写 makefile（单目标 wordplay: wordplay.c 一条链接命令；无 configure / 无 install / 无 test）"
  scanned_for:
    - "tests/ 或 test/ 目录内的可执行测试"
    - "makefile 中的 check / test 目标"
    - "gtest / criterion / check / CUnit 等测试框架绑定"
    - "*_test.c / test_*.c 命名的测试源文件"
    - "CI 配置（.github/workflows、.travis.yml 等）"
  scan_result: >-
    tarball 共 7 个文件：AUTHORS、CHANGELOG、LICENSE、makefile、readme、
    wordplay.c（921 行）、words721.txt（24867 行词表）。无任何测试目录、
    测试目标、测试框架绑定或 CI 配置。
  reason: >-
    wordplay 9.0.1 上游无任何测试框架与测试目标，按 no_tests 处理；
    适配后由 test_package 补全 29 个独立检查项。

# 上游测试命令（无测试套件，故不适用）
upstream_check_command: ""

# conanfile.py build() 中未集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# ── test_package 自带的功能测试（上游无测试，适配后补全）──────────
# 执行位置: test_package/test_wordplay.sh（can_run() 为真时在 HarmonyOS 上实跑）
# 断言依据：wordplay.c 9.0.1 源码阅读（usage/exit(-1)、-s 无头模式逐行输出
# anagram、-f 支持路径与 stdin、-L 未实现语言 stderr 提示后回退英语）。
# 真机首跑后如输出格式与断言有出入，需在本文件同 commit 内回填收紧。
test_package_tests:
  - file: test_wordplay.sh
    description: >-
      功能补全 20 项（F1-F20）：F1 无参数 → 非零退出 + stderr Usage；
      F2 banner 含 "Wordplay Version 9"；F3 usage 文档含 "-f -"；
      F4 sotp 至少找出 stop/pots/tops/opts/post/spot 之一（词表全大写，断言忽略大小写）；F5 输出每行
      去空格、折叠大小写后与输入字母多重集合一致（anagram 正确性）；F6 -i 被接受且输出仍为
      合法 anagram（真机实测 -i 对该输入无可观察输出差异，silent/header 模式 diff 逐字节
      相同，故断言为选项接受性而非内容变化）；F7 -l 候选词列表含 stop；F8 -lx 只列候选不生成
      （rc=0）；F9 -w stop 指定起始词；F10 -n4 -m4 候选长度边界；F11 -d1
      输出无空格（单词 anagram）；F12 同参数两次输出逐字节相同；F13
      词典缺失 → "Error opening word file." 且非零退出；F14 -f - 从
      stdin 读词典；F15 -s 无 "String to anagram" 头；F16 默认模式有头；
      F17 -a rc=0；F18 -v rc=0；F19 -L zz stderr 提示 not been implemented
      且 rc=0 回退英语；F20 readme 建议命令 wordplay trymenow 成功且输出
      非空。
    command: "sh test_wordplay.sh <package-dir>"
    assertion_count: 20

# 鸿蒙特有测试（rule12: N >= 1，本包 N = 9）
# 上游是纯 C + ICU 依赖，无需源码补丁，适配点全部落在工具链 / ABI /
# 打包层，A1-A9 逐项锁定。执行位置: test_package/ohos_abi_check.py，
# 纯 Python 解析 ELF，不依赖 readelf，因此交叉编译的开发机与鸿蒙
# worker 上都能实跑。
harmonyos_specific_tests:
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A1: 产物为 ELF64 小端且 e_machine == EM_AARCH64(183)，
      即 HarmonyOS PC arm64 目标；证明配方注入的 Conan 编译器生效。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/wordplay --words <pkg>/res/words721.txt"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A2: PT_INTERP == /lib/ld-musl-aarch64.so.1（鸿蒙 musl
      动态加载器）；glibc sysroot 产物会是
      /lib/ld-linux-aarch64.so.1，在鸿蒙上无法加载。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/wordplay --words <pkg>/res/words721.txt"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A3: 存在 .note.ohos.ident 且 owner == "OHOS"。该段由
      OHOS clang/lld 生成，通用 Linux 工具链不会产出。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/wordplay --words <pkg>/res/words721.txt"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A4: DT_NEEDED 只含未版本化 musl/OHOS soname（libc.so 与
      OHOS 系统 C++ 运行时 libc++_shared.so——ICU 是 C++ 库，此为 OHOS
      上 C++ 程序标准形态，与 HNP 自带 cmake/ninja 一致），且不含 glibc
      风格版本化 soname（libc.so.6 / libm.so.6）与任何宿主库。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/wordplay --words <pkg>/res/words721.txt"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A5: ICU 静态并入验证 —— icu4c/78 是纯静态 OHOS 包，
      DT_NEEDED 不得出现 libicuio/libicui18n/libicuuc/libicudata，
      且 u_strlen/u_printf 等 ICU 符号不得留在 .dynsym 的 UND 中
      （ICU 代码与数据已折进可执行文件）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/wordplay --words <pkg>/res/words721.txt"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A6: 打包的 res/words721.txt 与上游 tarball 内文件
      sha256 一致（eb544122...9fb，24867 词），运行时词表是上游数据
      而非重建/截断副本。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/wordplay --words <pkg>/res/words721.txt"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A7: 无 DT_RPATH / DT_RUNPATH。构建机与 conan 缓存路径
      在鸿蒙设备上不存在，泄漏即运行时加载失败。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/wordplay --words <pkg>/res/words721.txt"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A8: PIE(ET_DYN + DF_1_PIE) + PT_GNU_RELRO + 不可执行
      PT_GNU_STACK(NX) + BIND_NOW 四项同时成立，即 OHOS HNP 对可执行
      文件的加固基线（CI L4 静态安全扫描检查同一组属性）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/wordplay --words <pkg>/res/words721.txt"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A9: 无 .gnu.version_r 的 GLIBC_* 版本需求，且无 GNU
      .note.ABI-tag。musl/OHOS 产物两者皆无，glibc 链接产物两者皆有。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/wordplay --words <pkg>/res/words721.txt"
    assertion_count: 1

# 未断言 .codesign 的有无：按 knowledge/operations/harmonyos-specifics.md
# (E077)，配方先 llvm-objcopy --remove-section .codesign 再由
# binary-sign-tool 重新签名，因此该段在具备签名能力的鸿蒙 worker 上存在、
# 在交叉编译的开发机上不存在；任一方向的断言都依赖宿主，不可复现，故不纳入。

# 测试断言总数（独立检查项：功能补全 20 + 鸿蒙特有 9）
assertion_count: 29
test_package_test_count: 20
harmonyos_specific_test_count: 9
count_method: "independent_check_items"
