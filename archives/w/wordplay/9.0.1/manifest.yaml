  configure_options: []
  dependencies:
    - "icu4c/78 (static, data embedded in libicudata.a)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "wordplay 9.0.1 is a single-file C program (wordplay.c, 921 lines) with a 4-line handwritten makefile; no configure, no install target, no test suite."
  - "The makefile hardcodes the link line ending in -licuio -licui18n -licuuc -licudata; ICU is C++, so a C-compiler-driven link needs -lc++ appended AFTER the ICU static libs - impossible to inject via make variables, hence the recipe drives the equivalent command itself."
  - "words721.txt (sha256 eb5441226e0474901b3970037b6e209d5846276dae280560d008522eb59a19fb) is a 24867-entry word list despite the name; wordplay.c opens it via the relative path DEFAULT_WORD_FILE, so it must ship with the package (packaged under res/)."
  - "Upstream has no test framework at all; consumer validation is entirely provided by test_package (20 functional cases + 9 HarmonyOS-specific artifact checks)."

verification:
  local_cross: "PASS: conan create --profile:host fathom-local --profile:build default (Windows host, OHOS clang 15, icu4c/78 binary from ohpcd); ohos_abi_check A1-A9 9/9 PASS"
  consumer_test: "PASS: test_package/test_wordplay.sh 20/20 on HarmonyOS PC shadow CI (run codex-9.0.1-wordplay-9.0.1-20260929-conan-20260929-104510-53014, exit 0)"
