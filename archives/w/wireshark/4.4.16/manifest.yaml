software: wireshark
version: "4.4.16"
status: failed
build_system: cmake
created_at: 2026-05-25

# ============================================================
# 源码信息
# ============================================================
source_url: https://www.wireshark.org/download/src/wireshark-4.4.16.tar.xz
source_url_local: file:///storage/Users/currentUser/tmp/sources/wireshark-4.4.16.tar.xz
sha256: 0bda0e34a4c5da72ea9009134d733783d08189c07462198e53a4f533fd1201fd
tar_format: tar.xz

# ============================================================
# 编译配置
# ============================================================
configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_C_COMPILER=clang"
  - "-DCMAKE_CXX_COMPILER=clang++"

# CMake 可选构建选项
cmake_minimal_options:
  - "-DBUILD_wireshark=OFF"
  - "-DBUILD_tshark=ON"
  - "-DBUILD_editcap=ON"
  - "-DBUILD_capinfos=ON"
cmake_full_options:
  - "-DBUILD_wireshark=ON"
  - "-DBUILD_tshark=ON"

# ============================================================
# 依赖关系
# ============================================================
dependencies:
  required:
    - glib/2.x (>= 2.50.0)
    - libpcap/x.x
    - libgcrypt/x.x
  build:
    - cmake/3.5+
    - python3/x.x
    - flex/x.x
  optional:
    - qt/5.9+
    - zlib/x.x
    - lz4/x.x
    - zstd/x.x

# ============================================================
# 下载问题
# ============================================================
download_issues:
  - problem: SSL 证书验证失败
    solution: 使用 curl -k 跳过证书验证手动下载
    date: 2026-05-25

# ============================================================
# 补丁与知识
# ============================================================
patches_applied: []

knowledge_gained:
  - Wireshark 4.4.x 要求 GLib >= 2.50.0
  - 可独立编译 TShark（命令行版本），无需 Qt 依赖
  - 官方网站下载存在 SSL 证书问题，建议使用镜像或 curl -k
  - 构建系统为 CMake，而非 autotools

missing_dependencies:
  - name: glib
    version_required: ">= 2.50.0"
    status: not_precompiled
    priority: P0
  - name: libpcap
    version_required: any
    status: not_precompiled
    priority: P1
  - name: libgcrypt
    version_required: any
    status: not_precompiled
    priority: P1