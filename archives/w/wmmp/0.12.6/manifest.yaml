# 版本级 manifest
# 文件位置: archives/w/wmmp/0.12.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.12.6"
software: "wmmp"
status: built
build_date: "2026-09-27"
build_system: "cmake"

source:
  url: "https://github.com/yogsothoth/wmmp/archive/refs/tags/0.12.6.tar.gz"
  sha256: "00759188b578a17de6d01e5f4338a291abcef4e21c5e6c548279a37e0c486bae"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_TOOLCHAIN_FILE=generators/conan_toolchain.cmake"
    - "-DCMAKE_MODULE_PATH=<build>/conan_cmake_modules (配方注入 FindX11)"
  dependencies:
    - libx11/6.4.0
    - libxext/6.4.0
    - libxpm/3.5.17
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake >=4 拒绝 cmake_minimum_required(2.8)：策略下限必须走 cmake.configure(variables=...) 命令行 -D，工具链文件在 project() 才被包含、来不及"
  - "上游 find_package(X11) 依赖 CMake 内置探测，Conan 交叉编译需在配方内生成 FindX11.cmake 映射到 libx11/libxext/libxpm"
  - "X11/X.h 等基础头属于 xorgproto，聚合 include 目录必须遍历全依赖图，不能只取直接依赖"
  - "HMDFS 对外来 uid 解压的 conan 缓存 .so 访问不稳定（E524 同族）：make stat / lld open 间歇性 EACCES；把链接库实体复制进 build_folder（R49 可靠位置）规避"
  - "OHOS 设备执行包内 ELF 前需 binary-sign-tool 自签名（.codesign 段），test_package 对 WMmp 副本签名后运行"
