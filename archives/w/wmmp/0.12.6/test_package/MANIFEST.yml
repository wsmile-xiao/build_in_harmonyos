software: wmmp
version: "0.12.6"
test_type: explicit
test_executables:
  - wmmp_consumer
test_cases: 2
assertions:
  wmmp_consumer: 2
notes: >
  上游 wmmp 0.12.6 无任何自动化测试（CMakeLists 无 enable_testing/add_test，
  无 tests/ 目录），本 test_package 为适配新增的鸿蒙消费者用例：通过真实
  命令行入口 "-v"（版本输出）与 "-h"（Usage 输出）执行被测 WMmp 二进制，
  验证 OHOS ELF 动态链接（libX11/libXext/libXpm）与运行可行性。
