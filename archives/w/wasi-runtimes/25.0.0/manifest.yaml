knowledge_gained:
  - "wasi-runtimes 25.0.0 maps to WebAssembly/wasi-sdk release wasi-sdk-25 runtime assets."
  - "The full wasi-sdk source build requires LLVM and wasi-libc submodules and is intentionally not rebuilt in this package."
