package: wasi-runtimes/25.0.0
homepage: "https://github.com/WebAssembly/wasi-sdk"

upstream_check_command: "wasi-sdk-25 tests/CMakeLists.txt + tests/testcase.sh (requires a WASI-capable clang/LLVM toolchain and a runwasi runner)"
upstream_test_in_build: false
upstream_test_command: "not run in OHOS package CI; this recipe packages official wasi-sdk runtime assets and does not build the full WASI clang toolchain"

upstream_tests:
  - path: wasi-sdk/tests/
    type: upstream compiler/sysroot integration tests
    details: "wasi-sdk-25 ships tests/compile-only and tests/general; these build and run only through the full SDK test pipeline with a WASI toolchain and runwasi."
  - path: wasi-libc test sources
    type: upstream libc/WASI behavior tests reached through the full SDK build
  - path: compiler-rt builtins validation
    type: upstream LLVM compiler-rt runtime validation

upstream_test_notes:
  - "3 test areas (wasi-sdk tests, wasi-libc, compiler-rt) are not folded into case counts."
  - "The full WASI SDK test pipeline is recorded as unexecuted, not excluded: it cannot run on OHOS because WASI clang/LLVM and runwasi are unavailable."

excluded_upstream_tests:
  - command: "full wasi-sdk test pipeline"
    reason: "The upstream tests require a complete WASI-capable clang/LLVM toolchain and wasi-libc/compiler-rt source build. This PR intentionally packages the official wasi-sdk-25 runtime assets only: sysroot headers/libraries and compiler-rt builtins. There is no OHOS-native runtime API to execute inside this asset package; test_package therefore validates asset presence, non-empty content, representative header markers, and static archive magic."

coverage:
  enabled: false
  reason: "This package contains official WASI runtime assets and no locally compiled OHOS code to instrument for coverage."

test_package_tests:
  - file: check_wasi_assets.py
    description: "Parses the generated .wasi-assets.json manifest and verifies every packaged file from the official wasi-sysroot-25.0 and libclang_rt.builtins-wasm32-wasi-25.0 archives exists with the expected size (6552 files)."
    command: "python3 check_wasi_assets.py <package_folder>"
  - file: check_wasi_assets.py
    description: "Verifies wasm32-wasi stdio.h is packaged, non-empty, and contains the FILE marker."
    command: "python3 check_wasi_assets.py <package_folder>"
  - file: check_wasi_assets.py
    description: "Verifies wasm32-wasip2 stdlib.h is packaged, non-empty, and contains malloc declarations."
    command: "python3 check_wasi_assets.py <package_folder>"
  - file: check_wasi_assets.py
    description: "Verifies wasm32-wasi libc.a is packaged and has ar archive magic."
    command: "python3 check_wasi_assets.py <package_folder>"
  - file: check_wasi_assets.py
    description: "Verifies libclang_rt.builtins-wasm32.a is packaged in the wasm32-wasi sysroot libdir and has ar archive magic."
    command: "python3 check_wasi_assets.py <package_folder>"

upstream_total_case_count: 0
upstream_enabled_case_count: 0
upstream_executed_case_count: 0
upstream_excluded_case_count: 0
upstream_manual_case_count: 0
asset_count: 6552
upstream_pass_rate: "0 enabled / 0 executed on device; WASI clang/LLVM and runwasi toolchains are unavailable; upstream test suites were not executed. Asset structure validation 6552/6552."
assertion_count: 8
manifest_inventory: true
open_desk_verification: "20260814-070628-bfc89f-20260814-misc2-3053-3057-3058-r1 head 87fead37c: Build Summary Total 1 / Success 1 / Failed 0; check_wasi_assets.py verified all 6552 files."
