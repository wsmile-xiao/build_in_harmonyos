# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: wide-integer/1.01
homepage: "https://github.com/ckormanyos/wide-integer"

# 上游测试命令 (ctest -N 分析)
upstream_check_command: "cmake -S . -B build && cmake --build build && ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试（header-only 无编译阶段）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（v1.01 官方 tag 枚举）
upstream_tests:
  - file: test/test.cpp
    source: wide-integer-1.01/test/test.cpp
    description: "主测试运行器 run()：28 个独立测试函数（small_bits/boost_backend/examples/edge_cases/float_convert/int_convert/spot_values/0000024..0065536_alloc/4x4 乘除）"
    command: "./test_uintwide_t"
  - file: test/test_uintwide_t_xtra_from_issue_335.cpp
    source: wide-integer-1.01/test/test_uintwide_t_xtra_from_issue_335.cpp
    description: "独立回归用例：issue 335 字符串化 MaxValue（自带 main）"
    command: "./test_xtra_from_issue_335"
  - file: test/test_uintwide_t_boost_backend_via_test_arithmetic.cpp
    source: wide-integer-1.01/test/test_uintwide_t_boost_backend_via_test_arithmetic.cpp
    description: "Boost.Multiprecision uintwide_t_backend 经 test_arithmetic.hpp 的混合算术测试（自带 main，Boost.Test report_errors）"
    command: "./test_boost_backend_via_test_arithmetic"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：512 位 mul/div/mod 回环 + 十进制字符串交叉校验"
    command: "./test_wide_integer"

# 测试断言总数 (近似值, 用于质量评估)：主测试运行器内含循环化断言无法静态精确计数
assertion_count: 1000