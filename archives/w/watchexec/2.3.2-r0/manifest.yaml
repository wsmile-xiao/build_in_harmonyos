software: watchexec
# 版本级 manifest
# 文件位置: archives/w/watchexec/2.3.2-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2.3.2-r0"
status: published
build_date: "2026-06-02"
build_system: prebuilt-musl

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/watchexec/watchexec/archive/refs/tags/v2.3.2.tar.gz"
  sha256: ""
  tar_format: tar.gz
  # 预编译二进制来源 (Alpine edge)
  precompiled_url: "https://dl-cdn.alpinelinux.org/alpine/edge/community/aarch64/watchexec-2.3.2-r1.apk"
  precompiled_source: "alpine-edge"

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom
  build_method: precompiled_binary
  configure_options: []
  dependencies:
    - dbus-libs/1.16.2
    - libgcc/15.2.0
    - musl/system
  cc: prebuilt
  cxx: prebuilt
  # patchelf RUNPATH设置
  patchelf_rpath: "$ORIGIN/../lib:/storage/Users/currentUser/usr/local/lib"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Rust静态musl二进制(非PIE, EXEC type)在OpenHarmony上崩溃(SIGSEGV exit 139)，需使用动态PIE musl二进制替代"
  - "OpenHarmony ASLR要求PIE格式，非PIE静态二进制(如GitHub aarch64-unknown-linux-musl.tar.xz)不兼容"
  - "Alpine edge APK提供的动态PIE musl二进制可正常工作，但需额外共享库: libdbus-1.so.3, libgcc_s.so.1"
  - "/lib目录只读(HMDFS)，无法创建libc.musl-aarch64.so.1 symlink，需通过patchelf RUNPATH指向~/usr/local/lib解决"
  - "预编译二进制优先级: Alpine APK(动态PIE) > GitHub静态musl(非PIE崩溃)"