# test_package/MANIFEST.yml
# 上游官方测试声明文件；详见 docs/TEST_QUALITY_SPEC.md

package: wslay/1.1.1
homepage: https://github.com/tatsuhiro-t/wslay

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# CUnit 不可用时上游 tests/ 目标会被条件编译跳过；本配方将其声明为
# test_requires，因此在支持的 OHOS/Linux profile 中会运行完整套件。
upstream_tests:
  - file: tests/main.c
    source: wslay-1.1.1/tests/main.c
    description: "CUnit 驱动的 WebSocket frame、event 和 queue 官方测试套件"
    command: "./tests/main"
    test_count: 36
    assertion_count: 278
    dependency: "cunit/2.1-3 (test_requires)"

# test_package 中自带的消费者视角测试
# 通过公开 wslay_frame_send/recv API 验证未掩码和掩码文本帧往返。
test_package_tests:
  - file: test.c
    description: "消费者程序链接 wslay，并验证文本帧编码、掩码和解码"
    command: "./test_wslay"
    assertion_count: 26

# 上游 278 + 消费者测试 26
assertion_count: 304
