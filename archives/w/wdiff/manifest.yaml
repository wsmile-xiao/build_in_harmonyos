# 软件级 manifest — wdiff
# 遵循 ARCHIVE-SPEC v2.0

software: wdiff
display: "wdiff"
description: "GNU wdiff — 逐词比较两个文件的 diff 前端工具（front-end to GNU diff）"
category: utility
homepage: "https://www.gnu.org/software/wdiff/"
license: GPL-3.0-or-later
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "2014 年版 config.guess 遇 HongMeng 内核无法猜构建类型，需显式 --build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos"
    - "AM_GNU_GETTEXT(external) 在 musl 无 libintl，configure 传 --disable-nls"
    - "HMDFS 上 automake 的 umask 077 mktemp 目录不可写（drwx--S---），补丁改 umask 022（E011）"
    - "上游 src/Makefile.in 缺 -I../lib（构建目录），out-of-tree 构建找不到 gnulib 生成的 error.h，补丁补齐"
    - "makeinfo 缺失：tarball 预生成 doc/wdiff.info 需复制进构建目录并按依赖序固定 doc 文件时间戳，避免 automake vti 链触发 makeinfo 重建"
    - "wdiff 退出码语义与 diff 相同（1=有差异），自动化测试需显式捕获"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2.3":
    status: published
    build_date: "2026-09-14"
