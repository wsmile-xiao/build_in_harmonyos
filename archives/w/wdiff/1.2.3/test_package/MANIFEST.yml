# test_package/MANIFEST.yml — wdiff 1.2.3 上游测试声明
package: wdiff/1.2.3
homepage: "https://www.gnu.org/software/wdiff/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: "make check (设备真机 ~/tmp/uc2/wdiff-1.2.3/uptest)"

upstream_tests:
  - file: tests/wdiff.at
    source: wdiff-1.2.3/tests/wdiff.at
    description: "Autotest 4 组：wdiff output formats / report bad diff binary / use pager / diff as input"
    command: "./tests/testsuite（make check）"

test_package_tests:
  - file: test.sh
    description: "消费者测试：运行 wdiff 二进制断言版本输出、词级 diff 插入标记、退出码语义"
    command: "bash test.sh（conanrun env）"

assertion_count: 4
