# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: whitedb/0.8.0alpha
homepage: "https://github.com/priitj/whitedb"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（Makefile.am TESTS 变量注册，共 2 项）
# 实测: Test/common.test PASS / Test/log.test SKIP(exit 77, logging 默认禁用
# 时上游 selftest 主动跳过)。make check 汇总 TOTAL=2 PASS=1 SKIP=1 FAIL=0。
upstream_tests:
  - file: Test/common.test
    source: whitedb-0.8.0alpha/Test/common.test
    description: "上游公共功能测试（调用 Main/selftest common）"
    command: "./Test/common.test"

  - file: Test/log.test
    source: whitedb-0.8.0alpha/Test/log.test
    description: "上游日志功能测试（调用 Main/selftest log）；logging 默认禁用，selftest 检测后主动退出 77（SKIP）"
    command: "./Test/log.test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 whitedb 公开 API 做 int/str 字段写入读回 roundtrip"
    command: "./test_whitedb"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
