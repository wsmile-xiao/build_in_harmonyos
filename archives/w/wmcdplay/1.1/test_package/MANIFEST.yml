# test_package/MANIFEST.yml — wmcdplay 1.1
#
# R51 upstream-test census (evidence collected on 2026-09-27, see
# ../upstream-tests/README.md for the raw listing):
#   * the 1.1 release tarball has 37 files, no tests/ or test/ directory;
#   * Makefile.am declares neither TESTS nor check_PROGRAMS (nor any *_test
#     target), and configure.ac registers no test framework (no
#     AC_CONFIG_TESTDIR / ctest / pytest);
#   * "make check" therefore evaluates to the canonical empty automake target.
# => upstream ships 0 automated tests; the honest census is N=0, N'=0.
#    The consumer cases below are the HarmonyOS-side additions required by the
#    task, and they are reported separately from the upstream census.

package: wmcdplay/1.1
homepage: "https://www.dockapps.net/"

# Canonical upstream test entry point, executed and captured during the build
# (it is the empty automake target; the command is still run to prove the entry
# point is intact).
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# No upstream test program exists to list.
upstream_tests: []

test_package_tests:
  - file: test_wmcdplay.py
    description: >-
      Consumer view of the installed package: inspects the signed OHOS AArch64
      ELF, its runtime dependency contract (libX11.so.6 / libXpm.so.4 /
      libXext.so.6, no build-time RPATH), the compiled-in default artwork, the
      installed artwork data / man page / licence, and executes the real binary
      (--help long/short forms, documented option list, release banner, the
      X-display error path, and an explicit HarmonyOS aarch64 consumer run).
    command: "python3 test_wmcdplay.py <package_folder>"

assertion_count: 27
