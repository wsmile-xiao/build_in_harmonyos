# 版本级 manifest — wmcdplay 1.1

# 版本号
version: "1.1"

# 软件名
software: "wmcdplay"

# 编译状态：published = verify 通过 + CI upload；built = verify 通过未 upload
status: built

# 编译日期
build_date: "2026-09-27"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.dockapps.net/download/wmcdplay-1.1.tar.gz"
  sha256: "d66d3f5ac922b9a44fed544c08f5e9018cbead55161e1d107de30903cc374767"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--host=aarch64-linux-ohos"
  dependencies:
    - libx11/6.4.0
    - libxext/6.4.0
    - libxpm/3.5.17
  build_requirements:
    - automake/1.18
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-makefile-am-cxxflags.patch"
  - "patches/0002-wmcdplay-cc-version-literal.patch"
  - "patches/0003-wmcdplay-cc-sysartdir-separator.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 tar 包只带 configure.ac/Makefile.am，无 configure/Makefile.in；OHOS 镜像无 automake/aclocal，须 tool_requires(automake/1.18)，并分步 aclocal → autoconf → automake（autoreconf 在 HMDFS 下 autoconf.m4f 加载冲突）"  # knowledge_ref: DRAFT-10035-wmcdplay-1.1-autotools-bootstrap-ohos
  - "automake 的 bin/aclocal、bin/automake 是 #!/bin/sh 包装脚本，靠 $(dirname $0) 推 --automake-acdir/--libdir；配方须用 \$ACLOCAL/\$AUTOMAKE（由 buildenv_info 导出，仅 conanbuild 环境生效），裸 aclocal 会落到 PATH 上不存在的系统 automake"  # knowledge_ref: DRAFT-10035-wmcdplay-1.1-autotools-bootstrap-ohos
  - "AM_CFLAGS 只作用于 C 源文件，wmcdplay.cc 是 C++：X11/Xpm/Xext 的 -I 从未传给 C++ 编译，须补 AM_CXXFLAGS"  # knowledge_ref: DRAFT-10036-wmcdplay-1.1-am-cxxflags
  - "libx11/6.4.0 的 x11.pc 为 prefix=/ 不可重定位，-I 会变成 -I//include；须靠 AutotoolsDeps 注入 cpp_info 的真实 include/lib 路径，不能只依赖 pkg-config"  # knowledge_ref: DRAFT-10037-wmcdplay-1.1-x11-pc-udl-cross-host
  - "--host=aarch64-linux-ohos 使 configure 进入交叉编译模式，编译器 works-check 只链接不运行 OHOS conftest，否则会在构建机上尝试执行 aarch64 二进制"  # knowledge_ref: DRAFT-10037-wmcdplay-1.1-x11-pc-udl-cross-host
  - "C++11 起 \"...\"VERSION（无空格）被词法分析为用户自定义字面量，clang 报 invalid suffix on literal；相邻字符串字面量与宏之间必须留空格"  # knowledge_ref: DRAFT-10037-wmcdplay-1.1-x11-pc-udl-cross-host
  - "XPM/%.art 规则用相对路径（cd XPM && ./makeart \$*），Makefile.am 的 artwork 规则要求 in-source 构建，out-of-source 无法工作"  # knowledge_ref: DRAFT-10035-wmcdplay-1.1-autotools-bootstrap-ohos
  - "本机 WorkBuddy 沙箱：以 HMDFS 上的解释器（\$HOME/usr/local/bin/python3，即 conan 的 shebang）启动的进程，其子进程 execve 系统根以外的任何路径（含 ELF）均 EACCES；改用应用包内同一 python（/data/storage/el1/bundle/libs/arm64/python/bin/python3）即可正常执行 conan create"  # knowledge_ref: DRAFT-10038-workbuddy-sandbox-exec-allowlist
