sources:
  "1.1":
    url: "https://www.dockapps.net/download/wmcdplay-1.1.tar.gz"
    sha256: "d66d3f5ac922b9a44fed544c08f5e9018cbead55161e1d107de30903cc374767"
patches:
  "1.1":
    - patch_file: "patches/0001-makefile-am-cxxflags.patch"
      patch_description: "Pass the pkg-config include flags to the C++ compile (AM_CFLAGS only covers C, so wmcdplay.cc never saw X11/Xpm/Xext headers)"
      patch_type: "portability"
    - patch_file: "patches/0002-wmcdplay-cc-version-literal.patch"
      patch_description: "Space out the adjacent string literal and VERSION macro; C++11 lexes \"...\"VERSION as a user-defined literal and clang rejects it with invalid suffix on literal"
      patch_type: "portability"
    - patch_file: "patches/0003-wmcdplay-cc-sysartdir-separator.patch"
      patch_description: "Insert the missing path separator when resolving -f artwork_file through SYSARTDIR (sprintf \"%s%s\" against pkgdatadir, which carries no trailing slash)"
      patch_type: "portability"
