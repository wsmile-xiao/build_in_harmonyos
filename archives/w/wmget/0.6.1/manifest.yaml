# 版本级 manifest
# 文件位置: archives/w/wmget/0.6.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.6.1"

# 软件名
software: wmget

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（dockapps.net 官方发布件；与 Debian pool 池址字节一致）
  url: "https://www.dockapps.net/download/wmget-0.6.1.tar.gz"

  # 源码校验和
  sha256: "cd3ed1106acfdc3857fc84eb385aa0c0706117e6e3e0abf38d8104d11b3e1189"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libx11/6.4.0
    - libxext/6.4.0.1
    - libxpm/3.5.17
    - curl/8.15.0.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS PC 内核对 SysV IPC shmget/shmat 运行期 SIGSYS(31) 拦截（编译链接不受影响）；POSIX shm_open 可用"
  - "上游仅带 configure.ac 无预生成 configure，13 个 .c 直编等价替代 automake 链路"
