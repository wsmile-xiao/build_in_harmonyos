# wolfssl 5.7.0 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "5.7.0"
software: wolfssl
status: built
build_date: "2026-09-06"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/wolfSSL/wolfssl/archive/refs/tags/v5.7.0-stable.tar.gz"
  sha256: "2de93e8af588ee856fe67a6d7fce23fc1b226b74d710b0e3946bc8061f6aa18f"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # autotools | cmake | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # tool_requires: automake/1.18, libtool/2.5.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# E007: 通过 --build/--host=aarch64-unknown-linux-ohos 显式 triplet 跳过
#       config.guess 对 HarmonyOS (uname -s) 的探测失败
# E011: configure/config.status 中 umask 077 -> 022 (HMDFS temp dir)
# E010: CONFIG_SHELL=bash 由 conan profile buildenv 提供
# E074: make 使用 -j2，jobserver mkfifo EPERM 仅为警告，make 自动降级可用
#       （与历史 4.6.0/5.9.0 笔记 make -j2 SHELL=bash 一致）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - knowledge_ref: E007
    description: "config.guess 无法识别 HarmonyOS(uname -s=HarmonyOS)，用 --build/--host=aarch64-unknown-linux-ohos 显式指定 triplet(与 abiword 等已发布配方同法)；勿用 --build/--host 绕过导致 cross 误判"
  - knowledge_ref: E011
    description: "HMDFS umask 077 导致 configure/config.status 创建临时目录失败，替换为 umask 022"
  - knowledge_ref: E010
    description: "toybox sh 不兼容 libtool/autotools 生成的脚本语法，CONFIG_SHELL=bash 由 conan profile buildenv 注入"
  - knowledge_ref: E074
    description: "HMDFS SELinux 禁止 FIFO，make jobserver mkfifo EPERM 为警告，make 自动降级仍可用；配方用 -j2（历史 wolfssl 笔记同法）"