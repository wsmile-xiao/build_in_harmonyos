software: wolfssl
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.9.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.9.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-06"

# 构建系统类型
build_system: autotools

# 软件类型：library（纯库，无可执行二进制）
software_type: library

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/wolfSSL/wolfssl/archive/refs/tags/v5.9.0-stable.tar.gz"

  # 源码校验和
  sha256: "6efc62b86f145a5c52bfd62294ca66c20ce85b54e9033f5d7e0ee73eb30306c1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "CONFIG_SHELL=/storage/Users/currentUser/usr/local/bin/bash"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - knowledge_ref: E011
    description: "HMDFS umask 077 导致 config.status 创建临时目录权限问题，需将 configure 和 config.status 中 umask 077 改为 umask 022"
  - knowledge_ref: E010
    description: "toybox sh 不兼容 libtool 生成的脚本语法，需使用 CONFIG_SHELL=bash 重新 configure"
  - knowledge_ref: E004
    description: "OHOS SDK lld 需要 LD_LIBRARY_PATH 包含 SDK 的 llvm/lib 目录以加载 libxml2.so.16"
