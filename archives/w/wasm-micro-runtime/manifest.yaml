software: wasm-micro-runtime
display: "WebAssembly Micro Runtime"
description: "WebAssembly Micro Runtime (WAMR) - a lightweight, standalone WebAssembly runtime"
category: runtime
homepage: "https://github.com/bytecodealliance/wasm-micro-runtime"
license: "Apache-2.0 WITH LLVM-exception"
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "WAMR 通过 CMAKE_HOST_SYSTEM_NAME 检测平台，在 HarmonyOS 上会检测到 'HarmonyOS'，但 WAMR 没有对应的平台支持"
    - "必须通过 -DWAMR_BUILD_PLATFORM=linux 强制使用 Linux 平台配置"
    - "WAMR 默认在 64 位平台上构建为 X86_64 目标，即使实际架构是 AARCH64"
    - "必须通过 -DWAMR_BUILD_TARGET=AARCH64 明确指定目标架构"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "2.4.4":
    status: built
    build_date: "2026-06-08"