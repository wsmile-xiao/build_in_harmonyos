software: wasm-micro-runtime
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.4.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4.4"

# 构建系统（顶层字段，用于验证）
build_system: cmake

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/bytecodealliance/wasm-micro-runtime/archive/refs/tags/WAMR-2.4.4.tar.gz"

  # 源码校验和
  sha256: "03ad51037f06235577b765ee042a462326d8919300107af4546719c35525b298"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DWAMR_BUILD_PLATFORM=linux"
    - "-DWAMR_BUILD_TARGET=AARCH64"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "WAMR 通过 CMAKE_HOST_SYSTEM_NAME 检测平台，在 HarmonyOS 上检测到 'HarmonyOS' 但无原生支持"
  - "必须通过 -DWAMR_BUILD_PLATFORM=linux 强制使用 Linux 平台配置适配 HarmonyOS"
  - "WAMR 默认在 64 位平台构建为 X86_64 目标，即使实际架构是 AARCH64"
  - "必须通过 -DWAMR_BUILD_TARGET=AARCH64 明确指定目标架构"
  - "WAMR 是静态库，不是可执行程序，编译产物是 libiwasm.a"
  - "WAMR 无标准 make test/ctest 测试框架，测试套件需单独构建"
  - "核心特性：Interpreter、Fast Interpreter、AOT、Libc WASI、SIMD 默认启用"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
