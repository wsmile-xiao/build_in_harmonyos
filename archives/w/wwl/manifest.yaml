software: wwl
display: "wwl"
description: "Maidenhead 网格定位工具（wwl 计算两点距离/方位角，locator 反算经纬度）"
category: utility
homepage: "https://www.db.net/downloads/"
license: LicenseRef-Permissive
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C 程序（wwl.c）+ 手写 Makefile，仅链接 libm；无三方依赖"
    - "上游源码只通过明文 HTTP 发布（www.db.net）；改用 Debian .orig.tar.gz（HTTPS，sha256 固定）满足 conandata 的 https 约束"
    - "locator 模式由 argv[0] basename 决定，打包时需复制出真实的 locator 可执行文件（并保持执行位）"
  common_dependencies: []

versions:
  - version: "1.3-db"
    status: built
    build_date: "2026-09-23"
