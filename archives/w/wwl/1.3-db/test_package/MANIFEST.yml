# test_package/MANIFEST.yml
# wwl 1.3-db - upstream test declaration.

package: wwl/1.3-db
homepage: "https://www.db.net/downloads/"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream (Diane Bruce, 2007) ships a single wwl.c plus a hand-written
  Makefile whose targets are all/wwl/locator/install/deinstall/release/clean.
  There is no test suite (no `make check`, no ctest, no tests/ directory).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_wwl.sh
    description: "installed wwl/locator consumer checks against the wwl(1) worked examples (distance/azimuth, locator->lat/lon, usage, invalid locator)"
    command: "sh test_wwl.sh"

test_files:
  - path: "test_package/test_wwl.sh"
    test_type: "R34"
    assertion_count: 10

test_package_test_count: 1
consumer_assertion_count: 10
upstream_test_cases: 0
assertion_count: 10
