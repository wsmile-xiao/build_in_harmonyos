software: weggli
display: weggli
description: "Fast and robust semantic search tool for C and C++ codebases (AST-based pattern matching)"
category: tool
homepage: "https://github.com/weggli-rs/weggli"
license: Apache-2.0
build_system: cargo
ohos_adaptation:
  key_points:
    - "Rust/Cargo build for aarch64-unknown-linux-ohos with rust-toolchain/1.97.1 (tool_requires); the Conan payload is signed with binary-sign-tool because HMDFS rejects chmod and refuses to exec the unsigned ELF"
    - "Deterministic Cargo.lock migration for target_env=ohos: libc 0.2.112 -> 0.2.155 and nix 0.17.0 -> 0.28.0 with the `signal` feature (knowledge E358); no weggli source line changes"
    - "CXXSTDLIB=c++ for the C++ grammar compiled by build.rs through the cc crate (OHOS ships libc++ only)"
    - "cargo 1.97 runtime OpenSSL/zlib come from sha256-pinned Harmonybrew OHOS bottles on LD_LIBRARY_PATH (cargo uses SSL_get0_group_name, absent from system OpenSSL 3.0)"
  common_dependencies: []
versions:
  "0.2.4":
    status: built
    build_date: 2026-10-01
sources:
  url: "https://github.com/weggli-rs/weggli/archive/refs/tags/v0.2.4.tar.gz"
  sha256: "12fde9a0dca2852d5f819eeb9de85c4d11c5c384822f93ac66b2b7b166c3af78"
