# conandata.yml — weggli 0.2.4
#
# 官方源（R39）：上游仓库 weggli-rs/weggli（原 googleprojectzero/weggli →
# google/weggli，现迁移至 weggli-rs/weggli），tag v0.2.4。
# 镜像回退由 CI（ci/conan/build_and_test.sh get_mirrors）自动追加，
# 此处只写官方 URL。
sources:
  url: "https://github.com/weggli-rs/weggli/archive/refs/tags/v0.2.4.tar.gz"
  sha256: "12fde9a0dca2852d5f819eeb9de85c4d11c5c384822f93ac66b2b7b166c3af78"

# cargo 运行期共享库：cargo 1.97 动态链接 libssl.so/libcrypto.so/libz.so，且
# 需要 OpenSSL 3.5+ 的 SSL_get0_group_name（系统 /usr/lib 的 3.0 缺该符号）。
# 使用 Harmonybrew OHOS 预编译 bottle（below/argc/alass 先例），sha256 已核验。
cargo_runtime:
  - url: "https://harmonybrew.atomgit.com/bottles/openssl%403-3.6.4.arm64_ohos.bottle.tar.gz"
    sha256: "e1be73c6c68e29c33ff43761045e43e23e7c369f0fb1a24f40e226ec5cb28f98"
  - url: "https://harmonybrew.atomgit.com/bottles/zlib-ng-compat-2.3.3_1.arm64_ohos.bottle.tar.gz"
    sha256: "1c17a31f8104701bce6b471af8dbbd14bb67d16a504eec087018feb05493a430"

patches:
  - patch_file: "patches/0001-Cargo.lock.patch"
    patch_description: >-
      Deterministic Cargo.lock migration for target_env=ohos (knowledge E358):
      nix 0.17.0 -> 0.28.0 and libc 0.2.112 -> 0.2.155, both the earliest
      releases with aarch64-unknown-linux-ohos support, regenerated with cargo
      1.97.1 (`cargo update -p … --precise`) so the build stays --locked and
      reproducible.
    patch_type: "portability"
  - patch_file: "patches/0002-Cargo.toml.patch"
    patch_description: >-
      nix dependency 0.17.0 -> 0.28.0 with the `signal` feature enabled: the
      minimal upstream semver-compatible root-dependency bump (nix 0.28
      requires opting into the `signal` feature) that makes the Unix SIGPIPE
      handler weggli uses compilable for OHOS. No weggli source line changes.
    patch_type: "portability"
