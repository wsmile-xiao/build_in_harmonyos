# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "aarch64-unknown-linux-ohos 在 rustc 中是 target_os=linux + target_env=ohos；旧 Cargo.lock 锁定的 libc（<0.2.140）与 nix（<0.28.0）在该 cfg 组合下无法编译，需在 semver 范围内做确定性锁图迁移 (knowledge_ref: E358)"
  - "nix >=0.27 起 signal 等模块改为显式 feature；nix 0.28.0 是首个含 target_env=ohos 处理的版本，且 signal(Signal, SigHandler) 签名与 0.17 一致，因此无需改动调用方源码 (knowledge_ref: E358)"
  - "cc crate 编译 C++ 时默认发 -lstdc++，OHOS SDK 只有 libc++，构建环境需设 CXXSTDLIB=c++ (knowledge_ref: E543-draft)"
  - "HMDFS 拒绝 chmod（E046），Conan 包内 ELF 即使 0770 也不可 exec（EACCES），Rust 工具链二进制须复制后 binary-sign-tool 自签名 (knowledge_ref: E077)"
  - "cargo 1.97 动态链接未版本化的 libssl.so/libcrypto.so 且需要 OpenSSL 3.5+ 符号，须用 Harmonybrew OHOS bottle 提供运行期共享库 (knowledge_ref: E509)"
  - "OHOS 加载器不为 dlopen 的 pyo3 扩展模块在全局作用域解析 Python C API 符号，python 绑定测试需 LD_PRELOAD libpython (knowledge_ref: E544-draft)"

