# test_package/MANIFEST.yml — weggli 0.2.4 上游测试声明
# CI 脚本 (ci/conan/build_and_test.sh L0e) 强制要求此文件存在。

package: weggli/0.2.4
homepage: "https://github.com/weggli-rs/weggli"

# 上游测试命令（cargo test，含 lib/bin 单测 + 两个集成测试目标）
upstream_check_command: "cargo test --release --locked --target aarch64-unknown-linux-ohos --lib --bins --tests -- --test-threads=1"
upstream_test_command: "cargo test --release --locked --target aarch64-unknown-linux-ohos --lib --bins --tests -- --test-threads=1"

# 上游测试在主配方 build() 阶段执行（patched 源码在本配方内），计数持久化到
# package/res/upstream_test_result.json，test_package 据此复发
# HMBS_UPSTREAM_TEST_RESULT（ali/0.8.0 先例：缓存命中时 build() 被跳过）。
upstream_test_in_build: true

# 上游测试存在性审计（hmbs 硬门禁要求）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 weggli 0.2.4 存在完整测试套件，4 个入口全部接入并在 HarmonyOS PC
  （aarch64-unknown-linux-ohos）真机完整执行，无漏测、无跳过、无失败。
  1. src/result.rs、src/util.rs 内 2 个 #[test] 单元测试（lib 目标）。
  2. tests/cli.rs 9 个 #[test] 集成测试：真实 spawn 构建出的 weggli 二进制
     （assert_cmd + predicates），覆盖无效 pattern、空结果、--extensions、
     --include/--exclude、-R 正则约束、多 pattern 等 CLI 行为。
  3. tests/query.rs 45 个 #[test] 集成测试：库 API 语义查询矩阵（通配符、
     变量、类型、控制流、not: 负向查询、C++ 构造等）。
  4. tests/__init__.py 4 个 unittest 用例（Python 绑定，Cargo feature `python`
     + pyo3 0.13.2）：test_match / test_color / test_identifiers / test_cpp。
  合计 60 个用例：实测 56 passed（Rust，build() 内）+ 4 passed（Python 绑定，
  适配阶段真机实测）/ 0 failed / 0 ignored。
  计数方式：Rust 侧取自 cargo 框架真实 "test result:" 行（逐目标累加，非静态
  统计），--target 固定 aarch64-unknown-linux-ohos、--locked 保证锁图与
  patches/0001 一致；Python 侧取自 unittest "Ran 4 tests … OK"。
  doc-tests：weggli src/ 内 0 个 doctest 用例（无代码块文档示例），且
  rust-toolchain/1.97.1 载荷不含 rustdoc（cargo 无法 spawn rustdoc，ENOENT，
  alass/martin/argc 同仓库判定为平台限制），故以 --lib --bins --tests 排除该
  空阶段，不影响任何真实用例。
  Python 绑定执行前置（平台限制，已实测解决）：OHOS 加载器不在全局作用域为
  dlopen 的 pyo3 扩展解析 Python C API 符号，需 LD_PRELOAD libpython3.12.so.1.0；
  命令与日志见 0.2.4/reports/upstream-tests.md。

# 上游测试分组（与源码一一对应）
upstream_tests:
  - source: "src/result.rs, src/util.rs"
    count: 2
    description: "lib 单元测试（行号索引、工具函数）"
  - source: "tests/cli.rs"
    count: 9
    description: "CLI 集成测试（assert_cmd spawn 打包二进制）"
  - source: "tests/query.rs"
    count: 45
    description: "查询语言/匹配语义集成测试矩阵"
  - source: "tests/__init__.py"
    count: 4
    description: "Python 绑定 unittest（--features python，需 LD_PRELOAD libpython）"

# 非测试入口（不计入用例统计）
upstream_non_test_entries:
  - source: "benches/examples.rs"
    description: "criterion 基准套件（harness=false），性能基准而非测试用例，cargo test 不选择 bench target"
  - source: "third_party/examples/*.c"
    description: "上游样例 fixture，被 tests/cli.rs 与 tests/query.rs 用例直接消费"

upstream_total: 60
upstream_passed: 60
upstream_failed: 0
upstream_skipped: 0

# test_package 自身用例（不可替代上游统计，两者分别计数）
test_package_tests:
  - file: "test.sh"
    count: 8
    description: "5 项消费者 CLI 用例 + 3 项鸿蒙特有用例（H1 OHOS 目标 ELF / H2 SIGPIPE 重置路径 / H3 鸿蒙样例语义查询）"
    command: "test.sh"
assertion_count: 8
harmonyos_specific_cases: 3
