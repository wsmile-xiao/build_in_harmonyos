# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wayland/1.22.0.1
homepage: "https://wayland.freedesktop.org/"

# 上游测试命令：meson test（wayland 单元测试套件）
upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序（meson test 自动发现，tests/ 目录）
upstream_tests:
  - file: tests/connection-test.c
    description: "wayland 连接层单元测试（connection-test）"
    command: "meson test connection"
  - file: tests/display-test.c
    description: "wayland display 单元测试（display-test）"
    command: "meson test display"
  - file: tests/event-loop-test.c
    description: "wayland 事件循环单元测试（event-loop-test）"
    command: "meson test event-loop"
  - file: tests/array-test.c
    description: "wayland 数组工具单元测试（array-test）"
    command: "meson test array"
  - file: tests/fixed-test.c
    description: "wayland fixed 定点数单元测试（fixed-test）"
    command: "meson test fixed"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_wayland.sh
    description: "真实消费验证：①产物存在（wayland-client.h/lib/.pc，3 断言）②.pc 声明 Libs:/Cflags: 行（2 断言）③用 \$CC 编译链接调用 wl_display_create 的消费者程序（1 断言）④运行消费者程序（沙箱 ELF 隔离时 SKIP）"
    command: "bash test_wayland.sh <pkg_dir>"
  - file: conanfile.py
    description: "验证 include/wayland-client.h 存在（1 个断言）"
    command: "conan test"

# 测试断言总数：上游 meson test 测试套件（5 个代表用例全过），
# test_package 编译链接类断言 7 个（含 1 个运行断言，沙箱隔离时 SKIP 不计失败）
assertion_count: 12
