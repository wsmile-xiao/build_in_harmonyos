software: wayneko
display: "wayneko"
description: "Animated Neko cat rendered as a wlr-layer-shell Wayland client"
category: gfx
homepage: "https://git.sr.ht/~leon_plickat/wayneko"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "wayland-scanner from the wayland/1.22.0.1 Conan package cannot be execve'd on OHOS; the recipe compiles a static scanner from the wayland 1.22.0 sources instead."
    - "The upstream Makefile is driven with explicit CC/CFLAGS/LIBS derived from the resolved Conan dependencies (no pkg-config, no bare ${CC} shell vars)."
    - "RPATH is embedded to the wayland/pixman libdirs so the installed binary runs without LD_LIBRARY_PATH."
    - "Requires a compositor implementing zwlr-layer-shell-unstable-v1; cannot run headless (tests assert CLI/behaviour, not a live surface)."
  common_dependencies:
    - wayland
    - pixman

versions:
  "0_git20260326":
    status: built
    build_date: "2026-09-14"
    conan_ref: "wayneko/0_git20260326"
    commit: "437a8a708ea68f0288becb047b582e84ef3e412c"
