# test_package/MANIFEST.yml
# Upstream test declaration for wayneko 0_git20260326.
# Required by CI (build_and_test.sh L0e) and by docs/TEST_QUALITY_SPEC.md.

package: wayneko/0_git20260326
homepage: "https://git.sr.ht/~leon_plickat/wayneko"

# ── Upstream test inventory: wayneko ships ZERO tests ───────────────────
# Exact inventory command (run against the downloaded release tarball):
#
#   $ tar tzf wayneko-437a8a708ea68f0288becb047b582e84ef3e412c.tar.gz \
#         | sed 's:^[^/]*/::' | sort
#   LICENSE
#   Makefile
#   README
#   bash-completion
#   ext-idle-notify-v1.xml
#   neko-bitmap.xbm
#   wayneko.1
#   wayneko.c
#   wlr-layer-shell-unstable-v1.xml
#   xdg-shell.xml
#   zsh-completion
#
# What was inspected (all confirm the absence of an upstream test suite):
#   * Tarball file list above: no tests/ directory, no *_test.* / test_*.c.
#   * Makefile targets: only `wayneko`, `install`, `uninstall`, `clean`
#     (no `check` / `test` target; `.PHONY: clean install`).
#   * No CI configuration of any kind (no .gitlab-ci.yml / .github / .build.yml
#     / .builds — the tarball is a flat source drop; repository root likewise).
# Consequently there is no upstream suite to run; the port SUPPLIES the tests.

upstream_check_command: "make -n check   # -> make: *** No rule to make target 'check'"

# Upstream ships no test target at all, so no UPSTREAM suite runs in build().
# build() still runs a `make -f tests/Makefile.check check` trace, but that is
# this port's own supplemented suite (tests/), not an upstream one — hence
# upstream_test_in_build stays false and upstream_test_command is empty.
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests: none exist. An empty list is the truthful record.
upstream_tests: []

# test_package tests: drive the INSTALLED binary and assert real behaviour.
test_package_tests:
  - file: test.sh
    description: >-
      Executes the installed wayneko binary: --help exits 0 and lists all 9
      documented flags; unknown flag / --type bogus / missing parameter /
      malformed colour all exit non-zero with the exact diagnostic text;
      unset WAYLAND_DISPLAY -> "WAYLAND_DISPLAY is not set"; bogus
      WAYLAND_DISPLAY -> "Can not connect to wayland display".
    command: "bash test.sh"
  - file: conanfile.py
    description: "conan test: runs test.sh inside the conanrun environment (R34)."
    command: "conan test test_package wayneko/0_git20260326"
  - file: test_wayneko_ohos.c
    description: >-
      鸿蒙特有测试（OHOS-specific consumer test, 12 断言）：仅 OHOS 目标编译
      （#ifndef __OHOS__ #error 守卫），对已安装的 wayneko 二进制做平台级断言——
      ELF64/AArch64/PIE(ET_DYN)/PT_INTERP/NX/RELRO、DT_NEEDED 含 libwayland-client
      与 libpixman-1（Conan 依赖链已嵌入产物）、且无 glibc 专属 backtrace 未定义
      符号（验证 wayneko.c 的 #ifdef __GLIBC__ 鸿蒙移植守卫真实生效）。
    command: "test_wayneko_ohos <installed-bin>/wayneko"

# ── Assertion totals ────────────────────────────────────────────────────
# upstream:        0 tests (see inventory evidence above)
# supplemented L1: 117 assertions (tests/test_wayneko.c, run via make check)
# test_package:    23 assertions (test.sh)
# OHOS-specific:   12 assertions (test_wayneko_ohos.c, 鸿蒙特有测试)
assertion_count: 152
