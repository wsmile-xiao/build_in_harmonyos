adaptation:
  phase: "validated"
  difficulty: "B"
  notes: |
    Autotools release archive with generated configure files. The recipe
    disables static output and optional libwmf support for the OHOS target.
    Shadow r18 passed Conan create, the three-assertion test_package, L1,
    L4, and L5. L2 was skipped because installed target CLIs cannot execute
    version/help probes in the worker environment. CI #30377 exposed that
    GLib's private libffi/pcre2 and musl gettext linkage was not propagated
    through libgsf's shared-library metadata; the OHOS build now supplies
    that link closure explicitly during make. CI #30400 verified dependency
    resolution and motivated keeping the closure out of configure probes.
    CI #30419 then reached the real link and exposed non-relocatable pcre2
    libtool metadata; the OHOS build removes dependency .la files from its
    local cache view after configure so libtool selects the packaged shared
    objects. CI #30427 verified that pre-configure cleanup breaks Autoconf's
    compiler probe and motivated this narrower scope. CI #30434 repeated the
    probe failure on the same worker, so the generated OHOS environment also
    supplies the compiler tool directory and SDK linker runtime directory
    explicitly. CI #30438 cleared configure and the libffi/pcre2 closure,
    leaving GLib's private g_libintl aliases; the make-only closure now links
    the GLib package's proxy libintl by absolute path. CI #30443 then linked
    every library and CLI and reached packaging, where HMDFS rejected the
    parallel make jobserver FIFO and the bundled install-sh directory helper.
    Generated Makefile/GNUmakefile install commands now use a mkdir/cp shim,
    including install_sh directory creation, and package installation runs
    serially. CI #30448 verified package creation and then exposed the same
    proxy-libintl closure gap in the CMakeDeps consumer. OHOS package metadata
    now propagates GLib's package library search path and intl after wv, while
    the test package also builds serially to avoid HMDFS jobserver FIFO
    warnings. CI #30455 then hit a worker-specific SDK lld startup failure
    before the consumer link because libxml2.so.16 was unavailable on CI-002.
    The inconsistency was reported in the PR, and the wv test environment now
    prepends the discovered SDK llvm/lib runtime path just as the main recipe
    does.

