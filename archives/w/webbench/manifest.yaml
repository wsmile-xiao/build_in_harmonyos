software: webbench
display: "webbench"
description: "简单的 fork 型 HTTP/代理服务器压测工具（模拟多客户端并发请求，报告 pages/min 与 bytes/sec）"
category: utils
homepage: "http://home.tiscali.cz/~cz210552/webbench.html"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 webbench.c 包含残留的 `#include <rpc/types.h>`（Sun RPC）。glibc 2.26 起把 Sun RPC 移出 libc 改由 libtirpc 提供，该头文件只在安装 libtirpc-dev 时存在；musl/OHOS 从来没有。实测在 WSL glibc>=2.26 与 OHOS 上**均**致命失败 —— 属现代系统回归，非 OHOS 特有问题。删除该行即可（MAXHOSTNAMELEN 来自 <sys/param.h>，bzero/index 来自 <strings.h>，均已实测可用）"
    - "OHOS/musl 上对**读流**调用 `setvbuf(stream, NULL, _IONBF, 0)` 会使该流后续 `fscanf` 返回 -1 且 feof/ferror/errno 全为 0（无声失败）；而同环境 fgets/fread/裸 read/普通文件 fscanf/sscanf 均正常，glibc 上该组合亦正常 —— 属 OHOS stdio 行为差异。webbench 父进程用该组合读取子进程结果，导致每次压测报 "Some of our childrens died." 且成功/失败数均为 0。最小修复：删除该 setvbuf（循环次数固定，缓冲模式不影响解析结果）"
    - "上游 Makefile 的 all 目标会调用 ctags；构建显式指定 webbench 目标以避免无谓依赖"
    - "上游无任何测试目标/测试目录（Makefile 目标仅 all/tags/install/webbench/webbench.o/clean/tar），如实申报 upstream_total=0；功能验证置于 test_package（本地 127.0.0.1 HTTP 服务 + 真实压测，不依赖公网）"
    - "bench() 以 `return i;` 结尾而 i 是 fscanf 最后读入的子进程计数而非状态码，压测成功时退出码为任意 0-255 值（实测 223）；测试据此断言 stdout 报告而非压测退出码"
  common_dependencies: []

versions:
