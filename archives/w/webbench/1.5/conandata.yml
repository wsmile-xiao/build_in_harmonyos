# conandata.yml — webbench 1.5
# WebBench (Radim Kolar, 1997-2004) — simple forking HTTP/proxy server benchmark.
#
# SOURCE PROVENANCE (why this URL and not the author's site)
# ---------------------------------------------------------
# 1. The original upstream host `home.tiscali.cz` is dead (HTTP 502). WebBench 1.5
#    was last released 2004-06-25; there is no GitHub release, no distro orig
#    tarball (webbench has never been packaged in Debian — confirmed via the
#    sources.debian.org API and the Debian/Ubuntu/Gentoo/NetBSD/OpenBSD/
#    MacPorts distfile pools, all 404), and no other authoritative mirror.
#
# 2. The Internet Archive holds a byte-exact capture of the ORIGINAL upstream URL:
#      https://web.archive.org/web/20110727141838id_/http://home.tiscali.cz/~cz210552/distfiles/webbench-1.5.tar.gz
#    sha256 285088dcd2c20a09f091af4156b4afac3fbc1c4281da1add51592c30d7d43066
#    Evidence it is the genuine upstream artifact:
#      * every 200-status capture of that URL (2011-2024) shares one content
#        digest (DV6VAVPP7HOQ43QPCYGP4USAR4PUXTLP);
#      * the gzip header records mtime "Fri Jun 25 10:01:59 2004", matching the
#        1.5 release date in the bundled debian/changelog;
#      * the layout matches what upstream's own `make tar` target emits.
#    However, archive.org serves that payload with `Content-Encoding: x-gzip`
#    alongside `Content-Length: 7675`. Conan's source downloader honours the
#    encoding, inflates the stream to 30720 bytes and then aborts:
#        ConanConnectionError: Download failed ...
#        Transfer interrupted before complete: 30720 < 7675
#    A URL the recipe's own `conan create` cannot fetch is not usable.
#
# 3. The recipe therefore sources from a GitHub mirror of the SAME upstream
#    release, pinned to an immutable commit. Fidelity was verified file-by-file
#    on 2026-09-24 against the pristine archive.org extraction:
#
#      file               result
#      Makefile           IDENTICAL
#      socket.c           IDENTICAL
#      webbench.1         IDENTICAL
#      webbench.c         IDENTICAL
#      debian/changelog   IDENTICAL
#      debian/control     IDENTICAL
#      debian/copyright   IDENTICAL
#      debian/dirs        IDENTICAL
#      debian/rules       IDENTICAL
#      (COPYRIGHT and ChangeLog are symlinks in the upstream tarball; git stores
#       them as link targets, so they compare as "different" by construction —
#       the files they point at are identical.)
#
#    Every file that participates in the build is byte-identical to the upstream
#    release. Only the tarball container differs: GitHub prefixes the root
#    directory with the commit hash, which `strip_root=True` removes.

sources:
  url: "https://github.com/cnnewjohn/webbench/archive/b7b358e3c895572d0cd1d24eec7df4b95d835864.tar.gz"
  sha256: "92ed9f4ac06afcb9d89b5c947c30fe74139b15499cc4616ae3921df022b90438"

patches: []
