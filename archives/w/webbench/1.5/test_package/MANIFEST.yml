# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: webbench/1.5
homepage: "http://home.tiscali.cz/~cz210552/webbench.html"

# 上游测试命令 — 经源码核查：webbench 1.5 发布包**没有任何测试目标或测试目录**。
#
#   Makefile 目标: all, tags, install, webbench, webbench.o, clean, tar
#   .PHONY: clean install all tar
#
# 无 test / check 目标；解包后 9 个条目（含 debian/ 目录）中不存在
# tests/ test/ testing/ regression/ 目录；README/INSTALL/CONTRIBUTING 均不存在，
# 唯一文档是 webbench.1 man page 与 debian/ 打包元数据。
#
# 因此如实申报 upstream_total = 0，绝不用 test_package 冒充上游测试。
upstream_check_command: "none (upstream Makefile has no check/test target)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# 上游测试总数（如实申报，见上方源码证据）
upstream_total: 0
upstream_executed: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_webbench.sh
    description: >-
      打包产物消费者冒烟 13 项断言：二进制可执行、`-V` 输出 1.5 且退出码 0、
      无参数打印用法且退出码 2、`--help` 退出码 2、连接失败路径退出码 1、
      本地 HTTP 服务（python3 http.server，仅绑定 127.0.0.1，随机端口）启动成功、
      服务进程存活、对该本地服务执行 2 秒真实压测、报告含 Speed= 行、含 Requests 行、
      成功请求数 **严格大于 0**、失败请求数为 0、且未出现 "Some of our childrens died."。
    command: "bash test_webbench.sh <pkg_bin>"

# 为什么断言"成功请求数 > 0"而不是只断言"0 failed"
#
# 修复 _IONBF 之前，OHOS 上每次压测都输出
#   Speed=0 pages/min, 0 bytes/sec.
#   Requests: 0 susceed, 0 failed.
# 即成功与失败**都为 0**——只断言 "0 failed" 会把这种"根本没跑起来"的结果
# 误判为通过。因此本测试额外要求成功请求数严格大于 0，并显式拒绝
# "Some of our childrens died." 输出。这是本轮唯一一次收紧（而非放松）测试。

# 已知上游行为（不影响断言，但必须如实记录）
known_upstream_quirks:
  - >-
    bench() 以 `return i;` 结尾，而 `i` 是 `fscanf(f,"%d %d %d",&i,&j,&k)` 最后读入的
    值（最后一个子进程的 pages 计数），并非状态码。因此**压测成功时退出码是任意
    0-255 值**（实测 223）。退出码仅在压测前的路径（-V / 用法 / 连接失败）有意义。
    本测试因此对压测结果断言 stdout 报告内容，仅在 upstream 明确定义的路径上断言退出码。

# 测试断言总数 (近似值, 用于质量评估)
# 13 项断言，见上方 test_package_tests 描述
assertion_count: 13
