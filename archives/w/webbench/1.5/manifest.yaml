source:
  url: "https://github.com/cnnewjohn/webbench/archive/b7b358e3c895572d0cd1d24eec7df4b95d835864.tar.gz"
  sha256: "92ed9f4ac06afcb9d89b5c947c30fe74139b15499cc4616ae3921df022b90438"
  tar_format: tar.gz
  upstream_release_sha256: "285088dcd2c20a09f091af4156b4afac3fbc1c4281da1add51592c30d7d43066"
  note: >-
    原始上游站点 home.tiscali.cz 已下线（HTTP 502），webbench 从未进入 Debian/
    Ubuntu/Gentoo/NetBSD/OpenBSD/MacPorts 等发行版 distfile 池（均 404），
    上游无 GitHub release、无其他权威镜像。Internet Archive 保存了原始上游 URL 的
    逐字节快照（sha256 与上游发布值一致），但 archive.org 以
    `Content-Encoding: x-gzip` 投递该文件，conan 的 source 下载器会因此解压后
    与 Content-Length 不符而报错（Transfer interrupted before complete: 30720 < 7675），
    **该 URL 无法被 conan 自身下载**。故本配方改用同一上游发布的 GitHub 镜像并
    pin 到不可变 commit；已逐文件校验（Makefile/socket.c/webbench.1/webbench.c 及
    debian/* 全部与上游一致，仅 COPYRIGHT/ChangeLog 因上游为符号链接而按链接目标存储）。

build:
  system: makefile
  cc: clang
  dependencies: []

patches_applied: []

knowledge_gained:
  - "glibc 2.26 (2017) 起把 Sun RPC 从 libc 移出到 libtirpc：`<rpc/types.h>` 只有在安装了 libtirpc-dev 时才存在；musl/OHOS 从来没有该头文件。webbench 1.5 的 `#include <rpc/types.h>` 因此在 glibc>=2.26 与 OHOS 上**都**致命（fatal error: rpc/types.h: No such file or directory）—— 属现代系统回归，非 OHOS 特有问题"
  - "该 include 是残留无用的：MAXHOSTNAMELEN 来自 <sys/param.h>（在 OHOS 实测 = 64），bzero/index 来自 <strings.h>（OHOS 实测可用），getopt_long 来自 <getopt.h>，socket 接口来自 socket.c。删除该行即可，必要且充分（已实测编译+运行通过）"
  - "webbench bench() 以 `return i;` 结尾，而 i 是 fscanf 最后读入的子进程 pages 计数，不是状态码 —— 压测成功时退出码是任意 0-255 值（实测 223）。退出码只在 -V / 用法 / 连接失败路径上有意义。测试必须断言 stdout 报告而非退出码"
  - "上游 Makefile 的 all 目标会调用 ctags；构建时应显式指定 webbench 目标以避免无谓依赖"
  - "OHOS/musl 上对**读流**调用 `setvbuf(stream, NULL, _IONBF, 0)` 会使该流后续的 `fscanf` 返回 -1，且 feof/ferror 均为 0、errno 为 0（无声失败）。同环境下 `fgets`/`fread`/裸 read/普通文件 fscanf/sscanf 均正常，裸 read 从管道读取也正常；glibc 上带同一 setvbuf 亦正常。因此这是 OHOS 的 stdio 行为差异，且仅限 `setvbuf(_IONBF)` + `fscanf` 组合。webbench 父进程正是用该组合读取子进程结果，导致每次压测都报 \"Some of our childrens died.\" 且成功/失败请求数**均为 0**"
  - "该缺陷的隐蔽性：`Requests: 0 susceed, 0 failed` 中『0 failed』看起来像通过。只断言失败数为 0 会把『根本没跑起来』误判为成功；必须额外断言成功请求数 > 0。这是本轮唯一一次**收紧**测试断言"
  - "上游无任何测试目标/测试目录（Makefile 目标仅 all/tags/install/webbench/webbench.o/clean/tar），upstream_total = 0 有源码依据"
