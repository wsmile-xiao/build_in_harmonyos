software: wget
display: "GNU Wget"
description: "Non-interactive network downloader supporting HTTP, HTTPS and FTP"
category: network
homepage: "https://www.gnu.org/software/wget/"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "替代 toybox wget，功能更完整"
    - "SSL 需配合 --no-check-certificate 使用（缺少系统 CA 证书）"
    - "musl libc 未实现 secure_getenv()，需降级为 getenv"
    - "HMDFS umask 077 导致目录权限问题"
    - "config.guess/config.sub 位于 build-aux/ 子目录"
  common_dependencies:
    - openssl
    - zlib

versions:
  "1.19.1":
    status: published
    build_date: "2026-04-21"
