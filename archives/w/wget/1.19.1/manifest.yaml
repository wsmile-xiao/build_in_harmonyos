software: wget
version: "1.19.1"
status: partial
build_system: autotools
compile_date: "2026-03-23"

dependencies:
  required: [clang, openssl, zlib, pkg-config]
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  source: https://ftp.gnu.org/gnu/wget/wget-1.19.1.tar.xz
  configure_options:
    - --prefix=$HOME/usr/local
    - --with-ssl=openssl
    - --without-libpsl
  cflags: null

patches_applied:
  - file: 0001-build-aux-config-guess-harmonyos.patch
    purpose: build-aux/config.guess 添加 HarmonyOS 识别
  - file: 0002-build-aux-config-sub-harmonyos.patch
    purpose: build-aux/config.sub 添加 ohos 操作系统支持
  - file: 0003-tmpdir-secure-getenv.patch
    purpose: tmpdir.c 中 secure_getenv 降级为 getenv

compatibility:
  level: partial
  issues:
    - "SSL 证书验证失败（缺少系统 CA 证书），需使用 --no-check-certificate"
    - "SSL/TLS 证书固定测试失败（缺少完整证书配置）"
    - "文档编译失败（texi2pod.pl 权限问题）"
  notes: |
    功能比 toybox wget 更完整（支持 -q, -c, -r, -m 等），已替换系统 toybox wget。
    SSL 需要配合 --no-check-certificate 使用。
    支持 IPv6、HTTPS、digest 认证、NTLM、大文件。

test_results:
  type: automated
  total: 39
  passed: 34
  failed: 5
  note: "安装 Perl 模块（HTTP::Daemon, HTTP::Message, URI）后通过率从 16% 提升到 87%。失败测试为 HTTPS 公钥固定相关功能。"

knowledge_gained:
  - "wget 在鸿蒙上核心下载功能正常，需配合 --no-check-certificate 使用"
  - "测试框架依赖 HTTP::Daemon、HTTP::Message、URI 等 Perl 模块"
  - "SSL/TLS 证书固定测试失败是测试环境问题，非功能缺陷"
  - "功能比系统自带 toybox wget 更完整，已替换"
  - "config.guess/config.sub 在 wget 中位于 build-aux/ 子目录，不在根目录"
  - "旧版 config.guess（2017）不支持 GUESS= 赋值语法，必须用 echo+exit"
  - "musl libc 未实现 secure_getenv()，需降级为 getenv（E081）"
  - "wget 1.19.1 静态编译需要 libssl.a/libcrypto.a 在 lib/ 目录下"
