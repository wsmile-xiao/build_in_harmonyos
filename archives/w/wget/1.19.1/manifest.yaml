name: wget
version: 1.19.1
category: network
description: GNU Wget - The non-interactive network downloader

harmonyos:
  triplet: aarch64-unknown-linux-ohos
  libc: musl
  compiler: clang 15.0.4

build:
  source: https://ftp.gnu.org/gnu/wget/wget-1.19.1.tar.xz
  system: autotools
  dependencies:
    - clang
    - openssl
    - zlib
    - pkg-config
  
  configure_flags:
    - --prefix=${HOME}/usr/local
    - --with-ssl=openssl
    - --without-libpsl
  
  patches:
    - 0001-config-guess-harmonyos.patch
    - 0002-config-sub-harmonyos.patch

features:
  ssl: openssl
  zlib: yes
  ipv6: yes
  https: yes
  digest: yes
  ntlm: yes
  large_file: yes

test:
  total: 39
  passed: 34
  skipped: 0
  failed: 5
  failure_reason: "SSL/TLS 证书固定测试失败（测试环境缺少完整证书配置）"
  note: "安装 Perl 模块后，测试通过率从 16% 提升到 87%。失败测试为 HTTPS 公钥固定相关功能，非核心功能问题。"
  resolution: "已安装 HTTP::Daemon, HTTP::Message, URI 等 Perl 模块解决测试框架依赖问题"

issues:
  - SSL证书验证失败（缺少系统CA证书），需使用 --no-check-certificate
  - 文档编译失败（texi2pod.pl权限问题），手动安装二进制

install:
  binaries:
    - $HOME/usr/local/bin/wget

notes:
  - 已替换系统 toybox wget
  - 功能比 toybox wget 更完整（支持 -q, -c, -r, -m 等）
  - SSL 需要配合 --no-check-certificate 使用

build_date: 2026-03-23