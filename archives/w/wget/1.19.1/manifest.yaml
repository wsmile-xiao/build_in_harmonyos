name: wget
version: 1.19.1
category: network
description: GNU Wget - The non-interactive network downloader

harmonyos:
  triplet: aarch64-unknown-linux-ohos
  libc: musl
  compiler: clang 15.0.4

build:
  source: https://ftp.gnu.org/gnu/wget/wget-1.19.1.tar.xz
  system: autotools
  dependencies:
    - clang
    - openssl
    - zlib
    - pkg-config
  
  configure_flags:
    - --prefix=${HOME}/usr/local
    - --with-ssl=openssl
    - --without-libpsl
  
  patches:
    - 0001-config-guess-harmonyos.patch
    - 0002-config-sub-harmonyos.patch

features:
  ssl: openssl
  zlib: yes
  ipv6: yes
  https: yes
  digest: yes
  ntlm: yes
  large_file: yes

test:
  total: 85
  passed: 14
  skipped: 14
  failed: 57
  failure_reason: "缺少 Perl 模块 HTTP::Daemon，测试框架无法运行 HTTP 相关测试"
  note: "这是测试环境问题，非编译问题。FTP 测试通过，HTTP 测试因缺少测试框架依赖而失败。"

issues:
  - SSL证书验证失败（缺少系统CA证书），需使用 --no-check-certificate
  - 文档编译失败（texi2pod.pl权限问题），手动安装二进制

install:
  binaries:
    - $HOME/usr/local/bin/wget

notes:
  - 已替换系统 toybox wget
  - 功能比 toybox wget 更完整（支持 -q, -c, -r, -m 等）
  - SSL 需要配合 --no-check-certificate 使用

build_date: 2026-03-23