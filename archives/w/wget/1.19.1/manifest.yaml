software: wget
version: "1.19.1"
status: success
build_system: autotools
compile_date: "2026-04-21"

dependencies:
  required: [clang, openssl, zlib, pkg-config]
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  source: https://ftp.gnu.org/gnu/wget/wget-1.19.1.tar.gz
  configure_options:
    - --prefix=$HOME/usr/local
    - --with-ssl=openssl
    - --without-libpsl
  cflags: null
  extra_env:
    PKG_CONFIG_PATH: $HOME/usr/local/lib/pkgconfig

patches_applied:
  - file: 0001-build-aux-config.guess.patch
    purpose: build-aux/config.guess 添加 HarmonyOS 识别
  - file: 0002-build-aux-config.sub.patch
    purpose: build-aux/config.sub 添加 ohos 操作系统支持
  - file: 0003-configure.patch
    purpose: configure 脚本中 umask 077 改为 umask 022（修复 HMDFS setgid 权限问题 E085）
  - file: 0006-lib-tmpdir.c.patch
    purpose: tmpdir.c 中 secure_getenv 降级为 getenv（E081）

compatibility:
  level: partial
  issues:
    - "SSL 证书验证失败（缺少系统 CA 证书），需使用 --no-check-certificate"
    - "SSL/TLS 证书固定测试失败（缺少完整证书配置）"
    - "文档编译需手动运行 pod2man（HMDFS 权限限制）"
  notes: |
    功能比 toybox wget 更完整（支持 -q, -c, -r, -m 等），已替换系统 toybox wget。
    SSL 需要配合 --no-check-certificate 使用。
    支持 IPv6、HTTPS、digest 认证、NTLM、大文件。

test_results:
  type: automated
  total: 124
  passed: 98
  skipped: 17
  failed: 9
  note: |
    主测试套件 85/85 PASS+SKIP，0 FAIL。
    扩展测试套件 30/39 PASS，9 FAIL（全部为 HTTPS 证书/公钥固定相关，测试环境问题非功能缺陷）。
    需安装 Perl 模块（HTTP::Daemon, HTTP::Message, URI, Clone, LWP::MediaTypes）。

knowledge_gained:
  - "wget 在鸿蒙上核心下载功能正常，需配合 --no-check-certificate 使用"
  - "测试框架依赖 HTTP::Daemon、HTTP::Message、URI、Clone、LWP::MediaTypes 等 Perl 模块"
  - "SSL/TLS 证书固定测试失败是测试环境问题，非功能缺陷"
  - "config.guess/config.sub 在 wget 中位于 build-aux/ 子目录，不在根目录"
  - "旧版 config.guess（2017）不支持 GUESS= 赋值语法，必须用 echo+exit"
  - "musl libc 未实现 secure_getenv()，需降级为 getenv（E081）"
  - "HMDFS 上 umask 077 && mktemp -d 创建的目录因 setgid 位无法写入，需改为 umask 022（E085）"
  - "pod2man 等安装的 Perl 脚本需要通过 perl 命令执行（HMDFS 权限限制）"

