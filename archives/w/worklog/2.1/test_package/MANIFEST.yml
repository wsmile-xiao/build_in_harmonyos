# test_package/MANIFEST.yml — worklog 2.1
# CI L0e 要求本文件存在；用于声明上游测试来源与实测执行情况。

package: worklog/2.1
homepage: "https://github.com/atsb/worklog"

# ── 上游测试清点（R51）────────────────────────────────────────────────────
# 上游 tarball 共 8 个文件：Makefile / README / TODO / projects /
# worklog.c / worklog.h / worklog.1.gz / worklog.lsm
#   * 无 tests/ 目录、无 test/ 目录
#   * Makefile 目标仅 all / install / clean / dist —— 无 check / test 目标
#   * 无 ctest / pytest / CI 测试配置
# ⇒ 上游确无自动化测试套件（非「没环境」，是源码本身不存在）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# 上游 README 给出的唯一人工验证流程（已采纳为 T2 的基础）：
#   "To test worklog with the example projects file:
#        worklog project
#    Then look at the time.log* files created."
upstream_manual_verification: "worklog <config> → 观察 <log>.<KEY> 账本文件生成"

# ── 补全测试用例（本包新增，共 7 项，全部实测执行）────────────────────────
test_package_verification:
  - id: T1
    name: "T1_help_usage"
    kind: upstream_contract
    command: "worklog -h"
    expect: "退出码 0，stderr 打印 USAGE 用法"
  - id: T2
    name: "T2_upstream_example_ledgers"
    kind: upstream_manual_flow
    command: "worklog projects.example <tmp>/wl.log"
    expect: "主账本 + 8 个按项目键拆分的账本，共 9 个文件；已推进到 curses 初始化"
  - id: T3
    name: "T3_logfile_reparse"
    kind: functional
    command: "预置 [1.50 hours] 条目后重跑 worklog"
    expect: "历史账本被正确解析，stderr 无 \"Couldn't find\" 告警"
  - id: T4
    name: "T4_malformed_config"
    kind: negative
    command: "worklog <含非冒号行> 的配置"
    expect: "非 0 退出并报出 must be a colon"
  - id: T5
    name: "T5_missing_config"
    kind: negative
    command: "worklog <不存在的配置>"
    expect: "非 0 退出并报出 cannot open project configuration file"
  - id: T6
    name: "T6_ohos_home_default_dir"
    kind: harmonyos_specific
    command: "HOME=<tmp> 无参数启动 worklog"
    expect: "chdir($HOME) 生效，默认账本 worklog_time.log + 8 个项目账本共 9 个"
  - id: T7
    name: "T7_ohos_aarch64_elf"
    kind: harmonyos_specific
    command: "读 ELF e_machine（偏移 18，小端）"
    expect: "0xB7 (EM_AARCH64)，确认产物为 OHOS aarch64 而非宿主架构"
