# conandata.yml — worklog 2.1
#
# ⚠️ 本文件只允许出现下方 sources 段里那【一个】以 https:// 开头的 URL。
#    ci/conan/build_and_test.sh 的 Pre-download 步骤用正则抓取文件内所有
#    http(s) URL（含注释行），再用 str.replace 把它们换成本地 file:// 路径。
#    若注释里出现 sources.url 的【前缀】，replace 会连带把真正的 source URL
#    截断成 <hash>_<前缀文件名>/<剩余路径>，导致
#    "NotADirectoryError: Not a directory: .../archive/refs/tags/...tar.gz"。
#    （W3 本地跑 CI 门禁实测踩中，已按此约束注释写法。）
#
# 源码来源：官方上游 GitHub tag（authoritative upstream, R39）
#   仓库    : github.com/atsb/worklog        （注释刻意不带 https:// 前缀）
#   tag     : Worklog-2.1                    （tag 首字母大写，GitHub 区分大小写）
#   原作者  : Truxton King Fulton II
#   2.1 维护: Adam Bilbrough
#   许可证  : public domain（作者声明，详见 notes.md）
#   sha256  : 由官方 release tarball 实测得出
sources:
  url: "https://github.com/atsb/worklog/archive/refs/tags/Worklog-2.1.tar.gz"
  sha256: "7cc1aabb959c082aca51ccddf6075e08424785720289b17a8f3f4d24284dbcc3"

patches:
  - patch_file: "patches/0001-Makefile-honour-CC-and-EXTRA_CFLAGS.patch"
    patch_description: >-
      Build portability patch (no platform macros; R8 compliant), five edits:
      (1) add "CC ?= gcc" and replace the hardcoded gcc in the compile rule
      with $(CC), so the OHOS clang cross toolchain can be injected;
      (2) add "CFLAGS+=$(EXTRA_CFLAGS)" so the recipe can append the ncurses
      include path without clobbering the upstream CFLAGS line, whose
      -DVERSIONS=\"2.1\" relies on a second round of shell quoting;
      (3) add "LDFLAGS+=$(EXTRA_LDFLAGS)" and thread it into the link line,
      because the conan cache lib dir is not on the default search path;
      (4) honour LIBS from the command line (recipe passes -lncursesw) since
      the OHOS ncurses recipe only ships libncursesw.a, so upstream's
      -lncurses has no matching library;
      (5) fix an upstream bug: MAN already ends in man1, so install used
      $(MAN)/man1/worklog.1.gz and produced share/man/man1/man1/.
    patch_type: "portability"
