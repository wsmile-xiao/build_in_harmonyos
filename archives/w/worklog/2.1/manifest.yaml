software: worklog
version: "2.1"
status: built
build_date: "2026-10-01"
build_system: makefile

source:
  url: "https://github.com/atsb/worklog/archive/refs/tags/Worklog-2.1.tar.gz"
  sha256: "7cc1aabb959c082aca51ccddf6075e08424785720289b17a8f3f4d24284dbcc3"
  tar_format: tar.gz
  upstream_home: "https://github.com/atsb/worklog"
  upstream_tag: "Worklog-2.1"

build:
  system: makefile
  configure_options:
    - "CC=<OHOS clang，取自 tools.build:compiler_executables>"
    - "EXTRA_CFLAGS=-U_FORTIFY_SOURCE -fstack-protector-strong -I<ncurses include>"
    - "EXTRA_LDFLAGS=-L<ncurses lib>"
    - "LIBS=-lncursesw -lm -z now"
    - "install: PREFIX= DESTDIR= BIN=<package_folder>/bin MAN=<package_folder>/share/man/man1"
  dependencies:
    - ncurses/6.6
  cc: clang

patches_applied:
  - "0001-Makefile-honour-CC-and-EXTRA_CFLAGS.patch"

patch_classification:
  - file: 0001-Makefile-honour-CC-and-EXTRA_CFLAGS.patch
    type: portability
    platform_only: false
    guard: "无平台宏、无 __OHOS__；仅 CC/EXTRA_CFLAGS/EXTRA_LDFLAGS 可移植性改造 + 上游 man1 bug 修复，R8 合规"

functional_verification:
  version_check: "不适用（上游无 --version；-h 打印 USAGE，退出码 0）"
  execution_test: "7 项功能断言全部实测执行通过（见 test_package/MANIFEST.yml）"
  binary_type: "ELF64 AArch64 PIE，静态链接 ncursesw"
  ohos_specific:
    - "T6：DEFAULT_DIR_ENVVAR/HOME 默认工作目录路径实测通过"
    - "T7：产物 e_machine=0xB7 (EM_AARCH64) 校验通过"
