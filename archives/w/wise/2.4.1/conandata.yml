# conandata.yml — wise 2.4.1 (EBI Wise2 / Dynamite)
#
# 上游原站 http://www.ebi.ac.uk/~birney/wise2/ 已下线，官方分发镜像为
# Debian 源码池（同一个 wise_2.4.1.orig.tar.gz，与上游 tarball 字节一致）。
# sha256 已与 Debian wise_2.4.1-28.dsc 的 Checksums-Sha256 字段交叉校验一致。

sources:
  url: "https://deb.debian.org/debian/pool/main/w/wise/wise_2.4.1.orig.tar.gz"
  sha256: "0aec5e30739110783517a429606249fc6c5fd0d65171c1a6d79ecc5ff81d2935"

patches:
  - patch_file: "patches/0001-src-HMMer2-sqio.c.patch"
    patch_description: "HMMer2 sqio.c 自带静态 getline() 与 POSIX getline() 同名冲突（34 处），重命名为 wise2_getline()"
    patch_type: "portability"
  - patch_file: "patches/0002-src-models-phasemodel.c.patch"
    patch_description: "isnumber() 为 BSD 专有接口，musl 未提供，改用 isdigit((unsigned char)…)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-makefile.patch"
    patch_description: "顶层 makefile：① 递归子 make 的 glib 依赖改由配方注入（glib-config → $(GLIB_CFLAGS)/$(GLIB_LIBS)）；② bin 目标不再调用 csh welcome.csh（OHOS 无 csh）"
    patch_type: "portability"
  - patch_file: "patches/0004-src-corba-makefile.patch"
    patch_description: "corba/makefile 的 glib-config 调用改为 $(GLIB_CFLAGS)/$(GLIB_LIBS)"
