# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "OHOS/AArch64 上 char 默认无符号：上游用 char 接收 fgetc() 再与 EOF(-1) 比较（dynlibsrc/sequence.c 等），比较恒假使 EOF 被当成碱基写入，表现为序列长度 +1、坐标整体偏移、部分程序段错误。加 -fsigned-char 后上游 short.test 由 4/12 提升到 12/12 通过"
- "2007 年代代码依赖 tentative definition 合并语义，clang 15 默认 -fno-common 会报 multiple definition，必须显式 -fcommon"
- "上游面向 glib 1.2 的 glib-config 已不存在；补丁把 makefile 改为接收 $(GLIB_CFLAGS)/$(GLIB_LIBS)，由配方注入 Conan glib 包路径（make 命令行变量会自动传递给递归子 make）"
- "手写递归 makefile 的顶层入口是 src/makefile（小写），且 .c 与 .dy 同目录预生成；解包必须保留时间戳，否则 make 判定 .dy 更新而调用不存在的 dyc"
- "init-build 的 F068 嵌套源码提升对 wise2 误判：其 _BUILD_MARKERS 只认大写 Makefile，而 wise2 唯一的大写 Makefile 在 src/HMMer2/，会被错误提升到顶层毁掉目录树"
- "上游测试套件由 perl 驱动（src/test/testman.pl + short.test，12 用例，diff 比对参考 .out）；testman.pl 自身不返回失败码，需以 'Tests passed' 与 test.results 为空共同判定"
- "上游运行期数据（BLOSUM62.bla/codon.table/human.gf/gene.stat）默认按 cwd 或 $WISECONFIGDIR 查找，包内安装到 share/wise/wisecfg 并导出 WISECONFIGDIR"

