# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: wise/2.4.1
homepage: "https://www.ebi.ac.uk/~birney/wise2/"

# 上游测试入口: src/makefile 的 test 目标 →
#   cd test ; perl testman.pl -cf ../wisecfg < short.test
upstream_check_command: "make -C src test  (等价于 cd src/test && perl testman.pl -cf ../wisecfg < short.test)"

# conanfile.py build() 中已集成上游测试套件（12 个用例）
upstream_test_in_build: true
upstream_test_command: "perl testman.pl -cf ../wisecfg < short.test   # 在 src/test 下执行，12/12 通过"

# 上游 test/short.test 声明的用例（name / do / diff 三元组）
upstream_tests:
  - name: promoterwise
    description: "promoterwise 标准测试（human vs mouse 启动子区）"
  - name: basic-cdna
    description: "estwise 蛋白 vs cDNA，全输出选项"
  - name: basic-genomic
    description: "genewise 蛋白 vs 基因组，全输出选项"
  - name: hmm-binary-cdna
    description: "estwise 以二进制 HMM 为 query"
  - name: hmm-wrong-dna
    description: "genewise HMM vs 无匹配 DNA"
  - name: hmm-wrong-dna-est
    description: "estwise HMM vs 无匹配 DNA"
  - name: hmm-ascii-genomic
    description: "genewise 以 ASCII HMM 为 query"
  - name: genewise-db
    description: "genewisedb HMM vs DNA 库"
  - name: genewise-db-lite
    description: "genewisedb GWLITE 算法"
  - name: estwise-db
    description: "estwisedb HMM vs DNA 库"
  - name: pswdb
    description: "pswdb 蛋白库 Smith-Waterman 搜索"
  - name: genewisedb-pfam-mode
    description: "genewisedb Pfam 搜索模式"

# test_package 中的鸿蒙特有测试：7 个完整端到端消费者用例
# 每个用例 = 消费者构造输入 → 真实执行包内程序 → 读取包导出的 WISECONFIGDIR
#           → 产出真实比对结果 → 校验结果内容（任一步失败即该用例 FAIL）
test_package_tests:
  - file: test.sh
    description: "HC-1 消费链路入口（11 程序 PATH 定位 + WISECONFIGDIR 运行期数据 + 11 个 -version）"
    command: "bash test.sh"
  - file: test.sh
    description: "HC-2 genewise 蛋白 × 基因组 DNA 端到端比对"
    command: "bash test.sh"
  - file: test.sh
    description: "HC-3 estwise 蛋白 × cDNA 端到端比对"
    command: "bash test.sh"
  - file: test.sh
    description: "HC-4 dnal DNA × DNA 局部自比对（Score 2065）"
    command: "bash test.sh"
  - file: test.sh
    description: "HC-5 psw 蛋白 × 蛋白 Smith-Waterman 端到端比对"
    command: "bash test.sh"
  - file: test.sh
    description: "HC-6 dba DNA × DNA DBA 块自比对（score 695.64 / 100% / MATCH_D）"
    command: "bash test.sh"
  - file: test.sh
    description: "HC-7 promoterwise 双 DNA 启动子预测端到端（BLAST 报告 + Sbjct 区段）"
    command: "bash test.sh"

# 完整端到端消费者用例数（rule12 以用例数为准，非断言数）
end_to_end_case_count: 7
# 用例内断言总数（近似值，用于质量评估）
assertion_count: 40
