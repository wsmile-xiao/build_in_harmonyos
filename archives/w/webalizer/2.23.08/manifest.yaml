patches_applied:
  - "0001-fix-tmpdir-umask-for-hmdfs.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS 文件系统不支持 umask 077 创建的临时目录内写入文件，需改用 umask 022 并使用 TMPDIR"
  - "webalizer 2.23.08 源码在 GitHub hyc/webalizer 仓库，master 分支即为 2.23-08 版本"
  - "webalizer 依赖 gd、libpng、zlib，DNS 功能需要 libdb（可选禁用）"
