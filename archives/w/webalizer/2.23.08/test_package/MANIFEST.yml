# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: webalizer/2.23.08
homepage: "https://github.com/hyc/webalizer"

# 上游无 make check 目标，使用 -V 版本验证作为 smoke test
upstream_check_command: "webalizer -V"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "运行 webalizer -V 验证二进制可执行并报告版本"
    command: "./test_webalizer"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
