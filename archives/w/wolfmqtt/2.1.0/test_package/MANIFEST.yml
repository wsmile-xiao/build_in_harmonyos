# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wolfmqtt/2.1.0
homepage: "https://github.com/wolfSSL/wolfMQTT"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check TESTS=\"tests/unit_tests tests/test_mqtt_sn tests/test_mqtt_sn_client tests/test_broker_connect\""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check TESTS=\"tests/unit_tests tests/test_mqtt_sn tests/test_mqtt_sn_client tests/test_broker_connect\" -j1"

# 上游实际运行的测试程序
# 上游 v2.1.0 自带自动化测试套件（tests/）：check_PROGRAMS 声明
#   - tests/unit_tests          恒构建（framework 9 + test_mqtt_packet + test_mqtt_client）
#   - tests/test_mqtt_sn        （--enable-sn 启用）
#   - tests/test_mqtt_sn_client （--enable-sn 启用）
#   - tests/test_broker_connect （--enable-broker 启用，r02 新增纳入）
# r02 配方 --enable-sn --enable-v5 --enable-nonblock --enable-mt --enable-broker，
# make check 显式运行上述四 check_PROGRAMS（scripts/broker.test 为集成脚本非用户用例，
# 需 examples 二进制与 /bin/bash，OHOS 无，已排除；R51 脚本列台账不计用例）。
# r03 统计口径对齐：声明总数按审查端全量口径 = 485 用户用例 + test_framework.c 框架自测 9
# = 494（source_declared_total）；实例化/通过 = 487（用户 478 + framework 9）。
upstream_tests:
  - file: tests/unit_tests
    description: "unit_tests 二进制（unit_test.c + test_framework.c + test_mqtt_packet.c + test_mqtt_client.c），注册 313 = framework 9 + packet 245 + client 59"
    command: "./tests/unit_tests"
  - file: tests/test_mqtt_sn
    description: "MQTT-SN 报文解码用例（test_mqtt_sn.c + src/mqtt_sn_packet.c 直接编入），98 个独立 TEST() 用例"
    command: "./tests/test_mqtt_sn"
  - file: tests/test_mqtt_sn_client
    description: "MQTT-SN 客户端状态机用例（test_mqtt_sn_client.c），26 个独立 TEST() 用例"
    command: "./tests/test_mqtt_sn_client"
  - file: tests/test_broker_connect
    description: "Broker CONNECT 处理用例（test_broker_connect.c + src/mqtt_broker.c + persist 编入，WOLFMQTT_BROKER_CUSTOM_NET mock），50 个独立 TEST() 用例（声明 54，4 项互斥分支未实例化）"
    command: "./tests/test_broker_connect"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：以库使用者身份调用 MqttClient_Init/MqttClient_DeInit（TLS 构建，ABI 对齐），断言返回码 MQTT_CODE_SUCCESS 与客户端结构字段 msg_cb/cmd_timeout_ms/tx_buf/rx_buf"
    command: "./test_wolfmqtt"
  - file: test_ohos.c
    description: "鸿蒙专项测试：MqttEncode_Connect 编码 CONNECT 报文并断言线上字节（0x10 固定头/协议名 MQTT/protocol level/clean-session 0x02/client-id 载荷）、特性宏 ABI 传播（TLS/SN/V5/NONBLOCK/MT/BROKER）、版本头 2.1.0、MqttClient_Init 在 OHOS 运行时生命周期"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12