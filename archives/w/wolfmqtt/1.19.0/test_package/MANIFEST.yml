# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wolfmqtt/1.19.0
homepage: "https://github.com/wolfSSL/wolfMQTT"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 v1.19.0 无自动化测试套件：Makefile.am 的 TESTS/check_PROGRAMS/check_SCRIPTS
# 均为空，`make check` 无可执行目标；全源码无 TEST_CASE/add_test/ASSERT_ 测试宏，
# examples/ 为网络演示程序非自动化测试。清点证据见同版本 notes.md。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：以库使用者身份调用 MqttClient_Init/MqttClient_DeInit（TLS 构建，ABI 对齐），断言返回码 MQTT_CODE_SUCCESS 与客户端结构字段 msg_cb/cmd_timeout_ms/tx_buf/rx_buf"
    command: "./test_wolfmqtt"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
