# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "automake 1.4-p6 工程在 OHOS conan subprocess 环境下 make 触发 config.status --recheck，模板的 cat -/sort - 读 stdin 失败：绕过 make，从生成的 Makefile 提取 CC/CFLAGS/LIBS/LDFLAGS 与 *_SOURCES 逐文件编译后直接链接（ref: E576-draft-8E50）"
  - "automake 1.4 时代 tarball 自带 config.sub（2005）不识别 aarch64-linux-ohos：需补 maybe_os 列表 linux-ohos*、valid_machine 列表 aarch64/aarch64-*/aarch64be-*、OS 别名列表 -linux-ohos* 三处；另加在 -linux*) 之前的 case 分支 -linux-ohos*) os=-linux 会被前序别名列表先行匹配而永远不可达（且会把 OHOS triplet 映射成裸 -linux），故已从补丁中移除（ref: E490）"
  - "上游 inline 函数跨编译单元调用（debug/IncrementKeyOptimized）在 clang C99 下生成不了外部符号：-std=gnu89 恢复 gnu89 inline 语义（ref: E577-draft-9F21）"
  - "多个 .c 重复定义同名全局变量（actualTime/initialTime/lastTime）依赖老 gcc -fcommon：clang 15 默认 -fno-common，链接加 -Wl,--allow-multiple-definition 匹配原始工具链行为（ref: E491）"
  - "CI 工作机 conan 缓存位于 HMDFS/FUSE 挂载时，autotools config.status 的 mktemp -d（硬编码 0700）临时目录不可写（FUSE 忽略 chmod、属主重映射），Makefile 生成失败：在 build() 中把该创建改写为 umask 022 + mkdir（创建时即 0755）后重跑 config.status 可绕过；本地 /data 原生 FS 不复现（ref: E490）"

