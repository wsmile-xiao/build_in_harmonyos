# conandata.yml — weplab 0.1.5
# Source: the unmodified upstream tarball, recovered from the Debian
# "weplab_0.1.5.orig.tar.gz" upload (md5 713870965447b0b8b7341409968846fb,
# sha256 91e4425f474d5b3213effc6d532aa3ee2fb121a1942e43c08210780a4759a72b).
# This matches the tarball shipped in Debian source packages for jammy/sid,
# which is the canonical upstream release from weplab.sf.net (R39).
#
# The tarball unpacks to a single top-level directory "weplab-0.1.5", so the
# recipe sources it with strip_root=True.

sources:
  "0.1.5":
    url: "https://snapshot.debian.org/archive/debian/20200417T000000Z/pool/main/w/weplab/weplab_0.1.5.orig.tar.gz"
    sha256: "91e4425f474d5b3213effc6d532aa3ee2fb121a1942e43c08210780a4759a72b"

patches:
  - patch_file: "patches/0001-fix-gcc-arch-flags.patch"
    patch_description: >
      Remove x86-only gcc arch optimization flag block from configure.ac so
      the build succeeds on aarch64 clang.  The upstream version detection
      chain (gcc-3.0 / gcc-3.x / gcc-2.9x) reports the compiler as "not
      known" on clang anyway; this patch makes the behavior explicit by
      clearing the MARCH variable in the gcc-3.x branch.
    patch_type: "portability"
  - patch_file: "patches/0002-fix-config-sub-aarch64-ohos.patch"
    patch_description: >
      Add aarch64-* and aarch64be-* recognition to config.sub's valid_machine
      list, and map linux-ohos* to linux-gnu so that configure accepts the
      aarch64-linux-ohos triplet.
    patch_type: "portability"
