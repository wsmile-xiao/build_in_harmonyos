package: weplab/0.1.5
homepage: "https://weplab.sf.net"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  Zero upstream automated tests, established by three independent counts on the
  verified 0.1.5 tarball (sha256 91e4425f474d5b3213effc6d532aa3ee2fb121a1942e43c08210780a4759a72b,
  checked by the recipe's get() before unpacks). (1) There is no test directory:
  the tarball ships COPYING, ChangeLog, INSTALL, Makefile.am, Makefile.in,
  NEWS, README, aclocal.m4, config.guess, config.sub, configure, configure.ac,
  install-sh, main.c, missing, mkinstalldirs, and the *.c/*.h source files —
  and `test -d tests` reports ABSENT. (2) There is no check target:
  `make -n check` produces only the automake-generated `check-am: all-am`
  wrapper, with no registered test harness, and `grep -E 'TESTS|check_PROGRAMS'`
  in Makefile.am returns nothing. (3) There is no test source file and no
  harness: a grep for gtest/catch2/CUnit/ctest/check.h returns nothing.  This
  is not an environment limitation; the upstream release simply ships no
  tests.  The consumer tests below exercise the built package instead and are
  counted separately from upstream statistics.  Because no upstream test
  entry point exists, this package is NOT registered in
  ci/config/no_official_test.txt (that whitelist is for packages that have
  tests which cannot run in CI).

test_package_tests:
  # ---- ARTIFACT layer: asserted in test_package/conanfile.py -------------
  - file: conanfile.py
    name: artifact-elf-architecture
    outcome: passed
    description: >-
      llvm-readelf -h on the packaged bin/weplab must report "Machine: AArch64".
    command: "readelf -h <pkg>/bin/weplab"
  - file: conanfile.py
    name: artifact-codesign-section
    outcome: passed
    description: >-
      The packaged binary carries exactly one .codesign section after OHOS
      self-signing (0 means it cannot be exec'd, >1 means a botched re-sign).
    command: "readelf -SW <pkg>/bin/weplab"
  - file: conanfile.py
    name: artifact-needed-basenames
    outcome: passed
    description: >-
      Every DT_NEEDED entry is a bare soname. Observed set on the device:
      libpcap.so, libc.so — none may contain a slash, which would mean an
      absolute path was baked in. RPATH/RUNPATH count is 0.
    command: "readelf -d <pkg>/bin/weplab"
  - file: conanfile.py
    name: artifact-no-host-prefix-leak
    outcome: passed
    description: >-
      The raw bytes of bin/weplab contain no "/usr/local".  The recipe stages
      artifacts directly rather than running upstream's install rule whose
      PREFIX is hard-coded to /usr/local.
    command: "grep -c /usr/local in bin/weplab byte scan"
  # ---- HARMONYOS PCAP-SURFACE layer: ohos_pcap_format_probe.c -----------
  - file: ohos_pcap_format_probe.c
    name: pcap-lib-version
    outcome: passed
    description: >-
      pcap_lib_version returns a non-empty string, proving the shared
      library loads and the version query API works on this platform.
      Probe 1.
    command: "./ohos_pcap_format_probe (probe 1)"
  - file: ohos_pcap_format_probe.c
    name: pcap-dlt-constants
    outcome: passed
    description: >-
      DLT_IEEE802_11 and DLT_PRISM_HEADER are both positive and distinct —
      the two link-layer constants capture.c discriminates between before it
      will accept a capture handle. Probe 2.
    command: "./ohos_pcap_format_probe (probe 2)"
  - file: ohos_pcap_format_probe.c
    name: pcap-open-dead-creates-handle
    outcome: passed
    description: >-
      pcap_open_dead(DLT_IEEE802_11, 65535) returns a valid pcap_t* — the
      headless stand-in for the pcap_open_live() handle capture.c creates.
      Probe 3.
    command: "./ohos_pcap_format_probe (probe 3)"
  - file: ohos_pcap_format_probe.c
    name: pcap-datalink-matches
    outcome: passed
    description: >-
      pcap_datalink() on that handle reports DLT_IEEE802_11, so the guard in
      capture.c (datalink must be DLT_IEEE802_11 or DLT_PRISM_HEADER) is
      satisfiable on this platform. Probe 4.
    command: "./ohos_pcap_format_probe (probe 4)"
  - file: ohos_pcap_format_probe.c
    name: pcap-dump-write-file
    outcome: passed
    description: >-
      The savefile WRITE path weplab uses (pcap_dump_open + pcap_dump +
      pcap_dump_flush + pcap_dump_close) succeeds and produces a well-formed
      file: flush rc 0 and size 56 bytes (24-byte global header + 16-byte
      record header + 16-byte payload). Probe 5.
    command: "./ohos_pcap_format_probe (probe 5)"
  - file: ohos_pcap_format_probe.c
    name: pcap-offline-read-packet
    outcome: passed
    description: >-
      The savefile READ path (pcap_open_offline + pcap_datalink + pcap_next)
      re-opens the file just written, reports DLT_IEEE802_11 and returns the
      packet itself (non-null, caplen == 16). Probe 6.
    command: "./ohos_pcap_format_probe (probe 6)"
  - file: ohos_pcap_format_probe.c
    name: pcap-offline-missing-file-null
    outcome: passed
    description: >-
      pcap_open_offline() on a nonexistent path returns NULL and fills errbuf
      with a non-empty message — the exact error branch weplab's
      wep.c:OpenPcapFile() depends on before printing errbuf and exiting 2.
      Probe 7.
    command: "./ohos_pcap_format_probe (probe 7)"
  - file: ohos_pcap_format_probe.c
    name: pcap-datalink-boundary
    outcome: passed
    description: >-
      pcap_datalink_name_to_val on an invalid name returns -1, the documented
      boundary contract of the libpcap name table. Probe 8.
    command: "./ohos_pcap_format_probe (probe 8)"
  # ---- LOADER / PROCESS layer: test_weplab.sh ----------------------------
  - file: test_weplab.sh
    name: loader-version-banner
    outcome: passed
    description: >-
      `weplab -V` prints a banner containing "0.1.5" (-V is version, -v is
      verbose).  The banner is emitted at main.c:ShowVersion before any pcap
      call, so reaching it proves the loader accepted the ELF and the libpcap
      closure resolved.
    command: "weplab -V"
  - file: test_weplab.sh
    name: loader-version-exit-code
    outcome: passed
    description: >-
      `weplab -V` returns exit 0 — upstream's `exit(0)` in ShowVersion,
      not 127 (loader rejection) and not a signal death.
    command: "weplab -V; echo $?"
  - file: test_weplab.sh
    name: loader-option-table-parsed
    outcome: passed
    description: >-
      All six documented switches (-a, -b, -r, -y, -c, -k) are consumed by
      the getopt dispatcher without any of them falling through to usage().
    command: "weplab -a | -b | -r | -y | -c | -k"
  # ---- CAPABILITY layer: declared skipped, with observed signatures ------
  - file: test_weplab.sh
    name: cap-live-capture
    outcome: skipped
    description: >-
      Live packet capture needs a wireless interface and root privileges.
      Reported as WEP_TEST_SKIP with exit code and reason, never as a pass.
    command: "weplab -c -i lo"
  - file: test_weplab.sh
    name: cap-analyze-pcap
    outcome: skipped
    description: >-
      Attack analysis needs a real pcap input file.  Reported as WEP_TEST_SKIP
      with exit code and reason, never as a pass.
    command: "weplab -a /dev/null"

# Accounting (measured on OHOS PC aarch64 with conan create):
#   conan create exit code 0, log .ci_logs/conan_build_weplab_0.1.5.log
#   - Artifact layer: 4/4 pass
#   - PCAP probe: 8/8 pass (every probe has a real criterion; the pcap_close()
#     release of the dead handle is cleanup only and is NOT counted — the API
#     returns void, so it has no observable pass criterion)
#   - Loader/smoke: 3/3 pass, 2 skip
#   - 0 failures
#   Skipped cases carry their observed signature in the run log:
#     cap-live-capture  -> WEP_TEST_SKIP reason=needs-wireless-interface-and-root
#     cap-analyze-pcap  -> WEP_TEST_SKIP reason=needs-valid-pcap-input
static_upstream_test_files: 0
executable_test_cases: 17
measured_passed: 15
measured_skipped: 2
measured_failed: 0

test_case_count: 17
assertion_count: 17
