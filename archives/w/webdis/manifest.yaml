software: webdis
display: "Webdis"
description: "Redis 的 HTTP/WebSocket 接口：把每条 HTTP 请求映射为 Redis 命令，支持 JSON/raw/MessagePack/自定义输出格式"
category: network
homepage: "https://webdis.io/"
license: BSD-2-Clause

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游手写 Makefile（make → 单文件可执行 webdis），无 configure/generate 步骤，OHOS clang 直接编译，零补丁"
    - "0.1.22 tarball 已 vendored hiredis/jansson/http-parser/b64/md5/sha1（src/ 下），外部链接依赖只有 libevent"
    - "必须显式传上游 Makefile 的默认 CFLAGS：Conan 构建环境导出 CFLAGS 后 Makefile 的 `CFLAGS ?=` 不生效，-Isrc 丢失会报 hiredis/async.h not found"
    - "MessagePack 由上游按 /usr/lib/libmsgpack*.so 自动探测，OHOS 需显式接 msgpack-c 并补 FORMAT_OBJS（上游 CI 亦带 libmsgpack-dev）"
    - "webdis 动态链接 libevent（非 OHOS 系统同名库，无需静态化）；产物不内嵌 RPATH，运行期经 conanrun 的 LD_LIBRARY_PATH 解析"
    - "上游 Makefile 的 test 目标依赖 python3 + redis-server + tests/pubsub 压测客户端；pubsub 自身不收敛，仅 basic.py/limits.py/curl-tests.sh/ws-tests.py 可作判据"
  common_dependencies:
    - libevent
    - msgpack-c
  runtime_dependencies:
    - redis-server（webdis 是 Redis 的 HTTP 前端，必须配合 Redis 服务端使用）

versions:
  "0.1.22":
    status: built
    build_date: "2026-09-23"
    ref: "webdis/0.1.22"
