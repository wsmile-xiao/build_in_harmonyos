version: "0.1.22"

software: webdis

# published | built | failed | archived
status: built

build_date: "2026-09-23"
build_system: makefile

source:
  url: "https://github.com/nicolasff/webdis/archive/refs/tags/0.1.22.tar.gz"
  sha256: "4ee465f85999aeba3743a8ed6c7d79690bffe7a8ffb6c7ddec1d4bb6bd1d8685"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=clang（来自 tools.build:compiler_executables）"
    - "CFLAGS=上游默认值 + -DMSGPACK=1 + 依赖 include（必须显式传，见 knowledge_gained）"
    - "LDFLAGS=-L/-l libevent + libmsgpack-c（来自依赖 cpp_info）+ -pthread"
    - "FORMAT_OBJS=上游默认 + src/formats/msgpack.o"
    - "-j1"
  dependencies:
    - libevent/2.1.13
    - msgpack-c/7.0.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 Makefile 用 CFLAGS ?= 初始化编译参数；Conan 构建环境已导出 CFLAGS 时 ?= 不生效，-Isrc/-Isrc/jansson/src/-Isrc/http-pa\
    rser 会丢失并报 'hiredis/async.h file not found'，配方必须显式复述上游默认 CFLAGS"
  - "下游依赖（hiredis/jansson/http-parser）被 webdis 0.1.22 vendored 在 src/ 下，外部链接依赖只有 libevent；因此不需要先\
    适配这三个库"
  - "上游通过 ls /usr/lib/libmsgpack*.so 自动探测 MessagePack，OHOS 上不存在该路径；只传 -DMSGPACK=1 而不把 src/formats/msg\
    pack.o 加进 FORMAT_OBJS 会以 undefined symbol: msgpack_reply 链接失败"
  - "webdis 的 Redis 连接池在尚未建立连接时会把请求判为 CMD_REDIS_UNAVAIL（src/cmd.c:297）并回 503 空 body（src/worker.c:\
    249）；该竞态在 Linux 同样存在，端到端测试需先预热连接池"
  - "产物在链接时已由 OHOS 工具链写入 .codesign 段，byte copy 打包后仍可直接执行，无需二次签名"
