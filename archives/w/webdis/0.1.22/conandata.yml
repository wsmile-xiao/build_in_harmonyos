# conandata.yml — webdis 0.1.22
#
# Upstream: https://github.com/nicolasff/webdis  (Nicolas Favre-Felix, BSD-2-Clause)
# Site:     https://webdis.io/
#
# Tag tarball of the official repository.  The 0.1.22 release vendors the
# sources of its client-side dependencies (hiredis, jansson, http-parser, b64,
# md5, sha1) under src/, so the only external link-time dependency is libevent
# (plus optional MessagePack support, wired in by conanfile.py).
sources:
  url: "https://github.com/nicolasff/webdis/archive/refs/tags/0.1.22.tar.gz"
  sha256: "4ee465f85999aeba3743a8ed6c7d79690bffe7a8ffb6c7ddec1d4bb6bd1d8685"

# No patches: webdis 0.1.22 builds unmodified against the OHOS clang toolchain
# (see notes.md — the only build adjustment is passing the upstream Makefile's
# default CFLAGS/FORMAT_OBJS explicitly, which is a recipe-side decision).
patches: []
