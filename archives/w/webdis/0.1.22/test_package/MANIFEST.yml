# test_package/MANIFEST.yml
# 上游测试声明文件（CI 门禁 L0e 强制要求存在）

package: webdis/0.1.22
homepage: "https://webdis.io/"

# 上游构建入口（无 configure，`make` 即上游唯一构建入口）
upstream_check_command: "make"
upstream_test_in_build: false
upstream_test_command: "make test  (tests/basic.py + tests/limits.py + tests/pubsub)"

# ── 上游测试清点证据（2026-09-23，源码包 webdis-0.1.22.tar.gz，
#    sha256 4ee465f8…，GitHub tag tarball）──
# 1. 上游测试入口：根 Makefile 定义
#      test:      python3 tests/basic.py; python3 tests/limits.py; ./tests/pubsub -p 7379
#      test_all:  test perftest        （perftest → tests/bench.sh，需 apache2-utils）
# 2. tests/ 目录内容（14 项文件）：
#      basic.py        unittest，25 个用例（8 个 TestCase 类）
#      limits.py       unittest，2 个用例（超大 URL / 超大上传）
#      ws-tests.py     unittest，10 个用例（WebSocket 路径）
#      curl-tests.sh   2 个 shell 测试函数（大 PUT 上传、OPTIONS 空头）
#      pubsub.c        自建 libevent 压测客户端（450 读者 x 100000 消息，无 pass/fail 断言）
#      bench.sh        性能压测（需要 ab，不属于 `make test`）
#      websocket.c     WebSocket 交互示例客户端（tests/README.tests）
#      requirements.txt, Makefile, README.tests, websocket.html
# 3. 上游 CI（.github/workflows/build.yml，ubuntu-20.04 + redis:6.2.1-alpine sidecar）
#    只执行：`make` → `./webdis <ci.json>` → `./tests/basic.py` → `./tests/curl-tests.sh`
#    → 即上游自己在 CI 中并不运行 limits.py / ws-tests.py / pubsub / bench.sh。
# 4. 上游自跳过的用例：basic.py 的 TestPubSub.test_pubsub_basic 与
#    test_pubsub_many_messages 带 `@unittest.skip('Fails in GitHub actions')`。

# 上游自动化测试用例（本次实际执行的统计，详见 reports/test-report.md）
upstream_tests:
  - file: tests/basic.py
    cases: 25
    command: "python3 tests/basic.py -v"
    result: "23 passed / 0 failed / 2 skipped（上游自带 skip decorator）"
  - file: tests/limits.py
    cases: 2
    command: "python3 tests/limits.py -v"
    result: "2 passed / 0 failed"
  - file: tests/ws-tests.py
    cases: 10
    command: "python3 tests/ws-tests.py -v"
    result: "10 passed / 0 failed"
  - file: tests/curl-tests.sh
    cases: 2
    command: "bash tests/curl-tests.sh"
    result: "2 个测试函数、3 处断言全部 OK"
  - file: tests/pubsub
    cases: 0
    command: "./tests/pubsub -p 7379"
    result: "压测客户端，无 pass/fail 断言；OHOS 上不收敛（见 reports/test-report.md，上游 CI 亦不执行）"
  - file: tests/bench.sh
    cases: 0
    command: "make perftest"
    result: "未执行：需要 apache2-utils（ab），镜像中不存在；不属于 make test"

# test_package 中自带的测试（均为 python unittest 用例，真实拉起被测二进制交互）
test_package_tests:
  - file: test_consumer.py
    framework: unittest
    cases: 5
    description: "安装后消费者视角：进程存活、/crossdomain.xml 契约（200 + application/xml + 策略正文）、$TMPDIR 日志落盘、Redis 不可用时返回 503、SIGTERM 生命周期"
    command: "python3 test_consumer.py <webdis-bin> <redis-bin-dir>"
  - file: test_webdis_ohos.py
    framework: unittest
    cases: 16
    description: "HarmonyOS 平台契约 6 用例（ELF64/AArch64/PIE、musl 加载器、无 glibc、不可执行栈、无宿主构建路径）+ 真实 redis/HTTP/WebSocket/流式订阅端到端 10 用例"
    command: "python3 test_webdis_ohos.py <webdis-bin> <redis-bin-dir>"

# 新增测试规模（AST 实测）：21 个 unittest 用例，共 44 处断言点
test_case_count: 21
assertion_count: 44
