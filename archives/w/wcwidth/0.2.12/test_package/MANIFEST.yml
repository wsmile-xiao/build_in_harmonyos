    command: "python3 -m pytest -o addopts='' tests/test_emojis.py -q"
    result: passed
  - file: tests/test_ucslevel.py
    source: wcwidth-0.2.12/tests/test_ucslevel.py
    description: "Unicode version selection behavior"
    command: "python3 -m pytest -o addopts='' tests/test_ucslevel.py -q"
    result: passed

test_package_tests:
  - file: test_wcwidth.py
    description: "Consumer API checks for version, narrow, wide, combining and string widths"
