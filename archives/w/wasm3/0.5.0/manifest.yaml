# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.5.0"

# 软件名
software: "wasm3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/wasm3/wasm3/archive/refs/tags/v0.5.0.tar.gz"

  # 源码校验和（官方 release tarball，与 v0.5.0 标签一致）
  sha256: "b778dd72ee2251f4fe9e2666ee3fe1c26f06f517c3ffce572416db067546536c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_WASI=simple"
    - "-DBUILD_NATIVE=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（本库经验,knowledge_decision=path_a_no_knowledge）
knowledge_gained:
  - "wasm3 0.5.0 默认 BUILD_WASI=uvwasi 会在 configure 时 FetchContent 拉取外部 uvwasi 依赖；改用内置 simple WASI（-DBUILD_WASI=simple）可无外部依赖构建（网络不可达时 uvwasi 拉取失败）"
  - "wasm3 的 CMakeLists 在 project() 之前即 set(BUILD_WASI ... CACHE) 默认值，conan toolchain 的 CACHE 变量注入无效；必须在 cmake.configure(variables=...) 以 -D 形式强制传入"
  - "wasm3 上游无 make install 目标（cmake.install 为空），需在 package() 中手动 copy 静态库与头文件"
  # 例如:
  # - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
  # - "内嵌 libuv 需要禁用，使用系统 libuv"