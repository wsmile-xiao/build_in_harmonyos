# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: wasm3/0.5.0
homepage: "https://github.com/wasm3/wasm3"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N (无注册 ctest 目标)；上游测试为 test/ 目录脚本 + 自托管 wasm"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本地实测通过，见 notes.md）
upstream_tests:
  - file: test/internal/m3_test.c
    source: wasm3-0.5.0/test/internal/m3_test.c
    description: "wasm3 内部单元测试（signatures/codepages/extensions/multireturn 全通过）"
    command: "clang -I source -I source/extensions test/internal/m3_test.c source/extensions/m3_extensions.c libm3.a -lm && ./m3_test"
  - file: test/self-hosting/wasm3-fib.wasm
    source: wasm3-0.5.0/test/self-hosting/wasm3-fib.wasm
    description: "自托管 fib 测试（wasm3 运行自身编译产物，Result: 832040）"
    command: "wasm3 test/self-hosting/wasm3-fib.wasm"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：解析并运行最小 wasm 模块，add(20,22)=42 校验 x5"
    command: "./test_wasm3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
