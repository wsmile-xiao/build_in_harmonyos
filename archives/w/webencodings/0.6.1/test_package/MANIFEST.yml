# test_package/MANIFEST.yml — webencodings 0.6.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: webencodings/0.6.1
homepage: "https://github.com/SimonSapin/python-webencodings"

# 上游测试套件：tests/test_webencodings.py（pytest 套件，webencodings 零依赖）
upstream_check_command: "pytest tests/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: tests/test_webencodings.py
    source: webencodings-0.6.1/tests/*.py
    description: "pytest 套件（通过率见 PR 描述实测回填）"
    command: "pytest tests/"

# test_package 消费者测试（R34 真实 API：import 打包的 webencodings + lookup）
test_package_tests:
  - file: test_webencodings.py
    description: "Imports packaged webencodings and looks up a WHATWG encoding by name ('utf-8'), asserting the result"
    command: "python3 test_webencodings.py"

# 断言总数：1（lookup 结果校验）
assertion_count: 1
