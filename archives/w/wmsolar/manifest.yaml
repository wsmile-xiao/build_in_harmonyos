software: wmsolar

display: "wmSolar — Window Maker dockapp"
description: "Window Maker/X11 dockapp that renders a heliocentric view of the solar system (90 degrees); pure C/C++ astronomy code (VSOP87/Lunar/Pluto/RiseSet) with an X11 XPM dockapp front-end"
category: utility
homepage: "https://github.com/engerim42/wmsolar"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "Hand-written Makefile (no configure); CC defaults g++ and compiles both .c and .cpp with C++ mode."
    - "Makefile INCDIR/LIBDIR/LIBS hard-code /usr/X11R6; the Conan recipe feeds dependency include/lib paths in via those variables."
    - "C++17 requires constexpr for in-class static double member init (SYNODIC_MONTH in Lunar.h)."
    - "OHOS arm64 plain char is unsigned; lunar/pluto coefficient tables with -1/-2 must use signed char."
    - "Vsop.cpp needed explicit #include <math.h> for cos() under clang."
    - "Upstream tarball uses CRLF line endings; generated patches must keep CRLF or GNU patch dry-run fails with 'different line endings'."
    - "OHOS llvm lld needs llvm/lib on LD_LIBRARY_PATH for libxml2.so.16 at link time."
    - "test_package must add /system/lib64 to LD_LIBRARY_PATH so libc++_shared.so resolves at runtime."
    - "GUI dockapp: no X server on OHOS, smoke test asserts XOpenDisplay failure (dependency chain loads)."
  common_dependencies:
    - "libxpm/3.5.17"
    - "libx11/6.4.0"
    - "libxext/6.4.0.1"

versions:
  "1.1":
    status: built
    build_date: "2026-09-23"