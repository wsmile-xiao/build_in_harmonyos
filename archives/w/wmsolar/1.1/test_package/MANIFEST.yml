# test_package/MANIFEST.yml — wmsolar 1.1
# CI L0e requires this file to exist.

package: wmsolar/1.1
homepage: "https://github.com/engerim42/wmsolar"

# wmsolar has no upstream test suite (2015 plain-Makefile dockapp, no `make check` target)
upstream_check_command: "make"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: |
      Consumer tests for the wmsolar package:
      1. wmSolar binary is installed on PATH.
      2. wmSolar when run reaches XOpenDisplay ("can't open display" is the
         expected outcome on OHOS — no X server — proving the Xpm/X11/Xext
         dependency chain loads).
      3. DarkCal (upstream console astronomy program, no X11) end-to-end
         consumer use case: run "DarkCal 9 2026" with a location cfg and
         verify the produced September2026.txt per-day darkest-hours table
         (>= 20 tab-delimited rows, contains month header). This genuinely
         exercises the package's calculation pipeline.
    command: "bash test.sh"

# Approximate assertion count (wmSolar presence + XOpenDisplay reach + DarkCal e2e table)
assertion_count: 3