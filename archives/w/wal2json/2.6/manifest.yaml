software: wal2json
version: "2.6"
status: published
build_date: "2026-06-11"

source:
  url: "https://github.com/eulerto/wal2json/archive/refs/tags/wal2json_2_6.tar.gz"
  sha256: "18b4bdec28c74a8fc98a11c72de38378a760327ef8e5e42e975b0029eb96ba0d"
  tar_format: tar.gz

build_system: custom
build:
  system: custom
  configure_options:
    - "PGXS (PostgreSQL Extension Building Infrastructure)"
    - "pg_config wrapper for header resolution"
    - "Direct compilation: clang -fPIC -O2 -DHAVE_CONFIG_H -D_GNU_SOURCE"
  dependencies:
    - "postgresql/16.4 (dev headers + pg_config)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "wal2json 使用 PGXS 构建系统，需要 pg_config 和 PostgreSQL server 开发头文件"
  - "cmd-pkgs 无 PostgreSQL 预编译包，需从源码获取头文件"
  - "创建最小 pg_config wrapper 脚本解决构建依赖"
  - "E007: PostgreSQL config.guess/config.sub 需补丁识别 HarmonyOS"
  - "E097: PostgreSQL config.status 在 HMDFS 上无法创建临时文件，用 Python 脚本手动处理 .in 模板"
  - "PG_INT64_TYPE 在 aarch64 上应为 'long int' (long=8byte)，不是 'long long int'"
  - "pg_config_os.h 从 PostgreSQL port/linux.h 复制"
  - "wal2json.so 仅依赖 libc.so，导出 _PG_init 和 _PG_output_plugin_init"