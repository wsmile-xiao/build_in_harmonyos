software: wal2json
display: "wal2json"
description: "PostgreSQL 逻辑解码输出插件，将 WAL 变更集转换为 JSON 格式"
category: db
homepage: "https://github.com/eulerto/wal2json"
license: BSD-3-Clause
build_system: custom

ohos_adaptation:
  key_points:
    - "wal2json 使用 PGXS (PostgreSQL Extension) 构建系统，需要 pg_config 和 PostgreSQL server 开发头文件"
    - "cmd-pkgs 无 PostgreSQL 预编译包，需从源码获取头文件，创建 pg_config wrapper 脚本"
    - "PostgreSQL config.status 在 HMDFS 上无法创建临时文件（E097），需 Python 脚本手动处理 .in 模板"
    - "PG_INT64_TYPE 在 aarch64 上应为 'long int' (long=8byte)"
    - "wal2json 回归测试需要 PostgreSQL 服务器运行环境"
  common_dependencies:
    - "postgresql (开发头文件)"

versions:
  "2.6":
    status: published
    build_date: "2026-06-11"