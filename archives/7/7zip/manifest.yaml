software: 7zip
display: "7-Zip"
description: "高压缩比文件归档工具，支持 7z、ZIP、GZIP 等多种格式"
category: compress
homepage: "https://www.7-zip.org"
license: LGPL-2.1
build_system: makefile

ohos_adaptation:
  key_points:
    - "7zip 使用自定义 Makefile，不使用 autotools/cmake"
    - "需设置 CXX=clang++ 和 CC=clang，并指定 --target=aarch64-linux-ohos"
    - "Makefile 中需修改 DISABLE_RUST=1 或处理 Rust 依赖"
  common_dependencies: []

versions:
