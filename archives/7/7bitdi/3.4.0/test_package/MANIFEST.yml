# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: 7bitdi/3.4.0
homepage: "https://github.com/7bitcoder/7bitDI"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ctest 全量 745 项: Unit + Integration + E2E.BigLoadTest)
upstream_tests:
  - file: Tests/Unit/UnitTests.cpp
    source: 7bitDI-3.4.0/Tests/Unit
    description: "Unit tests (ServiceCollection/ServiceProvider/Descriptor/Lifetime)"
    command: "./UnitTests"
  - file: Tests/Integration/IntegrationTests.cpp
    source: 7bitDI-3.4.0/Tests/Integration
    description: "Integration tests (DI resolution, factories, inheritance, scoped)"
    command: "./IntegrationTests"
  - file: Tests/E2E/BigLoadTest.cpp
    source: 7bitDI-3.4.0/Tests/E2E
    description: "E2E big-load resolution test"
    command: "./BigLoadTest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：真实调用 7bitDI API（注册/构建/注入/断言）"
    command: "./test_7bitdi"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 745