# 版本级 manifest — 7bitdi 3.4.0

version: "3.4.0"
software: "7bitdi"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag）
  url: "https://github.com/7bitcoder/7bitDI/archive/refs/tags/v3.4.0.tar.gz"

  # 源码校验和（SHA-256）
  sha256: "8381102f5966a5d83cf590b8fa45904d055d74ec90822628240786ab100fb929"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-D_7BIT_DI_LIBRARY_TYPE=HeaderOnly"
  - "-D_7BIT_DI_INSTALL=ON"
  - "-DCMAKE_CXX_STANDARD=17"

  # 编译依赖列表（header-only 库，无运行时依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无需补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "7bitDI 为 header-only C++17 DI 容器，配方需设 _7BIT_DI_LIBRARY_TYPE=HeaderOnly，包类型 header-library"
- "上游测试 745 项（Unit+Integration+E2E）在 OHOS aarch64 工具链全量通过"
