# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.23.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.23.6"
software: "jenkins-debian-glue"
status: published
build_date: "2026-10-11"
build_system: none

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/mika/jenkins-debian-glue/archive/refs/tags/v0.23.6.tar.gz"
  sha256: "c00b4b4d9f1e5a53322809699c89f78c8a457782ecc25599273835b4ca6c7328"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_config:
  # 纯脚本工具，无编译；package() 直接按上游 Makefile install 语义
  # 安装 scripts/* + tap/* → bin/，examples + pbuilder-hookdir → share/
  configure_options: []
  make_targets: []
  patches:
    - patches/0001-ohos-portability.patch

# ============================================================
# 依赖
# ============================================================

dependencies: []   # 无 conan 依赖；运行时依赖系统 bash/grep/file/ruby

# ============================================================
# 测试
# ============================================================

test:
  upstream_test_command: "make check"
  upstream_test_framework: "shunit2 + ruby TAP"
  upstream_tests_total: 18
  test_package_replayed: 21
  test_package_passed: 21
  pass_rate: "100%"
  notes: >
    shunit2 在 OHOS 不可用，上游 18 项断言以纯 bash 逐项 1:1 重放；
    file-detection 的 mimetype 文案断言按 OHOS file(1) 实际输出
    （[/bin/sh script]）放宽为前后缀匹配，检测行为等价。

# ============================================================
# 适配笔记
# ============================================================

adaptation_notes:
  - "纯 shell/ruby 脚本工具，零编译（package_type=application，package_id 清空）"
  - "补丁1：shebang /bin/bash → /usr/bin/env bash（OHOS 无 /bin/bash）"
  - "补丁2：tap/* 的 file(1) 探测去掉 -Pbytes=32/-i（OHOS file 不支持），mimetype 匹配 /script/i（Debian/OHOS 等价）"
  - "语言预检说明：lang-preflight 判 mixed 系误报（D.4 规则将 bash 排除出主体统计，
     剩余唯一非 bash 文件 fabfile.py 被判主体 100%，与打包用顶层 Makefile 触发冲突规则）。
     本包实际主体为 bash 脚本工具，走 v12.21 脚本工具配方路径，零编译，无 C/C++ 工具链需求"
