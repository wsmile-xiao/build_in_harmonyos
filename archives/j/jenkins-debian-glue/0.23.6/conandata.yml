patches:
  - patch_file: "patches/0001-ohos-portability.patch"
    patch_type: "portability"
    patch_description: >
      OHOS 平台可移植性修复：(1) scripts/* 与 pbuilder-hookdir/B90lintian 的
      shebang /bin/bash 改为 /usr/bin/env bash（OHOS 无 /bin/bash）；
      (2) tap/* 辅助脚本 file(1) 探测去掉 OHOS file 实现不支持的
      -Pbytes=32/-i 选项，mimetype 匹配放宽为 /script/i（Debian 与 OHOS
      行为等价，上游测试语义不变）
