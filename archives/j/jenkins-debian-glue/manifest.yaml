# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: jenkins-debian-glue
display: "jenkins-debian-glue"
description: "Jenkins CI 构建 Debian 软件包的粘合脚本集（jdg-*），含 git/svn 快照生成、reprepro 仓库管理与 TAP 质量检测辅助脚本"
category: build-tool
homepage: "https://github.com/mika/jenkins-debian-glue"
license: MIT

build_system: none

ohos_adaptation:
  key_points:
    - "纯 shell/ruby 脚本工具，零编译；package() 按上游 Makefile install 语义安装"
    - "shebang /bin/bash → /usr/bin/env bash（OHOS 无 /bin/bash）"
    - "tap/* file(1) 探测移植：去掉 -Pbytes=32/-i 选项，mimetype 匹配 /script/i"
  common_dependencies: []   # 运行时依赖系统 bash/grep/file/ruby（OHOS PC 均内置）

versions:
  "0.23.6":
    status: published
    build_date: "2026-10-11"
