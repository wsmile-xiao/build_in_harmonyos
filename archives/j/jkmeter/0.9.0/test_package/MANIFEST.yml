package: jkmeter/0.9.0
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"

upstream_check_command: "make -C source check"
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  The 0.9.0 tarball ships AUTHORS, COPYING, README, share/ (meter graphics)
  and source/: the source/Makefile defines only all, install, uninstall and
  clean targets. There is no test/check target and no test directory, so
  `make -C source check` fails with "No rule to make target 'check'". The
  tool is exercised instead by the packaged smoke test below.

test_package_tests:
  - file: test_jkmeter.sh
    description: >-
      Runs the packaged tool against the staged runtime shared-library
      closure: `jkmeter -help` must print the "jkmeter-0.9.0" version banner,
      and jkmeter with no arguments and no X server must exit 1 with
      "Can't open display." (clean early-exit path) rather than 127 (loader
      failure). On OHOS the closure is copied and ELF-signed, mirroring the
      aliki/clxclient OHOS pattern.
    command: "test_jkmeter.sh"

test_case_count: 2
assertion_count: 3
