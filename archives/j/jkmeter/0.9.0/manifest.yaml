# 版本级 manifest
# 文件位置: archives/j/jkmeter/0.9.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.0"

# 软件名
software: "jkmeter"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方直链，PF7）
  url: "https://kokkinizita.linuxaudio.org/linuxaudio/downloads/jkmeter-0.9.0.tar.bz2"

  # 源码校验和
  sha256: "0062ca9a0d000b937364567ff41e3bf15798807c839d1a981e7fe6aedfdb7378"

  # 压缩格式
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表（配方 make 命令行覆写）
  configure_options:
  - "CXX=<profile tools.build:compiler_executables[cpp]>"
  - "PCONFCFL=<依赖 include 目录> -DCLTHREADS_NO_PTHREAD_CANCEL"
  - "LDFLAGS=<依赖 lib 目录>"
  - "install PREFIX=/ DESTDIR=<package_folder>"

  # 编译依赖列表（格式: name/version，全部已发布）
  dependencies:
  - clxclient/3.9.2
  - clthreads/2.4.0
  - jack/1.9.22
  - libpng/1.6.58.3
  - libsndfile/1.2.2
  - freetype/2.14.3
  - libx11/1.8.13
  - libxft/2.3.8
  - xorgproto/2025.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-source-Makefile.patch (portability: 删 -march=native; INSTALL 参数化默认 /bin/install; pkg-config freetype2 探针改 $(PCONFCFL) 注入槽)"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "conan buildenv PATH 无 toybox install applet：裸 Makefile 的字面 install 命令报 127，参数化为 $(INSTALL) 并默认绝对路径 /bin/install（E098/E108 家族，aliki 同解）"
- "缓存包复跑时 test_package 对已签 ELF os.chmod 报 EPERM（E046 HMDFS 变体）：chmod 改防御式，执行位已在即跳过，stat 校验兜底"
- "新 CONAN_HOME 需 conan remote disable conancenter（否则排在 ohpcd 前拉 libxml2 超时）；对齐 home-bverify 模板 global.conf（tools.build:jobs=2 + core.sources:download_cache=~/tmp/ch/dlcache）"
