package: jinx/1.3.10
homepage: "https://github.com/JamesBoer/Jinx"

upstream_test_in_build: true
upstream_test_command: "./UnitTests   # 由 build() 内 cmake.build(target=\"UnitTests\") 产出后直接执行"

upstream_tests:
  - name: "Jinx upstream Catch2 unit suite"
    count: "1045 assertions in 14 test cases (0 failed)"
    description: >-
      Upstream ships one assertion-bearing suite: Tests/UnitTests (16 .cpp files — 14
      Test*.cpp plus Main.cpp and UnitTest.cpp — with the bundled Catch2 amalgam
      Tests/UnitTests/catch.hpp). Counts taken from the pristine v1.3.10
      tarball and re-measured on the device:
        grep -cE '^TEST_CASE' Tests/UnitTests/*.cpp                    -> 14
        grep -cE '^[[:space:]]*SECTION' Tests/UnitTests/*.cpp          -> 326
        grep -cE '^[[:space:]]*REQUIRE\(' Tests/UnitTests/*.cpp        -> 1044
      The recipe builds the UnitTests target and executes it from build(); Catch2 prints
      "All tests passed (1045 assertions in 14 test cases)" when everything is green and a
      summary table otherwise, so the parser reads BOTH shapes and raises ConanException
      unless test cases >= 14 and assertions >= 1044 with zero failures. A suite that did
      not actually run therefore cannot produce a package.
      The other three upstream executables are not assertion suites and are excluded with a
      reason: Tests/Features needs a script path argument, Tests/FuzzTests needs an external
      corpus, Tests/PerfTest is a benchmark without pass/fail.

test_package_tests:
  - file: test_package.cpp
    description: "Consumer suite (33 assertions) over the Conan Jinx::Jinx target: GetVersionString identity, runtime creation, Compile/CreateScript/Execute loop, upstream TestCasts casting semantics (integer/string/boolean/number coercion), collection size, loop accumulation, undeclared variable returning Null, upstream TestErrors negative case (bare '---' fails to compile), two independent runtimes and runtime reuse."
    command: "conan create . --build=missing"
  - file: harmonyos_test.cpp
    description: "HarmonyOS-specific consumer suite (33 assertions): __OHOS__ platform identity, OHOS LP64 data model (pointer/size_t/long are 8 bytes), int64 values above INT32_MAX kept as integers, UTF-8 byte-oriented string round trip on musl (7 bytes for 'αβ⨉'), coroutine context switch via 'async call' (aarch64), default GlobalParams::maxInstructions=2000 guard rejecting an oversized script instead of spinning, raised budget (documented host integration) completing the same 1001-statement script with the right sum, four threads each owning one runtime, and 2000 create/destroy cycles for allocation stability."
    command: "conan create . --build=missing"

assertion_count: 66
