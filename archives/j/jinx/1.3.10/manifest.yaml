version: "1.3.10"
software: "jinx"

# published | built | failed | archived —— 本机/真机实测状态，CI 出结果后按实际更新
status: built
build_date: "2026-10-03"
build_system: "cmake"

source:
  # 官方发布形式只有 git tag 归档（上游不发 release 资产）
  url: "https://github.com/JamesBoer/Jinx/archive/refs/tags/v1.3.10.tar.gz"
  sha256: "5b3a3e6c2c4b976dfdb16519aee7299c98dbf417b8179099a5509a5fd4d513ac"
  tag: "v1.3.10"
  tar_format: tar.gz

build:
  system: cmake
  # 上游 0 个外部依赖（纯 C++17，Source/*.cpp → libJinx.a）
  dependencies: []
  test_dependencies: []
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Jinx 顶层 CMakeLists 没有任何 install() 规则，且 add_library(Jinx) 的 PUBLIC 头不是独立目录（消费者 include 的 Source/Jinx.h 又传递 include JxBuffer/JxCollection/JxCoroutine/JxMemory/JxTypes/JxVariant 6 个头）→ package() 必须自己按「Jinx.h 的本地 include 闭包」挑 7 个头拷进 include/，只拷 Jinx.h 的消费者会在预处理期就找不到后续 include"
  - "Jinx::GlobalParams::maxInstructions 默认只有 2000，长脚本会以 `Runtime error in script ...: Exceeded max instruction count` 让 Execute() 返回 false（不是崩溃也不是挂死）。宿主要跑大脚本必须像上游 Tests/Features/Main.cpp 那样先 Jinx::Initialize(params) 抬高预算；这个默认值同时是「解释器护栏在 OHOS/aarch64 上确实生效」的可断言行为，值得写成鸿蒙平台用例而不是绕过去"
  - "Catch2 全绿时只打印 `All tests passed (1045 assertions in 14 test cases)` 一行，不打印 test cases/assertions 汇总表——只按汇总表解析会把「全部通过」误判成「没跑测试」。配方解析必须同时认这两种形态，并对 14/1044 设下限，否则「测试没真跑也照样出包」的假绿检不出来"
  - "上游库目标在非 MSVC 分支带 -Wall -Wextra -pedantic -Werror；clang 15 + libc++ 下 21 个源文件全干净，因此不需要任何去 -Werror 补丁——先真跑再决定打不打补丁，避免留下没有成因的改动"
