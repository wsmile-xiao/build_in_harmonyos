# 文件位置: archives/{letter}/{name}/1.9.22/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.9.22"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jackaudio/jack2/archive/refs/tags/v1.9.22.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-common-JackControlAPI.cpp.patch"
  - "0002-linux-alsa-hammerfall.c.patch"
  - "0003-posix-JackPosixThread.h.patch"
  - "0004-waflib-Context.py.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OpenHarmony 不支持 pthread_cancel/pthread_setcanceltype，需用 #ifndef __OHOS__ 条件编译替代"
  - "jack2 的 waf 构建系统 Python 3.12 不兼容，waflib/Context.py 中的 imp.new_module 需替换为 types.ModuleType"
  - "jack2 的 JackPosixThread.h 构造函数默认参数 PTHREAD_CANCEL_ASYNCHRONOUS 在 OpenHarmony 未定义"
  - "jack2 ALSA 驱动 hammerfall.c 中的 pthread_cancel 调用需同样加 __OHOS__ 守卫"
  - "libsamplerate 非硬依赖，可安全禁用 (--samplerate=no)"
  - "DBus 支持需禁用（OpenHarmony 无 DBus），waf configure 自动检测失败即禁用"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/jack-1.9.22.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/jack-1.9.22.work
  source_orig_hash: f8be11dc75edcecf
  source_work_hash: 1f480aaabdbc5ef1
  generated_at: '2026-05-27T15:17:09'
  patches_count: 4

patch_classification:
  - file: 0001-common-JackControlAPI.cpp.patch
    type: platform_compat
    platform_only: True
    guard: '__OHOS__'
  - file: 0002-linux-alsa-hammerfall.c.patch
    type: platform_compat
    platform_only: True
    guard: '__OHOS__'
  - file: 0003-posix-JackPosixThread.h.patch
    type: platform_compat
    platform_only: True
    guard: '__OHOS__'
  - file: 0004-waflib-Context.py.patch
    type: python_compat
    platform_only: False
    guard: 'Python 3.12+'
