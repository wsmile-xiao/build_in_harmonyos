knowledge_gained:
  - "OHOS clang 15 定义 __linux__ 与 __NR_setns 且提供 <sys/sem.h>，psutil.c 的 Linux 分支（含 setns 容器支持）无需补丁即可编译"
  - "HarmonyOS HMMAC 对非应用进程拒绝 AF_UNIX 路径 socket bind（EPERM），JVM attach 正路径无法在设备 shell 会话内复现；JATTACH_PATH 可将触发文件与 socket 目录重定向到可写目录"
  - "SysV 信号量（semget/semop）在该设备被 seccomp 以 SIGSYS 终止，OpenJ9 attach 路径在本平台不可用（上游无 JVM 场景，不影响 HotSpot 主路径）"
  - "设备 /tmp 为只读 erofs，jattach 的默认 tmp 路径需依赖 JATTACH_PATH 或 /proc/<pid>/root/tmp 回退"
