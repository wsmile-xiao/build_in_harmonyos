package: jattach/2.2
homepage: "https://github.com/jattach/jattach"

# Upstream ships no test suite: the 2.2 tarball contains only the Makefile,
# README, LICENSE, jattach.spec and src/ (11 files); the Makefile defines no
# `check`/`test` target (verified by `git ls-tree` and `make -n check` on the
# pristine .orig tree, see notes.md).  Upstream testing is therefore N=0 and
# the adaptation adds the consumer suite below (R51).
upstream_check_command: "make -n check  # no check target in upstream Makefile"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_jattach.sh
    description: "CLI contract + HotSpot attach trigger path + AArch64 ELF check"
    command: "bash test_jattach.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
