# 软件级 manifest — jattach
# 文件位置: archives/j/jattach/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: jattach
display: "jattach"
description: "JVM Dynamic Attach 工具（jmap/jstack/jcmd/jinfo 合一的小型 C 命令行程序）"
category: utility
homepage: "https://github.com/jattach/jattach"
license: Apache-2.0

build_system: makefile

ohos_adaptation:
  key_points:
    - "源码零修改：OHOS clang 15 定义 __linux__/__NR_setns，Linux 分支直接可用"
    - "纯 C、无第三方依赖，只需 Makefile + CC"
    - "非应用进程无法创建 AF_UNIX 路径 socket（HMMAC），JVM 侧 attach socket 需由 JVM 进程自身创建"
  common_dependencies: []

versions:
  "2.2":
    status: built
    build_date: "2026-09-20"
