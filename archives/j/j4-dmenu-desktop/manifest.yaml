software: j4-dmenu-desktop
display: "j4-dmenu-desktop"
description: "Fast desktop application launcher using dmenu-compatible frontends"
category: desktop
homepage: "https://github.com/enkore/j4-dmenu-desktop"
license: GPL-3.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Use the inotify backend available on HarmonyOS PC"
    - "Normalize Conan dependency include paths to avoid spdlog shadowing fmt/ranges.h"
    - "Pin llvm-ar and use a writable TMPDIR on the device"
  common_dependencies:
    - fmt
    - spdlog
    - catch2

versions:
  "3.2":
    status: built
    build_date: "2026-09-24"
    conan_ref: "j4-dmenu-desktop/3.2"
