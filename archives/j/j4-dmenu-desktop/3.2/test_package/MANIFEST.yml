package: j4-dmenu-desktop/3.2
homepage: "https://github.com/enkore/j4-dmenu-desktop"

upstream_check_command: "meson test -C builddir --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson.test()"

upstream_tests:
  - name: "j4-dmenu-tests"
    source: "tests/*.cc"
    description: "Catch2 unit suite covering desktop parsing, formatting, history, search paths, notifications, i3 command assembly and utilities"
    command: "meson test -C builddir j4-dmenu-tests"
  - name: "pytest-system-tests"
    source: "tests/system_tests/system_test.py"
    description: "End-to-end command tests against generated desktop entries and dmenu stubs"
    command: "meson test -C builddir pytest-system-tests"

test_package_tests:
  - file: test.sh
    description: "Checks version/help and resolves a deterministic desktop entry to /system/bin/true through the installed command with --no-exec"
    command: "conan test ."

assertion_count: 3

test_statistics:
  catch2:
    total: 79
    passed: 73
    failed: 0
    skipped: 6
    assertions_passed: 256
  pytest:
    total: 17
    passed: 10
    failed: 0
    skipped: 7
  skip_reason: "HarmonyOS system /tmp is read-only for six fixture tests; seven terminal-emulator parametrizations are skipped by upstream on this platform"
