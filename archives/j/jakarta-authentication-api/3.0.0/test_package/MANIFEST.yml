# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jakarta-authentication-api/3.0.0
homepage: "https://github.com/jakartaee/authentication"

# 上游测试通过 Maven 运行（mvn clean package -B -DskipTests=false，package 阶段含 test）
# 上游为 API-only 模块：api/src 无 test 目录，0 个上游测试
upstream_check_command: "mvn clean package -B -DskipTests=false"
upstream_test_in_build: true
upstream_test_command: "mvn clean package -B -DskipTests=false"

# 上游测试用例（在 build() 中运行）
# 统计来源：api/src 内无 test 目录（纯 API 模块），主源码 24 个 .java + module-info.java
upstream_tests:
  - file: api/src/main/java/jakarta/security/auth/message/
    source: authentication-3.0.0-RELEASE.tar.gz/api/src/main/java/jakarta/security/auth/message/
    description: "上游无测试源码（API-only 模块，api/src 无 test 目录），构建时仅编译主源码（24 个 .java + module-info.java）+ javadoc + sources + jar"
    command: "mvn clean package -B -DskipTests=false"

# test_package 中自带的测试 (消费者视角验证，在鸿蒙真机运行)
test_package_tests:
  - file: test.sh
    description: "编译并运行 Java 反射测试程序（8 类反射加载 + 2 SPI 契约断言）与 E2E 消费者测试 TestAuthFlow（完整认证 SPI 流程：容器安装工厂→注册提供者→取回→ServerAuthConfig→ServerAuthContext→validateRequest→AuthStatus.SUCCESS→CallerPrincipalCallback 身份注入→生命周期收尾，10 个测试用例每例独立 TEST PASS/FAIL 判定 + E2E TEST SUMMARY 汇总），满足 R34 实质性验证"
    command: "bash test.sh"
  - file: TestAuthFlow.java
    description: "完整消费者测试（端到端）：模拟服务器容器跑通 jakarta.security.auth.message 认证流程，10 个测试用例（E2E-1..E2E-10）每例独立 TEST PASS/FAIL 判定 + E2E TEST SUMMARY 汇总，任一失败进程退出码 1，纯 API jar 运行无第三方依赖"
    command: "java -cp <jar>:<tmp> TestAuthFlow"

# 测试检查项总数
# 上游：0（无测试源码）
# test_package：23 个检查项（1 JAR + 1 编译 + 10 反射/契约断言 + 10 E2E 测试用例 + 1 汇总）
assertion_count: 23
