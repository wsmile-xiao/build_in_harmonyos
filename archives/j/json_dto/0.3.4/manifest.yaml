# 版本级 manifest — json_dto 0.3.4
# 遵循 ARCHIVE-SPEC v2.0

version: "0.3.4"
software: "json_dto"

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 GitHub 标签 v.0.3.4 release tarball（执行端核验 tag@df1e82fdf75c）
  url: "https://github.com/Stiffstream/json_dto/archive/refs/tags/v.0.3.4.tar.gz"
  sha256: "1b9595dbd86fa90edf621b72f5f4dac43170339250e9e650ede5269ff6fa3f2e"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DJSON_DTO_TEST=ON"
  - "-DJSON_DTO_SAMPLE=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - rapidjson/1.1.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "json_dto 为 header-only 库（json_dto/pub.hpp + validators.hpp），无需编译库本体"
- "上游测试为 Catch2 单测（20 个 ctest 目标, 711 断言），测试目标直接 include <rapidjson/...> 与 <catch2/catch.hpp>，需通过 CMAKE_CXX_FLAGS 注入 conan 依赖头文件路径"
- "消费端必须继承 RAPIDJSON_HAS_STDSTRING / RAPIDJSON_HAS_CXX11_RVALUE_REFS 两个编译定义以启用 std::string 互操作"
