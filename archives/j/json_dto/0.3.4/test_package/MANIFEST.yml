# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: json_dto/0.3.4
homepage: https://github.com/Stiffstream/json_dto

# 上游测试命令 (CMake + ctest, Catch2 单测套件)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cd build && ctest --output-on-failure"

# 上游 Catch2 测试 (20 个 ctest 目标, 711 断言, 全部通过)
upstream_tests:
  - file: test/floats/main.cpp
    source: json_dto-0.3.4/test/floats/main.cpp
    description: "浮点数 to_json/from_json 往返"
    command: "./_unit.test.floats"
  - file: test/nullable/main.cpp
    source: json_dto-0.3.4/test/nullable/main.cpp
    description: "std::optional/nullable 字段处理"
    command: "./_unit.test.nullable"
  - file: test/validators/main.cpp
    source: json_dto-0.3.4/test/validators/main.cpp
    description: "字段校验器 (类型/范围检查)"
    command: "./_unit.test.validators"
  - file: test/stl_containers/main.cpp
    source: json_dto-0.3.4/test/stl_containers/main.cpp
    description: "STL 容器序列化 (vector/map/set)"
    command: "./_unit.test.stl_containers"
  - file: test/stream_io_helpers/main.cpp
    source: json_dto-0.3.4/test/stream_io_helpers/main.cpp
    description: "iostream 读写辅助函数"
    command: "./_unit.test.stream_io_helpers"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_json_dto.cpp
    description: "json_dto 消费者 round-trip (mandatory/optional/validator/数组, 16 项检查)"
    command: "ctest --output-on-failure -R test_json_dto"

# 测试断言总数 (上游 711 + test_package 16)
assertion_count: 727