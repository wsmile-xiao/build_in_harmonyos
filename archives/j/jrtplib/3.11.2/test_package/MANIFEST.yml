# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jrtplib/3.11.2
homepage: "https://research.edm.uhasselt.be/jori/jrtplib"

# 上游测试命令（tests/ 为 14 个手动程序，无 ctest/make check 注册；
# 配方 build() 中以 JRTPLIB_COMPILE_TESTS=ON 全编译并直调其中 4 个可自动化程序）
upstream_check_command: "timetest + timeinittest + testexttrans + testrawpacket"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "timetest + timeinittest + testexttrans + testrawpacket"

# 上游实际运行的测试程序（完整清点见 notes.md；4 个自动化 + 10 个手动）
upstream_tests:
  - file: tests/timetest.cpp
    source: jrtplib-3.11.2/tests/timetest.cpp
    description: "RTPTime 运算验证（自动化运行，断言 Microseconds 标记）"
    command: "./timetest"
  - file: tests/timeinittest.cpp
    source: jrtplib-3.11.2/tests/timeinittest.cpp
    description: "RTPUDPv4Transmitter 构造冒烟（自动化运行）"
    command: "./timeinittest"
  - file: tests/testexttrans.cpp
    source: jrtplib-3.11.2/tests/testexttrans.cpp
    description: "假 transmitter 约 100 万包注入（自动化运行，断言 Writing packet 1048000）"
    command: "./testexttrans"
  - file: tests/testrawpacket.cpp
    source: jrtplib-3.11.2/tests/testrawpacket.cpp
    description: "回环 RTP 会话自发自收（自动化运行，断言 Valid RTP packet）"
    command: "./testrawpacket"
  - file: tests/testmultiplex.cpp
    source: jrtplib-3.11.2/tests/testmultiplex.cpp
    description: "手动测试：需 stdin 输入本端/对端端口与 IP，未自动化"
    command: "manual-only"
  - file: tests/testexistingsockets.cpp
    source: jrtplib-3.11.2/tests/testexistingsockets.cpp
    description: "手动测试：需预置 socket 与对端配合，未自动化"
    command: "manual-only"
  - file: tests/testautoportbase.cpp
    source: jrtplib-3.11.2/tests/testautoportbase.cpp
    description: "手动测试：需 stdin 输入端口/地址/包数，未自动化"
    command: "manual-only"
  - file: tests/srtptest.cpp
    source: jrtplib-3.11.2/tests/srtptest.cpp
    description: "手动测试：需 libsrtp 与对端安全会话（本配方关闭 SRTP），未自动化"
    command: "manual-only"
  - file: tests/rtcpdump.cpp
    source: jrtplib-3.11.2/tests/rtcpdump.cpp
    description: "手动测试：被动等待外部 RTCP 流，未自动化"
    command: "manual-only"
  - file: tests/readlogfile.cpp
    source: jrtplib-3.11.2/tests/readlogfile.cpp
    description: "手动测试：需外部 RTP 日志文件参数，未自动化"
    command: "manual-only"
  - file: tests/abortdesctest.cpp
    source: jrtplib-3.11.2/tests/abortdesctest.cpp
    description: "手动测试：需双端 socket 与 abort 时序配合，未自动化"
    command: "manual-only"
  - file: tests/abortdescipv6.cpp
    source: jrtplib-3.11.2/tests/abortdescipv6.cpp
    description: "手动测试：需双端 IPv6 socket 时序配合，未自动化"
    command: "manual-only"
  - file: tests/tcptest.cpp
    source: jrtplib-3.11.2/tests/tcptest.cpp
    description: "手动测试：需 stdin 输入 TCP 端口与 IP，未自动化"
    command: "manual-only"
  - file: tests/sigintrtest.cpp
    source: jrtplib-3.11.2/tests/sigintrtest.cpp
    description: "手动测试：需手动发送 SIGINT 的交互式中断测试，未自动化"
    command: "manual-only"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_version.cpp
    description: "版本/错误串/时间 API 验证（10 断言，无 socket）"
    command: "./test_version"
  - file: test_packet.cpp
    description: "RTP 组包解析往返 + 反例验证（6 断言，无 socket）"
    command: "./test_packet"

# 测试断言总数 (test_version 10 + test_packet 6)
assertion_count: 16
