# 版本级 manifest
# 文件位置: archives/j/jrtplib/3.11.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.11.2"

# 软件名
software: "jrtplib"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方站点，与 Homebrew 公式一致）
  url: "https://research.edm.uhasselt.be/jori/jrtplib/jrtplib-3.11.2.tar.bz2"

  # 源码校验和（与 Homebrew homebrew-core Formula/j/jrtplib.rb 一致）
  sha256: "2c01924c1f157fb1a4616af5b9fb140acea39ab42bfb28ac28d654741601b04c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "-DJTHREAD_ENABLED=ON"
  - "-DJRTPLIB_COMPILE_TESTS=ON"
  - "-DJRTPLIB_COMPILE_EXAMPLES=ON"
  - "-DJRTPLIB_WARNINGSASERRORS=OFF"
  - "-DJRTPLIB_USE_BIGENDIAN=OFF"
  - "-DSRTP_ENABLED=OFF"
  - "-DSRTP2_ENABLED=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - jthread/1.3.3

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "patches/0001-tcptest-qualify-bsd-sockets.patch"

# ============================================================
# 测试结果
# ============================================================

test_passed: 2
test_failed: 0

test_results:
  type: explicit
  total: 2
  passed: 2
  failed: 0
  note: "two test_package executables validate version/error-string/time APIs and RTP packet build-parse roundtrip; upstream 4/14 tests/ programs execute in build() (see notes.md); counts are design values, execution pending HMBS preflight evidence"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "上游 cmake_minimum_required(VERSION 2.8)，新 CMake 需 CMAKE_POLICY_VERSION_MINIMUM=3.5（同门 jthread 经验复用）"
- "clang 被识别为 GNU 系编译器会触发上游 -Werror，必须显式 JRTPLIB_WARNINGSASERRORS=OFF"
- "tests/ 共 14 个手动程序（无 ctest 注册），其中 timetest/timeinittest/testexttrans/testrawpacket 可自动化；其余 10 个需交互输入或对端组播"
