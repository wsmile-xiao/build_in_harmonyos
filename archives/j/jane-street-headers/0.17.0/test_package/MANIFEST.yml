# test_package/MANIFEST.yml — jane-street-headers 0.17.0
# CI L0e requires this file to exist.

package: jane-street-headers/0.17.0
homepage: "https://github.com/janestreet/jane-street-headers"

# jane-street-headers has no upstream test suite: the Makefile only wires
# dune build/install helpers for the OCaml packaging; the tag archive contains
# no tests/ directory and no test/check/runtest target.
upstream_check_command: "make -n default"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_jane_street_headers.cpp
    description: "Compiles and runs a TU that exercises the upstream THREAD_IO_CUTOFF constant and the jane_common.h compiler-attribute shims"
    command: "test_jane_street_headers"

# 1 compile-time constant assert + 1 shim-presence guard + 1 runtime check
assertion_count: 3
