software: jpcre2
display: "JPCRE2"
description: "C++ wrapper for PCRE2 library (header-only)"
category: library
homepage: "https://github.com/jpcre2/jpcre2"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
