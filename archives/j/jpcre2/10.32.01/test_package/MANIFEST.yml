# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: jpcre2/10.32.01
homepage: "https://github.com/jpcre2/jpcre2"

# 上游测试命令 (autotools, --enable-test 构建 11 个 TESTS)
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游 automake 测试 (src/Makefile.am TESTS, thread 测试上游默认禁用)
upstream_tests:
  - file: src/test_match.cpp
    source: jpcre2-10.32.01/src/test_match.cpp
    description: "正则匹配与捕获组遍历示例"
    command: "./test_match"
  - file: src/test_replace.cpp
    source: jpcre2-10.32.01/src/test_replace.cpp
    description: "正则替换示例"
    command: "./test_replace"
  - file: src/test_shorts.cpp
    source: jpcre2-10.32.01/src/test_shorts.cpp
    description: "短匹配/替换示例"
    command: "./test_shorts"
  - file: src/test16.cpp
    source: jpcre2-10.32.01/src/test16.cpp
    description: "16 位码元宽度匹配 (需 libpcre2-16)"
    command: "./test16"
  - file: src/test32.cpp
    source: jpcre2-10.32.01/src/test32.cpp
    description: "32 位码元宽度匹配 (需 libpcre2-32)"
    command: "./test32"
  - file: src/test0.cpp
    source: jpcre2-10.32.01/src/test0.cpp
    description: "零长度/边界匹配"
    command: "./test0"
  - file: src/test_issue_29.cpp
    source: jpcre2-10.32.01/src/test_issue_29.cpp
    description: "issue 29 回归测试"
    command: "./test_issue_29"
  - file: src/test.cpp
    source: jpcre2-10.32.01/src/test.cpp
    description: "通用匹配测试"
    command: "./test"
  - file: src/testio.cpp
    source: jpcre2-10.32.01/src/testio.cpp
    description: "输入输出匹配测试"
    command: "./testio"
  - file: src/testme.cpp
    source: jpcre2-10.32.01/src/testme.cpp
    description: "综合匹配测试"
    command: "./testme"
  - file: src/testmd.cpp
    source: jpcre2-10.32.01/src/testmd.cpp
    description: "多文档匹配测试"
    command: "./testmd"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_jpcre2.cpp
    description: "消费者测试:匹配/计数/捕获组/替换/JIT/负向匹配 (7 项检查)"
    command: "ctest --output-on-failure -R test_jpcre2"

# 测试断言总数 (上游 11 + test_package 7)
assertion_count: 18
