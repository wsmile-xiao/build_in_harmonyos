# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
    - "IGNORE_NEARBY_JC=1"
    - "ENABLE_DEDUPE=1"
    - "CFLAGS_EXTRA=-I$DEFAULT_PREFIX/include"
    - "LDFLAGS_EXTRA=-L$DEFAULT_PREFIX/lib -ljodycode"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libjodycode/1.3"

  # 编译器
  cc: clang
  cxx: clang++

