knowledge_gained:
  - "Clang rejects the upstream hash-database switch block because case labels end without statements; explicit break statements are portable and avoid platform macros."
  - "The OHOS image has mkdir/cp but no GNU install utility; the Makefile's INSTALL_PROGRAM and INSTALL_DATA variables allow package-time cp without changing upstream install behavior."
  - "The upstream test.sh only prints OK; the Conan consumer test must perform real duplicate and unique-file assertions."

