# test_package/MANIFEST.yml
# Upstream test and consumer-test declaration for CI quality checks.

package: jdupes/1.31.1
homepage: "https://codeberg.org/jbruchon/jdupes"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "test.sh (executed through the resolved shell)"
upstream_tests:
  - file: test.sh
    description: "Upstream smoke script; the release script prints OK but contains no functional assertions."
    command: "make test"
    expected: "OK"

test_package_tests:
  - file: test.sh
    description: "Runs jdupes --version and recursively detects two duplicate files while excluding a unique file."
    command: "bash test.sh"

assertion_count: 5
