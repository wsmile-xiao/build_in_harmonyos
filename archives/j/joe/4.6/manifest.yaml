knowledge_gained:
- E072: config.guess/config.sub 需要添加 OHOS 平台识别（替换为简化版脚本 + 添加 3 处 ohos 白名单）
- E064: configure conftest 无法执行（OHOS 安全策略限制未签名 ELF 执行），使用跨编译模式（--build != --host）跳过 conftest 运行测试
- E011: HMDFS umask 077 + setgid 导致 autotools 临时目录不可写（patch 0003 中修改 umask 为 022 + mktemp 路径改为 $TMPDIR）
patches_applied:
- 0001-config.guess.patch
- 0002-config.sub.patch
- 0003-configure.patch
