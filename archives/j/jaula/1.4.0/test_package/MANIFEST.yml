# test_package/MANIFEST.yml
# Upstream test declaration file.
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: jaula/1.4.0
homepage: "https://sourceforge.net/projects/jaula"

# 上游无自动化测试入口（清点证据见下 upstream_test_absence_evidence），
# 因此不存在可声明的 check 命令。
upstream_check_command: null

# 上游没有测试套件可集成进 build()——不是"跳过"，是"无入口"。
upstream_test_in_build: false
upstream_test_command: null

# 上游测试程序清单：空。
upstream_tests: []

# 清点证据（SKILL R51 / AGENTS §10：'上游确无测试'须附清点证据）
upstream_test_absence_evidence: >
  jaula-1.4.0 全树 4 个 Makefile.am（根、jaula/、examples/、doc/）中
  TESTS / check_PROGRAMS / dist_check_SCRIPTS / TESTS_ENVIRONMENT 零命中；
  jaula/Makefile.am 只有 lib_LTLIBRARIES = libjaula.la。examples/ 下的
  jparse（bin_PROGRAMS）与 lextst（noinst_PROGRAMS）是演示程序：无断言、
  main 恒 return 0，未注册进 automake test harness，不计入上游测试数。
  configure 也不生成 Makefile 里的 check 目标依赖。N_static = 0。

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_parse.cpp
    description: "消费者程序 1/3：编译并链接打包后的 libjaula + include/jaula.h，调用公开 API JAULA::Parser::parseStream 解析嵌套对象/数组，用 dynamic_cast 下转型后按 Value_String/Number/Number_Int/Boolean/Null::getData() 与 Value_Object/Array::size()/empty() 断言取值，并用 operator<<(ostream, Value) 断言 repr 序列化结果。14 条断言。"
    command: "conan test"
  - file: test_corpus.cpp
    description: "消费者程序 2/3：以内嵌的上游自带语料驱动真实解析（example1.json 逐字原文；example3.json 为压平缩进后的等价内容），断言元素计数、字段取值与 repr 精确往返（如 \"[ 100, 500, 300, 200, 400 ]\"）；另用 Value_Array::addItem / Value_Object::insertItem / getData() 断言编程式构造 API（含 duplicate() 深拷语义）。11 条断言。"
    command: "conan test"
  - file: test_errors.cpp
    description: "消费者程序 3/3：负例断言。上游自带畸形语料 examples/malformed_example3.json 的前 2 个对象（上游共 7 个，内嵌前 2 个即可稳定触发词法拒绝）与截断数组必须被 parseStream 拒绝且 Exception::getCode() 落在 SYNTAX_ERROR/LEXAN_ERROR；类型收窄 Value_String::set(Value_Number_Int) 必须是 BAD_DATA_TYPE；Value_Object::insertItem 重复键必须是 NAME_DUPLICATED。7 条断言。"
    command: "conan test"

# 断言总数（消费者侧 32；上游侧 0，因无测试入口）
# 口径：assertion_count 只统计消费者程序的 check() 调用点，不含上游。
assertion_count: 32

# 内存预算（AGENTS §14.1④：test_package/smoke 必须记 max_rss_mb）
# 真机 memcap-run.py 实测：整个 conan create（含 17 个 TU 编译（jaula/ 子目录 16 个手写 .cc + flex 生成的 jaula_lexan.cc；examples/ 不构建） + libtool 归档 +
# 3 个消费者程序运行）峰值 RSS = 278MB（预算 2048MB，用时 149s）。
# 本预算 512MB 取实测值的 ~1.8 倍余量，消费者链接 flex 后仍为小输入、无放大风险。
max_rss_mb: 512
