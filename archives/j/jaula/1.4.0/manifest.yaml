knowledge_gained:
  - "DRAFT-jaula-1.4.0-automake-default-includes-lacks-top-srcdir（路径 B 新增，draft-review=create，TOP3 相似仅 0.16/0.09/0.08）：automake 1.10.x（本包实测 1.10.1） 的 DEFAULT_INCLUDES 只有 -I. -I$(srcdir) -I$(top_builddir)，不含 $(top_srcdir)；公开头自引用 <pkg/x.h> 的老包在 conan VPATH 构建下必挂，in-tree 才靠 top_builddir=.. 蒙对。修法=make 命令行 AM_CXXFLAGS=-I<源码根>。与 DRAFT-10251-libnfc（写了 -I$(top_srcdir) 却被空 per-target *_CPPFLAGS 顶掉）、DRAFT-kakasi（Makefile 压根不支持 VPATH）签名各异，不可混引"
  - "E011/E114（命中，真机复现）：configure 的两处 umask 077（18391/18396 行，与 §5.3 记录同形）在 HMDFS 上 mktemp -d 出 0700+setgid 目录后本进程不可写，config.status 静默写不出任何 Makefile/config.h；补丁 0001-configure.patch 放宽为 022（同 cityhash 1.1.1 合入先例）"
  - "E122/E072（命中）：自带 config.sub 2008-01-16 的 kernel-os 段不认 linux-ohos，本机 `sh config.sub aarch64-unknown-linux-ohos` 逐字复现 Invalid configuration；配方只传 --build=aarch64-unknown-linux-gnu、不传 --host，未用 E007/E160 源码补丁（§5.3b 前言：E007 的 perl 只覆盖 2018+ field 风格，本包 2008 case 风格照抄即空走）"
  - "§5.3 conan 2.29 API 坑集（命中两条）：补了 requires() 必须同时生成 AutotoolsDeps，否则依赖的 -I 不进 CPPFLAGS（真机首错 FlexLexer.h not found→configure AC_CHECK_HEADERS 硬失败）；AutotoolsToolchain 2.29 无 extra_cxxflags/extra_cppflags，且 tc.cxxflags.append() 不生效（真机验证编译行无该 -I）"
  - "适配检查清单 #14 + §12.53（命中）：本包 9 个公开头 13 处动态异常规范，profile 的 cppstd=17 下 clang 15 报 error: ISO C++17 does not allow dynamic exception specifications；另上游库自身 jaula_parse.cc 有 6 处 std::auto_ptr（gnu++14 仅告警）。修法=self.settings.rm_safe(\"compiler.cppstd\") 让 clang 15 回落 gnu++14；消费者须 -std<=14，test_package 已显式钉 CXX_STANDARD 11"
  - "§12.21（命中）：静态打包（libjaula.a 实体拷贝）规避 libtool .so 三件套在 HMDFS 的符号链接脆弱性；不跑 make install（doc/Makefile.in 的 install-data-local 起 8 条无守卫（全文同类 9 处） test -n \"$(DOXYGEN)\" && … 短路会让安装链 Error 1，本机实测该短路式 rc=1）"
  - "结构判断（本包特有，未成通用条目）：公开头 jaula_lexan.h:65 #include <FlexLexer.h> 且 JAULA::Lexan 继承 jaulaFlexLexer ⇒ flex 必须 requires（只为传头）+ tool_requires（PATH 上的可执行文件）双声明；nm 实测 libjaula.a 自带 35 个 T 定义的 jaulaFlexLexer 方法、libfl.a 内该类符号 0 条 ⇒ 链接期不需要 libfl，package_info() 只展开 includedirs（configure.in 硬校验 LEX 逐字等于 flex，故裸路径 LEX= 传入反而报错），package_info() 按依赖实体展开头/库闭包（跨上下文 cpp_info.requires 在 CMakeDeps 下不传导，真机证据 jaula_INCLUDE_DIRS 只有本包 include/）"

