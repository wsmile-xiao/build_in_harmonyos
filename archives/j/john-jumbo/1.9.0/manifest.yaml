# 版本级 manifest - john-jumbo 1.9.0
# 遵循 ARCHIVE-SPEC v2.0
#
# 版本说明：平台任务卡指定包名 john-jumbo、版本 1.9.0，对应上游
# 1.9.0-jumbo-1（2019-05-14 发布）。官方 main archives/j/john/
# 1.9.0-jumbo-1 仅含 manifest/notes 与两条占位补丁（无 conanfile.py /
# test_package，从未进入 CI、从未发布制品仓），本归档按 ARCHIVE-SPEC
# v2.0 补全适配（包名以平台任务卡口径为准）。

version: "1.9.0"
software: "john-jumbo"
status: built
build_date: "2026-10-02"
build_system: makefile

source:
  url:
    - "https://www.openwall.com/john/k/john-1.9.0-jumbo-1.tar.xz"
    - "https://download.openwall.net/pub/projects/john/1.9.0/john-1.9.0-jumbo-1.tar.xz"
  sha256: "f5d123f82983c53d8cc598e174394b074be7a77756f5fb5ed8515918c81e7f3b"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "make -f Makefile.legacy linux-arm64le（跳过 configure：其 OS 探测无法识别 HarmonyOS）"
  dependencies:
    - "openssl/1.1.1w"
    - "zlib/1.3.1.1"
  cc: clang
  cxx: ""

patches_applied:
  - "0001-Makefile-legacy-symlink-to-copy.patch"
  - "0002-Makefile-legacy-arm64le-target-fixes.patch"

knowledge_gained:
  - "john 上游 configure 的 OS 探测（config.guess 不识别 HarmonyOS + config.status 临时文件权限）不可用，Makefile.legacy linux-arm64le 目标是不支持系统的官方构建路径（官方 main john 旧适配笔记同款结论）"
  - "arm64 SIMD 内联汇编（NEON vroti_epi32 宏）在 OHOS clang 下编译失败，需 -DJOHN_NO_SIMD（arm64le.h 有 !JOHN_NO_SIMD 纯 C 回退；官方 main 旧适配笔记实测结论）"
  - "linux-arm64le 目标硬编码 -DHAVE_CRYPT/-lcrypt，OHOS musl 无 libcrypt（crypt(3) 位于 libxcrypt），必须移除；john 自带 DES 等自有实现，不依赖 libcrypt"
  - "OHOS 全盘禁 symlink()（EPERM）：arch.h 生成与 run/ 8 个工具别名（unshadow 等）均为 ln -s，PROJ 含这些目标必中断构建；改 cp 后 argv[0] 分派语义不变"
  - "Makefile.legacy 用户扩展点 = JOHN_CFLAGS/JOHN_LDFLAGS（无 CFLAGS_EXTRA）；GMP/REXGEN 反引号自动探测可用命令行置空压过（无 override 保护）"
  - "上游发行 tarball 不含 autoconfig.h/john_build_rule.h/version.h：autoconfig.h 的 include 均受 #if AC_BUILT 保护（仅 configure 生成的 Makefile 定义，Makefile.legacy 不定义→永不含入）；john_build_rule.h 却非 NO_JOHN_BLD 路径无条件 include，而 arm64le 目标既不生成该文件也不定义 -DNO_JOHN_BLD（x86 老目标有 -DNO_JOHN_BLD，arm32 目标有 @echo 生成，唯独 arm64le 两缺——上游真实缺口，官方 main 旧适配从未 CI 验证故未暴露）→ 补丁 0002 补 @echo 生成"
  - "发行 tarball 与 git tag 树唯一字节差异 = JTR_ARCHIVE_VERSION_STRING 由 git-archive 占位符替换为 -a16c8a7625 2019-05-14（1:1 换行，无行号漂移）；补丁生成必须基于 tarball 解包字节且以 LF 写出（Windows text 模式写补丁会注入 CRLF 致 context 失配——pit #45 实测）"
  - "linux-arm64le 目标全文件唯一使用裸 $(MAKE)（其余目标均 $(MAKE_ORIG)=+$(MAKE) -f Makefile.legacy）：发行 tarball 不含 configure 生成的 Makefile，子 make 无 makefile 可读 → 对 .PHONY find_version 报 No rule to make target（真机实测）；改 $(MAKE_ORIG) 修复——上游 arm64le 目标与 john_build_rule.h 缺口同源，从未经 tarball 路径 CI 验证"
  - "真机镜像下载：设备直连 openwall 仅 ~5KB/s（33.6MB 需 ~2h），PC 端 python http.server 同热点 LAN 内直供 tarball（conandata 首条 URL 临时指向 http://192.168.43.12:8002，仅设备侧临时改动，仓库侧保持官方双 URL），秒级完成且 sha256 校验通过"
  - "1.9.0-jumbo-1 path.c 不读 JOHN 环境变量（后续 jumbo 版本才支持），$JOHN=dirname(argv[0])：运行时数据必须与二进制同目录打包（上游 run/ 布局即如此），放 share/ 必 fopen 失败；john.conf 的 .include 链引用全部 11 个 run/*.conf（540 dynamic_disabled、1162 korelogic、3929-3947 hybrid/dumb16/dumb32/repeats16/repeats32/dynamic/regex_alphabets，dynamic.conf 再引 dynamic_flat_sse_formats.conf，john.local/john-local 可选），缺任一 .conf 配置加载即失败（真机三轮实测：缺 john.conf → 缺 rules/best64.rule → 缺 korelogic.conf）→ 全部 .conf + rules/ 整目录随二进制进 bin/；build-info 无 Arch/位宽行（同样为后续版本引入），架构校验改用 Build: linux-arm64le 目标行"
  - "--list=formats 输出为逗号分隔清单（1.9.0-jumbo-1 无每格式一行），规模校验须按逗号计名（真机实测 259 个，wc -l 只得 34 行）；--format 仅收单个格式名（options.c FLG_FORMAT 无 OPT_FMT_ADD_LIST），逗号列表报 Unknown ciphertext format name requested（真机实测）→ --test 多格式须逐格式循环"
  - "上游 unit-tests 目标（Makefile.legacy:334，tests/unit-tests.c 随发行 tarball 分发）真机可执行（37 函数/43,067,484 次检查全过）：三处环境适配零测试逻辑改动——CPATH 注入 openssl include（目标硬编码 CFLAGS 不用 $(CFLAGS)，sha2.h 含 openssl/opensslv.h）、/tmp 三临时文件 sed 重定向 cwd（OHOS /tmp 只读 E002）、cwd=src 供 tests/NIST_CAVS 相对数据路径（缺数据文件上游直接 SIGSEGV，无防护）；三处适配已固化为复现脚本 reports/run-upstream-tests.sh（真机实测）"
  - "openssl/1.1.1w 与 zlib/1.3.1.1 制品仓包均为纯静态库（libssl.a/libcrypto.a/libz.a）：john 静态链入（运行时 DT_NEEDED 仅 libc.so）；OpenSSL 系（openssl-enc，EVP AES-128/MD5）与压缩系（PKZIP）格式 --test 自检真机通过，两个依赖的功能路径均有真实用例覆盖（非仅链接声明）"

