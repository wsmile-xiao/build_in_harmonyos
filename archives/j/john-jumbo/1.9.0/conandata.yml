patches:
  - patch_file: "patches/0001-Makefile-legacy-symlink-to-copy.patch"
    patch_description: "Makefile.legacy: linux-arm64le 目标 arch.h 生成与 run/ 下 8 个工具别名（unshadow/unafs/undrop/zip2john/gpg2john/rar2john/base64conv/unique）由 ln -s 改为 cp —— OHOS 全盘禁 symlink()（EPERM），而 PROJ 含这些目标，直接链接会中断构建；原相对链接 ../run/X -> john 指向 ../run/john，故 cp 源必须显式写 ../run/john（cp 以 src/ 为 cwd 解析，裸 john 会误指 src/john），复制后 argv[0] 分派语义不变。影响面申报：这 8 条 ../run/<alias> 规则位于 Makefile.legacy 全局区段（非 linux-arm64le 目标专属，其它 legacy 目标同样引用），改为 cp 后凡构建别名的场景均产生 john 二进制的完整副本（8 份）而非符号链接，构建目录体积相应增大；argv[0] 分派与产物内容不变"
    patch_type: "portability"
  - patch_file: "patches/0002-Makefile-legacy-arm64le-target-fixes.patch"
    patch_description: "Makefile.legacy linux-arm64le 目标三处修正：(1) 移除硬编码 -DHAVE_CRYPT/-lcrypt —— OHOS musl 无 libcrypt（crypt(3) 位于 libxcrypt，设备不存在），保留必致链接失败；john 自带 DES 等自有实现，不依赖 libcrypt。(2) 目标开头 @echo 生成 john_build_rule.h —— 上游 arm64le 目标既未定义 -DNO_JOHN_BLD 也不生成该文件，而 john.c/listconf.c/options.c/opencl_common.c 非 NO_JOHN_BLD 路径无条件 include 之，编译必挂；仿 arm32le 目标同款生成。(3) 子 make 由 $(MAKE) 改 $(MAKE_ORIG)（= +$(MAKE) -f Makefile.legacy，见同文件第 31 行）—— 全文件唯一不带 -f 的子 make，发行 tarball 不含 configure 生成的 Makefile，子 make 找不到 makefile 而对 phony find_version 报 No rule to make target（真机实测）；上游 arm64le 目标长期无 CI 验证（与 john_build_rule.h 缺口同源）"
    patch_type: "portability"
