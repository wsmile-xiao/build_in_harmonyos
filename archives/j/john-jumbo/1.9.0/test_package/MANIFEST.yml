package: john-jumbo/1.9.0
homepage: "https://www.openwall.com/john/"

upstream_check_command: "make -f Makefile.legacy unit-tests（上游无 check 目标；该目标即随 tarball 分发的正式测试入口，真机实测见 reports/upstream-test-run.md）"
upstream_test_in_build: false
upstream_test_command: "reports/run-upstream-tests.sh（真机手动执行，固化三处环境适配；实测 37 函数/43,067,484 用例全过，见 reports/upstream-test-run.md）"

upstream_tests:
  - file: src/tests/unit-tests.c
    source: "john-1.9.0-jumbo-1.tar.xz（src/tests/unit-tests.c，官方随发行 tarball 分发）"
    description: "上游 unit-tests 目标（37 测试函数/43,067,484 用例）：真机全量执行通过，退出码 0；环境适配三处（CPATH 注入 openssl include、/tmp 临时文件重定向 cwd、cwd=src 供 NIST_CAVS 相对数据），测试逻辑零改动，已固化为复现脚本 reports/run-upstream-tests.sh"
    command: "OPENSSL_INCLUDE=<openssl include> bash reports/run-upstream-tests.sh <source_folder>（真机）"
  - file: test/jtrts.pl
    source: "jtrts 独立仓库（发行 tarball 与 git tag 1.9.0-Jumbo-1 均不含 test/ 目录）"
    description: "上游 jtrts 集成测试套件（test: 目标）需 perl 驱动，OHOS 设备无 perl → 平台受限（RESTRICTED），无法执行"
    command: ""

test_package_tests:
  - file: test.sh
    description: "john-jumbo 消费者测试执行器（19 个具名用例）：john 二进制 ELF 校验 + --list=build-info 版本校验 + 7 格式自检（--test：Raw-MD5/md5crypt/sha256crypt/sha512crypt/NT + PKZIP(zlib)/openssl-enc(OpenSSL) 依赖路径）+ 5 组哈希 E2E 破解闭环（向量由 PC 端 openssl 3.5.5 与 RFC 1320 MD4 独立生成）；逐例独立 TEST PASS/FAIL + 末行 TEST SUMMARY，任一失败 exit(1)"
    command: "bash test.sh"

assertion_count: 19
