software: john-jumbo
display: "John the Ripper jumbo"
description: "John the Ripper 社区增强（jumbo）版 —— 密码安全审计与恢复工具，数百种哈希格式支持"
category: tool
homepage: "https://www.openwall.com/john/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile.legacy linux-arm64le 目标直建（configure OS 探测不识别 HarmonyOS）"
    - "-DJOHN_NO_SIMD 禁用 SIMD（NEON vroti_epi32 在 OHOS clang 下编译失败）"
    - "OpenSSL 1.1.1w + zlib 1.3.1.1 制品仓依赖（纯静态库、静态链入）；OpenSSL 系（openssl-enc）与压缩系（PKZIP）格式 --test 自检实测通过"
    - "消费者测试真机实跑：build-info 校验 + 7 格式自检 + 5 组哈希 E2E 破解"
  common_dependencies: []

versions:
  "1.9.0":
    status: built
    build_date: "2026-10-02"
    packaging: conan
    notes: "Upstream 1.9.0-jumbo-1 (Makefile.legacy linux-arm64le + -DJOHN_NO_SIMD); OHOS device: test_package 19/19, conan-verify PASS, upstream unit-tests 37 fn / 43,067,484 checks; deps openssl/1.1.1w + zlib/1.3.1.1 (statically linked)"
    conan_ref: "john-jumbo/1.9.0"
    dependencies:
      - openssl/1.1.1w
      - zlib/1.3.1.1
