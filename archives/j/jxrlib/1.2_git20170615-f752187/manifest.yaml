software: jxrlib
build_system: makefile
version: "1.2_git20170615-f752187"
status: published
build_date: "2026-06-16"

source:
  url: "https://deb.debian.org/debian/pool/main/j/jxrlib/jxrlib_1.2~git20170615.f752187.orig.tar.xz"
  sha256: "3e3c9d3752b0bbf018ed9ce01b43dcd4be866521dc2370dc9221520b5bd440d4"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "CC=clang"
    - "CFLAGS=-I. -Icommon/include -Iimage/sys -D__ANSI__ -DDISABLE_PERF_MEASUREMENT -fPIC -O2"
    - "DIR_INSTALL=$DEFAULT_PREFIX"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "jxrlib Makefile 默认CC=cc不存在，需覆盖为CC=clang"
  - "jxrlib Makefile 不支持DESTDIR，用DIR_INSTALL替代"
  - "pkg-config文件prefix需手动修正为运行时路径"
