software: jxrlib
display: "jxrlib (JPEG XR reference codec)"
description: "JPEG XR (HD Photo, ISO/IEC 29199-2) still-image codec reference implementation with decode/encode libraries and JxrDecApp/JxrEncApp tools"
category: library
homepage: "https://github.com/4creators/jxrlib"
license: BSD-2-Clause
build_system: make

ohos_adaptation:
  key_points:
    - "上游裸 Makefile 硬编码 cc/ar/ranlib 与 CFLAGS, 补丁接入 Conan 工具链 (EXTRA_CFLAGS/EXTRA_LDFLAGS)"
    - "新 clang 拒绝隐式函数声明: 显式声明 strcodec.c 的 _byteswap_ulong, 补 <stdlib.h>/<wchar.h> 包含"
    - "上游无测试套件, 由 test_package 真实 PK* API 编码->解码往返 (23 断言) 验证"
    - "库+双工具包: 软件级 commands.json 声明 JxrDecApp/JxrEncApp (补丁加 headless --version 探针)"
  common_dependencies: []

versions:
