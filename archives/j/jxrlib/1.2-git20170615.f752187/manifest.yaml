version: "1.2-git20170615.f752187"
software: "jxrlib"
status: built
build_date: "2026-09-18"
build_system: make

source:
  url: "https://github.com/4creators/jxrlib/archive/f7521879862b9085318e814c6157490dd9dbbdb4.tar.gz"
  sha256: "8ab20a21f6c3f8cfdedd2511b03a2009e52cce7fa6550202c355063d0d83213e"
  tar_format: tar.gz

build:
  system: make
  configure_options: []
  dependencies: []
  notes: >
    上游裸 Makefile，无 configure。build() 经补丁接入 Conan 工具链：
    CC/AR/RANLIB 弱赋值 + EXTRA_CFLAGS/EXTRA_LDFLAGS（env=conanbuild），
    保留上游必需的 -D__ANSI__ -DDISABLE_PERF_MEASUREMENT 与 -I 路径。

patches_applied:
  - file: "patches/0001-ohos-portability-and-version.patch"
    description: >
      Makefile 工具链接线（CC ?=/AR ?=/RANLIB ?=/EXTRA_CFLAGS/EXTRA_LDFLAGS）；
      segdec.c 显式声明 strcodec.c 的 _byteswap_ulong；JXRGlueJxr.c 补
      <stdlib.h>/<wchar.h>（wcslen）；JxrDecApp/JxrEncApp 加 headless
      --version 探针（darkhttpd/divxcomp 先例）。
    type: "portability"

install_files:
  - path: lib/libjpegxr.a
    type: library
    description: "JPEG XR 编解码核心（静态，默认）"
  - path: lib/libjxrglue.a
    type: library
    description: "容器/glue + BMP/TIF/PNM/HDR/YUV 文件 I/O（静态，默认）"
  - path: bin/JxrDecApp
    type: executable
    description: "JXR 解码工具（--version headless 探针）"
  - path: bin/JxrEncApp
    type: executable
    description: "JXR 编码工具（--version headless 探针）"
  - path: include/libjxr/
    type: headers
    description: "按上游 make install 树：common/ image/ image/x86/ glue/ test/"
  - path: licenses/LICENSE
    type: license
    description: "BSD-2-Clause 全文"

test:
  upstream_test_in_build: false
  upstream_test_command: "n/a (NO_UPSTREAM_TESTS: no test suite in the snapshot — audit in test_package/MANIFEST.yml)"
  package_test: "consumer_roundtrip: PK* API encode->decode roundtrip (23 assertions, ctest)"
  assertions: 23

test_results:
  official_suite: "NOT_RUN (NO_UPSTREAM_TESTS: snapshot has no test suite; evidence in test_package/MANIFEST.yml and notes.md)"
  consumer_roundtrip: "PASS (23/23 assertions on device W3; maxdiff=0 locally on arm64)"
  version_probe: "PASS (JxrDecApp --version / JxrEncApp --version exit 0)"
