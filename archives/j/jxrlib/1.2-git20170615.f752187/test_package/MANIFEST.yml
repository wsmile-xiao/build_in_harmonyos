# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jxrlib/1.2-git20170615.f752187
homepage: "https://github.com/4creators/jxrlib"

# 上游测试套件存在性 (经审计官方快照 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: 4creators/jxrlib commit 快照, sha256 8ab20a21f6c3f8cfdedd2511b03a2009e52cce7fa6550202c355063d0d83213e)
upstream_test_audit:
  source_tarball: "jxrlib-f7521879862b9085318e814c6157490dd9dbbdb4.tar.gz"
  source_sha256: "8ab20a21f6c3f8cfdedd2511b03a2009e52cce7fa6550202c355063d0d83213e"
  source_url: "https://github.com/4creators/jxrlib/archive/f7521879862b9085318e814c6157490dd9dbbdb4.tar.gz"
  file_count: 107
  top_level_entries:
    - Makefile              # 手写构建文件: 仅 all/clean/install 目标, 无 check/test 目标
    - common/include/       # Windows 兼容头 (guiddef.h 等), 非测试
    - image/                # 编解码核心 (decode/encode/sys/x86 + MSVC 工程目录)
    - jxrgluelib/           # 容器/glue 库源码
    - jxrtestlib/           # BMP/TIF/PNM/HDR/YUV 文件 I/O 支持库源码 (编入 libjxrglue), 非测试套件
    - jxrencoderdecoder/    # JxrDecApp/JxrEncApp 示例工具 + MSVC 工程 (vc11/12/14)
    - bin/                  # 上游误提交的 Windows .exe 二进制 (hdr2hdr.exe/imagecomp.exe)
    - doc/                  # 规格文档 (JPEGXR_DPK_Spec_1.0.doc)
  scanned_for:
    - "make check / check 目标 (Makefile 仅定义 all/clean/install)"
    - "ctest/CTestTests.txt / CMakeLists.txt (全树无 CMake)"
    - "TEST( / TEST_F (gtest) — 0 命中"
    - "def test_ (pytest) — 全树无 .py"
    - "tests/ / test/ / spec/ / t/ 目录 — 0 个"
    - "find 全树 -iname '*test*' — 仅命中 jxrtestlib/ 支持库与 bin/*.exe 工具名, 均非测试"
  scan_result: >
    0 个测试入口 — 全树无 tests/ 目录、无测试源文件、无 check 目标;
    `make check` 报 "No rule to make target 'check'"。jxrtestlib 是文件
    格式 I/O 支持库 (JXRTest*.c 编入 libjxrglue), 命名中的 test 指测试
    图像文件 I/O, 不是测试套件; 上游验证方式为用 JxrDecApp/JxrEncApp
    手工往返样例图像 (MSVC 工程)。
  make_check_output: "make: *** No rule to make target 'check'.  Stop."
  reason: >
    jxrlib 为 Microsoft JPEG XR DevPK 参考实现快照 (上游 2017-06-15 后停更),
    官方源码不含任何测试套件: 无 tests/ 目录、无测试源文件、Makefile 无
    check 目标、无 CMake/ctest、无脚本测试框架。功能验证由 test_package
    真实调用 PK* API (编码器->文件->解码器+格式转换器往返, 23 断言) 完成。

# 上游测试命令 (无测试套件, check 命令不存在)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包 API
consumer_tests:
  - file: "consumer_roundtrip.c"
    description: >
      真实消费者: 编译链接打包的 libjxrglue+libjpegxr, 走完整 PK* 公开 API —
      PKCreateFactory/PKCreateCodecFactory 创建工厂, CreateStreamFromFilename
      建流, CreateCodec(IID_PKImageWmpEncode) 建 WMPEncoder, Initialize/
      SetPixelFormat/SetSize/SetResolution/WritePixels 编码 32x32 RGB 渐变,
      CreateDecoderFromFile 解码回读, GetSize/GetPixelFormat 校验尺寸与像素
      格式, PKFormatConverter::Copy 取回像素并断言近无损一致 (容差<=3)。
      共 23 个断言。
    assertions: 23
