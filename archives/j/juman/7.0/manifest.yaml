# 版本级 manifest — juman 7.0
# 遵循 ARCHIVE-SPEC v2.0

version: "7.0"
software: "juman"
status: built
build_date: "2026-10-11"
build_system: autotools + libtool

source:
  url: "https://deb.debian.org/debian/pool/main/j/juman/juman_7.0.orig.tar.bz2"
  sha256: "c1df70ad34bd76c0d203c046af2884de87ed8bec74b63ef3075ae9335426e72c"
  tar_format: tar.bz2
  upstream: "https://nlp.ist.i.kyoto-u.ac.jp/EN/index.php?JUMAN"

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux-ohos / --host=aarch64-linux-ohos（配合 patches/0001 的 config.sub 补丁）"
    - "CFLAGS 追加 -fcommon（tentative definition 合并，E491/E163）"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-sub-aarch64-ohos.patch"
  - "0002-configure-config-status-umask.patch"

package_type: library
artifacts:
  - "lib/libjuman.a（另有 libjuman.la）"
  - "include/juman.h、include/juman_pat.h"
  - "bin/juman（形態素解析コマンド）"
  - "libexec/juman/{makeint,makemat,makepat,dicsort}（辞書構築ツール）"
  - "share/juman/（JUMAN 辞書データ、約 32 MB）、etc/jumanrc、licenses/COPYING"
libs:
  - libjuman
requires: []

tests:
  upstream_suite: "無（2011 年 tarball：無 tests 目録、無 check_PROGRAMS/TESTS/check 目標）"
  upstream_audit: "build() 内執行 grep -nE 'check_PROGRAMS|^TESTS|check-local|^check:' Makefile.in lib/Makefile.in juman/Makefile.in dic/Makefile.in と find -iname '*test*'，結果隨 conan create ログ留証"
  consumer_checks: 5
  consumer_failures: 0
  consumer_pass_rate: "5/5 (100%)（test_package/test_juman.c：my_strlen、my_strcpy/my_strcmp 往復、my_strcmp 差異判定、lower、upper）"
  command: "conan create archives/j/juman/7.0 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"
  smoke_command: "bin/juman -v → 'juman 7.0'；printf '日本語の形態素解析' | bin/juman -r <rc with absolute dict paths> → 输出形態素並以 EOS 結束"

knowledge_gained: []
