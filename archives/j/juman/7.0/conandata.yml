sources:
  "7.0":
    url: "https://deb.debian.org/debian/pool/main/j/juman/juman_7.0.orig.tar.bz2"
    sha256: "c1df70ad34bd76c0d203c046af2884de87ed8bec74b63ef3075ae9335426e72c"

patches:
  - patch_file: "patches/0001-config-sub-aarch64-ohos.patch"
    patch_description: >
      Teach the bundled 2009 config.sub about the aarch64 CPU and the ohos OS so that
      the aarch64-linux-ohos triplet --build/--host pair is canonicalised instead of
      being rejected (same three-line fix as the aalib/1.4p5 and smpeg recipes)
    patch_type: "portability"
  - patch_file: "patches/0002-configure-config-status-umask.patch"
    patch_description: >
      HMDFS marks new directories with the setgid bit, which makes the config.status
      scratch directory created with umask 077 unusable (the helper files inside it
      cannot be written), so create it with umask 022 instead (knowledge E129/E011)
    patch_type: "portability"
