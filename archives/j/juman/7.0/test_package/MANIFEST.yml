package: juman/7.0
homepage: "https://nlp.ist.i.kyoto-u.ac.jp/EN/index.php?JUMAN"

upstream_check_command: "n/a"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests:
  - name: upstream-suite-audit
    command: "grep -nE 'check_PROGRAMS|^TESTS|check-local|^check:' Makefile.in lib/Makefile.in juman/Makefile.in dic/Makefile.in"
    expected: "no match: the 2011 tarball ships no test suite; the audit runs in build() and is recorded in the conan create log"

test_package_tests:
  - file: test_juman.c
    description: >
      Consumer (application) view: link the installed static libjuman through
      juman::juman and drive the public C API declared in juman.h - the
      multi-byte aware string helpers (my_strlen/my_strcpy/my_strcmp) and the
      ASCII case helpers (lower/upper). Prints one CHECK-OK line per assertion
      plus JUMAN_CONSUMER_OK.
    command: "./test_juman"

assertion_count: 5
