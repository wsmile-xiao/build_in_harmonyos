# 版本级 manifest — joltphysics 5.6.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "5.6.0"
software: "joltphysics"
status: published
build_date: "2026-09-13"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/jrouwe/JoltPhysics/archive/refs/tags/v5.6.0.tar.gz"
  sha256: "6e069ee0172478cc78182047aac87e5310ba14a67a53348ae14cc37801fd3f8e"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DJPH_BUILD_SHARED_LIBS=OFF"
    - "-DUSE_SSE4_1/2/AVX/AVX2/AVX512/LZCNT/TZCNT/F16C=OFF (x86-only knobs, inert on aarch64; ARM NEON is the default path)"
    - "-DUSE_FMADD=ON (upstream default; OFF maps to -ffp-contract=off which breaks NEON vmlaq_f32 fusion — TestDifferenceOfProducts fails, see knowledge)"
    - "-DINTERPROCEDURAL_OPTIMIZATION=OFF (LTO unstable/slow on OHOS toolchain)"
    - "-DJPH_USE_VK=OFF / JPH_USE_DX12=OFF / JPH_USE_MTL=OFF (GPU compute needs dxc/glslc absent from OHOS SDK)"
    - "-DJPH_USE_CPU_COMPUTE=ON"
    - "-DTARGET_UNIT_TESTS=ON (with_tests=True default: build AND run upstream doctest suite, 581/581 pass)"
    - "-DTARGET_HELLO_WORLD/PERFORMANCE_TEST/SAMPLES/VIEWER=OFF (library-only package)"
    - "-DENABLE_ALL_WARNINGS=OFF (upstream -Wall -Werror breaks on OHOS clang 15)"
    - "-DOVERRIDE_CXX_FLAGS=OFF (keep profile flags)"
    - "-DGENERATE_DEBUG_SYMBOLS=OFF"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Jolt.cmake 在 CMAKE_SYSTEM_PROCESSOR=aarch64 时走 'ARM64 uses no special commandline flags' 路径，x86 SIMD 选项自然失效，无需 patch"
  - "USE_FMADD 在 aarch64 上不是无效选项：Build/CMakeLists.txt 的 NOT USE_FMADD 分支加 -ffp-contract=off，而 Core.h 因 __ARM_FEATURE_FMA（ARMv8 基线）自动定义 JPH_USE_FMADD——off 会让 clang 把 NEON vmlaq_f32 降级为分离 mul+add，TestDifferenceOfProducts 断言融合结果必然失败（实测 2/581 失败，恢复 ON 后 581/581 全绿）"
  - "OHOS SDK llvm/bin 无 llvm-ranlib 但 ohos.toolchain.cmake 仍指向它，造 .a 报 'Error running link command: no such file or directory'——CMAKE_AR/CMAKE_RANLIB 显式指到 /data/service/hnp/bin/llvm-{ar,ranlib} 修复（同 OpenCV/SuiteSparse/assimp 坑）"
  - "JPH_USE_VK=ON 默认在 OHOS sysroot 找到 libvulkan.so，但缺 glslc/dxc shader 编译器，需显式关 GPU 计算后端走 JPH_USE_CPU_COMPUTE"
  - "GNU make jobserver 依赖 FIFO 被 OHOS SELinux 禁（E074），Ninja 生成器绕开该依赖（duckdb/eigenpy 先例）"
  - "上游 UnitTests doctest 套件（vendored，零外部依赖）可随包构建运行：581 用例/514281 断言 OHOS aarch64 本机 ~2 秒全绿；UnitTests 链接 libc++_shared.so 需 clang++ -print-file-name 自省注入 LD_LIBRARY_PATH"
