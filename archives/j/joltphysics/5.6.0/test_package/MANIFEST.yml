# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: joltphysics/5.6.0
homepage: "https://github.com/jrouwe/JoltPhysics"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# JoltPhysics 上游用 CMake + doctest 2.5.2 单测框架（vendored 于
# UnitTests/doctest.h，无外部依赖）：TARGET_UNIT_TESTS=ON 时构建 UnitTests
# 可执行文件（71 个测试源文件，Core/Geometry/Math/ObjectStream/Physics/
# SoftBody/Vehicle/Character/Ragdoll/Compute 十套件，581 个测试用例 /
# 514281 条断言），enable_testing()+add_test(UnitTests) 注册进 ctest。
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-ohos --output-on-failure"

# 上游实际运行的测试程序
# with_tests=True（默认）：TARGET_UNIT_TESTS=ON，build() 阶段编译并真实运行
# 完整 UnitTests doctest 套件（OHOS aarch64 本机实测 581/581 用例、
# 514281/514281 断言全部通过，~2 秒）；libc++_shared.so 经编译器自省定位
# 注入 LD_LIBRARY_PATH。test_package 额外验证已安装包消费视角（上游
# HelloWorld 语义的完整物理仿真：球体落地-碰撞-休眠-静止高度断言）。
upstream_tests:
  - file: UnitTests/UnitTests.cmake
    source: JoltPhysics-5.6.0/UnitTests/UnitTests.cmake
    description: "上游 doctest 单元测试套件完整构建+真实运行（581 用例/514281 断言，Physics/SoftBody/Vehicle/Character/Ragdoll/Math/Geometry/ObjectStream/Compute 十套件，CI build() 阶段 ctest 执行全绿）"
    command: "cmake -DTARGET_UNIT_TESTS=ON ... && ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "上游 HelloWorld 派生的端到端物理仿真冒烟测试：动态球落到静态地板盒上，逐步仿真至休眠，断言最终静止高度（0<Y<1.5）"
    command: "./test_jolt"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 514281
