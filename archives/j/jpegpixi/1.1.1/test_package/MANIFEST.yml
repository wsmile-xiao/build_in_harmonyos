# test_package/MANIFEST.yml
# jpegpixi 1.1.1 upstream test inventory (R51):
# - tarball contains NO tests/ directory, NO check scripts; Makefile.am defines
#   no TESTS variable (verified: automake 'gnu' option provides the default
#   `check` target but it runs zero tests) -> upstream_tests is empty.
# - Consumer-side verification therefore runs the real fix pipeline on a
#   generated minimal JPEG (R34: test depends on the tested binary).

package: jpegpixi/1.1.1
homepage: "http://www.zero-based.org/software/jpegpixi/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "K0 CLI probe (--help/--version rc=0); real single-pixel fix; real block fix (X,Y,S); SOI/EOI marker check; SOF dimension preservation; round-trip re-parse of own output"
    command: "sh test.sh"

assertion_count: 7
