# 版本级 manifest — jakarta-activation 2.0.0
version: "2.0.0"
software: jakarta-activation
status: built
build_date: "2026-10-07"
conan_ref: "jakarta-activation/2.0.0"

source:
  url: "https://codeload.github.com/jakartaee/jaf-api/tar.gz/refs/tags/2.0.0"
  sha256: "f89b9a5dc86640abf12dfa2bc9c90632fe5879e36b929bba959e861508b537fe"
  note: "上游仓库名为 jaf-api（JavaBeans Activation Framework），制品坐标 jakarta.activation:jakarta.activation-api:2.0.0"

build:
  system: maven
  command: "mvn -pl activationapi -am clean package -B -DskipTests=false"
  dependencies:
    - bishengjdk 17.0.13（配方经 cmd-pkgs 自取；HNP 自带 JVM 在部分环境无法启动）
    - apache-maven 3.9.11（配方自取，sha256 校验）

patches_applied:
  - file: "patches/ja-0001-jdk17-bundle.patch"
    description: "maven-bundle-plugin 4.2.1 -> 5.1.9（JDK 17.0.13+ 下 4.2.1 抛 ConcurrentModificationException，bnd/ZipFile 不兼容）——同一类修法见 jakarta-inject-api 2.0.1"

upstream_tests:
  framework: none
  test_sources: 0
  test_classes: 0
  test_methods: 0
  test_command: "N/A（上游无测试源）"
  run_in_build: false
  evidence: "jaf-api 2.0.0 源码树 `find . -type d -name test` 为空；activation 模块 25 main / 0 test，activationapi 0 main / 0 test（其 pom 虽声明 junit+surefire，但无测试类）"
upstream_test_pass_rate: "N/A（上游无测试用例，如实披露）"
adapted_test_pass_rate: "test_package 28/28 反射断言 + 2 流程断言（2 个 JAR 存在 / javac 成功）+ PASS 校验全过；Maven BUILD SUCCESS、conan create EXIT=0（HarmonyOS PC aarch64 本机实测）"

knowledge_gained:
  - "上游 jaf-api 2.0.0 **不含任何测试源**（`find . -type d -name test` 为空）——不能像 cdi 那样在 build() 内跑上游测试；MANIFEST 的 upstream_test_in_build 必须为 false 并附清点证据，通过率报 N/A（勿虚构）"
  - "reactor 作用域：根 pom 的 modules 为 activation + activationapi（demo 仅在 profile 下启用）——`-pl activationapi -am` 会连带构建 activation（其 jar 是 activationapi 装配 API jar 的输入），两个产物都要打包进 libexec/：jakarta.activation-2.0.0.jar + jakarta.activation-api-2.0.0.jar"
  - "HNP 自带 JVM（/data/service/hnp/bin/java）在部分环境启动即失败（Failed to mark memory page as executable）；而按仓库既有 cmd-pkgs 路径自装的 ~/bishengjdk17（BiShengJDK 17.0.13）可正常工作——故配方 _ensure_java 必须优先 JAVA_HOME / ~/bishengjdk17，最后才回退 PATH（否则会选中坏 JVM）"
