# conandata.yml — jakarta-activation 2.0.0
# 源码 tarball 从 GitHub 官方归档主机下载（jakartaee/jaf-api tag 2.0.0）
# 注：上游仓库名为 jaf-api（JavaBeans Activation Framework），制品坐标
#     jakarta.activation:jakarta.activation-api:2.0.0
# 注：用 codeload.github.com（GitHub 官方归档主机）而非 github.com/archive 重定向
#     形式——两者字节完全一致（sha256 相同），且 codeload URL 不带 .tar.gz 后缀，
#     故显式给 filename 供 Conan 识别解压格式

sources:
  url: "https://codeload.github.com/jakartaee/jaf-api/tar.gz/refs/tags/2.0.0"
  sha256: "f89b9a5dc86640abf12dfa2bc9c90632fe5879e36b929bba959e861508b537fe"
  filename: "jaf-api-2.0.0.tar.gz"

# JDK 17.0.13+ 构建兼容补丁：maven-bundle-plugin 4.2.1 在新 JDK 上抛
# ConcurrentModificationException（bnd/ZipFile 不兼容）——pin 到 5.1.9
# （同一类修法见 jakarta-inject-api 2.0.1）
patches:
  - patch_file: "patches/ja-0001-jdk17-bundle.patch"
    patch_description: "maven-bundle-plugin 4.2.1 -> 5.1.9 (JDK 17.0.13+ bnd/ZipFile ConcurrentModificationException)"
    patch_type: "portability"
