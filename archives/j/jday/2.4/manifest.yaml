version: "2.4"
software: "jday"
status: published
build_date: "2026-09-21"
build_system: "autotools"

source:
  url: "https://downloads.sourceforge.net/sourceforge/jday/jday-2.4.tar.gz"
  sha256: "3b15f3a1b552ffae7c343bd47bf89e8073da9ef8c2ec6d79b90d56f8c3a06fda"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--host=aarch64-linux-ohos"
  dependencies: []
  make_flags: "-j1  # HMDFS 不支持 mkfifo，GNU Make FIFO jobserver 失败（E074/E525）"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

knowledge_gained:
  - "jday 随包的 config.guess/config.sub 停留在 2004 年，既不认识 aarch64 也不认识 linux-ohos；补齐这两处后 autotools + libtool 1.5.6 可直接完成 OHOS 构建，源码零修改。"
  - "profile 的 host/build 同为 OHOS 时 conan 不判定交叉编译，不会注入三元组，需要配方自行传 --host；build 三元组交由打过补丁的 config.guess 探测。"
  - "config.guess 的分支必须按构建机真实 uname 写：鸿蒙 PC 真机 uname -s 返回 HarmonyOS（非 Linux），只加 aarch64:Linux 分支在真机上永不命中，会落到需要写 $TMPDIR/dummy.c 的兜底逻辑并被 HMDFS 拒绝（CI #57604 实测，同 E007）。"
  - "autoconf 2.59 的 config.status 用 mktemp -d 建临时目录（权限硬编码 0700，umask 改不动），在 HMDFS 的 UID 映射下对本进程不可写，Makefile 生成失败；需把该分支换成 mkdir + umask 000（CI 第 2 轮实测，同 E011）。"
  - "HMDFS 不支持 mkfifo，GNU Make 的 FIFO jobserver 直接失败并放弃读取 Makefile；autotools 包需以 MAKEFLAGS=-j1 串行化（同 E074/E525，先例 at/3.2.5、ace/8.0.5）。"
  - "x86_64 构建机上动态链接的 aarch64-OHOS 产物无法启动（缺 /lib/ld-musl-aarch64.so.1），上游 RunTest 需对同源 .o 静态重链副本在 qemu-aarch64 下运行。"

homepage: "https://jday.sourceforge.net/"
license: "BSD-3-Clause"

tests:
  upstream:
    command: "make check  ->  sh ./RunTest"
    cases: 26
    passed: 26
    pass_rate: "26/26 (100%)"
    note: "qemu-aarch64 执行同源 .o 静态重链副本；Testdbd 仅打印无断言，JdayTest.pl 测的是 Perl 示例模块，均不计入。"
  adapted:
    command: "test_package/test_jday"
    cases: 7
    passed: 7
    pass_rate: "7/7 (100%)"

