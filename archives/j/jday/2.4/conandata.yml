sources:
  "2.4":
    url: "https://downloads.sourceforge.net/sourceforge/jday/jday-2.4.tar.gz"
    sha256: "3b15f3a1b552ffae7c343bd47bf89e8073da9ef8c2ec6d79b90d56f8c3a06fda"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Teach the 2004-era config.guess to report aarch64 Linux and HarmonyOS build machines"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Teach the 2004-era config.sub to accept aarch64 and linux-ohos triplets"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "Create the config.status scratch directory with mkdir/umask 000 instead of mktemp 0700, so it stays writable under HMDFS UID remapping"
    patch_type: "portability"
