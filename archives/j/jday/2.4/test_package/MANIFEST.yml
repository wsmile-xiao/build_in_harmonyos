# test_package/MANIFEST.yml — 上游官方测试声明
package: jday/2.4
homepage: "https://jday.sourceforge.net/"

# 上游测试入口：Makefile.am 的 check 目标直接执行 $(srcdir)/RunTest
upstream_check_command: "make check"

# build() 未集成 make check：构建机为 x86_64，无法启动动态链接的 aarch64-OHOS
# 产物（缺 /lib/ld-musl-aarch64.so.1）。上游用例改为在 qemu-aarch64 下对同源
# .o 静态重链副本运行，结果见 reports/test-report.md 与 notes.md。
upstream_test_in_build: false
upstream_test_command: "sh ./RunTest   # 适配验证时以 qemu-aarch64 执行静态重链副本"

upstream_tests:
  - file: "RunTest"
    source: "jday-2.4/RunTest"
    description: "上游唯一自动判定测试：26 条 jday/j2d 断言（TestJD ×13 + TestJ2D ×13，覆盖儒略日零点、公元 0 年闰日、格里高利改历边界、Unix 纪元、-v1 输出格式），脚本自带 PASS/FAIL 统计"
    command: "sh ./RunTest"
  - file: "Testdbd"
    source: "jday-2.4/Testdbd"
    description: "dbd 输出巡检脚本：打印 121 组日期差，无断言、无判定，不计入通过率"
    command: "sh ./Testdbd"
  - file: "JdayTest.pl"
    source: "jday-2.4/JdayTest.pl"
    description: "随包分发的 Perl 示例模块 CalDate.pm 的自测脚本，测试对象是 Perl 实现而非 C 产物，不适用于本次 C 库适配"
    command: "perl JdayTest.pl"

test_package_tests:
  - file: "test.c"
    description: "消费者视角调用 libjday 的 JulDate()/CalDate()：4 条日历→儒略日断言 + 3 条儒略日→日历回转断言，期望值取自上游 RunTest 同源用例"
    command: "./test_jday"

assertion_count: 7
