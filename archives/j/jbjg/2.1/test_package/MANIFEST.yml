# test_package/MANIFEST.yml
# 上游官方测试声明文件；CI (build_and_test.sh L0e) 强制要求此文件存在
package: jbjg/2.1
homepage: https://www.cl.cam.ac.uk/~mgk25/jbigkit/

# build() 执行手写 Makefile 的 check 目标，覆盖上游两个编解码测试
upstream_test_in_build: true
upstream_tests:
  - file: libjbig/tstcodec
    description: "上游 T.82 编解码测试"
  - file: libjbig/tstcodec85
    description: "上游 T.85 编解码测试"

# test_package 自带测试（消费者视角，链接 libjbig 调真实导出符号）
test_package_tests:
  - file: test.c
    description: "链接 libjbig.a，调用 jbg_dec_init/jbg_dec_free 验证 JBIG 解码 API 可用"
    command: "ctest test_jbjg"

assertion_count: 1
