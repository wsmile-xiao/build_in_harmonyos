# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 要求存在）

package: jmeters/0.4.5
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/index.html"

# 上游测试命令（供 make -n check / ctest -N / meson test --list 分析）
# 上游 source/Makefile 的全部目标：all / jmeters / install / uninstall / clean
# —— 不存在 check 或 test 目标，`make -n check` 返回
# "make: *** No rule to make target 'check'."（清点证据见 notes.md）
upstream_check_command: "make -C source check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（jMeters 0.4.5 上游无任何测试目标 / 无 *.t / 无 ctest）
upstream_tests: []

# test_package 自带的消费者侧测试
test_package_tests:
  - file: test_jmeters.c
    description: "消费者测试用例（用例级：conan test 进程 rc=0 完整通过）。纯 C 检查器含 4 项确定性检查点：①二进制存在于 bin/；②ELF 为 64 位小端 AArch64；③.rodata 内嵌 PROGRAM/VERSION 字面量 jmeters 与 0.4.5；④ELF DT_NEEDED 动态依赖链完整（LD_LIBRARY_PATH 下每个所需 so 都能解析到真实文件）。4 项全通过，进程 rc=0。"
    command: "./test_jmeters"

# 断言总数（近似值，用于质量评估；通过率以用例级 rc=0 申报，断言仅参考）
assertion_count: 4
