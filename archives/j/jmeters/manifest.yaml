# 软件级 manifest — jmeters
# 遵循 ARCHIVE-SPEC v2.0

software: jmeters
display: "jMeters"
description: "jMeters — 基于 JACK 的多标准电平表（BBC/DIN/EBU/PPM/VU 刻度），Fons Adriaensen 编写，读音频文件与 JACK 信号做峰值/短期/相关性计量，X11(clxclient) 图形界面"
category: audio
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯裸 Makefile 构建（无 configure/autotools/CMake），上游 Makefile 硬编码 -march=native 由 portability 补丁移除，编译器取自 conan profile（R33）"
    - "上游 install 规则引用 ../share/*，必须保持 source/ 与 share/ 兄弟目录结构；打包用 make install PREFIX=/ 使 bin/ 与 share/jmeters/ 落到包目录"
    - "依赖 include/lib 目录经 CPPFLAGS/LDFLAGS 注入，绕开上游 $(shell pkgconf --cflags freetype2)（OHOS PATH 无 pkgconf，只会打印 make: pkgconf: No such file or directory，不阻断构建）"
    - "同作者同构建系统家族范式取自已合入的 archives/z/zita/0.2.2（含 -DCLTHREADS_NO_PTHREAD_CANCEL）"
    - "补丁生成需绕开 refresh-patch 的生成物名单：改过的 source/Makefile 会被判构建产物并静默丢弃（见 knowledge/drafts/DRAFT-7646-refresh-patch-generated-names-makefile.md）"
  common_dependencies:
    - clthreads
    - clxclient
    - jack
    - libsndfile
    - libpng
    - cairo
    - freetype
    - libxft
    - libx11
    - libxext
    - fontconfig

versions:
  "0.4.5":
    status: built
    build_date: 2026-09-26
    notes: "conan-verify G1/G2/G3 PASS（G4 带「无法找到程序包 ID」、L2/L4/L5 为「跳过（无 cache 路径）」，均不计为通过）；W3 本地 CI 模拟通过（.ci-result.json exit_code=0，step=W3_local_ci）；1 个 portability 补丁（source/Makefile，+5/-5）；消费者用例 1/1、4 检查点；上游测试资产静态合计 0；诊断性 jmeters -h 报 Error loading shared library libXft.so.2 ⇒ 只申报编译+打包+静态断言，不申报可运行"
