software: jailkit
display: "jailkit"
description: "chroot 监禁工具套件（jk_chrootsh/jk_lsh/jk_init/jk_cp 等 C 二进制 + Python 运维脚本）"
category: tool
homepage: "https://olivier.sessink.nl/jailkit/"
license: "BSD-3-Clause AND LGPL-2.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游发布渠道为官网 tarball（GitHub 无 2.23 tag 归档）；configure 预生成，无 AC_CANONICAL"
    - "configure 硬依赖 python → AC_ARG_VAR PYTHONINTERPRETER 指向 HNP python3，py 脚本 shebang/jk_lib.pyc 随之生效"
    - "顶层 install 会写 /etc/shells → package() 复刻 ini/src/py/man 四段子安装，包内容只落 package_folder"
    - "上游自检程序 iniparsertester/passwdparsertester 显式构建运行并断言；消费者测试走 CLI 自检 + jk_lib API（chroot 需 root，非交互面离线确定性）"
    - "setuid 4755 为上游语义；E114 umask 替换 + §12.38① env -u CONFIG_SHELL + E074 make -j1；CLI 门禁 commands.json（R38）"

versions:
  "2.23":
    status: prepared
    conan_ref: "jailkit/2.23"
