# test_package/MANIFEST.yml
# jailkit 2.23
# 上游测试 = src/ 两个自检程序（iniparsertester / passwdparsertester）：
# 有 make 规则但不在 all 目标，Makefile 无 test/check 目标。构建阶段
# 显式构建并运行二者并断言关键输出（详见 conanfile.py build()）。

package: jailkit/2.23
homepage: "https://olivier.sessink.nl/jailkit/"

upstream_tests_exist: true
upstream_test_audit: >
  src/iniparsertester.c 与 src/passwdparsertester.c 是上游自带的解析器
  自检程序（覆盖套件基础的 iniparser 与 passwdparser 组件）：Makefile.in
  有构建规则但不在 BINARIES/all，也无 test/check 目标。构建阶段以
  `make -C src iniparsertester passwdparsertester` 构建后运行：
  passwdparsertester 读取 src/passwdparsertester.test（含 uid 100 无换行
  行）断言解析出 "found user jaja!"；iniparsertester 读取
  src/iniparsertester.ini（注释/缩进/重复键等边界）要求非空输出。上游
  测试计数按自检程序计 2（构建阶段运行，test_package 不重复）。
upstream_test_count: 2
upstream_check_command: "make -C src iniparsertester passwdparsertester && 运行二者（在配方 build() 内执行并断言）"
upstream_test_in_build: true

# test_package 中自带的测试（消费者视角, R34: 真实执行被适配产物）
test_package_tests:
  - file: test_jailkit.sh
    description: >
      消费者视角: 真实执行包内产物，6 项断言（jk_uchroot -h / 缺参报错 /
      jk_chrootlaunch -h / jk_init Python 脚本链 / jk_lib.py 纯函数 API
      （fix_double_slashes、split_path/join_path roundtrip，从包内
      share/jailkit 导入）/ 包内容完整性 14 个产物 + ini [netbasics]
      节）。chroot 主功能需要 root，非交互面用 CLI 自检 + 安装库 API。
    command: "bash test_jailkit.sh <package_folder>"

test_fixtures: []

# 断言总数（消费者 6 项；上游自检 2 项在构建阶段计入 PR 报告）
assertion_count: 6
