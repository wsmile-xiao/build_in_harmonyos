# conandata.yml — jailkit 2.23
# 源码 URL 为上游官方网站发布 tarball（R39；jailkit 上游发布渠道为
# olivier.sessink.nl，GitHub solbu/jailkit 仓库无 2.23 tag 归档，已实测
# 404）；sha256 已对本机下载的官方 tarball 实测核验。tarball 自带预生成
# configure（autoconf 2.72 生成）。

sources:
  url: "https://olivier.sessink.nl/jailkit/jailkit-2.23.tar.gz"
  sha256: "490bbc2b955f0f03dc56789decd828287321b8ec234123cecf2fdf2aacce3f5a"

patches:
  # 上游 2.23 tarball 自带缺陷（真机第 1 轮实测：iniparsertester.c 报
  # 11 处 clang 硬错误 "too few arguments to function call"，主产品
  # 5 个 jk_* 二进制不受影响——0 处使用该破损宏）：src/iniparser.h 的
  # iniparser_get_int(ip,section,key) 便捷宏展开为
  # iniparser_get_int_at_position(ip,section,key,0L)（4 实参），而函数
  # 原型 5 形参（含 defaultval）；自检程序 iniparsertester.c 另有 1 处
  # iniparser_get_float_at_position 4 实参调用同病。上游 git master
  # 无对应修复（raw/API 404 实测）。补丁给宏补中性默认值 0、给 float
  # 调用补缺省实参 0.0——自检查询的全部 key 均存在于 ini，打印输出
  # 不受影响；主线 jk_* 行为零变化。
  - patch_file: "patches/0001-iniparser-macro-defaultval.patch"
    patch_description: "修复 iniparser.h 的 iniparser_get_int 便捷宏丢 defaultval 实参（补 0）与 iniparsertester.c 的 iniparser_get_float_at_position 调用缺 defaultval 实参（补 0.0）；主产品 jk_* 不使用该宏，行为零变化"
    patch_type: "bugfix"  # 上游 2.23 tarball 自带缺陷，非平台适配
    sha256: "fb71b9b3f559e98b4a82cd2370b7fe874ae3c3adcb1b51c200c774863f807bfb"
