# 版本级 manifest — jailkit 2.23
# 遵循 ARCHIVE-SPEC v2.0

version: "2.23"
software: "jailkit"
status: built
build_date: ''
build_system: autotools

source:
  url: "https://olivier.sessink.nl/jailkit/jailkit-2.23.tar.gz"
  sha256: "490bbc2b955f0f03dc56789decd828287321b8ec234123cecf2fdf2aacce3f5a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>（sysconfdir 随 prefix → <pkg>/etc/jailkit）"
    - "PYTHONINTERPRETER=/data/service/hnp/bin/python3（AC_ARG_VAR 覆盖，上游只找 `python`）"
    - "（无 AC_CANONICAL，不需要 config.guess/--build；configure 由上游 autoconf 2.72 预生成）"
  dependencies: []  # iniparser/passwdparser/wordexp 随源码捆绑；libcap/procmail 可选自动跳过
  cc: clang
  upstream_test_command: "make -C src iniparsertester passwdparsertester && 运行二者（配方 build() 内断言关键输出）"

patches_applied:
  - "patches/0001-iniparser-macro-defaultval.patch（bugfix：上游 2.23 tarball 自带缺陷——iniparser_get_int 便捷宏丢 defaultval 实参 + iniparsertester.c float 调用缺实参；主线 jk_* 0 处使用该宏，行为零变化；真机第 1 轮实测阻塞于自检程序编译 11 处 too few arguments 硬错误）"

knowledge_gained:
  - "jailkit 上游发布渠道是 olivier.sessink.nl 官网 tarball（GitHub solbu/jailkit 无 2.23 tag 归档，404 实测）"
  - "构建体系为根 Makefile 递归 src/py/man 三个手写 Makefile（非 automake），in-source 构建；configure 硬依赖 python（AC_PATH_PROG `python`），真机用 AC_ARG_VAR PYTHONINTERPRETER 指向 HNP python3"
  - "顶层 make install 会向 /etc/shells 追加行（test -w 守卫）→ package() 复刻 ini/src/py/man 四段子安装，跳过系统路径写段"
  - "setuid 4755（jk_chrootsh/jk_uchroot）为上游语义；HMDFS 忽略 chmod 不影响落包"
  - "上游自检程序 iniparsertester/passwdparsertester 有 make 规则但不在 all → build() 显式构建运行并断言（passwdparsertester 期望 uid 100 → 'found user jaja!'）"
  - "E114 umask 077→022 替换 + §12.38① env -u CONFIG_SHELL + E074 make -j1（zzuf/gtypist 先例）"
