software: jchroot
display: "jchroot"
description: "带命名空间隔离的 chroot：新建 mount/PID/IPC/UTS 命名空间并用 pivot_root 切换根目录"
category: utility
homepage: "https://github.com/vincentbernat/jchroot"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 仅 14 行且无 install 目标 → 配方在 package() 直接 copy jchroot 与 jchroot.8"
    - "CFLAGS 为硬赋值（-Werror -Wall -ansi -g -O2），clang 15 实测零告警，无需补丁"
    - "无 Conan 包依赖；仅用 OHOS 系统 C/POSIX 头与 Linux 命名空间/pivot_root 系统调用"
    - "上游 tag 带 v 前缀（v1.1），源 URL 必须用 refs/tags/v1.1"
  common_dependencies: []

versions:
  "1.1":
    status: built
    build_date: "2026-09-26"
    source_url: "https://github.com/vincentbernat/jchroot/archive/refs/tags/v1.1.tar.gz"
