package: jchroot/1.1
homepage: https://github.com/vincentbernat/jchroot

# Upstream ships a CI workflow but no test suite: .github/workflows/tests.yml
# only runs `make` followed by `./jchroot --help` (smoke test), and the tree has
# no tests/ directory, no `make check` target and no Debian autopkgtest.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: "./jchroot --help"
upstream_tests:
  - file: .github/workflows/tests.yml
    source: jchroot-1.1/.github/workflows/tests.yml
    description: "Upstream CI smoke test: build with make, then run ./jchroot --help"
    command: "./jchroot --help"

test_package_tests:
  - file: test_jchroot.py
    description: "Consumer suite: 5 cases / 9 checks. Case 1 is a complete consumer end-to-end case - a throw-away root plus fstab(5) are built on the fly and the real jchroot is executed on them, then the guest stdout, the evidence file inside the new root and the child pidfile are validated (a host without namespace privileges must instead show the expected capability denial). The other cases cover the upstream `./jchroot --help` smoke test, the target path contract, the pidfile contract and the UID/GID mapping precondition."
    command: "python3 test_jchroot.py <package>/bin/jchroot"

assertion_count: 9
