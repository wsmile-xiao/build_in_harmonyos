  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--without-libdb"
    - "--without-gui"
    - "CFLAGS=-I/storage/Users/currentUser/usr/local/include"
    - "CXXFLAGS=-I/storage/Users/currentUser/usr/local/include"
    - "LDFLAGS=-L/storage/Users/currentUser/usr/local/lib"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "bzip2/1.0.8"

  # 编译器
  cc: clang
  cxx: clang++

