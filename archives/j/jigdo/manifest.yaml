version: "0.8.2"
status: built
build_date: "2026-06-11"

source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/j/jigdo/jigdo_0.8.2.orig.tar.xz"
  sha256: ""
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--without-libdb"
    - "--without-gui"
    - "CFLAGS=-I/storage/Users/currentUser/usr/local/include"
    - "CXXFLAGS=-I/storage/Users/currentUser/usr/local/include"
    - "LDFLAGS=-L/storage/Users/currentUser/usr/local/lib"
  dependencies:
    - "bzip2/1.0.8"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-Makedeps.patch"

knowledge_gained:
  - "HMDFS 文件系统限制：config.status 使用 mktemp -d 在当前目录创建临时子目录会失败，需手动创建并修改脚本"
  - "jigdo 的 libdb 功能可选，无预编译包时可使用 --without-libdb 禁用"
  - "docbook2man 缺失时可跳过文档生成，只编译二进制文件"