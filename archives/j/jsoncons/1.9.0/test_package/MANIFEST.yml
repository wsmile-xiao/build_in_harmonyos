# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: jsoncons/1.9.0
homepage: "https://github.com/danielaparker/jsoncons"

# 上游测试：src/tests/ 自研单元测试框架
upstream_test_command: "cmake -S . -B build -DJSONCONS_BUILD_TESTS=ON && cmake --build build && ctest --test-dir build"

upstream_tests:
  - file: src/tests
    source: jsoncons-1.9.0/src/tests
    description: "jsoncons 上游单元测试套件（json/json patch/csv/cbor/msgpack 等）"
    command: "cmake -S . -B build -DJSONCONS_BUILD_TESTS=ON && cmake --build build && ctest --test-dir build"

test_package_tests:
  - file: test_jsoncons.cpp
    description: "消费者测试: 验证 jsoncons 解析/序列化/对象访问核心 API"
    command: "./test_jsoncons"

assertion_count: 5