software: jpegqs
# 版本级 manifest（ARCHIVE-SPEC v2.0）
# 文件位置: archives/j/jpegqs/1.20210408/manifest.yaml

version: "1.20210408"
status: built
build_system: makefile
build_date: "2026-09-25"

source:
  url: "https://github.com/ilyakurdyukov/jpeg-quantsmooth/archive/refs/tags/1.20210408.tar.gz"
  sha256: "5937ca26db33888cab8638c1a8dc7a367a953bd0857ceb1290d5abc6febf3116"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: "make CC=clang AR=llvm-ar SIMD=none MTOPTS= JPEGLIB='-I<libjpeg>/include -L<libjpeg>/lib -ljpeg' -j1 app lib"
  dependencies:
    - "libjpeg/10"
  cc: clang
  cxx: ""

patches_applied: []

knowledge_gained:
  - "上游 Makefile 无 install 目标、无 PREFIX、无 check/TESTS：package() 只能手工 copy 产物（配合 E174 OHOS 无 install(1)）"
  - "Makefile 里 SIMD := native 会把构建机 ISA 烧进产物；命令行变量优先级高于 := 赋值，故 make SIMD=none 可覆盖成可复现的标量路径"
  - "quantsmooth.h 的 <omp.h> 与所有 OpenMP 循环都在 #ifdef _OPENMP 之下并有 omp_get_thread_num()->0 退化实现，make MTOPTS= 去掉 -fopenmp 后产物不再依赖 OpenMP 运行时"

test_summary:
  upstream_tests: 0
  adapted_assertions: 12
  pass_rate: "12/12"
