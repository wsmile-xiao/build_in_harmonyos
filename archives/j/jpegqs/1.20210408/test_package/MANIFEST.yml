# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e - jpegqs 1.20210408
package: jpegqs/1.20210408
homepage: "https://github.com/ilyakurdyukov/jpeg-quantsmooth"

# Upstream ships no test suite. Evidence:
#   tar tzf jpegqs_1.20210408.orig.tar.gz | grep -ciE 'test|spec|check'  -> 0
#   grep -n '^[a-z_-]*:' Makefile  -> only clean/all/app/lib + file rules,
#   no check/TESTS target, no install target.
#   => upstream_check_command is intentionally empty: asking CI to run
#      `make check` would only produce "No rule to make target", and it would
#      contradict upstream_tests: [] below.
upstream_check_command: ""

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Executes the packaged jpegqs CLI twice on a libjpeg-generated baseline JPEG (exit status, output size, SOI/EOI markers, output actually differs from input, -q/-n/-o path), checks the packaged libjpegqs.a, libjpegqs.h and LICENSE"
    command: "bash test.sh"
  - file: makejpeg.c
    description: "Reference-encoder harness compiled against libjpeg/10 that produces the input JPEG the CLI consumes"
    command: "./makejpeg"
  - file: consumer.c
    description: "Consumer program compiled and linked against the packaged libjpegqs.a; executed to prove do_quantsmooth resolves at a real address"
    command: "./consumer"

assertion_count: 12
