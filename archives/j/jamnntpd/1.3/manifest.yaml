  upstream_executed: 0
  upstream_note: "No configure/make check target upstream; build() runs 'make -f Makefile.linux check' and the build log carries the verbatim 'No rule to make target' error"
  consumer_total: 2
  consumer_note: "test_package: loopback NNTP protocol client asserting 200 greeting + 500 + 411 + 340 + 205 replies; makechs generating a real .chs table with content assertions"
