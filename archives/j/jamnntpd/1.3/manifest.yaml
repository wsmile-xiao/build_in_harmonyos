knowledge_gained:
  - "OHOS musl: jam.h typedefs ulong/ushort under #ifndef linux; clang's default gnu std defines 'linux' so builds must pass -Ulinux (glibc used to expose ulong via sys/types.h, musl does not even with _GNU_SOURCE)"
  - "OHOS sys/file.h is a minimal BSD header that does NOT include fcntl.h; jamlib mbase.c needs struct flock/F_WRLCK -> compile with -include fcntl.h (no source patch)"
  - "OHOS clang wrapper signs the ELF at link time (-Wl,--code-sign); post-link strip invalidates the signature -> STRIP=: and ship unstripped binaries"
  - "SourceForge publishes only jamnntpd-1.3.zip (no tarball); the Ubuntu pool .orig.tar.gz is a Debian repack, so container hashes can never match — conandata must carry the official zip URL + zip sha256"
  - "SourceForge download endpoints 403 datacenter IPs (device/CI included); bypassed locally by pre-seeding conan's content-addressed core.sources download cache (E347), official URL kept in conandata.yml"

test:
