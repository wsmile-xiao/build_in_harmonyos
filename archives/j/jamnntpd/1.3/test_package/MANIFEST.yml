# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jamnntpd/1.3
homepage: "https://ftnapps.sourceforge.net/jamnntpd.html"

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# jamnntpd 上游无自动化测试入口，build() 仍真实执行一次以留证
upstream_test_in_build: false
upstream_test_command: "make -f Makefile.linux check"
upstream_tests_skip_reason: >-
  Upstream jamnntpd 1.3 ships no test suite and no 'check' target; build()
  runs 'make -f Makefile.linux check' once and the build log carries the
  verbatim error "make: *** No rule to make target 'check'.  Stop."
  (N_static = 0, honestly zero, not a skip)

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_script.py
    description: >-
      loopback NNTP 协议消费者测试：在 127.0.0.1 随机空闲端口真实启动 jamnntpd
      守护进程（-port/-allow/-groups/-xlat/-logfile），自写 NNTP 客户端断言
      200 欢迎横幅 + 500 未知命令 + 411 无此组 + 340 POST 就绪 + 205 QUIT
      五类应答码（6 项断言）
    command: "conan test"
  - file: test_script.py
    description: >-
      makechs 生成物断言：真实运行 makechs 生成 .chs 字符集映射表，断言退出码
      0、"; Generated by makechs" 签名、字符集名与映射行内容（4 项断言）
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10

# 消费者测试内存预算（§14.1④：先评估后执行；实测守护进程峰值 RSS ~4MB、
# makechs ~4MB，预算取 64MB 留 16 倍余量）
max_rss_mb: 64
