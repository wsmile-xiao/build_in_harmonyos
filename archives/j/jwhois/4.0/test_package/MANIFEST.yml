# test_package/MANIFEST.yml — jwhois 4.0
# CI L0e requires this file to exist.

package: jwhois/4.0
homepage: "https://www.gnu.org/software/jwhois/"

# jwhois 4.0 ships no upstream test suite: Makefile.am has no TESTS/check_PROGRAMS,
# there is no tests/ or testsuite/ directory, and no dejagnu integration anywhere
# in the tarball (verified against the 4.0 release).
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs jwhois --version/--help output assertions, missing-config error path (exit non-zero, 'Unable to open'), and connect-refusal error path for 127.0.0.1:1 (exit non-zero, 'Unable to connect')"
    command: "bash test.sh"

# Approximate assertion count (version, help, config error, connect error)
assertion_count: 4
