# conandata.yml — jwhois 4.0

sources:
  url: "https://ftp.gnu.org/gnu/jwhois/jwhois-4.0.tar.gz"
  sha256: "fa9bb86782b915c6d730bb723f876dc9b345a617db375aaf3416ec22553cd64e"

patches:
  - patch_file: "patches/0001-src-Makefile-am-libgnu-builddir.patch"
    patch_description: "Link gnulib runtime from build dir: 2007-era src/Makefile.am hardcodes $(top_srcdir)/gl/libgnu.a, which does not exist in VPATH (out-of-tree) builds"
    patch_type: "portability"
  - patch_file: "patches/0002-src-Makefile-in-libgnu-builddir.patch"
    patch_description: "Same top_srcdir -> top_builddir fix for the shipped src/Makefile.in (jwhois_DEPENDENCIES + jwhois_LDADD), no autoreconf available in CI"
    patch_type: "portability"
