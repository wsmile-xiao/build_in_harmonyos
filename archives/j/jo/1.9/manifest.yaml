# 知识沉淀
knowledge_gained:
  - level: L1
    category: platform_truth
    topic: HMDFS_mktemp_permission
    description: HMDFS 文件系统中 mktemp 创建的目录权限过严（2700），无法在其中创建文件
    solution: 使用预创建的可写目录替代 mktemp，或使用外部构建目录
    reference: R10
    
  - level: L1
    category: platform_truth
    topic: HongMeng_tmp_readonly
    description: HongMeng 系统的 /tmp 挂载为只读 erofs 文件系统
    solution: 使用 $TMPDIR 环境变量替代硬编码 /tmp 路径
    reference: R10, E002

# 已知问题
known_issues:
  - issue: HMDFS_mktemp_strict_permission
    severity: warning
    description: configure 脚本使用 mktemp 在 HMDFS 中创建的临时目录权限过严
    workaround: 手动修改 configure 或使用外部构建目录
    auto_fix: false
    
  - issue: HongMeng_tmp_readonly
    severity: info
    description: /tmp 目录只读，所有临时文件必须使用 $TMPDIR
    workaround: 设置 TMPDIR 环境变量
    auto_fix: true (补丁已应用)
    
  - issue: G0_clean_build_verify_fail
    severity: warning
    description: 干净构建验证失败（configure 补丁包含硬编码路径）
    workaround: 手动验证已通过，功能正常
