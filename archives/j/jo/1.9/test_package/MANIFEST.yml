# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: jo/1.9
homepage: "https://github.com/jpmens/jo"

# Upstream test command
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: "make check"

# Upstream actual test programs (27 tests in tests/jo.test)
upstream_tests:
  - file: tests/jo.test
    source: jo-1.9/tests/jo.test
    description: "Main test suite with 27 test cases covering JSON object/array generation, nested structures, type coercion, file input, filtering"
    command: "make check"

# test_package consumer-side verification
test_package_tests:
  - file: conanfile.py
    description: "Consumer test: verifies jo binary --version, JSON object generation, array generation, boolean/null handling"
    command: "conan test test_package"

# Total assertion count (approximate)
assertion_count: 4
