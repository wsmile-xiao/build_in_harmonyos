package: jellyfish1/1.1.11
homepage: "https://github.com/gmarcais/Jellyfish"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check -k (inside build(), OHOS real device, conan create 第 2 轮 2026-09-25 07:20)"
automake_summary: "15 of 19 tests failed. (1 test was not run)."
# 分层口径：下面 20 条是 automake TESTS 注册面（runner 层）。unit_tests.sh 是
# googletest runner，展开为 6 个原子用例（另列）。19 项实际执行，4 通过 15 失败；
# 15 条失败全部是同一家族：tests/compat.sh 的 check() 把上游 baked 的 md5 与本次
# 产物比对，差异只出现在字节级产物（数据库文件 _0、histo、stats、全量 dump），
# 而逻辑计数结果与上游一致（-L 2 过滤 dump 与 query 产物的 md5 逐字节相同）。
# 证据件（行号一律指 reports/w3-local-ci.log，第 2 轮重跑）：automake 汇总在 :788
# （"15 of 19 tests failed"）、UPSTREAM_MAKE_CHECK_RC=2 在 :800；4 条 PASS 的一手证据
# 是 make check 的 stdout，判决行在 :767/:773/:783/:786；15 条 FAIL 在
# :801-813,:815,:816，1 条 SKIP（big.sh, exit 77）在 :814。
# ⚠ build 目录下的 test-suite.log 只有 16 条判决行（15 FAIL + 1 SKIP，其 :5 为
# "15 of 19 tests failed.  (1 test was not run)."）——automake 不往该文件写 PASS 行，
# 配方也正是从它解析 UPSTREAM_TEST（conanfile.py:224-232，当前 HEAD 复核：
#   :224 取 test-suite.log、:225-227 缺文件即 raise、:228-232 逐行 print
#   UPSTREAM_TEST；:210 是 autotools.make(args=["-j1"])，不是解析块），
#   所以 PASS 不能引它。
upstream_tests:
  - file: tests/generate_sequence.sh
    source: jellyfish-1.1.11/tests/generate_sequence.sh
    description: "上游测试数据生成器（10M 与 5x1M fasta 与 20/44 位 GF(2) 转移矩阵）；打补丁前整场 19 项都因它 abort 而级联失败"
    result: "PASS (exit 0, 产出 seq10m.fa 10142872B、seq1m_*.fa、seq10m_matrix_10/_22)"
  - file: tests/generate_fastq_sequence.sh
    source: jellyfish-1.1.11/tests/generate_fastq_sequence.sh
    description: "fastq 测试数据生成（10M fq）"
    result: "PASS (exit 0, 产出 seq10m.fq)"
  - file: tests/parsers.sh
    source: jellyfish-1.1.11/tests/parsers.sh
    description: "double fifo 输入层与 read parser 行为测试；依赖 0002 补丁（OHOS 无 pthread_cancel）"
    result: "PASS (exit 0)"
  - file: unit_tests/unit_tests.sh
    source: jellyfish-1.1.11/unit_tests/unit_tests.sh
    description: "googletest runner，注册 6 个原子用例：SimpleCircularBufferTest.FillEmpty / SimpleCircularBufferTest.Usefull / SquareBinaryMatrix.Initialization / OffsetsTest-ComputeOffsetsTest.CheckCoherency 的 0 1 2 三个参数化实例（--gtest_list_tests 实测）"
    result: "PASS (exit 0; 6 个原子用例全通过，补丁前 SquareBinaryMatrix.Initialization 因同一 terminate 挂掉)"
  - file: tests/big.sh
    source: jellyfish-1.1.11/tests/big.sh
    description: "30G 碱基生成 + 16-mer 计数"
    result: "SKIP (exit 77) - 上游自身条件：if [ -z BIG ] then exit 77；非平台限制，分母不缩"
  - file: tests/serial_hashing.sh
    source: jellyfish-1.1.11/tests/serial_hashing.sh
    description: "22-mer 单线程计数，比对 _0 与 histo 的 baked md5"
    result: "FAIL (md5 基线) - 差异项 serial_hashing_0 与 serial_hashing.histo"
  - file: tests/parallel_hashing.sh
    source: jellyfish-1.1.11/tests/parallel_hashing.sh
    description: "22-mer 20 线程计数 + dump/query/stats 全链"
    result: "FAIL (md5 基线) - 差异项 parallel_hashing_0 .histo .stats _all.dump _S_all.dump；而 _L.dump .dump _stream.dump .query 四项与上游 baked 值逐字节相同"
  - file: tests/serial_direct_indexing.sh
    source: jellyfish-1.1.11/tests/serial_direct_indexing.sh
    description: "10-mer 直接索引表，单线程"
    result: "FAIL (md5 基线) - 仅 serial_direct_indexing_0 字节不同，histo 与 stats 与上游一致（⇒ 计数值一致，库文件序列化不同）"
  - file: tests/parallel_direct_indexing.sh
    source: jellyfish-1.1.11/tests/parallel_direct_indexing.sh
    description: "10-mer 直接索引表，20 线程"
    result: "FAIL (md5 基线) - 差异项 _0 .histo _S.histo _LU.histo .stats"
  - file: tests/raw_hash.sh
    source: jellyfish-1.1.11/tests/raw_hash.sh
    description: "原始哈希表输出"
    result: "FAIL (md5 基线) - 差异项 raw_hash.histo raw_hash.stats"
  - file: tests/multi_file.sh
    source: jellyfish-1.1.11/tests/multi_file.sh
    description: "多输入文件（seq1m_*.fa）计数"
    result: "FAIL (md5 基线) - 差异项 multi_file.stats"
  - file: tests/multi_file_fastq.sh
    source: jellyfish-1.1.11/tests/multi_file_fastq.sh
    description: "多输入 fastq 计数"
    result: "FAIL (md5 基线) - 差异项 multi_file_fastq.histo"
  - file: tests/from_stream.sh
    source: jellyfish-1.1.11/tests/from_stream.sh
    description: "从管道 /dev/fd/0 读 fasta 计数"
    result: "FAIL (md5 基线) - 差异项 from_stream_0 from_stream.histo"
  - file: tests/from_stream_fastq.sh
    source: jellyfish-1.1.11/tests/from_stream_fastq.sh
    description: "从管道读 fastq 计数"
    result: "FAIL (md5 基线) - 差异项 from_stream_fastq.histo"
  - file: tests/parallel_fastq_hashing.sh
    source: jellyfish-1.1.11/tests/parallel_fastq_hashing.sh
    description: "fastq qmer 并行计数"
    result: "FAIL (md5 基线) - 差异项 _lines.dump .histo .stats"
  - file: tests/parallel_fastq_sequence_hashing.sh
    source: jellyfish-1.1.11/tests/parallel_fastq_sequence_hashing.sh
    description: "fastq 忽略质量并行计数"
    result: "FAIL (md5 基线) - 差异项 .histo"
  - file: tests/merge.sh
    source: jellyfish-1.1.11/tests/merge.sh
    description: "分库合并（merge_quake）"
    result: "FAIL (md5 基线) - 差异项 merge_quake.histo"
  - file: tests/min_qual.sh
    source: jellyfish-1.1.11/tests/min_qual.sh
    description: "最小质量阈值计数"
    result: "FAIL (md5 基线) - 差异项 min_qual.histo"
  - file: tests/small.sh
    source: jellyfish-1.1.11/tests/small.sh
    description: "148 碱基小样本 + canonical 计数（自带输入，不依赖级联）"
    result: "FAIL (md5 基线) - 差异项 small.histo 与 small.stats；实测产物为 histo 一行 1 132、stats Distinct 132 与 Total 132，与 148-(20-1)=129 之外的 17-mer 全互异预期一致（计数逻辑正确，字节基线不复现）"
  - file: tests/parallel_fastq_direct_indexing.sh
    source: jellyfish-1.1.11/tests/parallel_fastq_direct_indexing.sh
    description: "fastq 直接索引并行计数"
    result: "FAIL (md5 基线) - 差异项 _LU.histo .histo"
test_package_tests:
  - file: mmap_probe.cc
    description: "Compiled and linked against the installed public headers (include/jellyfish-1.1.11/jellyfish/mapped_file.hpp) plus libjellyfish-1.1; calls mmap(2) with the same PROT_READ/MAP_PRIVATE argument list as mapped_file::map() (mapped_file.hpp line 52), on the database the CLI produced"
    command: "./mmap_probe db_0"
    result: "MMAP_RESULT=OK size=258 first_byte=74（reports/w3-local-ci.log:886）与 MUNMAP=OK（:887），exit 0；第 2 轮 2026-09-25 重跑同读数"
  - file: run_cli_tests.sh
    description: "Drives the packaged jellyfish CLI on a real two-read fasta: count -m 4 (1 and 4 threads), dump -c, query via stdin, --stats file; asserts hand-derived k-mer counts"
    command: "./run_cli_tests.sh"
    result: "ALL_CLI_ASSERTIONS_PASSED（第 2 轮 conan create 2026-09-25）"
assertion_count: 10
# 计数口径（按被审脚本逐条复算；上一轮这里写 9 条，是把「dump 产物非空」那条漏计了）：
#   run_cli_tests.sh 内 8 条 —— :18 db_0 存在且非空、:19 db.stats 存在且非空、
#   :22 dump.txt 存在且非空、:24 dump 行 "CCGG 2" 恰好一条、:28 query CCGG=2、
#   :32 query ACCG=2、:36 query ACGT=0、:42 4 线程重算后 query CCGG=2；
#   + mmap_probe 的 MMAP_RESULT 与退出码 1 条（在 :44 被调用）
#   + test_package build() 真编译真链接 1 条（conanfile.py:64-65）
#   = 10。
# ⚠ 断言数 10 不等于用例数：上游 automake 注册面 20 个 runner、静态原子用例 25 个，
#   两个口径在 notes.md 的五维账本里另列，不并入本数、也不互相换算。
