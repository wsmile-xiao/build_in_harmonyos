version: "1.1.11"
software: "jellyfish1"
status: built
build_date: "2026-09-25"
build_system: "autotools"
source:
  url: "https://www.cbcb.umd.edu/software/jellyfish/jellyfish-1.1.11.tar.gz"
  sha256: "496645d96b08ba35db1f856d857a159798c73cbc1eccb852ef1b253d1678c8e2"
  tar_format: tar.gz
  provenance: "upstream official release tarball; byte-identical to the Debian
    .orig previously listed here (same sha256, diff -rq of both extracted trees
    reports no differing file)"
build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--disable-shared"
    - "--enable-static"
    - "ac_cv_type___int128=no"
  environment:
    - "TMPDIR=~/tmp (HMDFS; /tmp is read-only)"
    - "CONFIG_SHELL is a reverse experience here: the profile-forced
      /data/service/hnp/bin/bash is the failure cause, not the fix. The recipe
      rewrites that recorded path inside config.status to /bin/sh, re-runs
      config.status with CONFIG_SHELL=/bin/sh SHELL=/bin/sh as a command-line
      prefix assignment (full regeneration of every output, not only libtool),
      then self-checks with sh -n libtool - see conanfile.py
      _regen_build_outputs() and 1.1.11/notes.md section 3"
  dependencies: []
  cc: clang
  cxx: clang++
  cxxflags_extra:
    - "-DGTEST_USE_OWN_TR1_TUPLE=1"
    - "-Wno-narrowing"
    - "-Wno-error"
    - "-Wno-error=register"
    - "-Wno-error=dynamic-exception-spec"
    - "-Wno-error=c++11-narrowing"
patches_applied:
  - "patches/0001-err-hpp-raise-t-noexcept-false.patch"
  - "patches/0002-double_fifo_input-cooperative-shutdown.patch"
knowledge_gained:
  - "OHOS: a 2013 config.sub rejects the -musl triplet (machine aarch64-unknown-linux not recognized); pin the gnu triplet instead of patching config.guess"
  - "OHOS: profile-forced CONFIG_SHELL=bash makes legacy autoconf generate an unparseable libtool (escaping lost) and pick ECHO=print, a toybox-ash-only builtin; rewrite the bash path recorded inside config.status to /bin/sh and regenerate every output with a command-line prefix assignment CONFIG_SHELL=/bin/sh (overriding it in the toolchain env does not work, the profile buildenv is sourced last)"
  - "OHOS: musl provides no pthread_cancel; jellyfish 1.1.11 double_fifo_input destructor needs a cooperative shutdown plus pthread_join"
  - "OHOS: make -j2 jobserver mkfifo is EPERM on HMDFS; build with -j1 (upstream tests still run 20 threads internally)"
  - "OHOS: upstream installs headers to include/jellyfish-<version>/jellyfish, so cpp_info.includedirs must point there"
  - "conan 2.29: apply_conandata_patches reads the patches key and patch() takes strip, not patch_strip - patch_files/patch_strip are silently ignored"
