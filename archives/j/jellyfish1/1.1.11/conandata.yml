# Upstream official release site for Jellyfish 1.x - the project's own
# download page (https://www.cbcb.umd.edu/software/jellyfish/), which is also
# what Debian's uscan rule for this package watches.  Verified on device
# 2026-09-25: this URL returns HTTP 200 application/x-gzip, 1067138 bytes,
# sha256 identical to the previously used Debian .orig, and diff -rq over the
# two extracted trees reports zero differing files (183 files each).  See
# notes.md, section 「源码来源」, for the command-level evidence.
sources:
  url: "https://www.cbcb.umd.edu/software/jellyfish/jellyfish-1.1.11.tar.gz"
  sha256: "496645d96b08ba35db1f856d857a159798c73cbc1eccb852ef1b253d1678c8e2"

# NOTE: this conan reads the entries from the "patches" key (apply_conandata_patches
# in conan/tools/files/patches.py) and forwards each entry as kwargs to patch(),
# whose strip parameter is literally named "strip"; a "patch_strip" key is
# swallowed by **kwargs and silently ignored (verified against conan 2.29.1 on
# device).  Both facts are why the keys below look the way they do.
patches:
  - patch_file: "patches/0001-err-hpp-raise-t-noexcept-false.patch"
    patch_description: "raise_t throws from its destructor, which is implicitly noexcept since C++11, so every eraise became std::terminate and no handler could ever catch it"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-double_fifo_input-cooperative-shutdown.patch"
    patch_description: "OHOS libc provides no pthread_cancel; shut the input thread down cooperatively and join it"
    patch_type: "portability"
    strip: 1
