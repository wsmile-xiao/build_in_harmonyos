software: jellyfish1
display: "Jellyfish"
description: "Fast, memory efficient k-mer counting for DNA sequences"
category: science
homepage: "https://github.com/gmarcais/Jellyfish"
license: GPL-3.0-or-later
build_system: autotools
ohos_adaptation:
  key_points:
    - "OHOS: 2013 config.sub rejects the -musl triplet (machine aarch64-unknown-linux not recognized) - the --build/--host=aarch64-unknown-linux-musl pin used by other recipes does NOT work here; pin the gnu triplet instead of patching config.guess"
    - "OHOS: config.status mktemp -d under umask 077 makes a setgid dir without group-execute on HMDFS - relax to umask 002"
    - "OHOS: reverse experience - CONFIG_SHELL=/data/service/hnp/bin/bash (exported by the shared profile) breaks this package: legacy libtool loses one level of quoting and becomes unparseable, and it picks ECHO=print which that bash lacks. Rewrite the bash path recorded in config.status to /bin/sh and re-run it with CONFIG_SHELL=/bin/sh SHELL=/bin/sh as a command-line prefix assignment"
    - "OHOS: pre-patch upstream baseline fails 19 of 19 tests (probe-check.log:44) and that total failure comes from a throwing destructor in the delivered library header (jellyfish/err.hpp ~raise_t), implicitly noexcept since C++11, so eraise always reaches std::terminate - a language-rule issue, not cross-DSO RTTI matching (RC=134 measured for both static and shared link flavours); one-line upstream patch noexcept(false). Post-patch delivery round measures 4 PASS / 15 FAIL / 1 SKIP with make check rc=2 (1.1.11/reports/w3-local-ci.log:788, :800), the 15 being the tests/compat.sh baked-md5 baseline family rather than this mechanism - both denominators are reported side by side and neither replaces the other"
    - "OHOS: libtool-built shared libraries do not link compiler-rt builtins, so any __int128 path gives 'Error relocating ... __udivti3: symbol not found' at run time - pin ac_cv_type___int128=no"
versions:
  "1.1.11":
    status: built
    build_date: "2026-09-25"
    packaging: conan
    notes: "conan recipe (os=OHOS arch=armv8), no external conan deps; autotools build with upstream make check inside build()"
    dependencies: []
