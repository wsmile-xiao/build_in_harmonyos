# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jsonparse-cpp/1.00
homepage: "https://github.com/liufeigit/jsonParse"

# 上游项目无构建系统（无 configure/make/ctest），README 直接给出 clang 编译示例
upstream_check_command: "clang -O2 parse.c object.c test/testStr.c -o testStr && ./testStr"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（jsonParse 自带唯一测试入口 testStr.c，读取 test/*.json 并解析/打印/释放）
upstream_tests:
  - file: test/testStr.c
    source: jsonparse-cpp-1.00/test/testStr.c
    description: "上游唯一测试入口：解析 citm_catalog.json（含嵌套 dict/array/浮点/unicode），调用 parseJSON + object_toString + object_free，输出解析长度与耗时"
    command: "./testStr"

# test_package 中自带的测试 (消费者视角验证，调用实测公开 API)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过公开头文件 parse.h/object.h 调用 parseJSON/object_toString/object_free，验证 round-trip 结果"
    command: "./test_jsonparse-cpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6