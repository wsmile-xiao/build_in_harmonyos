software: jline3
display: "JLine3"
description: "Java 控制台输入处理库：终端、行读取器与内建命令（community 版 bundle）"
category: foundation
homepage: "https://github.com/jline/jline3"
license: "BSD-3-Clause"
build_system: maven

ohos_adaptation:
  key_points:
    - "纯 Java 交付：四个 JAR 全部为 Java 8 字节码（major 52），无 ELF 产物"
    - "reactor 子集构建 terminal/reader/builtins/bundle；terminal-jna/jansi 因需 JDK 同签名本地库不打包（E083/E084）"
    - "系统终端无 JNA/Jansi 时经 ExecPty 走 busybox stty 驱动，test_package 以真实 pty 验证属性/尺寸往返"
    - "OHOS 设备 JVM user.home 为 '?'，构建显式固定 -Duser.home 与 -Dmaven.repo.local 到 build 目录"
    - "JDK 9+ 移除 -profile：补丁改为 --release 8；构建与测试共享固定 SHA-256 的 BiSheng JDK 17.0.13"
    - "-Dos.name=Linux 经 JAVA_TOOL_OPTIONS 注入 Maven 与 surefire fork JVM"
  common_dependencies: []

versions:
  "3.3.1":
    status: built
    build_date: "2026-09-25"
    conan_ref: "jline3/3.3.1"
