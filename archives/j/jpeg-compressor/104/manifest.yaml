# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/104/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "104"

# 软件名
software: "jpeg-compressor"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/richgel999/jpeg-compressor/archive/refs/tags/v104.tar.gz"

  # 源码校验和
  sha256: "696735dc7e4ca88bf7bd00b96290d9de56d03691e690297b201e0f5baee13371"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "jpge/jpgd 为完全自包含的 C++ 编解码库，无第三方依赖，可直接编译为静态库"
- "jpge::compress_image_to_jpeg_file_in_memory 的 buf_size 参数为 int&（非 size_t）"
- "conandata.yml 多版本嵌套时 get() 需用 sources[version] 取单版本条目"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
