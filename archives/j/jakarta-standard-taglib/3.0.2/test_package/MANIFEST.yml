# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点（R51）：
#   `impl` 模块**确有测试**：`impl/src/test/java/org/apache/taglibs/standard/lang/jstl/test/`
#   下 3 个测试类（EvaluationTest / FunctionTest / ParserTest，JUnit 5 +
#   junit-jupiter-engine 5.8.2），另有 TestUtilities / Bean1 / Bean2 / Bean2Editor 辅助类；
#   由 Maven surefire 真跑 → 本包在 build() 内真跑并解析 surefire-reports 硬断言。
#   （`api` 模块是纯 API，无 src/test；`spec`/`tagsdoc` 是文档模块，不在构建范围。）

package: jakarta-standard-taglib/3.0.2
homepage: "https://github.com/jakartaee/tags"

upstream_check_command: "mvn -pl api,impl -am clean package -B -DskipTests=false"

upstream_test_in_build: true
upstream_test_command: "mvn -pl api,impl -am clean package -B -DskipTests=false（surefire 跑 impl 模块 JUnit 5 套件）"

upstream_tests:
  - file: impl/src/test/java/org/apache/taglibs/standard/lang/jstl/test/EvaluationTest.java
    source: "jakarta-standard-taglib_3.0.2.orig.tar.xz（Debian pool orig tarball，sha256 82db2bde…）"
    description: "JUnit 5：JSTL 表达式求值（ExpressionEvaluator）用例"
    command: "mvn -pl api,impl -am clean package -B -DskipTests=false"
    count: 1
  - file: impl/src/test/java/org/apache/taglibs/standard/lang/jstl/test/FunctionTest.java
    source: "同上"
    description: "JUnit 5：JSTL EL 函数（org.apache.taglibs.standard.functions.Functions 等）用例"
    command: "同上"
    count: 1
  - file: impl/src/test/java/org/apache/taglibs/standard/lang/jstl/test/ParserTest.java
    source: "同上"
    description: "JUnit 5：EL 解析器用例"
    command: "同上"
    count: 1

release_smoke_tests:
  - file: "libexec/jakarta.servlet.jsp.jstl-api-3.0.2.jar + libexec/jakarta.servlet.jsp.jstl-3.0.2.jar"
    source: "包产物（api 与 impl 两个模块经 Maven 构建）"
    description: "两个 jar 均为合法 zip 且含关键类；用消费者程序端到端验证 impl 侧真实 EL 函数可调用"
    command: "python3 check_jstl.py <package-folder>"

test_package_tests:
  - file: check_jstl.py
    description: >-
      消费者校验 5 项：①产物齐备（api + impl 两个 jar）②两个 jar 均为合法 zip 且含关键类
      与 META-INF/MANIFEST.MF ③容器 API jar（jakarta.servlet-api 6.0.0 / jsp-api 3.1.0 /
      el-api 5.0.0）自 Maven Central 自取并 sha256 钉校验 ④**端到端真跑**：javac + java，
      classpath = 包内两个 jar + 三个容器 API jar，调用
      org.apache.taglibs.standard.functions.Functions.toUpperCase("atom") 并断言 "ATOM"
      ⑤证据（两个 jar 的大小与 sha256、所用 JDK）。
      只有具名环境信号（本环境无网络）才允许 SKIP，其余一律 FAIL。
    command: "python3 check_jstl.py <package-folder>"

assertion_count: 5
