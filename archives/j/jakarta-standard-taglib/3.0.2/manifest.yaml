# 版本级 manifest — jakarta-standard-taglib 3.0.2
version: "3.0.2"
software: "jakarta-standard-taglib"
status: built
build_date: "2026-10-08"
build_system: maven

source:
  url: "https://deb.debian.org/debian/pool/main/j/jakarta-standard-taglib/jakarta-standard-taglib_3.0.2.orig.tar.xz"
  sha256: "82db2bde4a180d0952fc66116aca78cf2d3e0e210bd0e01f72e46813ad111289"
  note: >-
    Debian pool 的 orig tarball（291580 B，顶层目录 `jakarta-standard-taglib-3.0.2/`）。
    Debian 侧同一上游版本另有 `src.tar.xz`（重打包），本配方取 `orig.tar.xz`（更贴近上游发布树）。
    项目为 Maven 多模块：**api**（`jakarta.servlet.jsp.jstl-api` 3.0.2）+ **impl**
    （`jakarta.servlet.jsp.jstl`，上游 pom 自身版本写作 `3.0.2-SNAPSHOT`）+ **spec**/**tagsdoc**（文档）。

build:
  system: maven
  dependencies: []          # 无 Conan requires：构建/测试期依赖全部由 Maven 自取
  modules_built: ["api", "impl"]
  modules_excluded:
    - "spec（文档模块，无制品）"
    - "tagsdoc（asciidoctor 文档模块，依赖 asciidoctorj/jruby-complete，不在构建范围）"
  reactor_pruning_note: >-
    本例裁剪掉的是**纯文档模块**，被发布的 api/impl 制品仍由各自模块源码编译，
    不属「裁剪会改变产物来源」的情形（后者见知识草稿：Maven reactor 裁剪会让
    maven-dependency-plugin 改拉中央仓现成 jar）。
  dependencies_verified:
    - "jakarta.servlet-api 6.0.0 / jakarta.servlet.jsp-api 3.1.0 / jakarta.el-api 5.0.0（provided；Maven Central 实测 200）"
    - "jakarta.servlet.jsp.jstl-api 3.0.0（impl 的 provided 依赖；Maven Central 实测 200）"
    - "xalan 2.7.3（impl compile 依赖；Maven Central 实测 200）"
    - "junit-jupiter-engine 5.8.2（test；Maven Central 实测 200）"
  toolchain:
    - "bishengjdk 17.0.13（JAVA_HOME → ~/bishengjdk17 → ~/usr/local/bishengjdk17 → PATH）"
    - "apache-maven 3.9.11（自 repo1.maven.org 自取，sha256 4b7195b6… 钉校验）"
  build_steps:
    - "mvn -pl api,impl -am clean package -B -DskipTests=false（单 reactor：父 pom + api + impl）"
    - "package()：api jar 原样入 libexec/；impl jar 因上游 pom 版本为 3.0.2-SNAPSHOT，定位后重命名为 jakarta.servlet.jsp.jstl-3.0.2.jar（jar 内 MANIFEST 与文件名无关）"
  artifacts:
    - "libexec/jakarta.servlet.jsp.jstl-api-3.0.2.jar  46227 B  sha256 77bab6990995c64074d49c79383ab7c75366d1a6df20d21d474c6f4abd02a712"
    - "libexec/jakarta.servlet.jsp.jstl-3.0.2.jar      4024776 B sha256 d00e0fdcdef91939263987e9e6bbefb4ec2f7d4d14656072954ea592ca989df0"

patches_applied: []          # 本项目用的是 maven-bundle-plugin 5.1.3（非会抛 CME 的 4.2.1），无需兼容补丁

upstream_tests:
  framework: junit5
  test_sources: 3
  test_files:
    - "impl/src/test/java/org/apache/taglibs/standard/lang/jstl/test/ParserTest.java"
    - "impl/src/test/java/org/apache/taglibs/standard/lang/jstl/test/EvaluationTest.java"
    - "impl/src/test/java/org/apache/taglibs/standard/lang/jstl/test/FunctionTest.java"
  helper_sources:
    - "TestUtilities.java / Bean1.java / Bean2.java / Bean2Editor.java（测试辅助类，非用例）"
  test_command: "mvn -pl api,impl -am clean package -B -DskipTests=false（surefire 跑 impl 模块 JUnit 5 套件）"
  run_in_build: true
  evidence: >-
    `impl` 模块**确有测试**（`api` 模块为纯 API、无 src/test）。build() 内由 surefire 真跑，
    配方随后解析 `impl/target/surefire-reports/*.txt` 并**硬断言**：报告目录/文件缺失即判
    「上游测试未真跑」并失败；`Tests run=0` 拒绝宣称成功；`Failures>0 || Errors>0` 判真实失败并中止。
    surefire 是唯一权威来源，不靠日志关键字猜测。
upstream_test_pass_rate: >-
  **3/3 真跑通过（100%）**——本地 `conan create` 实测 surefire 汇总：
  `[upstream tests] surefire reports=3  Tests run=3 Failures=0 Errors=0 Skipped=0`
  （ParserTest 1 + EvaluationTest 1 + FunctionTest 1，逐个 `Tests run: 1, Failures: 0, Errors: 0`）。
  无失败、无省略、无未运行项，未虚构任何数字。
adapted_test_pass_rate: >-
  **test_package/check_jstl.py 5 项全部通过（`checks=5 fails=0 skips=0` / `RESULT: PASS`）**：
  ①产物齐备（api 46227 B + impl 4024776 B）②两个 jar 均为合法 zip，关键类
  （`jakarta/servlet/jsp/jstl/core/Config.class`、`.../fmt/LocaleSupport.class`、`.../sql/Result.class`、
  `org/apache/taglibs/standard/functions/Functions.class`）与 `META-INF/MANIFEST.MF` 齐备
  ③容器 API jar（jakarta.servlet-api 6.0.0 / jsp-api 3.1.0 / el-api 5.0.0）自 Maven Central 自取并
  **sha256 钉校验**通过 ④**端到端真跑**：javac + java（classpath = 包内两个 jar + 三个容器 API jar），
  调用 impl 侧真实 EL 函数 `org.apache.taglibs.standard.functions.Functions.toUpperCase("atom")`
  并断言返回 `ATOM`（同时证明 api 类可加载、impl 依赖链与 classpath 正确）
  ⑤证据（两个 jar 的大小与 sha256、JDK=bishengjdk17 openjdk 17.0.13）。
  仅具名环境信号（本环境无网络）可 SKIP，本轮无 SKIP。

knowledge_gained:
  - "**Maven 多模块项目要区分「安全的 reactor 裁剪」与「会改变产物来源的裁剪」**：裁掉纯文档模块（本例 spec/tagsdoc）不影响到制品；但裁掉被制品引用的模块会让 maven-dependency-plugin 改从中央仓拉现成 jar —— 那才是「构建看似成功却已非源码编译」（对照知识：jakarta-activation 的 C5C1）"
  - "**上游模块 pom 的版本可能是 -SNAPSHOT（发布树未改版本号）**，产物名会带 `-SNAPSHOT`；打包时按前缀定位再重命名为发布名即可（jar 内 MANIFEST 与文件名无关），但必须在 manifest/notes 里如实说明改名一事"
  - "**Java 库的「端到端真跑」要挑一个不依赖容器的真实入口**：JSTL impl 的 `Functions`（纯静态 EL 函数）可在无 servlet 容器下被 java 直接调用并断言返回值——只做 `Class.forName` 反射加载会漏掉依赖链/classpath 缺陷（本例三者齐备才通过）"
  - "**消费者侧的容器 API（servlet/jsp/el）属容器提供、不随包发**：校验时从 Maven Central 自取并 sha256 钉住版本（本例 6.0.0 / 3.1.0 / 5.0.0），使校验既真实又确定"
