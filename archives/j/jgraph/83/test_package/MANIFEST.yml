package: jgraph/83
homepage: "https://web.eecs.utk.edu/~jplank/plank/jgraph/jgraph.html"

# Upstream ships no test suite: the 83 orig tarball contains only the C
# sources, the man page and example .jgr inputs (no tests/ directory), and
# the makefile defines no check/test target — `make -n check` reports
# "make: *** No rule to make target 'check'.  Stop." on the pristine .orig
# tree (see notes.md).  Upstream testing is therefore N=0 and the
# adaptation adds the consumer suite below (R51).
upstream_check_command: "make -n check  # no check target in upstream makefile"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_jgraph.sh
    description: "consumer suite: render/show/landscape/EPS/multi-page/error paths + AArch64 ELF check"
    command: "bash test_jgraph.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 25
