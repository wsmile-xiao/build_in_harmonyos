knowledge_gained:
  - "1992-1997 年的 K&R C 源码在 clang 15 下：非 void 函数中的裸 return; 是错误（-Wreturn-type），需按上游 8.5 的做法改成 void 过程；同文件内先调用后定义时还要补原型，否则 void 定义与隐式 int 声明冲突"
  - "aarch64 上隐式函数声明按 int 返回，会截断 malloc/get_node/make_list 的指针与 atof/sin/cos 的浮点返回值（表现为启动即 SIGSEGV）；上游仅用 -DLCC 引入 stdlib.h 是不够的，需无条件包含 stdio/stdlib/string/math 并在 list.h 声明返回指针的链表原语"
  - "draw_mark 的 fscanf(...) == NULL 永远匹配不到 EOF（int 与指针比较恒假），截断的 %%BoundingBox 会静默产生垃圾缩放；改为 != 1 后正确报错退出（上游 2007 快照同款修复）"
  - "draw_header 的 landscape 分支把 int 表达式传给 %f，64 位可变参数 ABI 下读到垃圾浮点值；显式转 double 后 -L 平移值恢复正确（Debian 83-26 同款修复）"
  - "上游 83 的 tarball 已从官网下架（404），官网现只发 8.4-8.6 线；Debian 83-26 的 orig tarball 与上游 83 内容一致（jgraph.c 与 man 页相同、README $Revision: 8.3 $），且 .dsc Checksums-Sha256 可交叉验证哈希"
  - "jgraph 无 --version/--help 选项（任何非选项参数都被当成输入文件名），CI L2 smoke test 会以非阻塞 warn 记录，不影响门禁"
