# conandata.yml — jgraph 83
# Upstream: Jim Plank's jgraph (University of Tennessee).
#   https://web.eecs.utk.edu/~jplank/plank/jgraph/jgraph.html
#
# Why the Debian source package is used: the upstream page no longer serves
# the 8.3/83 release (it now ships the 8.4-8.6 line as 2024-02-15-Jgraph.tar),
# and jgraph-83.tar.gz / jgraph-8.3.tar.gz both return HTTP 404 upstream.  The
# signed Debian source package jgraph 83-26 carries the pristine 1997 orig
# tarball; its .dsc Checksums-Sha256 field records exactly the hash below
# (e413b98a...546, 109419 bytes), and the 2007 snapshot still published on the
# upstream site (jgraph.tar.gz) contains the same jgraph.c and man page
# (README: $Revision: 8.3 $), so the bytes are the genuine upstream 83 source.
# Precedent in this repository: archives/l/libmm, archives/l/libbrahe,
# archives/c/choose-mirror, archives/x/xe (Debian pool orig tarballs).
#
# NOTE: the CI predownload step rewrites every http(s) text found in this file,
# so no extra URLs are pasted here.

sources:
  url: "https://deb.debian.org/debian/pool/main/j/jgraph/jgraph_83.orig.tar.gz"
  sha256: "e413b98a3ace184c4213d0bf025a2f433bb3f4be52d92ff64e8fa30016920546"

patches:
  - patch_file: "patches/0001-draw.c.patch"
    patch_description: "0001 draw.c make draw_label/draw_mark/draw_arrow/draw_legend void procedures (clang 15 rejects a bare return in an implicitly-int function); detect a truncated EPS %%BoundingBox with fscanf != 1 (the == NULL compare never matches EOF; upstream fixed this in its 2007 tarball); cast the landscape page translate to double because an int argument to %f is undefined on the 64-bit varargs ABI"
    patch_type: "portability"
  - patch_file: "patches/0002-edit.c.patch"
    patch_description: "0002 edit.c make edit_label/getpattern/edit_curve/edit_hash_label/edit_axis/edit_legend/edit_graph/edit_graphs void procedures (bare return in implicitly-int functions is an error with clang 15)"
    patch_type: "portability"
  - patch_file: "patches/0003-jgraph.h.patch"
    patch_description: "0003 jgraph.h include stdio.h/stdlib.h/string.h/math.h unconditionally (upstream pulled stdlib.h in only under -DLCC, leaving malloc/atof/sin/strlen implicitly declared as int, which truncates pointers and doubles on aarch64); declare the modernised void procedures so calls that precede a definition still type-check"
    patch_type: "portability"
  - patch_file: "patches/0004-list.c.patch"
    patch_description: "0004 list.c include stdlib.h and make insert/delete_item/free_node void procedures to match the new list.h declarations"
    patch_type: "portability"
  - patch_file: "patches/0005-list.h.patch"
    patch_description: "0005 list.h declare make_list/get_node/insert/delete_item/free_node (get_node and make_list return pointers; an implicit int declaration truncates them on aarch64 and crashes)"
    patch_type: "portability"
  - patch_file: "patches/0006-printline.c.patch"
    patch_description: "0006 printline.c make setfill/print_label void procedures (bare return in implicitly-int functions)"
    patch_type: "portability"
  - patch_file: "patches/0007-prio_list.c.patch"
    patch_description: "0007 prio_list.c make prio_insert a void procedure (bare return in an implicitly-int function)"
    patch_type: "portability"
  - patch_file: "patches/0008-process.c.patch"
    patch_description: "0008 process.c make process_legend/process_label/process_label_extrema void procedures (bare return in implicitly-int functions)"
    patch_type: "portability"
  - patch_file: "patches/0009-show.c.patch"
    patch_description: "0009 show.c make show_label/show_lmark/show_axis void procedures (bare return in implicitly-int functions)"
    patch_type: "portability"
  - patch_file: "patches/0010-token.c.patch"
    patch_description: "0010 token.c include stdlib.h/string.h (malloc/strcpy/strlen/atof) and make get_comment/nexttoken void procedures (bare return in implicitly-int functions)"
    patch_type: "portability"
