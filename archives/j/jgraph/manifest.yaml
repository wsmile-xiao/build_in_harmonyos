# 软件级 manifest — jgraph
# 文件位置: archives/j/jgraph/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: jgraph
display: "jgraph"
description: "Jim Plank 的绘图过滤器：把图形描述转换为 PostScript 输出"
category: utility
homepage: "https://web.eecs.utk.edu/~jplank/plank/jgraph/jgraph.html"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "1997 年 K&R C 源码：裸 return; 的隐式 int 过程需改为 void（同上游 8.5 的做法）"
    - "隐式声明在 aarch64 上会截断指针/浮点：需无条件包含 stdio/stdlib/string/math 并为 get_node/make_list 等补声明"
    - "EPS %%BoundingBox 的 EOF 检测（== NULL 永假）与 landscape 平移的 %f 传 int 是两处真实缺陷，已修复"
  common_dependencies: []

versions:
  "83":
    status: built
    build_date: "2026-09-21"
    conan_ref: "jgraph/83"
