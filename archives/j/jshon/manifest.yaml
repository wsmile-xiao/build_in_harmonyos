# 软件级 manifest
# 文件位置: archives/j/jshon/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: jshon
display: "jshon"
description: "命令行 JSON 解析工具：栈式过滤器管道，从 stdin/文件提取、编辑与创建 JSON"
category: utility
homepage: "https://github.com/keenerd/jshon"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - >-
      jshon.c 使用 BSD 遗留 uint 类型但从未包含 <sys/types.h>；OHOS musl 的
      sys/stat.h 改用 bits/alltypes.h，包含链到达不了 typedef，upstream
      -Werror 下编译失败。补丁 0001 在 #define _GNU_SOURCE 之后补上包含
      （Alpine missing-typesh.patch 同根因；插入位置必须在 _GNU_SOURCE 之后，
      已实证 Alpine 的文件首行位置在 OHOS 无效）。
    - >-
      OHOS clang 包装器对每次调用注入 -Wl,--code-sign（链接器自签），编译阶段
      触发 -Wunused-command-line-argument，被 upstream -Werror 升级为致命；
      经 Makefile 自带的 ${CFLAGS} 尾部追加 -Wno-unused-command-line-argument
      抑制（先例 aesfix/asterisk），不改 Makefile、不丢 upstream flags。
    - >-
      6 处 K&R 空参数列表 () 在 clang 15 -Wstrict-prototypes + -Werror 下失败，
      同法追加 -Wno-strict-prototypes 抑制（先例 asmotor），源码保持原始。
    - >-
      Makefile 无显式 .c→.o 与链接规则（make 内建规则）：CC 在 make 命令行
      钉住、CPPFLAGS/LDFLAGS 经环境注入；CFLAGS 必须走环境变量（Makefile 的
      ${CFLAGS} 尾部展开），走命令行会整体覆盖 upstream flags。
  common_dependencies:
    - jansson

versions:
