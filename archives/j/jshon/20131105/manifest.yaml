  cc: clang
  cxx: clang++

patches_applied:
  - "0001-include-sys-types.patch"

knowledge_gained:
  - "OHOS musl 的 sys/stat.h 改用 bits/alltypes.h，不再传递包含 sys/types.h；jshon.c 用 uint 却从未 include <sys/types.h>，包含链到达不了 typedef（守卫在 _GNU_SOURCE/_BSD_SOURCE 下），-Werror 下 unknown type name 'uint'。在 #define _GNU_SOURCE 之后补 include 即修复（连带消除 uint 回退 int 引起的 sign-compare）。与 Alpine missing-typesh.patch 同根因；Alpine 的文件首行位置在 OHOS 实证无效（__STRICT_ANSI__ 下 _BSD_SOURCE 不生效）。"
  - "OHOS clang 包装器经 .cfg 对每次调用注入 -Wl,--code-sign（链接器自签）；编译阶段该参数未使用触发 -Wunused-command-line-argument，被 upstream -Werror 升级为致命。经 Makefile 自带的 ${CFLAGS} 尾部追加 -Wno-unused-command-line-argument 抑制（先例 aesfix/asterisk），upstream flags 全保留。"
  - "jshon 20131105 的 6 处 K&R 空参数列表 ()（182/215/222/244/269/833 行）在 clang 15 -Wstrict-prototypes + -Werror 下失败；同法追加 -Wno-strict-prototypes 抑制（先例 asmotor），源码保持原始。"
  - "jshon 20131105 无 -c 紧凑输出选项（后期上游提交才加入），默认输出为 1 空格缩进的多行 JSON；test_package 断言按此格式逐字节验证。"
  - "jshon 顶层输入只接受 object/array，顶层标量（\"hi\"）报 json read error 退出 1；--version 原生支持（输出 20131105），--help 未注册（rc=2，usage 走 stderr）——E503 长选项判例仅部分适用。"

validation:
