      （-std=c99 -Wall -pedantic -Wextra -Werror 全保留）+ 两个 -Wno 抑制 +
      conan jansson 2.15.1 包头/库编译链接成功，产出 ELF64/AArch64/PIE 二进制
      （PT_INTERP /lib/ld-musl-aarch64.so.1，NEEDED libjansson.so + libc.so，
      无 RPATH/RUNPATH），并在本机原生运行 24 项行为全部符合预期；
      另以 recipe build() 同款调用路径（env CFLAGS/CPPFLAGS/LDFLAGS +
      make CC=clang -j1 jshon，GNU Make 4.4.1）冒烟通过。
    unpatched_reproduced: >-
      未打补丁且不加任何抑制时同一 flags 编译报 9 个错误：6 处
      -Wstrict-prototypes + uint（207 行）+ sign-compare（260 行）+ 包装器
      -Wl,--code-sign 引发的 unused-command-line-argument；仅加两个 -Wno
      抑制时收敛为 2 个错误（uint + sign-compare，即补丁要修的）；打补丁后
      RC=0。三类根因均实证确认。
    sha256_check: passed
    make_path_smoke: passed
