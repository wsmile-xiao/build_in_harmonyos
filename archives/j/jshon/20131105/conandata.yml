# conandata.yml — jshon 20131105
# 上游官方 GitHub 标签归档（keenerd/jshon tag 20131105）。SHA-256 已三方交叉核验：
# 与 Homebrew formula（jshon.rb resource）及 FreeBSD distinfo（jshon-20131105）一致。
# URL 以 .tar.gz 结尾，Conan 选用 gzip 解压器（规避无扩展名 codeload URL 的
# BadZipFile 误选，见知识条目 E392）。

sources:
  url: "https://github.com/keenerd/jshon/archive/refs/tags/20131105.tar.gz"
  sha256: "28420f6f02c6b762732898692cc0b0795cfe1a59fbfb24e67b80f332cf6d4fa2"

patches:
  - patch_file: "patches/0001-include-sys-types.patch"
    patch_description: >-
      jshon.c 使用 BSD 遗留类型 uint（mapping 结构的数组迭代器）但从未包含
      <sys/types.h>。OHOS musl 的 sys/stat.h 改用 bits/alltypes.h（不再传递包含
      sys/types.h），包含链到达不了 uint 的 typedef（其守卫在 sys/types.h 的
      _GNU_SOURCE/_BSD_SOURCE 分支内），upstream -Werror 下报 unknown type name
      'uint'（207 行），并连带 sign-compare（260 行，uint 回退 int 后与 size_t
      比较符号不一致）。补丁在 #define _GNU_SOURCE（第 1 行，jshon.c 自带）之后
      补上 <sys/types.h>，两处错误同时消除。与 Alpine aports 的
      missing-typesh.patch 同根因同修法（musl 系缺 sys/types.h 包含）；但插入
      位置必须在 _GNU_SOURCE 之后——已实证置于文件首行（Alpine 的位置）时
      -std=c99 的 __STRICT_ANSI__ 下 _BSD_SOURCE 不生效，uint 依旧缺失。
    patch_type: "portability"
