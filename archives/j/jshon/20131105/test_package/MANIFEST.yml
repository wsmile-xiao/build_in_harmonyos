# test_package/MANIFEST.yml
# 上游官方测试声明文件
# jshon 20131105 上游**无任何测试**：源码归档（仅 LICENSE/Makefile/PKGBUILD/
# jshon.1/jshon.c/jshon.spec 共 6 个文件）中不存在 tests/ 目录；Makefile 只有
# all/strip/clean/install/dist 目标（无 test/check）；PKGBUILD 无 check() 函数；
# jshon.spec 无 %check 段；上游 git master（2014-08 最后提交）同样没有测试。
# 故上游可运行测试数 = 0，本 test_package 采用消费者视角的确定性断言验证
# 已安装二进制。

package: jshon/20131105
homepage: "https://github.com/keenerd/jshon"

# 上游测试命令探测结果
upstream_check_command: "make check (无此目标；Makefile 仅含 all/strip/clean/install/dist)"

# conanfile.py build() 中未集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试源文件
upstream_tests: []

# test_package 自带测试（消费者视角，调用已安装二进制）
test_package_tests:
  - file: test.sh
    description: >-
      消费者测试 — 调用已安装 jshon 二进制：object key 读取（类型/嵌套提取/
      长度/插入序 keys）、array 读取（下标/长度/-a 迭代）、string/number/bool/
      null 全类型（类型与值、转义还原）、JSON 创建与修改（-s/-n/-i 插入、
      覆盖、-d 删除、数组下标插入）、invalid JSON/顶层标量/空输入非零退出、
      --version，以及 ELF 专项（ELF64/AArch64/PIE/musl 解释器/无 RPATH/
      NEEDED libjansson.so）。全部期望值经真实二进制经验核验。
    command: "bash test.sh"

# test_package 断言总数（见 test.sh：24 项功能 + 7 项 ELF）
assertion_count: 31
