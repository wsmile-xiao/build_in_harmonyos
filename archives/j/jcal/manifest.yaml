software: jcal
display: "jcal"
description: "Jalali (Persian) calendar library and terminal tools (jcal, jdate)"
category: system
homepage: "https://nongnu.org/jcal"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "源码包不含 configure 脚本，需 autoreconf 生成"
    - "configure.in 需添加 AC_CONFIG_AUX_DIR([.]) 修复 libtoolize 辅助文件路径"
    - "源码包无顶级目录，conanfile.py 需 strip_root=False"
    - "终端工具静态链接 (R26): --disable-shared --enable-static + LDFLAGS=-static"
  common_dependencies: []

versions:
  "0.4.1":
    status: published
    build_date: "2026-06-26"
    conan_ref: "jcal/0.4.1"