software: jcal
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.4.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.gnu.org/releases/jcal/jcal-0.4.1.tar.gz"

  # 源码校验和
  sha256: "e8983ecad029b1007edc98458ad13cd9aa263d4d1cf44a97e0a69ff778900caa"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "LDFLAGS=-static"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.in.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "源码包不含 configure 脚本，需 autoreconf 生成"
  - "configure.in 需添加 AC_CONFIG_AUX_DIR([.]) 避免 libtoolize 辅助文件放置错误"
  - "源码包无顶层目录，conanfile.py 需 strip_root=False"
  - "终端工具静态链接: --disable-shared --enable-static + LDFLAGS=-static"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/jcal-0.4.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/jcal-0.4.1.work
  source_orig_hash: 2468edd5a7adba54
  source_work_hash: 88cb7bbc271c8832
  generated_at: '2026-06-29T16:00:37'
  patches_count: 1

patch_classification:
  - file: 0001-configure.in.patch
    type: auto
    platform_only: True
    guard: 'pending'
