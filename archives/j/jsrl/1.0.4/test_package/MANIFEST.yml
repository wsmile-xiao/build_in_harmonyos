# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md 与 references/iron-rules.md R51（上游测试三步法）

package: jsrl/1.0.4
homepage: "https://github.com/adobe/jsrl"

# ── 上游测试入口 ─────────────────────────────────────────────────────────
# 上游 tarball 自带 CMakeLists.txt：JSRL_BUILD_TESTS=ON（上游默认值）时
# `enable_testing()` + add_subdirectory(tests) → tests/CMakeLists.txt 注册
# **4 个 gtest 可执行**（jsrl_general_number_test / jsrl_mod_test / jsrl_test /
# jsrlpp_test）；第 5 个 jsrl_format_test 只在 CMAKE_CXX_STANDARD>=20 时注册
# （tests/CMakeLists.txt:46），上游 CI 不传该变量 ⇒ 上游 CI 同样只跑 4 个。
# 上游无 make check，CMake 项目的等价入口是 ctest。
upstream_check_command: "ctest --test-dir <build-dir> --output-on-failure -V"

# conanfile.py build() 中已集成上游测试（docs/TEST_QUALITY_SPEC.md §3.1 层 1 必做）
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure -V   # 配方 build() 内 configure + build + 四重反假绿断言（CTestTestfile 注册数==4、jsrl_format_test 不存在、--gtest_list_tests 合计==112、`100% tests passed, 0 tests failed out of 4` + `[PASSED]` 求和==112）；沙箱 HOME = <build>/test-home"

# 上游实际运行的测试（4 个 CTest 注册项 = gtest 112 个已注册用例）
upstream_tests:
  - file: jsrl_general_number_test
    source: tests/jsrl_general_number_test.cpp
    description: "gtest 套件：GeneralNumber 数字解析/往返，5 个 TEST 用例"
    command: "./tests/jsrl_general_number_test --gtest_list_tests   # 5"
  - file: jsrl_mod_test
    source: tests/jsrl_mod_test.cpp
    description: "gtest 套件：json 模块语义，43 个 TEST 用例"
    command: "./tests/jsrl_mod_test --gtest_list_tests   # 43"
  - file: jsrl_test
    source: tests/jsrl_test.cpp
    description: "gtest 主套件：解析/编码/异常/UTF-8，53 个 TEST 用例"
    command: "./tests/jsrl_test --gtest_list_tests   # 53"
  - file: jsrlpp_test
    source: tests/jsrlpp_test.cpp
    description: "gtest 套件：jsrlpp 流式接口，11 个 TEST 用例"
    command: "./tests/jsrlpp_test --gtest_list_tests   # 11"
  - file: CTestTestfile.cmake
    source: tests/CMakeLists.txt
    description: "ctest 注册面（**程序口径，不作 N**）：`ctest -N` 只有 4 个注册项；jsrl_format_test 受 tests/CMakeLists.txt:46 的 C++20 门控制不注册"
    command: "ctest --test-dir <build-dir> -N   # Total Tests: 4"

# ── test_package 中自带的测试（消费者视角验证，PR 正文「鸿蒙特有测试」行）──
test_package_tests:
  - file: test_jsrl.cpp
    description: "jsrl 消费者测试：经 CMakeDeps 的 jsrl::jsrl 链接**打包后的库与头文件**，真实调用解析/编码 API —— 9 条断言（对象三类取值 / 整数精取 / UTF-8 非 ASCII 值往返「鸿蒙PC」/ 数组 size / 对象遍历取键 / 紧凑编码往返幂等 / 29 位小数与 2^53+1 高保真数字往返 / 类型误用抛 Json::TypeError / pretty_print 多行缩进）；OHOS aarch64 + libc++ + C++17 实编译实运行，不计入上游分母"
    command: "./test_jsrl   # 末行 JSRL-CONSUMER checks=9 failures=0"

# ── N 的取数命令（R51 候选数法：同一单位取最大值，差额逐项归因）──────────
#   1) 源码宏数（**N 口径·候选最大值**）:
#        grep -hoE '^\s*(TEST|TEST_F|TEST_P)\s*\(' <source>/tests/*.cpp | wc -l
#        → 148   （jsrl_test 53 + jsrl_mod_test 43 + jsrl_format_test 36
#                  + jsrlpp_test 11 + jsrl_general_number_test 5；
#                  上游当前 HEAD ce9cec7 同值 148，声明 N 的下界满足）
#   2) 框架注册数: ./tests/<bin> --gtest_list_tests | 缩进行计数，4 个二进制求和
#        → 112   （5 + 43 + 53 + 11；与 build() 内硬断言同值 = 本次实跑 N′）
#   3) CTest 注册数（程序口径，不作 N）: ctest --test-dir <build> -N → Total Tests: 4
#   4) 断言数（assertion 单位，单列不作 N）:
#        grep -hoE '\b(EXPECT|ASSERT)_[A-Z_]+' <source>/tests/*.cpp | wc -l
#        → 950   （EXPECT_EQ 285 / EXPECT_PRED 240 / EXPECT_THROW 188 / EXPECT_NE 51 /
#                  EXPECT_TRUE 43 / EXPECT_DOUBLE_EQ 43 / EXPECT_FALSE 37 / ASSERT_PRED 30 /
#                  EXPECT_NO_THROW 10 / ASSERT_EQ 9 / ASSERT_TRUE 6 / EXPECT_LT 3 /
#                  ASSERT_NO_THROW 2 / ASSERT_FALSE 2 / EXPECT_GT 1）
#   5) 消费者断言数（鸿蒙特有，分栏不进上游分母）: ./test_jsrl → JSRL-CONSUMER checks=9 → 9
#
# N = max(148, 112) = **148**（1)/2) 同为「测试用例数」单位；3) 是「测试程序数」、
# 4)/5) 单位不同，按「四口径不混用」单列）。
# N′ = 112（2) 口径下本平台实际注册并全量运行的用例，ctest 未带 --run_test 过滤），
#      TOTAL = PASS 112 + FAIL 0 + SKIP 0 + NOT_RUN 36 = 148 = N，
#      通过率 112/148（75.68%）（分母=源码宏数 N；分栏：框架口径 112/112 全过、
#      CTest 程序口径 4/4 全过）
#
# 差额归因（严格合计，148 → 112 = −36）:
#   tests/CMakeLists.txt:46 `if(CMAKE_CXX_STANDARD GREATER_EQUAL 20)` 才
#   `add_jsrl_test(jsrl_format_test)`；上游 .github/workflows/ci.yml 不传
#   CMAKE_CXX_STANDARD，根 CMakeLists 走 `if(NOT DEFINED …) set(CMAKE_CXX_STANDARD 17)`
#   ⇒ **上游自己的 CI 也不编译 jsrl_format_test（36 例）**，本包与上游 CI 同口径。
#   在 OHOS 上即使抬到 C++20 也编不过（三步实测，见 notes.md 问题 2 与 conanfile docstring）：
#     ① libc++15 `<format>` 被平台配置禁用（__config:255 _LIBCPP_HAS_NO_INCOMPLETE_FORMAT）；
#     ② 强开 -D_LIBCPP_ENABLE_EXPERIMENTAL → 链接失败（OHOS libc++.so 无 format_error 的
#        typeinfo/dtor/vtable）；
#     ③ 自补析构后编译失败 17 处（libc++ __formattable 形参按值取 T，而
#        jsrl::Json::Error 是抽象类，jsrl.hpp:900 纯虚析构）。
#   ⇒ 属 §3.5「OHOS 缺特性」，36 例按 NOT_RUN 申报，不写 PASS、不删测试、不改上游测试。
assertion_count: 9   # = test_package/test_jsrl.cpp 消费者断言数（末行 JSRL-CONSUMER checks=9）
