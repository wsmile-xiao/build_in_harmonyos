# 版本级 manifest
# 文件位置: archives/j/jsrl/1.0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.4"

# 软件名
software: "jsrl"

# 编译状态
# published | built | failed | archived
# （O5：合并并确认 release upload 之前一律 built，不得写 published）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: "cmake"

# Conan 引用
conan_ref: "jsrl/1.0.4"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档，R39）
  url: "https://github.com/adobe/jsrl/archive/refs/tags/1.0.4.tar.gz"

  # 源码校验和（三路取证，2026-09-28 设备实测下载值 == task-scout 归档副本 == CCI 记录值）
  sha256: "6d530713ba00f8c762f55393c96c14a0d6eb9b6f8744aa87125e63af88ff1885"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

  # tag 与 tag 提交（git ls-remote --tags 实证，5 个 tag 全量命中；**tag 无 v 前缀**）
  tag: "1.0.4"
  tag_commit: "2868f64f0f66b993a161bd91b2cb747933c0b54a"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py generate() 的 cache_variables 一致）
  # JSRL_BUILD_TESTS=ON：上游默认值，显式钉住 ⇒ 层 1 上游测试在 build() 内实跑
  # JSRL_INSTALL=ON：上游默认值
  # BUILD_SHARED_LIBS=OFF：默认静态（options.shared 默认值）
  configure_options:
    - "-DJSRL_BUILD_TESTS=ON"
    - "-DJSRL_INSTALL=ON"
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  # W0-2 实核：上游 CMakeLists 除 tests/ 的 find_package(GTest) 外无任何依赖，
  # 库本体 0 依赖，与任务卡「0 依赖」一致
  dependencies: []

  # 上游测试依赖（test_requires；不进包依赖链、不传播给消费者）
  test_dependencies:
    - "gtest/1.17.0"

  # 编译器
  cc: clang
  cxx: clang++

# 供 finish 内嵌 G0 clean-verify 的 cmake configure 直接取用（该闸按本键解析）
build_options: "-DJSRL_BUILD_TESTS=ON -DJSRL_INSTALL=ON -DBUILD_SHARED_LIBS=OFF"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本轮零补丁：W0-3 四组 grep 全零命中，源码无需平台改动，见 notes.md）
patches_applied: []

# ============================================================
# 测试台账（R51 候选数法；取数命令见 test_package/MANIFEST.yml）
# ============================================================

test_results:
  framework: gtest+ctest
  # N = 源码宏数（候选最大值；上游当前 HEAD ce9cec7 同值 148，下界满足）
  upstream_n: 148
  # N' = 框架注册数 = 本次实跑（ctest -N → 4 个注册项）
  upstream_registered: 112
  upstream_not_run: 36
  upstream_pass: 112
  upstream_fail: 0
  upstream_skip: 0
  upstream_assertion_count: 950
  upstream_pass_rate: "112/148（75.68%）"
  not_run_reason: "jsrl_format_test（tests/CMakeLists.txt:46 的 C++20 门控；上游 CI 同口径不编译）且 OHOS clang15/libc++15 无可用 std::format（__config:255 禁用 + 强开后缺 format_error 符号 + __formattable 拒收抽象类 Json::Error），详见 notes.md 问题 2"
  consumer_assertions: 9
  consumer_pass: 9

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（human 索引；知识草稿按官方机制由 engine 未命中才产生）
knowledge_gained:
  - "上游 tests/CMakeLists.txt 的 find_package(GTest) 必须拿到 GTest::gtest/GTest::gtest_main 目标名：conan gtest 自身导出的是小写 gtest::gtest，走 gtest 包自带的 lib/cmake/GTest/GTestConfig.cmake（CMakeDeps cmake_find_mode=none + tc GTest_DIR 指向包目录）即可零补丁对齐，避免与 CMake 自带 FindGTest 与 CMakeDeps 小写 config 三方竞争"
  - "jsrl 的 jsrl_format_test 受上游 C++20 门（tests/CMakeLists.txt:46）控制，上游 CI 不传 CMAKE_CXX_STANDARD 故同样不编译；OHOS clang15/libc++15 侧三步实测也编不过：<format> 被 __config:255 的 _LIBCPP_HAS_NO_INCOMPLETE_FORMAT 整体禁用、强开 -D_LIBCPP_ENABLE_EXPERIMENTAL 后链接缺 std::format_error 的 typeinfo/析构（OHOS libc++.so 未编入 format）、补上析构后 __formattable 概念因 jsrl::Json::Error 是抽象类而编译失败 17 处 ⇒ 36 例按 NOT_RUN 申报"
  - "jsrl 默认解析路径即逐字保真：29 位小数 1234567890.1234567890123456789 与双精度不可表示的 9007199254740993（2^53+1）往返原样；末尾无意义的 0 会被去掉（数值不损），use_GN_for_floats 只改记法为科学计数不改值 —— 消费者断言要用无尾零的字面量才稳定"
  - "jsrl 的 pretty_print 在 jsrlpp.hpp 而不在 jsrl.hpp（jsrl.hpp 不 include 它），消费者要同时 include <jsrl/jsrl.hpp> 与 <jsrl/jsrlpp.hpp>"
