# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: json-schema-validator/2.1.0
homepage: "https://github.com/pboettch/json-schema-validator"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/uri.cpp
    source: json-schema-validator-2.1.0/test/uri.cpp
    description: "URI 解析/拼接单元测试"
    command: "./uri"
  - file: test/errors.cpp
    source: json-schema-validator-2.1.0/test/errors.cpp
    description: "错误处理测试"
    command: "./errors"
  - file: test/issue-70.cpp
    source: json-schema-validator-2.1.0/test/issue-70.cpp
    description: "issue-70 回归测试"
    command: "./issue-70"
  - file: test/issue-25-default-values.cpp
    source: json-schema-validator-2.1.0/test/issue-25-default-values.cpp
    description: "默认值填充回归测试"
    command: "./issue-25-default-values"
  - file: test/issue-98.cpp
    source: json-schema-validator-2.1.0/test/issue-98.cpp
    description: "issue-98 未知关键字异常回归测试"
    command: "./issue-98"
  - file: test/string-format-check-test.cpp
    source: json-schema-validator-2.1.0/test/string-format-check-test.cpp
    description: "string format 检查单元测试"
    command: "./string-format-check-test"
  - file: test/json-patch.cpp
    source: json-schema-validator-2.1.0/test/json-patch.cpp
    description: "JSON Patch 单元测试"
    command: "./json-patch"
  - file: test/JSON-Schema-Test-Suite/json-schema-test.cpp
    source: json-schema-validator-2.1.0/test/JSON-Schema-Test-Suite/json-schema-test.cpp
    description: "JSON-Schema-Test-Suite draft7 套件驱动（36 个套件文件）"
    command: "./json-schema-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_json_schema_validator.cpp
    description: "消费者测试: set_root_schema + validate，合法实例通过/非法实例拒绝"
    command: "./test_json_schema_validator"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 36