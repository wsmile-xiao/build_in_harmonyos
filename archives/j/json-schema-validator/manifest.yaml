software: json-schema-validator
display: "json-schema-validator"
description: "JSON Schema validator for JSON for Modern C++ (nlohmann/json), draft-7 support"
category: data
homepage: "https://github.com/pboettch/json-schema-validator"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游自带 Conan 1.x 配方（from conans），需转 Conan 2.x"
    - "依赖 nlohmann_json（header-only）；上游配方锁定 3.7.3，ohpcd 已发布 3.1.1 / 3.12.0，需在适配阶段实证兼容并选定版本"
  common_dependencies:
    - nlohmann_json

versions:
  "2.1.0":
    status: built
    build_date: "2026-08-30"
