software: japi-compliance-checker
display: "JAPICC (Java API Compliance Checker)"
description: "Java 库 API 向后二进制/源码级兼容性检查工具（纯 Perl + JDK javap）"
category: development-tool
homepage: "https://github.com/lvc/japi-compliance-checker"
license: LGPL-2.1-or-later
build_system: perl

ohos_adaptation:
  key_points:
    - "Perl shebang /usr/bin/perl -> /usr/bin/env perl"
    - "Makefile.pl 在 Perl 5.42+ 有兼容问题，build() 执行等效安装（同 abi-compliance-checker 2.3）"
    - "bin/ wrapper 解析自身路径调用 share/ 真实脚本，保证 \$0 与 modules 定位"
    - "上游回归套件 -test 在 build() 内运行（BiSheng JDK 17，实测 SUCCESS/164 breaks）"
  common_dependencies:
    - perl
    - jdk

versions:
  "2.4":
    status: published
    build_date: "2026-10-06"
