# test_package/MANIFEST.yml — japi-compliance-checker 2.4
# R34/R51: test_package must exercise the packaged binary.

package: japi-compliance-checker/2.4
homepage: "https://github.com/lvc/japi-compliance-checker"

# R51 上游测试三步法:
# 1. 清点: 上游无独立 tests/ 目录——回归套件内嵌于 modules/Internals/RegTests.pm
#    (testTool: 现场生成 libsample_java v1/v2 源码, javac 编译 + jar 打包,
#    30 个 Test_*.java 运行时用例, 再以断言"检出 API break 数 >= 100"收尾;
#    README 声明 "about 100 basic tests").
# 2. 实测: build() 内以 BiSheng JDK 17 + Perl 运行 `japi-compliance-checker -test`,
#    真机输出 "Test result: SUCCESS (164 breaks found)", 退出码 0
#    (30 个运行时用例中 16 个干净通过、14 个为设计内的不兼容触发用例,
#    属套件预期行为, 最终判定以 >=100 breaks 断言为准).
# 3. 结论: 上游测试 = 1 套内嵌回归套件 (-test), 实测通过.

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "japi-compliance-checker -test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "japi-compliance-checker -test (build() 内, BiSheng JDK 17)"

# 上游实际运行的测试程序 (内嵌回归套件, 30 个运行时用例 + >=100 breaks 断言)
upstream_tests:
  - name: "JAPICC internal regression suite (-test)"
    type: "internal (modules/Internals/RegTests.pm)"
    cases: 30
    verdict: "Test result: SUCCESS (164 breaks found) — device-verified with BiSheng JDK 17.0.13 + Perl 5.44.0"

# test_package 中自带的测试 (消费者视角验证, 8 条断言)
test_package_tests:
  - file: test.sh
    description: >-
      A1 --version 报告 JAPICC 2.4; A2 JDK 工具链可达 (javac/jar/java/javap);
      A3 现场编译打包 v1/v2 测试 jar (v2 删除公有方法 removeMe 并新增 NewApi);
      A4 jar 对比完成且生成 HTML 报告 compat_reports/v/1_to_2/;
      A5 控制台摘要 "Binary compatibility:" <100%、二进制问题数=1 且符合上游
      退出码契约 (检出 break 时 rc=1, 兼容时 rc=0);
      A6 报告 HTML 包含被删方法名 removeMe; A7 负向对照 v1-vs-v1 100% 兼容
      0 问题; A8 -dump 生成含 API_DUMP_VERSION 2.4 的 API dump
    command: "bash test.sh"

# 测试断言总数 (8: CLI 契约 1 + 工具链 1 + 构建 1 + 功能对比 3 + 负向对照 1 + dump 1)
assertion_count: 8
