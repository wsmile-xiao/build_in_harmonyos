package: json.h/3.15
homepage: "https://github.com/sheredom/json.h"
upstream_check_command: "ctest --test-dir . --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir . --output-on-failure"

# ── 上游测试全量枚举台账 ─────────────────────────────────────────
# 测试源: test/test_shared.h（用户用例统一声明，按 9 个语言标准分支实例化）
#   - JSON_TEST(...)         157 项独立用户用例（33 个功能 suite）
#   - JSON_TEST_F(...)       28 项 fixture 用例（14 个 allow_* 特性 fixture × 2）
#   - 合计                    185 项独立上游用户用例
# 实例化: test/*.c/*.cpp 共 9 个翻译单元（c/c11/c99/cpp/cpp98/cpp11/cpp14/cpp17/cpp20），
#   每单元以不同 JSON_SUITE 编译同一份 test_shared.h → 185 × 9 = 1665 注册用例
# 构建目标: json_test（主二进制，含全部 9 单元）
#   另按工具链可用性注册 sanitizer 变体：json_address_test / json_undefined_test /
#   json_thread_test；json_memory_test 仅 MSVC 分支、上游 memory sanitizer
#   探测 compile=FALSE 未注册（README snippet 生成测试计入 157 中 generated/JSONTestSuiteTests）
# 运行结果（OHOS aarch64 / clang 15）:
#   json_test 实际执行并全部通过 1665/1665（100%）
# 双口径统计:
#   source_declared_total       = 185（test_shared.h 中独立用户用例声明数）
#   configured_executable_total = 1665（9 标准分支实例化后注册用例数，json_test）
#   executed_passed_total       = 1665（全部通过）
#   executed_failed_total       = 0
#   uninstantiated / skipped    = 0（memory sanitizer 变体按上游探测规则未注册，
#                                  非用户用例，不计入声明分母）
upstream_tests:
  - file: test/test_shared.h
    source: json.h-671f1a382b/test/test_shared.h
    description: "用户用例统一声明（JSON_TEST ×157 + JSON_TEST_F ×28），按 9 标准分支实例化；含 cJSON 兼容、JSON5 特性 allow_*、write_pretty/write_minified、number/object/array/string、allocator、extract、random 等 suite"
    command: "./json_test"
    static_cases: 185
    executed_cases: 185
    passed_cases: 185
    failed_cases: 0
    skipped_cases: 0
    note: "185 项独立声明 × 9 标准分支 = 1665 注册用例，json_test 实际运行 1665/1665 通过（100%）；上游 sanitizer 变体 json_address/json_undefined/json_thread 各运行同一套用例亦全过"
  - file: test/utest.h
    source: json.h-671f1a382b/test/utest.h
    description: "UTest 测试框架头（宏注入，非独立用户用例，不计入声明分母）"
    command: ""
    static_cases: 0
    executed_cases: 0
    passed_cases: 0
    failed_cases: 0
    skipped_cases: 0
  - file: test/main.c
    source: json.h-671f1a382b/test/main.c
    description: "UTEST_MAIN 入口（仅注册宏，非独立用户用例）"
    command: ""
    static_cases: 0
    executed_cases: 0
    passed_cases: 0
    failed_cases: 0
    skipped_cases: 0
  - file: test/CMakeLists.txt
    source: json.h-671f1a382b/test/CMakeLists.txt
    description: "上游测试构建定义：从 README 提取 ```c 片段生成 generated.h 供 generated/JSONTestSuiteTests 用例编译（已计入 157）"
    command: "ctest --test-dir . --output-on-failure"
    static_cases: 0
    executed_cases: 0
