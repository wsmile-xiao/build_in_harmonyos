# 版本级 manifest — jameica-h2database 1.4.199
version: "1.4.199"
software: "jameica-h2database"
status: built
build_date: "2026-10-09"
build_system: javac

source:
  url: "https://deb.debian.org/debian/pool/main/j/jameica-h2database/jameica-h2database_1.4.199.orig.tar.xz"
  sha256: "681d425b422e14f7e2db26188d19ab90eb0226f96c254bc4b0e118b9c149eb5b"
  note: >-
    Debian pool 的 orig tarball（2395812 B，顶层目录 `h2database-1.4.199/`）= H2 数据库引擎
    的上游发布树。**如实披露**：该树自己的 pom.xml 版本写作 `1.4.200-SNAPSHOT`
    （H2 惯例：发布后立刻把 pom 顶到下一个 SNAPSHOT），故本包按 Debian 源包版本号
    以 **h2-1.4.199.jar** 命名交付。

build:
  system: javac
  dependencies: []          # 无 Conan requires；H2 核心 **零运行期依赖**
  compile_time_jars:        # 仅用于编译，**不进产物**（H2 主源码含可选集成类）
    - "javax.servlet-api 3.1.0（sha256 af456b2d…）—— org/h2/server/web/WebServlet.java"
    - "org.osgi.core 4.2.0（sha256 f61afff1…）+ org.osgi.enterprise 4.2.0（sha256 c05df7ec…）"
    - "  —— org/h2/util/{DbDriverActivator,OsgiDataSourceFactory}.java；**版本必须与上游 pom 的 <osgi.version>4.2.0 对齐**"
    - "jts-core 1.15.0（00102cde…）—— org/h2/util/geometry/JTSUtils.java"
    - "lucene-core / lucene-analyzers-common / lucene-queryparser 5.5.5（8d27a8ab…/f5fd2a9a…/89ed31a7…）—— org/h2/fulltext/FullTextLucene.java"
    - "slf4j-api 1.7.25（18c4a009…）—— org/h2/message/TraceWriterAdapter.java"
  build_steps:
    - "javac 编译 src/main 全量 615 个 .java（classpath = 上述编译期 jar）"
    - "src/main 下所有非 .java 资源（_messages_*.prop 等）按相对路径并入 classes/"
    - "jar 打包 → h2-1.4.199.jar"
  artifacts:
    - "libexec/h2-1.4.199.jar  2301238 B  sha256 0e903b529c550181…（本地实测）"

patches_applied: []          # 无需任何补丁

upstream_tests:
  framework: "H2 自研测试框架（每个用例自带 main()，退出码即判定；非 JUnit）"
  test_sources: 67
  test_command: "javac -cp <classes+编译期 jar> -sourcepath src/test:src/tools -d test-classes <TestBase + 选中用例> && java -cp … org.h2.test.unit.<Name>"
  run_in_build: false
  evidence: >-
    src/test/org/h2/test/unit/ 共 **67** 个用例类。配方按「只放行 org.h2.* 与 JDK 自带」的
    import 口径筛出可离线编译的用例，并做**传递闭包排除**（引用到被排除用例的也排除）。
    实测仍有测试树用例引用上游 **test-only 依赖**（`org.objectweb.asm` ASM、ext/ 驱动等，
    本适配刻意不引入）→ 测试树编译未通过，配方按**具名工具链边界**如实记录并跳过运行
    （日志原文：`[upstream tests] 具名工具链边界：测试树编译未通过…首个错误：
    TestKeywords.java:18: error: package org.objectweb.asm does not exist`）。
upstream_test_pass_rate: >-
  **不宣称任何通过率**——上游用例未在 build 内真跑（具名工具链边界：需 ASM/ext 驱动等
  test-only 依赖）。本项目**不使用 Maven**，不引入上游 pom 的测试期依赖，故不做数字声明。

adapted_test_pass_rate: >-
  **test_package/check_h2.py 4 项全通过（`checks=4 fails=0 skips=0` / `RESULT: PASS`）**：
  ①产物齐备（h2-1.4.199.jar 2301238 B）②jar 为合法 zip，关键类（org/h2/Driver、engine/Engine、
  command/Command）与资源（org/h2/res/_messages_en.prop、META-INF/MANIFEST.MF）齐备
  ③**端到端真跑**：javac + java，仅用 JDK 自带 `java.sql` 驱动内存库（`jdbc:h2:mem:`）
  建表 → 插入 → 查询 → 读回 `atom`（`H2_E2E=atom`），不需任何第三方 jar
  ④证据（jar 大小与 sha256、所用 JDK）。仅具名环境信号（宿主无 JDK）可 SKIP，本轮无 SKIP。

knowledge_gained:
  - "**「零运行期依赖」不等于「零编译期依赖」**：H2 核心 jar 运行期零依赖（java.sql 即可用），但 src/main 里含可选集成类（servlet web 控制台 / OSGi DataSourceFactory / JTS 几何 / Lucene 全文检索 / slf4j 适配）→ 编译它们需要对应 API。判据：先看上游 pom 里哪些依赖**只服务测试**、再看 src/main 的 import；结论是**照上游发布 jar 的编译口径**把编译期依赖补齐、但不进产物（上游 build.sh/pom 正是这么做的）"
  - "**编译期依赖的版本必须与上游 pom 对齐**：OSGi 用 6.0.0 时 `registerService(String,…)` 签名不匹配 → `no suitable method found`；换回 pom 声明的 4.2.0 即可（同一份 API 在不同版本里签名会变）"
  - "**测试树的第三方依赖会传染**：某个用例 import `org.objectweb.asm` 时，javac 会顺着 `-sourcepath` 把被引用者隐式编译进来，导致整批编译失败（表现为与自身 import 无关的错误）→ 处置：按「只放行本仓/ JDK」的严格口径筛选 + **传递闭包排除**；仍失败则按具名工具链边界如实披露，不冒充通过"
  - "**Conan `download()` 在本环境对 Maven 大文件反复 ReadTimeout（curl 同一 URL 正常）**→ 改用 `curl -fsSL --retry` 抓取并**自算 sha256 校验**，并支持可选的本地预置目录（sha256 一致才采用），既保证可复现也不放过校验失败"
