# 构建：**不使用 Maven**，直接用 JDK 的 javac + H2 自带的构建工具
#   src/tools/org/h2/build/Build.java（纯 Java、离线、无第三方依赖）
# 原因：H2 的 pom.xml 声明了 javax.servlet-api / lucene 5.5.5 / jts / postgresql / osgi 等
#   依赖，但它们只服务 H2 自带的那些**测试套件**（servlet/lucene/jts/pg），
#   核心 H2 jar 本身**零运行期依赖**；走 Maven 会把这些拉成"必需依赖"，与事实不符。
#   走 H2 原生 Build 工具即可得到与上游发布一致的 jar（build.sh 也是这么做的）。
