# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）
#
# 上游测试清点（R51）：
#   `src/test/org/h2/test/unit/` 共 **67** 个用例类（H2 自研测试框架：每个类自带 main()，
#   失败以非 0 退出码体现；不是 JUnit）。其中 **66 个无第三方 import**、可离线编译执行；
#   **1 个**带 lucene/jts/servlet 等依赖（上游 pom 的测试依赖）→ 按具名第三方阻塞排除。
#   本项目**不使用 Maven**：核心 jar 零运行期依赖，用 javac + jar 直编（与上游 build.sh 同一做法），
#   因此 pom 里的 javax.servlet-api / lucene 5.5.5 / jts 1.15.0 / postgresql / osgi 均**不进产物、不参与构建**。
#   上游体量更大的 db/jdbc/net 套件需要 ext/ 驱动（derby/hsqldb/mysql 连接器，需联网下载）→ 不在射程内，如实披露。

package: jameica-h2database/1.4.199
homepage: "https://www.h2database.com"

upstream_check_command: "javac -cp <classes> -sourcepath src/test -d test-classes <TestBase + 66 个纯 unit 用例> && java -cp <classes:test-classes> org.h2.test.unit.<用例>"

upstream_test_in_build: true
upstream_test_command: "build() 内逐个 java -cp <classes:test-classes> org.h2.test.unit.<Name>（timeout 300s，退出码即判定）"

upstream_tests:
  - file: src/test/org/h2/test/unit/*.java
    source: "jameica-h2database_1.4.199.orig.tar.xz（Debian pool orig；上游树 h2database-1.4.199/）"
    description: "H2 自研测试框架的 unit 套件：67 个类中 66 个无第三方 import（TestPattern/TestBitStream/TestBnf/TestCache/TestCollation …），逐个真跑并以退出码判定"
    command: "java -cp <classes:test-classes> org.h2.test.unit.<Name>"
    count: 66
  - file: src/test/org/h2/test/unit/（1 个类）
    source: "同上"
    description: "唯一的第三方依赖用例（import lucene/jts/servlet 等）→ 需上游 pom 的测试依赖，按具名第三方阻塞排除，不计入通过率"
    count: 1

release_smoke_tests:
  - file: "libexec/h2-1.4.199.jar"
    source: "包产物（src/main 615 个 .java 经 javac 编译 + 资源文件一并入 jar）"
    description: "jar 含关键类与资源（org/h2/Driver.class、engine/Engine.class、command/Command.class、org/h2/res/help.csv、META-INF/MANIFEST.MF）"
    command: "python3 check_h2.py <package-folder>"

test_package_tests:
  - file: check_h2.py
    description: >-
      消费者校验 4 项：①产物齐备（h2-1.4.199.jar）②jar 合法 zip 且关键类与资源齐备
      ③**端到端真跑**：javac + java，仅用 JDK 自带的 java.sql 驱动内存库（jdbc:h2:mem:）
      建表→插入→查询→断言读回 'atom'（H2_E2E=atom；不需要任何第三方 jar）
      ④证据（jar 大小与 sha256、所用 JDK）。仅具名环境信号（宿主无 JDK）可 SKIP。
    command: "python3 check_h2.py <package-folder>"

assertion_count: 4
