# 版本级 manifest 模板
# 文件位置: archives/j/jeolib-miallib/1.1.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.1.7"
software: "jeolib-miallib"
status: built
build_date: "2026-10-11"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/ec-jrc/jeolib-miallib/archive/refs/tags/v1.1.7.tar.gz"
  sha256: "c1a1a4ac658cef6bf2880b4b0e0755fb1d93c12a1eca748d4f1f9f7f5188c806"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DPROCESS_IN_PARALLEL=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies:
    - zlib/1.3.1.1
    - gdal/3.9.2.3
    - libtiff/4.7.2
    - libgeotiff/1.7.4
    - proj/9.3.1.1
    - fftw/3.3.11
    - gsl/2.7
    - shapelib/1.5.0
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-cmake-find-deps-and-drop-legacy-proj4.patch"
  - "0002-fix-wordsize-for-musl.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS musl 不定义 __WORDSIZE（glibc 专有），用 __LP64__/_LP64/架构宏探测指针宽度"
  - "miallib 上游在 if(PROCESS_IN_PARALLEL) 之外无条件 set(CMAKE_C_FLAGS -fopenmp)，OHOS 设备默认无 libomp 运行时 → 串行构建"
  - "miallib projection.c 使用 PROJ4 遗留 API 且全树无调用方，适配 PROJ>=6 时可直接移除"
  - "上游 CMake 安装列表遗漏主头文件 miallib.h 与生成的 config_miallib.h，消费者会编译失败，需补丁补装"
  - "conan CMakeDeps 生成的变量名为包名小写（如 shapelib_LIBRARIES），不匹配上游大写约定（GSL_LIBRARIES），模块式上游 CMake 需改 find_path/find_library"
