# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jeolib-miallib/1.1.7
homepage: "https://github.com/ec-jrc/jeolib-miallib"

# 上游测试命令: 上游 tarball 未提供测试套件（无 tests/ 目录、无 ctest 注册、
# CMakeLists 无 enable_testing()），故无可运行上游用例。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无 — 上游未提供）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    source: archives/j/jeolib-miallib/1.1.7/test_package/test.c
    description: "消费者 API 实测：create_image(t_UCHAR 8x8) 填充后 histo1d 校验 bin 数与计数总和、t_HST1D 类型；erode4/dilate4 形态学腐蚀膨胀无错返回"
    command: "./test_package"
