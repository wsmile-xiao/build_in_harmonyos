# 软件级 manifest — jam
# 遵循 ARCHIVE-SPEC v2.0

software: jam
display: "jam"
description: "Perforce Jam / Argyll-Jam 构建工具（FT-Jam 2.5.2 + ArgyllCMS V1.3.3 Jambase），ArgyllCMS 的构建工具"
category: build-tool
homepage: "https://www.argyllcms.com/"
license: Perforce Freeware
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Argyll-Jam = FT-Jam 2.5.2 + ArgyllCMS V1.3.3 Jambase，纯 C 单文件构建工具，无外部库依赖"
    - "上游 `make` 自举链（make → jam0 → ./jam0 → 子进程 clang）在 OHOS 沙箱下不可用：新鲜编译的用户态二进制无法派生可用的 clang 子进程调用"
    - "改用「直接链接」路径绕开自举链：先编译 mkjambase 用 Argyll Jambase 重新生成 jambase.c，再把全部 C 源一次链接成单个 jam 可执行文件"
    - "jam 用 `-v` 输出版本（Argyll-Jam 2.5.2）；`--version`/`--help` 不是上游选项，L2 冒烟以 `jam -v` 判定"
    - "包版本记为 ajam-2.5.2-1.3.4（Argyll 官方要求兼容 'Jam 2.5'；JAMBASE 1.3.3）"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "ajam-2.5.2-1.3.4":
    status: published
    build_date: "2026-09-03"
