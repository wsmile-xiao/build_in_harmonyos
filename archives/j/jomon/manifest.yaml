software: jomon
display: "jomon"
description: "jomon — 终端 TCP 连接监视器：ncurses TUI 按连接展示 TCP 状态与流量，支持 tcpdump 语法过滤器与 BPF 反汇编"
category: network
homepage: "https://github.com/jo-lund/jomon"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "自制 configure(bash) + Makefile：能力探测只调裸 $CC，交叉编译下看不到 conan 依赖的头/库路径，需让探测带上 $CFLAGS/$CPPFLAGS/$LDFLAGS"
    - "tarball 无 .git，configure 用 git describe 取版本号会失败 -> 支持 JOMON_VERSION 注入"
    - "conan ncurses 包只提供宽字符库 libncursesw（无 libncurses）-> 探测与链接改用 -lncursesw"
    - "Makefile 链接行原本丢弃 LDFLAGS（缺 -L 依赖库路径）-> LIBS := -lncursesw -lrt $(LDFLAGS)"
    - "OHOS 无 GNU install 命令（上游 make install 用 install -sD）-> 配方用 conan copy 落盘 bin/jomon"
    - "OHOS libc 无 obstack/strlcpy，configure 探测失败后自动编入 compat/ 自带实现"
  common_dependencies:
    - "ncurses/6.6"

versions:
  "0.6.4":
    status: built
    build_date: "2026-10-01"
    format: conan
