version: "0.6.4"
software: "jomon"
status: built
build_date: "2026-10-01"
build_system: "makefile"

source:
  url: "https://github.com/jo-lund/jomon/archive/refs/tags/v0.6.4.tar.gz"
  sha256: "974bcd310cec3496b041bd0233ebec90f6309fa4d36dd184e151e50aad043d09"
  tar_format: tar.gz

build:
  # 上游为自制 configure(bash) + Makefile（非 autoconf），故归类 makefile
  system: makefile
  configure_options:
    - "--disable-geoip"
  dependencies:
    - ncurses/6.6
  tool_requires:
    - re2c/4.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.patch"
  - "0002-configure.patch"
  - "0003-portability.h.patch"

knowledge_gained:
  - "conan 的 ncurses 包只提供宽字符库 libncursesw（无 libncurses），上游 -lncurses 的探测与链接在交叉编译下必然失败"
  - "make 的命令行赋值（make CFLAGS=...）会让 Makefile 内 `CFLAGS += -std=gnu11` 失效；自制 configure/Makefile 工程应改用 AutotoolsToolchain 注入环境变量"
  - "自制 configure 的编译探测必须带上 $CFLAGS/$CPPFLAGS/$LDFLAGS，否则交叉编译时看不到 conan 依赖的头文件与库路径"
  - "tarball 源码包内无 .git 时 `git describe` 取版本号会失败，需支持版本注入"
  - "OHOS 无 GNU install 命令（上游 install 规则用 install -sD），打包改用 conan copy 落盘"
  - "jomon 的 -d/-dd/-ddd 过滤器反汇编路径在接口初始化之前 exit，可作免 root/免网卡的功能性冒烟测试"

