# conandata.yml — jomon 0.6.4
sources:
  url:
    # No distro mirror hosts jomon (Alpine/Debian/FreeBSD distfiles 404) and
    # the proxy hosts are not viable: gh-proxy.com is on the PF7 mirror
    # blacklist and timed out from CI workers, mirror.ghproxy.com is dead.
    # codeload.github.com is GitHub's official direct-download host (skips the
    # www.github.com redirect hop; CI reached it for pd-vbap #67523 the same
    # day these builds timed out), github.com kept as fallback. Both serve the
    # byte-identical tarball pinned by sha256 below.
    - "https://codeload.github.com/jo-lund/jomon/tar.gz/refs/tags/v0.6.4"
    - "https://github.com/jo-lund/jomon/archive/refs/tags/v0.6.4.tar.gz"
  sha256: "974bcd310cec3496b041bd0233ebec90f6309fa4d36dd184e151e50aad043d09"

patches:
  "0.6.4":
    - patch_file: "patches/0001-Makefile.patch"
      patch_description: >-
        Makefile: link the wide-character ncurses (-lncursesw) and honour
        $(LDFLAGS) on the link lines so the packaged dependency search paths
        reach the linker (upstream uses `LIBS :=`, which drops the environment
        value).
      patch_type: "portability"
    - patch_file: "patches/0002-configure.patch"
      patch_description: >-
        configure portability for cross compilation: accept JOMON_VERSION when
        no .git is present (tarballs), pass CFLAGS/CPPFLAGS/LDFLAGS into the
        compiler and library probes, and probe the wide-character ncurses
        (-lncursesw, the only flavour shipped by the conan ncurses package).
      patch_type: "portability"
    - patch_file: "patches/0003-portability.h.patch"
      patch_description: >-
        portability.h: implement the GNU-flavour qsort_r on top of plain qsort
        for non-glibc libcs (OHOS ships musl, which does not export it), so the
        upstream QSORT() call signature keeps working. Single-threaded only,
        which is what jomon is.
      patch_type: "portability"
