# test_package/MANIFEST.yml
# 测试声明文件；CI (build_and_test.sh L0e) 与本仓 PF3 强制要求此文件存在
package: jomon/0.6.4
homepage: https://github.com/jo-lund/jomon

# 上游测试套件：tests/*_test.c（libcheck），见 upstream_test_command。
# 未纳入 build()（测试需要构建机原生的 libcheck，且属消费者/开发期验证），
# 实测结果记录在 reports/ 的验证报告中（R51 三步法）。
upstream_test_in_build: false
upstream_test_command: "make test   # libcheck 单元套件（7 个 register suite 入口）"
upstream_tests:
  - type: unit
    count: 0
    framework: "libcheck"
    description: >-
      tests/ 下 libcheck 单元套件：hashmap / bpf / rbtree / decoder /
      vector / connection / ringbuffer，无网络与 root 依赖
    known_failures: 0

# test_package 自带测试（消费者视角：运行安装后的真实二进制）
test_package_tests:
  - file: test.sh
    description: >-
      执行 <prefix>/bin/jomon：--version 版本注入生效、--help 选项表可打印、
      -ddd -f "tcp or icmp" 离线 BPF 编译与反汇编
    command: "bash test.sh <prefix>/bin/jomon"

assertion_count: 3
