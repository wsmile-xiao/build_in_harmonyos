# 版本级 manifest — jinja2cpp 0.9
# 遵循 ARCHIVE-SPEC v3.0

version: "0.9"
software: jinja2cpp
status: built
build_date: "2026-09-16"
build_system: cmake

source:
  url: "https://github.com/jinja2cpp/Jinja2Cpp/archive/refs/tags/v0.9.tar.gz"
  sha256: "002569a51efe75e4ee10423fd54cf7a70b0d016fee1577cb277ec253a951ef2e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "WITH_TESTS=ON/OFF（默认 OFF；ON 时 JINJA2CPP_USE_CONAN_GTEST=ON）"
    - "CMAKE_CXX_STANDARD=14（库本体）/17（测试，gtest 1.17 要求）"
  dependencies:
    - "boost/1.85.0（仅头文件，上游 target boost::boost；制品仓已发布）"
    - "gtest/1.17.0（仅 with_tests=True 时；上游测试套）"
    - "expected-lite 0.9.0（vendored，source() 按上游 .gitmodules 指针从官方源补齐 tarball 缺失的子模块头，见 conandata.yml expected_lite 条目）"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-cmake-and-iterator-fixes.patch"

knowledge_gained:
  - category: L1
    content: "CMAKE_SYSTEM_NAME=HarmonyOS 时 CMake 的 UNIX 变量为 FALSE（OHOS 未被认作 UNIX），上游用 `if (NOT UNIX)` 判定非 Windows 会误入 MinGW 分支注入 -Wa,-mbig-obj（clang 不支持该汇编器参数全部 TU 编译失败）；正确写法是按 WIN32 判定。"
    reason: "jinja2cpp 0.9 适配实测——CMake 平台变量语义，跨库可复用"
  - category: L1
    content: "上游 tarball 不含 .gitmodules 子模块内容（expected-lite/gtest 均缺）——按 .gitmodules 指针对应版本补齐 vendored 头文件或改用 conan 包（CMakeDeps 目标 gtest::gtest；conan gtest-config 仅声明单组件目标，gtest_main 需包内绝对路径链接且 INTERFACE_INCLUDE_DIRECTORIES 带 $<CONFIG:Release> 生成器表达式需剥离）。"
    reason: "jinja2cpp 0.9 适配实测——GitHub tarball 子模块缺失的标准处理法，跨库可复用"
  - category: L2
    content: "OHOS libc++（clang-15）下 std::min_element/max_element 对 boost::iterator_facade single_pass_traversal_tag 迭代器触发 C++17 ForwardIterator static_assert（上游按旧标准写）；迭代器实质满足 forward 语义时改声明 forward_traversal_tag 即过。"
    reason: "jinja2cpp 0.9 适配实测——libc++ 新版算法约束，同类 boost 迭代器库可复用"

test_report:
  upstream_registered_cases: 78
  upstream_enabled_cases: 70
  upstream_disabled_cases: 8
  executed_cases: 670
  passed_cases: 670
  failed_cases: 0
  excluded_framework_checks: "GoogleTestVerification.UninstantiatedParameterizedTestSuite<LogicalExprTest>（gtest 1.17 对上游 0.9 遗留未实例化 TEST_P 的框架级校验，非库缺陷）"
  test_package: "test_package.cpp 4 组断言全过（模板加载/值替换+过滤器/循环/条件）"
