# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jinja2cpp/0.9
homepage: "https://github.com/jinja2cpp/Jinja2Cpp"

# conanfile.py build() 方法中是否已集成上游测试（with_tests=True 时本地/探索构建执行）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -E 'GoogleTestVerification'（上游 jinja2cpp_tests 目标：78 注册用例/70 启用，gtest 参数化展开 671 项）"

upstream_tests:
  - file: test/basic_tests.cpp
    description: "上游基础模板渲染测试（25 注册用例）"
  - file: test/errors_test.cpp
    description: "上游错误处理测试（3 注册用例，参数化展开）"
  - file: test/expressions_test.cpp
    description: "上游表达式求值测试（8 注册用例，参数化展开）"
  - file: test/extends_test.cpp
    description: "上游模板继承测试（8 注册用例）"
  - file: test/filesystem_handler_test.cpp
    description: "上游文件系统 handler 测试（5 注册用例）"
  - file: test/filters_test.cpp
    description: "上游过滤器测试（31 注册用例，参数化展开）"
  - file: test/forloop_test.cpp
    description: "上游 for 循环测试（14 注册用例）"
  - file: test/if_test.cpp
    description: "上游 if 语句测试（3 注册用例）"
  - file: test/macro_test.cpp
    description: "上游宏测试（9 注册用例）"
  - file: test/set_test.cpp
    description: "上游 set 语句测试（5 注册用例）"
  - file: test/testers_test.cpp
    description: "上游 tester 测试（18 注册用例）"
  - file: test/perf_test.cpp
    description: "上游性能测试（8 注册用例，上游默认 DISABLED_PerfTests 禁用，不计入启用集）"

test_package_tests:
  - file: test_package.cpp
    description: "R34：实际调用被测包 API（Template::Load/RenderAsString/ValuesMap 绑定/过滤器/循环/条件），4 组断言，非空壳测试"
    command: "cmake build + run"

assertion_count: 4
