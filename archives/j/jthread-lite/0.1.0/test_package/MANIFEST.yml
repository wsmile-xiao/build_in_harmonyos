# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jthread-lite/0.1.0
homepage: "https://github.com/martinmoene/jthread-lite"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -DJTHREAD_LITE_OPT_BUILD_TESTS=ON .. && make && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (21 个 lest 独立用例，见 reports/upstream-test-ledger.md)
upstream_tests:
  - file: test/jthread.t.cpp
    source: jthread-lite-0.1.0/test/jthread.t.cpp
    description: "jthread 核心行为用户用例（15 个 lest CASE：构造/回调/join/detach/swap/tweak）"
    command: "./jthread-lite-cpp17.t --pass @"
  - file: test/jthread-main.t.cpp
    source: jthread-lite-0.1.0/test/jthread-main.t.cpp
    description: "jthread-lite 版本/配置/编译环境信息用例（6 个 lest CASE，隐藏 tag）"
    command: "./jthread-lite-cpp17.t --pass @"

# test_package 中自带的测试 (消费者视角验证：真实链接 include 并断言 jthread 线程语义)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：nonstd::jthread 自动 join/显式 join/swap/hardware_concurrency 断言"
    command: "./test_jthread_lite"

# 测试断言总数 (近似值, 用于质量评估：上游 21 用例 + 专项 10 断言 + 消费者 4 断言)
assertion_count: 35