knowledge_gained:
  - category: L1
    content: "OHOS aarch64 下 C++ 头文件库的 CPU 指令集宏必须按 NEON 配置：jsonifier 上游提交值为 38(x86 AVX/LZCNT/BMI)，aarch64 直接走 immintrin.h 报 'This header is only meant to be used on x86 and x64 architecture'；改 8(NEON) 后正常。另 Config.hpp 的 PREFETCH 在 clang 分支无条件包含 xmmintrin.h，aarch64 需 __builtin_prefetch 分支。"
    reason: "jsonifier 0.9.97 适配实测——aarch64 平台特性，跨库可复用"
  - category: L1
    content: "OHOS libc++（libcxx-ohos，clang-15 SDK）缺失标准 <memory_resource> 与 <source_location>；头文件库需 __has_include 守卫或提供 API 等价 shim（file_name/function_name/line/column 全 API），否则编译中断。"
    reason: "jsonifier 0.9.97 适配实测——OHOS 工具链头缺失，跨库可复用"
  - category: L1
    content: "aarch64（OHOS 默认 unsigned char）下 char_traits 类模板的部分特化歧义：上游 uint8_type 概念对纯 char 成立（sizeof==1 && unsigned_integral），与 not_uint8_t 特化重叠；需在 uint8_type 特化上追加 requires (!std::same_as<unwrap_t<T>, char>)。"
    reason: "jsonifier 0.9.97 适配实测——aarch64 char 符号性差异，跨库可复用"
  - category: L1
    content: "clang-15 对别名模板内依赖类型名支持不足（P0634 未完整实现）：`template<size_t N> using T = map_simd<N>::type;` 需显式 typename。"
    reason: "jsonifier 0.9.97 适配实测——clang-15 兼容性，跨库可复用"