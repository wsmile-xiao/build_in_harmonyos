sources:
  url: "https://github.com/RealTimeChris/Jsonifier/archive/refs/tags/v0.9.97.tar.gz"
  sha256: "859a90731c5623e4cb4200bfa7b5dcb32d75f019147b06f73b7ecc0eec31b231"
patches:
  "0.9.97":
    - patch_file: "patches/0001-jsonifier-ISA-JsonifierCPUInstructions.hpp.patch"
      patch_description: "OHOS aarch64: 指令集位 38(x86 AVX/LZCNT/BMI) -> 8(NEON)，避免包含 x86 immintrin.h"
      patch_type: "portability"
    - patch_file: "patches/0001-jsonifier-Config.hpp.patch"
      patch_description: "PREFETCH 增加 __aarch64__ 分支使用 __builtin_prefetch，避免无条件包含 xmmintrin.h"
      patch_type: "portability"
    - patch_file: "patches/0001-jsonifier-Allocator.hpp.patch"
      patch_description: "<memory_resource> 加 __has_include 守卫（OHOS libc++ 缺失该头）"
      patch_type: "portability"
    - patch_file: "patches/0001-jsonifier-Compat-SourceLocation.hpp.patch"
      patch_description: "新增 Compat/SourceLocation.hpp shim（OHOS libc++ 缺失标准 <source_location>）"
      patch_type: "portability"
    - patch_file: "patches/0001-jsonifier-Error.hpp.patch"
      patch_description: "Error.hpp 改用 Compat/SourceLocation.hpp shim"
      patch_type: "portability"
    - patch_file: "patches/0001-jsonifier-Hash.hpp.patch"
      patch_description: "Hash.hpp 改用 Compat/SourceLocation.hpp shim"
      patch_type: "portability"
    - patch_file: "patches/0001-jsonifier-Reflection.hpp.patch"
      patch_description: "Reflection.hpp 改用 Compat/SourceLocation.hpp shim"
      patch_type: "portability"
    - patch_file: "patches/0001-jsonifier-String.hpp.patch"
      patch_description: "char_traits 的 uint8_type 特化排除纯 char（aarch64 char 默认 unsigned 导致部分特化歧义）"
      patch_type: "portability"
    - patch_file: "patches/0001-jsonifier-HashMap.hpp.patch"
      patch_description: "map_simd_t 别名补 typename（clang-15 对 P0634 支持不足）"
      patch_type: "portability"
