# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jsonifier/0.9.97
homepage: "https://github.com/RealTimeChris/Jsonifier"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_jsonifier.cpp
    description: "R34：实际调用被测包 API（parseJson/serializeJson）编译并运行，非空壳测试"
    command: "compile with clang++ -std=c++2b and run"
  - file: test_ohos_specific.cpp
    description: "HarmonyOS 专项测试：NEON 路径较大多层文档、UTF-8 中文往返、int64/uint64/double 极值、嵌套数组往返、空输入防护（11 项断言全通过）"
    command: "compile with clang++ -std=c++2b and run"

assertion_count: 2
