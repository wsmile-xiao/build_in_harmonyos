# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: jpnevulator/2.3.6
homepage: "https://github.com/snarlistic/jpnevulator"

# 上游无测试目录与测试目标（Makefile 仅构建二进制与 man 页）——如实
# 申报；验证由 test_package 消费者测试承担。
upstream_check_command: "上游无测试目标"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_jpnevulator.sh
    description: >-
      CLI 消费者测试（2 项断言）：--version 正常退出（上游该选项打印
      后以 1 退出，容差处理）且输出含程序名（1）；--write --no-send
      解析十六进制文件成功（2）。失败即非零退出。
