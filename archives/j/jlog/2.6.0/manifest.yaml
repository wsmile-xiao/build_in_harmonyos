version: "2.6.0"
status: built
build_date: "2026-09-24"
conan_ref: "jlog/2.6.0"

source:
  url: "https://github.com/omniti-labs/jlog/archive/refs/tags/2.6.0.tar.gz"
  sha256: "c3c6e745557f789c2cef3e3760e3c68ee585727a0d55c14ad9cb3e8232f4e46b"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--prefix=<package>"
  dependencies:
    - autoconf/2.72
  cc: clang

patches_applied:
  - "0001-configure-in-drop-werror.patch"
  - "0002-jtest-tmpdir.patch"
  - "0003-jthreadtest-tmpdir.patch"

knowledge_gained:
  - "jlog 2.6.0 tarball 不含预生成 configure，需 autoconf 生成；in-source 构建"
  - "configure.in 对 GCC/Clang 追加 -Werror，2008 年代码需 patch 去除"
  - "aarch64 缺 -fPIC 的 .so 路径不构建，只产静态库 libjlog.a"
  - "上游自测 jtest/jthreadtest 硬编码 /tmp，真机只读 /tmp，patch 改用 $TMPDIR"
