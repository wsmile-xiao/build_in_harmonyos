software: jlog
display: "JLog"
description: "Pure C durable message queue with multiple subscribers and publishers for log processing"
category: db
homepage: "https://labs.omniti.com/labs/jlog"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "tarball 不含预生成 configure，仅在 configure.in；build 前先用 autoconf 生成 configure（tool_requires autoconf/2.72）"
    - "OHOS host 三元组 aarch64-unknown-linux-gnu 被 configure.in 的 case $host 落入 *linux* 分支，无需改平台判断"
    - "configure.in 对 GCC/Clang 追加 -Werror，2008 年代码在现代 clang 下会编译失败，patch 去掉 -Werror"
    - "静态库 + 头文件打包（纯库，不需要 commands.json）；aarch64 的 .so 路径缺 -fPIC 故不构建共享库"
    - "上游测试为 jtest/jthreadtest 驱动（非离散断言框架），make test 生成后逐一运行功能场景"
  common_dependencies:
    - autoconf
    - lz4

versions:
  "2.6.0":
    status: built
    build_date: "2026-09-24"
    conan_ref: "jlog/2.6.0"
