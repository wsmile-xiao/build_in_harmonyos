# test_package for jekyll 4.4.1
name: test_package
version: "1.0"
description: Consumer smoke test — jekyll builds a minimal site and renders Markdown + layout
test_targets:
  - test_package

upstream_tests_exist: true
upstream_test_total: 1069
upstream_test_count_method: "上游存量口径：49 个 test_*.rb 的运行时展开用例数（本次可执行的 45 个文件实测 993 例）+ 4 个未执行文件的静态 should 数（48）+ 28 个 features/*.feature = 1069。（静态 should 总数为 894，shoulda-context 展开后不低于该值；取展开值是为了避免少报。）"
upstream_check_command: "ruby -Ilib -Itest test/test_*.rb"
upstream_test_in_build: true
upstream_test_command: "conan create（build() 内 _run_upstream_tests，逐文件带 300s 超时）"

upstream_execution:
  channel: "本包 vendored 的 gem 闭包 + 系统 Ruby 执行上游 Minitest 文件（本地 x86_64 全流程 conan create）"
  command: "ruby -I<src>/lib -I<src>/test <src>/test/test_*.rb"
  programs: 18
  test_cases_run: 686
  test_cases_passed: 673
  test_cases_failed: 8
  test_cases_errors: 5
  pass_rate: "98.1%（673/686）—— CI 实测（build #66122，2026-10-01，worker 上全部真跑）"
  ci_measured: "686 项全部真跑：673 通过 / 8 失败 / 5 错误 = 98.1%；整包 build successful（L0/L1/L4/L5 全 pass）"
  local_measured: "同一批 18 文件本地 676 通过 / 6 失败 / 4 错误 = 98.5%（CI 多 2 失败 1 错误，环境差异）"
  control_run: "本地对照（只改 C 扩展可用/不可用）：扩展可用 681/3/2 = 99.3%；扩展不可用 676/6/4 = 98.5%。差额 5 项可完整归因到缺失的 C 扩展（test_filters +2F+2E、test_site +1F）；其余 3F+2E 两种条件下同样失败"
  declared_files: 49
  declared_cases: 1069
  executed_scope: "按用例数取前 18 个 Minitest 文件（686 用例）实跑；CI 单包 3600s 预算放不下全部 45 个文件（本包 gem 下载+安装本身约需 1900s）"
  not_run_files:
    - "test_new_command.rb —— jekyll new 会执行 bundle install（联网安装主题），离线构建下会阻塞（10 个用例）"
    - "test_commands_serve.rb —— 直接 require httpclient（未纳入闭包）"
    - "test_kramdown.rb —— 直接 require nokogiri 做 HTML 断言（超出 jekyll 运行期闭包）"
    - "test_related_posts.rb —— 依赖 classifier-reborn（含 C 扩展 fast-stemmer，未纳入闭包）"
  not_run_features: "features/*.feature（28 个 Cucumber 场景）需要 cucumber/aruba 与进程内 CLI 驱动，未纳入本次 vendor 闭包"
  remaining_failures_note: "10 个文件存在失败/错误：test_coffeescript（缺可选依赖 coffee-script）、test_theme / test_theme_drop / test_site / test_configuration / test_document / test_liquid_renderer / test_page_without_a_file / test_plugin_manager / test_win_tz（主题 fixture 与平台相关用例）。逐文件计数见 evidence。"
  test_only_patches:
    - "0001-test-helper-tmpdir.patch —— 仅把 test/helper.rb 的 temp_dir 从写死 \"/tmp\" 改为认 TMPDIR（OHOS worker 的 /tmp 可能只读）"
    - "0002-test-helper-coverage-optout.patch —— 让 SimpleCov 可由 JEKYLL_NO_COVERAGE 关闭（只改测试辅助函数；开着插桩在 OHOS worker 上会撞满 CI 单包构建超时）"
  known_limitations: "eventmachine / http_parser.rb 的 C 扩展未构建（HNP ruby 的 mkmf 探测不到可用编译器），仅放置源码与最小 specification 以保住 RubyGems 激活；设备上 jekyll serve --livereload 不可用。nokogiri / ffi / google-protobuf / sass-embedded 走 aarch64-linux-musl 预编译变体并重标 gem 身份。"
  evidence: "tasks/jekyll-4.4.1-2026-09-30/logs/005-upstream-tests.log（逐文件 runs/assertions/failures/errors）+ 006-local-create.log（完整 conan create 日志，EXIT=0）"
