patches:
  # 测试专用补丁：test/helper.rb 的 temp_dir 认 TMPDIR。OHOS worker 的 /tmp 可能只读，
  # jekyll 的 temp_dir 默认写死 "/tmp"；只改测试辅助函数，不触碰任何被测代码。
  - patch_file: "patches/0001-test-helper-tmpdir.patch"
    patch_description: "test-only: test/helper.rb temp_dir honors TMPDIR (read-only /tmp on OHOS workers)"
    patch_type: "portability"
  # 测试专用补丁：让 SimpleCov 覆盖率统计可由环境变量关闭——开着插桩跑上游测试会撞满
  # CI 的单包构建超时（实测 3608s > 3600s）。只改测试辅助函数。
  - patch_file: "patches/0002-test-helper-coverage-optout.patch"
    patch_description: "test-only: test/helper.rb SimpleCov can be disabled via JEKYLL_NO_COVERAGE"
    patch_type: "portability"
  # 运行期补丁：让 jekyll 本体在 jekyll-sass-converter（-> sass-embedded -> google-protobuf，
  # 均为 C 扩展）无法加载时仍能加载。只把 lib/jekyll.rb:195 那一行 require 包进
  # begin/rescue；SCSS 转换因此不可用，已在 notes.md / manifest.yaml /
  # test_package/MANIFEST.yml 中逐条申报（这是本次适配唯一一处非测试的源码改动）。
  - patch_file: "patches/0003-lazy-sass-converter.patch"
    patch_description: "runtime: make jekyll-sass-converter optional so jekyll loads when C extensions cannot be loaded (SCSS unavailable, declared)"
    patch_type: "portability"
  # 测试专用补丁：让 test/helper.rb 的 nokogiri（C 扩展）可缺省，否则整套上游用例连
  # import 都不行（0/N）。仅影响依赖 nokogiri 的 test_kramdown.rb（已在未跑清单里）。
  - patch_file: "patches/0004-test-helper-nokogiri-optional.patch"
    patch_description: "test-only: test/helper.rb tolerates a missing nokogiri (C extension) instead of making the suite un-importable"
    patch_type: "portability"
