# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "4.4.1"
software: jekyll
status: built
build_system: custom
build_date: "2026-09-30"

source:
  url: "https://github.com/jekyll/jekyll/archive/refs/tags/v4.4.1.tar.gz"
  sha256: "face80f211ffc55c87a99dd540f605208ea8b4c26fe505ed263cd2f81cd22d2d"
  tar_format: tar.gz
  rubygem:
    name: "jekyll"
    version: "4.4.1"
    url: "https://rubygems.org/downloads/jekyll-4.4.1.gem"
    sha256: "4c1144d857a5b2b80d45b8cf5138289579a9f8136aadfa6dd684b31fe2bc18c1"

build:
  system: custom
  configure_options: []
  dependencies:
    - "Ruby >= 2.7 —— 用 HarmonyOS PC 构建环境自带的系统 Ruby（HNP: /data/service/hnp/bin/ruby|gem）；conan 的 ruby/3.4.10 未发布到 ohpcd，本仓对 Ruby 软件的既有范式即如此（pandocomatic/2.2.0 / gel / msfconsole / passenger）"
    - "gem 闭包 52 个全部随包 vendor（运行期 36 + 上游测试闭包 16），url+sha256 逐条固定，构建期不做依赖解析"
  cc: N/A
  cxx: N/A
  package_layout:
    - "package/gems/: gem install 出来的 gem home（bin/ jekyll、gems/、specifications/、extensions/）"
    - "package/share/gem/: 全部 52 个 .gem + 上游 tarball（可复现副本）"
    - "package/licenses/LICENSE: 上游 MIT 许可证"

patches_applied:
  - "0001-test-helper-tmpdir.patch (test-only: test/helper.rb temp_dir honors TMPDIR)"
  - "0002-test-helper-coverage-optout.patch (test-only: SimpleCov 可由 JEKYLL_NO_COVERAGE 关闭；开着覆盖率插桩会让 45 个上游测试文件在 OHOS worker 上撞满 CI 单包构建超时，实测 3608s > 3600s)"

upstream_tests:
  framework: "Minitest + shoulda-context（test/**/test_*.rb）；另有 Cucumber features 未纳入"
  declared_files: 49
  declared_cases: 894
  declared_contexts: 299
  declared_features: 28
  declared_scope: "上游 test/ 目录下全部 test_*.rb 与 features/*.feature（存量口径）"
  in_build: true
  command: "ruby -Ilib -Itest test/test_*.rb（build() 内 _run_upstream_tests）"
  executed_files: 46
  executed_note: "另 3 个文件未跑，原因逐条列在 test_package/MANIFEST.yml（httpclient / classifier-reborn / 直接 nokogiri 断言）"

known_limitations:
  - "解释器自带的默认 gem（json / bigdecimal / prism / racc）不从制品仓提供：它们是 Ruby 3.4 的默认 gem，HNP ruby 3.4.5 自带。"
  - "eventmachine / http_parser.rb 的 C 扩展未构建（CI worker 的 HNP ruby mkmf 探测不到可用编译器），只放置了源码与最小 specification；后果是设备上 jekyll serve --livereload 不可用，其余功能不受影响。"
  - "含 C 扩展但有 aarch64-linux-musl 预编译的 gem（nokogiri / ffi / google-protobuf / sass-embedded）走预编译 + gem 身份重标（含 # stub: 行），已在 CI 上安装成功。"
  - "上游测试未覆盖的入口：test_new_command.rb（联网 bundle install）、test_commands_serve.rb（httpclient）、test_kramdown.rb（直接 nokogiri 断言）、test_related_posts.rb（classifier-reborn）、28 个 Cucumber feature。"

knowledge_gained:
  - "jekyll 的 gemspec 只把 (exe|lib|rubocop)/ 打进 gem：jekyll-4.4.1.gem 里没有 test/，跑上游测试必须同时取 GitHub tag tarball。"
  - "Ruby gem 运行的测试入口 helper.rb 会无条件 require 一些 dev gem（此处是 nokogiri / minitest-reporters / minitest-profile / rspec-mocks / shoulda-context / simplecov）——'只 vendor 运行期闭包'跑不了任何上游测试。"
  - "OHOS 是 musl：nokogiri / ffi / google-protobuf / sass-embedded 都有 aarch64-linux-musl 预编译变体，可避免在设备上编译 C 扩展；json/bigdecimal 是 Ruby 默认 gem，随系统 Ruby 自带。"
  - "RubyGems 应用在本仓的范式（承 pandocomatic/2.2.0）：ruby/3.4.10 未发布到 ohpcd，用 HNP 系统 Ruby + gem install --local --ignore-dependencies；闭包完整性必须在仓内离线自证（url+sha256 固定），不能依赖构建期解析。"
