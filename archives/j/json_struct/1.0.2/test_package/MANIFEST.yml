# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: json_struct/1.0.2
homepage: "https://github.com/jorgen/json_struct"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 独立用例统计口径: 用户测试源中的独立 TEST_CASE (Catch2 v2.13.1)
# 全目录枚举 175 个 (45 个源文件), 构建目标覆盖 172 个 (unit-tests 170 + cxx17 2)
# 全量通过率 172/172 = 100%; 另 zero-value-test 两目标 (fp-default/fp-fast) 各 1 用例 27 断言通过
upstream_tests:
  - file: tests/unit-tests
    source: json_struct-1.0.2/tests/*.cpp
    description: "上游 Catch2 单元测试主目标 (170 test cases / 1441 assertions)"
    command: "./tests/unit-tests"
  - file: tests/unit-tests-cxx17
    source: json_struct-1.0.2/tests/json-optional.cpp,json-timepoint.cpp
    description: "上游 C++17 扩展目标 (172 test cases / 1476 assertions)"
    command: "./tests/unit-tests-cxx17"
  - file: tests/zero-value-test-fp-default
    source: json_struct-1.0.2/tests/zero-value-test.cpp
    description: "零值浮点测试 (默认浮点模式, 1 case / 27 assertions)"
    command: "./tests/zero-value-test-fp-default"
  - file: tests/zero-value-test-fp-fast
    source: json_struct-1.0.2/tests/zero-value-test.cpp
    description: "零值浮点测试 (fast-math 模式, 1 case / 27 assertions)"
    command: "./tests/zero-value-test-fp-fast"

# test_package 中自带的测试 (消费者视角验证, HarmonyOS 专项)
test_package_tests:
  - file: test_package.cpp
    description: "鸿蒙专项消费者测试: UTF-8 中文/emoji round-trip、int64/uint64 64 位精度、枚举嵌套解析、错误路径、序列化回环"
    command: "./test_json_struct"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1522