# 软件级 manifest — json_struct
software: json_struct
display: "json_struct"
description: >-
  json_struct 是一个单头文件 C++ JSON 序列化/反序列化库，支持将 JSON 直接
  解析到 C++ struct，以及将 C++ struct 序列化为 JSON（支持中文 UTF-8、
  int64/uint64 全 64 位精度、枚举、嵌套结构、多态与别名）。
category: data
homepage: "https://github.com/jorgen/json_struct"
license: MIT

# 常用构建系统
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # header-only INTERFACE 库，无编译产物
  header_only: true
  # 上游 CMake 目标: json_struct::json_struct（INTERFACE）
  cmake_target: "json_struct::json_struct"
  # 测试框架: Catch2 v2.13.1（vendored，无需外部依赖）
  test_framework: "Catch2 v2.13.1"
  # 鸿蒙专项注意: UTF-8 中文/emoji round-trip 与 int64/uint64 全 64 位
  # 精度需在消费者测试中显式覆盖（arm64 全 64 位场景）
  notes: "背景噪声测试见 versions 列表对应版本 reports/test-ledger.md"

versions:
  - version: "1.0.2"
    conan_ref: "json_struct/1.0.2"
    status: built
    build_date: "2026-09-03"
    source:
      url: "https://github.com/jorgen/json_struct/archive/refs/tags/1.0.2.tar.gz"
      sha256: "c424ae3e8dbe6846311cb878d2d400c98a297a28eb1556961a985b6ed7b16090"
    notes: "见 archives/j/json_struct/1.0.2/notes.md"