# 版本级 manifest — jc_voronoi 0.9.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.0"

# 软件名
software: "jc_voronoi"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub 标签归档）
  url: "https://github.com/JCash/voronoi/archive/refs/tags/v0.9.0.tar.gz"

  # 源码校验和（官方 v0.9.0 标签 tarball SHA-256）
  sha256: "67760511dd8017cd743df8c2d680f1f1454cd65c2eaaad9fd7d3e84bf311d6cb"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: header-only 单头文件库，无独立构建系统
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（纯 C99 标准头文件库，无需适配补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "jc_voronoi 是 stb 风格 header-only C99 库，消费者需自定 JC_VORONOI_IMPLEMENTATION 实例化"
  - "配方 package_type=header-library，仅复制 src/jc_voronoi.h 与 src/jc_voronoi_clip.h 到头文件目录"
  - "无平台相关代码（仅标准 C 头文件），OHOS aarch64 无需补丁直接可编译"