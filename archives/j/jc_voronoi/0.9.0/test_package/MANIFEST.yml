# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jc_voronoi/0.9.0
homepage: "https://github.com/JCash/voronoi"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# jc_voronoi 是 stb 风格 header-only 库，上游无独立 make/ctest 注册，
# 测试经 test/compile.sh 手工编译 test.cpp 运行
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cpp
    source: voronoi-0.9.0/test/test.cpp
    description: "jc_voronoi 上游单元测试（jc_test 框架，测试生成、裁剪、double 模式）"
    command: "./build/test"
  - file: test/perftest.cpp
    source: voronoi-0.9.0/test/perftest.cpp
    description: "jc_voronoi 上游性能测试（perftest）"
    command: "./build/perftest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：实例化 header-only 实现生成 2D Voronoi 图并验证 sites/edges"
    command: "./test_jc_voronoi"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
