# test_package/MANIFEST.yml
# 上游官方测试声明文件 — jsonxx 1.0.1

package: jsonxx/1.0.1
homepage: "https://github.com/hjiang/jsonxx"

# 上游测试命令（jsonxx 使用纯 Makefile，无 configure）
upstream_check_command: "make test"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序（jsonxx_test.cc，138 行断言全部通过）
upstream_tests:
  - file: jsonxx_test.cc
    source: jsonxx-1.0.1/jsonxx_test.cc
    description: "JSON 解析/序列化/读写完整性测试（All tests ok）"
    command: "./jsonxx_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_jsonxx.cpp
    description: "消费者测试：解析/读取/构造/序列化 jsonxx API"
    command: "./test_jsonxx"

# 测试断言总数（test_jsonxx.cpp 中 CHECK 实际 21 项）
assertion_count: 21