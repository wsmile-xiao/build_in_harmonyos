knowledge_gained:
  - "jinja2 2.10.1 在 Python 3.12 上**无法 import**：5 处 `from collections import Mapping/MutableMapping/MutableSet/MutableSequence` 在 py3.10 已被移除（tests.py:13、sandbox.py:17/82、runtime.py:318、utils.py:485）——必须改 collections.abc 才能进入任何渲染路径。"
  - "依赖必须 pin markupsafe 1.1.1：jinja2/utils.py:647 导入 soft_unicode，该符号在 MarkupSafe 2.1 被移除；ohpcd 上的新版 markupsafe 会导致 import 直接失败。"
  - "上游测试 3 项未通过均为环境差异（非适配引入）：(1) test_debug::test_runtime_error 依赖 py 异常链的精确正则，py3.12 的 traceback 帧文本变化导致失配；(2) test_nativetypes::test_undefined_native_return 依赖 ast.literal_eval 对 Undefined 的行为，py3.12 会先触发 UndefinedError；(3) test_bytecode_cache::test_simple 要求 tempdir 权限严格 0700，HMDFS 上 chmod 被忽略（实测 lstat mode=2771，setgid 位继承）→ FileSystemBytecodeCache 判定不安全目录。"

