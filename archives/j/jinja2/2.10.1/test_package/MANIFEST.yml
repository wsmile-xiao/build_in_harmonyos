# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jinja2/2.10.1
homepage: "https://github.com/pallets/jinja"

# 上游测试命令 — pytest（tests/ 目录，20 个测试文件）
upstream_check_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest tests -q --assert=plain"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=<src>:<markupsafe-site> python3 -m pytest tests -q --assert=plain -p no:cacheprovider"

# 上游实际运行的测试程序（2026-09-16 实测记录）：
# - tests/ 目录（20 个测试文件 + conftest.py + res/ 模板资源）
# - 实测结果：**533 passed, 2 failed, 1 error, 3 skipped**
# - 逐项定性（见 notes.md「上游测试三项未通过」）：
#   1) test_debug::test_runtime_error  — py3.12 异常链格式变化，exact-match 正则失配
#   2) test_nativetypes::test_undefined_native_return — py3.12 ast.literal_eval
#      会先 repr 求值 Undefined 触发 UndefinedError（上游未适配 py3.12）
#   3) test_bytecode_cache::test_simple — FileSystemBytecodeCache 要求 tempdir
#      权限严格为 0700，HMDFS 上 chmod 被忽略（实测 lstat mode=2771，setgid 继承）
#   三项均为「上游代码 vs py3.12/OHOS 文件系统」的环境差异，非本适配引入；
#   未做 test-skipping 掩盖（R51），如实申报。
upstream_tests:
  - file: tests/
    source: Jinja2-2.10.1/tests/
    description: "上游 pytest 套件（20 个测试文件；实测 533 passed / 2 failed / 1 error / 3 skipped，3 项未通过均已定性为环境差异，见 notes.md）"
    command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=<src>:<markupsafe-site> python3 -m pytest tests -q --assert=plain -p no:cacheprovider"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_jinja2.py
    description: "消费者测试：真实 API（R34）——模板渲染/自动转义/继承/过滤器与测试 + collections.abc 补丁生效校验 + markupsafe.soft_unicode 契约"
    command: "python3 test_jinja2.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 16
