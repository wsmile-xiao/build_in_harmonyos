# test_package/MANIFEST.yml — jinja2 3.1.6
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jinja2/3.1.6
homepage: "https://github.com/pallets/jinja"

# 上游测试命令 — pytest（tests/ 目录，23 个测试文件 + conftest.py + res/ 资源）
upstream_check_command: "python3 -m pytest tests -q"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=<test-deps>:<src>:<markupsafe-site> python3 -m pytest tests -q --no-header -p no:cacheprovider --basetemp=<build>/pytest-basetemp"

# 上游实际运行的测试程序（2026-09-20 实测记录）：
# - tests/ 目录（23 个测试文件 + conftest.py + 模板资源 res/）
# - 实测结果：**909 passed, 0 failed**（`909 passed in 4.21s`）
# - 与 2.10.1 的对比（重要）：2.10.1 实测 533 passed / 2 failed / 1 error /
#   3 skipped，其中 3 项为「上游代码 vs py3.12/OHOS 文件系统」的环境差异。
#   3.1.6 **零失败**——3.1.6 是已适配 py3.12 的版本（无 collections.abc 旧别名，
#   无 soft_unicode 依赖），故本配方**无需补丁**（patches 为空）。
#
# 测试依赖获取：上游 requirements/tests.in 声明 pytest + trio；tox.ini 的
#   deps = -r requirements/tests.txt、commands = pytest。
#   宿主 pytest 为 5.4.3 且与 py3.12 **不兼容**（实测断言重写钩子报
#   `TypeError: required field "lineno" missing from alias`）→ 按 setuptools
#   84.0.0 先例，构建期从平台 pip 镜像（ci/conan/setup.sh:55 的
#   PIP_COMMUNITY_INDEX）取到独立目录再运行。
#   取依赖失败或套件失败均**显式抛 ConanException**，不静默降级。
upstream_tests:
  - file: tests/
    source: jinja2-3.1.6/tests/
    description: "上游 pytest 套件（23 个测试文件 + conftest.py + res/ 模板资源；hnp python3.12 实测 909 passed / 0 failed）"
    command: "python3 -m pytest tests -q"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_jinja2.py
    description: >-
      消费者测试（15 断言）：版本、markupsafe>=2、src 布局正确落位、无旧版
      collections 别名残留、soft_unicode 已移除、模板渲染、经 markupsafe 的
      自动转义、继承与控制流、过滤器与测试、jinja2.meta 子模块、
      FileSystemBytecodeCache 往返、select_autoescape；含 3 个**负例**
      （语法错误必须抛 TemplateSyntaxError、StrictUndefined 必须抛
      UndefinedError、ImmutableSandboxedEnvironment 必须拒绝容器变异）
    command: "python3 test_jinja2.py <site-packages-dir>"

# 测试断言总数（实测：15）
assertion_count: 15

# 上游测试实测结果（R51 如实申报）
upstream_test_note: >-
  上游 pytest 套件在 build() 内真实运行，实测 **909 passed, 0 failed**
  （`909 passed in 4.21s`，本地；`conan create` 内为 `909 passed in 4.55s`）。
  **零失败、零 skip、无允许失败清单**：套件退出码非 0（含超时 5400s）时
  conan create 直接抛 ConanException 失败，杜绝「测试没跑通但构建成功」。
  测试依赖（pytest>=7 + trio，来自上游 requirements/tests.in）由构建期从平台
  pip 镜像取到独立目录；取依赖失败显式抛错，不以跳过冒充通过。
  test_package 消费者测试：**15/15 passed**。
