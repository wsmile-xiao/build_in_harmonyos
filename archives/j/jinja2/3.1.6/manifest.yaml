# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "markupsafe/3.0.3"
  optional: []
  note: |
    pyproject.toml: dependencies = ["MarkupSafe>=2.0"]，requires-python = ">=3.7"。
    ohpcd 已发布 markupsafe/3.0.3（满足 >=2.0），故直接声明。

    ⚠️ 与 2.10.1 的关键差异：2.10.1 把 markupsafe 钉在 **1.1.1**，因其
    utils.py 依赖 MarkupSafe < 2.1 才有的 `soft_unicode`；3.1.6 已移除该
    shim（实测 `markupsafe.soft_unicode` 与 `jinja2.utils.soft_unicode`
    在 3.0.3 下均不存在），故不再需要旧版钉死。

    测试依赖（上游 requirements/tests.in）：pytest + trio。二者**未**发布到
    ohpcd（实测 conan search 均 0 个），按 PF4 不写成 test_requires，改为
    构建期从平台 pip 镜像取到独立目录后运行。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Python 无二进制产物；不产生 bindirs，
    故无需 commands.json，R38 不适用）。

    上游 3.1.6 采用 **src 布局**（`src/jinja2/`）与 flit_core 构建后端
    （pyproject.toml: requires = ["flit_core<4"], build-backend =
    flit_core.buildapi）。纯 Python 无需编译，故 package() 直接把
    `src/jinja2` 拷入 `<pkg>/lib/python3.12/site-packages/jinja2`
    （注意与 2.10.1 的 setuptools 平铺布局不同，需按 src 取路径）。

    **本配方无需补丁**（patches 为空）：2.10.1 从 5 处 import
    `collections.Mapping` / `MutableMapping` / `MutableSet` /
    `MutableSequence`（py3.10 已移除），在 py3.12 下无法 import，必须打
    0001-collections-abc.patch；3.1.6 实测可直接 import 并渲染模板。

    package_info() 同时声明 runenv_info 与 buildenv_info 的 PYTHONPATH
    （aiohttp 教训：仅 print 不够，CI 会报 "No module named ..."）。

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues: []
  notes: |
    纯 Python，无 C 扩展、无平台相关代码，aarch64-ohos 与上游行为一致。
    3.1.6 是已适配 Python 3.12 的版本（2.10.1 的 collections 别名与
    soft_unicode 两处历史问题均已消除），故本版本零失败、无需补丁。

