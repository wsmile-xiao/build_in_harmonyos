    钩子报 `TypeError: required field "lineno" missing from alias`）→ 构建期
    从平台 pip 镜像（ci/conan/setup.sh:55 的 PIP_COMMUNITY_INDEX）取到独立目录
    （pytest>=7 + trio）再运行。取依赖失败或套件失败均显式抛 ConanException。
    适配后：test_package 消费者测试（R34 真实 API）**15/15 = 100%**。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "宿主 pytest 5.4.3 与 py3.12 不兼容（断言重写钩子报 TypeError: required field \"lineno\" missing from alias）——上游测试需新版 pytest 时，构建期从平台 pip 镜像取到独立目录再以其为 PYTHONPATH 运行，并把取依赖失败显式抛错而非跳过（先例：setuptools 84.0.0、jinja2 3.1.6）(ref: DRAFT-ohos-pytest-host-py312-incompat)"
  - "Python 包升级大版本后必须重新核对『旧版为何钉死某个依赖版本』：jinja2 2.10.1 把 markupsafe 钉在 1.1.1 是因其 utils.py 需要 MarkupSafe<2.1 的 soft_unicode，而 3.1.6 已移除该 shim（实测两处 soft_unicode 均不存在），故可升到 >=2.0；不核对就会沿用过时 pin 或误删兼容代码 (ref: DRAFT-ohos-markupsafe-soft-unicode-removal-dual-version-lines)"
  - "OHOS 上 pytest 默认 basetemp（<tmp>/pytest-of-<user>）会因新建目录属主被强制显示为挂载属主（20001006）而 INTERNALERROR: not owned by the current user；传 --basetemp 走 _given_basetemp 分支即可绕过 (ref: E543-draft-DF80)"
  - "Jinja2 3.x 的 jinja2.sandbox 是子模块且未被 __init__ 导入，使用须显式 `from jinja2.sandbox import ...`；且断言沙箱生效应照上游 tests/test_security.py 用 ImmutableSandboxedEnvironment 下的容器变异（[].append(...)）触发 SecurityError，而非 `{{ ''.__class__ }}`（后者在 3.1.6 下不抛错）"

