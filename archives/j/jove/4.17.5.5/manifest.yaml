software: jove
build_system: makefile
# 版本级 manifest — jove 4.17.5.5
# 文件位置: archives/j/jove/4.17.5.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "4.17.5.5"
status: built
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/jonmacs/jove/archive/refs/tags/4.17.5.5.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: jove 使用纯 Makefile，无 configure 脚本
  system: makefile

  # 编译命令 (无 configure 脚本)
  # make SYSDEFS="-DLinux -DJTC" JOVEHOME=$DEFAULT_PREFIX JTMPDIR=$TMPDIR/jove-tmp CC=clang
  configure_options:
    - "SYSDEFS=-DLinux -DJTC"
    - "JTMPDIR=$TMPDIR/jove-tmp"

  # 无外部依赖，使用内置 termcap (JTC 模式)
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无补丁，仅通过 make 变量适配平台
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - ref: notes.md#遇到的问题与解决方案 "HarmonyOS uname 返回非 Linux 名，需 -DLinux 匹配 sysdep.h"
  - ref: notes.md#遇到的问题与解决方案 "JTMPDIR 默认 /var/tmp 只读，需重定向到 $TMPDIR"
  - ref: notes.md#遇到的问题与解决方案 "jove 使用纯 Makefile 而非 autotools configure"
  - ref: notes.md#遇到的问题与解决方案 "JTC 模式启用内置 termcap，消除 ncurses 依赖"
  - ref: notes.md#遇到的问题与解决方案 "PIPEPROCS 需外部 ncurses 提供 ospeed，与 JTC 不兼容"

# ============================================================
# 产物信息
# ============================================================

artifacts:
  - file: "packaging/jove-4.17.5.5-ohos-aarch64.tar.gz"
    size: "665KB"
    desc: "主预编译包"
  - file: "packaging/jove-4.17.5.5-ohos-aarch64-debug.tar.gz"
    size: "106KB"
    desc: "调试符号包"

# ============================================================
# 验证结果
# ============================================================

verification:
  g1_binary_integrity: PASS
  g2_functional: PASS (1 warning: 终端编辑器在非 TTY 环境受限)
  g3_portability: PASS
  g4_archive: PASS
  overall: PASS
