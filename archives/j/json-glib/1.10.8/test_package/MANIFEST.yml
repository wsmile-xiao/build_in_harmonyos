  - {name: builder, command: "meson test builder"}
  - {name: generator, command: "meson test generator"}
  - {name: gvariant, command: "meson test gvariant"}
  - {name: invalid, command: "meson test invalid"}
  - {name: node, command: "meson test node"}
  - {name: object, command: "meson test object"}
  - {name: parser, command: "meson test parser"}
  - {name: path, command: "meson test path"}
  - {name: reader, command: "meson test reader"}
  - {name: serialize-simple, command: "meson test serialize-simple"}
  - {name: serialize-complex, command: "meson test serialize-complex"}
  - {name: serialize-full, command: "meson test serialize-full"}
  - {name: conformance-implementation, command: "meson test conformance-implementation"}
  - {name: conformance-valid, command: "meson test conformance-valid"}
  - {name: conformance-invalid, command: "meson test conformance-invalid"}

