software: json-glib
version: "1.10.8"
status: built
build_date: "2026-09-16"

source:
  url: "https://download.gnome.org/sources/json-glib/1.10/json-glib-1.10.8.tar.xz"
  sha256: "55c5c141a564245b8f8fbe7698663c87a45a7333c2a2c56f06f811ab73b212dd"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "--prefix=/"
    - "-Ddefault_library=shared"
    - "-Dwrap_mode=nodownload"
    - "-Dintrospection=disabled"
    - "-Ddocumentation=disabled"
    - "-Dman=false"
    - "-Dnls=disabled"
    - "-Dtests=true"
    - "-Dconformance=true"
    - "-Dinstalled_tests=false"
  dependencies:
    - glib/2.88.3
    - proxy-libintl/0.5
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Conan 生成依赖 .pc 文件与宿主 pkg-config 可执行程序属于两个独立闭包"
  - "test_package 显式运行前必须从 Conan build_folder 解析并校验消费者绝对路径"
