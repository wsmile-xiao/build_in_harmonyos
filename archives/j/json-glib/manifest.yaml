# JSON-GLib 软件级元数据
# 用法: 软件描述、依赖信息、版本索引

name: json-glib
description: A library providing JSON serialization and deserialization support for GLib
category: library
license: LGPL-2.1-or-later
website: https://wiki.gnome.org/Projects/JsonGlib
upstream_url: https://download.gnome.org/sources/json-glib/

# 依赖信息
dependencies:
  build:
    - meson
    - ninja
    - pkg-config
    - glib
  runtime:
    - glib

# 版本索引（最新版本在前）
versions:
  - version: "1.6.6"
    status: built
    date: "2026-05-22"
    notes: 静态库编译成功，工具程序因依赖缺失未编译