# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jakarta-servlet-api/6.1.0
homepage: "https://github.com/jakartaee/servlet"

# 上游测试通过 Maven 运行（-DskipTests=false，package 阶段含 test）
upstream_check_command: "mvn -pl api -am clean package -B -DskipTests=false"
upstream_test_in_build: true
upstream_test_command: "mvn -pl api -am clean package -B -DskipTests=false"

# 上游测试用例（在 build() 中运行）
# 实测（conan create, build() 内 surefire 3.2.5）：
#   Tests run: 120, Failures: 0, Errors: 0, Skipped: 0 —— BUILD SUCCESS, EXIT=0
#   CanonicalUriPathTest 84 + CookieTest 19 + HttpServletTest 17 = 120
# 统计口径：api/src/test/java 10 个源文件 = 3 个测试类 + 7 个 mock/辅助类；
# 源码侧 12 个 @Test + 5 个 @ParameterizedTest = 17 个测试方法，参数化展开后共 120 次执行
# 注：spec 模块为文档、tck 模块为完整 Servlet TCK，均无单元测试参与本构建
upstream_tests:
  - file: api/src/test/java/jakarta/servlet/http/
    source: servlet-6.1.0-RELEASE/api/src/test/java/jakarta/servlet/http/
    description: "上游 JUnit 5 测试实测 120 例全过：CookieTest（19 例：11 @Test + 2 @ParameterizedTest 展开，Cookie 名值/属性/解析边界）、CanonicalUriPathTest（84 例参数化：URI 路径规范化与拒绝规则）、HttpServletTest（17 例参数化：TRACE/HEAD 与 header 行为）"
    command: "mvn -pl api -am clean package -B -DskipTests=false"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "编译并运行 Java 反射测试程序（TestJakartaServlet.java，32 项断言）：20 个核心类型/契约加载（jakarta.servlet 13 + jakarta.servlet.http 7）+ 12 项契约断言（Servlet 是接口、HttpServlet 继承 GenericServlet、HttpServletRequest/Response 继承通用变体、ServletInputStream/OutputStream 为抽象类、DispatcherType 5 个枚举值、ServletException 继承 Exception、Cookie/HttpSession/ServletRequest/AsyncContext/Part 的真实方法签名）(R34 实质性验证)"
    command: "bash test.sh"

# 测试断言总数
# 上游：17 个测试方法（surefire 实际执行数回填）
# test_package：32 个反射断言 + 2 个流程断言（JAR 存在、javac 成功）+ 1 个 PASS 校验
assertion_count: 35
