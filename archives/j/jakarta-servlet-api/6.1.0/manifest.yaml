# 版本级 manifest — jakarta-servlet-api 6.1.0
version: "6.1.0"
software: jakarta-servlet-api
status: built
build_date: "2026-10-07"
conan_ref: "jakarta-servlet-api/6.1.0"

source:
  url: "https://github.com/jakartaee/servlet/archive/refs/tags/6.1.0-RELEASE.tar.gz"
  sha256: "1f1fa9656cc46c438268d35145ef72446e817998623b96616ba66dc38e577961"
  note: "该仓库 release tag 带 -RELEASE 后缀（6.1.0 / v6.1.0 均 404，6.1.0-RELEASE 为 200）"

build:
  system: maven
  command: "mvn -pl api -am clean package -B -DskipTests=false"
  dependencies:
    - bishengjdk 17.0.13（配方经 cmd-pkgs 自取）
    - apache-maven 3.9.11（配方自取，sha256 校验）

patches_applied: []

upstream_tests:
  framework: junit5
  test_sources: 10
  test_classes: 3
  test_methods: 17
  test_command: "mvn -pl api -am clean package -B -DskipTests=false"
  run_in_build: true
upstream_test_pass_rate: "120/120（100%）——build() 内 surefire 实测：CanonicalUriPathTest 84 + CookieTest 19 + HttpServletTest 17 = 120，Failures/Errors/Skipped 全 0；BUILD SUCCESS，conan create EXIT=0"
adapted_test_pass_rate: "test_package 32/32 反射断言 + 2 流程断言（JAR 存在 / javac 成功）+ PASS 校验全过（HarmonyOS PC aarch64 本机 conan create 实测）"

knowledge_gained:
  - "reactor 作用域：根 pom 的 modules 含 api/spec/tck——spec 是文档模块、tck 是完整 Servlet TCK（独立大工程），制品只需 api；用 `-pl api -am` 只构建 api 及其父 pom，避免拉入 tck"
  - "上游 release tag 形如 <version>-RELEASE（非 v<version>）；下载前需探测，否则 404"
  - "上游测试在 api 模块：api/src/test/java 10 个源文件 = 3 个测试类（CookieTest 11 @Test + 2 @ParameterizedTest、CanonicalUriPathTest 1 @ParameterizedTest、HttpServletTest 1 @Test + 2 @ParameterizedTest）+ 7 个 mock/辅助类；JUnit 5（junit-jupiter 5.10.2 + hamcrest 2.2），surefire 3.2.5"
