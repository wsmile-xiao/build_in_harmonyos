# 版本级 manifest — jwt-cpp 0.7.1 (依赖项)

version: "0.7.1"
software: "jwt-cpp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方，禁止本地/镜像/代理改写）
  url: "https://github.com/Thalhammer/jwt-cpp/archive/refs/tags/v0.7.1.tar.gz"
  # 源码校验和（官方 GitHub release 归档实测，2026-09-02）
  sha256: "e52f247d5e62fac5da6191170998271a70ce27f747f2ce8fde9b09f96a5375a4"
  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DJWT_BUILD_EXAMPLES=OFF"
  - "-DJWT_BUILD_TESTS=OFF"
  - "-DJWT_BUILD_DOCS=OFF"
  - "-DJWT_ENABLE_COVERAGE=OFF"
  - "-DJWT_ENABLE_FUZZING=OFF"
  - "-DJWT_DISABLE_PICOJSON=OFF"
  - "-DJWT_DISABLE_BASE64=OFF"

  # 编译依赖列表
  dependencies:
  - openssl/3.5.6.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained: []