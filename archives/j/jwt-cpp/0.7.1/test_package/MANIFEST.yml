# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jwt-cpp/0.7.1
homepage: "https://github.com/Thalhammer/jwt-cpp"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (GTest, 详见任务台账 reports/upstream-tests-ledger.md)
upstream_tests:
  - file: tests/TestMain.cpp
    source: jwt-cpp-0.7.1/tests/TestMain.cpp
    description: "GTest 主入口，聚合 BaseTest/ClaimTest/HelperTest/JwksTest/OpenSSLErrorTest/TokenFormatTest/TokenTest"
    command: "./jwt-cpp-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：HS256 签名+校验往返"
    command: "./test_jwt-cpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 57
