software: john
display: "John the Ripper"
description: "Password security auditing and recovery tool"
category: security
homepage: "https://github.com/openwall/john"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "使用Makefile.legacy直接编译，绕过configure问题"
    - "禁用SIMD支持（-DJOHN_NO_SIMD）"
    - "需要添加 -Wl,--allow-shlib-undefined 解决OpenSSL链接问题"
  common_dependencies:
    - openssl

versions:
  "1.9.0-jumbo-1":
    status: built
    build_date: "2026-06-10"