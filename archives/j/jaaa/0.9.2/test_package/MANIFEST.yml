package: jaaa/0.9.2
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"

upstream_check_command: "make -C source check"
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  Zero upstream automated tests, established by three independent counts on
  the verified 0.9.2 tarball (sha256 6cf55a3924694179d83e9d49f557896fcebdc1a7f89477e601caa2277ad7f3b3).
  (1) There is no test directory: the tarball ships exactly AUTHORS, COPYING,
  README and source/, and `test -d tests` fails. (2) There is no check target:
  `make -n check` aborts with "make: *** No rule to make target 'check'. Stop."
  and `make -n test` likewise; source/Makefile defines only jaaa, install,
  uninstall and clean. (3) There is no test source file: the source/ file list
  is audio.cc audio.h jaaa.cc mainwin.cc mainwin.h messages.h rngen.cc rngen.h
  styles.cc styles.h and Makefile — five .cc translation units, none of them a
  test, no gtest/CUnit/check/ctest harness anywhere. This is not an
  environment limitation; the upstream release simply ships no tests. The
  packaged consumer smoke test below exercises the built binary instead.

test_package_tests:
  # ---- ARTIFACT layer: asserted in test_package/conanfile.py -------------
  - file: conanfile.py
    name: artifact-elf-architecture
    outcome: passed
    description: >-
      llvm-readelf -h on the packaged bin/jaaa must report "Machine: AArch64".
    command: "readelf -h <pkg>/bin/jaaa"
  - file: conanfile.py
    name: artifact-codesign-section
    outcome: passed
    description: >-
      The packaged binary carries exactly one .codesign section after OHOS
      self-signing (0 means it cannot be exec'd, >1 means a botched re-sign).
    command: "readelf -SW <pkg>/bin/jaaa"
  - file: conanfile.py
    name: artifact-needed-basenames
    outcome: passed
    description: >-
      Every DT_NEEDED entry is a bare soname. Observed set on the device
      (create4.log): libzita-alsa-pcmi.so.0, libclthreads.so.2, libclxclient.so.3,
      libasound.so, libfftw3f.so.3, libjack.so.0, libXft.so.2, libX11.so.6,
      libc++_shared.so, libc.so — none may
      contain a slash, which would mean an absolute path was baked in.
    command: "readelf -d <pkg>/bin/jaaa"
  - file: conanfile.py
    name: artifact-no-host-prefix-leak
    outcome: passed
    description: >-
      The raw bytes of bin/jaaa contain no "/usr/local", i.e. the staged
      PREFIX=/ override kept the host installation prefix out of the artifact
      (upstream's -DPREFIX macro is defined but never referenced by any
      translation unit, and the staged BINDIR is <destdir>/bin).
    command: "grep -c /usr/local in bin/jaaa byte scan"
  # ---- LOADER / PROCESS layer: asserted by test_jaaa.sh ------------------
  - file: test_jaaa.sh
    name: loader-version-banner
    outcome: passed
    description: >-
      `jaaa -h` prints the upstream banner "Jaaa-0.9.2". help() runs before
      any X or JACK call, so reaching it proves the loader accepted the ELF
      and the whole shared-library closure resolved.
    command: "jaaa -h"
  - file: test_jaaa.sh
    name: loader-normal-early-exit
    outcome: passed
    description: >-
      `jaaa -h` returns exit 1, which is upstream's own exit(1) in help() —
      not 127 (loader rejection) and not a signal death.
    command: "jaaa -h; echo $?"
  - file: test_jaaa.sh
    name: process-x-display-layer-signature
    outcome: passed
    description: >-
      `jaaa` with no argument gets past the loader and past X_resman init and
      fails inside X_display() with the exact upstream text
      "Can't open display !", exiting 1. The failure is therefore attributed
      to the missing X server, not to a missing shared library.
    command: "jaaa (stderr captured)"
  # ---- CAPABILITY layer: declared skipped, with observed signatures ------
  - file: test_jaaa.sh
    name: jack-client-connect
    outcome: skipped
    description: >-
      `jaaa -J` cannot be exercised: main() opens the X display before
      driver->init_jack(), so with no X server the JACK code path is never
      entered, and the device runs no JACK server either. Reported as
      JAAA_TEST_SKIP with exit code and reason, never as a pass.
    command: "jaaa -J"
  - file: test_jaaa.sh
    name: alsa-capture-open
    outcome: skipped
    description: >-
      `jaaa -A` cannot be exercised for the same reason: init_alsa() is
      reached only after X_display() succeeds, and there is no audio capture
      device on the build host. Reported as JAAA_TEST_SKIP.
    command: "jaaa -A"
  - file: test_jaaa.sh
    name: gui-render
    outcome: skipped
    description: >-
      Window creation (init_styles/X_rootwin/Mainwin) and spectrum rendering
      need a live display server; the headless build host has none. Reported
      as JAAA_TEST_SKIP rather than silently omitted.
    command: "jaaa (rendering path)"

# Accounting, all five dimensions, from the run recorded in notes.md:
static_upstream_test_files: 0
executable_test_cases: 7
measured_passed: 7
measured_skipped: 3
measured_failed: 0

test_case_count: 10
assertion_count: 8
