# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.9.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.2"

# 软件名
software: "jaaa"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://kokkinizita.linuxaudio.org/linuxaudio/downloads/jaaa-0.9.2.tar.bz2"

  # 源码校验和
  sha256: "6cf55a3924694179d83e9d49f557896fcebdc1a7f89477e601caa2277ad7f3b3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: ["0001-source-Makefile.patch"]
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: ["上游 Makefile 里的 -march=native 在 OHOS 交叉工具链下必须摘掉（由 patches/0001-source-Makefile.patch 完成）", "上游 Makefile 用 pkgconf 探 FreeType，设备上无 pkgconf ⇒ 补丁摘掉探测并暴露 $(PCONFCFL) 注入槽，由配方把依赖路径填进去，这样不会覆写 -DVERSION/-DPREFIX", "上游 INSTALL 未参数化 ⇒ 补丁把它参数化后才能落到 conan 的 package_folder（本包非 DESTDIR 型，M13 手法不通用）", "编译器在上游规则里是变量 $(CXX) 引用（与同作者姊妹包 aliki/jnoise 不同）⇒ 可用 make 命令行覆写编译器，无需为此打补丁", "链接的是 -lfftw3f ⇒ 需要 fftw 的单精度组件，不是默认组件", "无头能力按层实测：装载层放行＋进程层以稳定诊断签名为准（Cant-open-display），GUI 渲染 / JACK 连接 / ALSA 采集三类不可执行用例逐条 test_skipped 并带 reason，不记成通过", "更细的症状、根因与最小复现以本目录 notes.md 为准"]
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
