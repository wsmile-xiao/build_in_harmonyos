# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "package_type=application 的 GUI 音频分析器（JACK -J / ALSA -A 两个后端）：package_info 不导出 cpp_info.libs，命令行走软件级 commands.json 声明（R38/L0k）"
    - "上游是纯手写 Makefile 工程（source/Makefile），且编译器以变量 $(CXX) 引用——与同作者姊妹包 aliki/jnoise 把编译器名写进规则不同，本包可用 make 命令行覆写编译器，无需为此打补丁"
    - "X11 侧本包走 1.8.13 轨（libxft/2.3.8 + libx11/1.8.13 + xorgproto + fontconfig），与 libdockapp 系 dockapp 包所在的 6.4.0 轨不是同一条轨；同一张依赖图里混轨会 fork 出两套 X11 闭包，改轨前必须先组图验证"
    - "上游 Makefile 用 pkgconf 探 FreeType，设备上无 pkgconf ⇒ 补丁摘掉探测并暴露 $(PCONFCFL) 注入槽，由配方注入依赖路径（避免覆写 -DVERSION/-DPREFIX）"
    - "链接 -lfftw3f ⇒ 需要的是 fftw 的单精度组件，不是默认组件"
    - "无 X server 也无 JACK/ALSA 设备：消费者测试按层判——装载层放行（ELF 架构/NEEDED/.codesign/宿主路径），进程层以稳定诊断签名为准（Cant-open-display），GUI 渲染 / JACK 连接 / ALSA 采集三类真不可执行用例逐条 test_skipped 并写 reason，绝不记成通过"
  common_dependencies:
    - clxclient
    - clthreads
    - libxft
    - libx11
    - fftw
    - fontconfig

