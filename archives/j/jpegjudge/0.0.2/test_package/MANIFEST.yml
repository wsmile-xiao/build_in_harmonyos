homepage: "https://oldhome.schmorp.de/marc/judge.html"

# 上游唯一存在的测试入口：automake 1.4 生成的 Makefile.in 里有 check 目标，
# 但 `check: check-am` / `check-am: all-am`（实测 Makefile.in:323-324），
# 既无 TESTS 变量也无 check_PROGRAMS ⇒ 入口存在但注册用例数为 0。
