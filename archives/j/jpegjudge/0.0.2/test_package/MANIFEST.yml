# 配方 build() 中真实执行了 make check（见 conanfile.py），
# 实测退出码 0、执行用例 0 个。
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试用例清单：空。清点证据（21 个文件全清单、测试目录查找、
# 框架标记 grep、Makefile.in 注册行）见版本级 notes.md 与 reports/。
upstream_tests: []

# 新增消费者测试（test_package）
test_package_tests:
  - file: test_jpegjudge.sh
    description: "以使用者身份真运行 judge：36 条断言覆盖长/短选项与退出码契约（--version/--help/-v/-h/无参/未知选项）、真实 JPEG 判定值的确定性与同图不同质量的区分度、纯色下界与不足 8x8 块的除零边界、-b 输出形态、stdin、多文件、非 JPEG、缺失文件、好坏混合、截断件"
    command: "bash test_jpegjudge.sh <judge> <fixture-dir>"
  - file: conanfile.py
    description: "落盘 4 个由 IJG libjpeg 编码器真实生成的 JPEG 夹具、定位安装包内 bin/judge、以 conanrun 环境执行脚本并以其退出码为准"
    command: "conan test archives/j/jpegjudge/0.0.2/test_package jpegjudge/0.0.2"

# 断言条数（消费者测试程序数 = 1，即 test_jpegjudge.sh）
assertion_count: 36
