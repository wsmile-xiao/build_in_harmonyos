# conandata.yml — jpegjudge 0.0.2
#
# 源 URL 取上游官方发布点（作者 Marc Lehmann 的 oldhome.schmorp.de，
# 页面 https://oldhome.schmorp.de/marc/judge.html 上唯一的下载链接
# data/judge-0.0.2.tar.gz）。
# 说明：Debian 池里的 jpegjudge_0.0.2.orig.tar.gz 内容与本文件逐字节相同
# （diff -r 实测 0 差异、21 个文件清单一致），但 deb.debian.org 属 PF7/R39
# 的「Debian 下游重打包源」黑名单，故不取；两者 sha256 不同只因重新打包
# （orig 39320 B vs 官方 39079 B）。
# sha256 为设备实测（sha256sum 实物文件，非抄索引）。

sources:
  url: "https://oldhome.schmorp.de/marc/data/judge-0.0.2.tar.gz"
  sha256: "e43d15db51a5bf6f1460df0cdf6e0ea183942a17a83b0e0313102129ba0d4725"

patches:
  - patch_file: "patches/0001-cli-long-options.patch"
    patch_description: "为 judge 增加 GNU 长选项 --version/--help：上游只有 getopt 短选项 -v/-h，两个长选项会落入 default 分支 exit 2，被 conan-verify 的 L2 smoke 门禁判成「所有二进制文件均无法运行」（知识条目 E503，libubox/jshn 先例）"
    patch_type: "portability"
