# 版本级 manifest — jpegjudge 0.0.2
# 文件位置: archives/j/jpegjudge/0.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（交叉校验元数据，CI 只读 conanfile.py/conandata.yml/test_package/patches/）

version: "0.0.2"
software: "jpegjudge"
status: built
build_date: "2026-09-25"
build_system: "autotools"
conan_ref: "jpegjudge/0.0.2"

# ============================================================
# 源码信息（与 conandata.yml 同源）
# ============================================================

source:
  url: "https://oldhome.schmorp.de/marc/data/judge-0.0.2.tar.gz"
  sha256: "e43d15db51a5bf6f1460df0cdf6e0ea183942a17a83b0e0313102129ba0d4725"
  tar_format: tar.gz

# ============================================================
# 构建配置（与 conanfile.py 同源）
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=/"
  dependencies:
    - libjpeg/10
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-cli-long-options.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CLI 工具只有 getopt 短选项时，--version/--help 退出码为 2 会被 L2 smoke 判成「所有二进制文件均无法运行」；在 main() 开头补 GNU 长选项（ref: E503，libubox/jshn 先例）"
  - "autoconf 2.13 时代的随包 configure 不认识 Conan AutotoolsToolchain 默认注入的 --datarootdir，会把 configure 参数收敛为只传 --prefix 并靠 DESTDIR 安装（ref: 本包 configure --help 实测选项面 + configure:379 未知选项即 exit 1）"
  - "上游确无自动化测试时，automake 1.4 的 check 目标（check: check-am / check-am: all-am）仍可在 build() 中真实执行，实测退出码 0、执行用例 0，五维账本 N_executed=0 并附清点证据（ref: R51 上游测试三步法）"
