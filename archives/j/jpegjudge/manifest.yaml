# 软件级 manifest — jpegjudge
# 文件位置: archives/j/jpegjudge/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（人读索引 + 交叉校验，CI 不依赖）

software: jpegjudge
display: "jpegjudge (judge)"
description: "按 JPEG 编码参数判定与比较图片的命令行工具，输出 0~1000 的质量指示值"
category: utility
homepage: "https://oldhome.schmorp.de/marc/judge.html"
license: IJG
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游可执行文件名是 judge，包名是 jpegjudge（Debian/任务口径），commands.json 的 name 按包名声明"
    - "随包 configure 由 autoconf 2.13 生成、Makefile.in 由 automake 1.4 生成，不用 autoreconf 重生成（输入文件叫 configure.in，另有 acconfig.h/config.h.bot/stamp-h.in 的 2.13 机制）"
    - "2.13 的 configure 不识别 Conan 默认的 --datarootdir，配方只传 --prefix=/，安装靠 DESTDIR（ref: configure --help 实测选项面 + configure:379 未知选项 exit 1）"
    - "CLI 只有 getopt 短选项时 --version/--help 会以 2 退出、撞上 L2 smoke 门禁，补 GNU 长选项即可（ref: E503，libubox/jshn 先例）"
  common_dependencies:
    - libjpeg

versions:
  "0.0.2":
    status: built
    build_date: "2026-09-25"
    conan_ref: "jpegjudge/0.0.2"
