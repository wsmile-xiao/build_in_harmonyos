# test_package/MANIFEST.yml — json5 0.15.0
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: json5/0.15.0
homepage: "https://github.com/dpranke/pyjson5"

# 上游测试套件：tests/ 目录 pytest 套件（json5 零依赖，可本地运行）
upstream_check_command: "pytest tests/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: tests/
    source: json5-0.15.0/tests/*.py
    description: "pytest 套件：本地实测 75/75（100%），lib_test/host_test/tool_test 全过，零失败"
    command: "pytest tests/"

# test_package 消费者测试（R34 真实 API：import 打包的 json5 + 解析 JSON5 字符串）
test_package_tests:
  - file: test_json5.py
    description: "Imports packaged json5 and parses a JSON5 string (comment + trailing comma) that plain json cannot handle"
    command: "python3 test_json5.py"

# 断言总数：上游 75 + test_package 1 = 76
assertion_count: 76
