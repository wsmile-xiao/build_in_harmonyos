# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: json-parser/1.1.0
homepage: "https://github.com/udp/json-parser"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# json-parser 1.1.0 无 make check/ctest 目标；官方语料位于 tests/*.json
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（官方语料：tests/valid|invalid|ext-valid|ext-invalid-*.json）
upstream_tests:
  - file: tests/valid-0000.json .. valid-0012.json (13 个)
    source: json-parser-1.1.0/tests/
    description: "合法 JSON 必须解析成功（C 驱动 corpus_test 逐文件验证）"
    command: "corpus_test valid-*.json"
  - file: tests/invalid-0000.json .. invalid-0010.json (11 个)
    source: json-parser-1.1.0/tests/
    description: "非法 JSON 必须解析失败"
    command: "corpus_test invalid-*.json"
  - file: tests/ext-valid-0001.json .. ext-valid-0003.json (3 个)
    source: json-parser-1.1.0/tests/
    description: "扩展语料（含注释）需开启 json_enable_comments 后解析成功"
    command: "corpus_test ext-valid-*.json"
  - file: tests/ext-invalid-0001.json .. ext-invalid-0002.json (2 个)
    source: json-parser-1.1.0/tests/
    description: "扩展非法语料必须解析失败"
    command: "corpus_test ext-invalid-*.json"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：json_parse 解析合法 JSON 成功、非法 JSON 拒绝"
    command: "./test_json-parser"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 31