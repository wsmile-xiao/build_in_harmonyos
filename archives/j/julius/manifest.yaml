# 软件级 manifest — julius
# 遵循 ARCHIVE-SPEC v3.0

software: julius
display: "Julius"
description: "Caesar III（凯撒大帝3）的开源重制版 — 纯 C/SDL2 游戏"
category: gfx
homepage: "https://github.com/bvschaik/julius"
license: AGPL-3.0
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 CMake（cmake_minimum_required 3.1），无 autotools；OHOS 需 CMAKE_SYSTEM_NAME=Linux（E092）+ CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "上游用自带模块模式 FindSDL2.cmake/FindSDL2_mixer.cmake（module mode），需显式注入 SDL2_INCLUDE_DIR/SDL2_LIBRARY/SDL2_MIXER_INCLUDE_DIR/SDL2_MIXER_LIBRARY 四个 cache 变量（sdl2_mixer 2.8.1 配方同款做法）"
    - "无音频输入（音频仅为 SDL_mixer 输出）；上游测试用 stub 音视频，无需真实音频/显示设备"
    - "36 个 CTest 集成测试（autopilot savegame 语义比较，每用例=1 断言点）可在 OHOS 上真实运行，L1c 用 cmake.test() 集成到 build()"
    - "产物 bin/julius 需 llvm-objcopy 剥 .codesign 段 + binary-sign-tool sign -selfSign 1 自签，否则运行报 Operation not permitted"
    - "julius --help 退出码为 1（Linux 分支 parse 失败即 exit(1)），L2 smoke（--version/--help）会报非阻塞 warn"
  common_dependencies:
    - sdl2
    - sdl2_mixer

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.8.0":
    status: built
    build_date: "2026-08-26"
    conan_ref: "julius/1.8.0"
