# 版本级 manifest — julius 1.8.0
# 遵循 ARCHIVE-SPEC v3.0

version: "1.8.0"
software: "julius"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-26"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/bvschaik/julius/archive/refs/tags/v1.8.0.tar.gz"
  sha256: "e479e0b60074497b3e81b30749e040c423f493d469d630a774c06b3d61d91159"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - "sdl2/2.30.10"
    - "sdl2_mixer/2.8.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "julius 用自带模块模式 FindSDL2.cmake/FindSDL2_mixer.cmake（module mode），不走 CMakeDeps config，需在 generate() 显式注入 SDL2_INCLUDE_DIR/SDL2_LIBRARY/SDL2_MIXER_INCLUDE_DIR/SDL2_MIXER_LIBRARY cache 变量"
  - "36 个 CTest 集成测试（autopilot savegame 语义比较）在 OHOS/musl 上真实可跑，上游测试零修改"
  - "julius --help 退出码为 1（Linux 分支 parse 失败即 exit(1)），二进制验证用输出内容断言而非退出码"
  - "bin/julius 需剥 .codesign 段 + binary-sign-tool 自签才能运行"
