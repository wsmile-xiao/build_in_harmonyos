# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: julius/1.8.0
homepage: "https://github.com/bvschaik/julius"

# 上游测试命令 (用于 ctest -N 分析)
# 上游 CMake 项目在 TARGET_PLATFORM=default 时 enable_testing() + add_subdirectory(test)，
# 注册 36 个集成测试（test/CMakeLists.txt 中 36 条 add_integration_test）
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test()  # make test → ctest --output-on-failure"

# 上游实际运行的测试程序
# 36 个 CTest 集成测试：autopilot <input.sav> <output.sav> <expected.sav> <ticks>
# 模拟指定 tick 后写出 savegame 并与期望 savegame 语义比较，compare_files 非 0 即失败；
# 每用例 = 1 个可失败断言点，共 36 个
upstream_tests:
  - file: test/CMakeLists.txt
    source: julius-1.8.0/test/CMakeLists.txt
    description: "36 个集成测试（autopilot savegame 语义比较），上游 CI 口径 make test"
    command: "ctest --output-on-failure"
    count: 36

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 julius --help 断言输出含 Usage（容忍非 0 退出码）；运行非法参数 --definitely-invalid-option 断言被拒绝（E003）"
    command: "julius --help / julius --definitely-invalid-option"

# 测试断言总数
# 断言：julius 二进制存在（1）、--help 输出含 "Usage: julius"（1）、
#      非法参数退出码非 0（1）、非法参数输出含 "not recognized"（1）
assertion_count: 4
