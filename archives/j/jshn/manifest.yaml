software: jshn
# 软件级 manifest 模板
# 文件位置: archives/j/jshn/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: jshn

# 软件类别
# library | tool | application | system
category: tool

# 软件描述（一句话）
description: "JSON shell工具，用于在shell脚本中解析和处理JSON数据"

# ============================================================
# 版本索引（所有已归档版本）
# ============================================================

versions:
  master:
    status: built
    build_date: "2026-05-29"
    patches: 1
    packaging: 1
  2025.11.14:
    status: built
    build_date: "2026-05-29"
    patches: 1
    packaging: 1

# ============================================================
# 源码信息（通用）
# ============================================================

source:
  # 源码仓库URL（来自libubox项目）
  url: "https://git.openwrt.org/project/libubox.git"

  # 源码类型
  # git | tarball | archive
  type: git

  # 源码路径（jshn是libubox的组件）
  component_path: "jshn.c"

# ============================================================
# 依赖信息（通用）
# ============================================================

dependencies:
  - json-c
  - libubox

# ============================================================
# 构建系统（通用）
# ============================================================

build_system: cmake

# ============================================================
# 所属项目
# ============================================================

# jshn是libubox项目的组件
parent_project: libubox

# ============================================================
# 标签（用于搜索）
# ============================================================

tags:
  - json
  - shell
  - parser
  - openwrt
  - utility

# ============================================================
# 维护信息
# ============================================================

# 首次归档日期
first_archive_date: "2026-05-29"

# 最后更新日期
last_update_date: "2026-05-29"