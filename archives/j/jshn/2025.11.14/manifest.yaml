software: jshn
# 版本级 manifest 模板
# 文件位置: archives/j/jshn/2025.11.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2025.11.14"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（来自libubox项目）
  url: "https://git.openwrt.org/project/libubox.git"

  # 源码校验和（基于git commit）
  sha256: ""

  # Git commit hash（2025-11-14的提交）
  commit: "a75209f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

  # jshn是libubox的组件
  component_path: "jshn.c"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DBUILD_LUA=OFF"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DCMAKE_INSTALL_RPATH='$ORIGIN/../lib:$ORIGIN/../lib/external'"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=TRUE"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - json-c/0.16
    - libubox/2025.11.14

  # 编译器
  cc: clang
  cxx: clang++

  # 所属项目
  parent_project: libubox

  # Git commit日期
  commit_date: "2025-11-14"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（继承自libubox）
patches_applied:
  - "0001-CMakeLists.txt.patch"

# 补丁说明：解决cmake硬编码库路径问题，确保NEEDED字段使用相对路径

# ============================================================
# 包内容信息
# ============================================================

package_contents:
  # 主可执行文件
  executables:
    - jshn

  # 共享库
  libraries:
    - libblobmsg_json.so
    - libubox.so

  # 外部依赖
  external_dependencies:
    - libjson-c.so

  # 脚本文件
  scripts:
    - jshn.sh

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cmake硬编码库路径问题：使用JSONC_LIBRARIES而非find_library结果"
  - "patchelf用于设置RUNPATH，确保可移植性"
  - "jshn是libubox项目的组件，需从libubox预编译包提取"