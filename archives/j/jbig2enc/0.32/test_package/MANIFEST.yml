# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# ⚠️ 如实声明测试来源：上游 jbig2enc 0.32 有 1 个官方注册测试
# （src/meson.build:58 test("basic")——meson 冒烟测试，全树唯一注册目标；
# autotools 无 TESTS 注册、CMake 无 add_test，CI workflow 的测试步骤为
# 手工命令非注册目标）→ N=1 按注册口径申报，已等价真跑 PASS。
# 消费者测试为 OHOS 适配自研兜底（见下方 adapted_tests）。

package: jbig2enc/0.32
homepage: "https://github.com/agl/jbig2enc"

# 上游官方测试：1（src/meson.build:58 meson 注册 basic 冒烟测试，全树唯一注册目标）
upstream_official_tests:
  - file: src/meson.build:58 test('basic')
    source: jbig2enc-0.32/src/meson.build
    description: "meson 冒烟测试：jbig2 -s -a -v images/feyn.tif（symbol+auto-threshold 编码上游样例图）"
    command: "jbig2 -s -a -v images/feyn.tif"

# 上游测试命令（meson test 口径；autotools 路线以等价命令真跑，见 notes.md）
upstream_check_command: "meson test 'jbig2enc:'"
upstream_test_in_build: false
upstream_test_command: "jbig2 -s -a -v images/feyn.tif（等价真跑 PASS：exit 0 + 74057 字节 \x97JB2）"

# 适配补全测试（自研消费者测试，非上游）：驱动包内 jbig2 CLI 真实编码
adapted_tests:
  - file: test_package/conanfile.py（test() 驱动）
    origin: ohos-adaptation (self-authored consumer test)
    description: "消费者编码测试：jbig2 generic 模式编码合成 PNG 断言 JB2 魔数+非空（\\x97JB2）"
    command: "jbig2 test_input.png > out_generic.jbig2"
  - file: test_package/conanfile.py（test() 驱动）
    origin: ohos-adaptation (self-authored consumer test)
    description: "消费者编码测试：jbig2 -s -p symbol 模式编码，断言 output.jbig2 JB2 魔数 + output.sym 符号表非空"
    command: "jbig2 -s -p test_input.png"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "驱动包内 bin/jbig2 对合成 64x64 二值 PNG 做两种模式真实编码，断言 JB2 魔数 + 输出非空 + 符号表非空（3 组断言）"
    command: "conan create（test_package 自动执行）"

# 测试断言总数（消费者测试 3 组断言 + 上游 basic 等价真跑魔数/字节断言）
assertion_count: 5
upstream_basic_test_result: "PASS（2026-09-24 等价真跑：jbig2 -s -a -v images/feyn.tif exit 0，74057 字节 \x97JB2 魔数验证；autotools CI 链 topdf 84469 字节 %PDF-1.4）"
