# manifest.yaml — jbig2enc 0.32

# ============================================================
# 必须字段
# ============================================================

version: "0.32"
software: "jbig2enc"
status: built
build_date: "2026-09-23"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/agl/jbig2enc/archive/refs/tags/0.32.tar.gz"
  sha256: "5b3b1c48617e5b1608f916a78038ea867a2c9eb20c2ff34a78a48a243f655c2a"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--host=aarch64-unknown-linux-ohos"
    - "--build=aarch64-unknown-linux-ohos"
  dependencies:
    - name: leptonica
      version: 1.85.0
      required: true
    - name: automake
      version: 1.18
      required: true
      note: "tool_requires（git archive 无 configure，autoreconf 自举）"
    - name: libtool
      version: 2.5.4
      required: true
      note: "tool_requires（libtoolize 提供 ltmain.sh）"
    - name: pkgconf
      version: 3.0.5
      required: true
      note: "tool_requires（pkg.m4 提供 PKG_CHECK_MODULES 宏 + pkgconf 可执行文件）"
  cc: clang
  cxx: clang++

# ============================================================
# 测试结果（R37: total 必填）
# ============================================================

test_results:
  type: manual
  total: 1
  passed: 1
  failed: 0
  skipped: 0
  upstream_test_note: "上游唯一注册测试：src/meson.build:58 test('basic', jbig2, args=['-s','-a','-v','images/feyn.tif'])——meson 构建系统冒烟测试（autotools 无 TESTS 注册、CMake 无 add_test，CI workflow 测试步骤为手工命令非注册目标）。等价真跑 PASS：jbig2 -s -a -v images/feyn.tif exit 0 输出 74057 字节有效 JB2 流（\\x97JB2 魔数验证）；autotools CI 测试链同真跑 jbig2 -a -p -v feyn.tif + jbig2topdf.py → 84469 字节有效 PDF（%PDF-1.4）"
  consumer_test: "test_package 消费者测试 3/3 PASS：jbig2 CLI 对合成 64x64 二值 PNG 双模式真实编码——generic 模式输出 \\x97JB2 魔数流非空 + symbol 模式 output.sym/output.0000 均非空"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
patch_note: "无补丁文件。umask 077→022 修复在 conanfile.py build() 里对 autoreconf 生成的 configure 做运行时文本替换（automake 1.17/1.18 生成的 configure 行号有漂移，补丁 hunk 会 miss；abiword-plugin-clarisworks _drop_umask_077 同款）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "git archive 源码包 autoreconf 自举三件套 tool_requires：automake+libtool+pkgconf（pkg.m4 是 PKG_CHECK_MODULES 宏来源，CI 预检容器只有 autoconf 套件）"
  - "autotools 项目消费 conan 依赖的三生成器组合：PkgConfigDeps（PKG_CHECK_MODULES 命中）+ AutotoolsDeps（AC_CHECK_LIB 命中）+ AutotoolsToolchain（交叉 triplet）"
  - "交叉编译 configure 探针运行失败（cannot run C compiled programs）的解法：从 LDFLAGS 的 -L 集合回填 LD_LIBRARY_PATH（conftest 链接了依赖 .so）"
  - "configure 生成文件 umask 077 在 HMDFS 产生 drwx--S--- 不可写目录（E011/E114 类，liburcu/coinutils 同款），运行时文本替换修复（补丁会因 automake 版本行号漂移 miss）"
  - "上游 0.32 config.guess（timestamp 2023-08-22）原生识别 HarmonyOS → aarch64-unknown-linux-ohos，config.sub 原生接受，无需 E007/E072 补丁"

# ============================================================
# 补丁分类
# ============================================================

patch_classification: []
