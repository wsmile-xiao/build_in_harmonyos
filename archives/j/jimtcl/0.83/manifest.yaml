# jimtcl 0.83 — 版本级 manifest
# 文件位置: archives/j/jimtcl/0.83/manifest.yaml（ARCHIVE-SPEC）

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.83"

# 软件名
software: "jimtcl"

# 编译状态：published | built | failed | archived
# 按 AGENTS O5：合并 + release upload 确认前一律 built
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方下载渠道（官方站 jim.tcl-lang.org/download 指向本仓库；设备 curl+urllib 双路取数）
  url: "https://github.com/msteveb/jimtcl/archive/refs/tags/0.83.tar.gz"

  # 源码校验和（双面核：curl 与 urllib 独立下载 sha256 一致）
  sha256: "6f2df00009f5ac4ad654c1ae1d2f8ed18191de38d1f5a88a54ea99cc16936686"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游为 autosetup，兼容 autotools 调用面）
  system: autotools

  # 无额外 configure 开关（固定静态发行，package_type=static-library）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-autosetup-config-guess-harmonyos.patch"
  - "0002-autosetup-config-sub-ohos.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autosetup 系（jimtcl）configure 三连错的 OHOS 修法：CC_FOR_BUILD 自举 jimsh0 + config.guess 注入 HarmonyOS 分支 + config.sub 接受 ohos"  # knowledge_ref: E723
  - "Conan AutotoolsToolchain 注入的 --oldincludedir/--datarootdir/--enable-static 不在 autosetup 兼容选项表，须在 generate() 剔除"  # knowledge_ref: E723
  - "上游 tcltest 套件 skip 归因口径：tcl 约束在 jimsh 下恒 0、aarch64 小端 bigEndian 恒 0，属上游设计跳过"  # knowledge_ref: E723
