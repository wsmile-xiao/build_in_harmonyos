# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
# 数字来源：reports/test-report.md；证据 = 采信轮 reports/conan-create.log + 预检轮 create-5.log

package: jimtcl/0.83
homepage: "https://jim.tcl-lang.org/"

# 上游测试命令（make check 是 make test 的别名，Makefile.in:142）
upstream_check_command: "make check"

# conanfile.py build() 已集成上游测试（层1，失败不阻断构建、真实统计不改写）
upstream_test_in_build: true
upstream_test_command: "make -j1 check   # build() 内 self.run(cwd=build_folder, ignore_errors=True)"

# 上游实际运行的测试程序（tcltest 套件，94 个 *.test 由 tests/runall.tcl 遍历）
upstream_tests:
  - file: tests/runall.tcl
    source: jimtcl-0.83/tests/runall.tcl
    description: "tcltest 驱动器：遍历 tests/*.test，汇总 Total/Passed/Skipped/Failed"
    command: "make -j1 check"
  - file: tests/*.test
    source: jimtcl-0.83/tests/
    description: "94 个 tcltest 用例文件；声明 N=5753（运行期 90 文件计数 5717 + 整文件未进计数 36）"
    command: "make -j1 check"

# 上游套件运行结论（真实通过率，环境类失败逐条豁免依据 TEST_QUALITY_SPEC §3.3）
upstream_test_run:
  status: "passed_with_env_failures"
  reason: "tcltest 套件实际执行：N=5753，PASS=5527、FAIL=20（+interactive.test 文件级错误 1，计入日志 Failed 21）、SKIP=170、NOT_RUN=36；全部非 PASS 为 OHOS 环境类（musl 无 ualarm、无 tty、HMDFS 禁硬链接、/tmp 只读、无 id 命令、SELinux 禁 AF_UNIX bind、libc 差异、信号处置差异；SKIP 为上游自身 constraints 设计跳过）"
  evidence: "reports/conan-create.log（采信轮 clean 轮）Totals 行 = Total 5717 Passed 5527 Skipped 170 Failed 21；预检轮 create-5.log:540 同值；逐项归因与命令见 reports/test-report.md §4"

# test_package 中自带的测试（消费者视角验证，不进上游分母）
test_package_tests:
  - file: test.c
    description: "C 嵌入式消费者：链接 libjim.a + conan zlib，7 项断言（版本/expr/list/dict/string/regexp/zlib 往返）"
    command: "./test_jimtcl"
  - file: test.tcl
    description: "打包 jimsh 消费者：5 项断言（版本/expr/string/dict/zlib 往返）"
    command: "<package>/bin/jimsh test.tcl"

# 测试断言总数（消费者断言口径）
assertion_count: 12
