# 版本级 manifest
# j4-dmenu 3.2

version: "3.2"
software: "j4-dmenu"
status: built
build_date: "2026-09-25"
build_system: cmake

# 顶层 upstream_url：供 PR 正文生成器（submission.py _generate_pr_body）取用。
# conandata.yml 的 sources.url 是「镜像 + 官方」列表，其 url: 无标量值，
# 生成器取不到，需在此以标量形式提供官方地址。
upstream_url: "https://github.com/enkore/j4-dmenu-desktop"

source:
  url: "https://github.com/enkore/j4-dmenu-desktop/archive/refs/tags/r3.2.tar.gz"
  sha256: "99e2f394570f8fb0b1a2cde2926980fd9685ce60e1500b575057f8424c9ad555"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DNO_DOWNLOAD=ON"
    - "-DWITH_TESTS=ON"
    - "-DOVERRIDE_VERSION=3.2"
  dependencies:
    - spdlog/1.17.0
    - fmt/12.2.0
    - catch2/3.16.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "spdlog 制品的 cpp_info.includedirs 含 include/spdlog，会让 `#include <fmt/ranges.h>` 解析到 spdlog 自带的 shim（spdlog/fmt/ranges.h）；该 shim 有 #pragma once，反过来吞掉真正的 fmt 头，导致 fmt::join 未声明。需在 generate() 中把 spdlog 的 includedirs 覆盖为仅 include/。"  # knowledge_ref: E639
  - "上游 CMakeLists.txt 默认用 FetchContent 从 GitHub 拉 spdlog/fmt/Catch2；NO_DOWNLOAD=ON 会让其全部退化为 find_package()，从而接上 conan 提供的包。"  # reference: E342
  - "CMakeDeps 生成的 Catch2Config.cmake 不把 Catch2 的 CMake 模块目录加入 CMAKE_MODULE_PATH，上游 `include(Catch)` 会失败；需在 generate() 中把 <catch2包目录>/lib/cmake/Catch2 显式写入 CMAKE_MODULE_PATH。"  # knowledge_ref: E620
  - "catch_discover_tests 会在构建期直接执行测试二进制，因此依赖必须静态链接（default_options 中 spdlog/*:shared=False、fmt/*:shared=False）；用 per-edge options 设置会被 spdlog 传递的 fmt 值压过并产生 options conflicts 警告。"  # reference: E620
  - "CMake.test() 的 cli_args 是传给构建工具而非 ctest 的，会报 `Unknown argument --output-on-failure`；应直接 self.run('ctest --test-dir ... --output-on-failure -E pytest')。"  # knowledge_ref: E301
  - "上游 79 个 CTest 用例中 pytest-system-tests 需要真实 dmenu/X 会话，跨环境不可运行，用 -E pytest 排除。"  # reference: E292

knowledge_ref:
  - "knowledge/drafts/E620-draft-693C.kv"
  - "knowledge/drafts/E639-draft-2264.kv"
  - "knowledge/graph/E301.kv"
  - "knowledge/graph/E342.kv"
  - "knowledge/graph/E292.kv"

# 上游测试（Catch2 单元测试，经 CTest 注册；统计单位=CTest 用例）
# 取数命令：ctest --test-dir <build> --output-on-failure -j8 --timeout 60 -E pytest
# 汇总行 "100% tests passed, 0 tests failed out of 79"（详见 reports/test-report.md）
upstream_tests:
  command: "ctest --test-dir <build_folder> --output-on-failure -j8 --timeout 60 -E pytest（上游 j4-dmenu-tests，Catch2 单元测试；-E pytest 排除需真实 dmenu/X 会话的 system_tests）"
  test_count: 79
  passed: 73
  skipped: 6
  failed: 0
  notes: "上游 tests/ 由 catch_discover_tests 在构建期注册 79 个 CTest 用例；本机 HarmonyOS aarch64 直接执行（OHOS 产物可本机运行），结果为 100% tests passed、0 tests failed out of 79，Total Test time 1.00 sec。口径：其中 6 个用例被上游 SKIP() 守卫跳过（#11/#24/#42/#48/#55/#58），实际执行并通过的是 73 个；跳过原因是上游把临时目录硬编码为 /tmp（tests/FSUtils.cc:157、tests/TestI3Exec.cc:106），而本机 /tmp 为只读 erofs 挂载，mkdtemp 必然失败——属环境限制，非上游缺陷、非适配引入，在可写 /tmp 的环境可正常执行。上游测试源静态计数另有 258 处断言宏（REQUIRE 系）。取数命令与逐条跳过原因见 reports/test-report.md。"

test_package:
  assertion_count: 5
  description: "test_package 以 bash 包裹安装后的可执行程序做冒烟测试：`j4-dmenu-desktop --version` 输出须为 3.2（1 项断言）、`--help` 退出码 0（1 项）、`--help` 输出须列出 `--dmenu`（1 项），另完成二进制可执行性与产物存在性检查（2 项）。"
