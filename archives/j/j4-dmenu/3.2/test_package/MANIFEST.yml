# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "可执行程序冒烟测试：--version 报 3.2、--help 退出 0 且列出 --dmenu"
    command: "j4-dmenu-desktop --version && j4-dmenu-desktop --help"
  - file: test_e2e.sh
    description: >
      完整消费者用例（端到端）：构造隔离 XDG 桌面环境 + 伪 dmenu（复刻真实 dmenu 的
      stdin/stdout 协议），驱动被测二进制走完整链路——扫描 .desktop → 解析 → 过滤 →
      生成候选列表 → 呈现给 dmenu → 收回用户选择 → 组装命令行 → fork/execvp 启动
      目标程序，并用"目标程序是否真被启动、收到什么参数"验证结果（非仅看退出码）。
      含 C1 基础全链路 / C2 NoDisplay 过滤 / C3 XDG DE 过滤(-x) / C4 自定义输入直通 /
      C5 非 ASCII 中文条目 / C6 --usage-log 历史排序 / C7 --wrapper 链路 /
      C0 无头约束 / C8 --no-exec 干跑，共 9 个用例、14 条断言。
    command: "test_e2e.sh <pkg>/bin/j4-dmenu-desktop"
  - file: test_ohos.sh
    description: >
      鸿蒙（OpenHarmony PC / HarmonyOS PC, aarch64）平台特有测试：ELF64 + AArch64 +
      PIE(DYN)、musl 加载器 /lib/ld-musl-aarch64.so.1、$ORIGIN 可重定位 RUNPATH、
      动态依赖无 glibc 专有库、OHOS 专有节 .note.ohos.ident 与 .codesign、无 TEXTREL、
      /system/bin/sh(mksh) 与 bash 双 shell 可执行、只读 /tmp 下 Terminal=true 优雅报错、
      无 dmenu 时优雅退出、无 DISPLAY 无头可运行、免 LD_LIBRARY_PATH、产物完备
      （bin + man + bash/zsh/fish 补全），共 16 条断言。
    command: "test_ohos.sh <pkg>/bin/j4-dmenu-desktop"

# 测试断言宏总数（源码静态计数：REQUIRE 228 + REQUIRE_FALSE 16 + REQUIRE_NOTHROW 8 + REQUIRE_THROWS 6；另有 21 处 SECTION）
assertion_count: 258
