# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: j4-dmenu/3.2
homepage: "https://github.com/enkore/j4-dmenu-desktop"

# 上游测试命令：上游用 CMake/CTest，单元测试基于 Catch2。
upstream_check_command: "cmake --build build && ctest --test-dir build"

# conanfile.py 的 build() 已集成上游 CTest（仅 Catch2 单元测试；
# pytest 系统测试需要真实 dmenu/X 会话，用 -E pytest 排除）。
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -E pytest"

# 上游实际运行的测试程序（17 个 Catch2 测试源，79 个 TEST_CASE，258 处断言宏；
# CTest 实测：73 通过 / 6 跳过 / 0 失败，跳过原因见 reports/test-report.md）
upstream_tests:
  - file: tests/TestApplication.cc
    source: j4-dmenu-desktop-r3.2/tests/TestApplication.cc
    description: "Application 桌面项解析与去重"
    command: "j4-dmenu-tests"
