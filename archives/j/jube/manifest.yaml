software: jube
display: "JUBE (Jülich Benchmarking Environment)"
description: "Script-based benchmarking and workflow environment (XML/YAML benchmark sets, run & evaluate on different systems)"
category: tool
homepage: "https://www.fz-juelich.de/jsc/jube"
license: GPL-3.0
build_system: custom

ohos_adaptation:
  key_points:
    - "Pure Python 3 noarch (packages jube / jube.result_types / jube.util), no C extension; installed under lib/pythonX.Y/site-packages (pip --prefix staging, alabaster precedent)."
    - "CLI scripts bin/jube and bin/jube-autorun bundled under package bin/; JUBE_BENCHMARK_OUTPATH/JUBE_VERBOSE env supported."
    - "Runtime dependency: pyyaml (install_requires) for YAML-based benchmark inputs; xml-based inputs work without it. grp/pwd/sqlite3 come from the POSIX Python stdlib (present on OHOS)."
    - "Upstream 102-case Python unittest suite (tests/, run_all_tests.py) run in build() on OHOS; test_package re-verifies jube --version + a minimal XML benchmark end-to-end."
  common_dependencies:
    - pyyaml

versions:
  "2.7.1":
    status: built
    build_date: "2026-09-30"
    path: archives/j/jube/2.7.1
