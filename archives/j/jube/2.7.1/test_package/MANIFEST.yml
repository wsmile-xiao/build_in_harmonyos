# test_package MANIFEST - jube 2.7.1 (pure-Python benchmark/workflow runner)
# R34 anti-stub: the consumer test drives the packaged jube CLI and imports the
# packaged API (test_jube.py), invoked via Conan self.run(env='conanrun').

package: jube/2.7.1
homepage: "https://www.fz-juelich.de/jsc/jube"

# Upstream tests: Python unittest suite under tests/, aggregated by
# tests/run_all_tests.py; run in build() for real on OHOS.
upstream_test_in_build: true
upstream_test_command: "python3 run_all_tests.py (PYTHONPATH=<repo_root>)"
upstream_tests_exist: true

# test_package consumer tests (real CLI + API checks, 7 checkpoints)
test_package_tests:
  - file: test_jube.py
    description: "import jube; JUBE_VERSION==2.7.1; jube --version rc==0 & contains 2.7.1; packaged hello_world XML benchmark end-to-end (rc==0, done file, no error file)"
    command: "python3 test_jube.py <pkg> <site-packages> <bin>"

# Upstream registered test total, official unit = unittest 'test' cases as
# discovered at runtime by run_all_tests.py (Ran N tests). Count method:
# python_def (deterministic unittest discovery count, from the real-device run
# "Ran 102 tests in ..."); actual pass/fail come from build() on the real device.
upstream_test_total: 102
upstream_test_count_method: python_def
