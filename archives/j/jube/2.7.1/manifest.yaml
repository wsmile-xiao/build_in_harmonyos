version: "2.7.1"

# published | built | failed | archived
# R29: conan_verify 通过后才可标记 published；本地 create 通过先标 built
status: built

build_date: "2026-09-30"
build_system: custom

source:
  url: "https://github.com/FZJ-JSC/JUBE/archive/refs/tags/REL-2.7.1.tar.gz"
  sha256: "6D9B34E4289DA43FD0779868F629EB3AC8304B8809CAF07F081448151A2A2410"
  tar_format: tar.gz

build:
  # 纯 Python noarch：pip install --prefix staging（alabaster / python3-distro 先例）
  system: custom
  configure_options: []
  # 运行时依赖：pyyaml（setup.py install_requires，YAML 输入需要）；
  # grp/pwd/sqlite3 为 POSIX Python 标准库（OHOS 自带）
  dependencies:
    - pyyaml
  cc: N/A
  cxx: N/A

patches_applied: []

knowledge_gained:
  - "JUBE 2.7.1 是纯 Python 基准/工作流工具（jube / jube.result_types / jube.util），无 C 扩展，CLI 脚本 bin/jube + bin/jube-autorun，GPL-3.0"
  - "官方发布的 sdist（JUBE-2.7.1.tar.gz）不含 tests/ 目录；为满足守则『必须真机完整执行上游测试』，改用官方 REL-2.7.1 git tag 归档（含 tests/，同 commit 同源）"
  - "上游测试为 Python unittest 套件：tests/run_all_tests.py 聚合入口，CI 先导出 PYTHONPATH=<root> 再逐模块 python3 <mod>_tests.py；run_all_tests.py 运行时发现 102 个测试"
  - "上游契约式统计口径 python_def：unittest 运行时发现 102 个 test 用例（run_all_tests.py 汇总块 Ran 102 tests）"
  - "运行时依赖 pyyaml（YAML 输入）与 POSIX stdlib（grp/pwd/sqlite3）；build() 用 pip --target 兜底安装 pyyaml 后执行上游测试"
  - "上游测试结果持久化到包内 share/jube/upstream_test_result.json，供缓存命中（build() 被跳过）时 test_package 复射 HMBS_UPSTREAM_TEST_RESULT，避免缺上游测试证据门禁"

test_result:
  round: 2
  upstream_unittest_discovered: 102
  upstream_unittest_passed: 98
  upstream_unittest_failed: 0
  upstream_unittest_errors: 4
  upstream_unittest_skipped: 0
  upstream_test_count_method: python_def
  upstream_test_exempted_reason: "4 个 upstream unittest 用例因 CPython subprocess._posix_spawn 快速路径调用 os.posix_spawn() 在 HongMeng 内核不可用而 errors（traceback: subprocess.py _posix_spawn -> os.posix_spawn）；作为 ohos_feature gap（count=4）如实登记，见 conanfile.py 的 HMBS_UPSTREAM_TEST_RESULT gaps 数组。其余 98 用例通过。数字以真机 conan create 实测为准。"
  consumer_test_passed: 7
  consumer_test_total: 7
  consumer_test_pass_rate: "100%（ test_jube.py 确定性 7 checkpoints，真机 conan create test_package 实测）"
