package: jnoisemeter/0.4.1
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"

upstream_check_command: "make -C source check"
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  The jnoisemeter-0.4.1 tarball ships AUTHORS, COPYING, README, docs/ and
  source/. The source/Makefile declares exactly four user-facing targets -
  the default goal jnoisemeter, install, uninstall and clean - and there is no
  test or check target anywhere in the tree and no test directory, so
  `make -C source check` fails with "make: *** No rule to make target
  'check'. Stop.". The tool is exercised instead by the packaged consumer-side
  smoke test below.

test_package_tests:
  - file: test_jnoisemeter.sh
    description: >-
      Runs the packaged GUI tool against the staged runtime shared-library
      closure. `jnoisemeter -h` must print the upstream "jnoisemeter-0.4.1"
      version banner (which also proves -DVERSION survived the Makefile
      patch), and a bare invocation with DISPLAY removed must return 1 - the
      upstream "Can't open display." path - rather than 127, the dynamic
      loader signature for an unresolved NEEDED library. On OHOS the closure
      is copied into a runtime directory and ELF-signed, mirroring the
      aliki/clxclient OHOS pattern.
    command: "test_jnoisemeter.sh"

test_case_count: 2
assertion_count: 3
