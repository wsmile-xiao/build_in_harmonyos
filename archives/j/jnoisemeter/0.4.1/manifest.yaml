# 编译中学到的知识
knowledge_gained:
- "DRAFT-jnoisemeter-0.4.1-makefile-invented-append-slot（同 stem .kv/.md 成对，见仓库根 knowledge/drafts/）：裸 Makefile 没有可追加的 include 落点时，把宿主 pkgconf 探测行的右值换成一个只被引用、从未被赋值的变量（本包 PCONFCFL），配方在命令行给它赋值即可注入依赖包 -I；knowledge_ref: archives/j/jnoisemeter/0.4.1/notes.md:47"
- "上游 CPPFLAGS 全靠 += 累积：命令行整体覆盖 CPPFLAGS 会连同 -MMD -MP 与 -DVERSION 一起吃掉（make -n 实测；VERSION 被 jnoisemeter.cc:50 与 mainwin.cc:55 引用）；knowledge_ref: archives/j/jnoisemeter/0.4.1/notes.md:39"
- "上游零测试：source/Makefile 52 行、只有 jnoisemeter/install/uninstall/clean 四目标（第 35/41/46/50 行），make check 报 No rule to make target 'check'；适配后 test_package 2 例 3 断言真跑，W3 侧 L1_RESULT=pass、L2_RESULT=skip；knowledge_ref: archives/j/jnoisemeter/0.4.1/notes.md:68"
