software: jnoisemeter
display: "jnoisemeter"
description: "JNoiseMeter — X11/JACK 实时噪声与频谱电平表（Fons Adriaensen linuxaudio 套件）"
category: applications
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"
license: "GPL-2.0-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游只有 source/Makefile（52 行、无 configure/CMake/meson），目标只有 jnoisemeter / install / uninstall / clean 四个（Makefile 第 35/41/46/50 行）；上游测试分母为 0，`make check` 报 No rule to make target 'check'。"
    - "宿主探测 CPPFLAGS += $(shell pkgconf --cflags freetype2)（原第 26 行）改为 CPPFLAGS += $(PCONFCFL)：该变量全文件只被引用、从未被赋值，配方在命令行给它赋值注入依赖包 -I，从而保住上游 CPPFLAGS += 的 -MMD -MP -DVERSION（命令行整体覆盖 CPPFLAGS 会把这些一起吃掉，make -n 实测）。路径 B 草稿 DRAFT-jnoisemeter-0.4.1-makefile-invented-append-slot。"
    - "删除 CXXFLAGS += -march=native（原第 28 行）：clang 15 在 AArch64 不支持，且按构建机调优的二进制不得进包；编译器与 flags 全部交给 profile（R33）。"
    - "install 目标两处裸 install 改为 $(INSTALL)，并引入 INSTALL ?= /bin/install：OHOS 用户态无 coreutils install。"
    - "运行时需 X display 与 jackd，CI 二者皆无 ⇒ test_package 以「加载完整共享库闭包并到达上游正常提前退出路径」为通过标准：2 例 / 3 断言真跑并 PASS；W3 侧对应读数为 L1_RESULT=pass: test_package executed，L2_RESULT=skip（上游无 --version/--help，按 skip 记录，不计通过）。"
    - "直接依赖 clxclient/3.9.2、clthreads/2.4.0、libxft/2.3.8、libx11/1.8.13、xorgproto/2025.1、jack/1.9.22，传递闭包另带 freetype/2.14.3、fontconfig/2.18.3、libxrender/0.9.12、libxcb/1.17.0、libxau/1.0.11、libxdmcp/1.1.5、libxml2/2.15.3，全部已在 ohpcd 远端发布（conan install --build=never 全闭包 rc=0）。"
  common_dependencies:
    - clxclient
    - clthreads
    - libxft
    - libx11
    - xorgproto
    - jack

versions:
  "0.4.1":
    status: built
    build_date: "2026-09-26"
