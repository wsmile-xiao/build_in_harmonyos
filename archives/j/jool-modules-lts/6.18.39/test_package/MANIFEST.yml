# ── 上游测试入口 ──
# 上游没有 make check / ctest 目标：test/ 下的 36 个 shell 脚本即全部用例
# （17 个内核态单元测试工程、graybox netns 报文注入套件、jool-regression
# 多内核回归脚手架、nl-fragmentation netlink 分片脚本、compilation_test
# 内核树编译脚本、client-test.sh 交互式 CLI 冒烟）。
upstream_check_command: "find test -name '*.sh' -exec bash {} \\;（36 个脚本，无统一 runner）"
upstream_test_in_build: false
upstream_test_command: ""

# ── 上游用例总数（实测口径 = test/ 下 .sh 文件数；与管理员实测 N=36 一致）──
upstream_test_count: 36
upstream_test_count_command: "find test -name '*.sh' | wc -l   # = 36"

# ── 在 CI 中真实执行的上游用例 ──
# 36 个脚本的被测对象全部是 Linux 内核模块（Kbuild obj-m + DKMS）：17 个单元
# 测试工程编译为 .ko 后 sudo insmod + sudo dmesg；graybox 套件 insmod 自带
# graybox.ko 并在 netns 内注入报文；regression/fragmentation/compilation 系列
# 需要 modprobe、root、预编译 Linux 内核树或 GRUB 多内核启动。OHOS 用户态沙箱
# （USER=100，无内核构建树）不满足任何一项前置——这是上游用例形态（被测对象
# 为内核态组件），非缺依赖/非环境配置问题。
# 其中 2 个脚本的首语句是非 root 门禁，可安全真实执行并以预期方式阻塞：
upstream_test_executed: 2
upstream_test_executed_command: >-
  bash <pkg>/share/jool-modules-lts/upstream/test/client-test.sh → 退出码 1 +
  "Please start the script as root or sudo."（root 门禁，预期阻塞）；
  bash <pkg>/share/jool-modules-lts/upstream/test/graybox/test-suite/run.sh → 同上
  （OHOS 环境注记：worker 系统 toybox id 对超界 uid 2002010133 报 "bad uid"
  无数值输出，run.sh 未加引号的 [ $(id -u) != 0 ] 门禁会退化失效；故审计脚本
  在 PATH 前列放置仅实现 id -u 的 shim（bash EUID = geteuid 直读，恒真值），
  门禁决策仍是 run.sh 自身真实判断，断言语义不变，详见
  reports/upstream-test-evidence.md 第 3 节）
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_blocked: 34
upstream_test_unexecuted_reason: >-
  34 个未执行用例逐条经 fail-closed 前置审计（test_upstream_block_preconditions.sh
  对每个脚本验证其源码仍命中阻塞模式串；若上游形态变为用户态可执行则审计立即失败）：
  17 个内核态单元测试（.ko + sudo insmod/dmesg）、graybox netns 报文注入套件
  （insmod graybox.ko + ip netns）、jool-regression（sudo make install / GRUB
  多内核 / 上游 git 仓库）、nl-fragmentation（sudo modprobe + 交互确认）、
  compilation_test（预编译 Linux 内核树）、1 个非测试自举脚本（autoreconf --install）。
  逐脚本模式串与原因见 upstream-block-map.tsv 与
  reports/upstream-test-evidence.md。

