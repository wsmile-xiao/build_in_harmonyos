  required:
    - libnl/3.11.0
    - argp-standalone/1.5.0
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: >-
    package_type=application（bin 交付三件套，需配套 commands.json，R38）。
    build() = autoreconf 自举（codeload tarball 无 configure；tool_requires
    automake/1.18 + libtool/2.5.4）→ E114 修补生成的 configure（ac_tmp 重定向 +
    umask 077→022）→ configure（--with-xtables=no --with-bash-completion-dir=no
    --build/--host=aarch64-linux；CPPFLAGS 注入 -D_UAPI_LINUX_SOCKET_H
    -D__kernel_sa_family_t=ushort 即 E119 处置 + argp 头路径；LDFLAGS 注入 argp
    库路径；PKG_CONFIG_PATH 指向 PkgConfigDeps 产物）→ make -j1（E074）。
    package() = bin/{jool,jool_siit,joold} + 手册页 man8 ×3 + COPYING +
    上游源码快照（share/jool-modules-lts/upstream = 任务指定 tarball 原样再解压，
    零构建产物）。内核模块（Kbuild obj-m + DKMS）在 OHOS 侧无法构建：无内核
    构建树、无 root → 源码随包交付 + fail-closed 契约测试，不伪造内核态通过。

