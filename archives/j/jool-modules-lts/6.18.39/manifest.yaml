# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Linux 内核模块类任务在 OHOS 用户态 conan 框架内的可交付边界（同 lenovolegionlinux 0.0.20 先例）：内核源码以 fail-closed 契约对象随包交付，.ko 不可构建/加载，必须在 PR 与 manifest 中分层声明"
  - "「上游测试 0 通过」的合规表达：0/36 + 上游用例形态归因 + fail-closed 前置审计 + 带非 root 门禁脚本的真实执行证据（比静态理由表更强的机器可验证阻塞证据）"
  - "Jool 类 netlink 客户端的 E119 处置（-D_UAPI_LINUX_SOCKET_H -D__kernel_sa_family_t=ushort）对 libnl 下游消费者通用；configure 的 PKG_CHECK_MODULES 经 PkgConfigDeps + PKG_CONFIG_PATH 注入解析（abiword-plugin-eml 先例）"
  - "codeload tarball 无 configure 的 autotools 自举配方模板：tool_requires automake+libtool → autoreconf → E114 修补 → configure → make -j1（argp-standalone / abiword-plugin-eml 先例合成）"
  - "OHOS CI worker 超界 uid（2002010133）致系统 toybox `id -u` 报 bad uid 且无数值输出：含 `$(id -u)` 门禁的上游脚本会退化失效（unquoted [ != 0 ] → 越过门禁）。通用修法：测试脚本 root 自检用 bash 内建 EUID（geteuid 直读恒真值）；须真实执行上游脚本时在 PATH 前列放仅实现 id -u 的 EUID shim——门禁决策仍是上游脚本的真实判断，断言语义不变（CI #56279 实证）"

references:
  - https://github.com/NICMx/Jool
