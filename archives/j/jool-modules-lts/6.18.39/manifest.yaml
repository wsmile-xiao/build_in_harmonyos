# ============================================================
# 依赖信息
# ============================================================

dependencies:
  # configure.ac: PKG_CHECK_MODULES(LIBNLGENL3, libnl-genl-3.0 >= 3.2.22)（强制）
  #               AC_CHECK_LIB([argp], [argp_parse])（强制；OHOS musl 无 argp）
