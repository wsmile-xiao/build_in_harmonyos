software: jnettop
display: "jnettop"
description: "Network traffic monitoring tool with ncurses UI - displays real-time bandwidth usage"
category: network
homepage: "https://sourceforge.net/projects/jnettop/"
license: GPL-2.0+
build_system: autotools

# OHOS 适配要点（跨版本通用）
ohos_adaptation:
  key_points:
    - "需要手动编译libpcap（预编译包与musl libc不兼容）"
    - "libpcap需要添加平台适配补丁（sockaddr_storage重复定义）"
    - "需要在~/tmp目录编译（HMDFS临时文件限制）"
    - "运行时需要设置LD_LIBRARY_PATH=$HOME/usr/local/lib"
  common_dependencies:
    - libpcap
    - ncurses
    - glib-2.0
  known_issues:
    - "HMDFS文件系统限制导致configure无法在默认目录创建临时文件"
    - "Alpine musl预编译的libpcap.a缺少ether_hostton符号"

# 版本索引
versions:
  "0.13.0":
    status: published
    build_date: "2026-06-12"
    published_as: jnettop