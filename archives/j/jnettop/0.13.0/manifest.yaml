software: jnettop
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.13.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.13.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/jnettop/jnettop/0.13/jnettop-0.13.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 环境变量设置：
  # PKG_CONFIG_PATH=$HOME/usr/local/lib/pkgconfig
  # CFLAGS=-I$HOME/usr/local/include
  # LDFLAGS=-L$HOME/usr/local/lib
  # LD_LIBRARY_PATH=$HOME/usr/local/lib

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libpcap/1.10.5"
    - "ncurses/6.4"
    - "glib-2.0/2.88.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure-umask.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS限制：需要在~/tmp目录编译（autotools的mktemp失败）"
  - "libpcap预编译包不兼容：Alpine musl版本缺少ether_hostton符号"
  - "libpcap需要手动编译并添加平台适配补丁（sockaddr_storage重复定义）"
  - "configure需要修改umask: sed -i 's/umask 077/umask 022/g' configure"
  - "运行时需要设置LD_LIBRARY_PATH=$HOME/usr/local/lib"
ure"
  - "运行时需要设置LD_LIBRARY_PATH=$HOME/usr/local/lib"
