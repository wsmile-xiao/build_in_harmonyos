# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: juce/8.0.5
homepage: https://juce.com

# 上游无 CTest 套件；自带 UnitTest 框架，入口为
# extras/UnitTestRunner（juce_add_console_app，JUCE_BUILD_EXTRAS=ON，
# JUCE_UNIT_TESTS=1 / JUCE_USE_CURL=0 / JUCE_WEB_BROWSER=0）。
# 上游测试在设备上由 rule4 流程真实构建运行（独立于 conan create，
# 证据见 runs/juce-8.0.5/reports/builder/ 与 logs/utrun-categories/）：
# 真机执行 24 类目 / 1086 个 beginTest 组（执行用例类 142；grep 'public
# UnitTest' 声明于 133-135 个文件），GUI 44 组与 Audio 系类目全部通过；
# 仅余偏差为 NamedPipe 7 组（HMDFS 用户存储 mkfifo EPERM，E074/P020 域）
# 与 Files/Writing 1 组（HMDFS I/O 超时，单组 420s 上限），不在 conan
# create 内重复执行。
upstream_check_command: "extras/UnitTestRunner UnitTestRunner（JUCE_BUILD_EXTRAS=ON）"
upstream_test_in_build: false

upstream_tests:
  - file: extras/UnitTestRunner/Source/Main.cpp
    source: JUCE-8.0.5/extras/UnitTestRunner/Source/Main.cpp
    description: "UnitTestRunner 入口：运行全部注册 UnitTest（24 类目 / 142 个执行用例类 / 1086 个 beginTest 组）"
    command: "./UnitTestRunner"
  - file: modules/juce_core (grep 'public UnitTest' 计数)
    source: JUCE-8.0.5/modules
    description: "core/graphics/events 等模块自带单元测试（含 juce::UnitTests 全量分类）"
    command: "./UnitTestRunner --all"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_juce.cpp
    description: >
      find_package(JUCE)（包内官方 JUCEConfig.cmake）+ juce_add_console_app +
      链接 juce::juce_core/juce::juce_events/juce::juce_graphics（模块 INTERFACE
      源编入消费方目标，pkg-config 依赖经 juce_add_module linuxPackages 分支接线）。
      OHOS 特有断言：__OHOS__ + JUCE_LINUX 平台分支（编译期）、包级
      JUCE_USE_CURL=0（编译期）、模块可用宏（编译期）、musl 线程创建/join、
      时钟单调、文件 I/O、XML、MessageManager 无环创建、juce::Image ARGB
      软件位图（juce_graphics 源+E505 共享库 freetype2/fontconfig 实体化签名+rpath 链接闭包）、
      MemoryBlock。共 13 项运行时检查。
    command: "ctest --output-on-failure -R test_juce_app"

# 测试断言总数（test_package 运行时 13 项 + 编译期 4 组卫 + 上游 UnitTest
# 24 类目 / 1086 组 / 142 执行用例类由 rule4 单独执行统计）
assertion_count: 13
