software: juce
display: "JUCE"
description: "跨平台 C++ 应用框架（音频/图形/GUI/网络模块），JUCE 8 官方 CMake INTERFACE 模块分发"
category: library
homepage: "https://juce.com"
license: "AGPL-3.0-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "官方 CMake 分发：23 个模块为 INTERFACE 目标（源码由消费方目标编译），install 产出 JUCEConfig.cmake + juceaide/lv2/vst3 构建期工具（bin/JUCE-8.0.5）"
    - "E092 先例：配方与 test_package 强制 CMAKE_SYSTEM_NAME=Linux 触发上游 Linux 平台分支；另补 JUCEModuleSupport.cmake 四处分支将 HarmonyOS 并入 Linux 族（架构探测/_linux 源/LINUX=1/linuxPackages 元数据），未强制的下游 find_package(JUCE) 亦可工作"
    - "juce_gui_basics.h 补 linuxPackages: NOLINK x11 xproto——核心 X11 头经 pkg-config 提供（libx11/6.4.0 包内头 + xorgproto/2025.1 协议头，消费方 generate() 将 xorgproto 的 share/pkgconfig 并入 PKG_CONFIG_PATH），NOLINK 只取 Cflags 不产生 DT_NEEDED，运行期 JUCE 全 dlopen 精确 soname（E505 加载器语义友好）；X11 扩展 XRANDR/XINERAMA/XSHM/XCURSOR 包级默认关 0（OHOS 无 X server；规避 libxrender 源码重建 config.guess 挂）"
    - "musl/OHOS libc 补丁：JUCE_USE_CURL 包级默认 0（上游原生工具同款）、juce_SystemStats_linux.cpp glibc _NL_ADDRESS_* 宏加 __OHOS__ 兜底、Thread::killThread pthread_cancel no-op（adlplug/1.0.2 先例）"
    - "JUCE_WEB_BROWSER 包级默认 0：webkit2gtk 全仓无配方（gtk/3.24.43 为 broadway-only，经验仓 lablgtk3-3.1.5 编译错证据）；JUCE_ALSA=1（alsa-lib 已发布）、JUCE_JACK=0（上游默认）、JUCE_USE_XRENDER=0（上游默认）"
    - "字体链运行期 E505：freetype/2.14.3 + fontconfig/2.18.3 + libxml2/2.15.3 走已发布共享库；OHOS musl 加载器无法经版本化符号链接别名解析 .so，配方 generate() 将三者 .so 实体化进包内 lib-juceaide-runtime/、逐个 binary-sign-tool selfSign 签名（OHOS 安全策略：用户存储 .so 未签名 dlopen 即 EACCES，mlton/alsa-lib/bam 先例）并经改写 .pc 注入 DT_RPATH（--disable-new-dtags + $ORIGIN），juceaide 构建期/消费方 configure 期均可运行；消费方按同一范式实体化+签名+rpath（test_package 示范）"
    - "juceaide 由上游引导流程在 configure 期原生构建并自检，install 后以 IMPORTED juce::juceaide 进入包内 config，消费方无需嵌套构建"
    - "依赖版本与仓内已发布图谱一致：libx11/6.4.0 + xorgproto/2025.1（X11 头，NOLINK）；alsa-lib/1.2.16.1；mesa/24.3.4.1.1 供 juce_opengl 的 gl.pc（下游消费需 E348 转发 gl.pc）"
  common_dependencies:
    - "freetype/2.14.3"
    - "fontconfig/2.18.3"
    - "alsa-lib/1.2.16.1"
    - "mesa/24.3.4.1.1"
    - "libx11/6.4.0"

versions:
  "8.0.5":
    status: built
    build_date: "2026-10-09"
    source_url: "https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.5.tar.gz"
