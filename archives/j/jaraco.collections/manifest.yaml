# 软件级 manifest — jaraco.collections
# 遵循 ARCHIVE-SPEC v3.0

software: jaraco.collections
display: "jaraco.collections"
description: "纯 Python 集合模型库（RangeMap / Projection / KeyTransformingDict 等，MIT）"
category: application
homepage: "https://github.com/jaraco/jaraco.collections"
license: MIT
build_system: none

ohos_adaptation:
  key_points:
    - "纯 Python 模块包（无编译）：沿用仓库同族范式（archives/m/more-itertools）：package_type=application，模块装到 lib/python3/site-packages"
    - "运行期依赖 jaraco.text（导入期即 import）**制品仓不存在**（两种拼写 × 多版本实测 Unable to find）→ 连同其自身依赖 jaraco.functools / jaraco.context 一并**包内捆绑**（各 URL+sha256 钉死，见 conandata 的 vendored）"
    - "已发布的运行期依赖 more-itertools/11.1.0 走 Conan requires"
    - "上游自带 pytest 套件（tests/test_collections.py）→ build() 内真跑并按 passed/failed/errors 统计，缺依赖或未真跑均判不成立"
    - "R36 张力如实披露：更彻底做法是先发布 jaraco.context / jaraco.functools / jaraco.text 三个配方，再声明 requires"
  common_dependencies:
    - "more-itertools/11.1.0"
  vendored_dependencies:
    - "jaraco.text 4.3.0"
    - "jaraco.functools 4.6.0"
    - "jaraco.context 6.1.2"

versions:
  "5.1.0":
    status: built
    build_date: "2026-10-07"
    conan_ref: "jaraco.collections/5.1.0"
