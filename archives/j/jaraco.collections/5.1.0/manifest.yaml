patches_applied: []

upstream_tests:
  framework: pytest
  test_sources: 1
  test_command: "PYTHONPATH=<src>:<vendored…>:<more-itertools site> python3 -m pytest -q tests"
  run_in_build: true
  evidence: >-
    sdist 内含 tests/test_collections.py（另有 pytest.ini 配置）→ build() 内真跑 pytest 并统计
    passed/failed/errors；解析不到通过计数、或出现 ModuleNotFoundError/ImportError、或有
    failed/errors 时均让 build 失败（不把失败或"未真正运行"写成通过）。
upstream_test_pass_rate: "**1 passed / 0 failed / 0 errors**（本地 conan create 实测，pytest 输出 `1 passed in 0.12s`）——上游套件本身很小（`tests/test_collections.py` 共 27 行、**1 个测试函数**，围绕 `KeyTransformingDict` 子类的键变换），已真跑，未虚构；README/notes 里同时说明该套件规模，故消费者校验（5 项）承担更多"产物可用性"证据。"
adapted_test_pass_rate: "test_package/check_collections.py **5 项全通过（fails=0 skips=0）**：①包内与 more-itertools 两个 site-packages 均存在 ②`import jaraco.collections` 成功且 `__file__` 落在**本包**内 ③3 个捆绑运行期依赖（jaraco.text / jaraco.functools / jaraco.context）均从本包 site-packages 导入（jaraco.* 命名空间合并成功）④真实 API 调用结果正确（FrozenDict / DictStack / Projection / invert_map）⑤`FoldedCaseKeyedDict` 大小写折叠查找正确——**证明捆绑的 jaraco.text 被真正使用**"

knowledge_gained:
  - "纯 Python 库的运行期依赖缺失时，先确认该依赖是否在**导入期**就被 import（本例 jaraco.collections 顶部 import jaraco.text 并在运行时用 FoldedCase）——在导入期就必须存在的依赖不能当可选依赖省掉"
  - "被捆绑的多个包若共享同一个命名空间（jaraco.* 为 PEP 420 命名空间包），把它们各自的 jaraco/<mod> 目录并列装进 site-packages 即可自然合并，无需 __init__.py"
  - "上游 pytest 结果要按 passed/failed/errors 三项分别统计并把'未解析到通过计数''出现 ModuleNotFoundError/ImportError'也判为不成立，避免把'没真跑'或'缺依赖'记成通过"
