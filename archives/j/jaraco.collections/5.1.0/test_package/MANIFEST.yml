# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点（R51，证据见 notes.md「上游测试清点」一节）：
#   sdist 内含 `tests/test_collections.py`（另有 pytest.ini / tox.ini 配置）
#   → 上游**确有测试**，本包在 build() 内真跑 pytest 并按 passed/failed/errors 统计，
#     缺依赖（ModuleNotFoundError/ImportError）或未解析到通过计数均判不成立。
#
# 依赖处置（如实披露）：运行期 import jaraco.text，而制品仓没有 jaraco.text /
# jaraco.functools / jaraco.context（两种拼写 × 多版本 conan install 实测 Unable to find）
# → 这 3 个纯 Python 小模块随包捆绑（conandata 的 vendored，各 URL+sha256 钉死）；
# 已发布的 more-itertools/11.1.0 走 Conan requires。

package: jaraco.collections/5.1.0
homepage: "https://github.com/jaraco/jaraco.collections"

# 上游测试命令（build() 内执行）
upstream_check_command: "python3 -m pytest -q tests"

upstream_test_in_build: true
upstream_test_command: "PYTHONPATH=<src>:<vendored…>:<more-itertools site> python3 -m pytest -q tests"

upstream_tests:
  - file: tests/test_collections.py
    description: "上游 pytest 套件（集合模型 API：RangeMap / Projection / KeyTransformingDict / FoldedCaseKeyedDict 等）"

test_package_tests:
  - file: check_collections.py
    description: "消费者校验 5 项：①打包的 site-packages 与 more-itertools 依赖目录存在 ②import jaraco.collections 成功且版本号可读 ③**捆绑依赖可导入**（jaraco.text / jaraco.functools / jaraco.context 三个命名空间子模块在 site-packages 内合并成功）④真实调用 API（RangeMap 查值 / Projection 投影 / FoldedCaseKeyedDict 大小写折叠查找）⑤`FoldedCaseKeyedDict` 用例专门证明捆绑的 jaraco.text 被真正使用"
    command: "python3 check_collections.py <package> <more-itertools package>"

assertion_count: 5
