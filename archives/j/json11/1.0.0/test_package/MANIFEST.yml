# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# json11 1.0.0 实测信息:
#   - 上游唯一测试入口为 test.cpp 中 JSON11_TEST_CASE(json11_test)（含 ~60 断言）
#   - 官方 Makefile `test` 目标等价命令已验证通过（exit 0）
#   - ctest 未注册用例（enable_testing 但无 add_test）

package: json11/1.0.0
homepage: "https://github.com/dropbox/json11"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.cpp
    source: json11-1.0.0/test.cpp
    description: "上游唯一独立测试用例 json11_test（注释解析/序列化/Unicode/parse_multi/容器转换，~60 断言）"
    command: "./json11_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试 — 实际解析/断言 json11 C++ API（R34 实质依赖被测包）"
    command: "./test_json11"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 70