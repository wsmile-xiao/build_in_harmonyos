knowledge_gained:
  - "源码编译方式：GitHub tarball + 多模块仓库但仅构建 api/ 子模块（-f api/pom.xml，对齐上游 .travis.yml；spec/ 为 asciidoc 文档）"
  - "上游测试：0（API-only 模块，api/src 无 test 目录，19 个 .java 全部在 src/main，surefire 'No tests to run'）"
  - "零补丁：上游 api/pom.xml 已固定 maven-bundle-plugin 5.1.1（bnd 6.x），不受 JDK 17.0.13+ ZipFile ConcurrentModificationException 影响；javadoc doclint 本 JDK 下全过（本地试跑 BUILD SUCCESS 2026-10-08）"
  - "产物 jar 含 module-info.class（JPMS 模块名 jakarta.annotation）+ OSGi Manifest（Bundle-SymbolicName jakarta.annotation-api）——test_package 用类路径模式消费（非 module-path），兼容两者"
  - "test_package 双程序：反射探针（16 类型加载 + 方法签名/元数据/默认值契约）+ 最小注解驱动容器消费者 E2E（@Resource 注入 + @PostConstruct/@PreDestroy 生命周期 + @Priority + 安全注解 + @Repeatable(@Resources) + @Generated）"
  - "纯 Java 注解 jar 无平台 API 差异（无 native 代码、无 sun.misc/内部 API 依赖）：HarmonyOS PC 专项验证为『真机 JVM 上 jar 加载与消费 + javac 注解处理编译』，而非伪造平台 API 专项"
  - "R32: validate() 检查 settings.os in (Linux, OHOS)"
  - "R38: 库包，不需要 commands.json"
