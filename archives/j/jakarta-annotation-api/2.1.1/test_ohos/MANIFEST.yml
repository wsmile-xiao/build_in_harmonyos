# test_ohos/MANIFEST.yml — jakarta-annotation-api 2.1.1 HarmonyOS PC 专项验证声明

package: jakarta-annotation-api/2.1.1
purpose: "HarmonyOS PC 平台专项验证：目标平台 JVM ELF64/AArch64/musl loader fail-closed 断言 + 最终 Conan 包 jar 真机编译与消费"

# 本库为纯 Java 注解 jar（无 native/JNI/平台条件源码），专项采用
# 「目标平台 JVM + 最终包 jar 消费」方式，不伪造 __OHOS__ 宏或平台 API 专项
# （对齐 manifest.yaml knowledge_gained 的纯 Java 专项验证口径）。
# 整体计 1 项逻辑测试，内部 T1–T5 平台断言不重复计数。

checks:
  - id: T1
    name: "定位 test_package 实际使用的 java 并解析 symlink 至真实二进制"
    command: "echo \$JAVA_HOME / readlink 链 / java -version"
  - id: T2
    name: "真实 java 二进制为 ELF64（readelf/llvm-readelf/llvm-readobj，工具缺失 fail-closed 失败退出，不 SKIP）"
    command: "readelf -h <java>"
  - id: T3
    name: "Machine: AArch64"
    command: "readelf -h <java>"
  - id: T4
    name: "动态 ELF 时 PT_INTERP 为 musl AArch64 loader（ld-musl-aarch64）；静态 ELF 无需 loader 断言"
    command: "readelf -l <java>"
  - id: T5
    name: "已确认的 HarmonyOS AArch64 JVM 下，最终包 jar 编译并运行最小消费者 OhosConsumer（JVM 自报 os.name=HarmonyOS/os.arch=aarch64 + @Resource/@PostConstruct/@PreDestroy/@Priority 真实消费）"
    command: "javac -cp <pkg>/libexec/jakarta.annotation-api-2.1.1.jar + java -cp <jar>:<work> OhosConsumer"

test_files:
  - run_ohos_test.sh
  - OhosConsumer.java

run_command: "sh run_ohos_test.sh <conan_package_folder>"

# 与上游测试 / 消费者测试的区别
distinct_from: "上游 0 测试；test_package 为 Java 功能验证（反射探针 53 + 消费者 E2E 17）；本专项为 HarmonyOS PC 平台验证——解析 test_package 实际使用的 JVM 二进制做 ELF64/AArch64/musl loader fail-closed 断言，再于该已确认的 OHOS JVM 上消费最终包 jar"
