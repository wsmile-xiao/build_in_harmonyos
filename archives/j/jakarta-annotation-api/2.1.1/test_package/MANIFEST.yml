# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jakarta-annotation-api/2.1.1
homepage: "https://github.com/jakartaee/common-annotations-api"

# 上游测试通过 Maven 运行（mvn -f api/pom.xml clean package -B -DskipTests=false，
# package 阶段含 test）
# 上游为 API-only 模块：tarball 中无 src/test 目录，0 个上游测试
upstream_check_command: "mvn -f api/pom.xml clean package -B -DskipTests=false"
upstream_test_in_build: true
upstream_test_command: "mvn -f api/pom.xml clean package -B -DskipTests=false"

# 上游测试用例（在 build() 中运行）
# 统计来源：tarball 内无 src/test 目录（纯 API 模块），api 主源码 19 个 .java 文件
upstream_tests:
  - file: api/src/main/java/jakarta/annotation/
    source: common-annotations-api-2.1.1.tar.gz/api/src/main/java/jakarta/annotation/
    description: "上游无测试源码（API-only 模块，api/src 无 test 目录），构建时仅编译主源码 + jar；surefire 报 'No tests to run'"
    command: "mvn -f api/pom.xml clean package -B -DskipTests=false"

# test_package 中自带的测试 (消费者视角验证，在鸿蒙真机运行)
test_package_tests:
  - file: TestJakartaAnnotation.java
    description: "API 探针：16 个注解类型反射加载 + 方法签名（Resource.name/Priority.value/Generated.value 等）+ 元数据（Retention/Target/Repeatable/Deprecated）+ 默认值契约（Resource.type/shareable/authenticationType 等）(R34 实质性验证)"
    command: "bash test.sh"
  - file: ConsumerAnnotationTest.java
    description: "完整消费者用例（端到端）：最小注解驱动容器消费 Jakarta Annotations 语义，跑通 @Resource 注入（显式名/默认字段名）→ @PostConstruct/@PreDestroy 生命周期 → @Priority 排序 → @RolesAllowed/@PermitAll/@RunAs/@DeclareRoles 安全元数据 → @Repeatable(@Resources) 重复声明 → @Generated 元数据，纯 API jar 运行无第三方依赖"
    command: "java -cp <jar>:<tmp> ConsumerAnnotationTest"

# 新增/鸿蒙特有测试 (rule12)
# 纯 Java 注解库专项口径：目标平台 JVM 二进制平台断言 + 最终包 jar 真机消费，
# 整体 1 项逻辑测试（内部 T1-T5 平台断言不重复计数），详见 test_ohos/MANIFEST.yml
added_tests:
  - name: "harmonyos-specific-test"
    source: test_ohos/run_ohos_test.sh
    description: "鸿蒙特有断言: 定位并解析 test_package 实际使用的 java（symlink→真实二进制）→ ELF64 + AArch64 + musl AArch64 PT_INTERP（readelf/llvm-readelf/llvm-readobj 缺失即 fail-closed 失败，不 SKIP）→ 该 HarmonyOS JVM 下最终包 jar 编译+运行 OhosConsumer（@Resource/@PostConstruct/@PreDestroy/@Priority 真实引用）"
    command: "sh test_ohos/run_ohos_test.sh <conan_package_folder>"

# 测试断言总数
# 上游：0（无测试源码）
# test_package：75 个断言
#   = 1 JAR 存在 + 1 编译 + 53 探针断言 + 17 消费者 E2E 断言 + 1 SUMMARY 0 failed
#   + 1 E2E PASS 行 + 1 探针 PASS 行（test.sh 级 grep 断言）
# HarmonyOS 专项（test_ohos）：1 项逻辑测试（T1-T5 内部平台断言不重复计数）
assertion_count: 76
