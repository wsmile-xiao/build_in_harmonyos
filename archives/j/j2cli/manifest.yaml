software: j2cli
display: "Jinja2 Command-Line Tool"
description: "Python CLI for rendering templates from environment, INI, JSON, and optional YAML data"
category: tool
homepage: "https://github.com/kolypto/j2cli"
license: BSD-2-Clause
build_system: custom

ohos_adaptation:
  key_points:
    - "Pure-Python CLI installed under lib/python/site-packages with j2 on PATH."
    - "Jinja2 is required; PyYAML is an optional Conan feature for YAML input."
    - "Upstream imp and pkg_resources usage is adapted for the device Python runtime."
  common_dependencies:
    - "jinja2/3.1.6"
    - "pyyaml/6.0.2 (optional: with_yaml=True)"

versions:
  "0.3.12b":
    status: built
    build_date: "2026-09-27"
    path: archives/j/j2cli/0.3.12b
