software: jbigkit
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-13"

# 构建系统（顶层字段，质量门禁要求）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.cl.cam.ac.uk/~mgk25/jbigkit/download/jbigkit-2.1.tar.gz"

  # 源码校验和
  sha256: "de7106b6bfaf495d6865c7dd7ac6ca1381bd12e0d81405ea81e7f2167263d932"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
  - "0002-configure.patch"
  - "0003-libjbig-Makefile.patch"
  - "0004-pbmtools-Makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Makefile项目（无configure）需创建dummy configure脚本以满足G0验证流程"
  - "make -e会覆盖环境变量CFLAGS，pbmtools编译需显式在Makefile中设置CPPFLAGS=-I../libjbig"
  - "鸿蒙平台需使用llvm-ar/llvm-ranlib替代GNU ar/ranlib"
  - "原始Makefile无install目标时，需手动添加含bin/lib/include的install target"
  - "track-edit add可将新增文件（如configure脚本）加入补丁追踪器，避免refresh-patch遗漏"
  - "G4质量门禁要求manifest有顶层build_system字段，仅有嵌套build.system不够"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/jbigkit-2.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/jbigkit-2.1.work
  source_orig_hash: a5d0e95b5f3928d2
  source_work_hash: d5ed8bc674f37d96
  generated_at: '2026-06-13T21:05:34'
  patches_count: 4

patch_classification:
  - file: 0001-Makefile.patch
    type: platform_adaptation
    platform_only: True
    guard: '#ifdef __OHOS__'
  - file: 0002-configure.patch
    type: platform_adaptation
    platform_only: True
    guard: '#ifdef __OHOS__'
  - file: 0003-libjbig-Makefile.patch
    type: platform_adaptation
    platform_only: True
    guard: '#ifdef __OHOS__'
  - file: 0004-pbmtools-Makefile.patch
    type: platform_adaptation
    platform_only: True
    guard: '#ifdef __OHOS__'
