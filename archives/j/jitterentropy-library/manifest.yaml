# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 基本信息
# ============================================================

# 软件名称
name: jitterentropy-library

# 软件描述
description: "Hardware RNG based on CPU timing jitter - provides a noise source using CPU execution timing jitter"

# 官方主页
homepage: "https://github.com/smuellerDD/jitterentropy-library"

# 分类
# crypto | compression | network | database | system | gui | devel | utility
category: crypto

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表（按时间倒序）
versions:
  - version: "3.7.0"
    status: published
    build_date: "2026-05-29"
    notes: "首次编译，使用 CMake 构建"

# ============================================================
# 软件特性
# ============================================================

# 构建系统类型
build_system: cmake

# 依赖关系
dependencies:
  build: []
  runtime: []

# 特殊配置
special_notes:
  - "使用 CMake 构建，支持静态库编译"
  - "测试程序在 tests/ 目录"