package: jflex/1.9.1
homepage: "https://www.jflex.de/"

upstream_tests_exist: true
upstream_test_audit: >-
  The official 1.9.1 distribution contains 19 src/test Java files. Maven
  Surefire includes 12 *Test.java, *Tests.java, and *Quickcheck.java files;
  runtime case counts are read from TEST-*.xml on the OHOS worker.
upstream_check_command: "mvn clean package -B -DskipTests=false"
upstream_test_in_build: true
upstream_test_command: "mvn clean package -B -DskipTests=false"
upstream_tests:
  - file: "src/test/java/jflex/"
    source: "jflex-1.9.1.tar.gz/src/test/java/jflex/"
    description: "JUnit 4 and junit-quickcheck upstream suite (12 Surefire test source files)"
    command: "mvn clean package -B -DskipTests=false"

test_package_tests:
  - file: "conanfile.py"
    description: "Consume JFlex as a tool_requires and activate its VirtualBuildEnv contract"
    command: "self.run(test.sh, env=conanbuild)"
  - file: "Lexer.flex"
    description: "Generate a basic Java lexer through JFLEX_COMMAND"
    command: "sh $JFLEX_COMMAND Lexer.flex"
  - file: "TestLexer.java"
    description: "Compile and run the generated lexer against identifiers, plus, integer, and whitespace"
    command: "javac GeneratedLexer.java TestLexer.java && java TestLexer"
  - file: "UnicodeStateLexer.flex"
    description: "Generate a Unicode-aware lexer with an explicit STRING lexical state"
    command: "sh $JFLEX_COMMAND UnicodeStateLexer.flex"
  - file: "TestUnicodeStateLexer.java"
    description: "Compile and verify Unicode identifiers, Unicode string content, and lexical state transitions"
    command: "javac UnicodeStateLexer.java TestUnicodeStateLexer.java && java TestUnicodeStateLexer"
  - file: "test.sh"
    description: "Verify buildenv paths, version, two generations, compilation, semantics, and HMBS evidence"
    command: "sh test.sh <java> <javac> <source> <work>"

assertion_count: 19
