knowledge_gained:
  - "The official release supports Maven and Bazel; Maven package produces a self-contained jflex-full JAR."
  - "JFlex is a JVM build tool, so the Conan package contains libexec/jflex-full-1.9.1.jar and no native library."
  - "HarmonyOS requires invoking the extracted Maven launcher through sh instead of executing the script directly."
  - "The isolated worker CA bundle must be exported for cmd-pkgs downloads; the installer script is SHA256-pinned."
  - "Downstream Conan recipes can consume JFlex as a tool_requires through JFLEX_COMMAND and JFLEX_JAR build-environment variables."
  - "A relocatable libexec wrapper keeps JFlex out of CLI commands.json classification while preserving an explicit HarmonyOS sh invocation path."
