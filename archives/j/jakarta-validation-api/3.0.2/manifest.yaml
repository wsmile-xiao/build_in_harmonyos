upstream_test_pass_rate: "10/10（本地 JDK 17.0.17 与真机 HarmonyOS PC aarch64 构建时 surefire 执行，Tests run: 10, Failures/Errors/Skipped 全 0，2026-09-29）"
adapted_test_pass_rate: "48/48（真机 conan-verify 八门禁 Verdict PASS + 探针 35/35 + E2E 10/10，2026-09-29）"
knowledge_gained:
  - "源码编译方式：GitHub tarball + 单 Maven 模块（src/main 98 个 .java 注解/接口/异常 + src/test 7 个 .java）；上游无 mvnw，配方自取 apache-maven 3.9.11 并 sha256 校验"
  - "上游测试：10 个 TestNG 方法在 2 个测试类（ConstraintViolationExceptionTest 3 + ValidationTest 7；examples/ 2 类是 main() 演示零 @Test，3 个 SPI provider fixture 无测试），-DskipTests=false 时 surefire 在 package 阶段执行"
  - "零补丁：maven-bundle-plugin 3.5.0 早于 jakarta-inject-api 踩坑的 4.2.1（bnd/ZipFile ConcurrentModificationException 由 4.x 后期 bnd 引入）；javadoc 注释在 JDK 17.0.17 上 doclint 全过"
  - "Maven 依赖通道：阿里云 central 镜像 settings.xml + 3 次重试 + 直连兜底（jakarta-authentication-api 先例，CI 直连 repo1.maven.org 报 Connection reset）"
  - "API 无实现（约束注解 validatedBy 全为空集，@NotNull 是通用约束）——test_package 消费者用例自带最小 Bean Validation 引擎消费 API 语义"
  - "test_package 双程序：反射探针 35 断言 + 最小引擎消费者用例 10 个 E2E（@NotNull/@Size/@Min 三约束 + ConstraintViolation/Path/ConstraintValidator SPI + ConstraintViolationException 防御性拷贝集成）"
  - "R32: validate() 检查 settings.os in (Linux, OHOS)"
  - "R38: 库包，不需要 commands.json"
  - "真机坑位复用（jakarta-cdi-api 4.0.1 真机实踩，配方已内置）：Maven 自取 curl→python3 urllib 免证书回退 + sha256 钉校验；HMDFS 禁 shebang→显式 sh {maven_home}/bin/mvn"
  - "真机验证新踩（2026-09-29）：ohc-run.py G2 对 github.com conandata 注入 ghfast.top 镜像（E017 预防）而 ghfast.top 已挂→设备侧副本临时改指 PC 本地 http.server 镜像绕过，提交版保留官方 URL；设备 $HOME 漂移→xfer 绝对路径+脚本统一 HOME；设备侧中继脚本被 OHOS 会话清理 SIGTERM→长命令 run_devN_long 全程保持连接"
