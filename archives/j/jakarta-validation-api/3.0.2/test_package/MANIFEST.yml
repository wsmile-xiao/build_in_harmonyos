# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jakarta-validation-api/3.0.2
homepage: "https://github.com/jakartaee/validation"

# 上游测试通过 Maven 运行（mvn clean package -B -DskipTests=false，package 阶段含 test）
# 上游测试在 2 个测试类：10 个 TestNG 方法，构建时执行
upstream_check_command: "mvn clean package -B -DskipTests=false"
upstream_test_in_build: true
upstream_test_command: "mvn clean package -B -DskipTests=false"

# 上游测试用例（在 build() 中运行）
# 统计来源：surefire junitreports：ConstraintViolationExceptionTest tests=3 + ValidationTest tests=7 = 10，
# failures=0 / errors=0 / skipped=0（本地 JDK 17.0.17 实证）；
# examples/ 2 类为 main() 演示零 @Test，3 个 SPI provider fixture（Bar/Foo/NonRegistered）无测试
upstream_tests:
  - file: src/test/java/jakarta/validation/
    source: validation-3.0.2.tar.gz/src/test/java/jakarta/validation/
    description: "上游 TestNG 测试 10 个方法（2 个测试类）：ValidationTest 7（默认提供者引导/提供者解析/带消息与违规集的 ConstraintViolationException/Validation API）+ ConstraintViolationExceptionTest 3（异常构造函数与违规集契约）"
    command: "mvn clean package -B -DskipTests=false"

# test_package 中自带的测试 (消费者视角验证，在鸿蒙真机运行)
test_package_tests:
  - file: TestJakartaValidation.java
    description: "API 探针：反射加载 21 类注解/接口/异常 + 14 项契约断言（@Valid 五元素 @Target/@NotNull @Constraint 元注解与消息模板/@Size @Min @Pattern 属性默认值/Validator 变参返回 Set/异常继承/Path.Node/ConstraintValidator default 方法/无 provider 引导抛 ValidationException），共 35 断言 (R34 实质性验证)"
    command: "bash test.sh"
  - file: ConsumerValidationTest.java
    description: "完整消费者用例（端到端）：最小 Bean Validation 引擎消费 JSR-380 API（注解声明→ConstraintValidator 按注解实例创建并 initialize→ConstraintViolation 报告→ConstraintViolationException 防御性拷贝集成），10 个 E2E 用例：零违规/@NotNull 违规报告契约/@Size 三态/@Min 边界/多字段不短路/无状态残留/异常防御性拷贝集成/注解属性一致性/校验器工厂映射/Validator 接口契约，纯 API jar 运行无第三方依赖"
    command: "java -cp <jar>:<tmp> ConsumerValidationTest"

# 测试断言总数
# 上游：10（TestNG 方法，构建时运行）
# test_package：48 个断言
#   = 1 JAR 存在 + 1 编译 + 35 API 反射断言 + 10 消费者 E2E 用例 + 1 PASS
assertion_count: 58
