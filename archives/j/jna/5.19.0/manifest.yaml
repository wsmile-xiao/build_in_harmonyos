version: "5.19.0"
status: published
build_date: "2026-04-21"

source:
  url: "https://github.com/java-native-access/jna"
  tar_format: git

build:
  system: custom
  dependencies:
    - bishengjdk17
    - libffi/8.2.0
  cc: clang

patches_applied: []

knowledge_gained:
  - "BiSheng JDK System.load 要求 .so 与 JVM 使用同一签名体系，需拷贝 JDK 并全量自签名"
  - "JNA 检测鸿蒙为 harmonyos-aarch64（非 linux-aarch64）"
  - "JAR 必须包含 com/sun/jna/harmonyos-aarch64/libjnidispatch.so"
  - "ffi_closure 回调在 HarmonyOS 上正常工作"
  - "Version.java TEMPLATE 必须在 javac 前替换"
