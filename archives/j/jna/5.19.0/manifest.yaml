software: jna
version: 5.19.0
category: java
license: Apache-2.0 / LGPL-2.1+
url: https://github.com/java-native-access/jna
status: success

build:
  type: manual
  compiler: clang 15.0.4 (ohos)
  java: bishengjdk 17.0.13
  configure_options: N/A (manual build)

native_sources:
  - dispatch.c
  - callback.c

compile_commands:
  java: >
    javac -d build/classes -h build/jni-headers
    -sourcepath src $(find src/com/sun/jna -name "*.java")
  native: >
    clang -O2 -fPIC -fno-omit-frame-pointer -fno-strict-aliasing
    -D_REENTRANT -DHAVE_PROTECTION -DNO_JAWT
    -DJNA_JNI_VERSION='"5.19.0"' -DCHECKSUM='"0"'
    -I$JAVA_HOME/include -I$JAVA_HOME/include/linux
    -I$FFI_HOME/include -Ibuild/jni-headers -Inative/
    -c native/dispatch.c -o build/dispatch.o &&
    clang -O2 -fPIC ... -c native/callback.c -o build/callback.o
  link: >
    clang -shared -o build/libjnidispatch.so
    build/dispatch.o build/callback.o
    $FFI_HOME/lib/libffi.a
  package: >
    cd build/classes &&
    mkdir -p com/sun/jna/harmonyos-aarch64/ &&
    cp build/native/libjnidispatch.so com/sun/jna/harmonyos-aarch64/ &&
    jar cf dist/jna.jar com/sun/jna/

pre_build_patches:
  - description: "Replace TEMPLATE in Version.java with actual version"
    file: src/com/sun/jna/Version.java
    change: 'VERSION = "TEMPLATE" → VERSION = "5.19.0"'

dependencies:
  runtime:
    - bishengjdk17 (signed)
  build:
    - libffi (static, already ported to HarmonyOS)

products:
  - path: packaging/jna.jar
    type: java-library
    description: Complete JNA library with embedded native code for harmonyos-aarch64
  - path: packaging/libjnidispatch.so
    type: shared-library
    description: Standalone native dispatch library (libffi statically linked, only depends on libc.so)

knowledge_gained:
  - "BiSheng JDK System.load requires .so to share same signature as JVM (selfSign)"
  - "Must copy JDK to writable path and batch-sign all ELF files before loading custom JNI libraries"
  - "JNA detects HarmonyOS as Platform.RESOURCE_PREFIX=harmonyos-aarch64 (not linux-aarch64)"
  - "JAR must include com/sun/jna/harmonyos-aarch64/libjnidispatch.so for auto-extraction"
  - "ffi_closure (callback) works correctly on HarmonyOS"
  - "Version.java TEMPLATE must be replaced before javac"

test_results:
  basic_calls: pass  # puts/getpid/abs/sqrt/getenv via libc
  memory_ops: pass   # Pointer.setInt/getInt, malloc/free
  dynamic_load: pass # NativeLibrary.getInstance("m") + cos(0.0)
  callback: pass     # ffi_closure via qsort with Pointer comparison
  platform_detection: pass  # harmonyos-aarch64 detected

limitations:
  - "Platform.getOSType() returns -1 (unknown) since HarmonyOS is not a recognized OS type"
  - "Requires JDK copy with self-signed ELF files; original system JDK rejects System.load"
