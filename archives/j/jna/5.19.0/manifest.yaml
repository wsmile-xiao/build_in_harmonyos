software: jna
version: "5.19.0"
status: built
build_date: "2026-08-25"
build_system: makefile

source:
  url: "https://github.com/java-native-access/jna/archive/refs/tags/5.19.0.tar.gz"
  sha256: "5dc3b1eb7e9030c9cee3b503f5d0891d81f55f81222f2ebfb435e7d6731111f6"
  tar_format: tar.gz

build:
  dependencies:
    - bishengjdk17 (build tool, installed via cmd-pkgs)
    - libffi/3.5.2
  cc: clang
  configure_options:
    - "OS=linux"
    - "DYNAMIC_LIBFFI=true"
    - "CFLAGS_EXTRA=-I<libffi>/include -DNO_JAWT"
    - "LIBS=-L<libffi>/lib -lffi"

patches_applied: []

test_report: reports/test-report.md
packaging: packaging/libjnidispatch.tar.gz

knowledge_gained:
  - "HarmonyOS uname returns 'HarmonyOS', need OS=linux override for Makefile"
  - "X11 not available on HarmonyOS, need -DNO_JAWT to skip JAWT headers"
  - "libffi/3.5.2 from conan registry used instead of bundled libffi (automake not available)"
  - "bishengjdk 17 provides JNI headers (jni.h, jni_md.h) and javac for generating JNI headers"
  - "JNA native build: javac -h generates com_sun_jna_*.h from Java source"
  - "Version.java TEMPLATE must be replaced before javac compilation"
  - "dlopen Permission denied on HarmonyOS — use readelf-based test verification"
  - "LDFLAGS must override SONAME to avoid build path in library"
