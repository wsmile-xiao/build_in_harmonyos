# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jna/5.19.0
homepage: "https://github.com/java-native-access/jna"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# JNA native tests are Java-based (require JDK runtime), not C-based.
# The native Makefile builds testlib.c and testlib2.c as shared libraries
# for use by Java tests. These are not standalone executables.
upstream_tests:
  - file: testlib.c
    source: jna-5.19.0/native/testlib.c
    description: "Native test library built as .so for Java test harness"
    command: "N/A (built as libtestlib.so for Java tests)"
  - file: testlib2.c
    source: jna-5.19.0/native/testlib2.c
    description: "Native test library 2 built as .so for Java tests"
    command: "N/A (built as libtestlib2.so for Java tests)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Verify libjnidispatch.so exists, is valid ELF DYN, and exports Java_com_sun_jna_Native_initIDs JNI symbol (readelf-based)"
    command: "conan test (readelf checks)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
