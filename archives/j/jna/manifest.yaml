software: jna
display: "JNA (Java Native Access)"
description: "Java library for calling native shared libraries without JNI"
category: system
homepage: "https://github.com/java-native-access/jna"
license: Apache-2.0 / LGPL-2.1+
build_system: custom

ohos_adaptation:
  key_points:
    - "需静态链接 libffi 到 libjnidispatch.so"
    - "BiSheng JDK System.load 要求 .so 与 JVM 使用同一签名体系，需拷贝 JDK 并全量自签名"
    - "JNA 检测鸿蒙为 harmonyos-aarch64（非 linux-aarch64）"
    - "JAR 必须包含 com/sun/jna/harmonyos-aarch64/libjnidispatch.so"
    - "Version.java 中的 TEMPLATE 需替换为实际版本号"
  common_dependencies:
    - bishengjdk17
    - libffi

versions:
  "5.19.0":
    status: published
    build_date: "2026-04-21"
