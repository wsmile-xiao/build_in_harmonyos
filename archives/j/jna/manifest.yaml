software: jna
display: "JNA (Java Native Access)"
description: "Java library for calling native shared libraries without JNI"
category: system
homepage: "https://github.com/java-native-access/jna"
license: Apache-2.0 / LGPL-2.1+
build_system: custom

ohos_adaptation:
  key_points:
    - "libjnidispatch.so statically links libffi, only depends on libc.so"
    - "JNI headers (jni.h, jni_md.h, com_sun_jna_*.h) bundled as source files"
    - "NO_JAWT define to skip X11/jawt includes on HarmonyOS"
    - "JNA detects HarmonyOS as harmonyos-aarch64 (not linux-aarch64)"
    - "JAR must contain com/sun/jna/harmonyos-aarch64/libjnidispatch.so"
    - "Version.java TEMPLATE must be replaced before javac"
  common_dependencies:
    - libffi

versions:
  "5.19.0":
    status: published
    build_date: "2026-08-10"
