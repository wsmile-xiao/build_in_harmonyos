# 软件级 manifest -- jnoise
# 遵循 ARCHIVE-SPEC v2.0

software: jnoise
display: "jnoise (JACK white/pink noise generator)"
description: "jnoise -- 命令行 JACK 客户端，同时输出白噪声与粉噪声（高斯幅度分布，-20 dB RMS 相对满幅正弦）"
category: audio
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建（无 configure）：链接命令硬编码字面量 g++（OHOS 无此程序，且 make 命令行变量无法覆盖命令里的程序名），portability 补丁改为 $(CXX)，编译器取自 conan profile（R33）"
    - "install 目标使用裸 install（coreutils），OHOS PATH 上没有；补丁参数化为 INSTALL ?= /bin/install（toybox；`ls -l /bin/install` 因 stat 假阴性报 Permission denied，必须实际执行才判得准）"
    - "CPPFLAGS/LDFLAGS 经环境变量传入 make（命令行传参会覆盖 Makefile 的 `+=`，丢失 -DPROGRAM/-DVERSION/-DSHARED）"
    - "PREFIX 是普通赋值，用 make 命令行覆盖为 / 加 DESTDIR 完成 staging；0.6.0 源码未引用 SHARED 宏，故无烧路径的运行期后果"
  common_dependencies:
    - jack

versions:
  "0.6.0":
    status: built
    build_date: 2026-09-25
    notes: "conan create 与 W3 本地 CI 通过；1 个 portability 补丁（source/Makefile）；test_package 6 个消费者断言 6/6；JACK server 侧噪声输出分支未执行（本机与 CI 均无 server，证据见 0.6.0/notes.md）"
