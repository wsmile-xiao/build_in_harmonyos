# 版本级 manifest -- jnoise 0.6.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.6.0"
software: jnoise
status: built
build_date: "2026-09-25"
build_system: makefile

source:
  url: "https://kokkinizita.linuxaudio.org/linuxaudio/downloads/jnoise-0.6.0.tar.bz2"
  sha256: "483704462c2f02cbc9f39a800c3b75c4bb9d3a279c1fc33605fc51e27780464a"
  tar_format: tar.bz2

build:
  system: makefile
  configure_options: []
  dependencies:
    - jack/1.9.22
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-source-Makefile.patch"

knowledge_gained:
  - "上游 Makefile 的链接命令把编译器写成字面量 g++（不是 $(CXX)）：make 命令行变量无法覆盖命令里的程序名，只能用 portability 补丁改成 $(CXX)，编译器再由 conan profile 提供（R33）"
  - "上游 install 目标用裸 install（coreutils），OHOS PATH 上没有；toybox 实现在 /bin/install。`ls -l /bin/install` 报 Permission denied（stat 假阴性），必须真的执行才判得准"
  - "PREFIX = /usr/local 是普通赋值，make 命令行前缀变量即可覆盖（PREFIX=/ + DESTDIR），无需补丁；上游 -DSHARED=$(PREFIX)/share 宏在 0.6.0 源码里 0 次引用，故不存在烧死路径的运行期后果"
  - "CPPFLAGS/LDFLAGS 必须走环境变量而不是 make 命令行变量，否则会吃掉 Makefile 的 CPPFLAGS +=（-DPROGRAM/-DVERSION/-DSHARED 全丢）"
  - "-lrt 在 OHOS 工具链上可正常解析（不必剔除），与同作者兄弟包 aeolus/0.10.4 一致"

patch_generation:
  method: manual-portability-patch
  source_orig_hash: n/a-manual-patch-no-framework-dirs
  source_work_hash: n/a-manual-patch-no-framework-dirs
  generated_at: '2026-09-25'
  patches_count: 1
  note: "补丁由执行窗手写，非框架 per-file-difflib 生成链产物：框架侧 orig/work 源码目录未被定位（失败轮 finish Step1 报「无法定位源码目录: orig=None, work=None」），因此框架定义的目录哈希在本包不存在，本棒不自造数值充数；字段语义与取值依据见 notes.md 收口修订 3 §3。仓内只有 scripts/ohc/refresh_patch.py 写这几个字段，无任何门禁读它们判级（改前已 grep 核查）。"

patch_classification:
  - file: 0001-source-Makefile.patch
    type: portability
    platform_only: False
    guard: 'none'
    platform_only_note: "补丁正文与 patch_description 里 __OHOS__ 等平台宏 0 处、无任何条件守卫（PF1-PF6 与 PF8 零命中；W4-r1 审计在 pristine 树正向/反向 git apply --check 全 RC=0）。缺陷本身跨平台存在（链接命令行字面量 g++、裸 install），只是暴露形态随 libc 与 PATH 而异 ⇒ 处置是 portability 补丁而不是平台条件守卫，故 platform_only 取 False 并留本注，不用 True 蒙过判据。取值语义依据 refresh_patch.py 的写方注释（platform_only = 默认假设、guard 由 AI 填 __OHOS__/$^O/none）。"
