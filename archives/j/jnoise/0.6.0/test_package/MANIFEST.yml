# test_package/MANIFEST.yml
# jnoise 0.6.0 -- 上游测试声明（CI build_and_test.sh L0e 要求此文件存在）

package: jnoise/0.6.0
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"

# 上游四种测试形态逐形自数（对 source tarball 全树实测，原始清单见 notes.md）：
#   1) 独立测试框架（testsuite/、gtest、criterion 等）   -> 无
#   2) 语料目录（t/、test/、tests/、samples 等）         -> 无
#   3) RUNTEST / DejaGnu 脚本（*.test、runtest）          -> 无
#   4) 示例目录（examples/、demo/）                       -> 无
# source/Makefile 只有 all / install / clean 三个目标，没有 check / test 目标，
# 也没有 TESTS 变量与 -Werror（grep 复算见 notes.md）。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试用例数（准确整数）：0（无任何 check/test 目标与测试语料）
upstream_test_cases: 0
# 适配后测试通过率（准确整数）：test_package 6 个消费者断言全部通过 = 6/6 (100%)
pass_rate: "6/6 (100%)"

test_package_tests:
  - file: test_jnoise.cpp
    description: "用 open()/read() 读入打包后的 bin/jnoise，断言它是 EM_AARCH64 的 ELF，并在其动态字符串表里找到 libjack 的 NEEDED 名；随后 dlopen() 该 SONAME 并解析 jack_client_open 作为运行期阳性对照。再以 fork/execv + 超时看门狗真跑打包二进制三次：jnoise 0 与 jnoise abc 必须退出 1 并打印 Level is too high（后者经 atof 得 0 dB 仍超限），jnoise -10（边界值被接受）必须越过电平检查、退出 1 并打印 Can't connect to JACK。"
    command: "./test_jnoise <package>/bin/jnoise"

assertion_count: 6

# 未执行项（如实申报，不缩分母；证据见 notes.md 的 JACK 运行面探针）：
#   jack_activate() 之后的白噪/粉噪实际输出分支——本机与 CI worker 均无运行中的
#   JACK server，jack_client_open(JackNoStartServer) 返回 NULL，上游代码在此即
#   return 1，该分支无法执行。未执行不等于失败，也不据此缩小用例分母。
not_executed:
  - "jack_activate 之后的音频回调输出（白噪/粉噪信号本身）"
