software: jsonrpc-glib
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.44.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.44.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/jsonrpc-glib/3.44/jsonrpc-glib-3.44.0.tar.xz"

  # 源码校验和
  sha256: "69406a0250d0cc5175408cae7eca80c0c6bfaefc4ae1830b354c0433bcd5ce06"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型（扁平化字段，兼容verify-build检测）
build_system: meson

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dwith_introspection=false"
    - "-Dwith_vapi=false"
    - "-Denable_tests=false"
    - "-Denable_gtk_doc=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - json-glib/1.6.6

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E063: meson -Werror flags produce warnings on musl/clang, not blocking"
  - "glib_genmarshal pkg-config variable needed by gnome.genmarshal()"
  - "glib 2.84.0 flat cpp_info requires PkgConfigDeps aliases for gio-2.0.pc"
  - "CMakeDeps doesn't propagate glib include dirs (E216), use PkgConfigDeps instead"
