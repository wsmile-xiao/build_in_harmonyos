software: jsonrpc-glib
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.44.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.44.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/jsonrpc-glib/3.44/jsonrpc-glib-3.44.0.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型（扁平化字段，兼容verify-build检测）
build_system: meson

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "-Dwith_introspection=false"
    - "-Dwith_vapi=false"
    - "-Denable_tests=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib-2.0/2.88.0
    - gio-2.0/2.88.0
    - json-glib-1.0/1.6.6
    - libpcre2-8/10.42
    - libffi/3.4.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "E091: HMDFS autotools临时文件创建限制，需使用CMake替代"
    - "gobject-introspection可选依赖可禁用"
    - "meson构建系统使用ninja而非make"
    - "libpcre2必须启用PIC以支持动态库链接"