# test_package/MANIFEST.yml
# Upstream test declaration file
# CI (build_and_test.sh L0e) requires this file to exist

package: jsonrpc-glib/3.44.0
homepage: "https://gitlab.gnome.org/GNOME/jsonrpc-glib"

# Upstream test command (meson test --list shows available tests)
upstream_check_command: "meson test --list"

# Upstream tests are disabled via meson option enable_tests=false
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (in tests/ directory of source)
upstream_tests:
  - file: tests/test-input-stream.c
    source: jsonrpc-glib-3.44.0/tests/test-input-stream.c
    description: "Tests JsonrpcInputStream parsing of JSON-RPC messages"
    command: "meson test test-input-stream"
  - file: tests/test-client.c
    source: jsonrpc-glib-3.44.0/tests/test-client.c
    description: "Tests JsonrpcClient RPC client functionality"
    command: "meson test test-client"
  - file: tests/test-server.c
    source: jsonrpc-glib-3.44.0/tests/test-server.c
    description: "Tests JsonrpcServer RPC server functionality"
    command: "meson test test-server"

# test_package consumer-side test
test_package_tests:
  - file: test.c
    description: "Consumer test: create JsonrpcServer and verify GType registration"
    command: "./test_jsonrpc_glib"

# Approximate assertion count for quality assessment
assertion_count: 3
