# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: juise/3.0.0
homepage: "https://github.com/Juniper/juise"

# 上游测试命令 (用于 make -n check 分析)
# juise 上游 tests/ 目录当前只有占位（"Regression testing is not available (yet)"），
# 无实际回归测试可运行。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无 — 上游 tests/ 仅占位)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 验证 juise / juise-askpass 可执行文件存在、juise --version/--help 正常输出、
# libjuise 共享库已安装。
test_package_tests:
  - file: test_juise.sh
    description: "通过 sh 执行 juise --version/--help 及二进制/共享库存在性验证"
    command: "sh test_juise.sh <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
# 4 个断言: juise 二进制可执行、--version 报 3.0.0、--help 显示 usage、libjuise.so 存在
assertion_count: 4
