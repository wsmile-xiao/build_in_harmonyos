# conandata.yml — juise 3.0.0

sources:
  url:
    - "https://github.com/Juniper/juise/releases/download/3.0.0/juise-3.0.0.tar.gz"
  filename: "juise-3.0.0.tar.gz"
  sha256: "54d641789bf9a531bc262876914e76888382522ad193eace132d16203546d51e"

patches:
  - patch_file: "patches/0001-config-guess-harmonyos.patch"
    patch_description: "Recognize HarmonyOS as linux-ohos in GNU config.guess/config.sub"
  - patch_file: "patches/0002-timestr-P-macro.patch"
    patch_description: "Define __P() prototype macro fallback for libc without glibc sys/cdefs.h"
  - patch_file: "patches/0003-pidlock-begin-decls.patch"
    patch_description: "Define __BEGIN_DECLS/__END_DECLS fallback for libc without glibc sys/cdefs.h"
  - patch_file: "patches/0004-trace-systypes.patch"
    patch_description: "Include <sys/types.h> in trace.h for BSD u_int*_t types"
  - patch_file: "patches/0005-extensions-res-nbby.patch"
    patch_description: "Include <sys/param.h> for NBBY; guard _res tuning with configure-detected HAVE_DECL__RES"
  - patch_file: "patches/0006-configure-ac-decl-res.patch"
    patch_description: "Probe _res declaration via AC_CHECK_DECL (R8: feature detection, no platform macros); build() regenerates configure with autoconf"
