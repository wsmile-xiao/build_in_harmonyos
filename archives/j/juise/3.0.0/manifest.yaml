# 版本级 manifest — juise 3.0.0
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "3.0.0"

# 软件名
software: "juise"

# 编译状态
# published | built | failed | pending_ci
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-30"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Juniper/juise/releases/download/3.0.0/juise-3.0.0.tar.gz"

  # 源码校验和
  sha256: "54d641789bf9a531bc262876914e76888382522ad193eace132d16203546d51e"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-libslax-prefix=<libslax-prefix>"
    - "--with-libxml-prefix=<libxml2-prefix>"
    - "--with-libxml-include-prefix=<libxml2-prefix>/include/libxml2"
    - "--with-libxml-libs-prefix=<libxml2-prefix>/lib"
    - "--with-libxslt-prefix=<libxslt-prefix>"
    - "--with-ssh2=<libssh2-prefix>"
    - "--disable-clira"
    - "--disable-mixer"
    - "--disable-debug"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libslax/3.1.6
    - libxml2/2.15.3
    - libxslt/1.1.45.2
    - libssh2/1.11.1
    - openssl/3.5.6.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-guess-harmonyos.patch"
  - "0002-timestr-P-macro.patch"
  - "0003-pidlock-begin-decls.patch"
  - "0004-trace-systypes.patch"
  - "0005-extensions-res-nbby.patch"
  - "0006-configure-ac-decl-res.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "config.guess/sub 需识别 linux-ohos（HarmonyOS PC aarch64 报 aarch64-unknown-linux-ohos）"
  - "juise configure 强依赖 libslax 的 slax-config 脚本，须 --with-libslax-prefix 指向 libslax 包"
  - "PKG_CHECK_MODULES libssh2 强制，即使 mixer 关闭也需 libssh2 提供 libssh2.pc"
  - "conan libxml2 的 xml2-config 硬编码 /usr/local 前缀，juise 裸调它导致 -L/usr/local/lib；须用 --with-libxml-{include,libs}-prefix 把 conan 路径置前"
  - "build() 必须注入 PWD=work 环境变量：OHOS getcwd(2) EPERM + bash 回退遍历 root 0711 父目录无 read 权限，否则 conan bash 包装器崩溃"
  - "禁 patchelf 改写已安装 ELF（OHOS 拒绝执行，Operation not permitted）；RUNPATH 保留 libtool 构建目录值，conanrun LD_LIBRARY_PATH 优先"
  - "configure/make 前 unset LD_LIBRARY_PATH：CI worker 的 conanbuild.sh 注入含 conan libxml2 的库路径，lld 加载它后启动即崩（xmlFreeDoc symbol not found）→ C compiler cannot create executables；设备端 lld 用 RPATH 才幸免"
  - "unset LD_LIBRARY_PATH 后须给全部 host 依赖（含传递依赖如 libslax→curl）加 -Wl,-rpath，否则 conftest 运行测试找不到库（cannot run C compiled programs）"
  - "R8：禁 __OHOS__ 平台宏。_res 调优段改 configure 特性检测 AC_CHECK_DECL → HAVE_DECL__RES（仅检测到声明才定义；须用单数 AC_CHECK_DECL，复数 AC_CHECK_DECLS 失败也定义=0 会让 #if defined() 恒真）"
  - "改 configure.ac 后发布包自带的 configure 是旧版，须在 build() 跑 autoconf 重新生成（aclocal.m4/ltmain.sh 随包发布，autoconf 单跑即可）；autoconf 后须 touch -r aclocal.m4 configure.ac 把 mtime 钉回，否则 make 触发 maintainer 规则调 aclocal/automake（perl 脚本，设备无 perl → Error 127）"
