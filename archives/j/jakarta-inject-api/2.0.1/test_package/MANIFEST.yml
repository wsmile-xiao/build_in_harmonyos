# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jakarta-inject-api/2.0.1
homepage: "https://github.com/jakartaee/inject"

# 上游测试通过 Maven 运行（mvn clean package -B -DskipTests=false，package 阶段含 test）
# 上游为 API-only 模块：tarball 中无 src/test 目录，0 个上游测试
upstream_check_command: "mvn clean package -B -DskipTests=false"
upstream_test_in_build: true
upstream_test_command: "mvn clean package -B -DskipTests=false"

# 上游测试用例（在 build() 中运行）
# 统计来源：tarball 内无 src/test 目录（纯 API 模块），主源码 8 个 .java 文件
upstream_tests:
  - file: src/main/java/jakarta/inject/
    source: inject-2.0.1.tar.gz/src/main/java/jakarta/inject/
    description: "上游无测试源码（API-only 模块，无 src/test 目录），构建时仅编译主源码 + javadoc + sources + jar"
    command: "mvn clean package -B -DskipTests=false"

# test_package 中自带的测试 (消费者视角验证，在鸿蒙真机运行)
test_package_tests:
  - file: TestJakartaInject.java
    description: "API 探针：反射加载 jakarta.inject 六类注解/接口 + @Inject 注解类型 + Provider.get() 契约断言 (R34 实质性验证)"
    command: "bash test.sh"
  - file: ConsumerInjectTest.java
    description: "完整消费者用例（端到端）：最小 DI 容器消费 JSR-330 API，跑通 注册Provider→@Inject字段注入→@Named限定符消歧→@Singleton单例契约→业务方法 全流程，纯 API jar 运行无第三方依赖"
    command: "java -cp <jar>:<tmp> ConsumerInjectTest"

# 测试断言总数
# 上游：0（无测试源码）
# test_package：16 个断言
#   = 1 JAR 存在 + 1 编译 + 8 API 反射断言 + 5 消费者 E2E 流程断言 + 1 PASS
assertion_count: 16
