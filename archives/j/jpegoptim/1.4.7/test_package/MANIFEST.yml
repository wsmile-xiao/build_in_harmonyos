# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e
package: jpegoptim/1.4.7
homepage: "https://github.com/tjko/jpegoptim"

# Upstream test command (for analysis)
# Upstream ships no automated suite at all - evidence (run in the unpacked
# jpegoptim-1.4.7 tarball, all four commands return 0):
#   find . -maxdepth 3 -type d \( -name 'test*' -o -name 'spec*' \) | wc -l   -> 0
#   grep -cE '^[[:space:]]*(check|test|distcheck)[[:space:]]*:' Makefile.in    -> 0
#   grep -cE 'add_test|enable_testing|BUILD_TESTING' CMakeLists.txt            -> 0
#   grep -rlE 'BOOST_AUTO_TEST_CASE|TEST_CASE\(|^[[:space:]]*TEST\(' . | wc -l -> 0
# The tarball contains no .sh/.py file either; configure.in uses plain
# AC_INIT(jpegoptim.c) with no AM_INIT_AUTOMAKE, so there is no "make check".
upstream_check_command: "make check"

# conanfile.py build() method - upstream tests not integrated in build
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package tests (consumer-side verification of the packaged binary)
test_package_tests:
  - file: test.sh
    description: "5 个端到端用例：--version 版本横幅、--help 用法、-n -t 试算解码 16x16 且不改动文件、无损优化原地重写且体积不增长、--strip-all 剥离 COM 注释段"
    command: "sh test.sh <packaged jpegoptim> <fixture.jpg>"

# Assertion count (5 cases / 17 failure branches; counted with
#   grep -c '^echo "PASS' test.sh  -> 5
#   grep -c 'FAIL:' test.sh        -> 17)
assertion_count: 17
