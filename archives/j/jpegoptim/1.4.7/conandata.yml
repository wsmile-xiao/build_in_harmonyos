# conandata.yml - jpegoptim 1.4.7
# Source: upstream author's official distribution site (R39), with the GitHub
# tag tarball as fallback - the two are byte-identical (same sha256, verified).
sources:
  url:
    - "https://www.kokkonen.net/tjko/src/jpegoptim-1.4.7.tar.gz"
    - "https://codeload.github.com/tjko/jpegoptim/tar.gz/refs/tags/v1.4.7"
  sha256: "c52616f2fb8d481315871680f9943b0f58c553d1e0c49a6bd4691a3e66d7e6de"

patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: "Use umask 022 instead of 077 for config.status scratch directories (E011: HMDFS maps the directory owner to a different UID than the running process, so a drwx------/drwx--S--- temp dir stays unwritable)"
    patch_type: "platform"
  - patch_file: "patches/0002-tools-config.guess.patch"
    patch_description: "Teach the bundled config.guess to identify a native HarmonyOS (aarch64-unknown-linux-ohos) target"
    patch_type: "portability"
  - patch_file: "patches/0003-tools-config.sub.patch"
    patch_description: "Accept the linux-ohos kernel-OS pair in the bundled config.sub"
    patch_type: "portability"
