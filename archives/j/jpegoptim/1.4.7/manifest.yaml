# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E007: tarball 自带 tools/config.guess（timestamp 2012-02-10）与 tools/config.sub，不识别 HarmonyOS；注入的 *:HarmonyOS:*:* 分支必须自带 echo <三元组>; exit 0 —— 该代脚本主 case 之后没有 GUESS 变量的尾部兜底输出，只赋值 GUESS 会匹配成功却仍然报 cannot guess build type"
  - "E011（同族签名 E114）: configure 里 config.status 用 `umask 077 && mktemp -d ./confXXXXXX` 建临时目录，HMDFS 上进程 UID 与映射属主 UID 不同，目录连属主都不可写 → can't create ./confXXXXXX/subs1.awk: Permission denied；补丁改 umask 022"
  - "1.4.7 的手写 Makefile.in 编译规则是 `$(CC) $(CFLAGS) -c $<`、不带 -I 构建目录，因此不支持 out-of-tree（VPATH）构建，会 fatal error: 'config.h' file not found；配方把 folders.source 与 folders.build 设成同一个目录（同 ncurses 做法）"
  - "E074: make 必须 -j1，HMDFS 不允许创建 jobserver FIFO"
  - "package_type=application 的单二进制工具：package_info 里 libs=[]、bindirs=['bin']，并需要软件级 commands.json（R38）"
  - "OHOS 上 libjpeg 自带的 cjpeg/djpeg 无法执行（DT_RPATH 是相对路径，加载器按 CWD 解析 ../libjpeg.so 失败），因此测试图改为 base64 内嵌在 test_package/conanfile.py 中由 conan 自己的 Python 落盘"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/jpegoptim-1.4.7.orig
  source_work_dir: /storage/Users/currentUser/builds/jpegoptim-1.4.7.work
  generated_at: '2026-09-15T21:06:00'
  patches_count: 3

patch_classification:
  - file: 0001-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-tools-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-tools-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
