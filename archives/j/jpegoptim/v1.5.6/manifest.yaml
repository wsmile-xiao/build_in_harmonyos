software: jpegoptim
version: v1.5.6
category: graphics
status: built

build_system: autotools
compiler: clang
linker: GNU ld

dependencies:
  libjpeg-turbo: 3.1.4.1

configure_options:
  - "--prefix=$HOME/usr/local"

build_notes:
  - config.guess/config.sub 需要 OHOS 平台补丁（E007）
  - 简单的 autotools 项目，无需特殊配置

artifacts:
  - jpegoptim binary

source_url: https://github.com/tjko/jpegoptim/archive/refs/tags/v1.5.6.tar.gz