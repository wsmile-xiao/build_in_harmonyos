# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.5.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.5.5"

software: "jpegoptim"

# published | built | failed | archived
status: built

build_date: "2026-09-12"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/tjko/jpegoptim/archive/refs/tags/v1.5.5.tar.gz"
  sha256: "90a309d1c092de358bb411d702281ac3039b489d03adb0bc3c4ef04cf0067d38"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options: "-DLIBJPEG_INCLUDE_DIR=<conan libjpeg include> -DLIBJPEG_LIBRARY=<conan libjpeg lib> -DUSE_MOZJPEG=0"
  dependencies:
    - "libjpeg/10"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "jpegoptim 上游 CMake 默认 USE_MOZJPEG=1 会在构建期下载 MozJPEG；显式传 LIBJPEG_INCLUDE_DIR/LIBJPEG_LIBRARY 并设 USE_MOZJPEG=0 可走外置 libjpeg 分支（同作者 jpeginfo 同用 libjpeg/10）"
