# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jpegoptim/1.5.5
homepage: "https://github.com/tjko/jpegoptim"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无自动化测试（R51 清点证据）：jpegoptim 1.5.5 源码无 tests/ 目录，
# CMakeLists.txt 无 add_test/enable_testing，自带 Makefile.in 无 check 目标。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_jpegoptim.sh
    description: "真实运行 jpegoptim：版本输出、解析真实 JPEG 文件并报告尺寸、-m90 重压缩模式执行"
    command: "sh test_jpegoptim.sh jpegoptim test.jpg"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
