software: jpegoptim
display: "jpegoptim"
description: "Utility to optimize/compress JPEG files losslessly or to a given maximum quality (command-line)"
category: image
homepage: "https://github.com/tjko/jpegoptim"
license: GPL-2.0-or-later
build_system: mixed
ohos_adaptation:
  key_points:
    - "OHOS: tarball 自带的 tools/config.guess + tools/config.sub 不识别 HarmonyOS，需要注入 *:HarmonyOS:*:* 分支并让 config.sub 接受 -linux-ohos（E007）"
    - "OHOS: configure 的 config.status 用 `umask 077 && mktemp -d` 建临时目录，HMDFS 上属主也写不进去，改成 `umask 022`（E011，同族签名 E114）"
    - "OHOS: 1.4.7 的手写 Makefile.in 无 VPATH 支持，out-of-tree 构建会 'config.h' file not found，配方用 in-source 布局（source == build）"
    - "OHOS: make 必须 -j1，HMDFS 不允许建 jobserver FIFO（E074）"
    - "依赖 libjpeg/10（制品仓）；1.5.5 起上游改用 CMake 并默认 USE_MOZJPEG=1，需显式传外置 libjpeg 关掉内嵌下载"
versions:
  "1.4.7":
    status: built
    build_date: "2026-09-19"
    packaging: conan
    notes: "autotools 配方 + 3 个补丁（configure umask / config.guess / config.sub）；上游无自动化测试，test_package 5 个端到端用例"
    dependencies:
      - libjpeg/10
  "1.5.5":
    status: built
    build_date: "2026-09-12"
    packaging: conan
    notes: "CMake 配方，显式 LIBJPEG_INCLUDE_DIR/LIBJPEG_LIBRARY + USE_MOZJPEG=0"
    dependencies:
      - libjpeg/10
