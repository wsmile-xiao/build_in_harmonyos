package: jgrowl/1.4.10
homepage: "https://github.com/stanlemon/jGrowl"

# The test package runs the upstream JSHint bundle under Node.js on the OHOS worker.
upstream_check_command: "grunt test"
upstream_test_in_build: true
upstream_test_command: "python test_package/verify_upstream_jshint.py"
upstream_test_cases: 1
upstream_test_cases_passed: 1
upstream_test_pass_rate: "1/1"
upstream_tests:
  - file: Gruntfile.js
    source: "jGrowl-1.4.10/Gruntfile.js (JSHint target: Gruntfile.js + jquery.jgrowl.js)"
    description: "Execute JSHint 2.13.6 against the exact two upstream inputs and globals configured by grunt-contrib-jshint."
    command: "python test_package/verify_upstream_jshint.py"
test_package_tests:
  - file: verify_upstream_jshint.py
    description: "Execute the upstream JSHint 2.13.6 test case with Node.js and the exact pinned Grunt inputs."
    command: "conan create archives/j/jgrowl/1.4.10 --build=missing"
  - file: verify_assets.py
    description: "Check that the five distributed JS/CSS/source-map assets and MIT license are installed and non-empty."
    command: "conan create archives/j/jgrowl/1.4.10 --build=missing"

assertion_count: 6
