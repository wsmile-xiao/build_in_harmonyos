# 版本级 manifest
# 文件位置: archives/j/jansson/2.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.14"
software: "jansson"
status: built
build_date: "2026-09-04"
build_system: "cmake"

source:
  url: "https://github.com/akheron/jansson/archive/refs/tags/v2.14.tar.gz"
  sha256: "c739578bf6b764aa0752db9a2fdadcfe921c78f1228c7ec0bb47fa804c55d17b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DJANSSON_BUILD_SHARED_LIBS=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "jansson 2.14 上游 213 个 CMake/ctest 测试全部通过，无需补丁，原生支持 OHOS aarch64"
  - "CMake 4.x 需 CMAKE_POLICY_VERSION_MINIMUM=3.5 覆盖 2.14 声明的 cmake_minimum_required(2.8)（上游 2.15.1 已自行提升）"
  - "GitHub archive 源码包不含预生成 configure，CI 无 automake 时用 CMake 构建（与 2.15.x 系列先例一致）"
  - "CMake 构建的 libjansson.so 无 DT_SONAME，需 package() 补 SONAME 并重签（复用 2.15.1.1 修复方案）"
