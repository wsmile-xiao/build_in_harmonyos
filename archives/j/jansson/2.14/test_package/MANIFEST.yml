package: jansson/2.14
homepage: "https://github.com/akheron/jansson"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - name: api
    command: "test/suites/api/test_* (17 executables)"
    expected: "pass"
  - name: suites
    command: "test/suites/{encoding-flags,valid,invalid,invalid-unicode} via json_process"
    expected: "pass"
  - name: strip-variant
    command: "valid/invalid __strip variants via json_process --strip"
    expected: "pass"

test_package_tests:
  - file: test.c
    description: "jansson API round-trip: construct(json_object/json_string/json_integer/json_array) -> dumps -> loads -> verify -> decref"
    command: "./test_jansson"

assertion_count: 18
