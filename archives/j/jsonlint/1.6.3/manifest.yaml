software: jsonlint
# 版本级 manifest
# 文件位置: archives/j/jsonlint/1.6.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.3"

# 构建系统类型
build_system: custom

# 编译状态
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://registry.npmjs.org/jsonlint/-/jsonlint-1.6.3.tgz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: Node.js npm package, no traditional compile
  system: custom

  # 无传统 configure 选项
  configure_options:
    - "npm-install-global"

  # 运行时依赖
  dependencies:
    - "node/24.13.0"

  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "jsonlint是Node.js/npm包，不需要传统C编译流程"
  - "npm包安装方式：npm install -g jsonlint@version --prefix=$DEFAULT_PREFIX"
  - "npm包staging方式：cp -r $DEFAULT_PREFIX/lib/node_modules/jsonlint $TEST_PREFIX/$DEFAULT_PREFIX/lib/node_modules/jsonlint"
  - "npm包bin链接方式：ln -s ../lib/node_modules/jsonlint/lib/cli.js $TEST_PREFIX/$DEFAULT_PREFIX/bin/jsonlint"
