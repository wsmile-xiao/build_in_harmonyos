# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: json/1.0.1
homepage: "https://github.com/mjansson/json"

# 上游测试命令：json 1.0.1 为 header-only C99 单头文件库，无 make/ctest/meson；
# 上游唯一测试源为 json.h 内嵌 JSON_TEST 自测块（README 官方编译命令）。
upstream_check_command: "clang -D JSON_TEST -x c --std=c99 json.h"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: json.h
    source: json-1.0.1/json.h
    description: "内嵌 minimal test case（JSON_TEST 块）：标准 JSON parse + SJSON parse 两个场景，各 19 个 VERIFY_TOKEN 断言，输出 Minimal tests passed"
    command: "./json_selftest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：include json.h，调用 json_parse/sjson_parse 解析 JSON/SJSON 并断言 token 类型"
    command: "./test_json"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
