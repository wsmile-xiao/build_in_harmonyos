# test_ohos/MANIFEST.yml — json-build 1.2.0 HarmonyOS PC 专项验证

package: json-build/1.2.0
homepage: "https://github.com/lcsmuller/json-build"

# 执行方式
run_command: "python3 test_ohos/run_ohos_test.py <conan_package_folder>"

# 专项检查项
checks:
  - id: T1
    name: aarch64 ELF 验证
    description: 消费者可执行文件为 ELF64 AArch64 PIE，可在 OHOS 执行
  - id: T2
    name: musl libc
    description: 无 glibc / 无 ld-linux，符合 OHOS 运行时
  - id: T3
    name: .codesign 段
    description: OHOS 签名管线产出，可执行的前提
  - id: T4
    name: 无宿主绝对路径泄漏
    description: 产物不含 /storage、/home、/Users 等构建机路径（含 RPATH/RUNPATH）
  - id: T5
    name: 真实 JSON 序列化验证
    description: 仅通过公开头文件 json-build.h 与 jsonb_* 公开 API 构造 {"foo":[1,"hi",false,null]} 并校验输出

# 与上游测试、消费者用例的关系（分别计数，不重复充数）
relation: 本专项独立于上游 test/test.c、test/test_auto.c 与 test_package 消费者用例
