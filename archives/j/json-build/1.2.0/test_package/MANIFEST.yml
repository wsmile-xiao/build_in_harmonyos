# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: json-build/1.2.0
homepage: "https://github.com/lcsmuller/json-build"

# 上游测试命令 (test/Makefile: EXES = test test_auto fuzz)
upstream_check_command: "make -C test"

# conanfile.py build() 方法中是否已集成上游测试
# header-only 库无 build() 阶段；上游测试由 CI 按 test/Makefile 独立运行
upstream_test_in_build: false
upstream_test_command: "make -C test && ./test && ./test_auto"

# 上游实际运行的测试程序（greatest 框架，test=30 用例, test_auto=12 用例, fuzz=模糊器）
upstream_tests:
  - file: test/test.c
    source: json-build-1.2.0/test/test.c
    description: "主序列化 API 测试（greatest 框架，30 个 TEST 用例，102 断言）"
    command: "./test"
  - file: test/test_auto.c
    source: json-build-1.2.0/test/test_auto.c
    description: "自动缓冲区管理 API 测试（greatest 框架，12 个 TEST 用例，71 断言）"
    command: "./test_auto"
  - file: test/fuzz.c
    source: json-build-1.2.0/test/fuzz.c
    description: "模糊测试入口（需外部输入，非独立断言用例）"
    command: "./fuzz"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：仅通过公开头文件 json-build.h 与 jsonb_* 公开 API 构造 JSON 并校验输出"
    command: "./test_json-build"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 173
