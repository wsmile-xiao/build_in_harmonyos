# 版本级 manifest — ARCHIVE-SPEC v2.0
# 文件位置: archives/j/jupp/3.1.41/manifest.yaml

version: "3.1.41"
software: "jupp"

# published | built | failed | archived
status: built
build_date: "2026-09-25"
build_system: "autotools"

source:
  url: "https://deb.debian.org/debian/pool/main/j/jupp/jupp_3.1.41.orig.tar.gz"
  sha256: "7bb8ea8af519befefff93ec3c9e32108d7f2b83216c9bc7b01aef5098861c82f"
  tar_format: tar.gz
  # 取包口径（可复现举证见 notes.md「取包与官方源连通性」节）：上游官方站 t2.io 在本网络
  # 不可达（`curl -sSL` 逐字 `curl: (35) schannel: failed to receive handshake, SSL/TLS
  # connection failed`，两个路径变体同），故取 Debian 官方 archive 的 **pool 原件**
  # `jupp_3.1.41.orig.tar.gz`（`.orig` 按 Debian 政策即**未修改的上游原始发布件**，
  # deb.debian.org 是 Debian 官方 CDN，不是第三方站点镜像 ⇒ 不触 PF7/R39）。
  # Windows 侧与设备侧各下一遍：505002B 与 sha256 逐字一致 ⇒ url 与 sha256 同源同一件。
  # 解包根目录为 `jupp`（不带版本号）⇒ 配方 strip_root=True。

build:
  system: autotools
  configure_options:
    - "--build=<cpu>-unknown-linux-gnu"        # 配方把 settings.arch 映射成 autoconf CPU 名（armv8→aarch64；实测直拼 armv8 会被 config.sub 原样回显成非规范三元组）；两侧同写 -linux-gnu 是**偏离**检查清单 §12.1（ledmon 等用 -ohos）的实测决定：config.sub(2019) 逐字拒绝 -ohos，且传 --build 同时绕开 config.guess 往 $HOME 写临时件的不可写失败
    - "--host=<cpu>-unknown-linux-gnu"
    - "--prefix=<package_folder>"            # 运行期数据目录被编进二进制，prefix 必须等于包目录（见 notes.md 问题表 #1）
  dependencies: []                         # 实测零外部依赖：configure.ac:49 search_libs_term 默认空
  tool_dependencies: []                    # release 件自带 configure/config.sub/install-sh ⇒ 不需 autoreconf
  # ⚠ 构建期实际用到两个**设备侧系统工具**（不在 conan 中心，故不入 tool_dependencies，在此如实登记）：
  #   llvm-objcopy 与 binary-sign-tool（E077 交付签名）。二者缺失时配方只告警并跳过自签，
  #   不会谎报"已签名"（实测本机路径 ~/usr/local/bin 下可得）。
  cc: clang
  cxx: clang++
  package_type: application
  # 真机包实测：共 34 个文件；顶层 = bin / etc/joe / licenses / share
  artifacts:
    - bin/joe
    - bin/termidx
    - bin/jupp
    - bin/jmacs
    - bin/jpico
    - bin/jstar
    - bin/rjoe
    - etc/joe/joerc
    - etc/joe/jupprc
    - etc/joe/jmacsrc
    - etc/joe/jpicorc
    - etc/joe/jstarrc
    - etc/joe/rjoerc
    - etc/joe/syntax/            # 21 个 .jsf 语法定义
    - etc/joe/charmaps/klingon   # jupp 分支独有 charmap（1 个）
    - share/man/man1/joe.1
    - licenses/COPYING

patches_applied: []
# ⚠ 无 .patch 文件 ≠ 上游件零改动：配方 build() 内**原地**把 `configure` 的 `umask 077`
#   改 `umask 022`（E011/E114，HMDFS 下 config.status 的 077 临时目录不可写），
#   该改动不经 patches 机制，已在 notes.md「对上游件的实际改动」显式申报。

tests:
  # 五维账本（详见 notes.md 与 test_package/MANIFEST.yml）
  # N_static=0 的举证（不是一句 grep）：
  #   ① `Makefile.am`/`Makefile.in` 无 `TESTS=` 也无 `check_PROGRAMS=`（实测零命中）；
  #   ② 全树只有顶层一个 Makefile.in，含 automake **样板** `check:` 1 处，非测试注册；
  #   ③ 真机 `make -n check` 只回显 stamp-h1 头文件重建步骤，无任何测试执行；
  #   ④ 源树 158 个文件（49 .c / 45 .h / 30 .in）grep add_test/TEST_CASE/pytest 零命中。
  #   ⇒ 上游确无自动化套件，如实记 0；未虚构"跑过 make check"，也未删除/跳过任何用例。
  upstream_tests: []
  upstream_static_count: 0
  registered_count: 0
  executed_count: 0
  passed_count: 0
  failed_count: 0
  no_criterion_count: 0
  skipped_count: 0
  # 消费者测试：交付脚本内 6 个 pass 站点，与真机打印的 6 行 ASSERT_OK 一一对应
  # （结构 1 + 行为 3[A1/A2/A3] + 契约签名 2[A4/A5]）
  consumer_count: 6
  consumer_passed: 6
  consumer_behavioral: 3         # A1/A3 termidx 真跑 rc=0 + A2 编译期常量回归锁
  consumer_contract_signature: 3 # structure 硬核验 + A4 无 tty 失败签名 + A5 argv[0] 分发
  # 注：A4 断言的是"无控制终端时**必然失败且失败原因符合上游契约**"，
  # 属真实行为核验，不并入任何"上游测试通过率"。

knowledge_gained:
  - ref: "notes.md#遇到的问题与解决方案 表行 #1"
    text: "上游把运行期数据目录作编译期常量烤进二进制（Makefile.in:270 INCLUDES=-DJOERC=…，实测代入 sysconfjoesubdir=/joe、sysconfdir=${prefix}/etc），conan 默认 --prefix=/ + DESTDIR staging 会让常量与落点不一致 ⇒ 修法=--prefix=package_folder 且 package() 传空 DESTDIR= 压掉框架注入的 staging 前缀（GNU make 同名变量后者胜出），零补丁"
  - ref: "notes.md#遇到的问题与解决方案 表行 #2、#3"
    text: "config.sub(2019 版) 仍不认 aarch64-unknown-linux-ohos ⇒ 显式 --build/--host=<autoconf CPU>-unknown-linux-gnu（settings.arch 经映射：armv8→aarch64），真实目标由 CC 侧 OHOS wrapper 决定；传 --build 同时绕开 config.guess 往 $HOME 根写 dummy.c 的不可写失败"
  - ref: "notes.md#遇到的问题与解决方案 表行 #6"
    text: "交互式 TUI 类包（上游在参数校验前就 open(/dev/tty)）在无控制终端的 CI 里不可能 rc=0 ⇒ 消费者测试的可断言面改到包内非交互工具（本包 bin/termidx: stdin→自带解析器→stdout），并对 TUI 断言其真实失败签名而非伪装通过"
  - ref: "notes.md#更正本任务登记备注的旧结论"
    text: "Debian pool 的 jupp orig 件自带 configure（Autoconf 2.61-MirPorts-3 生成）⇒ 不需要 autoreconf -fi，也不需要 CI worker 缺 automake/aclocal 时的 ELF perl launcher 兜底"
  - ref: "notes.md#遇到的问题与解决方案 表行 #4、#5、#7"
    text: "E077 落地：链接产物的 .codesign 是 4096B 占位段，自签前必须 llvm-objcopy --remove-section .codesign；调用 binary-sign-tool 需 env -u LD_LIBRARY_PATH 否则签名器自身重定位失败；工具缺失只告警不谎报"
