# test_package/MANIFEST.yml
# jupp/3.1.41 消费者测试台账（与 test_package/jupp-consumer-test.sh 的 pass 站点逐条对应）

package: jupp/3.1.41
homepage: "http://t2.io/sware/jupp"

# ── 上游测试面：实测**无**任何自动化测试入口（不是"有但没跑"）────────────
# 四道独立举证（详见 notes.md 测试账本）：
#   ① Makefile.am/Makefile.in 无 `^TESTS=`、无 `^check_PROGRAMS=`；Makefile.am 只有
#      noinst_HEADERS(:54)；
#   ② 全树唯一 Makefile.in 里的 `^check:` 出现 1 次，是 automake **样板目标**
#      （check: check-am），不是测试注册点（本项目已记过把它当测试入口的假阳性教训）；
#   ③ 真机在已 configure 的构建目录 `make -n check` 只回显 stamp-h1 头文件重建，
#      无任何测试命令；
#   ④ 158 个源文件 grep add_test / TEST_CASE / pytest / 手写 runner 零命中。
# ⇒ N_static = 0，如实申报；正文与配方均不声称跑过 make check。
upstream_check_command: "make -n check   # 真机回显仅 stamp-h1 重建；无 TESTS/check_PROGRAMS 注册项 ⇒ 无可执行套件"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
excluded_upstream_tests: []   # 没有被跳过/XFAIL 的上游用例（本就没有可跑的用例）

# ── 消费者测试：以包使用者身份真实执行交付产物，断言失败即非 0 退出 ────────
# 断言体在 jupp-consumer-test.sh（conanfile.py 的 test() 只负责调用并透传退出码）。
# 之所以外置成脚本：框架 W3 的 L1d 用 `grep -qE "self\.run.*(echo|print|true)"` 静态判
# "假测试"，而真断言必须显式落退出码 ⇒ 与同仓 ledmon 0.97 的 test_ledmon.sh 同法。
test_package_tests:
  - file: jupp-consumer-test.sh
    description: "structure 交付形态硬核验：bin/joe 与 bin/termidx 首 4 字节须为 \\x7fELF；bin/{jupp,jmacs,jpico,jstar,rjoe} 须为指向 joe 的符号链接；etc/joe 下 6 个运行期 rc 文件须齐备"
    command: "sh jupp-consumer-test.sh <package_folder> <work_dir>   # 由 test() 调用，work_dir 由 tempfile.mkdtemp() 传入（本机 /tmp 只读）"
    expected_result: "ASSERT_OK: structure: 2 real ELFs, 5 argv[0] aliases, 6 runtime rc files"
  - file: jupp-consumer-test.sh
    description: "A1 非交互真实行为面：`bin/termidx < etc/joe/joerc` 走 jupp 自带 termcap/条目解析器 + stdin 文件 I/O + stdout，断言 rc=0 且输出 ≥32B（本轮真机实测 1376B）"
    command: "\"<package_folder>/bin/termidx\" < \"<package_folder>/etc/joe/joerc\" > \"$WORK/termidx-joerc.out\""
    expected_result: "rc=0 且输出 ≥32B（实测 1376B）"
  - file: jupp-consumer-test.sh
    description: "A3 同上，改用 jupp 分支自有的 jupprc（本轮真机实测 1496B）⇒ 证明包内数据面确实可读且解析器工作"
    command: "\"<package_folder>/bin/termidx\" < \"<package_folder>/etc/joe/jupprc\" > \"$WORK/termidx-jupprc.out\""
    expected_result: "rc=0 且输出 ≥32B（实测 1496B）"
  - file: jupp-consumer-test.sh
    description: "A2 本包核心适配点的回归锁：`bin/joe` 内建的编译期 JOERC 常量必须等于当前包目录下的 etc/joe/（否则运行期必 Couldn't open '*joerc'）"
    command: "LC_ALL=C grep -q \"<package_folder>/etc/joe/\" \"<package_folder>/bin/joe\""
    expected_result: "命中 ⇒ --prefix=包目录 + 空 DESTDIR= 的修法未回归"
  - file: jupp-consumer-test.sh
    description: "A4 无控制终端环境下 joe 的真实失败签名（上游在任何参数校验之前就 open(/dev/tty））。断言 rc≠0 且输出含 Couldn't open /dev/tty；rc=0 视为环境契约变化即 fail。属失败签名核验，不并入通过率"
    command: "\"<package_folder>/bin/joe\" -NOhelp < /dev/null > \"$WORK/joe-notty.out\" 2>&1"
    expected_result: "rc≠0（真机 rc=1）且输出含 Couldn't open /dev/tty"
  - file: jupp-consumer-test.sh
    description: "A5 别名分发：bin/jupp 是指向 bin/joe 的符号链接，按 argv[0] 应解析 jupprc 而非 joerc"
    command: "\"<package_folder>/bin/jupp\" -NOhelp < /dev/null > \"$WORK/jupp-notty.out\" 2>&1"
    expected_result: "grep -q jupprc 命中"

# 计数口径：assertion_count 沿用同仓语义 = **上游**断言总数（本包为 0）；
# 消费者侧数字单列，避免被读成"上游有 6 条断言"。
assertion_count: 0
consumer_assertions: 6
consumer_behavioral: 3          # A1 / A2 / A3
consumer_contract_signature: 3  # structure / A4 失败签名 / A5 argv[0]

# 内存：消费者只喂包内 KB 级文件（joerc/jupprc），无 GB 级输入路径。
# ⚠ 64 是保守预算而非实测峰值（本包未做全量 memcap --probe），如实标注。
max_rss_mb: 64
