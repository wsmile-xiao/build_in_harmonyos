version: "4.0.1"
status: published
build_date: "2026-09-27"
conan_ref: "jakarta-cdi-api/4.0.1"
source:
  url: "https://github.com/jakartaee/cdi/archive/refs/tags/4.0.1.tar.gz"
  sha256: "5f213212ee8839036915f4fd66578421f6ea181aa7f62d1c34bcb942edba02a6"
build:
  system: maven
  dependencies:
    - bishengjdk 17.0.13
    - apache-maven 3.9.11（配方自取，sha256 校验）
patches_applied:
  - cdi-0001-jdk17-doclint.patch
upstream_tests:
  framework: testng
  test_files: 33
  test_classes: 12
  test_methods: 56
  test_command: "mvn clean package -B -DskipTests=false"
  run_in_build: true
upstream_test_pass_rate: "56/56（真机构建时 surefire 执行，Tests run: 51+5=56，Failures/Errors/Skipped 全 0，2026-09-27）"
adapted_test_pass_rate: "真机 19/19 探针（HarmonyOS PC aarch64，conan create 消费者探针 2 JAR + 1 编译 + 19 反射 + 1 PASS，2026-09-27）；conan-verify 八门禁 Verdict PASS（可标记 status: published，G0-G4+L2/L4/L5 全 PASS）；本地 Windows JDK 17.0.17 19/19"
knowledge_gained:
  - "源码编译方式：GitHub tarball + Maven reactor（spec/lang-model/api 三模块，根目录一次 mvn clean package）；上游无 mvnw，配方自取 apache-maven 3.9.11 并 sha256 校验"
  - "上游测试：56 个 TestNG 方法全在 api 模块（33 个 test 源文件 / 12 个测试类；lang-model 与 spec 模块无测试源码），-DskipTests=false 时在 package 阶段执行"
  - "产物两个 JAR：jakarta.enterprise.cdi-api-4.0.1.jar + jakarta.enterprise.lang-model-4.0.1.jar，均进 libexec/（api 依赖 lang-model，消费者需两 jar 同在 classpath）"
  - "JDK 17.0.13+ 兼容：api/pom.xml 的 maven-javadoc-plugin 需 doclint:none（补丁 0001）；reactor 已 pin maven-bundle-plugin 5.1.2，无 jakarta-inject-api 遇到的 bnd/ZipFile 问题"
  - "cdi-api jar 不内嵌 jakarta.inject/interceptor/annotation/el 类（jar 清单仅 jakarta/enterprise/*）；test_package 探针只在两 jar + JDK 范围内断言，避开跨 jar 超接口解析"
  - "test_package 反射断言 19 项：11 类型加载（context/inject/event/util 与 lang-model）+ 三作用域注解 @NormalScope 元注解契约（SessionScoped passivating=true）+ @NormalScope @Target(ANNOTATION_TYPE) + Event 3 个 select() 重载 + AnnotationLiteral 实现 Annotation + lang-model types.Type 接口继承"
  - "R32: validate() 检查 settings.os in (Linux, OHOS)"
  - "R38: 库包，不需要 commands.json"
  - "真机实踩（2026-09-27，HarmonyOS PC aarch64）：OHOS 无 curl 且 python3 无 CA bundle（repo1.maven.org TLS 报 CERTIFICATE_VERIFY_FAILED）→ _ensure_maven 加 python3 urllib 免证书回退，sha256 钉校验兜底完整性"
  - "真机实踩：HMDFS 文件系统禁 shebang 直接 exec（mvn 脚本报 bad interpreter: Permission denied，ELF 二进制不受影响）→ build() 显式 sh {maven_home}/bin/mvn 调用"
  - "真机实踩：spec-doc 模块 asciidoctor-maven-plugin（JRuby）generate-pdf-doc 报 concurrent-ruby gemspec ENOENT → OHOS 上 -Dasciidoctor.skip=true 跳过纯文档模块（产物不打包），Linux CI 仍全量构建"
  - "真机验证通道：ghfast.top 读超时时，设备侧临时将 conandata 源指向本机 http.server 镜像（sha256 不变）完成验证；提交配方保持官方原始 URL（R39）"
