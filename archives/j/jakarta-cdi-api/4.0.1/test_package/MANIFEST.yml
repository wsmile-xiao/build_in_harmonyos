# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jakarta-cdi-api/4.0.1
homepage: "https://github.com/jakartaee/cdi"

# 上游测试通过 Maven 运行（mvn clean package -B -DskipTests=false，package 阶段含 test）
# 上游测试全部在 api 模块：33 个 test 源文件 / 12 个测试类 / 56 个 TestNG 方法，0 失败
upstream_check_command: "mvn clean package -B -DskipTests=false"
upstream_test_in_build: true
upstream_test_command: "mvn clean package -B -DskipTests=false"

# 上游测试用例（在 build() 中运行）
# 统计来源：api/target/surefire-reports/junitreports/TEST-*.xml 12 份，tests 求和 = 56，
# failures=0 / errors=0 / skipped=0；lang-model 与 spec 模块无 src/test 目录
upstream_tests:
  - file: api/src/test/java/org/jboss/cdi/api/test/
    source: cdi-4.0.1.tar.gz/api/src/test/java/org/jboss/cdi/api/test/
    description: "上游 TestNG 测试 56 个方法：AnnotationLiteral/CDI/Annotated*（构造函数/字段/方法/参数/类型）/事件选项/特权/SE 容器初始化；lang-model 与 spec 模块无测试源码"
    command: "mvn clean package -B -DskipTests=false"

# test_package 中自带的测试 (消费者视角验证，在鸿蒙真机运行)
test_package_tests:
  - file: test.sh
    description: "编译并运行 Java 反射测试程序，验证 cdi-api + lang-model 两个 JAR 的核心类型与注解契约可加载可用 (R34 实质性验证)"
    command: "bash test.sh"

# 测试断言总数
# 上游：56（TestNG 方法，构建时运行）
# test_package：23 个断言（2 JAR 存在性 + 1 编译 + 19 反射断言 + 1 PASS）
assertion_count: 79
