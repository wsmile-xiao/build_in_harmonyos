# test_package/MANIFEST.yml
# 上游官方测试声明文件 + HMBS test-count 声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: jenkins-cli/0.0.47
homepage: "https://github.com/jenkins-zh/jenkins-cli"

# ── 上游测试审计（守则「上游测试套件执行」）──────────────────────────────
# jenkins-cli 是 Go CLI（go.mod 要求 go 1.23；二进制名 jcli）。上游官方测试
# 通过 `go test -v ./...` 运行（Makefile `test` 目标即 go test，官方 CI 用
# `go test ./...`）。统计口径 = go test 函数计数：`go test -v ./...` 对每个
# 顶层 `TestXxx` 输出一行 `--- (PASS|FAIL|SKIP): TestXxx`（子测试带前导空格
# 被忽略）。本版本全模块盘点出 40 个顶层 Test* 函数（20 个 *_test.go /
# 13 个测试包），逐个如下（来源：源码 `^func Test[A-Za-z0-9_]*\(`）：
#
#   app/cmd（ginkgo，TestCmd 汇总全部 spec）:
#     setup_test.go: TestCmd ; cwp_test.go: TestDownload, TestGetLatest ;
#     plugin_formula_test.go: TestSortPlugins                      = 4
#   app/cmd/common（ginkgo）: setup_test.go: TestCmd               = 1
#   app/cmd/keyring（标准 testing）:
#     core_test.go: TestSaveTokenToKeyring, TestLoadTokenFromKeyring,
#                   TestDelToken                                    = 3
#   app/health（ginkgo）: setup_test.go: TestHealth                = 1
#   app/helper（ginkgo）: setup_test.go: TestApp                   = 1
#   app/i18n（ginkgo）: setup_test.go: TestI18n                    = 1
#   client（ginkgo 汇总 + release 标准测试）:
#     setup_test.go: TestJenkinsClient ; release_test.go: TestInit,
#     TestGetLatestReleaseAsset, TestGetLatestJCLIAsset,
#     TestGetJCLIAsset, TestGetReleaseAssetByTagName               = 6
#   util（ginkgo）: setup_test.go: TestUtils ; cmd_test.go:
#     TestShellProcessSuccess                                      = 2
#   e2e（标准 testing，TestMain 需真实 Jenkins）:
#     doc_test.go: TestDoc ; root_test.go: TestRoot ; computer_test.go:
#     TestListComputers ; job_test.go: TestListJobType ;
#     plugin_test.go: TestListPlugins, TestSearchPlugins,
#     TestCheckUpdateCenter, TestInstallPlugin, TestDownloadPlugin ;
#     shutdown_test.go: TestShutdown ; queue_test.go: TestListQueue ;
#     config_test.go: TestConfigList, TestConfigGenerate,
#     TestShowCurrentConfig                                        = 14
#   e2e/withdependencies（TestMain 需真实 Jenkins）:
#     job_test.go: TestSearchJobs, TestCreateJob ; credential_test.go:
#     TestListCredentials                                         = 3
#   e2e/without_jenkins（标准 testing，无需 Jenkins，只依赖已构建 jcli）:
#     completion_test.go: TestBashCompletion, TestZshCompletion,
#     TestPowerShellCompletion, TestFishCompletion                 = 4
#
#   合计 = 40
#
# 可运行性说明：40 个顶层 Test* 中，根 e2e/（14 个）+ e2e/withdependencies
# （3 个）= 17 个是“活 Jenkins 集成测试”：其 TestMain（e2e/setup_test.go、
# e2e/withdependencies/setup_test.go）在 JENKINS_VERSION 未设置时直接 return，
# 不调用 m.Run()，因此真机上这些包 go test 只打印 `ok <pkg> 0.xxx s`、0 条
# Test* 判定行。它们不是缺依赖，而是需要真实 Jenkins + Java 运行环境的
# 集成测试（上游 CI 亦需 Jenkins），归入 environment gap。其余 23 个（全部
# 单元测试包 + e2e/without_jenkins 4 个 completion 用例）可在真机真实执行：
# 配方会先构建并签名 jcli、置入 PATH，再以 `-exec` 签名包装器运行
# `go test -v ./...`。23 个在 go-test 框架下逐条产生 PASS/FAIL/SKIP 判定。
#
# 统计口径（upstream_test_total=40）：go test 函数计数（全模块顶层 Test*
# 函数出现次数，ginkgo 包按其唯一 Test* 入口计 1；与 `go test -v ./...`
# 输出的 `--- (PASS|FAIL|SKIP): Test*` 行一一对应，确定性可复核）。
#
# rule4 缺口核算（gaps 总数 == discovered - passed）：conanfile.py 把所有
# 未通过项计入 gaps——FAILED 测试（completion 输出断言）→ category
# `test_failure`；框架 t.Skip → `ohos_feature`；无判定（活 Jenkins 集成
# 测试）→ `environment`。真机预检（首轮）：discovered=40、executed=21、
# passed=17、failed=4、skipped=0 → gaps = 4(test_failure)+19(environment)=23
# = 40-17，status=failed（如实，不伪装通过）。

upstream_tests_exist: true
upstream_test_total: 40
upstream_test_count_method: go_test_functions

upstream_test_audit:
  source: "github.com/jenkins-zh/jenkins-cli v0.0.47（go mod github.com/jenkins-zh/jenkins-cli）"
  build_system: "go test -v ./..."
  test_definition: "顶层 func Test* 函数计数（go test 函数口径；ginkgo 包按其唯一 Test* 入口计 1）"
  dependency: "Go 工具链 >= 1.23（配方自举下载，sha256 校验）；纯 Go 依赖，CGO_ENABLED=0，无 C 库依赖"
  runnable: 23
  not_runnable: 17
  not_runnable_reason: "根 e2e/（14）+ e2e/withdependencies（3）= 17 个集成测试需真实 Jenkins 服务器（TestMain 依赖 JENKINS_VERSION 启动 Jenkins）；真机无此环境，go test 对这些包输出 0 判定。非缺依赖，属 environment gap。"

# 上游测试命令 (用于 go test 分析)
upstream_check_command: "go test -v ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "go test -v ./..."

# 上游实际运行的测试程序（包级组织，函数级见 upstream_test_audit）
upstream_tests:
  - file: app/cmd/setup_test.go
    source: jenkins-cli-0.0.47/app/cmd/setup_test.go
    description: "ginkgo 汇总 TestCmd（app/cmd 全部 spec）+ cwp/plugin_formula 标准测试（共 4 个 Test*）"
    command: "go test -v ./app/cmd"
  - file: app/cmd/keyring/core_test.go
    source: jenkins-cli-0.0.47/app/cmd/keyring/core_test.go
    description: "keyring 令牌保存/读取/删除（3 个 Test*，keyring.MockInit 离线）"
    command: "go test -v ./app/cmd/keyring"
  - file: client/release_test.go
    source: jenkins-cli-0.0.47/client/release_test.go
    description: "GitHub Release 客户端 + ginkgo 汇总（6 个 Test*，httptest mock 离线）"
    command: "go test -v ./client"
  - file: e2e/without_jenkins/completion_test.go
    source: jenkins-cli-0.0.47/e2e/without_jenkins/completion_test.go
    description: "shell completion 输出（4 个 Test*，执行已构建 jcli，无需 Jenkins）"
    command: "go test -v ./e2e/without_jenkins"

# test_package 中自带的测试（消费者视角验证，L1 门禁）
test_package_tests:
  - file: test.sh
    description: "执行打包的 bin/jcli：`jcli version` 断言输出 Version: v0.0.47（ldflags 注入），`jcli --help` 断言 usage（R34 反空壳）"
    command: "bash test.sh"

# 测试断言总数（版本断言 + help 断言，实数；上游 40 见 upstream_test_total）
assertion_count: 2
