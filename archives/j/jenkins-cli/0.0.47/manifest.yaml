# jenkins-cli (jenkins-zh/jenkins-cli) 0.0.47 适配清单
# Jenkins CLI（二进制 jcli）：管理 Jenkins 的命令行工具（Go）。
# 纯 Go 依赖，CGO_ENABLED=0；需 Go 工具链 >= 1.23（go.mod go 1.23）。

version: "0.0.47"
software: "jenkins-cli"
status: built

source:
  url: "https://github.com/jenkins-zh/jenkins-cli/archive/refs/tags/v0.0.47.tar.gz"
  sha256: "4e78600e214c357c08a0a83fe9cc59214b0d050de07dbb469d9f226c8c37eabc"
  tar_format: tar.gz

build:
  system: go
  configure_options: []
  cc: clang
  notes: "Go 1.26.5 SDK 配方内自举下载（arm64/amd64，sha256 校验）；CGO_ENABLED=0 纯静态；OHOS ELF 签名（binary-sign-tool）；go link 在 HMDFS 上 mmap 失败，链接/GOCACHE/TMPDIR 指向 ext2 工作区；版本注入 -X=github.com/linuxsuren/cobra-extension/version.version=v0.0.47 使 jcli version 输出 Version: v0.0.47"

patches_applied: []

test:
  upstream_cases: 40
  upstream_suite: "go test -v ./...（20 个 *_test.go / 13 包；ginkgo 包按唯一 Test* 入口计 1）"
  runnable: 23
  runnable_note: "23/23 单元+completion 用例在真机实际执行（go-test 判定行）；17 个活 Jenkins 集成测试（根 e2e/ 14 + e2e/withdependencies 3）无法在无 Jenkins 真机执行，environment gap"
  consumer_test: "test_package 执行 jcli version（Version: v0.0.47）+ jcli --help（usage）冒烟"

knowledge_gained:
  - "jenkins-cli (jcli) 是 Go CLI（go.mod go 1.23），纯 Go 依赖无 C 库，CGO_ENABLED=0 静态构建；Go SDK 自举下载参考 vibcheck/algolia 先例"
  - "OHOS 上未签名 ELF 无法 exec：go 工具链二进制与最终产物 jcli 均需 binary-sign-tool 签名（先 llvm-objcopy --remove-section .codesign 再 sign）"
  - "go link 在 hmdfs 上 mmap 失败（permission denied）：链接输出/GOCACHE/TMPDIR/GOMODCACHE 指向可写 ext2 工作区"
  - "go test 测试二进制未签名无法 fork/exec：go test -exec 签名包装器（先签名再 exec）"
  - "版本注入：上游 goreleaser 用 -X=github.com/linuxsuren/cobra-extension/version.version 注入版本，jcli version 输出 Version: <ver>"
  - "统计口径：go test 函数计数——ginkgo 包（app/cmd、client、util 等）所有 spec 汇总到唯一 Test* 入口，`go test -v ./...` 每顶层 Test* 一行判定，共 40"
  - "根 e2e/ 与 e2e/withdependencies 的 TestMain 在无 JENKINS_VERSION 时直接 return（不 m.Run），这些集成测试需真实 Jenkins，真机 0 判定 → environment gap"
