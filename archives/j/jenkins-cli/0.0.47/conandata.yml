# conandata.yml — jenkins-cli 0.0.47
# Single source of truth for the upstream source tarball URL + SHA256 + Go toolchain.
# conanfile.py reads this via self.conan_data["sources"] and
# self.conan_data["go_toolchain"].
#
# Upstream: https://github.com/jenkins-zh/jenkins-cli (tag v0.0.47).

sources:
  # Official upstream GitHub release tarball for tag v0.0.47.
  # Ordered list: gh-proxy mirror first (spec rule 3.18b), official URL last.
  url:
    - "https://gh-proxy.com/https://github.com/jenkins-zh/jenkins-cli/archive/refs/tags/v0.0.47.tar.gz"
    - "https://github.com/jenkins-zh/jenkins-cli/archive/refs/tags/v0.0.47.tar.gz"
  sha256: "4e78600e214c357c08a0a83fe9cc59214b0d050de07dbb469d9f226c8c37eabc"

# Go toolchain used to build + run upstream tests when the device has no go
# (or only a go older than the go.mod 1.23 directive).  ali/mirrors sha256 are
# the official go.dev distribution hashes, verified in this repo
# (vibecheck/1.7.7 + algernon/1.17.10 precedent).
go_toolchain:
  version: "1.26.5"
  linux-amd64:
    url: "https://mirrors.aliyun.com/golang/go1.26.5.linux-amd64.tar.gz"
    sha256: "5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053"
    filename: "go1.26.5.linux-amd64.tar.gz"
  linux-arm64:
    url: "https://mirrors.aliyun.com/golang/go1.26.5.linux-arm64.tar.gz"
    sha256: "fe4789e92b1f33358680864bbe8704289e7bb5fc207d80623c308935bd696d49"
    filename: "go1.26.5.linux-arm64.tar.gz"

# No patches required — jenkins-cli is a pure-Go CLI (CGO_ENABLED=0), built
# with the Go toolchain; no source-level portability patches on HarmonyOS.
patches: []
