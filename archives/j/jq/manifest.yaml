software: jq
display: "jq"
description: "Command-line JSON processor"
category: data
homepage: "https://jqlang.github.io/jq/"
license: MIT / CC-BY-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "标准 autotools 补丁：config.guess + config.sub"
    - "含 autotools 子模块（oniguruma）的需单独修复子模块 config.guess"
    - "子模块 config.guess 中可能有重复的 HarmonyOS 条目需清理"
    - "BusyBox script 不支持 -e 选项，导致 shtest 失败（平台限制，非功能问题）"
  common_dependencies:
    - oniguruma

versions:
  "1.7.1":
    status: partial
    build_date: "2026-04-13"
