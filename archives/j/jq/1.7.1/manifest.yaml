# jq 1.7.1 编译档案

software: jq
version: 1.7.1
status: success
build_system: autotools
compile_date: 2026-03-22

dependencies:
  required: []
  optional: [oniguruma]

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
    - --without-oniguruma
  env:
    CC: clang
    CFLAGS: "-fPIC -O2"
    TMPDIR: $HOME/tmp

patches_applied:
  - file: patches/0001-config-guess-harmonyos-support.patch
    purpose: 添加 HarmonyOS 平台识别到 config.guess
    lines_changed: 10
  - file: patches/0002-config-sub-harmonyos-support.patch
    purpose: 添加 linux-ohos 三元组支持到 config.sub
    lines_changed: 15

compatibility:
  level: high
  issues: []
  notes: |
    - 核心功能正常
    - 未启用 oniguruma（正则表达式支持）
    - 可选：编译 oniguruma 后重新编译 jq 获得完整功能

test_results:
  type: official
  total: 6
  passed: 5
  failed: 1
  note: |
    官方测试套件结果:
    - PASS: tests/mantest
    - PASS: tests/jqtest
    - FAIL: tests/shtest (环境兼容性问题)
    - PASS: tests/utf8test
    - PASS: tests/base64test
    - PASS: tests/optionaltest
    
    失败原因: shtest 中的 NO_COLOR 测试使用 `script -qec` 模拟 TTY，
    但 HarmonyOS 的 BusyBox script 不支持 -e 选项。这是环境限制，
    非 jq 编译问题。jq 核心功能全部正常。

knowledge_gained:
  - "Autotools 项目需要修改 config.guess 和 config.sub 来支持 HarmonyOS"
  - "三元组格式: aarch64-unknown-linux-ohos"
  - "LIBC 在 HarmonyOS 上应设置为 musl"

references:
  - title: jq 官方网站
    url: https://jqlang.github.io/jq/
  - title: jq GitHub
    url: https://github.com/jqlang/jq

maintainer: OpenHarmony PC Developer社区
last_updated: "2026-03-22"
tags: [jq, json, cli, autotools]