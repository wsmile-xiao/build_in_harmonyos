  notes: |
    - 核心功能正常
    - 已启用 bundled oniguruma（正则表达式支持完整）
    - 本次编译使用 bundled oniguruma，无需系统安装

test_results:
  type: official
  total: 8
  passed: 7
  failed: 1
  note: |
    官方测试套件结果:
    - PASS: tests/mantest
    - PASS: tests/jqtest
    - FAIL: tests/shtest (BusyBox script -e 不兼容)
    - PASS: tests/utf8test
    - PASS: tests/base64test
    - PASS: tests/optionaltest
    - PASS: tests/onigtest
    - PASS: tests/manonigtest
    
    失败原因: shtest 中的 TTY 测试使用 `script -qec` 模拟 TTY，
    但 HarmonyOS 的 BusyBox script 不支持 -e 选项。这是环境限制，
    非 jq 编译问题。jq 核心功能全部正常。

knowledge_gained:
  - "Autotools 项目需要修改 config.guess 和 config.sub 来支持 HarmonyOS"
  - "三元组格式: aarch64-unknown-linux-ohos"
  - "含 autotools 子模块的项目（如 jq+oniguruma）需要对子模块的 config.guess 单独修复"
  - "子模块 config.guess 中的 HarmonyOS 补丁可能包含重复条目，需要清理"
  - "BusyBox script 不支持 -e 选项，导致部分测试失败（平台限制）"

