# 版本级 manifest — jose 15
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "15"

# 软件名
software: "jose"

# 编译状态
# published | built | failed | archived
# 制品尚未上传制品仓（PR/CI 未完成）→ built（R29：PASS 未 upload = built）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag v15）
  url: "https://github.com/latchset/jose/archive/refs/tags/v15.tar.gz"

  # 源码校验和（与 conandata.yml 一致）
  sha256: "d480f1f30dc11b7e81cd2939f9f0ef512090b131a11f68595483a2de0550fa89"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "-Ddocs=disabled"
    - "-Dwerror=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "jansson/2.15.1.1"
    - "openssl/3.5.8.1"
    - "zlib/1.3.1.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无上游源码改动）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（本轮真实验证，路径判断见 reports/knowledge-candidate-ledger.md）
knowledge_gained:
  - "OHOS musl 仅加载带有效 .codesign 的共享库/可执行；conan 构建产物须在 package() 内 binary-sign-tool -selfSign 签名，否则 test_package 运行时 dlopen Permission denied / symbol not found（对应 E077）"
  - "制品仓 zlib/1.3.2 静态库非 -fPIC，链入共享库会触发 R_AARCH64 重定位失败；应选用制品仓 -fPIC 版本 zlib/1.3.1.1（先例 qpdf/cairo）"
  - "jose 上游 meson 用 dependency('libcrypto') 探测，PkgConfigDeps 按包名只生成 openssl.pc，需在 generate() 内补齐 libcrypto.pc/libssl.pc"
  - "OHOS profile 仅注入 clang，meson 探测 llvm-ar/llvm-nm 走 PATH 失败，需在 generate() 用 tc.binaries 显式注入全部 LLVM 工具链"
