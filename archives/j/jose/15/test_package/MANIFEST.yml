# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jose/15
homepage: "https://github.com/latchset/jose"

# 上游测试命令 (用于 meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（源码声明 26 项：9 个 C 可执行 + 16 个 shell 脚本 + 1 个 issue-75 子目录）
upstream_tests:
  - file: alg_hash.c
    source: jose-15/tests/alg_hash.c
    description: "哈希算法（HS256/384/512 等）单元测试"
    command: "./alg_hash"
  - file: alg_sign.c
    source: jose-15/tests/alg_sign.c
    description: "签名算法（RS/ES/PS 系列）单元测试"
    command: "./alg_sign"
  - file: alg_encr.c
    source: jose-15/tests/alg_encr.c
    description: "加密算法（CBC/GCM 系列）单元测试"
    command: "./alg_encr"
  - file: alg_wrap.c
    source: jose-15/tests/alg_wrap.c
    description: "密钥封装算法（AES-KW/RSA-OAEP/ECDH-ES）单元测试"
    command: "./alg_wrap"
  - file: alg_comp.c
    source: jose-15/tests/alg_comp.c
    description: "压缩算法（DEFLATE）单元测试"
    command: "./alg_comp"
  - file: api_b64.c
    source: jose-15/tests/api_b64.c
    description: "Base64url 编解码 API 测试（含 RFC 向量，超时 1800s）"
    command: "./api_b64"
  - file: api_jws.c
    source: jose-15/tests/api_jws.c
    description: "JWS 签名/验证 API 测试"
    command: "./api_jws"
  - file: api_jwe.c
    source: jose-15/tests/api_jwe.c
    description: "JWE 加解密 API 测试"
    command: "./api_jwe"
  - file: api_mem.c
    source: jose-15/tests/api_mem.c
    description: "内存安全与清理 API 测试"
    command: "./api_mem"
  - file: jose-alg
    source: jose-15/tests/jose-alg
    description: "jose CLI 算法列表端到端测试"
    command: "./jose-alg"
  - file: jose-b64-enc
    source: jose-15/tests/jose-b64-enc
    description: "jose CLI Base64url 编码端到端测试"
    command: "./jose-b64-enc"
  - file: jose-b64-dec
    source: jose-15/tests/jose-b64-dec
    description: "jose CLI Base64url 解码端到端测试"
    command: "./jose-b64-dec"
  - file: jose-fmt
    source: jose-15/tests/jose-fmt
    description: "jose CLI JSON 序列化格式转换测试"
    command: "./jose-fmt"
  - file: jose-jwe-dec
    source: jose-15/tests/jose-jwe-dec
    description: "jose CLI JWE 解密端到端测试"
    command: "./jose-jwe-dec"
  - file: jose-jwe-enc
    source: jose-15/tests/jose-jwe-enc
    description: "jose CLI JWE 加密端到端测试"
    command: "./jose-jwe-enc"
  - file: jose-jwe-fmt
    source: jose-15/tests/jose-jwe-fmt
    description: "jose CLI JWE 格式转换测试"
    command: "./jose-jwe-fmt"
  - file: jose-jwk-eql
    source: jose-15/tests/jose-jwk-eql
    description: "jose CLI JWK 相等判断测试"
    command: "./jose-jwk-eql"
  - file: jose-jwk-exc
    source: jose-15/tests/jose-jwk-exc
    description: "jose CLI JWK 密钥交换测试"
    command: "./jose-jwk-exc"
  - file: jose-jwk-gen
    source: jose-15/tests/jose-jwk-gen
    description: "jose CLI JWK 生成测试"
    command: "./jose-jwk-gen"
  - file: jose-jwk-pub
    source: jose-15/tests/jose-jwk-pub
    description: "jose CLI JWK 公钥提取测试（设备 mksh 分词差异，bash 复跑通过）"
    command: "./jose-jwk-pub"
  - file: jose-jwk-thp
    source: jose-15/tests/jose-jwk-thp
    description: "jose CLI JWK 指纹计算测试（含 RFC 7638/7520 向量；设备 mksh 差异，bash 复跑通过）"
    command: "./jose-jwk-thp"
  - file: jose-jwk-use
    source: jose-15/tests/jose-jwk-use
    description: "jose CLI JWK 用途校验测试"
    command: "./jose-jwk-use"
  - file: jose-jws-fmt
    source: jose-15/tests/jose-jws-fmt
    description: "jose CLI JWS 格式转换测试"
    command: "./jose-jws-fmt"
  - file: jose-jws-sig
    source: jose-15/tests/jose-jws-sig
    description: "jose CLI JWS 签名端到端测试"
    command: "./jose-jws-sig"
  - file: jose-jws-ver
    source: jose-15/tests/jose-jws-ver
    description: "jose CLI JWS 验证端到端测试"
    command: "./jose-jws-ver"
  - file: issue75
    source: jose-15/tests/issue-75/issue75.c
    description: "GitHub issue #75 回归测试"
    command: "./issue75"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 jose_b64_encode API 编码 RFC 7638 向量并断言输出"
    command: "./test_jose"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 26
