# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jose/14
homepage: "https://github.com/latchset/jose"

# 上游测试命令
upstream_check_command: "meson test"

# conanfile.py 的 build() 是否已真实执行上游套件
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <build> --num-processes 1 --no-rebuild --print-errorlogs"

# 上游 v14 实际注册并运行的测试（tests/meson.build 声明：8 个 C 可执行 +
# 16 个 shell 脚本 + tests/issue-75/issue75 = 25 项）。
# 注意 v15 才有 tests/api_mem.c，v14 没有，故这里是 25 而非 26。
upstream_tests:
  - file: alg_hash.c
    source: jose-14/tests/alg_hash.c
    description: "哈希算法（HS256/384/512 等）单元测试"
    command: "./alg_hash"
  - file: alg_sign.c
    source: jose-14/tests/alg_sign.c
    description: "签名算法（RS/PS/ES 系列）单元测试"
    command: "./alg_sign"
  - file: alg_encr.c
    source: jose-14/tests/alg_encr.c
    description: "加密算法（CBC/GCM 系列）单元测试"
    command: "./alg_encr"
  - file: alg_wrap.c
    source: jose-14/tests/alg_wrap.c
    description: "密钥封装算法（AES-KW/RSA-OAEP/ECDH-ES）单元测试"
    command: "./alg_wrap"
  - file: alg_comp.c
    source: jose-14/tests/alg_comp.c
    description: "压缩算法（DEFLATE，走 zlib）单元测试"
    command: "./alg_comp"
  - file: api_b64.c
    source: jose-14/tests/api_b64.c
    description: "Base64url 编解码 API 测试（含 RFC 向量，超时 1800s）"
    command: "./api_b64"
  - file: api_jws.c
    source: jose-14/tests/api_jws.c
    description: "JWS 签名/验证 API 测试"
    command: "./api_jws"
  - file: api_jwe.c
    source: jose-14/tests/api_jwe.c
    description: "JWE 加解密 API 测试"
    command: "./api_jwe"
  - file: jose-alg
    source: jose-14/tests/jose-alg
    description: "CLI 算法清单端到端测试（含 -k sign/wrap/encr/exch 正负向）"
    command: "./jose-alg"
  - file: jose-fmt
    source: jose-14/tests/jose-fmt
    description: "CLI JSON 序列化格式转换测试"
    command: "./jose-fmt"
  - file: jose-b64-enc
    source: jose-14/tests/jose-b64-enc
    description: "CLI Base64url 编码端到端测试"
    command: "./jose-b64-enc"
  - file: jose-b64-dec
    source: jose-14/tests/jose-b64-dec
    description: "CLI Base64url 解码端到端测试"
    command: "./jose-b64-dec"
  - file: jose-jwk-eql
    source: jose-14/tests/jose-jwk-eql
    description: "CLI JWK 相等判断测试"
    command: "./jose-jwk-eql"
  - file: jose-jwk-exc
    source: jose-14/tests/jose-jwk-exc
    description: "CLI JWK 密钥交换测试"
    command: "./jose-jwk-exc"
  - file: jose-jwk-gen
    source: jose-14/tests/jose-jwk-gen
    description: "CLI JWK 生成测试"
    command: "./jose-jwk-gen"
  - file: jose-jwk-pub
    source: jose-14/tests/jose-jwk-pub
    description: "CLI JWK 公钥提取测试（配方把 echo $var 改为 printf '%s' \"$var\"，见 notes.md）"
    command: "./jose-jwk-pub"
  - file: jose-jwk-thp
    source: jose-14/tests/jose-jwk-thp
    description: "CLI JWK 指纹测试（含 RFC 7638/7520 向量；S1 那条同上做了 printf 化）"
    command: "./jose-jwk-thp"
  - file: jose-jwk-use
    source: jose-14/tests/jose-jwk-use
    description: "CLI JWK 用途校验测试"
    command: "./jose-jwk-use"
  - file: jose-jws-fmt
    source: jose-14/tests/jose-jws-fmt
    description: "CLI JWS 格式转换测试"
    command: "./jose-jws-fmt"
  - file: jose-jws-sig
    source: jose-14/tests/jose-jws-sig
    description: "CLI JWS 签名端到端测试（逐算法签验链）"
    command: "./jose-jws-sig"
  - file: jose-jws-ver
    source: jose-14/tests/jose-jws-ver
    description: "CLI JWS 验证端到端测试（含 RFC 7520 向量与负向用例）"
    command: "./jose-jws-ver"
  - file: jose-jwe-fmt
    source: jose-14/tests/jose-jwe-fmt
    description: "CLI JWE 格式转换测试"
    command: "./jose-jwe-fmt"
  - file: jose-jwe-dec
    source: jose-14/tests/jose-jwe-dec
    description: "CLI JWE 解密端到端测试"
    command: "./jose-jwe-dec"
  - file: jose-jwe-enc
    source: jose-14/tests/jose-jwe-enc
    description: "CLI JWE 加密端到端测试"
    command: "./jose-jwe-enc"
  - file: issue75
    source: jose-14/tests/issue-75/issue-75.c
    description: "GitHub issue #75 回归测试（dependency('openssl') 命中时才注册）"
    command: "./issue75"

# test_package 自带的消费者测试（鸿蒙专项）
test_package_tests:
  - file: test.c
    description: "公共 <jose/b64.h> API 断言：探测长度、已知向量、URL-safe 字母表、往返、负向长度/字符集"
    command: "./test_jose"
    assertions: 11
  - file: jose_ohos_test.c
    description: "安装包专项：打包 `jose` 可执行 + 经 runenv PATH 可达、ELF64+EM_AARCH64 身份、算法注册表（ES256/A128GCM/ECDH/A128GCMKW 与负向）、b64 向量、JWK 生成与 S256 指纹、JWS 签验+篡改负向、JWE 加解密+错密钥负向"
    command: "./test_jose_ohos"
    assertions: 23

# 消费者断言总数（11 + 23）
assertion_count: 34
