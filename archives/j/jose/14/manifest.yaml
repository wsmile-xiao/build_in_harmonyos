patches_applied: []

in_recipe_adaptations:
  - file: "tests/meson.build"
    reason: "真机 /tmp 只读，16 个 shell 测试里 12 个用 `mktemp -d`；把 TMPDIR/TMP/TEMP 注入 meson 测试环境"
  - file: "tests/jose-jwk-pub"
    reason: "脚本以 `#!/bin/sh -ex`（真机为 mksh）运行，未加引号的 `$var` 经词分割与方括号 glob 展开后 JSON 被拆坏；改用 `printf '%s' \"$var\"` 逐字节回灌"
  - file: "tests/jose-jwk-thp"
    reason: "同上，S1 指纹那条断言"
  - file: "tests/alg_encr.c"
    reason: "(void) 掉只在 assert() 内使用的辅助变量，避免 -DNDEBUG 形态下 -Wunused-variable 与 werror 组合炸掉编译"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 jose 的断言全部写成 assert(feed(...)) 形式，Release 的 -DNDEBUG 会把 assert 展开成 ((void)0)，测试程序仍然退出 0 —— meson 会报满 n 项 Ok 但一个断言都没执行。判据：configure 后 `meson introspect --buildoptions` 里 b_ndebug 必须是 false，否则通过率数字没有意义"
  - "OHOS 真机 /tmp 是只读的：凡是 `mktemp -d` 的 shell 测试都要把 TMPDIR/TMP/TEMP 三个变量一起导出，只导一个在 meson 的 test(env:) 下不生效（mktemp 只看 TMPDIR，但脚本内部子进程会读 TMP/TEMP）"
  - "真机 harmonybrew 有 ninja/pkg-config 但没有 meson，CI worker 有 meson —— 需要显式 tool_requires('meson/1.11.0') 才能两侧同一条命令；meson 内部按裸名字起 ninja，HarmonyOS CPython 走 posix_spawn 不查 PATH，必须给 NINJA 绝对路径"
  - "Conan 的 PkgConfigDeps 按包名生成 .pc（openssl.pc），而上游 meson 探测的是 dependency('libcrypto')；派生别名时必须把原 Libs 行里的 -L/rpath 搜索参数一起带过去，只写 -lcrypto 会在链接期报 unable to find library -lcrypto"
  - "上游默认 werror=true 且 warning_level=2，clang 15 会把它自己的 -Wshadow/-Wstrict-prototypes 告警变成错误；关 werror 只影响告警处理，测试二进制仍然真编真跑"
