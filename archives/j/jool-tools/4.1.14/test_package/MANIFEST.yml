package: jool-tools/4.1.14
homepage: "https://github.com/NICMx/Jool"

# The official release contains no test/ directory and its Automake files
# declare neither TESTS nor check_PROGRAMS. make check runs with zero upstream
# test cases; package behavior is verified by test_cli.sh below.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_test_count: 0
upstream_test_count_command: "No TESTS/check_PROGRAMS in shipped Makefile.am files; no test/ directory"
upstream_test_executed: 0
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_blocked: 0
upstream_test_unexecuted_reason: "The official release tarball does not define an upstream test suite."
upstream_tests: []

test_package_tests:
  - file: test_cli.sh
    description: "Tests package executables, ELF/AArch64 ABI, version/help output, joold argument handling, and on OHOS the real netlink unavailable-kernel path (26 assertions on OHOS; 20 on Linux)."
    command: "bash test_cli.sh <package_folder>"
    executable: true

assertion_count: 26
