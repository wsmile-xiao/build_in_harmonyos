# 源码源：GitHub 官方 tag 归档（shashwatah/jot v0.1.2，Homebrew 稳定版）
# sha256 来自 Homebrew formula（formulae.brew.sh/formula/jot）
sources:
  # GitHub 直连在无法直连环境下会 ConnectTimeout，改为镜像优先有序列表：
  # gh-proxy.com 在前，官方原始 URL 保留末位兜底（与 ci/conan/build_and_test.sh
  # get_mirrors 的 GitHub 规则一致，不新增来源不明地址）。
  url:
    - "https://gh-proxy.com/https://github.com/shashwatah/jot/archive/refs/tags/v0.1.2.tar.gz"
    - "https://github.com/shashwatah/jot/archive/refs/tags/v0.1.2.tar.gz"
  sha256: "d7da3220c29102ee7c51e2a5656ceb6672ae3b85be22c5ddcd176b330c6029c9"

# Rust 工具链不再从 conandata 引导——改用仓库内基础设施包
# rust-toolchain/1.97.1（tool_requires，官方 rust-lang dist 经 rsproxy/USTC 镜像），
# cargo/rustc 未签码需在配方内用 binary-sign-tool -selfSign 1 自签；
# cargo 运行期 libssl/libcrypto/libz 的 Harmonybrew openssl/zlib bottles
# 直接在 conanfile.py 的 RUST_RUNTIME_BOTTLES 常量中声明（与 below/0.11.0、
# libetebase/0.5.8 一致）。
#
# 源码补丁：jot 的 Cargo.lock 把 libc 锁在 0.2.132，该版本未定义
# target_env="ohos"（aarch64-unknown-linux-ohos）的类型/常量，导致
# `cannot find type c_char/c_long/time_t/__u64` 编译失败。按 weggli/0.2.4
# 先例把 libc 提升到 0.2.155（首个含 OHOS 定义、且同一 rust-toolchain/1.97.1
# 下真机已验证的版本），用 `cargo update -p libc --precise 0.2.155` 重生成
# 锁图，构建保持 --locked 可复现。
patches:
  - patch_file: "patches/0001-Cargo.lock-libc-ohos.patch"
    patch_description: >-
      Bump libc 0.2.132 -> 0.2.155 in Cargo.lock (the first release carrying
      target_env="ohos" / aarch64-unknown-linux-ohos definitions, same
      version as the merged weggli/0.2.4 recipe, proven under
      rust-toolchain/1.97.1 on the OHOS worker). The pinned 0.2.132 lacks an
      "ohos" cfg branch in its lib.rs ctype definitions while its
      unix/linux_like/linux modules treat OHOS as linux-like, producing
      E0425 (c_char / c_long / time_t / __u64 / __SIZEOF_PTHREAD_*). Build
      stays `--locked` and reproducible.
    patch_type: "portability"

