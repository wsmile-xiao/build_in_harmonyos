# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: jot/0.1.2
homepage: "https://github.com/shashwatah/jot"

# Uppstream has no test suite — cargo test discovers 0 tests
upstream_tests_exist: false
upstream_test_audit: "Audited shashwatah/jot v0.1.2 source tarball (sha256 d7da3220c29102ee7c51e2a5656ceb6672ae3b85be22c5ddcd176b330c6029c9). Recursive source tree (git tree v0.1.2) lists no tests/ directory. Manual inspection of every source file in src/ (11 files: main.rs, app.rs, enums.rs, traits.rs, utils.rs, output/{mod,error,message}.rs, state/{mod,args,config}.rs, state/vaults/{mod,vault,data}.rs) found no #[cfg(test)] modules and no #[test] functions; all files are pure production code (CLI/app/state/io logic). Cargo.toml declares only 6 runtime dependencies (serde, toml, clap, directories, fs_extra, dunce) and has no [dev-dependencies] / [profile] test harness. The repo contains no .github CI workflow. Cargo.lock present for a reproducible --locked build. Therefore upstream has zero tests; status no_tests."
upstream_test_reason: "Upstream shashwatah/jot 0.1.2 has no test suite; no tests/ dir, no #[test]/#[cfg(test)] in any of the 11 src/ files, no [dev-dependencies], no CI workflow"

# No upstream test command — empty string to avoid hmbs checker mis-detecting a test framework
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_total: 0
upstream_test_count_method: auto
upstream_tests: []

# test_package consumer-side tests
test_package_tests:
  - file: test_jt.sh
    description: "Run jt binary to verify tool executes (R34); 2 real assertions (executable + non-empty --help output)"

# Test assertion count (matches HMBS_TEST_PACKAGE_RESULT discovered/passedCount)
assertion_count: 2
