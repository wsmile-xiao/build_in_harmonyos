package: jigit/1.22
homepage: "https://www.einval.com/~steve/software/JTE/"

# R51 upstream test audit (measured on the official jigit-1.22.tar.xz, 91
# entries): the top-level hand-written Makefile exposes only `all` (line 7) and
# `lib` (line 27) - no install, no check, no TESTS.  libjte/Makefile.am declares
# `noinst_PROGRAMS = test/demo` (lines 53-54) built from libjte/test/demo.c, and
# test_demo_LDADD links the in-tree libjte objects (line 59), which is why the
# recipe builds libjte in source and ships that demo as bin/jte-demo.  `grep -rn
# add_test` over the tree returns 0 hits: no ctest/pytest registration.
upstream_test_source: false
upstream_test_url: ""
upstream_tests_exist: false
upstream_test_audit: "jigit-1.22 audited: top-level Makefile has only all/lib targets (no check/TESTS/install); libjte/Makefile.am noinst_PROGRAMS test/demo from libjte/test/demo.c (0 registered cases, 0 add_test hits); the demo is the only shipped driver of the template-export API and is packaged as bin/jte-demo."
upstream_check_command: "none (no upstream test target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: libjte/test/demo.c
    source: jigit-1.22/libjte/test/demo.c
    description: "noinst upstream demo driver of the libjte jigdo template API; packaged as bin/jte-demo and executed by the consumer test round trip"
    command: "jte-demo -outfile image.out -template round.template -jigdo round.jigdo -md5 sums.hex f1.bin f2.bin"

test_type: functional-consumer
test_sources:
  - "test_jigit.sh"
  - "jte_consumer.c"

test_package_tests:
  - file: test_jigit.sh
    description: "29 consumer assertions under /bin/sh: 10 packaged commands resolve on PATH; libjte C consumer (compile+link, libjte_new/set_verbose/destroy round trip, soname binding to libjte.so.2); jigsum record count, 22-char jigdo base64 MD5 form, -c verify plus a destructive flipped-byte check; jigsum-sha256 43-char digest and -c; parallel-sums digest files cross-checked against platform md5sum/sha256sum; jigdo-gen-checksum-list hex list under HarmonyOS; jte-demo -> jigdump -> jigit-mkimage byte-identical round trip with a destructive template-corruption control; interpreter-side checks for the /bin/sh script and the Perl shebang"
    command: "sh test_jigit.sh"
  - file: jte_consumer.c
    description: "C consumer of the packaged headers/library; 5 internal non-zero return branches, folded into the shell side as the 3 assertions 11-13"
    command: "compiled and run by test_jigit.sh"

# Denominator algorithm (matches the SUMMARY line printed by test_jigit.sh):
# grep -c "ok \"" test_jigit.sh = 20 assertion sites, one of which sits inside a
# 10-element `for t in ...` loop, so an all-green run reports
# 20 - 1 + 10 = 29 checks.  Same number is declared in manifest.yaml
# (test_results) and in notes.md (验证结果).
assertion_count: 29
