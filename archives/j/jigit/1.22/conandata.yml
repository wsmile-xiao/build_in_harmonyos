# conandata.yml — jigit 1.22 (JTE / Jigdo Template Export, Steve McIntyre)
# 官方上游发布目录（einval.com/~steve/software/JTE/），不用 Debian 池址（PF7 拉黑 pool）。
# sha256 一手实测：B 机与 Windows 侧分别 GET，均为 307884 B /
# 8a1da3fb7b817174c6c19d71ede19a4b8d0ae433fc5e967d33abf74b545f9954，
# 与 Debian 索引同值（该 tar 与池件逐字节同一）。
sources:
  url: "https://www.einval.com/~steve/software/JTE/download/jigit-1.22.tar.xz"
  sha256: "8a1da3fb7b817174c6c19d71ede19a4b8d0ae433fc5e967d33abf74b545f9954"

patches:
  # E007（GNU config.guess 不含 HarmonyOS 分支 => configure 第一阶段
  # "cannot guess build type" 直接断）。E007 明令禁止用 --build/--host 绕过
  # （会被误判成交叉编译，AC_RUN_IFELSE 全跳过 -> 生成错误 config.h）。
  # 首选的 scripts/patch-autotools-ohos.pl 在本包上实测只打中 1/5：
  # libjte 带的是 config.guess 2018-02-24 / config.sub 2018-02-22 变体，
  # 其 __ANDROID__->LIBC=android、android-linux、linux-uclibc 三处锚点全不存在，
  # 且它注入的 GUESS= 分支不回显不退出（本文件 $LIBC 式手写分支不认它）。
  # 同 DRAFT-E564（archives/l/libetonyek/0.1.1、archives/l/libpskc/2.6.14 先例）
  # ⇒ 手工重锚成一份 portability 补丁：config.guess 学 aarch64:HarmonyOS ->
  # aarch64-unknown-linux-ohos；config.sub 两处接受位（maybe_os kernel-libc 列表
  # + basic os 列表）收 linux-ohos*。
  # 本机实测（同一份 md5 校验过的干净副本，patch -p1 --dry-run rc=0）：
  #   打补丁前 config.guess rc=1（unable to guess system type）
  #   打补丁后 config.guess -> aarch64-unknown-linux-ohos，rc=0
  #   config.sub 原样拒绝该三元组（machine aarch64-unknown-linux not recognized），
  #   打补丁后接受并原样回显 ⇒ 两处缺一不可。
  "1.22":
    - patch_file: patches/0001-libjte-config-guess-sub-ohos-reanchor.patch
      patch_description: Re-anchor libjte's 2018-era config.guess/config.sub for HarmonyOS so configure guesses aarch64-unknown-linux-ohos (E007; patch-autotools-ohos.pl anchors miss this variant, per DRAFT-E564)
      patch_type: portability
    # E513（musl 不提供 POSIX 线程取消 API）：顶层与 test/demo 都链到
    # checksum.o，pthread_cancel() 在 ld.lld 阶段直接 undefined symbol
    # （create11 第 282 行实拍：ld.lld: error: undefined symbol: pthread_cancel，
    # 引用于 checksum.c:331）。同条目还要求兜底**不得**改变可 join 线程的生命周期
    # （no-op 桩 / 直接 return 会让 pthread_join 永久等待）。
    # libjte 自身已有带内退出协议：checksum_thread() 见到 buf 非 NULL 就离开
    # cond_wait、见到 len == 0 就 break 后 pthread_exit() ⇒ 用它停机，
    # join 语义原样保留，不牺牲并行求和能力（E085 的
    # PTHREAD_IN_USE_DETECTION_HARD 处方属 gnulib posix-lock，与本包无关）。
    - patch_file: patches/0002-libjte-pthread-cancel-teardown-ohos.patch
      patch_description: Stop libjte checksum workers through its own zero-length-buffer quit protocol instead of musl-absent pthread_cancel, preserving targeted exit plus pthread_join reclaim (E513)
      patch_type: portability
    # jigdo-gen-checksum-list 是包里唯一能产出 libjte 解析器所要求的**十六进制**
    # 校验清单的工具（jte.c 逐字符 isxdigit 校验；jigsum 输出的 22 字符 jigdo
    # base64 形式会被判 "wrong checksum type"，create13 实拍 rc=4），但它按
    # `uname -s` 分派，OHOS 上 uname -s = HarmonyOS 不匹配任何分支 ⇒ 直接
    # "System type HarmonyOS unsupported / Abort." 退出 1，即该工具在目标机上
    # 完全不可用。本机实测 GNU 分支正是可用分支：md5sum / awk /
    # /usr/bin/stat（toybox 符号链接，含 `-c %s`）齐备，加上 HarmonyOS 分支后
    # 生成清单 rc=0 且首字段 32 位十六进制，libjte 端到端往返
    # （demo → jigdump → jigit-mkimage）产出与母本 cmp 全等。
    # 与 E007 同一根因家族（脚本按 uname 身份分派、无 HarmonyOS 分支）。
    - patch_file: patches/0003-jigdo-gen-checksum-list-harmonyos-oscase.patch
      patch_description: Teach jigdo-gen-checksum-list's uname -s dispatch about HarmonyOS so the hex checksum-list generator is usable on OpenHarmony instead of aborting with "System type HarmonyOS unsupported"
      patch_type: portability
