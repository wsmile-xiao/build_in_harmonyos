# 版本级 manifest —— jigit 1.22 (JTE / Jigdo Template Export)
# 遵循 ARCHIVE-SPEC v2.0

version: "1.22"
software: "jigit"

# published | built | failed | archived
status: built

build_date: "2026-09-27"
# 顶层是手写 Makefile（无 install / 无 configure），libjte/ 是其内嵌的
# autotools/libtool 子项目：配方先跑 libjte ./configure 再回到顶层 make。
build_system: "makefile"

source:
  url: "https://www.einval.com/~steve/software/JTE/download/jigit-1.22.tar.xz"
  sha256: "8a1da3fb7b817174c6c19d71ede19a4b8d0ae433fc5e967d33abf74b545f9954"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "--prefix=<package_folder>"
    - "--libdir=<package_folder>/lib"
    - "--includedir=<package_folder>/include"
    - "--disable-maintainer-mode"
    - "--enable-static（剔除 AutotoolsToolchain 注入的 --disable-static）"
  dependencies:
    - "zlib/1.3.1"
    - "bzip2/1.0.8"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-libjte-config-guess-sub-ohos-reanchor.patch"
  - "0002-libjte-pthread-cancel-teardown-ohos.patch"
  - "0003-jigdo-gen-checksum-list-harmonyos-oscase.patch"

test_results:
  type: consumer-assertions
  upstream_command: "none (no upstream test target: 顶层 Makefile 只有 all/lib，libjte 只有 noinst test/demo)"
  total: 29
  passed: 29
  failed: 0
  skipped: 0
  status: built
  test_package_assertions: 29
  # 分母算法：grep -c "ok \"" test_package/test_jigit.sh = 20 个断言点，其中 1 点在
  # 10 元素的 `for t in ...` 循环里 => 全绿时 checks = 20 - 1 + 10 = 29，与脚本
  # 打印的 SUMMARY 行、test_package/MANIFEST.yml 的 assertion_count、notes.md
  # 验证结果块四处同源。

artifacts:
  library:
    - "lib/libjte.so.2.0.0 (SONAME libjte.so.2, LT 2:0:0)"
    - "lib/libjte.a"
    - "lib/pkgconfig/libjte-2.pc"
    - "include/libjte/libjte.h"
  binaries:
    - "bin/jigdump"
    - "bin/jigit-mkimage"
    - "bin/jigsum"
    - "bin/jigsum-sha256"
    - "bin/parallel-sums"
    - "bin/extract-data"
    - "bin/rsyncsum"
    - "bin/jigdo-gen-checksum-list"
    - "bin/mkjigsnap"
    - "bin/jte-demo (上游 noinst test/demo，装成可执行)"

knowledge_gained:
  - "E007：libjte 自带 config.guess 2018-02-24 / config.sub 2018-02-22 变体，scripts/patch-autotools-ohos.pl 三处锚点全不存在且注入的 GUESS= 分支不回显不退出（实测 1/5 命中），须手工重锚 portability 补丁；禁止 --build/--host 绕过（knowledge_ref: E007）"
  - "E386：调用 configure 必须前缀 CONFIG_SHELL=/bin/sh SHELL=/bin/sh，否则 Autoconf 2.69 序言重执行 configure 报 shell-init: getcwd / working directory cannot be determined（knowledge_ref: E386）"
  - "AutotoolsToolchain 在 shared=True 时注入的 --disable-static 对本树致命：libtool 把 libjte_libjte_la-*.o 换成 dummy 对象，而顶层 Makefile 正用这些 .o 链 parallel-sums => 配方剔除该参数保留 .a + .so（knowledge_ref: 本包 notes.md 问题表第 3 行）"
  - "HMDFS 上 configure 的 here-doc 临时目录 ./confXXXXXX/subs1.awk 报 Permission denied，需在 configure 内重锚 scratch 目录（配方 _relax_hmdfs_scratch_dir）（knowledge_ref: 本包 notes.md 问题表第 4 行）"
  - "运行面能力：/bin/bash 与 /usr/bin/perl 在本机不存在，jigit 包装脚本与 iso-image.pl 的绝对 shebang 无法解析；mkjigsnap 改写为 HNP perl 后可启动（rc=255 为脚本自身参数错误，非 ENOENT）（knowledge_ref: E049）"
  - "jigdo 闭环阈值：输入文件小于 MIN_JIGDO_FILE_SIZE(1024B, libjte/jte.h:105) 时 .jigdo 的 [Parts] 段为空，镜像整体内联进 template 压缩块；jigit-mkimage 只按文件名解析 mirror（find_file_in_mirror -> file_exists，mkimage.c:259-297）不重算摘要 => 破坏性对照须打在 template 上（knowledge_ref: 本包 test_package/MANIFEST.yml 与 notes.md 问题表第 6 行）"
  - "已知限制（未修的上游缺陷，与 HarmonyOS 移植无因果关系）：同一上游 tarball 内 jte.c:1275 写出的是 name=value 形式，而 mkimage.c:535 读取时要求键名为 jigdo_name（必须含 :），二者自相矛盾 ⇒ jigdo_name 恒 NULL、[Parts] 段互通在上游自身就不通；本 PR 未修，只在包内二进制上复现了「[Parts] 为空 / 镜像内容内联 / rc=0 且 cmp 全等」这一形状，独立审计未能二次复跑该条（knowledge_ref: 本包 notes.md 已知限制节）"
