# 软件级 manifest —— jigit (JTE / Jigdo Template Export)
# 遵循 ARCHIVE-SPEC v3.0 §2.1 / §4.1；字段形状对齐已合入先例 archives/x/xz/manifest.yaml

software: jigit
display: "JTE (Jigdo Template Export)"
description: "JTE jigdo 模板导出工具集：生成/检视/重建 jigdo 镜像，含 libjte 库与命令行工具"
category: utility
homepage: "https://www.einval.com/~steve/software/JTE/"
license: GPL-2.0-or-later
# 顶层是手写 Makefile（只有 all/lib），libjte/ 为内嵌 autotools/libtool 子项目
build_system: makefile

# 跨版本通用的 OHOS 适配知识（单版本细节见版本级 notes.md / manifest.yaml）
ohos_adaptation:
  key_points:
    - "顶层 Makefile 无 configure、无 install 目标，libjte/ 须 in-source 构建（父 Makefile 直接吃 libjte_libjte_la-*.o）"
    - "E007：libjte 自带 config.guess 2018-02-24 / config.sub 2018-02-22 无 HarmonyOS 分支，scripts/patch-autotools-ohos.pl 实测只打中 1/5，须手工重锚 portability 补丁；禁止用 --build/--host 绕过"
    - "E513：OHOS musl 不提供 pthread_cancel，改用 libjte/checksum.c 既有的 buf/len quit 协议停机，保留 pthread_exit + pthread_join 回收语义"
    - "E049：包内脚本 shebang 硬编码 /bin/bash 与 /usr/bin/perl，OHOS 无 FHS 解释器路径即 ENOENT；mkjigsnap 改写为 /usr/bin/env perl 走 HNP perl，上游 jigit 包装脚本不打包"
    - "jigdo-gen-checksum-list 按 uname -s 分派且无 HarmonyOS 分支，目标机上直接 Abort，须补分支才能产出 libjte 接受的十六进制摘要清单"
    - "调用 configure 须前缀 CONFIG_SHELL=/bin/sh SHELL=/bin/sh（E386）；HMDFS 上 configure 的 here-doc scratch 目录需重锚"
    - "已知限制（未修的上游缺陷，与移植无因果关系）：写出与读取 [Parts] 条目的键名形式在上游同一 tarball 内自相矛盾 ⇒ jigdo_name 恒 NULL、[Parts] 段互通在上游即不通，本包未修"
  common_dependencies:
    - zlib
    - bzip2

# 版本索引（所有已归档版本，含状态）
versions:
  "1.22":
    status: built
    build_date: "2026-09-27"
    conan_ref: "jigit/1.22"
    note: "3 枚 OHOS portability 补丁；消费者断言 29/29 全绿（上游无成体系测试，R51 清点）"
