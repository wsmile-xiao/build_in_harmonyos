# 版本级 manifest — jellyfish 2.3.0 (OpenHarmony PC / OHOS aarch64)
# 文件位置: archives/j/jellyfish/2.3.0/manifest.yaml

version: "2.3.0"
software: "jellyfish"
status: built
build_date: "2026-09-21"
build_system: autotools

source:
  url: "https://github.com/gmarcais/Jellyfish/releases/download/v2.3.0/jellyfish-2.3.0.tar.gz"
  sha256: "e195b7cf7ba42a90e5e112c0ed27894cd7ac864476dc5fb45ab169f5b930ea5a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-htslib"
    - "--disable-shared"
    - "--enable-static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-configure.patch"
  - "0003-tests-multi_file.sh.patch"
  - "0004-tests-bloom_counter.sh.patch"
  - "0005-unit_tests-test_stream_iterator.cc.patch"
  - "0006-unit_tests-unit_tests.sh.patch"
  - "0007-unit_tests-test_misc.cc.patch"

knowledge_gained:
  - "给 shell 测试脚本包 if/else 时，绝不能把 `<<EOF` 的 heredoc 一起缩进：`<<EOF` 不是 `<<-EOF`，终止符必须顶格，否则 mksh 报 \"here-document at line N delimited by end-of-file (wanted 'EOF')\" + \"syntax error: unexpected end of file\"，整条 automake 测试以 exit 2 失败。正确做法是让能力探测的 if 从 heredoc **之后**开始，把 heredoc 留在补丁的未改动上下文里（本轮 0003 实测踩过）"
  - "jellyfish 只能取官方 dist 包：GitHub tag 归档（codeload .../tar.gz/refs/tags/v2.3.0，679144 B）不含预生成的 configure / Makefile.in / config.guess，而真机与 CI worker 都没有 autoconf/automake 可再生成，用它必然构建失败；因此 source() 面对 github.com release 资产偶发的 connect>30s 超时，只能对同一 URL 做有界重试（5 次，校验和不匹配时立即抛出不重试），而不是换镜像源"
  - "unit_tests/test_misc.cc 用 std::bind2nd（C++11 起弃用、C++17 移除）：OHOS 工具链 cppstd=17 + libc++ 下报 no member named 'bind2nd'，等价改写为 lambda 即可（上游 2.3.1 已自行移除该用法）"
  - "HarmonyOS 全局禁止 mkfifo(2)（EPERM，连 /dev/shm 也拒绝），toybox 亦无 mkfifo 命令：依赖命名管道的功能与测试必须运行期能力探测后跳过/等价回退；jellyfish generator 输入（-g/-G）在本平台不可用，文件输入路径不受影响"
  - "config.status 的 `umask 077 && mktemp -d ./confXXXXXX` 在 HMDFS 上产生属主不可写目录（config.status: subs1.awk: Permission denied）——放宽 umask 即可（E011/E114）"
  - "toybox unix2dos 不支持 `-n <in> <out>`：configure 需功能探测，否则上游 tests/generate_sequence.sh 与 tests/parallel_hashing.sh 在 set -e 下误失败"
  - "单元测试硬编码 /tmp 在 OHOS 为只读 EROFS，应回退 TMPDIR → /tmp → 当前目录（E002）"
  - "jellyfish 2.3.0 无强制第三方依赖（jellyfish-2.0.pc 仅 -ljellyfish-2.0 -lpthread；htslib/SWIG 绑定均可选）；--disable-htslib 保证构建可复现，tests/sam.sh 按上游设计 exit 77 跳过"
  - "2.3.0 与 2.3.1 的 6 处适配点位置一致，但补丁必须按各自 dist tarball 重新生成（行号与上下文不同，patch -p1 才对得上）"

patch_generation:
  method: refresh-patch --auto
  patches_count: 7

