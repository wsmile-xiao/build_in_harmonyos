# conandata.yml — jellyfish 2.3.0
# 事实源：上游官方 dist tarball（GitHub release 资产，v2.3.0 tag，2020-02-06 发布）。
# sha256 于 2026-09-21 双端实测核验：本机下载与真机（OHOS aarch64）下载均为
#   e195b7cf7ba42a90e5e112c0ed27894cd7ac864476dc5fb45ab169f5b930ea5a（1,151,287 B）
# 7 个补丁全部对该 tarball 的原始文件生成（patch -p1 --dry-run 逐一通过）。

sources:
  url: "https://github.com/gmarcais/Jellyfish/releases/download/v2.3.0/jellyfish-2.3.0.tar.gz"
  sha256: "e195b7cf7ba42a90e5e112c0ed27894cd7ac864476dc5fb45ab169f5b930ea5a"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Teach config.guess to recognize HarmonyOS (map to linux/musl)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "Relax config.status tmpdir umask for HMDFS and probe unix2dos -n support"
    patch_type: "portability"
  - patch_file: "patches/0003-tests-multi_file.sh.patch"
    patch_description: "Gate generator-based multi-file test on mkfifo availability"
    patch_type: "portability"
  - patch_file: "patches/0004-tests-bloom_counter.sh.patch"
    patch_description: "Gate generator-based bloom counter test on mkfifo availability"
    patch_type: "portability"
  - patch_file: "patches/0005-unit_tests-test_stream_iterator.cc.patch"
    patch_description: "Use TMPDIR for stream_iterator unit test instead of hardcoded /tmp"
    patch_type: "portability"
  - patch_file: "patches/0006-unit_tests-unit_tests.sh.patch"
    patch_description: "Exclude FIFO-based gtest cases when mkfifo is unavailable"
    patch_type: "portability"
  - patch_file: "patches/0007-unit_tests-test_misc.cc.patch"
    patch_description: "Replace std::bind2nd (removed in C++17) with an equivalent lambda"
    patch_type: "portability"
