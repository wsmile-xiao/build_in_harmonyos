# test_package/MANIFEST.yml — jellyfish/2.3.1
# 上游官方测试声明文件 (CI L0e 强制要求存在)
# 上游测试通过 conanfile.py build() 中的 `make check` 真实运行。

package: jellyfish/2.3.1
homepage: "https://github.com/gmarcais/Jellyfish"

# 上游测试命令 (autotools parallel-tests)
upstream_check_command: "make check"

# conanfile.py build() 已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际注册的测试 (Makefile.am TESTS / unit_tests)
upstream_tests:
  - file: tests/generate_sequence.sh
    source: jellyfish-2.3.1/tests/generate_sequence.sh
    description: "生成 FASTA/FASTQ 测试数据 (10M/1M 序列、gzip 副本、SAM)"
    command: "make check"
  - file: tests/parallel_hashing.sh
    source: jellyfish-2.3.1/tests/parallel_hashing.sh
    description: "并行哈希、text/binary 一致性、L/U 计数与 query"
    command: "make check"
  - file: tests/merge.sh
    source: jellyfish-2.3.1/tests/merge.sh
    description: "哈希库合并与直方图一致性"
    command: "make check"
  - file: tests/bloom_filter.sh
    source: jellyfish-2.3.1/tests/bloom_filter.sh
    description: "布隆过滤器生成与查询"
    command: "make check"
  - file: tests/big.sh
    source: jellyfish-2.3.1/tests/big.sh
    description: "大数据集测试 (需 BIG=1，默认上游 skip)"
    command: "make check"
  - file: tests/subset_hashing.sh
    source: jellyfish-2.3.1/tests/subset_hashing.sh
    description: "子集哈希 (-L/-U) 计数"
    command: "make check"
  - file: tests/multi_file.sh
    source: jellyfish-2.3.1/tests/multi_file.sh
    description: "多文件读取与 generator 子测试 (generator 依赖 mkfifo)"
    command: "make check"
  - file: tests/bloom_counter.sh
    source: jellyfish-2.3.1/tests/bloom_counter.sh
    description: "布隆计数器 (bc) 生成、过滤、碰撞率与查询"
    command: "make check"
  - file: tests/large_key.sh
    source: jellyfish-2.3.1/tests/large_key.sh
    description: "大 key 计数"
    command: "make check"
  - file: tests/sam.sh
    source: jellyfish-2.3.1/tests/sam.sh
    description: "SAM/BAM/CRAM 输入 (需 htslib，未启用时上游 exit 77 skip)"
    command: "make check"
  - file: tests/small_mers.sh
    source: jellyfish-2.3.1/tests/small_mers.sh
    description: "小 k-mer (2..10) 计数一致性"
    command: "make check"
  - file: unit_tests/unit_tests.sh
    source: jellyfish-2.3.1/unit_tests/unit_tests.sh
    description: "内置 gtest 单元测试 (51310 用例；依赖 mkfifo 的 3 个用例按平台能力排除)"
    command: "make check"
  - file: tests/swig_python.sh
    source: jellyfish-2.3.1/tests/swig_python.sh
    description: "SWIG Python 绑定测试 (未启用绑定，上游 exit 77 skip)"
    command: "make check"
  - file: tests/swig_ruby.sh
    source: jellyfish-2.3.1/tests/swig_ruby.sh
    description: "SWIG Ruby 绑定测试 (未启用绑定，上游 exit 77 skip)"
    command: "make check"
  - file: tests/swig_perl.sh
    source: jellyfish-2.3.1/tests/swig_perl.sh
    description: "SWIG Perl 绑定测试 (未启用绑定，上游 exit 77 skip)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试: 运行已安装的 jellyfish CLI (version/count/histo/dump/query/info) 并含 2 条负例"
    command: "bash test.sh"

# 测试断言总数 (test_package/test.sh 实际断言数)
assertion_count: 11
