# 版本级 manifest — jellyfish 2.3.1 (OpenHarmony PC / OHOS aarch64)
version: "2.3.1"
software: "jellyfish"
status: built
build_date: "2026-09-21"
build_system: autotools

source:
  url: "https://github.com/gmarcais/Jellyfish/releases/download/v2.3.1/jellyfish-2.3.1.tar.gz"
  sha256: "ee032b57257948ca0f0610883099267572c91a635eecbd88ae5d8974c2430fcd"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-htslib"
    - "--disable-shared"
    - "--enable-static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-configure.patch"
  - "0003-tests-bloom_counter.sh.patch"
  - "0004-tests-multi_file.sh.patch"
  - "0005-unit_tests-test_stream_iterator.cc.patch"
  - "0006-unit_tests-unit_tests.sh.patch"

knowledge_gained:
  - "HarmonyOS 全局禁止 mkfifo(2)（EPERM，连 /dev/shm 也拒绝），toybox 亦无 mkfifo 命令：依赖命名管道的功能与测试必须运行期能力探测后跳过；jellyfish generator 输入（-g/-G）在本平台不可用，文件输入路径不受影响"
  - "configure/config.status 的 `umask 077 && mktemp -d ./confXXXXXX` 在 HMDFS 上产生属主不可写目录（config.status: subs1.awk: Permission denied）——移除 umask 077 即可（E011/E114）"
  - "toybox unix2dos 不支持 `-n <in> <out>`：configure 需功能探测，否则上游 tests/generate_sequence.sh 与 tests/parallel_hashing.sh 误失败"
  - "单元测试硬编码 /tmp 在 OHOS 为只读 EROFS，应回退 TMPDIR → /tmp → 当前目录（E002）"
  - "jellyfish 2.3.1 无强制第三方依赖（htslib/SWIG 绑定均可选）；--disable-htslib 保证构建可复现，tests/sam.sh 按上游设计 exit 77 跳过"

patch_generation:
  method: refresh-patch --auto
  patches_count: 6

patch_classification:
  - file: 0001-config.guess.patch
    type: portability
    platform_only: true
    guard: 'none'
  - file: 0002-configure.patch
    type: portability
    platform_only: true
    guard: 'none'
  - file: 0003-tests-bloom_counter.sh.patch
    type: portability
    platform_only: true
    guard: 'runtime-fifo-probe'
  - file: 0004-tests-multi_file.sh.patch
    type: portability
    platform_only: true
    guard: 'runtime-fifo-probe'
  - file: 0005-unit_tests-test_stream_iterator.cc.patch
    type: portability
    platform_only: false
    guard: 'none'
  - file: 0006-unit_tests-unit_tests.sh.patch
    type: portability
    platform_only: true
    guard: 'runtime-fifo-probe'
