# 软件级 manifest — jellyfish
# 遵循 ARCHIVE-SPEC v3.0

software: jellyfish
description: Fast, memory-efficient k-mer counter for DNA/RNA (C++ library + CLI)
category: bioinformatics
license: BSD-3-Clause OR GPL-3.0-or-later
homepage: https://github.com/gmarcais/Jellyfish
repository: https://github.com/gmarcais/Jellyfish
keywords:
  - k-mer
  - bioinformatics
  - counting
  - genomics

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Autotools + libtool 项目：config.guess/configure/Makefile.in 随 dist tarball 发布，无需 autoconf 重新生成——也只有 dist tarball 能用，GitHub tag 归档不含这些预生成文件而真机/CI worker 都没有 autoconf/automake/libtoolize"
    - "无强制第三方依赖：jellyfish-2.0.pc 的 Libs 仅 -ljellyfish-2.0 -lpthread，源码无 zlib/htslib 硬引用；htslib（SAM/BAM/CRAM）与 SWIG 绑定均为可选，--disable-htslib 保证构建可复现"
    - "config.guess 是 2018 年版，不认 `uname -s = HarmonyOS` → 显式映射为 Linux + musl，得到 aarch64-unknown-linux-musl（E160）"
    - "config.status 的 `umask 077 && mktemp -d ./confXXXXXX` 在 HMDFS 上建出属主不可写的目录 → 放宽 umask 即可（E011/E114）"
    - "真机 /tmp 只读（EROFS）：unit_tests/test_stream_iterator.cc 硬编码 /tmp，需 TMPDIR → /tmp → . 三级回退（E002）"
    - "toybox 的 unix2dos 不支持 `-n <in> <out>`：configure 必须功能探测，否则 generate_sequence.sh / parallel_hashing.sh 在 set -e 下误失败"
    - "HarmonyOS 全局拒绝 mkfifo(2)（系统调用级实测：HMDFS EPERM(1)、/dev/shm EACCES(13)、/tmp EROFS(30)，toybox 亦无 mkfifo 命令）：依赖命名管道的功能（generator 输入 -g/-G）与测试必须运行期能力探测后跳过/等价回退——已有条目 E074（禁止创建 FIFO，make -j 需退到 -j1）与 E345（可写路径仍可能拒绝 FIFO，测试前要逐个探测所需文件系统操作，正向检查须配破坏性反向验证）"
    - "内置 gtest 的 unit_tests 里仍有 C++17 已移除的 API（2.3.0 的 std::bind2nd），cppstd=17 + libc++ 下编译期即失败；这类只能用等价 lambda/std::function 改写，不能靠关测试绕过"
    - "上游测试账目：Makefile.am 注册 15 个 TESTS（11 个 tests/*.sh + 3 个 swig_*.sh + unit_tests/unit_tests.sh），后者内部是内置 googletest 的数万实例；`make check` 是唯一的取数口径"
    - "头文件装在 include/jellyfish-<版本>/jellyfish，故 cpp_info.includedirs 必须按版本目录写；库名恒为 libjellyfish-2.0（ABI 版本，与软件版本无关）"
  common_dependencies: []

