package: jerryscript/3.0.0
homepage: "https://github.com/jerryscript-project/jerryscript"

upstream_check_command: "python3 tools/run-tests.py --unittests && python3 tools/run-tests.py --jerry-tests"
upstream_test_in_build: false
upstream_test_command: "python3 tools/run-tests.py --unittests && python3 tools/run-tests.py --jerry-tests"

upstream_tests:
  - name: unit-core
    command: "python3 tools/run-tests.py --unittests"
    expected: "84 upstream unit executables: 70 core, 12 ext, 1 ext-module, and 1 math"
  - name: jerry-tests
    command: "python3 tools/run-tests.py --jerry-tests"
    expected: "the upstream tests/jerry JavaScript suite passes"

test_package_tests:
  - file: test.c
    description: "Evaluate JavaScript through the core API and register the upstream print extension"
    command: "./test_jerryscript"
  - file: conanfile.py
    description: "Run the installed JerryScript command-line tool version check"
    command: "jerry --version"

assertion_count: 4
