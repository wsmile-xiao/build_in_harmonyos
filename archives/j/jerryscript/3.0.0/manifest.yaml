software: jerryscript
version: "3.0.0"
status: built
build_date: "2026-09-09"
build_system: cmake

source:
  url: "https://github.com/jerryscript-project/jerryscript/archive/refs/tags/v3.0.0.tar.gz"
  sha256: "4d586d922ba575d95482693a45169ebe6cb539c4b5a0d256a6651a39e47bf0fc"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
    - "-DENABLE_AMALGAM=OFF"
    - "-DENABLE_LTO=OFF"
    - "-DENABLE_STRIP=OFF"
    - "-DJERRY_CMDLINE=<tool_cmdline>"
    - "-DJERRY_EXT=ON"
    - "-DJERRY_MATH=OFF"
    - "-DJERRY_PORT=ON"
    - "-DUNITTESTS=OFF"
    - "-DDOCTESTS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-preserve-negative-zero-remainder.patch"

knowledge_gained:
  - "JerryScript 3.0.0 is a standalone C/CMake project; the source archive contains 2071 files and has no Conan requirements."
  - "The HarmonyOS device uses CMake with CMAKE_SYSTEM_NAME=HarmonyOS; CMake emits an unknown-platform warning but the upstream configure/build/install succeeds."
  - "The installed library set is jerry-core, jerry-ext, and jerry-port; the optional jerry command-line tool installs as bin/jerry."
  - "The upstream CMake unit tests are independent executables controlled by UNITTESTS; CTest reports no tests when UNITTESTS is OFF."
  - "The prescan reports a Nuttx symlink rule and bash shebangs under unrelated developer tooling, plus guarded libc/backtrace findings; the default HarmonyOS build does not require a patch."

package_contract:
  libraries: ["jerry-ext", "jerry-core", "jerry-port"]
  headers: ["jerryscript.h", "jerryscript-ext/handlers.h", "jerryscript-port.h"]
  tools: ["jerry"]
