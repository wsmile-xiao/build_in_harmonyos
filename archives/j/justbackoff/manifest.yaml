# 软件级 manifest — justbackoff
# 遵循 ARCHIVE-SPEC v3.0

software: justbackoff
display: "justbackoff"
description: "justbackoff — Simple backoff algorithm in Python（纯 Python 单包，零第三方依赖）"
category: library
homepage: "https://github.com/alexferl/justbackoff"
license: MIT
build_system: setuptools

ohos_adaptation:
  key_points:
    - "纯 Python noarch 包——无 C/C++ 编译、无运行时依赖（唯一 import 为标准库
      random），shutil.copytree 把 justbackoff/ 拷到 site-packages
      （pip/setuptools 构建在本环境不可用——同 jinja2/appdirs/jmespath 模式）"
    - "零源码补丁：无 ABI/平台分支/文件系统访问，OHOS 由平台 CPython 3.12 解释执行"
    - "R38 不适用：上游 setup.py 无 scripts=/console_scripts，纯库包，无 commands.json"
    - "双源码（R39 官方 https 双固定 sha256）：包载荷取 PyPI 官方 sdist，
      上游测试取官方仓库 tag v0.6.0 tarball（sdist 未打包 tests/）"
    - "上游测试 tests/test_backoff.py 6 用例经 pytest 实跑 6/6 = 100%；
      test_package 消费者 42 断言 + 鸿蒙特有 11 断言"

versions:
