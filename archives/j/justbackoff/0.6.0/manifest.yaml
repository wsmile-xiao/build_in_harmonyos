  optional: []
  note: |
    零第三方依赖（强制依赖数 = 0）：
      * 上游 setup.py **无 install_requires**；
      * sdist PKG-INFO 无 Requires-Dist；wheel METADATA 无 Requires-Dist
        （`grep -i requires-dist` → rc=1）；PyPI requires_dist 为空；
      * 包源码唯一 import 为标准库 `random`（justbackoff/__init__.py:1）。
    仅有的 `setup_requires=["pytest-runner>=5.2"]` / `tests_require=["pytest>=5.4.1"]`
