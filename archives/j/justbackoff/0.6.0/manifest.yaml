# ============================================================
# 构建配置
# ============================================================

build:
  system: setuptools
  configure_options: []
  dependencies: []
  cc: null
  cxx: null

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Python 无二进制产物；不产生 bindirs，
    故无需 commands.json，R38 不适用——上游 setup.py 无 scripts=、
    无 console_scripts/entry_points）。

    **本配方零补丁**（patches 为空）：`justbackoff/__init__.py` 只有 stdlib
    `random` 一个 import，无 C 扩展、无 ABI、无平台分支、无文件系统访问，
    OHOS 上由平台 CPython 3.12 解释执行，行为与上游一致（R40 不适用：
    非图形/多媒体/系统底层类库，不存在「编译通过 ≠ 适配完成」的实质适配面）。

    package() 把 sdist 的 `justbackoff/` 目录拷入
    `<pkg>/lib/python3.12/site-packages/justbackoff`；
    package_info() 同时声明 runenv_info 与 buildenv_info 的 PYTHONPATH
    （aiohttp 教训：仅 print 不够，消费者会报 "No module named justbackoff"）。

    **双源码设计（R39 均为官方 https 源，sha256 双固定）**：
      - `justbackoff`      = PyPI 官方分发件 sdist → 包载荷；
      - `upstream_tests`   = 官方仓库 tag v0.6.0 tarball → 上游测试目录
        （sdist 未打包 tests/，上游测试只在仓库里）。
    实证等价：两个归档中的 `justbackoff/__init__.py`
    （sha256 e8f25fcb…）与 `setup.py`（sha256 1d4337a3…）逐字节一致。

