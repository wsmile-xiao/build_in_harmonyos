# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "sdist 未打包 tests/ 的 Python 分发库（justbackoff 0.6.0）：上游测试只在官方仓库 tag tarball 里。conandata.yml 用「双源」表达 —— 包载荷取 PyPI 官方 sdist（sha256 == PyPI digest），测试取 GitHub 官方 tag tarball（sha256 固定，CI 域名白名单含 github.com 故有镜像 fallback），并以逐字节哈希证明两者模块文件一致；比在 build() 里运行时联网抓测试文件（jmespath/1.1.0 的 compliance 数据下载）更可复现、无静默降级"
  - "纯 Python noarch 分发库的『鸿蒙特有测试』应该打平台契约而非算法：justbackoff 无 FS/平台分支，故 OHOS 专项断言落在①运行时身份（CPython 3.12 + sys.platform=ohos/aarch64）②conan 布局接线（`<pkg>/lib/python3.12/site-packages/<mod>`）③noarch 无二进制契约（.so/.pyd/.dylib/.a/.o 计数 0）④平台熵源（stdlib random 是唯一非上游表面）⑤只读安装契约（`python3 -B` 导入成功且不落 __pycache__）"
  - "本平台（HarmonyOS/HMDFS）Python 的 subprocess 无法执行裸命令名（git/conan/python3/bash/tar 全部 FileNotFoundError，只有绝对路径可执行）——conanfile.py 内取测试运行器必须用 sys.executable（绝对路径），不能用裸 `pip`/`python3`"
  - "OHOS 上 pytest 默认 basetemp（<tmp>/pytest-of-<user>）会因新建目录属主被强制显示为挂载属主而 INTERNALERROR；传 --basetemp 走 _given_basetemp 分支绕过（jinja2/3.1.6 先例，本包沿用）"

references:
  - https://github.com/alexferl/justbackoff
  - https://pypi.org/project/justbackoff/0.6.0/
