# test_package/MANIFEST.yml — justbackoff 0.6.0
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: justbackoff/0.6.0
homepage: "https://github.com/alexferl/justbackoff"

# 上游测试命令 — pytest（上游三处声明一致：.travis.yml `script: pytest
# --cov=./justbackoff`；Makefile `test: ${PYTHON} -m pytest`；
# setup.cfg `[aliases] test=pytest`）。测试源只有 1 个文件
# tests/test_backoff.py（unittest 风格，TestBackoff 6 个用例）。
upstream_check_command: "python3 -m pytest tests -v"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "PYTHONPATH=<test-deps>:<src> PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest tests -v --no-header -p no:cacheprovider --basetemp=<build>/pytest-basetemp"

# 上游实际运行的测试程序（2026-10-02 实测记录）：
# - tests/test_backoff.py（unittest.TestCase 子类 TestBackoff，6 个用例方法）
# - 实测结果：**6 passed, 0 failed, 0 skipped**（`6 passed in 0.05s`）
#   → 6/6 = 100%
# - 覆盖率：上游声明的用例总数 = 6，本次实际执行 6，未执行 0（无漏测）
# - 兼容性核验：justbackoff/__init__.py 仅 `import random`（CPython 标准库），
#   py3.12 下无 import 障碍；纯 Python noarch，无平台分支 → 无需源码补丁
#   （patches 为空）。
# - sdist 未打包 tests/：上游测试源只在官方仓库 tag tarball 中，故 conandata.yml
#   声明第二个源 upstream_tests（GitHub 官方 tag v0.6.0，sha256 固定）。
#
# 测试运行器获取：宿主解释器（python3.12）无 pytest；按 jinja2/3.1.6 先例，
# 构建期从平台 pip 镜像（ci/conan/setup.sh:55 PIP_COMMUNITY_INDEX）取到独立目录。
# 取依赖失败或套件失败均**显式抛 ConanException**，不静默降级、不跳过。
upstream_tests:
  - file: tests/test_backoff.py
    source: justbackoff-0.6.0/tests/test_backoff.py
    description: "上游 unittest 套件（TestBackoff 类 6 个用例：test_defaults / test_factor / test_for_attempt / test_get_attempt / test_jitter / test_integers；实测 6 passed = 100%）"
    command: "python3 -m pytest tests -v"
  - file: tests/__init__.py
    source: justbackoff-0.6.0/tests/__init__.py
    description: "包标记文件（空），非测试用例（声明 0 个用例）"
    command: "-"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_justbackoff.py
    description: >-
      消费者/API 测试（42 断言，R34 真实调用被测 API）：单位换算
      to_seconds/to_ms、默认构造值、duration() 序列 + attempt() + reset()、
      for_attempt() 直查（且不推进计数器）、factor=1.5 序列、max_ms 封顶
      （6/7/10 次方边界）、int 参数与 float 参数等价、jitter=True 落在
      [min_ms, min_ms*factor^attempt] 内、固定种子下 jitter 可复现、
      jitter=False 完全确定、模块文件位于被安装的 site-packages
    command: "python3 test_justbackoff.py <site-packages-dir>"

  - file: test_ohos_justbackoff.py
    description: >-
      **鸿蒙特有测试（11 断言，≥1 达标；非上游用例，OHOS 适配新增）**：
      O1 OHOS 运行时身份（平台 CPython 3.12 + 实测 sys.platform=ohos/aarch64）；
      O2 导入路径必须落在 OHOS conan 布局
      `<pkg>/lib/python3.12/site-packages/justbackoff/`（验证 conanrun
      PYTHONPATH 接线在平台上生效）；O3 noarch/无二进制契约（载荷内
      .so/.pyd/.dylib/.a/.o 计数为 0 —— aarch64 制品即上游纯 Python 载荷，
      无需交叉编译产物）；O4 平台熵源（stdlib random 是模块唯一的非上游
      表面：8 次 random() 落在 [0,1) 且 jitter 有界）；O5 只读安装契约
      （`python3 -B` 全新解释器从包树导入并计算成功，且不落 __pycache__ ——
      OHOS 沙箱安装目录可能不可写）
    command: "python3 test_ohos_justbackoff.py <site-packages-dir>"

# 测试断言总数（实测：42 + 11 = 53；鸿蒙特有用例 11 ≥ 1）
assertion_count: 53

# 上游测试实测结果（R51 如实申报）
upstream_test_note: >-
  上游 pytest 套件在 build() 内真实运行，实测 **6 passed, 0 failed, 0 skipped**
  （`6 passed in 0.05s`），用例总数 = 上游声明用例总数 = 6，未执行 0（无漏测）。
  套件退出码非 0（或超时）时 conan create 直接抛 ConanException 失败，杜绝
  「测试没跑通但构建成功」。测试运行器（pytest>=7）由构建期从平台 pip 镜像取到
  独立目录；取依赖失败显式抛错，不以跳过冒充通过。
  test_package 消费者测试：**42/42 passed**；鸿蒙特有测试：**11/11 passed**。
