software: joystick
display: "joystick (linuxconsoletools)"
description: "Linux 输入子系统用户态工具集：joystick 测试/校准（jstest、jscal、evdev-joystick）、串口转输入连接器（inputattach）、力反馈测试（fftest/ffset/ffcfstress/ffmvforce）。"
category: utility
homepage: "https://sourceforge.net/projects/linuxconsole/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "内核 UAPI 头（linux/input.h 等）由 OHOS clang sysroot 自带（无需头文件注入）；随包补丁 1 枚＝K0 命令行契约（7 个源文件），除此源码零修改"
    - "ffmvforce 的 SDL2 静态闭包（-lohaudio -lnative_window -lEGL -lGLESv2）以两段式 make 命令行注入，不依赖 CI pkg-config"
    - "交付 ELF 在 build() 内 selfSign 签名（E077/E135）"
    - "/dev/input 设备级功能属运行期能力，无设备环境走 --help/退出码契约断言"
  common_dependencies:
    - sdl2/2.32.10

versions:
  "1.8.1":
    status: built
    build_date: "2026-09-27"
