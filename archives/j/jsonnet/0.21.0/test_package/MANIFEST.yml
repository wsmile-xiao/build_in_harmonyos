# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: jsonnet/0.21.0
homepage: "https://jsonnet.org/"

# 上游测试命令 (make test runs all test suites)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: core/libjsonnet_test_snippet.c
    source: jsonnet-0.21.0/core/libjsonnet_test_snippet.c
    description: "C API snippet evaluation test"
    command: "./libjsonnet_test_snippet"
  - file: core/libjsonnet_test_file.c
    source: jsonnet-0.21.0/core/libjsonnet_test_file.c
    description: "C API file evaluation test"
    command: "./libjsonnet_test_file"
  - file: cpp/libjsonnet_test_locale.cpp
    source: jsonnet-0.21.0/cpp/libjsonnet_test_locale.cpp
    description: "C++ API locale test"
    command: "./libjsonnet_test_locale"
  - file: test_suite/run_tests.sh
    source: jsonnet-0.21.0/test_suite/run_tests.sh
    description: "Language test suite (165 .jsonnet golden tests)"
    command: "./test_suite/run_tests.sh"
  - file: test_cmd/run_cmd_tests.sh
    source: jsonnet-0.21.0/test_cmd/run_cmd_tests.sh
    description: "CLI behavior tests (77 do_test/do_fmt_test cases)"
    command: "./test_cmd/run_cmd_tests.sh"
  - file: examples/check.sh
    source: jsonnet-0.21.0/examples/check.sh
    description: "Example golden tests"
    command: "./examples/check.sh"
  - file: test_suite/run_fmt_tests.sh
    source: jsonnet-0.21.0/test_suite/run_fmt_tests.sh
    description: "Formatter golden tests"
    command: "./test_suite/run_fmt_tests.sh"
  - file: test_suite/run_fmt_idempotence_tests.sh
    source: jsonnet-0.21.0/test_suite/run_fmt_idempotence_tests.sh
    description: "Formatter idempotence tests"
    command: "./test_suite/run_fmt_idempotence_tests.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: evaluate Jsonnet expression via C API"
    command: "./test_jsonnet"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
