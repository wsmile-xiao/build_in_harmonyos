software: jsonnet
# 版本级 manifest
# 文件位置: archives/j/jsonnet/0.21.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.21.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-08"

# 构建系统类型
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/google/jsonnet/archive/refs/tags/v0.21.0.tar.gz"

  # 源码校验和
  sha256: "a12ebca72e43e7061ffe4ef910e572b95edd7778a543d6bf85f6355bd290300e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # jsonnet 使用纯 Makefile，无需 configure

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # jsonnet 内置 nlohmann-json、rapidyaml 和 md5（third_party/ 随源码捆绑），无外部依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-Makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# - HMDFS 不支持 ln -sf 覆盖（已通过补丁修复）

# ============================================================
# 质量验证备注
# ============================================================

verify_notes:
  g0_status: built
  g0_reason: "纯 Makefile 项目无 configure 脚本，补丁应用成功，实际构建无需人工介入"
  g1_g4_status: built
  build_system_note: "纯 Makefile 项目，G0 验证流程跳过 configure 步骤的建议案例"
