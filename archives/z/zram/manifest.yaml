# 软件级 manifest — zram（上游 systemd/zram-generator）
# 遵循 ARCHIVE-SPEC v3.0

software: zram
display: "zram-generator"
description: "读取 zram-generator.conf 生成并配置 zram 压缩交换设备的 systemd unit generator（OHOS 以独立 CLI 形态交付）"
category: system
homepage: "https://github.com/systemd/zram-generator"
license: MIT
build_system: cargo

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Rust 纯 crate（无 C 源码）：cargo --release 直接编译；CC/RUSTFLAGS 指向 OHOS clang"
    - "上游 Makefile 以 pkg-config systemd 取 SYSTEMD_* 安装目录，OHOS 无 systemd：用 make 命令行变量覆盖（SYSTEMD_UTIL_DIR 占位 + NOMAN=1），零补丁"
    - "src/setup.rs 以 env!(\"SYSTEMD_UTIL_DIR\") 编译期内联该值，Makefile `export SYSTEMD_UTIL_DIR` 传递给 cargo，值缺失即编译失败"
    - "OHOS 无 systemd：unit 拉起形态不可用，交付独立 CLI（--setup-device/--reset-device/生成单元目录），不装 systemd unit 与 man 页"
    - "cargo 依赖走 rsproxy.cn sparse 镜像（设备直达 crates.io TLS 不通，argc 先例）；Rust 工具链探测 harmonybrew 已知位置，缺失时从 Harmonybrew bottles 引导"
    - "设备内核无 zram（/sys/class/zram-control、/dev/zram* 不存在）：真机仅能验证 CLI/config/单元生成路径，--setup-device 干净报错退出（exit 1）"
  common_dependencies:
    - rust

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2.1":
    status: built
    build_date: "2026-09-30"
    published_as: zram/1.2.1
