# test_package/MANIFEST.yml — zram/1.2.1 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: zram/1.2.1
homepage: "https://github.com/systemd/zram-generator"

# 上游测试命令（Rust 项目 cargo test；--lib --bins 范围见审计说明）
upstream_check_command: "cargo test --release --lib --bins"

# 上游测试在 test_package 阶段执行（hmbs 预检只从 test_package 阶段
# stdout 采集 HMBS_UPSTREAM_TEST_RESULT 标记，tlsx/1.2.2 先例）
upstream_test_in_build: false
upstream_test_command: "cargo test --release --lib --bins"

# 上游测试存在性审计（hmbs 硬门禁要求）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 zram-generator 1.2.1 存在完整测试套件（make check = cargo test），
  已接入并在真机执行；单元测试真机执行 41 个全部通过（cargo 两条 result 行：
  lib 18 + bin 23），集成测试 12 个 NOT_RUN（双重独立原因，见下），doc-tests
  阶段按平台限制排除。官方总量口径 53 个（41 cargo result 行 + 12 集成函数），
  真实通过率 41/53 = 77.4%。
  1. 单元测试 src 侧唯一 #[test] 23 个：src/config.rs 16 个 + src/generator.rs
     2 个 + src/main.rs 5 个（clap 参数解析），无环境门，真机
     （aarch64-unknown-linux-ohos，cargo 1.97.1）实测两条 "test result:" 行——
     lib 目标 "18 passed" + bins 目标 "23 passed"（bin 目标重新编译纳入 lib
     模块用例，18 个被计入两行），合计 41 执行 41 通过。
  2. 集成测试 12 个（tests/test_cases.rs 的 test_01…test_11 + test_07a，无任何
     #[cfg] 条件门；对 tests/01-basic…11 + 07a fixture 树做单元生成并与
     run.expected 递归 diff）NOT_RUN，两层原因相互独立、任一即足以豁免：
     a) 编译层（具体报错定位）：其 dev-dependency nix 0.23.2 的 pre-ohos cfg 门
        —— `#[cfg(all(target_os = "linux", not(target_env = "musl")))]` 等
        （nix-0.23.2/src/fcntl.rs:88-93 的 O_FSYNC、lib.rs 的 mqueue/aio 模块
        门）——在 target_env="ohos" 上误判定为非 musl 而启用 glibc-only 符号；
        而 libc 的 musl 模块（ohos 目标路由至此）从未提供 O_FSYNC/mq_*/aio_*
        （对 libc 0.2.139…0.2.189 全版本源码逐一核实），真机实测 51 个编译
        错误（E0425 cannot find value `O_FSYNC` / function `mq_open`、E0004、
        E0308）。任何 libc 版本固定都无法满足；上游声明范围 nix >=0.22,<0.24
        内无 ohos 感知版本（0.26.4 同样存在该 cfg 门），ohos 修复出现在 nix
        >=0.27，但 0.27 已移除测试辅助代码所用的 mount API——故以
        patches/0001-gate-nix-devdep-for-ohos.patch 将 nix 按
        cfg(not(target_env = "ohos")) 门控（仅调整依赖解析的目标适用范围，
        不改动任何上游测试用例），集成目标在 OHOS 上不参与编译。
     b) 运行层：即使可编译，tests/test_cases.rs 的 #[ctor] unshorn() 在非 root
        且 unshare(NEWUSER) 被拒（EPERM）时打印 "skipping tests" 并 exit(0)——
        整个集成测试二进制在 ctor 阶段退出、libtest 不输出 "test result:" 行，
        cargo 记 0 执行。本设备 SSH 非 root、内核禁 user namespace。
  3. doc-tests 说明：cargo test 默认 doc-tests 阶段依赖 rustdoc，OHOS
     harmonybrew Rust 工具链无 rustdoc（真机探针实证，
     DRAFT-rust-toolchain-no-rustdoc-skip-doctests；
     martin/1.13.0、argc/1.24.0 等已合入先例同判平台限制）。
  4. 计数方式：以真机 cargo test 输出的 "test result:" 框架行为准
     （discovered/executed/passed/failed/skipped 全部取自框架输出，非静态统计）；
     集成 12 个因整二进制 ctor 退出无 result 行、不计入 executed，官方总量
     53 = 41（result 行）+ 12（集成函数），唯一 #[test] 函数 35（src 23 +
     tests/ 12），真实通过率 41/53 = 77.4%。
     上游仓库无 Cargo.lock，依赖由 Cargo.toml 解析。

# 上游实际运行的测试程序
upstream_tests:
  - file: src/config.rs
    source: zram-generator-1.2.1/src/config.rs
    description: "配置解析单元测试（16 个 #[test]）"
    command: "cargo test --release --lib --bins"
  - file: src/generator.rs
    source: zram-generator-1.2.1/src/generator.rs
    description: "单元生成器单元测试（2 个 #[test]）"
    command: "cargo test --release --lib --bins"
  - file: src/main.rs
    source: zram-generator-1.2.1/src/main.rs
    description: "CLI 参数解析单元测试（5 个 #[test]）"
    command: "cargo test --release --lib --bins"
  - file: tests/test_cases.rs
    source: zram-generator-1.2.1/tests/test_cases.rs
    description: "fixture 集成测试（12 个 #[test]）—— OHOS 上 NOT_RUN：dev-dep nix 0.23 pre-ohos cfg 门在 ohos 目标编译失败（上游范围无兼容版本），且其 #[ctor] 在本设备非 root 环境本就 exit(0) 跳过；已按 patches/0001 门控排除，逐项口径见 upstream_test_audit"
    command: "cargo test --release --lib --bins"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — --version / --help（含编译期内联文本断言）/ 生成器模式产出 dev-zram0.swap / 无内核 zram 时 --setup-device 干净报错"
    command: "/bin/sh test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
