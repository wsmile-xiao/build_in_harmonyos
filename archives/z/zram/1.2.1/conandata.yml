# conandata.yml — zram 1.2.1（上游 systemd/zram-generator）
# Source: GitHub tag archive (official release v1.2.1)
# Mirror fallback: gh-proxy.com 在前（真机实测可用），官方原始 URL 兜底
# （映射与 ci/conan/build_and_test.sh get_mirrors 的 GitHub 分支一致）
# 注意：不用 crates.io .crate（上游 Cargo.toml exclude 了部分 tests/，两种归档内容不同）

sources:
  url:
    - "https://gh-proxy.com/https://github.com/systemd/zram-generator/archive/refs/tags/v1.2.1.tar.gz"
    - "https://github.com/systemd/zram-generator/archive/refs/tags/v1.2.1.tar.gz"
  sha256: "9c82cd3db386e82fba2adfe01c3d09436c9e9cfe3ca8bb341d7eb882768c58af"

patches:
  "1.2.1":
    - patch_file: "patches/0001-gate-nix-devdep-for-ohos.patch"
      patch_description: "dev-dependencies 的 nix 按 cfg(not(target_env = \"ohos\")) 门控（仅调整依赖解析的目标适用范围，不改动任何上游测试用例与断言）。原因：nix 0.23 的 pre-ohos cfg 门（not(target_env = \"musl\")）在 aarch64-unknown-linux-ohos 上误启用 glibc-only 符号（O_FSYNC/mqueue/aio/FDPIC_FUNCPTRS 等，51 个编译错误，真机定位），任何 libc 版本都无法满足（musl 模块本就无这些符号）；上游声明范围 <0.24 内无 ohos 感知版本，ohos 修复出现在已移除 mount API 的 nix >=0.27，而上游集成测试辅助代码依赖 mount。门控后 OHOS 上 cargo test --lib --bins 真实运行 41 个（cargo 结果行 lib 18 + bin 23）单元测试；非 OHOS 平台行为与上游完全一致（nix 仍生效）"
      patch_type: "portability"
