software: zram
# 版本级 manifest
# 文件位置: archives/z/zram/1.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"

# 构建系统类型（顶层字段）
build_system: cargo

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/systemd/zram-generator/archive/refs/tags/v1.2.1.tar.gz"

  # 源码校验和
  sha256: "9c82cd3db386e82fba2adfe01c3d09436c9e9cfe3ca8bb341d7eb882768c58af"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | cargo | custom
  system: cargo

  # 配置选项列表
  configure_options: []
  # 上游 Makefile program 目标，make 命令行变量覆盖：
  #   NOMAN=1 SYSTEMD_UTIL_DIR=/usr/lib/systemd CARGO=<cargo>

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # Rust crate 依赖由 cargo 按 Cargo.toml 解析（rsproxy.cn 镜像），无 C/C++ 库依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-gate-nix-devdep-for-ohos.patch"
  # dev-dependencies 的 nix 按 cfg(not(target_env = "ohos")) 门控：
  # nix 0.23 的 pre-ohos cfg 门（not(target_env="musl")）在 ohos 目标上误启用
  # glibc-only 符号（O_FSYNC/mqueue/aio，51 个编译错误），任何 libc 版本都无法
  # 满足；上游范围 <0.24 内无 ohos 感知版本，ohos 修复在已移除 mount API 的
  # nix >=0.27。仅调整依赖解析的目标适用范围，不改动任何上游测试用例。
  # Makefile 的 pkg-config systemd 硬门未打补丁，用 make 命令行变量覆盖绕开。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 Makefile 的 pkg-config systemd 硬门可用 make 命令行变量覆盖绕开：GNU make 命令行变量优先于文件内 := 赋值，pkg-config 不再执行（三个 SYSTEMD_* 变量全量覆盖消除日志噪音），零 Makefile 补丁"
  - "src/setup.rs 以 env!(\"SYSTEMD_UTIL_DIR\") 编译期内联 util 目录（--help 文本与 systemd-makefs 路径），Makefile `export SYSTEMD_UTIL_DIR` 传递给 cargo；值缺失即编译失败——覆盖变量必须与 Makefile 导出名一致"
  - "nix 0.23 的 pre-ohos cfg 门（all(target_os=\"linux\", not(target_env=\"musl\"))）在 target_env=\"ohos\" 上误启用 glibc-only 符号（O_FSYNC/mqueue/aio），libc musl 模块任何版本都无这些符号（0.2.139…0.2.189 逐版本核实），cargo 对 --bins 测试目标同样构建 dev-deps 图——以 dev-deps 的 target cfg 门控补丁解决"
  - "OHOS 无 systemd：交付独立 CLI（--setup-device/--reset-device/生成单元目录），systemd unit 与 man 页不安装（NOMAN=1）"
  - "设备内核无 zram：--setup-device 在 /sys/block/zramN sysfs 写入处干净报错退出（anyhow 上下文，exit 1 无 panic），可作为无 zram 环境的行为断言；生成器模式（ZRAM_GENERATOR_ROOT + 配置 → 单元文件）不依赖内核 zram，真机可完整验证"
  - "HMDFS 上 cargo 并发写 build-script 后立即 exec 偶发 Text file busy (os error 26)，失败重试一次即可；genuine 编译错误不受影响"
  - "设备 $HOME 下带 'tmp' 字样的目录会被存储清理机制清空（真机实测十几分钟内归档+解包内容全失），工作目录避开 tmp 命名"
