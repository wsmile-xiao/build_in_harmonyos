# zsxd
# 文件位置: archives/z/zsxd/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: zsxd

display: zsxd

description: Zelda Mystery of Solarus XD — Solarus 引擎游戏任务数据包（纯数据/脚本）

category: data

homepage: "https://gitlab.com/solarus-games/games/zsxd"

license: GPL-3.0-only AND CC-BY-SA-4.0

build_system: none

ohos_adaptation:
  key_points:
    - "纯数据/脚本包，无 C/C++ 编译：conanfile 无 build()，data.solarus 用 Python zipfile 在 package() 内复刻上游 CMake 打包"
    - "bin/zsxd launcher 按自身相对位置解析 quest 目录（dirname $0/..），不写死构建期绝对路径，Conan 重定位安全"
    - "launcher 增加 --version/--help 自处理分支：solarus-run 为运行期外部依赖，打包/CI 环境无引擎时 launcher 仍可自检"
    - "运行期外部依赖 solarus 引擎（含 solarus-run）不随本包分发，消费方需自行安装"
    - "脚本只用 POSIX 内建命令无 heredoc（OHOS mksh + /tmp 只读陷阱），生成时禁止 CR"
  common_dependencies:
    - solarus        # 运行期外部依赖（引擎，非构建依赖）

versions:
  "1.12.2":
    status: built
    build_date: "2026-10-03"
    notes: "首次适配，data.solarus 完整性 + launcher 端到端测试 22/22 通过"
