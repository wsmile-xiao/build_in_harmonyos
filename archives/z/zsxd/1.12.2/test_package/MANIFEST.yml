# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: zsxd/1.12.2
homepage: https://gitlab.com/solarus-games/games/zsxd

# 上游测试命令
# 上游 CMakeLists.txt 只有 data.solarus 打包 target 与 install，无 check 目标；
# 源码树内无任何测试目录/测试框架（find -iname '*test*' 无结果），N=0。
upstream_check_command: "none (no check target; find -iname '*test*' returns nothing)"

# conanfile.py build() 方法中是否已集成上游测试
# （zsxd 为数据包，无编译阶段：build() 仅数据自检+打包，package() 纯搬运）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，M=22 断言 + 1 端到端消费者用例)
test_package_tests:
  - file: test_zsxd.py
    description: >-
      真实消费打包产物 data.solarus 与 bin/zsxd：(A) 用 Python zipfile 打开
      data.solarus，断言合法 zip、条目数 == 上游 CMake glob 文件数 674、关键文件
      (quest.dat/project_db.dat/main.lua/languages/{en,es,fr}/text/{dialogs,strings}.dat)
      齐全、无 glob 外多余条目、quest.dat 自述 quest_version=1.12.2；
      (B) bin/zsxd 存在/可执行/shebang=#!/bin/sh/无 CR，且 --version 自处理分支
      输出 "zsxd 1.12.2"；(C) 端到端消费者用例：用 stub solarus-run 记录 argv
      后驱动 bin/zsxd，断言 stub 被真实调用、quest 目录解析为
      <package>/share/solarus/zsxd、追加参数透传；(D) licenses/ 与 desktop/徽标
      随包发布。
    command: "python3 test_zsxd.py <package_folder>"
# 测试断言总数
assertion_count: 22
