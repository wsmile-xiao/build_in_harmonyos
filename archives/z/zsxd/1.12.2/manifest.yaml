knowledge_gained:
  - "zsxd 为 Solarus 引擎的游戏任务数据包：上游 CMakeLists.txt 不做任何 C/C++ 编译，只用 zip 把 data/ 压成 data.solarus、生成一行 bin/zsxd 启动脚本（solarus-run <prefix>/share/solarus/zsxd $*）并安装图标/desktop (ref: E255)"
  - "纯数据/脚本包：无编译阶段，build() 只做数据自检+用 Python 标准库 zipfile 复刻上游 CMake 打包（条目=上游 CMake glob 的 *.spc/*.ogg/*.it/*.png/*.dat/*.lua/*.ttf/*.ttc/*.fon，共 674 个文件，arcname 相对 data/ 无前缀），不依赖外部 zip 二进制；package() 纯搬运 (ref: E255)"
  - "bin/zsxd launcher 按脚本自身相对位置解析 quest 目录（dirname $0/.. → share/solarus/zsxd），不写死构建期绝对路径，包随 Conan 重定位后仍可用；runenv_info 同时导出 ZSXD_QUEST_DIR 供消费方直接取用 (ref: E255)"
  - "launcher 增加 --version/--help 自处理分支（打印 zsxd 1.12.2/用法）让脚本在引擎（运行期外部依赖 solarus-run）缺席的打包环境也可自检，真实启动仍 exec solarus-run (ref: E255)"
  - "OHOS /bin/sh 为 mksh 且 /tmp 只读（debootstrap E001/E002 先例）：脚本只用内建命令+命令替换，无 heredoc，不触碰 /tmp；脚本生成时禁止 CR（Windows 文本模式会写坏 shebang） (ref: E002)"
  - "lang-preflight 判 mixed（manifest=cmake、源码统计 lua 100%）为数据包正常预期，非中止条件；按数据/脚本包路径适配（先例：debootstrap/debian-astro/debian-design） (ref: E255)"

