# 软件级 manifest — zurl
# 遵循 ARCHIVE-SPEC

software: zurl
status: built

description: "zurl — Qt5 ZeroMQ 接口的 HTTP/WebSocket 客户端守护进程（ohos-aarch64 适配中）"
category: net
homepage: "https://github.com/fanout/zurl"
license: GPL-3.0-or-later
build_system: qmake

ohos_adaptation:
  key_points:
    - "qconf configure + qmake + make（--qtselect=5，--qtdir 直指 qt5-qtbase 包，QMAKESPEC=linux-clang）；产出 zurl 守护进程 + 内部静态 libzurl.a（仅打包二进制）"
    - "GitHub 归档缺子模块源码 → conandata.yml 按 v1.12.0 gitlink 固定 vendor（qzmq@3ffbcf4、common@0fdb3b9）"
    - "zeromq 包缺 libzmq.pc 时 recipe 生成 build-tree shim（仍链真实 libzmq）；CPATH/LIBRARY_PATH 冒号拼接补齐 pkg-config 失效路径"
    - "上游 QtTest 两套件（httprequesttest 14 + websockettest 7 测试函数）本地回环离线可跑，build() 内运行取证"
    - "zurl --version 打印版本后干净退出；test_package 4 检查点（--version + ELF + ldd + ipc 启停）"
  common_dependencies:
    - "qt5-qtbase (5.15.2.2)"
    - "zeromq (4.3.5)"
    - "curl (8.15.0.1)"
    - "openssl (3.5.6.1)"

versions:
  "1.12.0":
    status: built
    note: "配方工作树完成，待 HMBS 真机预检（conan create + 上游测试 + test_package）后提交 PR"
