# 版本级 manifest — zurl 1.12.0
# 遵循 ARCHIVE-SPEC v2.0
# 状态: built（配方完成，真机 conan create + test_package + 上游测试待 HMBS 预检）

version: "1.12.0"
software: "zurl"
status: built
build_date: "2026-09-18"
build_system: qmake

source:
  url: "https://github.com/fanout/zurl/archive/refs/tags/v1.12.0.tar.gz"
  sha256: "f6e0d963a1aeae146ee478bd77ec8cb9e90c274fed93611cf19b2925ee746c1d"
  tar_format: tar.gz

build:
  system: qmake
  configure_options:
    - "--qtselect=5"
    - "--qtdir=<qt5-qtbase package>"
    - "QMAKESPEC=linux-clang"
    - "make QMAKE_STRIP=\"\" (OHOS loader rejects stripped ELF)"
  dependencies:
    required:
      - "qt5-qtbase/5.15.2.2 (qmake + moc + QtTest)"
      - "libzmq/4.3.5-vendored (上游源码内联 autotools 静态构建，直链进守护进程；不再依赖 zeromq 包，见 notes #29)"
      - "curl/8.15.0.1 (libcurl)"
      - "openssl/3.5.6.1 (curl 传递依赖；HAVE_OPENSSL 保持关闭：qt5-qtbase 以 -no-openssl 构建，openssl 探测经 pkg-config 阻断恒为否，见 notes #41/#44)"
      - "zlib/1.3.1.1 (override=True, 仓内独有版本、零 tool_requires：裸 1.3.1 双远端共存会命中 CCI 配方并拉起无 OHOS 条目的 cmake/4.4.3-KeyError，libcoverart 同指纹实证；直接先例 baka/2.0.4 + fceux/2.6.6 同配 qt5-qtbase/5.15.2.2 均用此闭包)"
      - "expat/2.8.2.1 (override=True, 切断 CCI expat → CCI cmake 构建链：#25 停用实验 11:08 复现 KeyError 已证必要)"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-qt-no-ssl-fallback.patch（#47：QT_NO_SSL 下 QSslSocket→QTcpSocket 回退；有 SSL 的 Qt 下零行为变化）"

knowledge_gained:
  - "zurl 1.12.0 = fanout/zurl（Qt5 ZeroMQ HTTP/WebSocket 客户端守护进程），qconf configure + qmake + make，产出 zurl 二进制（TEMPLATE=app）与内部静态 libzurl.a（无安装规则，不打包）"
  - "GitHub tag 归档内 src/qzmq、src/common 为空目录（子模块不随归档发布）→ conandata.yml 按 v1.12.0 gitlink 固定提交 vendor（qzmq@3ffbcf4、common@0fdb3b9，ableton-link 先例）"
  - "configure 为 qconf 生成脚本：经 --qtdir 直指 qt5-qtbase 包内 qmake；QMAKESPEC=linux-clang 透传；pkg-config 探测 libzmq/libcurl/libssl（libzmq 来自配方内 vendor 静态安装的真实 .pc，libzmq 查询经 --static 包装闭合；缺 .pc 时 recipe 生成 build-tree shim，仍链真实构建产物）"
  - "上游测试 tests/httprequesttest（14 测试函数）+ tests/websockettest（7 测试函数），QtTest + 本地 QTcpServer，离线可跑；随 make 默认构建，build() 内运行并解析 Totals 行取证"
  - "zurl --version 打印 Zurl 1.12.0 后干净退出（L2 smoke 天然通过）；test_package 用 --version + ELF + ldd + TMPDIR ipc 启停 daemon 共 4 个检查点"

failure_reason: null
