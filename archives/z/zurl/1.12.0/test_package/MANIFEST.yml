# test_package MANIFEST — zurl 1.12.0（Qt5 ZeroMQ HTTP/WebSocket 客户端守护进程）
# R34 反空壳：测试源必须实质调用被测包二进制/API。
# 上游 tests/ 随 make 默认构建，conanfile.py build() 内真实运行两套件并解析
# QtTest Totals 行取证；test_package 从消费者视角执行包内二进制。

package: zurl/1.12.0
homepage: "https://github.com/fanout/zurl"

# 上游测试：qmake SUBDIRS 默认构建，无需 make check（QtTest 二进制直跑）
upstream_check_command: "make (SUBDIRS builds tests/httprequesttest + tests/websockettest)"
upstream_test_in_build: true
upstream_test_command: "./httprequesttest && ./websockettest"

# 上游实际运行的测试程序（真机实测：httprequesttest Totals 16 passed +
# websockettest Totals 9 passed，合计 25；QtTest Totals 行解析，与配方
# _run_upstream_tests 口径一致）
upstream_tests:
  - file: tests/httprequesttest/httprequesttest.cpp
    source: zurl-1.12.0/tests/httprequesttest/httprequesttest.cpp
    description: "QtTest 本地 QTcpServer 回环测试 HttpRequest（16 测试函数：GET/POST/HEAD/DELETE、chunked、204/304、DNS/连接错误，真机实测 Totals）"
    command: "./httprequesttest"
  - file: tests/websockettest/websockettest.cpp
    source: zurl-1.12.0/tests/websockettest/websockettest.cpp
    description: "QtTest 本地 QTcpServer 回环测试 WebSocket 握手（9 测试函数：成功/拒绝/分片失败模式，真机实测 Totals）"
    command: "./websockettest"

# test_package 中自带的测试 (消费者视角验证，4 检查点)
test_package_tests:
  - file: test_zurl.sh
    description: "执行包内 zurl 二进制：--version 版本断言 + arm64 ELF/ldd 冒烟 + tcp 回环配置启停 daemon（started/stopped 日志断言，ipc 路径超长改用 tcp）"
    command: "sh test_zurl.sh <zurl>"

# 测试断言总数（源码审计近似值，用于质量评估；执行结论以真机 evidence 为准）
assertion_count: 71

# rule4 门禁：上游测试总数声明（真机实测 QtTest Totals 16+9=25，与配方标记口径一致；单一可解析框架故用 auto）
upstream_test_total: 25
upstream_test_count_method: auto
upstream_tests_exist: true
