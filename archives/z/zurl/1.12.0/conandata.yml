# conandata.yml — zurl 1.12.0（fanout/zurl，Qt5 + ZeroMQ + curl 客户端守护进程）
# 上游: fanout/zurl tag v1.12.0（2023-10-23，commit 9e773b3）
# R39: GitHub 映射与 ci/conan/build_and_test.sh get_mirrors 同款
# （gh-proxy 在前，官方 URL 在最后兜底）；Conan 2.x get() 按序尝试。
# sha256 均从官方 GitHub 归档实测（下载验哈希，非推断），镜像不改校验值。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/fanout/zurl/archive/refs/tags/v1.12.0.tar.gz"
    - "https://github.com/fanout/zurl/archive/refs/tags/v1.12.0.tar.gz"
  sha256: "f6e0d963a1aeae146ee478bd77ec8cb9e90c274fed93611cf19b2925ee746c1d"

# GitHub 源码归档不含子模块内容；src/qzmq 与 src/common 在主包内为空目录。
# 按 v1.12.0 记录的 gitlink 固定子模块提交（ableton-link 先例）：
# - src/qzmq   submodule jkarneges/qzmq   @ 3ffbcf4708943cee0bb68e5a3a595a2c39e57548
# - src/common submodule fanout/common    @ 0fdb3b91389bc8b401966a10002361d01d4af86a
qzmq:
  url:
    - "https://gh-proxy.com/https://github.com/jkarneges/qzmq/archive/3ffbcf4708943cee0bb68e5a3a595a2c39e57548.tar.gz"
    - "https://github.com/jkarneges/qzmq/archive/3ffbcf4708943cee0bb68e5a3a595a2c39e57548.tar.gz"
  sha256: "2b4ae31d232ab8a6f217cd740cf87d569bfd3d6b59e85c615e33601a95567368"

common:
  url:
    - "https://gh-proxy.com/https://github.com/fanout/common/archive/0fdb3b91389bc8b401966a10002361d01d4af86a.tar.gz"
    - "https://github.com/fanout/common/archive/0fdb3b91389bc8b401966a10002361d01d4af86a.tar.gz"
  sha256: "74a9101550e9e2935d9d8ef8dce0fdd7298fd40c6cb27f2870fc744d475069fc"

# libzmq 由本配方内联构建（notes #29），不再经 Conan 依赖 zeromq 包。
# 与库内 zeromq/4.3.5 配方的 sources 完全同源（URL/sha256 照抄该配方，
# 非推断）；镜像映射同上（gh-proxy 在前，官方源在最后兜底）。
libzmq:
  url:
    - "https://gh-proxy.com/https://github.com/zeromq/libzmq/releases/download/v4.3.5/zeromq-4.3.5.tar.gz"
    - "https://github.com/zeromq/libzmq/releases/download/v4.3.5/zeromq-4.3.5.tar.gz"
  sha256: "6653ef5910f17954861fe72332e68b03ca6e4d9c7160eb3a8de5a5a913bfab43"

# notes #47: src/websocket.cpp 在 QT_NO_SSL 的 Qt（qt5-qtbase -no-openssl）
# 下无条件使用 QSslSocket 导致编译失败；补丁在保留上游 QSslSocket 路径
# 的同时回退到 QTcpSocket（wss:// 在该配置下运行时报 ErrorTls）。
patches:
  "1.12.0":
    - patch_file: "patches/0001-qt-no-ssl-fallback.patch"
