# 软件级 manifest — zdbsp
# 遵循 ARCHIVE-SPEC v2.0

software: zdbsp
display: "zdbsp"
description: "ZDoom 独立节点构建器 — 为 Doom 格式 WAD 构建 BSP/GL 节点"
category: utility
homepage: "https://github.com/rheit/zdbsp"
license: GPL-2.0
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 C++ CMake 单可执行（命令行工具），无 GUI、无运行时语言依赖，仅链接 zlib"
    - "上游 cmake_minimum_required 2.4，CMake 4.x 报 hard error，补丁升至 3.5"
    - "Conan CMakeDeps 只提供 ZLIB::ZLIB 导入目标；老 CMakeLists 的 ZLIB_LIBRARIES/ZLIB_INCLUDE_DIR 变量需改为 target 用法"
    - "内置 zlib 子目录缺 inflate 半边，不可用；必须链接 ohpcd zlib/1.3.1"
    - "64 位目标自动 -DDISABLE_SSE（CMAKE_SIZEOF_VOID_P 探测），OHOS aarch64 无 SSE 代码"
    - "OHOS libc 无 stricmp/strnicmp，CMake CHECK_FUNCTION_EXISTS 自动映射 strcasecmp/strncasecmp"
    - "上游零测试（无 add_test/test 目录/CI 测试），适配后自建鸿蒙特有测试：OHOS 实机运行 zdbsp 处理最小 MAP01 WAD 构建节点"
    - "OHOS mksh 不能直接执行 ELF 二进制，test.sh 用 /data/service/hnp/bin/bash 包装（CONFIG_SHELL 兜底）"
  common_dependencies:
    - "zlib/1.3.1"

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.19-20181027-dfsg.1":
    status: published
    build_date: "2026-09-18"
