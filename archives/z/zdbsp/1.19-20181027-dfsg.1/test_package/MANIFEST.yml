# test_package/MANIFEST.yml
# 上游官方测试声明文件 — zdbsp 1.19-20181027-dfsg.1
# 计数口径: 独立检查项计数（与 notes.md / PR 表格一致）。

package: zdbsp/1.19-20181027-dfsg.1
homepage: "https://github.com/rheit/zdbsp"

# 上游测试清点（R51 三步法，证据见 notes.md）:
#   1) CMakeLists.txt: 无 enable_testing()/add_test()/test()
#   2) 源码树: 无 test/tests 目录（仅文档中的说明性文本）
#   3) 仓库: 无 CI 测试 workflow
# zdbsp 为 CMake 项目，无 make check 目标（该字段仅为 autotools 惯例）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无（上游测试 = 0）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，驱动真实二进制）
test_package_tests:
  - file: test.sh
    description: >
      3 个独立检查项：① zdbsp --help 冒烟；
      ② 鸿蒙特有测试——在 HarmonyOS 上对最小 MAP01 WAD
      （2 顶点 + 1 linedef + 1 sidedef + 1 sector，186B，wadgen.py 生成）
      构建 BSP 节点，验证 OHOS ELF 执行、文件 I/O 与静态 zlib 链接；
      ③ 对节点输出再次处理（循环验证输出 WAD 有效性）。
    command: "bash test.sh"

# 测试断言总数（独立检查项计数，与 PR 表格同口径）
assertion_count: 3
