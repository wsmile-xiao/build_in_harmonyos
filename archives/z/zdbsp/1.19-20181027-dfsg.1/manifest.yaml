version: "1.19-20181027-dfsg.1"
software: "zdbsp"

# 编译状态
# 本地无 conan/OHOS 环境，无法执行 conan create；等待远程 CI 门禁验证。
# 按 R29 语义：conan-verify PASS 且上传制品后才置 published，当前按实际置 built。
status: published

build_date: "2026-09-18"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/rheit/zdbsp/archive/refs/tags/v1.19.tar.gz"
  sha256: "586303cbe1189c2b2239b9713fa8755c3f8aabf6f439d0dd29920b91fb236f29"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options: []
  # CI 侧由 conanfile.py 的 CMakeToolchain 统一生成；aarch64 自动 -DDISABLE_SSE。

  # 运行期仅需 zlib（静态，来自 ohpcd 制品仓）
  dependencies:
  - zlib/1.3.1

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
- "0001-fix-cmake-zlib-target-ohos.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "CMake 4.x 对 cmake_minimum_required < 3.5 的项目报 hard error，需将 2.4 升至 3.5（zdbsp 未使用过新的 CMake 特性，纯语法兼容）"
- "Conan CMakeDeps 只提供 ZLIB::ZLIB 导入目标，不填充 ZLIB_LIBRARIES/ZLIB_INCLUDE_DIR 旧变量；老 CMakeLists 需改用 target 变量，且 include_directories 仅在走内置 zlib 分支时使用"
- "zdbsp 内置 zlib 子目录只有压缩半边（缺 inflate 系列源文件），realmap 解字节依赖系统 zlib，故必须链接 ohpcd 的 zlib/1.3.1 而非内置"
- "64 位目标 CMakeLists 自动定义 -DDISABLE_SSE，OHOS aarch64 不编译任何 SSE 代码"
- "OHOS libc 无 stricmp/strnicmp，CMake 的 CHECK_FUNCTION_EXISTS 探测自动映射为 strcasecmp/strncasecmp，无需额外补丁"
- "上游零测试：无 enable_testing/add_test/test()、无 test 目录、无 CI 测试 workflow；按 rule8 适配后自建鸿蒙特有测试"
