# conandata.yml — zdbsp 1.19-20181027-dfsg.1
# 源码 URL 使用官方上游源（R39）：GitHub rheit/zdbsp v1.19 tag。
# SHA256 对官方 tarball 实测计算。
sources:
  url: "https://github.com/rheit/zdbsp/archive/refs/tags/v1.19.tar.gz"
  sha256: "586303cbe1189c2b2239b9713fa8755c3f8aabf6f439d0dd29920b91fb236f29"

patches:
  - patch_file: "patches/0001-fix-cmake-zlib-target-ohos.patch"
    patch_description: >
      OHOS/CMake 适配：cmake_minimum_required 2.4→3.5（CMake 4.x 对 <3.5 报 hard error）；
      系统 zlib 分支改用 Conan CMakeDeps 提供的导入目标 ZLIB::ZLIB（旧式
      ZLIB_LIBRARIES/ZLIB_INCLUDE_DIR 变量 CMakeDeps 不填充，导致链接/头文件缺失）。
    patch_type: "portability"
  - patch_file: "patches/0002-fix-getopt-decl-ohos.patch"
    patch_description: >
      OHOS 兼容：getopt.h 的 getopt 声明 guard 由 #ifndef __APPLE__ 扩展为
      !defined(__APPLE__) && !defined(__OHOS__)。OHOS sysroot 的 unistd.h
      声明 POSIX getopt(int, char*const[], const char*)，与上游旧式
      extern int getopt (); 在 C++ 中类型冲突（conflicting types），
      同 Apple 先例跳过自带声明、使用系统声明。
    patch_type: "portability"
