# test_package/MANIFEST.yml — zxcc 0.5.7
# 上游官方测试声明文件（R51 上游测试三步法申报）

package: zxcc/0.5.7
homepage: "https://www.seasip.info/Unix/Zxcc/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# ── R51 上游测试清点（实测证据见 notes.md）────────────────────
# 清点方式：
#   1. `make check`（真机实测）→ 顶层/cpmio/cpmredir/Z80/bin 全部
#      "Nothing to be done for 'check'"，上游未定义任何测试目标；
#   2. 源码树无 tests/ / test/ 目录，无 ctest/pytest 注册；
#   3. configure.ac 无 AC_TEST / AM_PATH 检查类测试钩子。
# 结论：上游 0 个测试用例，通过率 N/A。
# 按 R51，"上游确无测试"须自行补齐测试：test_package 提供
# 真实执行型冒烟测试（运行打包出的 zxcc / zxas，覆盖 BIOS 数据
# 加载与参数解析启动路径，PATH 互相解析验证 bindirs 正确性）。

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_zxcc.py
    source: "conan create 自动执行 test_package（conanfile.py test() 调用）"
    description: "真实执行打包产物 zxcc（无参数运行，验证二进制可执行、bios.bin 启动逻辑与用法提示）"
    command: "zxcc"
  - file: test_package/test_zxcc.py
    source: "conan create 自动执行 test_package（conanfile.py test() 调用）"
    description: "真实执行打包产物 zxas（经 PATH 解析 zxcc 包装器，验证 bindirs/运行环境装配）"
    command: "zxas"
  - file: test_package/test_zxcc.py
    source: "conan create 自动执行 test_package（conanfile.py test() 调用）"
    description: "检查五个打包工具（zxcc/zxc/zxas/zxlink/zxlibr）均存在且可执行"
    command: "ZXCC_TEST_BINDIR 文件存在性检查"
  - file: test_package/conanfile.py (self.run)
    source: "conan create 自动执行 test_package"
    description: "调度 test_zxcc.py（conanrun 环境注入 PATH）"
    command: "python3 test_zxcc.py"
