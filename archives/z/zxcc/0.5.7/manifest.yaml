patches_applied:
  - "0001-autotools-ohos-support.patch"

knowledge_gained:
  - "HarmonyOS 上 config.guess/config.sub 需补 HarmonyOS/aarch64/ohos 三元组识别（E007 模式，免 __OHOS__ 宏注入）"
  - "configure 内 `umask 077 && mktemp -d` 在 HMDFS 上创建的目录属主权限位丢失（drwx--S---），写 conftest 即 Permission denied；补丁去掉私有 umask"
  - "cpmio 库实际依赖 ncurses 头/库（-lncursesw），上游 configure 只检测 -lncurses，需 compat-lib 符号链接 + 手动注入 -I/-L"
  - "OHOS /bin/sh=mksh：老 autotools 项目的 configure/libtool 需全程 bash 化（SHELL 变量 + 生成文件后处理）"
