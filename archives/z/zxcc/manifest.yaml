# 软件级 manifest
# 文件位置: archives/z/zxcc/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: zxcc
display: "zxcc"
description: "CP/M 2/3 模拟器与交叉开发工具链包装器（运行 Hi-Tech C CP/M 编译器及 MAC/RMAC/LINK 等工具）"
category: build-tool
homepage: "https://www.seasip.info/Unix/Zxcc/"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需补 HarmonyOS/aarch64/linux-ohos 三元组识别"
    - "configure 内 umask 077 临时目录在 HMDFS 上权限位丢失，需去除"
    - "cpmio 依赖 ncurses（宽字符 libncursesw），经 conan 依赖注入"
  common_dependencies:
    - ncurses

versions:
  "0.5.7":
    status: published
    build_date: 2026-09-21
    published_as: zxcc
