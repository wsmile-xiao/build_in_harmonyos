package: zshdb/1.1.4
homepage: "https://github.com/Trepan-Debuggers/zshdb"
upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "TMPDIR=<writable directory> FPATH=<source>/functions make -j1 check"
upstream_tests:
  - file: "test/unit/*.sh.in"
    source: "zshdb-1.1.4/test/unit/*.sh.in"
    description: "Five Automake unit entries and 34 shunit functions (216 assertions)"
    command: "make -j1 check"
  - file: "test/integration/*.in"
    source: "zshdb-1.1.4/test/integration/*.in"
    description: "27 integration entries; one release-archive fixture restored from the official 1.1.4 tag"
    command: "make -j1 check"
test_package_tests:
  - file: test_zshdb.py
    description: "Installed version and noninteractive script debugging"
    command: "python3 test_zshdb.py <installed zshdb> <test source directory>"
assertion_count: 220 # 216 upstream shunit assertions plus four consumer assertions
