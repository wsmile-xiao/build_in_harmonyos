software: zathura-pdf-mupdf
display: "zathura-pdf-mupdf"
description: "PDF plugin for zathura using MuPDF renderer"
category: document
homepage: "https://github.com/pwmt/zathura-pdf-mupdf"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "插件为 dlopen 对象：导出 zathura_plugin_6_7，宿主符号运行期解析，构建无需 libzathura"
    - "C标准降级：meson -Dc_std=c2x (clang 15不支持C23)"
    - "mupdf 复用 mupdf-tools/1.27.2 包（PIC 静态库+头文件），generate() 手写 mupdf.pc"
    - "zathura 插件公共 API 头从 zathura 2026.05.20 vendoring（其 conan 包 PR #8136 未合入）"
    - "OHOS SDK lld 依赖 libxml2.so.16，构建时前置 SDK lib 目录到 LD_LIBRARY_PATH"
  common_dependencies:
    - girara
    - glib
    - cairo
    - mupdf

versions:
  "2026.05.10":
    status: built
    build_date: "2026-09-17"
