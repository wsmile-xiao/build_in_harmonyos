patches:
  "2026.05.10":
    - patch_file: "patches/0001-meson-conan-build-zathura-headers.patch"
      patch_description: "Vendor the zathura public plugin API headers (from zathura 2026.05.20, Zlib licensed) under zathura-headers/ and adapt the build for conan: use declare_dependency instead of the pkg-config zathura lookup (no conan zathura package published yet); links.h replaces <gtk/gtk.h> with a forward-declared opaque GdkAtom pointer (the plugin never touches the GTK API); document.c uses the standard <glib.h> include instead of <glib-2.0/glib.h> (the conan glib package does not expose the bare glib-2.0/ include root)."
      patch_type: "portability"
