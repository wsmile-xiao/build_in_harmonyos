software: zathura-pdf-mupdf
build_system: meson
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2026.05.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必填字段
# ============================================================

# 版本号
version: "2026.05.10"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://pwmt.org/projects/zathura-pdf-mupdf/download/zathura-pdf-mupdf-2026.05.10.tar.xz"

  # 源码校验和
  sha256: "e57c046e80b65e0a8df82cb04b537102099c38b3ed4d7f30161c2e7dcd9a6e28"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dc_std=c2x"
    - "-Dtests=disabled"
    - "-Dpdf=enabled"
    - "-Dplugindir=lib/zathura"
    - "-Dwrap_mode=nodownload"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - girara/2026.07.07
    - glib/2.84.0
    - cairo/1.18.4
    - mupdf-tools/1.27.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-meson-conan-build-zathura-headers.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "插件是 dlopen 对象：导出 zathura_plugin_6_7 定义结构体，zathura_*/girara 符号由宿主进程在加载期解析，构建无需 libzathura"
  - "mupdf-tools/1.27.2 提供完整 libmupdf.a + libmupdf-third.a（PIC）与 mupdf/ 头文件，生成 mupdf.pc 即可满足 meson dependency('mupdf', version: '>=1.26')"
  - "zathura 插件公共 API 头（6 个）从 zathura 2026.05.20 源码 vendoring；links.h 的 GdkAtom 为不透明指针，可前向声明替代 <gtk/gtk.h>"
  - "musl dlopen 严格重定位：独立测试插件需测试程序以 -rdynamic 提供 zathura_* 宿主 API 桩"
  - "OHOS SDK lld 运行时依赖 libxml2.so.16（在 SDK 自身 llvm/lib 内），构建环境需将该目录加入 LD_LIBRARY_PATH"
  - "document.c 上游的 <glib-2.0/glib.h> 包含路径在 conan glib 布局下不可解析，改为标准 <glib.h>"
