software: zathura-pdf-mupdf
build_system: meson
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2026.05.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2026.05.10"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://pwmt.org/projects/zathura-pdf-mupdf/download/zathura-pdf-mupdf-2026.05.10.tar.xz"

  # 源码校验和
  sha256: "e57c046e80b65e0a8df82cb04b537102099c38b3ed4d7f30161c2e7dcd9a6e28"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "-Dc_std=c17"
    - "-Dtests=disabled"
    - "-Dpdf=enabled"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - girara/2026.02.04
    - zathura/2026.05.20
    - mupdf/1.27.2
    - glib-2.0/2.88.0
    - cairo/1.18.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
