# 版本级 manifest
# 文件位置: archives/z/zimpl/3.7.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.7.1"

# 软件名
software: "zimpl"

# 编译状态
# published | built | failed | archived
# built = 本地 conan-verify 通过但尚未经 CI upload 到制品仓；
# PR 合并后由 release 流水线 upload 成功后才置 published
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/scipopt/zimpl/archive/refs/tags/v3.7.1.tar.gz"

  # 源码校验和
  sha256: "95f24de663321a86d2cdef28e085f23d7604086e7bd4218782353b2e65d943bc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DZLIB=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gmp/6.3.0.1
    - zlib/1.3.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "zimpl 3.7.1 为 C 项目，主构建系统为 CMake（CMakeLists.txt），顶层 Makefile 为 GNU make 辅助路径，lang-preflight 判定正确识别为 cmake"
  - "依赖 GMP（REQUIRED，FindGMP.cmake 支持 GMP_DIR 注入）、BISON>=2.4（REQUIRED）、FLEX（REQUIRED）、ZLIB（可选默认 ON）"
  - "check/check.sh 通过 '../$1' 拼接二进制相对路径，必须以相对路径传入 zimpl 二进制才能运行"
  - "zimpl 输出项顺序受指针哈希表遍历影响（ASLR 非确定性），3 项输出比对测试（minlp.pip/metaio.lp/qubo.lp）数学等价但文本序不同"
