# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: zimpl/3.7.1
homepage: "https://zimpl.zib.de/"

# 上游测试命令
upstream_check_command: "cd check && sh check.sh <zimpl二进制>"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (check/check.sh 209 项)
upstream_tests:
  - file: check/check.sh
    source: zimpl-3.7.1/check/check.sh
    description: "ZIMPL 主测试套件：expr/param/set/subto/condit/var/bool/define/vinst/sos/read 的 lp+tbl 比对、presol 的 mps/tbl/mst/ord/hum 比对、print.out、minlp.pip、metaio、qubo（lp.1/lp.2 双参考）、bqp50-1/ps5-1 稀疏格式、warn/err 输出比对，共 209 项计数（按 check.sh 全部 diff 比较测试点统计，含 e789 区段 10 项）；实测 209 项全部尝试运行，195 通过，14 项运行失败——其中 4 项(minlp.pip/metaio.lp/qubo.lp 双参考)为 ASLR 导致输出项顺序非确定性差异(数学等价，规范化后一致)，10 项(e7xx×7+e8xx×2+e9xx×1)为上游 check.sh 显式标注 \"Error 700 to 900 can vary\" 的可变输出测试（diff 失败标 FAIL (ignored)）"
    command: "cd check && sh check.sh ../../../zimpl-build/build/bin/zimpl"
  - file: test/dotest.sh
    source: zimpl-3.7.1/test/dotest.sh
    description: "ZIMPL 辅助测试脚本（ex1/ex2/ex3/testall/mcaflow1 的 lp/mps/tbl 比对），依赖 .ok 参考文件但源码包未发布，无法直接运行"
    command: "cd test && sh dotest.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：执行 zimpl CLI 翻译 0/1 背包模型（knapsack.zpl），断言生成 .lp 且含 Maximize/Subject to 节"
    command: "bash test.sh <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
# 4 项断言：① self.run 执行 zimpl 退出码 0 ② knapsack.lp 文件生成
# ③ 内容含 Maximize ④ 内容含 Subject to
assertion_count: 4
