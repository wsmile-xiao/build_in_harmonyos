patches:
  "0.5.1":
    - patch_file: "patches/0001-ohos-elf-kernel.patch"
      patch_description: "Treat HarmonyOS as an ELF kernel so the native GNU Make toolchain can be detected"
      patch_type: "portability"
    - patch_file: "patches/0003-ohos-make-default-cxx.patch"
      patch_description: "Normalize the broken built-in CXX in the OpenHarmony make package while preserving its default-origin cross-compiler handling"
      patch_type: "portability"
