software: zmk
display: "zmk"
description: "可复用的 GNU Make 构建库"
category: build-system
homepage: "https://github.com/zyga/zmk"
license: LGPL-3.0-or-later
build_system: make
package_type: build-scripts

ohos_adaptation:
  key_points:
    - "鸿蒙镜像只提供 clang/clang++，且自带 make 的内建 CXX 指向不存在的构建机路径，配方提供 cc/c++ 包装器并显式传入 CC=cc CXX=c++"
    - "上游 make all（生成 14 个 man page）与 make check（28 个 Test.mk 测试套件）在真机完整执行"
    - "消费者测试使用安装后的 zmk 头文件目录构建并运行一个示例程序"
  common_dependencies: []

versions:
  "0.5.1":
    status: verified
    build_date: "2026-09-24"
    conan_ref: "zmk/0.5.1"
