software: zcfan
display: "zcfan"
description: "Zero-configuration fan daemon for ThinkPads"
category: system
homepage: "https://github.com/cdown/zcfan"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "单编译单元 C99 程序，零三方依赖（仅 libc/POSIX），无依赖链风险"
    - "上游手写 Makefile 的 CFLAGS 为 `:=` 赋值并追加 $(CFLAGS)，命令行传 CFLAGS 会整体替换上游 -pedantic -Werror 集，故只注入 CC"
    - "唯一适配补丁：去除 info()/err() 的 GNU `##__VA_ARGS__` 扩展，使 clang -pedantic -Werror 通过（GCC 静默接受，上游 CI 从未暴露）"
    - "配方不执行上游 make install：其 systemd unit 会把构建期 bindir sed 进交付文件；改为直接 copy bin/man/license"
    - "运行期强依赖 /proc/acpi/ibm/fan（thinkpad_acpi），接口缺失时按上游设计 abort，与 Linux 非 ThinkPad 主机一致"
  common_dependencies: []

versions:
  "1.4.0":
    status: built
    build_date: "2026-09-22"
