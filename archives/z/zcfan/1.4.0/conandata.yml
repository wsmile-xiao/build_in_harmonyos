# conandata.yml — zcfan 1.4.0
# 上游源码: GitHub 官方仓库 tag 归档（官方源, R39/PF7；cdown/zcfan 未发布 release 附件，
#           tag tarball 即上游唯一官方发布物，仓库内 2400+ 同形态先例）
#   https://github.com/cdown/zcfan/archive/refs/tags/1.4.0.tar.gz
# sha256 = 33e4944303c778581b6471c79e1273a5668917542e412c8125f028133b684718
#           （已实测下载件 sha256；解压后 zcfan.c sha256 =
#            c2bf5c0ecbded76131730536328fc4d7b5407fe9ad22f5d769a6e1ad03cec12d）
# 适配补丁共 1 个（见下方 patches 段）：上游 info()/err() 宏使用 GNU 变参扩展
# `##__VA_ARGS__`，clang -pedantic 判为 GNU extension 并因上游自带 -Werror 直接报错
# （GCC 仅静默接受，故上游 CI 从未暴露该问题）。补丁改为标准 C99 全变参宏写法，
# 无平台宏、无行为变化，见 notes.md。

sources:
  url: "https://github.com/cdown/zcfan/archive/refs/tags/1.4.0.tar.gz"
  sha256: "33e4944303c778581b6471c79e1273a5668917542e412c8125f028133b684718"

patches:
  - patch_file: "patches/0001-zcfan.c.patch"
    patch_description: "Drop the GNU '##__VA_ARGS__' token-paste extension from info()/err() so the upstream -pedantic -Werror build compiles under clang (pedantic-clean standard C99 variadic macros)"
    patch_type: "portability"
