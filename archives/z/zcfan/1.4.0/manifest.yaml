# ⚠️ 框架约束（实测）：refresh-patch 会用
#   re.sub(r'\npatch_generation:.*', '', content, flags=re.DOTALL)
#   re.sub(r'\npatch_classification:.*', '', content, flags=re.DOTALL)
# 把这两个键之后的全部内容截到 EOF 再重写。
# 因此 knowledge_gained 等人工字段必须写在本块**之前**，且 patch_generation /
# patch_classification 必须位于文件末尾。

version: "1.4.0"
software: "zcfan"
status: built
build_date: "2026-09-22"
build_system: makefile

source:
  url: "https://github.com/cdown/zcfan/archive/refs/tags/1.4.0.tar.gz"
  sha256: "33e4944303c778581b6471c79e1273a5668917542e412c8125f028133b684718"
  tar_format: tar.gz

build:
  system: makefile
  # 上游手写 Makefile，无 configure；只注入 CC（理由见 notes.md「构建参数决策」）
  configure_options:
    - "CC=<profile tools.build:compiler_executables.c>  (make -j1 CC=clang)"
  dependencies: []          # 零三方依赖：仅 libc/POSIX（依赖清单见 notes.md / reports/W0-report.md）
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-zcfan.c.patch"

knowledge_gained:
  - "上游 info()/err() 使用 GNU `##__VA_ARGS__` 扩展；GCC 静默接受，clang -pedantic 报 -Wgnu-zero-variadic-macro-arguments，因上游自带 -Werror 直接致命（实测 10 errors）  [knowledge_ref: E6401]"
  - "上游 CI 不暴露该问题：.github/workflows/ci.yml 只跑 make lint / make clean clang-tidy / make clean clang-everything，后者显式带 -Wno-gnu-zero-variadic-macro-arguments，且从不以 clang 跑裸 make  [knowledge_ref: E6401]"
  - "修复形态：命名参 + ## 改为全变参宏 `#define err(...) fprintf(stderr, \"[ERR] \" __VA_ARGS__)`，标准 C99、无悬挂逗号、输出文本逐字节不变  [knowledge_ref: E6401]"
  - "上游 Makefile 的 CFLAGS 为 `:=` 赋值并追加 $(CFLAGS)，命令行传 CFLAGS 会整体替换上游严格告警集；只注入 CC 最稳  [knowledge_ref: notes.md#构建参数决策]"
  - "上游 `make install` 把构建期 $(bindir) sed 进 systemd unit（ExecStart=@bindir@/zcfan），配方改为直接 copy 真实产物，避免把 Conan 缓存路径写进交付文件  [knowledge_ref: notes.md#交付物]"
  - "zcfan 运行期强依赖 /proc/acpi/ibm/fan（thinkpad_acpi）；接口缺失时按上游设计 abort，与 Linux 非 ThinkPad 主机行为一致，属宿主硬件契约而非平台适配缺陷  [knowledge_ref: notes.md#注意事项]"
  - "框架陷阱：init-build 以 os.link 硬链接复制 .orig→.work，就地编辑工作树会同时改写基线，导致 refresh-patch 差分为空、补丁静默丢失  [knowledge_ref: feedback/SKILL_FEEDBACK_a05d0b70.md]"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /data/storage/el2/base/cache/tmp/builds/zcfan-1.4.0.orig
  source_work_dir: /data/storage/el2/base/cache/tmp/builds/zcfan-1.4.0.work
  source_orig_hash: 8ae54819fc07cd72
  source_work_hash: b4875425768207a0
  generated_at: '2026-09-22T02:29:05'
  patches_count: 1

# 人工核定（refresh-patch 自动判定为 platform_only 有误：本补丁为编译器可移植性
# 修复，不含任何平台宏，也不改变任何平台分支行为。每条 knowledge_gained 已内联
# knowledge_ref: 以满足 check_knowledge_gap 的引用口径）
patch_classification:
