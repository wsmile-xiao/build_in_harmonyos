# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: zcfan/1.4.0
homepage: "https://github.com/cdown/zcfan"

# ---------------------------------------------------------------- 上游测试清点 (R51)
# 清点对象: 上游 tag 1.4.0 归档解压后的完整文件树（9 个文件）
#   .clang-format, .github/workflows/ci.yml, .gitignore, LICENSE, Makefile,
#   README.md, zcfan.1, zcfan.c, zcfan.service.in
# 结论: 无任何运行时测试套件
#   - 无 test/ 或 tests/ 目录
#   - Makefile 无 check / test / TESTS 目标（目标集合只有 all / clang-everything /
#     sanitisers / debug / clang-tidy / install / lint / clean）
#   - 无 ctest / pytest / gtest / criterion 绑定，无 CMakeLists.txt（非 CMake 工程）
#   - zcfan.c 无 assert()/测试宏；唯一可运行入口是需要 thinkpad_acpi 硬件的 daemon 本体
# 上游 CI 的真实测试入口 = 三个静态检查步骤（见 upstream_current_test_entries），
# 均为编译器/格式化器门禁，不产生运行时用例。
upstream_check_command: ""    # 上游无 check 目标（`make -n check` -> "No rule to make target 'check'"）
upstream_tests_exist: false
upstream_test_audit: "Audited the zcfan 1.4.0 tag archive (9 files: .clang-format, .github/workflows/ci.yml, .gitignore, LICENSE, Makefile, README.md, zcfan.1, zcfan.c, zcfan.service.in): no test/tests directory, no check/test/TESTS target in the Makefile (targets are all, clang-everything, sanitisers, debug, clang-tidy, install, lint, clean), no ctest/pytest/gtest/criterion binding and no CMakeLists.txt (hand-written Makefile project). Upstream ships no runtime test harness."
reason: "zcfan 1.4.0 ships no runtime test suite; its CI only runs static-analysis gates (make lint / make clean clang-tidy / make clean clang-everything)."

# ------------------------------------------------- 上游 CI 测试入口（实际执行, 单独统计）
# 这三条是上游 .github/workflows/ci.yml 的全部步骤，已在本机 OHOS (aarch64) 真实执行。
# 计为 3 项上游测试入口：3 executed / 3 passed / 0 failed / 0 skipped。
upstream_current_test_entries:
  - name: "make lint"
    kind: "static-analysis (clang-format)"
    command: "make lint"
    log: "reports/upstream-test-make-lint.log"
    result: "passed (exit 0) — clang-format 15.0.4 -style=file --dry-run --Werror zcfan.c 无差异，补丁未破坏上游格式约定"
  - name: "make clean clang-tidy"
    kind: "static-analysis (clang-tidy)"
    command: "make clean clang-tidy"
    log: "reports/upstream-test-make-clean-clang-tidy.log"
    result: "passed (exit 0) — clang-tidy 15.0.4 无告警（checks 与 upstream 一致）"
  - name: "make clean clang-everything"
    kind: "static-analysis (-Weverything -Werror)"
    command: "make clean clang-everything"
    log: "reports/upstream-test-make-clean-clang-everything.log"
    result: "passed (exit 0) — -Weverything -Werror 全量告警集下零诊断"

upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []   # 上游零运行时用例

# ------------------------------------------------- test_package 自带测试 (消费者视角)
test_package_tests:
  - file: test.sh
    description: >-
      鸿蒙消费者冒烟用例 ×5：①bin/zcfan 已打包且带可执行位；②`zcfan show-usage` → rc=0 且 stdout 含
      "Zero-configuration ThinkPad fan daemon" + "See the zcfan(1) man page for details"（证明
      aarch64-linux-ohos 动态链接二进制在 OHOS musl 上可加载可执行，坏链接将 rc=127）；
      ③`zcfan --version` → rc=0 且与②输出逐字节相同（argc!=1 分支与参数值无关，同时验证 PIE 二次 exec）；
      ④无参运行断言硬件契约：/proc/acpi/ibm/fan 存在 → daemon 常驻至 timeout（rc=124），
      不存在 → 按上游设计在 full_speed_supported 处 abort（rc=134）；
      ⑤share/man/man1/zcfan.1 与 licenses/LICENSE 随包交付。不访问网络、不写系统路径。
    command: "sh test.sh <bindir>"

assertion_count: 5
