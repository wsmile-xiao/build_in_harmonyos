# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: zstd-jni/1.5.6-5
homepage: "https://github.com/luben/zstd-jni"

# Upstream test command
upstream_check_command: "make check"

# Upstream tests integrated in build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (JNI library has no standalone test binary)
upstream_tests:
  - file: "N/A (JNI library, tested via Java test suite in upstream)"
    source: "src/androidTest/java/com/github/luben/zstd/LoadTest.java"
    description: "Android JNI load test (requires JVM, not applicable for native CI)"
    command: "N/A"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "ZSTD compress/decompress roundtrip functional test"
    command: "./test_zstd_jni"

# Approximate assertion count for quality assessment
assertion_count: 5
