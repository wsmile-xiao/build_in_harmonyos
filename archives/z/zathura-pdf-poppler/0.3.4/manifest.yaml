software: zathura-pdf-poppler
version: "0.3.4"
status: built
build_date: "2026-06-02"
build_system: meson

source:
  url: "https://pwmt.org/projects/zathura-pdf-poppler/download/zathura-pdf-poppler-0.3.4.tar.xz"
  sha256: "389fd46e27c7bb0ecb266dbdb0dca4aa9c90a5a0ef5096912f8faebeff939813"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies:
    - "zathura/0.5.14"
    - "girara-gtk3/0.4.5"
    - "poppler-glib/23.12.0"
    - "glib-2.0/2.88.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "zathura-pdf-poppler 是 zathura 的 Poppler PDF 插件，使用 meson 构建系统"
  - "需要先编译 girara-gtk3 和 zathura 作为依赖"
  - "sqlite3.h 系统头文件缺少 sqlite3_mprintf 和 sqlite3_compileoption_used 声明，需要手动补充"
