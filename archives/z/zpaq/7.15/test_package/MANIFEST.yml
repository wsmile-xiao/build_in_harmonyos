# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁读取）

package: zpaq/7.15
homepage: "https://github.com/zpaq/zpaq"

# ── 上游测试清点（R51 三步法第 1 步）────────────────────────────────────────
# 清点结论：上游只有一个测试入口 —— 顶层 Makefile 的 `check` 目标
# （Makefile:32-36），注册用例数 = 1（一次 add -> extract -> cmp 往返）。
# 发布 tarball 无 tests/ 或 test/ 目录，无 ctest/pytest/meson test 注册。
upstream_check_command: "make check"
upstream_test_count: 1

# conanfile.py 的 build() 只构建 `zpaq` 目标，不执行上游 check 目标
# （check 需要在构建机上运行被测二进制；本地实测证据见下方 upstream_evidence）。
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: Makefile
    source: "zpaq-7.15/Makefile"
    description: "check 目标：./zpaq add archive.zpaq zpaq; ./zpaq extract archive.zpaq zpaq -to zpaq.new; cmp zpaq zpaq.new（归档往返 + 字节级比对，1 项断言）"
    command: "make check CXX=clang++ CPPFLAGS=\"-Dunix -DNOJIT\" CXXFLAGS=\"-O3 -DNDEBUG\" LDFLAGS=\"-static-libstdc++\""

upstream_evidence:
  - "make -n check 逐字输出 4 行：./zpaq add archive.zpaq zpaq / ./zpaq extract archive.zpaq zpaq -to zpaq.new / cmp zpaq zpaq.new / rm archive.zpaq zpaq.new —— 断言只有 cmp 一条，故注册用例数=1"
  - "解包目录 8 个文件（.gitignore COPYING Makefile libzpaq.cpp libzpaq.h readme.txt zpaq.cpp zpaq.pod），无 tests/、无 test/、无 ctest/pytest 配置"
  - "上游适配机实测：make check 的 add/extract/cmp 三步全部成功（0.930681 MB 归档，cmp 无差异）；仅收尾 rm 因本机 rm 被沙箱 shim 拦截报 127，与 zpaq 行为无关。完整日志见 reports/test-report.md"

# ── test_package 消费者用例（对安装出来的 bin/zpaq 断言，不计入上游分母）────
# 解释器：conanfile.py 的 test() 先取 $CONFIG_SHELL（ohos-aarch64 profile 的
# [buildenv] 声明），否则按固定候选清单 os.path.exists() 探测；都取不到则显式报错。
# 不用 shutil.which("bash")：会误取调用方运行时自带的 bash，conan 起的 shell 执行它会
# Permission denied（exit 126，实测）。
test_package_tests:
  - file: test.sh
    description: "T1 无参数调用打印 'zpaq v7.15 journaling archiver' 横幅与用法"
    command: 'bash test.sh <pkg>/bin/zpaq'
  - file: test.sh
    description: "T2 add+extract 往返：2 个成员（2.2 MB 二进制 + 文本）字节级 cmp 一致"
    command: 'bash test.sh <pkg>/bin/zpaq'
  - file: test.sh
    description: "T3 日志式归档：第二次 add 产生第 2 个版本（zpaq l 报 '2 versions'）"
    command: 'bash test.sh <pkg>/bin/zpaq'
  - file: test.sh
    description: "T4 版本回滚：-until 1 取回上一版内容并字节级一致"
    command: 'bash test.sh <pkg>/bin/zpaq'
  - file: test.sh
    description: "T5 去重记账：列表含 'after dedupe'"
    command: 'bash test.sh <pkg>/bin/zpaq'
  - file: test.sh
    description: "T5b 增量记账：第二次 add 仅新增 1 个成员（1 +added, 0 -removed.）"
    command: 'bash test.sh <pkg>/bin/zpaq'
  - file: test.sh
    description: "T6 错误诊断：不存在的归档输出 'no-such-archive.zpaq: No such file or directory' 且退出码非 0（实测 2）"
    command: 'bash test.sh <pkg>/bin/zpaq'

assertion_count: 7
