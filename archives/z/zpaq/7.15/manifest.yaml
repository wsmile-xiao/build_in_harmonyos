software: zpaq
build_system: makefile
# 版本级 manifest
# 文件位置: archives/z/zpaq/7.15/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.15"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://mattmahoney.net/dc/zpaq715.zip"

  # 源码校验和
  sha256: "e85ec2529eb0ba22ceaeabd461e55357ef099b80f61c14f377b429ea3d49d418"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CXX=clang++"
    - "CPPFLAGS+=-Dunix -DNOJIT"
    - "CXXFLAGS=-O2 -fPIC"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E999: zpaq JIT generates x86-only code causing SIGILL on ARM/aarch64; fix with -DNOJIT"
  - "E999: zpaq uses simple Makefile; override CXX/CXXFLAGS/CPPFLAGS for OHOS"
