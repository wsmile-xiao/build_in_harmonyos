# 版本级 manifest — zpaq 7.15
version: "7.15"
software: "zpaq"
conan_ref: "zpaq/7.15"
status: built
build_date: "2026-09-25"
build_system: makefile

source:
  url: "https://github.com/zpaq/zpaq/archive/refs/tags/7.15.tar.gz"
  sha256: "64280d86cd38ad5ebc1c6415b17eb09ee292078d772176b90e16287687191efe"
  tar_format: tar.gz
  note: >
    Matt Mahoney 官方仓库 tag 7.15（2016-08-17），与官网 mattmahoney.net 的
    zpaq715.zip 同源；发布物仅 8 个文件（zpaq.cpp / libzpaq.cpp / libzpaq.h /
    Makefile / zpaq.pod / COPYING / readme.txt / .gitignore）。许可证 Unlicense
    （公有领域），libzpaq.cpp 内嵌的 divsufsort.c 部分为 MIT。

build:
  system: makefile
  target: "上游 Makefile 的 zpaq 目标的等价单次调用（zpaq.cpp + libzpaq.cpp -> zpaq）"
  configure_options:
    - '-Dunix              # POSIX 代码路径（上游默认 Windows）'
    - '-DNOJIT             # 必需：libzpaq 的 ZPAQL JIT 只生成 x86 机器码，aarch64 上解压会 SIGILL'
    - '-O3 -DNDEBUG        # 沿用上游 release 语义；上游的 -march=native 去掉（非本机原生目标不可用且破坏可移植性）'
    - '-static-libstdc++   # SDK 的 libc++_shared.so 是链接器脚本，musl 加载器无法解析'
    - '> zpaq-build.log 2>&1  # 必需：/system/bin/sh 做 recipe shell 时编译器 stdio 直连捕获管道会静默退出 1'
  dependencies: []          # 零外部依赖：AES/SHA1/SHA256/scrypt/divsufsort 均在 libzpaq.cpp 内自实现
  cc: clang
  cxx: clang++

patches_applied: []         # 源码零修改

# 扁平汇总键（仓内既有约定：170+ 个包用 test_passed/test_failed，
# submission 的 PR body 生成器与部分门禁读这三个扁平键）
test_total: 1               # 上游注册用例数（make check 的 1 项 cmp 往返）
test_passed: 1
test_failed: 0
upstream_test_total: 1
test_package_total: 7       # 鸿蒙特有断言（对安装出来的 bin/zpaq 实测）
test_package_passed: 7
test_package_failed: 0

package_contents:
  - "bin/zpaq"
  - "licenses/COPYING"
# licenses/COPYING = 上游 Unlicense（公有领域）正文；libzpaq.cpp 内嵌的
# divsufsort 片段为 MIT（双许可情况见 source.note）

test_results:
  upstream:
    type: official
    total: 1
    passed: 1
    failed: 0
    command: 'make check CXX=clang++ CPPFLAGS="-Dunix -DNOJIT" CXXFLAGS="-O3 -DNDEBUG" LDFLAGS="-static-libstdc++"'
    note: >
      上游 Makefile:32-36 的 check 目标 = add -> extract -to -> cmp（1 项断言）。
      实测 1/1 通过；收尾的 rm 因本机 rm 被沙箱 shim 拦截报 127，与 zpaq 行为无关。
  test_package:
    type: ohos_extra
    total: 7
    passed: 7
    failed: 0
    command: "conan create（test_package/test.sh，解释器取 $CONFIG_SHELL，否则按固定候选清单探测 bash）"
    note: "T1 横幅/版本、T2 多成员往返字节一致、T3 日志第二版本、T4 -until 1 回滚、T5 去重记账、T5b 增量只加 1 个成员、T6 缺失归档诊断+非零退出码（实测 rc=2）。脚本以 set -euo pipefail 开头，每处 zpaq 调用显式捕获返回值。"

validation:
  native_build:
    status: built
    command: "conan create archives/z/zpaq/7.15 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 --build=missing --user=ohpcd --channel=stable"
    note: "clang++ 15.0.4，产物 bin/zpaq，DT_NEEDED 仅 libc.so"
  upstream_tests:
    status: built
    command: "make check CXX=clang++ CPPFLAGS=\"-Dunix -DNOJIT\" CXXFLAGS=\"-O3 -DNDEBUG\" LDFLAGS=\"-static-libstdc++\""
    note: "1/1 通过"
  conan_verify:
    status: built
    command: "ohc-run.py conan-verify zpaq 7.15"
    levels:
      G0: pass         # 构建系统识别为 unknown → 依赖预查询被工具跳过（ℹ️）；本包零外部依赖，无预查询可执行
      G1: pass         # 配方结构 12 项；注：G1 里 '✅ R26: 系统同名库静态链接配置存在' 是工具按配方中的 '-static-libstdc++' 字符串误命中，R26 对 application/零依赖包不适用，静态链接结论以 DT_NEEDED 仅 libc.so 为准（见 supplement §L4）
      G2: pass
      G3: pass         # 无 lib/ → 无系统同名库可冲突；G3 的『R26 通过』同样是上条误命中的连带表述
      G4: skipped      # 工具报 '⚠️ 无法找到程序包 ID'（application 包无 lib/，同 bti 034 现象）——未执行，不计入通过
      L2: skipped      # 跳过（无 cache 路径）——未执行，不计入通过
      L4: skipped      # 跳过（无 cache 路径）——未执行，不计入通过
      L5: skipped      # 跳过（无 cache 路径）——未执行，不计入通过
    verdict: "partial（G0-G3 由工具判定并通过 —— G0 的依赖预查询子步骤被工具跳过，见上；G4/L2/L4/L5 工具输出为『跳过（无 cache 路径）』，按『PASS 与 SKIP 并存时以 SKIP 为准』的口径记为未执行，已由人工补测覆盖）"
    supplement: "reports/conan-verify-supplement.md（G4 产物清单 / L2 消费者实测 / L4 ELF 安全属性 / L5 两轮独立构建复现基线）"
    note: >
      application 类型包在 conan-verify 中 G4 会报『无法找到程序包 ID』，导致 L2/L4/L5
      三项『跳过（无 cache 路径）』；工具在报告里对这三项同时打印 ✅ PASS 与 ⏭️ 跳过，
      本 manifest 按 bti 034 的既有口径以『跳过』为准，不把这四项折算成通过。
      真实证据以 test_package 的 7/7 往返断言 + 人工补测为准。

knowledge_gained:
  - "libzpaq 的 ZPAQL::assemble()（libzpaq.cpp:3035-4585）运行期生成 x86-32/x86-64 机器码；aarch64 上不加 -DNOJIT 可编译可压缩，但解压时 Illegal instruction (core dumped) —— 属『能编过但不可用』的隐性失败，必须保留 -DNOJIT（knowledge_ref: knowledge/drafts/zpaq-7.15-nojit-aarch64-sigill.kv）"
  - "OHOS SDK sysroot 的 libc++_shared.so 是链接器脚本（INPUT(-lc++_shared)），musl 加载器无法解析；-static-libstdc++ 静态烘焙 libc++ 后 DT_NEEDED 只剩 libc.so（同 libzpaq 0.01 踩坑，ref: archives/l/libzpaq/0.01/notes.md）"
  - "zpaq 7.15 无 --version/--help，未识别参数一律打印横幅+用法并 exit 1；退出码并非『错误一律 0』：x <不存在的归档>=2、add <不存在的输入路径>=0 —— 依赖 '<tool> --version' 的冒烟门禁对本包不适用，需用真实归档往返断言替代，且错误路径要同时断言诊断文本与退出码（knowledge_ref: knowledge/drafts/zpaq-7.15-no-version-flag-smoke-gate.kv）"
  - "test_package 的 shell 解析不能用 shutil.which('bash')：会误取调用方运行时自带的 bash（/data/storage/el1/bundle/.../bash/bin/bash），conan 起的 /system/bin/sh 执行它报 Permission denied（exit 126）；应按 $CONFIG_SHELL → 固定候选清单 os.path.exists() 探测的顺序解析（knowledge_ref: knowledge/drafts/zpaq-7.15-no-version-flag-smoke-gate.md）"

knowledge_ref:
  - "knowledge/drafts/zpaq-7.15-nojit-aarch64-sigill.kv"
  - "knowledge/drafts/zpaq-7.15-nojit-aarch64-sigill.md"
  - "knowledge/drafts/zpaq-7.15-no-version-flag-smoke-gate.kv"
  - "knowledge/drafts/zpaq-7.15-no-version-flag-smoke-gate.md"
