package: zxcvbn-c/2.6
homepage: "https://github.com/tsyrogit/zxcvbn-c"

upstream_check_command: "./test-internals && ./test-file -t testcases.txt && ./test-inline -t testcases.txt && ./test-c++file -t testcases.txt && ./test-c++inline -t testcases.txt && LD_LIBRARY_PATH=. ./test-shlib -t testcases.txt && ./test-statlib -t testcases.txt"
upstream_test_in_build: true
upstream_test_command: "./test-internals && ./test-file -t testcases.txt && ./test-inline -t testcases.txt && ./test-c++file -t testcases.txt && ./test-c++inline -t testcases.txt && LD_LIBRARY_PATH=. ./test-shlib -t testcases.txt && ./test-statlib -t testcases.txt"

upstream_tests:
  - file: test-internals.c
    source: zxcvbn-c-2.6/test-internals.c
    description: "Validates keyboard graph ordering and reverse-neighbor integrity"
    command: "./test-internals"
  - file: test.c
    source: zxcvbn-c-2.6/test.c
    description: "Runs C and C++ dictionary/password entropy checks"
    command: "./test-file -t testcases.txt"
  - file: test.c
    source: zxcvbn-c-2.6/test.c
    description: "Runs the inline dictionary C and C++ variants"
    command: "./test-inline -t testcases.txt"
  - file: test.c
    source: zxcvbn-c-2.6/test.c
    description: "Runs shared and static library consumers"
    command: "./test-shlib -t testcases.txt && ./test-statlib -t testcases.txt"

test_package_tests:
  - file: test.c
    description: "Calls ZxcvbnMatch, inspects returned match data, and frees it"
    command: "./zxcvbn_test"

assertion_count: 5
