# zerofree 1.1.1 - upstream test status
# Upstream is a single C file plus a plain Makefile:
#   Makefile:  all: zerofree.c
#                $(CC) $(CFLAGS) -o zerofree zerofree.c -lext2fs
# There is no configure, no test target and no test directory in the tarball
# (zerofree-1.1.1.tgz contains only COPYING, Makefile and zerofree.c), so the
# upstream automated test count is 0.
upstream_tests:
  total: 0
  passed: 0
  failed: 0
  skipped: 0
  type: "none"

# R34: the test_package must actually invoke the tested binary.
test_package_tests:
  - file: test.sh
    description: >-
      端到端: ①参数契约（无参数/-x 未知选项/-f 999 超范围/-f abc 非数字/
      缺失镜像，五种情况都必须非 0 退出且给出对应诊断）；②解码配方自带的
      1 MiB ext2 镜像夹具（1024 块，970 空闲块，空闲块内预先写入非零脏数据），
      用 `zerofree -nv` 读取工具自报的 modified/free/total；③断言 dry run 报告的
      几何信息正确且确实发现脏空闲块（夹具非空转）；④真实运行后再用 `-nv` 复核，
      断言 modified 归零、空闲块数不变、镜像确实被重写；⑤`-f 255` 走一遍
      非零填充值路径
    command: "bash test.sh"

# Assertion count is self-reported by test.sh ("[test] N/N assertions passed"),
# with every assertion appending exactly one line to a ledger file, so the number
# equals `grep -c '[ok]' <log>` by construction and cannot drift from the script.
assertion_count: 14
assertion_count_source: "self-reported by test.sh; ledger length == number of [ok] lines"
