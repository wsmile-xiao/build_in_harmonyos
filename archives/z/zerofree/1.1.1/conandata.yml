sources:
  "1.1.1":
    url: "https://frippery.org/uml/zerofree-1.1.1.tgz"
    sha256: "956bc861b55ba0a2b7593c58d32339dab1a0e7da6ea2b813d27c80f08b723867"
patches:
  "1.1.1":
    - patch_file: "patches/0001-Makefile-honour-CPPFLAGS-LDFLAGS.patch"
      patch_description: >-
        Makefile: `CC=gcc` -> `CC?=gcc` 并让链接行接受 $(CPPFLAGS)/$(LDFLAGS)。
        上游把 CC 硬编码为 gcc 且链接行只有 $(CFLAGS)，交叉工具链既无法覆盖编译器，
        也无法把 e2fsprogs 的 -I/-L 传进去（no-more-secrets 的 0001 补丁同因）。
      patch_type: "portability"
    - patch_file: "patches/0002-zerofree.c-include-sys-types.patch"
      patch_description: >-
        zerofree.c 只 include <ext2fs/ext2fs.h> 而未先 include <sys/types.h>。
        glibc 的 ext2fs.h 会间接带入 dev_t/mode_t，musl（OHOS 用的 C 库）不会，
        于是编译报 "unknown type name 'dev_t'" / "'mode_t'"。显式补上该头文件。
      patch_type: "portability"
