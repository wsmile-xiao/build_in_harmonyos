software: zerofree
display: "zerofree"
description: "清零 ext2/3/4 未分配块的命令行工具，用于虚拟机磁盘镜像瘦身前的稀疏化准备"
category: filesystem
homepage: "https://frippery.org/uml/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 工程（无 configure）；上游 Makefile 把 CC 硬编码为 gcc，且唯一规则只带 $(CFLAGS)"
    - "交叉工具链既无法覆盖编译器，也无法把 e2fsprogs 的 -I/-L 传进链接行，需补丁让 Makefile 接受 $(CPPFLAGS)/$(LDFLAGS)/$(LDLIBS)"
    - "libext2fs 直接复用已发布的 e2fsprogs 包（component ext2fs），本包不重复携带 e2fsprogs"
    - "e2fsprogs 默认静态发布，静态链接需补 -lcom_err -luuid"
    - "构建沙箱无 GNU coreutils install，package() 直接拷贝产物（上游本来也没有 install 目标）"
  common_dependencies:
    - e2fsprogs

versions:
  - version: "1.1.1"
    status: built
    build_date: "2026-09-18"
