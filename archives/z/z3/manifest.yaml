software: z3
# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段（软件级）
# ============================================================

# 软件名称
name: z3

# 软件描述
description: "高性能定理证明器（SMT solver）"

# 分类标签
category: data                           # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data

# 官网 URL
homepage: "https://github.com/Z3Prover/z3"

# 开源许可证
license: MIT

# 常用构建系统
build_system: cmake                      # autotools | cmake | meson | makefile | custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键注意事项
  notes:
    - "z3 的 Python 构建脚本（configure）不支持 HarmonyOS，必须使用 CMake"
    - "使用 -DZ3_USE_LIB_GMP=OFF 避免 GMP 依赖"
    - "避免构建 Python 绑定以减少依赖"
  
  # 推荐配置选项
  recommended_options:
    - "-DZ3_BUILD_LIBZ3_SHARED=ON"
    - "-DZ3_USE_LIB_GMP=OFF"
    - "-DZ3_BUILD_PYTHON_BINDINGS=OFF"
    - "-DZ3_BUILD_EXECUTABLE=ON"

# ============================================================
# 版本索引
# ============================================================

versions:
  "4.15.4":
    status: built
    build_date: "2026-05-20"
    notes: "首次编译，使用 CMake 构建系统"
