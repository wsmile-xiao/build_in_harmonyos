software: z3
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.15.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.15.4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-20"

# 构建系统类型
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Z3Prover/z3/releases/download/z3-4.15.4/z3_solver-4.15.4.0.tar.gz"

  # 源码校验和
  sha256: "928c29b58c4eb62106da51c1914f6a4a55d0441f8f48a81b9da07950434a8946"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DZ3_BUILD_LIBZ3_SHARED=ON"
    - "-DZ3_USE_LIB_GMP=OFF"
    - "-DZ3_BUILD_PYTHON_BINDINGS=OFF"
    - "-DZ3_BUILD_DOTNET_BINDINGS=OFF"
    - "-DZ3_BUILD_JAVA_BINDINGS=OFF"
    - "-DZ3_BUILD_EXECUTABLE=ON"
    - "-DZ3_BUILD_TEST_EXECUTABLES=OFF"
    - "-DZ3_INCLUDE_GIT_DESCRIBE=OFF"
    - "-DZ3_INCLUDE_GIT_HASH=OFF"
    - "-DCMAKE_CXX_FLAGS=-fPIC -O2"
    - "-DCMAKE_EXE_LINKER_FLAGS=-L/storage/Users/currentUser/usr/local/lib"
    - "-DCMAKE_SHARED_LINKER_FLAGS=-L/storage/Users/currentUser/usr/local/lib"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "z3 Python configure 不支持 HarmonyOS，必须使用 CMake"
  - "使用 -DZ3_USE_LIB_GMP=OFF 避免 GMP 依赖"
  - "CMakeLists.txt 位于 core/ 子目录，需指定 build_script_folder"
  - "Clang on OHOS 需设置 -stdlib=libc++ 解决链接错误"
