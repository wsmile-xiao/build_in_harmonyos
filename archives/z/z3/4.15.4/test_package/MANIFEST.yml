# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: z3/4.15.4
homepage: "https://github.com/Z3Prover/z3"

# z3 uses CMake but does not provide a `make check` / `ctest` target.
# The upstream test suite is Python-based (scripts/test_regress.py) and
# requires Python bindings which are disabled in this adaptation.

upstream_check_command: "none"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# z3's test suite requires Python; not applicable to C library testing
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Verifies z3 C API: creates context, declares int constant, asserts constraint, checks satisfiability"
    command: "./test_z3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
