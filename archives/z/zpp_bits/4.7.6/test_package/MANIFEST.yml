# test_package/MANIFEST.yml
# 上游官方测试声明文件
package: zpp_bits/4.7.6
homepage: "https://github.com/eyalz800/zpp_bits"

# 上游测试命令: 自定义 make 构建系统 (zpp.mk)，release 模式编译后运行单测二进制
upstream_check_command: "make -f zpp.mk mode=release && ./out/release/default/output"

# conanfile.py build() 中未集成上游测试（header-only，无构建步骤）；上游测试在适配阶段单独验证
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/src/test_sanity.cpp
    source: zpp_bits-4.7.6/test/src/test_sanity.cpp
    description: "zpp_bits 上游 gtest 单测 (41 suites / 218 tests, 含 sanity/vector/variant/rpc/constexpr 等)"
    command: "./out/release/default/output"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: zpp::bits 序列化/反序列化往返 (vector/string/int)"
    command: "./test_zpp_bits"

# 测试断言总数 (上游 218 tests + 消费者往返断言)
assertion_count: 219
