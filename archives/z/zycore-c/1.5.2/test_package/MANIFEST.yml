package: zycore-c/1.5.2
homepage: https://github.com/zyantific/zycore-c

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - "String (GoogleTest)"
  - "Vector (GoogleTest)"
  - "ArgParse (GoogleTest)"
upstream_test_notes: "Disabled because the release downloads GoogleTest when it is not preinstalled; the consumer test exercises the installed C library without a network fetch."

test_package_tests:
  - file: test.c
    description: "Creates a ZyanVector, pushes values, checks size and retrieval, then destroys it."
    command: "./test_zycore_c"

assertion_count: 8
