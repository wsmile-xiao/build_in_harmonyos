package: zycore-c/1.5.1
homepage: https://github.com/zyantific/zycore-c

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - "String (GoogleTest)"
  - "Vector (GoogleTest)"
  - "ArgParse (GoogleTest)"
upstream_test_notes: "Disabled because the release downloads GoogleTest when it is not preinstalled; the consumer test exercises the installed C library without a network fetch. 1.5.1 上游 String.cpp 无任何测试声明（1.5.2 起才新增），Vector 5 TEST + 8 TEST_P(×2 参数)，ArgParse 7 TEST；已用上游 pin 的 GoogleTest 在 OHOS 工具链下单独编译运行 28/28 通过。"

test_package_tests:
  - file: test.c
    description: "Creates a ZyanVector, pushes values, checks size and retrieval, then destroys it."
    command: "./test_zycore_c"
  - file: ohos_test.c
    description: "HarmonyOS 专项测试：通过公开 API 验证 Thread TLS(pthread)、ZyanString、ZyanVector 在 OHOS 平台的编译链接与运行时行为。"
    command: "./test_zycore_ohos"

assertion_count: 8