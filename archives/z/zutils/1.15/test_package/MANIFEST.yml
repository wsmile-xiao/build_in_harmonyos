# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: zutils/1.15
homepage: "https://savannah.gnu.org/projects/zutils/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testsuite/check.sh
    source: zutils-1.15/testsuite/check.sh
    description: "上游测试套件 (依赖 mkfifo, 鸿蒙平台不支持)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_zutils.sh
    description: "功能测试: 创建 gzip 文件并用 zcat 解压, 验证版本号"
    command: "bash test_zutils.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
