# manifest.yaml - zutils 1.15 编译记录
software:
  name: zutils
  version: "1.15"
  display_name: "Zutils"
  description: "Utilities dealing with compressed files - transparently handle gzip, bzip2, lzip, and xz compressed files"
  
source:
  url: "https://download-mirror.savannah.gnu.org/releases/zutils/zutils-1.15.tar.lz"
  format: "tar.lz"
  
build:
  system: autotools  # 自定义 configure 脚本（兼容 autotools 模式）
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "CXX=clang++"
  compiler: "clang++"
  parallel_jobs: 8
  
status: success
  
platform_issues:
  - "gzip 权限拒绝 - 测试无法执行 gzip"
  - "FIFO 创建限制 - 鸿蒙平台不支持 mkfifo"
  - "软链接权限问题"
  
binaries:
  - zcat
  - zcmp
  - zdiff
  - zegrep
  - zfgrep
  - zgrep
  - ztest
  - zupdate
  
dependencies:
  runtime:
    - gzip
    - bzip2
    - lzip
    - xz
  
notes: |
  zutils 提供了一系列处理压缩文件的工具，可以透明地读取 gzip、bzip2、lzip、xz 格式的压缩文件。
  工具本身编译成功，但运行时需要相应的压缩工具支持。
  测试失败是平台限制导致的，不影响实际功能。