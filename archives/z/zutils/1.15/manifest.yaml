software: zutils
version: "1.15"
status: built
build_date: "2026-08-09"
build_system: autotools

source:
  url: "https://download-mirror.savannah.gnu.org/releases/zutils/zutils-1.15.tar.lz"
  tar_format: tar.lz
  sha256: "05e6b03f333eabd78a1055139557e8ada6b634f1a58e8501f3b8f111a705cb87"

build:
  system: autotools
  configure_options:
    - "--prefix=${PACKAGE_PREFIX}"
    - "CXX=clang++"
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "zutils 使用自定义 configure 脚本, 兼容 autotools 模式"
  - "源码以 .tar.lz (lzip) 格式分发, conanfile.py 使用 Python lzma 模块自定义解压"
  - "configure 脚本第 23 行硬编码 CXX=g++, 需通过 configure 参数 CXX=clang++ 覆盖"
  - "测试套件依赖 mkfifo, 鸿蒙平台不支持 mkfifo 导致 make check 部分失败"
  - "gzip 在鸿蒙上不支持 -q 选项, 影响部分测试"
  - "构建产物为命令行工具 (zcat, zcmp, zdiff, zgrep, ztest, zupdate)"
