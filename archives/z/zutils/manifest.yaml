software: zutils
display: "Zutils"
description: "Utilities transparently handling gzip, bzip2, lzip, and xz compressed files"
category: compress
homepage: "https://savannah.gnu.org/projects/zutils/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "自定义 configure 脚本，兼容 autotools 模式"
    - "1.15 有 FIFO 创建限制（鸿蒙不支持 mkfifo）"
    - "运行依赖 gzip, bzip2, lzip, xz"
  common_dependencies:
    - gzip
    - bzip2
    - lzip
    - xz

versions:
  "1.15":
    status: built
    build_date: "2026-08-09"
  "1.16":
    status: published
    build_date: "2026-04-21"
