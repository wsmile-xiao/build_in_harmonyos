package: zmqpp/4.2.0
homepage: "https://github.com/zeromq/zmqpp"

upstream_check_command: "cmake -DZMQPP_BUILD_TESTS=ON -DZMQPP_BUILD_CLIENT=OFF -DZMQPP_BUILD_EXAMPLES=OFF .. && ctest --test-dir build --output-on-failure -j1"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build --output-on-failure -j1"

upstream_tests:
  - source: zmqpp-4.2.0/src/tests/*.cpp
    description: "Upstream Boost.Test source inventory: 118 BOOST_AUTO_TEST_CASE registrations across 15 source files; the default CMake runner registers 115 after 3 conditionally uncompiled source cases."
    command: "./zmqpp-test-runner --log_level=test_suite"
    status: "passed_with_skips"

test_package_tests:
  - file: test_zmqpp.cpp
    description: "Consumer test: verify the exported zmqpp version and an inproc PUSH/PULL round trip."
    command: "./test_zmqpp"

upstream_test_case_count: 118
upstream_test_case_count_unit: "BOOST_AUTO_TEST_CASE registrations in source"
upstream_test_count_command: 'grep -h -o -E "BOOST_AUTO_TEST_CASE[[:space:]]*\(" zmqpp-4.2.0/src/tests/*.cpp | wc -l'
upstream_default_uncompiled_case_count: 3
upstream_default_uncompiled_cases:
  - "test_load.cpp::load/push_messages_baseline"
  - "test_load.cpp::load/push_messages"
  - "test_socket.cpp::sending_large_messages_string"
upstream_runner_registered_case_count: 115
upstream_test_passed_count: 112
upstream_test_failed_count: 0
upstream_test_skipped_count: 3
upstream_test_not_run_count: 0
test_package_case_count: 1
test_package_passed_count: 1
test_package_failed_count: 0
assertion_count: 4
