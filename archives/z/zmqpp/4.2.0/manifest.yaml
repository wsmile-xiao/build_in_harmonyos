software: "zmqpp"
version: "4.2.0"
status: built
build_date: "2026-09-10"
build_system: cmake

source:
  url: "https://github.com/zeromq/zmqpp/archive/4.2.0.tar.gz"
  sha256: "c1d4587df3562f73849d9e5f8c932ca7dcfc7d8bec31f62d7f35073ef81f4d29"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DZMQPP_LIBZMQ_CMAKE=ON"
    - "-DZMQPP_BUILD_STATIC=ON"
    - "-DZMQPP_BUILD_SHARED=OFF"
    - "-DZMQPP_BUILD_EXAMPLES=OFF"
    - "-DZMQPP_BUILD_CLIENT=OFF"
    - "-DZMQPP_BUILD_TESTS=OFF"
  dependencies:
    - "zeromq/4.3.5"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-cmake.patch"
  - "0002-missing-includes.patch"
  - "0003-Allow-building-with-Werror-undef.patch"
  - "0004-fix-upstream-tests.patch"

upstream_tests:
  source_files: 15
  source_registered_cases: 118
  source_count_unit: "BOOST_AUTO_TEST_CASE registrations in the upstream source"
  source_count_command: 'grep -h -o -E "BOOST_AUTO_TEST_CASE[[:space:]]*\(" zmqpp-4.2.0/src/tests/*.cpp | wc -l'
  default_uncompiled_cases: 3
  default_uncompiled_case_names:
    - "test_load.cpp::load/push_messages_baseline"
    - "test_load.cpp::load/push_messages"
    - "test_socket.cpp::sending_large_messages_string"
  default_uncompiled_reason: "The first two cases require LOADTEST; the last is excluded by the default TRAVIS_CI_BUILD definition."
  runner_registered_cases: 115
  passed_cases: 112
  failed_cases: 0
  skipped_cases: 3
  not_run_cases: 0
  count_unit: "Boost.Test cases reported by the final runner; source registrations are recorded separately"
  command: "./zmqpp-test-runner --log_level=test_suite"
  status: passed_with_skips

test_package:
  test_count: 1
  passed: 1
  failed: 0
  classification: "HarmonyOS consumer test, reported separately from upstream cases"
  description: "CMake consumer checks the exported version and an inproc PUSH/PULL round trip."

verification:
  w0: passed
  device_native_build: passed
  device_upstream_tests: passed_with_skips
  conan_verify: passed
  conan_verify_note: "G0-G3 command passed; G4/L2/L4/L5 cache-path checks were supplemented by the recorded full-reference artifact checks."
  device_test_package: passed
  consumer_check: passed
  w3_local_ci: passed
