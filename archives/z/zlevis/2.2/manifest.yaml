# zlevis 2.2 版本级 manifest

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.2"

# 软件名
software: "zlevis"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://git.ampel.dev/ampel/zlevis/releases/download/2.2/zlevis-2.2.tar.xz"

  # 源码校验和
  sha256: "b73de6bad676b357f58c4d7373c16394c6f4f07d1df436a7cb0fa6c12f86d22e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器（纯脚本项目无需编译，无二进制产物）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 POSIX shell 脚本工具可直接在 conanfile.py 中 copy 到 bin/，无需编译步骤（同 acme.sh 先例）"