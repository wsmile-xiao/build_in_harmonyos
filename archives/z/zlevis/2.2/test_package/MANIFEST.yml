# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: zlevis/2.2
homepage: "https://git.ampel.dev/ampel/zlevis"

# 上游测试命令：meson test（src/meson.build 注册 3 个用例，均为 --summary 冒烟）
upstream_check_command: "meson test --print-errorlogs -C builddir"
upstream_test_in_build: false
upstream_test_command: "meson test --print-errorlogs -C builddir"

# 上游实际运行的测试程序（3/3 全量执行并通过）
upstream_tests:
  - name: zlevis
    source: "src/meson.build"
    case_basis: "zlevis --summary（脚本冒烟：输出工具概述）"
    command: "zlevis --summary"
  - name: zlevis-encrypt
    source: "src/meson.build"
    case_basis: "zlevis-encrypt --summary（脚本冒烟：输出加密概述）"
    command: "zlevis-encrypt --summary"
  - name: zlevis-decrypt
    source: "src/meson.build"
    case_basis: "zlevis-decrypt --summary（脚本冒烟：输出解密概述）"
    command: "zlevis-decrypt --summary"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_zlevis.sh
    description: "验证 zlevis/zlevis-encrypt/zlevis-decrypt 三个脚本安装正确且 --summary 输出与上游一致（3 断言）"
    command: "./test_zlevis.sh <bindir>"

# 测试断言总数
assertion_count: 3