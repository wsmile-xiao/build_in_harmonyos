software:
  name: zmap
  description: "ZMap is a fast stateless single packet network scanner designed for Internet-wide network surveys"
  website: https://zmap.io
  repository: https://github.com/zmap/zmap

version: 4.4.0
release_date: "2026-05-29"
status: published
build_date: "2026-06-02"

build_system: cmake
  configure_options:
    - -DCMAKE_INSTALL_PREFIX=$HOME/usr/local
    - -DENABLE_DEVELOPMENT=OFF
    - -DENABLE_LOG_TRACE=OFF
  make_options:
    - -j1

dependencies:
  build:
    - cmake
    - gmp/6.3.0
    - gengetopt/2.23
    - libpcap/1.10.6
    - flex
    - bison/3.8.2
    - json-c/0.16
    - libunistring/1.0
    - pkg-config
    - libjudy/1.0.5
  runtime:
    - libpcap
    - gmp
    - json-c
    - libunistring
    - libjudy

source:
  url: https://github.com/zmap/zmap/archive/refs/tags/v4.4.0.tar.gz
  mirror_url: https://ghfast.top/https://github.com/zmap/zmap/archive/refs/tags/v4.4.0.tar.gz

archive:
  created: "2026-06-02"
  compiler: OpenHarmony Compiler Agent
  platform_adaptations:
    - "Stub get_gateway functions (sockaddr_storage conflict)"
    - "Stub pthread_setaffinity_np (API not available)"
    - "Remove linux/netlink.h from send-linux.c"

patches_applied:
  - "0001-CMakeLists-add-user-local-paths.patch"
  - "0002-get_gateway-stub-implementation.patch"
  - "0003-send-linux-remove-netlink.patch"
  - "0004-util-stub-pthread-affinity.patch"

knowledge_gained:
  - "OpenHarmony sockaddr_storage redefinition in sys/socket.h and linux/socket.h"
  - "pthread_setaffinity_np not available on OpenHarmony"
  - "Precompiled package installation to separate directory for gmp"