# ============================================================

# 版本号
version: "8.2.1"

# 软件名
software: "zeek"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.zeek.org/zeek-8.2.1.tar.gz"

  # 源码校验和
  sha256: "a8067c75cc89bef4b58019230434a90073671a7cabfcf7ac616ac872a40a2edd"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DDISABLE_SPICY=ON"
    - "-DDISABLE_JAVASCRIPT=ON"
    - "-DENABLE_CLUSTER_BACKEND_ZEROMQ=OFF"
    - "-DINSTALL_ZEEKCTL=OFF"
    - "-DINSTALL_ZKG=OFF"
    - "-DINSTALL_ZEEK_CLIENT=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  # swig/4.4.0 于 2026-09-24 随 INSTALL_ZEEKCTL=OFF 构建形态对齐移除（pysubnettree 为其唯一消费者）
  dependencies:
    - libpcap/1.10.6
    - openssl/3.5.8.1
    - zlib/1.3.1
    - flex/2.6.4
    - bison/3.8.2
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: 76
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "R8 合规：全部平台适配走 CMake 能力宏/weak 符号 shim，无 __OHOS__ 平台宏进 patches（reference: notes.md §注意事项）"
  - "OHOS libc++ 缺 <memory_resource>：自写 shim 头暴露 std::experimental::pmr + 补全定义，-I 注入（不进 patches）（knowledge_ref: E429）"
  - "OHOS musl 不实现线程取消 API：weak no-op 对象链入所有可执行文件 + libkqueue check_function_exists 双机制（reference: notes.md）"
  - "btest 完整套件在 DISABLE_SPICY 最小构建下不可行：igmp/main.zeek 无条件 Reporter::error（IGMP Spicy 分析器缺失）+ HMDFS /tmp 只读（reference: reports/test-report.md）"
  - "fiber/libkqueue CMake OS 检测需扩 HarmonyOS 分支（原仅 Linux）（reference: notes.md）"
  - "OHOS libc++ 15.0.4 <ranges> 头存在但 std::ranges 算法成员整批缺失，hilti 编译兼容（补丁 0016-0020）（knowledge_ref: E430）"
  - "CMake 4.x 工具链模式 add_custom_command COMMAND 不展开 :: 命名空间 ALIAS 目标名（host 生成器字面执行 Error 127）（knowledge_ref: E431）"
  - "OHOS sysroot 缺 fts.h/libfts（FTS 目录遍历 API）：递归目录遍历编译失败（knowledge_ref: E432）"
  - "旧 libc++ std::construct_at 不支持聚合体初始化：聚合 struct emplace_back 报 no matching function（knowledge_ref: E433）"
  - "上游 auxil/broker 硬编码 /tmp 临时目录（make_temp_file_name）：getenv TMPDIR 可移植化、空回退 /tmp（补丁 0003），只读 /tmp 环境 broker.backend 26/26（knowledge_ref: E434）"
  - "CI worker HNP Python 无 Development 组件（Python.h/libpython）：配方必须排除 INSTALL_ZEEKCTL（pysubnettree find_package(Python Development) REQUIRED），本地带 dev 的 python 在 W3 掩盖此差异——W0b 环境语义不可迁移（reference: notes.md 对话 #5）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

