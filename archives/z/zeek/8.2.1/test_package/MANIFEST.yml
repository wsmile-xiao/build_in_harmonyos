# test_package/MANIFEST.yml
# 上游官方测试声明（R51 申报表）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在且非空

software: zeek
version: "8.2.1"

# 被测包提供的能力
binary_under_test: zeek            # test_package 实际执行的二进制
smoke_command: "zeek --version"    # 冒烟断言式（输出含 "zeek version 8.2.1"）

# 上游测试清点（R51 申报口径，详见 reports/test-report.md）
upstream_tests:
  suites: 2
  details:
    - name: ctest-unit          # 构建树 enable_testing 注册
      kind: CTest
      registered: 35            # 26 broker.* + 8 python-* + 1 其他
      ran: 26                   # 本构建可跑（broker.*）
      passed: 25
      failed: 1                 # broker.backend: HMDFS /tmp 只读（E002 平台限制）
      note: "python-* 8 项 N/A：最小构建未启用 python 绑定"
    - name: btest-integration   # 上游 testing/btest 集成套件（17 TestDirs）
      kind: btest
      registered: 287           # .test 脚本数
      note: "本环境 N/A：见 test-report.md ② 平台技术性归因（DISABLE_SPICY 构建 base 脚本 IGMP 报错 + /tmp 只读）"

# test_package 自测（4 例；生成器随包入库，pcap 测试期生成，仓内无二进制文件）
test_package:
  command: "zeek --version && (cd <tmp> && zeek -r <generated sample.pcap> test-script.zeek)  # 协议日志写 CWD；8.2.1 脚本走位置参数（-s 已改为 --rulefile）"
  cases: 4
  assertions:
    - "case 1: output contains 'zeek version 8.2.1'"
    - "case 2: conn — P1-CONN 三行（tcp:80 HTTP / tcp:443 TLS / udp:53 DNS）"
    - "case 3: ssl — P1-SNI=zeek.example.com（ClientHello SNI）"
    - "case 4: dns — P1-DNS=zeek.example.com；http — P1-HTTP=GET /hello"
  sample_pcap:
    generator: make_sample_pcap.py   # 确定性（零随机），测试期生成并校验 sha256
    packets: 17
    flows: "tcp 10.0.0.1:41337->10.0.0.2:80 (HTTP GET /hello) / tcp 10.0.0.1:41338->10.0.0.2:443 (TLS SNI) / udp 10.0.0.1:5353->10.0.0.2:53 (DNS A zeek.example.com)"
    sha256: "69e41219ba80e7b75788ed4001b1559a5d63102f8d54ca4c898d874b32092bce"
  local_run: "passed: 1（case 1；case 2-4 本地 conan-cache ELF EPERM 降级跳过）"
  degradation: "EPERM（HMDFS execve 限制）→ case 2-4 跳过，CI 全量强制；Spicy-off 形态 → igmp init fatal → case 2-4 跳过带说明（Spicy-on 全量形态 4/4）"
