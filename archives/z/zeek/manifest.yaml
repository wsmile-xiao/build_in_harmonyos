# 软件级 manifest
# 文件位置: archives/z/zeek/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: zeek

# 显示名
display: "Zeek"

# 一句话描述
description: "Zeek（原 Bro）：可扩展的网络安全监控平台，提供网络流量深度协议解析、会话分析与威胁检测能力"

# 分类标签
category: network

# 官网 URL
homepage: "https://zeek.org/"

# 开源许可证（SPDX 标识，与 conanfile.py 一致）
license: BSD-3-Clause

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "CMake 平台探测：OHOS 不在 fiber/libkqueue 的 OS 白名单 → toolchain 注入 CMAKE_SYSTEM_NAME=Linux（OHOS 为 Linux 内核 + musl，语义等价）"
    - "OHOS libc++（15.0.4）缺 <memory_resource>/std::pmr 与 C++20 ranges 算法 → shim 头 -I 注入 + 等价经典 STL 机械改写"
    - "OHOS musl 声明但未实现 pthread 线程取消符号 → weak no-op shim 链入可执行文件 + check_function_exists 能力检测（知识图谱 E085）"
    - "host 生成器交叉编译（bifcl/binpac/gen-zam）：CMake 4.1.2 下 ALIAS 目标名不再展开为可执行路径 → $<TARGET_FILE:...> 生成器表达式"
    - "源码 tarball 含目录别名符号链接环（auxil/spicy）→ cp -a 保留符号链接复制（HMDFS 拒绝硬链接）"
    - "最小可行 core 构建形态：-DDISABLE_SPICY=ON -DDISABLE_JAVASCRIPT=ON（Spicy 应用层分析器路径不在本版本范围）"

  # 跨版本通用依赖
  common_dependencies:
    - libpcap
    - openssl
    - zlib
    - flex
    - bison

# ============================================================
# 版本索引
# ============================================================

versions:
  "8.2.1":
    status: published
    build_date: "2026-09-21"
    conan_ref: "zeek/8.2.1"
    note: "最小可行 core 构建（DISABLE_SPICY/DISABLE_JAVASCRIPT）；76 个平台兼容补丁 + 2 个 shims；单元测试 26/26（100%，broker.backend 经 TMPDIR 可移植补丁解决）"
