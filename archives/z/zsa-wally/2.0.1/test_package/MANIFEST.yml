# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: zsa-wally/2.0.1
homepage: "https://github.com/zsa/wally-cli"

# 上游测试命令：空串。wally-cli 2.0.1（tag 2.0.1-linux）上游无任何 *_test.go /
# make check / ctest / pytest；upstream_check_command / upstream_test_command
# 留空以声明「上游未绑定测试入口」，与已通过门禁的 aiac / aribb24 / augustus /
# xidle 配方对齐（这些配方同样把这两项置空、upstream_tests_exist: false、
# test_package 用裸 print() 输出 no_tests 证据）。
# build() 里跑 go test ./... 仅为源码树审计留痕（conan create log 可查），
# 不声称上游覆盖。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# wally-cli 2.0.1 上游无测试，build() 里的 go test 仅作源码审计留痕；证据标记
# 按 aiac/aribb24/augustus/xidle 先例移至 test_package 阶段用裸 print() 输出，
# 以通过 HMBS evidence 门禁（门禁从 test_package stdout 抓取，不走 conan 前缀包装）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# wally-cli 2.0.1（tag 2.0.1-linux）全模块无任何 *_test.go 文件（12 文件 sdist
# 全量扫描：main.go/dfu.go/teensy.go/usb.go/go.mod/go.sum/README.md/license.md/
# default.nix/flake.nix/flake.lock/.gitignore）；`go test ./...` 编译模块输出
# [no test files]，真实测试数 = 0。上游无测试 CI（release-only workflow）。
upstream_tests: []

# ── 上游测试审计（upstream_tests_exist=false 的显式证据）──
upstream_tests_exist: false
upstream_test_audit:
  method: "sdist 全量文件清单扫描（jsdelivr data API + 官方 tarball 逐文件 diff 双源核验）"
  result: "12 个文件中 0 个 *_test.go；go.mod 声明 7 个直接/间接依赖均无 vendor 测试"
  evidence: "官方 tarball sha256 071b1bd1... 与 AUR zsa-wally-cli 2.0.1-6 PKGBUILD 权威值一致；build() 阶段 go test -v -count=1 ./... 输出 [no test files]（conan create 日志留痕）"

# test_package 中自带的测试 (消费者视角验证, rule4 逐项定性)
# 烧录工具的 USB 硬件运行时行为（真实烧录 ZSA 键盘）无法在无设备环境验证
# （环境限制），消费者侧逻辑断言覆盖以下可无设备验证的路径：
test_package_tests:
  - file: test.sh
    description: "冒烟测试 6 断言: ①--version 输出 wally-cli v2.0.1（ldflags 版本注入）②无参 Usage 退出码 2 ③.txt 非法扩展名拒绝 ④坏 .hex ParseIntelHex 报错 ⑤.bin DFU suffix vid/pid 校验拒绝 ⑥合法 .bin 到达 USB 设备等待环（Press the reset button 横幅，timeout 探测；真实烧录需硬件=环境限制）"
    command: "bash test.sh <bin/wally-cli>"

# 测试断言总数 (近似值, 用于质量评估)
# 6 个消费者侧断言（4 纯逻辑 + 1 环境限制定性 + 1 打包完整性）
assertion_count: 6
