# 版本级 manifest — zsa-wally 2.0.1
# 遵循 ARCHIVE-SPEC v2.0

version: "2.0.1"

software: "zsa-wally"

# 编译状态: built (conan create 通过)
status: built

build_date: "2026-10-07"

# 构建系统 (必填顶层字段)
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/zsa/wally-cli/archive/refs/tags/2.0.1-linux.tar.gz"
  sha256: "071b1bd10e9160c441e833be3bea211ccf835c4f1792b0c6c7fc86f7aa0695d1"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # Go 项目，custom 构建（CGO_ENABLED=1 go build .，gousb → libusb-1.0）
  system: custom

  configure_options: []

  dependencies:
    - "libusb/1.0.27 (ohpcd 制品仓，gousb CGO 编译期头文件 + 运行期共享库)"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "任务卡 zsa-wally 2.0.1 的形态实测定谳：ZSA 生态 tag 2.0.1 唯一对应 wally-cli（Go CLI）；GUI 仓 zsa/wally 是 Go+Wails（webkit2gtk+npm）且无 2.0.1 tag，webkit2gtk/wails 不在 ohpcd 制品仓，GUI 路线不可行"
  - "gousb CGO 用 `#cgo pkg-config: libusb-1.0` 解析编译/链接标志；libusb/1.0.27 制品仓包的 lib/pkgconfig/libusb-1.0.pc 带 prefix=/usr/local（autotools 默认前缀，对 Conan 包是错的），须改写 prefix 为制品包真实路径再注入 PKG_CONFIG_PATH"
  - "CGO 交叉编译 OHOS：CC 用 profile 的 tools.build:compiler_executables（clang --target=aarch64-unknown-linux-ohos），CGO_CFLAGS/CGO_LDFLAGS 显式注入 libusb 头/库路径作为 pkg-config 双保险"
  - "Go linker 在 HMDFS 上 mmap 输出失败（E051），链接输出目录放 el2 工作区（addchain 先例）"
  - "Go 工具链 ELF 无 .codesign 段被 Seccomp 拦截（permission denied），需 binary-sign-tool 签名后再执行（addchain/aiac 先例）"
  - "上游 tag 2.0.1-linux 的 main.go appVersion 仍为 2.0.0（上游笔误），用 ldflags -X main.appVersion=2.0.1 注入真实版本号"
