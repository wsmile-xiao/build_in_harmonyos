# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: zrc/2.7
homepage: "https://github.com/Edd12321/zrc"

# 上游无测试目录与测试目标（Makefile 仅 release/debug/clean 目标，
# 无 check/test）——如实申报；验证由 test_package 消费者测试承担。
upstream_check_command: "上游无测试目标"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_zrc.sh
    description: >-
      CLI 消费者测试（8 项断言）：--version 以 ≤1 容差退出（上游脚本
      路径恒 return stonum($status) 即退出 1，1）且 stderr 输出横幅
      zrc v2.7（2）；-c 单行脚本 echo 内建输出正确（3，上游退出码由
      $status 变量决定而 echo 不更新它，故只断言输出）；-c 命令替换
      + expr 算术求值输出 42（4）；真实脚本文件执行以 `exit 0` 收尾
      退出码为 0（5，脚本改编自上游 examples/99bottles.zrc，覆盖 set
      变量赋值、$bot 展开、[inc] 算术、do/while 控制流），输出含首节
      3 bottles...（6）、递减到末节 1 bottles...（7）与结束行 done
      （8）。任一断言失败即非零退出。
