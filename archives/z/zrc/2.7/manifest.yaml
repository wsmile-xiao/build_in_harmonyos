software: zrc
version: "2.7"
status: built
build_system: makefile
build_date: "2026-09-23"
issue: ""

source:
  url: "https://github.com/Edd12321/zrc/archive/refs/tags/v2.7.tar.gz"
  sha256: "fe304ffb2b262e214c72ac948abb7550d1094da4c1e87ef5da995b26a92112d0"
  tar_format: tar.gz

build:
  system: makefile
  options:
    - "release"
    - "CXX=<clang++ from tools.build:compiler_executables>"
    - "CXXFLAGS=-std=c++11 -pedantic -Wno-unused-result -fsigned-char"

dependencies:
  runtime: []
  build_tools:
    - "make (OHOS worker 环境)"
    - "clang++ 15 (OHOS worker 系统 clang)"

disabled_optional:
  - flto（上游 CXXFLAGS 携带 -flto，OHOS 系统链接器下风险，已从覆盖的 CXXFLAGS 去除）
  - make install（会向 /etc/shells 追加行，改由 package() 直接拷贝 bin/zrc）
  - debug 目标（-fsanitize=address,undefined 仅上游调试用途）
