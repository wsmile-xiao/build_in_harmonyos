patches:
  - patch_file: "patches/0001-zpl-h-aarch64-portability.patch"
    patch_description: >
      Fix three upstream portability bugs on aarch64/OHOS: (1) zpl.h always
      included <emmintrin.h>/<xmmintrin.h> (x86-only) on non-Android/iOS/emscripten,
      which fails on aarch64 — now guarded by ZPL_CPU_X86; (2) <stdio.h> was only
      included inside the ZPL_THREADING affinity section (disabled on ARM), leaving
      FILE undeclared for the file/temp API — now included unconditionally;
      (3) heap allocator used posix_memalign on ARM Linux while x86 used
      aligned_alloc; posix_memalign rejects small alignments (e.g. 4 from
      zpl_base64_decode) with EINVAL, so the ARM path now uses aligned_alloc
      like the x86 Linux path.
    patch_type: "portability"
