sources:
  url: "https://gitlab.com/drobilla/zix/-/archive/a4fab09/zix-a4fab09.tar.gz"
  sha256: "858b93002977e9b4d5dd95cccb4732f6c2a8afbd94f38374fcb311e751d8296d"

patches:
  "0.8.1":
    - patch_file: "patches/0001-test-filesystem-allow-bad-perms-hardlinks.patch"
      patch_description: >-
        Allow the upstream filesystem hard-link test to accept BAD_PERMS on
        OHOS/HMDFS-style filesystems where hard-link creation is denied by
        platform policy.
      patch_type: "portability"
    - patch_file: "patches/0002-test-filesystem-skip-restricted-symlink.patch"
      patch_description: >-
        Skip the symlink canonical-path subtest when OHOS/HMDFS rejects symlink
        creation with NOT_SUPPORTED or BAD_PERMS, while keeping the rest of the
        filesystem test enabled.
      patch_type: "portability"
