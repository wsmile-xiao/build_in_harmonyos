package: zix/0.8.1
homepage: "https://drobilla.net/software/zix"

upstream_check_command: "meson test --list"
upstream_test_in_build: true
upstream_test_command: "meson test -C <build_folder> --print-errorlogs"

upstream_tests:
  - file: test/meson.build
    source: zix-a4fab09/test/meson.build
    description: "Registers up to 24 Meson tests covering allocator, btree, digest, environment, filesystem, hash, path, ring, sem, status, string_view, thread, tree, public headers, C++ header/path checks, and expected-failure argument cases."
    command: "meson test"
  - file: test/test_filesystem.c
    source: zix-a4fab09/test/test_filesystem.c
    description: "Filesystem API coverage. The OHOS patch only relaxes hard-link creation to accept BAD_PERMS on restricted filesystems."
    command: "meson test filesystem"
  - file: test/test_digest.c
    source: zix-a4fab09/test/test_digest.c
    description: "Digest API and collision-behavior checks."
    command: "meson test digest"

test_package_tests:
  - file: test.c
    description: "Build and run a C consumer that exercises digest, status, string view, path, and allocator APIs."
    command: "ctest --output-on-failure"

assertion_count: 12

harmonyos_validation:
  status: pending
  command: 'CI_PACKAGES="archives/z/zix/0.8.1" zsh ci/conan/build_and_test.sh'
