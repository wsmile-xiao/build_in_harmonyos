software: zix
version: "0.8.1"
status: prepared
build_date: "2026-08-25"
build_system: meson
homepage: "https://drobilla.net/software/zix"
license: ISC

source:
  url: "https://gitlab.com/drobilla/zix/-/archive/a4fab09/zix-a4fab09.tar.gz"
  sha256: "858b93002977e9b4d5dd95cccb4732f6c2a8afbd94f38374fcb311e751d8296d"
  git_commit: "a4fab09"
  tar_format: gitlab-archive
  note: "No v0.8.1 GitLab tag or download.drobilla.net release tarball was available; the pinned archive has Meson project version 0.8.1."

build:
  system: meson
  configure_options:
    - "-Ddefault_library=shared"
    - "-Dchecks=enabled"
    - "-Dthreads=enabled"
    - "-Dtests=enabled"
    - "-Dtests_cpp=auto"
    - "-Dbenchmarks=disabled"
    - "-Ddocs=disabled"
    - "-Dhtml=disabled"
    - "-Dsinglehtml=disabled"
    - "-Dlint=false"
  dependencies: []
  system_dependencies:
    - threads
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-test-filesystem-allow-bad-perms-hardlinks.patch"
  - "0002-test-filesystem-skip-restricted-symlink.patch"

upstream_tests:
  status: pending
  framework: "Meson test"
  expected_cases: 24
  command: "meson test -C <build_folder> --print-errorlogs"
  note: "The upstream Meson suite covers allocator, btree, digest, environment, filesystem, hash, path, ring, sem, status, string_view, thread, tree, public headers, C++ headers/path checks, and expected-failure argument cases. The patches only relax link-creation expectations for restricted OHOS/HMDFS-style filesystems: hard links may report BAD_PERMS and the symlink canonical-path subtest is skipped when symlink creation returns NOT_SUPPORTED or BAD_PERMS."

adapted_tests:
  status: prepared
  cases: 1
  command: "ctest --output-on-failure"
  note: "Consumer test links zix::zix and exercises digest, status, string view, path, and allocator APIs."

local_preflight:
  - "python scripts/ohc-run.py resolve-deps zix 0.8.1 --dry-run: dependency check reported zix prerequisites already available/no split dependency needed."
  - "download.drobilla.net/zix-0.8.1.tar.xz returned 404, while zix-0.8.2.tar.xz exists; version 0.8.1 therefore uses the GitLab commit archive."
  - "Downloaded GitLab archive sha256 matched conandata.yml."
  - "Local Windows host lacks conan/clang/cmake/meson in PATH, so native conan create was not run in this preflight."

knowledge_drafts:
  - "knowledge/drafts/DRAFT-zix-meson-build-tree-soname-alias.kv"
  - "knowledge/drafts/DRAFT-zix-meson-build-tree-soname-alias.md"
  - "knowledge/drafts/DRAFT-zix-hmdfs-filesystem-link-subtests.kv"
  - "knowledge/drafts/DRAFT-zix-hmdfs-filesystem-link-subtests.md"

next_validation:
  single_package_ci: 'CI_PACKAGES="archives/z/zix/0.8.1" zsh ci/conan/build_and_test.sh'
  shadow_ci: "/path/to/run-ohos-shadow-ci.sh archives/z/zix/0.8.1"
  conan_create: "conan create archives/z/zix/0.8.1 --user=ohpcd --channel=stable -pr:h=$HOME/.conan2/profiles/ohos -pr:b=$HOME/.conan2/profiles/ohos --build=missing"
