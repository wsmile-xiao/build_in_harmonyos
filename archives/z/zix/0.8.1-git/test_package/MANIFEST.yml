# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: zix/0.8.1-git
homepage: "https://drobilla.net/software/zix"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_allocator.c
    source: zix-a4fab09/test/test_allocator.c
    description: "Allocator API tests"
    command: "./test_allocator"
  - file: test/test_btree.c
    source: zix-a4fab09/test/test_btree.c
    description: "B-tree data structure tests"
    command: "./test_btree"
  - file: test/test_digest.c
    source: zix-a4fab09/test/test_digest.c
    description: "Hash digest function tests"
    command: "./test_digest"
  - file: test/test_filesystem.c
    source: zix-a4fab09/test/test_filesystem.c
    description: "Filesystem operations tests (hardlink test fails on OHOS)"
    command: "./test_filesystem"
  - file: test/test_ring.c
    source: zix-a4fab09/test/test_ring.c
    description: "Ring buffer tests"
    command: "./test_ring"
  - file: test/test_sem.c
    source: zix-a4fab09/test/test_sem.c
    description: "Semaphore tests"
    command: "./test_sem"
  - file: test/test_thread.c
    source: zix-a4fab09/test/test_thread.c
    description: "Thread tests"
    command: "./test_thread"
  - file: test/test_tree.c
    source: zix-a4fab09/test/test_tree.c
    description: "Tree data structure tests"
    command: "./test_tree"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: zix_digest32/digest64 API 验证"
    command: "./test_zix"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
