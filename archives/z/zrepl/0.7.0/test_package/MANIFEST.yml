# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: zrepl/0.7.0
homepage: "https://github.com/zrepl/zrepl"

# 上游测试命令 (Go 项目: make test-go == go test ./...)
upstream_check_command: "make test-go (CGO_ENABLED=0 go test ./...)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "go test -mod=readonly ./... (executed by recipe build() before go build; OHOS uses a go test -exec wrapper that self-signs each generated test binary; upstream ships no vendor/ tree, modules fetched from GOPROXY mirror goproxy.cn with Go checksum database verification; one minimal portability patch on a test FIXTURE only — internal/daemon/hooks/test/test-large-stdout.sh, see patches/ — replaces an unbounded `while printf | head -c N` producer with a finite dd: the unbounded form terminates on POSIX shells only because the writer process itself dies of SIGPIPE (printf is a builtin in mainstream /bin/sh), while OHOS toybox /bin/sh has no printf builtin so every iteration forks an external writer whose death never ends the loop — the pipeline never reaches EOF and the hook's cmd.Wait hangs; bounded control probes confirm SIGPIPE/EPIPE delivery itself is normal for simple pipelines on this device, so the deciding variable is builtin-vs-forked writer, not a kernel EPIPE defect)"

# 上游实际运行的测试程序 (Go 单元测试)
upstream_tests:
  - "go test -mod=readonly ./... — 61 *_test.go files across 38 packages; 131 top-level test functions declared (1 of them is a regular test named TestMain in internal/platformtest/harness, not a testing.M harness). Unit tests are pure Go (no /dev/zfs, no zfs/zpool binary: destroy-batch tests use a mockBatchDestroy; zfscmd tests exec bundled shell fixtures via /bin/sh and #!/usr/bin/env bash). Upstream platformtest target requires a real ZFS kernel module (/dev/zfs) and cannot run on HarmonyOS (HongMeng kernel 1.12.0 has no zfs kmod) — recorded as NOT_RUN (not applicable on this platform), see notes.md"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试: version --show=client 断言 zrepl version=0.7.0 与 GOARCH=arm64（internal/version.zreplVersion 变量 -ldflags -X 注入）+ --help 子命令输出 + configcheck 空配置正向解析 + 未知子命令破坏性反向验证（cobra 必须拒绝，exit != 0）"
    command: "bash test.sh <bin/zrepl>"

# 测试断言总数 (近似值, 用于质量评估)
test_package_assertion_count: 5
assertion_count: 131
