# conandata.yml — zrepl 0.7.0
# Source: official GitHub archive for release tag v0.7.0（codeload
# .../tar.gz/refs/tags/v0.7.0 与 .../archive/refs/tags/v0.7.0.tar.gz 字节一致，
# 本机与 OHOS 设备双端实测 SHA256 相同：434419 字节）。
# R39: URL points to the official upstream distribution. CI 会自动为 GitHub URL
# 添加镜像 fallback，因此这里只写官方原始 URL，不要手动加镜像前缀。
# 注意：URL 必须以 .tar.gz 结尾——conan get() 按扩展名选择解压器，
# codeload 形态的 URL 尾段为 v0.7.0 会被误判为 zip（BadZipFile）。

sources:
  url: "https://github.com/zrepl/zrepl/archive/refs/tags/v0.7.0.tar.gz"
  sha256: "d451ad1d05a0afdc752daf1dada9327aa338f691eca91e1c8fc9828eebd89757"

patches:
  - patch_file: "patches/0001-hooks-test-finite-stdout-producer.patch"
    patch_description: "Hooks 测试 fixture：有限 stdout 生产者。原无限 while printf|head 依赖写端进程自身死于 SIGPIPE 终止（主流 /bin/sh 的 printf 为内建）；OHOS toybox sh 无 printf 内建，每轮 fork 外部写端、单个写端的 SIGPIPE 死亡不终结 while 循环，管线永无 EOF，hook cmd.Wait 挂死（CI run2 实测 TestHooks/exceed_buffer_limit 600s panic）。有界控制探针证实简单管线 EPIPE/SIGPIPE 投递正常：决定变量是写端在循环进程内（内建）还是 fork 外部 applet；两挂死形态切换条件未定性（open point）。改为 dd 输出同样 2<<20 字节，Go 断言仅校验截断后长度 1<<20，语义不变。"
    patch_type: "portability"

build:
  main: "."
  binary: "zrepl"
  # 上游 Makefile: GO_ENV_VARS=CGO_ENABLED=0, GO_MOD_READONLY=-mod=readonly,
  # GO_LDFLAGS="-X github.com/zrepl/zrepl/internal/version.zreplVersion=$(_ZREPL_VERSION)"。
  # zreplVersion 是包级 string 变量（非 const），-X 注入有效；
  # 与上游 release 一致附 -s -w。
  ldflags: "-s -w -X github.com/zrepl/zrepl/internal/version.zreplVersion=0.7.0"

# go.mod: go 1.24.13 / toolchain go1.25.7 → GOTOOLCHAIN=local 需要 >= 1.24.13 的工具链。
# go1.26.3 linux-arm64 SHA256 已在 OHOS 设备实测复核（sha256sum == 下列值，
# 与 ld-find-code-refs/unpackerr 配方使用同一工具链版本）。
go_toolchain:
  version: "1.26.3"
  linux-amd64:
    url: "https://mirrors.aliyun.com/golang/go1.26.3.linux-amd64.tar.gz"
    sha256: "2b2cfc7148493da5e73981bffbf3353af381d5f93e789c82c79aff64962eb556"
    filename: "go1.26.3.linux-amd64.tar.gz"
  linux-arm64:
    url: "https://mirrors.aliyun.com/golang/go1.26.3.linux-arm64.tar.gz"
    sha256: "9d89a3ea57d141c2b22d70083f2c8459ba3890f2d9e818e7e933b75614936565"
    filename: "go1.26.3.linux-arm64.tar.gz"
