# 版本级 manifest — zrepl 0.7.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.7.0"

software: "zrepl"

# 编译状态: built（权威 CI run3 全门禁通过：G0/KC/JC/L0/L1/L1e/L2/L4/L5）
status: built

build_date: "2026-09-30"

# 构建系统 (必填顶层字段)
build_system: go

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/zrepl/zrepl/archive/refs/tags/v0.7.0.tar.gz"
  sha256: "d451ad1d05a0afdc752daf1dada9327aa338f691eca91e1c8fc9828eebd89757"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # Go 项目，custom 构建（go build .，入口为仓库根 main.go，输出 zrepl 二进制）
  system: go

  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux (OHOS)"
    - "GOARCH=arm64 (armv8)"
    - "-mod=readonly（上游 Makefile GO_MOD_READONLY；上游无 vendor/，模块图经 GOPROXY=goproxy.cn 镜像拉取，sumdb 校验开启）"
    - "go mod download → go test -mod=readonly ./... → go build -trimpath -ldflags '-s -w -X github.com/zrepl/zrepl/internal/version.zreplVersion=0.7.0' -buildvcs=false -o zrepl ."
    - "Go 工具链 go1.26.3 (linux-amd64/linux-arm64) 自 mirrors.aliyun.com 下载，SHA256 已设备实测复核，置于模块树外；GOTOOLCHAIN=local（>= go.mod 要求的 1.24.13，无需降级）"
    - "Go 缓存/临时目录/链接输出置于非 hmfs 工作区 /data/storage/el2/base/cache (E051/E134/E166)"
    - "产物与工具链 ELF 经 binary-sign-tool 自签 (E077)；go test 二进制经 -exec wrapper 逐个自签后执行"

  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: "patches/0001-hooks-test-finite-stdout-producer.patch"
    target: "internal/daemon/hooks/test/test-large-stdout.sh（上游测试 fixture，非产品代码）"
    reason: "原无限 while-printf|head 生产者依赖写端进程自身死于 SIGPIPE 终止（主流 /bin/sh 的 printf 为内建）；OHOS toybox sh 无 printf 内建，每轮 fork 外部写端、单个写端的 SIGPIPE 死亡不终结 while 循环，管线永无 EOF，hook 命令永不见 EOF，TestHooks/exceed_buffer_limit 10 分钟 go-test 超时 panic（CI run2 实测 FAIL 600.612s）。Curator/Auditor 有界控制探针证实同设备简单管线 EPIPE/SIGPIPE 投递正常（bash 内建写端与外部 seq 写端均同秒终结），决定变量是写端在循环进程内（内建）还是 fork 外部 applet；fork 再生 spin 与写端 D 态阻塞 write（TERM 免疫）两形态切换条件未定性（open point）。改为 dd 有限输出同样 2<<20 字节；Go 侧 circlog（1MiB 环形缓冲）持续 drain 到 EOF，断言仅校验截断后长度，测试语义在 POSIX/OHOS 均保持。"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "zrepl 0.7.0 是纯 Go CLI+daemon（MIT），无 C/C++ 目标库，属于路径 A 应用类适配；入口为仓库根 main.go（0.7.0 起 无 cmd/ 目录）"
  - "上游无 vendor/：与 ld-find-code-refs 先例的关键差异——GOPROXY 不能 off，走 goproxy.cn 镜像拉模块图，sumdb 校验经 GOPROXY 代理保持开启，供应链校验不降级"
  - "internal/version.zreplVersion 是包级 string 变量（非 const）：-ldflags -X 注入有效，与上游 Makefile GO_LDFLAGS 一致"
  - "zrepl version 不带 --show=client 会连 daemon control socket 并因无配置 exit 1：无 daemon 冒烟必须用 version --show=client"
  - "Go 测试二进制在 OHOS 上需 binary-sign-tool 自签后才能执行（go test -exec wrapper）(ref: E166)"
  - "Go linker mmap 在 hmdfs 上受限（E051/E134），链接输出与缓存目录放 /data/storage/el2/base/cache 非 hmfs 工作区 (ref: E051, E134, E166)；GOTOOLCHAIN=local + 本地 1.26.3 满足 go.mod 1.24.13，无需降级 go.mod（规避 gobuster 反例）"
  - "上游单元测试全为纯 Go：destroy 测试用 mockBatchDestroy，不触 zfs 二进制；zfscmd 测试只执行自带 shell fixture（/bin/sh、#!/usr/bin/env bash，设备均具备）"
  - "管线 fixture 终止机理（Curator/Auditor 控制探针定案）：`无界生产者 | head` 依赖写端进程自身死于 SIGPIPE；主流 /bin/sh 的 printf 为内建故循环进程即写端；OHOS toybox sh 无 printf 内建（type printf 报外部 applet 别名），每轮 fork 外部写端、单个写端的 SIGPIPE 死亡不终结循环 → 永无 EOF → cmd.Wait 挂死。同设备简单管线（bash 内建写端、外部 seq 写端）EPIPE/SIGPIPE 投递正常；决定变量=写端在循环进程内还是 fork 外部 applet；fork 再生 spin 与写端 D 态阻塞 write（TERM 免疫）两形态切换条件未定性（open point）。唯一上游 patch 即为修此（test fixture dd 化，非产品代码）；勿按 type 输出做 printf→echo 互换假修复（/bin/echo 循环同样挂死，裸 echo 系 toybox sh 内建执行才同秒终结）"
  - "platformtest 需真 ZFS 内核模块（/dev/zfs）：HongMeng kernel 1.12.0 无 zfs kmod，平台不适用，NOT_RUN（运行时环境限制，非适配缺陷）"

