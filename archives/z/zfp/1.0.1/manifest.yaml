version: "1.0.1"
software: "zfp"
status: built
build_date: "2026-09-10"
build_system: cmake

source:
  url: "https://codeload.github.com/LLNL/zfp/tar.gz/refs/tags/1.0.1"
  sha256: "4984db6a55bc919831966dd17ba5e47ca7ac58668f4fd278ebd98cd2200da66f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DZFP_ENABLE_PIC=ON"
    - "-DZFP_WITH_OPENMP=OFF"
    - "-DBUILD_CFP=OFF"
    - "-DBUILD_ZFORP=OFF"
    - "-DBUILD_ZFPY=OFF"
    - "-DBUILD_UTILITIES=OFF"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_TESTING_FULL=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-testbitstream-inline-include-order.patch: make the full-suite bitstream test use zfp static-inline declarations on OHOS/Clang"

knowledge_gained:
  - "zfp 1.0.1 的 CMake 安装并导出 zfp::zfp；基础 BUILD_TESTING 只包含 testzfp 和 testviews，不触发网络下载的完整测试依赖。"
  - "设备以 BUILD_TESTING_FULL=ON 运行完整 CTest：186/186 通过。testBitstream 必须先引入 inline.h，避免 OHOS/Clang 将其内联实现与 libzfp.a 重复链接。"
  - "包配方关闭 OpenMP、CFP、Fortran、Python、utilities 和 examples，仅交付核心 C 库；设备验证前状态保持 draft。"
