package: zfp/1.0.1
homepage: "https://github.com/LLNL/zfp"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure -j1"

upstream_tests:
  - file: tests/
    source: zfp-1.0.1/tests/
    description: "完整 BUILD_TESTING_FULL 套件；HarmonyOS 设备 CTest 实际执行 186/186，0 失败"
    command: "ctest --test-dir build --output-on-failure -j1"
  - file: tests/testzfp.cpp
    source: zfp-1.0.1/tests/testzfp.cpp
    description: "上游 zfp C++ API 与压缩数组回归测试"
    command: "./tests/testzfp"
  - file: tests/testviews.cpp
    source: zfp-1.0.1/tests/testviews.cpp
    description: "上游压缩数组 view 读写回归测试"
    command: "./tests/testviews"

test_package_tests:
  - file: test.c
    description: "消费者通过 zfp::zfp 公开目标完成双精度三维数组可逆压缩、解压和逐字节 round-trip 校验"
    command: "./test_zfp"

assertion_count: 4
