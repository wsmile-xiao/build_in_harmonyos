software: zig
display: "Zig"
description: "Zig programming language compiler and build tool"
category: development
homepage: "https://ziglang.org/"
license: MIT
build_system: prebuilt

ohos_adaptation:
  key_points:
    - "Packaged as a Conan application/tool package for downstream tool_requires use."
    - "OHOS armv8 uses the official aarch64-linux Zig distribution; the real bin/zig-real ELF is self-signed during package() for HarmonyOS execution."
    - "OHOS bin/zig wrapper auto-signs Zig-generated build/test executables under .zig-cache/zig-out and retries AccessDenied failures."
    - "OHOS package patches Zig std Io copy fallback so copy_file_range OVERFLOW falls back to normal reads during zig build install."
    - "Package ID keeps only runtime os/arch, so compiler and build_type variants reuse the same Zig tool binary."
  common_dependencies: []

versions:
  "0.16.0":
    status: built
    build_date: "2026-07-28"
    format: conan
    note: "Required by minizign 0.1.13 build.zig.zon minimum_zig_version."
