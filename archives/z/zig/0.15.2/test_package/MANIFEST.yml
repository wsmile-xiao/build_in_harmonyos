package: zig/0.15.2
homepage: https://ziglang.org/
upstream_check_command: zig build test
upstream_test_in_build: false
upstream_test_note: Official binary distribution; upstream test/standalone is not bundled.
test_package:
  entrypoint: conanfile.py
  sources:
    - build.zig
    - smoke.zig
    - test.sh
  assertions:
    - exact compiler version is 0.15.2
    - build.zig compiles the smoke executable
    - build.zig runs the smoke executable
    - build.zig installs the smoke executable
    - installed executable exists and runs successfully
assertion_count: 5
