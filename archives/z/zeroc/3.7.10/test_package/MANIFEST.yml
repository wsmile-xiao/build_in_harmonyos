package: zeroc/3.7.10
homepage: "https://github.com/zeroc-ice/ice"

upstream_check_command: "cd cpp && make os=Linux lib-suffix= MCPP_HOME=$P BZ2_HOME=$P EXPAT_HOME=$P LMDB_HOME=$P CONFIGS=shared -j8 srcs && make tests"
upstream_test_in_build: true
upstream_test_command: "cd cpp && python3 allTests.py"

upstream_tests:
  - file: cpp/test/**/*.py
    source: ice-3.7.10/cpp/test/
    description: "Upstream C++ test suite (93 authoritative suites) executed on OHOS: 88 pass, 4 platform/data limits (Slice/headers symlink, Ice/logger chmod, IceSSL/configuration + Glacier2/ssl expired test certs), 1 upstream-skipped (Ice/echo)."
    command: "python3 allTests.py --filter=<suite>"
    result: "88/93 pass on OHOS aarch64; details in reports/r51-test-matrix.md and reports/r51-evidence.md"

test_package_tests:
  - file: test_client.cpp
    description: "Consumer test: link against packaged libIce, initialize a communicator, verify the library loads and reports the expected version."
    command: "./test_client"
    result: "Ice version: 3.7.10"

assertion_count: 93
