build:
  system: makefile
  configure_options:
    - "os=Linux"
    - "lib-suffix="
    - "CONFIGS=shared"
    - "MCPP_HOME/BZ2_HOME/EXPAT_HOME/LMDB_HOME=<合并前缀>"
    - "CPPFLAGS=-I<prefix>/include -Wno-deprecated-declarations -Wno-deprecated-copy-with-user-provided-dtor"
    - "LDFLAGS=-L<prefix>/lib"
    - "icegridadmin_system_libs=-ledit -lncursesw"
    - "icestormadmin_system_libs=-ledit -lncursesw"
  dependencies:
    - bzip2/1.0.8
    - expat/2.8.2
    - openssl/3.5.6
    - lmdb/0.9.35
    - libedit/20240817
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-Make.project.rules.patch"
  - "0002-cpp-src-Glacier2CryptPermissionsVerifier-CryptPermissionsVerifierI.cpp.patch"
  - "0003-cpp-src-Ice-Network.h.patch"
  - "0004-cpp-src-Ice-Selector.h.patch"
  - "0005-cpp-src-IceGrid-Activator.cpp.patch"
  - "0006-scripts-Util.py.patch"

knowledge_gained:
  - "Ice 用自研 Makefile 系统，编译器来自 make 内建变量 CC/CXX，conan 的 tools.build:compiler_executables 不会进 buildenv，必须在命令行显式传 CC=/CXX="
  - "mcpp 预处理库由 slice2cpp 静态链接，需先于 Ice 构建；制品仓原版 mcpp/2.7.2 有循环 include 缺陷，必须用 ZeroC 官方 fork v2.7.2.20"
  - "HMDFS 上 SONAME 别名（libIce.so.37/libIce.so）必须为真实文件，Make.project.rules 的 mksoname/mkshlibname 及 install 路径的 ln -s 全部替换为 cp"
  - "OHOS SDK 无 <crypt.h>（musl 有 crypt() 无头文件），Glacier2 密码校验需手写 extern \"C\" 声明并以互斥锁保护非重入调用"
  - "OHOS 应用沙箱 uid（2xxxxxxxx）无 /etc/passwd 记录，icegridnode Activator 必须对自身 uid 跳过 getpwuid_r 解析"
  - "binary-sign-tool selfSign 在部分设备报 'not trust command'，配方签名必须探测式：签名失败保留链接器自带 .codesign，禁止剥离后留空"
  - "musl dlopen 加载无 .codesign 段的 so 报 'Error loading shared library'（errno 信息为空），SDK clang 链接产物自带合法签名段"

