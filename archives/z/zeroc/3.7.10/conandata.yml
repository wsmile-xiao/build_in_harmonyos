patches:
  - patch_file: "patches/0001-config-Make.project.rules.patch"
    patch_description: "Replace ln -s with cp in shared library name rules: HMDFS does not support loading libraries through symlinks (Permission denied), so SONAME/linker-name aliases are materialized as real file copies"
    patch_type: "platform"
  - patch_file: "patches/0002-cpp-src-Glacier2CryptPermissionsVerifier-CryptPermissionsVerifierI.cpp.patch"
    patch_description: "Extend crypt(3) password verification to musl-based systems: the OHOS SDK sysroot does not ship <crypt.h> nor define __GLIBC__, so the code fell into the DES-only fallback and every sha512-crypt password was rejected; declare crypt() directly and use the existing mutex for the non-reentrant call"
    patch_type: "portability"
  - patch_file: "patches/0003-cpp-src-Ice-Network.h.patch"
    patch_description: "Include <poll.h> instead of deprecated <sys/poll.h> (glibc forwarding header, not present on musl/OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0004-cpp-src-Ice-Selector.h.patch"
    patch_description: "Include <poll.h> instead of deprecated <sys/poll.h> in the poll-based Selector path (musl/OHOS compatibility)"
    patch_type: "portability"
  - patch_file: "patches/0005-cpp-src-IceGrid-Activator.cpp.patch"
    patch_description: "Do not require a passwd database entry for the node's own user id: OHOS app sandbox uids (e.g. 20020100) have no /etc/passwd entry, so getpwuid_r failed and icegridnode could not activate any server; when the requested uid matches the running user, skip the lookup and supplementary group resolution"
    patch_type: "portability"
  - patch_file: "patches/0006-scripts-Util.py.patch"
    patch_description: "Recognize sys.platform == 'ohos' as a Linux-family platform in the C++ test driver so the upstream test suite can run on OHOS"
    patch_type: "platform"
