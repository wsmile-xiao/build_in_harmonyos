package: zeroc-ice/3.8.1
homepage: "https://github.com/zeroc-ice/ice"

upstream_check_command: "cd cpp && make os=Linux lib-suffix= MCPP_HOME=$P BZ2_HOME=$P EXPAT_HOME=$P LMDB_HOME=$P CONFIGS=shared -j8 srcs && make tests"
upstream_test_in_build: true
upstream_test_command: "cd cpp && python3 allTests.py"

upstream_tests:
  - file: cpp/test/**/*.py
    source: ice-3.8.1/cpp/test/
    description: "Upstream C++ test suite (100 authoritative suites) executed on OHOS via the patched test driver (Util.py ohos platform recognition): 96 pass, 4 environment limits (Ice/logger HMDFS file rotation, Ice/metrics endpoint-lookup observer semantics, IceSSL/configuration + Glacier2/ssl expired upstream test certs)."
    command: "python3 allTests.py --filter=<suite>"
    result: "96/100 pass on OHOS aarch64; driver requires MAKEFLAGS=os=Linux and pip3 passlib (icehashpassword.py); details in notes.md"

test_package_tests:
  - file: test_client.cpp
    description: "Consumer test: link against packaged libIce, initialize a communicator, verify the library loads and reports the expected version."
    command: "./test_client"
    result: "Ice version: 3.8.1"

assertion_count: 100
