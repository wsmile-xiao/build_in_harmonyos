software: zeroc-ice
version: "3.8.1"
status: built
build_date: "2026-10-05"
build_system: makefile

source:
  url: "https://github.com/zeroc-ice/ice/archive/refs/tags/v3.8.1.tar.gz"
  sha256: "87aa0381f2347715467686547bccf253fa208948bf2a462584872d2d0f8b1720"
  tar_format: tar.gz

# 第二源（配方内 vendored）：https://github.com/zeroc-ice/mcpp/archive/refs/tags/v2.7.2.20.tar.gz
# sha256: 8eea2e805d8d19412b6ca2582058460e86616f27a754e64873b47b91e5de276d

build:
  system: makefile
  configure_options:
    - "os=Linux"
    - "lib-suffix="
    - "CONFIGS=shared"
    - "MCPP_HOME/BZ2_HOME/EXPAT_HOME/LMDB_HOME=<合并前缀>"
    - "CPPFLAGS=-I<prefix>/include -Wno-deprecated-declarations"
    - "LDFLAGS=-L<prefix>/lib"
    - "icegridadmin_system_libs=-ledit -lncursesw"
    - "icestormadmin_system_libs=-ledit -lncursesw"
  dependencies:
    - bzip2/1.0.8.2
    - expat/2.8.2
    - openssl/3.5.6
    - lmdb/0.9.35
    - libedit/20240817
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-Make.project.rules.patch"
  - "0002-cpp-src-Glacier2-CryptPermissionsVerifier.cpp.patch"
  - "0003-cpp-src-IceGrid-Activator.cpp.patch"
  - "0004-scripts-Util.py.patch"
  - "0005-cpp-src-DataStorm-SessionI.cpp.patch"

knowledge_gained:
  - "Ice 自研 Makefile 按 uname 推导 os 变量，OHOS（uname=HarmonyOS）必须命令行显式 os=Linux，且 conan 的 tools.build:compiler_executables 不进 buildenv，CC=/CXX= 也须命令行显式传"
  - "3.8 单架构 Linux 分支按 uname -m 推导 lib 后缀，交叉编译必须显式 lib-suffix= 置空"
  - "mcpp 预处理库由 slice2cpp 静态链接，须先于 Ice 构建；制品仓原版 mcpp/2.7.2 有循环 include 缺陷，必须用 ZeroC 官方 fork v2.7.2.20；OHOS 上 mcpp Makefile 的 Linux 分支不触发（uname=HarmonyOS），-fPIC 等 flags 须显式传"
  - "HMDFS 上 SONAME 别名（libIce.so.38/libIce.so）必须为真实文件，Make.project.rules 的 mksoname/mkshlibname 及 install 路径的 ln -s 全部替换为 cp"
  - "OHOS SDK sysroot 无可用 crypt.h（libcrypt.a 空档案、crypt 符号在 libc.a、头无原型），Glacier2 密码校验需手写 extern \"C\" 声明并以 mutable mutex 保护非重入调用（const 成员函数内 lock_guard 要求 mutex 必须 mutable）"
  - "OHOS 应用沙箱 uid（2xxxxxxxx）无 /etc/passwd 记录，icegridnode Activator 必须对自身 uid/euid 跳过 getpwuid_r 解析"
  - "C++17 结构化绑定不能进 lambda 捕获列表（P1091，C++20 才合法），OHOS clang 15 -std=c++17 严格拒绝，须拷贝 key 到具名变量再捕获（DataStorm/SessionI.cpp）"
  - "Ice 3.8.1 公共头 Ice/SSL/Config.h 非 Apple/Win 路径无条件 include openssl 三头（IceSSL 并入 Ice 的泄漏面），消费者编译须额外加 openssl 头路径（3.7 无此泄漏）"
  - "binary-sign-tool selfSign 在部分设备不可用，配方签名必须探测式：签名失败保留链接器自带 .codesign，禁止剥离后留空；musl dlopen 加载无 .codesign 段的 so 静默拒载"
  - "上游测试驱动 scripts/Util.py import 即 make print 探测构建变量，allTests.py 运行（含 --help）前必须 export MAKEFLAGS（os=Linux 等），否则按 uname 找 Make.rules.HarmonyOS 失败"
