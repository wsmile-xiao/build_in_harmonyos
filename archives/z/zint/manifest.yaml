software: zint
display: "Zint"
description: "Barcode encoding library supporting over 50 symbologies including QR Code, Data Matrix, PDF417, and many more"
category: library
homepage: "https://zint.org.uk"
license: BSD-3-Clause
build_system: cmake
url_template: "https://github.com/zint/zint/archive/refs/heads/master.tar.gz"

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "CMake 构建需要设置正确的 RPATH，确保运行时能找到 libzint.so"
    - "默认禁用 PNG 和 Qt 支持可减少依赖"
    - "前端工具 zint CLI 需要使用 patchelf 修复 RPATH"
  common_dependencies: []

# 版本索引
versions:
  "2.16.0":
    status: built
    build_date: "2026-05-25"