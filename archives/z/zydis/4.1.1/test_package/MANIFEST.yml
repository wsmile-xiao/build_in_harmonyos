package: zydis/4.1.1
homepage: "https://github.com/zyantific/zydis"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - "ZydisRegression (tests/regression.py via ZydisInfo over tests/cases/*.in/*.out)"
  - "ZydisRegressionEncoder (tests/regression_encoder.py via encoder fuzz tools and JSON cases)"
upstream_test_notes: "Upstream registers 2 ctest entries when ZYDIS_BUILD_TESTS=ON (tools required: ZydisInfo plus encoder fuzz helpers). Case files: tests/cases/*.in/*.out pairs plus tests/enc_test_cases.json and tests/re_enc_test_cases.json. Counts to be filled from true-device ctest output."

test_package_tests:
  - file: test.c
    description: "Decodes a 25-byte x86-64 buffer with ZydisDisassembleIntel (checks first PUSH mnemonic, length, text, full consumption, 8 instructions) and encodes MOV RAX, 0x1337 (checks 7 exact bytes)."
    command: "./test_zydis"
  - file: test.c
    description: "Runs the packaged ZydisInfo CLI on a single byte (push rcx) to prove the installed tools work."
    command: "ZydisInfo -64 51"

assertion_count: 10
