# 软件级 manifest — zork
software: zork
display: "zork"
description: "The Dungeon (Zork I) — 经典文字冒险游戏 C 实现"
category: games
homepage: "https://github.com/devshane/zork"
license: MIT

build_system: make

ohos_adaptation:
  key_points:
    - "上游 dinit.c 通过 #ifndef TEXTFILE 块硬编码 /usr/games/lib/dunlib/dtextc.dat（OHOS 无该路径）；build() 内联改写 Makefile 的 DATADIR 变量，使 -DTEXTFILE=\"$(DATADIR)/dtextc.dat\" 解析为包内绝对路径"
    - "TERMFLAG=-DMORE_NONE 消除 -ltermcap 依赖（OHOS 不提供 termcap）"
    - "零补丁文件：所有源码适配在 build() 内联完成，patches_applied 为空"
    - "纯 C 无第三方依赖，仅平台 libc"
  status: built
