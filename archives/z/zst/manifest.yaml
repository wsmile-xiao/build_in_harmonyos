software: zst
display: "zst"
description: "Unified compressor CLI — one small binary front-end for zstd/xz/gzip/bzip2"
category: compress
homepage: "https://github.com/kilobyte/zst"
license: "GPL-2.0-or-later OR BSD-1-Clause"
build_system: cmake

ohos_adaptation:
  key_points:
    - "cmake_minimum_required(2.8.12) 被 cmake 4.x 拒绝 → 需要 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "上游用 CHECK_LIBRARY_EXISTS + -l<name> 找依赖；显式传 conan 包 include 路径，并用只含 .a 的私有 lib 目录令其静态链接"
    - "自发现 ohos.toolchain.cmake + 裸 cmake（不经 conan_toolchain，ML-0035）"
    - "ZSTD_BUILD_* 不存在：产物只有一个可执行文件 bin/zst（按 argv[0] 分派 zst/gzip/bzip2/xz 行为）"
    - "二进制需 binary-sign-tool 自签（HarmonyOS PC XPM）"
  common_dependencies:
    - zlib
    - bzip2
    - xz
    - zstd

versions:
  "0.4":
    status: built
    build_date: "2026-09-23"
    format: conan
    note: "cmake 配方；zstd/xz/gzip/bzip2 四库静态链接进单个 bin/zst；上游 ctest 161 项实机 139 通过/14 失败/8 跳过"
