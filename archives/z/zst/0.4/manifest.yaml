version: "0.4"
software: "zst"
status: built
build_date: "2026-09-23"
build_system: "cmake"

source:
  url: "https://github.com/kilobyte/zst/archive/refs/tags/v0.4.tar.gz"
  sha256: "9cb623ca402372981402d385e9fafdc168c0d60b481c6d61e4354de2728181e2"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_REQUIRED_LINK_OPTIONS=-L<build>/zst-static-libs"
    - "-DCMAKE_EXE_LINKER_FLAGS=-L<build>/zst-static-libs"
  dependencies:
    - zlib/1.3.1
    - bzip2/1.0.8.2
    - xz/5.6.2
    - zstd/1.5.7.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 CMakeLists 声明 cmake_minimum_required(2.8.12)；cmake 4.x 已移除 <3.5 兼容 → configure 直接报错，需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "上游用 CHECK_LIBRARY_EXISTS(<name>) + target_link_libraries(zst <name>)，不做 find_package；需显式传 -I 依赖头文件路径，并把只含 .a 的私有 lib 目录同时挂到 CMAKE_REQUIRED_LINK_OPTIONS 与 CMAKE_EXE_LINKER_FLAGS 才能静态链接到 4 个压缩库"
  - "zlib/1.3.1、bzip2/1.0.8.2、xz/5.6.2 的 ohpcd 变体本就只装 libz.a/libbz2.a/liblzma.a（静态）；zstd 需用 1.5.7.1（同包同时提供 libzstd.so 与 libzstd.a），1.5.7 只有 .so"
  - "产物只有一个可执行文件：4 个压缩库全部静态链入，DT_NEEDED 仅剩 libc.so，无需 RPATH/LD_LIBRARY_PATH"
  - "上游 tests/ 依赖原生 gzip/bzip2/xz/zstd CLI（.cirrus.yml 也 apt 装这 4 个）；OHOS 需把 zstd 包 bin/ 加入 PATH"
  - "OHOS toybox cmp 不支持 -b，需用 diffutils 的 GNU cmp（/data/service/hnp/diff.org/diff_3.10/bin）"
  - "上游 do_dir() 边 readdir 边处理，新生成的输出文件会被同一目录流再次访问——HMDFS readdir 分批返回时暴露，glibc getdents 一次性返回小目录时不会"
