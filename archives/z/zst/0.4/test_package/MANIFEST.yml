# test_package/MANIFEST.yml — zst/0.4
# CI L0e 强制要求此文件存在（声明上游测试来源）
package: zst/0.4
homepage: "https://github.com/kilobyte/zst"

# 上游测试入口：CMake/CTest 工程（tests/CMakeLists.txt，on 现代 cmake 亦可用 ctest）
upstream_check_command: "cmake -S . -B build && cmake --build build && ctest --test-dir build"

# build() 中未集成上游测试：用例依赖原生 gzip/bzip2/xz/zstd CLI，且部分用例受
# OHOS 文件系统/设备语义限制（见 notes.md）。改由适配流程在实机上真实执行并记录。
upstream_test_in_build: false
upstream_test_command: "ctest -j8 （161 项：tests/*.t × 4 工具 = 152 + tests/*.T = 9）"

# 实机实测（HarmonyOS PC，run_upstream_tests.sh）：161 = 139 通过 + 14 失败 + 8 跳过
upstream_test_result:
  total: 161
  passed: 139
  failed: 14
  skipped: 8
  log: "reports/upstream-ctest.log"
  junit: "reports/upstream-ctest-junit.xml"
  failing_reason:
    - "z-dir-alreadysuffix-*/zd-dir-many-*（8 项）：上游 do_dir() 边 readdir 边处理，新生成的输出文件被同一目录流再次访问（HMDFS readdir 分批返回时暴露；glibc getdents 一次性返回小目录时不会）"
    - "zd-full-*（4 项）：用例需要 /dev/full，本环境该设备节点 Permission denied"
    - "z-dir-nonreg / z-file-nonreg（2 项）：用例需要 mkfifo，OHOS 无该命令且创建 FIFO 报 Operation not permitted"
  skipped_reason:
    - "*-*-noperm-*（8 项）：用例首行 root 检测 [ $(whoami) != root ] 在 OHOS 无可用 whoami 时直接走 exit 42；且 HMDFS 忽略权限位，断言无法在本地验证"

upstream_tests:
  - file: tests/*.t
    source: zst-0.4/tests/*.t
    description: "逐工具 CLI 用例（往返/后缀/argv0 分派/递归）—— 对 gzip、bzip2、xz、zstd 各实例化一次，共 38×4=152 项"
    command: "ctest -j8（152 项）"
  - file: tests/*.T
    source: zst-0.4/tests/*.T
    description: "工具无关 CLI 用例（未知格式、非普通文件/FIFO、/dev/full、目录处理），共 9 项"
    command: "ctest -j8（9 项）"

# test_package 自带测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "用已安装的 zst 二进制对 zstd/xz/gzip/bzip2 做 压缩→完整性校验(-t)→解压 往返，断言逐字节一致；并校验未知格式被拒绝"
    command: "bash test.sh"

# 测试断言总数（近似值）
assertion_count: 12
