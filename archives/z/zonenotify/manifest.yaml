# 软件级 manifest
# 文件位置: archives/z/zonenotify/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: zonenotify

display: "ZoneNotify"

description: "Send a NS_NOTIFY packet to BIND slave server from your DJBDNS server"

category: network

homepage: "https://github.com/morettoni/zonenotify"

license: "BSD-2-Clause"

build_system: makefile

ohos_adaptation:
  key_points:
    - "Upstream Makefile hardcodes 'cc' instead of $(CC); conanfile.py compiles directly using Conan-configured compiler"
    - "No configure script; single-file C program compiled with one command"
  common_dependencies: []

versions:
  "0.1":
    status: built
    build_date: "2026-08-24"
