# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: zbar/0.23.93
homepage: "https://github.com/mchehab/zbar"

# 上游测试命令
upstream_check_command: "make check"

# 上游 make check 失败（test_decode.c 需要 argp.h，OHOS 不提供）
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_decode.c
    source: zbar-0.23.93/test/test_decode.c
    description: "Barcode decode test (requires argp.h, not available on OHOS)"
    command: "./test/test_decode"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_zbar.c
    description: "Verify libzbar scanner creation and configuration"
    command: "./test_zbar"

# 测试断言总数
assertion_count: 3
