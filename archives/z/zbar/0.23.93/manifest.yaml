version: "0.23.93"
name: "zbar"
status: built
build_date: "2026-08-06"
build_system: "autotools"

source:
  url: "https://github.com/mchehab/zbar/archive/refs/tags/0.23.93.tar.gz"
  sha256: "212dfab527894b8bcbcc7cd1d43d63f5604a07473d31a5f02889e372614ebe28"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-x"
    - "--without-dbus"
    - "--without-qt"
    - "--without-gtk"
    - "--without-python"
    - "--without-java"
  dependencies:
    - "imagemagick/7.1.2.29"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.am.patch"
  - "0002-configure.ac.patch"

knowledge_gained:
  - "autopoint 不可用，需移除 AM_GNU_GETTEXT/AM_ICONV"
  - "zbar 只提供 configure.ac，需 autoreconf 生成 configure"
  - "E007: config.guess 需修补识别 HarmonyOS（由 autoreconf 安装的版本已包含）"
  - "E011: configure 中 umask 077 需改为 022"
  - "ImageMagick .la 文件 libdir 路径不正确，需修复"
  - "CI worker 缺少 automake/aclocal，通过 tool_requires('automake/1.18') 从 ohpcd 仓获取"
  - "使用 autotools.autoreconf() 替代 self.run('autoreconf -fi')，正确使用 conan build env"

patch_classification:
  - file: 0001-Makefile.am.patch
    type: portability
    platform_only: True
    guard: 'gettext-missing'
  - file: 0002-configure.ac.patch
    type: portability
    platform_only: True
    guard: 'gettext-missing'
