package: zita-lrx/0.1.2
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"

upstream_check_command: "make -C source check"
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  The 0.1.2 tarball ships AUTHORS, COPYING, README, README.CONFIG,
  examples/ (two .zlrx config examples) and source/: the source/Makefile
  defines only all, install, uninstall and clean targets. There is no
  test/check target and no test directory, so `make -C source check` fails
  with "No rule to make target 'check'". The tool is exercised instead by
  the packaged layered smoke test below.

test_package_tests:
  # ---- ARTIFACT layer (conanfile.py, machine-checkable) ------
  - file: conanfile.py
    name: artifact-machine
    description: >-
      readelf -h asserts the packaged binary is an AArch64 ELF.
    command: "llvm-readelf -h bin/zita-lrx"
  - file: conanfile.py
    name: artifact-needed
    description: >-
      readelf -d asserts every DT_NEEDED entry is a plain basename (no
      baked-in package or host absolute path) and that the binary declares
      its dependency closure at all.
    command: "llvm-readelf -d bin/zita-lrx"
  - file: conanfile.py
    name: artifact-host-prefix
    description: >-
      A byte scan asserts no "/usr/local" host installation prefix survives
      inside the produced binary.
    command: "python byte scan"
  - file: conanfile.py
    name: artifact-codesign
    description: >-
      The staged copy must carry exactly one .codesign section: zero means
      XPM refuses to exec it, more than one means a botched re-sign.
    command: "llvm-readelf -SW staged-bin/zita-lrx"
  # ---- LOADER/PARSER layer (test_zita_lrx.sh, really executed) ------
  - file: test_zita_lrx.sh
    name: load-banner
    description: >-
      `zita-lrx -h` prints the "zita-lrx-0.1.2" version banner and takes the
      upstream exit(1) path (help() calls exit(1)). The banner proves the
      binary started, linked and parsed its own command line.
    command: "zita-lrx -h"
  - file: test_zita_lrx.sh
    name: load-noargs
    description: >-
      `zita-lrx` with no config argument falls through to the same banner and
      exits 1 — exit 1 (not 127 loader error, not a crash) proves the whole
      runtime shared-library closure resolved.
    command: "zita-lrx"
  - file: test_zita_lrx.sh
    name: load-missing-conf
    description: >-
      A nonexistent config file makes Lrxconf::load fail and main() report
      "Can't load configuration" with exit 1 — exercises the config parser
      error path end to end.
    command: "zita-lrx missing.zlrx"
  # ---- CAPABILITY layer: really executed at the service boundary ------
  - file: test_zita_lrx.sh
    name: process-valid-conf
    description: >-
      A valid config file (/zita-lrx + /xover/freq + /xover/shape) is parsed
      to completion and main() reaches the Jclient construction. With no
      JACK server on the build host the observed failure is
      "Can't connect to JACK" with exit 1: the clthreads A_thread base and
      the full Lrxconf grammar ran for real; only the audio service boundary
      is unreachable, and it is asserted by its observed signature.
    command: "zita-lrx smoke.zlrx"
  # ---- CAPABILITY layer: declared skipped, with reason ------
  - file: test_zita_lrx.sh
    name: realtime-dsp
    outcome: skipped
    description: >-
      The real-time crossover processing needs a live JACK audio graph with
      real audio callbacks; no build host provides one. Reported as
      ZITA_LRX_TEST_SKIP with reason, never as a pass.
    command: "zita-lrx (audio process callback)"

# Accounting, all five dimensions, from the run recorded in notes.md:
static_upstream_test_files: 0
executable_test_cases: 8
measured_passed: 8
measured_skipped: 1
measured_failed: 0

test_case_count: 9
assertion_count: 8
