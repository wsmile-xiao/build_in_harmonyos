software: z80asm
version: "1.8"
status: built
build_date: "2026-06-17"

build_system: makefile

source:
  url: "https://download.savannah.gnu.org/releases/z80asm/z80asm-1.8.tar.gz"
  sha256: "67fba9940582cddfa70113235818fb52d81e5be3db483dfb0816acb330515f64"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
  - "CC=clang"
  - "SHELL=/data/service/hnp/bin/bash"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "z80asm 是纯 Makefile 项目，无 configure 脚本，需直接 make"
  - "Makefile 默认 CC=gcc，HarmonyOS 上需覆盖 CC=clang"
  - "Makefile 设置 SHELL=/bin/bash，但 HarmonyOS bash 在 /data/service/hnp/bin/bash"
  - "无 make install target，需手动 cp 二进制和 man page"
  - "项目自带测试在 make all 时自动运行（make -C tests）"
