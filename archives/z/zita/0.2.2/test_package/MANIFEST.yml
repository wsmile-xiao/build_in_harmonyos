# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: zita/0.2.2
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/index.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C source check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（zita-rev1 0.2.2 上游无任何测试目标）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_zita.c
    description: "消费者测试用例（用例级：conan test 进程 rc=0 完整通过）。纯 C 检查器执行，含 4 项确定性检查点：①二进制存在于 bin/；②ELF 为 64 位小端 AArch64；③版本字面量 zita-rev1/0.2.2 内嵌；④ELF DT_NEEDED 动态依赖链完整（LD_LIBRARY_PATH 可解析）。4 项检查点全部通过，进程 rc=0 完整通过。"
    command: "./test_zita"

# 测试断言总数（近似值, 用于质量评估；通过率以用例级 rc=0 申报，断言仅参考）
assertion_count: 4