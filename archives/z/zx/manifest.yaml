software: zx
display: "zx"
description: "A tool for writing better scripts - JavaScript CLI and script runtime by Google"
category: utility
homepage: "https://google.github.io/zx/"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 JS ESM 应用（node v24.13.0 运行时），GitHub 源码 tarball 自带与 npm 包字节一致的预构建 build/，无需打包器"
    - "本机 node 必须 --jitless（否则 Check failed: 12 == (*__errno_location()) / Signal 5）；hnp npm wrapper 同样崩溃，须直接用 node 调 npm-cli.js"
    - "--jitless 关闭 WebAssembly → node 自带 TS transform（amaro）不可用，4 个 .ts 测试文件先用包内 tsc 编译再跑"
    - "TERM=dumb 下 chalk 关色 → 上游颜色断言须 FORCE_COLOR=1（不删改断言）"
    - "/system/bin/whoami 因 /etc/passwd 无该 uid 记录恒失败 → runner 提供等价 whoami shim"
    - "launcher 用 env -i 干净环境（OHOS AppSpawn/UBSAN 等环境变量会让 node Signal 5）"
    - "上游套件中的平台限制用例（无外网/只读 /tmp/OHOS ps 表不可解析）以 EXPECTED_ENV_FAILURES 清单显式豁免并打印技术原因，清单外失败即构建失败"
  common_dependencies: []

versions:
  "8.8.5":
    status: built
    build_date: "2026-09-30"
    format: conan
    note: "custom 配方（node/npm 构建，无 C/C++ 编译）；上游 12 文件 259 用例实跑 235 pass / 23 平台豁免 / 1 skip；test_package 4/4"
