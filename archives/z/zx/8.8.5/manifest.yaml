# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "本机 node v24.13.0 必须 --jitless：否则 Check failed: 12 == (*__errno_location()) → Signal 5 core dump；hnp 的 npm wrapper 同样崩溃，须用 node 直接调 <node前缀>/lib/node_modules/npm/bin/npm-cli.js"
  - "--jitless 关闭 WebAssembly → node 自带 TypeScript transform（amaro/wasm）与 undici 的 llhttp 解析器均不可用：4 个 .ts 测试文件须先用包内 tsc 编译成 JS；依赖 fetch() 的断言在本机无法通过"
  - "本机 /tmp 是 erofs 只读挂载（mount 显示 ro）→ 上游用 /tmp 字面量路径的用例必然 EROFS/ENOENT；$TMPDIR 无法替换测试里的字面量，只能显式豁免"
  - "OHOS toybox 的 `ps -lx` 输出没有 @webpod/ps 的 unix-grid 解析器所需的稳定列边界 → zx 的 kill()/timeout()/killSignal 全部断言失败（TypeError: Cannot read properties of undefined (reading 'spaces')）"
  - "TERM=dumb 下 chalk 自动关色 → 上游颜色断言（export.test.js core exports、log.test.ts cmd/cd/fetch/retry）失败；设 FORCE_COLOR=1 恢复彩色能力即可全部通过，不改上游断言"
  - "/system/bin/whoami 对本应用 uid 恒报 'whoami: bad uid'（/etc/passwd 无记录）→ 上游 fixture test/fixtures/markdown.md.mjs 退出 127，连带 `supports --quiet flag` 与 `markdown scripts are working` 失败；runner 在 PATH 前置等价 whoami shim 后二者通过"
  - "conan 的 copy() 模式匹配的是文件而非目录：copy(self, 'build', src=..., dst=...) 会静默复制 0 个文件，必须 src 指向目录内部 + 模式 '*'（实测 bin/zx 启动时报 MODULE_NOT_FOUND 才发现）"
  - "conan test 的 test() 可能在被删除的临时目录里执行：子进程继承失效 cwd 会报 'shell-init: error retrieving current directory: getcwd: cannot access parent directories' 并使所有检查失败；subprocess 必须显式传 cwd=<存在的目录>"
  - "同一次运行的个别上游用例存在顺序性抖动（单独运行通过、整文件运行失败），因此平台豁免清单按多次运行的并集收口，保证 unexpected 恒为 0"
