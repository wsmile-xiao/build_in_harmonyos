# test_package/MANIFEST.yml
# 上游测试声明（CI L0e 强制要求）— zx 8.8.5 / HarmonyOS PC (OHOS aarch64)
#
# R51 三步法：
#   1. 清点：上游 12 个测试文件、259 个测试用例（见下表，`npm run test:unit`）
#   2. 实际运行：conanfile.py build() 内执行 run_upstream_tests.sh（完整套件，
#      不删改任何上游断言），TAP 日志落在 <source>/.zx-test-reports/
#   3. 如实回填：本文件与 notes.md 记录实测数字与平台豁免项
#
# 关键：本设备 node v24.13.0 必须 `--jitless`（否则 Signal 5 core dump），
# 而 --jitless 关闭 WebAssembly，因此 4 个 .ts 测试文件先用包内 tsc 编译成 JS
# 再跑（node 自带 TS transform/amaro 依赖 wasm，不可用）。

package: zx/8.8.5
homepage: "https://google.github.io/zx/"

# 上游测试入口（package.json: "test:unit": "node --experimental-transform-types ./test/all.test.js"）
# 本机以 --jitless 逐文件运行等价集合（all.test.js 仅为聚合入口）。
upstream_check_command: "npm run test:unit"
upstream_test_in_build: true
upstream_test_command: "sh run_upstream_tests.sh <source> <reports>  # node --test --test-concurrency=1 --test-force-exit，JS 8 文件 + tsc 编译后的 4 个 TS 文件"

# 上游实际存在的测试文件（google/zx@8.8.5 test/ 目录，node:test 框架）
upstream_tests:
  - name: cli
    file: test/cli.test.js
    source: google/zx@8.8.5/test/cli.test.js
    description: "CLI 断言：--version/--help/--quiet/--verbose/--cwd/--shell/--prefix/--postfix、https 脚本、stdin、非标准扩展名、markdown 脚本、require()"
    command: "node --test test/cli.test.js"
    count: 39
  - name: core
    file: test/core.test.js
    source: google/zx@8.8.5/test/core.test.js
    description: "$ 模板调用、thenable 参数、引号/转义、pipe、kill/timeout/killSignal、cd/within、ProcessPromise/ProcessOutput、fetch 管道"
    command: "node --test test/core.test.js"
    count: 133
  - name: deps
    file: test/deps.test.js
    source: google/zx@8.8.5/test/deps.test.js
    description: "installDeps/parseDeps：JS API 与 CLI 两种装依赖路径、自定义 registry、import/require 解析"
    command: "node --test test/deps.test.js"
    count: 10
  - name: export
    file: test/export.test.js
    source: google/zx@8.8.5/test/export.test.js
    description: "core/cli/index 三个入口的导出面类型断言（由 scripts/build-tests.mjs 生成）"
    command: "node --test test/export.test.js"
    count: 3
  - name: global
    file: test/global.test.js
    source: google/zx@8.8.5/test/global.test.js
    description: "globals 入口（zx/globals）注入的全局符号"
    command: "node --test test/global.test.js"
    count: 2
  - name: index
    file: test/index.test.js
    source: google/zx@8.8.5/test/index.test.js
    description: "index 入口导出与版本常量"
    command: "node --test test/index.test.js"
    count: 2
  - name: util
    file: test/util.test.js
    source: google/zx@8.8.5/test/util.test.js
    description: "util 纯函数：isString/quote/parseDuration/toCamelCase/preferLocalBin/normalizeExt 等"
    command: "node --test test/util.test.js"
    count: 12
  - name: vendor
    file: test/vendor.test.js
    source: google/zx@8.8.5/test/vendor.test.js
    description: "内置 vendor API：YAML/globby/fetch/which/minimist"
    command: "node --test test/vendor.test.js"
    count: 7
  - name: error
    file: test/error.test.ts
    source: google/zx@8.8.5/test/error.test.ts
    description: "Fail 错误格式化：exit code 表、errno 消息、调用点定位（tsc 编译后运行）"
    command: "node --test <tsout>/test/error.test.js"
    count: 10
  - name: goods
    file: test/goods.test.ts
    source: google/zx@8.8.5/test/goods.test.ts
    description: "goods API：question/echo/spinner/fetch/retry/tempfile/tempdir/versions（tsc 编译后运行）"
    command: "node --test <tsout>/test/goods.test.js"
    count: 29
  - name: log
    file: test/log.test.ts
    source: google/zx@8.8.5/test/log.test.ts
    description: "log 输出格式（含 ANSI 颜色断言，本机以 FORCE_COLOR=1 提供彩色能力）（tsc 编译后运行）"
    command: "node --test <tsout>/test/log.test.js"
    count: 11
  - name: md
    file: test/md.test.ts
    source: google/zx@8.8.5/test/md.test.ts
    description: "markdown 代码块抽取 transformMarkdown()（tsc 编译后运行）"
    command: "node --test <tsout>/test/md.test.js"
    count: 1

# test_package 中自带的测试（消费者视角，执行打包后的 bin/zx）
test_package_tests:
  - file: conanfile.py
    description: "消费者测试：bin/zx --version 断言 8.8.5；-e 内 $`` 命令捕获；脚本文件执行（cd/fs/$）；stdin 脚本执行"
    command: "conan test test_package zx/8.8.5"
    count: 4
  - file: test.sh
    description: "同上 4 项检查的可独立运行 sh 版本（CI L0c 测试源）"
    command: "sh test.sh <bin/zx 路径>"
    count: 4

# 上游测试用例总数（12 个文件实测 259 例；all.test.js 为聚合入口不计，
# extra.test.js 为 license 头 lint、test/smoke/* 与 test/it/* 为可选跨运行时/打包测试，均不在默认 unit 套件内）
upstream_case_count: 259
test_package_assertion_count: 4
assertion_count: 263

# ---------------------------------------------------------------------------
# 平台豁免（EXPECTED_ENV_FAILURES，见 conanfile.py）
# ---------------------------------------------------------------------------
# 套件始终完整运行、断言不删不改；下列断言在本设备环境下确定无法通过，
# conanfile.py 按 TAP 路径逐一核对并打印技术原因；出现清单之外的失败即
# 让 conan create 失败（防止真实回归被平台限制掩盖）。
#
# 四类根因：
#   A 无外网出口   —— undici fetch（其 llhttp 解析器是 wasm，--jitless 下不可用）
#   B /tmp 只读    —— 本机 /tmp 为 erofs 只读挂载，上游用 /tmp 字面量路径
#   C OHOS ps 表   —— zx 经 @webpod/ps 杀子进程，其 unix-grid 解析器读不了
#                      OHOS toybox `ps -lx` 的列边界 → kill()/timeout() 断言失败
#   D --jitless    —— 低内存 + jitless 下输出交错/getcwd 行为差异（部分为顺序性
#                      抖动：单独运行可通过，整文件运行失败）
#
# 已修复（非豁免）：
#   * `supports `--quiet` flag` / `markdown scripts are working` ——
#     本机 /system/bin/whoami 因 /etc/passwd 无该 uid 记录而恒失败
#     ("whoami: bad uid")，导致 test/fixtures/markdown.md.mjs 退出 127；
#     runner 提供等价 whoami shim 后两者通过（不删改上游断言）。
#   * export.test.js / log.test.ts 的颜色断言 —— TERM=dumb 下 chalk 关色；
#     runner 设 FORCE_COLOR=1 恢复彩色能力后全部通过。

exempt_platform_failures:
  - family: A-no-network
    count: 8
    reason: "无外网出口：undici fetch 的 llhttp 解析器依赖 WebAssembly（--jitless 下禁用）"
  - family: B-readonly-tmp
    count: 3
    reason: "/tmp 为 erofs 只读挂载，上游测试使用 /tmp 字面量路径（$TMPDIR 无法替换字面量）"
  - family: C-ohos-ps
    count: 7
    reason: "zx 经 @webpod/ps 杀子进程；OHOS toybox ps -lx 输出无列边界，unix-grid 解析失败"
  - family: D-jitless
    count: 6
    reason: "--jitless 下输出交错/getcwd 行为差异（含 3 项单独运行可通过的顺序性抖动）"

# ---------------------------------------------------------------------------
# 实测结果（本地 CI 模拟 / conan create 内 build() 实跑，2026-09-30）
# ---------------------------------------------------------------------------
#   UPSTREAM_TESTS_SUMMARY total=259 pass=235 fail=23 skipped=1 files=12
#   UPSTREAM_TESTS_POLICY  tolerated=23 unexpected=0
#   上游用例通过率 235/259 = 90.7%（1 例 SKIP 为上游自带 `handles multiline literals`）
#   平台豁免 23 例（上表四族），全部带技术原因；清单之外的失败会让构建失败。
#   test_package 消费者断言 4/4 通过。
#   注：cli/core 两文件存在 ±1 例的跨次运行抖动（顺序性相关的少数用例），
#       豁免清单按"并集"收口，故各次运行 unexpected 均恒为 0。
measured_results:
  total: 259
  pass: 235
  fail: 23
  skipped: 1
  pass_rate: "90.7%"
  tolerated_platform_failures: 23
  unexpected_failures: 0
  test_package_checks: "4/4"
  measured_date: "2026-09-30"
