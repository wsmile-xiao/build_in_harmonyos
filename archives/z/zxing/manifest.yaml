software: zxing
display: "ZXing"
description: "条码/二维码编解码库（Zebra Crossing），core 模块提供 QR Code、Data Matrix、Aztec、PDF417、UPC/EAN 等格式的生成与识别"
category: development
homepage: "https://github.com/zxing/zxing"
license: Apache-2.0
build_system: maven

ohos_adaptation:
  key_points:
    - "纯 Java/JVM 包：产物是 JAR（class major=52），不消费 clang/clang++，无原生二进制，无 ELF 面"
    - "构建与 test_package 共用 conandata 中固定的 BiSheng JDK 17.0.13（ohos-aarch64）与 Apache Maven 3.6.3，SHA-256 锁定"
    - "必须注入 -Dos.name=Linux：OpenHarmony PC 的 JVM 自报 os.name=harmonyos，Maven/Surefire/java.awt 会判不支持平台"
    - "单模块构建（cwd=core）：仓库根 reactor 会因 JDK≥17 激活的 zxingorg profile（parent 仍是 3.5.3-SNAPSHOT）在读模型阶段失败"
    - "package_type=unknown：Java 制品无 static/shared 语义，声明 library 会被 Conan 2 要求 shared 选项"
  common_dependencies: []

versions:
  "3.5.3":
    status: built
    build_date: "2026-10-06"
    conan_ref: "zxing/3.5.3"
