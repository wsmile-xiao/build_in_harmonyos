# Version-level manifest — zxing 3.5.3 (ARCHIVE-SPEC v3.0)
software: zxing
version: "3.5.3"
status: built
build_date: "2026-10-06"
conan_ref: "zxing/3.5.3"

source:
  url: "https://github.com/zxing/zxing/archive/refs/tags/zxing-3.5.3.tar.gz"
  sha256: "0ff6194b8f9f7346c48922ce04f6a037b21435a739a7b526e097a69cf019816b"
  commit: "f0f1a94439db0300ff0c4618f4e0a41aa630aeac"
  tag: "zxing-3.5.3"
  tar_format: tar.gz

build:
  system: maven
  # `mvn -B -ntp -Dstyle.color=never -Djava.awt.headless=true clean verify`，cwd=<src>/core
  configure_options:
    - "-B"
    - "-ntp"
    - "-Dstyle.color=never"
    - "-Djava.awt.headless=true"
    - "clean verify"
  dependencies:
    - "BiSheng JDK 17.0.13 pinned archive（配方与 test_package 共用同一 URL/SHA-256，设备无 JDK 时自动下载）"
    - "Apache Maven 3.6.3 官方归档（SHA-256 锁定，配方每次构建下载到 build_folder）"
    - "Maven Central 测试与插件构件（junit 4.13.2、maven-surefire、checkstyle、apache-rat、clirr、bnd 等）"
  toolchain:
    jvm: "BiSheng JDK 17.0.13 (ohos-aarch64)"
    maven: "Apache Maven 3.6.3 (archive.apache.org, SHA-256 pinned)"
  # JVM 构建不消费 clang/clang++：zxing core 不含任何原生代码。
  cc: unused
  cxx: unused

runtime:
  artifact: "lib/zxing-core-3.5.3.jar"
  artifact_size: 611275
  bytecode_level: "Java 8 (major 52)"
  jvm_required: "17+ (OHOS BiSheng JDK 17.0.13)"
  automatic_module_name: "com.google.zxing"
  osgi_headers: true

patches_applied: []

knowledge_gained:
  - "zxing 3.5.3 的 zxingorg 模块在该发布 tag 上 parent 版本仍是 3.5.3-SNAPSHOT，而 zxingorg profile 在 JDK≥17 激活 ⇒ 从仓库根跑 reactor 会在读模型阶段就失败；从 core/ 目录单独构建即可绕开且不改源码"
  - "上游 core 模块 Surefire 基线：131 个测试类 / 542 个用例 / 0 失败 / 0 错误 / 0 跳过；源码 @Test 注解 490 个，差 52 来自 54 个黑盒子类继承 AbstractBlackBoxTestCase 的用例"
  - "OpenHarmony PC 上 Maven/Surefire 需要 -Dos.name=Linux，否则 os.name=harmonyos 会被插件判为不支持平台"
  - "产物为单个 JAR：291 个 class 全部 major=52，含 OSGi Bundle-* 与 Automatic-Module-Name，无 module-info.class"
