package: zxing/3.5.3
homepage: "https://github.com/zxing/zxing"

upstream_check_command: "mvn -B -ntp -Dstyle.color=never -Djava.awt.headless=true clean verify   # cwd = <src>/core"
upstream_test_in_build: true
upstream_test_command: "mvn -B -ntp -Dstyle.color=never -Djava.awt.headless=true clean verify   # cwd = <src>/core"

upstream_tests:
  - file: "core/src/test/java/**/*.java"
    source: "zxing-zxing-3.5.3/core/src/test/java"
    description: "131 个 Surefire 测试类（141 个测试源文件，其中 6 个是抽象黑盒基类/工具类）覆盖 aztec/datamatrix/maxicode/oned/pdf417/qrcode 编解码、common 基础结构与 client.result 解析"
    command: "maven-surefire-plugin:test (542 tests, 131 suites, 0 failures / 0 errors / 0 skipped)"

test_package_tests:
  - file: "TestZxingCore.java"
    description: "对打包后的 zxing-core-3.5.3.jar 编译并运行 16 条消费者断言：4 个核心类可加载、BarcodeFormat/DecodeHintType 枚举可读、3 组 QR 编码→解码往返文本与格式比对、QRCodeWriter 输出尺寸、QR Version 1 维度常量"
    command: "javac -encoding UTF-8 -cp <package-lib>/zxing-core-3.5.3.jar TestZxingCore.java && java -cp <classes>:<package-lib>/zxing-core-3.5.3.jar TestZxingCore"
  - file: "test.py"
    description: "打包产物侧 12 条检查（JAR 非空、ZIP CRC、291 个 class、字节码 major 全为 52、Automatic-Module-Name、Bundle-Version、6 个必需入口类）+ 消费者输出逐字比对 1 条"
    command: "python3 test.py --lib <package-lib> --version 3.5.3 --work <dir> --java <java> --javac <javac> --source TestZxingCore.java"

assertion_count: 29
