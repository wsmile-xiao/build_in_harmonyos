# L0e requires this upstream test and consumer-test manifest.
package: zict/3.0.0
homepage: "https://github.com/dask/zict"

upstream_check_command: "python3 -m pytest -o addopts= --timeout=180 --timeout-method=signal --basetemp=<build-folder>/pytest-tmp zict/tests"
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest -o addopts= --timeout=180 --timeout-method=signal --basetemp=<build-folder>/pytest-tmp zict/tests"

# zict 3.0.0 sdist: zict/tests/ (11 test modules; 522 collected cases).
# On HarmonyOS: 522 passed; the optional LMDB module is skipped at collection
# because its lmdb Python binding is not installed. The recipe applies upstream
# commit b142286 to bound the single-CPU stress loop.
upstream_tests:
  - file: zict/tests/
    source: zict-3.0.0/zict/tests/
    description: "Upstream pytest suite: 522 passed; optional LMDB module skipped because the lmdb binding is unavailable; upstream single-CPU starvation fix applied to test helper"
    command: "python3 -m pytest -o addopts= --timeout=180 --timeout-method=signal --basetemp=<build-folder>/pytest-tmp zict/tests"

test_package_tests:
  - file: test_zict.py
    count: 5
    description: "Consumer import/version check and zict.LRU lookup, eviction, and packaged import path"
    command: "python3 test_zict.py <site-packages-dir>"
