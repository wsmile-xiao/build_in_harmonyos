# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: zeitgeist/1.0.4
homepage: "https://zeitgeist.freedesktop.org"

# 上游测试命令 (automake check 驱动 test/direct 下 11 项 Vala/C 测试)
upstream_check_command: "make check"

# conanfile.py build() 中未集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (make check 全量 11 项: test/direct Vala/C 测试)
upstream_tests:
  - file: test/direct/datamodel-test
    source: zeitgeist-1.0.4/test/direct
    description: "ZeitgeistLog 数据模型序列化/反序列化测试"
    command: "./datamodel-test"
  - file: test/direct/datasource-test
    source: zeitgeist-1.0.4/test/direct
    description: "数据源注册/注销测试"
    command: "./datasource-test"
  - file: test/direct/event-test
    source: zeitgeist-1.0.4/test/direct
    description: "事件对象构造/属性测试"
    command: "./event-test"
  - file: test/direct/log-test
    source: zeitgeist-1.0.4/test/direct
    description: "日志插入/获取/删除测试（本设备因缺 D-Bus machine-id 失败，环境限制）"
    command: "./log-test"
  - file: test/direct/marshalling-test
    source: zeitgeist-1.0.4/test/direct
    description: "GValue 编组测试"
    command: "./marshalling-test"
  - file: test/direct/mimetype-test
    source: zeitgeist-1.0.4/test/direct
    description: "MIME 类型判断测试"
    command: "./mimetype-test"
  - file: test/direct/monitor-test
    source: zeitgeist-1.0.4/test/direct
    description: "监控器添加/移除测试"
    command: "./monitor-test"
  - file: test/direct/query-operators-test
    source: zeitgeist-1.0.4/test/direct
    description: "查询操作符测试"
    command: "./query-operators-test"
  - file: test/direct/symbol-test
    source: zeitgeist-1.0.4/test/direct
    description: "符号映射测试"
    command: "./symbol-test"
  - file: test/direct/table-lookup-test
    source: zeitgeist-1.0.4/test/direct
    description: "数据表查找测试"
    command: "./table-lookup-test"
  - file: test/direct/where-clause-test
    source: zeitgeist-1.0.4/test/direct
    description: "WHERE 子句生成测试"
    command: "./where-clause-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_zeitgeist.c
    description: "消费者测试：真实调用 ZeitgeistLog API 并校验非空"
    command: "./test_zeitgeist"

# 测试断言总数 (上游 make check 11 项 + test_package 1 项)
assertion_count: 12
