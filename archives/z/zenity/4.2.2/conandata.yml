# conandata.yml — zenity 4.2.2

sources:
  url: "https://github.com/GNOME/zenity/archive/refs/tags/4.2.2.tar.gz"
  sha256: "62156891e975539cd8441231e7999c0027326159bb316e2ef95047498d523e81"

patches:
  - patch_file: "patches/0001-meson-make-help-subdir-conditional.patch"
    patch_description: "Make the help/ subdirectory conditional on itstool availability (OHOS has no itstool with libxml2 Python bindings); emits a warning and skips the help docs otherwise"
    patch_type: "portability"
  - patch_file: "patches/0002-zenity-exit-0-after-version-print.patch"
    patch_description: "Exit via _exit(0) right after printing the version in handle-local-options, skipping the AdwApplication/GTK teardown that segfaults headless (Broadway backend without a display server)"
    patch_type: "bugfix"
