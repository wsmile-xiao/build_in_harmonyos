# test_package/MANIFEST.yml — zenity 4.2.2
# CI L0e requires this file to exist.

package: zenity/4.2.2
homepage: "https://gitlab.gnome.org/GNOME/zenity"

# ── Upstream test inventory (R51) ──
# zenity 4.2.2 ships NO meson-registered test suite. The test/ directory
# contains two MANUAL, interactive GUI test scripts that are not wired
# into meson (upstream states they must be run manually):
#   - test/test.pl              — launches every dialog type (--calendar,
#     --entry, --error, ...); requires a display server AND a human
#     operator to close each dialog (upstream: "run manually").
#   - test/test_named_pipe.sh   — opens a --list dialog fed by a named
#     pipe; requires a display server; upstream comment: "should be run
#     manually" because of stale-process issues in CI environments.
# Neither can run headless (OHOS PC has no window system; GTK4 here is
# Broadway-only with no broadwayd server during CI). Upstream itself
# gave up wiring them into the test suite (see test_named_pipe.sh
# header comment).
upstream_check_command: "ls test/*.pl test/*.sh"
upstream_test_in_build: false
upstream_test_command: "test.pl (manual, interactive — not automatable headless)"

upstream_tests:
  - file: test/test.pl
    source: zenity-4.2.2/test/test.pl
    description: "Manual interactive GUI test: launches all 15 dialog types; needs display + operator (upstream: run manually)"
    command: "perl test/test.pl (NOT run: requires display server and human interaction)"
  - file: test/test_named_pipe.sh
    source: zenity-4.2.2/test/test_named_pipe.sh
    description: "Manual interactive --list dialog test via named pipe; needs display server (upstream: run manually)"
    command: "bash test/test_named_pipe.sh (NOT run: requires display server)"

test_package_tests:
  - file: test.sh
    description: "Runs the packaged zenity binary: --version (patched _exit(0) skip of headless GTK teardown) and --help (GOption usage text) — both parsed before g_application_run, safe headless"
    command: "bash test.sh"

assertion_count: 4
