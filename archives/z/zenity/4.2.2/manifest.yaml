# 版本级 manifest — zenity 4.2.2
# 遵循 ARCHIVE-SPEC v2.0

version: "4.2.2"
software: "zenity"

status: built
build_date: "2026-09-17"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/GNOME/zenity/archive/refs/tags/4.2.2.tar.gz"
  sha256: "62156891e975539cd8441231e7999c0027326159bb316e2ef95047498d523e81"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dwebkitgtk=false"
    - "-Dmanpage=false"
  dependencies:
    - "libadwaita/1.2.0"
    - "gtk4/4.22.4"
    - "glib/2.84.0.1.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson-make-help-subdir-conditional.patch"
  - "0002-zenity-exit-0-after-version-print.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "zenity 4.2.2 requires libadwaita-1 >= 1.2 and gtk4 (published ohpcd binaries, Broadway-only OHOS build)"
  - "help/ subdirectory requires itstool with libxml2 Python bindings — unavailable on OHOS; made conditional via patch 0001"
  - "E252: `zenity --version` segfaults (Signal 11) headless during AdwApplication/GTK teardown after the local options callback returns 0; patch 0002 exits via _exit(0) right after printing the version"
  - "zenity ships no meson-registered tests: test/test.pl and test/test_named_pipe.sh are manual interactive GUI scripts (upstream states they must be run manually); documented in test_package/MANIFEST.yml per R51"
  - "zenity is a command-line tool (R38): commands.json at software level"
