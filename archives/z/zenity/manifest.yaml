# 软件级 manifest — zenity
# 遵循 ARCHIVE-SPEC v2.0

software: zenity
display: "zenity"
description: "Display GTK dialog boxes from the command line"
category: utility
homepage: "https://gitlab.gnome.org/GNOME/zenity"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Help subdirectory made conditional (requires itstool with libxml2 Python bindings not available on OHOS)"
    - "webkitgtk disabled, manpage disabled (no help2man)"
    - "E252: --version exits via _exit(0) to skip headless GTK teardown segfault"
    - "Deps from ohpcd registry: libadwaita/1.2.0 (PR #10188), gtk4/4.22.4, glib/2.84.0.1.1"
  common_dependencies:
    - libadwaita
    - gtk4
    - glib

versions:
  "4.2.2":
    status: built
    build_date: "2026-09-17"
    dependencies:
      libadwaita: 1.2.0
      gtk4: 4.22.4
      glib: 2.84.0.1.1
