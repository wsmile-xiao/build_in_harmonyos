software: znc-extra
build_system: cmake

# 版本级 manifest — znc-extra 1.10.2
# 文件位置: archives/z/znc-extra/1.10.2/manifest.yaml
# 子包定位: Alpine community/znc 的 extra() 子包（11 个模块），znc 主包另行适配

version: "1.10.2"

status: built
build_date: "2026-09-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游官方源（znc.in 官方 release 归档）
  url: "https://znc.in/releases/archive/znc-1.10.2.tar.gz"

  # 实测回填：HTTP 200 / 2,313,233 bytes（与 conandata.yml 一致）
  sha256: "5b7561f3b100234d58ae4946eac0262ab305d275c094e64ae723e45d07be08ab"

  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  # 配方通过 CMakeToolchain 变量传参，等价命令行：
  #   cmake -DWANT_OPENSSL=YES -DWANT_ZLIB=YES -DWANT_CYRUS=NO -DWANT_ICU=NO \
  #         -DWANT_ARGON=NO -DWANT_I18N=NO -DWANT_PERL=OFF -DWANT_PYTHON=OFF \
  #         -DWANT_SWIG=NO -Dmoddisable_<非本子包模块>=true
  configure_options:
    - "-DWANT_OPENSSL=YES"
    - "-DWANT_ZLIB=YES"
    - "-DWANT_CYRUS=NO"
    - "-DWANT_ICU=NO"
    - "-DWANT_ARGON=NO"
    - "-DWANT_I18N=NO"
    - "-DWANT_PERL=OFF"
    - "-DWANT_PYTHON=OFF"
    - "-DWANT_SWIG=NO"
    - "-Dmoddisable_<模块名>=true  # 逐个禁用非本子包的 48 个模块"

  dependencies:
    - openssl/3.5.6
    - zlib/1.3.1.1

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-cmake-TestCXX17.cmake.patch"
  - "0002-src-CMakeLists.txt.patch"
  - "0003-src-main.cpp.patch"

# ============================================================
# 测试
# ============================================================

tests:
  upstream_suite: "test/（14 个 GoogleTest 文件 → 18 套件 / 138 用例，仅覆盖 libznc 核心库，不含 modules/*.cpp）"
  upstream_tests_runnable: true
  upstream_tests_supplier_source: "官方 tarball 未打包 gtest/gmock 源码（submodule 未纳入 make dist）；按上游约定补入 GoogleTest v1.17.0 官方 release tarball（sha256 65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c）至 third_party/googletest/{googletest,googlemock} 后目标 unittest_bin 正常生成"
  upstream_tests_result: "138 用例 / 137 通过 / 1 失败（UtilsTest.Timezone：本设备缺 cctz 时区数据库 /usr/share/zoneinfo，非适配缺陷）"
  upstream_tests_log: "reports/upstream-gtest-1.17.0.log"
  package_assertions: 34            # test_package/test.c（11 模块 × 3 项 + 目录清点）
  package_assertion_lines: 12       # conan test 输出 12/12 行 PASS
  consumer_contract: 1              # 真实 znc 宿主进程 dlopen 装载 11/11 模块

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ZNC 模块是 CMake MODULE 类型 .so（PREFIX \"\" / NO_SONAME / hidden visibility），对 ZNC 核心符号的引用留作未定义符号由宿主 dlopen 时解析；子包只打包模块，主程序/核心库/头文件归主包"
  - "OHOS clang 不隐式追加 libc++：znc 可执行文件链接行需显式 -lc++（补丁 0002），否则 C++ 运行时符号未定义"
  - "OHOS/musl 无 pthread_cancel：上游用 pthread_cancel 停止信号线程，需改为原子标志 + 线程定向 SIGUSR1 唤醒（补丁 0003）——pipe 不能唤醒阻塞在 sigwait() 的信号线程，该 fd 由主线程 socket manager 消费"
  - "CMake 的 C++17 探针：CMake 无 Platform/HarmonyOS.cmake 平台模块，优先用编译器能力库 CMAKE_CXX_COMPILE_FEATURES 判定，能力库无法判定时才回退 try_compile（补丁 0001）"
  - "宿主进程须以 -Wl,--export-dynamic 导出核心符号，否则模块装载后解析不到 ZNC 符号，宿主报 'No modules found'——属 znc 主包交付要求"
