sources:
  url: "https://znc.in/releases/archive/znc-1.10.2.tar.gz"
  sha256: "5b7561f3b100234d58ae4946eac0262ab305d275c094e64ae723e45d07be08ab"

patches:
  - patch_file: "patches/0001-cmake-TestCXX17.cmake.patch"
    patch_description: "Probe C++17 support through the compiler capability database; try_compile() cannot link a test program for a target system CMake has no platform module for"
    patch_type: "portability"
  - patch_file: "patches/0002-src-CMakeLists.txt.patch"
    patch_description: "Link the znc executable against c++ explicitly (OHOS clang does not add libc++ implicitly)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-main.cpp.patch"
    patch_description: "OHOS/musl has no pthread_cancel; stop the signal handler thread with an atomic flag plus a SIGUSR1 wakeup"
    patch_type: "portability"
