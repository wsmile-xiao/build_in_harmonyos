package: znc-extra/1.10.2
homepage: "https://znc.in"

upstream_check_command: "cmake --build build/Release --target unittest_bin -j2 && ./build/Release/test/unittest_bin"
upstream_test_in_build: false
upstream_test_command: "cmake --build build/Release --target unittest_bin -j2 && ./build/Release/test/unittest_bin"

upstream_tests:
  - file: test/*.cpp
    source: znc-1.10.2/test/
    description: "Upstream gtest suite: 14 test files (Buffer/Client/Config/Debug/IRCSock/Message/Modules/Network/Nick/Query/String/Thread/User/Utils), registered as 18 suites / 138 cases. Upstream references gtest/gmock as submodules and the official release tarball does not ship their sources (third_party/googletest is an empty directory, third_party/googlemock is absent), so GMOCK_ROOT cannot be resolved and unittest_bin is never generated; the target is also EXCLUDE_FROM_ALL. After supplying the upstream submodule sources (GoogleTest v1.17.0 official release tarball) into third_party/googletest, the target builds and the suite runs for real."
    command: "cmake --build build/Release --target unittest_bin -j2 && ./build/Release/test/unittest_bin"
    result: "已实测：138 用例 / 137 通过 / 1 失败（UtilsTest.Timezone —— 本设备缺 cctz 时区数据库 /usr/share/zoneinfo，非适配缺陷）。控制台日志本地存档 reports/upstream-gtest-1.17.0.log（reports/ 按 .gitignore 不入库），复现步骤与根因见 reports/test-report.md §2。"

test_package_tests:
  - file: test.c
    description: "Packaged-artifact check: the 11 extra modules are AArch64 ET_DYN objects exporting ZNCModuleEntry with undefined core symbols left for the znc host, and lib/znc contains exactly those 11 .so files."
    command: "./test_znc_extra <znc-extra package>/lib/znc"

assertion_count: 34
