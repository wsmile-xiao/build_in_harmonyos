software: zangband
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "2.7.5pre1"

# 编译状态: published | built | failed | archived
status: built

# 编译日期 (YYYY-MM-DD)
build_date: "2026-09-30"

# Conan 引用
conan_ref: "zangband/2.7.5pre1"

# 源码信息
source:
  url: "https://downloads.sourceforge.net/zangband/zangband-2.7.5pre1.tar.gz"
  sha256: "86871739825a292b9def28ec0dea698fb0d34949c7fab071901c231274be4c44"
  tar_format: tar.gz

# 构建配置
build:
  system: makefile
  configure_options:
    - "--with-x11=no"
    - "--with-gtk=no"
    - "--with-tcltk=no"
    - "--with-setgid=no"
  dependencies:
    - "ncurses/6.6"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-makefile-host-tolua.patch"
  - "0002-stop-autoconf-regeneration.patch"

knowledge_gained:
  - "OHOS SDK sysroot 仅提供运行期 stub libncurses.so.6（无头文件/无链接符号），ncurses 必须由 Conan 依赖提供"
  - "旧式 autoconf(configure.in) 的 AC_CHECK_SIZEOF 等需运行探测程序，交叉编译必须用 --cache-file 注入结果"
  - "构建期代码生成器(tolua)必须用构建机编译器单独编译，不能链接成目标架构二进制"
  - "tolua 由 argv[0] 推导 .lua 脚本目录，脚本缺失时静默返回 0，会让 make 误判成功"
  - "configure.in 里 AC_CHECK_LIB([z],[main]) 会引入无用的 -lz 运行期依赖，应移除"
