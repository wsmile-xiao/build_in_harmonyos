test_package_tests:
  - file: test.sh
    description: "zangband -h smoke test: real binary launches and reports the ncurses/GCU port"
    command: "sh test.sh <package>/bin/zangband"
  - file: zb_e2e_consumer.c
    description: >-
      消费者端到端用例（链接游戏自身 83 个目标文件，非桩函数）：init_file_paths()
      建立运行期目录、经游戏自身 path_make() 校验 lib/edit 下 9 个真实游戏数据库
      文件与 lib/script/init.lua 可读且非空、并核对 misc.txt 真实内容。
      5 条断言全部由 check() 依据真实返回值判定，无无条件打印的 PASS。
      qemu 与 DAYU200 真机均 5/5 通过（退出码 0）。
    command: "(编译并运行 zb_e2e_consumer，见 reports/test-report.md)"

assertion_count: 5
