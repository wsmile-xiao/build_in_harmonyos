# conandata.yml — zangband 2.7.5pre1
# 上游：Zangband（基于 Angband 的 roguelike，SourceForge 官方发布物）

sources:
  url: "https://downloads.sourceforge.net/zangband/zangband-2.7.5pre1.tar.gz"
  sha256: "86871739825a292b9def28ec0dea698fb0d34949c7fab071901c231274be4c44"

patches:
  - patch_file: "patches/0001-makefile-host-tolua.patch"
    patch_description: >-
      让 make 用构建机编译器构建 tolua，并把生成器指向主机版二进制。
      tolua 是构建期代码生成器（把 src/l-*.pkg 生成 src/l-*.c）；交叉编译后它是
      aarch64 二进制，在构建机上无法执行（Error loading shared library libz.so /
      Error 127）。补丁做三件事：① tolua 自身的构建规则改用
      $(BUILD_CC)/$(BUILD_CFLAGS)/$(BUILD_LIBS)；② TOLUA 变量改为引用
      $(TOLUA_HOST)（由配方在 make 命令行传入）；③ 去掉 l-*.c 规则对
      src/lua/tolua 的依赖，避免它被目标链接规则重新生成。
      另注：tolua.c 由 argv[0] 推导 .lua 脚本目录，所以主机版必须放在 src/lua/
      内（配方负责放置），否则脚本缺失时会静默返回 0，make 会误判成功。
      注：本补丁只改构建系统行为，不改动上游任何游戏源码。
    patch_type: "portability"
