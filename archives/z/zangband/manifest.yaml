software: zangband
display: "Zangband"
description: "Roguelike computer role playing game based on Angband"
category: gfx
homepage: "https://sourceforge.net/projects/zangband/"
license: "Zangband License"
build_system: makefile

ohos_adaptation:
  key_points:
    - "终端前端使用 ncurses(GNU Curses) 端口，链接仓库 ncurses/6.6 静态宽字符库 libncursesw.a"
    - "OHOS SDK sysroot 只有运行期 stub libncurses.so.6（无 curses.h 与链接符号），必须依赖 Conan ncurses"
    - "旧式 autoconf 的 AC_CHECK_SIZEOF/AC_FUNC_* 需运行探测程序，交叉编译下用 --cache-file 注入已知值"
    - "src/lua/tolua 是构建期主机工具，须用构建机编译器编译并置于 src/lua/ 内（由 argv[0] 定位 lua 脚本）"
  common_dependencies:
    - ncurses/6.6

versions:
  "2.7.5pre1":
    status: built
    build_date: "2026-09-30"
    conan_ref: "zangband/2.7.5pre1"
