# 版本级 manifest — zsdx 1.12.3
# 遵循 ARCHIVE-SPEC v3.0

version: "1.12.3"
software: "zsdx"

# 编译状态
status: built

build_date: "2026-09-30"

# 构建系统：上游 project(ZSDX NONE)，零编译单元；唯一构建动作是把 data/ 打成
# data.solarus zip（复刻 make_zip 语义，python zipfile 标准库实现）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://gitlab.com/solarus-games/games/zsdx/-/archive/v1.12.3/zsdx-v1.12.3.tar.gz"
  sha256: "06a23aba5cc3d1c617fcc3eb7add1c418e8eb3fad06441f847f1217820ee0f93"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom

  configure_options: []

  # 纯数据包：不声明对 Solarus 引擎的 conan 依赖（官方仓无 solarus recipe；
  # 引擎只影响"实跑游戏"，不影响数据包构建/交付）
  dependencies: []

  # 上游 project(ZSDX NONE)：无 C/C++ 编译单元
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试
# ============================================================

# 上游无自有测试套件（.gitlab-ci.yml 仅 include 引擎级 quests.yml；
# 无 tests/、无 test 地图），详见 notes.md 的 NO_UPSTREAM_TESTS 记录
upstream_tests: []
test_package: "test_package/test_zsdx.py"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Solarus quest 数据包的发布物 = data/ 目录的 zip（data.solarus），条目必须以 data/ 为根（make_zip: cd data && zip -r ../../data.solarus *）；带顶层前缀目录会让引擎加载失败"
  - "纯数据包 build() 用 python zipfile 标准库替代外部 zip 命令：os.walk 显式收集（含点文件），arcname 统一 POSIX 斜杠，不依赖设备 zip 的存在性"
  - "zsdx 无自有测试：.gitlab-ci.yml 只是 include 引擎仓 solarus-devops 的 quests.yml（预编译 Solarus + Xvfb 运行时测试），且 v1.12.3 归档 data/maps 下无 test_* 地图，map 测试循环为空"
