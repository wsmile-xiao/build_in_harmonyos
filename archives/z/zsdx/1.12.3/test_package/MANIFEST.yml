# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: zsdx/1.12.3
homepage: "https://gitlab.com/solarus-games/games/zsdx"

# 上游测试情况（NO_UPSTREAM_TESTS，证据详见 ../notes.md）：
# zsdx 仓库根 .gitlab-ci.yml 全文仅 2 行，include
# https://gitlab.com/solarus-games/solarus-devops/raw/master/gitlab/quests.yml
# ——那是引擎级运行时测试（wget 下载预编译 Solarus linux 工件 + Xvfb +
# solarus-test-initialization / 逐地图 solarus-test-lua-map），不是 zsdx 自身
# 的测试套件：
# - 仓库无 tests/ 目录、无 pytest/ctest/make check 入口；
# - v1.12.3 归档实测 `find data/maps -iname "test_*"` = 0 个文件（data/maps 下
#   全是游戏地图 N.dat/N.lua），quests.yml 的 map 测试循环对 zsdx 为空；
# - 仅剩的 solarus-test-initialization 依赖 linux x86 预编译引擎 + Xvfb，
#   OHOS CI 不可复现（官方仓亦无 solarus 引擎 recipe）。
upstream_test_in_build: false
upstream_check_command: ""
upstream_tests: []

# test_package 消费者断言（真实数据完整性验证，OHOS 目标执行）
test_package_tests:
  - file: test_zsdx.py
    description: >
      对安装出的 data.solarus 做真实验证：全量 CRC 完整性校验（逐成员解压）；
      1143 条目数与 lua/dat/png/ogg 类型学计数逐一等于上游 v1.12.3 data/ 树；
      Solarus 根条目契约（main.lua/quest.dat/project_db.dat 在 zip 根，无
      data/ 或 zsdx- 目录前缀）；quest.dat 的 quest_version=1.12.3 与
      solarus_version=1.6；解压总量 41677322 字节；licenses/license.txt
      复合许可声明存在。
    command: "python3 test_zsdx.py <package-folder>"

# 断言总数
assertion_count: 18
