# test_package/MANIFEST.yml — zizmor 1.27.0 上游测试声明（R51 三步法申报）
# CI 脚本 (ci/conan/build_and_test.sh L0e) 强制要求此文件存在。

package: zizmor/1.27.0
homepage: "https://github.com/zizmorcore/zizmor"

# 上游测试命令（cargo 工作区：15 个测试二进制 = 单元 + 集成）
upstream_check_command: "cargo test --release --locked --target aarch64-unknown-linux-ohos --features schema --lib --bins --tests"
upstream_test_command: "cargo test --release --locked --target aarch64-unknown-linux-ohos --features schema --lib --bins --tests"

# 上游测试在主配方 build() 阶段执行（patched 源码在本配方内），计数持久化到
# package/res/upstream_test_result.json，test_package 据此复发
# HMBS_UPSTREAM_TEST_RESULT（ali/0.8.0 先例：缓存命中时 build() 被跳过）。
upstream_test_in_build: true

upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 zizmor 1.27.0 存在完整测试套件（cargo workspace，8 个 crate），
  15 个测试二进制在本机真机（HarmonyOS PC / aarch64-unknown-linux-ohos）完整执行，
  实测 562 passed / 0 failed / 35 ignored（无漏测、无隐藏跳过）。
  逐目标计数（取自 cargo 框架真实 "test result:" 行）：
    1. github-actions-expressions lib 单测            45 passed
    2. github-actions-expressions tests/languageservices_kat.rs  1 passed
    3. github-actions-models lib 单测                 17 passed
    4. github-actions-models tests/test_action.rs      2 passed
    5. github-actions-models tests/test_dependabot_v2.rs 5 passed
    6. github-actions-models tests/test_workflow.rs    3 passed
    7. subfeature lib 单测                             1 passed
    8. tree-sitter-iter lib 单测                       1 passed
    9. yamlpatch lib 单测                              0 passed
   10. yamlpatch tests/unit_tests.rs                 104 passed (3 ignored)
   11. yamlpath lib 单测                             13 passed
   12. yamlpath tests/integration_test.rs              1 passed
   13. zizmor bin 单测（crates/zizmor/src/**）        127 passed (1 ignored)
   14. zizmor tests/integration/main.rs               240 passed (31 ignored)
   15. zizmor-sarif lib 单测                           2 passed
  合计 562 passed / 0 failed / 35 ignored。

  门控用例（以 feature 开关，未在本包门禁内执行）：
    * gh-token-tests / online-tests（由 crater-tests 传递启用）：21 个用例需要真实
      GH_TOKEN 与 GitHub API（标记解析、tag→commit 解析），本机与 CI worker 均无
      token 注入；单独以上游 CI 特性组合运行时的失败清单见
      reports/upstream-tests.md。
    * tty-tests：需要 expect/unbuffer，本机与 CI worker 均未安装。
    * crater-tests：需要联网克隆上游仓库。

  doc-tests：发布的 rust-toolchain/1.97.1 制品包不含 rustdoc 可执行文件
  （仅 share/man/man1/rustdoc.1），cargo 无法 spawn rustdoc，故以
  --lib --bins --tests 排除该阶段；不影响任何真实用例（同族 Rust 配方 alass/
  martin/argc 判定一致）。

  适配期修复的两处平台问题（详见 1.27.0/notes.md 与 patches/0001）：
    ① jemalloc（tikv-jemallocator）在 HarmonyOS 上的线程缓存/TSD 析构路径
       SIGSEGV —— 修复前 zizmor 二进制审计路径 10/10 崩溃、zizmor bin 单测
       93/148 崩溃；改为 OHOS 使用平台分配器后全部通过。
    ② aws-lc-sys 经 CMake 构建时因 OHOS uname=HarmonyOS 导致
       CMAKE_SYSTEM_PROCESSOR 为空 → ARCH=generic → 预生成汇编不入库 →
       链接期 ChaCha20_ctr32_neon / aes_hw_encrypt / bignum_copy_row_from_table_*
       等符号未定义；由配方注入 CMAKE_TOOLCHAIN_FILE（Linux/aarch64）修复。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者冒烟测试：8 个用例（C1-C5 上游 CLI 语义 + H1-H3 鸿蒙特有用例），真实执行打包的 zizmor 二进制"
    command: "sh test.sh"

# 鸿蒙特有测试 (HarmonyOS-specific)：断言产物在本平台可用所必需的特性
harmonyos_specific_tests:
  - name: "H1 OHOS target artifact (AArch64 ELF)"
    file: test.sh
    description: "readelf 断言打包产物为 AArch64 ELF（OHOS armv8 目标）"
  - name: "H2 stable exit path on OHOS"
    file: test.sh
    description: "连续 6 次离线审计必须全部 rc=0，不出现 139(SIGSEGV)——本适配点（排除 jemalloc、改用平台分配器）的回归护栏"
  - name: "H3 HarmonyOS sample workflow audit"
    file: test.sh
    description: "鸿蒙专属样例（OHOS_PC_UPSTREAM_sample 标记）端到端审计，命中 unpinned-uses 且路径正确渲染"
harmonyos_specific_test_count: 3
