# conandata.yml — zizmor 1.27.0
#
# 官方源（R39）：上游仓库 zizmorcore/zizmor，tag v1.27.0。
# 该版本未发布到 crates.io（1.26.1 → 1.28.0 跳版），源码唯一来源为
# GitHub archive tarball。镜像回退由 CI（ci/conan/build_and_test.sh
# get_mirrors）自动追加，此处只写官方 URL。
sources:
  url: "https://github.com/zizmorcore/zizmor/archive/refs/tags/v1.27.0.tar.gz"
  sha256: "2ef4347065e91b9a07c337d7161085b494866b5239605440b457cdcda4318136"

# cargo 运行期共享库：cargo 1.97 动态链接 libssl.so/libcrypto.so/libz.so，且需要
# 系统 OpenSSL 3.0 未导出的符号。使用 Harmonybrew OHOS 预编译 bottle
# （below/argc/alass 先例），sha256 已核验。仅用于构建期 cargo 自身运行，
# 不进包、不写入共享前缀（R49）。
cargo_runtime:
  - url: "https://harmonybrew.atomgit.com/bottles/openssl%403-3.6.4.arm64_ohos.bottle.tar.gz"
    sha256: "e1be73c6c68e29c33ff43761045e43e23e7c369f0fb1a24f40e226ec5cb28f98"
  - url: "https://harmonybrew.atomgit.com/bottles/zlib-ng-compat-2.3.3_1.arm64_ohos.bottle.tar.gz"
    sha256: "1c17a31f8104701bce6b471af8dbbd14bb67d16a504eec087018feb05493a430"

patches:
  - patch_file: "patches/0001-ohos-use-system-allocator.patch"
    patch_description: >-
      OHOS uses the platform allocator instead of tikv-jemallocator: on
      HarmonyOS jemalloc's thread-cache/TSD teardown path SIGSEGVs (reproduced
      at process exit, at tokio runtime shutdown, and whenever libtest reaps a
      test thread), breaking both the CLI and the upstream test binaries.
      The dependency table drops the ohos target and the matching
      #[global_allocator] cfg is disabled for it. No zizmor logic changes.
    patch_type: "portability"
