# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "jemalloc（tikv-jemallocator）在 HarmonyOS 上的线程缓存/TSD 析构路径 SIGSEGV：进程退出、tokio 多线程运行时析构、libtest 回收测试线程三个场景均可复现；禁用 jemalloc 后全部消失，disable_initial_exec_tls 不足以免除（知识草稿 E-zizmor-jemalloc）"
  - "aws-lc-sys 0.41 经 CMake 构建：OHOS uname=HarmonyOS → CMake 无 Platform/HarmonyOS.cmake → CMAKE_SYSTEM_PROCESSOR 为空 → aws-lc 判 ARCH=generic 并输出 'Detected generic linux platform. No assembly files will be included.' → 预生成汇编（generated-src/linux-aarch64）不入目标文件 → 链接期 asm 符号未定义；aws-lc-sys 支持由环境提供 CMAKE_TOOLCHAIN_FILE（见 builder/cmake_builder.rs configure_open_harmony）"
  - "Rust 集成快照 e2e::issue_1745 依赖源码树是 Git 工作树（zizmor registry/input.rs::discover_root 向上查找 .git 目录）；发行 tarball 不含 .git，需在 build() 中补 .git 标记目录，否则路径渲染快照不匹配"
  - "构建树路径含空格会击穿 jemalloc 的 autoconf configure（'failed to load site script <path 前半>'）——本机工作区路径 'lan workspace' 含空格，构建树须放无空格路径"
  - "HMDFS + umask 077 + mktemp -d 生成的 drwx--S--- 目录对当前进程不可写（E011/E114）；crate 自带的 autoconf configure（tikv-jemalloc-sys）同样会踩中"

patch_generation:
  method: per-file-difflib
  patches_count: 1
