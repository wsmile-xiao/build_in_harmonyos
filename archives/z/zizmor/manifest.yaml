# 软件级 manifest — zizmor
# 遵循 ARCHIVE-SPEC v2.0

software: zizmor
display: "zizmor"
description: "GitHub Actions 工作流静态安全分析工具 — 审计 workflow/action/dependabot 配置的安全问题（未固定的 action 引用、模板注入、缓存投毒、过宽权限、凭据持久化等）"
category: security
homepage: "https://github.com/zizmorcore/zizmor"
license: MIT
build_system: cargo

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Rust Cargo workspace（8 个成员 crate），cargo build --release --target aarch64-unknown-linux-ohos，无 configure 步骤"
    - "tool_requires rust-toolchain/1.97.1（制品仓基础设施包）；Conan 包内 ELF 无执行位，须复制 + binary-sign-tool 自签名（below/0.11.0 先例）"
    - "cargo 1.97 运行期动态链接 libssl/libcrypto/libz，用 Harmonybrew OHOS bottle 注入 LD_LIBRARY_PATH（不写共享前缀，R49）"
    - "tikv-jemallocator（jemalloc）在 HarmonyOS 上线程缓存/TSD 析构路径 SIGSEGV → OHOS 改用平台分配器（patches/0001）"
    - "aws-lc-sys 经 CMake 构建：OHOS uname=HarmonyOS 导致 CMAKE_SYSTEM_PROCESSOR 为空 → ARCH=generic → 预生成汇编不入库 → 链接期 asm 符号未定义；配方注入最小 CMAKE_TOOLCHAIN_FILE（Linux/aarch64）修复"
    - "上游集成快照 e2e::issue_1745 依赖源码树是 Git 工作树（.git 目录）；tarball 构建时由 build() 补 .git 标记"
    - "构建树路径不能含空格（jemalloc autoconf configure 会在含空格路径上失败）"
    - "OHOS /tmp 只读，构建与测试需用可写 TMPDIR"
  common_dependencies:
    - rust-toolchain

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.27.0":
    status: built
    build_date: "2026-10-02"
    published_as: zizmor/1.27.0
