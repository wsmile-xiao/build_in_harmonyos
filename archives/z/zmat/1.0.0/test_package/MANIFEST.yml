# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: zmat/1.0.0
homepage: "https://github.com/NeuroJSON/zmat"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# zmat 使用纯 Makefile，无 make check 目标；上游测试分布在 test/（4 个 MATLAB/Octave
# .m 测试脚本）、python/tests（pytest）与 example/c/testzmat.c（C 示例）。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: example/c/testzmat.c
    source: zmat-1.0.0/example/c/testzmat.c
    description: "上游官方 C 示例：zlib 压缩 + base64 编码/解码 + 解压 round-trip"
    command: "./testzmat_upstream"
  - file: test/test_zmat_roundtrip.m
    source: zmat-1.0.0/test/test_zmat_roundtrip.m
    description: "MATLAB/Octave round-trip 测试（依赖 Octave，OHOS 环境未运行）"
    command: "octave --eval test_zmat_roundtrip"
  - file: test/test_zmat_field.m
    source: zmat-1.0.0/test/test_zmat_field.m
    description: "MATLAB/Octave struct field 压缩测试（依赖 Octave，OHOS 环境未运行）"
    command: "octave --eval test_zmat_field"
  - file: test/test_zmat.m
    source: zmat-1.0.0/test/test_zmat.m
    description: "MATLAB/Octave 主测试（依赖 Octave，OHOS 环境未运行）"
    command: "octave --eval test_zmat"
  - file: python/tests/test_zmat.py
    source: zmat-1.0.0/python/tests/test_zmat.py
    description: "Python 绑定 pytest 测试（依赖 Python 打包，不在本 CI 范围）"
    command: "pytest python/tests"

# test_package 中自带的测试（消费者视角验证，R34：实质调用 zmat API）
test_package_tests:
  - file: test.c
    description: "实质调用 zmat_run/zmat_encode/zmat_decode，对 12 种压缩后端逐一 round-trip 验证字节一致"
    command: "./test_zmat"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13