# 版本级 manifest —— zarchive 0.1.2
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.2"
software: zarchive

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-14"
build_system: cmake

source:
  url: "https://github.com/Exzap/ZArchive/archive/refs/tags/v0.1.2.tar.gz"
  sha256: "676e2c6eb9a2aeece702a53f39ecf8f057bc4e032071ec6ee23e5ac6e358ceed"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF（R26 系统同名库默认静态）"
    - "CMAKE_FIND_ROOT_PATH=<generators 目录>（OHOS conan_toolchain 交叉模式把 find_package 限制在 CMAKE_FIND_ROOT_PATH 且 MODE_PACKAGE=ONLY，不指过去 CMakeDeps 生成的 zstd 配置就不可见）"
    - "CMAKE_FIND_PACKAGE_PREFER_CONFIG=TRUE（让上游 Findzstd.cmake 的 find_package(zstd CONFIG) 命中 conan 的 zstd-config.cmake）"
    - "cppstd 保持 profile 的 17，上游 target_compile_features(zarchive PUBLIC cxx_std_20) 由 CMake 对目标取最高标准"
  dependencies:
    - zstd/1.5.7.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-Findzstd-accept-conan-target-name.patch"

knowledge_gained:
  - "conan 的 zstd 包只导出 zstd::libzstd（cmake_target_name），而上游 Findzstd.cmake 的名字归一化只认 zstd::zstd / zstd::libzstd_static / zstd::libzstd_shared，两者对不上时 CMake 配置期报 'links to target zstd::zstd but the target was not found'；在该 find 模块既有的归一化链条上补一支即可，不必改 CMakeLists.txt"
  - "OHOS 的 conan_toolchain 交叉模式把 find_package 限制在 CMAKE_FIND_ROOT_PATH 且 MODE_PACKAGE=ONLY：CMakeDeps 生成的 <pkg>-config.cmake 位于 generators 目录，必须把它加入 CMAKE_FIND_ROOT_PATH，否则上游的 find_package(CONFIG) 静默落空并退到 pkg-config 分支（而设备没有 pkg-config）"
  - "上游无测试套件的库，test_package 要覆盖到交付形态的每一条真实链路：zarchive 既有库又有 CLI，就用 C++ 消费者测试（打包→读回→逐字节比对）+ shell 测试（已安装 CLI 的打包/解包/逐字节 cmp/失败码）两条都跑，归档经 zstd 压缩故往返成功同时证明依赖传播正确"
