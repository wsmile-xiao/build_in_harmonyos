# conandata.yml — zarchive 0.1.2
# 官方源：上游仓库 Exzap/ZArchive 自己的 tag v0.1.2（GitHub API 实证：非 fork、
# 未归档、language=C++、tag 存在）。
# sha256 实测自该官方 tarball（本机 shasum -a 256，与设备侧实拉逐字节一致）
sources:
  url: https://github.com/Exzap/ZArchive/archive/refs/tags/v0.1.2.tar.gz
  sha256: 676e2c6eb9a2aeece702a53f39ecf8f057bc4e032071ec6ee23e5ac6e358ceed

patches:
  # 上游 cmake/Findzstd.cmake 的职责是"把各种 zstd 查找结果统一到 zstd::zstd
  # 这个名字"：先 find_package(zstd CONFIG)，命中后若 zstd::zstd 不存在，就看
  # zstd::libzstd_static / zstd::libzstd_shared 哪个在，建一个 ALIAS。
  # 但 conan 的 zstd/1.5.7.1 包只导出 zstd::libzstd（其 conanfile 的
  # package_info 设 cmake_target_name="zstd::libzstd"），两个分支都不命中，
  # 于是 zstd::zstd 始终不存在，CMakeLists.txt 里
  # `target_link_libraries(zarchive PRIVATE zstd::zstd)` 在配置期报
  # "Target ... links to target 'zstd::zstd' but the target was not found"。
  # 修法是在该文件既有的名字归一化链条上补一支（正是这个文件存在的目的），
  # 不改 CMakeLists.txt、不改链接语义、不影响非 conan 构建。
  "0.1.2":
    - patch_file: "patches/0001-cmake-Findzstd-accept-conan-target-name.patch"
      patch_description: "Extend the target-name normalisation in cmake/Findzstd.cmake with a zstd::libzstd branch, the name Conan's zstd package exports"
      patch_type: "portability"
