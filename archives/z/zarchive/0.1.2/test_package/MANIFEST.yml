# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: zarchive/0.1.2
homepage: "https://github.com/Exzap/ZArchive"

# 上游**没有**测试套件：tarball 内不存在 tests/ 或 test/ 目录、没有 *test*/*spec*
# 命名的源文件、CMakeLists.txt 无 include(CTest)/enable_testing()/add_test()，
# 也没有 ctest 注册项（2026-09-14 对 v0.1.2 tarball 实测）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_zarchive.cpp
    description: >-
      消费者功能测试（库级）：用 ZArchiveWriter 把目录树打包成归档，
      再用 ZArchiveReader 读回并断言 —— 文件查找、IsFile/IsDirectory、
      文件大小、整文件与带偏移量读取的字节级一致性（含 256 个字节值全样本
      与内嵌 NUL 的 1 KiB 数据）、目录项计数、缺失路径返回
      ZARCHIVE_INVALID_NODE、以及库侧解出的文件与磁盘原文件逐字节相同。
      归档全程经 zstd 压缩，故往返成功同时证明 zstd 依赖已正确传播到消费者。
      共 25 项断言，失败即非零退出。
    command: "./test_zarchive"
  - file: test_package/test_zarchive_cli.sh
    description: >-
      消费者功能测试（CLI 级）：对安装后的 zarchive 可执行文件做真实调用——
      无参数打印 usage、打包目录、归档非空、解包到新目录、三个文件（含
      4 KiB 压缩样本）逐字节 cmp 相同、解不存在的归档必须以非零码失败。
      共 7 项断言。
    command: "sh test_zarchive_cli.sh <pkg>/bin/zarchive"

# 测试断言总数（近似值，用于质量评估）：test_package 库级 25 项 + CLI 级 7 项
assertion_count: 32
