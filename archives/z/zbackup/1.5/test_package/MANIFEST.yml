# Upstream test inventory and Conan consumer tests for zbackup 1.5.
package: zbackup/1.5
homepage: "https://github.com/davidbartonau/zbackup"

# Upstream Travis CI configures and builds the program; the root CMake project
# does not register these tests with CTest or provide a make check target.
upstream_check_command: ".travis.yml: cmake . && make (build only)"
upstream_test_in_build: false
upstream_test_command: "See each upstream_tests command; all four suites were run on Ubuntu 24.04 WSL x86_64."

upstream_tests:
  - name: "bundle unit test"
    source: "tests/bundle/test_bundle.cc and tests/bundle/bundle.pro"
    command: "Build with Qt 5/qmake, temporary target/source/API compatibility overlay, then run ./bundle."
    expected: "passed"
    reason: "PASS (exit 0) on Ubuntu 24.04 WSL x86_64; upstream .cc and .pro files unchanged. Temporary build overlay addressed the empty TARGET, generated protobuf source, and 1.5 release API/source-list differences; overlay not submitted."
  - name: "encrypted_file unit test"
    source: "tests/encrypted_file/test_encrypted_file.cc and tests/encrypted_file/encrypted_file.pro"
    command: "Build with Qt 5/qmake, temporary C++14/API compatibility overlay, then run ./encrypted_file."
    expected: "passed"
    reason: "PASS (exit 0) on Ubuntu 24.04 WSL x86_64; upstream .cc and .pro files unchanged; temporary compatibility overlay not submitted."
  - name: "rolling_hash unit test"
    source: "tests/rolling_hash/test_rolling_hash.cc and tests/rolling_hash/rolling_hash.pro"
    command: "Build with Qt 5/qmake, temporary C++14/API compatibility overlay, then run ./rolling_hash."
    expected: "passed"
    reason: "PASS (exit 0) on Ubuntu 24.04 WSL x86_64; upstream .cc and .pro files unchanged; temporary compatibility overlay not submitted."
  - name: "Python regression stress test"
    source: "tests/regression/regression.py and tests/regression/README.md"
    command: "python3 tests/regression/regression.py --zbackup <binary> --tmp <writable-dir> --samples <100-file-corpus> --key <password-file> --seed 123 --loops 80 --add-per-loop 60 --delete-per-loop 50 --log-level 0"
    expected: "passed"
    reason: "PASS (exit 0); all 80 loops completed using 100 varied deterministic binary samples (551,795 bytes total) and encrypted backups."

test_package_tests:
  - file: "test_zbackup.py"
    description: "Checks the zbackup 1.5 -O help entry point, then runs plain and password-encrypted repository initialization, backup, restore, and SHA-256 comparison on a deterministic 1,167,360-byte payload."
    command: "python3 test_zbackup.py <package>/bin/zbackup"
  - file: "test_zbackup.py"
    description: "On a native OHOS profile, places TMPDIR on a writable HarmonyOS temporary path, makes the repository's default tmp path unusable, then verifies backup/restore and temporary-file cleanup."
    command: "python3 test_zbackup.py <package>/bin/zbackup --harmonyos"

assertion_count: 14
