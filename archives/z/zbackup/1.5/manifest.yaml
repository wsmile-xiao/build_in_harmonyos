version: "1.5"
software: zbackup
status: built
build_date: "2026-09-23"
build_system: cmake

source:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/z/zbackup/zbackup_1.5.orig.tar.gz"
  sha256: "344fed4491cb52b6712b03c1d8b1bcf994cfc578ad422cb644502e171585a8f7"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON"
    - "protobuf_MODULE_COMPATIBLE=ON"
    - "CMAKE_DISABLE_FIND_PACKAGE_LibUnwind=ON"
    - "ZBACKUP_VERSION=1.5"
    - "CMakeToolchain extra_cxxflags=-Wno-error=dynamic-exception-spec"
  dependencies:
    - openssl/3.0.16
    - protobuf/3.17.3
    - zlib/1.3.2
    - xz/5.8.3
    - "lzo/2.10 (optional: with_lzo=True)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-configured-version-fallback.patch"
  - "0002-sptr-use-count-value.patch"
  - "0003-openssl-cmakedeps-variable-compat.patch"
knowledge_gained: []
