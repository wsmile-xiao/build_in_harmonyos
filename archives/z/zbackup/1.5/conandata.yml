# The archive is Debian's pristine zbackup 1.5 upstream source (Debian .orig);
# this official Ubuntu archive mirror carries the same verified source bytes.
sources:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/z/zbackup/zbackup_1.5.orig.tar.gz"
  sha256: "344fed4491cb52b6712b03c1d8b1bcf994cfc578ad422cb644502e171585a8f7"

patches:
  "1.5":
    - patch_file: "patches/0001-cmake-configured-version-fallback.patch"
      patch_description: "Preserve the Conan package version when source archives lack Git metadata"
    - patch_file: "patches/0002-sptr-use-count-value.patch"
      patch_description: "Return the reference count value instead of its pointer"
    - patch_file: "patches/0003-openssl-cmakedeps-variable-compat.patch"
      patch_description: "Map Conan CMakeDeps OpenSSL variables to the legacy CMake names"
