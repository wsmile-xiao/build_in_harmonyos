    command: "./to-run/zuo tests/macro-hygienic.zuo"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试：--help、hello.zuo（解释器+模块系统）、filetest.zuo（fd 文件 I/O 与字符串/算术原语）"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# grep -ho "(check[a-z-]*" tests/*.zuo | wc -l = 1339（含 harness 定义与包装）
assertion_count: 1339
