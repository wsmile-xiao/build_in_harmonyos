  - file: tests/c.zuo
    source: zuo-1.12/tests
    description: "C 编译器接口（filesystem 之后显式补跑）"
    command: "./to-run/zuo tests/c.zuo"
  - file: tests/cycle.zuo
    source: zuo-1.12/tests
    description: "循环依赖检测（filesystem 之后显式补跑）"
    command: "./to-run/zuo tests/cycle.zuo"
  - file: tests/build.zuo
    source: zuo-1.12/tests
    description: "build.zuo 构建规则引擎（filesystem 之后显式补跑）"
