# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: zuo/1.12
homepage: "https://github.com/racket/zuo"

# 上游测试命令（上游 Makefile.in 的 check target: ./zuo . to-run/zuo && to-run/zuo . check；
# release tarball 的 main.zuo 为未替换的欢迎占位文件，故经 tarball 自带 build.zuo 重路由，
# 语义与上游 Makefile.in 完全一致。conanfile.py build() 内即按此两步执行）
upstream_check_command: "./zuo build.zuo to-run/zuo && ./zuo build.zuo check"

# conanfile.py build() 方法中是否已集成上游测试
# （build() Step 4: make check（Makefile check target 重路由至上述两步）；
#   build() Step 5: filesystem 之后的 11 个模块逐一显式补跑）
upstream_test_in_build: true
upstream_test_command: "make check（→ ./zuo build.zuo to-run/zuo && ./zuo build.zuo check）+ 11 模块补跑"

# 上游实际运行的测试程序
# 上游 tests/main.zuo 依次 require 的 29 个测试模块（与上游逐字核对）。
# 每个 check* 断言失败即 raise → 非零退出，故 exit 0 即该模块全部断言通过。
# 注：filesystem 模块的 symlink/readlink 子项受 HarmonyOS SELinux 平台限制
# （自编译 ELF 调 symlink(2) 被 EACCES 拒绝，系统签名二进制不受限），
# 详见版本级 notes.md 的三重证据；门禁仅容忍该特定失败模式，其余任何失败均构建失败。
upstream_tests:
  - file: tests/equal.zuo
    source: zuo-1.12/tests
    description: "eq?/eqv?/equal? 等价关系"
    command: "./zuo build.zuo check"
  - file: tests/integer.zuo
    source: zuo-1.12/tests
    description: "整数算术/谓词/排序/位运算（alert: predicate/arithmetic/ordering/bitwise）"
    command: "./zuo build.zuo check"
  - file: tests/pair.zuo
    source: zuo-1.12/tests
    description: "序对与列表操作"
    command: "./zuo build.zuo check"
  - file: tests/string.zuo
    source: zuo-1.12/tests
    description: "字符串原语"
    command: "./zuo build.zuo check"
  - file: tests/symbol.zuo
    source: zuo-1.12/tests
    description: "符号与符号表"
    command: "./zuo build.zuo check"
  - file: tests/hash.zuo
    source: zuo-1.12/tests
    description: "哈希表"
    command: "./zuo build.zuo check"
  - file: tests/procedure.zuo
    source: zuo-1.12/tests
    description: "过程/lambda/apply"
    command: "./zuo build.zuo check"
  - file: tests/path.zuo
    source: zuo-1.12/tests
    description: "路径解析/合并/格式"
    command: "./zuo build.zuo check"
  - file: tests/opaque.zuo
    source: zuo-1.12/tests
    description: "不透明记录类型"
    command: "./zuo build.zuo check"
  - file: tests/variable.zuo
    source: zuo-1.12/tests
    description: "变量与词法作用域"
    command: "./zuo build.zuo check"
  - file: tests/module-path.zuo
    source: zuo-1.12/tests
    description: "模块路径解析"
    command: "./zuo build.zuo check"
  - file: tests/kernel.zuo
    source: zuo-1.12/tests
    description: "内核求值器"
    command: "./zuo build.zuo check"
  - file: tests/read+print.zuo
    source: zuo-1.12/tests
    description: "读取器与打印机"
    command: "./zuo build.zuo check"
  - file: tests/syntax.zuo
    source: zuo-1.12/tests
    description: "语法对象"
    command: "./zuo build.zuo check"
  - file: tests/syntax-hygienic.zuo
    source: zuo-1.12/tests
    description: "卫生语法展开"
    command: "./zuo build.zuo check"
  - file: tests/file-handle.zuo
    source: zuo-1.12/tests
    description: "文件句柄/端口 I/O"
    command: "./zuo build.zuo check"
  - file: tests/process.zuo
    source: zuo-1.12/tests
    description: "子进程"
    command: "./zuo build.zuo check"
  - file: tests/filesystem.zuo
    source: zuo-1.12/tests
    description: "目录/文件操作；symlink/readlink 子项受平台 SELinux 限制（见上注）"
    command: "./zuo build.zuo check"
  - file: tests/cleanable.zuo
    source: zuo-1.12/tests
    description: "临时目录清理（filesystem 之后显式补跑）"
    command: "./to-run/zuo tests/cleanable.zuo"
  - file: tests/image.zuo
