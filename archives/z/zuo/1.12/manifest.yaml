  cxx: clang++

patches_applied: []

knowledge_gained:
  - "zuo 无需 configure：直接编译 zuo.c 得到 bootstrap 解释器，再由 ./zuo build.zuo install 自举安装（写 Makefile 传入 prefix/CC/CFLAGS）"
  - "绕过 autotools config.status 即可规避 E129（HMDFS setgid 目录 + umask 077 导致 awk 临时文件 Permission denied）"
  - "DESTDIR 语义为 DESTDIR+prefix 拼接，staging 安装后由 package() 从 stage 目录拷贝"

# 上游测试三步法（R51）
upstream_tests:
  inventory: "tests/ 目录 44 个文件（30 个 .zuo 测试脚本 + harness 辅助框架）；tests/main.zuo（build.zuo 的 check target 入口）require 29 个测试套件"
  executed_command: "make check（→ ./zuo build.zuo to-run/zuo && ./zuo build.zuo check）；filesystem 之后的 11 个套件以 ./to-run/zuo tests/<名>.zuo 逐一套件补跑"
  total: 29
  passed: 28
  pass_rate: "96.6%"
  note: "filesystem 套件的目录/文件子项通过，symlink 子项被 HarmonyOS 平台拒绝（SELinux 禁止自编译二进制调 symlink(2)，实测最小 C 程序同样 EACCES，toybox ln 不受限）；该限制非 zuo 移植缺陷，已在 conanfile build() 中如实记录：make check 仅容忍该特定失败模式，其余 11 个套件显式补跑，任何其他失败均使 conan create 失败"
