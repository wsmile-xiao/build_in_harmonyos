# 软件级 manifest
# 文件位置: archives/z/zuo/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: zuo
display: "Zuo"
description: "极小 Racket/Scheme 解释器与类 make 构建工具，Racket 自举构建的基础组件"
category: build-tool
homepage: "https://github.com/racket/zuo"
license: Apache-2.0_OR_MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C 程序，无需 configure，直接编译 zuo.c 即得 bootstrap 解释器"
    - "自举安装：./zuo build.zuo install DESTDIR=<stage>，配置经 Makefile（prefix/CC/CFLAGS）传入"
    - "避免 autotools config.status，天然规避 E129 HMDFS umask 权限问题"
  common_dependencies: []

versions:
  "1.12":
    status: published
    build_date: 2026-09-20
