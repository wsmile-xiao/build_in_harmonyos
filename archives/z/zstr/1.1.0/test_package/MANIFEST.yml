# test_package/MANIFEST.yml — zstr 1.1.0
# 上游官方测试声明文件（CI L0e 硬门禁要求存在）

package: zstr/1.1.0
homepage: "https://github.com/mateidavid/zstr"

# 上游测试存在性：有。证据见 notes.md「上游测试审计」。
# tests/ 目录、ctest/gtest 均无；测试面 = examples/Makefile `test`
# 目标（.travis.yml 用 `make -C examples test` 运行），共 29 个
# diff 往返断言（ztxtpipe 5 + zpipe 6 + zc 18）。
upstream_check_command: "make -C examples test"

# conanfile.py build() 已用可移植 Python harness 全量执行上游 29 检查
#（相同二进制、相同输入、相同 diff 语义；见 notes.md）。
upstream_test_in_build: true
upstream_test_command: "portable harness replicating `make -C examples test` (29 diff checks)"

# 上游实际运行的测试程序
upstream_tests:
  - file: examples/ztxtpipe.cpp
    source: zstr-1.1.0/examples/ztxtpipe.cpp
    description: "解压往返 5 检查：明文直通、gzip/gzip-9 解压、拼接流解压"
    command: "./ztxtpipe (stdin -> stdout, diff vs origin)"
  - file: examples/zpipe.cpp
    source: zstr-1.1.0/examples/zpipe.cpp
    description: "解压往返 6 检查：同上 5 项 + 单层剥离 gzip(gzip(f))==gzip(f)"
    command: "./zpipe (stdin -> stdout, diff vs origin)"
  - file: examples/zc.cpp
    source: zstr-1.1.0/examples/zc.cpp
    description: "压缩/解压 18 检查：stdin/文件/-c 组合往返"
    command: "./zc [-c] [file/-] (diff vs origin, zcat 等价校验)"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_zstr.cpp
    description: "真实调用 zstr.hpp API：文件往返内容一致、压缩产物非空、内存往返内容一致、压缩 blob 非空"
    command: "./test_zstr"

# 测试断言总数（test_zstr.cpp 的 4 个真实断言，与 HMBS_TEST_PACKAGE_RESULT discovered=4 一致）
assertion_count: 4
