version: "2.0.0"
software: "zps"
status: built
build_date: "2026-09-23"
build_system: "cmake"

source:
  url: "https://github.com/orhun/zps/archive/refs/tags/2.0.0.tar.gz"
  sha256: "84fa627c7eec92df62ecae129fe30fc7d16e297f20a3d126b8c53d04a6c35c60"
  tar_format: tar.gz

build:
  system: cmake
  # conan CMakeToolchain 驱动（OHOS profile 提供 os=OHOS → linux-ohos 三元组），
  # 无自定义 toolchain 代码；以下为真实执行过的 cmake 参数。
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=<generators>/conan_toolchain.cmake"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_DEFAULT_CMP0091=NEW"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "conan 的 CMakeToolchain 把 os=OHOS 映射为 CMAKE_SYSTEM_NAME=HarmonyOS，而 OHOS 定制 cmake 只带 Platform/OHOS.cmake：本机 cmake 4.1.2 仅告警（System is unknown to cmake）后继续，configure/build/install 全部 exit 0，属预期行为，无需用 CMAKE_SYSTEM_NAME=Linux 规避（knowledge_ref: DRAFT-cmake-harmonyos-platform-soname-flag, DRAFT-eigen-3.4.1-cmake-harmonyos-warning-triage；关联 E140/E092）"
  - "HarmonyOS 打包必须对 bin/ 下 ELF 重新自签名（llvm-objcopy --remove-section .codesign + binary-sign-tool -selfSign 1），且 binary-sign-tool 会抹掉执行位，必须补 chmod 0755，否则 conan test 报 Permission denied（knowledge_ref: E077 四步重签）"
  - "上游测试入口含 gcov/覆盖率步骤时，OHOS 无 GNU 工具链（无 gcc/gcov）→ 该步骤记 NA、不进分母、不判 FAIL；上游脚本因此的清理报错会让脚本退出码非 0，须把「脚本退出码」与「功能用例结果」解耦归因 —— 该处置属既有惯例（知识库同类条目 knowledge_ref: E201 上游测试入口依赖 OHOS 缺失工具；相似 E012 GNU 工具链缺失），本次仅按包记录，未新建知识草稿"
  - "zps 是纯 POSIX C + /proc 扫描 + kill() 的 CLI，在 HarmonyOS 上零补丁即通过编译与全部功能用例（DT_NEEDED 仅 libc.so）—— 本包事实，reference: notes.md 定位/知识沉淀"
  - "僵尸回收语义在 HarmonyOS 成立：向僵尸父进程发 SIGTERM 后僵尸 reparent 到 init 并在 1~2 秒内消失；SIGCHLD 只对实现了 wait() 的父进程有效（可据此设计零副作用测试：-r -s CHLD + 父进程 wait() 处理器）；默认 -r 会广播到全系统僵尸父进程，共享主机上有破坏性 —— 本包实机验证，reference: notes.md 知识沉淀"
  - "上游 scripts/test.sh 是 && 链冒烟测试：把单独的 zps -s <sig> 写在链中（工具 settings_check 要求 -s 必须与 -r/-p 同用）→ 该链在第 2 位短路，后续 -s SIGTERM/-s term 从未执行 —— reference: test_package/MANIFEST.yml 的 skipped_reason"
