software: zps
display: "zps"
description: "僵尸进程列表与回收工具 — 扫描 /proc 标出 defunct 进程并向其父进程发送信号完成回收"
category: system
homepage: "https://github.com/orhun/zps"
license: GPL-3.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 POSIX C（/proc 扫描 + kill()），零第三方依赖，OHOS 上零补丁通过"
    - "构建走 conan CMakeToolchain：os=OHOS → CMAKE_SYSTEM_NAME=HarmonyOS（本机 cmake 仅告警并继续）"
    - "打包需对 bin/ 下 ELF 重新自签名并恢复 0755 执行位，否则设备上无法执行"
    - "上游覆盖率步骤（gcc/gcov）在 OHOS 不可复现（无 GNU 工具链），已标注 NA"
  common_dependencies: []

versions:
  "2.0.0":
    status: built
    build_date: "2026-09-23"
    conan_ref: "zps/2.0.0"
