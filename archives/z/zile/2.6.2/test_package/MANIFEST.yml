# test_package/MANIFEST.yml — zile 2.6.2
#
# 上游测试清点证据（R51 上游测试三步法，取数命令随每条给）：
#   - src/Makefile.am:104-106 注册 check_PROGRAMS = src/estr-test、
#     TESTS = $(check_PROGRAMS) → 1 个 C 用例（测试 zile 的 estr 字符串库）；
#   - tests/Makefile.am 注册 TESTS += $(LISP_TESTS) $(LISP_TESTS_ZILE_ONLY)
#     = 146 + 29 = 175 个 .el 用例（EL_LOG_COMPILER = perl
#     tests/run-lisp-test.pl，以 --no-init-file/--load 驱动构建出的 zile
#     执行编辑序列，结果与 .output 逐字节 diff）；
#     取数：解析 tests/Makefile.am 的 LISP_TESTS / LISP_TESTS_ZILE_ONLY
#     变量块中 .el 条目（本仓库探针 tools/probes/z12377_testcount.cjs）；
#   - LISP_TESTS_ZILE_ONLY_FIXED_SCREEN（2 个 scroll-up/scroll-down.el）
#     **不在 TESTS 里**，只进 EXTRA_DIST 与 check-local（需固定 80x24 屏幕），
#     故磁盘 .el 共 177 个而注册用例 175 个——非漏跑，是上游注册口径；
#   - N_static = N_registered = 176（estr-test 1 + lisp 175）。
#   设备实测（OHOS aarch64 原生，conan create 内 make check）：
#     176/176 PASS、0 FAIL（# TOTAL: 176 / # PASS: 176 / # FAIL: 0），
#     详见 notes.md 与 create 日志。

package: zile/2.6.2
homepage: "https://www.gnu.org/software/zile/"

upstream_check_command: "make check"
upstream_check_command_note: >-
  automake TESTS = src/estr-test + 175 个 lisp 用例（共 176）；配方在 build()
  内注入 TERM=xterm 与 TERMINFO=<ncurses 包>/share/terminfo（OHOS 无系统
  terminfo 数据库）、VALAC=:（tarball 自带预生成 .c，设备无 valac）。

upstream_test_in_build: true
upstream_test_command: >-
  make check -j1 VALAC=: 且环境 TERM=xterm TERMINFO=<ncurses>/share/terminfo
  （配方 build() 内 self.run(..., env="conanbuild")）

upstream_tests:
  - file: src/estr-test
    source: "zile-2.6.2/src（src/Makefile.am:104 check_PROGRAMS）"
    description: "estr 字符串库单元测试（automake 注册的 C 程序）"
    command: "make check"
  - file: tests/*.el（LISP_TESTS 146 + LISP_TESTS_ZILE_ONLY 29）
    source: "zile-2.6.2/tests（tests/Makefile.am）"
    description: "内建 lisp 解释器驱动的编辑行为测试：run-lisp-test.pl 以 --no-init-file/--load 运行 zile 执行编辑序列，结果与 .output 逐字节比对"
    command: "make check（TEST_EXTENSIONS=.el，perl runner）"

test_package_tests:
  - file: test_zile.sh
    description: "消费者测试：以工具使用者身份执行包内 zile，断言版本标识（GNU Zile 2.6.2）、--help 用法输出、批处理 lisp 编辑往返（--no-init-file/--load 插入文本保存后 cmp 逐字节比对，复刻上游测试机制）"
    command: "sh test_zile.sh <bindir> <ncurses-package-root> <tmpdir>"

assertion_count: 3
