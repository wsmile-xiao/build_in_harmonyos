knowledge_gained:
  - "同库跨版本的 GNU config 代际差异：zile 2.6.4 自带 config 2024-05/07（config.sub 已认 ohos、config.guess 用 GUESS= 变量风格），2.6.2 自带 2019-01（两者都不认 ohos，且 config.guess 分支是 echo/exit 风格）→ 范本补丁不能逐字节照抄，必须按本版本 pristine tarball 重新生成"
  - "2019-01-05 版 config.sub 未把 linux-ohos 列入「可接受基本系统类型」白名单时，会落到 linux*) 分支被 sed 改写成 linux-gnu-ohos（静默失真而非报错）；白名单补 linux-ohos* 即保持 aarch64-unknown-linux-ohos"
  - "Vala 项目（zile/libgee 等）发布 tarball 自带预生成 .c 与 *_vala.stamp，stamp 规则仍无条件重跑 valac → make/install 均传 VALAC=:（POSIX no-op）"
  - "GNU 包 help2man 规则依赖新编译的二进制、每次构建必触发；设备无 help2man 时 configure 传 ac_cv_path_HELP2MAN=/bin/true，保留 tarball 自带 man 页"
  - "glib 多实例崩溃模式：制品仓 glib 仅 static 变体时，静态链 glib 的程序 + 内嵌 static glib 的 shared libgee 共存会触发 gobject gtype.c static_quark_type_flags 断言 SIGABRT；libgee 也走 static（default_options）即单实例通过"
  - "OHOS 无系统 terminfo 数据库，curses 程序在 make check/批处理场景报 Error opening terminal；注入 TERMINFO=<ncurses 包>/share/terminfo + TERM=xterm 即可（tests/Makefile.am 的 TERM ?= vt100 由命令行/环境变量覆盖）"
  - "HMDFS 上 configure 的 umask 077 临时目录不可写（E011/E114），zile 2.6.2 亦命中，补丁改 022"

