# conandata.yml — zile 2.6.2
# 上游：GNU zile（轻量 Emacs clone），官方发布物
# sha256 由本机两个独立 GNU 镜像（mirrors.kernel.org / mirrors.tuna.tsinghua.edu.cn）
# 分别下载实算一致；开工时在设备侧再算一遍（见 manifest.yaml source.sha256）

sources:
  url: "https://ftp.gnu.org/gnu/zile/zile-2.6.2.tar.gz"
  sha256: "77eb7daff3c98bdc88daa1ac040dccca72b81dc32fc3166e079dd7a63e42c741"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: >-
      本 tarball 自带 GNU config 2019-01-03 版 config.guess，不识别
      uname -s=HarmonyOS，configure 报 "unable to guess system type"。
      在主分派 case 顶部加 HarmonyOS 分支，按机器名归一后输出
      ${MACHINE}-unknown-linux-ohos 并 exit 0（2019 版分支自带 echo/exit，
      与 2.6.4 的 2024 版 GUESS= 赋值风格不同）。
    patch_type: "portability"
  - patch_file: "patches/0002-build-aux-config.sub.patch"
    patch_description: >-
      同批 config.sub（2019-01-05）的「可接受基本系统类型」白名单没有
      linux-ohos*，未命中会落到 linux*) 分支被 sed 改写成
      aarch64-unknown-linux-gnu-ohos。白名单补 linux-ohos*，使三元组保持
      aarch64-unknown-linux-ohos（GNU config 2021+ 已原生支持，
      2.6.4 的 2024-05-27 版无需此补丁）。
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: >-
      configure 临时目录用 umask 077 创建，在 HMDFS 上 mktemp/mkdir
      报 "Permission denied"（E011/E114 同类），改 022。
    patch_type: "portability"
