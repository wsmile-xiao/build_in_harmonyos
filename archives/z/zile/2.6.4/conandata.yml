# conandata.yml — zile 2.6.4
# 上游：GNU zile（轻量 Emacs clone，官方发布物）

sources:
  url: "https://ftp.gnu.org/gnu/zile/zile-2.6.4.tar.gz"
  sha256: "d5d44b85cb490643d0707e1a2186f3a32998c2f6eabaa9481479b65caeee57c0"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: >-
      config.guess（2024-07-27）不识别 uname -s=HarmonyOS，configure 报
      "unable to guess system type"。加 HarmonyOS case 输出
      aarch64-unknown-linux-ohos（libgee/vala 配方同款补丁）。config.sub
      同版本已原生支持 ohos 三元组（./config.sub
      aarch64-unknown-linux-ohos 实测通过），无需补丁。
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: >-
      configure 临时目录 umask 077 在 HMDFS 上 mktemp/mkdir
      "Permission denied"（E011/E114 同类问题），改 022。
    patch_type: "portability"
