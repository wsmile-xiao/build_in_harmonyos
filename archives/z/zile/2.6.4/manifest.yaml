  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "PkgConfigDeps 提供 glib-2.0/gobject-2.0/gio-2.0/gee-0.8/ncursesw.pc"
    - "CURSES_LIB=-lncursesw（conan ncurses 仅出 widec）"
