patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-configure.patch"

knowledge_gained:
  - "GNU config 2024-07-27 版：config.sub 已原生支持 aarch64-unknown-linux-ohos，但 config.guess 仍不识别 uname -s=HarmonyOS，需补丁加 case 分支（新旧工具行为不一致，两文件须分别实测）"
  - "Vala 项目（zile/libgee 等）发布 tarball 自带预生成 .c 与 *_vala.stamp，但 stamp 规则可能无条件 touch .vala 重跑 valac；AM_PROG_VALAC 缺失仅 WARN、Makefile 保留默认 valac → Error 127；make 与 make install 均传 VALAC=:（POSIX no-op）即可直接编译发布 .c"
  - "GNU 包 man 页规则（help2man）依赖新编译的二进制，每次构建必触发；设备无 help2man 时 configure 传 ac_cv_path_HELP2MAN=/bin/true，rc=0 不产出，保留 tarball 自带 man 页"
  - "glib 多实例崩溃模式：制品仓 glib 仅 static 变体时，静态链 glib 的程序 + 内嵌 static glib 的 shared 库（如 libgee shared）共存会触发 gobject gtype.c static_quark_type_flags 断言 SIGABRT；全图统一 static（libgee 也 static）即单实例通过"
  - "OHOS 无系统 terminfo 数据库，curses 程序（zile 等）在测试/批处理场景报 Error opening terminal；conan ncurses 包自带 share/terminfo，注入 TERMINFO 环境变量即可"
  - "HMDFS 上 configure 的 umask 077 临时目录不可写（E011/E114），zile 亦命中，补丁改 022"

