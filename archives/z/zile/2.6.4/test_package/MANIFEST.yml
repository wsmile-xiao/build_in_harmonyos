# test_package/MANIFEST.yml — zile 2.6.4
#
# 上游测试清点证据（R51 上游测试三步法）：
#   - src/Makefile.am 注册 TESTS = src/estr-test（automake
#     check_PROGRAMS，C 程序，测试 zile 的 estr 字符串库）；
#   - tests/Makefile.am 注册 TESTS += $(LISP_TESTS) $(LISP_TESTS_ZILE_ONLY)
#     共 175 个 .el 用例（EL_LOG_COMPILER = perl tests/run-lisp-test.pl，
#     以 --no-init-file/--load 驱动构建出的 zile 执行编辑并与 .output
#     逐字节 diff）；
#   - N_static = N_registered = 176（src/estr-test 1 + lisp 175）。
#   设备实测（OHOS aarch64 原生，conan create 内 make check）：
#     176/176 PASS，0 FAIL（# TOTAL: 176 / # PASS: 176 / # FAIL: 0），
#     详见 notes.md 与 conan-create.log。

package: zile/2.6.4
homepage: "https://www.gnu.org/software/zile/"

upstream_check_command: "make check"
upstream_check_command_note: "automake TESTS = src/estr-test + 175 个 lisp 用例；配方注入 TERM=xterm 与 TERMINFO（ncurses 包自带数据库）、VALAC=:（tarball 自带预生成 .c）"

upstream_test_in_build: true
upstream_test_command: "make check -j1 VALAC=: TERM=xterm TERMINFO=<ncurses>/share/terminfo（配方 build() 内）"

upstream_tests:
  - file: src/estr-test
    source: "zile-2.6.4/src（check_PROGRAMS）"
    description: "estr 字符串库单元测试（automake 注册）"
    command: "make check"
  - file: tests/*.el（LISP_TESTS + LISP_TESTS_ZILE_ONLY）
    source: "zile-2.6.4/tests（175 个用例）"
    description: "内建 lisp 解释器驱动的编辑行为测试：run-lisp-test.pl 以 --no-init-file/--load 运行 zile 执行编辑序列，结果与 .output 逐字节比对"
    command: "make check（TEST_EXTENSIONS=.el，perl runner）"

test_package_tests:
  - file: test_zile.sh
    description: "消费者测试：以工具使用者身份执行包内 zile，断言版本标识（GNU Zile 2.6.4）、--help 用法输出、批处理 lisp 编辑往返（--no-init-file/--load 插入文本保存后 cmp 逐字节比对，复刻上游测试机制）"
    command: "sh test_zile.sh <bindir> <ncurses-package-root> <tmpdir>"

assertion_count: 3
