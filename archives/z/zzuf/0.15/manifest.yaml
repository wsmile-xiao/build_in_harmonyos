# ============================================================

version: "0.15"
software: "zzuf"

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源）
  url: "https://codeload.github.com/samhocevar/zzuf/tar.gz/refs/tags/v0.15"
  # 源码校验和（官方 tarball SHA-256）
  sha256: "8886e90f9a7b48ff77836e270da1a86ffeb844e99da6e52e656d4dabf12d2680"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（bootstrap 生成 configure 后执行）
  configure_options:
  - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu"
  - "ac_cv_func___fread_chk=no ac_cv_func___fgets_chk=no"
  - "ac_cv_func_fseeko64=no ac_cv_func_fsetpos64=no ac_cv_type_fpos64_t=no"

  # 编译依赖列表（zzuf 无第三方依赖，仅系统 libc/libm/libdl）
  dependencies: []

  # 编译器（OHOS SDK clang 15.0.4, 由 profile conf 注入）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无源码补丁：适配通过 configure cache 变量 + 构建环境 umask 处理
# （HMDFS setgid 临时目录权限为平台限制，R49；fortify 符号禁用为配方级配置）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "OHOS (musl 派生) libc 的 __fread_chk/__fgets_chk 与 glibc 参数顺序不同且声明受 __FORTIFY_COMPILATION 门控，configure AC_CHECK_FUNCS 链接测试误通过；需注入 ac_cv_func___fread_chk=no 禁用 streambuf fortify 拦截（E235 同类）"
- "OHOS fpos64_t/fseeko64/fsetpos64 为标准接口宏别名且 fpos64_t 为 union，LP64 下禁用无损（ac_cv_type_fpos64_t=no）"
- "HMDFS setgid 目录按组权限判定写入：autoconf umask 077 临时目录不可写（config.status Permission denied），需以默认 umask 022 运行 bootstrap/configure"
- "OHOS FILE 结构不透明（struct _IO_FILE { char __x; }），zzuf glibc/FreeBSD/Solaris streambuf 探测编译期全失败 -> ungetc 类断言与上游参考 md5 不一致，属平台限制"

# ============================================================
