# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制)

package: zzuf/0.15
homepage: "https://github.com/samhocevar/zzuf"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (make check, 11 TESTS)
upstream_tests:
  - file: test/check-zzuf-A-autoinc
    source: zzuf-0.15/test/check-zzuf-A-autoinc
    description: "zzuf -A 自动递增种子行为"
    command: "./check-zzuf-A-autoinc"
  - file: test/check-zzuf-f-fuzzing
    source: zzuf-0.15/test/check-zzuf-f-fuzzing
    description: "-f xor/set/unset 模糊算法"
    command: "./check-zzuf-f-fuzzing"
  - file: test/check-zzuf-m-md5
    source: zzuf-0.15/test/check-zzuf-m-md5
    description: "-m md5 确定性校验"
    command: "./check-zzuf-m-md5"
  - file: test/check-zzuf-M-max-memory
    source: zzuf-0.15/test/check-zzuf-M-max-memory
    description: "-M 内存上限"
    command: "./check-zzuf-M-max-memory"
  - file: test/check-zzuf-r-ratio
    source: zzuf-0.15/test/check-zzuf-r-ratio
    description: "-r 比率统计（理论值对比）"
    command: "./check-zzuf-r-ratio"
  - file: test/check-source
    source: zzuf-0.15/test/check-source
    description: "源码风格检查（tab/尾随空格）"
    command: "./check-source"
  - file: test/check-win32
    source: zzuf-0.15/test/check-win32
    description: "msvc/config.h 与 config.h.in 同步"
    command: "./check-win32"
  - file: test/check-overflow
    source: zzuf-0.15/test/check-overflow
    description: "缓冲区溢出捕获"
    command: "./check-overflow"
  - file: test/check-div0
    source: zzuf-0.15/test/check-div0
    description: "除零捕获"
    command: "./check-div0"
  - file: test/check-utils
    source: zzuf-0.15/test/check-utils
    description: "常用工具模糊（cat/dd/head/grep/sed，553 断言）"
    command: "./check-utils"
  - file: test/check-mmap
    source: zzuf-0.15/test/check-mmap
    description: "mmap 处理"
    command: "./check-mmap"
  # 源码存在但未注册入 TESTS (200000 passes 超大循环, 上游明确排除)
  - file: test/check-zzuf-s-seed
    source: zzuf-0.15/test/check-zzuf-s-seed
    description: "种子确定性（未注册 TESTS，超大循环 120s+）"
    command: "./check-zzuf-s-seed"

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者验证：二进制可执行/确定性 fuzz/子进程 preload 拦截"
    command: "conan test"

# 测试断言总数
assertion_count: 560