software: zzuf
display: "zzuf"
description: "Transparent application input fuzzer — LD_PRELOAD intercepts file operations and flips random bits in program input, deterministic and reproducible (Sam Hocevar)"
category: fuzz
homepage: "https://github.com/samhocevar/zzuf"
license: WTFPL
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools + bootstrap（tarball 无 configure，先 ./bootstrap 生成）"
    - "OHOS musl 派生 libc 的 __fread_chk/__fgets_chk 参数顺序与 glibc 不同且声明受 __FORTIFY_COMPILATION 门控 → ac_cv_func___fread_chk=no ac_cv_func___fgets_chk=no；fpos64_t/fseeko64/fsetpos64 为宏别名 → 禁用无损"
    - "HMDFS setgid 目录组权限：autoconf umask 077 临时目录不可写 → 以 umask 022 运行 bootstrap/configure（R49 平台限制）"
    - "OHOS FILE 结构不透明 → zzuf glibc/FreeBSD/Solaris streambuf 探测编译期失败，ungetc 类上游断言与本机参考 md5 不一致（平台限制，非配方缺陷）"
  common_dependencies: []

versions:
  "0.15":
    status: built            # W3 本地 conan 验证中，PR 合入发布后置 published
    build_date: "2026-09-06"
    format: conan
    note: "autotools 配方；zzuf/zzat 工具 + libzzuf.so 拦截库；OHOS fortify/fpos64 符号按配方禁用，保留 __read_chk/__recv_chk/__recvfrom_chk（子进程拦截 92% 断言通过）"