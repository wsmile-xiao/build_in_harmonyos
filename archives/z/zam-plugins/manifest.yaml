software: zam-plugins
display: "zam-plugins"
description: "Audio effect plugins (LV2/LADSPA/VST/CLAP) by ZamAudio"
category: multimedia
homepage: "https://github.com/zamaudio/zam-plugins"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "DGL/GUI禁用：HAVE_DGL=false + UI_TYPE=none (OHOS无显示后端)"
    - "VST2/VST3/JACK添加HAVE_DGL守卫（与CLAP一致）"
    - "pthread_testcancel缺失：musl libc不提供，空操作守卫"
    - "JACK/AU目标从Makefile移除"
    - "DPF和pugl子模块需手动下载安装"
  common_dependencies:
    - fftw3f
    - libsamplerate

versions:
  "4.5":
    status: built
    build_date: "2026-06-02"
