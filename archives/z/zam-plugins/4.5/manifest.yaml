# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/zamaudio/zam-plugins/archive/refs/tags/4.5.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "HAVE_DGL=false"
    - "UI_TYPE=none"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - fftw3f/3.3.9

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "DPF 构建系统自动检测 DGL backend (cairo/opengl/vulkan)，即使命令行 HAVE_DGL=false 也可能被覆盖；需同时设置 UI_TYPE=none 阻止 backend 检测逻辑添加 -DHAVE_DGL"
  - "OpenHarmony musl libc 缺少 pthread_testcancel()，需要在 RtAudio.cpp 中用 #ifdef __OHOS__ 守卫宏定义替代"
  - "VST2/VST3/JACK 目标需要添加 HAVE_DGL 守卫（类似 CLAP 已有的 #if DISTRHO_PLUGIN_HAS_UI && ! defined(HAVE_DGL)），否则即使 UI_TYPE=none 也会引用 DGL 符号"
  - "OpenHarmony 无 JACK 音频服务器，需从 TARGETS 移除 jack；AU 仅 macOS 可用也需移除"
  - "无 GUI 时 lv2_sep 不可用（需要 UI），改用 lv2 构建 DSP-only LV2 插件"

