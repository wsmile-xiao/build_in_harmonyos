# 软件级 manifest
# 文件位置: archives/z/zxc/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: zxc
display: "ZXC"
description: "高性能非对称无损压缩库"
category: compress
homepage: "https://github.com/hellobertrand/zxc"
license: BSD-3-Clause

# ============================================================
# 构建信息
# ============================================================

build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "CMake 不认识 HarmonyOS，需设置 CMAKE_SYSTEM_NAME=Linux 和 CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "tmpfile() 在 OHOS 不可用（/tmp 只读），需替换为 mkstemp() + $TMPDIR"
    - "ZXC_NATIVE_ARCH=OFF 禁用 -march=native 以确保可移植性"
    - "BUILD_SHARED_LIBS=OFF 静态链接终端工具（R26）"

  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.9.1":
    status: built
    build_date: 2026-06-26
