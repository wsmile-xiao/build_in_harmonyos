# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 上 CMAKE_SYSTEM_PROCESSOR 为 unknown，需手动设置 CMAKE_SYSTEM_NAME=Linux 和 CMAKE_SYSTEM_PROCESSOR=aarch64"
  - "tmpfile() 在 OHOS 不可用（/tmp 只读），需替换为 mkstemp() + $TMPDIR"
  - "ZXC_NATIVE_ARCH=OFF 禁用 -march=native 确保可移植性"
  - "ZXC 静态库需定义 ZXC_STATIC_DEFINE 以禁用 dllimport/dllexport 注解"

