# test_package/MANIFEST.yml — zboy 0.71
package: zboy/0.71
homepage: "https://sourceforge.net/projects/zboy/"

# 上游没有 tests/ 目录、make check、CTest 或注册式测试框架。
# 完整 CPU ROM 在 HarmonyOS 真机的自动测试时间内未完成；Conan 构建门禁运行官方单项诊断 ROM。
upstream_check_command: "No upstream make check/ctest target; run bundled Game Boy diagnostic ROM"
upstream_test_in_build: true
upstream_test_command: "python3 test_package/run_upstream_rom_tests.py (cpu_instrs/individual/01-special.gb)"

upstream_tests:
  - file: tools/roms/cpu_instrs/individual/01-special.gb
    source: "zboy-0.71/tools/roms/cpu_instrs/individual/01-special.gb"
    description: "上游官方 CPU 单项诊断 ROM，测试特殊指令并通过 Game Boy 串口输出 Passed 或失败信息"
    command: "zboy --fullspeed --nosound tools/roms/cpu_instrs/individual/01-special.gb (assert serial output contains Passed)"

test_package_tests:
  - file: conanfile.py
    description: "执行安装后的 zboy --version 和 --help，并断言版本及用法输出"
    command: "zboy --version; zboy --help"
  - file: test_ohos.c
    description: "HarmonyOS ARM64 真机 SDL 原生视频初始化、窗口、Renderer、RGB565 texture 更新与呈现"
    command: "zboy_ohos_sdl_test"

assertion_count: 11
