software: zboy
display: "zBoy"
description: "SDL2 桌面 Game Boy 模拟器"
category: gfx
homepage: "https://sourceforge.net/projects/zboy/"
license: "GPL-3.0-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "使用 Conan 选定的 C 编译器与 SDL2 pkg-config 元数据构建上游 Linux SDL2 后端。"
    - "在 HarmonyOS ARM64 原生 profile 上验证 SDL 视频、窗口、渲染器和 RGB565 纹理。"
    - "上游未提供 make check；Conan 运行官方 CPU 单项诊断 ROM 并从串口输出检查结果。"
  common_dependencies:
    - "sdl2/2.30.10"

versions:
  "0.71":
    status: built
    build_date: "2026-09-23"
    conan_ref: "zboy/0.71"
