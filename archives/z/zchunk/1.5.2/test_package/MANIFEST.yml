# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: zchunk/1.5.2
homepage: "https://github.com/zchunk/zchunk"

# 上游测试命令 (meson test 注册分析)
upstream_check_command: "meson test --list (test/meson.build 注册 37 个 test())"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "vendored meson test -v -C <build> --timeout-multiplier=16 --no-rebuild --print-errorlogs"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/meson.build (9 个测试可执行文件, 37 个 test() 注册)
    source: zchunk-1.5.2/test/*.c
    description: "empty/optelems/copy_chunks/invalid_input_checksum/read_single_chunk/read_single_comp_chunk 等; 结果 Ok 36 + Expected Fail 1, Fail 0"
    command: "vendored meson test (build() 内执行)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: zck_init_write→zck_write→zck_close→zck_init_read 回环, 断言分块数/尺寸/数据 memcmp/压缩生效/digest"
    command: "./test_zchunk"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 37
