# 版本级 manifest
# 文件位置: archives/z/zchunk/1.5.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.2"

# 软件名
software: "zchunk"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/zchunk/zchunk/archive/refs/tags/1.5.2.tar.gz"

  # 源码校验和
  sha256: "b7346d950fec2e0c72761f2a9148b0ece84574c49076585abf4bebd369cd4c60"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
  - "-Dwith-zstd=enabled"
  - "-Dwith-curl=enabled"
  - "-Dwith-openssl=enabled"
  - "-Dtests=true"
  - "-Ddocs=false"
  - "--buildtype=release (MesonToolchain)"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - zstd/1.5.7.1
  - openssl/3.5.6.1
  - curl/8.15.0.1
  - argp-standalone/1.4.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "vendored meson 1.11.2 进程内调用对接 MesonToolchain native file（astroterm 同款方案的复用验证）"
- "meson 依赖查找统一走 PkgConfigDeps + PKG_CONFIG_PATH=generators 目录"
- "zchunk buzhash 自动分块天然产生空首 chunk（length=0），消费者断言需跳过"
