# 版本级 manifest — zephyr 3.1.2（遵循 ARCHIVE-SPEC v2.0）
# 位置: archives/z/zephyr/3.1.2/manifest.yaml

version: "3.1.2"
software: "zephyr"

# 编译状态: published | built | failed | archived
# built = 本地 conan create 通过验证但尚未 upload（W3 本地门禁 + CI 待跑）
status: published
build_date: "2026-09-27"
build_system: "autotools"

source:
  url: "https://github.com/zephyr-im/zephyr/archive/refs/tags/3.1.2.tar.gz"
  sha256: "b323244aee7fa3cb25432e8d882dcfd231c9bc83092e7284924aec068bc50df4"
  tar_format: tar.gz

build:
  system: autotools
  # R1: 参数最小化。仅强制依赖 com_err 的路径 + krb5 无条件探针的缓存值 +
  # 显式 OHOS 三元组；shared/static/prefix 由 AutotoolsToolchain 提供。
  configure_options:
    - "--with-com_err=<e2fsprogs/1.47.4 package folder>"
    - "ac_cv_krb5_auth_con_getauthenticator_takes_double_pointer=no"
    - "ac_cv_krb5_auth_con_flags_type=krb5_flags"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  # 上游 SUBDIRS = lib clients server zhm zwgc；本包只构建核心库（详见 notes.md）
  subdirs: ["lib"]
  dependencies:
    - "e2fsprogs/1.47.4"
  tool_requirements:
    - "autoconf/2.72"
    - "automake/1.18"
    - "libtool/2.5.4.1"
    - "e2fsprogs/1.47.4"
  cc: clang
  cxx: clang++

# 补丁（全部为上游文件的修改型 diff，无新增文件型补丁）
patches_applied:
  - "0001-lib-Makefile.in-python3-check-split-and-install-mode.patch"
  - "0002-python-zephyr_ctypes-port-to-python3.patch"
  - "0003-lib-zephyr_tests-port-to-python3.patch"
  - "0004-lib-zephyr_run_doctests-port-to-python3.patch"
  - "0005-lib-zephyr_tests.txt-port-to-python3.patch"

# 构建洁净度：登记技术债（build-systems.md §3.6 要求）
build_cleanliness:
  # 显式三元组：config.guess 无法识别 HarmonyOS（uname -s = "HarmonyOS"）且其
  # 编译器探测在 HMDFS 下不可靠。已通过修补生成的 config.sub 使其成立；
  # 改进方向是为 config.guess 增加 HarmonyOS 探测后去掉本参数。
  explicit_build_host_triplet: "tech_debt"
  # configure 以 CONFIG_SHELL/SHELL=/bin/sh 运行：镜像 profile 注入的 bash 会让
  # 该 configure 报 "working directory cannot be determined"。
  config_shell_override: "platform_workaround"
  # conan 工具链变量在 autoreconf 前 unset，保证 perl/autoconf 链一致。
  bootstrap_env_normalisation: "platform_workaround"
  # test_package 的运行时门禁：宿主加载器只按 namespace 路径（/etc/ld-musl-
  # namespace-aarch64.ini）解析并拒绝 namespace 之外的库（LD_LIBRARY_PATH/
  # DT_RUNPATH/$ORIGIN/LD_PRELOAD 均无效，且与文件权限无关）。故门禁 1（DT_NEEDED
  # 结构断言）确定性生效，门禁 2/3 在加载器拒绝时记 SKIP 并附原始报错。
  test_package_runtime_gate: "platform_workaround"
  # CI worker 上内核/MAC 校验 ELF 的 .codesign 段：未签名的构建产物用
  # python3/ctypes dlopen 得到 EACCES（E077/E083），本机宿主不校验签名故本地不可见。
  # 处置：make 之后、跑上游测试之前对构建树内真实 .so 就地签名（E077 四步流程）。
  code_signing: "platform_workaround"
  # worker 的 dlopen() 拒载用户目录 .so（与签名无关），仅 exec 期 DT_NEEDED 可用
  # → 上游 ctypes 套件改由嵌入式 CPython 启动器运行（NEEDED 链 libzephyr + libpython），
  #   绑定层在 LoadLibrary 被拒时回退 ctypes.CDLL(None)；启动器带自检闸，跑不起来则退回 python3。
  test_interpreter_launcher: "platform_workaround"

knowledge_gained:
  - "纯 autoconf 工程（有 configure.ac + 手写 Makefile.in、无 configure/Makefile.am）可用 tool_requires 补齐 autotools 链后以 autoreconf -fi 引导（reference: notes.md 编译环境与关键命令）"
  - "OHOS 镜像 PATH 中系统 autoconf 优先且与 conan automake/libtool 的 PERL5LIB 冲突（Perl_my_cxt_init），bootstrap 需 unset conan 工具变量（reference: notes.md 问题 1）"
  - "conan perl 无法 exec /bin/sh 脚本，系统 perl 可以，因此 bootstrap 应使用系统 autoconf 套件（reference: notes.md 问题 2）"
  - "automake/libtool 2023 版 config.sub 缺少 ohos 支持；除官方补丁脚本的两处改动外还需补 kernel/OS 校验表（linux-ohos*）（reference: notes.md 问题 4）"
  - "e2fsprogs 的 compile_et 需 _ET_DIR_OVERRIDE 指向 <pkg>/share/et（reference: notes.md 问题 5）"
  - "profile 注入的 CONFIG_SHELL=bash 会让该 configure 报 working directory cannot be determined，需以 /bin/sh 运行（reference: notes.md 问题 7）"
  - "公共头 include <com_err.h> 时 requires 必须声明 transitive_headers=True，否则消费者编译失败（reference: notes.md 问题 8）"
  - "上游 libtool 以 -m 644 安装 .so，OHOS 加载器要求可执行位；本平台 chmod 对已存在文件无效（E046），需在安装时用 -m 755（ref: E046；reference: notes.md 问题 9）"
  - "OHOS 消费者运行时分两种加载路径：DT_NEEDED 按 namespace 解析（可被宿主拒绝），dlopen 绝对路径可绕过；test_package 应以『链接结构断言 + dlopen 运行时断言』双门禁覆盖二者（ref: E088；reference: notes.md 动态加载器）"
  - "ZParseNotice 令 notice->z_packet 指向调用方缓冲区，与 ZFormatNotice 的 malloc 是同一块内存：free(buf) + ZFreeNotice(&parsed) 会双重释放并触发 musl 中止（reference: notes.md 动态加载器（结论 5）；reports/conan-create.log）"
  - "OHOS 拒映射无 .codesign 段的 ELF：构建树内未签名的 .so 被 python3/ctypes dlopen 时报 Permission denied（E077/E083）；必须在『被加载的位置』（构建后、跑测试前）就地签名，安装副本随字节复制继承签名；本机宿主不校验签名，故该缺陷只在 CI 暴露（ref: E077、E083；reference: notes.md 问题 13）"
  - "worker 的 dlopen() 拒载一切用户目录 .so（带有效 .codesign 也拒），而 exec 期 DT_NEEDED 加载同一批文件可用；ctypes 类上游测试必须换「嵌入式 CPython 启动器（NEEDED 链库与 libpython）+ CDLL(None) 全局符号回退」，签名与 LD_PRELOAD 都无效（ref: E088 namespace 策略；barvinok #33869/#33895 定案）"
