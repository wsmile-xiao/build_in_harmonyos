# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在且非空）
#
# 数据来源：真实执行 `make check SUBDIRS=lib`（zephyr-3.1.2，OHOS PC aarch64）。
# 清点方式：`make -n check SUBDIRS=lib` + lib/Makefile.in 的 check 目标。
# 详见 archives/z/zephyr/3.1.2/notes.md 与 reports/upstream-test-report.md。

package: zephyr/3.1.2
homepage: "https://github.com/zephyr-im/zephyr"

# 上游测试入口（lib/Makefile.in 的 check 目标）
upstream_check_command: "make check SUBDIRS=lib"

# conanfile.py build() 中已集成上游测试（make check），因此 CI conan create 会执行
upstream_test_in_build: true
upstream_test_command: "make check SUBDIRS=lib"

# 上游实际运行的测试程序
# 1) lib/zephyr_tests.py —— 库 API 测试套件（Python，经本适配移植到 Python 3）
#    真实统计（本机 uname -s = HarmonyOS，真实执行）：total=6 passed=5 failed=0 skipped=1
#    用例：test_notices / test_ohos_consumer / test_z_compare_uid /
#          test_z_expand_realm / test_zauthtype / test_zinit
#    test_ohos_consumer 为本次新增的鸿蒙用例（本机 PASS）；
#    跳过原因（1 例）：无 zhm(HostManager) 时 test_zinit 的 ZInitialize 提前返回
upstream_tests:
  - file: lib/zephyr_tests.py
    source: zephyr-3.1.2/lib/zephyr_tests.py
    description: "libzephyr API test suite (ctypes); blocking gate"
    command: "cd lib && PYTHONPATH=../python python3 zephyr_tests.py --builddir=.."
  - file: lib/zephyr_run_doctests
    source: zephyr-3.1.2/lib/zephyr_run_doctests
    description: >-
      upstream documentation-style doctests over lib/zephyr_tests.txt
      (reported, non-blocking: 31/153 examples need a live zhm or a
      zephyr server; see notes.md)
    command: "cd lib && PYTHONPATH=../python python3 zephyr_run_doctests"

# test_package 中自带的测试（消费者视角验证，R34：真实调用被测包 API）
# 三道门禁，断言体共用 test_package/zephyr_consumer.h（9 条断言）：
#   门禁 1 链接绑定：test_zephyr_link 链接 zephyr::zephyr，conanfile.py 直接解析
#          该二进制的 ELF 动态段，断言 DT_NEEDED 含 libzephyr 且包内确实提供该 SONAME
#   门禁 2 运行时（ctypes 绝对路径 dlopen）：断言集与 zephyr_consumer.h 逐一对应
#   门禁 3 原生消费者执行：test_zephyr_dlopen / test_zephyr_link 在加载器允许时执行
# 门禁 2/3 依赖加载器交付 namespace 之外的库；宿主拒绝时如实记为 SKIP（附原始报错），
# 门禁 1 在任何宿主上都确定性生效。实测证据见 notes.md「动态加载器」一节。
test_package_tests:
  - file: test_link.c
    description: >-
      link gate: includes <zephyr/zephyr.h> (+ propagated <com_err.h>) and links
      zephyr::zephyr; DT_NEEDED of the produced executable is asserted to carry
      a libzephyr SONAME the package provides (1 structural assertion, always run)
    command: "cmake --build <build folder> --target test_zephyr_link"
  - file: zephyr_consumer.h
    description: >-
      shared assertion body of both consumer binaries: ZGetRealm/ZGetSender/
      ZGetFD/ZCompareUID + ZFormatNotice/ZParseNotice/ZFreeNotice wire-format
      round-trip (9 assertions, real API calls on the packaged library)
    command: "n/a (header compiled into test_zephyr_link and test_zephyr_dlopen)"
  - file: conanfile.py
    description: >-
      run-time gate: ctypes.CDLL() on <package_folder>/lib/libzephyr.so.4 with
      the same 9 assertions; SKIP (environment-limited) only when the loader
      refuses, with the loader's own message
    command: "python3 -c \"ctypes.CDLL(...)\" (conanfile.py test())"
  - file: test_dlopen.c
    description: >-
      native consumer: dlopen()s the packaged .so by absolute path and drives
      the public API through dlsym()ed symbols
    command: "./test_zephyr_dlopen <package_folder>/lib/libzephyr.so.4"

# 断言总数：上游 6 个用例 + 消费者测试 9 条断言（门禁 2 与门禁 3 共用同一套断言，
# 不重复计入）+ 门禁 1 的 1 条结构断言
assertion_count: 16
