# conandata.yml — zephyr 3.1.2 (Project Athena's notification service)
#
# Source: the official upstream Git tag `3.1.2` of github.com/zephyr-im/zephyr.
# The project publishes no GitHub "release" assets, so the tag archive is the
# authoritative upstream artifact (R39: official source only).  The mirror
# fallback list is generated at build time by ci/conan/build_and_test.sh, not
# stored here.
sources:
  url: "https://github.com/zephyr-im/zephyr/archive/refs/tags/3.1.2.tar.gz"
  sha256: "b323244aee7fa3cb25432e8d882dcfd231c9bc83092e7284924aec068bc50df4"
  strip_root: true

# All patches are modified-file diffs of the upstream Python 2 test harness.
# The library's C sources are used unmodified; the platform work (autotools
# bootstrap, config.sub OHOS triplet, compile_et template path) is done in
# conanfile.py where it belongs to the build environment rather than to the
# sources — see the recipe docstring and notes.md.
patches:
  - patch_file: "patches/0001-lib-Makefile.in-python3-check-split-and-install-mode.patch"
    patch_description: >-
      Run the upstream test suite with python3 (OHOS has no `python`), split
      `check` into the blocking API suite plus the reported-only
      documentation-style doctests, make the interpreter overridable
      (`PYTHON ?=`, `make check PYTHON=<launcher>`) so the sandbox can run the
      suite from an embedded launcher that has the library mapped, and install
      the shared library with mode 755 (upstream uses 644, which the OHOS
      loader refuses to load)
    patch_type: "portability"
  - patch_file: "patches/0002-python-zephyr_ctypes-port-to-python3.patch"
    patch_description: >-
      Port the ctypes bindings (python/zephyr_ctypes.py) to Python 3:
      print(), class-scope comprehension, encode text arguments for c_char_p
      parameters, and fall back to the process' global symbol scope
      (CDLL(None)) when the sandbox refuses dlopen() of shared objects in
      user directories
    patch_type: "portability"
  - patch_file: "patches/0003-lib-zephyr_tests-port-to-python3.patch"
    patch_description: >-
      Port the library API test suite (lib/zephyr_tests.py) to Python 3:
      syntax, bytes comparisons, pass/fail/skip accounting with a machine
      readable SUMMARY, and the new HarmonyOS consumer case.  The new case
      resolves the public symbols of the freshly built library either by path
      or, when the sandbox refuses dlopen() of user-directory objects, through
      the library mapped into the process (CDLL(None), probe symbol
      ZGetRealm); it reports SKIP with the loader error instead of failing when
      neither path is available
    patch_type: "portability"
  - patch_file: "patches/0004-lib-zephyr_run_doctests-port-to-python3.patch"
    patch_description: >-
      Port the doctest runner (lib/zephyr_run_doctests) to Python 3 and
      resolve zephyr_tests.txt relative to the script
    patch_type: "portability"
  - patch_file: "patches/0005-lib-zephyr_tests.txt-port-to-python3.patch"
    patch_description: >-
      Port the upstream doctests (lib/zephyr_tests.txt) to Python 3:
      print() call syntax, bytes literals for c_char_p arguments and for
      char* results
    patch_type: "portability"
