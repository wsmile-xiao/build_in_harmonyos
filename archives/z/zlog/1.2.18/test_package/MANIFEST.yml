# test_package/MANIFEST.yml — L0e upstream test declaration for zlog/1.2.18
#
# Declares where the test_package test cases originate so the local CI
# simulator (ci/conan/build_and_test.sh L0e gate) can confirm we are
# exercising the real upstream test surface, not a stand-in.

upstream:
  repository: https://github.com/HardySimpson/zlog
  tag: 1.2.18
  tests:
    - id: test_hello
      origin: test/test_hello.c
      description: >
        Upstream smoke test: calls zlog_init("test_hello.conf"),
        zlog_get_category("my_cat"), zlog_info, zlog_fini. Mirrors the
        same call sequence exercised by our adapted test_zlog.c.
      adapted_into: test_zlog.c
    - id: test_default
      origin: test/test_default.c
      description: >
        Upstream default-category flow. Adapted into test_zlog.c via
        the dzlog_init + dzlog_info path.
      adapted_into: test_zlog.c

adapted_tests:
  - file: test_zlog.c
    covers: [test_hello, test_default]
    rationale: >
      Upstream test_hello.c and test_default.c both require fixture
      *.conf files in test/ that are not bundled in the source tarball
      used by Conan. test_zlog.c inlines a minimal config via
      zlog_init_from_string + dzlog_init so the build is hermetic and
      the same APIs (zlog_init_from_string, zlog_get_category,
      zlog_info, dzlog_init, dzlog_info, zlog_fini) are still exercised
      end-to-end.

build_artifact_under_test: libzlog.so