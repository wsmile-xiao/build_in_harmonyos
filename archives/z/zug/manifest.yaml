# 软件级 manifest — zug
# 遵循 ARCHIVE-SPEC v2.0

software: zug

display: "zug (transducers for C++)"

description: "Composable, incremental, streamed reductions for C++ (header-only transducers)"

category: library

homepage: "https://github.com/arximboldi/zug"

license: BSL-1.0

# 常用构建系统
build_system: cmake

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.1.2":
    status: built
    build_date: "2026-09-19"

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "header-only 变体：package_type=header-library + package_id self.info.clear()，只打包 include/zug/** 与 licenses"
    - "上游 CMakeLists 不 find_package(Boost) 却在公开头文件裸用 #include <boost/...>，需 requires(boost, transitive_headers=True) 并把 boost include 以 -isystem 注入 CMAKE_CXX_FLAGS"
    - "50 个上游测试程序全部 EXCLUDE_FROM_ALL：必须 cmake.build(target=\"tests\") + cmake.test()，否则 header-only 包的 build() 静默不产出测试"
    - "不安装上游 install(EXPORT ZugConfig)，避免与 Conan 生成的 zug-config.cmake 形成两套包文件；由 cpp_info 提供 cmake_file_name=zug / zug::zug"
    - "上游非 MSVC 强制 -Werror：设 DISABLE_WERROR=ON，避免 OHOS clang15 的额外告警中断构建"
    - "补丁 0001 是上游构建缺陷（test/__inline_var_tests 漏链 Catch2::Catch2），不是平台差异，补丁内无平台宏"
  common_dependencies:
    - "boost/1.84.0"
