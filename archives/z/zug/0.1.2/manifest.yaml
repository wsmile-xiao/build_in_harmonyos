# 版本号
version: "0.1.2"

# 软件名
software: "zug"

# 编译状态
# published | built | failed | archived
# 本地已 conan-verify 通过并归档，制品由 CI 上传成功后平台更新为 published
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39：只写上游官方 https 源）
  url: "https://github.com/arximboldi/zug/archive/refs/tags/v0.1.2.tar.gz"

  # 源码校验和（固定 tag v0.1.2 的归档，真机 sha256sum 实测）
  sha256: "75ff666a4ce1615b3ca26abbb17b10f5cb5cf5f86c9c293ec430c34750d3ea27"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游 CMakeLists.txt + add_library(zug INTERFACE)）
  # 注：init-build 曾把它误判为 autotools，已按上游实际构建系统纠正为 cmake
  system: cmake

  # 配置选项列表（由 CMakeToolchain 注入）
  configure_options:
    - "-Dzug_BUILD_TESTS=ON"
    - "-Dzug_BUILD_EXAMPLES=OFF"
    - "-Dzug_BUILD_DOCS=OFF"
    - "-DDISABLE_WERROR=ON"
    - "-DCMAKE_CXX_STANDARD=17"

  # 编译依赖列表（格式: name/version）
  # boost 为运行期可见的公开头文件依赖（transitive_headers）；
  # catch2 仅 test_requires，用于在 build() 内构建上游官方测试。
  dependencies:
    - "boost/1.84.0"
    - "catch2/2.13.10-r0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-test-__inline_var_tests-CMakeLists.txt.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "zug 是 header-only INTERFACE 库，50 个上游测试程序全部 EXCLUDE_FROM_ALL，配方必须 cmake.build(target=\"tests\") 才会真正编译测试"
  - "上游 CMakeLists 不调用 find_package(Boost) 却在头文件里裸用 #include <boost/...>，需由配方把依赖 include 目录以 -isystem 注入 CMAKE_CXX_FLAGS"
  - "上游 test/__inline_var_tests/CMakeLists.txt 漏链 Catch2::Catch2（其余 49 个测试目标都有），是该包唯一的源码补丁"
  - "纯头文件包按 package_type=header-library + package_id self.info.clear() 打包，不装上游 install(EXPORT) 以免与 Conan 生成的 zug-config 产生双份 CMake 包文件"

# 测试统计（真机实测；数字来源见 test_package/MANIFEST.yml 与 reports/ 日志）
