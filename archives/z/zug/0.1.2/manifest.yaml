  upstream_total: 50          # CTest 注册的 50 个上游 Catch2 可执行文件
  upstream_catch2_cases: 194  # Catch2 用例数（逐程序汇总）
  upstream_assertions: 253    # Catch2 断言数（逐程序汇总）
  consumer_total: 22          # test_package 断言数（test_zug 16 + test_zug_ohos 6）
  total: 72
  passed: 72
  failed: 0

