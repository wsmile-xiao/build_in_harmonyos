# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 计数口径: zug 上游用 Catch2 v2，每个 .cpp 编译成一个独立可执行文件，
# 由 CMake 以 add_test("test/<output>") 注册进 CTest —— 共 50 个 CTest 用例。
# 括号内的「N 断言 / M 用例」是 Catch2 在每个可执行文件里报告的运行期数字，
# 由真机构建后的逐程序运行汇总得到（合计 253 断言 / 194 Catch2 用例）。

package: zug/0.1.2
homepage: "https://github.com/arximboldi/zug"

# 上游测试枚举命令
upstream_check_command: "ctest -N"

# conanfile.py build() 已集成上游测试（cmake.build(target="tests") + cmake.test()）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: test/compose.cpp
    source: zug-0.1.2/test/compose.cpp
    description: "comp 组合子与 operator| 的组合顺序/多参数/嵌套扁平化（15 断言 / 12 用例）"
    command: 'ctest -R "^test/compose$"'
  - file: test/into.cpp
