# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_zug.cpp
    description: "消费者测试：只用 <zug/...> 公开头文件做 comp/operator|/into/into_vector/transduce/reduce 与类型擦除管道，16 条断言"
    command: "./test_zug"
  - file: test_zug_ohos.cpp
    description: "鸿蒙专项测试：类型擦除 transducer 跨翻译单元传参、无状态管道复用一致性、101 元素深实例化折叠，6 条断言（源码 test_zug_ohos.cpp + test_zug_ohos_tu2.cpp）"
    command: "./test_zug_ohos"

# test_package 断言总数（16 + 6）
assertion_count: 22
