version: "1.14"
status: published
build_date: "2026-07-02"

source:
  url: "https://github.com/ocaml/Zarith/archive/refs/tags/release-1.14.tar.gz"
  sha256: "5db9dcbd939153942a08581fabd846d0f3f2b8c67fe68b855127e0472d4d1859"
  tar_format: tar.gz

build:
  system: custom-configure
  configure_options:
    - "-installdir <prefix>/lib/ocaml"
  dependencies:
    - "ocaml/4.14.1 (system)"
    - "gmp (system-installed at /storage/Users/currentUser/usr/local)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ZArith uses custom configure script (not standard autotools)"
  - "configure takes -installdir, not --prefix"
  - "GMP is system-installed, not Conan-managed"
