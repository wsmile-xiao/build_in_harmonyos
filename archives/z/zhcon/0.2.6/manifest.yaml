# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "config.guess 2001 老版本不支持 HarmonyOS，需替换为支持 __OHOS__/harmonyos 的新版并运行 patch-autotools-ohos.pl"
  - "config.status 的 mktemp 临时目录在 HMDFS 上 umask 077 创建的 0700 目录无法写入，需改 umask 022（E046 类权限陷阱）"
  - "老 autoconf 生成 configure 的 ptrdiff_t 检测在 C 模式无 stddef.h 误判 no，定义宏与 libc++ 冲突，需在 ohos 平台强制 ac_cv_type_ptrdiff_t=yes"
  - "usr/local 的 libintl.h 为 GLib proxy 头（宏映射 g_libintl_*）与 libintl.so 符号不匹配，应使用 conan 制品仓 gettext 标准头"
  - "zhcon 使用 termcap API（tgetent/tgetstr 等），需链接 ncursesw（宽字符版），configure.in 检测库应从 curses 改为 ncursesw"

