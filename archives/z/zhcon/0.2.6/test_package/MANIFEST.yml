# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: zhcon/0.2.6
homepage: "https://sourceforge.net/projects/zhcon/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 — zhcon 上游无自带测试（make check 各子目录均
# "Nothing to be done for 'check'"，configure/Makefile 无 TESTS/check_PROGRAMS 注册）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 zhcon 二进制存在且 --version/--help 可运行"
    command: "zhcon --version / zhcon --help"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5