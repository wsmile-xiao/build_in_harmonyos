package: zxing-cpp/2.3.0
homepage: "https://github.com/zxing-cpp/zxing-cpp"

# 上游 UnitTest 由上游 test/unit/CMakeLists.txt 声明并在设备任务目录中运行。
upstream_check_command: "cmake -S . -B native-unit-build -DBUILD_TESTING=ON -DZXING_UNIT_TESTS=ON && ctest --test-dir native-unit-build --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir <native-unit-build> --output-on-failure"

upstream_tests:
  - path: test/unit
    type: GoogleTest cases
    case_count: 283
    count_command: "native-unit-build/test/unit/UnitTest --gtest_list_tests | awk '/^  [^ ]/ {n++} END {print n}'"
    execution_command: "native-unit-build/test/unit/UnitTest --gtest_color=no"
    result: "283 passed; 0 failed; 0 skipped; 0 not_run"

test_package_tests:
  - file: test.cpp
    description: "Encode a QR code through the installed C++ API, decode it through ReadBarcode, and verify the version and format."
    command: "./test_zxing_cpp"
    assertion_count: 6

assertion_count: 6
