software: zxing-cpp
version: "2.3.0"
status: built
build_date: "2026-09-10"
build_system: cmake

source:
  url: "https://github.com/zxing-cpp/zxing-cpp/archive/refs/tags/v2.3.0.tar.gz"
  sha256: "64e4139103fdbc57752698ee15b5f0b0f7af9a0331ecbdc492047e0772c417ba"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF (default package option shared=False)"
    - "-DCMAKE_CXX_STANDARD=17 (device profile is gnu14; upstream target requires C++17)"
    - "-DZXING_EXAMPLES=OFF"
    - "-DZXING_C_API=OFF"
    - "-DZXING_UNIT_TESTS=OFF"
    - "-DZXING_BLACKBOX_TESTS=OFF"
    - "-DZXING_PYTHON_MODULE=OFF"
    - "-DZXING_USE_BUNDLED_ZINT=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游核心目标名为 ZXing，安装库为 libZXing.a，CMake target 为 ZXing::ZXing。"
  - "ZXING_C_API 会构建依赖 stb 的 ZXingCTest；OHOS 任务包只需核心 C++ API，因此关闭 C API 和 examples。"
  - "设备原生 UnitTest 需从源码临时构建 GoogleTest，不进入运行时依赖链。"
  - "上游 zxing.pc 会嵌入安装前缀；package 阶段改写为 pcfiledir 相对路径，保持 pkg-config 产物可重定位。"
