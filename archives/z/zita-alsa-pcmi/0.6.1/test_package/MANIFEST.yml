package: zita-alsa-pcmi/0.6.1
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"

# 上游无测试套件（已确认）：source/Makefile 只有 all/install/uninstall/clean 目标，
# 无 check/test 目标。实测 `make check` 输出 "No rule to make target 'check'"。
# 因此 upstream_test_in_build=false，conanfile.py build() 中不执行上游测试，
# 消费者验证由 test_package/ 完成。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_zita_alsa_pcmi.cpp
    description: "Links libzita-alsa-pcmi; checks zita_alsa_pcmi_*_version() against the header macros, constructs an Alsa_pcmi object (graceful STATE_FAIL on devices without audio hardware), and verifies fsamp/fsize/nfrag accessors."
    command: "test_zita-alsa-pcmi"

assertion_count: 8
