software: zsh-autocomplete
version: main
status: published
build_date: 2026-06-08
build_system: script
source_url: https://github.com/marlonrichert/zsh-autocomplete
configure_options: []
dependencies:
  - zsh >= 5.8 (with zsh/param/private and zsh/system modules)
notes: |
  Pure Zsh script plugin, no compilation required.
  Install by copying to ~/.zsh/plugins/ or /usr/share/zsh/plugins/
  
  Note: Requires full-featured zsh with optional modules:
  - zsh/param/private
  - zsh/system
  
  The musl-based zsh 5.9 in current environment lacks these modules.
install_prefix: ~/usr/local
files:
  - share/zsh/plugins/zsh-autocomplete/zsh-autocomplete.plugin.zsh
  - share/zsh/plugins/zsh-autocomplete/Functions/
  - share/zsh/plugins/zsh-autocomplete/Completions/
package: zsh-autocomplete-main-ohos-aarch64.tar.gz
package_size: 95K
