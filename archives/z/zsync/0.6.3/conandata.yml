patches:
  "0.6.3":
    - patch_file: "patches/0001-make-use-writable-temp-dir.patch"
      patch_description: "zsyncmake: fall back to a writable temporary directory because tmpfile() ignores TMPDIR and HarmonyOS /tmp is read-only"
      patch_type: "portability"
    - patch_file: "patches/0002-check-zsyncmake-update-expected-cksum.patch"
      patch_description: "check-zsyncmake: backport upstream a5cb28f, which corrects the stale expected cksum 4103379992 to 3456223344 after the make.c changes in 208ef06"
      patch_type: "upstream-backport"
