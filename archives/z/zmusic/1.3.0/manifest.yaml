# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.0"

# 软件名
software: "zmusic"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ZDoom/zmusic/archive/refs/tags/1.3.0.tar.gz"

  # 源码校验和
  sha256: "2eccd41e1cc9b38b3729ab94d65635719b2adc916de4ca9f8399ebceaee89f7f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DBUILD_SHARED_LIBS=ON"
  - "-DDYN_SNDFILE=OFF"
  - "-DDYN_MPG123=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - glib/2.88.3.1
  - libsndfile/1.2.2
  - mpg123/1.33.5

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "内置 thirdparty/fluidsynth 通过 pkg_search_module(GLIB REQUIRED glib-2.0) 强制依赖 glib，必须在 generate() 加 PkgConfigDeps（CMakeDeps 只产 cmake config，不产 .pc）"
  - "上游默认 DYN_SNDFILE/DYN_MPG123=ON 走运行时 dlopen；OHOS 上第三方 .so 的 dlopen 不可靠，需置 OFF 改为链接期绑定，否则解码器形同虚设"
  - "OHOS/HMDFS 上 conan self.run 跑 cmake --build 会必现\"泛 Error 1 但无任何 error:\" 的静默失败；同一命令手工或 subprocess 执行均成功，属环境资源竞争，可靠做法是 subprocess + 有节制的重试（详见 knowledge/drafts/DRAFT-zmusic-1.3.0-ohos-conan-self-run-silent-build-failure）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
