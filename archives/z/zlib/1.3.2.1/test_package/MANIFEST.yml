# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求此文件存在）
#
# zlib-1.3.2 Makefile 测试目标（Makefile.in，--static 配置后由 configure 重写）：
#   check → test → all teststatic test64          （--static 下 testshared 被移除）
#   teststatic:  echo hello world | ./minigzip | ./minigzip -d && ./example
#   test64:      echo hello world | ./minigzip64 | ./minigzip64 -d && ./example64
#   cover:       ./infcover（需要 gcov/coverage 工具链，非 make check 默认目标）

package: zlib/1.3.2.1
homepage: "https://zlib.net/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试程序（zlib-1.3.2 Makefile: check → test → teststatic + test64）
upstream_tests:
  - file: example.c
    source: zlib-1.3.2.tar.gz/test/example.c
    description: "zlib 官方完整功能演示 (compress/uncompress/compress2/uncompress2/deflate/inflate/gzread/gzseek/gzgets/字典/large_*)。teststatic 目标运行，输出 '*** zlib test OK ***'。"
    command: "./example"
  - file: minigzip.c
    source: zlib-1.3.2.tar.gz/test/minigzip.c
    description: "gzip 命令行往返压缩/解压 (echo hello world | ./minigzip | ./minigzip -d)。teststatic 目标运行。"
    command: "./minigzip"
  - file: example64.c
    source: zlib-1.3.2.tar.gz/test/example.c
    description: "64 位大文件模式 (D_FILE_OFFSET_BITS=64) 完整功能演示。test64 目标运行，输出 '*** zlib 64-bit test OK ***'。"
    command: "./example64"
  - file: minigzip64.c
    source: zlib-1.3.2.tar.gz/test/minigzip.c
    description: "64 位模式 gzip 往返压缩/解压。test64 目标运行。"
    command: "./minigzip64"

# test_package 中自带的测试（消费者视角验证, R34: 真实调用 zlib API + E539/E541 PIC-DSO 探针）
test_package_tests:
  - file: test.c
    description: "消费者视角: zlibVersion/compress/uncompress 往返/compress2/uncompress2/adler32/crc32/deflate+inflate/gzopen+gzread 全 API 冒烟测试"
    command: "./test_probe"
  - file: pic_probe.c
    description: "鸿蒙特有(E539/E541): 把被测包静态 libz.a 用 clang -shared -fPIC 链成共享库, 验证无 R_AARCH64 relocation、无 TEXTREL、不拉入运行期 libz.so"
    command: "clang -shared -fPIC pic_probe.c libz.a -o libzpic_probe.so && readelf -d libzpic_probe.so"
  - file: probe_main.c
    description: "鸿蒙特有(E539/E541): dlopen 链好的 libzpic_probe.so 真实调用 zlib-backed 往返函数并校验数据完整性"
    command: "./probe_main"

# 测试断言总数（近似值, 用于质量评估）
# example.c 中显式检查点：CHECK_ERR 宏 32 处 + test_gzio 中 11 处 if 检查
# （teststatic 与 test64 各运行一次 example/minigzip）
assertion_count: 43
