software: zlib
version: '1.3.2.1'
status: built
build_date: '2026-09-24'
build_system: makefile

source:
  url: 'https://www.zlib.net/zlib-1.3.2.tar.gz'
  sha256: 'bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16'
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - 'CFLAGS="-fPIC -O2"'
    - '--static'
    - '--prefix=/'
  cc: clang
  cc_path: '/data/service/hnp/bin/clang (aarch64-unknown-linux-ohos, clang 15.0.4)'
  target: 'HarmonyOS PC (os=OHOS, arch=armv8/aarch64)'
  make_targets: 'make -j1 && make check'

patches_applied: []

knowledge_gained:
  - 'zlib 是系统同名库（OHOS SDK sysroot 自带 /usr/lib/aarch64-linux-ohos/libz.so），必须静态编译（R26），且静态库必须 -fPIC（E541）：非-PIC libz.a 链进共享库报 R_AARCH64_ADR_PREL_PG_HI21 relocation（实测证据 logs/pic-probe-nopic-fail.log）'
  - 'make check（官方测试套件）在 --static 下 = teststatic + test64（configure 重写 test: all teststatic test64，移除 testshared），全部通过（logs/make-check.log）'
  - 'zlib-1.3.2 configure 默认向 CFLAGS 注入 -fPIC；配方显式 CFLAGS="-fPIC -O2" 保证确定性，不依赖 configure 行为'
  - 'test_package 增加鸿蒙特有 PIC-DSO 探针（E539）：clang -shared -fPIC 把被测包 libz.a 链成 DSO，校验无 TEXTREL 且 NEEDED 仅 libc.so'
