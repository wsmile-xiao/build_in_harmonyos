software: zlib
version: '1.3.2'
status: built
build_date: '2026-09-25'
build_system: makefile

source:
  url: 'https://www.zlib.net/zlib-1.3.2.tar.gz'
  sha256: 'bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16'
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - 'CFLAGS="-fPIC -O2"'
    - '--static'
    - '--prefix=/'
  cc: clang

patches_applied: []

knowledge_gained:
  - 'zlib 1.3.2 与 1.3.1 相同：静态库必须 -fPIC 才能被下游链进共享库（libcairo.so 等），沿用 1.3.1.1 经验'
  - './configure --static 会把上游 Makefile 的 test: 目标改写为 all teststatic test64（SHAREDLIB 为空），make check 实际跑 teststatic + test64'
  - '沙箱内 https://www.zlib.net 被 MITM 拦截（TLS handshake timeout / 0 字节），须走 http://www.zlib.net 下载（sha256 与官方一致）；conandata.yml 保留官方 https URL（CI 环境可用）'
  - 'make check 之外的上游样例 infcover（test/infcover.c）可手工以 make cover 的编译方式执行，输出 76 条 inflate/inflateBack 用例行（exit 0）'
  - 'test_package 增加鸿蒙特有用例 test_ohos.c + ohos_pic_probe.c：__OHOS__/HarmonyOS 运行时/真实 API 往返/PIC 探针 dlopen，共 14 项检查'
