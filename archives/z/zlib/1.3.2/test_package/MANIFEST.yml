# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: zlib/1.3.2
homepage: "https://zlib.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# ./configure --static 会把上游 Makefile 的 `test:` 目标改写为 `all teststatic test64`
# （SHAREDLIB 为空），因此 make check 实际运行 teststatic + test64。
upstream_tests:
  - file: example.c
    source: zlib-1.3.2.tar.gz/test/example.c
    description: "zlib 官方完整功能演示 (compress/uncompress/deflate/inflate/gzread/gzseek/字典)"
    command: "./example"
    target: "teststatic (make check)"
  - file: minigzip.c
    source: zlib-1.3.2.tar.gz/test/minigzip.c
    description: "gzip 命令行往返压缩/解压 (echo hello world | ./minigzip | ./minigzip -d)"
    command: "./minigzip"
    target: "teststatic (make check)"
  - file: example64.c
    source: zlib-1.3.2.tar.gz/test/example.c
    description: "64 位大文件模式 (D_FILE_OFFSET_BITS=64) 完整功能演示"
    command: "./example64"
    target: "test64 (make check)"
  - file: minigzip64.c
    source: zlib-1.3.2.tar.gz/test/minigzip.c
    description: "64 位模式 gzip 往返压缩/解压"
    command: "./minigzip64"
    target: "test64 (make check)"
  - file: infcover.c
    source: zlib-1.3.2.tar.gz/test/infcover.c
    description: "inflate 覆盖测试 (76 条 inflate/inflateBack 用例行)；上游 make check 不含，采用 make cover 的编译方式手工执行"
    command: "./infcover"
    target: "make cover 的测试程序（make check 之外的上游样例）"

# test_package 中自带的测试 (消费者视角验证, R34: 真实调用 zlib API)
test_package_tests:
  - file: test.c
    description: "消费者视角: 调用 zlibVersion() 验证头文件/静态库可用"
    command: "./test_probe"
  - file: test_ohos.c
    description: "鸿蒙特有测试: __OHOS__ 目标校验 + HarmonyOS 运行时识别 + 真实 API 往返 + PIC 探针 dlopen"
    command: "./test_ohos ./libz_ohos_probe.so"
    ohos_specific: true
    checks: 14
  - file: ohos_pic_probe.c
    description: "鸿蒙特有测试: 由静态 libz.a 编成的共享库探针（验证 libz.a 为 PIC，可被下游 .so 吸收）"
    command: "clang -shared -fPIC ohos_pic_probe.c -o libz_ohos_probe.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（本仓库要求 ≥1）
ohos_specific_tests:
  files:
    - test_ohos.c
    - ohos_pic_probe.c
  check_count: 14
  run_command: "./test_ohos ./libz_ohos_probe.so"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 37
