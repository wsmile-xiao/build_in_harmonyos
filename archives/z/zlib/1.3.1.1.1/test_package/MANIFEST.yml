package: zlib/1.3.1.1.1
homepage: https://zlib.net/
upstream_test_in_build: true
upstream_test_command: make check
upstream_tests:
  - file: example.c
    description: zlib upstream compression and decompression example
    command: ./example
  - file: infcover.c
    description: zlib upstream inflate coverage test
    command: ./infcover
test_package_tests:
  - file: test_zlib.c
    description: Compress and restore a string through the installed zlib library
    command: ./test_zlib
assertion_count: 2
