knowledge_gained:
  - "zlib/1.3.1, zlib/1.3.1.1 and zlib/1.3.1.1.1 already exist; issue #1829 bump to suffix version zlib/1.3.1.1.1.1 after R37 conflict."
  - "The package remains static-only to avoid colliding with system libz.so."
