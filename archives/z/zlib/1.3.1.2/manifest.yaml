version: "1.3.1.2"
status: built
build_date: "2026-09-08"

source:
  url: "https://zlib.net/fossils/zlib-1.3.1.tar.gz"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "--static"
    - "--prefix=/"
  cc: clang

patches_applied: []

knowledge_gained:
  - "configure shell 脚本在 HarmonyOS 上原生支持，无需补丁"
  - "Makefile 和 zconf.h 均为 configure 生成的文件，不应补丁 (R6)"
  - "编译器路径从 Conan conf 获取 (R33)，CONFIG_SHELL 从 profile [buildenv] 获取"
  - "所有测试通过（zlib test + zlib 64-bit test）"
