# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: zlib/1.3.1.2
homepage: https://zlib.net/

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试程序
upstream_tests:
  - file: example.c
    source: zlib-1.3.1.tar.gz/example.c
    description: "zlib 官方完整功能演示 (compress/uncompress/deflate/inflate)"
    command: "./example"
  - file: infcover.c
    source: zlib-1.3.1.tar.gz/infcover.c
    description: "inflate 解压器覆盖率测试"
    command: "./infcover"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "compress + uncompress 往返验证"
    command: "./test_zlib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 37
