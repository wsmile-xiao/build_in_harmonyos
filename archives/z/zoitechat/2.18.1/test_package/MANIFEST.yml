    command: "meson test -C . 'Theme Access Routing Tests'"
  - file: src/fe-gtk/theme/tests/test-theme-gtk3-settings.c
    source: zoitechat-2.18.1/src/fe-gtk/theme/tests/test-theme-gtk3-settings.c
    description: "GTK3 设置读写"
    command: "meson test -C . 'Theme GTK3 Settings Tests'"
  - file: src/fe-gtk/theme/tests/test-theme-preferences-gtk3-populate.c
    source: zoitechat-2.18.1/src/fe-gtk/theme/tests/test-theme-preferences-gtk3-populate.c
    description: "主题首选项 GTK3 填充"
    command: "meson test -C . 'Theme Preferences GTK3 Populate Tests'"
  - file: plugins/fishlim/tests/tests.c
    source: zoitechat-2.18.1/plugins/fishlim/tests/tests.c
    description: "FiSH 加密插件（TAP 协议，依赖 openssl）"
    command: "meson test -C . 'Fishlim Tests'"

