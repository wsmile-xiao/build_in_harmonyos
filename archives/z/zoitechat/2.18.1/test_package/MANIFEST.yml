package: zoitechat/2.18.1
homepage: "https://zoitechat.org"

upstream_check_command: "meson test -C build"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C ."
# 上游 meson 注册的测试（meson.build 内 test() 调用，共 14 处）
upstream_tests:
  - file: src/common/tests/test-gtk3-theme-service.c
    source: zoitechat-2.18.1/src/common/tests/test-gtk3-theme-service.c
    description: "GTK3 主题服务：继承链解析、主题导入冲突/暗色检测、XDG 数据目录发现、归档解码错误分支（14 个 g_test 用例）"
    command: "meson test -C . 'GTK3 Theme Service Tests'"
  - file: src/fe-gtk/theme/tests/test-theme-manager-policy.c
    source: zoitechat-2.18.1/src/fe-gtk/theme/tests/test-theme-manager-policy.c
    description: "主题管理器策略：token 往返、模式解析、按模式路由颜色、监听器注册/注销（6 个 g_test 用例）"
    command: "meson test -C . 'Theme Manager/Policy Tests'"
  - file: src/fe-gtk/theme/tests/test-theme-manager-dispatch-routing.c
    source: zoitechat-2.18.1/src/fe-gtk/theme/tests/test-theme-manager-dispatch-routing.c
    description: "主题管理器分发路由"
    command: "meson test -C . 'Theme Manager Dispatch Routing Tests'"
  - file: src/fe-gtk/theme/tests/test-theme-manager-auto-refresh.c
    source: zoitechat-2.18.1/src/fe-gtk/theme/tests/test-theme-manager-auto-refresh.c
    description: "主题管理器自动刷新"
    command: "meson test -C . 'Theme Manager Auto Refresh Tests'"
  - file: src/fe-gtk/theme/tests/test-theme-application-input-style.c
    source: zoitechat-2.18.1/src/fe-gtk/theme/tests/test-theme-application-input-style.c
    description: "主题应用输入样式"
    command: "meson test -C . 'Theme Application Input Style Tests'"
  - file: src/fe-gtk/theme/tests/test-theme-runtime-persistence.c
    source: zoitechat-2.18.1/src/fe-gtk/theme/tests/test-theme-runtime-persistence.c
    description: "主题运行期持久化"
    command: "meson test -C . 'Theme Runtime Persistence Tests'"
  - file: src/fe-gtk/theme/tests/test-theme-access-routing.c
