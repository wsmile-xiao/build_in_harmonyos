version: "2.18.1"
software: "zoitechat"
status: built
build_date: "2026-10-01"
build_system: meson

source:
  url: "https://github.com/ZoiteChat/zoitechat/archive/refs/tags/zoitechat-2.18.1.tar.gz"
  tar_format: tar.gz
  sha256: "961bb3e5b6511c7d610292d55f9d6db6ab4328b82609d39982caf65020b522a6"

build:
  system: meson
  configure_options:
    - "-Dgtk-frontend=true"
    - "-Dtext-frontend=false"
    - "-Dappindicator=disabled"
    - "-Dtls=enabled"
    - "-Dlibcanberra=enabled"
    - "-Ddbus=disabled"
    - "-Dplugin=true"
    - "-Dwith-checksum=true"
    - "-Dwith-fishlim=true"
    - "-Dwith-lua=lua-5.4"
    - "-Dwith-python=python3"
    - "-Dwith-perl=false"
    - "-Dwith-sysinfo=false"
    - "-Dinstall-appdata=false"
  cc: clang

patches_applied:
  - "0001-data-misc-appstreamcli-scope.patch"

knowledge_gained:
  - "PkgConfigDeps 以 conan 包名命名 .pc，上游 meson 查询的是上游 pkg-config 名：libcanberra 包只产出 canberra.pc（需补 libcanberra.pc 别名）"
  - "PkgConfigDeps 的 gmodule-2.0.pc 缺 gmodule_supported=true 标记；meson 依赖 'gmodule-2.0' 时需补该标记"
  - "制品仓 python 包只产出 python.pc，上游 meson 先查 python3-embed 再退 python3（需补两个别名）"
  - "glib 构建期工具必须同时写入 meson [binaries] 段：本 profile 的 [buildenv] 用 '=+' 把 /data/service/hnp/bin 前置到 PATH，仅靠 PATH 注入会被系统老版本 glib 工具（2.38.2，不支持 --output）压过"
  - "原生构建（worker=OHOS/aarch64）下制品仓 glib 包内的 ELF 工具可直接复制使用，但需 binary-sign-tool 签名"
  - "meson gnome 模块通过 pkg-config 变量查询构建工具（glib_compile_resources/gdbus_codegen），必须向 gio-2.0.pc 注入这些变量，否则 'Could not get pkg-config variable'"
  - "上游 declare_dependency 未传播 openssl/libcanberra 的 include 路径（Linux 下靠系统 /usr/include 侥幸通过），OHOS 下需在配方层显式注入 -I（R8：不改上游源码）"
  - "上游依赖 glibc 默认特性宏（_DEFAULT_SOURCE）：gethostbyname/kill/gmtime_r 在 OHOS musl 下需显式 -D_GNU_SOURCE，否则被 -Werror=implicit-function-declaration 判错"
  - "PkgConfigDeps 生成的 glib-2.0.pc 未声明 -lintl，而 g_libintl_gettext 位于 libintl，链接期需补（gtk 配方同款）"
  - "上游 data/misc/meson.build 存在变量作用域缺陷：appstreamcli 定义在 'if install-appdata' 块内却在 'if plugin' 块引用，install-appdata=false 时 meson 直接报 Unknown variable name（已补丁修复）"
  - "上游 meson 注册 14 处 test()，本环境实际注册 11 个（appstreamcli/desktop-file-validate 缺失、install-plugin-metainfo=false 各 1 个条件不成立）"
  - "上游全部 CI workflow 均不运行测试套件、仓库 Makefile 无 check 目标：11 个注册测试中 6 个长期未验证，实测暴露 4 个测试自身逻辑缺陷（与 OS 无关）"
  - "被测包 package_type=application 时 Conan 不传递其 requires：test_package 顶层 dependencies.host 会缺少 openssl/libarchive/lua，需在 test_package 中显式声明运行时依赖"

references:
  - knowledge/graph/index.tsv
