software: zoitechat
display: "ZoiteChat"
description: "GTK3 IRC 客户端（HexChat 后继分支），支持 Python/Perl/Lua 脚本、插件 API、SASL 与拼写检查"
category: gui
homepage: "https://zoitechat.org"
license: GPL-2.0-only
build_system: meson

ohos_adaptation:
  key_points:
    - "上游为 meson 构建（meson.build + meson_options.txt，c_std=c17）"
    - "GTK3 前端消费制品仓 gtk/3.24.43（broadway HTML5 后端），无 X11/Wayland 原生显示"
    - "PkgConfigDeps 生成的 .pc 名称与上游 meson dependency() 查询名存在差异，需在 generate() 中补别名：gmodule-2.0.pc（glib 只产出 gmodule-2.0.pc，需 gmodule_supported 标记）、canberra.pc → libcanberra.pc、lua-5.4.pc → lua-5.4 查询名"
    - "data/zoitechat.gresource.xml 对全部 PNG 无条件写 preprocess=to-pixdata，制品仓 gdk-pixbuf 不带 gdk-pixbuf-pixdata 构建期工具；改为在 configure 后剥除该属性（与 gtk 配方同款手法），运行时经标准 GdkPixbuf PNG loader 加载"
    - "meson 构建期工具（glib-mkenums/glib-genmarshal/gdbus-codegen/glib-compile-resources）以 native 包装调用（同 gtk/gdk-pixbuf 方案）"
    - "上游 meson 注册 14 个测试；po/validate-textevent-translations 在本环境因缺 msgmerge 不可用，data/misc 的 2 个校验测试因缺 appstreamcli/desktop-file-validate 被上游 find_program(required:false) 自动跳过"
    - "官方源 github.com tag 归档（R39）"
  common_dependencies:
    - glib
    - gtk
    - openssl
    - libcanberra
    - libarchive
    - lua
    - perl
    - python

versions:
  "2.18.1":
    status: built
    build_date: "2026-10-01"
