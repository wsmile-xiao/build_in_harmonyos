sources:
  url:
    - "https://codeload.github.com/zigtools/zls/tar.gz/refs/tags/0.15.1"
    - "https://github.com/zigtools/zls/archive/refs/tags/0.15.1.tar.gz"
    - "https://gh-proxy.com/https://github.com/zigtools/zls/archive/refs/tags/0.15.1.tar.gz"
  sha256: "40a4559c3007ed9333769fc3e111ed466403b53f31ad9242874a62ab385b331b"
  # Required: the codeload URL basename has no .tar.gz extension, and
  # conan.tools.files.get() dispatches on filename extension (would try
  # zipfile and die with BadZipFile — build-chain-pitfalls entry).
  filename: "zls-0.15.1.tar.gz"

# Zig package-manager dependencies declared by upstream build.zig.zon
# (non-lazy ones only; `tracy` is lazy and never fetched because
# -Denable-tracy is not used). They are downloaded here with pinned
# SHA256 and referenced from build.zig.zon via local .path entries
# (see patches/0001-vendor-zig-dependencies-as-local-paths.patch) so
# neither `zig build` nor `zig build test` performs network fetches.
zig_dependencies:
  known-folders:
    url:
      - "https://github.com/ziglibs/known-folders/archive/92defaee76b07487769ca352fd0ba95bc8b42a2f.tar.gz"
      - "https://gh-proxy.com/https://github.com/ziglibs/known-folders/archive/92defaee76b07487769ca352fd0ba95bc8b42a2f.tar.gz"
    sha256: "b2248ce99958d17023fcd60c606fa20c69f089ff6877aa23aecda57824be7844"
    filename: "known-folders-92defaee76b07487769ca352fd0ba95bc8b42a2f.tar.gz"
  diffz:
    url:
      - "https://github.com/ziglibs/diffz/archive/a20dd1f11b10819a6f570f98b42e1c91e3704357.tar.gz"
      - "https://gh-proxy.com/https://github.com/ziglibs/diffz/archive/a20dd1f11b10819a6f570f98b42e1c91e3704357.tar.gz"
    sha256: "c4fe9d0624ca5a9499fc4592e404eedb94934491ef214e5199be61c441d7c074"
    filename: "diffz-a20dd1f11b10819a6f570f98b42e1c91e3704357.tar.gz"
  lsp-kit:
    url:
      - "https://github.com/zigtools/lsp-kit/archive/576e9405b1ab22c17c0f9318feed3278aa66b0ea.tar.gz"
      - "https://gh-proxy.com/https://github.com/zigtools/lsp-kit/archive/576e9405b1ab22c17c0f9318feed3278aa66b0ea.tar.gz"
    sha256: "dd20a2951144f9c755c282853542e4f417e60c6673817d044067192444bfdabe"
    filename: "lsp-kit-576e9405b1ab22c17c0f9318feed3278aa66b0ea.tar.gz"

patches:
  - patch_file: "patches/0001-vendor-zig-dependencies-as-local-paths.patch"
    patch_description: "Reference the pinned Zig package dependencies from vendored local paths so Zig performs no network fetches on OHOS runners"
    patch_type: "portability"
