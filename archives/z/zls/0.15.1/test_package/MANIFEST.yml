# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: zls/0.15.1
homepage: "https://github.com/zigtools/zls"

# 上游测试命令（zig build 体系，无 make check；zig build test 为官方测试入口）
# 已在 conanfile.py build() 内真实执行（upstream_test_in_build: true）
upstream_check_command: "zig build test"
upstream_test_in_build: true
upstream_test_command: "zig build test -Doptimize=ReleaseSafe"

# zig build test 实际运行的测试（native/host 构建下全部启用；实测计数来自
# OHOS runner conan create 日志）
upstream_tests:
  - file: tests/tests.zig
    source: zls-0.15.1/tests/tests.zig
    description: "单元测试主套件：417 个 test 块，实测 409 passed / 8 skipped / 0 failed（8 个 skip 均为上游无条件 `if (true) return error.SkipZigTest` TODO 跳过：7 个在 tests/lsp_features/completion.zig、1 个在 tests/lsp_features/definition.zig，与平台无关）"
    command: "zig build test"
  - file: src (module tests)
    source: zls-0.15.1/src（src 模块内嵌测试，含 analyser/Uri/offsets/build_runner.check 等）
    description: "src/ 模块内嵌单元测试：实测 All 92 tests passed"
    command: "zig build test"
  - file: tests/analysis
    source: zls-0.15.1/tests/analysis（23 个用例文件）
    description: "分析器注解用例（analysis_check 逐用例运行）：实测 23/23 success"
    command: "zig build test"
  - file: tests/build_runner_cases
    source: zls-0.15.1/tests/build_runner_cases（10 个用例）
    description: "build runner 集成用例（host target 下逐用例 spawn zig build）：实测 10/10 success"
    command: "zig build test"

# test_package 中自带的测试（消费者视角验证可执行文件）
test_package_tests:
  - file: test.sh
    description: "zls --version == 0.15.1、zls env known-folders 路径解析、静态 ELF 检查、LSP stdio initialize/shutdown/exit 真实握手（OHOS 特有断言：签名 ELF 可被执行、无宿主 .so 闭包、OHOS 下 LSP 服务真实可用）"
    command: "bash test.sh"

# 测试断言总数（可由上列自列项复算：417 + 92 + 23 + 10 = 542；其中通过 534、
# 上游无条件 skip 8 —— 417(409 passed+8 skipped) + 92 + 23 + 10）
assertion_count: 542
