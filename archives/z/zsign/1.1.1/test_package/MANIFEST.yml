# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点（R51 三步法，本包 1.1.1 tag 源码树）:
#   test/ 目录含 linux/test.sh、macos/test.sh、windows/test.ps1 三个驱动脚本，
#   共享 test/dylib/ 下的 demo dylib 与 test/ipa/、test/assets/ 语料。
#   无 ctest / pytest / make check 注册（纯 Makefile 工程，构建目标只有
#   release/debug，make -n check 报 "No rule to make target 'check'"）。
#   linux/test.sh 是唯一 Linux 入口，但按上游自身设计：test/ipa/、test/assets/
#   被 .gitignore 有意排除（语料不入版本库），且脚本以 -i 结尾调用
#   ideviceinstaller 安装签名包到 USB 连接的 iOS 设备——安装步在任何无 iOS
#   设备的 Linux 环境（含上游自己的 CI）都必然 rc=-1/FAILED。
#   本机另受鸿蒙平台怪癖影响：zsign 默认解压临时目录 /tmp 在 HMDFS 上只读，
#   脚本未传 -t 指定可写临时目录，解压步即失败。
#   ⇒ 字面执行 test/linux/test.sh 输出 `!!!FAILED!!!`（如上双重因素，逐项
#     归因见 ../notes.md「R51 上游测试三步法」）；签名核心功能以 -t 指定
#     可写临时目录、去掉设备依赖的 -i 安装步后 100% 等价复现（7/7，见
#     ../notes.md 功能等价验证清单）。

package: zsign/1.1.1
homepage: "https://github.com/zhlynn/zsign"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 纯 Makefile 工程：无 check 目标，唯一测试入口是 test/linux/test.sh 驱动脚本
upstream_check_command: "test/linux/test.sh"

# conanfile.py build() 方法中是否已集成上游测试
# test.sh 依赖被 .gitignore 排除的 ipa/p12 语料与 iOS 设备，无法在构建期集成
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/linux/test.sh
    source: zsign-1.1.1/test/linux/test.sh
    description: "IPA 重签名 + ideviceinstaller 安装冒烟（语料被上游 .gitignore 排除，安装步需 iOS 设备；本机 /tmp 只读阻断解压——字面执行 FAILED，双重因素逐项归因见 notes.md，签名路径 100% 等价复现通过）"
    command: "bash test/linux/test.sh"
  - file: test/macos/test.sh
    source: zsign-1.1.1/test/macos/test.sh
    description: "macOS 平台驱动脚本（需 macOS + Apple 开发证书，本包不适用）"
    command: "test/macos/test.sh"
  - file: test/windows/test.ps1
    source: zsign-1.1.1/test/windows/test.ps1
    description: "Windows 平台驱动脚本（需 Windows + PowerShell，本包不适用）"
    command: "test/windows/test.ps1"
  - file: test/dylib/bin/demo1.dylib, test/dylib/bin/demo2.dylib
    source: zsign-1.1.1/test/dylib/bin/
    description: "上游自带真实 arm64 Mach-O 测试样本（dylib），test.sh 语料中被 .gitignore 收录的部分，直接可用：已用于 adhoc 签名与 dylib 注入等价验证"
    command: "zsign -a test/dylib/bin/demo1.dylib"

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制)
test_package_tests:
  - file: test_zsign.sh
    description: "消费者测试 — 版本报告 + 对真实 arm64 Mach-O 固件(macho_fix.b64, 上游同构样本)adhoc 签名并校验签名段嵌入 + 幂等重签"
    command: "bash test_zsign.sh <installed-zsign>"

# 测试断言总数 (消费者测试 4 项 + 上游等价验证 7 项, 见 notes.md)
assertion_count: 11
