package: zsign
software: zsign
version: "1.1.1"
homepage: "https://github.com/zhlynn/zsign"
license: MIT
status: built
build_system: makefile
build_date: "2026-09-21"
conan_ref: "zsign/1.1.1"

source:
  url: "https://github.com/zhlynn/zsign/archive/refs/tags/v1.1.1.tar.gz"
  sha256: "5e1a24116ca6875d6786703a7fb129d6afde06822f6a859de47d44eff4ad7c05"
  tar_format: tar.gz
  upstream_release_url: "https://github.com/zhlynn/zsign/releases/tag/v1.1.1"
  upstream_tag: "v1.1.1"
  upstream_commit: null
  release_artifact: >-
    GitHub tag 归档 https://github.com/zhlynn/zsign/archive/refs/tags/v1.1.1.tar.gz
    （HTTP 200，gzip 魔术 1f 8b，顶层目录 zsign-1.1.1/，241 个文件），
    sha256 5e1a24116ca6875d6786703a7fb129d6afde06822f6a859de47d44eff4ad7c05
    （下载件实测与 conandata.yml 声明一致）。上游无 release 资产附件、无
    PGP 签名，tag 归档即权威源；init-build 阶段下载件哈希已核对。

build:
  system: makefile
  configure_options: []
  make_options:
    - "CC=$(tools.build:compiler_executables:c)"
    - "CXX=$(tools.build:compiler_executables:cpp)"
    - "VERSION=1.1.1"
    - "OPENSSL_INCLUDE=-I<openssl:cpp_info.includedirs>"
    - "OPENSSL_LIB=-L<openssl:cpp_info.libdirs> -lcrypto"
    - "-j1 (R9)"
  workdir: "build/linux（上游 Makefile 以 ../../ 相对路径解析源码与输出，必须在该目录下调用）"
  dependencies:
    - "openssl/3.5.6"
  bundled_dependencies:
    - zlib（上游源码树内嵌，build/linux 一并编译，静态入二进制）
    - minizip（上游源码树内嵌，同上）
  cc: clang
  cxx: clang++
  env_vars: []

# 零补丁：1.1.1 源码树在 aarch64-linux-ohos（clang 15）零修改编译通过
# （干净探索构建 bin/zsign 4.6MB，libcrypto 静态链接），本列表为空。
patches_applied: []

knowledge_gained:
  - "上游 Makefile 无 configure/cmake，CXXFLAGS 硬编码 -std=c++11 -O3，源码/输出全部经 ../../ 相对路径解析，make -C build/linux 是唯一正确调用位；输出落在 <src>/bin/zsign（BINDIR=../../bin）。"  # knowledge_ref: []
  - "Makefile 以 git describe 取版本号，release tarball 无 .git 时回退 0.0.0-dev——必须显式传 VERSION=1.1.1，否则 zsign -v 误报版本。"  # knowledge_ref: []
  - "zsign 只用 libcrypto（CMS/PKCS12/OCSP/X.509）不用 libssl；src/signing.cpp 无条件调用 OSSL_PROVIDER_load，OpenSSL 1.x 头文件不兼容，需 OpenSSL 3.x（选用仓内 openssl/3.5.6）。链接静态 libcrypto.a 后二进制 4.6MB 无运行时 so 依赖。"  # knowledge_ref: []
  - "HMDFS 上 make -jN 的 jobserver mkfifo 报错（mktemp: No such file or directory），make -j1 规避（与 R9 一致）。"  # knowledge_ref: E074
  - "zsign 默认把待签 IPA 解压到 /tmp（ZFile::GetTempFolder），HMDFS 挂载的 /tmp 只读导致 'Unzip failed'——鸿蒙平台必须用 -t 指定可写临时目录（E002 族）。"  # knowledge_ref: E002
  - "上游 test/linux/test.sh 按设计需要 test/ipa/、test/assets/ 语料（被上游 .gitignore 有意排除）与 ideviceinstaller + USB 连接的 iOS 设备（-i 安装步，失败即 rc=-1）；且脚本未传 -t，在鸿蒙 /tmp 只读下解压步即失败——字面执行 FAILED 是上游脚本对任何无设备 Linux 环境的固有语义，非鸿蒙特有回归。"  # knowledge_ref: []
  - "openssl 3.5 系 PKCS12 解析对密码错误报 'PKCS12_parse: mac verify failure'，并连带打印 legacy provider 加载失败噪声（错误队列累积）；p12 用现代 AES-256-CBC+PBKDF2 导出时实际不需要 legacy.so。"  # knowledge_ref: []

tests:
  upstream:
    command: "test/linux/test.sh（唯一 Linux 测试入口；无 make check/ctest/pytest）"
    counting_unit: "test.sh 驱动的端到端冒烟（签名+安装）"
    unit_programs: 1
    declared_n_head_lower_bound: 1
    executed: 1
    passed: 0
    failed: 1
    skipped: 0
    not_run: 0
    note: >-
      字面执行输出 `../ipa/test.ipa: !!!FAILED!!!`（上游脚本自身的 OK/FAILED
      口径）。失败双重因素逐项归因（因子实验均带完整证据，见 notes.md）：
      ① 平台因素——脚本未传 -t，zsign 默认解压到 /tmp，HMDFS 只读阻断
      （去除 -i 单独签名实验复现）；② 设备因素——脚本 -i 结尾调用
      ideviceinstaller 装机到 USB iOS 设备，本机无设备（且语料 p12 需空密码、
      实机重建后已确认），任何无 iOS 设备的 Linux 同样 FAILED（上游代码
      InstallSignedIpa 对 WEXITSTATUS!=0 返回 false → main 返回 -1）。
      签名核心功能以等价路径验证（见 adapted）：7/7 全部通过，覆盖 test.sh
      的全部签名语义（解压→替换签名→回包）。
  adapted:
    command: "Conan test_package"
    cases: 4
    passed: 4
    pass_rate: "4/4 (100%)"
    breakdown:
      generic_consumer_assertions: 4
      harmony_specific_assertions: 0
    note: >-
      test_zsign.sh 4 项：版本报告（-v 输出 version: 1.1.1）、真实 arm64
      Mach-O 固件解码（macho_fix.b64，与上游 test/dylib 同构样本）、adhoc
      签名并校验签名段嵌入（文件 16800→53376 字节，LC_CODE_SIGNATURE）、
      幂等重签。另有功能等价验证 7 项（设备侧人工执行，notes.md 全记录）：
      adhoc 签 dylib、-l dylib 注入、完整 IPA 重签（p12+provision+embedded
      .mobileprovision+_CodeSignature，-t 指定可写临时目录）、-C 证书检查、
      -x 元数据提取、bundle 编辑（-b/-n/-M）、文件夹直接签名。

blockers: []
