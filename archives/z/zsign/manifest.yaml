software: zsign
display: "zsign — iOS 代码签名工具"
description: "跨平台 iOS 应用重签名命令行工具（IPA/文件夹/zip/.app 包重签、dylib 注入、entitlements/provisioning profile 处理，无需 Xcode/macOS），C++ 实现，内嵌 zlib+minizip，仅需 libcrypto"
category: utility
homepage: "https://github.com/zhlynn/zsign"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 工程（build/linux/Makefile，无 configure/cmake）：CXXFLAGS 硬编码 -std=c++11 -O3，源码/输出经 ../../ 相对路径解析，必须 make -C build/linux 调用，输出落 <src>/bin/zsign"
    - "Makefile 用 git describe 取版本号，release tarball 无 .git 回退 0.0.0-dev——必须显式传 VERSION=<ver>，否则 zsign -v 误报"
    - "只用 libcrypto 不用 libssl；src/signing.cpp 无条件调用 OSSL_PROVIDER_load，需 OpenSSL 3.x（仓内 openssl/3.5.6，静态 libcrypto.a 链接，产物无运行时 so 依赖）"
    - "zsign 默认把待签包解压到 /tmp，HMDFS 只读导致 Unzip failed——鸿蒙平台所有 IPA 签名必须 -t 指定可写临时目录（E002 族）"
    - "HMDFS make -jN jobserver mkfifo 报错（E074 族），-j1 规避（与 R9 一致）"
    - "上游 test/linux/test.sh 按设计需要被 .gitignore 排除的语料 + ideviceinstaller + USB iOS 设备，任何无设备 Linux 均 FAILED——签名核心功能以 -t + 去安装步等价验证"
  common_dependencies:
    - openssl

versions:
  "1.1.1":
    status: built
    build_date: "2026-09-21"
    source_url: "https://github.com/zhlynn/zsign/archive/refs/tags/v1.1.1.tar.gz"
