# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0c) 强制要求此文件存在

package: zsv/1.4.3
homepage: https://github.com/liquidaty/zsv

# 上游测试命令（zsv 使用 app/test/Makefile，通过 make -C app test 执行）
upstream_check_command: "make -C app test"

# conanfile.py build() 中未集成上游测试（独立验证，不修改上游断言/skip/测试数据）
upstream_test_in_build: false
upstream_test_command: "make -C app test"

# 上游测试列表（app/test/Makefile 的 TESTS，31 个目标）
upstream_tests:
  - file: app/test/
    source: zsv-1.4.3/app/test/
    description: "zsv 官方测试套件（make -C app test；count/echo/select/sql/2json/serialize/flatten/pretty/desc/stack/2db/2tsv/jq/compare/overwrite/rm/mv/parallel/check/redline/vuln 等）"
    command: "make -C app test"

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "运行 zsv version 与 zsv count（对 3 行 CSV 断言输出 2），实质调用被测包二进制"
    command: "./test.sh"

# Assertion count: test.sh 有 1 个断言（count 输出）。
assertion_count: 1
