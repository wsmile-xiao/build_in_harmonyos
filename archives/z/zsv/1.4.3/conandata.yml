# conandata.yml — zsv 1.4.3
# 官方正式源（R39）：GitHub release tarball；CI 自动添加镜像 fallback。
#
# 注意：本包不声明 conandata patches。4 个补丁（patches/0001-0004）的目标是
# zsv 源码树内【嵌套 tarball】（app/external/pcre2-pcre2-10.47.tar.gz、
# jq-1.6.tar.gz）解压后的 config.guess/config.sub —— 这些文件在解压主源码树
# 时并不存在，apply_conandata_patches() 无法应用，故由 conanfile.py build()
# 的 _patch_nested_tarball() 先解压嵌套 tarball → 打补丁 → 重新打包完成。

