# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: zsv
display: "zsv"
description: "极速流式 CSV 解析器：命令行工具集（count/select/2tsv/2json/sql/compare 等）+ C 库 libzsv（自带 builtin pcre2/jq/sqlite3）"
category: tool
homepage: "https://github.com/liquidaty/zsv"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "自定义 configure + Makefile（非 CMake）；OHOS aarch64 自动启用 NEON（HAVE_NEON=1）"
    - "嵌套 pcre2/jq tarball 的 config.guess 加 HarmonyOS 分支（E007）+ umask 077→022（E011）"
    - "jq/pcre2/sqlite3 均为 builtin 内部组件，非 Conan 运行时依赖；libcurl 仅测试数据下载"
    - "test-quotebuff-select 子测试在 OHOS 挂起、test-parallel-3+ 依赖 git 路径假设，如实记录为 unrunnable"

  common_dependencies: []

versions:
  "1.4.3":
    status: built
    build_date: 2026-08-15
