# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mlt/7.34.0
homepage: "https://www.mltframework.org/"

# 上游测试命令 — mlt 的 C++ 单元测试（src/tests/，BUILD_TESTING=ON 时构建）
# BUILD_TESTING=ON 需 find_package(Qt6 COMPONENTS Core Test) + find_package(Kwalify REQUIRED)：
# - Qt6：制品仓库有 qtbase/6.11.1 可用
# - Kwalify：Ruby 工具（find_program kwalify），制品仓库无此包，OHOS 环境不可用
# 因此 BUILD_TESTING 关闭，上游测试无法在 OHOS 构建运行；
# 以 test_package 消费者测试（test_mlt.py）替代验证。
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（实测 2026-08-16，OHOS 环境）：
# - src/tests/：C++ 单元测试（test_animation/test_consumer 等，QtTest 框架）
# - 依赖 Qt6 测试框架；OHOS 受限环境实际运行情况以本地验证为准
upstream_tests:
  - file: src/tests/
    source: mlt-7.34.0/src/tests/
    description: "上游 C++ 单元测试（QtTest 框架），BUILD_TESTING=ON 构建"
    command: "ctest"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_mlt.py
    description: "消费者测试：加载 libmlt 共享库 + 验证 mlt_version API（7.x）"
    command: "python3 test_mlt.py <lib-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
