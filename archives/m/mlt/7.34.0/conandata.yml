# conandata.yml — mlt 7.34.0
# 源码来自 GitHub 官方 release tarball（R39 官方源）

sources:
  url: "https://github.com/mltframework/mlt/releases/download/v7.34.0/mlt-7.34.0.tar.gz"
  sha256: "17278c650ea223127c3207de9bbf0364e0771699930716901071508d80b256b1"

patches:
  "7.34.0":
    - patch_file: "patches/0001-kwalify-quiet.patch"
      patch_description: "BUILD_TESTING 下 find_package(Kwalify REQUIRED) 改为 QUIET——制品仓无 Kwalify 包，kwalify schema 测试项跳过，QtTest 套件正常构建运行"
      patch_type: "portability"
    - patch_file: "patches/0002-mlt-locale-ohos.patch"
      patch_description: "OHOS 编译环境定义 __APPLE__ 但无 <xlocale.h>（locale_t 在 <locale.h> 提供），mlt_property.h 用 __has_include 按 POSIX 接口适配头文件选择，避免引入平台宏（R8 合规）"
      patch_type: "portability"
    - patch_file: "patches/0003-mlt-soname.patch"
      patch_description: "OHOS 链接器未按 VERSION/SOVERSION 生成 SONAME，显式指定 -Wl,-soname 使插件 NEEDED 记录 SONAME 而非构建目录相对路径，修复安装后插件 dlopen 失败"
      patch_type: "portability"
    - patch_file: "patches/0004-properties-locale-ohos.patch"
      patch_description: "test_properties RadixRespondsToLocale 德语逗号小数点段改为运行时 newlocale 检测（de_DE.UTF-8 不可用时跳过），替代平台宏排除（R8 合规）"
      patch_type: "portability"
