software: msgsl
# 软件级 manifest 模板
# 文件位置: archives/m/msgsl/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（目录名）
name: msgsl

# 软件显示名称
display_name: Microsoft Guidelines Support Library (GSL)

# 软件分类
# library | tool | framework | application
category: library

# 软件描述（一句话）
description: Header-only C++ library implementing C++ Core Guidelines types and safety checks

# ============================================================
# 版本索引
# ============================================================

# 可用版本列表（按编译状态排序）
versions:
  - version: "4.0.0"
    status: built
    build_date: "2026-06-05"
    patches: 3

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方仓库 URL
  repo: https://github.com/microsoft/GSL

  # 主分支
  branch: main

  # 许可证
  license: MIT

  # 编程语言
  language: C++

# ============================================================
# 构建信息
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 是否 header-only
  header_only: true

  # 最小 C++ 标准
  min_cxx_standard: "14"

  # 典型配置选项
  configure_options:
    - "-DGSL_TEST=OFF"
    - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"

  # 编译依赖（空）
  dependencies: []

# ============================================================
# 功能特性
# ============================================================

features:
  # 主要组件
  components:
    - gsl::span - 边界安全的数组视图
    - gsl::not_null - 空指针检查包装器
    - gsl::string_span - 字符串视图
    - gsl::algorithm - 边界检查算法
    - gsl::util - 工具函数（finally 等）

  # 平台支持
  platforms:
    - OHOS aarch64
    - Linux x86_64/aarch64
    - macOS
    - Windows

  # 特性标签
  tags:
    - header-only
    - zero-dependency
    - type-safe
    - bounds-checking
    - modern-cpp

# ============================================================
# 使用说明
# ============================================================

usage:
  # 安装方法
  install_methods:
    - cmd-pkgs: "curl ... | sh -s -- msgsl 4.0.0"
    - manual: "tar -xzf ... -C ~/usr/local"

  # CMake 集成
  cmake_integration: |
    find_package(Microsoft.GSL REQUIRED)
    target_link_libraries(your_target PRIVATE Microsoft.GSL::GSL)

  # 头文件包含
  header_include: "#include <gsl/gsl>"

# ============================================================
# 知识索引
# ============================================================

# 编译相关知识点（按需补充）
knowledge_refs: []

# ============================================================
# 维护信息
# ============================================================

# 最后更新日期
last_updated: "2026-06-05"

# 维护者
maintainer: OpenHarmonyPCDeveloper