software: mars
display: "mars"
description: "Tencent Mars — 微信跨平台基础组件库（Comm 基础组件 + Xlog 日志 + 内嵌 boost 1.60 子集）"
category: network
homepage: "https://github.com/Tencent/mars"
license: "MIT"
build_system: "per-platform CMake (upstream) / recipe-driven clang (this port)"

ohos_adaptation:
  key_points:
    - "pthread_cancel 缺失：OHOS musl 无该 API，Thread::unsafe_exit 增加 __OHOS__ 分支走 Android 同款 SIGUSR2 派发"
    - "BSD sysctl 裁剪：debugger_utils.c 的 sysctl 调试器探测在 musl 下无 sys/sysctl.h，__OHOS__ stub 返回 0（调用点本身在 DEBUG+__APPLE__ 守卫内）"
    - "平台抽象层重建：上游 comm/jni/platform_comm.cc（JNI 反调 Java 取网络状态）→ 新增 comm/ohos/platform_comm_ohos.cc 本地实现（getNetInfo 走 UDP 探测 local_ipstack_detect，WiFi/SIM/APN 报不可用，ConsoleLog 路由进 xlogger 管道）"
    - "xlogger pid/tid 源：新增 comm/ohos/xlogger_threadinfo_ohos.cc（musl gettid() 需 _GNU_SOURCE，全库启用）"
    - "上游 CMake 树只认 MSVC/ANDROID/APPLE：配方按上游各模块 CMakeLists 的非 MSVC glob 清单直接驱动 OHOS clang 交叉编译，产出 libmars-comm/-xlog/-boost 三个静态库"
  common_dependencies:
    - "zlib（xlog log_buffer deflate 压缩；制品仓 zlib/1.3.1）"

versions:
  "1.3.0":
    status: built
    build_date: "2026-09-12"
