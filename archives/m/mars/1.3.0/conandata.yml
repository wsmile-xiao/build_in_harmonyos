      patch_description: "HarmonyOS PC port of mars comm/xlog: OHOS branch for Thread::unsafe_exit (musl has no pthread_cancel, SIGUSR2 fallback), BSD sysctl debugger probe stubbed off (no sys/sysctl.h), new comm/ohos platform layer (native getNetInfo via UDP-probe local_ipstack_detect, ConsoleLog routed to xlogger, xlogger pid/tid source)"
