package: mars/1.3.0
homepage: "https://github.com/Tencent/mars"

upstream_check_command: "grep -r add_test mars --include=CMakeLists.txt (no add_test/enable_testing on the v1.3.0 tag)"
upstream_test_in_build: false
upstream_test_command: "python mars/build_android.py / python mars/build_ios.py (platform app wrappers only; no headless test target)"
upstream_tests: []
upstream_tests_note: >
  Upstream mars v1.3.0 has NO test target in the build-system sense: the
  CMake tree (mars/CMakeLists.txt + per-module CMakeLists) only assembles
  static libraries for MSVC/ANDROID/APPLE wrapper apps — there is no
  add_test/enable_testing anywhere, and no "make test"/"ctest" entry point.
  The gtest-style sources that exist (comm/test_case/MessageQueue_test.cpp,
  stn/test_cases/*.cc) are not registered by any build target upstream and
  require WeChat-internal task/longlink_packer callbacks plus a live network
  (they drive the real STN stack against test servers with ini-configured
  IPs).  The samples/ tree is Android/iOS demo apps.  The test_package below
  reproduces the functional scenario every mars consumer runs at startup
  (WeChat wrapper included): xlog appender pipeline to disk + the comm
  primitives (AutoBuffer / strutil / gettickcount) that STN itself is built
  on.

test_package_tests:
  - file: test_mars.cc
    description: "xlog end-to-end: appender_open + xlogger_SetLevel + xinfo2/xwarn2 (TSF + printf style) + xdebug2 + flush_sync + close; re-open and verify appender_get_current_log_path resolves and the log file is non-empty on disk."
    command: "test_mars"
  - file: test_mars.cc
    description: "comm AutoBuffer write/roundtrip (byte-identical readback), strutil::Tokenizer 3-token split, gettickcount() monotonic across a 50ms sleep."
    command: "test_mars"
  - file: test_mars.cc
    description: "OHOS platform layer (comm/ohos/platform_comm_ohos.cc + xlogger_threadinfo_ohos.cc): getNetInfo returns a legal NetType and isNetworkConnected stays consistent; xlogger_tid/pid from the musl gettid source (main thread tid==pid, worker thread callable); ConsoleLog fires on the stderr sink with the probe string (no feedback into the xlogger file pipeline)."
    command: "test_mars"

assertion_count: 9
assertions:
  - "appender_get_current_log_path returns true after appender_open"
  - "xlog log file written with content (size > 0)"
  - "AutoBuffer write/roundtrip byte-identical"
  - "strutil::Tokenizer splits 'a,b,c' into 3 tokens"
  - "gettickcount() monotonic (>=40ms elapsed across 50ms sleep)"
  - "platform getNetInfo returns legal NetType (kNoNet/kWifi/kMobile/kOtherNet)"
  - "platform isNetworkConnected consistent with getNetInfo"
  - "platform xlogger_tid/pid from OHOS threadinfo source (main thread: tid==pid)"
  - "platform xlogger_tid callable from worker thread + ConsoleLog stderr sink reachable with probe string"
