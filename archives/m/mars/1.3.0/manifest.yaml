    - "W0 dependency check: zlib/1.3.1 present in ohpcd registry (conan install verified, R35)"
    - "All upstream comm/log/boost source lists compile with OHOS clang 15 -std=gnu++14 -fno-exceptions -D_GNU_SOURCE after patch 0001"
    - "conan create green (full cross build + package + test_package)"
    - "test_package 9/9 PASS on-device: xlog writes real log file to disk; AutoBuffer/Tokenizer/gettickcount verified; OHOS platform layer covered (getNetInfo legal + isNetworkConnected consistent, xlogger_tid/pid musl gettid source, ConsoleLog stderr sink)"
    - "Linkage verified: consumer links libmars-comm + libmars-xlog + libmars-boost + zlib + pthread + libc++_shared (system /system/lib64)"

knowledge_ref: []

ohos_adaptation:
  key_points:
    - "thread.h: musl/bionic have no pthread_cancel — ANDROID branch guard extended to __linux__ && !__GLIBC__ (libc capability, no platform macro); SIGUSR2 handler calling pthread_exit(0), then signal delivery (glibc keeps plain pthread_cancel)"
    - "debugger_utils.c: __has_include(<sys/sysctl.h>) feature detection (standard C, no platform macro) — musl/glibc fall back to /proc/self/status TracerPid (Linux-standard debugger-attach indicator, same semantics as P_TRACED); BSD keeps original sysctl probe"
    - "comm/ohos/platform_comm_ohos.cc (new): native OHOS platform layer replacing upstream's JNI-based comm/jni/platform_comm.cc — getNetInfo via UDP-probe local_ipstack_detect() (same technique comm already uses for AI_ADDRCONFIG), WiFi/SIM/APN report unavailable (no cellular/Java bridge on PC), ConsoleLog writes stderr (upstream console-sink semantics; Android uses logcat — feeding back into xlogger_Write would recurse)"
    - "comm/ohos/xlogger_threadinfo_ohos.cc (new): xlogger_pid/tid/maintid source (musl gettid() needs _GNU_SOURCE, enabled build-wide)"
    - "Recipe drives OHOS clang directly over the exact upstream glob source lists (upstream CMake only knows MSVC/ANDROID/APPLE); XLOGGER_TAG defined as quoted string literal exactly like upstream CMakeUtils add_definitions"
    - "STN/SDT not packaged: they need a live platform bridge (callback registration + task packer + netinfo source); comm+xlog is the reusable core per platform guidance"
  common_dependencies: ["zlib"]
