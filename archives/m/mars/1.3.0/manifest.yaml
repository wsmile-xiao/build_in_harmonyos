test_results:
  type: functional
  total: 9
  passed: 9
  failed: 0
  status: no-upstream-test-suite
  note: >
    Upstream mars v1.3.0 ships no build-system test target: no add_test/
    enable_testing anywhere on the tag; the only "tests" are Android/iOS
    demo apps (samples/) and gtest-style sources (comm/test_case/
    MessageQueue_test.cpp, stn/test_cases/*.cc) that no upstream build
    target registers and that need WeChat-internal callbacks plus live
    network servers. test_package reproduces the startup scenario of every
    mars consumer: xlog appender pipeline end-to-end to disk (open, set
    level, xinfo2/xwarn2 TSF + printf style, flush_sync, close, path
    resolution, file-size assert) and the comm primitives STN itself is
    built on (AutoBuffer roundtrip, strutil::Tokenizer, gettickcount
    monotonicity). All 5 assertions PASS on the OHOS PC runtime.

verification:
  local:
