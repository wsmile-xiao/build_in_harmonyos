package: madplay
version: "0.15.2b"
homepage: "https://sourceforge.net/projects/mad/"
license: GPL-2.0-or-later
status: built
build_system: autotools
build_date: "2026-09-01"

source:
  url: "https://downloads.sourceforge.net/project/mad/madplay/0.15.2b/madplay-0.15.2b.tar.gz"
  sha256: "5a79c7516ff7560dffc6a14399a389432bc619c905b13d3b73da22fa65acede0"
  tar_format: tar.gz

dependencies:
  - mad/0.16.4
  - libid3tag/0.16.3
  - zlib/1.3.1

patches_applied:
  - "0001-config-sub-aarch64.patch"
  - "0002-configure-umask-022.patch"

upstream_tests:
  available: false
  notes: >-
    madplay 0.15.2b is an application, not a library: its Autotools tree has
    no TESTS/check_PROGRAMS and no `make check`/`make test` target exists.
    The release tarball ships no test suite of any kind. Verification is
    therefore carried out entirely by the Conan test_package, which runs the
    real binary on-device (version banners, tag-only parse, full decode to
    wave/hex file outputs with deterministic content, and two negative
    cases).

test_package:
  assertion_count: 26
  description: >-
    Generates a deterministic silent MPEG-1 Layer III fixture arithmetically,
    then runs the real madplay: --version/--help banners, -T tags-only parse,
    -o wave: full decode (44-byte RIFF/WAVE header + 25*1152 mono PCM16
    samples within dither noise), -o hex: decode (header + 25*1152 hex
    samples), nonexistent-input failure, and garbage-input header-only wave.
