package: madplay/0.15.2b
runner: test_package
commands:
  - madplay --version
  - madplay --help
  - madplay -T fixture.mp3
  - "madplay -o wave:out.wav fixture.mp3"
  - "madplay -o hex:out.hex fixture.mp3"
  - "madplay -T nonexistent.mp3 (negative)"
  - "madplay -o wave:garbage.wav garbage.mp3 (negative)"
fixture:
  generator: gen_fixture.c
  format: "MPEG-1 Layer III, 128 kbps mono 44100 Hz, silent, 25 frames"
  provenance: "arithmetically generated (all-zero side info and payload)"
assertions:
  - "version banners contain MAD / libid3tag / madplay 0.15.2"
  - "usage printed"
  - "fixture size == 25 * 417"
  - "wave == 44 + 25*1152*2 bytes, PCM16 mono 44100, |sample| <= 2"
  - "hex header '# 1 channel, 44100 Hz, 24-bit samples' + 25*1152 samples, |x| <= 2"
  - "nonexistent input exits non-zero"
  - "garbage input yields 44-byte header-only wave"
