# test_package/MANIFEST.yml — meshoptimizer 1.0
# 上游官方测试声明文件（CI L0e 强制）
# 台账口径：用户测试源 demo/tests.cpp 中 runTests() 实际调用的独立测试函数。

package: meshoptimizer/1.0
homepage: "https://github.com/zeux/meshoptimizer"

# 上游测试命令（上游 demo 可执行程序无参数即运行全部 runTests()）
upstream_check_command: "cmake -S . -B build -DMESHOPT_BUILD_DEMO=ON && cmake --build build && ./build/meshoptdemo"

# conanfile.py build() 未集成上游测试（上游测试在 demo 可执行内，非库构建产物）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（demo/meshoptdemo，assert 断言式，exit=0 即全过）
upstream_tests:
  - file: demo/tests.cpp
    source: meshoptimizer-1.0/demo/tests.cpp
    description: "上游用户测试源：runTests() 调用 93 个独立测试函数（328 处 assert），覆盖索引编解码/顶点编解码/过滤器/簇/简化/缓存优化/量化等"
    command: "./meshoptdemo"

# test_package 自带测试（消费者视角验证，R34 实质调用库 API）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：meshopt_simplify 简化立方体 + meshopt_optimizeVertexCache + meshopt_encode/decodeIndexBuffer 无损往返"
    command: "./test_meshoptimizer"

# 测试断言总数（上游 tests.cpp 328 处 assert + test_package 4 项显式校验）
assertion_count: 332
