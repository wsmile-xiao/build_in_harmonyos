# 版本级 manifest — meshoptimizer 1.0
# 遵循 ARCHIVE-SPEC v3.0

version: "1.0"
software: "meshoptimizer"
status: published
build_date: "2026-09-03"
build_system: "cmake"

source:
  url: "https://github.com/zeux/meshoptimizer/archive/refs/tags/v1.0.tar.gz"
  sha256: "30d1c3651986b2074e847b17223a7269c9612ab7f148b944250f81214fed4993"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DMESHOPT_BUILD_DEMO=OFF"
    - "-DMESHOPT_BUILD_GLTFPACK=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "meshoptimizer 索引编码器 getEdgeFifo 会隐式旋转三角形顶点以匹配已编码边缘，解码结果保证三角形集合等价而非字节一致；消费者往返测试必须按排序三角形集合比较，不能用 memcmp（上游 roundtripIndexTricky 数据恰好不触发旋转，其 memcmp 断言成立）"
  - "meshoptimizer 上游测试入口是 demo/meshoptdemo 可执行（无参数运行 runTests()，assert 静默式，exit=0 即全过），无独立 make check / ctest 目标；make check 在 Makefile 与 CMake 中均不存在"
  - "junk_check 无 refs/remotes/origin/main 时会回退整仓 full 模式（git ls-files），扫到其他库历史基线 junk 文件导致 W3 假失败；本地构建前必须先 git fetch origin main:refs/remotes/origin/main 且先提交本包变更，使 JC 进入增量 diff 模式"
