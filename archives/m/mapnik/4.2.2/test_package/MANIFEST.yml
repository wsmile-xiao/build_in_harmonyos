# test_package/MANIFEST.yml — CI L0e
# 详见: docs/ADAPTATION_GUIDE.md §3 Step 4-5 / docs/TEST_QUALITY_SPEC.md §4.3
package: mapnik/4.2.2
homepage: "https://mapnik.org/"

# ── 上游测试声明（TEST_QUALITY_SPEC §4.3） ───────────────────────
# 上游测试为 Catch2 v2.13.7（test/ 目录），官方 tarball 自带 vendored 单头
# test/catch.hpp（补丁 0004 将 FetchContent 替换为该单头——离线构建无法
# 网络下载）。上游 ctest 注册 5 个测试二进制；catch_discover_tests 在上游
# 将每个 TEST_CASE 展开为独立 ctest 条目（87 unit + 4 standalone = 91），
# 适配后按二进制整跑（add_test 5 条），TEST_CASE 集合不变。
# conan create 构建（BUILD_TESTING=ON）产出全部 5 个测试二进制；
# 真机（HarmonyOS musl aarch64）ctest 实测结果见下方豁免登记。
upstream_test_in_build: true
upstream_check_command: "ctest"
upstream_test_command: "ctest"

upstream_tests:
  - name: mapnik-test-unit
    framework: catch2
    description: "mapnik 单元测试套件（test/unit/，45 个 TEST_CASE 组 / 87 TEST_CASE 口径）"
    command: "./mapnik-test-unit"
    test_cases: 87
  - name: agg_rasterizer_integer_overflow_test
    framework: catch2
    description: "AGG 光栅化器整数溢出回归（standalone）"
    command: "./agg_rasterizer_integer_overflow_test"
    test_cases: 1
  - name: datasource_registration_test
    framework: catch2
    description: "数据源插件注册（standalone）"
    command: "./datasource_registration_test"
    test_cases: 1
  - name: font_registration_test
    framework: catch2
    description: "字体注册（standalone）"
    command: "./font_registration_test"
    test_cases: 1
  - name: map_xml_test
    framework: catch2
    description: "地图 XML 加载/保存往返（standalone）"
    command: "./map_xml_test"
    test_cases: 1

# ── entry-level 豁免（TEST_QUALITY_SPEC §3.3 + §5.4）─────────────
# 真机实测（HarmonyOS musl aarch64，ctest 全量）：
#   mapnik-test-unit:    45 test cases 43 过 / 断言 8319 过 8316
#   agg_rasterizer:      1/1（2 断言）
#   datasource_reg:      1/1（2 断言）
#   font_registration:   1/1（51 断言）
#   map_xml_test:        127 断言 126 过（PROJ 豁免）
# 失败定性：
#   1. expressions_test 2 断言——上游源码注释明示 boost regex 无 ICU 支持时的
#      已知失败（unpaired surrogates）；ohpcd conan boost 即无 ICU 构建
#      （test/unit/core/expressions_test.cpp:240 原文注释）
#   2. image_io_test 1 断言（SIGABRT）——libpng 对 xcode-CgBI.png 损坏数据的
#      错误路径在 musl/libpng 组合下 abort（REQUIRE_THROWS 期望可捕获异常，
#      test/unit/imaging/image_io_test.cpp:109 上游错误注入用例）
#   3. map_xml_test 1 断言——PROJ 禁用（ohpcd proj 9.3.1.1 < 上游最低 9.4.0）
#      后投影地图（+proj=merc）无法加载，上游明确报错路径
#      （"without proj support (-DMAPNIK_USE_PROJ)"）

test_package_tests:
  - file: src/test_package.cpp
    description: "鸿蒙真机消费方测试：Map 构造/背景色、memory datasource 多边形要素插入、图层管理、agg_renderer 渲染、save_to_file PNG 编码、PNG 魔数校验（can_run 时真机执行，交叉主机退化为编译+链接验证）"
    command: "./test_package"

assertion_count: 8316
