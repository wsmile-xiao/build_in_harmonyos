package: mtfmt/0.1.3
homepage: "https://mtfmt.cc/mtfmt/"

# 上游测试入口与取数口径 ------------------------------------------------------
# upstream 的 CMakeLists.txt 把整个 enable_testing()/add_test() 段注释掉了，
# 唯一注册的测试入口是顶层 Makefile 的 `make test`：
#   TEST_C_SOURCES = $(wildcard ./tests/*.c) $(wildcard ./thirds/unity/src/*.c)
#   TEST_CPP_SOURCES = $(wildcard ./tests/*.cpp)
#   $(OUTPUT_DIR)/$(TEST_TARGET): $(OBJECTS) $(TEST_OBJECTS)
#   test: $(OUTPUT_DIR)/$(TEST_TARGET)   # 构建后原样执行 target/mtfmt_run.out
# 该目标由 conanfile.py 的 build() 调用（配方随包构建，见 conanfile.py
# _run_upstream_tests），Unity 来自 conandata.yml 的 test_sources.unity。
upstream_check_command: "make -j$(nproc) -C <source> test CC=<toolchain clang>（由 build() 执行）"
upstream_test_in_build: true
upstream_test_command: "make test → target/mtfmt_run.out（Unity 框架，输出 `109 Tests 0 Failures 0 Ignored`）"

# N 的四种候选口径（候选数法取最大值，差额逐项归因）：
#   1) 源码宏数      : grep -c 'RUN_TEST(' tests/test_main.c                → 109
#   2) 框架注册数    : RUN_TEST 展开即 Unity 注册，与 1) 同源                → 109
#   3) 文件级并列    : 测试函数定义数（tests/*.c 的 `void f(` 57 + tests/*.cpp
#                      的 `extern "C" void f(` 52，去重后并集）             → 109
#   4) 声明数        : grep -c 'void [a-z_0-9]+(void);' tests/test_main.h    → 109
# 三项计数完全一致，差额 0，无需归因；assertion 计数（TEST_ASSERT* 58 处、
# 含 ASSERT_EQUAL_VALUE 等包装宏的调用 370 处）是另一计量单位，不作为 N。
upstream_tests:
  - framework: Unity (thirds/unity, submodule 1b9199ee380e203603b6649df9510db9cab147d9)
    unit: "test case (RUN_TEST)"
    static_count: 109
    registered_count: 109
    executed_count: 109
    skipped_count: 0
    command: "grep -c 'RUN_TEST(' tests/test_main.c"
    notes: "tests/test_main.c 逐条 RUN_TEST 注册；tests/ 下30 个测试文件提供实现（14 个 .c + 14 个 .cpp + test_main.c + test_helper.h）。"

test_package_tests:
  - file: test.c
    description: "针对打包产物的消费者程序：调用公共 API mtfmt.h，覆盖构建配置字自洽、整数取值与四种进制样式、符号/对齐/填充、参数 id 复用与三条错误路径、parser 两条错误码、C 字符串创建/拼接/相等/清空、{...:s} 字符串占位符、以及内置堆分配器 alloc/free 平衡不变量（mstr_heap_get_allocate_count）。期望值全部取自上游 tests/ 自身断言，逐条注明。"
    command: "./mtfmt_consumer_test"

assertion_count: 69
