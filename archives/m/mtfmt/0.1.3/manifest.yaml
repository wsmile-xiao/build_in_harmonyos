# 版本级 manifest —— 交叉校验元数据（CI 只读 conanfile.py）
version: "0.1.3"
software: "mtfmt"

# O5：未合并发布前一律 built（published 需合并 + release upload 确认）
status: built
build_date: "2026-09-27"
conan_ref: "mtfmt/0.1.3"
build_system: cmake

source:
  url: "https://github.com/MtFmT-Lib/mtfmt/archive/refs/tags/v0.1.3.tar.gz"
  sha256: "767a9b85b79d915ce7f1e43f0d24dc14942c07af24d6e96f7ff60ee522f1c1ce"
  tar_format: tar.gz

build:
  # 库本身走 CMake（conan CMakeToolchain）；上游测试套件走顶层 Makefile 的
  # `make test`——CMakeLists.txt 里 enable_testing()/add_test() 整段被注释，
  # Makefile 是唯一注册的测试入口（见 test_package/MANIFEST.yml）。
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DMTFMT_BUILD_SHARED=OFF"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

# 上游测试三步法计数（N = 候选数法最大值 = 109；差额 0）
upstream_tests:
  command: "make test（由 build() 调用，Unity 子模块由 source() 按 conandata.yml 拉取）"
  static_count: 109
  registered_count: 109
  executed_count: 109
  skipped_count: 0
  notes: "四种候选口径取数：RUN_TEST 词面 109 / Unity 实际注册 109 / 测试函数定义并集 109（tests/*.c 57 + tests/*.cpp 52）/ test_main.h 声明 109；三者一致，差额 0。assertion 计数（TEST_ASSERT* 58、含包装宏调用 370）属另一计量单位，不作 N。取数命令与逐项数字见 test_package/MANIFEST.yml。"

test_package:
  program: mtfmt_consumer_test
  assertion_count: 69
  description: "消费者程序针对打包产物调用公共 API（mtfmt.h）：构建配置字自洽、整数取值与 b/o/h/H/x/X/d 五种样式、符号与三种对齐+填充、参数 id 复用与三条错误路径、parser 两条错误码、C 字符串创建/拼接/相等/清空、{...:s} 占位符、内置堆分配器 alloc/free 平衡。期望值全部取自上游 tests/ 自身断言。"

knowledge_gained: []
