# 软件级 manifest —— mtfmt
software: mtfmt
display: "MtFmT"
description: "纯 C 实现的字符串格式化库（Mini template formatter），支持 PEP-3101 格式串方言与 .NET 风格日期时间格式子集，面向嵌入式设备的无 OS 内存分配器"
category: library
homepage: "https://mtfmt.cc/mtfmt/"
license: LGPL-3.0-only

build_system: cmake

ohos_adaptation:
  key_points:
    - "上游把 install() 的 DESTINATION 写死成嵌套的 mtfmt/ 前缀（mtfmt/include、mtfmt/lib/static），配方需在 package() 里拍平成 include/ + lib/，不必改源码"
    - "上游 CMakeLists 的 enable_testing()/add_test() 整段被注释，唯一测试入口是顶层 Makefile 的 make test（构建 target/mtfmt_run.out 后原样执行）"
    - "Release tarball 不含 git 子模块 thirds/unity，而 tests/ 全部 include \"unity.h\"；须按子模块指针显式获取，否则测试目标编不过"
    - "上游 Makefile 的 CC=$(PREFIX)gcc 在本设备与 CI worker 都不存在，make test 必须显式 CC=<clang>"
    - "上游 Makefile 无 clean 目标：重复构建会因 build/、target/ 时间戳让 make 打出 Nothing to be done 而一个用例都不跑"
  common_dependencies: []

versions:
  "0.1.3":
    status: built
    build_date: "2026-09-27"
    conan_ref: "mtfmt/0.1.3"
