# test_package/MANIFEST.yml — mspdebug 0.25
# CI L0e requires this file to exist.

package: mspdebug/0.25
homepage: "https://dlbeer.co.nz/mspdebug/"

# 上游测试清点（R51）：上游 Makefile 无 check/test 目标，无 tests/ 目录、无
# 测试框架（内置 sim 模拟器为主功能而非测试套件），静态注册用例总数
# N_static = 0，无测试程序资产。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序清单
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：经 conanrun 环境真实运行打包产物 bin/mspdebug（同时验证打包的 libusb-compat/libusb 动态依赖运行时可解析），断言 --version 输出版本标识 'MSPDebug version 0.25' 且退出码 0"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
