# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "2009 年代 CMake 项目在 CMake 4.x 下需将 cmake_minimum_required 提升到 3.5（<3.5 兼容已移除）"
- "mpc_decoder.c/requant.c 多 TU 同名 tentative definition (Res_bit/__Cc/__Dc) 需 -fcommon（clang 默认 -fno-common）"
- "fpu_control.h 仅 x86 glibc 提供，include 守卫需收紧为 __linux__ && __i386__"
- "部分 libc 下 termios.h 不间接引入 sys/time.h、sys/select.h，struct timeval/fd_set 需显式包含"
- "上游 CMake 版遗漏库 install 规则且头文件目录带 .svn 残留，需 FILES_MATCHING PATTERN *.h"
- "本沙箱域禁止执行新生成 ELF（hello world 亦 Operation not permitted，E052/E077 同源），
  本地执行类冒烟不可行，执行验证交由 CI 执行机的 conan test（test_package 用 explicit）"
- "R49 依赖注入：libcuefile/libreplaygain 复制进 build_folder/prefix，经 CMakeToolchain
  variables 播种 FIND_PATH/FIND_LIBRARY 结果变量"

