# conandata.yml — musepack r475
# Official upstream source (files.musepack.net); sha256 measured locally
# after download (sha256sum musepack_src_r475.tar.gz).

sources:
  r475:
    url: "https://files.musepack.net/source/musepack_src_r475.tar.gz"
    sha256: "a4b1742f997f83e1056142d556a8c20845ba764b70365ff9ccf2e3f81c427b2b"

patches:
  r475:
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "CMake >= 3.5 minimum (CMake 4.x compatibility); append-style CFLAGS preserving toolchain injection; -fcommon for legacy tentative definitions"
      patch_type: "portability"
    - patch_file: "patches/0002-include-CMakeLists.txt.patch"
      patch_description: "Install only header files (FILES_MATCHING *.h) to keep upstream .svn metadata out of include/"
      patch_type: "packaging"
    - patch_file: "patches/0003-libmpcdec-CMakeLists.txt.patch"
      patch_description: "Add missing install rule and normalized output name for libmpcdec static target"
      patch_type: "packaging"
    - patch_file: "patches/0004-libmpcenc-CMakeLists.txt.patch"
      patch_description: "Add missing install rule and normalized output name for libmpcenc static target"
      patch_type: "packaging"
    - patch_file: "patches/0005-libmpcpsy-CMakeLists.txt.patch"
      patch_description: "Add missing install rule and normalized output name for libmpcpsy static target"
      patch_type: "packaging"
    - patch_file: "patches/0006-mpcenc-keyboard.c.patch"
      patch_description: "Include POSIX sys/time.h and sys/select.h for struct timeval/fd_set/select"
      patch_type: "portability"
    - patch_file: "patches/0007-mpcenc-mpcenc.h.patch"
      patch_description: "fpu_control.h only exists on x86 glibc; tighten include guard to __linux__ && __i386__ (mirrors the _FPU_GETCW usage guard)"
      patch_type: "portability"
