# test_package/MANIFEST.yml — 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# musepack 上游源码包 (r475 tarball) 不含测试目标:
#   - CMake 版无 add_test()/enable_testing()，ctest 为空集
#   - autotools 版 (configure.in) 无 make check 规则
# 因此 upstream test inventory 为空，本包质量验证由 test_package 的
# 自洽回环测试承担 (gen_wav -> mpcenc -> mpcdec -> check_mpc 走
# libmpcdec 真实 API 校验 SV8 streaminfo 与帧解码)。

package: musepack/r475
homepage: "https://www.musepack.net/"

# 上游测试命令分析结果: 无
upstream_check_command: "ctest -N (empty — no add_test in upstream CMakeLists)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清单 (无)
upstream_tests: []

# 适配侧补充测试 (test_package 自洽回环)
adapted_tests:
  - name: "roundtrip-encode-decode"
    command: "gen_wav + mpcenc --overwrite in.wav out.mpc + mpcdec out.mpc decoded.wav + 非空校验"
    description: "工具链回环: WAV -> SV8 mpc -> WAV, 覆盖 mpcenc/mpcdec 可执行工具"
  - name: "sv8-streaminfo-and-decode"
    command: "check_mpc out.mpc (links libmpcdec: mpc_reader_init_stdio/mpc_demux_init/mpc_demux_get_info/mpc_demux_decode)"
    description: "库级 API 校验: SV8 版本/44100Hz/双声道/样本数>0 + 至少 1 帧解码成功"
