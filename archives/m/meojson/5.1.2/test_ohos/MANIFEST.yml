# test_ohos/MANIFEST.yml — meojson 5.1.2 HarmonyOS PC 专项验证
# 五项独立鸿蒙检查（run_ohos_test.py，任一失败非零退出）：
#   T1  aarch64 ELF 验证（消费者可执行文件为 ELF64 AArch64）
#   T2  musl libc（无 glibc / 无 ld-linux）
#   T3  .codesign 段存在（OHOS 签名管线产出）
#   T4  无宿主绝对路径泄漏（含 RPATH/RUNPATH 检查）
#   T5  真实 JSON 解析/序列化 roundtrip（仅公开头文件与公开 API，非伪造输出）
package: meojson/5.1.2
tests:
  - name: "HarmonyOS aarch64 ELF / musl / codesign / 路径泄漏 / 真实 JSON 解析验证"
    command: "python3 run_ohos_test.py <conan_package_folder>"
    expected: "TEST_OHOS_ALL_PASS"
run_command: "python3 run_ohos_test.py <conan_package_folder>"
