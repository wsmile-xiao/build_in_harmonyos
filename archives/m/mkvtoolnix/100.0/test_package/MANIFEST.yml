package: mkvtoolnix/100.0
homepage: "https://mkvtoolnix.download/"

upstream_check_command: "rake tests:run_unit"
upstream_test_in_build: false
upstream_test_command: "tests/run.rb"

upstream_tests:
  - file: run.rb
    source: tests/run.rb
    description: "Behavior test suite driver (test-*.rb, ~630 entries; sample files contain copyrighted material, CI-only per upstream README #4)"
    command: "ruby tests/run.rb"

test_package_tests:
  - file: test.sh
    description: "Installed-package integration test (R10): mkvmerge --version, mkvpropedit --version, runtime-generated minimal EBML/Matroska input -> mkvmerge --identify recognition, mkvmerge generation of new Matroska, mkvinfo parse of generated file; temp dir cleanup via trap"
    command: "bash test.sh"

assertion_count: 6
