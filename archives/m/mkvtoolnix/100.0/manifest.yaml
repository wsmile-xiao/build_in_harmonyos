version: "100.0"
software: mkvtoolnix
status: built
build_date: "2026-08-16"
build_system: autotools

source:
  url: "https://mkvtoolnix.download/sources/mkvtoolnix-100.0.tar.xz"
  sha256: "74480d07a261beeaa8baf898248e668ecc56335e2527bbffa841ef056dc028a1"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--disable-gui"
    - "--disable-update-check"
    - "--disable-mkvtoolnix"

dependencies:
  - "zlib/1.3.1"
  - "libogg/1.3.6"
  - "libvorbis/1.3.7"
  - "gmp/6.3.0.1"
  - "boost/1.84.0"
  - "qtbase/6.11.1"

patches_applied:
  - "0001-config.guess-harmonyos.patch"
  - "0002-configure-docbook-optional.patch"
  - "0003-Rakefile-skip-manpages.patch"
  - "0004-configure-umask-022.patch"

knowledge_gained:
  - "mkvtoolnix 100.0 使用 autoconf configure + rake 构建，非 make"
  - "Qt6 >= 6.2.0 为强制依赖（ac/qt6.m4 AC_MSG_ERROR），即使 --disable-gui"
  - "libebml/libmatroska/fmt/pugixml/nlohmann-json/utf8cpp/librmff 有源码 bundled fallback"
  - "C++20 硬性要求，需覆盖 CI profile 的 cppstd=17"
