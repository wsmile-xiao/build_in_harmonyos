sources:
  url: "https://mkvtoolnix.download/sources/mkvtoolnix-100.0.tar.xz"
  sha256: "74480d07a261beeaa8baf898248e668ecc56335e2527bbffa841ef056dc028a1"
patches:
  - patch_file: "patches/0001-config.guess-harmonyos.patch"
    patch_description: "Recognize HarmonyOS in config.guess (E007/E160: uname -s=HarmonyOS must map to Linux/musl)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-docbook-optional.patch"
    patch_description: "DocBook XSL stylesheets unavailable on OHOS; downgrade hard error to warning (man pages skipped, like fontconfig/adcli/glibmm doc disable)"
    patch_type: "portability"
  - patch_file: "patches/0003-Rakefile-skip-manpages.patch"
    patch_description: "Skip manpages build/install targets when DOCBOOK_ROOT is empty (paired with 0002)"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-umask-022.patch"
    patch_description: "E011/E052: HMDFS maps file owner to different UID; umask 077 makes config.status temp dir unusable -> use umask 022"
    patch_type: "portability"
# release tarball 不含 libebml/libmatroska git 子模块（configure 的 matroska.m4
# 找不到 pkg-config 版本时回退 internal bundled 需要 lib/libebml 与 lib/libmatroska），
# 且二者未发布到 ohpcd，按源码自带 bundled fallback 方式在 source() 中 vendored。
libebml:
  url: "https://codeload.github.com/Matroska-Org/libebml/tar.gz/refs/tags/release-1.4.5"
  sha256: "86c99573cd0957884f26547d1a8fa0c979e4d6d57484dfd387345846e6720f49"
libmatroska:
  url: "https://codeload.github.com/Matroska-Org/libmatroska/tar.gz/refs/tags/release-1.7.1"
  sha256: "64763443947833e6c17f1f555f4bb0df6c9f91881810d9d5e0f0bad3622d308b"
