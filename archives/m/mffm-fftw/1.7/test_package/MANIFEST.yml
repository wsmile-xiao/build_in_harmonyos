# test_package/MANIFEST.yml — mffm-fftw 1.7
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在且内容完整。

package: mffm-fftw/1.7
homepage: "https://sourceforge.net/projects/mffmfftwrapper/"

# 上游测试命令：上游为纯 Makefile 库，无独立测试框架；
# Makefile 中示例目标（ex）默认被注释，不产生可执行测试。
upstream_check_command: "make -n ex"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无自动化测试，仅有 3 个可编译示例
# （complexFFTExample / real2DFFTExample / realFFTExample），已在本机
# 交叉编译并运行验证（输出功率谱数据，exit=0），作为上游功能示例。
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_mffm_fftw.cpp
    description: "消费者测试：complexFFT/realFFT 正逆变换与能量守恒断言"
    command: "./test_mffm-fftw"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 5
