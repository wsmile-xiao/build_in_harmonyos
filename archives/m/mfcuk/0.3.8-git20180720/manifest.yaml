knowledge_gained:
- "mfcuk 是 application 类型（可执行文件），不是 library"
- "Google Code archive tarball 含预生成 configure，无需 autotools"
- "configure 通过 uname 探测系统，不依赖 config.guess/config.sub"
- "需要手动注入 AM_CFLAGS（libnfc 头文件路径）和 mfcuk_LDADD（库路径和库名）"
- "libnfc 依赖链：libnfc → libusb-compat (libusb 0.1 ABI) → libusb-1.0"
- "静态链接时 libusb.a 依赖 libusb-1.0.so，需同时链接 -lusb-1.0"
- "上游无自动化测试（无 make check/test 目录）"
- "mfcuk --help 以退出码 1 退出（上游行为），test_package 需使用 || true"
- "W3 本地 CI 模拟失败为基础设施问题（python3 not found），非配方问题"
- "conan-verify 全部通过（G0-G4, L2/L4/L5），conan create 成功"
