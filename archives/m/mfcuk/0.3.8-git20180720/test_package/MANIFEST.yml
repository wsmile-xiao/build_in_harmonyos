# MANIFEST.yml — mfcuk 0.3.8-git20180720 test_package
# 遵循 ARCHIVE-SPEC v2.0

version: "0.3.8-git20180720"
software: mfcuk
test_type: consumer

tests:
  - name: binary_exists
    description: "验证 mfcuk 可执行文件存在"
    command: "test -f ${prefix}/bin/mfcuk"
    expected_exit_code: 0

  - name: binary_runs
    description: "验证 mfcuk --help 可执行"
    command: "${prefix}/bin/mfcuk --help 2>&1 || true"
    expected_exit_code: 0

  - name: version_string
    description: "验证 mfcuk 版本信息包含 0.3.8"
    command: "${prefix}/bin/mfcuk --help 2>&1 | head -1"
    expected_output_contains: "0.3.8"

  - name: ohos_elf_binary
    description: "OHOS 消费者用例：验证二进制是有效的 OHOS ARM64 ELF"
    command: "file ${prefix}/bin/mfcuk"
    expected_output_contains: "ELF"
