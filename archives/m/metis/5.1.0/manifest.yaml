software: metis
version: 5.1.0
status: success
build_system: cmake
created_at: 2026-05-06
knowledge_gained:
  - cmake旧版本兼容性问题：使用CMAKE_POLICY_VERSION_MINIMUM参数
  - GKLIB_PATH需设置为绝对路径解决try_compile路径问题
configure_options:
  - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "-DGKLIB_PATH=$BUILD_SRC_DIR/GKlib"
patches_applied: []
build_log: logs/build.log
source_url: https://karypis.github.io/glaros/files/sw/metis/metis-5.1.0.tar.gz
