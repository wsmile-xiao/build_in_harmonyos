# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: metrohash/1.1.3
homepage: "https://github.com/jandrewrogers/MetroHash"

# 上游测试清点：1.1.3 tarball 全量 11 个文件（LICENSE/README.md/src 下 8 个源文件），
# 无 tests/ 或 sample/ 目录、无任何自动化测试程序；上游仅提供 src/testvector.h
# 官方校验向量（test_key_63 键 + 64/128 位 + CRC 变体的期望哈希）。
upstream_check_command: "tar tzf metrohash-1.1.3.tar.gz"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无——上游无自动化测试）
upstream_tests:
  - file: src/testvector.h
    source: metrohash-1.1.3/src/testvector.h
    description: "上游官方校验向量（非可执行测试程序）：本适配的消费者测试以其 64/128 位非 CRC 向量为断言依据"
    command: "（数据文件，由 test_package/test_metrohash.cpp 消费）"

test_package_tests:
  - file: test_metrohash.cpp
    description: "消费者测试: 8 项官方向量校验（metrohash64_1/2、metrohash128_1/2 × seed 0/1）+ 2 项类 API 流式/一次性一致性（10 项断言）"
    command: "./test_metrohash"

assertion_count: 10
