# test_package MANIFEST
name: mysql-client-8.4
version: 8.4.11
test_type: consumer-c-api
description: >
  Consumer C test exercising the mysqlclient C API surface:
  mysql_library_init/end, mysql_get_client_info,
  mysql_get_client_version >= 80411, mysql_thread_safe, MYSQL handle
  init/close against the static libmysqlclient.a.
upstream_test_reference: >
  Upstream libmysql_api_test is skipped on OHOS because it links the shared
  libmysql target, which the OHOS client-only build does not create
  (patch 0006). This consumer test covers the same C API surface
  statically.
