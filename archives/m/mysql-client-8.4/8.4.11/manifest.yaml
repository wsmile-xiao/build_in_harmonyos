# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "MySQL 8.4 LTS 与 8.0 的 client-only OHOS 适配同构，但 8.4 无需外部 Boost：源码树自带 extra/boost/boost_1_84_0 头（cmake/boost.cmake 用 INTERFACE 库直接引用），也无需放宽 boost.cmake 的版本检查"
  - "MySQL 8.4 已移除 bundled libevent 与对应的 try_run 版本探测（TEST_RUN_RESULT 预置不再需要），configure.cmake 仅剩 setns/clock_gettime/clock_realtime 三个 CHECK_C_SOURCE_RUNS，外加 rapidjson 的 std::regex CHECK_CXX_SOURCE_RUNS 探测"
  - "8.4 的 client/CMakeLists.json_binlog 引入新的 json_client_library/decimal convenience 库与 json_binlog_main 静态测试目标，OHOS 守卫只需跳过 shared json_binlog 目标与链接它的 json_binlog_main，静态测试目标保留"
  - "OHOS 交叉配置核心开关沿用 mysql 8.0.46/percona-server 8.4.10 结论：CMAKE_SYSTEM_NAME=Linux + OHOS=1 门控 + try_run EXITCODE 预置（知识库 E459 与 archives/m/mysql/8.0.46 notes.md）"
  - "打包命名走 ConanCenter libmysqlclient 风格独立包名 mysql-client-8.4，与仓库既有 mysql/8.0.46（服务器同源完整包）并存不冲突"
  - "MySQL 8.4 要求 C++20（mysys 的 std::bit_floor/bit_ceil/popcount）；conan profile cppstd=17 会在上游 -std=c++20 后追加生效导致 <bit> 不可见——配方 configure() 里 rm_safe(compiler.cppstd) + CMAKE_CXX_STANDARD=20 根因消除（比 percona 的 __builtin_clz fallback 更干净）"
  - "MySQL 8.4 新增 bundled libcno（HTTP2），其 cno_huffman_generator 生成器命令沿用裸命令名，交叉构建 Error 127——与 comp_err/comp_sql 同款 TARGET_FILE 化修复"

