    - "-DWITH_ZSTD=bundled"
    - "-DWITH_FIDO=none"
    - "-DWITH_KERBEROS=none"
    - "-DCMAKE_CXX_STANDARD=20"
    # try_run()/CHECK_*_SOURCE_RUNS presets for the OHOS cross toolchain:
    - "-DHAVE_SETNS_EXITCODE=1"
    - "-DHAVE_CLOCK_GETTIME_EXITCODE=0"
    - "-DHAVE_CLOCK_REALTIME_EXITCODE=0"
    - "-DHAVE_RAPIDJSON_WITH_STD_REGEX_EXITCODE=0"

  dependencies:
    - openssl/3.5.6.1.1
    - zlib/1.3.1
