software: metar
display: "metar"
description: "航空气象 METAR 报文取数与解码命令行工具（从 NOAA 抓取指定站点的报文并解码成可读字段）"
category: network
homepage: "https://packages.debian.org/source/sid/metar"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "唯一外部依赖 libcurl：configure.ac 用 AC_CHECK_LIB([curl],[curl_easy_init]) 探测，探不到直接 AC_MSG_ERROR；配方 requires curl/8.15.0 并同时生成 AutotoolsToolchain 与 AutotoolsDeps（只出 Toolchain 会探测假绿、编译找不到 curl/curl.h）"
    - "tarball 自带 autoconf 2.59 预生成 configure 与 automake 1.8 的 Makefile.in；configure.ac 无 AC_CANONICAL_HOST，树内没有 config.guess/config.sub ⇒ 本包没有鸿蒙三元组识别墙，不需要平台三元组补丁"
    - "上游 bootstrap 要 aclocal-1.8/automake-1.8（设备上不存在，且 ~/usr/local/bin/automake 的 shebang 解释器已失效）⇒ 不走 autoreconf 自举"
    - "第一道真墙是 HMDFS 权限：config.status 用 umask 077 + mktemp -d 建临时目录，0700 目录在本文件系统不可写 ⇒ Makefile 全部生成失败；patch 0001 按 E011 改 umask 022"
    - "automake 1.8 maintainer 模式默认开启会让 make 反向再生成 configure（设备 autoconf 是 2.72）⇒ configure --disable-maintainer-mode"
    - "man 页：tar 内 metar.1 与 metar.pod 的 mtime 完全相同，pod2man 规则不触发，直接用上游自带 man 页，不需要 perl/pod2man 参与构建"
    - "上游无任何自动化测试套件（3 个 Makefile.am + configure.ac 全文无 TESTS/check:）；取数地址可用 METARURL 环境变量覆盖 ⇒ test_package 用 file:// 喂 NOAA 样本做全离线功能验证"
  common_dependencies:
    - curl

versions:
  "20190227.1":
    status: built
    build_date: "2026-09-27"
    conan_ref: "metar/20190227.1"
