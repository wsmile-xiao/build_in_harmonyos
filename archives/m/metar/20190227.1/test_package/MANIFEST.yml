# test_package/MANIFEST.yml — metar/20190227.1
# 上游官方测试声明（口径见 docs/TEST_QUALITY_SPEC.md 与 R51 上游测试三步法）

package: metar/20190227.1
homepage: "https://packages.debian.org/source/sid/metar"

# ── 第一步：清点上游测试（静态，证据见同目录 notes.md「五维测试账本」）──
# 上游 3 个 Makefile.am（顶层 16 行 / src 7 行 / doc 11 行）与 configure.ac（29 行）
# 全文检索 TESTS / check: / check-am: 零命中；tarball 31 个文件里没有 test/、tests/、
# 也没有任何 .sh/.c 测试件；bootstrap 只调 aclocal-1.8/automake-1.8/autoconf。
upstream_check_command: "none (upstream has no test suite)"

# conanfile.py build() 未集成 make check —— 上游没有可运行的官方测试
upstream_test_in_build: false
upstream_test_command: "none (upstream has no test suite)"

upstream_tests: []

# ── 第二步：可运行环境的实际执行（本包 test_package 承担功能验证）──
test_package_tests:
  - file: test.sh
    description: "全离线功能验证：无参/-h usage 契约（含上游非零退出码约定）+ 用 METARURL=file:// 喂 NOAA 报文样本，真实走完 curl 取数 → parse_NOAA_data → parse_Metar → decode_Metar，逐字段断言 12 项；再用第二份差分样本（站号/风向/能见度/温度/露点/气压/云量全不同，且入参用小写站号验证 strupc）断言 9 项并反向断言不含首样本的风向值；最后用非法报文做反向对照，断言上游 pattern-not-found 路径与字段不伪造"
    command: "bash test.sh"

# test.sh 每通过一条断言自增计数器并打印 METAR_TEST_ASSERTIONS_PASSED=N，
# 该值是本文件与 notes.md 的唯一计数来源（rule4：声明数 ≤ 实测数）。
assertion_count: 28

# ── 运行期口径 ──
# metar 的业务是访问 NOAA（https://tgftp.nws.noaa.gov/...），CI/设备不保证可达；
# 上游 src/main.c 的 download_Metar() 支持用 METARURL 环境变量覆盖取数地址，
# 因此测试全部离线可判（curl 8.15.0 的 Protocols 列表含 file，实测可用）。
network_required_for_tests: false
