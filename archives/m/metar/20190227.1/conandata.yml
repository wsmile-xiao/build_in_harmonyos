patches:
  - patch_file: "patches/0001-hmdfs-config-status-umask.patch"
    patch_description: "autoconf 2.59 生成的 configure 在写 config.status 临时目录的段落里用 umask 077 + mktemp -d；HMDFS 上 0700 目录对当前进程不可写，config.status 写 subs.sed/subs1.awk 报 Permission denied，三个 Makefile 全部生成失败（E011/E114 家族）。改 umask 022"
    patch_type: "portability"
