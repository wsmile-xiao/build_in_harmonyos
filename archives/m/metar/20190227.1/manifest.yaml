version: "20190227.1"
software: metar
status: built
build_date: "2026-09-27"
conan_ref: "metar/20190227.1"

source:
  url: "https://deb.debian.org/debian/pool/main/m/metar/metar_20190227.1.orig.tar.xz"
  sha256: "046d3f99c2ba53af910f4598173353c25333f1172693a9fe60fe8c1a4b4ff24c"
  tar_format: tar.xz

build:
  system: autotools
  # 上游 tarball 自带 autoconf 2.59 预生成 configure + automake 1.8 的 Makefile.in；
  # bootstrap 需要 aclocal-1.8/automake-1.8（设备上不存在，automake 的 shebang 解释器
  # 也已失效）⇒ 走预生成 configure，不自举（R1 原生编译，参数最少化）。
  configure_options:
    - "--disable-maintainer-mode"
  dependencies:
    - "curl/8.15.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-hmdfs-config-status-umask.patch"

# ── 五维测试账本（详见 notes.md，数字与 test.sh 自打印值同源）──
test_results:
  type: none_official
  upstream_total: 0
  executable: 0
  passed: 0
  failed: 0
  skipped: 0
  test_package_assertions: 28

knowledge_ref:
  - "E011"   # 正式条目：HMDFS 上 configure/config.status 的 umask 077 临时目录不可写
  - "E114"   # 正式条目：同一机制在 config.status 侧的错误签名（subs1.awk / could not setup config files machinery）
  - "DRAFT-E2186-autotools-deps-missing-dep-flags"  # 草稿：autotools 配方漏 AutotoolsDeps ⇒ AC_CHECK_LIB 探绿但编译缺 -I

knowledge_gained:
  - "tarball 自带 autoconf 2.59 预生成 configure，configure.ac 无 AC_CANONICAL_HOST，树内既无 config.guess 也无 config.sub ⇒ 本包没有鸿蒙三元组识别墙，框架的 patch-autotools-script（E007/E205/E268 的文件级替换）在此没有落点"
  - "第一道真墙是 HMDFS 权限：config.status 的 umask 077 + mktemp -d 段落写出 0700 目录，HMDFS 上对本进程不可写 ⇒ can't create ./confstatXXXXXX/subs.sed: Permission denied，三个 Makefile 全部生成失败（E011 修法 umask 077→022，实测 3 次稳定复现与稳定修复）"
  - "automake 1.8 的 maintainer 模式默认开启：改过 configure 后 make 会走 aclocal/autoconf 再生成链（设备上 autoconf 是 2.72、automake 的 shebang 解释器缺失），configure --disable-maintainer-mode 从根上关掉"
  - "AC_CHECK_LIB([curl],[curl_easy_init]) 不注入 -I/-L：generate() 必须同时出 AutotoolsToolchain 与 AutotoolsDeps，否则 configure 探测假绿、make 首个 TU 找不到 curl/curl.h（E2186 同族）"
  - "doc/metar.1 与 doc/metar.pod 在 tar 里 mtime 完全相同（2019-03-01 14:12:52）⇒ tar 解包后 pod2man 规则不被触发，make 只报 Nothing to be done，man 页用上游自带产物直接安装，不需要 perl/pod2man 参与构建"
  - "上游无任何测试套件（3 个 Makefile.am + configure.ac 全文无 TESTS/check:）；运行期取数地址可用 METARURL 环境变量覆盖 ⇒ test_package 全程离线（file:// 喂 NOAA 样本）做真实解码断言"
  - "上游 NOAA 报文头正则 ^([0-9/]+ [0-9:]+) 只吃斜杠日期（2019/02/27 12:50），连字符日期走 pattern-not-found 分支且退出码仍为 0（main.c 的 download_Metar() 恒返回 0，网络失败也是 0）"
