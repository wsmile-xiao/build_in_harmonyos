software: mupen64plus
# 版本级 manifest
# 文件位置: archives/m/mupen64plus/2.6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2.6.0"

# published | built | failed | archived
status: built

build_system: makefile

build_date: "2026-09-09"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/mupen64plus/mupen64plus-core/archive/2.6.0/mupen64plus-core-2.6.0.tar.gz"
  sha256: "e8445c01955ee5f9cb2cc8fa6e5d470223cb3560ddda49adbca1e85fce6b1a6d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  # 手写 Makefile（projects/unix/Makefile），依赖通过 make 变量注入
  # ZLIB/LIBPNG/SDL 的 _CFLAGS/_LDLIBS 绕过上游 pkg-config 探测
  configure_options:
    - "OSD=0"
    - "VULKAN=0"
    - "UNAME=Linux"
  dependencies:
    - zlib/1.3.1.1
    - libpng/1.6.58
    - sdl2/2.30.10
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Makefile OS 探测（uname -s）拒 HarmonyOS：UNAME 是 ?= 变量，外部注入 Linux 绕过"
  - "aarch64 → DYNAREC=arm64+NEW_DYNAREC=4：linkage_arm64.S 经 $(COMPILE.c) 由 clang 集成汇编器编译，零补丁"
  - "asm_defines 生成管线（grep '@ASM_DEFINE' 二进制）跨平台可用"
  - "OSD=0 绕开桌面 OpenGL/GLU/freetype2 依赖，核心 API 完整"
  - "SDL2 静态库链入 .so + api_export.ver 版本脚本：SDL 不泄漏为公共依赖"
