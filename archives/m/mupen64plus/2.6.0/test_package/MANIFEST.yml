# test_package/MANIFEST.yml
# 上游官方测试声明文件
#
# 经核验：mupen64plus-core 2.6.0 上游无自动化测试目标
#  - projects/unix/Makefile 仅 all/install/uninstall/clean/targets 目标，无 test/check
#  - tools/regtests/（daily-tests.cfg + regression-video.py）是视频输出回归脚本，
#    需要完整 mupen64plus 前端 + 各视频插件 + ROM 资产，非库级自动化测试
#  - .github/workflows/build.yml 仅编译验证（无测试步骤）
# 故上游测试清单为空（0/0），L1 消费者验证由 test_package 承担。

package: mupen64plus/2.6.0
homepage: "https://github.com/mupen64plus/mupen64plus-core"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -n check (projects/unix/Makefile 无 check 目标 -> No rule to make target)"
# 上游无 test/check 目标：Makefile 目标列表 all/install/uninstall/clean

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无：官方 CI 仅编译验证）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_mupen64plus.c
    description: "消费者测试：8 断言全链路——CoreGetAPIVersions 版本协商/CoreStartup 完整生命周期(配置+内存基址+ROM数据库+SDL引导)/状态机查询/内存ROM加载(头解析+字节序+MD5+CIC检测)/CoreGetRomSettings API契约/ROM关闭/防御性输入校验(<4096拒绝)/CoreShutdown 干净收尾；内置合成最小N64 ROM(合法 0x80371240 大端魔数)"
    command: "./test_mupen64plus"

# 测试断言总数 (近似值, 用于质量评估)
# 8 个断言（版本三元组 / 生命周期 / 状态机 / ROM 加载 / 契约 / 关闭 / 防御 / 收尾）
assertion_count: 8
