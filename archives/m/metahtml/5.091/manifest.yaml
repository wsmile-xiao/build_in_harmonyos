# 版本级 manifest
# 文件位置: archives/m/metahtml/5.091/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.091"

# 软件名
software: "metahtml"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GNU 官方镜像，双证：全量下载 sha256 复算 + 前任 dl 包逐字节一致）
  url: "https://ftp.gnu.org/gnu/metahtml/metahtml-5.091.tar.gz"

  # 源码校验和
  sha256: "c1b39352c4868895087b72fa2beb0c0d36e50ce4b7f4e53686ffe15ae8fbd9c9"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-gdbmlib=<build>/gdbm-compat/lib/libgdbm.so"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "gdbm/1.24"
    - "termcap/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（补丁 0001 十二文件：/tmp 死路径族+time.h+errno 声明族+configure
#   GCC_FPIC 分支；另有 build() 内四处就地改造不进补丁，见 notes 源码修改节）
patches_applied:
  - "patches/0001-ohos-runtime-tmp-paths-and-time-h.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "1992 config.sub 双词 OS 拆分缺陷：sed 只剥 -ohos 致 basic_machine 三段触发 *-*-* 拒收 + 机器表无 aarch64 ⇒ host 建不起来 ⇒ DASH_SHARED/GCC_FPIC 全空（模块 .so 被当可执行裸 ld）；同族现代脚本不踩"
  - "conanbuild 以自己的赋值覆盖 os.environ 的 LD_LIBRARY_PATH ⇒ build 期工具运行期依赖搜索路径必须 make 调用 shell 内联前缀；长值命令行变量只用双引号（self.run 链路单引号被中间层吞、双引号漏给 make 致 CFLAGS 含字面引号）"
  - "宿主工具原生构建确定性 libc++abi bad_alloc（抛在 preload 构造器前、ASan 同参全绿、疑应用 cgroup 分配器异常路径）→ make -k + ASan 重建 + 全量收口三段式确定性绕行，工具不随包发布"
  - "根 Makefile 递归硬传 LDFLAGS 吞依赖 -L ⇒ 命令行变量压回；上游 LIBUTILS/LIBMHTML 无序兄弟依赖 ⇒ -j2 必撞 regex.h，串行 -j1"
  - "OHOS /tmp 只读 EROFS：metahtml 锁/db 死路径族 5 处补丁改 TMPDIR 回退；musl errno 为宏无 extern int 实体符号（老式声明族 6 处改 errno.h）"
