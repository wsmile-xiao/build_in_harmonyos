# test_package/MANIFEST.yml — metahtml 5.091
# 上游测试声明文件（CI build_and_test.sh L0e 强制要求）
#
# 数据来源: 上游 tag v5.091 源码清点 + 2026-09-23 实跑
# 上游事实: 无 make check 目标、无 runner——tests/ 是 1996 手写自校验语料

package: metahtml/5.091
homepage: "https://www.gnu.org/software/metahtml/"

# 上游没有任何测试入口（Makefile.in 无 check/tests 目标、tests/ 无 runner 脚本）
upstream_check_command: "（无：上游无自动化测试入口）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "build() 内嵌 runner：mhc 渲染 tests/*.mhtml 隔离副本 + Result: 行逐字判定（PASS/QUOTED/NUMERIC<0.005 + 有序对齐 + STRIP 兜底档，语义见 notes 上游测试节），FAIL/ERROR 即抛错阻塞"

# 上游测试语料（137 个 .mhtml；runner 单位=文件，判定单位=断言行 361 可单行切分）
upstream_tests:
  - file: tests/*.mhtml
    source: "metahtml-5.091/tests/（137 个 .mhtml 自校验语料）"
    description: "整目录语料：每文件多条 `Result: <期望>: <表达式>` 断言，由 mhc 真实渲染后逐字比对；语料自带副作用（test.db / base-stream-put-test.mhtml）→ 隔离副本执行"
    command: "mhc <file>（build() 内嵌 runner 逐文件驱动）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py (test())
    description: "消费者冒烟：conanrun 环境下 mhc 渲染内联模板，断言输出含期望标记（验证包内 bin 与 gdbm/termcap 动态依赖可加载）+ metahtml 相关工具链存在"
    command: "sh -c 'mhc smoke.in → grep 标记'"

# 测试计数（双口径，与 notes/PR 同源）:
#   runner 单位: 137 文件全部执行（1 个因语料自带副作用缺席，按 absent 记录）
#   判定单位: 361 可单行切分断言（另有 42 条跨行期望 SKIP 不计）
#   终态行(原样): selfcheck: FILES=137 CHECKED=295 PASSED=295 FAIL=0 ERROR=0 SKIP=51 (100.0%)
assertion_count: 346
