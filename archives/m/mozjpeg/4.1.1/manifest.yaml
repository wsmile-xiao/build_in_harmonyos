software: mozjpeg
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.1.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mozilla/mozjpeg/archive/refs/tags/v4.1.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-G Ninja"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DWITH_SIMD=0"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_MAKE_PROGRAM=ninja"
    - "-DCMAKE_COMMAND=/data/service/hnp/bin/cmake"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - libpng/1.6.43

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS不支持mkfifo，GNU Make 4.4.1 jobserver会失败，需使用Ninja生成器"
  - "cmake 4.x与旧版cmake_minimum_required兼容性需-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "cmd-pkgs安装的cmake需ELF签名才能执行，或使用/data/service/hnp/bin/cmake"
  - "mozjpeg无nasm时可用-DWITH_SIMD=0编译（功能完整但无SIMD优化）"
  - "cmake --install支持DESTDIR环境变量做staging安装"
