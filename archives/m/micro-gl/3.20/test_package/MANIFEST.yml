# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: micro-gl/3.20
homepage: https://github.com/micro-gl/micro-gl

# 上游测试命令：上游无 ctest/测试框架（仅 examples/ 演示程序，无注册测试目标）
# R51 清点：根 CMakeLists 无 enable_testing；无 tests/ 目录；examples 为演示程序
upstream_check_command: "true"

upstream_test_in_build: false
upstream_test_command: ""

# 上游测试（无：上游仓库不提供可运行的注册测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_microgl.cpp
    description: "canvas clear + flat_color 矩形绘制 + 像素读回断言 (2 项检查)"
    command: "ctest --output-on-failure -R test_microgl"

# 测试断言总数 (test_package 2 项 + 上游 0)
assertion_count: 2