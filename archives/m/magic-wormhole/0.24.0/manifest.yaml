software: magic-wormhole
# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "0.24.0"
status: published
build_date: "2026-06-01"

source:
  url: "https://pypi.org/packages/source/m/magic-wormhole/magic_wormhole-0.24.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "pip install --no-deps --prefix=$DEFAULT_PREFIX --root=$TEST_PREFIX $BUILD_SRC_DIR"
  dependencies:
    - twisted/26.4.0
    - autobahn/25.12.2
    - spake2/0.9
    - pynacl/1.5.0
    - attrs/24.3.0
    - cryptography/44.0.0
    - automat/25.4.16
    - humanize/4.15.0
    - txtorcon/26.6.0
    - zipstream-ng/1.9.2
    - iterable-io/1.0.4
    - qrcode/8.2
    - click/8.1.8
    - tqdm/4.67.1
    - service_identity/23.1.0
    - pyopenssl/26.2.0
  cc: ""
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Python项目使用pip install而非configure/make"
  - "pip --no-deps避免cffi重建问题"
  - "pip --no-build-isolation用于hatchling构建后端的包"
  - "service_identity 26.1.0与cryptography 44.0.0不兼容,需降级到23.1.0"
  - "纯Python项目不需要ELF签名/strip/RPATH"
  - ".pth文件解决pip安装路径问题"