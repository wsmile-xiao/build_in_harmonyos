software: magic-wormhole
display: "Magic Wormhole"
description: "Securely transfer data between computers using short codes"
category: network
homepage: "https://github.com/warner/magic-wormhole"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "纯Python项目,使用pip安装而非configure/make"
    - "需要pip --no-deps和--no-build-isolation避免cffi重建问题"
    - "service_identity需降级到23.1.0以兼容系统cryptography"
    - ".pth文件解决pip安装路径问题"
    - "不需要ELF签名(纯Python脚本)"
  common_dependencies:
    - twisted
    - autobahn
    - spake2
    - pynacl
    - cryptography

versions:
  "0.24.0":
    status: published
    build_date: "2026-06-01"