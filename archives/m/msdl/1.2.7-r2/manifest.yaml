package: "msdl"
version: "1.2.7-r2"
status: "built"
build_system: "autotools"
homepage: "http://msdl.sourceforge.net/"
license: "GPL-2.0-or-later"

source:
  url: "https://downloads.sourceforge.net/project/msdl/msdl/msdl-1.2.7-r2/msdl-1.2.7-r2.tar.gz"
  sha256: "0297e87bafcab885491b44f71476f5d5bfc648557e7d4ef36961d44dd430a3a1"
  tar_format: "tar.gz"

build:
  system: "autotools"
  configure_options: []
  cflags:
    - "-fcommon"
    - "-fgnu89-inline"
  dependencies: []
  cc: "clang"
  notes: >
    无补丁文件。configure 内 umask 077 -> 022 为配方内联替换
    （E129 复用方案，replace_in_file），不落 patches/。

patches_applied: []

knowledge_gained:
  - "E129（HMDFS setgid 目录 + umask 077 临时目录不可进入）复用既有条目，配方内联 sed 级修复即可，无需补丁文件"
  - "2010 年 C 代码需 -fcommon（tentative definitions）+ -fgnu89-inline（url.h 内联函数无 extern 分离定义）双 flag"
  - "上游无自动化测试（无 check 目标），上游测试数 = 0"

tests:
  upstream:
    command: "make check"
    cases: 0
    passed: 0
    note: >
      上游不提供自动化测试：Makefile.am 无 TESTS/check_PROGRAMS 定义，
      也没有 tests/ 目录。make check 实际执行 EXIT=0 但无任何测试目标
      （输出无 "Checks" 段，直接完成）。证据见 notes.md。
  test_package:
    command: "test_package/test_msdl: fork+exec 包内 msdl（usage 退出码）+ 进程内 ELF 解析（arm64/musl interp/DT_NEEDED 仅 libc.so）+ 进程内 HTTP 服务器真实下载 64 KiB 比对"
    cases: 3
    passed: 3
    note: >
      L1 基础 1 项 + HarmonyOS 专项 2 项（ELF/动态依赖检查、真实
      HTTP 下载内容一致性）。全部在真机（本机 HarmonyOS aarch64 PC）
      实际执行通过。

platform:
  validated_architecture: "OHOS/armv8"
  limitations:
    - "上游无自动化测试套件；功能覆盖由 test_package 提供"
