# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: mtm/1.2.1
homepage: "https://github.com/deadpixi/mtm"

# mtm 上游无任何测试套件（源码包只有 mtm.c/vtparser.c/pair.c/mtm.1/mtm.ti/
# config.def.h/README.rst；Makefile 28 行，无 test/check 目标；README.rst
# 仅展示 vttest 截图且注明 "but have not been tested"）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# 消费者功能测试 1/1：pty 中启动 mtm（TERM=screen）→ 等待被托管 shell 的
# 输出经 mtm 的隐藏 pty 复制到前端（证明 forkpty + initscr + terminfo 真实
# 工作）→ 发送命令键 Ctrl-g w 删除最后一个节点（deletenode 对根节点调用
# quit(EXIT_SUCCESS)）→ 断言 exit 0。
# 内部 4 项断言（计为 1 个测试用例，不重复计数）：
#   a1 包内 mtm 二进制存在于 bindir
#   a2 启动后存活（超时窗口内不提前退出）
#   a3 被托管 shell 输出被多路复用到前端 pty（≥64 字节或含光标转义序列）
#   a4 命令键 Ctrl-g w 删除最后节点后干净退出（exit 0）
consumer_tests:
  - file: functional_test.py
    description: "pty 内启动 mtm，验证子进程输出被复用、命令键删除节点后干净退出（R34 实质调用；内含 a1-a4 共 4 项断言）"
    command: "python3 functional_test.py <bin/mtm>"

# 鸿蒙特有测试 1/1：对包内 mtm 二进制做 OHOS 平台契约验证。
# 内部 6 项断言（计为 1 个测试用例，不重复计数）：
#   o1 包内 mtm 为 AArch64 ELF（EM_AARCH64）
#   o2 动态解释器为 /lib/ld-musl-aarch64.so.1（OHOS musl）
#   o3 存在 OHOS .codesign 节（代码签名段，未剥离）
#   o4 NEEDED 动态依赖中没有 libutil（OHOS musl 将其并入 libc）
#   o5 forkpty 符号由 OHOS libc.so 解析（DT_NEEDED libc + dynsym 中
#      forkpty 为 UND，在 libc 导出表中有定义）
#   o6 真实 PTY 内启动包内 mtm 并正常退出（Ctrl-g w → exit 0）
ohos_specific_tests:
  - file: ohos_specific_test.py
    description: "OHOS 平台契约：AArch64 ELF + musl 解释器 + .codesign 签名节 + 无 libutil NEEDED + forkpty 由 libc 解析 + 真实 PTY 运行退出（内含 o1-o6 共 6 项断言）"
    command: "python3 ohos_specific_test.py <bin/mtm>"

assertion_count: 10
