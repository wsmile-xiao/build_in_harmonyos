# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mdp-src/1.0.18
homepage: "https://github.com/visit1985/mdp"

# 上游 Makefile 只有 all/clean/install/uninstall 目标（src/Makefile 仅
# all/clean），源码树只有 src/*.c 与 include/*.h，没有任何测试源文件、
# 测试脚本或 check/test 目标。
upstream_check_command: ""

# 上游无测试套件，因此 build() 中没有可集成的上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34: 实质驱动被测二进制)
test_package_tests:
  - file: test_version.c
    description: "编译消费者程序并执行：mdp -v 断言输出包含精确版本横幅 mdp 1.0.18 且退出码为 0"
    command: "./test_version"
  - file: test_version.c
    description: "向 mdp 传入不存在的输入文件，断言错误路径以非零退出码结束"
    command: "./test_version"

# 测试断言总数（test_version.c 中的断言数）
assertion_count: 3
