software: mysql-client
version: "8.4.9"
status: published
build_date: "2026-06-09"

source:
  url: "https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-8.4.9.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DWITHOUT_SERVER=ON"
    - "-DWITH_EDITLINE=none"
    - "-DWITH_SSL=system"
    - "-DWITH_LIBEVENT=bundled"
    - "-DFORCE_UNSUPPORTED_COMPILER=ON"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
  dependencies:
    - "openssl/system"
    - "zlib/system"
    - "libevent/bundled"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-add-editline-none-option-for-ohos.patch"
  - "0002-handle-editline-none-in-top-level-cmakelists.patch"
  - "0003-skip-mysql-cli-when-no-editline.patch"
  - "0004-fix-dns-srv-api-for-ohos-musl.patch"
  - "0005-fix-pthread_cancel-for-ohos-musl.patch"
  - "0006-fix-dns-srv-resolver-for-ohos-musl.patch"
  - "0007-fix-get_password-uchar-cast-for-ohos.patch"
  - "0008-skip-libmysql-api-test-on-ohos.patch"

knowledge_gained:
  - "MySQL 8.4.9 client-only build requires cmake with WITHOUT_SERVER=ON"
  - "WITH_EDITLINE=none needed because editline/libedit is not available on HarmonyOS NEXT"
  - "DNS SRV API (res_dns_srv) is not available in HarmonyOS musl libc, needs stubs"
  - "pthread_cancel() is not available in HarmonyOS musl libc, needs replacement with pthread_kill()"
  - "MySQL tests like libmysql_api_test fail on HarmonyOS due to missing POSIX APIs"
  - "All ELF binaries must be signed with binary-sign-tool on HarmonyOS NEXT"
  - "liblibmysql.so is the shared library providing MySQL client connectivity"

packaging:
  release: "mysql-client-8.4.9-ohos-aarch64.tar.gz"
  debug: "mysql-client-8.4.9-ohos-aarch64-debug.tar.gz"
  binaries:
    - "mysql_migrate_keyring"
    - "mysqltest"
    - "mysqlcheck"
    - "mysqldump"
    - "mysqlimport"
    - "mysqlshow"
    - "mysqlbinlog"
    - "mysqladmin"
    - "mysqlslap"
    - "mysql_config_editor"
    - "mysql_secure_installation"
    - "comp_err"
    - "my_print_defaults"
    - "perror"
    - "mysql_config"
  libraries:
    - "libmysqlclient.a (static)"
    - "liblibmysql.so (shared)"
