  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DOHOS=1"
    - "-DWITHOUT_SERVER=ON"
    - "-DWITH_UNIT_TESTS=OFF"
    - "-DWITH_ROUTER=OFF"
    - "-DWITH_NDB=OFF"
    - "-DWITH_SSL=system"
    - "-DWITH_ZLIB=system"
    - "-DWITH_CURL=none"
    - "-DWITH_BUILD_ID=OFF"
    - "-DINSTALL_LAYOUT=STANDALONE"
    - "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
    # try_run() presets still consumed by 9.7.1 (8.0.46's FALLOC_PUNCH_HOLE /
    # __BUILTIN_FFS / TEST_RUN_RESULT presets and CURSES_CURSES_H_PATH are no
    # longer used by 9.x):
    - "-DHAVE_SETNS_EXITCODE=1"
    - "-DHAVE_CLOCK_GETTIME_EXITCODE=0"
    - "-DHAVE_CLOCK_REALTIME_EXITCODE=0"
    # Boost: 9.x uses the bundled boost_1_87_0 headers shipped inside the
    # source tree; no WITH_BOOST / DOWNLOAD_BOOST switches exist anymore.

  dependencies:
    - openssl/3.5.6.1.1
    - zlib/1.3.1
    - ncurses/6.4

  cc: clang
  cxx: clang++
  cxx_standard: "23 (mapped to -std=gnu++2b by CMake 4.1.2 for clang 15)"

