# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "MySQL 9.x (innovator 系) 的 cmake/boost.cmake 重写为 always-bundled（直接 INTERFACE 指向源码树 extra/boost/boost_1_87_0，无版本检查无 WITH_BOOST 逻辑），配方不再需要 boost 包，8.0.46 的 boost 检查放宽补丁无 9.x 对应物"
  - "MySQL 9.7.1 顶层 CMakeLists.txt:521 硬设 CMAKE_CXX_STANDARD=23；OHOS clang 15 无 -std=c++23，CMake 4.1.2 自动映射 -std=gnu++2b，实测可编译"
  - "libs/mysql 的 C++23 库代码（curried concept placeholder、依赖 using 省略 typename、P0960 括号聚合初始化、std::ranges::prev/next/advance/distance C++23 CPO、string_view operator<=>）在 OHOS clang 15/libc++15 下全部编译失败，需逐项降级改写；std::bidirectional_iterator 对 CRTP 派生迭代器误判源于基类 operator-- 的 requires 依赖派生类成员检测"
  - "OHOS libc++ 无 <source_location>；libs/mysql 的 source_location 仅用于 debug 格式化助手，可用全局 OHOS 宏条件编译排除"
  - "libchangestreams 与 mysqlbinlog 是 libs/mysql/sets 概念链仅有的消费者；上游对 VS2019 有同款跳过先例（IF(VS2019 AND WITHOUT_SERVER)），OHOS 沿用该机制跳过二者，libmysqlclient.a 的 LIBS_TO_MERGE（clientlib/mytime/strings/vio/mysys）不受影响"
  - "9.7.1 的 try_run 探测减少：HAVE_FALLOC_PUNCH_HOLE_AND_KEEP_SIZE_EXITCODE、HAVE___BUILTIN_FFS_EXITCODE、TEST_RUN_RESULT(+__TRYRUN_OUTPUT)、CURSES_CURSES_H_PATH 已不被使用"
  - "HMDFS 写入层剥行尾空格 + 偶发读写延迟/删除延迟：补丁基准树必须 tar 命令解压；编辑源码后立即 make 可能读到旧内容产生假错误，等待或单独重编即可消除；rm 后 ls 可能看到旧文件"
  - "conan create 的补丁应用（patchng）比 GNU patch 严格（不接受 fuzz）；补丁必须以精确上下文生成并用 git apply --check 验证；增量补丁的基准树必须是与 conandata 声明顺序一致的前序补丁应用结果"

