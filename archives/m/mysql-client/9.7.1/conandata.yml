# OHOS patches (45, one per touched file): re-diffed against the 9.7.1
# source tree. Root causes are documented per patch group in notes.md.
# The 8.0.46 boost-version-check patch has no 9.7.1 counterpart:
# cmake/boost.cmake was rewritten upstream to always use the bundled
# boost_1_87_0 headers (no version check).

