# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: mysql-client/8.0.46
homepage: "https://github.com/mysql/mysql-server"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: libmysql/api_test.c.in
    source: mysql-8.0.46/libmysql/api_test.c.in
    description: "Link-and-call smoke test against the dynamic client library (upstream generates libmysql_api_test from this template and runs it as run_libmysql_api_test); on OHOS the shared libmysql target is skipped (patch 0001), so this upstream target is intentionally not exercised"
    command: "libmysql_api_test (skipped on OHOS, see notes.md)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer smoke test: mysql_library_init/mysql_library_end, mysql_get_client_info, mysql_get_client_version == 80046 (mysql-client 8.0.46), mysql_thread_safe, and a mysql_init/mysql_error/mysql_close cycle"
    command: "./test_mysql_client"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
