version: "8.4.11"
software: "mysql-client"

# published | built | failed | archived
status: built

build_date: "2026-09-10"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-8.4.11.tar.gz"
  sha256: "eb3051164d625dd346a8203f76e0d5d5d9aec51dbe9d51788e39ec6b3f1394c2"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DOHOS=1"
    - "-DWITHOUT_SERVER=ON"
    - "-DWITH_UNIT_TESTS=OFF"
    - "-DWITH_ROUTER=OFF"
    - "-DWITH_NDB=OFF"
    - "-DWITH_SSL=system"
    - "-DWITH_ZLIB=system"
    - "-DWITH_CURL=none"
    - "-DWITH_BUILD_ID=OFF"
    - "-DINSTALL_LAYOUT=STANDALONE"
    - "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
    - "-DCMAKE_CXX_STANDARD=20"
    # try_run() presets for the OHOS cross toolchain (no target emulator):
    # configure.cmake CHECK_C_SOURCE_RUNS probes (SETNS / CLOCK_GETTIME /
    # CLOCK_REALTIME) plus the 8.0.46-era innodb/bundled-libevent probes
    # (FALLOC_PUNCH_HOLE / __BUILTIN_FFS / TEST_RUN_RESULT), harmless extras.
    - "-DHAVE_SETNS_EXITCODE=1"
    - "-DHAVE_CLOCK_GETTIME_EXITCODE=0"
    - "-DHAVE_CLOCK_REALTIME_EXITCODE=0"
    - "-DHAVE_FALLOC_PUNCH_HOLE_AND_KEEP_SIZE_EXITCODE=0"
    - "-DHAVE___BUILTIN_FFS_EXITCODE=0"
    - "-DTEST_RUN_RESULT=0"
    - "-DTEST_RUN_RESULT__TRYRUN_OUTPUT=2.1.11-stable"

  dependencies:
    - openssl/3.5.6.1.1
    - zlib/1.3.1
    - ncurses/6.4
    # no boost: 8.4.11 (like 9.x) bundles header-only boost_1_84_0 inside the
    # source tree (extra/boost/boost_1_84_0), wired by cmake/boost.cmake.

  cc: clang
  cxx: clang++
  cxx_standard: "20"

