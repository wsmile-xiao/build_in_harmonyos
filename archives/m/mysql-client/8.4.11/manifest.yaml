# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "8.4.11 (maintenance 系) 无 libs/mysql 的 sets/strconv/ranges/iterators 概念链（9.x innovator 独有），母本 9.7.1 的 45 个补丁中 27 个（0012-0038）无对应物直接弃置；8.4.11 的 libs/mysql 只有 binlog/gtid/serialization/utils，其中仅 binlog/event/compression 两个头文件需要 clang15 typename 修正"
  - "8.4.11 的 cmake/boost.cmake 已是 always-bundled 形态（extra/boost/boost_1_84_0，无 WITH_BOOST 版本检查逻辑），与 9.x 相同；制品仓 boost/1.84.0 无需引入"
  - "8.4.11 无 WITH_DNS_SRV 显式开关（与别队 8.4 服务端形态不同）：libmysql/CMakeLists.txt 用 FIND_LIBRARY(RESOLV_LIBRARY) + HAVE_UNIX_DNS_SRV/HAVE_DNS_SRV 内部变量，dns_srv.cc 用 LINUX_ALPINE 宏。沿用 9.7.1 能力探测方案：顶层 CHECK_SYMBOL_EXISTS(res_nsearch) 生成 HAVE_RES_NSEARCH 特性宏，dns_srv.cc 据此选择 res_n* / res_search 路径，libmysql/CMakeLists.txt 在无 res_n* 时直接置 HAVE_UNIX_DNS_SRV（libc 自带 res_search，无需链接 libresolv）"
  - "8.4.11 的 configure.cmake 使用 CHECK_C_SOURCE_RUNS 探测 HAVE_SETNS/HAVE_CLOCK_GETTIME/HAVE_CLOCK_REALTIME（交叉编译必须预置 EXITCODE），innodb.cmake 用 FALLOC_PUNCH_HOLE/__BUILTIN_FFS，bundled libevent 用 TEST_RUN_RESULT——与 8.0.46 相同的 6 项预置"
  - "OHOS libc++15（clang 15.0.4）实测支持 C++20 的 <bit>（std::bit_width/bit_floor/bit_ceil/popcount）：8.4.11 的 mysys/lf_hash.cc、mf_keycache.cc、my_bitmap.cc、libs/mysql/serialization/variable_length_integers.h 均直接可用，无需别队 0004-0007 的 bit 替换补丁（那批补丁基于 'OHOS 无 <bit>' 的错误假设，实为 C++ 标准未到位）"
  - "8.4.11 用 cmake/libutils.cmake TARGET_COMPILE_FEATURES(cxx_std_20) 强制 C++20；配方设 CMAKE_CXX_STANDARD=20"
  - "8.4.11 的 client/CMakeLists.txt 无条件构建 mysqlbinlog（无 9.x 的 VS2019/OHOS 跳过门控），链接 mysql_binlog_event + mysqlclient + json_binlog_static，不依赖 libs/mysql 概念链，client-only 下可正常编译"
  - "8.4.11 的 WITHOUT_SERVER=ON 时顶层仍 ADD_SUBDIRECTORY(components/libminchassis)，与 client-only 构建兼容（libminchassis 为组件公共库）"
  - "上游 libmysql_api_test 的适配正确姿势是「换链接目标」而非「跳过测试」：该测试由 libmysql/api_test.c.in 经 CONFIGURE_FILE 生成 api_test.c，并以 run_libmysql_api_test ALL 目标在构建期运行；OHOS 因不构建共享 libmysql target，应改用 IF(TARGET libmysql)/ELSE() 回退到静态 mysqlclient target，这样编译期 <mysql.h> 声明检查与链接/运行期符号检查全部保留，测试仍真实执行（review rule4/rule5 整改）"
  - "上游 mysql-test/（MTR 套件，8983 个 .test）属 mysqld 服务端集成测试框架，运行需服务端二进制，不在 WITHOUT_SERVER=ON 的 client-only 适配范围内；client-only 构建图中唯一的上游测试 target 是 libmysql_api_test"

