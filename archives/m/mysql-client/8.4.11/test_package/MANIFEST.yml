# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: mysql-client/8.4.11
homepage: "https://github.com/mysql/mysql-server"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake build (upstream run_libmysql_api_test ALL target) -> ./runtime_output_directory/libmysql_api_test"

# 上游实际运行的测试程序
upstream_tests:
  - file: libmysql/api_test.c.in
    source: mysql-8.4.11/libmysql/api_test.c.in
    description: "Upstream link-and-call smoke test: CMake configures libmysql/api_test.c from this template (the api_calls[] array lists every CLIENT_API_FUNCTIONS symbol) and registers it as the run_libmysql_api_test ALL target. On OHOS the shared libmysql target is not built (patch 0008), so the test is linked against the static mysqlclient target instead — the compile-time <mysql.h> declaration check and the link/run-time symbol check are both preserved, and the test runs as part of the normal conan create build."
    command: "libmysql_api_test (built and executed in the conan create build phase; prints 'There are 133 API functions / MySQL client library initialized: 8.4.11 / Done!' and returns 0)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer smoke test (69 cases, ported from mysql/8.0.46): mysql_library_init/mysql_library_end, mysql_get_client_info, mysql_get_client_version >= 80411 (8.4.11), mysql_thread_safe, MYSQL handle init/close cycles, plus 10 OHOS-specific cases"
    command: "./test_mysql_client"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
