# conandata.yml — mysql-client 8.4.11

sources:
  url:
    - "https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-8.4.11.tar.gz"
    - "https://github.com/mysql/mysql-server/archive/refs/tags/mysql-8.4.11.tar.gz"
  filename: "mysql-8.4.11.tar.gz"
  sha256: "eb3051164d625dd346a8203f76e0d5d5d9aec51dbe9d51788e39ec6b3f1394c2"

# OHOS patches (18, one per touched file): re-diffed against the 8.4.11
# source tree (per-file, no incremental dependencies). 27 of the 9.7.1
# patches (libs/mysql sets/strconv/ranges/iterators concept-chain, 9.x
# innovator-only) have no 8.4.11 counterpart and were dropped; see notes.md
# for the per-patch disposition table.
patches:
  "8.4.11":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_type: "portability"
      patch_description: "top-level CMakeLists: libc/compiler capability probes (res_nsearch/pthread_cancel/source_location) gating the compat shims, skip MYSQL_CHECK_RPC and libchangestreams on OHOS"
    - patch_file: "patches/0002-client-CMakeLists.txt.patch"
      patch_type: "portability"
      patch_description: "client CMakeLists: guard shared json_binlog and json_binlog_main with IF(NOT OHOS), protect TARGET_COMPILE_OPTIONS"
    - patch_file: "patches/0003-config.h.cmake.patch"
      patch_type: "portability"
      patch_description: "config.h.cmake: declare HAVE_RES_NSEARCH / HAVE_PTHREAD_CANCEL feature macros"
    - patch_file: "patches/0004-extra-libcno-CMakeLists.txt.patch"
      patch_type: "portability"
      patch_description: "extra/libcno: invoke cno_huffman_generator via $<TARGET_FILE:...> (cross build PATH)"
    - patch_file: "patches/0005-extra-libedit-libedit-20240808-3.1-src-CMakeLists.txt.patch"
      patch_type: "portability"
      patch_description: "bundled libedit: OHOS 4-byte wchar_t / termcap / build fixes"
    - patch_file: "patches/0006-extra-libedit-libedit-20240808-3.1-src-chartype.h.patch"
      patch_type: "portability"
      patch_description: "bundled libedit: OHOS 4-byte wchar_t / termcap / build fixes"
    - patch_file: "patches/0007-extra-libedit-libedit-20240808-3.1-src-terminal.c.patch"
      patch_type: "portability"
      patch_description: "bundled libedit: OHOS 4-byte wchar_t / termcap / build fixes"
    - patch_file: "patches/0008-libmysql-CMakeLists.txt.patch"
      patch_type: "portability"
      patch_description: "libmysql CMakeLists: DNS SRV capability branch (no res_n* -> libc res_search), skip the shared libmysql target on OHOS and link the upstream libmysql_api_test against the static client library instead so it still builds and runs"
    - patch_file: "patches/0009-libmysql-dns_srv.cc.patch"
      patch_type: "portability"
      patch_description: "DNS SRV: use res_init()/res_search() when libc has no res_n*() APIs (capability-gated, replaces upstream LINUX_ALPINE macro)"
    - patch_file: "patches/0010-libs-mysql-binlog-event-compression-compressor.h.patch"
      patch_type: "portability"
      patch_description: "libs/mysql clang15/libc++15 compat: missing typename for dependent alias templates"
    - patch_file: "patches/0011-libs-mysql-binlog-event-compression-payload_event_buffer_istream.h.patch"
      patch_type: "portability"
      patch_description: "libs/mysql clang15/libc++15 compat: missing typename for dependent alias template"
    - patch_file: "patches/0012-mysys-my_thread.cc.patch"
      patch_type: "portability"
      patch_description: "my_thread_cancel: ENOSYS fallback when libc lacks pthread_cancel (capability-gated)"
    - patch_file: "patches/0013-plugin-group_replication-libmysqlgcs-cmake-rpcgen.cmake.patch"
      patch_type: "portability"
      patch_description: "skip group_replication rpcgen on OHOS (server component)"
    - patch_file: "patches/0014-scripts-CMakeLists.txt.patch"
      patch_type: "portability"
      patch_description: "scripts: comp_sql generators via $<TARGET_FILE:...>, static-library fallback for libmysql properties"
    - patch_file: "patches/0015-scripts-sys_schema-CMakeLists.txt.patch"
      patch_type: "portability"
      patch_description: "scripts/sys_schema: comp_sql generator via $<TARGET_FILE:...>"
    - patch_file: "patches/0016-sql-common-get_password.cc.patch"
      patch_type: "portability"
      patch_description: "get_password: uchar cast for my_read"
    - patch_file: "patches/0017-strings-CMakeLists.txt.patch"
      patch_type: "portability"
      patch_description: "strings: uca9dump generator via $<TARGET_FILE:...>"
    - patch_file: "patches/0018-utilities-CMakeLists.txt.patch"
      patch_type: "portability"
      patch_description: "utilities: comp_err/comp_client_err generators via $<TARGET_FILE:...>, build comp_err on OHOS cross build"
