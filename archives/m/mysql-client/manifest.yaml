software: mysql-client
display: "MySQL Client"
description: "MySQL 客户端库和工具集，提供 mysqladmin、mysqldump、mysqlcheck 等数据库管理工具及 libmysqlclient 客户端连接库"
category: database
homepage: "https://dev.mysql.com/"
license: GPL-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "WITH_EDITLINE=none 必须设置，因为 HarmonyOS NEXT 缺少 editline/libedit"
    - "DNS SRV API (res_dns_srv) 不可用，需在代码中提供 stub 实现"
    - "pthread_cancel() 在 HarmonyOS musl libc 中不可用，需替换为 pthread_kill()"
    - "所有 ELF 二进制必须使用 binary-sign-tool 签名"
    - "mysql CLI 交互工具不可用（依赖 editline），但其他客户端工具正常"
  common_dependencies:
    - "openssl/system"
    - "zlib/system"

versions:
  "8.4.9":
    status: published
    build_date: "2026-06-09"
    published_as: mysql-client
    source_url: "https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-8.4.9.tar.gz"
  "8.0.46":
    status: failed
    build_date: "2026-06-09"
    failure_reason: "源码包不完整，缺少 strings/vio/mysys 目录，无法完成 CMake 配置"