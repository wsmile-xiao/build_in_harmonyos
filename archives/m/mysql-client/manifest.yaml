software: mysql-client
display: "MySQL Client"
description: "MySQL 客户端工具集与 libmysqlclient 客户端库（client-only 构建）"
category: database
homepage: "https://github.com/mysql/mysql-server"
license: GPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use the upstream CMake build with WITHOUT_SERVER=ON (client-only subset)."
    - "Treat the OHOS target as Linux/aarch64 for upstream CMake OS modules while keeping the OHOS compiler profile."
    - "Presets for cross-compiling try_run probes (SETNS/CLOCK_GETTIME/CLOCK_REALTIME/FALLOC/__BUILTIN_FFS/libevent version)."
    - "Capability probes (HAVE_RES_NSEARCH/HAVE_PTHREAD_CANCEL) gate the OHOS libc compat shims in dns_srv.cc / my_thread.cc."
    - "Dependencies resolved through cache variables with cmake_find_mode=none (openssl/zlib/ncurses); Boost header-only — 8.0.46 resolves via WITH_BOOST, 8.4.11 and 9.x bundle a header-only copy in the source tree (always-bundled cmake/boost.cmake, no WITH_BOOST)."
    - "Ported from the published mysql/8.0.46 recipe (same upstream tarball, sha256-verified); see archives/m/mysql/8.0.46/notes.md for the baseline story. Each version keeps its own version-level notes.md."

versions:
  "8.0.46":
    status: built
    build_date: "2026-09-10"
    conan_ref: "mysql-client/8.0.46"
  "8.4.11":
    status: built
    build_date: "2026-09-10"
    conan_ref: "mysql-client/8.4.11"
  "9.7.1":
