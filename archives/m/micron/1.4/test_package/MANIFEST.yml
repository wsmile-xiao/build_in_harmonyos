# test_package/MANIFEST.yml — micron 1.4
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: micron/1.4
homepage: "https://www.gnu.org.ua/software/micron/"

# 上游测试命令（autotest 套件，tests/*.at 共 14 项）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试：14 项全部执行——2 项通过（cron 表达式解析、下次时间计算，
# 纯逻辑单测，OHOS 上真实通过）；12 项由套件自身跳过（AT_SKIP_IF：需要
# FAKELIB_PRELOAD，即 libfaketime/fakeroot 预载库并以 root 运行，设备与 CI
# 环境均不具备）。
upstream_tests:
  - file: tests/parsetest.c
    source: micron-1.4/tests/parsetest.c
    description: "cron 表达式解析用例（tests/parsetest 二进制，1 项，通过）"
    command: "make check"
  - file: tests/timetest.c
    source: micron-1.4/tests/timetest.c
    description: "下次执行时间计算用例（tests/timetest 二进制，1 项，通过）"
    command: "make check"
  - file: tests/*.at
    source: micron-1.4/tests/*.at
    description: "12 项端到端场景用例（day/dom/dow/hr/mail/maxinst/min/outfile/vinput/syslog/vscope/linecont），全部由套件自身跳过：AT_SKIP_IF([test -z \"$FAKELIB_PRELOAD\"])——需要 libfaketime/fakeroot 预载库且以 root 运行"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package/test.sh
    description: "运行安装后的二进制：micrond -h 输出版本用法（含 -f 选项）且退出 0；crontab 对未知选项给出用法诊断并返回非零（1 个消费者程序，3 处断言）"
    command: "conan test test_package micron/1.4"

# Approximate assertion count
assertion_count: 3
