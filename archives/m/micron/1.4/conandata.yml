# conandata.yml — micron 1.4
#
# 官方源码来自 GNU 项目发布目录（ftp.gnu.org/gnu/micron/）。
# 顶层目录 micron-1.4/：src/（micrond 守护进程、crontab 客户端与库）、
# tests/（autotest 套件，14 项）、doc/、lib/。
#
# 补丁说明：OHOS 的 musl libc 不实现 POSIX 线程取消 API（pthread_cancel /
# pthread_testcancel / pthread_setcancelstate / pthread_setcanceltype，见知识库
# E085），micron 以「pthread_cancel + pthread_join」停止 6 个线程，因此链接期
# 报 `undefined symbol: pthread_cancel`。空实现 stub 会令 join 永久阻塞、
# 守护进程关闭即死锁，故本适配改为**协作式关闭**移植：统一停止标志
# （cron_shutdown）＋ 逐线程唤醒（条件变量广播 / poll 超时 / socket 接收超时）
# ＋ 自愿退出后 join。

sources:
  url:
    - "https://ftp.gnu.org/gnu/micron/micron-1.4.tar.gz"
    - "https://mirrors.tuna.tsinghua.edu.cn/gnu/micron/micron-1.4.tar.gz"
    - "https://mirrors.ustc.edu.cn/gnu/micron/micron-1.4.tar.gz"
  sha256: "036e662f5a60cf98bb6a4b0e6ad39f9d5c213ea07efe9f586b567f192573cda4"

patches:
  - patch_file: "patches/0001-src-micrond.h.patch"
    patch_description: "声明协作式关闭的共享标志 cron_shutdown 与唤醒函数 cron_threads_wakeup（替代 pthread_cancel 语义的公共入口）"
    patch_type: "portability"
  - patch_file: "patches/0002-src-micrond.c.patch"
    patch_description: "default_stop_thread 由 pthread_cancel+join 改为：置 cron_shutdown、唤醒全部工作线程（cron_threads_wakeup + cron_main_wakeup）后再 join；调度线程主循环检查停止标志后自愿退出"
    patch_type: "portability"
  - patch_file: "patches/0003-src-runner.c.patch"
    patch_description: "新增 cron_threads_wakeup()（广播 runner/proctab/cronjob_output 三个条件变量）；runner 与 cleaner 线程循环检查停止标志并自愿退出（cleanup 处理器改为正常退出时也执行）；输出线程改用独立的 cronjob_output_stop 标志 + 1s 定时等待（避免 outfile_mutex 与 cronjob_output_mutex 的锁序风险）；fork 失败路径不再 cancel 短命的输入线程"
    patch_type: "portability"
  - patch_file: "patches/0004-src-watcher.c.patch"
    patch_description: "inotify 监视线程的 poll(-1) 改为 poll(1000) 并每轮检查停止标志，使守护进程能在 1 秒内响应关闭"
    patch_type: "portability"
  - patch_file: "patches/0005-tests-micronh.c.patch"
    patch_description: "测试辅助程序 tests/micronh.c 同样以 pthread_cancel 停止其 syslog 读取线程；改为停止标志 + socket 接收超时（SO_RCVTIMEO 1s），使整树（含测试框架）在无 pthread_cancel 的平台上可链接可运行"
    patch_type: "portability"
