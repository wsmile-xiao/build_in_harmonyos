software: mlmmj
display: "mlmmj"
description: "Mailing list manager (MLM) suite — mail-driven mailing list server tools"
category: network
homepage: "http://mlmmj.org/"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "build-aux/config.guess + config.sub 补丁识别 HarmonyOS（__OHOS__ / uname HarmonyOS）→ aarch64-unknown-linux-ohos，原生 configure 无需 --build/--host"
    - "configure 内 umask 077 临时目录在 HMDFS 不可写 → umask 022（E011，configure 两处）"
    - "安装钩子 ln -f -s 创建 mlmmj-recieve / mlmmj-make-ml.sh 别名在 HMDFS 全盘 EPERM → cp -f（E050）"
    - "mlmmj-make-ml 内置 @textlibdir@ 构建期绝对路径不可重定位 → 相对脚本自身解析包内 share/mlmmj/text.skel（0005）"
    - "OHOS libc fclose() 丢弃未 flush 的 open_memstream 缓冲 → strgen.c decode_qp() 与 xstring_free()/xstring_get() 收尾补 fflush()（0006/0008）"
    - "HMDFS stat() 一律报存储属主、进程为每会话 uid → mlmmj.c open_listdir() 属主检查回退为 access(W_OK) 可写性判定（属主/root 直过，可写者放行，不可写者仍拒绝；0007）"
    - "工具使用裸 getopt（无长选项）：-h 命中 print_help 且 exit(EXIT_SUCCESS)，冒烟门禁可经 --help 兜底通过"
  common_dependencies: []

versions:
  "1.6.0":
    status: published
    build_date: "2026-10-04"
    conan_ref: "mlmmj/1.6.0"
