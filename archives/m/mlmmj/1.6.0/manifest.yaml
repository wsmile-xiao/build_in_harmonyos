  - mlmmj-receive
  - mlmmj-process
  - mlmmj-sub
  - mlmmj-unsub
  - mlmmj-bounce
  - mlmmj-maintd
  - mlmmj-list
  - mlmmj-recieve
  - mlmmj-make-ml
  - mlmmj-make-ml.sh

patches_applied:
  - 0001-recognize-ohos-triplet-config-guess.patch
  - 0002-recognize-ohos-triplet-config-sub.patch
  - 0003-use-readable-configure-tempdirs.patch
  - 0004-replace-install-symlinks-with-copies.patch
  - 0005-resolve-listtexts-relative-to-script.patch
  - 0006-flush-memstream-before-fclose.patch
  - 0007-relax-listdir-owner-check.patch
  - 0008-flush-xstring-memstream-before-fclose.patch

test_results:
  upstream_command: "make check (KYUA --config=kyua.conf test --kyuafile=Kyuafile; requires ATF + kyua)"
  upstream_scope: "ATF suite run out-of-band on device via a direct-drive harness (kyua absent): 8 atf-sh scripts (111 case entries) + the atf-c program tests/mlmmj (92 registered cases) = 203 entries executed, none skipped; tests/fakesmtpd is a helper spawned by the shell suites"
  upstream_total: 203
  upstream_passed: 197
  upstream_failed: 6
  test_package: "16-case consumer E2E (test.sh): make-ml creates a real list; sub/unsub/list exercise normal/digest/nomail partitions, counts, idempotent re-subscribe, alias copies and version banner"
  local_status: "patch acceptance matrix (config.sub 4 cases + config.guess fake-uname) and recipe syntax pass on Windows host"
  device_status: "conan create + test_package 16/16; ohc-run.py conan-verify Verdict PASS (G0-G4 + L2/L4/L5, 2026-10-04T15:50:18); upstream ATF 203 entries executed: 197 pass / 6 fail / 0 skip (atf-sh 106/111, atf-c 91/92), the 6 failures are platform-semantics only (HMDFS ignores chmod bits; symlinks unconstructible; sandbox returns EACCES instead of ENOENT for /usr paths)"
  device_run_dir: "device $HOME/mlmmj-atf (harness run-tests-v64.sh + per-case logs; not committed)"

remote_status:
  mlmmj_ohpcd_list: "to be checked via conan list \"mlmmj/*\" -r=ohpcd"

knowledge_gained:
  - "2018-vintage build-aux/config.guess|config.sub dialect: HarmonyOS support needs three config.sub edits (maybe_os list / ohos-linux branch / main whitelist linux-ohos*|ohos*), otherwise linux-ohos is swallowed by the linux*) sed rewrite into linux-gnu-ohos"
  - "configure 0003: umask 077 to 022 (two spots), same as m4 (E011); 0700 confXXXXXX dirs are unwritable on HMDFS"
  - "Install-hook aliases ln -f -s fail with EPERM on HMDFS to cp -f (E050); patching both Makefile.am and Makefile.in (am first, in second) avoids make re-generation"
  - "mlmmj-make-ml embeds @textlibdir@ as a build-time absolute path -> not relocatable inside a Conan package; 0005 resolves share/mlmmj/text.skel relative to the script itself"
  - "OHOS libc fclose() on an open_memstream drops unflushed data (0006 strgen.c decode_qp, 0008 xstring_free/xstring_get; in xstring it additionally leaves the stream in a state that aborts the process at exit) - flush before close"
  - "HMDFS stat() reports the storage owner (20001006) for every path while processes run under a per-session uid, so mlmmj.c open_listdir()'s plain uid/owner comparison rejected legitimate list owners on OHOS -> falls back to an access(W_OK) writability check (0007)"
  - "Sandbox path semantics: /usr and /bin are not searchable by the app uid (stat/ls return EACCES), so execve(\"/usr/bin/nope\") fails with EACCES, not ENOENT; id(1) itself is unusable (\"bad uid <n>\")"
  - "OHOS procfs read() on /proc/<pid>/cmdline spins instead of returning EOF when the target exits mid-read; any cleanup scan must bound the read (timeout)"
  - "mlmmj tools use bare getopt (no long options); --help still exits 0 because the individual letters hit print_help(exit EXIT_SUCCESS), so the L2 smoke gate passes via its --help fallback"
  - "Upstream tests use ~31 `ln -s` calls for listtexts; the device run needs a PATH shim mapping ln -s to cp -Rf (E050) for the shell suites, plus an LD_PRELOAD symlink() interposer for the atf-c program (which calls symlink(2) directly; without it two cases deadlock into the fake SMTP server's accept())"
  - "Upstream make check calls kyua directly via check-local; kyua is absent on the device, so the device run executes atf entities directly; upstream mlmmj-receive declares the ident \"simple\" twice, each occurrence needs its own workdir (kyua isolation semantics)"
