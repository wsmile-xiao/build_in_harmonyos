# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mlmmj/1.6.0
homepage: "http://mlmmj.org/"

# 上游测试命令 (make check → check-local 直接调用 $(KYUA))
upstream_check_command: "make check (KYUA --config=kyua.conf test --kyuafile=Kyuafile; requires ATF + kyua)"

# conanfile.py build() 是否集成上游测试
upstream_test_in_build: false
upstream_test_command: "ATF suite executed out-of-band on device (kyua is not present): atf-sh runs the 8 shell test scripts; the single atf-c program tests/mlmmj runs directly (tests/fakesmtpd is a helper spawned by the shell suites, not a test program)."

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/mlmmj-sub
    source: mlmmj-1.6.0/tests/mlmmj-sub.in
    description: "atf-sh script: subscribe / digest / nomail / unsubscribe scenarios against a scratch list"
    command: "atf-sh tests/mlmmj-sub"
  - file: tests/mlmmj-list
    source: mlmmj-1.6.0/tests/mlmmj-list.in
    description: "atf-sh script: mlmmj-list output for normal/digest/nomail subscriber sets"
    command: "atf-sh tests/mlmmj-list"
  - file: tests/mlmmj-receive
    source: mlmmj-1.6.0/tests/mlmmj-receive.in
    description: "atf-sh script: mail injection through mlmmj-receive"
    command: "atf-sh tests/mlmmj-receive"
  - file: tests/mlmmj-send
    source: mlmmj-1.6.0/tests/mlmmj-send.in
    description: "atf-sh script: mlmmj-send delivery against tests/fakesmtpd"
    command: "atf-sh tests/mlmmj-send"
  - file: tests/mlmmj-bounce
    source: mlmmj-1.6.0/tests/mlmmj-bounce.in
    description: "atf-sh script: bounce handling"
    command: "atf-sh tests/mlmmj-bounce"
  - file: tests/mlmmj-process
    source: mlmmj-1.6.0/tests/mlmmj-process.in
    description: "atf-sh script: mlmmj-process mail processing"
    command: "atf-sh tests/mlmmj-process"
  - file: tests/mlmmj-maintd
    source: mlmmj-1.6.0/tests/mlmmj-maintd.in
    description: "atf-sh script: maintenance daemon single-pass operation"
    command: "atf-sh tests/mlmmj-maintd"
  - file: tests/functional-tests
    source: mlmmj-1.6.0/tests/functional-tests.in
    description: "atf-sh script: end-to-end functional scenarios"
    command: "atf-sh tests/functional-tests"
  - file: tests/mlmmj
    source: mlmmj-1.6.0/tests/mlmmj.c + tests/mlmmj_tests.c
    description: "atf-c unit test program built with the packaged libmlmmj sources"
    command: "tests/mlmmj"
  - file: tests/fakesmtpd
    source: mlmmj-1.6.0/tests/fakesmtpd.c
    description: "helper SMTP server (not declared in Kyuafile); spawned by the send/functional test scripts"
    command: "tests/fakesmtpd (helper)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Consumer E2E: packaged mlmmj-make-ml creates a real list, then mlmmj-sub / mlmmj-unsub / mlmmj-list drive normal/digest/nomail partitions, counts, idempotent re-subscribe, alias copies and version banner (16 cases)."
    command: "bash test.sh"

# 测试项总数 (test.sh 实际执行 16 个逐例校验)
assertion_count: 16

test_modifications:
  - "No upstream tests are modified or removed."
  - "kyua is absent on the OHOS device; the atf-sh scripts run directly under the packaged atf-sh and the KYUA wrapper in check-local is unused."
  - "The tests prepare listtexts via `ln -s`; on HMDFS symlink creation fails (E050). The device run uses two shims at run time, upstream test files stay untouched: a PATH shim mapping ln -s to cp -Rf for the shell suites, and an LD_PRELOAD symlink() interposer (materializes the target as a recursive copy) for the atf-c program, which calls symlink(2) directly."
