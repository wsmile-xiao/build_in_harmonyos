# conandata.yml — mlmmj 1.6.0
#
# Sources are declared as an ordered list: the upstream release tarball first,
# then a byte-identical distro mirror. Codeberg rate-limits CI workers with
# HTTP 429 (see DRAFT-ci-predl-curl-missing-conandata-mirror-list-fallback and
# the libjodycode/libscfg recipes for the same failure), and the CI
# pre-download step cannot help when curl is absent on the worker, so the
# recipe itself carries the fallback. Both entries are the same archive:
# sha256 2161e0b2…04633, 427680 bytes (verified against the Alpine distfiles
# copy).

sources:
  url:
    - "https://codeberg.org/mlmmj/mlmmj/releases/download/RELEASE_1.6.0/mlmmj-1.6.0.tar.gz"
    - "https://distfiles.alpinelinux.org/distfiles/v3.23/mlmmj-1.6.0.tar.gz"
  sha256: "2161e0b2d2d8cc54625f7439dec3a9ef54b2343a50c34fe22ba5098b9ec04633"

patches:
  - patch_file: "patches/0001-recognize-ohos-triplet-config-guess.patch"
    patch_description: "config.guess: detect HarmonyOS (__OHOS__ / uname HarmonyOS) and emit aarch64-unknown-linux-ohos"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-recognize-ohos-triplet-config-sub.patch"
    patch_description: "config.sub: accept ohos / linux-ohos triplets and system names"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-use-readable-configure-tempdirs.patch"
    patch_description: "Avoid 0700 configure temp directories that are unusable on HMDFS (E011)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0004-replace-install-symlinks-with-copies.patch"
    patch_description: "Install the mlmmj-recieve / mlmmj-make-ml.sh aliases as copies: HMDFS rejects symlink creation (E050)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0005-resolve-listtexts-relative-to-script.patch"
    patch_description: "Resolve the list text skeleton relative to mlmmj-make-ml so the Conan package is relocatable"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0006-flush-memstream-before-fclose.patch"
    patch_description: "strgen.c decode_qp(): fflush() the open_memstream buffer before fclose(); the OHOS libc fclose() discards unflushed memstream data, so decoded header words came back empty"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0007-relax-listdir-owner-check.patch"
    patch_description: "mlmmj.c open_listdir(): when the calling uid differs from st_uid, fall back to an access(W_OK) writability check; HMDFS reports the storage owner for every path while callers run under a per-session uid, so the plain uid comparison rejected legitimate list owners (no platform conditional compilation)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0008-flush-xstring-memstream-before-fclose.patch"
    patch_description: "include/xstring.h: fflush() the open_memstream buffer before fclose() in xstring_free()/xstring_get(); the OHOS libc fclose() discards unflushed memstream data and leaves the stream in a state that aborts the process during exit"
    patch_type: "portability"
    strip: 1
