# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mwc/2.0.5
homepage: "https://github.com/Debianguru/MailWebsiteChanges"

# 上游测试命令 — 上游 2.0.5 无自动化测试套件（无 tests/、无 test_*.py、
# 无 pytest/unittest 配置；tarball 唯一 "test" 字符串是 mwc.py:8 的孤立注释）
# 真实测试入口 = 工具自身的 dry-run 模式（README "Program execution" 节）
upstream_check_command: "python3 mwc.py --config=<cfg> --dry-run=<site>"
upstream_tests_exist: false

# conanfile.py build() 方法中是否已集成上游测试（dry-run 冒烟）
upstream_test_in_build: true
upstream_test_command: "python3 mwc.py --config=smokeconfig --dry-run=smoke (file:// 本地站点)"

# 上游实际运行的测试程序（上游无 tests/ 目录，此处声明真实入口的执行形态）
upstream_tests:
  - file: mwc.py
    source: MailWebsiteChanges-2.0.5/mwc.py
    description: "上游 dry-run 冒烟（build() 内 _run_dryrun_smoke）：本地 file:// HTML 站点 + CSSParser 解析链，断言 2 条结果（URLReceiver→cssselect→lxml 全链真实执行）"
    command: "python3 mwc.py --config=smokeconfig --dry-run=smoke"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_mwc_consumer.py
    description: "消费者测试 6 项：包布局（bin 4 脚本+site-packages+deps vendor）/ lxml C 扩展导入解析 / cssselect CSS→XPath / mwctools 类面 / CLI usage 路径 / 鸿蒙端到端 dry-run（安装后的 mwc.py 对 file:// 站点解析出 2 条结果）"
    command: "python3 test_mwc_consumer.py <package_folder>"

# 测试断言总数（实际 assert 计数）
# 口径：运行时求值次数 = 26
#   - 静态 assert 语句 15 条（ast.parse 实测）
#   - 其中 2 条位于 4 次循环（bin/ 脚本布局检查，8 次求值）、
#     1 条位于 6 次循环（mwctools 类面检查，6 次求值）
#   - 15 - 3(循环体静态计 1) + 8 + 6 = 26 次运行时求值
assertion_count: 26
