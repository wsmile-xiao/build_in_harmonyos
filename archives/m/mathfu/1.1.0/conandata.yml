# Conan source data for mathfu 1.1.0.
# The library itself is header-only with zero dependencies; googletest is
# pulled in as a build requirement to compile the upstream unit tests during
# conan create. The v1.1.0 release tarball ships the git submodules under
# dependencies/ as empty directories, so the upstream CMake build cannot be
# used and the recipe compiles the upstream test translation units directly.
