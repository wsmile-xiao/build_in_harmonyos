# 版本级 manifest
# 文件位置: archives/m/mathfu/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 软件名
software: mathfu

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-02"
build_system: cmake
conan_ref: "mathfu/1.1.0"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/google/mathfu/archive/refs/tags/v1.1.0.tar.gz"

  # 源码校验和
  sha256: "98f167002085c0ae1b2ac1668d3342fc4bafbe6b2185b3b9e88436d19332f8ca"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  # v1.1.0 release tarball 的 dependencies/ 子模块（fplutil、googletest、
  # vectorial）为空目录，上游 cmake/find_fplutil.cmake 无法配置。配方以
  # 工具链编译器直接编译三个上游测试翻译单元，等价于上游 no_simd 测试
  # 变体（-DMATHFU_COMPILE_WITHOUT_SIMD_SUPPORT）。
  configure_options:
    - "-std=c++11 -O2 -ffp-contract=off -DMATHFU_COMPILE_WITHOUT_SIMD_SUPPORT"
    - "-Wall -Wextra -Werror -Wno-deprecated-copy-with-user-provided-copy"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  test_dependencies:
    - "googletest/1.12.1 (仅 conan create 期间编译上游单元测试)"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "Google Test"
  upstream_passed: 325
  upstream_failed: 0
  test_package_passed: 1
  test_package_failed: 0
  test_package_assertions: 23
  execution: "conan create rc=0; three upstream gtest suites compiled and run natively; CMake consumer test"

test_passed: 326
test_failed: 0

verified:
  compiler: "OHOS Clang 15.0.4"
  cmake: "4.1.2"
  conan: "2.29.1"
  date: "2026-10-02"
  evidence: "Conan create exited 0; vector_test 180/180, matrix_test 129/129, quaternion_test 16/16; test_package 1/1 (23 assertions)"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无源码补丁；平台差异（FMA 收缩、SIMD 头缺失）全部在配方层解决

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "v1.1.0 release tarball 的 dependencies/ 三个 git 子模块为空目录，上游 CMake 构建链（find_fplutil.cmake）不可用，需直接编译上游测试翻译单元"
  - "aarch64 clang 默认 FMA 收缩（-ffp-contract=on）改变行列式舍入路径，上游 InverseNonInvertible 的 float/double 3x3 两例与 QuaternionTests.Inverse 共 3 例失败；-ffp-contract=off 恢复 IEEE 逐步舍入，325/325 全过"
  - "OHOS clang 15 仅定义 __ARM_NEON（无尾下划线），上游 __ARM_NEON__ 检测不触发；vectorial 头又不随 tarball 分发，用上游 no_simd 变体宏（MATHFU_COMPILE_WITHOUT_SIMD_SUPPORT）显式固化标量契约"
  - "clang 15 -Werror 下 2014 年代码的用户提供拷贝构造触发 deprecated-copy 警告，需 -Wno-deprecated-copy(-with-user-provided-copy) 抑制"
  - "header-only 库：package 只含 include/*.h + LICENSE，package_id 清空，cpp_info.defines 暴露 MATHFU_COMPILE_WITHOUT_SIMD_SUPPORT 给消费者"
