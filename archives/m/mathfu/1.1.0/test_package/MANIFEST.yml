# Test manifest for mathfu 1.1.0.
package: mathfu/1.1.0
homepage: "https://github.com/google/mathfu"

upstream_test_in_build: true
upstream_test_command: "vector_test && matrix_test && quaternion_test (gtest suites compiled and run by the recipe's build())"
upstream_test_count: 325
upstream_passed: 325
upstream_failed: 0
upstream_test_sources:
  - unit_tests/vector_test/vector_test.cpp
  - unit_tests/matrix_test/matrix_test.cpp
  - unit_tests/quaternion_test/quaternion_test.cpp
upstream_test_note: >
  The v1.1.0 release tarball ships dependencies/ git submodules (fplutil,
  googletest, vectorial) as empty directories so the upstream CMake test
  driver cannot configure; the recipe compiles the exact upstream test
  translation units with the toolchain compiler (upstream no_simd variant,
  -ffp-contract=off to keep IEEE step-by-step rounding — FMA contraction
  breaks the exact-cancellation boundary cases) and runs them natively on
  aarch64. googletest comes from the ohpcd remote as a build requirement.

test_files:
  - path: "test_package/test.cpp"
    test_type: "R34"
    assertion_count: 23
    description: "Real-API consumer checks: vector add/scale/dot/cross/length/normalized/lerp, matrix inverse (m*inv=identity)/transpose/singular rejection/mat-vec multiply, FromTranslationVector on vec3+vec4, Perspective near-plane w, quaternion +90deg-Z rotation/identity/ToAngleAxis/ToMatrix, GLSL typedefs with kOnes2f/kZeros3f and Rect"

test_package_test_count: 1
consumer_assertion_count: 23
assertion_count: 23
