# test_package/MANIFEST.yml
# Upstream and consumer test declaration for midish/1.4.0 (CI L0e requires this file).

package: midish/1.4.0
homepage: https://midish.org

# 上游测试入口：Makefile 的 check 目标 → cd regress && ./run-test *.cmd
# （143 个 .cmd 用例，各自与同名 .res 期望结果逐字节比对；conanfile.py 的
#  build() 在 OHOS 上真实执行 make check）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check   # 等价于 cd regress && ./run-test *.cmd（143 例）"

upstream_tests:
  - file: regress/run-test
    source: midish-1.4.0/regress/
    description: "上游回归套件：143 个命令脚本（*.cmd）各自加载对应 *.res 期望结果、执行后逐字节 diff（run-test 输出 TAP 风格的 1..143 / ok / not ok）"
    command: "make check（在源码根目录；run-test 需要同目录下已构建的 ../midish）"
    condition: "run in the Conan build on OHOS；本机实测 143/143 通过，其中批处理驱动依赖补丁 0001（管道 EOF 仅报 POLLHUP 时必须退出）"

test_package_tests:
  - file: test_package/conanfile.py
    description: "消费者测试（真实产物）：运行安装后的 bin/midish -b，校验版本输出、载入包内示例曲 share/examples/midish/sample.msh、另存 .msh、导出标准 MIDI 文件（断言 MThd 头）并重新载入"
    command: "conan create（test() 内直接执行 bin/midish）"
  - file: test_package/ohos_test.cpp
    description: "HarmonyOS 专项测试：fork+exec 安装后的 midish，向其 stdin 管道写入脚本后关闭写端，断言进程以退出码 0 结束（本平台 EOF 只报 POLLHUP 的适配点）；另断言 bin/midish 为可重定位 ELF64（DT_NEEDED 无含 '/' 路径）、bin/smfplay|smfrec 为 /bin/sh 脚本、示例/文档/man page 安装就位"
    command: "./test_midish_ohos（并注册为 ctest 用例）"

# 断言总数：上游 143 例 + 消费者工作流（版本/导出/重载 3 组）+ 鸿蒙专项 8 组断言
assertion_count: 154
