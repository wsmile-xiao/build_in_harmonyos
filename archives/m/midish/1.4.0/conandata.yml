# conandata.yml - midish 1.4.0 (HarmonyOS PC)
# 上游为 midish 作者的官方 GitHub 仓库（tag v1.4.0）。官方站点 midish.org 的发布
# tarball 在 CI worker 上极慢且会被中途断流（conan 报
# `IncompleteRead ... / ConanConnectionError: Download failed`），故改用同一上游的
# GitHub tag 归档。两者文件内容除 version.h（发布流程生成、git 树不含）外完全一致，
# 缺失的 version.h 由 patches/0002 还原（见该补丁说明）。
sources:
  url: "https://github.com/ratchov/midish/archive/refs/tags/v1.4.0.tar.gz"
  sha256: "44d40459083111c40cf87741e8486d3bc7ebea9b770ca0732c8e775c1b4b1f77"

patches:
  "1.4.0":
    - patch_file: "patches/0001-mdep-stdin-eof-pollhup.patch"
      patch_description: "0001 treat POLLHUP as readable on the non-tty stdin poll path: a pipe reaching end-of-file may report only POLLHUP (no POLLIN), and without this the command interpreter never sees end-of-file and polls in a loop instead of exiting (upstream regression suite and every batch script hang)"
      patch_type: "portability"
    - patch_file: "patches/0002-version-h.patch"
      patch_description: "0002 restore the release version.h: the git tag archive does not ship it (the release tarball generates it at packaging time), so configure would otherwise write its placeholder string 'midish (unknown release)' and the reported version ('midish -b' + version) would be wrong"
      patch_type: "portability"
