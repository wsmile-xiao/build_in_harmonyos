  - patches/0002-version-h.patch
test_results:
  type: conan_create_ohos
  upstream: "143/143 通过（0 失败、0 跳过）：Makefile 的 check 目标在 OHOS 构建内真实执行 regress/run-test *.cmd，143 个命令脚本与同名 .res 期望结果逐字节比对全部一致；见 reports/conan-create.log"
  test_package: "消费者工作流 3/3：安装后的 bin/midish 报告 midish 1.4.0、载入包内示例曲 sample.msh、另存 .msh 并导出标准 MIDI 文件（MThd 头校验）、再载入保存的歌曲；HarmonyOS 专项测试 8 组断言全过（管道 EOF 退出、可重定位 ELF64、shell 前端、示例/文档/man page 就位）"
source_url: https://github.com/ratchov/midish/archive/refs/tags/v1.4.0.tar.gz
source_sha256: 44d40459083111c40cf87741e8486d3bc7ebea9b770ca0732c8e775c1b4b1f77
knowledge_gained:
  - "本平台（OHOS/musl）管道到达 end-of-file 时 poll() 只报告 POLLHUP、不报告 POLLIN（实测 revents=0x10；有数据时为 0x11）。任何只判断 POLLIN 的 stdin 事件循环都会永远看不到 EOF——midish 的非 tty 分支即如此，导致解释器空转不退、上游 143 例回归套件全部挂住。修法是让非 tty 分支接受 (POLLIN|POLLHUP) 后调用 read()，read() 返回 0 即为 EOF。"
  - "midish 自带 configure + Makefile.in（非 autotools）且就地构建：configure 只有 --prefix/--bindir/--datadir/--mandir/--enable-alsa/--enable-sndio 与 CC=/CFLAGS=/LDFLAGS= 直通参数；--prefix=/ 配合 make install DESTDIR=<包目录> 即可得到 conan 期望的 bin/share 布局。"
  - "本机 /tmp 只读、$TMPDIR 亦受限：midish 的 save/export 需要在可写目录执行（测试与回归套件都在构建树内写文件）。"
