  notes: "midish 1.4.0 零外部库依赖（仅 libc/POSIX）：configure 依据 uname 选择 MIDI 后端，本平台 uname=HarmonyOS，因此既不走 ALSA 也不走 sndio，编译进可移植的 raw 后端（USE_RAW）。"
