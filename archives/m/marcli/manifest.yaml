# 软件级 manifest
# 文件位置: archives/m/marcli/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: marcli
display: "marcli"
description: "Command line tool to parse and filter MARC (Machine Readable Cataloging) files"
category: utility
homepage: "https://github.com/hectorcorrea/marcli"
license: MIT
build_system: go

ohos_adaptation:
  key_points:
    - "纯 Go CLI：零 conan 第三方依赖（唯一外部模块 github.com/google/go-cmp v0.5.9 仅测试期，经 GOPROXY 消费，非 conan 包）"
    - "Go 工具链由配方自举下载并自签名（go1.25.0），签名后必须 chmod 755（否则 fork/exec 报 permission denied）"
    - "链接产物必须落在 ext2 类工作区（HMDFS 下 Go linker mmap 输出报 mapping output file failed）"
    - "成品与测试二进制均需 binary-sign-tool 自签名（.codesign）并恢复执行位"
    - "上游测试以 go test -c → 自签名 → 包目录直接运行 的方式等价复刻（自签名进程不能 execve 另一 ELF）"
  common_dependencies: []

versions:
  - version: "1.3.1"
    status: built
    build_date: "2026-09-30"
    notes: >-
      首次适配。Go（CGO_ENABLED=0 静态）产出 bin/marcli（-X main.Version=v1.3.1）。
      上游用例 55/55 通过（25 顶层 Test* + 30 子测试，0 失败 0 跳过）。test_package 5/5，
      含 1 条鸿蒙特有断言（打包 ELF 携带 .codesign 段）。无源码补丁。
