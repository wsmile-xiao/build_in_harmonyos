# manifest.yaml — marcli 1.3.1 (HarmonyOS PC / OpenHarmony aarch64)
version: "1.3.1"
software: "marcli"
status: "built"
build_date: "2026-09-30"
arch:
  - "armv8"
build_system:
  - "conan2"
  - "go1.25.0"
toolchain:
  go: "1.25.0"
  go_mod: "-mod=mod (GOPROXY)"
  cgo: false
source:
  upstream: "https://github.com/hectorcorrea/marcli"
  tag: "v1.3.1"
  url: "https://github.com/hectorcorrea/marcli/archive/refs/tags/v1.3.1.tar.gz"
  sha256: "944c7c389d384a9515799bb688cb9ced80344709758a42c714f726957785a1c4"
  license: "MIT"
build:
  entry: "go build -trimpath -ldflags \"-X main.Version=v1.3.1\" -o marcli ./cmd/marcli"
  output_binary: "marcli"
  ldflags: "-X main.Version=v1.3.1"
patches_applied: []
knowledge_gained:
  - "marcli 1.3.1 是纯 Go CLI（module github.com/hectorcorrea/marcli，入口 cmd/marcli），零 cgo / 零 C/C++，conan 侧无第三方依赖。"
  - "唯一第三方依赖 github.com/google/go-cmp v0.5.9 为测试期 Go module（仅 *_test.go 引用），经 GOPROXY 消费，非 conan 包。"
  - "OHOS 上 Go 工具链自签名后权限位丢失：不 chmod 755 时 go build 报 fork/exec .../pkg/tool/linux_arm64/compile: permission denied。"
  - "Go linker 输出必须落在 ext2 类工作区：HMDFS 下报 mapping output file failed: permission denied。"
  - "OHOS 自签名进程不能 execve 另一 ELF，故 go test 不可用；需逐包 go test -c → 自签名 → 包目录直接运行（相对 testdata 才能解析）。"
  - "部分 worker 上 Go 的纯 Go resolver 直连 114.114.114.114 / 8.8.8.8 超时（系统解析器却可用），可用 file:// 本地 GOPROXY（GOPROXY 环境变量可覆盖）兜底。"
validation:
  local:
    conan_create: "passed (exit 0; profile ci/conan/profiles/ohos-aarch64; in-build upstream tests 55/55)"
    conan_verify: "passed (G1/G0/G2/G3/G4 + L2/L4/L5; reports/conan-verify-report.md)"
    finish_w2_w3: "passed (W2 structure + R36 deps + W3 local CI OK; .ci-result.json exit_code=0). step5b G0 clean-verify N/A (pure Go, no ./configure)"
    upstream_tests: "executed: 55/55 passed (25 top-level Test* + 30 subtests), 0 failed, 0 skipped; per-case list: reports/upstream-test-cases.txt"
    test_package: "5/5 passed (incl. 1 OHOS-specific: packaged ELF carries .codesign)"
    w4_audit: "not run (本阶段范围不含 W4；已完成源码核验/适配/构建/上游测试/conan-verify/finish/W2/W3)"
  ohos:
    binary_runs: "passed (marcli reports 'marcli v1.3.1'; count-only/mrk/json smoke on data/test_10.mrc)"
    signed: "passed (.codesign injected via binary-sign-tool for the binary and the test binary)"
