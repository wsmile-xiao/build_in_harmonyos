# test_package MANIFEST — marcli 1.3.1
# HarmonyOS consumer feasibility test (separate from the upstream `go test ./...` suite).
upstream_tests_exist: true
upstream_test_in_build: true
test_package:
  command: "test.sh <marcli-binary> <testdata-dir>"
  assertions: 5
  cases:
    - name: "marcli (no args) prints the syntax banner containing 'marcli v1.3.1'"
      type: smoke
      expect: "exit 0 and stdout contains 'marcli v1.3.1' and 'Parameters:'"
    - name: "marcli -file test_1a.mrc -format count-only returns 1"
      type: functional
      expect: "stdout == '1'"
    - name: "marcli -file test_1a.mrc -format mrk renders MARC records"
      type: functional
      expect: "stdout contains '=LDR'"
    - name: "marcli -file test_1a.mrc -format json emits a valid JSON array"
      type: functional
      expect: "stdout starts with '['"
    - name: "OHOS-specific: packaged ELF carries a .codesign section"
      type: ohos-specific
      expect: "binary contains .codesign (OHOS requires a code signature for fork/exec)"
