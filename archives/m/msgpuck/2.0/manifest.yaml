# 版本级 manifest —— msgpuck 2.0
# 遵循 ARCHIVE-SPEC v2.0

version: "2.0"
software: msgpuck

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-18"
build_system: cmake

source:
  url: "https://github.com/tarantool/msgpuck/archive/refs/tags/2.0.tar.gz"
  sha256: "01e6aa55d4d52a5b19f7ce9a9845506d9ab3f5abcf844a75e880b8378150a63d"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS 按 Conan shared 选项映射（上游只声明静态库；默认静态）"
    - "上游 CMake 最低版本声明 2.8.5，CMake 4.x 已移除 <3.5 兼容而直接报错 → 补丁 0001 提升到 3.15"
    - "构建后直接运行上游测试二进制 test/msgpuck.test（上游用自定义目标而非 ctest），失败即配方失败"
    - "构建环境显式清空 LD_LIBRARY_PATH（部分 CI worker 的 ambient 指向不兼容 libxml2 会破坏 SDK lld——同 libodfgen/libabw 根因）"
  dependencies: []
  cc: clang

patches_applied:
  - "0002-test-tmpfile-use-tmpdir.patch：上游测试 test_mp_print 的 tmpfile() 改为在 TMPDIR 下建临时文件——本平台 /tmp 只读会使 tmpfile() 返回 NULL，两项断言被静默跳过（计划 10 项只跑 8 项）"
  - "0001-cmake4-compat.patch：① 顶层 cmake_minimum_required 2.8.5 → 3.15 ② test/CMakeLists.txt 移除 CMP0037 OLD 策略与其自定义目标（CMake 4.4.3 两项均拒绝）；测试源与二进制目标名未改"

knowledge_gained:
  - "CMake 4.x 移除了对 cmake_minimum_required(<3.5) 的兼容：老项目（2017 年前后）在 CMake 4 上会直接配置失败，最小修复是提升该声明而非加策略变量"
  - "tarantool 系小库（msgpuck）用自定义 CMake 目标跑测试而非 ctest：配方需直接执行测试二进制并以其退出码为判据"
