# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: msgpuck/2.0
homepage: "https://github.com/tarantool/msgpuck"

# 上游**有**测试且随本配方真实执行：test/ 下单个测试二进制
# （test/msgpuck.c + test/test.c，约 177 项断言），由 test/CMakeLists.txt 的
# 自定义目标构建；配方 build() 直接运行该二进制并以退出码为判据
# （上游未用 ctest 注册，故不走 ctest）。
upstream_check_command: "构建并运行 test/msgpuck.test（上游自定义目标）"
upstream_test_in_build: true
upstream_test_command: "test/msgpuck.test"

upstream_tests:
  - file: test/msgpuck.c
    description: "MessagePack 编解码与 mp_check 校验的完整断言集（约 177 项），真机实跑"

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_msgpuck.c
    description: >-
      消费者功能测试（6 项断言）：编码 4 元素 MessagePack 数组
      （uint/str/int/double）→ mp_check 接受 → 逐值解码比对（含"解码器恰好
      消费全部字节"）→ mp_check 拒绝截断缓冲；失败即非零退出。
