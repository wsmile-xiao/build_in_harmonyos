sources:
  url: "https://github.com/tarantool/msgpuck/archive/refs/tags/2.0.tar.gz"
  sha256: "01e6aa55d4d52a5b19f7ce9a9845506d9ab3f5abcf844a75e880b8378150a63d"
patches:
  "2.0":
    - patch_file: "patches/0002-test-tmpfile-use-tmpdir.patch"
      patch_description: "test/msgpuck.c 的 tmpfile() 改为在 TMPDIR 下建临时文件——本平台 /tmp 只读，tmpfile() 返回 NULL 会让 test_mp_print 的两项断言被静默跳过（计划 10 项只跑 8 项）"
      patch_type: "portability"
    - patch_file: "patches/0001-cmake4-compat.patch"
      patch_description: "CMake 4.x 兼容：① 顶层 cmake_minimum_required 2.8.5→3.15（4.x 已移除 <3.5 兼容）② test/CMakeLists.txt 去掉 CMP0037 OLD 策略与依赖它的自定义目标（4.x 不允许该策略设为 OLD），测试二进制本身不变"
      patch_type: "portability"
