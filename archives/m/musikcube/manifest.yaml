name: musikcube
versions:
  "3.0.5":
    packaging: conan
    status: draft
    build_system: cmake
    upstream_url: "https://github.com/clangen/musikcube"
    upstream_version: "3.0.5"
    source_sha256: "708292a583bb5072a8dbb14e408c2a1f61de9b8c9786d4e53b3e69bef5dad8c5"
    platform: HarmonyOS PC
    key_points:
      - "裁剪 ALSA、PulseAudio、PipeWire、CoreAudio、sndio、PortAudio 音频输出插件"
      - "裁剪 server/remote、mpris、macosmediakeys 远控插件（libmicrohttpd 未发布、systemd/DBus 不可用）"
      - "裁剪 FFmpeg 解码器（ffmpegdecoder）及 gmedecoder、openmptdecoder、stockencoders 插件"
      - "应用层：musikcube TUI 与 musikcubed 随源码构建，但 Conan 包仅交付 musikcore 库，不打包可执行文件"
      - "保留 taglibreader、nullout、httpdatastream、supereqdsp 插件；交付核心库、索引与元数据能力"
    known_limitations:
      - "不验证实际音频播放"
      - "不能作为 HarmonyOS PC 本地播放器使用"
      - "test_package 在 CI 执行 OHOS ELF；本地 noexec 环境不运行目标程序"
