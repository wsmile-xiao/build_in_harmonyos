# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "mafft 不使用 autotools/configure，使用 Makefile 直接构建 — 无 configure 脚本项目需创建包装器"  # ref: E082-autotools-missing-configure
  - "需要修改 core/Makefile 的 PREFIX/CC/CFLAGS 以适配 OpenHarmony — Makefile 项目编译器路径适配"  # ref: E081-clang-toolchain
  - "需要修改 core/mafft.tmpl 的 shebang 为 #!/usr/bin/env bash — OHOS 无 /bin/bash"  # ref: E011-hmdfs-permission
  - "mafft 二进制需要 ELF 签名后才能在鸿蒙系统执行 — ohc sign-elf 签名"  # ref: E080-elf-signing
  - "wrapper 脚本有 rm 命令路径和 /dev/stderr 权限问题 — PATH 环境变量和 sandbox 限制"  # ref: E011-hmdfs-permission
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

