# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mmap_allocator/3.1
homepage: "https://github.com/ekg/mmap_allocator"

# 上游测试命令 (mmap_allocator 为 CMake 项目)
upstream_check_command: "ctest -N / ./build-native/test_mmap_allocator"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_allocator.cpp
    source: test_allocator.cpp
    description: "上游回归测试：mmap 文件内容经 mmappable_vector/allocator 读写、文件池复用、页对齐宏、异常路径"
    command: "./build-native/test_mmap_allocator"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：文件 mmap 读回内容、文件池同映射复用、DEFAULT_STL_ALLOCATOR 普通路径"
    command: "./test_mmap_allocator"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3074