# test_package/MANIFEST.yml — mpage 2.5.8
# CI L0e requires this file to exist.
# See docs/TEST_QUALITY_SPEC.md.

package: mpage/2.5.8
homepage: "https://www.mesa.nl/pub/mpage/"

# ── 上游测试审计（hmbs 机器证据硬门禁）──────────────────────────────────
# 已审计 mpage 2.5.8 官方归档（sha256
# 2351e91d25794b358df6618f17a7013a28d350ec20408fe06f8123dc4673fe93）：
# Makefile / smakefile / smakefile.ppc 三个构建文件均无 check/test 目标；
# Test/ 目录仅含 4 个示例输入文件（All.chars / nonl / tabtest / testpage），
# 无测试驱动脚本、无期望输出、无 Makefile 目标引用它们；无 tests/ 目录、
# 无 autotools make check、无 gtest、无 CI 流水线 → 上游确实无任何测试。
upstream_tests_exist: false
upstream_test_audit: "审计 mpage 2.5.8 官方归档（https://www.mesa.nl/pub/mpage/mpage-2.5.8.tgz，sha256 2351e91d25794b358df6618f17a7013a28d350ec20408fe06f8123dc4673fe93）：Makefile/smakefile/smakefile.ppc 三个构建文件均无 check/test 目标（grep -nE '^[a-zA-Z_.-]+:' 仅见 default/clean/mpage.ps/install）；Test/ 目录仅含 All.chars/nonl/tabtest/testpage 四个示例输入文件，无测试驱动脚本、无期望输出、无 Makefile 目标引用它们；无 tests/ 目录、无 gtest/ctest、无 CI 流水线。结论：上游无任何测试用例（discovered=0/executed=0），test_package 以可执行文件冒烟测试接入。"

# 上游测试命令（无）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "运行 mpage 可执行文件：①mpage -V 输出版本字符串含 'mpage version 2.5.8'；②向 mpage 喂入 sample.txt 生成 %!PS-Adobe-2.0 PostScript 流；③%%Creator 行含 'mpage 2.5.8 May 2023'；④%%DocumentMedia 行含默认 A4 页面尺寸"
    command: "bash test.sh"
  - file: sample.txt
    description: "喂给 mpage 的最小文本输入夹具"
    command: "mpage sample.txt"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 4

test_modifications:
  - "No upstream tests are modified or removed (upstream ships no test suite)."
