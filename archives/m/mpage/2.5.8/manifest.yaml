# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "mpage 2.5.8 是纯 Makefile 项目（无 configure），Makefile 硬编码 CC=gcc / CFLAGS=-O2 -s / PREFIX=/usr/local，OHOS 适配仅需 make 命令行覆盖 CC=clang + PREFIX=<package_folder>，零源码改动"
  - "上游无任何测试：Makefile/smakefile/smakefile.ppc 三个构建文件均无 check/test 目标；Test/ 目录仅含示例输入文件（testpage/tabtest/nonl/All.chars），无测试驱动脚本；无 CI/自动化测试"
  - "license 为 GPL-2.0-or-later：Makefile 头/Copyright/gpl.in/全部 .c/.h 源文件均声明 'version 2 of the License, or (at your option) any later version'；CHANGES 记录 2017 年 'Relicensed code under GPLv2 or later'（OpenMandriva spec 误标 BSD，以源码实际声明为准）"
  - "K&R 风格非原型函数定义在 clang 15 下仅产生 -Wdeprecated-non-prototype 警告（46 条），无错误，不影响功能"
  - "mpage 默认将 PostScript 输出到 stdout（stdin 输入或文件参数均可），无需 spooler 即可生成 PS；-V 输出 'mpage version 2.5.8 May 2023'"
