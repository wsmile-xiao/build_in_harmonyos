# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: mlib/0.8.2
homepage: "https://github.com/P-p-H-d/mlib"

# 上游测试（tests/ 目录，m-tests 自写框架；make check 含 C 全量 + 异常 + 预期失败三类）
upstream_test_command: "cd tests && make check CC=\"clang -std=c99\" CXX=\"clang++ -std=c++11\" XCFLAGS=\"-Wno-everything\""

upstream_tests:
  - file: tests/test-*.c（28 个程序）
    source: mlib-0.8.2/tests/test-*.c
    description: "C 全量测试：197 个 test 函数分布于 28 个程序（容器/算法/序列化/并发），断言失败即程序中止"
    command: "cd tests && make check CC=\"clang -std=c99\" XCFLAGS=\"-Wno-everything\""
  - file: tests/except-*.c
    source: mlib-0.8.2/tests/except-*.c
    description: "异常机制测试（9 个程序，M_TRY/M_THROW 语义）"
    command: "同上（make check 包含）"
  - file: tests/fail-*.c
    source: mlib-0.8.2/tests/fail-*.c
    description: "预期编译失败测试（3 个程序 92 子检查，静态断言拦截误用，编译失败即为通过）"
    command: "同上（make check 包含）"
  - file: tests/check-*.cpp
    source: mlib-0.8.2/tests/check-*.cpp
    description: "C++ STL 对照测试（10 个程序，独立目标 check-stl，需 C++ 编译器与 sanitize）"

test_package_tests:
  - file: test_mlib.c
    description: "消费者测试: m-array 排序、m-list LIFO、m-dict 字符串键值、m-string 格式化（4 组容器 API 断言）"
    command: "./test_mlib"

assertion_count: 9
