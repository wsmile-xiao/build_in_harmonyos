package: mash/2.3
homepage: https://github.com/marbl/Mash

upstream_tests_exist: true
upstream_test_audit: "Makefile.in testSketch/testDist/testScreen run four diff comparisons against bundled test/ref files"
upstream_test_count: 4
upstream_test_passed: 4
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "timeout 300 make test"
upstream_tests:
  - name: "test/ref/genomes.json"
    description: "Genome sketch info JSON equals upstream baseline"
  - name: "test/ref/reads.json"
    description: "Reads sketch info JSON equals upstream baseline"
  - name: "test/ref/genomes.dist"
    description: "Genome-to-reads distances equal upstream baseline"
  - name: "test/ref/screen"
    description: "Screen output equals upstream baseline"

test_package_tests:
  - file: test_mash.sh
    description: "Installed CLI version, sketch creation, sketch info, and self-distance"
    command: "bash test_mash.sh <packaged-mash>"
test_files:
  - path: "test_package/test_mash.sh"
    test_type: "consumer"
    assertion_count: 5
test_package_test_count: 5
consumer_assertion_count: 5
assertion_count: 9
