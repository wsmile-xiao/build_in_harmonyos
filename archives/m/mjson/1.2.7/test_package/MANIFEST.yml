# Upstream and consumer test declaration for CI quality gates.

package: mjson/1.2.7
homepage: "https://github.com/cesanta/mjson"

upstream_check_command: "make -C test test"
upstream_test_in_build: true
upstream_test_command: "make -C test clean test CC=<conan-c-compiler> CXX=<conan-cpp-compiler>"

upstream_tests:
  - file: test/unit_test.c
    source: mjson-1.2.7/test/unit_test.c
    description: "Official unit suite covering parser, JSONPath, printing, base64, merge, pretty printing, iteration, glob matching, and JSON-RPC"
    command: "make -C test test (runs the same 392 assertions in both C and C++ modes)"

test_package_tests:
  - file: test_mjson.c
    description: "Consumer integration test for parsing, JSONPath extraction, boolean handling, and JSON emission through the packaged library"
    command: "./test_mjson"

assertion_count: 392
