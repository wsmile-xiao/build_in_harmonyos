software: miniupnpd
display: "miniupnpd"
description: "Lightweight UPnP IGD & PCP/NAT-PMP daemon"
category: network
homepage: "https://miniupnp.tuxfamily.org/"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 configure 只认 BSD/Linux/Darwin 等 uname -s 结果，OHOS 上必须走 --host-os=Linux --host-os-version=<数字> --host-machine=aarch64 交叉分支"
    - "Linux 后端二选一：iptables 需 xtables.h+libiptc（制品仓无该依赖），nftables 需 libnftnl+libmnl（ohpcd 有预编译）；本包选 nftables"
    - "OHOS SDK <linux/socket.h> 与 <sys/socket.h> 重复定义 sockaddr_storage，需 CPPFLAGS 加 -D_UAPI_LINUX_SOCKET_H -D__kernel_sa_family_t=sa_family_t"
    - "OHOS 无 iproute2 的 ip（toybox 未编 ip applet），上游 testgetifaddr.sh 需要它；busybox 提供 ip applet"
  common_dependencies:
    - libnftnl
    - libmnl

versions:
  "2.3.10":
    status: built
    build_date: "2026-10-01"
    conan_ref: "miniupnpd/2.3.10"
