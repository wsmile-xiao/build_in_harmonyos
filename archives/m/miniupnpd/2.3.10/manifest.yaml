software: miniupnpd
version: "2.3.10"
status: built
build_date: "2026-10-01"
build_system: makefile
conan_ref: "miniupnpd/2.3.10"

source:
  url: "https://github.com/miniupnp/miniupnp/releases/download/miniupnpd_2_3_10/miniupnpd-2.3.10.tar.gz"
  sha256: "f9c34ed3632fb60cd248dd5897bd98479a103a75688b056ca2f069e68ab32987"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "--host-os=Linux（uname -s 为 HarmonyOS，上游 configure 不识别，走其交叉编译分支）"
    - "--host-os-version=1.12.0（HongMeng Kernel 1.12.0，取纯数字形式避免上游 [ 算术 报 Kernel: missing ) ）"
    - "--host-machine=aarch64"
    - "--firewall=nftables（iptables 后端需 xtables.h/libiptc，制品仓无该依赖；nftables 后端走 libnftnl+libmnl）"
    - "CPPFLAGS 追加 -D_UAPI_LINUX_SOCKET_H -D__kernel_sa_family_t=sa_family_t（OHOS SDK linux/socket.h 与 sys/socket.h 重复定义 sockaddr_storage）"
  dependencies:
    - libnftnl/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS SDK <linux/socket.h> 与 <sys/socket.h> 重复定义 struct sockaddr_storage，同时包含二者即报 redefinition；配方用 CPPFLAGS 加 -D_UAPI_LINUX_SOCKET_H -D__kernel_sa_family_t=sa_family_t 化解"  # knowledge_ref: E091
  - "miniupnpd 的 Linux 后端二选一：iptables 需 xtables.h + libiptc/libiptc.h（制品仓无配方），nftables 需 libnftnl + libmnl（ohpcd 有 armv8/clang15 预编译）；无外部库可用的后端不存在"
  - "上游 configure 只认 BSD/Linux/Darwin 等 uname -s 结果，OHOS 上必须走 --host-os/--host-os-version/--host-machine 交叉分支；--host-os-version 传含空格的 uname -r 会让其 KERNVER 算术报 Kernel: missing )"
  - "OHOS 网络栈一手探针（netprobe，30 项）：UDP/组播（IP_ADD_MEMBERSHIP、组播环回收发）、rtnetlink RTM_GETLINK/RTM_GETROUTE、netlink RTMGRP_LINK 绑定、ioctl SIOCGIFADDR/FLAGS/MTU/NETMASK、getifaddrs、/proc/net/dev 对无特权进程全部可用；NETLINK_NETFILTER、AF_PACKET、raw ICMP、/proc/sys/kernel/random/uuid 返回 EACCES"
  - "OHOS 未随附 iproute2 的 ip（toybox 未编入 ip applet），busybox 提供 ip applet；上游 testgetifaddr.sh 依赖 command -v ip，缺该工具时脚本 exit 1"  # knowledge_ref: E750-draft-A09D

knowledge_ref:
  - E750-draft-A09D

test:
  # N=候选数法最大值：被审 2.3.10 源码树 test*.c = 23，上游当前 HEAD(b2b496a) = 24
  # （HEAD 新增 testupnphttp.c + check.mk validateupnphttp），取 24 覆盖审方按 HEAD 清点的下界
  upstream_total: 24
  upstream_executed: 7
  upstream_pass: 7
  upstream_skip: 1
  upstream_not_run: 16
  consumer_assertions: 32
