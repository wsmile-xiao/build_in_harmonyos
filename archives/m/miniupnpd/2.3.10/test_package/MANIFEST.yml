# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: miniupnpd/2.3.10
homepage: "https://miniupnp.tuxfamily.org/"

# 上游测试命令 — miniupnpd 用 check.mk 注册 make check
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（conanfile.py build() 依次执行）
upstream_tests:
  - file: testupnppermissions.sh
    source: miniupnpd-2.3.10/testupnppermissions.sh
    description: "upnp 权限规则解析（allow/deny/CIDR/端口段 3 组规则 + 非法规则检测）"
    command: "make validateupnppermissions"
  - file: testgetifaddr.sh
    source: miniupnpd-2.3.10/testgetifaddr.sh
    description: "getifaddr() 取默认网卡 IPv4 并与 ip route/ip addr 的读数比对（状态须 Connected）"
    command: "make validategetifaddr"
  - file: testssdppktgen.c
    source: miniupnpd-2.3.10/testssdppktgen.c
    description: "SSDP 应答报文生成（NOTIFY/M-SEARCH 响应、OS_VERSION 动态填充）"
    command: "make validatessdppktgen"
  - file: check.mk
    source: miniupnpd-2.3.10/check.mk
    description: "validateversion：./miniupnpd --version 首行必须等于 'miniupnpd ' + VERSION 文件"
    command: "make validateversion"
  - file: testupnpdescgen.c
    source: miniupnpd-2.3.10/testupnpdescgen.c
    description: "UPnP 根设备/WANIPConnection/WANConfig/服务 SCPD XML 描述生成"
    command: "./testupnpdescgen"
  - file: testgetifstats.c
    source: miniupnpd-2.3.10/testgetifstats.c
    description: "getifstats() 从 /proc/net/dev 读取指定网卡收发计数与比特率"
    command: "./testgetifstats lo"
  - file: testgetroute.c
    source: miniupnpd-2.3.10/testgetroute.c
    description: "get_src_for_route_to() 通过 rtnetlink RTM_GETROUTE 求源地址与出接口"
    command: "./testgetroute 127.0.0.1"
  - file: testasyncsendto.c
    source: miniupnpd-2.3.10/testasyncsendto.c
    description: "异步 sendto 事件循环（可写事件收集与补发）"
    command: "./testasyncsendto"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者断言：执行包内 miniupnpd --version 并校验版本行 2.3.10、核对打包的 miniupnpd.conf 与 LICENSE"
    command: "conan test_package test()"
  - file: ohos_netprobe.c
    description: "鸿蒙特有测试：OHOS 网络栈能力探针（组播 239.255.255.250 加入+环回收发、rtnetlink RTM_GETLINK/RTM_GETROUTE、netlink RTMGRP_LINK 订阅、SIOCGIFADDR/FLAGS/MTU/NETMASK、getifaddrs、/proc/net/dev|route），22 项必检 + 8 项按能力登记"
    command: "./ohos_netprobe"

# 测试断言总数: 10 条消费者断言（版本 rc/版本行前缀/nftables 后端/配置文件/许可证/
# 探针 rc/必检项计数/全通过/逐项对账行数/能力登记计数）
# + ohos_netprobe 22 项必检 = 32
assertion_count: 32
