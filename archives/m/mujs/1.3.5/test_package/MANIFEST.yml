# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mujs/1.3.5
homepage: "https://mujs.com/"

# 上游测试命令 (mujs 使用 Makefile 构建，无 make check 目标；
# 官方测试入口为 tools/test262 脚本 + tools/test262-harness.js 运行
# ECMAScript ES5 一致性套件 test262 (es5-tests 分支))
upstream_check_command: "make release HAVE_READLINE=no"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "tools/test262 <test262-root>/test/suite"

# 上游实际运行的测试程序 — test262 ES5 一致性套件（11724 个独立用例）
# 本机全量实测：9636 通过 / 11724 全量（82.19%），未含 21 个上游已知挂起用例
upstream_tests:
  - file: tools/test262
    source: mujs-1.3.5/tools/test262
    description: "test262 ES5 套件运行器（跳过 21 个上游已知挂起用例）"
    command: "tools/test262 <test262-root>/test/suite"
  - file: tools/test262-harness.js
    source: mujs-1.3.5/tools/test262-harness.js
    description: "test262 一致性套件 JS harness"
    command: "mujs tools/test262-harness.js <test262-root> <case>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 mujs.h 公开 API 编译并运行 JS 表达式，验证返回值"
    command: "./test_mujs"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11724
