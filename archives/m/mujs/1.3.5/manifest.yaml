# 版本级 manifest — mujs 1.3.5
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.5"

# 软件名
software: mujs

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://mujs.com/downloads/mujs-1.3.5.tar.gz"

  # 源码校验和
  sha256: "78a311ae4224400774cb09ef5baa2633c26971513f8b931d3224a0eb85b13e0b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "HAVE_READLINE=no"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "mujs 使用纯 Makefile 构建（无 configure），必须用 make release HAVE_READLINE=no"
  - "mujs 官方测试入口为 tools/test262 runner + test262-harness.js，运行 ES5 一致性套件（11724 用例，82.19% 全量通过率）"
  - "mujs CLI 无 --version/--help 选项（L2 非阻塞警告），验证用真实 JS 脚本"
