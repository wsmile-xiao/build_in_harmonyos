# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: mpssh/1.3.3
homepage: "https://github.com/ndenev/mpssh"

# 上游测试存在性审计（hmbs 硬门禁要求）
# 审计结论：mpssh 1.3.3 上游正式测试为 0
upstream_tests_exist: false
upstream_test_audit: |
  审计结论：mpssh 1.3.3 上游正式测试为 0，证据完整。
  1. 官方 release tarball（github.com/ndenev/mpssh tag v1.3.3）源码树仅
     mpssh.c mpssh.h pslot.c pslot.h Makefile README mpssh.1 COPYING，无
     tests/、test/、regress/ 目录；`tar tzf | grep -i test` 无匹配。
  2. Makefile 目标仅有 all、$(PROG)、%.o、clean、install — 无 check/test
     目标。执行 `make check` 将报 "No rule to make target 'check'"。
  3. debian/ 打包无 test runner，无 autopkgtest 测试声明。
  4. 上游仓库（github.com/ndenev/mpssh）无 CI 测试 workflow。
  5. 上游不在 ci/config/no_official_test.txt 白名单中（该白名单仅用于
     已知 OHOS 不兼容场景）；零测试事实以本包内声明记录。

# 上游测试命令（mpssh 无 ctest/make check 测试套件）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# mpssh 上游无任何自动化测试：纯 Makefile 只有 all/clean/install 三个目标
# （无 test/check 目标），源码树无 tests/ 目录，debian/ 打包也无 test runner。
# 证据：
#   $ tar tzf mpssh-1.3.3.tar.gz | grep -i test   → 无匹配
#   $ grep -E '^(test|check):' Makefile           → 无匹配
#   Makefile 目标: all, $(PROG), %.o, clean, install
upstream_tests: []

# test_package 自带的测试（消费者视角验证：执行 mpssh 二进制）
test_package_tests:
  - file: test.sh
    description: "功能测试：-V 版本、无参 usage、-f hosts、退出码（usage=0/hosts失败=1/正常=0）、getpwuid 回退不崩、-p8 vs -p1 并行性实测（本地慢监听器）、SIGCHLD 竞态回归压测（20 次循环断言无崩溃）"
    command: "bash test.sh"
  - file: test_ohos_mpssh.py
    description: "鸿蒙特有：ELF64 AArch64、musl 依赖、.codesign 存在、无 RPATH、无宿主路径、烘焙 ssh/scp 路径存在"
    command: "python3 test_ohos_mpssh.py"

# 测试断言总数（近似值）
assertion_count: 18
