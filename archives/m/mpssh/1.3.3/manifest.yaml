# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 无 /etc/passwd 条目时 getpwuid() 返回 NULL，mpssh 无守卫解引用 pw->pw_name 导致 100% SIGSEGV（E338 知识族）"
  - "Makefile 硬编码 CC=gcc/LD=gcc 且 SSHPATH=`which ssh` 在编译期烘焙进二进制，OHOS 交叉构建需显式传 CC/LD/SSHPATH/SCPPATH"
  - "install 目标使用 GNU coreutils install + strip + /usr/local/bin，鸿蒙不可用，改用 Conan copy() 手动安装"
  - "构建产物为单一二进制 mpssh + man page，需 ELF 签名后才能在鸿蒙执行"
  - "上游 SIGCHLD reap 竞态：pslot_bypid 返回 NULL 无守卫解引用 + 全局游标 use-after-free，musl 信号语义下 ~8% 概率崩溃（平台无关缺陷，已随 0002 修复）"
