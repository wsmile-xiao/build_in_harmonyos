# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: matroxset/0.4
homepage: "https://www.bglug.ca/matrox_tvout"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 注: 上游 Makefile 本身就是坏的（all 目标依赖 matroxset，但只有 matroxset.o
# 的编译规则、没有链接规则），连 build 都跑不通，更无 test/check 目标。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 上游无任何官方测试套件。
# 证据: 源码树共 9 个文件 —— matroxset.c / fb.h / matroxfb.h / videodev2.h /
# COPYING / Makefile / normal / swapit / swapped；无 test/ 或 tests/ 目录，
# Makefile 无 test/check/target，matroxset.c 除 main() 外无自测桩。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: test_matroxset.c 真实执行被测包二进制 matroxset 共 11 次，每次同时断言
# 真实退出码与真实 stdout/stderr 文本；另加 3 项 OHOS 特有 ELF/loader 断言。
# 无需 Matrox 硬件：参数解析分支全在任何 ioctl 之前定型，需触达 ioctl 的路径
# 用 /dev/null 作 framebuffer（open 成功、ioctl 必失败、程序仍返回 0）。
test_package_tests:
  - file: test_matroxset.c
    description: "CLI 行为 11 项（usage×4 / -Z→99 / -p+-m→95 / -m+-o→96 / 打不开 fbdev→122 / ioctl 阶段×3）+ OHOS ELF 断言 3 项（AArch64、PIE、无动态 ncurses 依赖）"
    command: "MATROXSET_BIN=<package>/bin/matroxset ./test_matroxset"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14