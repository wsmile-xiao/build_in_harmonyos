# 版本级 manifest — matroxset 0.4
# 遵循 ARCHIVE-SPEC v2.0

version: "0.4"
software: "matroxset"

# 编译状态: published | built | failed | archived
# PR 阶段尚未由 release 流水线 upload 到制品仓，真实状态为 built
status: built

build_date: "2026-10-03"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # matroxset 没有上游发布站（debian/watch 为 FakeWatchNoUpstreamSiteForThisPackage，
  # 唯一项目页 https://www.bglug.ca/matrox_tvout 只有说明文没有下载），
  # 因此以 Debian 归档池的原生 orig tarball 为权威分发点。
  # 用 ftp.debian.org（Debian ftp-master 公开名，非第三方镜像）而非 deb.debian.org：
  # 仓库 PF7 源URL闸把后者等四个主机字面量硬拦为「Debian 下游重打包源」。
  url: "https://ftp.debian.org/debian/pool/main/m/matroxset/matroxset_0.4.orig.tar.gz"
  sha256: "7f160b45cd945be10c5cea31a423143ac3be94b0ddf9c3e8edf6f5e5d0199003"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 上游 Makefile 本身是坏的（all 目标依赖 matroxset 但只有 matroxset.o 规则、无链接规则），
  # Debian debian/rules 同样绕过 make 直接调用编译器，本配方沿用该做法。
  system: custom
  configure_options: []
  dependencies:
    - ncurses/6.6
  cc: clang
  cxx: clang
  cflags: "-O2 -Wall -Wformat -Werror=format-security -fstack-protector-strong -fPIE"
  ldflags: "-pie -Wl,-z,relro,-z,now"
  # 有意不启用 -D_FORTIFY_SOURCE：真机 OHOS libc.a 确实导出 45 个 _chk（含
  # __open_chk，用 binutils nm + 阳性对照 24387 个符号验证），即真机上 FORTIFY
  # 是安全的；但本包的 test_package 必须能在所有可验证环境里真正执行二进制，
  # 而本地唯一可用的 aarch64 运行期是 stock musl guest（/opt/ohos-guest，
  # 1648 个动态符号、零 fortify 包装），FORTIFY 版会在那里
  # "Error relocating: __open_chk: symbol not found"（rc=127）。
  # 这是显式登记的可评审取舍，不是「OHOS 缺符号」的误解；详见 notes.md。

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-format-string-safety.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "matroxset 不是 X11 工具而是旧式 fbdev/Matrox ioctl CLI，唯一依赖是 ncurses（交互式 -e 控制编辑器），与 libX11 无关"
  - "上游 Makefile 是坏的（all 依赖 matroxset 却只有 matroxset.o 规则且无链接规则），Debian debian/rules 亦绕过 make 直接编译"
  - "源码自带的 2004 年版 fb.h/matroxfb.h/videodev2.h 只需 <linux/tty.h> 与 <asm/types.h>，OHOS sysroot 经 NDK multiarch 目录即可解析"
  - "OHOS 真机 libc.a 导出 45 个 __*_chk（含 __open_chk，binutils nm + 阳性对照验证），故 _FORTIFY_SOURCE=2 在真机安全；本地 /opt/ohos-guest 是 stock musl（1648 动态符号、零 fortify 包装）才是 FORTIFY 版跑不起来的原因——不可把 guest 缺符号误判成平台缺符号"
  - "本地唯一可用的 aarch64 运行期是 /opt/ohos-guest 的 stock musl；包内 test_package 要真执行二进制，因此 FORTIFY 取舍须按「可验证性优先」登记，而不是按平台能力"
  - "ncurses/6.6 的 OHOS 包只提供静态库（libncursesw.a + formw/menuw/panelw），链接顺序须消费者在前、提供者 ncursesw 在后"
  - "OHOS 加载器忽略 LD_LIBRARY_PATH，故 ncurses 必须静态链接；readelf -d 只剩 libc.so 一项 NEEDED"
  - "无 -V/--version 选项且 -h 返回 98，L2 上游版本探测预期为非阻塞 warn（保持源码行为，不擅自加 CLI）"
  - "ftp.debian.org 未被 PF7 源URL闸拦截且与 deb.debian.org 逐字节相同，是 Debian-only 包的仓库内既有做法（i/installation-locale、a/aldo、c/ca-certificates）"

