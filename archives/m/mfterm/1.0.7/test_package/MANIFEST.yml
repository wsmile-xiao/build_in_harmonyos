# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 三步法：清点 → 实测 → 回填，详见 notes.md）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mfterm/1.0.7
homepage: "https://github.com/4zm/mfterm"

# 上游测试命令：mfterm 1.0.7 源码无 test/ 目录、无 Makefile.am TESTS 目标、
# 无 CUTTER/Check/CMocka 等测试框架引用 —— 上游未提供正式自动测试。
# 源码内 README.md 与 debian/ 亦无测试入口。
upstream_check_command: ""
upstream_check_result: "上游未提供正式自动测试（无 TESTS 目标 / 测试框架 / test 目录）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（清点结果为空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: harmonyos_specific_test.c
    description: "鸿蒙平台特有测试：编译期硬绑定 __OHOS__/__aarch64__ + 运行时校验安装产物 ELF64/EM_AARCH64、PT_INTERP=/lib/ld-musl-aarch64.so.1、.note.ohos.ident 段、NEEDED 含 libusb-1.0.so.0 与 libc.so，并链接 libnfc 调用 nfc_version() 验证依赖 ABI 可用"
    command: "clang harmonyos_specific_test.c $CPPFLAGS $LIBS -o t && ./t <pkg>/bin/mfterm"
  - file: run_mfterm_test.sh
    description: "消费者冒烟测试：真实执行安装产物 mfterm（--version/--help 参数解析 + mac key/mac compute 0 离线 Crypto-1 MAC 计算 + quit 优雅退出）"
    command: "sh run_mfterm_test.sh <pkg>/bin/mfterm"

# 测试断言总数（harmonyos_specific_test.c 输出 "9 checks"：
# ELF magic/ELF64/EM_AARCH64 + PT_INTERP/.note.ohos.ident + NEEDED libusb/libc
# + nfc_version 非 NULL/1.8.x 版本串 = 9；冒烟脚本 5 个测试点：
# --version/--help/mac key+compute(2 断言)/quit）
assertion_count: 14
