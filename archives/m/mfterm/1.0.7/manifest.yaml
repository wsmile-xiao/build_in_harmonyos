# mfterm 1.0.7 版本级 manifest（ARCHIVE-SPEC v2.0）

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.7"

# 软件名
software: "mfterm"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub Release asset，make dist 产物含预生成 configure；
  # 上游 tag 实为 v1.0.7，archive/refs/tags/1.0.7.tar.gz 返回 404）
  url: "https://github.com/4ZM/mfterm/releases/download/v1.0.7/mfterm-1.0.7.tar.gz"

  # 源码校验和（与 conandata.yml 一致；2026-09-28 实际下载实测，与 Homebrew 公布值一致）
  sha256: "b6bb74a7ec1f12314dee42973eb5f458055b66b1b41316ae0c5380292b86b248"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游 autotools；Release asset 虽含预生成 configure，
  # 配方仍按上游 autogen.sh 以 AUTOMAKE="automake --foreign" autoreconf -fi 自举）
  system: autotools

  # 配置选项（见 conanfile.py _run_configure：--prefix=/ + OHOS 三元组
  # --build/--host=aarch64-unknown-linux-ohos；CFLAGS 精准追加
  # -Wno-error=unused-command-line-argument 抑制 OHOS clang 包装器
  # -c 阶段注入 -Wl,--code-sign 触发的单一告警，上游 -Werror 语义不动）
  configure_options:
    - "--prefix=/"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libnfc/1.8.0
    - readline/8.3
    - openssl/3.5.6
    - ncurses/6.6
    - libusb-compat/0.1.7
    - libusb/1.0.27

  # 构建工具依赖（配方 build_requires）
  build_dependencies:
    - bison/3.8.2
    - flex/2.6.4.2
    - m4/1.4.19

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - patches/0001-clang-c99-werror-fixes.patch

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（均为已有知识条目的直接应用，无新沉淀）
knowledge_gained:
  - "OHOS clang 包装器 -c 阶段注入 -Wl,--code-sign 触发 -Werror=unused-command-line-argument，精准放行单一告警即可，无需移除上游 -Werror"  # knowledge_ref: knowledge/graph/E074.kv 关联实践
  - "HMDFS 并行 make 触发 jobserver fifo EPERM → make -j1"  # knowledge_ref: knowledge/graph/E074.kv
  - "configure 中 umask 077 + mktemp 在 HMDFS 产生 drwx--S--- 不可写 setgid 目录 → 剥离 umask 077"  # knowledge_ref: knowledge/graph/E114.kv
  - "conan bison 包 --prefix= 构建导致内置 pkgdatadir 失效 → BISON_PKGDATADIR 重定向；OHOS 上 bison spawn m4 空argv[0] → M4 绝对路径"  # 已有 ball/1.5.0 配方同款实践，无新知识条目
  - "profile [buildenv] 的 CONFIG_SHELL / tools.build:compiler_executables 在部分 worker 不存在 → 配方经 toolchain.environment() 用 shutil.which 校验值覆盖（m4/1.4.19 范式）"  # 已有 m4 配方先例，无新知识条目

# 知识库引用（本包未创建新草稿；上述条目均为知识库既有内容的复用）
knowledge_ref: []

# ============================================================
# 验证结果（纯文档，不消费；数值均来自本机实况）
# ============================================================

