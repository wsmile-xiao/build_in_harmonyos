    framework: "无（上游未提供正式自动测试）"
    total: 0
    built: 0
    executed: 0
    passed: 0
    failed: 0
    errors: 0
    omitted: 0
    result: "上游未提供正式自动测试"
    reason: "mfterm 1.0.7 源码树无 test/ 目录、Makefile.am 无 TESTS 目标、无 CUTTER/Check/CMocka 等测试框架引用，README.md 与 debian/ 亦无测试入口——上游未提供正式自动测试，不伪造测试数量；以 test_package 消费者冒烟 + 鸿蒙特有测试补齐验证"
  local:
