# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 实际运行的上游测试已由执行端在 OHOS PC 真机上核验（见下）。

package: mini-yaml/22d3dcf568
homepage: "https://github.com/jimmiebergmann/mini-yaml"

# 上游测试命令：裸 makefile 构建 test/test.cpp（gtest 子模块），
# 执行端用制品仓 gtest/1.17.0.2 编译后运行
upstream_check_command: "cd test && make test (googletest submodule required)"

# conanfile.py build() 中未集成上游测试（测试依赖子模块，仅在本地验证）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（13 个 gtest 用例，5 个 suite，全部通过）
upstream_tests:
  - file: test/test.cpp
    source: mini-yaml-22d3dcf568/test/test.cpp
    description: "上游 13 个 gtest 用例（Exception/Node/Parse/Iterator/Serialize），实测 13/13 PASSED"
    command: "./test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用 Yaml::Parse/Node::As/Serialize 并验证 OHOS 行为"
    command: "./test_mini-yaml"

# 测试断言总数（13 上游 + 9 HarmonyOS 专项）
assertion_count: 22
