# 版本级 manifest — memtailor 1.4
# 遵循 ARCHIVE-SPEC v2.0

version: "1.4"
software: memtailor

status: built
build_date: "2026-09-20"
build_system: cmake

source:
  url: "https://github.com/Macaulay2/memtailor/archive/refs/tags/v1.4.tar.gz"
  sha256: "d16726040d73751d220f2a2d6404a74b2a3f7d2d7a62d11d69f845bafce55136"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
  - "BUILD_TESTING=ON（上游 src/CMakeLists.txt 用 if(BUILD_TESTING) 门控测试目标）"
  - "静态库（package_type=static-library）"
  dependencies:
  - "gtest/1.17.0.1 (test_requires，仅测试)"
  cc: clang

patches_applied:
- "0001-CMakeLists.txt-toplevel-ctest-and-install-static.patch: (a) include(CTest)/enable_testing() 从 src/ 子目录提到顶层，否则 build 根目录 ctest 得到 'No tests were found!!!' 且退出码 0；(b) install(TARGETS) 补 ARCHIVE DESTINATION lib 与 PUBLIC_HEADER DESTINATION include"
- "0002-src-CMakeLists.txt-conan-gtest-targets.patch: (a) if(GTEST_FOUND) 的全大写变量在 CONFIG 模式下恒未定义（CMakeDeps 只设 GTest_FOUND）→ 条件恒假 → configure 期 FetchContent git clone googletest 失败；改为 if(GTest_FOUND OR GTEST_FOUND OR TARGET GTest::gtest) 并以 target 存在性兜底。(b) 旧式 target 名 GTest::GTest/GTest::Main 换成 Conan gtest/1.17.0.1 声明的 GTest::gtest（不链 gtest_main：testMain.cpp 自带 main）"

knowledge_gained:
- "上游 include(CTest) 写在 src/CMakeLists.txt（子目录）里 → enable_testing() 只对 build/src/ 生效，在 build 根目录跑 ctest 得到 'No tests were found!!!' 且**退出码 0**（零执行却全绿）；判定 ctest 结果必须解析汇总行而不能只看退出码"
- "find_package(GTest) 走 CONFIG 模式时 CMake 只保证设置 <PackageName>_FOUND（GTest_FOUND）；上游判空用的全大写 GTEST_FOUND 只有 MODULE 模式（FindGTest.cmake）才会设置 → if(GTEST_FOUND) 恒假 → 落到 else() 在 configure 期 FetchContent git clone googletest（CI worker 不可联网）。依赖装好了不等于上游会用它，必须改写判断条件（或判 target 存在性）"
- "上游 install(TARGETS memtailor LIBRARY DESTINATION lib) 只声明 LIBRARY：静态库属 ARCHIVE 类别不会被安装；PUBLIC_HEADER 属性没有对应 DESTINATION 时伞头文件 memtailor.h 同样不安装"
- "只声明 test_requires(gtest) 并不足以绕开 FetchContent：上游的判空变量名与 CMakeDeps 实际设置的 *_FOUND 不同名（GTEST_FOUND vs GTest_FOUND）时，回退分支照样会被走到"
- "memtailor 的对齐契约是 MemoryAlignment = sizeof(void*)（aarch64 上为 8），Arena/BufferPool 的每个返回值都必须整除它；BufferPool(n) 的实际缓冲尺寸为 align(max(n, sizeof(FreeNode)))"
