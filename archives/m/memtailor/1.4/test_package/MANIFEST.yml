# test_package/MANIFEST.yml — memtailor 1.4
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: memtailor/1.4
homepage: "https://github.com/Macaulay2/memtailor"

# 上游测试命令。上游 .github/workflows/build.yml 的 cmake 分支就是
# `cmake -B. -S.. -GNinja && ninja && src/memtailor-unit-tests`（直接跑二进制），
# 测试由 src/CMakeLists.txt 的 gtest_discover_tests() 注册进 CTest。
# 本包在 build() 内以 ctest 全量实跑，并解析汇总行（不只看退出码）。
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 中是否已集成上游测试（层1）
upstream_test_in_build: true
upstream_test_command: "build() 内 ctest --output-on-failure 全量实跑上游 gtest 套件（22 个 CTest 用例 = 22 个 TEST 宏）"

upstream_tests:
  - file: "src/test/ArenaTest.cpp + src/test/BufferPoolTest.cpp + src/test/MemoryBlocksTest.cpp"
    source: "memtailor-1.4/src/test/*.cpp"
    description: "全部测试 TU，由 src/CMakeLists.txt 的 add_executable(memtailor-unit-tests ...) 编译，经 gtest_discover_tests(memtailor-unit-tests TEST_PREFIX unit-tests:) 展开为 22 个独立 CTest 用例。三个文件通读后没有任何 #if/#ifdef/#ifndef/#endif（master 的 ArenaTest.cpp 有 5 处 #ifdef MEMT_DEBUG，但都在 TEST 函数体内部包断言，不影响注册），也没有被注释掉的 TEST(。"
    command: "ctest --output-on-failure"

# upstream_tests 的逐 TU 拆分（22 个 TEST 宏）：
#   src/test/ArenaTest.cpp        12  （master 默认分支上是 16）
#   src/test/BufferPoolTest.cpp    6
#   src/test/MemoryBlocksTest.cpp  4
# aarch64/OHOS 上 22 个全部注册、全部执行，无门控、无豁免。

test_package_tests:
  - file: test_memtailor.cpp
    description: "消费者测试 6 组：安装布局（伞头文件 memtailor.h + 三棵公开头 + extern \"C\" 探测符号 + MEMTAILOR_VERSION_STRING）；Arena 的 LIFO 复用/alloc(0) 唯一地址/64KB 几何增长/backing-memory 释放；ArenaVector<T,FreeMemory=true|false> 两种所有权语义与元素构造析构配平；BufferPool 的 free list 复用与 getMemoryUse 核算；鸿蒙特有 A —— MemoryAlignment == sizeof(void*) == 8 且 Arena/BufferPool 每次返回值都 8 字节对齐、BufferPool(1).getBufferSize()==sizeof(void*)；鸿蒙特有 B —— 4 个 bionic std::thread 各持一份 Arena+BufferPool 做 4000 次确定性 LCG 分配/释放（含活缓冲内容复核），校验和与单线程参考逐位一致。"
    command: "./test_memtailor"

# 上游可执行部分的注册用例数（本包 build() 内实跑）
upstream_test_count: 22

# 消费者测试断言组数
assertion_count: 6
