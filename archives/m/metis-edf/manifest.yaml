software: metis-edf
display: "metis-edf"
description: "METIS 4.0.1 的 EDF/Code_Aster 变体：串行图划分、网格划分与稀疏矩阵填充约减排序（含 onmetis/pmetis/kmetis 三个程序）"
category: library
homepage: "http://glaros.dtc.umn.edu/gkhome/metis/metis/overview"
license: METIS
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile→CONFIG/configure 只认 SunOS/OSF1/IRIX64/Linux/Cygwin 且硬编码 gcc/g77/gfortran → 绕过 configure，clang 直编 Lib/*.c + Programs/*.c"
    - "onmetis 依赖 3 支 Fortran 例程（lect00.f/lect11.f/ecri11.f），OHOS 无 Fortran 编译器 → 按 ISO C 等价移植为 port_fortran_io.c（原 .f 保留）"
    - "-fcommon（1998 年代 C 的 tentative definition）+ 隐式函数声明降级（proto.h 里 GKfree 声明被注释掉）"
    - "GitHub 上只找到 Code_Aster 导出的 0.x 仓，无 4.1-2 tag → 用 Ubuntu multiverse orig tarball（HTTPS，sha256 与 dsc 一致）"
    - "随包 Test/*.ref 依赖生成时的 libc rand()/drand48()，任何现代 libc 构建都不同 → 实跑两个 target 并做结构校验，不宣称字节一致"
    - "上游测试 = Test/Makefile 的 fort.85 与 vers_check 两个 target，build() 内实跑 2/2"
  common_dependencies: []

versions:
  - version: "4.1-2"
    status: built
    build_date: "2026-09-29"
