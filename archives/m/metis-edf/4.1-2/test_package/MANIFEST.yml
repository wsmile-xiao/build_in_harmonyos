# test_package/MANIFEST.yml
# metis-edf 4.1-2 - upstream test declaration.

package: metis-edf/4.1-2
homepage: "http://glaros.dtc.umn.edu/gkhome/metis/metis/overview"

upstream_tests_exist: true
upstream_test_audit: >-
  `Test/Makefile` defines exactly two checks: the default target `fort.85`
  runs `../onmetis fort.81` on the Code_Aster input shipped with the source,
  and `vers_check` runs `../onmetis --version`.  Both are reproduced for real
  in `build()` (the onmetis driver is built with the C port of the three
  Fortran I/O helpers, see `port_fortran_io.c`).  `onmetis --version` prints
  `metis-edf-4.1` (upstream exits 1 on this path; the exit status is ignored
  exactly as the upstream Makefile does with `; exit 0`).  `onmetis fort.81`
  exits 0 and the produced `fort.85` / `fort.81.iperm` are validated
  structurally (iperm is a permutation, the fort.85 invp column equals
  iperm+1, the supernode/parent vector lengths are consistent).  The byte
  content of the shipped `Test/*.ref` files is NOT reproduced byte-for-byte:
  METIS 4.x nested dissection consumes the C library `rand()`/`drand48()`
  stream, so the ordering depends on the libc of the machine that generated
  the reference; upstream compares against `.ref` manually and its Makefile
  does not assert equality.
upstream_check_command: "make -C Test"
upstream_test_in_build: true
upstream_test_command: "./onmetis --version ; ./onmetis fort.81"
upstream_tests:
  - "Test/Makefile fort.85: onmetis fort.81 (Code_Aster input, ordered)"
  - "Test/Makefile vers_check: onmetis --version"

test_package_tests:
  - file: test_metis_edf.c
    description: "consumer linked against the installed libmetis.a + headers; METIS_PartGraphRecursive, METIS_PartGraphKway and METIS_NodeND on a 4x4 grid"
    command: "<cc> -I <pkg>/include test_metis_edf.c -L <pkg>/lib -lmetis -lm"
  - file: "<bin>/onmetis --version, pmetis/kmetis <graph> 2"
    description: "installed command line programs"

test_files:
  - path: "test_package/test_metis_edf.c"
    test_type: "R34"
    assertion_count: 10

test_package_test_count: 1
consumer_assertion_count: 13
upstream_test_cases: 2
upstream_executed: 2
upstream_passed: 2
upstream_skipped: 0
assertion_count: 13
