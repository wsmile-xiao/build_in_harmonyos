software: mandown
version: 1.0.5.2
status: built
category: tools
description: A man-page inspired Markdown pager written in C

compile_info:
  build_system: Makefile
  compiler: clang
  date: 2026-05-25
  platform: HarmonyOS/OpenHarmony aarch64

dependencies:
  - libxml2 (2.15.3)
  - libconfig (1.7.3)
  - ncursesw (6.4, static)

configure_options:
  - PREFIX=/storage/Users/currentUser/usr/local
  - CC=clang
  - LD=clang

binary:
  name: mdn
  path: bin/mdn
  size: 461312 bytes

libraries:
  - libmandown.a (static library)

headers:
  - mandown.h

patches:
  - 0001-Makefile.patch (HarmonyOS platform adaptation)
  - 0002-st_curses.h.patch (fix WIDE_NCURSES macro)

notes: |
  - ncursesw headers manually created from ncurses-6.4 source
  - install command not available, manual copy used
  - shared library build disabled (install target modified)