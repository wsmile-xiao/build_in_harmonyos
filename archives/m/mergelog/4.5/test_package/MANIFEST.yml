package: mergelog/4.5
homepage: "https://mergelog.sourceforge.net/"

# Upstream ships no formal test suite. The release tarball (mergelog-4.5.1)
# contains only AUTHORS, COPYING, ChangeLog, INSTALL, README, configure(.in),
# Makefile.{am,in}, src/mergelog.c, and man pages — no tests/ or test/ dir,
# no TESTS variable, and the Makefile `check` target is the empty autotools
# default `check-am: all-am`. No CI scripts exist upstream (2001-era project).
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check  # empty autotools default — no assertions run"

upstream_tests:
  - name: make-check
    command: "make check"
    description: >-
      Autotools default `check` target. The shipped Makefile.in defines
      `check: check-recursive` and `check-am: all-am`, i.e. it only ensures
      the binaries built; it runs no assertions. There is no tests/ or test/
      directory, no TESTS automake variable, and no bundled fixtures.
    expected: "no-op (0 assertions)"

test_package_tests:
  - file: conanfile.py
    description: >-
      Consumer test that runs the packaged mergelog and zmergelog binaries
      on Common Log Format fixtures and asserts date-sorted merge order,
      plus the no-args CLI usage contract, plus the gzip path via zmergelog
      on .gz fixtures (zlib end-to-end).
    command: "conan test"
    assertions:
      - "mergelog with no args prints usage and exits non-zero"
      - "mergelog a.log b.log emits 4 lines in ascending timestamp order"
      - "zmergelog on plain inputs matches mergelog output exactly"
      - "zmergelog on gzip inputs matches mergelog output exactly"

assertion_count: 4
test_modifications:
  - "No upstream tests are modified or removed (upstream has none to modify)."
  - "All test_package fixtures (a.log, b.log) and assertions are newly added; they exercise real CLI behavior, not a build-only check."
