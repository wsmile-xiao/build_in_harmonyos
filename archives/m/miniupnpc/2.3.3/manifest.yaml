software: miniupnpc
version: 2.3.3
status: success
build_system: Makefile
created_at: 2026-05-06

# 构建信息
configure_options:
  - INSTALLPREFIX=$DEFAULT_PREFIX
  - DESTDIR=$TEST_PREFIX
  
build_command: make -j$(nproc) INSTALLPREFIX=$DEFAULT_PREFIX
install_command: make install DESTDIR=$TEST_PREFIX INSTALLPREFIX=$DEFAULT_PREFIX

# 测试信息
test_command: make check
test_result: all_passed (6/6)
test_status: success

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - miniupnpc 使用 Makefile 构建，无 configure 脚本
  - 使用 INSTALLPREFIX 参数替代 --prefix
  - 源码自动识别 HarmonyOS/HongMeng Kernel 1.12.0
  - 无需补丁，直接编译成功
  - 支持 DESTDIR 模式进行 staging 安装
  - 动态库运行需设置 LD_LIBRARY_PATH

# 产物信息
artifacts:
  binaries:
    - upnpc (39KB)
    - upnp-listdevices (23KB)
    - external-ip (脚本)
  libraries:
    - libminiupnpc.a (82KB)
    - libminiupnpc.so.21 (64KB)
  headers: 10 个头文件
  pkgconfig: miniupnpc.pc

# 包大小
package_size:
  main: 492KB
  debug: 126KB

# 源码信息
source_url: https://miniupnp.tuxfamily.org/files/download.php?file=miniupnpc-2.3.3.tar.gz
build_log: logs/build.log

# 依赖关系
dependencies:
  build: []
  runtime: []

# 平台信息
platform:
  os: HarmonyOS
  kernel: HongMeng Kernel 1.12.0
  arch: aarch64
  compiler: clang 15.0.4