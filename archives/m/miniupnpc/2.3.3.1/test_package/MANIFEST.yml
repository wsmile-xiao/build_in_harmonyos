# test_package/MANIFEST.yml
# Upstream test declaration required by CI gate L0e.

package: miniupnpc/2.3.3.1
homepage: "https://miniupnp.tuxfamily.org/"

# CMakeLists.txt registers these tests with CTest when UPNPC_BUILD_TESTS=ON.
upstream_check_command: "ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error"

upstream_tests:
  - file: src/minixmlvalid.c
    source: miniupnpc-2.3.3/src/minixmlvalid.c
    description: "XML parser event-stream validation"
    command: "ctest -R '^validateminixml$' --output-on-failure"
  - file: src/testminiwget.c
    source: miniupnpc-2.3.3/src/testminiwget.c
    description: "HTTP wget test against the bundled loopback test server"
    command: "ctest -R '^validateminiwget$' --output-on-failure"
  - file: src/testupnpreplyparse.c
    source: miniupnpc-2.3.3/src/testupnpreplyparse.c
    description: "UPnP SOAP response parsing test"
    command: "ctest -R '^validateupnpreplyparse$' --output-on-failure"
  - file: src/testportlistingparse.c
    source: miniupnpc-2.3.3/src/testportlistingparse.c
    description: "Port mapping listing parser test"
    command: "ctest -R '^validateportlistingparse$' --output-on-failure"
  - file: src/testigddescparse.c
    source: miniupnpc-2.3.3/src/testigddescparse.c
    description: "IGD root-description parser test using new_LiveBox_desc.xml"
    command: "ctest -R '^validateigddescparse1$' --output-on-failure"
  - file: src/testigddescparse.c
    source: miniupnpc-2.3.3/src/testigddescparse.c
    description: "IGD root-description parser test using linksys_WAG200G_desc.xml"
    command: "ctest -R '^validateigddescparse2$' --output-on-failure"
  - file: src/testaddr_is_reserved.c
    source: miniupnpc-2.3.3/src/testaddr_is_reserved.c
    description: "Reserved IPv4 address classification test"
    command: "ctest -R '^validateaddr_is_reserved$' --output-on-failure"

test_package_tests:
  - file: test_miniupnpc.c
    description: "Consumer test links the package and parses a UPnP SOAP response"
    command: "./test_miniupnpc"

# Approximate comparison count:
#   minixml 17 + miniwget 3 + reply parser 13 + port parser 25
#   + two IGD fixtures 20 + reserved-address cases 14 + consumer 3 = 95
assertion_count: 95
