software: miniupnpc
version: "2.3.11"
status: built
build_date: "2026-09-11"
build_system: direct-cc
conan_ref: "miniupnpc/2.3.11"

source:
  url: "https://codeload.github.com/miniupnp/miniupnp/tar.gz/refs/tags/miniupnpd_2_3_11"
  sha256: "25521370ec33b8c075ca7b073cda2a98a2d449e6c09b10acbe5a9d038bca1017"
  tar_format: tar.gz

build:
  system: direct-cc
  configure_options:
    - "no CMake configure: 14 pure-C TUs compiled straight with profile clang"
    - "UPNPC static default (shared optional via options.shared)"
    - "upstream 7 harnesses built from CMakeLists.txt source lists and run for real"
    - "-fPIC on"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "miniupnpc 同时支持 Makefile 与 CMake，Conan 配方使用 CMake"
  - "UPNPC_BUILD_TESTS=ON 启用 7 项 CTest（validateminixml/validateminiwget/validateupnpreplyparse/validateportlistingparse/validateigddescparse1/2/validateaddr_is_reserved）"
  - "codeload 归档无扩展名，source() 须传 filename 供 Conan 解包（沿用 zfp 经验）"
  - "monorepo 归档 strip_root 后顶层为仓库根，layout 取 . 并用 build_script_folder=miniupnpc 指向 CMake 工程（get 解压到 source_folder，src_folder=miniupnpc 会双重嵌套）"
  - "消费者测试调用 upnpDiscover() 与 MINIUPNPC_VERSION，验证 socket 与解析链路"
