# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: maxminddb/1.13.3
homepage: "https://github.com/maxmind/libmaxminddb"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游测试实测在探索/适配阶段单独运行（29/29 通过，台账见 notes.md 与 reports/test-report.md）；
# conanfile.py build() 仅执行 configure + make，未把 make check 编入配方构建（避免测试期
# 依赖 IPC::Run3/Test::Output 等 Perl 模块影响 CI 构建环境）。

# 上游实际运行的测试程序（29 个注册项：26 C 程序 + 3 Perl 脚本，全量通过 29/29）
upstream_tests:
  - file: t/basic_lookup_t.c
    source: maxminddb-1.13.3/t/basic_lookup_t.c
    description: "基本 IP 查找与值解码（1437 断言）"
    command: "./basic_lookup_t"
  - file: t/data_types_t.c
    source: maxminddb-1.13.3/t/data_types_t.c
    description: "全部 MaxMind DB 数据类型解码（180 断言）"
    command: "./data_types_t"
  - file: t/dump_t.c
    source: maxminddb-1.13.3/t/dump_t.c
    description: "MMDB_dump_entry_data_list 输出（E302 修复后 49 断言通过）"
    command: "./dump_t"
  - file: t/mmdblookup_t.pl
    source: maxminddb-1.13.3/t/mmdblookup_t.pl
    description: "mmdblookup CLI 帮助/错误输出（33 断言，装 IPC::Run3 后实跑）"
    command: "perl mmdblookup_t.pl"

# test_package 中自带的测试 (消费者视角验证，真实调用 MMDB API)
test_package_tests:
  - file: test.c
    description: "消费者测试：MMDB_open(mmap) + MMDB_lookup_string + MMDB_get_value(array/utf8_string) + metadata + 版本断言，真实调用库 API 并对解码值断言"
    command: "./test_maxminddb"

# 测试断言总数 (上游全量 2343 + 消费者 7 项核心断言)
assertion_count: 2350
