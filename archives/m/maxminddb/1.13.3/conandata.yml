# conandata.yml — maxminddb 1.13.3
# 官方源：https://github.com/maxmind/libmaxminddb
# SHA256 已通过实际下载核验（与 FreeBSD ports/Fossies 官方记录一致，SIZE=795830）

sources:
  url: "https://github.com/maxmind/libmaxminddb/releases/download/1.13.3/libmaxminddb-1.13.3.tar.gz"
  sha256: "a66502ea76eadbe17f2cd6fd708946777253972d2ae8157dee1b23a2fb528171"

patches:
  "1.13.3":
    - patch_file: "patches/0001-config.guess.patch"
      patch_description: "config.guess 增加 HarmonyOS 识别（E007），输出 aarch64-unknown-linux-ohos"
      patch_type: "portability"
    - patch_file: "patches/0002-config.sub.patch"
      patch_description: "config.sub 增加 ohos-linux 三元组支持（E007）"
      patch_type: "portability"
    - patch_file: "patches/0003-configure.patch"
      patch_description: "config.status mktemp 0700 临时目录在 HMDFS 不可写（E052），改用 $TMPDIR/conf$$ + mkdir -p"
      patch_type: "portability"
    - patch_file: "patches/0004-t-Makefile.in.patch"
      patch_description: "out-of-tree 构建时 t 目录 all-local/clean-local 的 cd libtap 在构建目录失效，改 $(top_srcdir)/t/libtap"
      patch_type: "portability"
    - patch_file: "patches/0005-t-dump_t.c.patch"
      patch_description: "dump_t 用 open_memstream 契约损坏（E302，fclose EBADF/流不发布），改 mkstemp+fdopen 命名临时文件，断言与预期数据不变"
      patch_type: "portability"