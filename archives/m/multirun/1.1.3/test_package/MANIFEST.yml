# test_package/MANIFEST.yml
# 上游官方测试声明文件 — multirun 1.1.3
# 详见: docs/TEST_QUALITY_SPEC.md

package: multirun/1.1.3
homepage: "https://github.com/nicolas-van/multirun"

# 上游测试命令 (bats 框架: tests.bats, 需外部安装 bats)
upstream_check_command: "bats tests.bats"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游测试源: tests.bats (4 个用例), 用 bats-core 1.11.1 实测 4/4 通过
upstream_tests:
  - file: tests.bats
    source: multirun-1.1.3/tests.bats
    description: "simple command invocation — 单命令写入结果文件"
    command: "./build/multirun \"sh -c 'echo test > resultfile'\""
  - file: tests.bats
    source: multirun-1.1.3/tests.bats
    description: "multiple commands invocation — 多命令并发并发写入结果文件"
    command: "./build/multirun \"sh -c 'echo test > resultfile1; sleep 1'\" \"sh -c 'echo test > resultfile2; sleep 1'\""
  - file: tests.bats
    source: multirun-1.1.3/tests.bats
    description: "returns 0 — 所有子进程退出码 0 时 multirun 返回 0"
    command: "./build/multirun \"sh -c 'exit 0'\""
  - file: tests.bats
    source: multirun-1.1.3/tests.bats
    description: "returns -1 — 任一子进程失败时 multirun 返回 255"
    command: "./build/multirun \"sh -c 'exit 1'\""

# test_package 中自带的测试 (消费者视角验证, 镜像上游 4 用例)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 镜像上游 tests.bats 4 个用例真实执行安装后的 multirun"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10