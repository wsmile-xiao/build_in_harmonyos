# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/nicolas-van/multirun/archive/refs/tags/1.1.3.tar.gz"
  sha256: "35d6bf959cae79d5ff1bad06e34c753ffb1fb90d66ee1796bc0fd76eb2384e75"
