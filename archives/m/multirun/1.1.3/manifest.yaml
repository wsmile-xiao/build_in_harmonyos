  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - patch: "patches/0001-multirun.c.patch"
    description: "Add --version/--help long options for OHOS CLI smoke test compatibility"
    type: portability

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "multirun 为单文件 C99 程序（multirun.c），CMake 构建（cmake_minimum_required 3.10），仅 install 可执行文件到 bin/，无库产物"
  - "上游测试为 tests.bats（bats-core，4 用例），需外部安装 bats 运行；实测 4/4 通过"
  - "#if __linux__ || __unix__ + PR_SET_CHILD_SUBREAPER 守卫天然兼容 OHOS，不可用时自动降级仅警告，无需平台宏补丁"
  - "本机 aarch64（KirinX90），OHOS aarch64 交叉产物可原生执行，test_package 无需 qemu"
  - "multirun 的 getopt 仅支持短选项 -v/-h，--version/--help 会走未知选项分支 exit -2；补丁显式处理长选项以通过 L2 冒烟门禁（--version/--help），与 aa3d 先例一致"
  - "conandata.yml 注释里不要写裸 https:// 官方仓库 URL：pre-download 的 URL 提取正则会将其截断为 .../multirun 并污染 file:// 重写，导致 source() 报 NotADirectoryError"