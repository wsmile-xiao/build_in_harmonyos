# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: mmsd-tng/2.6.4
homepage: "https://gitlab.com/kop316/mmsd"

# 上游测试命令（meson 工程）
upstream_check_command: "meson test -C <builddir>"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir>   # 由 conan 的 Meson.test() 在 build() 阶段执行"

# 上游实际运行的测试（unit/meson.build:9-37 注册 4 项，workdir=项目根）
upstream_tests:
  - file: unit/test-mmsutil.c
    source: unit/test-mmsutil.c (+ src/mmsutil.c, src/wsputil.c)
    description: "'test mms' — MMS PDU 编码/解码（含 unit/*.mms 样例：rc-/ni-/sr-/di-/post-rsp）"
    command: "meson test -C <builddir> 'test mms' --print-errorlogs"
  - file: unit/test-wsputil.c
    source: unit/test-wsputil.c (+ src/wsputil.c)
    description: "'test wsp' — WSP/HTTP 头编码解码"
    command: "meson test -C <builddir> 'test wsp' --print-errorlogs"
  - file: unit/test-phone-utils.c
    source: unit/test-phone-utils.c (+ src/phone-utils.cpp)
    description: "'test phone utils' — 电话号码解析（libphonenumber）"
    command: "meson test -C <builddir> 'test phone utils' --print-errorlogs"
  - file: unit/test-service-providers.c
    source: unit/test-service-providers.c (+ src/service-providers.c, unit/test-service-providers.xml)
    description: "'test service providers' — mobile-broadband-provider-info XML 解析"
    command: "meson test -C <builddir> 'test service providers' --print-errorlogs"

# test_package 中自带的测试（消费者视角验证；4 用例，含 2 项 HarmonyOS 专属）
test_package_tests:
  - file: test_mmsd_tng.py
    description: "case1 upstream_mmsdtng_version — mmsdtng --version 实跑，断言输出 2.6.4"
    command: "python3 test_mmsd_tng.py <pkg>"
  - file: test_mmsd_tng.py
    description: "case2 upstream_mmsctl_usage — mmsctl 实跑，断言打印上游用法串 Usage: ... [-L] [-M ...]"
    command: "python3 test_mmsd_tng.py <pkg>"
  - file: test_mmsd_tng.py
    description: "case3 OHOS_elf_abi — 【HarmonyOS 专属】ELF64/EM_AARCH64/PT_INTERP=ld-musl-aarch64.so.1"
    command: "python3 test_mmsd_tng.py <pkg>"
  - file: test_mmsd_tng.py
    description: "case4 OHOS_runtime_loader — 【HarmonyOS 专属】DT_NEEDED 全量可解析"
    command: "python3 test_mmsd_tng.py <pkg>"

# 上游测试断言总数（近似值）
assertion_count: 4
