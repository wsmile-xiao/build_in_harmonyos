patches:
  "2.6.4":
    - patch_file: "patches/0002-src-service.c.patch"
      patch_type: "portability"
      patch_description: >
        clang 兼容：src/service.c 的 process_request() 中
        `case MMS_REQUEST_TYPE_POST_TMP:` 之后紧跟声明（gsize length; /
        g_autofree gchar *contents; ...）。ISO C 规定标签只能标记语句，
        声明不是语句——GCC 以 GNU 扩展容忍，OHOS 默认工具链 clang 15 直接报
        `error: expected expression`；其后 `default:` 又因 g_autofree 带
        __attribute__((cleanup)) 而报 `cannot jump from switch statement to
        this case label`（跳转绕过 cleanup 变量初始化）。给该 case 分支加一层
        块作用域 `{ ... }`，语义不变（变量只在该分支内可见），clang 通过。
    - patch_file: "patches/0001-meson.build.patch"
      patch_type: "portability"
      patch_description: >
        libphonenumber 探测方式：上游 meson.build 用
        `cc.find_library('phonenumber', required: true)`。conan 的
        libphonenumber/8.13.51 是**静态库**（libphonenumber.a + libgeocoding.a）
        且自带上游风格 libphonenumber.pc（Cflags + Libs + Requires:
        protobuf abseil-cpp icu4c）。find_library 只产出 `-lphonenumber`，
        既无 include 目录（phone-utils.cpp 报 'phonenumbers/logger.h' file not
        found），也不带静态链接所需的传递 libs。改为
        `dependency('libphonenumber', required: true)`，由 .pc 提供全部
        include 与传递依赖（-lgeocoding/-lphonenumber/-lprotobuf/-labsl_*/-licu*）。
    - patch_file: "patches/0003-unit-meson.build.patch"
      patch_type: "portability"
      patch_description: >
        同上，unit/meson.build 的 test_dependencies 中
        `cc.find_library('phonenumber', required: true)` 改为
        `dependency('libphonenumber', required: true)`，保证 4 个上游单元测试
        （test-mmsutil/test-wsputil/test-phone_utils/test-service_providers）
        在 OHOS 上能编译并链接。
