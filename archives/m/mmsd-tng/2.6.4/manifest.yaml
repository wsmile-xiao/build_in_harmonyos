build:
  system: meson
  configure_options:
    - "-Dbuild-mmsctl=true   # 对齐上游 CI 与 Debian 打包（上游 meson_options.txt 默认 false）"
    - "-Dcpp_std=c++17       # abseil（libphonenumber 依赖）硬要求 C++17；clang 15 默认 gnu++14"
  dependencies:
    - glib/2.84.0.1.1
    - libmm/1.24.2
    - libsoup3/3.6.5-r3
    - c-ares/1.34.6
    - libphonenumber/8.13.51
    - mobile-broadband-provider-info/20240407
    - dbus/1.14.10
    - json-c/0.18
    - zlib/1.3.1.1          # override：libmm→glib2/2.88.0 钉 zlib/1.3.1，统一到 PIC 变体
  tool_requires:
    - meson/1.11.0
    - ninja/1.12.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0002-src-service.c.patch"     # clang：case 标签后紧跟声明（+ cleanup 变量跨 case 跳转）
  - "0001-meson.build.patch"       # libphonenumber 静态库：find_library → dependency()
  - "0003-unit-meson.build.patch"  # 同上（unit 测试）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "clang 拒绝 ISO C 约束外的写法「case 标签后紧跟声明」（GCC 以 GNU 扩展容忍）：报 error: expected expression；若声明带 __attribute__((cleanup))（g_autofree/g_autoptr），随后到 default: 的跳转还会报 cannot jump from switch statement to this case label → 给该 case 分支加块作用域即可，语义不变"   # knowledge_ref: mmsd-tng-2.6.4-clang-case-label-followed-by-declaration
  - "OHOS libc 的 posix_spawn/execvp 不按 PATH 解析裸命令名：环境里 CC=clang / AR=llvm-ar 这类裸名会让 meson 直接报 Unknown compiler(s): [['clang']]（Running `clang --version` gave Errno 2），必须把 CC/CXX/AR/AS/STRIP/NM/RANLIB 与 meson [binaries] 全部改成绝对路径"   # knowledge_ref: mmsd-tng-2.6.4-ohos-posix-spawn-bare-command-name
  - "conan 的 libphonenumber 是静态库（libphonenumber.a + libgeocoding.a）且自带 .pc；上游 cc.find_library('phonenumber') 不带 include 目录也不带静态链接传递 libs → 改 dependency('libphonenumber') 可一次拿到 Cflags + -lgeocoding/-lphonenumber + Requires(protobuf/abseil-cpp/icu4c)"   # knowledge_ref: mmsd-tng-2.6.4-conan-dep-pkgconfig-metadata-gaps
  - "protobuf ≥33 的 conan 包把 libutf8_validity.a / libutf8_range.a 打进了包里却没有列入 cpp_info.libs：静态链接会报 undefined symbol utf8_range_IsValid / utf8_range_ValidPrefix，需要把这两个库补进 protobuf.pc 的 Libs（注意顺序在 -lprotobuf 之后）"   # knowledge_ref: mmsd-tng-2.6.4-conan-dep-pkgconfig-metadata-gaps
  - "dependency('dbus-1') 与 conan dbus 包：包内不提供任何 .pc（PkgConfigDeps 只生成 dbus.pc），上游 tools/meson.build 要 dbus-1 → 需自建 dbus-1.pc 别名（include 目录是 include/dbus-1.0）"   # knowledge_ref: mmsd-tng-2.6.4-conan-dep-pkgconfig-metadata-gaps
  - "mobile-broadband-provider-info 的 .pc 变量 database 只在依赖包自带 share/pkgconfig/*.pc 中：PkgConfigDeps 生成的 .pc 无该变量，meson 的 dependency().get_variable(pkgconfig:'database') 会报 'Could not get pkg-config variable and no default provided'"   # knowledge_ref: mmsd-tng-2.6.4-conan-dep-pkgconfig-metadata-gaps
  - "PkgConfigDeps 生成的 mm-glib.pc 会丢掉上游 mm-glib.pc 的 gio/gobject Requires：libmm 的下游若直接用 mm-glib（不额外声明 gio），unit 测试链接会报 undefined symbol g_file_new_for_path 等，需要按上游补齐 Requires"   # knowledge_ref: mmsd-tng-2.6.4-conan-dep-pkgconfig-metadata-gaps
  - "abseil 头文件要求 C++17：meson 未指定 cpp_std 时 clang 15 默认 gnu++14，编译 absl 头直接失败（C++ versions less than C++17 are not supported）；profile 的 compiler.cppstd=17 经 MesonToolchain 自动映射为 cpp_std=c++17"   # knowledge_ref: mmsd-tng-2.6.4-clang-default-cppstd-below-gcc
  - "本库只产出可执行文件与内部静态库（libmms.a/libplugins.a 不 install），package_type=application，无需配置系统同名库静态规则（R26 不适用）"   # knowledge_ref: mmsd-tng-2.6.4-meson-install-executable-eperm

