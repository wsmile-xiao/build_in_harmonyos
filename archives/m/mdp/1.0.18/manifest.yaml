knowledge_gained:
  - "mdp 1.0.18 是纯 C 的 ncursesw 终端 Markdown 演示工具：顶层递归 Makefile（无 configure），CURSES=ncursesw，LDLIBS=-lncursesw，产出单二进制 mdp，安装目标 install（bin+man）"
  - "上游无 make check/test 目标（Makefile 目标仅 all/clean/install/uninstall），上游 CI 仅 make && ./mdp -v 冒烟；但 L1 硬门是 L1a test_package 执行痕迹（mdp 有 6 项消费者测试，真实执行即过），非上游 make check，故无需登记 no_official_test 白名单，也不能把上游冒烟冒充正式测试"
  - "mdp 用宽字符 API（cstack 用 wchar.h、viewer 用 mvwaddwstr 等）且 main() 先 setlocale(LC_ALL, '')，无 locale 前提时宽字符渲染会退化；交叉编译时链接库是 ncursesw 而非 ncurses"
  - "本机（鸿蒙 PC aarch64）clang 15.0.4 目标 aarch64-unknown-linux-ohos，TERM=xterm-256color 可用；测试脚本 shebang 为 #!/usr/bin/env bash（set -euo pipefail），test_package/conanfile.py 按 CONFIG_SHELL → SHELL（basename=bash 且可执行）→ PATH which 顺序解析 bash 后显式执行脚本，三者皆不可用时抛 ConanException（fail-closed），不回退 /bin/bash 或任何硬编码绝对路径；test_ohos.sh 的 /data/usr/share/terminfo 仅为 terminfo 数据库位置探测候选（数据路径，非执行路径），Test 4 二进制扫描（.conan2/p、/conan/）为宿主路径泄漏检测模式（断言产物不携带构建机路径，非执行路径）"

path_b:
  status: requested
  type: reusable_knowledge
  candidate:
    - "knowledge/drafts/DRAFT-E568-mdp-ohos-musl-terminfo-path"
    - "knowledge/drafts/DRAFT-E569-mdp-stdin-tty-freopen-pty-dual-channel"
  novelty: |
    1) musl 版 ncurses 的 terminfo 数据库搜索路径由编译期 TERMINFO_DIRS 默认值
    决定，OHOS 系统镜像把 terminfo 装在 /usr/share/terminfo 而默认路径集合不含
    该位置：TERM 齐备（xterm-256color）时 TUI 仍报 cannot initialize terminal，
    运行时显式 export TERMINFO 即恢复；属运行时数据依赖根因，现有条目
    （E031 SELinux /proc、E121 utmpx 链接）与历史案例（mariadb/unxip 链接期
    setupterm/libtinfo 符号缺失）均未覆盖。2) 上游 FILE=- 时无条件
    freopen("/dev/tty") 作为按键源（无控制终端即 exit(1)），CI 管道用例必失败；
    测试须 pty.fork() 双通道（管道喂 stdin + pty 控制终端 + 写 'q' 退出 +
    tr -d '\r'），知识库无此测试设计条目。
  differs_from:
    - "E031 是 SELinux 限制 /proc 访问，与 terminfo 数据库搜索路径无关。"
    - "E121 是 utmpx API 链接缺失，非运行时终端数据库问题。"
    - "历史 mariadb/unxip 案例均为链接期 setupterm/libtinfo 符号缺失，本条目是运行期 TERMINFO 搜索路径与测试用例设计。"
