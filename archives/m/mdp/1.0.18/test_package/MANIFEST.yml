# test_package/MANIFEST.yml — mdp 1.0.18
# CI L0e requires this file to exist.

package: mdp/1.0.18
homepage: "https://github.com/visit1985/mdp"

# 上游测试审计（hmbs 机器证据硬门禁）
# 已审计 1.0.18 官方归档（sha256 36861161513c508c0589014510cdafd940a6e661e517022a3bea48ecf8d5fac4）：
# 顶层 Makefile 目标仅 all/clean/install/uninstall；src/Makefile 仅 all/clean；
# 上游 CI（.github/workflows/c-cpp.yml）仅 make && ./mdp -v 冒烟；无测试框架、
# 无测试目录、无测试源码 → 上游确实无任何测试。
upstream_tests_exist: false
upstream_test_audit: "审计 mdp 1.0.18 官方归档（https://github.com/visit1985/mdp/archive/refs/tags/1.0.18.tar.gz，sha256 36861161513c508c0589014510cdafd940a6e661e517022a3bea48ecf8d5fac4）：顶层 Makefile 目标仅 all/clean/install/uninstall，src/Makefile 仅 all/clean，无 check/test 目标；上游 CI 仅 make + ./mdp -v 冒烟；无测试框架、无测试目录、无测试源码。结论：上游无任何测试用例（discovered=0/executed=0），test_package 以消费者程序化 Markdown 输入测试接入。"

# 上游测试命令（无）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "以程序化 Markdown 输入驱动 mdp 真实二进制：①-v 版本输出精确匹配 mdp 1.0.18；②-d 解析统计 headers=3/slides=2（调试输出走 stderr，无需 TTY）；③-dd 头部与每 slide 行级明细格式；④pty 双通道下 FILE=- 的 stdin 管道解析 slides=2；⑤缺失输入文件时非 0 退出；⑥含中文宽字符的 Markdown 解析结构不变（headers/slides 计数一致）"
    command: "conanfile.py 解析 bash（CONFIG_SHELL→SHELL→PATH which，fail-closed）后以其执行 test.sh"
  - file: test_ohos.sh
    description: "OHOS 独立验证（host=target 时执行）：①ELF64 LSB AArch64；②musl 解释器 /lib/ld-musl-aarch64.so.1；③.note.ohos.ident 与 .codesign 段；④无 RPATH/RUNPATH（静态 ncursesw）；⑤NEEDED 仅 libc.so；⑥真实 pty 终端渲染幻灯片（TERMINFO 探测）并以 q 退出"
    command: "conanfile.py 解析 bash（同上，fail-closed）后以其执行 test_ohos.sh（host=target 时）"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 12
