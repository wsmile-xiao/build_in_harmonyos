# 软件级 manifest — mdp
# 遵循 ARCHIVE-SPEC v3.0

software: mdp
display: "mdp"
description: "命令行 Markdown 幻灯片演示工具（ncursesw TUI）"
category: utility
homepage: "https://github.com/visit1985/mdp"
license: GPL-3.0-or-later
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 C 的 ncursesw 终端应用：递归 Makefile（无 configure），CURSES=ncursesw，LDLIBS=-lncursesw，产出单二进制 mdp"
    - "上游无 make check/test 目标，上游 CI 仅 make + ./mdp -v 冒烟；测试策略走消费者程序化 Markdown 输入 + OHOS ELF/签名/终端验证"
    - "main() 先 setlocale(LC_ALL, '')，宽字符 API（wchar.h/mvwaddwstr）依赖 locale 与 terminfo 正常工作；运行需 TERM 指向已安装的 terminfo 条目"
  common_dependencies:
    - ncurses/6.6

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0.18":
    status: built
    build_date: "2026-09-10"
