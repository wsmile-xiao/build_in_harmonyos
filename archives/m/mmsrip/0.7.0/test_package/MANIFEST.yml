package: mmsrip/0.7.0
runner: test_package
commands:
  - mmsrip --version
  - "mmsrip -v"
  - mmsrip --about
  - mmsrip --help
  - "mmsrip (no arguments, negative)"
  - "mmsrip http://stream.example.org/stream.asf (negative)"
  - "mmsrip mms://stream.example.org (negative)"
  - "mmsrip -t mms://mmsrip.invalid/stream.asf (negative)"
  - "mmsrip -g debug.log (no stream URL, negative exit + positive file check)"
  - "readelf PT_INTERP / EM_AARCH64 check (OHOS)"
assertions:
  - "version banner 'mmsrip version 0.7.0' on stderr, exit 0"
  - "about banner with program/authors/GPL text, exit 0"
  - "usage block with '-oFILE, --output=FILE' options, exit 0"
  - "no arguments prints usage, exit 1"
  - "http:// URL rejected with 'bad protocol (mms:// was expected)', exit 1"
  - "mms:// URL without path rejected with 'url seems to be malformed', exit 1"
  - "unresolvable host in -t mode fails with 'unable to connect', exit 1, no output file created"
  - "-g debug log (run alone; -v exits before -g is processed) contains the version banner and 'debug log begins now'; run itself fails with usage exit 1"
  - "OHOS: dynamically linked ELF64 little-endian EM_AARCH64 with musl ld-musl-aarch64 interpreter"
fixture:
  none: no fixtures needed — the CLI behavior is exercised directly
upstream_tests:
  available: false
  notes: >-
    mmsrip 0.7.0 is an application, not a library: the Autotools tree has no
    TESTS/check_PROGRAMS and no `make check`/`make test` target exists; the
    2006 release tarball ships no test suite of any kind. Verification is
    carried out entirely by this test_package, which runs the real binary
    on-device: version/about/help banners, usage-on-no-args, two offline
    URL-validation failures, a real DNS/socket failure path in -t mode,
    the debug-log path, and OHOS ELF interpreter/architecture checks.
