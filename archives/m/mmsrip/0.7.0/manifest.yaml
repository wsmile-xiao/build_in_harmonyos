package: mmsrip
version: "0.7.0"
homepage: "https://nbenoit.tuxfamily.org/projects.php?rq=mmsrip"
license: GPL-2.0-or-later
status: built
build_system: autotools
build_date: "2026-09-15"

source:
  url: "http://distcache.FreeBSD.org/ports-distfiles/mmsrip-0.7.0.tar.gz"
  sha256: "5aed3cf17bfe50e2628561b46e12aec3644cfbbb242d738078e8b8fce6c23ed6"
  tar_format: tar.gz

dependencies: []   # pure C, libc only

patches_applied:
  - file: "patches/0001-configure-umask-022.patch"
    reason: >-
      autoconf 2.59 configure creates the confstat temp dir with umask 077;
      on the setgid HMDFS conan cache (group-write access only, uid
      mismatch) the resulting mode-2700 dir is unwritable and config.status
      fails. Same patch as madplay 0.15.2b. See notes.md.

upstream_tests:
  available: false
  notes: >-
    mmsrip 0.7.0 is an application, not a library: its Autotools tree has no
    TESTS/check_PROGRAMS and no `make check`/`make test` target exists; the
    2006 release tarball ships no test suite of any kind. Verification is
    therefore carried out entirely by the Conan test_package, which runs the
    real binary on-device (version/about/help banners, usage on no-args,
    offline URL validation failures, a real DNS/socket failure path in -t
    mode, the debug-log path, and OHOS ELF checks).

test_package:
  assertion_count: 30
  description: >-
    Runs the real mmsrip: --version/-v banner checks, --about author and
    license banner, --help usage block, no-args usage failure, http://
    protocol rejection, mms:// path-less URL rejection, -t test mode
    against an unresolvable host (real DNS failure path, no output file
    created), -g debug log content (exercised alone; -v exits before -g
    is processed), and an OHOS-specific ELF check (ELF64 LE EM_AARCH64,
    musl ld-musl-aarch64 PT_INTERP).
