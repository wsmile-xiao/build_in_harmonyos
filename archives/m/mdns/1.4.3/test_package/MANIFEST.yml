# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游清点结论（四口径，详见 reports/test-report.md）：N = 0

package: mdns/1.4.3
homepage: "https://github.com/mjansson/mdns"

# 上游没有任何测试入口：仓库无 tests/ 目录，CMakeLists.txt 里 0 处
# enable_testing()/add_test()（grep 实证），也没有 Makefile（无 make check 入口）。
# 上游 README 所称 "test executable" 指 mdns.c 演示程序（main() 做真实网络交互、
# 无断言、无测试框架注册），按四口径清点不计入上游用例数。
# 原生构建入口是 CMake（设备 CMake 4.1.2 需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5，
# 见 reports/native-build-and-example-run.md）。
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者断言测试：常量/字节序/域名编解码/五类记录解析/API 链接面/真实 socket 开合，TAP 输出 1..44"
    command: "./test_mdns"

# 测试断言总数 (上游 0 断言 + 消费者 44 断言)
assertion_count: 44
