category: library
homepage: "https://github.com/LoliGothick/mitama-cpp-result"
upstream_repo: "https://github.com/LoliGothick/mitama-cpp-result"
license: MIT
build_system: cmake
package_type: header-library

ohos_adaptation:
  key_points:
