    - "0 patch: fmt/12.2.0 provides <fmt/std.h>, so the upstream #include is valid as-is."
  common_dependencies:
    - "fmt/12.2.0"

versions:
  "11.0.0":
    status: built
    build_date: "2026-08-26"
