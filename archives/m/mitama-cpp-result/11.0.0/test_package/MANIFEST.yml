# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
# 详见: docs/TEST_QUALITY_SPEC.md

package: mitama-cpp-result/11.0.0
upstream_test_in_build: true
upstream_tests:
  - framework: "Catch2 v2.13.8 (git submodule, vendored in source tree)"
    source_dir: "test/"
    executables: 3
      # result_tests / maybe_tests / anyhow_tests
    test_cases: 108
      # OHOS 实测：result_tests=60, maybe_tests=42, anyhow_tests=6
      # (源码 TEST_CASE 宏 100，Catch2 生成器展开后 108)
    assertions: 145
      # result_tests=89, maybe_tests=43, anyhow_tests=13
    note: >-
      上游 Catch2 为 git submodule（v2.13.8），release tarball 不含其内容；
      测试时取官方 Catch2 v2.13.8 single_include 头编译并运行。
      OHOS (aarch64-unknown-linux-ohos, clang 15) 实测 108/108 全通过。
test_package_tests:
  - file: test.cpp
    description: "mitama::result consumer 验证（success/error 取值 + map/map_err/and_then/or_else）"
    command: "./test_package"
    check_count: 23
    note: "OHOS 实测 23/23 PASS"
