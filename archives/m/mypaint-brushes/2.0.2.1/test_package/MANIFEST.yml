# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mypaint-brushes/2.0.2.1
homepage: "https://github.com/mypaint/mypaint-brushes"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# mypaint-brushes 2.0.2.1 是纯笔刷数据包（brushes/*.myb + order.conf + pc 文件），
# 上游没有 check 目标——实测 `make check` 输出 "Nothing to be done for 'check'"
# 并 exit 0。上游未提供任何测试套件。
upstream_check_command: "make check (no-op: data-only package has no check target)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 本适配的实质替代验证 (R34)，两条路径：
# 1) mypaint_brush_probe (C++ 消费者探针，CMake 构建，消费
#    dep.cpp_info.resdirs，同 kicad-demos 10.0.4 探针范式)：
#   - 7 个笔刷组目录齐全（Dieterle/classic/deevad/experimental/
#     kaerhon_v1/ramon/tanda）
#   - order.conf 每个条目逐一映射到磁盘 .myb 文件（order<->disk 互证）
#   - 全部 .myb 纯 JSON 配平校验（实测本包 196/196 为纯 JSON '{' 开头）
# 2) test_mypaint_brushes.sh 对打包产物做布局 + 内容完整性校验：
#   - share/mypaint-data/2.0/brushes/ 下 7 个笔刷组目录齐全
#   - order.conf 196 个条目逐一映射到磁盘 .myb 文件（order<->disk 互证）
#   - 样本 .myb 格式头校验（MyPaint 2.x 笔刷为 gzip JSON 或纯 JSON，
#     实测本包 196/196 均为纯 JSON '{' 开头，两种合法格式均接受）
#   - share/pkgconfig/mypaint-brushes-2.0.pc 安装且 brushesdir/Version 正确
#   - 无 lib/、bin/ 产物（纯数据包纯度检查，R38）
substantive_test: "mypaint_brush_probe (C++ consumer) + test_mypaint_brushes.sh (L1 data-package verification, replaces upstream no-op check)"
