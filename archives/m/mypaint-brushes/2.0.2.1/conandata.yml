# L0f list format. HarmonyOS HMDFS portability fix (knowledge E011):
# config.status's `umask 077` temp dir (mktemp -d ./confXXXXXX) is
# unwritable on HMDFS; 022 keeps it group-writable. No platform macros
# inside (plain autotools portability change, R8-clean).
patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: "HMDFS: rewrite configure umask 077 -> 022 so config.status temp dir (mktemp -d ./confXXXXXX) is writable (knowledge E011)"
    patch_type: "portability"
