# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: microtar/0.1.0
homepage: "https://github.com/rxi/microtar"

# 上游无测试套件（microtar 为单文件库，源码仅含 microtar.c/microtar.h，
# 无 Makefile check / ctest 等测试入口），故补充适配测试。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：写入 tar 归档（2 个文件）→ 读回并校验文件名/大小/内容 → 校验 ENULLRECORD 结束标记"
    command: "./test_microtar"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
