software: mgis
version: 3.2
status: built
build_system: cmake
configure_options:
  - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DTFEL_DIR=$HOME/usr/local/share/tfel/cmake"
  - "-Denable-python-bindings=OFF"
  - "-Denable-c-bindings=OFF"
  - "-Denable-fortran-bindings=OFF"
  - "-Denable-static=ON"
  - "-Denable-mgis-function=OFF"
  - "-DUNIX=TRUE"
dependencies:
  - tfel >= 5.0
build_date: 2026-06-15
compiler: Clang 15.0.4
notes: |
  编译成功，使用了TFEL 5.2.0-dev
  禁用了mgis-function（C++20不支持）
  应用4个补丁修复编译问题
