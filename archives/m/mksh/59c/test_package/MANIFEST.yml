# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 要求存在；口径见 docs/TEST_QUALITY_SPEC.md）

package: mksh/59c
homepage: "https://www.mirbsd.org/mksh.htm"

# 上游是否带自动化测试：是
# 清点证据（mksh-R59c.tgz 源码包）：
#   - check.t 为上游唯一回归测试集（MirOS CVS src/bin/mksh/check.t 随发行物分发）
#   - 用例以 `name:` 段声明，静态计数 604 个（grep -c '^name:' check.t，R59c 原包）
#   - 运行入口 test.sh 由 Build.sh 在构建时生成（非发行物文件）：shebang 指向
#     本次构建出的 mksh，内部寻找 $PERL/perl5/perl 后执行 check.pl 解析 check.t
#   - check.pl 逐用例打印 pass/FAIL 并汇总 Total passed/Total failed；
#     类别（category:）不匹配的用例静默不跑、不计入 Total，跳过集合需按
#     构建类别集（shell:legacy-no / int:32 / shell:textmode-no / shell:binmode-yes
#     / os:linux）与 check.t 类别词表对照归因
upstream_has_tests: true
upstream_test_framework: "check.t + check.pl（perl 运行器，test.sh 为构建期生成入口）"
upstream_test_files: ["check.t", "check.pl"]
upstream_test_command: "./test.sh  # Build.sh 生成，本包在 conan create 的 build() 内执行"
upstream_check_command: "./test.sh"
upstream_test_in_build: true

test_adaptation_notes: >
  上游回归套件在配方 build() 内随构建执行（Build.sh -r -j -Q 之后紧跟
  ./test.sh -C regress:no-ctty -e TMPDIR=<构建区临时目录>）。
  604 个用例的执行口径（OHOS aarch64 设备实测，取数命令见 notes.md）：
  PASS 530 / FAIL 0 / SKIP 74 / NOT_RUN 0，合计 604。74 个 SKIP 逐桶归因：
  ① 39 个 need-ctty: yes 用例（selftest-tty-present、env-prompt、history-*、
  persist-history-1、utf8opt-* 等）依赖控制终端，自动化环境无 ctty，按
  check.t 自述以上游开关 -C regress:no-ctty 关闭（check.pl category_check
  对 need-ctty 的官方处理路径）；
  ② 35 个静态类别不适用：os:mirbsd 4+1（os:mirbsd,os:openbsd）、disabled 3、
  int:64 3（aarch64 int 为 32 位，Build.sh 生成 int:32 类别）、stdout-ed 3、
  shell:legacy-yes 2、shell:faux-ebcdic 2、!shell:legacy-no 1、
  !shell:textmode-no 1、os:os2 1、int:u 1、binsh 1、shell:textmode-yes 1、
  mnbsdash 1、fastbox 1（仅 test.sh -f 时启用），以及 !shell:ebcdic-no 9
  （非 EBCDIC 构建下 check.pl 运行时定义 shell:ebcdic-no 类别）。
  另有两处仅影响测试宿主、不影响用例判定的环境修复（均不进包）：
  /tmp 只读 ⇒ check.pl 不透传 TMPDIR，用 -e TMPDIR=…（check.pl 唯一环境注入
  开关）把可写临时目录交给用例，否则 here-doc/here-string 类 85 例因 mksh
  建不了临时文件而假失败；GNU grep>=3.8 的 fgrep 弃用告警污染 stderr ⇒
  以 grep -F shim 恢复 fgrep 历史契约（影响 regression-63/pipeline-3 两例）。
  test_package 另带 10 条消费者断言（运行打包产物 bin/mksh 断言版本自报、
  算术/参数展开、函数、管道、命令替换、退出码、test 内建、循环重定向），
  与上游 604 例分栏统计，不混入上游分母。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_mksh.sh
    description: "运行 bin/mksh 断言版本自报、-h 旗标、算术/参数/命令替换、函数、管道、退出码、test 内建、循环重定向"
    command: "sh test_mksh.sh <package_folder>/bin/mksh"

# 断言总数（1 个消费者测试程序，10 条断言）
assertion_count: 10
