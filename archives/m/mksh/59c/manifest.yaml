# 版本级 manifest 模板
# 文件位置: archives/m/mksh/59c/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游版本串 59c，无点；发行物文件名带 R 前缀：mksh-R59c.tgz）
version: "59c"

# 软件名
software: "mksh"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（2026-09-23 换源，用户裁定；PF7 留痕见 conandata.yml 注释）：
  # 原 MirOS 归档 mbsd.evolvis.org / 官方主站 mirbsd.org 在 CI Worker 侧连续
  # 两轮下载失败（build #56618 / #56997，机器人诊断均为网络问题）。现源为
  # 上游维护者 mirabilos 官方 GitHub 镜像 mirabilos/mksh-cvs2git tag
  # mksh-R59c（peel 提交 8b6f1b53…）；解包树与原版发行物（锚定 sha256
  # 77ae1665…）diff -rq 完全一致；github.com 为 Worker 实证可达域名且
  # CI get_mirrors 有镜像回退
  url: "https://github.com/mirabilos/mksh-cvs2git/archive/refs/tags/mksh-R59c.tar.gz"

  # 源码校验和（GitHub tag 归档形态；原版发行物锚定值 77ae1665… 见 conandata 注释）
  sha256: "f9d437710bc75de84fdd226508f5855a0f7d2d766679a3fff1d2fec803bb8859"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  # mksh 使用自带的 ksh 脚本 Build.sh（conftest 探测 + 编译 + 生成 test.sh），
  # 不经 configure/make，属 custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # mksh 零外部硬依赖：仅需 C 编译器与 libc；回归测试运行器需 perl（解释器，
  # 设备与 CI worker PATH 内均由 HNP 提供，不经 conan 依赖注入）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Build.sh 形态软件（无 configure/make）适配套路：配方 build() 用 AutotoolsToolchain.vars() 取 CC/CFLAGS/LDFLAGS 后内联驱动 `sh Build.sh -r -j -Q`，TARGET_OS=Linux 必须经环境显式传入（OHOS 的 uname -s=HarmonyOS 落 unknown 分支仅告警继续，但会丢失 -D_GNU_SOURCE，musl 下 setresuid/setresgid 隐式声明告警）；构建器随后生成的 test.sh 直接执行即可跑上游回归"  # knowledge_ref: E662
  - "mksh 无 GNU 风格 --version/--help/-V 长短选项，全部 rc=1；smoke 探针可过 -h（合法旗标 hashall，空 stdin 下 rc=0），版本取证用 `mksh -c 'echo $KSH_VERSION'`（R59c 自报 @(#)MIRBSD KSH R59 2020/10/31，sh.h 的 MKSH_BUILD_R=593 与版本串 59c 三处同源）"  # knowledge_ref: E662
