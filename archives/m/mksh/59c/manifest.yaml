software: mksh
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/59c/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "59c"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://snapshot.debian.org/archive/debian/20231201T000000Z/pool/main/m/mksh/mksh_59c.orig.tar.gz"

  # 源码校验和
  sha256: "77ae1665a337f1c48c61d6b961db3e52119b38e58884d1c89684af31f87bc506"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "LDFLAGS=-static"
    - "sh ./Build.sh -r"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "mksh 使用 Build.sh 脚本编译，非标准 autotools/cmake"
  - "Build.sh 自动检测平台和编译器特性，支持 clang"
  - "原始下载源 mbsd.evolvis.org 不可达，可使用 Debian 快照镜像替代"
  - "mksh 是 shell 工具，不支持 --version/--help 标志，Conan L2 smoke test 会失败"
  - "静态链接使用 LDFLAGS=-static，file 命令可确认 static 属性"
  - "HarmonyOS /tmp 只读导致部分 test.sh 测试失败，非编译问题"
