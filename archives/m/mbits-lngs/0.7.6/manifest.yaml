# 版本级 manifest — mbits-lngs 0.7.6

version: "0.7.6"
software: "mbits-lngs"
status: published
archive_date: "2026-09-23" # 上游 v0.7.6 tag / 原始归档日期
build_date: "2026-10-04" # 最终交付配方修订后的 HarmonyOS Conan create 日期
latest_test_date: "2026-10-04"
test_summary: >
  上游全量测试（LNGS_LITE=ON 配置）：基于 test-report.md 对 upstream_source_commit
  4f00aaaee7eb6aa1769dcc74f716a3649a62d8fd 的 CMake 等价性论证（核心库固定 STATIC，LITE
  仅增加附加目标；版本升级须重新核验）；GoogleTest 49/49 声明、402/402 实例通过，CTest
  18/20，fixture 0028-no-shared-data-enum.json 按上游 skippable 标记跳过，fixture
  0027-no-shared-data.json 失败。四个未发布的同族依赖按上游 pin 在真机构建，fmt 和
  mbits-semver 使用 registry 版本。

  交付包消费者测试（LNGS_LITE=OFF）：test_package CTest 通过 2/2；pkg-config 消费者编译链接
  检查另计，见 reports/test-report.md。
build_system: cmake

source:
  url: "https://codeload.github.com/mbits-os/lngs/tar.gz/refs/tags/v0.7.6"
  sha256: "85c9fd3afd5b6d5446a294f4de11221ae7fa160a62d1115a7ea0c1af17633a0b"
  tar_format: tar.gz

# 主构建与 test_package 的 HarmonyOS PC 验证均使用 CMake 4.4.3；主构建最低版本遵从上游根 CMakeLists.txt。
build:
  system: cmake
  configure_options:
    - "-DLNGS_APP=OFF"
    - "-DLNGS_TESTING=OFF"
    - "-DLNGS_LITE=OFF"
    - "-DLNGS_INSTALL=ON"
    - "-DLNGS_NO_PKG_CONFIG=ON"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
    - "-DCMAKE_CXX_STANDARD=17"
    - "-DCMAKE_CXX_STANDARD_REQUIRED=ON"
    - "-DCMAKE_CXX_EXTENSIONS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "mbits 家族库（mbits-os）依赖链未发布时核心库零外部依赖可独立交付，app/测试按 L0i 依赖门禁登记（草稿 DRAFT-mbits-lngs-family-core-first-delivery）"
  - "官方 tag tarball 中 git 子模块（tools/testing、tools/coveralls）为空占位，LNGS_TESTING=ON 无法 include googletest.cmake；打包构建关闭自测，test_package 用公开头 API 做消费者验证"
  - "任务头上游 URL org 有误（mbits-libs/lngs 404），真实官方上游为 mbits-os/lngs，需以实际可下载 tag 交叉核验"
  - "2026-10-03 真机完整复测：GoogleTest 49/49 声明、402/402 参数实例通过；CTest fixture 18/20 通过、1 跳过、1 失败；Conan 消费者测试单独计数"
  - "static-library 包含 liblngs.a、公开头文件与 LICENSE；HarmonyOS libc++ 工具链选择 C++ ABI runtime；pkg_config_name 按 Conan PkgConfigDeps 约定生成 lngs.pc，并由消费者目标编译链接验证"
  - "跟踪项：fixture 0027-no-shared-data.json 以 --share . 开头，实际输出 unknown command: --share，与预期 command missing 不一致；当前交付不含 CLI，恢复 LNGS_APP 时须复核该上游 fixture 并更新本报告"
