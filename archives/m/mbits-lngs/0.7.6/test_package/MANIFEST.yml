# test_package/MANIFEST.yml
package: mbits-lngs/0.7.6
homepage: "https://github.com/mbits-os/lngs"

# CI 中 conan create 运行已安装消费者测试；test_package 构建环境须提供 CMake >= 3.20；`pkg-config` 存在时执行 PkgConfigDeps 消费者编译链接覆盖，否则跳过该可选覆盖，不影响 CTest。以下上游复现命令仅供本地手工使用，不由 CI 或 conan create 执行；先依 test-report.md 自建 pin 依赖、恢复测试子模块并按其配置项完成 build/ 配置。
# 完整上游 GoogleTest 的证据与前置步骤见 reports/test-report.md「真机命令与结果」。
# upstream_check_command 仅适用于已按 reports/test-report.md 完成依赖、子模块、CMake 配置的本地 build/ 目录；它不属于 conan create/CI 门禁。upstream_test_in_build=false 表示该命令不由 Conan/CI 自动执行；upstream_test_command 留空表示不存在可脱离前置准备步骤单独运行的统一入口。
upstream_check_command: "cmake --build build -j2 && ctest --test-dir build --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

upstream_source_commit: "4f00aaaee7eb6aa1769dcc74f716a3649a62d8fd"
upstream_archive_sha256: "85c9fd3afd5b6d5446a294f4de11221ae7fa160a62d1115a7ea0c1af17633a0b"
upstream_declared_cases: 49
upstream_declared_cases_passed: 49
upstream_google_test_instances_passed: 402
upstream_google_test_instances_total: 402
upstream_cli_ctest_passed: 18
upstream_cli_ctest_total: 20
upstream_cli_ctest_skipped: 1
upstream_cli_ctest_failed: 1
upstream_cli_ctest_skipped_fixture: "0028-no-shared-data-enum.json"
upstream_cli_ctest_skipped_fixture_note: "上游标记 skippable: true"
upstream_cli_ctest_failure: "0027-no-shared-data.json：实际输出 unknown command: --share，上游预期 command missing"

upstream_tests:
  - file: libs/liblngs/tests/*.cc
    description: "上游 liblngs GoogleTest；25 个声明用例，25/25 通过，参数化实例计入 196/196"
    command: "libs/liblngs/liblngs-test"
  - file: app/tests/*.cc
    description: "上游 app GoogleTest；24 个声明用例，24/24 通过，参数化实例计入 206/206"
    command: "app/lngs-test"
  - file: app/tests/data/lngs_tests/*
    description: "上游命令行 fixture；CTest 总计 18/20 通过，0028-no-shared-data-enum.json 按 skippable 标记跳过；0027-no-shared-data.json 实际输出 unknown command: --share、预期 command missing"
    command: "ctest --test-dir <build> --output-on-failure"

# test_package 消费者测试独立于上游测试口径
# test() 在 can_run 为真时用 self.run(..., env="conanrun") 执行 test_mbits_lngs、可选的 test_mbits_lngs_pkgconfig，以及在共享库所在目录执行 test_mbits_lngs_shared_runner，然后再跑 CTest。共享消费者 runner 使用目标文件名，CTest 仍把工作目录设为 `$<TARGET_FILE_DIR:...>`。
# test_mbits_lngs_pkgconfig 会额外编译并链接相同消费者源码，验证 PkgConfigDeps 的上游 lngs 名称；它是构建期可选覆盖，不计入 CTest；未找到 `pkg-config` 或 `lngs.pc` 时跳过。
# 通过公开 <lngs/plurals.hpp> API 执行 6 项检查：decode 非空、nplurals==2、eval(0/1/2/5) 四个取值；另有 1 项共享消费者运行检查；static-library 配置在 HarmonyOS PC 真机 CTest 2/2 通过。
# CMake 默认构建会将静态核心库链接进 test_mbits_lngs_shared.so，并由 runner 加载调用该共享目标。
test_package_tests:
  - file: test.cpp
    description: "消费者测试：验证 decode、nplurals 及 eval(0/1/2/5) 四个输入"
    command: "./test_mbits_lngs"
  - file: shared_consumer_runner.cpp
    description: "runner 按 `./` 加目标文件名从共享目标输出目录加载共享库，通过平台动态加载器验证 PIC 静态核心库共享消费者"
    command: "./test_mbits_lngs_shared_runner"
code_assertion_count: 6
runtime_check_count: 1
total_check_count: 7
