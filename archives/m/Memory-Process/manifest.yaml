# 软件级 manifest
# 文件位置: archives/m/Memory-Process/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: Memory-Process
display: "Memory::Process"
description: "Perl module to monitor and report process memory usage (simplified Memory::Usage)"
category: library
homepage: "https://github.com/michal-josef-spacek/Memory-Process"
license: BSD-2-Clause

build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需编译 C 代码"
    - "使用 Module::Install 构建系统（inc/ 内嵌）"
    - "依赖 Memory::Usage 和 Readonly 模块"
    - "依赖 /proc 文件系统（仅支持 Linux/OHOS）"
    - "cpan 无法安装到系统目录（只读），需手动复制 .pm 文件到 ~/usr/local"

  common_dependencies:
    - "Memory::Usage 0.201"
    - "Readonly 2.05"

versions:
  "0.06-r3":
    status: published
    build_date: 2026-06-17
    published_as: Memory-Process
