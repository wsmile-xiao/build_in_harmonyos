version: "0.06-r3"
status: published
build_date: "2026-06-17"

source:
  url: "https://cpan.metacpan.org/authors/id/S/SK/SKIM/Memory-Process-0.06.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: perl
  # 平台构建系统标识（G4门禁检查字段）
  build_system: perl
  configure_options:
    - "perl Makefile.PL"
  dependencies:
    - "Memory::Usage/0.201"
    - "Readonly/2.05"
    - "Test::NoWarnings/1.04"
    - "Capture::Tiny"
  cc: none
  cxx: none

patches_applied: []

knowledge_gained:
  - "纯 Perl 模块安装方式：手动复制 .pm 到 ~/usr/local/lib/site_perl/"
  - "Memory::Usage 读取 /proc/[pid]/statm，OHOS 上正常工作"
  - "cpan install 失败因系统目录只读，解决方案是手动安装 .pm 文件"
  - "Module::Install 的 inc/ 目录内嵌于源码中，无需系统安装"
  - "page_size_in_kb 硬编码为 4，在 OHOS aarch64 上正常"

runtime_notes:
  - "纯 Perl 模块，无 SELinux 限制（不涉及 .so 加载）"
  - "模块加载路径: ~/usr/local/lib/site_perl/5.42.0/Memory/Process.pm"
  - "依赖 Memory::Usage (已安装) 和 Readonly (已安装)"
  - "/proc 文件系统在 OHOS 上可用"
