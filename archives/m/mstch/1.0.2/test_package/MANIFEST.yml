package: mstch/1.0.2
homepage: "https://github.com/no1msd/mstch"

upstream_check_command: "cmake -DWITH_UNIT_TESTS=ON .. && ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"

upstream_tests:
  - file: test/test_main.cpp
    source: mstch-1.0.2/test/test_main.cpp
    targets: ["mstch_test"]
    result: "PASS (compiled + run via ctest, 65/65 ctest targets)"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer test: variable substitution, HTML escaping, unescaped variable, section (truthy/falsy), list iteration, empty list, inverted section, comment stripping, partials, nested context (dotted key) — 11 assertions."
    command: "./test_package"

assertion_count: 11
