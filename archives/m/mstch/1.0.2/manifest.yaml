# mstch 1.0.2 编译档案
software: mstch
version: "1.0.2"
status: built
build_system: cmake
compile_date: 2026-08-31

dependencies:
  required:
    - boost/1.84.0
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - "-DWITH_UNIT_TESTS=ON"
    - "-DWITH_BENCHMARK=OFF"
  cflags: "-DBOOST_SP_NO_PTHREAD_SETCANCELSTATE (extra_cxxflags 注入，规避 musl pthread_setcancelstate 缺失)"
  env:
    CXX: clang++

patches_applied:
  - patches/fix-cmake-minimum-version.patch

compatibility:
  level: high
  issues: []
  notes: |
    - 编译型静态库 libmstch.a，源码 src/*.cpp 编译为静态归档
    - 依赖 boost::variant（header-only），通过 boost/1.84.0 的 Boost::headers 组件提供
    - boost recipe 已传播 BOOST_SP_NO_PTHREAD_SETCANCELSTATE，规避 musl 下 pthread_setcancelstate 缺失
    - clang 15 (OHOS profile) + libc++ + C++11 完全兼容

test_results:
  type: upstream + consumer
  upstream:
    source_files: 58
    registered_targets: 65
    executed: 65
    passed: 65
    failed: 0
    skipped: 0
    skip_reason: ""
    note: "上游 mstch_test (Catch v1.12.2) 65/65 通过：50 MSTCH_TEST + 8 MSTCH_PARTIAL_TEST（对应 test/data/ 58 个 .hpp）+ 7 SPECS_TEST（vendor/spec/specs/ 7 个 .json）= 65 个 ctest 目标"
  consumer:
    test_program: 1
    assertions: 11
    passed: 11
    failed: 0
  note: "上游 ctest 65/65 真实执行通过；消费者 test_package 11/11 断言通过"

knowledge_gained:
  - "mstch 1.0.2 是编译型静态库（非 header-only），src/*.cpp → libmstch.a"
  - "公开 API mstch::render(template, node, partials)，node 为 boost::recursive_variant 递归类型"
  - "依赖 boost::variant（header-only），通过 Boost::headers 组件"
  - "上游测试使用 Catch v1.12.2（非 Catch2 v3），子模块固定 SHA：Catch=35f4266d, rapidjson=54eb069f, headerize=fba2f012, spec=83b07216"
  - "CMake 目标名 mstch::mstch（NAMESPACE mstch::）"
  - "上游 cmake_minimum_required(VERSION 3.0.2) 被 CMake 4.x 拒绝，需 patch 至 3.5...3.31"

references:
  - https://github.com/no1msd/mstch
  - https://github.com/no1msd/mstch/releases/tag/1.0.2
