software: mstch
display: "mstch"
description: "Complete implementation of {{mustache}} templates in C++11 (by Daniel Sipka)"
category: library
homepage: "https://github.com/no1msd/mstch"
license: "MIT"

build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 CMakeLists.txt 只提供静态库目标（无 BUILD_SHARED_LIBS 逻辑），产出 libmstch.a"
    - "WITH_UNIT_TESTS=ON 完整执行上游 Catch v1.12.2 测试套件（65 个 ctest 目标）"
    - "GitHub tag tarball 不物化 git submodule（vendor/ 为空目录），recipe 在 build() 中按 1.0.2 tag 固定的 SHA 拉取 Catch/rapidjson/headerize/spec 仅用于编译测试，不打包"
    - "musl 无 pthread_setcancelstate：注入 -DBOOST_SP_NO_PTHREAD_SETCANCELSTATE 规避（boost::shared_ptr 相关）"
    - "唯一 patch：cmake_minimum_required 3.0.2 → 3.5...3.31（CMake 兼容，非业务逻辑）"
  common_dependencies:
    - "boost (boost_variant/boost_optional) — Conan 解析，进入 package 依赖"

versions:
  "1.0.2":
    status: built
    build_date: 2026-08-31
