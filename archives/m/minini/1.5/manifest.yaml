knowledge_gained:
  - "上游 minIni 1.5 在 ANSI/非 Windows 配置下**整包编不过**：ini_putbool 的声明（minIni.h:54）与实现（minIni.c:961）误用了未定义类型 TCHAR（其余 API 都是 mTCHAR；minIni.c 里 `#define TCHAR char` 出现在 `#include \"minIni.h\"` 之后，等于没生效）。修法：两处改为 mTCHAR（配方内联按二进制替换，保留上游 CRLF 行尾）。"
  - "minIni 源码是 CRLF 行尾 —— 用 GNU patch 打补丁必须加 --binary（否则 patch 会剥掉补丁里的 CR 并报 'different line endings'），因此本包改用配方内联修正更稳。"
  - "上游没有构建系统，是『单文件源码 + glue 头』的设计：适配时既编译静态库（libminIni.a）便于链接，也把 share/minini/minIni.c 一起交付，保留『把源码拖进宿主工程』的原始用法。"
  - "minIni 的大小写/注释行为：尾随注释（`Val=1 # comment`）会被剥离；键名匹配不区分大小写；`ini_getsection`/`ini_getkey` 从 idx=0 开始枚举，返回 0 表示结束；`ini_browse` 回调返回 1 继续遍历。"
