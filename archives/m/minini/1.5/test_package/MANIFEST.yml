package: minini/1.5
homepage: "https://www.compuphase.com/minini.htm"

# 上游自带一个断言型测试程序 dev/test.c（29 条 assert），需要 test.ini / testplain.ini
# 夹具；在 recipe 的 build() 里编译并运行（assert 失败会 abort → 非零退出码）。
upstream_check_command: "./test_minini  （在含 test.ini/testplain.ini 的目录里）"
upstream_test_in_build: true
upstream_test_command: "cc dev/test.c libminIni.a -o test_minini && ./test_minini"

upstream_tests:
  - file: test.c
    source: minIni-1.5/dev/test.c
    description: "上游断言型测试（29 条 assert）：字符串/整数/布尔/浮点读取、大小写与尾随注释、缺省值、ini_getsection/ini_getkey 枚举、ini_browse 回调、相对路径 INI"
    command: "./test_minini"

test_package_tests:
  - file: test_minini.c
    description: "完整消费者用例（rule12，16 步）：写入 6 个键 → 读回字符串/整数/布尔/浮点 → 缺失键与缺失段的默认值 → ini_haskey/ini_hassection → 2 段/paths 段 2 键/ini_browse 6 个键值对 → 覆盖写 port=9090 → ini_puts(...,NULL,...) 删键（browse 剩 5）→ 上游夹具的尾随注释剥离与 plain（无段落）INI 解析"
    command: "./test_minini <workdir>"
  - file: test_layout.py
    description: "适配自检（M=8）：libminIni.a（ar 归档）、minIni.h、glue 头、share/minini/minIni.c 内嵌源码含 TCHAR→mTCHAR 修正、LICENSE/NOTICE、未夹带中间产物与测试程序"
    command: "python3 test_layout.py <package_folder>"

assertion_count: 16
