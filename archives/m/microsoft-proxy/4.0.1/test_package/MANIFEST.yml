    reason: "OHOS libc++ <format> is an empty stub (_LIBCPP_HAS_NO_INCOMPLETE_FORMAT); tests use std::format"
  - file: tests/proxy_format_tests.cpp
    reason: "OHOS libc++ <format> stub; tests use std::format/std::formatter"
  - file: tests/proxy_integration_tests.cpp
    reason: "OHOS libc++ lacks <memory_resource> header"
  - file: tests/proxy_invocation_tests.cpp
    reason: "OHOS libc++ lacks std::ranges::for_each (_LIBCPP_HAS_NO_INCOMPLETE_RANGES) and <memory_resource>"

test_package_tests:
