# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md
#
# microsoft-proxy 4.0.1: header-only C++20 库；上游测试为 gtest 套件
# (tests/*_tests.cpp, googletest v1.15.2 + fmt 11.1.4 经 FetchContent)。
# OHOS SDK26 libc++ 15.0.4 缺 <format>/ranges 内存算法/<memory_resource>，
# 导致部分上游测试文件硬阻塞（详见版本 notes.md 测试台账）。

package: microsoft-proxy/4.0.1
homepage: "https://github.com/microsoft/proxy"

upstream_test_in_build: false
upstream_test_command: ""
upstream_test_source_candidates: 249
upstream_test_registered_count: 249
upstream_test_executed_count: 107
upstream_test_passed_count: 107
upstream_test_failed_count: 0
upstream_test_skipped_count: 142

