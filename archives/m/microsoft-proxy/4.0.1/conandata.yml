# R39: official GitHub tag URL only — CI injects mirror fallbacks.
# GitHub tag is `4.0.1` (no 'v' prefix); archive extracts to `proxy-4.0.1/`;
# conanfile.py source() uses strip_root=True to collapse it.
sources:
  url:
    - "https://gh-proxy.com/https://github.com/microsoft/proxy/archive/refs/tags/4.0.1.tar.gz"
    - "https://github.com/microsoft/proxy/archive/refs/tags/4.0.1.tar.gz"
  sha256: "78e1d88c36d2e7ee8f8dc47f112cdb96b8838dfd4177e104b53d9b64ed9b2357"

patches:
  - patch_file: "patches/0001-ohos-libcxx-format-and-ranges-compat.patch"
    patch_description: >
      OHOS SDK 26 libc++ 15.0.4 defines _LIBCPP_HAS_NO_INCOMPLETE_FORMAT and
      _LIBCPP_HAS_NO_INCOMPLETE_RANGES, so <format> is an empty stub and
      std::ranges::uninitialized_copy is unavailable. Guard the std::format
      skill/adapters with the standard __cpp_lib_format feature-test macro
      (R8 libc-probe exception) and replace std::ranges::uninitialized_copy
      with the equivalent classic std::uninitialized_copy so the core
      library compiles and runs on the OHOS toolchain (works everywhere).
    patch_type: "portability"
    patch_source: "local"