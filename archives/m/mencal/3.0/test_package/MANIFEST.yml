package: mencal/3.0
homepage: "https://kyberdigi.cz/projects/mencal/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

external_integration_note: "mencal 上游无任何测试套件：发行物仅单文件 Perl 脚本 mencal + LICENSE_EN.html + LICENCE_CZ.html + README（4 文件），无 tests/ 目录、无测试框架、README 无测试说明——上游测试入口数为 0。上游冒烟等价检查为 -V/--version。"

test_package_tests:
  - file: test.sh
    description: "mencal 消费者测试：直接执行（env-perl shebang）、-V/-h/月/季/年视图、monday-first、配置解析与经期日标记、配置文件落盘、三类错误路径、年视图确定性，外加 1 个端到端完整消费者用例（配置生成→落盘→以落盘文件重载→年/三月视图渲染→标记回读→双路径等价→全流程产物终判的 11 步闭环）（11 个断言分组 A–K、45 条断言）"
    command: "mencal -V / -h / -q -1 / -q -m -1 / -q -3 / -q -y 2026 / -c 配置 / 错误路径 / 端到端：-c f=落盘 → 位置参数文件重载 -y 2026 与 -3 → 内联同参数 cmp 等价"
    e2e_case: "K 组：经期配置生成→落盘→重载→年/三月视图渲染→标记回读→双路径逐字节等价→全流程产物真判定（11 步，每步真实传递数据，末步对全流程产物非空+含配置名+含经期标记做判定）；设计依据上游 README 指向的 ./mencal -h 用法文档"

assertion_count: 45
