knowledge_gained:
  - "Perl shebang 必须改为 /usr/bin/env perl 才能在 OHOS 直执（无 /usr/bin/perl 实测 rc=126；toybox env 无 -S 实测 rc=125 故 -w 不可保留，去 -w 前后实测行为一致）" # knowledge_ref: E684
  - "lang-preflight 对无扩展名单文件脚本恒判 other（不嗅探 shebang）；按人工复核留证以 --lang other 过门禁，真实语言 Perl5 以 file 输出与 shebang 首行为证" # knowledge_ref: E684
  - "零依赖单文件脚本包套路：build() 只做安装树装配加 shebang 补丁守卫断言（补丁静默失效即 RuntimeError 防假绿）" # knowledge_ref: E684
  - "locale 命令 OHOS 缺失时 mencal 优雅降级：stdout 走默认星期头正确、stderr 固定 2 行 Can't exec 噪声，测试只断言 stdout" # knowledge_ref: E684
