# 软件级 manifest — mencal
# 文件位置: archives/m/mencal/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: mencal

# 显示名
display: "Mencal 经期日历"

# 一句话描述
description: "纯 Perl 单文件经期日历命令行工具，按配置绘制月/三月/全年日历并标记经期日"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://kyberdigi.cz/projects/mencal/"

# 开源许可证（SPDX 标识）
license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom | none
build_system: none

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "shebang 必须改为 /usr/bin/env perl：设备与 CI worker 均无 /usr/bin/perl（直执实测 rc=126 bad interpreter）；toybox env 无 -S 故 -w 不可随 env shebang 保留，实测去 -w 前后行为一致"
    - "无构建系统（system: none）：build() 只做安装树装配并断言 shebang 补丁已生效，防补丁静默失效假绿"
    - "locale 命令在 OHOS 缺失：运行期优雅降级到默认星期头（stdout 正确，stderr 固定 2 行噪声属已知现象）"
  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.0":
    status: built
    build_date: "2026-09-23"
