package: mmdbctl/1.4.10
homepage: "https://github.com/ipinfo/mmdbctl"

# 上游测试存在：true（源码 lib/ 含 3 个 *_test.go，可经 go test 构建执行）
upstream_tests_exist: true

# 上游测试审计（源码 mmdbctl-mmdbctl-1.4.10.tar.gz, sha256 1588afaabface10b05a27e624b35a4113a19bd5888747fcc8505ca21b8d44149）
upstream_test_audit:
  source_tarball: "mmdbctl-mmdbctl-1.4.10.tar.gz"
  source_sha256: "1588afaabface10b05a27e624b35a4113a19bd5888747fcc8505ca21b8d44149"
  top_level_files:
    - main.go                      # CLI 入口（package main，go build -o mmdbctl .）
    - cmd_read.go / cmd_import.go / cmd_export.go / cmd_diff.go / cmd_verify.go / cmd_metadata.go
    - lib/                         # 上游测试所在包（全部 25 个 Test* 均在此）
    - go.mod                       # module github.com/ipinfo/mmdbctl, go 1.24.0
    - go.sum
  scanned_for:
    - "^func Test (go test 顶层函数，case 粒度)"
    - "t.Skip (上游主动跳过，三个文件均无)"
    - "t.Run (子测试，带前导空格，不计入顶层口径)"
  scan_result: "lib/cmd_export_test.go 10 + lib/cmd_import_test.go 14 + lib/cmd_read_test.go 1 = 25（逐文件核点 ^func Test，子测试 t.Run 不计入；无 t.Skip，干净运行预期 passed == discovered）"
  reason: "mmdbctl 1.4.10 为纯 Go CLI，安装产物为单个 mmdbctl 二进制；上游测试套件（lib 包 25 个 Test*）可通过 go test -v ./... 完整构建并执行；为满足 HMBS 真机门禁要求，上游 go test 已在 conanfile build() 中真实执行（-exec 签名包装器），test_package 消费者测试另以 python 验证核心纯逻辑映射 + 真实二进制 smoke（免 C 工具链，alloy/algernon 先例）"

# HMBS 官方盘点口径
upstream_test_total: 25
upstream_test_count_method: go_test_functions

# 上游测试命令（conanfile build() 中已集成）
upstream_check_command: "go test -v ./..."
upstream_test_in_build: true
upstream_test_command: "go test -v ./..."

# 上游实际运行的测试程序（函数级见上方 audit）
upstream_tests:
  - file: lib/cmd_export_test.go
    source: mmdbctl-1.4.10/lib/cmd_export_test.go
    description: "export 命令 10 个 Test*：flags 缺省/缺输入/非法格式/不存在文件/CSV/CSV无头/TSV/JSON/扩展名推断/输出参数"
    command: "go test -v ./lib/ -run TestCmdExport"
  - file: lib/cmd_import_test.go
    source: mmdbctl-1.4.10/lib/cmd_import_test.go
    description: "import 命令 14 个 Test*：flags 缺省/非法IP版本/非法record size/非法merge策略/多类型冲突/字段源冲突/空输入/CSV/TSV/JSON/IP段/表头解析/类型转换/无网络"
    command: "go test -v ./lib/ -run TestCmdImport|TestParseCSVHeaders|TestConvertToMMDBType"
  - file: lib/cmd_read_test.go
    source: mmdbctl-1.4.10/lib/cmd_read_test.go
    description: "read 回归 1 个 Test*：IPv6 库上 IPv4/IPv6 查询（.Unmap 修复）"
    command: "go test -v ./lib/ -run TestReadLookupOnIPv6Database"

test_package_tests:
  - file: test_mmdbctl.py
    description: "python 等效验证 import 标志校验/CSV表头解析/export格式校验与推断（23 断言，映射 6 个上游 Test*）+ 真实打包二进制 smoke（存在/ELF/--help rc==0/Usage 输出，4 断言；R34 实质依赖，免 C 工具链）"
    command: "python3 test_mmdbctl.py <exe>"
  - file: conanfile.py
    description: "运行真实打包 mmdbctl --help，验证二进制可用并输出 Usage（R34 实质依赖，字面 self.run）"
    command: "mmdbctl --help"

assertion_count: 27
