software: mmdbctl
# 版本级 manifest —— mmdbctl 1.4.10
# 遵循 ARCHIVE-SPEC v2.0

version: "1.4.10"

# 编译状态（published | built | failed | archived）
# 当前为已写入配方的初始工作树状态，等待 hmbs 真机预检确认。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-03"

# 构建系统类型
build_system: go

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方上游 GitHub release tarball
  url: "https://github.com/ipinfo/mmdbctl/archive/refs/tags/mmdbctl-1.4.10.tar.gz"
  sha256: "1588afaabface10b05a27e624b35a4113a19bd5888747fcc8505ca21b8d44149"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（cmake|autotools|makefile|meson|cargo|custom|go）
  system: go

  # 配置选项列表
  configure_options:
    - "build_system=go"
    - "CGO_ENABLED=0"
    - "GOFLAGS=-mod=mod"
    - "GOPROXY=https://mirrors.aliyun.com/goproxy/,https://goproxy.cn,https://goproxy.io,https://proxy.golang.org,direct"

  # 编译依赖列表（格式: name/version）—— Go 模块依赖由 go mod 管理，无 conan 依赖
  dependencies: []

  # 编译器（Go 工具链，非 clang）
  cc: go
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 上游测试审计（守则「上游测试套件执行」）
# ============================================================

upstream_tests_exist: true
upstream_tests_executable: true
upstream_test_total: 25
upstream_test_count_method: go_test_functions
upstream_test_audit: |
  mmdbctl 1.4.10 是纯 Go CLI（go.mod 要求 go >= 1.24.0）。上游官方测试经
  `go test -v ./...` 运行，源码审计确认共 25 个顶层 Test* 函数，全部位于
  lib/ 包（`^func Test[A-Za-z0-9_]*`，来源 raw.githubusercontent.com
  mmdbctl-1.4.10 tag）：
    lib/cmd_export_test.go (10): TestCmdExportFlags_Init,
      TestCmdExport_NoInputFile, TestCmdExport_InvalidFormat,
      TestCmdExport_NonExistentMMDBFile, TestCmdExport_CSVFormat,
      TestCmdExport_CSVFormatNoHeader, TestCmdExport_TSVFormat,
      TestCmdExport_JSONFormat, TestCmdExport_FormatInferredFromFilename,
      TestCmdExport_OutputViaArgument
    lib/cmd_import_test.go (14): TestCmdImportFlags_Init,
      TestCmdImport_InvalidIPVersion, TestCmdImport_InvalidRecordSize,
      TestCmdImport_InvalidMergeStrategy, TestCmdImport_MultipleFileTypes,
      TestCmdImport_ConflictingFieldSources, TestCmdImport_EmptyInput,
      TestCmdImport_SimpleCSV, TestCmdImport_TSVWithContent,
      TestCmdImport_JSONWithContent, TestCmdImport_IPRangeWithContent,
      TestParseCSVHeaders, TestConvertToMMDBType, TestCmdImport_NoNetwork
    lib/cmd_read_test.go (1): TestReadLookupOnIPv6Database
  合计 25。统计口径 = go test 函数计数（全模块 Test* 出现次数）：
  `go test -v ./...` 对每个顶层 TestXxx 各打印一行
  `--- PASS/FAIL/SKIP: TestXxx`（子测试 t.Run 带前导空格被忽略）。
  上游三个 *_test.go 均无 t.Skip，干净设备运行预期 passed == discovered == 25。
  上游测试在 hmbs 预检沙盒中真实执行：配方先探测设备 go，再按需从 aliyun
  Go 镜像 bootstrap go1.26.5（sha256 核对官方 go.dev 哈希，ELF 全部签名，
  见 algernon/alloy/vibecheck 先例）。build() 内先 `go mod download` 预取
  全模块，再运行 `go test -v ./...`。
  test_result 的 25 个上游用例与 C 等效用例的真实通过计数，一律以真机
  预检日志为准，本 manifest 不预填、不猜测。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Go binary CLI 构建系统：go build -o mmdbctl .（根目录 main.go，无 configure 步骤），go.mod 要求 go >= 1.24.0"
  - "上游测试为 `go test -v ./...`：25 个顶层 Test* 函数（lib 包，统计口径 go_test_functions）"
  - "Go 静态链接：CGO_ENABLED=0 生成静态二进制，无需 RPATH"
  - "hmbs 预检 conan-create 沙盒只注入 cmake/make/ninja/python3，不注入 go（vibecheck 先例）"
  - "Go 工具链缺失或过旧时 bootstrap：从 aliyun Go 镜像下载 go1.26.5（sha256 核对官方 go.dev 哈希），对 go/bin 与 go/pkg/tool 下全部 ELF 用 binary-sign-tool 签名"
  - "OHOS 下运行 go test：用 -exec 包装器对每个测试二进制先签名再执行，否则 OHOS 执行策略 EACCES"

notes:
  - "源码 tarball: github.com/ipinfo/mmdbctl/archive/refs/tags/mmdbctl-1.4.10.tar.gz, sha256 1588afaa..."
  - "源码镜像：conandata url 有序列表 gh-proxy.com 前缀镜像置前，官方 GitHub 置后（规则 3.18b）"
  - "Go 工具链 conandata.go_toolchain：linux-arm64 用 aliyun go1.26.5（sha256 fe4789e9...，与 alloy/vibecheck 一致，官方 go.dev 哈希）"
  - "GOPROXY=https://mirrors.aliyun.com/goproxy/,https://goproxy.cn,https://goproxy.io,https://proxy.golang.org,direct 用于模块下载（aliyun goproxy 居首）"
  - "OHOS /tmp 只读，GOCACHE/GOMODCACHE/TMPDIR 指向 go work root（/data/storage/el2/base/cache 下 conan-go-build/mmdbctl-1.4.10）"
