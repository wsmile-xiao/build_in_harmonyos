# 软件级 manifest —— mmdbctl
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: mmdbctl

# 显示名
display: "mmdbctl"

# 一句话描述
description: "MMDB 文件管理 CLI，支持 MMDB 数据库文件的读取/导入/导出/对比/元数据/校验"

# 分类标签（utility）
category: utility

# 官网 URL
homepage: "https://github.com/ipinfo/mmdbctl"

# 开源许可证（SPDX 标识）
license: Apache-2.0

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: go

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "纯 Go CLI，go.mod 要求 go >= 1.24.0，用 go build + CGO_ENABLED=0 静态构建"
    - "hmbs 预检 conan-create 沙盒只注入 cmake/make/ninja/python3，不注入 go——设备无 go 或过旧时自动从 aliyun Go 镜像 bootstrap go1.26.5 并 ELF 签名（algernon/alloy 先例），再真实运行上游 go test"
    - "test_package 为免编译 python 消费者测试（alloy/algernon 先例），不依赖 clang/CMake"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.4.10":
    status: built
    build_date: "2026-10-03"
    conan_ref: "mmdbctl/1.4.10"
