# mustach 1.2.10 版本级 manifest
# 遵循 ARCHIVE-SPEC；状态与实测结果由设备采信轮回填
version: "1.2.10"
software: mustach

# 本地验证通过（conan-verify 全门禁），PR 阶段无上传发布授权，状态为 built
status: built
build_date: "2026-09-21"
build_system: meson

source:
  url: "https://gitlab.com/jobol/mustach/-/archive/1.2.10/mustach-1.2.10.tar.gz"
  sha256: "95a2a351e748db9eeb98f40ba8bfbf010c1c6d2e725d31a3c7e602526d05bf90"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "--buildtype=release (conan MesonToolchain)"
    - "-Dlibs=single (core+已启用 wrapper 合一)"
    - "-Dcjson=enabled -Djsonc=enabled -Djansson=enabled"
    - "-Dtool=auto (交付 mustach CLI)"
    - "-Dwrap_mode=nofallback"
  dependencies:
    - "cjson/1.7.19 (可选 JSON 后端,制品仓在架)"
    - "json-c/0.18 (可选 JSON 后端,制品仓在架)"
    - "jansson/2.15.1.1 (可选 JSON 后端,制品仓在架)"
  tool_requires:
    - "meson/1.11.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-open-memstream-flush-before-close.patch (memfile_close fclose 前补 fflush；OHOS musl open_memstream 纯 fclose 不回写 *buffer/*size，设备四象限探针定性)"

test_results:
  type: official
  # 上游 11 个测试条目 = 8 工具测试（test1..test8，dotest.sh 渲染比对 resu.ref）
  # + 3 个 mustache spec v1.4.1 符合性套件（cjson/json-c/jansson，Makefile 带参真实运行）
  total: 11
  passed: 11
  failed: 0
  skipped: 0
  not_run: 0

knowledge_gained:
  - "上游 meson test 注册的无参条目（specs 三套件）以空 argv 运行 test-specs 可执行文件，summary 全 0 退出 0，属空跑假绿面；真实覆盖必须走 Makefile 带参路径并克隆 mustache/spec v1.4.1，框架注册数与真跑数分开申报 # knowledge_ref: DRAFT-E650"
  - "Conan 环境下上游『直编源码 + 裸 -l<dep>』形态的消费者测试目录必报头/库路径缺失；运行时注入 CPATH/LIBRARY_PATH（取 self.dependencies cpp_info 拼 package_folder）即修复，不改上游文件；json-c 制品为共享库时运行期还需 LD_LIBRARY_PATH # knowledge_ref: DRAFT-E651"
  - "OHOS musl 的 open_memstream 纯 fclose 不回写 *buffer/*size（输出恒空、size 下溢 SIZE_MAX），必须在 fclose 前显式 fflush；tmpfile() 因 /tmp 只读返回 NULL 不可作 fallback；内存渲染接口采信前先跑最小探针 # knowledge_ref: DRAFT-E660"

quality_gates:
  conan_verify: PASS
  G0_pre_build_risk: PASS
  G1_recipe_integrity: PASS
  G2_conan_create: PASS
  G3_system_lib_isolation: PASS
  G4_artifact_integrity: PASS
  L2_smoke_test: PASS
  L4_security_scan: PASS
  L5_artifact_baseline: PASS
