# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mustach/1.2.10
homepage: "https://gitlab.com/jobol/mustach"

# 上游测试命令（Makefile 路径；meson test 亦注册同 11 条，见 notes.md 口径说明）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "env NOVALGRIND=1 mustach=<build>/mustach make test (test1..test8, 经上游 dotest.sh 渲染比对 resu.ref)"

# 上游实际运行的测试程序（test1..test8 共 8 个工具测试 + 3 个 mustache spec 套件）
upstream_tests:
  - file: test1
    source: mustach-1.2.10/test1
    description: "工具测试：变量插值/区块/反转区块/整行注释/双分隔线包裹（dotest.sh 渲染 json+must 比对 resu.ref）"
    command: "make test (test1)"
  - file: test2
    source: mustach-1.2.10/test2
    description: "工具测试：HTML 列表渲染、嵌套条件区块（first/link）、空列表与假值区块"
    command: "make test (test2)"
  - file: test3
    source: mustach-1.2.10/test3
    description: "工具测试：转义三形态（{{name}}/{{&company}}/{{{company}}}）、自定义分隔符 {{=<% %>=}}、数组隐式迭代 {{.}}"
    command: "make test (test3)"
  - file: test4
    source: mustach-1.2.10/test4
    description: "工具测试：mustach 扩展语法（点路径、反斜杠转义键、= 值匹配、* 当前键、! 否定匹配）"
    command: "make test (test4)"
  - file: test5
    source: mustach-1.2.10/test5
    description: "工具测试：局部模板（{{> special}}/{{> notfound}}/无后缀与 .mustache 后缀查找 must2/must3.mustache）"
    command: "make test (test5)"
  - file: test6
    source: mustach-1.2.10/test6
    description: "消费者形态测试：test-custom-write.c 直编上游源码并链接 json-c（自定义 write 回调，局部 -U/-l/-x 选项）"
    command: "make test (test6, 需 CPATH/LIBRARY_PATH 注入 conan json-c)"
  - file: test7
    source: mustach-1.2.10/test7
    description: "工具测试：多文件模板组合（base.mustache 内 {{> node}} 引 node.mustache 渲染嵌套树）"
    command: "make test (test7)"
  - file: test8
    source: mustach-1.2.10/test8
    description: "工具测试：六种假值类型（空串/0/false/null/[]/0.0）区块语义一致性"
    command: "make test (test8)"
  - file: test-specs
    source: mustach-1.2.10/test-specs
    description: "mustache spec v1.4.1 符合性 3 套件（cjson/json-c/jansson 各一，须克隆 mustache/spec 后按 Makefile 路径带参运行；meson 注册的无参条目为空跑不采信）"
    command: "make test (spec-tests)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_mustach.c
    description: "消费者测试: 交付的 libmustach + mustach.h 经公开核心接口 mustach_itf/mustach_mem/mustach_file 覆盖变量插值、列表迭代、反转区块、HTML 转义与三花括号原样输出、独立行语义、ITEM_NOT_FOUND 错误上报、size 契约、版本宏、文件输出（13 项断言）"
    command: "./test_mustach"

# 测试断言总数 (实测, rule 4)
# 上游 11 个测试条目：8 个工具测试（test1..test8）+ 3 个 spec 套件（各内部跑
# mustache spec v1.4.1 全部用例文件，spec 用例级计数见 reports/ 与 PR 正文）
assertion_count: 13
