# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
package: minmea/0.3.0
homepage: "https://github.com/kosma/minmea"

# 上游测试入口：Makefile 的 `test` 目标（构建 tests.c 并运行 ./tests）
upstream_check_command: "make test"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make CC=<cc> CFLAGS='-g -Wall -Wextra -Werror -Wno-error=format-security -std=c99 -pthread -I<check>/include' LDLIBS='<check>/lib/libcheck.a -lm -lrt -pthread' tests && ./tests"

# 上游实际运行的测试程序
# 统计口径：Check 框架注册的测试用例数（tests.c 中 tcase_add_test 共 23 处，
# 与 srunner 输出 "Checks: 23" 一致）；同一用例内的 234 处 ck_assert* 断言
# 属于「断言数」另一口径，不与用例数混用。
upstream_tests:
  - file: tests.c
    source: minmea-0.3.0/tests.c
    description: "Check unit tests for NMEA checksum/scan/parse/utils (5 tcase, 23 registered cases)"
    command: "./tests"
    total: 23
    passed: 23

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者侧校验和验证、语句分类、RMC 解析与定点/坐标换算共 14 项断言"
    command: "./test_minmea"
    assertion_count: 14
