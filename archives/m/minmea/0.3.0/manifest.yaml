# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Check 0.15.2 优先读 TEMP 再回退 P_tmpdir（/tmp 在 OHOS 只读），测试运行前把 TEMP/TMP/TMPDIR 一起指向构建目录。"
  - "上游 Makefile 写死 -Werror，clang 15 对 Check 宏 ck_assert_msg(expr, 非字面量格式) 报 -Wformat-security；用 CFLAGS 追加 -Wno-error=format-security 降级该单条诊断，不改上游源文件。"
