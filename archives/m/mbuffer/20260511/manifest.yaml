source:
  url: "https://www.maier-komor.de/software/mbuffer/mbuffer-20260511.tgz"
  sha256: "13bab36f39408f7a08fb368913290ad0f117c934bab602094e18fcc123ec5783"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - '--prefix=/storage/Users/currentUser/usr/local'
    - '--bindir=${prefix}/bin'
    - '--sbindir=${prefix}/bin'
    - '--libdir=${prefix}/lib'
    - '--includedir=${prefix}/include'
    - '--oldincludedir=${prefix}/include'
  dependencies:
    - openssl/3.5.6.1
  cc: clang
  cxx: clang++
  note: >-
    G0（clean-build-verify）只重放 configure_options 的第一项且无 DESTDIR，故首项写设备可装前缀；
    conan 打包路径实际用 AutotoolsToolchain 的 --prefix=/ 配合 make install DESTDIR=package_folder
    （见 conanfile.generate() 把 tc.configure_args 回读进 mbuffer_configure_args.txt），两种语义都如实记录在此。
    哈希后端 MD5 由 requires 的 openssl/3.5.6.1 提供（该版本 no-shared ⇒ -lcrypto 解析到
    libcrypto.a，装出的二进制不带运行期 libcrypto 依赖）：generate() 从
    self.dependencies["openssl"].cpp_info 取绝对 includedirs/libdirs/bindirs，
    -I 进 CFLAGS、-L 进 LDFLAGS，上游测试的 $(OPENSSL) 直接指向该包的 bin/openssl。
    不再探测宿主 OpenSSL 前缀 —— CI worker 上 ~/.harmonybrew、/usr/local、/usr 都没有该头，
    宿主探测落空会让 configure 静默丢掉后端、test1/4/5/7 全红。

patches_applied:
  - "0001-Makefile.in.patch"
  - "0002-config.guess.patch"
  - "0003-config.sub.patch"
  - "0004-configure.patch"
  - "0005-mbuffer.c.patch"

knowledge_gained:
  - "E007 config.guess 2022-01-09 无 HarmonyOS 分支 -> ./configure cannot guess build type；ref: knowledge/doc/E007.md"
  - "E072 config.sub 需三处齐改，缺 case \\$kernel-\\$os 的 linux-ohos* 会报 Kernel linux not known to work with OS ohos；ref: knowledge/doc/E072.md"
  - "框架工具 scripts/patch-autotools-ohos.pl 的存在性检查会命中它自己写入的 basic_os=linux-ohos 行而 [skip] 掉第三处改动 —— 打完补丁仍不过，必须回读 ./config.sub \\$(./config.guess)；ref: knowledge/doc/E072.md"
  - "E011/E129/E543 autoconf 的 (umask 077 && mktemp -d ./confXXXXXX) 在 HMDFS 上建成 drwx--S--- 写不进 -> config.status 崩；删掉 umask 子句而非改 022 更稳；ref: knowledge/doc/E543.md"
  - "E074/E525 make -j>1 的 jobserver 要 mkfifo，本平台禁 -> 一律 -j1；ref: knowledge/doc/E525.md"
  - "E085 本平台 libc 既不声明也不导出 pthread_cancel：#pragma weak 必须配显式 extern 原型，判据看 objdump -T 里的 w D *UND* 而非 rc；对照表 musl-glibc-full-comparison-iso-posix.md:1747 标 OHOS ✅ 与实测冲突；ref: knowledge/doc/E085.md"
  - "E321 只写 #pragma weak 不给原型 -> clang 仍报 call to undeclared function，弱声明未建立，链接照旧失败；ref: knowledge/drafts/E321-draft-F987.kv"
  - "0001 同时修两处上游 Makefile.in 的缺失依赖边：version.h 挂进 $(OBJECTS) 前置（否则干净树默认 all 不在编译前跑 mkversion.sh，settings.c 报 fatal error: version.h file not found），mbuffer.1 挂进 install 前置（否则 make install 报 cannot stat mbuffer.1 —— man 页只是 version.h 规则的副产物、本身不在任何依赖链上）。两条边合起来才让上游文档的 make && make install 在干净树成立；ref: archives/m/mbuffer/20260511/notes.md §9"
  - "E010 族 设备 tar 是 toybox 0.8.12，不认 GNU 专有 --ignore-failed-read，且上游 test.tar 的 TESTTREE=/bin /usr/bin 在本平台不存在 -> 把该旗标与 openssl 程序名提成可覆盖变量；ref: knowledge/doc/E010.md"
  - "探针#11 dlopen/dlsym(RTLD_NEXT)：LD_PRELOAD 拦 open/read/write 在本机实测生效（含 idev.so/tapetest.so 三臂），RTLD_NEXT 读数以 ptrace-alternatives.md 的已验证结论为准，E502 另划 CI worker 界；ref: knowledge/operations/ptrace-alternatives.md"

