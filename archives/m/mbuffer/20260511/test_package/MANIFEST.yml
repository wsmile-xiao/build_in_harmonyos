# test_package/MANIFEST.yml
# Upstream official test declaration file.
# CI (build_and_test.sh L0e) requires this file to exist.

package: mbuffer/20260511
homepage: "https://www.maier-komor.de/mbuffer.html"

# How the upstream suite was discovered (static reading of the target tag, not
# back-filled from a log):
#   Makefile.in:99     check: $(TARGET) test0 test1 test2 test3 test4 test5 test6 test7
#   tests/             test0.sh ... test7.sh              -> 8 test bodies
#   CMakeLists.txt:177-184  add_test(NAME test0 .. test7 ...) behind `if (ENABLE_TESTING)`
# So N_static = 8 and N_registered = 8 (same eight, both harnesses).
upstream_check_command: "make check"

# The eight registered upstream tests are executed for real from the recipe's
# build() step (SKILL R51 / 手册04 §10: upstream tests must run inside build()).
upstream_test_in_build: true
upstream_test_command: >-
  make -j1 test0 && make -j1 test1 && ... && make -j1 test7
  (the eight prerequisites of `make check`, one target per invocation so that
   every test yields its own exit code; `make check` alone aborts at the first
   failing prerequisite and test0..test5 are `touch`-marked file targets, so a
   second pass would be a no-op)

# Upstream test programs -- all eight run, none dropped, none stubbed.
upstream_tests:
  - file: tests/test0.sh
    source: mbuffer-20260511/tests/test0.sh
    description: "two chained mbuffer instances must preserve the stream digest (pipe-through integrity, MD5 via openssl)"
    command: "make -j1 test0"
  - file: tests/test1.sh
    source: mbuffer-20260511/tests/test1.sh
    description: "forced-write mode (-f -o base -H) single output plus a /dev/null sink must reproduce the input byte-exactly (cmp)"
    command: "make -j1 test1"
  - file: tests/test2.sh
    source: mbuffer-20260511/tests/test2.sh
    description: "IPv4 TCP listener/sender round trip through mbuffer; self-gates on upstream's own have-af inet probe"
    command: "make -j1 test2"
  - file: tests/test3.sh
    source: mbuffer-20260511/tests/test3.sh
    description: "IPv6 TCP round trip with two simultaneous outputs; self-gates on have-af inet6"
    command: "make -j1 test3"
  - file: tests/test4.sh
    source: mbuffer-20260511/tests/test4.sh
    description: "tape emulation through LD_PRELOAD=tapetest.so, which resolves the real open()/write() with dlsym(RTLD_NEXT,...) and injects ENOSPC plus volume switches"
    command: "make -j1 test4"
  - file: tests/test5.sh
    source: mbuffer-20260511/tests/test5.sh
    description: "same tape emulation with --tapeaware: the caller must retry after a short write"
    command: "make -j1 test5"
  - file: tests/test6.sh
    source: mbuffer-20260511/tests/test6.sh
    description: "device block-size emulation through LD_PRELOAD=idev.so: st_blksize override and short reads failing with ENOMEM"
    command: "make -j1 test6"
  - file: tests/test7.sh
    source: mbuffer-20260511/tests/test7.sh
    description: "MD5 digest path with a percentage threshold buffer flush (-P90 --md5)"
    command: "make -j1 test7"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "runs the installed binary and asserts behaviour: version banner, 3 MiB byte-exact round trip, non-zero throughput summary, --md5 digest equal to an independently computed digest, multi-volume reassembly"
    command: "mbuffer --version; mbuffer -q -s 100k -i stream.bin -o sink.bin; mbuffer -s 64k ...; mbuffer -q --md5 ...; mbuffer -q -s 256k -f -o vol -H ..."
  - file: mbuffer_probe.sh
    description: "plain shell consumer: sha256 round trip, mbuffer --md5 cross-checked against md5sum, throughput summary present, repeated -o sinks byte-exact, -f overwrite of an existing target honoured and non-zero, volumes reassemble byte-exactly"
    command: "sh mbuffer_probe.sh <work-dir>"

# Consumer-side assertions (5 in conanfile.py + 4 in mbuffer_probe.sh).
# The 8 upstream verdicts are recorded separately and are not counted here.
assertion_count: 9
