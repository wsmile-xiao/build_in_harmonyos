patches:
  - patch_file: "patches/0001-Makefile.in.patch"
    patch_description: "Makefile.in: promote the GNU-tar-only --ignore-failed-read flag and the hard-coded openssl program name to overridable variables (TARGFLAGS / OPENSSL), add $(LDFLAGS) to the two interposer link rules, and repair two missing upstream dependency edges so the documented make && make install path works from a clean tree (version.h as an object prerequisite, mbuffer.1 as an install prerequisite)"
    patch_type: "portability"
    sha256: "402b739f78e2af4a7c36963bbc2d4b561bb91cf16b5b558e214d54017cdce523"
  - patch_file: "patches/0002-config.guess.patch"
    patch_description: "Teach config.guess to recognise HarmonyOS so ./configure can guess the build type (E007)"
    patch_type: "portability"
    sha256: "4b3bd59cc7657f3e6a08939c966cd41e39e5f712b785c04d089929f309042f91"
  - patch_file: "patches/0003-config.sub.patch"
    patch_description: "Accept the aarch64-unknown-linux-ohos triplet in config.sub: ohos-linux mapping, ohos* in the OS whitelist and linux-ohos* in the kernel/OS whitelist (E072)"
    patch_type: "portability"
    sha256: "e7a1ee3b2ae86da5724c8cc7623135ac21b9c69172926dd21f30334f01b3d72f"
  - patch_file: "patches/0004-configure.patch"
    patch_description: "umask 077 -> 022 for the autoconf temp directory so config.status/config.guess can write into it on HMDFS (E011/E129)"
    patch_type: "portability"
    sha256: "7871e340ce0570552fa30d85db26a33506c5c2de4465aef22ef29f312de26292"
  - patch_file: "patches/0005-mbuffer.c.patch"
