# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mlp.h/0.10.0
homepage: "https://github.com/px7nn/MLP.h"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "none"

# 上游无测试框架/测试目录（枚举证据见 notes.md），故未在 build() 集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（样例清单，非独立测试用例，详见 notes.md 台账）
upstream_tests:
  - file: examples/xor_gate.c
    source: MLP.h-0.10.0/examples/xor_gate.c
    description: "样例：训练 XOR 并保存模型"
    command: "clang -std=c99 -O2 xor_gate.c -o xor_gate && ./xor_gate"
  - file: examples/visual_sin.c
    source: MLP.h-0.10.0/examples/visual_sin.c
    description: "样例：训练 sin 函数拟合"
    command: "clang -std=gnu99 -O2 visual_sin.c -o visual_sin && ./visual_sin"
  - file: examples/load_csv.c
    source: MLP.h-0.10.0/examples/load_csv.c
    description: "样例：加载 CSV 数据集训练"
    command: "clang -std=c99 -O2 load_csv.c -o load_csv && ./load_csv"
  - file: examples/load_model.c
    source: MLP.h-0.10.0/examples/load_model.c
    description: "样例：加载已训练模型"
    command: "clang -std=c99 -O2 load_model.c -o load_model && ./load_model"
  - file: examples/mnist.c
    source: MLP.h-0.10.0/examples/mnist.c
    description: "样例：MNIST 手写数字分类训练（需外部数据集，观察窗口截断）"
    command: "clang -std=c99 -O2 mnist.c -o mnist && ./mnist"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_mlp.c
    description: "消费者测试：通过公开 API 训练 XOR 网络并验证真值表输出（R34）"
    command: "./test_mlp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
