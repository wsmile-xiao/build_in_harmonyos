# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: magicrescue/1.1.10
homepage: "https://github.com/jbj/magicrescue"

# 上游测试命令：无 ctest/check 目标，测试由 tests/tests.pl（Perl 驱动）遍历 tests/samples/
upstream_check_command: "perl tests/tests.pl"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：tests/tests.pl 遍历 11 个样例（独立用例数=11）
upstream_tests:
  - file: tests/tests.pl
    source: magicrescue-1.1.10/tests/tests.pl
    description: "数据恢复测试驱动：遍历 tests/samples/ 下 11 个样例（avi/elf/gimp-xcf/gpl/gzip/jpeg-exif/jpeg-jfif/msoffice/perl/png/zip），对每个样例按对应 recipe 执行 magicrescue 提取并校验输出"
    command: "perl tests/tests.pl"

# test_package 中自带的测试 (消费者视角验证，CLI 工具：运行已安装二进制做真实恢复)
test_package_tests:
  - file: test.sh
    description: "消费者用例：构造含 gzip 样例的磁盘镜像 blob，调用已安装 magicrescue + gzip recipe 恢复并校验 payload 内容"
    command: "bash test.sh"

# 测试断言总数（近似值, 用于质量评估）：上游 11 样例 × (提取成功+输出名+大小校验) ≈ 33 + 消费者 1
assertion_count: 34