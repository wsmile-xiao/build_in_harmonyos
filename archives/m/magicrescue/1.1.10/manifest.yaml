# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.10"

# 软件名
software: "magicrescue"

# 编译状态
# published | built | failed
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jbj/magicrescue/archive/refs/tags/v1.1.10.tar.gz"

  # 源码校验和
  sha256: "060c77be3e86a328a4f90f45d2da41b2b78cb74f13d44f69e29909cf68e98cad"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "magicrescue 自带自研 configure 脚本（非 autoconf），要求 CWD 必须是源码根目录（检查 ./config.d 与 ./config.config），Conan 配方需就地构建（cwd=source_folder），不能用 Autotools helper 的默认构建目录"
  - "magicrescue 是纯 CLI 工具（5 个可执行文件，无库产物），配方须声明 package_type=application，不需要 cpp_info.libs"
  - "consumer 测试的 gzip payload 必须解压后 ≥100 字节（默认 min_output_file=100），否则恢复文件被 magicrescue 丢弃"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
