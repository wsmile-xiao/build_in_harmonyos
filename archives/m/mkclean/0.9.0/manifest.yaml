software: mkclean
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.9.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
compile_date: "2026-06-29"
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/matroska/mkclean/mkclean-0.9.0.tar.bz2"

  # 源码校验和
  sha256: "2f5cdcab0e09b65f9fef8949a55ef00ee3dd700e4b4050e245d442347d7cc3db"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型（顶层字段，供 submit 检查）
build_system: cmake

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-fix-version-exit-code.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cmake 4.x 不兼容 cmake_minimum_required < 3.5，需设置 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "HarmonyOS 不被 cmake 识别为 UNIX 平台，需设置 CMAKE_SYSTEM_NAME=Linux 触发 UNIX 代码路径"
  - "conan profile 中 generator=Make 对 cmake 4.x 无效，应使用 Unix Makefiles"
  - "mkclean --version/--help 返回退出码 255，需补丁修复为 0 以通过 L2 smoke test"
  - "mkclean CMakeLists.txt 未为可执行文件添加 install() 目标，需在 package() 中手动 copy"
  - "tc.cache_variables 可设置 CMAKE_POLICY_VERSION_MINIMUM 和 CMAKE_SYSTEM_NAME（tc.variables 无效）"
