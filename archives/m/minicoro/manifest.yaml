# 软件级 manifest — minicoro
# 遵循 ARCHIVE-SPEC v2.0

software: minicoro
display: "minicoro"
description: "单头文件非对称栈式协程 C 库（API 受 Lua 协程启发）"
category: library
homepage: "https://github.com/edubart/minicoro"
license: MIT
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Header-only 单头文件库：配方仅安装 include/minicoro.h，不产生库二进制"
    - "消费者必须在且仅在一个翻译单元定义 MINICORO_IMPL 再 include 头文件，实现代码随消费者 TU 编译"
    - "OHOS aarch64 自动命中 minicoro.h 的 __aarch64__ MCO_USE_ASM 实现分支（第 ~1081 行），无需源码补丁"
    - "上游测试位于 tests/，tests/Makefile 提供 testsuite/example/simple/mt-example/benchmark 目标，make test 运行 testsuite"
    - "minicoro 与宿主系统无同名库冲突（协程头文件库，非系统库），无需 R26 静态化处理"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.1.3":
    status: built
    build_date: "2026-09-18"
    conan_ref: "minicoro/0.1.3"