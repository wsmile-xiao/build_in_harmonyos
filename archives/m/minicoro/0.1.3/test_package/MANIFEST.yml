# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: minicoro/0.1.3
homepage: "https://github.com/edubart/minicoro"

# 上游测试命令 (make -n 分析；minicoro 无 configure，直接用 tests/Makefile)
upstream_check_command: "make -n test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make -j1 test"

# 上游实际运行的测试程序（tests/Makefile 目标）
upstream_tests:
  - file: tests/testsuite.c
    source: minicoro-0.1.3/tests/testsuite.c
    description: "上游主测试套件：storage 双向交换、yield/resume 状态机、嵌套协程、user_data、mco_destroy 生命周期断言。"
    command: "./testsuite"
  - file: tests/example.c
    source: minicoro-0.1.3/tests/example.c
    description: "斐波那契生成器示例：storage 传值 + yield/resume 循环调用公开 API。"
    command: "./example"
  - file: tests/simple.c
    source: minicoro-0.1.3/tests/simple.c
    description: "最小示例：创建协程、resume 两次、状态从 SUSPENDED 到 DEAD。"
    command: "./simple"
  - file: tests/mt-example.c
    source: minicoro-0.1.3/tests/mt-example.c
    description: "多线程示例：4 线程 × 100 协程任务并发调度（依赖 pthread + c89thread）。"
    command: "./mt-example"
  - file: tests/benchmark.c
    source: minicoro-0.1.3/tests/benchmark.c
    description: "性能基准：上下文切换耗时测量（含 aarch64 计数器路径）。"
    command: "./benchmark"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：仅通过已安装的公开头文件与公开 API 完成协程创建/传值/恢复/状态断言。"
    command: "./test_minicoro"
  - file: test_ohos_platform.c
    description: "HarmonyOS 专项测试：验证 aarch64 MCO_USE_ASM 实现分支、嵌套协程、深度调用链 yield、自定义分配器语义（与消费者测试分别计数）。"
    command: "./test_ohos_platform"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 27