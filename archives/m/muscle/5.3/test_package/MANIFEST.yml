# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: muscle/5.3
homepage: "https://github.com/rcedgar/muscle"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# MUSCLE 使用 vcxproj_make.py 构建系统，无 make check 命令
# 上游测试通过 test_scripts/RUN_TESTS.bash 运行（需要 muscle 二进制 + 测试数据）
upstream_check_command: "python3 vcxproj_make.py --cppcompiler clang++ --ccompiler clang --openmp"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# MUSCLE 的测试需要完整的 test_data/ 目录和 qscore 工具
# 在 conan test_package 中使用 --version 冒烟测试替代
upstream_tests:
  - file: test_scripts/RUN_TESTS.bash
    source: muscle-5.3/test_scripts/RUN_TESTS.bash
    description: "上游完整测试套件（需要 test_data + qscore，CI 环境运行）"
    command: "bash test_scripts/RUN_TESTS.bash"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试：验证 muscle 二进制可执行并返回版本信息"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
