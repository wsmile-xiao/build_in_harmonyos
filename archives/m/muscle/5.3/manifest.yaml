# 版本级 manifest — muscle 5.3
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "5.3"
software: "muscle"
status: published
build_date: "2026-09-10"
build_system: "custom (vcxproj_make.py)"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/rcedgar/muscle/archive/refs/tags/v5.3.tar.gz"
  sha256: "74b22a94e630b16015c2bd9ae83aa2be2c2048d3e41f560b2d4a954725c81968"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom
  configure_options:
    - "--cppcompiler clang++"
    - "--ccompiler clang"
    - "--openmp"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "vcxproj_make.py 将 VS .vcxproj 转为 Makefile，需用 python3 执行（shebang /usr/bin/python3 在 OHOS 不存在）"
  - "vcxproj_make.py 调用 git log 生成 gitver.txt，需在源码目录 git init"
  - "通过 --cppcompiler clang++ 参数将编译器从 g++ 切换为 OHOS clang++"
  - "OHOS uname -s 返回 HarmonyOS，不匹配 Makefile 中 ifeq ($(UNAME_S),Linux) 分支，因此不触发 -static 链接"
  - "二进制依赖 libomp.so（OpenMP 运行时），clang 15.0.4 自带支持"
