package: matrix_hub/2.0
homepage: "https://github.com/Amoiensis/Matrix_hub"

# 上游无独立测试框架（无 ctest/pytest 注册）；可运行的上游入口为
# 示例脚本、示例 C 程序与 LP/MIP 样例问题，均已在本地实跑通过。
upstream_check_command: "ctest -N"   # 上游无 ctest 注册，实际以示例入口枚举为准
upstream_test_in_build: false
upstream_test_command: ""

# 已实际运行的独立上游用户入口（脚本 CLI 运行 / 示例程序 / solver 样例）
upstream_tests:
  - file: "examples/scripts/basic.m"
    description: "矩阵创建/求逆/乘法脚本示例"
    command: "Matrix_Hub_v2_0_cli basic.m"
  - file: "examples/scripts/commands.m"
    description: "命令用法脚本示例"
    command: "Matrix_Hub_v2_0_cli commands.m"
  - file: "examples/scripts/vars.m"
    description: "变量与表达式脚本示例"
    command: "Matrix_Hub_v2_0_cli vars.m"
  - file: "examples/scripts/scalar_promotion.m"
    description: "标量提升脚本示例"
    command: "Matrix_Hub_v2_0_cli scalar_promotion.m"
  - file: "examples/scripts/range.m"
    description: "范围向量脚本示例"
    command: "Matrix_Hub_v2_0_cli range.m"
  - file: "examples/scripts/slice.m"
    description: "切片脚本示例"
    command: "Matrix_Hub_v2_0_cli slice.m"
  - file: "examples/scripts/index_if.m"
    description: "索引与条件脚本示例"
    command: "Matrix_Hub_v2_0_cli index_if.m"
  - file: "examples/scripts/multi_output.m"
    description: "多返回值脚本示例"
    command: "Matrix_Hub_v2_0_cli multi_output.m"
  - file: "examples/scripts/transform_multi_output.m"
    description: "变换多输出脚本示例"
    command: "Matrix_Hub_v2_0_cli transform_multi_output.m"
  - file: "examples/scripts/advanced.m"
    description: "进阶脚本示例"
    command: "Matrix_Hub_v2_0_cli advanced.m"
  - file: "examples/scripts/help.m"
    description: "help 命令脚本示例"
    command: "Matrix_Hub_v2_0_cli help.m"
  - file: "examples/c_library/main.c"
    description: "C 库调用示例程序（demo）"
    command: "Matrix_Hub_v2_0_demo"
  - file: "examples/solver/problems/gt2.lp"
    description: "LP 样例问题求解"
    command: "Matrix_Hub_v2_0_solver lp gt2.lp"
  - file: "examples/solver/problems/lpp0033.lp"
    description: "LP 样例问题求解"
    command: "Matrix_Hub_v2_0_solver lp lpp0033.lp"
  - file: "examples/solver/problems/ortools_mip.lp"
    description: "MIP 样例问题求解"
    command: "Matrix_Hub_v2_0_solver lp ortools_mip.lp"
  - file: "examples/solver/problems/ortools_mip_array.lp"
    description: "MIP 数组样例问题求解"
    command: "Matrix_Hub_v2_0_solver lp ortools_mip_array.lp"

# test_package 消费者验证：C API 实算断言 + CLI 脚本执行
test_package_tests:
  - file: test.c
    description: "消费者程序：通过公开头文件调用 Matrix_gen/M_mul/M_I/M_print 并数值断言"
    command: "./test_matrix_hub"
  - file: basic.m
    description: "打包后的 Matrix_Hub_v2_0_cli 执行上游示例脚本"
    command: "Matrix_Hub_v2_0_cli basic.m"

assertion_count: 6