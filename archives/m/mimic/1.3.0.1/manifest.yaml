software: mimic
display: "Mimic"
version: "1.3.0.1"
status: built
build_date: "2026-09-23"
build_system: autotools
description: "Mycroft 轻量级 TTS 语音合成引擎（CMU Flite 分支 + 内嵌 HTS 引擎）"
category: multimedia
homepage: "https://github.com/MycroftAI/mimic1"
license: MIT

ohos_adaptation:
  key_points:
    - "autotools 工程但 tarball 无预生成 configure，需 autogen.sh（autoreconf -i）+ pkg.m4（ACLOCAL_PATH 指向 pkgconf 包 share/aclocal）"
    - "pcre2 硬依赖（PKG_CHECK_MODULES libpcre2-8）；ohpcd 的 pcre2 .pc 文件 prefix=/ 不可用，必须显式传 PCRE2_CFLAGS/PCRE2_LIBS（cpp_info 取路径，CI 缓存目录无关）"
    - "--with-audio=none 跳过 portaudio/pulse/alsa（桌面专用，OHOS 无），合成到文件与 API 完整可用"
    - "上游 -Werror 与 OHOS clang 包装器注入 -Wl,--code-sign 冲突 → tc.extra_cflags 加 -Wno-error=unused-command-line-argument（注意 tc.cflags 是 property，append 会静默丢失）"
    - "两处最小源码补丁：HTS_misc.c musl fpos_t/EOF 修复；cmu_indic_lang.h 加 extern（-fno-common 重复符号）"
    - "上游 LT_INIT 默认 static/shared 双禁用，显式 --enable-static --disable-shared（库以 .a 归档安装）"
    - "HTS voice 数据（.htsvoice）装在 share/mimic/voices/；HTS 引擎按 CWD（./voices 等）解析，消费方需 chdir 或复制"
  common_dependencies:
    - "pcre2/10.40"

versions:
  "1.3.0.1":
    status: built
    build_date: "2026-09-23"
    conan: true
    test_passed: 33
    test_failed: 0
