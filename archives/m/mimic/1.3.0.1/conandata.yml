# conandata.yml — mimic 1.3.0.1
# 上游官方源：GitHub MycroftAI/mimic1 tag 1.3.0.1 的 codeload tarball
# （上游仓库不发布 release 制品，tag tarball 即官方发行形式）。
# URL 用 codeload.github.com（github.com/archive/* 在本构建网络不可达，
# codeload 直连可达，两者是同一 tarball 生成器，字节一致）。
# 注意 1：GitHub 归档 tarball 为动态生成，gzip 流的字节不稳定，但解压后
# 源码树内容确定；此 sha256 为实测下载值，CI 若因镜像重新拉取导致哈希
# 不符需以实测为准复核。
# 注意 2：codeload URL 的 basename 是 "1.3.0.1"（无 .tar.gz 后缀），
# conan get() 会按后缀分派解压器，必须显式给 filename（同 abbtr/1.0.4
# 先例），否则走 zipfile 分支报 BadZipFile。
# 注意 3：tarball 本体 458MB（内嵌 flitevox 语音数据 + vid_gb_ap CG
# 参数表），解压后约 768MB。
sources:
  url: "https://codeload.github.com/MycroftAI/mimic1/tar.gz/refs/tags/1.3.0.1"
  filename: "mimic-1.3.0.1.tar.gz"
  sha256: "9041f5c7d3720899c90c890ada179c92c3b542b90bb655c247e4a4835df79249"

patches:
  "1.3.0.1":
    - patch_file: "patches/0001-musl-ftello-and-int-EOF-fixes.patch"
      # HTS_misc.c: musl fpos_t 不透明（无 __pos 成员）→ 用 POSIX ftello()；
      # HTS_get_token_from_fp(_with_separator) 的 `char c` 改 `int c`
      # （HTS_fgetc 返回 int，AArch64 char 默认无符号导致 EOF(-1) 截断
      # 成 0xFF，token 解析死循环——真实 bug，AArch64/musl 上必现）。
    - patch_file: "patches/0002-extern-decl-for-cst_rx_not_indic.patch"
      # cmu_indic_lang.h: `const cst_regex * const cst_rx_not_indic;` 是
      # 无 extern 的临时定义（tentative definition），clang 11+ 默认
      # -fno-common，多个包含该头的 TU 产生重复强符号 → 链接失败。
