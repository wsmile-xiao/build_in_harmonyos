# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mimic/1.3.0.1
homepage: "https://github.com/MycroftAI/mimic1"

# 上游测试存在性审计（hmbs 硬门禁要求）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：mimic 1.3.0.1 上游正式测试为 9 个 check_PROGRAMS 单元测试
  （TESTS 变量注册，make check 驱动），已在 OHOS aarch64 真机全量运行。
  1. 官方源码树（GitHub MycroftAI/mimic1 tag 1.3.0.1 tarball）：
     根 Makefile.am `TESTS += $(myunittests)`；myunittests 默认构建
     （usenglish+cmulex 启用、es_analysis 默认禁用）包含 9 个程序：
     hrg_test / regex_test / string_test / token_test / voice_select /
     wave_test / lex_test / lts_test / nums_test（unittests/*_test_main.c，
     cutest.h 断言框架）。testsuite/* 为构建编排/开发工具，不注册进
     TESTS，不是断言测试。
  2. 运行方式：`make check`（在 conanfile build() 内真实执行）。
  3. 实测结果（本机即 OHOS aarch64 目标机，2026-09-23）：
     TOTAL 9 / PASS 9 / FAIL 0 / SKIP 0 / ERROR 0（testsuite summary
     全文留档）。证据：构建日志 make check 段。

# 上游测试命令（make check 驱动 TESTS 注册的 9 个单测）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check  # conanfile build() 内执行，9/9 PASS"

# 上游实际运行的测试程序（默认配置全集，9/9 通过）
upstream_tests:
  - file: unittests/hrg_test_main.c
    source: mimic1-1.3.0.1/unittests/hrg_test_main.c
    description: "HRG（语篇表示结构）单元测试"
    command: "make check"
  - file: unittests/regex_test_main.c
    source: mimic1-1.3.0.1/unittests/regex_test_main.c
    description: "正则引擎单元测试（cst_regex，依赖 pcre2）"
    command: "make check"
  - file: unittests/string_test_main.c
    source: mimic1-1.3.0.1/unittests/string_test_main.c
    description: "字符串 API 单元测试"
    command: "make check"
  - file: unittests/token_test_main.c
    source: mimic1-1.3.0.1/unittests/token_test_main.c
    description: "分词器（tokenstream）单元测试"
    command: "make check"
  - file: unittests/voice_select_test_main.c
    source: mimic1-1.3.0.1/unittests/voice_select_test_main.c
    description: "voice 注册/选择单元测试"
    command: "make check"
  - file: unittests/wave_test_main.c
    source: mimic1-1.3.0.1/unittests/wave_test_main.c
    description: "波形（cst_wave）单元测试"
    command: "make check"
  - file: unittests/lex_test_main.c
    source: mimic1-1.3.0.1/unittests/lex_test_main.c
    description: "词典查找单元测试（cmulex）"
    command: "make check"
  - file: unittests/lts_test_main.c
    source: mimic1-1.3.0.1/unittests/lts_test_main.c
    description: "字母转音（LTS）单元测试"
    command: "make check"
  - file: unittests/nums_test_main.c
    source: mimic1-1.3.0.1/unittests/nums_test_main.c
    description: "数字展开（usenglish nums）单元测试"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者端到端测试：加载包内 HTS voice，真实调用 mimic_init/mimic_voice_from_file/mimic_voice_list/mimic_text_to_speech/cst_wave_save_riff/mimic_version/mimic_exit 完成文本→语音合成，断言波形样本数/采样率/非静音/RIFF 魔数（13 条 CHECK）"
    command: "cc test.c -I include/ttsmimic -L lib $(mimic.pc Libs) -lpcre2-8 -lm && ./test_mimic <pkg>/share/mimic/voices/cmu_us_slt_hts.htsvoice"
  - file: test_ohos.sh
    description: "HarmonyOS 专项：llvm-readelf 验证安装的全部 libttsmimic*.a 是 ar 容器且成员对象 ELF64/AArch64、测试二进制 ELF64/AArch64、NEEDED 仅 OHOS 系统库、RPATH/RUNPATH 合法（静态链接预期为空）"
    command: "sh test_ohos.sh"

# 测试断言总数（test.c 13 条 CHECK + test_ohos.sh 7 项 H 检查 + 上游 9）
assertion_count: 29
