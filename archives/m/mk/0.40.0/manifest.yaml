software: mk
version: 0.40.0
status: built
build_system: makefile
build_date: "2026-09-29"
created_at: 2026-09-29

source:
  url: "https://github.com/cheusov/mk-configure/archive/refs/tags/mk-configure-0.40.0.tar.gz"
  sha256: "7daaa79467389cd3bb7875ad24d0e56ba460b8f6165e138eb222620caf67f903"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "bmake all PREFIX=<prefix>"
    - "bmake install PREFIX=<prefix>"
  dependencies:
    - bmake/20200710
    - bmkdep/20140112
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-platform-support.patch"
  - "0002-ohos-install-robustness.patch"
  - "0003-ohos-regression-tests.patch"

knowledge_gained:
  - "bmake 的 != 命令替换会捕获子进程 stderr：id(1) 在 OHOS 上失败报错会进入 make 输出并破坏 minitest 的 expect.out 比较（本包 8+ 用例同时 FAILED 的根因） ref: E046"
  - "HMDFS 不支持硬链接（ln 报 Operation not permitted），install 的 LINKS 须回退为同目录相对符号链接 ref: E050"
  - "HMDFS 会归一化 chmod（0700/0750 -> 0770、0644 -> 0660），依赖精确权限位的测试断言无法成立 ref: E046"
  - "OHOS /bin/sh 为 toybox 内置命令提供别名（command -v chown 返回 'alias chown=chown'），据此判断可执行性会误判，须解析为绝对路径后再判 -x ref: E098"
  - "OHOS 上 /tmp 只读：测试脚本须改用 $TMPDIR，否则报 Read-only file system ref: E002"

notes: |
  - 上游项目名为 mk-configure；本仓库包名沿用任务书给出的 mk。
  - 构建与安装使用同一 PREFIX（conan 配方用 package_folder），因为 mk-configure 会把 @mkfilesdir@ /
    @mkc_libexecdir@ / @BMAKE@ / @AWK@ 烘焙进生成的脚本。
  - bmake 同时是 tool_requires 与 requires：构建 mk-configure 需要 bmake，安装后的 mkcmake 也需要 bmake。
  - 未修改任何上游功能语义；三处补丁均为平台可移植性/健壮性改动。
