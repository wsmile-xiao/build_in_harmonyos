# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mk/0.40.0
homepage: "https://github.com/cheusov/mk-configure"

# 上游测试入口：top-level main.mk 的 test 目标 (= test-tests test-examples)
upstream_check_command: "bmake test"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试：注册用例 46（tests.mk）+ 63（examples.mk）= 109，由 mk/mkc.minitest.mk
# 驱动，逐个比较 "expect.out" 与实际输出；新增 OHOS 专用用例 tests/os_OHOS。
# 口径统一：109 = 实际执行用例数（逐例执行，无漏测）。
# 目录数另计：tests 46、examples 65——examples/helpers 为辅助子工程、examples/hello_TARGETS
# 上游未注册（仅 doc/NOTES 提及），二者均不作为测试执行。
upstream_tests:
  - file: tests.mk
    source: mk-configure-mk-configure-0.40.0/tests.mk
    description: "46 个回归测试用例（上游 45 + 本次新增 tests/os_OHOS）"
    command: "bmake test-tests/<name>"
  - file: examples.mk
    source: mk-configure-mk-configure-0.40.0/examples.mk
    description: "63 个示例用例（examples.mk 注册清单；examples/ 目录另有 2 个未注册目录，不计入）"
    command: "bmake test-examples/<name>"
  - file: mk/mkc.minitest.mk
    source: mk-configure-mk-configure-0.40.0/mk/mkc.minitest.mk
    description: "minitest 驱动：diff expect.out 判定 succeeded/FAILED/skipped"
    command: "bmake test"
  - file: tests/os_OHOS/Makefile
    source: mk-configure-mk-configure-0.40.0/tests/os_OHOS/Makefile
    description: "本次新增的 OHOS 专用回归用例（仅 OPSYS=OHOS 时执行）：校验 OHOS 平台识别、sys/stat.h、sizeof(int) 与 OHOS 编译器内置宏"
    command: "bmake test-tests/os_OHOS"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者端到端测试：用安装后的 mkcmake 构建 C 工程、运行产物并校验输出，再调用 mkc_check_version"
    command: "MK_PKG=<pkg> sh test.sh"
  - file: conanfile.py
    description: "test() 以 self.run 调用 test.sh（env=conanrun），真实执行被测包"
    command: "conan test test_package mk/0.40.0"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
