# conandata.yml — mk-configure 0.40.0, packaged as "mk"
# Source: official GitHub release tag archive of cheusov/mk-configure.
sources:
  # 只写上游官方源；镜像回退由 CI 自动处理（R39 / PF7）。
  url: "https://github.com/cheusov/mk-configure/archive/refs/tags/mk-configure-0.40.0.tar.gz"
  sha256: "7daaa79467389cd3bb7875ad24d0e56ba460b8f6165e138eb222620caf67f903"

# NOTE: patches 0001/0003 also create new files, so `strip` must stay at its
# default (0): conan applies them with patch_ng, which strips the "b/" prefix
# itself and would additionally strip the first real path component with
# strip: 1, creating the new files at the wrong location.
patches:
  - patch_file: "patches/0001-ohos-platform-support.patch"
    patch_description: "Recognize HarmonyOS/OHOS as a platform and provide OHOS toolchain defaults"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-install-robustness.patch"
    patch_description: "Survive a userland without id(1)/chown(1)/chgrp(1) and without hard links (HarmonyOS/OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-regression-tests.patch"
    patch_description: "Register OHOS as a known system, add the tests/os_OHOS regression case and honour $TMPDIR instead of the read-only /tmp"
    patch_type: "portability"
