software: mk
display: "mk-configure"
description: "Build system on top of bmake (portable NetBSD make)"
category: build-tool
homepage: "https://github.com/cheusov/mk-configure"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "HarmonyOS 的 uname -s 返回 \"HarmonyOS\"，mkc.init.mk 规范化为 OHOS（新增 mk/mkc_imp.platform.OHOS.mk）"
    - "OHOS 无裸 cc/c++/cpp，平台文件提供 CC.OHOS/CXX.OHOS/CPP.OHOS = clang/clang++/clang -E"
    - "OHOS 的 id(1) 不可用（uid 不在用户库中），其 stderr 会被 bmake 的 != 捕获并污染回归测试输出，故静默化"
    - "HMDFS 不允许硬链接，LINKS 安装回退为同目录相对符号链接"
    - "OHOS 无 chown(1)/chgrp(1)（/bin/sh 仅提供不可执行的别名），mkc_install 在解析不到可执行文件时跳过属主变更"
    - "bmake 既是构建工具也是运行期依赖（mkcmake 是 bmake 的薄封装）"
  common_dependencies:
    - bmake
    - bmkdep

versions:
  "0.40.0":
    status: built
    build_date: "2026-09-29"
