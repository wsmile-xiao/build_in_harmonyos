knowledge_gained:
  - "hmdfs 禁 symlink → meson 跳过全部 symlinking：shared_library(version:) 只装 libmmlib.so.1.2.2 本体，缺 .so 开发链接；平台规范=单一无版本文件（knowledge E330/E331；同库先例 vvenc 1.14.0），补丁去掉 version 参数 0001"
  - "OHOS 内核/沙箱禁 shebang 脚本 execve：meson run_command(find_program('read_version.py')) configure 即失败；补丁 0002 改字面版本（同问题主库先例 4ti2 OHOS shebang 处理）"
  - "threads/dl/rt 系统库在 OHOS musl 下：clang -ldl -lrt -lm -lpthread 全部可链接（符号并入 libc），meson find_library 链接探测通过，无需补丁；工具链默认 as-needed 不产生 stub DT_NEEDED"
  - "上游测试套件（check 框架）经 test_requires 引入 check/0.15.2 在 create 构建期可用（不传播消费者），验证 test_requires 在平台 conan 版的行为（先例 kea-hook 家族 gtest）"
  - "check 0.15.2 临时文件目录优先级 TEMP → P_tmpdir（musl 定义 /tmp，OHOS 只读）→ TMPDIR：真机 meson test 必须显式前缀 TEMP=<可写目录>，否则 check 系测试建立 fork 通信文件失败（check_msg.c:317）"
  - "OHOS libc 无 robust mutex API（pthread_mutexattr_setrobust/pthread_mutex_consistent 符号缺失，链接期 undefined symbol）：meson HAVE_PTHREAD_MUTEX_CONSISTENT 探测失败 → mm_thr_mutex_init(PSHARED) 退化为非 robust 互斥锁，崩溃恢复类测试必然挂死（thread:robust_mutex 平台豁免）"
  - "OHOS 无 IPv6 loopback：getaddrinfo(localhost) 仅 IPv4（/etc/hosts 无 ::1 且拒绝读取），上游 socket 全地址族迭代用例只余 IPv4 分支可过（socket 组 13 用例平台豁免）"
  - "OHOS posix_memalign(SIZE_MAX) 返回 0 且置空指针、不设 ENOMEM；mm_aligned_alloc 因此报 lasterror=0（allocation 组豁免）"
  - "OHOS 对已关闭对端的 AF_UNIX SOCK_SEQPACKET 写返回 ECONNREFUSED(111) 而非 EPIPE(32)（ipc:broken_pipe 豁免）"
  - "上游测试失败的平台豁免须机制化：配方解析 meson-logs/testlog.txt，失败集合 ⊆ 声明豁免名单才放行（TEST_QUALITY_SPEC §3.3），名单外失败硬失败"
