sources:
  url: "https://github.com/mmlabs-mindmaze/mmlib/archive/refs/tags/1.4.2.tar.gz"
  sha256: "e3d6caa184ce958ae2790eb68b4a0f107120156df9462061e963ff33e6b0a538"

patches:
  - patch_file: "patches/0001-src-meson-unversioned-so.patch"
    patch_description: "hmdfs 家目录拒绝符号链接（ln -s 返回 EPERM），meson 探测后打印 'Symlink creation does not work on this platform. Skipping all symlinking.' 并跳过全部符号链接：shared_library('mmlib', version: '1.2.2') 只安装 libmmlib.so.1.2.2 本体，libmmlib.so 开发链接缺失，消费者 -lmmlib 与 CMakeDeps find_library(mmlib) 均不可解析。平台规范即单一无版本文件（no-versioned-soname.cmake：每个已发布 OHOS 生态库都是单一无版本文件）；本补丁去掉 src/meson.build 中 shared_library 的 version 参数，产出单一 libmmlib.so（SONAME 同名）。Linux 宿主上该参数仅影响文件名与 SONAME，行为无差异"
    patch_type: "portability"
  - patch_file: "patches/0002-meson-read-version-literal.patch"
    patch_description: "OHOS 内核/沙箱禁止 shebang 脚本直接 execve（脚本可执行位齐全仍 EACCES，先例 spice 0001）：顶层 meson.build 以 run_command(find_program('read_version.py')) 取版本号，真机 configure 阶段必然失败。补丁改为字面版本 '1.4.2'（与仓库 VERSION 文件内容逐字节一致），消除构建期脚本执行与 python 解释器依赖；Linux 宿主上等价"
    patch_type: "portability"
  - patch_file: "patches/0003-tests-child-proc-check-dep.patch"
    patch_description: "上游潜伏依赖缺陷：tests-child-proc 目标编译 ipc-api-tests-exported.c（第 8 行 #include <check.h>），但该目标未声明 check 依赖——check 装在系统 /usr/include 时凭默认搜索路径碰巧可编，conan 独立 prefix（如 OHOS 制品 check/0.15.2）下 check.h 不可见、构建必挂（真机实测 fatal error: 'check.h' file not found；同文件目标 perflock 与 testapi/testinternals 均正确声明了 libcheck）。补丁给 tests-child-proc 补上 dependencies : [libcheck]（libcheck 为顶层 meson.build 中 dependency('check')，作用域内可见）；语义修正上游 target 依赖声明，Linux 宿主上无行为差异"
    patch_type: "portability"
  - patch_file: "patches/0004-tests-testlog-sigsetjmp.patch"
    patch_description: "testlog.c 以 signal()+setjmp/longjmp 捕获 abort()（SIGABRT）验证 mm_crash/mm_check 语义：OHOS 实测普通 longjmp 跳出信号处理器后 SIGABRT 掩码不复位（POSIX：longjmp 不恢复信号掩码，须 sigsetjmp/siglongjmp），导致第二次 abort 进入实现默认动作直接杀进程——testlog 先测 mm_crash 再测 mm_check，第二个 abort 必死（真机最小复现：连捕两次 abort，第一次成功、第二次 Signal 6 core dumped；换 sigsetjmp(env,1)/siglongjmp(env,1) 后连捕三次全部成功）。补丁改为 sigsetjmp(env,1)/siglongjmp(env,1)/sigjmp_buf，恢复掩码语义；该写法是 POSIX 正确模式，Linux 宿主上行为不变"
    patch_type: "portability"
