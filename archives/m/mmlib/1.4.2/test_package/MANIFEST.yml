    programs_total: 5
    programs_passed: 4                 # testlog/testinternals/testerrno/testprofile
    programs_exempt: 1                 # unit api tests（TAP ERROR → pass-after-exempt）
    subtests_declared: 420             # testapi TAP 计划 1..420
    subtests_parsed: 420               # TAP 结果行 1..420 全数覆盖（351 ok + 69 not ok = 420）；
                                       # meson 汇总显示 351/419：#280 行首被子进程无换行
                                       # 输出粘连（'837278008not ok 280'），meson 行式解析
                                       # 丢弃整行；配方按子串匹配识别全部 69 条失败行
    subtests_passed: 351
    subtests_failed: 69                # 69 条失败子测试，分布 29 个具名用例，全部见 platform_exemptions
    platform_exempt_cases: 29
    pass_rate_raw: "351/420 = 83.6%"
    pass_rate_effective: "351/(420-69) = 100%"
