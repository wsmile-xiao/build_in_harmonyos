# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mmlib/1.4.2
homepage: "https://github.com/mmlabs-mindmaze/mmlib"

# 上游测试命令：meson test（配方 build() 内经 meson.test 实际执行；native OHOS
# 真机加 --timeout-multiplier=16 --no-rebuild，cross 构建跳过执行）
upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test -v --timeout-multiplier=16 --no-rebuild"

# 上游实际测试程序（meson 注册 5 个；testinternals/testapi 为 TAP 协议，
# 内部含公开 API 子用例集。真机实测口径见文件尾 verification）
upstream_tests:
  - file: testlog.c
    source: mmlib-1.4.2/tests/testlog.c
    description: "日志 API（mm_log / mm_log_set_maxlvl）行为测试"
    command: "./testlog"
  - file: testerrno.c
    source: mmlib-1.4.2/tests/testerrno.c
    description: "错误状态 API（raise_error/_from_errno/lasterror 查询）测试"
    command: "./testerrno"
  - file: testprofile.c
    source: mmlib-1.4.2/tests/testprofile.c
    description: "性能剖析 API（mm_profile_*，SIGPROF 采样）测试"
    command: "./testprofile"
  - file: testinternals.c
    source: mmlib-1.4.2/tests/testinternals.c
    description: "内部实现测试（check 框架，TAP 协议，链接 mmlib-static）"
    command: "./testinternals"
  - file: testapi.c
    source: mmlib-1.4.2/tests/testapi.c
    description: "公开 API 单元测试集（check 框架，TAP 协议：alloc/argparse/dir/dlfcn/file/ipc/process/shm/socket/thread/time/utils）"
    command: "./testapi"

# ── meson 测试条目级豁免（TEST_QUALITY_SPEC §3.3）────────────────────
# 'mmlib:unit api tests'（testapi，TAP 协议）内含下方 29 个 platform-exempt
# 用例失败 → TAP 计数非全绿 → meson 对条目整体判 ERROR。豁免后该条目
# effective 通过。
meson_entry_exemptions:
  - test_name: "mmlib:unit api tests"
    reason: "内含 29 个 platform-exempt 用例（69 条 not-ok 子测试）→ meson 判 ERROR"
    effective_result: "pass-after-exempt"
    covered_by: platform_exemptions
    net_pass_rate: "351/(420-69) = 100%"   # TAP 1..420 全数覆盖：351 通过 + 69 失败子测试（全部豁免）

# ── 平台豁免（TEST_QUALITY_SPEC §3.3 / ADAPTATION_GUIDE §8）──────────
# testapi 的 69 条失败子测试（分布 29 个具名 check 用例）全部为 OHOS 平台语义差异，
# 非配方缺陷、非代码缺陷。每类根因均以真机最小探针（probe2-mmlib.c，直连
# 构建产物 libmmlib.so）取值取证；配方 _check_ohos_test_failures() 解析
# meson-logs/testlog.txt：失败集合 ⊆ 本清单 → 记录汇总放行；清单外任何失败
# → 硬失败（不容忍真实回归）。
platform_exemptions:
  - category: socket                    # 13 用例
    count: 13
    cases:
      - socket:create_invalid_sockclient
      - socket:create_sockclient
      - socket:getaddrinfo_error
      - socket:getaddrinfo_valid
      - socket:read_on_localhost
      - socket:recv_multimsg_on_localhost
      - socket:recv_on_localhost
      - socket:recvmsg_on_localhost
      - socket:send_multimsg_on_localhost
      - socket:send_on_localhost
      - socket:sendmsg_on_localhost
      - socket:test_getpeername
      - socket:write_on_localhost
    sample_failure: "socket:recv_on_localhost: Test timeout expired / mmlib 日志 getaddrinfo(localhost, 32145) failed: Node is not known"
    reason: "OHOS 无 IPv6 loopback：getaddrinfo('localhost') 仅解析出 IPv4（/etc/hosts 无 ::1，且 OHOS 拒绝读 /etc/hosts）。上游用例对 localhost 做全地址族迭代（FIRST_IPV6_TEST_CASE 起走 AF_INET6），IPv6 迭代失败后子进程提前退出，剩余迭代等 4s 到期，TAP 子用例记 timeout；IPv4 迭代全部通过（探针实证 127.0.0.1 bind/listen/connect/accept 全 0）"
    verdict: "平台地址族差异（OHOS 无 IPv6 回环）导致的上游用例环境不成立，非 mmlib 代码缺陷"
    evidence: "probe: loopback TCP OK (IPv4)；mmlib 日志 getaddrinfo 失败；单用例隔离运行 IPv4 分支全绿"
  - category: file                      # 10 用例
    count: 10
    cases:
      - file:check_access_mode
      - file:copy_fail
      - file:copy_file
      - file:copy_symlink
      - file:dangling_symlink
      - file:dir_symbolic_link
      - file:hard_link
      - file:path_stat
      - file:rename_empty_directory
      - file:symbolic_link
    sample_failure: "file:symbolic_link: Assertion 'mm_symlink(...) == 0' failed；file:path_stat: (st.mode & 0777) == 432, info->mode == 256；file:copy_fail: lasterror == 17, 期望 21"
    reason: "hmdfs 文件语义与 Linux 不同，三条实机事实：①符号链接创建被拒（symlink rc=-1，EPERM/EACCES 级），硬链接被拒（link rc=-1 EPERM(1)）——上游 symlink/hardlink/copy_symlink/dangling_symlink/dir_symbolic_link 用例环境不成立；②权限位语义：umask=002 且 hmdfs 剥离 other 位（open(0666) 后 stat=660），chmod(0) 返回 0 但 mode 不变（不强制执行）——path_stat/check_access_mode 的期望模式不成立；③级联：check 失败会中断用例内后续清理（unlink/rmdir 未执行），残留状态使后续用例得到 EEXIST(17)（copy_fail 期望 EISDIR(21)；rename_empty_directory 首行 mm_mkdir 得 EEXIST；隔离探针在洁净 cwd 复现同一 mm_mkdir rc=0、在残留 cwd rc=-1 lasterr=17）"
    verdict: "平台文件系统语义差异 + check 中断级联，非 mmlib 代码缺陷"
    evidence: "probe: symlink EACCES / link EPERM / create(0666)→660 / chmod(0) rc=0 mode 不变 / mm_copy(dir→洁净 dst) 正确得 EISDIR(21)"
  - category: process                   # 3 用例
    count: 3
    cases:
      - process:spawn_daemon_error
      - process:spawn_error
      - process:wait_signal
    sample_failure: "process:wait_signal: status & 0x000000FF == 5, signum == 4；process:spawn_error: lasterror == 13, exp_err == 2"
    reason: "①wait_signal SIGILL 子例：上游用 __builtin_trap() 触发 SIGILL，aarch64 上编译为 BRK → SIGTRAP(5)，而 .inst 0（UDF）才产生 SIGILL(4)（探针实证 termsig=5 与 4）；SIGSEGV 子例依赖 null 解引用的 UB（-O3 下被优化，子进程先打印调试值后正常退出）。②spawn_error/spawn_daemon_error：裸名走 execvpe PATH 搜索时，OHOS 沙箱对无效路径 execve 返回 EACCES(13)，上游期望 ENOENT(2)（探针：直接 execve 相对不存在路径 = ENOENT；mmlib mm_spawn 实得 lasterr=13）"
    verdict: "平台信号语义（aarch64 trap 指令）+ 沙箱 execve errno 差异，非 mmlib 代码缺陷"
    evidence: "probe: __builtin_trap→SIGTRAP(5)、UDF→SIGILL(4)、execve 相对不存在=ENOENT、mmlib mm_spawn lasterr=13"
  - category: ipc                       # 1 用例
    count: 1
    cases:
      - ipc:broken_pipe
    sample_failure: "ipc:broken_pipe: Assertion 'mm_get_lasterror_number() == 32' failed"
    reason: "对端已关闭的 AF_UNIX SOCK_SEQPACKET 写：OHOS 返回 ECONNREFUSED(111)，上游期望 EPIPE(32)（探针直连构建产物：mm_write(closed peer) rv=-1 lasterr=111 rawerrno=111）"
    verdict: "平台套接字语义差异，非 mmlib 代码缺陷"
    evidence: "probe2: mm_write(closed peer) rv=-1 lasterr=111 (Connection refused)"
  - category: thread                    # 1 用例
    count: 1
    cases:
      - thread:robust_mutex
    sample_failure: "thread:robust_mutex: (after this point) Test timeout expired（用例等待崩溃恢复的子进程，永久阻塞）"
    reason: "OHOS libc 无 robust mutex API：pthread_mutexattr_setrobust / pthread_mutex_consistent 符号缺失（链接期 undefined symbol 实证；头文件亦无原型）。meson 探测 HAVE_PTHREAD_MUTEX_CONSISTENT 失败（config.h 无该宏）→ mmlib mm_thr_mutex_init(MM_THR_PSHARED) 退化为非 robust 进程共享互斥锁（mmlib 自身 WARN 'Process shared mutex are supposed to be robust as well...'；mm_thr_mutex_consistent 返回 ENOTSUP(95)）。上游用例的持有者崩溃恢复场景（子进程持锁 abort 后其余进程应得 EOWNERDEAD 继续）在非 robust 互斥锁上只能永久阻塞（探针复刻：父进程 lock 25s 不返回，SIGALRM 终止）"
    verdict: "平台能力缺失（OHOS 无 robust futex/mutex 支持），上游用例依赖的语义在平台上不存在，非 mmlib 代码缺陷"
    evidence: "probe2: WARN + ENOTSUP(95) + 父进程 lock 挂死（signal 14）；config.h 无 HAVE_PTHREAD_MUTEX_CONSISTENT"
  - category: allocation                # 1 用例
    count: 1
    cases:
      - allocation:aligned_heap_allocation_error
    sample_failure: "allocation:aligned_heap_allocation_error: Assertion 'mm_get_lasterror_number() == 12' failed"
    reason: "OHOS posix_memalign(8, SIZE_MAX) 返回 0 且置空指针、不设 ENOMEM（违反 POSIX 错误语义；探针直连构建产物：ptr=0 lasterr=0），上游期望 ENOMEM(12)"
    verdict: "平台 libc 语义缺陷，非 mmlib 代码缺陷"
    evidence: "probe2: mm_aligned_alloc(SIZE_MAX) ptr=0 lasterr=0（非 12）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_mmlib_api.c
    description: "链接 mmlib::mmlib 真实调用公开 API（aligned_alloc 64B 对齐+读写 / gettime 单调时钟+sleep 推进 / mutex init·lock·trylock·unlock·deinit / setenv·getenv·unsetenv 往返 / unlink+last-error 状态，19 项检查）"
    command: "./test_mmlib_api"
  - file: test_ohos_platform.c
    description: "鸿蒙特有：包内 libmmlib.so 平台 ABI 实测（ELF64/小端/ET_DYN/EM_AARCH64/PT_DYNAMIC/PT_LOAD）+ OHOS 加载器 dlopen(RTLD_NOW)、6 个契约符号 dlsym、经 loader 调用 mm_gettime、dladdr 路径确认（19 项检查）"
    command: "./test_ohos_platform <pkg>/lib/libmmlib.so"
  - file: test_mmlib_e2e.c
    description: "消费者最小应用管线（E2E）：配置流（setenv/getenv/unsetenv 往返）+ mm_ipc_connected_pair/fork 跨进程数据管线（64 项对齐载荷双向收发、回传校验和逐项核对、子进程退出码）+ mmap/MM_THR_PSHARED 跨进程互斥计数（父 500 + 子 500 = 1000 核对，16 项检查）"
    command: "./test_mmlib_e2e"

# 测试检查总数：test_package 54 项（19+19+16）；上游 5 个注册测试程序在构建期真机执行
assertion_count: 54

# ── 实测结果（OHOS aarch64 真机，feat/mmlib-1.4.2，2026-10-03）─────────
