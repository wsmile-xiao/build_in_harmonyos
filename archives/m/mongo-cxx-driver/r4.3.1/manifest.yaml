software: mongo-cxx-driver
build_system: cmake
# 文件位置: archives/m/mongo-cxx-driver/r4.3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "r4.3.1"

status: built

build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/mongodb/mongo-cxx-driver/archive/refs/tags/r4.3.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DBUILD_VERSION=r4.3.1"
    - "-DENABLE_TESTS=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DBSONCXX_POLY_USE_IMPLS=ON"
  dependencies:
    - "mongo-c-driver/2.3.0"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "mongo-cxx-driver r4.3.1需要mongo-c-driver >= 2.3.0，与1.x版本的C驱动不兼容"
  - "BUILD_VERSION必须通过-DBUILD_VERSION=r4.3.1显式指定，因为从tarball构建时没有git仓库信息"
  - "mongo-c-driver 2.3.0的库文件名是libbson2.so和libmongoc2.so（不同于1.x的libbson-1.0.so和libmongoc-1.0.so）"
  - "cmake --install比make install更可靠，因为后者可能触发重新configure导致失败"