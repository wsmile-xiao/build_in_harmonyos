software: mp3gain
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Sound-Linux-More/mp3gain/archive/refs/tags/1.6.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: makefile

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"
    - "CFLAGS=-Wall -DHAVE_MEMCPY -fPIC -O2 -I/storage/Users/currentUser/usr/local/include"
    - "LDFLAGS=-L/storage/Users/currentUser/usr/local/lib -Wl,-rpath,/storage/Users/currentUser/usr/local/lib"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - mpg123/1.32.9

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile-add-PREFIX-DESTDIR-support.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "mp3gain使用简单Makefile而非autotools，无configure脚本"
  - "mp3gain依赖libmpg123，需先编译安装mpg123"
  - "HMDFS文件系统umask 077导致config.status创建临时文件失败（E011），需替换为umask 022"
  - "mp3gain Makefile需修改以支持PREFIX/DESTDIR模式"
