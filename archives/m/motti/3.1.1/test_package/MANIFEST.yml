# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: motti/3.1.1
homepage: "https://www.gnu.org/software/motti/"

# 上游测试清点（R51）：上游注册 make check 测试驱动 TESTS = testmotti
# （otti/Makefile.am，bin_PROGRAMS 中的 testmotti），
# testmotti.cpp 的 launchTest() 含 JSON 解析演示与登录/会话/持久化服务演练，
# 但六个 *Test 类的 testAll() 调用全部被上游注释，程序恒 return 0：
# 注册的测试程序无断言，"通过"仅代表退出码为 0。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: otti/testmotti.cpp
    source: motti-3.1.1/otti/testmotti.cpp
    description: "make check 注册的测试驱动：JSON 解析演示 + 登录/会话/持久化服务演练（无断言，恒返回 0）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：链接 libmottifram，调用 Board/Case/Player 公开 API，8 项行为断言决定退出码（尺寸构造、Case 属性与类型设置器往返、setCase/getCaseNoThrow、越界 nullptr、JSON 导出非空）。Board(json) 往返构造因上游 2014 年 JSON 解析缺陷段错误，未纳入断言，已在 notes.md 记录"
    command: "./test_motti"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
