package: moarvm/2025.11
homepage: "https://www.moarvm.org/"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"
upstream_tests:
  - name: "MoarVM check.todo bytecode test suite"
    source: "check.todo and tools/check.mk"
    command: "make test"

test_package_tests:
  - file: "test.sh"
    description: "Execute packaged moar and validate its official version and help interfaces"
    command: "zsh test.sh"
  - file: "test_affinity.c"
    description: "Exercise bundled libuv get/set affinity paths changed by the OHOS patch"
    command: "test_affinity"

assertion_count: 4
