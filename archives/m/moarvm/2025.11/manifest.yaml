version: "2025.11"
software: "moarvm"
status: built
build_date: "2026-08-19"
build_system: custom

source:
  url: "https://www.moarvm.org/releases/MoarVM-2025.11.tar.gz"
  sha256: "dce1e7aa90cf5d4cef0fdb90a096d69954021bcdef1d3cc67b2109bb66d54f5b"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "--os=linux"
    - "--compiler=clang"
    - "--relocatable"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-libuv-ohos-affinity.patch"

knowledge_gained:
  - "MoarVM 官方 release tarball 自带 libuv、libtommath、dyncall 等第三方源码，无外部 Conan 依赖"
  - "OHOS musl 缺少 pthread_getaffinity_np/pthread_setaffinity_np，内置 libuv 应走 sched affinity 分支"
  - "MoarVM 使用 Perl Configure.pl 加 make 的自定义构建系统"
