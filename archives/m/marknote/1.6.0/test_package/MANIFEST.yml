package: marknote/1.6.0
homepage: "https://invent.kde.org/office/marknote"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: src/autotests/navigationcontrollertest.cpp
    source: marknote-1.6.0/src/autotests/navigationcontrollertest.cpp
    description: "NavigationController unit tests"
    command: "ctest -R navigationcontrollertest --output-on-failure"
  - file: src/autotests/nestedlisthelpertest.cpp
    source: marknote-1.6.0/src/autotests/nestedlisthelpertest.cpp
    description: "NestedListHelper unit tests"
    command: "ctest -R nestedlisthelpertest --output-on-failure"
  - file: src/autotests/notebooksmodeltest.cpp
    source: marknote-1.6.0/src/autotests/notebooksmodeltest.cpp
    description: "NotebooksModel unit tests"
    command: "ctest -R notebooksmodeltest --output-on-failure"
  - file: src/autotests/maildirimporttest.cpp
    source: marknote-1.6.0/src/autotests/maildirimporttest.cpp
    description: "Maildir import tests"
    command: "ctest -R maildirimporttest --output-on-failure"

test_package_tests:
  - file: test.sh
    description: "Verify marknote binary exists and responds to --help with offscreen platform"
    command: "./test.sh"

assertion_count: 4
