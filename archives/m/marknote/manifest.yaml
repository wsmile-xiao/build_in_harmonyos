software: marknote
display: "MarkNote"
description: "Simple markdown note management app (KDE)"
category: office
homepage: "https://invent.kde.org/office/marknote"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_MIN_VERSION lowered to 6.18 for published frameworks"
    - "KirigamiAddons made optional and guarded"
    - "KRunner/KCrash disabled for OHOS"
  common_dependencies:
    - qtbase
    - kirigami
    - kcoreaddons
    - ecm

versions:
  "1.6.0":
    status: built
    build_date: "2026-09-09"
