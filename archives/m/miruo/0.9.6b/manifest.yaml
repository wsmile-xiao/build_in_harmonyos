# miruo 0.9.6b — 版本级 manifest（遵循 ARCHIVE-SPEC v2.0）

version: "0.9.6b"
ref: "miruo/0.9.6b"
status: built
build_date: 2026-09-20
binary: false
sha256: "0b31a5bde5b0e92a245611a8e671cec3d330686316691daeb1de76360d2fa5f1"
upstream:
  homepage: "https://github.com/KLab/miruo"
  license: "GPL-3.0-or-later"
  build_system: autotools
  test_count: 0  # upstream has NO test suite (make check is an automake no-op)

description: |
  KLab 终端交互流量监控工具（tcpdump 类 CLI，基于 libpcap，统计终端窗口尺寸
  变化与网络吞吐）。miruo.c + lnklist.c 两个源文件，autoconf 2.67 构建，
  默认安装到 sbin/。

build:
  system: autotools
  generator: AutotoolsToolchain + AutotoolsDeps
  flags:
    configure_args:
      - "--sbindir=${prefix}/bin"  # upstream sbin_PROGRAMS -> conan bin/
    make_args: ["-j1"]  # R9: HMDFS jobserver fifo EPERM (E074)

dependencies:
  runtime:
    - libpcap/1.10.6
  hmofs_notes: "libpcap 包内仅 libpcap.a（静态链入），产物 NEEDED 仅 libc.so"

ohos_adaptation:
  patch_count: 1
  patches:
    - file: patches/0001-configure.patch
      type: platform
      knowledge: E011
      description: |
        configure 创建 config.status 临时目录的代码块 umask 077 → umask 022。
        HMDFS 强制 setgid，`umask 077 && mktemp -d` 产生 drwx--S--- 目录，
        即使属主也不可写，config.status 无法创建 subs1.awk 报
        "can't create ./confXXXX/subs1.awk: Permission denied"。
  non_patch_notes:
    - "AC_PROG_CC 探测列表（gcc/cc/cl.exe）不含 clang，profile 经 AutotoolsToolchain 传 CC=clang 即可，无需 patch"
    - "上游 0.9.6b tag tarball 的 configure 未重新生成（内嵌版本串 0.9.6a），`miruo -V` 报 0.9.6a，属上游打包缺陷，不 patch"
    - "/proc/self/statm 在 HarmonyOS PC 上存在且可读（本地已验证）"

test_package:
  upstream_tests: 0
  upstream_tests_note: "上游无测试套件：无 tests/ 目录，`make check` 为 automake 空操作（输出仅 1 行退出 0），CI 也无测试步骤"
  ohos_specific_tests: 1
  ohos_specific_tests_detail:
    - test_package/test_ohos.sh — ELF64/AArch64/PIE、.interp=musl、无 RPATH/RUNPATH、动态依赖仅 libc.so、OHOS ELF 标记（.codesign/.note.ohos.ident）、无本机构建路径泄漏、`miruo -V`/`-h`/`-i nonexist0` 真实运行行为与退出码
  runner: test_package/conanfile.py test()（bash 直接执行 test_ohos.sh，ohc-run.py 可复用同一脚本）
  result: "conan create (ohos-aarch64) rc=0；OHOS ASSERTIONS PASSED: 9/9"

knowledge_base:
  path_a_used:
    - "E011 — configure umask 077 临时目录不可写（已覆盖，patch 直接引用）"
    - "E074 — make 并行 jobserver fifo EPERM（已覆盖，make -j1）"
  path_b_new: none  # 无新增 HarmonyOS 共性问题；两个问题均被现有知识库条目覆盖
  path_b_new_note: |
    全程仅命中已覆盖的 E011/E074，未出现未覆盖且具跨库复用价值的新问题，
    按要求未硬凑路径 B，未新增知识库条目。
