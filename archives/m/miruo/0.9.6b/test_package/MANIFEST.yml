# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在
# R51 上游测试三步法：清点 -> 运行 -> 如实回填

package: miruo/0.9.6b
homepage: "https://github.com/KLab/miruo"

# ── 上游测试清点结论（R51 第一步）─────────────────────────────
# 源码包内无 tests/ 与 test/ 目录；Makefile.am 无 TESTS 段；
# `make check` 为 automake 空操作（实际输出仅 "make: Nothing to be done
# for 'check'" 一行，退出码 0，无任何测试运行）；.travis.yml 仅含
# build，无 test 步骤。清点命令与实测输出见 notes.md 的「测试」一节。
# 结论：上游没有官方自动化测试，因此 upstream_tests 为空列表（已核对，
# 不是未填写的占位符）。
upstream_check_command: "make check（automake 空操作：Nothing to be done for 'check'，无测试运行）"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── test_package 自带测试（消费者视角，均真实执行被测二进制）──
test_package_tests:
  - file: test_ohos.sh
    description: "鸿蒙特有测试（9 条断言）: ELF64/AArch64/PIE、.interp=/lib/ld-musl-aarch64.so.1（musl）、无 RPATH/RUNPATH、动态依赖仅 libc.so（libpcap 静态链入）、OHOS ELF 标记（.codesign/.note.ohos.ident）、二进制内无构建机绝对路径、`miruo -V` 版本横幅（上游缺陷打印 0.9.6a，断言格式而非数字）、`miruo -h` 用法、`miruo -i nonexist0` pcap 错误路径优雅退出 rc=1"
    command: "bash test_ohos.sh <pkg>/bin/miruo"
    assertions: 9

# 测试断言总数 = 鸿蒙特有 9
assertion_count: 9

# 其中鸿蒙平台特有测试用例数（ELF/ABI、平台能力缺口、OHOS 约束等）
ohos_specific_assertions: 9
