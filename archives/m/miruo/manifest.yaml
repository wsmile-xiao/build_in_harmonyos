# 软件级 manifest — miruo
# 遵循 ARCHIVE-SPEC v2.0

software: miruo
display: "miruo (KLab terminal traffic monitor)"
description: "KLab 终端交互流量监控工具（tcpdump 类 CLI，基于 libpcap，显示终端窗口尺寸变化/网络吞吐）"
category: network-utility
homepage: "https://github.com/KLab/miruo"
license: GPL-3.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "E011: configure 中 config.status 临时目录 umask 077 → 022（HMDFS setgid 目录不可写），patch 0001"
    - "autoconf 2.67 的 AC_PROG_CC 探测列表无 clang（gcc/cc/cl.exe），conan 传 CC=clang 即可，无需 patch"
    - "sbin_PROGRAMS 安装到 sbin/；conan 包统一用 bindirs（configure --sbindir=${prefix}/bin 重定向）"
    - "上游 0.9.6b tag tarball 的 configure 未重新生成（内嵌版本串 0.9.6a），`miruo -V` 报 0.9.6a 属上游打包缺陷，非适配问题，不打补丁"
    - "libpcap/1.10.6 静态链入（包内仅 libpcap.a），产物 NEEDED 仅 libc.so"
  common_dependencies:
    - libpcap

versions:
  "0.9.6b":
    status: built
    build_date: 2026-09-20
    notes: "ohos-aarch64 conan create 通过；1 个补丁（configure umask 077）；上游无测试套件（0 上游测试）；1 个 OHOS 专项测试 test_ohos.sh"
