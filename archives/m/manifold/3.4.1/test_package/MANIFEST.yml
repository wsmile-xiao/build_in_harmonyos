# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: manifold/3.4.1
homepage: "https://github.com/elalish/manifold"

# ── 上游测试：已在包构建中真实编译并执行 ────────────────────────────────
# 上游 MANIFOLD_TEST=ON 通过 gtest_discover_tests(manifold_test) 将每个
# GTest 用例注册为独立 ctest 条目（*nix 分支，每个用例一条 add_test）。
# 本配方的 build() 先全量构建（含测试可执行文件），再执行：
#   ctest --output-on-failure
# 失败即抛（cmake.test()）；discovered 统计自 gtest_discover_tests 生成的
# "<target>[N]_tests.cmake" 发现文件中的 add_test() 条目数（等价 ctest -N
# 总数），随后 emit HMBS_UPSTREAM_TEST_RESULT 并持久化到包 res/ 供缓存命中
# 复射。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# ── 分母（与官方口径一致：每个 GTest 用例 = 1 个 ctest 条目）────────────
# 真机预检在官方同源环境中以 MANIFOLD_TEST=ON 全量构建并 ctest 发现，
# “100% tests passed, 0 tests failed out of 318”，即官方口径下实际注册的
# ctest 用例总数为 318（gtest_discover_tests 逐个 add_test 注册）。
# 早期静态手盘（TEST/TEST_F 宏 + 多边形语料 RegisterTest）曾估为 321，
# 与真机 ctest 实测 318 差 3，以真机实际注册数为准（应为少数语料条目不
# 以独立 ctest 用例落地）。discovered/passed 均取自 build() 内真实运行的
# ctest 结果，二者一致时通过率为 100%。
upstream_test_total: 318
upstream_test_count_method: ctest_entries

upstream_tests:
  - suite: 静态 GTest（manifold_test 各源文件）
    cases: 212
    delivered_config: compiled
    source: "test/{properties,manifold,boolean,sdf,smooth,hull,samples,boolean_complex,cross_section,manifoldc}_test.cpp"
  - suite: 多边形语料（RegisterTest 数据驱动，test/polygons/*.txt）
    cases: 109
    delivered_config: compiled
    source: "test/polygons/{polygon_corpus,sponge,zebra,zebra3}.txt（polygon_test.cpp RegisterPolygonTests 逐条注册）"
# 注：以上 cases 为源码级静态估算（212+109=321）；官方口径下以 gtest_discover_tests
# 在真机实际注册的 ctest 条目总数为准（“100% tests passed, 0 tests failed out of 318”），
# 故 upstream_test_total 取 318（差 3 为少数语料条目不落地为独立 ctest 用例，以真机为准）。

# test_package 中自带的测试 (消费者视角验证；同一 conan create 内执行)
# 实测结果待真机预检回填（首轮仅完成工作树）。
test_package_tests:
  - file: test_manifold.cpp
    description: "C++ 消费者: Cube/Sphere/CrossSection 构造 + Status/Volume/Area 断言（5 项）"
    command: "./test_manifold"
    result: "待真机预检回填"

# 测试断言总数 (test_package 自带消费者测试)
# test_manifold.cpp: 5 项 CHECK 断言
assertion_count: 5
