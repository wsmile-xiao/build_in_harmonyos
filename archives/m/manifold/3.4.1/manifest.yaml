# 版本级 manifest —— manifold 3.4.1
# 遵循 ARCHIVE-SPEC v2.0

version: "3.4.1"
software: manifold

# 已通过真机(conan create + 上游测试)预检；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-25"
build_system: cmake

source:
  url: "https://github.com/elalish/manifold/archive/refs/tags/v3.4.1.tar.gz"
  sha256: "48cb6f5022c19368b582caf0f346c713740799bf1bc7339b2e9320d0c807053a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "MANIFOLD_TEST=ON / CROSS_SECTION=ON / CBIND=ON / PAR=OFF / PYBIND=OFF / STRICT=OFF"
    - "MANIFOLD_DOWNLOADS=OFF（依赖由 Conan 提供：gtest/1.17.0.2、clipper2/2.0.1）"
    - "不强制 CMAKE_SYSTEM_NAME（区别于 clipper2）：manifold 需 gtest_discover_tests 构建期运行测试二进制，强制系统名会误判交叉编译禁用用例发现"
  dependencies:
    - clipper2/2.0.1
  test_dependencies:
    - gtest/1.17.0.2（仅构建/测试期，visible=False 不进消费者依赖）
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "manifold 默认经 FetchContent git clone 拉取 GTest/Clipper2，OHOS 真机无法 git clone GitHub，须 MANIFOLD_DOWNLOADS=OFF 并由 Conan 提供依赖"
  - "CrossSection 的 Clipper2 为 PRIVATE 链接（pimpl 隔离，公共头不暴露 Clipper2 类型），但对静态库消费者仍须经 cpp_info.requires 传播以便链接"
  - "上游测试由 gtest_discover_tests 注册为 ctest 用例；多边形测试为数据驱动（polygon_corpus/sponge/zebra 等语料经 RegisterTest 动态注册），真机 ctest 实测注册 318 个 ctest 条目（ctest_entries 口径，100% passed out of 318；早期静态估 321 与实测差 3，以真机为准）"
