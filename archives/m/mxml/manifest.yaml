software: mxml
# 软件级 manifest 模板
# 文件位置: archives/m/mxml/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名（小写）
name: mxml

# 显示名
display: Mini-XML

# 软件描述
description: "小型 XML 库，用于读取和写入 XML 及 XML-like 数据文件，无需依赖大型非标准库"

# 软件分类
# foundation | toolchain | compress | ssl | db | network | advanced | doc | xml
category: xml

# ============================================================
# 官方信息
# ============================================================

# 官方网站
website: "https://www.msweet.org/mxml/"

# 源码仓库
repository: "https://github.com/michaelrsweet/mxml"

# 许可证
license: Apache-2.0

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表（从版本级 manifest.yaml 自动汇总）
versions:
  - version: "4.0.4"
    status: published
    build_date: "2026-06-08"
    build_system: autotools
    patches_count: 3

# ============================================================
# 构建信息
# ============================================================

# 构建系统类型
build_system: autotools

# 编译依赖列表
dependencies: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中发现的通用问题（L1/L2级知识）
platform_issues:
  - issue_id: E007
    description: "config.guess 无法识别 HarmonyOS 系统"
    solution: "使用 patch-autotools-ohos.pl 打补丁"

  - issue_id: E072
    description: "config.sub 三元组验证失败"
    solution: "在 kernel-os 白名单中添加 linux-ohos*"

  - issue_id: E011
    description: "HMDFS 文件系统 umask 077 权限问题"
    solution: "修改 configure 中 umask 077 为 umask 000"

# ============================================================
# 元数据
# ============================================================

# 最后更新日期
last_updated: "2026-06-08"

# 维护者
maintainer: "AI Agent"