package: mxml/4.0.6
homepage: "https://www.msweet.org/mxml/"
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test (three registered file/string/descriptor comparison groups)"
upstream_tests:
  - file: "Makefile.in"
    source: "Mini-XML 4.0.6 release"
    description: "Stdio file round trip via testmxml"
    command: "make test"
  - file: "Makefile.in"
    source: "Mini-XML 4.0.6 release"
    description: "String round trip via testmxml"
    command: "make test"
  - file: "Makefile.in"
    source: "Mini-XML 4.0.6 release"
    description: "File descriptor round trip via testmxml"
    command: "make test"
test_package_tests:
  - file: "consumer.c"
    description: "Installed mxml4 header and library parse, find, and serialize XML"
    command: "./consumer"
assertion_count: 4
