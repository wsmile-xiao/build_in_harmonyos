software: mupdf-tools
version: "1.27.2"
status: built
build_date: "2026-05-18"

source:
  url: "https://github.com/ArtifexSoftware/mupdf/archive/refs/tags/1.27.2.tar.gz"
  sha256: "8bf3b85ac6d3af1baea67efe4c27fb5b01306c59b6c055d47f1360c7e002d30a"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "HAVE_X11=no"
    - "HAVE_GLUT=no"
    - "shared=no"
    - "build=release"
    - "HAVE_OBJCOPY=no"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "MuPDF使用自定义Makefile，不需要configure步骤"
  - "GitHub archive不含thirdparty子模块，需在conanfile.py source()中单独下载精确commit"
  - "第三方库版本必须与mupdf tag引用的精确commit一致，否则链接错误(hb-paint等)"
  - "通过GitHub API获取子模块精确commit SHA: GET /repos/ArtifexSoftware/mupdf/contents/thirdparty/{dir}?ref=1.27.2"
  - "clang 15.0.4可编译21MB大型字体C文件(DroidSansFallbackFull.ttf.c)，无需DTOFU选项"
  - "muraster属于extra-apps，需要make extra-apps单独构建"
  - "MuPDF内嵌所有依赖(thirdparty目录)，无外部编译依赖"
  - "不使用DTOFU选项，完整字体支持，不裁剪"
  - "conanfile.py build()需设置cwd=self.source_folder且确保bash在PATH中"