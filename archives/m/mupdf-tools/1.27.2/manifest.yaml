software: mupdf-tools
version: "1.27.2"
status: built
build_date: "2026-05-18"

source:
  url: "https://mupdf.com/downloads/archive/mupdf-1.27.2-source.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "HAVE_X11=no"
    - "HAVE_GLUT=no"
    - "HAVE_CURL=no"
    - "shared=no"
    - "build=release"
    - "XCFLAGS=-DTOFU_CJK -DTOFU -DTOFU_NOTO -DTOFU_SIL -DFZ_ENABLE_HYPHEN=0"
    - "HAVE_OBJCOPY=no"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "MuPDF使用自定义Makefile，不需要configure步骤"
  - "编译大型嵌入式字体文件(DroidSansFallback.ttf.c)会导致clang崩溃，需用DTOFU选项禁用"
  - "DTOFU_CJK/DTOFU/DTOFU_NOTO/DTOFU_SIL选项可禁用大型字体，避免编译器崩溃"
  - "muraster属于extra-apps，需要手动安装或make extra-apps"
  - "MuPDF内嵌所有依赖(thirdparty目录)，无外部编译依赖"