# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: minised/1.16
homepage: "https://exactcode.com/opensource/minised/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check CC=<cc>"

# 上游实际运行的测试程序
# minised ships a tests/ suite driven by tests/run, which feeds every
# tests/*.sed program through the built minised and diffs against tests/*.out.
upstream_tests:
  - file: "tests/run"
    description: "Shell harness iterating over tests/*.sed, comparing minised output to tests/*.out"
    cases: 68
    passed: 66
    failed: 1
    skipped: 0
    failure_detail: |
      - empty-lhs: NEGATIVE test (no .out file; expects non-zero exit).
        Reported as "Failed (as expected)" — NOT a real failure, not counted in 1 failed.
      - w2: "Failed !!!". Root cause = harness artifact, NOT a minised bug.
        w2.sed writes one line to /dev/stderr via the `w` command; the harness
        captures with `> $tmp 2>&1` (merges streams), so the stderr line lands
        out-of-order vs w2.out. Verified: minised stdout alone matches w2.out
        minus the stderr line; minised stderr alone carries exactly that line.
        minised's stream routing is correct; only the harness merge is wrong.

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test_minised.sh"
    description: "Runs the packaged minised on real inputs: substitution (s/world/OpenHarmony/), line deletion (d), Kleene-star regex, and backreference (&)."
    command: "sh test_minised.sh <package_folder>/bin/minised"
    cases: 5
    passed: 5
    failed: 0

# 测试断言总数 (用于质量评估)
assertion_count: 5
