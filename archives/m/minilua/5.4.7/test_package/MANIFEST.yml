# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: minilua/5.4.7
homepage: "https://github.com/edubart/minilua"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -n test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make -j1 test"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/example.c
    source: minilua-5.4.7/tests/example.c
    description: "嵌入式 Lua API 示例：创建状态、打开标准库、执行 Lua 字符串并关闭状态。"
    command: "./example"
  - file: tests/lua.c
    source: minilua-5.4.7/tests/lua.c
    description: "启用 LUA_MAKE_LUA 的命令行解释器，执行 -e 表达式。"
    command: "./lua -e \"print 'hello world'\""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过 CMake 引入头文件，执行 Lua 表达式并校验整数、字符串和状态机结果。"
    command: "./test_minilua"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
