software: minilua
display: "MiniLua"
description: "Single-header port of the Lua scripting language"
category: library
homepage: "https://github.com/edubart/minilua"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Header-only package: install minilua.h without producing a library binary"
    - "Consumers define LUA_IMPL in exactly one translation unit"
    - "Consumer helper names must avoid collisions with implementation internals"
  common_dependencies: []

versions:
  "5.4.7":
    status: built
    build_date: "2026-09-02"
    conan_ref: "minilua/5.4.7"
