package: muparserx/4.0.12
homepage: "https://beltoforion.de/en/muparserx/"

# Upstream unit-test suite is embedded in the library source tree
# (parser/mpTest.cpp + parser/mpTest.h, driven by ParserTester).
# It is compiled in and run by sample/example.cpp SelfTest(); it is not a
# standalone CTest target, so upstream_check_command is empty.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - id: value_types
    file: parser/mpTest.cpp
    description: "Parser value types"
  - id: implicit_def
    file: parser/mpTest.cpp
    description: "Implicit definition of undefined variables"
  - id: error_codes
    file: parser/mpTest.cpp
    description: "Error codes"
  - id: sample_equations
    file: parser/mpTest.cpp
    description: "Sample equations"
  - id: if_else
    file: parser/mpTest.cpp
    description: "If-else conditional"
  - id: string_fun
    file: parser/mpTest.cpp
    description: "String functions"
  - id: matrix
    file: parser/mpTest.cpp
    description: "Matrix calculations"
  - id: complex
    file: parser/mpTest.cpp
    description: "Complex calculations"
  - id: vector
    file: parser/mpTest.cpp
    description: "Vector operations"
  - id: binop
    file: parser/mpTest.cpp
    description: "Binary operators"
  - id: postfix
    file: parser/mpTest.cpp
    description: "Postfix operators"
  - id: infix
    file: parser/mpTest.cpp
    description: "Infix operators"
  - id: multiarg
    file: parser/mpTest.cpp
    description: "Multiarg functions"
  - id: script
    file: parser/mpTest.cpp
    description: "Script features"
  - id: valreader
    file: parser/mpTest.cpp
    description: "Value reader"
  - id: issue_reports
    file: parser/mpTest.cpp
    description: "GitHub issue reports"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer link + expression parse/eval API test"
    command: "./test_package"
  - file: harmony_special_test.cpp
    description: "HarmonyOS special test: __OHOS__ macro + expr eval + variables + ParserError path"
    command: "./harmony_special_test"

assertion_count: 5
