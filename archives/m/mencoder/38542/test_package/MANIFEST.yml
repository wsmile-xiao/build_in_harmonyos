package: mencoder/38542
homepage: "https://mplayerhq.hu/"

# 上游测试入口: Makefile 的 `tests` 目标 = codec-cfg-test + codecs2html (+ libvo/aspecttest)
upstream_check_command: "make -n tests"
upstream_test_in_build: true
upstream_test_command: "make -j<N> codec-cfg-test codecs2html && ./codec-cfg-test && ./codecs2html"

upstream_tests:
  - file: codec-cfg-test
    source: mplayer-1.5+svn38542/codec-cfg.c
    description: "Parses codecs.conf and validates every codec entry (468 video + 226 audio); non-zero exit on any parse failure"
    command: "./codec-cfg-test"
  - file: codecs2html
    source: mplayer-1.5+svn38542/codecs2html.c
    description: "Reads codecs.conf through the codec-cfg parser and renders the codec matrix as HTML; non-zero exit on parse failure"
    command: "./codecs2html"

# 上游 `make tests` 目标中另外两个程序不适用于本包，构建期已排除:
#   - libvo/aspecttest: 覆盖 mplayer 视频输出子系统 libvo，本配方 --disable-mplayer 不构建 libvo
#     (产出的 mencoder 二进制中无 aspect_* / vo_rotate 符号)
#   - make fatetest (FATE): 需要 mplayer 二进制与外部 FATE_SAMPLES 样本集，本配方只构建 MEncoder

test_package_tests:
  - file: test.sh
    description: "Consumer test: run the installed MEncoder option parser and encode a raw I420 frame to MPEG-4 AVI (lavc)"
    command: "bash test.sh"
  - file: test_ohos.sh
    description: "HarmonyOS-specific consumer test: AArch64 ABI, .note.ohos.ident, musl loader, no glibc dependency, real run"
    command: "bash test_ohos.sh"

# test.sh 3 项断言 + test_ohos.sh 5 项检查
assertion_count: 8
