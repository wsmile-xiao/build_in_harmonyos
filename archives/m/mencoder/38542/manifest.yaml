# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/38542/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "38542"

# 软件名
software: "mencoder"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: "custom-configure-make"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 官方归档的 pristine orig tarball =
  # 官方 SVN r38542 的 svn export 快照，不含 debian/ 打包目录）
  url: "https://snapshot.debian.org/archive/debian/20240606T144219Z/pool/main/m/mplayer/mplayer_1.5+svn38542.orig.tar.xz"

  # 源码校验和
  sha256: "464977a109321c4d9c6e8c7f6281f1b0756551f85e3e4f808c9bee45d266f2ae"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom-configure-make

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 MPlayer 的 `make tests` 目标含 codec-cfg-test / codecs2html / libvo/aspecttest 三个程序；--disable-mplayer 配置下前两者仍可构建执行（解析 codecs.conf：226 audio + 468 video），可纳入 build() 作上游测试，aspecttest 属 mplayer 的 libvo 子系统不适用（ref: test_package/MANIFEST.yml）"
  - "鸿蒙专项消费者测试 test_ohos.sh 用 .note.ohos.ident 段做 OHOS 二进制标识断言（glibc/Linux 构建无此段），并以 PT_INTERP=ld-musl-aarch64.so.1 + DT_NEEDED 无 libc.so.6 做平台一致性检查（ref: reports/test-report.md）"
  - "消费者测试 test.sh 使用 16x16 I420 原始帧执行 lavc MPEG-4 AVI 编码冒烟，验证实际编码路径而非仅 CLI 打印（ref: reports/test-report.md）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
