# conandata.yml — mencoder 38542
# 源码来源：Debian 官方归档中的 pristine orig tarball（由 Debian 打包流程执行官方 SVN
# 的 `svn export -r 38542` 生成；解包后单根目录 mplayer-1.5+svn38542/ 且不含 debian/
# 打包目录，内容等同于官方 svn://svn.mplayerhq.hu/mplayer/trunk 的 r38542 快照）。
#
# 下载端点选用 Debian snapshot 服务的 Cloudflare CDN 前端（snapshot-cloudflare.debian.org），
# 与 snapshot.debian.org 同源同字节（sha256 一致），但 CDN 分发稳定、不触发源站限速：
# CI worker 从源站直连下载会在超时预算内失败（实测），CDN 端点则秒级完成。
sources:
  url: "https://snapshot-cloudflare.debian.org/archive/debian/20240606T144219Z/pool/main/m/mplayer/mplayer_1.5+svn38542.orig.tar.xz"
  sha256: "464977a109321c4d9c6e8c7f6281f1b0756551f85e3e4f808c9bee45d266f2ae"
ffmpeg:
  url: "https://ffmpeg.org/releases/ffmpeg-6.1.6.tar.xz"
  sha256: "d4fcb164028dd3beee5d92c0ac72e46aac6973c75ea12dc14de07bf8f407370a"
patches: {}
