# 软件级 manifest — mencoder
# 遵循 ARCHIVE-SPEC v2.0

software: mencoder
display: "MEncoder"
description: "MPlayer 项目自带的命令行音视频编码/转码工具"
category: media
homepage: "https://www.mplayerhq.hu/"
license: GPL-2.0-or-later
build_system: custom-configure-make

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "只交付 MEncoder 命令行工具：--disable-mplayer --disable-gui --disable-x11 --disable-networking，不构建播放器主体与 libvo 视频输出子系统"
    - "内嵌 FFmpeg 主线与 r38542 旧 API 不兼容（sample_fmts 等已删除），必须固定使用可获取的 FFmpeg 6.1.6 单独配置构建"
    - "FFmpeg 需一并禁用网络（--disable-network），否则 MEncoder 禁用网络后仍残留网络对象符号导致链接失败"
    - "上游 svn:// 源码在 CI 不可复现（CI 无 svn 客户端），改用同一 revision 的发行版官方归档 pristine orig tarball（HTTP + SHA256）"
    - "上游 Makefile 的 tests 目标中 codec-cfg-test / codecs2html 在 --disable-mplayer 配置下仍可用，应纳入构建期测试；libvo/aspecttest 与 FATE 不适用"
  common_dependencies:
    - "ffmpeg（源码内置，固定版本）"

# ============================================================
# 版本索引
# ============================================================

versions:
  "38542":
    status: built
    build_date: "2026-09-15"
    notes: "首次适配（MPlayer SVN r38542）；上游测试 codec-cfg-test + codecs2html 纳入构建期执行，新增 3 个消费者/鸿蒙平台测试用例"
