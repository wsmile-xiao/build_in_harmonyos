sources:
  # 上游官方 GitHub 仓库 tag minimodem-0.24-1 的自动打包 tarball（release 页无
  # dist 资产，git tag 是上游 0.24 的权威发布点，git ls-remote 实证 17e17b78）
  url: "https://github.com/kamalmostafa/minimodem/archive/refs/tags/minimodem-0.24-1.tar.gz"
  sha256: "812611a880008c86086c105683063076176e87115490f8c266a0e25f9e27719f"
patches:
  - patch_file: "patches/0001-fftw-double-precision.patch"
    patch_description: "FFTW3 单精度(fftw3f)适配为双精度(fftw3)：ohpcd 制品仓只发布双精度 FFTW3 构建（configure 无 --enable-single），configure.ac 的 deps_packages 与 src/fsk.{h,c} 的 fftwf_* API/缓冲类型机械替换为 fftw_*（float 样本→double 变换缓冲做显式逐点转换，幅值仍按 float 计算）"
    patch_type: "portability"
  - patch_file: "patches/0002-tests-bash-path-and-tmpdir.patch"
    patch_description: "上游测试脚本的鸿蒙可运行性：tests/ 下全部 30 个脚本（28 个 *.test + self-test + run-self-tests）的 #!/bin/bash 改为 OHOS 平台标准解释器显式路径 /data/service/hnp/bin/bash（10 处替换 + 20 个无 shebang 脚本新增；OHOS 无 /bin/bash 且 toybox sh 缺少 bash 特性，统一显式解释器不依赖 ENOEXEC 回退）；4 个脚本硬编码 /tmp 的临时文件改为 ${TMPDIR:-/tmp}（OHOS 根文件系统只读），配方在 build() 内把 TMPDIR 指到构建目录下可写目录。仅测试基础设施，无产品代码改动"
    patch_type: "portability"
  - patch_file: "patches/0003-tx-write-not-in-assert.patch"
    patch_description: "tx 音频写入不能依赖 assert()：上游 simpleaudio_tone() 里唯一的写调用在 assert(simpleaudio_write(...)>0) 内，conan Release 构建默认加 -DNDEBUG，assert 连同写入一起被编译掉，--tx 产出只有 44 字节头的空 WAV。改为无条件执行写入并在失败时报错退出（等价于上游非 NDEBUG 构建的 abort 语义）。实测修复前 28 个上游用例 26 个 FAIL（rx 收到空输入），修复后全部通过"
    patch_type: "bug fix"
