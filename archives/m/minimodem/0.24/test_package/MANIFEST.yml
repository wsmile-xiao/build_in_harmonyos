# test_package/MANIFEST.yml
# 上游官方测试声明文件
# minimodem 0.24 上游测试：tests/ 目录 28 个 *.test 脚本（automake 并行测试
# harness 注册，tests/Makefile.am `TESTS = @auto_find_tests@`，`make check`
# 驱动），除 16/17 两个发送一致性用例外，均经 tests/self-test 做
# --tx/--file WAV 生成 → --rx 解调 → cmp/阈值判定的往返自测。

package: minimodem/0.24
homepage: "https://github.com/kamalmostafa/minimodem"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游实际运行的测试脚本（28 个注册用例；描述取自各脚本实际命令行）
upstream_tests:
  - file: tests/01-self-test-1200.test
    source: minimodem-minimodem-0.24-1/tests/01-self-test-1200.test
    description: "1200 波特 ASCII 全文往返（self-test testdata-ascii.txt 1200）"
    command: "make check"
  - file: tests/02-self-test-300.test
    source: minimodem-minimodem-0.24-1/tests/02-self-test-300.test
    description: "300 波特 ASCII 全文往返"
    command: "make check"
  - file: tests/03-self-test-rtty.test
    source: minimodem-minimodem-0.24-1/tests/03-self-test-rtty.test
    description: "RTTY 45.45 波特（testdata-baudot.txt 波特码数据）往返"
    command: "make check"
  - file: tests/04-self-test-0.5.test
    source: minimodem-minimodem-0.24-1/tests/04-self-test-0.5.test
    description: "0.5 波特超低速 'KAMAL' 单词往返"
    command: "make check"
  - file: tests/05-self-test-12000.test
    source: minimodem-minimodem-0.24-1/tests/05-self-test-12000.test
    description: "12000 波特高速 ASCII 全文往返"
    command: "make check"
  - file: tests/06-self-test-float-samples.test
    source: minimodem-minimodem-0.24-1/tests/06-self-test-float-samples.test
    description: "--float-samples 采样格式 12000 波特往返"
    command: "make check"
  - file: tests/07-self-test-no-lut.test
    source: minimodem-minimodem-0.24-1/tests/07-self-test-no-lut.test
    description: "--lut=0（禁用查表）1200 波特往返"
    command: "make check"
  - file: tests/08-self-test-lut16.test
    source: minimodem-minimodem-0.24-1/tests/08-self-test-lut16.test
    description: "--lut=16（16 位查表）1200 波特往返"
    command: "make check"
  - file: tests/09-self-test-lut16-float.test
    source: minimodem-minimodem-0.24-1/tests/09-self-test-lut16-float.test
    description: "--lut=16 + --float-samples 1200 波特往返"
    command: "make check"
  - file: tests/10-verify-perfect.test
    source: minimodem-minimodem-0.24-1/tests/10-verify-perfect.test
    description: "-P 完美解调校验：1200 --samplerate 24000 -M 1200 -S 2400，断言 confidence=inf (rate perfect)"
    command: "make check"
  - file: tests/11-verify-perfect-nolut.test
    source: minimodem-minimodem-0.24-1/tests/11-verify-perfect-nolut.test
    description: "-P 完美解调 + --lut=0"
    command: "make check"
  - file: tests/12-verify-perfect-lut16.test
    source: minimodem-minimodem-0.24-1/tests/12-verify-perfect-lut16.test
    description: "-P 完美解调 + --lut=16"
    command: "make check"
  - file: tests/13-verify-perfect-nolut-float.test
    source: minimodem-minimodem-0.24-1/tests/13-verify-perfect-nolut-float.test
    description: "-P 完美解调 + --lut=0 + --float-samples"
    command: "make check"
  - file: tests/14-verify-perfect-lut16-float.test
    source: minimodem-minimodem-0.24-1/tests/14-verify-perfect-lut16-float.test
    description: "-P 完美解调 + --lut=16 + --float-samples"
    command: "make check"
  - file: tests/15-verify-perfect-float.test
    source: minimodem-minimodem-0.24-1/tests/15-verify-perfect-float.test
    description: "-P 完美解调 + --float-samples"
    command: "make check"
  - file: tests/16-verify-tx-consistent.test
    source: minimodem-minimodem-0.24-1/tests/16-verify-tx-consistent.test
    description: "发送一致性：1200 波特同一输入三次 --tx 的 WAV 经 md5sum -b 全等"
    command: "make check"
  - file: tests/17-verify-tx-consistent-float.test
    source: minimodem-minimodem-0.24-1/tests/17-verify-tx-consistent-float.test
    description: "发送一致性 + --float-samples（委托执行 16-verify-tx-consistent.test）"
    command: "make check"
  - file: tests/21-rate-slop.test
    source: minimodem-minimodem-0.24-1/tests/21-rate-slop.test
    description: "波特率容差：300 波特基率下 tx 速率 -8/-1/0/+1/+8% 偏移、rx 固定 300 解调"
    command: "make check"
  - file: tests/30-amplitude.test
    source: minimodem-minimodem-0.24-1/tests/30-amplitude.test
    description: "幅度阈值：--volume 3.50/1.00/0.30/0.01/极低 各轮 1200 波特往返（脚本内 5 个子轮）"
    command: "make check"
  - file: tests/31-amplitude-float.test
    source: minimodem-minimodem-0.24-1/tests/31-amplitude-float.test
    description: "幅度阈值 + --float（委托执行 30-amplitude.test）"
    command: "make check"
  - file: tests/40-noise.test
    source: minimodem-minimodem-0.24-1/tests/40-noise.test
    description: "噪声鲁棒性：--Xrxnoise 0.00/0.05/0.10/0.50 四轮 1200 波特（脚本内 4 个子轮）"
    command: "make check"
  - file: tests/41-noise-purefreqs.test
    source: minimodem-minimodem-0.24-1/tests/41-noise-purefreqs.test
    description: "纯频率噪声注入（委托执行 40-noise.test 1200 -M 1200 -S 2400）"
    command: "make check"
  - file: tests/60-multibyte.test
    source: minimodem-minimodem-0.24-1/tests/60-multibyte.test
    description: "多字节（testdata-multibyte.txt）1200 波特往返"
    command: "make check"
  - file: tests/70-callerid-mdmf.test
    source: minimodem-minimodem-0.24-1/tests/70-callerid-mdmf.test
    description: "Caller-ID MDMF：1200 --ascii 发送 testdata-callerid-mdmf.bytes，rx callerid 解码输出与 .txt 逐字比对"
    command: "make check"
  - file: tests/71-callerid-sdmf.test
    source: minimodem-minimodem-0.24-1/tests/71-callerid-sdmf.test
    description: "Caller-ID SDMF（委托执行 70-callerid-mdmf.test testdata-callerid-sdmf.bytes）"
    command: "make check"
  - file: tests/80-SAME.test
    source: minimodem-minimodem-0.24-1/tests/80-SAME.test
    description: "SAME（EAS）协议模式 1200 波特往返（self-test testdata-ascii.txt SAME）"
    command: "make check"
  - file: tests/81-ascii7.test
    source: minimodem-minimodem-0.24-1/tests/81-ascii7.test
    description: "7 位 ASCII（-7）1200 波特往返"
    command: "make check"
  - file: tests/81-tdd.test
    source: minimodem-minimodem-0.24-1/tests/81-tdd.test
    description: "TDD（Baudot 电传）模式 testdata-baudot.txt 往返"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制)
test_package_tests:
  - file: test_package/conanfile.py
    description: "消费者测试入口：cross-building 跳过判定 + bin/minimodem 交付断言，随后以参数方式执行 test_package/test.sh"
    command: "conan test (test_package/conanfile.py test())"
  - file: test_package/test.sh
    description: "消费者断言脚本（真实执行，CI L0c 白名单测试源）：① minimodem --version 自报版本断言（stdout 含 minimodem 0.24）；② 300 波特 ASCII FSK WAV 往返（--tx→WAV→--rx 与原文 510 字节逐字节 cmp 一致）"
    command: "bash test.sh <包内bin/minimodem> <workdir>"

# 提交面文件清单（test_package/ 下全部 git 跟踪文件，与提交面一一对应）
files:
  - conanfile.py
  - test.sh
  - MANIFEST.yml

# 上游测试断言总数
# 口径：分母 = automake 注册的 28 个 .test 用例（上游无单测断言框架）；每个
# 用例顶层判定 = self-test 内 cmp（全文逐字节相等）或 -P 的 confidence grep
# 或发送一致性 md5 全等。40-noise（4 子轮）、30-amplitude（5 子轮）、
# 21-rate-slop（5 子轮）的子轮计数按上游脚本自身输出呈现，不改变 28 分母。
assertion_count: 28
