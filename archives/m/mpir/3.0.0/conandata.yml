# 源码 URL + SHA256 + 补丁声明（CI 读取的唯一事实源）。

sources:
  url: "https://github.com/wbhart/mpir/archive/refs/tags/mpir-3.0.0.tar.gz"
  sha256: "86a5039badc3e6738219a262873a1db5513405e15ece9527b718fcd0fac09bb2"

patches:
  - patch_file: "patches/0001-fix-mpirxx-signed-overflow.patch"
    patch_description: "mpirxx.h 有符号溢出 UB 修复：__gmpxx_abs_ui/__mpz_set_si_safe 及各运算 eval 中 static_cast<mpir_ui>(-l) 与裸 -l 对 mpir_si 最小值（LONG_MIN）是 UB，clang -O2 常量折叠出垃圾值；统一改为先转 mpir_ui 再取负（可整除语义），移植 GMP gmpxx.h 同类修复。无平台宏。"
    patch_type: "bugfix"
    patch_args: ["-p1"]
  - patch_file: "patches/0002-skip-info-docs.patch"
    patch_description: "doc/Makefile.am 清空 info_TEXINFOS：OHOS CI 无 makeinfo/texinfo 工具链，info 文档为非必要构建产物，跳过以免 make all 失败。"
    patch_type: "portability"
    patch_args: ["-p1"]
  - patch_file: "patches/0003-soften-yasm-probe.patch"
    patch_description: "configure.ac 的 yasm 探测降级为软失败：上游无条件要求 yasm（找不到即 AC_MSG_ERROR），但 yasm 仅在 x86 族 .asm 汇编时被调用，aarch64 走 mpn/generic C 路径从不使用；改为找到则校验、找不到则置空继续。无平台宏。"
    patch_type: "portability"
    patch_args: ["-p1"]
