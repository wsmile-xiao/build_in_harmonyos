# test_package/MANIFEST.yml — mpir/3.0.0
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）。
#
# 上游测试清点（R51 三步法，实测证据见 notes.md）：
#   声明来源：make check 递归 tests/ 下各 Makefile 的 check_PROGRAMS
#   （顶层 9 + mpn 48 + fft 20 + mpz 67 = 144；mpq 12；mpf 27；misc 3；rand 7；cxx 14）
#   合计 207 个测试程序，全量随 conanfile build() 的 `make check` 执行。
#   另有 4 个条件附加程序（st_fat/st_instrument/st_hamdist/st_popcount，汇编对拍
#   速度校验）仅在同时启用 static+shared 时编译；conan 打包为 shared-only，实测不运行。

package: mpir/3.0.0
homepage: "https://github.com/wbhart/mpir"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（按套件汇总，程序级 207 项见 notes.md 全表）
upstream_tests:
  - file: tests/Makefile.am
    source: mpir-mpir-3.0.0/tests
    description: "顶层 t-* 9 项 + mpn 48 项 + fft 20 项 + mpz 67 项，共 144 项"
    command: "make check"
  - file: tests/mpq/Makefile.am
    source: mpir-mpir-3.0.0/tests/mpq
    description: "mpq 有理数套件 12 项（t-get_ui/t-set/t-cmp_ui/t-cmp_z 等）"
    command: "make check -C tests/mpq"
  - file: tests/mpf/Makefile.am
    source: mpir-mpir-3.0.0/tests/mpf
    description: "mpf 浮点套件 27 项（t-get_si/t-muldiv/t-sqrt/t-trunc 等）"
    command: "make check -C tests/mpf"
  - file: tests/misc/Makefile.am
    source: mpir-mpir-3.0.0/tests/misc
    description: "misc 杂项 3 项（t-locale/t-printf/t-scanf）"
    command: "make check -C tests/misc"
  - file: tests/rand/Makefile.am
    source: mpir-mpir-3.0.0/tests/rand
    description: "rand 随机数套件 7 项（t-iset/t-lc2exp/t-mt/t-rand/t-urbui/t-urmui/t-urndmm）"
    command: "make check -C tests/rand"
  - file: tests/cxx/Makefile.am
    source: mpir-mpir-3.0.0/tests/cxx
    description: "C++ 接口套件 14 项（t-ops/t-assign/t-constr/t-prec 等）"
    command: "make check -C tests/cxx"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：mpz 大数乘除回代与阶乘、mpir_si LONG_MIN 混合除法/取模（0001 补丁 UB 修复回归）、mpq 加法、mpf sqrt 界"
    command: "./test_mpir"

# 测试断言总数（近似值，tests/ 源码 ASSERT_ALWAYS 计数）
assertion_count: 780
