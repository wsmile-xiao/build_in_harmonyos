name: mpir
description: MPIR (Multiple Precision Integers and Rationals) - high-precision math library forked from GMP
category: math
license: LGPL-3.0-or-later OR GPL-2.0-or-later
website: https://github.com/wbhart/mpir
source_url: https://github.com/wbhart/mpir
build_system: autotools
versions:
  - version: "3.0.0"
    status: built
    build_date: "2026-09-17"
    notes: >-
      首次适配。GitHub 官方 tag 归档不含生成的 configure（配方内条件 autoreconf 自举），
      mpir 3.0.0 无 aarch64 汇编（mpn 走 generic C），configure 无条件要求 yasm
      （补丁软化为可缺探测），mpirxx.h 存在 mpir_si 最小值
      有符号溢出 UB（补丁修复，移植 GMP 同类修复）。--enable-cxx 提供 C++ 接口。
