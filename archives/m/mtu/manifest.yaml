# Software-level manifest - mtu
# archives/m/mtu/manifest.yaml

software: mtu
display: "mtu"
description: "MTU 探测与注入小工具，可发现到目标主机的路径 MTU 并可注入 PMTU（pingu 项目）"
category: network
homepage: "https://github.com/ncopa/pingu"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "只构建 pingu 源码树中的 mtu 目标（mtu.c/icmp.c/netlink.c），不构建需 libev 的 pingu 守护进程"
    - "跳过上游 configure（其为 pingu 守护进程硬要求 libev），直接 make -C src mtu，避免引入未发布的依赖"
    - "上游无测试套件；test_package 用 usage 参数路径做 4 条消费端冒烟校验，无需 raw socket 与网络"
  common_dependencies: []

versions:
  "1.5.1":
    status: built
    build_date: "2026-10-03"
