# test_package/MANIFEST.yml
# Upstream test declaration for mtu 1.5.1 (pingu v1.5.1 source tree).

package: mtu/1.5.1
homepage: "https://github.com/ncopa/pingu"

# ---- Upstream test audit (R51 step 1: count before running) ------------------
# Conclusion: pingu 1.5.1 ships NO automated test suite. The `mtu` binary is a
# raw-socket network probe with no test harness.
upstream_tests_exist: false
upstream_test_audit:
  - source: "pingu-1.5.1 source tree (root, src/, doc/)"
    reason: "There is no tests/, test/, *_test.c or *_test.go directory or file at any level; src/ holds only the daemon/tool sources (mtu.c, icmp.c, netlink.c, pingu_*.c, pinguctl.c, sockaddr_util.c, xlib.c) plus Lua bindings."
  - source: "src/Makefile and top-level Makefile"
    reason: "They define only all/install/clean targets (BIN_TARGETS=mtu, SBIN_TARGETS=pingu pinguctl); there is no check, test, TESTS or check_PROGRAMS target."
  - source: "configure --help"
    reason: "Optional features are only --enable-debug/--enable-warnings/--enable-werror/--enable-lua/--disable-doc/--with-luapc; there is no test enablement or test dependency probe."
  - conclusion: "Upstream 1.5.1 provides no automated tests; the adaptation's test_package validates the installed mtu binary as a runtime consumer check (usage path, no raw socket needed) and does not claim upstream coverage."

# rule4 mandatory fields: explicit total (0, audited above) with an official
# counting caliber. The tree uses hand-written Makefiles with no TESTS
# registration; `make check` has no rule, equivalent to an empty automake
# check target, hence autotools_tests.
upstream_test_total: 0
upstream_test_count_method: autotools_tests
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_skipped: 0

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ---- Consumer tests (test_package) -------------------------------------------
test_package_tests:
  - file: test_mtu.sh
    description: "Execute the packaged mtu binary through 4 real assertions: (1) bare `mtu` exits 3 on the usage path, (2) unknown option `mtu -z` exits 3 on the usage path, (3) usage output is non-empty, (4) usage output contains the documented flags. Emits a machine-readable RESULT trailer parsed by test_package/conanfile.py. No raw socket or network is needed."
    command: "sh test_mtu.sh <package>/bin/mtu"

assertion_count: 4
