# conandata.yml - multitee 3.0
#
# R39 source provenance
# ---------------------
# multitee 3.0 was released by its author, Daniel J. Bernstein, as a shell
# archive posted to alt.sources on 21 Oct 1991; the author's site still serves
# that posting (https://cr.yp.to/software/multitee-3.0.shar.gz).  A shar is an
# executable shell script that conan's get() cannot unpack, so the recipe
# consumes the upstream/3.0 tag of the designated upstream repository
# salsa.debian.org/debian/multitee: the pristine import of that release, with
# no debian/ directory.  Its 20 files are byte-for-byte identical to the 20
# members of the author's shar (parsed, never executed; see notes.md).
# No Debian patch is used: patches 0001-0005 were written for this port.

sources:
  "3.0":
    url: "https://salsa.debian.org/debian/multitee/-/archive/upstream/3.0/multitee-upstream-3.0.tar.gz"
    sha256: "76371d9a257f2113b28ae181b99bfabd3d5d22f1ebd5bd81625de4633361b751"

patches:
  "3.0":
    - patch_file: "patches/0001-Makefile.patch"
      patch_description: >-
        Add a minimal Makefile: the 1991 release ships no build description.
        The rules only reference CC/CPPFLAGS/CFLAGS/LDFLAGS/LDLIBS, so the
        compiler and flags come from the Conan AutotoolsToolchain environment.
      patch_type: "portability"
    - patch_file: "patches/0002-multitee.c.patch"
      patch_description: >-
        Include <stdio.h>, <stdlib.h> and <unistd.h> so read()/write()
        (ssize_t), exit() and perror() are called through real prototypes
        instead of C89 implicit int declarations.
      patch_type: "portability"
    - patch_file: "patches/0003-ralloc.c.patch"
      patch_description: >-
        Replace the pre-ANSI `extern char *malloc(); extern void free();`
        declarations, which conflict with the libc prototypes and skip the
        size_t conversion of the size argument, with <stdlib.h>/<unistd.h>
        (the latter also declares _exit()).
      patch_type: "portability"
    - patch_file: "patches/0004-sigdfl.c.patch"
      patch_description: >-
        Port sigdfl() from the 4.2BSD sigvec()/sigblock()/sigsetmask()/
        sigmask() API, absent from musl libc, to POSIX sigaction()/
        sigprocmask()/sigset_t with the same semantics; the SIGCONT handler
        gets the void (*)(int) type and its flag becomes volatile
        sig_atomic_t so the busy-wait on it cannot be optimised away.
      patch_type: "portability"
    - patch_file: "patches/0005-sigsched.c.patch"
      patch_description: >-
        Map the sigc_* signal-set helpers of the sigsched scheduler onto
        sigset_t, sigismember/sigaddset/sigemptyset and sigprocmask (the POSIX
        calls the author noted in comments) and install the scheduler signal
        handler with sigaction() instead of sigvec().
      patch_type: "portability"
