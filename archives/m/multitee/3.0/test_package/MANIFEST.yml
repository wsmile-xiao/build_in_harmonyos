# test_package/MANIFEST.yml - multitee 3.0
# Upstream test declaration (CI L0e) - see docs/TEST_QUALITY_SPEC.md

package: multitee/3.0
homepage: "https://salsa.debian.org/debian/multitee"

# ── R51 upstream-test census ────────────────────────────────────────────────
# multitee 3.0 ships NO upstream test suite.  Evidence is file-level, taken
# from the exact source archive used by this recipe (sha256
# 76371d9a257f2113b28ae181b99bfabd3d5d22f1ebd5bd81625de4633361b751) and from
# the author's original posting.
upstream_tests_exist: false
upstream_test_census:
  - source: "multitee-upstream-3.0.tar.gz (complete file list, tar tzf)"
    reason: "20 files: 8 C sources (multitee.c tee.c sigsched.c sigdfl.c ralloc.c getopt.c fmt.c scan.c), 8 headers (sigsched.h sigdfl.h ralloc.h getopt.h fmt.h scan.h sod.h config/fdsettrouble.h) and 4 man pages (multitee.1 tee.1 sigsched.3 sigdfl.3). No tests/ directory, no test source or data, no Makefile - hence no check/test target."
  - source: "https://cr.yp.to/software/multitee-3.0.shar.gz (author's alt.sources posting, 21 Oct 1991)"
    reason: "The shar packs the same 20 members (byte-identical to the tag archive; parsed, not executed). Its cover text gives usage examples only and describes no test procedure."
  - source: "Debian packaging (salsa debian/multitee, master)"
    reason: "debian/ has no tests/ (no autopkgtest); debian/rules is a bare `dh $@`, so downstream runs no test either."
  - conclusion: "0 tests / 0 test files / 0 test targets upstream: N=0, N'=0. Nothing is skipped for environmental reasons - there is no upstream suite to run."
upstream_test_count: 0
upstream_test_in_build: false
upstream_test_command: "N/A (no upstream test/check target exists)"
upstream_check_command: "N/A (upstream ships no Makefile and no test target)"
upstream_test_execution: "N/A - see upstream_test_census"

# ── test_package (added by this port, one entry script) ─────────────────────
test_package_tests:
  - file: test_multitee.py
    name: multitee-functional
    description: "Drives the packaged bin/multitee through the behaviour documented in multitee(1): F1 stdin->stdout copy through a pipe; F2 200 KiB fan-out to three descriptors (tee equivalent); F3 '-b 7' tiny buffer over 20 KiB; F4 two inputs merged into one output as intact chunks; F5 keeps serving an input that is still open and exits once it closes; F6 'e' link - EOF on fd 0 forces EOF on a still-open pipe; F7 EPIPE on a '-' output is a warning and the other output completes (SIGPIPE caught by the sigaction()-installed sigsched handler); F8 EPIPE on a ':' output kills multitee with SIGPIPE (ported sigdfl(): sigaction(SIG_DFL) + kill() + sigprocmask()); F9 '-q' suppresses the F7 warning; F10 unknown option exits 1 with 'illegal option -- x'; F11 no arguments exits 0 silently."
    command: "python3 test_multitee.py <package>/bin/multitee <test build folder>"

ohos_specific_checkpoints:
  - name: A1-ohos-elf-identity
    description: "ELF header parsed directly: ELFCLASS64, ELFDATA2LSB, e_machine = EM_AARCH64 (183)."
  - name: A2-pie
    description: "e_type = ET_DYN (position-independent executable)."
  - name: A3-ohos-musl-interpreter
    description: "PT_INTERP = /lib/ld-musl-aarch64.so.1 - the OHOS musl loader, not glibc."
  - name: A4-executable
    description: "The packaged bin/multitee carries the executable bit."
  - name: F7-F8-musl-signal-port
    description: "F7 and F8 are the regression tests of the sigvec -> sigaction/sigprocmask port (patches 0004/0005): the unpatched sources do not compile against musl (struct sigvec is incomplete)."

functional_check_count: 11
ohos_artifact_check_count: 4
# 24 functional assert statements (F1-F11) + 5 artifact conditions (A1-A4)
assertion_count: 29

# Host rule: on the aarch64 OHOS CI worker all of F1-F11 must run and pass.
# On a foreign-architecture host (the x86_64 prep runner) the script prints
# "[skip] F1-F11 not run" - reported as SKIPPED, never as passed - only when
# launching the image fails with an explicit loader/format marker.
