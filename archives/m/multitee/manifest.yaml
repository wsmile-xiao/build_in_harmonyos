software: multitee
display: "multitee"
description: "多路 tee：把一个或多个输入文件描述符的数据同时分发到多个输出描述符（D. J. Bernstein，1991，public domain）"
category: utility
homepage: "https://salsa.debian.org/debian/multitee"
license: Public-Domain
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 1991 年 shar 发布无任何构建文件：补丁新增最小 Makefile，编译器与标志取自 Conan AutotoolsToolchain"
    - "sigdfl.c/sigsched.c 使用 4.2BSD sigvec/sigblock/sigsetmask/sigmask，OHOS musl 不提供：按 POSIX sigaction/sigprocmask/sigset_t 逐点改写，不加平台宏（知识草稿 E634）"
    - "补齐 stdio.h/stdlib.h/unistd.h 原型，去掉与 libc 冲突的前 ANSI malloc/free 声明（LP64）"
    - "上游无测试：test_package 补全制品检查与 11 项功能用例，含 EPIPE 告警 / SIGPIPE 致死两条信号路径回归"
    - "CLI 工具：安装 bin/multitee 与 man1/multitee.1；不构建会遮蔽系统 tee 的 tee.c 克隆"
  common_dependencies: []

versions:
  "3.0":
    status: built
    build_date: "2026-09-23"
    conan_ref: "multitee/3.0"
