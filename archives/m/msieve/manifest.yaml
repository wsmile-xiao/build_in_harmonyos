# 软件级 manifest — msieve
name: msieve
# 上游：Jason Papadopoulos 的整数分解库（QS/NFS），SourceForge 托管
description: >
  Msieve 是一个大整数分解的 C 库，实现二次筛法（QS）与数域筛法（NFS）
  的完整流程（多项式选择、筛法、关系过滤、线性代数、平方根），附带
  一个命令行分解客户端。上游源码整体置于公有领域。
homepage: "https://sourceforge.net/projects/msieve/"
license: "Public Domain"

# 仓库内可用版本（archives/m/msieve/<version>/）
versions:
  "1.53":
    # 上游最后一个正式 SourceForge 发布版（2016-01-04，SVN r989）
    upstream: "https://downloads.sourceforge.net/project/msieve/msieve/Msieve%20v1.53/msieve153_src.tar.gz"
    sha256: "c5fcbaaff266a43aa8bca55239d5b087d3e3f138d1a95d75b776c04ce4d93bb4"
    # 纯 Makefile 工程；依赖 gmp（大整数）与 zlib（NFS 关系数据压缩）
    build_system: "make"
    dependencies:
      - "gmp/6.3.0.1"
      - "zlib/1.3.1"
    # 上游无正式测试套件（无 make test / check 目标）；验证方式为
    # test_package 用已知合数实际运行分解（见 1.53/test_package/）
    upstream_tests: "none"
