# test_package/MANIFEST.yml — msieve 1.53
# 遵循 ARCHIVE-SPEC v2.0

upstream_test_in_build: false

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - name: test_package
    type: functional          # 消费者/功能测试
    file: test_package.c
    binary: msieve_test
    framework: none           # 纯 C 断言式自报告 (PASS/FAIL + 非零退出码)
    assertions: 15
    # 正向合数分解 x4 (15 / 1018081 / 10967535067 / 46 位合数):
    #   每个含 4 断言 (因子数、FACTORIZATION_DONE、乘积回验、每因子独立素性复核)
    # 负向输入 x3 (素数 1000003 / 1 / 0): 不崩溃且至多 1 因子
    runs_on_target: true

  - name: test_ohos
    type: ohos-specific       # 鸿蒙特有测试
    file: test_ohos.c
    binary: msieve_test_ohos
    framework: none
    assertions: 6
    # 真实运行分解 x2 (各: FACTORIZATION_DONE、乘积回验、素性链完整)
    # 二进制格式检查 (ELF64 AArch64 / musl 解释器 / .codesign 唯一 /
    # 无 RPATH、无宿主路径) 在 conanfile.py test() 阶段以 readelf 执行
    runs_on_target: true

# 上游测试状态（上游无正式自动化测试套件）
upstream_tests:
  status: none
  note: >-
    上游 Makefile 仅 all/clean/help 目标，无 make test/check；
    官方验证方式即用已知合数实际运行分解，由上述 test_package
    测试完整承担 (分解 + 乘积回验 + 独立素性复核 + 负向输入)。
  upstream_assertions: 0

# 测试统计
assertion_count:
  test_package: 15
  test_ohos: 6
  total: 21
