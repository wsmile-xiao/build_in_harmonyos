# 新通用方案，不提交知识草稿。查重详情见 notes.md「知识扩展审查」节。
knowledge_path: A

knowledge_gained:
  - "Upstream is a plain recursive Makefile (only all/clean/help targets), CC=gcc and OPT_FLAGS hardcode -march=native: AArch64/OHOS builds must override OPT_FLAGS on the make command line"
  - "Makefile unconditionally passes -DHAS_SSE2 to two generic sieve_core variants, but every SSE2 inline-asm use site is double-guarded by GCC_ASM32X/GCC_ASM64X/MSC_ASM* macros: on AArch64 all of them compile to the upstream portable C fallback, the define is inert"
  - "Upstream LIBS hardcodes -ldl -lz -lgmp -lm -lpthread; OHOS musl folds libdl/libpthread into libc but keeps stub .a files in the sysroot, so the stock link line works unmodified"
  - "Upstream has no test target (no make test/check); official validation is factoring known composites via the demo CLI or the msieve_obj_new/msieve_run library API"
  - "OHOS packaging must sign the msieve executable with binary-sign-tool to inject the .codesign section (precedent: abx/0.1)"

patch_generation:
  method: none
  patches_count: 0
  note: "no source modifications were needed; portability handled entirely by make command-line variable overrides"

patch_classification: []
