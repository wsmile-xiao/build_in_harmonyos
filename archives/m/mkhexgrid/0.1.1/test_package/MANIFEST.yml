# test_package/MANIFEST.yml — mkhexgrid 0.1.1
# CI L0e requires this file to exist.

package: mkhexgrid/0.1.1
homepage: "https://www.nomic.net/~uckelman/mkhexgrid/"

# mkhexgrid has no upstream test suite (2007 plain-Makefile project, no `make check` target)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs mkhexgrid --version, generates an SVG hex grid to file (verifies <svg> root + XML declaration), and generates SVG to stdout via specfile"
    command: "bash test.sh"

# Assertion count (--version match + SVG file non-empty + <svg> marker + XML decl + stdout SVG marker)
assertion_count: 5
