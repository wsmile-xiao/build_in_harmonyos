# 软件级 manifest — mkhexgrid
# 遵循 ARCHIVE-SPEC v2.0

software: mkhexgrid
display: "mkhexgrid"
description: "命令行六角网格生成器 — 输出 PNG / PostScript / SVG 格式的六角网格"
category: utility
homepage: "https://www.nomic.net/~uckelman/mkhexgrid/"
license: GPL-2.0-or-later
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目（2007 年发布），CC=g++，链接 -lgd，无 configure、无 make check 目标"
    - "upstream 无测试套件：Makefile 仅有 all/dist/install/clean 目标，无 test/check"
    - "依赖 boost（仅 header-only lexical_cast）与 libgd（gd.h + -lgd）"
    - "Makefile 用裸 -lgd 与裸 #include <boost/...>，recipe 通过 deps_cpp_info 注入 -I/-L"
    - "零 patch：Makefile 通过命令行覆盖 CC/CPPFLAGS/LDFLAGS 即可交叉编译，无需改源码"
  common_dependencies:
    - "boost/1.84.0"
    - "gd/2.3.3"

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.1.1":
    status: published
    build_date: "2026-08-30"
