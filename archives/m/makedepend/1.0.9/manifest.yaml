software: makedepend
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.9"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.x.org/releases/individual/util/makedepend-1.0.9.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/makedepend-1.0.9.orig
  source_work_dir: /storage/Users/currentUser/builds/makedepend-1.0.9.work
  source_orig_hash: 06723218531544be
  source_work_hash: 11c8059899ae87c5
  generated_at: '2026-06-09T10:44:00'
  patches_count: 2

patch_classification:
  - file: 0001-config.guess.patch
    type: platform
    platform_only: true
    guard: 'none'
    description: "添加 HarmonyOS 系统识别（__OHOS__ 检测分支）"
  - file: 0002-config.sub.patch
    type: platform
    platform_only: true
    guard: 'none'
    description: "添加 ohos-linux triplet 和 linux-ohos 组合规则"
