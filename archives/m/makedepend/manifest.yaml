software: makedepend
display: "Makedepend"
description: "Dependency generator for Makefiles (from X11)"
category: build-tool
homepage: "https://gitlab.freedesktop.org/xorg/util/makedepend"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "X11依赖生成工具：解析 C/C++ 的 #include 并往既有 Makefile 追加 '# DO NOT DELETE' 依赖块"
    - "无第三方库依赖；只需 config.guess 的 HarmonyOS 识别 + configure 的 umask 权限修复两个补丁"
    - "mk-configure（bmake 驱动）的 mkdep/makedepend 前置工具之一"
  common_dependencies: []

versions:
  "1.0.9":
    status: published
    build_date: "2026-06-09"
  "1.0.10":
    status: built
    build_date: "2026-09-12"
    conan_ref: "makedepend/1.0.10"
