software: makedepend
version: "1.0.10"
status: built
build_date: "2026-09-12"
build_system: autotools
conan_ref: "makedepend/1.0.10"

source:
  url: "https://www.x.org/releases/individual/util/makedepend-1.0.10.tar.gz"
  sha256: "baf742fb6c76c15febf5181e5cd814066205d8be9aef4abfdc2c54b235e14917"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies:
    - util-macros/1.20.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-configure-umask-fix.patch"

knowledge_gained:
  - "E007: config.guess 不识别 HarmonyOS（configure 报 cannot guess build type），需补 HarmonyOS 分支并输出 aarch64-unknown-linux-ohos"
  - "E011: configure/config.status 以 umask 077 创建临时目录，HMDFS 上写 subs*.awk 权限被拒，需将 umask 077 改为 022"
  - "1.0.10 自带的 config.sub（2024-05-27）已内置 ohos，无需再补 linux-ohos 组合规则（对比 1.0.9 时代）"
  - "makedepend 的 configure 中不存在 RAWCPP 探测，man page 由 $(SED) 生成，无需 xinit 式的 RAWCPP 重定向补丁"
  - "上游测试 make check 仅 2 个用例（tests/1、tests/28045），成本极低，可直接嵌入 build()"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/makedepend-check/orig
  source_work_dir: /storage/Users/currentUser/tmp/makedepend-check/work
  generated_at: '2026-09-12T18:20:00'
  patches_count: 2

patch_classification:
  - file: 0001-config.guess.patch
    type: platform
    platform_only: true
    guard: 'none'
    description: "添加 HarmonyOS 平台识别并输出 aarch64-unknown-linux-ohos"
  - file: 0002-configure-umask-fix.patch
    type: platform
    platform_only: true
    guard: 'none'
    description: "去掉 configure 临时目录的 umask 077（HMDFS 权限修复）"
