  sha256: "baf742fb6c76c15febf5181e5cd814066205d8be9aef4abfdc2c54b235e14917"
  filename: "makedepend-1.0.10.tar.gz"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Add HarmonyOS platform recognition to config.guess (E007): dispatch HarmonyOS uname output to aarch64-unknown-linux-ohos so configure no longer fails with 'cannot guess build type'"
    patch_type: "portability"
    sha256: "9e027064f476e6759df0f04d09e08b7473b8b53eb5a488c6d920e3e4a5d35ea3"
  - patch_file: "patches/0002-configure-umask-fix.patch"
    patch_description: "Drop umask 077 when creating configure temporary directories (E011): on the HMDFS build filesystem the 0700 temp dir makes config.status fail with 'Permission denied' while writing subs*.awk"
    patch_type: "portability"
    sha256: "6d4826812299be91285fcfc88a567a7207cd0e8467374ec489e1a3e8a4737a25"
