package: makedepend/1.0.10
homepage: "https://gitlab.freedesktop.org/xorg/util/makedepend"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_test_count: 2
upstream_test_scope: "Two upstream shell regressions (tests/1, tests/28045) run by 'make check' from build(); each drives the freshly built makedepend over C/C++ sample sources in a scratch directory."

upstream_tests:
  - file: tests/1/makedep.sh
    source: makedepend-1.0.10/tests/1/makedep.sh
    description: "Upstream regression for gitlab issue #1: C++ sources (one.cpp/two.cpp) with comment handling and shared headers."
    command: "make check"
  - file: tests/28045/makedep.sh
    source: makedepend-1.0.10/tests/28045/makedep.sh
    description: "Upstream regression for bugzilla 28045: C++ (foo.cpp) dependency generation, including -fno-builtin style compiler invocations."
    command: "make check"

test_package_tests:
  - file: test.sh
    description: "Runs the packaged makedepend in the conanrun environment: asserts the '# DO NOT DELETE' marker, the generated 'demo.o: dep.h' dependency for a real #include, and a failing exit when no Makefile is present."
    command: "bash test.sh"

assertion_count: 4
