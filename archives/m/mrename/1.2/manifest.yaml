knowledge_gained:
  - "上游脚本 shebang 写 /bin/sh 但使用 bash 专有语法（test ==、$[ ]、echo -n），在 POSIX shell 下报 `[: ==: unexpected operator` 且功能静默失效"
  - "find -exec 按 execvp 语义解析辅助命令，脚本工具包必须由 wrapper 注入 libexec 到 PATH 才能重定位安装"
  - "解释型脚本包 package_id 应 self.info.clear()，产物与编译器/架构无关"
  - "OHOS 的 find 由 toybox 提供、按目录项流式处理；在被遍历的目录里用 find -exec 改名会让新名字被再次匹配（同一文件改名两次），须先快照匹配结果再处理"

