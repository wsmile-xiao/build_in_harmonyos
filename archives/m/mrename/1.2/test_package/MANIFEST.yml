package: mrename/1.2
homepage: "https://salsa.debian.org/debian/mrename"

# R51 步骤 1 — 上游测试清点（证据见下）
# 上游 1.2 发布树只有三个文件：README、mrename、mcpmv。没有 tests/ 目录、
# 没有测试脚本、没有构建系统（因而没有 ctest/pytest/make check 注册项），
# 也没有任何 CI 配置。Debian 打包侧同样没有 debian/tests（无 autopkgtest）。
upstream_test_command: ""
upstream_test_in_build: false
upstream_tests: []
upstream_test_inventory:
  release_files: 3            # README + mrename + mcpmv
  test_directories: 0
  registered_test_cases: 0
  evidence: "tar tzf mrename-upstream-1.2.tar.gz -> README, mcpmv, mrename；源码树无 tests/、无 Makefile、无 CI 配置；salsa debian/1.2-17 分支无 debian/tests"

# R51 步骤 3 — 上游零测试，由 test_package 补齐真实功能测试
test_package_tests:
  - file: test_mrename.sh
    description: "端到端验证打包后的 CLI：帮助输出、copy 模式（含文件总数，防二次复制）、move 模式（含文件总数，防二次改名）、含空格文件名、确认提示、参数校验、安装布局、补丁生效、200 文件批量改名每个恰好一次，以及 dash（严格 POSIX shell）下的实跑"
    command: "sh test_mrename.sh <package>/bin/mrename <package-folder>"

# 18 条断言；最后一条 dash 轮次仅在 runner 装有 dash 时执行，
# 否则输出 "skip dash round" 且不计入通过数
assertion_count: 18
