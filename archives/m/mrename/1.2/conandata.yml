# conandata.yml — mrename 1.2
#
# 上游作者 Giancarlo Erra 的主页 alfalinux.sourceforge.net 自 2000 年后停更，
# 原始 tarball 已无官方存档（SourceForge 项目页无发布文件）。Debian 源仓库
# salsa.debian.org/debian/mrename 的 `upstream/1.2` tag 保存的是纯上游源码树
# （README + mrename + mcpmv，不含 debian/ 打包目录），是目前唯一权威可取源。
# 该 tag 的 archive tarball 经两次独立下载校验 sha256 一致。
sources:
  "1.2":
    url: "https://salsa.debian.org/debian/mrename/-/archive/upstream/1.2/mrename-upstream-1.2.tar.gz"
    sha256: "8d6d924fc42ca75493b734686ec9276b903ce00dbd5cd980e2a4fa7c4ec49b98"

# 两个补丁均为 POSIX shell 可移植性修复：上游脚本 shebang 声明 /bin/sh，
# 实现却使用 bash 专有语法（test 的 == 运算符、废弃的 $[ ] 算术展开、
# echo -n），在 HarmonyOS PC 的 POSIX shell 下直接报
# `[: ==: unexpected operator` 而功能失效。
patches:
  "1.2":
    - patch_file: "patches/0001-mcpmv.patch"
      patch_type: "portability"
      patch_description: "mcpmv: 用 POSIX test（=）与 $((...)) 算术替换 bash 专有语法，并为文件名加引号"
    - patch_file: "patches/0002-mrename.patch"
      patch_type: "portability"
      patch_description: "mrename: 用 POSIX test（=）、printf 替换 == 与 echo -n，参数传递加引号；先快照 find 匹配结果再逐个改名，避免 toybox find 重复匹配已改名文件"
