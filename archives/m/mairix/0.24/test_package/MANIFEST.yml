# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: mairix/0.24
homepage: "https://sourceforge.net/projects/mairix/"

# 上游有可自动化执行的测试套件：test/ 目录 35 个 .test-spec 用例
# （scripts/test.sh 解释执行；`cd test && make check` 聚合运行）。
# 用例基于合成邮件语料（maildir/mbox/mh），纯文件操作 + mairix 二进制
# 调用，已在真机完整执行。实测 4 通过 / 31 失败，失败归因单一：
# assert_dump 断言对上游参考机的 readdir 枚举序做字节级比较（设备文件
# 系统枚举序不同，词集与建库功能经逐词比对完全一致），详见 PR 描述。
upstream_check_command: "cd test && make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: "test/*.test-spec"
    description: >-
      上游自动化测试套件共 35 个用例（3×10-add-messages / 1×15 /
      3×20-remove-purge / 3×30-mformat / 20×40-search / 3×45 /
      1×50 / 1×55），由 test/scripts/test.sh 解释执行。真机全跑，
      结果与归因见 PR 描述与 notes.md。

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_mairix.sh
    description: >-
      CLI 消费者测试（5 项断言）：mairix -V 输出程序名（1）；合成 maildir
      建索引成功且 database 文件生成（2）；f:alice 检索恰好命中 1 封并
      symlink 进 results（3）；无匹配检索保持 0 结果（4）；负向检索正常
      退出（5）。任一失败即非零退出。
