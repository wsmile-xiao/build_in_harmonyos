patches:
  "0.24":
    - patch_file: "patches/0001-dotlock-getpwuid-fallback.patch"
      patch_description: "OHOS musl 上 app uid 无 passwd 条目，getpwuid() 返回 NULL 时 dotlock.c 直接 exit(1) 导致任何建库操作失败——pw_name 仅写入锁信息文件作诊断用，回退静态名 \"unknown\"（getpwuid 正常的平台行为不变）"
      patch_type: "portability"
