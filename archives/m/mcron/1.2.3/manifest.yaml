software: mcron
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.2.3"
status: published
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "http://ftp.gnu.org/gnu/mcron/mcron-1.2.3.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  build_method: "VPATH"

  dependencies:
    - "guile/3.0.11"
    - "libffi/3.4.6"
    - "libunistring/1.3"
    - "bdwgc/8.2.8"
    - "readline/8.2"
    - "ncurses/6.4"
    - "gmp/6.3.0"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "job-specifier-getpw-fallback.patch"
  - "base-wait-any-fix.patch"

# ============================================================
# 预编译包信息
# ============================================================

package:
  filename: "mcron-1.2.3-ohos-aarch64.tar.gz"
  size_bytes: 3088877
  size_human: "3.1MB"
  location: "archives/m/mcron/1.2.3/packaging/"

  contents:
    - "bin/mcron"
    - "sbin/cron"
    - "sbin/crontab-access"
    - "libexec/crontab-access-real"
    - "lib/guile/3.0/site-ccache/mcron/*.go (15 modules)"
    - "share/guile/site/3.0/mcron/*.scm (15 modules)"
    - "share/man/man1/mcron.1"
    - "share/man/man1/crontab.1"
    - "share/man/man8/cron.8"
    - "share/info/mcron.info"

# ============================================================
# 质量门禁
# ============================================================

quality_gates:
  G0_build_success: true
  G1_binary_present: true
  G2_dependencies_resolved: true
  G3_basic_run: true
  G4_functional_test: true  # 100% pass (8/8 tests)

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E072: HMDFS 文件系统不支持在当前目录创建临时子目录（mktemp -d './confXXXXXX'）"
  - "解决方案: 修改 config.status 第 565 行，使用固定目录 $HOME/tmp/config-tmp-*"
  - "OHOS 用户管理不兼容: getpw(getuid) 失败，用户 UID 不在 /etc/passwd 中"
  - "解决方案: 在 job-specifier.scm 中添加 fallback，创建虚拟 passwd 结构"
  - "Guile 3.0.11 缺少 WAIT_ANY 常量定义"
  - "解决方案: 在 base.scm 中手动定义 (define WAIT_ANY -1)"
  - "VPATH 构建可有效绕过 HMDFS 临时目录限制"

# ============================================================
# 平台限制
# ============================================================

platform_notes:
  - "运行需要 guile 3.0.11 及所有依赖库"
  - "crontab-access 需要 setuid 权限"
  - "定时任务功能需要 root 权限运行 cron 守护进程"