patches:
  "1.4":
    - patch_file: "patches/0001-CMakeLists.txt-ctest-top-level-and-install-static.patch"
      patch_description: "两处打包/测试缺陷：(a) 上游 include(CTest)（= enable_testing()）写在 src/ 子目录里，CMake 只会在 <build>/src/ 生成 CTestTestfile.cmake，在 build 根目录跑 ctest 得到 'No tests were found!!!' 且退出码为 0（测试零执行却全绿）→ 把 include(CTest) 提到顶层；(b) install(TARGETS mathicgb LIBRARY DESTINATION lib) 只声明 LIBRARY，静态库(.a)根本不会安装，且 mathicgb.h（只挂在 PUBLIC_HEADER 属性上、无 PUBLIC_HEADER DESTINATION）也不会安装 → 补 ARCHIVE/LIBRARY/PUBLIC_HEADER 三类目的地"
      patch_type: "portability"
    - patch_file: "patches/0002-src-CMakeLists.txt-conan-gtest-targets.patch"
      patch_description: "两处必须同时修：(a) 上游 if(GTEST_FOUND) 用的全大写 GTEST_FOUND 只有 CMake 自带 FindGTest.cmake（MODULE 模式）才会设置，而本仓由 CMakeDeps 以 CONFIG 模式命中，只设置 GTest_FOUND → 条件恒假 → 落到 else() 在 configure 期 FetchContent git clone googletest，CI worker 不可联网直接失败；改为 if(GTest_FOUND OR GTEST_FOUND OR TARGET GTest::gtest)，以 target 存在性兜底。(b) 该分支链接的 GTest::GTest / GTest::Main 是 FindGTest.cmake 的旧式别名，Conan 的 gtest/1.17.0.1 只声明 GTest::gtest / GTest::gtest_main / GTest::gmock / GTest::gmock_main；换成为 GTest::gtest（不链 gtest_main：test/testMain.cpp 自带 main()）"
      patch_type: "conan"
