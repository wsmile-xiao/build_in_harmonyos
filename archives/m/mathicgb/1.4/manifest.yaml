# 版本级 manifest — mathicgb 1.4
# 遵循 ARCHIVE-SPEC v2.0

version: "1.4"
software: mathicgb

status: built
build_date: "2026-09-24"
build_system: cmake

source:
  url: "https://github.com/Macaulay2/mathicgb/archive/refs/tags/v1.4.tar.gz"
  sha256: "c2d29521e26fa6024c1be85c5f8273324e2e3bed874327c0b07652986a7ede89"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
  - "BUILD_TESTING=ON（上游 src/CMakeLists.txt 用 if(BUILD_TESTING) 门控测试目标）"
  - "with_tbb=OFF（确定性单线程构建，MATHICGB_NO_TBB，无 TBB 依赖）"
  - "enable_mgb=ON（随包发布 mgb 命令行工具）"
  - "BUILD_SHARED_LIBS=OFF（静态库，package_type=static-library）"
  dependencies:
  - "memtailor/1.4（requires，已发布）"
  - "mathic 1.4（vendor 私有静态合包：conandata vendor.mathic 官方源码，build 内静态构建到私有前缀并合入本包，见 notes.md §9；非 conan requires）"
  - "gtest/1.17.0.1（build_requires，仅测试）"
  cc: clang
  cxx: clang++

patches_applied:
- "0001-CMakeLists.txt-ctest-top-level-and-install-static.patch: (a) include(CTest)/enable_testing() 从 src/ 子目录提到顶层，否则 build 根目录 ctest 得到 'No tests were found!!!' 且退出码 0；(b) install(TARGETS) 补 ARCHIVE/LIBRARY/PUBLIC_HEADER 三类目的地（上游只声明 LIBRARY，静态库与 mathicgb.h 均漏装）"
- "0002-src-CMakeLists.txt-conan-gtest-targets.patch: (a) if(GTEST_FOUND) 的全大写变量在 CONFIG 模式下恒未定义（CMakeDeps 只设 GTest_FOUND）→ 条件恒假 → configure 期 FetchContent git clone googletest 失败；改为 if(GTest_FOUND OR GTEST_FOUND OR TARGET GTest::gtest) 并以 target 存在性兜底。(b) 旧式 target 名 GTest::GTest/GTest::Main 换成 Conan gtest/1.17.0.1 声明的 GTest::gtest（不链 gtest_main：test/testMain.cpp 自带 main）"

knowledge_gained:
- "上游 include(CTest) 写在 src/CMakeLists.txt（子目录）里 → enable_testing() 只对 build/src/ 生效，在 build 根目录跑 ctest 得到 'No tests were found!!!' 且退出码 0（零执行却全绿）；判定 ctest 结果必须同时解析 ctest -N 的 Total Tests 行与汇总行，不能只看退出码（同 memtailor 1.4）"
- "find_package(GTest) 走 CONFIG 模式时 CMake 只保证设置 <PackageName>_FOUND（GTest_FOUND）；上游判空用的全大写 GTEST_FOUND 只有 MODULE 模式才会设置 → if(GTEST_FOUND) 恒假 → configure 期 FetchContent git clone（CI worker 不可联网）。依赖装好了不等于上游会用它，必须改写判断条件（同 memtailor 1.4）"
- "上游 install(TARGETS mathicgb LIBRARY DESTINATION lib) 只声明 LIBRARY：静态库属 ARCHIVE 类别不会被安装；PUBLIC_HEADER 属性没有对应 DESTINATION 时伞头文件 mathicgb.h 同样不安装（同 memtailor 1.4）"
- "v1.4 的 mgb CLI 以子命令形态注册动作（mathic::CliParser），版本动作为 `mgb version`（非 --version）"
- "mathicgb 的 FindMathic/FindMemtailor 属于 MODULE 模式（find_path/find_library），随 CMAKE_PREFIX_PATH 能命中 Conan 提供的包，无需额外补丁；TBB 用 with_tbb=OFF 绕开 FindTBB"
