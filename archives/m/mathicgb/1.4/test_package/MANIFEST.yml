# test_package/MANIFEST.yml — mathicgb 1.4
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: mathicgb/1.4
homepage: "https://github.com/Macaulay2/mathicgb"

# 上游测试命令。上游 .github/workflows/build.yml 的 cmake 分支配置后
# `ctest` 全量运行；测试由 src/CMakeLists.txt 的
# gtest_discover_tests(mathicgb-unit-tests TEST_PREFIX unit-tests:)
# 注册进 CTest。本包在 conanfile.py build() 内以 ctest 全量实跑，
# 并同时解析 `ctest -N` 的 Total Tests 行与汇总行（不只看退出码）。
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 中是否已集成上游测试（层1）
upstream_test_in_build: true
upstream_test_command: "build() 内 ctest --output-on-failure 全量实跑上游 gtest 套件（ctest -N 注册 237 个 CTest 用例，见下）"

upstream_tests:
  - file: "src/test/*.cpp (14 个 TU，见下表)"
    source: "mathicgb-1.4/src/test/*.cpp"
    description: "全部测试 TU，由 src/CMakeLists.txt 的 add_executable(mathicgb-unit-tests ...) 编译，经 gtest_discover_tests(mathicgb-unit-tests TEST_PREFIX unit-tests:) 展开为 CTest 用例。v1.4 源码包逐文件审计无门控宏包裹 TEST（无 #if/#ifdef 包住注册；理想 fixtures 放在 ideals.cpp/ideals.hpp  helper 中，无独立 TEST）。注意 MonoMonoid.cpp 的 13 个 TYPED_TEST 会按 11 种 MonoidTypes 展开为约 143 个 CTest 用例，故 CTest 注册数显著大于普通 TEST 宏数。"
    command: "ctest --output-on-failure"

# upstream_tests 的逐 TU 拆分（v1.4 tarball 实测，行首 TEST(/TEST_F(/TEST_P( 计数；
# TYPED_TEST 另计，见下）：
#   src/test/F4MatrixBuilder.cpp    5
#   src/test/F4MatrixReducer.cpp    1
#   src/test/MathicIO.cpp           8
#   src/test/MonoMonoid.cpp         0 个普通 TEST + 13 个 TYPED_TEST（VarCount/MonoVector/MonoArena/ReadWriteMonoid/MonoPool/setExponentAndComponent/MultiplyDivide/LcmColon/Order/RelativelyPrime/SetExponents/HasAmpleCapacityTotalDegree/CopyEqualConversion）× 11 种 MonoidTypes ≈ 143 个 CTest 用例
#   src/test/PrimeField.cpp        10
#   src/test/QuadMatrixBuilder.cpp  5
#   src/test/Range.cpp              9
#   src/test/Scanner.cpp           10
#   src/test/SparseMatrix.cpp       3
#   src/test/gb-test.cpp           12
#   src/test/ideals.cpp             0  （helper，无 TEST）
#   src/test/mathicgb.cpp          11
#   src/test/poly-test.cpp         27
#   src/test/testMain.cpp           0  （main 入口，无 TEST）
# 普通 TEST 宏合计 101；叠加 TYPED_TEST 展开后 ctest -N 在 gtest/1.17.0.1 下注册
# Total Tests: 237（真机 2026-09-24 实测：发现 237、执行 237、通过 237）。
# 口径为 ctest_entries（官方注册单位），真机实测数以 HMBS_UPSTREAM_TEST_RESULT 为准。

test_package_tests:
  - file: test_mathicgb.cpp
    description: "消费者测试 5 组：安装布局（extern C 探测符号 + MATHICGB_VERSION_STRING==1.4 + GroebnerConfiguration(101,3,1) 存取/拷贝/四种 baseOrder 命名）；真实计算 computeGroebnerBasis({x^2-y, x^3-z})（经 mathic+memtailor），断言输出多项式数与项数；单项式序 API 契约（默认 (1,1,1)-revlex、非全局序被拒绝、各选项 round-trip）；IdealStreamLog 包装真实计算 + logTime/logNumber 烟雾；重复运行逐位一致（确定性）。"
    command: "./test_mathicgb"
  - file: "mgb ( packaged bin/ )"
    description: "CLI 烟雾：mgb version（VersionAction，1.2 新增）打印 Mathicgb 1.4，验证可执行产物在 OHOS 上可启动并链接完整。测试包以包内绝对路径 <package>/bin/mgb version 调用，不依赖 PATH（static-library 包的 bindirs PATH 注入在部分 worker 不可靠）。"
    command: "<package>/bin/mgb version"

# 上游可执行部分的注册用例数（本包 build() 内实跑）
upstream_test_count: 237

# 上游测试总数（官方口径：ctest 注册单位 = gtest_discover_tests 展开后的 CTest 用例数）
upstream_test_total: 237
upstream_test_count_method: "ctest_entries"

# 消费者测试断言组数（5 组 cpp + 1 组 CLI 烟雾）
assertion_count: 6
