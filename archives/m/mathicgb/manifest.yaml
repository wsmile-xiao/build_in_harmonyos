# 软件级 manifest — mathicgb
# 遵循 ARCHIVE-SPEC v2.0

software: mathicgb
display: "mathicgb"
description: "Compute (signature) Groebner bases using the fast datastructures from mathic"
category: library
homepage: "https://github.com/Macaulay2/mathicgb"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "include(CTest) 必须提到顶层，否则 build 根目录 ctest 零执行却退出码 0"
    - "GTEST_FOUND 全大写在 CMakeDeps CONFIG 模式下恒假，需改写判断并链接 GTest::gtest"
    - "install(TARGETS) 需补 ARCHIVE/PUBLIC_HEADER 目的地，否则静态库与 mathicgb.h 漏装"
    - "with_tbb=OFF 确定性单线程构建；mgb CLI 以子命令形态调用（mgb version）"
  common_dependencies:
    - memtailor
    - mathic

versions:
  "1.4":
    status: built
    build_date: "2026-09-24"
