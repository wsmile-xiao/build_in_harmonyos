sources:
  url: "https://dl.farsightsecurity.com/dist/mtbl/mtbl-1.7.1.tar.gz"
  sha256: "da2693ea8f9d915a09cdb55815ebd92e84211443b0d5525789d92d57a5381d7b"

patches:
  - patch_file: "patches/0001-configure-umask-022.patch"
    patch_description: "Use umask 022 for the configure tmp dir (setgid HMDFS makes umask 077 dirs unwritable)"
    patch_type: "portability"
  - patch_file: "patches/0002-sorter-tmpdir-env.patch"
    patch_description: "Fall back to TMPDIR for the sorter default temp dir when /var/tmp does not exist"
    patch_type: "portability"
  - patch_file: "patches/0003-test-tmpfile-tmpdir.patch"
    patch_description: "Create test scratch files under TMPDIR instead of the read-only /tmp (musl tmpfile ignores TMPDIR)"
    patch_type: "portability"
  - patch_file: "patches/0004-config-guess-harmonyos.patch"
    patch_description: "Recognize HarmonyOS in the bundled config.guess"
    patch_type: "portability"
  - patch_file: "patches/0005-config-sub-ohos.patch"
    patch_type: "portability"
    patch_description: "Accept the linux-ohos OS in the bundled config.sub"
  - patch_file: "patches/0006-test-iter-seek-writer-add-side-effect.patch"
    patch_description: "Move the mtbl_writer_add() call out of assert(); with -DNDEBUG the write is skipped and the test operates on empty tables"
    patch_type: "bugfix"
    patch_source: "https://github.com/farsightsec/mtbl/blob/master/t/test-iter-seek.c"
