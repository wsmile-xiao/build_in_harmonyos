software: mtbl
version: "1.7.1"
build_system: autotools
status: built            # 真机 conan create + make check + test_package 验证
source:
  url: "https://dl.farsightsecurity.com/dist/mtbl/mtbl-1.7.1.tar.gz"
  sha256: "da2693ea8f9d915a09cdb55815ebd92e84211443b0d5525789d92d57a5381d7b"
build:
  system: autotools
  generator: "make -j1"
  cc: clang
  configure_options:
    - "--disable-shared"
    - "--without-jemalloc"
  patches:
    - "0001-configure-umask-022: HMDFS umask 077 使 configure 临时目录不可写 (E011)"
    - "0002-sorter-tmpdir-env: /var/tmp 在 OHOS 不存在, sorter 默认临时目录回退 TMPDIR"
    - "0003-test-tmpfile-tmpdir: musl tmpfile() 硬编码只读 /tmp, 测试改用 TMPDIR 下 mkstemp"
    - "0004-config-guess-harmonyos: 识别 HarmonyOS (E160)"
    - "0005-config-sub-ohos: config.sub 接受 linux-ohos"
    - "0006-test-iter-seek-writer-add-side-effect: 上游 assert(mtbl_writer_add(...)) 副作用依赖, -DNDEBUG 下写入被跳过 (bugfix)"
  pkgconfig_alias: "liblz4.pc -> Requires: lz4 (Conan lz4 生成 lz4.pc, mtbl configure PKG_CHECK_MODULES(liblz4))"
  snappy_link: "snappy 静态库为 C++ 实现, 纯 C 链接检查需 -lc++"
libs:
  - mtbl          # libmtbl.a
bin:
  - mtbl_dump
  - mtbl_info
  - mtbl_merge
  - mtbl_verify
requires:
  - lz4/1.10.0
  - snappy/1.2.2
  - zstd/1.5.7.1
  - zlib/1.3.2
upstream_test_run:
  environment: "HarmonyOS localhost HongMeng Kernel 1.12.0 aarch64, clang 15.0.4, make 4.4, conan 2.29.1"
  total_upstream_tests: 15
  executed: 15
  passed: 15
  failed: 0
  pass_rate: "15/15 (100%)"
  real_run_evidence:
    - "make check exit=0, Testsuite summary: TOTAL 15 / PASS 15 / FAIL 0 / SKIP 0"
    - "t/test-block_builder, t/test-varint, t/test-crc32, t/test-dataset, t/test-metadata: PASS"
    - "t/test-iter-seek, t/test-sorted-merge: PASS (0003 TMPDIR + 0006 NDEBUG 副作用补丁后, 原失败原因 /var/tmp 不可写 + musl tmpfile /tmp 只读 + assert 副作用)"
    - "test-mtbl-dump-verify.sh: 串联 writer→dump→verify 全流程 PASS"
    - "test-mtbl-dump-gzip.sh, test-mtbl-verify-orig.sh, test-mtbl-varint.sh, test-mtbl-crc32.sh, test-mtbl-metadata.sh, test-mtbl-dataset.sh, test-mtbl-block.sh, test-mtbl-fixed-prefix-preserve.sh: PASS"
  test_fixtures: "上游 t/ 自带 fixture (test-fixed-lookup, fileset-filter-data 等), 全部使用, 未删除任何测试"
verified:
  device: "HarmonyOS PC (aarch64), clang 15.0.4, HongMeng Kernel 1.12.0"
  conan_ref: "pending CI run"
  evidence: "conan create (ohos-aarch64-local): make check 15/15 PASS + test_package 'ALL MTBL TESTS PASSED'"
knowledge_gained:
  - "mtbl 1.7.1 (2024-12-04): autotools, Apache-2.0, 官方 tarball dl.farsightsecurity.com"
  - "mtbl 四个压缩库均为硬依赖 (configure.ac PKG_CHECK_MODULES liblz4/libzstd + AC_CHECK snappy/zlib)"
  - "musl tmpfile() 硬编码 /tmp 且无视 TMPDIR; OHOS /tmp 只读 → 上游测试需 TMPDIR 感知替代"
  - "mtbl sorter 默认临时目录 /var/tmp, OHOS 无 /var 可写区 → getenv(TMPDIR) 回退"
  - "E011: HMDFS umask 077 → configure 'umask 022' 补丁"
  - "E160: config.guess HarmonyOS 识别补丁 + config.sub linux-ohos 白名单"
  - "snappy C++ 静态库链接 C 测试程序需 -lc++ (OHOS musl libc++ 位置特殊)"
  - "R32: settings.os 判断用 in ('Linux', 'OHOS')"
  - "上游 test-iter-seek.c: assert(mtbl_writer_add(...)) 参数带副作用, Conan Release 默认 -DNDEBUG 下写入被跳过; 最小 bugfix 补丁把调用移出 assert (上游 master 仍未修复)"
  - "Conan 2: 配方自身 buildenv_info 不进 conanbuildenv-*.sh (仅 profile+依赖), make check 的 LD_LIBRARY_PATH 需 build() 内 env.vars().apply() 显式注入"
  - "本机 toybox patch (0.8.12) 对部分补丁静默失败 (报成功但文件未变), 本地验证补丁不可信, 以 conan create 实际应用结果为准"
