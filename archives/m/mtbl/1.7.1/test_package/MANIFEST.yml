# test_package/MANIFEST.yml
source: "upstream API (mtbl/mtbl.h) — https://github.com/farsightsec/mtbl/blob/v1.7.1/mtbl/mtbl.h"
reference: mtbl/1.7.1
test_type: "api-smoke + boundary"
covered_api:
  - mtbl_writer_options_init / mtbl_writer_init / mtbl_writer_add / mtbl_writer_destroy
  - mtbl_reader_options_init / mtbl_reader_init / mtbl_reader_source
  - mtbl_source_get / mtbl_source_iter / mtbl_source_get_prefix / mtbl_source_get_range
  - mtbl_iter_next / mtbl_iter_destroy
  - mtbl_metadata_count_entries / data_block_size / compression_algorithm
assertions:
  - "writer: 200 keys added, all mtbl_res_success; destroy finalizes"
  - "negative: out-of-order add returns mtbl_res_failure"
  - "reader: 200 exact point queries, key AND value bytes verified"
  - "missing key → mtbl_source_get returns NULL"
  - "boundary: key before first / after last → NULL"
  - "full iteration: 200 keys in ascending order, exact bytes"
  - "prefix 'k0001' → exactly 10 keys"
  - "range [k00100,k00105) → 5 keys, endpoints exact"
  - "metadata count_entries == 200, data_block_size > 0"
  - "negative: reader_init on nonexistent file returns NULL"
verified: "real run on HarmonyOS PC aarch64 (see manifest.yaml upstream_test_run)"
