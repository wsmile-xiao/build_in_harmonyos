version: "4.2.2"
software: minizip-ng
build_system: cmake
status: built
build_date: "2026-09-20"

source:
  url: "https://github.com/zlib-ng/minizip-ng/archive/refs/tags/4.2.2.tar.gz"
  sha256: "71af7b9799856d8b03619df3949e9c1be9703f8de0795af71399ba283cb27aac"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DMZ_ZLIB=ON -DMZ_BZIP2=ON -DMZ_ZSTD=ON -DMZ_OPENSSL=ON"
    - "-DMZ_LZMA=OFF -DMZ_PPMD=OFF -DMZ_ICONV=OFF -DMZ_LIBBSD=OFF"
    - "-DMZ_BUILD_TESTS=OFF -DMZ_BUILD_UNIT_TESTS=OFF"
  dependencies:
    - zlib
    - openssl
    - bzip2
    - zstd
  cc: clang (ohos-sdk)

patches_applied: []

knowledge_gained:
  - "版本跟进件：main 已有 4.1.1（autotools 时代归档记录，无 conanfile）；4.2.2 现代化 cmake 重写"
  - "上游依赖全走 find_package(ZLIB/LibLZMA/OpenSSL/zstd/BZip2)：交叉链下按包内 lib/cmake/<name> 预设 <Name>_DIR"
  - "MZ_ICONV=OFF：musl 无 iconv；MZ_LIBBSD=OFF：避免交叉 find_package(libbsd) 乱猜"
  - "上游 gtest 套件 42 用例（7 套件），本地真实执行 42/42 PASSED"
