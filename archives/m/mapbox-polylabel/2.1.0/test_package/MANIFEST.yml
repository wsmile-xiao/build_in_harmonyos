package: mapbox-polylabel/2.1.0
homepage: "https://github.com/mapbox/polylabel"

upstream_check_command: "node test/test.js"
upstream_test_in_build: true
upstream_test_command: "node test/test.js"

upstream_tests:
  - file: test/test.js
    source: polylabel-2.1.0/test/test.js
    description: "Upstream node:test suite (4 tests: water1 precision 1, water1 precision 50, water2 default, degenerate polygons)"
    command: "node test/test.js"
  - file: test/fixtures/water1.json
    source: polylabel-2.1.0/test/fixtures/water1.json
    description: "Upstream fixture polygon used by 2 of the 4 node tests"
    command: "node test/test.js"
  - file: test/fixtures/water2.json
    source: polylabel-2.1.0/test/fixtures/water2.json
    description: "Upstream fixture polygon used by 1 of the 4 node tests"
    command: "node test/test.js"

upstream_runtime_dep:
  package: tinyqueue@3.0.0
  source: "https://registry.npmjs.org/tinyqueue/-/tinyqueue-3.0.0.tgz"
  sha256: "64d0414e61332c1ee6a2a99a26d42e847d8650d32b2bea232b563e01bbe643ae"
  vendor_dir: "node_modules/tinyqueue"
  reason: "polylabel.js bare-imports 'tinyqueue' (package.json dependencies); vendored via conan get() so no npm/node is needed for the dep"

test_package_tests:
  - file: test_polylabel.py
    description: "L0 gate driver (self.run entry): validates packaged polylabel.js, vendored tinyqueue, fixtures and harness oracles from Python (11 assertions)"
    command: "python test_polylabel.py <packaged polylabel.js>"
  - file: test_polylabel.mjs
    description: "Consumer test: imports packaged polylabel.js and asserts degenerate/square pole results (4 assertions)"
    command: "node test_polylabel.mjs"
  - file: run_upstream.mjs
    description: "Cache-proof upstream rerun: same 4 cases/oracles as test/test.js against packaged polylabel.js (node; qjs fallback in conanfile emits HMBS_UPSTREAM_TEST_RESULT)"
    command: "node run_upstream.mjs"
  - file: fixtures/water1.json
    description: "Byte-identical copy of upstream test/fixtures/water1.json for the rerun (2 of 4 cases)"
    command: "node run_upstream.mjs"
  - file: fixtures/water2.json
    description: "Byte-identical copy of upstream test/fixtures/water2.json for the rerun (1 of 4 cases)"
    command: "node run_upstream.mjs"

upstream_rerun_in_test_package: true
upstream_rerun_reason: "conan create skips build() on cache hit, so the build-time HMBS_UPSTREAM_TEST_RESULT is absent; test_package faithfully reruns the same 4 upstream cases against the packaged artifacts and emits the marker"

assertion_count: 4
