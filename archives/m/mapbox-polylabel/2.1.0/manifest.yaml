version: "2.1.0"
software: "mapbox-polylabel"
status: built
build_date: "2026-09-09"
build_system: custom

source:
  url: "https://github.com/mapbox/polylabel/archive/refs/tags/v2.1.0.tar.gz"
  sha256: "64977c08979e03b3da7830f86a3959c703add5d351889634fc66954176db9436"
  tar_format: tar.gz
  runtime_dep:
    package: "tinyqueue@3.0.0"
    url: "https://registry.npmjs.org/tinyqueue/-/tinyqueue-3.0.0.tgz"
    sha256: "64d0414e61332c1ee6a2a99a26d42e847d8650d32b2bea232b563e01bbe643ae"
    vendor_dir: "node_modules/tinyqueue"
    reason: "polylabel.js bare-imports 'tinyqueue'; vendored via conan get(), no npm needed"

build:
  system: custom
  configure_options: []
  dependencies:
    - "tinyqueue@3.0.0 (vendored runtime dep, see source.runtime_dep)"
    - "quickjs@2024-01-13 (vendored fallback JS engine source, same tarball as archives/q/quickjs; built locally with make -j1 only when no host node is runnable)"
  cxx_standard: none
  note: "Upstream v2.1.0 is JavaScript-only (polylabel.js ES module); no C++ compiler required. Upstream gate is node test/test.js (package.json scripts.test) when a runnable node exists; otherwise a locally-built qjs runs the same 4 upstream cases (same inputs/oracles, TAP markers reused), never skipped."

patches_applied: []

knowledge_gained:
- "Upstream v2.1.0 tarball contains only polylabel.js plus node:test suite; the C++ include/ tree present at v2.0.0 was removed upstream, so the recipe packages the JS source verbatim instead of headers."
- "node 18+ is a hard build requirement (import attributes in test/test.js); missing node must fail the build rather than silently skip upstream tests."
- "polylabel.js bare-imports the tinyqueue runtime dependency; the suite cannot pass on a bare checkout, so the recipe vendors tinyqueue-3.0.0 from the npm registry into node_modules/ and bundles it beside the module (boids pattern)."
- "Host node may live on a noexec mount (R=X=True yet execve EACCES); the HMBS_INSTALL shim itself is a script without kernel-usable shebang (direct execve: ENOEXEC), so drive it via /bin/sh and stage into the first of build-dir/HMBS-tmpdir/~.local-share dirs whose copy passes --version."
