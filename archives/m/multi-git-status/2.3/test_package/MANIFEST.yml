package: multi-git-status/2.3
homepage: "https://packages.debian.org/trixie/mgitstatus"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - name: "shellcheck"
    command: "make test"
    description: "上游 Makefile test 运行 shellcheck 静态检查 mgitstatus。"

adapted_tests:
  - name: "version-report"
    command: "mgitstatus --version -> v2.3"
    description: "执行打包后的命令并断言版本输出。"
  - name: "uncommitted-scan"
    command: "在临时真实 Git 仓库制造未提交修改并扫描，断言输出 Uncommitted changes。"
    description: "验证核心多仓库状态扫描功能。"
