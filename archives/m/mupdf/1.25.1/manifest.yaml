software: mupdf
version: "1.25.1"
status: built
build_date: "2026-09-17"
build_system: makefile

source:
  url: "https://github.com/ArtifexSoftware/mupdf/archive/refs/tags/1.25.1.tar.gz"
  sha256: "a07fedc4ed459d810bd81d79b298af28a3601320bd2cb7a48ee725a22e04a2a3"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "HAVE_X11=no"
    - "HAVE_GLUT=no"
    - "shared=no"
    - "build=release"
    - "HAVE_OBJCOPY=no"
    - "XLDFLAGS=-fuse-ld=ld"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "MuPDF uses custom Makefile build system (not cmake/autotools)"
  - "GitHub archive doesn't include thirdparty submodules; source() downloads each at exact commit"
  - "All thirdparty libraries bundled (freetype, harfbuzz, libjpeg, etc.) - no external conan dependencies"
  - "clang 15.0.4 can compile large font C files without DTOFU options"
  - "HAVE_OBJCOPY=no required because OHOS lacks objcopy; hexdump method used for font embedding"
  - "HAVE_X11=no HAVE_GLUT=no required for HarmonyOS (no X11/GLUT)"
  - "XLDFLAGS=-fuse-ld=ld to use GNU ld instead of lld (lld depends on libxml2.so.16 unavailable on CI)"
  - "mupdf 1.25.1 does not have extra-apps make target (unlike 1.27.2)"
  - "No DTOFU options — full font support, no trimming"
  - "Submodule commits for 1.25.1 differ from 1.27.2; no brotli/zxing-cpp/zint submodules"
