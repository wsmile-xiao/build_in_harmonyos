# test_package/MANIFEST.yml
package: mupdf/1.25.1
homepage: "https://mupdf.com/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test inventory (R51): mupdf 1.25.1's top-level Makefile has no
# `test` target; it only provides `extract-test` (thirdparty/extract
# submodule's test-mutool, outside this recipe's scope) and examples under
# examples/. Verification runs the packaged mutool binary instead.
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Verify packaged mutool binary runs and reports version 1.25.1 (invoked by conanfile.py test() with the binary's absolute path)"
    command: "sh test.sh <abs-path-to-mutool>"

assertion_count: 1
