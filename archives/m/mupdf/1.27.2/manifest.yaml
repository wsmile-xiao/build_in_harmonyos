source:
  url: "https://github.com/ArtifexSoftware/mupdf/archive/refs/tags/1.27.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "USE_SYSTEM_LIBS=yes"
    - "USE_SYSTEM_LCMS2=yes"
    - "USE_SYSTEM_BROTLI=yes"
    - "mujs=no"
    - "html=no"
    - "extract=no"
    - "HAVE_GLUT=no"
    - "HAVE_X11=no"
    - "HAVE_OBJCOPY=no"
    - "HAVE_LIBCRYPTO=yes"
  dependencies:
    - freetype/2.13.3
    - libjpeg-turbo/3.1.0
    - zlib/1.2.13
    - openjpeg/2.5.0
    - libpng/1.6.44
    - lcms2/2.16
    - brotli/1.1.0
    - jbig2dec/0.20
    - openssl/3.4.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-thirdparty-mujs-mujs.h.patch"
  - "0002-thirdparty-mujs-regexp.c.patch"
  - "0003-thirdparty-mujs-regexp.h.patch"
  - "0004-thirdparty-mujs-utf.c.patch"
  - "0005-thirdparty-mujs-utf.h.patch"
  - "0006-thirdparty-mujs-utfdata.h.patch"

knowledge_gained:
  - "mupdf uses GNU Makefile build system (not cmake/autotools)"
  - "mujs is a git submodule (empty in tarball); must fill thirdparty/mujs/ with source files for regexp support"
  - "FZ_ENABLE_JS=0 via mujs=no disables JS engine but still requires mujs regexp/utf code"
  - "HAVE_OBJCOPY=no required because ld.lld doesn't support -b binary; hexdump method used for font embedding"
  - "HAVE_X11=no HAVE_GLUT=no required for HarmonyOS (no X11/GLUT)"
  - "gumbo-parser has no cmd-pkgs prebuilt; disabled via html=no (FZ_ENABLE_HTML=0)"
  - "jbig2dec not available as cmd-pkgs; manually compiled from source"
  - "busybox install command used instead of GNU install (not available on HMDFS)"
