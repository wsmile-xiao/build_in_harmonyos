# test_package/MANIFEST.yml — upstream test declaration (CI L0e)
package: mailutils/3.19
homepage: "https://www.gnu.org/software/mailutils/"

# Upstream test entry (GNU Autotest suites driven by the top-level Makefile)
upstream_check_command: "make check"

# conanfile.py build() runs the upstream suite
upstream_test_in_build: true
upstream_test_command: "make -k check"

upstream_tests:
  - file: libmailutils/tests/testsuite.at
    source: mailutils-3.19/libmailutils/tests/testsuite.at
    description: "core library suite (737 cases: list/url/mime/sieve/locker/...)"
    command: "make -k check"
  - file: libproto/dotmail/tests/testsuite.at
    source: mailutils-3.19/libproto/dotmail/tests/testsuite.at
    description: "dotmail mailbox driver"
    command: "make -k check"
  - file: libproto/maildir/tests/testsuite.at
    source: mailutils-3.19/libproto/maildir/tests/testsuite.at
    description: "maildir mailbox driver"
    command: "make -k check"
  - file: imap4d/tests/testsuite.at
    source: mailutils-3.19/imap4d/tests/testsuite.at
    description: "IMAP4 server"
    command: "make -k check"
  - file: testsuite/testsuite.at
    source: mailutils-3.19/testsuite/testsuite.at
    description: "auxiliary tools (cwdrepl/mockmail/mockmta)"
    command: "make -k check"
  - file: mail/tests/testsuite.at
    source: mailutils-3.19/mail/tests/testsuite.at
    description: "mailx client"
    command: "make -k check"
  - file: mh/tests/testsuite.at
    source: mailutils-3.19/mh/tests/testsuite.at
    description: "MH message handling system"
    command: "make -k check"

test_package_tests:
  - file: test_mailutils.c
    description: "consumer test: mu_list / mu_url / mu_locker public API"
    command: "./test_mailutils"
  - file: test_ohos_mailutils.sh
    description: "HarmonyOS-specific: platform identity, CLI/server smoke test, version"
    command: "sh ./test_ohos_mailutils.sh <package_folder>"

assertion_count: 10
