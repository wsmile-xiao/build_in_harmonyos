knowledge_gained:
  - "E007: config.guess/config.sub 需要 HarmonyOS 分支与 linux-ohos 内核项，否则 configure 无法推断 aarch64-unknown-linux-ohos。"
  - "E011: HMDFS 会把目录 owner 映射成固定 UID，configure/config.status 的 umask 077 临时目录不可写，改 umask 022。"
  - "OHOS libc 有 shadow.h 但没有 getspnam()，需要 AC_CHECK_FUNCS(getspnam) 级别的特性探针。"
  - "OHOS libc 提供 getutent()/setutent()/endutent()（utmp.h）但不提供 getutxent()（utmpx.h 只有结构体），comsat 需要按函数可用性选分支。"
  - "HMDFS 不支持硬链接（link(2) 返回 EPERM），mailutils 默认 dotlock 依赖 link()，需要 O_EXCL 回退。"
  - "toybox ls 输出 ISO-8601 日期导致 automake mdate-sh 解析失败并触发 makeinfo，需将 doc stamp-vti 规则置为 no-op。"

