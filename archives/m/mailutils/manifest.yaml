software: mailutils
display: "GNU Mailutils"
description: "Protocol-independent mail framework (libmailutils family, mailx client, IMAP4/POP3 servers)"
category: mail
homepage: "https://www.gnu.org/software/mailutils/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub taught the aarch64-unknown-linux-ohos triplet."
    - "configure/config.status temporary directories use umask 022 on HMDFS (E011)."
    - "getspnam()/getutxent() feature probes because the OHOS libc lacks both functions."
    - "doc/texinfo stamp-vti rule neutralised (toybox ls breaks mdate-sh, no makeinfo on the worker)."
    - "dotlock falls back to an O_EXCL lock file because HMDFS rejects link(2) (E079)."
    - "Library package: 11 shared libraries + bin/ clients + sbin/ servers, signed for the OHOS loader."
  common_dependencies: []

versions:
  "3.19":
    status: published
    build_date: "2026-09-27"
