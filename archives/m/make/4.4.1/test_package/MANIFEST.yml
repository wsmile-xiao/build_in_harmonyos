package: make/4.4.1
homepage: "https://www.gnu.org/software/make/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "OHOS recipe uses build-output --version and mini-Makefile smoke; full make check was not run in this round (see notes.md)."

upstream_tests:
  - file: tests/run_make_tests.pl
    source: make-4.4.1/tests/run_make_tests.pl
    description: "Upstream Perl test driver (~570 test scripts under tests/); requires perl plus a working make on PATH, several tests are platform-sensitive (load objects, output_sync, jobserver)."
    command: "perl tests/run_make_tests.pl -srcdir $(pwd)"
  - file: tests/mkshadow
    source: "n/a"
    description: "No separate unit-test suite; upstream testing is centralized in tests/run_make_tests.pl."
    command: "n/a"

test_package_tests:
  - file: test.sh
    description: "Consumer test runs packaged make --version, executes a mini Makefile (rule + recipe + clean), and verifies clean removes the target."
    command: "sh test.sh"
  - file: smoke.mk
    description: "Minimal Makefile fixture consumed by test.sh."
    command: "make -f smoke.mk clean all"

assertion_count: 4
test_modifications:
  - "No upstream tests are modified or removed."
  - "Full upstream make check is not part of package gating this round: the suite needs perl on the target and contains platform-sensitive tests; it should run during device/shadow-CI validation."
  - "Consumer test uses make as a tool_requires build tool, matching its role as a build dependency of autotools-based packages."
