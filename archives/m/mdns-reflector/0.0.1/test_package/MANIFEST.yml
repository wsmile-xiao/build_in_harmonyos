package: mdns-reflector/0.0.1
homepage: "https://github.com/pbkhrv/mdns-reflector"

upstream_check_command: "grep -r add_test CMakeLists.txt src/CMakeLists.txt (no matches: upstream ships no test suite)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - name: "Upstream test-suite inventory"
    command: "n/a - upstream ships no tests/ directory and no add_test/enable_testing in CMakeLists.txt"
    integrated: false
    declared_tests: 0
    source_files: 0

test_package_tests:
  - file: test_mdns_reflector.py
    description: "Runs mdns-reflector -h and asserts exit code 0."
    command: "python test_mdns_reflector.py <mdns-reflector>"
  - file: test_mdns_reflector.py
    description: "Verifies the -h output contains the version banner, usage text and IFNAME placeholder."
    command: "python test_mdns_reflector.py <mdns-reflector>"
  - file: test_mdns_reflector.py
    description: "Asserts an argument-less invocation exits non-zero."
    command: "python test_mdns_reflector.py <mdns-reflector>"
  - file: test_mdns_reflector.py
    description: "Asserts an unknown option (-Z) exits non-zero."
    command: "python test_mdns_reflector.py <mdns-reflector>"

assertion_count: 7
