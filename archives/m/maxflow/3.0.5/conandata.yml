# conandata.yml — maxflow 3.0.5
# sha256 verified 2026-09-27 against the upstream GitHub tag archive.

sources:
  url: "https://github.com/gerddie/maxflow/archive/refs/tags/3.0.5.tar.gz"
  sha256: "e73a7be173fb95e93366c8128f9f478bc2fe406f7f83eb998fc34e18eaabb612"

patches:
  - patch_file: "patches/0001-bump-cmake-minimum-version-to-3.5.patch"
    patch_description: >-
      Upstream requires CMake 2.8.5; CMake 4.x removed the <3.5 compatibility
      mode and errors out immediately (knowledge error-pattern E103).  Bump
      the minimum to 3.5 — all policies the project sets (CMP0003, CMP0012,
      CMP0042) remain valid at 3.5.
    patch_type: "portability"
  - patch_file: "patches/0002-drop-versioned-so-symlinks-hmdfs.patch"
    patch_description: >-
      Upstream sets VERSION/SOVERSION on the shared target, so CMake creates
      libmaxflow.so.0 / libmaxflow.so symlinks — HMDFS (/storage) has no
      symlink(2) and the link step dies with
      "cmake_symlink_library: Permission denied" (knowledge:
      DRAFT-libfreenect-0.5.3-hmdfs-shared-lib-versioned-symlink).  Drop the
      versioned names and ship a flat libmaxflow.so; consumers link -lmaxflow
      as before.
    patch_type: "portability"
