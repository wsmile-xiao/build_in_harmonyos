# test_package/MANIFEST.yml — maxflow 3.0.5

package: maxflow/3.0.5
homepage: "https://github.com/gerddie/maxflow"

# 上游测试命令（conan build() 内自动执行，见 conanfile.py _run_upstream_tests()）
# 上游顶层 CMakeLists 无条件 ENABLE_TESTING() + ADD_TEST(maxflow test-maxflow)；
# test-maxflow 链接构建树内的 libmaxflow.so，配方在 ctest 前把构建目录追加进
# LD_LIBRARY_PATH（鸿蒙下无可用 RPATH）。
upstream_check_command: "cmake -B build && cmake --build build && ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际存在的测试
upstream_tests:
  - file: test_maxflow.cpp
    source: maxflow-3.0.5/test_maxflow.cpp
    description: >-
      上游自带单元测试：3 个测试函数（test_1/test_2/test_3），共 10 个断言
      （3 个 maxflow() 流量值 + 7 个 what_segment 归属检查）。ctest 注册为
      单个 "maxflow" 测试项驱动 test-maxflow 可执行；任一断言失败进程以
      EXIT_FAILURE 退出，LastTest.log 汇总行形如 "N of 3 test failed"。
    command: "ctest --output-on-failure (test-maxflow)"
    run_status: PASS
    reason: >-
      真机 shadow CI r6（2026-09-27）实测：ctest 发现 1 项，上游二进制汇总行
      "0 of 10 test failed"，HMBS_UPSTREAM_TEST_RESULT executed=10 passed=10
      failed=0 skipped=0（3 个测试函数 / 10 个断言全过）。

# test_package 自带的测试
test_package_tests:
  - file: test_maxflow.cpp
    description: >-
      消费者冒烟 — find_package(maxflow) + 链接 maxflow::maxflow，
      int 三角图（flow=6 + 2 个 segment 断言）、double 双节点图
      （flow=4.0 + 2 个 segment 断言）、int 单节点图（flow=2 +
      1 个 segment 断言），共 7 个断言。
    command: "./test_maxflow"

assertion_count: 7
