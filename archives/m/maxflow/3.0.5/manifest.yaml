software: maxflow
version: "3.0.5"
build_system: cmake
# 真机 shadow CI 已通过（r6，2026-09-27）：L0/L1/L4/L5 pass、L2 skip(纯库)、
# 上游测试 10/10、test_package 7/7；发布上传后更新为 published
status: built
build_date: "2026-09-27"

source:
  url: "https://github.com/gerddie/maxflow/archive/refs/tags/3.0.5.tar.gz"
  sha256: "e73a7be173fb95e93366c8128f9f478bc2fe406f7f83eb998fc34e18eaabb612"
  tar_format: tar.gz

build:
  system: cmake
  cc: clang
  cxx: clang++
  configure_options: []
  dependencies: []

patches_applied:
  - "0001-bump-cmake-minimum-version-to-3.5.patch"
  - "0002-drop-versioned-so-symlinks-hmdfs.patch"

knowledge_gained:
  - "maxflow 3.0.5（gerddie/maxflow，BK max-flow/min-cut 图割库）为纯 C++ 模板库：maxflow.cpp 对 Graph<int,short,float,double> 四种实例化做显式实例化并编译成唯一共享库，零外部依赖"
  - "头文件安装布局特殊：maxflow.h → include/maxflow-3.0/，block.h/graph.h/graph.cpp → include/maxflow-3.0/maxflow/；消费者 include 目录是 include/maxflow-3.0（不是 include/），graph.cpp 作为头文件安装是因为 maxflow.h 在 MAXFLOW_INCLUDE_TEMPLATE_IMPLEMENTATION 下会 #include 它（该宏仅编译库本身时定义）"
  - "上游 CMake 硬编码 ADD_LIBRARY(maxflow SHARED)（无 BUILD_SHARED_LIBS 选项）；maxflow 非系统同名库，不触发 R26 静态强制，按上游原样发共享库"
  - "上游 3.0.5 tag 的 CMakeLists 仍写着 MICRO_VERSION 4，生成的 maxflow.pc Version 字段是 3.0.4（Debian 同样保留）；本配方不改，消费者经 Conan cpp_info 消费不受影响"
  - "上游无 CMake package config（EXPORT MaxFlow 悬空无 install(EXPORT)），消费者用本包 CMakeDeps 生成的 find_package(maxflow) + maxflow::maxflow"
  - "上游测试：test_maxflow.cpp 3 个测试函数共 10 个断言（3 流量值 + 7 segment 归属），ctest 注册单项 'maxflow'；test-maxflow 链接构建树内 libmaxflow.so，鸿蒙无 RPATH，ctest 前需把构建目录加进 LD_LIBRARY_PATH"
  - "cmake_minimum_required 2.8.5 触发 CMake 4.x 兼容模式移除报错（E103），补丁 0001 升至 3.5"
  - "HMDFS（/storage）无 symlink(2)：上游设 VERSION/SOVERSION 时 CMake 建 libmaxflow.so.0/.so 软链报 cmake_symlink_library Permission denied；补丁 0002 去版本化产扁平 libmaxflow.so（知识库 libfreenect 同型草稿），消费者仍 -lmaxflow"
  - "隔离 job 的非交互 runner 环境解析不到裸 cmake/ctest：经 generate() 的 build-env 脚本（Environment.vars(scope=build).save_script）把 /data/service/hnp/cmake.org/cmake_4.1.2/bin 与 /data/service/hnp/bin 注入 PATH 解决（nymphcast PATH 探测 + hnp 兜底同型）"
