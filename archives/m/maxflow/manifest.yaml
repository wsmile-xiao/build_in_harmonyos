software: maxflow
display: "maxflow (BK max-flow/min-cut graph cut library)"
description: >-
  Kolmogorov/Boykov 的 BK max-flow/min-cut 图割算法库（"An Experimental
  Comparison of Min-Cut/Max-Flow Algorithms for Energy Minimization in
  Vision", IEEE TPAMI 2004）。模板 Graph<cap,tcap,flow> 对
  int/short/float/double 显式实例化进共享库，消费者 include <maxflow.h>
  后即可 add_node/add_edge/maxflow/what_segment；视觉能量最小化
  （graph cut 分割）常用底库。
category: algorithm
homepage: "https://github.com/gerddie/maxflow"
license: "GPL-3.0-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "零外部依赖：仅需 CMake ≥3.5（补丁 0001 从 2.8.5 提升，E103）与 C++ 工具链"
    - "消费者 include 目录是 include/maxflow-3.0（版本化布局，非 include/）；graph.cpp 作为头文件随装（maxflow.h 模板实现宏下包含）"
    - "上游硬编码 SHARED（无选项）；maxflow 非系统同名库，不触发 R26，按上游原样发共享库"
    - "上游 3.0.5 tag 内 CMake 元数据仍为 3.0.4（maxflow.pc Version 字段），保留上游原样（Debian 同）"
    - "无 CMake package config，消费者用 CMakeDeps 生成的 maxflow::maxflow"
    - "ctest 上游测试需把构建目录加 LD_LIBRARY_PATH（鸿蒙无 RPATH）"
  common_dependencies: []

versions:
  "3.0.5":
    status: built
    build_date: "2026-09-27"
    source_url: "https://github.com/gerddie/maxflow/archive/refs/tags/3.0.5.tar.gz"
