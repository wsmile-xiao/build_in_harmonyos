# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mmkv/2.4.2
homepage: "https://github.com/Tencent/MMKV"

# 上游测试命令
# 上游 POSIX 构建树通过 CTest 注册了 TestThreadLock；
# UnitTest 为 demo 工程可执行文件（上游未注册 ctest，手动运行）
upstream_check_command: "ctest --test-dir build-full --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: POSIX/demo/UnitTest.cpp
    source: MMKV-2.4.2/POSIX/demo/UnitTest.cpp
    description: "MMKV 上游单元测试主程序：20 个测试函数（bool/int32/uint32/int64/uint64/float/double/string/bytes/vector/remove/oversized key/oversized value/expiration overflow/coded output bounds/expiration alignment/armv8 CRC32/crypto random and wipe/long directory walk/minimal backup restore）"
    command: "./UnitTest <tmpdir>"
  - file: POSIX/demo/TestThreadLock.cpp
    source: MMKV-2.4.2/POSIX/demo/TestThreadLock.cpp
    description: "线程锁测试（上游 CTest 唯一注册项 add_test TestThreadLock）"
    command: "ctest -R TestThreadLock"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_mmkv.cpp
    description: "消费者 API 测试 — C++ API (MMKV::mmkvWithID/set/getString/remove/allKeys) + C bridge API (mmkv_with_id/encode/decode_string/int32/bool/bytes/all_keys) round-trip + mmap 持久化重开验证 (R34)"
    command: "./test_mmkv"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 60
