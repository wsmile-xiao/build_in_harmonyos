# 版本级 manifest
# 文件位置: archives/m/mmkv/2.4.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4.2"

# 软件名
software: "mmkv"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-12"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub，CI 自动加镜像 fallback）
  url: "https://github.com/Tencent/MMKV/archive/refs/tags/v2.4.2.tar.gz"

  # 源码校验和
  sha256: "e77d81daab0c905c06cad6bceb6ad01ca606a428987e2f1f41a2aa162592c685"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DOHOS=ON"
    - "-DOHOS_ARCH=arm64-v8a"

  # 编译依赖列表（zlib 为 MMKV_EMBED_ZLIB=1 内嵌，无外部 conan 依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零补丁：上游自带 __OHOS__ 完整通路）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "MMKV 上游 Core 已原生支持 OHOS：工具链自动定义 __OHOS__，MMKVPredef.h 据此启用 MMKV_OHOS 通路（hilog 日志 + 排除 ashmem），零补丁"
  - "MMKV_OHOS 通路 ENABLE_MMKV_LOG 编译 OH_LOG_Print，消费者必须链系统库 libhilog_ndk.z.so（recipe 已声明 system_libs）"
  - "上游 POSIX/src 的 SHARED 包装库是空壳（libmmkv.cpp 空 TU + 链接器丢弃未引用静态库成员），交付改用 Core 静态库 libcore.a 重命名为 libmmkv.a"
  - "zlib 在交叉 sysroot 下 find_library(z) 不解析 → 上游默认 MMKV_EMBED_ZLIB=1 内嵌，产物自包含"
  - "上游 UnitTest 默认 rootDir=/tmp/mmkv 只读崩段错误，测试须传 TMPDIR 下可写目录"
