# 软件级 manifest — mikelankamp-fpm
# 文件位置: archives/m/mikelankamp-fpm/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: mikelankamp-fpm
display: "fpm"
description: "C++ header-only 定点数学库（fixed-point math），提供 fixed_16_16/fixed_24_8/fixed_8_24 三种可作为浮点类型替身的定点类型"
# 分类标签: foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library
homepage: "https://github.com/MikeLankamp/fpm"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only 库（CMake INTERFACE 目标 fpm，仅 3 个头文件）：conan 配方 package_type=header-library、package_id 清空为单一 id，包内只有 include/fpm/*.hpp 与 licenses/LICENSE"
    - "上游 v1.1.0 的 CMakeLists.txt 无任何 option 开关，且默认 all 目标含 ExternalProject_Add(libfixmath / cnl) 的 git clone 与 benchmark/accuracy 工具：配方 build() 只按目标构建 fpm-test，保证 conan create 全程不联网"
    - "上游测试套件（tests/，GoogleTest）随包内嵌 3rdparty/googletest 构建：设备实跑 34671/34671 全过（ctest 注册口径 94/94），无需外部测试框架"
    - "无需补丁：上游源在 OHOS clang 15 下原样编译，用例数与断言数未做任何改动"
    - "包不产生二进制（bindirs/libdirs 置空），不声明 commands.json；消费者通过 find_package(fpm CONFIG) + fpm::fpm 使用（配方导出 cmake_file_name=cmake_target_name=fpm）"
  common_dependencies: []

versions:
  "1.1.0":
    status: built
    build_date: "2026-09-27"
    conan_ref: "mikelankamp-fpm/1.1.0"
