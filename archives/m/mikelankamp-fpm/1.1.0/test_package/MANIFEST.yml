# test_package/MANIFEST.yml — mikelankamp-fpm/1.1.0
# CI 脚本 (ci/conan/build_and_test.sh L0e) 要求此文件存在。
#
# ── 上游用例数：四个候选口径（N 取最大值，四种口径不混用）──────────────────
#   ① 源码宏数（tests/*.cpp 逐行清点，v1.1.0 官方 tag tarball）
#        grep -rhoE '^[[:space:]]*(TEST|TEST_F|TEST_P|TYPED_TEST|TYPED_TEST_P)[[:space:]]*\(' tests/*.cpp | wc -l   # = 94
#        构成：TEST 70 + TEST_F 17 + TEST_P 4 + TYPED_TEST 3 = 94
#        逐文件：arithmetic 6 arithmetic_int 5 basic_math 4 classification 12
#                constants 4 conversion 7 customizations 0(TYPED_TEST 3) detail 1
#                input 13 manip 4 nearest 6 output 8 power 13 trigonometry 8
#   ② 框架注册数（CMake gtest_add_tests → ctest 注册项）
#        ctest --test-dir <build> -N | grep -c 'Test *#'                          # = 94
#        ctest --output-on-failure -j1 → 100% tests passed, 0 tests failed out of 94
#          （Total Test time (real) = 210.04 sec，日志 $TASK_DIR/ctest.log）
#   ③ 运行期展开数（gtest 可执行直跑，gtest 自报，权威运行口径）
#        ./fpm-test → "[==========] 34671 tests from 19 test suites ran."
#                     "[  PASSED  ] 34671 tests."                                 # = 34671
#        逐 suite 求和 = 34671，与 [ RUN ] 行计数 34671 一致（fpm-test-direct.log）
#   ④ assertion 数（静态宏调用点，只作参照，不作 N）
#        grep -rhoE '\b(ASSERT|EXPECT)_[A-Z_]+[[:space:]]*\(' tests/*.cpp | wc -l  # = 398
#
#   N = max(94, 94, 34671) = 34671   ← 候选数法最大值
#   差额归因（34671 − 94 = 34577）：
#     · TEST 70 + TEST_F 17                = 87 运行期 1:1（差额 0）
#     · TYPED_TEST 3 × 3 个类型实例         = 9  （差额 +6）
#         fixed<int,long,16u> / 8u / 24u（fixed_16_16 / fixed_24_8 / fixed_8_24）
#     · TEST_P(output.*) 3 条 × 11520 组合  = 34560（差额 +34557）
#         INSTANTIATE_TEST_SUITE_P(output_flags, output, Combine(
#           4 × 4 × 2 × 2 × 5 × 4 × 3 × 3 = 11520)
#     · TEST_P(output_grouping) 1 条 × 15   = 15  （差额 +14）
#         INSTANTIATE_TEST_SUITE_P(output_grouping, …, Combine(3 × 5) = 15)
#     87 + 9 + 34560 + 15 = 34671 ✓   6 + 34557 + 14 = 34577 ✓
#
# ── 计数单位 ─────────────────────────────────────────────────────────────
# 单位 = gtest 测试用例（运行期展开口径）。①② 与 ③ 的差额已逐项归因如上，
# 四种口径在本文件内互不混用；PR 正文两表的上游行一律取 ③（34671）。
#
# 全部数字为 2026-09-27 设备端（HarmonyOS PC aarch64，clang 15.0.4）实测，
# 上游源码取官方 tag tarball（sha256 e34941b4…，见 ../conandata.yml）。
# 原始日志（cmake-configure.log / build-fpm-test.log / fpm-test-direct.log /
# fpm-test.xml / ctest.log）留存于设备任务私有目录 $HOME/tmp/mikelankamp-fpm-1.1.0/；
# reports/ 被仓库 .gitignore 忽略，不入 PR。

package: mikelankamp-fpm/1.1.0
homepage: "https://github.com/MikeLankamp/fpm"

# ── 上游测试执行（两表的上游行数据源）────────────────────────────────────
# 上游测试入口：上游 CMakeLists.txt 无条件 enable_testing() + gtest_add_tests()，
# 测试目标 fpm-test 链接内嵌 3rdparty/googletest（上游自带，0 外部依赖）。
# 注意：v1.1.0 的 CMakeLists.txt 没有任何 option 开关，且默认 all 目标含
# ExternalProject_Add(libfixmath / cnl) 的 git clone 与 benchmark/accuracy
# 工具，因此必须按目标构建（--target fpm-test），不得直接 cmake --build 全量。
upstream_check_command: "cmake -S <src> -B <build> -DCMAKE_BUILD_TYPE=Release && cmake --build <build> --target fpm-test --parallel 2"
upstream_test_in_build: true
upstream_test_in_build_evidence: "conanfile.py build(): cmake.configure() + cmake.build(target=fpm-test) + 直跑 fpm-test → 34671/34671 PASSED；设备侧独立复跑见 ../notes.md「上游测试原始日志摘录」"
upstream_test_command: "HOME=$TASK_DIR/test-home ./fpm-test   # 沙箱 HOME 下直跑（gtest_main 无参数即全量执行）"
# ctest 注册口径（同一套件的另一条执行路径，同样全绿）
upstream_ctest_command: "HOME=$TASK_DIR/test-home ctest --test-dir <build> --output-on-failure -j1"

# ── 计数（N = 候选数法最大值 = 34671）───────────────────────────────────
upstream_test_count: 34671
upstream_test_count_command: "grep -rhoE '^[[:space:]]*(TEST|TEST_F|TEST_P|TYPED_TEST|TYPED_TEST_P)[[:space:]]*\\(' tests/*.cpp | wc -l   # 源码宏数 = 94（下界）；ctest -N = 94；运行期展开 = 34671（取最大值）"
upstream_test_executed: 34671
upstream_test_executed_command: "grep -c '^\\[ RUN      \\]' fpm-test-direct.log   # = 34671；gtest 自报 '[  PASSED  ] 34671 tests.'"
upstream_test_unexecuted: 0
upstream_test_unexecuted_reason: "无：上游 tests/ 全部 15 个源文件、19 个测试套件均被 fpm-test 编译并执行"

# ── 实测结果（2026-09-27，设备 aarch64，clang 15.0.4，沙箱 HOME）────────
# 直跑：  34671 tests ran (9911 ms) | PASSED 34671 | FAILED 0 | SKIPPED 0
# ctest： 94/94 registered tests passed（210.04 sec）
# TOTAL = PASS + FAIL + SKIP + NOT_RUN
upstream_results:
  total: 34671
  pass: 34671
  fail: 0
  skip: 0
  not_run: 0

upstream_tests:
  - "tests/arithmetic.cpp"
  - "tests/arithmetic_int.cpp"
  - "tests/basic_math.cpp"
  - "tests/classification.cpp"
  - "tests/constants.cpp"
  - "tests/conversion.cpp"
  - "tests/customizations.cpp"
  - "tests/detail.cpp"
  - "tests/input.cpp"
  - "tests/manip.cpp"
  - "tests/nearest.cpp"
  - "tests/output.cpp"
  - "tests/power.cpp"
  - "tests/trigonometry.cpp"
  - "tests/common.hpp"   # 共享夹具头，非用例文件

# 对上游测试源的改写：无（patches/ 为空，上游用例原样执行，用例数与断言数未改动）

# ── test_package 自带消费者测试（与上游用例分栏统计，不混入 34671）──────
# 本行即 PR 正文「鸿蒙特有测试」行的取数来源。
test_package_tests:
  - file: consumer.cpp
    description: "真实消费者：只 include 安装后的 <fpm/fixed.hpp> <fpm/math.hpp> <fpm/ios.hpp>，26 项断言——整数/小数精确算术、raw 表示往返、fixed_16_16↔fixed_24_8↔fixed_8_24 跨格式转换、sqrt/sin/cos/atan 对照 double 参考（1 LSB 容差）、ceil/floor/round/fmod、operator<</>> 往返、std::hash 稳定性与区分性"
    command: "cmake --build <build> && ./consumer"

# test_package 断言总数：26（鸿蒙特有测试行 = 26）
assertion_count: 26

# 鸿蒙侧未改动上游断言：上游 tests/ 断言静态宏调用点 398，全部原样执行
upstream_assertion_sites: 398
