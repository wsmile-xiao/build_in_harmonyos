software: mysqltuner
version: "2.9.1"
status: built
build_date: "2026-09-11"
build_system: custom-perl

source:
  url:
    - "https://ghfast.top/https://github.com/major/MySQLTuner-perl/archive/refs/tags/v2.9.1.tar.gz"
    - "https://gh-proxy.com/https://github.com/major/MySQLTuner-perl/archive/refs/tags/v2.9.1.tar.gz"
    - "https://mirror.ghproxy.com/https://github.com/major/MySQLTuner-perl/archive/refs/tags/v2.9.1.tar.gz"
    - "https://github.com/major/MySQLTuner-perl/archive/refs/tags/v2.9.1.tar.gz"
  sha256: "384e4128991fb8573a61841cb838a74d59063607a817b1da6c86739e439eb4c2"
  tar_format: tar.gz
  archive_root: "MySQLTuner-perl-2.9.1"

dependencies:
  required:
    - perl/5.42.2
  optional:
    - "mysql or mariadb client command for real database audits"
    - "mysqladmin or mariadb-admin command for real database audits"
    - "JSON Perl module for JSON/trend comparison features"
    - "Docker and Python3 for upstream MCP E2E tests"

build:
  system: custom
  steps:
    - "download official GitHub tag archive"
    - "validate runtime data files"
    - "run Perl syntax check and selected no-service upstream TAP tests when can_run(self)"
    - "install mysqltuner and mysqltuner.pl launchers plus runtime data"

patches_applied: []

test_results:
  type: local-static + true-device-shadow-ci
  upstream_total_files: 111
  upstream_selected_files: 6
  selected_assertions: 65
  test_package_assertions: 11
  passed: 5
  failed: 0
  note: |
    Local Windows PATH has no perl or conan, so conan create and Perl TAP
    execution were not run locally.  Static source archive verification was
    completed: GitHub tag tarball SHA256 matched
    384e4128991fb8573a61841cb838a74d59063607a817b1da6c86739e439eb4c2 and
    contains mysqltuner.pl, LICENSE, basic_passwords.txt, vulnerabilities.csv,
    Makefile, TESTS.md, and 111 tests/*.t files.  Python text compile checks
    for the recipe and test_package passed, YAML key checks passed, and
    git diff --check passed.  The Conan recipe runs perl -c mysqltuner.pl and
    six no-service TAP files through conanrun when can_run(self) is true.
    tests/cli_validation.t is deferred because its authentication case needs
    mysqladmin or mariadb-admin.  Full database lab/MCP tests require external
    services and are deferred to a database-client test environment.
    True-device shadow CI on OHOS aarch64 passed with L0/L1/L4/L5 pass and
    overall exit 0.  build() ran 6 upstream TAP files with 65 tests passing,
    test_package executed successfully, and the destructive negative test
    confirmed the consumer check depends on the packaged mysqltuner binary.
    CI L2 direct exec remains a non-blocking skip on the hmdfs package cache,
    while explicit Perl execution under Conan runenv was verified.

compatibility:
  level: low
  notes: "Pure Perl CLI; OHOS package rewrites shebang to /data/service/hnp/bin/perl and exposes bin through PATH."

knowledge_gained:
  - "mysqltuner 2.9.1 is a single-file Perl application with runtime data files; real audits depend on external MySQL/MariaDB client commands, while core CLI parsing can be tested without a database."
  - "OHOS Conan Perl helper scripts such as prove should be invoked as perl -S prove under conanrun so PATH and PERL5LIB are applied together."
  - "Manual OHOS shadow CI can fail before printing L0 diagnostics when /tmp is read-only; use job-local TMPDIR/TMPPREFIX for isolated runs."
  - "mysqltuner's upstream cli_validation.t contains a mysqladmin-dependent authentication case, so it is not a pure no-service build-time TAP test."

knowledge_drafts:
  - "knowledge_drafts/DRAFT-mysqltuner-ohos-perl-runenv-prove.kv"
  - "knowledge_drafts/DRAFT-mysqltuner-shadow-ci-readonly-tmp.kv"
  - "knowledge_drafts/DRAFT-mysqltuner-source-url-fallback.kv"
  - "knowledge_drafts/DRAFT-mysqltuner-test-boundary-mysqladmin.kv"
  - "knowledge_drafts/DRAFT-mysqltuner-hmdfs-direct-exec-l2.kv"

difficulty_candidate:
  class: B
  rationale: |
    Although mysqltuner is pure Perl, the successful OHOS adaptation required
    resolving multiple device/CI/runtime boundary issues: Conan Perl runenv and
    helper-script shebang behavior, read-only /tmp during manual shadow CI,
    GitHub source timeout with SHA-checked mirror fallback, command-aware
    upstream TAP triage around mysqladmin/mariadb-admin, and hmdfs direct-exec
    limitations handled through an interpreter-explicit test_package.  These
    issues were verified on true-device shadow CI rather than inferred from
    static source review.

references:
  - "https://github.com/major/MySQLTuner-perl"
  - "https://github.com/major/MySQLTuner-perl/releases/tag/v2.9.1"
