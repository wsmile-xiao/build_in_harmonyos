# test_package/MANIFEST.yml

package: mysqltuner/2.9.1
homepage: "https://github.com/major/MySQLTuner-perl"

upstream_check_command: "perl -c mysqltuner.pl && perl -S prove tests/cli_options.t tests/cli_forcemem_human.t tests/version_consistency.t tests/unit_version_helpers.t tests/unit_cli_helpers.t tests/unit_utilities.t"
upstream_test_in_build: true
upstream_test_command: "Conan build() runs the selected no-service TAP subset above when can_run(self) is true"

upstream_tests:
  - file: tests/
    source: "MySQLTuner-perl-2.9.1/tests/*.t"
    description: "Official archive contains 111 TAP files; six no-service CLI/version/helper tests are selected for Conan build, while Docker/database E2E tests and mysqladmin-dependent authentication validation are deferred."
    command: "perl -S prove <selected no-service tests>"

test_package_tests:
  - file: test_mysqltuner.py
    description: "Validates packaged launchers, runtime data files, license, --help output, memory option parsing, and invalid port rejection using the packaged Perl runtime."
    command: "python3 test_mysqltuner.py <package_folder> <perl>"
  - file: conanfile.py
    description: "Checks package layout and invokes test_mysqltuner.py through Conan VirtualRunEnv when can_run(self) is true."
    command: "conan test"

assertion_count: 11
