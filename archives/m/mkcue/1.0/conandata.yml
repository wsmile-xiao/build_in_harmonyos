# conandata.yml — mkcue 1.0
#
# 上游身份：Eric Gillespie <epg@pretzelnet.org> 的 mkcue，分发点 https://diplodocus.org/。
# 上游只有 Subversion 仓库（源码内嵌 `$URL: svn+ssh://diplodocus.org/svn/projects/release/mkcue-1/`），
# **没有公开 git 仓库、没有 commit SHA 可锚定**；2005 年起未再发布新版本。
#
# 源码来源（R39）：上游官网的发行包链接 https://diplodocus.org/dist/audio/mkcue-1.tar.bz2
# 已失效（实测 HTTP 404，下载体为 373 字节 HTML），故取 Debian **官方主归档**
# ftp.debian.org 上的上游原始发行包 mkcue_1.orig.tar.gz：
#   sha256 2aaf57da4d0f2e24329d5e952e90ec182d4aa82e4b2e025283e42370f9494867
#   size   80650 bytes, Last-Modified 2005-08-11
#   （与 Debian 源包 1-9 的 *.orig.tar.gz 逐字一致，见 1-9.dsc 的 Checksums-Sha256；
#     解包即上游树 mkcue-1.orig/，非 +dfsg / .debian.tar.xz 形式的重打包）
# ftp.debian.org 为 Debian 官方归档主机（非第三方镜像/代理/个人 fork）；
# 同路径的 deb.debian.org 等主机命中 PF7 源 URL 主机黑名单，故不使用。
#
# 版本号说明：Conan 的版本正则 `^[a-z0-9_][a-z0-9_+.-]{1,100}$` 要求至少 2 个字符，
# 上游字面版本 `1` 非法（conan create → ERROR: Invalid package version '1'；
# 制品仓同样拒绝），故归一化为 `1.0`，目录/分支同步为 1.0 / feat/mkcue-1.0。

sources:
  url: "https://ftp.debian.org/debian/pool/main/m/mkcue/mkcue_1.orig.tar.gz"
  sha256: "2aaf57da4d0f2e24329d5e952e90ec182d4aa82e4b2e025283e42370f9494867"

patches:
  "1.0":
    - patch_file: "patches/0001-GNUmakefile.in.patch"
      patch_description: "Create the install destination directory before copy (upstream install rule never used INSTALL_DIR)"
      patch_type: portability
    - patch_file: "patches/0002-build-config.guess.patch"
      patch_description: "Add HarmonyOS to the bundled 2002 config.guess (aarch64-unknown-linux-ohos)"
      patch_type: portability
    - patch_file: "patches/0003-build-config.sub.patch"
      patch_description: "Accept aarch64/arm64 and linux-ohos host triplets in the bundled config.sub"
      patch_type: portability
    - patch_file: "patches/0004-configure.patch"
      patch_description: "Use umask 022 for the config.status tmp dir (HMDFS makes umask 077 dirs unwritable)"
      patch_type: portability
    - patch_file: "patches/0005-diskid.h.patch"
      patch_description: "Rename local byte typedef to byte_t to avoid C++17 std::byte ambiguity"
      patch_type: portability
