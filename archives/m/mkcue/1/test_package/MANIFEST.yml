# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e check (R51 three-step inventory).

package: mkcue/1.0
homepage: "https://diplodocus.org/"

# ---- Upstream test audit (status: no_tests) ----
# Audited the canonical source mkcue_1.orig.tar.gz
# (sha256 2aaf57da4d0f2e24329d5e952e90ec182d4aa82e4b2e025283e42370f9494867):
upstream_tests_exist: false
upstream_test_audit:
  - source: "tarball file list (tar tzf)"
    reason: "顶层仅 AUTHORS COPYING GNUmakefile.in README aclibs aclocal.m4 build/{config.guess,config.sub,install-sh,setup} config.h.in configure configure.ac diskid.cc diskid.h errors.h mkcue.cc osdep/*；无 tests/、t/ 目录，无 *.test 测试源文件。"
  - source: "GNUmakefile.in build targets"
    reason: "构建目标清单仅 all / mkcue / clean / maintainer-clean / install / dist（.PHONY 同），无 check / test 目标；故 make check 无规则可执行。"
  - source: "configure.ac"
    reason: "全文检索 test/check 仅 3 处且均非测试：configure.ac:33 dnl Checks for programs.、configure.ac:38 AC_CHECK_SIZEOF(long)、configure.ac:41 if test -z ${INSTALL_DIR}。无 AC_CONFIG_TESTDIR、无 TESTS 注册。"
  - source: "Debian packaging (debian/rules, debian/control)"
    reason: "debian/rules 只做 dh 标准流程并生成 man 页，无 dh_auto_test / TEST_TARGET / override_dh_auto_test；debian/control 仅为打包元数据。"
  - conclusion: "上游静态测试总数 = 0；由 test_package 真实执行打包后的 mkcue 二进制补足 9 条消费端校验（见 test_package_tests），不冒充上游覆盖。"

# rule4 强制字段：总数显式声明，不缺省
upstream_test_total: 0
upstream_test_count_method: autotools_tests
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_skipped: 0

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# ---- Consumer tests (test_package) ----
# test_package/conanfile.py runs test_mkcue.py against the packaged
# bin/mkcue, parses its deterministic "RESULT: P passed, F failed" trailer
# into HMBS_TEST_PACKAGE_RESULT, and emits HMBS_UPSTREAM_TEST_RESULT
# (status=no_tests, 0 counts).
test_package_tests:
  - file: test_mkcue.py
    description: "真实执行打包后的 mkcue 二进制：6 例上游行为（README 默认设备/显式设备打开失败、-t 0/-t 100 拒绝、-t 1 接受后设备失败、未知选项 usage）+ 3 例鸿蒙平台（AArch64 ELF、.codesign 段、OHOS musl 解释器）。另含负向对照（未知选项必失败）证明 harness 能抓真失败；输出以 RESULT 行给出确定性计数。"
    command: "python3 test_mkcue.py <package>/bin"

assertion_count: 9
