# 软件级 manifest — mkcue
# 遵循 ARCHIVE-SPEC v3.0

software: mkcue
description: 从 CD 的 TOC（Table Of Contents）生成 CUE sheet 的命令行工具
category: sound
license: LGPL-2.1-or-later
homepage: https://diplodocus.org/
repository: https://diplodocus.org/ (SVN svn+ssh://diplodocus.org/svn/projects/release/mkcue-1/, 无公开 git)
keywords:
  - cue-sheet
  - cd
  - toc
  - audio
  - cdrom-ioctl

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游只有 Subversion 仓库（源码内嵌 $URL: svn+ssh://diplodocus.org/svn/projects/release/mkcue-1/），无公开 git、无 commit SHA；canonical 版本 1 源码 = Debian 原始发行包 mkcue_1.orig.tar.gz（sha256 2aaf57da…94867，2005-08-11），与 Debian 1-9.dsc 的 Checksums-Sha256 一致"
    - "构建系统是极简 autotools：随包分发预生成的 configure（AC_INIT(mkcue, 1, ...)）+ 手写 GNUmakefile.in；链接行只含自身目标文件（mkcue.o mb.o，无 -l），Linux/OHOS 目标下第三方依赖为 0"
    - "2002 年的 build/config.guess 不认 HarmonyOS：configure 的 AC_CANONICAL_HOST 阶段会以 'unable to guess system type' 直接退出（知识库 E007）；补丁增加 `*:HarmonyOS:*:*` 分支输出 aarch64-unknown-linux-ohos"
    - "patch-autotools-ohos.pl 对 2002 版 config.guess 生成的 GUESS= 赋值分支缺少 echo/exit，脚本会继续走到末尾报错；本配方在该分支补上 `echo ...; exit 0`（框架反馈已记录）"
    - "config.sub（2002-09-05）不认 aarch64/arm64 与 linux-ohos：补丁增加 CPU 别名 aarch64|arm64 与 KERNEL-OS 组合 linux-ohos，使 aarch64-linux-ohos / aarch64-unknown-linux-ohos 规范化为 aarch64-unknown-linux-ohos（E007/E072）"
    - "HMDFS 上 config.status 用 umask 077 创建 ./confstatXXXXXX 会 Permission denied（目录属主 UID 被映射），导致 config.h 生成失败；补丁把 configure 中 umask 077 改为 022（E011/E110/E052）"
    - "osdep/mb_linux.cpp 依赖内核头 <linux/cdrom.h> 与 CDROM* ioctl：OHOS SDK sysroot 已随附该头（sysroot/usr/include/linux/cdrom.h），无需平台宏或 stub"
    - "OHOS SDK clang 驱动默认 `ld.lld --code-sign`，链接出的 ELF 天然带 .codesign 与 musl 解释器 /lib/ld-musl-aarch64.so.1；配方仅在签名缺失时才调用 binary-sign-tool"
    - "Conan 把 cppstd=17 传给编译器后，diskid.h 的全局 `typedef unsigned char byte;` 与 C++17 std::byte 二义（该头 31 行有 `using namespace std;`）；补丁把本地 typedef 重命名为 byte_t"
    - "mkcue 的手写 GNUmakefile 不是 VPATH-clean：AC_LINK_FILES 把 mb.cc/mb.h 生成在 build 目录，而 diskid.h 等在 source 目录，两个翻译单元双向互相包含；配方在 generate() 里显式加 `-I<source_folder> -I<build_folder>`，不改上游 Makefile"
    - "Conan 版本号正则要求 >=2 字符（`^[a-z0-9_][a-z0-9_+.-]{1,100}$`），上游字面版本 `1` 非法，故归一化为 `1.0`（制品 ref = mkcue/1.0；分支 = feat/mkcue-1.0）"
    - "上游完全没有测试：tarball 无 tests/ 目录，GNUmakefile.in 也无 check/test 目标（见 reports/upstream-test-entry.md）；test_package 的 9 例不能当作上游测试统计"
  common_dependencies: []

