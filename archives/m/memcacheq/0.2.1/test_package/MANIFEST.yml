# test_package/MANIFEST.yml - memcacheq 0.2.1
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）。详见 docs/TEST_QUALITY_SPEC.md
#
# 计数口径（唯一口径，贯穿 MANIFEST / notes.md / 测试日志 / PR 两张表）：
#   按「独立检查项数量」计数 —— 每个检查项可单独判定成败、单独打印 ok/FAIL，
#   同一检查项在 build() 与 test_package 各执行一次也只计 1 项。
#   适配后合计 22 项 = 功能补全 15 项（F1-F13b）+ 鸿蒙特有 7 项（A1-A7）。

package: memcacheq/0.2.1
homepage: "https://memcacheq.googlecode.com/"

# ── 上游测试套件存在性（经审计官方 tar 包确认）────────────────────
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

upstream_test_audit:
  source_tarball: "memcacheq-0.2.1.tar.gz (https://distfiles.macports.org/memcacheq/)"
  source_sha256: "ace33313568959b5a301dda491f63af09793987b73fd15abd3fb613829eda07e"
  build_system: "autotools（configure.ac + Makefile.am；tarball 自带 configure）"
  scanned_for:
    - "tests/ 或 test/ 目录内的可执行测试"
    - "Makefile.am 中的 check / test 目标（仅 bin_PROGRAMS + EXTRA_DIST）"
    - "configure.ac 中的 automake 测试变量（TESTS / AM_TESTS）"
    - "gtest / criterion / check / CUnit 等 C 测试框架绑定"
    - "*_test.c / test_*.c 命名的测试源文件"
    - "CI 配置（.github/workflows、.travis.yml 等）"
  scan_result: >-
    tarball 根目录共 30 个文件：8 个 .c + 4 个 .h 源文件、autotools
    脚本（configure/configure.ac/Makefile.am/Makefile.in/aclocal.m4 等）、
    run.sh（启动示例，非测试）、docgen.sh、AUTHORS/LICENSE/README/TODO。
    tools/ 目录仅有 3 个文件：memcache.py（上游 memcached 客户端库的
    拷贝，供 mqpush.py/mqpush 演示用）、mqpush.py 和 mqpop.py（两个
    交互式演示脚本，无断言、无期望输出判定）。Makefile.am 无 check/test
    目标（bin_PROGRAMS = memcacheq，EXTRA_DIST = tools AUTHORS LICENSE
    run.sh），configure.ac 无任何测试框架探测。无 CI 配置文件。
  reason: >-
    memcacheq 0.2.1 上游无任何测试框架与测试目标（tools/ 下仅为演示
    脚本），按 no_tests 处理；适配后由 test_package 补全协议级功能
    测试。

# ── 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_total_run: 0
upstream_test_passed: 0
upstream_test_failed: 0

# ── 适配后新增测试 ────────────────────────────────────────────────
# 功能补全（对实际产物做协议级黑盒测试，跑在真机/CI worker 上）
test_package_tests:
  - file: test_package/test_memcacheq.sh
    description: >-
      F1-F13b: 启动打包产物中的 memcacheq 守护进程，通过 TCP 用
      memcache 协议验证 version/set(STORED)/get(VALUE)/空队列(END)/
      FIFO 顺序/多队列隔离/stats/stats queue/delete(NOT_FOUND)/
      未知命令(ERROR)/长度校验/-h/-i，共 15 个独立检查项
    command: "sh test_package/test_memcacheq.sh <package bindir>"

  - file: test_package/ohos_abi_check.py
    description: >-
      A1-A7: 纯 Python ELF 静态检查 —— ELF64/AArch64、OHOS musl
      interpreter、.note.ohos.ident、musl+libevent+libdb 的 DT_NEEDED
      精确集合、无宿主 RPATH/RUNPATH、NX+PIE+RELRO+BIND_NOW、无
      glibc 符号版本，共 7 个独立检查项
    command: "python3 test_package/ohos_abi_check.py --binary <package bin>/memcacheq"

# 计数汇总（与 notes.md 申报表一致）
total_after_adaptation: 22
functional_cases: 15
ohos_specific_cases: 7
