software: memcacheq
display: "MemcacheQ"
description: "基于 memcache 协议的持久化 FIFO 消息队列守护进程（libevent + BerkeleyDB）"
category: db
homepage: "https://memcacheq.googlecode.com/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "2008 年 autotools tarball 无平台探测层（无 config.guess/config.sub、无 AC_CANONICAL_HOST），OHOS 工具链纯靠 CC/CFLAGS 进入，无需三元组补丁"
    - "configure/config.status 用 umask 077+mktemp 建临时目录，HMDFS 上属主自己都不可写（E012 变体），需改 umask 022 并重定向到私有目录"
    - "hashtable.h 的 extern inline 是 GNU89 语义，cppstd=gnu20 下需 CFLAGS 注入 -fgnu89-inline（零源码补丁）"
    - "musl loader 靠 LD_LIBRARY_PATH 找 libevent/libdb（产物无 RPATH 属 HNP 加固基线），配方经 runenv_info 传递"
  common_dependencies:
    - libevent
    - db

versions:
  "0.2.1":
    status: built
    build_date: "2026-09-29"
    conan_ref: "memcacheq/0.2.1"
