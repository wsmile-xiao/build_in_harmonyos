# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mpmcqueue/1.0
homepage: "https://github.com/rigtorp/MPMCQueue"

# 上游测试命令 (ctest 运行 CMake 注册的 MPMCQueueTest)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
# （header-only 库无编译产物；上游测试由本 test_package 消费者测试等效覆盖）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/MPMCQueueTest.cpp
    source: mpmcqueue-1.0/src/MPMCQueueTest.cpp
    description: "上游 MPMC 队列功能测试（构造/析构追踪、空满边界、多线程推拉、对齐与填充验证）"
    command: "./MPMCQueueTest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：实例化 MPMCQueue<int> 完成入队/出队往返与多生产者多消费者冒烟"
    command: "./test_mpmcqueue"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
