software: msolve
display: "msolve"
description: "Library for Polynomial System Solving through Algebraic Methods"
category: math
homepage: "https://msolve.lip6.fr"
license: GPL-2.0+
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要修改 configure 中的 umask 077 为 umask 022（E011）"
    - "需要更新 config.guess/config.sub 以支持 HarmonyOS（E007）"
    - "需要使用 --disable-shared 避免 PIC 编译问题（P002）"
  common_dependencies:
    - gmp
    - mpfr
    - flint

versions:
  "0.9.5":
    status: built
    build_date: "2026-06-16"
