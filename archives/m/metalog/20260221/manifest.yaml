patches_applied:
  - "0001-config-guess-harmonyos.patch"
  - "0003-configure-hmdfs-umask.patch"
knowledge_gained:
  - "GitHub tag archive does not include generated configure scripts; autoreconf -fi before Autotools.configure()."
  - "GNU config.guess/sub need HarmonyOS detection after autoreconf; on HarmonyOS, a maintained configure patch sets the HMDFS temporary-directory umask to 022."
  - "Use --test-config for isolated configuration checks; do not start the daemon or claim the system /dev/log socket in consumer tests."
