software: metalog
display: "metalog"
description: "Syslog daemon with PCRE2 filtering and optional gzip rotation"
category: system
homepage: "https://github.com/hvisage/metalog"
license: GPL-2.0-only
build_system: autotools+make

ohos_adaptation:
  key_points:
    - "Builds the upstream Autotools project with Make after bootstrapping its GitHub source archive using autoreconf -fi."
    - "PCRE2 is required; zlib-based rotated-log compression is an optional recipe option."
    - "Consumer tests use --test-config and never bind the host system syslog socket."
  common_dependencies:
    - pcre2
    - zlib

versions:
  "20260221":
    status: built
    build_date: "2026-10-02"
