software: mimetic
display: "mimetic"
description: "mimetic - a free MIME (email) library written in C++"
category: library
homepage: "https://www.codesink.org/mimetic_mime_library.html"
license: MIT

build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 config.sub（2007）不含 aarch64/linux-ohos，需补丁后以 --build/--host=aarch64-linux-ohos 显式配置"
    - "configure 的 umask 077 在 HMDFS 上创建不可写临时目录（E011），改为 022"
    - "aarch64 的 char 为无符号，Base64 解码表 -1 哨兵必须用 signed char"
    - "C++17 兼容：移除 register、指针不要与 0 做有序比较、字面量与宏名间补空格"
    - "上游测试挂在 test/all-local（随 make 执行），无 make check 入口"
  common_dependencies: []

versions:
  "0.9.8":
    status: built
    build_date: "2026-09-18"
    note: "首次适配到 HarmonyOS PC（aarch64）。无外部依赖；上游 65 个测试函数随构建执行。"
