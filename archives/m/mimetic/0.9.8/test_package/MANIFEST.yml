package: mimetic/0.9.8
homepage: "https://www.codesink.org/mimetic_mime_library.html"

# 上游测试入口：mimetic 没有 `make check` 目标，cutee 套件挂在 test/Makefile 的
# all-local 上，随 `make` 一起构建并执行；W3/CI 的 conan create 因此每次都真实运行。
upstream_check_command: "make（test/all-local 构建 cutee 并执行 ./runtest；上游无 check 目标）"
upstream_test_in_build: true
upstream_test_command: "cd test && ./runtest"

upstream_tests:
  source: "mimetic-0.9.8 源码树 test/ 目录（cutee 0.4.2 框架）"
  scope: >-
    19 个测试类、65 个测试函数（TEST_FUNCTION）覆盖 base64、quoted-printable、
    tokenizer、rfc822 头/地址/日期时间、MIME 消息构造与解析、文件/目录、
    circular_buffer 等模块。构建期实际运行，输出统计为
    Success 65 / Failed 0，检查数 2740 / Failed 0。
  total: 65
  class_count: 19
  assertion_count: 2740
  executed: 65
  passed: 65
  failed: 0
  command: "make（conan create build() 内实际执行；日志见 reports/w3-local-ci.log）"
  classes:
    - t.base64.h
    - t.circular_buffer.h
    - t.codec.h
    - t.composite.h
    - t.contentdisposition.h
    - t.contenttype.h
    - t.directory.h
    - t.fieldparam.h
    - t.file.h
    - t.find_bm.h
    - t.mimemessage.h
    - t.parser.h
    - t.qp.h
    - t.rfc822.h
    - t.strutils.h
    - t.tokenizer.h
    - t.tree.h
    - t.utils.h
    - t.version.h

test_package_tests:
  - file: "test_mimetic.cpp"
    description: >-
      消费者 API 验证（9 条断言）：库版本号 mimetic::version == 0.9.8；
      Base64 已知向量编码与解码回环（覆盖 aarch64 下 char 无符号的解码表修复）；
      quoted-printable 编解码回环；MimeEntity 构造 → RFC822 序列化 →
      重新解析后 Subject/From/正文/Content-Type 一致。
    command: "test_mimetic"

test_package_test_count: 1
test_package_assertion_count: 9
