# conandata.yml — mimetic 0.9.8

sources:
  url: "https://www.codesink.org/download/mimetic-0.9.8.tar.gz"
  sha256: "3a07d68d125f5e132949b078c7275d5eb0078dd649079bd510dd12b969096700"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Report aarch64-unknown-linux-ohos when uname -s is HarmonyOS (bundled config.guess predates OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Accept the aarch64 machine name and the linux-ohos OS triplets in the bundled config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "Use umask 022 for the config.status temp dir and probe CONFIG_SHELL before the re-exec (HMDFS: umask 077 dirs unwritable, E011; hnp bash cannot getcwd, E386)"
    patch_type: "portability"
  - patch_file: "patches/0004-mimetic-codec-base64.cxx.patch"
    patch_description: "Declare the base64 decode table as signed char so the -1 sentinel works where char is unsigned"
    patch_type: "portability"
  - patch_file: "patches/0005-mimetic-codec-base64.h.patch"
    patch_description: "Match the signed char decode table declaration in the public header"
    patch_type: "portability"
  - patch_file: "patches/0006-mimetic-libconfig.h.patch"
    patch_description: "Provide the uint typedef for the CONFIG_UNIX branch (OHOS libc does not define it)"
    patch_type: "portability"
  - patch_file: "patches/0007-mimetic-os-mmfile.cxx.patch"
    patch_description: "Compare the mmap result with MAP_FAILED instead of a pointer/zero ordering comparison"
    patch_type: "portability"
  - patch_file: "patches/0008-mimetic-parser-itparser.h.patch"
    patch_description: "Drop the register storage class specifier removed by C++17"
    patch_type: "portability"
  - patch_file: "patches/0009-test-cutee.cxx.patch"
    patch_description: "Separate string literals from the RUNTEST_NAME macro (C++11 user-defined-literal lexing)"
    patch_type: "portability"
