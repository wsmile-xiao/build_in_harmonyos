# conandata.yml — metaproxy 1.22.4

sources:
  url: "https://ftp.indexdata.com/pub/metaproxy/metaproxy-1.22.4.tar.gz"
  sha256: "79bffb2786bfd7612dab9603bd69ab1505c6d04053db192e0cc9ef6a842450dc"

# NOTE: patches are listed in descending configure-line order (0002 ~20980,
# 0001 ~19819, 0003 ~19810) on purpose: conan applies patches sequentially,
# so the later-file patch goes first and every hunk keeps pristine-tree
# line numbers (no cross-shift; verified with git apply --check, zero offset).
# 0004 touches a different file (src/test_*.cpp) so its position is free;
# it is listed last.
patches:
  - patch_file: "patches/0002-configure-hmdfs-umask.patch"
    patch_description: "Use an HMDFS-compatible umask when configure creates its temporary directory (same pattern as yaz 5.37.3)"
    patch_type: "portability"
  - patch_file: "patches/0001-configure-xslt-gate-warning.patch"
    patch_description: "Downgrade the 'YAZ not compiled with Libxslt support' configure error to a warning: XSLT is linked directly from libxslt/1.1.45.1, no YAZ XSLT helpers are used"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-boost-regex-header-only.patch"
    patch_description: "Accept header-only Boost.Regex when libboost_regex is absent: downgrade the AX_BOOST_REGEX hard error to a warning, leaving BOOST_REGEX_LIB empty (Boost.Regex is header-only since 1.77; only the deprecated POSIX C API needs the compiled lib)"
    patch_type: "portability"
  - patch_file: "patches/0004-test-frontend-net-unix-skip.patch"
    patch_description: "Report test_filter_frontend_net_3 unix:socket bind denial as automake SKIP (exit 77) instead of FAIL: filesystem AF_UNIX may be denied on HarmonyOS (HMDFS EPERM / read-only / path-length)"
    patch_type: "portability"

# Header-only Boost supplement (Round 7): boost/1.91.0.1.3 stages only a
# subset (filesystem/graph/iostreams/json/log/multiprecision/program_options/
# regex/test/thread + auto-gathered deps), so metaproxy sources using
# boost/format.hpp, boost/algorithm/string.hpp, boost/lexical_cast.hpp,
# boost/smart_ptr/*, boost/utility.hpp fail with "file not found".
# These submodule tarballs are the SAME upstream 1.91.0 as the boost recipe's
# boost-1.91.0-1-cmake base (tag boost-1.91.0), header-only, assembled into a
# single extra -I dir in source(). The compiled thread/test/regex deps stay
# on boost/1.91.0.1.3; no version change, no boost package edit.
boost_headers:
  version: "boost-1.91.0"
  libs:
    - {name: "format", url: "https://github.com/boostorg/format/archive/refs/tags/boost-1.91.0.tar.gz", sha256: "0efa0f4cf19c98e4f4f743a5bf65a02bee253600dbb6ad02873edc43b6623c5b"}
