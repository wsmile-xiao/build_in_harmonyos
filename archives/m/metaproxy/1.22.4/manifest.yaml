# 版本级 manifest — metaproxy 1.22.4
# 遵循 ARCHIVE-SPEC v2.0（首轮：真机预检前，status pending）

version: "1.22.4"
software: "metaproxy"
status: pending
build_system: autotools

source:
  url: "https://ftp.indexdata.com/pub/metaproxy/metaproxy-1.22.4.tar.gz"
  sha256: "79bffb2786bfd7612dab9603bd69ab1505c6d04053db192e0cc9ef6a842450dc"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--with-yazpp=pkg"
    - "--with-boost=<boost package folder>"
  dependencies:
    - yaz/5.37.3
    - yazpp/1.9.2
    - boost/1.91.0.1.3
    - libxml2/2.15.3.1
    - libxslt/1.1.45.1
    - pkgconf/3.0.5
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-xslt-gate-warning.patch"
  - "0002-configure-hmdfs-umask.patch"
  - "0003-configure-boost-regex-header-only.patch"
  - "0004-test-frontend-net-unix-skip.patch"

supplement:
  boost_headers_version: "boost-1.91.0"
  reason: "boost/1.91.0.1.3 stages INCLUDE subset only; vendor same-version header-only trees (format/algorithm/smart_ptr/lexical_cast/utility/core/range/iterator/mpl/type_traits/tuple/concept_check) as extra -I, compiled thread/test stay on the boost package"
  count: 12

knowledge_gained:
  - "metaproxy configure 用 --with-yazpp=pkg 走 pkg-config（PkgConfigDeps 生成正确 yazpp.pc），避开已安装 yazpp-config 烤死 prefix=/ 的 E355 陷阱"
  - "metaproxy 直连 libxslt（filter_zoom/filter_query_rewrite），不依赖 YAZ 的 XSLT 构建标志，configure 门禁降为警告"
  - "Boost.Regex header-only since 1.77: configure AX_BOOST_REGEX hard error downgraded to warning, empty BOOST_REGEX_LIB links the C++ API used by metaproxy (filter_http_rewrite/url_recipe); POSIX C API unused"
  - "profile CONFIG_SHELL 死 bash 去毒：配方 _resolve_shell 永不复用 CONFIG_SHELL（HMBS 保证的 /bin/sh 优先）+ generate 存干净值 + build/package  scrub 生成脚本，configure re-exec Error 127 消除且全部 configure 标志不变"
