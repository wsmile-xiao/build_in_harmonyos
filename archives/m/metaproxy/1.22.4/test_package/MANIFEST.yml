# test_package/MANIFEST.yml
# 上游官方测试声明文件（metaproxy 1.22.4）

package: metaproxy/1.22.4
homepage: "https://www.indexdata.com/resources/software/metaproxy/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check -j1（先 TESTS= 编译，再 VirtualRunEnv 下真跑）"

# 上游测试总数（静态口径，与官方一致）
upstream_test_total: 26
upstream_test_count_method: autotools_tests

# 上游实际运行的测试程序（src/Makefile.am: check_PROGRAMS = TESTS，共 26 个
# Boost.Test 测试程序；TESTS=$(check_PROGRAMS)）
upstream_tests:
  - file: src/Makefile.am
    source: metaproxy-1.22.4.tar.gz/src/Makefile.am
    description: "Run the 26 Boost.Test-based Automake test programs registered by metaproxy (test_filter_*, test_session*, test_util, test_xmlutil, ...)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：链接静态 libmetaproxy.a，调用 metaproxy::util 真实 API（database_name_normalize 3 组、memcmp2 4 组、to_string 1 组），8 组断言全部相等才退出码 0"
    command: "./test_package（经 conanrun 环境执行）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
# 口径: 消费者 1 程序 8 组断言；上游 26 个注册测试程序由 make check 执行
