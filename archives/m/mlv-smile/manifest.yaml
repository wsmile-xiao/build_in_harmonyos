# manifest.yaml - mlv-smile 软件级元数据
software: mlv-smile
display: "SMILE"
description: "序列中简单/结构化模体的精确抽取与统计显著性评估工具集（Debian mlv-smile 包上游 SMILE v1.47）"
category: "bioinformatics"
homepage: "http://www-igm.univ-mlv.fr/~marsan/smile_english.html"
license: GPL-2.0-or-later
build_system: "bare Makefile（递归子目录 P_BLOCS / P_BLOCS+DELTA / SigStat，无 configure）"

ohos_adaptation:
  key_points:
    - "M18：三个子 Makefile 均 CC=gcc 烧死，OHOS 无 gcc ⇒ make 命令行 CC= 覆盖（经 MAKEFLAGS 传给递归子 make）"
    - "无 configure、无 install 目标：package() 手工布局 bin/ 与 res/examples/（Lanceur 示例数据供消费者测试）"
    - "gcc -ansi/-Wall/-O3 旗标 clang 兼容，未改旗标"

versions:
  "1.47":
    status: built
    build_date: "2026-09-25"
    source_url: "https://deb.debian.org/debian/pool/main/m/mlv-smile/mlv-smile_1.47.orig.tar.gz"
    source_sha256: "5924b49ca138c1ec086fde04a78d52081b93d27e1ba3dd855bbdc49646fe2a75"
