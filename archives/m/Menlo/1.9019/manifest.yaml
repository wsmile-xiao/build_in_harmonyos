software: Menlo
version: "1.9019"
status: published
publish_status: published
category: perl
build_system: perl_makefile
license: perl_artistic

# 编译信息
compile_date: 2026-06-16
compiler: clang 18.1.8
perl_version: 5.42.0

# 依赖关系
dependencies:
  runtime:
    - perl (>= 5.008)
  build:
    - perl

# 构建选项
configure_options: []
make_options: []

# 源码信息
source:
  url: "http://cpan.metacpan.org/authors/id/M/MI/MIYAGAWA/Menlo-1.9019.tar.gz"
  sha256: ""
  tar_format: tar.gz

# 平台适配
platform_notes: |
  Menlo 是纯 Perl 模块（CPAN 客户端后端），无 XS 组件，编译简单。

  鸿蒙平台适配：
  1. 主模块为纯 Perl 实现，编译无平台问题 ✅
  2. 无二进制文件，仅 Perl 库文件 ✅
  3. 24 项运行时依赖全部已验证可用 ✅
  4. 无 SELinux/HMDFS 限制（纯 Perl） ✅

# 质量门禁
quality_checks:
  g0_clean_build: pass
  g1_binary_integrity: pass  # 无二进制
  g2_functional: pass  # 模块加载+子模块+API+Index+依赖完整
  g3_portability: pass
  g4_archive: pass

# 产物信息
artifacts:
  package: Menlo-1.9019-ohos-aarch64.tar.gz
  size: 31KB
  files: 7  # 7个 .pm 文件
  patches: 0

# 测试信息
test_results:
  make_test: pass  # 2 tests, 1 assertion
  module_loading: pass  # 全部 7 个模块
  api_test: pass  # Menlo::Dependency->new
  index_backends: pass  # MetaCPAN, MetaDB, Mirror 全部可用
  dependencies: pass  # 24/24 运行时依赖已验证

# 知识提取
knowledge_gained:
  - Menlo 是纯 Perl 模块，编译无平台问题
  - Menlo 是 cpanm 2.0 的后端，提供模块化接口
  - 24 项运行时依赖需逐一安装验证（参考 perl-dbd-pg 的全面测试经验）
  - 纯 Perl 模块不受 SELinux/HMDFS 限制，安装后立即可用
