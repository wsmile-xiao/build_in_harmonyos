software: mcfp
display: "mcfp header-only config parser (libmcfp)"
description: "Maarten Hekkelman 的 header-only C++20 配置收集库：从命令行与 INI 配置文件收集配置，单例 mcfp::config::instance() 全局可见；cif-tools 2.0.0 硬依赖"
category: foundation
homepage: "https://forge.hekkelman.net/maarten/mcfp"
license: "BSD-2-Clause"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only INTERFACE library（无二进制），CMake >=3.23，C++20"
    - "OHOS 下 CMakeToolchain 置 CMAKE_SYSTEM_NAME=Linux（Linux-like 目标，同 fast_float）"
    - "上游 test/unit-test.cpp 需 Catch2（CPM GitHub fetch，OHOS CI 禁网）且仅 top-level → BUILD_TESTING=OFF 如实 NOT_RUN；功能验证在 test_package 消费者真实跑 mcfp::config parse"
    - "cif-tools 2.0.0 的硬依赖（configure 时 CPM 拉取否则需预提供 mcfp target）；本库安装 find_package(mcfp)+mcfp::mcfp 供 cif-tools 离线消费"
  common_dependencies: []

versions:
  "1.4.2":
    status: built
    build_date: "2026-09-07"
    source_url: "https://github.com/mhekkel/libmcfp/archive/refs/tags/v1.4.2.tar.gz"
