# test_package/MANIFEST.yml — mcfp 1.4.2

package: mcfp/1.4.2
homepage: "https://forge.hekkelman.net/maarten/mcfp"

# 上游测试命令（已在 conan build() 内自动执行，见 conanfile.py _run_upstream_tests()）
# test/unit-test.cpp 需 Catch2：上游用 CPMAddPackage 从 github.com 下载，
# 本配方改由 ohpcd catch2/3.8.1 提供（find_package(Catch2) 优先，CPM 仍作兜底）；
# 上游仅当 BUILD_TESTING AND PROJECT_IS_TOP_LEVEL 才 add_subdirectory(test)，
# conan 构建即为 top-level，故置 BUILD_TESTING=ON。
upstream_check_command: "cmake -DBUILD_TESTING=ON -B build && cmake --build build && ctest --test-dir build"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际存在的测试程序（已在 conan build() 中运行 — 真机实测结果）
upstream_tests:
  - file: test/unit-test.cpp
    source: libmcfp-1.4.2/test/unit-test.cpp
    description: "mcfp 单元测试（Catch2，18 个 TEST_CASE：t_1..t_14、file_1..file_4）"
    command: "./mcfp-unit-test"
    run_status: PASS
    reason: ""

# test_package 自带的测试
test_package_tests:
  - file: test.cpp
    description: "消费者冒烟 — 编译链接 mcfp::mcfp，真实 parse CLI：-n 7 --text hello → num=7/text=hello"
    command: "./test_mcfp"

assertion_count: 3
