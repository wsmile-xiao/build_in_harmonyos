software: mcfp
version: "1.4.2"
build_system: cmake
status: built
build_date: "2026-09-07"

source:
  url: "https://github.com/mhekkel/libmcfp/archive/refs/tags/v1.4.2.tar.gz"
  sha256: "dcdf3e81601081b2a9e2f2e1bb1ee2a8545190358d5d9bec9158ad70f5ca355e"
  tar_format: tar.gz

build:
  system: cmake
  cc: clang
  cxx: clang++
  configure_options:
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_DOCUMENTATION=OFF"
  dependencies: []

patches_applied: []

knowledge_gained:
  - "mcfp 1.4.2（Maarten Hekkelman 的 header-only C++20 配置收集库，前身 GitHub mhekkel/libconfig）为纯 header-only INTERFACE CMake 工程（add_library(mcfp INTERFACE)，target mcfp::mcfp，C++20）；发布包内含 CMake 安装规则（headers→include/，mcfpConfig.cmake+mcfpConfigVersion.cmake→lib/cmake/mcfp）"
  - "OHOS 下 CMake 视作 Linux-like 目标（CMAKE_SYSTEM_NAME=Linux，同 fast_float 技法）；上游 test/unit-test.cpp 需 CPM 从 GitHub 拉 Catch2（CI worker 网络禁 GitHub）→ conan build 置 BUILD_TESTING=OFF，如实 NOT_RUN，功能验证放 test_package 消费者（真实 parse CLI/INI API）"
  - "mcfp 是 cif-tools 2.0.0 的硬依赖（configure 时 CPM 拉取，除非已提供 mcfp target；每个 cif-tools 程序链接 mcfp::mcfp）；离线 OHOS 构建必须先由本 conan 包预提供 find_package(mcfp)+target mcfp::mcfp，cif-tools 的 guard（mcfp_FOUND/libmcfp_FOUND/TARGET mcfp）即满足"
