# conandata.yml — mcfp 1.4.2
# sha256 verified 2026-09-07 against the upstream GitHub release download.

sources:
  url: "https://github.com/mhekkel/libmcfp/archive/refs/tags/v1.4.2.tar.gz"
  sha256: "dcdf3e81601081b2a9e2f2e1bb1ee2a8545190358d5d9bec9158ad70f5ca355e"

patches:
  - patch_file: "patches/0001-test-cmakelists-use-preinstalled-catch2.patch"
    patch_description: >-
      test/CMakeLists.txt runs CPMAddPackage("gh:catchorg/Catch2@3.4.0"), which
      downloads Catch2 from github.com at configure time -- a network fetch
      inside build(), and it shadows the Catch2 the artifact repo already
      provides.  Try find_package(Catch2) first and keep CPM only as a
      fallback, so the Conan catch2 package is used when one is available.
    patch_type: "portability"
