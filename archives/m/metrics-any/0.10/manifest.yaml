# 版本级 manifest — metrics-any 0.10
# 遵循 ARCHIVE-SPEC v3.0

version: "0.10"
software: metrics-any
status: built
build_date: "2026-09-18"
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # CPAN 官方发行版（R39 合规）
  url: "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Metrics-Any-0.10.tar.gz"
  sha256: "a90eadf9c8af24a516bb9a1b67061f641853f90b8fee9ffc24d2bb9720e8b99b"
  compression: tar.gz
  archive_root: "Metrics-Any-0.10"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []
  note: |
    META.json prereqs.runtime.requires 全部为 perl 核心模块
    （perl>=5.014 / List::Util>=1.29），OHOS perl 内建，无外部
    CPAN 依赖、无 Conan 依赖。
    configure.requires Module::Build>=0.4004 在 OHOS 不可得
    （设备 perl 5.42.2 与 /data/service/hnp/bin/perl 5.42.0 均无
    Module/Build.pm；制品仓 conan search perl-module-build/* 为 0 个）
    → 配方以 ExtUtils::MakeMaker（perl 核心）生成等价 Makefile.PL 替代。
    test.requires Test2::V0 由 OHOS perl 自带，故上游测试可真跑。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Perl 模块无二进制产物，沿用
    perl-uri / perl-io-multiplex / future 先例；不产生 bindirs，故无需
    commands.json，R38 不适用）。
    构建：perl Makefile.PL INSTALLDIRS=site → make → make test →
    make install DESTDIR=<staging>；package() 按登台树原样拷入
    package_folder，并以遍历定位 Metrics/Any.pm 后**回溯父级**得到 site
    目录（安装前缀随 perl 构建而异，实测
    /data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/5.42.0）。
    package_info() 以 runenv_info 注入 PERL5LIB，下游 perl 脚本可直接
    use Metrics::Any；无 C/C++ 库可链接（cpp_info.libs=[]，R26 不适用）。

    ⚠️ 解释器选择：固定使用 /data/service/hnp/bin/perl（5.42.0）。设备
    perl 5.42.2 的 Errno 未导出 EWOULDBLOCK/ENOTSUP（与 EAGAIN/EOPNOTSUPP
    同值别名被去重），会使上游 t/11adapter-file.t 编译期失败。

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues: []
  notes: |
    纯 Perl（lib/Metrics/Any.pm + Adapter* + AdapterBase/Stored.pm +
    Collector.pm），无 XS、无 C/C++ 编译、无平台相关代码，aarch64-ohos
    与上游行为一致。
    新增 Makefile.PL 仅为构建脚本补充（等价转写上游 Build.PL 的
    module_name/requires/test_requires），不改动上游源码，无需补丁。

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 83
  failed: 0
  note: |
    上游测试（R51，2026-09-18 实测，hnp perl 5.42.0）：t/ 目录 14 个 .t
    文件，`make test` 实测 **Files=14, Tests=83, Result: PASS**，零失败。
    1 个文件跳过（99pod.t，需 Test::Pod 1.00），为可选依赖缺失非失败。
    上游测试已集成进 build()（upstream_test_in_build: true）。
    适配后：test_package 消费者测试（R34 真实 API）24/24 = 100%。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CPAN 发行版以 Module::Build（Build.PL）为构建系统时，若 Module::Build 在 OHOS 不可得且制品仓无 perl-module-build，可用 perl 核心 ExtUtils::MakeMaker 生成等价 Makefile.PL 替代（逐项转写 Build.PL 的 module_name/requires/test_requires），上游 t/ 测试仍可经 make test 真实运行 (ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "纯 Perl 模块的 site 目录定位：模块位于 <site>/<Module/Path>.pm，遍历找到末级目录后必须**回溯父级**才是 site 根；直接返回末级目录会使 PERL5LIB/-I 指向错误层级——test_package 会以 missing packaged module 失败 (ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "判定 ohpcd 制品是否存在必须用 conan search <pkg>/* -r=ohpcd；conan download 对不存在/未发布的包报误导性的 system acceleration policy not enabled (ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "设备 perl 5.42.2 的 Errno 未导出 EWOULDBLOCK/ENOTSUP（与 EAGAIN/EOPNOTSUPP 同值别名被去重），依赖这些常量的 CPAN 测试会编译期失败；OHOS 预装 /data/service/hnp/bin/perl 5.42.0 的 Errno 完整——配方与 test_package 应统一固定 hnp perl (ref: DRAFT-perl-device-errno-missing-alias-constants)"

references:
  - https://metacpan.org/pod/Metrics::Any
  - https://metacpan.org/dist/Metrics-Any
