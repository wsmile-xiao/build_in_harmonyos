# test_package/MANIFEST.yml — metrics-any 0.10
# CI L0e 强制要求此文件存在（上游测试声明文件）
# 详见: docs/TEST_QUALITY_SPEC.md

package: metrics-any/0.10
homepage: "https://metacpan.org/pod/Metrics::Any"

# 上游测试命令：上游为 Module::Build（Build.PL），但 Module::Build 在 OHOS
# 不可得（设备 perl / hnp perl 均无 Module/Build.pm，制品仓亦无
# perl-module-build），故配方由 ExtUtils::MakeMaker 生成等价 Makefile.PL，
# 上游测试经 make test 运行。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试套件（2026-09-18 本机实测，hnp perl 5.42.0）：
# - t/ 目录：14 个 .t 测试文件
# - 实测结果：**Files=14, Tests=83, Result: PASS**（含 1 个 skip 文件）
#   skip：99pod.t —— `skipped: Test::Pod 1.00 required for testing POD`
#   （可选 POD 校验依赖未安装，非失败）
#
# ⚠️ 解释器选择（重要）：设备 perl 5.42.2 的 Errno **未导出**
#   EWOULDBLOCK / ENOTSUP（与 EAGAIN / EOPNOTSUPP 同值的别名被去重），
#   会使 t/11adapter-file.t 在 `use Errno qw( EAGAIN EWOULDBLOCK )` 处
#   编译期失败（Files=14, Tests=73, Result: FAIL）；hnp perl 5.42.0 的
#   Errno 完整，同套件 83/83 全过。故配方固定使用 hnp perl。
upstream_tests:
  - file: t/
    source: Metrics-Any-0.10/t/*.t
    description: "上游 perl 测试套件（14 文件 83 用例；hnp perl 5.42.0 实测 Result: PASS，1 个 skip 文件 99pod.t 需 Test::Pod，零失败）"
    command: "make test"

# test_package 消费者测试（R34 真实 API：加载打包的 Metrics::Any 与各适配器，
# 真实调用 counter/gauge/distribution/timer、标签传参、strict 模式校验、
# Null 适配器全 API）
#
# ⚠️ 两个测试源必须**独立进程**运行：Metrics::Any 的适配器一旦确定就不能在
#   同一进程内更换（上游 t/10adapter-null.t 亦为独立 .t 文件）。
test_package_tests:
  - file: test_metrics_any.pl
    description: "消费者测试（Test 适配器）：counter/gauge/distribution/timer、ARRAYref/HASHref 标签、strict 重复注册与未注册失败（18 断言）"
    command: "perl -I<site> test_metrics_any.pl"
  - file: test_metrics_any_null.pl
    description: "消费者测试（Null 适配器，独立进程）：全上报 API 静默可用、批量模式回调、$metrics 真假语义（6 断言）"
    command: "perl -I<site> test_metrics_any_null.pl"

# 测试断言总数（实测：18 + 6 = 24）
assertion_count: 24
