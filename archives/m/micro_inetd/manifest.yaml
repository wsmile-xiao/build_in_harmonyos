software: micro_inetd
display: "micro_inetd"
description: "Simple network service spawner - inetd-style single-port/single-program connection spawner"
category: network
homepage: "https://www.acme.com/software/micro_inetd/"
license: BSD-2-Clause
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Makefile 单 C 文件项目，无 configure，通过 CC/CFLAGS/LDFLAGS 命令行覆盖交叉编译"
    - "上游 install 目标硬编码 /usr/local 且无 mkdir -p，用 conan copy() 直接安装，无需补丁"
    - "上游 LDFLAGS=-s 链接期 strip 需命令行覆盖去掉"
    - "仅依赖系统 libc (musl)，无第三方依赖，无系统同名库风险"
  common_dependencies: []
  knowledge_ref:
    - "knowledge/drafts/E556-draft-1A5C.kv"
    - "knowledge/drafts/E556-draft-1A5C.md"

# 版本索引（所有已归档版本，含状态）
versions:
  "2014-8-14":
    status: built
    build_date: "2026-09-03"
    conan_ref: "micro_inetd/2014-8-14"
