# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: micro_inetd/2014-8-14
homepage: "https://www.acme.com/software/micro_inetd/"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# micro_inetd 上游无测试套件 (单 C 文件 + man 页, 无 test target, 无 CI)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (micro_inetd has no upstream test suite)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 完整 socket→stdin/stdout 契约验证: 每个测试用例独立端口 + 独立 spawner
# 进程生命周期, SIGTERM→waitpid→SIGKILL 三段式清理, 无残留
test_package_tests:
  - file: test_micro_inetd.c
    description: "T1: socket request/response relay via installed micro_inetd (dup2 socket onto stdin+stdout, byte-exact echo)"
    command: "./test_micro_inetd <installed micro_inetd> <svc_cat> <svc_exit42>"
  - file: test_micro_inetd.c
    description: "T2: service exit status 42 observable as connection EOF; spawner survives 3 sequential connections"
    command: "./test_micro_inetd <installed micro_inetd> <svc_cat> <svc_exit42>"
  - file: test_micro_inetd.c
    description: "T3: 4 simultaneous connections with interleaved request/response, independent sessions"
    command: "./test_micro_inetd <installed micro_inetd> <svc_cat> <svc_exit42>"
  - file: test_micro_inetd.c
    description: "T4: 5 sequential rounds of fresh connections against one spawner (nowait semantics)"
    command: "./test_micro_inetd <installed micro_inetd> <svc_cat> <svc_exit42>"
  - file: test_micro_inetd.c
    description: "T5: invalid service command (/nonexistent) — execv error text relayed over the socket (stderr is dup2'ed onto it), then EOF; spawner survives"
    command: "./test_micro_inetd <installed micro_inetd> <svc_cat> <svc_exit42>"
  - file: test_micro_inetd.c
    description: "T6: usage error — no args: usage text on stderr, exit code 1"
    command: "./test_micro_inetd <installed micro_inetd> <svc_cat> <svc_exit42>"

# 测试断言总数
assertion_count: 6
