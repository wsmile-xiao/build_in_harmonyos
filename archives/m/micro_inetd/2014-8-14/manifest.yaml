version: "2014-8-14"
status: built                 # published | built | failed | archived
build_date: "2026-09-03"
conan_ref: "micro_inetd/2014-8-14"

source:
  url: "https://www.acme.com/software/micro_inetd/micro_inetd_14Aug2014.tar.gz"
  sha256: "15f5558753bb50ed18e4a1445b3e8a185f3b1840ec8e017a5e6fc7690616ec52"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=<conan conf tools.build:compiler_executables:c>"
    - "CFLAGS=-O -fPIE -pie -D_FORTIFY_SOURCE=2 -ansi -pedantic -U__STRICT_ANSI__ -Wall -Wpointer-arith -Wshadow -Wcast-qual -Wcast-align -Wstrict-prototypes -Wmissing-prototypes -Wmissing-declarations -Wredundant-decls -Wno-long-long"
    - "LDFLAGS=(空，覆盖上游 -s)"
  dependencies: []            # 仅系统 libc (musl)
  cc: clang
  cxx: clang++

patches_applied: []           # 无补丁，上游源码零修改

test_results:
  type: manual                # 上游无测试套件，test_package 消费者侧验证
  total: 6
  passed: 6
  failed: 0

knowledge_gained:
  - "纯Makefile单文件项目无需补丁即可交叉编译时，跳过make install用copy()安装更可靠"
  - "inetd风格程序的可运行验证=socket作为stdin/stdout契约测试（echo服务+退出状态+并发+派生失败EOF）"
  - "上游LDFLAGS=-s链接期strip与发布流水线冲突，命令行置空覆盖"

knowledge_ref:
  - "knowledge/drafts/E556-draft-1A5C.kv"
  - "knowledge/drafts/E556-draft-1A5C.md"
