software: miniprot
display: "miniprot"
description: "Align proteins to genomes with splicing and frameshift"
category: data
homepage: "https://github.com/lh3/miniprot"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "Plain Makefile 构建（无 configure / 无 install 规则），默认 CC=gcc，需命令行覆盖为 clang（R33：从 Conan conf 获取编译器）"
    - "唯一外部依赖 zlib（kseq.h 读 .fa/.fa.gz 输入），经 Conan zlib/1.3.1 引入，build() 用 -L<zlib libdir> -lz 覆盖默认 LIBS（R26）"
    - "纯 C99 + pthread，OHOS clang 15 + musl 直接编译通过，零 patch"
    - "上游无正式测试（Makefile 无 test/check 目标，CI 仅编译）；README quick-start 已作为官方示例功能验证执行，不计入正式测试数量"
    - "上游无 install 目标，package() 手工 copy miniprot 可执行文件到 bin/"
  common_dependencies:
    - "zlib/1.3.1"

versions:
  "0.18":
    status: built
    build_date: "2026-09-01"
