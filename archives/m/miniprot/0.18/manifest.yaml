software: miniprot
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.18/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.18"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"

# 构建系统类型
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag v0.18，对应 r281）
  url: "https://github.com/lh3/miniprot/archive/refs/tags/v0.18.tar.gz"

  # 源码校验和
  sha256: "e1b5c08571fa3a4aa225da8ec9c6e744cd116b4dc50d9e187114cffe336921ee"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "LIBS=-lpthread -L<zlib_pkg_libdir> -lz -lm"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零 patch）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "miniprot 0.18（v0.18 tag = r281，2025-07-11 发布）为纯 C99 蛋白质-基因组比对工具，上游仅 lh3/miniprot 官方仓库（MIT License，Dana-Farber Cancer Institute 版权方），无官方 release asset，tarball 取自 GitHub tag 归档。"
  - "构建系统为 plain Makefile（无 configure、无 install 规则），默认 CC=gcc；CFLAGS=-std=c99 -g -Wall -O3，OHOS clang 15 直接编译通过，零 patch。"
  - "依赖：libc + libpthread + libm + zlib（bseq.c/index.c/ntseq.c 内嵌 kseq.h 读 .fa/.fa.gz 输入需要 <zlib.h>）。zlib 经 Conan 依赖引入，build() 用 -L<zlib libdir> -lz 覆盖 Makefile 默认 LIBS，避免链接到 sysroot 的系统 zlib（R26）。"
  - "上游无正式测试：Makefile 无 test/check 目标，仓库无 test 脚本（test/ 目录仅含 DPP3-hs.gen.fa.gz + DPP3-mm.pep.fa.gz 两个 fixture），CI workflow 仅 make 编译不运行测试；已实际执行 make test/make check 确认 'No rule to make target'。另外已使用 OHOS 工具链真实执行 README quick-start（DPP3 双向比对）作为示例功能验证，但不计入上游正式测试数量。"
  - "CLI 行为：--version 输出 '0.18-r281' 且 rc=0；无参数或 --help 打印 Usage 到 stderr 且 rc=1（L2 冒烟须用 --version）。"
  - "PAF 输出 14+ 列，GFF 模式输出 '##gff-version 3' 头 + mRNA/CDS/stop_codon 行；PAF 第 6 列是 'ctg:start-end' 形式的基因组坐标块。"
