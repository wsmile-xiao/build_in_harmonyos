# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: miniprot/0.18
homepage: "https://github.com/lh3/miniprot"

# 上游测试命令（经核实不存在正式测试入口）
upstream_check_command: "make test"

# 上游无正式测试（见下方 evidence）；make test/make check 均无构建目标
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无 —— 证据如下）
upstream_tests: []

# 上游无测试的证据：
#   - Makefile 仅有 all/clean/depend/libminiprot.a/miniprot/miniprot-lite 目标，
#     无 test/check；实际执行 make test / make check 均报
#     "make: *** No rule to make target 'test'.  Stop."
#   - test/ 目录仅含 DPP3-hs.gen.fa.gz + DPP3-mm.pep.fa.gz 两个 fixture 数据文件，
#     无脚本、无期望输出
#   - 无 tests/ 目录、无 .sh/.py 测试脚本
#   - .github/workflows/ci.yaml 两个 job 仅编译（make CC=gcc|clang）不运行测试
#   - README quick-start（miniprot test/DPP3-hs.gen.fa.gz test/DPP3-mm.pep.fa.gz）
#     为唯一官方演示用法，已在 build 环境用 OHOS AArch64 工具链真实执行：
#     PAF/GFF 两个 quick-start 功能场景均验证通过，但不计入上游正式测试

# test_package 中自带的测试（消费者视角，覆盖上游 quick-start + 核心能力）
test_package_tests:
  - file: "test_miniprot.sh"
    description: "12 条断言：--version（0.18-r281）；确定性合成 fixture（正链双外显子基因 + 反链拷贝）上真实比对：PAF 命中数=2、ctg1 正链全 query 覆盖（0-239, 717/717）、cigar 含内含子 N、ctg2 反链命中、AS 分数为正、cs:Z 标签存在；GFF3 头 + 2 mRNA/3 CDS 结构（ctg1 剪接成 2 外显子）；负向输入 1：随机无关蛋白 → 0 命中（rc=0）；负向输入 2：缺失参考文件 → rc=1 且 stderr 含 failed to open"
    command: "bash test_miniprot.sh"

# 测试断言总数：12
assertion_count: 12
