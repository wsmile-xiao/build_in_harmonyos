package: mbrola/3.3
homepage: "https://github.com/numediart/MBROLA"

upstream_check_command: "make check (requires the private UTILITY_TCTS diphone corpus, not shipped in the release tarball)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  counting_basis: "Automated test suites shipped in the upstream release archive"
  total: 0
  executed: 0
  passed: 0
  not_run_reason: >-
    Upstream ships no automated test suite: the 3.3 release archive has no
    tests/ directory and registers no ctest/pytest targets. The Makefile
    check/checkold targets reference a private UTILITY_TCTS diphone corpus
    (verified: `find . -name 'UTILITY_TCTS*'` is empty), so they cannot run.

upstream_examples:
  - file: "README.md"
    source: "mbrola-3.3.tar.gz"
    description: "Upstream README synthesis workflow: mbrola <database> <pho_file+> <output_file>"
    command: "mbrola fr1/fr1 fr1/TEST/bonjour.pho bonjour.wav"

test_package_tests:
  - file: "test_mbrola_consumer.py"
    scenario: "consumer"
    description: >-
      Drives the packaged CLI against the published mbrola-gr2 voice:
      CLI contract and fatal-error exits, -i database inspection, real
      synthesis of the upstream 211-command GR2 example (WAV/AU/RAW),
      duration/amplitude/determinism checks, -t/-v/-f/-l runtime options,
      -W/-w ROM round trip identity and -e error recovery.
    command: "python3 test_mbrola_consumer.py <mbrola-bin> <mbrola-gr2-root> <workdir>"

test_package_assertion_count: 66
assertion_count: 66
