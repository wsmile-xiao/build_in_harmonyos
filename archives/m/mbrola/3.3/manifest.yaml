software: mbrola
version: "3.3"
status: built
build_date: "2026-09-26"
build_system: "makefile"
conan_ref: "mbrola/3.3"

source:
  url: "https://codeload.github.com/numediart/MBROLA/tar.gz/refs/tags/3.3"
  sha256: "c01ded2c0a05667e6df2439c1c02b011a5df2bfdf49e24a524630686aea2b558"
  tar_format: tar.gz

build:
  system: makefile
  build_subdir: "."
  configure_options:
    - "make -j1 SHELL=sh CC=<conan-conf-c-compiler>"
  dependencies: []
  cc: clang
  cxx: N/A

patches_applied: []

knowledge_gained:
  - "codeload.github.com URLs end in the tag name, so get() needs an explicit filename=...tar.gz or Conan falls back to the zip decoder (BadZipFile)"
  - "MBROLA 3.3 is a portable C89 command-line synthesizer; only libc and libm are required besides the toolchain"
  - "Upstream Makefile defaults CC to 'gcc -ansi -pedantic'; overriding CC from the Conan profile is the only build change needed on OHOS"
  - "The Makefile probes no host specifics besides endianness, which it pins with -DLITTLE_ENDIAN, so the aarch64 OHOS build needs no patches"
  - "Upstream ships no automated test suite; the Makefile check/checkold targets need the private UTILITY_TCTS corpus (absent from the release tarball)"
  - "The packaged CLI renders the published mbrola-gr2 voice deterministically and its -W/-w ROM round trip is byte-identical to a direct render"
