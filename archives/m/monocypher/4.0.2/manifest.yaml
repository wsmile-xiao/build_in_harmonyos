# 版本级 manifest — monocypher 4.0.2
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.0.2"

# 软件名
software: "monocypher"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 release 分发物（含 tests/vectors.h 与正确版本标识）
  url: "https://github.com/LoupVaillant/Monocypher/releases/download/4.0.2/monocypher-4.0.2.tar.gz"

  # 源码校验和（官方 release tarball）
  sha256: "38d07179738c0c90677dba3ceb7a7b8496bcfea758ba1a53e803fed30ae0879c"

  # 官方 tag 核验
  tag: "4.0.2"
  tag_commit: "0d85f98c9d9b0227e42cf795cb527dff372b40a4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # monocypher 为自包含纯 C 库，无第三方依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "官方 GitHub release tarball 与 tag 归档内容不同：release 含 tests/vectors.h 且版本字符串为 4.0.2（tag 归档为 __git__ 占位符且无测试向量）；构建与测试必须使用官方 release 分发物"
  - "上游默认 CFLAGS 含 -march=native（不可移植），配方必须显式传入便携 CFLAGS"
  - "monocypher 4.0 已移除 crypto_sha512，哈希以 crypto_blake2b 为主"
