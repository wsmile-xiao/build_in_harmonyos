# test_package/MANIFEST.yml
# 上游官方测试声明文件
# monocypher 4.0.2 — 官方 release tarball（含 tests/vectors.h）

package: monocypher/4.0.2
homepage: "https://github.com/LoupVaillant/Monocypher"

# 上游测试命令 (make check -> 构建并运行 tests/test.c 的 test.out)
upstream_check_command: "make check"

# conanfile.py build() 中已集成上游测试（make check）
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test.c
    source: monocypher-4.0.2/tests/test.c
    description: "完整上游测试套件：AEAD/ChaCha20/Poly1305/BLAKE2b/Argon2/X25519/EdDSA/Elligator/Curve25519 转换（39 个测试函数、87 处断言，向量来自 tests/vectors.h）"
    command: "./test.out"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：crypto_blake2b 官方向量校验 + crypto_wipe 清零校验"
    command: "./test_monocypher"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 87
