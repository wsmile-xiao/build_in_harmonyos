software: megacmd
display: "MEGAcmd"
description: "MEGA 云存储的命令行交互/脚本化客户端（server + shell + client 三件套）"
category: network
homepage: "https://mega.nz/cmd"
license: "BSD-2-Clause"   # 与配方 conanfile.py:39 `license = "BSD-2-Clause"` 对齐（原写 SLCONTRIB-2.0 与配方不同源，两处必须一致）
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游默认在线 git clone vcpkg 并以 vcpkg toolchain 接管全部依赖（README 明言）；OHOS/离线构建需补丁短路 clone 块改走 system-deps 分支，依赖改由 Conan 注入（patches/0001-skip-vcpkg-online-clone.patch）"
    - "tag 归档不含子模块内容：sdk/ 为空目录，需按知识条目 E150（manual-download）单独取 meganz/sdk@fae76a36 源拷入（conandata 双源）"
    - "fuse3 关闭开关确切名为 -DWITH_FUSE=OFF（64 位 Linux 默认 ON）：关闭后 sdk 走 dummy backend（src/fuse/CMakeLists.txt else 分支），源码宏 WITH_FUSE 不定义，megacmd_fuse.cpp 主体被 #ifdef WITH_FUSE 排除"
    - "-DFULL_REQS=OFF 才能裁剪 ffmpeg/pdfium/mediainfo/freeimage（FULL_REQS=ON 会 add_compile_definitions REQUIRE_HAVE_FFMPEG/REQUIRE_HAVE_PDFIUM/REQUIRE_USE_MEDIAINFO 强制要求）"
    - "system-deps 分支下 ENABLE_MEGACMD_TESTS=ON 会因 GTest::gtest target 未定义 configure 失败（find_package(GTest) 仅在 VCPKG_ROOT 分支）"
  common_dependencies:
    - pcre
    - cryptopp
    - libsodium
    - sqlite3
    - libcurl
    - icu
    - openssl
    - libuv
    - readline
    - zlib

versions:
  "2.5.2":
    status: built     # 构建段已完成并通过本轮 W3 本地 CI 模拟（conan create + test_package + ctest 真实执行）；版本级细节见 2.5.2/manifest.yaml
    conan_ref: "megacmd/2.5.2"
