  status: built
  issue: 3327
  issue_url: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/issues/3327"
  drafts:
    - "knowledge/drafts/DRAFT-megacmd-2.5.2-upstream-vcpkg-bootstrap-takeover-system-deps.kv"
    - "knowledge/drafts/DRAFT-megacmd-2.5.2-upstream-vcpkg-bootstrap-takeover-system-deps.md"
  knowledge_used: "hit(E150 manual-download) —— tag 归档 sdk/ 为空目录，按 E150 单独取子模块 commit 归档"
  novelty: "上游 CMake 默认在线 git clone vcpkg 并以其 toolchain 接管全部依赖：空 VCPKG_ROOT 挡不住 clone 条件，离线 configure 直接 FATAL；补丁短路 clone 条件并守卫 vcpkg 产物安装块（防 VCPKG_INSTALLED_DIR 为空时把宿主 /lib 打进包），强制走 system-deps 分支由 Conan 注入依赖"

knowledge_gained:
  - "E150 实证（submodule 手工取源）：MEGAcmd tag 归档 .gitmodules 存在但 sdk/ 为空，codeload commit tarball 取源等效 git clone+checkout 且可 sha256 校验"
  - "vcpkg 在线依赖管道绕法：上游默认 git clone vcpkg 并以其 toolchain 接管依赖；补丁在 clone 条件前置 VCPKG_ROOT 真值判断 + 跳过 vcpkg 产物安装块（防空 VCPKG_INSTALLED_DIR 把 /lib 打进包），改走 system-deps"
  - "fuse3 缺失应对：开关确切名 WITH_FUSE=OFF 后 sdk 走 dummy backend、源码宏整体 #ifdef 排除；制品仓无 fuse3 recipe、有 libfuse/3.18.2"
  - "system-deps 分支的上游测试陷阱：ENABLE_MEGACMD_TESTS=ON 引用 GTest::gtest 但 find_package(GTest) 仅在 VCPKG 分支 ⇒ 配置必失败，须关测试或补 find_package"
  - "路径 B 判定 = create：草稿 DRAFT-megacmd-2.5.2-upstream-vcpkg-bootstrap-takeover-system-deps（已过 draft-review）；关联 Issue #3327"
  - "CMAKE_SYSTEM_NAME 必须是 Linux（E092 同款）：OHOS triplet 令 CMake 推出 HarmonyOS ⇒ UNIX 为假 ⇒ 上游 #ifdef UNIX 头包含链断裂"
  - "apply_conandata_patches 只能在 source() 调一次：conan create 会把 source_folder 整体拷进 build folder，二次打补丁必报 source file is different（该 bug 平时被 source 缓存掩盖）"
  - "Conan gtest/1.17.0 只声明 gtest::gtest（无 gmock），需显式钉 GTest_DIR=<pkg>/lib/cmake/GTest 才能用上游同名的 GTest::gtest/GTest::gmock"
  - "cmake install 改写 ELF RUNPATH 会使链接期签名失效（设备执行 EPERM/RC=126）⇒ package() 需 objcopy 去 .codesign + binary-sign-tool 重新自签名；本轮包内 mega-cmd 在 conan runenv 下实测可执行"
  - "上游 68 个 mega-* 包装脚本写死 #!/bin/bash 而 OHOS PC 无该路径 ⇒ 归一化为 #!/usr/bin/env bash；脚本以裸命令名调 mega-exec ⇒ 必须依赖 conanrun 注入的 PATH"
  - "CI 冒烟步 L2 裸执行 bin/* 且不带 conan runenv（build_and_test.sh 全文无 LD_LIBRARY_PATH）⇒ 动态链接 + 依赖 PATH 的包必然 L2=skip，不能据此判包不可用；本轮 L2=skip 已定性为判据环境缺陷"

