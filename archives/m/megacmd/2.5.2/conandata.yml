# conandata.yml — megacmd 2.5.2
# 上游 tag 2.5.2_Linux（annotated tag → commit f40c31c8…，GitHub 无 release 资产，
# 按官方 tag 归档直链取源；sha256 为该 URL（302 至 codeload）实际字节校验值）。
sources:
  url: "https://github.com/meganz/MEGAcmd/archive/refs/tags/2.5.2_Linux.tar.gz"
  sha256: "a088c001e9116357fcac92cd0b3d62fb53cc24ce546eb0fb4cc83c53df5eed7c"

# 子模块源（知识条目 E150 manual-download）：tag 归档仅含 .gitmodules，
# sdk/ 为空目录。pin commit fae76a36d60484657fbdf442b7b917ccc4fbad77，
# source() 解压后拷入 sdk/。sha256 双通道字节级实证：本 URL 与 codeload
# 同 commit 直连各下载一次，两份字节逐一致（见 sources 上方记录与 notes.md）。
# sdk 仓库全树无 .gitmodules、无嵌套子模块（git tree API 复核），一层取源即完整。
megacmd_sdk:
  url: "https://github.com/meganz/sdk/archive/fae76a36d60484657fbdf442b7b917ccc4fbad77.tar.gz"
  sha256: "3df9f194e2f18b64d51b325c50f852e694d232380bfc83e03f96bf6281db91eb"

patches:
  - patch_file: "patches/0001-skip-vcpkg-online-clone.patch"
    patch_description: "短路顶层 CMakeLists 的在线 vcpkg clone 块（VCPKG_ROOT 为空时不 git clone vcpkg，改走 system-deps 分支），并跳过 vcpkg 产物安装块（否则 VCPKG_INSTALLED_DIR 为空时会把宿主 /lib 打进包）"
    patch_type: "portability"
  - patch_file: "patches/0002-system-deps-via-cmake-config.patch"
    patch_description: "无 vcpkg 时上游只用 pkg-config 取依赖（sdk 的 libcrypto++/libsodium/sqlite3/libcurl/libuv/readline、megacmd 的 libpcre）；cryptopp 上游无 .pc 文件、Conan 只产出 CMake config 包，故两处均改为「有 CMake config 包就用它（cryptopp::cryptopp / pcre::pcre 等），否则回退 pkg-config」，ICU/OpenSSL 按 target 是否存在选择目标名；同时把链接可见性 PRIVATE→PUBLIC（SDK 公开头会包含 curl/sodium/sqlite3/openssl/unicode 等第三方头，而 megacmd 自身目标也包含 SDK 公开头；上游在 vcpkg 路径下靠 vcpkg toolchain 全局注入 include 目录，Conan 的 CMakeDeps 只挂在各 target 的 INTERFACE 上，PRIVATE 不传递）"
    patch_type: "portability"
  - patch_file: "patches/0003-clang-libcxx-portability.patch"
    patch_description: "Clang+libc++ 可移植性三处：sdk/src/file_service/file_buffer.cpp 补 <algorithm>（std::min）、src/updater/MegaUpdater.cpp 补 <fcntl.h>（O_RDWR/O_CREAT/F_SETFD/FD_CLOEXEC）、sdk 的 sdklib_target.cmake 仅在非 Clang 时链接 stdc++fs（libc++ 无该库，std::filesystem 已内置）"
    patch_type: "portability"
  - patch_file: "patches/0004-gtest-unit-tests.patch"
    patch_description: "让无 vcpkg 分支也能构建上游单元测试：megacmd_libraries.cmake 在 ENABLE_MEGACMD_TESTS 时 find_package(GTest CONFIG) 并给 LMegacmdTestsCommon 接上 GTest::gtest/GTest::gmock（上游只在 VCPKG_ROOT 分支接 GTest）；顶层 CMakeLists 补 enable_testing()/add_test 注册 mega-cmd-tests-unit（上游全树无 add_test，ctest 里 0 条用例）"
    patch_type: "portability"
