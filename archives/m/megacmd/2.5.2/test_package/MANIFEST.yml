# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）

package: megacmd/2.5.2
homepage: "https://mega.nz/cmd"

# 上游确有测试（tests/ 目录），且本打包配置在 build() 内构建并【真实运行】上游单元测试套件：
# conanfile.py:114 置 ENABLE_MEGACMD_TESTS=ON，conanfile.py:188 调 _run_upstream_unit_tests()，
# 内部以 ctest -V 执行并断言文档化基线（_UNIT_MIN_PASS=47 / _UNIT_MAX_FAIL=23 / _UNIT_MIN_TOTAL=70）。
upstream_tests_exist: true
upstream_test_audit:
  - source: "tests/ 目录（tag 2.5.2_Linux）"
    reason: "18 个 .cpp：unit 6+main（ComunicationsManagerFileSockets/OptionsFlagsUtils/PlatformDirectories/StringUtils/Utf8/Utils）、integration 9+main（Basic/Cat/Export/Put/SyncIssues/SyncIgnore/Fuse…）、common 2（Instruments/TestUtils），另有 12 个 shell/python 测试脚本（5 个 .sh + 7 个 .py；其中 megacmd_tests_common.py 是公共辅助模块，故可执行脚本用例计 11）。"
  - source: "CMakeLists.txt / build/cmake/modules/*.cmake"
    reason: "pristine 上游零 CTest 注册（两棵树 enable_testing/add_test/ctest 零命中），测试只以可执行文件形式构建；构建开关 ENABLE_MEGACMD_TESTS 在 Debug 默认 ON、Release 默认 OFF。⇒ 本包 patches/0004 在顶层补 enable_testing() 并以 foreach 把 8 个单元套件逐套件 add_test（--gtest_filter=<Suite>.*）；不改任何用例源码、不改断言、不跳过任何用例。"
  - source: "build/cmake/modules/megacmd_libraries.cmake"
    reason: "pristine 上游 find_package(GTest) 仅存在于 VCPKG_ROOT 分支，本配方走 system-deps 分支时 ENABLE_MEGACMD_TESTS=ON 会因 GTest::gtest 未定义而 configure 失败 ⇒ patches/0004 在该分支补 find_package(GTest CONFIG REQUIRED)（配方把 GTest_DIR 钉到 gtest/1.17.0 包内自带的上游 GTestConfig.cmake，目标名与 vcpkg 分支一致），据此配方把开关置 ON 并真实执行。"
  - source: "integration 测试与 shell/python 脚本用例运行条件"
    reason: "集成测试 59 例与 11 个脚本用例需常驻 mega-cmd-server、真实 MEGA 账号与公网 HTTPS ⇒ 本轮未运行；其二进制 mega-cmd-tests-integration 已成功编译链接（日志 [100%] Built target），属运行期外部条件缺失而非构建缺陷。"
  - conclusion: "本打包配置在 build() 内以 ctest -V 真实执行 8 个上游单元测试套件。本轮读数 w3-local-ci.log:5513 SUITES_STATIC=8 SUITES_EXECUTED=8 TOTAL=70 PASS=47 FAIL=23，套件级汇总见 5499 行（50% tests passed, 4 tests failed out of 8）。23 例失败与 2 例未出结论全部为平台能力限制（path-form AF_UNIX 全平台不可 bind / /tmp 只读 erofs / HMDFS 不保存 chmod 位），由配方的文档化基线断言把关、偏离即构建失败，不属本次适配引入的破坏。消费者视角另由 test_package 真实执行打包二进制（--version 冒烟）做验证。"

upstream_check_command: "ctest -V"
upstream_test_in_build: true
upstream_test_command: "ctest -V"

# 8 条 ctest 套件项（patches/0004 注册）与本轮实测读数。
# 五维账（同一份日志）：静态注册 72（各套件 Running N tests 之和）· ctest 启动 71 ·
# 产出结论 70（= PASS 47 + FAIL 23）· 未出结论 2（1 例随套件段错误中断、1 例从未启动）。
upstream_tests:
  - name: OptionsFlagsUtilsTest
    command: "ctest -V -R '^OptionsFlagsUtilsTest$'"
    expected: "pass（本轮实测 Running 6 ⇒ Passed，6/6；日志 4653、4859）"
  - name: StringUtilsTest
    command: "ctest -V -R '^StringUtilsTest$'"
    expected: "pass（本轮实测 Running 16 ⇒ Passed，16/16；日志 4968、5311）"
  - name: Utf8Test
    command: "ctest -V -R '^Utf8Test$'"
    expected: "pass（本轮实测 Running 17 ⇒ Passed，17/17；日志 5145、5495）"
  - name: PathUtf8Test
    command: "ctest -V -R '^PathUtf8Test$'"
    expected: "pass（本轮实测 Running 2 ⇒ Passed，2/2；日志 5329、5362）"
  - name: ComunicationsManagerFileSocketsWithClientTest
    command: "ctest -V -R '^ComunicationsManagerFileSocketsWithClientTest$'"
    expected: "平台受限：本轮实测 Running 15 ⇒ ***Failed，15/15 全部败于 path-form AF_UNIX 不可 bind（基线断言按 FAIL<=23 容许）；日志 4634、4952"
  - name: ComunicationsManagerFileSocketsTest
    command: "ctest -V -R '^ComunicationsManagerFileSocketsTest$'"
    expected: "平台受限：本轮实测 Running 9 ⇒ ***Exception: SegFault；启动 8、出结论 7（pass 3 / fail 4），2 例未出结论（StressRapidConnectDisconnect 随套件段错误中断、StressLargeDataMultipleClients 从未启动）；日志 4564、5497、5504"
  - name: PlatformDirectoriesTest
    command: "ctest -V -R '^PlatformDirectoriesTest$'"
    expected: "平台受限：本轮实测 Running 4 ⇒ ***Failed，3 例败于 /tmp 只读（runtimeDirPath/configDirPath/getOrCreateSocketPath）、1 例通过；日志 4909、5472"
  - name: UtilsTest
    command: "ctest -V -R '^UtilsTest$'"
    expected: "平台受限：本轮实测 Running 3 ⇒ ***Failed，1 例败于 HMDFS 不保存 chmod 位（UtilsTest.canWrite）、2 例通过；日志 5364、5487"

test_package_tests:
  - file: test_megacmd.sh
    description: "真实执行打包的 mega-cmd / mega-exec / mega-cmd-server --version（timeout 15s 兜底），断言至少一个产出可解析版本输出；mega-ls 包装脚本加载兜底"
    command: "bash test_megacmd.sh"

assertion_count: 1
