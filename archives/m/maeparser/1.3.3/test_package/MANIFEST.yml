package: maeparser/1.3.3
homepage: "https://github.com/schrodinger/maeparser"

upstream_check_command: "boost_test (manual static compile)"
upstream_test_in_build: true
upstream_test_command: "./maeparser_upstream_tests (compiled in recipe build())"

upstream_tests:
  - name: BufferSuite
    command: "./unittest"
    expected: "10 test cases pass"
  - name: MaeBlockSuite
    command: "./unittest"
    expected: "7 test cases pass"
  - name: MaeParserSuite
    command: "./unittest"
    expected: "pass"
  - name: ReaderSuite
    command: "./unittest"
    expected: "pass"
  - name: WriterSuite
    command: "./unittest"
    expected: "pass"
  - name: DemoSuite (UsageDemo, reads gzipped test2.maegz via boost::iostreams)
    command: "./unittest"
    expected: "1 test case pass"

test_package_tests:
  - file: example.cpp
    description: "Parse a deterministic MAE fixture, read block/indexed properties, exact-compare values, verify undefined-value handling, negative truncated/malformed inputs, Writer round-trip"
    command: "./test_package"

assertion_count: 31
