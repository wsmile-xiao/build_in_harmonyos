software: minisat
build_system: cmake
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.2.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/stp/minisat/archive/refs/tags/releases/2.2.1.tar.gz"

  # 源码校验和
  sha256: "432985833596653fcd698ab439588471cc0f2437617d0df2bb191a0252ba423d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_C_FLAGS=-fuse-ld=bfd -fPIC -O2"
    - "-DCMAKE_CXX_FLAGS=-fuse-ld=bfd -fPIC -O2"
    - "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=bfd"
    - "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=bfd"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-minisat-utils-System.h.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS平台缺少fpu_control.h，需要在System.h中使用#ifdef __OHOS__守卫 (ref:E200)"
  - "OHOS SDK的lld链接器依赖libxml2.so.16无法加载，需使用-fuse-ld=bfd替代 (ref:E050)"
  - "cmake 4.x不兼容cmake_minimum_required(VERSION 2.6)，需添加-DCMAKE_POLICY_VERSION_MINIMUM=3.5 (ref:E200)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/minisat-2.2.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/minisat-2.2.1.work
  source_orig_hash: 20e99777dbd0ba74
  source_work_hash: dc80ef273c7a9958
  generated_at: '2026-06-03T17:59:19'
  patches_count: 1

patch_classification:
  - file: 0001-minisat-utils-System.h.patch
    type: platform_compat
    platform_only: True
    guard: '__OHOS__'
