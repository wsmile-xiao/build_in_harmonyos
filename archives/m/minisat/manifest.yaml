software: minisat
display: "MiniSat"
description: "Minimalistic and high-performance SAT solver"
category: system
homepage: "https://minisat.se/"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "aarch64/OHOS 平台缺少 fpu_control.h，需在 System.h 中使用 #ifdef __OHOS__ 守卫排除"
    - "OHOS SDK lld 链接器依赖 libxml2.so.16 无法加载，需使用 -fuse-ld=bfd 替代"
    - "cmake 4.x 不兼容 cmake_minimum_required(VERSION 2.6)，需添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  common_dependencies:
    - zlib

versions:
  "2.2.1":
    status: published
    build_date: "2026-06-03"