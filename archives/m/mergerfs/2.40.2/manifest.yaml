version: "2.40.2"
software: mergerfs
status: built
build_date: "2026-09-30"
build_system: makefile

source:
  url: "https://codeload.github.com/trapexit/mergerfs/tar.gz/refs/tags/2.40.2"
  sha256: "b4f45e635f29b0a8ba1727e6c1f503356d47943a14af8b4586d3e36350f82464"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  archive_tool: llvm-ar
  ldflags_override: "-pthread"
  targets:
    - "tests"
    - "preload"

patches_applied:
  - "0001-libfuse-guard-pthread-cancellation.patch"
  - "0002-libfuse-sched-affinity-fallback.patch"
  - "0003-tests-fix-stale-readdir-case.patch"
  - "0004-preload-guard-64bit-aliases.patch"

knowledge_gained:
  - "mergerfs 官方源码包自带（vendored）libfuse 2.x fork 及 wyhash/ghc::filesystem/fmt/optional-lite/concurrentqueue，零外部依赖，纯 make 即可构建"
  - "OHOS bionic 未实现 pthread_cancel/pthread_setcancelstate；vendored libfuse 的 fuse.c 与 fuse_loop.cpp 需用 HAVE_PTHREAD_CANCEL 特性宏守卫这两个调用点"
  - "OHOS bionic 亦无 pthread_setaffinity_np（有 sched_setaffinity）；vendored libfuse 的 cpu.cpp 用 HAVE_PTHREAD_SETAFFINITY_NP 特性宏守卫并回退到 sched_setaffinity"
  - "OHOS 的 librt 已并入 libc，无独立 librt；上游 Makefile 的固定 -lrt 需用命令行 LDFLAGS 覆盖（命令行变量会整体覆盖 Makefile 中的 LDFLAGS 赋值）"
  - "上游 acutest 单元套件（tests/tests.cpp，15 用例/126 断言）不依赖 FUSE，可直接在 build() 中执行；tests/TEST_* 集成脚本依赖真实 mergerfs 挂载点，OHOS 无可用 /dev/fuse，如实记为阻塞"
  - "2.40.2 tarball 里的 tests/tests.cpp 已过期（test_config_readdir 仍用旧的全局 ReadDir 枚举 API，现为 FUSE::ReadDir 字符串构造），上游 CI 从不构建 tests，故 `make tests` 原本无法编译；补丁 0003 仅修正该用例到当前 API"
  - "OHOS 在 _FILE_OFFSET_BITS=64 下把 open64/openat64/fopen64/creat64 定义为指向非 64 位函数的宏；tools/preload.c 同时定义两套 interposer 会重复定义，补丁 0004 用 #ifndef 守卫 *64 版本"
  - "git tag 包（codeload）不带 VERSION 文件（release 包才有），buildtools/update-version 会因此把版本戳成 unknown；配方在 source() 中用 self.version 重建 VERSION"
