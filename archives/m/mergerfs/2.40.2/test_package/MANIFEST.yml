# test_package/MANIFEST.yml
# mergerfs 2.40.2 - upstream and consumer test declaration.

package: mergerfs/2.40.2
homepage: "https://github.com/trapexit/mergerfs"

upstream_tests_exist: true
upstream_test_audit: >-
  Upstream ships two suites. (1) A self-contained acutest unit suite in
  tests/tests.cpp, built by `make tests` into build/tests (15 registered test
  cases, 126 TEST_CHECK assertions). (2) tests/TEST_* integration scripts
  driven by tests/run-tests <mergerfs-mountpoint>, which require a real
  mounted mergerfs filesystem (and therefore a usable /dev/fuse).
upstream_check_command: "make tests && ./build/tests"
upstream_test_in_build: true
upstream_test_command: "make tests -j1 && ./build/tests"
upstream_tests_modified: true
upstream_tests_modified_reason: >-
  The tests/tests.cpp shipped in the 2.40.2 tarball is stale and does not
  compile: its test_config_readdir uses the old global enum-style ReadDir API
  while src/fuse_readdir.hpp now defines FUSE::ReadDir with a string
  constructor. Upstream CI (.cirrus.yml) never builds `tests`, so the release
  tarball ships a broken file. Patch 0003 updates only that single case to the
  current API; the test count is unchanged (15).

upstream_tests:
  - file: tests/tests.cpp
    source: mergerfs-2.40.2/tests/tests.cpp
    description: >-
      acutest unit suite: config/branches/policy parsing (15 cases, 126
      TEST_CHECK assertions)
    command: "./build/tests"
  - file: tests/TEST_no_fuse_hidden
    source: mergerfs-2.40.2/tests/TEST_no_fuse_hidden
    description: "no .fuse_hidden file left after unlink (needs a mergerfs mount)"
    command: "tests/run-tests <mergerfs-mountpoint>"
  - file: tests/TEST_o_direct
    source: mergerfs-2.40.2/tests/TEST_o_direct
    description: "O_DIRECT read/write after unlink (needs a mergerfs mount)"
    command: "tests/run-tests <mergerfs-mountpoint>"
  - file: tests/TEST_unlink_rename
    source: mergerfs-2.40.2/tests/TEST_unlink_rename
    description: "unlink + rename of an open file (needs a mergerfs mount)"
    command: "tests/run-tests <mergerfs-mountpoint>"
  - file: tests/TEST_use_fchmod_after_unlink
    source: mergerfs-2.40.2/tests/TEST_use_fchmod_after_unlink
    description: "fchmod on an unlinked fd (needs a mergerfs mount)"
    command: "tests/run-tests <mergerfs-mountpoint>"
  - file: tests/TEST_use_fchown_after_unlink
    source: mergerfs-2.40.2/tests/TEST_use_fchown_after_unlink
    description: "fchown on an unlinked fd (needs a mergerfs mount)"
    command: "tests/run-tests <mergerfs-mountpoint>"
  - file: tests/TEST_use_fstat_after_unlink
    source: mergerfs-2.40.2/tests/TEST_use_fstat_after_unlink
    description: "fstat on an unlinked fd (needs a mergerfs mount)"
    command: "tests/run-tests <mergerfs-mountpoint>"

upstream_unit_cases: 15
upstream_unit_assertions: 126
upstream_integration_scripts: 5
upstream_integration_executed: false
upstream_integration_block_reason: >-
  The TEST_* integration scripts exercise the semantics of a mounted mergerfs
  filesystem.  Running them requires mounting mergerfs, which requires
  open("/dev/fuse"); on OHOS the sandbox denies /dev/fuse access (permission
  denied), exactly as documented for the other FUSE recipes (afuse/ext2fuse).
  The unit suite (tests/tests.cpp) does not touch FUSE and is executed in
  build().

test_package_tests:
  - file: test_mergerfs.sh
    description: >-
      installed mergerfs consumer checks: binary/preload/man presence,
      --version banner (2.40.2 + ISC license), -h usage, misuse rejection and
      a real mount attempt that fails cleanly without /dev/fuse
    command: "sh test_mergerfs.sh"

test_files:
  - path: "test_package/test_mergerfs.sh"
    test_type: "R34"
    assertion_count: 10

test_package_test_count: 1
consumer_assertion_count: 10
upstream_test_cases: 15
assertion_count: 136
