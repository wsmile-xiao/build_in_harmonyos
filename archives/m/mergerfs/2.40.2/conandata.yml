sources:
  url: "https://codeload.github.com/trapexit/mergerfs/tar.gz/refs/tags/2.40.2"
  sha256: "b4f45e635f29b0a8ba1727e6c1f503356d47943a14af8b4586d3e36350f82464"
  filename: "mergerfs-2.40.2.tar.gz"

patches:
  - patch_file: "patches/0001-libfuse-guard-pthread-cancellation.patch"
    patch_description: >-
      The vendored libfuse calls pthread_cancel / pthread_setcancelstate, which
      OHOS bionic does not implement. Guard both call sites behind the
      HAVE_PTHREAD_CANCEL feature macro (undefined on OHOS, so the calls are
      omitted; where present they are kept). The maintenance thread is
      detached instead of cancelled/joined when cancellation is unavailable.
    patch_type: "portability"
  - patch_file: "patches/0002-libfuse-sched-affinity-fallback.patch"
    patch_description: >-
      The vendored libfuse uses pthread_setaffinity_np, which OHOS bionic does
      not provide. Guard the call behind the HAVE_PTHREAD_SETAFFINITY_NP
      feature macro (undefined on OHOS) and fall back to sched_setaffinity,
      which bionic does implement. Thread pinning is an optional performance
      feature and is not exercised during the build.
    patch_type: "portability"
  - patch_file: "patches/0003-tests-fix-stale-readdir-case.patch"
    patch_description: >-
      The upstream tests/tests.cpp shipped in the 2.40.2 tarball is stale: its
      test_config_readdir uses the old global enum-style ReadDir API, while
      src/fuse_readdir.hpp now defines FUSE::ReadDir with a string constructor,
      so `make tests` does not compile (upstream CI never builds it). This patch
      updates that single case to the current API so the whole upstream unit
      suite builds and runs.
    patch_type: "build"
  - patch_file: "patches/0004-preload-guard-64bit-aliases.patch"
    patch_description: >-
      tools/preload.c defines both the 32-bit and the LFS (*64) interposers
      (open64/openat64/fopen64/creat64). On OHOS with _FILE_OFFSET_BITS=64 the
      libc headers make those names macros aliasing the non-64 functions, so
      defining both is a redefinition error. Guard each *64 definition with
      #ifndef <name> (it is skipped where the alias macro exists).
    patch_type: "portability"
