software: mergerfs
display: "mergerfs"
description: "FUSE 联合文件系统（把多个目录合并为单一挂载点，JBOD/union）"
category: utility
homepage: "https://github.com/trapexit/mergerfs"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "官方源码包自带（vendored）libfuse 2.x fork 与 wyhash/ghc::filesystem/fmt/optional-lite/concurrentqueue/scope_guard，零外部依赖，纯 make 构建"
    - "补丁 0001：vendored libfuse 的 pthread_cancel/pthread_setcancelstate 调用点用 HAVE_PTHREAD_CANCEL 特性宏守卫（OHOS bionic 未实现线程取消）"
    - "OHOS 的 librt 并入 libc：用命令行 LDFLAGS=-pthread 覆盖上游 Makefile 固定追加的 -lrt"
    - "build() 内执行上游 acutest 单元套件 build/tests（15 用例/126 断言）；tests/TEST_* 集成脚本需真实 mergerfs 挂载点，OHOS 无可用 /dev/fuse，如实记为阻塞"
  common_dependencies: []

versions:
  - version: "2.40.2"
    status: built
    build_date: "2026-09-30"
