software: mhddfs
display: "mhddfs"
description: "FUSE union filesystem driver merging several mount points into one virtual directory tree"
category: system
homepage: "http://mhddfs.uvw.ru/"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 编译/链接规则硬编码 gcc，须补丁改为 $(CC) 才能使用 OHOS clang"
    - "OHOS sysroot 无 legacy <attr/xattr.h>：按上游 WITHOUT_XATTR 编译开关构建"
    - "OHOS libc 缺 pthread_cancel/pthread_setcancelstate：静态 libfuse.a 消费端需消费者侧 shim（hook 与 libfuse 包 test_package 一致）"
    - "运行边界：OHOS PC 普通进程无法使用 /dev/fuse（EACCES）、无 fusermount、mount(2) 触发 SIGSYS；内核 FUSE 仅系统服务可用——本包可安装与执行 CLI，真实挂载不可用，证据见 version notes.md"
  common_dependencies:
    - libfuse
    - uthash

versions:
  "0.1.39.0":
    status: built
    build_date: "2026-09-27"
    conan_ref: "mhddfs/0.1.39.0"
