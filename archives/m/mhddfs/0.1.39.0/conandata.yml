# conandata.yml — mhddfs 0.1.39.0
#
# Source provenance: the upstream project site mhddfs.uvw.ru is dead (verified
# 2026-09-27 from the build machine: plain HTTP refuses the connection, HTTPS
# serves a certificate for a different host) and the upstream SVN host
# svn.uvw.ru is gone with it. The only authoritative pristine copy of this
# release is the Debian archive "orig" tarball, which is upstream's source
# archive repackaged without any Debian changes (Debian's own patches live in
# the separate .debian.tar.xz). sha256 below is the hash of the exact tarball
# used for this build.
sources:
  url: "https://deb.debian.org/debian/pool/main/m/mhddfs/mhddfs_0.1.39.0.orig.tar.xz"
  sha256: "8bae7d3820b472cf87cd6d1fecf5d2d7965a0fe6c020b121c08c98b2c2231863"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "0001 Makefile use CC variable for compile and link rules"
    patch_type: "portability"
  - patch_file: "patches/0002-src-pthread_stubs.c.patch"
    patch_description: "0002 pthread_stubs.c add link-time shims for the OHOS libc missing pthread_cancel/pthread_setcancelstate"
    patch_type: "portability"
  - patch_file: "patches/0003-src-version.h.patch"
    patch_description: "0003 version.h sync VERSION macro with the 0.1.39.0 release"
    patch_type: "portability"
