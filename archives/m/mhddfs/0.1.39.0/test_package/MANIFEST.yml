package: mhddfs/0.1.39.0
homepage: http://mhddfs.uvw.ru/

# Upstream ships seven manual helpers under tests/ plus ten Makefile mount
# targets (test-mount / test-umount / test / btest / tests / ptest / rename /
# symlinks_test / rename-test / dirtree-test; the tests target loops make test
# and the rename target only compiles the helper) - 17 assets in total. They
# all operate on a live FUSE mount through fusermount. On HarmonyOS PC an ordinary process
# cannot use the FUSE device (see the capability probe in reports/
# test-report.md), so none of them is executable in this environment; the raw
# attempt evidence is archived with the report. The published binary itself is
# covered by the consumer suite below.
upstream_check_command: "make test-mount (requires a live fusermount mount)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: tests/access.pl
    description: "POSIX::access(R/W/X) checks against objects in a live mount"
  - file: tests/seek.pl
    description: "seek behaviour checks inside a live mount"
  - file: tests/statvfs.pl
    description: "statvfs aggregation checks inside a live mount"
  - file: tests/utimes.sh
    description: "utimes propagation through a live mount (make symlinks_test)"
  - file: tests/xattrs.sh
    description: "xattr copy checks through a live mount (needs upstream xattr build)"
  - file: tests/rename.c
    description: "rename() helper binary for a live mount (make rename)"
  - file: tests/plocks.c
    description: "POSIX lock helper for a live mount (make ptest)"
test_package_tests:
  - file: test_mhddfs.py
    description: "CLI/startup contract: version, usage exit codes, directory validation, duplicate elimination, mlimit parsing, bounded real mount attempt"
    command: "python3 test_mhddfs.py <package>/bin/mhddfs"
assertion_count: 10
