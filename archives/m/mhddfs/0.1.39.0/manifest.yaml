knowledge_gained:
  - "上游 Makefile 编译/链接规则硬编码 gcc，交叉编译必须改为 $(CC)（ref: patches/0001-Makefile.patch）"
  - "OHOS sysroot 无 legacy <attr/xattr.h>；上游 WITHOUT_XATTR 编译开关是 xattr 可选组件的正路（ref: notes.md 问题 2）"
  - "OHOS libc 缺 pthread_cancel/pthread_setcancelstate：静态 libfuse.a 消费端需要消费者侧 ENOSYS shim（ref: patches/0002-src-pthread_stubs.c.patch）"
  - "OHOS PC 普通进程无法使用 FUSE：/dev/fuse EACCES(13)、无 fusermount、mount(2) 触发 SIGSYS(31)；内核 FUSE 仅系统服务可用（ref: DRAFT-mhddfs-0.1.39.0-ohos-fuse-consumer-mount-boundary）"
  - "无法真实挂载时，FUSE 消费端消费者测试按 CLI 契约硬断言 + 有界挂载尝试双向判定构造（ref: DRAFT-mhddfs-0.1.39.0-fuse-consumer-test-construction）"

