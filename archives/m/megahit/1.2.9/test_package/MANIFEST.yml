# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 三步法实测记录）
# 上游测试 = CMakeLists.txt 的 custom target `simple_test`（9 条命令，非 ctest）。
# 已在 HarmonyOS PC (B 机, aarch64, 8C/31G) 真机逐条实测，见 notes.md。

package: megahit/1.2.9
homepage: "https://github.com/voutcn/megahit"

# 上游测试命令（CMake custom target, 非 ctest/make check）
upstream_check_command: "cmake --build build --target simple_test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试（simple_test 的 9 条命令，逐条对应）
upstream_tests:
  - file: CMakeLists.txt
    source: megahit-1.2.9/CMakeLists.txt
    description: "--test 内置数据集组装 (2 线程)"
    command: "./megahit --test -t 2"
  - file: CMakeLists.txt
    source: megahit-1.2.9/CMakeLists.txt
    description: "--test 无硬件加速 + mercy factor 覆盖 (4 线程, no-hw-accel)"
    command: "MEGAHIT_NUM_MERCY_FACTOR=1.5 ./megahit --test -t 4 --mem-flag 0 --no-hw-accel"
  - file: CMakeLists.txt
    source: megahit-1.2.9/CMakeLists.txt
    description: "--test kmin-1pass + 高强度剪枝"
    command: "./megahit --test -t 2 --kmin-1pass --prune-level 3 --prune-depth 0"
  - file: CMakeLists.txt
    source: megahit-1.2.9/CMakeLists.txt
    description: "随机序列 k=255 大 k 值组装（默认线程数=cpu_count）"
    command: "./megahit -r random.fa --k-list 255 --min-count 1 -o test-random"
  - file: CMakeLists.txt
    source: megahit-1.2.9/CMakeLists.txt
    description: "--test FASTG 产物 + 保留中间文件"
    command: "./megahit --test -t 2 --mem-flag 2 --keep-tmp-files -o test-fastg"
  - file: CMakeLists.txt
    source: megahit-1.2.9/CMakeLists.txt
    description: "空输入文件边界"
    command: "./megahit -r test_data/empty.fa -o test-empty"
  - file: CMakeLists.txt
    source: megahit-1.2.9/CMakeLists.txt
    description: "全 N 读段边界（无 contig 输出）"
    command: "./megahit -r test_data/r4.fa -o test-no-contig"
  - file: CMakeLists.txt
    source: megahit-1.2.9/CMakeLists.txt
    description: "megahit_toolkit contig2fastg"
    command: "./megahit_toolkit contig2fastg 59 test-fastg/intermediate_contigs/k59.contigs.fa > 59.fastg"
  - file: CMakeLists.txt
    source: megahit-1.2.9/CMakeLists.txt
    description: "megahit_toolkit readstat"
    command: "./megahit_toolkit readstat < test-fastg/intermediate_contigs/k59.contigs.fa"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_megahit.py
    description: "dumpversion + 200 条 250bp 合成读段真实组装(-t 2) + toolkit contig2fastg/readstat"
    command: "conan test (conanfile.py test() 驱动 test_megahit.py, 断言版本号与产物存在)"

# 测试断言总数（近似值, 用于质量评估）
# 上游 9 例（进程级 PASS/FAIL, 内含输出文件校验）+ test_package 5 组断言
assertion_count: 14
