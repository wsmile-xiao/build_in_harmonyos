# conandata.yml — megahit 1.2.9
# Source: official upstream GitHub release tag (R39)
# sha256 verified against the downloaded tarball.

sources:
  url:
    - "https://github.com/voutcn/megahit/archive/refs/tags/v1.2.9.tar.gz"
  sha256: "09026eb07cc4e2d24f58b0a13f7a826ae8bb73da735a47cb1cbe6e4693118852"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "cmake_minimum_required 2.8 -> 3.5 (CMake >= 4 compatibility); gate x86-only -mbmi2/-mpopcnt target flags behind CMAKE_SYSTEM_PROCESSOR (matches upstream master PR #368)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-kmlib-kmrns.h.patch"
    patch_description: "Guard x86intrin.h include and BMI2 _pdep_u64 to x86; add portable software pdep fallback for non-x86 (aarch64 has no x86intrin.h)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-megahit.patch"
    patch_description: "Wrapper shebang python -> python3 (no bare python on OHOS); os.mkfifo fallback to a regular temp file when named pipes are unsupported (EPERM on HMDFS)"
    patch_type: "platform"
  - patch_file: "patches/0004-src-utils-cpu_dispatch.h.patch"
    patch_description: "Guard cpuid inline asm to x86; HasPopcnt/HasBmi2 return false on non-x86 so the wrapper dispatches to megahit_core_no_hw_accel (matches upstream master PR #368)"
    patch_type: "portability"
