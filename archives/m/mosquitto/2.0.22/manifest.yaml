software: mosquitto
version: "2.0.22"
status: built
build_date: "2026-10-08"
build_system: cmake

source:
  url: "https://mosquitto.org/files/source/mosquitto-2.0.22.tar.gz"
  sha256: "2f752589ef7db40260b633fbdb536e9a04b446a315138d64a7ff3c14e2de6b68"
  tar_format: tar.gz

build:
  system: cmake
  options:
    - DOCUMENTATION=OFF
    - WITH_TLS=ON
    - WITH_CJSON=ON
    - WITH_THREADING=ON
    - WITH_BUNDLED_DEPS=ON
    - WITH_UNIX_SOCKETS=ON
    - WITH_BRIDGE=ON
    - WITH_PERSISTENCE=ON
    - WITH_CONTROL=ON
    - WITH_EPOLL=ON

dependencies:
  - openssl/3.5.6.1
  - cjson/1.7.19

patches:
  - patches/0002-config.h.patch
  - patches/0004-src-CMakeLists.txt-harmonyos-dynamic-list.patch

patch_details:
  - file: patches/0002-config.h.patch
    type: portability
    guard: __OHOS__
    description: "Add __OHOS__ guard for pthread_cancel — HarmonyOS does not implement pthread_cancel/pthread_testcancel"
  - file: patches/0004-src-CMakeLists.txt-harmonyos-dynamic-list.patch
    type: portability
    guard: CMAKE_SYSTEM_NAME STREQUAL "HarmonyOS"
    description: "Extend broker plugin-symbol export list (src/linker.syms dynamic-list) to HarmonyOS — CMake unknown-platform leaves UNIX unset so export list was skipped and auth/dynsec plugins failed to load (mosquitto_* symbol not found)"

upgrade_notes: >-
  Upgraded from 2.0.18 (already in main). 2.0.19..2.0.22 are bugfix-only
  releases including security fixes (malicious SUBSCRIBE leak by
  authenticated client, CVE-2023-28366 follow-up). Upstream raised
  cmake_minimum_required to 3.18 in 2.0.22, so the 0001 cmake-compat
  patch from 2.0.18 is no longer needed; only the pthread_cancel
  __OHOS__ guard (0002) is retained.
