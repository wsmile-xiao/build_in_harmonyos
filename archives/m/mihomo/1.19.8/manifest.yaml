software: mihomo
# 版本级 manifest
# 文件位置: archives/m/mihomo/1.19.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.19.8"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/MetaCubeX/mihomo/archive/refs/tags/v1.19.8.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: go
build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOPROXY=https://goproxy.cn,direct"
    - "-tags with_gvisor"
    - "-trimpath"
    - "-ldflags=-X github.com/metacubex/mihomo/constant.Version=v1.19.8 -w -s -buildid="
  dependencies: []
  cc: go
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Go binary with CGO_ENABLED=0 compiles as statically linked ELF, no libc dependency"
  - "Use GOPROXY=https://goproxy.cn,direct for China mirror"
  - "mihomo uses -tags with_gvisor for gVisor network stack support"