# test_package/MANIFEST.yml
# Upstream test declaration for math-sll 1.24

package: math-sll/1.24
homepage: "https://github.com/aemileski/math-sll"

# Upstream has no test target: Makefile defines only all/clean/install,
# and the source tree (math-sll.c + math-sll.h) contains no test driver,
# no main(), no assert-based self-tests, and no make check rule.
upstream_check_command: "make check (upstream: no such target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package consumer test (validates installed public API for consumers)
test_package_tests:
  - file: test.c
    description: "Consumer test exercising public fixed-point math API (add/mul/div/sqrt/sin/cos conversions)"
    command: "./test_math-sll"

# 9 numeric checks asserted by the consumer test
assertion_count: 9