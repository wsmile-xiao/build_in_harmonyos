# math-sll 1.24 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.24"

# 软件名
software: "math-sll"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag v1.24 归档）
  url: "https://github.com/aemileski/math-sll/archive/refs/tags/v1.24.tar.gz"

  # 官方归档 SHA-256（实测）
  sha256: "8f760427bd5f9d68727a9a2e31ce61d757b244be891414f2fd01c1ca9f2085ea"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表（无 configure 脚本）
  configure_options: []

  # 编译依赖列表（无第三方依赖）
  dependencies: []

  # 编译器（OHOS 交叉工具链）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无补丁：上游 Makefile 原生可用，仅通过配方注入工具链
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游产物 math-sll.a 无 lib 前缀，Conan CMakeDeps 按惯例查找 libmath-sll.a，package() 需 os.rename 重命名"
  - "上游 slldiv 实现为 x * sllinv(y)（迭代求倒数），结果有舍入误差，消费者测试断言需用容差"
  - "make 配方必须传 cwd=self.source_folder，basic_layout 下 Makefile 在 source 目录而非 build 目录"
