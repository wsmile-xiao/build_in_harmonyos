# 软件级 manifest — malbolge
# 遵循 ARCHIVE-SPEC v3.0

software: malbolge
display: "malbolge"
description: "Malbolge 异构编程语言官方参考解释器（Ben Olmstead, 1998）"
category: lang
homepage: "https://esoteric.sange.fi/orphaned/malbolge/"
license: public_domain
build_system: none

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "单文件 C 解释器（malbolge.c），无 tarball / 无 Makefile / 无构建系统，配方直接 get() 下载 .c 文件后用 Conan conf 动态取得的 C 编译器编译"
    - "编译器从 tools.build:compiler_executables 动态取得，不硬编码任何路径 / SDK 版本 / Worker 路径；不修改公共 profile"
    - "上游 public domain，无任何许可证冲突；<malloc.h> 在 OHOS musl sysroot 可用"
    - "上游无任何测试套件：malbolge.c 是唯一源文件，无 tests/ 目录、无 Makefile、无 test target、无 CI 配置、无测试框架"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.1.0":
    status: built
    build_date: "2026-08-31"
