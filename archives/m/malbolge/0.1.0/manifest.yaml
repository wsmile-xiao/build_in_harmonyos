knowledge_gained:
  - "malbolge 0.1.0 是 Malbolge 异构语言官方参考解释器（Ben Olmstead, 1998），上游仅为单个 malbolge.c 源文件，无 tarball / 无 Makefile / 无构建系统 / 无测试套件"
  - "官方上游 esoteric.sange.fi/orphaned/malbolge/malbolge.c（Last-Modified 1998-04-15），public domain（源码头注释明确声明）；Homebrew formula 同样指向此 .c 文件并标记 version 0.1.0、sha256 一致"
  - "构建方式：直接 clang -O2 -o malbolge malbolge.c，单文件自包含，仅依赖 libc；<malloc.h> 在 OHOS musl sysroot 可用"
  - "产物为动态 ELF64 AArch64，target triple aarch64-unknown-linux-ohos，解释器 /lib/ld-musl-aarch64.so.1，可在 HarmonyOS PC 真实执行"
  - "上游无任何测试：malbolge.c 是唯一源文件，无 tests/ 目录、无 Makefile、无 test target、无 CI 配置、无测试框架；官方 README.txt 列出的 nop.mal 等示例程序是示例程序而非测试用例（不被任何测试 harness 调用）"
  - "nop.mal（2 字符 'DP'）立即终止并返回 0；test_package CHECK 5 以其 'DP' 核心包裹空白（space/tab/newline）生成纯 ASCII 临时 fixture，验证 reference loader 跳过非指令字符后立即终止、退出 0、无输出且不报 'invalid character'"
