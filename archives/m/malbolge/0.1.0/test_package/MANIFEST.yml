# test_package 中自带的测试（消费者视角验证）
# 全部 fixture 为纯 ASCII，无需任何编码/解码。nop.mal 为官方 fixture（2 字节 "DP"）。
# CHECK 5 在运行时由 nop.mal 的 "DP" 核心包裹空白（space/tab/newline）生成临时 ASCII
# 文件，验证 reference loader 的 whitespace handling。
test_package_fixtures:
  - file: nop.mal
    upstream: "https://esoteric.sange.fi/orphaned/malbolge/"
    encoding: "raw (ASCII, 2 bytes)"
    note: "Ben Olmstead no-op 'DP'，立即终止、退出 0；CHECK 5 以此为核心包裹空白生成临时 ASCII fixture"

test_package_tests:
  - file: test.sh
    description: "运行 malbolge 可执行文件 5 项检查：①无参数运行报 'invalid command line' 并退出 1；②不存在文件报 'can't open file' 并退出 1；③非法字符源文件报 'invalid character in source file' 并退出 1；④官方 nop.mal（Ben Olmstead）执行后立即终止、退出 0、无输出；⑤基于 nop.mal 'DP' 核心包裹空白（space/tab/newline）生成的纯 ASCII 临时 fixture，验证 reference loader 跳过非指令字符、立即终止、退出 0、无输出且 stderr 不出现 'invalid character'"
    command: "bash test.sh"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 5
