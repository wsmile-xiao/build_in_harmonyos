# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dplatforms="
    - "-Dgallium-drivers=softpipe,llvmpipe"
    - "-Dvulkan-drivers="
    - "-Dgbm=enabled"
    - "-Degl=enabled"
    - "-Dglx=disabled"
    - "-Dopengl=true"
    - "-Dosmesa=true"
    - "-Dgles1=enabled"
    - "-Dgles2=enabled"
    - "-Dllvm=enabled"
    - "-Dlibunwind=disabled"
    - "-Dvalgrind=disabled"
    - "-Dzstd=disabled"
    - "-Dbuild-tests=false"
    - "-Dtools="

  # 编译依赖列表（格式: name/version）
  dependencies:
    - expat/2.8.2.1.1
    - libdrm/2.4.133

  # 构建期工具依赖；不计入 Mesa 运行时依赖
  build_requirements:
    - bison/3.8.2
    - flex/2.6.4.2
    - m4/1.4.19

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的源码级适配（非补丁文件，直接改源码，见 notes.md 与 reports/）
patches_applied:
  - "HarmonyOS portability patches 0001-0008 + 0010-0011: 0001-0006 from the 24.3.4 baseline + 0007 kms-drm harmonyos + 0008 libgbm exclude-libs (GBM 修复增量) + 0010 osmesa-symbols-check ignore libc weak-UND (r23) + 0011 libEGL --exclude-libs,ALL (r29: 隐藏 link_whole 泄漏的静态 libdrm drm* 符号, egl-symbols-check rc=120→0); r22 0009 static EGL 已撤销（r27: EGL 共享库交付 libEGL.so/libEGL.so.1 供 GTK4 动态加载）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 工具链默认 emutls：mesa 需 -fno-emulated-tls 否则 glapi 导出 __emutls_* 污染 ABI"
  - "OHOS 无 program_invocation_name/getprogname：u_process.c 需读 /proc/self/exe 取进程名"
  - "OHOS open_memstream 只在 fflush 刷新：u_memstream_close 前需 fflush"
  - "OHOS /tmp 只读：测试用 mkdtemp 需走 $TMPDIR"
  - "Python platform.system() 在 OHOS 返回 HarmonyOS：symbols-check 白名单需含该平台与 OHOS 运行库符号"
  - "OSMesa 可在无 X11/GLX 的 HarmonyOS PC 上提供 desktop OpenGL 固定管线符号（glBegin/glEnd/glMatrixMode 等）"
  - "GBM 产物（gbm.pc/gbm.h/libgbm.so）：harmonyos 需按 DRM/KMS 平台识别（patch 0007），且 libdrm 纯静态发布时须 --exclude-libs,ALL 阻止 drm* 符号泄漏进 libgbm 导出表（patch 0008，gbm-symbols-check 通过）"

