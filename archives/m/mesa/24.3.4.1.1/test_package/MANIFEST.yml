# test_package/MANIFEST.yml — mesa 24.3.4.1.1 上游测试声明
# Conan package 24.3.4.1.1 tracks upstream Mesa 24.3.4 and enables OSMesa
# desktop OpenGL for headless HarmonyOS PC consumers. Results are pending.

package: mesa/24.3.4.1.1
homepage: "https://www.mesa3d.org/"

# 上游测试命令（meson 构建）
upstream_check_command: "meson test"

# conanfile.py build() 中未集成上游测试（CI conan create 只做编译验证）
upstream_test_in_build: false
upstream_test_command: "meson test"

# 上游实际运行的测试程序（43 项抽样声明）
upstream_tests:
  - file: src/util/tests/process_test.c
    source: mesa-24.3.4/src/util/tests/process_test.c
    description: "util_get_process_name（OHOS: /proc/self/exe 分支）"
    command: "./src/util/process_test"
  - file: src/util/tests/cache_test.cpp
    source: mesa-24.3.4/src/util/tests/cache_test.cpp
    description: "磁盘着色器缓存（OHOS: TMPDIR/mkdtemp 适配）"
    command: "./src/util/util_tests"
  - file: src/gallium/tests/trivial/quad-tex.c
    source: mesa-24.3.4/src/gallium/tests/trivial/quad-tex.c
    description: "softpipe 离屏纹理渲染"
    command: "./src/gallium/tests/trivial/quad-tex"
  - file: src/gallium/tests/trivial/ohos_adapt_test.c
    source: mesa-24.3.4/src/gallium/tests/trivial/ohos_adapt_test.c
    description: "鸿蒙专项：进程名 + softpipe 离屏渲染像素回读"
    command: "./src/gallium/tests/trivial/ohos_adapt_test"

# test_package 消费者测试：实际链接 OSMesa 并运行固定管线离屏渲染
test_package_tests:
  - file: test.c
    description: "链接 libOSMesa 并调用 desktop OpenGL 固定管线 API"
    command: "./test_mesa"

# 测试断言总数（上游与专项测试待真机复核；消费者 4 项核心断言）
assertion_count: 4
