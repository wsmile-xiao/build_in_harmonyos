# conandata.yml — mesa 24.3.4.1.1 (upstream Mesa 24.3.4)
# 官方 release tarball（archive.mesa3d.org 官方发布归档），SHA-256 已核验

sources:
  url: "https://archive.mesa3d.org/mesa-24.3.4.tar.xz"
  sha256: "e641ae27191d387599219694560d221b7feaa91c900bcec46bf444218ed66025"

patches:
  - patch_file: "patches/0001-bin-symbols-check.py.patch"
    patch_description: "Recognize HarmonyOS platform + allowlist OHOS runtime symbols in symbols-check"
    patch_type: "portability"
  - patch_file: "patches/0002-meson.build.patch"
    patch_description: "Inject -D_GNU_SOURCE and -fno-emulated-tls for the harmonyos platform (OHOS toolchain uses emutls by default)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-gallium-tests-trivial-meson.build.patch"
    patch_description: "Add ohos_adapt_test target to trivial tests (src shipped in package via export, see notes)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-util-memstream.c.patch"
    patch_description: "Flush before fclose in u_memstream_close (OHOS open_memstream only syncs buffer on fflush)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-util-tests-cache_test.cpp.patch"
    patch_description: "Use $TMPDIR for mkdtemp in cache tests (OHOS /tmp is read-only)"
    patch_type: "portability"
  - patch_file: "patches/0006-src-util-u_process.c.patch"
    patch_description: "Read process name from /proc/self/exe via meson-detected macro (no OHOS preprocessor macros)"
    patch_type: "portability"
  - patch_file: "patches/0007-meson.build.kms-drm-harmonyos.patch"
    patch_description: "Treat harmonyos as a DRM/KMS platform (system_has_kms_drm) so -Dgbm=enabled passes meson require() gate; OHOS user-space provides DRM/KMS via libdrm, same tier as linux/android"
    patch_type: "portability"
  - patch_file: "patches/0008-src-gbm-meson.build.exclude-libs.patch"
    patch_description: "Exclude static-library symbols (libdrm.a) from libgbm dynamic export table so gbm-symbols-check passes (upstream gbm ABI = gbm_* only); OHOS ohpcd libdrm is static-only"
    patch_type: "portability"
  - patch_file: "patches/0010-src-gallium-targets-osmesa-meson.build.ignore-weak-und.patch"
    patch_description: "osmesa-symbols-check: ignore libc weak-undefined pthread_mutexattr_{destroy,init,settype} references"
    patch_type: "portability"
  - patch_file: "patches/0011-src-egl-meson.build.exclude-libs.patch"
    patch_description: "libEGL shared library export table: --exclude-libs,ALL to hide static-libdrm symbols leaked via link_whole (137 drm* symbols, egl-symbols-check rc=120 -> 0); same mechanism as GBM patch 0008"
    patch_type: "portability"
  - patch_file: "patches/0012-src-egl-meson.build.ignore-weak-und.patch"
    patch_description: "egl-symbols-check: --ignore-symbol for libc weak-undefined pthread_mutexattr_{destroy,init,settype} (llvm-nm -gP prints weak-UND as 4-field 'w 0 0' which symbols-check.py does not skip); same mechanism as osmesa patch 0010"
    patch_type: "portability"
