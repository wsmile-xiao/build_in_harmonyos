# 版本级 manifest — mesa 26.1.5（上游 Mesa 26.1.5，EGL/GLES/GBM + llvmpipe/softpipe）

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "26.1.5"

# 软件名
software: "mesa"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源）
  url: "https://archive.mesa3d.org/mesa-26.1.5.tar.xz"

  # 源码校验和（已核验）
  sha256: "79e421c7ce18cd9e790b8375920325779f10798630bf30e0b22f1a21c8617122"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dplatforms="
    - "-Degl-native-platform=surfaceless"
    - "-Dgallium-drivers=softpipe,llvmpipe"
    - "-Dvulkan-drivers="
    - "-Dgbm=enabled"
    - "-Degl=enabled"
    - "-Dglx=disabled"
    - "-Dopengl=true"
    - "-Dgles1=enabled"
    - "-Dgles2=enabled"
    - "-Dglvnd=disabled"
    - "-Dllvm=enabled"
    - "-Dlibunwind=disabled"
    - "-Dvalgrind=disabled"
    - "-Dzstd=disabled"
    - "-Dbuild-tests=false"
    - "-Dtools="

  # 编译依赖列表（格式: name/version）
  dependencies:
    - expat/2.8.2.1.1
    - libdrm/2.4.133
    - llvm/20.1.0
    - zlib/1.3.1.1

  # 构建期工具依赖；不计入 Mesa 运行时依赖
  build_requirements:
    - bison/3.8.2
    - flex/2.6.4.2
    - m4/1.4.19

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson.build.patch: harmonyos 纳入 DRM/KMS 平台集合与 _GNU_SOURCE 列表、注入 -fno-emulated-tls、/proc/self/exe 进程名能力宏、测试关闭时 nm 非硬依赖"
  - "0002-bin-symbols-check.py.patch: symbols-check 识别 HarmonyOS 平台并放行 OHOS 运行库符号 __at_fini"
  - "0003-src-util-u_process.c.patch: util_get_process_name() 在无 program_invocation_name/getprogname 的平台改读 /proc/self/exe"
  - "0004-src-util-memstream.c.patch: u_memstream_close() 在 fclose 前 fflush（musl/OHOS open_memstream 语义）"
  - "0005-src-meson.build.ohos-test.patch: 注册鸿蒙专项消费者端到端测试 target（源码见 src_additions/，rule12）"
  - "0006-exclude-libs-drm-symbols.patch: libgbm/libEGL 链接静态 libdrm（libdrm.a）时加 -Wl,--exclude-libs,ALL，阻止 drm* 符号泄漏进动态导出表（src/gbm/meson.build 与 src/egl/meson.build 两处）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 Mesa 25.1.0 移除 OSMesa：26.x 无 -Dosmesa 选项与 osmesa target，headless 离屏渲染应改用 EGL pbuffer/surfaceless + llvmpipe"
  - "OHOS 工具链默认 emutls：mesa 需 -fno-emulated-tls 否则 glapi 导出 __emutls_* 污染 ABI"
  - "OHOS 无 program_invocation_name/getprogname：u_process.c 需读 /proc/self/exe 取进程名"
  - "OHOS open_memstream 只在 fflush 刷新：u_memstream_close 前需 fflush"
  - "Python platform.system() 在 OHOS 返回 HarmonyOS：symbols-check 白名单需含该平台与 OHOS 运行库符号"
  - "OHOS 侧 libdrm 以静态库交付时，libgbm 需 -Wl,--exclude-libs,ALL 阻止 drm* 符号泄漏进导出表（上游 gbm-symbols-check）"
  - "Conan 交叉文件只写 needs_exe_wrapper=true 不写 exe_wrapper：meson 会把全部可运行测试判为 SKIP(exit 77)，须在 [binaries] 段注入 exe_wrapper 才能真正执行上游测试"
  - "CI 同 profile（-pr:h=X -pr:b=X）会被 Conan 判为非交叉：须显式 tools.build.cross_building:cross_build=True，否则 meson 无 [host_machine] 并误选 x86_64 汇编分支"

blockers: []

verification:
  test_package:
    - "消费者用例：EGL pbuffer 离屏渲染往返 + GLES2 着色器管线，断言像素；经 qemu 真实执行通过"
  device:
    - "DAYU200-RK3568 / OpenHarmony 6.0.0.47：鸿蒙特有消费者端到端用例 ohos_egl_e2e 真机执行通过"
