# test_package/MANIFEST.yml — mesa 26.1.5 上游测试声明
# Conan package 26.1.5 tracks upstream Mesa 26.1.5.  Upstream removed OSMesa in
# 25.1.0, so the headless off-screen path is EGL surfaceless/pbuffer + llvmpipe.
# CI 门禁 L0e 要求本文件存在并声明上游官方测试来源（build_system + test 类型）。

package: mesa/26.1.5
homepage: "https://www.mesa3d.org/"

# 上游构建系统与测试入口（meson）
build_system: meson
upstream_check_command: "meson test"

# conanfile.py build() 是否集成上游测试：CI 的 conan create 带
# -o mesa/*:build_tests=True 真实编译上游测试；meson 交叉文件注入
# exe_wrapper = qemu-aarch64-static，使可运行用例真正执行而非 SKIP。
upstream_test_in_build: true
upstream_test_command: "meson test -C <builddir> --num-processes 1 --timeout-multiplier 30"

# 上游测试定义来源（meson test 定义，本配置启用的 suite 覆盖 util / compiler+glsl /
# compiler+nir / gallium / llvmpipe / glapi / gbm / egl）。以下逐条给出真实来源文件，
# 路径均已在 mesa-26.1.5 源码树中核对存在。
upstream_tests:
  - file: src/util/tests/process_test.c
    source: mesa-26.1.5/src/util/tests/process_test.c
    description: "util_get_process_name（OHOS 适配点：改读 /proc/self/exe）"
    test_name: process
    command: "meson test -C <builddir> process"

  - file: src/util/tests/u_memstream_test.cpp
    source: mesa-26.1.5/src/util/tests/u_memstream_test.cpp
    description: "u_memstream_open/close（OHOS 适配点：fclose 前需 fflush）"
    test_name: util_tests
    command: "meson test -C <builddir> util_tests"

  - file: src/util/tests/cache_test.cpp
    source: mesa-26.1.5/src/util/tests/cache_test.cpp
    description: "磁盘着色器缓存"
    test_name: util_tests
    command: "meson test -C <builddir> util_tests"

  - file: src/compiler/glsl/tests/general_ir_test.cpp
    source: mesa-26.1.5/src/compiler/glsl/tests/general_ir_test.cpp
    description: "GLSL IR 优化往返（逐字文本比对）"
    test_name: general_ir_test
    command: "meson test -C <builddir> general_ir_test"

  - file: src/compiler/glsl/glcpp/meson.build
    source: mesa-26.1.5/src/compiler/glsl/glcpp/meson.build
    description: "glcpp 预处理器文本比对（定义名 glcpp，源码在 glcpp/tests/）"
    test_name: glcpp
    command: "meson test -C <builddir> glcpp"

  - file: src/compiler/nir/meson.build
    source: mesa-26.1.5/src/compiler/nir/meson.build
    description: "NIR 单元测试（定义名 nir_tests）"
    test_name: nir_tests
    command: "meson test -C <builddir> nir_tests"

  - file: src/gallium/drivers/llvmpipe/meson.build
    source: mesa-26.1.5/src/gallium/drivers/llvmpipe/meson.build
    description: "llvmpipe 软件光栅化测试定义"
    test_name: llvmpipe
    command: "meson test -C <builddir> --suite llvmpipe"

  - file: src/gallium/auxiliary/meson.build
    source: mesa-26.1.5/src/gallium/auxiliary/meson.build
    description: "gallium 公共层单元测试"
    test_name: gallium
    command: "meson test -C <builddir> --suite gallium"

  - file: src/glx/meson.build
    source: mesa-26.1.5/src/glx/meson.build
    description: "glapi/GLX 测试定义"
    test_name: glapi
    command: "meson test -C <builddir> --suite glapi"

  - file: src/gbm/meson.build
    source: mesa-26.1.5/src/gbm/meson.build
    description: "GBM 缓冲管理测试定义"
    test_name: gbm
    command: "meson test -C <builddir> gbm"

  - file: src/util/tests/format
    source: mesa-26.1.5/src/util/tests/format
    description: "格式转换测试数据目录"
    test_name: util_tests
    command: "meson test -C <builddir> util_tests"

# test_package 消费者测试：经 Conan 解析出的 mesa 包，用真实 EGL + GLESv2
# 公共接口完成离屏渲染往返（CMake 构建 test_mesa，qemu-aarch64 真实执行）
test_package_tests:
  - file: test.c
    description: "链接 libEGL + libGLESv2：EGL pbuffer 离屏渲染 + GLES2 着色器管线并回读像素断言"
    command: "./test_mesa"

# 断言计数
#  - 上游 meson 测试定义：本配置启用的 suite 共 49 条（见 PR 正文表格）
#  - 消费者用例 test.c：14 项 CHECK 断言（第 21 行为宏定义，不计入）
assertion_count: 14
