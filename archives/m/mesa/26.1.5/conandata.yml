# conandata.yml — mesa 26.1.5 (upstream Mesa 26.1.5)
# 官方 release tarball（archive.mesa3d.org 官方发布归档），SHA-256 已核验

sources:
  url: "https://archive.mesa3d.org/mesa-26.1.5.tar.xz"
  sha256: "79e421c7ce18cd9e790b8375920325779f10798630bf30e0b22f1a21c8617122"

patches:
  - patch_file: "patches/0001-meson.build.patch"
    patch_description: "OHOS 平台适配：harmonyos 纳入 DRM/KMS 平台集合与 _GNU_SOURCE 列表、注入 -fno-emulated-tls、/proc/self/exe 进程名能力宏、测试关闭时 nm 非硬依赖"
    patch_type: "portability"
  - patch_file: "patches/0002-bin-symbols-check.py.patch"
    patch_description: "symbols-check 识别 HarmonyOS 平台并放行 OHOS 运行库符号 __at_fini"
    patch_type: "portability"
  - patch_file: "patches/0003-src-util-u_process.c.patch"
    patch_description: "util_get_process_name() 在无 program_invocation_name/getprogname 的平台改读 /proc/self/exe"
    patch_type: "portability"
  - patch_file: "patches/0004-src-util-memstream.c.patch"
    patch_description: "u_memstream_close() 在 fclose 前 fflush（musl/OHOS open_memstream 只在 fflush 同步调用方缓冲区）"
    patch_type: "portability"
  - patch_file: "patches/0005-src-meson.build.ohos-test.patch"
    patch_description: "注册鸿蒙专项消费者端到端测试 target（源码见 src_additions/，rule12）"
    patch_type: "portability"
  - patch_file: "patches/0006-exclude-libs-drm-symbols.patch"
    patch_description: "libgbm/libEGL 链接静态 libdrm（libdrm.a）时加 -Wl,--exclude-libs,ALL，阻止 drm* 符号泄漏进动态导出表（上游 gbm-symbols-check 依赖此项）"
    patch_type: "portability"
