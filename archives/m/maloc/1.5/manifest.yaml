version: "1.5"
software: "maloc"
status: built
build_date: "2026-09-26"
build_system: "autotools"

source:
  url: "http://www.fetk.org/codes/download/maloc-1.5.tar.gz"
  sha256: "58e1197fcd4c74d3cbb1d39d712eb0a3c5886a1e6629f22c5c78ce2bac983fc0"
  tar_format: "tar.gz"

build:
  system: "autotools"
  configure_options:
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "0001-oldstyle-config-scripts-ohos-anchors.patch"
knowledge_gained:
  - "Bundled config.guess/config.sub are pre-2016 old-style (grep -c \"^GUESS=\" -> 0); the perl patcher scores 1/5 and the OHOS branch has to be hand re-anchored. knowledge_ref: archives/m/maloc/1.5/notes.md:24"
  - "This config.guess is older than the one in DRAFT-E564: it has no aarch64:Linux:*:*) branch (grep -c \"aarch64\" -> 0), so the insertion point is the main case line instead. knowledge_ref: archives/m/maloc/1.5/notes.md:37"
  - "E386: bind CONFIG_SHELL/SHELL to a shell probed from the real build directory (pwd rc=0, empty stderr, stdout == build dir). /bin/sh passes and has a print builtin; the profile CONFIG_SHELL (/data/service/hnp/bin/bash) fails the probe. knowledge_ref: archives/m/maloc/1.5/notes.md:105"
  - "E011/E114 family: HMDFS remaps the owner of a freshly created 0700 mktemp dir, so config.status cannot write subs1.awk into the directory it just made; replacing the mktemp branch with the template own mkdir + umask 000 fixes it in-recipe. knowledge_ref: archives/m/maloc/1.5/notes.md:106"
  - "Only lib/libmaloc.a + include/maloc/*.h are produced: upstream tools/ bin_PROGRAMS malocbridge is not built, so cpp_info.bindirs is empty. knowledge_ref: archives/m/maloc/1.5/notes.md:107"

homepage: "http://www.fetk.org/codes/"
license: "LGPL-2.1-or-later"

