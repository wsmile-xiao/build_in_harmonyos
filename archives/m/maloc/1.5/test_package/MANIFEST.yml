package: maloc/1.5
homepage: "http://www.fetk.org/codes/"
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_tests:
  - file: "tools/tests/aloc/Makefile.am"
    source: "maloc-1.5/tools/tests/aloc/Makefile.am"
    description: "Static readings only (一手读数在 archives/m/maloc/1.5/notes.md:68-81): tar tzf | wc -l = 312 entries, find -type f = 253 files, find -iname test* = 1, find -type d -iname res = 0, find -iname *RUNTEST* = 0, grep -rn TESTS --include=Makefile.am = 0 lines, plus 4 noinst_PROGRAMS lines declaring 6 programs (goc, govmpi, govcom, go, eftest, tstheap). Zero TESTS declarations means automake registers no check cases, so make check runs nothing registered; make -n check and make check were NOT executed in this build (conan create stops at make install and the test surface is the 3 assertions below), so no upstream-no-tests conclusion is drawn and no pass/fail denominator is invented. Same wording as notes.md:83 and the last section of that file."
    command: "make check"
test_package_tests:
  - file: "main.c"
    description: "Includes the shipped maloc/maloc.h, asserts VPORTNUMBER==14916 from the installed vio.h, asserts the VNULL sentinel, then calls Vio_start() (vio.h:176) which the upstream malocbridge tool itself calls first."
    command: "./maloc_smoke"
assertion_count: 3
