software: mc
display: "Midnight Commander"
description: "功能强大的视觉文件管理器，类 Norton Commander 界面"
category: file-manager
homepage: "https://www.midnight-commander.org"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "MC 使用 autotools 构建系统，需要 autoconf/automake"
    - "依赖 glib2、ncurses 或 slang 库"
    - "可能需要适配平台检测（config.guess/config.sub）"
  common_dependencies:
    - glib2
    - ncurses
    - slang

versions:
  "4.8.30":
    status: in_progress
    build_date: "2026-05-27"
    source_url: "https://github.com/MidnightCommander/mc/archive/refs/tags/4.8.30.tar.gz"