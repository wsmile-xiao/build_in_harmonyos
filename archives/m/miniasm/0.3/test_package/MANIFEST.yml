# test_package/MANIFEST.yml
# miniasm 0.3.
#
# miniasm ships no upstream test suite: there is no tests/ directory and the
# Makefile only defines all/miniasm/minidot/clean/depend (no check/test).
# Coverage is therefore provided by a consumer test harness.

package: miniasm/0.3
homepage: https://github.com/lh3/miniasm

upstream_tests_exist: false
upstream_test_audit: "no tests/ directory; Makefile targets are all/miniasm/minidot/clean/depend only"
upstream_check_command: "n/a"
upstream_test_in_build: false
upstream_test_command: "n/a (no upstream tests)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_miniasm.py
    description: "-V 版本；无参 usage；合成 all-vs-all PAF 的 GFA 段 / -p paf / -p bed 输出"
    command: "python3 test_miniasm.py <path-to-miniasm>"

test_files:
  - path: "test_package/test_miniasm.py"
    test_type: "R34/R51(补全)"
    assertion_count: 6
    description: "6 项：version、usage、输入生成、GFA 段、PAF 命中、BED 运行"

test_package_test_count: 1
consumer_assertion_count: 6
assertion_count: 6
