software: miniasm
display: "miniasm"
description: "基于 OLC 的长读段 de novo 组装工具，输入 PAF 重叠、输出 GFA 图"
category: utility
homepage: "https://github.com/lh3/miniasm"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 C；依赖 zlib（Conan zlib/1.3.1）、libm；pthread 在 OHOS bionic 下随 libc 提供"
    - "直接按源文件编译并显式指定 zlib include/lib，避免依赖 Makefile 的 gcc 默认设置"
    - "命令行工具，软件级提供 commands.json（R38）"
  common_dependencies:
    - zlib

versions:
  "0.3":
    status: built
    build_date: "2026-09-15"
    conan_ref: "miniasm/0.3"
