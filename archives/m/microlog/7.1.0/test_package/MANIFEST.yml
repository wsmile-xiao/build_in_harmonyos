# test_package/MANIFEST.yml
# 上游官方测试声明文件
# mate 上游测试清单: microlog 7.1.0, tests/unit/ (doctest 框架)

package: microlog/7.1.0
homepage: "https://github.com/an-dr/microlog"

# 上游测试命令 (ctest -N 实测枚举)
upstream_check_command: "cmake --build . -DULOG_BUILD_TESTS=ON && ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/unit/, 16 个独立 CTest 用例)
upstream_tests:
  - file: tests/unit/test_core.cpp
    source: microlog-7.1.0/tests/unit/test_core.cpp
    description: "Core API: init, event creation, message formatting"
    command: "./test_core"
  - file: tests/unit/test_lock.cpp
    source: microlog-7.1.0/tests/unit/test_lock.cpp
    description: "Thread-safety lock set/get via ulog_lock_set_fn"
    command: "./test_lock"
  - file: tests/unit/test_prefix.cpp
    source: microlog-7.1.0/tests/unit/test_prefix.cpp
    description: "Custom prefix via ulog_prefix_set_fn"
    command: "./test_prefix"
  - file: tests/unit/test_topics.cpp
    source: microlog-7.1.0/tests/unit/test_topics.cpp
    description: "Static topics mode add/remove/query"
    command: "./test_topics"
  - file: tests/unit/test_time.cpp
    source: microlog-7.1.0/tests/unit/test_time.cpp
    description: "Time formatting (ULOG_BUILD_TIME)"
    command: "./test_time"
  - file: tests/unit/test_time_np.cpp
    source: microlog-7.1.0/tests/unit/test_time_np.cpp
    description: "Time formatting without prefix"
    command: "./test_time_np"
  - file: tests/unit/test_dynamic_config.cpp
    source: microlog-7.1.0/tests/unit/test_dynamic_config.cpp
    description: "Dynamic runtime configuration"
    command: "./test_dynamic_config"
  - file: tests/unit/test_cleanup.cpp
    source: microlog-7.1.0/tests/unit/test_cleanup.cpp
    description: "ulog_cleanup() cleanup behavior"
    command: "./test_cleanup"
  - file: tests/unit/test_output.cpp
    source: microlog-7.1.0/tests/unit/test_output.cpp
    description: "Output add/remove/level management"
    command: "./test_output"
  - file: tests/unit/test_warn_not_enabled.cpp
    source: microlog-7.1.0/tests/unit/test_warn_not_enabled.cpp
    description: "Disabled level filtering"
    command: "./test_warn_not_enabled"
  - file: tests/unit/test_dynamic_topics.cpp
    source: microlog-7.1.0/tests/unit/test_dynamic_topics.cpp
    description: "Dynamic topics add/remove/assignment"
    command: "./test_dynamic_topics"
  - file: tests/unit/test_event_getters.cpp
    source: microlog-7.1.0/tests/unit/test_event_getters.cpp
    description: "Event getter accessors"
    command: "./test_event_getters"
  - file: tests/unit/test_static_config_header.cpp
    source: microlog-7.1.0/tests/unit/test_static_config_header.cpp
    description: "Static config via generated config header"
    command: "./test_static_config_header"
  - file: tests/unit/test_disabled.cpp
    source: microlog-7.1.0/tests/unit/test_disabled.cpp
    description: "ULOG_BUILD_DISABLED compile-time path"
    command: "./test_disabled"
  - file: tests/unit/test_event_to_cstr.cpp
    source: microlog-7.1.0/tests/unit/test_event_to_cstr.cpp
    description: "ulog_event_to_cstr() formatting"
    command: "./test_event_to_cstr"
  - file: tests/unit/test_microlog6_compat.cpp
    source: microlog-7.1.0/tests/unit/test_microlog6_compat.cpp
    description: "microlog v6 compatibility API"
    command: "./test_microlog6_compat"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 仅含公开头 <ulog.h>, 调用 ulog_info 宏 (默认 stdout 输出), freopen 捕获 stdout 断言消息与级别字符串"
    command: "./test_microlog"

# 测试断言总数 (doctest assertions across 16 suites, per reports/upstream-test-ledger.md)
assertion_count: 853