# 版本级 manifest — microlog 7.1.0
# 文件位置: archives/m/microlog/7.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.1.0"

# 软件名
software: microlog

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag v7.1.0）
  url: "https://github.com/an-dr/microlog/archive/refs/tags/v7.1.0.tar.gz"

  # 源码校验和（官方 tarball 实测）
  sha256: "fd8aa1e993a421d90aeae5d0c9765b40f69675d1b4d117b847d3f9d940e4063b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DULOG_BUILD_TESTS=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）——无第三方运行时依赖
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁）
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "C 源码分发 INTERFACE 库（install 装 ulog.c 到 share/microlog/src/ + 手写 targets 在消费方编译）的 Conan 配方：cmake_find_mode=none + builddirs 透传自带 config，消费者 find_package(microlog CONFIG) 得 microlog::microlog"
- "conandata.yml 源码 URL 必须带 .tar.gz 扩展名（codeload tar.gz/refs/tags 形式 basename 无扩展名 → conan get() 误按 zip 解压报 BadZipFile，见 E276）"
- "特性宏（ULOG_BUILD_EXTRA_OUTPUTS/TOPICS_MODE/TIME）须在消费方编译期配置，默认配置下自定义输出/主题 API 为禁用态"
- "上游 tmpfile() 测试用例在 OHOS 平台受限（/tmp 只读且 libc 不遵循 TMPDIR），4 个用例如实计入双口径台账分母，不修改上游测试"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"