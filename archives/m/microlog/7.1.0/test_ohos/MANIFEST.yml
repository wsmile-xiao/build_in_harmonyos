# test_ohos/MANIFEST.yml — microlog 7.1.0 HarmonyOS PC 专项验证
# 三项独立鸿蒙检查（run_ohos_test.sh，任一失败非零退出）：
#   T1_aarch64_elf    ELF64 AArch64（readelf -h）
#   T2_no_host_paths  无宿主绝对路径泄漏（/storage /home /Users / .conan2）
#   T3_consumer_run   消费者程序真实运行：主题路由 + 文件输出 + 级别字符串
#                     + ulog_event_to_cstr 事件格式化（调用公开 API 并断言结果）
checks:
  - id: T1_aarch64_elf
    desc: ELF64 AArch64 (readelf -h)
  - id: T2_no_host_paths
    desc: no absolute host paths leaked into the consumer binary
  - id: T3_consumer_run
    desc: consumer program compile/link/run against installed package, asserts observable output
assertion_count: 7
assertion_count_note: 2 machine checks (T1 readelf / T2 leak scan) + 5 in-program assertions (ulog_output_add, ulog_topic_add, fopen+file output content, ulog_level_to_string, capture handler count)
test_language: c
test_framework: bare
framework_flavor: bare