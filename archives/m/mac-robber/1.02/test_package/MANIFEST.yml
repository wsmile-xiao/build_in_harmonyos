# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh) 要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mac-robber/1.02
homepage: "https://sleuthkit.org/mac-robber/"

# 上游测试存在性审计（hmbs 硬门禁要求）
# 审计结论：mac-robber 1.02 上游正式测试为 0
upstream_tests_exist: false
upstream_test_audit: |
  审计结论：mac-robber 1.02 上游正式测试为 0，证据完整。
  1. 官方 SourceForge release tarball（2010-02-12）文件清单仅 6 个：
     .indent.pro, CHANGES, COPYING, Makefile, README, mac-robber.c。
     无 tests/、test/、regress/ 目录。
  2. Makefile 目标: all, linux, linux_notstatic, sun, simple, clean, indent —
     无 check/test 目标。执行 `make check` 将报 "No rule to make target 'check'"。
  3. 全文件搜索 make check/make test/TESTS/check_PROGRAMS/check-local/ctest/pytest
     均无匹配。
  4. GitHub autotools 版（sleuthkit/mac-robber tag 1.02，作者迁移）交叉核实：
     configure.ac 无 AC_CONFIG_TESTDIR；Makefile.am 无 check_PROGRAMS/TESTS；
     Makefile.in 仅有 automake 默认的空 check: check-am（无 check_PROGRAMS 则不执行任何测试）；
     .github/workflows/build.yml CI 仅 ./configure && make，无 make check/make test。
  5. 上游不在 no_official_test.txt 白名单中（该白名单仅用于已知 OHOS 不兼容场景）。

# 上游测试命令 (mac-robber has no make check target)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (mac-robber has no upstream tests)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "构造审计文件树（普通文件/空文件/目录/符号链接），真实执行 mac-robber 扫描并验证输出"
    command: "sh test.sh <bin>"

# 测试断言总数 (test_package 8 条断言)
assertion_count: 8

# 测试套件覆盖说明
test_suite_gaps:
  none: "上游无正式测试套件；test_package 覆盖核心功能：目录递归扫描、文件名输出、目录识别、符号链接 readlink、-V 版本、非法参数非零退出"
