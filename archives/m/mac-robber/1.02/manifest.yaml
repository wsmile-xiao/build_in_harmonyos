version: "1.02"
software: "mac-robber"
status: built
build_date: "2026-08-31"
build_system: makefile

source:
  url: "https://downloads.sourceforge.net/project/mac-robber/mac-robber/1.02/mac-robber-1.02.tar.gz"
  sha256: "5895d332ec8d87e15f21441c61545b7f68830a2ee2c967d381773bd08504806d"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  make_target: "linux_notstatic"

patches_applied:
  - "0001-maxnamlen-musl.patch"

knowledge_gained:
  - "mac-robber 1.02 是单文件 C 程序（369 行），仅依赖 POSIX 标准库（sys/stat.h, dirent.h, unistd.h 等），无任何 Linux/BSD 专有字段或 API"
  - "struct stat 仅使用 st_mode/st_uid/st_gid/st_size/st_atime/st_mtime/st_ctime（全 POSIX 标准字段），不使用 nanosecond 变体 st_atim/st_mtim/st_ctim"
  - "不使用 major/minor 设备号、PATH_MAX、getpwuid/getgrgid；文件类型宏 S_IFREG/S_IFDIR/S_IFLNK 等均为 POSIX 标准"
  - "唯一 musl 兼容缺口：第 241 行 do_dir() 使用 MAXNAMLEN（BSD/glibc 扩展宏，musl <dirent.h> 未定义），用 1 个 3 行源码补丁 fallback 为 256（与 glibc 定义一致）"
  - "Makefile 硬编码 CC=gcc 和 -static，但提供 linux_notstatic 目标（非静态 + -D_FILE_OFFSET_BITS=64）；CC 可在命令行覆盖，无需 Makefile 补丁"
  - "上游无任何正式测试：SourceForge release tarball 无 tests/ 目录、无 check/test Makefile 目标、无 TESTS/check_PROGRAMS；GitHub autotools 版同样无 check_PROGRAMS/TESTS，CI 仅 configure+make"
