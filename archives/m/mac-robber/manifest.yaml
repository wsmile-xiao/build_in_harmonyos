software: mac-robber
display: "mac-robber"
description: "数字取证工具：收集已挂载文件系统文件的 MAC 时间元数据"
category: security
homepage: "https://sleuthkit.org/mac-robber/"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C 程序（369 行），仅依赖 POSIX 标准库，无运行时依赖"
    - "Makefile 硬编码 gcc/static，但 CC 可命令行覆盖，使用 linux_notstatic 目标"
    - "MAXNAMLEN 宏 musl 未定义，用 3 行补丁 fallback 为 256"
  common_dependencies: []

versions:
  "1.02":
    status: built
    build_date: "2026-08-31"
    conan: true
