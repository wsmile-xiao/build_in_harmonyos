# 版本级 manifest — mcabber 1.1.2
# 遵循 ARCHIVE-SPEC v2.0

version: "1.1.2"
software: "mcabber"

status: built
build_date: "2026-10-01"
build_system: "autotools"

source:
  url: "https://mcabber.com/files/mcabber-1.1.2.tar.bz2"
  sha256: "c4a1413be37434b6ba7d577d94afb362ce89e2dc5c6384b4fa55c3e7992a3160"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--host=aarch64-unknown-linux-gnu"
    - "--with-libidn=no"
    - "--disable-gpgme"
    - "--disable-otr"
    - "--disable-hgcset"
  dependencies:
    - glib/2.84.0.1
    - loudmouth/1.5.4
    - ncurses/6.6
  cc: clang

patches_applied: []

knowledge_gained:
  - "configure.ac 的 ncursesw/unicode 判定（cf_ncurses_unicode）整块被 AC_CHECK_FUNC(initscr,, ...) 的空动作短路——AutotoolsDeps 把 -lncursesw 注入 LIBS 后 initscr 立即可链，探测块不再执行，HAVE_UNICODE 静默未定义（configure 只给 WARNING）。generate() 显式 extra_defines.append('HAVE_UNICODE') 即修复，且自校验（未真链宽字符 API 会在链接期报 waddnwstr 未定义）"
  - "conan rm() 默认非递归（recursive=False），自动工具把产物装到一级子目录（lib/mcabber/*.la）时 lib/*.la 通配不到：清理 libtool 归档必须 rm(..., recursive=True)，否则包内残留带构建机绝对路径的 .la"
  - "configure.ac 探测 loudmouth-1.0 模块名，而 loudmouth 包 pkg_config_name=loudmouth-1：generate() 内把 loudmouth-1.pc 复制为 loudmouth-1.0.pc 即解（包内自带的 loudmouth-1.0.pc prefix 为陈旧的 /，不可用）"
  - "应用类 autotools 包同样需要 E129/E011 分层 configure（--no-create → 改 config.status umask 077→022 → /bin/sh 执行）+ 预置 ac_cv_build，否则 HMDFS 上 configure 中止"
  - "上游无测试套件（无 tests/ 目录，所有 Makefile.am 无 TESTS/check_PROGRAMS）：按 R51 场景三补写 test_package 消费者测试（真实执行 bin/mcabber 并断言 PKGLIB_DIR 指向的插件目录与包内布局一致）"

# 无源码补丁：全部适配在 conanfile.py 内完成（依赖 flags 注入 + 生成期宏定义）
patch_generation:
  method: none
  patches_count: 0
  note: "refresh-patch --auto 只识别到构建期生成文件（include/stamp-h2、mcabber/.dirstamp，已判为 GENERATED 并排除），无源码改动"
