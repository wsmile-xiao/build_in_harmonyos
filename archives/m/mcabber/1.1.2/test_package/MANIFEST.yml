# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mcabber/1.1.2
homepage: "https://mcabber.com"

# 上游测试命令 (用于 make -n check / configure 目标分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试 (上游无测试套件, 无需集成)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# mcabber 1.1.2 无上游测试套件: 源码树无 tests/ 目录, 根目录及各子目录
# Makefile.am 中均无 TESTS / check_PROGRAMS 声明, `make check` 为空目标
# (清点证据见 notes.md "上游测试清点" 一节)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 mcabber -h / -V, 校验 unicode+modules 编译特性、插件目录布局 (PKGLIB_DIR 与包内 lib/mcabber 一致且含 4 个插件)、未知参数非零退出、包内无 .la 残留"
    command: "mcabber -h && mcabber -V"
  - file: test.sh
    description: "同上检查的 shell 版本, 可在 conanrun 环境中手工复现"
    command: "sh test.sh"

# 测试断言总数 (conanfile.py test() 内的断言条目数, 逐项对照见 reports/test-report.md §2)
assertion_count: 8
