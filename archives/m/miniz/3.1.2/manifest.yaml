knowledge_gained:
  - "miniz 3.1.2 为纯 C 单文件 ZIP/DEFLATE 库，无外部依赖，上游原生 CMake（option: BUILD_EXAMPLES/BUILD_FUZZERS/BUILD_TESTS/AMALGAMATE_SOURCES/BUILD_HEADER_ONLY/BUILD_SHARED_LIBS/BUILD_NO_STDIO/INSTALL_PROJECT）"
  - "miniz 与宿主 zlib (libz.so) 同名：强制 BUILD_SHARED_LIBS=OFF 静态库 (R26)，消费方需定义 MINIZ_STATIC_DEFINE"
  - "上游非 amalgamation 路径已 set VERSION/SOVERSION，静态构建无 SONAME 质量门负担；导出 miniz_export.h 仅共享库需要"
  - "zlib-compat API 为 mz_compress/mz_uncompress/mz_compressBound（带 mz_ 前缀），compress/uncompress/compressBound 为内联别名"

