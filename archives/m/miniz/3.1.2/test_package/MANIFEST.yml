# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: miniz/3.1.2
homepage: "https://github.com/richgel999/miniz"

# 上游测试命令 (用于 make -n check / ctest -N 分析)
# 上游测试为 Catch2 (tests/main.cpp + catch_amalgamated.cpp)，需 C++20，
# 且测试程序读取大文件样本，CI clean 环境无样本文件，故关闭 BUILD_TESTS，
# 改用 test_package 消费者测试验证压缩能力。
upstream_check_command: "ctest (Catch2, disabled — requires C++20 + sample files)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（已关闭，此处仅声明）
upstream_tests:
  - file: tests/main.cpp
    source: miniz-3.1.2/tests/main.cpp
    description: "上游 Catch2 单元测试（zip/tdef/tinfl 全流程，需 C++20 + 样本文件，CI 未启用）"
    command: "./catch_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：mz_compressBound/mz_compress/mz_uncompress 压缩往返 + memcmp 完全一致验证 + mz_adler32/mz_crc32 校验和 + mz_version"
    command: "./test_miniz"

# 测试断言总数 (近似值, 用于质量评估)
# 版本(1) + compressBound(1) + compress(1) + uncompress(1) + length(1) + memcmp(1) + adler32(1) + crc32(1) = 8
assertion_count: 8
