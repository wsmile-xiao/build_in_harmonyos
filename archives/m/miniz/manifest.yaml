# 软件级 manifest — miniz
# 遵循 ARCHIVE-SPEC v2.0

software: miniz
display: "miniz"
description: "轻量级纯 C 压缩 / ZIP 库，提供 zlib 兼容 API 与完整 ZIP 归档读写"
category: library
homepage: "https://github.com/richgel999/miniz"
license: MIT
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 C（C90）ZIP/DEFLATE/inflate 库，无外部依赖，上游原生 CMake 非 amalgamation 路径在 OHOS aarch64 可直接构建，无需补丁"
    - "miniz 与宿主 zlib (libz.so) 同名：强制 BUILD_SHARED_LIBS=OFF 静态库 (R26)，消费方需定义 MINIZ_STATIC_DEFINE"
    - "关闭 BUILD_EXAMPLES/BUILD_FUZZERS/BUILD_TESTS（上游 Catch2 测试需 C++20），改用 test_package 消费者测试验证压缩能力"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.1.2":
    status: built
    build_date: "2026-08-24"
