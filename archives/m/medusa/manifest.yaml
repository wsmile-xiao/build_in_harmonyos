software: medusa
display: "Medusa Parallel Network Login Auditor"
description: "Parallel network login auditor: threaded credential auditing against SSH/HTTP/FTP/SMB and other services, with protocol support loaded as runtime .mod plug-ins"
category: security
homepage: "https://github.com/jmk-foofus/medusa"
license: GPL-2.0-or-later
build_system: autotools

# 上游为 GPL-2.0-or-later，并带 OpenSSL 链接例外（见源码头部声明：
# "released under the GPL with the additional exemption that compiling,
#  linking, and/or using OpenSSL is allowed"）。

ohos_adaptation:
  key_points:
    - "config.guess / config.sub 补充 HarmonyOS 识别（aarch64-unknown-linux-ohos）"
    - "OHOS 目标下去掉 -lrt（musl 无独立 librt）"
    - "取消类调用改用 AC_CHECK_FUNCS 能力探测（HAVE_PTHREAD_CANCEL），补丁不引入平台宏"
    - "OpenSSL legacy provider 随包分发并导出 OPENSSL_MODULES（核心程序启动即加载）"
    - "模块目录通过 MEDUSA_MODULE_PATH 在运行期覆盖（编译期 DEFAULT_MOD_PATH 不可用）"
  common_dependencies:
    - "openssl/3.0.21"
    - "libssh2/1.11.1"
    - "libgcrypt/1.11.0"

versions:
  "2.3":
    status: built
    build_date: "2026-09-29"
