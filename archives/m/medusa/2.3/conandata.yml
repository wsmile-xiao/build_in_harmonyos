sources:
  url: "https://github.com/jmk-foofus/medusa/releases/download/2.3/medusa-2.3.tar.gz"
  sha256: "b0b7b75b562f96134cb95aa58e867d580b7c526c7a07e37f955ad3c3c3c8e251"
patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess 增加 HarmonyOS/OHOS 系统识别，返回 aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub 接受 linux-ohos 三元组，避免 Invalid configuration ... system 'ohos' not recognized"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-ohos-link-flags.patch"
    patch_description: "OHOS/musl 无独立 librt，链接参数去掉 -lrt（clock_gettime 等已在 libc 中）"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-config-status-tmpdir.patch"
    patch_description: "config.status 工作目录不再用 umask 077 创建（OHOS 上该权限目录不可写）"
    patch_type: "portability"
  - patch_file: "patches/0005-thread-pool-no-cancel-capability.patch"
    patch_description: "取消类接口按 HAVE_PTHREAD_CANCEL 能力宏条件编译（无该能力时走 POOL_DESTROY 协作关闭）"
    patch_type: "portability"
  - patch_file: "patches/0006-ohos-ssh-module-gcrypt-wrapper.patch"
    patch_description: "OHOS 无 ldd/otool，跳过 libssh2 的 libgcrypt 兜底探测，避免误禁用 SSH 模块"
    patch_type: "portability"
  - patch_file: "patches/0007-pthread-cancel-capability-guard.patch"
    patch_description: "configure 探测 pthread_cancel 并定义 HAVE_PTHREAD_CANCEL（供 0005 使用，避免平台宏）"
    patch_type: "portability"
