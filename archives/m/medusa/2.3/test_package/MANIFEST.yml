# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: medusa/2.3
homepage: "https://github.com/jmk-foofus/medusa"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# medusa 2.3 上游没有测试套件:
#   - Makefile.am 只声明 man_MANS/EXTRA_DIST, 没有 TESTS/check_PROGRAMS
#   - release tarball 中没有 test/ 目录, 也没有任何上游自测程序
# 因此 `make check' 只会执行 automake 内建的空 check 目标 (返回 0);
# 真正的验证全部由 test_package 承担, 见 test_package_tests。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 分两层:
#   A) 产物层 test_medusa.sh —— 二进制在包内真实启动并 dlopen 加载服务模块 (R34)
#   B) 消费者层 test_medusa_e2e.sh —— 完整消费者用例 (规则 12: 真正跑通端到端流程)
#      在 loopback 上拉起带唯一合法口令的 FTP 服务 (python3 标准库实现,
#      见 ftp_e2e_server.py), 再用包内二进制发起真实审计: 必须完成 FTP 协议对话,
#      命中合法口令并输出 ACCOUNT FOUND ... [SUCCESS], 且对错误口令不得误报。
test_package_tests:
  - file: test_medusa.sh
    description: "校验 lib/medusa/modules/*.mod 已随包安装"
    command: "ls \"$PKG/lib/medusa/modules\"/*.mod"
  - file: test_medusa.sh
    description: "执行 `medusa -d` 并统计 dlopen 成功 (剔除 Couldn't load / Invalid module 失败行) 的模块数 (>=10)"
    command: "MEDUSA_MODULE_PATH=\"$PKG/lib/medusa/modules\" medusa -d | sed -e \"/Couldn't load/d\" -e '/Invalid module/d' | sed -n 's/^[[:space:]]*+[[:space:]]*\\([A-Za-z0-9._-]*\\)\\.mod[[:space:]]*:.*/\\1/p' | sort -u | wc -l"
  - file: test_medusa.sh
    description: "断言核心模块 http/ftp/smtp/telnet/vnc 均已加载 (口径同上级, 排除失败行)"
    command: "medusa -d | sed -e \"/Couldn't load/d\" -e '/Invalid module/d' | sed -n 's/^[[:space:]]*+[[:space:]]*\\([A-Za-z0-9._-]*\\)\\.mod[[:space:]]*:.*/\\1/p' | sort -u"
  - file: test_medusa.sh
    description: "断言 ssh 模块 dlopen 成功 (libssh2 + libgcrypt 集成成功)"
    command: "medusa -d | sed -e \"/Couldn't load/d\" -e '/Invalid module/d' | sed -n 's/^[[:space:]]*+[[:space:]]*\\([A-Za-z0-9._-]*\\)\\.mod[[:space:]]*:.*/\\1/p' | sort -u | grep -qx ssh"
  - file: test_medusa_e2e.sh
    description: "完整消费者用例: 对本机 FTP 服务发起真实审计并命中合法口令"
    command: "bash test_medusa_e2e.sh \"$PKG/bin/medusa\" \"$PKG/lib/medusa/modules\""
  - file: test_medusa_e2e.sh
    description: "服务端证据: FTP 服务确实收到 USER/PASS 并认证成功 (E2E AUTH_OK)"
    command: "grep -q '^E2E AUTH_OK' <server.log>"
  - file: test_medusa_e2e.sh
    description: "客户端证据: medusa 输出 ACCOUNT FOUND ... [SUCCESS]"
    command: "grep -qE '\\[ftp\\] Host: 127\\.0\\.0\\.1 User: e2euser Password: e2epass \\[SUCCESS\\]' <audit.log>"
  - file: test_medusa_e2e.sh
    description: "反向对照: 错误口令既不得到服务端 AUTH_OK 也不被 medusa 误报成功"
    command: "grep -q '^E2E PASS wrongpass$' <server.log> && ! grep -q '^E2E AUTH_OK' <server.log>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17
