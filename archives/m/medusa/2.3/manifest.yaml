software: medusa

# ============================================================
# 必须字段
# ============================================================

version: "2.3"
build_system: autotools
status: built
build_date: "2026-09-29"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/jmk-foofus/medusa/releases/download/2.3/medusa-2.3.tar.gz"
  sha256: "b0b7b75b562f96134cb95aa58e867d580b7c526c7a07e37f955ad3c3c3c8e251"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--with-ssl=<openssl package folder>"
    - "--enable-module-afp=no"
    - "--enable-module-ncp=no"
    - "--enable-module-postgres=no"
    - "--enable-module-rdp=no"
    - "--enable-module-svn=no"
    - "--enable-module-smbnt-smb2=no"
  dependencies:
    - "openssl/3.0.21"
    - "libssh2/1.11.1"
    - "libgcrypt/1.11.0"
  optional_dependencies:
    - "libsmb2/6.2"
  cc: clang
  cxx: clang++

# ============================================================
# 验证信息（真机 conan create）
# ============================================================

verification:
  machine: "HarmonyOS aarch64 / clang 15.0.4 / Conan 2.29.1"
  profile: "ohos-aarch64-localdevice"
  run_dir: "$HOME/ohos-test-runs/medusa-medusa-medusa-2.3-r8fix-20260930-161525-46667"
  result: "conan create Success: 1 / Failed: 0"
  gates:
    L0: "pass: all checks passed"
    L1: "pass: upstream tests + test_package executed"
    L2: "skip: medusa has no --version/--help (uses -V; -h means host); covered by test_package"
    L4: "warn: dangerous functions in patches (pthread_cancel/mktemp inside patch text)"
    L5: "pass: bin/ has content"
  runtime:
    - "bin/medusa -V 成功（rc=0）"
    - "medusa -d 列出 22 个服务模块"
    - "包内 lib/ossl-modules/legacy.so 可用，OPENSSL_MODULES 已由 runenv 导出"
    - "完整消费者用例（test_medusa_e2e.sh）：对本机 FTP 服务发起真实审计，命中合法口令输出 ACCOUNT FOUND ... [SUCCESS]，错误口令不误报"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-ohos-link-flags.patch"
  - "0004-configure-config-status-tmpdir.patch"
  - "0005-thread-pool-no-cancel-capability.patch"
  - "0006-ohos-ssh-module-gcrypt-wrapper.patch"
  - "0007-pthread-cancel-capability-guard.patch"

# ============================================================
# 知识提炼（路径 B：知识库扩展）
# ============================================================

knowledge_drafts:
  - "knowledge/drafts/DRAFT-medusa-conan-generate-dep-paths.kv"
  - "knowledge/drafts/DRAFT-medusa-conan-generate-dep-paths.md"
  - "knowledge/drafts/DRAFT-medusa-autotools-platform-triplet-and-probe.kv"
  - "knowledge/drafts/DRAFT-medusa-autotools-platform-triplet-and-probe.md"
knowledge_evidence: "reports/knowledge-evidence.md"
knowledge_ref:
  - "E007 增量：标准脚本插入的 config.guess 分支缺 echo/exit，会穿透到失败路径"
  - "E072 增量：-linux-ohos 必须插在通用 -linux*) 之前，否则 os 被改写成 linux-gnu-ohos"
  - "E085/E127 增量：取消类调用改用 HAVE_PTHREAD_CANCEL 能力探测（R8 要求补丁不得引入平台宏），无该能力时走协作关闭路径"
  - "E011/E060/E112 未重复申报；补丁 0004 提供改源头的方案增量"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "仓库标准脚本 scripts/patch-autotools-ohos.pl 给 config.guess 插入的 HarmonyOS 分支只有 GUESS=... 而没有 echo \"$GUESS\"; exit，脚本会继续走到 'unable to guess system type'；本轮补丁在其输出上补齐了 echo/exit（E007 建议方案在该脚本上不完整，值得回写）"
  - "2018-02-22 版 config.sub 除白名单外还有一条 -linux*) 规则会把 os 改写成 linux-gnu，导致 aarch64-linux-ohos 被规范化为 aarch64-unknown-linux-gnu-ohos；必须在 -linux*) 之前插入 -linux-ohos*) 分支"
  - "OHOS 不允许创建 FIFO：make -jN 的 jobserver mkfifo 报 'Operation not permitted'（只影响并行度，不失败），但 make -j1 更干净"
  - "OHOS /storage/Users 挂载带 hmmac=use_task，umask 077 创建的 drwx--S--- 目录连属主都无法写入；Autoconf 的 config.status 正是这样建工作目录，导致 'subs1.awk: Permission denied'。改为默认 umask 建目录即可"
  - "OHOS musl 未实现 pthread_cancel/pthread_setcancelstate/pthread_setcanceltype；medusa 线程池可改用 POOL_DESTROY + pthread_cond_broadcast 的协作关闭路径。按 R8，patches/ 不得用 __OHOS__ 平台宏屏蔽接口，应改用 AC_CHECK_FUNCS 能力探测（本库最终采用 0005+0007 方案，仓库内已有 HAVE_PTHREAD_CANCEL 先例）"
  - "medusa 的 SMBv2/3 之外，SSH 模块的启用依赖一条脆弱的探测链：ld --verbose/ldd 缺失会把 libssh2 误判为 libgcrypt 版，进而额外要求 gnutls（OHOS 未发布）并静默禁用 SSH；对 *ohos* 目标直接跳过该兜底即可"
  - "medusa 启动时无条件 OSSL_PROVIDER_load(NULL, \"legacy\")，静态 libcrypto 以 DSO 方式加载 provider；registry 中 openssl/3.0.21 未用 no-legacy/no-module（包内有 lib/ossl-modules/legacy.so），3.5.6.x 则删除该目录。另需把 provider 复制进本包并在 package_info 导出 OPENSSL_MODULES，才能开箱即用"
  - "Conan 2.29.1 中 self.dependencies[...].package_folder 与 cpp_info.location 在 generate() 阶段都可能为 None；可用 AutotoolsDeps 生成脚本里的绝对路径反推 Conan store 再用截断目录名（openssl → opens）+ 目录结构匹配定位包"
  - "AutotoolsToolchain 会把依赖 LIBS 写入 conanbuild 环境，configure 会把它追加到每个 conftest；共享依赖不在 loader 路径上时会报 'Error loading shared library' 并让 configure 误判 'cannot run C compiled programs'。给依赖 -L 目录补 -Wl,-rpath 即可"
  - "medusa 的服务模块是 dlopen 的 *.mod 插件，编译期 DEFAULT_MOD_PATH 是绝对路径；运行期用上游支持的 MEDUSA_MODULE_PATH 覆盖（recipe 已写入 runenv_info）"
  - "上游无测试套件（Makefile.am 无 TESTS/check_PROGRAMS，tarball 无 test 目录，make check 只是 automake 空目标），实质验证放在 test_package：medusa -d 统计 dlopen 成功的模块"
  - "纯断言式 test_package（只校验产物属性）不足以构成完整消费者用例；为 CLI 类库补端到端用例的可行做法：用被测进程自带的 python3 标准库写一个最小协议服务端（本库为 FTP：220/331/230/530 四条应答即可满足 src/modsrc/ftp.c 的对话），在 loopback 上起服务后让被测二进制真正完成一次业务动作，再用服务端 wire log（USER/PASS/AUTH_OK）与客户端 SUCCESS 输出双向取证，并配一条错误口令的反向对照防止误报"
  - "afpfs-ng/ncpfs/libpq/FreeRDP3/subversion 均未在 OHOS 制品仓发布，对应模块显式 --enable-module-*=no 关闭，构建摘要更清晰"
