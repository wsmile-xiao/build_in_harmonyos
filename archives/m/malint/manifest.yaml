software: malint
display: "malint"
description: "MPEG Audio stream validator — parses MPEG audio streams and reports stream information and format violations (Dieter Baron, nih.at)"
category: multimedia
homepage: "https://www.nih.at/malint/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "官方 tarball（autoconf 2.59）自带 configure，无需 bootstrap；不含 config.guess/config.sub，显式传 --build/--host 三元组规避（E007 同类）"
    - "HMDFS setgid 目录组权限：autoconf umask 077 临时目录不可写 → configure/make/check/install 统一 umask 022（E011/E052 同类，R49）"
    - "纯 C 无第三方依赖：musl libc 自带 strerror/getopt，LIBOBJS 替换不启用，无源码补丁"
  common_dependencies: []

versions:
  "0.2":
    status: built            # 真机 shadow CI 全绿（L0-L5 pass，上游 6/6），PR 合入后置 published
    build_date: "2026-10-01"
    format: conan
    note: "autotools 配方；bin/malint 工具；真机 shadow CI 上游 regress 6/6 + test_package PASS，L0/L1/L2/L4/L5 全 pass；含设备 shell 故障期适配（zsh 解释执行/umask patch/TMPDIR/CC 注入）"
