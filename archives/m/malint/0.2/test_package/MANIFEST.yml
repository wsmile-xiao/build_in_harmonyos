# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制)

package: malint/0.2
homepage: "https://www.nih.at/malint/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (regress/runtest 驱动, 6 用例)
upstream_tests:
  - file: regress/frame-l3crc.test
    source: malint-0.2/regress/frame-l3crc.test
    description: "Layer III CRC 校验违规报告"
    command: "./runtest frame-l3crc"
  - file: regress/frame-long.test
    source: malint-0.2/regress/frame-long.test
    description: "长帧（MPEG 1）解析"
    command: "./runtest frame-long"
  - file: regress/frame-short.test
    source: malint-0.2/regress/frame-short.test
    description: "短帧（MPEG 2 layer 3）解析与缺字节报告"
    command: "./runtest frame-short"
  - file: regress/id3v1-end.test
    source: malint-0.2/regress/id3v1-end.test
    description: "流末尾 id3v1 标签解析"
    command: "./runtest id3v1-end"
  - file: regress/id3v1-noseek.test
    source: malint-0.2/regress/id3v1-noseek.test
    description: "不可 seek 输入的 id3v1 解析（stdin）"
    command: "./runtest id3v1-noseek"
  - file: regress/id3v1-short.test
    source: malint-0.2/regress/id3v1-short.test
    description: "流中段 id3v1 标签解析"
    command: "./runtest id3v1-short"

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_malint.sh
    description: "消费者冒烟：--help 退出 0；内嵌上游 frame-short.in 样本 -N3 输出关键行比对（帧头参数/缺字节报告/帧计数）；交叉时 conanfile.py 降级 ELF 魔数检查"
    command: "sh test_malint.sh <malint-bin>"

# 测试断言总数（test_package conanfile.py 内 assert 数）
assertion_count: 6
