# 版本级 manifest — malint 0.2
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.2"
software: "malint"

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源 nih.at）
  url: "https://www.nih.at/malint/malint-0.2.tar.gz"
  # 源码校验和（官方 tarball SHA-256）
  sha256: "798a76d60df6c1c18c0b9d6661f1e320d515fa24517c69c538d6256e57f15ca2"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（tarball 自带 autoconf 2.59 configure，无需 bootstrap）
  configure_options:
  - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu"

  # 编译依赖列表（malint 无第三方依赖，仅系统 libc/libm）
  dependencies: []

  # 编译器（OHOS SDK clang, 由 profile conf 注入）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无源码补丁：适配通过显式 --build/--host 三元组 + umask 022 构建环境处理
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "malint 0.2 tarball（autoconf 2.59）不含 config.guess/config.sub：显式传 --build/--host 三元组规避内联 uname 猜测（E007 同类规避）"
- "HMDFS setgid 目录组权限限制（E011/E052/E129 同类）：configure 内 umask 077 字面替换为 022 + 全部构建命令 umask 022 运行"
- "设备 shell 故障适配：/bin/sh 与 hnp bash 不可执行时，用 HMDFS zsh 直接解释执行 configure（绕开 shebang exec，E087）；make 显式 SHELL= 注入；make check 用 TESTS_ENVIRONMENT=sh 让 runtest 经 sh 显式调用（HMDFS 无执行位 E046）"
- "设备 /tmp 只读（E002）时 clang/zsh 临时文件失败：TMPDIR/TMPPREFIX 指向 build 目录自建 tmp/"
- "PATH 中的 cc 可能是 shebang 失效的 HMDFS 包装脚本（bad interpreter）：CC 必须从 Conan conf 显式注入（R33/zzuf 同模式）"
- "musl libc 自带 strerror/getopt：configure LIBOBJS 替换不启用，无需补丁"

# ============================================================
# 测试状态（双口径台账）
# ============================================================

tests:
  source_declared_total: 6
  configured_executable_total: 6
  executed_passed_total: 6
  failed_total: 0
  uninstantiated_total: 0
  details: "真机 shadow CI（job malint-0.2-20261001，run 20261001-214011-40857，exit 0）：上游 regress 6/6 PASS（frame-l3crc/frame-long/frame-short/id3v1-end/id3v1-noseek/id3v1-short，All 6 tests passed）；test_package 消费者验证 PASS（--help + 内嵌官方样本 -N3 输出比对）；L0/L1/L2/L4/L5 全 pass（L2: malint --version OK）"

patch_classification: []
