software: msdfgen
display: "msdfgen"
description: "Multi-channel signed distance field generator (library + CLI)"
category: gfx
homepage: "https://github.com/Chlumsky/msdfgen"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建 core/ext 两个库 + msdfgen CLI；MSDFGEN_INSTALL 安装库、头文件与 CMake config"
    - "上游期望 vcpkg 风格 target 名 Freetype::Freetype / PNG::PNG，用 CMakeDeps.set_property 桥接到本仓库 freetype::freetype / libpng::libpng，不改上游源码"
    - "tinyxml2/11.0.0 的 target 名与上游原生匹配；10.0.0 配方有硬编码签名工具路径校验故不采用"
    - "上游 option() 在 project() 之前声明，toolchain 的 cache set 无法覆盖 → 构建选项经 cmake.configure(variables=...) 命令行 -D 传入（命令行优先级高于 option 初始化）"
    - "CMake 无 HarmonyOS 平台模块 → CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG 未定义，VERSION/SOVERSION 目标属性被静默忽略；用 patch（SOVERSION 1）+ toolchain 变量 -Wl,-soname,（尾逗号）补齐 SONAME"
    - "关闭 MSDFGEN_USE_OPENMP / MSDFGEN_USE_SKIA / MSDFGEN_USE_VCPKG（桌面依赖），保留全部核心 MSDF 功能（PNG 输出、SVG 文本输入、FreeType 字体导入、CLI）"
    - "共享库按 libpng 1.6.58.2 _resolve_tool 模式签名（编译器目录相对解析，无硬编码路径；签名遍历 lib/bin 下实体 ELF，跳过 symlink）"
    - "已安装 msdfgen-config.h 无条件 #define MSDFGEN_USE_CPP11，另有未受宏守卫的 long long → 消费者最低 C++11（移除宏归因实验证明宏非唯一根因，未创建知识草稿）"
  common_dependencies:
    - freetype/2.14.3
    - libpng/1.6.58.2
    - tinyxml2/11.0.0

versions:
  "1.13":
    status: in_progress
    build_date: "2026-09-10"
    note: "CMake; CMakeDeps target bridge; SONAME patch; upstream 0 tests (evidence in notes); consumer 26 checks + OHOS 24 checks all pass"
