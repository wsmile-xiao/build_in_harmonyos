# test_ohos/MANIFEST.yml — HarmonyOS PC 专项验证
package: msdfgen/1.13
homepage: https://github.com/Chlumsky/msdfgen

# OpenHarmony PC 平台专项测试（独立于 test_package 的库 API 验证）
# 运行: conan test archives/m/msdfgen/1.13/test_ohos msdfgen/1.13 \
#       -pr:h ohos-aarch64 -pr:b ohos-aarch64
test_ohos_tests:
  - file: test_ohos.sh
    description: |
      鸿蒙交付验证 (bash + set -euo pipefail, 独立临时目录经
      trap EXIT/INT/TERM 清理, 失败/超时/中断均不残留、不写包目录):
      H1 ELF64 Little-Endian AArch64 (core/ext/CLI 三产物逐个
      readelf 验证, readelf 失败时该检查 fail closed);
      H2 动态段 SONAME 版本化 (libmsdfgen-core.so.1 / libmsdfgen-ext.so.1)、
      NEEDED 闭包 (ext→core, CLI→core+ext)、无宿主 RPATH/RUNPATH;
      H3 .codesign 段 (三产物); H4 二进制无宿主路径 (strings 扫描);
      H5 CLI 在 OpenHarmony PC 真实生成 MSDF (-defineshape 纯文本
      矢量输入，不依赖字体/图片; CLI 失败时输出 stderr 诊断且
      TAP 流与计划行仍完整输出); H6 输出结构验证: 64 行 x 192
      token、值域 00..FF (hex token 严格校验后再 16# 转换, 非法
      token 记为明确 FAIL)、中心像素内部 (FF)、角像素外部 (00)、
      场非平坦 (min<max)
    command: "conan test archives/m/msdfgen/1.13/test_ohos msdfgen/1.13 -pr:h ohos-aarch64 -pr:b ohos-aarch64"
    count: 24

assertion_count: 24
