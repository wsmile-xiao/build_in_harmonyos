# test_package/MANIFEST.yml — CI L0e
package: msdfgen/1.13
homepage: https://github.com/Chlumsky/msdfgen

# 上游 v1.13 无任何测试（三方面证据见 ../notes.md）：
#   1. 目录: tarball 无 tests/ 或 test/ 目录（tar tzf 全量 94 个文件核实）
#   2. 构建目标: CMakeLists.txt 无 enable_testing() / add_test()，
#      无 BUILD_TESTING 或 *TEST* 构建选项（grep 计数 = 0）
#   3. 测试框架: 无 CTest/GTest/Catch 引用；vcpkg.json 无 test feature；
#      README 无测试章节；CI 配置无测试 job
upstream_test_in_build: false
upstream_check_command: ""
upstream_test_command: ""
upstream_tests:
  total_run: 0
  ok: 0
  fail: 0
  skipped: 0
  pass_rate: "n/a"
  notes: |
    Upstream msdfgen v1.13 ships no test suite. Evidence recorded in
    archives/m/msdfgen/1.13/notes.md (directory / build target / test
    framework, all three empty). Per TEST_QUALITY_SPEC, consumer tests
    and HarmonyOS-specific tests below fully replace the upstream tier.

# 消费者测试（从最终 Conan 包编译链接）
test_package_tests:
  - file: test_msdfgen.cpp
    description: |
      消费者测试: 以 CMakeDeps 链接 msdfgen::msdfgen（最终包产物），
      程序化构造矩形/三角形矢量轮廓 + 可审计文本 shape 描述
      （无任何外部字体/图片 fixture），断言:
      A1 位图尺寸、A2 通道数(3)、A3 值有限且符号距离域有意义
      (vmin<0<vmax 且展宽>5px)、A4 内部/外部 median-of-three 关系
      (中心<-5px、四角>+5px)、A5 角落通道不对称(差>1px)、
      A6 空形状确定性输出(全非有限、不崩溃)、A7 文本轮廓描述
      round-trip(解析+bounds)、A8 三角形 SDF 全场统计+固定点符号
      (最深处<-5、最远外>+10、固定内点<0、固定外点>0)、
      A9 savePng 落盘(ext/libpng 路径)
    command: "./test_msdfgen"
    count: 26

assertion_count: 26
