# 版本级 manifest — msdfgen 1.13
# 位置: archives/m/msdfgen/1.13/manifest.yaml

version: "1.13"
software: msdfgen
status: in_progress
build_date: "2026-09-09"
build_system: cmake

source:
  url: "https://github.com/Chlumsky/msdfgen/archive/refs/tags/v1.13.tar.gz"
  sha256: "93cd1ad8918c1a78c5c96e82d4f4c77f0eb86c2e7e8579a0967e54196c4b7167"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DMSDFGEN_USE_OPENMP=OFF"
    - "-DMSDFGEN_USE_SKIA=OFF"
    - "-DMSDFGEN_USE_VCPKG=OFF"
    - "-DMSDFGEN_BUILD_STANDALONE=ON"
    - "-DMSDFGEN_INSTALL=ON"
    - "-DMSDFGEN_USE_CPP11=ON"
    - "-DMSDFGEN_CORE_ONLY=OFF"
    - "-DMSDFGEN_DISABLE_PNG=OFF"
    - "-DMSDFGEN_DISABLE_SVG=OFF"
  dependencies:
    - freetype/2.14.3
    - libpng/1.6.58
    - tinyxml2/11.0.0
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-ohos-soname.patch"
    reason: |
      上游 add_library 未设 SOVERSION，产物无 SONAME；OHOS 动态加载器要求
      稳定 SONAME（与 libpng16.so.16 / libfreetype.so.6 惯例一致）。
      patch 给 msdfgen-core / msdfgen-ext 设 VERSION 1.13 SOVERSION 1。

knowledge_gained:
  - "上游 CMake 期望 vcpkg 风格 target 名 Freetype::Freetype / PNG::PNG；本仓库 freetype/libpng Conan 包导出 freetype::freetype / libpng::libpng，用 CMakeDeps.set_property 桥接，无需 patch"
  - "tinyxml2/11.0.0 的 CMakeDeps target tinyxml2::tinyxml2 与上游原生匹配，无需桥接"
  - "tinyxml2/10.0.0 配方硬编码 /data/service/hnp/bin 签名工具路径校验，本地不可写该目录时阻断安装；11.0.0 已移除该检查"
  - "上游 v1.13 tarball 无 gitlink 子模块（E150 manual-download 不适用），SHA256 与官方 release 一致"
