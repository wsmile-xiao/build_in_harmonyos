# conandata.yml — mysql 9.7.1 (server)

sources:
  url:
    - "https://cdn.mysql.com/Downloads/MySQL-9.7/mysql-9.7.1.tar.gz"
    - "https://github.com/mysql/mysql-server/archive/refs/tags/mysql-9.7.1.tar.gz"
