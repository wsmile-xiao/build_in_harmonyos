# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: mysql/9.7.1
homepage: "https://github.com/mysql/mysql-server"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testclients/mysql_client_test.cc
    source: mysql-9.7.1/testclients
    description: "Upstream client/server test program (315 cases: protocol, prepared statements, result sets, cursors, transactions, charset, C API lifecycle). Really executed on OHOS against the mysqld built by this package: 307/315 passed, remaining 8 attributed (test isolation / stale upstream assertions / optional auth plugin / one crash / one long wait), none of them a porting defect. Evidence: reports/上游测试-testclients执行报告.md and reports/upstream-testclients-run.sh"
    command: "./mysql_client_test --host=127.0.0.1 --port=<PORT> --user=root --database=test <TESTNAME>"
  - file: mysql-test/suite
    source: mysql-9.7.1/mysql-test
    description: "Upstream mysql-test MTR suite (9339 .test files) covering SQL, replication, InnoDB, charset etc. The harness itself (perl driver + multiple servers + Unix socket communication) cannot run on the OHOS sandbox because bind() on AF_UNIX paths is denied; client/server coverage is obtained through testclients/mysql_client_test above (the same program driven by mysql-test main.client_test)"
    command: "mysql-test-run.pl (requires Unix socket; not runnable on the OHOS sandbox)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer smoke test (69 cases, mirrored from mysql-client/9.7.1): mysql_library_init/end, client info/version >= 90701, thread safety, handle lifecycle, escaping/hex tools, error/status, result-set NULL safety, SSL options, plus 10 OHOS-specific cases; 69/69 passed"
    command: "./test_mysql_client"
  - file: server_lifecycle_test.sh
    description: "mysqld --initialize-insecure -> start (TCP only: AF_UNIX bind is denied on OHOS) -> mysqladmin ping -> shutdown. Runs for real on OHOS with patches 0068/0069/0070; also exercises the upstream testclients/mysql_client_test run"
    command: "server_lifecycle_test.sh"

# 测试断言总数 (近似值, 用于质量评估): 69 test_package + 315 upstream testclients cases
assertion_count: 384
