# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "MySQL 系 CMake 单仓 OHOS 交叉配置必须显式 -DCMAKE_SYSTEM_NAME=Linux（CMake 对未知系统名不设 UNIX 变量，导致 compiler_options.cmake 全局 -std=c++17 分支被整体跳过）"
  - "显式设置 CMAKE_SYSTEM_NAME 即进入交叉模式（CMAKE_CROSSCOMPILING=1），MySQL 的 try_run 探测需预置 EXITCODE 缓存变量（SETNS/CLOCK_GETTIME/CLOCK_REALTIME/FALLOC_PUNCH_HOLE/__BUILTIN_FFS/libevent 版本探测）"
  - "libmysql 的 DNS SRV 检测在 OHOS 下走 LINUX_ALPINE 同款 res_init/res_search 代码路径（OHOS libc 无 res_n*() API 也无 libresolv），参照 percona-server 8.4.10 patch 0001"
  - "OHOS libc 无 pthread_cancel() 声明，my_thread_cancel() 返回 -1/ENOSYS 即可（Percona 同款方案）"
  - "client-only 构建仍会进入 storage/ndb、group_replication/libmysqlgcs、GenError(comp_err) 等 server 组件目录；comp_err/comp_client_err 等 OHOS 二进制生成器在鸿蒙 PC 宿主上可直接运行（用 $<TARGET_FILE:...> 引用）"
  - "HMDFS 写入层会剥离文本文件行尾空格（tar 命令解压保留、python tarfile/直接写入会丢失）；生成 .patch 必须以 tar 命令解压的干净树为基准"
  - "MySQL 8.0.46 语言预检（R47 lang_detect）会把 bundled extra/protobuf 的 python/java 样例计入导致 cpp 占比 69.4%<70% 误判为 python；排除 bundled extra/ 后实际 cpp 84.3%+CMake，为纯 C/C++ 项目"

