# 软件级 manifest — mpdas

software: mpdas
display: "mpdas"
description: "MPD 正在播放状态栏客户端，并向 Last.fm / Libre.fm scrobble"
category: utility
homepage: "https://50hz.ws/mpdas/"
license: ISC

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 用反引号写死 pkg-config 取依赖标志，交叉环境无 .pc 文件：配方以补丁 0001 参数化为 DEPS_CFLAGS/DEPS_LIBS，由 Conan 依赖图提供"
    - "上游 install 目标依赖 coreutils install(1) 且写死 ${PREFIX}/bin；OHOS 无 install(1)，安装改在配方 package() 内用 copy() 完成"
    - "编译期宏 CONFDIR / VERSION 由 Makefile 追加进 CXXFLAGS，不可在命令行整体覆盖 CXXFLAGS"
  common_dependencies:
    - libmpdclient
    - libcurl

versions:
  "0.4.5":
    status: built
    build_date: 2026-09-25
