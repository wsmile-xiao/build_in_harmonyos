package: mpdas/0.4.5
homepage: "https://50hz.ws/mpdas/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "消费者测试 — 5 条断言全部执行已安装 mpdas 二进制（-v 版本串 / -h 用法 / CONFDIR 宏 / 缺凭据拒绝 / 走到 libmpdclient 连接层）"
    command: "bash test.sh"

assertion_count: 5
