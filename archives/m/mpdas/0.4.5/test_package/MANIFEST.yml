# pristine 解包树 ~/tmp/uc2/z32-mpdas/src/mpdas-0.4.5 上执行）：
#   1) tar tzf mpdas-0.4.5.tar.gz | grep -ciE 'test|spec|check'  => 0
#      （官方包 24 个条目 = 下列 23 个源码文件 + 1 个 .gitignore（编译产物忽略表，非测试）：
#       mpd.h/README/main.cpp/config.h/md5.h/LICENSE/md5.cpp/utils.h/TODO/mpdas.h/
#       mpdas.1/cache.h/INSTALL.md/utils.cpp/cache.cpp/Makefile/mpd.cpp/
#       audioscrobber.h/config.cpp/audioscrobber.cpp/mpdsrc.example/ini.h/ini.cpp）
#   2) grep -cE '^[a-z_.][a-z_. ]*:' Makefile                          => 5
#      （目标只有 all / .cpp.o / clean / install / uninstall）
#   3) Makefile 中无 TESTS= 变量、无 check / test 目标                 => 无
#   4) 无 examples/ 语料目录；mpdasrc.example 是配置样例，不是测试      => 0
#   5) 包内无 .github/ 、无 CI 配置                                     => 无
