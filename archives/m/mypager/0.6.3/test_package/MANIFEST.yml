# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mypager/0.6.3
homepage: "https://github.com/romuald/mypager"

# 上游测试清点（R51）：mypager 0.6.3 的 Makefile 仅含 default（echo 提示）、
# install-bin/install-doc、uninstall 目标，无 check/test 目标，无任何标准
# 测试框架，静态注册用例总数 N_static = 0。上游亦无测试程序资产（包体为
# 单个 434 行 Perl 脚本）。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# 注意：上游无 --help 开关；argless 运行会分页 STDIN 直到 EOF，在 CI worker
# （stdin 永不关闭）上挂起。--installconf 是唯一文档化开关（写 ~/.mypager.conf、
# 退出码 0），HOME 指向全新目录以避开配置已存在时的 stdin 覆盖询问。
upstream_test_in_build: true
upstream_test_command: "/data/service/hnp/bin/perl -c mypager && HOME=<build_folder>/confhome /data/service/hnp/bin/perl mypager --installconf"

# 上游测试程序清单（无测试框架；build() 内以 perl -c 与 --installconf 作为上游 smoke 执行）
upstream_tests:
  - file: mypager
    source: mypager-0.6.3/mypager
    description: "上游唯一交付物：单文件 Perl 分页脚本（434 行）。build() 内以系统 perl -c 通过语法门（perl 5.42），并以 --installconf 真实运行（全新 HOME 写入 .mypager.conf、退出码 0）作为上游可执行性验证"
    command: "/data/service/hnp/bin/perl -c mypager && HOME=<build_folder>/confhome /data/service/hnp/bin/perl mypager --installconf"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: dd_consumer.c
    description: "消费者测试：以使用者身份编译独立 C 程序，真实执行打包产物 bin/mypager（hnp perl 5.42 经 PATH 注入解析 #!/usr/bin/env perl），断言 ①--installconf（per-run 全新 HOME）退出码 0 且 ~/.mypager.conf 真实生成、②短文本经分页器管道透传内容不丢失，任一失败退出码非 0"
    command: 'PATH=/data/service/hnp/bin:$PATH MYPAGER_SCRIPT=<package_folder>/bin/mypager ./dd_consumer'

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
