# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "CC=/storage/Users/currentUser/tmp/bin/clang-wrapper"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang-wrapper
  cxx: clang++

  # 平台适配
  hints:
    - "E064: clang-wrapper 自动签名绕过 conftest 执行限制"
    - "E011: umask 022 替换 umask 077 绕过 HMDFS 权限问题"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
