software: mcpp
display: "MCPP"
description: "高质量的 C/C++ 预处理器，实现 C90/C99/C++98 全部预处理功能"
category: build-tool
homepage: "https://mcpp.sourceforge.net/"
license: BSD-2-Clause
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "2006 版 config.guess/config.sub 需添加 HarmonyOS 检测和 linux-ohos 三元组支持（E007）"
    - "configure 使用 umask 077 创建临时目录在 HMDFS 上失败，需改为 umask 022（E011）"
    - "ohos-sdk 的 lld 链接器依赖 libxml2.so.16 动态链接失败，需使用 ld.bfd 替代（E064）"
    - "configure 中 conftest 二进制需要 ELF 签名才能在 HarmonyOS 上执行"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "2.7.2":
    status: built
    build_date: "2026-06-02"