patches:
  - patch_file: "patches/0001-drop-werror.patch"
    patch_description: "linux.cmake compiles with -Werror together with -Wsign-conversion and other strict warnings; the OHOS clang 15 build trips -Wsign-conversion on the ioctl() result conversions in src/linux/mei.c. Drop -Werror (keep -Wall and the extra warnings) so a warning does not fail the build."
    patch_type: "portability"
