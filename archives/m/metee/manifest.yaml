software: metee
display: "metee"
description: "Intel MEI（Management Engine Interface）TEE 库：通过 /dev/mei* 的 ioctl 查找并访问 Intel 管理引擎设备"
category: library
homepage: "https://github.com/intel/metee"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "标准 CMake 工程；构建库并运行上游 GoogleTest 测试（BUILD_TEST=ON，gtest 用制品仓 gtest/1.17.0 test_requires，绕过上游 ExternalProject 联网 clone）"
    - "linux.cmake 以 `-Werror` 叠加 `-Wsign-conversion` 等严格告警；OHOS clang 15 在 src/linux/mei.c 的 ioctl 结果转换上触发 `-Wsign-conversion` → 补丁去掉 `-Werror`（保留 `-Wall` 及其余告警）"
    - "check_symbol_exists(IOCTL_MEI_CONNECT_CLIENT_VTAG linux/mei.h) 在 OHOS 头缺失时自动回退到随包 `src/linux/include`"
    - "上游 38 个 GoogleTest(TEST_P) 用例需真实 Intel MEI 设备（/dev/mei*）；无设备时上游 fixture 调用 GTEST_SKIP()，实测 36 实例执行（3 PASSED + 33 SKIPPED，0 FAILED）；对 2 个未遵循 no-device 约定的用例做了仅测试层 skip 补丁"

versions:
  "6.2.3":
    status: built
    build_date: "2026-09-20"
    conan_ref: "metee/6.2.3"
