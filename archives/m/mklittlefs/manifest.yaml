software: mklittlefs
display: "mklittlefs"
description: "LittleFS 文件系统镜像构建工具（创建/列出/解包）"
category: build-tool
homepage: "https://github.com/earlephilhower/mklittlefs"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 硬编码 g++，需 CC/CXX 环境变量注入 clang"
    - "离线构建需显式传 VERSION/LITTLEFS_VERSION（Makefile 默认 git describe）"
    - "strip 会去掉 .codesign 段导致二进制无法执行，需 STRIP=true"
  common_dependencies: []

versions:
  "4.1.0":
    status: built
    build_date: "2026-09-09"
