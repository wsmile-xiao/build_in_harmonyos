version: "4.1.0"
software: mklittlefs
status: built
build_date: "2026-09-09"
build_system: makefile

source:
  url: "https://github.com/earlephilhower/mklittlefs/releases/download/4.1.0/mklittlefs-source.zip"
  sha256: "4fa5565e2e9185898182557e25860f0fe5536f8133ef0247574105a75b5ae4d6"
  tar_format: zip

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 Makefile 硬编码 g++ 编译 main.cpp，通过 CC/CXX 环境变量注入 clang/clang++"
  - "Makefile 用 git describe 取版本号，离线构建需显式传 VERSION=4.1.0 LITTLEFS_VERSION=v2.11.1"
  - "OHOS clang 注入 -Wl,--code-sign 触发 -Werror=unused-command-line-argument，需加 -Wno-error=unused-command-line-argument"
  - "strip 会去掉 .codesign 段导致二进制 Operation not permitted，需 STRIP=true 跳过"
  - "官方 release zip 内嵌 littlefs v2.11.1 子模块，无需外部依赖和构建期 git clone"

upstream_tests:
  command: "make test"
  test_count: 1
  notes: "run_tests.sh 执行 tests/test_create（单脚本含 3 个子测试），stdout 与 tests/test_create.out 精确比对；上游 CI 只构建不跑测试。"

test_package:
  assertion_count: 6
  description: "create/list/unpack 往返字节保真、空文件与零字节文件、多级目录、损坏镜像非零退出。"
