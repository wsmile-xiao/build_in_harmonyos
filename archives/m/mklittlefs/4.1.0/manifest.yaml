software: mklittlefs
# 版本级 manifest
# 文件位置: archives/m/mklittlefs/4.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "4.1.0"
status: published
build_date: "2026-06-13"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/earlephilhower/mklittlefs/releases/download/4.1.0/mklittlefs-source.zip"
  sha256: ""
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build_system: makefile

build:
  system: makefile
  configure_options:
    - "TARGET_OS=linux64"
    - "VERSION=4.1.0"
    - "CXX=clang++"
    - "CC=clang"
    - "STRIP=llvm-strip"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HarmonyOS上Makefile的OS检测需手动设TARGET_OS=linux64，uname -s返回HarmonyOS而非Linux"
  - "无git仓库时需手动设VERSION，git describe --tag会失败"
  - "自定义Makefile项目无install目标时，需手动cp到DESTDIR和PREFIX"
  - "测试脚本shebang /bin/bash在HarmonyOS上不存在，需用bash命令直接运行"
  - "zip格式源码包的G0验证需手动处理，tar命令不支持zip格式"
