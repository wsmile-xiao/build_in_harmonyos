# test_package/MANIFEST.yml
# Upstream test declaration file (CI L0e requires this)

package: mklittlefs/4.1.0
homepage: "https://github.com/earlephilhower/mklittlefs"

# Upstream test entry: make test -> run_tests.sh -> tests/test_create
# (single bash script, 3 sub-tests inside, stdout diffed against
#  tests/test_create.out). Upstream CI builds but does not run tests.
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/test_create
    description: "Create/list/unpack round-trip with .elf fixture (bash script, 3 sub-tests, stdout compared to test_create.out)"
    command: "make test"
    result: skipped-on-ohos

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Round-trip create/list/unpack with programmatic fixtures; empty/zero-byte files; multi-level dirs; corrupted image must exit non-zero"
    command: "bash test.sh"
  - file: test_ohos.sh
    description: "OHOS-specific: ELF64/AArch64, musl PT_INTERP, .codesign, no host RPATH, HMDFS create/list/extract round-trip, permissions"
    command: "bash test_ohos.sh"

assertion_count: 12
