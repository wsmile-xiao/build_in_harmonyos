# 软件级 manifest — metapixel
# 遵循 ARCHIVE-SPEC v3.0

software: "metapixel"
display: "metapixel (A Photomosaic Generator)"
description: "照片马赛克生成器：把源图切成网格，用图库里最匹配的小图逐格替换，支持经典矩阵与拼贴两种排布"
category: gfx
homepage: "https://www.complang.tuwien.ac.at/schani/metapixel/"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "libpng 1.5 把 png_struct/png_info 变成不透明类型，rwimg/rwpng.c 的直接字段访问整体迁移到 png_get_* / png_jmpbuf，写侧折叠为 png_set_IHDR()"
    - "giflib 5.0 给 DGifOpenFileName() / DGifCloseFile() 增加 int *Error 出参，rwimg/rwgif.c 补传局部变量"
    - "rwjpeg.c 零改动：libjpeg-turbo 3.x 仍提供 libjpeg 6 API 面"
    - "依赖 include/lib 目录经 CCOPTS / LDOPTS 注入 + -Wl,-rpath 固化，产物不依赖 conanrun 环境"
    - "跳过 metapixel.1 的 xsltproc 重新生成（发布包已含该文件），省掉 docbook 构建期依赖，不影响任何交付产物"
  common_dependencies:
    - libpng
    - libjpeg-turbo
    - giflib
    - zlib

versions:
  "1.0.2":
    status: built
    build_date: 2026-10-01
    notes: >-
      conan create 全绿；test_package 15/15 断言通过（真实执行 OHOS aarch64
      产物跑完整马赛克流程，PNG/JPEG/GIF 三种后端全解码），鸿蒙专项 5/5 通过。
      2 个 API 兼容补丁，均不含平台宏。
    conan_ref: "metapixel/1.0.2"
    source_url: "https://deb.debian.org/debian/pool/main/m/metapixel/metapixel_1.0.2.orig.tar.gz"
    sha256: "8d77810978da397c070b9b4e228ae6204e9f5c524518ad1a4fcab9462171f55b"
