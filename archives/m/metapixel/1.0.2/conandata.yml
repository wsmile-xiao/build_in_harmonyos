# conandata.yml - metapixel 1.0.2
#
# Upstream: Metapixel - A Photomosaic Generator, by Markus Schani
#           <schani@complang.tuwien.ac.at>, last released 2006-12-10.
# Upstream homepage 见 conanfile.py 的 homepage 字段（此处刻意不写 URL：
# CI 预下载步骤会把本文件里出现的每一个 scheme 化 URL 都当作源码地址去拉，
# 注释里的失效官网地址会造成无谓的下载重试）。
#
# 货源说明（R39）：上游官网的下载链接现已不可靠（实测 HTTPS 握手被重置 /
# 返回 HTML），因此改用 Debian 官方源码镜像 deb.debian.org 的 orig tarball。
# 该文件是权威镜像，且校验和可与上游权威清单交叉核对：
#   * md5    af5d77d38826756af213a08e3ada9941  == Debian .dsc 记录的 md5
#   * sha512 88a718fc...e30e156                 == Gentoo portage distfiles
#                                               Manifest 记录的 DIST 校验和
# 两个独立来源一致，故认定与上游 1.0.2 发布件逐字节相同。
# 运行期镜像改写由框架负责，此处只写权威源 URL。
sources:
  url: "https://deb.debian.org/debian/pool/main/m/metapixel/metapixel_1.0.2.orig.tar.gz"
  sha256: "8d77810978da397c070b9b4e228ae6204e9f5c524518ad1a4fcab9462171f55b"

patches:
  - patch_file: "patches/0001-rwimg-rwgif-c-giflib5-error-out-parameters.patch"
    patch_description: >-
      rwimg/rwgif.c: giflib 5.0 给 DGifOpenFileName() 和 DGifCloseFile() 各加了一个
      int *Error 出参，1.0.2 仍按 1 参形式调用，编译报
      "too few arguments to function call, expected 2, have 1"。
      传入一个局部 int error 即可；两处原有的 assert() 判据保持不变，
      上游的失败语义完全保留。
    patch_type: "portability"
  - patch_file: "patches/0002-rwimg-rwpng-c-libpng-opaque-struct-access.patch"
    patch_description: >-
      rwimg/rwpng.c: libpng 1.5 起 png_struct/png_info 变为不透明类型，
      上游对 ->jmpbuf / ->width / ->height / ->bit_depth / ->color_type /
      ->interlace_type / ->rowbytes 等字段的直接读写全部编译失败
      （"incomplete definition of type 'struct png_struct_def'"）。
      读侧改用 png_jmpbuf() 与 png_get_* 系列访问器；写侧那整段手工赋值
      折叠为一次 png_set_IHDR()——这是填充 info 结构唯一受支持的方式，
      由 libpng 自行推导 rowbytes / valid / palette / num_trans。
    patch_type: "portability"
