# 版本级 manifest — metapixel 1.0.2
# 遵循 ARCHIVE-SPEC v3.0

version: "1.0.2"

software: "metapixel"

# 编译状态
# published | built | failed | archived
status: built

build_date: "2026-10-01"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游官网 www.complang.tuwien.ac.at/schani/metapixel/ 的下载链接已失效
  # （实测 HTTPS 握手被重置），改用 Debian 官方源码镜像的 orig tarball。
  # 校验和与两个独立权威清单交叉核对一致：
  #   md5    af5d77d38826756af213a08e3ada9941  == Debian .dsc
  #   sha512 88a718fc…2e30e156                 == Gentoo distfiles Manifest
  url: "https://deb.debian.org/debian/pool/main/m/metapixel/metapixel_1.0.2.orig.tar.gz"
  sha256: "8d77810978da397c070b9b4e228ae6204e9f5c524518ad1a4fcab9462171f55b"
  tar_format: tar.gz
  top_level_dir: "metapixel-1.0.2"

# ============================================================
# 构建配置
# ============================================================

build:
  # 上游为两份手写 Makefile（顶层 + rwimg/），无 configure / autotools / cmake
  system: makefile
  # 依赖的 include/lib 目录通过 make 命令行覆盖 CCOPTS / LDOPTS 注入，
  # 无需改写任何 Makefile 规则
  configure_options: []
  make_jobs: 1
  dependencies:
    - libpng/1.6.58.3
    - libjpeg-turbo/3.2.0
    - giflib/5.2.2
    - zlib/1.3.2
  cc: clang
  cxx: clang++

  # 构建目标：显式列出三个代码目标。
  # 上游默认目标表还包含 metapixel.1（由 metapixel.xml 经 xsltproc +
  # docbook-xsl 重新生成），那是文档再生成步骤而非代码构建步骤：发布
  # tarball 本身已带生成好的 metapixel.1，交付的就是同一个文件。
  # 跳过它省掉 docbook-xml / docbook-xsl / xsltproc 三个构建期依赖和一次
  # --nonet 离线 xsltproc 调用，不改变任何交付产物，也不裁剪任何功能。
  targets:
    - metapixel
    - convert
    - metapixel-imagesize

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-rwimg-rwgif-c-giflib5-error-out-parameters.patch"
  - "patches/0002-rwimg-rwpng-c-libpng-opaque-struct-access.patch"

# ============================================================
# 交付命令（R38）
# ============================================================

commands:
  - metapixel
  - metapixel-imagesize
  - convert
  - metapixel-prepare
  - metapixel-sizesort

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "2006 年的 C 代码直接读写 png_struct/png_info 字段；libpng 1.5 起这两个类型不透明化，必须整体迁移到 png_get_* 访问器，写侧那段手工赋值要折叠成一次 png_set_IHDR()"
  - "giflib 5.0 给 DGifOpenFileName() / DGifCloseFile() 各加了 int *Error 出参；这是 giflib 5.x 唯一的源码不兼容点，giflib 5.2 的 GifFileType 仍然是可见结构体，Image / SColorMap 直接访问仍可编译"
  - "rwjpeg.c 无需任何改动：libjpeg-turbo 3.x 仍保留 libjpeg 6 的 API 面，1.0.2 的 JPEG 读写代码原样通过"
  - "手写 Makefile 项目用命令行覆盖 CCOPTS / LDOPTS 注入依赖路径即可，不必打 Makefile 补丁；依赖库目录由 self.dependencies[].cpp_info 读取，符合 R49 私有 prefix 口径"
  - "CCOPTS 里的 -DMETAPIXEL_VERSION=\\\"1.0.2\\\" 要穿过 sh → make 变量 → recipe shell 三层，转义必须用 shlex.quote()（单引号包裹）保 backslash 到最后一层；手工拼 \\\" 包裹会被第一层 sh 提前吃掉，导致宏展开成裸数字 1.0.2 而报 expected ')'"
  - "链接时用 -Wl,-rpath,<dep libdir> 把 libpng/libjpeg/giflib 固化进 RUNPATH，交付二进制不依赖 conanrun 环境即可启动（test_ohos T4 对此做门禁）"
  - "CI worker 以文本 .diff 方式检出 PR（gitcode 的 pull/<n>.diff 不含二进制负载），因此 PR 内**不能提交任何二进制文件**；测试夹具改由标准库在运行期生成，PNG/GIF 手写（含 LZW），JPEG 用内嵌 base64 + 锁定 SHA256"

