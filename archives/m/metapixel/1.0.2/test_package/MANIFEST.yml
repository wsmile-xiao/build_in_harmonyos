# test_package/MANIFEST.yml
# 上游测试声明文件（CI L0e 门禁读取）

package: metapixel/1.0.2
homepage: "https://www.complang.tuwien.ac.at/schani/metapixel/"

# ---------------------------------------------------------------
# 上游测试清点
# ---------------------------------------------------------------
upstream_tests_exist: false
upstream_check_command: "none — 上游顶层 Makefile 无 check/test 目标；唯一接近的 `make` 只是编译，不执行任何断言"
upstream_test_in_build: false
upstream_test_command: ""

upstream_audit:
  - source: "发布 tarball 全量文件清点（41 个条目）"
    reason: "不存在 tests/、test/、t/ 或任何测试目录；源码树只有 Makefile、rwimg/Makefile、15 个 .c（顶层 10 + rwimg 5）、13 个 .h（顶层 8 + rwimg 5）、README/NEWS/COPYING/metapixelrc/metapixel.spec/metapixel.xml/metapixel.1 与 2 个 Perl 脚本。"
  - source: "顶层 Makefile 目标表"
    reason: "all / metapixel / metapixel.1 / convert / metapixel-imagesize / zoom / install / clean / realclean / dist —— 没有 check、test 或任何测试注册。"
  - source: "rwimg/Makefile 目标表"
    reason: "只有 all / librwimg.a / clean，没有任何测试入口。"
  - source: "上游 .spec / metapixel.1 / NEWS"
    reason: "RPM spec 的 %check 段为空；NEWS 全文只记录功能变更，不提测试套件。"
  - source: "README 全文"
    reason: "只描述安装、配图库、生成马赛克的手工流程，从未提及运行测试。"

upstream_evidence:
  - "机器可复核：tar tzf metapixel-1.0.2.tar.gz | wc -l => 41（= 39 个文件 + 2 个目录条目）"
  - "机器可复核：tar tzf … | grep -icE 'test|check' => 0（无任何以 test/check 命名的文件）"
  - "机器可复核：grep -cE '^(check|test)[^:]*:' Makefile => 0"
  - "上游最后一次发布为 2006-12-10，此后无新版本，测试基础设施从未被引入"

upstream_check_result: "N/A — 上游不存在测试入口"
upstream_test_total: 0

# ---------------------------------------------------------------
# 适配后测试（test_package 消费者视角，真实执行被测产物）
# ---------------------------------------------------------------
test_package_tests:
  - file: gen_images.py
    description: "T0 测试夹具在运行期生成：gen_images.py 用标准库从零写出 1 张 64x64 PNG 源图、2 张 16x16 PNG 小图和 1 张 16x16 GIF 小图（含手写 LZW 编码器），另从内嵌 base64 常量解出 1 张 16x16 JPEG。生成后自检魔数、最小尺寸与 JPEG 的 SHA256。之所以不把图片提交进仓库：CI worker 以**文本** .diff 方式检出 PR，GitCode 的 diff 接口不含二进制负载，提交任何 .png/.jpg/.gif 都会让整个 PR 在 checkout-pr 步失败（missing binary patch data）"
    command: "python3 gen_images.py <work>/images"
    executed_by: "test_package/test.sh 以 self.run 链式执行（L0d）；失败即退出 1，不会静默放过"
  - file: test.sh
    description: "T1 `metapixel --version` 必须打印 `metapixel 1.0.2`（与上游版本号一致，且能区分真实产物与缺失二进制）"
    command: "sh test.sh <metapixel> <metapixel-imagesize> <convert> <images>"
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T2 `metapixel --help` 必须同时出现 --library / --prepare / --metapixel 三个主子命令"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T3 `metapixel --print-prepare-settings` 必须输出两个正整数（小图默认边长），证明配图库参数通路可用"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T4 `metapixel --prepare` 成功解码 PNG 缩略图并写入图库条目 —— 回归 patches/0002（png_get_* 迁移 + png_set_IHDR）"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T5 `metapixel --prepare` 成功解码 JPEG 缩略图（内嵌 base64 夹具 tile_d.jpg） —— 回归 rwjpeg.c（该文件零改动，libjpeg-turbo 兼容 libjpeg 6 API）"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T6 `metapixel --prepare` 成功解码 GIF 缩略图（由 gen_images.py 手写 LZW 生成的 tile_c.gif）—— 回归 patches/0001（giflib 5 的 Error 出参）；GIF 读是 1.0.2 的新特性，GIF 坏了等于裁剪功能，故为硬断言"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T7 --prepare 三次调用后图库表 tables.mxt 必须存在且非空"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T8 经典矩阵马赛克 `metapixel --library … --metapixel src out.png` 必须产出非空 PNG"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T9 产物必须能被随包交付的 metapixel-imagesize 读回为 `64 64`（端到端闭环：png_set_IHDR 写出的头能被 png_get_image_width/height 正确解析）"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T10 mosaic.png 前 8 字节必须是 PNG 签名 89504e470d0a1a0a"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T11 马赛克输出到 .jpg 必须产出非空 JPEG（按扩展名选择写出后端）"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T12 mosaic.jpg 必须被 metapixel-imagesize 读回为 `64 64`"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T13 `--collage` 拼贴模式必须产出可解码为 64x64 的 PNG（证明非矩阵排布分支未退化）"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T14 `-m wavelet` 另一套匹配度量（wavelet metric）必须也能产出马赛克"
    command: "sh test.sh ..."
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T15 第三个交付程序 `convert` 必须输出 lisp banner + 含 small-image / subpixel 字段的记录，且 (size W H) 为正整数 —— 证明三个可执行文件都链接且可运行"
    command: "sh test.sh <metapixel> <metapixel-imagesize> <convert> <images>"
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"
  - file: test.sh
    description: "T16 `convert` 的输出必须随输入变化且可复现：两份不同配置产出不同结果、同一份配置两次结果一致。只有真正解析 stdin 的程序才能通过；忽略 stdin 打印固定模板、或把未初始化内存写进输出的程序都会失败（这是 T15 单独无法证伪的部分）"
    command: "sh test.sh <metapixel> <metapixel-imagesize> <convert> <images>"
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"

assertion_count: 17
harmonyos_specific_test_count: 5
test_package_test_count: 17

