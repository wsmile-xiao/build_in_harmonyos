software: "mtoc"
display: "mtoc"
description: "Mach-O to PE/COFF converter for EFI firmware images"
homepage: "https://github.com/apple-oss-distributions/cctools"
license: "APSL-2.0"
category: "build-tool"
build_system: "cmake"

ohos_adaptation:
  key_points:
    - "Build only mtoc and its required libstuff translation units"
    - "Use pinned cctools-port non-Darwin headers and portability shim"
    - "Set host CPU emulation constants from the target architecture"
    - "Materialize cctools-port ARM header aliases for HarmonyOS build folders"
  common_dependencies: []

versions:
  "1035.1.102":
    status: "built"
    build_date: "2026-09-05"
    conan_ref: "mtoc/1035.1.102"

features:
  - "Converts 64-bit Mach-O preload images to PE32+"
  - "Supports EFI application, boot-service driver, and runtime-driver subsystems"
  - "Preserves architecture and section data in the generated PE/COFF image"

build_notes:
  - "Builds only mtoc and the libstuff objects it actually uses"
  - "Uses a pinned cctools-port compatibility layer for non-Darwin systems"
  - "Has no external Conan package dependencies"
