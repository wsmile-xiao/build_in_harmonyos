package: "mtoc/1035.1.102"
homepage: "https://github.com/apple-oss-distributions/cctools"

upstream_tests_exist: false
upstream_test_audit: |
  The cctools-1035.1.102 archive contains 103 test-case directories, but none
  references or invokes mtoc. The five mtor-* cases exercise a different
  utility. A repository-wide search of tests/ and libstuff_test/ for the mtoc
  name returns no matches. Apple therefore ships no mtoc-specific upstream
  test command. Homebrew adds its own downstream conversion smoke test; this
  package follows that functional approach with a self-contained fixture and
  deeper PE/COFF assertions.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: "test_mtoc.py"
    description: "Generate ARM64 MH_PRELOAD input, run packaged mtoc, and validate the AArch64 EFI PE32+ output and CLI error path"
    command: "python3 test_mtoc.py <mtoc> <work-folder>"

assertion_count: 18
test_suite_gaps:
  none: "Covers the core conversion path, PE/COFF architecture and subsystem metadata, section payload preservation, and command usage failure behavior."
