knowledge_gained:
  - "Apple's mtoc target is not exposed through a standalone portable build system; only the required libstuff objects should be linked."
  - "The cctools-port foreign headers and port.c shim provide the Darwin compatibility API required on Linux-like systems without changing mtoc's conversion logic."
  - "The cctools 1035.1.102 test tree has 103 cases but none targets mtoc; the package therefore adds a deterministic binary-format integration test."
  - "Host CPU emulation constants must match the runtime architecture because libstuff obtains them through its host_info compatibility function."
  - "cctools-port maps an AArch64 host to the Darwin compatibility macro __arm64__; OHOS Clang's native __aarch64__ macro is not sufficient for those headers."
  - "cctools-port ARM header aliases must be materialized because directory symlinks can be lost when Conan copies sources into a HarmonyOS build folder."
  - "cctools-port's foreign strings fallback needs a whole-file include guard when libc feature probes select its inline compatibility functions."
