# test_package/MANIFEST.yml — melting 5.2.0
# CI L0e requires this file to exist.

package: melting/5.2.0
homepage: "https://www.ebi.ac.uk/biomodels/tools/melting/"

# Upstream has no automated test suite (HMBS hard gate requires both flags).
# Audit of melting_5.2.0.orig.tar.gz (sha256 a3633c8f74ce383bbc3a339f99081a76c6529c10d9bdff1ad91b63e6d919a7bb,
# top dir MELTING5.2.0, 1299 entries): build.xml defines only
# init/prepare/prepare-src/clean/compile/jar/guijar/javadoc targets (no test
# target); no pom.xml, no junit/testng dependency; 27 src/examples/MainTest*.java
# are manual mains (public static void main) reading src/examples/test/*.txt
# without assertions or harness; testResults/*.ods are literature spreadsheets,
# not executed tests. Conclusion: zero upstream automated cases.
upstream_tests_exist: false
upstream_test_audit: "Audit melting_5.2.0.orig.tar.gz (https://deb.debian.org/debian/pool/main/m/melting/melting_5.2.0.orig.tar.gz, sha256 a3633c8f74ce383bbc3a339f99081a76c6529c10d9bdff1ad91b63e6d919a7bb): top dir MELTING5.2.0 with 1299 entries; build.xml targets are only init/prepare/prepare-src/clean/compile/jar/guijar/javadoc (no test target); no pom.xml and no junit/testng imports in sampled MainTest mains; 27 src/examples/MainTest*.java are manual mains (e.g. MainTestPerfectMatching.main calls MainTest.displayResults on src/examples/test/*.txt) without assertions; testResults/*.ods are literature Tm spreadsheets, not executed tests. Conclusion: upstream has no automated test suite (discovered=0/executed=0), coverage is supplemented by test_package consumer API tests below."

# Upstream test denominator in official units (no harness, so zero).
upstream_test_total: 0
upstream_test_count_method: auto

# Upstream test command (none).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests run in build() (none, see audit above).
upstream_tests: []

# test_package consumer tests (run on HarmonyOS aarch64).
test_package_tests:
  - file: TestMelting.java
    description: "Call melting.Main.getMeltingResults API for two DNA duplexes (CCATCGCTACC, GCGAGC), assert Tm in (0,150) plus non-zero enthalpy/entropy (R34)"
    command: "bash test.sh"

# Assertion count: 6 checks (Tm/enthalpy/entropy x 2 sequences) + 1 PASS.
assertion_count: 7
