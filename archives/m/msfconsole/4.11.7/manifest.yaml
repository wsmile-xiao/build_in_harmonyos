# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "msfconsole 是 Metasploit Framework 的 Ruby 控制台脚本，非标准 autotools 项目，需要定制 conanfile.py"
  - "框架包含两个可在 aarch64 编译的 C 工具：stat-key（POSIX stat）和 time-key（POSIX time/strptime，需 -D_GNU_SOURCE）"
  - "cpuid-key.c 和 cpuinfo.c 使用 x86 inline asm（cpuid 指令），aarch64 平台不支持，必须跳过"
  - "memdump.c 使用 Windows API（<windows.h>），serialport.c 是 Ruby C 扩展（<ruby.h>），均非独立可编译二进制"
  - "package_type 应为 application 而非 library，package_info 应设置 cpp_info.bindirs 而非 cpp_info.libs"
  - "无 generate() 方法，因为不使用 AutotoolsToolchain/CMakeToolchain，直接在 build() 中调用编译器"
  - "编译器路径从 self.conf_info.get('tools.build:compiler_executables') 获取（R33）"
