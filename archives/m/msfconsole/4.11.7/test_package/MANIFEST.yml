# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: msfconsole/4.11.7
homepage: "https://github.com/rapid7/metasploit-framework"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# Metasploit Framework 使用 Ruby Rakefile，非标准 make check
upstream_check_command: "rake test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# msfconsole 的 C 工具无独立测试套件，Ruby 测试需完整 Rails 环境
upstream_tests:
  - file: tools/context/stat-key.c
    source: msfconsole-4.11.7/tools/context/stat-key.c
    description: "POSIX stat() 工具，输出文件大小和修改时间的 XOR key"
    command: "./stat-key <filename>"
  - file: tools/context/time-key.c
    source: msfconsole-4.11.7/tools/context/time-key.c
    description: "POSIX time() 工具，输出当前时间 key（16 位 LSB 置零）"
    command: "./time-key"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 time-key（exit 0）和 stat-key（无参数 exit 1）验证二进制功能"
    command: "./test_msfconsole"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
