# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）。
# 详见: docs/TEST_QUALITY_SPEC.md

package: meek/0.38.0
homepage: "https://www.torproject.org"

# 上游测试命令（Go 项目使用 go test）
upstream_check_command: "go test ./..."

# conanfile.py build() 中是否集成上游测试
# meek 上游测试需要完整 Tor PT 环境变量，交叉编译场景不具备
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: meek-client/
    source: meek-v0.38.0/meek-client/
    description: "meek-client Go 包单元测试（需 Go 测试环境）"
    command: "go test ./meek-client/"
  - file: meek-server/
    source: meek-v0.38.0/meek-server/
    description: "meek-server Go 包单元测试（需 Go 测试环境）"
    command: "go test ./meek-server/"

# test_package 自带测试（消费者视角，验证二进制可执行）
test_package_tests:
  - file: test.sh
    description: "运行 meek-client/meek-server 验证 ENV-ERROR 输出（R34 合规）"
    command: "bash test.sh"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 4
