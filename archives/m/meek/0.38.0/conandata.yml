# conandata.yml — meek 0.38.0
# Source: Tor Project official GitLab (R39: official source).
# gitlab.torproject.org is unreachable from both the dev machine and CI
# Workers, and the host is not covered by the CI mirror fallback. goproxy.cn
# mirrors the official git.torproject.org module zip (same bytes as the
# official v0.38.0 source, verified sha256 below); the file:// entry is the
# same zip pre-cached under the shared HOME for CI workers that cannot reach
# goproxy.cn either. Conan get() tries each URL in order until one succeeds.

sources:
  url:
  - "https://goproxy.cn/git.torproject.org/pluggable-transports/meek.git/@v/v0.38.0.zip"
  - "file:///storage/Users/currentUser/builds/meek-v0.38.0-goproxy.zip"
  sha256: "8030b333f70bedef18a99ef348eba58e1b1ce812974c4f3f075e1fd00c2a9f38"

# Go 工具链：CI Worker 无 go，配方内置下载（aliyun 官方镜像，linux/arm64）
go_toolchain:
  url: "https://mirrors.aliyun.com/golang/go1.22.12.linux-arm64.tar.gz"
  sha256: "fd017e647ec28525e86ae8203236e0653242722a7436929b1f775744e26278e7"

patches: {}
