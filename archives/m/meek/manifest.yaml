software: meek
display: "meek"
description: "Tor 的抗封锁可插拔传输工具，通过 HTTPS 中继流量"
category: network
homepage: "https://www.torproject.org"
license: CC0-1.0
build_system: go

ohos_adaptation:
  key_points:
    - "Go 项目使用 go build 直接编译，无需 configure/make"
    - "CGO_ENABLED=0 实现纯 Go 静态链接（R26）"
    - "GOOS=linux 映射 HarmonyOS（Go 不支持 ohos 作为 GOOS）"
    - "GOARCH=arm64 映射 Conan arch=armv8"
  common_dependencies: []

versions:
  "0.38.0":
    status: built
    build_date: "2026-07-31"
