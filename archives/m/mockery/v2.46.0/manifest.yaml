name: mockery
version: v2.46.0
status: published
system: custom
build_system: go
source_url: https://github.com/vektra/mockery
configure_options:
  - CGO_ENABLED=1
  - GOOS=linux
  - GOARCH=arm64
  - GOPROXY=https://goproxy.cn,direct
  - GO_BIN=~/usr/local/go1263/bin/go
  - LDFLAGS="-X github.com/vektra/mockery/v2/pkg/logging.SemVer=v2.46.0 -s -w"
dependencies:
  - go >= 1.26
  - libc (musl)
knowledge_gained:
  - Go二进制不可用patchelf设置RPATH（会破坏Go ELF结构）
  - Go二进制不可用llvm-objcopy --strip-debug
  - Go strip应使用-ldflags "-s -w"
  - golang.org/x/tools v0.17.0不兼容Go 1.26+
  - HarmonyOS上未签名ELF执行报permission denied
go_dependency_upgrades:
  - golang.org/x/tools v0.17.0 → v0.45.0
  - golang.org/x/mod v0.14.0 → v0.36.0
  - golang.org/x/sys v0.6.0 → v0.44.0
