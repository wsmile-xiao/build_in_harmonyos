  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/mockery-homebrew.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/mockery-homebrew.work
  source_orig_hash: cf5bf3b034415c9c
  source_work_hash: 5f20d2da8b49a304
  generated_at: '2026-06-02T12:10:21'
  patches_count: 2

patch_classification:
  - file: 0001-go.mod.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-go.sum.patch
    type: auto
    platform_only: True
    guard: 'pending'
