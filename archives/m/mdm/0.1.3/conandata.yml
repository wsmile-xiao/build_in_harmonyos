# conandata.yml — mdm 0.1.3
# 单一事实源：源码 URL + SHA256 + 一枚源码补丁（见下方 patches）
# 构建侧：build() 显式驱动编译器，绕开上游 Makefile 链接行的 gcc 假设；无依赖
#
# 取源口径（R39 / PF7）：
#   官方源 = 上游 GitHub release tag（注意 tag 名带 release- 前缀）：
#   https://github.com/cklin/mdm/archive/refs/tags/release-0.1.3.tar.gz
#   实测 200、19283B，sha256 d3dcc78d54e8801077926df44864a8fc537c3a2e29f2489b4fed5e3891a56adf。
#   Debian 池 .orig（19219B）与之哈希不同（打包元数据差异），SCT 台账已注明；
#   池址只作指纹对照，PF7 不入配方。

sources:
  url: "https://github.com/cklin/mdm/archive/refs/tags/release-0.1.3.tar.gz"
  sha256: "d3dcc78d54e8801077926df44864a8fc537c3a2e29f2489b4fed5e3891a56adf"

patches:
  - patch_file: "patches/0001-mdm-run-fix-unsequenced-execvp.patch"
    patch_description: "programs/mdm-run.c 直通模式上游写作 execvp(*argv, ++argv)：*argv 与 ++argv 对同一对象无序读写（clang 15 实测 -Wunsequenced，属 C 标准意义上的 UB）；求值顺序不同则被 exec 的程序名在 mdm-run 自身（argv[0]）与用户命令（argv[1]）之间取值，而此刻参数向量已推进为 argv[1..]，程序名与向量随之错位。补丁拆出 char **args = argv + 1 后 execvp(args[0], args)，把『exec 用户命令、参数向量自该命令起』确定化（等价 gcc 下的实际行为与作者意图）"
    patch_type: "bugfix"
