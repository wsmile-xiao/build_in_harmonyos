knowledge_gained:
  - "mdm 0.1.3 上游链接行 `mdm-% : programs/mdm-%.c $(LIB)` 把 .c 与 .o 一起交给 $(CC) -o——gcc 接受（1 个 .c + N 个 .o 编链合一），clang 15 报 'cannot specify -o when generating multiple output files' ⇒ 配方 build() 显式驱动编译器（8 个 -c + 3 次链接）绕开该 gcc 假设；这一面不走补丁（改动在配方侧，源码无需改）"
  - "上游 `override CC := $(shell which mdm-run && echo mdm-run) $(CC)`：PATH 恰有 mdm-run 时把编译命令包进 mdm-run（分布式编译）；鸿蒙环境无 mdm-run ⇒ 前缀为空无害，但配方不能依赖该行为"
  - "`override CFLAGS += -Wall -D_GNU_SOURCE -Iinclude`：override += 会把追加部分强制保留在命令行赋值之后（与普通 += 被命令行覆盖吞掉不同），-Iinclude 相对路径依赖 cwd=源码根"
  - "mdm-top 是唯一 -lcurses 面（ncurses 监控 UI）；ncurses 包库链接名（libcurses vs libncurses）未在本任务验证 ⇒ 按裁剪口径不构建 mdm-top，交付协调核心三件（mdm-run/mdm-master/mdm-slave）"
  - "programs/mdm-run.c 直通模式上游写作 `execvp(*argv, ++argv)`：*argv 与 ++argv 对同一对象无序读写（clang -Wunsequenced UB），求值顺序不同则 *argv 取到的是 mdm-run 自身还是用户命令，被 exec 的程序名与参数向量随之错位 ⇒ 本包用补丁 0001 修掉：拆出 `char **args = argv + 1` 后 `execvp(args[0], args)`，确定性 exec 用户命令、参数向量自该命令起（等价 gcc 下的实际行为与作者意图）。修复后 G2 构建日志内 unsequenced 一词仅命中补丁文件名，无编译告警"
  - "被测 exec 一律用绝对路径 /bin/sh：conanrun 环境 PATH 不含系统目录，而 execvp 对绝对路径不做 PATH 查找 ⇒ 测试面与 PATH 无关（打补丁前曾为绕开 exec 错位改用 toybox 多路复用器形态，该绕法现已不需要）"
  - "library/socket.c 有 memset/strcpy 隐式声明 warning（-D_GNU_SOURCE 下 clang 15 仅警告）"
  - "上游 Makefile 的 install 用 /usr/bin/install + sed 改写脚本 + gzip man 页（Debian 打包逻辑）⇒ 配方 package() 自拷产物"
  - "GitHub release tag 名带 release- 前缀（release-0.1.3），archive URL 与 Debian .orig 哈希不同（打包元数据差异）——conandata 必须写 GitHub archive（PF7）"
  - "R38/L0k：工具类包的 commands.json 必须落在软件级目录 archives/m/mdm/commands.json（与软件级 manifest.yaml 同级），放版本目录下 W3 本地 CI 即以 `commands_json_r38` 失败"

upstream_tests_exist: false
upstream_test_audit: "Audited the mdm 0.1.3 release tarball (27 entries: CHANGES, LICENSE, Makefile, README, .hg*, documents/ 3 man pages, include/middleman.h, library/ 5 .c, programs/ 4 .c, scripts/ 2). No test directory, no test source file; the bare Makefile exposes all/mdm-*/man-html/install*/clean/dist-clean (no check target, no TESTS variable); the 24 'assert' hits are in-source libc assert() defensive checks, not a test framework. Scan kept at reports/upstream-test-scan.txt."

reason: "mdm 0.1.3 ships no upstream test suite (27 entries, no test sources, no check target). test_package/test.sh therefore adds 9 HarmonyOS consumer assertions that really execute the packaged binaries: artifact hygiene for the three coordination tools (existence + exec bit, ELF magic of mdm-run, and mdm-top absent per the delivery scope), plus live execution of mdm-run in direct-exec mode -- exec of the absolute-path '/bin/sh -c \"echo mdm-hello\"' returning rc 0 with its stdout round-tripped, rc != 0 refusal when no command argument is supplied (measured rc 1), and child exit-code passthrough ('exit 3' surfaces as rc 3). The direct-exec assertions rely on patch 0001, which makes upstream's unsequenced execvp(*argv, ++argv) deterministic."
