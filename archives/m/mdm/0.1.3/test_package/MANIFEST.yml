# test_package/MANIFEST.yml — mdm 0.1.3
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
#
# 清点结论: 上游 0.1.3 无任何自动化测试（27 条目无测试目录/测试源文件；
# Makefile 无 check 目标、无 TESTS 变量；24 处 assert 为源码内 libc
# 防御性断言，非测试框架）。完整清点: reports/upstream-test-scan.txt

package: mdm/0.1.3
homepage: "https://github.com/cklin/mdm"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 本包留空：上游 Makefile 无 check/test 目标、无 TESTS 变量，没有命令可填。
# 依据与证据锚: reports/upstream-test-scan.txt 第 31 行
#   `grep -cE "TESTS|check:" Makefile  -> 0`、第 32-33 行的 Makefile 目标全集
#   （all / mdm-* / man-html / install / install-bin / install-docs / clean /
#   dist-clean——无 check、无 test）。同口径另见本文件顶部清点结论与
#   upstream_tests: []、版本级 manifest.yaml 的 upstream_test_audit、
#   test_package/test.sh 头注释、notes.md「测试数字口径」四处。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "鸿蒙消费者断言：A 产物面 5 条（mdm-run/mdm-master/mdm-slave 存在且可执行、mdm-run ELF magic、包内无 mdm-top 的裁剪校验）+ B 功能面 4 条（mdm-run 真实 exec 绝对路径 /bin/sh -c 'echo mdm-hello' 且 rc=0、该命令 stdout 透传校验、无命令参数时 rc 非 0 拒绝空跑、子进程退出码透传 exit 3 到 rc 3）"
    command: "/bin/sh test.sh <bindir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
