# NOTE: patch 0003 also creates new files, so `strip` must stay at its
# default (0): conan applies patches with patch_ng, which strips the "b/"
# prefix itself and would additionally strip the first real path component
# with strip: 1, creating the new files at the wrong location.
patches:
  - patch_file: "patches/0001-ohos-platform-support.patch"
    patch_description: "Recognize HarmonyOS/OHOS as a platform and provide OHOS toolchain defaults"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-install-robustness.patch"
    patch_description: "Survive a userland without id(1)/chown(1)/chgrp(1) and without hard links (HarmonyOS/OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-regression-tests.patch"
    patch_description: "Register OHOS as a known system, add the tests/os_OHOS regression case"
    patch_type: "portability"
