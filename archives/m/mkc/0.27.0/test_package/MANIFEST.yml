# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mkc/0.27.0
homepage: "https://github.com/cheusov/mk-configure"

# 上游测试入口：0.27.0 顶层 main.mk 的 test 目标 = test-tests，
# tests 与 examples 均以 ":tests" 标签注册进 SUBPRJ，一次全部执行
upstream_check_command: "bmake test"
upstream_test_in_build: false
upstream_test_command: ""

# 上游注册用例（main.mk 硬编码清单）：tests 29（上游）+ os_OHOS（本次新增）+
# examples 35 = 65；由 mk/mkc.minitest.mk 驱动逐例 diff expect.out。
# examples/hello_require_tools 上游注释未注册、examples/hello_TARGETS 未注册、
# examples/helpers 为辅助子工程，均不作为测试执行，不计入。
upstream_tests:
  - file: main.mk
    source: mk-configure-mk-configure-0.27.0/main.mk
    description: "注册用例清单：tests 29 + examples 35（均以 :tests 标签进入 test-tests）"
    command: "bmake test"
  - file: mk/mkc.minitest.mk
    source: mk-configure-mk-configure-0.27.0/mk/mkc.minitest.mk
    description: "minitest 驱动：diff expect.out 判定 succeeded/FAILED"
    command: "bmake test"
  - file: tests/os_OHOS/Makefile
    source: mk-configure-mk-configure-0.27.0/tests/os_OHOS/Makefile
    description: "本次新增的 OHOS 专用回归用例（仅 OPSYS=OHOS 时执行）：校验 OHOS 平台识别、sys/types.h、sys/stat.h、sizeof(int) 与 OHOS 编译器内置宏 __OHOS_FAMILY__"
    command: "bmake test-tests/os_OHOS"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者端到端测试：用安装后的 mkcmake 构建 C 工程、运行产物并校验输出，再调用 mkc_check_version / mkc_check_header / mkc_check_sizeof"
    command: "MKC_PKG=<pkg> sh test.sh"
  - file: conanfile.py
    description: "test() 以 self.run 调用 test.sh（env=conanrun），真实执行被测包"
    command: "conan test test_package mkc/0.27.0"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
