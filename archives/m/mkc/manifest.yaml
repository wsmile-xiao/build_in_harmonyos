software: mkc
display: "mk-configure (mkc)"
description: "Build system on top of bmake (portable NetBSD make)"
category: build-tool
homepage: "https://github.com/cheusov/mk-configure"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "HarmonyOS 的 uname -s 返回 \"HarmonyOS\"，mkc.init.mk 规范化为 OHOS"
    - "OHOS 无裸 cc/c++/cpp，mkc_imp.platform.sys.mk 提供 CC.OHOS/CXX.OHOS/CPP.OHOS = clang/clang++/clang -E"
    - "OHOS 的 id(1) 不可用，其 stderr 会被 bmake 的 != 捕获并污染回归测试输出，故静默化"
    - "HMDFS 不允许硬链接，LINKS 安装回退为同目录相对符号链接"
    - "OHOS 无 chown(1)/chgrp(1)（/bin/sh 仅提供不可执行的别名），mkc_install 在解析不到可执行文件时跳过属主变更"
    - "构建/测试环境需 STRIPPROG=llvm-strip、AR=llvm-ar、RANLIB=llvm-ranlib（OHOS 无裸 strip/ar/ranlib，mkc_install -s 会以 Error 127 中断安装）"
    - "AWK 必须显式传入：Makefile.inc 探测的 /usr/bin/awk 在 OHOS 上是 toybox awk"
    - "bmake 既是构建工具也是运行期依赖（mkcmake 是 bmake 的薄封装）"
  common_dependencies:
    - bmake
    - bmkdep

versions:
  "0.27.0":
    status: built
    build_date: "2026-10-08"
