# 软件级 manifest
# 文件位置: archives/m/medianfilter/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: medianfilter
display: "MedianFilter"
description: "Heap-free sliding-window median filter for embedded C/C++ (O(n/2) worst-case insert, zero malloc)"
category: library
homepage: "https://github.com/accabog/MedianFilter"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "无第三方依赖，仅 <stdint.h>/<cstdint>，纯静态库 + C++ header-only 模板"
    - "上游 v1.0.0 头文件类型名为 sMedianFilter_t/sMedianNode_t（README 的 MedianFilter_t 别名未在头文件中提供）"
    - "滑动窗口未满时以 0 填充槽位（warmup 语义），测试断言需对齐"
    - "R33：编译命令从 Conan conf 取编译器，LLVM 静态归档经 shutil.which('llvm-ar')"
    - "无 CLI 产物（仅 .a + 头文件），按 R38 无需 commands.json"

  common_dependencies: []

versions:
  "1.0.0":
    status: published
    build_date: 2026-09-28
    conan_ref: "medianfilter/1.0.0"