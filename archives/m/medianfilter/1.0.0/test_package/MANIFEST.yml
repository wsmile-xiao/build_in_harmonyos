# test_package/MANIFEST.yml — CI L0e
package: medianfilter/1.0.0
homepage: https://github.com/accabog/MedianFilter

# 上游 v1.0.0 自带三套独立测试（Makefile test 目标），全部在配方 build()
# 中编译并运行（hard gate），详见 ../notes.md 与 ../test_ohos/MANIFEST.yml。
upstream_test_in_build: true
upstream_test_command: "make test (等价命令见 notes.md: 逐目标编译并运行 stress_test / circular_test / test_cpp)"
upstream_test_command_exit: 0
upstream_tests:
  total_run: 203
  ok: 203
  fail: 0
  skipped: 0
  pass_rate: "203/203 (100%)"
  notes: |
    source_declared_total=203 (stress_test.c 140 = 14 patterns x 10 window sizes,
    circular_test.c 51, test_cpp.cpp 12)，configured_executable_total=3 个独立
    可执行用例，executed_passed_total=203。逐项映射与运行日志见 ../notes.md
    双口径台账及运行输出（140 passed / 51 passed / 12 passed, 0 failed）。

# 消费者测试（从最终 Conan 包编译链接）
test_package_tests:
  - file: test_medianfilter_c.c
    description: |
      消费者测试 (C API): 以 CMakeDeps 链接 medianfilter::medianfilter
      （最终包产物），仅通过公开头文件 MedianFilter.h 调用
      MEDIANFILTER_Init/MEDIANFILTER_Insert，断言窗口 7 序列
      10..70 的中值 = 40。
    command: "./test_medianfilter_c"
  - file: test_medianfilter_cpp.cpp
    description: |
      消费者测试 (C++ header-only): 仅通过公开头文件 MedianFilter.hpp
      实例化 MedianFilter<int,5> 模板并 Insert，断言中值 = 3。
    command: "./test_medianfilter_cpp"