# test_ohos/MANIFEST.yml — HarmonyOS PC 专项验证
package: medianfilter/1.0.0
homepage: https://github.com/accabog/MedianFilter

# OpenHarmony PC 平台专项测试（独立于 test_package 的库 API 验证）
# 运行: conan test archives/m/medianfilter/1.0.0/test_ohos medianfilter/1.0.0 \
#       -pr:h ohos-aarch64 -pr:b ohos-aarch64
test_ohos_tests:
  - file: test_ohos.sh
    description: |
      鸿蒙交付验证 (bash + set -euo pipefail, 独立临时目录经 trap
      EXIT/INT/TERM 清理, 失败/超时/中断均不残留、不写包目录):
      H1 包结构: lib/libmedianfilter.a + include/MedianFilter.h +
         include/MedianFilter.hpp 全部存在;
      H2 归档内对象为 ELF64 Little-Endian AArch64 (llvm-readelf 逐项
         验证 class/data/machine, readelf 失败时该检查 fail closed);
      H3 对象内无宿主构建路径 (strings 扫描 /storage/Users、
         .conan2、/data/service/hnp 等);
      H4 端到端消费者从安装的公开头文件编译、链接 libmedianfilter.a
         并在 OHOS 上真实运行: median(1..5)=3、窗口 3 对 5/5/100 尖峰
         序列输出全为 5 (可观察结果断言)
    command: "conan test archives/m/medianfilter/1.0.0/test_ohos medianfilter/1.0.0 -pr:h ohos-aarch64 -pr:b ohos-aarch64"
    count: 7

assertion_count: 7
