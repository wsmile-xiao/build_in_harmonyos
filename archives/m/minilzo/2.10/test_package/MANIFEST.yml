# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
package: minilzo/2.10
homepage: "https://www.oberhumer.com/opensource/lzo/"

# MiniLZO is distributed as a source subdirectory; its upstream test is run directly.
upstream_check_command: "./testmini"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: testmini.c
    source: lzo-2.10/minilzo/testmini.c
    description: "MiniLZO compression/decompression round-trip test"
    command: "./testmini"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer-side MiniLZO compression/decompression round-trip"
    command: "./test_minilzo"

# Five substantive checks: allocation, initialization, compression, decompression, and byte equality.
assertion_count: 5
