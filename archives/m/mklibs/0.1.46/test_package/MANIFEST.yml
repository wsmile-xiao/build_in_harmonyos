# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试入口清点结论（2026-09-29，源码树 + Debian 打包元数据）：
#   * 上游源码树 33 个文件，无 tests/ 目录（find 全量清单见 reports/test-report.md）
#   * debian/ 无 tests/（无 autopkgtest）
#   * Makefile.am / src/Makefile.am / lib/**/Makefile.am 均无 TESTS 或 check_PROGRAMS
#   * 上游提供的是 man 页描述的 CLI 入口（mklibs / mklibs-copy / mklibs-readelf）
# 因此 upstream_tests 为空，真实入口逐一执行记录见 reports/test-report.md。

package: mklibs/0.1.46
homepage: "https://salsa.debian.org/installer-team/mklibs"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 实测：make check 无该目标（上游未提供任何测试目标）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无：上游不含自动化测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者视角验证：mklibs-readelf --version/--help/-i/-n/-R/-p/-u + Python 入口（mklibs/mklibs-copy）"
    command: "bash test.sh"

# 测试断言总数（= test_package/test.sh 中显式 PASS 断言条数：version / help 选项集 /
# -i / -n / -R / -p,-u 符号提取 / python 入口，共 7 条）
assertion_count: 7
