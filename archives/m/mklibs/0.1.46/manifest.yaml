# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "config.guess (automake 1.18, 2024-07-27) 不识别 HarmonyOS(uname -s)，autotools 包需显式 --build/--host=aarch64-unknown-linux-gnu"
  - "HMDFS 上 mktemp -d 目录不可写 → configure 报 'could not setup config files machinery'，需 mktemp wrapper (mkdir 语义)"
  - "本机 OHOS Python 3.12.9 的 os.popen().read() 文本模式不可用（最小复现即失败），Py3 项目应改用 subprocess"
  - "conan apply_conandata_patches 默认 strip=0，a/ b/ 前缀补丁必须显式 strip: 1"
  - "conan profile 的 -std=c++17 会禁用 GNU 关键字 typeof，上游用 GNU 扩展时应改 __typeof__"
  - "autotools 包在 CI 干净 PATH 缺 aclocal/automake/libtoolize，需 tool_requires automake/1.18 + libtool/2.5.4（autoconf/m4 用 SDK，避免 perl XS 冲突）"
  - "wrapper 前置 PATH 从 source 目录复制（cache /s）时需注意 tarball 顶层目录（Debian native 包 mklibs-0.1.46/），source() 用 strip_root=True"

