# conandata.yml — mklibs 0.1.46 (Debian native source package)
sources:
  url:
    - "https://deb.debian.org/debian/pool/main/m/mklibs/mklibs_0.1.46.tar.xz"
  sha256: "1b2f64d93a8896ec9e47686e1a481cb4ac9e49fe59df84c33e0d12a28903bbae"
  filename: "mklibs_0.1.46.tar.xz"

patches:
  # refresh-patch 生成的补丁使用 a/ b/ 前缀，需 strip 1 级（conan 默认 strip=0）
  - patch_file: "patches/0001-lib-mklibs-utils-logging.py.patch"
    strip: 1
    patch_description: "Use integer division for the VERBOSE log level constant (Python 3 '/' yields float, logging.log() requires an int)"
    patch_type: "portability"
  - patch_file: "patches/0002-lib-mklibs-utils-main.py.patch"
    strip: 1
    patch_description: "Default the -v/--verbose count option to 0 (Python 3 raises TypeError on 'None >= int')"
    patch_type: "portability"
  - patch_file: "patches/0003-src-mklibs.patch"
    strip: 1
    patch_description: "Python 3 port of the mklibs driver: replace the removed string.join/split/rfind helpers, os.popen() text-mode reads (broken on this platform's Python 3.12) and dict.has_key; make multiarch() tolerate an absent dpkg-architecture"
    patch_type: "portability"
  - patch_file: "patches/0004-src-mklibs-copy.patch"
    strip: 1
    patch_description: "Python 3 port of mklibs-copy: replace os.popen() text-mode reads, dict.has_key/itervalues and the text-mode read of binary ELF files; make multiarch() tolerate an absent dpkg-architecture"
    patch_type: "portability"
  - patch_file: "patches/0005-src-mklibs-readelf-elf.cpp.patch"
    strip: 1
    patch_description: "Use __typeof__ instead of the GNU-only 'typeof' keyword in elf.cpp so it compiles under -std=c++17 (Conan toolchain) as well as gnu++17"
    patch_type: "portability"
