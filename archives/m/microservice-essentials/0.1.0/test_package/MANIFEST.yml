# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: microservice-essentials/0.1.0
homepage: "https://github.com/seboste/microservice-essentials"

# 上游测试命令 (ctest -N 分析；本库 tests/CMakeLists.txt 使用 Catch2)
upstream_check_command: "./tests"

# conanfile.py build() 方法中是否已集成上游测试 (BUILD_TESTING=OFF 默认，配方不含上游测试)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Catch2 SCENARIO, 见 reports/upstream-tests-run.log)
upstream_tests:
  - file: tests
    source: microservice-essentials-0.1.0/tests/
    description: "上游 Catch2 聚合套件 tests：36 个注册 SCENARIO / 707 assertions 全量通过（源码声明 38 项，其中 2 项为上游显式禁用：signal-handler_test.cpp 被 CMakeLists 注释、graceful-shutdown 第二处声明在注释块内）"
    command: "./tests"

# test_package 中自带的测试 (消费者视角验证, 真实 API 调用)
test_package_tests:
  - file: main.cpp
    description: "鸿蒙消费者验证：Status/StatusCode/Context/RequestProcessor+RetryRequestHook 公开 API 真实调用（模拟业务上层组件），6 项断言全过"
    command: "./test_microservice_essentials"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 707
