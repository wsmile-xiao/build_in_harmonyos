# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.0"

# 软件名
software: "microservice-essentials"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/seboste/microservice-essentials/tar.gz/refs/tags/0.1.0"

  # 源码校验和
  sha256: "9739f7052ee9de96c4b206e0d345d6de5594dcf2bd6f8d3364d44788e83fbe58"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "codeload refs/tags tar.gz URL 无扩展名时 conan get() 误判 zip（E276/E483）：conandata sources 加 filename 字段"
- "init-build URL 关键字构建系统检测把无 cmake 字样的 CMake 项目误判为 autotools，需按源码标记重写配方（E543 草稿）"
- "Conan CMakeDeps 下 Catch2 include(Catch)/catch_discover_tests 需显式 CMAKE_MODULE_PATH（E543 草稿）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
