issues_resolved:
  - issue: >-
      find_library(M_LIB m) returns M_LIB-NOTFOUND on the OpenHarmony NDK
      because the sysroot keeps its libraries in the aarch64-linux-ohos triplet
      directory that CMake does not probe.
    solution: >-
      Patch falls back to the plain linker flag -lm when the lookup fails, so
      the math functions resolve from whichever libm the toolchain provides.
  - issue: >-
      Upstream installs nothing except the command line tool, and installs it to
      the hard-coded absolute path /usr/local/bin, which breaks relocating
      packaging and leaves the library and headers uninstalled.
    solution: >-
      Patch installs mapcodelib, its three public headers and the tool into
      prefix-relative GNUInstallDirs destinations.
  - issue: >-
      The upstream unit test reads territories.csv relative to its working
      directory and reports "Can't read file territories.csv" plus a non-zero
      exit status when launched from the build tree.
    solution: >-
      Register the test with CTest using WORKING_DIRECTORY set to the upstream
      test/ folder, and run it with the same working directory from build().
  - issue: >-
      cross_building(self) reports False for this project because the OHOS
      profile is passed as both -pr:h and -pr:b, so Conan sees identical host
      and build settings even though the compiler targets aarch64 OpenHarmony
      from an x86_64 builder.
    solution: >-
      Key the qemu-user decision off the build machine CPU (and keep
      cross_building as an additional trigger), and link the executables
      statically so they need no device root filesystem.

differences_from_previous: none
