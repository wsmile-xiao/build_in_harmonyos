# conandata.yml — mapcode 2.5.7
# Upstream release tag v2.5.7 of mapcode-foundation/mapcode-cpp.

sources:
  url: "https://github.com/mapcode-foundation/mapcode-cpp/archive/refs/tags/v2.5.7.tar.gz"
  sha256: "959f0431d146fbb93e0e1f356a05af9320d4acb91faf92d0f1a718541e7fd2e6"

patches:
  - patch_file: "patches/0001-cmake-relocatable-install-libm-fallback-and-ctest.patch"
    patch_description: >-
      Make the build relocatable and testable: fall back to a plain -lm when
      find_library cannot locate libm in a target-triplet sysroot, install the
      library, its public headers and the command line tool into
      prefix-relative GNUInstallDirs destinations instead of the hard-coded
      absolute /usr/local/bin, and register the upstream unit tests with
      CTest.
    patch_type: "portability"
