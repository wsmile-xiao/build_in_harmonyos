# test_package/MANIFEST.yml
# Upstream test declaration for mapcode 2.5.7.
# Required by ci/conan/build_and_test.sh (gate L0e).

package: mapcode/2.5.7
homepage: "https://github.com/mapcode-foundation/mapcode-cpp"

# How the upstream test suite is built and run, per upstream test/README.md
# and test/run_normal.sh: compile test/unittest.c against the library and run
# the resulting `unittest` program. The recipe registers it as the `unittest`
# CTest target (patches/0001-*.patch) and runs it from build().
upstream_check_command: "./unittest"
upstream_test_in_build: true
upstream_test_command: "./unittest"

# Upstream test programs (counted from the v2.5.7 source tree)
upstream_tests:
  - name: unittest
    kind: unit
    source: "test/unittest.c"
    entry: "test/unittest.c"
    invoked_by: "build() -> _run_upstream_tests()"
    assertions_reported: 245633397
    notes: >-
      Single upstream test binary covering 15 test groups (environment,
      robustness, alphabets, per-territory alphabets, parser, territory
      names, territories from territories.csv, distances, mapcode formats,
      encode/decode, re-encode, bug-fix regressions). It reads
      territories.csv and alphabets.csv from its working directory, which is
      why the CTest registration sets WORKING_DIRECTORY to the upstream
      test/ directory.

# Consumer-side tests shipped in this directory
test_package_tests:
  - file: test_mapcode.c
    description: >-
      Links mapcode::mapcode and asserts library version reporting, ISO3166
      territory round trip, Mapcode encoding, format validation, decoding
      accuracy bounds, the effect of extra precision digits, the multi-result
      encoder, and the distance helper.
    command: "./test_mapcode"
    assertion_count: 24
  - file: conanfile.py
    description: >-
      Executes the packaged bin/mapcode command line tool: encodes
      52.3702/4.8952 in territory NLD and decodes the result back, asserting
      the territory prefix and that the round trip stays within 0.05 degrees.
    command: "mapcode -e 52.3702 4.8952 NLD / mapcode -d NLD <mapcode>"
    assertion_count: 6

assertion_count: 30
