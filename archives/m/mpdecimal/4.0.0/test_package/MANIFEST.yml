# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mpdecimal/4.0.0
homepage: "https://www.bytereef.org/mpdecimal/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check (runtest + runtest_shared, official.decTest + additional.decTest; libmpdec++ C++ tests)"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/runtest.c
    source: mpdecimal-4.0.0/tests/runtest.c
    description: "libmpdec 静态库 official.decTest + additional.decTest"
    command: "./runtest official.decTest"
  - file: tests/runtest.c
    source: mpdecimal-4.0.0/tests/runtest.c
    description: "libmpdec 共享库 official.decTest + additional.decTest"
    command: "./runtest_shared official.decTest"
  - file: tests++/runtest.cc
    source: mpdecimal-4.0.0/tests++/runtest.cc
    description: "libmpdec++ C++ 测试 (official.topTest + additional.topTest)"
    command: "./runtest_shared official.topTest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 mpd_add (C API) 与 decnumber::decimal (C++ API)"
    command: "./test_mpdecimal"

# 测试断言总数 (近似值: 本地 make check 732 PASS / 0 FAIL)
assertion_count: 732
