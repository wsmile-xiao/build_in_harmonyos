software: mpdecimal
# 版本级 manifest
# 文件位置: archives/m/mpdecimal/2.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2.5.1"
status: published
build_date: "2026-09-04"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.bytereef.org/software/mpdecimal/releases/mpdecimal-2.5.1.tar.gz"
  sha256: "9f9cd4c041f99b5c49ffb7b59d9f12d95b683d88585608aa56a6307667b2b21f"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--disable-shared --enable-static"
    - "AR=llvm-ar LD=ld.lld RANLIB=llvm-ranlib (OHOS toolchain)"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-tmpdir.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - E007: "config.guess (2016-10-02) 老版本无 GUESS= 变量，HarmonyOS 分支需 echo+exit 写法；patch-autotools-ohos.pl 生成的 GUESS= 写法只适配新版 config.guess"
  - HMDFS: "config.status 用 umask 077 && mktemp -d ./confXXXXXX 在 CWD 创建临时目录，HMDFS 上 umask-077 目录内无法创建文件（Permission denied）；umask 022 + TMPDIR 即可解决（沿用 mpfr 4.2.2.1 0003-configure-tmpdir.patch 方案）"
  - local: "mpdecimal 是纯库包（无命令行工具），C 库 libmpdec + C++ 库 libmpdec++，musl 默认库搜索路径含 /system/lib64（libc++_shared.so 系统自带），C++ 测试无需额外 LD_LIBRARY_PATH"
  - local: "上游 make check 通过 tests/gettests.sh 从 speleotrove.com 下载官方 decTest 数据（wget 可达，301 重定向 https）；testdata_dist/ 内置 16 个附加测试文件作为无网络 fallback"
  - local: "mpd_maxcontext() 的 prec=999999999999999999 会导致运算 MPD_Malloc_error(0x200) 返回 NaN；测试程序应使用 mpd_init(&ctx, 28) 显式设置精度"
