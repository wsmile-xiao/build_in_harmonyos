package: mpdecimal/2.5.1
homepage: "https://www.bytereef.org/mpdecimal/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

upstream_tests:
  - file: tests/runtest.c
    source: mpdecimal-2.5.1/tests/runtest.c
    description: "Official decTest suite driver for libmpdec (static)"
    command: "make check"
  - file: tests/runtest_shared
    source: mpdecimal-2.5.1/tests/runtest_shared
    description: "Official decTest suite driver for libmpdec (shared)"
    command: "make check"
  - file: tests++/runtest.cc
    source: mpdecimal-2.5.1/tests++/runtest.cc
    description: "Official decTest suite driver for libmpdec++ (static)"
    command: "make check"
  - file: tests++/runtest_shared
    source: mpdecimal-2.5.1/tests++/runtest_shared
    description: "Official decTest suite driver for libmpdec++ (shared)"
    command: "make check"

test_package_tests:
  - file: test_mpdecimal.c
    description: "Initializes contexts, performs decimal add/mul/div/abs/sqrt, verifies exact string results and division-by-zero status handling"
    command: "ctest --output-on-failure"

assertion_count: 9
