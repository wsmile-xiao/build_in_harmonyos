  sha256: "9f9cd4c041f99b5c49ffb7b59d9f12d95b683d88585608aa56a6307667b2b21f"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Recognize HarmonyOS as linux-ohos in config.guess (2016-era script without GUESS= variable)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Accept linux-ohos triples in config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-tmpdir.patch"
    patch_description: "Create config.status temp directories under TMPDIR with umask 022 (HMDFS cannot write inside umask-077 mktemp dirs)"
    patch_type: "portability"
