software: mpdecimal
display: "mpdecimal"
description: "General Decimal Arithmetic library (libmpdec/libmpdec++)"
category: foundation
homepage: "https://www.bytereef.org/mpdecimal/"
license: BSD-2-Clause
build_system: autotools

versions:
  - version: "2.5.1"
    status: published
    build_date: "2026-09-04"
    notes: >-
      conan 流程首次适配（4.0.1 为旧 package 流程）。十进制浮点库，CPython 3.9-3.11
      内置版本，libmpdec.so.3 ABI 众多下游依赖。三个 portability 补丁：config.guess/sub
      HarmonyOS 识别 + configure tmpdir（HMDFS umask-077 mktemp 目录不可写）。
      上游 make check 全量 592/592 测试组 PASS（C/C++ × 静态/共享）；conan create
      静态构建 296/296 + test_package 8 断言全过。构建期坑：HarmonyOS wget 无 -nv
      （用 /usr/bin/curl 预下载官方 decTest 数据）；OHOS 加固 musl 忽略 LD_LIBRARY_PATH
      （make check 前置 LD_LIBRARY_PATH= 置空走默认路径）。
  - version: "4.0.1"
    status: published
    build_date: "2026-06-03"
    notes: >-
      旧 package 流程（无 conanfile）。C/C++ 双库，config.guess/sub 补丁 +
      CC/CXX wrapper 签名 + GNU ld 替代 lld。official 131+additional 15 PASS。
