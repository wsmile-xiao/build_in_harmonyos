package: multipledispatch/1.0.0
homepage: "https://github.com/mrocklin/multipledispatch"

upstream_check_command: "python3 upstream_tests/run_upstream_tests.py"
upstream_test_in_build: true
upstream_test_command: "python3 upstream_tests/run_upstream_tests.py"

upstream_tests:
  - name: upstream_tests/multipledispatch/tests/test_benchmark.py
    count: 4
    description: "Official tag 1.0.0 benchmark-oriented functional tests; the build uses the local benchmark compatibility fixture and does not record timing metrics."
  - name: upstream_tests/multipledispatch/tests/test_conflict.py
    count: 9
    description: "Official conflict ordering, ambiguity, super-signature, and variadic consistency tests."
  - name: upstream_tests/multipledispatch/tests/test_core.py
    count: 12
    description: "Official core dispatch, inheritance, cache, namespace, and method tests."
  - name: upstream_tests/multipledispatch/tests/test_dispatcher.py
    count: 28
    description: "Official Dispatcher registration, serialization, error, doc, and variadic dispatch tests."
  - name: upstream_tests/multipledispatch/tests/test_dispatcher_3only.py
    count: 6
    description: "Official Python 3 annotation and overlap tests."
  - name: upstream_tests/multipledispatch/tests/test_variadic.py
    count: 3
    description: "Official Variadic equality and union tests."
  - name: collection
    count: 62
    description: "pytest collection count from the six official files; the Conan build runner executes the same 62 functional cases without requiring pytest."

test_package_tests:
  - file: test_multipledispatch.py
    description: "Consumer-side test imports the generated Conan package, checks distribution metadata, exercises overloaded dispatch for int and str, calls Dispatcher.add, and verifies a missing signature raises."
    command: "python3 test_multipledispatch.py"

assertion_count: 6
