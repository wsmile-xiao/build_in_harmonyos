software: mashmap
display: "MashMap"
description: "Fast approximate aligner for long DNA sequences (minmer + MinHash based mapping, mashmap / mashmap-align)"
category: science
homepage: "https://github.com/marbl/MashMap"
license: AGPL-3.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 C++17 + POSIX 上游源码零改动：唯一补丁改的是 CMakeLists.txt 的依赖定位方式，不碰任何 .cpp/.hpp"
    - "上游 target_link_libraries 用裸库名 gsl/gslcblas/z，交叉构建缺 include 目录与库路径；改为 find_package(gsl CONFIG)/find_package(zlib CONFIG) + gsl::gsl / zlib::zlib 目标（CMakeDeps 生成配置包）"
    - "OPTIMIZE_FOR_NATIVE 默认 ON 会加 -march=native，描述的是构建机而非 aarch64 OHOS 目标，必须关闭"
    - "USE_HTSLIB 可选依赖保持关闭，依赖图只有上游无条件链接的 gsl 与 zlib"
    - "配置阶段 scripts/generate_git_version.sh 依赖 git describe，release tarball 必然失败且产物头无人引用，用 SKIP_VERSION_FILE=ON 跳过"
    - "Conan 把 os=OHOS 映射成 CMake 不认识的系统名 HarmonyOS，需显式 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64（E092）"
    - "产物为可执行文件（bin/mashmap、bin/mashmap-align），软件级 commands.json 必需（R38）"
    - "上游测试程序集=.github/workflows/build-and-test.yml 的 3 个 step；build() 内跑通前两个并对第三个（scripts/test.sh 覆盖度）做等价复算，因其依赖 x86_64 专用 bedtools"
  common_dependencies:
    - gsl/2.8
    - zlib/1.3.1.2

versions:
  "3.1.3":
    status: built
    build_date: "2026-10-02"
    device_verified: "HarmonyOS PC aarch64（os=OHOS arch=armv8 clang 15 libc++ cppstd 17 Release）：1/1 补丁干净应用 + conan create 退出 0 + 上游 3 个用例 + 消费者 130 项断言全部通过"
