# test_package/MANIFEST.yml
# 上游测试声明文件 + 本包消费者用例清单
# CI 脚本 (ci/conan/build_and_test.sh L0e) 强制要求此文件存在

package: mashmap/3.1.3
homepage: "https://github.com/marbl/MashMap"

# 上游测试清点（v3.1.3 源码树证据）：
#   - 无 tests/ 目录，无 CTest 注册（grep -rn 'enable_testing|add_test|ctest' CMakeLists.txt src/ 命中 0）
#   - 无 Catch2/GoogleTest/gtest 之类框架依赖（CMakeLists.txt 无任何测试相关 find_package）
#   - 唯一的测试载体是 .github/workflows/build-and-test.yml 的 3 个 step + scripts/test.sh
upstream_check_command: "build/bin/mashmap -v && build/bin/mashmap -r data/scerevisiae8.fa.gz -q data/scerevisiae8.fa.gz --pi 95 -n 1 -Y '#' -o scerevisiae8.paf && scripts/test.sh data/scerevisiae8.fa.gz.fai scerevisiae8.paf 0.92"

# conanfile.py 的 build() 是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "mashmap -v / mashmap 酵母自比对 + scripts/test.sh 等价覆盖度判定"

# 上游测试程序（按 .github/workflows/build-and-test.yml 的 3 个 step 逐一登记）
upstream_tests:
  - name: "basic version test"
    kind: integration
    source: "build/bin/mashmap -v"
    entry: ".github/workflows/build-and-test.yml (step: Basic version test)"
    invoked_by: "build() -> _run_upstream_tests() case 1"
    assertions_reported: 1
    notes: >-
      上游 CI 只要求命令退出码为 0。适配侧额外断言 stdout/stderr 末行为
      "3.1.3"（MashMap 通过 logger 走 stderr 打印版本）。
  - name: "align yeast genomes"
    kind: integration
    source: "data/scerevisiae8.fa.gz（上游自带 25711390 字节参考数据集）+ data/scerevisiae8.fa.gz.fai"
    entry: ".github/workflows/build-and-test.yml (step: Align yeast genomes)"
    invoked_by: "build() -> _run_upstream_tests() case 2"
    assertions_reported: 1
    notes: >-
      原命令含 --threads $(nproc --all)，适配侧固定 --threads 2 以便在
      x86_64 构建机的 qemu-user 模拟下耗时可预期。实测 PAF 输出 1037538 字节、
      9236 条记录、136/136 条 contig 全部被比对。
  - name: "test yeast coverage"
    kind: integration
    source: "scripts/test.sh（依赖外部 bedtools：sort / merge / intersect）"
    entry: ".github/workflows/build-and-test.yml (step: Test yeast coverage)"
    invoked_by: "build() -> _run_upstream_tests() case 3（等价复算，未直接执行脚本）"
    assertions_reported: 2
    notes: >-
      脚本本身不执行：它 shell out 到 bedtools，那是 x86_64 Linux 专用二进制，
      既不在 OHOS SDK/NDK 工具链内，也无法在 aarch64 目标上运行。适配侧按脚本
      的算术原样复算——PAF 的 query 区间并集长度 / .fai 序列长度，阈值沿用上游的
      0.92。实测 136 条序列全部被覆盖，最低覆盖度 0.9419 >= 0.92。

# 本目录自带的消费者用例（消费者视角 + 鸿蒙特有）
# assertion_count 为**运行时实测值**：test_mashmap.py 的 _require() 会把每次断言登记进
# RECORDED，脚本末尾按分组打印并汇总，因此下面的数字直接来自最后一次实测输出，
# 而不是手工维护的字面量（per-record 的 PAF/SAM 循环按记录条数逐次计数）。
test_package_tests:
  - file: test_mashmap.py
    group: "functional/version-banner"
    description: "mashmap -v 版本横幅：断言退出码为 0，且合并 stdout+stderr 中存在一行恰好等于 3.1.3（MashMap 走 logger 的 stderr）"
    command: "python3 test_package/test_mashmap.py --bindir <pkg>/bin --workdir <tmp> [--runner qemu-aarch64]"
    assertion_count: 2
  - file: test_mashmap.py
    group: "functional/align-usage"
    description: "mashmap-align -h 退出码可接受，并逐个确认 --mappingFile / --perc_identity / --threads / --output 四个选项面都在用法里"
    command: "同上"
    assertion_count: 5
  - file: test_mashmap.py
    group: "functional/end-to-end-mapping"
    description: "xorshift64 确定性合成参考+查询（6 contig / 2.2Mb / 3% 替换，均 gzip 且带明文 .fai）→ mashmap 出 PAF（逐记录校验 12 列、名称在 .fai 内、坐标不越界、链方向、id:f 恒等度 ≥ 0.95，全部 contig 双向命中）→ mashmap-align 出 SAM（记录数与 contig 数相等、id:f ≥ 0.95、CIGAR 正则、CIGAR 参考跨度与记录坐标跨度一致）"
    command: "同上"
    assertion_count: 115
    notes: "115 = 6 条 contig ×（PAF 每记录 8 项 + SAM 每记录 9 项）+ 13 项数据集/退出码/聚合断言"
  - file: test_mashmap.py
    group: "harmonyos/elf-profile"
    description: "鸿蒙特有：解析 bin/mashmap 与 bin/mashmap-align 的 ELF 头，逐个断言 e_machine=0xB7(AArch64)、PT_INTERP 指向 OHOS musl 动态加载器、DT_NEEDED 非空、DT_NEEDED 不含任何 glibc/libstdc++ SONAME、DT_NEEDED 含 musl 的 libc.so"
    command: "同上"
    assertion_count: 8

assertion_count: 130
