# conandata.yml — mashmap 3.1.3
# Single source of truth for the upstream URL, its SHA256 and the adaptation
# patches. Official upstream source (GitHub release tag of marbl/MashMap);
# no fork, no proxy mirror, no repacked Debian tarball.

sources:
  url: "https://github.com/marbl/MashMap/archive/refs/tags/v3.1.3.tar.gz"
  sha256: "7719dd6b3c25e650e16218252eaae7dbf424a10890d717ec3ad0920b102fd05a"

patches:
  - patch_file: "patches/0001-cmake-resolve-gsl-and-zlib-via-config-packages.patch"
    patch_description: "Locate GSL and zlib through their config packages instead of bare link names, so include dirs and library paths resolve for a cross build with staged dependencies"
    patch_type: "portability"
