version: "3.1.3"
software: mashmap
status: built
build_date: "2026-10-02"
build_system: cmake

source:
  url: "https://github.com/marbl/MashMap/archive/refs/tags/v3.1.3.tar.gz"
  sha256: "7719dd6b3c25e650e16218252eaae7dbf424a10890d717ec3ad0920b102fd05a"
  tar_format: tar.gz
  verified: "已直接从官方 tag URL 下载并重算 sha256 = 7719dd6b3c25e650e16218252eaae7dbf424a10890d717ec3ad0920b102fd05a（tarball 25919699 字节），与上方声明逐字一致"
  cross_reference: "同一 sha256 亦记录在 FreeBSD ports 的 biology/mashmap distinfo（marbl-MashMap-v3.1.3_GH0.tar.gz）中，可作第三方交叉佐证"

build:
  system: cmake
  cmake_variables:
    - "OPTIMIZE_FOR_NATIVE=OFF（上游默认 ON，会加 -march=native；该 flag 描述构建机而非 aarch64 OHOS 目标，FreeBSD port 与 Gentoo ebuild 同样关闭）"
    - "USE_HTSLIB=OFF（可选依赖，保持依赖图只有上游无条件链接的两个库）"
    - "SKIP_VERSION_FILE=ON（scripts/generate_git_version.sh 跑 git describe，release tarball 无 git 元数据；其产物 mashmap_git_version.hpp 无任何源文件 include（grep 仅命中生成脚本与 CMake option 文案 2 处））"
    - "CMAKE_SYSTEM_NAME=Linux（CMAKE_SYSTEM_PROCESSOR=aarch64 仅 OHOS）——Conan 把 os=OHOS 映射为 CMake 认识的 HarmonyOS，会直接 configure 失败（E092）"
  dependencies:
    - "gsl/2.8（制品仓已发布；提供 gsl_cdf_binomial_Q / gsl_ran_hypergeometric_pdf 等超几何显著性过滤统计量）"
    - "zlib/1.3.1.2（制品仓已发布；提供 gzstream 依赖的 gzopen/gzread）"
  cc: clang
  cxx: clang++
  compiler_note: "conan profile 的 tools.build:compiler_executables 指向 OHOS clang shim；C++ 标准 17 由 profile 的 compiler.cppstd=17 落到 conan_toolchain.cmake"

patches_applied:
  - "0001-cmake-resolve-gsl-and-zlib-via-config-packages.patch"

package_type: application
artifacts:
  - "bin/mashmap"
  - "bin/mashmap-align"

verification:
  platform: "HarmonyOS PC aarch64（os=OHOS os.version=6.0 arch=armv8 compiler=clang 15 libc++ cppstd 17 Release）"
  conan_create:
    command: "conan create archives/m/mashmap/3.1.3 --name=mashmap --version=3.1.3 -pr:h=ohos-aarch64-wsl -pr:b=ohos-aarch64-wsl --build=missing"
    exit_code: 0
    package_settings: "os=OHOS, os.version=6.0, arch=armv8, compiler=clang 15, compiler.libcxx=libc++, compiler.cppstd=17, build_type=Release"
    package_id: "d70f6d801b925ac1047c67ded4c4620deb4d6168"
  evidence:
    - "1/1 补丁由 Conan patch 引擎（git apply）干净应用，git apply --check 预先验证通过"
    - "configure 成功，日志出现 'Conan: Target declared gsl::gsl' / 'Conan: Target declared zlib::zlib'，即 CMakeDeps 配置包被 find_package 命中"
    - "两个可执行文件链接完成：bin/mashmap 6225016 字节、bin/mashmap-align 5081312 字节"
    - "file(1): ELF 64-bit LSB pie executable, ARM aarch64, interpreter /lib/ld-linux-aarch64.so.1（OHOS musl）"
    - "readelf -d bin/mashmap: NEEDED = libgsl.so.28 / libgslcblas.so.0 / libc.so —— 无任何 glibc SONAME"
    - "上游用例 1/3：mashmap -v 打印 3.1.3"
    - "上游用例 2/3：酵母自比对产出 1037538 字节 PAF，9236 条记录，136/136 条 contig 被比对"
    - "上游用例 3/3：scripts/test.sh 等价复算最低覆盖度 0.9419 >= 上游阈值 0.92"
    - "消费者用例 130 项断言全部通过（实测分组：2 版本横幅 + 5 选项面 + 115 端到端 PAF/SAM + 8 鸿蒙 ELF）"
    - "mashmap-align 真实产出 SAM：6 条记录，id:f 0.9738~0.9770，CIGAR 参考跨度与记录跨度一致（±1）"

knowledge_gained:
  - "上游 CMakeLists 用裸库名 gsl / gslcblas / z 链接。交叉构建时依赖被 stage 在 sysroot 之外，仅靠裸名既拿不到 include 目录（gsl/gsl_cdf.h、zlib.h）也拿不到精确库路径；必须在配方里补 CMakeDeps 生成器，让补丁引入的 find_package(gsl CONFIG)/find_package(zlib CONFIG) 有配置包可查（只加 CMakeToolchain 时 find_package 直接报 'Could not find a package configuration file provided by gsl'）"
  - "OPTIMIZE_FOR_NATIVE 默认 ON 会给交叉构建加 -march=native——该 flag 描述的是构建机 CPU，产物却要在所有 HarmonyOS PC 上跑，必须显式 OFF"
  - "配置阶段的 scripts/generate_git_version.sh 依赖 git describe，release tarball 里必然失败；且它生成的 mashmap_git_version.hpp 无任何源文件 include（全树 grep 仅命中生成脚本与 CMake option 文案 2 处），SKIP_VERSION_FILE=ON 是零风险跳过"
  - "mashmap -v 的版本号走 logger（stderr），不是 stdout；只看 stdout 会误判为'无输出'"
  - "scripts/test.sh 依赖外部 bedtools（x86_64 Linux 二进制），在 OHOS 工具链与 CI 里都不可用；它的断言（PAF query 区间并集 / .fai 长度 >= 0.92）可以纯 Python 1:1 复算"
  - "conan create 的 test_package 里 self.tested_source_folder 属性不存在（Conan 2.29.1），因此 test_package 无法访问上游 data/ 里的 25711390 字节酵母数据集；消费者用例需自带确定性合成数据集"
  - "mashmap-align 读 .fai 用 std::ifstream + std::stoul，第二列必须是纯数字；.fai 若是 gzip 过的（bgzip 的 .gzi 才是压缩索引）会抛 std::invalid_argument: stoul: no conversion 并 abort"
  - "mashmap-align 输出的 SAM 不是标准 SAM：没有 @HD/@SQ/@PG 头行，CIGAR 被拼在最后一列的 'kc:f:<x> <score> <CIGAR>' 里；按 SAM 规范解析会全量误判"
  - "cross_building() 在本仓 OHOS 同 profile 双传（-pr:h/-pr:b 同文件）时恒为 False；判定是否需要 qemu-user 必须看 platform.machine()（与 DRAFT-mapcode-2.5.7-cross-building-false 同源）"
