# 版本级 manifest — miniserve 0.35.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.35.0"
software: miniserve
display: "miniserve"
description: "For when you really just want to serve some files over HTTP right now! — 轻量 HTTP 文件服务器（Rust）"
category: network
homepage: "https://github.com/svenstaro/miniserve"
license: MIT
build_system: cargo

source:
  url: "https://static.crates.io/crates/miniserve/miniserve-0.35.0.crate"
  sha256: "f1b4d21e72ebf1a464a623a73e3be821bd29a52e5a99a235401b67f19b20702e"
  tar_format: tar.gz

ohos_adaptation:
  key_points:
    - "纯 Rust 应用，cargo 构建；rustc host 即 aarch64-unknown-linux-ohos，无需显式 --target"
    - "C 依赖（zstd-sys 等，经 actix-web compress-zstd）需 cc-rs：CC/AR 指向 OHOS clang/llvm-ar"
    - "rustc 默认 linker 'cc' 在 OHOS 不存在，须设置 CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER=OHOS clang"
    - "OHOS ELF 必须签名（binary-sign-tool -selfSign 1），否则运行报 Operation not permitted"
    - "cargo 向上找源码 Cargo.toml，target 产物落在 source_folder；package() 需同时检查两处"
  common_dependencies: []

versions: {}

status: published
build_date: "2026-08-09"
published_as: miniserve
