# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: miniserve/0.35.0
homepage: "https://github.com/svenstaro/miniserve"

# 上游测试命令: cargo test（tests/ 目录含 api/archive/auth/webdav 等 20 个集成测试文件）
# 本环境为 OHOS 真机，cargo test 可直接运行（rustc host = aarch64-unknown-linux-ohos），
# 测试结果记录于 reports/test-report.md。
upstream_check_command: "cargo test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - name: cargo test
    description: "miniserve 上游 cargo 集成测试（api/archive/auth/auth_file/bind/cli/create_directories/header/navigation/paste/qrcode/raw/readme/rm_files/serve_request/tls/upload_files/webdav）"
    command: "cargo test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 miniserve --version 验证二进制可执行且版本正确"
    command: "miniserve --version"
  - file: test.sh
    description: "启动 miniserve 服务真实目录，用 curl 抓取文件验证 HTTP 功能"
    command: "miniserve <dir> --port 18765 + curl http://127.0.0.1:18765/hello.txt"

# 测试断言总数
assertion_count: 3
