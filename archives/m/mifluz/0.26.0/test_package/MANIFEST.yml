# test_package/MANIFEST.yml — mifluz 0.26.0
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制）
#
# 上游测试口径（四维账本）：
#   N_static = 15 —— 上游注册于 autotools TESTS 变量的自动化测试：
#   test/ 13 项（t_wordkey t_wordlist t_wordskip t_cmpr t_htdb t_rdonly
#   t_trunc t_dict t_dead t_delete t_cache t_largefile t_env）+
#   search/ t_search 1 项 + examples/ t_example 1 项。
#
#   实测执行结果（真机，详见 notes.md 与 build() 日志）：
#   - test/ 13 项独立运行全部通过（t_cache/t_largefile/t_env 因磁盘空间
#     类前置在部分轮次被上游脚本自身跳过，常规轮次 10 项全 PASS）
#   - search/ t_search 与 examples/ t_example 失败：其测试驱动
#     mifluzsearch 在 HMDFS FUSE 层拒绝 getcwd() 的时间窗内启动即
#     Signal 11（WordKeyInfo 初始化路径崩溃），健康窗口亦无法从
#     构建树稳定执行（shell 层 getcwd "Not supported" 诊断同期出现，
#     osip conan create 同故障窗内复现，证据链见 notes.md）
#
#   新增消费者测试 1 个：test_mifluz（C++，WordContext/WordList 建库、
#   插入、FindWord 检索并断言命中数）。

package: mifluz/0.26.0
homepage: "https://www.gnu.org/software/mifluz/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check -k MAKEINFO=true"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/
    source: mifluz-0.26.0/test/
    description: "上游核心套件：t_wordkey/t_wordlist/t_wordskip/t_cmpr/t_htdb/t_rdonly/t_trunc/t_dict/t_dead/t_delete 等，真机全部通过"
    command: "make check -C test (10-13 项全 PASS)"
  - file: search/t_search
    source: mifluz-0.26.0/search/t_search
    description: "上游检索测试（依赖 mifluzsearch 驱动）——失败，见失败说明"
    command: "make check -C search (FAIL: mifluzsearch 启动即段错误，HMDFS getcwd 故障)"
  - file: examples/t_example
    source: mifluz-0.26.0/examples/t_example
    description: "上游示例测试（同依赖 mifluzsearch）——失败，见失败说明"
    command: "make check -C examples (FAIL: 同上)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 以 libmifluz 使用者身份建倒排索引、插入词引用并 FindWord 检索断言命中"
    command: "./test_mifluz"

# 测试断言总数 (近似值: 上游 13-15 项套件断言 + 消费者 open/insert/find/匹配数 4 项)
assertion_count: 19
