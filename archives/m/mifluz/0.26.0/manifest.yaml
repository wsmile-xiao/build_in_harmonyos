knowledge_gained:
  - "老版 configure（2001）的 AC_TRY_RUN 在交叉编译下报 cannot run test program：以 aarch64 事实值预设 db_cv_uint8/uint16/int16/uint32/int32/align_t/alignp_t/mutex 缓存变量（Conan Environment 注入 conanbuild）"
  - "HMDFS FUSE getcwd 拒绝窗内 configure 的 ac_pwd 与 ls -di . 双检查都会失败：运行时补丁回退 $PWD（aldo/0.7.8 同模式），根治需等窗口"
  - "clang 15 将 case NOTOK(-1) 对 unsigned switch 的收窄、char 字面量中的多字节 UTF-8 字符判为 error（gcc 时代仅警告）：分别以显式转换与十六进制转义修复"
  - "mifluz 无 TESTS 之外的测试入口；t_cache/t_largefile/t_env 为上游 LONG=yes 默认 SKIP 的长测设计"

