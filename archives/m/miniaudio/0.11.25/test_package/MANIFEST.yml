package: miniaudio/0.11.25
homepage: "https://github.com/mackron/miniaudio"

upstream_check_command: "cmake -DMINIAUDIO_BUILD_TESTS=ON .. && ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j4 -R 'conversion|generation|filtering'"

upstream_tests:
  - file: tests/conversion/conversion.c
    source: miniaudio-0.11.25/tests/conversion/conversion.c
    targets: ["miniaudio_conversion"]
    result: "PASS (compiled + run) — MA_NO_THREADING + MA_NO_DEVICE_IO, data converter / resampling correctness"
  - file: tests/generation/generation.c
    source: miniaudio-0.11.25/tests/generation/generation.c
    targets: ["miniaudio_generation"]
    result: "PASS (compiled + run) — MA_NO_DEVICE_IO, noise + waveform generation + WAV encoding"
  - file: tests/filtering/filtering.c
    source: miniaudio-0.11.25/tests/filtering/filtering.c
    targets: ["miniaudio_filtering"]
    result: "PASS (compiled + run) — decodes data/16-44100-stereo.flac, runs bpf/hpf/lpf/notch/peak/shelf/dithering filters"
  - file: tests/deviceio/deviceio.c
    source: miniaudio-0.11.25/tests/deviceio/deviceio.c
    targets: ["miniaudio_deviceio"]
    result: "SKIP execution — opens real audio devices (playback/capture/loopback); OHOS build host has no audio hardware. Compiled successfully with real OHOS clang."
    reason: "environment limitation — no audio device on build host"
  - file: tests/cpp/cpp.cpp
    source: miniaudio-0.11.25/tests/cpp/cpp.cpp
    targets: ["miniaudio_cpp"]
    result: "SKIP execution — #includes ../deviceio/deviceio.c, requires real audio device. Compiled successfully with real OHOS clang."
    reason: "environment limitation — no audio device on build host"

test_package_tests:
  - file: test_miniaudio.c
    description: "Consumer test: in-memory WAV decode (frame count + ramp scaling), decoder output config (format/channels/rate), s16→f32 data converter (value 0.5), sine waveform generation (non-zero), white noise generation (non-zero), MA_SUCCESS==0 — 6 assertion groups."
    command: "./test_miniaudio"

assertion_count: 6
