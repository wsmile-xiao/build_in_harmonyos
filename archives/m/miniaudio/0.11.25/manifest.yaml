software: miniaudio
version: "0.11.25"
build_system: cmake
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mackron/miniaudio/archive/refs/tags/0.11.25.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DMINIAUDIO_BUILD_EXAMPLES=OFF"
    - "-DMINIAUDIO_BUILD_TESTS=OFF"
    - "-DMINIAUDIO_BUILD_TOOLS=OFF"
    - "-DMINIAUDIO_NO_ALSA=ON"
    - "-DMINIAUDIO_NO_PULSEAUDIO=ON"
    - "-DMINIAUDIO_NO_JACK=ON"
    - "-DMINIAUDIO_NO_SNDIO=ON"
    - "-DMINIAUDIO_NO_OSS=ON"
    - "-DMINIAUDIO_NO_AAUDIO=ON"
    - "-DMINIAUDIO_NO_OPENSL=ON"
    - "-DMINIAUDIO_NO_COREAUDIO=ON"
    - "-DMINIAUDIO_NO_DSOUND=ON"
    - "-DMINIAUDIO_NO_WASAPI=ON"
    - "-DMINIAUDIO_NO_WINMM=ON"
    - "-DMINIAUDIO_NO_AUDIO4=ON"
    - "-DMINIAUDIO_NO_WEBAUDIO=ON"
    - "-DMINIAUDIO_NO_CUSTOM=ON"
  # OHOS 无 ALSA/PulseAudio/JACK 等音频后端，仅使用 null 后端
  # miniaudio 是 header-only 库，提供 miniaudio.h 和静态库 libminiaudio.a

  # 编译依赖列表（格式: name/version）
  dependencies:
    - vorbisfile/1.3.7
  # vorbisfile 在 OHOS 上可用（静态库），但 pkg-config 不可用

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "miniaudio 是 header-only 单头文件音频库，使用 CMake 构建系统"
  - "OHOS 无 ALSA/PulseAudio/JACK/OSS 等音频后端，需禁用所有真实后端，仅保留 null 后端"
  - "CMake 在 OHOS 上检测为未知系统但仍可正常构建"
  - "编译验证需使用 MA_NO_LIBVORBIS + MA_NO_LIBOPUS 避免运行时链接问题"
  - "null 后端可在 OHOS 上正常初始化上下文和设备枚举"
