# miniaudio 0.11.25 编译档案
software: miniaudio
version: "0.11.25"
status: built
build_system: header-only
compile_date: 2026-08-26

dependencies:
  required: []
  optional: []

build_config:
  target: aarch64-linux-ohos
  configure_options: []
  cflags: "-fPIC -O2"
  env:
    CC: clang
    CXX: clang++

patches_applied: []

compatibility:
  level: high
  issues: []
  notes: |
    - single-header 库，miniaudio.h (~4.1 MB)，零外部依赖（仅 libc/libm/libpthread）
    - 消费者 #include "miniaudio/miniaudio.h" 并在一个 TU 中定义 MINIAUDIO_IMPLEMENTATION
    - 不产出 lib/ 制品；package_type=header-library，package_id 清理为 header-only
    - clang 15 (OHOS profile) 完全兼容
    - 上游 CMake 选项 MINIAUDIO_BUILD_TESTS=ON 注册 5 个 ctest 目标

test_results:
  type: upstream-ctest
  upstream:
    source_files: 5
    registered_targets: 5
    executed: 3
    passed: 3
    failed: 0
    skipped: 2
    skip_reason: "deviceio / cpp 打开真实音频设备（playback/capture/loopback），OHOS 构建主机无音频硬件；两者仍经真实 OHOS clang 编译通过，仅跳过执行。conversion/generation/filtering 为设备无关测试（MA_NO_DEVICE_IO），真实编译并执行通过。"
  consumer:
    test_program: 1
    assertions: 6
    passed: 6
    failed: 0
  note: "上游 ctest 3/3 设备无关测试真实执行通过；deviceio/cpp 编译通过但执行跳过（无音频硬件）；消费者 6/6 断言通过"

knowledge_gained:
  - "miniaudio 是 single-header C 音频库，package_type=header-library，零运行时依赖"
  - "miniaudio.h 安装到 include/miniaudio/miniaudio.h（上游 CMake install(FILES miniaudio.h DESTINATION .../miniaudio)）"
  - "上游 v0.11.25 tag 源码 sha256=b900edcffe979816e2560a0580b9b1216d674b4f17fbadeca8f777a7f8ab0274"
  - "上游 tests/ 由 tests/common/common.c 实现的轻量测试框架驱动（ma_register_test/ma_run_tests）"
  - "CMake 选项 MINIAUDIO_BUILD_TESTS=ON 注册 5 个 ctest 目标：conversion/generation/filtering（设备无关）、deviceio/cpp（需真实音频设备）"
  - "License：Unlicense OR MIT-0（双许可，任选其一）"
  - "0.11.25 新增 miniaudio.c（MINIAUDIO_IMPLEMENTATION 的薄包装），为 0.12 的 .c/.h 拆分做准备"

references:
  - https://github.com/mackron/miniaudio
  - https://github.com/mackron/miniaudio/releases/tag/0.11.25
  - https://miniaud.io
