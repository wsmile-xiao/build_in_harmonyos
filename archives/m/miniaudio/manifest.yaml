software: miniaudio
display: "miniaudio"
description: "A single-file audio playback and capture library"
category: system
homepage: "https://miniaud.io"
license: Unlicense OR MIT-0
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS 无 ALSA/PulseAudio/JACK/OSS 等音频后端，需禁用所有真实后端（MINIAUDIO_NO_*）"
    - "仅保留 null 后端用于编译验证"
    - "miniaudio 是 header-only 单头文件库，主要交付 miniaudio.h"
    - "编译时需使用 MA_NO_LIBVORBIS 和 MA_NO_LIBOPUS 避免链接问题"
  common_dependencies:
    - vorbisfile

versions:
  "0.11.25":
    status: built
    build_date: "2026-05-29"