# test_package/MANIFEST.yml — mustang 3.2.4
# 上游官方测试声明文件（CI L0e 强制要求此文件存在）
#
# R51 三步法清点结论（详见版本级 notes.md）：
# 上游无自动化测试套件——Makefile 目标仅 all/clean/remove（无 check/test）、
# 无 tests/ 目录、无 ctest/pytest 注册。上游 README 记载的唯一验证手段是
# 手工冒烟（-f data/test/test_zf-CCHH），适配中已在本机执行通过（RC=0，
# 产出 results.html + results.pdb，2026-09-25）。

package: mustang/3.2.4
homepage: "http://lcb.infotech.monash.edu.au/mustang"

# 上游测试命令分析：Makefile 无 check 目标，无可列测试
upstream_check_command: "none (Makefile has no check/test target)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试：无自动化测试；README 手工冒烟已执行并留证
upstream_tests:
  - file: "README-documented manual smoke (not an automated suite)"
    source: "mustang-3.2.4/data/test/test_zf-CCHH"
    description: "README 手工冒烟：比对 15 个 zf-CCHH PDB 结构，产出 results.html/results.pdb；适配中已实机执行通过"
    command: "./bin/mustang-3.2.4 -f ./data/test/test_zf-CCHH"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "mustang 冒烟：--help 横幅断言 + 两个合成 20 残基聚丙氨酸螺旋真实比对，断言退出码与 FASTA 输出特征"
    command: "bash test.sh"

# 测试断言总数（近似值）
# test.sh 内 4 处断言：banner grep、t.afasta 非空、>a.pdb 标签、20 残基序列
assertion_count: 4
