# 软件级 manifest — mdocml
# 别名披露：mdocml 是 mandoc 的旧名（上游 tarball INSTALL:5 原文
#   "The mandoc manpage compiler toolset (formerly called "mdocml")"）。
#   仓库另有历史归档 archives/m/mandoc/1.14.6（旧式：仅 manifest/notes/补丁，
#   缺 conanfile/conandata/test_package/commands.json），本包是同软件的
#   首个完整 Conan 配方；两目录并存属任务卡名与历史归档名的冗余。

software: mdocml
display: "mandoc (mdocml)"
description: "man page 编译器工具集（原名 mandoc/mdocml）：渲染 mdoc(7)/man(7)/roff(7) 手册页，提供 mandoc、man、apropos、whatis、makewhatis、demandoc、soelim 与静态库 libmandoc"
category: doc
homepage: "https://mandoc.bsd.lv/"
license: ISC
build_system: custom-configure
type: tool-and-library

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "手写 sh configure（非 autoconf）：不 autoreconf，无 config.guess/config.sub，零陈旧三件套族风险"
    - "上游默认 CC=\"cc\"，设备与 CI worker 只有 clang → 必须在 configure.local 显式给 CC/AR（否则全部探测 compilation failed + FATAL: no endian conversion functions）"
    - "HMDFS 不支持硬链接 → configure.local 给 LN=\"cp -f\"；值必须加引号，裸 LN=cp -f 被 shell 解析成前缀赋值 + 执行 -f → configure rc=127"
    - "设备无 locale 命令 → configure 的 locale -a 取不到 UTF-8 locale → HAVE_WCHAR=0 → regress 19 个 utf8:diff 失败；手工 UTF8_LOCALE=\"en_US.UTF-8\" 后清零"
    - "设备无 install 命令 → 不走 make install，package() 直接收纳产物"
    - "STATIC=\" \"（官方 configure.local.example 置空写法）规避 -static 链接风险"
  common_dependencies:
    - zlib

# 版本索引（所有已归档版本，含状态）
versions:
  "1.14.6":
    status: built
    build_date: "2026-09-24"
    conan_ref: "mdocml/1.14.6"
