# 版本级 manifest — mdocml 1.14.6

version: "1.14.6"
software: mdocml
status: built
build_date: "2026-09-24"
conan_ref: "mdocml/1.14.6"

# 别名同源披露：本包（mdocml）与历史归档 archives/m/mandoc/1.14.6 是
# 同一上游软件（tarball INSTALL:5 原文 "…formerly called "mdocml""），
# 两者 source.url 与 sha256 逐字同值；该旧归档缺配方四件套，
# 本包是同软件首个完整 Conan 配方。
alias_of: mandoc
same_source_as: "archives/m/mandoc/1.14.6"

source:
  url: "https://mandoc.bsd.lv/snapshots/mandoc-1.14.6.tar.gz"
  sha256: "8bf0d570f01e70a6e124884088870cbed7537f36328d512909eb10cd53179d9c"
  tar_format: tar.gz

build:
  system: custom-configure
  configure_options:
    - "-o CC=<profile tools.build:compiler_executables.c>（设备/CI 无 cc，上游默认 CC=cc 全探测失败）"
    - "-o AR=<profile ar>（llvm-ar 绝对路径）"
    - "-o LN=\"cp -f\"（HMDFS 无硬链接；值必须加引号，裸 LN=cp -f → rc=127）"
    - "-o STATIC=\" \"（官方 example 置空写法，规避 -static 链接风险）"
    - "-o UTF8_LOCALE=\"en_US.UTF-8\"（设备无 locale 命令 → 否则 HAVE_WCHAR=0、regress 19 utf8:diff 失败）"
    - "-o CFLAGS=\"-O3 -pipe -DNDEBUG -I<conan zlib>/include\"（R33 钉死防泄漏 + zlib 头显式注入）"
    - "-o LDFLAGS=\"-L<conan zlib>/lib\"（zlib 库显式注入，不依赖 SDK sysroot 隐式可见）"
  configure_note: "手写 sh configure（非 autoconf），变量经 configure.local 注入 → 生成 config.h + Makefile.local；不 autoreconf、无 config.guess/config.sub"
  dependencies:
    - "zlib/1.3.1（read.c 无条件 #include <zlib.h>；configure:433 把 -lz 硬编码进 LDADD；制品仓在架，conan list -r=ohpcd 命中 7 版本）"
  tool_requires: []
  cc: clang
  cxx: ""

patches_applied: []

# 上游测试账本（四维，与 PR 正文 / notes / result 同源）
tests:
  upstream_static_total: 1427
  upstream_executed: 1427
  upstream_skipped: 0
  consumer_programs: 1
  consumer_assertions: 6

knowledge_gained:
  - "设备与 CI worker PATH 有 clang 无 cc，手写 configure 的默认 CC=cc 会让全部特性探测 compilation failed 并以 FATAL: no endian conversion functions 硬失败；CC/AR 必须从 profile tools.build:compiler_executables 取（R33 不读 shell 环境变量） # knowledge_ref: E697"
  - "设备无 locale 命令 → configure 的 locale -a 取不到 UTF-8 locale → HAVE_WCHAR=0 → 上游 regress 的 utf8:diff 成批失败（mandoc 19 例）；实测 setlocale(LC_CTYPE,\"en_US.UTF-8\") 可用，configure.local 手工 UTF8_LOCALE 即清零，属环境缺口非代码缺陷 # knowledge_ref: E697"
  - "configure.local 里带空格的值必须加引号：裸 LN=cp -f 被 shell 解析成前缀赋值 + 执行 -f → configure rc=127（本任务实测）；同一注入面还承载 HMDFS 硬链接替代与 CFLAGS/LDFLAGS 依赖路径 # knowledge_ref: E697"
  - "上游测试集与期望文件数不等时须逐项归因差额（rule4 防线）：mandoc out_lint 249 vs run 248 的差 1 = mdoc/Xr/args 的 LINT_TARGETS 位于 regress.pl parse_makefile 的 last if /^# OpenBSD only/ 边界之后被有意不注册；out_utf8 26 vs run 21 的差 5 = char/unicode Makefile 的 UTF8_TARGETS 只注册 5 项 # knowledge_ref: E699"

quality_gates:
  conan_verify: pending
  G0_pre_build_risk: pending
  G1_recipe_integrity: pending
  G2_conan_create: pending
  G3_system_lib_isolation: pending
  G4_artifact_integrity: pending
