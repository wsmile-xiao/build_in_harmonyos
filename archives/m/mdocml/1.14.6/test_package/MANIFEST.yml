# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
# 详见 docs/TEST_QUALITY_SPEC.md §4.3

package: mdocml/1.14.6
homepage: "https://mandoc.bsd.lv/"

# 上游测试命令（手写 configure 的 Makefile 目标；上游没有 autotools 式 make check）
upstream_check_command: "make regress"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make regress  (→ cd regress && ./regress.pl; perl 5.42.0 @ /data/service/hnp/bin/perl)"

# 上游实际运行的测试程序
# 计数口径（§3.5 两栏，2026-09-24 设备实测）：
#   输入 .in 572 + .inc 6
#   期望输出 .out_* 1189 = ascii565 + markdown253 + lint249 + html68 + tag28 + utf826
#   实跑 tests run 1427 = ascii565 + tag28 + man244 + utf821 + html68 + markdown253 + lint248
#   failed 0 / skipped 0 / not_run 0（约 89 秒）
# 期望文件 vs 实跑差额逐项归因见 notes.md「上游测试」节。
upstream_tests:
  - file: regress/regress.pl
    source: mdocml-1.14.6/regress/regress.pl
    description: "上游唯一测试驱动：ascii(565) + tag(28) + man 二次回读(244) + utf8(21) + html(68) + markdown(253) + lint(248) = 1427 tests run，0 failed"
    command: "make regress"

# test_package 中自带的测试（消费者视角验证，不进上游分母）
test_package_tests:
  - file: test_mdocml.c
    description: "消费者 C API 测试：直编并链接交付的 libmandoc.a + 传递 zlib，覆盖 mchars 字符表（num2uc/uc2str/spec2cp/spec2str 4 项）、mandoc_escape 转义解析与指针推进契约（2 项）、unicode 映射命中（1 项）——共 7 项断言"
    command: "./test_mdocml"
  - file: test_bins.sh
    description: "消费者可执行件测试：跑已安装 bin/ 的 mandoc 渲染（退出码、NAME 行、\\fB 粗体展开、页眉页脚 4 项）、man/apropos/whatis/makewhatis 四别名与 mandoc 字节等同（上游 $(LN) mandoc <alias> 语义，本平台 LN=cp -f，1 项）、demandoc 宏展开（1 项）、soelim .so 展开与正文（2 项）、交付面 libmandoc.a 与对外 8 头（2 项）——共 10 项断言"
    command: "bash test_bins.sh <package>/bin"

# 消费者断言总数（实测, rule 12「鸿蒙特有测试」行取值）
# = 7 (C API) + 10 (可执行件/交付面) = 17；不进上游 1427 分母
assertion_count: 17
