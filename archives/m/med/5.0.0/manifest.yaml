software: med
version: "5.0.0"
build_system: cmake
status: built
source:
  url: "https://files.salome-platform.org/Salome/medfile/med-5.0.0.tar.bz2"
  sha256: "267e76d0c67ec51c10e3199484ec1508baa8d5ed845c628adf660529dce7a3d4"
knowledge_gained:
  - "MED-fichier 5.0.0 is a CMake project; PROJECT(MEDFile C CXX), Fortran is OPTIONAL (CHECK_LANGUAGE + ENABLE_LANGUAGE guarded), so the OHOS NDK without gfortran still builds the C/C++ libmedC."
  - "MED_FILE_BUILD_PYTHON default OFF; SWIG/Python/Tk bindings not needed for the C/C++ library."
  - "MED's custom HDF5 finder (config/cmake_files/FindMedfileHDF5.cmake) keys off HDF5_ROOT_DIR and looks for <dir>/share/cmake/hdf5/hdf5-config.cmake; passing -DHDF5_ROOT_DIR=<hdf5 package folder> works because the Conan hdf5 package installs that config, and the standard module-mode fallback also resolves <dir>/lib+include."
  - "MED_FIND_HDF5 hard-gates HDF5 MINOR==12; patched to also accept 1.14 (repo provides hdf5/1.14.6). HDF5 1.14 still honours -DH5_USE_16_API used by MED."
  - "Only libmedC (the C/C++ API library) is produced on OHOS; libmed/libmedfwrap (Fortran wrappers) require a Fortran toolchain not present in the OHOS NDK."
  - "Salome source host returns HTTP 403 to non-browser UAs; source() passes a browser User-Agent (CI uses its own mirror fallback for the same URL)."
