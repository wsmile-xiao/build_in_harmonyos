sources:
  # Official upstream release tarball (MED-fichier / Salome platform).
  # CI adds a mirror fallback automatically; the recipe's source() supplies a
  # browser User-Agent because the Salome host returns 403 to non-browser UAs.
  url: https://files.salome-platform.org/Salome/medfile/med-5.0.0.tar.bz2
  sha256: 267e76d0c67ec51c10e3199484ec1508baa8d5ed845c628adf660529dce7a3d4
  # Filename is inferred; upstream tarball top dir is "med-5.0.0".

patches:
  # Relax MED 5.0.0's hard-coded HDF5 gate (only accepts 1.12.x) so it also
  # accepts the 1.14.x line provided by the HarmonyOS PC dependency set.
  # MED only uses the stable 1.6/1.8 API via -DH5_USE_16_API, so 1.14 is fine.
  - patch_file: "patches/0001-relax-hdf5-version-gate-for-1.14.patch"
    base_path: "."
  # Conan/OHOS HDF5 detection fixes (single combined patch on FindMedfileHDF5.cmake):
  #  - CMakeDeps emits a lowercase hdf5-config.cmake (hdf5_INCLUDE_DIR*) while MED's
  #    finder reads the legacy uppercase HDF5_INCLUDE_DIR -> HDF5_INCLUDE_DIRS ended
  #    up empty, so the HDF5 public headers could not be located. Add fallbacks
  #    (lowercase var, then HDF5_ROOT_DIR/include).
  #  - CMakeDeps only exposes the aggregate target hdf5::hdf5 (no -shared/-static
  #    suffixed variants), but MED links against hdf5::hdf5-shared. Fall back to
  #    hdf5::hdf5 when the suffixed target is absent.
  - patch_file: "patches/0002-fix-hdf5-detection-on-ohos.patch"
    base_path: "."
  # MED source ships hard `#if H5_VERS_MINOR > 12` / `#error` guards that remind
  # the developer to revisit the HDF5 internal-model compatibility when HDF5's minor
  # version advances past 12. On the HarmonyOS PC dependency set we build against
  # HDF5 1.14.x (minor 14), which is still fine (MED freezes the internal HDF model
  # via H5Pset_libver_bounds to V112). Relax the guards from >12 to >14 so 1.14.x
  # builds, while keeping the reminder for any future minor > 14.
  - patch_file: "patches/0003-relax-hdf5-minor-guards.patch"
    base_path: "."
  # Allow building shared AND static libraries simultaneously. The OHOS loader
  # cannot dlopen user-path shared objects for a non-HAP process, so the upstream
  # C test executables are linked against the static lib (libmedC.a + hdf5.a +
  # szip/aec .a) and run natively; the shared lib is still shipped for consumers.
  - patch_file: "patches/0004-allow-shared-and-static.patch"
    base_path: "."
