# test_package/MANIFEST.yml
# mt-st 1.8 - upstream test declaration.

package: mt-st/1.8
homepage: "https://github.com/iustin/mt-st"

upstream_tests_exist: true
upstream_test_audit: >-
  Upstream ships tests/*.test (shelltestrunner format 1, 31 cases) driven by the
  Makefile `check` target: `shelltest -DVERSION=1.8 tests`.
upstream_check_command: "make check  # shelltest -DVERSION=1.8 tests"
upstream_test_in_build: true
upstream_test_command: >-
  python run_upstream_tests.py --cwd <src> --dir tests --macro VERSION=1.8
  (embedded shelltestrunner format-1 compatible runner; shelltest itself is a
  Haskell program unavailable on OHOS and on the CI worker)

upstream_tests:
  - file: tests/basic.test
    source: mt-st-1.8/tests/basic.test
    description: "mt/stinit --version and -h banners (5 cases)"
    command: "shelltest -DVERSION=1.8 tests"
  - file: tests/mt-cli.test
    source: mt-st-1.8/tests/mt-cli.test
    description: "mt argument parsing / command lookup / densities (7 cases)"
    command: "shelltest -DVERSION=1.8 tests"
  - file: tests/mt-errors.test
    source: mt-st-1.8/tests/mt-errors.test
    description: "mt device and ioctl error paths (4 cases)"
    command: "shelltest -DVERSION=1.8 tests"
  - file: tests/stinit-errors.test
    source: mt-st-1.8/tests/stinit-errors.test
    description: "stinit database/argument error handling (9 cases)"
    command: "shelltest -DVERSION=1.8 tests"
  - file: tests/stinit-parsing.test
    source: mt-st-1.8/tests/stinit-parsing.test
    description: "stinit definition-file parsing (6 cases)"
    command: "shelltest -DVERSION=1.8 tests"

test_package_tests:
  - file: test_mt_st.sh
    description: "installed mt/stinit consumer checks (version, help, densities, parsing, errors)"
    command: "sh test_mt_st.sh"

test_files:
  - path: "test_package/test_mt_st.sh"
    test_type: "R34"
    assertion_count: 8

test_package_test_count: 1
consumer_assertion_count: 8
upstream_test_cases: 31
assertion_count: 39
