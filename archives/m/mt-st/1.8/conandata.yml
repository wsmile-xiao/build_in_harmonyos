patches:
  - patch_file: "patches/0001-tests-accept-ohos-enotty-text.patch"
    patch_description: "tests/mt-errors.test asserts the glibc text for ENOTTY ('Inappropriate ioctl for device'). OHOS libc reports the same errno with the text 'Not a tty', so this single upstream expectation is widened to accept either message. The test intent (status on /dev/null fails with ENOTTY and exit code 2) is unchanged."
    patch_type: "platform"
