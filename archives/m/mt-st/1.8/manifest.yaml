  - "OHOS sysroot 已提供 <linux/major.h> 与 <scsi/sg.h>，老式 Linux 磁带控制工具无需再补内核头文件"
  - "上游 make check 依赖 shelltestrunner（shelltest，Haskell 实现），OHOS 与 CI worker 均没有；可用内嵌的 format-1 兼容运行器直接执行上游同一批 tests/*.test 定义（含 -D 宏替换）"
  - "OHOS libc 对 ENOTTY 的 strerror 文案是 'Not a tty'，glibc 是 'Inappropriate ioctl for device'；断言 glibc 文案的上游测试需放宽为平台容忍匹配"
