software: mt-st
display: "mt-st"
description: "Linux SCSI 磁带驱动控制工具集（mt 磁带控制、stinit 磁带模式初始化）"
category: utility
homepage: "https://github.com/iustin/mt-st"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure；CC 由 Conan 构建环境注入"
    - "OHOS sysroot 已提供 <linux/major.h>、<scsi/sg.h>、<sys/sysmacros.h> 等头文件，源码无需改动"
    - "上游 make check 依赖 shelltestrunner（Haskell），OHOS 与 CI 均不可用；改用内嵌的 format-1 兼容运行器执行同一批 tests/*.test"
    - "OHOS libc 的 ENOTTY 文案（'Not a tty'）与 glibc（'Inappropriate ioctl for device'）不同，断言具体 errno 文案的上游用例需放宽匹配"
  common_dependencies: []

versions:
  - version: "1.8"
    status: built
    build_date: "2026-09-23"
