# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: minimp3/0.0-git.ea99364
homepage: "https://github.com/lieff/minimp3"

# 上游测试命令 (上游无构建系统, .travis.yml → scripts/build.sh → gcc + scripts/*.sh)
upstream_check_command: "gcc -O2 -std=c89 -o minimp3 minimp3_test.c -lm && ./minimp3 -t vectors/l3-si.bit && for i in vectors/*.bit; do ./minimp3 $i ${i%.*}.pcm; done"

# conanfile.py build() 方法中是否已集成上游测试 (ctest 全量执行)
upstream_test_in_build: true
upstream_test_command: "cmake.test() → ctest (86 tests: 1 selftest + 83 reference vectors + 2 mode samples)"

# 上游实际运行的测试程序 (minimp3_test.c 原样编译, 未修改一行)
upstream_tests:
  - file: minimp3_test.c
    source: "https://github.com/lieff/minimp3/archive/refs/heads/master.tar.gz (master @ ea99364f61c14656440e8d77e9c233ccf3124633)/minimp3_test.c"
    description: "上游测试驱动: -t 自检模式 (72 条 API 契约断言 + 全向量 PSNR 扫描) + 83 个参考向量解码比对 (scripts/test.sh 语义) + 模式抽样 (scripts/test_mode.sh 语义)"
    command: "./minimp3_upstream_test -t vectors/l3-si.bit ; ./minimp3_upstream_test vectors/<name>.bit vectors/<name>.pcm ; ./minimp3_upstream_test -m 3 -s 0 -p 0 vectors/l1-fl1.bit vectors/l1-fl1.pcm ; ./minimp3_upstream_test -m 6 -s -1 -p -1 vectors/l2-test32.bit vectors/l2-test32.pcm"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者断言套件: 合成 MPEG1 L3 静音帧的帧头解析/单帧解码/截断帧处理/detect-load 契约/ex 流式 API/参数错误契约 (24 条断言, 全部锚点经 OHOS aarch64 实测校准)"
    command: "./test_minimp3"

# 测试断言总数 (近似值, 用于质量评估)
# 72 (上游 selftest ASSERT) + 24 (test_package CHECK)
assertion_count: 96
