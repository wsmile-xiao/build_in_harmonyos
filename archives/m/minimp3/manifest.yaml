    - "MINIMP3_IMPLEMENTATION 宏激活 minimp3.h + minimp3_ex.h 的实现段，消费者无需定义该宏"
    - "纯 C 零第三方依赖（仅 libc/libm），OHOS aarch64 musl 交叉编译零补丁通过"
    - "上游测试驱动 minimp3_test.c 原样编译（-std=c99 语义），83 个参考向量 + 72 断言自检全量 CTest 化真跑"
  common_dependencies: []

