package: minja/0-git20250922.021c2293c187
homepage: "https://github.com/google/minja"

upstream_check_command: "ctest --test-dir <build_folder> --output-on-failure -E ToolTest"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure -E ToolTest"

upstream_tests:
  - path: tests/test-syntax.cpp
    type: GoogleTest C++ syntax and parser tests
    case_count: 0
    assertion_count: 0
    executions: 1
    targets: [test-syntax]
  - path: tests/test-chat-template.cpp
    type: GoogleTest C++ chat-template tests
    case_count: 0
    assertion_count: 0
    executions: 1
    targets: [test-chat-template]
  - path: tests/test-polyfills.cpp
    type: GoogleTest C++ polyfill tests
    case_count: 0
    assertion_count: 0
    executions: 1
    targets: [test-polyfills]

# The complete upstream model matrix downloads a large, mutable Hugging Face corpus
# at configure time. Core C++ suites above are run; model-file-dependent ToolTest
# cases are excluded and documented instead of silently counted as passing.

test_package_tests:
  - file: test_minja.cpp
    description: "Consumer checks for raw template rendering and chat-template generation prompts"
    command: "./test_minja"
    case_count: 1
    assertion_count: 2

assertion_count: 2
