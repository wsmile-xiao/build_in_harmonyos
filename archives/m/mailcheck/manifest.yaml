name: mailcheck
software: mailcheck
display: "mailcheck"
description: "Check multiple mailboxes and/or Maildirs for new mail"
category: mail
homepage: "https://mailcheck.sourceforge.net/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Plain Makefile build, no configure step needed — pass CC override only."
    - "Uses standard POSIX headers (stdio, socket, netdb, dirent) available on OHOS."
    - "Upstream ships no test suite; package-level supplementary test creates a real mbox and verifies output."
  common_dependencies: []

versions:
  "1.91.2":
    status: built
    build_date: "2026-08-30"
    conan_ref: "mailcheck/1.91.2"
    source_url: "https://downloads.sourceforge.net/project/mailcheck/mailcheck/1.91.2/mailcheck_1.91.2.tar.gz"
