# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mailcheck/1.91.2
homepage: "https://mailcheck.sourceforge.net/"

# 上游测试命令
# mailcheck 1.91.2 发布 tarball 不含任何测试套件：
# Makefile 仅定义 all/debug/mailcheck/install/distclean/clean 目标（无 check/test），
# 无 tests/ 目录、无 configure 脚本、无 CI 配置。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，包级补充测试，非上游测试)
test_package_tests:
  - file: test_mailcheck.py
    description: "创建真实 mbox 文件和 .mailcheckrc，运行 mailcheck，验证输出含 'mail in' 和 mbox 路径"
    command: "python3 test_mailcheck.py <mailcheck_binary>"

# 测试断言总数
assertion_count: 3
