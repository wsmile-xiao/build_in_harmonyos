sources:
  url: "https://pub.mate-desktop.org/releases/1.26/marco-1.26.2.tar.xz"
  sha256: "12f1a254fe1072f0304884711e089a5682780a011593402ed38de6b9480e07a3"

patches:
  - patch_file: "patches/0001-gdk-x11-compat.patch"
    patch_description: "Add the standalone GDK-X11 compatibility layer (gdk/gdkx.h + single X connection, XID mapping, error traps, X event filter dispatch) required because the published GTK 3 build uses the broadway backend only"
    patch_type: "portability"
  - patch_file: "patches/0002-canberra-gtk3-shim.patch"
    patch_description: "Add a libcanberra-gtk3 compatible header providing ca_gtk_context_get() on top of the published libcanberra without the gtk3 module"
    patch_type: "portability"
  - patch_file: "patches/0003-config-guess-sub.patch"
    patch_description: "Teach config.guess/config.sub the HarmonyOS/aarch64-linux-ohos triplet (the shipped 2023 copies cannot run the compiler probe: OHOS refuses to exec the unsigned probe binary)"
    patch_type: "portability"
  - patch_file: "patches/0004-zenity-optional.patch"
    patch_description: "Make the zenity existence check non-fatal: zenity is a runtime-optional dialog helper (looked up by name in src/core/util.c) and is not published in the OHPCD registry"
    patch_type: "portability"
  - patch_file: "patches/0005-cairo-xlib-compat.patch"
    patch_description: "Add a Cairo-Xlib compatibility layer (XGetImage backed cairo image surfaces) because the published cairo is built with xlib=disabled while the window frame renderer and the xrender compositor need cairo_xlib_surface_*"
    patch_type: "portability"
