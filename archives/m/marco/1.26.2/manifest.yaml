# 版本级 manifest — marco 1.26.2
# 遵循 ARCHIVE-SPEC v2.0

version: "1.26.2"
software: "marco"
status: built
build_date: "2026-09-13"
build_system: "autotools"

source:
  url: "https://pub.mate-desktop.org/releases/1.26/marco-1.26.2.tar.xz"
  sha256: "12f1a254fe1072f0304884711e089a5682780a011593402ed38de6b9480e07a3"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-startup-notification"
  dependencies:
    - gtk/3.24.43
    - glib/2.84.0.1
    - cairo/1.18.4
    - cairo-gobject/1.18.4.2
    - pango/1.50.14.1.1
    - gdk-pixbuf/2.44.6.1
    - atk/2.38.0.1.1
    - libcanberra/0.30
    - libx11/6.4.0
    - libxext/6.4.0
    - libxrender/0.9.12
    - libxrandr/1.5.5
    - libxcursor/1.2.3
    - libxinerama/1.1.6
    - libxdamage/1.1.6.1
    - libxcomposite/0.4.6
    - libxfixes/6.1.0
    - libxres/1.2.1
    - libice/1.1.2
    - libsm/1.2.6
  tool_requires:
    - itstool/2.0.7
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-gdk-x11-compat.patch"
  - "0002-canberra-gtk3-shim.patch"
  - "0003-config-guess-sub.patch"
  - "0004-zenity-optional.patch"
  - "0005-cairo-xlib-compat.patch"

knowledge_gained:
  - "HMDFS 上玩具 mktemp -d 生成的目录不可写（chmod 被文件系统忽略），autoconf 生成的 config.status 会因此 'could not setup config files machinery'；让 config.status 走自带 mkdir 回退分支即可"
  - "制品仓 X11 包内的 libtool .la 记录了打包机绝对路径，autotools 消费者链接期报 'cannot find the library .../libxcb.la'；用 build_folder 私有 .so 目录置于 -L 首位可绕开（R49）"
  - "PkgConfigDeps 生成的最小 glib-2.0.pc 丢掉了本仓 glib 的 -lintl（g_libintl_* 由包内 libintl.so 提供），消费者链接期 undefined symbol；gio-2.0.pc 也缺 glib_compile_schemas 变量"
  - "config.guess 的编译器探针在 OHOS 上必然失败（未签名 ELF 不能 exec），必须走 uname 分支识别 HarmonyOS"
  - "marco 的上游测试不能只看 meson test() 数量：src/core/testboxes.c 有 14 个自检用例（73 条 g_assert、无 X 依赖），未被注册但可真实运行；meson 注册的 src/wm-tester 5 项与 testgradient/testasyncgetprop 需活动 X display（GTK broadway-only 构建 gtk_init 取不到显示后端；直接 XOpenDisplay(NULL) 者在下一行 DefaultScreen(d) 处 SIGSEGV）——须逐项给出 rc 与源码行级定位，不能笼统写“无测试”或只数注册项"
