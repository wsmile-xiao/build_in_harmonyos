software: marco
display: "marco"
description: "MATE 窗口管理器（X11 合成窗口管理器，GTK 3）"
category: desktop
homepage: "https://github.com/mate-desktop/marco"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GDK-X11 兼容层：制品仓 gtk/3.24.43 为 broadway 后端（无 gdk/gdkx.h、无 gdk_x11_* 符号），补丁 0001 提供 gdk/gdkx.h 与单例 X 连接 / XID 映射 / 错误陷阱 / X 事件过滤器分发"
    - "Cairo-Xlib 兼容层：制品仓 cairo/1.18.4 为 xlib=disabled（无 cairo_xlib_* 符号与 cairo-xlib.h），补丁 0005 用 XGetImage + cairo image surface 提供同名入口，窗口边框与 xrender 合成器可正常绘制"
    - "libcanberra-gtk3：marco 的 MARCO_PC_MODULES 无条件要求该模块，制品仓 libcanberra/0.30 未构建 gtk3 模块；补丁 0002 提供等价 ca_gtk_context_get()，配方生成同名 shim .pc（不改上游源码）"
    - "startup-notification：制品仓未发布，用上游官方开关 --disable-startup-notification（pidgin / libwnck3 同款先例）；libSM/libICE 已发布，会话管理保持启用"
    - "config.guess/config.sub：2023 年版本无法运行编译器探针（OHOS 拒绝执行未签名探针二进制）且不识别 aarch64-linux-ohos，补丁 0003 增加 HarmonyOS/aarch64-linux-ohos 三元组"
    - "configure 生成物机械替换：mktemp -d 在 HMDFS 上产生不可写目录导致 config.status 失败，配方改为走 configure 自带 mkdir 回退分支；zenity 存在性检查降级为警告（运行时可选的对话框助手，制品仓未发布）"
    - "构建期工具自签：glib-compile-schemas / gdk-pixbuf-csource 从依赖包复制并 binary-sign-tool 自签（OHOS 拒绝执行未签名 ELF）"
    - "依赖 .la 污染规避：X11 包内的 libtool .la 记录打包机绝对路径，配方建立 build_folder 私有 .so 目录并置于 -L 首位（R49），避免 libtool 走坏 .la"
    - "上游测试完整清单 21 用例（testboxes 自检 14 + meson 注册 5 + 未注册演示 2）：其中 testboxes 14/14 由配方 build() 真实执行通过（无需 X display，已纳入门禁），其余 7 项需活动 X display 不可运行（逐项技术原因见版本级 notes.md / test_package/MANIFEST.yml）；test_package 另补 99 条断言（几何 API 契约 60 + 符号/类型 24 + 无 X server 降级 12 + 二进制 CLI 3），全部真实执行通过"
  common_dependencies:
    - gtk/3.24.43
    - glib/2.84.0.1
    - cairo/1.18.4
    - libcanberra/0.30
    - libx11/6.4.0
    - libxext/6.4.0
    - libxrender/0.9.12
    - libxrandr/1.5.5
    - libxcursor/1.2.3
    - libxinerama/1.1.6
    - libxdamage/1.1.6.1
    - libxcomposite/0.4.6
    - libxfixes/6.1.0
    - libxres/1.2.1
    - libice/1.1.2
    - libsm/1.2.6

versions:
  "1.26.2":
    status: built
    build_date: "2026-09-13"
    source_url: "https://pub.mate-desktop.org/releases/1.26/marco-1.26.2.tar.xz"
