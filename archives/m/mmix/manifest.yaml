software: mmix
display: "MMIX"
description: "Knuth 的 64 位 RISC 体系结构参考软件：mmixal 汇编器、mmix 模拟器、mmotype 目标文件检查器、mmmix 流水线元模拟器"
category: tool
homepage: "https://mmix.cs.hm.edu/"
license: LicenseRef-Knuth-MMIXware
build_system: custom

ohos_adaptation:
  key_points:
    - "CWEB（.w）文学程序，无 configure：先用 tool_requires cweb/4.12.2 提供的 ctangle 把 .w 展开成 C，再用目标编译器编译；构建系统为自定义脚本。"
    - "两个 CWEB change file（.ch）做可移植性修复：mmmix 驱动 buffer 加 static，避免与 config 模块 buffer 重复定义，因此不需要全局 -fcommon；mmotype 把 32 位 MMO 时间戳按值转换为 time_t 再交给 localtime，避免 LP64 下指针重解释越界（未修复时读出 1890 年）。"
    - "保留 GNU89 以兼容上游 K&R C；不要定义 _GNU_SOURCE，它会暴露新版 glibc 的 fadd/fmul/fdiv/fsub 并与上游流水线枚举名冲突。"
    - "默认 PIE + RELRO/NOW；static=True 产出单文件静态可执行程序。设备本地（非交叉）OHOS 构建会对 4 个新 ELF 调用 binary-sign-tool -selfSign 1，签名后才能在本机执行。"
    - "上游无 make check；测试基准为 README 记录的运行结果、silly.run/.out 记录与 49 个 .mms 汇编样例。"
    - "CLI 工具门禁：软件级 commands.json（R38）"
  common_dependencies: []

versions:
