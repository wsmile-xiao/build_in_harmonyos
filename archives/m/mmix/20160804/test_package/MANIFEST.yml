package: mmix/20160804
homepage: https://mmix.cs.hm.edu/
upstream_check_command: README manual tests; no make check target
upstream_test_in_build: true
upstream_test_command: python3 upstream_tests.py --src SOURCE --bin BUILD/work --out
  BUILD/upstream-report.json --environment ENVIRONMENT
upstream_tests:
- file: ../upstream_tests.py
  source: README, silly.mms, silly.run, silly.out, hello.mms, copy.mms, plain.mmconfig,
    test1.mmconfig, test1.mmix
  description: Complete silly trace and warnings; copy bytes; documented pipeline
    timing and counters; all release assembly examples
  command: python3 upstream_tests.py --src SOURCE --bin BUILD/work --out REPORT --environment
    ENVIRONMENT
test_package_tests:
- file: test_mmix.py
  description: Assemble a new 19+23 program, run and inspect it, simulate its pipeline
    dump, reject malformed input
  command: python3 test_mmix.py --package PACKAGE --out REPORT
assertion_count: 12
upstream_test_count: 62
upstream_test_scope: 47 valid assembly samples; 2 examples also rejected by unmodified
  Linux baseline; documented runtime checks. Executed natively on a HarmonyOS PC with signed
  ELFs (static and dynamic, 62/62 each) and on OHOS-static QEMU (62/62).
