knowledge_gained:
  - "上游 raw Makefile 的首目标 what: → sh makedefs 用 uname -s/-r 猜平台，OHOS 读数 HarmonyOS/HongMeng Kernel 1.12.0 落到未支持分支：必须显式 make all 并自带 DEFS，不能跑裸 make ｜ knowledge_ref: E007 同族（载体不同：本包是上游 makedefs 的 uname -s 读数，不是 config.guess）"
  - "OHOS libc 的 <paths.h> 不提供 _PATH_MEM/_PATH_KMEM（glibc/BSD 提供）：照上游自身 SUNOS5 分支的内联定义写法加 #ifndef 特征守卫，跨 libc 行为不变 ｜ knowledge_ref: DRAFT-MEMDUMP-1.01-PATHS-H-MACRO-ABSENT-FEATURE-GUARD-FALLBACK"
  - "OHOS PC 无 /dev/mem 与 /dev/kmem 设备节点（ENOENT 而非 EACCES/EPERM）：取证/内存访问类工具的功能面在平台级缺失，交付口径只能是编译+静态+真实失败形态断言 ｜ knowledge_ref: 无（平台能力面缺失的一手读数，本仓尚无同层条目）"
  - "上游 2005 年工具普遍无 --version/--help（未知选项一律 usage()→exit 1），L2 烟雾门禁与上游 CLI 契约冲突，需按平台读数如实申报而非改上游语义 ｜ knowledge_ref: 无（上游 CLI 契约与 L2 烟雾门禁冲突，本包一手读数）"
  - "官方站老 Apache 对 .tar.gz 声明 Content-Encoding: x-gzip、对接受 gzip 的客户端当场解压后再发（Content-Length 仍是旧 .gz 值）：conan 下载器拿 51200 B 未压缩 tar（sha 179ea799af…）、curl/urllib 拿 12713 B 压缩件（sha 76de8ff167…），同一字节的两种传输形态，get() 单哈希必挂，需按 gzip magic 归一化后两哈希必中其一 ｜ knowledge_ref: DRAFT-conan-downloader-xgzip-content-encoding"
  - "conan 2.29.1 的 tools.build:compiler_executables 是 dict conf，取子键 ...:c 抛 does not exist in configuration list；整体取 dict 再 get('c')（同仓 abc notes 已记） ｜ knowledge_ref: 无（conan 2.29.1 conf 取值形态，本包一手复算）"
  - "本机 ConanVerifier 的 L2/L4/L5 因 _cache_path 未设被跳过（报告显示'跳过（无 cache 路径）'），不能当已通过申报；静态安全属性改用手工 readelf 读数记录 ｜ knowledge_ref: 无（框架侧门禁缺陷，另开框架 PR，不在本包交付面）"

