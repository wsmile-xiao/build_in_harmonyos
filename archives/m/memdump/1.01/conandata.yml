# conandata.yml — memdump 1.01
#
# 源选择决策链（详见 notes.md「平台行为面取证」与「上游事实性断言」）：
#   1) 唯一官方发布址 = 作者 Wietse Venema 本人主机 www.porcupine.org（Apache 1.3.29）。
#      实测 6 次 GET：5 次 200、1 次 40s 超时（curl rc=28）⇒ 可达但抖动（同
#      archives/c/chrootuid/1.3 对 porcupine 的实测结论）。
#   2) 该主机 443 端口无监听（curl: Failed to connect to www.porcupine.org port 443），
#      官方不提供 https ⇒ 本 URL 只能是明文 http，属 R39/PF7 例外（先例同 cwebx/3.52：
#      作者站无可用 TLS 链）。conanfile.source() 之外的镜像回退白名单也不含本站。
#   3) 实物逐字节互证：本 URL 的 .gz 字节 == Debian memdump_1.01.orig.tar.gz
#      （两机各测一次同值），成员 12 项一致。池址本身不写进配方（PF7 拉黑的重打包源），
#      只用作哈希交叉校验。
#
# 为什么有两个哈希（不是冗余，是这套老 Apache 的传输坑）：
#   该站对 .tar.gz 声明 `Content-Encoding: x-gzip`，客户端一旦接受 gzip（Conan 下载器就是），
#   服务器会**当场把文件解开**再发（Content-Length 仍写旧的 .gz 长度）。实测同一 URL：
#     - curl / urllib 不声明 Accept-Encoding → 12713 B 压缩件，sha256 = 76de8ff167…
#     - Conan tools.files.download          → 51200 B 未压缩 tar，sha256 = 179ea799af…
#   `sha256` = 官方发布件本体（= 与 Debian .orig 互证的那个值，源码身份以此为准）；
#   `sha256_uncompressed` = 同一份字节解压后的形态，供归一化校验用（配方里按 gzip magic
#   判形态，二者必中其一，都不中即失败，不做无校验放行）。

sources:
  url: "http://www.porcupine.org/forensics/memdump-1.01.tar.gz"
  sha256: "76de8ff167d0779d6c3b2f2f52ca9d1cc22af179c51e976fe6e3b9a5d1e5799f"
  sha256_uncompressed: "179ea799af3dfb7aa7b219bc06a9038f30726e6d81978046ddf4f91c2558c2c4"

patches:
  - patch_file: "patches/0001-memdump.c.patch"
    patch_description: "0001 memdump.c ifndef guards for _PATH_MEM _PATH_KMEM missing from the OHOS libc paths.h"
    patch_type: "portability"
