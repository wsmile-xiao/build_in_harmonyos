# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）
# 详见 docs/TEST_QUALITY_SPEC.md；上游清点证据见 ../notes.md「上游测试用例盘点」

package: memdump/1.01
homepage: "http://www.porcupine.org/forensics/tct.html"

# 上游测试命令：Makefile 目标只有 what / all / manpages / memdump / memdump.1 / clean /
# depend，无 check 也无 test（`make -n check` 实测报 "No rule to make target 'check'"）
# ⇒ 静态清点上游测试数 N=0
upstream_check_command: "无（Makefile 无 check/test 目标，静态清点为 0）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无。清点依据——tar 内 12 个成员（LICENSE、Makefile、README、
# convert_size.c/.h、error.c/.h、makedefs、memdump.1、memdump.c、mymalloc.c/.h），
# 无任何测试源文件、测试脚本或测试目标
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：真实执行包交付的 memdump 并按上游源码契约断言退出码与错误形态——A 默认 /dev/mem 路径（-s 换算+open+%m 格式化+error() 退出码）、B -k 走 _PATH_KMEM、C 未知选项出 usage 横幅、D convert_size 非法后缀、E 多余操作数、F -v 审计链路、G -m 映射文件建空文件、H -b 缓冲尺寸接受；设备形态现场 stat+open 探测，本平台走 ENOENT 分支，可读到 /dev/mem 的平台自动改走真转储分支"
    command: "./test_memdump"

# 测试断言总数（近似值, 用于质量评估）
# 实测读数：conan create 的 test_package 阶段打印 "assertions 21/21 passed"
assertion_count: 21
