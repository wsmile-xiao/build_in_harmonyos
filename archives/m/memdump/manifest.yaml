# 软件级 manifest — memdump
# 文件位置: archives/m/memdump/manifest.yaml

software: memdump

display: "memdump"

description: "Dump physical memory from /dev/mem, skipping holes in the memory map (forensic tool)"

category: system

homepage: "http://www.porcupine.org/forensics/tct.html"

license: IPL-1.0

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游无 configure/cmake，只有 raw Makefile；默认目标是 what: → sh makedefs 用 uname -s/-r 猜平台，OHOS 读数 HarmonyOS / HongMeng Kernel 1.12.0 落到未支持分支，故必须显式 make all 并自带 DEFS=-DLINUX2"
    - "Makefile 的 CC 写死 gcc -Wformat -Wunused，OHOS 构建主机无 gcc（只有 clang 15），必须覆盖 CC"
    - "LINUX2 分支的 _PATH_MEM/_PATH_KMEM 指望 <paths.h>，OHOS libc 的 paths.h 不提供 → 补丁按上游 SUNOS5 分支既有写法加 #ifndef 特征守卫"
    - "运行期 /dev/mem 与 /dev/kmem 的设备节点在 OHOS PC 上不存在（ENOENT，非 EACCES/EPERM），内存转储功能不可用；转储逻辑是 open/read/lseek，不用 mmap"
    - "上游无 --version/--help（任何未知选项都走 usage() → exit 1）"
  common_dependencies: []

versions:
  "1.01":
    status: built
    build_date: "2026-09-27"
    conan_ref: "memdump/1.01"
