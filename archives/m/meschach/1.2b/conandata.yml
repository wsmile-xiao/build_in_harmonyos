sources:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/m/meschach/meschach_1.2b.orig.tar.gz"
  sha256: "2b153bfdd619d84ad7df15ab7cab12a4655f3f61473ee3fe948d6c4e5b55a050"

patches:
  - patch_file: "patches/0001-configure.patch"
    strip: 1
    patch_description: "Drop the complex.h header check (C99 complex macro collides with meschach's own `typedef struct {...} complex` in zmatrix.h:41 — Debian ships the same fix, Drew Parsons 2001) and run configure's epsilon probes as ./macheps and ./maxint (backticks did not search cwd, D_MACHEPS/M_MAX_INT came out empty)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.in.patch"
    strip: 1
    patch_description: "Mirror the complex.h check removal and ./macheps/./maxint probe fix in configure.in so a regenerated configure stays consistent (same rationale as 0001; Debian meschach_1.2b-13.configure.diff precedent)"
    patch_type: "portability"
