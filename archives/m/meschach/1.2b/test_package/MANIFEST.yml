package: meschach/1.2b
homepage: "https://maths.anu.edu.au/research/cma-proceedings/meschach-matrix-computations-c"

upstream_check_command: "make alltorture"
upstream_test_in_build: false
upstream_test_command: "./torture && ./sptort && ./ztorture && ./memtort && ./itertort && ./mfuntort && ./iotort"

upstream_tests:
  - name: torture
    command: "./torture"
    expected: "上游自身 Error 行计数为 0（rc 因 void main UB 不作判据，exit(0) 注入对照已实证）"
  - name: sptort
    command: "./sptort"
    expected: "上游自身 Error 行计数为 0（rc 因 void main UB 不作判据）"
  - name: ztorture
    command: "./ztorture"
    expected: "上游自身 Error 行计数为 0（rc 因 void main UB 不作判据）"
  - name: memtort
    command: "./memtort"
    expected: "上游自身 Error 行计数为 0（rc 因 void main UB 不作判据）"
  - name: itertort
    command: "./itertort"
    expected: "上游自身 Error 行计数为 0（rc 因 void main UB 不作判据）"
  - name: mfuntort
    command: "./mfuntort"
    expected: "上游自身 Error 行计数为 0（rc 因 void main UB 不作判据）"
  - name: iotort
    command: "./iotort"
    expected: "上游自身 Error 行计数为 0（rc 因 void main UB 不作判据）"

test_package_tests:
  - file: test.c
    description: "消费已安装 libmeschach：分配/维度/稠密乘/转置/矩阵向量乘/向量加 6 项真实 API 断言"
    command: "./meschach_test"

assertion_count: 6
