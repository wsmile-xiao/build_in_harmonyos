knowledge_gained:
  - "Legacy autoconf 项目 complex.h 探针与自带 typedef complex 撞名（zmatrix.h:41）：configure 侧移除探针即整链规避，Debian 官方同判同修（meschach_1.2b-13.configure.diff，Drew Parsons 2001）；配方侧两面补丁随包。" # knowledge_ref: E704
  - "makefile all 目标无条件编译被 #ifdef 守卫的 part3/zpart 对象，而 SPARSE/COMPLEX 宏只由 --with-all 定义 ⇒ 不带 --with-all 必炸 use of undeclared identifier TYPE_SPMAT；配方固定 ./configure --with-all（Debian rules 同口径）。" # knowledge_ref: E704
  - "configure 用反引号执行 macheps/maxint 未加 ./ 前缀，设备 PATH 不含 cwd ⇒ 探针不执行、D_MACHEPS/M_MAX_INT 生成空宏；补丁改为 ./macheps、./maxint（§一.14 同族）。" # knowledge_ref: E704

homepage: "https://maths.anu.edu.au/research/cma-proceedings/meschach-matrix-computations-c"
