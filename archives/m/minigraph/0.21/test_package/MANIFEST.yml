# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: minigraph/0.21
homepage: "https://github.com/lh3/minigraph"

# 上游测试命令（经核实不存在正式测试入口）
upstream_check_command: "make test"

# 上游无正式测试（见下方 evidence）；make test/make check 均无构建目标
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无 —— 证据如下）
upstream_tests: []

# 上游无测试的证据：
#   - Makefile 仅有 all/clean/depend 目标，无 test/check；实际执行
#     make test 报 "make: Nothing to be done for 'test'."（rc=0，make 把
#     已存在的 test/ 目录当作无规则目标），make check 报 "make: *** No
#     rule to make target 'check'.  Stop."（rc=2）——均无任何测试被执行。
#   - test/ 目录仅含 4 个 README quick-start 示例数据文件（MT-human.fa、
#     MT-chimp.fa、MT-orangA.fa、MT.gfa），无脚本、无期望输出
#   - 无 tests/ 目录、无 .sh/.py 测试脚本
#   - 仓库无 .github/workflows/（GitHub Actions 目录不存在），无 CI 测试
#   - README quick-start（./minigraph -cxggs test/MT.gfa test/MT-chimp.fa
#     两步建图+比对）为唯一官方演示用法，已在 build 环境用 OHOS AArch64
#     工具链真实执行并验证，但不计入上游正式测试

# test_package 中自带的测试（消费者视角，覆盖上游 quick-start + 核心能力）
test_package_tests:
  - file: "test_minigraph.sh"
    description: "18 条断言（功能 1-14 + 鸿蒙特有 15-18）：--version（0.21-r606）；确定性合成 fixture（16000bp 参考 + 15000bp 样本，含 1000bp 缺失）上真实建图（-cxggs -c -l1k -d1k）：S 段数>=2 且 L 边数>=1（变异入图成气泡）、段序列纯 ACGT、GFA L 行 CIGAR 合法、两次运行输出逐字节一致（确定性）；线性映射 PAF：恰好 1 行命中、strand/target 长度/query-target block/区间自洽；图映射 GAF：ds:Z 图坐标标签且目标为图路径名；手写 GFA 输入（H + 单 S 行带 SN:Z/SO tags，非 minigraph 自产）被接受为映射目标且单行 GAF 报告 NM:i:1000 精确等于注入的 1000bp 缺失；--call 变异检测 BED：检出的缺失边界与 fixture 注入位置（4000-5000）相符；gzip 压缩参考输入正常比对（zlib 链路）；负向输入：缺失图输入（第一参数）→ rc=1 且 stderr 含 failed to load the graph；缺失样本输入（第二参数）→ rc=1 且 stderr 含 failed to open（与前者为不同错误代码路径）；空参数 → rc=1 且 stderr 输出 Usage；鸿蒙特有（OHOS aarch64 宿主上运行，其他平台 SKIP）：纯 Python 解析 ELF 验证 ELF64 小端 AArch64 PIE + musl PT_INTERP(/lib/ld-musl-aarch64.so.1) + .codesign 段存在；动态段无 DT_RPATH/DT_RUNPATH 且 DT_NEEDED 仅限 libz/libc/libm/libpthread；二进制内无 /storage/、/home/、/Users/、/data/service 宿主构建路径泄漏；部署模式真实运行建图产出气泡结构"
    command: "bash test_minigraph.sh"

# 测试断言总数：18
assertion_count: 18
