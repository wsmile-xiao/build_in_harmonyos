software: minigraph
# 文件位置: archives/{letter}/{name}/0.21/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.21"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-11"

# 构建系统类型
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag v0.21，对应 r606）
  url: "https://github.com/lh3/minigraph/archive/refs/tags/v0.21.tar.gz"

  # 源码校验和
  sha256: "4272447393f0ae1e656376abe144de96cbafc777414d4c496f735dd4a6d3c06a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "LIBS=-L<zlib_pkg_libdir> -lz -lpthread -lm"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零 patch）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "minigraph 0.21（v0.21 tag = r606）为纯 C99 序列-图比对/建图工具，上游仅 lh3/minigraph 官方仓库（MIT License，Broad Institute 版权方），tarball 取自 GitHub tag 归档。(knowledge_ref: notes.md 上游节)"
  - "构建系统为 plain Makefile（无 configure、无 install、无 test 目标），默认 CC=gcc；CFLAGS=-std=c99 -g -Wall -O3 -msse4——其中 -msse4 是 x86 专属 flag，源码无 SSE intrinsic；recipe 在 AArch64 目标上经 make 命令行滤除该 flag（x86 目标保留），OHOS 上另加 -Wno-unused-command-line-argument 抑制 clang wrapper 注入链接 flag 的警告（binutils/gdal 同例），零 patch。(knowledge_ref: notes.md 编译步骤节)"
  - "依赖：libc + libpthread + libm + zlib（bseq.c/gfa.c 内嵌 kseq.h 读 .fa/.fa.gz/.gfa.gz 输入需要 <zlib.h>）。zlib 经 Conan 依赖引入，build() 用 -L<zlib libdir> -lz 覆盖 Makefile 默认 LIBS，避免链接到 sysroot 的系统 zlib（R26）。(knowledge_ref: notes.md 关键适配点节)"
  - "上游无正式测试：Makefile 无 test/check 目标（实测 make test 报 'Nothing to be done for test'（rc=0，make 将已存在的 test/ 目录当作无规则目标）、make check 报 'No rule to make target'（rc=2）），仓库无 CI workflow、无 .sh/.py 测试脚本，test/ 目录仅 4 个 README quick-start 示例数据（MT-human/MT-chimp/MT-orangA FASTA + MT.gfa）。已实际执行确认，并用 OHOS 工具链真实执行 README quick-start 作为示例功能验证，不计入上游正式测试数量。(knowledge_ref: notes.md test_package 设计节)"
  - "DWARF 路径泄漏：上游 CFLAGS 含 -g 时 DW_AT_comp_dir 及 #line 头文件引用把构建机绝对路径（Conan build 目录 ~/.conan2/p/b/<hash>/b、工具链 sysroot）嵌入二进制；修复为 source_folder、build_folder、工具链根目录的三重 -ffile-prefix-map（make -C 下编译器 cwd 是 source_folder，单映射 build 无效），不做全局删 -g、不 strip 调试段、不硬编码本机路径，且仅在产物 strings 扫描确有泄漏时启用映射 (knowledge_ref: DRAFT-E579)"
  - "CLI 行为：--version 输出 '0.21-r606' 且 rc=0；无参数打印 Usage 到 stderr 且 rc=1（L2 冒烟须用 --version）；输入文件不存在 rc=1 且 stderr 含 'ERROR: failed to open'。(knowledge_ref: notes.md 验证记录节)"
  - "建图隐藏门槛：ggs 预设 min_map_len 默认 100000、min_depth_len 默认 20000——线粒体级(~16kb)输入必须加 -l/-d 降低阈值（README quick-start 用 -l10k；合成小 fixture 须 -l1k -d1k 量级），否则全部变异被过滤、输出单段无气泡图。(knowledge_ref: notes.md test_package 设计节)"

knowledge_ref:
  - "knowledge/drafts/DRAFT-E579-minigraph-dwarf-compdir-host-path-leak.kv"
