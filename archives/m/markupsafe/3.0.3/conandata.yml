# conandata.yml — markupsafe 3.0.3
# 源码来自 PyPI 官方文件托管（files.pythonhosted.org，R39 合规）
#
# ⚠️ 关于「url 路径里的哈希 ≠ sha256 字段」——这是**正常的**，不是笔误。
#
# files.pythonhosted.org 的 URL 路径内嵌的是 **blake2b_256**，而非 sha256
# （两者是不同算法，本就不应相等）。此点曾被两轮 review 报为「sha256 不一致 /
# 源码获取必失败」，经实测为**假阳性**。实测三值并列如下（同一文件
# markupsafe-3.0.3.tar.gz，80313 字节）：
#
#   URL 路径内嵌          : 7e99 7690b6d4034fffd95959cbe0c02de8deb3098cc577c67bb6a24fe5d7caa7
#   blake2b_256 (本机实测) : 7e99 7690b6d4034fffd95959cbe0c02de8deb3098cc577c67bb6a24fe5d7caa7  ← 与路径一致
#   sha256      (本机实测) :      722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698  ← 本文件所写
#
# 权威佐证：PyPI 官方 metadata（https://pypi.org/pypi/markupsafe/3.0.3/json）
# 对同一文件并列给出三种摘要，其一正是路径里那串：
#   {"blake2b_256": "7e997690b6d4034fffd95959cbe0c02de8deb3098cc577c67bb6a24fe5d7caa7",
#    "md5":         "13a73126d25afa72a1ff0daed072f5fe",
#    "sha256":      "722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698"}
#
# 即：URL 路径 = blake2b_256；本文件 sha256 字段 = sha256。二者并存且各自正确。
# 决定性旁证：`conan create`（conan 会按 sha256 字段校验下载内容）实际通过，
# 本地与 CI 均 exit=0 —— 若 sha256 写错，conan 必在下载校验阶段失败。
#
# 「连前两字节 7e/99 都与 72/26 不符」正是 blake2b_256 与 sha256 的前缀差。

sources:
