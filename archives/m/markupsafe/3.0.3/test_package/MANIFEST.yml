# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: markupsafe/3.0.3
homepage: "https://github.com/pallets/markupsafe"

# 上游测试命令 — pytest（tests/ 目录）
upstream_check_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest tests -q"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src python3 -m pytest tests -q --assert=plain -p no:cacheprovider"

# 上游实际运行的测试程序（2026-09-16 实测记录）：
# - tests/ 目录（conftest.py + test_escape.py + test_exception_custom_html.py
#   + test_ext_init.py + test_leak.py + test_markupsafe.py）
# - conftest.py 对 _native 与 _speedups 双参数化；本包只交付纯 Python 回退，
#   故 _speedups 组按上游 pytest.mark.skipif(_speedups is None) 规则跳过（非失败）
upstream_tests:
  - file: tests/
    source: markupsafe-3.0.3/tests/
    description: "上游 pytest 套件（5 个测试文件）；conftest.py 对 _native/_speedups 双参数化，_speedups 组因本包只交付纯 Python 回退而按上游 skipif 规则跳过"
    command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src python3 -m pytest tests -q --assert=plain -p no:cacheprovider"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_markupsafe.py
    description: >-
      消费者测试：真实 API（R34）——escape / escape_silent / Markup 运算 /
      unescape / striptags；并**显式验证纯 Python 模式生效**：断言
      `import markupsafe._speedups` 必须抛 ImportError（本包刻意不交付 C 加速器），
      且 `_native._escape_inner("a<b") == "a&lt;b"`。
      末尾固化 3.x 契约分界线：`soft_unicode` **已移除**（2.1 起），而 `soft_str`
      **仍然存在且可调用**（3.0.3 的 __init__.py:64 定义，soft_str(None)=="None"）
      —— 二者命运不同，不可一起断言为"已移除"。
      另：**不断言 `__version__`**——3.0.3 经 importlib.metadata 惰性解析，需已安装的
      .dist-info，而本包为源码直拷形态（无 .dist-info），干净环境下必抛
      PackageNotFoundError（已隔离实测）。测试内含导入自证断言，防止宿主已安装版本
      串味造成假通过。
      注：`&#39;`/`&#34;` 两个引号实体**不**用于证明回退——实测 _speedups.c 的
      DO_ESCAPE 宏输出与之完全相同，对两套实现无区分力。
    command: "python3 test_markupsafe.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 16
