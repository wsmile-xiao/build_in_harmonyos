knowledge_gained:
  - "markupsafe 的 C 加速模块 _speedups 是可选的：__init__.py 用 try/except ImportError 回退到 _native，纯 Python 模式功能完整（上游测试 32 passed / 11 skipped，跳过项即 _speedups 组）。"
  - "python-require 型配方不应交付 .so：编译出的 _speedups.cpython-312-aarch64-linux-ohos.so 绑定构建机 CPython ABI 与架构，跨机器不可用；仓库既有同类包（yarl/frozenlist/aiohttp）一律走纯 Python 回退。"
  - "1.1.1 是刻意的非最新 pin：Jinja2 2.10.1（jinja2/utils.py）导入 soft_unicode，该符号在 MarkupSafe 2.1 被移除，故 Jinja2 2.10.1 的消费方必须用 <= 2.0.1。"
  - "测试环境的 pytest 与宿主解释器可能不兼容（本机 site-packages 的 pytest 5.4.3 + typeguard 插件在 Python 3.12 上抛 TypeError: required field lineno missing from alias）——上游测试须以 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 运行，避免加载无关站点插件。"

