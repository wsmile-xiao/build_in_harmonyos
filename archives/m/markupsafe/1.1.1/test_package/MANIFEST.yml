# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: markupsafe/1.1.1
homepage: "https://github.com/pallets/markupsafe"

# 上游测试命令 — pytest（tests/ 目录，setup.cfg 中 testpaths = tests）
upstream_check_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest tests -q"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest tests -q --no-header -p no:cacheprovider"

# 上游实际运行的测试程序（2026-09-16 实测记录）：
# - tests/ 目录（conftest.py + test_escape.py + test_exception_custom_html.py
#   + test_leak.py + test_markupsafe.py）
# - conftest.py 对 _native 与 _speedups 双参数化；本包只交付纯 Python 回退，
#   故 _speedups 组按上游 skipif 规则跳过（非失败）
# - 实测结果：**32 passed, 11 skipped**（纯 Python 回退，无失败）
upstream_tests:
  - file: tests/
    source: MarkupSafe-1.1.1/tests/
    description: "上游 pytest 套件（4 个测试文件；实测 32 passed / 11 skipped，跳过项为 _speedups C 加速组，上游自身 skipif 规则）"
    command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=src python3 -m pytest tests -q --no-header -p no:cacheprovider"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_markupsafe.py
    description: "消费者测试：真实 API（R34）——escape/Markup/escape_silent/unescape/striptags + Jinja2 2.10.1 所需的 soft_unicode 契约"
    command: "python3 test_markupsafe.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 13
