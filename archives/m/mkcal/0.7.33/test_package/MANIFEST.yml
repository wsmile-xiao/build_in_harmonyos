# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点（R51 申报表）:
#   tests/CMakeLists.txt 通过 add_test() 注册 3 个 CTest 条目（QtTest 可执行文件）:
#     - tst_storage (QTEST_GUILESS_MAIN, tests/tst_storage.cpp, 约 2.3 kLOC)
#     - tst_perf    (QTEST_GUILESS_MAIN, tests/tst_perf.cpp)
#     - tst_load    (QTEST_MAIN,         tests/tst_load.cpp)
#   tests/tests.xml 亦声明同名 3 个用例（Sailfish 测试框架定义）。
#   全部离线运行（SQLite 本地库），不需要网络或外部服务。

package: mkcal/0.7.33
homepage: "https://github.com/sailfishos/mkcal"

# 上游测试命令 (ctest -N / ctest --test-dir 分析)
upstream_check_command: "ctest --test-dir <build> -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir {build_folder} --output-on-failure --no-tests=error"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/tst_storage.cpp
    source: mkcal-0.7.33/tests/tst_storage.cpp
    description: "SQLite storage backend: notebooks, events, recurrence, alarms, attendees"
    command: "ctest -R ^tst_storage$ --output-on-failure"
  - file: tests/tst_perf.cpp
    source: mkcal-0.7.33/tests/tst_perf.cpp
    description: "Storage performance smoke test (bulk insert/load)"
    command: "ctest -R ^tst_perf$ --output-on-failure"
  - file: tests/tst_load.cpp
    source: mkcal-0.7.33/tests/tst_load.cpp
    description: "Bulk load/expand of a synthetic calendar"
    command: "ctest -R ^tst_load$ --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_mkcal.cpp
    description: "消费者测试：通过 libmkcal-qt6.pc 链接，SQLite 存取事件往返验证"
    command: "./test_mkcal"

# 上游 CTest 条目总数
upstream_test_total: 3
# 本次适配实测结果（2026-09-29，conan create 内真实运行）
upstream_test_case_total: 116
upstream_test_passed: 116
upstream_test_failed: 0
upstream_test_skipped: 0
upstream_test_detail:
  - suite: tst_storage
    cases: 93
    passed: 93
    failed: 0
    skipped: 0
  - suite: tst_perf
    cases: 5
    passed: 5
    failed: 0
    skipped: 0
  - suite: tst_load
    cases: 18
    passed: 18
    failed: 0
    skipped: 0
# 鸿蒙平台专项验证（适配改动对应的回归面）
harmonyos_specific_tests:
  - name: "ProcessMutex / Semaphore (POSIX 后端)"
    description: "验证 OHOS 上不再触发 SysV IPC 信号量 SIGSYS：tst_storage/tst_perf/tst_load 会构造 SqliteStorage 并反复 acquire/release 跨进程锁，全部通过即证明 POSIX 命名信号量后端工作正常"
    evidence: "修复前 3/3 套件 SIGSYS（exit=159）；修复后 116/116 通过"
  - name: "mkcal SQLite 往返（test_package）"
    description: "消费者视角验证安装包在 OHOS 上可链接并完成事件存取往返"
    evidence: "PASS: mkcal SQLite storage round-trip <uid>"

