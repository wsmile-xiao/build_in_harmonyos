# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: miniscript/1.6.2
homepage: "https://github.com/JoeStrout/miniscript"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（CMake 注册的 2 个测试）
upstream_tests:
  - file: MiniScript-cpp/src/MiniScript/UnitTest.cpp
    source: miniscript-1.6.2/MiniScript-cpp/src/MiniScript/UnitTest.cpp
    description: "C++ 单元测试（UnitTest 框架，覆盖 String/List/Dictionary/解释器/词法/解析/虚拟机）"
    command: "./tests-cpp"
  - file: TestSuite.txt
    source: miniscript-1.6.2/TestSuite.txt
    description: "MiniScript 语言集成测试套件（minicmd --itest 逐行断言）"
    command: "./miniscript --itest TestSuite.txt"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：通过公开 Interpreter API 运行 MiniScript 脚本并校验 print 输出与全局变量"
    command: "./test_miniscript"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 500