# 版本级 manifest
# 文件位置: archives/m/miniscript/1.6.2/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.2"

# 软件名
software: "miniscript"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag 源）
  url: "https://github.com/JoeStrout/miniscript/archive/refs/tags/v1.6.2.tar.gz"

  # 源码校验和（官方 tag 归档实际 SHA-256）
  sha256: "62df0ce8faca21db588ed5f0abe020a41602c8fc02376f6b2385869863acbefd"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DMINISCRIPT_BUILD_TESTING=ON"
  - "-DMINISCRIPT_BUILD_CSHARP=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
- "0001-ohos-signed-char.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "OHOS/arm64 默认 unsigned char，MiniScript 单元测试断言 s.atB(0)==-26 需要 -fsigned-char 保持上游 signed char 语义"
- "CMake 构建；clang 15 直接配置生成成功（System is unknown to cmake 为无害提示）"