software: merecat
display: "merecat"
description: "thttpd 衍生的轻量 HTTP/HTTPS 服务器，附带 htpasswd 密码文件工具"
category: network
homepage: "https://github.com/troglobit/merecat"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 git 快照不含 configure，build() 内用 automake/1.18 现场引导 autotools"
    - "config.guess/config.sub 不识别 HarmonyOS，按知识 E007 就地扩展为 aarch64-unknown-linux-ohos，且不传 --build/--host 以保留原生编译路径"
    - "HMDFS 不暴露 POSIX other 权限位，文件/目录/CGI 的可达性判定回退 access(2)，保持 POSIX 兼容"
    - "只读 /tmp 下 tempfile() 改用 $TMPDIR，不再固定 _PATH_TMP（E002）"
    - "Conan 构建目录中 bash 无法 getcwd()，规避问题 shell 并显式指定 CONFIG_SHELL/SHELL（E386）"
  common_dependencies:
    - libconfuse/3.3
    - openssl/3.5.6.1
    - zlib/1.3.1

versions:
  "2.31-git20260330":
    status: published
    build_date: "2026-09-29"
    conan_ref: "merecat/2.31-git20260330"
    notes: "路径 A 适配；make check 13 PASS / 0 FAIL / 1 SKIP（php-cgi 缺失），test_package 消费者用例通过，打包后的 merecat 可正常响应 HTTP GET"
