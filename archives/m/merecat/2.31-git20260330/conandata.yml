# 已逐文件比对 130 个文件与 SHA256，保证可复现
sources:
  url: "https://github.com/troglobit/merecat/archive/57a2ce7c0cca65579f57d248ef89300eb22c2d97.tar.gz"
  sha256: "ba71a5a155001045ff66d78da10da4410ffc3aa34535ab9f55d18e52563caf9f"

patches:
  - patch_file: "patches/0001-lib-tempfile.c.patch"
    patch_description: "tempfile(): honour $TMPDIR instead of the read-only /tmp, and fall back to mkstemp() whenever O_TMPFILE is unsupported (POSIX compatible)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-libhttpd.c.patch"
    patch_description: "file/directory/CGI permission checks: keep the upstream world-bit test verbatim wherever the filesystem reports the POSIX 'other' bits and fall back to access(2) only on filesystems that hide them, detected once per device (POSIX compatible)"
    patch_type: "portability"
