# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS 不暴露 POSIX other 位，目录即使是 777 也表现为 750，S_IROTH/S_IXOTH 判定恒为假，导致静态文件、目录列表、CGI 一律 403；改为按 st_dev 缓存一次文件系统能力探测，只在确实隐藏 other 位的文件系统上回退 access(2)，能正常表达该位的平台（含普通 Linux）保持上游判定原样"
  - "鸿蒙 PC 的 /tmp 只读，沿用 _PATH_TMP 的 tmpfile()/mktemp() 全部失败；改用 $TMPDIR，避免目录列表接口 500"
  - "Conan 构建目录中的 bash 无法 getcwd()，导致依赖 getcwd 的 Autoconf CONFIG_SHELL 探测异常；改为规避有问题的 shell（E386）"
  - "git 快照不含 configure/Makefile.in，worker 上也没有 automake，需用 tool_requires(automake) 兜底"
