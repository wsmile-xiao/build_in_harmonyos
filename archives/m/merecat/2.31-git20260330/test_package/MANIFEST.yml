package: merecat/2.31-git20260330
homepage: "https://github.com/troglobit/merecat"

# 上游测试入口（Automake parallel test harness）
upstream_check_command: "make check"

# conanfile.py build() 内已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check（conanfile.py build() 中 make -j1 后执行）"

# 上游实际运行的测试程序（取自 tests/Makefile.am 的 TESTS）
upstream_tests:
  - file: tests/start.sh
    source: merecat-2.31-git20260330/tests/start.sh
    description: "启动 merecat 并使用 tests/merecat.conf，监听 8086/8080"
    command: "./start.sh"
  - file: tests/cgi.sh
    source: merecat-2.31-git20260330/tests/cgi.sh
    description: "CGI 请求 /cgi-bin/printenv，校验 SERVER_SOFTWARE=merecat/"
    command: "./cgi.sh"
  - file: tests/setenv.sh
    source: merecat-2.31-git20260330/tests/setenv.sh
    description: "CGI setenv 环境变量传递"
    command: "./setenv.sh"
  - file: tests/php.sh
    source: merecat-2.31-git20260330/tests/php.sh
    description: "PHP CGI：需要 php-cgi，未安装时以 exit 77 跳过"
    command: "./php.sh"
  - file: tests/gzip.sh
    source: merecat-2.31-git20260330/tests/gzip.sh
    description: "gzip 压缩传输（zlib mod_deflate）"
    command: "./gzip.sh"
  - file: tests/redirect.sh
    source: merecat-2.31-git20260330/tests/redirect.sh
    description: "redirect 配置 301 跳转"
    command: "./redirect.sh"
  - file: tests/location.sh
    source: merecat-2.31-git20260330/tests/location.sh
    description: "location 配置 URL 映射"
    command: "./location.sh"
  - file: tests/proxy.sh
    source: merecat-2.31-git20260330/tests/proxy.sh
    description: "proxy-pass 反向代理：转发头 X-Forwarded-For/X-Real-IP，并校验响应头 Location 重写"
    command: "./proxy.sh"
  - file: tests/dirlisting.sh
    source: merecat-2.31-git20260330/tests/dirlisting.sh
    description: "目录列表：无 index 文件时输出 <table>，有 index 时使用 index"
    command: "./dirlisting.sh"
  - file: tests/htpasswd.sh
    source: merecat-2.31-git20260330/tests/htpasswd.sh
    description: ".htpasswd Basic 认证：无凭据返回 401，正确凭据返回 200"
    command: "./htpasswd.sh"
  - file: tests/htaccess.sh
    source: merecat-2.31-git20260330/tests/htaccess.sh
    description: ".htaccess 访问控制：deny 403 / allow 200"
    command: "./htaccess.sh"
  - file: tests/ssi.sh
    source: merecat-2.31-git20260330/tests/ssi.sh
    description: "SSI：DOCUMENT_URI / DOCUMENT_NAME 变量"
    command: "./ssi.sh"
  - file: tests/index-order.sh
    source: merecat-2.31-git20260330/tests/index-order.sh
    description: "index 优先级：index.html > index.htm，按 index 配置顺序选择"
    command: "./index-order.sh"
  - file: tests/stop.sh
    source: merecat-2.31-git20260330/tests/stop.sh
    description: "优雅停止 merecat 服务"
    command: "./stop.sh"

# test_package 自带测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "启动打包后的 merecat，校验 merecat -V 可用、通过环回 HTTP GET 取回内容，并回归验证 world-readable 契约（0600 文件：能表达 other 位的文件系统返回 403，隐藏该位的文件系统走 access(2) 回退返回 200）"
    command: "bash test.sh"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 13
test_package_assertion_count: 3
