knowledge_gained:
  - "mbw is a single-file, dependency-free C benchmark (only libc), built by a bare Makefile rule `mbw: mbw.c` with no configure step."
  - "On OHOS the raw-make build needs the clang CC from tools.build:compiler_executables plus in-build TMPDIR/TMP/TEMP (workers lack /tmp and have no build uid in /etc/passwd)."
  - "As a tool (application package) rather than a library, the packaged `mbw` binary goes to bin/ and the consumer test must run it directly; OHOS run requires binary-sign-tool + .codesign (llvm-readelf check) like the lerc consumer."
