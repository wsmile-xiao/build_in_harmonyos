# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mbw/2
homepage: "https://github.com/raas/mbw"

# 上游测试命令（无正式测试套件，仅编译 + 运行）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无，单文件工具无测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试：执行 mbw -n 1 1024 基准测试（3 种方法 MiB/s 输出 + rc=0）"
    command: "mbw -n 1 1024"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
