# test_package/MANIFEST.yml
# 上游官方测试声明文件 (build_and_test.sh L0e 强制要求此文件存在)
package: msgpack/7.0.1
homepage: "https://github.com/msgpack/msgpack-c"

# 上游测试命令 (msgpack-c test/ 需要 GTest+ZLIB+Threads，CI 关闭 MSGPACK_BUILD_TESTS)
upstream_check_command: "ctest --test-dir build -N"
upstream_test_in_build: true
upstream_test_command: "MSGPACK_BUILD_TESTS=ON; ctest --test-dir build --output-on-failure"

# === 测试统计口径 (严格区分) ===
# - 上游测试源文件数: 5 (buffer_c.cpp, fixint_c.cpp, msgpack_c.cpp, pack_unpack_c.cpp, streaming_c.cpp)
# - 测试 executable / build target 数: 5 (add_executable 在 FOREACH 中循环展开为 5 个)
# - CTest 实际注册 test 数: 5 (add_test 在 FOREACH 中循环展开; 无 gtest_discover_tests)
#   ctest -N 确认: Total Tests: 5
# - GTest TEST/TEST_F case 数: 103 (grep -E 'TEST(|TEST_F(' 统计自源码)
#   buffer_c:4  fixint_c:1  msgpack_c:92  pack_unpack_c:4  streaming_c:2

# test/CMakeLists.txt 注册方式 (已从 7.0.1 源码实际确认):
#   L10: SET (check_PROGRAMS buffer_c.cpp fixint_c.cpp msgpack_c.cpp pack_unpack_c.cpp streaming_c.cpp)
#   L18: FOREACH (source_file ${check_PROGRAMS})
#   L19:   ADD_EXECUTABLE (...)   ← 1 处, FOREACH 展开 = 5 个 executable
#   L29:   ADD_TEST (...)         ← 1 处, FOREACH 展开 = 5 个 CTest test
#   无 gtest_discover_tests / gtest_add_tests (每个 CTest test = 1 个 executable, 内含多个 GTest case)

upstream_tests:
  - file: test/buffer_c.cpp
    source: msgpack-c-7.0.1/test/buffer_c.cpp
    description: "buffer 测试: sbuffer/zbuffer/fbuffer/vrefbuffer (4 GTest cases)"
    gtest_cases: 4
    command: "./buffer_c"
  - file: test/fixint_c.cpp
    source: msgpack-c-7.0.1/test/fixint_c.cpp
    description: "fixint 序列化测试 (1 GTest case)"
    gtest_cases: 1
    command: "./fixint_c"
  - file: test/msgpack_c.cpp
    source: msgpack-c-7.0.1/test/msgpack_c.cpp
    description: "核心 pack/unpack/object/zone 全功能测试 (92 GTest cases)"
    gtest_cases: 92
    command: "./msgpack_c"
  - file: test/pack_unpack_c.cpp
    source: msgpack-c-7.0.1/test/pack_unpack_c.cpp
    description: "pack/unpack round-trip 测试 (4 GTest cases)"
    gtest_cases: 4
    command: "./pack_unpack_c"
  - file: test/streaming_c.cpp
    source: msgpack-c-7.0.1/test/streaming_c.cpp
    description: "streaming 反序列化测试 (2 GTest cases)"
    gtest_cases: 2
    command: "./streaming_c"

# 上游测试实际编译+运行结果 (OHOS aarch64, conan gtest/1.17.0 + zlib/1.3.1.1)
# 在独立 CMake 项目中用 Conan 包依赖编译,链接 msgpack-c::msgpack-c + gtest + gtest_main + ZLIB + Threads
upstream_test_results:
  source_files: 5
  executables_built: 5
  ctest_targets: 5               # ctest -N 确认: Total Tests: 5
  gtest_cases_total: 103
  cases_passed: 101
  cases_failed: 2
  cases_skipped: 0               # 2 个失败 case 实际执行、未跳过
  failed_tests:
    - name: "buffer.fbuffer_c"
      exit_code: -6
      signal: SIGABRT
      root_cause: >-
        上游测试调用 tmpfile() 创建临时 FILE* (buffer_c.cpp:42)。
        当前执行环境 /tmp 为只读文件系统, tmpfile() 返回 NULL。
        已用纯 libc probe 验证: 默认/TMPDIR/TMP/TEMP/三者同时设置 共 5 种环境,
        tmpfile() 全部返回 NULL, errno=13 (Permission denied)。
        musl tmpfile() 固定使用 /tmp, 不检查 TMPDIR/TMP/TEMP 环境变量。
        非 msgpack 库缺陷, 属运行环境限制。
    - name: "buffer.vrefbuffer_c"
      exit_code: 1
      root_cause: >-
        同 fbuffer_c: 上游测试依赖 tmpfile() (buffer_c.cpp:125/130 断言行),
        tmpfile() 在当前执行环境返回 NULL 导致 EXPECT_TRUE(file != NULL) 断言失败。
        errno=13 (Permission denied), /tmp 只读。
        非 msgpack 库缺陷, 属运行环境限制。
  passed_tests:
    - "buffer.zbuffer_c (1 case)"
    - "buffer.sbuffer_c (1 case)"
    - "fixint_c (1 case)"
    - "msgpack_c (92 cases)"
    - "pack_unpack_c (4 cases)"
    - "streaming_c (2 cases)"

# tmpfile() 专项验证 (纯 libc probe, 未修改任何上游测试)
# probe: FILE *f = tmpfile(); 输出返回值/errno/strerror
tmpfile_probe_results:
  - env: "默认 (TMPDIR/TMP/TEMP 全 unset)"
    tmpfile_return: "NULL"
    errno: 13
    strerror: "Permission denied"
  - env: "TMPDIR -> 可写工作目录"
    tmpfile_return: "NULL"
    errno: 13
    strerror: "Permission denied"
  - env: "TMP -> 可写工作目录"
    tmpfile_return: "NULL"
    errno: 13
    strerror: "Permission denied"
  - env: "TEMP -> 可写工作目录"
    tmpfile_return: "NULL"
    errno: 13
    strerror: "Permission denied"
  - env: "TMPDIR+TMP+TEMP 同时指向可写目录"
    tmpfile_return: "NULL"
    errno: 13
    strerror: "Permission denied"

# /tmp 权限证据
tmp_evidence:
  tmp_exists: true
  tmp_permissions: "drwxr-xr-x 2 root root"
  tmp_writable: false
  touch_result: "Read-only file system (exit 1)"
  readlink: "/tmp (非符号链接)"
  conclusion: >-
    /tmp 挂载为只读文件系统。musl tmpfile() 固定使用 /tmp, 不读取环境变量。
    errno=13 与 Read-only file system 一致。
    未声称 CI Worker 一定会通过——仅在 /tmp 可写的环境上方能验证, 本次环境未能验证。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_msgpack.c
    description: "Pack [42, true, msgpack] array, unpack array object, assert 3 elements + MSGPACK_UNPACK_CONTINUE + msgpack_object_equal + msgpack_object_print_buffer"
    command: "./test_msgpack"

# 测试断言总数
assertion_count: 18
