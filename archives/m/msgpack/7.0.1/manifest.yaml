software: msgpack
version: "7.0.1"
status: built
build_date: 2026-08-24
build_system: cmake

source:
  url: "https://github.com/msgpack/msgpack-c/releases/download/c-7.0.1/msgpack-c-7.0.1.tar.gz"
  sha256: "2d80f190ab89b73b513025d8aef09b144e5c07b3734dfe99dd0137725d355504"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DMSGPACK_BUILD_TESTS=OFF"
    - "-DMSGPACK_BUILD_EXAMPLES=OFF"
    - "-DMSGPACK_GEN_COVERAGE=OFF"
    - "-DMSGPACK_ENABLE_SHARED=OFF"
    - "-DMSGPACK_ENABLE_STATIC=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "msgpack-c 7.0.1 is a real compiled C library (libmsgpack-c), NOT header-only: CMake builds src/{objectc,unpack,version,vrefbuffer,zone}.c into a static/shared lib."
  - "Upstream CMake options (confirmed from 7.0.1 CMakeLists.txt): MSGPACK_BUILD_TESTS, MSGPACK_BUILD_EXAMPLES, MSGPACK_GEN_COVERAGE, MSGPACK_ENABLE_SHARED, MSGPACK_ENABLE_STATIC, MSGPACK_32BIT, MSGPACK_CHAR_SIGN."
  - "No runtime dependencies: only the C standard library. Upstream unit tests (test/*.cpp) need GTest+ZLIB and are disabled via MSGPACK_BUILD_TESTS=OFF."
  - "CMake installs libmsgpack-c + headers (include/msgpack*) + msgpack-c.pc + cmake config (lib/cmake/msgpack-c). pkg-config name is msgpack-c."
