# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）

package: mini/0.9.20
homepage: "https://github.com/metayeti/mINI"

# 上游测试入口（上游 tests/CMakeLists.txt 只 add_executable，不注册 add_test，
# 故本配方在 build() 里用 CTest harness 复用上游 9 个可执行目标并注册 ctest；
# 下面这条与 build() 中 self.run(...) 逐字一致，日志中可见同一字面量）
upstream_check_command: "ctest --output-on-failure -V -j1"

# conanfile.py build() 方法中已集成上游测试（can_run 时不跳过）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -V -j1"

# 上游实际运行的测试程序：tests/ 下 9 个 test*.cpp -> 9 个测试可执行目标
# （lest 单头框架；用例数 = 各文件 CASE 数之和 6+1+1+9+2+5+13+2+15 = 54）
upstream_tests:
  - file: tests/testbom.cpp
    source: mINI-0.9.20/tests
    description: "UTF-8 BOM 读写（6 用例）"
    command: "./testbom.test -p"
  - file: tests/testcasesens.cpp
    source: mINI-0.9.20/tests
    description: "定义 MINI_CASE_SENSITIVE 后的键名大小写敏感行为（1 用例）"
    command: "./testcasesens.test -p"
  - file: tests/testcopy.cpp
    source: mINI-0.9.20/tests
    description: "INIStructure 拷贝构造/赋值（1 用例）"
    command: "./testcopy.test -p"
  - file: tests/testgenerate.cpp
    source: mINI-0.9.20/tests
    description: "generate() 全新生成（紧凑/pretty、键名转义、空段；9 用例）"
    command: "./testgenerate.test -p"
  - file: tests/testhuge.cpp
    source: mINI-0.9.20/tests
    description: "20 段 × 500 键 = 10000 条目的生成与读回（2 用例）"
    command: "./testhuge.test -p"
  - file: tests/testpath.cpp
    source: mINI-0.9.20/tests
    description: "std::filesystem::path 路径形态（含 u16/u32 路径；5 用例）"
    command: "./testpath.test -p"
  - file: tests/testread.cpp
    source: mINI-0.9.20/tests
    description: "读解析：注释/空白/空段/边界 8 例/畸形 2 例（13 用例）"
    command: "./testread.test -p"
  - file: tests/testutf8.cpp
    source: mINI-0.9.20/tests
    description: "UTF-8 键名/段名/值与 BOM 回写（2 用例）"
    command: "./testutf8.test -p"
  - file: tests/testwrite.cpp
    source: mINI-0.9.20/tests
    description: "惰性 write()：保留注释/格式/顺序（15 用例）"
    command: "./testwrite.test -p"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_mini_consumer.cpp
    description: "真实 INI 文本（BOM/CRLF-LF 混用/; 与 # 行/行内注释/引号/空行/
      重复键/UTF-8 值/数值与布尔字符串）解析后逐键逐值比对 + 类型转换 +
      畸形 INI 边界路径 + generate()/write() 逐字节往返（64 项显式判据）"
    command: "./mini_consumer"
  - file: test_mini_shape.py
    description: "交付形态自检 M1–M13（上游字节一致/交付清单/无二进制/许可证/
      CMake 与 pkg-config 契约/可重定位/include guard/版本一致）"
    command: "python3 test_mini_shape.py <package_folder> <generators_folder> <version>"

# 上游测试用例数（9 个测试可执行文件 / 54 个 lest CASE）
upstream_test_count: 54
upstream_test_programs: 9
upstream_test_result: "9/9 测试程序通过、54/54 lest 用例通过（ctest 汇总，实测）"

# 测试断言总数（消费者 64 + 自检 13 + 上游 54）
assertion_count: 131
