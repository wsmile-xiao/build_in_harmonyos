package: mdetect/0.5.2.6
homepage: "https://tracker.debian.org/pkg/mdetect"

# Makefile.am declares no upstream test programs; build() still runs "make check".
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []

# Consumer test executes the packaged binary's non-probing help path.
test_package_tests:
  - file: test.py
    description: "Run packaged mdetect -h and verify its usage text and successful exit."
    command: "python3 test.py <package>/bin/mdetect"
assertion_count: 2
