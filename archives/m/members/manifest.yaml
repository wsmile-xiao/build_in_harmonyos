# 软件级 manifest（members）
# 文件位置: archives/m/members/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0 §2.1 / §4.1；CI 不读取本文件（人读索引 + 交叉校验）

software: members
display: "members (list the members of a group)"
description: "Shows the members of a group: the complement of groups(1); supports primary / secondary / two-line output"
category: system
homepage: "https://salsa.debian.org/debian/members"
license: "GPL-2.0-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C++ 程序 + 裸 GNU Makefile（无 configure/CMake）；NDK clang++ / musl 下 members.cc 原样编译，无源码补丁"
    - "只在 make 命令行覆盖 CXX（上游 CXX ?= g++），编译器取自 Conan conf（R33）；CPPFLAGS 保持上游默认 -g -Wno-deprecated"
    - "不调用 make install：上游 install 写死 $(DESTDIR)/usr/bin/members 且要求目录预先存在，改在 package() 按 Conan 布局落 bin/members 与 share/man/man1/members.1"
    - "Debian 原生包（3.0 (native)），无 Debian 之外的上游；源码取清华 TUNA 的 Debian archive 镜像（与官方池同名文件 sha256 一致）"
    - "运行依赖 libc 的 getgrnam/getpwent，读取运行环境的组/用户数据库；无第三方依赖"
  common_dependencies: []

versions:
  "20080128.1-nmu3":
    status: built
    conan_ref: "members/20080128.1-nmu3"
