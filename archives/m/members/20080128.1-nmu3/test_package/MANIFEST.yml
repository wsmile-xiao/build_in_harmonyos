# test_package/MANIFEST.yml
# test_package 消费者侧测试声明（CI 脚本 build_and_test.sh 的 L0e 要求此文件）

package: members/20080128.1-nmu3
homepage: "https://salsa.debian.org/debian/members"

# Upstream test command —— 上游 Makefile 只有 members / clean / install 三个
# 目标，没有 check / test 目标。
upstream_check_command: "none"

# Upstream test suite（R51 / 如实申报，附清点证据）：
# 上游 members_20080128.1+nmu3.tar.xz 内文件：Makefile members.cc members.1
# 与 debian/（changelog control copyright dirs manpages README.Debian rules
# salsa-ci.yml source/format）。清点结论：无 tests/ 目录、无 Makefile
# check/test 目标、无 ctest/autopkgtest（debian/tests）登记。
# ⇒ 上游测试总数 = 0（不是"有测试但跑不了"，而是根本没有）；
# 执行级验证全部由 test_package 消费者程序承担。
upstream_tests_total: 0
upstream_tests_passed: 0
upstream_tests_skipped_reason: "上游不含任何测试套件（源码仅 members.cc + Makefile + man 页 + debian/ 打包目录，无 tests/、无 check 目标、无 debian/tests）⇒ 可执行总数为 0"
upstream_test_in_build: false

# test_package consumer-side tests（鸿蒙特有测试 / rule12：1 条完整消费者流程）
test_package_tests:
  - file: test_members.cpp
    description: "消费者流程：Conan 消费 members 包 → OHOS 工具链编译 test_members.cpp → 运行；程序把 members 当被测对象 fork/exec，并用同一 musl libc 的 getgrgid/getgrnam/getpwent 独立算出期望，逐项比对 --help / 无参数 / 不存在的组 的退出码与 stderr，以及真实组的 -s/-p/-t/-a/缺省/长选项输出"

# 鸿蒙特有测试数（消费者用例数）
ohos_specific_tests: 1

# 断言条数：固定断言 7 条（可执行位 / --help ×2 / 无参数 / 不存在的组 ×3）
# + 每个被比对的组 14 条；本地 qemu 实跑比对了 root、sudo 两个组：
# 7 + 14×2 = 35（运行时打印 checks=35 failed=0）。组数取决于运行环境的组数据库。
assertion_count: 35
