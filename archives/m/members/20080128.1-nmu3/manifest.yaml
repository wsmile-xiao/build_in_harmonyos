# 版本级 manifest（members 20080128.1-nmu3）
# 文件位置: archives/m/members/20080128.1-nmu3/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0 §2.2 / §4.2；CI 不读取本文件（交叉校验用）

version: "20080128.1-nmu3"
software: "members"

# finish 会以实测判决改写本字段
status: built

build_date: "2026-10-01"
build_system: "makefile"
conan_ref: "members/20080128.1-nmu3"

source:
  # Debian 原生包（3.0 (native)），无 Debian 之外的独立上游发布位；
  # 取清华 TUNA 的 Debian archive 镜像，与官方池同名文件 sha256 一致
  url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/m/members/members_20080128.1+nmu3.tar.xz"
  sha256: "a60f2bec44ec3909aeedef64db2a674c305c075f933a7ae1f3a2fb05cee4d381"
  tar_format: tar.xz

build:
  system: makefile
  # 适配点全部走 make 命令行变量覆盖，不改上游源文件、无补丁
  configure_options:
    - "CXX（取自 Conan conf tools.build:compiler_executables，覆盖上游 CXX ?= g++）"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 Makefile 形如 `CXX ?= g++` / `CPPFLAGS ?= -g -Wno-deprecated` 时，交叉编译只需 make 命令行覆盖 CXX：`?=` 赋值会被命令行变量覆盖，隐式规则 $(CXX) $(CXXFLAGS) $(CPPFLAGS) -c 不需要任何补丁（ref: 本包 conanfile.py build()，notes.md「编译步骤」）"
  - "Debian 原生包（debian/source/format=3.0 (native)）没有 Debian 之外的上游发布位；pool 里的 tar.xz 即完整源，PF7 拦截 deb.debian.org 时可取同路径同文件的权威高校镜像（如清华 TUNA），sha256 须与官方池实测一致（ref: notes.md「源 URL」）"
