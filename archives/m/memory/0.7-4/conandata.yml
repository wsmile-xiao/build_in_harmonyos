# conandata.yml - memory 0.7-4 (foonathan/memory)

sources:
  url:
    - "https://github.com/foonathan/memory/archive/refs/tags/v0.7-4.tar.gz"
  sha256: "e6b532c78022709dcf8ae3db9cad0d687df12ec67141f688a01a1abd82ed2810"

patches:
  - patch_file: "patches/0001-cmakelists-ohos-platform-branch.patch"
    patch_description: "CMakeLists: recognize OHOS/HarmonyOS/OpenHarmony in the UNIX install-dir branch (CMake 4.x does not treat HarmonyOS as UNIX)"
    patch_type: "portability"
  - patch_file: "patches/0002-posix-memalign-malloc_allocator.hpp.patch"
    patch_description: "malloc_allocator: use posix_memalign on unix/OHOS because malloc is not guaranteed max-aligned"
    patch_type: "portability"
  - patch_file: "patches/0003-posix-memalign-heap_allocator.cpp.patch"
    patch_description: "heap_allocator: use posix_memalign on unix/OHOS for max-aligned allocation"
    patch_type: "portability"
  - patch_file: "patches/0004-posix-memalign-new_allocator.cpp.patch"
    patch_description: "new_allocator: use posix_memalign on unix/OHOS and promote zero-byte requests to 1"
    patch_type: "portability"
  - patch_file: "patches/0005-test-find-package-doctest.patch"
    patch_description: "test suite: replace FetchContent network download of doctest with find_package(doctest) provided by Conan"
    patch_type: "conan"
