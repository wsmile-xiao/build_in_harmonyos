# test_package/MANIFEST.yml — memory 0.7-4
package: memory/0.7-4
homepage: "https://github.com/foonathan/memory"

# 上游官方测试：test/CMakeLists.txt 使用 doctest（find_package，FetchContent 已由补丁 0005 改为 Conan 依赖）
# 将 20 个源文件（其中 19 个含 42 个 TEST_CASE，另有 doctest 入口 test.cpp）链接为 foonathan_memory_test 并注册为一个 CTest。
upstream_check_command: "cmake -S . -B build -DFOONATHAN_MEMORY_BUILD_EXAMPLES=OFF -DFOONATHAN_MEMORY_BUILD_TESTS=ON -DFOONATHAN_MEMORY_BUILD_TOOLS=ON && cmake --build build --parallel 1 && ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

# 上游测试程序由下列 20 个源文件（含 doctest 入口 test.cpp；其中 19 个含 42 个 TEST_CASE）链接为 foonathan_memory_test。
