# 上游实际测试程序
upstream_tests:
  - file: cdk/*/tests/*.cc
    source: mysql-connector-cpp-26.7.0/cdk/*/tests/*.cc
    description: "Google Test based unit tests in cdk/*/tests/"
    command: "./run_unit_tests --gtest_list_tests"
  - file: common/tests/*.cc
    source: mysql-connector-cpp-26.7.0/common/tests/*.cc
    description: "Google Test based unit tests in common/tests/"
    command: "./run_unit_tests"

# test_package 中自带的消费者测试（实际运行）
test_package_tests:
  - file: test_package.c
    description: "Consumer smoke test: mysqlx_session_options_new() + mysqlx_free() — verifies X DevAPI for C API compiles, links, and runs without MySQL Server"
    command: "./test_mysql-connector-c"
    result: "1/1 passed (compile RC=0, link RC=0, run RC=0)"

# 测试断言总数
assertion_count: 210
