# 版本级 manifest
# 文件位置: archives/m/mpich/5.0.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.0.1.1"

# 软件名
software: mpich

# 编译状态
# published | built | failed | archived
# built=本地验证通过未 upload；CI upload 成功后置为 published
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-15"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 conandata.yml 一致；上游 pmodels/mpich 只有 v5.0.1 tag，
  # 5.0.1.1 为适配修订版号，源码即官方 mpich-5.0.1.tar.gz）
  url: "https://github.com/pmodels/mpich/releases/download/v5.0.1/mpich-5.0.1.tar.gz"

  # 源码校验和
  sha256: "8c1832a13ddacf071685069f5fadfd1f2877a29e1a628652892c65211b1f3327"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表（与 conanfile.py _configure_args 一致）
  configure_options:
    - "--prefix=/"
    - "--disable-fortran"
    - "--disable-cxx"
    - "--disable-romio"
    - "--with-device=ch3:sock"
    - "--with-pm=gforker"
    - "--with-pmi=pmi1"
    - "--with-pmilib=install"
    - "--with-hwloc=no"
    - "--with-wrapper-dl-type=none"
    - "--with-datatype-engine=dataloop"
    - "--enable-fast=all"
    - "--enable-g=none"
    - "--enable-shared"
    - "--disable-static"
    - "--build=aarch64-unknown-linux-gnu"

  # 编译依赖列表（tool_require，格式: name/version）
  dependencies:
    - perl/5.42.2

  # 编译器（OHOS clang 工具链）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无外部 .patch 文件；适配改动全部内嵌在 conanfile.py 中：
#  1) 构建期对 configure 脚本做 umask 077->002 与 /bin/bash->bash 路径替换（E002 临时目录修复）
#  2) 打包期重写 mpicc/mpicxx/mpifort wrapper 中写死的 --prefix=/ 为包内相对路径
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 验证结果（2026-08-15 本轮）
verification:
  conan_create:
    date: "2026-08-15"
    status: passed
    command: "conan create archives/m/mpich/5.0.1.1 -o mpich/*:shared=True -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"
    recipe_revision: "mpich/5.0.1.1#9c922d10c88252fd894a5f836aacfe30"
    package_revision: "01d92cf349a0dd98ff915f4bd99a04430171517f#648de0c040713cb2544bcc85e6ea32c4"
    log: "reports/conan-create-20260815.log"
  test_package_smoke:
    status: passed
    detail: "mpiexec -n 2 ./test_mpi 通过，MPI_Comm_rank/size、MPI_Allreduce 求和、MPICH 版本字符串均正确（2 ranks）"
  upstream_tests:
    date: "2026-08-15"
    log: "reports/upstream-tests-20260815.log"
    scope: "basic + comm + coll + pt2pt（C 绑定；GPU/HIP/Fortran/C++ 已 --disable 类别排除）"
    executed: 345
    passed: 345
    failed: 0
    skipped: 11
    pass_rate: "100.00%"
    skip_reasons:
      - "coll/gather_big (mem=20.1)、coll/coll_large (mem=80/100)：testlist 声明内存需求超出设备可用预算（~11GB），跳过避免 OOM"
      - "pt2pt/issendselfcancel、scancel、scancel2、pscancel、cancelrecv、scancel_unmatch：上游 testlist 标记 xfail=ticket2266/2276（上游已知失败），按上游 runtests 惯例跳过"

# 编译中学到的实战知识
knowledge_gained:
  - "E002: HarmonyOS /tmp 是只读 erofs，且 mktemp -d 以 umask 077 建的 0700 临时目录在本平台不可写（Permission denied）。解决：TMPDIR 指向构建目录 + 把 configure/config.guess 中的 'umask 077' 全部替换为 'umask 002'，让 mktemp 创建 2771 组可写目录。"
  - "HarmonyOS 无 /bin/bash，autoconf 生成的脚本 shebang '#!/bin/bash' 会报 bad interpreter；构建期需把相关脚本首行改写为实际 bash 路径（如 /data/service/hnp/bin/bash）。"
  - "上游 pmodels/mpich 只有 v5.0.1 tag，没有 5.0.1.1；5.0.1.1 是适配修订版号，源码直接使用官方 5.0.1 tarball（sha256 一致），末尾 .1 用于满足 R37 四段版本号规则向 cnb.cool 发布修订版配方。"
  - "MPICH 老式 mpiexec（--with-pm=gforker + ch3:sock）不支持 --version/-V（打印 'invalid mpiexec argument'），MPIEXEC_TIMEOUT 是 hydra 专用环境变量，超时需用外部 timeout 工具。"
  - "configure 使用 --prefix=/ 打包后，mpicc wrapper 内写死 prefix=/，必须按包根相对路径重写，否则 test_package 拿到错误的 include/lib 路径。"
  - "共享库构建下运行测试/冒烟需设置 LD_LIBRARY_PATH=<package>/lib，否则 musl 加载器报 'Error loading shared library libmpi.so.12'。"
