package: mpich/5.0.1.2
homepage: "https://www.mpich.org/"

files:
  - CMakeLists.txt
  - cmake_c_consumer.c
  - cmake_fortran_driver.c
  - cmake_fortran_probe.f90
  - conanfile.py
  - test.c
  - test.cxx
  - test_mixed.c
  - test_mixed.f90
  - test_mpifh.f
  - test_nwchem_mpif4_bridge.f
  - test_pmi_malformed_abort.c
  - test_process_control.c
  - test_use_mpi.f90

upstream_check_command: "make -j1 testing"
upstream_test_in_build: true
upstream_test_command: "make -j1 testing"

test_package_tests:
  - file: test.c
    description: "Compile with mpicc and run a two-rank C allreduce"
    command: "mpiexec -n 2 test_mpi_c"
  - file: test.cxx
    description: "Compile and run the MPI C API through the mpicxx wrapper"
    command: "mpiexec -n 2 test_mpi_cxx"
  - file: test.cxx
    description: "Compile through the mpic++ alias and run two ranks through mpirun"
    command: "mpirun -n 2 test_mpi_cpp_alias"
  - file: test_mpifh.f
    description: "Compile and run the mpif.h interface with four-byte MPI integers"
    command: "mpiexec -n 2 test_mpifh"
  - file: test_use_mpi.f90
    description: "Compile and run the mpi module with four-byte MPI integers"
    command: "mpiexec -n 2 test_use_mpi"
  - file: test_mixed.c + test_mixed.f90
    description: "Use one communicator through C and Fortran with four-byte MPI_Fint"
    command: "mpiexec -n 2 test_mixed"
  - file: test_nwchem_mpif4_bridge.f
    description: "Run an NWChem-style i8 core through the four-byte mpif.h MPI boundary"
    command: "mpiexec -n 2 test_nwchem_mpif4_bridge"
  - file: cmake_c_consumer.c
    description: "Build and run a C consumer through the generated MPI::MPI_C target"
    command: "Build and run cmake_mpi_c against the original prefix, then rebuild and run cmake_mpi_c_relocated against rebased CMakeDeps metadata"
  - file: cmake_fortran_driver.c + cmake_fortran_probe.f90
    description: "Link a precompiled Fortran object with a C linker through MPI::MPI_Fortran"
    command: "Build and run cmake_mpi_fortran against the original prefix, then rebuild and run cmake_mpi_fortran_relocated with a relocated mpifort object and rebased CMakeDeps metadata"

# Relocated repeats are evidence variants, not additional independent flows.
independent_test_count: 9

internal_negative_checks:
  - "Reject missing, relative, multi-token, nonexistent, and mismatched tools.build:compiler_executables c/cpp bindings without ambient PATH fallback"
  - "Poison all compiler/profile/Hydra/loader overrides for both prefixes"
  - "Reject absolute, escaping, cyclic symlinks and external hardlinks"
  - "Reject one-rank execution for both prefixes"
  - "Require default abort and disable-auto-cleanup timeout to leave zero residue"
  - "Reject missing, nonnumeric, empty, trailing-junk, range-overflow, above-int, below-int, and tab/CR/VT/FF raw PMI abort exit codes"
  - "Require valid raw PMI abort INT_MIN and INT_MAX controls to terminate under disable-auto-cleanup before a delayed survival canary"
  - "Kill setsid double-fork descendants through TERM and KILL paths without canaries"
  - "Hide relocated hydra_pmi_proxy, all relocated libmpi.so artifacts, and all relocated libpmi.so artifacts"
  - "Rebase generated CMakeDeps package paths transactionally and reject original-prefix link records for both relocated CMake consumers"
