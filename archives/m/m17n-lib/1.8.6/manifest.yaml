  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-intl-lock.h.patch"
  - "0005-intl-plural.c.patch"
  - "0006-src-Makefile.am.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS 的 libintl.so.8.proxy 使用符号重命名（如 g_libintl_dgettext），与标准 libintl 符号不兼容"
  - "解决方案：静态链接 libintl.a 到共享库，避免运行时依赖不兼容的系统 libintl.so"
  - "技术原理：--with-included-gettext 编译内嵌的 libintl.a，然后修改 Makefile.am 添加 LIBADD 和 DEPENDENCIES"
  - "修改位置：src/Makefile.am 添加 libm17n_core_la_LIBADD 和 libm17n_core_la_DEPENDENCIES 指向 intl/libintl.a"
  - "适用场景：HarmonyOS 上遇到 libintl 符号不兼容时的通用解决方案"

