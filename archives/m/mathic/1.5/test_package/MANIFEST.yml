package: mathic/1.5
homepage: "https://github.com/Macaulay2/mathic"

upstream_tests_exist: true

upstream_test_audit:
  source_tarball: "v1.5.tar.gz (Macaulay2/mathic tag v1.5)"
  source_sha256: "6bd2fd41d95efb0bf599aa5c6bc406f0d6fff803fccfe854db4835041c6267ee"
  build_system: "CMake (autotools 并存，本包只走 CMake)"
  test_definition: >
    src/CMakeLists.txt 在 if(BUILD_TESTING) 内编译 mathic-unit-tests
   （src/test/BitTriangle.cpp、DivFinder.cpp、HashTable.cpp、
    PairQueue.cpp、testMain.cpp），经
    gtest_discover_tests(mathic-unit-tests TEST_PREFIX unit-tests:)
    展开为 CTest 用例。计数单位为 gtest TEST 宏，与 CTest 注册数一致。
  per_file_test_macros: "BitTriangle.cpp 3 / DivFinder.cpp 1 / HashTable.cpp 2 / PairQueue.cpp 8 / testMain.cpp 0（仅 main）"
  gating: "四个测试 TU 通读无 #if/#ifdef/#ifndef 门控，无注释掉的 TEST("
  dependency: "gtest（上游找不到则 FetchContent git clone v1.16.0；本包用 test_requires gtest/1.17.0.1 补齐）"
  portability_changes:
    - "0001: include(CTest) 从 src/ 子目录提到顶层，否则 build 根目录 ctest 零执行却全绿"
    - "0002: GTEST_FOUND 恒假改写为 GTest_FOUND OR GTEST_FOUND OR TARGET GTest::gtest，并换用 GTest::gtest"

upstream_check_command: "ctest -N + ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "build() 内 ctest --output-on-failure 全量实跑上游 gtest 套件（14 个 CTest 用例 = 14 个 TEST 宏）"

upstream_tests:
  - file: "src/test/BitTriangle.cpp + src/test/DivFinder.cpp + src/test/HashTable.cpp + src/test/PairQueue.cpp"
    source: "mathic-1.5/src/test/*.cpp"
    description: "全部测试 TU，由 src/CMakeLists.txt 的 add_executable(mathic-unit-tests ...) 编译，经 gtest_discover_tests 展开为 14 个独立 CTest 用例（BitTriangle 3、DivFinder 1、HashTable 2、PairQueue 8）。testMain.cpp 仅提供 main()，不计入。"
    command: "ctest --output-on-failure"

upstream_test_total: 14
upstream_test_count_method: gtest_macros
upstream_test_passed: 14
upstream_test_failed: 0
upstream_test_count: 14

test_package_tests:
  - file: test_mathic.cpp
    scenario: "consumer-api"
    description: >
      消费者测试 6 组：安装布局（伞头文件 mathic.h + 三核心头 + extern C 探测符号 +
      MATHIC_VERSION_STRING）；BitTriangle 三角位矩阵 set/get/unordered 全量复核；
      HashTable int/string 键插入查询；PairQueue S-pair 入列出列排序；
      鸿蒙特有 A —— sizeof(void*)==8 且 MemoryAlignment==8、BitTriangle 64 列
      确定性增长；鸿蒙特有 B —— 4 个 bionic std::thread 各持私有 BitTriangle
      做确定性 LCG 写入，校验和与单线程参考逐位一致。
    command: "./test_mathic"
    assertions: 6

assertion_count: 6
