software: mathic
display: "mathic"
description: "C++ library of fast data structures for Groebner basis computation"
category: library
homepage: "https://github.com/Macaulay2/mathic"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 单构建（上游另有 autotools，本仓只走 CMake）"
    - "运行时依赖 memtailor/1.4：generate() 预置 MEMTAILOR_INCLUDE_DIR/MEMTAILOR_LIBRARIES 命中上游 FindMemtailor.cmake"
    - "测试期 test_requires gtest/1.17.0.1，并打补丁绕开上游 FetchContent 联网分支"
    - "include(CTest) 必须在顶层生效，否则 build 根目录 ctest 零执行却全绿"
  common_dependencies:
    - memtailor

versions:
  "1.4":
    status: built
    build_date: "2026-09-24"
