software: mathic
version: "1.4"
build_system: cmake
status: built
build_date: "2026-09-24"
conan_ref: "mathic/1.4"

source:
  url: "https://github.com/Macaulay2/mathic/archive/refs/tags/v1.4.tar.gz"
  sha256: "6af7df540751de13456ba6c21bf8d06f84d4c43cd2c8c2695ba4b820e2d72883"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_TESTING=ON（上游 src/CMakeLists.txt 用 if(BUILD_TESTING) 门控测试目标）"
    - "enable_pqsim=OFF / enable_divsim=OFF（保持纯库产物）"
    - "静态库（package_type=static-library）"
  dependencies:
    - "memtailor/1.4（requires，运行时：HashTable/PairQueue 头直接包含 memtailor.h）"
    - "gtest/1.17.0.1（test_requires，仅测试）"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt-toplevel-ctest-and-install-static.patch: (a) include(CTest)/enable_testing() 从 src/ 子目录提到顶层，否则 build 根目录 ctest 得到 'No tests were found!!!' 且退出码 0；(b) install(TARGETS) 补 ARCHIVE DESTINATION lib，并显式安装伞头文件 src/mathic.h"
  - "0002-src-CMakeLists.txt-conan-gtest-targets.patch: (a) if(GTEST_FOUND) 的全大写变量在 CONFIG 模式下恒未定义（CMakeDeps 只设 GTest_FOUND）→ 条件恒假 → configure 期 FetchContent git clone googletest 失败；改为 GTest_FOUND OR GTEST_FOUND OR TARGET GTest::gtest 并以 target 存在性兜底。(b) 旧式 target 名 GTest::GTest/GTest::Main 换成 Conan gtest/1.17.0.1 声明的 GTest::gtest（不链 gtest_main：testMain.cpp 自带 main）"
  - "0003-test-O1-cap-compile-memory.patch: 串行 -j1 后仍 /bin/sh: Out of memory，仅把非交付物 mathic-unit-tests 封顶到 -O1 压单进程 clang 峰值内存；测试源码与断言不变，libmathic.a 保持 Release"

upstream_tests_exist: true
upstream_test_audit: "mathic 1.4：Macaulay2/mathic tag v1.4（源码包 v1.4.tar.gz，sha256 6af7df54...2d72883）。src/test/ 四个 TU 共 14 个 TEST 宏（BitTriangle 3、DivFinder 1、HashTable 2、PairQueue 8，testMain.cpp 仅 main），无 #ifdef 门控；经 gtest_discover_tests 展开为 14 个 CTest 用例。conanfile build() 以 BUILD_TESTING=ON 真实构建 mathic-unit-tests 并执行 ctest --output-on-failure。HMBS 盘点口径为 gtest_macros=14"
upstream_test_total: 14
upstream_test_count_method: gtest_macros
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true

knowledge_gained:
  - "第 4 轮证伪记录：E191（STATIC_LIBRARY 绕过）与 E557（libxml2 宿主运行时门控）生效后均在顶层 project() 同位置复现失败——同属链接/宿主运行时假设族，已禁用；上游 mathic 在 project() 前无任何特有逻辑，同构 memtailor 以极简配方同环境通过，profile 本就全局导出 llvm/lib；门撤销回极简形态，证据收集改为 CMake 4 全覆盖（CMakeConfigureLog.yaml 优先），下轮不再失明"
  - "上游 include(CTest) 写在 src/CMakeLists.txt（子目录）里 → enable_testing() 只对 build/src/ 生效，在 build 根目录跑 ctest 得到 'No tests were found!!!' 且退出码 0（零执行却全绿）；判定 ctest 结果必须解析注册与逐行结果而不能只看退出码"
  - "find_package(GTest) 走 CONFIG 模式时只设置 GTest_FOUND；上游判空用的全大写 GTEST_FOUND 只有 MODULE 模式才会设置 → if(GTEST_FOUND) 恒假 → 落到 else() 在 configure 期 FetchContent git clone googletest（CI worker 不可联网）"
  - "上游 install(TARGETS mathic LIBRARY DESTINATION lib) 只声明 LIBRARY：静态库属 ARCHIVE 类别不会被安装；伞头文件 src/mathic.h 只挂 PUBLIC_HEADER 属性、无对应 DESTINATION 同样漏装"
  - "上游 FindMemtailor.cmake 用 find_path/find_library 探测；Conan 侧在 generate() 预置 MEMTAILOR_INCLUDE_DIR/MEMTAILOR_LIBRARIES 即可命中，无需改上游查找逻辑"
  - "mathic 消费者必须同时链接 -lmathic -lmemtailor -pthread（HashTable.h/PairQueue.h 直接包含 memtailor.h，上游 target_link_libraries(mathic memtailor Threads::Threads)）"
