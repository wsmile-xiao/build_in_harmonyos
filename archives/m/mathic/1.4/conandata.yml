sources:
  "1.4":
    url: "https://github.com/Macaulay2/mathic/archive/refs/tags/v1.4.tar.gz"
    sha256: "6af7df540751de13456ba6c21bf8d06f84d4c43cd2c8c2695ba4b820e2d72883"
patches:
  "1.4":
    - patch_file: "patches/0001-CMakeLists.txt-toplevel-ctest-and-install-static.patch"
      patch_description: "两处打包/测试缺陷：(a) 上游 include(CTest) 写在 src/ 子目录里，enable_testing() 只对 build/src 生效，在 build 根目录跑 ctest 得到 'No tests were found!!!' 且退出码 0 → 提到顶层；(b) install(TARGETS mathic LIBRARY DESTINATION lib) 只声明 LIBRARY，静态库(.a)不安装，且伞头文件 src/mathic.h 只挂 PUBLIC_HEADER 属性、无对应 DESTINATION 而漏装 → 补 ARCHIVE 并显式安装伞头文件"
      patch_type: "portability"
    - patch_file: "patches/0002-src-CMakeLists.txt-conan-gtest-targets.patch"
      patch_description: "两处必须同时修：(a) 上游 if(GTEST_FOUND) 的全大写变量在 CONFIG 模式下恒未定义（CMakeDeps 只设 GTest_FOUND）→ 条件恒假 → configure 期 FetchContent git clone googletest 失败；改为 GTest_FOUND OR GTEST_FOUND OR TARGET GTest::gtest，以 target 存在性兜底；(b) 旧式 target 名 GTest::GTest/GTest::Main 换成 Conan gtest/1.17.0.1 声明的 GTest::gtest（不链 gtest_main：testMain.cpp 自带 main）"
      patch_type: "conan"
    - patch_file: "patches/0003-test-O1-cap-compile-memory.patch"
      patch_description: "真机 /bin/sh: Out of memory 在串行 -j1 后仍复现：仅把非交付物 mathic-unit-tests 的编译优化封顶到 -O1（后出现的 -O1 覆盖 Release -O3），压住模板+ gtest 头的单进程 clang 峰值内存；测试源码与断言不变，交付的 libmathic.a 保持 Release 优化"
      patch_type: "portability"
