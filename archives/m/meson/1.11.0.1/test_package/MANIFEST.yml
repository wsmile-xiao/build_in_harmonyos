package: meson/1.11.0.1
homepage: "https://github.com/mesonbuild/meson"

# 上游测试入口（run_tests.py 依次驱动 run_meson_command_tests.py、
# run_unittests.py、run_project_tests.py）。主 conanfile.py 的 build()
# 已集成上游单元测试全量（pytest 驱动 run_unittests.py，647 项，实测
# pytest-xdist 并行 20 核 ~8.5 分钟；全量串行需 80+ 分钟超出 CI 2700s
# 预算，并行后远在预算内），故 upstream_test_in_build: true；
# test_package 的 test() 执行 meson --version 与 test_meson.py 冒烟检查，
# 作为消费者视角验证。
# run_project_tests.py 因需完整构建矩阵且大量用例依赖 gcc/ninja
# 特定版本等平台前置条件，未在 CI 构建链路全量运行。
upstream_check_command: "./run_tests.py"

upstream_test_in_build: true
upstream_test_command: "python3 run_unittests.py"

upstream_tests:
  - file: "run_unittests.py"
    source: "run_unittests.py"
    description: "meson 单元测试套件全量（unittests/*tests.py，pytest 收集 647 项；build() 内 pytest-xdist 并行运行）"
    command: "python3 run_unittests.py"
  - file: "run_meson_command_tests.py"
    source: "run_meson_command_tests.py"
    description: "meson 命令行冒烟测试（5 项：1 pass / 2 error / 1 skip / 1 skip-win）"
    command: "python3 run_meson_command_tests.py -v"
  - file: "run_project_tests.py"
    source: "run_project_tests.py"
    description: "meson 项目测试矩阵（test cases/ 全平台构建用例，需 gcc/ninja 完整工具链，本地未全量运行）"
    command: "python3 run_project_tests.py"

test_package_tests:
  - file: "test_meson.py"
    description: "verify meson executable works (meson --version)"
    command: "python3 test_meson.py"

# 真实统计来源：OHOS/aarch64 (Python 3.12.9, pytest-xdist 20 核并行)
# 实跑 `python3 run_unittests.py`（等价 pytest -n auto unittests）：
# pytest 收集 647 项（514 passed / 125 skipped / 12 个失败测试用例；
# pytest 报告 14 条失败行，其中 test_templates 的 4 个 objcpp 子测试
# 被分别计数），通过率 514/(514+12)=97.72%；12 个测试用例失败均为
# 平台环境性失败，逐项根因见 conanfile.py ALLOWED_TEST_FAILURES 注释。
#
# 根因修复 1（posix_spawn PATH）：OHOS 版 CPython 因 _IS_HARMONYOS
# 强制 subprocess 走 posix_spawn 快速路径，而 posix_spawn 不做 PATH
# 解析，测试子进程按相对名（cc/gcc/clang/ninja）启动工具时报 ENOENT——
# 这正是此前 285 个失败（41.9%）的根因。配方 build() 内通过
# sitecustomize 强制 subprocess._USE_POSIX_SPAWN=False（走 fork/exec，
# execvpe 解析 PATH），并注入 hnp 工具链桥接符号链接与
# CC/CXX/AR/RANLIB/NINJA 环境变量，修复后 285 个失败已消除。
#
# 根因修复 2（git dubious ownership）：OHOS 沙箱中仓库目录属主与进程
# uid 不一致，git ≥2.35 默认拒绝访问（"dubious ownership"），导致
# test_wrap_git / test_git_update / test_purge / test_foreach /
# test_dist_git 等 8 项 git 类用例失败（exit 128）。build() 通过
# GIT_CONFIG_COUNT/KEY/VALUE 环境变量注入 safe.directory=* 放行，
# 修复后 git 类用例全过，全量失败从 24 项降至 12 个测试用例。
assertion_count: 647

# R9 允许失败清单：与 conanfile.py 的 ALLOWED_TEST_FAILURES 保持一致。
# 以下用例在 OHOS 平台为已知环境性失败（非 meson 适配缺陷）；build()
# 中全量测试退出码非 0 时，仅当失败用例全部落在此清单内才放行构建，
# 清单外失败将抛 ConanException 使 conan create 失败，杜绝"测试失败但
# 构建成功"的状态脱节。
expected_failures:
  - "test_clang_tidy_fix"
  - "test_preprocessor_checks_CPPFLAGS"
  - "test_reconfigure"
  - "test_install_umask"
  - "test_installed_modes"
  - "test_installed_modes_extended"
  - "test_run_installed"
  - "test_native_file_is_pipe"
  - "test_config_tool_dep"
  - "test_update_wrapdb"
  - "test_templates"
  - "test_noop_changes_cause_no_rebuilds"
  - "test_target_add"
  - "test_target_add_extra_files"
  - "test_target_add_sources"
  - "test_target_remove_extra_files"
