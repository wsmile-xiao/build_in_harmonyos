software: mp3check
display: "mp3check — MPEG audio file consistency checker"
description: "Check audio MPEG layer 1/2/3 (*.mp3) files for header/CRC consistency and anomalies, and list per-file parameters"
category: media
homepage: "https://code.google.com/archive/p/mp3check/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Builds the official 0.8.7 release tarball with no source patches"
    - "Plain Makefile project: upstream configure is a no-op (echoes TARGET only), build directly with make"
    - "Overrides the Makefile's hardcoded g++ with profile clang++ via command-line CXX only (CC is NOT passed, so the Makefile's CC=$(CXX) alias holds and the implicit link rule links via the C++ driver clang++, auto-linking libc++/libc++abi — passing CC=clang would break the alias and leave libc++ EH symbols undefined)"
    - "Uses -std=c++98 to accept the placement-new constant-expression pattern in tstring.cc"
    - "Uses make -j1 to avoid races in the dependency-generation rule on first build"
    - "No upstream test suite; test_package provides consumer-side CLI/valid/invalid/path assertions"
    - "Test fixtures are synthesized in-test from documented MPEG header bytes via open(path,'wb') (conan save() is str-only), no opaque binary committed"
  common_dependencies: []

versions:
  "0.8.7":
    status: published
    build_date: "2026-08-30"
    conan_ref: "mp3check/0.8.7"
    upstream_identity: valid
    note: "Google Code archive release; sha256 cross-verified against Homebrew, Debian dsc (GPG-signed), and PureOS; conan create CI passed on OHOS AArch64 musl (link via Makefile CC=$(CXX) alias to clang++, -std=c++98 for tstring.cc placement-new)"
