# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mp3check/0.8.7
homepage: "https://code.google.com/archive/p/mp3check/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# mp3check 的 Makefile 仅有 all/clean/install/install-strip 三个目标，
# 无 check/test/tap/regress 目标，亦无 test_* 源文件 (穷举核查证据见 notes.md)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试套件 (Makefile 无 check 目标, 源码树无 test 文件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 全部在 test_package/conanfile.py 的 test() 方法中执行
test_package_tests:
  - file: conanfile.py
    description: "CLI 可运行: mp3check --version 退出 0 并打印版本行"
    command: "mp3check --version"
    expected_exit: 0
  - file: conanfile.py
    description: "正常/可解析输入: 6 帧最小 MPEG-1 L3 流被 --show-valid 判定为 valid audio mpeg stream"
    command: "mp3check -e --show-valid valid6.mp3"
    expected_exit: 0
    expected_output_contains: "valid audio mpeg stream"
  - file: conanfile.py
    description: "非法输入: 非 MP3 字节串被判定为 not an audio mpeg stream (grep 守卫断言)"
    command: "mp3check -e garbage.bin | grep -q 'not an audio mpeg stream'"
    expected_exit: 0
  - file: conanfile.py
    description: "非法路径: 不存在的路径触发 can't stat file 诊断 (grep 守卫断言)"
    command: "mp3check -e /no/such/file/here.mp3 | grep -q 'can.t stat file'"
    expected_exit: 0

# 测试 fixture 说明
fixtures:
  - name: valid6.mp3
    description: "6 个连续 MPEG-1 L3 128kbps 44.1kHz 帧 (2502 字节), 满足 MIN_VALID=6"
    generation: "test 时由 conanfile.py generate() 从文档化的头部字节 0xFF 0xFB 0x90 0x00 合成, 不提交二进制"
  - name: garbage.bin
    description: "纯 ASCII 非 MP3 负载, 永不 sync 于 0xFFF"
    generation: "test 时合成"
  - name: empty.mp3
    description: "空文件, 触发 'empty file' 诊断路径"
    generation: "test 时合成"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
