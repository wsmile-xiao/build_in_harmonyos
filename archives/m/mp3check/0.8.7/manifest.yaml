software: mp3check
# 版本级 manifest 模板
# 文件位置: archives/m/mp3check/0.8.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.7"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: makefile

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (Google Code 官方归档下载)
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/mp3check/mp3check-0.8.7.tgz"

  # 源码校验和 (Homebrew / Debian dsc / PureOS 三源交叉验证一致)
  sha256: "27d976ad8495671e9b9ce3c02e70cb834d962b6fdf1a7d437bb0e85454acdd0e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表 (configure 为空操作, 仅 echo TARGET; 直接 make 构建)
  configure_options: []

  # 编译依赖列表 (独立 C++ 程序, 仅依赖 libc/libm)
  dependencies: []

  # 编译器 (来自 Conan profile, 非裸 shell 环境变量)
  cc: clang
  cxx: clang++

  # 额外编译选项
  # 上游使用 placement-new 常量表达式模式, 需 -std=c++98 关闭 C++17 硬错误
  extra_flags:
    cxx: "-std=c++98"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表 (无需源码补丁; 构建问题通过 CXXFLAGS 解决)
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Plain Makefile 项目: configure 脚本仅 echo TARGET, 无需运行, 直接 make 构建"
  - "Makefile 硬编码 CXX=g++; 通过命令行 CXX=clang++ 覆盖 (不传 CC, 令 Makefile 的 CC=$(CXX) 别名生效, 使隐式链接规则走 C++ 驱动自动链接 libc++/libc++abi), 无需打补丁 (R33)"
  - "源码使用 placement-new 常量表达式模式 (tstring.cc), 现代 clang C++17 默认拒绝, 需 -std=c++98"
  - "依赖生成规则首次构建时生成 .dep.* 文件, 须 -j1 串行构建避免竞态"
  - "上游无 check/test 目标, 亦无 test 源文件 (穷举核查); 消费者测试由 test_package 提供"
  - "流识别需 MIN_VALID=6 个连续同常量头帧; test fixture 从文档化头部字节 0xFF 0xFB 0x90 0x00 合成 (R7)"
  - "License 为 GPL-2.0-or-later: COPYING 是 GPLv2 文本, 版权声明含 'or (at your option) any later version'"
