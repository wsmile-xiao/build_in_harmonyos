knowledge_gained:
  - "MariaDB 11.8.8 uses CMake 3.12+, C++17 standard"
  - "OHOS requires OHOS=True CMake variable for platform-specific code paths"
  - "OHOS does not support symlinks - all create_symlink must be replaced with copy"
  - "OHOS CHECK_FUNCTION_EXISTS may report functions available that aren't in runtime"
  - "MariaDB needs pre-downloaded PCRE2 and fmt (GitHub TLS fails on OHOS)"
  - "no_copy_source=True needed to avoid OOM during source extraction"
  - "MariaDB's CMake Client component includes minbuild-excluded utility executables; the default server-test build packages only the Connector/C library and development headers"
  - "bundled wolfSSL works for MariaDB SSL support"
  - "WITH_READLINE=True (cache_variables) activates bundled readline"
  - "OHOS lacks pthread_cancel - daemon_example plugin must be disabled"
  - "OHOS lacks Linux AIO - tpool must use simulated AIO via OHOS guard"
