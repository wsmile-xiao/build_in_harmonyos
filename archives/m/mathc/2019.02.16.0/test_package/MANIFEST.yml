# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mathc/2019.02.16.0
homepage: "https://github.com/felselva/mathc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 官方 tag v2019.02.16.0 归档（tar tzf 实测）仅含 LICENSE/README.md/mathc.c/mathc.h，
# 无 Makefile/CMake/configure、无任何测试源、测试框架、样例或基准文件（见最终报告台账证据）。
upstream_check_command: "（官方 tag 无构建系统与测试入口，tar tzf 清点为空）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（官方 tag 无独立上游测试用例，source_declared_total=0）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证 + HarmonyOS 专项)
test_package_tests:
  - file: harmonyos_test.c
    description: "HarmonyOS 专项测试（非空壳）：平台宏识别 + mathc 公开 API 功能断言（vec3 加减/点积/叉积/长度、mat4 identity/平移/透视逆矩阵、quat 绕 Z 90° 旋转、nearly_equal/clampi），12 项断言 ALL PASS，退出码 0"
    command: "./test_mathc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
