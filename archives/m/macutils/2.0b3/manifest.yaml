# 版本级 manifest — macutils 2.0b3（ARCHIVE-SPEC v2.0）

version: "2.0b3"
software: "macutils"
status: published
build_date: "2026-09-26"
build_system: "makefile"

source:
  # 上游无 tag；920f51f = Debian 2.0b3-16 源码 + debian #903505 cross patch，
  # 下一提交 4b3132c 起版本号改为 2.1
  url: "https://github.com/dgilman/macutils/archive/920f51fed5068086713f069801eb094fa36b1011.tar.gz"
  sha256: "386f02a9ee6e26fd85613d27e9b7380cbe06bd2a6dc77b9b9d214c3544c1651f"
  tar_format: tar.gz

build:
  system: makefile
  # 上游顶层 makefile 的 CF 去掉 -DBSD（见 notes.md 问题 4），另加 K&R 编译方言
  configure_options:
    - "CF=-std=gnu89 -Wno-deprecated-non-prototype -DTYPES_H -DDIRENT_H -DTERMIOS_H -DNODOT -DAPPLEDOUBLE"
    - "CC_FOR_BUILD=<target clang> -static"
    - "AR=<llvm-ar next to clang>"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-binhex-binhex.c.patch"
  - "0002-comm-frommac.c.patch"
  - "0003-comm-tomac.c.patch"
  - "0004-crc-makefile.patch"
  - "0005-util-transname.c.patch"

knowledge_gained:
  - "OHOS libc.so 不导出 rindex（仅 libc.a 有）：-static 探针能链过，动态交付构建报 undefined symbol；去掉 -DBSD 走上游 strrchr 分支（草稿 E544-draft-6EE2）"
  - "构建期生成器（crc/makecrc）用目标编译器 -static 链接：AArch64 CI 原生可跑，x86_64 runner 经 qemu-user binfmt 也可跑，无需宿主 cc"
  - "K&R 代码在 clang 15 下用 -std=gnu89；返回指针的函数缺原型在 LP64 上会截断，clang 15 直接报 -Wint-conversion 错误，需补头文件"

patch_generation:
