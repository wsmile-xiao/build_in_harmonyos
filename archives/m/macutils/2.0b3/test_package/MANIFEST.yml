# test_package/MANIFEST.yml — upstream test declaration (R51)
# CI script (build_and_test.sh L0e) requires this file to exist.

package: macutils/2.0b3
homepage: "https://github.com/dgilman/macutils"

# Upstream test inventory (R51 step 1 — clean count, see notes.md)
#   test/ tests/ directories        : absent (11 top-level entries, none test-related)
#   makefile targets (all 9 makefiles): all/clean/clobber/lint/install/distr
#                                       — no check/test target
#   ctest/pytest/automake TESTS       : 0 (no CMake/automake/python at all)
# => upstream ships no automated test suite (N = 0).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package consumer tests (test_macutils.c, compiled with the target
# toolchain, drives the packaged tools and checks their output independently)
test_package_tests:
  - file: test_macutils.c
    description: "macunpack extracts a consumer-built PackIt archive: 2 entries, Mac Roman name -> Cafe_Menu (transname/NAME_MAX patch path), type/creator/fork lengths in .info, data+rsrc forks byte-identical"
    command: "macunpack -3 archive.bin"
  - file: test_macutils.c
    description: "macunpack rejects a PackIt archive whose fork CRC is broken (non-zero exit)"
    command: "macunpack -3 corrupt.bin"
  - file: test_macutils.c
    description: "binhex -d -c OHOS -t TEST output decoded by an independent BinHex 4.0 decoder (6-bit alphabet, 0x90 RLE incl. literal 0x90), header/data/rsrc CRC-CCITT valid, data identical"
    command: "binhex -d -c OHOS -t TEST payload.dat"
  - file: test_macutils.c
    description: "hexbin -3 restores the data fork byte-for-byte (empty rsrc fork)"
    command: "hexbin -3 payload.hqx"
  - file: test_macutils.c
    description: "hexbin detects a .hqx with one tampered character (CRC error, non-zero exit)"
    command: "hexbin -3 tampered.hqx"
  - file: test_macutils.c
    description: "macstream packs the .info/.data/.rsrc triple into MacBinary II (header CRC checked), macsave -3 unpacks it byte-identically"
    command: "macstream Cafe_Menu.info | macsave -3"

# HarmonyOS PC consumer use case (end-to-end, not assertion-only): the six
# checks above are one compiled consumer program run by test() on the
# AArch64 target; count registered in the PR as 鸿蒙特有测试 = 6.
harmony_specific_tests:
  - file: test_macutils.c
    description: "compiled OHOS consumer driving macunpack/binhex/hexbin/macstream/macsave with independent PackIt/BinHex/MacBinary implementations (6 checks)"
    command: "test_macutils <workdir>"

# Approximate assertion count (CHECK macros in test_macutils.c)
assertion_count: 39
