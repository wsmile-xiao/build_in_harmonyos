# next commit (4b3132c) bumps the version to 2.1.

sources:
  "2.0b3":
    url:
      - "https://github.com/dgilman/macutils/archive/920f51fed5068086713f069801eb094fa36b1011.tar.gz"
      - "https://codeload.github.com/dgilman/macutils/tar.gz/920f51fed5068086713f069801eb094fa36b1011"
    sha256: "386f02a9ee6e26fd85613d27e9b7380cbe06bd2a6dc77b9b9d214c3544c1651f"

patches:
  "2.0b3":
    - patch_file: "patches/0001-binhex-binhex.c.patch"
      patch_description: "binhex: include rdfileopt.h so get_rdfileopt() returns char* (LP64 pointer truncation / clang int-conversion error)"
      patch_type: "portability"
    - patch_file: "patches/0002-comm-frommac.c.patch"
      patch_description: "frommac: include wrfileopt.h so get_wrfileopt() returns char*"
      patch_type: "portability"
    - patch_file: "patches/0003-comm-tomac.c.patch"
      patch_description: "tomac: include rdfileopt.h so get_rdfileopt() returns char*"
      patch_type: "portability"
    - patch_file: "patches/0004-crc-makefile.patch"
      patch_description: "crc/makefile: build makecrc with $(CC_FOR_BUILD) and archive with $(AR) instead of hard-coded cc/ar"
      patch_type: "portability"
    - patch_file: "patches/0005-util-transname.c.patch"
      patch_description: "transname: fall back to NAME_MAX when neither MAXNAMLEN nor DIRSIZ is defined (musl)"
      patch_type: "portability"
