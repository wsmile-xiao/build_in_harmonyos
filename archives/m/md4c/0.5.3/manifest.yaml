# 版本级 manifest
# 文件位置: archives/m/md4c/0.5.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.5.3"
software: "md4c"
status: built
build_date: "2026-08-24"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/mity/md4c/archive/refs/tags/release-0.5.3.tar.gz"
  sha256: "353c346f376b87c954a13f3415ede2d51264cc61dc5abcd38ff1d2aa0d059b9e"
  tar_format: tar.gz
  upstream_tag: "release-0.5.3"
  upstream_commit: "472c417005c2c71b8617de4f7b8d6b30411d78f4"

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "BUILD_MD2HTML_EXECUTABLE=OFF (关闭 md2html 可执行文件, 仅打包库)"
    - "BUILD_SHARED_LIBS=OFF (R26: OHOS 交叉编译静态库)"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 构建产物
# ============================================================

artifacts:
  libraries:
    - "libmd4c.a (核心 Markdown parser, SAX 回调接口)"
    - "libmd4c-html.a (HTML renderer, 依赖 libmd4c)"
  headers:
    - "md4c.h"
    - "md4c-html.h"
  cmake_targets:
    - "md4c::md4c"
    - "md4c::md4c-html"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "md4c 上游使用标准 CMake 构建, 无需重写构建系统"
  - "上游 CMakeLists.txt 仅含 src/ 与 md2html/ 两个子目录, 无 examples/docs/独立测试"
  - "src/CMakeLists.txt 构建两个库: md4c (核心 parser) + md4c-html (HTML renderer)"
  - "CMake 选项 BUILD_MD2HTML_EXECUTABLE 控制是否构建 md2html 命令行工具 (默认 ON, 配方关闭)"
  - "CMake 选项 BUILD_SHARED_LIBS 控制静态/动态库 (Linux 默认 ON, 配方设 OFF 满足 R26)"
  - "md4c 无任何外部依赖, 纯 C 单文件 parser (md4c.c + md4c.h)"
  - "API 入口: md_parse(text, size, parser, userdata), 通过 MD_PARSER 回调结构体交付解析事件"
  - "上游测试 (test/) 为 Python 脚本, 依赖 md2html 可执行文件做 HTML 回归比对, 不适合作为 Conan L1 测试"
