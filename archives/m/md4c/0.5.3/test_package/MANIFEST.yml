# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: md4c/0.5.3
homepage: "https://github.com/mity/md4c"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# md4c 上游测试为 Python 脚本 (test/run-tests.py), 需要预构建 md2html 工具,
# 不适合直接作为 Conan L1 测试 (本配方关闭了 md2html 可执行文件构建)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# md4c 上游测试 (test/) 依赖 md2html 可执行文件输出 HTML 做回归比对,
# 本配方仅打包库, 不构建 md2html, 故上游测试不纳入
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_md4c.c
    description: "验证 md_parse() 回调 API: 标题(MD_BLOCK_H level=1)与加粗(MD_SPAN_STRONG)文本被正确解析, 文本回调交付 'Title' 与 'bold'"
    command: "./test_md4c"

# 测试断言总数 (近似值, 用于质量评估)
# 1:md_parse返回0  2:MD_BLOCK_DOC回调  3:MD_BLOCK_H回调  4:heading level=1
# 5:标题文本"Title"  6:MD_SPAN_STRONG回调  7:加粗内文本"bold"
assertion_count: 7
