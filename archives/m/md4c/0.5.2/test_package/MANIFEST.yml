# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: md4c/0.5.2
homepage: "https://github.com/mity/md4c"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "python3 test/run-testsuite.py -p md2html -s spec.txt"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/run-testsuite.py
    source: md4c-0.5.2/test/run-testsuite.py
    description: "CommonMark/GFM spec 回归测试 (spec.txt 652 例 + 8 个扩展 spec 72 例 + regressions.txt 56 例 + coverage.txt 19 例, 共 799 例, 本地全量实测通过)"
    command: "python3 test/run-testsuite.py -p <md2html> -s spec.txt"
  - file: test/pathological-tests.py
    source: md4c-0.5.2/test/pathological-tests.py
    description: "27 项 pathological 压力用例 (嵌套强调/巨大表格等), 本地实测全部通过"
    command: "python3 test/pathological-tests.py -p <md2html>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 链接 Conan 包 md4c::md4c 目标, 调用真实 md_parse() API 断言 6 项回调行为 (DOC/H1/标题文本/STRONG/加粗文本)"
    command: "./test_md4c"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
