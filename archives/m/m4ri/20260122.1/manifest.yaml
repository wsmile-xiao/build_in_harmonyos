knowledge_gained:
  - "OHOS: musl tmpfile() hardcodes read-only /tmp and ignores TMPDIR -> NULL/EACCES(13); m4ri tests/test_misc.c:60 feeds the NULL FILE* to libpng png_init_io -> SIGABRT(134). Fix: LD_PRELOAD a POSIX-semantics tmpfile shim (mkstemp $TMPDIR + unlink + fdopen + FD_CLOEXEC, see tmpfile-shim.c) during make check only; no upstream patch, not shipped in package. Same root cause as E272 (arm-none-eabi-binutils) and DRAFT-8959 (libei)."
  - "OHOS: m4ri configure cache probes (/sys/devices/system/cpu/cpu0/cache absent, sysctl hw.l1dcachesize unknown) yield __M4RI_CPU_L[123]_CACHE=0/0/0; misc.h:569-599 substitutes 16K/256K/4M at compile time. Safe degradation, do not patch; m4ri_opt_k clamps k<2 to 2."
  - "OHOS: __M4RI_HAVE_SSE2=0 on AArch64 target is correct — configure does not cross-contaminate build-host CPU features; m4ri_config.h additionally gates on defined(__SSE2__)."
  - "conan 2.x: self.run(env=[list]) treats list items as env-file names, not VAR=value; inject LD_PRELOAD/TMPDIR as a shell command prefix instead (binutils E272 precedent)."
  - "m4ri API: mzd_transpose kernel declares dst/src RESTRICT — in-place mzd_transpose(T,T) silently corrupts; transpose twice with distinct destinations."
  - "OHOS: /data/service/hnp/bin/bash may not exist; self.run already goes through /bin/sh which supports ${VAR:+:$VAR}, so no bash wrapper is needed in test_package (Error 127 otherwise)."
  - "R37: cnb.cool artifact repo rejects a second recipe revision for an already-published version (m4ri/20260122 exists there); since this PR modifies the recipe (tmpfile shim during make check, HarmonyOS-specific test_package), the conan/archive revision bumps to 20260122.1. Upstream source stays 20260122 — conandata.yml URL/sha256 unchanged."
