# test_package/MANIFEST.yml — morse 2.7 (Morse Classic)
# CI L0e requires this file to exist.

package: morse/2.7
homepage: "http://www.catb.org/~esr/morse-classic"

# 上游测试审计（hmbs 机器证据硬门禁）
# Morse Classic 2.7 官方归档（morse-2.7.tar.gz）自带正式自测：
#   - 顶层 Makefile 有 check: testmorse testqso 目标（README 明示
#     "Run \"make check\" to build and self-test the software"）
#   - test_input 为主测试输入（完美全字母句 + 数字测试 + VVV）
#   - testmorse: (cat test_input; qso.d/QSO) | ./morse -w 24 -l -e
#   - testqso:   qso.d/QSO | ./morse -w 20 -l -e
#   - 无其它测试框架（无 ctest/gtest/autotools），CI 无独立工作流
# 上游 make check 已在配方 build() 中真实执行（OHOS AArch64 本机），
# 音频路径经构建期 console shim（/dev/console → /dev/null），解码/
# 计时/输出逻辑全量真实运行，两目标均 exit 0。
upstream_tests_exist: true
upstream_test_audit: "审计 morse 2.7 官方归档（http://www.catb.org/esr/morse/morse-2.7.tar.gz，sha256 6ae4a76fc5aa57a520dca38380676142fd427a1748501a71cadd352c3f187fe3）：顶层 Makefile 含 check: testmorse testqso 自测目标（README 明示 Run make check），test_input 为测试输入。make check 在配方 build() 真实执行（testmorse ~210s + testqso ~215s，真实 SIGALRM 节奏），仅 console 喇叭 open() 经构建期 shim 重定向到 /dev/null（OHOS 无 PC 喇叭），Morse 解码/计时/输出逻辑全量运行，两目标 exit 0。"

# 上游测试命令（在配方 build() 中执行）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "(cat test_input; qso.d/QSO) | ./morse -w 24 -l -e && qso.d/QSO | ./morse -w 20 -l -e"

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile#check
    description: "上游自测：testmorse（test_input + QSO 生成文本经 morse -w 24 -l -e 真实播放/解码）"
    command: "(cat test_input; qso.d/QSO) | ./morse -w 24 -l -e"
  - file: Makefile#check
    description: "上游自测：testqso（QSO 生成文本经 morse -w 20 -l -e 真实播放/解码）"
    command: "qso.d/QSO | ./morse -w 20 -l -e"

# test_package 中自带的测试（消费者视角验证，基于上游源码 morse.c getopt 语义设计）
# test.sh 内部断言结构：t() 退出码断言 × 11 + check() 输出断言 × 17 = 28 项
# （CI L4 实际运行输出：test.sh: TOTAL=28 PASS=28 FAIL=0 SKIP=0）
test_package_tests:
  - file: test.sh
    description: "运行安装后的真实 morse/QSO CLI（bash test.sh，内部 28 项断言）：①morse -m -e 精确 Morse 字节输出（SOS/SOS PARIS/123/长句，cmp 精确比对）；②morse -l -m -e 字母同步输出精确断言；③负向：-C 空字符集 → exit 1 + 精确 stderr 报错；④负向：未知选项 -Z → exit 1 + stderr 自提示；⑤QSO 报文结构断言（首尾呼号回显/RST 行/+% 行/行数下限）；⑥morse 无参数非 tty 静默 exit 0；⑦stderr 洁净性断言"
    command: "bash test.sh"

# 测试断言总数（test.sh 内 t×11 + check×17，与 L4 运行输出 TOTAL=28 一致）
assertion_count: 28
