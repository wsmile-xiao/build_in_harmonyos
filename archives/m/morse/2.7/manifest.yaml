# 版本级 manifest — morse 2.7 (Morse Classic)
package: morse
version: 2.7
display_name: "Morse Classic (morse)"
package_type: application

# 官方上游身份（R39: 必须官方正式源）
homepage: "http://www.catb.org/~esr/morse-classic"
source_repository: "https://gitlab.com/esr/morse-classic"
# 实际构建源为官方 GitLab 2.7 tag archive（CATB tarball 因其响应
# content-encoding: x-gzip 头无法被 conan 干净获取；两源源码内容
# 逐文件一致，取证详见 notes.md）
official_source_url: "https://gitlab.com/esr/morse-classic/-/archive/2.7/morse-classic-2.7.tar.gz"
official_source_sha256: "61d6ddaf2365fb767f321a13a0bed82d96e5729e396a4ca5914d207819efd1b0"

# 2.7 release（NEWS：2026-03-17，"morse 2.7: Raise the system quality bar"）
release_date: 2026-03-17
release_announcement: "morse 2.7: Raise the system quality bar"

# 许可证（COPYING：BSD LICENSE, (c) Eric S. Raymond）
license: BSD-2-Clause

# 软件功能（上游 README/morse(1)）
description: |
  Morse Classic 是 Eric S. Raymond 的 Unix 莫尔斯电码训练工具。
  两个命令行工具：
  - morse：把文本渲染为莫尔斯电码（PC 喇叭/声卡蜂鸣与屏幕点划），
    可生成随机练习测试（QSO 联络）、字母同步滚动、错误提示音等。
  - QSO：生成模拟业余无线电 QSO 报文（随机呼号/RST/交换信息），
    供 ARRL 风格的收听练习使用。
  构建系统为纯 Makefile（morse.d + qso.d），无 configure。

# 官方测试（本包上游测试在配方 build() 中真实执行）
upstream_tests_exist: true

# 无需 patch（零 patch 适配）
patches: []

# OHOS AArch64 工具链
build_system: "make"
ohos_toolchain: "OHOS NDK clang 15 (aarch64-unknown-linux-ohos, musl)"

# 功能简述
categories: [ham-radio, training, morse-code, cli]
