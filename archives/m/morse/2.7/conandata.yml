# conandata.yml — morse 2.7 (Morse Classic)
# 源码 URL 指向上游官方 GitLab 仓库（esr/morse-classic）2.7 tag archive
# （R39: 官方正式源；tag 2.7 → commit 2af424ba1a1222e93f9c492b5f350b07495ed456，
#   tag 消息 "Tagged for external release 2.7"；GitLab 无 release 附加产物，
#   tag archive 即官方源码归档）
#
# 为何不用 CATB 官方 tarball（http://www.catb.org/esr/morse/morse-2.7.tar.gz，
# sha256 6ae4a76fc5aa57a520dca38380676142fd427a1748501a71cadd352c3f187fe3）：
# catb.org 对 .tar.gz/.tar 响应均携带非标准 content-encoding: x-gzip 头，
# conan 的 requests/urllib3 下载器会透明解压为纯 tar（184320 字节，
# sha256 48fc1b2b4656dad804caf7f912e86e3c50b393890c8cf16b5172982da902f236，
# = gunzip(6ae4 tarball)），SHA 校验必败；curl 不解析该头、得到原始 6ae4...。
# CATB 侧无干净的机器可获取方式（https 证书主机名不匹配）。
# GitLab archive 无 content-encoding 头，curl / requests / conan 下载字节一致。
#
# 两源源码内容逐文件一致：36 个共有文件（全部源码、Makefile、NEWS、
# COPYING、test_input 等）cmp 全同；差异仅打包层面 —— CATB 独有 xmlto
# 生成的 man 页 morse.1/QSO.1（构建产物，非源码），GitLab 独有
# .gitignore/control/morse-logo.png（仓库维护文件）。
#
# sha256 两次独立下载验证一致（2026-09-02，curl 与 requests 字节相同）
# 上游 2.7 无需任何 patch（零 patch 适配，见 notes.md）

sources:
  url: "https://gitlab.com/esr/morse-classic/-/archive/2.7/morse-classic-2.7.tar.gz"
  sha256: "61d6ddaf2365fb767f321a13a0bed82d96e5729e396a4ca5914d207819efd1b0"
