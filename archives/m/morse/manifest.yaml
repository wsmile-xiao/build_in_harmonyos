# 软件级 manifest — morse (Morse Classic)
package: morse
display_name: "Morse Classic"
homepage: "http://www.catb.org/~esr/morse-classic"
source_repository: "https://gitlab.com/esr/morse-classic"
# 官方源码归档站（catb.org = Eric S. Raymond 个人站点，即作者本人发布渠道）
official_source_base: "http://www.catb.org/esr/morse/"
license: BSD-2-Clause
description: |
  Morse Classic（Eric S. Raymond）：Unix 莫尔斯电码训练工具。
  morse 将文本渲染为莫尔斯电码（蜂鸣+屏幕点划），支持随机练习
  （QSO 联络）；QSO 生成模拟业余无线电报文。纯 Makefile 构建，
  上游自带 make check 自测。
categories: [ham-radio, morse-code, training, cli]
available_versions:
  - "2.7"
