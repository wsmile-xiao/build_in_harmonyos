software: mdflib
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/v2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "v2.1"

# 构建系统（顶层字段，供 verify-build 检查）
build_system: cmake

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-23"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ihedvall/mdflib/archive/refs/tags/v2.1.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DMDF_BUILD_SHARED_LIB=ON"
    - "-DMDF_BUILD_SHARED_LIB_NET=OFF"
    - "-DMDF_BUILD_SHARED_LIB_EXAMPLE=OFF"
    - "-DMDF_BUILD_DOC=OFF"
    - "-DMDF_BUILD_TOOL=OFF"
    - "-DMDF_BUILD_TEST=OFF"
    - "-DCMAKE_CXX_STANDARD=17"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
    - "-DEXPAT_INCLUDE_DIR=$DEFAULT_PREFIX/include"
    - "-DEXPAT_LIBRARY=$DEFAULT_PREFIX/lib/libexpat.so"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - expat/2.7.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-mdflib-src-platform.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "strerror_r 在 musl libc 中返回 int（POSIX版），非 char*（GNU版），需用 POSIX 兼容写法"
  - "CMake FindEXPAT 需手动指定 -DEXPAT_LIBRARY 和 -DEXPAT_INCLUDE_DIR，因仅有 .so 无 .a"
  - "mdflib 是纯库项目（静态库+动态库），无可执行文件"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/mdflib-v2.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/mdflib-v2.1.work
  source_orig_hash: bd41790a878d09f7
  source_work_hash: 726eadc552294f26
  generated_at: '2026-06-23T16:15:13'
  patches_count: 1

patch_classification:
  - file: 0001-mdflib-src-platform.cpp.patch
    type: auto
    platform_only: True
    guard: 'pending'
