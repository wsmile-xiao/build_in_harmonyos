software: mdflib
display: "MDFLib"
description: "ASAM MDF (Measurement Data Format) 数据文件读写库，支持 MDF3/MDF4 格式"
category: library
homepage: "https://ihedvall.github.io/mdflib/"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "strerror_r 在 musl libc 中返回 int（POSIX），需改为 POSIX 兼容写法"
    - "CMake FindEXPAT 需手动指定 -DEXPAT_LIBRARY 和 -DEXPAT_INCLUDE_DIR"
    - "纯库项目，无可执行文件，关闭 .NET/工具/测试选项"
  common_dependencies:
    - zlib
    - expat

versions:
  "v2.1":
    status: published
    build_date: "2026-06-23"
    published_as: mdflib
