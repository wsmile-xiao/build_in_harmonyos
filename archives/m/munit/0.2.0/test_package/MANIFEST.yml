package: munit/0.2.0
homepage: "https://github.com/nemequ/munit"

# munit 的上游 Makefile 没有 check target；正式测试入口是 make test。
upstream_check_command: ""
upstream_check_target: false
upstream_check_target_evidence: "make -n check -> No rule to make target 'check'"
upstream_test_in_build: true
upstream_test_command: "make -j1 && MUNIT_TMPDIR=<build>/munit-tmp make -j1 test"

upstream_tests:
  - file: example.c
    source: munit-0.2.0/example.c
    description: "Official munit example suite: 3 registered entries expand to 11 cases."
    command: "make -j1 test"
    registered_suite_entries: 3
    expanded_cases: 11
    executed_cases: 11
    passed_cases: 11
    skipped_cases: 0

upstream_test_audit:
  source_archive: munit-0.2.0.tar.gz
  source_sha256: "58c12f2ae08acfc270d47a5ff23380c300b24d7dc53f3a23f4527e0112146844"
  registered_suite_entries: 3
  discovered_cases: 11
  executed_cases: 11
  passed_cases: 11
  failed_cases: 0
  skipped_cases: 0
  assertion_invocations_in_example_source: 21

test_package_tests:
  - file: test_munit.c
    description: "Compile and run a consumer against the packaged munit API."
    command: "MUNIT_TMPDIR=<build>/munit-tmp ./test_munit"
    registered_suite_entries: 2
    expanded_cases: 2
    explicit_assertions: 8

test_package_test_count: 1
test_package_assertion_count: 8
assertion_count: 29
