# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: munit/0.4.1
homepage: "https://nemequ.github.io/munit/"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# munit 的上游测试通过 example.c 展示所有功能
upstream_tests:
  - file: example.c
    source: munit-master/example.c
    description: "上游官方示例测试套件 - 包含基本断言、随机数和参数化测试"
    command: "./example"
    test_cases:
      - name: "/example/compare"
        description: "基本比较断言测试"
      - name: "/example/rand"
        description: "随机数生成测试"
      - name: "/example/parameters"
        description: "参数化测试（9种组合：foo={one,two,three} × bar={red,green,blue}）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Conan 包消费者测试 - 验证 munit 的核心功能"
    command: "./test_munit"
    test_cases:
      - name: "/basic"
        description: "基本断言功能（整数、布尔）"
      - name: "/strings"
        description: "字符串断言功能"
      - name: "/rand"
        description: "随机数生成功能"

# 测试断言总数 (近似值)
# 上游 example.c: ~20 assertions across 11 test cases
# test_package test.c: ~8 assertions across 3 test cases
assertion_count: 28

# 测试覆盖的 API
tested_apis:
  - "munit_assert_int"
  - "munit_assert_true"
  - "munit_assert_false"
  - "munit_assert_string_equal"
  - "munit_assert_size"
  - "munit_rand_int_range"
  - "munit_suite_main"

# 测试质量说明
test_quality_notes: |
  munit 是一个测试框架，其自身的质量通过 example.c 展示。
  上游提供了完整的示例，覆盖了所有核心功能：
  - 基本断言（比较、布尔、字符串、内存等）
  - 参数化测试（9种参数组合）
  - 随机数生成和种子控制
  - 测试套件嵌套
  本 Conan 包的 test_package 验证了消费者能够正确使用 munit 编写测试。
