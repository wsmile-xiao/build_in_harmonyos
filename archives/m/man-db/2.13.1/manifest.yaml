software: man-db
version: "2.13.1"
status: success
build_system: autotools
compile_date: "2026-03-23"

dependencies:
  required:
    - gdbm 1.23
    - bzip2 1.0.8
    - libpipeline 1.5.8
    - groff 1.23.0  # 运行时依赖
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  install_prefix: $TEST_PREFIX
  cflags: "-fPIC -O2 -I$HOME/usr/local/include"
  configure_options:
    - --prefix=$TEST_PREFIX
    - --disable-setuid
    - --with-systemdtmpfilesdir=no
    - --with-systemdsystemunitdir=no
    - --with-libpipeline
  vpath_build:
    source_dir: ~/tmp/builds/man-db-2.13.1.work
    build_dir: ~/tmp/builds/man-db-build

patches_applied:
  - file: 0001-build-aux-config.guess.patch
    purpose: 用 patch-autotools-ohos.pl 添加 HarmonyOS 系统识别和 __OHOS__ LIBC 检测
    lines_changed: 13
  - file: 0002-build-aux-config.sub.patch
    purpose: config.sub 添加 ohos-linux 匹配、OS 允许列表和 linux-ohos 内核-OS 验证
    lines_changed: 11
  - file: 0003-lib-encodings.c.patch
    purpose: lib/encodings.c 中 charset_table 的 "locale" 设备改为 "utf8"，适配 groff 1.23.0（无 devlocale）
    lines_changed: 2
  - file: 0004-lib-security.c.patch
    purpose: lib/security.c 中 get_man_owner() 找不到 man 用户时 debug 警告并返回 NULL，而非 error(FAIL) 退出
    lines_changed: 10
  - file: 0005-src-man.c.patch
    purpose: src/man.c 中 HEIRLOOM_NROFF 分支 roff_device 从 "locale" 改为 "utf8"，适配 groff 1.23.0
    lines_changed: 2

build_notes:
  - --disable-setuid 使 man_mode=755，install-exec-hook 中 chown 条件不满足，自动跳过
  - security.c 补丁使 get_man_owner() 在 man 用户不存在时安全返回 NULL
  - 无需手动修改 config.h 或 Makefile

compatibility:
  level: medium
  issues:
    - musl libc iconv 不支持 //IGNORE 后缀，导致 manconv whatis parse 失败，apropos/whatis 不可用
  notes:
    - man page 显示功能正常，带 ANSI 颜色格式化
    - mandb 初始化可运行但 whatis 数据库不完整

test_results:
  type: manual
  note: "man man 成功显示 man-db 自带手册页，带 ANSI 颜色格式化。apropos/whatis 因 musl iconv 兼容性问题不可用。"

knowledge_gained:
  - VPATH 构建是避免 autotools 重生成的关键策略 (ref: PROGRESS.md L1)
  - MAN_OWNER 未定义时 security.c 中 get_man_owner() 不会被编译，避免 NULL 解引用 (ref: PROGRESS.md L2)
  - groff 1.23.0 相比旧版移除了 g.tmac、safe.tmac、padj.tmac 宏包 (ref: PROGRESS.md L3)
  - musl libc iconv 不支持 glibc 的 //IGNORE 扩展 (ref: PROGRESS.md L1)
  - SELinux 限制下 FIFO 管道被禁，make 必须使用 -j1 (ref: PROGRESS.md L1)
  - ln -sf 生成的软链接在 SELinux 下无法被动态链接器跟随，需用 cp 代替 (ref: PROGRESS.md L1)
  - automake 版本不匹配时可用 /bin/true 绕过 ACLOCAL/AUTOHEADER/AUTOMAKE (ref: PROGRESS.md L2)

maintainer: OpenHarmony PC Developer社区
tags: [man-db, man-page, documentation, groff, nroff]

