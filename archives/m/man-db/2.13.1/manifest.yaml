software: man-db
version: "2.13.1"
status: success
build_system: autotools
compile_date: "2026-03-23"

dependencies:
  required:
    - gdbm 1.23
    - bzip2 1.0.8
    - libpipeline 1.5.8
    - groff 1.23.0  # 运行时依赖
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  install_prefix: $HOME/usr/local
  cflags: "-fPIC -O2"
  configure_options:
    - --prefix=$HOME/usr/local
  vpath_build:
    source_dir: $HOME/man-db-src
    build_dir: $HOME/build-man-db
  automake_compat:
    aclocal: /bin/true
    autoheader: /bin/true
    automake: /bin/true

patches_applied:
  - file: 0001-HarmonyOS-system-detection.patch
    purpose: config.guess/config.sub 添加 HarmonyOS 系统检测和 ohos 目标支持
    lines_changed: ~30
  - file: 0002-remove-MAN_OWNER-dependency.patch
    purpose: config.h 中 #undef MAN_OWNER，避免 HarmonyOS 上 man 系统用户不存在导致的 NULL 解引用段错误
    lines_changed: ~2
  - file: 0003-fix-charset-table-device.patch
    purpose: lib/encodings.c 中 charset_table 的 "locale" 设备改为 "utf8"，适配 groff 1.23.0
    lines_changed: ~2
  - file: 0004-fix-nroff-device.patch
    purpose: src/man.c 中 HEIRLOOM_NROFF 分支 roff_device 从 "locale" 改为 "utf8"，适配 groff 1.23.0
    lines_changed: ~2

compatibility:
  level: medium
  issues:
    - musl libc iconv 不支持 //IGNORE 后缀，导致 manconv whatis parse 失败，apropos/whatis 不可用
  notes:
    - man page 显示功能正常，带 ANSI 颜色格式化
    - mandb 初始化可运行但 whatis 数据库不完整

test_results:
  type: manual
  note: "man man 成功显示 man-db 自带手册页，带 ANSI 颜色格式化。apropos/whatis 因 musl iconv 兼容性问题不可用。"

knowledge_gained:
  - VPATH 构建是避免 autotools 重生成的关键策略
  - MAN_OWNER 未定义时 security.c 中 get_man_owner() 不会被编译，避免 NULL 解引用
  - groff 1.23.0 相比旧版移除了 g.tmac、safe.tmac、padj.tmac 宏包
  - musl libc iconv 不支持 glibc 的 //IGNORE 扩展
  - SELinux 限制下 FIFO 管道被禁，make 必须使用 -j1
  - ln -sf 生成的软链接在 SELinux 下无法被动态链接器跟随，需用 cp 代替
  - automake 版本不匹配时可用 /bin/true 绕过 ACLOCAL/AUTOHEADER/AUTOMAKE

maintainer: OpenHarmony Community
tags: [man-db, man-page, documentation, groff, nroff]
