software: minctest
version: "0.3.0"
homepage: "https://github.com/codeplea/minctest"

# 上游测试命令（minctest 无 make check，直接运行示例程序）
upstream_check_command: "gcc example.c -o example && ./example"

# conanfile.py build() 方法中是否已集成上游测试（header-only，无 build）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: example.c
    source: minctest-master/example.c
    description: "上游示例测试：4 个断言（lok, lequal, lfequal, lsequal）"
    command: "./example"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_minctest.c
    description: "消费者测试：验证 header 可正常包含并使用 minctest API"
    command: "./test_minctest"

# 测试断言总数
assertion_count: 4
