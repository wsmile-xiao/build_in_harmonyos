# manifest.yaml - metaeuk 软件级元数据
software: metaeuk
display: "MetaEuk"
description: "Sensitive gene-finding and protein annotation tool for large eukaryotic genomes (MMseqs2 based)"
category: bioinformatics
homepage: "https://github.com/soedinglab/metaeuk"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 4 拒绝 2.8.12 基线，需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "tag tarball 无 .git，用上游 VERSION_OVERRIDE 注入真实版本号"
    - "MMseqs2 内置于 lib/mmseqs，零外部 conan 依赖"
    - "固定 HAVE_ARM8 SIMD 路径避免 CI 主机探测差异"
  common_dependencies: []

versions:
