# test_package/MANIFEST.yml - metaeuk 7-bba0d80
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求存在）
# 诚实口径：metaeuk 7-bba0d80 无任何**注册**的自动化测试套件。
# 实测依据（源码树 ~/tmp/uc2/ds18-metaeuk/metaeuk-7-bba0d80，
# 详见 7-bba0d80/notes.md §4「N_static 清点依据」）：
#   1. 全树 grep add_test( / enable_testing / include(CTest) 命中 0/0/0，
#      亦无 Makefile.am/configure.ac ⇒ 无 ctest、无 automake TESTS 注册入口。
#   2. 随包另有 lib/mmseqs/src/test/（42 条目：36 个 .cpp + CMakeLists.txt +
#      名为 0 的文件 + 4 个 dataGap/dataLinear 数据文件），其中 35 个 .cpp
#      各自带 int main、assert( 仅 3 文件共 29 处 —— 属上游**手工自测
#      harness（兼回归工具）**，不是注册可执行测试，不折算成用例数。
#      其构建入口 add_subdirectory(test) 被根 CMakeLists.txt:6 的
#      set(FRAMEWORK_ONLY 1 CACHE INTERNAL "" FORCE) 锁在
#      lib/mmseqs/src/CMakeLists.txt:243 的 if (NOT FRAMEWORK_ONLY) 块内，
#      本包配置下永不进入（HAVE_TESTS 亦默认 0）；且
#      cmake/MMseqsSetupTest.cmake 的 mmseqs_setup_test() 只 add_executable、
#      不含 add_test ⇒ 即便开启也不产生 CTest 注册用例。
#   3. tests/（metaeuk-regression 回归数据集仓库）与 lib/mmseqs/util/regression
#      是 .gitmodules 声明的两个子模块，GitHub tag 归档不含其内容（tar 内
#      均为空目录）；azure-pipelines/.cirrus 走外部下载驱动。
# ⇒ N_static = 0。

package: metaeuk/7-bba0d80
homepage: "https://github.com/soedinglab/metaeuk"

# 上游测试命令（无注册测试入口可运行）
upstream_check_command: ""

# conanfile.py build() 中的上游测试集成（无上游测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序（N_static=0，如实留空并说明）
upstream_tests: []

# test_package 消费者测试（N_consumer=1 个测试程序，5 项行为断言）
test_package_tests:
  - file: consumer.cpp
    description: "运行包内 metaeuk 二进制并断言真实行为：裸 metaeuk 退出码 0 且版本横幅含 7-bba0d80（VERSION_OVERRIDE 编译注入；注 --version 非合法子命令会非零退出）、-h 退出码 0、非法参数非零退出、easy-predict 合成数据端到端退出码 0 且按实测产物名 predictions.fa.fas 生成（合成序列零命中故产物 0 字节，仅证工作流跑通不证预测正确性）、createdb 合成 FASTA 自含往返退出码 0 且序列库 db 与头文件 db_h 非空（可证伪的非空产物断言）"
    command: "metaeuk_consumer（CMake 构建，经 conanrun PATH 调包内二进制）"
  - file: conanfile.py
    description: "test() 无条件 self.run 执行 metaeuk_consumer 并以退出码断言，刻意不加 can_run 守卫：本包只原生构建（真机与 CI worker 均以 host profile 作 build profile），不存在合法交叉场景；而 can_run 判假时整个 test() 静默跳过、conan test 仍返回 rc=0，会让 R34 破坏性反向验证（CI L1e）与 CI 双双假通过。同类 CLI 归档 mafft 7.525 亦无条件 self.run（archives/m/mafft/7.525/test_package/conanfile.py:27）。证据：reports/w3-local-ci.log 的 [ok] L1e: Negative test confirmed — test genuinely depends on metaeuk；复刻 L1e 命令行（同样不带 -pr:b）实测 CONAN_TEST_ELAPSED_SEC=8.42 / L1E_REPLICA_RC=0 且消费者打印 5 assertions OK（~/tmp/uc2/zhuli1-metaeuk/l1e_time.log）；去守卫前的秒级空转记录见 feedback/SKILL_FEEDBACK_a56f10ca.md 失败与问题第 3 条"
    command: "conan test"
