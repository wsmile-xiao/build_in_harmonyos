# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mruby/3.3.0
homepage: "https://mruby.org"

# 上游测试命令 (mruby uses rake test, not make check)
upstream_check_command: "rake MRUBY_CONFIG=ohos test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "rake MRUBY_CONFIG=ohos test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test_package/test.c
    source: mruby-3.3.0/test_package/test.c
    description: "C API test: initializes mruby VM, loads Ruby code '1+2', verifies result=3"
    command: "./test_mruby"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.c
    description: "Compiles C program using mruby C API (mrb_open/mrb_load_string/mrb_close), verifies 1+2=3"
    command: "./test_mruby"
  - file: test_package/conanfile.py
    description: "Runs mruby binary --version to verify executable works"
    command: "mruby --version"

# 测试断言总数
assertion_count: 3
