software: mruby
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.3.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# 构建系统类型
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mruby/mruby/archive/refs/tags/3.3.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "MRUBY_CONFIG=ohos"
    - "CC=clang"
    - "CXX=clang++"
    - "AR=llvm-ar"
    - "CFLAGS=-fPIC -O2 -Wall"
    - "PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ruby/3.4.5
    - rake/13.2.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build_config-ohos.rb.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "mruby 使用 rake 构建系统（非 autotools/meson），需要自定义 build_config.rb"
  - "OpenHarmony 环境变量 LD=ld.lld 会覆盖 CC=clang 作为 linker，需要在 build_config 中显式设置 linker.command=clang"
  - "OpenHarmony 无独立 libm，需要设置 linker.libraries=%w()（math 函数在 libc 中）"
  - "rake install 使用 DESTDIR 环境变量（不是 make DESTDIR=）"
  - "rake install 使用 PREFIX/INSTALL_PREFIX 环境变量设置安装前缀"
  - "/tmp 只读(E002) 和 UNIX socket bind()未实现(E051) 导致部分测试失败"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/mruby-3.3.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/mruby-3.3.0.work
  source_orig_hash: 06ab901a2da71bb6
  source_work_hash: 8a05c2ead0f5bf8d
  generated_at: '2026-05-26T16:24:43'
  patches_count: 1

patch_classification:
