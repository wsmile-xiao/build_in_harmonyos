package: mp-units/2.5.0
homepage: "https://github.com/mpusz/mp-units"

# The upstream runtime suite uses Catch2 3 and is not part of this package's
# minimal src/ build. Its registration inventory is recorded below from the
# v2.5.0 source tree; device execution is reported in reports/test-report.md.
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: "cmake --build build && ctest --test-dir build --output-on-failure"
upstream_tests:
  - file: test/runtime/*.cpp
    count: 27
    source: "mp-units-2.5.0/test/runtime"
    description: "Catch2 v3 runtime suite: 22 macro registrations, including one 6-type TEMPLATE_TEST_CASE, for 27 framework test cases"
    command: "ctest --output-on-failure"
  - file: test/static/CMakeLists.txt
    count: 2
    source: "mp-units-2.5.0/test/static/CMakeLists.txt"
    description: "Compile-time coverage: 2 active library targets; no executable or CTest registration"
    command: "cmake --build build --target unit_tests_static unit_tests_static_truncating"

test_package_tests:
  - file: test_package.cpp
    count: 1
    description: "Consumer test: dimensional arithmetic, unit conversion, fmt-backed quantity formatting, and a second quantity formatting path"
    command: "./test_package"
assertion_count: 3
