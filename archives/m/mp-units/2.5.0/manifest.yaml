# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.5.0"

# 软件名
software: "mp-units"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: "cmake"

validation_note: "Conan package build and consumer test passed on HarmonyOS PC. The 25 runtime cases passed. The two upstream compile-only static targets cannot complete because the OHOS libc++ SDK declares non-member std::complex operator+ as non-constexpr; the exact compiler diagnostic is recorded in notes.md and the device log."

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mpusz/mp-units/archive/refs/tags/v2.5.0.tar.gz"

  # 源码校验和
  sha256: "a6bd48bee699f11f0ed5b04b8c5006d15f76e6d898e058db3880554d2e47a400"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DMP_UNITS_BUILD_CXX_MODULES=OFF"
    - "-DMP_UNITS_API_STD_FORMAT=OFF"
    - "-DMP_UNITS_API_CONTRACTS=NONE"
    - "-DMP_UNITS_API_NATURAL_UNITS=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - fmt/12.2.0
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0002-fix-dependent-type-syntax-for-clang-15.patch"
  - "0003-fix-type-list-dependent-types-for-clang-15.patch"
  - "0004-fix-dependent-type-syntax-in-framework-for-clang-15.patch"
  - "0005-fix-dependent-type-syntax-in-quantity-concepts.patch"
  - "0006-fix-dependent-types-in-conversion-and-si-headers.patch"
  - "0007-fix-dependent-representation-types-in-random-header.patch"
  - "0008-use-constexpr-for-clang-15-immediate-helpers.patch"
  - "0009-use-constexpr-for-base-value-helper.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "mp-units 2.5.0 是 C++20 header-only CMake 库，安装 INTERFACE 目标，不提供 CLI。"
  - "OHOS 构建显式使用 CMAKE_SYSTEM_NAME=OHOS 和 CMAKE_SYSTEM_PROCESSOR=aarch64；Clang 15 需要恢复上游源码中的 dependent-type 标记并将嵌套立即求值辅助函数降为 constexpr。"
  - "默认合同检查为 NONE，hosted 格式化依赖 fmt/12.2.0。"
  - "OHOS SDK libc++ 的 std::complex 非成员 operator+ 不是 constexpr，阻断上游 quantity_test.cpp 中依赖复数常量表达式的 static assertions；这不影响 runtime 测试或普通消费者编译。"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

test_results:
  type: harmonyos-pc-device
  upstream_runtime_registered_cases: 25
  upstream_runtime_cases_executed: 25
  upstream_runtime_cases_passed: 25
  upstream_static_compile_targets_registered: 2
  upstream_static_compile_targets_passed: 0
  consumer_tests_compiled: 1
  consumer_tests_executed: 1
  consumer_tests_passed: 1
  device: "HarmonyOS PC aarch64"
  device_validation_date: "2026-09-02"
  logs:
    conan_create: "$HOME/tmp/import-deps-100-odd-mp-units-create-r9.log"
    upstream_build: "$HOME/tmp/import-deps-100-odd-mp-units-upstream-r4.log"
    upstream_runtime: "$HOME/tmp/import-deps-100-odd-mp-units-runtime-r4.log"
  note: |
    CTest discovered and executed 25 runtime cases; all passed, and the direct
    Catch2 summary was 786 assertions in 25 test cases. The upstream static
    target build was attempted with `cmake --build ... --target
    unit_tests_runtime unit_tests_static -- -j1`; it stopped after 20
    diagnostics from test/static/quantity_test.cpp because the OHOS libc++
    declaration at include/c++/v1/complex:548 is a non-constexpr operator+.
    This is recorded as an OHOS missing-feature limitation, not as a pass.
    `make jobserver mkfifo ... Operation not permitted` and `Problem parsing
    /proc/meminfo` are device-environment warnings; the Conan package and
    consumer still completed successfully.
