sources:
  url: "https://github.com/mpusz/mp-units/archive/refs/tags/v2.5.0.tar.gz"
  sha256: "a6bd48bee699f11f0ed5b04b8c5006d15f76e6d898e058db3880554d2e47a400"

patches:
  - patch_file: "patches/0002-fix-dependent-type-syntax-for-clang-15.patch"
    patch_description: "Restore explicit dependent-type markers required by Clang 15."
    patch_type: "portability"
  - patch_file: "patches/0003-fix-type-list-dependent-types-for-clang-15.patch"
    patch_description: "Restore dependent-type markers in the type-list implementation for Clang 15."
    patch_type: "portability"
  - patch_file: "patches/0004-fix-dependent-type-syntax-in-framework-for-clang-15.patch"
    patch_description: "Restore dependent-type markers in symbolic expression helpers for Clang 15."
    patch_type: "portability"
  - patch_file: "patches/0005-fix-dependent-type-syntax-in-quantity-concepts.patch"
    patch_description: "Restore the dependent type marker in quantity concepts for Clang 15."
    patch_type: "portability"
  - patch_file: "patches/0006-fix-dependent-types-in-conversion-and-si-headers.patch"
    patch_description: "Restore dependent type markers in conversion and SI headers for Clang 15."
    patch_type: "portability"
  - patch_file: "patches/0007-fix-dependent-representation-types-in-random-header.patch"
    patch_description: "Restore dependent representation type markers in the random header for Clang 15."
    patch_type: "portability"
  - patch_file: "patches/0008-use-constexpr-for-clang-15-immediate-helpers.patch"
    patch_description: "Use constexpr for nested constant-evaluation helpers rejected by OHOS Clang 15."
    patch_type: "portability"
  - patch_file: "patches/0009-use-constexpr-for-base-value-helper.patch"
    patch_description: "Use constexpr for the base-value helper rejected in nested immediate calls by Clang 15."
    patch_type: "portability"
