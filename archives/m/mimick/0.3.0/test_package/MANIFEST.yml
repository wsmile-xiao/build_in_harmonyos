package: mimick/0.3.0
homepage: https://github.com/Snaipe/Mimick

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

upstream_tests:
  - file: test/test.c
    source: mimick-0.3.0/test/test.c
    description: "核心 mock、when、matcher、verify、errno 和 reset 测试"
    command: "./test/mmk_test"
  - file: sample/strdup/test.c
    source: mimick-0.3.0/sample/strdup/test.c
    description: "对共享库中的 malloc 进行 mock 并覆盖成功/ENOMEM 错误路径"
    command: "./sample/strdup/strdup_test"

test_package_tests:
  - file: test.c
    description: "通过 Conan 消费 mimick，运行完整核心 mock API 测试"
    command: "./test_mimick"

assertion_count: 33
