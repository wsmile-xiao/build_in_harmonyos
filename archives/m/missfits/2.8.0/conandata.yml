sources:
  missfits:
    url: "https://github.com/astromatic/missfits/archive/refs/tags/2.8.0.tar.gz"
    sha256: "704e0013b17b1a698e8c867fa5a6698a61ce42550a1d856a77e8fc4ef40fd654"

patches:
  - patch_file: "patches/0001-fitscat.h.patch"
    patch_description: "fitscat.h: bswapflag 从定义（int）改 extern 声明（被 custom.c 与 fits 库多 .c 包含导致 duplicate symbol 实测）"
    patch_type: "portability"
  - patch_file: "patches/0002-fitscat.c.patch"
    patch_description: "fitscat.c: 补 bswapflag 实际定义（extern 声明需单一 .c 提供定义）"
    patch_type: "portability"
  - patch_file: "patches/0003-globals.h.patch"
    patch_description: "globals.h: gstr 从定义（char）改 extern 声明（被多 .c 包含导致 duplicate symbol 实测）"
    patch_type: "portability"
  - patch_file: "patches/0004-prefs.h.patch"
    patch_description: "prefs.h: prefs（prefstruct）从定义改 extern 声明（被多 .c 包含导致 duplicate symbol 实测）"
    patch_type: "portability"
  - patch_file: "patches/0005-main.c.patch"
    patch_description: "main.c: 补 gstr/prefs 实际定义（extern 声明需单一 .c 提供定义）"
    patch_type: "portability"
