# conandata.yml — munin-c 0.0.13
# 官方源（GitHub tag 0.0.13）；sha256 取自下载件实测（init-build .tarball-sha256）。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/munin-monitoring/munin-c/archive/refs/tags/0.0.13.tar.gz"
    - "https://github.com/munin-monitoring/munin-c/archive/refs/tags/0.0.13.tar.gz"
  sha256: "fd03038fd796e0c9b5e7c8490bb8cc1bde7b5ea369710d178da96bd37303cee0"

# 0001-ohos-drop-man-pages.patch：man 页生成依赖 pod2man（Perl podlators），
# 交叉 CI worker 不保证可用；man 页非本包功能性产物，移除 man_MANS 使
# 构建不依赖 pod2man（common.am 的 %.1:%.pod 规则随之不会被触发）。
patches:
  - patch_file: "patches/0001-ohos-drop-man-pages.patch"
    patch_type: "portability"
    patch_description: "移除 man_MANS，构建不再依赖 pod2man（交叉环境无 Perl podlators）"
  - patch_file: "patches/0002-ohos-version-acinit.patch"
    patch_type: "portability"
    patch_description: "configure.ac：AC_INIT 版本固化为 0.0.13（getversion 目录名回退在 conan source 缓存中失效报 unknown）"
