# manifest.yaml — munin-c 0.0.13（ARCHIVE-SPEC v2.0）

version: "0.0.13"
software: "munin-c"
status: built
build_date: "2026-09-18"
build_system: autotools

source:
  url: "https://github.com/munin-monitoring/munin-c/archive/refs/tags/0.0.13.tar.gz"
  sha256: "fd03038fd796e0c9b5e7c8490bb8cc1bde7b5ea369710d178da96bd37303cee0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>"
    - "--disable-maintainer-mode"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-drop-man-pages.patch"
  - "0002-ohos-version-acinit.patch"

knowledge_gained:
  - "E386 闭环（autotools 配方）：profile buildenv 的 CONFIG_SHELL 会被 conanbuild.sh 后置覆盖工具链 env，唯一可靠修法是 build() 内联 env 前缀 + 实跑探针；bash/5.3 制品可作 CI 侧 shell，make 本身不带前缀"
  - "E011/E114：autoreconf 生成的 configure 内嵌 umask 077 建临时目录，HMDFS 读取被拒（subs1.awk Permission denied）；autoreconf 后 sed 022 即解"
  - "AC_INIT(m4_esyscmd_s(./getversion)) 类上游在 conan source 缓存下版本回退全落空报 unknown；补丁固化版本号最直接"
