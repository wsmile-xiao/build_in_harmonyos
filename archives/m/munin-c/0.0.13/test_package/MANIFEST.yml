# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: munin-c/0.0.13
homepage: "https://github.com/munin-monitoring/munin-c"

# 上游测试清点（R51 三步法，2026-09-18，tag 0.0.13）：
# configure.ac 的 AC_CONFIG_FILES 含 t/Makefile，但 t/Makefile.am 仅将
# ok_plugin/nb_env 作为 sbin_PROGRAMS 构建安装，全仓无 TESTS /
# check_PROGRAMS / check- 目标 → `make check` 无实际测试集，注册测试
# N_static = 0。t/ 目录 4 个文件（common.c/common.h/ok_plugin.c/nb_env.c）
# 为插件协议测试辅助工具，非自动化测试用例；清点证据见 notes.md。
upstream_check_command: "make check（无 TESTS 注册，空跑）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无注册测试集，故为空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_munin_c.sh
    description: "消费者测试：真机运行上游自带协议模拟器 ok_plugin（fetch/config 两模式协议输出断言）、munin-plugins-c argv0 多合一分发（cpu 读 /proc/stat）、munin-node-c/munin-inetd-c getopt 错误路径"
    command: "./test_munin_c.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
