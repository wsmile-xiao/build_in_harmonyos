  - "OHOS uses Clang built-in Inf/NaN classification in mawk's existing formatter and POSIX comparison path because the device configure probes do not expose the symbols"
  - "Force man/Makefile INSTALL to ../install-sh -c after configure because OHOS configure can emit non-UTF-8 mktemp noise into the detected INSTALL path"
