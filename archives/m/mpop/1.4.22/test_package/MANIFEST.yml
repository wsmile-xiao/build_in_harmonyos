# test_package/MANIFEST.yml — mpop 1.4.22
# CI L0e requires this file to exist; PF3 additionally requires it to be non-empty.

package: mpop/1.4.22
homepage: "https://marlam.de/mpop"

# ── 上游测试清点（R51 三步法：在解包树上实测，命令与输出逐条留档）────────────
upstream_tests_exist: false
upstream_test_audit:
  - source: "目录探测 ls -d tests test"
    reason: >-
      在解包树 /storage/Users/currentUser/tmp/uc2/z63-mpop/mpop-1.4.22 内实测，输出为
      `ls: tests: No such file or directory` 与 `ls: test: No such file or
      directory`，rc=1。上游 1.4.22 发布包没有任何 tests/ 或 test/ 目录。
  - source: "Makefile.am / src/Makefile.am / doc / scripts / configure.ac 的 TESTS 与 check_PROGRAMS 声明"
    reason: >-
      `grep -rnE "TESTS|check_PROGRAMS" Makefile.am src/Makefile.am doc/Makefile.am
      scripts/Makefile.am configure.ac` 无任何输出，rc=1 ⇒ automake 的测试登记为 0。
      src/Makefile.am 实测只有 `bin_PROGRAMS = mpop`（+ `if BUILD_MPOPD` 下追加
      mpopd）与 mpop_SOURCES/mpop_LDADD，没有任何测试目标。
  - source: "文件清单与已 configure 构建目录内的 make -n check 干跑"
    reason: >-
      `find . -type f | wc -l` = 126；`find . -name "*.c" | wc -l` = 22（全部是产品源文件）；
      `find . \( -iname "*test*" -o -iname "*check*" \)` 只有 1 个命中
      `./m4/progtest.m4` —— 那是 gettext/automake 自带的 m4 宏文件，不含任何用例 ⇒
      测试源文件数 0。已 configure 的构建目录
      （/storage/Users/currentUser/tmp/ch/home-mpop/p/b/mpop50d70158827a9/b/build-release）内
      `make -n check` 只展开 automake 的 check-recursive 脚手架（逐子目录进入
      src/po/doc/scripts 的 shell 片段），`make -n check | grep -c
      "test-driver\|LOG_DRIVER"` = 0 ⇒ 既没有测试驱动程序也没有任何 LOG_DRIVER 行，
      check 目标在本包实际为空。
  - conclusion: >-
      上游确无自动化测试（静态测试文件 0、静态判定条件 3 条），层 1 无可执行用例，
      验证由 test_package 承担：22 条行为断言真的执行打包后的 mpop 与 mpopd
      （版本横幅、Platform 三元组、TLS 后端、认证库集合、IDN、usage、6 类选项/参数校验诊断
      与 sysexits 退出码、3 类配置文件解析错误、--configure 的地址合法性、mpopd 的
      version/help/缺参路径），外加 1 条"去掉 Conan 运行库路径必须被加载器拒载"的
      R34 反证；另有 4 条平台断言直接解析打包 ELF（ELF64/AArch64、NEEDED 依赖闭包、
      .codesign 段、构建机绝对路径零泄漏）。POP3 登录、TLS 握手与 SASL 机制这三类
      需要真服务器的一面明确记为 skipped 并附实测错误签名，见下面的 skipped_evidence。

# 层 1 口径：本包 automake 生成的 check 目标存在但为空；配方 build() 仍执行一次
# `make check -j1 MAKEINFO=true`，让构建日志留下"没有测试可跑"的原始痕迹。
upstream_check_command: "make check -j1 MAKEINFO=true"
upstream_test_in_build: true
upstream_test_command: "make check -j1 MAKEINFO=true"

upstream_tests: []

# ── 五维账本（静态 / 可执行 / 实测通过 / 跳过 / 失败），上游维度全为 0 ──────
upstream_test_count: 0
upstream_tests_executable: 0
upstream_tests_ran: 0
upstream_tests_passed: 0
upstream_tests_skipped: 0
upstream_tests_failed: 0
upstream_tests_note: >-
  上游静态测试数 0 是清点结论而非环境结论（三条实测证据见上面 upstream_test_audit），
  因此"可执行数/实测通过数/跳过数/失败数"四项同样为 0。
  `make check -j1 MAKEINFO=true` 在 build() 中真实执行（create 日志第 294 行
  `RUN: make check -j1 MAKEINFO=true`），src/ 与 po/ 打印
  `Nothing to be done for 'check'`，doc/ 的 check-am 只重进 Texinfo 规则 ⇒ 空目标，非失败。

# 两个口径同时申报，避免"静态文件数"与"脚本自计检查点数"被混读：
#   static_upstream_test_files = 上游测试源文件数（=0，见审计第 3 条）
#   static_test_condition_count = 上面 3 条静态判定条件的条数
#   test_package 口径 = 脚本与 conanfile 自己打印的运行计数（见 logs）
static_upstream_test_files: 0
static_test_condition_count: 3

test_package_tests:
  - file: test_mpop.sh
    description: >-
      以使用者身份真实执行打包后的 mpop / mpopd，22 条运行期累加断言：两个可执行文件都在包里
      且可执行；`mpop --version` 退出码 0 且打印 config.status 替换出的 `mpop version 1.4.22`；
      Platform 行取到真实三元组 `aarch64-unknown-linux-ohos`（证明 E007 的 config.guess 补丁
      与 AC_CANONICAL_TARGET 一起走通）；`TLS/SSL library: GnuTLS` 证明 --with-tls=gnutls
      真的编进了包（三候选全失败时上游只 WARN 后静默出无 TLS 的包）；`Authentication library:
      built-in` 与不含 "GNU SASL" 证明 libgsasl 关断后的真实后果；`IDN support: enabled`
      证明 libidn2 被链入；`--help` 的 usage 与 --all-accounts 与上游 bug 地址；6 类命令行
      校验路径的 sysexits 退出码与诊断原文（未知长选项/--port=0/--pipelining=bogus/
      --received-header=bogus/--host 与 --all-accounts 互斥/--all-accounts 与账户列表互斥
      均为 EX_USAGE=64）；3 类配置文件解析（-C 指向不存在文件 ⇒ EX_IOERR=74 且诊断点名文件；
      裸 account 关键字 ⇒ EX_CONFIG=78 + "missing account name"；无账户 ⇒ EX_CONFIG=78 +
      "no accounts defined"）；--configure 对无 @ 地址返回 EX_DATAERR=65（该分支在任何
      SRV/res_query 之前）；mpopd 的 --version / --help / 缺 --auth 与 --maildir 三条路径；
      最后一条是负对照：把 Conan 运行库路径换成空目录后 mpop 必须以
      "Error loading shared library" 被加载器拒载（rc!=0），即被测二进制确实消费本包依赖闭包
      而不是宿主同名库（R34）。
    command: "sh test_mpop.sh <package_folder> <package_folder>/bin <build-release>/scratch <依赖 libdir 列表>"
    assertion_count: 22
    log_lines:
      - "mpop consumer behaviour checks: 22 checks passed"
  - file: conanfile.py
    description: >-
      test() 内用纯 Python 解析打包 ELF 头/程序头/段头，做 4 条平台断言并逐条打印 OK 行：
      ELF64 + e_machine=183(AArch64)；DT_NEEDED 同时含 libgnutls.so* 与 libidn2.so*
      （实测 6 条：libc.so、libgcrypt.so.20、libgnutls.so.30、libgpg-error.so.0、
      libidn2.so.0、libtasn1.so.6 ⇒ 两个声明的 host 依赖都被真实消费）；存在 .codesign 段；
      二进制字节内不出现任何构建机绝对路径（CONAN_HOME 根、构建目录、包目录三种前缀各扫描
      0 命中）。脚本还断言行为断言条数与本文件申报值一致（SCRIPT_CHECKS=22，漂移即抛
      ConanException），并把 26 这个总数以机器可读行 `HMBS_TEST_PACKAGE_RESULT={...}` 打印。
    command: "conan create . （自动执行 test_package）"
    assertion_count: 4
    log_lines:
      - "HMBS_TEST_PACKAGE_RESULT={\"command\": \"sh test_mpop.sh (behaviour) + packaged-ELF parsing\", \"consumer_passed\": 26, \"consumer_total\": 26, \"executed\": true, \"passed\": true}"

# ── 消费者总数（22 行为 + 4 平台 = 26，与上面两行日志同源）─────────────────
test_package_test_count: 2
consumer_assertion_count: 26
assertion_count: 45
# assertion_count 用的是「判定表达式静态数」口径：test_mpop.sh 里 41 个 expect_rc/expect_has/
# expect_absent 调用点（一条用例可含多条断言）+ conanfile.py 的 4 项 ELF 平台检查 = 45。
# 与 test_case_count: 26（22 个 report 调用点 + 4 项平台检查 = 实际打印/计数出来的用例数）并存，
# 两者不互相替换。复现命令：
#   grep -oE 'expect_(rc|has|absent)' test_mpop.sh | wc -l   -> 41
#   grep -cE '^[[:space:]]*report ' test_mpop.sh              -> 22
test_case_count: 26

# ── 真跑不到的部分：逐条 skipped + 实测错误签名，不记成通过、不缩分母 ────────
consumer_skipped: 3
consumer_skipped_evidence:
  - feature: "POP3 会话（USER/PASS、STAT/LIST/RETR/DELE/UIDL）与 --serverinfo"
    reason: "设备无外网 POP3 服务，且无可用的本地 POP3 监听方（无 ss/ip/nc，/proc/net/tcp=EACCES）"
    measured: >-
      交付配置后真实执行 `mpop --delivery=maildir,<dir> --host=127.0.0.1 --port=1999
      --user=u --passwordeval='echo x'` ⇒ stderr 原文
      `mpop: cannot connect to 127.0.0.1, port 1999: Connection refused` 与
      `mpop: error during mail retrieval`，退出码 75（EX_TEMPFAIL）。
      即 TCP 连接与错误上报链路本身在 OHOS 上工作正常，缺的是服务器端。
  - feature: "getaddrinfo 解析 + IDN 主机名实际解析上网"
    reason: "设备无外网 DNS 出口（解析族能力面残缺）"
    measured: >-
      `mpop --delivery=... --host=does-not-exist.invalid --user=u
      --passwordeval='echo x'` ⇒ stderr 原文
      `mpop: cannot locate host does-not-exist.invalid: Try again`，退出码 75。
      该签名是 getaddrinfo 返回 EAI_AGAIN 并被 mpop 原样报出的结果 ⇒ 解析调用链通、
      无新失败签名（库内已写过的 EAI_* 行为），只是没有可达域名。
  - feature: "TLS 握手（GnuTLS stunnel/STARTTLS）、APOP/CRAM-MD5 等需服务器的认证协商"
    reason: >-
      需要一个能被连接的 POP3S/STARTTLS 对端；设备既无外网也无本地监听服务可当对端。
      另有一层结构性原因：libgsasl 无法启用（制品仓无 libgsasl>=2.1 的可用包），
      故 CRAM-MD5/DIGEST-MD5/SCRAM-*/OAUTHBEARER 这些机制在本包构建里根本不存在。
    measured: >-
      `mpop --delivery=... --host=127.0.0.1 --port=25 --user=u
      --passwordeval='echo x' --tls=on` ⇒ `mpop: cannot connect to 127.0.0.1,
      port 25: Connection refused` ⇒ 握手代码路径不可达。
      TLS 后端的**链接与配置**一面不在此列，已由 `TLS/SSL library: GnuTLS` 与
      DT_NEEDED 的 libgnutls.so.30 两条实测断言覆盖。
