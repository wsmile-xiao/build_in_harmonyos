# conandata.yml — mpop 1.4.22
# 官方上游直链（marlam.de 是 mpop 的官方站点；下载页 href 为 ../releases/，
# 所以正确前缀是 /mpop/releases/，后缀 .tar.xz）。
# 实测：HTTP 200、408348 字节、sha256 与下方一致（在 B 机
# ~/tmp/uc2/z63-mpop/mpop.tar.xz 上 sha256sum 复核过）。
# ⛔ 未使用任何镜像前缀 / file://（R39）；
# ⛔ marlam.de/mpop/download/mpop-1.4.22.tar.{gz,xz} 实测 404，不写；
# ⛔ Debian 池里的同名包是另一版本 1.4.21 且 deb.debian.org 被 PF7 拉黑，不写。
# 上游只提供分离的 .sig 签名，没有 .sha256 sidecar，故校验值来自本地实测。
sources:
  "1.4.22":
    url: "https://marlam.de/mpop/releases/mpop-1.4.22.tar.xz"
    sha256: "2cd64a9c29a5ade3429230c70610ca4b6ea305fbc264f6961b5d85a7a8cecd4b"

# configure 的 umask 改写发生在 build() 内（configure 是发布包里的生成文件，
# 按补丁规范不得用 .patch 改生成文件），见 conanfile._fix_configure_umask()。
# config.guess / config.sub 不是本包生成的文件，而是 autotools 随包携带的
# GNU 脚本，因此按 corpus 惯例走 patches/（E007 处方，用仓内
# scripts/patch-autotools-ohos.pl 生成，两条 diff 均 patch -p1 --dry-run 通过）。
patches:
  - patch_file: "patches/0001-build-aux-config.guess-ohos.patch"
    patch_description: "E007: teach build-aux/config.guess the HarmonyOS/ OHOS branch so AC_CANONICAL_TARGET stops dying with 'cannot guess build type'"
    patch_type: "portability"
  - patch_file: "patches/0002-build-aux-config.sub-ohos.patch"
    patch_description: "E007: accept the *-unknown-linux-ohos triplet in build-aux/config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-src-base64.h-include-stdbool.patch"
    patch_description: "src/base64.h (vendored from gnulib) declares bool-returning prototypes without including stdbool.h; it only compiles on a C23 compiler, while the OHOS clang 15 defaults to C17 (__STDC_VERSION__ 201710L)"
    patch_type: "bugfix"
  - patch_file: "patches/0004-src-password.c-guard-getpass.patch"
    patch_description: "guard the getpass() call with the HAVE_GETPASS that configure already probes: the OHOS C library neither declares getpass() in unistd.h nor exports the symbol, so the final link died with 'ld.lld: error: undefined symbol: getpass / referenced by password.c'"
    patch_type: "portability"

