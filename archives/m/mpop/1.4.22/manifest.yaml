software: "mpop"
status: built
build_date: "2026-09-26"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方站点 marlam.de 的发布目录。登记表/候选行给的
  # https://marlam.de/mpop/download/mpop-1.4.22.tar.gz 实测 404（341 字节的错误页）；
  # 下载页 href 为 ../releases/ ⇒ 正确直链是 /mpop/releases/mpop-1.4.22.tar.xz，
  # B 机实测 HTTP 200、408348 字节，sha256 与下方一致（本地 sha256sum 复核）。
  # ⛔ 不用镜像前缀、不用 file://（R39）；⛔ 不用 Debian 池的同名件（PF7 拉黑该域，
  # 且池里是另一版本 1.4.21）。上游只提供分离的 .sig，没有 .sha256 sidecar。
  url: "https://marlam.de/mpop/releases/mpop-1.4.22.tar.xz"
  sha256: "2cd64a9c29a5ade3429230c70610ca4b6ea305fbc264f6961b5d85a7a8cecd4b"
  tar_format: tar.xz
  size_bytes: 408348

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=/（AutotoolsToolchain 默认，安装期由 DESTDIR=<package_folder> 落包）"
    - "--with-tls=gnutls：上游默认值，显式钉住以免误链宿主 OpenSSL；mtls-gnutls.c 需要 gnutls.h 与 libgcrypt/libgpg-error/libtasn1 闭包"
    - "--without-libgsasl：configure.ac 硬约束 libgsasl >= 2.1，制品仓只登记 1.8.1 且该归档目录没有 conanfile.py ⇒ 无可消费依赖。后果：CRAM-MD5/DIGEST-MD5/SCRAM-*/OAUTHBEARER/NTLM 机制在本构建中不存在（消费者测试把 'Authentication library: built-in' 做成断言，不掩盖）"
    - "--with-libidn：选项名是历史遗留的 --with-libidn，实际探测模块是 PKG_CHECK_MODULES([libidn2], [libidn2 >= 0.0]) ⇒ 由 libidn2/2.3.8 满足"
    - "--without-libsecret：模块 libsecret-1 会拖入整条 glib 闭包，无头 POP3 客户端无使用面"
    - "--without-macosx-keyring：探测默认开启，非 macOS 显式关闭以免误捡"
    - "--disable-nls：gettext/0.22.5.1 虽已发布，但其 cpp_info.libs 列了包里实际不提供的 libasprintf ⇒ 链上去就是悬空 -lasprintf；关掉后 LIBINTL 退化为空"
    - "其余目录变量由 AutotoolsToolchain 写入，配方不自加编译开关（R1/R33/R49）"
  build_command: >-
    unset CONFIG_SHELL; LD_LIBRARY_PATH=<依赖闭包 libdir 列表> ./configure
    <Autotools._configure_args> && make -j1 MAKEINFO=true
    && make check -j1 MAKEINFO=true
  configure_note: >-
    不使用 autotools.configure()：profile [buildenv] 导出的
    CONFIG_SHELL=/data/service/hnp/bin/bash 在 HMDFS 上 getcwd() 失败，autoconf 生成的
    configure 会用 $CONFIG_SHELL re-exec 自身，起手即报 working directory cannot be
    determined（E386，与同窗 wmcore/lft 实测一致）⇒ 必须在同一条 shell 命令里 unset；
    同一条命令内联 LD_LIBRARY_PATH 是 E467 处方（AutotoolsDeps 注入 $LIBS 会让最早的
    "能否运行 C 程序"探测链接整条依赖闭包而被加载器拒载，被 autoconf 误报成编译器不可用）。
    layout 用 basic_layout(self)；configure 参数仍取 Autotools._configure_args。
  makeinfo_note: >-
    doc/Makefile.am 有 info_TEXINFOS = mpop.texi ⇒ make/check/install 都要 makeinfo；
    设备实测无该命令，且 archives/t/texinfo/7.3 目录没有 conanfile.py（未发布）⇒ 不能
    tool_requires。取 corpus 自有惯例 MAKEINFO=true 挂在 make 命令行上（先例
    archives/a/autoconf/2.72、archives/a/anubis/4.3）；发布包自带生成好的 doc/mpop.info，
    只是不再重生成，man 与 info 页照常安装。
  install_method: "Autotools.install(target='install', args=['-j1','MAKEINFO=true'])；产物进 <pkg>/bin/{mpop,mpopd}、<pkg>/share/man/man1、<pkg>/share/info，licenses/COPYING 由配方 copy() 落位"
  dependencies:
    - "gnutls/3.8.10（transitive_headers/transitive_libs；TLS 后端与 mtls-gnutls.c）"
    - "libidn2/2.3.8（transitive_headers/transitive_libs；IDN 主机名）"
  dependency_track_note: >-
    只声明两条。libgsasl（版本约束无满足者）、gettext（已发布但 cpp_info 悬空 libasprintf）、
    libsecret（glib 闭包）三条均**有意不声明**，理由与实测证据写在 conanfile 模块 docstring、
    notes.md「依赖面」节与本文件的 configure_options 里。
    实测 DT_NEEDED 闭包 = libc.so, libgcrypt.so.20, libgnutls.so.30, libgpg-error.so.0,
    libidn2.so.0, libtasn1.so.6（共享依赖 ⇒ 运行期需 Conan run 环境，消费者测试据此做了负对照）。
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-build-aux-config.guess-ohos.patch"
  - "0002-build-aux-config.sub-ohos.patch"
  - "0003-src-base64.h-include-stdbool.patch"
  - "0004-src-password.c-guard-getpass.patch"

patch_classification:
  - file: 0001-build-aux-config.guess-ohos.patch
    type: platform-build-environment
    upstream_rationale: "E007/E160：随包 build-aux/config.guess 无 HarmonyOS 分支 ⇒ configure 在 AC_CANONICAL_TARGET 报 cannot guess build type；用仓内 scripts/patch-autotools-ohos.pl 生成 diff，随包提交而非运行期改"
  - file: 0002-build-aux-config.sub-ohos.patch
    type: platform-build-environment
    upstream_rationale: "E007 配套：config.sub 需接受 *-unknown-linux-ohos 三元组"
  - file: 0003-src-base64.h-include-stdbool.patch
    type: upstream-bugfix
    upstream_rationale: "gnulib vendored 的 src/base64.h 声明 bool 原型却不 include stdbool.h，只有 C23（bool 成关键字）才能编译；OHOS clang15 默认 C17（__STDC_VERSION__=201710L）⇒ unknown type name bool 两处"
  - file: 0004-src-password.c-guard-getpass.patch
    type: platform-portability
    upstream_rationale: "上游有 AC_CHECK_FUNCS([getpass]) 且本设备实测 config.h 里为 /* #undef HAVE_GETPASS */，但 src/password.c:215 无条件调用 ⇒ 链接期 ld.lld: undefined symbol: getpass。处方＝把上游自己已有的 HAVE_GETPASS 宏用起来加守护；功能后果：OHOS 上交互式口令不可用，改走 password_program/--passwordeval 或 netrc"

in_build_source_transformations:
  - file: configure
    type: platform-build-environment
    applied_by: "conanfile._fix_configure_umask()（build() 内就地改写，不落 patches/）"
    change: "umask 077 → umask 022（实测命中 2 处，日志原文 E011: rewrote 2 occurrence(s)）"
    reason: >-
      E011/E114：config.status 以 (umask 077 && mktemp -d "./confXXXXXX") 建临时目录，
      HMDFS 上 0700 目录回读成 0660（丢检索位）⇒ 后续写 subs*.awk 报 Permission denied。
      configure 是发布包生成文件，按 CONTRIBUTING 不用 .patch 改生成文件；未命中打 warning 不静默。

# ============================================================
# 知识沉淀（引用的既有知识条目）
# ============================================================

knowledge_ref:
  - "E007"   # autotools helper 三元组：禁 --build/--host 绕过，改 config.guess/config.sub
  - "E160"   # config.guess 不识别 HarmonyOS 的同族签名
  - "E011"   # HMDFS umask 077 → config.status 临时目录不可用
  - "E114"   # 同族就地改写形态
  - "E386"   # CONFIG_SHELL 指向 getcwd 失败的 HNP bash：同命令内 unset
  - "E467"   # AutotoolsDeps 注入 LIBS 使首个运行探测被加载器拒载：同命令内联 LD_LIBRARY_PATH

knowledge_gained:
  - "新增机制（随本 PR 以 knowledge/drafts/ 草稿 + Issue 交付）：OHOS libc 缺函数时，上游 configure 可能已经把该函数探测对了（HAVE_GETPASS 未定义），却在调用点漏加守护 ⇒ 失败推迟到链接期（ld.lld: undefined symbol）。处方＝复用上游自己的 HAVE_ 宏补 #ifdef，并把功能后果写成可观察断言。与 E320（探测为真而运行期不可用，需 AC_RUN_IFELSE）和 E516（libc 不提供 _res/__res_state）构成'探测—现实—调用点'三角的第三种形态。"

