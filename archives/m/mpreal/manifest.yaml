# 软件级 manifest — mpreal
# 遵循 ARCHIVE-SPEC v3.0

software: mpreal
display: "mpreal"
description: "MPFR 任意精度浮点库的单头文件 C++ 封装（mpfr::mpreal）"
category: math
homepage: "https://github.com/advanpix/mpreal"
license: MIT

build_system: custom

ohos_adaptation:
  key_points:
    - "header-only 单头文件库：package() 仅安装 include/mpreal.h + licenses/，package_type=header-library 且 package_id 清空"
    - "依赖 mpfr/4.2.2.1（传递引入 gmp/6.3.0，均已发布），消费者测试真实链接 libmpfr+libgmp 并在真机执行"
    - "上游无测试套件（仅 example/ 演示程序，R51 如实申报 0），验证由消费者测试承担（9 断言：精度设置/乘法/sqrt/比较/toString）"
  common_dependencies:
    - mpfr

versions:
  "3.7.1":
    status: built
    build_date: 2026-09-13
