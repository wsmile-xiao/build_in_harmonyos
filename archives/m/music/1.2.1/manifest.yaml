knowledge_gained:
  - "testsuite/Makefile.am 无 TESTS = 且 SUBDIRS 受 COND_USE_MPI 门控 ⇒ make check 注册 0，真实入口是 configure 生成的 bin/music_tests（注册 14 项）"
  - "装机版 music_tests 把 configure 期绝对前缀烧死在脚本里，DESTDIR 暂存时指向不存在的 package_folder，需让前缀可被 MUSIC_TEST_* 覆盖"
  - "上游 run_test 硬编码 4s 超时，在本设备上是假超时，需可配置（补丁 0002）"
  - "loop.test 引用未定义变量 TEST_BINARY，路径塌成 /eventdelay（补丁 0003，本轮构建内实测生效）"
  - "PM=gforker 时各 rank 继承同一 stdout fd 且写非行原子，多 rank 输出会逐字交错 ⇒ 比对型用例假失败；本制品仓无 hydra 版 MPICH 可用"
  - "conan 的 SHELL/CONFIG_SHELL 指向 hnp bash 时在 HMDFS 构建目录内 getcwd 必挂（E386 家族）；叠加 runner 对 TEST_OUTDIR 的 rm -rf + mkdir 造成孤儿 inode ⇒ 子 shell os.getcwd() FileNotFoundError。修法：cd build_folder + PWD 预置 + unset CONFIG_SHELL + SHELL=/bin/sh，且不得 cd 进 TEST_OUTDIR"
  - "run_test 首轮判 FAILED 即 return 2，上游 .test 随即 exit ⇒ 同一 .test 的后续 method 轮不执行；静态展开轮次与实际执行轮次必须分列（23 vs 18）"
