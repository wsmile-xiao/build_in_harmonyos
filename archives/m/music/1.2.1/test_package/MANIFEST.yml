# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: music/1.2.1
homepage: "https://github.com/INCF/MUSIC"

# 上游测试命令：`make check` 在本包注册 0 项（testsuite/Makefile.am 无 `TESTS =`，
# 且 SUBDIRS 受 COND_USE_MPI 门控），真实入口是 configure 生成的 runner。
upstream_check_command: "make check"

# conanfile.py build() 是否真实执行上游测试：是。
# build() 第 76 行调用 _run_upstream_suite()，用装机 bin/music_tests 跑 sanity 套件
# （单条 45s / 整套 1800s 预算）。2026-10-11 05:40:12 那次 create（rev 7c441a784bce5d4fe97868dec6c7ad92，
# 待验证 HEAD 2411ef11a44004cce14c9a0a89da2f99648b95df）已在配方内取得全部 14 项判决：
#   registered=14 executed=14 pass=4 fail=9 timeout=1 skip=0
#   轮级：静态 N_rounds_static=23，实际执行 18 轮（OK 8 + FAILED 9 + TIMEOUT 1），
#         未抵达 5 轮（chain/const/launchtest.test/loop/messages 的 collective 轮）——
#         首轮 run_test 判 FAILED 即 return 2 使 .test 早退，属上游 runner 机制，不是平台跳过，
#         不并入通过、不从分母删除、不记 skip。
#   suite_abort=0，xgetcwd: 签名 0 次出现（01:41 那次的 14 项全 abort 读数已作废）。
# 仍如实申报一处限制：该步以 ignore_errors=True 执行、结果只汇总不拦构建
#   （conanfile.py 的 _run_upstream_suite/_report_suite）⇒ 上游失败不构成构建闸门。
upstream_test_in_build: true
upstream_test_command: "bin/music_tests  # 由 build() 内 music-ohos-suite.sh 以 timeout 1800 sh <runner> 执行"

# 上游实际运行的测试程序（runner 注册面 N_registered=14；逐条判决与分类见
# archives/m/music/1.2.1/test-ledger.tsv，25 行 = 23 轮 + 2 个非轮条目）
upstream_tests:
  - file: testsuite/unittests/catch/test_ag.cc
    source: music-1.2.1/testsuite/unittests/catch/test_ag.cc
    description: "Catch2 单元测试（unittests/catch，testlib_PROGRAMS=test_ag；TEST_CASE=1，内含 86 条 Catch 断言）"
    command: "./test_ag"
  - file: testsuite/sanitytests/launchtest.cc
    source: music-1.2.1/testsuite/sanitytests/launchtest.cc
    description: "sanitytests testbin_PROGRAMS 之一，作为 runner 条目直接执行"
    command: "./launchtest"
  - file: testsuite/sanitytests/const.test
    source: music-1.2.1/testsuite/sanitytests/const.test
    description: "12 个 .test 行为用例之一（point-to-point / collective 两轮）；由 bin/music_tests 调度，用例内部调 run_test 比对 out/ok 与 err/errok。本轮 point-to-point 轮 FAILED（200/200 行、14 处逐字行交错），collective 轮未抵达"
    command: "sh const.test  # 经 music_tests 调度"
  - file: testsuite/sanitytests/events.test
    source: music-1.2.1/testsuite/sanitytests/events.test
    description: "事件投递用例；本轮两轮均 OK（item 级 PASS）。10-10 batch2 的 collective 轮交错失败读数本轮未复现，已作废"
    command: "sh events.test  # 经 music_tests 调度"
  - file: testsuite/sanitytests/multiport.test
    source: music-1.2.1/testsuite/sanitytests/multiport.test
    description: "多端口用例（单轮，无 for method 循环）；本轮 FAILED，err 签名 internal_Allgatherv + errno=104 Connection reset by peer ⇒ 对端 rank 先终止属后果，未定性，不得记平台受限"
    command: "sh multiport.test  # 经 music_tests 调度"
  - file: testsuite/sanitytests/fork.test
    source: music-1.2.1/testsuite/sanitytests/fork.test
    description: "fork 用例；point-to-point 轮 OK，collective 轮 45s 预算超时（rc=15，48.67s）⇒ 无判定（timeout_no_verdict），不得记通过"
    command: "sh fork.test  # 经 music_tests 调度"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_music.cc
    description: "真实 API 消费者测试：mpiexec -n 2 下调用 MUSIC::predictRank 与 MUSIC::Configuration 往返，自写 check(bool, const char*) 计数 failures 决定退出码"
    command: "./test_music"

# 测试断言总数：消费者侧 13 条断言 × 2 rank = 26（create2.log
# MUSIC_CONSUMER rank=0/1 failures=0 checks=13）；上游 test_ag 另有 86 条 Catch 断言，另行计
assertion_count: 26

# 内存预算与实测峰值（AGENTS §14.1④：test_package/smoke 一律经 memcap-run.py 执行并记录）
# MEMCAP[run] peak=406MB budget=4000MB rc=0 用时457.7s（含 conan create 全程：编译 + 上游套件 + 消费者测试）
max_rss_mb: 406

# 上游套件四档同源读数（唯一分母载体 = archives/m/music/1.2.1/test-ledger.tsv）
upstream_suite_readings:
  registered: 14
  executed: 14
  passed: 4
  failed: 9
  timeout_no_verdict: 1
  skipped: 0
  rounds_static: 23
  rounds_executed: 18
  rounds_unreached: 5
  consumer_assertions: 26
  consumer_failures: 0

# §10.1 五维账本（五个分母分别记，不得互相替代）
test_ledger_dimensions:
  n_static_automake_tests: 0
  n_static_declared_units: 20
  n_rounds_static: 23
  n_registered: 14
  n_executed_items: 14
  n_executed_rounds: 18
  n_unreached_rounds: 5
  n_skipped_items: 0
  n_consumer_programs: 1
  n_consumer_assertions: 26
  basis: >-
    automake TESTS = 注册 0 仅在窄意义成立（testsuite/Makefile.am 无 TESTS =，SUBDIRS 受
    COND_USE_MPI 门控）；静态声明面 20 = 6 个 testbin_PROGRAMS + test_ag（1 个 TEST_CASE / 86 条
    Catch 断言）+ 12 个 .test + run_test；N_registered=14 取 bin/music_tests --showme-tests 实列，
    是本轮唯一执行分母；未抵达的 5 个 collective 轮记"未达"（首轮 run_test 判 FAILED 即 return 2
    使 .test 早退），不记 skip、不并入通过、不从分母删除。
  pass_rate_with_denominator: >-
    执行项 4/14 = 28.6%；执行轮 8/18 = 44.4%；静态全量轮 8/23 = 34.8%；消费者 26/26 = 100%。
    上游侧未达 100%，不得把部分成功写成适配成功；SIGKILL/超时（timeout_no_verdict 1 项）一律不记 PASS。

# 4 项未定性失败（逐条技术原因；归因未证实 ⇒ 写"未达定案"，判决保持 FAILED，
# 不折进"平台受限"、不折进"通过"、不删用例、不缩分母）
unproven_failed_items:
  - item: chain.test
    round: point-to-point
    observed: >-
      事件 4 的到达时间 0.89 与用例期望 0.67 不符；输出行完整、无逐字交错、err 中无 MPI 报错。
    attribution_status: 未达定案（差异在投递时序，缺同一 PM 下 1 rank / 2 rank 的基线对照）
  - item: launchtest.test
    round: point-to-point
    observed: >-
      用例内以 np=3 故意非法自连，而上游参照文件 ok 与 errok 均为空 ⇒ 参照与错误路径不自洽。
    attribution_status: 未达定案（上游用例自相矛盾，需上游参照文件口径确认，非本适配引入）
  - item: messages.test
    round: point-to-point
    observed: >-
      given 5 行 vs expected 10 行，各行内容完整、err=0 ⇒ 是投递条数差异，不是行交错也不是崩溃。
    attribution_status: 未达定案（未取到最小复现，不得记平台受限）
  - item: multiport.test
    round: single
    observed: >-
      internal_Allgatherv 报 MPIDI_CH3I_Socki_handle_read(3641) connection failure
      errno=104 Connection reset by peer ⇒ 对端 rank 先终止，Allgatherv 报错是后果而非根因。
    attribution_status: 未达定案（根因未定位，本轮 np 求和 2× 旧签名未复现，旧归因已作废）

# 消费者测试执行面与交叉分支（AGENTS §10.1：数字与执行面同源；26/26 读数未改）
consumer_execution_face: "本机非交叉：create2.log Profile host（L16-25）与 Profile build（L37-46）settings 逐项全同（arch=armv8 / build_type=Release / compiler=clang / compiler.cppstd=17 / compiler.libcxx=libc++ / compiler.version=15 / os=OHOS / os.version=6.0）⇒ cross_building()=False ⇒ conanfile.py:42-44 交叉早退分支未触发（日志内 cross-building 出现 0 次）⇒ test() 实跑 mpiexec -n 2 test_music，逐 rank MUSIC_CONSUMER rank=0/1 failures=0 checks=13"
consumer_cross_building_caveat: "潜在限制（本窗未观测）：host 与 build 不一致的交叉 profile（典型为 CI worker）下 test() 会在 conanfile.py:42-44 打印 cross-building: consumer verified by compile+link only 并 return，消费者面退化为只编译加链接、不执行断言；该情形只能申报已编译加已链接，不得沿用 assertion_count=26 的执行读数"
consumer_execution_face_evidence: "~/tmp/uc2/QDR-1009-E06/create2.log（1240 行）grep -c cross-building = 0；UPSTREAM SUITE 与 MUSIC_CONSUMER 判决行逐字见 notes.md 与 test-ledger.tsv"
