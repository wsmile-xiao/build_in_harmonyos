# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: msquic/2.6.1
homepage: "https://github.com/microsoft/msquic"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: src/core/unittest/*.cpp
    source: msquic-2.6.1/src/core/unittest/
    description: "msquiccoretest - core QUIC logic unit tests (loss/congestion/frames/ranges)"
    command: "./msquiccoretest"
  - file: src/platform/unittest/*.cpp
    source: msquic-2.6.1/src/platform/unittest/
    description: "msquicplatformtest - platform layer unit tests (crypt/datapath/storage/tls)"
    command: "./msquicplatformtest"
  - file: src/test/bin/quic_gtest.cpp
    source: msquic-2.6.1/src/test/bin/quic_gtest.cpp
    description: "msquictest - end-to-end QUIC handshake/data-path tests (requires loopback network + self-signed certs)"
    command: "./msquictest"

test_package_tests:
  - file: test.c
    description: "Consumer test - MsQuicOpen2/GetParam(TLS_PROVIDER)/RegistrationOpen/ConfigurationOpen lifecycle on musl pthreads"
    command: "./test_msquic"

assertion_count: 4
