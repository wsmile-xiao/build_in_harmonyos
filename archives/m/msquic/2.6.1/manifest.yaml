software: msquic
version: "2.6.1"
status: published
build_date: "2026-09-16"
build_system: cmake

source:
  url: "https://github.com/microsoft/msquic/archive/refs/tags/v2.6.1.tar.gz"
  sha256: "f1ec3cb72955d1d5e06d8d1bf184fdc9778e6baa98410ca480ca5d94fbc414de"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "QUIC_TLS_LIB=openssl"
    - "QUIC_USE_EXTERNAL_OPENSSL=ON"
    - "QUIC_BUILD_TOOLS=OFF"
    - "QUIC_BUILD_TEST=OFF"
    - "QUIC_BUILD_PERF=OFF"
    - "QUIC_ENABLE_LOGGING=OFF"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - openssl/3.5.8.1
  cc: clang
  cxx: clang++
  target: libmsquic.so.2.6.1 (SONAME libmsquic.so.2)

patches_applied:
  - "0001-platform-posix-ohos-affinity.patch"
  - "0002-datapath-linux-musl-cmsg-sign-compare.patch"
  - "0003-datapath-epoll-musl-cmsg-sign-compare.patch"

quality_gates:
  G0: passed
  G1: passed
  G2: passed
  G3: passed
  G4: passed

knowledge_applied:
  - E013

notes:
  - "musl 无 pthread_setaffinity_np（glibc 扩展）：补丁 0001 对齐上游 __ANDROID__ 策略跳过 post-create 亲和性设置（性能优化非功能必需）"
  - "musl CMSG_NXTHDR 宏内部混用 size_t/ptrdiff_t 触发 -Werror -Wsign-compare：补丁 0002/0003 对两个 datapath 编译单元加 pragma 降噪（glibc 同宏无此问题）"
  - "QUIC_ENABLE_LOGGING=OFF：lttng-ust 在 OHOS 不可用，stub 日志保持公共 ABI 不变"
  - "上游 tarball 不含 submodule 内容（openssl/googletest 均为空目录），TLS 走 conan openssl/3.5.8.1 外链，测试套件依赖 googletest submodule（本地联网补跑）"
  - "产物验证：libmsquic.so.2.6.1 AArch64 DYN，NEEDED 仅 libc.so（openssl 3.5.8 静态链入），MsQuicOpenVersion/MsQuicClose 符号已导出（versioned 'msquic'）"
