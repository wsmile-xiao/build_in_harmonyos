# conandata.yml — mussh 1.0
# Official upstream source (SourceForge project download channel);
# sha256 measured locally after download (sha256sum mussh-1.0.tgz).

sources:
  "1.0":
    url: "https://downloads.sourceforge.net/mussh/mussh-1.0.tgz"
    sha256: "6ba883cfaacc3f54c2643e8790556ff7b17da73c9e0d4e18346a51791fedd267"

patches:
  "1.0":
    - patch_file: "patches/0001-shebang-env-bash.patch"
      patch_description: "shebang /bin/bash -> /usr/bin/env bash: the CI worker and local sandbox have no /bin/bash (bad interpreter, PR#7998 CI evidence); env resolves bash via PATH"
      patch_type: "portability"
    - patch_file: "patches/0002-mktemp-tmpdir.patch"
      patch_description: "TEMP_BASE=/tmp -> ${TMPDIR:-/tmp}: HarmonyOS sandbox mounts /tmp as read-only erofs (E002), mktemp -d /tmp/... always fails; TMPDIR is honored, upstream behavior unchanged when TMPDIR unset"
      patch_type: "portability"
