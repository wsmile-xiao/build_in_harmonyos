# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "纯 bash 脚本包零编译适配: package_type=application + package_id()
  self.info.clear() 使包跨平台一致, build() 仅保留 apply_conandata_patches
  no-op 以支持未来补丁"
- "压缩包根目录为 mussh/, source() 的 get() 需 strip_root=True"
- "安装必须显式挑选目标文件 (mussh/mussh.1/README/CHANGES), 禁止整目录
  拷贝 — 包内含 .swp/.mussh.1.swp/mussh.bak/mussh.spec/casetest.sh 杂物"
- "conan get() 解压不保证执行位, bin/mussh 需显式 os.chmod 0o755"
- "运行时依赖 (ssh/ssh-agent/ssh-add/sed/cat/mktemp/hostname/awk) 全部
  是系统命令, 无任何 Conan 库依赖"
- "上游 test/ 3 个 shell 集成测试需真实 sshd+免密登录, CI 不具备条件,
  不移植执行; 执行类验证由 test_package (explicit) 的 mussh -V 承担"
- "test_package 除 conanfile.py 外必须含实体测试源文件 (.c/.cpp/.sh/.py,
  CI L0c 门禁), 纯 conanfile 断言会被 no_test_sources 拦截 — 已补
  test_mussh.sh 承担 mussh -V 执行验证"
- "上游 3 个集成测试的 1-e 归因: mussh 多主机编排依赖临时目录文件协议
  (hostlist.lock 锁 + rm/mv 收缩 hostlist), HMDFS (沙箱唯一用户可写
  文件系统) 写后读不一致导致该协议无法终止 (2641+ 次循环现场尸检
  hostlist 恒为初始值); 沙箱无非 HMDFS 可写文件系统 (6 候选穷尽);
  已部署 paramiko 协议级 SSH 服务端实测: mussh 编排 144 次 ssh 连接
  全部成功 (10_basic 核心断言在编排层成立), 0002 补丁修复 mktemp /tmp
  只读问题"
- "本沙箱域禁止执行脚本/ELF (E052/E077 同源), 本地 W3 仅验证打包完整性,
  运行验证交 CI conan test"
- "鸿蒙特有测试 test_harmony_tmpdir.sh (rule12): 通过 mktemp stub 断言
  mussh 临时目录基址遵循 TMPDIR——鸿蒙 /tmp 只读 erofs 是平台特有约束,
  对应 0002-mktemp-tmpdir.patch 的适配点验证"
