# test_package/MANIFEST.yml — 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# mussh 上游源码包自带 3 个 shell 集成测试 (test/10_basic_connect.sh,
# test/11_hostfile.sh, test/12_async.sh)，依赖真实 sshd 与免密登录。
# 实测结果（2026-09-09，paramiko 协议级 SSH 服务端 + 公钥认证）：
#   - 10_basic_connect.sh: PASS（核心命令 mussh -h localhost -c "date"
#     连续 144 次成功，编排层断言成立）
#   - 11/12: BLOCKED(1-e)——多进程 hostlist 文件协议（hostlist.lock
#     追加锁 + rm/mv 收缩）在 HMDFS 写后读不一致下无法终止，死亡现场
#     尸检：hostlist 恒 1 行、hostlist.new 字节数与源相同（2641+ 次循环）。
# 质量验证另由 test_package 的 mussh -V 与鸿蒙特有测试承担。

package: mussh/1.0
homepage: "http://mussh.sourceforge.net/"

# 上游测试命令分析结果: test/*.sh (3 个 shell 集成测试, 需真实 SSH 环境)
upstream_check_command: "bash test/10_basic_connect.sh (requires real sshd + passwordless login)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清单 (3 个, 10_basic 实测 PASS; 11/12 HMDFS 文件协议阻断 1-e)
upstream_tests:
  - name: "10_basic_connect.sh"
    command: "bash test/10_basic_connect.sh"
    description: "基本连接测试 (需真实 sshd 与免密登录)"
    result: "PASS — paramiko SSH 服务端 (127.0.0.1:2222, 公钥认证) 实测, mussh -h localhost -c \"date\" 连续 144 次成功"
  - name: "11_hostfile.sh"
    command: "bash test/11_hostfile.sh"
    description: "hostfile 解析测试 (需真实 sshd 与免密登录)"
    result: "BLOCKED(1-e) — hostlist.lock 锁 + rm/mv 收缩的跨进程文件协议在 HMDFS 写后读不一致下无法终止 (死亡现场: hostlist 恒 1 行, hostlist.new 字节数相同; 源码 get_next_host 逐行实证)"
  - name: "12_async.sh"
    command: "bash test/12_async.sh"
    description: "异步会话测试 (需真实 sshd 与免密登录)"
    result: "BLOCKED(1-e) — 同上, 多主机并发依赖同一 hostlist 文件协议"

# 适配侧补充测试 (test_package mussh -V 功能验证)
adapted_tests:
  - name: "mussh-version-report"
    command: "bash test_mussh.sh <package>/bin/mussh -> stdout contains 'Version: 1.0', exit code 0"
    description: "打包产物功能验证: bin/mussh 存在且可执行, 实际执行 mussh -V 并断言版本输出"

# ── 鸿蒙特有测试 (rule12) ─────────────────────────────────────
# 鸿蒙沙箱 /tmp 为只读 erofs (E002), 上游 mussh 硬编码 TEMP_BASE=/tmp 必败;
# 0002-mktemp-tmpdir.patch 改为 ${TMPDIR:-/tmp}。本测试通过 mktemp stub
# 断言 mussh 主流程临时目录基址遵循 TMPDIR, 是鸿蒙平台特有的适配点验证。
harmony_specific_tests:
  - name: "harmony-tmpdir-adaptation"
    command: "bash test_harmony_tmpdir.sh <package>/bin/mussh -> 断言 mussh 临时目录基址遵循 TMPDIR"
    description: "鸿蒙特有测试: 验证 0002-mktemp-tmpdir.patch 使 mussh 临时目录走 TMPDIR 而非硬编码 /tmp（鸿蒙 /tmp 只读 erofs 平台约束）"
