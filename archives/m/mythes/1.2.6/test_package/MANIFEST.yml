package: mythes/1.2.6
homepage: "https://dev-www.libreoffice.org/src/"
upstream_check_command: "make check -j1; run documented example twice"
upstream_test_in_build: true
upstream_test_command: "make check -j1 plus README example with th_en_US_new and morph fixture sets"
upstream_tests:
  - "README English thesaurus example with checkme.lst"
  - "README morphology example with morph.lst/aff/dic"
test_package_tests:
  - file: test.cxx
    description: "Installed library looks up a tiny UTF-8 thesaurus fixture and rejects an absent word"
    command: "./test_mythes test.idx test.dat"
assertion_count: 7
