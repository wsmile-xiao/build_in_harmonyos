software: mon
display: "mon — 简单的进程监控工具"
description: "mon 是一个用 C 语言编写的轻量级监控工具，用于监控主机/服务/进程并在出现问题时发出告警。支持日志记录、守护进程模式、重启策略和错误回调。"
category: utility
homepage: "https://github.com/tj/mon"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure 脚本，需创建 configure wrapper 以通过 clean-verify G0"
    - "Makefile install 目标不支持 DESTDIR，需补丁添加 mkdir -p 和 DESTDIR 前缀"
    - "添加 -include config.mk 使 configure 可设置 PREFIX"
    - "无测试套件，无 make check/test 目标"
  common_dependencies: []

versions:
  "1.2.3":
    status: published
    build_date: "2026-06-25"
    source_url: "https://github.com/tj/mon/archive/refs/tags/1.2.3.tar.gz"
    sha256: "978711a1d37ede3fc5a05c778a2365ee234b196a44b6c0c69078a6c459e686ac"
    tar_format: tar.gz
    patches:
      - "0001-Makefile.patch"
      - "0002-configure.patch"
    configure_options: []
    dependencies: []
