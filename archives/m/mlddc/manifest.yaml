software: mlddc
display: "mlddc"
description: "Client for the Monolith dynamic DNS service (1997, C)"
category: network
homepage: "https://github.com/OS2World/APP-INTERNET-mlddc"
license: Freely Distributable
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 C + POSIX socket（gethostbyname/socket/connect），无 configure、无外部库依赖（非 SECURE 构建）"
    - "netio.h 的 inline extern Disconnect 在 C99 下被两个 TU 实例化导致重复符号，需 -fgnu89-inline（与 1997 年 gcc 语义一致）"
    - "无输入运行时退出码 10（Invalid user data）为预期错误路径，验证程序本体可运行"
  common_dependencies: []

versions:
  "1.0":
    status: built
    build_date: "2026-08-18"
    note: "已发布到制品仓（旧配方，2026-08-20），见 1.0.1 适配修复"
  "1.0.1":
    status: built
    build_date: "2026-09-06"
    conan_ref: "mlddc/1.0.1"
    note: "R37 版本递增：按 G1/R33 修复配方结构后无法覆盖已发布的 1.0"
  "1.0-1":
    status: built
    build_date: "2026-09-10"
    conan_ref: "mlddc/1.0-1"
    note: "平台任务 #6607 给定版本 1.0..1 含连续两点，git 与服务端均拒绝该 ref 名；按 CI 自身 +→- 归一化语义落到 1.0-1"
