# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mlddc/1.0-1
homepage: "https://github.com/OS2World/APP-INTERNET-mlddc"

# 上游无独立测试套件（1997 年 CLI 工具，仅一个手写 Makefile，无 check/test 目标）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（消费包内产物：二进制 / 包装脚本 / 数据模板 / 文档）
test_package_tests:
  - file: test.c
    description: "消费者测试 10 条：mlddc 存在/可执行/ELF64/AArch64/e_type/真实执行退出码 10；mlupd 存在/可执行/shebang；mymldata 3 行模板；README 文档"
    command: "./test_mlddc <package_folder>"

# 测试断言总数 (近似值, 用于质量评估): 上游 0 + test_package 10
assertion_count: 10
