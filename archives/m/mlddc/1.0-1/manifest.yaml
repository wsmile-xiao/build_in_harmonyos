# 版本级 manifest — mlddc 1.0-1

version: "1.0-1"
software: "mlddc"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-09"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游无官方 tag，取 master）
  url: "https://codeload.github.com/OS2World/APP-INTERNET-mlddc/tar.gz/refs/heads/master"

  # 源码校验和（SHA-256）
  sha256: "8edd6e48f64cb35f3ac45f81339592e378a314728fd6d001369c32e3df6b68ef"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游 Makefile 含 1997 年 i386 专用选项，配方绕开它直接驱动 clang）
  system: custom

  # 配置选项列表
  configure_options:
  - "-O2 -Wall -fgnu89-inline -c mlddc.c -o mlddc.o"
  - "-O2 -Wall -fgnu89-inline -c base64.c -o base64.o"
  - "-O2 -Wall -fgnu89-inline -c netio.c -o netio.o"
  - "mlddc.o base64.o netio.o -o mlddc"

  # 编译依赖列表（零外部依赖，SECURE 分支不启用）
  dependencies: []

  # 编译器
  cc: clang
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无需补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "netio.h 的 inline extern Disconnect 在 C99 语义下被 mlddc.c 与 netio.c 两个 TU 各自实例化，ld.lld 报 duplicate symbol；加 -fgnu89-inline 后 inline 定义不产生外部符号，与 1997 年 gcc 行为一致。"
- "上游 Makefile 的 CFLAGSOPT 含 -m486 -malign-loops=0 等 1997 年 i386 gcc 专用选项，aarch64 clang 不识别，配方需绕开 Makefile 直接编译 3 个 C 文件。"
- "mlddc 无输入运行退出码 10（Invalid user data）是预期错误路径，可作为「程序可运行」的稳定断言；上游无任何自动化测试。"
- "上游随包脚本 mlupd（shell 包装器）与 mymldata（3 行数据模板）不是构建产物，需在 package() 中显式 copy 并归一化可执行位（chmod 0o755），否则 tarball 权限位不可依赖。"
- "产物为 ET_DYN（PIE）ELF64/AArch64，DT_NEEDED 仅 libc.so（OHOS musl），可直接在 OHOS PC 上运行。"
