# 版本级 manifest — mlddc 1.0.1
# 遵循 ARCHIVE-SPEC v3.0（交叉校验元数据，CI 不依赖）

# 版本号
version: "1.0.1"

# 软件名
software: "mlddc"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: makefile
conan_ref: "mlddc/1.0.1"

# ============================================================
# 源码信息（与 conandata.yml 一致）
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/OS2World/APP-INTERNET-mlddc/tar.gz/refs/heads/master"
  # 源码校验和
  sha256: "8edd6e48f64cb35f3ac45f81339592e378a314728fd6d001369c32e3df6b68ef"
  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（Makefile 直接 clang 编译，无 configure）
  system: makefile
  # 配置选项列表（无 configure，CFLAGS 在 conanfile.py build() 中追加 -fgnu89-inline）
  configure_options: []
  # 编译依赖列表（非 SECURE 构建，无外部库依赖）
  dependencies: []
  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无补丁文件；适配通过 conanfile.py build() 的 CFLAGS 追加 -fgnu89-inline 实现
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "netio.h 中 `inline extern void Disconnect()` 在 C99 语义下会被 mlddc.c 与 netio.c 两个 TU 各自实例化，产生 ld.lld duplicate symbol；追加 -fgnu89-inline 后只产生一个外部定义，与 1997 年 gcc 行为一致"
  - "Makefile 自带 CFLAGS 含 x86 专用 flag（-m486/-malign-*），aarch64 clang 不适用，改为直接 clang 编译 mlddc.c/base64.c/netio.c"
  - "mlddc 无输入运行退出码 10（Invalid user data）为预期错误路径，可用于验证程序本体可执行、链接正常"
