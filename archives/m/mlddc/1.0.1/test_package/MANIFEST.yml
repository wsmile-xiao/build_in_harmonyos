# test_package/MANIFEST.yml — mlddc 1.0
package: mlddc/1.0.1
homepage: "https://github.com/OS2World/APP-INTERNET-mlddc"

# 上游无独立测试套件（1997 年 CLI 工具，仅 Makefile 构建）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（验证二进制可执行 + 预期退出码）
test_package_tests:
  - file: test.c
    description: "消费者测试：运行包内 mlddc 二进制，验证无输入时退出码 10（程序可运行）"
    command: "test_mlddc"

# 测试断言总数
assertion_count: 1
