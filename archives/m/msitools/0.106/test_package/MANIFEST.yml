# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: msitools/0.106
homepage: "https://wiki.gnome.org/msitools"

# 上游测试命令 (用于 meson test --list 分析)
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "meson test -C builddir"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/testdatabase.c
    source: msitools-0.106/tests/testdatabase.c
    description: "Database unit tests"
    command: "./testdatabase"
  - file: tests/testrecord.c
    source: msitools-0.106/tests/testrecord.c
    description: "Record unit tests"
    command: "./testrecord"
  - file: tests/tools.bats
    source: msitools-0.106/tests/tools.bats
    description: "CLI tools integration tests (bats)"
    command: "bats tools.bats"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — 调用 libmsi_database_get_type() 验证库链接和 API 可用性"
    command: "./test_msitools"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
