software: memchan
version: "2.3"
status: built
build_system: autotools
build_date: "2026-09-27"

source:
  url: "https://downloads.sourceforge.net/project/memchan/memchan/2.3/Memchan2.3.tar.gz"
  sha256: "adaa5952fe532a917372dcdbc873c082656c49b613d92b09e7938d8f276f2749"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-tcl=<tcl-package>/lib"
    - "tcl_cv_sys_version=Linux-6.6"
  dependencies:
    - "tcl/8.6.16"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-configure.patch"
  - "patches/0002-isaac-rand.h.patch"
  - "patches/0003-isaac-randport.c.patch"

knowledge_gained:
  - "Autoconf 2.59 config.status needs umask 022 on OHOS HMDFS"
  - "GCC 15 and current Clang require explicit ISAAC function prototypes"
  - "Memchan's upstream executable baseline is 53 tests: 38 legacy plus 15 TEA black-box tests"
  - "Tcl extensions are installed with pkgIndex.tcl beside the shared object"
