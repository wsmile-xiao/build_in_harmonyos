package: memchan/2.3
homepage: "https://sourceforge.net/projects/memchan/"
upstream_test_in_build: true
upstream_test_command: "legacy tests/all plus tea.tests/fifo_bb.test and tea.tests/memchan_bb.test"
upstream_tests:
  - type: legacy-regression
    count: 38
    framework: "Memchan legacy Tcl test harness"
    description: "All executable tests under tests/; two fifo declarations inside if {0} are not registered upstream"
  - type: tea-blackbox
    count: 15
    framework: "tcltest"
    description: "All fifo and memchan TEA black-box tests"
test_package_tests:
  - file: "test.sh"
    description: "POSIX consumer-test driver used by the Conan test package"
    command: "sh test.sh [runner] tclsh8.6 test_memchan.tcl <package-libdir>"
  - file: "test_memchan.tcl"
    description: "Seven package-consumer assertions covering all channel types and the OHOS delayed event-loop path"
    command: "tclsh8.6 test_memchan.tcl <package-libdir>"
assertion_count: 60
