package: ms-gsl/4.2.1
homepage: "https://github.com/microsoft/GSL"

upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build folder> --output-on-failure"

upstream_tests:
  - name: "Microsoft GSL upstream test suite"
    count: "97 declared / 2 executables / 89 executed"
    description: "96 GoogleTest TEST declarations in 12 source files, of which 88 instantiate under C++17 on Linux/OHOS, plus gsl_noexcept_tests; built by the Conan recipe and executed through ctest inside build()"

test_package_tests:
  - file: test_package.cpp
    description: "R34 consumer test using the public Microsoft.GSL::GSL target: span over std::array and std::vector, subspan, gsl::at, not_null, narrow/narrow_cast and finally, with a non-zero exit code per failed assertion group"
    command: "conan create . --build=ms-gsl/*"

assertion_count: 9
