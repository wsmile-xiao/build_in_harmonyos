build:
  system: cmake
  dependencies: []
  test_dependencies:
    - "gtest/1.17.0"

patches_applied:
  - file: "patches/0001-use-conan-gtest.patch"
    description: "Use Conan-resolved GTest and tolerate the OHOS libc stderr macro in upstream tests"

knowledge_gained:
  - "Microsoft GSL 4.2.1 is header-only and its upstream CMake target requires C++14"
  - "The upstream tests require a packaging patch to replace the configure-time Git download of GoogleTest with the Conan GTest target"
  - "OHOS libc recursively defines stderr, so Clang upstream tests need -Wno-disabled-macro-expansion while retaining -Werror"
