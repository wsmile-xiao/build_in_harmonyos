# 软件级 manifest — mkp224o
# 遵循 ARCHIVE-SPEC v3.0

software: mkp224o
display: "mkp224o"
description: "Tor v3 隐身服务 vanity onion address 生成器（Ed25519 密钥前缀搜索）"
category: utility
homepage: "https://github.com/cathugger/mkp224o"
license: CC0-1.0
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 C（C99）+ pthread 多线程；随机源来自 libsodium randombytes_buf（OHOS 走 getrandom），Ed25519 密钥数学用上游自带可移植 C 后端 ed25519-donna（默认），未替换密码学实现"
    - "configure 仅在用户未设 CFLAGS 时注入 -march=native -O3：Conan profile 显式提供 CFLAGS 即规避；无运行期 CPU 特性探测（cpucount.c 只数核心）"
    - "ed25519 后端选项陷阱：AC_ARG_ENABLE 的 action-if-given 不检查值，--disable-ref10 会反向选中 ref10 并报 only one ed25519 implementation；不传参数即回退默认 donna"
    - "x86-64 汇编后端（amd64-51-30k/amd64-64-24k/donna-sse2）均为 opt-in，aarch64 用默认 donna 可移植后端"
    - "GNUmakefile 无 install 目标，package() 手动拷贝 bin/mkp224o；libXext 式 .codesign 自签（binary-sign-tool）"
  common_dependencies:
    - libsodium/1.0.22

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.7.0":
    status: built
    build_date: "2026-09-09"
