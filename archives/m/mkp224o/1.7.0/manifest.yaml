software: mkp224o
# 版本级 manifest — mkp224o 1.7.0
# 文件位置: archives/m/mkp224o/1.7.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.7.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-09"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 GitHub release asset（非 git archive，自带 configure）
  url: "https://github.com/cathugger/mkp224o/releases/download/v1.7.0/mkp224o-1.7.0-src.tar.gz"
  sha256: "e38465ea893c6032ddfd7c133cbbf0de2eeaf1c428ca563fac5e85aeb609c929"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  # 不传任何 ed25519 后端参数：上游 AC_ARG_ENABLE 的 action-if-given
  # 不检查值，--disable-ref10 会反向选中 ref10 并报错；空缺省回退 donna
  configure_options: []
  # 上游正式测试在 build() 内执行：make test + 逐个运行 4 个 KAT 二进制
  run_upstream_tests_in_build: true
  dependencies:
    - libsodium/1.0.22
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 官方 1.7.0 tarball 在 OHOS clang 下无需补丁
patches_applied: []

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: upstream-kat-plus-functional
  total: 6
  passed: 6
  failed: 0
  skipped: 0
  status: passed
  detail: "上游 KAT 4/4（test_base16/test_base32/test_base64/test_ed25519，build() 内逐一执行）+ 消费者功能 1/1 + OHOS 特有 1/1"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 configure 仅在用户未设置 CFLAGS 时注入 -march=native -O3；Conan profile 显式提供 CFLAGS 即可规避"
  - "Ed25519 后端默认为可移植 C 的 ed25519-donna；x86-64 汇编后端 (amd64-51-30k/amd64-64-24k/donna-sse2) 均为 opt-in，aarch64 无正式后端，donna 即可移植回退"
  - "上游 AC_ARG_ENABLE 陷阱：ed25519 后端选项的 action-if-given 不检查 enable/disable 值，--disable-ref10 会反向选中 ref10 并触发 only one ed25519 implementation 报错；不传参数即回退默认 donna"
  - "GNUmakefile 无 install 目标，package() 需手动拷贝 mkp224o 二进制"
  - "cpucount.c 仅统计核心数（sysconf/_SC_NPROCESSORS_ONLN → /proc/cpuinfo），无 cpuid/运行期 CPU 特性探测"
  - "libsodium 为硬依赖（-lsodium: sodium_init/randombytes_buf/crypto_pwhash），密钥数学仍用上游自带 ed25519-donna，未替换实现"
  - "制品仓 libsodium 为裸 ref（libsodium/1.0.22，无 @ohpcd/stable channel），requires 需用裸 ref"
