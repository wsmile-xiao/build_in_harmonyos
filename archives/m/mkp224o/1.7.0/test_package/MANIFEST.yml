# test_package/MANIFEST.yml — mkp224o 1.7.0
# CI L0e requires this file to exist.

package: mkp224o/1.7.0
homepage: "https://github.com/cathugger/mkp224o"

# 上游测试命令 (GNUmakefile `test` target: 构建4个测试二进制)
upstream_check_command: "make test"

# 上游正式测试在 recipe build() 内执行：make test 构建 4 个 KAT 测试
# 二进制，配方逐一执行 4 个二进制，4/4 通过（CI L1c 从 conan create 日志识别）
upstream_test_in_build: true
upstream_test_command: "make test && ./test_base16 && ./test_base32 && ./test_base64 && ./test_ed25519"

# 上游实际运行的测试程序（GNUmakefile TEST_TGT，确定性已知向量断言）
upstream_tests:
  - name: test_base16
    description: "base16 编码/解码已知向量（约 7 向量，assert 断言）"
  - name: test_base32
    description: "base32 (onion 字符集) 编码/解码已知向量（约 9 向量，assert 断言）"
  - name: test_base64
    description: "base64 编码/解码已知向量（12 向量，assert 断言）"
  - name: test_ed25519
    description: "Ed25519 种子扩展/公钥派生 RFC 8032 已知向量（2 向量 × 2 断言）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_functional.sh
    description: "运行最终包内 mkp224o：低难度前缀生成 v3 地址，验证目录/hostname/密钥文件结构、地址字符集与长度（56+.onion）、地址与公钥 base32 对应关系、清理密钥"
    command: "bash test_functional.sh <pkg>/bin/mkp224o"
  - file: test_ohos.sh
    description: "ELF64 AArch64、musl 解释器、.codesign、无 RPATH/RUNPATH 与宿主绝对路径、真实多线程随机+Ed25519 生成运行、密钥清理"
    command: "bash test_ohos.sh <pkg>/bin/mkp224o"

# 测试断言总数 (近似值)：上游约 61 KAT 断言 + 功能 8 + OHOS 10
assertion_count: 79
