# 软件级 manifest — mlogger
# 遵循 ARCHIVE-SPEC v3.0

software: mlogger
display: "mlogger"
description: "命令行 syslog 日志工具（fork 自 bsdutils logger，支持 64KB 超长日志行与缩进行续接）"
category: utility
homepage: "https://github.com/nbrownus/mlogger"
license: BSD-4-Clause-UC
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "单文件 C 命令行工具（mlogger.c），Makefile 仅一条 `cc -Wall -Wextra -O3 -o mlogger mlogger.c`，无 configure、无 install target、无测试"
    - "上游 Makefile 硬编码 gcc，配方用 Conan conf 的 clang 替代（R33：编译器来自 Conan，不裸用 shell 环境变量）"
    - "零 patch 适配：mlogger.c 仅依赖 POSIX/sys/socket/getopt/err.h/syslog.h 等标准头，OHOS AArch64 musl/libc++ 下原生编译通过"
    - "上游无 LICENSE 文件：许可证在 debian/copyright，为 4.3BSD（BSD-4-Clause-UC）"
    - "--version 输出 `mlogger 1.1.2`（PROGRAM_VERSION 常量硬编码未随 tag 更新），是真实上游行为"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2.0":
    status: built
    build_date: "2026-08-31"
