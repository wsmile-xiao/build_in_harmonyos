knowledge_gained:
  - "mlogger 1.2.0 是 nbrownus/mlogger 的命令行 syslog 工具，fork 自 bsdutils logger，支持 64KB 超长日志行与缩进行续接（-I ms）"
  - "上游为单文件 C 程序（mlogger.c，556 行），Makefile 仅一条 `gcc -Wall -Wextra -O3 -o mlogger mlogger.c` 命令，无 configure、无 install target、无测试"
  - "上游无 LICENSE 文件：许可证在 debian/copyright 中，为 4.3BSD（Regents of the University of California），SPDX 为 BSD-4-Clause-UC"
  - "零 patch 适配：mlogger.c 仅依赖 POSIX/sys/socket/getopt/err.h 等标准头，OHOS AArch64 musl/libc++ 下原生编译通过，不需任何补丁"
  - "--version 输出 `mlogger 1.1.2`（PROGRAM_VERSION 常量硬编码，未随 1.2.0 tag 更新），是真实上游行为，测试须据此断言"
  - "上游无任何测试套件：无 tests/ 目录、Makefile 无 test/check 目标、无 CTest/CI 配置、debian/rules 无 override_dh_auto_test"
