# test_package/MANIFEST.yml — mlogger 1.2.0
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: mlogger/1.2.0
homepage: "https://github.com/nbrownus/mlogger"

# 上游测试命令分析
upstream_check_command: "grep -niE 'test|check|ctest' Makefile  →  无匹配；Makefile 仅 all/clean/docs 目标"
upstream_test_in_build: false
upstream_test_command: "上游无测试套件：无 tests/ 目录、Makefile 无 test/check 目标、无 CTest/CI 配置、debian/rules 无 override_dh_auto_test"

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "调用打包的 mlogger 二进制，覆盖 --version / --help / -s stderr echo / -p priority / argv 多词拼接 / -f 文件源 6 个用例，每个用例对捕获输出做确定性的精确/子串断言，test.sh 任一断言失败即 exit 1（self.run 抛出失败，非'不崩溃'门禁）"
    command: "bash test.sh"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 13
test_modifications:
  - "不修改任何上游测试：上游无测试套件。"
  - "test_package 为消费者验证，不替代上游测试（任务 #7 单独报告上游测试情况）。"
  - "--version 断言为 `mlogger 1.1.2`：上游 PROGRAM_VERSION 常量硬编码为 1.1.2 未随 v1.2.0 tag 更新，是真实上游行为。"
