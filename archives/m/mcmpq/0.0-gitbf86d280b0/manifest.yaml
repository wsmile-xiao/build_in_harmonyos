# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.0-gitbf86d280b0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.0-gitbf86d280b0"

# 软件名
software: "mcmpq"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: "header-only"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/173duprot/mcmpq.h/tar.gz/bf86d280b067"

  # 源码校验和
  sha256: "5cf7dd8340a6f4403d29eb589d348655542d0abf840a73f4a85ccb7e639f87b6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom (header-only)

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "codeload GitHub commit 归档 URL 末段无扩展名，conan get() 需在 conandata.yml 显式声明 filename 字段（如 mcmpq-bf86d280b067.tar.gz），否则按 zip 解压报 BadZipFile"
  - "header-only 库 conanfile.py 的 package() 中 copy() 的 dst 必须是 os.path.join(self.package_folder, ...) 绝对路径，相对 dst 会落到 build 目录导致 test_package 找不到 include"
  - "header-only 库 package_type='library' 必须声明 options shared（[True, False]），否则 conan create 报 Package type is 'library', but no 'shared' option declared"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
