# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mcmpq/0.0-gitbf86d280b0
homepage: "https://github.com/173duprot/mcmpq.h"

# 上游无构建系统（header-only），无 make check / ctest / meson 注册
upstream_check_command: "none (header-only, 无构建系统)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（手工枚举，见 notes.md 完整台账）
upstream_tests:
  - file: tests/basic.c
    source: mcmpq-0.0-gitbf86d280b0/tests/basic.c
    description: "8 线程生产者/消费者各 1000 项，断言队列清空"
    command: "clang -O2 -pthread tests/basic.c && ./a.out"
  - file: tests/fuzz.c
    source: mcmpq-0.0-gitbf86d280b0/tests/fuzz.c
    description: "4 线程 × 10000 项 × 1000 轮 (4000 万项)，断言队列清空"
    command: "clang -O2 -pthread tests/fuzz.c && ./a.out"

# test_package 中自带的测试 (消费者视角验证 + HarmonyOS 专项)
test_package_tests:
  - file: test.c
    description: "消费者测试：include mcmpq.h，调用公开 API enqueue/dequeue/try_enqueue/try_dequeue 验证可用性"
    command: "./test_mcmpq"
  - file: ohos_specific_test.c
    description: "HarmonyOS 专项测试（适配新增）：try 非阻塞语义/容量边界/FIFO 顺序/HEAD-TAIL 一致性"
    command: "./test_ohos_specific"

# 测试断言总数 (test.c 12 处 CHECK + ohos_specific_test.c 18 处 CHECK)
assertion_count: 30
