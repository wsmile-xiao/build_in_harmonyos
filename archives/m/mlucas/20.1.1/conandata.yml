# conandata.yml — mlucas 20.1.1
#
# 官方上游：https://github.com/primesearch/Mlucas （Ernst Mayer's Mlucas / Mfactor, GIMPS）
# 该仓库未为 v20.1.1 打标签（仅有 v21.0.1 / v21.0.2 标签），v20.1.1 对应提交：
#   039e912fa7a246788c7a2c6b1a1f4c13485bbf23  "Added files for mlucas v20.1.1."  (2022-07-12)
# 该 tarball 为 GitHub 官方 codeload 归档，两次独立下载 sha256 一致（已核验）。

sources:
  url: "https://github.com/primesearch/Mlucas/archive/039e912fa7a246788c7a2c6b1a1f4c13485bbf23.tar.gz"
  sha256: "fd15734f9065dd41a20e9e8dd9a6420f46d37d070e57d1474bd4ce5987b46580"

patches:
  - patch_file: "patches/0001-src-platform.h.patch"
    patch_description: >-
      Probe for <sys/sysctl.h> with __has_include() before including it. The header is
      glibc/BSD-only; on musl-based libcs (OHOS) __GLIBC__/__GLIBC_MINOR__ are undefined and
      therefore evaluate to 0 in the enclosing #if, so upstream unconditionally took the
      include branch and the build died with "fatal error: 'sys/sysctl.h' file not found".
    patch_type: "portability"
  - patch_file: "patches/0002-src-threadpool.c.patch"
    patch_description: >-
      cpu_set_t / CPU_ZERO / CPU_SET / sched_setaffinity are glibc extensions, absent from
      other Linux libcs such as musl, where the OS_TYPE_LINUX thread-affinity block failed
      with "use of undeclared identifier 'cpu_set_t'". Restrict that block to glibc and, as
      the existing OpenBSD branch does, leave thread affinity to the OS elsewhere.
    patch_type: "portability"
