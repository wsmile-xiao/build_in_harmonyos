# test_package/MANIFEST.yml
# 上游官方测试声明文件
#
# mlucas 上游 GitHub 源码树（primesearch/Mlucas）本身不带 tests/ 目录，也没有
# ctest/pytest/meson 注册；其官方发布 tarball 附带 autotools 包装，Makefile.am:22
# 声明 `TESTS = tests/spot-check tests/fermat-test tests/self-test`，三个脚本正文
# 即下表由 check-target 展开的 4 条 mlucas 命令；另有程序内置自检（-s 各档）。
# 本次补充执行 1 条自检档（-s t）。本 test_package 复现其中 spot-check 一例并做
# 确定性 residue 断言。

package: mlucas/20.1.1
homepage: "https://github.com/primesearch/Mlucas"

# ── 计数口径（唯一权威；与 reports/test-report.md、notes.md 一致）────────
case_counts:
  upstream_check_targets: 3          # Makefile.am:22 TESTS = spot-check fermat-test self-test
  upstream_check_targets_covered: 3  # 全部执行，无漏测
  upstream_commands_expanded: 4      # fermat-test 含 2 条命令
  supplementary_commands: 1          # -s t（上游程序自带，未列入 TESTS）
  commands_executed_total: 5
  passed: 5
  failed: 0
  skipped: 0
  missed: 0
  not_in_scope: ["-s l", "-s all", "-s xl", "-s xxl"]   # 不在 TESTS 清单；各需 10 小时~数天

# 上游测试入口
upstream_check_command: "make check（autotools 包装；TESTS = tests/spot-check tests/fermat-test tests/self-test）"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试案例（按「check-target → 展开命令」列出，与执行记录一一对应）
upstream_tests:
  - file: tests/spot-check
    source: "官方 release tarball mlucas_20.1.1.orig.tar.xz"
    description: "192K FFT、100 次迭代、radset 0 抽查"
    command: "mlucas -fftlen 192 -iters 100 -radset 0"
    exit_code: 0
    log: "logs/uptests/01-spot-check.log"
  - file: tests/fermat-test
    source: "官方 release tarball mlucas_20.1.1.orig.tar.xz"
    description: "F24 费马数模平方测试，第 1 段（默认 radix 集，100 次迭代）"
    command: "mlucas -fftlen 1024 -f 24 -iters 100"
    exit_code: 0
    log: "logs/uptests/02-fermat-test.log"
  - file: tests/fermat-test
    source: "官方 release tarball mlucas_20.1.1.orig.tar.xz"
    description: "F24 费马数模平方测试，第 2 段（radset 4，1000 次迭代）"
    command: "mlucas -fftlen 1024 -radset 4 -f 24 -iters 1000"
    exit_code: 0
    log: "logs/uptests/02-fermat-test.log"
  - file: tests/self-test
    source: "官方 release tarball mlucas_20.1.1.orig.tar.xz"
    description: "内置自检 medium 档（16 个 Mersenne 指数，2M~7.5M FFT）"
    command: "mlucas -s m -cpu 0:3"
    exit_code: 0
    log: "logs/uptests/04-selftest-medium.log"
  - file: help.txt §1（补充档，非 TESTS 条目）
    source: "上游程序内置自检能力"
    description: "内置自检 tiny 档（32 个 FFT 长度，8K~120K）"
    command: "mlucas -s t"
    exit_code: 0
    log: "logs/uptests/03-selftest-tiny.log"

# test_package 中自带的测试（消费者视角验证，不替代上游测试统计）
test_package_tests:
  - file: conanfile.py
    description: "OHOS 专属产物断言 —— 安装后的 mlucas 必须为 aarch64 小端 ELF 且解释器为 OHOS musl 加载器（鸿蒙特有用例 1 个 / 5 条断言）"
    command: "pure-python ELF header + interpreter 检查"
  - file: test.sh
    description: "功能断言 —— 复现上游 tests/spot-check 调用并校验确定性 Res64"
    command: "bash test.sh"

# 断言总数（test_package：5 条 OHOS 专属 + 3 条功能断言）
assertion_count: 8
