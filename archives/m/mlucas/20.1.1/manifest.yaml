version: "20.1.1"
software: "mlucas"
status: built
build_date: "2026-09-29"
conan_ref: "mlucas/20.1.1"
build_system: make

source:
  url: "https://github.com/primesearch/Mlucas/archive/039e912fa7a246788c7a2c6b1a1f4c13485bbf23.tar.gz"
  sha256: "fd15734f9065dd41a20e9e8dd9a6420f46d37d070e57d1474bd4ce5987b46580"
  tar_format: tar.gz

build:
  # 上游无 configure/cmake，构建由随源码分发的 makemake.sh 生成 Makefile 后 make
  system: make
  configure_options:
    - "nosimd（scalar 构型；与 Debian arm64 的 --enable-builds=generic-c 一致）"
  dependencies:
    - gmp/6.3.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-platform.h.patch"
  - "0002-src-threadpool.c.patch"

patch_classification:
  - file: 0001-src-platform.h.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-src-threadpool.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
