software: mlucas
display: "Mlucas"
description: "Mersenne 数 Lucas-Lehmer 素性检验程序（GIMPS 大素数搜索；Ernst W. Mayer）"
category: math
homepage: "https://github.com/primesearch/Mlucas"
license: GPL-3.0-or-later
build_system: make

ohos_adaptation:
  key_points:
    - "上游 makemake.sh 依赖 /proc/cpuinfo 自动选 SIMD 并带 -march=native；CI/异构环境下不可复现，本配方显式使用 nosimd（scalar）构型，与 Debian arm64 的 generic-c 选择一致"
    - "OHOS musl 无 <sys/sysctl.h>；platform.h 的 __GLIBC__ 版本判断在 musl 上因宏未定义而取 0，会误走 include 分支 → 补丁改为 __has_include 能力探测"
    - "OHOS musl 无 cpu_set_t/CPU_ZERO/CPU_SET/sched_setaffinity（glibc 扩展）→ 补丁把 threadpool.c 的线程亲和性代码限定为 __GLIBC__，其余平台按上游 OpenBSD 分支的做法交给 OS"
    - "唯一强制第三方库为 gmp；静态链接进可执行文件，产物仅依赖 libc.so（OHOS musl）"
    - "自检在接近各 FFT 长度推荐上限的指数上圆整误差裕度较小，属 scalar 构型固有行为"
  common_dependencies:
    - gmp

versions:
  "20.1.1":
    status: built
    build_date: "2026-09-29"
    conan_ref: "mlucas/20.1.1"
