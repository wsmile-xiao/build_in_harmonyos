patches:
  - patch_file: "patches/0001-infodir.patch"
    patch_description: "infodir 统一取 <prefix>/share/info（上游按平台分叉，非 Windows 分支给的是 <prefix>/info，与 make install 的落点对不上）；行号按 5.49.0 真源码重生成，sage 那份是对着旧版本写的、patch_ng 打不上"
    patch_type: "portability"
