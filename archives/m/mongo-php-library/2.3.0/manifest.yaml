software: mongo-php-library
# 版本级 manifest 模板
# 文件位置: archives/m/mongo-php-library/2.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# 构建系统类型（script/custom 表示非标准编译系统）
# cmake | autotools | makefile | meson | custom | script
build_system: script

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mongodb/mongo-php-library/archive/refs/tags/2.3.0.tar.gz"

  # 源码校验和
  sha256: "1399dac6aca5310a37f948f935b0de3100399b42433ab3a2ba5ede9882d0f329"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | script
  system: script

  # 配置选项列表
  configure_options: []
  # 纯 PHP 库无需 configure

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 运行时依赖: php (^8.1), ext-mongodb (^2.3), psr/log, symfony/polyfill-php85

  # 编译器（纯 PHP 库无需编译器）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 纯 PHP 库无需源码修改

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []

# ============================================================
# 安装信息
# ============================================================

install:
  # 安装路径
  prefix: "/storage/Users/currentUser/usr/local"

  # 安装文件列表摘要
  files:
    - "share/php/mongodb/composer.json"
    - "share/php/mongodb/src/*.php (492 files)"
    - "share/doc/mongo-php-library/LICENSE"