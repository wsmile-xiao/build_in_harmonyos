# test_package/MANIFEST.yml
# 上游官方测试声明文件（mbpfan 2.4.0）

package: mbpfan/2.4.0
homepage: "https://github.com/dgraziotin/mbpfan"

# 上游测试命令 (make tests = make all + ./bin/mbpfan-tests)
upstream_check_command: "make tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make tests CC=<profile clang> -j1"

# 上游实际运行的测试程序
# minunit 套件共 7 用例：4 个平台无关用例在设备真机 4/4 通过；
# 3 个硬件绑定用例（applesmc/coretemp 内核接口，OHOS aarch64 不存在）
# 经 patches/0001 跳过，PR 中逐项 test_skipped 申报并附技术原因。
upstream_tests:
  - file: tests/minunit.c
    source: mbpfan-2.4.0/tests/minunit.c
    description: "minunit 套件：test_config_file/test_settings/test_sighup_receive/test_settings_reload 4 用例执行全过；test_sensor_paths/test_fan_paths/test_get_temp 硬件绑定跳过"
    command: "make tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    source: test_package/test.sh
    description: "消费者测试：以库使用者身份运行打包后的 mbpfan -h，断言 Usage 输出与退出码 0"
    command: "mbpfan -h"
