software: mda-lv2
display: "MDA LV2 Plugins"
description: "MDA audio effects ported to LV2 (36 plugins: EPiano, DX10, JX10, Piano, ...)"
category: multimedia
homepage: "https://gitlab.com/drobilla/mda-lv2"
license: GPL-2.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "LV2 插件合集（36 模块）安装为单 bundle：lib/lv2/mda.lv2/（.so + .ttl 数据）"
    - "meson lv2dir 选项控制安装目录（默认 prefix/lib/lv2）"
    - "依赖仅 lv2（>=1.16.0，pkg-config 发现，include_type: system）"
    - "上游无 DSP 功能测试；lint 测试（autoship/reuse/lv2lint）默认关闭且工具 OHOS 缺失"
  common_dependencies:
    - "lv2/1.18.11-git"

versions:
  "1.2.12":
    status: built
    build_date: "2026-09-20"
    conan_ref: "mda-lv2/1.2.12"
