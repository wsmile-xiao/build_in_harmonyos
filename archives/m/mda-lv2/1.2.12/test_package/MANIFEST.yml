# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: mda-lv2/1.2.12
homepage: "https://gitlab.com/drobilla/mda-lv2"

# 上游测试命令（meson test；lint 选项默认 false）
upstream_check_command: "ninja -C build test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际可运行的测试（meson.build 顶层）
# - lint=false（默认）：autoship/REUSE/lv2lint 测试 target 完全不注册
# - lint=true：三个工具均 find_program(required: get_option('tests'))
#   feature-auto；本机 OHOS 环境三工具全部缺失（autoship/reuse/lv2lint
#   均未安装），开启即报错或跳过——上游无 DSP 功能测试
upstream_tests:
  - file: "autoship"
    source: "meson.build test('autoship', autoship, ...)（lint 门控）"
    description: "发布元数据检查（autoship test）"
    command: "ninja -C build test"
    status: skipped
    note: "autoship 工具在 OHOS 环境缺失；lint 选项默认关闭"
  - file: "REUSE"
    source: "meson.build test('REUSE', reuse, ...)（lint 门控）"
    description: "许可证元数据 lint（reuse lint）"
    command: "ninja -C build test"
    status: skipped
    note: "reuse 工具在 OHOS 环境缺失；lint 选项默认关闭"
  - file: "lv2lint"
    source: "mda.lv2/meson.build test('lv2lint', lv2lint, ...)（lint 门控）"
    description: "36 插件 URI 的 lv2lint 静态检查"
    command: "ninja -C build test"
    status: skipped
    note: "lv2lint 工具在 OHOS 环境缺失；lint 选项默认关闭"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_mda_lv2.c
    description: >-
      bundle 结构（manifest.ttl 36 URI + 9 presets + 36 数据 TTL）+
      36 插件 ELF64/AArch64 机器码校验 + TestTone 完整生命周期
      （dlopen/instantiate/run(480)/cleanup）
    command: "clang test_mda_lv2.c -ldl && ./test_mda_lv2 <pkg>/lib/lv2/mda.lv2"
  - file: src/test_ohos_mda_lv2.sh
    description: >-
      OHOS 专项：readelf 逐插件校验 ELF64/AArch64 + NEEDED
      （libc++_shared.so+libc.so）+ 无 RPATH/RUNPATH
    command: "bash test_ohos_mda_lv2.sh <pkg>/lib/lv2/mda.lv2"
    platform: ohos
  - file: src/test_ohos_load_all.c
    description: >-
      OHOS 专项：dlopen 全部 36 插件 + lv2_descriptor URI 校验 +
      EPiano/Piano/TestTone/Bandisto 抽样生命周期
    command: "clang test_ohos_load_all.c -ldl && ./test_ohos_load_all <pkg>/lib/lv2/mda.lv2"
    platform: ohos

# 测试断言总数（近似值，质量评估用）
assertion_count: 130
