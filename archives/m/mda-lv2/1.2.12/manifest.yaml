version: "1.2.12"
software: mda-lv2
status: built
build_date: "2026-09-20"
conan_ref: "mda-lv2/1.2.12"

source:
  url: "https://gitlab.com/drobilla/mda-lv2/-/archive/v1.2.12/mda-lv2-v1.2.12.tar.gz"
  sha256: "5b40aa17d6dfcee14eb7480d33cdde7f97c8fb1f6eb2306b9e5acc78b60185b6"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "lv2dir=lib/lv2"
  dependencies:
    - lv2/1.18.11-git
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  upstream:
    rate: "N/A"
    note: >-
      上游测试 = meson test（lint 选项，默认关闭）：autoship 发布元数据检查、
      REUSE 许可证元数据检查、lv2lint 插件 lint（36 插件 URI）。三者的上游
      工具（autoship/reuse/lv2lint）在本机 OHOS 环境均缺失，且 meson 的
      find_program(..., required: get_option('tests')) 为 feature-auto：
      lint=false（默认）时测试 target 完全不注册，开启且工具缺失时报错。
      实测 lint=true + tests=disabled 使测试定义被跳过——上游无 DSP 功能
      测试（36 个插件模块全部由构建即编译验证）。构建期 meson configure
      自身的依赖解析检查随构建执行。
  local:
    rate: "36/36 100%"
    note: >-
      本地 conan create（ohos-aarch64 profile）全链路通过：36 插件 .so +
      46 TTL（manifest + 36 数据 + 9 presets）安装至 lib/lv2/mda.lv2/；
      test_package 全部通过——ELF64/AArch64/NEEDED/RPATH 逐插件校验、
      bundle 结构校验（manifest.ttl 声明 36 插件 URI、presets 完整）、
      真实 dlopen 生命周期验证（TestTone instantiate+run+cleanup）。
