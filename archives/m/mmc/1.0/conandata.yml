# conandata.yml — mmc 1.0 (Mesh-based Monte Carlo, fangq/mmc)
# 官方源：GitHub 官方 tag 归档 v1.0（"MMC 1.0 Final (v2018 - Sachima)", 2018-08-26）
sources:
  url: "https://github.com/fangq/mmc/archive/refs/tags/v1.0.tar.gz"
  sha256: "e4ff912263074bef983638bafee2f57a8f73468c6cb43888a317c45e64a8b773"

patches:
  - patch_file: "patches/0001-clang-ohos-portability.patch"
    patch_description: >-
      Make the C sources build with clang/OHOS: (1) simpmesh.h guards the
      GCC/ICC-only __builtin_sincosf so clang falls back to sinf/cosf;
      (2) logistic_rand.{c,h} replace the BSD-only 'uint' typedef (absent in
      musl libc on OHOS/aarch64) with 'unsigned int'.
    patch_type: "portability"
