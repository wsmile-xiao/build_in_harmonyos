# test_package/MANIFEST.yml
# mmc 1.0 上游测试声明文件
#
# mmc v1.0 上游测试形态：无顶层 `make check`/`make test` 目标、无 ctest/pytest 注册。
# 测试入口 = examples/ 下的样例脚本（run_test.sh 等，直接调用 src/bin/mmc 跑真实仿真）
#          + 两个独立测试程序（examples/rngtest 随机数发生器、src/cjson cJSON 单元测试）。

package: mmc/1.0
homepage: "https://github.com/fangq/mmc"

# 上游是否有统一的自动化测试命令
upstream_check_command: "(none — 无顶层 make check/make test；测试入口为 examples/*/run_test.sh)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试入口（真实存在）
upstream_tests:
  - file: examples/onecube/run_test.sh
    description: "自包含样例（自带 mesh）：单立方体，-D M / -D MA 两种输出模式"
    command: "sh run_test.sh"
  - file: examples/reftest/run_test.sh
    description: "自包含样例（自带 mesh）：参考解比对"
    command: "sh run_test.sh"
  - file: examples/validation/benchspeed.sh
    description: "速度基准：60mm 立方网格 100k 光子"
    command: "sh benchspeed.sh"
  - file: examples/validation/run_test.sh
    description: "数值验证：60mm 立方网格 30M 光子"
    command: "sh run_test.sh"
  - file: examples/validation/run_tess.sh
    description: "数值验证：网格 tessellation 模式 30M 光子"
    command: "sh run_tess.sh"
  - file: examples/dcs/run_test.sh
    description: "DCS 双层组织样例（网格由 createmesh.m 生成）"
    command: "sh run_test.sh"
  - file: examples/statnoise/run_test.sh
    description: "统计噪声收敛样例，10 次独立运行"
    command: "sh run_test.sh"
  - file: examples/rngtest/rngtest.c
    description: "随机数发生器测试程序（3 个变体：posix / SFMT / logistic）"
    command: "make -f Makefile CC=clang CXX=clang++ release && ./bin/rngtest 1000 19650218"
  - file: src/cjson/test.c
    description: "内置 cJSON 单元测试（parse/print 往返）"
    command: "clang -O2 test.c cJSON.c -lm -o cjson-test && ./cjson-test"

# test_package 自带测试（消费者视角，调用已安装二进制）
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 调用已安装 mmc 跑通真实光子输运仿真（40 四面体立方网格）"
    command: "bash test.sh"

# HarmonyOS 专项（鸿蒙特有）
test_ohos_tests:
  - file: test_ohos/run_ohos_test.sh
    description: "HarmonyOS PC 专项：aarch64 ELF / 无宿主路径泄漏 / 无可移植性 RUNPATH / OHOS 上真实运行"
    command: "sh run_ohos_test.sh <installed mmc binary>"
