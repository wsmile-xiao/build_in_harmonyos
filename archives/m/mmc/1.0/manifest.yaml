# 版本级 manifest — mmc 1.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0"
software: "mmc"
status: built
build_date: "2026-09-29"
build_system: make

source:
  url: "https://github.com/fangq/mmc/archive/refs/tags/v1.0.tar.gz"
  sha256: "e4ff912263074bef983638bafee2f57a8f73468c6cb43888a317c45e64a8b773"
  tar_format: tar.gz

build:
  system: make
  # 上游默认目标 sse 为 x86 专属（-msse4/-DMMC_USE_SSE）；aarch64 使用 README 记录的 release
  target: release
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-clang-ohos-portability.patch"

knowledge_gained:
  - "上游 .DEFAULT_GOAL := sse 注入 -msse4/-DMMC_USE_SSE，src/simpmesh.h 随机 include <smmintrin.h>，aarch64 报 'This header is only meant to be used on x86 and x64 architecture'；改用 make release"
  - "clang 未实现 __builtin_sincosf（GCC/ICC 专有），simpmesh.h 的 __GNUC__ && __linux__ 守卫在 clang/OHOS 下为真导致编译失败；加 !defined(__clang__) 回退 sinf/cosf"
  - "musl libc 无 BSD 遗留类型 uint，logistic_rand.{c,h} 编译失败（unknown type name 'uint'）；改为 unsigned int"
  - "make omp 产物 RUNPATH 指向构建机 /data/service/hnp/ohos-sdk.org/.../llvm/lib 以加载 libomp.so，不可移植"
  - "Makefile 硬编码 CXX := g++，须在 make 命令行覆盖 CC/CXX"
