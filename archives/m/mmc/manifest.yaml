software: mmc
display: "mmc"
description: "Mesh-based Monte Carlo (MMC) — 基于四面体网格的 3D 光子输运蒙特卡洛模拟器"
category: science
homepage: "https://github.com/fangq/mmc"
license: GPL-3.0-or-later
build_system: make

ohos_adaptation:
  key_points:
    - "上游构建系统为纯 GNU make（src/Makefile + commons/Makefile_common.mk），非 autotools/cmake"
    - "上游 .DEFAULT_GOAL := sse 注入 x86 专属 -msse4/-DMMC_USE_SSE（src/simpmesh.h 会 include <smmintrin.h>），aarch64 不可用；改用 README 记录的 release 目标（-O3，无 SSE/OpenMP），产物仅依赖 libc.so"
    - "make omp 变体可编译，但会把构建机 SDK 路径 /data/service/hnp/ohos-sdk.org/.../llvm/lib 烤进 RUNPATH 以加载 libomp.so，离开构建机不可移植，故不采用"
    - "clang 未实现 GCC/ICC 专有内建 __builtin_sincosf，simpmesh.h 需加 !defined(__clang__) 守卫回退到 sinf/cosf"
    - "musl libc 未提供 BSD 遗留类型 uint，logistic_rand.{c,h} 改用 unsigned int（该 RNG 为 -DMMC_LOGISTIC 可选构型）"
    - "Makefile 硬编码 CXX := g++，构建时需在命令行覆盖 CC/CXX 指向 clang/clang++"
  common_dependencies: []

versions:
  "1.0":
    status: built
    build_date: "2026-09-29"
