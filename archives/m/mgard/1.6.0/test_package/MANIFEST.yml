# test_package/MANIFEST.yml
# mgard 1.6.0
# 上游有真实的 Catch2 3 单元测试套件（tests/ 目录，33 个测试文件共
# 116 个 TEST_CASE）：tests/CMakeLists.txt 用 find_package(Catch2 3.0.0)
# 找到才构建 mgard-tests 可执行（未找到则静默跳过，STATUS 提示
# "Will not build tests"）；上游未注册 add_test/CTest，直接执行
# mgard-tests 主程序（链接 Catch2::Catch2WithMain）即全量运行。
# 配方以 test_requires catch2/3.8.1 注入 CMAKE_PREFIX_PATH 保证测试
# 真实构建并在真机上执行。

package: mgard/1.6.0
homepage: "https://github.com/CODARcode/MGARD"

upstream_tests_exist: true
upstream_test_audit: >
  tests/ 为 Catch2 3 单元测试套件（33 个 .cpp，116 个 TEST_CASE：压缩
  roundtrip、CompressedDataset、compressors、文件格式、decompose、
  LinearQuantizer、Tensor* 系列、unstructured 网格系列等）。构建入口
  tests/CMakeLists.txt:51-57：find_package(Catch2 3.0.0) 成功时构建
  mgard-tests（链接 mgard-library + Catch2::Catch2WithMain），失败则
  静默跳过。上游未注册 add_test，故直接执行构建产物 mgard-tests。
  测试构建需 protobuf（libmgard 文件格式组件硬依赖）与 MGARD_ZSTD
  （SERIAL 分支 libzstd），由配方依赖链保证。
upstream_test_count: 116
upstream_check_command: 'cmake --build <build> --target mgard-tests && ./tests/mgard-tests'
upstream_test_in_build: true

# test_package 中自带的测试（消费者视角, R34: 真实编译链接调用公开 API）
test_package_tests:
  - file: consumer.cpp
    description: >
      消费者视角: 编译链接 libmgard，真实调用公开 API
      mgard::TensorMeshHierarchy<1,float> + mgard::compress/decompress
      （include/mg/compress.hpp），2 项断言：max abs error <= tolerance
      （误差可控保证）+ 有损压缩字节数 < 原始字节数（压缩有效性）
    command: "$CXX -std=c++17 consumer.cpp -lmgard && ./a.out"

# 断言总数（消费者 2 项 + 上游 116 个 TEST_CASE 由配方 build() 执行）
assertion_count: 2
