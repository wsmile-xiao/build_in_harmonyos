# 版本级 manifest — mgard 1.6.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.6.0"
software: "mgard"
status: built
build_date: ''
build_system: cmake

source:
  url: "https://codeload.github.com/CODARcode/MGARD/tar.gz/refs/tags/1.6.0"
  sha256: "06b1b2839a1794ec006db8f86683189bdd974e0404167ff3fc3705f0af02de4e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-G Ninja（E074：HMDFS jobserver fifo EPERM 只影响 make 生成器，Ninja 可并行）"
    - "-DCMAKE_TOOLCHAIN_FILE=<自发现 ohos.toolchain.cmake>（ML-0035 bare cmake，绕开 conan_toolchain unknown HarmonyOS）"
    - "-DCMAKE_PREFIX_PATH=<zlib 包>;<catch2 包>"
    - "-DPKG_CONFIG_EXECUTABLE=<HNP pkg-config>（上游 find_package(PkgConfig REQUIRED)）"
    - "-DPROTOC=<protobuf 包>/bin/protoc（上游 find_program PROTOC REQUIRED）"
    - "-DPYTHON3=<自动发现：$PYTHON3 → HNP → /storage/Users/currentUser/usr/local/bin → PATH>"
    - "-DMGARD_ENABLE_BENCHMARKS=OFF -DMGARD_ENABLE_DOCS=OFF"
    - "-DMGARD_ENABLE_CLI=OFF（CLI 需 TCLAP 1.4，制品仓无此包）"
  dependencies:
    - zlib/1.3.1
    - zstd/1.5.7.1
    - "protobuf/21.12（conan 包，status built；文件格式硬依赖，包内含 protoc 与重定位 protobuf.pc）"
    - "catch2/3.8.1（test_requires，上游测试框架）"
  cc: clang
  upstream_test_command: "cmake --build <build> -- -j$(nproc) 后直接执行 <build>/bin/tests（上游无 add_test，Catch2 主程序全量运行；实跑口径 87 个 test case，源码静态 TEST_CASE 数 116 不是实跑数）"

patches_applied:
  - patches/0002-tests-float-epsilon.patch  # 测试专用 portability：TensorRestriction 投影恒等断言的 Approx 容差仅 float 实例放宽 0.001->0.01（double 保持上游 0.001）；依据=真机第 9 轮插桩实测（见 notes.md）
  # 平台适配（umask/pkg-config shim/路径发现）在配方内完成

knowledge_gained:
  - "静态库交付决策（真机第 5 轮）：制品仓 zlib/1.3.1 仅有 non-fPIC 静态变体（conan list 实测唯一包无 options 变体），共享 libmgard.so 链 libz.a 必报 R_AARCH64_ADR_PREL_PG_HI21 relocation 错；上游 add_library(mgard-library) 无类型修饰完全跟随 BUILD_SHARED_LIBS（tarball 实测）→ -DBUILD_SHARED_LIBS=OFF 静态交付（xar/htslib/cimfomfa 静态-only 先例），fPIC=True 保持以供下游 .so 链入"
  - "静态库包的消费者链接：-l<lib> 后必须按依赖图补齐传递依赖 -L/-l（静态归档解析顺序）；共享库时代只需 -l<lib> 的 test_package 要随静态化联动更新"
  - "MGARD 1.6.0 为 cmake >=3.19 + C++17；protobuf 是文件格式硬依赖（pkg_search_module protobuf>=3.0.0 + find_program PROTOC 双 REQUIRED）→ 直接 require 制品仓 conan 包 protobuf/21.12，包内自带已重定位的 lib/pkgconfig/protobuf.pc 与 bin/protoc，PKG_CONFIG_PATH 追加该目录即可（真机首验曾误判 protobuf 仅 HNP 归档、设备无 HNP protobuf，已修正）"
  - "conandata.yml 不得写 tar_format 键：source() 以 ** 展开传给 conan.tools.files.get() 会报 TypeError（glu/9.0.3 先例；本批 7 个配方同修）；codeload refs/tags URL 的 basename 无扩展名时还必须写 filename 键，否则 get() 误判 zip 报 BadZipFile（E276，abbtr/accel-config 先例）"
  - "真机设备路径事实（2026-09-27 实测）：/data/service/hnp/bin/{pkg-config,ninja} 存在，python3 不在 HNP 而在 /storage/Users/currentUser/usr/local/bin/python3（3.12.9），cmake 4.1.2，ohos-sdk_26.0.0.18 toolchain 可自发现；SDK native/llvm/bin 无 llvm-ranlib（只有 clang/lld/llvm-ar，真机第 6 轮实测 Error 127）→ CMAKE_RANLIB 须显式指 /data/service/hnp/bin/llvm-ranlib"
  - "zstd 经 pkg_search_module(libzstd)（要求文件名 libzstd.pc）→ 配方写 libzstd.pc shim 指向 conan zstd 包；代码层 MGARD_ZSTD 宏守卫"
  - "上游随机化测试的容差是按其标准库的随机流标定的：test_TensorRestriction 用本地固定种子 default_random_engine(445624)（与 Catch2 全局种子无关，失败确定性可复现，-s 无意义），而 default_random_engine 实现定义（libc++=minstd_rand ≠ libstdc++=minstd_rand0）——平台/标准库迁移会得到上游从未测过的随机网格序列；其 epsilon(0.001) 断言在 float 段贴边（真机实测 1.9e-3，double 段零超差），处置=仅 float 实例放宽容差的测试补丁（真机第 9 轮插桩诊断）"
  - "上游测试框架 Catch2 3 未找到会静默跳过测试构建 → 必须 test_requires catch2/3.8.1 注入 CMAKE_PREFIX_PATH，测试目标 OUTPUT_NAME=tests 且顶层 CMAKE_RUNTIME_OUTPUT_DIRECTORY=bin → 产物 {build}/bin/tests（真机第 7 轮实测，此前 mgard-tests 是路径错配误判），上游未注册 add_test 直接执行主程序"
  - "E074（HMDFS jobserver fifo EPERM）只影响 make 生成器；Ninja 无 jobserver fifo 可 -j$(nproc) 并行（zstd 先例，真机 nproc=20）"
  - "ohos.toolchain.cmake 用普通 set() 设 FIND_ROOT_PATH_MODE_*=ONLY，命令行 -D 盖不住 → 交叉链接行丢 -L（ld.lld: unable to find library -lprotobuf/-lzstd）→ 按 brotli/1.2.0.1 先例经 CMAKE_PROJECT_TOP_LEVEL_INCLUDES 注入片段把依赖目录进 FIND_ROOT_PATH 且三 MODE 改 BOTH；构建树 .so/可执行跑测试前按 E077 重签"
  - "包内 .so 按 ML-0043 剥 .codesign 后 binary-sign-tool -selfSign 重签（zstd 同款）；mgard-x/mgard-x-autotuner/mgard-cpu 随 SERIAL 分支默认安装，CLI 门禁 commands.json（R38）"
