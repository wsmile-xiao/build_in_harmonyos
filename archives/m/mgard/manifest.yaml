software: mgard
display: "MGARD"
description: "MGARD - MultiGrid Adaptive Reduction of Data：张量网格上误差可控的有损科学数据压缩库（多网格系数量化，文件格式经 protobuf 序列化），附 mgard-x SERIAL/OpenMP/CUDA/HIP/SYCL 后端基础设施与 mgard-x/mgard-cpu 压缩命令行"
category: library
homepage: "https://github.com/CODARcode/MGARD"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "cmake >=3.19 + C++17：bare cmake + 自发现 ohos.toolchain.cmake（ML-0035，zstd 先例）+ Ninja 生成器并行（E074 只影响 make jobserver）"
    - "protobuf 是文件格式硬依赖（pkg_search_module + find_program PROTOC 双 REQUIRED）→ conan 包 protobuf/21.12（包内自带 protoc 与重定位 protobuf.pc）"
    - "pkg_search_module(libzstd) 要求 libzstd.pc → 配方写 shim 指向 conan zstd 包；zlib 走 find_package（CMAKE_PREFIX_PATH）"
    - "上游测试 Catch2 3 未找到会静默跳过 → test_requires catch2/3.8.1，build() 直接执行 tests/mgard-tests（116 TEST_CASE，上游无 add_test）"
    - "设备路径发现：PKG_CONFIG_EXECUTABLE 指 HNP pkg-config，PYTHON3 按候选列表自动发现（真机无 HNP python3）；包内 .so 按 ML-0043 重签（zstd 同款）"
    - "CLI 工具门禁 commands.json（R38）：mgard-x/mgard-x-autotuner/mgard-cpu；mgard-cli 需 TCLAP 1.4 未启用"

versions:
  "1.6.0":
    status: prepared
    conan_ref: "mgard/1.6.0"
