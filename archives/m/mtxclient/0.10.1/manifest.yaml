# 版本级 manifest — mtxclient 0.10.1
# 文件位置: archives/m/mtxclient/0.10.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.10.1"
software: "mtxclient"
# built: 真机 conan create 全流程通过（Build Summary: Total 1 / Success 1 / 0 failed，
# runner exit 0），上游 9 个离线用例 + test_package 39 项断言全部通过。
# 不标 published：L5（SONAME 门禁）在该设备因缺少 readelf 而无法成立（环境限制，非库缺陷），
# 待 CI 上（有 readelf 的工具机）跑完后按 R29 复核。
status: built
build_date: "2026-09-30"
build_system: cmake

source:
  url: "https://github.com/Nheko-Reborn/mtxclient/archive/refs/tags/v0.10.1.tar.gz"
  sha256: "203be46a08e1dc6cfc068d0911f3b09976f48e4cc4302c3517b9c0f4e53631e3"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DHUNTER_ENABLED=OFF"
    - "-DUSE_BUNDLED_OPENSSL=OFF"
    - "-DUSE_BUNDLED_OLM=OFF"
    - "-DUSE_BUNDLED_JSON=OFF"
    - "-DUSE_BUNDLED_RE2=OFF"
    - "-DUSE_BUNDLED_LIBEVENT=OFF"
    - "-DUSE_BUNDLED_LIBCURL=OFF"
    - "-DUSE_BUNDLED_SPDLOG=OFF"
    - "-DUSE_BUNDLED_COEURL=OFF"
    - "-DUSE_BUNDLED_GTEST=OFF"
    - "-DBUILD_LIB_TESTS=ON"
    - "-DBUILD_LIB_EXAMPLES=OFF"
    - "-DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_STANDARD_REQUIRED=ON"
  dependencies:
    - openssl/3.5.6.1
    - olm/3.2.16
    - nlohmann_json/3.12.0
    - coeurl/0.3.2
    - re2/2024-04-01
    - libcurl/8.5.0
    - libevent/2.1.13
    - spdlog/1.17.0
    - fmt/12.2.0
  test_requires:
    - gtest/1.17.0
  tool_requires:
    - pkgconf/3.0.6
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-cmakelists-lowercase-olm-package.patch"
    description: "CMakeLists.txt 的 find_package(Olm 3.2.7) / Olm::Olm 改为小写 olm / olm::olm，匹配 libolm 自身与 ConanDeps 的包名"
    type: portability
  - file: "patches/0002-cmakelists-gtest-targets.patch"
    description: "15 个测试目标的 GTest::GTest + GTest::Main 改为当前名 GTest::gtest + GTest::gtest_main（gtest 1.14 已删除旧名）"
    type: portability
  - file: "patches/0003-cmakelists-force-soname.patch"
    description: "显式传 LINKER:-soname：OHOS 上 CMake 不实现 VERSION/SOVERSION，否则库无 DT_SONAME、安装无版本名、导出 IMPORTED_NO_SONAME TRUE"
    type: portability

# 上游测试（gtest；统计单位 = gtest 可执行文件 / ctest 测试项）
# 取数命令：ctest -N | tail -1（注册测试数）；ctest -E '^(BasicConnectivity|ClientAPI|MediaAPI|Encryption|Devices|Pushrules)$'
upstream_tests:
  command: "cmake.test() → ctest -E '^(BasicConnectivity|ClientAPI|MediaAPI|Encryption|Devices|Pushrules)$'"
  test_count: 15
  notes: "上游 tests/meson.build 把 15 个 gtest 分成 suite: network（6 个，需要 .ci/synapse 的真实 Synapse homeserver）与 suite: nonetwork（9 个，纯离线）。CMake 侧没有等价 label，故用 ctest -E 排除 6 个网络用例名。conan create 中应执行 9 个并通过；6 个网络用例只构建不执行。Responses 用例依赖 configure 阶段 file(COPY tests/fixtures ...) 复制到 build 目录的 2.5MB sync.json，其 fixture_prefix() 在未设 FIXTURE_PREFIX 时回退为 \".\"，ctest 默认工作目录即 build 目录，可命中。"

test_package:
  assertion_count: 36
  description: "经安装后的 MatrixClient::MatrixClient 公开 API 做 36 项离线断言：Matrix 标识符解析（含 0.10.1 修复的无服务器名 v12 房间 id）、MXC URI 解析、random_token/query_params/url_encode、RFC 4648 base64 向量、mtx::http::Client 构造与 getter/setter（触发 coeurl+libcurl+libevent+spdlog 链接链）、AES-CTR-256 加解密往返、HMAC-SHA256、PBKDF2-HMAC-SHA512、HKDF-SHA256、libolm CURVE25519 公钥派生、SSSS encrypt/decrypt 往返、encrypt_file/decrypt_file 往返、Text 事件与 Login 响应 json 双向序列化。"

known_limitations:
  - "ohpcd 发行 libcurl/8.5.0 无 TLS 后端，真实 homeserver 的 HTTPS 通信在运行期返回 CURLE_UNSUPPORTED_PROTOCOL；本包适合作为后续应用适配的编译/链接基线，端到端联网能力受该依赖限制"
  - "6 个 network 组上游用例需要 Synapse 实例，未纳入 conan create（仍编译，仅不执行）"
  - "真机 L5 门禁因该设备缺少 readelf/llvm-readelf/objdump 而恒失败（库本身 SONAME 正确，已用 llvm-readobj 取证）；同一设备上任何产出 .so 的包都会如此"
  - "真机 L4 告警为子串误报：补丁正文散文中的 targets/widgets 命中 gets 规则，补丁不含任何 C 危险函数"

knowledge_gained:
  - "OHOS 上 CMake 不实现 VERSION/SOVERSION：即使 target 确为 SHARED_LIBRARY 且属性设置正确，链接行仍无 -soname、install 只产出未版本化文件名、导出目标被标 IMPORTED_NO_SONAME TRUE（已用最小复现工程证实）；须显式传 LINKER:-soname 并在 package() 物化 soname 文件名  # knowledge_ref: E999-draft-MTX1"
  - "CMakeToolchain 的 CppStdBlock 用 profile 的 compiler.cppstd 发出普通 CMake 变量 set(CMAKE_CXX_STANDARD N)，普通变量优先级高于项目里的 cache 变量；要在 recipe 里改标准必须设 self.settings.compiler.cppstd  # knowledge_ref: E999-draft-MTX2"
  - "conanfile.py 的 generators 必须作为类属性声明；只写在注释里则 Conan 只生成 toolchain，不生成任何 CMakeDeps 的 *-config.cmake 与 PkgConfigDeps 的 .pc  # knowledge_ref: E999-draft-MTX3"
  - "cmake.test() 走 cmake --build --target test，不套 run 环境也不接受 ctest 选项；要跑 ctest 应 self.run(\"ctest ...\", env=\"conanrun\")。排除用例用 CTestCustom.cmake 里的 set(CTEST_CUSTOM_TESTS_IGNORE ...)（变量，不是命令）"
  - "header-only 依赖（如 nlohmann_json）不会产生 Conan 包节点，package_info() 无法把其 include 目录转达给消费者；消费者需自行 requires 同版本"
  - "打包 spdlog 以 external fmt 编译但配方未声明接口宏时，消费者须在 cpp_info.defines 补 SPDLOG_FMT_EXTERNAL/SPDLOG_COMPILED_LIB/SPDLOG_SHARED_LIB，否则头文件落到 bundled 分支报 'spdlog/fmt/bundled/format.h' not found"
  - "签名 ELF 类工具链设备上可能没有 readelf；依赖 readelf 的 CI 门禁会整体误报，判断时应改用 llvm-readobj 复核（本设备只有 llvm-readobj）"
  - "git archive 会依据 .gitattributes 的 text=auto 在检出侧产出 CRLF；传到 /bin/sh 不是 bash 的设备后会报 'command not found: ^M'，且 $'\\r' 检测失效，应在主机侧先做 LF 规范化"
  - "CMake find_package 的名字回退：CMake 同时搜索 <Name>Config.cmake 与 <name>-config.cmake（小写变体），因此 CMakeDeps 为 gtest 生成的 gtest-config.cmake 能被 find_package(GTest) 命中；不需要为大小写改包名"
  - "CMakeDeps 的 CMake 目标名与 conan 包名解耦：olm/3.2.16 配方未声明 cmake_target_name，生成的是 olm::olm；上游若写 Olm::Olm 就会配置失败"
  - "googleTest 1.13 起把导出目标改名为 GTest::gtest / GTest::gtest_main，1.14 删除旧名；CMakeDeps 只导出 gtest::gtest（无 gtest_main），需要 main() 时应把 GTest_DIR 指向包内自带的 GTestConfig.cmake"
  - "判断某个 pkg-config 模块名能否用，必须看 PkgConfigDeps 实际生成的 .pc（以配方 cpp_info.libs 为准），不能看包内 lib/pkgconfig 里有没有同名文件：gtest 包内有 gtest_main.pc，但配方只声明 libs=[\"gtest\"]，PkgConfigDeps 只产出 gtest.pc"
  - "OHOS 镜像/hnp 树没有 pkg-config 也没有 pkgconf 可执行文件；依赖上游 pkg_check_modules 的库必须把 pkgconf 作为 tool_requires 引入并固定 PKG_CONFIG_EXECUTABLE"
  - "W0 验证方法学：conan download <ref> 即使打印 'No packages found for this revision' 也可能 exit 0，不能用退出码判断依赖是否已发布；必须用 conan graph info / conan install 读取节点的 binary 字段  # knowledge_ref: E999-draft-MTX4"
  - "Conan 用 -DCMAKE_TOOLCHAIN_FILE= 命令行参数注入 toolchain，优先级高于项目 CMakeLists.txt 顶层的 set(CMAKE_TOOLCHAIN_FILE ... CACHE FILEPATH ...)"
  - "仓库根 .gitignore 第 91 行 reports/ 会忽略归档的 reports 目录，但 ARCHIVE-SPEC 要求保留并经 671 个已跟踪文件形成先例；归档报告需 git add -f"
