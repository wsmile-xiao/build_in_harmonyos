# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mtxclient/0.10.1
homepage: "https://github.com/Nheko-Reborn/mtxclient"

# 上游测试入口。上游 CMake 构建启用 BUILD_LIB_TESTS=ON 时构建全部 15 个 gtest
# 可执行文件，并在 CMakeLists.txt 末尾注册 15 个 add_test()。
upstream_check_command: "ctest（CMake build 目录内；等价 meson test）"
upstream_test_in_build: true
upstream_test_command: "cmake.test() → ctest -E '^(BasicConnectivity|ClientAPI|MediaAPI|Encryption|Devices|Pushrules)$'"

# 上游测试分组依据：tests/meson.build 用 suite: network / suite: nonetwork 标记
# 需要真实 Synapse homeserver 的用例。CMake 侧无等价 label，故按测试名排除。
upstream_tests:
  # ── nonetwork 组：本配方在 conan create 中实际执行 ──
  - name: "Identifiers"
    source: "tests/identifiers.cpp"
    description: "Matrix 标识符（User/Room/Event/Device/Group）解析与 json 序列化"
    command: "ctest -R '^Identifiers$'"
  - name: "Errors"
    source: "tests/errors.cpp"
    description: "Matrix 错误码与错误响应解析"
    command: "ctest -R '^Errors$'"
  - name: "CryptoStructs"
    source: "tests/crypto.cpp"
    description: "DeviceKeys/OneTimeKeys/加密事件等结构体的 json 双向序列化"
    command: "ctest -R '^CryptoStructs$'"
  - name: "StateEvents"
    source: "tests/events.cpp"
    description: "房间状态事件（m.room.*）解析"
    command: "ctest -R '^StateEvents$'"
  - name: "RoomEvents"
    source: "tests/messages.cpp"
    description: "消息事件（m.room.message.*）解析"
    command: "ctest -R '^RoomEvents$'"
  - name: "VoIPEvents"
    source: "tests/voip.cpp"
    description: "m.call.* VoIP 事件解析"
    command: "ctest -R '^VoIPEvents$'"
  - name: "Responses"
    source: "tests/responses.cpp"
    description: "Sync 响应解析（读取 tests/fixtures/responses/sync.json 2.5MB 与 sync_with_crypto.json）"
    command: "ctest -R '^Responses$'"
  - name: "Requests"
    source: "tests/requests.cpp"
    description: "请求体构造与序列化"
    command: "ctest -R '^Requests$'"
  - name: "Utilities"
    source: "tests/utils.cpp"
    description: "CanonicalJSON、OlmClient 签名/校验、SSSS 密钥派生（libolm + OpenSSL）"
    command: "ctest -R '^Utilities$'"
  # ── network 组：需要真实 Synapse homeserver，本配方只构建不执行 ──
  - name: "BasicConnectivity (network)"
    source: "tests/connection.cpp"
    description: "需要 .ci/synapse 提供的 Synapse 实例（SYNAPSE_URL）"
    command: "ctest -R '^BasicConnectivity$'"
    expected: "NOT RUN in conan create: 无 homeserver"
  - name: "ClientAPI (network)"
    source: "tests/client_api.cpp"
    description: "注册/登录/房间/同步全流程，需要真实 homeserver"
    command: "ctest -R '^ClientAPI$'"
    expected: "NOT RUN in conan create: 无 homeserver"
  - name: "MediaAPI (network)"
    source: "tests/media_api.cpp"
    description: "媒体上传下载，需要真实 homeserver 与 tests/fixtures 媒体文件"
    command: "ctest -R '^MediaAPI$'"
    expected: "NOT RUN in conan create: 无 homeserver"
  - name: "Encryption (network)"
    source: "tests/e2ee.cpp"
    description: "端到端加密会话建立，需要真实 homeserver"
    command: "ctest -R '^Encryption$'"
    expected: "NOT RUN in conan create: 无 homeserver"
  - name: "Devices (network)"
    source: "tests/device.cpp"
    description: "设备密钥上传/查询，需要真实 homeserver"
    command: "ctest -R '^Devices$'"
    expected: "NOT RUN in conan create: 无 homeserver"
  - name: "Pushrules (network)"
    source: "tests/pushrules.cpp"
    description: "推送规则推送/拉取，需要真实 homeserver"
    command: "ctest -R '^Pushrules$'"
    expected: "NOT RUN in conan create: 无 homeserver"

# 测试统计口径（单位 = gtest 可执行文件，与上游 add_test() 数一致）
# TOTAL = PASS(9, nonetwork) + NOT_RUN(6, network) + FAIL(0) + SKIP(0) = 15
test_statistics:
  total: 15
  passed: 9
  failed: 0
  skipped: 0
  not_run: 6
  unit: "gtest executable / ctest test"
  environment: "OHOS/aarch64 原生构建；nonetwork 组无外部依赖，network 组需 Synapse（上游 .ci/synapse Docker）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "经安装后的 MatrixClient::MatrixClient 公开 API 做离线验证：Matrix 标识符解析（含 0.10.1 修复的无服务器名 v12 房间 id）、MXC URI 解析、random_token/query_params/url_encode、RFC 4648 base64 向量、mtx::http::Client 构造与 setter（触发 coeurl+libcurl+libevent+spdlog 链接链）、AES-CTR-256 加解密往返、HMAC-SHA256、PBKDF2-HMAC-SHA512、HKDF-SHA256、libolm CURVE25519 公钥派生、SSSS encrypt/decrypt 往返、encrypt_file/decrypt_file 往返、Text 事件与 Login 响应 json 双向序列化"
    command: "./test_package"
    expected: "checks=39 failures=0；输出 MTXCLIENT_TEST_PACKAGE_OK（真机实测 39/39 通过）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 39
