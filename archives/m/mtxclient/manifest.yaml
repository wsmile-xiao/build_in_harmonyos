software: mtxclient
display: "mtxclient"
description: "Nheko 使用的 Matrix 客户端-服务器 API C++ 库（coeurl/libcurl + libolm + OpenSSL，C++20）"
category: library
homepage: "https://github.com/Nheko-Reborn/mtxclient"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "W0 通过：10 个依赖（openssl/olm/nlohmann_json/coeurl/re2/libcurl/libevent/spdlog/fmt/gtest）+ tool_requires pkgconf 在 ohpcd 均有对应 OHOS 制品；coeurl 0.3.2 制品已在仓（其配方目录尚未合入 main，但不影响本库构建）"
    - "⚠️ W0 验证方法：conan download 打印 'No packages found for this revision' 时仍可能 exit 0，不能用退出码判断；必须用 conan graph info 读 binary 字段"
    - "⚠️ OHOS 镜像无系统 pkg-config/pkgconf：本库上游用 pkg_check_modules 探测 5 个依赖，配方以 tool_requires 引入 pkgconf/3.0.6 并固定 PKG_CONFIG_EXECUTABLE"
    - "ohpcd libcurl/8.5.0 为无 TLS 后端变体（conaninfo 仅 zlib，DT_NEEDED 仅 libc.so）：库可构建、离线 API 可跑，但真实 Matrix homeserver 走 HTTPS 时会得到 CURLE_UNSUPPORTED_PROTOCOL"
    - "C++20 必需：mtx/identifiers.hpp 用 std::strong_ordering + operator<=>，profile 的 cppstd=17 需在配方中覆盖"
    - "patch 0001：mtxclient 的 find_package(Olm) 与 Olm::Olm 在 libolm 3.2.x 的 cmake 包名（olm-config.cmake）与 CMakeDeps 生成名（olm::olm）下都找不到，降为小写"
    - "patch 0002：gtest 1.14 起删除 GTest::GTest / GTest::Main 目标，改用包内自带 gtest.pc / gtest_main.pc 经 pkg-config 消费"
    - "mtxclient 的 CMakeLists 用 pkg_check_modules 探测 re2 / libevent_core / libevent_pthreads / libcurl / coeurl，其余用 find_package CONFIG，故配方同时生成 CMakeDeps 与 PkgConfigDeps"
    - "上游 toolchain.cmake 只设 C++ 标准与 PIC，不设编译器/系统名；Conan 通过 -DCMAKE_TOOLCHAIN_FILE= 传入自己的 toolchain，命令行优先级高于 CMakeLists.txt 顶层 set(...CACHE)，无冲突"
    - "上游 15 个 gtest 中 6 个需要真实 Synapse（tests/meson.build 标 suite: network），设备包构建只执行 9 个 nonetwork"
  common_dependencies:
    - coeurl
    - openssl
    - olm
    - nlohmann_json
    - re2
    - libcurl
    - libevent
    - spdlog

versions:
  "0.10.1":
    status: built
    build_date: "2026-09-29"
