software: mpegdemux
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.1.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-31"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方 hampa.ch)
  url: "http://www.hampa.ch/mpegdemux/mpegdemux-0.1.5.tar.gz"

  # 源码校验和 (与官方 MD5SUMS + Debian/Ubuntu launchpad 一致)
  sha256: "05015755d45e50cbd3018baeaa8abcedc003b1162fa28237a72ab25c1bc00023"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表 (仅需 --prefix)
  configure_options: []

  # 编译依赖列表 (零依赖纯 C 程序)
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 零 patch 构建
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "mpegdemux 零依赖纯 C 程序，musl/OHOS 兼容性优秀，零 patch 构建"
  - "上游 tarball 自带预生成 configure (autoconf 2.71)，无需 autoreconf"
  - "上游无正式测试套件 (无 tests/regress/Makefile check 目标)，test_package 承担唯一功能验证"

patch_generation:
  method: none
  patches_count: 0
