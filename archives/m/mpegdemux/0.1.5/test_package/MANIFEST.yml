# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mpegdemux/0.1.5
homepage: "http://www.hampa.ch/mpegdemux/index.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 mpegdemux 0.1.5 无正式测试套件:
#   - 源码树无 tests/ regress/ 目录
#   - Makefile.in 无 check:/test: 目标
#   - configure.ac 无 TESTS/check_PROGRAMS
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Real demux of a programmatically generated MPEG-2 PS in all four modes (scan/list/demux/remux) + negative test"
    command: "mpegdemux -c/-l/-d/-r test.mpg"

# 测试断言总数 (近似值, 用于质量评估)
# scan(1) + list(3) + demux(3) + remux(4) + negative(1) + ELF(3) = 15
assertion_count: 15
