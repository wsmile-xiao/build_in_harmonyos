package: merve/1.2.2
homepage: "https://github.com/nodejs/merve"

upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure"

upstream_tests:
  - name: "merve upstream GoogleTest suite"
    count: "101 executed (100 TEST declarations + 1 compile-only)"
    description: >-
      100 GoogleTest TEST cases in tests/real_world_tests.cpp (65, C++ API) and
      tests/c_api_tests.cpp (35, C API), taken from the pristine v1.2.2 tarball
      (count with `grep -cE '^  *TEST\(' tests/real_world_tests.cpp tests/c_api_tests.cpp`),
      plus the compile-only `c_api_compile_test` that tests/CMakeLists.txt registers with
      add_test. CTest therefore enumerates 101 entries and all 101 pass on the device.
      The recipe configures with MERVE_TESTING=ON, points GTest_DIR at the Conan
      gtest/1.17.0 package so CPM never clones googletest, applies
      patches/0001-tests-when-gtest-provided.patch (upstream only probes Git inside its
      CPM fetch branch, so with a Conan-provided GTest the tests/ subdirectory was
      silently skipped), builds both test binaries, lets gtest_discover_tests register
      every case with CTest, runs ctest from build(), and fails the build if CTest
      enumerates fewer than 100 tests.

test_package_tests:
  - file: test_package.cpp
    description: "Consumer suite (43 assertions) over the Conan merve::merve target: version macros, exports.foo / exports['bar'], module.exports literal, reserved-word keys, esbuild hint and TypeScript __export/__exportStar re-export patterns, 1-based line numbers, empty input, ESM-import error state"
    command: "conan create . --build=missing"
  - file: harmonyos_test.cpp
    description: "HarmonyOS-specific consumer suite (29 assertions): __OHOS__ identity, C ABI from C++, UTF-8 byte-oriented export names on musl, LF and CRLF error locations, four-thread concurrent parsing against the thread_local error state, 4000x parse/free allocation stability, non-NUL-terminated input slicing"
    command: "conan create . --build=missing"

assertion_count: 72
