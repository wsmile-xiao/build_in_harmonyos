version: "1.2.2"
status: built
build_date: "2026-09-23"
build_system: cmake

source:
  url: "https://github.com/nodejs/merve/archive/refs/tags/v1.2.2.tar.gz"
  sha256: "8f19c2132447b9113545ffd399cb2bc1e61c6166743921b04883f8e1d778d69e"
  tag: "v1.2.2"
  tar_format: tar.gz

build:
  system: cmake
  dependencies: []
  test_dependencies:
    - "gtest/1.17.0"

patches_applied:
  - file: "patches/0001-tests-when-gtest-provided.patch"
    description: "Enable the upstream tests when GTest comes from Conan (upstream only probes Git inside its CPM fetch branch)"

knowledge_gained:
  - "merve gates its test suite behind find_package(Git); without git on PATH CMake silently disables tests and ctest would report an empty suite"
  - "Pointing GTest_DIR at the Conan gtest package makes upstream's system-package-first branch win, so CPM never clones googletest at configure time"
  - "merve forces CMAKE_CXX_STANDARD 20 with a plain set(), which shadows any cached -DCMAKE_CXX_STANDARD"
