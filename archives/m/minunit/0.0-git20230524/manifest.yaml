# 版本级 manifest — minunit 0.0-git20230524
# 遵循 ARCHIVE-SPEC v2.0

version: "0.0-git20230524"
software: minunit

# 编译状态: published | built | failed | archived
#（当前 built：conan create + test_package 实测通过，未 upload）
status: built

build_date: "2026-10-02"
build_system: none (header-only, single minunit.h)

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游 master-only（无 tag/release），版本号按 0.0-gitYYYYMMDD 规则：
  # master HEAD a0586569bd8abfb7a37390d670484c201e9173bf（2023-05-24 提交）
  # R39：官方单 URL（GitHub master tarball），CI 自动加镜像 fallback
  url: "https://github.com/siu/minunit/archive/refs/heads/master.tar.gz"
  sha256: "144c2518446032b1181b7656e9ddeba0c51337afa6b32401bc05c4f30d873a6e"
  tar_format: tar.gz
  # tarball 内层目录 minunit-master/，strip_root=True 展开
  strip_root: true

# ============================================================
# 构建配置
# ============================================================

build:
  # 无构建系统：上游根目录无 CMakeLists/Makefile（ci/Makefile 仅为官方 CI
  # 编译 example 的辅助入口，非安装构建系统）。配方 build() 用 profile
  # 注入的 OHOS clang 直接编译上游官方测试 minunit_example.c。
  system: none
  configure_options:
    - "（header-only：无 configure）"
  # W0 实测：minunit.h 仅依赖 C99 标准库 + POSIX 计时器头，零第三方依赖
  dependencies: []
  cc: clang
  cxx: clang++
  # 链接：-lm（mu_assert_double_eq 用 fabs/log10）；构建宿主 HarmonyOS
  # 按上游 ci/Makefile 自身 UNAME_S 分支逻辑不追加 -lrt（OHOS musl 无独立
  # librt，timer 符号在 libc）

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试统计
# ============================================================

test_summary:
  # 上游官方测试：minunit_example.c（11 个 MU_TEST / 11 断言，其中 6 个为
  # 框架故意演示失败的用例——验证断言捕获能力）
  # 官方契约 ci/check_example.sh：exit code == 6 → PASS
  upstream_registered_targets: 1
  upstream_passed: 1
  upstream_failed: 0
  upstream_test_note: "上游官方 CI 入口 (cd ci && make && ./check_example.sh)：编译 minunit_example.c（-Wall -Wextra -I../ -lm）→ 运行并断言 exit code==6（MU_EXIT_CODE=失败计数，6 个 *_fail 演示用例按设计失败）。设备实测：11 tests / 11 assertions / 6 designed-failures / exit 6 → 官方口径 PASS"
  test_package_passed: 1
  test_package_failed: 0

# ============================================================
# 产物形态
# ============================================================

package:
  type: header-library
  exports: "include/minunit.h（单头文件）+ licenses/MIT-LICENSE.txt"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "master-only 库（无 tag/release）版本号规则 0.0-gitYYYYMMDD：取 master HEAD 提交日期（a0586569 → 2023-05-24 → 0.0-git20230524），conandata 用官方 refs/heads/master.tar.gz + 实测 sha256"
  - "上游官方测试契约：ci/check_example.sh 断言 ./minunit_example 退出码==6——非零退出码是 PASS 判据（6 个故意失败用例演示断言捕获，MU_EXIT_CODE=minunit_fail）。自检脚本不能见非零就判负，必须按官方契约解释"
  - "上游 ci/Makefile 按 UNAME_S==Linux 追加 -lrt；构建宿主 HarmonyOS 按上游自身分支逻辑不链 -lrt（OHOS musl timer 符号在 libc），实测链接运行均正常"
  - "minunit.h 在 OHOS clang15 -std=c99 下零警告编译（example 自身 2 个 unused-parameter 警言属上游源码）；_POSIX_C_SOURCE 200112L + clock_gettime/sysconf/times 路径在 musl 全部可用，无平台适配代码需求"
  - "header-only 包型（package_type=header-library + auto_header_only_mode + package_id clear）：package() 仅拷贝 minunit.h→include/ + MIT-LICENSE.txt→licenses/；cpp_info.system_libs=['m']（mu_assert_double_eq 用 fabs/log10，musl 中已并入 libc，glibc 侧为真实依赖）"
