# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: minunit/0.0-git20230524
homepage: "https://github.com/siu/minunit"

# 上游无构建系统（无 make check / ctest 等价物）；官方 CI 入口是
# .travis.yml / appveyor.yml 的 script: (cd ci && make && ./check_example.sh)
#   — ci/Makefile 编译 minunit_example.c（-Wall -Wextra -I../ -lm）
#   — ci/check_example.sh 运行并断言退出码 == 6
# 配方 build() 内执行同款编译+运行（真跑），故 upstream_test_in_build: true
upstream_check_command: "(cd ci && make && ./check_example.sh)"

upstream_test_in_build: true
upstream_test_command: "./minunit_example (assert exit code == 6, per ci/check_example.sh)"

# 上游官方测试：minunit_example.c（唯一测试目标，进统计表）
# - 11 个 MU_TEST / 11 个断言，其中 6 个为框架故意演示失败的用例
#   （*_fail 系列：验证断言捕获能力，MU_EXIT_CODE = 失败计数）
# - 官方契约 ci/check_example.sh：退出码 == 6 → PASS（非零退出码是
#   PASS 判据，不是失败）
upstream_tests:
  - file: minunit_example.c
    source: minunit-master/minunit_example.c
    description: "上游官方 example 套件：11 个 MU_TEST（6 正向断言 + 5 故意失败演示）+ 1 个 mu_fail，11 断言；官方契约断言退出码==6 — PASS（真跑进 conan create build()）"
    command: "./minunit_example (exit code 6 = official PASS per ci/check_example.sh)"

# 消费者测试（test_package）：minunit 断言宏真跑 + 契约精确校验
test_package_tests:
  - file: test_minunit.c
    description: "消费者测试: 10 用例全量覆盖 5 个断言宏正向路径 + 5 个故意失败用例校验断言捕获（MU_EXIT_CODE==5 精确断言 + MU_REPORT 输出校验）+ setup/teardown 每用例触发校验"
    command: "./test_minunit (exit code 5 = minunit contract as designed)"

assertion_count: 11
