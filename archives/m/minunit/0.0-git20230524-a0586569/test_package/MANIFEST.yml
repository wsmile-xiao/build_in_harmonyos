# 上游官方测试声明文件
# minunit has one official CI harness. Its eleven sample cases deliberately
# produce six failures; the unchanged harness validates exit code 6.

package: minunit/0.0-git20230524-a0586569
homepage: "https://github.com/siu/minunit"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cd ci && make && sh check_example.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python upstream_test.py <source> <build> --compiler <C-compiler>"

# 上游实际运行的测试程序
upstream_tests:
  - "ci/check_example.sh (or ci/check_example.bat): 1 official regression harness"
upstream_inventory_count: 11
upstream_harness_count: 1
upstream_sample_case_count: 11
upstream_expected_failure_count: 6
upstream_case_inventory:
  - test_check
  - test_assert
  - test_assert_int_eq
  - test_assert_double_eq
  - test_check_fail
  - test_assert_fail
  - test_assert_int_eq_fail
  - test_assert_double_eq_fail
  - test_string_eq
  - test_string_eq_fail
  - test_fail

# test_package 中自带的测试 (消费者视角验证, 编译+运行)
test_package_tests:
  - file: test_minunit.py
    description: "消费者冒烟 — 编译 MU_TEST_SUITE 双用例并运行,断言 2 tests/0 failures(header 存在性/编译/运行/判据四段)"
    command: "python test_minunit.py <pkg>"

# 上游测试断言总数
assertion_count: 11
