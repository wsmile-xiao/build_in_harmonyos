software: mbr
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（mbr 为 Debian 原生维护包，权威源即 Debian pool）
  url: "https://ftp.debian.org/debian/pool/main/m/mbr/mbr_1.2.2.tar.xz"

  # 源码校验和
  sha256: "4169a4bc2b4b94d41178bd04200eb89116a0e80020253ee92b2126ef4c42f115"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（Conan AutotoolsToolchain 自动生成 prefix/bindir/sbindir/host）
  configure_options: []

  # 运行期库依赖列表（格式: name/version）—— mbr 无库依赖
  dependencies: []

  # 构建期工具（tool_requires，走 build profile）
  tool_requirements:
    - dev86/0.16.21
    - xxd/9.1.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-case-distinct-intermediate-suffix.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS 大小写不敏感：make 对中间产物 mbr.s86 的存在性检查被同名源文件 mbr.S86 满足，预处理配方 %.s86: %.S86 被跳过，as86 直接汇编未预处理源码报 87 处 unbound label；中间后缀改 .i86 解决（产物字节不变）"
  - "非目标架构汇编器（as86/ld86）与 xxd 以 tool_requires 注入即可在 aarch64 上构建内嵌 8086 引导扇区的宿主程序，x86 汇编不等于不可适配"
  - "install-mbr 要求目标镜像已有 0x55AA 引导签名，否则需 --force；消费者测试用例据此构造 510 零 + 55AA 的镜像"
  - "HMDFS 上 make -j 的 jobserver mkfifo 被拒（EPERM），需 make -j1（E074 同源）"

patch_generation:
