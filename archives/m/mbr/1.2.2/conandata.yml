sources:
  "1.2.2":
    url: "https://ftp.debian.org/debian/pool/main/m/mbr/mbr_1.2.2.tar.xz"
    sha256: "4169a4bc2b4b94d41178bd04200eb89116a0e80020253ee92b2126ef4c42f115"
patches:
  "1.2.2":
    - patch_file: "patches/0001-case-distinct-intermediate-suffix.patch"
      patch_description: >-
        Rename the preprocessor intermediate suffix (.s86 -> .i86): upstream
        assumes .S86 and .s86 are two distinct files, which is false on
        case-insensitive filesystems (HMDFS on HarmonyOS PC). There make's
        existence check on the intermediate mbr.s86 is satisfied by the source
        file mbr.S86, so the "%.s86: %.S86" recipe never runs and as86 is handed
        the unprocessed source, reporting 87 unbound-label errors.
      patch_type: "portability"
