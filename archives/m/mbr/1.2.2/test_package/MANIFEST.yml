# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: mbr/1.2.2
homepage: "https://tracker.debian.org/pkg/mbr"

# Upstream test command (make -n check / ctest -N / meson test --list analysis)
upstream_check_command: "make check"

# conanfile.py build() method - upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs (mbr/tests/, shell scripts driven by wraptest)
# Inventory of the 21 scripts shipped by upstream:
#   * 6 are registered in Makefile.am TESTS (inst-1, inst-3, inst-4, inst-6,
#     inst-7, inst-8). On this port 4 pass (inst-4/6/7/8) and 2 fail
#     (inst-1/inst-3) because they still assert the pre-NEW_FORMAT on-disk
#     layout: inst-1 compares the disk-signature area (440..445) that
#     copy_table() deliberately preserves, inst-3 compares the parameter block
#     at 427..439 that modify_params() deliberately rewrites. Both fail on any
#     platform, no filesystem involved.
#   * 12 (mbr-1..6, testdisk-1..6) run the boot sector through harness/harness
#     (DOS VM86); without it wraptest exits 77 (skip).
#   * inst-2, inst-5 and version need RCS `co` to materialise the historical
#     images from historic,v; upstream does not register them in TESTS.
upstream_tests:
  - file: "tests/inst-1, tests/inst-3, tests/inst-4, tests/inst-6, tests/inst-7, tests/inst-8"
    source: "mbr/tests/ (registered in Makefile.am TESTS)"
    description: "Automake suite, run through the generated wraptest driver; 4/6 pass on this port, inst-1/inst-3 assert an older on-disk layout"
    command: "make check"
  - file: "tests/mbr-1..6, tests/testdisk-1..6"
    source: "mbr/tests/"
    description: "Boot behaviour tests executed through harness/harness (DOS VM86); skipped (exit 77) in a build without --enable-vm86"
    command: "sh wraptest tests/mbr-1"
  - file: "tests/inst-2, tests/inst-5, tests/version"
    source: "mbr/tests/"
    description: "Require RCS 'co' to generate the historical images (mbr-1.x.y.b) from historic,v; not registered in TESTS by upstream"
    command: "sh wraptest tests/inst-2"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Run the installed install-mbr: --version, --help, install onto a signature-valid image, verify boot signature / written code / preserved partition area, -l read-back, -n no-op, --force, refusal of a 0 byte target"
    command: "install-mbr --version && install-mbr --help && install-mbr test-mbr.img && install-mbr -l test-mbr.img && install-mbr -n test-noop.img && install-mbr --force test-force.img"
  - file: test.sh
    description: "Shell driver mirroring the same ten checks (dd/od/cmp based)"
    command: "sh test.sh"

# Test assertion count (approximate, for quality assessment)
assertion_count: 14
