# manifest.yaml — metastore 软件级元数据
software: metastore
display: "metastore"
description: "把文件树的属主/属组/权限位/扩展属性(xattr)/mtime 存入独立 metafile，并可事后比对或回写的命令行工具"
category: "system"
homepage: "https://github.com/przemoc/metastore"
license: GPL-2.0-only
build_system: "hand-written GNU Makefile（上游自称 Almost Universal Makefile；非 autotools/CMake，make 即成）"

ohos_adaptation:
  key_points:
    - "libbsd 假依赖的真实边界：全树对 libbsd 的唯一消费点是 src/metaentry.c:656 的一次 strmode(3) 调用（渲染 --dump 的 mode 列）。OHOS 上 <bsd/string.h> 不存在且 musl 未定义 strmode（nm 实测 OHOS libc.so 无该符号），而制品仓 ohpcd 未发布 libbsd（conan download libbsd/* -r=ohpcd --only-recipe → 0 recipes）"
    - "补丁 0001 携入树内 strmode(3) 等价实现（沿用 OpenSSH openbsd-compat 的 HAVE_STRMODE 惯例守卫，逐字节对齐 libbsd/OpenBSD 行为：11 字符类型+权限 + ACL 占位符 + NUL，恰好 12 字节，与调用方 char mode[11+1] 严丝合缝），并同步摘掉 Makefile 的 -lbsd"
    - "strlcpy/strlcat 这对 -lbsd 名义上伺候的函数 musl 原生就有（nm 实测 OHOS libc.so 均为 T），所以摘掉 -lbsd 不丢任何符号；补丁不含任何平台宏（__OHOS__ 等）"
    - "打包不走 make install：上游 install-mans/install-docs 用 cp -P --parents，会把 man1/metastore.1 落到 $MANDIR/man1/ 子目录，改为显式 copy() 使包布局确定"
    - "passwd DB 空洞：HarmonyOS 不为应用 uid（如 20001006）建 passwd/group 条目，getpwuid/getgrgid 合法返回 NULL；上游 mentry_create 把这当致命错误 return NULL，整条 metaentry 被丢弃 ⇒ 本平台上 save/compare/dump/apply 全部退化为空操作。补丁 0002 回落到数字 uid 并让 apply 路径接受该十进制形式（同 tar 的 numeric-owner 思路）；判据是「数据库有没有这个 id」，与平台无关，passwd DB 完整的主机行为逐字节不变"
    - "该缺陷本地不可见：以 root 跑时 uid 0 有 passwd 条目，12/12 全绿；只有测试用户本身不在 DB 里才暴露。已用 setpriv --reuid=20001006 在本地等价复现真机条件并验证修复（仅 0001：6/25 FAIL；0001+0002：12/12 PASS）"
    - "HMDFS 拒绝 NULL 缓冲区尺寸探测 getxattr(path, attr, NULL, 0)（回 EINVAL，而 listxattr 正常报属性名）；上游把单个属性读失败当致命错误 return NULL，整条 metaentry 作废 ⇒ metafile 只剩 18 字节的签名+版本头。补丁 0003 改为真实缓冲区 + ERANGE 增长，读不到的属性报告并跳过，写入计数改为实际读到个数"
    - "conan 顺序施加 conandata 补丁时不容忍靠 offset 落位的补丁：第 N+1 个补丁必须对『前 N 个已施加』的树 diff，并以 --fuzz=0 空跑验证；本地 patch -p1 手工验是 fuzz 容错的、会掩盖问题，只有 conan create 权威"
    - "xattr 是 metastore 的核心存储介质，OHOS musl 的 <sys/xattr.h>（listxattr/getxattr/lsetxattr/lremovexattr/XATTR_CREATE）齐备，是本包三条鸿蒙特有断言组（[8] / [8b] / [9]）之一"

