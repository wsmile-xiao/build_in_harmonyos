# manifest.yaml - metastore 1.1.2 版本级元数据
software: metastore
version: "1.1.2"
status: built
build_date: "2026-10-02"
build_system: "hand-written GNU Makefile（make CC=<conf> -j1；无 configure 步骤）"

description: "把文件树的属主/属组/权限位/扩展属性(xattr)/mtime 存入独立 metafile，并可事后 compare/apply 的 C99 命令行工具"
category: "system"
license: GPL-2.0-only

compiler: "clang (OHOS NDK clang-15, aarch64-unknown-linux-ohos)"
target_arch: aarch64
target_os: ohos

configure_options:
  - "无 configure；构建参数只有 CC=<tools.build:compiler_executables.c>（R33：从 Conan conf 读，不裸用 ${CC}）"

build_commands:
  - "make CC=/opt/lpk-fixed/clang -j1（补丁 0001 + 0002 + 0003 均在 build() 开头施加，顺序不可调）"
  - "package(): copy() 显式落 bin/metastore + share/man/man1/metastore.1 + share/doc/metastore/{README,NEWS,AUTHORS,FILEFORMAT,metastore.txt} + licenses/LICENSE.GPLv2"

test_result: PASS
test_summary: "upstream_static: 0（上游 Makefile 的 .PHONY 无 check/test 目标，源码树无 tests/ 目录，无 ctest/pytest 注册）；upstream_executed: 0；consumer: 1 程序 / 9 组断言共 12 条 PASS（test_package/test_metastore.sh），其中鸿蒙特有 3 组（与 test_metastore.sh 的 [OHOS] 标注一一对应）：[8] strmode shim 的 --dump mode 列与 ls -ld 逐条对拍（四种文件类型 + 逐字节 11 字节宽度）、[8b] 特殊位字形钉死（setuid S/s、setgid s、sticky T/t）、[9] user.* xattr 往返。另以 setpriv --reuid=20001006（无 passwd 条目，等价真机条件）复跑：补丁 0001 时 6 PASS/25 FAIL，0001+0002 时 12/12 PASS"
test_commands:
  - "test_package/test_metastore.sh（9 组 / 12 条消费者断言，全部 PASS）"

artifacts:
  - bin/metastore
  - share/man/man1/metastore.1
  - share/doc/metastore/README
  - share/doc/metastore/NEWS
  - share/doc/metastore/AUTHORS
  - share/doc/metastore/FILEFORMAT
  - share/doc/metastore/metastore.txt
  - licenses/LICENSE.GPLv2

patches_applied:
  - "0001-strmode-shim-drop-libbsd.patch（树内 strmode(3) 等价实现 + 摘除 -lbsd；不裁剪任何功能）"
  - "0002-numeric-uid-fallback-when-passwd-db-has-no-entry.patch（HarmonyOS 无应用 uid 的 passwd/group 条目时回落数字 uid，否则全工具空操作；纯 POSIX，无平台宏）"
  - "0003-read-xattr-with-a-real-buffer-and-skip-unreadable.patch（HMDFS 拒绝 getxattr NULL 尺寸探测 EINVAL；改为真实缓冲区 + ERANGE 增长，单属性读失败改为跳过而非中止整条记录；纯 POSIX，无平台宏）"
