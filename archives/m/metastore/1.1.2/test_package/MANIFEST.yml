# test_package/MANIFEST.yml — metastore 1.1.2
#
# R51 upstream-test accounting for metastore 1.1.2: the inventory below is
# empty on purpose and that is a measured result, not an omission.
#   * the tarball has 27 entries (22 regular files + 5 directories) and no
#     tests/ directory
#   * the Makefile wires no `check`/`test` target: its .PHONY set is
#     all bins libs strip strip-bins strips-libs install install-bins
#     install-libs install-includes install-configs install-docs
#     install-mans install-shares uninstall* clean distclean dep printvars
#   * no ctest/pytest/meson test registration exists anywhere in the tree
# Upstream therefore has no runnable test program to port; the executable is
# a plain filesystem tool with no library API.

package: metastore/1.1.2
homepage: "https://github.com/przemoc/metastore"

upstream_check_command: "无——上游 Makefile 的 .PHONY 目标里没有 check/test，源码树也没有 tests/ 目录，无 ctest/pytest 注册"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:  # 9 组 / 12 条断言；其中带【鸿蒙特有】的为 3 组：⑧、⑧b、⑨
  - file: test_metastore.sh
    description: "消费者测试：真实执行打包产物 bin/metastore，9 组共 12 条断言。① 断言 [1] runenv PATH 可解析打包二进制（**计入** 12 条之一；脚本顶部另有一个 `exit 1` 硬守卫做同样的 PATH 检查，那个守卫不计断言）；② --version 输出构建期烘焙的 v1.1.2（覆盖 version.sh→NEWS 回退→-DMETASTORE_VER 整条链）；③ 无参调用打印 Usage 且非零退出；④ getopt 错误路径：非法选项 -Z 与 --empty-dirs 缺 --apply 均被拒绝；⑤ 权限往返：--save 产出非空 metafile，改乱 mode 后 --apply 复原（用 ls -ld 独立读回，不依赖被测工具）；⑥ mtime 往返：--mtime 保存、改写、复原（date -r 读回）；（⑤ 的权限往返刻意**先 chmod 再 ls -ld 读回文件系统真正授予的 mode** 再断言复原值；当文件系统不授予 other(3) 位或 setuid/setgid/sticky 时，⑤ 整体 SKIP、⑧b 把未授予的分支如实标为 unverifiable —— 真机沙箱会抹掉这些位，拿 chmod 的请求值当事实就是在测文件系统策略而非 metastore）；⑦ --compare 能发现 mode 漂移；⑧【鸿蒙特有】把 in-tree strmode(3) shim 的 --dump mode 列与 ls -ld 逐条对拍（逐条对拍，计 1 组）（覆盖 -/d/l/p 四种文件类型与 setuid s/setuid-noexec S/setgid s/sticky t 四个特殊位分支，共 >=8 条），并对每条**逐字节**断言 mode 字段恰为 11 字节（1 类型 + 9 权限 + 1 ACL 占位符）——awk 以 TAB 分隔字段正是为了让这个尾部 ACL 字节不被空白折叠吃掉，否则 shim 少写该字节将无法被检出；⑧b【鸿蒙特有】特殊位字形钉死：-rwsr-xr-x / -rwSr--r-- / drwxr-sr-x / drwxrwxrwt（独立于 ⑧ 的第 2 组，逐个先确认文件系统真的授予了该位再断言字形，未授予的分支如实计为 unverifiable）；⑨【鸿蒙特有】user.* 扩展属性往返：setxattr→--save→removexattr→--apply 复原，验证 OHOS <sys/xattr.h> 家族调用链（文件系统或工具不支持时显式 SKIP 并打印原因，绝不静默通过）"
    command: "bash test_metastore.sh"

# 12 条计数断言 = [1] [2] [3] [4] [4b] [5a] [5b] [6] [7] [8] [8b] [9]
#   [1] 是计数断言（ok() 调用）；脚本顶部还有一个同主题的 `exit 1` 硬守卫，那个不计入。
#   [5] 只在第 ⑤ 组失败时触发（--save 失败/空 metafile），成功路径发出的是 [5a]/[5b]。
#   9 组 = ②③④⑤⑥⑦⑧⑧b⑨，即 12 条断言按主题归并后的组数。
#   实测口径（本地同源门禁 + CI）：consumer assertions: 12 run, 12 PASS, 0 FAIL, 0 SKIP
assertion_count: 12
group_count: 9

