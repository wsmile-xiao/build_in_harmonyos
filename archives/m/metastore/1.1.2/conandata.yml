# conandata.yml — metastore 1.1.2
#
# R39 (official source): the v1.1.2 GitHub *release* only carries the
# detached signature metastore-1.1.2.tar.gz.asc — the tarball itself was
# never uploaded (verified against the release API: assets = [".asc"]).  The
# authoritative official source for this exact version is therefore the
# repository tag archive below.
#
# Byte-identity cross-check: this tarball is bit-for-bit identical to the
# Debian upstream orig tarball
#   http://deb.debian.org/debian/pool/main/m/metastore/metastore_1.1.2.orig.tar.gz
# (both sha256 6e09b96f...), which is how Debian ships metastore 1.1.2-1
# through stable/trixie/sid.  Two independent authorities agree on the hash.
#
# sha256 measured directly on the downloaded tarball.

sources:
  url: "https://github.com/przemoc/metastore/archive/refs/tags/v1.1.2.tar.gz"
  sha256: "6e09b96f663665caae07cfff1a455674b2d35151c140ea9b25046b77836b2686"

patches:
  - patch_file: "patches/0001-strmode-shim-drop-libbsd.patch"
    strip: 1
    patch_description: "metaentry.c carries an in-tree strmode(3) (BSD mode-string formatter, guarded by the conventional HAVE_STRMODE, byte-for-byte behavioural copy of libbsd/OpenBSD) so the tree builds without libbsd; the Makefile's -lbsd in metastore_DLIBS is dropped with it. strmode is the program's ONLY libbsd import (single call at src/metaentry.c:656, rendering the --dump mode column). On OHOS <bsd/string.h> does not exist and musl leaves the symbol undefined (nm on the OHOS libc.so: no strmode), while strlcpy/strlcat — the pair the -lbsd line was nominally for — are already defined by musl, so nothing is left for the library to satisfy. No platform macro is used."
    patch_type: "portability"
  - patch_file: "patches/0002-numeric-uid-fallback-when-passwd-db-has-no-entry.patch"
    strip: 1
    patch_description: "HarmonyOS has no passwd/group DB entry for application uids (e.g. 20001006), so getpwuid(3)/getgrgid(3) legitimately return NULL. Upstream treats that as fatal for the whole metaentry (mentry_create returns NULL), which on this platform makes save/compare/dump/apply all no-ops for every file the process can see. Fall back to the numeric id and teach the apply path to accept that decimal form back, the same numeric-owner convention tar(1) offers. Purely POSIX: the decision is driven by 'does the database have this id', never by platform, so a host with a complete passwd DB is bit-for-bit unchanged. No platform macro is used."
    patch_type: "portability"
  - patch_file: "patches/0003-read-xattr-with-a-real-buffer-and-skip-unreadable.patch"
    strip: 1
    patch_description: "HMDFS rejects the POSIX NULL-size query getxattr(path, attr, NULL, 0) with EINVAL even though listxattr() reports the name, and upstream treats any single unreadable attribute as fatal for the whole entry (mentry_create returns NULL), so one bad name silently costs the file its mode, mtime and every other attribute -- observed on device as 'getxattr failed for ./tree: Invalid argument' plus an 18-byte metafile (header only, zero entries). Read each attribute with a real buffer and grow it on ERANGE, and turn a still-unreadable attribute into a reported skip rather than an abort; the metafile then records the count actually read. No platform macro: the NULL-size probe is simply treated as advisory."
    patch_type: "portability"
