# conandata.yml — mpsolve 3.2.3
#
# 上游 3.2.3 没有 GitHub tag（robol/MPSolve 最新 tag 停在 3.2.1），官方发布物
# 是比萨数值分析组项目页上的 make dist tarball；Debian 的
# mpsolve_3.2.3.orig.tar.bz2 即取自该 tarball。该 tarball 自带生成的
# configure / Makefile.in / aclocal.m4，无需 autoreconf 引导。
# 官方原始 URL，不手工追加镜像前缀（CI 的 build_and_test.sh 自行注入 fallback）。
#
# 3.2.1 的补丁（0001-mps-mpc-register-keyword，C++17 移除 register 关键字）已被
# 上游在新版自行修掉，照搬必然 apply 失败，故不再携带。改带两条**平台适配**补丁：
# 该 tarball 的 config.guess / config.sub 是 autoconf 2.71 一代的快照
# （config.sub timestamp 2022-01-03），不认识 HarmonyOS / linux-ohos 三元组。

sources:
  url: "https://numpi.dm.unipi.it/wp-content/uploads/2025/08/mpsolve-3.2.3.tar.bz2"
  sha256: "1f2e239c698c783b63a5e6903e76316c0335a01d71c466a8551e8a3f790b3971"

patches:
  - patch_file: "patches/0001-config.guess-ohos.patch"
    patch_description: "Teach config.guess the HarmonyOS case so it reports aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-ohos.patch"
    patch_description: "Teach config.sub the linux-ohos triplet: ohos-linux mapping + ohos* in the OS list + linux-ohos* in the kernel-OS list"
    patch_type: "portability"
