# 版本级 manifest — mpsolve 3.2.3
# 遵循 ARCHIVE-SPEC v3.0

version: "3.2.3"
software: "mpsolve"

status: built
build_date: "2026-09-20"
build_system: autotools

source:
  url: "https://numpi.dm.unipi.it/wp-content/uploads/2025/08/mpsolve-3.2.3.tar.bz2"
  sha256: "1f2e239c698c783b63a5e6903e76316c0335a01d71c466a8551e8a3f790b3971"
  tar_format: tar.bz2
  provenance: "上游 3.2.3 无 GitHub tag（robol/MPSolve 最新 tag 停在 3.2.1）；官方发布物是比萨数值分析组项目页的 make dist tarball，Debian mpsolve_3.2.3.orig.tar.bz2 即取自它"

build:
  system: autotools
  configure_options:
    - "直接使用 tarball 自带的生成版 configure —— 无 autoreconf / automake / libtool tool_requires，也无 OHOS ELF 启动器（与 3.2.1 的关键差异）"
    - "三元组由补丁后的 config.guess 自行猜出（aarch64-unknown-linux-ohos），配方**不传** --build/--host：显式给一对三元组会被 configure 认作交叉编译，AC_RUN_IFELSE 一类运行时探测整体跳过、config.h 退回保守默认值（P-AUTOTOOLS-001 / E007）"
    - "--disable-ui --disable-graphical-debugger --disable-documentation --disable-examples --disable-tcmalloc"
    - "GMP_CFLAGS/GMP_LIBS 内联注入（GMP_LIBS 含 -lgmpxx：libmps formal 模块无条件使用 mpq_class）"
    - "configure/make 全部经 env -u CONFIG_SHELL SHELL=/bin/sh 路由；make -j1"
    - "make -C src check：src/tests 16 个 check(3) 程序，TEMP 重定向至可写目录（/tmp 只读）+ LD_LIBRARY_PATH 补 libgmpxx/libcheck"
  dependencies:
    - gmp/6.3.0.1
    - check/0.15.2
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-config.guess-ohos.patch — config.guess 补 HarmonyOS 分支，原生构建时猜出 aarch64-unknown-linux-ohos（E007）"
  - "patches/0002-config.sub-ohos.patch — config.sub 三处：ohos-linux 映射 + OS 列表加 ohos* + 内核-OS 校验表加 linux-ohos*（末处缺一不可，见 knowledge_gained）"

knowledge_gained:
  - "3.2.3 的官方发布物是 make dist tarball（无 GitHub tag 可 pin），它自带生成的 configure/Makefile.in/aclocal.m4——构建系统从'需 autoreconf 引导'变为'零引导'，配套的 autoconf/automake/libtool tool_requires 与 OHOS ELF 启动器整套绕行全部消失；但'自带 configure'不等于'自带认得出鸿蒙的 configure'，config.guess/config.sub 仍须补"
  - "config.sub 认 linux-ohos 三元组需要**两处**同时改：OS 类型列表（否则报 OS `ohos' not recognized）与内核-OS 校验表（否则报 Kernel `linux' not known to work with OS `ohos'）。只改前者会在下一道校验再次失败"
  - "scripts/patch-autotools-ohos.pl 在新一代 config.sub（autoconf 2.70+ 的 case $kernel-$os 结构）上会**静默漏掉内核-OS 那处**：它先插入 basic_os=linux-ohos，再用整文件子串 /linux-ohos/ 作为下一处的守卫，刚插入的字符串把守卫顶成真 ⇒ skip；而它自己的自检同样是整文件 /linux-ohos/ 匹配，于是照样打印 ✅ Score 4/5。判据只能是把补丁后的 config.sub 真跑一遍（sh config.sub aarch64-unknown-linux-ohos）"
  - "本 tarball 里的 config.sub timestamp=2022-01-03，其 maybe_os 分支已含 linux-*，故 `aarch64-unknown-linux-ohos`（4 段）走的是 basic_os=$field3-$field4 直取路径——这正是 patch 脚本按'3 段输入'写的 §3.1 补丁在这类 config.sub 上不起作用、而内核-OS 校验反而变成必守关口的原因"
  - "**不要用 --build/--host 绕 config.guess**（P-AUTOTOOLS-001 / E007）：显式 `--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos` 让 configure 把自己当成交叉编译，AC_RUN_IFELSE 一类运行时探测全部跳过，config.h 退回保守默认。正解是补 config.guess/config.sub 后让 configure 自己猜出与 build 相同的 host"
  - "3.2.1 的补丁 0001（mps/mpc.h 里的 register 关键字）在 3.2.3 已成死补丁：上游自己改掉了，照搬会造成 patch 无法 apply；但'上一版的补丁失效'推不出'本版不需要任何补丁'——平台适配补丁（config.guess/config.sub）在每个版本都必须在场"
  - "gmp/6.3.0.1 是 CXX 构建（--enable-cxx，带 libgmpxx/gmpxx.h）；libmps 的 formal 模块无条件使用 mpq_class，必须配 6.3.0.1 而非 6.3.0"
  - "src/tests/Makefile.am 的 check_PROGRAMS = TESTS 共 16 个；automake 的 test-suite.log 汇总 # TOTAL 即 16"
  - "automake 并行测试框架把 SKIP 计入 TOTAL：只看 make check 退出码会把'大半 SKIP'当全绿，必须回读 test-suite.log 汇总块（FAIL/ERROR/SKIP/XPASS 非零即失败，TOTAL < 16 亦失败）"
  - "check 框架 IPC 临时文件按 TEMP→P_tmpdir(/tmp)→TMPDIR→. 取路径，OHOS /tmp 只读需 TEMP 重定向（picotcp 同款）"
  - "设备 hnp bash getcwd 缺陷：全部 configure/make 经 env -u CONFIG_SHELL SHELL=/bin/sh 路由（§12.49）"
  - "autoconf 生成的 configure 中 `umask 077 && mktemp -d` 造出的 0700 临时目录包在 HMDFS 上连属主都不写：需在 build() 里改写生成物摘掉 umask 077（E114）"
  - "mpsolve CLI 没有 --version（该入参落进 usage 分支）：版本握手是 `-v`，输出恰好一行 `MPSolve <ver>`"
  - "上游 make check 只 link ${top_builddir}/src/libmps/libmpsprivate.la，从不执行安装出来的 bin/mpsolve——CLI 的批处理/输出格式行为在上游完全无覆盖，由 test_package 补"
  - "-O f（full output）与 -o digits 是两个正交旋钮：-O f 决定打印多少位有效数字（默认 14 位 → full 21 位），-o digits（保证位数）决定 Status（Approximated → Isolated）"

build_notes:
  - "本地宿主（x86_64 Linux）按配方参数复跑：configure rc=0 / make rc=0（0 error）/ make -C src check rc=0 且 TOTAL:16 PASS:16 FAIL:0 SKIP:0 / install rc=0"
  - "三元组链路的宿主侧离线复现：把 uname 换成 `-s HarmonyOS / -m aarch64` 的桩，两条补丁后的 config.guess 输出 aarch64-unknown-linux-ohos，config.sub 也照收；再以**不带 --build/--host** 的同一组参数跑真实 configure → `checking build system type... aarch64-unknown-linux-ohos` / `checking host system type... aarch64-unknown-linux-ohos`，libtool(LT_INIT) 一并通过并生成 config.status，make/make check 全绿。这同时把 patch-autotools-ohos.pl 漏补内核-OS 那处的情形钉成反例"
  - "安装树：bin/mpsolve、include/mps/*、lib/libmps.so{,.3,.3.0.1} + libmps.a + libmps.la、lib/python3.10/site-packages/mpsolve.py"
