# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mpsolve/3.2.3
homepage: "https://github.com/robol/MPSolve"

# 上游测试形态：autotools + check(3)。
#   src/tests/Makefile.am:
#     if CHECK
#     check_PROGRAMS = check_convex check_context check_mpc check_matrix check_dpe \
#         check_formal check_multithread check_cluster check_chebyshev check_parser \
#         check_utils check_monomial_poly check_list check_secsolve check_unisolve \
#         check_version
#     TESTS = $(check_PROGRAMS)
# 共 16 个测试程序（check/0.15.2 由 PKG_CHECK_MODULES([CHECK], [check >= 0.9.4]) 检出后
# 该 if 分支才成立）。套件全部 link ${top_builddir}/src/libmps/libmpsprivate.la，
# 测的是 libmps 的 C API，**从不执行安装树里的 bin/mpsolve**。
upstream_check_command: "make -C src check"
upstream_test_in_build: true
upstream_test_command: "make -C src check（src/tests/，16 个 check(3) 程序，TESTS=$(check_PROGRAMS)）"

upstream_tests:
  - file: src/tests/Makefile.am
    description: "check_PROGRAMS = TESTS，共 16 个测试程序；用例级 START_TEST 声明 90 处（分布于其中 15 个程序，check_multithread.c 为 0），88 处经 tcase_add_test 注册进 Suite"
    command: "make -C src check"
    expected: "TOTAL 16 / PASS 16 / FAIL 0 / SKIP 0 / ERROR 0（automake test-suite.log 汇总块）"
  - file: examples/
    description: "示例程序（高级语言绑定）"
    command: ""
    expected: "平台受限：配方 --disable-examples 显式关闭（非测试入口）"

# test_package 中自带的测试（消费者视角，真实执行安装出来的二进制）
# 上游 16 个 check 程序只链 libmpsprivate、不执行 CLI，故 CLI 这一层在上游完全无覆盖。
test_package_tests:
  - file: test_package/smoke_mpsolve.sh
    description: "10 条断言，3 组：A 版本握手与批处理基本路径（-v 恒等于 `MPSolve 3.2.3`；默认跑 x^2-2 退出 0 且两个根 ±0.1414213…e1 都在）；B 输出格式旋钮 -O f（先反向验证默认输出既无 16 位以上有效数字也无 Status 行，再断言 -O f 两者都有 —— 反向验证保证正向断言不是永真）；C 退化环境（无 tty / 无 DISPLAY / HOME 未设 / TEMP 与 TMPDIR 指向不存在的目录）下仍退出 0 且两个根都在"
    command: "sh smoke_mpsolve.sh <prefix>/bin/mpsolve"
  - file: test_package/conanfile.py
    description: "测试驱动：VirtualRunEnv 注入包 lib/ 到 LD_LIBRARY_PATH（OHOS musl 加载器无 glibc 那种兜底搜索路径，libmps.so.3 只能从包内 lib/ 解析），然后 self.run() 真实执行被测二进制"
    command: "conan test"

# 平台特有测试：OHOS 上无桌面栈 + HMFS 只读临时目录时的 CLI 运行形态
platform_specific_tests:
  - description: "鸿蒙特有：安装出来的 bin/mpsolve 在无 tty（stdin/stdout 皆管道）、无 DISPLAY、HOME 未设、TEMP/TMPDIR 指向不存在目录的条件下必须静默退化 —— 退出码 0 且仍输出两个正确根。上游 make check 的 check 框架反而**要求**可写 TEMP（其 IPC 临时文件按 TEMP→P_tmpdir(/tmp)→TMPDIR→. 取路径），在 OHOS 的 HMFS 只读 /tmp 上会失败，所以这条路径上游既没覆盖也不等价"
    command: "sh smoke_mpsolve.sh <prefix>/bin/mpsolve（C 组）"

# 断言总数：
#   test_package/smoke_mpsolve.sh 内 10 条（A1-A4 / B1-B3 / C1-C3）
# = 10
assertion_count: 10
