# 版本级 manifest — mpsolve 3.2.1
# 遵循 ARCHIVE-SPEC v2.0

version: "3.2.1"
software: "mpsolve"

status: built
build_date: "2026-09-17"
build_system: autotools

source:
  url: "https://github.com/robol/MPSolve/archive/refs/tags/3.2.1.tar.gz"
  sha256: "7edb7899d69a3e09848b893b12f360b8a83429a18eee4a7f193fcfc8692dca71"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "autoreconf -fi（GitHub tag tarball 无 configure）+ ACLOCAL_PATH 注入 pkg.m4"
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos"
    - "--disable-ui --disable-graphical-debugger --disable-documentation --disable-examples --disable-tcmalloc"
    - "GMP_CFLAGS/GMP_LIBS 内联注入（GMP_LIBS 含 -lgmpxx：libmps formal 模块需要 GMP C++ 绑定）"
    - "make check：src/tests 15 个 check(3) 程序，TEMP 重定向至可写目录（/tmp 只读）"
  dependencies:
    - gmp/6.3.0.1
    - check/0.15.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-mps-mpc-register-keyword.patch"

knowledge_gained:
  - "gmp/6.3.0.1 是 CXX 构建（--enable-cxx，带 libgmpxx/gmpxx.h）；libmps 的 formal 模块无条件使用 mpq_class，必须配 6.3.0.1 而非 6.3.0"
  - "本任务为 randmac/strcase 之外第二个'依赖拖拽链'：mpsolve 依赖 gmp 的 C++ 组件"
  - "GitHub tag tarball 无 configure 且缺 pkg.m4：autoreconf -fi 需 ACLOCAL_PATH 指向 pkg-config 的 share/aclocal"
  - "C++17 移除 register 关键字：内置旧 mpc.h 需一行补丁"
  - "check 框架 IPC 临时文件：TEMP→P_tmpdir(/tmp)→TMPDIR→. 优先级，OHOS /tmp 只读需 TEMP 重定向（picotcp 同款）"
  - "设备 hnp bash getcwd 缺陷：全部 configure/make 经 env -u CONFIG_SHELL SHELL=/bin/sh 路由（§12.49）"
  - "autoconf 生成的 configure 中 umask 077 临时目录包裹在 HMDFS 上不可写：sed 生成物为 umask 022（E011 受控方案）"
