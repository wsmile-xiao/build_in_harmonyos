package: mpsolve/3.2.1
homepage: "https://github.com/robol/MPSolve"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check（src/tests/：15 个 check(3) 程序，TESTS=$(check_PROGRAMS)）"

upstream_tests:
  - name: check 套件（src/tests/check_*.c/.cpp）
    command: "make check"
    expected: "pass"
  - name: examples（--disable-examples 关闭）
    command: ""
    expected: "平台受限：示例依赖额外语言绑定/库，配方显式关闭（非测试入口）"

test_package_tests:
  - file: smoke_mpsolve.sh
