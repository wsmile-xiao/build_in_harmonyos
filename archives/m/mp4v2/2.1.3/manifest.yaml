software: mp4v2
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/mp4v2/mp4v2-2.1.3.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0008-cmake-3.5-compatibility.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E011: HMDFS umask 077 导致 config.status 临时目录不可写，需 sed -i 's/umask 077/umask 022/g' configure"
  - "mp4v2 tarball 不含 configure 脚本，需要 autoreconf -fi 先生成"
  - "make check 需要 DejaGnu（runtest），当前环境不可用"

patch_generation:
  method: manual-unified-diff
  patches_count: 1

patch_classification:
  - file: 0008-cmake-3.5-compatibility.patch
    type: compatibility
    platform_only: False
    guard: none
    desc: "Raise the CMake minimum version for current toolchain compatibility"
