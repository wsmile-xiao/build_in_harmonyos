  - "E011: HMDFS umask 077 导致 config.status 临时目录不可写，需 sed -i 's/umask 077/umask 022/g' configure"
  - "mp4v2 tarball 不含 configure 脚本，需要 autoreconf -fi 先生成"
  - "make check 需要 DejaGnu（runtest），当前环境不可用"

