# test_package/MANIFEST.yml — mcqd 1.0.0
# Upstream and consumer test declaration required by CI L0e.

package: mcqd/1.0.0
homepage: "https://gitlab.com/janezkonc/mcqd"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "mcqd-v1.0.0.tar.gz (official GitLab tag v1.0.0 archive)"
  source_sha256: "37ff68ff88e047c929990d4c12ce474753f6f9c49324661a3aa1cfe77c26ad9d"
  build_system: "custom (no build system; header-only mcqd.h plus example driver mcqd.cpp)"
  test_definition: >
    Upstream ships no test framework. The only executable verification is the
    example driver mcqd.cpp, which loads the DIMACS graph test.clq and runs
    two scenarios back to back: Example 1 Maxclique::mcq() and Example 2
    Maxclique::mcqdyn(). Each scenario prints a "Size = N" line on success.
    The recipe compiles mcqd.cpp and runs it on test.clq inside build();
    counting unit is the example scenario (2 total).
  dependency: "none (only a C++ compiler and the bundled test.clq fixture)"
  portability_changes: []
  examples_note: >
    test.clq (655 vertices, DIMACS edge list) is bundled in the upstream
    tarball and used verbatim; no fixture transformation is applied.

upstream_check_command: "cxx -O2 -std=c++17 mcqd.cpp -o mcqd_upstream && ./mcqd_upstream test.clq"
upstream_test_in_build: true
upstream_test_command: "mcqd test.clq (Example 1 mcq + Example 2 mcqdyn)"

upstream_tests:
  - test_name: "Example 1 mcq"
    source: "mcqd.cpp (main, first half)"
    kind: example
    command: "./mcqd_upstream test.clq"
    description: "Run Maxclique::mcq() with improved coloring on test.clq, expect Size line"
  - test_name: "Example 2 mcqdyn"
    source: "mcqd.cpp (main, second half)"
    kind: example
    command: "./mcqd_upstream test.clq"
    description: "Run Maxclique::mcqdyn() with dynamic ordering on test.clq, expect Size line"

upstream_test_total: 2
upstream_test_count_method: "auto"
upstream_test_count_note: "Single custom example driver with two sequential scenarios; discovered=2 from mcqd.cpp main(), executed/passed parsed from Size lines in upstream_test.log"
upstream_test_passed: 2
upstream_test_failed: 0

test_package_tests:
  - file: test_mcqd.cpp
    scenario: "consumer-api"
    description: "Build and run a Conan consumer that constructs a 4-node triangle graph and verifies Maxclique::mcq() size/validity/steps plus Maxclique::mcqdyn() size/validity/steps"
    command: "./test_mcqd"
    assertions: 6

assertion_count: 6
