# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试 — 从最终 Conan 包使用公共头 mpfrcx.h 与库，覆盖复数高精度多项式加减乘、精度控制（set_prec 128↔256 及重置语义）、实部提取、复数点求值、零多项式与常多项式边界输入（24 组断言）"
    command: "ctest --output-on-failure"
  - file: ohos_special_test.cpp
    description: "鸿蒙特有测试 — 包产物 ELF64/LE/AArch64 检查、静态库 ar 魔数、宿主绝对路径(/storage,/home,/tmp)泄漏扫描、__OHOS__ 宏验证，并在设备上真实执行 256-bit 复数多项式求值与实部多项式运算（8 组断言）"
    command: "ctest --output-on-failure"

# 测试断言总数：消费者测试 24 + 鸿蒙特有 8 = 32（不含上游 19 个测试程序内部的断言）
assertion_count: 32
