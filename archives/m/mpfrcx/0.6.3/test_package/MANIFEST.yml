# test_package/MANIFEST.yml — mpfrcx 0.6.3
# 上游官方测试声明文件（CI L0e 强制要求）

package: mpfrcx/0.6.3
homepage: "https://gitlab.inria.fr/mpfrcx/mpfrcx"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游正式测试：tests/Makefile.am 的 TESTS = $(check_PROGRAMS)，共 19 个
# 测试程序（7 个 mpcx 复数版 + 7 个 mpfrx 实数版 + eval/tower 4 个 +
# tget_version 1 个），由配方 build() 中的 make check 实际运行。
