version: "0.6.3"
status: "ok"
blocker: ""
issue: ""

source:
  url: "https://www.multiprecision.org/downloads/mpfrcx-0.6.3.tar.gz"
  sha256: "9da9b3614c0a3e00e6ed2b82fc935d1c838d97074dc59cb388f8fafbe3db8594"
  tar_format: tar.gz

build:
  system: autotools
  conan_recipe: true
  dependencies:
    - gmp/6.3.0
    - mpfr/4.2.2
    - mpc/1.3.1
  configure_options:
    - "--with-pic"
    - "--enable-static --disable-shared by default"
    - "--with-gmp=<staged gmp prefix>"
    - "--with-mpfr=<staged mpfr prefix>"
    - "--with-mpc=<staged mpc prefix>"
  upstream_test: "make check -j1"
  ohos_notes:
    - "Stage gmp/mpfr/mpc include and lib files under the build generators folder on OHOS, excluding .la files, to avoid libtool following dependency_libs paths from dependency packages."
    - "Use TMPDIR under $HOME/tmp and patch configure's mktemp umask to 022 because HarmonyOS user storage denies writes inside mktemp directories created with umask 077."

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0003-configure-tmpdir.patch"

test_package:
  type: cmake
  source: "test_package/test.c"
  checks:
    - "mpcx_init"
    - "mpcx_set_deg"
    - "mpcx_set_coeff"
    - "mpcx_add"
    - "mpcx_sub"
    - "mpcx_mul"
    - "mpcx_eval"
    - "mpfrx_init"
    - "mpfrx_set_coeff"
    - "mpfrcx_real"
    - "mpfrcx_imag"

w0_dependency_check:
  ohpcd:
    gmp: "present: gmp/6.3.0"
    mpfr: "present: mpfr/4.2.2"
    mpc: "present: mpc/1.3.1"
  decision: "All three dependencies are already packaged; proceed with mpfrcx single-package build validation."

notes:
  - "MPFRCX 0.6.3 uses Autotools; library is built in src/ as libmpfrcx.la and installed as an archive with headers."
  - "Upstream check target is tests/Makefile.am TESTS = $(check_PROGRAMS) with 17 test programs."
  - "Upstream --with-gmp/--with-mpfr/--with-mpc each take a single DIR argument that adds -I DIR/include and -L DIR/lib."
