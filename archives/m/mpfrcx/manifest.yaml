software: mpfrcx
display: "MPFRCX"
description: "Library for the arithmetic of univariate polynomials over arbitrary precision real (MPFR) or complex (MPC) numbers"
category: math
homepage: "https://gitlab.inria.fr/mpfrcx/mpfrcx"
license: LGPL-3.0-or-later
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "需要修复 config.guess 和 config.sub 以支持 ohos 三元组"
    - "configure 和 config.status 的临时目录创建需要修改为可写路径（umask 022 + TMPDIR）"
    - "依赖 gmp、mpfr、mpc，configure 使用 --with-gmp=DIR / --with-mpfr=DIR / --with-mpc=DIR 传递依赖前缀"
    - "OHOS 上需要把依赖包的 include/lib 预置到构建目录并剔除 .la 文件，避免 libtool 追随 dependency_libs 里的错误路径"
  common_dependencies:
    - gmp
    - mpfr
    - mpc

# 版本索引
versions:
  "0.6.3":
    status: "ok"
    build_date: "2026-09-09"
    notes: "OHOS aarch64 适配完成；上游 19/19 PASS；消费者测试 24 断言、鸿蒙特有测试 8 断言全过；无新增知识（路径 A）"
