# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求此文件存在）

package: mpd/0.24.12
homepage: "https://www.musicpd.org"

# 上游测试命令（meson test，18 个 test() 注册，本配置 16 个注册）
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -j4 -t 10"

# 上游实际运行的测试套件（本地目标机实测 16/16 Ok，2026-10-01；
# 未注册 2 个：test_archive_iso9660（libiso9660 未发布）/
# test_archive_zzip（zip 未发布）——上游环境依赖，非适配缺陷）
upstream_tests:
  - file: test/time/TestTime.cxx
    source: mpd-0.24.12/test/time
    description: "TestTime — 时间工具测试"
    command: "meson test mpd:TestTime"
  - file: test/util/TestUtil.cxx
    source: mpd-0.24.12/test/util
    description: "TestUtil — 最大单套件（17 源文件，55 用例）"
    command: "meson test mpd:TestUtil"
  - file: test/net/TestNet.cxx
    source: mpd-0.24.12/test/net
    description: "TestNet — 网络协议测试（tcp/local_socket 裁剪）"
    command: "meson test mpd:TestNet"
  - file: test/tag/TestMixRamp.cxx
    source: mpd-0.24.12/test/tag
    description: "TestMixRamp — 混音 ramp 测试"
    command: "meson test mpd:TestMixRamp"
  - file: test/TestRewindInputStream.cxx
    source: mpd-0.24.12/test
    description: "TestRewindInputStream — 回退输入流测试"
    command: "meson test mpd:TestRewindInputStream"
  - file: test/test_protocol.cxx
    source: mpd-0.24.12/test
    description: "test_protocol — 命令协议 ArgParser 测试"
    command: "meson test mpd:test_protocol"
  - file: test/test_queue_priority.cxx
    source: mpd-0.24.12/test
    description: "test_queue_priority — 队列优先级测试"
    command: "meson test mpd:test_queue_priority"
  - file: test/test_translate_song.cxx
    source: mpd-0.24.12/test
    description: "test_translate_song — 歌曲 URI 转换测试（database 门控）"
    command: "meson test mpd:test_translate_song"
  - file: test/playlist/TestPlaylistPlugins.cxx
    source: mpd-0.24.12/test/playlist
    description: "TestPlaylistPlugins — 播放列表插件测试"
    command: "meson test mpd:TestPlaylistPlugins"
  - file: test/TestIcu.cxx
    source: mpd-0.24.12/test
    description: "TestIcu — ICU Unicode 测试"
    command: "meson test mpd:TestIcu"
  - file: test/test_icy_parser.cxx
    source: mpd-0.24.12/test
    description: "test_icy_parser — ICY 流元数据解析（curl 门控）"
    command: "meson test mpd:test_icy_parser"
  - file: test/TestAudioFormat.cxx
    source: mpd-0.24.12/test
    description: "test_pcm — PCM 音频格式族（9 源文件）"
    command: "meson test mpd:test_pcm"
  - file: test/fs/TestFs.cxx
    source: mpd-0.24.12/test/fs
    description: "TestFs — 文件系统工具测试"
    command: "meson test mpd:TestFs"
  - file: test/fs/TestParsePath.cxx
    source: mpd-0.24.12/test/fs
    description: "TestParsePath — 路径解析测试"
    command: "meson test mpd:TestParsePath"
  - file: test/TestSongFilter.cxx
    source: mpd-0.24.12/test
    description: "TestSongFilter — 歌曲过滤器测试（TestStringFilter+TestTagSongFilter）"
    command: "meson test mpd:TestSongFilter"
  - file: test/test_archive_bzip2.sh
    source: mpd-0.24.12/test
    description: "test_archive_bzip2 — .bz2 档案读取往返（bzip2 程序 + libbz2，shell 型套件）"
    command: "meson test mpd:test_archive_bzip2"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_mpd.sh
    description: "消费者测试 C1-C4：mpd --version 版本信息 / 配置解析+启动+协议握手+曲库导入（wav 扫描）/ 解码后端初始化（run_decoder ffmpeg wav）/ 播放闭环（null 输出 + play→stop 状态机）"
    command: "conan test"

# 测试统计（均为实测口径，统计方法见 notes.md「验证结果」与 reports/test-report.md）
upstream_suites: 16            # meson test 注册 18，本配置 16（bzip2 点亮；iso9660/zzip 因 libiso9660/zip 未发布未注册）
upstream_test_cases: 170       # 15 个 gtest 套件内用例总数（[  OK  ] 行计数；bzip2 套件为 shell 型，不计 gtest）
test_package_assertions: 9     # test_mpd.sh C1-C4 断言项数（C1-C3 7 + C4 2：启动/play→stop 闭环）
