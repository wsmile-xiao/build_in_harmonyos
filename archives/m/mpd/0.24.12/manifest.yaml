software: mpd
version: 0.24.12
category: multimedia
status: built

build_system: meson
compiler: clang
linker: GNU ld

dependencies:
  fmt: 11.1.1
  glib2: 2.84.0

configure_options:
  - "meson setup builddir --prefix=$HOME/usr/local"
  - "-Dcurl=disabled"
  - "-Dsndio=disabled"
  - "-Dpipe=disabled"

build_notes:
  - meson.build 中 is_linux 检测需添加 harmonyos 支持
  - OHOS libcxx 不支持 std::make_unique_for_overwrite（需替换为 std::make_unique）
  - OHOS libcxx 不实现 <=> for std::chrono::time_point（需自定义比较器）
  - OHOS libcxx 限制 std::span range 构造函数（需放宽条件）
  - src/system/meson.build 中 Linux 检测需添加 harmonyos

artifacts:
  - mpd binary
  - libfmt headers
  - libfmt static library

source_url: https://github.com/MusicPlayerDaemon/MPD/archive/refs/tags/v0.24.12.tar.gz