# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS libcxx-ohos（LLVM 15.0.4 基线）缺 C++23 P2652 span-from-range / P2325 make_unique_for_overwrite / C++20 chrono time_point operator<=>：特征宏 __cpp_lib_span < 202306L / 等价 make_unique / 显式比较器（全部 portable 无平台宏）"
  - "fmt 11+ 精简 core.h 布局：format/to_string/join/print 移入 <fmt/format.h>，MPD 0.24.12 有 29 文件需头替换"
  - "meson 1.12 交叉构建：测试执行必须经 exe_wrapper，否则 meson test 全部 skip（exit 77，mtest.py complete_skip）；OHOS 目标机本机=目标机，identity wrapper + LD_LIBRARY_PATH 即可"
  - "meson 1.12.0 input_plugins 目标漏 alsa pkg-config cflags（可复现，直接 pkg-config --cflags alsa 正常）：交叉文件 [built-in options] 全局 -I 注入 workaround"
  - "PkgConfigDeps 缺陷与后处理：mad.pc/lame.pc prefix 指向 recipe 槽（路径不存在）；ffmpeg libav*.pc Version 写成 conan 包版本（6.1.6）与 MPD 版本约束（libavformat>=58.12 等）不匹配 → conanfile _fixup_pkgconfig 从 .so SONAME 取权威版本 + 7 个 shim 收口（icu-uc/icu-i18n/libcurl/gtest/gtest_main/gmock/gmock_main）"
  - "MPD 0.24 CLI 语义：主程序无 --config 选项（配置文件路径是位置参数）；新配置解析器格式 name \"value\"（无 = 号，= 触发 '\"' expected）；无 --decode-file（0.22 移除）；无原生 wave 解码器（wav 经 ffmpeg 插件 audio/wav 处理）"

