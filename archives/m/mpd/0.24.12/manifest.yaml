# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.24.12/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.24.12"

# 软件名
software: "mpd"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://www.musicpd.org/download/mpd/0.24/mpd-0.24.12.tar.xz"

  # 源码校验和
  sha256: "14223ca883c35fbf711994bcf745726cecc9d898e3d3964265cf3a2c7519a360"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表（meson setup 参数，与 conanfile.py build() 一致）
  configure_options:
    - "--cross-file=cross-ohos.ini（host_machine=linux/aarch64，[binaries] 绝对路径 HNP 编译器 + exe_wrapper）"
    - "--native-file=native-build.ini（GenParseName.cxx native:true 构建期代码生成器）"
    - "--wrap-mode=nodownload"
    - "--buildtype=release"
    - "-Ddefault_library=static"
    - "-Dalsa=enabled"
    - "-Djack=enabled"
    - "-Dsqlite=enabled"
    - "-Dzlib=enabled"
    - "-Dflac=enabled"
    - "-Dvorbis=enabled"
    - "-Dvorbisenc=enabled"
    - "-Dmad=enabled"
    - "-Dwavpack=enabled"
    - "-Dopus=enabled"
    - "-Dbzip2=enabled"
    - "-Dffmpeg=enabled"
    - "-Dicu=enabled"
    - "-Dtest=true"
    - "-Dshout=disabled"
    - "-Dao=disabled"
    - "-Doss=disabled"
    - "-Dpulse=disabled"
    - "-Dsndfile=disabled"
    - "-Dfaad=disabled"
    - "-Dinotify=false"

  # 编译依赖列表（格式: name/version，与 conanfile.py requirements() 一致）
  dependencies:
    - alsa-lib/1.2.16.1
    - jack/1.9.22
    - sqlite3/3.53.4
    - zlib/1.3.1.1
    - flac/1.5.0
    - vorbis/1.3.7
    - mad/0.16.4
    - wavpack/5.9.0
    - opus/1.5.2.1
    - ffmpeg/6.1.6
    - icu/76.1
    - fmt/12.2.0
    - libcurl/8.5.0
    - lame/4.0
    - gtest/1.17.0
    - gmock/1.17.0
    - bzip2/1.0.8          # 轮 B 新增：.bz2 档案解码（host 图版本，与 ffmpeg 传递一致）
    - bzip2/1.0.8.2        # 轮 B 新增：tool_requires，提供 bzip2 程序（test_archive_bzip2 套件）

  # 编译器
  cc: clang
  cxx: clang++

