# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: markdown/1.0.1
homepage: "https://daringfireball.net/projects/markdown/"

# Upstream test command
upstream_check_command: "make test"

# Upstream tests not run in build (Perl single-file tool; no bundled test suite)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_markdown.sh
    description: "Run markdown --version and verify Markdown→HTML conversion (<h1>)"

# Test assertion count
assertion_count: 2
