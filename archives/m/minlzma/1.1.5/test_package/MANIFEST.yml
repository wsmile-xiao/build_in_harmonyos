# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: minlzma/1.1.5
homepage: "https://github.com/ionescu007/minlzma"

# 上游测试命令：上游为 CMake 工程，未启用 CTest（ctest -N = 0 项），
# 无独立注册测试目标；README 文档化验证流程为生成噪声/空白样本 →
# Python LZMA 与 xzutils 压缩 → minlzdec 解压 → 哈希对比。
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（README 文档化验证流程，已在本轮实际执行：
# Python LZMA 路径 2/2 PASS；xzutils 路径 2/2 因 README 记载的上游限制
# ——minlzlib 不支持块头可选大小 VLI 元数据（现代 xz 默认 20 字节块头）
# ——失败，见 notes.md 台账）
upstream_tests:
  - file: README.md
    source: minlzma-1.1.5/README.md
    description: "README 文档化 Linux 验证流程：4MB 噪声/空白样本经 Python LZMA 与 xzutils 压缩后由 minlzdec 解压并对比 SHA-256"
    command: "minlzdec <input.xz> <output> && sha256sum 对比"

# test_package 中自带的测试（消费者视角验证，调用公共 API XzDecode）
test_package_tests:
  - file: test.c
    description: "消费者测试：内嵌 XZ 载荷，调用 XzDecode 查询大小并解压，校验内容与 CRC"
    command: "./test_minlzma"

# 测试断言总数
assertion_count: 4
