# 版本级 manifest — minlzma 1.1.5
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.5"

# 软件名
software: "minlzma"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源：ionescu007/minlzma 官方 tag v1.1.5）
  url: "https://github.com/ionescu007/minlzma/archive/refs/tags/v1.1.5.tar.gz"

  # 源码校验和（官方 tarball 实测 SHA-256）
  sha256: "49811637b6ad9e555a9e75b4a048cf3d1a92029de07e6b7bb360004eb61e655d"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（实际为 CMake 工程）
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（无外部依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁，纯 C11 直接编译通过）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 tag 名带 v 前缀（v1.1.5），conandata.yml 使用 refs/tags/1.1.5 会 404，必须用 refs/tags/v1.1.5"
  - "上游 CMake 无 install() 规则，库产物在 build 目录 minlzlib/ 子目录；package() 需显式源子目录 + keep_path=False"
  - "minlzlib 上游默认不定义 MINLZ_INTEGRITY_CHECKS，XZ 数据块 payload 损坏不触发解码失败；损坏 LZMA2 块控制字节（流偏移 24）可确定性触发失败"
  - "minlzlib 不支持 XZ 块头可选压缩/解压大小 VLI 元数据（README 记载限制），现代 xz 5.8.2 默认 20 字节块头解码失败，Python lzma / 7-zip 输出可用"

# ============================================================
# 测试信息
# ============================================================

tests:
  # 上游独立注册用例数（官方 tag 无 tests/、无 CTest 注册）
  source_declared_total: 0
  # 当前 OHOS 配置实例化的独立可执行用例数
  configured_executable_total: 0
  # 实际执行并通过数（注册用例口径）
  executed_passed_total: 0
  # 鸿蒙专项测试 + 消费者测试（conan create 内 CTest 2/2）
  ohos_tests_passed: 2
  ohos_tests_total: 2
  # 独立消费者用例
  consumer_case: "consumer.c 调用 XzDecode 解压 73 字节，内容校验通过 exit 0"
  test_report: "reports/conan-verify-report.md"