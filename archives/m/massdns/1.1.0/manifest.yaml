software: massdns
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# 构建系统类型
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/blechschmidt/massdns/archive/refs/tags/v1.1.0.tar.gz"

  # 源码校验和
  sha256: "93b14431496b358ee9f3a5b71bd9618fe4ff1af8c420267392164f7b2d949559"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=bfd"
    - "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=bfd"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS平台lld链接器因缺少libxml2.so.16无法工作，cmake项目需用 -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=bfd 替代 (knowledge_ref: E035-draft-2C5B)"
  - "CMakeLists.txt缺少install目标时，需手动install到staging目录（R20 DESTDIR模式） (knowledge_ref: E097)"
  - "非git仓库构建时，git describe --tags不可用，版本宏（MASSDNS_REVISION）未定义 (knowledge_ref: massdns-specific)"
  - "GitHub下载超时时，使用gh-proxy.com镜像可成功获取源码 (knowledge_ref: E017)"
  - "massdns无内置测试套件，需用真实DNS解析进行功能验证 (knowledge_ref: massdns-specific)"
