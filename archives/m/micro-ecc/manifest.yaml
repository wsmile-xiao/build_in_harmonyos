software: "micro-ecc"
display: "micro-ecc"
description: "Small and fast ECDH and ECDSA implementation for 8/32/64-bit processors"
category: library
homepage: "https://github.com/kmackay/micro-ecc"
license: BSD-2-Clause
build_system: custom
ohos_adaptation:
  key_points:
    - "Upstream ships C sources without a build system; compiled directly with clang (OHOS PC toolchain) and archived with llvm-ar as static libuecc.a."
    - "Platform auto-detection (types.h) resolves to uECC_arm64 on aarch64 OHOS; verified by HarmonyOS-specific test test_ohos.c."
    - "No platform-specific or external dependencies; all 5 SEC curves (secp160r1/192r1/224r1/256r1/256k1) enabled."
  common_dependencies: []
versions:
  - "1.1"
