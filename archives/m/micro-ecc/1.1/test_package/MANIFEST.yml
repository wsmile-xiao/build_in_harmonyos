# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）

package: micro-ecc/1.1
homepage: "https://github.com/kmackay/micro-ecc"

# 上游自带 test/ 目录（test_ecdh.c / test_ecdsa.c / test_compress.c /
# test_compute.c 及向量文件），无 Makefile/CTest 注册入口，见 notes.md 台账。
upstream_check_command: ""

# conanfile.py build() 未集成上游测试（上游无构建系统）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 自带消费者测试（真实调用 ECDH/ECDSA API）
test_package_tests:
  - file: test.c
    description: "消费者验证：5 条曲线（secp160r1/192r1/224r1/256r1/256k1）密钥生成、ECDH 共享秘密双向一致性、ECDSA 签名/验签"
    command: "./test_micro_ecc"
  - file: test_ohos.c
    description: "HarmonyOS 专项：断言 uECC_PLATFORM 在 OHOS aarch64 下识别为 uECC_arm64，并对全部 5 条曲线执行密钥生成、ECDH 双向一致性、ECDSA 签名/验签"
    command: "./test_micro_ecc_ohos"

assertion_count: 30