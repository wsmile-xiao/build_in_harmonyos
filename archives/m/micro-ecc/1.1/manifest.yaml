knowledge_gained:
  - "W3/JC5 full 模式按 git index (git ls-files) 扫描 archives 隐藏文件；gitignore 规则不豁免已跟踪文件。其他库遗留「gitignore 但仍被跟踪」基线（如 .ci-trigger）命中 JC5 时须 git rm --cached 索引隔离→复跑 finish→git checkout HEAD 原样恢复并核验 SHA-256。ref: knowledge/drafts/DRAFT-micro-ecc-1.1-gitignore-tracked-baseline-jc5-isolation.md"
  - "micro-ecc 上游无构建系统（copy-into-project 风格），clang 直接编译 uECC.c + llvm-ar 归档为 libuecc.a；types.h 依据 __aarch64__ 自动识别 OHOS arm64 平台 (uECC_arm64)。ref: knowledge/drafts/DRAFT-micro-ecc-1.1-gitignore-tracked-baseline-jc5-isolation.md"