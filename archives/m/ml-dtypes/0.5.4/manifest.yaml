# 版本级 manifest — ml-dtypes 0.5.4
# 遵循 ARCHIVE-SPEC v2.0

version: "0.5.4"
software: "ml-dtypes"

# 编译状态: built（真机 conan create 通过、上游测试真实执行；待 HMBS 门禁后统一更新）
status: built

build_date: "2026-09-29"

# 构建系统 (必填顶层字段)
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # PyPI 官方 sdist（含 vendored third_party/eigen，C++ 扩展编译必需）
  url: "https://files.pythonhosted.org/packages/0e/4a/c27b42ed9b1c7d13d9ba8b6905dece787d6259152f2309338aed29b2447b/ml_dtypes-0.5.4.tar.gz"
  sha256: "8ab06a50fb9bf9666dd0fe5dfb4676fa2b0ac0f31ecff72a6c3af8e22c063453"
  tar_format: tar.gz

# 上游 pytest 套件只在 GitHub tag tarball 中（sdist 不含 tests/）
source_extra:
  upstream_tests:
    url: "https://github.com/jax-ml/ml_dtypes/archive/refs/tags/v0.5.4.tar.gz"
    sha256: "acaef497b420a15761cb525562b04d880b5c7afacea02d435a5d166fd8a99a16"

# ============================================================
# 构建配置
# ============================================================

build:
  # setuptools / PEP 517 (setup.py build_ext) —— 仓库自定义构建族
  system: custom

  configure_options:
    - "setup.py build_ext --inplace"
    - "CC/CXX = /data/service/hnp/bin/clang(++)"
    - "LDFLAGS = -L<python-pkg>/lib -lpython3.12   # E004"
    - "_PYTHON_SYSCONFIGDATA_NAME = <由 python 包 lib/ 推导>"

  # 编译依赖列表 (格式: name/version)
  dependencies:
    - python/3.12.9
    - numpy/2.5.2
    - setuptools/84.0.0

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-setup.py-harmonyos-compile-args.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ml-dtypes 是手写 CPython C-API + NumPy C-API 的 C++17 扩展（非 pybind11）：全树 grep pybind 为 0 命中"
  - "双源必需：PyPI sdist 含 vendored third_party/eigen（MANIFEST.in:2-4）但不含 tests/；GitHub tag tarball 含 ml_dtypes/tests/（96 个 absl 用例）但不含 Eigen submodule 内容"
  - "E004（musl BIND_NOW）：setuptools 默认不链 libpython，扩展 dlopen 报 'PyDict_SetItemString: symbol not found'；LDFLAGS 必须显式 -L<python-pkg>/lib -lpython3.12（conan python 包的 sysconfig.LIBDIR 不可用，值为 //lib）"
  - "E077 / ML-0043：未签名 .so dlopen 报 Permission denied；需 llvm-objcopy 剥 .codesign + binary-sign-tool -selfSign 1 重签，签名后须 chmod 755（权限归零为 000）"
  - "_PYTHON_SYSCONFIGDATA_NAME：conan python 包按构建期 host alias 命名 sysconfigdata（_sysconfigdata__linux_aarch64-linux-ohos），真机 sys.platform=harmonyos → sysconfig 报 ModuleNotFoundError；导出真实模块名后 setuptools 可解析 EXT_SUFFIX/include"
  - "OHOS clang 15（aarch64-unknown-linux-ohos）不支持 FP 异常捕获：-ftrapping-math 触发 -Wunsupported-floating-point-opt 并被忽略（补丁 0001 在 HarmonyOS 分支去掉该无效 flag）"
  - "上游 pytest 套件在本平台 NumPy 构建下必然出现 30 个失败（28 个 NaN→int cast 的 invalid RuntimeWarning 被 pytest.ini filterwarnings=error 升级为 error，纯 numpy 基线可复现；2 个 assert_equal 对自定义 dtype 不套用 NaN 相等规则）；全部用例仍原样执行、无 --ignore 掩盖"
