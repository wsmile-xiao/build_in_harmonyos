sources:
  # PyPI official sdist. Required (vs. the GitHub tag tarball) because only the
  # sdist ships the vendored `third_party/eigen` header subtree that the C++
  # extension compiles against (MANIFEST.in:2-4). sha256 verified against
  # https://pypi.org/pypi/ml-dtypes/0.5.4/json
  url: "https://files.pythonhosted.org/packages/0e/4a/c27b42ed9b1c7d13d9ba8b6905dece787d6259152f2309338aed29b2447b/ml_dtypes-0.5.4.tar.gz"
  sha256: "8ab06a50fb9bf9666dd0fe5dfb4676fa2b0ac0f31ecff72a6c3af8e22c063453"

# Upstream pytest suite is NOT part of the PyPI sdist (verified: the sdist
# contains no `ml_dtypes/tests/`); it only exists in the GitHub tag tarball.
# Fetched separately (source() reads this key) so the upstream suite can be
# executed verbatim.
#
# NOTE for maintainers: ci/conan/build_and_test.sh rewrites `url:` lines of
# known hosts into a mirror list (mirror fallback) and only restores the
# `sources:` section afterwards, so this secondary key can be left carrying a
# mirror prefix by a local W3 run. It must be committed as the single official
# URL below (R39 / preflight PF7 rejects mirror hosts).
upstream_tests:
  url: "https://github.com/jax-ml/ml_dtypes/archive/refs/tags/v0.5.4.tar.gz"
  sha256: "acaef497b420a15761cb525562b04d880b5c7afacea02d435a5d166fd8a99a16"

patches:
  "0.5.4":
    - patch_file: "patches/0001-setup.py-harmonyos-compile-args.patch"
      patch_description: "setup.py: drop the ineffective -ftrapping-math flag on HarmonyOS (clang 15 / aarch64-unknown-linux-ohos reports it as unsupported FP-exception use)"
      patch_type: "portability"
