package: ml-dtypes/0.5.4
homepage: "https://github.com/jax-ml/ml_dtypes"

# 上游确有测试：GitHub tag v0.5.4 的 ml_dtypes/tests/ 共 96 个 absl 风格用例
# （framework = pytest 驱动 absl.testing parameterized.TestCase）。
# 注意：PyPI sdist **不含** tests/（实测 sdist 无 ml_dtypes/tests），测试只在
# GitHub tag tarball 中；故 conandata.yml 用双源，source() 把 tests/ 取回源码树。
upstream_tests_exist: true
upstream_test_audit: "审计上游 v0.5.4 GitHub tag tarball (sha256 acaef497b420a15761cb525562b04d880b5c7afacea02d435a5d166fd8a99a16): ml_dtypes/tests/ 含 conftest.py / custom_float_test.py / finfo_test.py / iinfo_test.py / intn_test.py / metadata_test.py / multi_thread_utils.py 及 3 个 C++ 测试源 (float8_test.cc / intn_test.cc / mxfloat_test.cc，v0.5.4 无对应构建配置，非 pytest 入口)。grep 'def test' 计数 96 个用例（absl 风格方法名，非 pytest 的 test_ 前缀）；pytest 实际收集（collected）2106 项（含 absl parameterized 展开与 multi_thread_utils 的 *_multi_threaded 变体），逐文件：custom_float_test.py 1272 + finfo_test.py 24 + iinfo_test.py 12 + intn_test.py 796 + metadata_test.py 2 = 2106。framework=pytest，上游 CI 用 `pip install .[dev]` + `pytest -n auto`，pytest.ini 设 filterwarnings=error。"

# 签名校验（避免上游 tag 与 sdist 混淆）
upstream_test_source:
  url: "https://github.com/jax-ml/ml_dtypes/archive/refs/tags/v0.5.4.tar.gz"
  sha256: "acaef497b420a15761cb525562b04d880b5c7afacea02d435a5d166fd8a99a16"

upstream_check_command: "python3 -m pytest ml_dtypes/tests -v --no-header -p no:cacheprovider -o addopts=\"\""
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest ml_dtypes/tests -v --no-header -p no:cacheprovider -o addopts=\"\"   (cwd = 源码树；上游 pytest.ini 的 filterwarnings=error 原样生效)"

# build() 内真实执行上游 pytest（原样、不排除任何用例），聚合计数写入包内
# res/upstream_test_summary.json；HMBS_UPSTREAM_TEST_RESULT 由 test_package 阶段
# 读取该文件后输出（gate 只扫描 test_package 阶段 stdout，且 conan create 命中
# 缓存二进制时 build() 整体跳过——aiohttp-fast-zlib 同款模式）。
# 数字来自真实 pytest 输出解析，不伪造、不推断；失败项连同根因一并写入
# failures / environment_attributable / environment_baseline_probe 字段。

upstream_tests:
  - file: ml_dtypes/tests/
    description: "ml_dtypes 上游 pytest 套件（96 个 absl 用例；pytest 收集 2106 项，含 parameterized 展开与 *_multi_threaded 变体），build() 内全部真实执行，无 --ignore 排除"
    framework: pytest
    discovered: 2106
    notes: "本机实测（计数与 pytest 自报口径一致，counts_consistent=true）：collected 2106 = passed 2073 + 用例失败 16 + skipped 17；另有 14 个子测试失败（testUnaryUfunc_*[expm1]），pytest 汇总行把用例失败与子测试失败合并记为 \"30 failed\"（30 = 16 + 14）。30 项失败全部归因于本平台 NumPy 构建而非本包（见 environment_baseline_probe）：28 个失败条目为 `RuntimeWarning: invalid value encountered in cast` / `overflow encountered in expm1`（numpy 对 NaN→int cast 发该 warning，上游 pytest.ini 的 filterwarnings=error 将其升级为 error；纯 numpy 基线 np.array(np.nan).astype(np.int8) 在全新进程即复现同一 warning，与 ml_dtypes 无关），2 个为 testArange_float8_e4m3b11fnuz[+_multi_threaded]（np.testing.assert_equal 对用户自定义 dtype 不套用 NaN 相等规则：np.issubdtype(<custom dtype>, np.floating) 为 False）。不使用 --ignore 掩盖，全部用例均执行并如实上报。"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_ml_dtypes.py
    description: "用设备 python3 在 conanrun 环境下导入打包的 ml_dtypes 并真实调用 API：版本、bfloat16/float8_e4m3fn/int4/uint4 往返、finfo/iinfo、NumPy 互操作、以及 HarmonyOS 专有检查（扩展模块为已签名的 OHOS aarch64 ELF：aarch64-linux-ohos 平台标签 + ELF 魔数 + .codesign 段）——共 7 个独立检查点"
    command: "python3 test_ml_dtypes.py (env=conanrun：PYTHONPATH 指向 site-packages + LD_LIBRARY_PATH 含 libpython/numpy；解释器优先取本包编译所依据的 conan python 的 bin/python3.12，避免与 worker 上 PATH 更靠前的 HNP python 混用)"
    framework: python
    discovered: 7
    ohos_specific_cases: 1

assertion_count: 7
