# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: muparser/2.3.5
homepage: "https://github.com/beltoforion/muparser"

# 上游测试命令 (ctest -N 分析)
upstream_check_command: "ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ParserTester, 604 个独立表达式断言)
upstream_tests:
  - file: test/t_ParserTest.cpp
    source: muparser-2.3.5/test/t_ParserTest.cpp
    description: "ParserTester 上游单元测试（15 组, 604 expressions, 全部通过）"
    command: "./t_ParserTest"

# test_package 中自带的测试 (消费者视角验证, R34 实质调用 API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：mu::Parser 解析 1+2*3 / sin+cos / sqrt(x) 并断言"
    command: "./test_muparser"

# 测试断言总数 (近似值)
assertion_count: 604
