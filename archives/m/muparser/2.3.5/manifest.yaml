# muparser 2.3.5 - 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "2.3.5"
software: muparser
status: published
build_date: "2026-09-02"
build_system: cmake

source:
  url: "https://github.com/beltoforion/muparser/archive/refs/tags/v2.3.5.tar.gz"
  sha256: "20b43cc68c655665db83711906f01b20c51909368973116dfc8d7b3c4ddb5dd4"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DENABLE_OPENMP=OFF"
    - "-DENABLE_SAMPLES=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - 'muparser 为 CMake C++ 数学解析库，零第三方依赖，aarch64-ohos clang 15 直接构建通过'
  - '上游默认 ENABLE_OPENMP=ON 需 find_package(OpenMP REQUIRED)，CI 无 OpenMP 时配方必须设 ENABLE_OPENMP=OFF'
  - 'github.com 直连不可达时，codeload.github.com 是等价官方下载端点（archive tarball SHA-256 一致）'
  - '上游测试入口为 test/t_ParserTest.cpp（ParserTester），604 个独立表达式断言，15 个测试组'
