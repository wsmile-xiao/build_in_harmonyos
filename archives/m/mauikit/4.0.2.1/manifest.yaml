test_results:
  type: local_recipe_check
  upstream: "NO_UPSTREAM_TESTS: mauikit 4.0.2 ships no autotests/ or tests/ directory and no BUILD_TESTING switch in any CMakeLists (root, src, style.6); verification relies on the OHOS-specific test_package"
  test_package: "pending CI: CMake consumer links the exported (un-namespaced) MauiKit4 target, asserts the patched OHOS defaults (Handy form factor/touch/singleClick, desktop input, platform guards), checks versionString, links the exported (un-namespaced) MauiKit4 target, instantiates org.mauikit.controls QML offscreen, verifies the BaseWindow decoration chain (Maui.WindowShadow / Maui.WindowControls resolve as QML types and instantiate offscreen), and asserts DT_NEEDED soname hygiene"
  full_reference: "pending CI"
source_url: https://download.kde.org/stable/maui/mauikit/4.0.2/mauikit-4.0.2.tar.xz
source_sha256: 054dc0e15242ffa6bb9b8b25515cebfc9a02347b679f3907dcb80673ca93dd40
knowledge_gained:
  - "MauiKit4 exports an un-namespaced CMake target MauiKit4 (alias MauiKit4::Controls exists only in the build tree; SOVERSION 4) plus the org.mauikit.controls QML plugin (libMauiKit4plugin) and the org.mauikit.style Quick Controls style (libMauiStyleplugin); three shared objects in total."
  - "With os=OHOS the CMake variables UNIX/ANDROID/APPLE/LINUX are all false, so the CMake-level XCB/KF6WindowSystem and platforms/linux|android source branches are skipped; BUT the OHOS clang toolchain defines __linux__ and __OHOS__, so Qt Q_OS_LINUX code branches (platform.cpp desktop backend, FMH::isLinux) stay live and must be handled with __OHOS__ guards."
  - "MauiMan is patched out (run decision B): on OHOS the mauiman server/daemon is never built (UNIX=false), so csdcontrols/handy/style/moduleinfo fall back to in-class defaults (enableCSD=false, styleName=Nitrux, formFactor=Desktop, singleClick=true, styleType=Light, accentColor #26c6da, radiusV=4, iconSize=22, sizes=4, hasKeyboard/hasMouse=true)."
  - "The registry qtmultimedia/6.11.1 package ships C++ libraries only (no QtMultimedia QML import tree), so the upstream ecm_add_qml_module DEPENDENCIES entry and the ToastArea SoundEffect usage had to be patched (same gap as kirigami-addons/1.13.0)."
  - "ki18n_install(po) is kept; GETTEXT_MSGFMT_EXECUTABLE is resolved by the recipe so the .po processing does not depend on the worker shell PATH."
  - "The published kcoreaddons/ki18n/knotifications/qtmultimedia packages ship their .so files without DT_SONAME, so the linker bakes absolute package paths into DT_NEEDED (CI attempt-1 finding, same gap as the kio cache-root bridge). The recipe normalization rewrites those entries to bare basenames that resolve through the consumer LD_LIBRARY_PATH/DT_RPATH closure; the test_package requires bare sonames on packaged libraries and existing-file resolution for the test binary absolute entries."
  - "The BaseWindow decoration types are platform-gated in src/CMakeLists.txt (not mauikit.cpp): Maui.WindowShadow comes from the ANDROID or UNIX/XCB C++ source branches and private/linux/WindowControls.qml from elseif(LINUX); all are false on HarmonyOS, so a QML unit referencing them fails to compile as a whole even when the referencing Loader is inactive. Patch 0004 registers the upstream pure-Qt mobile WindowShadow and the pure-QML linux WindowControls under CMAKE_SYSTEM_NAME=HarmonyOS."
