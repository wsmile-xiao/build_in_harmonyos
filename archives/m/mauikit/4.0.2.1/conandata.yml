sources:
  url: "https://download.kde.org/stable/maui/mauikit/4.0.2/mauikit-4.0.2.tar.xz"
  sha256: "054dc0e15242ffa6bb9b8b25515cebfc9a02347b679f3907dcb80673ca93dd40"
patches:
  "4.0.2.1":
    - patch_file: "patches/0001-ohos-remove-mauiman.patch"
      patch_description: "OHOS: remove the MauiMan dependency (find_package, link line, csdcontrols, handy, style, moduleinfo); patched touchpoints fall back to the in-class defaults because no mauiman server/daemon exists on OHOS"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-qtmultimedia-qml.patch"
      patch_description: "OHOS: the published qtmultimedia package ships C++ libraries only (no QtMultimedia QML import tree), so drop the qmldir module dependency and make the ToastArea notification sounds no-ops"
      patch_type: "portability"
    - patch_file: "patches/0003-ohos-platform-fallback.patch"
      patch_description: "OHOS: the toolchain defines __linux__ so Qt Q_OS_LINUX branches are live, but the desktop backend (mauilinux.h/MAUIKDE, XCB/KF6::WindowSystem) is not compiled; provide a minimal in-file platform backend under __OHOS__"
      patch_type: "portability"
    - patch_file: "patches/0004-ohos-qml-window-decoration-types.patch"
      patch_description: "OHOS: no upstream platform branch compiles a WindowShadow and CMake LINUX is false, so the Maui.WindowShadow type used by private/BaseWindow.qml and the Maui.WindowControls type used by ToolBar/TabBar stay unregistered; under CMAKE_SYSTEM_NAME=HarmonyOS compile the upstream pure-Qt mobile WindowShadow (android shadowhelper, no XCB/KF6WindowSystem/JNI) and register the pure-QML private/linux/WindowControls.qml"
      patch_type: "portability"
