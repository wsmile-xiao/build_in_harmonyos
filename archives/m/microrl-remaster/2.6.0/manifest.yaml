knowledge_gained:
  - "codeload tag 名 URL（https://codeload.github.com/dimmykar/microrl-remaster/tar.gz/refs/tags/v2.6.0 以 tag 名结尾）导致 Conan get() 无法推断归档格式报 BadZipFile；source() 须显式 filename='microrl-remaster-2.6.0.tar.gz'。复用既有正式知识 E276/E483（exact_duplicate，不再新建草稿）。"
  - "microrl_config.h 默认无条件 #include 'microrl_user_config.h'（类 lwipopts 模式），纯库配方打包须用上游 microrl_user_config_template.h 复制为默认空配置头，否则下游消费者编译失败。新草稿 DRAFT-microrl-remaster-2.6.0-user-config-header-default（候选 B new_draft，路径 B 成立）。"
  - "W3/JC5 full 模式按 git index (git ls-files) 扫描 archives 隐藏文件；gitignore 规则不豁免已跟踪文件。其他库遗留「gitignore 但仍被跟踪」基线文件命中 JC 时，须 git rm --cached 索引隔离 → 复跑 finish → 原样恢复并核验 SHA-256。复用既有草稿 DRAFT-micro-ecc-1.1-gitignore-tracked-baseline-jc5-isolation（exact_duplicate）。"