# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: microrl-remaster/2.6.0
homepage: "https://github.com/dimmykar/microrl-remaster"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无独立测试框架；examples/Makefile 构建 microrl_test 交互式示例（unix 终端行编辑演示），
# 非自动化断言测试。详见 notes.md 上游测试枚举台账。
upstream_check_command: "make -C examples CC=clang microrl_test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无独立 TEST_CASE 断言测试；examples/microrl_test 为交互式示例程序（驱动示例见台账）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 microrl_init/microrl_processing_input/microrl_get_version 公开 API，验证命令解析与版本"
    command: "./test_microrl_remaster"
  - file: test_ohos.c
    description: "鸿蒙专项测试：OHOS arm64 平台识别断言 + microrl 公开 API（init/set_execute_callback/set_prompt/processing_input/clear_terminal/get_version）多场景断言"
    command: "./test_microrl_remaster_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
