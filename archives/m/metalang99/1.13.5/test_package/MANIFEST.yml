# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: metalang99/1.13.5
homepage: "https://github.com/hirrolot/metalang99"

# 上游测试命令 — metalang99 上游使用 scripts/test.sh（CMake 构建所有
# test_*.c 后在 Linux 运行 ./gen 与 ./stmt）；无 ctest/add_test 注册。
# 测试断言以 _Static_assert 嵌入每个 test_*.c，编译成功即通过。
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# header-only：无 build() 编译；上游测试在 test_package 中编译运行
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 tests/CMakeLists.txt 注册 17 个 add_executable target，每个对应
# 一个 tests/*.c 测试源文件；断言为 _Static_assert（C11）。
upstream_tests:
  - file: tests/metalang99.c
    source: metalang99-1.13.5/tests/metalang99.c
    description: "版本兼容性/相等性 _Static_assert 测试"
    command: "./metalang99"
  - file: tests/assert.c
    source: metalang99-1.13.5/tests/assert.c
    description: "ML99_ASSERT/ML99_assertEq 断言宏测试"
    command: "./assert"
  - file: tests/bool.c
    source: metalang99-1.13.5/tests/bool.c
    description: "布尔代数（true/false/not/and/or/if）测试"
    command: "./bool"
  - file: tests/choice.c
    source: metalang99-1.13.5/tests/choice.c
    description: "choice 求和类型测试"
    command: "./choice"
  - file: tests/either.c
    source: metalang99-1.13.5/tests/either.c
    description: "either（left/right/match/eq）测试"
    command: "./either"
  - file: tests/gen.c
    source: metalang99-1.13.5/tests/gen.c
    description: "代码生成宏测试（上游 scripts/test.sh 在 Linux 运行此可执行）"
    command: "./gen"
  - file: tests/stmt.c
    source: metalang99-1.13.5/tests/stmt.c
    description: "语句链式宏测试（上游 scripts/test.sh 在 Linux 运行此可执行）"
    command: "./stmt"
  - file: tests/lang.c
    source: metalang99-1.13.5/tests/lang.c
    description: "lang 核心求值引擎测试"
    command: "./lang"
  - file: tests/list.c
    source: metalang99-1.13.5/tests/list.c
    description: "list（cons/nil/eq/map/fold）测试"
    command: "./list"
  - file: tests/maybe.c
    source: metalang99-1.13.5/tests/maybe.c
    description: "maybe（just/nothing/eq/match）测试"
    command: "./maybe"
  - file: tests/nat.c
    source: metalang99-1.13.5/tests/nat.c
    description: "Peano 自然数（inc/dec/add/sub/match）测试"
    command: "./nat"
  - file: tests/ident.c
    source: metalang99-1.13.5/tests/ident.c
    description: "标识符操作测试"
    command: "./ident"
  - file: tests/tuple.c
    source: metalang99-1.13.5/tests/tuple.c
    description: "tuple（count/get/tail/append/prepend）测试"
    command: "./tuple"
  - file: tests/util.c
    source: metalang99-1.13.5/tests/util.c
    description: "util（id/const/compose/flip）测试"
    command: "./util"
  - file: tests/variadics.c
    source: metalang99-1.13.5/tests/variadics.c
    description: "可变参数宏测试"
    command: "./variadics"
  - file: tests/seq.c
    source: metalang99-1.13.5/tests/seq.c
    description: "seq 序列宏测试"
    command: "./seq"
  - file: tests/eval/rec.c
    source: metalang99-1.13.5/tests/eval/rec.c
    description: "递归求值测试"
    command: "./rec"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_metalang99.c
    description: "消费者测试：跨 9 个功能点调用 metalang99 公开宏 API（version/nat/bool/tuple/either/maybe/list/util），断言均为 _Static_assert"
    command: "./test_metalang99"

# 测试断言总数 (真实值, 用于质量评估)
# test_metalang99.c 中真实 ML99_ASSERT*/ML99_ASSERT_UNEVAL/ML99_ASSERT_EQ
# 调用数（逐条枚举，不含文件头注释行）。
# 注：grep -cE "ML99_ASSERT" 原始计数为 58，但其中 1 行是文件头注释
# "// Every ML99_ASSERT_* below expands to _Static_assert"，实际调用数 57。
assertion_count: 57
