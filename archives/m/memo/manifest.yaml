software: memo
display: "Memo"
description: "Unix 风格记事命令行工具（notes）+ 手册页"
category: tool
homepage: "https://www.nrosvall.name/memo/"
license: GPL-3.0-or-later
build_system: make

ohos_adaptation:
  key_points:
    - "单文件 C 程序（memo.c）+ 手写 Makefile；不依赖 uname，注入 OHOS clang 直接编译（`memo.c` 仅告警 -Wtautological-constant-out-of-range-compare，不影响功能）"
    - "上游无测试套件（Makefile 只有 all/clean/install/uninstall，无 make check/ctest）→ rule4 N=0，不触发"
    - "构建环境无 install(1) → package() 手工拷贝 bin/memo + share/man/man1/memo.1"
    - "CLI 工具：提供软件级 commands.json"

versions:
  "1.7.1":
    status: built
    build_date: "2026-09-21"
    conan_ref: "memo/1.7.1"
