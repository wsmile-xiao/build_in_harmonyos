# test_package/MANIFEST.yml
# memo 1.7.1.

package: memo/1.7.1
homepage: https://www.nrosvall.name/memo/

upstream_tests_exist: false
upstream_test_audit: "Upstream ships a single C source (memo.c) and a hand-written Makefile with only all/clean/install/uninstall targets; there is no test suite (no make check / ctest)"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_memo.sh
    description: "runs the installed memo: --version, --help, and an add/list round-trip in a temporary HOME"
    command: "sh test_memo.sh"

test_files:
  - path: "test_package/test_memo.sh"
    test_type: "R34"
    assertion_count: 3

test_package_test_count: 1
consumer_assertion_count: 3
assertion_count: 3
