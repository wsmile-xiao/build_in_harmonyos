# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file to exist

package: mbelib/1.3.0
homepage: "https://github.com/szechyjs/mbelib"

# Upstream test command (make -n check / ctest -N / meson test --list analysis)
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: test/mbe-test.cpp
    source: mbelib-master/test/mbe-test.cpp
    description: "Upstream gtest-based IMBE/AMBE vocoder test suite"
    command: "./test/mbe-test"

# test_package consumer-side tests
test_package_tests:
  - file: test.c
    description: "Consumer test: calls mbe_golay2312, mbe_checkGolayBlock, and mbe_parms struct"
    command: "./test_mbelib"

# Total assertion count (approximate, for quality assessment)
assertion_count: 3
