software: mbelib
display: "mbelib"
description: "P25 Phase 1 IMBE/AMBE 语音编解码库，支持 7200x4400/7100x4400/3600x2250 codec"
category: network
homepage: "https://github.com/szechyjs/mbelib"
license: ISC
build_system: cmake

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "CMakeLists.txt 使用 cmake_minimum_required(VERSION 2.6)，与 CMake 4.x 不兼容，需添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "ctest 未注册测试用例，需直接运行 mbetest 可执行文件"
    - "mbelib 是纯 C 库项目，无可执行二进制，G1/G2 门禁对库项目需适配"
  common_dependencies: []

# 版本索引
versions:
  "1.3.0":
    status: built
    build_date: "2026-06-15"
