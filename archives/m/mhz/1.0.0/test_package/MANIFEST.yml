# test_package/MANIFEST.yml
# mhz 1.0.0 - upstream test declaration and consumer-test audit.

package: mhz/1.0.0
homepage: "https://github.com/wtarreau/mhz"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream mhz 1.0.0 ships no test suite: the release tarball contains only
  mhz.c, a Makefile, README.md and LICENSE. There is no `check`/`test` target
  and no tests/ directory.
upstream_check_command: "n/a (no test target)"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests: []

test_package_tests:
  - file: test_mhz.sh
    description: >-
      installed-program consumer checks: presence/executability of mhz, the -h
      usage banner, and a short `mhz -c` measurement that must print a numeric
      frequency.
    command: "sh test_mhz.sh"

test_files:
  - path: "test_package/test_mhz.sh"
    test_type: "R34"
    assertion_count: 5

test_package_test_count: 1
consumer_assertion_count: 5
upstream_test_cases: 0
assertion_count: 5
