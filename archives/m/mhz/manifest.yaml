software: mhz
display: "mhz"
description: "测量 CPU 有效频率（MHz）的小工具"
category: utility
homepage: "https://github.com/wtarreau/mhz"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C，纯 Makefile，零三方依赖"
    - "上游 CC:=gcc，配方以 make CC=<ohos clang> 覆盖"
    - "rdtsc 仅 x86 启用；aarch64 走 CLOCK_MONOTONIC，OHOS 零补丁"
  common_dependencies: []

versions:
  - version: "1.0.0"
    status: built
    build_date: "2026-10-03"
