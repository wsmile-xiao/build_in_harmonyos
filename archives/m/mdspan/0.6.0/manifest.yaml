# 遵循 ARCHIVE-SPEC v2.0

version: "0.6.0"
software: "mdspan"

# 设备端真实验证完成后的状态口径（built ≠ published；合并并确认 release upload 才置 published）
status: built
build_date: "2026-09-28"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 GitHub tag tarball（tag 带前缀形态 mdspan-0.6.0；轻量 tag → commit 9ceface91483775a6c74d06ebf717bbb2768452f）
  url: "https://github.com/kokkos/mdspan/archive/refs/tags/mdspan-0.6.0.tar.gz"
  # 三路一致：conandata.yml sources.sha256 = 本字段 = 任务卡/CCI 记录；实测 215304 字节、解包 2.0M
  sha256: "79f94d7f692cbabfbaff6cd0d3434704435c853ee5087b182965fa929a48a592"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 配方走 header-only + 上游 CMake INTERFACE 目标一致性校验（见 conanfile.py）
  system: cmake
  # 下列 configure_options 是设备端**上游测试套件**的原生 CMake 构建参数
  # （tests/ gtest + compilation_tests/），不是 conan 包构建参数——
  # 配方 build() 内 MDSPAN_ENABLE_* 四项全部显式钉 OFF（保证 G2 干净轮离线自包含）。
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_CXX_STANDARD=20"
    - "-DMDSPAN_CXX_STANDARD=20"
    - "-DMDSPAN_ENABLE_TESTS=ON"
    - "-DMDSPAN_ENABLE_EXAMPLES=OFF"
    - "-DMDSPAN_ENABLE_BENCHMARKS=OFF"
    - "-DMDSPAN_ENABLE_COMP_BENCH=OFF"
    - "-DMDSPAN_USE_SYSTEM_GTEST=ON"
  dependencies: []
  cc: clang
  cxx: clang++

