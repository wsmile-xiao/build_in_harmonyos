# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mm/1.4.2
homepage: "http://www.ossp.org/pkg/lib/mm/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（Makefile: `test: mm_test` / `check: test`）
upstream_tests:
  - file: mm_test.c
    source: mm-1.4.2/mm_test.c
    description: "上游回归测试套件，覆盖 global API / low-level shared-memory API / malloc-style API 三层"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：经由安装包调用 mm_lib_version/mm_create/mm_core_size/mm_malloc/mm_realloc/mm_free/mm_destroy；含 4 条用例专门覆盖 $TMPDIR 默认后备文件路径（适配点）"
    command: "./test_mm"

# 测试断言总数 (近似值, 用于质量评估)
# = 上游 mm_test.c 的 15 条 FAILED_IF + test_package/test.c 的 10 条 CHECK
assertion_count: 25
