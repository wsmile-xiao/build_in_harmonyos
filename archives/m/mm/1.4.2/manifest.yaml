# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 2006 年发布的 configure 脚本中 config.guess（2005-12-13 版）不认识 HarmonyOS 的 uname 输出，需显式传入 --build/--host 三元组才能配置成功"
  - "库默认把共享内存后备文件硬编码为 /tmp/mm.core.<pid>（mm.h 的 MM_CORE_DEFAULT_FILE），鸿蒙 PC 上 /tmp 只读，必须改为读取 $TMPDIR（对应知识库 E002）"
  - "make test 依赖上述后备文件的可写路径，未打补丁会在 'Read-only file system' 处直接失败，因此补丁同时是上游测试可跑通的前提"

