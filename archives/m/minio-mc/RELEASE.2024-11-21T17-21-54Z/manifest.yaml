software: minio-mc
version: "RELEASE.2024-11-21T17-21-54Z"
status: built
build_date: "2026-06-12"
build_system: custom

source:
  url: "https://api.github.com/repos/minio/mc/tarball/refs/tags/RELEASE.2024-11-21T17-21-54Z"
  sha256: ""
  tar_format: tar.gz

build:
  configure_options:
    - "GO111MODULE=on CGO_ENABLED=0 go build -trimpath -tags kqueue --ldflags '-s -w -X github.com/minio/mc/cmd.Version=RELEASE.2024-11-21T17-21-54Z -X github.com/minio/mc/cmd.CopyrightYear=2024 -X github.com/minio/mc/cmd.ReleaseTag=RELEASE.2024-11-21T17-21-54Z -X github.com/minio/mc/cmd.CommitID=ec185ff00000 -X github.com/minio/mc/cmd.ShortCommitID=ec185ff00000'"
  dependencies:
    - go/1.26.4

patches_applied: []

knowledge_gained:
  - "Go项目使用 go build 编译，无需 configure/make"
  - "ShortCommitID ldflags值必须>=12字符，否则 cmd/build-constants.go 会 panic"
  - "GitHub API tarball URL可替代直接下载，解决中国网络问题"