# 软件级 manifest
# 文件位置: archives/m/minifb/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: minifb

# 显示名
display: "MiniFB"

# 一句话描述
description: "迷你跨平台窗口框架（OHOS headless 核心适配）"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: gfx

# 官网 URL
homepage: "https://github.com/emoon/minifb"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "headless 处置：无 X11/Wayland 会话——窗口创建不支持（mfb_open_ex→NULL 如实申报），软件帧缓冲接口/计时器/输入 getter 全可用"
    - "CMAKE_SYSTEM_NAME=HarmonyOS 不匹配上游 Linux 字面量判定——patch 识别为类 Linux + 两版本分支 X11 连锁关闭"
    - "__linux__ 在 OHOS 目标预定义——上游 clock_gettime 计时器源直接可编"
    - "窗口后端 4 入口的 headless stub 用 exports_sources 携带（generator expression 引用的文件须存在）"
    - "测试二进制运行需 E077 签名"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.13.0":
    status: built
    build_date: 2026-09-20
