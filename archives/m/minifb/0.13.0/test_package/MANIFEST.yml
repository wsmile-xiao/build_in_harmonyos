# test_package/MANIFEST.yml — minifb 0.13.0
# CI L0e requires this file to exist.

package: minifb/0.13.0
homepage: "https://github.com/emoon/minifb"

# Upstream test inventory (tag v0.13.0):
# - No add_test/enable_testing in the tree; no CI test workflows — the
#   "tests" are the examples (noise/multiple-windows/etc.), which are
#   interactive windowed demos (need a display + keyboard/mouse).
# Registration count: 0 automated test cases.
upstream_check_command: "grep -rn add_test . || echo none"
upstream_test_in_build: false
upstream_test_command: "cmake -B build -DMINIFB_BUILD_EXAMPLES=OFF && cmake --build build (library build; interactive examples excluded — headless asserts in test_package)"

# Local execution on the OHOS device (see notes.md): library built with
# the OHOS headless patch; consumer suite exercises the headless API
# surface (update state machine, timers, NULL-window getters).
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_minifb.c
    description: "Headless consumer flow: mfb_update(NULL) -> MFB_STATE_INVALID_WINDOW (documented error path) + full timer API (create/reset/now/delta/destroy, set/get target fps 60, frequency/resolution from the clock_gettime bridge) + NULL-window input getters — 13 checks, failures=0"
    command: "conan create (cmake build → run test_minifb)"

assertion_count: 13

consumer_tests: 13
consumer_passed: 13
consumer_assertions: 13
