patches_applied:
  - "0001-ohos-headless-backend.patch: ①CMakeLists 识别 HarmonyOS 为类 Linux（内核/musl 同源）②SrcLib 按 PLATFORM_ID=HarmonyOS 注入 MiniFB_linux.c（clock_gettime 计时器，__linux__ 守卫在 OHOS 为真）+ 配方自带 MiniFB_ohos_stub.c ③两个 CMake 版本分支的 X11 连锁在 OHOS 下关闭"
  - "MiniFB_ohos_stub.c（配方侧源文件，非上游补丁）：mfb_open_ex→NULL / mfb_update_ex→INVALID_WINDOW / mfb_set_viewport→false / mfb_get_monitor_scale→恒等缩放 四个窗口后端入口的 headless 实现"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "minifb 0.13.0 CMakeLists 以 CMAKE_SYSTEM_NAME STREQUAL 'Linux' 识别 Linux——HarmonyOS 不匹配字面量，不 patch 则所有后端分支静默跳过（只编核心，链接缺 timer/窗口符号）"
  - "LINUX=TRUE 后 X11 会连锁强制 ON（NOT WAYLAND AND LINUX → set X11 ON）→ OHOS 必须在两个 CMake 版本分支都补 X11 OFF 守卫，否则 find_package(X11) FATAL"
  - "OHOS clang 目标预定义 __linux__（与 __OHOS__ 并存）——上游 src/MiniFB_linux.c 的 __linux__ 守卫代码天然可编译，提供 clock_gettime 版 mfb_timer_tick/init"
  - "核心引用的 4 个窗口后端入口（mfb_open_ex/mfb_update_ex/mfb_set_viewport/mfb_get_monitor_scale）只在平台后端实现——headless 处置=配方侧 stub 源文件（mfb_open_ex 返回 NULL 如实申报）"
  - "generator expression $<PLATFORM_ID:HarmonyOS> 引用的源文件必须在源码树存在——stub 用 exports_sources 携带而非 patch 新增"
  - "mfb_get_monitor_scale 头文件签名是 void（旧名 mfb_get_moniter_dpi deprecated）；mfb_set_viewport 返回 bool"

