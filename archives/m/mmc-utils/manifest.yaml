software: mmc-utils
display: "mmc-utils"
description: "MMC/SD/SDIO 设备用户态工具集，用于 eMMC 与 SD 卡的配置、数据读写与诊断"
category: utility
homepage: "https://git.kernel.org/pub/scm/utils/mmc/mmc-utils.git"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 默认 C=1 会调用 sparse 静态检查器，OHOS 无 sparse → 必须传 C=0，否则 Error 127"
    - "GIT_VERSION 取自 `git describe`，源码 tarball 中为空 → 需显式传 GIT_VERSION=<version>，否则 -DVERSION 宏为空"
    - "`INSTALL = install` 硬编码，OHOS 无 install 工具 → 配方直接 copy 产物，不调用 make install"
    - "无 gcc，编译器经 R33 从 conf 取 clang（OHOS sysroot 自带所需 linux/mmc/ioctl.h 等内核头）"
  common_dependencies: []

versions:
  "1.0":
    status: built
    build_date: "2026-09-26"
    source_url: "https://git.kernel.org/pub/scm/utils/mmc/mmc-utils.git/snapshot/mmc-utils-v1.0.tar.gz"
