package: mmc-utils/1.0
homepage: https://git.kernel.org/pub/scm/utils/mmc/mmc-utils.git

# Upstream ships no test suite: the tree contains only the Makefile, sources
# and docs/ (Sphinx rst), no `make check`/testsuite/ctest target exists.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_mmc_utils.py
    description: "Run `mmc help` and assert the usage table and version string"
    command: "python3 test_mmc_utils.py <package>/bin/mmc"
  - file: test_consumer_mmc.py
    description: "HarmonyOS-specific consumer test: build a synthetic SD card information directory, run the installed `mmc cid read` on it end to end and validate the decoded CID fields"
    command: "python3 test_consumer_mmc.py <package>/bin/mmc"

# assertion_count = 3 (test_mmc_utils.py smoke assertions) plus
#                   7 (test_consumer_mmc.py: 2 CLI flow checks, 4 decoded CID
#                      fields and 1 directory/inline stdout cross-check)
# HarmonyOS-specific test cases = 2: one complete end-to-end consumer case
# and one CLI smoke test.
assertion_count: 10
