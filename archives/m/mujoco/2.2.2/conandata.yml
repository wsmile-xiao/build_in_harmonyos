sources:
  url: https://github.com/google-deepmind/mujoco/archive/refs/tags/2.2.2.tar.gz
  sha256: 7aad590d2ec6056f0235021e493db014784452538e45513c4c022de22d8270b0
patches:
- patch_file: patches/0001-cmake-MujocoDependencies.cmake.patch
  patch_description: OHOS/Conan 依赖桥：预找 Conan 包并把上游 FetchContent 内部目标名（ccd/lodepng/qhullstatic_r/tinyxml2/tinyobjloader/gtest/gmock/gtest_main/absl::*）桥接到 Conan 目标，使全部 findorfetch() 短路；守卫引用 FetchContent 内部目标的编译选项行
  patch_type: portability
- patch_file: patches/0002-src-engine-engine_crossplatform.h.patch
  patch_description: OHOS musl 无 qsort_r：按 libc 能力（__GLIBC__）分流的自包含 heapsort 垫片（GNU 比较器参数序、无全局状态、线程安全），真实可移植实现非平台空壳
  patch_type: portability
- patch_file: patches/0003-src-engine-engine_util_errmem.c.patch
  patch_description: 线程安全时间函数检测放宽为非 Windows 即用 localtime_r（musl 默认暴露该 POSIX 接口，原检测依赖 _POSIX_C_SOURCE 特性宏在严格模式下未定义）
  patch_type: portability
