# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mujoco/2.2.2
homepage: "https://github.com/google-deepmind/mujoco"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游为 CMake 工程，MUJOCO_BUILD_TESTS=ON 时 test/ 下 gtest 套件经
# gtest_add_tests 注册为 CTest 用例（ctest -N 可列全量）；静态清点按
# TEST/TEST_F 宏逐文件统计 = 220（test/engine、test/sample、test/benchmark）
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test()  # MUJOCO_BUILD_TESTS=ON, gtest 经 test_requires(host 上下文) 提供"

# 上游实际运行的测试程序（test/CMakeLists.txt mujoco_test 宏逐个注册）
upstream_tests:
  - file: test/CMakeLists.txt
    source: "test/engine/*.cc + test/sample/* + test/benchmark/*（gtest_add_tests 注册）"
    description: "MuJoCo 上游 gtest 套件（引擎/管线/样例），cmake.test() 经 ctest 全量执行"
    command: "ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：C 层调用公开 API（mj_version/mj_loadXML/mj_makeData/mj_step/mj_forward），加载 MJCF 模型并 50 步仿真，8 项行为断言"
    command: "./test_mujoco"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
