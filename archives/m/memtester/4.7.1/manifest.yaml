  - "makefile 类型项目无 configure 脚本，需手动添加 DESTDIR/PREFIX 支持（INSTALLPATH=$(DESTDIR)$(PREFIX))"
  - "G0 clean-verify 对 makefile 类型项目无效，脚本假设所有项目都有 configure 脚本"
  - "memtester 无 --version 选项，在错误调用时显示版本号"

