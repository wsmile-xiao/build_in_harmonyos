software: matio
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.23/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.23"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-19"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://sourceforge.net/projects/matio/files/matio/1.5.23/matio-1.5.23.tar.gz/download"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DMATIO_MAT73=OFF"
    - "-DMATIO_WITH_HDF5=OFF"
    - "-DMATIO_SHARED=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-config-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS未被config.guess识别，需要修改config/config.guess添加HarmonyOS检测分支"
  - "CMake构建系统更适合HarmonyOS，避免autotools的临时目录权限问题"
  - "禁用MAT73和HDF5支持可以简化编译，避免额外依赖"
  - "静态库编译避免LLVM链接器的符号文件格式问题"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/matio-1.5.23.orig
  source_work_dir: /storage/Users/currentUser/builds/matio-1.5.23.work
  source_orig_hash: 62b5e3164cd184ae
  source_work_hash: e3215a1897e046ef
  generated_at: '2026-05-19T16:02:35'
  patches_count: 2

patch_classification:
  - file: 0001-config-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
