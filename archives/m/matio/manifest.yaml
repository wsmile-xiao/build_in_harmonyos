software: matio
# 软件级 manifest 模板
# 文件位置: archives/m/matio/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件描述
description: "MATIO is a C library for reading and writing MATLAB MAT files"

# 主页
homepage: "https://sourceforge.net/projects/matio/"

# 许可证
license: BSD-2-Clause

# 类别（用于依赖排序）
# library | tool | utility | development | system
category: library

# ============================================================
# 版本索引（软件级）
# ============================================================

# 已编译版本列表（按日期排序，最新在前）
versions:
  - version: "1.5.23"
    status: built
    build_date: "2026-05-19"
    build_system: cmake
    configure_options:
      - "-DCMAKE_BUILD_TYPE=Release"
      - "-DMATIO_MAT73=OFF"
      - "-DMATIO_WITH_HDF5=OFF"
      - "-DMATIO_SHARED=OFF"

# ============================================================
# 依赖关系（软件级）
# ============================================================

# 编译依赖（格式: software/version）
build_dependencies: []

# 运行依赖（格式: software/version）
runtime_dependencies: []

# ============================================================
# 知识索引（软件级）
# ============================================================

# 相关知识图谱条目
knowledge_links:
  - "E100: HarmonyOS config.guess detection"

# ============================================================
# 元数据
# ============================================================

# 首次编译日期
first_compile: "2026-05-19"

# 最后更新日期
last_updated: "2026-05-19"