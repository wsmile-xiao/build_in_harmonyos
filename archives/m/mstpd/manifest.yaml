software: mstpd
display: "mstpd — Multiple Spanning Tree Protocol daemon"
description: "IEEE 802.1D/802.1Q STP/RSTP/MSTP 用户态守护进程，附 mstpctl 管理 CLI 与 bridge-stp 网络钩子"
category: network
homepage: "https://github.com/mstpd/mstpd"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 release 不发 tarball，官方 tag 归档内没有生成好的 configure，必须 autoreconf 自举（tool_requires automake + libtool）"
    - "自举前需导出 SED/AUTOCONF/AUTOHEADER/AUTOM4TE 实测路径（E521），否则 libtoolize 把 ltmain.sh 放错目录"
    - "configure --build/--host 显式钉成 gnu 三元组：OHOS 内核 sysname 为 HarmonyOS，config.guess 推不出主机类型"
    - "AutotoolsToolchain 会把 sbindir 强制指向 prefix 下的 bin，故 bindirs 必须含 bin（adcli 的 rc=127 教训）"
    - "运行面依赖内核 bridge / netlink / PF_PACKET，属平台能力面；构建与 CLI 面已验证，内核面按探针披露（E237 口径）"
  common_dependencies: []

versions:
  "0.2.0":
    status: built
    build_date: "2026-09-26"
