version: "0.2.0"
software: "mstpd"

# built | published | failed | archived
status: built
build_date: "2026-09-26"
build_system: autotools

source:
  url: "https://github.com/mstpd/mstpd/archive/refs/tags/0.2.0.tar.gz"
  sha256: "37cbc03ab14763a2d477d2230508ab98c2acec43fa869b985c264d44e125c386"
  tar_format: tar.gz
  note: "上游 release 0.2.0 未附带任何资产，官方 tag 归档是唯一机器可读源；tag 名无 v 前缀"

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--disable-install-ifupdown-scripts"
  bootstrap: "autoreconf --install --force（tag 归档不含 configure）"
  # 编译期工具依赖（tool_requires，不进运行依赖闭包）
  dependencies:
    - automake/1.18
    - libtool/2.5.4
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-netif-utils-ethtool-speed-ohos.patch"
  - "0002-ctl-main-versionsort-alphasort-ohos.patch"

# 逐条取自本包 conan create 产物的 conanmanifest.txt，不手工罗列。
# AutotoolsToolchain 把 sbindir 钉成 ${prefix}/bin ⇒ 上游 sbin_PROGRAMS / sbin_SCRIPTS 全落 bin/；
# 上游 helper 目录是 $(libexecdir)/mstpctl-utils（Makefile.am:44），而 configure.ac:34 在
# exec_prefix 为空时把 libexecdir 定为 /lib（configure.ac:11 恒置空）⇒ 实际落 lib/mstpctl-utils，
# 不是 libexec/。
artifacts:
  bin:
    - mstpd
    - mstpctl
    - bridge-stp
    - "mstp_restart -> /bin/bridge-stp（install-exec-hook 建的符号链接）"
  lib/mstpctl-utils:
    - ifquery
    - ifupdown.sh
    - mstp_config_bridge
    - mstpctl-utils-functions.sh
    - "mstpctl_restart_config -> /bin/bridge-stp（install-exec-hook 建的符号链接）"
  etc:
    - bridge-stp.conf
    - bash_completion.d/mstpctl
  share:
    - man/man8/mstpctl.8
    - man/man5/mstpctl-utils-interfaces.5
    - doc/mstpd/README
    - doc/mstpd/README.VLANs
    - doc/mstpd/LICENSE

# R40：mstpd 经 netlink 路由套接字 + bridge sysfs + 私有 bridge ioctl 与内核网络栈交互，
# 属「系统底层：netlink」范畴；三键口径照 archives/i/iproute2/6.11.0/manifest.yaml:34-42。
# 每条读数的出处都写成本包实物路径，便于对字复核。
adaptation_review:
  rule: R40
  category: "系统底层：netlink"
  completeness: "需人工确认适配完整性（构建面与 CLI 面已验证；内核面两条硬能力在本平台被拒，见 notes.md 运行面能力矩阵）"
  runtime_verification:
    build_and_version: "已验证 —— B 机本地 W3（reports/w3-local-ci.log：G0/KC/JC/L0/L1/L2/L4/L5 全 pass）；消费者断言 executed=8 passed=8 failed=0；mstpd -V=0.2.0- rc=0、mstpctl -V=0.2.0- rc=0、mstpctl -h rc=0"
    netlink_functional: "部分可用 + 待人工确认 —— reports/capability-probes.txt 实拍：socket(AF_NETLINK,SOCK_RAW,NETLINK_ROUTE) rc=3、bind rc=0、RTM_GETLINK dump rc=32/2660 且 links=2；但同一次转储 bridge_kind=0（无桥设备），且 scandir 与 opendir 「/sys/class/net」全部 errno=13、按名直读 ifindex 亦 errno=13（正对照「/sys/class/tty」同 errno=13）⇒ mstpctl 的桥/端口枚举面在本平台不可用"
    netlink_write_ops: "未验证（需 root/CAP_NET_ADMIN）—— 本轮探针一律不提权、不请求能力；守护面实拍 packet_sock_init() 报 socket failed: Permission denied（PF_PACKET 被拒），addbridge/setbridge 等写路径因此未被执行，须在受控 aarch64 环境单独验证"

knowledge_gained:
  - "官方 tag 归档无 configure 时，仓内范式是 tool_requires automake/1.18 + libtool/2.5.4，且不声明 autoconf/m4（SDK 已提供，声明会引入与 SDK perl 冲突的 OHOS perl）"
  - "E521：libtoolize/automake 硬编码的 SED 路径在最小 OHOS 镜像上不存在，须导出实测路径后再 autoreconf"
  - "OHOS 内核 sysname 为 HarmonyOS，config.guess 推不出主机类型，须显式钉 --build/--host"
  - "AutotoolsToolchain 强制 sbindir 落在 prefix 的 bin 下，bindirs 只写 sbin 会让 conanrun PATH 找不到产物（adcli 实拍 rc=127）"
  - "mstpd 运行面（netlink/PF_PACKET/sysfs bridge/私有 bridge ioctl）在 HarmonyOS PC 上逐项探针取证；构建绿不代表内核面可用，按 E237 口径披露"
