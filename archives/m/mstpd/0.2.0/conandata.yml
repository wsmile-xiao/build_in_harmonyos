# conandata.yml — mstpd 0.2.0
#
# 取源说明（R39 / PF7）：上游 release 0.2.0 未上传任何 release 资产，
# 官方唯一机器可读源即 GitHub 的 tag 归档（tag 名不带 v 前缀）。
# sha256 由本机构建时对上述 URL 的实物自算。
sources:
  url:
    - "https://gh-proxy.com/https://github.com/mstpd/mstpd/archive/refs/tags/0.2.0.tar.gz"
    - "https://github.com/mstpd/mstpd/archive/refs/tags/0.2.0.tar.gz"
  sha256: "37cbc03ab14763a2d477d2230508ab98c2acec43fa869b985c264d44e125c386"

patches:
  - patch_file: "patches/0001-netif-utils-ethtool-speed-ohos.patch"
    patch_description: "OHOS sysroot linux/ethtool.h omits the kernel static inline ethtool_cmd_speed(); expand its body in place from struct ethtool_cmd.speed/speed_hi (same mechanism as ntopng 6.6 patch 0003 / libstatgrab 0.92.1 patch 0001)"
    patch_type: "portability"
  - patch_file: "patches/0002-ctl-main-versionsort-alphasort-ohos.patch"
    patch_description: "OHOS sysroot <dirent.h> declares no GNU versionsort(3) (grep across the whole SDK include tree: 0 hits; and -D_GNU_SOURCE is already on the real compile line for this very file, yet clang still reports use of undeclared identifier), so both scandir() comparators in ctl_main.c fall back to POSIX alphasort(3) under the __OHOS__ guard. Listing-order-only change for mstpctl showbridge/showport; no interface is hidden, nothing is disabled and no test is skipped (same mechanism as buildtorrent 0.9.1, alsa-lib 1.2.12, alsa-utils 1.2.14)"
    patch_type: "portability"
