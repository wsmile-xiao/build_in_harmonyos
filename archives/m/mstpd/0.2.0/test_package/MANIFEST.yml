# MANIFEST.yml — mstpd 0.2.0 test_package 声明
# 上游测试入口盘点（真实，未伪造）
#
# 清点证据（在解包后的官方 0.2.0 归档根目录实算）：
#   grep -cE '^[[:space:]]*(check|TESTS|check_PROGRAMS)[[:space:]]*[:+]?=' Makefile.am   -> 0
#   grep -c 'TESTS' Makefile.am                                                          -> 0
#   find . -type d -name tests                                                           -> 无
#   configure.ac 无 AC_CONFIG_TESTDIR / 无 --enable-tests 开关
# 结论：上游没有成体系的自动化测试用例（0 条），不存在被跳过的 make check。

upstream_tests:
  entries: 0
  list: []
  inventory_evidence:
    - "Makefile.am 无 check / TESTS / check_PROGRAMS 目标（计数为 0）"
    - "树内无 tests/ 目录"
    - "configure.ac 无测试相关开关；AC_CHECK_FUNCS 类探针属 configure，不是测试用例"
  in_binary_selfcheck:
    name: sanity_check()
    site: "main.c:159 由 main() 在选项解析后调用；-V 提前返回，不触发"
    content: "编译期/运行期 sizeof 断言（MST_ConfigurationIdentifier 等），成功打印 Sanity checks succeeded"
    reachable_without_root: true
    note: "守护路径，需前台 -d 运行；见 consumer_tests.capture"

consumer_tests:
  test_mstpd.sh: 6
  assertions:
    - "mstpd -V 退出码 0"
    - "mstpd -V 输出以 0.2.0 开头"
    - "mstpctl -h 打印 Usage: mstpctl"
    - "mstpctl -V 打印非空版本串且退出码 0"
    - "bridge-stp 通过 sh -n 语法检查且无未替换的 @token@ 模板占位"
    - "bridge-stp / mstp_config_bridge / ifquery 均已安装到包目录"
    - "mstpctl --version 长选项可执行且退出码 0"
  note: "计数以运行日志 MSTPD_TEST_SUMMARY executed= 为准，不以此处声明为准"

capability_probes:
  test_probe.c: 1
  groups:
    - "netlink route socket: socket/bind/getsockname/RTM_GETLINK dump"
    - "PF_PACKET raw 与 dgram socket（上游 BPDU 收发路径 packet.c:167）"
    - "AF_UNIX abstract 命名空间 bind + SO_PASSCRED（mstpctl 控制通道）"
    - "sysfs 桥设备枚举 /sys/class/net（正对照 /sys/class/tty）"
    - "pid 文件目录 /var/run 与 /run"
    - "epoll_create / epoll_ctl / epoll_wait（正对照 pipe）"
    - "接口 ioctl：SIOCGIFFLAGS / SIOCGIFHWADDR / SIOCETHTOOL / SIOCGIFBR（正对照 lo）"
    - "termios 家族（普查空白区补测，上游 mstpd 未使用）"
  evidence: "每项打印调用原样 + rc + errno + strerror，落在 out/capability-probes.txt"
  counted_as_assertions: false
