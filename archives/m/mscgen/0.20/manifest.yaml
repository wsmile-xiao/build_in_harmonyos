# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.20/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.20"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.mcternan.me.uk/mscgen/software/mscgen-src-0.20.tar.gz"

  # 源码校验和
  sha256: "3c3481ae0599e1c2d30b7ed54ab45249127533ab2f20e768a0ae58d8551ddc23"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
