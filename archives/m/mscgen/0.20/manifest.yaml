# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表 (inline format for G0 clean-verify regex compatibility)
  configure_options: "--without-png"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "flex"
    - "bison"
  # Note: libgd dependency omitted due to --without-png

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-src-main.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "mscgen hardcoded /tmp for mkstemp() (E002); patched to use TMPDIR env var"  # ref: E002
  - "Built --without-png due to libgd not available; SVG/EPS output works"  # ref: E080
  - "ISMAP output requires PNG/GD support, disabled without --without-png"  # ref: E080
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

