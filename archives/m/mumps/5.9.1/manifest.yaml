# 版本级 manifest

version: "5.9.1"
software: "mumps"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://mumps-solver.org/MUMPS_5.9.1.tar.gz"

  # 源码校验和
  sha256: "659c9b57646b5a003ac618baa1faf9dd2044e46c732b3daaccbc7158003e1b46"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表（MUMPS 通过 Makefile.inc 配置）
  configure_options:
    - "FC=flang-ohos (LLVM Flang 20.1.0)"
    - "CC=/data/service/hnp/bin/clang"
    - "LAPACK=-lopenblas (openblas/0.3.28)"
    - "OPTL 含 -resource-dir SDK/clang/15.0.4 --sysroot SDK/sysroot -L SDK/llvm/lib/aarch64-linux-ohos"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openblas/0.3.28
    - flang-ohos/20.1.0 (tool_requires)

  # 编译器
  cc: clang
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "MUMPS 为 Makefile 构建系统，通过生成 Makefile.inc 驱动（无 configure）"
  - "flang 编译的静态库须将 libFortranRuntime/Decimal/Common.a 打入包内供消费者链接"
  - "conan copy 保留通配符相对路径，src 须精确到源目录、dst 精确到目标目录，避免 lib/lib 嵌套"
  - "MUMPS 串行模式使用 libseq（自带 MPI 桩），无需真 MPI；头文件 mpi.h/mpif.h 须一并打包"
  - "flang 链接可执行需 -resource-dir SDK/llvm/lib/clang/15.0.4 --sysroot SDK/sysroot -L SDK/llvm/lib/aarch64-linux-ohos（libclang_rt.builtins.a / libunwind.a）"
