# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mumps/5.9.1
homepage: "https://mumps-solver.org/"

# 上游测试命令 (MUMPS 为 Makefile 构建，测试程序在 examples/ 目录)
upstream_check_command: "cd examples && make d s c z"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: examples/dsimpletest.F
    source: mumps-5.9.1/examples/dsimpletest.F
    description: "双精度实数测试，求解 diag(1..5) 线性方程组并校验解"
    command: "./dsimpletest < input_simpletest_real"
  - file: examples/ssimpletest.F
    source: mumps-5.9.1/examples/ssimpletest.F
    description: "单精度实数测试"
    command: "./ssimpletest < input_simpletest_real"
  - file: examples/csimpletest.F
    source: mumps-5.9.1/examples/csimpletest.F
    description: "单精度复数测试"
    command: "./csimpletest < input_simpletest_cmplx"
  - file: examples/zsimpletest.F
    source: mumps-5.9.1/examples/zsimpletest.F
    description: "双精度复数测试"
    command: "./zsimpletest < input_simpletest_cmplx"
  - file: examples/c_example.c
    source: mumps-5.9.1/examples/c_example.c
    description: "C 接口双精度测试（diag(1,2) 方程组，解 [1,2]）"
    command: "./c_example < input_simpletest_real"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 C 接口测试：dmumps_c 求解 diag(1,2) 方程组并校验解"
    command: "./test_mumps"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
