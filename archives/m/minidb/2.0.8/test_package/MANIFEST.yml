# 上游测试与消费者验证清单
package: minidb/2.0.8
homepage: "https://github.com/thp/minidb"
upstream_test_in_build: true
upstream_test_command: "sys.executable -m pytest --collect-only -q -p no:cacheprovider test/test_minidb.py; sys.executable -m pytest test/test_minidb.py -q -p no:cacheprovider"
upstream_tests:
  - name: "test/test_minidb.py（上游 pytest 套件；按 test_ 函数清点）"
    count: 42
    description: "HarmonyOS PC 实测：pytest 收集 42/42，42 passed、0 failed、0 errors、0 skipped；固定 PyPI 2.0.8 sdist 的原始测试文件，取数命令：grep -cE '^def test_' test/test_minidb.py。"
test_package_tests:
  - file: test_minidb.py
    count: 3
    description: "HarmonyOS PC 实测 3/3：以 Conan 的 sys.executable 在 conanrun 环境中导入已安装路径下的 minidb，验证目标解释器 sqlite3 SQL 往返、minidb 内存对象往返和文件数据库关闭/重开持久化；共 10 条断言。"
    command: "sys.executable test_minidb.py（Conan test()，env=conanrun）"
assertion_count: 10
