software: minidb
display: "minidb"
description: "Simple Python object store backed by SQLite 3"
category: library
homepage: "https://github.com/thp/minidb"
license: ISC
build_system: python

ohos_adaptation:
  key_points:
    - "纯 Python 单模块封装；Conan 包只复制 minidb.py 到 PYTHONPATH，不伪装成原生二进制。"
    - "test_package 使用目标消费者解释器实际导入 sqlite3/minidb 并执行内存及文件数据库操作。"
    - "消费者测试在 HarmonyOS PC 的目标 Python 中检查 sqlite3 运行时及 SQLite 数据库生命周期。"
  common_dependencies: []
  build_tool_dependencies:
    - "pytest/9.1.1"

versions:
  "2.0.8":
    status: built
    build_date: "2026-10-03"
    conan_ref: "minidb/2.0.8"
