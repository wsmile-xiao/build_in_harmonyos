software: mmh
display: "mmh — meillo's mail handler"
description: "Modern MH mail system: message-per-file storage, full MIME support (mhbuild/mhlist/mhshow/mhstore), gpg integration, scriptable commands + curses UI"
category: mail
homepage: "https://marmaro.de/prog/mmh/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub taught the aarch64-unknown-linux-ohos triplet."
    - "configure/config.status temp-dir umask relaxed (077 -> 022) for HMDFS (E011)."
    - "tgetent probe accepts the wide-character ncurses (libncursesw) shipped by conan ncurses/6.6."
    - "Test suite temp dir honors ${TMPDIR:-/tmp} (OHOS /tmp is read-only)."
    - "Distribution-shipped configure/config.h.in/stamp-h.in/sbr/dtimep.c are frozen before build (no autoconf/flex regeneration on re-patched sources)."
    - "Script-type commands (mmh/mhsign/mhpgp/mmhwrap/print-mimetype/sendfiles/whatnow2) need a shell prefix on OHOS: the kernel refuses shebang-script execve (rc 126); the C commands are unaffected."
  common_dependencies: []

versions:
  "0.4":
    status: built
    build_date: "2026-10-04"
