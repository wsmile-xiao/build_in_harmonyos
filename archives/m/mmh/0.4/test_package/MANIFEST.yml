# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mmh/0.4
homepage: "https://marmaro.de/prog/mmh/"

# 上游测试命令（随发行 tarball 分发：test/runalltests 驱动 test/tests/ 下 57 个
# test-* 脚本 / 28 个目录；runtest 逐例执行，rc 0=PASS / 120=SKIP / 其他=FAIL）。
# OHOS 真机经等效驱动执行（runtest 硬编码 /bin/sh 为可执行二元体探测点；见
# reports/upstream-test-run.md），实测结果见该报告。
upstream_check_command: "cd test && ./runalltests"
upstream_test_in_build: false
upstream_test_command: "sh reports/run-mmh-suite.sh（真机执行；等效复刻 runalltests：预置 test-temp-dir 跳过 setup-test 的 configure execve、LN=cp 绕开 HMDFS 硬链接限制、6 个脚本命令经 C launcher 垫片驱动；N/N′ 见 reports/upstream-test-run.md）"

upstream_tests:
  - file: test/tests/**
    source: "mmh-0.4.tar.gz 随发行 tarball 分发（test/runalltests -> test/runtest 驱动）"
    description: "上游官方测试套件 57 个 test-* 脚本 / 28 个目录（ali anno bad-input burst config dist folder inc manpages mhbuild mhl mhlist mhparam mhsign mhstore new pick prompter rcv refile repl scan send show spost whatnow whatnow2 whom）：覆盖命令行为、MIME 构建/列表/存储、prompter/send 投递、错误输入处理等；真机全量执行结果与逐例清单见 reports/upstream-test-run.md"
    command: "cd test && ./runalltests（真机等效驱动：sh reports/run-mmh-suite.sh）"

# 上游测试真机执行结果（R51 三步法：清点 N=57 → 真机实跑 N′=57 → 如实回填）
# 驱动：reports/run-mmh-suite.sh（runtest 模式；差异 D1-D7 见 reports/upstream-test-run.md）。
# 2 例 FAIL 均为平台不可构造/文件系统语义归因（anno=测试自造硬链接夹具在
# HMDFS EPERM；rcvstore=HMDFS 权限位归一 0660 使 find -perm 0600/640 落空），
# 6 例 SKIP 全部合法（缺 valgrind 1、上游自跳 1、缺 UTF-8 locale 4）；
# 逐例清单与定性见 reports/upstream-test-run.md 与 reports/test-report.md。
upstream_test_count: 57
upstream_passed: 49
upstream_failed: 2
upstream_skipped: 6

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "mmh 冒烟 4 例: mhparam -version 含 0.4 / mhparam version==0.4 / folder -create +smoke 落盘 / folders 列出 smoke（独立 context，不触 $HOME/Mail）"
    command: "bash test.sh"
  - file: test_e2e.sh
    description: "鸿蒙特有测试——完整消费者端到端用例（8 例）: mbox 夹具 inc -file 投递 -> scan 双 Subject -> pick -subject 检索 -> mhlist 部件列表（application/octet-stream）-> mhstore -auto -part 2 提取 base64 附件并校验内容 -> refile -src 归档 -> archive/inbox 终态复查；与批次邮件处理消费者的 CLI 通道同构"
    command: "bash test_e2e.sh"

# 测试用例总数 (test.sh 冒烟 4 例 + test_e2e.sh 端到端 8 例)
assertion_count: 12

# 完整消费者端到端用例数（test_e2e.sh，其 8 例已计入上方 assertion_count）
consumer_case_count: 1
