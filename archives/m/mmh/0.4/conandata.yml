sources:
  url:
    - "https://marmaro.de/prog/mmh/files/mmh-0.4.tar.gz"
  sha256: "cda8005bfd490c260d55edd8aa1d90f99a7997daf5e4271a91e423691929108e"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Teach the 2005-vintage config.guess about HarmonyOS (arm64/aarch64 -> aarch64-unknown-linux-ohos)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Teach config.sub the aarch64 CPU and the linux-ohos kernel-OS combination (routed around the silent linux -> linux-gnu normalization)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "Add wide-character ncurses (libncursesw) to the tgetent search order; relax config.status temp-dir umask (077 -> 022) so it stays usable on HMDFS"
    patch_type: "portability"
  - patch_file: "patches/0004-configure.ac.patch"
    patch_description: "Mirror the ncursesw search-order change in configure.ac (kept in sync with the generated configure)"
    patch_type: "portability"
  - patch_file: "patches/0005-man-Makefile.in.patch"
    patch_description: "man/Makefile.in: invoke version.sh, gettitles.sh and mh-chart-gen.sh via `sh` (OHOS kernel rejects shebang-script execve with EACCES); otherwise VERSION is silently empty in the man pages and `make all` dies in the titles/mh-chart.man7 rules (rc 126)"
    patch_type: "portability"
  - patch_file: "patches/0006-sbr-Makefile.in.patch"
    patch_description: "sbr/Makefile.in: invoke version.sh via `sh` (OHOS shebang execve EACCES) so the -DVERSION baked into version.o is populated"
    patch_type: "portability"
  - patch_file: "patches/0007-sbr-folder_addmsg.c.patch"
    patch_description: "Extend the cross-device (EXDEV) copy fallback in folder_addmsg() to filesystems without hard links (HMDFS returns EPERM on link(2)) so refile/rcvstore/mhstore-into-folder keep working"
    patch_type: "portability"
  - patch_file: "patches/0008-sbr-path.c.patch"
    patch_description: "sbr/path.c: honor the MMHETC environment variable in etcpath() ahead of the compiled-in NMHETCDIR. Conan packages install the format/component files (scan.default, pick.default, mhn.defaults, components, ...) into the package tree (--prefix=/ + DESTDIR), so every new_fs()/etcpath() lookup would otherwise die with 'unable to open format file' (inc/scan/pick/comp/forw); the recipe exports MMHETC=<pkg>/etc via runenv_info"
    patch_type: "portability"
  - patch_file: "patches/0009-test-setup-test.patch"
    patch_description: "test/setup-test: use ${TMPDIR:-/tmp} for the per-run temp dir instead of a hardcoded /tmp (OHOS /tmp is read-only)"
    patch_type: "portability"
  - patch_file: "patches/0010-uip-Makefile.in.patch"
    patch_description: "uip/Makefile.in: invoke version.sh via `sh` (OHOS shebang execve EACCES) so every command's compile-time -DVERSION string is populated"
    patch_type: "portability"
  - patch_file: "patches/0011-uip-mhpgp.sh.patch"
    patch_description: "uip/mhpgp.sh: per-run temp dir /tmp -> ${TMPDIR:-/tmp} (OHOS /tmp is read-only)"
    patch_type: "portability"
  - patch_file: "patches/0012-uip-mhsign.sh.patch"
    patch_description: "uip/mhsign.sh: per-run temp dir /tmp -> ${TMPDIR:-/tmp} (OHOS /tmp is read-only)"
    patch_type: "portability"
  - patch_file: "patches/0013-uip-sendfiles.sh.patch"
    patch_description: "uip/sendfiles.sh: draft temp file /tmp -> ${TMPDIR:-/tmp} (OHOS /tmp is read-only)"
    patch_type: "portability"
