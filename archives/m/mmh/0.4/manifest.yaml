knowledge_gained:
  - "E007: config.guess/config.sub 需要 HarmonyOS 分支与 linux-ohos 内核项，否则 configure 无法推断 aarch64-unknown-linux-ohos（mmh 用 AC_CANONICAL_TARGET 走 config.guess -> config.sub 规范化）。"
  - "E011: HMDFS 会把目录 owner 映射成固定 UID，configure/config.status 的 umask 077 临时目录不可写，改 umask 022。"
  - "OHOS 的 conan ncurses/6.6 只提供宽字符库 libncursesw.a（无 libncurses.a），mmh 的 tgetent 探测顺序 termcap curses ncurses tinfo 需补 ncursesw。"
  - "OHOS /tmp 只读（root:root 0755，真机探针实测不可写）：四个文件硬编码 /tmp 需改 ${TMPDIR:-/tmp}（test/setup-test、uip/mhsign.sh、uip/mhpgp.sh、uip/sendfiles.sh），否则 mhsign 等脚本 mkdir /tmp/<name>.$$ 直接退出 1。"
  - "HMDFS 不支持硬链接（link(2) 返回 EPERM，真机三处探针实测）：mmh 默认 dot-lock 完全依赖 link() 创建 .lock 文件，OHOS 需改用内核锁（--with-locking=fcntl，FCNTL_LOCKING -> lkopen_kernel 的 F_SETLK，真机实测 F_SETLK 可用）。"
  - "同一原因影响 folder_addmsg()（refile/rcvstore/mhstore 入箱的公共路径）：其复制回退原本只覆盖跨设备错误（EXDEV），需扩展到 EPERM/EOPNOTSUPP。"
  - "同一原因影响安装：uip/Makefile.in 的 install-lcmds 用 8 个硬链接造命令别名（flists/folders/fnext/fprev/unseen/prev/next/scan），HMDFS 上 make install 会 EPERM 失败；以 LN=cp 覆盖（命令本体按 argv[0] 分派，副本语义等价）。"
  - "mmh 发行包为手写 Makefile.in（无 automake），configure/config.h.in/stamp-h.in/sbr/dtimep.c 是 2019 年 autoconf/flex 产物，构建前冻结其时间戳可避免 make 触发再生成（根 Makefile 的 configure/stamp-h 规则与 sbr 的 dtimep 规则均已核对）。"
  - "OHOS 内核拒绝 shebang 脚本 execve（rc 126 EACCES，对文件设任何权限位/经 git 物化 +x 均无效），mmh 的 6 个 bin/ 脚本命令与 lib/mmhwrap 在真机需以 sh 前缀调用；C 命令不受影响。"
  - "同一条 shebang 限制影响构建期：man/sbr/uip 三个 Makefile 以反引号直执行 version.sh 拼版本串、man 目录另直执行 gettitles.sh（×4）与 mh-chart-gen.sh 生成标题/命令图，真机报 Permission denied（rc 126，make all 中断于 titles/mh-chart.man7）、VERSION 静默变空；补丁统一改 sh 前缀驱动（version.o 与所有命令的编译期 -DVERSION 才有值，man 构建得以继续）。"
  - "2019 年版 C 代码依赖 GCC<10 的暂定定义合并语义：char *tmp; 在 mhbuild.c 与 mhparse.c 各定义一次、另四处 extern 共享（mhstore/mhtest/mhlist/mhshow），clang>=11 默认 -fno-common 导致链接期 duplicate symbol；配方 CFLAGS 追加 -fcommon 复现上游构建语义（非源码缺陷，不落补丁）。"
  - "conan 以 --prefix=/ + DESTDIR 布局安装后在包内 etc/ 落 format/component 文件（scan.default、pick.default、mhn.defaults、components 等），而 mmh 编译期 NMHETCDIR 固定为 /etc（设备上不存在），new_fs()/etcpath() 直接 adios(EX_IOERR)，inc/scan/pick/comp/forw 全线不可用（真机 e2e 首跑 8 例全挂即此唯一根因）；补丁让 etcpath() 在编译期路径之前先查 MMHETC 环境变量，配方 package_info 以 runenv_info 导出 MMHETC=<包>/etc，经 VirtualRunEnv 对消费者自动生效（非 OHOS 特有，属包管理器/cache 布局定位）。"

