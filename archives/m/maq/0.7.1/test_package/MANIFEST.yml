# test_package/MANIFEST.yml
# 上游测试声明文件（CI L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: maq/0.7.1
homepage: "https://maq.sourceforge.net/"

# 上游测试命令
# 上游 0.7.1 无自动化测试套件：tarball 85 条目内无 tests/ 目录、无 .fa/.fastq 样例数据；
# Makefile.am 无 TESTS/check_PROGRAMS；configure.ac 无 AC_CONFIG_TESTDIR/BUILD_TESTING。
# `make check` 仅为 automake 的空 check-am 目标（0 个注册用例）。
upstream_check_command: "make check  # automake 空目标，无注册测试"

# conanfile.py build() 是否集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: "(无测试源文件)"
    source: "maq-0.7.1/(无 tests/ 目录；tarball 清单 85 条目内无测试程序与样例数据)"
    description: "上游未附带自动化测试；接口契约以 maq.pod（man 手册）文档化的子命令为准，验证按文档逐命令执行"
    command: "make check  # 0 个注册用例可运行"

# test_package 中自带的测试（消费者视角，真实驱动已安装的 maq 二进制）
test_package_tests:
  - file: "test_maq.sh"
    description: "驱动安装后的 maq 跑通上游 maq.pod EXAMPLES 关键链路：版本校验 → fasta2bfa → fastq2bfq(PE) → map(PE, -a 300) → assemble → mapstat/mapview；对 .bfa/.bfq/.map/.cns 产物做非空断言，并用 cns2ref 解出参考序列断言 '>chr1'"
    command: "bash test_maq.sh"

# 断言数：1 版本 + 2 转换 + 4 产物/内容断言 + 1 汇总 = 8
assertion_count: 8
