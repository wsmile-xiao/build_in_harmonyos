knowledge_gained:
  - 'config.guess(2006 版) 无 HarmonyOS 分支：E007 的 patch-autotools-ohos.pl 插入的 `*:HarmonyOS:*:*` 模式会因 uname -v（如 `#1 SMP Wed Apr 29 10:16:03 UTC 2026`）含冒号而失配，且该分支只赋值 GUESS 不输出；2006 版脚本按 `echo <triplet>; exit` 输出，须改为 `*:HarmonyOS:*` + echo/exit（knowledge_ref: E007, DRAFT-maq-0.7.1-config-guess-harmonyos-version-colon-mismatch）'
  - 'config.sub(2006 版) 不识 aarch64 与 linux-ohos：需同时补 maybe_os 列表(linux-ohos*)、CPU 列表(aarch64)、cpu-company 列表(aarch64-*)、os 分支(-linux-ohos)，否则 `Invalid configuration aarch64-linux-ohos: machine aarch64-linux not recognized`（knowledge_ref: E007）'
  - 'configure/config.status 以 `umask 077 && mktemp -d ./confXXXXXX` 建临时目录，HMDFS 上不可写（E011）→ 补丁 configure 内 2 处 umask 改为 022（tarball 无 automake 无法 autoreconf，属 build-systems §3.6 层级②）（knowledge_ref: E011）'
  - 'clang 15 两阶段名字查找：派生类模板调用依赖基类成员 direct_insert_aux 须显式 this-> 限定（stdhash.hh 3 处），知识库未命中已生成草稿（knowledge_ref: DRAFT-maq-0.7.1-stdhash-dependent-base-this-qualifier）'
  - '上游 perl 脚本 shebang 为 /usr/bin/perl，OHOS 无此路径（perl 在 /data/service/hnp/bin/perl）→ 统一改 /usr/bin/env perl（与仓内 abi-compliance-checker 先例一致）；注意 toybox env 不支持多参数，`-w` 需去掉（knowledge_ref: E049）'
  - 'SourceForge /download 重定向 URL 不带扩展名，解压器会误判为 gzip；官方 CDN 直链 downloads.sourceforge.net/...maq-0.7.1.tar.bz2 才能正确识别 tar.bz2（reference: 无对应知识条目（下载器扩展名识别行为））'
  - 'E490：conan create 前按知识库建议在配方内恢复 configure/config.guess/config.sub/install-sh/missing 执行位（knowledge_ref: E490）'
  - '上游无自动化测试套件（无 tests/、无 TESTS/check_PROGRAMS），验证依据 maq.pod 文档接口跑 45 项真实样例（45/45 PASS，含 5 项 OHOS 专项；34 个子命令覆盖 33 个，mapass2maq 因上游未文档化且无输入样例未实测）（reference: 无对应知识条目（遵循 R51 上游测试三步法））'

