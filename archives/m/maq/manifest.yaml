software: maq
display: "maq"
description: "MAQ — Mapping and Assembly with Qualities：短读比对、一致性组装与 SNP 检测套件（Heng Li）"
category: bioinformatics
homepage: "https://maq.sourceforge.net/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 为 2006 年版，需补 HarmonyOS 识别与 aarch64/linux-ohos 三元组（E007，注意 uname -v 含冒号导致的模式失配）"
    - "configure/config.status 的 umask 077 临时目录在 HMDFS 上不可写（E011）→ 改为 umask 022"
    - "stdhash.hh 依赖基类成员需显式 this-> 限定（clang 15 两阶段名字查找）"
    - "上游 perl 脚本 shebang /usr/bin/perl 在 OHOS 不存在 → /usr/bin/env perl"
    - "纯 CLI 工具（application），只暴露 bin/；无库与头文件"
  common_dependencies:
    - "zlib/1.3.2"

versions:
  "0.7.1":
    status: built
    build_date: "2026-09-30"
