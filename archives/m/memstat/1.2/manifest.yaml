# 版本级 manifest — memstat 1.2
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2"
software: "memstat"
status: built
build_date: "2026-09-29"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================
source:
  # memstat 1.2 的上游 tarball 只随 Debian pool 分发，而 deb.debian.org
  # 属 PF7 源 URL 硬黑名单，故改用 Debian 官方 Git 托管 salsa 的不可变
  # tag `debian/1.2`。memstat 是 Debian native 包，salsa 上的源码树与
  # 上游 memstat_1.2.tar.xz 逐文件 md5 一致（详见 notes.md）。
  url: "https://salsa.debian.org/debian/memstat/-/archive/debian%2F1.2/memstat-debian-1.2.tar.gz"
  sha256: "e4811be982d477a23d6a8df752f82cd94fcd8b81db7add6797856f47e2a3fa37"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: makefile
  configure_options: []
  dependencies: []   # 零三方依赖：仅 libc
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-memstat-c-musl-strtol-errno-and-path-max.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "musl 的 strtol() 对无数字字符串显式置 errno=EINVAL，glibc 不置；
     上游 memstat 用 'errno != 0' 判定 readdir() 条目解析失败，导致
     /proc 扫描在第一个 '.' 条目上 exit(1) —— 用 endptr 判别可移植修复"
  - "PATH_MAX 在 OHOS(musl) libc 下不被传递引入，用它定长声明缓冲区时
     必须显式 #include <limits.h>，否则级联出大量 undeclared identifier"
  - "sscanf 的 %Ns 写入 char buf[N] 需要 N+1 字节（含结尾 NUL），
     否则 OHOS 工具链报 -Wfortify-source 并实际越界写 1 字节"
  - "Debian native 包的 salsa 官方 Git 托管可作为上游源码的权威且
     不可变（打 tag）来源，规避 deb.debian.org 被 PF7 硬拦的问题"
