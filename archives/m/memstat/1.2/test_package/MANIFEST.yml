package: memstat/1.2
homepage: "https://salsa.debian.org/debian/memstat"

upstream_tests_exist: false
upstream_test_audit:
  - source: "memstat-debian-1.2 source tree root (5 files + debian/)"
    reason: "No tests/ or test/ directory present; the tree holds only memstat.c, memstat.conf, memstat.1, memstat-tutorial.txt, Makefile and debian/."
  - source: "Makefile"
    reason: "Only three targets are registered: `memstat` (implicit compile of memstat.c), `clean` and `install`. There is no check/test/verify target, so `make check` is not runnable upstream either."
  - source: "memstat.c full-text scan (396 lines)"
    reason: "No TEST/TEST_F/assert/cmocka/munit harness strings and no test driver; the only main() argument parsing is getopt(\"nvwp:\") for the reporting options."
  - source: "debian/rules + debian/control"
    reason: "Packaging is a plain `dh $@` native build with no test target and no Build-Depends on any test framework; Build-Depends is empty apart from debhelper."
  - source: "debian/source/format"
    reason: "Format is 3.0 (native) with no quilt series, so upstream carries no downstream-patched test suite either."
  - conclusion: "Upstream memstat 1.2 ships zero automated tests. This adaptation validates the packaged binary through test_package without claiming upstream coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_memstat.c
    description: "`memstat -v` must exit non-zero and print the version banner plus the full option list '[-n] [-v] [-w] [-p pid]' to stderr; asserting on 'usage:' distinguishes the real binary from a missing one (which would exit 127 with a shell diagnostic)"
    command: "test_memstat"
  - file: test_memstat.c
    description: "`memstat -Z` must reject the unknown option, emit a diagnostic and fall through to the usage banner instead of exiting 0 or silently"
    command: "test_memstat"
  - file: test_memstat.c
    description: "`memstat -n -p <self>` must exit 0, walk this process's real /proc/<pid>/maps, name this pid in the report, emit the '--------' separator and close with the grand-total line (regression case for the musl strtol fix in patches/0001)"
    command: "test_memstat"
  - file: test_memstat.c
    description: "`-p` must filter exclusively: a single-pid scan must yield exactly one process-summary line (regression case for the musl strtol fix in patches/0001)"
    command: "test_memstat"
  - file: test_memstat.c
    description: "`memstat -n -p 999999999` on a non-existent pid must exit 0 with a well-formed but empty report: separator present, grand total zeroed, no process lines"
    command: "test_memstat"
