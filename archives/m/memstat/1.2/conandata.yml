# conandata.yml — memstat 1.2
#
# Upstream: memstat by Michael Meskes <meskes@debian.org> / Joshua M. Yelon,
# maintained as the Debian "main" source package `memstat`.  It is a *native*
# Debian package (version "1.2" carries no debian revision), so the source
# tree in the official Debian Git host is byte-for-byte the pristine upstream
# 1.2 tarball -- memstat.c / Makefile / memstat.conf / memstat.1 /
# memstat-tutorial.txt all match memstat_1.2.tar.xz exactly.
#
# We pin the immutable `debian/1.2` tag (commit 00187c85f...) rather than a
# branch head so the URL content can never drift.
sources:
  url:
    - "https://salsa.debian.org/debian/memstat/-/archive/debian%2F1.2/memstat-debian-1.2.tar.gz"
  sha256: "e4811be982d477a23d6a8df752f82cd94fcd8b81db7add6797856f47e2a3fa37"

patches:
  - patch_file: "patches/0001-memstat-c-musl-strtol-errno-and-path-max.patch"
    patch_description: "0001 memstat.c make the proc scanner portable to the OHOS musl libc by including limits.h for PATH_MAX sizing perm for the %4s field and using the strtol endptr instead of errno to skip non numeric proc entries"
    patch_type: "portability"
