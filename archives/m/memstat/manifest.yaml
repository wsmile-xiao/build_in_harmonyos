# 软件级 manifest — memstat

software: memstat
display: "memstat"
description: "解析 /proc/<pid>/maps，按进程与共享对象汇总虚拟地址空间用量的诊断工具"
category: system

homepage: "https://salsa.debian.org/debian/memstat"
license: GPL-2.0

build_system: makefile

ohos_adaptation:
  key_points:
    - "源码照 glibc 编写，OHOS(musl) libc 下需补 <limits.h> 才能取到 PATH_MAX"
    - "read_proc() 用 'errno != 0' 判定 strtol 失败，musl 对非数字串置 EINVAL
       会导致 /proc 扫描在第一个 '.' 条目直接 exit(1)；须改用 endptr 判别"
    - "sscanf 的 %4s 写入 perm[4] 越界 1 字节，按字段宽度改为 perm[5]"
    - "构建系统为手写 Makefile（无 configure），make 命令行传 CFLAGS 才能
       覆盖 Makefile 内的 CFLAGS +="
  common_dependencies: []

versions:
  "1.2":
    status: built
    build_date: "2026-09-29"
