version: "8.0.46"
software: "mysql-client-8.0"

# published | built | failed | archived
status: built

build_date: "2026-09-12"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cdn.mysql.com/Downloads/MySQL-8.0/mysql-8.0.46.tar.gz"
  sha256: "e0d1a98ae5188c6a4efed74c74ff28115d4b791bc9d591a78e14d20aded67344"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DOHOS=1"
    - "-DWITHOUT_SERVER=ON"
    - "-DWITH_UNIT_TESTS=OFF"
    - "-DWITH_ROUTER=OFF"
    - "-DWITH_NDB=OFF"
    - "-DWITH_SSL=system"
    - "-DWITH_ZLIB=system"
    - "-DWITH_CURL=none"
    - "-DWITH_BUILD_ID=OFF"
    - "-DDOWNLOAD_BOOST=0"
    - "-DWITH_BOOST=<boost/1.84.0 include dir>"
    # try_run() presets for the OHOS cross toolchain:
    - "-DHAVE_SETNS_EXITCODE=1"
    - "-DHAVE_CLOCK_GETTIME_EXITCODE=0"
    - "-DHAVE_CLOCK_REALTIME_EXITCODE=0"
    - "-DHAVE_FALLOC_PUNCH_HOLE_AND_KEEP_SIZE_EXITCODE=0"
    - "-DHAVE___BUILTIN_FFS_EXITCODE=0"
    - "-DTEST_RUN_RESULT=0"
    - "-DTEST_RUN_RESULT__TRYRUN_OUTPUT=2.1.11-stable"

  dependencies:
    - openssl/3.5.6.1.1
    - zlib/1.3.1
    - ncurses/6.4
    - boost/1.84.0

  cc: clang
  cxx: clang++

