# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mbits-semver/0.1.1
homepage: "https://github.com/mbits-libs/semver"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/semver-test.cc
    source: semver-0.1.1/tests/semver-test.cc
    description: "C++ 自测程序：解析 1.3.0-beta.5+something.mixed.5 并校验编译期/运行时版本兼容性"
    command: "./semver-test"
  - file: tests/semver-test.py
    source: semver-0.1.1/tests/semver-test.py
    description: "ctest 包装脚本（官方 tag 缺失，本轮按最小补丁补齐），以 semver-test 退出码判定"
    command: "python3 tests/semver-test.py ./semver-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：仅经公开头文件调用 semver::project_version 解析/to_string 与 compatible_with"
    command: "./test_mbits-semver"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6