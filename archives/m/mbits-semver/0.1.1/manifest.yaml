# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.1"
software: "mbits-semver"
status: published
build_date: "2026-09-22"
build_system: "cmake"

source:
  url: "https://github.com/mbits-libs/semver/archive/refs/tags/v0.1.1.tar.gz"
  sha256: "edfa9b04bdffd8efbdea31c9cfd7064801483d8cab0b2de5734018bdb318cf18"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DSEMVER_TESTING=OFF"
    - "-DSEMVER_INSTALL=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "官方 GitHub tag tarball 不包含 .gitmodules 声明的子模块（tools/coveralls），CMake SEMVER_TESTING=ON 需 include 该文件会失败；配方中置 SEMVER_TESTING=OFF 即可，自测在测试台账另行运行"
  - "CMakeLists add_test 引用 tests/semver-test.py，但官方 v0.1.1 tag（及 main/master）均未包含该文件；以最小补丁补齐包装脚本使 ctest 可运行，属上游打包缺陷而非平台问题"
  - "test_package 源文件扩展名必须与工程语言声明一致：工程声明 CXX-only 时 .c 源文件触发 'Cannot determine link language'，改用 .cpp"
