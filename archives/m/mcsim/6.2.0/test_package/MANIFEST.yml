# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mcsim/6.2.0
homepage: "https://www.gnu.org/software/mcsim/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true

upstream_tests:
  - name: "examples/perc/Makefile（automake TESTS 注册项，make check 执行）"
    count: "1"
    description: "上游回归测试脚本（bash）：依次运行 mod 编译 perc.model 并与 ref_model.c 做 diff 比对（-PASSED-/-FAILED-），以及 makemcsim/sim 相关的数值回归检查"

test_package_tests:
  - file: test_mcsim.py
    description: "R34：运行被测二进制并断言行为——mod -h 输出 Usage（退出码 0）+ 用户模型文件编译生成 model.c（断言含状态变量符号）"
    command: "python3 test_mcsim.py <mcsim_pkg> <gsl_pkg>"
