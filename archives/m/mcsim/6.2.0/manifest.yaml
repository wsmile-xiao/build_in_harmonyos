# 版本级 manifest — mcsim 6.2.0
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "6.2.0"

# 软件名
software: mcsim

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/mcsim/mcsim-6.2.0.tar.gz"

  # 源码校验和
  sha256: "c6a3a685dfb9a6f0e99760f2628a91cf40798f6f05d4577e49fade9d80664f7e"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--prefix=/usr"
    - "--disable-shared"
    - "ac_cv_func_malloc_0_nonnull=yes"
    - "ac_cv_func_realloc_0_nonnull=yes"
    - "CFLAGS=-fsigned-char"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gsl/2.8

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（配方内联处理——无独立补丁文件）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - category: L1
    content: "知识库 E419（plain char signedness implementation-defined）复用实测：mcsim 的 CountChars 用 `char c; while ((c = getc(f)) != EOF)`——aarch64 上 plain char 默认 unsigned，EOF(-1) 截断为 255 永不相等 → mod 处理任何模型文件都死循环（实测 rc=124 挂起，AnnounceProgram 之后再无输出）。按 E419 推荐经 toolchain 统一 plain char 语义（CFLAGS 加 -fsigned-char，不改上游源码），构建后 mod 正常编译模型、上游 perc 回归 TEST1 通过"
    reason: "mcsim 6.2.0 实测（知识库命中：E419 rec_approach=consistent-target-signed-char-mode）"
  - category: L1
    content: "musl 的 malloc(0)/realloc(0) 语义使 autoconf 的 gnulib 老式检测判负（ac_cv_func_*_0_nonnull=no）→ config.h 把 malloc/realloc 宏定义为 rpl_*，而 mod_LDADD 未含 LIBOBJS 导致链接 undefined rpl_realloc。musl 行为符合 C99 允许范围——配置期以 ac_cv_func_malloc_0_nonnull=yes/ac_cv_func_realloc_0_nonnull=yes 覆盖检测即可用系统实现"
    reason: "mcsim 6.2.0 实测（首轮链接失败）"
  - category: L1
    content: "上游回归脚本（TESTS = examples/perc/Makefile）在本平台的两项适配：①shebang #!/bin/bash 在 OHOS 不存在（测试驱动报 bad interpreter exit 126）→ 改 POSIX sh 并把 bash 专用重定向 &> 改兼容写法；②脚本 TEST2-5 依赖 libsbml/sundials/lapack/mpi 与 gcc（制品仓未提供、超出本包依赖链）→ 在 TEST1（本包可验证部分）完成后明确记录 skipped 并按其结果退出，未静默删除任何断言"
    reason: "mcsim 6.2.0 实测（R51 逐项说明，详见 notes.md）"
