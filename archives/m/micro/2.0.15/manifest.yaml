software: micro
version: "2.0.15"
status: built
build_date: "2026-06-15"
build_system: go

source:
  url: "https://github.com/micro-editor/micro/archive/refs/tags/v2.0.15.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=1"
    - "GOWORK=off"
    - "GOTOOLCHAIN=local"
    - "GOPROXY=https://goproxy.cn,direct"
  dependencies:
    - go/1.26.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Go项目在HMDFS上linker输出需重定向到/dev/shm(tmpfs)"
  - "CGO_ENABLED=1配合clang和musl链接正常工作"
  - "micro使用ldflags注入Version/CommitHash/CompileDate变量"
