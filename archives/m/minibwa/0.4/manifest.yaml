package: minibwa/0.4
conanfile: conanfile.py
conandata: conandata.yml
description: Short-read aligner combining bwa-mem seeding with minimap2 chaining
url: https://github.com/lh3/minibwa/tree/v0.4
license: MIT AND GPL-2.0-or-later
homepage: https://github.com/lh3/minibwa
package_type: application
build_system: make
generator: none
exported: bin/minibwa
patches: []
options_overrides:
  mimalloc: "0"
options_overrides_rationale: "E210: upstream default links mimalloc with MI_OVERRIDE, which SIGSEGVs at startup on HarmonyOS; mimalloc=0 is an upstream-supported switch"
dependencies:
  - zlib/1.3.1
test:
  upstream_tests_in_build: true
  upstream_tests_in_build_detail: "make -C api-test (upstream CI command); mbmap-one run on shipped test/chrM data; packaged binary index+map round trip"
  test_package: true
  test_package_detail: "version subcommand + tiny generated reference index/map with deterministic 100M NM:i:0 SAM assertion"
  test_sh: true
  test_sh_detail: "same functional checks as test_package via /data/service/hnp/bin/bash"
knowledge_base_refs: E210
