package: minibwa/0.4
description: Consumer test for the minibwa application package
upstream_test_in_build: true
upstream_test_in_build_evidence: "conanfile.py build(): make -C api-test + mbmap-one/mbmap-batch chrM runs + minibwa index/map round trip on shipped test data"
test_type: conan_test_package

# Upstream tests = the api-test programs built by upstream CI (.github/workflows/
# build.yml: `make -j ... -C api-test`). Both are compiled in build() and run
# against the upstream-shipped test/ chrM fixture; results are real exit codes.
upstream_test_count: 2
upstream_passed: 2
upstream_failed: 0
upstream_tests:
  - file: api-test/ex-one.c
    source: minibwa-0.4/api-test/ex-one.c
    description: "Single-sequence C API example (mb_map loop): compiled by make -C api-test, run on shipped test/chrM data; exit 0, 1006 PAF lines, first record maps to chrM with cg:Z:151M"
    command: "mbmap-one <idxPrefix> test/chrM-read_1.fa.gz"
  - file: api-test/ex-batch.c
    source: minibwa-0.4/api-test/ex-batch.c
    description: "Batched C API example (mb_map_batch, PE disabled): compiled by make -C api-test, run on shipped test/chrM data; exit 0, 1006 PAF lines, first record maps to chrM with cg:Z:151M"
    command: "mbmap-batch <idxPrefix> test/chrM-read_1.fa.gz"
assertions:
  - "minibwa version outputs 0.4 and exits 0"
  - "minibwa index on generated 168bp reference exits 0"
  - "minibwa map produces a primary 100M NM:i:0 SAM record on RNAME tiny"
  - "minibwa --help exits 0"
  - "Removing bin/ makes conan test fail (L1e negative check)"
test_tools: [python3, subprocess]
generated_data:
  - "tiny-ref.fa: deterministic 168bp reference written by test_package"
  - "tiny-read.fq: 100bp exact substring read of the reference"
data_origin: generated
data_origin_notes: "Upstream test/ chrM data is exercised in build() (L1c); test_package uses tiny generated data for fast deterministic consumer smoke"
