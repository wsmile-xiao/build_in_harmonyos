package: minibwa/0.7
homepage: "https://github.com/lh3/minibwa"

upstream_check_command: "N/A: upstream Makefile has no check target; tests are the README chrM workflow + api-test programs"
upstream_test_in_build: false
upstream_test_command: "./minibwa index test/chrM-human.fa.gz chrM-human && ./minibwa map chrM-human test/chrM-read_1.fa.gz test/chrM-read_2.fa.gz"
upstream_tests:
  - "minibwa index chrM-human.fa.gz → exit 0, .l2b index produced"
  - "minibwa map (paired-end) → exit 0, 2013 SAM records (2000 primary + 13 supplementary; 5 mate-unmapped records legitimately lack NM), 1000 unique QNAMEs, all mapped records carry NM:i:"
  - "api-test ex-one.c / ex-batch.c against libminibwa.a → exit 0, 1006/1006 PAF lines, byte-identical output"

test_package_tests:
  - file: test_minibwa.py
    description: "Run the upstream chrM index+map workflow with the packaged binary and packaged test data; compile and run a C API consumer (upstream api-test ex-one.c pattern) against the packaged libminibwa.a/minibwa.h/kseq.h; verify ELF64 little-endian AArch64 and the .codesign section."
    command: "python3 test_minibwa.py <package-dir> <source-dir>"

assertion_count: 25
