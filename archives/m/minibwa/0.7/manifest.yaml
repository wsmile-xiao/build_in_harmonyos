software: minibwa
# 版本级 manifest
# 文件位置: archives/m/minibwa/0.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.7"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"

# 构建系统类型
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lh3/minibwa/archive/refs/tags/v0.7.tar.gz"

  # 源码校验和
  sha256: "8a1129bcba045e4af4b6fbf73b3fc6b42208afbab870c774c5f0cd2716d748ae"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（make 命令行变量，均为上游 Makefile 原生开关）
  configure_options:
    - "ARCH=aarch64（uname -m 探测在交叉场景不可靠，显式传递）"
    - "INCLUDES=-I<zlib>/include LDFLAGS=-L<zlib>/lib（Conan zlib 注入，bseq.c 的 KSEQ_INIT2 gzread 是唯一 zlib 依赖点）"
    - "gpl=1（上游默认，QSufSort/bwtgen IS 索引组件）"
    - "mimalloc=0（上游官方开关：kalloc 替换 mimalloc malloc override，后者在 OHOS emutls bootstrap 递归栈溢出，知识 E210）"
    - "make -j1（HMDFS 工作区无法承载 GNU make jobserver FIFO，知识 E074）"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 上游 Makefile 原生开关足够覆盖所有 OHOS 适配，无需补丁。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游为 raw Makefile（无 configure/install 目标），产物 = minibwa 二进制 + libminibwa.a + minibwa.h；包布局需 recipe 手动安装。"
  - "E210（复用）：mimalloc malloc override 在 OHOS emulated-TLS bootstrap 阶段于 __emutls_get_address 递归栈溢出（SIGSEGV）；上游 mimalloc=0 开关（kalloc）即最小修复。"
  - "E074（复用）：HMDFS 工作区无法承载 GNU make jobserver FIFO，make 必须串行（-j1）。"
  - "Makefile 的 ARCH 默认取 uname -m，交叉/容器环境必须显式传 ARCH=aarch64；aarch64 SIMD 由 ksw2 内置 s2n-lite.h NEON 层支持，无需额外 flag。"
  - "zlib 注入点：Makefile 的 INCLUDES/LDFLAGS 变量（上游 LIBS 是裸 -lz，系统链接路径看不到 Conan 缓存）。"
  - "上游无 check 目标：正式测试 = README chrM 流程（index + paired-end map，SAM 2013 行 = 2000 primary + 13 supplementary，全部带 NM tag）+ api-test 两个示例程序（链接 libminibwa.a）。"

# ============================================================
# 上游测试
# ============================================================

upstream_tests:
  exists: true
  test_count: 3
  command: "./minibwa index test/chrM-human.fa.gz chrM-human && ./minibwa map chrM-human test/chrM-read_1.fa.gz test/chrM-read_2.fa.gz > aln.sam"
  notes: >-
    上游 Makefile 无 check 目标，正式测试为 README 的 chrM 数据驱动流程
    （test/ 目录随源码分发）：① index（exit 0，产 .l2b）；
    ② paired-end map（exit 0，SAM 2013 行 = 2000 primary + 13 supplementary，
    1000 唯一 QNAME，mapped 记录 NM tag 全覆盖）；
    ③ api-test 程序 ex-one.c/ex-batch.c 链接 libminibwa.a
    （exit 0，PAF 各 1006 行，两程序输出逐字节一致）。
    另验证：--meth 甲基化模式（exit 0，2013 行）、fa2bit 小输入、
    version 输出 0.7-r421。详见 notes.md。

# ============================================================
# 消费者测试
# ============================================================

test_package:
  assertion_count: 25
  description: >-
    用包内 bin/minibwa + share/minibwa/test 数据重跑上游 chrM 流程
    （version/index/map + SAM 形状断言：2013 行、2000+ mapped 全带 NM、
    1000 唯一 QNAME）；用包内 include/minibwa + lib/libminibwa.a 编译并
    运行上游 api-test ex-one.c 模式的 C 消费者（RECORDS=1000、hits≥1000）；
    校验 ELF64 LE AArch64 与 .codesign 段。

# ============================================================
# 质量门禁
# ============================================================

quality_gates:
  W0_dependencies: "zlib/1.3.1.1，制品仓已有。"
  W1_source: "纯 C，raw Makefile，上游 v0.7 release tarball（r421）。"
  W4_local: "OHOS PC aarch64 本机串行构建通过；上游测试 3 组全通过；ELF 已 .codesign 自签名。"
  W5_shadow_ci: "本地 conan create + test_package 全流程通过（2026-09-16）。"
  R38_commands_json: "Passed：软件级 archives/m/minibwa/commands.json 已声明 0.7（binary: true）。"

blockers: []
