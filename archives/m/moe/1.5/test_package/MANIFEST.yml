# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: moe/1.5
homepage: "https://www.gnu.org/software/moe/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false

upstream_tests:
  - name: "无（上游 Makefile 的 check 目标为占位实现）"
    count: "0"
    description: "清点证据：①仓库无 tests/ 或 test/ 目录（顶层仅源码 .cc/.h、doc/、moerc）；②Makefile.in 的 check 目标为 `@echo \"No tests yet defined for $(pkgname)-$(pkgversion)\"`（无实际测试命令）；③无 automake TESTS/CMake add_test/pytest 注册入口"

test_package_tests:
  - file: test_moe.py
    description: "R34：运行被测二进制并断言行为——moe --version 输出含 1.5（退出码 0）、moe --help 输出用法（退出码 0）"
    command: "python3 test_moe.py <moe_pkg> <ncurses_pkg>"
