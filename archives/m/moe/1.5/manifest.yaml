# 版本级 manifest — moe 1.5
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.5"

# 软件名
software: moe

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/moe/moe-1.5.tar.gz"

  # 源码校验和
  sha256: "fa40d611fb36dd2145bbec5d35258be94247963cd6ec106395c87421007a0a43"

  # 压缩格式
  tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游为手写 configure + Makefile.in，非 autoconf）
  system: custom

  # 配置选项列表
  configure_options:
    - "--prefix=/usr"
    - "CXX=clang++"
    - "CXXFLAGS=-O2 -Wno-error"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ncurses/6.6

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无需补丁——一次构建通过）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - category: L1
    content: "GNU moe 用「手写 configure + Makefile.in」而非 autoconf：配置项（--prefix/CXX/CPPFLAGS/CXXFLAGS/LDFLAGS）只能以位置参数传入（环境变量不生效，脚本默认 CXX=g++），链接库在 Makefile 内硬编码 LIBS=-lncurses。处置：configure 命令行直接给 CXX=clang++ 与依赖 -I/-L，make 时用 LIBS='-lncursesw' 覆盖（ncurses/6.6 包导出 ncursesw 宽字符库）"
    reason: "moe 1.5 实测（一次构建通过）"
  - category: L1
    content: "上游无自动化测试的包（Makefile check 目标为占位 echo、无 tests/ 目录、无 TESTS/add_test 注册入口）需在 MANIFEST.yml 写明清点证据，并设计真实的消费者测试（R34：运行被测二进制并断言行为，如 --version 输出含版本号、--help 退出码 0）"
    reason: "moe 1.5 上游测试清点（R51 口径）"
  - category: L1
    content: "可执行程序包的归档需在软件级目录放 commands.json（R38：name/description/homepage/type=tool/versions.ref.alignments），package_type 用 application，package_info 声明 bindirs（本例 configure --prefix=/usr + DESTDIR → usr/bin）"
    reason: "moe 1.5 CLI 包要求（CI L0k/L0p 门禁）"
