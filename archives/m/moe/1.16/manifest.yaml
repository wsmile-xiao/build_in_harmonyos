software: moe
version: "1.16"
status: published
build_date: "2026-06-29"

source:
  url: "https://ftpmirror.gnu.org/gnu/moe/moe-1.16.tar.lz"
  sha256: "4c25cd78919272aebec0a7f8c126011bb5a4b5d87422807a3423216f0a17a868"
  tar_format: tar.lz

build:
  system: autotools
  configure_options:
    - "CXX=clang++"
    - "CXXFLAGS=-O2 -fPIC -I/storage/Users/currentUser/usr/local/include"
    - "LDFLAGS=-static -L/storage/Users/currentUser/usr/local/lib"
  dependencies:
    - "ncurses (系统预装, 静态链接 libncurses.a)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "E053: moe 的 configure 是手写脚本，默认 CXX=g++ 回退 c++，鸿蒙平台必须显式传 CXX=clang++"
  - "moe 使用 .tar.lz 格式分发，Python tarfile 不支持 lzip，需要系统 lzip 工具解压"
  - "moe 的 configure 不使用 config.guess/config.sub，不受 E007 影响"
  - "ncurses 头文件和库在 /storage/Users/currentUser/usr/local/ 下，需要显式指定 -I 和 -L 路径"
  - "使用 -static 标志实现完全静态链接，readelf -d 显示无动态段，满足 R26"

conan_reference: "moe/1.16@ohpcd/stable"
conan_verify: "PASS (G0-G4 + L2/L4/L5 全部通过)"
