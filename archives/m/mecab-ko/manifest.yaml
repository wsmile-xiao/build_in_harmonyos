# mecab-ko 软件级 manifest
# 文件位置: archives/m/mecab-ko/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: mecab-ko

# 软件描述
description: "韩语形态分析器 - MeCab Korean version"

# 软件分类
category: text_processing

# 官方网站
website: "https://bitbucket.org/eunjeon/mecab-ko"

# ============================================================
# 版本索引
# ============================================================

versions:
  - version: "0.996-ko-0.9.2"
    status: built
    build_date: "2026-06-05"
    package: "mecab-ko-0.996-ko-0.9.2-ohos-aarch64.tar.gz"
    package_size: "9.1M"
    notes:
      - "静态链接解决动态链接问题"
      - "ELF未签名，需首次执行确认"

# ============================================================
# 构建系统信息
# ============================================================

build_systems:
  - autotools

# ============================================================
# 依赖关系
# ============================================================

dependencies:
  runtime:
    - libc++_shared.so (系统自带)

  build:
    - clang/clang++ (系统自带)
    - automake (系统自带)
    - libtool (系统自带)

  optional:
    - mecab-ko-dic (韩语词典，需单独安装)

# ============================================================
# 平台支持
# ============================================================

platforms:
  - aarch64-unknown-linux-ohos

# ============================================================
# 许可证
# ============================================================

license: "GPL/LGPL/BSD"

# ============================================================
# 最后更新
# ============================================================

last_updated: "2026-06-05"
maintainer: "openharmony-compile-agent"