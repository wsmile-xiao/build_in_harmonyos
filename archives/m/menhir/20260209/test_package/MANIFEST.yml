# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: menhir/20260209
homepage: "https://gitlab.inria.fr/fpottier/menhir"

# 上游测试命令
upstream_check_command: "make -C demos test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make -C demos test"

# 上游实际运行的测试（demos/：dune @test 别名，逐字节 diff .exp 期望输出）
# 2026-10-04 真机实测（未改动源码 + 本包安装的 menhir）：10/12 通过；
# 2 例为上游 tag 自身不一致（calc-inspection 的 .exp 期望 require_unreleased、
# calc-GLR 引用 fix 而 vendored 库公开名为 vendored_fix），与 OHOS 适配无关。
upstream_tests:
  - name: "demos (12 dune @test 套件)"
    source: menhir-20260209/demos/
    description: "上游 demos 的 dune @test 对比测试（生成 parser.ml/.mli 与运行输出对 .exp 逐字节 diff）"
    command: "make -C demos test"
    result: "partial: 10/12 pass"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "menhir --version 返回 20260209"
    command: "menhir --version"
  - file: test.sh
    description: "code 后端生成 test.ml/test.mli 并断言文件存在"
    command: "menhir --code test.mly"
  - file: test.sh
    description: "ocamlopt 编译生成的解析器 + 手写驱动"
    command: "ocamlopt test.mli test.ml main.ml -o calc"
  - file: test.sh
    description: "运行解析器：1+2+4 → 7"
    command: "./calc '1+2+4'"
  - file: test.sh
    description: "负向：非法输入 1+ 触发 Parser.Error（exit 2）"
    command: "./calc '1+'"
  - file: test.sh
    description: "负向：未声明 token 的文法在生成期被拒绝"
    command: "menhir --code bad.mly"
  - file: test.sh
    description: "table 后端生成并经 -I menhirLib + menhirLib.cmxa 链接"
    command: "menhir --table + ocamlopt -I <prefix>/lib/menhirLib"
  - file: test.sh
    description: "运行表后端解析器：20+22 → 42"
    command: "./calc_table '20+22'"

# 测试断言总数
assertion_count: 13
