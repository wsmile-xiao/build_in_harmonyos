# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: mtdev/1.1.7
homepage: "https://bitmath.org/code/mtdev/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: mtdev-test.c
    source: mtdev-1.1.7/test/mtdev-test.c
    description: "mtdev test program that reads multitouch events from a device"
    command: "./mtdev-test /dev/input/eventX"
  - file: mtdev-matching.c
    source: mtdev-1.1.7/test/mtdev-matching.c
    description: "mtdev matching test"
    command: "./mtdev-matching"
  - file: mtdev-mapgen.c
    source: mtdev-1.1.7/test/mtdev-mapgen.c
    description: "mtdev mapping generator"
    command: "./mtdev-mapgen"
  - file: mtdev-kernel.c
    source: mtdev-1.1.7/test/mtdev-kernel.c
    description: "mtdev kernel test"
    command: "./mtdev-kernel"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 mtdev_new/mtdev_delete API 可用"
    command: "./test_mtdev"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
