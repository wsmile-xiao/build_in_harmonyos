package: mcap/0.3.0
homepage: "https://github.com/foxglove/mcap"

upstream_tests_exist: true

upstream_test_audit:
  source_tarball: "releases/cpp/v0.3.0.tar.gz (foxglove/mcap tag releases/cpp/v0.3.0)"
  source_sha256: "ef29ea4c09520b8aaa2d78ce5e79cbbcd87511ed14d6abf3c4b249ae67a4153b"
  build_system: "CMake + Conan v1 (cpp/test/conanfile.py uses `from conans import`; Conan 2 cannot reuse it, recipe compiles unit_tests.cpp manually with clang++)"
  test_definition: >
    Official C++ test closure is `make test-host` in cpp/Makefile, which runs
    only ./test/build/Debug/bin/unit-tests (Catch2). cpp/test/CMakeLists.txt
    registers no add_test(), so `ctest -N` is 0; the counting unit is the
    Catch2 TEST_CASE macro. cpp/test/unit_tests.cpp at v0.3.0 contains exactly
    8 TEST_CASEs (crc32 / Parse / write / readSummary / byteRange /
    readMessages / LZ4 compression / Read Order). The two conformance runners
    (streamed_reader_conformance / streamed_writer_conformance) are single-shot
    JSON converters driven by tests/conformance/scripts/run-tests (Node.js +
    TypeScript cross-language harness), not part of `make test-host`; the recipe
    additionally smoke-runs the reader runner over 5 bundled .mcap samples
    (exit 0 + non-empty JSON with "records").
  per_file_test_macros: "cpp/test/unit_tests.cpp 8 / streamed_reader_conformance.cpp 0 (runner, no TEST_CASE) / streamed_writer_conformance.cpp 0 (runner, no TEST_CASE)"
  gating: "unit_tests.cpp 通读无 #if/#ifdef/#ifndef 门控，无注释掉的 TEST_CASE"
  dependency: "catch2 (upstream 2.13.8, recipe uses published 2.13.10) + nlohmann_json (upstream 3.10.5, recipe uses published 3.12.0) + lz4/zstd (runtime)"
  portability_changes:
    - "upstream cpp/test/conanfile.py 为 conan v1 语法，Conan 2 下改由 recipe 内 clang++ -std=c++17 直接编译（-I mcap/lz4/zstd/catch2/json，-llz4 -lzstd），不改动任何测试语义"
    - "OHOS clang++ 注入的链接参数用 -Wno-unused-command-line-argument 抑制（沿用 magic_enum/mapbox-geometry 做法）"

upstream_check_command: "grep -c TEST_CASE cpp/test/unit_tests.cpp (=8) + ./unit-tests"
upstream_test_in_build: true
upstream_test_command: "build() 内编译 ./unit-tests 并真实执行（Catch2 汇总行解析），另 smoke streamed-reader-conformance（5 个 .mcap 样本）"

upstream_tests:
  - file: "cpp/test/unit_tests.cpp"
    source: "mcap-releases-cpp-v0.3.0/cpp/test/unit_tests.cpp"
    description: "Catch2 单元测试（8 个 TEST_CASE：crc32、Parse、write、readSummary、byteRange、readMessages、LZ4 compression、Read Order）"
    command: "./unit-tests"
  - file: "cpp/test/streamed_reader_conformance.cpp"
    source: "mcap-releases-cpp-v0.3.0/cpp/test/streamed_reader_conformance.cpp"
    description: "conformance reader runner smoke（5 个 tests/conformance/data/*.mcap 样本，exit 0 + 非空 JSON），完整 diff 需 Node.js harness（不在 make test-host 闭环内）"
    command: "./streamed-reader-conformance <sample.mcap>"

upstream_test_total: 8
upstream_test_count_method: auto
upstream_test_passed: 8
upstream_test_failed: 0
upstream_test_count: 8

test_package_tests:
  - file: test_mcap.cpp
    scenario: "consumer-api"
    description: "消费者回环：writer.open/addSchema/addChannel/write/close + reader.open/readMessages（payload/sequence 校验）— 6 断言"
    command: "./test_mcap"
    assertions: 6
  - file: test_mcap_ohos.cpp
    scenario: "ohos-feature"
    description: "鸿蒙定向：LZ4/ZSTD/uncompressed 三种压缩回环 + TMPDIR 可写探测 — 4 断言"
    command: "./test_mcap_ohos"
    assertions: 4

assertion_count: 10
