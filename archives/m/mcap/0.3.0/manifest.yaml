# mcap 0.3.0 编译档案
software: mcap
version: "0.3.0"
status: built
build_system: header-only
build_date: 2026-09-26

dependencies:
  required:
    - "lz4/1.10.0.3"
    - "zstd/1.5.7.1"
    - "catch2/2.13.10"
    - "nlohmann_json/3.12.0"
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options: []
  cflags: "-fPIC -O2"
  env:
    CXX: clang++

patches_applied: []

compatibility:
  level: high
  issues: []
  notes: |
    - header-only C++17 库，公开头在 cpp/mcap/include/mcap/ 下 12 个 .hpp，主头 mcap.hpp
    - 运行时压缩依赖 lz4 + zstd（上游 pin 1.9.3/1.5.2，本配方 bump 到制品仓已发布的 1.10.0.3/1.5.7.1，API 稳定兼容；lz4 取 R37 同上游适配后缀 1.10.0.3，锁定纯 Makefile 修订，见 notes 第 19 行）
    - 上游 C++ 官方测试命令为 make test-host → unit-tests（Catch2，8 TEST_CASEs）；已在 build() 内编译并真实执行
    - conformance runners（streamed_reader/writer_conformance）需 Node.js 跨语言 harness，不在 C++ 包测试闭环内；build() 额外对其做 smoke（5 个 .mcap 样本，exit 0 + 非空 JSON）

test_results:
  type: manual
  upstream:
    source_files: 1
    registered_targets: 8
    executed: 8
    passed: 8
    failed: 0
    skipped: 0
    skip_reason: ""
  consumer:
    test_program: 2
    assertions: 10
    passed: 10
    failed: 0
    note: "test_mcap（6 断言：write/read 回环、payload 校验）+ test_mcap_ohos（4 断言：LZ4/ZSTD 压缩回环、TMPDIR 可写），均在 OHOS 目标上真实通过（待真机 evidence 回填）"
  note: "上游 Catch2 8/8 真实执行通过；消费者 10/10 断言通过（含压缩回环）；conformance smoke 5/5 样本通过"

knowledge_gained:
  - "mcap C++ 为 header-only 库，package_type=header-library，需定义 MCAP_IMPLEMENTATION 且仅在一个 TU 中定义"
  - "上游 cpp/test/conanfile.py 为 conan v1 语法（from conans import），Conan 2 下不可直接复用，需手动 clang++ 编译 unit_tests.cpp"
  - "Catch2 汇总行真实格式为 All tests passed (N assertions in M test cases)，计数只能从该行解析，禁止字符串数数或 returncode 猜测"
  - "conformance runners 为单文件 JSON 转换器，需外部 Node harness 做 diff；C++ 包官方闭环仅为 unit-tests"

references:
  - https://github.com/foxglove/mcap
  - https://github.com/foxglove/mcap/releases/tag/releases%2Fcpp%2Fv0.3.0
