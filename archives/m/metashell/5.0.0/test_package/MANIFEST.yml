# test_package MANIFEST — metashell 5.0.0
software: metashell
version: "5.0.0"
test_type: consumer

# 上游测试审计（R51）：官方全量 ctest 口径 36 项（真机 ctest -N 实测），口径 ctest_entries。
# 真机 ctest -N 实测 36（含 gcc 2 项，说明预检有 g++）；templight 需独立
# LLVM 二进制（本配方跳过），预计以 environment 缺口失败，详见 notes.md。
upstream_tests_exist: true
upstream_test_total: 36
upstream_test_count_method: ctest_entries
upstream_test_audit: "test/unit 11 个 add_test 二进制；test/system/core 6 项
  （internal 2 + templight 2 + clang 2）、mdb 6 项、pdb 1 项（wave）、pp 9 项
  （system 6 + gcc 2 + wave 1，msvc 仅 Windows）、auto_engine 1 项；
  Linux/gcc 全量 11+6+6+1+9+1=34，另有 config_test 等注册项，真机 ctest -N 实测 36，以实测为准。源码：test/*/CMakeLists.txt 与
  cmake/Modules/MetashellSystemTest.cmake 的 register_* 函数。"

test_cases:
  - name: "metashell --help 可运行"
    command: "metashell --help（退出 0 且输出非空）"
    expected: "PASS: T1"
  - name: "metashell --engine wave 空输入启动"
    command: "printf '' | metashell --engine wave --nosplash（EOF 退出 0）"
    expected: "PASS: T2"
  - name: "metashell --engine wave 冒烟"
    command: "typedef 输入管道进 metashell --engine wave --nosplash（退出 0）"
    expected: "PASS: T3"

consumer_notes: |
  消费者用例均真实执行已安装公开二进制 bin/metashell（非库私有头文件）；
  3 用例以 shell 变量显式计数，标记 discovered/passedCount 为真实用例数。
  默认 auto/clang 引擎需宿主 clang++（构建期写死检索路径），OHOS 预检/CI 均不可用（CI #62937 T2 exit=1，clang++ not found），故消费者启动语义改测 wave 引擎（T2 空输入、T3 typedef 求值）；上游 clang/templight 子集仍在 ctest 中如实执行并以 gaps 说明，未跳过。
