software: metashell
display: "metashell"
description: "C++ 模板元编程交互式 Shell"
category: dev-tool
homepage: "https://github.com/metashell/metashell"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，C++17，第三方依赖全部随源码 vendored，无需外部 conan 依赖"
    - "跳过 Templight LLVM 独立构建，find_package(Templight) 未找到时主构建仍可继续"
    - "关闭文档生成，避免 mkdocs/python 文档链依赖"
  common_dependencies: []

versions:
  "5.0.0":
    status: built
    build_date: "2026-09-27"
