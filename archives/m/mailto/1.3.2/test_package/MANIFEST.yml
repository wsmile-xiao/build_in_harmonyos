# test_package/MANIFEST.yml — mailto 1.3.2
package: mailto/1.3.2
homepage: "https://www.apache.org/distware/mailto/"

# 上游无独立测试套件：mailto 1.3.2 是 1999 年的两文件 CGI（mailto.c + util.c），
# 上游 Makefile 只有 all / install / clean / dist / check / depend；
# 其中 check 目标只是 `lint -u` + `gcc -fsyntax-only`，属于语法检查而非功能测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_mailto.c
    description: >-
      消费者测试 17 条断言。mailto 是 CGI 可执行程序、没有可链接的库 API，
      因此用例按"CGI 程序的真实调用方式"验证：把包内 bin/mailto 以子进程拉起，
      对其输出做确定性断言。四组用例全部零网络、零 sendmail：
      (1) -v 输出含 `mailto v1.3.2` 与作者署名 `Andreas Ley`；
      (2) -h 输出含 `Usage:` 与选项说明 `[-h] [-v]`；
      (3) 裸调用（不设任何 CGI 环境变量）走 QUERY_STRING 为空的默认分支，
          输出完整 CGI 响应，断言含 `Content-type: text/html` 与
          `<TITLE>WWW Mail Gateway</TITLE>` —— 这是 mailto 的核心功能
          （CGI 表单网关），比只验证"能启动"强得多；
      (4) 非法选项 -Z 输出含 `unrecognized option` 诊断并给出 Usage。
      所有断言文本均取自 qemu-aarch64 + OHOS sysroot 下的**实测输出**，
      并额外校验四组调用均未被信号杀死（rc<0 / >=128 / 126 / 127 一律判失败）。
    command: "test_mailto <package_root>"

# 测试断言总数
assertion_count: 17
