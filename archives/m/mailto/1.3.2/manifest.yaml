software: mailto
display: "mailto"
description: "Apache's WWW Mail Gateway CGI: turns an HTTP form submission into a MIME mail and hands it to the local MTA (1999 vintage)"
category: net
homepage: "https://www.apache.org/distware/mailto/"
license: Apache-2.0
build_system: custom  # 2 个 .c + 上游 Makefile 只有 all/install/clean，conanfile 直驱 clang；install 目标写死 BSD bsdinst 与 /usr/machine/etc/httpd，交叉环境不可用

ohos_adaptation:
  key_points:
    - "两源文件（mailto.c 18KB + util.c 2.4KB）加两个消息头，零外部依赖"
    - "仅 libc：stdio、stdlib、sys/types、sys/stat、fcntl、sys/time、sys/resource、unistd、sys/socket、netdb、string、signal、syslog、arpa/inet、netinet/in、sys/mman、errno"
    - "★ 唯一适配点：util.c 的 getline() 与 POSIX.1-2008 / OHOS sysroot 的 getline(3) 符号冲突（conflicting types），patch 0001 改名为 mailto_getline，函数体与行为不变"
    - "上游 Makefile 无配置步骤、无自动依赖探测，all 目标即 $(CC) $(CFLAGS) $(OBJECTS) -o $@；install 写死 BSD 的 bsdinst 与 /usr/machine/etc/httpd，与 OHOS 无关，故 build() 直驱 clang"
    - "编译告警来自 1999 年的 gnu89 代码（format 串风格、赋值当条件、块注释嵌套），均不影响正确性，用 -w 静默"
    - "产出 bin/mailto（约 28KB），不安装 sendmail（OHOS 无此程序），发信路径由调用方接管"
    - "★ 裸调用（无 CGI 环境变量）会输出完整 CGI 响应：Content-type: text/html + <TITLE>WWW Mail Gateway</TITLE> 默认表单 → CI 可做零网络、零 MTA 的行为验证"
  common_dependencies:
    - libc (stdio, stdlib, sys/types, sys/stat, fcntl, sys/time, sys/resource, unistd, sys/socket, netdb, string, signal, syslog, arpa/inet, netinet/in, sys/mman, errno)

patches:
  - id: "0001-rename-getline-to-avoid-posix-sysroot-clash.patch"
    reason: "util.c 定义的 getline(char*, int, FILE*) 与 OHOS sysroot <stdio.h> 中 POSIX getline(3) 声明冲突，默认可见性下编译失败"
    strategy: "保留函数体，仅将符号重命名为 mailto_getline；上游无 util.h 且 mailto.c 未调用该函数，无其它调用点需同步"
    behavior_change: false

versions:
  "1.3.2":
    status: built
    build_date: "2026-09-28"
    source_url: "http://deb.debian.org/debian/pool/main/m/mailto/mailto_1.3.2.orig.tar.gz"
    source_sha256: "74050d4dae4b3f32ba9f5069251394887b6f044f8c68ef49a0e350876d0d1c99"
    test_assertions: 17
