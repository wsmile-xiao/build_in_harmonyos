# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 zip 无 pos-id.def / model.def：mecab-dict-index 回退最小 pos-id 表（'minimum setting is used' 警告，exit 0，索引可用）" (knowledge_ref: E251)
  - "mecab-dict-index 不复制 dicrc 到输出目录，运行时词典目录必须手动补 dicrc（输出格式/cost-factor 配置）" (knowledge_ref: E251)
  - "HarmonyOS 无系统 mecabrc（/usr/local/etc/mecabrc 不存在）：消费者须 mecab_new2(\"-d <dicdir> -r <rcfile>\") 显式指定，词典目录 dicrc 携带输出格式配置" (knowledge_ref: E251)
  - "unidic 输出为 8 列格式（表層,pron,lForm,lemma,pos,cType,cForm,aType），助词行尾 cType/cForm/aType 为空" (knowledge_ref: E251)
  - "clrd.ninjal.ac.jp 在中国大陆常不可达，dotsrc.org(OSDN) 镜像字节一致（SHA256 相同）" (knowledge_ref: E251)
  - "本包区别于 mecab-ipadic/mecab-ko-dic（纯源数据）：必须在构建期用 mecab-dict-index 编译二进制索引（sys.dic ~179MB, matrix.bin ~68MB）" (knowledge_ref: E251)
