# test_package/MANIFEST.yml — mecab-unidic-extended 2.1.2
# NLP dictionary + compiled index package (Japanese UniDic kana-accent for MeCab)
type: data
test_type: consumer
test_file: conanfile.py
description: |
  mecab-unidic-extended 2.1.2 consumer verification, split into two clearly
  separated test groups (both run from test_package/conanfile.py test()):

  [1/2] GENERIC CONSUMER TEST (platform-neutral, src/test_package.cpp):
  builds a C++ consumer that links libmecab (mecab/0.996), loads the
  packaged UniDic binary indices via mecab_new2("-d <dicdir> -r <empty-rc>")
  and verifies the tokenization of すもももももももものうち against a
  golden output captured from a verified on-device build (8-column unidic
  format incl. the aType accent column), plus a second sentence structural
  check and the UNIDIC_EXT_DICDIR runenv contract.

  [2/2] HARMONYOS-SPECIFIC TEST (OHOS only, src/ohos_specific_test.cpp):
  15 assertions that can only pass when built AND executed on a HarmonyOS
  PC — see harmonyos_specific_tests below. Skipped with an explicit
  SKIPPED message on non-OHOS hosts.

upstream_tests:
  count: 0
  evidence:
    - "Upstream release zip unidic-mecab_kana-accent-2.1.2_src.zip (27 files,
       SHA256 70793cac…, full listing enumerated): NO test/, tests/, spec/,
       CI config, .sh/.pl/.py test scripts — the archive is dictionary data
       (lex.csv 756,463 entries, matrix.def 5981x5981, *.def, dicrc) plus
       autotools install scaffolding only"
    - "configure.ac: AC_PATH_PROG(MECAB_CONFIG) + --with-dicdir/--with-user-dic
       options only — no AC_CONFIG_TESTDIR, no test discovery"
    - "Makefile.am: only dic_DATA install + mecab-dict-index compile rules —
       no TESTS/check_PROGRAMS targets"
    - "Makefile.in check:/check-am: targets are empty automake boilerplate
       (check-am: all-am runs nothing); distcheck is generic packaging glue"
    - "NINJAL ships no test suite with any UniDic dictionary release (data
       publication, not a code project)"
  conclusion: "N=0 — no upstream tests exist to execute"

test_coverage:
  file_existence: true
  env_var_export: true
  libmecab_link: true
  index_loading: true
  tokenization_golden: true

# [1/2] test_package 中自带的测试 (普通消费者视角, 平台无关)
test_package_tests:
  - file: src/test_package.cpp
    description: >-
      普通消费者测试（generic MeCab consumer，平台无关）：链接 libmecab，
      mecab_new2("-d <dicdir> -r <空rcfile>") 加载包内二进制索引，
      golden 字节级比对（すもももももももものうち，8 列 unidic 格式含 aType 列）
      + 第二句切分结构校验（形態/素/解析/は/面白い + EOS）
      + UNIDIC_EXT_DICDIR runenv 契约
    command: "conan create … -tf && test_package <dicdir> <rcfile>"

# [2/2] 鸿蒙特有测试 (HarmonyOS-specific)：只在 OHOS 上构建并真机执行才可能通过
# 验证产物在 HarmonyOS PC 上可用所必需的平台属性与 OHOS 消费者加载路径
harmonyos_specific_tests:
  - file: src/ohos_specific_test.cpp
    description: >-
      鸿蒙专项测试 15 项断言（编译期 OHOS 目标属性 + 运行时平台身份 +
      自身 ELF64/AArch64/musl 解释器身份 + OHOS 目标 libmecab 真实加载
      打包词典）
    command: "ohos_specific_test <dicdir> <rcfile> (os=OHOS 时由 conanfile.py 自动执行)"
    assertion_count: 15
    checks:
      - "T1a 编译期 __OHOS__ 已定义（aarch64-unknown-linux-ohos 目标；普通 Linux 构建无此宏）"
      - "T1b 编译期 __OHOS_FAMILY__ 已定义"
      - "T1c __MUSL__ 仅 info 诊断、不断言（OHOS Clang 不定义该宏；musl 真实判据为 T4 PT_INTERP=/lib/ld-musl-aarch64.so.1）"
      - "T1d 编译期 __aarch64__ 已定义（AArch64）"
      - "T2 运行时 uname().sysname == 'HarmonyOS'（Linux 主机报 'Linux'）"
      - "T3a 自身 ELF magic（经 /proc/self/exe 解析）"
      - "T3b 自身为 ELF64（EI_CLASS=2）"
      - "T3c 自身小端（EI_DATA=1）"
      - "T3d 自身 e_machine == EM_AARCH64 (183)"
      - "T4 自身 PT_INTERP == /lib/ld-musl-aarch64.so.1（OHOS musl 动态加载器；glibc Linux 用 /lib64/ld-linux-aarch64.so.1）"
      - "T5 OHOS 目标 libmecab（clang aarch64-unknown-linux-ohos + musl + libc++）真实加载包内 UniDic 二进制索引"
      - "T6a mecab_dictionary_info 可用（sys.dic 已加载）"
      - "T6b 索引 charset == utf8"
      - "T6c 索引 size == 756463 词条（官方 2.1.2 lex.csv 条目数）"
      - "T6d 连接矩阵 == 5981x5981（lsize=rsize=5981）"
      - "T7 OHOS 加载的索引真实分词（すもも… + EOS）"

# 测试断言总数:
# 普通消费者测试 1 个可执行（golden 8/8 行 + 第二句 + env 契约）
# + HarmonyOS 专项测试 15 项断言（另有 T1c __MUSL__ info 诊断，不断言）; 上游正式测试 N=0（无测试可执行）
assertion_count: 16
