software: minimap
display: "minimap"
description: "基于 minimizer 的长序列快速近似比对工具与库"
category: utility
homepage: "https://github.com/lh3/minimap"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 C；依赖 zlib（Conan zlib/1.3.1）、libm；pthread 随 OHOS bionic libc 提供"
    - "同时打包 CLI（bin/minimap）、静态库（lib/libminimap.a）与头文件（minimap.h/bseq.h/kseq.h）"
    - "命令行工具，软件级提供 commands.json（R38）"
  common_dependencies:
    - zlib

versions:
  "0.2":
    status: built
    build_date: "2026-09-15"
    conan_ref: "minimap/0.2"
