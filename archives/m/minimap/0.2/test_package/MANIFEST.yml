# test_package/MANIFEST.yml
# minimap 0.2.
#
# Upstream ships no test suite: there is no tests/ directory and the Makefile
# defines all/minimap/extra/clean/depend only. Coverage is provided by a CLI
# harness plus a library consumer compiled against the installed package.

package: minimap/0.2
homepage: https://github.com/lh3/minimap

upstream_tests_exist: false
upstream_test_audit: "no tests/ directory; Makefile targets all/minimap/extra/clean/depend (no check/test)"
upstream_check_command: "n/a"
upstream_test_in_build: false
upstream_test_command: "n/a (no upstream tests)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_minimap.py
    description: "-V、无参 usage、直接映射出 hit、索引 dump+load 映射出 hit"
    command: "python3 test_minimap.py <path-to-minimap>"
  - file: test_minimap_consumer.c
    description: "链接安装后的 libminimap.a + 头文件，建索引并映射，统计命中数"
    command: "./test_minimap_consumer target.fa query.fa"

test_files:
  - path: "test_package/test_minimap.py"
    test_type: "R34/R51(补全)"
    assertion_count: 4
  - path: "test_package/test_minimap_consumer.c"
    test_type: "R34"
    assertion_count: 1

test_package_test_count: 2
consumer_assertion_count: 5
assertion_count: 5
