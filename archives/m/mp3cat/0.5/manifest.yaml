software: mp3cat
version: "0.5"
status: built
build_date: "2026-08-30"
conan_ref: "mp3cat/0.5"

source:
  url: "https://github.com/tomclegg/mp3cat/archive/refs/tags/0.5.tar.gz"
  sha256: "b1ec915c09c7e1c0ff48f54844db273505bc0157163bed7b2940792dca8ff951"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  cppflags: []
  dependencies:
    required: []
    optional: []
  cc: clang
  ldflags:
    - "-static"

commands:
  - mp3cat
  - mp3log
  - mp3log-conf
  - mp3dirclean
  - mp3http
  - mp3stream-conf

patches_applied:
  - 0001-Makefile.patch
  - 0002-mp3cat.c.patch

test_results:
  upstream_command: ""
  upstream_scope: "Upstream ships no test suite: no tests/ dir, no test source files, no check/test Makefile target. See test_package/MANIFEST.yml for full evidence chain."
  test_package: "Constructs minimal MP3 frame fixtures (SHA-verified), runs real CLI behavior tests: --version/--help exit 0, passthrough of 3 frames yields 192 bytes (lookahead), cleaning of garbage+frames yields identical output, empty input yields 0 bytes, bad usage exits 1."
  local_status: "Native patched build validated all fixture expectations before embedding in test_package."
  device_status: "pending OHOS AArch64 conan create + test_package"

remote_status:
  mp3cat_ohpcd_list: "pending"

knowledge_gained:
  - "tomclegg/mp3cat (C, GPLv2) is distinct from dmulholl/mp3cat (Go, MIT); only the former has a 0.5 tag."
  - "mp3cat frame_length() requires lookahead: a frame is only emitted if the next frame is also valid and matching version+layer, so N identical frames yield N-1 in output."
  - "MPEG-1 Layer I, 64kbps, 32kHz, no padding => 96-byte frame; minimal valid fixture for frame validation testing."
  - "Upstream Makefile hardcodes `cc`; Conan recipe patches it to $(CC)/$(CFLAGS)/$(LDFLAGS) + DESTDIR for staging."
