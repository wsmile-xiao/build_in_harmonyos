# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: mp3cat/0.5
homepage: "https://github.com/tomclegg/mp3cat"

# Upstream test command (from `make -n check` / test target analysis)
upstream_check_command: "make check"

# Does conanfile.py build() integrate upstream tests?
upstream_test_in_build: false

# Upstream test command actually run (empty = no upstream tests exist)
upstream_test_command: ""

# Upstream tests actually present in the source tarball
# Evidence: tarball (22 files) contains no tests/ dir, no test_*.c files,
# no check/test target in Makefile (only: all, install, install_bin,
# install_scripts).  grep for test|check|assert|unittest across all
# *.c, *.h, Makefile returns zero matches.  The example.* files are
# operational deployment shell scripts (audio logger / stream server),
# not tests.  See notes.md for the full evidence chain.
upstream_tests: []

# test_package consumer tests (fill the gap left by absent upstream tests)
test_package_tests:
  - file: test.sh
    description: "Verifies --version/--help exit 0, passthrough of 3 MP3 frames yields 192 bytes (lookahead drops trailing frame), cleaning of garbage+frames yields identical 192-byte output, empty input yields 0 bytes, and bad usage (1 arg) exits 1."
    command: 'sh test.sh <three.mp3> <dirty.mp3> <tmpdir>'
  - file: conanfile.py
    description: "Constructs minimal MP3 frame fixtures programmatically (MPEG-1 Layer I, 64kbps, 32kHz), verifies fixture SHA256 before use, runs test.sh, and verifies output file size + SHA256 (concatenation result integrity)."
    command: "conan test"

# Approximate assertion count for quality assessment
assertion_count: 10

test_modifications:
  - "No upstream tests exist to modify or remove."
  - "test_package fills the gap with real CLI behavior tests using minimal, SHA-verified, programmatically-constructed MP3 frame fixtures (no opaque binary blobs committed)."
