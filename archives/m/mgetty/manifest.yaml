software: mgetty
display: "mgetty+sendfax"
description: "智能 getty（拨入登录）与 class-2 传真套件（sendfax/faxspool/faxrunqd/G3 图像工具）"
category: comms
homepage: "http://mgetty.greenie.net/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 工程（无 configure）：复制 policy.h-dist → policy.h；CC/CFLAGS/LDFLAGS 由 Conan AutotoolsToolchain 提供（R33），命令行覆盖 Makefile 硬编码值"
    - "LP64：追加 -DPTR_IS_LONG，使 config.h 的 p_int 为 long（否则 conf_mg.c 静态初始化报错）"
    - "musl/OHOS 无 sys_nerr/sys_errlist → 补丁 0001 改用 strerror()（logfile.c）"
    - "musl/OHOS 无 libutil（上游 LIBS=-lutil）→ LIBS 置空"
    - "fax 前端由 sedscript 生成、构建树中不可执行 → 打包时 chmod 755；login/mgetty/sendfax.config 需显式构建目标"
    - "产物：13 个可执行文件 + etc/mgetty+sendfax 默认配置 + lib/mgetty+sendfax 数据文件（faxq-helper 上游装在 LIBDIR 且 setuid 4711，本包统一放 bin/ 且不设 setuid）"
  common_dependencies: []

versions:
  "1.2.1":
    status: built
    build_date: "2026-10-10"
    conan_ref: "mgetty/1.2.1"
