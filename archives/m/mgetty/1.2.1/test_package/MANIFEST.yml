# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）

package: mgetty/1.2.1
homepage: "http://mgetty.greenie.net/"

# 上游测试入口：`make test`（顶层 Makefile）→ 依次执行 g3/ 与 t/ 两个子目录的 test 目标。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test（build() 内实际执行，输出见 notes.md）"
upstream_tests:
  - file: g3/Makefile
    source: mgetty-1.2.1/g3/Makefile
    description: "G3 图像工具套件（pbm2g3/g32pbm/g3cat）：对角线 G3 编码与参考文件 cmp、g3cat 文件/stdin 复制一致性、-r 反相二次转换一致、-h 与文件拼接等价、-a/-R/-p 各档位输出字节数精确断言（47/54/42/52/102/1002/47）、-L/-w 行数宽度断言；结束时打印 'all G3 program tests passed!'"
    command: "cd g3 && make test"
  - file: t/Makefile
    source: mgetty-1.2.1/t/Makefile
    description: "模块级测试：t_config、t_ring（C 程序，TEST_PROGRAMS）+ t_echo、t_trap、t_g3file（sed 生成的 shell 脚本，TEST_SCRIPTS），另编译 t_g3f_c 作为 t_g3file 的辅助程序；全部通过时打印 'OK'"
    command: "cd t && make test"

# test_package 消费者测试（真实执行安装后的可执行文件）
test_package_tests:
  - file: test_mgetty.sh
    description: |
      消费者测试（25 条断言）：13 个已安装工具的存在性/可执行性；G3 工具的真实功能——
      pbm2g3 编码字节数（47）、g3cat 文件与 stdin 复制逐字节一致、g3cat -a/-R/-p
      各档位字节数（54/42/52/102/1002）、g3cat -p 100 -a | g3cat -（47）、
      g3cat 拼接与 -h 10 等价；sendfax/sff2g3 用法输出。任一断言失败返回非零。
    command: "bash test_mgetty.sh <package>/bin"
    assertion_count: 25
  - file: test_ohos.sh
    description: |
      鸿蒙专项测试（16 条断言）：13 个可执行文件均为 ELF64/AArch64 目标对象
      （llvm-readelf -h）；全部无 Linux 专有动态依赖（libutil/libpthread/librt）；
      pbm2g3 在 OHOS 上可实际执行；G3 流水线在设备上字节确定（g3cat -p 100 -a -R
      = 1002 字节）。任一断言失败返回非零。
    command: "bash test_ohos.sh <package>/bin"
    assertion_count: 16

assertion_count: 41

notes: |
  上游有测试：`make test` 依次跑 g3/ 与 t/ 两套（R51 三步法：清点 → build() 内实跑 →
  本文件如实回填）。g3/ 为 G3 图像工具的字节级比对（含 6 档 -p/-a/-R 精确字节数与
  多处 cmp 一致性），t/ 为 2 个 C 程序 + 3 个 shell 脚本（另 1 个 C 辅助程序）。
  test_package 为消费者视角：直接运行安装后的命令行工具，覆盖同样的 G3 字节契约，
  并额外做鸿蒙平台断言（ELF64/AArch64、无 Linux 专有依赖、设备端确定性）。
