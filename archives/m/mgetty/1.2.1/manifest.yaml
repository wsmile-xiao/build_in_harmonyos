version: "1.2.1"
status: built
build_date: "2026-10-10"
conan_ref: "mgetty/1.2.1"

source:
  # 官方发布点仅提供明文 HTTP/FTP（https 443 实测拒连；http 与 ftp 同一份原件，
  # sha256 一致）。源 URL 为官方地址（R39 官方源；仓库内明文官方 http 先例 70 例）。
  url: "http://mgetty.greenie.net/source/1.2/mgetty-1.2.1.tar.gz"
  sha256: "c8a72f5ca4142e30627ad16725c40692fb09e6284514392b95ac02062cac9a89"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "无 configure 脚本（上游 Makefile 工程）：复制 policy.h-dist → policy.h 后直接 make"
    - "CC/CFLAGS/LDFLAGS 来自 Conan Toolchain（AutotoolsToolchain，R33），命令行覆盖 Makefile 硬编码值"
    - "CFLAGS 追加 -DPTR_IS_LONG（config.h 在 LP64 下选 long p_int；上游自带开关）"
    - "LIBS 置空（上游默认 -lutil 为 Linux 专有；OHOS/musl 无此库）"
    - "目标：bin-all + login.config/mgetty.config/sendfax.config（后者由 ./sedscript 生成）"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-logfile.c.patch"

knowledge_gained:
  - "mgetty 是纯 Makefile 工程（无 configure）；上游要求先复制 policy.h-dist → policy.h，再按需改 Makefile 的 CC/CFLAGS/*DIR 后 make/make test/make install"
  - "LP64 移植：config.h 用 PTR_IS_LONG 决定 p_int 是 long 还是 int；64 位目标不加该宏会在 conf_mg.c 报 'initializer element is not a compile-time constant'（(p_int) 字符串常量）"
  - "musl/OHOS 不提供 sys_nerr/sys_errlist（logfile.c 直接 extern 引用）→ 改用标准 strerror()（无平台宏，跨 libc 可移植）"
  - "musl/OHOS 无 libutil（上游 LIBS=-lutil 为 Linux 专有）→ LIBS 置空后链接通过（openpty/logwtmp 在 musl 的 libc 中）"
  - "mgetty 的 fax 前端（faxspool/faxrunq/faxq/faxrm/faxrunqd）由 ./sedscript 从 *.in 生成，构建树中不可执行；打包需显式 chmod 755（HMDFS 会把权限归一到 770，仍可执行，E046）"
  - "login.config/mgetty.config/sendfax.config 不在 tarball 内，而是由 *.cfg.in 经 sedscript 生成，需显式构建目标才会出现在构建树中"

