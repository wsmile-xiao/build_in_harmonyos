software: multitime
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5"

# 构建系统
build_system: autotools

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ltratt/multitime/archive/refs/tags/multitime-1.5.tar.gz"

  # 源码校验和
  sha256: "4cef12f00ab0f77a2dcc1dcd2838319cdc125afe3fbf27edcc7b809388b1fa78"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # Bootstrap 命令（源码包无 configure 脚本时需要）
  bootstrap: "make -f Makefile.bootstrap"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.bootstrap.patch"
  - "0002-Makefile.in.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "GitHub tag tarball 不含预生成 configure 脚本，需 make -f Makefile.bootstrap bootstrap"
  - "autoconf config.status 的 umask 077 在 HMDFS 上导致权限拒绝（目录 owner ≠ 当前用户），需 sed 改为 umask 007"
  - "multitime 无 make check 测试套件，需手动功能验证"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/multitime-1.5.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/multitime-1.5.work
  source_orig_hash: 7f13d8069e40a696
  source_work_hash: 547f9363e05cde32
  generated_at: '2026-06-25T11:57:08'
  patches_count: 3

patch_classification:
  - file: 0001-Makefile.bootstrap.patch
    type: bootstrap
    platform_only: True
    guard: 'test ! -f configure && test -f configure.ac'
    description: '修改 bootstrap 规则生成 configure.real 而非 configure，添加 umask 077→007 修复'
  - file: 0002-Makefile.in.patch
    type: cleanup
    platform_only: True
    guard: 'grep -q configure.real Makefile.bootstrap'
    description: 'distclean 目标中 configure→configure.real，与 0001 保持一致'
  - file: 0003-configure.patch
    type: wrapper
    platform_only: True
    guard: 'test ! -f configure && test -f configure.ac'
    description: '新增 configure 包装脚本，自动检测并运行 Makefile.bootstrap 生成 configure.real'
