software: mate-menus
display: "mate-menus"
description: "MATE desktop menu implementation library"
category: system
homepage: "https://mate-desktop.org"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 无法识别 HarmonyOS，使用 patch-autotools-ohos.pl 补丁"
    - "HMDFS 文件系统限制：configure 中的 umask 077 导致临时文件创建失败"
    - "config.sub 需要手动添加 linux-ohos kernel-os 组合支持"
    - "需要禁用 introspection (--enable-introspection=no)"
  common_dependencies:
    - glib

versions:
  "1.28.0":
    status: built
    build_date: "2026-06-09"