software: mate-menus
version: "1.28.0"
status: built
build_date: "2026-06-09"

source:
  url: "https://pub.mate-desktop.org/releases/1.28/mate-menus-1.28.0.tar.xz"
  sha256: ""
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--enable-introspection=no"
  dependencies:
    - "glib/2.88.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

knowledge_gained:
  - "E007: config.guess 无法识别 HarmonyOS，使用 patch-autotools-ohos.pl 补丁"
  - "HMDFS 文件系统限制：configure 中的 umask 077 导致临时文件创建失败，需修改为 022"
  - "config.sub 需要手动添加 linux-ohos kernel-os 组合支持"
  - "mate-menus 需要禁用 introspection (--enable-introspection=no) 以避免 gobject-introspection 工具链问题"
  - "musl 与 glib 预编译包的兼容性问题：glib 依赖 __fd_chk 等 glibc 特有函数"