software: mycli
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.74.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.74.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/dbcli/mycli/archive/refs/tags/v1.74.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表 (pip install --target, Python project)
  configure_options:
    - "pip_install"
    - "SETUPTOOLS_SCM_PRETEND_VERSION=1.74.0"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - python3/3.12.8
    - click/8.3.3
    - cryptography/44.0.0
    - Pygments/2.19.2
    - prompt_toolkit/3.0.41
    - PyMySQL/1.1.1
    - sqlparse/0.5.0
    - configobj/5.0.9
    - wcwidth/0.6.0
    - pyperclip/1.11.0
    - pyfzf/0.3.1
    - rapidfuzz/3.11.0
    - keyring/25.7.0

  # 编译器 (pure Python, no native compilation)
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
    - "0001-remove-cryptography-dep.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Python 项目使用 pip --target 安装到 staging 目录，而非传统 configure/make (ref: E050)"
  - "GitHub tarball 缺少 git 元数据，需要 SETUPTOOLS_SCM_PRETEND_VERSION 环境变量 (ref: E041)"
  - "cryptography >=46 需要 Rust 编译器，OpenHarmony 无 Rust，需降级使用系统预装版本 (ref: E001)"
  - "纯 Python 项目无需 ELF 签名/strip/RPATH 处理 (ref: E077)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/mycli-1.74.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/mycli-1.74.0.work
  source_orig_hash: aff5c60cdf0b1635
  source_work_hash: 361bf43273678862
  generated_at: '2026-06-09T22:36:53'
  patches_count: 1

patch_classification:
  - file: 0001-pyproject.toml.patch
    type: auto
    platform_only: True
    guard: 'pending'
