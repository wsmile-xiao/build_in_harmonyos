software: mpc
display: "GNU MPC"
description: "GNU Multiple Precision Complex Library - Complex number arithmetic library based on GMP and MPFR"
category: math
homepage: "https://www.multiprecision.org/mpc/"
license: LGPL-3.0-or-later
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "需要修复 config.guess 和 config.sub 以支持 ohos 三元组"
    - "需要手动设置 CFLAGS 和 LDFLAGS 指向 gmp 和 mpfr 的安装路径"
    - "configure 和 config.status 的临时目录创建需要修改为可写路径"
    - "静态库编译需要绕过 libtool，直接使用 ar 创建"
  common_dependencies:
    - gmp
    - mpfr

# 版本索引
versions:
  "1.3.1":
    status: built
    build_date: "2026-06-08"
    notes: "编译成功，仅提供静态库。由于 libtool 兼容性问题，未生成共享库。"