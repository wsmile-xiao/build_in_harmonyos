version: "1.3.1"
status: built
build_date: "2026-06-08"

source:
  url: "https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz"
  sha256: ""  # 未验证
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies:
    - gmp/6.3.0
    - mpfr/4.2.1
  cc: clang
  cxx: clang++

  # 手动编译步骤（绕过 libtool）
  manual_build: true
  build_steps:
    - "export PKG_CONFIG_PATH=/storage/Users/currentUser/usr/local/lib/pkgconfig"
    - "export CFLAGS='-I/storage/Users/currentUser/usr/local/include'"
    - "export LDFLAGS='-L/storage/Users/currentUser/usr/local/lib'"
    - "export TMPDIR=/storage/Users/currentUser"
    - "./configure --prefix=/storage/Users/currentUser/usr/local"
    - "修改 config.status 临时目录为固定路径"
    - "./config.status"
    - "cd src && make -j4"
    - "ar rcs libmpc.a *.o (绕过 libtool)"

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0003-config.status.patch"
  - "0004-configure.patch"

knowledge_gained:
  - "config.guess 需要添加 __OHOS__ 宏检测以识别 HarmonyOS"
  - "config.sub 需要在 kernel-os 白名单添加 linux-ohos* 以验证三元组"
  - "configure 和 config.status 的临时目录创建逻辑需要修改为可写路径"
  - "预编译包缺少 libgmp.la 时，libtool 会报错 'is not a valid libtool archive'"
  - "静态库编译可绕过 libtool，直接使用 ar rcs 创建"
  - "gmp 预编译包应包含 libgmp.la 文件以支持 libtool 链接"

# 编译环境
environment:
  platform: "aarch64-unknown-linux-ohos"
  compiler: "clang 15.0.4"
  build_tool: "GNU Make 4.4.1"

# 特殊说明
notes:
  - "由于 libtool 兼容性问题，本版本仅提供静态库（libmpc.a）"
  - "未生成共享库（libmpc.so）"
  - "未完成质量门禁验证（G0-G4）"
  - "手动打包流程，未通过 ohc-run.py package 标准 9 步流程"

# 交付物
deliverables:
  static_library:
    path: "packaging/mpc-1.3.1-ohos-aarch64.tar.gz"
    size: "10KB"
    contents:
      - "lib/libmpc.a (319KB, 已 strip)"
      - "include/mpc.h"
  source_patches:
    count: 4
    files:
      - "patches/0001-build-aux-config.guess.patch"
      - "patches/0002-build-aux-config.sub.patch"
      - "patches/0003-config.status.patch"
      - "patches/0004-configure.patch"