# test_package/MANIFEST.yml
# memsafe 0.4.0 — 上游测试声明
package: memsafe/0.4.0
homepage: "https://github.com/rsashka/memsafe"

# 上游测试命令（NetBeans Makefile 项目，UNITTEST 配置；未用 ctest/meson）
upstream_check_command: "make -f nbproject/Makefile-UNITTEST.mk"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（gtest，11 个 TEST 用例；8 通过，3 项受平台/工具链限制）
upstream_tests:
  - file: memsafe_test.cpp
    source: memsafe-0.4.0/memsafe_test.cpp
    description: "上游 gtest 单元测试：Sizes/Cast/Class/Threads/Depend/ApplyAttr/Separartor/MemSafeFile/WeakList 8 项通过；Sizes 为 OHOS libc++ ABI sizeof 断言差异；Plugin/Cycles 需 clang-20 插件（本机 clang 15）未运行"
    command: "./memsafe_unittest"

# test_package 自带测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用 memsafe.h 公开 API（Shared/Weak/Locker/set）编译链接运行并验证可观察结果"
    command: "./test_memsafe"

# 测试断言总数（gtest 断言 + 消费者断言）
assertion_count: 4
