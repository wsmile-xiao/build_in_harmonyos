# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: manif/0.0.5
homepage: "https://github.com/artivis/manif"

upstream_check_command: "ctest -N"

# conanfile.py build() 中未集成上游测试（库配方 keep 最小构建），
# 上游 gtest 测试单独在本轮适配中枚举并运行（见 reports/）
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（gtest 目标，见 test/CMakeLists.txt）
upstream_tests:
  - file: test/gtest_misc.cpp
    source: manif-0.0.5/test/gtest_misc.cpp
    description: "通用工具测试（Eigen/gtest 辅助函数）"
    command: "./gtest_misc"
  - file: test/rn/gtest_rn.cpp
    source: manif-0.0.5/test/rn/gtest_rn.cpp
    description: "R^n 流形单元测试"
    command: "./gtest_rn"
  - file: test/so2/gtest_so2.cpp
    source: manif-0.0.5/test/so2/gtest_so2.cpp
    description: "SO(2) 群单元测试（exp/log/compose/act/Jacobian）"
    command: "./gtest_so2"
  - file: test/so3/gtest_so3.cpp
    source: manif-0.0.5/test/so3/gtest_so3.cpp
    description: "SO(3) 群单元测试"
    command: "./gtest_so3"
  - file: test/se2/gtest_se2.cpp
    source: manif-0.0.5/test/se2/gtest_se2.cpp
    description: "SE(2) 群单元测试"
    command: "./gtest_se2"
  - file: test/se3/gtest_se3.cpp
    source: manif-0.0.5/test/se3/gtest_se3.cpp
    description: "SE(3) 群单元测试"
    command: "./gtest_se3"
  - file: test/se_2_3/gtest_se_2_3.cpp
    source: manif-0.0.5/test/se_2_3/gtest_se_2_3.cpp
    description: "SE_2_3 群单元测试"
    command: "./gtest_se_2_3"
  - file: test/sgal3/gtest_sgal3.cpp
    source: manif-0.0.5/test/sgal3/gtest_sgal3.cpp
    description: "SGal(3) 群单元测试"
    command: "./gtest_sgal3"
  - file: test/bundle/gtest_bundle.cpp
    source: manif-0.0.5/test/bundle/gtest_bundle.cpp
    description: "bundle adjustment 单元测试"
    command: "./gtest_bundle"

test_package_tests:
  - file: test_manif.cpp
    description: "消费者测试：实际调用 manif SO2/SE2 公开 API（exp/log、群乘法、act），验证头文件库可消费"
    command: "./test_manif"

assertion_count: 4