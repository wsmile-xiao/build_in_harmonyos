software: mcds
display: "mcds — CardDAV 命令行地址簿查询（mutt 插件）"
description: "命令行 CardDAV 地址簿查询工具：向 CardDAV 服务器发 REPORT 请求，按姓名/邮箱/电话/地址检索联系人并输出给 mutt"
category: network
homepage: "https://github.com/t-brown/mcds"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "货源是上游 GitHub 的 2026-04-15 提交归档（git snapshot），不提交 autoreconf 产物：配方 build() 里 autoreconf -fi 自举生成 configure"
    - "构建主机 PATH 只有 SDK 的 autoconf+m4，没有 automake/aclocal/libtoolize ⇒ automake/1.18 + libtool/2.5.4 + gettext/0.22.5.1 全部走 tool_requires（argp-standalone/adcli/avahi-tools 同族）"
    - "configure.ac 的 AM_GNU_GETTEXT([external]) 需要 gettext 的 aclocal 宏：ACLOCAL_PATH 前置 gettext 包 share/aclocal，gettext_datadir 指向 share/gettext"
    - "HMDFS 对目录强制 setgid：生成的 configure 里 config.status 的 umask 077 临时目录连创建者都写不进 ⇒ configure 运行前文本剥离（E114/E011）"
    - "config.guess 认不出 HarmonyOS ⇒ 显式 --build/--host=aarch64-unknown-linux-ohos"
    - "--disable-nls：po/ 只有 mcds.pot、无任何 .po 翻译，关闭不损失功能；--disable-gpgme（configure 期强制要求宿主 gpgconf+gpg，构建主机没有）；--disable-libsecret（制品仓无该配方且后端依赖 D-Bus）"
  common_dependencies:
    - curl
    - libxml2

versions:
  "1.9-git20260415":
    status: built
    build_date: "2026-09-26"
    conan_ref: "mcds/1.9-git20260415"
    source_url: "https://github.com/t-brown/mcds/archive/0e150e90439bac5b306f5ca17091db4a300b76b2.tar.gz"
    sha256: "4144bfbb2735860ea2c759a03d2f2b18bc5c4b79d40d24b95a91694c4b29e986"
    note: "上游 AC_INIT 在该快照仍是 1.8（mcds --version 打印 1.8）；任务版本串按上游 git 快照日命名，四处（任务/Conan/归档目录/分支）逐字一致"
