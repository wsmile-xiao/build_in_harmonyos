knowledge_gained:
  - "GitHub 提交归档（含 AM_GNU_GETTEXT 的 autotools 工程）自举：autoreconf -fi + tool_requires(automake/libtool/gettext)，ACLOCAL_PATH 指向 gettext 包 share/aclocal、gettext_datadir 指向 share/gettext ｜ knowledge_ref: E248"
  - "configure.ac 的 AC_INIT 版本串（1.8）可以与任务版本串（1.9-git20260415）不一致：mcds 的 2026-04-15 快照落在 v1.8 与 v1.9 之间的分叉线上，mcds --version 打印 1.8 ｜ knowledge_ref: 无（本包独立读数，不挂图谱条目）"
  - "上游 mcds 在本提交完全没有测试套件（无 tests/、Makefile.am 无 TESTS/check_PROGRAMS），po/ 亦无任何 .po 翻译 ｜ knowledge_ref: 无（R51 三步法清点，读数见 reports/upstream-test-scan.txt）"
  - "mcds 的 print_usage/print_version 都以 exit(EXIT_FAILURE) 收尾：--help/--version 的退出码是 1 而不是 0 ｜ knowledge_ref: 无（上游行为实测，消费者测试按此断言）"
  - "GPGME 分支在 configure 期强制要求宿主 gpgconf+gpg 可执行文件（AC_PATH_PROG + AC_MSG_ERROR），构建主机两者皆无 ⇒ --disable-gpgme ｜ knowledge_ref: 无（configure 汇总 Enable GPGME: no 实证）"
  - "libsecret 制品仓无配方且其后端是 Secret Service D-Bus 接口 ⇒ --disable-libsecret ｜ knowledge_ref: 无（Enable libsecret: no 实证）"
  - "OHOS termios 实测：tcgetattr、tcsetattr(TCSANOW/TCSADRAIN/TCSAFLUSH)、TIOCGWINSZ 在 pty 从端全部可用（ECHO 能真实翻转）；但 tcflush/tcdrain/tcflow 在 pty 主端与从端一律返回 EPERM(13)，同一探针在 /dev/null 上 tcflush 返回 ENOTTY(25) 属标准行为 ⇒ 鸿蒙屏蔽的是 tty 队列控制类 ioctl，属性读写不受影响。mcds 的 src/prompt.c 只用 fopen(\"/dev/tty\") + tcsetattr(TCSAFLUSH)，不使用被屏蔽的三个接口（src/ 全量 grep 无命中），对本包无功能影响 ｜ knowledge_ref: 无（本包一手 pty 探针读数）"
  - "musl 无 getprogname()/program_invocation_name 而提供 __progname ⇒ 补丁 0001 改 program_name() 的取值路径 ｜ knowledge_ref: E203"
  - "E490（恢复 autotools 脚本执行位）对本包判真 N/A：解包树内无任何 build-aux/ 与 configure 载体（upstream-test-scan.txt [02] 段 47 条枚举），脚本全由 build() 的 autoreconf -fi 现场生成 ｜ knowledge_ref: E490"

