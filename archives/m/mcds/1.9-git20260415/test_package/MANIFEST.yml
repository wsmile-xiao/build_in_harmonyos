# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁读取）

package: mcds/1.9-git20260415
homepage: "https://github.com/t-brown/mcds"

# 上游测试清点结论：本提交（GitHub 提交归档 0e150e90）没有任何测试套件。
# 取数命令与逐字证据见下方 upstream_evidence 与 reports/upstream-test-scan.txt。
upstream_check_command: "make check"
# Automake 在没有 TESTS/check_PROGRAMS 时只为 check/check-am 生成空规则，
# 本包 build() 因此不跑 make check（没有可运行的上游测试；跑它等于自欺）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试用例总数 = 0
upstream_tests: []
upstream_test_count: 0

upstream_evidence:
  - "解包全量文件清点（find . -type f | sort，47 个文件，逐条枚举见 reports/upstream-test-scan.txt 的 [02] 段）：无 tests/ 与 test/ 目录，唯一目录是 .github/、po/、src/；文件名中不含任何 test/spec 用例文件"
  - "Makefile.am 全文只有 SUBDIRS=po src 与维护者目标 check-gettext/update-po/update-gmo/force-update-gmo；grep -nE 'TESTS|check_PROGRAMS|test_' Makefile.am 与 src/Makefile.am 均无输出（check-gettext 是 NLS 前置检查，不是测试）"
  - "src/Makefile.am 只声明 bin_PROGRAMS = mcds 与 noinst_HEADERS/dist_man_MANS，无 check 相关目标"
  - ".github/workflows/build.yaml（上游 CI）全部步骤只有 autoreconf -vi、./configure、make 三步，没有 make check / ctest / 任何测试步骤"
  - "configure.ac 无 AM_INIT_AUTOMAKE 的 parallel-tests 相关声明、无 CTest/Meson 定义"
  - "机器可复核的实测口径：autoreconf -fi 之后在已 configure 的树上跑 `make -n check ACLOCAL=: AUTOCONF=: AUTOHEADER=: AUTOMAKE=: MAKEINFO=:`，退出码 0、展开的命令里只有 po/src 两个子目录的递归，没有任何用例被执行；生成的 Makefile 中 grep -n '^TESTS|^check_PROGRAMS' 无命中"

# test_package 消费者用例（不计入上游分母，按 PR 模板口径计入「鸿蒙特有测试」行）
# 每条对应 test.sh 里一个 PASS/FAIL 断言；总数见文末 assertion_count。
test_package_tests:
  - file: test.sh
    description: "T1 被测二进制必须等于 conan 解析出的本包 package_folder/bin/mcds，且该路径不含 harmonybrew（构建主机 harmonybrew 自带同名 mcds，防「本地全绿」假验证）"
    command: "sh test.sh <pkg>/bin/mcds <pkg_folder>"
  - file: test.sh
    description: "T1b 该绝对路径存在且可执行"
    command: "sh test.sh <pkg>/bin/mcds <pkg_folder>"
  - file: test.sh
    description: "T2 --version 打印上游版本行 'mcds (GNU mcds) 1.8' 且退出码为 1（上游 print_version 以 exit(EXIT_FAILURE) 收尾）"
    command: "sh test.sh <pkg>/bin/mcds <pkg_folder>"
  - file: test.sh
    description: "T2b --version 的编译期特性回显确认为 with-out GPGME / with-out libsecret（证明交付产物的两处功能裁剪真实生效）"
    command: "sh test.sh <pkg>/bin/mcds <pkg_folder>"
  - file: test.sh
    description: "T3 --help 逐字命中上游 usage 串且退出码 1；usage 里的程序名在 OHOS musl 上依赖补丁 0001 的 __progname 兜底（否则打印 usage: unknown）"
    command: "sh test.sh <pkg>/bin/mcds <pkg_folder>"
  - file: test.sh
    description: "T4 零参数调用走 parse_argv 的缺查询串分支，打印 usage 并以 1 退出"
    command: "sh test.sh <pkg>/bin/mcds <pkg_folder>"
  - file: test.sh
    description: "T5a 默认查询字段为 'Query : FN'（-v 回显，取 carddav.c 的默认 prop-filter）"
    command: "sh test.sh <pkg>/bin/mcds <pkg_folder>"
  - file: test.sh
    description: "T5b `-q a` 使查询字段变为 'Query : ADR'（实测读数，证明选项解析真的驱动了请求属性选择）"
    command: "sh test.sh <pkg>/bin/mcds <pkg_folder>"
  - file: test.sh
    description: "T6 离线端到端：-v -u http://127.0.0.1:1/ fred 走通 选项解析→cinit→query，stderr 同时出现 'Sending'、carddav 命名空间 'urn:ietf:params:xml:ns:carddav' 与 'Unable to search for fred'（libcurl 真被链入并执行），非 0 退出"
    command: "sh test.sh <pkg>/bin/mcds <pkg_folder>"

assertion_count: 9
