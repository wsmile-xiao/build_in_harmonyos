patches:
  - patch_file: "patches/0001-src-main.c-progname-fallback.patch"
    patch_description: "main.c: OHOS musl provides neither getprogname() nor
      program_invocation_short_name (both come out #undef in the real config.h
      generated on the HarmonyOS build host), so upstream get_progname() falls
      through to the literal unknown and --help prints 'usage: unknown ...'.
      Fall back to the BSD __progname global, which OHOS musl does export."
    patch_type: "portability"
