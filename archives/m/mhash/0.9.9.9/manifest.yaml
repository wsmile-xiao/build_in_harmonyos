software: mhash
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.9.9.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.9.9"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/mhash/mhash-0.9.9.9.tar.gz"

  # 源码校验和
  sha256: "3dcad09a63b6f1f634e64168dd398e9feb9925560f9b671ce52283a79604d13e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: autotools
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "E011: configure 中 umask 077 在 HMDFS 上导致 Permission denied (ref: E011)"
    - "E007: config.guess/config.sub 无法识别 HarmonyOS 系统 (ref: E007)"
    - "E080: HMDFS 符号链接不被动态链接器解析，共享库需用真实文件而非 symlink (ref: E080)"
    - "E112: mhash 无命令行二进制，make check 需手动编译静态测试程序验证 (ref: E112)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/mhash-0.9.9.9.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/mhash-0.9.9.9.work
  source_orig_hash: 8268ceabeee555e9
  source_work_hash: f02768c5836d17f1
  generated_at: '2026-06-03T15:16:23'
  patches_count: 3

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
