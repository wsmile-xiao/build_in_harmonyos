package: mini-httpd/1.30
homepage: "https://www.acme.com/software/mini_httpd/"

upstream_tests_exist: false
upstream_test_audit:
  - source: "mini_httpd-1.30 source tree (FILES manifest)"
    reason: "The tarball contains only sources, docs and contrib scripts; there is no test/ directory, no check target and no test runner of any kind."
  - source: "Makefile"
    reason: "Targets are all/mini_httpd/htpasswd/cert/install/clean/tar only; no test or check target exists."
  - conclusion: "Upstream 1.30 ships no automated tests (N_static=0); per the rules the consumer smoke test below provides real behavior coverage and is not presented as upstream coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: smoke.sh
    description: "htpasswd: create a credential file with -bc and assert the user:hash line shape."
    command: "sh smoke.sh <package>/bin"
  - file: smoke.sh
    description: "mini_httpd: serve a docroot on loopback (port 18099, pidfile), issue GET / over a raw socket, assert HTTP 200, Server: mini_httpd/1.30 header and served body, then terminate the server via pidfile."
    command: "sh smoke.sh <package>/bin"

test_scenario_count: 2
assertion_count: 6
assertion_count_basis:
  htpasswd: 2
  http_roundtrip: 4
