sources:
  # 设备实测（2026-09-25，A 机 → www.acme.com）：同一 URL 的 https 端点拒绝 TLS 握手（`SSLError: SSLV3_ALERT_HANDSHAKE_FAILURE`，与 CI 的 source() 报错逐字同因），而 http 端点 0.8s 返回 200、43889 字节、sha256 与下面这枚**逐字相同**。⇒ 只改 scheme、哈希不动（ integrity 仍由 sha256 钉住），不换源不换镜像。本仓已合入 32 份 conandata.yml 用 http:// 规范源（如 ftp.gnu.org / deb.debian.org），属既有口径。
  url: "http://www.acme.com/software/mini_httpd/mini_httpd-1.30.tar.gz"
  sha256: "9c4481802af8dde2e164062185c279e9274525c3af93d014fdc0b80cf30bca6e"

patches:
  - patch_file: "patches/0001-musl-getpass.patch"
    patch_description: "musl (OHOS) ships no getpass(); extend the upstream MPE fallback branch to non-glibc targets with a termios-based implementation (upstream gets()-based fallback kept for MPE)"
    patch_type: "portability"
    strip: 1
