# test_package/MANIFEST.yml — 上游官方测试声明（memlockd 1.3.1）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
package: memlockd/1.3.1
homepage: "https://doc.coker.com.au/projects/memlockd/"

# 上游 1.3.1 发布源（官方 https://www.coker.com.au/memlockd/memlockd_1.3.1.tar.xz，
# 与 Debian/Ubuntu 的 memlockd_1.3.1.orig.tar.xz 逐字节同哈希）在 debian/ 之外只有 4 个文件：
#   Makefile(235B) memlockd.cpp(10731B) memlockd.8(2328B) memlockd.cfg(496B)
# Makefile 全文只有 `all:` / `memlockd:` / `clean:` 三条规则，无 `check:`、无 `test:`、
# 无 TESTS/check_PROGRAMS/add_test 注册入口（实测对 Makefile 全文检索 check/TEST/test 零命中）
# ⇒ 上游静态声明数 N_static = 0，属于「根本没有测试可跑」，不是「有测试没跑」。
upstream_check_command: "none (upstream Makefile registers no test target: only all/memlockd/clean)"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests:
  - name: upstream registered test suite
    command: "n/a"
    expected: "发布源不含任何测试注册入口，按 AGENTS §10 如实记 0；行为覆盖由 test_package 端到端补齐"

test_package_tests:
  - file: test_memlockd.py
    description: "消费者测试 — 以运维者身份驱动安装包内的真实守护进程，17 条断言分四层，
      全部由退出码/逐字日志串/procfs 读数判定，无只打印不判定的用例。
      L1 CLI 契约 5 条：未知选项打 usage 且 rc=1；配置文件缺失时致命并打 Can not stat 串 rc=1；
      未知 -u 用户报 Can not look up user 且 rc=1；上游样例配置在本机确能映射 /bin/login、
      /etc/passwd、/etc/group、/etc/resolv.conf 四个存在项；样例配置尾行的 %/etc/memlockd.d
      在本机不可 stat，按解析器语义致命退出 rc=1（故样例配置是数据而非可运行默认值）。
      L2 真实锁页 5 条：非 root 下 mmap 加 mlock 成功；/proc/<pid>/smaps_rollup 暴露 Locked 计数；
      两个文件以 PROT_READ 与 MAP_SHARED 形态 r--s 挂在该进程地址空间；SIGHUP 追加 8 MiB 文件后
      Locked 由 31768 kB 升到 39960 kB 即恰好 +8192 kB 且 RLIMIT_MEMLOCK 为无限；该 8 MiB 映射恰一条 r--s。
      L3 配置语法与失败路径 4 条：混合好坏路径仍锁住可读文件；问号前缀缺失路径被容忍不打错误串；
      无前缀缺失路径打 Can not open file 且守护进程存活；ARCH 占位由 uname().machine 展开为 aarch64。
      L4 打包数据面 3 条：res/memlockd.cfg、share/man/man8/memlockd.8、res/source/memlockd.cpp。"
    command: "python3 test_memlockd.py <package_folder> <work_folder>"

# 测试断言总数
#   上游静态注册 0 例（如实记 0）+ 消费者断言 17 条 = 17
#   （与 PR 正文「适配后测试用例统计」合计、notes.md、真机 create-6.log:173 同源）
assertion_count: 17
upstream_assertions: 0
consumer_assertions: 17
platform_limited_cases: 0
max_rss_mb: 97
notes: >
  口径说明：上游无自动化测试（N_static=0），因此「上游测试用例通过率」一栏写 0/0 并给出
  Makefile 三条规则的实证；不得把消费者 17 条并入上游分母，也不得因上游为 0 而省略行为覆盖。
  本机无任何「平台受限未执行」项：守护进程能力面在非特权下实测可用（见 L2 层 Locked 差分读数）。
