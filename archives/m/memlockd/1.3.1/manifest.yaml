package: memlockd
version: "1.3.1"
homepage: "https://doc.coker.com.au/projects/memlockd/"
license: GPL-3.0-only
status: built
build_system: makefile
build_date: "2026-09-25"

source:
  url: "https://www.coker.com.au/memlockd/memlockd_1.3.1.tar.xz"
  sha256: "8534e586eac0060be78a92d6d1c0b8cbfc3bb4360627faf0ab60ca20c90f0603"

patches_applied: []

upstream_tests:
  command: "none"
  test_count: 0
  notes: "The upstream release tarball ships 4 files outside debian/ (Makefile, memlockd.cpp, memlockd.8, memlockd.cfg) and its Makefile contains exactly three rules - all, memlockd, clean. There is no check/test target and no TESTS/check_PROGRAMS/add_test registration anywhere in the tree, so the honest static count is 0. Behavioural coverage therefore ships as the end-to-end test_package suite (17 assertions driving the installed daemon)."

test_package:
  assertion_count: 17
  description: "以运维者身份驱动安装包内的真实守护进程：CLI 契约 5 条（usage/缺配置/坏用户/样例配置可映射项/样例配置尾行致命），真实锁页 5 条（非 root mmap+mlock、smaps_rollup Locked 计数、r--s 共享只读映射、SIGHUP 追加 8 MiB 后 Locked 恰好 +8192 kB、单条 r--s），配置语法与失败路径 4 条（混合路径、? 前缀容忍、缺失路径报错但进程存活、ARCH 占位展开为 aarch64），打包数据面 3 条。全部由退出码/逐字日志串/procfs 读数判定。"

knowledge_gained:
  - "DRAFT-memlockd-1.3.1-ohos-unprivileged-mlock-capability-plane: OHOS/HarmonyOS 上非 root 且无 CAP_IPC_LOCK 的用户态进程 RLIMIT_MEMLOCK 为无限（实测 cur=-1 max=-1，即 RLIM_INFINITY），mlockall(MCL_CURRENT|MCL_FUTURE) 与 mmap+mlock 全放行，8 MiB 文件锁页零摩擦；因此锁页型程序在本机不需要任何特权预处理，但也意味着 getrlimit 与 syscall 返回值都无法证伪策略变化——能力判据必须用 /proc/<pid>/smaps_rollup 的 Locked 计数做差分（本机 31768 kB→39960 kB，恰好 +8192 kB）｜ knowledge_ref: DRAFT-memlockd-1.3.1-ohos-unprivileged-mlock-capability-plane（本条新增，同 PR 成对 .kv/.md；知识库与草稿池中 mlock/RLIMIT 关键词零命中，故判 create 非 hit）"
  - "/proc/<pid>/maps 对 HMDFS 文件打印的是规范路径 /data/service/el2/<uid>/hmdfs/account/files/...，而调用方持有的是 /storage/Users/currentUser/... 绑定路径，且两侧连 inode 都不同（HMDFS 虚拟化 st_ino，本机同一文件在 maps 里是 13731993、在 stat 里是 2305843009227425945）⇒ 任何以路径串或 inode 直接匹配 maps 的测试都会假阴。本包消费者测试改为按路径尾段（含 conan 包哈希，唯一）匹配，并用权限串 r--s 把 memlockd 自己的 PROT_READ|MAP_SHARED 映射与可执行文件自身的 r--p/r-xp 段区分开 ｜ knowledge_ref: none-本包自发现（既有条目只讲 HMDFS 权限位与大小写，未覆盖 procfs 路径双形态）"
  - "上游 1.3.1 源码零 RPC：对整个发布树 grep -ri rpc 零命中，memlockd.cpp 的 include 列表里没有任何 rpc/xdr/svc/clnt，进程也不开 socket（无 socket/bind/listen/accept）。守护进程只做 mmap+mlock+mlockall，配置驱动、无查询接口 ⇒ 工单里'SunRPC/xdr 走 libc、OHOS 下 rpc 可用性是前置风险'的判定不成立，本包不需要 libtirpc（虽然仓库已有 libtirpc/1.3.7 归档可用作旁证）｜ knowledge_ref: none-本包自发现（对上游源码的直接检索结论，无既有条目）"
  - "上游硬编码 /etc/memlockd.cfg 与 /var/run/memlockd.pid（memlockd.cpp:24/:39），而本机 /etc 是指向只读 /system/etc 的符号链接、/var/run 根本不存在 ⇒ 样例配置作为数据交付到 res/ 并由 -c 在运行期选路；pidfile 分支只在 getuid()==0 且非 debug/foreground 时才写（:424 的 write_pidfile 判定），因此非特权 -d/-f 运行不触及缺失目录。另 -d/-f 分支会 chdir('/')（:430），故 -c 必须给绝对路径，相对路径会在 chdir 之后 stat 失败 ｜ knowledge_ref: none-本包自发现（/etc 只读与 /var/run 缺失的组合，及 -d 的 chdir 副作用）"
  - "上游 WFLAGS 含 gcc 专属且已被 gcc 自身移除的 -ffor-scope，OHOS clang 15.0.4 对整条原始命令行（含 -pedantic 与全部 -W*）零诊断通过，故本包零补丁；但 conan 的 AutotoolsToolchain 会追加 -stdlib=libc++ -std=c++17 -O3，与上游 Makefile 的裸 $(CXXFLAGS) 合并后仍通过（create-6.log:101-102 逐字命令行）⇒ 判断'要不要为编译器改补丁'必须先按实际合并后的命令行跑一次，而不是按 flag 名字推断 ｜ knowledge_ref: none-本包自发现（编译器选项面为否定性结论：无需偏离上游）"
