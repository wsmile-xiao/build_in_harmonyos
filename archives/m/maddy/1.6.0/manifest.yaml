# maddy 1.6.0 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.0"

# 软件名
software: "maddy"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 progsource/maddy tag 1.6.0）
  url: "https://github.com/progsource/maddy/archive/refs/tags/1.6.0.tar.gz"

  # 源码校验和（已核验）
  sha256: "811b19efbc2fbf1957486ed78aabaf5d164d15f84464f7b4a7033b44591845c5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DMADDY_BUILD_WITH_TESTS=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 无外部编译依赖（header-only INTERFACE 库）

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无需补丁：上游 CMake header-only 库，OHOS 平台直编通过

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "maddy 为 CMake header-only（INTERFACE target）库，Conan 配方用 package_type=header-library，package_info 中 bindirs/libdirs 置空、cmake_find_mode=none 由上游 maddyConfig.cmake 提供 find_package"
- "ohc-run conan-init 对 CMake 项目可能误生成 autotools 模板，需按实际构建系统重写 conanfile.py；本项目已手动重写为 CMake 模板并补 import os（否则 package_info 中 os.path.join 报 NameError）"
- "E092 处理：OHOS 平台 CMakeToolchain 需 cache_variables CMAKE_SYSTEM_NAME=Linux、CMAKE_SYSTEM_PROCESSOR=aarch64"
- "上游测试为 gtest/gmock（73 PASSED / 2 DISABLED），FetchContent 拉取 googletest v1.16.0，MADDY_BUILD_WITH_TESTS=ON 启用"