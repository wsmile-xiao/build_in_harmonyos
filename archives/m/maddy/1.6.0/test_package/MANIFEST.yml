# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: maddy/1.6.0
homepage: "https://github.com/progsource/maddy"

# 上游测试命令 (cmake 构建 + ctest)
upstream_check_command: "cmake -S . -B build -DMADDY_BUILD_WITH_TESTS=ON && cmake --build build --target MaddyTests && ./build/MaddyTests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (gtest/gmock, 73 PASSED / 2 DISABLED)
upstream_tests:
  - file: tests/maddy/test_maddy_parser.cpp
    source: maddy-1.6.0/tests/maddy/test_maddy_parser.cpp
    description: "Maddy parser suite (5 tests)"
    command: "./MaddyTests"
  - file: tests/maddy/test_maddy_linkparser.cpp
    source: maddy-1.6.0/tests/maddy/test_maddy_linkparser.cpp
    description: "Link parser suite (13 tests, 2 upstream-disabled)"
    command: "./MaddyTests"
  - file: tests/maddy/test_maddy_imageparser.cpp
    source: maddy-1.6.0/tests/maddy/test_maddy_imageparser.cpp
    description: "Image parser suite (3 tests)"
    command: "./MaddyTests"
  - file: tests/maddy/test_maddy_strongparser.cpp
    source: maddy-1.6.0/tests/maddy/test_maddy_strongparser.cpp
    description: "Strong parser suite (3 tests)"
    command: "./MaddyTests"
  - file: tests/main.cpp
    source: maddy-1.6.0/tests/main.cpp
    description: "gtest/gmock main runner (drives all 20 suites)"
    command: "./MaddyTests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：maddy::Parser 解析 Markdown 片段并断言输出 HTML 含 <h1>/标题文本"
    command: "./test_maddy"

# 测试断言总数 (gtest 实测 73 PASSED)
assertion_count: 73