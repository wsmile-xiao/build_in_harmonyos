# test_package manifest — myman 4.0.116
# 本文件记录 test_package 的测试策略与上游测试套件审计结论。

upstream_tests_exist: false
upstream_test_audit: "myman 上游无测试套件：根 Makefile 无 test/check 目标、simple.mk 仅 all/clean、无 tests/ 目录（2009-10-30 快照审计结论，4.0.116 任务复用同一快照）"

test_type: "L1 无头真实执行被测二进制（R34）"

upstream_test_audit_detail:
  exists: false
  evidence:
    - "根 Makefile：无 check/TESTS 目标（grep '^test|^check|test:' 无匹配）"
    - "官方简化构建 simple.mk：无 check/verify 目标（仅 all/clean）"
    - "源码树无 tests/ 目录（find 确认）"
  conclusion: "上游无自动化测试套件，test_package 以 myman -k/-L/-h 无头真实执行（无需 X server）"

test_commands:
  - name: "myman -k"
    expectation: "输出内置 MYMANKEYS（含 'Keyboard Map'，utils.c:155/218）后 exit(0)；在 XCurses Xinitscr 之前退出（myman.c getopt 阶段），Homebrew formula 同款路径"
  - name: "myman -L"
    expectation: "输出 MYMANLEGALNOTICE（版权/许可）后 exit(0)"
  - name: "myman -h"
    expectation: "打印 usage（含 'Usage'，myman.c 7324 行）后 exit(0)"

runtime_library_strategy:
  - "主配方 vendored 6 库（libICE/libSM/libXt/libXmu .so.6、libXpm.so.4、libXaw.so.7）与 myman 同放 bin/，rpath $ORIGIN + conanrun 环境 LD_LIBRARY_PATH"
  - "conan 依赖 libx11/libxext 运行期 DT_NEEDED（libxcb.so.1/libXau.so.6/libXdmcp.so.6）：run=True 依赖注入 libdir + LD_PRELOAD 绝对路径双保险（HMBS [stale_runtime_library]）"

result_format: "HMBS_TEST_PACKAGE_RESULT JSON（discovered=3，passedCount 由脚本真实计数）"
