# conandata.yml — myman 4.0.116 (task version; upstream snapshot 2009-10-30)
# 源码: SourceForge 官方项目归档（Homebrew homebrew-core Formula/m/myman.rb 同源）
# R39: 官方正式源；myman sha256 与 Homebrew 公开值逐字核对一致；
# libXpm/libXaw sha256 与 FreeBSD ports distinfo 公开值逐字核对一致；
# xeyes 同款 5 个 X11 库复用 archives/x/xeyes/1.3.1 的 X.Org 公告值（同版本同 URL）；
# PDCurses 3.4 上游未公布 sha256（2008 年 SourceForge 包，无 Homebrew/AUR 先例），
# 值为官方 SourceForge 归档下载后的本地计算值。

sources:
  # 主程序 myman（"Text-mode videogame inspired by Namco's Pac-Man"）
  myman:
    url: "https://downloads.sourceforge.net/project/myman/myman-cvs/myman-cvs-2009-10-30/myman-wip-2009-10-30.tar.gz"
    sha256: "bf69607eabe4c373862c81bf56756f2a96eecb8eaa8c911bb2abda78b40c6d73"
  # XCurses = PDCurses for X（myman 的 X11 显示后端，README: "(B) on an X Window
  # System display (using PDCurses for X, a.k.a. XCurses)"）。PDCurses 3.4 自带
  # autotools configure（无需 imake；configure 的 --x-includes/--x-libraries
  # 显式路径可跳过内部 xmkmf/Imakefile 探测）。只取其静态库 libXCurses.a。
  pdcurses:
    url: "https://downloads.sourceforge.net/project/pdcurses/pdcurses/3.4/PDCurses-3.4.tar.gz"
    sha256: "46ad8fd439e71d44819ea884d775ccbf653b9f8b1f7a418a0cce3a510aa2e64b"
  # 以下 7 个 X11 库按 E277 vendored 依赖模式在配方内从 X.Org 官方源按依赖序
  # 构建到 staging 前缀（archives/x/xeyes/1.3.1 同款）。PDCurses X11 端口链接
  # 依赖 Xt/Xaw/Xmu/X11（grep 实证：XawScrollbarSetThumb/XmuMakeAtom/
  # XtAppAddTimeOut；无 XShm/Xext 符号调用，-lXext 仅 X11R6 库集探测需要）。
  # libXaw7 的 PKG_CHECK_MODULES(XAW7, xproto x11 xext xextproto xt xmu xpm)
  # 要求 libXpm/libXmu/libXt 随链提供。
