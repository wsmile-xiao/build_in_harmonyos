# 补丁：修上游 XCurses 模式编译 bug（myman(void) 无参函数引用 argc/argv 未
# 声明；main() 在 getopt 处理后把参数存入文件级全局供 Xinitscr 使用）。
# 无平台宏（R8 合规：非 __OHOS__ 判断，纯上游通用修复）。
patches:
  - patch_file: "patches/0001-myman.c-fix-xcurses-argc-argv-undeclared.patch"
    description: "修复 myman.c 的 XCurses 构建路径：myman(void) 内引用未声明的 argc/argv（Xinitscr 调用），改用 main() 存入的文件级全局 myman_argc/myman_argv"
