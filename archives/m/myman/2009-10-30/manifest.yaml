# 版本级 manifest — myman 2009-10-30
# 遵循 ARCHIVE-SPEC v2.0（仿 archives/x/xeyes/1.3.1）

version: "2009-10-30"
software: "myman"

# 编译状态: published | built | failed | archived
# PR 阶段尚未由 release 流水线 upload 到制品仓，真实状态为 built
status: built

build_date: "2026-09-08"
build_system: manual (simple.mk 编译单元手写命令 + vendored autotools X11 栈)

# 源码信息
source:
  url: "https://downloads.sourceforge.net/project/myman/myman-cvs/myman-cvs-2009-10-30/myman-wip-2009-10-30.tar.gz"
  sha256: "bf69607eabe4c373862c81bf56756f2a96eecb8eaa8c911bb2abda78b40c6d73"
  tar_format: tar.gz

# 构建配置
build:
  system: "manual compile commands (上游 Imakefile 不存在；simple.mk 提取编译单元)"
  configure_options: []
  dependencies:
    - "conan: libx11/6.4.0 + libxext/6.4.0（transitive）+ libxcb/1.16 + libxau/1.0.11（run=True）"
    - "vendored: xtrans 1.6.0 / libICE 1.1.1 / libSM 1.2.4 / libXt 1.2.1 / libXmu 1.1.4 / libXpm 3.5.19 / libXaw 1.0.16 / PDCurses 3.4（libXCurses.a）"
  cc: clang
  cxx: ""

# 补丁信息（无源码修改）
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "myman 2009-10-30 上游 tarball 无 Imakefile：构建系统为根 Makefile（GNU Make 巨兽）+ 自定义 configure（仅拷 GNUmakefile）+ 官方 simple.mk；按 simple.mk 提取编译单元（src/myman.c + src/utils.c + src/logic.c + mygetopt/mygetopt.c）手写编译命令，-DXCURSES -DMYGETOPT，不定义 HAVE_CONFIG_H（走 inc/guess.h 特性推测）"
  - "myman 的 X11 显示后端 = PDCurses for X（XCurses）：PDCurses 3.4 自带 autotools configure，显式 --x-includes/--x-libraries 时 autoconf 跳过内部 xmkmf/Imakefile 探测（configure 4464 行 case 分支），全程无需 imake；只 make 目标 libXCurses.a（绕开 MH_SHARED_LIBRARY 共享库宏链）"
  - "PDCurses 3.4 的 2008 年 config.sub 不识别 aarch64 三元组（xeyes 的新库 config.sub 已支持）→ vendored 库统一 --build/--host=x86_64-unknown-linux-gnu（双标相同=非交叉，conftest 本机可运行；host 标签只影响 configure case 分支，对编译无影响）"
  - "PDCurses X11 端口链接依赖 Xt+Xaw+Xmu+X11（x11.c grep：XawScrollbarSetThumb/XmuMakeAtom/XtAppAddTimeOut；无 XShm/Xext 符号调用）；libXaw 1.0.16 需 --disable-xaw6（默认同时建 Xaw6）+ XAW7_CFLAGS/XAW7_LIBS 逃逸（PKG_CHECK_MODULES 预置非空即跳过 pkg-config，xeyes 同款机制）"
  - "myman -k 输出内置 MYMANKEYS（'Keyboard Map'）后 exit(0)，-L/-h 同理，均在显示后端初始化前退出 → 无头 test_package 真实执行被测二进制（Homebrew formula 同款测试路径）"
  - "上游无测试套件（根 Makefile/simple.mk 均无 test/check 目标），按守则显式审计声明 upstream_tests_exist: false"
  - "myman 数据文件运行期读取（TILEFILE/SPRITEFILE/MAZEFILE 为文件名宏）：chr/ spr/ lvl/ 随包安装到 share/myman/；sfx/ 不需要（SOUND 默认 0）"
