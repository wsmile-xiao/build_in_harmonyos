# 上游测试声明 — myman 0.7.0
package: myman/0.7.0
homepage: "https://myman.sourceforge.io/"

# 上游源码没有测试目录或功能测试套件。Makefile 的 check 目标只打印
# "target check not implemented" 并返回非零，因此不把它当作可运行的测试。
upstream_check_command: "无功能测试套件；Makefile 的 check 为未实现占位目标"
upstream_test_in_build: false
