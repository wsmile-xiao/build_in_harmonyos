# 版本级 manifest — myman 0.7.0

version: "0.7.0"
software: myman
status: built
build_date: "2026-09-23"
build_system: "custom configure + GNU Make"

source:
  url: "https://sourceforge.net/projects/myman/files/myman/myman-0.7.0/myman-0.7.0.tar.gz/download"
  sha256: "31a94b2c8949a35d18eed35e8f685801fbfeb71418a3c01eafbf710ce95a292b"
  tar_format: tar.gz

build:
  system: "custom configure + GNU Make"
  configure_options:
    - "--with-ncursesw"
  dependencies:
    - ncurses/6.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "0.7.0 的 Makefile 直接链接 -lncursesw；通过 EXTRACINCLUDES 与 CURSESLIBS 注入 Conan ncurses 路径，不依赖 ncursesw6-config。"
  - "上游引用 <ncursesw/curses.h>，ncurses/6.6 将头文件平铺在 include/；配方在非 HMDFS build tree 生成兼容 include shim。"
  - "Makefile 的 check 目标明确标为 not implemented 并以非零退出；上游没有功能测试套件。"
  - "HarmonyOS 的 GNU install/rmdir/sed 自检用小型 wrapper 应答帮助探测，再委托 toybox 完成操作。"
  - "构建在非 HMDFS 的 /data/storage/el2/base 目录运行，规避 E011；OHOS 安装包中的 ELF 需按 E077 签名。"
  - "默认构建把 maze、tile、sprite 数据嵌入可执行文件；运行期只需 libc。"

verification:
  device: HarmonyOS PC aarch64
  conan_create_exit: 0
  consumer_tests:
    passed: 2
    total: 2
    commands:
      - "myman --version"
      - "myman --help"
  ohos_signature_section: ".codesign"
  upstream_tests: 0
  upstream_check: "未实现占位目标；未计为测试"
