software: myman
display: "myman"
description: "受 Namco Pac-Man 启发的迷宫游戏（MyMan video game），支持 ncursesw 文本终端与 X11（PDCurses/XCurses）两种显示后端"
category: games
homepage: "https://myman.sourceforge.io/"
license: MIT
build_system: "custom（0.7.1 为自定义 configure + GNU make；2009-10-30 为 simple.mk-style direct compile commands + vendored PDCurses/X11 stack）"

ohos_adaptation:
  key_points:
    - "[0.7.1] 依赖 ncurses/6.6（wide-char 静态版，ohpcd 已发布），使用 --with-ncursesw 输出驱动"
    - "[0.7.1] Makefile 需要 GNU install/rmdir/sed 通过 coreutils.ok/sed.ok 自检；HarmonyOS 仅 toybox，配方内生成 wrapper 脚本应答自检并委托 toybox"
    - "[0.7.1] configure 必须在非 HMDFS 工作目录运行（E011，源码复制到 /data/storage/el2/base）"
    - "[0.7.1] 运行时内建全部 variant/size 数据（BUILTIN_*），仅动态依赖 libc"
    - "[2009-10-30] 上游 tarball 无 Imakefile：构建系统为根 Makefile（GNU Make 巨兽，依赖 gsed/col/groff）+ 自定义 configure（仅拷贝 GNUmakefile）+ simple.mk 官方简化构建；本配方按 simple.mk 提取编译单元手写编译命令，绕开根 Makefile"
    - "[2009-10-30] X11 显示后端 = PDCurses for X（XCurses，PDCurses 3.4 x11 端口，自带 autotools 无需 imake）：configure --x-includes/--x-libraries 显式路径跳过内部 xmkmf/Imakefile 探测；只取静态库 libXCurses.a（绕开 MH_SHARED_LIBRARY 共享库宏链）"
    - "[2009-10-30] PDCurses X11 端口链接依赖 Xt/Xaw/Xmu/X11：libXt/libXmu/libSM/libICE/xtrans 按 xeyes 1.3.1 vendored 先例构建，新增 libXpm 3.5.19 + libXaw 1.0.16（XAW7 PKG_CHECK_MODULES 依赖 xpm）；libX11/libXext 用 conan 依赖（libx11/6.4.0 + libxext/6.4.0，ohpcd 已发布 OHOS armv8 binary，run=True 保证运行期 libdir 注入）"
    - "[2009-10-30] 数据文件运行期读取（TILEFILE/SPRITEFILE/MAZEFILE 为文件名宏）：chr/ spr/ lvl/ 随包安装到 share/myman/；sfx/ 不需要（SOUND 默认 0）"
    - "[2009-10-30] 无上游测试套件（根 Makefile/simple.mk 均无 test/check 目标）：test_package 以 myman -k/-L/-h 无头真实执行（-k 输出内置 Keyboard Map 字符串后 exit(0)，不初始化显示后端，Homebrew 同款测试路径）"
    - "[2009-10-30] 打包 rpath $ORIGIN + vendored 库 SONAME 命名随包（HMDFS symlink 物化不可靠，E050）；OHOS ELF 用 binary-sign-tool 自签"
  common_dependencies:
    - "ncurses (0.7.1)"
    - "libx11/6.4.0 (2009-10-30)"
    - "libxext/6.4.0 (2009-10-30)"
    - "libxcb/1.16 (2009-10-30)"
    - "libxau/1.0.11 (2009-10-30)"

