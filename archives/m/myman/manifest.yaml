software: myman
display: "myman"
description: "受 Namco Pac-Man 启发的文本/X11 模式迷宫游戏（MyMan video game）"
category: games
homepage: "https://myman.sourceforge.io/"
license: MIT
build_system: manual (simple.mk-style direct compile commands + vendored PDCurses/X11 stack)

ohos_adaptation:
  key_points:
    - "上游 tarball 无 Imakefile：构建系统为根 Makefile（GNU Make 巨兽，依赖 gsed/col/groff）+ 自定义 configure（仅拷贝 GNUmakefile）+ simple.mk 官方简化构建；本配方按 simple.mk 提取编译单元手写编译命令，绕开根 Makefile"
    - "X11 显示后端 = PDCurses for X（XCurses，PDCurses 3.4 x11 端口，自带 autotools 无需 imake）：configure --x-includes/--x-libraries 显式路径跳过内部 xmkmf/Imakefile 探测；只取静态库 libXCurses.a（绕开 MH_SHARED_LIBRARY 共享库宏链）"
    - "PDCurses X11 端口链接依赖 Xt/Xaw/Xmu/X11：libXt/libXmu/libSM/libICE/xtrans 按 xeyes 1.3.1 vendored 先例构建，新增 libXpm 3.5.19 + libXaw 1.0.16（XAW7 PKG_CHECK_MODULES 依赖 xpm）；libX11/libXext 用 conan 依赖（libx11/6.4.0 + libxext/6.4.0，ohpcd 已发布 OHOS armv8 binary，run=True 保证运行期 libdir 注入）"
    - "数据文件运行期读取（TILEFILE/SPRITEFILE/MAZEFILE 为文件名宏）：chr/ spr/ lvl/ 随包安装到 share/myman/；sfx/ 不需要（SOUND 默认 0）"
    - "无上游测试套件（根 Makefile/simple.mk 均无 test/check 目标）：test_package 以 myman -k/-L/-h 无头真实执行（-k 输出内置 Keyboard Map 字符串后 exit(0)，不初始化显示后端，Homebrew 同款测试路径）"
    - "打包 rpath $ORIGIN + vendored 库 SONAME 命名随包（HMDFS symlink 物化不可靠，E050）；OHOS ELF 用 binary-sign-tool 自签"
  common_dependencies:
    - "libx11/6.4.0"
    - "libxext/6.4.0"
    - "libxcb/1.16"
    - "libxau/1.0.11"

versions:
  "2009-10-30":
    status: built
    build_date: "2026-09-08"
    source_url: "https://downloads.sourceforge.net/project/myman/myman-cvs/myman-cvs-2009-10-30/myman-wip-2009-10-30.tar.gz"
