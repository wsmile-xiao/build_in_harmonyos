# 版本级 manifest — myman 0.7.1

version: "0.7.1"
software: myman
status: built
build_date: "2026-09-06"
build_system: autotools

source:
  url: "https://sourceforge.net/projects/myman/files/myman-cvs/myman-cvs-2009-10-30/myman-wip-2009-10-30.tar.gz/download"
  sha256: "bf69607eabe4c373862c81bf56756f2a96eecb8eaa8c911bb2abda78b40c6d73"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-ncursesw"
  dependencies:
    - ncurses/6.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "myman 使用自研 configure+Makefile：LD 存在时走裸链接器 LINK=${LD}，必须 env -u LD 以使用 CC 链接"
  - "coreutils.ok/sed.ok 自检要求 GNU install/rmdir/sed 在 stdout 应答 --help；toybox 环境用 conf wrapper 注入 INSTALL/RMDIR/SED"
  - "ncurses 依赖经 NCURSESW_CONFIG=ncursesw6-config 注入（--with-ncursesw）"
  - "configure/make 需在非 HMDFS 工作目录运行（E011）"
