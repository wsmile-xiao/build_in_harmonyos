# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: myman/0.7.1
homepage: "https://sourceforge.net/projects/myman/"

# 上游测试命令（myman 上游无任何测试套件：
#   源码无 tests/ 目录；Makefile 无 check/test 目标，
#   仅有编译期 gnumake.ok/configure.ok/compiler.ok/coreutils.ok/sed.ok 自检）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "myman --version / --help 运行断言（非交互，无需 TTY；R34 实质测试）"
    command: "myman --version"

# 测试断言总数
assertion_count: 2
