# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "mecab-unidic 是 NLP 词典数据包（单 lex.csv 756,463 条目 + matrix.def 514MB 131,610x131,610 连接矩阵 + DEF 定义文件，UTF-8 编码）" (knowledge_ref: E251)
  - "编码为 UTF-8（dicrc dictionary-charset = utf8），与 mecab-ipadic（EUC-JP）不同，索引生成用 -f utf8 -t utf8" (knowledge_ref: E251)
  - "二进制索引文件（char.bin, matrix.bin, sys.dic, unk.dic）由 mecab-dict-index 生成，OHOS aarch64 实测约 15 秒" (knowledge_ref: E251)
  - "libmecab 加载 UniDic 需显式 -r <dicdir>/dicrc（dicrc 无 dictionary-charset 激活行，默认 rc 路径解析失败时空报错）" (knowledge_ref: E251)
  - "mecab/0.996 将 mecab-dict-index 安装到 <pkg>/libexec/mecab/（package_info 未声明 libexecdir），须从 package_folder 显式解析" (knowledge_ref: E251)
  - "通过 tool_requires mecab/0.996 提供索引工具，消费测试 requires mecab/0.996 链接 libmecab.a 做真实分词验证" (knowledge_ref: E251)
