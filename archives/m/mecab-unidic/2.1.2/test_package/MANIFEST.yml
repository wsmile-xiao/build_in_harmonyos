# test_package/MANIFEST.yml — mecab-unidic 2.1.2
# NLP dictionary data package (Japanese UniDic dictionary for MeCab)
type: data
test_type: consumer
test_file: conanfile.py
description: |
  mecab-unidic 2.1.2 dictionary data integrity verification.
  Tests: file existence (lex.csv, matrix.def, char.def, unk.def, dicrc, DEF
  files), lex.csv entry count (756,463), matrix.def size (>500MB), UTF-8
  encoding validation, dicrc sanity, binary index files (required — generated
  by mecab-dict-index from the tool_requires mecab/0.996 package), OHOS
  package layout (dic/ install dir, no build-machine path leaks, data-only,
  triple license), and real mecab consumption test (compiles a consumer
  against the required mecab/0.996 package and loads this dictionary).
test_coverage:
  file_existence: true
  lex_entry_count: true
  matrix_size: true
  utf8_validation: true
  dicrc_sanity: true
  binary_indices: required  # generated by mecab-dict-index from tool_requires mecab/0.996
  ohos_package_layout: true
  mecab_consumption: required  # links libmecab.a from required mecab/0.996 package
