knowledge_gained:
  - "qt5-qtbase/5.15.2.2 包内 bin/qt.conf 与 mkspecs/**/*.pri 内嵌构建期绝对路径（…/.conan2/p/b/qt5-qXXXX/b），包上传后该目录不存在，qmake 会报 'Unknown module(s) in QT: core dbus' 与 'Cannot read …/modules-inst/qt_lib_*.pri'；构建期需改写为包目录（同 archives/l/libngf-qt） [knowledge_ref: knowledge/drafts/mlite-0.5.5-qtbase-baked-buildpath-qmake.kv]"
  - "glib 的 pkg-config Libs 含 '-l:ld-musl-aarch64.so.1'，其 '-L/lib' 会被 pkg-config 当系统路径剔除，ld.lld 报 'unable to find library -l:ld-musl-aarch64.so.1'；需在 mkspec 中补 QMAKE_LFLAGS += -L/lib [knowledge_ref: knowledge/drafts/mlite-0.5.5-glib-pkgconfig-musl-loader-Llib.kv]"
  - "上游 tests/ut_mdesktopentry.pro:7 硬编码 $$[QT_INSTALL_BINS]/lrelease；qt5-qtbase 不含 Qt Linguist 且制品仓无 Qt5 qttools（qt5-qttools/5.15.2 → 404），构建上游测试需自备 lrelease（实测 Qt6 qttools/6.11.1 生成的 .qm 可被 Qt5 QTranslator 正确加载） [knowledge_ref: knowledge/drafts/mlite-0.5.5-qt5-qttools-missing-lrelease.kv]"
  - "glib/2.84.0 在制品仓只有静态库：libdconf.so 静态链入 glib（导出符号被隐藏），消费者再静态链入一份 glib 会在同一进程出现两份 GLib 实例，导致 GObject 类型系统失配（dconf 'changed' 信号查不到 → 崩溃）。故本配方采用上游原生 dconf 关闭构型 [knowledge_ref: knowledge/drafts/mlite-0.5.5-glib-static-double-instance-dconf-crash.kv]"
  - "dconf/0.40.0 在制品仓的预编译二进制 ELF 自签名与文件内容不符，OHOS 加载器以 'Permission denied' 拒载（全新 CONAN_HOME 重新下载 md5 一致仍失败；同批下载的 expat 可正常加载；用 SDK binary-sign-tool -selfSign 1 重新自签名后即可加载）→ 任何链接 libdconf.so.1 的可执行体在本平台无法运行 [knowledge_ref: knowledge/drafts/mlite-0.5.5-dconf-stale-elf-self-signature-load-denied.kv]"
  - "qt5-qtbase 以 configure -dbus（运行期 dlopen 'libdbus-1'）构建，而制品仓 dbus 包（含 1.14.10.2）只提供静态 libdbus-1.a（全仓无 libdbus-1.so*），QDBusConnection 无法连接任何总线；补共享库后同一批 D-Bus 用例全部通过（实测 5/5 + 3/3） [knowledge_ref: knowledge/drafts/mlite-0.5.5-qt5-qtdbus-runtime-dlopen-libdbus1-missing.kv]"

build_options:
  build_system: "qmake（qtbase 提供的 qmake + 自定义 mkspec 继承 linux-clang）"
  qmake_command: "qmake -spec <generators>/mlite-ohos VERSION=0.5.5 mlite.pro"
  make_targets: "sub-src-all sub-tools-all（不含 tests：上游测试需 Qt Linguist lrelease）"
  configuration: "dconf 关闭构型（上游 src/src.pro packagesExist(dconf) 为假，上游原生支持）"

requirements:
  declared:
    - "qt5-qtbase/5.15.2.2（Qt5Core + Qt5DBus 组件）"
    - "glib/2.84.0（仅满足上游无条件 PKGCONFIG += glib-2.0；本构型不引用 glib 符号）"
  transitive_consumed:
    - "dbus/1.14.10、expat/2.8.2、zlib/1.3.1（qt5-qtbase 依赖）"
    - "libffi/3.4.4、pcre2/10.40（glib/2.84.0 依赖）"

