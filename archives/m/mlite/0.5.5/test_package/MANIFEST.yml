package: mlite/0.5.5
homepage: "https://github.com/sailfishos/mlite"

# 上游测试命令：tests/testapplication.pri 为每个用例生成 `check` 目标
# （ut_mnotification.pro 的 check 目标额外包一层 dbus-launch，因该用例需要会话总线上的通知服务）
upstream_check_command: "make check"

# 统一口径（与 ../manifest.yaml、../notes.md、../reports/test-report.md 一致）：
#   上游测试程序总数 6；本构型（dconf 关闭）可构建 4；实际执行 2 → 断言 103 通过 / 0 失败 / 0 跳过；
#   因依赖缺陷不可运行 2（ut_mremoteaction 5 项 + ut_mnotification 3 项 = 8 项）；
#   全部 4 个可运行用例合计 111 项断言（= 103 + 8，补共享 libdbus-1.so 后的反证场景实测通过）。
# 特别说明：本配方 build() 不构建上游 tests（上游 tests/ut_mdesktopentry.pro:7 需 Qt Linguist 的 lrelease，
#   qt5-qtbase 不含该工具、制品仓无 Qt5 qttools）；上游测试由适配阶段实跑，结果见 ../reports/test-report.md。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（P3 构型 = 上游原生 dconf 关闭构型，实测 2026-09-29）
upstream_tests:
  - file: tests/ut_mdesktopentry.cpp
    source: mlite-0.5.5/tests/ut_mdesktopentry.cpp
    description: "MDesktopEntry 解析（含本地化/翻译目录）；85 项断言全通过"
    command: "./ut_mdesktopentry.bin"
  - file: tests/ut_mfiledatastore.cpp
    source: mlite-0.5.5/tests/ut_mfiledatastore.cpp
    description: "MFileDataStore 存取（含跨进程）；18 项断言全通过"
    command: "./ut_mfiledatastore.bin"
  - file: tests/ut_mremoteaction.cpp
    source: mlite-0.5.5/tests/ut_mremoteaction.cpp
    description: "MRemoteAction 序列化与触发（需会话总线）；OHOS 环境未运行——Qt5 以 -dbus 构建（运行期 dlopen libdbus-1），制品仓 dbus 包只提供静态 libdbus-1.a，QDBusConnection 无法连接"
    command: "./ut_mremoteaction.bin"
  - file: tests/ut_mnotification.cpp
    source: mlite-0.5.5/tests/ut_mnotification.cpp
    description: "MNotification 与通知服务往返（需 dbus-launch + 会话总线）；OHOS 环境未运行——同上 QtDBus 缺共享 libdbus-1"
    command: "dbus-launch ./ut_mnotification.bin"
  - file: tests/ut_mdconfgroup.cpp
    source: mlite-0.5.5/tests/ut_mdconfgroup.cpp
    description: "MDConfGroup（dconf 条件用例）：本构型 dconf 关闭，上游 tests/tests.pro 的 packagesExist(dconf) 为假 → 不构建"
    command: "./ut_mdconfgroup.bin"
  - file: tests/ut_mdconfitem.cpp
    source: mlite-0.5.5/tests/ut_mdconfitem.cpp
    description: "MDConfItem（dconf 条件用例）：本构型 dconf 关闭 → 不构建"
    command: "./ut_mdconfitem.bin"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "MDesktopEntry 解析 + MRemoteAction 序列化往返 + 鸿蒙特有用例（OHOS 加载器可加载性与 ELF 目标标记）"
    command: "./test_mlite"

# 本构型实跑通过的断言数（ut_mdesktopentry 85 + ut_mfiledatastore 18 = 103，0 失败 / 0 跳过）
# 全部 4 个可运行用例的断言总数为 111（另 8 项因 QtDBus 依赖缺陷阻塞，见 §统一口径）
assertion_count: 103

# 未执行用例（必须申报，禁止用 test_package 结果替代）
not_executed:
  - "ut_mremoteaction（5 项）：依赖缺陷 —— QtDBus 运行期 dlopen('libdbus-1') 无共享库可解析"
  - "ut_mnotification（3 项）：同上（且制品仓 dbus/1.14.10.2 的 dbus-launch 内嵌路径失效，无法以上游入口启动）"
  - "ut_mdconfgroup / ut_mdconfitem（各 1 个测试程序）：本构型 dconf 关闭 → 上游 packagesExist(dconf) 为假，不构建"
  - "（申报状态）以上 4 例未执行已在本 PR 显式申报，并经用户于 2026-09-29 确认接受（路径 B）；依赖侧修复后将以 mlite/0.5.5.1 打开 dconf 构型补齐 6/6"
