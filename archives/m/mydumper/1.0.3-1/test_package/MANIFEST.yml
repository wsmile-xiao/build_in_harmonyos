# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: mydumper/1.0.3-1
homepage: "https://github.com/maxbube/mydumper"

# Upstream test command（如实申报：CMake 单元测试 test_use_defer_livelock）
upstream_check_command: "ctest"

# Upstream test suite（规则 4 如实申报）：
# 上游测试分两类：
# 1) CMake 单元测试 1 个：test_use_defer_livelock（test/unit/，仅依赖
#    GLib 无需 MySQL）——本地实测编译运行 → ALL TESTS PASSED（1/1 通过）
# 2) test/specific_* 集成测试脚本（check_mydumper.sh/prepare_mydumper.sql
#    等）——需 MySQL 服务器（OHOS 沙箱无 MySQL，无法运行）
upstream_tests_total: 1
upstream_tests_passed: 1

# Upstream tests not run in build (specific_* integration tests need MySQL
# server; unit test run locally for rule-4 declaration)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_mydumper.sh
    description: "Run mydumper --version to verify tool executes"

# Test assertion count
assertion_count: 1
