# 版本级 manifest
# 文件位置: archives/m/mydumper/1.0.3-1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.3-1"
software: "mydumper"
status: built
build_date: "2026-09-11"
build_system: "cmake"

source:
  url: "https://github.com/maxbube/mydumper/archive/refs/tags/v1.0.3-1.tar.gz"
  sha256: "5ffec51824d758589db788d138804b04e1b8ce51198137be3a0cd2eb855f02a7"
  tar_format: tar.gz

build:
  system: cmake
  # 预置 Find 模块变量（MYSQL/GLIB2/PCRE2）绕过 OHOS 交叉环境无
  # mysql_config/pkg-config 链的问题；-DLIBMARIADB 走 MariaDB SSL 选项分支
  configure_options: ""
  # OHOS 禁 mkfifo jobserver → make -j1 单线程
  make_parallelism: 1

dependencies:
  runtime:
    - glib2/2.88.0.1
    - pcre2/10.45
    - zlib/1.3.1
    - mariadb-connector-c/3.4.8

  notes: >-
    与 main 已有 mydumper/1.0.3（stub-mysql 路线）并存：本版本为真实
    mariadb-connector-c 链接版（依赖活动任务 contrib-5764）。pcre2 对齐
    glib2/2.88.0.1 依赖链（任务参数 pcre/8.45 为 PCRE1，源码实际用
    PCRE2 API 技术上不可行）。MYSQL_OPT_SSL_MODE 通过 -DLIBMARIADB
    走 MariaDB 专有选项（SSL_ENFORCE/SSL_VERIFY_SERVER_CERT）。

tests:
  # 上游无 CMake 测试注册（tests/ 需真实 MySQL server）→ consumer 侧
  # test_package/test_mydumper.sh 验证二进制可执行 + 实际运行
  framework: "test_package script"
  count: 2
  notes: >-
    mydumper --version 实际运行 + myloader 可执行性；真实 MySQL server
    连接测试不适用（OHOS 目标环境无 server）。

packaging:
  type: application
  artifacts:
    - bin/mydumper
    - bin/myloader
