    source: magic_enum-0.9.7/test/test_nonascii.cpp
    targets: []
    result: "SKIP — gated behind MAGIC_ENUM_OPT_ENABLE_NONASCII (OFF by default). test_nonascii uses emoji enum identifiers (U+1F603) requiring C++23 lexer support (P2174) unavailable on clang 15 / C++17; compilation fails with 'unexpected character <U+1F603>'. No test semantics altered; not registered in default ctest -N."
    reason: "environment limitation — C++23 lexer feature not in clang 15"

test_package_tests:
  - file: test_magic_enum.cpp
    description: "Consumer test: enum_name, enum_cast (exact + case_insensitive), enum_values, enum_count, enum_integer, enum_name on flag enum — 7 assertions."
    command: "./test_magic_enum"
  - file: test_magic_enum_ohos.cpp
    description: "HarmonyOS-specific test: verifies __OHOS__ platform macro, OHOS ABI characteristics (wchar_t=4B, char16_t=2B, pointer=8B), OHOS error-code style enum (negative + non-contiguous, requires customize::enum_range) reflection, and flags API — 14 assertions, real run on OHOS target (exit 0)."
    command: "./test_magic_enum_ohos"

assertion_count: 21