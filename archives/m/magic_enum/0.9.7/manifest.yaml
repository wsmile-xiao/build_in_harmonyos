# magic_enum 0.9.7 编译档案
software: magic_enum
version: "0.9.7"
status: built
build_system: header-only
build_date: 2026-09-01

dependencies:
  required: []
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options: []
  cflags: "-fPIC -O2"
  env:
    CXX: clang++

patches_applied: []

compatibility:
  level: high
  issues: []
  notes: |
    - header-only 库，include/magic_enum/ 下 9 个 .hpp，零运行时依赖
    - 要求 C++17（magic_enum.hpp 内部依赖 if constexpr / structured bindings）
    - clang 15 (OHOS profile) 完全兼容；上游 ctest 10/10 真实执行通过
    - test_nonascii.cpp 由 MAGIC_ENUM_OPT_ENABLE_NONASCII 门控（默认 OFF），
      emoji 枚举标识符需 C++23 lexer (P2174)，clang 15 / C++17 不可用，未改动语义
    - R02 新增鸿蒙特有测试 test_magic_enum_ohos：验证 __OHOS__ 平台宏、OHOS ABI
      特征（wchar_t=4B/char16_t=2B/指针8B）、OHOS 错误码风格枚举（负值+非连续，
      需 customize::enum_range 定制）、flags API，14/14 断言在 OHOS 目标上真实通过

test_results:
  type: manual
  upstream:
    source_files: 6
    registered_targets: 10
    executed: 10
    passed: 10
    failed: 0
    skipped: 2
    skip_reason: "test_nonascii.cpp gated behind MAGIC_ENUM_OPT_ENABLE_NONASCII (OFF by default); uses emoji enum identifiers (U+1F603) requiring C++23 lexer support (P2174) unavailable on clang 15 / C++17"
  consumer:
    test_program: 2
    assertions: 21
    passed: 21
    failed: 0
    note: "test_magic_enum（7 断言）+ test_magic_enum_ohos（鸿蒙特有，14 断言），共 21/21 通过"
  note: "上游 ctest 10/10 真实执行通过（cpp17×5 + cpp20×5）；消费者 21/21 断言通过（含鸿蒙特有 14/14）"

knowledge_gained:
  - "magic_enum 是 header-only C++17 库，package_type=header-library，零运行时依赖"
  - "include/magic_enum/ 下 9 个 .hpp，主头 magic_enum.hpp，其余为 containers/flags/format/fuse/iostream/switch/utility/all"
  - "上游 v0.9.7 tag 源码 sha256=b403d3dad4ef542fdc3024fa37d3a6cedb4ad33c72e31b6d9bab89dcaf69edf7（与 conancenter 元数据一致）"
  - "CMake 目标名 magic_enum::magic_enum（EXPORT_NAMESPACE=PROJECT_NAME::）"
  - "OHOS clang++ 包装器无条件注入链接参数（-Wl,--code-sign -fuse-ld=lld -L… ），编译期需 -Wno-unused-command-line-argument 抑制（上游 -Werror 下）"
  - "magic_enum 默认反射范围 [-128,127]；OHOS 错误码风格枚举（如 -2301 等超出范围值）需 specialize magic_enum::customize::enum_range<Enum>（min/max 收紧到实际值域，避免模板实例化爆炸），否则 enum_name/enum_cast 对范围外值失效"

references:
  - https://github.com/Neargye/magic_enum
