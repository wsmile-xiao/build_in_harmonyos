# 软件级 manifest — m1ddc
# 遵循 ARCHIVE-SPEC v3.0

software: m1ddc
display: "m1ddc"
description: "通过 DDC/CI 控制外接显示器亮度、对比度、音量与输入的命令行工具"
category: utility
homepage: "https://github.com/waydabber/m1ddc"
license: MIT
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Objective-C 命令行工具，1.0.0 为单文件 m1ddc.m，1.2.0 拆分为 sources/ 三模块加 headers/ 公共头，Makefile 执行 clang -fmodules 编译"
    - "上游依赖 macOS 私有框架（IOKit/Foundation/CoreGraphics/IOAVService），Apple Silicon 专属，OHOS 无等价公共 API；已用 0001-portable-nonapple.patch 双路径移植（__APPLE__ 保留原版 + 可移植 C 实现），无传输层时如实报告无显示器"
    - "上游无测试套件：v1.2.0 归档含 LICENSE、Makefile、README.md、headers/ 三头文件、sources/ 三源文件，共 9 个文件，无测试框架与 check 或 test 目标"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0.0":
    status: built
    build_date: "2026-08-14"
  "1.0.0.1":
    status: built
    build_date: "2026-08-28"
    note: "R37 rebuild revision because m1ddc/1.0.0 already exists in the registry with a different recipe"
  "1.2.0":
    status: built
    build_date: "2026-09-09"
    note: "Upstream multi-file layout with extended VCP table and detailed display listing; portable non-Apple CLI port"
