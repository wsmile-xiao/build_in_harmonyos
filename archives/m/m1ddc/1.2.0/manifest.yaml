# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "m1ddc 1.2.0 上游为多文件 Objective-C 命令行工具（sources/i2c.m、sources/ioregistry.m、sources/m1ddc.m，加 headers/ 公共头），Makefile 执行 clang -fmodules 编译并链接 -framework CoreDisplay"
  - "上游依赖 macOS 私有框架（IOKit、Foundation、CoreGraphics、IOAVService），Apple Silicon 专属，OHOS clang 无 Darwin 模块，必须补丁移植"
  - "移植方案：三个源文件顶部插入 __APPLE__ 双路径守卫，原版保留在 Apple 分支；i2c 与 ioregistry 在非 Apple 平台编译为空桩，m1ddc.m 在非 Apple 平台用可移植 C 复刻 CLI、帮助文本和 VCP 码表，无传输层时如实报告无显示器；配方 build 先调用 apply_conandata_patches"
  - "上游无任何测试：v1.2.0 归档仅含 LICENSE、Makefile、README.md、headers/ 三个头文件和 sources/ 三个源文件，无测试框架、测试目录和 check 或 test 目标"
