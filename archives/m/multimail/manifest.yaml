software: multimail
display: "MultiMail"
description: "离线邮件包阅读器（Blue Wave/QWK/OMEN/SOUP/OPX，curses 交互界面）"
category: network
homepage: "https://github.com/wmcbrine/MultiMail"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建（无 configure/CMake），源码目录内编译，DEBUG=Y 跳过 strip"
    - "curses 头文件与链接库来自 ncurses/6.6（CURS_DIR/LIBS 覆盖上游默认 -lcurses）"
    - "不调用上游 make install（install -s/ln 在 OHOS 不可靠），手动拷贝 bin/mm 与 mm.1"
    - "上游无测试套件，HMBS_UPSTREAM_TEST_RESULT 按 no_tests 口径输出"
  common_dependencies:
    - ncurses

versions:
  "0.52":
    status: built
    build_date: "2026-10-14"
