version: "0.52"
software: "multimail"
status: built
build_date: "2026-10-14"
build_system: "makefile"

source:
  url: "https://github.com/wmcbrine/MultiMail/archive/refs/tags/0.52.tar.gz"
  tar_format: tar.gz
  sha256: "3bfbf5d410dfff8bc33dfba98a7ba382d3168b8f0d79c2cbcbe6e53be9bba24c"

build:
  system: makefile
  configure_options:
    - "DEBUG=Y  # skip upstream `strip mm` post step"
    - "CURS_DIR=<ncurses-6.6>/include  # override upstream default CURS_DIR=."
    - 'LIBS="-L<ncurses-6.6>/lib -lncursesw"  # override upstream default LIBS=-lcurses'
  dependencies:
    - ncurses/6.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "multimail 0.52 upstream ships no test suite — no tests/ dir, no check/test target in the plain Makefile (audited, 70 files)"
  - "Plain Makefile in-source build; DEBUG=Y avoids the `strip mm` POST step"
  - "Override CURS_DIR/LIBS on the make command line to ncurses/6.6 (upstream defaults CURS_DIR=. / LIBS=-lcurses)"
  - "Do not use upstream `make install` on OHOS (install -s needs strip; hardlink ln unreliable on HMDFS); copy bin/mm and mm.1 manually"
  - "CXX from Conan conf tools.build:compiler_executables:cpp with PATH/SDK fallback (R33); pure isfile probing, no X_OK (R49)"
  - "mm is a purely interactive curses binary (no --help/--version); test_package validates ELF/strings/man page plus a headless-execution negative control instead of driving the UI"
  - "HMBS evidence: test_package/test_multimail.sh emits HMBS_UPSTREAM_TEST_RESULT status=no_tests every run; test_package/conanfile.py re-emits it for cache-hit runs (build() does not run make check, upstream_test_in_build: false)"
