# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: multimail/0.52
homepage: "https://github.com/wmcbrine/MultiMail"

# 上游测试套件存在性 (经审计上游源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: wmcbrine/MultiMail tag 0.52, sha256 3bfbf5d410dfff8bc33dfba98a7ba382d3168b8f0d79c2cbcbe6e53be9bba24c)
# 2026-10-14 实拉 GitHub 归档逐文件验证: 共 70 个文件, 无 tests/test/t/spec 目录,
# 无 *test*/*check* 文件; 顶层 Makefile 仅 all/clean/dep/install 目标, 无 check/test 目标;
# 无 configure/CMakeLists.txt/meson.build, 无任何测试框架注册 (无 enable_testing/add_test,
# 无 gtest/ctest/pytest)。
# 对齐已合入主干的 bwm/0.6.3 与 cvechecker/4 范例 (结构化审计 +
# upstream_test_in_build: false), 供 hmbs 清单器机器解析覆盖。
upstream_test_audit:
  - source: "MultiMail-0.52 源码树 (tag 0.52, 70 个文件)"
    reason: "无 tests/、test/、t/、spec/ 目录；顶层仅 Makefile/Makefile.bcc/Makefile.vc/Makefile.wcc、config.h、depend、mm.1、mmail/、interfac/、colors/，无任何 *test*/*check* 文件。"
  - source: "顶层 Makefile（纯 GNU Makefile，非 automake）"
    reason: "仅 all/clean/dep/install 目标，无 TESTS/check_PROGRAMS/check-local 定义，无 check/test 目标；`make check` 无规则可执行。"
  - source: "构建系统与测试框架"
    reason: "无 configure/CMakeLists.txt/meson.build；无 enable_testing/add_test、无 gtest/ctest/pytest 注册；mmail/（约 20 个 .cc 业务源）与 interfac/（约 15 个 .cc 界面源）均为应用实现，无 TEST()/TEST_F()/def test_ 包裹，无独立测试入口。"
  - conclusion: "上游 0.52 未提供自动化测试；适配的 test_package 对打包二进制做消费者视角验证（ELF/strings/手册/无头执行负向对照 6 项真实执行），不声称上游覆盖。"

# rule4 强制字段：upstream_test_total 必须显式声明。
# multimail 0.52 上游经完整审计确认确实没有任何自动化测试
# （源码树无 tests/、Makefile 无 check/test 目标、无测试框架注册，见上方审计），
# 官方注册总数即 0，口径为 autotools_tests（make 系构建、无测试注册）。
upstream_test_total: 0
upstream_test_count_method: autotools_tests
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_skipped: 0

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无测试套件, 故 check 命令不适用。
# 对齐已合入主干的 osmctools/0.9 + sipcalc/1.1.6 + bwm/0.6.3 范例:
# upstream_tests_exist:false 的库一律 upstream_check_command:""
# (清单器凭此字段判"上游是否存在测试命令", 非空时强制要求真机发现并执行)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# false: 上游 genuinely 无测试套件, build() 不集成 make check;
# 上游测试证据由 test_package/test_multimail.sh 在 test 阶段产生 (对齐 bwm/0.6.3 范例)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
upstream_tests: []

test_package_tests:
  - file: test_multimail.sh
    description: "bin/mm 存在且非空（打包产物存在性）"
    command: "test -s bin/mm"
  - file: test_multimail.sh
    description: "readelf 校验产物 ELF 类型（EXEC/DYN）"
    command: "readelf -h mm"
  - file: test_multimail.sh
    description: "strings 含 MultiMail 标记（非空输出守卫，防空文件比空文件式假通过）"
    command: "strings mm | grep MultiMail"
  - file: test_multimail.sh
    description: "strings 含邮件包格式标记（QWK/SOUP/Blue Wave/OMEN，真实功能字符串）"
    command: "strings mm | grep -E 'QWK|SOUP|Blue Wave|OMEN'"
  - file: test_multimail.sh
    description: "mm.1 手册存在、非空且含 MultiMail"
    command: "grep MultiMail share/man/man1/mm.1"
  - file: test_multimail.sh
    description: "无头执行负向对照（stdin=/dev/null、TERM=dumb 下快速非零退出，curses 需 TTY； hanging 或 exit 0 即失败）"
    command: "sh test_multimail.sh"

assertion_count: 6
