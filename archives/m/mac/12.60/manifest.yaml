software: mac
# 版本级 manifest 模板
# 文件位置: archives/m/mac/12.60/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "12.60"
status: published
build_date: "2026-05-26"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://monkeysaudio.com/files/MAC_1260_SDK.zip"
  sha256: "0bdbc0abbb2663b7911eb04a566351335ed76dabeae8156af40d264ebbb2e0d6"
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "源码为SDK ZIP格式（非tar），init-build需手动curl -kL下载后--no-download"
  - "G0 clean-verify脚本用tar解压ZIP会失败，需手动验证构建"
  - "manifest.yaml需添加扁平build_system字段，否则G4检查报错"
  - "aarch64平台自动包含NNFilterNeon.cpp（NEON SIMD优化）"
