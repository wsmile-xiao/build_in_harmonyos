software: mrcal
display: "mrcal"
description: "相机标定与几何库（C 核心 / C++ / Python）"
category: library
homepage: "https://mrcal.secretsauce.net/"
license: Apache-2.0
build_system: mrbuild

ohos_adaptation:
  key_points:
    - "上游 mrbuild 框架不在 tarball 内 → source() 另取 v1.16（sha256 校验）"
    - "re2c 生成解析器；minimath 生成器去掉 List::MoreUtils（补丁）"
    - "依赖 libdogleg/suitesparse(CHOLMOD)/LAPACK(openblas)/libpng/libjpeg/stb"
    - "mrbuild 的 --default-symver 是 GNU ld 专有，lld 不支持（补丁）；stb 头需 shim 目录"
    - "只跑 4 个纯 C 上游测试，其余需 Python/numpy/scipy"
  common_dependencies:
    - "libdogleg/0.18"
    - "suitesparse/7.8.3"
    - "lapack/3.12.1"
    - "libpng/1.6.58.3"
    - "libjpeg-turbo/3.2.0"
    - "stb_image/2.30"

versions:
  - version: "2.5.2"
    status: built
    build_date: "2026-09-26"
