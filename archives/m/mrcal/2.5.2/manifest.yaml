version: "2.5.2"
software: "mrcal"
status: built
build_date: "2026-09-26"
build_system: "mrbuild (upstream Makefile + vendored mrbuild v1.16)"

source:
  url: "https://deb.debian.org/debian/pool/main/m/mrcal/mrcal_2.5.2.orig.tar.xz"
  sha256: "e7ea976a5b70137fe98bea9ce11b1e334d4bf69bde9105410f73228faf6d1491"
  tar_format: tar.xz
  note: >-
    上游用 mrbuild 构建框架（不在 tarball 内）；配方在 source() 里另取
    codeload.github.com/dkogan/mrbuild v1.16（sha256 校验）到 mrbuild/。

build:
  system: mrbuild
  configure_options:
    - "USE_LIBELAS=0"
    - "USE_LOCAL_STB_IMPLEMENTATION=1"
  dependencies:
    - "libdogleg/0.18"
    - "suitesparse/7.8.3"
    - "lapack/3.12.1"
    - "libpng/1.6.58.3"
    - "libjpeg-turbo/3.2.0"
    - "stb_image/2.30"
  build_requirements:
    - "re2c/4.3.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-drop-python-cameramodel-converter.patch"
  - "patches/0002-minimath-generate-drop-list-moreutils.patch"
  - "patches/0003-mrbuild-drop-default-symver.patch"
  - "patches/0004-test-parser-use-relative-tmp.patch"

knowledge_gained:
  - "mrcal 依赖 mrbuild 构建框架（tarball 不含）；C 核心需要 libdogleg+CHOLMOD+LAPACK/BLAS 与 png/jpeg/stb，均已在制品仓"
  - "代码生成：re2c 生成 cameramodel-parser_GENERATED.c；minimath_generate.pl 用了 List::MoreUtils（build-only CPAN）→ 补丁改为可移植循环"
  - "mrbuild 禁止把 %FLAGS 作为 make 参数（须作环境变量）；lld 不支持 --default-symver → 补丁去掉"
  - "Conan stb_image 只装 include/stb_image.h 而 mrcal 用 <stb/stb_image.h> → 建 stb/ shim；lapack 依赖被 openblas 满足，直接 -lopenblas"
  - "test-parser-cameramodel 硬编码 /tmp（OHOS 不可写）→ 补丁改相对路径"
  - "只跑 4 个纯 C 上游测试；其余 40 个 test-*.py 需 CPython+numpy+scipy 与 _mrcal 扩展"
