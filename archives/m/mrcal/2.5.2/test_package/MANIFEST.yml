# test_package/MANIFEST.yml
# mrcal 2.5.2 - upstream test declaration.

package: mrcal/2.5.2
homepage: "https://mrcal.secretsauce.net/"

upstream_tests_exist: true
upstream_test_audit: >-
  mrcal's test driver is ./test.sh (zsh), exposed through the make targets
  test-all / test-nosampling / test-triangulation-uncertainty /
  test-external-data.  It lists 62 test entries (grep -c 'test/' test.sh):
  5 compiled C programs (BIN_SOURCES: test-gradients, test-cahvor,
  test-lensmodel-string-manipulation, test-parser-cameramodel, test-heap) and
  40 Python test programs (test/test-*.py) plus helpers.  The recipe builds and
  runs the four C programs that test.sh invokes directly and that need no
  Python (test-cahvor, test-heap, test-lensmodel-string-manipulation: 30 tests,
  test-parser-cameramodel: 122 tests).  The Python suites need CPython + numpy
  + scipy + the compiled _mrcal binding and are not run.
upstream_check_command: "make libmrcal.so && make test/test-{cahvor,heap,lensmodel-string-manipulation,parser-cameramodel} && ./test/test-*"
upstream_test_in_build: true
upstream_test_command: "run the four pure-C upstream test programs"
upstream_tests:
  - file: "test/test-cahvor.c"
    description: "CAHVOR model conversions; built and run here"
  - file: "test/test-heap.c"
    description: "heap priority queue; built and run here"
  - file: "test/test-lensmodel-string-manipulation.c"
    description: "lens-model string parsing/emission (30 tests); built and run here"
  - file: "test/test-parser-cameramodel.c"
    description: "cameramodel parser round-trips (122 tests); built and run here"
  - file: "test/test-*.py (40 programs)"
    description: "Python test suites; not run (need CPython + numpy + scipy and the compiled _mrcal pywrap)"

test_package_tests:
  - file: test_mrcal.c
    description: "C consumer: mrcal_lensmodel_num_params/name/type_from_name over several lens models (9 assertions)"
    command: "clang test_mrcal.c -lmrcal && ./test_mrcal"

test_files:
  - path: "test_package/test_mrcal.c"
    test_type: "R34"
    assertion_count: 9

test_package_test_count: 1
consumer_assertion_count: 9
upstream_test_cases: 62
assertion_count: 9
