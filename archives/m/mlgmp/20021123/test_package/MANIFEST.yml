# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: mlgmp/20021123
homepage: "https://packages.debian.org/sid/ocaml/libgmp-ocaml"

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make tests"

# 上游实际运行的测试程序
upstream_tests:
  - file: test_suite.ml
    source: mlgmp-20021123/test_suite.ml
    description: "上游 OCaml 断言测试（75 条 assert，覆盖 Z/Q/F/FR）"
    command: "ocamlrun ./test_suite && ./test_suite.opt"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.ml
    description: "消费者 OCaml 程序调用 Gmp (Z/Q/F/FR) 并编译运行（native + bytecode 双路径）"
    command: "ocamlopt gmp.cmxa test.ml && ocamlc -dllib dllmlgmp.so gmp.cma test.ml && ocamlrun ./test_bc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 75
