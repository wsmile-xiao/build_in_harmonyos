# 软件级 manifest — mlgmp
# 文件位置: archives/m/mlgmp/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: mlgmp

# 显示名
display: "ML GMP"

# 一句话描述
description: "Objective Caml interface to GNU MP (GMP) and MPFR"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://packages.debian.org/sid/ocaml/libgmp-ocaml"

# 开源许可证（SPDX 标识）
license: LGPL-2.1

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
  - "产物为 OCaml 库（gmp.cma/gmp.cmxa/gmp.a/gmp.cmi/gmp.mli）+ C 存根（libmlgmp.a/dllmlgmp.so），非系统同名库"
  - "字节码可执行（ocamlc -custom ELF）在 OHOS 无法直接执行（EPERM），必须经 ocamlrun + dllmlgmp.so"
  - "OCaml 4.14 兼容：serialize/deserialize 声明类型改 int32_t/intnat；String→Bytes API；-fcommon"
  - "MPFR 4.x 移除 mpfr_random/mpfr_random2，用 mpfr_urandomb 重实现"

  # 跨版本通用依赖
  common_dependencies:
  - ocaml
  - gmp
  - mpfr

# ============================================================
# 版本索引
# ============================================================

versions:
  "20021123":
    status: built
    build_date: 2026-09-30
