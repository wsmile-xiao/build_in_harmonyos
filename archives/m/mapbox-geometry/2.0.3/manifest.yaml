source:
  url: "https://github.com/mapbox/geometry.hpp/archive/refs/tags/v2.0.3.tar.gz"
  sha256: "9d750d34576069bcc4f39677af08cde2862fbe4b8c0d9af504877c2fae2ae273"

build:
  system: header-only
  compiler_standard: c++14
  dependencies:
    - mapbox-variant/1.2.0

upstream_tests:
  entries: 14
  test_cases: 32
  framework: "Catch 1.9.6 (vendored, upstream-canonical v1.9.6)"
  command: "./unit-tests (compiled from test/*.cpp with -I include -I catch-src/single_include -I mapbox-variant/include)"

patches_applied: []

knowledge_gained:
  - "Header-only recipe installs include/mapbox/** and exposes mapbox::geometry CMake interface target."
  - "Upstream CMake uses mason to fetch catch/variant/benchmark; OHOS recipe bypasses mason and compiles test/*.cpp directly with vendored Catch 1.9.6 plus mapbox-variant/1.2.0 from the local registry."
  - "Core point/line_string/polygon headers need no dependencies; only geometry.hpp/geometry_collection pull in mapbox/variant.hpp."
