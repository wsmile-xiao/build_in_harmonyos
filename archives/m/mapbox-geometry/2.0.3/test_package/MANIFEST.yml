package: mapbox-geometry/2.0.3
upstream_test_in_build: true
upstream_tests:
  - command: "./unit-tests (compiled from test/*.cpp with vendored Catch 1.9.6)"
    inventory: "14 files under test/ (main.cpp + 13 suites), 32 TEST_CASE"
  - command: "Catch summary parse: All tests passed (N assertions in M test cases)"
    inventory: "HMBS_UPSTREAM_TEST_RESULT marker emitted from real Catch stdout; exit 0 without summary is rejected"
test_package_tests:
  - file: test_package.cpp
    description: "Consumes point, line_string, polygon, geometry variant, geometry_collection, envelope, for_each_point, geometry_io"
    command: "test_package"
assertion_count: 8
