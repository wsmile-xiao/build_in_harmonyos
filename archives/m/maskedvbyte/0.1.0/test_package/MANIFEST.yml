# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: maskedvbyte/0.1.0
homepage: "https://github.com/lemire/MaskedVByte"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/unit.c
    source: maskedvbyte-0.1.0/tests/unit.c
    description: "上游单元测试：vbyte_encode/masked_vbyte_decode 常规与 delta 往返验证（length 0..4096，gap 1..387420489）"
    command: "./unit"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：仅使用公开头文件与 API 完成 vbyte_encode/masked_vbyte_decode/vbyte_encode_delta/masked_vbyte_decode_delta 往返并校验结果"
    command: "./test_maskedvbyte"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
