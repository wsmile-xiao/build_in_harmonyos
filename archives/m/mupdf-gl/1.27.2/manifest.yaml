software: mupdf-gl
version: "1.27.2"
status: built
build_date: "2026-09-28"
build_system: makefile

source:
  url: "https://github.com/ArtifexSoftware/mupdf/archive/refs/tags/1.27.2.tar.gz"
  sha256: "8bf3b85ac6d3af1baea67efe4c27fb5b01306c59b6c055d47f1360c7e002d30a"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "HAVE_X11=no"
    - "HAVE_GLUT=no"
    - "shared=no"
    - "build=release"
    - "HAVE_OBJCOPY=no"
    - "XLDFLAGS=-fuse-ld=ld"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-vao-rewrite.patch — platform/gl/gl-ui.c: ui_draw_image() immediate-mode GL rewritten to the modern VAO + shader pipeline (OHOS GLES does not export immediate-mode symbols; the unpatched code fails at link time)"

knowledge_gained:
  - "OHOS GLES does not export immediate-mode/fixed-function symbols (glBegin/glEnd/glVertex2f/glTexCoord2f/glOrtho/glMatrixMode/glNewList/...): unported code fails at LINK time (undefined symbol), not just runtime; eglGetProcAddress also returns NULL for them"
  - "libGLESv2.so: all 673 symbols aliased to a single non-working dispatcher (0xa1b0); libGLESv3.so (2942 symbols, strict superset of the ES2 core) works (0x5d70). Link only -lEGL -lGLESv3 — with both on the line, GL symbols bind to v2 and rendering silently produces nothing (glGetString returns NULL)"
  - "libEGL.so does not export the deprecated eglGetString (EGL 1.0); only eglQueryString (EGL 1.5) exists"
  - "OHOS defaults to an ES 1.1 context; VAO/shaders require explicit EGL_CONTEXT_CLIENT_VERSION=3"
  - "ES fragment shaders have no default float precision (S0032); glBufferSubData on an unallocated VBO is GL_INVALID_VALUE (use glBufferData); glEnable(GL_TEXTURE_2D) is GL_INVALID_ENUM in ES2/3"
  - "Stock mupdf Makefile compiles the bundled brotli .o files but does not archive all of them into libmupdf-third.a; repaired with llvm-ar q + llvm-ranlib in build() (31 objects)"
  - "CMake 3.16 parser: ')' inside an inline comment within an unclosed multi-line command is miscounted against the paren balance -> Parse error; keep inline comments out of unclosed commands"
  - "The freeglut/3.6.0 package defines FREEGLUT_GLES, making freeglut_std.h include <GLES2/gl2.h> only; compiling unported gl-ui.c functions additionally needs 5 fixed-function constants (GL_PROJECTION/GL_MODELVIEW/GL_COMPILE/GL_STACK_OVERFLOW/GL_STACK_UNDERFLOW) + <GLES3/gl3.h> declarations (see test_package glstub approach)"
