# test_package/MANIFEST.yml
package: mupdf-gl/1.27.2
homepage: "https://mupdf.com/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test inventory (R51): the mupdf 1.27.2 top-level Makefile has no
# `test` target (all rules checked), and platform/gl has no test harness
# (the viewer is driven interactively via freeglut; no automated tests).
# Only examples/ sample programs exist (e.g. examples/storytest), which are
# outside the library recipe's scope. This test_package therefore provides
# the end-to-end verification: it compiles the package's REAL patched
# platform/gl/gl-ui.c (gc-sections retain only the ui_draw_image closure)
# and drives ui_draw_image() on a headless EGL pbuffer ES 3.2 context,
# verifying the rendered framebuffer via glReadPixels.
upstream_tests: []

test_package_tests:
  - file: CMakeLists.txt
    description: "Compiles the package's real patched gl-ui.c + test_vao.c; asserts (1) all immediate-mode entry points (glBegin/glEnd/glVertex2f/glTexCoord2f) are NULL via eglGetProcAddress — the core OHOS finding, and (2) the real ui_draw_image() renders a synthetic pixmap correctly: framebuffer >=50% nonblack and the center pixel is the blue block (51,102,204)"
    command: "conan test test_package/ mupdf-gl/1.27.2 -pr:h ohos-aarch64 (test() executes the built test_vao binary)"
assertion_count: 3
