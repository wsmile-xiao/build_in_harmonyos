sources:
  url: "https://codeload.github.com/ArtifexSoftware/mupdf/tar.gz/refs/tags/1.27.2"
  sha256: "8bf3b85ac6d3af1baea67efe4c27fb5b01306c59b6c055d47f1360c7e002d30a"
  # conan 2 get() picks the extraction format from the filename suffix
  # (no magic-byte fallback); the codeload URL basename is the bare ref
  # (1.27.2), so an explicit .tar.gz filename is required for untar.
  filename: "mupdf-1.27.2.tar.gz"

patches:
  - patch_file: "patches/0001-vao-rewrite.patch"
    patch_description: "Rewrite mupdf-gl platform/gl/gl-ui.c ui_draw_image() from immediate-mode GL (glBegin/glEnd/glVertex2f/glTexCoord2f) to the modern VAO + glDrawArrays pipeline; the OHOS GLES driver does not expose immediate-mode entry points (deprecated in ES 2.0, removed in ES 3.0)"
    patch_type: "portability"
