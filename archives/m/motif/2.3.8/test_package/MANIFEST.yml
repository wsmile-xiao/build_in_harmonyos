# test_package/MANIFEST.yml — motif 2.3.8
# 上游官方测试声明文件 (CI L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md

package: motif/2.3.8
homepage: "https://sourceforge.net/projects/motif/"

# 上游官方测试（R51 三步法：清点证据见 notes.md）
# Motif 2.3.8 上游不提供正式测试用例：全树 109 个 Makefile.am 中 0 个注册
# check_PROGRAMS / TESTS / check-local（清点命令与数字见 notes.md
# "R51 上游测试清点"）。但 lib/ 是 automake 树（lib/Makefile.am: SUBDIRS =
# Xm Mrm），上游标准的 `check` / `check-recursive` 目标存在（实测
# lib/Makefile.in 提供 `check: check-recursive`，子目录 `check-am: all-am`）。
# 因此 conanfile.py 的 build() 在 `make -C lib` 之后显式调用该目标，执行痕迹
# 进入 conan create 日志（CI L1c）。上游注册 0 个用例，故 check 无任何可运行
# 项，上游通过率 = 0/0 = N/A；实际验证由 test_package 消费者测试承担（18/18）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -C lib check -j1"

# 上游注册的自动化测试用例：0 个（0 check_PROGRAMS / TESTS，跨 109 个
# Makefile.am）。make check 被 build() 调用但运行 0 个用例；上游通过率
# = 0/0 = N/A，非跳过。
upstream_tests: []

# test_package 中自带的消费者测试（R34 实质调用：链接 libXm.so.4 + dlopen 解析符号）
test_package_tests:
  - file: test_motif.c
    description: >-
      消费者测试：链接 libXm.so.4 调用 XmString* API（CreateLtoR/CreateSimple/Concat/
      Compare/GetLtoR/Empty/HasSubstring/ByteCompare/Length 关系断言），
      并 dlopen("libXm.so.4", RTLD_NOW) 解析 dinotrace 需要的入口点
      (XmCreateForm/XmCreateMainWindow/XmCreateDrawingArea/XmCreateScrollBar/
      XmCreateText/XmStringCreateLtoR/XtAppInitialize)，逐项 OK/MISSING。
    command: "./test_motif"

# 测试断言总数（test_motif.c: 10 个 XmString 断言 + 1 个 dlopen 句柄 + 7 个符号 = 18）
assertion_count: 18
