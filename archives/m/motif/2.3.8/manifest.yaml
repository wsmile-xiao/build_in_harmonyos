# 版本级 manifest — motif 2.3.8
version: "2.3.8"
software: motif
status: built
build_date: "2026-09-13"
conan_ref: "motif/2.3.8"
build_system: autotools

source:
  url: "https://sourceforge.net/projects/motif/files/Motif%202.3.8%20Source%20Code/motif-2.3.8.tar.gz"
  sha256: "859b723666eeac7df018209d66045c9853b50b4218cecadb794e2359619ebce7"
  tar_format: tar.gz
  upstream_version: "2.3.8"
  version_mapping: "Conan motif/2.3.8 builds upstream Motif 2.3.8; SONAME libXm.so.4, real file libXm.so.4.0.4."

build:
  system: autotools
  configure_options:
    - "--disable-printing"
    - "--disable-xft"
    - "--disable-jpeg"
    - "--disable-png"
    - "--enable-shared"
    - "--disable-static"
    - "--x-includes=<libx11>/include"
    - "--x-libraries=<libx11>/lib"
  make_target: "lib"
  dependencies:
    - "libx11/1.8.13"
    - "libxt/1.3.1"
    - "libxext/6.4.0.1"
    - "libsm/1.2.6"
    - "libice/1.1.2"
    - "xorgproto/2025.1"
  cc: clang
  cxx: clang++

patches_applied: []

validation:
  local:
    - "python3 -m py_compile passed for conanfile.py and test_package/conanfile.py"
    - "YAML parsing passed for conandata.yml, manifest.yaml and test_package/MANIFEST.yml"
    - "conan create with ci/conan/profiles/ohos-aarch64 (host+build) -> see reports/validation-report.md"
    - "packaged libXm.so.4 present; Xm/*.h headers present"
  pending:
    - "PR validation / REL upload"

knowledge_gained:
  - "Motif 2.3.8 full-tree make fails on OHOS in tools/wml (ld.lld: undefined symbol: main); only lib/ (Xm + Mrm) builds."
  - "<X11/bitmaps/gray> (X.Org xbitmaps) is not published; ship the 87-byte data file as an include-path shim instead of a code patch."
  - "musl/OHOS lacks rindex(3); append -Drindex=strrchr (XpmI.h only maps it under SYSV/SVR4/VMS/WIN32/_SVID_SOURCE)."
  - "libx11 must be force-pinned to 1.8.13 (libxt/1.3.1 binary) while libxext/6.4.0.1 rebuilds against it; Motif links -lXt/-lXext/-lX11 without .la archives."
