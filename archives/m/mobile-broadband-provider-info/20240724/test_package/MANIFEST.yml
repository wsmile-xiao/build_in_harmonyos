# test_package/MANIFEST.yml — task mobile-broadband-provider-info 20240724
# 上游官方测试声明（R51 清点 + L0e 门禁要求）

package: mobile-broadband-provider-info/20240724
homepage: "https://gitlab.gnome.org/GNOME/mobile-broadband-provider-info"

# 上游测试命令（根 meson.build 两个 test() 条目）
upstream_check_command: "meson test -C build --print-errorlogs --no-rebuild"
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs --no-rebuild"

# 上游实际运行的测试（meson.build test() 清点）
upstream_tests:
  - id: xmllint
    file: meson.build
    description: "xmllint --valid 按 DOCTYPE 校验 serviceproviders.xml（DTD 同目录共置契约）"
    command: "xmllint --valid serviceproviders.xml"
  - id: check-blanks
    file: meson.build
    description: "grep 检查 serviceproviders.xml 不得存在缩进空白前缀行；声明 should_fail: true，grep 退出码 1 即通过（meson 报 EXPECTEDFAIL）"
    command: "grep '^[[:blank:]]* [[:blank:]]*<|[[:blank:]]$' serviceproviders.xml（预期失败即通过）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_verify.py
    description: "校验安装树数据契约：三件套共置、DTD 元素声明、数据库结构（694 providers / 154 countries）、生成的 apns-conf.xml（root=apns version=8）、上游 pkg-config 版本为 20240407、pkg-config 元数据与 pcfiledir 相对 pkgdatadir 消费解析"
    command: "python3 test_verify.py $PACKAGE_ROOT"

# 上游测试用例数
upstream_test_count: 2
# 消费者校验断言数（test_verify.py MBPI_VALIDATION_PASS assertions 输出）
minimum_consumer_assertion_count: 19
