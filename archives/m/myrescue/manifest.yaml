# 软件级 manifest
# 文件位置: archives/m/myrescue/manifest.yaml

software: myrescue
display: "myrescue (受损磁盘/文件的数据抢救工具)"
description: "Rescue still-readable data blocks from a damaged disk or file, re-reading around bad areas with a block bitmap"
category: utility
homepage: "https://myrescue.sourceforge.net/"
license: "GPL-2.0-or-later"

build_system: makefile  # 5-line raw GNU make, no configure, no install target

ohos_adaptation:
  key_points:
    - "src/Makefile line 1 is a bare `CFLAGS = -Wall`: an environment CFLAGS is overwritten, only a make command-line override reaches the compiler"
    - "Upstream has no install target at all — package() installs bin/, share/man/ and share/doc/ by hand"
    - "Three executables ship from one `all:` target; all three must be signed for OHOS to exec them"
    - "Upstream tarball is flat (no top-level directory), so source() must use strip_root=False"
    - "<linux/usbdevice_fs.h> (HAVE_USBRESET) and the LFS64 open64()/lseek64() API are both present in the OHOS native sysroot — no patches needed"
    - "Upstream declares zero automated tests; functional proof comes from the test_package consumer suite"
  common_dependencies: []

versions:
  "0.9.8":
    status: built
    build_date: "2026-09-25"
