# 版本级 manifest
# 文件位置: archives/m/myrescue/0.9.8/manifest.yaml

version: "0.9.8"
software: myrescue

status: built
build_date: "2026-09-25"
build_system: makefile

source:
  url: "https://downloads.sourceforge.net/project/myrescue/myrescue/myrescue-0.9.8/myrescue-0.9.8.tar.gz"
  sha256: "b4ef60903a44b66c926adcd5d8ab70ddeab94b26c250601498a5e24b19e4c1d7"
  tar_format: tar.gz

build:
  system: makefile
  # 上游 src/Makefile 是 5 行裸 make 文件：无 configure、无 install 目标，
  # 且首行 `CFLAGS = -Wall` 会吞掉环境变量里的 CFLAGS ⇒ 只能在 make 命令行上覆盖。
  configure_options: []
  build_command: "make -j1 CC=<conan c compiler> CFLAGS=\"-Wall -fsigned-char -O2 -DNDEBUG\""
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []
# 零补丁。两处看似需要补丁的地方都做过探针并证明在 OHOS clang/musl 上原生可用：
#   * HAVE_USBRESET 依赖的 <linux/usbdevice_fs.h> 存在于 OHOS native sysroot
#   * open64()/lseek64() LFS64 入口在源码自带 _LARGEFILE64_SOURCE 时由 OHOS musl 提供
# plain char 有符号性问题走工具链 -fsigned-char 解决（E419 明令不要用平台宏）。

# ── 测试统计（五维账本，与 test_package/MANIFEST.yml、notes.md、PR 正文同源）──
tests:
  upstream_static_total: 0      # tar tzf 全清单 + 六类测试标记 grep + t/tests/test/spec 目录枚举，全 0
  upstream_registered: 0        # 唯一 Makefile 无 check/test 目标，无 TESTS 变量
  upstream_executed: 0          # 无可执行的上游测试
  upstream_skipped: 0
  upstream_failed: 0
  consumer_total: 46            # test_package/test.sh 自带计数器打印的 ASSERTION TOTAL
  consumer_passed: 46
  consumer_failed: 0

knowledge_gained:
  - "上游 src/Makefile 首行 `CFLAGS = -Wall` 是裸赋值：环境变量 CFLAGS 会被它覆盖，只有 make 命令行赋值才能压过它（同族先例见 DRAFT-genann-1.1.1-make-cflags-march-native-override）"
  - "上游 Makefile 没有任何 install 目标（README/INSTALL 就写着\"copy the binary\"），package() 必须自行安装 bin/、share/man/、share/doc/"
  - "裸 make 文件靠 GNU make 内建规则链接，默认 CC=cc；OHOS 上没有 cc 别名 ⇒ 未覆盖 CC 时首错是 `make: cc: No such file or directory` + `Error 127`"
  - "myrescue 的块状态是有符号 8 位（-1/-2=失败次数，2=读得慢），但通过 plain char 读回；AArch64 plain char 默认无符号 ⇒ \"离开坏区后再回来\" 这一半功能静默失效，实测 -fsigned-char 与否 8192/12288 与 12288/12288 之差（E419）"
  - "上游 tarball 是扁平结构（顶层直接 AUTHORS/COPYING/doc//src/），source() 用 strip_root=True 会被 conan 判 \"Can't untar a tgz containing files in the root with strip_root enabled\""
  - "设备 /tmp 只读，框架 ci/tools/extract_upstream_tests.sh 硬编码 /tmp ⇒ 上游测试清点的日志只剩失败记录，必须改手工等价扫描（见 notes.md 清点一节）"
