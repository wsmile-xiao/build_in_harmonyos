# conandata.yml — myrescue 0.9.8
#
# Source of record: the project's own SourceForge file release
# (myrescue / myrescue / myrescue-0.9.8 / myrescue-0.9.8.tar.gz).
# SHA256 was cross-checked against Debian's pristine upstream
# myrescue_0.9.8.orig.tar.gz on the A-machine build host — both archives are
# byte-identical (b4ef60903a44b66c926adcd5d8ab70ddeab94b26c250601498a5e24b19e4c1d7),
# so no downstream repacking is involved.  The Debian pool URL itself is not
# used here: it is a PF7/R39-blacklisted downstream source.

sources:
  url: "https://downloads.sourceforge.net/project/myrescue/myrescue/myrescue-0.9.8/myrescue-0.9.8.tar.gz"
  sha256: "b4ef60903a44b66c926adcd5d8ab70ddeab94b26c250601498a5e24b19e4c1d7"

patches: []
# No patches are required.  Two upstream traits that look like patch
# candidates were probed and both turned out to be fine on the OHOS clang /
# musl toolchain as-is:
#   * HAVE_USBRESET pulls in <linux/usbdevice_fs.h> — the UAPI header ships in
#     the OHOS native sysroot (verified with a compile probe).
#   * open64()/lseek64() LFS64 entry points are declared by OHOS musl once
#     _LARGEFILE64_SOURCE is defined by the sources themselves (verified with
#     a compile probe).
