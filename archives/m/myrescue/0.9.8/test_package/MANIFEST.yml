# test_package/MANIFEST.yml
# 上游官方测试声明文件 — myrescue 0.9.8
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
#
# ⚠ 框架清点脚本 ci/tools/extract_upstream_tests.sh 在本机不可用（它硬编码
#   /tmp，设备 /tmp 只读，日志只剩失败记录），因此下面的数字来自对**实物
#   tarball** 的手工等价清点，全过程留档在 notes.md「上游测试清点」一节：
#     - `tar tzf` 全清单（16 条目，见 notes.md）
#     - 跨框架六类测试标记 grep：Test::More / use_ok / def test_ / TEST_CASE /
#       add_test / enable_testing —— 全部 0 命中
#     - `t/ tests/ test/ spec/` 目录枚举 —— 0 个
#     - 唯一 Makefile（src/Makefile，5 行）中 check/test/TESTS —— 0 处
#     - 文件名含 test 的条目 —— 0 个

package: myrescue/0.9.8
homepage: "https://myrescue.sourceforge.net/"

# 上游没有任何测试入口；保留字面量供机器解析（对应 `make -n check` 会报
# "No rule to make target 'check'"）。
upstream_check_command: "make check"

# 上游不存在测试，因此 build() 中没有可执行的上游测试。
# build() 改为真实执行编译产物本身（`./myrescue -h` + test.sh 的功能断言），
# 这是本包唯一可主张的"执行"证据。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，调用已安装的三枚二进制）
test_package_tests:
  - file: test.sh
    description: "file->file 数据抢救功能测试：逐块恢复字节一致性、块位图编码（01/00/ff）、myrescue-stat 分类计数、myrescue-bitmap2ppm 像素着色、断点重试（signed-char 回归护栏）、-B/-s/-e/-A/-J/-b/-h 参数语义、安装产物与 man 页布局"
    command: "sh test.sh <bin_dir> <work_dir>"

# 测试断言总数（由 test.sh 自身计数并在末尾打印 ASSERTION TOTAL=…；
# 与 PR 正文 / notes.md / result 汇报同源，改断言必须同步改这里）
assertion_count: 46
