software: Menlo-Legacy
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.9022/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.9022"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
build_system: perl

# 编译日期（YYYY-MM-DD）
compile_date: "2026-06-17"
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/downloads/Menlo-Legacy-1.9022.tar.gz"

  # 源码校验和
  sha256: "a6acac3fee318a804b439de54acbc7c27f0b44cfdad8551bbc9cd45986abc201"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"
  # 注: 纯 Perl 模块，无需 configure 参数

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "ExtUtils::MakeMaker/6.63_03"
    - "Menlo/1.9018"

  # 运行时传递依赖（非 Makefile.PL 声明，但实际需要）
  runtime_dependencies:
    - "Class::Tiny/1.008"
    - "File::Which/1.27"
    - "String::ShellQuote/1.04"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无补丁 — 源码 0 修改

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块在 OpenHarmony 上编译无需任何修改，与 XS 模块形成鲜明对比"
  - "Menlo::CLI::Compat 的完整加载需要传递依赖 Class::Tiny、File::Which、String::ShellQuote"
  - "perl-dbd-pg 遇到的 SELinux HMDFS 限制不影响纯 Perl 模块"
  - "ExtUtils::MakeMaker 安装到用户目录需使用 INSTALL_BASE=~/usr/local 而非 --prefix"
