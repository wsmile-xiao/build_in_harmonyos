package: mppenc/1.16
homepage: "https://www.musepack.net/"

upstream_check_command: "cmake --build"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: conanfile.py
    description: "Runs mppenc --help and encodes a generated PCM WAV file"
    command: "conan test"
  - file: test_mppenc.py
    description: "Generates the 44.1 kHz PCM WAV fixture and verifies the encoded SV7 MPC header"
    command: "used by conanfile.py"

assertion_count: 4
