sources:
  url:
    - "https://deb.debian.org/debian/pool/main/m/mppenc/mppenc_1.16.orig.tar.gz"
  sha256: "228ede067c9d2e86d57ebaa8c5a578d6416afb6e1c3033874bfe2a89b84af979"

patches:
  "1.16":
    - patch_file: "patches/0001-src-fastmath.c.patch"
      patch_description: "Drop const on the runtime-initialized fastmath lookup tables (clang places the zero-filled tentative definitions into read-only .rodata and the first write in Init_FastMath segfaults)"
      patch_type: "portability"
    - patch_file: "patches/0002-src-mppdec.h.patch"
      patch_description: "Guard the glibc-only fpu_control.h include with __GLIBC__ (bionic lacks the header)"
      patch_type: "portability"
    - patch_file: "patches/0003-src-mppenc.c.patch"
      patch_description: "Make --help/--version exit 0 per CLI convention (K0; adds a --version banner branch)"
      patch_type: "portability"
    - patch_file: "patches/0004-src-mppenc.h.patch"
      patch_description: "Drop const on the fastmath table extern declarations together with the definitions"
      patch_type: "portability"
