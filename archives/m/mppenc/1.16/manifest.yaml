knowledge_gained:
  - "mppenc 1.16 是 Musepack SV7 编码器：输出 'MP+' 头、流版本字节 7，不存在 SV8 编码输出（SV8 仅有解码器）"
  - "termios 按键检测（探针族 #5）包在 #ifdef USE_TERMIOS 内且上游 CMake 构建未定义该宏，默认不编译、无行为影响"
  - "上游 --help/--longhelp 返回 1；K0 补丁使 --help/--longhelp rc=0 并新增 --version 分支（probcons-1.12 同族先例）"
  - "上游 cmake_minimum_required(2.4) 在 CMake 4.x 需注入 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "bionic 定义 __linux__ 但无 glibc 的 fpu_control.h；使用点 tools.c Init_FPU 已有 __i386__ 宏守卫，include 行加 __GLIBC__ 判别即可"
  - "上游 fastmath.c 四张查找表声明为 const 且运行时填充（无初始化器 tentative definition）；老 gcc 放可写 .bss，clang 放只读 .rodata，Init_FastMath 首次写入即 SIGSEGV——定义与 extern 声明须一并去 const"
  - "已沉淀知识草稿 knowledge/drafts/DRAFT-BCFF-const-table-rodata-segfault（kv+md 成对，待 promote）"

