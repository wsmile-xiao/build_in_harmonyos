software: mppenc
display: "mppenc"
description: "Musepack (MPC) SV7 无损音频编码器命令行工具"
category: audio
homepage: "https://www.musepack.net/"
license:
  - LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 应用构建，仅产出 mppenc 可执行文件，零外部依赖（仅 libm）"
    - "CMake 4.x 兼容：注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（上游声明 cmake_minimum_required 2.4）"
    - "K0：最小补丁使 --help/--longhelp 退出码为 0（上游返回 1）"
  common_dependencies: []

versions:
  "1.16":
    status: built
    build_date: "2026-09-25"
    conan_ref: "mppenc/1.16"
    tests: "conan create 消费侧冒烟 4/4：--help rc=0、WAV 实际编码、SV7 头校验"
