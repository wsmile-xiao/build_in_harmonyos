# test_package/MANIFEST.yml — mecab-jumandic 7.0-20130310
# NLP dictionary data package (Japanese JumanDic dictionary for MeCab)
type: data
test_type: consumer
test_file: conanfile.py
description: |
  mecab-jumandic 7.0-20130310 dictionary data integrity verification plus
  HarmonyOS target-environment consumption test. Data tier (python script):
  file existence (16 CSV, 9 DEF, dicrc), UTF-8 validation (incl. exact
  upstream-inherited truncated-sequence quirk budget for 4 files), core entry
  counts, exact total CSV line count (751,185), required binary indices
  (char.bin/matrix.bin/model.bin/sys.dic/unk.dic) and dicrc layout. Native
  tier (C++ via CMake + libmecab from mecab/0.996): loads the binary
  dictionary on OHOS aarch64 with --rcfile (OHOS read-only rootfs has no
  //etc/mecabrc) and compares 3 fixed Japanese samples against golden
  tokenization output.
test_coverage:
  file_existence: true
  utf8_validation: true  # includes upstream-inherited quirk budget
  entry_count: true
  total_lines: exact  # == 751185
  binary_indices: required  # generated via tool_requires mecab/0.996
  ohos_native_consumption: true  # C++ libmecab, golden output comparison
