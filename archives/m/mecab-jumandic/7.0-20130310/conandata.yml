# conandata.yml
# mecab-jumandic 7.0-20130310 — Japanese JumanDic dictionary data for MeCab
#
# The canonical upstream release is hosted on Google Drive (unstable for
# automated builds). The Debian official pool mirror carries the identical
# upstream orig tarball (SHA256 matches the mecab-jumandic_7.0-20130310-7.dsc
# record; also mirrored by TUNA/USTC for mainland-China build environments).
sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/m/mecab-jumandic/mecab-jumandic_7.0-20130310.orig.tar.gz"
    - "https://mirrors.ustc.edu.cn/debian/pool/main/m/mecab-jumandic/mecab-jumandic_7.0-20130310.orig.tar.gz"
    - "https://deb.debian.org/debian/pool/main/m/mecab-jumandic/mecab-jumandic_7.0-20130310.orig.tar.gz"
  sha256: "eaf216758edee9a159bc3d02507007318686b9537943268c4565cc1f9ef07f15"

# No patches needed for this version:
# - The 4 files with truncated-UTF-8 line endings (AuxV.csv, left-id.def,
#   right-id.def, model.def) are upstream-inherited data shipped as-is by
#   Debian's unpatched package; mecab-dict-index tolerates them. Patching
#   would deviate from the official release byte content.
# - dicrc is copied next to the binary indices in build() (upstream
#   Makefile.am achieves the same by installing dicrc into dic_DATA).
patches: []
