package: mmdb/2.0.22
homepage: "https://www.ccp4.ac.uk"

upstream_check_command: "make check (invoked from recipe build(); automake check target exists but registers no suite)"
upstream_test_in_build: true
upstream_test_command: "make -j4 check"

# Inventory of the upstream 2.0.22 release tarball (mmdb2-2.0.22).
# N_static = 0: the tree declares no TESTS / check_PROGRAMS / add_test and
# ships no tests directory or sample coordinate file. The four measuring
# commands and their hit counts are recorded in notes.md.
upstream_tests: []

test_package_tests:
  - file: mmdb_consumer_test.cpp
    description: "Consumer program against the installed public API: writes a deterministic 3-atom PDB fixture, parses it with mmdb::Manager::ReadPDBASCII, resolves the hierarchy bottom-up through the public handles (Root::GetAtomI -> Atom::residue -> Residue::chain -> Chain::GetModel), asserts model/chain/residue counts plus every atom field (serial, aligned name, element, x/y/z, occupancy, temperature factor), serializes with WritePDBASCII, re-reads the generated file and repeats the whole inspection, then checks the mmdb_tables.h lookup functions (isAminoacid, isSolvent, isDNARNA, getMolecWeight, getCovalentRadius, getElementNo, Get1LetterCode, GetAAPIndex, GetAAHydropathy) and the mmdb_utils.h fixed-column parsers (GetInteger, GetReal, PutInteger). Exit code is decided by the assertions."
    command: "./mmdb_consumer_test"

assertion_count: 84
