source:
  url: "https://ftp.ccp4.ac.uk/opensource/mmdb2-2.0.22.tar.gz"
  sha256: "70533e91565bf37cc14eb76304ac649fdbb0bd4694bbb07313a7c0ddbc4a94e2"

patches_applied: []

upstream_tests:
  command: "make -j4 check (invoked from build(); automake check target with no registered suite)"
  static_count: 0
  registered_count: 0
  executed_count: 0
  skipped_count: 0
  notes: "The mmdb2-2.0.22 release tarball registers no automated test at all: Makefile.am declares only lib_LTLIBRARIES / pkginclude_HEADERS / pkgconfig_DATA and contains no TESTS or check_PROGRAMS, configure.ac declares no test hook, there is no tests directory, and the tarball ships no sample coordinate file either (measuring commands and hit counts in notes.md). Because the denominator upstream provides is zero, make check executes 0 cases by construction; the recipe still runs it so a future suite cannot be skipped silently. Functional coverage comes from the 84-assertion consumer program in test_package (see test_package/MANIFEST.yml)."

test_package:
  program: mmdb_consumer_test
  assertion_count: 84
  description: "Parses a deterministic 3-atom PDB fixture through mmdb::Manager::ReadPDBASCII, resolves the hierarchy bottom-up over the public handles (Root::GetAtomI -> Atom::residue -> Residue::chain -> Chain::GetModel), asserts the model/chain/residue counts and every atom field, writes the model back with WritePDBASCII, re-reads the generated file and repeats the inspection, then asserts real behaviour of the residue/element tables and of the fixed-column parsers (GetInteger/GetReal/PutInteger)."

knowledge_gained: []
