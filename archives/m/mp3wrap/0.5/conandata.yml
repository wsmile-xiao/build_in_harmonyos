sources:
  url: "https://downloads.sourceforge.net/project/mp3wrap/mp3wrap/mp3wrap%200.5/mp3wrap-0.5-src.tar.gz"
  sha256: "1b4644f6b7099dcab88b08521d59d6f730fa211b5faf1f88bd03bf61fedc04e7"

patches:
  - patch_file: "patches/0001-crc-uint32t.patch"
    patch_description: "Replace u_int32_t with uint32_t in crc.c — the BSD u_int32_t type is not defined by musl/OHOS libc; uint32_t (from stdint.h) is the portable C99 standard equivalent"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-022.patch"
    patch_description: "Use umask 022 instead of umask 077 for config.status temp directory — the OHOS hmdfs filesystem applies setgid on mkdir, and umask 077 creates drwx--S--- dirs the build process cannot write to"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-shell-override.patch"
    patch_description: "Use /bin/sh instead of $SHELL to invoke config.status — the OHOS profile sets SHELL to /data/service/hnp/bin/bash which may not exist on all build hosts; /bin/sh is the POSIX shell guaranteed to exist"
    patch_type: "portability"
  - patch_file: "patches/0004-mp3wrap-option-int.patch"
    patch_description: "Change getopt return variable from char to int — on AArch64 char is unsigned by default, so getopt's -1 (EOF) becomes 255, making the while loop never terminate and fall into the default error case; int is the correct type for getopt's return value"
    patch_type: "portability"
