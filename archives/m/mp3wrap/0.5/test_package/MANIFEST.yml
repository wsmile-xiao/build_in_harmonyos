# test_package/MANIFEST.yml — mp3wrap 0.5
# CI L0e requires this file to exist.
# Upstream has zero test programs; test_package provides the full functional suite.

package: mp3wrap/0.5
homepage: "https://mp3wrap.sourceforge.net/"

# Upstream test audit
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream tests: NONE
# Evidence:
#   - Makefile.in (automake 1.5) line 323-324: check-am: all-am / check: check-am
#     (check target only rebuilds; no test execution)
#   - Makefile.am: no TESTS, no check_PROGRAMS, no check-local, no test scripts
#   - No tests/ or test/ directory in tarball
#   - configure.ac: no AC_CONFIG_TESTDIR, no test-related macros
#   - No CI configuration files in tarball
#   - No shell test scripts in tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: >-
      Generates two minimal valid MPEG1 Layer 3 MP3 frame fixtures (104 bytes
      each, 32 kbps 44100 Hz mono), merges them with mp3wrap, validates the
      output file structure (ID3v2 header, WRAP index marker, size), lists
      wrapped files with mp3wrap -l, and runs negative tests for missing
      arguments, insufficient arguments, and nonexistent input files.
    command: "bash test.sh"

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 1
assertion_count: 12
