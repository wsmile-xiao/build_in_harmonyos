package: mp3wrap
version: "0.5"
homepage: "https://mp3wrap.sourceforge.net/"
license: LGPL-2.0-or-later
status: published
build_system: autotools
build_date: "2026-08-31"

source:
  url: "https://downloads.sourceforge.net/project/mp3wrap/mp3wrap/mp3wrap%200.5/mp3wrap-0.5-src.tar.gz"
  sha256: "1b4644f6b7099dcab88b08521d59d6f730fa211b5faf1f88bd03bf61fedc04e7"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-crc-uint32t.patch"
  - "0002-configure-umask-022.patch"

upstream_tests:
  command: "make check"
  test_count: 0
  notes: >-
    The release Makefile.in (automake 1.5) defines check-am: all-am and
    check: check-am — the check target only rebuilds; no TESTS, no
    check_PROGRAMS, no check-local, no test/ or tests/ directory, no
    shell test scripts, no CI configuration. The tarball contains no
    upstream test suite whatsoever.

test_package:
  assertion_count: 12
  description: >-
    Generates two minimal valid MP3 frame fixtures at runtime, invokes
    mp3wrap to merge them, verifies the _MP3WRAP.mp3 output is created
    and non-empty, validates the WRAP index header and ID3v2 tag
    structure, confirms merged file size equals inputs plus overhead,
    and runs negative tests for missing files and insufficient arguments.

knowledge_gained:
  - "u_int32_t (BSD type) is absent in musl/OHOS libc — replace with uint32_t (C99 stdint.h)"
  - "configure uses umask 077 for config.status tmp dir; OHOS hmdfs setgid makes those dirs unwritable"
  - "mp3wrap 0.5 ships automake 1.5 configure with no config.sub/config.guess"
  - "Output file naming: <basename>_MP3WRAP.mp3 (EXT macro in mp3wrap.h)"
