software: mp3wrap
display: "Mp3Wrap"
description: "Command-line utility to wrap multiple MP3 files into one large playable MP3 file without losing filename and ID3 information"
category: utility
homepage: "https://mp3wrap.sourceforge.net/"
license: LGPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "crc.c uses u_int32_t (BSD type) — replace with uint32_t (C99 stdint.h) for musl/OHOS"
    - "configure uses umask 077 for config.status tmp dir — OHOS hmdfs setgid makes those dirs unwritable; patch to umask 022"
    - "automake 1.5 configure ships no config.sub/config.guess; --build/--host triples are passed directly"
  common_dependencies: []

versions:
  "0.5":
    status: published
    build_date: "2026-08-31"
    patches: 2
