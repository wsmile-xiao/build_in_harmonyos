software: mosh
version: 1.4.0
status: built
compiled_at: "2026-05-22"

source:
  url: "https://github.com/mobile-shell/mosh/releases/download/mosh-1.4.0"
  tarball: "mosh-1.4.0.tar.gz"

build:
  system: autotools
  options:
    - "--prefix=/storage/Users/currentUser/usr/local"

dependencies:
  - protobuf/21.12
  - ncurses/6.4

patches:
  - 0001-Makefile.in.patch
  - 0002-aminclude_static.am.patch
  - 0003-configure.patch
  - 0004-src-include-config.h.in.patch

notes: |
  - HarmonyOS 缺少 getutxent() 函数，禁用 HAVE_UTMPX_H
  - utmp 功能不影响核心 SSH 替代功能
