package: mygui/3.4.4
homepage: "https://github.com/MyGUI/mygui"

# 上游未随包集成测试（MyGUI 的 UnitTests 需依赖 CMake enable_testing，
# 本配方按 R40 关闭 demos/tools/unittests，仅保留引擎 + OpenGLES 平台）。
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本次构建未运行上游 unittests）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证：真实头文件 + 真实链接 MyGUIEngine）
test_package_tests:
  - file: test.cpp
    description: "include MyGUI.h + link MyGUIEngine + 调用 LogManager 真实符号"
    command: "./test_mygui"
  - file: test_headless.cpp
    description: "r11 headless 功能测试：Dummy 资源注册/isDataExist/getDataPath/getData/递归路径/缺失资源确定性行为（无需显示/渲染器，断言结果）"
    command: "./test_headless"

assertion_count: 14
