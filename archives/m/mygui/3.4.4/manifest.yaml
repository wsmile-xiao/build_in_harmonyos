# 版本级 manifest — mygui 3.4.4
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.4.4"

# 软件名
software: "mygui"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方上游源码 URL（MyGUI/mygui tag MyGUI3.4.4）
  url: "https://github.com/MyGUI/mygui/archive/refs/tags/MyGUI3.4.4.tar.gz"

  # 官方归档 SHA-256（已校验）
  sha256: "2b4b87c5c04cd9a33413d0ccebc1aa03b56c72873901633c85be2652ceb6785b"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DMYGUI_RENDERSYSTEM=1"   # Dummy 渲染平台（本地无头验证；OpenGLES 为后续项）
    - "-DMYGUI_USE_FREETYPE=ON"
    - "-DMYGUI_BUILD_DEMOS=OFF"
    - "-DMYGUI_BUILD_TOOLS=OFF"
    - "-DMYGUI_BUILD_UNITTESTS=OFF"
    - "-DMYGUI_BUILD_PLUGINS=OFF"
    - "-DMYGUI_BUILD_WRAPPER=OFF"
    - "-DMYGUI_BUILD_DOCS=OFF"

  # 编译依赖列表（ohpcd 制品仓已发布）
  dependencies:
    - freetype/2.14.3.1
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 本轮无源码补丁
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "MyGUI 无头本地验证用 MYGUI_RENDERSYSTEM=1 (Dummy) 平台，规避 OpenGL 依赖"
- "OHOS SDK 提供 GLES3 头与 libEGL/libGLESv2/libGLESv3，OpenGLES 平台 (RENDERSYSTEM=8) 为后续适配项"
- "MyGUIEngine 依赖 freetype+zlib；CMake FindFreetype/FindZLIB 需 CMAKE_PREFIX_PATH 指向 conan 包目录"