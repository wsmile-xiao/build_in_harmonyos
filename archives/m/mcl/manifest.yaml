software: mcl
display: "mcl"
description: "Markov 聚类算法套件（mcl 聚类引擎 + clm/mcx/mcxload/mcxdump 等图与矩阵分析 CLI 工具）"
category: tool
homepage: "https://micans.org/mcl/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "官网 tarball 自带预生成 configure（标准 automake）；configure.ac 无 AC_CANONICAL，但 build 类型探测仍会执行 config.guess（CI worker HOME/tmp 不可写即炸 cannot guess build type）→ 配方显式传 --build/--host=aarch64-unknown-linux-musl（随包 config.sub 不识别 ohos 后缀，CI #63497 实测）；唯一外部依赖 cimfomfa/21-361（libtingea：Makefile.am 无条件 LDADD=-ltingea，核心聚类库仍随源码捆绑）"
    - "上游无 test/check 目标（testing/ 为交互式人工观察 harness）→ 配方 build() 以确定性数据集真实聚类管线自检，消费者测试覆盖 mcxload→mcl→mcxdump"
    - "doc/ man 页全部预生成分发且时间戳晚于 .azm 源（实测逐对核验）→ 不触发 zoem/troff 重建，无需占位"
    - "E114 umask 077→022 生成脚本替换 + §12.38① env -u CONFIG_SHELL + E074 make -j1（zzuf/gtypist 先例组合）；CLI 门禁 commands.json（R38）"

versions:
  "22-282":
    status: prepared
    conan_ref: "mcl/22-282"
