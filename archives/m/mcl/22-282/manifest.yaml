# 版本级 manifest — mcl 22-282
# 遵循 ARCHIVE-SPEC v2.0

version: "22-282"
software: "mcl"
status: built
build_date: ''
build_system: autotools

source:
  url: "https://micans.org/mcl/src/mcl-22-282.tar.gz"
  sha256: "291f35837b6e852743bd87e499c5a46936125dcdf334f7747af92e88ac902183"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>"
    - "--build=aarch64-unknown-linux-musl"
    - "--host=aarch64-unknown-linux-musl"
    - "（configure 由上游预生成、configure.ac 无 AC_CANONICAL，但真机/CI worker 的 HOME 与临时目录可能不可写——configure 运行期 build 类型探测仍会执行 config.guess（编译 dummy.c），目录不可写即炸 cannot guess build type；显式 --build/--host 三元组跳过探测。后缀用 musl：随包 config.sub（2022-05-25）不识别 ohos；linux 分支无差异化处理，musl 与 gnu 等价。CI #63497 实测）"
  dependencies:
    - cimfomfa/21-361  # Makefile.am 无条件 LDADD=-ltingea + ivp.h include <tingea/types.h>；核心聚类库仍随源码捆绑（noinst 静态库），系统 libm/libpthread 由 cimfomfa cpp_info system_libs 与 ACX_PTHREAD 覆盖
  cc: clang
  upstream_test_command: "（上游无 test/check 目标：testing/ 为交互式人工观察 harness，硬编码 /usr/local/bin 路径；由配方 build() 自检 + test_package 消费者测试补足）"

patches_applied: []  # 无补丁文件；平台适配（umask/CONFIG_SHELL）在配方内完成

knowledge_gained:
  - "mcl 22-282 实际依赖姊妹库 cimfomfa（libtingea）：上游 Makefile.am 无条件 LDADD=-ltingea 且 src/impala/ivp.h include <tingea/types.h>，但 configure 不做任何探测 —— 依赖缺失在编译期才炸（ivp.h 首错），W0 阶段仅读 configure.ac 会误判'无依赖'，必须 grep Makefile.am 的 LDADD/LIBS 与全源码 include（真机首验教训）"
  - "mcl 22-282 为标准 automake 递归构建，二进制落点在各自源子目录（src/shmx/mcxload、src/shmcl/mcl 等），顶层无 bin/ —— 自检与审计引用产物路径时必须用子目录路径"
  - "上游无 test/check 目标；testing/ 为交互式人工观察 harness（硬编码 /usr/local/bin/{bash,perl,mcl}），不可离线自动化 → 配方 build() 以确定性数据集真实聚类管线自检（断言两簇精确划分），消费者测试覆盖 mcxload/mcl/mcxdump"
  - "doc/ 的 man 页全部预生成分发（.azm 源同步随包发布，且全部产物时间戳晚于对应 .azm，实测逐对核验）→ make 不会触发 zoem/troff 重建，无需补占位"
  - "configure/config.status 内部 umask 077 → E114 生成脚本替换 + 命令前置 umask 022；§12.38① env -u CONFIG_SHELL + E074 make -j1（zzuf/gtypist 同款组合）"
  - "CI worker 的 HOME/.cache/tmp 不可写：autoconf 生成 configure 的 build 类型探测会执行 config.guess（创建 dummy.c 编译），临时目录不可写即炸 cannot guess build type——显式 --build/--host 三元组跳过；旧 config.sub（2022-05-25）不识别 ohos 后缀，须用 musl（或 gnu）等可识别后缀（mcl CI #63497 实测；MateBook 侥幸通过因该目录恰好可写，Windows 阶段 W0 不能只看 configure.ac 有无 AC_CANONICAL_*）"
  - "mcl -use-tab <tab> 使 mcl 以标签输出聚类（cls 每行一簇标签）；mcxdump -tab <tab> 为矩阵标签转储 —— 消费者测试均基于此实现顺序不敏感断言"
