# test_package/MANIFEST.yml
# mcl 22-282
# 上游没有可自动化运行的测试套件：构建体系为标准 automake，但
# configure.ac / 各 Makefile.am 均未定义 test/check 目标（grep TESTS
# 与 check 目标实测为零命中）；testing/ 目录内容是交互式人工观察
# harness（gopher/水母网络探索脚本），内部硬编码 /usr/local/bin/bash、
# /usr/local/bin/perl 与 /usr/local/bin/mcl 等绝对路径，依赖人工判读
# 输出，不可离线自动断言。按赛事规则说明原因并自补消费者测试。

package: mcl/22-282
homepage: "https://micans.org/mcl/"

upstream_tests_exist: false
upstream_test_audit: >
  mcl 22-282 官网 tarball 为标准 automake 构建，但上游未提供任何
  test/check 目标（全部 Makefile.am 与 configure.ac 无 TESTS 变量、
  无 check 目标）。testing/ 目录是交互式人工观察 harness（含 mcl
  聚类可视化探索脚本），硬编码 /usr/local/bin/{bash,perl,mcl} 绝对
  路径并依赖人工判读，属上游设计而非可自动化测试套件，上游测试计数
  为 0 属"上游不存在"，非"未运行"。自补消费者测试以真实聚类管线
  （mcxload→mcl→mcxdump）覆盖核心算法与数据转换组件；配方 build()
  阶段另以同一确定性数据集做构建自检（断言两簇精确划分）。
upstream_test_count: 0
upstream_check_command: "（上游无自动化测试；testing/ 为交互式人工观察 harness）"
upstream_test_in_build: true

# test_package 中自带的测试（消费者视角, R34: 真实执行被适配工具）
test_package_tests:
  - file: test_mcl.sh
    description: >
      消费者视角: 真实执行包内 mcl 套件，6 项断言（mcl/mcx --version /
      mcxload abc→mci / tab 标签完整 / mcl -I 1.4 真实 Markov 聚类
      两簇精确划分 {a1,a2,a3}+{b1,b2} / mcxdump -tab 标签转储），全部
      离线确定性
    command: "bash test_mcl.sh <package>/bin"

# 断言总数（消费者 6 项）
assertion_count: 6
