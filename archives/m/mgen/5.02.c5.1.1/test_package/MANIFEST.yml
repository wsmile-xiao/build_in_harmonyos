# test_package/MANIFEST.yml
# Upstream test declaration for mgen 5.02.c5.1.1 (upstream release V5.1.1).
# Upstream ships no automated tests; the consumer tests below validate the
# packaged application binaries instead.

package: mgen/5.02.c5.1.1
homepage: "https://github.com/USNavalResearchLaboratory/mgen"

# ---- Upstream test audit ---------------------------------------------------
# Audited the V5.1.1 source tree (tag tarball, sha256
# f701b93d9e7a010b20cf9478c4da5535a478ceca040437a3b0415644024d2cfb)
# and the pinned protolib submodule tree — no automated tests exist:
upstream_tests_exist: false
upstream_test_audit:
  - source: "mgen-5.1.1 source tree (root, src/common, src/python, src/sim, include, doc, mgendr)"
    reason: "No tests/, test/, testing/ or regress/ directory at any level; no *test*.cpp/*test*.c harness files (only opnet sim version dirs 11.5/12.0 whose names merely contain 'latest')."
  - source: "makefiles/Makefile.linux + makefiles/Makefile.common"
    reason: "Targets are exactly: all (mgen mpmgr), mgen, mpmgr, pcap2mgen, gpsPub, mgenPayloadMgr, mgenBlast, clean, distclean — no check/test target. `make check` would fail with 'No rule to make target'."
  - source: "protolib @7264863 (makefiles/Makefile.linux + Makefile.common)"
    reason: "Targets build libprotokit.a / examples only; no check/test target, no test wiring."
  - source: "Debian source package mgen 5.02.c+really5.1.1 (debian/rules)"
    reason: "Debian build only compiles and installs the binaries/docs; no test suite is executed during the package build either."
  - conclusion: "Upstream V5.1.1 provides no automated tests; the adaptation's test_package validates the installed mgen/mpmgr binaries as runtime consumer checks and does not claim upstream coverage."

# rule4 强制字段：upstream_test_total 必须显式声明。
# mgen V5.1.1 经完整审计确认确实没有任何自动化测试（见上方审计），官方注册
# 总数即 0，口径为 manual_audit（纯 Makefile 项目，无任何测试框架可解析）。
upstream_test_total: 0
upstream_test_count_method: manual_audit
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_skipped: 0

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ---- Consumer tests (test_package) -----------------------------------------
# test_package/conanfile.py runs test_mgen.sh against the packaged
# bin/mgen + bin/mpmgr: 6 deterministic `mgen help` output assertions
# (version banner + 5 usage keywords), 1 mpmgr existence check, 1
# unknown-command no-hang probe. test_mgen.sh prints
# HMBS_TEST_PACKAGE_RESULT; conanfile.py re-emits
# HMBS_UPSTREAM_TEST_RESULT (status=no_tests, 0 counts).
test_package_tests:
  - file: test_mgen.sh
    description: "真实执行打包的 mgen/mpmgr：`mgen help` 输出非空且含版本横幅 mgen: version 5.1.1 与 input/output/convert/interface 用法行；mpmgr 存在且可执行；未知命令 15 秒内退出不挂起"
    command: "sh test_mgen.sh <package>/bin/mgen <package>/bin/mpmgr"

assertion_count: 8
