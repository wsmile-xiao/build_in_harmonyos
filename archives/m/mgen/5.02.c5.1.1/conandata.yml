# conandata.yml — mgen 5.02.c5.1.1
# Both archives are official GitHub sources (R39):
#   * mgen: upstream release tag V5.1.1 (MGEN_VERSION "5.1.1"; VERSION.TXT
#     lineage 5.02c — hence recipe version 5.02.c5.1.1, matching Debian's
#     5.02.c+really5.1.1 source versioning).
#   * protolib: the exact submodule commit V5.1.1 pins
#     (gitlink 726486395910740a02ff3137752d1a1c82cb3e81, see .gitmodules).
#     The GitHub tag tarball excludes submodules, so source() fetches this
#     second archive into <source>/protolib — the layout makefiles expect.
# sha256 values are the real downloaded bytes (python hashlib, 2026-10-03).
# No patches section: the optional HAVE_PCAP/-lpcap is stripped at build
# time via a plain text replace in build() (a .patch hunk failed to apply:
# tag-tarball bytes differ from a git checkout; see preflight
# "source file is different - makefiles/Makefile.linux").

sources:
  mgen:
    url: "https://github.com/USNavalResearchLaboratory/mgen/archive/refs/tags/V5.1.1.tar.gz"
    sha256: "f701b93d9e7a010b20cf9478c4da5535a478ceca040437a3b0415644024d2cfb"
  protolib:
    url: "https://github.com/USNavalResearchLaboratory/protolib/archive/726486395910740a02ff3137752d1a1c82cb3e81.tar.gz"
    sha256: "b484682416e07309f505e7a7f9f2e4b2f67b8d315b041844a047a06f7bea29d4"
