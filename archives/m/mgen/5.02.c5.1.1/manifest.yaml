version: "5.02.c5.1.1"
software: "mgen"
status: built
build_date: "2026-10-03"
build_system: makefile

source:
  url: "https://github.com/USNavalResearchLaboratory/mgen/archive/refs/tags/V5.1.1.tar.gz"
  sha256: "f701b93d9e7a010b20cf9478c4da5535a478ceca040437a3b0415644024d2cfb"
  tar_format: tar.gz
  extra:
    protolib_url: "https://github.com/USNavalResearchLaboratory/protolib/archive/726486395910740a02ff3137752d1a1c82cb3e81.tar.gz"
    protolib_sha256: "b484682416e07309f505e7a7f9f2e4b2f67b8d315b041844a047a06f7bea29d4"
    protolib_note: "upstream git submodule pinned by V5.1.1 (gitlink 7264863); fetched into <source>/protolib"

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  make_target: "all (default: mgen mpmgr, via makefiles/Makefile.linux)"

patches_applied: []

knowledge_gained:
  - "mgen V5.1.1 (MGEN_VERSION 5.1.1) belongs to the 5.02c codebase lineage; recipe version 5.02.c5.1.1 mirrors Debian's 5.02.c+really5.1.1 versioning"
  - "GitHub tag tarballs exclude the protolib git submodule — it must be fetched as a second official archive into <source>/protolib"
  - "HAVE_PCAP is optional upstream (all pcap code is #ifdef guarded); OHOS build disables it so no libpcap is required (only CLONE pcap-replay pattern unavailable)"
  - "mgen main() comes from protolib's PROTO_INSTANTIATE_APP(MgenApp) macro, not from a main.cpp in mgen sources"
  - "Upstream ships no automated test suite (no check/test make target, no tests/ dir); test_package validates the installed binaries instead"
