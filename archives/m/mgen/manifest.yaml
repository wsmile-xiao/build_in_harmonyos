software: mgen
display: "MGEN"
description: "NRL Multi-Generator: IP network performance test traffic generator"
category: network
homepage: "https://github.com/USNavalResearchLaboratory/mgen"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "GitHub tag tarball excludes the protolib git submodule; fetched as a second official archive into <source>/protolib"
    - "Plain Makefile project (Makefile.linux): CC overridden on the make command line from Conan conf (R33), propagates to the protolib sub-make"
    - "Optional HAVE_PCAP disabled on OHOS via patch (zero external deps); libxml2 not needed (protoXml.cpp not in libprotokit.a)"
    - "Upstream ships no automated test suite; test_package validates the installed mgen/mpmgr binaries (8 runtime cases)"
  common_dependencies: []

versions:
  "5.02.c5.1.1":
    status: built
    build_date: "2026-10-03"
    conan_ref: "mgen/5.02.c5.1.1"
