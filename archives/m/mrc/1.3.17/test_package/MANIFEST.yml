# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: mrc/1.3.17
homepage: "https://forge.hekkelman.net/maarten/mrc"

# 上游测试：src/mrc-unit-test.cpp 含 9 个 TEST_CASE（Catch2），依赖由 CMakeLists 的
# `CPMAddPackage("gh:catchorg/Catch2@3.5.0")` 拉取 —— CI 沙箱禁网（且 gh: 走 GitHub）。
#
# 但上游在 CPMAddPackage 之前设了 `CPM_USE_LOCAL_PACKAGES ON` → CPM 会**先尝试
# find_package(Catch2)**，命中即不再联网。故本配方提供门控 option
# `run_upstream_tests`（默认 False）：开启时 test_requires("catch2/3.8.1") 并把
# Catch2_DIR 指向包内上游 config → **离线**满足 CPM，**无需 patch 上游 CMakeLists**。
upstream_check_command: "conan create archives/m/mrc/1.3.17 -o mrc/*:run_upstream_tests=True（实测：CPM 命中本地 catch2/3.8.1，ctest 100% passed）"

# conanfile.py build() 中**已实跑**上游测试（门控开启时）
upstream_test_in_build: true
upstream_test_command: "cmake --build <build> --target test（CTest，1 个 test 目标含 9 个 Catch2 TEST_CASE）"

# 上游测试来源与实际结果（schema 对齐既有 MANIFEST.yml：file/description/command）
upstream_tests:
  - file: src/mrc-unit-test.cpp
    source: mrc-1.3.17/src
    description: "Catch2 v3 单元测试（9 个 TEST_CASE / 32 assertions）：rsrc 句柄、streambuf/istream 读取、空路径与子目录/子子目录查找"
    command: "cmake --build <build> --target test  # CTest: 1 test target（unit-test）内含 9 个 Catch2 TEST_CASE"
    result: "9/9 test cases passed（32 assertions）；ctest: 100% tests passed, 0 tests failed out of 1"
    note: "仅当门控 option run_upstream_tests=True 时实跑；默认关闭以保持交付包无测试依赖"

# test_package 中新增的测试（真实执行工具）
test_package_tests:
  - file: run_mrc_tests.sh
    description: "真实执行 mrc 二进制：用仓库内 hello.txt（纯文本资源）在**运行期**生成 .obj，并对产物做 6 项内容校验（R34）：① mrc 退出码 0；② 产物非空；③ 产物为 ELF relocatable；④ 架构为 AArch64；⑤ 产物内嵌资源载荷文本；⑥ 产物导出 mrc 约定的 gResource 符号（gResourceIndex/Data/Name）"
    command: "sh run_mrc_tests.sh <mrc_bin> hello.txt <out_dir>"
    note: "readelf 不可用时第 ③④ 项标 SKIP 并明示环境限制，不计为通过；产物输出到 build_folder 下的 _mrc_test/ 子目录（不落 test_package/），且 .obj 与日志已在 .gitignore 排除 —— 仓库内**不含**任何预编译产物（R19）"
  - file: conanfile.py
    description: "调用上述脚本并解析汇总行 RESULT: passed=N failed=M；failed>0 或 passed==0 一律报错（不静默放过）"
    command: "conan create archives/m/mrc/1.3.17"

# 断言总数（test_package 6 个断言：见 run_mrc_tests.sh 的六项校验）
assertion_count: 6

# R19 合规声明：PR 内不含预编译二进制
no_prebuilt_binaries: true
