software: mrc
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3.17/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.3.17"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-11"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://forge.hekkelman.net/maarten/mrc/archive/v1.3.17.tar.gz"
  sha256: "0d638fb534161d56906b30099891e95c6286e0e96a33cdfaa613f92234a7adfd"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

compiler: clang

requires:
  - "libmcfp/1.4.2"

build_options:
  - "默认 BUILD_TESTING=OFF：上游单元测试经 CPMAddPackage 拉 Catch2（gh: 域名），CI 禁网"
  - "门控 option run_upstream_tests=True：用 test_requires(catch2/3.8.1) + Catch2_DIR 离线满足 CPM，实跑上游 9 个 TEST_CASE（无需 patch 上游 CMakeLists）"
  - "mcfp_DIR 指向依赖包内上游 config（上游 CPM_USE_LOCAL_PACKAGES=ON 会先 find_package(mcfp)）"

# ============================================================
# 测试信息
# ============================================================

test_status: passed

test_note: "**上游单元测试已实跑：9/9 test cases 通过（32 assertions）**。上游测试经 `CPMAddPackage(\"gh:catchorg/Catch2@3.5.0\")` 拉取，CI 沙箱禁网；但上游 CMakeLists 在 CPMAddPackage 前设了 **`CPM_USE_LOCAL_PACKAGES ON`** → CPM 会先 `find_package(<name>)`，命中即不联网。故配方提供门控 option `run_upstream_tests`：用 `test_requires(\"catch2/3.8.1\")` + 把 `Catch2_DIR` 指向包内上游 config，**离线**满足 CPM，**无需 patch 上游 CMakeLists**。实测 `-o mrc/*:run_upstream_tests=True` 时 configure 输出 `-- CPM: Using local package Catch2@3.8.1`，ctest `100% tests passed, 0 tests failed out of 1`（1 个 ctest 目标内含 9 个 Catch2 TEST_CASE）。默认（option 关）保持 BUILD_TESTING=OFF，交付包不带测试依赖（实测构建日志中 Catch2 零提及）。另 test_package **真实执行** mrc 二进制：用仓库内 hello.txt（纯文本资源）在**运行期**生成 .obj 并校验存在且非空（R34）。⚠️ R19：产物输出到 build_folder 下的 `_mrc_test/` 子目录（不落 test_package/），且已在 test_package/.gitignore 排除 —— 仓库内**不含**任何预编译二进制（初审曾误提交本地生成的 hello-rsrc.obj，已删除并改进输出路径防复发）。"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "mrc 依赖 mcfp，上游用 CPMAddPackage 指向 forge.hekkelman.net（非 GitHub 域名，CI 镜像回退覆盖不到）——改为 conan 依赖 libmcfp，并用 mcfp_DIR 指向包内 lib/cmake/mcfp（上游已设 CPM_USE_LOCAL_PACKAGES ON，CPM 会先试 find_package）"
  - "包名与 CMake 名不一致：conan 包名 libmcfp，而上游导出 CMake 包名/target 是 mcfp / mcfp::mcfp —— 只靠 CMakeDeps 生成的 libmcfp-config.cmake 命中不了，必须用 mcfp_DIR 显式指向"
  - "mrc 构建期用自建 mrc-bootstrap 工具生成 .obj（add_custom_command）——OHOS 可直接执行 aarch64 本机二进制，无需 host 工具链分离"
  - "OHOS sysroot 的 endian.h 提供 LITTLE_ENDIAN 宏，mrc.cpp 的端序分支（#if defined(LITTLE_ENDIAN)）在 aarch64 上正确命中"
