# test_package/MANIFEST.yml — mpfit 1.85-2017.01.03
# Upstream: MINPACK C (cmpfit) testmpfit binary with 5 driver fits.
# Count method: auto (single custom Makefile harness, status-line parsing).
# discovered=5 drivers in testmpfit.c main(); executed/passed from
# '*** test<name> status = N' lines (1<=N<=8 is MP success).

package: mpfit/1.85-2017.01.03
homepage: https://pages.physics.wisc.edu/~craigm/idl/cmpfit.html

upstream_check_command: "make -j1 && ./testmpfit"
upstream_test_in_build: true
upstream_test_command: "make -j1 && ./testmpfit"
upstream_tests_exist: true

upstream_test_total: 5
upstream_test_count_method: auto
upstream_test_audit: "testmpfit.c main() calls testlinfit/testquadfit/testquadfix/testgaussfit/testgaussfix (5 drivers); each prints '*** <name> status = N'; distributed testmpfit.log shows 5 sections with status=1 and CHI-SQUARE lines"

upstream_tests:
  - file: testmpfit.c
    source: cmpfit/testmpfit.c
    description: "upstream fit validation: linear/quadratic/gauss fits (5 drivers)"
    command: "./testmpfit"

test_package_tests:
  - file: test.c
    description: "consumer linear fit (status 1..8 + params near 3.2/-1.78)"
    command: "./test_mpfit"
  - file: test.c
    description: "consumer quadratic fit with fixed param (params near 4.7/6.2)"
    command: "./test_mpfit"

assertion_count: 8
