software: mpgtx
display: "mpgtx an MPeG ToolboX"
description: "Command line MPEG audio/video/system file toolbox that splits, joins, demultiplexes, inspects and tags MPEG streams"
category: multimedia
homepage: "https://mpgtx.sourceforge.net/"
license: GPL-2.0-only
build_system: custom

ohos_adaptation:
  key_points:
    - "Upstream 1.3.1 (released 2005-01-02) ships a hand-written configure script and a dummy makefile; the real Makefile is generated by ./configure, so the recipe calls configure + make directly instead of AutoToolsBuildEnvironment"
    - "Single minimal portability patch: honor CXX env var (OHOS clang++), skip the gcc-only version probe, replace coreutils install(1) with portable mkdir/cp/chmod, drop -s strip, and add DESTDIR staging for Conan package()"
    - "Upstream release tarball contains no test suite (Total=0, evidence in 1.3.1/notes.md); package-level test_package exercises the installed CLI (mpgtx, mpginfo, mpgsplit, mpgjoin, tagmp3) on a programmatic MPEG-1 Layer III fixture"
    - "mpgtx is a command-line tool (R38: commands.json declares mpgtx plus its 6 symlink commands)"
  common_dependencies: []

versions:
  "1.3.1":
    status: built
    build_date: "2026-08-31"
    conan_ref: "mpgtx/1.3.1"
    note: "Final upstream release (2005-01-02); project inactive since then, no newer version exists"
