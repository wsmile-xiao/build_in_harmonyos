sources:
  "1.3.1":
    url: "https://downloads.sourceforge.net/project/mpgtx/mpgtx/1.3.1/mpgtx-1.3.1.tar.gz"
    sha256: "8815e73e98b862f12ba1ef5eaaf49407cf211c1f668c5ee325bf04af27f8e377"

patches:
  - patch_file: "patches/0001-ohos-configure-cc-gcc-probe-strip.patch"
    patch_description: |
      Honor CXX env var (fall back to g++), skip the GCC-version probe when
      gcc is absent (OHOS has only clang), drop `-s` install strip to
      preserve the lld self-signature, and add DESTDIR support so Conan's
      package() can stage into the package folder.
      Reason: the upstream configure hardcodes CC="g++" and runs
      `gcc --version`; the OHOS toolchain has no gcc/g++, so the emitted
      Makefile cannot build under clang15/musl.
    patch_type: "portability"
