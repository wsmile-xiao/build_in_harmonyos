software: mpgtx
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-31"

# 构建系统类型
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（SourceForge 官方发布渠道，mpgtx 无 git 仓库，仅有历史 CVS）
  url: "https://downloads.sourceforge.net/project/mpgtx/mpgtx/1.3.1/mpgtx-1.3.1.tar.gz"

  # 源码校验和（与 Homebrew homebrew-core Formula/m/mpgtx.rb 记录一致）
  sha256: "8815e73e98b862f12ba1ef5eaaf49407cf211c1f668c5ee325bf04af27f8e377"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  # 上游是手写 configure（非 autotools），configure 生成真实 Makefile
  system: custom

  # 配置选项列表（编译器由 Conan conf 注入，R33: 禁止硬编码）
  configure_options:
    - "--prefix=/usr"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-ohos-configure-cc-gcc-probe-strip.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "mpgtx 1.3.1（2005-01-02 最终版）用手写 configure 而非 autotools；tarball 内 makefile 是 dummy，configure 才生成真实 Makefile"
  - "上游 configure 硬编码 CC=\"g++\" 且无条件跑 `gcc --version`（为 GCC 3.0/3.1 降 -O3 为 -O2）；OHOS 工具链只有 clang，探测失败导致无法构建"
  - "上游 install 目标用 coreutils `install -d/-s/-m`；OHOS 最小用户态没有 install(1)，需换成 mkdir/cp/chmod 并去掉 -s strip"
  - "上游 release tarball 完全没有测试套件（无 test/ 目录、TESTS/check_PROGRAMS，make check/test 无规则）→ 上游正式测试 Total=0"
  - "mpgtx 的 6 个子命令（mpgjoin/mpgcat/mpgsplit/mpginfo/mpgdemux/tagmp3）都是指向 mpgtx 的符号链接，行为按 argv[0] 分派"
