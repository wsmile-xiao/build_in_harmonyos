sources:
  url:
    - "https://github.com/MLton/mlton/releases/download/on-20241230-release/mlton-20241230.src.tgz"
    - "https://ghfast.top/https://github.com/MLton/mlton/releases/download/on-20241230-release/mlton-20241230.src.tgz"
  sha256: "cd170218f67b76c3fcb4d487ba8841518babcebb41e4702074668e61156ca6f6"
patches:
  - patch_file: "patches/0001-ohos-platform-tmpdir-and-runtime.patch"
    patch_description: "识别 HarmonyOS，复用经审计的 Linux-musl runtime 路径，并将测试临时文件移至 TMPDIR"
  - patch_file: "patches/0002-ohos-real-oracle-arm64.patch"
    patch_description: "为 arm64-ohos 增加 real 测试平台 oracle 变体（OHOS musl atan2f 返回正确舍入值，与上游 x86-linux/darwin 变体一致）"
  - patch_file: "patches/0003-ohos-gzip-toybox-short-options.patch"
    patch_description: "install-no-strip 的 gzip 长选项 --force --best 改为 toybox 兼容短选项 -f -9（OHOS toybox gzip 仅支持 [-19cdfkt]）"
