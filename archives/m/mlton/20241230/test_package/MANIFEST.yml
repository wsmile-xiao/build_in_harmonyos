package: mlton/20241230
homepage: "https://www.mlton.org/"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - type: regression
    count: 331
    framework: "bin/regression"
    description: "上游 regression 与 benchmark/tests 候选源码路径；实际执行结果以 CI 日志为准"
test_package_tests:
  - file: "run_consumer_tests.sh"
    description: "调用打包后的 mlton 编译并运行 hello.sml，验证真实 consumer 闭环"
    command: "/usr/bin/sh run_consumer_tests.sh <mlton> hello.sml mlton-consumer"
  - file: "hello.sml"
    description: "使用打包后的 mlton 以 C codegen 编译并运行真实 Standard ML consumer"
    command: "mlton -codegen c -output mlton-consumer hello.sml && ./mlton-consumer"
  - file: "invalid.sml"
    description: "验证非法 Standard ML 源码被编译器以非零状态拒绝"
    command: "mlton -codegen c invalid.sml（期望失败）"
assertion_count: 4
