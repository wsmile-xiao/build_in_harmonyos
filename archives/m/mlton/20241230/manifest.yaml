version: "20241230"
status: built
build_date: "2026-08-11"
conan_ref: "mlton/20241230"

source:
  url:
    - "https://github.com/MLton/mlton/releases/download/on-20241230-release/mlton-20241230.src.tgz"
    - "https://ghfast.top/https://github.com/MLton/mlton/releases/download/on-20241230-release/mlton-20241230.src.tgz"
  sha256: "cd170218f67b76c3fcb4d487ba8841518babcebb41e4702074668e61156ca6f6"
  tar_format: tar.gz

build:
  system: make
  configure_options:
    - "CC=/data/service/hnp/bin/clang AR=/data/service/hnp/bin/ar RANLIB=/data/service/hnp/bin/ranlib STRIP=/data/service/hnp/bin/strip"
    - "WITH_GMP_INC_DIR/WITH_GMP_LIB_DIR 指向 gmp/6.3.0 包目录"
    - "POLYC=polyml/5.9.2.1 polyc 引导 wrapper（-b poly）"
    - "MLTON_COMPILE_ARGS/OLD_MLTON_COMPILE_ARGS=-codegen c"
    - "WITH_NPI_RUNTIME=false WITH_PIE_RUNTIME=true RSYNC=cp -fpR"
  dependencies:
    - gmp/6.3.0
    - polyml/5.9.2.1
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-ohos-platform-tmpdir-and-runtime.patch"
  - "patches/0002-ohos-real-oracle-arm64.patch"
  - "patches/0003-ohos-gzip-toybox-short-options.patch"

knowledge_gained:
  - "OHOS /tmp 只读：回归与 runtime 临时文件需统一迁移到 TMPDIR"
  - "HMDFS 的 Posix.FileSys.link 返回 EPERM：hardlink 测试需在 /dev/shm 执行"
  - "OHOS musl atan2f 正确舍入：需新增 real.arm64-ohos.ok 平台 oracle 变体而非改 golden"
  - "OHOS toybox gzip 仅支持短选项：安装脚本 gzip 长选项改 -f -9"
  - "HarmonyOS ELF 需自签名，且签名后需恢复原 mode 保留执行位"
  - "官方构建需 bootstrap-polyml 引导：依赖已发布的 polyml/5.9.2.1"
