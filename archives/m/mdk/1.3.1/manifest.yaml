version: "1.3.1"
software: "mdk"
status: built
build_date: "2026-09-30"
build_system: "autotools"

source:
  url: "https://ftp.gnu.org/gnu/mdk/v1.3.1/mdk-1.3.1.tar.gz"
  sha256: "ebb963938c688c150ff6aaedc29f30d09020a1e31d55b30c2101f08773516d19"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-gui"
    - "--without-guile"
    - "--without-readline"
    - "--disable-nls"
  dependencies:
    - "glib/2.84.0.1"
    - "intltool/0.51.0 (tool)"
    - "pkgconf/3.0.5 (tool)"
  cc: clang

patches_applied: []

knowledge_gained:
  - "Release tarball ships generated configure + Makefile.in, no autoreconf needed."
  - "mixlib/libmix.a is noinst (never installed): application package, test via binaries."
  - "Upstream make check runs 6 automake TESTS in mixlib/testsuite (local .mixal fixtures)."
  - "GUI/Guile/readline are optional upstream features, disabled on OHOS with configure flags."
  - "NLS disabled (--disable-nls, E027); intltool probe still unconditional, satisfied via intltool/0.51.0 tool_requires."
