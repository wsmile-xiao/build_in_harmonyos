package: mdk/1.3.1
homepage: "https://www.gnu.org/software/mdk/"

# Upstream tests run inside conanfile.py build() via `make check`
# (automake parallel-tests harness, test-suite.log under mixlib/testsuite).
upstream_test_in_build: true
upstream_test_command: "make check"

# Official registered TESTS with the recipe configure flags
# (--disable-gui --without-guile --without-readline).
# Method: count of TESTS/check_PROGRAMS entries in
# mixlib/testsuite/Makefile.am (upstream 1.3.1).
upstream_test_total: 6
upstream_test_count_method: "autotools_tests"
upstream_tests_exist: true
upstream_tests:
  - file: mixlib/testsuite/mix_types_t.c
    source: mdk-1.3.1/mixlib/testsuite/mix_types_t.c
    description: "MIX word/field-spec type tests (mixtypest)"
    command: "./mixtypest"
  - file: mixlib/testsuite/mix_ins_t.c
    source: mdk-1.3.1/mixlib/testsuite/mix_ins_t.c
    description: "MIX instruction encode/decode tests (mixinstest)"
    command: "./mixinstest"
  - file: mixlib/testsuite/mix_vm_ins_t.c
    source: mdk-1.3.1/mixlib/testsuite/mix_vm_ins_t.c
    description: "MIX virtual-machine instruction tests (mixvminstest)"
    command: "./mixvminstest"
  - file: mixlib/testsuite/mix_parser_t.c
    source: mdk-1.3.1/mixlib/testsuite/mix_parser_t.c
    description: "MIXAL parser tests (mixparsertest)"
    command: "./mixparsertest"
  - file: mixlib/testsuite/mix_device_t.c
    source: mdk-1.3.1/mixlib/testsuite/mix_device_t.c
    description: "MIX device emulation tests (mixdevtest)"
    command: "./mixdevtest"
  - file: mixlib/testsuite/mix_eval_t.c
    source: mdk-1.3.1/mixlib/testsuite/mix_eval_t.c
    description: "MIXAL expression evaluator tests (mixevaltest)"
    command: "./mixevaltest"

test_package_tests:
  - file: test.sh
    description: "mixasm --help prints usage and exits 0"
    command: "bash test.sh"
  - file: test.sh
    description: "mixvm --help prints usage and exits 0"
    command: "bash test.sh"
  - file: hello.mixal
    description: "mixasm assembles the hello.mixal fixture into a non-empty .mix file"
    command: "bash test.sh"

test_package_test_count: 3
assertion_count: 6
