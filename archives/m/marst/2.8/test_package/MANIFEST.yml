# test_package/MANIFEST.yml — marst 2.8
# CI L0e requires this file to exist.

package: marst/2.8
homepage: "https://www.gnu.org/software/marst/"

# Upstream registers one real functional check target (Makefile.am):
# translates examples/gps.alg with marst, compiles the generated C against
# libalgol, runs it and verifies the matrix product C = A*B is unity.
# The 130 tests/*.alg programs are a manual corpus without a harness.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: check-gps
    command: "make check"
    expected: "pass — translated gps program must print matrix C = A*B equal to unity"

test_package_tests:
  - file: test.sh
    description: "marst --version/--help assertions, translates a hello-world Algol program to C, compiles the generated C against libalgol.a and runs it, asserting 'Hello, world!' output (mirrors the upstream check methodology)"
    command: "bash test.sh"

# version, help, translation, compile+run assertion
assertion_count: 4
