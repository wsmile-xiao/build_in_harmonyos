software: multisort
display: "multisort"
description: "合并多个 Common Log Format（httpd 访问日志）文件，按请求时间排序后输出到 stdout（Zachary Beane，1999）"
homepage: "https://www.xach.com/multisort/"
license: "GPL-2.0-or-later"
category: utility
language: c
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C（stdio/stdlib/string/errno），上游 Makefile 写死 CC = gcc：make 命令行以 AutotoolsToolchain 给出的编译器与标志覆盖（R33）"
    - "musl BUFSIZ=1024（glibc 8192）：上游 fgets(buf, BUFSIZ) 在 OHOS 上把 1024 字节以上的日志行切段并破坏输出，补丁改为固定 8192 字节行缓冲"
    - "gperf 2.7 生成的非 static __inline in_word_set() 在 C99 inline 语义下无外部定义，-O0 链接报 undefined symbol，补丁加 static"
    - "上游排序哨兵 900000000 自 2018 年 12 月起小于所有时间戳，合并失序并读已关闭的 FILE，补丁改为 LONG_MAX（上游缺陷，非平台相关）"
    - "单二进制命令行工具安装到 bin/，commands.json 声明（R38）"

versions:
  "1.1":
    status: built
    build_date: "2026-09-23"
    conan_ref: "multisort/1.1"
