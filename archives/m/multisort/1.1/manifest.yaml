# 版本级 manifest - multisort 1.1

version: "1.1"
software: multisort

# published | built | failed | archived
# 本地 conan-verify + W3 通过后置 built；CI 合并发布后置 published（由 CI 流水线处理）
status: built

build_date: "2026-09-23"
build_system: makefile

source:
  # 作者官方下载页 https://www.xach.com/multisort/（tarball 内文件日期 1999-10-28）
  url: "https://www.xach.com/multisort/multisort-1.1.tar.gz"
  sha256: "50cc0e84738f1c9b4b587e4d13564c233be20c693fd2154f2e8a293f3d5bc17d"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  notes: "三行裸 Makefile（CC = gcc，单条规则一步编译链接），in-source 构建；CC/CPPFLAGS/CFLAGS/LDFLAGS 取自 AutotoolsToolchain 并放在 make 命令行覆盖（R33）"

patches_applied:
  - "0001-multisort.c.patch"

knowledge_gained:
  - "OHOS musl 的 BUFSIZ 为 1024（glibc 8192）：以 fgets(buf, BUFSIZ) 读取整行的程序会把 1024 字节以上的行切段，编译无任何告警，只在运行时表现为输出截断/串行（新增草稿；ref: knowledge/drafts/E6401-draft-9A43.kv）"
  - "gperf 2.7 时代生成的 __inline in_word_set() 无 static：clang 默认 gnu17 采用 C99 inline 语义，Release（-O3）因内联而链接通过，-O0/Debug 报 undefined symbol（已有草稿覆盖；ref: knowledge/drafts/E321-draft-9758.kv）"
  - "conandata.yml 注释里不要写 http(s) URL：W3/CI 预下载会把它当源码包下载并用字符串替换改写，连带破坏真实 URL（已有草稿覆盖；ref: knowledge/drafts/DRAFT-8543-conandata-comment-url-predl-rewrite.kv）"

# refresh-patch（finish 第 1 步）会把本行起到文件末尾重置为 auto/pending，须放在最后
patch_classification:
  - file: 0001-multisort.c.patch
    type: portability
    platform_only: false
    guard: none
    hunks:
      - "LINEBUF_SIZE 8192 取代 BUFSIZ（musl 1024 / glibc 8192）：平台相关，无平台宏，对所有 libc 行为一致"
      - "in_word_set() 加 static：C99 inline 语义下 -O0 链接失败，编译器语义相关"
      - "min_time 哨兵 900000000L -> LONG_MAX：上游缺陷修复，非平台相关"
