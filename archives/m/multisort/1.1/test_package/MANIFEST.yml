# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: multisort/1.1
homepage: "https://www.xach.com/multisort/"

# 上游测试命令（清点证据：tarball 共 4 个文件 multisort.c / months.gperf / Makefile / README；
# Makefile 只有 multisort 一个目标，`make -n check` 与 `make -n test` 均报 "No rule to make target"；
# 无 tests/ 目录、无测试脚本、无 ctest/pytest 注册，上游测试用例数为 0，故无上游测试命令）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无：上游不含任何测试）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，适配后补全）
test_package_tests:
  - file: test_multisort.py
    description: "A1-A3 产物检查（ELF64 AArch64 / PIE / PT_INTERP=/lib/ld-musl-aarch64.so.1，所有主机）+ F1-F7 功能检查（单参数 usage、1999 与 2026 年两文件合并、三文件 12 个月份与跨年合并、3015 字节长行（1999 年日期，单独覆盖行缓冲修复）、缺失文件、空文件：退出码 + stdout 逐字节比对 + stderr 关键文本，每次运行 30 s 超时；aarch64 CI worker 上必跑，异架构主机仅在加载器/格式标记下记 SKIPPED）"
    command: "python3 test_multisort.py <package_folder>/bin/multisort <build_folder>"

# 测试断言总数（按独立检查项计数：A1-A3 共 3 项 + F1-F7 共 7 项）
assertion_count: 10
