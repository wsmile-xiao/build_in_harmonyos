# test_package/MANIFEST.yml
# Upstream test declaration for middleclass 4.1.1

package: middleclass/4.1.1
homepage: "https://github.com/kikito/middleclass"

# middleclass ships with busted/busted spec tests in spec/ directory
# These are Lua spec tests, not make-check style
upstream_check_command: "busted spec/"

# No upstream test integrated in build (pure Lua, no build step)
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test files (busted specs)
upstream_tests:
  - file: spec/class_spec.lua
    source: middleclass-4.1.1/spec/class_spec.lua
    description: "Class creation and behavior specs"
    command: "busted spec/class_spec.lua"
  - file: spec/classes_spec.lua
    source: middleclass-4.1.1/spec/classes_spec.lua
    description: "Class hierarchy and subclass specs"
    command: "busted spec/classes_spec.lua"
  - file: spec/instances_spec.lua
    source: middleclass-4.1.1/spec/instances_spec.lua
    description: "Instance creation and method specs"
    command: "busted spec/instances_spec.lua"
  - file: spec/mixins_spec.lua
    source: middleclass-4.1.1/spec/mixins_spec.lua
    description: "Mixin inclusion specs"
    command: "busted spec/mixins_spec.lua"

# Consumer-side test (test_package)
test_package_tests:
  - file: test.lua
    description: "Verifies middleclass module loads and OOP API works (class, inheritance, mixins)"
    command: "lua test.lua"

# Assertion count (approximate)
assertion_count: 12
