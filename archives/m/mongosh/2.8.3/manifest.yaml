# 编译中学到的知识
knowledge_gained:
  - "mongosh is a Node.js monorepo using lerna with independent package versioning"
  - "boxednode (standalone binary approach) compiles Node.js from source - not feasible on OHOS"
  - "Pragmatic approach: use webpack bundle + system Node.js as launcher script"
  - "npm run compile (TypeScript) + npm run webpack-build creates single JS bundle"
  - "Native addons (kerberos, mongodb-client-encryption, etc.) are optional dependencies"

