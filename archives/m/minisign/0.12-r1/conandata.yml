  sha256: "796dce1376f9bcb1a19ece729c075c47054364355fe0c0c1ebe5104d508c7db0"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Make PkgConfig optional so configure works without pkg-config on OHOS"
    patch_type: "portability"
    # 补丁 ---/+++ 头无 a//b/ 前缀（仅 diff --git 行为 git 风格），
    # strip:1 会把唯一路径段剥空（实测报 source/target file does not exist: b''），
    # 故取 strip: 0（与已合入并过 CI 的 minisign/0.12 同款补丁一致）。
    strip: 0
