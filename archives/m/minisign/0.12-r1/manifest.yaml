software: minisign
version: "0.12-r1"
build_system: cmake
status: built
build_date: "2026-09-17"

source:
  url: "https://github.com/jedisct1/minisign/archive/refs/tags/0.12.tar.gz"
  sha256: "796dce1376f9bcb1a19ece729c075c47054364355fe0c0c1ebe5104d508c7db0"
  tar_format: tar.gz

build:
  system: cmake
  # SODIUM_INCLUDE_DIR / SODIUM_LIBRARY 由 conanfile.py generate() 经
  # CMakeToolchain 从 libsodium/1.0.22 conan 包注入（上游 find_path/find_library 缓存变量）
  configure_options: []
  dependencies:
    - "libsodium/1.0.22 (ohpcd 制品仓 conan 依赖，静态库)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"

knowledge_gained:
  - "minisign 0.12-r1 上游无任何测试套件，需在 test_package/MANIFEST.yml 显式审计"
  - "上游 CMakeLists.txt 用 pkg-config 定位 libsodium，OHOS 交叉环境需放宽 PkgConfig 为可选"
  - "libsodium/1.0.22 已发布到 ohpcd 制品仓（含 OHOS aarch64 静态二进制），按 R36 声明 conan 依赖，注入 SODIUM_INCLUDE_DIR/SODIUM_LIBRARY 缓存变量"
  - "minisign 为命令行工具（application 包），package_info 只需 bindirs"
  - "E077：OHOS 内核要求可执行 ELF 含有效 .codesign 签名段，install 后需重签"
  - "E428：test_package 用 dependencies.package_folder 绝对路径调用被测 CLI，不依赖 conanrun PATH 注入"

upstream_tests_exist: false
upstream_test_audit: |
  minisign 0.12-r1 上游源码无任何自动化测试。由 test_package 对 minisign 二进制
  执行真实功能测试（版本输出/密钥生成/签名/验证/篡改检测，5 项断言）。
