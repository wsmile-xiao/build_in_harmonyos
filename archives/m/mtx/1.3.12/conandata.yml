# conandata.yml — mtx 1.3.12
# Primary source: official SourceForge release of MTX 1.3.12.
# Mirror (documented, not wired into `get()`): the Debian source pool ships the
# same pristine upstream tarball — sha256 below equals mtx_1.3.12.orig.tar.gz
# recorded in mtx_1.3.12-18.dsc, so CI can fall back to
# https://deb.debian.org/debian/pool/main/m/mtx/mtx_1.3.12.orig.tar.gz when
# SourceForge redirects are blocked.

sources:
  url: "https://downloads.sourceforge.net/project/mtx/mtx-stable/1.3.12/mtx-1.3.12.tar.gz"
  sha256: "0261c5e90b98b6138cd23dadecbc7bc6e2830235145ed2740290e1f35672d843"

patches:
  - patch_file: "patches/0001-config.guess-harmonyos-and-hmdfs-umask.patch"
    patch_description: "Add HarmonyOS platform detection and use umask 022 for the mktemp dir (HMDFS)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-aarch64-linux-ohos.patch"
    patch_description: "Accept aarch64 and the linux-ohos triplet in config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-Makefile.in-destdir-and-srcdir-man.patch"
    patch_description: "Make the install target honour DESTDIR and read man pages from srcdir"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-hmdfs-umask.patch"
    patch_description: "Use umask 022 for the config.status mktemp dir (HMDFS)"
    patch_type: "portability"
