knowledge_gained:
  - "MTX 的 autoconf 2.13 时代 configure 用 AC_CANONICAL_SYSTEM；OHOS conan 的 _get_gnu_triplet('OHOS','armv8') 产出两段式 aarch64-linux-ohos，而 2004 年版 config.sub 只认三段式且白名单里没有 aarch64，会硬报 'machine aarch64-linux not recognized' 并 exit 1"
  - "只给旧 config.sub 补 linux-ohos 三元组不够，必须同时把 aarch64|aarch64_be 加入 basic_machine 白名单，否则报 'machine aarch64 not recognized'"
  - "真机 uname -s 是 HarmonyOS，2004 年版 config.guess 无该分支会走末尾 fallback 编译 dummy.c；而 config.guess 建临时目录用 umask 077，在 HMDFS 上建出的目录不可写，于是 configure 在 'checking build system type' 阶段失败（E011/E167 同类）"
  - "autoconf 2.13 的 config.status 段同样用 umask 077 && mktemp -d ./confXXXXXX，HMDFS 上需一并改为 umask 022"
  - "真机 /tmp 只读，源码包构建脚本必须显式设置 TMPDIR"
  - "真机裸 clang-15 编出的二进制 Permission denied（未签名），必须用带 -Wl,--code-sign 的 wrapper clang；conan profile 的 compiler_executables 已指向该 wrapper"
  - "真机自带 patch 是精简实现（无 --forward/-N）；手工验证补丁要用 /data/service/hnp/bin/git apply"
  - "本仓库 conandata.yml 用扁平 sources 结构，配方必须写 get(self, **self.conan_data['sources'])；写成按版本取会 KeyError，且 sources 下不能塞自定义键（get() 会 TypeError）"
  - "真机网络到 SourceForge CDN 不可达；在隔离 CONAN_HOME 里按 <download_cache>/<sha256(url)> 预置已校验 tarball 即可离线完成 conan create，不需要改源或跳过校验"
  - "OHOS musl sysroot 自带 scsi/scsi.h、scsi/scsi_ioctl.h、scsi/sg.h、sys/mtio.h，scsi_linux.c 的 SG_IO 后端无需 stub"
  - "configure.in 的平台分支是 *linux*，匹配 linux-ohos，因此 TARGET=linux、AC_DEFINE(LINUX) 与上游 Linux 构建完全一致，无需改 configure.in/configure 的平台分支"
  - "上游 make install 不支持 DESTDIR 且 man 页写裸文件名；Conan basic_layout 是源外构建，两处都必须在 Makefile.in 里修"

next_steps:
  - "官方 shadow CI 单包验证：CI_PACKAGES=archives/m/mtx/1.3.12 zsh ci/conan/build_and_test.sh"
  - "该真机未部署 shadow runner（run-ohos-shadow-ci.sh 不存在），如需在真机跑官方脚本需先部署"
