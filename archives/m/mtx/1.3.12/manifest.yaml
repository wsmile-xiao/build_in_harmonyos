    exit_code: 0
    recipe_revision: "mtx/1.3.12#262839acb4ade40e58af7250e72ff007"
    package_id: "6b129b068851896169fae42d399fa922d239ce8a"
    package_settings: "os=OHOS, os.version=6.0, arch=armv8, compiler=clang 15, compiler.libcxx=libc++, compiler.cppstd=17, build_type=Release"
    package_folder: "<CONAN_HOME>/p/b/mtxf593fcbb0446c/p"
