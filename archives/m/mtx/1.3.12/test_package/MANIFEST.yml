package: mtx/1.3.12
homepage: "https://sourceforge.net/projects/mtx/"
upstream_check_command: "no upstream test suite (release tarball has no make check target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
test_package_tests:
  - file: test.sh
    description: "Runs the five packaged CLI tools: mtx --version banner, state-only `noattach` success, an `-f <regular file>` device probe that must reach the SCSI generic backend, and usage text/exit code of tapeinfo, loaderinfo, scsitape and scsieject"
    command: "bash test_package/test.sh <package_folder>"
  - file: conanfile.py
    description: "Asserts the five packaged binaries exist in bin/ and invokes test.sh from the Conan test context"
    command: "conan test test_package mtx/1.3.12"
assertion_count: 13
