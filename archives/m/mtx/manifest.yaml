software: mtx
display: "MTX"
description: "SCSI media changer and tape drive control tools (mtx, scsitape, scsieject, tapeinfo, loaderinfo)"
category: storage
homepage: "https://sourceforge.net/projects/mtx/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Legacy config.guess needs a HarmonyOS branch (device uname -s is HarmonyOS) and umask 022 for its mktemp dir"
    - "Legacy config.sub rejects the aarch64-linux-ohos host triplet with a hard exit 1; both linux-ohos and the aarch64 machine name must be whitelisted"
    - "configure's config.status mktemp dir also needs umask 022 on HMDFS"
    - "configure.in already matches *linux*, so linux-ohos yields TARGET=linux and AC_DEFINE(LINUX) with no source change"
    - "OHOS musl sysroot ships scsi/sg.h, scsi/scsi.h, scsi/scsi_ioctl.h and sys/mtio.h, so the SG_IO backend needs no stub"
    - "Upstream 'make install' ignores DESTDIR and reads man pages by bare name; both must be patched for out-of-source Conan builds"
    - "CLI-only package: commands.json required (R38); test_package runs the packaged binaries because there is no library API"
  common_dependencies: []

versions:
  "1.3.12":
    status: built
    build_date: "2026-09-29"
    device_verified: "HarmonyOS PC aarch64 (HongMeng Kernel 1.12.0): patches + configure + make + install DESTDIR + test.sh all pass"

