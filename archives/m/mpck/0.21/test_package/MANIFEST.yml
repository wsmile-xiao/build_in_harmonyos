# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: mpck/0.21
homepage: "https://checkmate.gissen.nl/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - suite: mpck/test/crctest.sh
    source: upstream git tag v0.21 (commit c876755)
    NOT_in_release_tarball: true   # checkmate-0.21.tar.gz 不含 test/ 目录；脚本仅存在于 git 仓库
    internal_parameter_combinations: 216   # 12 BITRATE × 9 SAMPLERATE × 2 CHANNELS
    behavior: "fixture generator — dd /dev/urandom + toolame(→.mp2) + lame(→.mp3) over 216 bitrate×samplerate×channels combos; does NOT invoke mpck and has NO pass/fail/expected assertion logic (verified by reading the 577-byte script)"
    external_commands_required:
      - dd
      - toolame   # MP2 encoder
      - lame      # MP3 encoder
      - sed
      - mkdir
    executed_on_ohos: 0
    platform_dependency_blocked: 1
    block_reason: "crctest.sh requires the toolame and lame CLI encoders; toolame is absent from archives/t/, the ohpcd Conan registry (0 matches), and the OHOS PATH (command -v toolame → not found); lame exists in archives/l/lame and the ohpcd registry but is not on the OHOS PATH (command -v lame → not found). Neither OHOS AArch64 executable can be obtained via the current dependency graph, so the upstream suite could not be run."

test_package_tests:
  - file: test.sh
    description: "mpck functional test: decode a minimal legal MP3 (10 frames) from a base64 fixture, verify sha256, assert mpck reports Ok with exit 0; assert a corrupt file is flagged; assert no-args returns non-zero"
    command: "bash test.sh"

assertion_count: 6
