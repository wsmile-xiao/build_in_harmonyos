knowledge_gained:
  - "上游 checkmate-0.21 git 含 1 个测试脚本 mpck/test/crctest.sh（不在 release tarball，未注册进 automake TESTS，故 make check 仍为 no-op）。crctest.sh 是 fixture 生成器：dd /dev/urandom + toolame + lame 遍历 12 BITRATE × 9 SAMPLERATE × 2 CHANNELS = 216 组合生成 .mp2/.mp3，但脚本中 mpck 出现 0 次、无 pass/fail/expected 断言"
  - "mpck 退出码语义：所有文件 GOOD 时返回 last_error（无错误则 0），存在损坏文件时返回 1，参数错误返回 EINVAL"
  - "configure 通过 AC_PROG_CC 探测交叉编译器；OHOS 下须显式传 --build/--host=aarch64-unknown-linux-gnu 否则探测失败"

upstream_test_status:
  has_tests: true
  suite_count: 1
  suite: "mpck/test/crctest.sh (git tag v0.21, commit c876755; NOT in release tarball)"
  internal_parameter_combinations: 216
