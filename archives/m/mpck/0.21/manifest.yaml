  platform_dependency_blocked: 1
  block_reason: "crctest.sh requires toolame + lame CLI encoders; toolame absent from archives/t/, ohpcd Conan registry (0 matches), and OHOS PATH; lame in archives/l/lame + ohpcd registry but not on OHOS PATH. No OHOS AArch64 executable obtainable via current dependency graph."
  proof:
    - "release tarball 100 个文件，不含 test/ 目录、不含任何 .sh；crctest.sh 仅在 git 仓库 tag v0.21"
    - "Makefile.am 仅声明 bin_PROGRAMS = mpck，未把 mpck/test/ 注册进 TESTS/check_PROGRAMS/EXTRA_DIST"
    - "已直接读取 crctest.sh 的 GitHub blob（base64，577 字节，sha 556e9ab5）逐行核实：三层循环 12×9×2=216 组合，调 dd+toolame+lame，mpck 出现 0 次，无断言"
    - "CLI 选项表仅 version/verbose/help/quiet/silent/recursive/extension/maxname/badonly/namecheck/xmloutput，无 --test/--selftest"
