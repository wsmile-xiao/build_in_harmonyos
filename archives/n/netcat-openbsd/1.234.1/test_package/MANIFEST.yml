# test_package/MANIFEST.yml
# Upstream test declaration for netcat-openbsd 1.234.1

package: netcat-openbsd/1.234.1
homepage: "https://salsa.debian.org/debian/netcat-openbsd"

# Upstream does not ship a test suite (no make check target)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs — netcat-openbsd is a CLI tool without a test suite
upstream_tests: []

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "Run nc -h to verify the binary is functional"
    command: "nc -h"

# Approximate assertion count
assertion_count: 1
