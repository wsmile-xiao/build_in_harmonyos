software: ndppd
version: "0.2.6"
status: cross-compiled-on-host
build_system: makefile

source:
  url: "https://github.com/DanielAdolfsson/ndppd/archive/refs/tags/0.2.6.tar.gz"
  sha256: "969d438462e0c65a8c9060d8d263c5c47ba8145fb9aaa663864bbad11ad7eb7a"
  tar_format: tar.gz

build:
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
- 0001-logger.cc-strerror_r-musl.patch

knowledge_gained:
- "strerror_r returns int on musl/OHOS even with _GNU_SOURCE defined (OHOS sysroot defaults _GNU_SOURCE on); branch on __GLIBC__ instead of feature macros"
- "Upstream 0.2.6 tag still reports NDPPD_VERSION \"0.2.4\" in src/ndppd.h — upstream oversight; test assertions must match 0.2.4"
- "Makefile `all` target hard-codes GZIP=/bin/gzip for man pages; build only the `ndppd` target on OHOS"
- "Optional WITH_ND_NETLINK path requires glib/libnl and uses pthread_cancel (musl-incompatible); default path avoids it entirely via #ifdef guards in ndppd.cc/rule.cc/proxy.cc"
- "No upstream test suite — daemon project, Makefile has no check/test target (same situation as npd6 1.1.0)"
