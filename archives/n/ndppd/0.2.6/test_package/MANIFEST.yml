# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ndppd/0.2.6
homepage: "https://github.com/DanielAdolfsson/ndppd"

# 上游测试命令 (ndppd uses plain Makefile, no test target)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ndppd has no upstream test suite — it's a network daemon.
# The Makefile has no check/test target.
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: version banner, -c option handling, non-zero exit on missing config"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
