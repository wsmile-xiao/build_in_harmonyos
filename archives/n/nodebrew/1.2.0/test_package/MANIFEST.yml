# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nodebrew/1.2.0
homepage: "https://github.com/hokaccha/nodebrew"

# 上游测试命令: perl 测试套件 (t/*.t, Test::More)
# 全量运行（本机已补齐 CPAN 依赖并前置功能完整 wget）:
#   export PERL5LIB=$HOME/perl5/lib/perl5; export PATH=$HOME/bin:$PATH
#   perl -I . -I t t/<name>.t
upstream_check_command: "perl -I . -I t t/basic.t"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行结果（本机 2026-09-04 全量实跑）:
#   17 PASS + 1 SKIP(live.t, 需 LIVE_TEST=1 与真实外网, 上游设计内跳过) + 0 FAIL
#   PASS 断言合计 179; 运行依赖补齐: CPAN 测试模块(Test::TCP/File::Read/Plack::Loader/
#   Plack::Middleware::Static/IO::Capture::Stdout/Test::MockObject::Extends 等)装入
#   $HOME/perl5 私有前缀; wget 使用 BusyBox v1.37.0 wrapper(系统 toybox wget 缺 -S/-c/--spider,
#   属系统工具差异)。
upstream_tests:
  - file: t/basic.t
    source: nodebrew-1.2.0/t/basic.t
    description: "上游 perl 单元测试（PASS：15 断言）"
    command: "perl -I . -I t t/basic.t"
  - file: t/fetcher.t
    source: nodebrew-1.2.0/t/fetcher.t
    description: "下载器 fetcher 测试 curl/wget 双后端（PASS：14 断言；wget 分支依赖功能完整 wget）"
    command: "perl -I . -I t t/fetcher.t"

# test_package 中自带的测试 (消费者视角验证, 直接执行被测脚本)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_nodebrew.sh 验证 bin/nodebrew 已安装、可执行且 version/help 输出正确"
    command: "conan create (test_package: bash test_nodebrew.sh <bin_dir>)"
  - file: test_nodebrew.sh
    description: "真实冒烟测试: 校验 bin/nodebrew 存在/可执行/shebang=perl/perl -c 语法/version+help 输出含 1.2.0"
    command: "bash test_nodebrew.sh <package bin dir>"

assertion_count: 5

# 完整审计日志: archives/n/nodebrew/1.2.0/reports/upstream-tests-20260904.log
