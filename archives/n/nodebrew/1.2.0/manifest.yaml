software: nodebrew
# 版本级 manifest
# 文件位置: archives/n/nodebrew/1.2.0/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "1.2.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-04"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方上游 tag v1.2.0
  url: "https://github.com/hokaccha/nodebrew/archive/refs/tags/v1.2.0.tar.gz"
  sha256: "6d72e39c8acc5b22f4fc7a1734cd3bb8d00b61119ab7fea6cde376810ff2005e"
  tar_format: tar.gz

# ============================================================
