build:
  # 纯 perl 脚本工具，无 configure/make/编译器
  system: custom

  configure_options: []

  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Pure perl script tool, no C/C++ compilation required"
  - "Main script `nodebrew` sits at tarball root (no bin/ subdir); packaged into bin/nodebrew"
  - "Completions (bash/zsh/fish) packaged as resdirs"
