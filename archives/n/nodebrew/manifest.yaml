software: nodebrew
# 软件级 manifest
# 文件位置: archives/n/nodebrew/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 软件描述（一句话）
description: "Node.js version manager"

# 主页 URL
homepage: "https://github.com/hokaccha/nodebrew"

# 分类（用于依赖排序）
# build-tool | language | library | utility | system
category: language

# ============================================================
# 版本索引（软件级维护）
# ============================================================

# 已编译版本列表
versions:
  - version: "1.2.0"
    status: built
    build_date: "2026-09-04"

# ============================================================
# 依赖信息
# ============================================================

# 运行时依赖
runtime_deps: []
# 例如:
# - perl (nodebrew 为纯 perl 脚本，运行期需要 perl 解释器)

# ============================================================
# 知识沉淀
# ============================================================

# 软件级知识
software_knowledge:
  - "纯 perl 脚本工具，无 C/C++ 编译，conan 以 application 打包为 bin/nodebrew"
  - "主脚本位于上游 tarball 根目录（无 bin/ 子目录），自包含，无需补丁"
  - "运行数据目录由 NODEBREW_ROOT / $HOME/.nodebrew 决定，version/help 为只读操作"
