package: ncmpc/0.53
homepage: "https://www.musicpd.org/clients/ncmpc/"

upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "run_hscroll hello '|' 5 3"

# ncmpc's upstream test/meson.build builds run_hscroll but does not register
# it with meson test(). The recipe executes this standalone program explicitly.
upstream_tests:
  - file: test/run_hscroll.cxx
    source: "ncmpc-0.53/test/run_hscroll.cxx"
    description: "Standalone upstream horizontal-scroll smoke program"
    command: "run_hscroll hello '|' 5 3"

excluded_upstream_tests:
  - command: "meson test"
    reason: "The upstream test directory contains a debug executable but no test() registration."

test_package_tests:
  - file: test_ncmpc.sh
    description: "Consumer smoke test: ncmpc --version runs and reports version 0.53 with wide curses support"
    command: "bash test_ncmpc.sh"

assertion_count: 3
