sources:
  url: "https://codeload.github.com/YosysHQ/nextpnr/tar.gz/refs/tags/nextpnr-0.1"
  filename: "nextpnr-0.1.tar.gz"
  sha256: "21ec82159c6b4c67c32fa16a8280230094a113c189af18762ddf4ae739db0b3c"

patches:
  - patch_file: "patches/0001-boost-1.91-filesystem-compat.patch"
    patch_description: >-
      Boost 1.84 removed boost::filesystem::basename() and Boost 1.91 removed
      boost/filesystem/convenience.hpp, so nextpnr 0.1 does not compile against
      the Boost shipped in ohpcd.  Use boost/filesystem.hpp and
      path::stem(), which is the value the removed basename() returned
      (filename without extension, NOT filename-with-extension).
    patch_type: "portability"
  - patch_file: "patches/0002-bba-modern-boost-targets.patch"
    patch_description: >-
      bba/CMakeLists.txt links the legacy Boost_PROGRAM_OPTIONS_LIBRARY /
      Boost_FILESYSTEM_LIBRARY / Boost_SYSTEM_LIBRARY variables.  Those are only
      set by CMake's FindBoost module; when Boost is located through
      BoostConfig.cmake (as CMakeDeps arranges) they stay empty and bbasm
      silently links without Boost, failing to relocate at build time.  Link the
      imported Boost:: targets instead.
    patch_type: "portability"
