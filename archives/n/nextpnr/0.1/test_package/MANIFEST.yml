# test_package/MANIFEST.yml - upstream test declaration
package: nextpnr/0.1
homepage: "https://github.com/YosysHQ/nextpnr"

# 上游测试审计
# nextpnr 的上游测试套件在 git submodule `tests/` 中
# （https://github.com/YosysHQ/nextpnr-tests）。发布 tarball 里该目录存在但
# **文件数为 0**，因此 BUILD_TESTS=ON 只会把 aux_source_directory(tests/ice40/)
# 接到空集，产出一个 0 用例的测试二进制。配方在 build() 内不得联网下载，
# 故 submodule 无法取回。上游测试计入 **0**，不申报任何上游通过率。
upstream_tests_exist: false
upstream_test_in_build: false
upstream_tests: []
upstream_test_note: >-
  The upstream suite lives in the `tests/` git submodule (YosysHQ/nextpnr-tests).
  The release tarball ships that directory empty (0 files), so BUILD_TESTS=ON can
  only ever produce a test binary with zero cases; fetching the submodule is not
  possible because build() must not download. 0 upstream tests are claimed as
  executed.  The consumer test below exercises the installed binary instead.

test_package_tests:
  - file: test_nextpnr.sh
    description: >-
      9 assertions: 1 the binary starts and reports the exact
      "nextpnr-ice40 -- Next Generation Place and Route (Version 0.1)" banner
      (this alone already requires the Boost runtime path to resolve); 1 --help
      prints "General options"; 1 the executable bit is set; and 2 real
      place-and-route runs (hx1k/tq144 and hx8k/ct256), each asserting a
      non-empty bitstream, a ".device" header, and "Program finished normally" in
      the log.  The P&R runs are what prove the build-time generated iCE40
      chipdb is present and usable, since an empty design still needs the full
      device database to emit a bitstream.
    command: "sh test_nextpnr.sh <package-bin>"
assertion_count: 9
