software: ndenv
# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件描述（一句话）
description: "Node.js version manager based on rbenv (shell scripts)"

# 主页 URL
homepage: "https://github.com/riywo/ndenv"

# 分类（用于依赖排序）
# build-tool | language | library | utility | system
category: language

# ============================================================
# 版本索引（软件级维护）
# ============================================================

# 已编译版本列表
versions:
  - version: "0.4.0"
    status: built
    build_date: "2026-09-12"
    tarball: "ndenv-0.4.0-ohos-aarch64.tar.gz"
    patches: []

# ============================================================
# 依赖信息
# ============================================================

# 运行时依赖
runtime_deps: []
# ndenv 的 install 子命令需 node-build 插件配合，但属运行时可选插件，
# 非构建依赖，故此处不声明。

# ============================================================
# 知识沉淀
# ============================================================

# 软件级知识
software_knowledge:
  - "纯 shell 脚本项目，无 configure/make 流程"
  - "bin/ndenv 为指向 ../libexec/ndenv 的软链接，配方侧重建"
  - "上游无测试套件，test_package 提供 6 断言冒烟测试"
