# test_package/MANIFEST.yml — ndenv/0.4.0

package: ndenv/0.4.0
homepage: "https://github.com/riywo/ndenv"

# 上游测试审计：ndenv 0.4.0（riywo/ndenv）不存在测试套件——
# 经 GitHub contents API 全量核对：仓库根仅含 bin/、completions/、
# libexec/ 三个目录（另有 README.md、.gitignore，无其他文件）；
# 无 test/、t/、spec/ 目录，无 bats 测试、无 Makefile、无 CMakeLists.txt、
# 无 meson.build，无 .github/workflows 测试工作流；
# Homebrew 公式 test 块仅为安装后冒烟（ndenv versions），非上游测试套件。
# 结论：上游无测试，按 no_tests 处理（HMBS_UPSTREAM_TEST_RESULT status=no_tests）。
upstream_tests_exist: false
upstream_test_audit: "审计 ndenv 0.4.0 上游（riywo/ndenv，GitHub contents API 根/bin/completions/libexec 全量清单）：1) 无 test/t/spec 目录；2) 无 bats 用例、Makefile、CMakeLists.txt、meson.build 及任何测试运行器配置；3) 仓库无 CI 测试工作流。Homebrew 公式 test 块仅为安装后冒烟（ndenv versions），非上游测试套件。上游确实无测试套件。HMBS_UPSTREAM_TEST_RESULT(status=no_tests) 标记由主配方 build() 与 test_package test() 复发（包缓存命中时 build() 不执行，靠 test_package 保证标记必现）。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_ndenv.sh
    description: "真实冒烟测试：bin/ndenv 存在可执行、shebang 为 bash、libexec 全脚本 bash -n 通过、--version 输出 0.4.0、`commands` 列出子命令、`versions` 空 root 退出 0"
    command: "bash test_ndenv.sh <package bin dir>"

assertion_count: 6
