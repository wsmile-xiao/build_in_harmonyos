software: ns-3
version: "3.48"
status: built
build_system: cmake
build_date: "2026-09-14"
source:
  url: "https://www.nsnam.org/releases/ns-3.48.tar.bz2"
  sha256: "5700ceecef2c9bc862502914b2237fe798d4c7ae07652247050e300e49407c4d"
  tar_format: tar.bz2
build:
  system: cmake
  cmake_options:
    - "-DNS3_ENABLED_MODULES=core;network;point-to-point"
    - "-DNS3_EXAMPLES=OFF"
    - "-DNS3_TESTS=OFF"
    - "-DNS3_PYTHON_BINDINGS=OFF"
    - "-DNS3_GTK3=OFF"
    - "-DNS3_GSL=OFF"
    - "-DNS3_SQLITE=OFF"
    - "-DNS3_EIGEN=OFF"
    - "-DNS3_VISUALIZER=OFF"
    - "-DNS3_CCACHE=OFF"
    - "-DNS3_WARNINGS_AS_ERRORS=OFF"
    - "-DCMAKE_CXX_STANDARD=20 (recipe 覆盖 profile cppstd=17)"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG=-Wl,-soname, (HarmonyOS 无 SONAME 平台模块)"
  dependencies: []
  cc: clang (15.0.4)
  cxx: clang++ (15.0.4)
patches_applied:
  - "0001-clang-min-version.patch"
  - "0002-cxx-standard.patch"
  - "0003-lock-platform.patch"
  - "0004-ipv6-address-array-spaceship.patch"
knowledge_gained:
  - "ns-3 3.48 已迁移到纯 CMake 构建（waf 废弃），cmake_minimum_required 3.25；./ns3 只是 Python 包装脚本"
  - "Clang_MinVersion=17.0.0 是 FATAL 检查（ns3-compiler-and-linker-support.cmake），HarmonyOS 工具链 clang15 → 补丁降为 15.0.0"
  - "ns-3 3.48 源码需 C++20（remove_cvref_t/bind_front/operator<=>），而顶层门槛设的是 C++23 → 补丁降门槛 + recipe 覆盖 cppstd=17"
  - "write_lock() 平台判定不含 HarmonyOS，会 FATAL → 补丁在判定中加入 OHOS/HarmonyOS"
  - "libc++15 缺 std::array::operator<=>（LLVM16 才加），ipv6-address.h 的 <=> 需补丁改为逐字节比较"
  - "HarmonyOS 无 CMake Platform/HarmonyOS.cmake → CMAKE_SHARED_LIBRARY_SONAME_*_FLAG 为空，共享库无 DT_SONAME、DT_NEEDED 记绝对构建路径；消费者会重复加载 .so 触发 ns-3 日志组件重复注册 NS_FATAL → recipe 显式补 SONAME 标志（E537 同类）"
  - "cpp_info.libs 必须与产物实际库名一致（libns3.48-<module>.so），否则 CMakeDeps 报 Library not found"
  - "可选依赖 GSL/GTK3/SQLite3/Eigen3/libxml2 全部 QUIET 查找、缺省自动禁用（不 FATAL），可放心裁剪"
  - "NS3_PYTHON_BINDINGS 默认 OFF，零 Python 依赖"
  - "NS3_ENABLED_MODULES 指定后由 recursive_dependency 自动补全依赖闭包（core←network←point-to-point，network→stats）"
  - "NS3_WARNINGS_AS_ERRORS 默认 ON，clang15 编译新代码易误炸，置 OFF"
