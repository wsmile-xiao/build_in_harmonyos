# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ns-3/3.48
homepage: "https://www.nsnam.org/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# ns-3 的上游测试入口是 ./test.py（Python 脚本），底层驱动 ns3-test-runner；
# 需 NS3_TESTS=ON 才生成测试二进制。
# 本适配按编译目标最小化原则裁剪 examples/tests（NS3_EXAMPLES=OFF, NS3_TESTS=OFF），
# 因此上游 test.py 未随包构建（详见 notes.md / PR 正文）。
upstream_check_command: "python3 test.py"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本适配裁剪，未编入产物）
upstream_tests:
  - file: test.py
    source: ns-3.48/test.py
    description: "上游测试入口（Python 脚本，需 NS3_TESTS=ON 生成测试二进制后运行）；本适配裁剪未编。离线以相同源码+4 补丁+ohos-aarch64 工具链启用 NS3_TESTS=ON 构建后验证：启用模块共 52 个测试套件，51/51 计入用例通过；1 个 example-as-test（core-fatal-command-line-duplicate-option）依赖 examples 与 ./ns3 包装脚本，不计入用例数"
    command: "python3 test.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ns3.cc
    description: "消费者冒烟：core+network+point-to-point 构建 2 节点点对点链路，节点0 发 100 字节包，断言节点1 收到 1 包且事件循环真实推进，失败非 0 退出"
    command: "./test_ns3"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 test.py 裁剪未编（本适配产物内计数 0，离线验证 51/51 通过，见上）；
# test_package 冒烟 1 项
assertion_count: 1
