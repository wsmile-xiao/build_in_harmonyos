sources:
  url: "https://www.nsnam.org/releases/ns-3.48.tar.bz2"
  filename: "ns-3.48.tar.bz2"
  sha256: "5700ceecef2c9bc862502914b2237fe798d4c7ae07652247050e300e49407c4d"

patches:
  - patch_file: "patches/0001-clang-min-version.patch"
    base_path: "."
    patch_description: "Lower Clang_MinVersion from 17.0.0 to 15.0.0 for HarmonyOS PC toolchain (clang 15)"
  - patch_file: "patches/0002-cxx-standard.patch"
    base_path: "."
    patch_description: "Lower C++ standard gate from C++23 to C++20 (clang 15 lacks -std=c++23; code needs C++20 features: std::remove_cvref_t/std::bind_front)"
  - patch_file: "patches/0003-lock-platform.patch"
    base_path: "."
    patch_description: "Recognize HarmonyOS in write_lock() platform check (CMAKE_SYSTEM_NAME=HarmonyOS is not LINUX/APPLE/WIN32/BSD)"
  - patch_file: "patches/0004-ipv6-address-array-spaceship.patch"
    base_path: "."
    patch_description: "Replace std::array operator<=> with byte-by-byte comparison in Ipv6Address (libc++15 lacks std::array::operator<=>)"
