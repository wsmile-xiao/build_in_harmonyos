software: ns-3
display: "ns-3"
description: "Discrete-event network simulator (ns-3)"
category: scientific
homepage: "https://www.nsnam.org/"
license: GPL-2.0-only
build_system: cmake

versions:
  "3.48":
    packaging: conan
    status: built
    build_date: "2026-09-12"
    notes: >-
      ns-3 3.48 HarmonyOS PC 基础适配。纯 CMake 构建（waf 已废弃，需 CMake>=3.25）；
      按编译目标最小化原则裁剪至 core+network+point-to-point 三个模块
      （NS3_ENABLED_MODULES，依赖闭包自动补全）；可选 3rd-party 依赖
      （GSL/GTK3/SQLite/Eigen/libxml2）全部裁剪，Python 绑定关闭，零外部依赖。
      上游改动共 4 个补丁：Clang_MinVersion 17→15（HarmonyOS 工具链为 clang 15，
      ns-3 的编译器版本检查是 FATAL）、C++ 标准门槛 C++23→C++20（clang15 无 -std=c++23）、
      write_lock 平台判定加入 HarmonyOS、Ipv6Address 的 std::array operator<=> 改逐字节比较
      （libc++15 缺该运算符）。另 recipe 显式补 SONAME 链接标志，避免 HarmonyOS
      无 CMake 平台模块导致 DT_NEEDED 记录绝对路径、运行时重复加载共享库。
      test_package 冒烟：2 节点 point-to-point 链路发 100B 数据包，
      断言接收方实际收到 1 包（事件循环真实推进）。
      conan create（ohos-aarch64 profile）+ test_package 全部通过。