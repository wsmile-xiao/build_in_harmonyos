# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ngspice/42
homepage: https://ngspice.sourceforge.io/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# ngspice 上游测试套件 (tests/ 目录)
upstream_tests:
  - name: "general"
    source: ngspice-42/tests/general
    description: "通用功能测试"
  - name: "transient"
    source: ngspice-42/tests/transient
    description: "瞬态分析测试"
  - name: "sensitivity"
    source: ngspice-42/tests/sensitivity
    description: "灵敏度分析测试"
  - name: "resistance"
    source: ngspice-42/tests/resistance
    description: "电阻测试"
  - name: "transmission"
    source: ngspice-42/tests/transmission
    description: "传输线测试"
  - name: "polezero"
    source: ngspice-42/tests/polezero
    description: "极零分析测试"

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "ngspice --version 验证二进制可执行"
    command: "ngspice --version"

# 测试断言总数 (近似值)
assertion_count: 50
