software: nsxiv
display: "nsxiv"
description: "Neo Simple X Image Viewer — lightweight image viewer fork of sxiv"
category: gfx
homepage: "https://github.com/nsxiv/nsxiv"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "Disable HAVE_INOTIFY=0 — OHOS kernel lacks inotify API"
    - "Set PREFIX to $DEFAULT_PREFIX in config.mk"
  common_dependencies:
    - imlib2
    - libx11

versions:
