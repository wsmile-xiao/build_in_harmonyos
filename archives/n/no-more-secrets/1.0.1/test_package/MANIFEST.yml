# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: no-more-secrets/1.0.1
homepage: "https://github.com/bartobri/no-more-secrets"

# 上游测试命令: 本项目是纯 Makefile 工程，无 check/test 目标
upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无（上游未提供测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 直接执行被测二进制)
test_package_tests:
  - file: test.sh
    description: "冒烟测试: nms -v 输出 1.0.1 版本号, sneakers 存在且可执行"
    command: "bash test.sh <package bin dir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
