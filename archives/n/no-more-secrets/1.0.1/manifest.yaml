software: no-more-secrets
# 版本级 manifest
# 文件位置: archives/n/no-more-secrets/1.0.1/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "1.0.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方上游 tag v1.0.1
  url: "https://github.com/bartobri/no-more-secrets/archive/refs/tags/v1.0.1.tar.gz"
  sha256: "4422e59bb3cf62bca3c73d1fdae771b83aab686cd044f73fe14b1b9c2af1cb1b"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 纯 GNU Make 工程（无 configure）；构建 ncurses 版本目标 all-ncurses
  system: makefile

  configure_options: []

  # ncurses 以 Conan 依赖形式发布（ncurses/6.6，静态 libncursesw.a）
  dependencies:
    - "ncurses/6.6"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-Makefile.patch"

patch_classification:
  - file: 0001-Makefile.patch
    type: auto
    platform_only: True
    guard: 'pending'
