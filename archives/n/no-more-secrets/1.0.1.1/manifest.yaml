software: no-more-secrets
# 版本级 manifest
# 文件位置: archives/n/no-more-secrets/1.0.1.1/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "1.0.1.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方上游 tag v1.0.1（R39：保留官方源；conandata 另配 gh-proxy.com /
  # ghproxy.net 镜像，CI worker 直连 github.com 被阻断，三源 sha256 一致）
  url: "https://github.com/bartobri/no-more-secrets/archive/refs/tags/v1.0.1.tar.gz"
  sha256: "4422e59bb3cf62bca3c73d1fdae771b83aab686cd044f73fe14b1b9c2af1cb1b"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 纯 GNU Make 工程（无 configure）；构建 ncurses 版本目标 all-ncurses
  system: makefile

  configure_options: []

  # R4/R26: ncurses/6.4 为 OHOS 适配版配方（static-only --without-shared，
  # 随包发布 share/terminfo 数据库）；终端工具静态链接方可部署
  dependencies:
    - "ncurses/6.4"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-Makefile.patch"

patch_classification:
  # 通用 Makefile 增强（-ncurses 链接行消费 $(LDFLAGS)），不含任何平台宏：
  # 与 zerofree 1.1.1 的 0001 同因同型（纯 Makefile 上游不给交叉编译留口子）
  - file: 0001-Makefile.patch
    type: portability
    platform_only: false
    guard: 'none'

# 测试结论（版本级）：上游无测试套件；消费者终端测试见 test_package/
test_results:
  type: "consumer-pty"
  total: 36
  passed: 36
  failed: 0
  skipped: 5
  note: >
    AArch64 真机实测（HarmonyOS PC）：36 条断言全过；另有 5 条只在真实 pty 下
    可跑的检查因沙箱拒绝 /dev/ptmx 而跳过（"out of pty devices"），效果通路改由
    管道段覆盖并在真机命中明文（含多行输入分占相邻行的断言）。校验脚本
    test_package/nms_pty_test.py。
