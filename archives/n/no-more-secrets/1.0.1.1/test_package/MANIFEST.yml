# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: no-more-secrets/1.0.1.1
homepage: "https://github.com/bartobri/no-more-secrets"

# 上游测试命令: 本项目是纯 Makefile 工程，无 check/test 目标
# （`make -n check` → "No rule to make target 'check'"，已实测）
upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无（上游未提供测试套件，仓库内无 tests/ 目录）
upstream_tests: []

# test_package 中自带的消费者测试: 两个终端 UI 工具均需 pty 才能真实运行
# （nms 经 initscr() 初始化 ncurses，stdin 非 tty 时 freopen("/dev/tty")；
#   sneakers 首步 ioctl(TIOCGWINSZ) 非 tty 即 exit 1），故用 python pty
# harness 端到端驱动，断言特效输出与随包 terminfo 数据库。
test_package_tests:
  - file: nms_pty_test.py
    description: >-
      消费者 pty 测试: 安装树布局（bin/man/licenses/terminfo）、ELF 校验、
      nms -v 精确版本横幅、空输入/非法选项/sneakers 非 tty 三条负向路径、
      pty 下 nms 特效解密出输入文本并正常退出、管道下多行输入分占相邻行
      （无 pty 主机也覆盖特效通路）、pty 下 sneakers 面板从回放屏幕取文本
      （ncurses 逐格重绘故面板非字节子串，断言必须落在回放屏幕上）、
      以及两条负向注入控制（截断二进制 / 抽掉 terminfo 必须使检查失败，
      证明断言真实依赖被测包）
    command: "python3 nms_pty_test.py <package_folder>"

# 测试断言总数（nms_pty_test.py 运行时实测输出；负向注入控制在宿主系统
# terminfo 完整时以 SKIP 计，见 harness 输出）
assertion_count: 36
