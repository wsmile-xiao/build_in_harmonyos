# conandata.yml — no-more-secrets 1.0.1.1
# 源码：官方上游 tag v1.0.1（github.com/bartobri/no-more-secrets）
#
# R39：保留官方源 URL；CI worker 直连 github.com 被网络阻断（本仓多次实证，
# 如 inform6/inheritenv 首轮 conan-build-test 失败），故按列表给出镜像优先、
# 官方源兜底。三源下载字节逐字节一致，sha256 钉死（本地实测 25251 B / 同 sha256）。
#
# gitcode.com 镜像已实测评估：gh_mirrors 镜像仓存在但归档 URL 返回非 tar 包
# （HTTP 200 / 5793 B，sha256 不符，即该仓未被 gitcode 归档镜像），不可用；
# 故选 gh-proxy.com / ghproxy.net 两个 GitHub 反代（本仓 lenovolegionlinux /
# redo-c / vineyard 同款形态，均已合入）。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/bartobri/no-more-secrets/archive/refs/tags/v1.0.1.tar.gz"
    - "https://ghproxy.net/https://github.com/bartobri/no-more-secrets/archive/refs/tags/v1.0.1.tar.gz"
    - "https://github.com/bartobri/no-more-secrets/archive/refs/tags/v1.0.1.tar.gz"
  sha256: "4422e59bb3cf62bca3c73d1fdae771b83aab686cd044f73fe14b1b9c2af1cb1b"

patches:
  "1.0.1.1":
    - patch_file: "patches/0001-Makefile.patch"
