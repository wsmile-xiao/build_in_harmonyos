# 软件级 manifest
# 文件位置: archives/n/no-more-secrets/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: no-more-secrets

# 显示名
display: "no-more-secrets"

# 一句话描述
description: "命令行文本解密特效工具，重现 1992 年电影《Sneakers》中的解密过程（含 nms 与 sneakers 两个命令）"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://github.com/bartobri/no-more-secrets"

# 开源许可证（SPDX 标识）
license: GPL-3.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 GNU Make 上游（无 configure/VPATH）：配方 layout 强制 in-source 构建（folders.source/build = '.'）"
    - "上游 -ncurses 链接行只带 $(CC) $(CFLAGS)，交叉工具链传不进依赖 -L：补丁 0001 在两条链接行加入 $(LDFLAGS)（通用 Makefile 增强，无平台宏）"
    - "nms/sneakers 均为终端 UI 程序：nms 经 initscr() 初始化 ncurses，stdin 非 tty 时先 freopen(\"/dev/tty\")；sneakers 首步 ioctl(TIOCGWINSZ)，非交互终端直接 exit 1 —— 测试必须在伪终端（pty）下驱动"
    - "OHOS /usr/share/terminfo 不完整：终端类应用运行期需 terminfo 数据库，配方从 ncurses 依赖复制 share/terminfo 随包分发，并在 package_info() 定义 TERMINFO/TERMINFO_DIRS（KB: terminfo-database-bundle）"
    - "R26：终端工具按静态方式发布（依赖 OHOS 适配版 ncurses/6.4，static-only --without-shared）"
    - "OHOS 构建沙箱无可用 GNU coreutils install：package() 直接复制 bin/man6/LICENSE，不走 make install"

  common_dependencies:
    - ncurses

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0.1":
    status: built
    build_date: "2026-09-03"
    archive_path: "1.0.1"
    requires_manual_verification: true
  "1.0.1.1":
    status: built
    build_date: "2026-09-26"
    archive_path: "1.0.1.1"
    requires_manual_verification: false
