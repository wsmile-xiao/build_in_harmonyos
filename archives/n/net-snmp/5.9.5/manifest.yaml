software: net-snmp
build_system: autotools
version: "5.9.5"
status: built
build_date: "2026-05-20"

source:
  url: "https://sourceforge.net/projects/net-snmp/files/net-snmp/5.9.5/net-snmp-5.9.5.tar.gz/download"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--with-openssl=/storage/Users/currentUser/usr/local"
    - "--with-defaults"
    - "--disable-embedded-perl"
    - "--without-ethtool"
  dependencies:
    - openssl/1.1.1w
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-harmonyos-sockaddr-storage-fix.patch"

knowledge_gained:
  - "HarmonyOS SDK 头文件冲突：linux/socket.h 与 sys/socket.h 的 sockaddr_storage 重定义"
  - "需定义 __kernel_sa_family_t 并阻止 _UAPI_LINUX_SOCKET_H 宏来解决头文件冲突"