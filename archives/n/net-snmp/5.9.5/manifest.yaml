software: net-snmp
build_system: autotools
version: "5.9.5"
status: built
build_date: "2026-09-27"

source:
  url: "https://downloads.sourceforge.net/project/net-snmp/net-snmp/5.9.5/net-snmp-5.9.5.tar.gz"
  sha256: "07f94f06a8d681485e43eeec4f190d9bea43e1b335146d0de466b6de3f3f4c5a"
  tar_format: tar.gz

build:
  system: autotools
  # 依赖项形态：只构建 squark 所需的库/头/脚本闭包
  configure_options:
    - "--with-defaults"
    - "--disable-agent"
    - "--disable-applications"
    - "--disable-manuals"
    - "--disable-scripts"
    - "--disable-embedded-perl"
    - "--without-perl-modules"
    - "--without-ethtool"
    - "--with-openssl=<openssl 依赖包路径>"
  dependencies:
    - openssl/3.5.6
  cc: clang
  cxx: clang++

# 5.9.5 上游已自修 fds_bits 类型探测，5.9.4 的 musl fd_set 补丁不再需要
patches_applied: []

tests:
  upstream_suite: "testing/fulltests（7 组，165 例）"
  upstream_inventory:
    integration_process_level: 123   # default 88 + snmpv3 4 + tls 23 + transports 8
    unit_tests_c: 35
    perl: 6
    read_only: 1
  upstream_unit_tests_run: 35
  upstream_unit_tests_passed: 27     # 19,775 条断言
  upstream_unit_tests_blocked: 8     # 构建树上下文 2 / 配方形态裁剪 2 / 平台只读文件系统 4
  package_assertions: 4              # test_package/test.c（含 1 组鸿蒙 PC 端到端）
  harmonyos_specific_e2e: 1          # 真实 UDP 回环 v2c + BER 校验 + 超时路径，设备实测通过
  consumer_contract: 2               # net-snmp-config --version / --libs

knowledge_gained:
  - "5.9.5 上游已自修 fds_bits 类型探测，5.9.4 的 musl fd_set 补丁不再需要（强套会 Hunk #1 FAILED）"
  - "鸿蒙 PC /tmp 与 /etc 均为只读文件系统：上游依赖写入这两个目录的用例（T004/T020/T026/T027）在本平台必然失败；包内自带测试应避开文件系统写入路径"
  - "net-snmp 上游测试套件位于 testing/fulltests/（perl 驱动集成测试 + C 单元测试），按 tests/ 目录或 ctest 注册来清点会误判为『上游无测试』"
