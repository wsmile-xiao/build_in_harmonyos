# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ntopng/6.6
homepage: "https://github.com/ntop/ntopng"

# 上游测试命令（ntopng Makefile 的 make test -> test_version 目标 = ./ntopng --version）
upstream_check_command: "make test"
# conanfile.py build() 内未执行上游测试（--version 需运行期 conanrun 环境），如实置 false
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序/目标（含豁免说明）
upstream_tests:
  - file: Makefile
    source: ntopng-6.6
    description: "make test 的 test_version 目标执行 ./ntopng --version（版本 banner 冒烟，可运行于打包环境）"
    command: "make test"
  - file: tests/e2e
    source: ntopng-6.6
    description: "e2e 需 root + 活动网卡 + 起 web 服务，容器/CI 环境不可运行（如实豁免，上游亦无 CI 化）"
    command: ""

# test_package 自带的测试（消费者视角：对齐上游 make test 的 --version 冒烟）
test_package_tests:
  - file: conanfile.py
    description: "消费者测试：conanrun 环境下执行 ntopng --version 版本 banner 冒烟（对齐上游 make test/test_version）"
    command: "ntopng --version"

# 测试断言总数（近似值，--version 成功即 1 项断言）
assertion_count: 1
