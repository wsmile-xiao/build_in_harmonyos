# ntopng 6.6 — 版本级 manifest（Flow A 续跑 Worker 更新 2026-09-06）
# 遵循 ARCHIVE-SPEC v2.0

version: "6.6"
software: ntopng

# 编译状态: built 需 ntopng 二进制完整产出。
# 探索编译（2026-09-05/06）: configure RC=0；顶层 make 全绿（256 对象+链接，
# 产物 buildwork/ntopng-6.6.work/ntopng ELF arm64）。conan create 复验待 Flow A 执行。
# .ci-result.json 由 finish 步骤写入，本文件不伪造。
status: built

build_date: "2026-09-06"
build_system: autotools

source:
  url: "https://github.com/ntop/ntopng/archive/refs/tags/6.6.tar.gz"
  sha256: "2e97fbd26c2f9ac526214e2a2e22ecb218e38f5e99a688c25ae6cedbbc3a892c"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX(/storage/Users/currentUser/usr/local)"
    - "--with-ndpi-static-lib=<ndpi>/lib"
    - "--with-ndpi-includes=<ndpi>/include/ndpi"
    - "autogen 后 sed 'umask 077→002'（E011，本 FS 0700 目录不可写，ntopng/rrdtool/ndpi 三处）"
    - "make -j8 CC=clang CXX=clang++（探索期 -j8 已全绿；bundled lua 需命令行 CC 覆盖 gcc）"
    - "bundled rrdtool 1.4.8：configure.ac 去 glib/xml/nroff/troff 硬检（build() 内源级改写）+ src/Makefile.am 去 rrd_restore.c → rrdtool autogen.sh 再生成 configure/Makefile.in（可重放）"
  dependencies:
    - json-c/0.18
    - openssl/3.5.6.1
    - sqlite3/3.49.1
    - libpcap/1.10.6
    - hiredis/1.2.0
    - curl/8.15.0
    - zeromq/4.3.5
    # nDPI/5.0 与 libmaxminddb/1.11.0 不在远程 ohpcd：requires 不含二者（R36/L0i 只查
    # requires），配方 build() 内 R49 从官方源自建到私有 prefix（ndpi 5.0 tag 与 ntopng 6.6 配对，
    # 1 参 ndpi_init_detection_module；nDPI 6.0 为 2 参不兼容）。
    - "ndpi/5.0 (private build in conanfile, R49)"
    - "libmaxminddb/1.11.0 (private build in conanfile, R49)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-makefile-in-clickhouse-submodule-guard.patch"
  - "0002-makefile-in-rrdtool-configure-build-type.patch"
  - "0003-utils.cpp-ethtool-speed-ohos.patch"
  - "0004-rrdtool-rindex-to-strrchr.patch"

knowledge_gained:
  - "E011(变体): HarmonyOS worker FS 上 autoconf (umask 077 && mktemp -d) 生成的 0700 临时目录属主不可写且 chmod 无效 → sed umask 077→002"
  - "HarmonyOS config.guess 无法识别 uname(1) 系统类型 → bundled autotools 需显式 --build=aarch64-unknown-linux-gnu"
  - "GNU make 把 LIBRRDTOOL_LIB 值中的裸 -lm 当第二个目标，-j>1 触发并发 configure 竞争 → 变量去 -lm 且 -j1"
  - "conan full_deploy .pc 迁移路径后仍内嵌旧 prefix → 需同步修正 .pc prefix；json-c 头在 include/json-c 子目录，Cflags 需含 -I include/json-c"
  - "lang-preflight 误判 python（third-party/rrdtool 捆绑 python/setup.py），按 ndpi 先例人工复核为 C++ 族（详见 notes）"
  - "F068 源码误删事故（init-build _promote_nested_source 把 doc/Makefile 当源码根）→ 恢复流程参见 notes"

