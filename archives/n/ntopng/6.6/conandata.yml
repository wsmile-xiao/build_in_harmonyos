# conandata.yml — ntopng 6.6

sources:
  url: "https://github.com/ntop/ntopng/archive/refs/tags/6.6.tar.gz"
  sha256: "2e97fbd26c2f9ac526214e2a2e22ecb218e38f5e99a688c25ae6cedbbc3a892c"

# nDPI and libmaxminddb are NOT published to remote ohpcd.
# W3 L0i performs `conan download -r=ohpcd --only-recipe` per require: declaring them
# in `requires` fails L0i.  They are therefore fetched here from official sources and
# built into a private prefix inside build() (R49).
#
# nDPI version pairing (2026-09-06 evidence): ntopng tag 6.6 (2025-11-17T09:36Z) is
# released the same morning as nDPI tag 5.0 (2025-11-17T08:11Z).  ntopng 6.6 calls
# `ndpi_init_detection_module(NULL)` (1-arg) which matches nDPI 5.0/5.1-dev API.
# nDPI tag 6.0 (2026-08-28) switched to 2-arg `(g_ctx, license_type)` and does NOT
# compile against ntopng 6.6.  => pinned nDPI 5.0.
ndpi:
  url: "https://github.com/ntop/nDPI/archive/refs/tags/5.0.tar.gz"
  # sha256 of official 5.0 tag archive (verified locally, 2026-09-06)
  sha256: "8b0d3dc0c8a6a68578e09a18c922021ef6458d4aca1c7a20ce04efc267aa9ea5"

libmaxminddb:
  url: "https://github.com/maxmind/libmaxminddb/releases/download/1.11.0/libmaxminddb-1.11.0.tar.gz"
  sha256: "b2eea79a96fed77ad4d6c39ec34fed83d45fcb75a31c58956813d58dcf30b19f"

patches:
  - patch_file: "patches/0001-makefile-in-clickhouse-submodule-guard.patch"
    patch_description: "Guard clickhouse-cpp submodule targets (absent from release tarballs)"
    patch_type: "portability"
  - patch_file: "patches/0002-makefile-in-rrdtool-configure-build-type.patch"
    patch_description: "Bundled rrdtool: pass --build triple and drop '-lm' pseudo-target (HarmonyOS config.guess cannot detect system type)"
    patch_type: "portability"
  - patch_file: "patches/0003-utils.cpp-ethtool-speed-ohos.patch"
    patch_description: "OHOS sysroot ethtool.h lacks ethtool_cmd_speed(); compute link speed from ethtool_cmd fields (upstream new-kernel form)"
    patch_type: "portability"
  - patch_file: "patches/0004-rrdtool-rindex-to-strrchr.patch"
    patch_description: "OHOS libc has no rindex(); use strrchr in bundled rrdtool rrd_client.c"
    patch_type: "portability"
