# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁强制要求存在）
package: ncrack/0.7
homepage: "https://github.com/nmap/ncrack"

# 上游测试命令：顶层无 check/test 目标；回归套件在 nsock 子项目
# （nsock/src/Makefile.in 的 check 目标 = cd ../tests && make && ./run_tests.sh）
upstream_check_command: "cd nsock/src && make check"

# conanfile.py 的 build() 已集成该命令
upstream_test_in_build: true
upstream_test_command: "make -j1 check   # 在 build 目录的 nsock/src 下执行"

# 上游回归套件实况（设备实测 2026-09-13，如实记录，不夸大）：
#   * 7 个用例 TU + main：nsock/tests/Makefile.in 的 SRC =
#     tests_main.c basic.c timer.c logs.c connect.c ghlists.c ghheaps.c cancel.c
#   * run_tests.sh 执行前要求 ncat（Nmap 项目另一工具，不在本包内）；
#     设备与 CI 环境均无 ncat，故 make check 只编译测试程序，并打印
#     "Can't find your ncat: ncat ... Skipping nsock tests."
#   * 上游自身的 CI（.travis.yml）也只跑 ./configure && make，不跑测试
#   => 本包对上游测试的处置：编译级验证（7 个 TU 全部编译通过）；
#      执行级验证由 test_package 的真实运行承担（见下）
upstream_tests:
  - file: nsock/tests/tests_main.c（含 7 个用例 TU）
    source: ncrack-0.7.tar.gz
    description: "nsock 事件循环回归套件；编译通过（执行需 ncat，当前环境缺失）"
    command: "cd nsock/tests && make"
  - file: nsock/tests/run_tests.sh
    source: ncrack-0.7.tar.gz
    description: "执行入口；需 ncat，设备与 CI 均无 → 跳过（已在 build 日志中如实打印）"
    command: "./run_tests.sh"

# test_package 的消费者验证（真实执行安装后的二进制；设备实测两条断言均通过）
test_package_tests:
  - file: test_ncrack.sh
    description: |
      1) `ncrack --version`：断言 "Ncrack version 0.7"、"Modules:" 模块表存在、
         且含 "RDP"（该模块经 ntlmssp.cc 走 OpenSSL 代码路径，可证 OpenSSL 已链接）
      2) 闭端口真实扫描 `ncrack -p rdp:9 -T 4 --datadir <pkg>/share/ncrack 127.0.0.1`：
         断言退出码 0、"Ncrack done: 1 service scanned"、"Ncrack finished."、
         且无 "Discovered credentials"（闭端口不可能发现凭据）
      注：NCRACKDIR 必须指向包内 share/ncrack —— 二进制的 NCRACKDATADIR 是编译期
      绝对路径（--prefix=/ 下为 /share/ncrack），无法指向 conan 包目录；ncrack 在
      解析命令行选项之前就要加载 ncrack-services，故测试用 $NCRACKDIR 定位。
    command: "sh test_ncrack.sh <package_folder>/bin/ncrack <package_folder>/share/ncrack"

# 测试断言总数（近似值：version 3 项 + 扫描 3 项）
assertion_count: 6
