# 版本级 manifest —— ncrack 0.7
# 遵循 ARCHIVE-SPEC v2.0

version: "0.7"
software: ncrack

# 设备实机构建已通过 conan create 与八门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-13"
build_system: autotools

source:
  url: "https://github.com/nmap/ncrack/archive/refs/tags/0.7.tar.gz"
  sha256: "f3f971cd677c4a0c0668cb369002c581d305050b3b0411e18dd3cb9cc270d14a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-musl --host=aarch64-unknown-linux-gnu（显式三元组：本 dist 的 2019 版 config.sub 不认 ohos/harmonyos；交叉模式保留，config.guess 不执行）"
    - "--prefix=/（配合 DESTDIR 使 bin/ 与 share/ 直落包根）"
    - "--with-libpcap=no（上游 configure.ac 自带该默认，显式重申）"
    - "--with-openssl=<openssl/1.1.1w package_folder>（必需而非可选：ntlmssp.cc 无条件包含 openssl 头）"
    - "CONFIG_SHELL=/usr/bin/zsh + stdin=/dev/null（autoconf 2.69 的 exec 7<&0 要求 shell 支持多位数 fd 且 fd 0 有效）"
    - "--with-ssl-dir=<openssl/1.1.1w package_folder>（opensshlib 子目录自己的 OpenSSL 检查，顶层选项到不了）"
    - "四个 configure 的 umask 077→022 改写（hmdfs 按组判通行，0700 临时目录不可穿越）"
    - "-std=gnu++14（crypto.cc 23 处 register；profile 的 cppstd=17 不允许）"
    - "-fcommon（年代语义兜底）+ 补丁 0001 删除未使用的全局 umac_ctx（opensshlib 用同一 umac.c 编出 umac.o/umac128.o 的重复符号根因；CI 上 -fcommon 未生效故改为结构性消除）"
  dependencies:
    - openssl/1.1.1w
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-opensshlib-umac-drop-unused-global.patch"

knowledge_gained:
  - "autoconf 2.69 的 configure 用 exec 7<&0 保存 stdin：OHOS 的 /system/bin/sh（toybox）不支持多位数 fd 重定向，且 worker/CI 执行时 fd 0 是关闭的——须 CONFIG_SHELL=/usr/bin/zsh 并显式 < /dev/null"
  - "configure 报 OpenSSL 未找到只是告警禁用，但 ntlmssp.cc 无条件 include <openssl/hmac.h>，故 OpenSSL 对本包是硬依赖（--with-openssl 显式开启）"
  - "hmdfs 按组判目录通行（目录皆 drwxrws--x）：configure/config.status 用 (umask 077 && mktemp -d) 建出 2700 临时目录后，其内一切读写均 EACCES（'permission denied: ./confXXXXXX/subs1.awk'），chmod 在 hmdfs 上是空操作，唯一解法是把四个 configure 的 umask 077 改写为 022"
  - "autoconf 的子目录递归会把顶层不认识的 --with-* 原样转发（顶层仅告警）：opensshlib 的 OpenSSL 检查靠 --with-ssl-dir=DIR，而顶层自己的 --with-openssl=DIR 到不了它"
  - "conan 的 AutotoolsToolchain 不往 env 注入 CPPFLAGS/LDFLAGS（设备实测 conanautotoolstoolchain.sh / conanbuild.sh 里都没有），依赖的头/库路径须由构建系统自己的选项显式给出"
  - "ncrack 0.7 早于 C++17 移除 register 关键字（crypto.cc 23 处），profile cppstd=17 下须以 -std=gnu++14 构建（用 tc.extra_cxxflags，不改上游源码）"
