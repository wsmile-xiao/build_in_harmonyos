# conandata.yml — ncrack 0.7
# 官方源：Nmap 项目官方仓库 nmap/ncrack（GitHub API 实证：非 fork、未归档、tag 0.7 = commit dc570e7e）
# 上游 tag 无 v 前缀（0.7，非 v0.7）
# sha256 实测自官方 tarball（本机 shasum -a 256，与设备侧 sha256sum 逐字符一致）

sources:
  url: "https://github.com/nmap/ncrack/archive/refs/tags/0.7.tar.gz"
  sha256: "f3f971cd677c4a0c0668cb369002c581d305050b3b0411e18dd3cb9cc270d14a"

patches:
  # opensshlib 内 `umac.c` 第 1184 行 `struct umac_ctx { ... } umac_ctx;` 定义了一个
  # 文件作用域的全局变量（无初值 = C 的 tentative definition），而该变量**从未被使用**
  # （其余 umac_ctx 出现处都是类型 `struct umac_ctx`，grep 实证）。
  # opensshlib 自己的 Makefile 用同一份 umac.c 加 -DUMAC_128 再编出 umac128.o，
  # 于是两个 TU 各定义一次同名全局：
  #   * GCC≤9 / clang 带 -fcommon：tentative definition 合并为 COMMON symbol → 正常
  #   * clang≥11 默认 -fno-common：两个强定义 → `ld.lld: error: duplicate symbol: umac_ctx`
  # 本项目在设备侧曾以 -fcommon 通过，但 CI worker 的编译标志传播路径不同，同一配方
  # 仍复现重复符号（CI #45813 实测），故改为从根上消除：删掉这个无用全局的声明符，
  # 与 -fcommon 是否存在解耦。
  # 该变量无任何引用，删除后两 TU 只共享类型名（各自 TU 内），链接不再冲突。
  "0.7":
    - patch_file: "patches/0001-opensshlib-umac-drop-unused-global.patch"
      patch_description: "Drop the unused file-scope global `umac_ctx` in opensshlib/umac.c so umac.o and umac128.o (same source, -DUMAC_128) no longer emit duplicate symbols under clang's -fno-common default"
      patch_type: "portability"
