# 软件级 manifest — nq
software: nq
display: "nq"
description: "Unix 轻量任务队列工具：nq 入队、nqtail 跟踪输出、nqterm 新窗口包装，基于 flock(2) 无需守护进程"
category: utility
homepage: "https://github.com/leahneukirchen/nq"
license: CC0-1.0

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 POSIX C + flock(2)，无第三方依赖，Makefile 直接编译即可"
    - "上游 make check（prove -v ./tests）36 条 TAP 断言在本机/CI 全绿"
    - "上游 install 目标依赖 install(1)，package() 改为直接 copy（CI PATH 无保证）"
    - "产物含可执行 nq/nqtail 与 shell 脚本 nqterm，已在软件级 commands.json 声明"
  common_dependencies: []

versions:
  "1.0":
    status: built
    build_date: "2026-09-03"
