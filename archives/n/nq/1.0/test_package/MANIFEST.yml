# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nq/1.0
homepage: "https://github.com/leahneukirchen/nq"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests
    source: nq-1.0/tests
    description: "TAP 测试脚本（prove -v ./tests），覆盖入队/等待/杀掉任务/nqtail 输出，共 36 条断言，真实执行后台 job"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_nq.sh
    description: "功能冒烟：nq 真实入队 job 并等待、校验 job 日志含输出与 exited status 0；nqtail 展示日志；nqterm 可执行"
    command: "sh test_nq.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 42
