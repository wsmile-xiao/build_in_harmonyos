# nip4 9.1.5 — 上游官方 release tarball（GitHub release 资产，tar.xz）。
# sha256 于 2026-09-25 对 v9.1.5 资产实测校验（nip4-9.1.5.tar.xz）。
sources:
  url: "https://github.com/libvips/nip4/releases/download/v9.1.5/nip4-9.1.5.tar.xz"
  sha256: "ceea7a00f9e8182195c3b4a62416145dbc303f44f62a09bfce0690fd6fbf1ecc"

patches:
  - patch_file: "patches/0001-test-cli-posix-sh.patch"
    patch_description: "test_cli.sh: use POSIX /bin/sh shebang (OHOS sandbox has no /bin/bash; script body is POSIX-only)"
    patch_type: "portability"
  - patch_file: "patches/0002-workspace-portable-paths.patch"
    patch_description: "test workspaces: replace upstream developer hard-coded paths (/home/john/GIT/nip4, $HOME/GIT/nip4, /home/john/vips) with $VIPSHOME-relative references so test data resolves under the Conan build tree"
    patch_type: "portability"
  - patch_file: "patches/0003-test-tasks-relative-path.patch"
    patch_description: "test_tasks.ws: Pathname value must be relative to the meson test cwd (build tree), where snip --test resolves it; the $VIPSHOME-relative form from 0002 works for data files via vips expansion but Pathname rows are passed verbatim to vips and miss $VIPSHOME, failing 2/2 in real meson test. Verified 2/2 OK with ../test/workspaces/images/... (meson test cwd=build dir)"
    patch_type: "portability"
