version: 9.1.5
software: nip4
status: built
build_date: "2026-09-25"
build_system: meson
source:
  url: https://github.com/libvips/nip4/releases/download/v9.1.5/nip4-9.1.5.tar.xz
  sha256: ceea7a00f9e8182195c3b4a62416145dbc303f44f62a09bfce0690fd6fbf1ecc
  tar_format: tar.xz
build:
  system: meson
  configure_options:
    - -Dwrap_mode=nodownload
    - -Dflatpak=false
  dependencies:
    - vips/8.18.4.1
    - gtk4/4.22.4
    - gsl/2.8
    - libxml2/2.15.3.1
    - glib2/2.88.0
    - glib/2.84.0.1.1
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "nip4 是纯 C 应用（GTK4 UI + snip CLI），Meson 构建；configure 期依赖 flex/bison（lex.l/parse.y → lex.c/parse.c），代码生成走 gnome.genmarshal / gnome.compile_resources / gnome.mkenums（从 glib 的 pkg-config 变量读工具路径）。"
  - "上游默认 c_std=c2x（C23）；源码实际未用 C23-only 特性，clang 15 可编译；若未来上游使用 C23 语法，需要把项目 c_std 降为 c17。"
  - "R85/R86（关键，同 gtk4/4.22.4）：ohpcd 发布的 glib/2.84.0.1.1 shared 包 bin/ 下 ELF 工具（glib-compile-resources 等）链接期 .codesign 已过期，OHOS 内核 exec 拒绝报 Operation not permitted（ninja FAILED code=126）。必须在生成阶段用 llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1 重签，并把 glib 包 lib 前置到 LD_LIBRARY_PATH（工具无 RPATH，否则报 Error loading shared library libgio-2.0.so.0）。"
  - "双 GLib 图：vips 链解析到 glib2/2.88.0（PkgConfigDeps 导出 glib-2.0.pc），gtk4 链解析到 glib/2.84.0.1.1 shared（gtkmm R8 已签名工具变体）；两 provider 都声明 glib-2.0 相关 components，与 gtkmm/4.0.0 同构，override 组照抄 gtkmm。"
  - "zlib 图统一：glib2 声明 zlib/1.3.1 而 libpng 声明 1.3.1.1，必须 override 到 zlib/1.3.1.1（PIC 变体，vips CI #44364 先例），否则版本冲突。"
  - "NLS 是可选软依赖：meson dependency('intl', required: false)，找不到时 ENABLE_NLS 关闭、HAVE_BIND_TEXTDOMAIN_CODESET=false，不阻塞构建。"
  - "上游测试套件（10 should-pass .ws ×2 含 VIPS_NOVECTOR 变体 + 1 should-fail + 8 snip .def + test_cli.sh）全部由 snip CLI 驱动，无 GUI/显示服务器依赖，OHOS 非交互环境可直接运行；交叉构建时构建机不能 exec aarch64 二进制，测试跳过并如实记录（同 gtkmm/4.0.0）。"