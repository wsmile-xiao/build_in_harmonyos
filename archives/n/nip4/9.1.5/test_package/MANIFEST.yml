# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nip4/9.1.5
homepage: "https://github.com/libvips/nip4"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test -C build --timeout-multiplier=16 --no-rebuild"

# conanfile.py build() 方法中是否已集成上游测试
# 是：native OHOS 环境下 build() 直接跑完整上游 meson 套件
#     （10 should-pass .ws ×2 含 VIPS_NOVECTOR 变体 + 1 should-fail + 8 snip .def + test_cli.sh）
#     交叉构建（build=Linux/host=OHOS）时构建机不能 exec aarch64 二进制，跳过并记录。
upstream_test_in_build: true
upstream_test_command: "meson test -v -C build --timeout-multiplier=16 --no-rebuild"

# 上游实际运行的测试程序
# 上游测试全部由 snip CLI 驱动（--test/--workspace/--def），无 GUI/显示服务器依赖：
upstream_tests:
  - file: test/workspaces/test_colour.ws
    description: "workspace 颜色计算（snip --test，含 VIPS_NOVECTOR 变体）"
    command: "snip --test --workspace test/workspaces/test_colour.ws"
  - file: test/workspaces/test_filter.ws
    description: "workspace 滤波（snip --test，含 VIPS_NOVECTOR 变体）"
    command: "snip --test --workspace test/workspaces/test_filter.ws"
  - file: test/workspaces/test_histogram.ws
    description: "workspace 直方图（snip --test，含 VIPS_NOVECTOR 变体）"
    command: "snip --test --workspace test/workspaces/test_histogram.ws"
  - file: test/workspaces/test_image.ws
    description: "workspace 图像（snip --test，含 VIPS_NOVECTOR 变体）"
    command: "snip --test --workspace test/workspaces/test_image.ws"
  - file: test/workspaces/test_magick.ws
    description: "workspace magick（snip --test，含 VIPS_NOVECTOR 变体）"
    command: "snip --test --workspace test/workspaces/test_magick.ws"
  - file: test/workspaces/test_math.ws
    description: "workspace 数学（snip --test，含 VIPS_NOVECTOR 变体）"
    command: "snip --test --workspace test/workspaces/test_math.ws"
  - file: test/workspaces/test_matrix.ws
    description: "workspace 矩阵（snip --test，含 VIPS_NOVECTOR 变体）"
    command: "snip --test --workspace test/workspaces/test_matrix.ws"
  - file: test/workspaces/test_region.ws
    description: "workspace region（snip --test，含 VIPS_NOVECTOR 变体）"
    command: "snip --test --workspace test/workspaces/test_region.ws"
  - file: test/workspaces/test_tasks.ws
    description: "workspace tasks（snip --test，含 VIPS_NOVECTOR 变体）"
    command: "snip --test --workspace test/workspaces/test_tasks.ws"
  - file: test/workspaces/test_widgets.ws
    description: "workspace widgets（snip --test，含 VIPS_NOVECTOR 变体）"
    command: "snip --test --workspace test/workspaces/test_widgets.ws"
  - file: test/workspaces/test_fail.ws
    description: "should-fail workspace（snip --test 期望失败）"
    command: "snip --test --workspace test/workspaces/test_fail.ws (expect fail)"
  - file: test/snip/test_convert.def
    description: "snip 脚本：类型转换（60s 超时）"
    command: "snip test/snip/test_convert.def test/snip/images/slanted_oval_vase2.jpg"
  - file: test/snip/test_generate.def
    description: "snip 脚本：生成（60s 超时）"
    command: "snip test/snip/test_generate.def test/snip/images/slanted_oval_vase2.jpg"
  - file: test/snip/test_list.def
    description: "snip 脚本：链表（60s 超时）"
    command: "snip test/snip/test_list.def test/snip/images/slanted_oval_vase2.jpg"
  - file: test/snip/test_object.def
    description: "snip 脚本：对象（60s 超时）"
    command: "snip test/snip/test_object.def test/snip/images/slanted_oval_vase2.jpg"
  - file: test/snip/test_predicate.def
    description: "snip 脚本：谓词（60s 超时）"
    command: "snip test/snip/test_predicate.def test/snip/images/slanted_oval_vase2.jpg"
  - file: test/snip/test_snip.def
    description: "snip 脚本：核心语义（60s 超时）"
    command: "snip test/snip/test_snip.def test/snip/images/slanted_oval_vase2.jpg"
  - file: test/snip/test_stdenv.def
    description: "snip 脚本：标准环境（60s 超时）"
    command: "snip test/snip/test_stdenv.def test/snip/images/slanted_oval_vase2.jpg"
  - file: test/snip/test_types.def
    description: "snip 脚本：类型系统（60s 超时）"
    command: "snip test/snip/test_types.def test/snip/images/slanted_oval_vase2.jpg"
  - file: test/test_cli.sh
    description: "CLI 冒烟：snip -e 求值 / -w workspace 求值 / jpg 写盘（bash 脚本）"
    command: "test/test_cli.sh <snip> <source_root>"

test_package_tests:
  - file: conanfile.py
    description: "已安装 snip 二进制的真实 CLI 冒烟（run_tests.sh 17 断言）：snip -e 表达式求值 9（与上游 test_cli.sh check_output 逐条对应）+ Image_file→JPEG/PNG 保存与魔数 4（真实 vips 编码链路）+ 鸿蒙特有平台特性 4（ELF magic/ELFCLASS64/e_machine 字节级校验 + VIPSHOME 前缀定位）"
    command: "sh run_tests.sh <snip> <work_dir>"

# 测试断言总数 (近似值, 用于质量评估)
# run_tests.sh: snip -e 表达式求值(9) + Image_file→JPEG/PNG 保存与魔数(4) + OHOS aarch64 ELF 字节级检查(4) = 17
# 其中鸿蒙特有测试 4 条：ELF magic(7f454c46) + ELFCLASS64(02) + e_machine(EM_AARCH64 b700) + VIPSHOME 前缀定位
assertion_count: 17