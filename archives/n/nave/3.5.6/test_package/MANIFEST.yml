package: nave/3.5.6
homepage: "https://github.com/isaacs/nave"

# 上游测试命令
upstream_check_command: "bash test/run.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/run.sh
    source: test/run.sh
    description: "nave upstream test suite"
    command: "bash test/run.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_nave.sh
    description: "Verify nave.sh installed, executable, shebang, help + get dir functional checks"
    command: "bash test_nave.sh <nave.sh path>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
