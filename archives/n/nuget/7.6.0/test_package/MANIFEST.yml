# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nuget/7.6.0
homepage: "https://aka.ms/nugetprj"

# nuget 是预构建 .NET 二进制 (PE32)，上游无 make check / ctest 等构建系统测试
# 上游验证来源: nuget.org 包完整性验证 (SHA256 + PE header)
# NuGet.exe 为 Windows PE32 x86 可执行文件，在 Linux/OHOS 上需 mono 或 .NET 运行时
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 预构建二进制包，无源码级测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 NuGet.exe 存在、PE32 格式正确、文件大小合理、wrapper 脚本就绪"
    command: "conan test test_package/conanfile.py"

# 测试断言总数 (文件存在 + PE header + 文件大小 + wrapper + NOTICES = 5 个断言)
assertion_count: 5
