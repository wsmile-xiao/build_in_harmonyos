package: nuspell/5.1.8
homepage: "https://nuspell.github.io/"

upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: "ctest"

upstream_tests:
  - file: tests/unit_test.cxx
    source: nuspell-5.1.8/tests/unit_test.cxx
    description: "Unit tests using Catch2 framework (disabled in conan build, requires FetchContent)"
    command: "./unit_test"
  - file: tests/legacy_test.cxx
    source: nuspell-5.1.8/tests/legacy_test.cxx
    description: "Legacy API compatibility tests"
    command: "./legacy_test"
  - file: tests/verify.cxx
    source: nuspell-5.1.8/tests/verify.cxx
    description: "Verification tests comparing nuspell vs hunspell output"
    command: "./verify"

test_package_tests:
  - file: test_nuspell.cpp
    description: "Verify nuspell library links correctly and API symbols are available"
    command: "./nuspell_test"

assertion_count: 3
