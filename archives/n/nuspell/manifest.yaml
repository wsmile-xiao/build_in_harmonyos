software: nuspell
display: "Nuspell"
description: "Fast and safe spelling checker library (Hunspell replacement), written in modern C++ with ICU Unicode support"
category: text-processing
homepage: "https://nuspell.github.io/"
license: LGPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，依赖 ICU4C（icu4c/77 已发布到制品仓，静态链接）"
    - "上游 find_package(ICU) 需通过 CMakeDeps set_property 映射 icu4c -> ICU"
    - "静态编译（BUILD_SHARED_LIBS=OFF），避免系统同名库冲突（R26）"
    - "测试使用 Catch2 FetchContent，CI 环境无网络，BUILD_TESTING=OFF 禁用"
    - "构建产物包含库文件 libnuspell.a 和 CLI 工具 nuspell"

versions:
  - version: "5.1.8"
    status: built
    build_date: "2026-09-11"
    notes: 首次适配，CMake 静态编译，依赖 icu4c/77，ICU 映射
