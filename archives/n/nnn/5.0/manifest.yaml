software: nnn
version: 5.0
status: partial
build_system: makefile
created_at: 2026-04-28
source_url: https://github.com/jarun/nnn/archive/refs/tags/v5.0.tar.gz
dependencies:
  - name: readline
    version: 8.3
    note: "pulls ncurses/6.6 transitively (static wide-char)"
  - name: musl-fts
    version: 1.2.7
    note: "OHOS musl libc lacks fts_* functions"
configure_options: []
build_options:
  cflags: "-std=c11 -Wall -Wextra -Wshadow -O2 -I<dep_includes>"
  ldflags: "-L<dep_libs>"
  ldlibs: "-lreadline -lncursesw -lfts -lpthread"
  make_target: ""
  make_install: "make install PREFIX=/ DESTDIR=<package_folder>"
knowledge_gained:
  - "nnn 无 configure，直接 make（Makefile 项目）"
  - "需要手动链接 readline 和 ncursesw"
  - "OHOS musl 缺 fts_* 函数，需 musl-fts/1.2.7"
  - "Makefile 用 pkg-config 检测 ncursesw，CI 环境需手动传 CFLAGS/LDLIBS"
  - "Makefile LDLIBS 用 += 追加，命令行覆盖时需提供完整 LDLIBS"
  - "ELF 签名在本地环境可能失败但功能可用"
patches_applied: []
build_log: logs/build.log
notes: "Conan 配方已创建（conanfile.py + conandata.yml + test_package/），待执行 conan create 验证并提交 PR"
