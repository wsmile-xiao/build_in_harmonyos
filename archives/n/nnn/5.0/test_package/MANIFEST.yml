# test_package/MANIFEST.yml

package: nnn/5.0
homepage: "https://github.com/jarun/nnn"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: Makefile
    source: nnn-5.0/Makefile
    description: "Upstream Makefile (no built-in test target)"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "Verify nnn binary runs with -h flag"
    command: "./test_nnn"

assertion_count: 2
