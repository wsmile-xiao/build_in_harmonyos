# test_package/MANIFEST.yml
# 消费者测试声明：创建并重读一个 netCDF-4 文件，验证浮点变量往返一致。

package: netcdf-c/4.9.3
homepage: "https://www.unidata.ucar.edu/software/netcdf/"

upstream_check_command: "cd build && make check"
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  - file: test_package/test.c
    source: netcdf-c-4.9.3/test_package/test.c
    description: "Consumer round-trip of a netCDF-4 float variable through public API"
    command: "./test_netcdf-c"

test_package_tests:
  - file: test.c
    description: "Create + reopen netCDF-4 file, verify variable round-trip"
    command: "./test_netcdf-c"

assertion_count: 4