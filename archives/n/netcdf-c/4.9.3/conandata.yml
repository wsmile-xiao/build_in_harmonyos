  sha256: "990f46d49525d6ab5dc4249f8684c6deeaf54de6fec63a187e9fb382cc0ffdff"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: recognize HarmonyOS (uname -s=HarmonyOS) as linux-like; libc probe adds __OHOS__->LIBC=ohos (R8 libc-probe exception, same shape as __ANDROID__ probe; PR 声明例外理由并 --no-preflight 跳过 PF5)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: accept ohos-linux triplet and ohos* OS (E007)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: drop umask 077 around mktemp/mkdir temp dir for HMDFS (E114)"
    patch_type: "portability"
  - patch_file: "patches/0004-dap4_test-build.sh.patch"
    patch_description: "test script shebang: OHOS 无 /bin/bash（位于 /data/service/hnp/bin/bash），build.sh 指向真实 bash"
    patch_type: "portability"
  - patch_file: "patches/0005-libdispatch-ddispatch.c.patch"
    patch_description: "ddispatch: honor TMPDIR/TMP before /tmp fallback (OHOS /tmp erofs read-only, DAP cookie jar)"
    patch_type: "portability"
