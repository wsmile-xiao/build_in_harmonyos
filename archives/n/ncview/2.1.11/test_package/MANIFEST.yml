# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ncview/2.1.11
homepage: "https://cirrus.ucsd.edu/~pierce/ncview/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""
# ncview 上游无任何测试框架/target（Makefile.am 只有 bin_PROGRAMS/noinst_PROGRAMS）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ncview.sh
    description: >-
      打包产物功能冒烟：ncview 是 GUI 工具，测试环境无 X 显示。ncview 在参数
      处理阶段初始化 X toolkit（先于输入文件报错），因此断言：无显示时非零
      退出 + stderr 含 "Ncview 2.1.11" 版本 banner + 含 Xt 的
      "Can't open display" 诊断 —— 证明 ELF 动态依赖链（libnetcdf/libX11/
      libXt/libXext/libXpm）加载成功、二进制完整且 X11 错误路径正常。
      另断言：包内 bin/ncview 二进制存在。
    command: "./test_ncview.sh <binary> <bogus-file> <log> <ld-library-path>"

# 测试断言总数 (近似值, 用于质量评估)
# test_ncview.sh: 3 个断言 (exit!=0, 版本 banner, display 诊断)；conanfile 1 个 (二进制存在)
assertion_count: 4
