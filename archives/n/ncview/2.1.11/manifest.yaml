# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>（conan AutotoolsToolchain 注入）"
    - "--disable-shared（vendored 库全部静态）"
    - "--enable-static"
    - "--disable-xaw6（仅构建 Xaw7）"
    - "--disable-dependency-tracking（vendored 库）"
  dependencies:
    - "netcdf/4.9.3"
    - "libx11/1.8.13"
    - "libxt/1.3.1"
    - "xorgproto/2025.1"
    - "libxau/1.0.11（libx11 传递依赖，提供 X11/Xauth.h）"
    - "libsm/1.2.6（libxt 传递依赖，提供 X11/SM/SMlib.h）"
    - "libice/1.1.2（libxt 传递依赖）"
    - "libpng/1.6.58"
    - "expat/2.8.2.1.1（udunits 的 XML 解析依赖）"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息（build() 内字符串替换，无 patches/ 文件）
# ============================================================

patches_applied: []
patch_method: build()-string-replacement（agg 2.7.0.r145 模式，规避 CI conandata BUILD_DIR 坑）

patch_classification:
  - file: configure（ncview + 4 个 vendored 库的 configure/config.guess/config.sub）
    type: build-time-string-replacement
    platform_only: true
    guard: "none"
    description: >-
      ① E165 shebang 改写 /bin/sh→/system/bin/sh、/bin/bash→/data/service/hnp/bin/bash；
      ② HMDFS：config.status 的 umask 077 mktemp 改 umask 022 mkdir（E-agg 模式）；
      ③ SHELL fallback 改写；④ E007 config.guess/config.sub HarmonyOS 识别
      （Python 移植 patch-autotools-ohos.pl，新增 mktemp -d 700 目录的 HMDFS 修复与
      新旧两种 config.guess/config.sub 风格的兼容）。
  - file: configure（ncview 专属区块 strip）
    type: build-time-string-replacement
    platform_only: true
    guard: "none"
    description: >-
      AC_PATH_NETCDF / AC_PATH_X / AC_PATH_XTRA / Xaw 检测 / X11 检测 /
      AC_PATH_UDUNITS2 / AC_PATH_PNG 七个检测区块全部替换为直接赋值
      （依赖路径以字面量烤入）；RPATH 循环整段移除避免把 conan cache
      绝对路径烤进二进制；HAVE_NETCDF/HAVE_NETCDF4/HAVE_PNG 直接写入 confdefs.h。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E007 扩展：patch-autotools-ohos.pl 对 2013 老版 config.guess 不够——老脚本是 echo+exit 风格（新版是 GUESS 变量风格），补丁块风格必须自适应，否则 GUESS 赋值后被丢弃、落进尾部编译 fallback"
  - "E007 扩展：老版 config.guess 的临时目录 umask 077 mktemp -d 在 HMDFS 上必死（mktemp -d 恒建 700 目录、HMDFS 拒绝在 700 目录内写入），必须换成 umask 022 的 mkdir+echo 分支；umask 022 对 mktemp -d 无效（模式硬编码）"
  - "E007 扩展：2013 版 config.sub 不认识 *-linux-ohos 三元组，老式脚本应输出它认识的 linux-gnu 三元组（CC 来自环境，配置行为无差）"
  - "libtool .la 地狱：conan X 系包安装的 .la 里 dependency_libs 带陈旧绝对缓存路径（~/.cache/conan2 时代产物），libtool 解析 -l 标志时读取 .la 直接报错；绕法=PKG_CHECK_MODULES 覆盖变量（XMU_LIBS 等）传显式 .so/.a 绝对路径，libtool 原样透传不做 .la 查找"
  - "PKG_CHECK_MODULES 的 <NAME>_CFLAGS/<NAME>_LIBS 环境变量可整段绕过 pkg-config；Xorg 系每个库有独立模块名（XEXT/XMU/XMUU/XPM/SXPM/XAW7），连 sxpm 这类工具也有自己的 SXPM_* 变量"
  - "跨版本守卫坑：conan 补丁函数里用『字符串是否已存在』做幂等守卫时，注意前一个补丁的副产物可能提前满足守卫（ohos-linux 三元组补丁引入 linux-ohos 字符串，短路了 kernel-OS 校验段补丁）"
  - "上游『可选依赖』不可信：ncview 的 udunits2 标称可选，但 utCalendar2_cal.c 无条件 include udunits2.h 并引用 ut_* 符号——盘点依赖必须读源码，不能只信 configure"
  - "GUI 工具的 test_package：ncview 在参数处理阶段就初始化 X toolkit（先于文件报错），无显示环境断言『版本 banner + Can't open display + 非零退出』即为有效冒烟（R34：真实执行被测包二进制）"
  - "libXaw 安装钩子会无条件 ln -s libXaw7.so libXaw.so（静态构建时是悬空链接），无害但要知道"

verification:
  conan_create: "pass（EXIT=0，2026-09-09）"
  test_package: "pass（ncview smoke test OK: exit=1, banner + X11 diagnostic present, dynamic deps resolved）"
  binary: "bin/ncview: ELF 64-bit LSB arm64, dynamically linked /lib/ld-musl-aarch64.so.1"
