software: ncview
display: "ncview"
description: "Interactive visual browser for netCDF data files (X11/Athena widgets)"
category: scientific
homepage: "https://cirrus.ucsd.edu/~pierce/ncview/"
license: GPL-3.0-or-later
build_system: autotools

versions:
  "2.1.11":
    packaging: conan
    status: built
    build_date: "2026-09-09"
    notes: >-
      首个 conan 配方。GUI 工具（type: tool，见 commands.json）。核心难点：
      ①远端无 libxaw/libxmu/udunits，libxext/libxpm 钉死冲突的 libx11/6.4.0 ——
      五个依赖 vendored 静态编译（libXext/libXmu/libXpm/libXaw/udunits）；
      ②configure 七个检测区块 strip + 字面量注入（agg 模式，无 conandata.yml）；
      ③E007 平台识别移植进配方并扩展（echo+exit 老风格脚本、HMDFS 下
      umask 077 mktemp -d 的 700 目录拒写、2013 版 config.sub 的三元组兼容）；
      ④上游"可选依赖"udunits2 实为硬依赖（utCalendar2_cal.c 无条件引用）。
      conan create + test_package（headless 二进制冒烟）全部通过。
