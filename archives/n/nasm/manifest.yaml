software: nasm
display: "NASM Assembler"
description: "NASM (Netwide Assembler) 是一个 80x86 和 x86-64 汇编器，设计用于可移植性和模块化"
category: build-tool
homepage: "https://www.nasm.us/"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools 项目，标准 configure → make → make install 流程"
    - "需要更新 config.guess/config.sub 以支持 ohos 平台"
    - "configure 中 umask 077 需修改为 umask 022（E011）"
  common_dependencies:
    - automake 1.16+（提供支持 ohos 的 config.guess/config.sub）

versions:
  "2.16.03":
    status: published
    build_date: "2026-05-25"
    source_url: "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/nasm-2.16.03.tar.gz"