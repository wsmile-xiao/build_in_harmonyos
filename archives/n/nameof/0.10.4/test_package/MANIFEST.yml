# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nameof/0.10.4
homepage: "https://github.com/Neargye/nameof"

# 上游测试命令
upstream_check_command: "cmake --build build --target nameof"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (nameof 使用 Catch2 单头编译 test.cpp 等)
# Not integrated in conan build; test_package provides consumer-side verification
upstream_tests:
  - file: test/test.cpp
    source: nameof-0.10.4/test/test.cpp
    description: "Upstream unit tests (Catch2 single-header)"
    command: "cmake --build build && ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: NAMEOF/NAMEOF_TYPE/NAMEOF_ENUM/NAMEOF_MEMBER/NAMEOF_FULL"
    command: "./test_nameof"

# 测试断言总数 (近似值)
assertion_count: 12
