knowledge_gained:
  - "nameof 0.10.6 is a C++17 header-only library (single include/nameof.hpp) with zero runtime dependencies."
  - "Upstream ships two self-contained doctest suites (test.cpp / test_aliases.cpp, 95 TEST_CASE + 49 SUBCASE) behind a vendored doctest.h; both are compiled and executed directly because the upstream test/CMakeLists.txt forces -Werror which OHOS clang rejects."
