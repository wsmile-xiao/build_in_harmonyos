# test_package/MANIFEST.yml
package: nameof/0.10.6
homepage: "https://github.com/neargye/nameof"

upstream_check_command: "clang++ -std=c++17 -Iinclude -Itest/3rdparty test/test.cpp -o nameof_test && ./nameof_test"
upstream_test_in_build: true
upstream_test_command: "./nameof_test && ./nameof_aliases_test"

upstream_tests:
  - file: test.cpp
    source: nameof-0.10.6/test/test.cpp
    description: >-
      Upstream doctest suite (DOCTEST_CONFIG_IMPLEMENT_WITH_MAIN). Exercises
      NAMEOF/NAMEOF_TYPE/NAMEOF_ENUM/NAMEOF_MEMBER across variables, types,
      enums, members and functions; 95 TEST_CASE + 49 SUBCASE, uses the
      vendored doctest.h (test/3rdparty). Compiled and executed inside build();
      upstream -Werror is dropped so OHOS clang can build it unmodified.
    command: "./nameof_test"
  - file: test_aliases.cpp
    source: nameof-0.10.6/test/test_aliases.cpp
    description: >-
      Upstream doctest alias suite. Validates NAMEOF_SHORT/NAMEOF_FULL and the
      *_EXPR/_RTTI variants against the same vendored doctest harness.
    command: "./nameof_aliases_test"

test_package_tests:
  - file: test.cpp
    description: >-
      Consumer-side API validation against the packaged header-only library:
      NAMEOF(variable), NAMEOF_TYPE(int/std::string), NAMEOF_ENUM(Color::*),
      NAMEOF(function) and nameof::nameof_type<double>(). Returns non-zero on
      any failed check.
    command: "./test_nameof"

assertion_count: 8
