# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: nutcracker/0.5.0
homepage: "https://github.com/twitter/twemproxy"

# Upstream test command
upstream_check_command: "make check"

# conanfile.py build() method upstream test integration
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream test programs
upstream_tests:
  - file: src/test_all.c
    source: twemproxy-0.5.0/src/test_all.c
    description: "Unit tests: request/response parsing, conf parsing, mbuf/array/string utils (967 assertions)"
    command: "./test_all"
  - file: contrib/yaml-0.2.5/tests/test-version.c
    source: twemproxy-0.5.0/contrib/yaml-0.2.5/tests/test-version.c
    description: "vendored libyaml 0.2.5 version test (recursive build)"
    command: "./test-version"
  - file: contrib/yaml-0.2.5/tests/test-reader.c
    source: twemproxy-0.5.0/contrib/yaml-0.2.5/tests/test-reader.c
    description: "vendored libyaml 0.2.5 reader test (recursive build)"
    command: "./test-reader"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_nutcracker.sh
    description: "Smoke: -V version assertion, -t minimal YAML config validation, daemon start + port probe + shutdown, fake-backend redis forward (nc available)"
    command: "bash test_nutcracker.sh"

# Approximate assertion count
# 967 (test_all) + 2 (yaml) + 4 (smoke: version/config/daemon/forward+shutdown)
assertion_count: 973
