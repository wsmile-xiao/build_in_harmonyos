# conandata.yml — nutcracker (twemproxy) 0.5.0
# source: GitHub release 资产（自带预生成 configure，CI 无需 autoreconf）
# sha256: 本地计算（FreeBSD distinfo 对应 codeload 归档另一文件，明文记录）

sources:
  url: "https://github.com/twitter/twemproxy/releases/download/0.5.0/twemproxy-0.5.0.tar.gz"
  sha256: "05036f62171192879a29be4813d70e255419ab513dfc873ee894fce4e3a90a6b"

patches:
  - patch_file: "patches/0001-config-guess-sub-ohos.patch"
    patch_description: "config.guess: recognize HarmonyOS uname output (UNAME_SYSTEM=HarmonyOS); config.sub: accept -ohos triplet mapped to -linux-gnu"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-ohos-build-fixes.patch"
    patch_description: "configure: replace Toybox mktemp -d (creates 0700 dir, HMDFS group-write fails) with mkdir; copy patched config.guess/sub into vendored yaml-0.2.5 before its recursive configure; fix vendored yaml configure mktemp likewise"
    patch_type: "portability"