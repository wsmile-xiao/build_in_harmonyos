software: nutcracker
version: 0.5.0
status: built
build_system: autotools
build_date: 2026-09-12
created_at: 2026-09-12
updated_at: 2026-09-12
knowledge_gained:
  - twemproxy 0.5.0 vendored libyaml 0.2.5（configure.ac AC_CONFIG_SUBDIRS 递归构建 contrib/yaml-0.2.5.tar.gz，静态链接），非系统 libyaml
  - config.guess(2018) 无法识别 HarmonyOS uname（UNAME_SYSTEM=HarmonyOS），需 patch 增加 *:HarmonyOS:*:* 分支
  - config.sub(2018) 缺 -ohos 三元组，需 patch 增加 -ohos* 并归一化 os=-linux-gnu
  - HMDFS 下 Toybox mktemp -d 创建 0700 目录；进程 UID≠目录 owner 时 group 无写权限，config.status 写临时文件 Permission denied；mkdir 创建目录由 HMDFS 强制 drwxrws--x（group 可写）→ configure 中 mktemp 需替换为 mkdir
  - 补丁修改 configure 后其 mtime 最新，automake am--refresh 尝试重跑 aclocal-1.16（环境无）→ 构建前 touch 统一时间戳
  - OHOS 支持 epoll：AC_TRY_RUN epoll 探针通过（HAVE_EPOLL），nutcracker 使用 epoll 异步事件后端
  - 上游 configure.ac 无 AC_CANONICAL_HOST，--host/--build=aarch64-linux-ohos 经 config.sub 归一化 linux-gnu 后 cross=no，AC_TRY_RUN native 运行
patches_applied:
  - 0001-config-guess-sub-ohos.patch
  - 0002-configure-ohos-build-fixes.patch
source_url: https://github.com/twitter/twemproxy/releases/download/0.5.0/twemproxy-0.5.0.tar.gz
configure_options:
  - "--host=aarch64-linux-ohos"
  - "--build=aarch64-linux-ohos"
  - "--prefix=/"