# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# nzbget 26.2 没有任何官方测试套件（CMake ENABLE_TESTS 选项默认关闭）。
# 因此 MANIFEST 仅记录 L1 消费者测试（test_main.c）。

package: nzbget/26.2
homepage: "https://github.com/nzbgetcom/nzbget"

# 上游测试来源声明
upstream_tests:
  framework: none
  note: "上游无单元/集成测试"

# L1 消费者测试（Conan test_package 提供）
local_tests:
  - path: test_main.c
    type: c_consumer
    description: "编译 C 消费者并执行安装的 nzbget 二进制，断言输出版本行（R34 真实二进制执行，非空壳测试）"