software: nettle-3
version: "3.10.2"
status: built
build_system: autotools
build_date: "2026-09-10"
source:
  url: "https://ftp.gnu.org/gnu/nettle/nettle-3.10.2.tar.gz"
  sha256: "fe9ff51cb1f2abb5e65a6b8c10a92da0ab5ab6eaf26e7fc2b675c45f1fb519b5"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--disable-shared"
    - "--enable-static"
    - "--with-include-path=<gmp-package>/include"
    - "--with-lib-path=<gmp-package>/lib"
  dependencies:
    - "gmp/6.3.0"
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-config.guess.patch"
  - "0002-configure.patch"
knowledge_gained:
  - "E007: config.guess 不含 HarmonyOS 分支，需补丁"
  - "E011: configure umask 077 在 hmdfs 上失败，改为 022"
  - "nettle 3.10.2 config.sub 原生含 ohos/linux-ohos 映射，无需 config.sub 补丁（4.0 需要）"
  - "nettle 3.10.x configure 仍支持 --with-include-path/--with-lib-path 传 gmp 路径（4.0 起移除，改用 CPPFLAGS/LDFLAGS）"
  - "3.x API：sha256_digest(&ctx, SHA256_DIGEST_SIZE, digest) 三参数（4.0 改 2 参数）"
test_results:
  upstream:
    command: "make check"
    result: "PASS 119/119（testsuite 116/116 + examples 3/3），失败 0，跳过 0"
  test_package:
    command: "conan test_package（ctest + 消费者二进制）"
    result: "PASS 2/2（SHA256('abc') 已知摘要、AES-128 已知密文）"
