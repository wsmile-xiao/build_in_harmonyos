# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nettle-3/3.10.2
homepage: "https://www.lysator.liu.se/~nisse/nettle/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（nettle 3.10.2 实跑结果见 notes.md）
upstream_tests:
  - file: testsuite/ (make check 全量)
    source: nettle-3.10.2/testsuite/
    description: "make check 全量：AES/DES/ChaCha/SM4/GCM/CCM/SIV、SHA1/SHA2/SHA3/MD5、HMAC、PBKDF2、Ed25519/Ed448、ECDSA、RSA、cxx、symbols 等"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：SHA256('abc') 已知摘要断言 + AES-128 块加密已知密文断言，失败非 0 退出"
    command: "./test_nettle"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 make check 实跑（2026-09-10, aarch64-unknown-linux-ohos）：testsuite 116 + examples 3 = 119 项全过
assertion_count: 119
