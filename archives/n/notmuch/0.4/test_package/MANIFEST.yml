# 上游官方测试声明文件（test_package/MANIFEST.yml）
package: notmuch/0.4
homepage: "https://notmuchmail.org"

# 上游 0.4 自带 TAP 测试框架（test/notmuch-test → basic/new/search/json/
# thread-naming/reply/dump-restore/uuencode/thread-order/author-order/
# from-guessing/long-id/encoding/emacs，共 112 个断言）。release tarball 含
# test/ 目录与 smtp-dummy 辅助程序。OHOS 无 /bin/bash、无 emacs、toybox touch
# 不支持 GNU 相对日期语法（-d '+N seconds'），故不在 conan build() 内集成完整
# TAP（见版本 manifest runnable_note：手动实测非 emacs 97/97 PASS）。
# 核心索引/搜索功能语义由 test_package C API 消费测试等价覆盖。
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test   # 需 bash>=4 + emacs + GNU coreutils，OHOS headless 不可全跑"

# 上游实际运行的测试程序（0.4 无独立 TAP 脚本文件，notmuch-test 为框架入口）
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "消费测试：C 程序链接 libnotmuch 调用 0.4 API（notmuch_database_create / get_version / add_message / query count+search），并执行包内 CLI notmuch --version"
    command: "clang test.c -I<prefix>/include -L<prefix>/lib -lnotmuch && ./test_notmuch04 && notmuch --version"

assertion_count: 4
