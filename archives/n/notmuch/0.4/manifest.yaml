# notmuch 0.4 适配清单
# 邮件索引/搜索/标签 C 库 libnotmuch.so + CLI notmuch（2010 老版本，自定义
# configure 脚本 + 手写 Makefile，非 autotools、无 configure.ac）。
# 依赖：xapian-core/1.4.26（有制品，含 xapian-config）、talloc/2.4.4（有制品，
# 制品无 .pc → 配方合成 talloc.pc）、glib/2.84.0（有制品，.pc prefix=/ 需修正）、
# zlib/1.3.1.1（有制品）；gmime 2.x remote 无制品 → 配方内自包含构建 gmime 2.6.23
# （官方 ftp.gnome.org 源，参照 0.38.3 的 gmime 3.2.7 自包含先例；0.4 只认 2.x API）。

version: "0.4"
software: notmuch
status: built

build_date: "2026-09-05"
build_system: custom

source:
  url: "https://notmuchmail.org/releases/notmuch-0.4.tar.gz"
  sha256: "a8ba23ce68b42dbef22563182c5b34dfbdb46494f94e8fb5694da993cba6ceef"
  tar_format: tar.gz
  bundled: "gmime-2.6.23.tar.xz（配方内自包含构建，官方 ftp.gnome.org 源，R39）"

build:
  system: custom
  configure_options:
    - "--prefix=<install>  (notmuch 0.4 自定义 configure 仅支持 prefix/libdir/includedir 等基础选项)"
  cc: clang
  cxx: clang++
  notes: >-
    gmime 2.6.23 自包含构建（config.status umask 077→022 E011；glib 制品 .pc
    prefix=/ 修正 pc-stage；-L/lib 注入 CFLAGS 供 -l:ld-musl-aarch64.so.1 解析）；
    notmuch configure 注入 XAPIAN_CONFIG + PKG_CONFIG_PATH(gmime+pc-stage) +
    CFLAGS/CXXFLAGS/LDFLAGS(xapian 真实路径 + -L/lib)；toybox gzip 无 --stdout
    （补丁 0001）；`install` 在 /system/bin（PATH 前置）；TMPDIR 用 build_folder/tmp。

patches_applied:
  - "patches/0001-Makefile.local.patch"
  - "patches/0002-test-notmuch-test.patch"
  - "patches/0003-test-smtp-dummy.c.patch"

test:
  upstream_cases: 112
  upstream_suite: "notmuch 0.4 自带 TAP 框架 test/notmuch-test（13 组脚本，112 断言）"
  runnable: 98
  runnable_note: >-
    手动实测（touch shim 补偿 toybox 不支持 -d '+N seconds' + LD_LIBRARY_PATH 注入
    依赖库 + TZ=UTC）：非 emacs 12 组 97 个断言全部 PASS + basic 组 1 个 broken
    expected（98 runnable）；emacs 组 14 个因 OHOS 无 emacs 二进制不可运行。
    通过组：basic(10) new(17) search(14) json(5) thread-naming(9) reply(7)
    dump-restore(4) uuencode(3) thread-order(6) author-order(7) from-guessing(10)
    long-id(4) encoding(1)。上游测试未嵌入 conan build()（依赖 bash/emacs/GNU
    coreutils），核心功能由 test_package C API 消费测试等价覆盖。
  consumer_test: >-
    test_package 链接 libnotmuch 调用 0.4 C API：create/get_version/add_message/
    query count+search + CLI notmuch --version（全部 PASSED）。

knowledge_gained:
  - "notmuch 0.4 依赖 xapian-core/1.4.26（xapian-config 输出 -I//include -L//lib，prefix=/ 损坏需 CFLAGS 注入真实路径）"
  - "gmime 2.6.x 自包含构建：glib 制品 .pc prefix=/ 修正 + config.status umask 077→022（E011）+ -L/lib（musl loader）"
  - "talloc 制品无 .pc，需配方内合成 talloc.pc 指向制品根"
  - "OHOS toybox gzip 不支持 --stdout 长选项（改 -c）；install 命令在 /system/bin 不在默认 PATH"
  - "OHOS 无 /bin/bash（bash 在 /data/service/hnp/bin）→ 上游 TAP 测试需 bash 显式调用"
  - "OHOS uname=HarmonyOS，notmuch 0.4 configure 平台检测 Unknown 无碍构建"

disabled_capabilities:
  - "gmime cryptography/smime（自包含构建禁用：OHOS 无 gpgme；notmuch 0.4 不用 gmime 加密 API）"

patch_classification:
  - file: 0001-Makefile.local.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-test-notmuch-test.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-test-smtp-dummy.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
