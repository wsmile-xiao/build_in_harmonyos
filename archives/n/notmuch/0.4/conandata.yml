# conandata.yml — notmuch 0.4
# 官方源（R39）：notmuchmail.org 发布页 + GNOME FTP 官方镜像。
# notmuch-0.4.tar.gz sha256 为本机下载后自算；sha1 与官方 notmuch-0.4.tar.gz.sha1
# (d40cb07adab0d595c64e9b73f1fd306cc9dff106) 一致。
# gmime-2.6.23 sha256 与官方 gmime-2.6.23.sha256sum 一致。

sources:
  url: "https://notmuchmail.org/releases/notmuch-0.4.tar.gz"
  sha256: "a8ba23ce68b42dbef22563182c5b34dfbdb46494f94e8fb5694da993cba6ceef"

# 自包含依赖 gmime 2.6.x（remote 无 gmime 2.x 制品，参照 0.38.3 gmime 3.2.7
# 自包含先例）。notmuch 0.4 configure 只认 gmime-2.6/gmime-2.4 pkg-config。
# gmime 2.6.23 编译期依赖 glib(≥2.32，gobject/gmodule/gthread/gio 组件) +
# zlib，均为 ohpcd 制品；cryptography/smime/mono 显式禁用（OHOS 无 gpgme，
# notmuch 0.4 不使用 gmime 加密 API）。
gmime:
  url: "https://ftp.gnome.org/pub/GNOME/sources/gmime/2.6/gmime-2.6.23.tar.xz"
  sha256: "7149686a71ca42a1390869b6074815106b061aaeaaa8f2ef8c12c191d9a79f6a"

patches:
  - patch_file: "patches/0001-Makefile.local.patch"
    patch_description: "OHOS toybox gzip 不支持 GNU 长选项 --stdout（仅 -c）→ notmuch.1.gz 生成失败。改为 POSIX gzip -c（构建必需，make all/install 都依赖 notmuch.1.gz）"
    patch_type: "portability"
  - patch_file: "patches/0002-test-notmuch-test.patch"
    patch_description: "上游 TAP 测试框架以 #!/bin/bash 直接执行测试脚本，但 OHOS 无 /bin/bash（bash 在 /data/service/hnp/bin）→ notmuch-test 改为用 PATH 中的 bash 显式运行 ./$test"
    patch_type: "portability"
  - patch_file: "patches/0003-test-smtp-dummy.c.patch"
    patch_description: "clang 将非 void 函数 main 中的裸 return; 视为错误（-Wreturn-type）→ 改 return 1（上游测试辅助程序 smtp-dummy 用）"
    patch_type: "portability"
