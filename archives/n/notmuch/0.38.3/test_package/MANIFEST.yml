package: notmuch/0.38.3
homepage: "https://notmuchmail.org"

# notmuch 邮件索引工具（C 库 + CLI），上游无独立测试套件（make test 依赖 xapian 数据库环境）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试套件（make test 依赖 xapian 数据库环境，notmuch 无自带测试入口）。
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "消费测试：用 C 程序链接 libnotmuch 并调用 API（notmuch_database_create / notmuch_database_get_version）"
    command: "clang test.c -lnotmuch && ./test_notmuch"

assertion_count: 3
