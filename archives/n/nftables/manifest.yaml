software: nftables
display: "nftables"
description: "Netfilter nftables userspace packet filtering administration tool and library"
category: network
homepage: "https://www.netfilter.org/projects/nftables/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 构建，libmnl 来自制品仓，libnftnl 官方源码在配方内私有静态编译"
    - "最小依赖配置：mini-gmp、无交互 CLI、无 Python 绑定、无手册文档"
    - "静态交付，验证 nft --version 与 nft --check 解析器自检"
  common_dependencies:
    - libmnl

versions:
  "1.1.6":
    status: built
    build_date: "2026-09-14"
