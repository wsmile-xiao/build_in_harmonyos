version: "1.1.6"
status: built
build_date: "2026-09-14"
build_system: autotools

software: nftables
description: Netfilter nftables userspace CLI and libnftables for nf_tables packet filtering
language: C
license: GPL-2.0-or-later

source:
  url: "https://www.netfilter.org/pub/nftables/nftables-1.1.6.tar.xz"
  sha256: "372931bda8556b310636a2f9020adc710f9bab66f47efe0ce90bff800ac2530c"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--with-mini-gmp"
    - "--without-cli"
    - "--disable-python"
    - "--disable-man-doc"
    - "--disable-debug"
  dependencies:
    - libmnl/1.0.5
  vendored:
    - "libnftnl/1.3.1 (official netfilter.org tarball, private build_folder prefix, static-only)"

patches_applied: []

knowledge_gained:
  - "nftables hard-requires libnftnl via PKG_CHECK_MODULES; OHOS registry lacks it, vendored 1.3.1 static build in private prefix keeps single-PR atomicity"
  - "Minimal OHOS flags follow OpenWRT precedent: mini-gmp + without-cli + disable-python/man-doc/debug"
