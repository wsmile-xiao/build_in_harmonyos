software: net-tools
display: "Linux NET-3 Network Tools"
description: "Linux 经典网络工具集（ifconfig/route/netstat/arp/rarp/hostname/nameif/iptunnel/ipmaddr/mii-tool/plipconfig/slattach）"
category: tool
homepage: "https://net-tools.sourceforge.net/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "configure.sh config.in 非交互裁剪默认值 + 3 个 portability 补丁"
    - "-D__MUSL__ 启用 musl sockaddr_storage；rindex/index 替换为 strchr/strrchr"
    - "消费者测试真机实跑核心工具（ifconfig -a/netstat -rn/route -n/hostname/arp -n）"
  common_dependencies: []

versions:
  "2.10":
    status: built
    build_date: "2026-09-03"
    conan_ref: "net-tools/2.10"
  "2.1":
    status: published
    build_date: "2026-09-26"
    conan_ref: "net-tools/2.1"
    device_verified: "2026-09-26 华为 PC 真机 conan-verify 八门禁全绿;36 断言 33 passed/3 restricted（OHOS /proc/net 权限隔离按平台受限断言）"
