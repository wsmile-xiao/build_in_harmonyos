software: net-tools
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/latest/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "latest"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（flat field for G4 verify）
build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ecki/net-tools/archive/refs/heads/master.tar.gz"

  # 源码校验和
  sha256: "c5298d4d0857bcad8efbffd3f2d3722a11f6276d7928132c75584e04fbdd66a8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CPPFLAGS+=-D_UAPI_LINUX_SOCKET_H -Drindex=strrchr"
    - "configure.sh config.in (interactive, defaults accepted)"
    - "Disabled: I18N, SELinux, IPX, ATALK, AX25, NETROM, ROSE, X25, ASH, BLUETOOTH"
    - "Disabled: HWARC, HWAX25, HWNETROM, HWROSE, HWX25, HWFR, HWTR, HWFDDI, HWHIPPI, HWASH, HWHDLCLAPB, HWIRDA, HWIB"
    - "Disabled: FW_MASQUERADE, PLIP_TOOLS, SERIAL_TOOLS"
    - "Added: typedef __kernel_sa_family_t in config.h"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS: linux/socket.h sockaddr_storage conflicts with sys/socket.h - fix with -D_UAPI_LINUX_SOCKET_H + typedef __kernel_sa_family_t"
  - "OHOS: rindex() unavailable - use -Drindex=strrchr macro"
  - "OHOS: Many legacy protocol headers missing (IPX/AX25/NETROM/ROSE/Bluetooth etc) - disable in config"
  - "net-tools uses custom configure.sh (interactive) + make, not autotools"
  - "config.h and config.make must be generated via configure.sh config.in (use yes '' | bash configure.sh config.in)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /data/storage/el2/base/cache/builds/net-tools-latest.orig
  source_work_dir: /data/storage/el2/base/cache/builds/net-tools-latest.work
  source_orig_hash: ffe1d8f669d15b27
  source_work_hash: 8e6dc2a85ba1019a
  generated_at: '2026-06-18T01:55:21'
  patches_count: 2

patch_classification:
  - file: 0001-config.h.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.make.patch
    type: auto
    platform_only: True
    guard: 'pending'
