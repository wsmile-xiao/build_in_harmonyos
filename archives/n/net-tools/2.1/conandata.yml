patches:
  - patch_file: "patches/0001-config.in.patch"
    patch_description: "config.in 默认值裁剪：禁用 OHOS musl sysroot 缺失头文件/库的协议族与硬件类型（IPX/ATALK/AX25/NETROM/ROSE/X25/ASH 协议族、ARC/AX25/ROSE/NETROM/X25/ASH/IrDA/EUI64/IB 硬件），accept 默认值即可构建"
    patch_type: "portability"
  - patch_file: "patches/0002-hostname.c.patch"
    patch_description: "index/rindex -> strchr/strrchr：OHOS musl <strings.h> 未声明 rindex()/index()"
    patch_type: "portability"
  - patch_file: "patches/0003-netstat.c.patch"
    patch_description: "rindex -> strrchr：OHOS musl 未声明 rindex()"
    patch_type: "portability"
