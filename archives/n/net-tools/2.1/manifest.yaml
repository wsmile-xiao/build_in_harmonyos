version: "2.1"
software: "net-tools"
status: published
build_date: "2026-09-26"
build_system: makefile

source:
  url:
    - "https://downloads.sourceforge.net/project/net-tools/net-tools-2.10.tar.xz"
    - "https://mirrors.ustc.edu.cn/ubuntu/pool/main/n/net-tools/net-tools_2.10.orig.tar.xz"
  sha256: "b262435a5241e89bfa51c3cabd5133753952f7a7b7b93f32e08cb9d96f580d69"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - 'yes "" | bash ./configure.sh config.in（非交互，接受裁剪后的 config.in 默认值）'
  dependencies: []
  cc: clang
  cxx: ""

patches_applied:
  - file: "patches/0001-config.in.patch"
    purpose: "config.in 默认值裁剪（协议族 IPX/ATALK/AX25/NETROM/ROSE/X25/ASH、硬件 ARC/AX25/ROSE/NETROM/X25/ASH/IrDA/EUI64/IB）适配 OHOS musl sysroot"
  - file: "patches/0002-hostname.c.patch"
    purpose: "index/rindex -> strchr/strrchr（OHOS musl 未声明 rindex()/index()）"
  - file: "patches/0003-netstat.c.patch"
    purpose: "rindex -> strrchr（OHOS musl 未声明 rindex()）"

knowledge_gained:
  - "net-tools 2.10 为裸 Makefile + configure.sh 体系（非 autotools），configure 需 yes \"\" 非交互喂默认值"
  - "OHOS musl <strings.h> 不声明 rindex()/index()，需替换为标准 strchr()/strrchr()"
  - "__MUSL__ 宏必需：OHOS musl <sys/socket.h> 仅在 __MUSL__ 下定义 sockaddr_storage，否则与 uapi 冲突"

