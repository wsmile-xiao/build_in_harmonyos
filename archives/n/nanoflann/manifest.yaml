software: nanoflann
display: "nanoflann"
description: "C++ header-only library for KD-tree / KNN search (FLANN 的轻量 C++11 头文件实现)"
category: library
homepage: "https://github.com/jlblancoc/nanoflann"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only INTERFACE target：package 仅安装 include/nanoflann.hpp + CMake config"
    - "CMake 不识别 OHOS（E092）：generate() 映射 CMAKE_SYSTEM_NAME=Linux，CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "上游测试套件依赖 GTest 且体积大，NANOFLANN_BUILD_TESTS=OFF，以 test_package 消费者 kNN 验证为准"
    - "版本自证：include/nanoflann.hpp NANOFLANN_VERSION 0x171"
  common_dependencies: []

versions:
  "1.7.1":
    status: built
    build_date: "2026-08-31"
    conan_ref: "nanoflann/1.7.1"