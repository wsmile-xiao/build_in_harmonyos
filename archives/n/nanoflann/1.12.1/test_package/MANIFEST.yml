# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nanoflann/1.12.1
homepage: "https://github.com/jlblancoc/nanoflann"

# 上游测试: examples/ + tests/ (GTest)，体积大，适配时以 test_package 消费者验证为主
upstream_check_command: "cmake --build build --target nanoflann-tests && ./build/tests/nanoflann_tests"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试核验：未移植，原因与证据详见 PR 正文；上游测试依赖 GTest，且配方关闭 examples/tests。
upstream_tests: []
upstream_test_evidence: "上游 CMakeLists.txt 含 tests/ 子目录与 nanoflann-tests 目标；配方设置 NANOFLANN_BUILD_TESTS=OFF；本包无 gtest 依赖；test_package 以独立 API 测试覆盖核心 KD-tree 查询。"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者 KD-tree kNN 最近邻搜索验证 (R34 实质依赖被测包 API)"
    command: "./test_nanoflann"
  - file: test_hmos.cpp
    description: "HarmonyOS aarch64 KD-tree kNN、radiusSearch、rknnSearch 验证"
    command: "./test_nanoflann_hmos"

# 测试断言总数 (test_package 实际断言数)
assertion_count: 2