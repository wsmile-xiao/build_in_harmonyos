# 版本级 manifest — nanoflann 1.12.1
# Bootstrap 阶段骨架（R01 bootstrap-and-adapt，尚在初始阶段）

# ============================================================
# 必须字段
# ============================================================

version: "1.12.1"
software: "nanoflann"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-31"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39: 官方 GitHub release）
  url: "https://github.com/jlblancoc/nanoflann/archive/refs/tags/1.12.1.tar.gz"

  # 官方 tag 1.12.1 解引用 commit（git ls-remote 核验）
  upstream_commit: "7812aa08260b6971af2230b1ac446d54f7939822"

  # 源码校验和（官方 tarball sha256，bootstrap 已核验）
  sha256: "f4884bc47cdf175700ba1437293d4fadff1b8db5d968550899c63f7144f9034b"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: cmake（header-only INTERFACE target）
  system: cmake

  configure_options:
  - "-DNANOFLANN_BUILD_EXAMPLES=OFF"
  - "-DNANOFLANN_BUILD_TESTS=OFF"

  # 编译依赖列表（格式: name/version）— header-only，无外部依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

test_package:
  entry: test_package/conanfile.py
  test_type: explicit
  test_cases: 1
  test_assertions: 2

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained: []
