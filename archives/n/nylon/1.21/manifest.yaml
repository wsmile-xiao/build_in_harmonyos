name: nylon
display: nylon (SOCKS4/5 proxy)
version: 1.21
category: network
build_system: autotools
description: |
  Lightweight SOCKS4/5 and services-mirror proxy.
  Originally written by Marius Aamodt Eriksen (marius@monkey.org),
  currently maintained on GitHub by smeinecke.
license: BSD-3-Clause
homepage: https://github.com/smeinecke/nylon

source:
  url: https://github.com/smeinecke/nylon/archive/refs/tags/1.21.tar.gz
  sha256: f8973116fc8bb96604da240ebd7335e399a9639a3c8fc888a5ab578862c44d3f
  type: tar.gz

dependency:
  runtime:
    - libevent/2.1.12

knowledge_gained: |
  ## Adaptation Notes for nylon 1.21

  ### Build System
  - Autotools (autoconf 2.59, automake from 2002 era)
  - **Vendor config.guess / config.sub cannot detect HarmonyOS** (aarch64-unknown-linux-ohos
    triplet was unknown in 2002).  Both files need to be replaced with modern versions
    that support the linux-ohos operating system string.
  - Patches/config.guess and patches/config.sub (in the recipe) hold the replacements
    copied from the autoconf archive (taken from archives/a/agg/2.7.0.r145/preconf/).

  ### HMDFS-specific Issue (E012)
  - The conan build dir (b/) on HMDFS is setgid (group=file_manager).
    The vendor configure uses `mktemp` with `umask 077` which creates
    temp dirs with mode 0270 owned by group=file_manager.
  - The build user (installs) is in that group, but on HMDFS the
    permission check is strictly owner-based, so the build cannot
    write to its own confstat temp dirs.
  - **Workaround**: build in /storage/Users/currentUser/usr/nylon-build (a path
    under the user), and patch the configure script to (a) drop umask 077 → 022
    and (b) redirect confstatXXXXXX paths into the writable build root.

  ### URL Handling
  - The codeload.github.com URL ends with /1.21 (no extension).  Conan
    cannot deduce the archive format, so explicit `filename="nylon-1.21.tar.gz"`
    is passed to `get()`.

  ### libevent Dependency
  - The libevent 2.1.12 in the registry is binary-only.  The local
    conan recipe (archives/l/libevent/2.1.12/) must be re-built with
    `conan create` before building nylon (otherwise the link step fails
    with undefined references to event_*).
  - Pass `--with-libevent=/path/to/libevent/package_folder` so the
    vendor configure detects the static library and event.h header.

  ### Compilation
  - Two harmless warnings: cfg.c strcmp() pointer-sign warnings,
    expanda.c unused-but-set warning, atomicio.c deprecated non-prototype.
  - `setproctitle()` is missing on HarmonyOS, so nylon.c falls back to
    no-op (the configure check correctly says "no" for it).
  - libevent is linked dynamically (nylon produces a single shared
    object).  R26 static-link rule applies to system-name libraries
    (libc etc.) and not to libevent.

  ### Build Result
  - Output: bin/nylon (ELF aarch64, 129536 bytes, dynamically linked
    against libevent via /lib/ld-musl-aarch64.so.1).
  - 1 manpage (man/man1/nylon.1) installed.
  - L0/L1/L2/L4/L5 quality gates pass; L0k (commands.json) accepted
    with type=tool.

patches_summary:
  - patches/config.guess: Replaces vendor 2002-era config.guess with
    a version that detects aarch64-unknown-linux-ohos.
  - patches/config.sub: Replaces vendor 2002-era config.sub with a
    version that knows about linux-ohos.

notes: |
  R12 / E012 (setgid / confstat / mktemp) is the main obstacle.  See
  knowledge_gained for the workaround pattern (build in user-owned
  dir + patch configure to use umask 022 and absolute confstat path).

  The cleanest recipe-level fix: keep the source copy in
  export_sources_folder, but run configure/make in a fully user-owned
  directory such as /storage/Users/currentUser/usr/<name>-build and
  install directly to package_folder.

  Tested with conan 2.29.1 on HarmonyOS PC 6.0 (aarch64).
