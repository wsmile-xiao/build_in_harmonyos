# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# nylon 1.21 没有任何上游测试套件（vendor 自 2002 年起未维护）。
# 因此 MANIFEST 仅记录 L1 消费者测试。

package: nylon/1.21
homepage: "https://github.com/smeinecke/nylon"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "Consumer sanity check: verify nylon binary is present in bindirs"
    command: "test -x '${bindirs[0]}/nylon'"
