# test_package/MANIFEST.yml — nyancat 1.5.2
# R34/R51: test_package must exercise the binary

package: nyancat/1.5.2
homepage: "https://github.com/klange/nyancat"

# R51 上游测试三步法:
# 1. 清点: 无 tests/ 目录; 顶层 Makefile 仅转发 check 到 src/Makefile;
#    src/Makefile 的 check 目标 = all + @echo "*** ALL TESTS PASSED ***"
#    (注释 "Unit tests go here. None currently."); 无 ctest/pytest 注册;
#    全源码条件编译仅 3 处 (#ifndef TIOCGWINSZ 头回退 / #ifdef ECHO undef /
#    头文件 guard), 无 win32 或平台专属测试分支
# 2. 实测: 上游 check 目标为纯 echo 桩, 零真实用例, 退出码恒 0
# 3. 结论: 上游真实可运行测试数 = 0, PR 声明 0, 不多报不少报

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check  # src/Makefile check = echo stub, 0 cases"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (0 个)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 3 条断言)
test_package_tests:
  - file: test.sh
    description: "1) 二进制可执行; 2) nyancat -h 退出码 0 + usage 标题 'Terminal Nyancat'; 3) nyancat -e -f 1 -n -s 单帧渲染退出码 0 + stdout 字节数 >= 500（帧经 ANSI 转义输出，按渲染体量断言）"
    command: "bash test.sh"

# 测试断言总数 (3: 可执行性 + usage 校验 + 单帧渲染校验)
assertion_count: 3
