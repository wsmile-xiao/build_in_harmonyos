patches:
  # 上游 ioctl(0, TIOCGWINSZ, &w) 不检查返回值（src/nyancat.c 两处：
  # SIGWINCH_handler + standalone 初始化）。fd 0 非 TTY 时（CI 沙箱、管道）
  # ioctl 失败且 w 为未初始化栈值 → terminal_width/height 为垃圾值 →
  # 渲染边界失控（本地实测：8 秒输出 417MB 或挂死不退出）。
  # 最小修复：ioctl 返回 0 才采信 w，否则保留 80x24 默认值。
  - patch_file: "patches/0001-tiocgwinsz-notty.patch"
    patch_description: "Check ioctl(TIOCGWINSZ) return value; keep 80x24 defaults when fd 0 is not a TTY"
    patch_type: "portability"
