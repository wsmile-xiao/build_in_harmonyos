# 版本级 manifest — nyancat 1.5.2
# 文件位置: archives/n/nyancat/1.5.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.5.2"
software: nyancat
status: built
build_date: "2026-09-19"
build_system: makefile

source:
  url: "https://github.com/klange/nyancat/archive/refs/tags/1.5.2.tar.gz"
  sha256: "88cdcaa9c7134503dd0364a97fa860da3381a09cb555c3aae9918360827c2032"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=clang"
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
  - "nyancat 上游是两级手写 Makefile（顶层 + src/），CC/CFLAGS/CPPFLAGS/LDFLAGS 全部用 ?= 声明，命令行直接覆盖，零补丁适配"
  - "零外部依赖：src/nyancat.c 全部 include 均为 libc（stdio/unistd/getopt/ioctl/signal/termios），上游明确拒绝链接 libm（源码 140 行注释）"
  - "telnet 模式为纯 stdio 协议解析（fd 0 上 read/write，inetd 风格），无 socket/bind/listen 调用，无网络库依赖"
  - "telnet.h 的 ECHO 宏会遮蔽 stdio 的 ECHO 标志，上游已在 include termios.h 后 #undef ECHO，OHOS 上无需修复"
  - "上游 install target 硬编码 /usr/bin 与 /usr/share/man（不支持 DESTDIR），且 OHOS PC 无 systemd，package() 采用手动 copy 二进制（netris 先例）"
  - "上游 make check 是纯 echo 桩（'Unit tests go here. None currently.'），真实可运行测试数 = 0，无任何 win32/条件编译测试分支"
  - "本地 arm64 musl 实测：conan create 全流程通过，nyancat -e -f 1 无 TTY 管道运行 exit 0 并输出帧字符"

conan_adaptation:
  recipe: conanfile.py
  test_package: test_package/
  package_type: application
  commands_json: true

tests:
  upstream_tests: 0
  upstream_passed: 0
  upstream_test_in_build: false
  note: "上游无测试套件：src/Makefile 的 check 目标仅 echo '*** ALL TESTS PASSED ***'（零用例）；全源码条件编译仅 TIOCGWINSZ/ECHO/头文件 guard 3 处，无平台专属测试分支。test_package 补 3 条冒烟断言（-h 退出码 0 + usage 串 + 单帧渲染输出）"
