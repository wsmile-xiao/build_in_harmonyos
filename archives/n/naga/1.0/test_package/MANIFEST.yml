# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: naga/1.0
homepage: "https://github.com/anayjoshi/naga"

# 上游测试命令 (上游无测试套件，故为空)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无官方测试（upstream_tests 为空）；审计结论见下方两字段
upstream_tests: []
upstream_tests_exist: false
upstream_test_audit: "审计方法：下载上游 commit 924af37 官方 GitHub 归档并列出内容。证据：(1) Makefile 仅有 clean/uninstall/install 目标，无 check/test 目标；(2) Makefile 引用的 TEST_SOURCES=src/tests/run_tests.c 在源码包中不存在（src/ 下仅 14 个 .c/.h 文件，无 tests/ 目录）；(3) SConstruct 仅定义构建与安装，无测试定义。故上游确无可执行的官方测试套件。"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_naga.c
    description: "游戏逻辑 API 测试：init_naga/update_head（移动与穿墙）/eat_food/detect_collision/process_keypress，共 12 个断言"
    command: "./test_naga"
  - file: conanfile.py
    description: "二进制产物验证：bin/naga 存在且为 aarch64 ELF 可执行文件（magic + e_machine 字节级校验）"
    command: "python ELF 头校验（magic + e_machine）"

# 测试断言总数 (test_naga.c 内 CHECK 计数)
assertion_count: 12
