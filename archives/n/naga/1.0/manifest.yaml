knowledge_gained:
  - "上游 Makefile 硬编码 CC=gcc 且 install 直接 mv 到 /usr/local/bin，不调用上游 Makefile，改用 Conan clang 直接编译 7 个翻译单元（nudoku 先例）"
  - "ncurses 经 ncurses/6.6 Conan 依赖提供（静态宽字符库，真机无系统 -lncurses）；上游 curses_wrapper.c 直接 include <curses.h>，依赖头文件即满足，无需改源码"
  - "游戏逻辑（engine/naga/utils/keypress）无 curses 依赖，打包为 libnaga.a 供 test_package 做 12 个 API 断言（nudoku 先例）"
