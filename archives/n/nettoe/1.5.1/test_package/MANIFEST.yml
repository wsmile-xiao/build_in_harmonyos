# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: nettoe/1.5.1
homepage: "http://nettoe.sourceforge.net"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/terminfo.c
    source: nettoe-1.5.1/test/terminfo.c
    description: "Terminfo database availability check"
    command: "./test/terminfo"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/example.c
    description: "编译 example.c 并执行 nettoe --version，验证输出包含 netToe 1.5.1"
    command: "example_test <nettoe_bin>"
  - file: conanfile.py
    description: "test_package build() 编译 src/example.c，test() 运行测试二进制"
    command: "conan test"

# 测试断言总数
assertion_count: 2