# 编译中学到的知识
knowledge_gained:
- "nettoe 1.5.1 使用 Autotools 构建，源码为官方 GitHub 仓库 RobertBerger/nettoe，上游无 tag/release，使用 master 快照（R39 官方源）"
- "ncurses 通过 Conan 依赖注入，configure 需要 -lncurses/-ltinfo，而 Conan ncurses 包只提供 libncursesw.a，需在 build_folder 私有 prefix 中创建 libncurses.a/libtinfo.a 副本（R49/R26）"
- "依赖注入必须使用 build_folder 私有 prefix 模式（R49/E524）：CPPFLAGS/LDFLAGS 指向 build_folder/prefix，禁止注入共享 /usr/local"
- "ncurses 为系统同名库，必须静态链接（R26），--enable-static --disable-shared"
- "test_package 测试通过编译 example.c 并执行 nettoe --version 验证二进制可运行（R34 实质测试）"

