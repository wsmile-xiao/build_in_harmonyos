software: nettoe
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/nettoe/nettoe/1.5.1/nettoe-1.5.1.tar.gz"

  # 源码校验和
  sha256: "dbc2c08e7e0f7e60236954ee19a165a350ab3e0bcbbe085ecd687f39253881cb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # nettoe 仅依赖系统 ncurses 静态库，无外部 Conan 依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0003-configure.patch"
  - "0004-src-game.h.patch"
  - "0005-src-nettoe.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess (2012) 不识别 HarmonyOS，需更新至 2023 版本 (automake 1.17)"
  - "HarmonyOS umask 077 创建的目录无法写入文件 (HMDFS/MAC 限制)，autotools 需改为 umask 022"
  - "C 头文件中全局变量定义 (非 extern) 被多个 .c 文件包含会导致 ld.lld duplicate symbol 错误"
  - "ncurses 在本平台仅有静态库 (libncurses.a)，自动满足 R26 终端工具静态链接要求"

patch_generation:
