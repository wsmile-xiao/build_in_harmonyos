# conandata.yml — nettoe 1.5.1
# Source: RobertBerger/nettoe on GitHub
#
# 源码 URL 说明（R39，备查）
# 1. 上游仓库 RobertBerger/nettoe 经 GitHub API 查询确认：没有任何 version
#    tag（tags 列表为空）、没有任何 release。
# 2. 版本 1.5.1 是 configure.ac 中声明的软件版本，但上游以 master 分支维护
#    源码，从未打 tag。因此使用官方 master 快照 tar.gz（官方源）。
# 3. sha256 已实测验证（与 GitHub 下载一致）。
# 4. 注意：本注释不得包含裸 https:// URL（predl 预下载脚本按行解析 URL，
#    注释中的 URL 会污染 sources.url 的改写，见 CI #XXXXX 教训）。
sources:
  url: "https://github.com/RobertBerger/nettoe/archive/refs/heads/master.tar.gz"
  sha256: "a0f0089b59e8a7b1cc825557fcb31308ccf58bac450e156297334230707d1838"

# 补丁由 refresh-patch --auto 生成（基于探索阶段 work 目录的真实源码修改），
# Git 风格 a/xxx b/xxx，conan patch 需 strip=1 剥离 a/ 前缀。
patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: "Teach build-aux/config.guess to recognize HarmonyOS (aarch64-unknown-linux-ohos)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-build-aux-config.sub.patch"
    patch_description: "Teach build-aux/config.sub to accept linux-ohos* OS triplet (3-part fix: maybe_os, os whitelist, -linux-ohos*)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: change umask 077 → 022 for HMDFS temp dir permission compatibility"
    patch_type: "portability"
    strip: 1