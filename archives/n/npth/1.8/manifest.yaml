software: npth
version: 1.8
status: partial
build_system: autotools
homepage: https://gnupg.org/
license: LGPL-2.1-or-later
source_url: https://gnupg.org/ftp/gcrypt/npth/npth-1.8.tar.bz2
source_format: tar.bz2

# 构建参数
configure_options:
  - "--prefix=/storage/Users/currentUser/tmp/test-install-npth-1.8"

# 补丁信息
patches_applied:
  - name: 0001-config.guess-harmonyos.patch
    description: "添加 HarmonyOS 系统识别支持"
    category: platform_detection
    kb_ref: E007, E072
  - name: 0002-config.sub-harmonyos.patch
    description: "添加 ohos-linux 三元组和内核组合验证"
    category: platform_detection
    kb_ref: E007, E072
  - name: 0003-configure-ac-musl-compat.patch
    description: "musl libc pthread_cancel 兼容性修复（使用 pthread_create 检查）"
    category: musl_compat
    kb_ref: PSCAN-MUSL-001

# 构建环境
build_env:
  host: aarch64-unknown-linux-ohos
  cc: clang
  cc_version: "15.0.4"
  libc: musl
  thread_model: pthread

# 编译时间
build_timestamp: 2026-04-20T15:24+0800

# 测试结果
test_result:
  total_tests: 4
  passed_tests: 4
  failed_tests: 0
  test_cases_count: 30+
  test_coverage:
    - "互斥锁初始化/锁定/解锁"
    - "线程创建/join/detach"
    - "线程命名 (pthread_setname_np)"
    - "条件变量初始化/等待/信号/广播"
    - "fork后npth_init"
    - "多线程互斥锁协作"
  test_report: reports/test-report.md

# 生成产物
artifacts:
  libraries:
    - name: libnpth.so.0.3.0
      size: "310KB"
      type: shared_library
    - name: libnpth.so.0
      type: symlink
      target: libnpth.so.0.3.0
    - name: libnpth.so
      type: symlink
      target: libnpth.so.0
  headers:
    - name: npth.h
      location: include/

# 遇到的问题和解决方案
known_issues:
  - id: HMDFS-TMPDIR-001
    description: "HMDFS 不允许 config.status 创建临时子目录"
    severity: critical
    solution: "手动生成配置文件，绕过 config.status"
    status: partial
  - id: MUSL-PTHREAD_CANCEL-001
    description: "musl libc 不支持 pthread_cancel"
    severity: critical
    solution: "修改 configure.ac 使用 pthread_create 检查"
    kb_ref: PSCAN-MUSL-001
    status: partial

# 知识库贡献
knowledge_gained:
  - topic: autotools-musl-compat
    pattern: "autotools 项目在 musl 上检查 pthread_cancel 会失败"
    solution: "使用 pthread_create 或 pthread_detach 替代"
    applicability: "所有 autotools 项目"
  - topic: hmdfs-tempdir-restriction
    pattern: "HMDFS 不允许创建临时子目录 ./confXXXXXX"
    solution: "手动生成配置文件或使用 $TMPDIR"
    applicability: "所有在 HMDFS 上构建的项目"

# 构建质量评估
build_cleanliness:
  parameter_minimal: true
  no_manual_compilation: true
  no_manual_file_ops: true
  platform_guards_used: true
  notes: "因 HMDFS 限制手动生成配置文件，但修改逻辑清晰可复现"

# 依赖信息
dependencies:
  required:
    - name: pthread
      provided_by: musl-libc
      available: true