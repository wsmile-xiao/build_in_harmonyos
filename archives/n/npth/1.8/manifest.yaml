software: npth
version: 1.8
status: built
build_system: autotools
homepage: https://gnupg.org/software/npth/
license: LGPL-2.1-or-later
source_url: https://gnupg.org/ftp/gcrypt/npth/npth-1.8.tar.bz2
source_format: tar.bz2

# Build parameters
configure_options:
  - "--prefix=${prefix}"

# Patch information
patches_applied:
  - name: 0001-build-aux-config.guess.patch
    description: "Add HarmonyOS system detection to config.guess"
    category: platform_detection
    kb_ref: E007, E072
  - name: 0002-build-aux-config.sub.patch
    description: "Add ohos-linux triplet support to config.sub"
    category: platform_detection
    kb_ref: E007, E072
  - name: 0003-configure.patch
    description: "Replace pthread_cancel with pthread_create for musl compat; use TMPDIR for config.status temp dir"
    category: musl_compat
    kb_ref: PSCAN-MUSL-001

# Build environment
build_env:
  host: aarch64-unknown-linux-ohos
  cc: clang
  cc_version: "15.0.4"
  libc: musl
  thread_model: pthread

# Build timestamp
build_date: "2026-08-21"
build_timestamp: 2026-08-21T15:10+0800

# Test results
test_result:
  total_tests: 4
  passed_tests: 4
  failed_tests: 0
  test_cases_count: 30+
  test_coverage:
    - "Mutex init/lock/unlock"
    - "Thread create/join/detach"
    - "Thread naming (pthread_setname_np)"
    - "Condition variable init/wait/signal/broadcast"
    - "fork + npth_init"
    - "Multi-thread mutex cooperation"
  test_report: reports/test-report.md

# Artifacts
artifacts:
  libraries:
    - name: libnpth.so.0.3.0
      type: shared_library
    - name: libnpth.a
      type: static_library
  headers:
    - name: npth.h
      location: include/

# Dependencies
dependencies:
  required: []

# Conan recipe
conan_recipe:
  status: built
  conanfile: conanfile.py
  conandata: conandata.yml
  test_package: test_package/

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/npth-1.8.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/npth-1.8.work
  source_orig_hash: 5ce382309913f1ab
  source_work_hash: 01cfa9b174c27e64
  generated_at: '2026-08-21T15:11:40'
  patches_count: 3

patch_classification:
  - file: 0001-build-aux-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-build-aux-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
