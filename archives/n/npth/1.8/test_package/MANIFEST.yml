# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: npth/1.8
homepage: "https://gnupg.org/software/npth/"

# Upstream test command
upstream_check_command: "make check"

# Upstream tests are not integrated into conan build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (from tests/ directory)
upstream_tests:
  - file: tests/t-mutex.c
    source: npth-1.8/tests/t-mutex.c
    description: "Mutex lock/unlock functionality"
    command: "./t-mutex"
  - file: tests/t-thread.c
    source: npth-1.8/tests/t-thread.c
    description: "Thread create/join/detach"
    command: "./t-thread"
  - file: tests/t-cond.c
    source: npth-1.8/tests/t-cond.c
    description: "Condition variable wait/signal/broadcast"
    command: "./t-cond"
  - file: tests/t-fork.c
    source: npth-1.8/tests/t-fork.c
    description: "npth_init after fork"
    command: "./t-fork"

# Consumer test in test_package
test_package_tests:
  - file: test.c
    description: "Consumer test: npth_init + npth_create + npth_join"
    command: "./test_npth"

# Approximate assertion count
assertion_count: 5
