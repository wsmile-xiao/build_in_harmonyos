software: npth
display: "npth"
description: "GNU Portable Threads library — lightweight threading based on pthread"
category: system
homepage: "https://gnupg.org/software/npth/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "musl libc 不支持 pthread_cancel，需修改 configure.ac 使用 pthread_create 检查"
    - "HMDFS 不允许 config.status 创建临时子目录，需手动生成配置文件"
    - "需要 autoreconf -fi 重新生成 configure（configure.ac 补丁后必须）"
  common_dependencies:
    - libgpg-error
    - libgcrypt

versions:
  "1.8":
    status: published
    build_date: "2026-04-20"
