software: npth
display: "npth"
description: "GNU Portable Threads library — lightweight threading based on pthread"
category: system
homepage: "https://gnupg.org/software/npth/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "musl libc 不支持 pthread_cancel，patch configure 使用 pthread_create 替代检查"
    - "HMDFS 不允许 config.status 在当前目录创建临时子目录，patch configure 使用 TMPDIR"
    - "config.guess/config.sub 需添加 HarmonyOS 系统识别"
  common_dependencies: []

versions:
  "1.8":
    status: built
    build_date: "2026-08-21"
    conan_recipe: true
