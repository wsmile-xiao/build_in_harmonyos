# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: npth/1.8.1
homepage: "https://gnupg.org/software/npth/"

# Upstream test command: executed by build() inside the recipe (R51)
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# Upstream test programs (from tests/ directory)
upstream_tests:
  - file: tests/t-mutex.c
    source: npth-1.8/tests/t-mutex.c
    description: "Mutex lock/unlock functionality"
    command: "./t-mutex"
  - file: tests/t-thread.c
    source: npth-1.8/tests/t-thread.c
    description: "Thread create/join/detach"
    command: "./t-thread"
  - file: tests/t-cond.c
    source: npth-1.8/tests/t-cond.c
    description: "Condition variable wait/signal/broadcast"
    command: "./t-cond"
  - file: tests/t-fork.c
    source: npth-1.8/tests/t-fork.c
    description: "npth_init after fork"
    command: "./t-fork"

# Measured result of `make check` on OHOS armv8 (aarch64-unknown-linux-ohos)
upstream_test_results:
  total: 4
  passed: 4
  failed: 0
  log: "reports/conan-create.log (PASS: t-mutex t-thread t-cond t-fork / All 4 tests passed)"

# Consumer test in test_package
test_package_tests:
  - file: test.c
    description: "Consumer test: npth_init + npth_create + npth_join"
    command: "./test_npth"
  - file: test_npth_ohos.c
    description: "鸿蒙特有测试: OHOS/musl 平台宏前提 (__OHOS__/无 __GLIBC__), musl 缺失 pthread_tryjoin_np (npth 内部 join 路径), npth 线程在 OHOS 上真实调度 (create+setname+usleep+join 回归 0003 补丁成果), 版本 API (npth_get_version), 线程属性 detach 往返, 线程局部存储 TLS, 互斥锁 lock/unlock, 多线程并发调度"
    command: "./test_npth_ohos"

# Approximate assertion count
assertion_count: 28
