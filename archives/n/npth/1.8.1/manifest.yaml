knowledge_gained:
  - "musl libc has no pthread_cancel; configure.ac must probe pthread_create on *-*-linux-ohos* or the pthread check fails."
  - "Directories created with `umask 077` on the shared HMDFS volume are unwritable, so config.status must place its temp dir on device-local storage (E114)."
  - "Patch generated scripts through configure.ac plus autoconf, so the platform logic only applies to the target host."
