sources:
  # 官方源 + 权威镜像。CI worker 无法访问 gnupg.org 且 CI 的镜像白名单不含
  # 该域名（白名单见 ci/conan/build_and_test.sh get_mirrors），因此在此显式
  # 给出权威镜像；三个 URL 的 tar.bz2 内容相同（sha256 已逐一核对）。
  url:
    - "https://gnupg.org/ftp/gcrypt/npth/npth-1.8.tar.bz2"
    - "https://mirrors.dotsrc.org/gcrypt/npth/npth-1.8.tar.bz2"
    - "https://www.mirrorservice.org/sites/ftp.gnupg.org/gcrypt/npth/npth-1.8.tar.bz2"
  sha256: "8bd24b4f23a3065d6e5b26e98aba9ce783ea4fd781069c1b35d149694e90ca3e"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: "0001 build aux config.guess harmonyos"
    patch_type: "portability"
  - patch_file: "patches/0002-build-aux-config.sub.patch"
    patch_description: "0002 build aux config.sub harmonyos"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-ac-musl-pthread.patch"
    patch_description: "0003 configure ac musl pthread harmonyos"
    patch_type: "portability"
