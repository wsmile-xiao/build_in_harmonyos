# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 ctest -N 查看测试列表
#   3. 把实际运行的测试记录到下方

package: netcode/1.4.3
homepage: "https://github.com/mas-bandwidth/netcode"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -V --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest -V --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: test.cpp
    source: netcode-1.4.3/test.cpp
    description: "上游测试驱动: 编译 netcode.c (NETCODE_ENABLE_TESTS) 并运行 netcode_test()"
    command: "ctest -V --output-on-failure"
  - file: netcode.c
    source: netcode-1.4.3/netcode.c
    description: "46 个 RUN_TEST 用例: 加解密向量、包编解码、加密管理、重放保护、client/server 建联与错误路径"
    command: "./bin/test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 版本宏、地址解析/格式化/比较、默认配置、connect token 生成与越界拒绝 (4 个 TAP 用例, 17 断言)"
    command: "./test_netcode"

# 测试断言总数 (test.c 中 CHECK 计数: 4 + 9 + 2 + 2, 用于质量评估)
assertion_count: 17
