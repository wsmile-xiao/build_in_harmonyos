# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ncompress/5.0
homepage: "https://github.com/vapier/ncompress"

# 上游测试命令 (make check 即运行 tests/runtests.sh)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "bash tests/runtests.sh (env: COMPRESS=<build>/compress)"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/runtests.sh
    source: ncompress-5.0/tests/runtests.sh
    description: "compress/uncompress/zcat 全功能 CLI 测试：-V/-h/未知参数退出码、-- 处理、-c stdin/stdout、-d 解压、-f 强制、-k 保留、-r 目录递归与续传、空文件/空目录、错误路径"
    command: "./tests/runtests.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ncompress.sh
    description: "打包产物冒烟：compress -V 版本横幅、-c 压缩 / -d -c 解压往返一致性、uncompress 别名还原（仅用 POSIX sh + compress）"
    command: "bash test_ncompress.sh <pkg_bin>"

# 测试断言总数 (近似值, 用于质量评估; 对应 runtests.sh 内各校验步骤)
assertion_count: 30
