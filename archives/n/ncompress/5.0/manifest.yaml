software: ncompress
version: "5.0"
build_system: makefile
status: built
build_date: "2026-09-07"

source:
  url: "https://github.com/vapier/ncompress/archive/refs/tags/v5.0.tar.gz"
  sha256: "96ec931d06ab827fccad377839bfb91955274568392ddecf809e443443aead46"
  tar_format: tar.gz

build:
  system: makefile
  cc: clang

patches_applied: []

knowledge_gained:
  - "ncompress 为单文件 C 工具（compress.c），无 configure/autotools，无编译期依赖"
  - "编译直接沿用上游 Makefile.def 选项：-DUSERMEM=800000，另加 GNUmakefile 生成 Makefile 时注入的 -DUTIME_H -DLSTAT"
  - "产物 compress 按 argv[0] 区分 compress/uncompress/zcat 模式，打包为同名副本即可（上游用硬链接，等价）"
  - "上游测试 = make check → tests/runtests.sh，需以 bash/可用 sh 运行并设 COMPRESS 指向产物；脚本依赖 readlink/realpath/python 取绝对路径"
  - "源码默认无 -DBYTEORDER，走可移植的移位位流路径，aarch64 小端无需特殊定义"
  - "K&R 风格旧式函数定义仅为警告；clang 默认 gnu17 下编译干净，无需 -Werror"
