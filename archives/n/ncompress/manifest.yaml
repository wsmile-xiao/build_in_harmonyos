software: ncompress
display: "ncompress"
description: "经典 Unix LZW 文件压缩工具（compress/uncompress/zcat），快速简单"
category: compress
homepage: "https://github.com/vapier/ncompress"
license: Unlicense
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C 工具，无 configure/autotools、无编译依赖，直接 clang 编译 compress.c"
    - "编译选项沿用上游 Makefile.def：-DUSERMEM=800000，另加 -DUTIME_H -DLSTAT"
    - "uncompress/zcat 别名由 argv[0] 判定，以同名副本打包（等价上游硬链接）"
    - "上游测试 tests/runtests.sh（make check）在 build() 中运行"
    - "默认无 -DBYTEORDER，走可移植位流路径，aarch64 小端无需处理"
  common_dependencies: []

versions:
  "5.0":
    status: built
    build_date: "2026-09-07"
