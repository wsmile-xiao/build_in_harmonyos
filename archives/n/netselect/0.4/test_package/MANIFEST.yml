# test_package/MANIFEST.yml
# 上游官方测试声明文件
# netselect 0.4 上游无自动测试（无 tests/ 目录、无 make test/check 目标、
# 无 ctest/pytest 注册）。上游仅有手工验证方式：以 root 运行
# `./netselect -vv host...` 观察 ICMP/UDP 探测统计（README）。
# 本包 build() 不集成上游测试（不存在可自动化的上游测试），
# test_package 以确定性参数校验路径（usage/argv 验证，位于 socket 使用之前）
# 作为消费者级替代验证。

package: netselect/0.4
homepage: "https://github.com/apenwarr/netselect"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -n check"   # 上游无 check 目标 -> 无自动测试

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — usage 输出与 -t/-m/未知选项参数校验（5 项断言，无网络无 root）"
    command: "bash test.sh"

# 上游测试断言总数
assertion_count: 0
