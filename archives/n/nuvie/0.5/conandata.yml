# conandata.yml — nuvie 0.5
# Nuvie：Ultima 6 / Martian Dreams / Savage Empire 的开源引擎，
# SDL 1.2 渲染 + 内嵌 Lua 脚本 + 自带 adplug/mixer 解码器（外部依赖只有 SDL 1.2）。
# 官方 tarball 自带 configure / Makefile.in / config.h.in（无需 autoreconf）。

sources:
  url: "https://downloads.sourceforge.net/project/nuvie/Nuvie/0.5/nuvie-0.5.tgz"
  sha256: "ff026f6d569d006d9fe954f44fdf0c2276dbf129b0fc5c0d4ef8dce01f0fc257"

patches:
  # HMDFS 下 configure 用 umask 077 建临时目录不可写（configure:5654 / 5659），
  # 表现为 configure 打印成功但 Makefile 从未生成 / subs-1.sed: Permission denied。
  # 同仓库先例：archives/s/sdl_image/1.2.12、archives/b/ballandpaddle/0.8.1，
  # 知识库条目 E011。
  - patch_file: "patches/0001-configure-umask.patch"
    patch_description: "configure 用 umask 022 建临时目录，规避 HMDFS 0700 目录不可写"
    patch_type: "portability"

  # nuvieDefs.h:52 `#define clamp(v, c1, c2) ...` 与 libc++ 的 std::clamp
  # （<algorithm>，四参重载）冲突：函数式宏会把该声明整个吃掉，预处理器报
  # "too many arguments provided to function-like macro invocation"。
  # 改为在 C++ 下声明同名函数、C 下保留宏。全部调用点传的都是整型
  # （int / sint8 / uint8），语义不变。
  - patch_file: "patches/0002-nuvieDefs-clamp-avoid-macro.patch"
    patch_description: "C++ 下把 clamp 从函数式宏改为同名函数，避免与 libc++ <algorithm> 的 std::clamp 冲突"
    patch_type: "portability"
