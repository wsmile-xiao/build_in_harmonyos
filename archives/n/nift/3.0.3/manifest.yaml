# 版本级 manifest — nift 3.0.3

version: "3.0.3"
software: nift
status: built
build_date: "2026-09-04"
build_system: makefile

source:
  url: "https://github.com/nifty-site-manager/nsm/archive/refs/tags/v3.0.3.tar.gz"
  sha256: "4900247b92e0ae0d124391ec710a38b322ae83170e2c39191f8ad497090ffd24"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "LUA_VERSION=5.3"
    - "CC=$(tools.build:compiler_executables.c)"
    - "CXX=$(tools.build:compiler_executables.cpp)"
  dependencies: []
  cc: clang
  cxx: clang++
  notes: >-
    nift 为纯 Makefile 项目，无 configure 脚本。内嵌 Lua-5.3/LuaJIT/exprtk/
    rapidjson/hashtk，自包含、无外部 conan 依赖。顶层 Makefile BUNDLED 分支
    默认编译内嵌 LuaJIT；配方显式传 LUA_VERSION=5.3 走内嵌 Lua-5.3 的 generic
    目标（本环境 uname=HarmonyOS → *nix 分支），规避 LuaJIT 额外适配成本。
    Lua-5.3/src 子 Makefile 硬编码 CC=gcc，需把 CC/CXX 放最外层 make 命令行
    （经 MAKEFLAGS 传播到子 make）覆盖。上游 install = chmod 755 + mv 到
    ${DESTDIR}${PREFIX}/bin；配方 package() 直接 copy nsm/nift 到包内 bin/
    （HMDFS 对部分 inode 拒绝 chmod，E046）。环境覆盖：NIFT_OPT/NIFT_JOBS
    可分别调整优化级别（默认沿用上游 -O3）与并行度。

patches_applied: []

knowledge_gained:
  - "纯 Makefile 项目顶层 BUNDLED 分支默认可能是 LuaJIT 等复杂子构建，可通过显式变量（如 LUA_VERSION=5.3）切到更简单的内嵌 Lua-5.3 generic 路径"
  - "Makefile 内嵌 Lua 子构建的 CC 默认 gcc，需把 CC/CXX 放 make 命令行（经 MAKEFLAGS 传播到子 make）覆盖"
  - "上游 install 依赖 chmod，HMDFS（E046）上会失败；package() 用 copy 到 bin/ 等价替代可避免对 chmod 的依赖"
