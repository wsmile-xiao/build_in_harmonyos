# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nift/3.0.3
homepage: "https://github.com/nifty-site-manager/nsm"

# 上游测试命令（nift 为纯 Makefile 项目，官方 tag v3.0.3 无 check/test 目标）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（官方 tag v3.0.3 无 tests/ 目录、无 test 目标）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_nift.sh
    description: "nift/nsm 消费者功能测试（11 项断言，真实执行打包二进制）：nift/nsm --version；init-html 构建最小静态站 + 静态资源镜像；track+自定义模板+build 站点生成 E2E（模板选中 / $[title] 替换 / @content 注入 / 多页面）；增量构建(hash 模式)；内嵌 Lua 引擎 nift run；nift init 通用项目构建"
    command: "bash test_nift.sh"

# 测试断言总数
assertion_count: 11
