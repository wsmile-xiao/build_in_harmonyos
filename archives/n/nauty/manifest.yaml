# 软件级 manifest — nauty
# 遵循 ARCHIVE-SPEC v2.0

software: nauty
display: "nauty & Traces"
description: "图同构与图生成工具集 — geng/genbg 枚举图、labelg 规范标号、shortg 去重等 50 余个命令"
category: math
homepage: "https://pallini.di.uniroma1.it/"
license: Apache-2.0
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "**上游站点 `pallini.di.uniroma1.it` 的 TLS 证书已过期**，mac 与设备两侧都下不动 （CERTIFICATE_VERIFY_FAILED）→ 改用作者本人在 ANU 的镜像，sha256 与 sage 的 checksums.ini 逐位一致，是同一份文件"
    - "Makefile **不支持 VPATH**（异地构建产物找不到源）→ `self.folders.build = self.folders.source` 改成源码内构建"

# ============================================================
# 版本索引
# ============================================================

versions:
  - version: "2.9.3"
    status: built
    build_date: "2026-08-17"
    notes: "首个鸿蒙 PC conan 配方；真机 conan create + test_package 断言全过"
