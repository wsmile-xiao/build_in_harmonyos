# 本 conan 配方**不需要补丁**。同目录下的 patches/0001-config.guess.patch 与
# 0002-config.sub.patch 属于**先前那次非 conan 的 prefix 式归档**（见 notes.md 的前半段），
# 它们做的事是让 config.guess/config.sub 认得 OHOS 三元组；
# 而本配方在 configure 时**显式给了** `--build=aarch64-unknown-linux-musl
# --host=aarch64-unknown-linux-musl`，config.guess 那条猜测路径根本不会走到，
# 所以两份补丁在 conan 路径下是多余的（真机 conan create 全过为证）。
# 保留它们是为了不删掉旧归档的历史，不是漏声明。
patches: {}
