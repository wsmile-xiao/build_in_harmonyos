package: nbytes/0.1.4
homepage: "https://github.com/nodejs/nbytes"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: tests/basic.cpp
    source: nbytes-0.1.4/tests/basic.cpp
    description: "Upstream gtest: SwapBytes16 byte-pair swap"
    command: "ctest --output-on-failure (basic.swap_bytes16)"
  - file: tests/basic.cpp
    source: nbytes-0.1.4/tests/basic.cpp
    description: "Upstream gtest: SwapBytes32 word swap"
    command: "ctest --output-on-failure (basic.swap_bytes32)"
  - file: tests/basic.cpp
    source: nbytes-0.1.4/tests/basic.cpp
    description: "Upstream gtest: SwapBytes64 full-word swap"
    command: "ctest --output-on-failure (basic.swap_bytes64)"

test_package_tests:
  - file: test.cpp
    description: "Consumer: SwapBytes16/32/64 values plus misaligned-size rejection"
    command: "./test_nbytes"
    case_count: 4
    assertion_count: 8
  - file: test.cpp
    description: "Consumer: HexEncode buffer and string overloads"
    command: "./test_nbytes"
    case_count: 1
    assertion_count: 3
  - file: test.cpp
    description: "Consumer: Base64Decode SGVsbG8= to Hello"
    command: "./test_nbytes"
    case_count: 1
    assertion_count: 2
  - file: test.cpp
    description: "Consumer: SearchString hit/miss plus RoundUp helper"
    command: "./test_nbytes"
    case_count: 1
    assertion_count: 3
  - file: test.cpp
    description: "Consumer: ForceAscii high-bit strip plus version macros"
    command: "./test_nbytes"
    case_count: 1
    assertion_count: 2

assertion_count: 18
