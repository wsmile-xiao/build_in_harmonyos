software: netcdf-fortran
display: "netCDF-Fortran"
description: "netCDF 的 Fortran（F77/F90/F2003）接口库"
category: data
homepage: "https://github.com/Unidata/netcdf-fortran"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "设备与 OHOS NDK 都不带 Fortran 编译器，必须 tool_requires flang-ohos/20.1.0（.mod 是编译器私有接口，需 full_mode 绑定）"
    - "flang 需配合 --sysroot、-resource-dir 与 -L <sdk>/llvm/lib/aarch64-linux-ohos（libunwind.a 只在该目录）才能完成链接"
    - "cmake.install() 的 RPATH 改写会令 hnp 内置 .codesign 失效，安装后必须重新签名，否则 loader 拒绝加载"
    - "binary-sign-tool/llvm-objcopy 需干净的 LD_LIBRARY_PATH（构建期注入的依赖 libdir 会遮蔽其 libc++）"
    - "上游用旧式变量接口（netCDF_LIBRARIES=库文件路径）做 CHECK_LIBRARY_EXISTS 特性探测，不能传 imported target 名"
  common_dependencies:
    - netcdf
    - hdf5

versions:
  "4.6.4":
    packaging: conan
    status: built
    build_date: "2026-09-11"
    notes: >-
      首次适配，无源码补丁：51 项上游 CTest 在 OHOS 上原样全部通过（配方 build() 内 cmake.test() 真实执行）。
      适配集中在配方侧：flang-ohos 提供 Fortran 编译器并充当链接驱动；逐个绕开上游 CMakeLists 的
      依赖发现方式（netcdf-c 走绝对库文件路径、hdf5 走 HDF5_ROOT + FindHDF5 模块，不生成 CMakeDeps）；
      安装后重新签名以修复 RPATH 改写导致的 .codesign 失效。
      test_package 用 Fortran 2003 消费者跑通「建 netCDF-4 文件→写属性→开 deflate→写数据→只读重开→逐项回读校验」27/27。
