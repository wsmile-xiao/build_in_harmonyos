software: netcdf-fortran
version: "4.6.4"
status: built
build_date: "2026-09-11"
conan_ref: "netcdf-fortran/4.6.4"
platform_compatibility: "HarmonyOS PC aarch64：上游 51 项 CTest 全通过 + Conan test_package Fortran 消费者通过"

source:
  url: "https://github.com/Unidata/netcdf-fortran/archive/refs/tags/v4.6.4.tar.gz"
  sha256: "fc8df99e78cd2aa5ea7b312bce5307b1bea73a118d4860b3b4358971ec376c54"
  tar_format: tar.gz

build:
  system: cmake
  shared: true
  fortran: true
  configure_options:
    - "BUILD_SHARED_LIBS=ON"
    - "ENABLE_TESTS=ON"
    - "BUILD_EXAMPLES=ON"
    - "ENABLE_DOXYGEN=OFF"
  dependencies:
    - netcdf/4.9.3
  tool_requires:
    - "flang-ohos/20.1.0"
  cc: clang
  fc: flang

patches_applied: []

validation:
  upstream_native:
    status: pass
    command: "cmake --build <build> -j1 && ctest --output-on-failure（ctest -N 注册数取分母）"
    total: 51
    pass: 51
    fail: 0
    skip: 0
    not_run: 0
    report: "reports/verification-evidence.md"
  target_conan:
    status: pass
    command: "conan create . --version=4.6.4 --profile:host=<ohos-aarch64> --profile:build=<ohos-aarch64> --user=ohpcd --channel=stable"
    upstream_tests_executed_in_build: true
    total: 51
    pass: 51
    fail: 0
    skip: 0
    not_run: 0
    report: "reports/verification-evidence.md"
  target_consumers:
    status: pass
    total: 37
    pass: 37
    fail: 0
    command: "./test_netcdf_fortran（Fortran 2003 读写链路 27 项）与 ./test_netcdf_fortran_abi（C 侧加载与 ABI 契约 10 项），由 conan create 的 test_package 阶段以 env=conanrun 直跑"
    report: "reports/verification-evidence.md"

knowledge_gained:
  - "OHOS 上 Fortran 库必须用 flang 当链接驱动并给全 --sysroot/-resource-dir 与 -L <sdk>/llvm/lib/aarch64-linux-ohos（libunwind.a 只在该目录）；改用 clang 顶替 Fortran 链接规则时构建期全绿，但产物的消费者在加载期缺 Fortran 运行时符号（RC 127）"  # knowledge_ref: E6339（本 PR 新增草稿）
  - "缺 Fortran 编译器不是死路：设备无 gfortran/flang 时用 flang-ohos/20.1.0 tool_requires 可在设备上原生完成编译与链接，无需交叉编译"  # knowledge_ref: E109
  - "cmake.install() 的 RPATH 改写会令 hnp 链接器内置的 .codesign 失效，安装副本被 loader 拒绝（Error loading shared library 无 errno 文本），必须在 install 之后重新签名"  # knowledge_ref: E504
  - "Fortran .mod 是编译器私有接口，消费方必须用同一 flang-ohos（tool_requires 用 package_id_mode=full_mode 绑定）"  # knowledge_ref: E242
  - "binary-sign-tool/llvm-objcopy 是 C++ 程序，构建期注入的 LD_LIBRARY_PATH（含依赖 libdir）会遮蔽其 libc++，报 Error 127；调用它们时需清掉 LD_LIBRARY_PATH"  # knowledge_ref: E452
