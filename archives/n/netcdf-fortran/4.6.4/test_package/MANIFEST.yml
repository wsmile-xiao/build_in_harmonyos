# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 取数口径：分母 = `ctest -N` 在配方 build() 的实际配置下注册的用例数（51）；
# 分子 = `ctest --output-on-failure` 的执行结果（51 passed / 0 failed / 0 skipped / 0 not run）。
# 统计单位 = CTest 注册项（每个注册项对应一个可执行测试程序或一个示例读写对）。

package: netcdf-fortran/4.6.4
homepage: "https://github.com/Unidata/netcdf-fortran"

# 上游测试命令
upstream_check_command: "ctest -N && ctest --output-on-failure"

# 上游测试已集成进配方 build()：ENABLE_TESTS=ON + cmake.test()，conan create 时真实执行
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure（在打包阶段内的 build 目录执行）"

upstream_test_count: 51

# 上游注册的测试项（51 项，按注册目录分组）
upstream_tests:
  - file: nf_test/CMakeLists.txt
    source: "netcdf-fortran-4.6.4/nf_test"
    description: "F77/F90 基础 API 用例：nf_test、tst_int64、tst_f77_v2、ftest（4 项）"
    command: "ctest --output-on-failure"
  - file: nf03_test/CMakeLists.txt
    source: "netcdf-fortran-4.6.4/nf03_test"
    description: "F2003 基础用例：tst_f90、tst_fill_int64（2 项）"
    command: "ctest --output-on-failure"
  - file: nf_test4/CMakeLists.txt
    source: "netcdf-fortran-4.6.4/nf_test4"
    description: "netCDF-4 的 F77 用例 17 项（groups/vars/types/rengrps/szip/zstandard/quantize/meta_block_size 等）"
    command: "ctest --output-on-failure"
  - file: nf03_test4/CMakeLists.txt
    source: "netcdf-fortran-4.6.4/nf03_test4"
    description: "netCDF-4 的 F90 用例 16 项（vars/vlen/grps/fill/types/att 等）"
    command: "ctest --output-on-failure"
  - file: examples/F77/CMakeLists.txt
    source: "netcdf-fortran-4.6.4/examples/F77"
    description: "F77 示例读写对 6 项（simple_xy / sfc_pres_temp / pres_temp_4D 的 wr+rd）"
    command: "ctest --output-on-failure"
  - file: examples/F90/CMakeLists.txt
    source: "netcdf-fortran-4.6.4/examples/F90"
    description: "F90 示例读写对 6 项（同上三组 wr+rd）"
    command: "ctest --output-on-failure"

# test_package 中自带的测试（消费者视角验证，不计入上游分母）
test_package_tests:
  - file: test_netcdf_fortran.f90
    description: "Fortran 2003 消费者：建 netCDF-4 文件→定义维度/变量→写属性→开 HDF5 deflate→写数据→只读重开→逐项回读校验"
    command: "./test_netcdf_fortran"
  - file: test_netcdf_fortran_abi.c
    description: "C 侧交付面契约：按 SONAME 以 RTLD_NOW 加载 libnetcdff.so（未解析符号即失败）并 dlsym 逐项解析 Fortran 消费者的 ABI 入口（F2003 模块过程 _QMnetcdfP<...> 与 _FortranA* 运行时）"
    command: "./test_netcdf_fortran_abi"

consumer_flow_count: 2
assertion_count: 37
