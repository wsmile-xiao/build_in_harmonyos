# manifest.yaml — numdiff 5.9.0
# 遵循 ARCHIVE-SPEC v2.0

version: "5.9.0"
software: numdiff
status: built
build_date: "2026-09-10"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://download.savannah.gnu.org/releases/numdiff/numdiff-5.9.0.tar.gz"
  sha256: "87284a117944723eebbf077f857a0a114d818f8b5b54d289d59e73581194f5ef"
  tar_format: tar.gz
  note: "官方源为 GNU Savannah nongnu 发布目录（numdiff 非 GNU 主业，无 ftp.gnu.org 镜像）。sha256 由同一官方 URL 独立二次下载复算比对确认（两次一致）。"

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  configure_options:
    - "--disable-nls"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "patches/0001-configure.patch"
  - "patches/0002-linesplit.c.patch"

# ============================================================
# 上游测试核验（R51 三步法）
# ============================================================
upstream_tests:
  in_tree: false
  conclusion: "numdiff 5.9.0 源码包内无测试（0 个 check/test 目标）；上游官方测试套件为独立发布的 numdiff_tests-1.7.0（与 5.9.0 同日发布）"
  evidence:
    - "numdiff-5.9.0 源码树：无 tests/ 目录；顶层 Makefile.in 无 check/test 目标（目标仅 all/man/install/uninstall/clean/dist）"
    - "grep -in 'check\\|test' Makefile.in 命中 0 行"
    - "官方发布目录 https://download.savannah.gnu.org/releases/numdiff/ 提供 numdiff_tests-1.7.0.tar.gz（2017-02-25，与 numdiff-5.9.0 同日）"
    - "numdiff_tests-1.7.0 清点：test1..test34 共 34 个测试脚本（runalltests.sh 注册 34，runbasictests.sh 注册 31）"
  execution:
    command: "bash runalltests.sh（脚本使用 'bash <runtest N>.sh' 调用，附带 cat/diff/numdiff/ndselect 参数）"
    tally: "34/34 测试脚本已运行；合计 689 个断言，687 PASS，2 差异"
    failures: "2 项为平台大小写不敏感文件系统伪失败（test10 的 ZfG2/zfG2 文件名冲突），非 numdiff 缺陷"
  optimization: "已修复 -D 参数以分隔符结尾时 ssplit() 未初始化内存导致的 SIGSEGV（0002-linesplit.c.patch），修复前 test32 有 3 个断言崩溃"

# ============================================================
# 消费者测试（test_package）
# ============================================================
consumer_tests:
  entry: "test_package/conanfile.py"
  assert_script: "test_package/test.sh"
  smoke_assertions: 4
  smoke_list:
    - "numdiff --version 输出含 numdiff 5.9.0"
    - "相同数值文件比较 numdiff a.txt b.txt 退出码 0"
    - "数值不同字段被检出（非零退出且报告含差异值）"
    - "ndselect --version 输出含 ndselect 5.9.0"

# ============================================================
# HarmonyOS 适配记录（E 条目对照）
# ============================================================
adaptation:
  - issue: "E011"
    problem: "HMDFS 下 autoconf 生成的 configure/config.status 以 umask 077 创建临时目录，UID 映射导致目录不可写，config.status 报 'cannot create ./confXXXXXX/subs1.awk: Permission denied'"
    fix: "0001-configure.patch：configure 中 umask 077 -> umask 022（HMDFS 上 077/022 差异与 xz/tar/wget/diffutils 等一致）"
  - issue: "E027 / PSCAN-MUSL-005"
    problem: "OHOS 无 libintl（gettext）开发库，numdiff 默认启用 NLS（AC_CHECK_LIB(intl) + -DENABLE_NLS）"
    fix: "configure --disable-nls（conanfile.py generate()）"
  - issue: "新错误模式（本次沉淀）"
    problem: "linesplit.c ssplit() 在分隔符串以分隔符结尾时多计子串数，导致指针向量部分槽位未初始化；musl 下 malloc 返回非零内存，后续 strchr/strcmp 扫描（is_char_in_vector 等）SIGSEGV"
    fix: "0002-linesplit.c.patch：malloc -> calloc（所有槽位初始化为 NULL）"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "ref: E011 — autoconf configure/config.status 的 umask 077 临时目录在 HMDFS 上不可写（复用）"
  - "ref: E027 — OHOS 无 libintl，GNU 工具用 --disable-nls 绕过（复用）"
  - "ref: E429-draft-BD92 — ssplit() 未初始化指针向量在 musl 上 SIGSEGV，malloc → calloc（本次新增草稿）"

