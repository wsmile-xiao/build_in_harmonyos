# test_package/MANIFEST.yml — numdiff 5.9.0
# 上游测试声明 + 消费者测试声明（CI L0e 门禁要求）
#
# 上游测试核验（R51 三步法，清点 → 运行 → 如实回填）：
#   numdiff 5.9.0 的源码包【不含】任何测试（无 tests/ 目录，Makefile.in 无
#   check/test 目标，grep 'check|test' Makefile.in 命中 0 行）。
#   上游官方测试套件是【独立发布】的 numdiff_tests-1.7.0.tar.gz
#   （https://download.savannah.gnu.org/releases/numdiff/ ，2017-02-25，
#   与 numdiff-5.9.0 同日发布）。

package: numdiff/5.9.0
homepage: "https://www.gnu.org/software/numdiff/"

# 构建系统
build_system: autotools

# 上游测试命令（本包源码树内无 check/test 目标）
upstream_check_command: "make check（numdiff 5.9.0 源码树无此目标；无 in-tree 测试）"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 源码包内实际运行的测试程序（无）
upstream_tests: []

# 上游测试结论（源码包内）
upstream_in_tree_result: "0/0 (N/A，numdiff 5.9.0 源码包内无测试)"

# 上游官方测试套件（独立包）清点与运行结果
upstream_suite:
  package: "numdiff_tests-1.7.0.tar.gz"
  url: "https://download.savannah.gnu.org/releases/numdiff/numdiff_tests-1.7.0.tar.gz"
  sha256: "0074bde9924567061bc9f8af186a6ac04c897a11b314703e0585570e3783da44"
  registered_scripts: 34
  scripts_run: 34
  runner: "runalltests.sh（逐 test 调用 run<test>.sh）"
  checks_total: 689
  checks_passed: 687
  checks_failed: 2
  failures_note: >-
    test10 的 ZfG2/zfG2 两项差异来自平台【大小写不敏感文件系统】导致的文件名冲突
    （预期文件 ZfG2 与 zfG2 折叠为同一文件，输出文件 ./output/ZfG2 与
    ./output/zfG2 亦折叠，后写覆盖先写），与 numdiff 行为无关。
    验证依据：numdiff -Z 1:2 -Z 2:2 -f Table1 Table2 的输出 sha256
    与预期 ZfG2 完全一致（5629ef14…）。
  segfault_fixed_note: >-
    修复前 test32 的 3 个断言因 ssplit() 未初始化内存而 SIGSEGV
    （musl malloc 返回非零内存）；0002-linesplit.c.patch 修复后 0 崩溃。
  result: "689 检查项：687 PASS / 2 差异（大小写不敏感 FS 伪失败，非缺陷）"

# 消费者测试入口与断言脚本
test_package_entry: "test_package/conanfile.py"
test_package_assert_script: "test_package/test.sh"

# 消费者补充测试（4 个断言，真实执行被测二进制）
test_package_tests:
  - file: test.sh
    source: test_package/test.sh
    description: "断言1: numdiff --version 退出码 0 且输出含 numdiff 5.9.0"
    command: "numdiff --version 2>&1 | grep -q 'numdiff 5.9.0'"
    result: "PASS"
  - file: test.sh
    source: test_package/test.sh
    description: "断言2: 相同数值文件 numdiff a.txt b.txt 退出码 0"
    command: "numdiff a.txt b.txt"
    result: "PASS"
  - file: test.sh
    source: test_package/test.sh
    description: "断言3: 数值不同字段被检出（非零退出且报告含差异值 9.0）"
    command: "numdiff a.txt c.txt | grep -q 9.0"
    result: "PASS"
  - file: test.sh
    source: test_package/test.sh
    description: "断言4: 同包附带的 ndselect 工具可执行（ndselect --version）"
    command: "ndselect --version 2>&1 | grep -q 'ndselect 5.9.0'"
    result: "PASS"

consumer_test_result: "4/4 PASS（执行端真实执行验证）"

# 测试断言总数（消费者补充测试）
assertion_count: 4
