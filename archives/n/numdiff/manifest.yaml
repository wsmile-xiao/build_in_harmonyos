# 软件级 manifest — numdiff
# 遵循 ARCHIVE-SPEC v2.0（软件级元数据 + 版本索引）
# 文件位置: archives/n/numdiff/manifest.yaml

software: numdiff
display: "GNU numdiff"
description: "Compare files line by line and field by field, ignoring small numeric differences and/or different number formats"
category: utility
homepage: "https://www.gnu.org/software/numdiff/"
license: GPL-3.0-or-later
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "E011: autoconf configure/config.status 的 umask 077 临时目录在 HMDFS 上不可写，需改为 umask 022 补丁"
    - "E027 / PSCAN-MUSL-005: OHOS 无 libintl(gettext)，需 configure --disable-nls"
    - "musl 内存未初始化崩溃: linesplit.c ssplit() 指针向量槽位未初始化，需 malloc → calloc"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "5.9.0":
    status: built
    build_date: "2026-09-10"
    conan_ref: "numdiff/5.9.0"
