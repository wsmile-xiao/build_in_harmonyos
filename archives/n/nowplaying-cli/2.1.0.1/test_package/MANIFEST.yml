# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 本项目为 OHOS 等价移植（纯 C++ 单二进制 CLI），上游为 macOS 专属
# Objective-C 工具（Foundation/AppKit/MediaRemote 私有框架），无法在 OHOS
# 上直接构建（env_unsupported，无 libobjc/libdispatch/Foundation）。
# 因此没有可复现的上游测试套件；test_package 通过运行打包后的二进制
# 实质验证 CLI 行为（R34）。

package: nowplaying-cli/2.1.0.1
homepage: "https://github.com/kirtan-shah/nowplaying-cli"

# 上游测试命令: 上游为 macOS 专属，无 OHOS 可运行测试套件
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无（等价移植，见上）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证) — 直接运行打包后的二进制
test_package_tests:
  - file: conanfile.py
    description: "运行打包后的 nowplaying-cli --help（必须 exit 0 并输出用法）"
    command: "nowplaying-cli --help"
  - file: conanfile.py
    description: "get --demo --json：演示 provider 元数据 JSON 输出（必须 exit 0）"
    command: "nowplaying-cli get --demo --json"
  - file: conanfile.py
    description: "seek 90：控制命令链路（必须 exit 0）"
    command: "nowplaying-cli seek 90"
  - file: conanfile.py
    description: "get title artist --demo：TSV 字段查询（必须 exit 0）"
    command: "nowplaying-cli get title artist --demo"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
