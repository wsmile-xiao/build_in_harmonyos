knowledge_gained:
  - "OHOS native AVSessionKit (libohavsession.so) 只有 provider 侧 API + AVCast 投屏控制器，无 native controller/manager（getAllSessionDescriptors 仅在 ETS/JS）"
  - "conan CMakeToolchain 流程不注入 CMAKE_SYSROOT，需从编译器 REALPATH 推导 <llvm>/../../sysroot"
  - "OHOS SDK 头文件用全限定路径 <sysroot>/usr/include/multimedia/av_session/ 更稳（不依赖 -I 注入）"
  - "link 时用 find_library(OH_AVSESSION_LIBRARY NAMES ohavsession PATHS <sysroot>/usr/lib/aarch64-linux-ohos NO_DEFAULT_PATH)"

