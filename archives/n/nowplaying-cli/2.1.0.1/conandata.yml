# conandata.yml - nowplaying-cli 2.1.0.1
#
# 等价移植说明（R39 豁免）：
# 上游 nowplaying-cli 2.1.0 (kirtan-shah/nowplaying-cli) 为 macOS 专属
# Objective-C 工具（Foundation/AppKit/MediaRemote），OHOS 无 libobjc/
# libdispatch/Foundation 无法编译（已实测 env_unsupported）。本包为纯 C++
# OHOS 等价移植，无官方 OHOS 源码源。
# 源码通过 conanfile.py exports_sources 直接打包进 recipe，不依赖外部
# URL 下载。CI 的 conan create 通过 export 阶段获取源码，无需 pre-download。
#
# sha256 保留用于 tarball 一致性校验（如有构建缓存场景）。

sources:
  url: ""
  sha256: ""

# 构建补丁为空；patches/ 下 0001/0002 为 refresh-patch 生成的过程适配记录
#（归档文档），不参与 conan 构建（源码已通过 exports_sources 打包进 recipe）。
patches: {}
