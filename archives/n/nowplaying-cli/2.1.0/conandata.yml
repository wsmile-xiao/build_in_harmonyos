# conandata.yml — nowplaying-cli 2.1.0 (OpenHarmony)
#
# R39: 源码 URL 为上游官方 GitHub tag 归档（官方正式源；镜像 fallback 由 CI 自动添加，
# 本文件只写官方原始 URL）。
#
# 上游 kirtan-shah/nowplaying-cli v2.1.0 是 macOS 专属 Objective-C(++) 工具，
# 通过私有 MediaRemote 框架 + Foundation/AppKit/Cocoa 读取系统 "now playing"。
# OpenHarmony native SDK 既无 Objective-C 运行时/Foundation，也无 MediaRemote，
# 源码无法直接编译（首个阻塞：'Foundation/Foundation.h' file not found）。
# 因此本配方下载官方源码后应用 patches/0001-portable-nonapple.patch：把
# src/nowplaying.mm 拆成 `#if defined(__APPLE__)`（上游原版，逐字保留）与
# 非 Apple 平台的可移植 C++ 实现（保留上游 CLI 契约，映射到原生 AVSessionKit）。
# 详见 README.md / notes.md 的 API 缺口分析。

sources:
  url: "https://github.com/kirtan-shah/nowplaying-cli/archive/refs/tags/v2.1.0.tar.gz"
  sha256: "c7c23564657bf5b5598bdf58f79e11c8dffbde909e364df4da7c3a49a26e3753"

patches:
  - patch_file: "patches/0001-portable-nonapple.patch"
    patch_description: >-
      把 src/nowplaying.mm 拆为 `#if defined(__APPLE__)`（上游原版逐字保留）
      与可移植 C++ 实现：非 Apple 平台对齐上游子命令集合 / get 字段行为 /
      退出码（已知差异见 README「Differences from upstream」），映射到 OpenHarmony 原生 AVSessionKit
      provider API；无原生系统级 now-playing 查询时如实返回上游的空结果
      （每个键一行 null / get-raw 输出 {}），不伪造数据。
    patch_type: "portability"
