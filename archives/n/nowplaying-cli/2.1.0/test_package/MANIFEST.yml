# test_package/MANIFEST.yml — nowplaying-cli 2.1.0
# CI L0e requires this file to exist.

package: nowplaying-cli/2.1.0
homepage: "https://github.com/kirtan-shah/nowplaying-cli"

# ── 上游测试审计 ────────────────────────────────────────────────
# 已审计上游官方 tag 归档
# （https://github.com/kirtan-shah/nowplaying-cli/archive/refs/tags/v2.1.0.tar.gz，
#   sha256 c7c23564657bf5b5598bdf58f79e11c8dffbde909e364df4da7c3a49a26e3753）：
# 归档仅含 LICENSE、Makefile、README.md、include/（2 个头文件）、
# src/nowplaying.mm、src/mediaremote-mini/**（*.m/*.h）、
# scripts/mediaremote-mini.pl、screenshots/examples.png 与 .github/workflows/build.yml。
# Makefile 只有 all/install/uninstall/clean 目标（无 check/test）；
# 无测试框架（gtest/ctest/autotools/pytest 等）、无测试目录、无测试源码。
# 结论：上游确无任何测试用例（discovered=0 / executed=0）。
upstream_tests_exist: false
upstream_test_audit: "审计 v2.1.0 官方 tag 归档（sha256 c7c23564657bf5b5598bdf58f79e11c8dffbde909e364df4da7c3a49a26e3753）：仅 LICENSE/Makefile/README.md/include/src/scripts/screenshots + .github/workflows；Makefile 无 check/test 目标，无测试框架/目录/源码 → 上游无任何测试。test_package 以已安装二进制的行为测试接入。"

# 上游测试命令（无）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# ── test_package 自带测试（消费者视角，R34：真实执行被测产物）──
# 断言策略：每条用例都有确定性期望（明确的退出码 + stdout/stderr 内容）。
# 仅两个控制动词依赖平台服务（原生 AVSession provider 会话）；服务不可用时
# 记为显式 SKIP（单独计数，绝不记为 PASS），不使用析取式「或成功或失败都算过」。
test_package_tests:
  - file: test.sh
    description: >-
      运行已安装的 nowplaying-cli 二进制，15 项断言：①--help 退出 0 且打印上游命令面；
      ②无参数调用打印帮助并退出 0；③--version 报告 2.1.0；④get title album artist
      退出 0 且每个键一行字面量 null；⑤get --json 输出含两键的 JSON 对象；⑥get-raw 输出 {}；
      ⑦play 走原生 AVSession provider 路径（确定性期望 rc=0 且无输出，服务不可用则 SKIP）；
      ⑧seek 60 同上；⑨seek not-a-number 退出 1 且打印 Invalid seek time；
      ⑩seek inf/nan/1e999/-5 均退出 1 并打印 Invalid seek time（本分支比上游更严格：需转换为整型毫秒，故拒绝 NaN/Inf/负数/超界值）；⑪seek 60 70（argc≠3）回退帮助并退出 0（对齐上游）；⑫未知子命令回退帮助并退出 0。
    command: "bash test.sh"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 15
