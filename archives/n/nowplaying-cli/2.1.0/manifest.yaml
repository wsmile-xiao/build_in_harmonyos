# 版本级 manifest — nowplaying-cli 2.1.0（OpenHarmony 可移植构建）
# 遵循 ARCHIVE-SPEC v3.0

version: "2.1.0"
software: "nowplaying-cli"

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-14"
# build_system: 上游声明的构建系统（macOS 专用 Makefile）。
# 备注：本仓可移植分支**未使用 make**，由 conanfile.py::build() 直接调用一次 clang++
#（单编译单元，见 conanfile.py 与 notes.md「构建」小节）。
build_system: makefile

# ============================================================
# 源码信息（R39：官方 GitHub tag 归档）
# ============================================================

source:
  url: "https://github.com/kirtan-shah/nowplaying-cli/archive/refs/tags/v2.1.0.tar.gz"
  sha256: "c7c23564657bf5b5598bdf58f79e11c8dffbde909e364df4da7c3a49a26e3753"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  note: >-
    上游 Makefile 为 macOS 专用（-framework Cocoa/Foundation/AppKit/UniformTypeIdentifiers），
    OHOS 上不适用；可移植分支以单条 clang++ 调用构建（见 conanfile.py::build()）。
  configure_options: []
  dependencies: []          # 仅链接 OHOS SDK 系统库 libohavsession.so
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: "patches/0001-portable-nonapple.patch"
    description: "把 src/nowplaying.mm 拆为 `#if defined(__APPLE__)`（上游原版逐字保留）+ 可移植 C++ 实现：对齐上游子命令集合/get 字段行为/退出码，映射到 OpenHarmony 原生 AVSessionKit provider API；无原生系统级 now-playing 查询时返回与上游「无记录」相同的输出（每键一行 null / get-raw 为 {}），不伪造数据。已知差异（不逐字节一致）见 README.md「Differences from upstream」"
    type: portability

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "nowplaying-cli 上游 v2.1.0 是 macOS 专属 Objective-C(++) 工具（Foundation/AppKit + 私有 MediaRemote），OpenHarmony 无 Objective-C 运行时/Foundation（实测 clang 首错 'Foundation/Foundation.h' file not found），源码无法直接编译"
  - "OHOS native AVSessionKit（libohavsession.so，115 个导出符号）只有 provider 侧（OH_AVSession_*、OH_AVMetadataBuilder_*）+ AVCast 投屏控制器；无 native 的 AVSessionManager/OH_AVSessionController/getAllSessionDescriptors，也无 metadata getter → native 侧无法做系统级 now-playing 查询"
  - "移植方案（对齐已入库的 m1ddc 先例 DRAFT-m1ddc-apple-ddc-transport-boundary）：`#if defined(__APPLE__)` 双路径——原版保留在 Apple 分支，非 Apple 分支对齐上游 CLI 面并把控制命令映射到原生 AVSession provider API；查询路径返回上游空结果，不伪造。conanfile.py 必须先 apply_conandata_patches 补丁才生效"
  - "OH_AVSession_Create/Activate/SetPlaybackState/SetPlaybackPosition 在 HarmonyOS PC 上可真实成功执行（本地实测 rc=0），控制命令因此有真实的原生代码路径而非桩函数"
  - "契约对齐审计：seek 仅 argc==3 生效、参数个数不符回退 help+0（已对齐）；--help 为固定字面量（已对齐）；get --json 为多行 JSON 但未逐字节复刻 Cocoa 序列化器；next/previous/togglePlayPause 因 native 无队列控制命令而不可区分（已记录差异）"

# ============================================================
# 备注
# ============================================================

notes:
  - "上游无测试：v2.1.0 tag 归档无测试框架/目录/源码，Makefile 无 check/test 目标（见 test_package/MANIFEST.yml）"
  - "`--version` 为适配分支新增的良性扩展（上游对未知参数回退打印帮助，无脚本依赖 --version 语义）"
  - "test_package 断言策略：每条用例确定性期望；仅两个控制动词依赖平台 AVSession 服务，服务不可用时记为显式 SKIP（单独计数，不记为 pass）"
