sources:
  url: https://github.com/Unidata/netcdf-cxx4/archive/refs/tags/v4.3.1.tar.gz
  sha256: E3FE3D2EC06C1C2772555BF1208D220AAB5FEE186D04BD265219B0BC7A978EDC

patches:
  4.3.1:
    - patch_file: "patches/0001-fix-check-library-exists.patch"
      patch_description: "Add netcdf::netcdf target compatibility for Config mode, quote variables in CHECK_LIBRARY_EXISTS calls"
      patch_type: "portability"
    - patch_file: "patches/0002-guard-optional-nc-set-log-level.patch"
      patch_description: "Feature-detect nc_set_log_level and only call it when the symbol is available in the linked netCDF-C library"
      patch_type: "portability"
    - patch_file: "patches/0003-guard-nc-set-log-level-calling.patch"
      patch_description: "Guard nc_set_log_level(5) call in test_filter.cpp with HAVE_NC_SET_LOG_LEVEL"
      patch_type: "portability"
