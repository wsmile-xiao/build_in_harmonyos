knowledge_gained:
  - "musl libc 不暴露 _res 全局变量（res_state），需用 #ifdef __OHOS__ 守卫替代"
  - "添加 AC_DEFINE([__OHOS__]) 到 configure.ac，确保平台宏通过 configure 自动写入 config.h（R6: 不改生成文件）"
  - "nfcapd daemon 在 OpenHarmony 上无法作为后台进程持续运行，影响 runtest.sh 测试但非核心功能阻塞"

