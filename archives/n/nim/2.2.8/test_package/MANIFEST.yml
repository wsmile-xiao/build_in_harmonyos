# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: nim/2.2.8
homepage: "https://nim-lang.org"

# Upstream test command (for make -n check / ctest -N / meson test --list analysis)
upstream_check_command: "bin/nim --version"

# conanfile.py build() method: upstream test integrated?
upstream_test_in_build: false
upstream_test_command: "bin/nim --version"

# Upstream test programs actually run
upstream_tests:
  - file: test.nim
    source: nim-2.2.8/test_package/test.nim
    description: "Simple Nim program compiled by the nim compiler"
    command: "nim c test.nim"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.nim
    description: "Verify nim compiler binary works by running --version"
    command: "nim --version"

# Test assertion count (approximate, for quality assessment)
assertion_count: 2
