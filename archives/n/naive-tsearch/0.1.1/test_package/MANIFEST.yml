# test_package/MANIFEST.yml — naive-tsearch 0.1.1
# 上游测试声明（CI L0e 强制要求；L1c 按本文件声明核对 build 日志执行痕迹）
# 详见: docs/TEST_QUALITY_SPEC.md

package: naive-tsearch/0.1.1
homepage: "https://github.com/kulp/naive-tsearch"
test_type: conan_test_package

# 上游测试命令（conanfile.py build() 内执行；原生对照轮同命令）
upstream_check_command: "ctest --output-on-failure -C Release"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_in_build_evidence: "conanfile.py build(): cmake.configure() + cmake.build() + ctest --output-on-failure -C Release → 3/3 Passed（dev2 conan create rc=0 日志实录）"

# 上游实际运行的测试程序（CTest 注册 3 项，全部来自 tests/ 同一套 6 case）
upstream_test_count: 3
upstream_passed: 3
upstream_failed: 0
upstream_tests:
  - file: tests/CMakeLists.txt
    source: naive-tsearch-0.1.1/tests/
    description: "test_naive_tsearch：静态库形态（TEST_NAIVE_TSEARCH，链接 libnaive-tsearch.a），6 Boost case / 59 断言，ctest 注册名 test_test_naive_tsearch"
    command: "ctest -R '^test_test_naive_tsearch$'"
  - file: tests/CMakeLists.txt
    source: naive-tsearch-0.1.1/tests/
    description: "test_naive_tsearch_hdronly：头文件形态（TEST_NAIVE_TSEARCH_HDRONLY，NAIVE_TSEARCH_HDRONLY static 实现），6 Boost case / 59 断言，ctest 注册名 test_test_naive_tsearch_hdronly"
    command: "ctest -R '^test_test_naive_tsearch_hdronly$'"
  - file: tests/CMakeLists.txt
    source: naive-tsearch-0.1.1/tests/
    description: "test_system_tsearch：系统 <search.h> 对照组（OHOS musl 提供全部 6 符号 → 上游 CMake 探针默认开启），6 Boost case / 59 断言，ctest 注册名 test_test_system_tsearch"
    command: "ctest -R '^test_test_system_tsearch$'"

# case 执行口径（声明 N，候选数法最大值）：3 可执行 × 6 BOOST_AUTO_TEST_CASE = 18
upstream_case_count: 18
# 断言口径（独立计数，不与 N 混用）：3 × 59 = 177，实测全过
assertion_count: 177

# test_package 中自带的测试（消费者视角，鸿蒙特有测试行取数来源）
test_package_tests:
  - file: consumer_main.c
    description: "消费者入口：汇总双形态断言并打 PASS/FAIL 汇总行"
    command: "./naive-tsearch-consumer"
  - file: consumer_static.c
    description: "静态库形态消费：包装头 search.h → tsearch.h → libnaive-tsearch.a，5 项行为断言"
    command: "./naive-tsearch-consumer"
  - file: consumer_hdronly.c
    description: "头文件形态消费：#define NAIVE_TSEARCH_HDRONLY 后包含 search.h → tsearch_hdronly.h，5 项行为断言"
    command: "./naive-tsearch-consumer"

# 消费者断言总数（鸿蒙特有测试）
test_package_assertion_count: 10
assertions:
  - "tfind returns all 5 inserted nodes"
  - "duplicate tsearch reuses existing node"
  - "tfind on absent key returns NULL"
  - "tdelete removes only the deleted key"
  - "twalk visits the 4 remaining nodes + tdestroy cleanup"
  - "以上 5 项 × 静态库/头文件两形态 = 10，实测 10/10 PASS"

# 防静默回落：两个消费 TU 都带编译期断言，用不到包内头会 #error
guard_notes: "consumer_static.c 校验 NAIVE_TSEARCH_SEARCH_H_、consumer_hdronly.c 校验 NAIVE_TSEARCH_HDRONLY_H_；系统 <search.h> 阴影包内头时编译期即失败"
