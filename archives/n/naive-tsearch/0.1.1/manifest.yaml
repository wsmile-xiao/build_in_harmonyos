# 版本级 manifest — naive-tsearch 0.1.1
# 遵循 ARCHIVE-SPEC v2.0（字段与 conandata.yml/conanfile.py 交叉一致）

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.1"

# 软件名
software: "naive-tsearch"

# 编译状态：built（conan verify 通过、未 upload；合并+release 前不写 published）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "cmake"
conan_ref: "naive-tsearch/0.1.1"

# ============================================================
# 源码信息（与 conandata.yml 逐字一致）
# ============================================================

source:
  url: "https://github.com/kulp/naive-tsearch/releases/download/v0.1.1/naive-tsearch-0.1.1.tar.xz"
  sha256: "cb779326a8748fb527ab2f4d199923c92dc7d120988b45400d4b31fd77288a1b"
  tar_format: tar.xz

# ============================================================
# 构建配置（与 conanfile.py generate() 一致）
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DNAIVE_TSEARCH_TESTS=ON"
    - "-DNAIVE_TSEARCH_INSTALL=ON"
    - "-DBoost_USE_STATIC_LIBS=ON"
    - "-DBOOST_TEST_NO_MAIN"
  # 说明：前三个是 CMakeToolchain cache_variables，最后一个经
  # tc.extra_cxxflags 注入 CXX flags（见 knowledge_gained 第一条）。

  # 编译依赖（仅测试用，test_requires，不传播给消费者）
  dependencies:
    - "boost/1.90.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Conan CMakeDeps 给静态 Boost.Test 注入 BOOST_TEST_DYN_LINK=0，boost/test/unit_test.hpp 用 defined() 判真 → 上游 main.cpp 生成 main 与归档 unit_test_main.o 的 main 冲突（duplicate symbol: main）；测试目标加 -DBOOST_TEST_NO_MAIN，让归档唯一 main 链接 BOOST_TEST_MODULE 生成的 init_unit_test()。"  # knowledge_ref: E747
  - "CMake 4.x 默认走已移除的 FindBoost 模块（CMP0167 未设）时对 conan BoostConfig 报 Could NOT find Boost: missing: unit_test_framework——原生（非 conan）构建须加 -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON 走 config 模式；conan create 路径由 conan_toolchain.cmake 自动置该开关。"  # knowledge_ref: E748
