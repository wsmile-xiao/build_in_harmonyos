# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ninja/1.13.2
homepage: "https://ninja-build.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target ninja_test && ./ninja_test"

# 上游实际运行的测试程序（完整台账见 reports/upstream-test-ledger.md）
upstream_tests:
  - file: src/*_test.cc
    source: ninja-1.13.2/src/*_test.cc
    description: "Ninja C++ unit test suite (411 cases registered, 32 suites; see ledger)"
    command: "ninja_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Run ninja --version; drive ninja to compile a C program with OHOS clang; run the produced binary and check its output"
    command: "ninja --version && ninja -C <build_dir> && <build_dir>/hello_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 413