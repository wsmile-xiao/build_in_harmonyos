# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 内核 ppoll() 运行时返回 ENOMEM（toybox/bionic poll 限制），必须用 CMake NINJA_FORCE_PSELECT=ON 强制 pselect() 路径"
  - "上游 status_test.cc 未被任何构建目标接入且缺 include（status_printer.h/build.h），需最小补丁纳入 ninja_test 目标才能编译运行"
  - "OHOS HMDFS 不支持 mknod/FIFO（EPERM），/dev/shm 等 tmpfs 亦被拒（EACCES），Jobserver.PosixFifoClient 等 FIFO 用例为真实平台阻塞"
  - "OHOS /bin/sh 对 SIGHUP 以 exit(128+1)=129 正常退出（WIFEXITED）而非被信号杀死，InterruptChildWithSigHup 为真实平台 shell 语义差异"

