name: nats-server
version: v2.12.6
status: built
build_date: 2026-05-29
build_system: go

# 编译环境
compiler: go1.25.10
platform: HarmonyOS (OpenHarmony)
arch: aarch64

# 编译配置
configure_options: []
build_env:
  CGO_ENABLED: "0"
  GOPROXY: "https://goproxy.cn,direct"
  GOCACHE: "/data/storage/el2/base/cache/go-cache"
  GOTMPDIR: "/data/storage/el2/base/cache/go-tmp"

# 编译产物
binary: nats-server
binary_size: 20M

# 功能验证
tests_passed:
  - version_check: "nats-server --version"
  - help_check: "nats-server --help"

# 已知问题
known_issues:
  - "Go 项目在 HMDFS 文件系统上可能有链接器权限限制"
  - "首次编译成功，重新编译注入版本号可能失败"

# 质量门禁
quality_gates:
  G0: pass (无补丁，不适用)
  G1: pass (二进制可执行)
  G2: pass (版本信息正确)
  G3: pass (静态编译，已签名)
  G4: pass (档案完整)

# 预编译包
package: nats-server-v2.12.6-ohos-aarch64.tar.gz
package_size: 14M