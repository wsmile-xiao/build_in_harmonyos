software: nmh
display: "nmh"
description: "Classic Unix command-line mail user agent (mailx-style folder, scan, comp, repl, send command family)"
category: mail
homepage: "https://www.nmh.io/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "sandboxed bash/clang cannot getcwd() inside the HMDFS-backed conan cache: the source tree is copied to a real-fs work root under /data/storage/el2/base before configure/make (ncurses/6.6 pattern)"
    - "OHOS has no system termcap/ncurses; nmh configure hard-requires setupterm, so ncurses/6.6 is required and a private libncurses.a alias of libncursesw.a is used for the -lncurses probe and link"
    - "OHOS has no ndbm; slocal(1) needs the classic dbm API, so gdbm/1.24 is required and ndbmcompat/ndbm.h maps dbm_open/dbm_fetch/... onto the real gdbm_* calls"
    - "bionic only declares memmem() under _GNU_SOURCE, so -D_GNU_SOURCE is added to CPPFLAGS"
    - "the filesystem does not allow the hard links nmh uses for its command aliases (flists/folders/fnext/fprev/next/prev/unseen): Makefile.in LN is switched to cp -f (patch 0002)"
    - "runtime commands resolve the mail transport configuration through the MHMTSCONF environment variable when /etc/nmh is not provisioned"
  common_dependencies:
    - ncurses
    - gdbm

versions:
  "1.8":
    status: built
    build_date: "2026-09-05"
    conan_ref: "nmh/1.8"
