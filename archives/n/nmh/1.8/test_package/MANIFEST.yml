package: nmh/1.8
homepage: "https://www.nmh.io/"

upstream_check_command: "make -j1 check"
upstream_test_in_build: false
upstream_test_command: "not run: make check needs to install nmh into compile-time /bin//libexec/nmh locations that do not exist in the sandbox; command behaviour is reproduced programmatically in test_package"

upstream_tests:
  - file: "test/"
    source: "nmh-1.8/test"
    description: "119 upstream automake TESTS shell scripts covering the mail-folder command workflows (ali, anno, burst, comp, dist, folder, forw, inc, mark, mhbuild, mhfixmsg, mhical, mhl, mhlist, mhmail, mhparam, mhpath, mhshow, mhstore, new, pick, post, prompter, rcv*, refile, repl, scan, send, sequences, show, slocal, whatnow, whom)"
    command: "make -j1 check"
    result: "not_run_in_sandbox"

test_package_tests:
  - file: "src/nmh_test_runner.sh"
    description: "44 installed ELF commands each answer -version with nmh-1.8 (smoke; the sendfiles and mhmail shell wrappers are excluded - they spawn compile-time /libexec/nmh paths)"
    command: "for each bin/*: <cmd> -version && grep nmh-1.8"
  - file: "src/nmh_test_runner.sh"
    description: "mhparam prints nmh-1.8 version and resolves the profile path component"
    command: "mhparam version; mhparam path"
  - file: "src/nmh_test_runner.sh"
    description: "scan renders a delivered message row on a real inbox folder"
    command: "scan +inbox"
  - file: "src/nmh_test_runner.sh"
    description: "pick selects the message by subject and lists message 1"
    command: "pick -subject hello -list +inbox"
  - file: "src/nmh_test_runner.sh"
    description: "folder reports the message count of the new inbox"
    command: "folder +inbox"
  - file: "src/nmh_test_runner.sh"
    description: "mark adds message 1 to the seen sequence and pick verifies it"
    command: "mark +inbox 1 -sequence seen; pick +inbox -sequence seen -list"
  - file: "src/nmh_test_runner.sh"
    description: "flist lists the inbox folder"
    command: "flist +inbox"
  - file: "src/nmh_test_runner.sh"
    description: "packf packs the folder into an mbox file containing the message"
    command: "packf +inbox -file mbox.out"
  - file: "src/nmh_test_runner.sh"
    description: "rmm removes message 1 and folder reports 0 messages"
    command: "rmm +inbox 1; folder +inbox"
  - file: "src/nmh_test_runner.sh"
    description: "negative: missing MH profile is rejected with the profile read error"
    command: "MH=<missing> mhparam version"
  - file: "src/nmh_test_runner.sh"
    description: "negative: no MH variable and no home profile triggers the install hint"
    command: "HOME=<empty> mhparam version"
  - file: "src/nmh_test_runner.sh"
    description: "negative: missing MHMTSCONF is reported when opening mts.conf"
    command: "MHMTSCONF=<missing> scan +inbox"
  - file: "src/nmh_test_runner.sh"
    description: "negative: pick against an unknown folder fails"
    command: "pick -subject x +folder-that-does-not-exist"
  - file: "src/nmh_test_runner.sh"
    description: "negative: MH profile pointing at a directory is rejected"
    command: "MH=<dir> mhparam version"

assertion_count: 58
