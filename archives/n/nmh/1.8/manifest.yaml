software: nmh
version: "1.8"
status: built
build_system: autotools
compile_date: "2026-09-05"
conan_ref: "nmh/1.8"

source:
  urls:
    - "https://download-mirror.savannah.gnu.org/releases/nmh/nmh-1.8.tar.gz"
    - "https://download.savannah.gnu.org/releases/nmh/nmh-1.8.tar.gz"
  url: "https://download.savannah.gnu.org/releases/nmh/nmh-1.8.tar.gz"
  sha256: "366ce0ce3f9447302f5567009269c8bb3882d808f33eefac85ba367e875c8615"
  tar_format: tar.gz
  note: "conandata keeps both Savannah hosts as a url list: the download-mirror.savannah.gnu.org host (the canonical redirect target of download.savannah.gnu.org) first because the savannah.gnu.org gateway returns 502 during the 2026-09 outage; identical sha256 bytes on both"

dependencies:
  required:
    - ncurses/6.6
    - gdbm/1.24
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --build=aarch64-unknown-linux-ohos
    - --host=aarch64-unknown-linux-ohos
    - --prefix=/
    - --without-cyrus-sasl
  notes:
    - "CPPFLAGS=-D_GNU_SOURCE -I<work>/ndbmcompat -I<ncurses>/include -I<gdbm>/include"
    - "LDFLAGS=-L<termlib with libncurses.a alias of libncursesw.a> -L<ncurses>/lib -L<gdbm>/lib"
    - "configure/make run on a real-fs copy under /data/storage/el2/base (HMDFS getcwd sandbox limitation)"

patches_applied:
  - 0001-config-sub-ohos.patch
  - 0002-install-aliases-cp.patch

test_results:
  type: upstream_suite
  total: 119
  passed: 0
  failed: 0
  note: "Upstream make check (119 automake TESTS scripts) was not runnable in the sandbox: it installs nmh into the compile-time /bin and /libexec/nmh locations which do not exist here; the equivalent command behaviours are reproduced programmatically in test_package"

additional_tests:
  total: 58
  passed: 58
  failed: 0
  note: "test_package/src/nmh_test_runner.sh: 44 installed ELF-command -version checks plus 9 functional mail-folder workflows (mhparam/scan/pick/folder/mark/flist/packf/rmm) plus 5 negative paths"

conan_result:
  note: "Package revision is generated per build and is not frozen in committed metadata"
