# test_package MANIFEST — neatvi 19
software: neatvi
version: "19"
test_type: cli_functional

# 上游官方测试：test.sh 驱动 test/ 67 用例（e??.sh 26 个 ex 模式 +
# v??.sh 41 个 visual 模式），`sh 用例 期望输出 | ./vi -s -e|-v` 管道
# 驱动、cmp 逐字节比对。层1 已在 conanfile build() 内全量实跑
#（唯一适配：test.sh /tmp 硬编码 → ${TMPDIR:-/tmp}，HMFS 只读约束）。
upstream_check_command: "sh test.sh"
upstream_check_count: 67

# test_package 测试：test.sh 6 项断言（4 项上游功能 + 2 项鸿蒙特有）。
#   功能检查：ex 插入写盘 / :%s 全局替换 / UTF-8 中文编辑 / stag tags 生成。
#   鸿蒙特有：无 tty 时窗口几何回退 $LINES（TIOCGWINSZ 不可用，OHOS
#             CI/HMFS 无控制终端）；无 tty 下 -v/-s -e 退出码 0
#             （tcgetattr/tcsetattr 返回值未检查，bionic ENOTTY 不致命）。
test_package_tests:
  - "ex 模式插入文本并写盘"
  - "ex :%s 全局替换"
  - "UTF-8 中文编辑（neatvi 主打特性）"
  - "stag 生成 tags 含 main"
  - "鸿蒙特有：无 tty 下窗口几何回退 $LINES=13"
  - "鸿蒙特有：无 tty 下 -v/-s -e 均退出码 0"
assertion_count: 6
fixture_count: 0
fixture_origin: "无 fixtures（运行时生成测试文件）"
