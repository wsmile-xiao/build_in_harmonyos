# nvtop 3.3.2 版本级 manifest
# 文件位置: archives/n/nvtop/3.3.2/manifest.yaml
version: "3.3.2"
software: "nytop"
status: built
build_date: "2026-09-06"
build_system: "cmake"

source:
  url: "https://github.com/Syllo/nvtop/archive/refs/tags/3.3.2.tar.gz"
  sha256: "48a295f3b3a917cc851d1aa8b185c09fde3a1b1e741fc57d7fa96b3671271630"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DNVIDIA_SUPPORT=OFF"
    - "-DAMDGPU_SUPPORT=OFF"
    - "-DINTEL_SUPPORT=OFF"
    - "-DAPPLE_SUPPORT=OFF"
    - "-DMSM_SUPPORT=OFF"
    - "-DPANFROST_SUPPORT=OFF"
    - "-DPANTHOR_SUPPORT=OFF"
    - "-DASCEND_SUPPORT=OFF"
    - "-DV3D_SUPPORT=OFF"
    - "-DTPU_SUPPORT=OFF"
    - "-DROCKCHIP_SUPPORT=OFF"
    - "-DMETAX_SUPPORT=OFF"
    - "-DENFLAME_SUPPORT=OFF"
  dependencies:
    - "ncurses/6.5@ohpcd/stable"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "nvtop 3.3.2 is C11 code; CMake 3.18+ builds cleanly with clang-15 on OHOS aarch64"
  - "All GPU vendor detection is disabled — OHOS has no NVIDIA/AMD/Intel/Mali driver stacks available"
  - "Only ncurses is required as a runtime dependency for the TUI"
  - "nvtop reads Linux /proc and /sys for process and GPU info — compatible with OHOS"
