# test_package/MANIFEST.yml
# nvtop 3.3.2 — 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nvtop/3.3.2
homepage: "https://github.com/Syllo/nvtop"

# 上游测试命令
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: interfaceTests.cpp
    source: nvtop-3.3.2/tests/interfaceTests.cpp
    description: "nvtop internal TUI interface layout tests (GoogleTest)"
    command: "./interfaceTests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "smoke test: invoke nvtop --version to verify the binary runs and reports the version"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 1
