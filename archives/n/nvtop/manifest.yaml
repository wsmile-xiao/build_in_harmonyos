# nvtop 软件级 manifest
# 文件位置: archives/n/nvtop/manifest.yaml
software: nvtop
display: "NVTOP — GPU Process Monitor"
description: "NVTOP (Neat Videocard TOP) is a htop-like task monitor for GPUs — supports NVIDIA, AMD, Intel, Apple, Qualcomm, Mali, Broadcom VC, Rockchip, MetaX and Enflame GPUs."
category: utility
homepage: "https://github.com/Syllo/nvtop"
license: GPL-3.0-or-later

build_system: cmake

ohos_adaptation:
  key_points:
    - "Requires ncurses (terminal UI) from Conan — ncurses/6.5@ohpcd/stable"
    - "All GPU vendor stacks (NVIDIA/AMD/Intel/Mali) disabled on OHOS; only TUI + process monitoring is functional"
    - "OHOS uses clang-15 which fully supports nvtop's C11 code"
    - "nvtop reads Linux /proc and /sys for process information — compatible with OHOS"
  common_dependencies:
    - ncurses

versions:
  "3.3.2":
    status: built
    build_date: "2026-09-06"
