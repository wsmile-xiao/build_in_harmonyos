software: nestopia-ue
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.53.2"

# 编译状态: published | built | failed | archived
status: built

# 编译日期 (YYYY-MM-DD)
build_date: "2026-09-12"

# Conan 引用
conan_ref: "nestopia-ue/1.53.2"

# 源码信息
source:
  url: "https://github.com/rdanbrook/nestopia/archive/refs/tags/1.53.2.tar.gz"
  sha256: "7783d2673ad496109e7dd3d75756cfef30c5b400409131b83b45c2fa3ddd735b"
  tar_format: tar.gz

# 构建配置
build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "ac_cv_prog_cxx_c_o=yes"
    - "cross_compiling=yes"
    - "ax_cv_cxx_compile_cxx17=yes"
  dependencies:
    - "sdl2/2.32.10"
    - "zlib/1.3.1"
    - "libsamplerate/0.2.2"
  build_tools:
    - "automake/1.18"
    - "autoconf/2.72"
    - "autoconf-archive/2024.10.16"
    - "m4/1.4.19"
    - "perl/5.42.2.3"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-drop-fltk-gui-frontend.patch"

knowledge_gained:
  - "上游 Linux 前端是 FLTK GUI + libepoxy OpenGL 渲染，仓内无 fltk 包且 OHOS 无桌面 GL 栈——采用 far2l 式裁剪：去掉 GUI 前端，保留 core+JG 绑定+manager 层"
  - "headless 驱动（source/headless/nstheadless.cpp）替代 FLTK main：分配 vidinfo/audinfo 缓冲，直接驱动 jg_exec_frame 帧循环"
  - "logdriver.cpp 原依赖 videomanager.h 的 GL OSD 渲染，headless 下改为 stderr/stdout 输出"
  - "inputmanager.cpp 的 UiAdapter GUI 动作转发用 no-op stub 实现（uiadapter_stub.cpp）"
  - "automake 1.18 需要显式 AC_PROG_CXX 否则 am__fastdepCXX conditional 未定义"
  - "aclocal 找不到 pkg.m4：AC_CONFIG_MACRO_DIRS([m4]) + vendor pkg.m4 到源码 m4/（conan automake 的 aclocal wrapper --system-acdir 替换了系统目录）"
  - "conan perl/5.42.2 包 Cwd.so 权限 750 属主 file_manager，其他账号 dlopen EACCES——autoreconf 环境用 PERL=系统 perl + PERL5LIB=conan automake share 覆盖"
  - "conftest 运行失败（libc++_shared.so 无法加载）：cross_compiling=yes + ac_cv_* 缓存预设绕过"
  - "libsamplerate 包的 .pc 名是 libsamplerate.pc（上游 configure.ac 期望 samplerate）——PKG_CHECK_MODULES 参数改名"

patch_generation:
  method: manual
  generated_at: "2026-09-12"
  patches_count: 1

# 产物信息
artifacts:
  binaries:
    - nestopia
  libraries: []
  data:
    - "share/nestopia/NstDatabase.xml"
    - "share/nestopia/palettes/"
    - "share/nestopia/shaders/"

# 上游测试信息
upstream_tests:
  registered: 0
  note: "上游 autotools 构建无 check_PROGRAMS/TESTS 注册（Makefile.am 只有 bin_PROGRAMS=nestopia）；上游测试形 态为 win32 VS 解决方案与无测试框架。适配后用 test_package 消费者测试补全（--version 冒烟 + 生成 NROM ROM 跑 120 帧 headless 模拟）"
