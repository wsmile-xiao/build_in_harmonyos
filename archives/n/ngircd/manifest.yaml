# 软件级 manifest — ngircd
# 遵循 ARCHIVE-SPEC v2.0

software: ngircd
display: "ngIRCd"
description: "轻量级 Internet Relay Chat (IRC) 服务端守护进程"
category: network
homepage: "https://ngircd.barton.de/"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "config.sub 已原生支持 ohos（ohos* / linux-ohos*-），无需 config.guess/sub 补丁"
    - "configure 内 umask 077 需改 022（HMDFS 权限问题）"
    - "openssl 走 PKG_CHECK_MODULES（PkgConfigDeps 生成 .pc 命中）；ident 走 AC_CHECK_LIB（AutotoolsDeps 注入 -I/-L）"
    - "纯可执行 daemon：package_type=application，install 后 sbin/ 折叠到 bin/"
    - "--nodaemon + 127.0.0.1 高位端口可做无头 daemon 冒烟"
  common_dependencies:
    - openssl
    - zlib

versions:
  "28":
    status: built
    build_date: 2026-09-11