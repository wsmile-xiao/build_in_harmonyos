package: ngircd/28
homepage: "https://ngircd.barton.de/"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: "src/portab/portabtest.c"
    source: "ngircd-28/src/portab/portabtest.c"
    description: "portab 库 C 单元测试（check_PROGRAMS，make check 递归执行）"
    command: "make check"
  - file: "src/ngircd/check-version"
    source: "ngircd-28/src/ngircd/Makefile.am"
    description: "ngircd --version 输出断言（Makefile 生成 shell 测试）"
    command: "make check"
  - file: "src/ngircd/check-help"
    source: "ngircd-28/src/ngircd/Makefile.am"
    description: "ngircd --help 输出断言（Makefile 生成 shell 测试）"
    command: "make check"
  - file: "src/testsuite/tests.sh"
    source: "ngircd-28/src/testsuite/tests.sh"
    description: "上游集成测试套件（15 例 expect 脚本，依赖 expect+telnet；无 expect 时 SKIP）"
    command: "make check"
test_package_tests:
  - file: "test.sh"
    description: "鸿蒙无头冒烟三件套：ngircd -V 版本断言 / --configtest 配置检查 / --nodaemon 起 127.0.0.1 高位端口裸 socket 收 001 欢迎后正常 shutdown"
    command: "bash test.sh"
assertion_count: 3
