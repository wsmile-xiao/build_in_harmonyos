software: ngircd
# 版本级 manifest — ngircd 28（HarmonyOS PC 适配）
# 遵循 ARCHIVE-SPEC v2.0

version: "28"
status: built
build_date: "2026-09-11"
build_system: autotools

source:
  url: "https://github.com/ngircd/ngircd/releases/download/rel-28/ngircd-28.tar.xz"
  sha256: "b48ba320a931d445ae335c47f88a9406a20f5c71c623bee5f7755d0522d435ee"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--with-openssl"
    - "--with-zlib"
    - "--without-ident"
    - "--without-gnutls"
  dependencies:
    - openssl/3.5.8.1
    - zlib/1.3.1.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure.patch"

knowledge_gained:
  - "ngircd 28 的 config.sub 已原生支持 ohos（ohos* / linux-ohos*-），无需 config.guess/sub 补丁"
  - "HMDFS umask 077 导致 configure 临时目录权限问题（mktemp -d './confXXXXXX'），需补丁改 022"
  - "openssl 检测走 PKG_CHECK_MODULES([OPENSSL],[libssl libcrypto])，PkgConfigDeps 生成 .pc 即可命中；ident 检测走 AC_CHECK_LIB(ident, ident_id) 无 pkg-config，AutotoolsDeps 注入 -I/-L 即可"
  - "ngircd 为纯可执行 daemon（无 libtool、无库产物），package_type=application，无需 --enable-static/--disable-shared"
  - "上游 install 到 $(sbindir)，需折叠 sbin/ 到 bin/（Conan 规范）"
  - "上游 testsuite 依赖 expect(1)+telnet(1)，无 expect 时全部 exit 77 SKIP 不失败；telnet 本机可用但 expect 缺失，daemon 冒烟兜底"
  - "ngircd 支持 --nodaemon（前台运行+关 syslog），配合 127.0.0.1 高位端口 + 裸 socket 发 NICK/USER 收 001 欢迎可做无头冒烟"

patch_generation:
  method: per-file-diff
  source_orig_dir: /storage/Users/currentUser/Hawkninja/learninglog/26.09.10ngircd-28/scratch/ngircd-28.orig
  source_work_dir: /storage/Users/currentUser/Hawkninja/learninglog/26.09.10ngircd-28/scratch/ngircd-28
  patches_count: 1

patch_classification:
  - file: 0001-configure.patch
    type: manual
    platform_only: True
    guard: 'pending'
