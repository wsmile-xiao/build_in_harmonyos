# 软件级 manifest — networkmanager-qt（KDE Frameworks 6 / Qt bindings for libnm）
# 文件位置: archives/n/networkmanager-qt/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0
# 软件级元数据 + 版本索引（人读；CI 不依赖本文件；CI 唯一输入是版本级 conanfile.py）

software: networkmanager-qt

display: "NetworkManagerQt (KDE Frameworks 6)"

description: >-
  KDE Frameworks 6 Qt bindings for the NetworkManager client library (libnm):
  libKF6NetworkManagerQt.so plus the camel-case NetworkManagerQt headers
  (Manager, Device, ConnectionSettings, WirelessSetting, SecretAgent, ...).

category: network

homepage: "https://invent.kde.org/frameworks/networkmanager-qt"

license: LGPL-2.1-or-later

build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - >-
      依赖面：upstream 只依赖 Qt6 (Core/DBus/Network/Qml) + libnm + ECM，不需要
      其它 KF6 库。但本仓的 qtbase/6.11.1 用 FEATURE_dbus=OFF 构建（不含
      Qt6DBus），必须改用 qtbase-sql-dbus/6.11.1（自带 Qt6DBus）；
      Qt6 Qml/QmlModels 由 qtdeclarative/6.11.1 提供，经 Qt 官方
      QT_ADDITIONAL_PACKAGES_PREFIX_PATH 钩子发现
      （kcmutils 6.26.0 / akonadi 25.12.3 先例）。
    - >-
      dbus 版本冲突（本包特有）：libnm/1.58.0 钉 dbus/1.14.10.2，而所有
      FEATURE_dbus=ON 的已发布 Qt6 包（qtbase-sql-dbus/6.11.1、
      qtbase/6.11.1.1/.2/.3）钉 dbus/1.14.10，图无法解析。配方用
      `self.requires("dbus/1.14.10", override=True)` 统一到 qtbase-sql-dbus 的
      发布二进制所依赖的版本（package id 852eddc8… 依赖
      dbus/1.14.10:8f3067d8…）；代价是 libnm/1.58.0 需按 dbus/1.14.10 从源码
      重建（libdbus-1.so.3 ABI 稳定）。反向覆盖会作废整个 Qt Base 二进制，
      不可取。
    - >-
      libnm 头路径：upstream 同时使用 #include <libnm/NetworkManager.h>（10 处）
      与 <NetworkManager.h> / <nm-version.h>（直接位于 include/libnm/）。
      Conan PkgConfigDeps 生成的 libnm.pc 只带 -I<prefix>/include/libnm，
      因此配方在 generate() 里往生成的 libnm.pc 的 Cflags 追加
      -I<prefix>/include（libnm 配方自身对 gio-2.0.pc 用的是同一手法）。
    - >-
      ECM/Qt 路径：qtbase 使用 cmake_find_mode=none，CMakeDeps 不会贡献其
      lib/cmake，配方自行写 conan_cmakedeps_paths.cmake（kconfig 6.26.0 先例）；
      ECM_MODULE_PATH 手动补全（CMakeDeps 版 ECMConfig.cmake 不导出该变量）。
    - >-
      ECM 6.26 的 KDEInstallDirs6 在 configure 期执行 qtpaths：沙箱
      LD_LIBRARY_PATH 里 /data/storage/el1/bundle/libs/arm64 的不兼容
      libc++_shared.so 会遮蔽兼容版本，需前置 /system/lib64
      （bluez-qt 6.28.0 先例，与 kconfig/kwindowsystem 6.26.0 同款修法）。
    - >-
      上游测试：40 项 ctest 中 37 项（autotests/settings/*）是纯值对象测试，
      在 OHOS 上 37/37 通过；3 项（managertest/settingstest/
      activeconnectiontest）通过 fake NetworkManager 走 D-Bus *session* 总线，
      在沙箱内无法运行——AF_UNIX bind 被拒（"Failed to bind socket ...
      Operation not permitted"），唯一能起来的 TCP+ANONYMOUS 总线 QtDBus 用不了
      （实测 connectivity() == UnknownConnectivity）。这 3 项照实运行记录但不阻塞
      （bluez-qt 6.28.0 同口径），详见版本级 MANIFEST.yml / notes.md。
    - >-
      pkg-config：upstream **不安装** .pc（只装 CMake 包
      lib/cmake/KF6NetworkManagerQt/*.cmake）。下游 openKylin kylin-nm-base
      通过 pkg-config 消费，故配方在 lib/pkgconfig/ 额外安装可重定位的
      KF6NetworkManagerQt.pc，并声明 pkg_config_name=KF6NetworkManagerQt。
    - >-
      消费者须知：库名 libKF6NetworkManagerQt，CMake 目标 KF6::NetworkManagerQt，
      pkg-config 名 KF6NetworkManagerQt，头文件在
      include/KF6/NetworkManagerQt/（camel-case 头位于其下的 NetworkManagerQt/）。
      运行时需 LD_LIBRARY_PATH 指向包的 lib/（OHOS musl 不解析 RUNPATH）。

  common_dependencies:
    - "qtbase-sql-dbus/6.11.1"
    - "qtdeclarative/6.11.1"
    - "libnm/1.58.0"
    - "ecm/6.26.0"

# ============================================================
# 版本索引
# ============================================================

versions:
  "6.26.0":
    status: built
    build_date: "2026-09-29"
    conan_ref: "networkmanager-qt/6.26.0"
