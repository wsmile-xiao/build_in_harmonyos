# test_package/MANIFEST.yml
# Upstream and consumer test declaration for networkmanager-qt/6.26.0.

package: networkmanager-qt/6.26.0
homepage: https://invent.kde.org/frameworks/networkmanager-qt

# Upstream test entry point (BUILD_TESTING=ON inside `conan create`).
upstream_check_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: >-
  ctest --test-dir <build_folder> --output-on-failure --no-tests=error --timeout 120
  -E "^(managertest|settingstest|activeconnectiontest)$"
  (then, for the record, -R "^(managertest|settingstest|activeconnectiontest)$")

upstream_tests:
  - file: autotests/settings/
    source: networkmanager-qt-6.26.0/autotests/settings/
    description: >-
      37 value-object autotests (8021xsettingtest ... wirelesssecuritysettingtest)
      for NetworkManager::ConnectionSettings and every NetworkManager::Setting
      subclass (SSID/mode/IPv4/IPv6/VPN/802.1x/... serialisation round-trips).
    command: "ctest (run strictly inside `conan create`)"
    condition: "run in the Conan build with BUILD_TESTING=ON; 37/37 pass on OHOS"
  - file: autotests/managertest.cpp
    source: networkmanager-qt-6.26.0/autotests/managertest.cpp
    description: >-
      Manager/Device integration test driving a fake NetworkManager
      (src/fakenetwork) registered on the *session* D-Bus bus.
    command: "ctest -R '^managertest$' (executed for the record)"
    condition: >-
      OHOS-incompatible environment: needs a QtDBus-usable session bus; see
      "excluded_upstream_tests" below.
  - file: autotests/settingstest.cpp
    source: networkmanager-qt-6.26.0/autotests/settingstest.cpp
    description: >-
      getConnections/addConnection integration test against the fake
      NetworkManager on the session bus.
    command: "ctest -R '^settingstest$' (executed for the record)"
    condition: "OHOS-incompatible environment: see excluded_upstream_tests below."
  - file: autotests/activeconnectiontest.cpp
    source: networkmanager-qt-6.26.0/autotests/activeconnectiontest.cpp
    description: >-
      ActiveConnection activation state-machine test against the fake
      NetworkManager on the session bus.
    command: "ctest -R '^activeconnectiontest$' (executed for the record)"
    condition: "OHOS-incompatible environment: see excluded_upstream_tests below."

# OpenSuSE/KDE CI runs 40/40. On HarmonyOS PC 37/40 pass; the three bus-level
# tests cannot pass in this environment. Per R51 the reason is concrete and
# verified, not "no environment":
excluded_upstream_tests:
  - name: managertest
    reason: >-
      registers a fake NetworkManager on the D-Bus *session* bus. AF_UNIX bind
      is denied in the OHOS sandbox ("Failed to bind socket ... Operation not
      permitted"), so the only startable bus is a TCP bus; QtDBus's sessionBus()
      cannot drive the fake service over it (observed: connectivity() ==
      UnknownConnectivity, addDeviceSpy.wait() == false). Reproduced outside
      Conan by running the built test binary against both bus types.
  - name: settingstest
    reason: "same session-bus limitation as managertest (segfaults once the fake connection is unreachable)."
  - name: activeconnectiontest
    reason: "same session-bus limitation as managertest (blocks waiting for a D-Bus reply, hits the 120 s ctest timeout)."

test_package_tests:
  - file: test_package/test.cpp
    description: >-
      Consumer smoke test: builds a wireless ConnectionSettings + WirelessSetting
      through <NetworkManagerQt/ConnectionSettings>, <NetworkManagerQt/WirelessSetting>,
      <NetworkManagerQt/Manager> and <NetworkManagerQt/SecretAgent>, checks the
      NM key-map round trip (connection / 802-11-wireless) and
      ConnectionSettings::typeFromString(), i.e. the exact API surface the
      downstream openKylin kylin-nm-base chain consumes.
    command: "conan create (test_package builds and runs test_networkmanager_qt)"

assertion_count: 37
