knowledge_gained:
  - "本仓 qtbase/6.11.1 是 FEATURE_dbus=OFF（qtbase 包 requires 为空、无 lib/cmake/Qt6DBus），networkmanager-qt 需要 Qt6DBus 时必须用 qtbase-sql-dbus/6.11.1 或 qtbase/6.11.1.1+。"
  - "libnm/1.58.0 钉 dbus/1.14.10.2，而所有已发布 FEATURE_dbus=ON 的 Qt6 包钉 dbus/1.14.10 → 同一图中必然版本冲突；唯一不重建 Qt Base 的解法是 override 到 dbus/1.14.10 并重建 libnm（其 ABI 兼容）。"
  - "libnm 的头同时以 <libnm/NetworkManager.h> 和 <NetworkManager.h> 两种拼写被引用，而生成的 libnm.pc 只给 -I<prefix>/include/libnm；必须在 generate() 里给生成的 libnm.pc 追加 -I<prefix>/include。"
  - "OHOS 沙箱禁止 AF_UNIX bind（dbus-daemon 报 'Failed to bind socket ... Operation not permitted'），只能用 TCP+ANONYMOUS 总线；QtDBus 的 sessionBus() 在该总线上无法完成 fake 服务注册/信号（connectivity() == UnknownConnectivity），因此所有依赖 session bus 的上游测试在本环境不可运行。"
  - "upstream networkmanager-qt 不安装 pkg-config 文件（只装 CMake 包）；下游经 pkg-config 消费时需在配方里补装 KF6NetworkManagerQt.pc。"
  - "CMake 没有 Platform/HarmonyOS.cmake（E092），而本机 CMAKE_SYSTEM_NAME 即 HarmonyOS：ELF 的 CMAKE_SHARED_LIBRARY_SONAME_{C,CXX}_FLAG 未定义时，CMake 会静默丢弃上游 ECM 已算出的 target VERSION/SOVERSION —— 表现为产物无 DT_SONAME、无 .so.<SOVERSION> 链、导出 targets 里 IMPORTED_NO_SONAME TRUE。最小修法是在 toolchain 里补这两个变量为 '-Wl,-soname,'（与 Linux 平台模块同值），不必把 CMAKE_SYSTEM_NAME 改成 Linux（后者会翻转 CMAKE_CROSSCOMPILING，改变整个 Qt/ECM/KDE 栈的 configure 语义）。"
  - "已发布的 dbus/1.14.10 是静态包（只有 libdbus-1.a）却声明了 expat，PkgConfigDeps 会把 'Requires: expat' 写进生成的 dbus.pc 并传递到 libnm.pc；expat 包里的 libexpat.so 没有 SONAME，于是链接器把 Conan 缓存的绝对路径写进 DT_NEEDED（不可重定位，L5b 判负）。实测 libdbus-1.a 与产物 .so 都不引用任何 expat 符号，因此从生成的 .pc 里删掉这个未被引用的模块即可，无需（也不得）改动 expat 自己的归档。"
