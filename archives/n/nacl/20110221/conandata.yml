# conandata.yml — nacl 20110221
# Upstream publishes exactly one tarball for this release and it is named after the
# version, so the version string is reproducible to that artifact (no tag substitution).
# Verified from the device: same sha256 as the local copy (R39 official source only).

sources:
  "20110221":
    - url: "https://hyperelliptic.org/nacl/nacl-20110221.tar.bz2"
      sha256: "4f277f89735c8b0b8a6bbd043b3efb3fa1cc68a9a5da6a076507d067fc3b3bf8"

patches:
  - patch_file: "patches/0001-clang-compilers.patch"
    patch_description: "okcompilers probe lists are gcc/g++/spu-gcc and AIX-only ar -X64; add clang/clang++ and llvm-ar so the probe finds the OHOS toolchain"
    patch_type: "portability"
  - patch_file: "patches/0002-toybox-find-no-follow.patch"
    patch_description: "do: drop -follow from the api.h discovery find(1); toybox find rejects it, and the release tarball contains no symlinks so the file set is unchanged"
    patch_type: "portability"
  - patch_file: "patches/0003-cpucycles-monotonic-ohos.patch"
    patch_description: "cpucycles/monotonic.c: get the clock rate from osfreq.c with a nanosecond fallback instead of BSD sysctlbyname(machdep.tsc_freq), which has no header on OHOS musl; without a usable cpucycles backend ./do links no try binary and archives zero primitives"
    patch_type: "portability"
  - patch_file: "patches/0004-tests-int-main.patch"
    patch_description: "tests/*.cpp: 20 upstream C++ test programmes declare bare main(), which clang rejects with 'a type specifier is required for all declarations', so 20 of the 53 upstream tests never ran; add the missing int"
    patch_type: "portability"
