conan_ref: "nacl/20110221"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方唯一发布源；版本号本身就是 tarball 文件名，可还原为确切制品（R39）
  url: "https://hyperelliptic.org/nacl/nacl-20110221.tar.bz2"
  sha256: "4f277f89735c8b0b8a6bbd043b3efb3fa1cc68a9a5da6a076507d067fc3b3bf8"
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom   # 上游自带 ./do 探测式构建脚本（无 makefile / configure / cmake）
  configure_options: []

  # 运行期零依赖：nacl 自带 cpucycles/、randombytes/、inttypes/ 三套可移植后端，
  # 全部编进 libnacl.a。制品仓的 libcpucycles/20260625（cpucycles.cr.yp.to）与本库
  # 没有构建关系：本库用的是树内 cpucycles/monotonic.c，导出符号是
  # cpucycles_monotonic*，与外部 libcpucycles 的 cpucycles 指针不同名，不冲突。
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-clang-compilers.patch"            # okcompilers 探测表只有 gcc/g++/spu-gcc 与 AIX ar -X64
  - "0002-toybox-find-no-follow.patch"      # toybox find 不认 -follow（tarball 内无符号链接）
  - "0003-cpucycles-monotonic-ohos.patch"   # cpucycles monotonic 后端改用 osfreq + 纳秒兜底
  - "0004-tests-int-main.patch"             # 20 个上游 C++ 测试写裸 main()，clang 判硬错误

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "nacl 的 ./do 不是 makefile 生成器，而是「探测编译器 → 逐实现编译 → 跑 try 与上游 checksum 文件对拍 → 只把通过且最快的实现归档进 libnacl.a → 跑 tests/ 并与 .out 逐字节对拍」的一体化脚本；它对任何失败都只记日志、始终以 0 退出，所以 create 必须自己断言产物存在，退出码 0 不代表构建成功"
  - "okcompilers/{c,cpp,archivers} 是纯 gcc/spu-gcc/AIX 列表；加一行 clang 即可，但**一行只能有一个编译器**：okcompilers/do 会为 c 表里每个可用的编译器建一个 ABI，多行会把整套构建重复多遍"
  - "OHOS aarch64 上 abiname.c 落到 #else 分支 → 上游把 ABI 归一为 default，include 与 lib 子目录都是 build/<短主机名>/default"
  - "上游 okcompilers/do 的 syslib 循环会为每个成功的库重写 oldbin/oklibs-<abi>，OHOS 下只有 -lm 命中，因此消费链接行必须是 libnacl.a + -lm"
  - "-fwrapv 是必需的：inttypes/crypto_int32.c、crypto_int64.c 的探测程序靠有符号溢出回绕（x+=x 直到 0）判定 int/long 宽度，clang -O2 按 UB 折叠后探测失败，crypto_int32.h/crypto_int64.h 不生成，37 个实现全部编译报错，libnacl.a 只剩 1KB 的桩"
  - "cpucycles 的 monotonic/gettimeofday 后端在 OHOS 都拿不到频率（无 <sys/sysctl.h>，osfreq 读不到 scaling_max_freq/clock_tick/cpu MHz），返回 0 会让 cpucycles/do 判失败 → lib/default/cpucycles.o 缺失 → 所有 try 链接失败 → 一个实现都进不了 libnacl.a。修法：osfreq() 失败时按 CLOCK_MONOTONIC 纳秒 1e9 计"
  - "randombytes 与 cpucycles 是 nacl 树内对象、不归档进 libnacl.a（./do 是 libnacl.a + 两个 .o 的链接方式），配方把两个 .o 用同一个 ar 合入交付的 libnacl.a，消费者只需 -lnacl -lm"
  - "上游 tests/*.cpp 里 20 个文件写 main() 无返回类型：C 侧 clang 只警告（31 个 .c 全部可编），C++ 侧是硬错误 → 不补 int 就只能跑 33/53"

references:
  - "https://nacl.cr.yp.to"
  - "https://hyperelliptic.org/nacl/nacl-20110221.tar.bz2"

