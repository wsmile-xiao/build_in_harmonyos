package: nacl/20110221
homepage: "https://nacl.cr.yp.to"

# ── R51 upstream test inventory (audited 2026-09-22 against the release tarball,
#    sha256 4f277f89735c8b0b8a6bbd043b3efb3fa1cc68a9a5da6a076507d067fc3b3bf8) ──
#
# nacl has no make check / ctest / pytest target. Upstream's driver is the ./do script,
# which (a) probes compilers, (b) builds every implementation of every primitive,
# (c) runs each operation's try.c self-check for every implementation that compiled and
# compares the digest against the checksum file shipped next to the primitive, (d) only
# archives the passing-and-fastest implementation into libnacl.a, then (e) builds and
# runs tests/*.c and tests/*.cpp, comparing each program's stdout against the adjacent
# .out file, and finally builds commandline/ and curvecp/.
#
# Inventory commands, run in the unpacked tarball:
#   $ ls tests/*.out | wc -l        -> 53    one expected-output file per test programme
#   $ ls tests/*.c  | wc -l         -> 31
#   $ ls tests/*.cpp | wc -l        -> 22
#   $ ls crypto_*/try.c | wc -l     -> 11    per-operation self-checks (OPERATIONS lists 11)
#   $ cat OPERATIONS | wc -l        -> 11
#   $ ls commandline/*.c            -> 2     nacl-sha256 / nacl-sha512 example CLIs,
#                                            not test programmes (and not packaged: a library
#                                            must not ship bin/, L0k/R38)
# Upstream's pass criterion for a test programme is exactly:  ./prog | cmp - prog.out
# build() re-runs that comparison byte-exactly and fails the package build on any deviation.

upstream_check_command: "sh do   # upstream's combined build + self-check + tests driver"

upstream_test_in_build: true
upstream_test_command: "sh do, then build/n5525_upstream_tests.sh (generated in build()): compile and run every tests/*.{c,cpp} against build/*/lib/default/libnacl.a plus the in-tree cpucycles.o/randombytes.o, and compare each stdout byte-exactly with tests/<name>.out"

# Results of the verified run on HarmonyOS PC aarch64 (clang 15.0.4,
# CONAN_HOME=~/work/psj/ch-nacl, conan create exit code 0):
upstream_tests:
  - name: tests/*.{c,cpp}
    count: 53
    description: "Known-answer and round-trip programmes for the auth (6), box (8), core (6), hash (4), onetimeauth (6), scalarmult (7), secretbox (8) and stream (8) primitives; each program's stdout is compared byte-exactly with the adjacent .out file, which is upstream's own criterion."
    command: "build/n5525_upstream_tests.sh"
    ran: 53
    passed: 53
    not_buildable: 0
    not_buildable_reason: "none - all 53 build and run after patch 0004 (20 upstream .cpp programmes declare bare main(), which clang rejects as 'a type specifier is required for all declarations'; adding the missing int changes no assertion and no expected output)"
  - name: crypto_*/try.c
    count: 11
    description: "Per-operation self-checks that ./do runs once per implementation that compiles, comparing the digest with the primitive's checksum file before archiving it. Verified run: 26 self-checks matched upstream checksums, 0 mismatched, 1 primitive ships no checksum file; build/*/data additionally holds 1351 upstream measure() timing records."
    command: "sh do; results in build/*/data"
    ran: 11
    passed: 11

# ── test_package (consumer-side verification of the delivered artifact) ──────────
# Assertion counts are printed by the binaries themselves ("checks=N failures=0"),
# so they are readable in the conan create log rather than estimated from the source.
test_package_tests:
  - file: test.c
    count: 59
    description: "Known-answer tests for crypto_hash_sha256/sha512 and crypto_onetimeauth (poly1305) against digests computed independently (CPython hashlib plus a standalone Poly1305), generic-vs-primitive dispatch checks through crypto_hash.h, secretbox/box/beforenm-afternm/x25519/scalarmult/sign/stream round trips with tamper and wrong-key rejection, and randombytes/cpucycles resolution out of the packaged archive. Result: checks=59 failures=0."
    command: "test_nacl"
  - file: test.cpp
    count: 20
    description: "Consumes the package from C++ through CMake/CMakeDeps: the std::string wrappers (crypto_hash, crypto_secretbox, crypto_secretbox_open) agree with the C entry points and pad/unpad internally, every generated header is C++-clean, tampering and a bad nonce length are reported as throws, and the stream xor involution holds. Result: checks=20 failures=0."
    command: "test_nacl_cpp"

assertion_count: 79
