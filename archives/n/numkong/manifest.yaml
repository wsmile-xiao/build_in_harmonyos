software: numkong
display: "NumKong"
description: "Portable mixed-precision math, linear-algebra, and retrieval library with 2000+ SIMD kernels for x86, Arm, RISC-V, LoongArch, Power, and WebAssembly"
category: library
homepage: "https://github.com/ashvardanian/NumKong"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-heavy C library (246 headers) plus the dynamic dispatch shared library libnumkong.so; zero conan dependencies."
    - "OHOS clang 15.0.4 ignores per-function target attributes, so the recipe pins the upstream CMake ISA probes to the armv8-a baseline NEON kernel set (SVE/SME need Clang 16+, matching the upstream compiler support matrix)."
    - "Runtime nk_capabilities() dispatch stays fully functional; both upstream test suites (nk_test 485/485, nk_shared_test 317/317) pass on the HarmonyOS device."
  common_dependencies: []

versions:
  "7.8.1":
    status: published
    conan_ref: "numkong/7.8.1"
    source:
      url: "https://github.com/ashvardanian/NumKong/archive/refs/tags/v7.8.1.tar.gz"
      sha256: "cb5814875b2cee6a843fa458cde3f9684d4ed961f52803a25eb79a5f23a25ce4"
    upstream_test_cases: 485
    test_package_cases: 2
    validation: "OHOS aarch64 conan create with the ohos-aarch64 profile passed; upstream nk_test 485/485 and nk_shared_test 317/317 on device"
