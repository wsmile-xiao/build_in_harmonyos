package: numkong/7.8.1
homepage: "https://github.com/ashvardanian/NumKong"

upstream_check_command: "<build_folder>/nk_test --help"
upstream_test_in_build: true
upstream_test_command: "<build_folder>/nk_test"

upstream_tests:
  - path: test/
    type: C++ ULP-based precision test executable (nk_test, header-only dispatch)
    case_count: 485
    source_case_count: 485
    executed: true
    passed_case_count: 485
    reason: "Full upstream precision suite ran on the OHOS device (aarch64 NEON path): 26 assertion groups (vector/tensor/cast instantiations) plus 459 kernel precision rows, exit code 0, final line 'All tests passed.'."
  - path: test/
    type: C++ ULP-based precision test executable (nk_shared_test, dynamic dispatch library path)
    case_count: 317
    source_case_count: 317
    executed: true
    passed_case_count: 317
    reason: "Upstream shared-library dispatch test suite ran on the OHOS device against libnumkong.so: 26 assertion groups plus 291 kernel precision rows, exit code 0, final line 'All tests passed.'."

test_package_tests:
  - file: test_package.c
    description: "Consumer checks calling libnumkong.so C API: nk_capabilities (NEON expected), nk_dot_f32 = 32, nk_euclidean_f64 = 5, nk_haversine_f64 poles ~20015 km"
    command: "./test_numkong"
    case_count: 1
    assertion_count: 4
  - file: test_headeronly.cpp
    description: "Header-only consumer path: nk_dot_f32 = 10 and nk_f32_sqrt(4) = 2 through installed headers"
    command: "./test_numkong_headeronly"
    case_count: 1
    assertion_count: 2
