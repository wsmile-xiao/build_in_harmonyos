# NumKong 7.8.1 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "7.8.1"
software: "numkong"
status: published
build_date: "2026-09-03"
build_system: cmake

source:
  url: "https://github.com/ashvardanian/NumKong/archive/refs/tags/v7.8.1.tar.gz"
  sha256: "cb5814875b2cee6a843fa458cde3f9684d4ed961f52803a25eb79a5f23a25ce4"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DNK_BUILD_SHARED=ON"
    - "-DNK_BUILD_BENCH=OFF"
    - "-DNK_BUILD_TEST=OFF (W3/CI 之外的上游测试另行实测)"
    - "-DNK_COMPARE_TO_BLAS=OFF"
    - "-DNK_COMPARE_TO_MKL=OFF"
    - "-Dnk_target_*_compiles=FALSE (SVE/SME/NEON 扩展探针锁 NEON 基线)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS clang 15.0.4 忽略 per-function target attribute（unknown architecture 'armv8.x-a+xxx' 警告后忽略），上游 NEON-HALF/SDOT/BFDOT/FHM/SVE/SVE2 内核按属性编译的假设不成立"
  - "上游 CMake ISA 探针用全局 -march=armv8.2-a+sve 编译探针 TU 判定编译器支持 SVE，但分发库 TU 以基线 -march=armv8-a 编译，<arm_sve.h> 报 'SVE support not enabled'"
  - "对策：CMakeToolchain cache_variables 预填 nk_target_*_compiles=FALSE（除 NEON），锁 aarch64 NEON 基线内核集，运行时 nk_capabilities() 分发保持有效"
  - "上游 CMakeLists 注释明确 Float16/SVE per-function 需要 Clang 16+；本平台 clang 15.0.4 与上游支持矩阵一致地降级到 NEON 基线"
  - "库性质：header-heavy C 库（include/numkong/ 246 个头文件）+ 动态分发库（c/*.c 26 个 dispatch TU）；不依赖 numpy，零 conan 依赖（W0 直过）"
  - "musl/libc++_shared 测试二进制运行需 LD_LIBRARY_PATH 指向 OHOS SDK 的 libc++_shared.so 目录"
