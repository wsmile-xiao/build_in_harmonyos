  sha256: "cfcede02c12cfe2fca4465fa3d87c03158202e4606c1ba3db46851dbb0451ccd"
  tar_format: tar.gz

dependencies:
  required: []
  build:
    - "zig/0.15.2 (published to ohpcd; recipe revision 501adb6c2fb136f4a58e15a2cb2d2412, package ID 876049f3ae10a4560da345bb02378e03e212bc8c)"
  optional: []

vendored_zig_deps:
  - "termui 0.2.2 (github.com/fjebaker/termui#9dc6d2fabb2a7305b07f2fc91f12770a321dded0)"
  - "datetime 0.8.0 (github.com/frmdstryr/zig-datetime#3a39a21e6e34dcb0ade0ff828d0914d40ba535f3)"
  - "farbe 0.3.1 (github.com/fjebaker/farbe#fa60dfeaaf049467a9158731bfbf930f0ca29f4e)"
  - "clippy 0.4.0 (github.com/fjebaker/clippy#4eb7b412ce11e89314c3e83feeff9421292b4274)"
  - "fuzzig 0.1.1 (github.com/fjebaker/fuzzig#4251fe4230d38e721514394a485db62ee1667ff3)"
  - "kronos (git.sr.ht/~fjebaker/kronos#a1d77455aeefe0656965548707ceeb6b85ff765e)"
  - "zeit 0.6.0 (github.com/rockorager/zeit#ade14edb2025f5e4a57b683f81c915f70a904e88; transitive dependency of kronos)"

build_config:
  target: aarch64-unknown-linux-ohos
  command: "zig build -j1 --prefix <stage> -Doptimize=ReleaseFast"
  upstream_test_command: "zig build test -j1 --summary all"
  output: "bin/nkt"

patches_applied:
  - "patches/zeit-tzdir-fallback.patch (portability), hunk 1: zeit.loadTimeZone ignored TZDIR when the caller passed a null env map; kronos's test path loads Australia/Perth with env=null, so on a device without system tzdata 3 of 21 upstream tests failed with error.FileNotFound in the first GitCode CI run on this PR. The hunk falls back to the process TZDIR when maybe_env is null; the recipe sets TZDIR to the vendored zoneinfo/ directory during `zig build test`. Verified in WSL: 21/21 pass with TZDIR containing only the vendored Australia/Perth file."
  - "patches/zeit-tzdir-fallback.patch (portability), hunk 2: zeit.local() opened /etc/localtime unconditionally when the caller passed a null env map (kronos startup path), so the packaged binary exited 1 with FileNotFound on every invocation on HarmonyOS (no /etc/localtime); observed in the third CI run as the consumer-test failure `nkt config` → stderr [error]: (default) FileNotFound. The hunk degrades to a fixed UTC zone, mirroring kronos's own 'No local timezone: using UTC' fallback. Verified in WSL by removing /etc/localtime: full consumer workflow green, 21/21 upstream tests unaffected."

vendored_data_files:
  - >-
    zoneinfo/Australia/Perth.b64: Base64 text representation of the 446-byte
    TZif2 tzfile for Australia/Perth (decoded sha256
    025d4339487853fa1f3144127959734b20f7c7b4948cff5d72149a0541a67968),
    extracted from Ubuntu tzdata 2024b-0ubuntu0.22.04.1 (IANA tzdata 2024b,
    public domain). kronos's test build hardcodes this timezone; the device
    ships no zoneinfo database. The tzfile is stored as Base64 because
    GitCode's PR .diff endpoint drops binary patch data, so a binary file
    cannot pass the CI checkout-pr step (git apply) — same workaround as
    clzip 1.16's test fixture. The recipe decodes it into the build folder
    and enforces the sha256 before use; it is IANA time zone data consumed
    at test time, not a precompiled binary (R19).

package_identity:
  note: >-
    Upstream project and output binary are both named `nkt`. The package
    directory is `archives/n/nkt/0.3.1` with `name = "nkt"`, matching the
    task branch `feat/nkt-0.3.1` required by CI gate L0n (R40). Task
    contrib-7176 identifies the upstream through the Homebrew formula `nkt`
    0.3.1; the formula description ("BibLaTeX database TUI") is stale — the
    0.3.1 release tarball is the terminal note-taking tool described in the
    upstream README, and the source URL and sha256 match the formula exactly.

upstream_quirks:
  - >-
    `nkt --version` and `nkt --help` exit 0 but print nothing: the early
    return path in nkt_main never flushes the buffered writer before
    std.process.exit. Version and help are reported by the `config` and
    `help` subcommands instead (both flushed by the command executor). CI
    gate L2 checks the exit code only, so it is unaffected; test_package
    uses the subcommands.

test_results:
  type: "local Linux native run (WSL Ubuntu x86_64, zig 0.15.2); GitCode CI HarmonyOS aarch64 run passed (build #54560, worker OpenHarmonyPCDeveloper-CI-031, 2026-09-21)"
  total: 21
  passed: 21
  failed: 0
  note: >-
    Local verification (2026-09-21): `zig build test --summary all` reports
    21/21 tests passed under both TZ=UTC and TZ=Asia/Shanghai, and 21/21
    with the zeit TZDIR patch active and TZDIR pointing at a zoneinfo
    directory containing only the vendored Australia/Perth tzfile (device
    conditions simulated); cross-compile `zig build
    -Dtarget=aarch64-linux-musl -Doptimize=ReleaseFast` succeeds; the
    packaged binary passes the consumer workflow (config/help/init/tag/
    log/read/ls) on Linux x86_64 both with a system localtime and with
    /etc/localtime removed (UTC fallback, exact device conditions). CI
    history: run 1 failed 3/21 (kronos test timezone lookup, fixed by
    patch hunk 1); run 2 failed checkout-pr (binary tzfile not
    representable in the GitCode PR .diff, fixed by Base64 text); run 3
    passed 21/21 but the consumer test hit the packaged binary's
    missing-/etc/localtime startup failure (fixed by patch hunk 2). The
    fourth run (build #54560, worker OpenHarmonyPCDeveloper-CI-031,
    2026-09-21) passed on device: 21/21 upstream tests
    (HMBS_UPSTREAM_TEST_RESULT) and the full test_package consumer
    workflow green.

