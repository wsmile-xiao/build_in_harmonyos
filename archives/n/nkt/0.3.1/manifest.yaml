  zig_upstream_tests: "PASS (21/21 locally, Linux x86_64, both UTC and Asia/Shanghai; GitCode CI HarmonyOS aarch64 build #54560 device run 21/21, 2026-09-21)."
  test_package: "PASS (local Linux x86_64 end-to-end; GitCode CI HarmonyOS aarch64 build #54560 device run, 2026-09-21)."

