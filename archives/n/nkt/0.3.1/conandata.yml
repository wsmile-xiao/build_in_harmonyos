patches:
  - patch_file: "patches/zeit-tzdir-fallback.patch"
    patch_description: "zeit: two portability hunks for systems without a system tzdata (HarmonyOS). (1) loadTimeZone falls back to the process TZDIR when the caller passes a null env map, so kronos's hardcoded test timezone (Australia/Perth) can load from the recipe-vendored zoneinfo directory. (2) local() degrades to a fixed UTC zone when /etc/localtime is missing, so the packaged binary does not exit 1 on every invocation (kronos calls local() with a null env map during startup; the TZ env var is therefore never consulted and the missing /etc/localtime made nkt fail with FileNotFound before running any subcommand)"
    patch_type: "portability"
