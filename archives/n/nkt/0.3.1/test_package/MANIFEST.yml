package: nkt/0.3.1
homepage: "https://git.sr.ht/~fjebaker/nkt"

upstream_check_command: "zig build test -j1 --summary all"
upstream_test_in_build: true
upstream_test_command: "zig build test -j1 --summary all"

upstream_tests:
  - name: "Zig unit-test suite"
    command: "zig build test -j1 --summary all"
    integrated: true
    declared_tests: 21
    source_files: 9
    note: >-
      21 test declarations across 9 files: src/test/main.zig (readme, smoke)
      exercise the full command surface (help/init/config/new tag/log/task/
      ls/read/edit) against a temporary root; processing/searching/selections/
      utils/Root/tags/Tasklist contribute the remaining unit tests. kronos
      uses a fixed timestamp under builtin.is_test, so the suite is
      deterministic (verified 21/21 under both TZ=UTC and TZ=Asia/Shanghai
      on Linux x86_64 with zig 0.15.2).

test_package_tests:
  - file: test_nkt.py
    description: "Runs nkt config and asserts the exact packaged version 0.3.1 and schema 0.5.0."
    command: "python test_nkt.py <nkt> <workdir>"
  - file: test_nkt.py
    description: "Runs nkt help and verifies the reference lists ten core commands."
    command: "python test_nkt.py <nkt> <workdir>"
  - file: test_nkt.py
    description: "Initializes an isolated NKT_ROOT_DIR with nkt init and checks config.json is created."
    command: "python test_nkt.py <nkt> <workdir>"
  - file: test_nkt.py
    description: "Creates a tag with nkt new tag smoketag."
    command: "python test_nkt.py <nkt> <workdir>"
  - file: test_nkt.py
    description: "Logs an entry with nkt log into the default diary journal."
    command: "python test_nkt.py <nkt> <workdir>"
  - file: test_nkt.py
    description: "Reads the journal back with nkt read and asserts the logged text."
    command: "python test_nkt.py <nkt> <workdir>"
  - file: test_nkt.py
    description: "Lists collections with nkt ls and asserts the journal and tasklist sections."
    command: "python test_nkt.py <nkt> <workdir>"

assertion_count: 21
