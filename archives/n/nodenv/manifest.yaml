software: nodenv
# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件描述（一句话）
description: "Node.js version manager similar to rbenv"

# 主页 URL
homepage: "https://github.com/nodenv/nodenv"

# 分类（用于依赖排序）
# build-tool | language | library | utility | system
category: language

# ============================================================
# 版本索引（软件级维护）
# ============================================================

# 已编译版本列表
versions:
  - version: "1.6.2"
    status: built
    build_date: "2026-06-05"
    tarball: "nodenv-1.6.2-ohos-aarch64.tar.gz"
    patches:
      - "0001-libexec-nodenv.patch"

# ============================================================
# 依赖信息
# ============================================================

# 运行时依赖
runtime_deps: []
# 例如:
# - node-build (nodenv 需要 node-build 来编译 Node.js 版本)

# ============================================================
# 知识沉淀
# ============================================================

# 软件级知识
software_knowledge:
  - "纯 shell 薄本项目，无 configure/make 流程"
  - "需要修改 libexec/nodenv 中的路径前缀"
  - "不支持 G0 干净构建验证（无构建系统）"