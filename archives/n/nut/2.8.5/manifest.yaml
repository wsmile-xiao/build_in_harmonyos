knowledge_gained:
  - "NUT 2.8.5 ships generated Autoconf 2.71 files, so no autoreconf bootstrap is needed; ref: archives/n/nut/2.8.5/notes.md"
  - "The release config.guess/config.sub do not recognize linux-ohos and need per-file portability patches; ref: archives/n/nut/2.8.5/notes.md"
  - "The first package scope can be dependency-free by selecting only the software-only dummy-ups driver and disabling optional integrations; ref: archives/n/nut/2.8.5/notes.md"
  - "HarmonyOS HMDFS requires TMPDIR under the user home; config.guess keeps secure umask 077 paths while configure scopes umask 022 to linux-ohos config.status scratch directories; ref: archives/n/nut/2.8.5/notes.md"
  - "HMDFS can reject direct execution of unpacked Autotools scripts even when chmod is attempted; invoke configure through /system/bin/sh on OHOS; ref: archives/n/nut/2.8.5/notes.md"
  - "The OHOS CI profile exposes clang/clang++ by absolute path but needs /data/service/hnp/bin plus llvm-ar/llvm-ranlib for Autotools archive detection; ref: archives/n/nut/2.8.5/notes.md"
  - "configure detects getpass/getpassphrase and proto.h supplies a feature-gated portable fallback when both are absent; ref: archives/n/nut/2.8.5/notes.md"
  - "OHOS/HMDFS rejects the generated tests/hidparser.c symlink; the linux-ohos rule refreshes a copied source on every invocation; ref: archives/n/nut/2.8.5/notes.md"
  - "The docs/man preparation rule hardcodes ln -fs even when configure selects LN_S=cp -pR on OHOS; the patch routes it through LN_S; ref: archives/n/nut/2.8.5/notes.md"
  - "The top-level docs preparation rule also hardcodes ln -fs; it now routes through LN_S on OHOS; ref: archives/n/nut/2.8.5/notes.md"
  - "The data driver-list validation hooks directly executed a shell script; they now invoke it through SHELL on OHOS; ref: archives/n/nut/2.8.5/notes.md"
  - "The Windows workstation lacks the OHOS clang/make/device profile, but the isolated Shadow CI run completed conan create, upstream make check, package validation, and test_package successfully; ref: archives/n/nut/2.8.5/notes.md"
  - "Path B candidate: generated Autotools rule audit, HNP tool PATH closure, and package-layout-aware consumer validation are documented in the reusable knowledge draft; final recognition remains subject to review."

knowledge_ref:
  - "archives/n/nut/2.8.5/notes.md"

