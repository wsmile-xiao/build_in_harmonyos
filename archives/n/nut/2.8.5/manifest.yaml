  novelty: "将生成 Autotools 规则审计、HNP 工具 PATH 闭环、真实 Conan package tree 检查和 make check/test_package 证据串成可迁移的 OHOS 上游测试适配方法。"
  differs_from:
    - "E007/E011 分别覆盖平台识别和 HMDFS configure 临时目录，本草稿关注配置后递归规则与完整测试闭环。"
    - "E018/E079 覆盖链接限制，本草稿关注 LN_S 变量未被手写 Makefile 规则使用时的审计和修复边界。"
    - "E093 覆盖 getpass 缺失，本草稿不把 getpass fallback 作为新增知识，而以 make check、工具环境和消费者契约为新增点。"
