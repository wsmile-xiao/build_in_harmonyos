package: nut/2.8.5
homepage: "https://networkupstools.org/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/nutlogtest.c
    description: "NUT logging and formatted error behavior"
    command: "make check"
  - file: tests/nuttimetest.c
    description: "NUT time helper unit test"
    command: "make check"
  - file: tests/nutbooltest.c
    description: "NUT boolean helper unit test"
    command: "make check"
  - file: tests/driver_methods_utest.c
    description: "Driver method behavior test using the dummy driver support"
    command: "make check"

test_package_tests:
  - file: test_nut.sh
    description: "Runs the packaged upsc and upsd binaries for version and help output"
    command: "sh test_nut.sh"

assertion_count: 8
