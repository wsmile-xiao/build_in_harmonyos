# 版本级 manifest — nuraft 3.0.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.0"
software: "nuraft"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-12"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 主源码（R39: 官方 GitHub tag）
  url: "https://github.com/eBay/NuRaft/archive/refs/tags/v3.0.0.tar.gz"
  sha256: "073c3b321efec9ce6b2bc487c283e493a1b2dd41082c5e9ac0b8f00f9b73832d"
  tar_format: tar.gz

  # vendored ASIO（上游 prepare.sh 指定版本）
  asio_url: "https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-24-0.tar.gz"
  asio_sha256: "cbcaaba0f66722787b1a7c33afe1befb3a012b5af3ad7da7ff0f6b8c9b7a8a5b"

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DDISABLE_SSL=1"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 适配过程探针验证核心库/测试/消费者均一次编译通过，无源码补丁
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "eBay/NuRaft 公共头文件用 pimpl 隐藏 asio.hpp（asio_service.hxx fwd decl），消费者只需 nuraft 头文件，vendored asio 仅在库内部编译用"
  - "DISABLE_SSL=1 → SSL_LIBRARY_NOT_FOUND 宏，src/asio_service.cxx 有 9 处 #ifdef 条件编译，SSL 代码整体排除，免 openssl 依赖"
  - "上游 CMake 强制同时构建 static_lib/shared_lib（CLEAN_DIRECT_OUTPUT）；静态模式下 package 后删 .so 保证包内仅 .a"
  - "静态库消费者链接需求：-lnuraft -ldl -lz -pthread"

patch_generation:
  method: none
  patches_count: 0

patch_classification: []