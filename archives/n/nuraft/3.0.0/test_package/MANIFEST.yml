# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nuraft/3.0.0
homepage: "https://github.com/eBay/NuRaft"

# 上游测试命令: CMake CTest 注册 12 个测试目标
# (raft_server_test/new_joiner_test/failure_test/asio_service_test[SKIP]/
#  asio_service_stream_test/stream_functional_test[SKIP]/raft_bench/buffer_test/
#  serialization_test/timer_test/strfmt_test/stat_mgr_test/logger_test)
upstream_check_command: "ctest -N"

# conanfile.py build() 中是否已集成上游测试 (配方默认 build_tests=False)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (HOS aarch64 实测 10/10 通过; asio_service_test 与
# stream_functional_test 上游 CMakeLists 显式 SKIP; raft_bench 为 benchmark 非测试)
upstream_tests:
  - file: tests/unit/raft_server_test.cxx
    source: NuRaft-3.0.0/tests/unit/raft_server_test.cxx
    description: "Basic Raft replication/leader election (fake network)"
    command: "./raft_server_test --abort-on-failure"
  - file: tests/unit/new_joiner_test.cxx
    source: NuRaft-3.0.0/tests/unit/new_joiner_test.cxx
    description: "New server join cluster test"
    command: "./new_joiner_test --abort-on-failure"
  - file: tests/unit/failure_test.cxx
    source: NuRaft-3.0.0/tests/unit/failure_test.cxx
    description: "Failure recovery & conflict resolution test"
    command: "./failure_test --abort-on-failure"
  - file: tests/unit/asio_service_stream_test.cxx
    source: NuRaft-3.0.0/tests/unit/asio_service_stream_test.cxx
    description: "ASIO network stream functionality test"
    command: "./asio_service_stream_test --abort-on-failure"
  - file: tests/unit/buffer_test.cxx
    source: NuRaft-3.0.0/tests/unit/buffer_test.cxx
    description: "Buffer module unit test"
    command: "./buffer_test --abort-on-failure"
  - file: tests/unit/serialization_test.cxx
    source: NuRaft-3.0.0/tests/unit/serialization_test.cxx
    description: "Serialization unit test"
    command: "./serialization_test --abort-on-failure"
  - file: tests/unit/timer_test.cxx
    source: NuRaft-3.0.0/tests/unit/timer_test.cxx
    description: "Timer module unit test"
    command: "./timer_test --abort-on-failure"
  - file: tests/unit/strfmt_test.cxx
    source: NuRaft-3.0.0/tests/unit/strfmt_test.cxx
    description: "String format unit test"
    command: "./strfmt_test --abort-on-failure"
  - file: tests/unit/stat_mgr_test.cxx
    source: NuRaft-3.0.0/tests/unit/stat_mgr_test.cxx
    description: "Stats manager unit test"
    command: "./stat_mgr_test --abort-on-failure"
  - file: tests/unit/logger_test.cxx
    source: NuRaft-3.0.0/tests/unit/logger_test.cxx
    description: "Logger unit test"
    command: "./logger_test --abort-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_nuraft.cpp
    description: "消费者 Raft 冒烟：3 节点 in-memory 集群 (asio 回环)，leader 选举 + add_srv 扩展 + 日志复制 + commit index 前进"
    command: "./test_nuraft"

# 测试断言总数 (test_package 实际断言数: leader 选举/加节点返回检查/commit 前进 等 12 项)
assertion_count: 12