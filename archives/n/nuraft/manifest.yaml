software: nuraft
display: "NuRaft"
description: "C++ implementation of Raft core logic as a replication library (eBay/NuRaft)"
category: library
homepage: "https://github.com/eBay/NuRaft"
license: Apache-2.0
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "CMake 交叉编译：非 WITH_CONAN 模式 + vendored ASIO（asio-1-24-0，上游 prepare.sh 指定版本）"
    - "DISABLE_SSL=1：SSL_LIBRARY_NOT_FOUND 条件编译排除 SSL 代码，免 openssl 依赖"
    - "公共头文件用 pimpl 隐藏 asio.hpp 依赖（asio_service.hxx），消费者无需 asio 头文件"
    - "静态库链接需求 -ldl -lz -pthread，包内 cpp_info.system_libs 已声明"
    - "上游测试自研轻量断言框架（非 googletest），fake_network 模拟网络，HOS aarch64 实测 10/10 通过"
    - "examples 不编进产物（BUILD_EXAMPLES=OFF）；test_package 自带 3 节点 in-memory 集群冒烟（真实 asio 回环）"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "3.0.0":
    status: built
    build_date: "2026-09-12"