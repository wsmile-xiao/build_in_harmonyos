package: nrpe/4.1.3
homepage: "https://www.nagios.org/"
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"
upstream_tests:
  - file: "test-wrapper"
    source: "nrpe-4.1.3/test-wrapper"
    description: "上游 Travis 时代集成脚本入口（test-wrapper → travis-test-1，注释自述 Replace this once test is working properly）；未接入任何 make 目标（仓库无 make check 目标），且脚本依赖 root + nagios 系统用户 + /usr/local/nagios 路径，OHOS 沙箱不可执行 → 无可用上游用例，如实计 0"
    command: "./test-wrapper"
test_package_tests:
  - file: "test.sh"
    description: "鸿蒙无头冒烟三件套：nrpe -V 版本断言 / nrpe -f -n 起 127.0.0.1 高位端口 + check_nrpe 连通断言 / check_nrpe -c check_echo 远端命令执行断言 + SIGINT 正常 shutdown"
    command: "bash test.sh"
assertion_count: 3