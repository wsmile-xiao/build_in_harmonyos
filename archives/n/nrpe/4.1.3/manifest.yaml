software: nrpe
# 版本级 manifest — nrpe 4.1.3（HarmonyOS PC 适配）
# 遵循 ARCHIVE-SPEC v2.0

version: "4.1.3"
status: built
build_date: "2026-09-12"
build_system: autotools

source:
  url: "https://github.com/NagiosEnterprises/nrpe/releases/download/nrpe-4.1.3/nrpe-4.1.3.tar.gz"
  sha256: "5a86dfde6b9732681abcd6ea618984f69781c294b8862a45dfc18afaca99a27a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
    - "--with-ssl=<私有prefix>"
    - "--with-ssl-inc=<私有prefix>/include"
    - "--with-ssl-lib=<私有prefix>/lib"
    - "--enable-ssl"
    - "--enable-command-args"
    - "--disable-tcpd"
    - "--with-nrpe-user/--with-nrpe-group/--with-nagios-user/--with-nagios-group=<当前构建用户>"
  dependencies:
    - openssl/3.5.8.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.sub-ohos.patch"
  - "0002-configure-umask.patch"

knowledge_gained:
  - "nrpe 4.1.3 自带 config.sub（2014-11-04 版）不识别 ohos，需两处加 linux-ohos* 分支（KERNEL-OS 组合段 + basic OS 类型段）；config.guess 无法识别 HarmonyOS → 显式 --build/--host=aarch64-linux-ohos"
  - "configure 含 4 处 umask 077 && mktemp -d（HMDFS 权限问题），需 patch 改 022（ngircd 2 处、asterisk 同款，nrpe 是 4 处）"
  - "AX_NAGIOS_GET_SSL 宏：指定 --with-ssl-inc/--with-ssl-lib 后 try_pkg_config=0 走显式路径搜索（libssl.so/a + openssl/ssl.h）；不指定时 --libexecdir 默认被 ax_nagios_get_paths 强制改写为 /usr/nagios —— 必须显式 --libexecdir 指向私有路径"
  - "install 用 -o nrpe_user -g nrpe_group（默认 nagios 用户不存在且普通用户无法 chown）→ 必须 --with-*-user/group=<当前用户>"
  - "NRPE daemon 拒绝以 root(0) 运行（check_privileges），drop_privileges 解析 nrpe_user/group 需真实存在的用户（OHOS 无 nobody/nagios）→ 冒烟配置用当前用户"
  - "nrpe -f（no-forking 前台）+ -n（no-SSL）可做无头 daemon 冒烟；check_nrpe -H/-p/-n/-c 客户端断言；daemon 默认响应 _NRPE_CHECK 返回版本字符串"
  - "openssl 3.x 走 AUTO_SSL_DH（SSL_CTX_set_dh_auto），无需外部 openssl 二进制生成 dh.h；need_dh=yes 时 configure 会编译并运行 conftest 探测 openssl 版本（本机/CI 同为 aarch64 OHOS 可运行）"
  - "上游无接入构建的自动化测试（仓库无 make check 目标；test-wrapper→travis-test-1 为 Travis 时代独立脚本，需 root + nagios 系统用户 + /usr/local 路径，OHOS 沙箱不可执行），冒烟兜底在 test_package"

patch_generation:
  method: per-file-diff
  source_orig_dir: /storage/Users/currentUser/Hawkninja/learninglog/20260912nrpe-4.1.3/scratch/nrpe-4.1.3.orig
  source_work_dir: /storage/Users/currentUser/Hawkninja/learninglog/20260912nrpe-4.1.3/scratch/nrpe-4.1.3
  patches_count: 2

patch_classification:
  - file: 0001-config.sub-ohos.patch
    type: manual
    platform_only: True
    guard: 'pending'
  - file: 0002-configure-umask.patch
    type: manual
    platform_only: True
    guard: 'pending'