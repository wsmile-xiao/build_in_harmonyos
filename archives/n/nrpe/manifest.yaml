# 软件级 manifest — nrpe
# 遵循 ARCHIVE-SPEC v2.0

software: nrpe
display: "NRPE"
description: "Nagios Remote Plugin Executor：远端监控代理守护进程（nrpe）+ 客户端（check_nrpe）"
category: network
homepage: "https://www.nagios.org/"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "config.sub（2014 版）需 patch 加 linux-ohos* 分支（两处）；config.guess 无法识别 HarmonyOS → 显式 --build/--host=aarch64-linux-ohos"
    - "configure 内 4 处 umask 077 需改 022（HMDFS 权限问题）"
    - "openssl 硬依赖：AX_NAGIOS_GET_SSL 显式 --with-ssl-inc/--with-ssl-lib 路径搜索命中；依赖注入 build_folder 私有 prefix（R49）"
    - "install 用 -o nrpe_user（默认 nagios 不存在）→ --with-*-user/group=<当前构建用户>；libexecdir 默认被改写 /usr/nagios → 必须显式指定"
    - "tcp wrappers 可选 → --disable-tcpd 裁剪"
    - "纯可执行 daemon+client：package_type=application，sbin/ 与 libexec/ 折叠到 bin/"
    - "冒烟：-f（no-forking）+ -n（no-SSL）+ 127.0.0.1 高位端口 + check_nrpe 连通/命令执行断言 + SIGINT 正常 shutdown"
  common_dependencies:
    - openssl

versions:
  "4.1.3":
    status: built
    build_date: 2026-09-12