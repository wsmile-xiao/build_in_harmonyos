# conandata.yml — nemo-image 6.6.0
#
# nemo-image 对应上游 linuxmint/nemo-extensions 6.6.0 发版 tag 中的
# nemo-image-converter 组件（Nemo 文件管理器的图像缩放/旋转上下文菜单
# 扩展，C/meson）。上游 tarball 是 14 个组件的统一发版仓库；本配方只
# 构建 nemo-image-converter 子目录（官方源，R39）。
sources:
  url: "https://github.com/linuxmint/nemo-extensions/archive/refs/tags/6.6.0.tar.gz"
  sha256: "ab610011ea77b00ba760fd151546f271ac92b525fcf1e4b603fbf46b85c3be30"

# nemo-image-converter 编译/链接需要 libnemo-extension（上游由 nemo 主包
# 提供，制品仓无该包）。libnemo-extension 是独立 ABI 库（仅依赖
# glib+gtk），其源码位于 nemo 主包源码树 libnemo-extension/ 子目录且可
# 独立编译。此处按 abletonlink/asio 先例以 conandata 自定义键单独拉取
# 官方 nemo 6.6.0 tarball，构建 vendored 精简子集（本扩展实际用到的
# 5 个 .c + 接口头），与扩展模块一起交付。
nemo_extension_sources:
  url: "https://github.com/linuxmint/nemo/archive/refs/tags/6.6.0.tar.gz"
  sha256: "aa3dc91f848b7c0e6533196bbedf2b4755bed09cd60c7c3271e5a6bce8730014"

patches: {}
