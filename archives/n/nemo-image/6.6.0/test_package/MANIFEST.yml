# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 上游测试三步法 + 积分赛测试用例对比口径）
# 详见: docs/TEST_QUALITY_SPEC.md

package: nemo-image/6.6.0
homepage: "https://github.com/linuxmint/nemo-extensions"

# ── 上游测试清点（R51 / 积分赛口径）───────────────
# nemo-image（nemo-extensions 6.6.0 的 nemo-image-converter 组件）发布包
# 不含任何自动化测试：
#   - 组件全树（src/ 4 个 .c + data/ 2 个 .ui）逐一核查无 TESTS /
#     test() 目标声明（meson.build 仅声明一个 library() 构建目标，
#     无 test()、无 tests/ 目录）
#   - 源码无 *test*.c 单元测试源文件（find -iname '*test*' 零命中）
#   - 无 ctest/其他框架注册（纯 C/meson 项目，上游 meson.build 无
#     test 阶段）
# 故上游测试统计：单元测试 0 / 集成测试 0 / 其他测试 0，合计 N = 0。
upstream_check_command: "meson test -C build"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── 适配后测试（积分赛补全口径）────────────────────
# 上游无测试用例 → 适配后由本包补全 11 条实断言（随 conan create 执行）：
#   契约冒烟 5 条 —— g_module_open 真实加载扩展模块（验证
#     libnemo-extension.so.1 → glib proxy libintl → gtk3 闭包的
#     DT_NEEDED 链在本平台可解析）；Nemo 扩展三入口符号
#     (nemo_module_initialize/shutdown/list_types) 可解析；
#     nemo_module_list_types() 实调用返回 1 个 GObject 类型；
#     宿主驱动注册符合性（AI 检视 P3）—— 自建最小 GTypeModule 子类
#     传入 nemo_module_initialize() 触发上游真实类型注册流，
#     g_type_is_a() 断言注册类型同时实现 NemoMenuProvider 与
#     NemoNameAndDescProvider 双接口（类型名字符串断言因平台 glib
#     裁掉 g_type_get_name() 不可行，已在测试内注释说明缺口）；
#     vendored libnemo-extension.so 可独立加载
#   ABI 符号 6 条 —— 扩展模块实际调用的 6 个 libnemo-extension 符号
#     (nemo_file_info_get_mime_type / get_uri_scheme / list_copy /
#     nemo_menu_item_new / nemo_menu_provider_get_type /
#     nemo_name_and_desc_provider_get_type) 逐一 g_module_symbol 验证
test_package_tests:
  - file: test_module.c
    description: >
      GModule 真实加载链 + Nemo 扩展入口契约 + 宿主驱动注册符合性 +
      vendored ABI 符号验证，共 11 断言（5 加载/契约/符合性 + 6 ABI 符号）。
    command: "test_module <package_folder>"

# 测试断言总数（5 契约 + 6 符号 = 11）
assertion_count: 11
