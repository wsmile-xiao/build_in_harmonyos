# MANIFEST.yml — test_package for nxp-mfgtools 1.5.243
package: nxp-mfgtools
version: 1.5.243
test_type: binary_exists
description: |
  Verifies the uuu binary is properly built and installed.
  The uuu binary requires USB hardware (libusb_init in a global constructor)
  which is not available on all platforms, so the test verifies the binary
  exists and is a valid ELF executable rather than executing it.
upstream_tests:
  - name: "uuu --version"
    upstream_behavior: "Prints version string and exits"
    adapted_behavior: "Binary crashes on platforms without USB hardware (libusb_init fails in global constructor). Test verifies binary existence instead."
