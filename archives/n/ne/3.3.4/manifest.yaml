software: ne
version: "3.3.4"
status: published
compile_date: "2026-09-11"
build_system: makefile

source:
  url: "https://github.com/vigna/ne/archive/refs/tags/3.3.4.tar.gz"
  sha256: "6958b5cd051d85dcdebbf45aeed2af077346a58d1d18ad14e1db477ce5519d29"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - ncurses/6.4 (conan, static libncursesw.a + terminfo database)
  cc: clang
  build_command: "make -C src -j2 CC=$CC NE_GLOBAL_DIR=$PREFIX/share/ne OPTS=\"-I<ncurses>/include\" LIBS=\"-L<ncurses>/lib -lncursesw\""

patches_applied:
  - "0002-makefile-no-regen.patch"
  - "generated_sources (ne-src-raw branch tarball, fetched & copied in source())"

knowledge_gained:
  - "ne 上游把 9 个源文件（enums.h/ext.c/hash.c/hash.h/help.c/help.h/names.c/names.h/version.h）标记为生成物（src/.gitignore），由 makeinfo -D autohelp ne.texinfo + perl info2src.pl 从文档生成——tag tarball 不含这些文件，CI 无 texinfo 时必须预生成进包（conandata generated_sources 第二源，托管于本仓库 ne-src-raw 分支）"
  - "makeinfo 可用 GNU texinfo 7.3 源码树 tta/perl/texi2any.pl 直接运行（手工 sed 生成 Texinfo/ModulePath.pm：@enable_xs@=no/@CONVERTER@=texi2any 等），无需 configure/编译"
  - "ne 非 tty stdin 直接 abort（ne.c:381 freopen(\"/dev/tty\") 失败即 abort）——自动化测试必须用 pty（python pty.fork + select）；macro 模式 --macro FILE 提供非交互编辑能力，宏命令 InsertString/Replace/Save/Exit 均可远程驱动"
  - "OHOS /usr/share/terminfo 仅有极简条目；ncurses/6.4 conan 包自带完整 terminfo 数据库（share/terminfo 2868 条），终端类应用应在 package() 阶段复制 terminfo 并在 package_info 定义 TERMINFO/TERMINFO_DIRS runenv"
  - "上游版本宏 VERSION_STRING 含编译日期（version.pl 用当日日期）——预生成 version.h 需用上游 tag 真实日期（NEWS: 3.3.4 2025-02-06）保证可复现性"

patch_generation:
  method: git-diff-clean-tree
  source_orig_dir: ~/huawei/tmp/ne-src/ne-clean2/ne-3.3.4
  generated_at: '2026-09-11'
  patches_count: 1
  note: '0001-generated-sources.patch (3942 lines) was first converted to prebuilt.tar.gz on 2026-09-11 to shrink the reviewable diff; the binary archive broke the CI worker git-apply checkout (missing binary patch data), so the 9 files are now hosted on the ne-src-raw branch (raw.gitcode.com archive tarball, clp-src-raw pattern) and fetched as a conandata generated_sources entry. Content byte-identical to the original patch (git apply + cmp verified)'

patch_classification:
  - file: 0002-makefile-no-regen.patch
    type: build-system-prerequisite
    platform_only: false
    guard: 'generated-sources-no-texinfo'
  - file: generated_sources (ne-src-raw branch tarball via raw.gitcode.com)
    type: build-system-prerequisite
    platform_only: false
    guard: 'generated-sources-no-texinfo'

testing:
  upstream:
    has_test_suite: true
    test_type: "fuzz-macro (src/test.rc + ruby src/test.rb, requires NE_TEST=1 NE_DEBUG=1 build + ruby)"
    registered_targets: 0
    notes: "上游 makefile 无注册 test 目标；test.rc/test.rb 是手动回归工具（随机宏 fuzz + undo/redo 一致性对比），需 ruby 与插桩构建，CI 不可复现。适配后以 pty 宏回归替代（见 test_package）"
  adapted:
    test_package:
      tests:
        - "--version smoke"
        - "--help options"
        - "macro InsertString+Save+Exit round-trip (pty)"
        - "macro Replace round-trip (pty)"
      result: "4/4 passed (local)"

artifacts:
  - ne binary (statically linked against conan ncursesw, dynamically linked libc/libc++ system runtime)

terminfo_runtime:
  database: "share/terminfo (copied from ncurses/6.4, 2868 entries incl. ansi/xterm/screen/vt100/linux)"
  env: "TERMINFO + TERMINFO_DIRS defined in runenv_info"
