# conandata.yml — ne 3.3.4
# Upstream: https://github.com/vigna/ne (official site ne.di.unimi.it redirects here)

sources:
  url: "https://github.com/vigna/ne/archive/refs/tags/3.3.4.tar.gz"
  sha256: "6958b5cd051d85dcdebbf45aeed2af077346a58d1d18ad14e1db477ce5519d29"

# Generated sources, fetched as a second source (CI workers have no texinfo):
# the 9 files upstream generates from ne.texinfo via makeinfo + info2src.pl
# (src/enums.h, ext.c, hash.c, hash.h, help.c, help.h, names.c, names.h,
# version.h) are gitignored upstream and absent from the tag tarball. They are
# pre-generated locally and hosted on the ne-src-raw branch of this repository
# (raw.gitcode.com archive URL, same pattern as clp 1.17.10 clp-src-raw), then
# copied into src/ by source() after sha256 verification. A ~4000-line text
# patch was used previously; the hosted-source approach keeps the reviewable
# diff small (and binary files cannot pass the CI worker's git-apply checkout).
generated_sources:
  url: "https://raw.gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/archive/refs/heads/ne-src-raw.tar.gz"
  sha256: "0bcef5d84506c2fdd25d6acd323f9b2af83456e084e7bea68ef0f1528c7b6dda"

patches:
  - patch_file: "patches/0002-makefile-no-regen.patch"
    patch_description: "Remove makefile rules that regenerate the generated sources via makeinfo + perl info2src.pl (no texinfo on CI workers); the pre-generated files from the generated_sources entry are used directly"
    patch_type: "portability"
    sha256: "1674f3b2ecb64a7d27920c28f05eca12e1c8cb78e325295111ffe91119968dd5"
