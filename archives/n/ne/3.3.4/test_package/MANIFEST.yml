# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: ne/3.3.4
homepage: "https://github.com/vigna/ne"

# Upstream has no make-registered test target. Testing is done via
# src/test.rc + src/test.rb: a ruby-generated random macro (fuzz) that
# makes arbitrary edits, saves, undoes all, saves again, redoes and saves;
# the undone file must be byte-identical to the original. This requires
# an NE_TEST=1 NE_DEBUG=1 build and ruby; not reproducible in CI
# (no ruby, coverage-instrumented build). Instead we run targeted macro
# round-trips under a pty (see conanfile.py).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: src/test.rc
    source: ne-3.3.4/src/test.rc
    description: "Bash driver: ruby test.rb generates random N-step macros, runs ne --macro, compares undone/redone files byte-for-byte with cmp (needs NE_TEST=1 NE_DEBUG=1 build + ruby)"
    command: "./test.rc"
  - file: src/test.rb
    source: ne-3.3.4/src/test.rb
    description: "Ruby script generating N-step random edit macros for test.rc"
    command: "ruby test.rb 2000 FILE"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "self.run() invokes ne_pty_test.py (ne aborts without a tty - harness runs it under a pty, TERMINFO points at shipped database)"
    command: "python3 ne_pty_test.py <ne_bin> <terminfo_dir>"
  - file: ne_pty_test.py
    description: "Pty harness: --help banner check, macro InsertString+Save+Exit, macro Find+ReplaceAll+Save, macro insert+Undo+Save (undo round-trip)"
    command: "python3 ne_pty_test.py <ne_bin> <terminfo_dir>"

assertion_count: 10
