software: ne
display: "ne (the nice editor)"
description: "Easy-to-use, powerful and fully configurable terminal text editor based on POSIX standards"
category: editor
homepage: "https://github.com/vigna/ne"
license: GPL-3.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "9 个生成源文件（hash.c/names.c/enums.h/help.c/ext.c/version.h 等）由 makeinfo+perl 生成，CI 无 texinfo，以 conandata generated_sources 第二源提供（ne-src-raw 分支 raw.gitcode.com 托管 tarball，sha256 校验后 source() 拷入 src/）"
    - "ne 非 tty stdin 直接 abort，自动化测试必须用 pty 模拟终端（macro --macro FILE 驱动编辑）"
    - "terminfo 数据库随包分发（share/terminfo，来自 conan ncurses/6.4），package_info 定义 TERMINFO/TERMINFO_DIRS"
    - "静态链接 conan libncursesw.a（ncurses 包 --without-shared 构建）"
  common_dependencies:
    - ncurses

versions:
  "3.3.4":
    status: published
    build_date: "2026-09-11"
    conan_ref: "ne/3.3.4"
