# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nativefiledialog-extended/1.3.0
homepage: "https://github.com/btzy/nativefiledialog-extended"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 test/ 共 22 个测试程序：NFD_BUILD_TESTS（默认 ON）= 21 个对话框交互测试
# （test_opendialog*/test_pickfolder*/test_savedialog* 系列，每个 main 弹出对话框
# 等待用户操作，需真实显示与交互，无法无头运行）；NFD_BUILD_SDL2_TESTS = 1 个
# test_sdl（需 SDL2 窗口）。均为 GUI 交互测试，无头 CI 不可执行。
upstream_tests:
  - "test_opendialog.c / test_opendialog_cpp.cpp / test_opendialog_native.c / test_opendialog_with.c / test_opendialog_native_with.c"
  - "test_opendialogmultiple.c / test_opendialogmultiple_cpp.cpp / test_opendialogmultiple_native.c / test_opendialogmultiple_enum.c / test_opendialogmultiple_enum_native.c"
  - "test_pickfolder.c / test_pickfolder_cpp.cpp / test_pickfolder_native.c / test_pickfolder_with.c / test_pickfolder_native_with.c"
  - "test_pickfoldermultiple.c / test_pickfoldermultiple_native.c"
  - "test_savedialog.c / test_savedialog_native.c / test_savedialog_with.c / test_savedialog_native_with.c"
  - "test_sdl.c (SDL2, NFD_BUILD_SDL2_TESTS)"

# rule4 归因：上游 22 个测试均为 GUI 交互测试（21 个对话框测试逐个弹出文件对话框
# 等待用户选择 + 1 个 SDL2 窗口测试），无头 CI 不可执行，故不移植；
# NFD_Init/NFD_Quit 依赖 GTK display 初始化（实测 OHOS 无显示环境 gtk_init_check
# 阻塞不返回，GDK_BACKEND=broadway 亦然），无头冒烟同样不覆盖。
# 本包以 test_package 无头 API 冒烟替代（编译链接 + 错误 API 契约）。
upstream_test_evidence: "rule4: all 22 upstream test programs are GUI-interaction tests (21 native dialog tests populating file dialogs awaiting user input under NFD_BUILD_TESTS, 1 SDL2 window test under NFD_BUILD_SDL2_TESTS); headless CI cannot execute them. NFD_Init likewise blocks headless on OHOS (gtk_init_check, 实测). Replaced by headless API smoke in test_package."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "链接 libnfd + GTK3 依赖链（静态 nfd 拖入 GTK 符号全量解析）+ 运行时加载共享链；NFD_GetError 初始为 NULL、NFD_ClearError 幂等两个无头安全断言；对话框 UI 与 NFD_Init/NFD_Quit 无法无头运行，跳过属正常"
    command: "./test_nfd"

# 测试断言总数 (近似值, 用于质量评估)
# test.cpp: 2 个 CHECK (初始 GetError==NULL / ClearError 后仍无错误)
assertion_count: 2
