# 版本级 manifest
# 文件位置: archives/n/nativefiledialog-extended/1.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.3.0"
software: "nativefiledialog-extended"
status: built
build_date: "2026-09-08"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/btzy/nativefiledialog-extended/archive/refs/tags/v1.3.0.tar.gz"
  sha256: "2fea19102cf4d5283a80fb87a784792166988e85bb92baa962d34f72b22dcc1a"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "NFD_PORTAL=OFF（上游默认，GTK3 后端）"
    - "NFD_BUILD_TESTS=OFF"
    - "NFD_BUILD_SDL2_TESTS=OFF"
    - "CMAKE_CXX_STANDARD=17"
    - "CMAKE_SYSTEM_NAME=Linux（OHOS 映射，nanoflann 手法）"
  dependencies:
    - gtk/3.24.38
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "制品仓 conan 包名是 gtk（archives 目录名 gtk+ 带 + 号，注册表配方名不带），W0 依赖检查要用 conan list '*gtk*' 通配确认"
  - "gtk/3.24.38 配方声明 pkg_config_name=gtk+-3.0，消费者用 PkgConfigDeps 生成 gtk+-3.0.pc 即可满足上游 pkg_check_modules(GTK3 REQUIRED gtk+-3.0) 探测"
  - "上游 COMPILER_GNU 分支（Clang 命中）对 nfd target 加 -nostdlib -fno-exceptions -fno-rtti 编译选项；nfd_gtk.cpp 无 STL/异常/RTTI，OHOS clang 15 直接编译通过，无需 strip"
  - "顶层 CMakeLists 的 NFD_BUILD_TESTS 在根项目构建时默认 ON（test/ 依赖 SDL2），必须显式置 OFF"
  - "静态 libnfd.a 拖入 GTK 符号，package_info 声明 cpp_info.requires=[gtk] 传递依赖链"
  - "NFD_Init 在 Linux GTK 后端调 gtk_init_check，无头环境（无 display）返回 NFD_ERROR，test_package 需兼容有头/无头两种结果"
