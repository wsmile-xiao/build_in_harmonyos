source:
  url: "https://github.com/alexdantas/nSnake/archive/refs/tags/v3.0.1.tar.gz"
  sha256: "7240dafe35e17b01134591d7ae8f09f5a375cded8b01e43ba97ca3610a09ea61"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - ncurses/6.4
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-Flow-InputManager.cpp.patch"

knowledge_gained:
  - "OHOS 无 install(1)/ginstall，上游 make install 不可用，数据文件必须用 Conan copy()/save() 入包 — knowledge_ref: knowledge/drafts/DRAFT-ohos-makefile-explicit-toolchain-and-install-vars.kv"
  - "GNU Make 不把命令行覆盖传播给嵌套求值，make install 必须重复传 CC/CXX/CXXFLAGS/CFLAGS_PLATFORM/LDFLAGS — knowledge_ref: knowledge/graph/E108.kv（同族：宿主工具缺失）"
  - "nsnake 的 SYSTEM_LEVEL_DIR 只出现在帮助文本里，关卡真实加载目录是 ~/.local/share/nsnake/levels — knowledge_ref: 本版 notes.md（尚未沉淀为 E 条目，待评审确认后 graph add --draft）"

changes_from_previous_version:
  - "build() 追加 DATE= 传参固定构建日期（消除上游 date +%b%Y 造成的产物不可复现）"
  - "test_package/test.sh 修复 `! grep` 假通过并补关卡目录存在性前置；conanfile.py 增加构建日期断言，assertion_count 16→17"
  - "3.0.1 只打包 bin/nsnake；3.0.1.1 复现上游 make install 的完整 FHS 资产：31 个关卡、man6（VERSION/DATE 已替换）、16/32 图标、xpm、desktop"
  - "向 make 传 DATE='Jul2014'（GNU Make 命令行赋值优先）并把 man6 的 DATE 占位符同值替换，bin/nsnake 与 nsnake.6 均逐次构建一致，L5 基线可复现；--version 的日期由 test_package 断言纳入 CI"
  - "test_package/test.sh 的 man 占位符断言由 `! grep -qE` 改为显式 if 分支：bash errexit 显式豁免被 `!` 反转的命令，原写法在占位符残留时仍以 0 退出（假通过），现改为失败即 exit 1 可被 CI 捕获"
  - "package() 增加打包完整性自检（缺文件/空文件/关卡数不符即 ConanException）"
  - "test_package 从单一 --version 冒烟扩展为 18 项断言（新增 OHOS/armv8 平台断言，见 assertion_count）（真实执行 + 数据回归）"

staging_verified: true
test_report: reports/test-report.md  # 本地证据，reports/ 被 .gitignore 忽略未随 PR 入库
