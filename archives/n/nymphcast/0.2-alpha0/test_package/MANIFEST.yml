package: nymphcast/0.2-alpha0
homepage: "https://github.com/MayaPosch/NymphCast"

upstream_check_command: "make -C src/test all"
upstream_test_in_build: true
upstream_test_command: "make -C src/test all"
upstream_tests:
  - name: test_databuffer
    entry: "src/test/Makefile (target: test_databuffer)"
    description: "DataBuffer read/write unit test (default target)"
  - name: test_databuffer_mm
    entry: "src/test/Makefile (target: test_databuffer_mm)"
    description: "DataBuffer memory-map unit test (default target)"
  - name: test_screensaver
    entry: "src/test/Makefile (target: test_screensaver)"
    description: "Screensaver SDL render test (default target; needs SDL video)"
  - name: test_databuffer_mport
    entry: "src/test/Makefile (target: test_databuffer_mport)"
    description: "Multi-port databuffer test (manual target)"
  - name: test_ffplay_local_file
    entry: "src/test/Makefile (target: test_ffplay_local_file)"
    description: "Full ffplay local-file playback test (manual target)"
  - name: test_file_seeking.sh
    entry: src/test/test_file_seeking.sh
    description: "File seeking integration script"
  - name: test_file_transfer.sh
    entry: src/test/test_file_transfer.sh
    description: "File transfer integration script"

test_package_tests:
  - file: test.cpp
    description: "Compile a real probe that invokes the packaged nymphcast_server --version and validates the version banner"
    command: "clang++ -std=c++17 test.cpp -o test_probe && ./test_probe"

assertion_count: 3  # test.cpp: popen success, exit status, version banner
