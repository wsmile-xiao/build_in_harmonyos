software: nymphcast
version: "0.2-alpha0"
status: built
build_date: "2026-09-03"
build_system: makefile

source:
  # 实际取源与 conandata.yml 一致：git 源（gitcode 官方镜像）+ 固定 commit。
  # GitHub 动态 tarball 哈希非确定（gzip 头时间戳变化），git commit 内容寻址可复现，故无 sha256。
  git: "https://gitcode.com/gh_mirrors/ny/NymphCast.git"
  tag: "v0.2-alpha0"
  commit: "3f500599a8e5092280eb8724bbee5ca618634628"

build:
  system: makefile
  configure_options: []
  dependencies:
    - poco/1.15.3
    - ffmpeg/6.1.6  # upstream ffplay fork requires legacy avfft.h API (removed in FFmpeg 7+)
    - nymphrpc/v0.1.1
    - libnymphcast/v0.2.1
    - sdl2_image/2.6.0
    - sdl2/2.30.10
    - freetype/2.14.3
    - curl/8.15.0
    - freeimage/3.18.0
    - rapidjson/1.1.0
    - openssl/3.5.6.1  # force=True: resolves conflicting transitive pins (poco vs curl)
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-server-NymphCastServer.cpp.patch"
  - "0002-src-server-ffplay-sdl_renderer.cpp.patch"
  - "0003-src-server-ohos-stub-headers.h.patch"
  - "0004-src-server-ohos-pthread-compat.h.patch"
  - "0005-src-server-gui-app-VolumeControl-ohos.patch"
  - "0006-src-server-Makefile-ohos-link.patch"
  - "0007-src-server-Makefile-ohos-no-strip.patch"
  - "0008-src-test-test_ffplay_local_file-subtitle_disable.patch"
  - "0009-src-test-ohos-test-compat.patch"

knowledge_gained:
  - "patch 0001 adapts the existing upstream NymphCastServer.cpp with __OHOS__ guards (source exists upstream)"
  - "SDL renderer needs OHOS platform adaptation"
  - "Requires nymphrpc, libnymphcast, SDL2_image as dependencies (published on ohpcd)"
  - "Makefile-based build with TOOLCHAIN=clang"
  - "GitHub dynamic tarball hash is non-deterministic"
  - "upstream tests integrated in build() (howard-hinnant-date precedent): test_screensaver, test_ffplay_local_file, client built+run under dummy-SDL env; test_screensaver exits 0 (abort-no-images path only), test_ffplay_local_file times out (upstream teardown hang), script tests blocked (test_server build-blocked by stale pre-2021 nymphrpc API)"
