sources:
  # GitHub auto-generated tarball hashes are non-deterministic (gzip header
  # timestamp varies per fetch), so Conan 2 get() cannot cache them and
  # source() fails with "Cannot cache download() without sha256 checksum".
  # Use the official git repo pinned to the immutable commit behind the
  # v0.2-alpha0 tag (verified: tag v0.2-alpha0 == 3f500599...). Git commits
  # are content-addressed, so no sha256 is needed and the source is
  # reproducible. The gitcode mirror mirrors the official GitHub repo.
  git: "https://gitcode.com/gh_mirrors/ny/NymphCast.git"
  tag: "v0.2-alpha0"
  commit: "3f500599a8e5092280eb8724bbee5ca618634628"

patches:
  "0.2-alpha0":
    - patch_file: "patches/0001-src-server-NymphCastServer.cpp.patch"
      patch_description: "Adapt existing upstream NymphCastServer.cpp with OHOS guards (__OHOS__ branch)"
      patch_type: "portability"
    - patch_file: "patches/0002-src-server-ffplay-sdl_renderer.cpp.patch"
      patch_description: "Adapt existing upstream ffplay/sdl_renderer.cpp with OHOS SDL2 adaptation"
      patch_type: "portability"
    - patch_file: "patches/0003-src-server-ohos-stub-headers.h.patch"
      patch_description: "Provide ohos_stub_headers.h compat seam (aggregates real upstream headers, verified compilable on OHOS)"
      patch_type: "portability"
    - patch_file: "patches/0004-src-server-ohos-pthread-compat.h.patch"
      patch_description: "Provide ohos_pthread_compat.h declaring GNU pthread cancel API (symbols exist in device libc, header absent)"
      patch_type: "portability"
    - patch_file: "patches/0005-src-server-gui-app-VolumeControl-ohos.patch"
      patch_description: "Add __OHOS__ no-op branches to VolumeControl (OHOS defines __linux__ but has no ALSA; ALSA mixer is unused on OHOS)"
      patch_type: "portability"
    - patch_file: "patches/0006-src-server-Makefile-ohos-link.patch"
      patch_description: "OHOS link flags: drop -lstdc++fs/-latomic/-lGL/-lasound (libc++ has filesystem; OHOS has no libatomic/libGL/libasound); link no-op GL stub (GUI renderer runs headless)"
      patch_type: "portability"
    - patch_file: "patches/0007-src-server-Makefile-ohos-no-strip.patch"
      patch_description: "Skip GNU strip on OHOS: post-link strip invalidates the linker-generated .codesign signature and OHOS refuses to exec the stripped ELF (EPERM); package the unstripped binary"
      patch_type: "portability"
    - patch_file: "patches/0008-src-test-test_ffplay_local_file-subtitle_disable.patch"
      patch_description: "Fix upstream type mismatch in test_ffplay_local_file.cpp: `int subtitle_disable` redefines the `bool` extern declared in ffplay/types.h (upstream defect in both v0.2-alpha0 and master); make the test buildable"
      patch_type: "bugfix"
    - patch_file: "patches/0009-src-test-ohos-test-compat.patch"
      patch_description: "Add src/test/ohos_server_glue.cpp + src/test/ohos_ffplay_globals.cpp: test-build-only compat glue for the ffplay test link closure (server-side symbols normally provided by NymphCastServer.cpp, and the ffplay globals block that test_ffplay_local_file.cpp defines but test_screensaver.cpp does not)"
      patch_type: "portability"
