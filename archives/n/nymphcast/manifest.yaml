software: nymphcast
display: "NymphCast"
description: "Audio and video casting system — turn devices into media receivers"
category: video
homepage: "https://github.com/MayaPosch/NymphCast"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "patch 0001 adapts the existing upstream NymphCastServer.cpp with __OHOS__ guards (source exists upstream)"
    - "SDL2 renderer needs OHOS adaptation — patch 0002 adapts the existing sdl_renderer.cpp"
    - "nymphrpc, libnymphcast, SDL2_image are published Conan packages and declared in requirements()"
    - "Makefile links -lGL -lasound -lstdc++fs which need OHOS platform handling"
  common_dependencies:
    - poco
    - ffmpeg
    - sdl2

versions:
  "0.2-alpha0":
    status: built
    build_date: "2026-06-01"
