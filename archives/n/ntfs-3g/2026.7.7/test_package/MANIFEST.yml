# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: ntfs-3g/2026.7.7
homepage: "https://github.com/tuxera/ntfs-3g"

# 上游无测试套件(无 tests/ 目录,无 automake TESTS 目标)。
# 验证由 test_package 消费者测试承担:用 ntfsprogs 工具集对文件级
# NTFS 镜像做 创建(mkntfs)→读信息(ntfsinfo)→列目录(ntfsls)
# 全链路真实操作(3 项断言,jpnevulator 0/0 申报先例)。
upstream_check_command: "上游无测试套件;消费者测试用 ntfsprogs 做文件级 NTFS 全链路操作"
upstream_test_in_build: false
upstream_test_command: "上游 0/0;消费者测试 3/3(mkntfs + ntfsinfo + ntfsls)"

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_ntfs3g_cli.sh
    description: >-
      CLI 消费者测试（3 项断言）：mkntfs 创建 4096 扇区 NTFS 镜像
      （1）；ntfsinfo 读取镜像卷信息（2）；ntfsls 列出根目录（3）。
      全部为文件级操作，不依赖 FUSE。
