sources:
  # 官方 release tarball（tuxera 发布），不是 GitHub archive。
  # 关键差异：release 包自带 configure / Makefile.in / aclocal.m4 / ltmain.sh 等
  # autotools 产物，GitHub archive 只有源码（tag 快照）故需 autoreconf 自举。
  # 换官方包即让 build() 跳过 autoreconf，绕开 perl/5.42.2 的 Cwd.so
  # （XS 模块未 codesign → OHOS 侧 dlopen 报 Permission denied）阻塞。
  # 后两个是字节一致的镜像（sha256 已实测三处相同），防单一 host 不可达。
  url:
    - "https://download.tuxera.com/opensource/ntfs-3g_ntfsprogs-2026.7.7.tgz"
    - "https://distfiles.macports.org/ntfs-3g/ntfs-3g_ntfsprogs-2026.7.7.tgz"
    - "https://source.ipfire.org/source-2.x/ntfs-3g_ntfsprogs-2026.7.7.tgz"
  sha256: "d67b769025d32860549d35c2147e45024d172f81c540d750390ce3602c059dab"
patches:
  # E007: release tarball 自带的 config.guess(2024-07-27)/config.sub 不认
  # HarmonyOS → uname -s=HarmonyOS 匹配不到任何 case，落入 compile-and-run 探针，
  # 而探针要往 mktemp -d 建的临时目录写 dummy.c；HMDFS 上该目录不可写 →
  # "dummy.c: Permission denied" → "unable to guess system type"
  # → configure: "cannot guess build type"。
  # 铁律 P-AUTOTOOLS-001(level=critical)：鸿蒙是**原生编译**环境，禁止用
  # --build/--host 绕过（会置 cross_compiling=yes → AC_RUN_IFELSE 全跳过 →
  # config.h 全默认值）。正解是改 config.guess/config.sub 本身。
  # 0001 让 config.guess 认 HarmonyOS 并直接输出 aarch64-unknown-linux-ohos
  # （走 uname 分支，不编译不运行 → 天然 native，不触发探针）；
  # 0002 给 config.sub 补 ohos-linux 三元组（该三元组由 0001 输出，需能被规范化）。
  "2026.7.7":
    - patch_file: "patches/0001-config-guess-ohos.patch"
      patch_description: "0001 config.guess recognizes HarmonyOS and emits aarch64-unknown-linux-ohos (E007)"
      patch_type: "portability"
    - patch_file: "patches/0002-config-sub-ohos.patch"
      patch_description: "0002 config.sub accepts the ohos-linux triplet (E007)"
      patch_type: "portability"
