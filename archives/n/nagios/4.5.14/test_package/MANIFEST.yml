  - file: t-tap/test_notifications
    source: nagios-4.5.14/t-tap/test_notifications.c
    description: "通知逻辑 C 单元测试 (42 断言)"
    command: "./t-tap/test_notifications"
  - file: t-tap/test_logging
    source: nagios-4.5.14/t-tap/test_logging.c
    description: "日志 C 单元测试 (14 断言)"
    command: "./t-tap/test_logging"
  - file: t-tap/test_events
    source: nagios-4.5.14/t-tap/test_events.c
    description: "事件调度 C 单元测试 (11 断言)"
    command: "./t-tap/test_events"
  - file: t-tap/test_nagios_config
    source: nagios-4.5.14/t-tap/test_nagios_config.c
    description: "nagios.cfg 解析 C 单元测试 (14 断言)"
    command: "./t-tap/test_nagios_config"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_nagios.sh
    description: "消费者冒烟: nagios --version 版本断言 + nagios -v 真实配置校验(空配置失败/完整配置通过) + nagiostats --version"
    command: "./test_nagios.sh <package_folder> <workdir>"

# 测试断言总数 (t/ 478 + t-tap 6702 + test_package 5)
assertion_count: 7185
