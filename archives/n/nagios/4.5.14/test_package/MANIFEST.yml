# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nagios/4.5.14
homepage: "https://www.nagios.org"

# 上游测试命令 (t/ perl 套件 + t-tap C 单元测试)
upstream_check_command: "make test"

# conanfile.py build() 方法中已集成上游测试 (t/ perl 478 断言 + t-tap C 6702 断言)
upstream_test_in_build: true
upstream_test_command: "make test && make test-tap"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/900-configparsing.t
    source: nagios-4.5.14/t/900-configparsing.t
    description: "nagios -v 配置校验 + objects.precache 生成对比"
    command: "perl t/900-configparsing.t <top_builddir>"
  - file: t/660status-downtimes-comments.t
    source: nagios-4.5.14/t/660status-downtimes-comments.t
    description: "status.dat 停机/注释解析 (10^1..10^5 条目性能扫描, 15 断言)"
    command: "perl t/660status-downtimes-comments.t <top_builddir>"
  - file: t/705nagiostats.t
    source: nagios-4.5.14/t/705nagiostats.t
    description: "nagiostats 统计工具输出/错误处理 (10 断言)"
    command: "perl t/705nagiostats.t <top_builddir>"
  - file: t/610cgistatus.t
    source: nagios-4.5.14/t/610cgistatus.t
    description: "status.cgi 主机状态渲染 (9 断言)"
    command: "perl t/610cgistatus.t <top_builddir>"
  - file: t/618cgisecurity.t
    source: nagios-4.5.14/t/618cgisecurity.t
    description: "CGI XSS 注入防护 (statusmap/config.cgi, 3 断言)"
    command: "perl t/618cgisecurity.t <top_builddir>"
  - file: t/910-noservice.t
    source: nagios-4.5.14/t/910-noservice.t
    description: "无 service 定义时的配置错误报告 (1 断言)"
    command: "perl t/910-noservice.t <top_builddir>"
  - file: t/920-nocontactgroup.t
    source: nagios-4.5.14/t/920-nocontactgroup.t
    description: "无 contactgroup 定义时的配置错误报告 (2 断言)"
    command: "perl t/920-nocontactgroup.t <top_builddir>"
  - file: t/930-emptygroups.t
    source: nagios-4.5.14/t/930-emptygroups.t
    description: "空 host/service-group 配置校验 (1 断言)"
    command: "perl t/930-emptygroups.t <top_builddir>"
  - file: t/611cgistatus-hosturgencies.t
    source: nagios-4.5.14/t/611cgistatus-hosturgencies.t
    description: "status.cgi hosturgencies 排序渲染 (5 断言)"
    command: "perl t/611cgistatus-hosturgencies.t <top_builddir>"
  - file: t/615cgierror.t
    source: nagios-4.5.14/t/615cgierror.t
    description: "全部 19 个 CGI 的错误处理路径 (14 断言)"
    command: "perl t/615cgierror.t <top_builddir>"
  - file: t/616cginotification.t
    source: nagios-4.5.14/t/616cginotification.t
    description: "notifications.cgi 通知渲染 (2 断言)"
    command: "perl t/616cginotification.t <top_builddir>"
  - file: t/617statuswml.t
    source: nagios-4.5.14/t/617statuswml.t
    description: "statuswml.cgi WAP 输出 (4 断言)"
    command: "perl t/617statuswml.t <top_builddir>"
  - file: t/622extinfo-local.t
    source: nagios-4.5.14/t/622extinfo-local.t
    description: "extinfo.cgi 本地数据渲染 (2 断言)"
    command: "perl t/622extinfo-local.t <top_builddir>"
  - file: t/623cmd-local.t
    source: nagios-4.5.14/t/623cmd-local.t
    description: "cmd.cgi 命令处理 (2 断言)"
    command: "perl t/623cmd-local.t <top_builddir>"
  - file: t-tap/test_checks
    source: nagios-4.5.14/t-tap/test_checks.c
    description: "调度检查逻辑 C 单元测试 (452 断言)"
    command: "./t-tap/test_checks"
  - file: t-tap/test_timeperiods
    source: nagios-4.5.14/t-tap/test_timeperiods.c
    description: "时间周期计算 C 单元测试 (6046 断言)"
    command: "./t-tap/test_timeperiods"
  - file: t-tap/test_commands
    source: nagios-4.5.14/t-tap/test_commands.c
    description: "外部命令处理 C 单元测试 (62 断言)"
    command: "./t-tap/test_commands"
  - file: t-tap/test_downtime
    source: nagios-4.5.14/t-tap/test_downtime.c
    description: "停机管理 C 单元测试 (38 断言)"
