  - "0012-t-etc-nagios.cfg.patch"

knowledge_gained:
  - "nagios configure 的 --with-temp-dir 会把内部 TMPDIR 变量默认设为只读 /tmp，必须显式指向可写目录"
  - "configure SSL 检测: --with-ssl-inc 指向 openssl/ 头目录时 conftest #include <openssl/ssl.h> 会拼出双层路径；用 shim (include/ssl.h 转发 + include/openssl 软链) 命中 SSL_INC_PREFIX='' 分支"
  - "conan openssl 是静态库，configure 只认 libssl.so；shim lib 目录做 .so→.a 符号链接，最终二进制静态链接"
  - "statusmap.cgi 用 BSD rindex()，OHOS musl 系 libc 无此符号，改 strrchr 等价替换"
  - "t-tap/Makefile.in 的 test_commands/test_downtime/test_notifications 链接行漏 $(LDFLAGS)（上游 bug，依赖在非系统路径时暴露）"
  - "OHOS 无 /usr/bin/perl；t/660 的 system('bin/generate_downtimes') 需改用 $^X（当前 perl 解释器）"
  - "install 的 INSTALL_OPTS/COMMAND_OPTS 无条件 -o/-g chown；make 命令行覆盖 INSTALL_OPTS= COMMAND_OPTS= 清空（上游 make rpm 打包目标同款用法）"
  - "html/Makefile 用相对路径 (js/*.js) 安装 → 必须 in-tree 构建（basic_layout src_folder='.' + folders.build='.'）"
  - "HMDFS conan 缓存目录 setgid 属主差异：configure/config.status 的 umask 077 临时目录对构建进程不可见（E012），需把 (umask 077 → (umask 000（主 configure + tap/configure 两处）"
  - "tap/ 子项目自带 2025-10-28 版 config.guess 同样不识别 HarmonyOS，复用主目录补丁版即可"

