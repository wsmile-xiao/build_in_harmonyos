    - "--with-gd-inc=<gd>/include --with-gd-lib=<gd>/lib"
    - "--enable-libtap"
    - "--with-nagios-user=file_manager --with-nagios-group=file_manager"
    - "--with-command-user=file_manager --with-command-group=file_manager"
  dependencies:
