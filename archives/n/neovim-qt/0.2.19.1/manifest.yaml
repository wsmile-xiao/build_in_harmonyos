software: neovim-qt
version: "0.2.19.1"
status: built
build_date: "2026-07-20"

source:
  url: "https://github.com/equalsraf/neovim-qt/archive/refs/tags/v0.2.19.tar.gz"
  sha256: "2c5a5de6813566aeec9449be61e1a8cd8ef85979a9e234d420f2882efcfde382"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DWITH_QT=Qt6"
    - "-DENABLE_TESTS=ON"
    - "-DUSE_SYSTEM_MSGPACK=OFF"
    - "-DCMAKE_PREFIX_PATH=<qtbase package_folder>;<qtsvg package_folder>"
    - "-DQt6_DIR=<qtbase package_folder>/lib/cmake/Qt6"
    - "-DQt6Svg_DIR=<qtsvg package_folder>/lib/cmake/Qt6Svg"
    - "-DQt6SvgWidgets_DIR=<qtsvg package_folder>/lib/cmake/Qt6SvgWidgets"
  dependencies:
    - qtbase/6.11.1 (Conan dependency, Core/Network/Widgets/Test)
    - qtsvg/6.11.1 (Conan dependency, SvgWidgets)
    - neovim (runtime executable)
  cc: clang
  cxx: clang++

patches_applied:
  - "conanfile.py applies OHOS/Qt6 adaptation changes to test/common_gui.cpp, test/tst_neovimconnector.cpp, test/tst_qsettings.cpp, src/gui/CMakeLists.txt, and third-party/CMakeLists.txt"

knowledge_gained:
  - "neovim-qt 0.2.19 can build against Qt 6 by setting WITH_QT=Qt6."
  - "The recipe uses bundled msgpack to avoid adding an external dependency to the package boundary."
  - "Upstream Qt Test groups are enabled by setting ENABLE_TESTS=ON, and the recipe runs ctest with the offscreen Qt platform when target binaries can execute."
  - "OpenDesk round6 is a historical log (17/20 upstream ctest cases passing); current head is pending OpenDesk revalidation. The round6 3 failures were libQt6Svg relative loader path issues that the round8 qtbase/qtsvg dependency mode addresses. Explicit Qt6Svg_DIR/Qt6SvgWidgets_DIR cache variables are set because qtbase and qtsvg use cmake_find_mode=none."
  - "The package test validates executable packaging, desktop launcher metadata, icon resources, and --version execution when target execution is available; GUI window creation, rendering, and input handling require manual validation on an OpenHarmony PC display session."
  - "R40 manual validation marker: Headless CI covers build/linkage/non-rendering smoke checks only; neovim-qt GUI window creation, rendering, and keyboard/mouse input require an OpenHarmony PC display session. Keep status built until manual validation is complete."

test_package:
  assertion_count: 6
  pass_rate: "current head pending OpenDesk revalidation; 20 upstream CTest targets, 19 headless enabled, 1 GUI/Neovim interaction test excluded."
