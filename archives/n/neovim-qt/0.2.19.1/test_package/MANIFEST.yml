package: neovim-qt/0.2.19.1
homepage: "https://github.com/equalsraf/neovim-qt"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "recipe configures ENABLE_TESTS=ON and runs QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ctest --test-dir <build> --output-on-failure when target binaries can execute"

upstream_tests:
  - path: test/ + src/gui/shellwidget/test/
    type: "Upstream Qt Test suites registered by CTest"
    case_count: 20
    status: enabled
    details: "CTest registers 20 targets total. tst_shell requires a real GUI/Neovim session and is excluded from headless execution (-E tst_shell), leaving 19 enabled CTest targets; the 1 GUI/Neovim interaction test is excluded from automated execution."

manual_upstream_scope:
  - command: "interactive nvim-qt GUI session validation"
    reason: "Automated Qt Test cases are enabled in the recipe. Full editor window rendering, keyboard/mouse input, and live Neovim interaction still require an OpenHarmony PC display session for R40 manual validation."

coverage:
  enabled: false
  reason: "The OHOS cross package job does not provide stable GUI test execution or gcov/lcov collection for this Qt application."

test_package_tests:
  - file: test_neovim_qt_assets.sh
    description: "Shell smoke source called by test() when target execution is available; checks the packaged nvim-qt entry point and version command."
    command: "sh test_neovim_qt_assets.sh"
  - file: conanfile.py
    description: "Verifies the packaged nvim-qt executable exists and is non-empty."
    command: "python test_package/conanfile.py test()"
  - file: conanfile.py
    description: "Verifies desktop launcher metadata is installed in the package."
    command: "package asset scan"
  - file: conanfile.py
    description: "Verifies at least one icon resource is installed in the package."
    command: "package asset scan"
  - file: conanfile.py
    description: "Runs nvim-qt --version when target execution is available."
    command: "nvim-qt --version"

assertion_count: 6
upstream_total_case_count: 20
upstream_enabled_case_count: 19
upstream_excluded_case_count: 1
upstream_manual_case_count: 0
upstream_pass_rate: "20 upstream CTest targets: 19 run headless (-E tst_shell), 1 GUI/Neovim interaction test excluded; pass rate pending current-head revalidation."
