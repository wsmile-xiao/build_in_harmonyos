# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nvtx/3.6.0-c-cpp
homepage: "https://github.com/NVIDIA/NVTX"

# 上游测试: NVTX c-cpp 官方 tarball 不含 tests/ 目录（测试位于完整仓库根 tests/），
# 详见最终回报的完整枚举测试台账（task #6）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带测试（消费者视角验证 + HarmonyOS 专项）
test_package_tests:
  - file: test_nvtx.cpp
    description: "消费者测试: nvtx3::scoped_range/mark + nvtxNameOsThreadA + nvtxw3 loader 对缺失后端优雅返回 NVTXW_RESULT_LIBRARY_NOT_FOUND (dlopen/dlsym 路径)"
    command: "./test_nvtx"

assertion_count: 3