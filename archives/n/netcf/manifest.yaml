software: netcf
display: "netcf"
description: "网络配置抽象库，提供跨平台的网络接口配置管理 API"
category: network
homepage: "https://pagure.io/netcf/"
license: LGPL-2.1+
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "SDK linux/socket.h 与 musl libc sys/socket.h 冲突，需创建 wrapper"
    - "augeas transform 需使用虚拟路径（不带 root 前缀）"
    - "HarmonyOS 需创建 ifcfg-* 配置文件支持网络接口检测"
    - "所有 ELF 文件需签名才能运行"
  common_dependencies:
    - augeas/1.14.1
    - libxslt/1.1.39
    - libnl-1/1.1
    - readline/8.3

# 版本索引（所有已归档版本，含状态）
versions:
  "0.1.7":
    status: published
    build_date: "2026-06-09"
    test_date: "2026-06-10"
    publish_date: "2026-06-10"