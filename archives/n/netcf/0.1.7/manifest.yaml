software: netcf
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.1.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.7"

# 编译状态
# published | built | failed | archived
status: published
# 功能完全可用: API 100% PASS, ncftool 100% PASS, augeas 已适配

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"
compile_date: "2026-06-09"
build_system: autotools

# 功能测试日期
test_date: "2026-06-10"
test_status: full  # full | partial | restricted | failed
# 功能完全可用: API 100% PASS, ncftool 100% PASS, augeas 已适配

# 发布日期
publish_date: "2026-06-10"

# ============================================================
# 预编译包信息
# ============================================================

packaging:
  # 预编译包文件名
  file: "netcf-0.1.7-ohos-aarch64.tar.gz"

  # 包大小
  size: "604KB"

  # 包内容
  contents:
    - "lib/libnetcf.a"
    - "lib/libnetcf.so.1.3.3"
    - "lib/libnetcf.so"
    - "lib/libnetcf.so.1"
    - "lib/pkgconfig/netcf.pc"
    - "include/netcf.h"
    - "share/netcf/lenses/netcf.aug"
    - "share/netcf/lenses/sysconfig.aug"
    - "share/netcf/xml/*.rng"
    - "share/netcf/xml/*.xsl"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://releases.pagure.org/netcf/netcf-0.1.7.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - augeas/1.14.1
    - libxslt/1.1.39
    - libnl-1/1.1
    - readline/8.3
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

  # 特殊编译标志
  extra_cflags: "-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0"
  extra_ldflags: "-Wl,--allow-shlib-undefined"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 手动修改记录在 notes.md 中

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 上 configure/config.status 的 umask 077 会导致目录权限异常，需改为 umask 022"
  - "SDK linux/socket.h 与 musl libc sys/socket.h 的 sockaddr_storage 重定义冲突，需创建 wrapper"
  - "NETCF_LIBDEPS 包含 -L 参数会导致 Makefile 把它当作目标，需移除"
  - "musl libc 不支持 __fd_chk 等 FORTIFY_SOURCE 符号，需用 --allow-shlib-undefined 绕过"
  - "augeas transform 配置需使用虚拟路径（不带 root 前缀），否则无法正确映射到自定义 root"
  - "HarmonyOS 需手动创建 /etc/sysconfig/network-scripts/ifcfg-* 配置文件以支持 netcf"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

