# ============================================================
# 平台能力缺口（宿主/依赖限制，非配方缺陷，已显式跳过）
# 逐条证据（errno / 上游源码行号 / 实测命令与输出）已内联在下方 gaps[].evidence
# 与 notes.md 的「平台能力缺口」一节。本目录 reports/ 是仓库 .gitignore 有意忽略的
# 再生成产物（.gitignore "质量报告（每次重新生成）" 段），不作为交叉引用依据。
# ============================================================

platform_gaps:
  blocking: false
  classification: "env_unsupported（R41 口径：换非 OHOS 机器或重建 pcre 即可通过，移植侧不可消除）"
  mechanism: "patches/0004-test.ngs.patch 的 platform_skip() 显式枚举 + 输出 '+ SKIP:' 行 + 单独计数"
  total_skipped_assertions: 8
  gaps:
    - id: G1
      name: "根目录不可 opendir()（EACCES）"
      skipped_assertions: 4
      upstream_locations: ["lib/stdlib.ngs:5799", "lib/stdlib.ngs:5800", "lib/stdlib.ngs:5801", "lib/stdlib.ngs:5817"]
      evidence: "ngs -e 'dir(\"/\")' -> Failed to list directory contents"
      root_cause: "HarmonyOS SELinux + HMDFS 权限模型对 / 的 opendir(3) 返回 EACCES，上游断言前提「根目录可枚举」不成立"
    - id: G2
      name: "access(\"/\") 为 false 且 /var 不存在"
      skipped_assertions: 1
      also_affects: "G1 中 2 条 AnyOf(\"/var\", \"/etc\", \"/bin\") 断言叠加失败"
      upstream_locations: ["lib/stdlib.ngs:8531"]
      evidence: "ngs -e 'access(File(\"/\"), bor(ACCESS::R_OK, ACCESS::X_OK))' -> false ; [ -e /var ] -> MISSING"
      root_cause: "access(2) 对 / 返回 EACCES（同 G1）；HarmonyOS PC 无 FHS 的 /var 目录，且创建它需要根目录可写（同样被拒绝）"
    - id: G3
      name: "pcre/8.45 未启用 UTF 支持"
      skipped_assertions: 1
      upstream_locations: ["lib/stdlib.ngs:7727"]
      evidence: "ngs -e '(\"aяb\" ~~ /(*UTF)|\\\\x8F|b/)' -> this version of PCRE is compiled without UTF support"
      root_cause: "依赖制品 pcre/8.45 构建时未开启 SUPPORT_UTF，(*UTF) 分支抛 RegExpCompileFail 且 message 不含上游期望子串 'not recognized'；pcre 静态链入 ngs，UTF 能力在链接期已固化，本包配方不可修（应由 pcre 包自身递增适配版本解决）"
    - id: G4
      name: "AF_UNIX socket bind() 返回 EPERM"
      skipped_assertions: 2
      upstream_locations: ["lib/autoload/globals/net.ngs:37", "lib/autoload/globals/net.ngs:42"]
      evidence: "socket(C_PF_UNIX, C_SOCK_DGRAM) -> fd 3（可用）；c_bind(...) -> -1 / Operation not permitted in bind()，errno=1 (EPERM)"
      root_cause: "HarmonyOS 内核对 AF_UNIX socket bind() 到文件系统路径施加 EPERM，缺口在路径绑定授权而非 ngs 封装"
      regression_note: "platform_skip 的匹配模式必须覆盖 net.ngs:42 的 'bind(sock, ...)' 写法（本版改用 c_sockaddr_un( ），否则该断言在 bind() 抛 CError 使 test.ngs 套件中止，仅执行到 704 条、其后的 autoload 断言全部丢失"

# ============================================================
# 本地门禁结果（W3 等价 CI + conan-verify）
# ============================================================

validation:
  w3_local_ci:
    status: built
    date: "2026-09-16"
    gates:
      JC: passed
      L0: passed
      L1: passed
      L2: skipped
      L4: passed
      L5: passed
    pass_rate: "100.0% (1/1)"
    ci_result: ".ci-result.json（exit_code=0，含 log_sha256 与 integrity_hash，由 finish step [5/10] 写入）"
    l2_skip_reason: "L2 门禁以裸环境执行 'timeout 15 <abs>/bin/ngs --version'，而 ngs 依 SKILL §7「非系统同名库默认动态、依赖链由 Conan 管理」不给 libjson-c.so.5 写 RPATH（鸿蒙 $ORIGIN/../lib 不稳定）。实测裸环境 rc=127 报 'Error loading shared library libjson-c.so.5'；仅注入 json-c libdir 后同一命令 rc=0 输出 0.2.17，--help 亦 rc=0。即 --version/--help 语义正常，失败是「L2 不注入 runenv」与「Conan 不写 RPATH」两个设计假设的交互结果，属门禁执行模型限制而非配方缺陷；L2 在 CI 中为 non-blocking，其目标已由 L1（test_package 在完整 runenv 下 36 项断言）覆盖"
  conan_verify:
    status: built
    G0: passed
    G1: passed
    G2: passed
    G3: passed
    G4: passed
    L2: skipped
    L4: passed
    L5: passed
    note: "conan-verify 的 G4 报 '无法找到程序包 ID' 导致其内部 L2/L4/L5 标记跳过 —— scripts/ohc/conan_verify.py gate4 用 listing['Local Cache'][software][ref] 两级取值，而 conan list 对带 user/channel 的引用只有一级 key 'ngs/0.2.17@ohpcd/stable'。属框架既有缺陷（scripts/ 只读，本任务未改）；已按 CI 同口径手工复验，结果内联在下方 artifact_baseline（产物 bin/lib/ngs 齐备、readelf 判 NX+PIE+Full RELRO(BIND_NOW)、SHA256 基线）"
  artifact_baseline:
    # 基线只取"跨构建稳定"的量。ngs 的 ELF 会烙入 conan 构建目录绝对路径
    # （.../p/b/<随机>/b/...），因此产物 sha256 每次构建都不同，
    # 不作为验收比对项，只附最近一次采集值供交叉参考。
    stable:
      path: "bin/ngs"
      size_bytes: 1063552
      source_sha256: "029c5d1167e884fee54fc99881e3d8c30478314f6e5fc2a7b832c909ed35d5b0"  # 与官方 tarball 实测一致
      elf_type: "DYN (PIE)"
      nx: true                              # GNU_STACK = RW（无 E）
      relro: "full"                         # GNU_RELRO 段 + FLAGS=BIND_NOW + FLAGS_1=NOW PIE
      rpath: "none"                         # 依赖链交由 Conan 管理
      needed: ["libjson-c.so.5", "libc.so"]
    volatile:
      last_collected_at: "2026-09-16T17:40"
      last_collected_build: "清空 conan 本地缓存后的完全干净 create（重新 source 官方 URL）"
      binary_sha256: "50bde36b87486e14f245065cb5081508818f593c760ba7b81039649a19784ede"
      note: "该哈希仅对应该次构建，换机器或重新构建必然变化，请勿据此判为基线漂移"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Conan tool_requires 的包只在 build context：必须用 self.dependencies.build[\"peg\"]，写成 self.dependencies[\"peg\"] 抛 KeyError 'not found in the dependency set'"  # knowledge_ref: DRAFT E544（已登记草稿）
  - "ctest --output-on-failure 在用例通过时不回显被测进程 stdout，需要解析其统计行时必须用 ctest -V"  # knowledge_ref: DRAFT E543（已登记草稿）
  - "上游按 Debian 命名 pkg_search_module(PCRE) 找 libpcre，Conan 的 pcre 包导出 pcre.pc，需放宽候选名"  # knowledge_ref: L3-version-note（本版笔记，不冒充图谱条目）
  - "libc 自带 backtrace(3) 时 FindBacktrace 把 Backtrace_INCLUDE_DIR 留成 *-NOTFOUND，CMake >= 3.28 拒绝其进入 include_directories()，需归一化为空列表"  # knowledge_ref: L3-version-note（本版笔记，不冒充图谱条目）
  - "bin2c 类脚本把 od|sed 结果作为 printf 参数展开，大文件（~282KB 源码 -> ~1MB 转义）会超 ARG_MAX(131072)，应改为流式输出"  # knowledge_ref: L3-version-note（本版笔记，不冒充图谱条目）
  - "HarmonyOS 的 /tmp 是 erofs 只读挂载（E002），上游测试里硬编码 /tmp 的写用例必须改用相对路径"  # knowledge_ref: L3-version-note（本版笔记，不冒充图谱条目）
  - "ngs 语法：无 pub 关键字（命名空间用下划线前缀表示私有）、无 -> lambda（用 F(x){} 或 X）；字符串拼接只能走 ${...} 插值，+ 没有 (Str, Int) 重载"  # knowledge_ref: L3-version-note（本版笔记，不冒充图谱条目）
  - "ngs 语法：[...] / (...) / {...} 字面量不能直接接 .method()（解析器在 '.' 处报 Syntax error），需先绑定变量或置于实参位内"  # knowledge_ref: L3-version-note（本版笔记，不冒充图谱条目）
  - "ngs 语义：.. 是半开区间、... 是闭区间；~ 返回单个 MatchSuccess、~~ 返回 Arr of MatchSuccess（索引前先 [0] 再 .matches[n]）；flatten() 无参数且元素不得含裸 Int"  # knowledge_ref: L3-version-note（本版笔记，不冒充图谱条目）
  - "ngs 语义：反引号原样保留命令输出的尾部换行，需 line: 前缀才取首行并去换行；脚本退出码 = 最后表达式求值结果（故 fixture 回放不能以 rc==0 判负）"  # knowledge_ref: L3-version-note（本版笔记，不冒充图谱条目）
  - "dump() 输出走 stderr，回放比对 .ok 时必须 stdout+stderr 合并；静态链入的 bdw-gc 在 OHOS ELF 布局下打印 'GC Warning: Failed to find PT_GNU_RELRO segment inside PT_LOAD region'，比对前需过滤（readelf 确认 GNU_RELRO 实际存在）"  # knowledge_ref: L3-version-note（本版笔记，不冒充图谱条目）
  - "产出可执行文件的包必须在软件级目录声明 commands.json（R38 / CI L0k），binary 字段含义是「是否已发布二进制到制品仓」，适配中为 false"  # knowledge_ref: L3-version-note（本版笔记，不冒充图谱条目）
  - "W3 的 junk_check.sh 在分支未 commit 时回退 full 模式扫全仓，会被 main 上的存量污染（如 archives/c/cloog/0.21.1/.build-closed）连坐拦下；真实 CI 走 prdiff 模式，本地可用 JUNK_PR_DIFF 复现该模式验证本包自身合规"  # knowledge_ref: L3-version-note（本版笔记，不冒充图谱条目）

