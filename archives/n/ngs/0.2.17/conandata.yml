sources:
  url: "https://github.com/ngs-lang/ngs/archive/refs/tags/v0.2.17.tar.gz"
  sha256: "029c5d1167e884fee54fc99881e3d8c30478314f6e5fc2a7b832c909ed35d5b0"

patches:
  "0.2.17":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "依赖发现兼容性：pkg_search_module(PCRE) 增加 pcre 作为首选候选（Conan 的 pcre 包导出 pcre.pc 而非 Debian 的 libpcre.pc）；并把 FindBacktrace 在 libc 自带 backtrace 的平台上留下的 Backtrace_INCLUDE_DIR-NOTFOUND 归一化为空列表，否则 CMake >= 3.28 拒绝其进入 include_directories()"
      patch_type: "portability"
    - patch_file: "patches/0002-build-scripts-bin2c.sh.patch"
      patch_description: "bin2c.sh 把 od|sed 结果直接流到 stdout，不再作为 printf 命令行参数展开：lib/stdlib.ngs 约 282KB，展开后约 1MB 超过本机 ARG_MAX(131072)，外部 /usr/bin/printf 报 Argument list too long。输出逐字节等价"
      patch_type: "portability"
    - patch_file: "patches/0003-lib-lang-tests.ngs.patch"
      patch_description: "lib/lang-tests.ngs 两条重定向用例的临时文件从硬编码 /tmp 改为构建目录下的相对路径：HarmonyOS 的 /tmp 是 erofs 只读挂载，被写方必然失败。用例语义（> 截断、>> 追加、stderr 重定向）不变"
      patch_type: "portability"
    - patch_file: "patches/0004-test.ngs.patch"
      patch_description: "test.ngs 增加 platform_skip()：显式枚举并跳过依赖宿主能力（根目录可 readdir/access、/var 存在、PCRE (*UTF) 分支、AF_UNIX socket bind）的 8 条上游断言，输出 + SKIP: 行并单独计数，上游 tests_counter > 540 自检改为 tests_counter + skipped_counter > 540；其余断言仍按上游语义失败即中断。跳过模式按代码片段枚举（dir(\"/\")、Dir(\"/\")、access(File(\"/\")、(*UTF)、c_sockaddr_un(），其中 c_sockaddr_un( 同时覆盖 DGRAM 与 STREAM 两条 bind 用例，缺它会导致套件在 net.ngs 处 abort 并丢失其后所有断言"
      patch_type: "portability"
