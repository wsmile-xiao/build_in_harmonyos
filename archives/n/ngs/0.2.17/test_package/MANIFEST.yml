package: ngs/0.2.17
homepage: "https://ngs-lang.org/"
upstream_check_command: "ctest -V"
upstream_test_in_build: true
upstream_test_command: "cmake.test() -> ctest : add_test(all bash -c 'NGS_PATH=<src>/lib <bin>/ngs <src>/test.ngs')"
# R51 清点：上游 762 条 TEST 断言 = 84 (lang-tests) + 536 (stdlib) + 142 (autoload)。
# test.ngs 从这三处抓取 `TEST <expr>` 行逐条求值，末尾自检 tests_counter > 540。
# 用 ctest -V 而非 --output-on-failure：用例通过时后者不回显被测进程 stdout，
# 上游自报的 "OK. Tests: N Skipped(platform): M" 统计行将无法采集。
upstream_tests:
  - name: "all"
    source: "CMakeLists.txt:169 add_test(all ...)"
    description: "上游唯一注册的 ctest 用例；驱动 test.ngs 顺序执行 lib/lang-tests.ngs、lib/stdlib.ngs 与 lib/autoload/**.ngs 中所有 TEST 断言。实测 1/1 passed（762 条 = 754 执行 + 8 平台跳过）"
    command: "ctest -V"
  - name: "lang-tests.ngs"
    source: "lib/lang-tests.ngs"
    description: "语言语义 TEST 断言。清点 84 条，实测执行 84 / 跳过 0"
    command: "ngs test.ngs lib/lang-tests.ngs"
  - name: "stdlib.ngs"
    source: "lib/stdlib.ngs"
    description: "标准库 TEST 断言。清点 536 条，实测执行 530 / 跳过 6（根目录 readdir 4、access(/) 1、PCRE (*UTF) 1）"
    command: "ngs test.ngs lib/stdlib.ngs"
  - name: "autoload/*.ngs"
    source: "lib/autoload/**.ngs（含 globals/ 45 个模块）"
    description: "惰性加载的类型与方法库 TEST 断言。清点 142 条，实测执行 140 / 跳过 2（net.ngs:37 与 :42 的 AF_UNIX bind EPERM）。由 test.ngs 以 find 自动纳入，非本适配新增"
    command: "ngs test.ngs lib/autoload/globals/<module>.ngs"
  - name: "tests/*.in"
    source: "tests/ 27 对 .in/.ok"
    description: "上游未注册 runner 的历史 fixture，本适配额外回放。实测 25 通过 / 2 失败（defined.in、local.in 使用 `dump(defined x)`，该写法在 0.2.17 语法中已不合法，属上游 fixture 陈旧而非移植缺陷）。回放口径：dump() 输出走 stderr，需 stdout+stderr 合并比对；ngs 以脚本最后表达式求值作为进程退出码，故 closure.in 输出与 .ok 完全一致而退出码为 10，按输出一致性判为通过"
    command: "ngs tests/<name>.in"
test_package_tests:
  - file: test.sh
    description: "执行包内 ngs 二进制：版本自证、NGS_PATH 标准库加载、-e 表达式求值（字符串插值），然后转入 ngs_smoke.ngs"
    command: "bash test.sh"
  - file: ngs_smoke.ngs
    description: "依赖链功能断言：json-c(encode/decode_json + JsonDecodeFail) pcre(~ 单匹配、~~ 全匹配、位置与命名捕获) bdw-gc(2 万长持对象 + 2 万 map 对象 + 200 个带 padding 短命对象 churn 后一致性) libffi(多方法分派)；语言核心表达式一律取上游已验证写法（半开/闭区间、ns 下划线私有、flatten 无参、隐式 map、line: 反引号）"
    command: "ngs ngs_smoke.ngs"
assertion_count: 36
assertion_breakdown: "test.sh 4 项（version / NGS_PATH+stdlib 存在 / interp-eval / smoke 入口）+ ngs_smoke.ngs 32 项 assert"
