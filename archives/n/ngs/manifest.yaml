# 软件级 manifest
# 文件位置: archives/n/ngs/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: ngs
display: "NGS (Next Generation Shell)"
description: "面向日常开发与运维任务的脚本语言与交互式 shell"
category: lang
homepage: "https://ngs-lang.org/"
license: Apache-2.0

build_system: cmake

ohos_adaptation:
  key_points:
    - "构建期需要 peg/leg 的 leg 生成解析器：以 tool_requires(peg) 提供并显式传 -DLEG，避免宿主 PATH 上的陈旧 leg"
    - "build-scripts/bin2c.sh 需要 GNU sed，以 tool_requires(sed) 提供并显式传 -DSED"
    - "上游按 Debian 命名 pkg_search_module(PCRE) 查找 libpcre，Conan 的 pcre 包导出 pcre.pc，需放宽候选名"
    - "libc 自带 backtrace(3) 时 FindBacktrace 把 Backtrace_INCLUDE_DIR 留成 *-NOTFOUND，CMake >= 3.28 会拒绝它进入 include_directories()，需归一化为空"
    - "bin2c.sh 把 od|sed 结果作为 printf 命令行参数展开，stdlib.ngs（~282KB）转义后约 1MB 超过 ARG_MAX(131072)，需改为流式输出"
    - "上游测试中硬编码 /tmp 的写用例必须改用相对路径（HarmonyOS 的 /tmp 是 erofs 只读挂载）"
    - "唯一测试入口是 CMake 注册的 1 个 ctest 用例（ngs test.ngs）；test.ngs 从 lib/*.ngs 与 lib/autoload/**.ngs 抽取 TEST 行求值，共 762 条"
    - "依赖链交由 Conan 管理，不给 libjson-c.so.5 写 RPATH（鸿蒙 $ORIGIN/../lib 不稳定），运行前必须注入 conan runenv"
    - "NGS_PATH 由包导出（buildenv_info + runenv_info）指向 <pkg>/lib/ngs，缺失时 autoload 模块不会惰性加载"
    - "宿主能力缺口（根目录 readdir/access EACCES、/var 不存在、pcre 未开 UTF、AF_UNIX bind EPERM）导致的 8 条上游断言由补丁显式跳过，详见版本级 manifest 的 platform_gaps"
  common_dependencies:
    - json-c
    - libffi
    - bdw-gc
    - pcre

versions:
  "0.2.17":
    status: built
    build_date: "2026-09-16"
