software: nkf
version: "2.1.5"
status: built
build_date: "2026-08-07"
build_system: makefile

source:
  url: "https://github.com/nurse/nkf/archive/refs/tags/v2_1_5.tar.gz"
  sha256: "10cf6eb3d4d095919185ac224d5a634e9926d731e656d04bacb270e5cae0e28c"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - 'CC=clang'
    - 'CFLAGS=-fPIC -O2 -Wall'
    - 'MKDIR=mkdir -p'
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.patch"

knowledge_gained:
  - "nkf 使用简单 Makefile，不需要 configure 步骤"
  - "需修改 Makefile 中 man 路径从 prefix/man 到 prefix/share/man"
  - "make install 不支持 DESTDIR，需手动调整 prefix 参数实现 staging 安装"
  - "nkf 是命令行工具，package_type 应为 application 而非 library"
  - "conanfile.py 中需使用 cwd=self.source_folder 因为 basic_layout 将构建目录设为子目录"
