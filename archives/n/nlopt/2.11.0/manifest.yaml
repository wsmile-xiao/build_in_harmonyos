# 版本级 manifest — nlopt 2.11.0
# 遵循 ARCHIVE-SPEC v2.0

version: "2.11.0"
software: nlopt
status: built
build_date: "2026-09-29"
build_system: "cmake"

source:
  url: "https://github.com/stevengj/nlopt/archive/refs/tags/v2.11.0.tar.gz"
  sha256: "53e552d83e9294d67db37f0f4a23f15933a9ef698485301a18b98b40004cf0de"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DNLOPT_CXX=ON"
    - "-DNLOPT_PYTHON=OFF"
    - "-DNLOPT_OCTAVE=OFF"
    - "-DNLOPT_MATLAB=OFF"
    - "-DNLOPT_GUILE=OFF"
    - "-DNLOPT_SWIG=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "nlopt 2.11.0 是 CMake 构建系统（非 autotools），conan-init 须先修正版本级 manifest 的 build_system/system 字段再生成配方，否则会误用 Autotools 模板"
  - "nlopt 顶层 CMake 默认开启 Python/Octave/Matlab/Guile/SWIG 可选绑定（find_package），OHOS 无对应工具链，须在 generate() 中显式 -DNLOPT_*=OFF 关闭，保留 NLOPT_CXX 与 NLOPT_TESTS"
  - "test_package 消费侧链接：NLOPT_CXX=ON 使 libnlopt.a 包含 C++ 符号（operator delete 等），test_package 必须用 project(... CXX) 编译，C 项目链接会报 ld.lld undefined symbol 缺 libc++ 运行时"
  - "OHOS 本机 /data/service/hnp/bin 下 cmake/ctest 二进制依赖 libc++_shared.so（位于 SDK llvm/lib/aarch64-linux-ohos/），LD_LIBRARY_PATH 须前置该目录，否则报 Error relocating 符号找不到"
