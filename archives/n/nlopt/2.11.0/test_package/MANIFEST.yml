# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: nlopt/2.11.0
homepage: "https://github.com/stevengj/nlopt"

# 上游测试命令 (CTest 注册清单)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游 test/CMakeLists.txt 注册完整清单 94 项；
# OHOS 实测运行其中 77 项，均为 C++/testopt 参数化测试）
upstream_tests:
  - file: test/CTestTestfile.cmake
    source: nlopt-2.11.0/test/CTestTestfile.cmake
    description: "上游 CTest 注册 94 项；OHOS 实测运行 77 项（t_tutorial/t_bounded/t_except/t_fbound/testopt/cpp_functor），其余 17 项为语言绑定测试（Python/Java/Octave/Matlab/Guile/Fortran），OHOS 无对应运行时未运行"
    command: "ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用 NLOPT_LN_COBYLA 最小化 x^2+1，验证 nlopt.h API 链接可用性"
    command: "./test_nlopt"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 78
