sources:
  # Fetch from the GitCode mirror (github.com/arybczak/ncmpcpp is unreachable on the CI worker) and pin the immutable commit behind the tag.
  git: "https://gitcode.com/ncmpcpp/ncmpcpp.git"
  tag: "0.10.1"
  commit: "3e6d992b938de9ba3019302027bd64dbcab6f8c6"

patches:
  - patch_file: "patches/0001-configure-ac-ohos.patch"
    patch_description: "configure.ac: drop BOOST_LOCALE/BOOST_REGEX/ICU/readline checks that the OHOS package repository cannot satisfy"
    patch_type: "portability"
  - patch_file: "patches/0002-readline-compat.patch"
    patch_description: "replace GNU readline with a minimal built-in compatibility layer"
    patch_type: "portability"
  - patch_file: "patches/0003-std-regex.patch"
    patch_description: "migrate boost::regex to std::regex (libboost_regex is not shipped by the OHOS boost package)"
    patch_type: "portability"
  - patch_file: "patches/0004-locale-and-encoding.patch"
    patch_description: "replace boost::locale with a built-in UTF-8 codec and ASCII-aware toLower"
    patch_type: "portability"
  - patch_file: "patches/0005-boost-cxx20-compat.patch"
    patch_description: "include boost/type_traits/add_const.hpp before boost/range in interfaces.h (Boost 1.90 header uses unqualified add_const under C++20)"
    patch_type: "portability"