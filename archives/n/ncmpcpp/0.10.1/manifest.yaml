software: ncmpcpp
version: "0.10.1"
status: built
build_date: "2026-08-09"
build_system: autotools

source:
  url: "https://gitcode.com/ncmpcpp/ncmpcpp.git"
  tag: "0.10.1"
  commit: "3e6d992b938de9ba3019302027bd64dbcab6f8c6"

build:
  system: autotools
  configure_options:
    - "--with-lto=no"
  dependencies:
    - boost/1.90.0.1
    - libmpdclient/2.23
    - ncurses/6.5
    - curl/8.15.0

patches_applied:
  - "0001-configure-ac-ohos.patch"
  - "0002-readline-compat.patch"
  - "0003-std-regex.patch"
  - "0004-locale-and-encoding.patch"
  - "0005-boost-cxx20-compat.patch"

test_results:
  type: official
  total: 1
  passed: 1
  failed: 0
  notes: "test_package 冒烟测试 2 项断言全过；L0/L1/L4/L5 通过，L2 非阻塞 skip（CI 校验 #3519，2026-08-09 r16）"

knowledge_gained:
  - "OHOS package repository ships no GNU readline and ncmpcpp integrates it deeply; a minimal readline compatibility layer covers the APIs used by window.cpp"
  - "OHOS boost/1.90.0.1 has no libboost_regex/libboost_locale; regex moved to std::regex and locale moved to a built-in UTF-8 codec with ASCII toLower"
  - "configure is pre-generated from configure.ac and shipped with the recipe; timestamps must keep configure.ac < aclocal.m4 < configure < Makefile.in so make never re-invokes autotools"
  - "HMDFS config.status uses umask 077; replace with 022 before running configure, and pass explicit --build/--host=aarch64-unknown-linux-ohos"
  - "OHOS boost/1.90.0.1 omits the header-only boost/format library; the missing headers (Boost 1.84, BSL-1.0) are vendored under files/boost-format and exposed via CPPFLAGS -I vendor-boost"
  - "Boost.System is header-only since 1.69; the pre-generated configure skips the libboost_system search for boost >= 1.69"