# test_package/MANIFEST.yml
package: ncmpcpp/0.10.1
homepage: "https://ncmpcpp.rybczak.net"

# Upstream test command (conclusion from `make -n check` analysis)
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream actually runs no tests
upstream_tests: []

excluded_upstream_tests:
  - command: "make check"
    reason: "ncmpcpp 0.10.1 registers no TESTS/check_PROGRAMS targets in its Makefile.am, so make check is an empty operation; the upstream tree has no standalone automated test suite"

# Tests shipped in test_package (consumer-side verification)
test_package_tests:
  - file: test_ncmpcpp.sh
    description: "Smoke test: (1) ncmpcpp --version runs successfully, (2) its output contains 0.10.1"
    command: "bash test_ncmpcpp.sh"

# Total assertion count (2 assertions in test_ncmpcpp.sh)
assertion_count: 2