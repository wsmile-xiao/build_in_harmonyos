# 软件级 manifest
# 文件位置: archives/n/nanosvg/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: nanosvg
display: "nanosvg"
description: "Simple stupid SVG parser and anti-aliased rasterizer (two single-header libraries, Zlib)"
category: library
homepage: "https://github.com/memononen/nanosvg"
license: "Zlib"

build_system: cmake

ohos_adaptation:
  key_points:
    - "上游自带 CMakeLists.txt 双静态库方案直用（零补丁）：configure_file 由两公开头生成实现单 TU（NANOSVG_IMPLEMENTATION / NANOSVGRAST_IMPLEMENTATION）"
    - "双 header-only 库形态：libnanosvg.a（解析器）+ libnanosvgrast.a（光栅化器），package_info() components 双组件映射上游 CMake export（NanoSVG::nanosvg / NanoSVG::nanosvgrast）"
    - "纯 C99 零第三方依赖（libc/libm），OHOS aarch64 musl 交叉编译零补丁通过"
    - "上游无测试注册（CMakeLists 无 enable_testing/add_test，example/ 为手动构建演示）→ 消费者断言套件在 test_package 验证双库"
  common_dependencies: []

versions:
  "0.0-git.239e102":
    status: built
    build_date: 2026-10-04
    conan_ref: "nanosvg/0.0-git.239e102"
