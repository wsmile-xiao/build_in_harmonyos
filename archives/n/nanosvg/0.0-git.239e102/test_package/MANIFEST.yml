# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nanosvg/0.0-git.239e102
homepage: "https://github.com/memononen/nanosvg"

# 上游测试命令
# 清点结论（证据见 notes.md）：
#   - 上游 CMakeLists.txt（master @ 239e102）无 enable_testing / add_test /
#     add_subdirectory(test...) —— 构建 0 个测试目标
#   - example/example1.c、example2.c 为手动构建的渲染演示程序
#     （读 example/*.svg 渲染出 PNG，依赖 stb_image_write.h），非自动化测试
#   - 仓库无 test/ 目录、无 CI 配置（无 .travis.yml / .github/workflows）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（nanosvg 上游无随包自动化测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者断言套件（双库均验证）: 解析器 — 内嵌 SVG 字符串 nsvgParse 非空/1 shape/1 path/npts=13/closed/bounds=[0,0,10,10]/默认填充不透明黑 0xff000000/默认描边 none/显式宽高与 stroke 颜色 0xff0000ff 解析；光栅化器 — nsvgCreateRasterizer 创建/scale=1 全 100 像素覆盖且中心 (0,0,0,255)/scale=2 全 400 像素覆盖且 18x18 内部 324 像素全覆盖 (30 条断言, 全部锚点经实测校准)"
    command: "./test_nanosvg"

# 测试断言总数 (test_package CHECK)
assertion_count: 30
