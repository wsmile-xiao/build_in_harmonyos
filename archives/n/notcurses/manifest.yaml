software: notcurses
display: "notcurses"
description: "TUI library for modern terminal applications with multimedia support"
category: system
homepage: "https://github.com/dankamongmen/notcurses"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS 终端不响应 DA1/DA2/DSRCPR 等查询：经 NOTCURSES_TERM_QUIRKS 构建选项跳过，光标报告等待有 250ms 超时兜底"
    - "SMCUP 和 KKBDENTER 必须发送以确保备选屏幕和键盘正常"
    - "pthread_cancel/ppoll/mremap 在 OHOS libc 不可用：CMake check_symbol_exists 特性检测（HAVE_PTHREAD_CANCEL/HAVE_PPOLL/HAVE_MREMAP）选择回退路径，无平台宏"
    - "无 pthread_cancel 时线程收尾一律协作式关闭（stop 标志 + 有界 poll + SIGWINCH/管道唤醒 + join + 释放）"
  common_dependencies:
    - ncurses
    - libunistring
    - libdeflate

versions:
  "3.0.17":
    status: built
    build_date: "2026-09-17"
