software: notcurses
display: "notcurses"
description: "TUI library for modern terminal applications with multimedia support"
category: system
homepage: "https://github.com/dankamongmen/notcurses"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS终端不响应DA1/DA2等查询，必须跳过send_initial_queries中需要响应的序列"
    - "SMCUP和KKBDENTER必须发送以确保备选屏幕和键盘正常"
    - "pthread_cancel被禁用，用pthread_detach替代cancel_and_join"
    - "ppoll不可用，用poll替代"
    - "__OHOS__宏由Clang 15自动预定义"
  common_dependencies:
    - ncurses
    - libunistring
    - libdeflate

versions:
  "3.0.17":
    status: published
    build_date: "2026-04-16"
