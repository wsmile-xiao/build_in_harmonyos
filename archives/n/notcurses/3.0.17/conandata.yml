# conandata.yml — notcurses 3.0.17
# Platform differences resolved via configure-time feature detection
# (HAVE_PTHREAD_CANCEL / HAVE_PPOLL / HAVE_MREMAP) and the
# NOTCURSES_TERM_QUIRKS build option — no platform macros in patches (R8).

sources:
  url: "https://github.com/dankamongmen/notcurses/archive/refs/tags/v3.0.17.tar.gz"
  sha256: "b0fbe824984fe25b5a16770dbd00b85d44db5d09cc35bd881b95335d0db53128"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Feature-detect pthread_cancel/ppoll/mremap (HAVE_* macros), add NOTCURSES_TERM_QUIRKS option, make libm/librt optional"
    patch_type: "portability"
  - patch_file: "patches/0002-src-demo-input.c.patch"
    patch_description: "Cooperative stop_input() when pthread_cancel is unavailable (poll loop + join, no deadlock)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-demo-reel.c.patch"
    patch_description: "Cooperative kill_tablet() when pthread_cancel is unavailable (stop flag + SIGWINCH wake)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-lib-fbuf.h.patch"
    patch_description: "Use malloc/realloc/free when mremap is not declared (HAVE_MREMAP feature detection)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-lib-fd.c.patch"
    patch_description: "Stop-pipe wake for ncfdplane_destroy when pthread_cancel is unavailable; join subprocess threads after SIGKILL"
    patch_type: "portability"
  - patch_file: "patches/0006-src-lib-in.c.patch"
    patch_description: "poll() fallback when ppoll is not declared (HAVE_PPOLL); cooperative input-thread shutdown: bounded poll + stop flag + join + free_inputctx (fixes memory/fd leak)"
    patch_type: "portability"
  - patch_file: "patches/0007-src-lib-in.h.patch"
    patch_description: "Declare inputlayer_clear_initdata for NOTCURSES_TERM_QUIRKS builds"
    patch_type: "portability"
  - patch_file: "patches/0008-src-lib-internal.h.patch"
    patch_description: "cancel_and_join degrades to join-only without HAVE_PTHREAD_CANCEL; stoppipe member for ncfdplane"
    patch_type: "portability"
  - patch_file: "patches/0009-src-lib-reader.c.patch"
    patch_description: "Handle synthesized Enter as newline, fix cursor position on ncreader_clear (NOTCURSES_TERM_QUIRKS)"
    patch_type: "portability"
  - patch_file: "patches/0010-src-lib-termdesc.c.patch"
    patch_description: "Skip status queries the terminal never answers (NOTCURSES_TERM_QUIRKS)"
    patch_type: "portability"
