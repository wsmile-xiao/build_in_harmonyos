# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: notcurses/3.0.17
homepage: "https://github.com/dankamongmen/notcurses"

# Upstream test command
upstream_check_command: "ctest -N"

# Conan build() does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (notcurses uses doctest, disabled via USE_DOCTEST=OFF)
upstream_tests:
  - file: "src/tests/main.cpp"
    source: "notcurses-3.0.17/src/tests/main.cpp"
    description: "doctest-based unit tests (disabled on OHOS, requires doctest)"
    command: "notcurses-tester"
  - file: "src/tests/cell.cpp"
    source: "notcurses-3.0.17/src/tests/cell.cpp"
    description: "46 doctest TEST_CASEs across 46 files total (matrix/cell/plane/reader/selector, see reports/test-report.md)"
    command: "notcurses-tester"

# test_package consumer tests
test_package_tests:
  - file: test.c
    description: "notcurses_version() API + version string; pty-based init/render/keypress/stop functional cycle"
    command: "./test_notcurses"

# Approximate assertion count
assertion_count: 8
