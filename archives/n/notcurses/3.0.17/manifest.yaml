knowledge_gained:
  - "OHOS终端不响应DA1/DA2等查询，必须用#ifdef __OHOS__跳过send_initial_queries中需要响应的序列"
  - "SMCUP和KKBDENTER不需要响应，必须在OHOS上发送以确保备选屏幕和键盘正常"
  - "OHOS上pthread_cancel被禁用，cancel_and_join会永久阻塞，需用pthread_detach替代"
  - "OHOS上ppoll不可用，用poll替代"
  - "__OHOS__宏由Clang 15自动预定义，无需手动定义"
