software: notcurses
version: 3.0.17
status: built
build_system: cmake
build_date: "2026-09-17"
created_at: 2026-04-16
updated_at: 2026-09-17
knowledge_gained:
  - "OHOS 终端不响应 DA1/DA2/DSRCPR/DIRECTIVES 查询（会令 pthread_cond_wait 永久阻塞）；SMCUP/KKBDENTER 无需响应、必须发送。通过 NOTCURSES_TERM_QUIRKS 构建选项跳过（构建系统层配置，非平台宏，R8 合规）"
  - "OHOS libc（musl 定制）不提供 pthread_cancel（头文件与符号均缺失）；ppoll/mremap 符号存在但默认（无 _GNU_SOURCE 时）不被头文件声明。全部用 CMake check_symbol_exists 特性检测（HAVE_PTHREAD_CANCEL/HAVE_PPOLL/HAVE_MREMAP）在配置期选择回退路径"
  - "无 pthread_cancel 时的线程收尾模式：协作式关闭（stop 标志 + 有界 poll 超时 + SIGWINCH 唤醒 + join + 释放资源），替代 detach-泄漏方案；fdplane 用 stoppipe 唤醒阻塞中的 poll"
