# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nng/1.8.0
homepage: "https://nng.nanomsg.org/"
upstream_check_command: "ctest -j4 --output-on-failure"

# conanfile.py build() 中 NNG_TESTS=OFF，上游完整测试在独立源码构建中执行
upstream_test_in_build: false
upstream_test_command: "ctest -j4 --output-on-failure"

# 上游实际运行的测试（cmake 构建的 ctest 套件，86 项）
upstream_tests:
  - file: tests/CMakeLists.txt
    source: nng-1.8.0/tests/CMakeLists.txt
    description: "NNG 上游 ctest 套件：86 项执行，82 通过（95%）；ipc_test/multistress/reqstress 受 HarmonyOS IPC 与 /tmp 写入权限限制，tcp_test 1 项非法地址错误码映射差异，均为平台限制非源码缺陷"
    command: "ctest -j4 --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者: nng_pair0_open/nng_close/nng_version 实质 API 调用"
    command: "./test_nng"

assertion_count: 4