package: nng/1.10.1
homepage: "https://github.com/nanomsg/nng"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "ctest -j 4 --output-on-failure"

upstream_tests:
  - file: "tests/CMakeLists.txt"
    source: "nng-1.10.1/tests/CMakeLists.txt"
    description: "44 upstream unit tests: core, platform, protocol, transport, supplemental, compatibility, and C++ API coverage."
    command: "ctest -R '^(nng\\.(core|platform|sp\\.|supplemental)|nng\\.compat\\.compat|nng\\.cplusplus_pair)' --output-on-failure"
  - file: "tests/CMakeLists.txt"
    source: "nng-1.10.1/tests/CMakeLists.txt"
    description: "43 upstream integration and stress tests: inproc, IPC, TCP, TLS, WebSocket, HTTP, device, compatibility, and stress coverage."
    command: "ctest -R '^(nng\\.(inproc|ipc|ipcsupp|multistress|nonblock|options|pipe|pollfd|scalability|synch|tls|tcpsupp|tcp|tcp6|ws|wss|reqctx|reqstress|compat_))' --output-on-failure"

test_package_tests:
  - file: test.c
    description: "Consumer API test opens and closes an nng_pair0 socket through nng::nng."
    command: "test_nng"
  - file: test_package/conanfile.py
    description: "Consumer CLI test executes nngcat --version."
    command: "nngcat --version"

assertion_count: 88
