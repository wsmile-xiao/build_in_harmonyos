# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: nss/3.118.1
homepage: "https://developer.mozilla.org/en-US/docs/Mozilla/Projects/NSS"

# 上游测试命令
upstream_check_command: "make tests"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: nss/cmd/bltest/bltest
    source: nss-3.118.1/nss/cmd/bltest
    description: "底层加密算法向量测试（SHA-256/SHA-1/MD5/AES-128-ECB，本机实际运行通过，详见 reports/test-report.md）"
    command: "bltest -H -m sha256 / -m sha1 / -m md5; bltest -E -m aes_ecb"
  - file: nss/tests/all.sh
    source: nss-3.118.1/nss/tests/all.sh
    description: "NSS 上游全量测试套件入口（cert/ssl/smime/pkix 等，需要完整证书库环境）"
    command: "./all.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：NSS_NoDB_Init 真实初始化（加载 softoken/freebl）+ SHA-256('abc') NIST 向量验证 + NSS_GetVersion() 版本断言 + SEC_OID 常量校验 + 库链接/加载"
    command: "./test_nss"

# 测试断言总数
assertion_count: 4
