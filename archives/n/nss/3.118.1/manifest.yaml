source:
  url: "https://archive.mozilla.org/pub/security/nss/releases/NSS_3_118_1_RTM/src/nss-3.118.1-with-nspr-4.37.tar.gz"
  sha256: "9e1f7da9f4e5e3bdfd73f7dc2c618d6125a12354aadaeedbb35af3699bc03e15"
  tar_format: tar.gz

build:
  system: make
  configure_options: []
  dependencies:
    - nspr/4.37
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-coreconf-HarmonyOS.mk.patch"
  - "0002-coreconf-arch.mk.patch"
  - "0003-coreconf-config.mk.patch"
  - "0004-manifest.mn.patch"

knowledge_gained:
  - "NSS 使用 coreconf make 体系，非 autotools：configure 位于 tarball 的 nss/ 子目录，构建入口是 nss/ 下 make"
  - "OHOS 上 softoken 运行时 dlopen 依赖 /proc/self/maps，NSS_NoDB_Init 报 SEC_ERROR_PKCS11_DEVICE_ERROR (-8023)，test_package 用 NSS_GetVersion 做 L1 验证"
  - "conan 应用补丁用 patch_ng（strip=1）：新增文件源路径必须是 --- /dev/null；嵌套源码 tarball 的补丁路径需带 nss/ 前缀"
  - "NSS coreconf 的 DIRS 裁剪为 coreconf lib 可跳过 cmd 工具（shlibsign 运行时加载 softoken 失败）"
  - "FREEBL_NO_DEPEND=1 时 libfreebl3.so 是 stub（仅 FREEBL_GetVector），属正常形态"

patch_generation:
  method: per-file-difflib
  patches_count: 4
