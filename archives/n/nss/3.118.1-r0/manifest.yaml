software: nss
version: 3.118.1-r0
status: published
source_url: https://archive.mozilla.org/pub/security/nss/releases/NSS_3_118_1_RTM/src/nss-3.118.1-with-nspr-4.37.tar.gz
source_size: 75M
source_checksum: (verified)
build_system: make
description: Mozilla Network Security Services library for HarmonyOS

dependencies:
  - name: nspr
    version: 4.37
    required: true
    status: compiled
    location: ~/usr/local/lib/
    libraries:
      - libnspr4.so (268KB)
      - libnspr4.a (424KB)
      - libplc4.so (35KB)
      - libplc4.a (25KB)
      - libplds4.so (26KB)
      - libplds4.a (9KB)
    headers: ~/usr/local/include/nspr/
  - name: sqlite3
    version: 3.49.1
    required: false
    available: system
  - name: zlib
    version: 1.3.1
    required: false
    available: true
  - name: openssl
    version: 1.1.1w
    required: false
    available: true

build_config:
  compiler: clang 15.0.4
  cflags: "-fPIC -O2 -D__OHOS__"
  ldflags: ""
  build_env:
    TMPDIR: /data/storage/el2/base/cache
  
known_issues:
  - "OpenHarmony HMDFS 临时目录权限限制，需设置 TMPDIR=/data/storage/el2/base/cache"
  - "需要手动创建 config.guess/config.sub"
  - "Python libiconv.so.2 加载错误影响 build.sh"
  - "GYP 工具未安装"
  - "NSS 编译需要批量修改 lib/*/manifest.mn 添加 REQUIRES = nspr"

build_progress:
  nspr:
    status: completed
    date: 2026-05-25
    method: configure + make with TMPDIR workaround
    result: success
    notes: "NSPR 4.37 编译成功，产物已安装到 ~/usr/local/"
  
  nss:
    status: completed
    date: 2026-05-25
    method: make libs with REQUIRES fix
    result: success
    notes: "NSS 3.118.1 编译成功，所有库文件和工具程序已生成"
    completed_tasks:
      - "创建 HarmonyOS.mk 配置文件"
      - "修改 arch.mk 添加 HarmonyOS 平台识别"
      - "修改 config.mk 添加 HarmonyOS 到 TARGET_OSES"
      - "批量修改 lib/*/manifest.mn 添加 REQUIRES = nspr (43个文件)"
      - "编译 NSS 库文件（libnss3.so, libssl3.so, libsmime3.so, libnssutil3.so等）"
      - "编译 NSS 工具程序（certutil, pk12util, modutil, cmsutil, crlutil, signtool）"
      - "验证编译产物"
      - "创建归档目录结构"
      - "创建预编译包 nss-3.118.1-r0-ohos-aarch64.tar.gz"

patches_applied:
  - name: 0001-nspr-config-guess-ohos.patch
    status: created
    description: "OpenHarmony config.guess 快速修复"
  - name: 0002-config-status-tmpdir.patch
    status: created
    description: "修改 config.status 支持 TMPDIR 环境变量"
  - name: 0003-nss-harmonyos-config.patch
    status: created
    description: "NSS HarmonyOS 配置文件补丁（HarmonyOS.mk, arch.mk, config.mk）"

