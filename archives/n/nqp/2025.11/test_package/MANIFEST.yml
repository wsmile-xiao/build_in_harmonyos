package: nqp/2025.11
homepage: "https://github.com/Raku/nqp"

upstream_test_in_build: true
upstream_test_command: "make test"
upstream_tests:
  - path: "t/**/*.t"
    framework: "TAP via prove"
    inventory_file_count: 153
    selected_file_count: 144
    not_selected_file_count: 9
    assertion_count: 13431
    note: "The MoarVM-only make test target selects 144 files. Five JVM tests, two JavaScript tests, and two documentation tests are not selected for this backend configuration. All reached assertions pass; t/nqp/019-file-ops.t stops at 71/112 because HMDFS does not support hard links. The recipe validates this exact platform result without modifying tests."

test_package_tests:
  - file: test.nqp
    description: "Exercise arithmetic, strings, arrays, hashes, classes and methods with packaged NQP"
    command: "<package_folder>/bin/nqp test.nqp"
  - file: test_nqp.py
    description: "Assert packaged version, output count, and eight exact NQP behavior results"
    command: "python3 test_nqp.py <package_folder>/bin/nqp test.nqp"

assertion_count: 10
