# nanomsgxx 软件级 manifest
# 文件位置: archives/n/nanomsgxx/manifest.yaml
# 链接到 ARCHIVE-SPEC v2.0

software: nanomsgxx
display_name: "nanomsgxx C++11 binding"
description: "nanomsg 的简单 C++11 绑定库（SP/PAIR/REQ/REP/PUB/SUB 等可扩展消息模式）"
category: network
homepage: "https://github.com/achille-roussel/nanomsgxx"
license: MIT
build_system: waf

# 跨版本适配要点
ohos_adaptation:
  key_points:
    - "上游 0.2 打包的是 Python 2 时代 waf 1.7.11（py3 下不可运行），需替换为 py3 兼容 waf 2.0.22（与 Homebrew nanomsgxx.rb 公式同款，上游 master 提交 4426567809，sha256 一致）"
    - "tests/wscript 需应用上游 commit 08c6d88 / PR#13 补丁（f = f.path_from(waf.path)），否则 waf 2.x 报 'source not found'"
    - "waf 运行时需注入 CC/CXX/AR/RANLIB 与 nanomsg 依赖头文件/库路径（工具链来自 profile tools.build:compiler_executables，头库来自依赖包的 cpp_info）"
  patches_needed:
    - "patches/0001-nnxx-wscript-py3.patch：src/nnxx/wscript 的 print cmd → print(cmd)"
    - "patches/0002-tests-wscript-newer-waf.patch：tests/wscript f.path_from(waf.path)"

# 版本索引
versions:
  - version: "0.2"
    status: published
    build_date: "2026-09-19"
    patches: 2
    notes: "waf 1.7.11→2.0.22 替换 + 2 个 py3/新版 waf 补丁；上游 14 项单元测试（waf --alltests）14/14 通过；依赖 nanomsg/1.2"
