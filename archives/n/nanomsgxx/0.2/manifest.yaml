# 版本级 manifest — nanomsgxx 0.2
# 文件位置: archives/n/nanomsgxx/0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.2"
software: nanomsgxx

# 编译状态
# published | built | failed | archived
status: built

# 编译信息
build_date: "2026-09-19"
build_system: waf

# 源码信息
source:
  url: "https://github.com/achille-roussel/nanomsgxx/archive/refs/tags/0.2.tar.gz"
  sha256: "116ad531b512d60ea75ef21f55fd9d31c00b172775548958e5e7d4edaeeedbaa"
  tar_format: tar.gz

# 额外源码（py3 兼容 waf 2.0.22，Homebrew 同款上游 master 提交 4426567809）
extra_sources:
  - name: waf
    url: "https://raw.githubusercontent.com/achille-roussel/nanomsgxx/4426567809a79352f65bbd2d69488df237442d33/waf"
    sha256: "0a09ad26a2cfc69fa26ab871cb558165b60374b5a653ff556a0c6aca63a00df1"
    description: "py3 兼容 waf 2.0.22，替换上游 0.2 打包的 py2 时代 waf 1.7.11"

# 构建配置
build:
  system: waf
  # waf 配置选项（wscript 支持的选项）
  configure_options:
    - "--prefix=/"
    - "--libdir=/lib"
    - "--nodoc"
    - "--nopkgconfig"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - nanomsg/1.2

  # 编译器
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied:
  - "0001-nnxx-wscript-py3.patch"
  - "0002-tests-wscript-newer-waf.patch"

# 知识沉淀
knowledge_gained:
  - "上游老包常内嵌 py2 时代构建系统引导脚本（waf 1.7.11），直接替换为 py3 兼容 waf 2.x（Homebrew formula 同款）即可，无需放弃 waf"
  - "waf 2.x 下 tests/wscript 里 waf.path.ant_glob('*.cpp') 得到的节点需 f.path_from(waf.path)（上游 commit 08c6d88/PR#13），否则报 source not found"
  - "waf 运行环境需显式注入 CC/CXX/AR/RANLIB 与依赖头/库路径（profile buildenv + cpp_info），R33 禁止裸用 ${CC} 等 shell 变量"
  - "waf 2.x 跑单元测试用 waf --alltests（旧 --run_tests 已废弃）"

