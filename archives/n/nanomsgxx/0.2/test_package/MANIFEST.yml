# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nanomsgxx/0.2
homepage: "https://github.com/achille-roussel/nanomsgxx"

# 上游测试命令: nanomsgxx 0.2 使用 waf 构建，tests/wscript 注册每个 tests/*.cpp
# 为带 'test' feature 的 cxxprogram —— 没有 make check / ctest 目标。
# waf 2.x 下用 --alltests 执行全部单元测试并输出 execution summary。
upstream_check_command: "python3 ./waf build && python3 ./waf --alltests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 waf --alltests"

# 上游实际运行的测试程序（waf tests 目标，共 14 个，全部真实执行）
upstream_tests:
  - file: tests/test_message.cpp
    source: nanomsgxx-0.2/tests/test_message.cpp
    description: "nnxx::message 基本 API（构造/赋值/大小/数据）"
    command: "./build/tests/test_message"
  - file: tests/test_message_istream.cpp
    source: nanomsgxx-0.2/tests/test_message_istream.cpp
    description: "message_istream 从 message 流式读取"
    command: "./build/tests/test_message_istream"
  - file: tests/test_message_ostream.cpp
    source: nanomsgxx-0.2/tests/test_message_ostream.cpp
    description: "message_ostream 流式写入 message"
    command: "./build/tests/test_message_ostream"
  - file: tests/test_nnxx_ext.cpp
    source: nanomsgxx-0.2/tests/test_nnxx_ext.cpp
    description: "nnxx_ext C 扩展 API"
    command: "./build/tests/test_nnxx_ext"
  - file: tests/test_pair.cpp
    source: nanomsgxx-0.2/tests/test_pair.cpp
    description: "PAIR socket 双向消息发送/接收回环"
    command: "./build/tests/test_pair"
  - file: tests/test_pipeline.cpp
    source: nanomsgxx-0.2/tests/test_pipeline.cpp
    description: "PUSH/PULL 流水线模式"
    command: "./build/tests/test_pipeline"
  - file: tests/test_poll.cpp
    source: nanomsgxx-0.2/tests/test_poll.cpp
    description: "poll 多 socket 就绪检测"
    command: "./build/tests/test_poll"
  - file: tests/test_pubsub.cpp
    source: nanomsgxx-0.2/tests/test_pubsub.cpp
    description: "PUB/SUB 发布-订阅模式"
    command: "./build/tests/test_pubsub"
  - file: tests/test_readme.cpp
    source: nanomsgxx-0.2/tests/test_readme.cpp
    description: "README 示例代码编译运行回归"
    command: "./build/tests/test_readme"
  - file: tests/test_reqrep.cpp
    source: nanomsgxx-0.2/tests/test_reqrep.cpp
    description: "REQ/REP 请求-回复模式"
    command: "./build/tests/test_reqrep"
  - file: tests/test_reqrep_multi.cpp
    source: nanomsgxx-0.2/tests/test_reqrep_multi.cpp
    description: "REQ/REP 多客户端场景"
    command: "./build/tests/test_reqrep_multi"
  - file: tests/test_socket.cpp
    source: nanomsgxx-0.2/tests/test_socket.cpp
    description: "socket 生命周期/协议常量/地址绑定"
    command: "./build/tests/test_socket"
  - file: tests/test_survey.cpp
    source: nanomsgxx-0.2/tests/test_survey.cpp
    description: "SURVEYOR/RESPONDENT 调查-应答模式"
    command: "./build/tests/test_survey"
  - file: tests/test_timeout.cpp
    source: nanomsgxx-0.2/tests/test_timeout.cpp
    description: "recv/send 超时行为"
    command: "./build/tests/test_timeout"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_nanomsgxx.cpp
    description: "消费者测试：创建 nnxx::socket(SP/PAIR)、inproc:// bind/connect、消息发送接收回环"
    command: "./test_nanomsgxx"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
