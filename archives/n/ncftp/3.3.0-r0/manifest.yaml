software: ncftp
version: 3.3.0-r0
source: https://www.ncftp.com/public_ftp/ncftp/ncftp-3.3.0-src.tar.gz
status: built
description: A set of free application programs implementing FTP

configure_options:
  - --prefix=/storage/Users/currentUser/usr/local

build_system: autoconf

dependencies:
  - ncurses

binaries:
  - ncftp (268KB)
  - ncftpbatch (236KB)
  - ncftpbookmarks (383KB)
  - ncftpget (215KB)
  - ncftpls (191KB)
  - ncftpput (220KB)

compilation_date: 2026-05-27

platform: harmonyos
arch: aarch64

issues:
  - TMPDIR required for clang temp files (/tmp read-only)
  - ncftpbookmarks requires proper NCFTPPATH macro definition
