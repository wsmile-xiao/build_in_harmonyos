# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: nbsdgames/6.0.2.1
homepage: "https://github.com/abakh/nbsdgames"

upstream_check_command: "make test"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: Makefile
    source: nbsdgames-6.0.2.1/
    description: "上游 make test 为交互式冒烟入口（for game in ALL; do ./game; done），逐个启动游戏等待键盘输入，无 TTY 的 CI 环境无法完整自动化（实测 14/23 游戏报 Error opening terminal）。实测确认 sudoku/reversi/checkers/sos 支持 -h 输出 Usage，作为非交互子集在 test_package 真实运行"
    command: "make test"

test_package_tests:
  - file: test.sh
    description: "消费者测试: 真实运行可非交互验证的游戏子集（sudoku/reversi/checkers/sos 的 -h 冒烟），4 个验证点全部通过"
    command: "bash test.sh"

assertion_count: 4
