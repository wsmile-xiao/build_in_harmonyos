software: ntfy
version: 2.15.0-r5
status: published
build_system: custom
url: https://github.com/binwiederhier/ntfy/archive/refs/tags/v2.15.0.tar.gz
go_version: 1.24.2
cgo_enabled: true
build_tags: sqlite_omit_load_extension,osusergo,netgo
ldflags: "-X main.version=v2.15.0 -X main.commit=v2.15.0"
goroot: /storage/Users/currentUser/usr/local/go
configure_options: ""
dependencies: []
notes: |
  - Source downloaded from gitee.com mirror (GitHub unreachable from platform)
  - Used ~/usr/local/go/bin/go with GOROOT=~/usr/local/go (proper stdlib with crypto/pbkdf2)
  - GOTOOLCHAIN=local set to prevent auto-downloading
  - CGO_ENABLED=1 required for mattn/go-sqlite3
