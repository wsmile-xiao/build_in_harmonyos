package: nettle/3.10.2.1
homepage: "https://www.lysator.liu.se/~nisse/nettle/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (make check 执行 testsuite/ 下全部用例)
# 本机验证: All 117 tests passed (覆盖 aes/des/rsa/ecc/eddsa/gostdsa/sha/md5/hmac/pbkdf2/balloon 等)
upstream_tests:
  - file: testsuite/aes-test.c
    source: nettle-3.10.2/testsuite/aes-test.c
    description: "AES 加解密测试"
    command: "./aes-test"
  - file: testsuite/sha-test.c
    source: nettle-3.10.2/testsuite/sha-test.c
    description: "SHA1/SHA224/SHA256/SHA384/SHA512 哈希测试"
    command: "./sha-test"
  - file: testsuite/rsa-test.c
    source: nettle-3.10.2/testsuite/rsa-test.c
    description: "RSA 签名/验证测试"
    command: "./rsa-test"
  - file: testsuite/ecdsa-sign-test.c
    source: nettle-3.10.2/testsuite/ecdsa-sign-test.c
    description: "ECDSA 签名测试"
    command: "./ecdsa-sign-test"
  - file: testsuite/ed25519-test.c
    source: nettle-3.10.2/testsuite/ed25519-test.c
    description: "Ed25519 签名测试"
    command: "./ed25519-test"
  - file: testsuite/pbkdf2-test.c
    source: nettle-3.10.2/testsuite/pbkdf2-test.c
    description: "PBKDF2 密钥派生测试"
    command: "./pbkdf2-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 真实调用 nettle SHA256('abc') 与 AES-128 块加密并断言已知结果，失败返回非 0"
    command: "./test_nettle"

# 测试断言总数 (近似值)
# 上游 117 个测试全通过; test_package 含 2 个独立断言
assertion_count: 119
