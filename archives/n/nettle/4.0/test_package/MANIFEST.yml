package: nettle/4.0
homepage: "https://www.lysator.liu.se/~nisse/nettle/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "testsuite"
    source: "nettle-4.0/testsuite"
    description: "Upstream test suite: AES/DES/ChaCha/SHA1/SHA2/SHA3/HMAC/PBKDF2/Ed25519/RSA/etc"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "SHA256('abc') digest assertion + AES-128 block encryption assertion"
    command: "./test_nettle"

assertion_count: 2
