software: nettle
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/nettle/nettle-4.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--enable-shared"
  
  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libxml2/2.15.3"  # lld链接器依赖
    - "gmp/6.3.0"       # hogweed库依赖
  
  # 编译器
  cc: ~/tmp/wrappers/cc-wrapper  # E064 wrapper自动签名
  cxx: ~/tmp/wrappers/cxx-wrapper

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess-harmonyos-support.patch"
  - "0002-config.sub-ohos-linux-support.patch"
  - "0003-configure-umask-fix.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E064: 编译器wrapper自动签名，使用ld.bfd链接器（-fuse-ld=/data/service/hnp/bin/ld.bfd）"
  - "E072: config.guess添加HarmonyOS快速识别，config.sub添加ohos-linux映射"
  - "E011: configure umask 077→022解决HMDFS临时目录权限问题"
  - "lld链接器依赖libxml2.so.16，需使用ld.bfd替代"
  - "nettle 4.0生成libnettle（加密库）和libhogweed（公钥加密库）"
