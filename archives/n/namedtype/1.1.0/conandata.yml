# conandata.yml — namedtype 1.1.0
# 上游身份：GitHub tag v1.1.0（https://github.com/joboccara/NamedType）
#   `git ls-remote --tags` 实测恰 2 个 tag（v1.0.0 / v1.1.0），全量命中
#   本机实拉 tarball 111463 B，sha256 与任务卡/CCI 公布值逐字一致
sources:
  url: "https://github.com/joboccara/NamedType/archive/refs/tags/v1.1.0.tar.gz"
  sha256: "9a4f7e2054e25c753b1cc3fbd0883e03acee85a9a0f2299b4e7a47e8b46a4c80"

patches:
  - patch_file: "patches/0001-include-tuple-for-standalone-inclusion.patch"
    patch_description: "named_type_impl.hpp 使用 std::make_tuple/std::get 却只包含 <type_traits>/<utility>，单独 include NamedType/named_type.hpp 的消费者翻译单元无法编译（4 个公开头 3 个失败）；补一行 #include <tuple> 使 header 自包含，行为零变化"
    patch_type: "compatibility"
  - patch_file: "patches/0002-clang-unknown-warning-option.patch"
    patch_description: "上游 test/CMakeLists.txt 的非 MSVC 分支写死 4 个 GCC 专属 -W* 开关并配 -Werror，clang 15 报 unknown warning option 被放大成硬错；追加 -Wno-unknown-warning-option 只降级该诊断，其余 -Werror 告警面全部保留"
    patch_type: "portability"
