# test_package/MANIFEST.yml
# 上游测试声明文件（namedtype 1.1.0）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: namedtype/1.1.0
homepage: "https://github.com/joboccara/NamedType"

# 上游官方测试入口：上游根 CMakeLists.txt 的 ENABLE_TEST（默认 ON）→
# add_subdirectory(test) 注册 CTest 目标 NamedTypeTest（Catch1 单头）
upstream_check_command: "cmake --build . --target NamedTypeTest"

# conanfile.py build() 中已集成上游测试（CMake configure+build 后真实执行
# test/NamedTypeTest，并把 Catch 的
# "All tests passed (N assertions in M test cases)" 与源码静态清点对账）
upstream_test_in_build: true
upstream_test_command: "test/NamedTypeTest"

# 上游实际运行的测试程序（test/main.cpp + test/catch.hpp，Catch1）
upstream_tests:
  - file: test/main.cpp
    source: namedtype-1.1.0/test/main.cpp
    description: "被审 tag v1.1.0 唯一测试 TU：36 个 TEST_CASE、78 处断言宏（REQUIRE 53 + CHECK 25），Catch1 运行期注册 36 用例 / 78 断言，静态清点与运行期对账一致；按 rule4 下界另计上游当前 HEAD（master 76668ab）test/tests.cpp 的 82 用例 / 136 断言，声明 N=136，差额 58 处断言（46 个用例）系 v1.1.0 之后上游新增、被审版本源码树无该文件"
    command: "./NamedTypeTest"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：单头自包含 + 构造/算术/比较/make_named/ref/命名参数 13 项断言"
    command: "./test_namedtype"

# 测试断言总数（声明口径：上游下界 136 + 消费者 13 = 149；
# 其中被审 tag v1.1.0 实跑 78 + 消费者 13 = 91，另 58 处为上游 HEAD 新增、
# 被审版本源码不存在的 NOT_RUN——逐项归因见 reports/test-report.md）
assertion_count: 149
