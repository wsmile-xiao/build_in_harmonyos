version: "1.1.0"

software: "namedtype"

# 编译状态: published | built | failed | archived
# 仅在合并后 release upload 确认才写 published（AGENTS O5），当前为 built。
status: built

build_date: "2026-09-28"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游 GitHub tag v1.1.0（joboccara/NamedType，恰 2 个 tag：v1.0.0 / v1.1.0）
  url: "https://github.com/joboccara/NamedType/archive/refs/tags/v1.1.0.tar.gz"
  # 本机实拉 111463 B，与任务卡/CCI 公布值逐字一致
  sha256: "9a4f7e2054e25c753b1cc3fbd0883e03acee85a9a0f2299b4e7a47e8b46a4c80"
  tar_format: "tar.gz"

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DENABLE_TEST=ON（上游根 CMakeLists 默认值，显式钉死，使 test/ 的构建输入不随 profile 漂移）"
    - "clang 未知告警名由补丁 0002 在 test/CMakeLists.txt 内追加 -Wno-unknown-warning-option 处理（见 notes.md 问题 2）"
  # 零第三方依赖（上游 0 deps，W0-2 已实核；header-only + 自带 Catch1 单头测试）
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-include-tuple-for-standalone-inclusion.patch"
  - "0002-clang-unknown-warning-option.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "header-only 库的自包含要按「单独 include 每个公开头」逐一编译验证：named_type_impl.hpp 用 std::make_tuple/std::get 却缺 <tuple>，依赖上游测试 TU 的传递包含掩盖了缺陷"
  - "上游测试 CMake 用 GCC 专属 -W* 开关且带 -Werror 时，clang 下未知告警名会被放大成硬错：补丁追加 -Wno-unknown-warning-option（只降级该诊断、其余 -Werror 告警面保留），且必须落在补丁里才能让 clean-verify(G0) 的裸 cmake 路径同样通过"
  - "Catch1 的 'All tests passed (N assertions in M test cases)' 必须与源码静态清点（TEST_CASE 数 / 断言宏数）对账，两者相等才采信，防 0 用例假绿"
