# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: nlohmann-json/3.11.2
homepage: "https://github.com/nlohmann/json"

# 上游测试命令
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (nlohmann-json uses ctest with many unit tests)
# Not integrated in conan build; test_package provides consumer-side verification
upstream_tests:
  - file: tests/unit-tests.cpp
    source: nlohmann-json-3.11.2/tests/unit-tests.cpp
    description: "Upstream unit tests (comprehensive JSON parser/serializer tests)"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: create, serialize, parse, array ops, type conversion"
    command: "./test_nlohmann_json"

# 测试断言总数 (近似值)
assertion_count: 9
