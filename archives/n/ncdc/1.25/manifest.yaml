# 版本级 manifest — ncdc 1.25
# 文件位置: archives/n/ncdc/1.25/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.25"
software: ncdc

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-11"
build_system: autotools（发布 tarball 自带 configure / Makefile.in，无需自举）

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://dev.yorhel.nl/download/ncdc-1.25.tar.gz"
  sha256: "b9be58e7dbe677f2ac1c472f6e76fad618a65e2f8bf1c7b9d3d97bc169feb740"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--without-geoip"        # libmaxminddb 可选，上游默认 no；显式关掉避免误探测宿主库
    - "--without-libloc"       # libloc 可选，上游默认 no
    - "--disable-git-version"  # 用 AC_INIT 的 1.25，不依赖 git describe
    - "--build=aarch64-unknown-linux-gnu"  # OHOS 沙箱 config.guess 写盘探针不可靠，显式指定
    - "--host=aarch64-unknown-linux-gnu"
  dependencies:
    - "ncurses/6.6"      # ncursesw（TUI）
    - "zlib/1.3.1.1"     # -lz（AC_CHECK_LIB）
    - "bzip2/1.0.8"      # -lbz2（AC_CHECK_LIB）
    - "sqlite3/3.49.1"   # 本地 db
    - "glib/2.84.0.2"    # glib-2.0 + gthread-2.0
    - "gnutls/3.8.10"    # TLS
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "glib 配方把 pkg_config_name 设为 glib-2.0-unofficial（多模块 .pc 的产物名），PkgConfigDeps 因此只生成 glib-2.0-unofficial.pc；而 glib 包内自带的上游 .pc 的 prefix 是 /（meson 以 --prefix=/ 构建）。ncdc 的 PKG_CHECK_MODULES([GLIB],[glib-2.0 gthread-2.0]) 缺这两个名字会报 No package 'glib-2.0' found → 在 generators 目录补写 glib-2.0.pc / gthread-2.0.pc（AutotoolsToolchain 已把该目录 prepend 进 PKG_CONFIG_PATH）"
  - "configure.ac 的依赖发现分两路：PKG_CHECK_MODULES(ncursesw / glib-2.0+gthread-2.0 / gnutls) 与 AC_CHECK_LIB(z / bz2 / sqlite3 回退)。AutotoolsToolchain 不会把依赖的 -I/-L 写进 CPPFLAGS/LDFLAGS，AC_CHECK_LIB 那路会找不到库 → 用 AutotoolsDeps 注入全部依赖的 -I/-L/LIBS；静态 gnutls 的传递库（nettle/gmp/libtasn1/libgcrypt/libunistring）亦由 gnutls.pc 的 Requires 链覆盖"
  - "glib/2.84.0.2（R37）已把 proxy-libintl 静态链入 libglib：制品只含 libintl.a、无 libintl.so.8，规避 shared glib 图下 musl 解析 libglib 自身 NEEDED 时的 g_libintl_* 重定位失败（旧版 2.84.0.1.x 会踩，参见 glib/nip4 适配记录）"
  - "上游无测试套件（Makefile.am 无 TESTS/check 目标）→ 层1 以真实二进制实跑自证：ncdc --version 打印 glib/gnutls/sqlite3 的编译期与运行期版本，可一次性证明全部共享依赖在 OHOS 上成功加载；GeoIP support: no 证明可选依赖按预期关闭而非误探测宿主库"
  - "src/version.h 由 Makefile 规则生成：--disable-git-version 时走 echo @VERSION@ 分支 → main_version = 1.25"
  - "【使用知识库 E011】HMDFS UID 映射（目录 owner UID 20001006 ≠ 进程 UID 20020083）使 umask 077 建的 0700 临时目录不可写：autotools 的 config.status 在 (umask 077 && mktemp -d ./confXXXXXX) 建的目录里写 subs1.awk 报 Permission denied → could not setup config files machinery。TMPDIR 无效（该目录不走 TMPDIR）；build() 起始把 configure 内 umask 077 全改 022 即修复（configure 与 config.status 共用同一段 here-doc）。ncdc 为又一实例（同类先例：cracklib、abiword-*）"

patch_generation:
  method: none
  patches_count: 0

patch_classification: []
