# test_package MANIFEST — ncdc 1.25
software: ncdc
version: "1.25"
test_type: cli_functional

# 上游测试：无。Makefile.am 无 TESTS/check 目标，发布 tarball 不含任何
# 测试用例 → 无可 vendored 的上游测试（rule4 通过率不适用）。
upstream_check_command: ""
upstream_check_count: 0

# 层1（conanfile build() 内）实跑自证：ncdc --version / --help。
# --version 由 main.c:print_version() 输出编译期与运行期 glib/gnutls/sqlite3
# 版本，一次证明全部共享依赖在 OHOS 上成功加载。
# test_package 测试：test.sh 7 项断言（鸿蒙特有见下）。
test_package_tests:
  - "bin/ncdc 存在且可执行"
  - "自身版本为 1.25（取自 AC_INIT，--disable-git-version）"
  - "GLib 编译期==运行期 2.84.0（鸿蒙特有：证明加载的是打包的 conan 制品而非设备同名系统库）"
  - "GnuTLS 编译期==运行期 3.8.10（同上）"
  - "SQLite 编译期==运行期 3.49.1（同上）"
  - "ncurses 版本行存在（NCURSES_VERSION 来自 ncurses.h）"
  - "GeoIP support: no（可选依赖按预期关闭，未误探测宿主 libmaxminddb/libloc）"
assertion_count: 7
fixture_count: 0
fixture_origin: "无 fixtures（用 --version/--help 输出作为断言素材）"
