# 软件级 manifest — ncdc
# 文件位置: archives/n/ncdc/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: ncdc
display: "ncdc"
description: "NCurses 文本界面的 Direct Connect (DC++) P2P 网络客户端"
category: network
homepage: "https://dev.yorhel.nl/ncdc"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游发布 tarball 自带 configure/Makefile.in，无需 autoreconf 自举"
    - "依赖发现分两路：PKG_CHECK_MODULES（ncursesw/glib-2.0+gthread-2.0/gnutls）与 AC_CHECK_LIB（z/bz2/sqlite3 回退）；须同时启用 PkgConfigDeps 与 AutotoolsDeps"
    - "glib 配方 pkg_config_name=glib-2.0-unofficial，PkgConfigDeps 不生成 glib-2.0.pc/gthread-2.0.pc → 需在 generators 目录手写（prefix 指向 dep.package_folder）"
    - "沙箱内 config.guess 写盘探针不可靠 → 显式指定 --build/--host=aarch64-unknown-linux-gnu"
    - "上游无测试套件，以真实二进制实跑 --version/--help 自证（编译期==运行期版本即证明加载的是本配方制品）"
  common_dependencies:
    - ncurses
    - zlib
    - bzip2
    - sqlite3
    - glib
    - gnutls

versions:
  "1.25":
    status: built
    build_date: "2026-09-11"
    conan_ref: "ncdc/1.25"
