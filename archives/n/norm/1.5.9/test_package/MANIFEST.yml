# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: norm/1.5.9
homepage: "https://github.com/USNavalResearchLaboratory/norm"

# 上游测试命令: norm 使用 waf 构建（BUILD.TXT），无 make check/ctest 目标；
# 上游自带可离线自测程序 src/common/fecTest.cpp（RS16 FEC 编解码往返）。
upstream_check_command: "./waf build --targets=fecTest && ./build/fecTest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./waf build --targets=fecTest && ./build/fecTest"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/common/fecTest.cpp
    source: norm-1.5.9/src/common/fecTest.cpp
    description: "RS16 FEC 编码/解码往返自测（2 轮 erasure 注入，校验解码还原）"
    command: "./build/fecTest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_norm.c
    description: "链接 libnorm 并调用 NormGetVersion/NormCreateInstance/NormDestroyInstance，验证可运行"
    command: "./test_norm"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
