# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "norm 使用 waf 构建（bundled waf 2.0.19），非 autotools；BUILD.TXT 为权威说明"
  - "wscript 用 platform.system() 判定平台，HarmonyOS 上返回 'harmonyos'，需映射为 linux 才会走 unix/linux 源码与 define 分支"
  - "OHOS sysroot 的 linux/socket.h 与 sys/socket.h 均定义 sockaddr_storage（E091），-D__MUSL__ 可解（sys/socket.h 用 #ifndef __MUSL__ 包裹 sockaddr_storage）"
  - "官方 .tgz 实为普通 tar（非 gzip），conan get() 用 r:* 自动探测可解；init_build 需本地重打包 gzip"
  - "norm 源码含 norp/norm -> .. 符号链接环，HMDFS 上 copytree 需 cp -a 保留符号链接"
  - "默认 waf build 仅产出库（libnorm.so/.a + libprotokit），normapp/示例均 posted=True 默认不建（R38 判为库类型无需 commands.json）"
  - "上游自测：waf build --targets=fecTest 后运行通过（RS16 FEC 编解码往返），norm 无 make check 目标"

# 测试摘要
tests:
  upstream_waf_build: "waf configure + waf 61/61 任务成功；waf install 产出 libnorm.so.1.5.9/.a + libprotokit + normApi.h + norm.pc"
  upstream_self_test: "fecTest 运行通过（encode/decode RS16, rc=0）；无系统级 make check/ctest 目标"

