# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法: 解压上游源码包 → 查阅各子目录 Makefile.common 的目标列表
#           （nedit 没有 configure/automake，只有手写 makefile）
#
# 本包不改任何上游源码，因此**没有 patches/**：所有适配都落在配方里
# （-DUSE_DIRENT / parse_noyacc.c 回退 / 命令行覆盖 make 变量）。

package: nedit/5.8
homepage: "https://sourceforge.net/projects/nedit/"

# 上游测试命令：不存在。四个子目录的 Makefile.common 只定义
# all / libNUtil.a / libXlt.a / libXmL.a / nedit / nc / clean，
# 顶层 Makefile 只有 docs / clean / <platform> / 各平台入口，
# 没有任何 check / test / ctest 目标。
upstream_check_command: "N/A: no check/test/ctest target exists in any of the five makefiles"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清单：空。5.8 源码包内无测试框架、无测试用例、无测试语料
# （顶层只有 ChangeLog / COPYRIGHT / README / ReleaseNotes / debian /
#   doc / makefiles / Microline / source / util / Xlt）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证: 真实执行包内安装的两个可执行文件)
test_package_tests:
  - file: test_nedit.py
    description: >
      消费者视角 31 条断言，按绝对路径执行 Conan 包缓存中的 nedit / nedit-nc：
      (1) 安装布局 —— bin/nedit、bin/nedit-nc 存在且带可执行位；
      (2) ELF 身份（每个二进制 5 条，共 10 条）—— 读 ELF 头断言 ELF magic
          \x7fELF、64 位、小端、e_machine=EM_AARCH64(183)、e_type=ET_DYN(3)，
          即真正的 OHOS AArch64 PIE，而非宿主残留；
      (3) 运行期动态链接 —— nedit 与 nedit-nc 在**删除 DISPLAY** 的环境下
          执行 -V / -version，退出码 0，分别输出 "NEdit 5.8" 与 "Version 5.8"；
          能在设备上跑通即证明 libXm.so.4 及其 X11 传递依赖被 conanrun 正确解析；
      (4) 链接自证（两条）—— nedit -V 的输出含 "With Motif:" 行（编译期
          Motif 头提供的版本宏）与 "Running Motif:" 行（libXm 自己提供的
          xmUseVersion 全局变量）；后者能打印出来，意味着包内的 libXm.so.4
          确实被动态加载器解析并载入了；
      (5) 反向自证 —— 同一批二进制在无 DISPLAY 且不带 -V 时**必须失败**（非 0
          退出并输出 "Can't open display"），证明它们确实是 X/Motif 客户端，
          上面的版本路径是刻意的提前应答，而不是一个根本不打开显示的程序；
      (6) X 资源文件 —— share/X11/app-defaults/NEdit 存在且非空。
    command: "python3 test_nedit.py <package>/bin <package>/share/X11/app-defaults/NEdit"

# 鸿蒙特有测试条数 (rule12)：31 条中直接绑定鸿蒙产物形态与实机可运行性的 12 条
ohos_specific_tests: 12
ohos_specific_description: >
  第一组 10 条（OHOS AArch64 ABI / 产物形态）：直接解析 ELF 头的
  ELF magic、64 位、小端、EM_AARCH64(183)、ET_DYN(3) —— nedit 与
  nedit-nc 各 5 条。OHOS 只接受 AArch64 PIE 形态的可执行文件；32 位、
  大端或非 PIE 产物在这里立刻失败。不依赖任何宿主工具（不调用
  readelf/file，避免 mksh 无法执行 ELF 的问题），纯 Python 读 64 字节。
  第二组 2 条（实机可运行性 / Motif 链接自证）：`nedit -V` 在**摘掉
  DISPLAY** 的环境下退出码 0，并输出 "With Motif:"（编译期 Motif 头提供的
  版本宏）与 "Running Motif:"（libXm 提供的 xmUseVersion 全局变量）两行
  —— 只有在 (a) 包内 ELF 已被 binary-sign-tool 签名（未签名 ELF 从 Conan
  包缓存执行会 PermissionError）、(b) libXm.so.4 及其 X11 传递依赖
  libXt.so.6 / libX11.so.6 / libSM.so.6 / libICE.so.6 全部能经 conanrun 的
  LD_LIBRARY_PATH 解析时，才会同时成立；任一不满足都直接失败。
  另有 2 条反向断言（摘掉 DISPLAY 且不带 -V 时必须非 0 退出并打印
  "Can't open display"）用于排除"根本不打开显示的 stub"，属平台无关的
  行为约束，不计入本条。

# 测试断言总数（预期 31/31；实测值以本 PR 的 CI 日志为准）
assertion_count: 31
