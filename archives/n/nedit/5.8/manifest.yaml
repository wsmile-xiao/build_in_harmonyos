software: nedit
version: "5.8"
status: built
build_date: "2026-09-20"
build_system: makefile

source:
  url: "https://downloads.sourceforge.net/project/nedit/nedit-source/nedit-5.8-src.tar.gz"
  sha256: "5851aa7252dad952084529173640232562dec4a7c440209f196d53d4a5a8074d"
  tar_format: tar.gz
  source_identity: "NEdit 5.8 source release (nedit-5.8-src.tar.gz, top directory nedit-5.8/)"

build:
  system: makefile
  configure_options:
    - "hand-written makefiles/Makefile.linux copied into util/, Xlt/, Microline/XmL/ and source/, then four sub-makes driver: make -f Makefile.linux libNUtil.a / libXlt.a / libXmL.a / 'nedit nc'"
    - "CC/AR/ARFLAGS/CFLAGS/LIBS are passed on the make command line, overriding the in-file '=' assignments"
    - "CFLAGS: GnuToolchain flags (-O3 -DNDEBUG for Release) + -DUSE_DIRENT -DUSE_LPR_PRINT_CMD plus -I of every host dependency include dir"
    - "LIBS: -L of every host dependency lib dir, the aggregated -l flags, plus -lm"
    - "parse.c is pre-generated from the checked-in source/parse_noyacc.c fallback, so no bison/yacc is required"
    - "the top-level Makefile dispatcher is deliberately not used: it ends with '@source/nedit -V', which executes the freshly linked binary inside the build"
    - "HAVE__XMVERSIONSTRING is deliberately NOT defined (source/help.c only then keeps its own static _XmVersionString buffer)"
  dependencies:
    - motif/2.3.8
  cc: clang
  cxx: clang++

patches_applied: []

patch_generation:
  method: "none"
  patches_count: 0

patch_classification:
  portability: 0
  bugfix: 0
  backport: 0
  notes: "No patch is needed. The only mandatory portability define (USE_DIRENT) is already an upstream makefile switch, injected through CFLAGS."

knowledge_gained:
  - "nedit has no autotools/CMake step: the top-level Makefile only symlinks makefiles/Makefile.<platform> into four sub-directories, runs four sub-makes, and then executes the fresh binary. Driving the four sub-makes directly is what makes the build usable from a Conan recipe."
  - "USE_DIRENT is mandatory on OHOS/musl: without it util/printUtils.c includes <sys/dir.h>, which musl does not ship. A distribution's CFLAGS cannot be copied verbatim (glibc still provides <sys/dir.h> as a compatibility shim, musl does not)."
  - "source/parse.c is a generated file with an official checked-in fallback (source/parse_noyacc.c); copying it up front removes any dependency on a yacc/bison being installed on the worker."
  - "Unlike libraries, the two delivery binaries need a rpath-free link plus absolute-path execution in test_package; nedit -V and nedit-nc -V answer before XtOpenDisplay(), so the smoke test runs headless."
  - "'make -C doc man' needs pod2man, a Perl script, and is kept out of upstream's default build (the doc Makefile is marked 'for NEdit developers only'); it is invoked explicitly but best-effort, so a worker without Perl still produces a complete editor package."

upstream_tests:
  exists: false
  command: "N/A: the four sub-directory makefiles define only all/libNUtil.a/libXlt.a/libXmL.a/nedit/nc/clean; there is no check, test or ctest target"
  registrations: 0
  test_count: 0
  executed: 0
  not_executed: 0
  notes: "The 5.8 source archive ships no test suite, no test framework and no test corpus. The only executable verification available upstream is running the built binaries themselves, which is what test_package does."

test_package:
  assertion_count: 31
  description: "Executes the packaged nedit and nedit-nc headlessly by absolute path and asserts ELF/AArch64 identity, version output, no-display failure behaviour, and the installed app-defaults resource file."

ci:
  profile: ohos-aarch64
  package_type: application
  shared_default: true

quality_gates:
  L0_dependencies: "Depends on motif/2.3.8 (which carries the whole X11 stack transitively)."
  L0_recipe: "Passed: conanfile.py provides name/version/description/settings, export_sources/source/build/package/package_info."
  L0_commands_json: "Passed: archives/n/nedit/commands.json declares nedit/5.8 as a tool."
  L1_test_package: "Passed: test_package/test_nedit.py runs both installed executables from the package cache."
  L4_patches: "Not applicable: patches/ does not exist (patches_count 0)."

blockers: []
