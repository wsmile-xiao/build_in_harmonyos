software: nedit
display: "NEdit"
description: "Motif/LessTif 界面的 X11 多用途文本编辑器"
category: doc
homepage: "https://sourceforge.net/projects/nedit/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "手写 makefile：顶层 Makefile 只是 .DEFAULT 分发器，把 makefiles/Makefile.<平台> 拷进 util/ Xlt/ Microline/XmL/ source/ 后跑四次子 make，最后还会执行刚链接出来的二进制 —— 配方只复刻前半段，直接驱动四次子 make"
    - "必须 -DUSE_DIRENT：否则 util/printUtils.c 走 #else 分支包含 <sys/dir.h>，musl（以及 OHOS）不提供该头文件；发行版的 CFLAGS 不能照抄（glibc 至今保留 <sys/dir.h> 兼容垫片）"
    - "source/parse.c 是生成文件：构建前用上游官方回退 source/parse_noyacc.c 覆盖，worker 上不需要 bison/yacc"
    - "不要定义 -DHAVE__XMVERSIONSTRING：定义后 source/help.c 会 extern 引用 libXm 私有符号 _XmVersionString，不定义时 help.c 自带 static \"unknown\" 缓冲，无额外链接依赖"
    - "依赖 motif/2.3.8；它已带 transitive_headers/transitive_libs，整个 X11 栈（libx11/libxt/libxext/libsm/libice/xorgproto）随之到达消费者"
    - "二进制需 binary-sign-tool 签名后才能从 Conan 包缓存执行；未签名 ELF 在 OHOS 上是 PermissionError"
    - "nedit -V / nedit-nc -V 都在 XtOpenDisplay 之前应答，因此冒烟测试可在无显示环境下(headless)跑"
  common_dependencies:
    - motif
    - libx11
    - libxt
    - libxext
    - libsm
    - libice

versions:
  "5.8":
    status: built
    build_date: "2026-09-20"
    conan_ref: "nedit/5.8"
