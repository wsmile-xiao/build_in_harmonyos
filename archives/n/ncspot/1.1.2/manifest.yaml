software: ncspot
# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.1.2"
status: published
build_date: "2026-06-17"
build_system: cargo

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/hrkfdn/ncspot/archive/refs/tags/v1.1.2.tar.gz"
  sha256: "010b12172b85e6ae0eaf60ae0ab923580bcca0b132927b39c2a2fc878cb5e6a7"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: cargo (Rust项目)
  system: cargo

  # Cargo feature flags
  configure_options:
    - "--no-default-features"
    - "--features portaudio_backend,crossterm_backend"

  # 编译依赖列表
  dependencies:
    - portaudio/19.7.0
    - openssl/3.5.6
    - ncurses/6.5
    - alsa-lib/1.2.12

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ncspot是Rust项目，使用cargo build --release编译"
  - "默认features包含pulseaudio_backend，但libpulse在OHOS上不可用，改用portaudio_backend"
  - "alsa_backend依赖nix crate v0.23.2，与musl libc不兼容（缺少O_FSYNC/mq_open/shm_open等符号），需使用portaudio_backend避开"
  - "crossterm_backend是纯Rust实现的TUI后端，不需要ncurses链接"
  - "ncspot需要Rust toolchain 1.79.0+"
