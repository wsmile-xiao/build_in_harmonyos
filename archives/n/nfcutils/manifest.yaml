# 软件级 manifest — nfcutils
# 遵循 ARCHIVE-SPEC v3.0

software: nfcutils
display: "nfcutils"
description: "NFC 工具集：lsnfc 列出 NFC 读卡器场内的 ISO14443A/B 与 FeliCa 标签"
category: utility
homepage: "https://github.com/nfc-tools/nfcutils"
license: GPL-3.0-or-later
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 C autotools 工具集；0.3.2 仅含单工具 lsnfc（src/lsnfc.c，约 500 行）"
    - "configure 通过 PKG_CHECK_MODULES 消费 libnfc >= 1.7.0（pkg-config）；仓内 libnfc 1.8.0 满足"
    - "libnfc 1.8.0 为静态库且 libnfc.pc 的 Requires 为空，链接时必须显式追加 -lusb（libusb-compat）与 -lusb-1.0（libusb），依赖者在前（-lnfc -lusb -lusb-1.0）"
    - "上游 2013 年老 autotools：config.guess/config.sub（2012 版）无 HarmonyOS/linux-ohos 识别需 E007 补丁；configure 的 mktemp umask 077 在 HMDFS 上目录拒写需改 022"
    - "上游无测试框架；无 NFC 硬件环境下 lsnfc 打印 'ERROR: No device found.' 并以退出码 0 结束（上游真实行为）"
  common_dependencies:
    - "libnfc/1.8.0"

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.3.2":
    status: built
    build_date: "2026-09-11"
    note: "首个适配版本（HarmonyOS PC aarch64）"
