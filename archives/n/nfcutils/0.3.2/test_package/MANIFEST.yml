# test_package/MANIFEST.yml — nfcutils 0.3.2
# CI L0e requires this file to exist.

package: nfcutils/0.3.2
homepage: "https://github.com/nfc-tools/nfcutils"

# 上游测试审计（hmbs 机器证据硬门禁）
# 已审计 nfcutils-0.3.2.tar.gz（sha256 dea258774bd08c8b7ff65e9bed2a449b24ed8736326b1bb83610248e697c7f1b）：
# 归档 20 文件，唯一源码 src/lsnfc.c（约 500 行）；src/Makefile.am 仅
# bin_PROGRAMS=lsnfc；无 tests/ 目录、无 check/test target、无测试框架 → 上游无测试。
upstream_tests_exist: false
upstream_test_audit: "审计 nfcutils-0.3.2 官方归档（google-code-archive，sha256 dea258774bd08c8b7ff65e9bed2a449b24ed8736326b1bb83610248e697c7f1b）：归档 20 文件，唯一源码 src/lsnfc.c（约 500 行）；src/Makefile.am 仅 bin_PROGRAMS=lsnfc 一条产物声明；无 tests/ 目录、无 make check/test 目标、无测试框架（gtest/ctest/autotools 内建 etc）。结论：上游无任何测试用例（discovered=0/executed=0），test_package 以可执行文件冒烟测试接入。"

# 上游测试命令（无）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "运行 lsnfc 可执行文件：①验证 bin/lsnfc 存在且可执行；②无 NFC 硬件环境运行 lsnfc，断言输出含 'No device found' 且退出码 0（上游真实行为：nfc_list_devices 返回 0 → 优雅报错 → EXIT_SUCCESS），timeout 10s 防阻塞；③验证输出非空（工具真实执行）"
    command: "bash test.sh"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 3