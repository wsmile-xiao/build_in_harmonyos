software: netdata
version: "1.47.5"
status: built
build_date: "2026-09-17"

source:
  url: "https://github.com/netdata/netdata/releases/download/v1.47.5/netdata-v1.47.5.tar.gz"
  sha256: "8073eee2392f92daa1f8bb5cf13fb988b8c3b52ff9574b50706ff69bdbdb51ce"
  tar_format: tar.gz

build:
  build_system: cmake
  configure_options:
    - "-DOS_OHOS=True"
    - "-DENABLE_ACLK=False"
    - "-DENABLE_CLOUD=False"
    - "-DENABLE_ML=False"
    - "-DENABLE_PLUGIN_EBPF=False"
    - "-DENABLE_PLUGIN_GO=False"
    - "-DENABLE_PLUGIN_FREEIPMI=False"
    - "-DENABLE_PLUGIN_CUPS=False"
    - "-DENABLE_PLUGIN_SYSTEMD_JOURNAL=False"
    - "-DENABLE_PLUGIN_XENSTAT=False"
    - "-DENABLE_PLUGIN_NFACCT=False"
    - "-DENABLE_PLUGIN_APPS=False"
    - "-DENABLE_PLUGIN_DEBUGFS=False"
    - "-DENABLE_PLUGIN_LOCAL_LISTENERS=False"
    - "-DENABLE_PLUGIN_NETWORK_VIEWER=False"
    - "-DENABLE_EXPORTER_MONGODB=False"
    - "-DENABLE_EXPORTER_PROMETHEUS_REMOTE_WRITE=False"
    - "-DENABLE_WEBRTC=False"
    - "-DENABLE_SENTRY=False"
    - "-DENABLE_H2O=False"
    - "-DUSE_MOLD=False"
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies:
    - openssl/1.1.1w
    - zlib/1.3.1
    - lz4/1.10.0
    - libuv/1.52.1
    - json-c/0.18
    - libyaml/0.2.5
    - protobuf/33.6.1
    - pcre2/10.40
    - sqlite3
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-src-collectors-proc.plugin-proc_stat.c.patch"
  - "0003-packaging-cmake-config.cmake.h.in.patch"
  - "0004-src-libnetdata-threads-threads.c.patch"
  - "0005-src-libnetdata-os-uuid_generate.c.patch"

knowledge_gained:
  - "CMake feature detection（check_c_source_compiles + config.h #cmakedefine）可无平台宏地适配 musl/OHOS 缺失 API：pthread affinity、pthread cancellation、libuuid"
  - "OHOS musl 无 pthread_setaffinity_np/pthread_getaffinity_np/pthread_setcanceltype/pthread_setcancelstate/libuuid，但 cpu_set_t 宏与 arc4random_buf 可用"
  - "OHOS clang 预定义 __OHOS__，CMakeLists 无需 add_definitions(-D__OHOS__)"
  - "libh2o submodule 为空，需禁用 ENABLE_H2O"
  - "libcap/capabilities 在 OHOS 不可用，需禁用 ENABLE_PLUGIN_APPS/DEBUGFS"
  - "制品仓依赖引用必须用裸 name/version（无 @ohpcd/stable 通道后缀）——registry 已迁移为 plain ref"

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: portability
    platform_only: False
    guard: 'feature-detection (HAVE_PTHREAD_SETAFFINITY_NP / HAVE_PTHREAD_SETCANCEL / HAVE_LIBUUID / HAVE_ARC4RANDOM_BUF)'
  - file: 0002-src-collectors-proc.plugin-proc_stat.c.patch
    type: portability
    platform_only: False
    guard: 'HAVE_PTHREAD_SETAFFINITY_NP'
  - file: 0003-packaging-cmake-config.cmake.h.in.patch
    type: portability
    platform_only: False
    guard: 'n/a (config.h template)'
  - file: 0004-src-libnetdata-threads-threads.c.patch
    type: portability
    platform_only: False
    guard: 'HAVE_PTHREAD_SETCANCEL'
  - file: 0005-src-libnetdata-os-uuid_generate.c.patch
    type: portability
    platform_only: False
    guard: 'HAVE_LIBUUID'
