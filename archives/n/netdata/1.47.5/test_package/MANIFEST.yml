# test_package/MANIFEST.yml
# CI script (build_and_test.sh L0e) requires this file to exist

package: netdata/1.47.5
homepage: "https://www.netdata.cloud"

# Upstream test suite: netdata has integration tests requiring a running
# daemon + web server; on OHOS these can't run in CI. Test degrades to
# binary presence + version check (honest, environment limitation).
upstream_check_command: ""

upstream_test_in_build: false
upstream_test_command: ""

# Consumer test: test_netdata.py checks binary exists, is executable,
# and reports correct version via `netdata -v`.
upstream_tests: []
