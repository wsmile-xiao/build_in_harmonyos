sources:
  url: "https://github.com/netdata/netdata/releases/download/v1.47.5/netdata-v1.47.5.tar.gz"
  sha256: "8073eee2392f92daa1f8bb5cf13fb988b8c3b52ff9574b50706ff69bdbdb51ce"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Add OpenHarmony platform detection (catch-all FATAL_ERROR kept) and feature checks for pthread affinity/cancellation and libuuid with arc4random_buf fallback"
    patch_type: "portability"
  - patch_file: "patches/0002-src-collectors-proc.plugin-proc_stat.c.patch"
    patch_description: "Guard CPU affinity APIs with HAVE_PTHREAD_SETAFFINITY_NP feature detection (pthread_setaffinity_np/getaffinity_np unavailable on OHOS musl)"
    patch_type: "portability"
  - patch_file: "patches/0003-packaging-cmake-config.cmake.h.in.patch"
    patch_description: "Expose new feature-check results (HAVE_PTHREAD_SETAFFINITY_NP, HAVE_PTHREAD_SETCANCEL, HAVE_LIBUUID) via config.h"
    patch_type: "portability"
  - patch_file: "patches/0004-src-libnetdata-threads-threads.c.patch"
    patch_description: "Guard pthread_setcanceltype/pthread_setcancelstate calls with HAVE_PTHREAD_SETCANCEL feature detection (not provided by OHOS musl; netdata does not use pthread_cancel)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-libnetdata-os-uuid_generate.c.patch"
    patch_description: "Fall back to arc4random_buf-based RFC 4122 v4 UUID generation when libuuid is unavailable (HAVE_LIBUUID feature detection)"
    patch_type: "portability"
