software: netdata
display: "Netdata"
description: "Real-time performance monitoring, health, and visualization for systems and applications"
category: system
homepage: "https://www.netdata.cloud"
license: GPL-3.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMakeLists.txt: OpenHarmony platform detection (catch-all FATAL_ERROR kept) + feature checks for pthread affinity/cancellation/libuuid with arc4random_buf fallback"
    - "C-code guards use build-time feature detection macros (HAVE_PTHREAD_SETAFFINITY_NP, HAVE_PTHREAD_SETCANCEL, HAVE_LIBUUID) — no platform conditionals in C sources"
    - "Disable features requiring platform-specific support: eBPF, Go plugins, libcap, systemd, etc."
    - "libh2o submodule empty in tarball, must disable ENABLE_H2O"
  common_dependencies:
    - openssl
    - zlib
    - lz4
    - libuv
    - json-c
    - libyaml
    - protobuf

versions:
  "1.47.5":
    status: built
    build_date: "2026-09-17"
