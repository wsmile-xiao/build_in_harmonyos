# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nbimg/1.2.1
homepage: "https://github.com/poliva/nbimg"

# 上游测试命令: 本项目是纯 Makefile 工程，无 check/test 目标
upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无（上游源码包仅含 nbimg.c/Makefile/README/LICENSE）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 直接执行被测二进制)
test_package_tests:
  - file: test_nbimg.sh
    description: "往返转换冒烟测试: 合成 320x240 BMP -> NB(QVGA 262144) -> 恢复 BMP(230454), 校验产物尺寸"
    command: "bash test_nbimg.sh <package bin dir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3