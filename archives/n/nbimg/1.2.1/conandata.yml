  sha256: "f72846656bb8371564c245ab34550063bd5ca357fe8a22a34b82b93b7e277680"

# OHOS LP64 兼容补丁: `unsigned long biSize` 在 LP64 (OHOS aarch64, long=8)
# 会向 BMP 写入一个 8 字节的 biSize, 使 NB->BMP 输出比 32 位平台大 4 字节
# (230458B), 与上游声明的 230454B (54 + w*h*3) 不符。改为固定 32 位 unsigned int
# 以保证 BMP 头部与 DIB 大小字段同为 4 字节 (跨平台一致)。
patches:
  - patch_file: "patches/0001-nbimg.c-fix-bmp-header-word-size.patch"
    patch_description: "nbimg.c: use fixed 32-bit biSize in convertNB2BMP BMP header (LP64 portability)"
    patch_type: "portability"