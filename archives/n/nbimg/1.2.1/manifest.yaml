# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 Makefile 的 all 目标包含 win32 交叉编译（i586-mingw32msvc-gcc），OHOS 沙箱不可用，构建需只取原生 nbimg 目标"
  - "NB 格式为 RGB565 小端像素流（2 字节/像素）；BMP 24bpp/BGR 与 NB 互转由 nbimg 单文件完成，无外部依赖"
  - "nbimg.c convertNB2BMP 用 unsigned long 写 BMP DIB biSize 字段，LP64 (OHOS aarch64, long=8) 下会多写 4 字节导致 BMP 变 230458B；需固定为 32 位整数以保证 BMP 产物跨平台一致"