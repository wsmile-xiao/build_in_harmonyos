# test_package/MANIFEST.yml
# Upstream test declaration (required by CI L0e, see docs/TEST_QUALITY_SPEC.md)

package: numpy/2.5.2
homepage: "https://numpy.org"

upstream_check_command: "python3 -m pytest numpy/_core/tests"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: numpy/_core/tests/test_multiarray.py
    source: numpy-2.5.2/numpy/_core/tests/test_multiarray.py
    description: "Core multiarray functionality tests"
    command: "python3 -m pytest numpy/_core/tests/test_multiarray.py"
  - file: numpy/_core/tests/test_umath.py
    source: numpy-2.5.2/numpy/_core/tests/test_umath.py
    description: "Universal function (ufunc) tests"
    command: "python3 -m pytest numpy/_core/tests/test_umath.py"
  - file: numpy/_core/tests/test_linalg.py
    source: numpy-2.5.2/numpy/_core/tests/test_linalg.py
    description: "Linear algebra tests (BLAS/LAPACK paths)"
    command: "python3 -m pytest numpy/_core/tests/test_linalg.py"

test_package_tests:
  - file: test_numpy.py
    description: "Import numpy, verify version, array ops, BLAS dot, linalg inverse"
    command: "python3 -S test_numpy.py"

assertion_count: 8
