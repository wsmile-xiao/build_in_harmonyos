# 版本级 manifest — numpy 2.5.2
# 遵循 ARCHIVE-SPEC v2.0

version: "2.5.2"
software: "numpy"
status: "published"
build_date: "2026-09-01"
build_system: "meson (vendored)"

source:
  url: "https://pypi.tuna.tsinghua.edu.cn/packages/9a/80/db0b4559e57ec36362bedbb05530a87fafbcb6067708c946967a41d449e7/numpy-2.5.2.tar.gz"
  sha256: "d482d171c406ae88c5b19cad3b6a1c4c5209f886ab74bc44c2c865c23f52d860"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dblas=openblas"
    - "-Dlapack=openblas"
    - "-Dcpu-baseline=min"
    - "-Dcpu-dispatch=default"
    - "-Dcpp_std=17"
  dependencies:
    - "openblas/0.3.34"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "PyPI sdist 自带全部 git 子模块（vendored-meson/highway/pocketfft/pythoncapi-compat），无需 CI 内二次下载，规避 Worker 外网受限问题（对比 #5882 GitHub tag 归档方案）"
  - "CI Worker 无法访问 files.pythonhosted.org，清华 PyPI 镜像可达且文件同源同 sha256，可作为 conandata 源（E017 网络模式）"
  - "HarmonyOS posix_spawn 不搜索 PATH，需 sitecustomize.py 补丁 subprocess.Popen"
  - "OHOS SDK 的 ld.lld 依赖 libxml2.so.16（未安装），需 -fuse-ld=bfd 切换链接器"
  - "musl libc 不导出主可执行文件符号给 .so，Python 扩展需显式 -lpython3.12"
  - "OHOS 安全模型要求 ELF 签名后才能执行/加载，meson exe_wrapper 可用作签名+运行 wrapper"
  - "CPU dispatch 必须钉在 ARM 安全值：-Dcpu-baseline=min -Dcpu-dispatch=default，否则 meson 会按 x86 指令集探测导致编译失败（#6386 教训）"
