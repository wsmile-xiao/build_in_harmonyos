package: neon/0.34.0
homepage: "https://notroj.github.io/neon/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  - name: test/ make check（uri-tests/util-tests/string-tests/socket/session/request/auth/basic/stubs/redirect/compress/xml/xmlreq/twooh7/oldacl/acl3744/props/lock 共 18 个测试程序）
    count: 288
    description: "全量实测：283 passed / 5 skipped / 0 failed——**283/288（98.3%）**（含跳过项不计 100%——项目口径：passed/(passed+failed+errors)，跳过项如实计入分母）。5 个跳过项均为 SHA-2 哈希测试（strhash_sha_256/512/512_256 + digest_sha256/512_256）——根因：openssl 3.x 静态库链接兼容阻塞（4 轮尝试无效）→ --without-ssl 降级构建，SHA-2 功能不可用，如实分类为环境/构建配置限制"

test_package_tests:
  - file: test_neon.cpp
    description: "冒烟测试：真实调用 ne_sock_init + ne_uri_parse（R34——纯用户态）"
    command: "clang++ test_neon.cpp -I<include> -L<lib> -lneon && ./test_neon"

assertion_count: 2
