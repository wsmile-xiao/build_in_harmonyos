# test_package/MANIFEST.yml — netmask 2.4.4
package: netmask/2.4.4
homepage: "https://github.com/tlby/netmask"

# 上游官方测试：make check 触发 TESTS=./testscript（shell + diff 对比 tests/ 期望文件）。
# 实测（2026-09-03 W3）：26 个 check 全部 ok；tests/ 目录含 26 个期望输出文件。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check   # = automake TESTS: ./testscript（实测 26 个 check 全 ok）"

# 上游自带的测试程序/脚本（源自 v2.4.4 tarball）
upstream_tests:
  - file: testscript
    description: "上游 make check 驱动脚本：对 netmask 二进制 26 组输入做 diff 对比 tests/ 期望文件"
    command: "./testscript"
  - file: tests/
    description: "26 个期望输出文件（simple/range/output_*/bounds_dq*/subset_* 等）"

# test_package 消费侧实质测试（R34）：test.sh 完整复刻上游 26 个 check + fixtures/ 期望数据
test_package_tests:
  - file: fixtures/
    description: >-
      上游 v2.4.4 tests/ 26 个期望输出文件的逐字节拷贝（simple/simple2/inputs/range/
      range_cidr/range_large/output_{std,cidr,cisco,range,hex,octal,binary}/subset_{skip,clean}/
      range_{join,join2,adds,order,special}/bounds_dq1-dq6），作为 test.sh 逐用例 diff 期望。
  - file: test.sh
    description: >-
      完整复刻上游 testscript 的 26 个 check（编号 1-26 ↔ 上游 check 1-26）：每条用例
      真实执行 netmask 二进制，stdout 与 fixtures/ 对应期望文件做 diff -au（与上游
      `eval $3 | diff -au $2 -` 同语义），任一失败 exit 1。用例覆盖：
      1 simple（netmask 0）、2 simple2（0 2 4 6 8）、3 inputs（0 02 0x4 0.0.0.6）、
      4 range（100:200）、5 range_cidr（12.34.56.78/20）、6 range_large（1:0x7ffffffe ...）、
      7-13 output_std/cidr/cisco/range/hex/octal/binary（--format 0 2 4 6 8 077777777 0xffffffff）、
      14 subset_skip（345 100:200 105 45 200）、15 subset_clean（105 45 200 100:200 345）、
      16 range_join（10.1-4.0.0/16）、17 range_join2（10.0-3.0.0/16）、
      18-23 bounds_dq1-dq6（192.168.0.1/0.0.0.0 ... /0.255.255.255）、
      24 range_adds（10.0.0.1,+5 172.16.29.1:+7）、25 range_order（200:100）、
      26 range_special（0.0.0.5:+-2）。
      期望数据全部源自上游 v2.4.4 tests/（sha256 已核实的官方 tarball），2026-09-03
      W3 make check 26/26 ok 实证本二进制输出与 fixtures/ 逐字节一致。
    command: "bash test.sh"

# 断言计数 = 上游 26 个 check 逐一对应（test.sh 26 条 run_check；preflight 存在性/版本
# 检查为环境健全性保障，不参与计数）
assertion_count: 26
