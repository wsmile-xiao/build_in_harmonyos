# conandata.yml — netmask 2.4.4
# 事实源：Debian 官方 pool 的 orig 上游包（R39：官方正式源/权威镜像源）。
# sha256 出处：https://deb.debian.org/debian/pool/main/n/netmask/netmask_2.4.4-4.dsc
#             （GPG 签名文件 Checksums-Sha256；大小 45775 B）
# 已于 2026-09-03 在 worker 本机 sha256sum 实测核对：7e4801...a3409d83 == 一致。
# ⚠️ 版本红线：首次适配不造后缀（2.4.4）；上游 main/2.4.5+ 已引入 libcheck，勿升级。

sources:
  url: "https://deb.debian.org/debian/pool/main/n/netmask/netmask_2.4.4.orig.tar.gz"
  sha256: "7e4801029a1db868cfb98661bcfdf2152e49d436d41f8748f124d1f4a3409d83"

patches:
  # 探索编译结论（2026-09-03 实测）：Debian orig tarball 不含预生成 configure，
  # build() 内以显式解释器直跑链自举（tool_requires automake/1.18）：
  #   aclocal/automake 用 `perl <am>/bin/.aclocal-real|.automake-real` 显式执行，
  #   autoconf/autoheader 裸调（/data/service/hnp，hnp PATH 内）——因本机 HMDFS 下
  #   conan 构建子进程无法 kernel-exec 用户目录文本 shebang 脚本（详见 conanfile.py
  #   与 notes.md「续跑会话处置记录」，双环境兼容 CI Linux）。不依赖 `autoreconf -fi`。
  # 无需源码补丁；configure/config.status 的 E114 umask 问题在 build() 运行时处理
  # （与 abiword-plugin-clarisworks 3.0.8 同法：drop_umask_077 运行时修补生成的
  # configure，不入 patches/ —— configure 是构建生成物而非上游源文件）。
