knowledge_gained:
  - "Debian orig tarball 不含预生成 configure/Makefile.in/config.h.in 且自带 aclocal.m4 为 Automake 1.14.1 版：build() 自举需 aclocal --force(1.18 重建)→autoconf→autoheader→automake --add-missing（tool_requires automake/1.18）"
  - "HMDFS+conan build 上下文 kernel-exec 限制（E046 类）：/storage/Users/currentUser 下 shell 脚本无法 kernel-exec（autoreconf 内 exec aclocal 报 EACCES、test-driver exec ./testscript 报 bad interpreter），ELF 与 hnp 脚本可 exec；对策=显式解释器（perl <pkg>/bin/.aclocal-real/.automake-real、bash ./configure、make check LOG_COMPILER=bash）"
  - "E114 (HMDFS): autoconf 生成的 configure 内嵌 config.status 用 `umask 077 && mktemp -d` 建临时目录，产生不可写目录致 config.status 失败；运行时去掉 umask 077 修复"
  - "makeinfo/texinfo 缺失：configure 注入 MAKEINFO=true 固化于 Makefile，make/check/install 全程不需 makeinfo"
  - "configure.ac 无 AC_CANONICAL_HOST，native aarch64-ohos 构建不触发 config.guess 平台探测"
  - "make check = ./testscript（26 个 check，TAP 头 1..23 为过时计数），纯 shell+diff，OHOS bash 可运行"
  - "CLI 工具 in-source 构建（testscript 以相对路径引用 ./netmask 与 tests/），不可 out-of-tree"

