# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "2.5.0 起上游引入 libcheck 硬依赖：configure.ac PKG_CHECK_MODULES([CHECK],[check])、Makefile.am netmask_LDAD=$(CHECK_LIBS)；源码不 #include <check.h>。ohpcd 已有 check/0.15.2（OHOS armv8 clang binary），首次适配直接 requires"
  - "官方 release dist tarball（make dist）含预生成 configure/Makefile.in/config.h.in/aminclude_static.am → 免 2.4.4 的 automake 自举（对应源码由 release 资产提供，非 git tag 归档）"
  - "2.5.0 configure 调用 config.guess（AX_CODE_COVERAGE 引入 AC_CANONICAL_BUILD 路径）：uname -s=HarmonyOS 无法被 config.guess 识别 → configure 显式传 --build=aarch64-linux-ohos（config.sub 支持该 triplet；本机/CI 均 build=host=OHOS 同 profile）"
  - "E114 (HMDFS)：dist configure 同样内嵌 `(umask 077 && mktemp -d ...)` → build() 运行时去掉 umask 077（同 2.4.4 处置，conanfile._drop_umask_077）"
  - "check 0.15.2 包内自带 check.pc 的 prefix 指向构建临时目录（b/...）不可直接使用 → generate() 用 PkgConfigDeps 重生成指向真实包目录的 .pc 并令 configure 经 PKG_CONFIG_PATH 命中"
  - "链接策略：make 时 CHECK_LIBS 覆写为 check 包内 libcheck.a 绝对路径 → netmask 无 NEEDED libcheck.so（静态归档无符号被引用即不拉入代码），产物自包含、test 运行不需 LD_LIBRARY_PATH"
  - "make check = ./testscript（34 个 check，TAP 头 1..23 为过时计数），shell+diff；LOG_COMPILER=<hnp bash> 显式解释（HMDFS kernel-exec 限制，同 2.4.4）；构建仍 in-source（testscript 相对路径引用 ./netmask 与 tests/）"
  - "新增测试用例覆盖 IPv6（ipv6_simple/v6_*）与 IPv4-mapped 边界（v4_edge）、文件输入（file_input）、coverage1（release notes: patricia tree 重写 + --octal 修复）"

patch_generation:
  method: none
  patches_count: 0

patch_classification: []
