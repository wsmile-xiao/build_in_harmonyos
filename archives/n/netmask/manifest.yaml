# 软件级 manifest — netmask
# 文件位置: archives/n/netmask/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: netmask
display: "netmask (IP netmask generator)"
description: "IP 地址网络掩码格式化/换算与 CIDR 合并命令行工具（An IP address formatting tool）"
category: utility
homepage: "https://github.com/tlby/netmask"
license: "GPL-2.0-or-later"

build_system: autotools

ohos_adaptation:
  key_points:
    - "C 语言 autotools CLI 工具，产物 bin/netmask + netmask.1，零第三方依赖（仅 libc）"
    - "Debian orig tarball 不含预生成 configure，build() 内显式解释器直跑链自举（tool_requires automake/1.18：aclocal/automake 经 perl <am>/bin/.aclocal-real/.automake-real，autoconf/autoheader 裸调）——本机 HMDFS 下 conan 构建子进程无法 kernel-exec 用户目录 shebang 脚本，不用 autoreconf -fi；CI Linux 双环境兼容"
    - "E114 (HMDFS): 生成的 configure 内嵌 config.status 用 umask 077 建临时目录失败，build() 运行时去掉 umask"
    - "makeinfo/texinfo 缺失：configure 以 MAKEINFO=true 固化，不生成/安装 netmask.info（man page 保留）"
    - "make check (TESTS=./testscript) 实测 26 个 check 全 ok；构建用 in-source（testscript 相对路径引用）"
    - "2.5.0 升级（2026-09-04）：上游引入 libcheck 硬依赖（configure.ac PKG_CHECK_MODULES check）→ 增 requires check/0.15.2（制品仓已发布）；configure 需 --build=aarch64-linux-ohos（config.guess 不识 HarmonyOS）；check 以包内 libcheck.a 静态链入保证 CLI 自包含。2.4.4 版 '禁升级' 锁版说明随本次升级解除"
  common_dependencies: []

versions:
  "2.4.4":
    status: built
    build_date: "2026-09-03"
  "2.5.0":
    status: built
    build_date: "2026-09-04"
