# notmuch2 0.34.3 适配清单
# Pythonic cffi 绑定包（notmuch2），setup.py + cffi_modules，构建时编译
# notmuch2/_capi 扩展（#include <notmuch.h> + -lnotmuch），运行时 dlopen
# libnotmuch.so。依赖 notmuch/0.38.3（本仓库适配，libnotmuch.so + notmuch.h
# 随包分发）+ glib/2.84.0（libnotmuch 运行时 NEEDED libglib-2.0.so）。
# CI worker 网络受限，源码 tar 随 export_sources 自包含。

version: "0.34.3"
status: built

source:
  url: "https://files.pythonhosted.org/packages/source/n/notmuch2/notmuch2-0.34.3.post1.tar.gz"
  sha256: ""
  tar_format: tar.gz
  bundled: "notmuch2-0.34.3-src.tar.gz（CI worker 网络受限，配方内自包含）"

build:
  system: custom
  notes: "pip wheel --no-deps 打包提取到 site-packages（check-jsonschema 先例）；_build.py 的 include_dirs/library_dirs 硬编码 ../../lib → replace_in_file 改为 notmuch 制品 include/lib；cffi 编译期与运行期 LD_LIBRARY_PATH 指向 notmuch 制品 lib"

patches_applied: []

test:
  upstream_cases: 157
  upstream_suite: "notmuch2 上游测试（tests/ 目录 7 个 pytest 文件——test_base/test_config/test_database/test_errors/test_message/test_tags/test_thread）"
  runnable: 157
  runnable_note: "上游 157 个 pytest 测试全量实测运行：157/157 通过（100%）——notmuch CLI 用 build-root 二进制 + 完整 LD_LIBRARY_PATH（gmime/xapian/talloc/glib/zlib），上游 conftest.py 原样运行"
  pass_rate: "157/157（100%）"
  consumer_test: "test_package 验证 import notmuch2 + _capi 加载 + notmuch 版本宏"

knowledge_gained:
  - "notmuch2 是 cffi 绑定包，_build.py 硬编码 include_dirs=['../../lib']/library_dirs=['../../lib']，需改为依赖制品路径"
  - "cffi 编译期需要 libnotmuch.so 在 LD_LIBRARY_PATH（链接 -lnotmuch）"
  - "notmuch2 依赖 notmuch/0.38.3（libnotmuch.so + notmuch.h）+ glib（运行时 NEEDED libglib-2.0.so）"
  - "CI worker 无法稳定访问 PyPI，源码用 sdist tar 打进配方自包含"
