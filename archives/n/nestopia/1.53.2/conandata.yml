sources:
  url: "https://github.com/0ldsk00l/nestopia/archive/refs/tags/1.53.2.tar.gz"
  filename: "nestopia-1.53.2.tar.gz"
  sha256: "7783d2673ad496109e7dd3d75756cfef30c5b400409131b83b45c2fa3ddd735b"

patches:
  "1.53.2":
    - patch_file: "patches/0001-configure.ac.patch"
      patch_description: "Accept externally supplied dependency *_CFLAGS/*_LIBS and disable host pkg-config/fltk-config probing"
      patch_type: "portability"
    - patch_file: "patches/0002-Makefile.am.patch"
      patch_description: "Compile the HarmonyOS Fl_Gl_Window symbol shim into the front-end"
      patch_type: "portability"
    - patch_file: "patches/0003-add-fltk-gl-ohos.patch"
      patch_description: "Add fltkui/fltk_gl_ohos.cpp: Fl_Gl_Window with can_do()=0 for the GLX-less OHOS platform"
      patch_type: "portability"