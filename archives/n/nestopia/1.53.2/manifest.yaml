name: nestopia
software: nestopia
version: "1.53.2"
description: "Nestopia — portable, cycle-accurate NES/Famicom emulator"
build_system: autotools
license: GPL-2.0-or-later
status: built
build_date: "2026-09-10"
conan_ref: "nestopia/1.53.2"

source:
  url: "https://github.com/0ldsk00l/nestopia/archive/refs/tags/1.53.2.tar.gz"
  sha256: "7783d2673ad496109e7dd3d75756cfef30c5b400409131b83b45c2fa3ddd735b"
  tar_format: tar.gz
  tag: "1.53.2"
  upstream_sha256_double_checked_against: "FreeBSD ports distinfo (7783d2673ad496109e7dd3d75756cfef30c5b400409131b83b45c2fa3ddd735b)"

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--disable-doc"
  dependency_flag_overrides:
    - "ZLIB_CFLAGS/ZLIB_LIBS"
    - "LIBARCHIVE_CFLAGS/LIBARCHIVE_LIBS"
    - "SAMPLERATE_CFLAGS/SAMPLERATE_LIBS"
    - "SDL2_CFLAGS/SDL2_LIBS"
    - "LIBEPOXY_CFLAGS/LIBEPOXY_LIBS"
    - "FLTK_CFLAGS/FLTK_LIBS"
  bootstrap: "autoreconf -fi (tool_requires autoconf/2.72 + automake/1.18 + autoconf-archive/2024.10.16)"
  dependencies:
    - "zlib/1.3.1.1"
    - "libarchive/3.8.7"
    - "libsamplerate/0.2.2"
    - "sdl2/2.32.10"
    - "libepoxy/1.5.10"
    - "libfltk/1.3.11"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure.ac.patch"
  - "0002-Makefile.am.patch"
  - "0003-add-fltk-gl-ohos.patch"

products:
  bin:
    - "nestopia"
  lib:
    - "libnestopia_core.a"

tests:
  upstream_registered: 0
  upstream_check_target: "none (upstream Makefile.am has no check/TESTS target)"
  consumer_flows_declared: 1
  consumer_flows_executed_on_ohos: 1
  result: "passed_1_of_1_logical_flow"

local_validation:
  ohos_arm64_cross_builds: 1
  target_execution: passed
  core_api_smoke: passed
  fltk_gui_headless: "not_run (requires GLX display; documented in PR body)"
  conan_w3: passed

knowledge_gained:
  - "Nestopia upstream ships configure.ac/Makefile.am only; autoreconf is required (tarball has no configure)."
  - "OHOS provides EGL/GLES2 but no GLX, so the in-repo libfltk/1.3.11 package has OPTION_USE_GL=OFF and no libfltk_gl.a."
  - "The FLTK front-end derives its video window from Fl_Gl_Window; a symbol shim with can_do()=0 is the minimal link-compatible adaptation on GLX-less platforms."
  - "The emulation core (source/core) has no display dependency and links only against zlib, enabling a fully headless core-API test."
  - "configure.ac dependency macros must be overridable through *_CFLAGS/*_LIBS environment variables so no host pkg-config/fltk-config leaks into the OHOS build."