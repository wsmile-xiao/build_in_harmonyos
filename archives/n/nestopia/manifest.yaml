software: nestopia
display: "Nestopia"
description: "Nestopia — portable, cycle-accurate NES/Famicom emulator (FLTK front-end)"
category: emulator
homepage: "https://github.com/0ldsk00l/nestopia"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Configure.ac dependency probes are replaced by externally supplied *_CFLAGS/*_LIBS so no host pkg-config/fltk-config leaks into the OHOS build"
    - "OHOS has EGL/GLES2 but no GLX; libfltk/1.3.11 ships no libfltk_gl, so fltkui/fltk_gl_ohos.cpp provides the Fl_Gl_Window symbols with can_do()=0"
    - "The emulation core archives into libnestopia_core.a for headless core-API testing (no display dependency)"
    - "FLTK GUI display cannot run headless on OHOS; verified at link level only"
    - "autoreconf is required (autoconf/2.72 + automake/1.18 + autoconf-archive/2024.10.16 via tool_requires)"
  common_dependencies:
    - "zlib"
    - "libarchive"
    - "libsamplerate"
    - "sdl2"
    - "libepoxy"
    - "libfltk"

commands:
  - "nestopia"

versions:
  "1.53.2":
    status: built
    build_date: "2026-09-10"
    conan_ref: "nestopia/1.53.2"