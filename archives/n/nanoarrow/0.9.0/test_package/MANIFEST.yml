# test_package/MANIFEST.yml — nanoarrow 0.9.0
package: nanoarrow/0.9.0
homepage: "https://github.com/apache/arrow-nanoarrow"

# Upstream test command (core library tests; Arrow C++ integration OFF,
# IPC/DEVICE OFF). 12 gtest binaries are registered via gtest_discover_tests.
upstream_check_command: "ctest --output-on-failure"

# Integrated in the main recipe build() (TEST_QUALITY_SPEC layer 1).
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# The 12 upstream test executables built with NANOARROW_BUILD_TESTS=ON
# (NANOARROW_BUILD_TESTS_WITH_ARROW=OFF, IPC/DEVICE OFF).
upstream_tests:
  - file: src/nanoarrow/common/utils_test.cc
    source: apache-arrow-nanoarrow-0.9.0/src/nanoarrow/common/utils_test.cc
    description: "Upstream gtest binary: utils_test"
    command: "ctest -R utils_test"
  - file: src/nanoarrow/common/buffer_test.cc
    source: apache-arrow-nanoarrow-0.9.0/src/nanoarrow/common/buffer_test.cc
    description: "Upstream gtest binary: buffer_test"
    command: "ctest -R buffer_test"
  - file: src/nanoarrow/common/array_test.cc
    source: apache-arrow-nanoarrow-0.9.0/src/nanoarrow/common/array_test.cc
    description: "Upstream gtest binary: array_test"
    command: "ctest -R array_test"
  - file: src/nanoarrow/common/schema_test.cc
    source: apache-arrow-nanoarrow-0.9.0/src/nanoarrow/common/schema_test.cc
    description: "Upstream gtest binary: schema_test"
    command: "ctest -R schema_test"
  - file: src/nanoarrow/common/array_stream_test.cc
    source: apache-arrow-nanoarrow-0.9.0/src/nanoarrow/common/array_stream_test.cc
    description: "Upstream gtest binary: array_stream_test"
    command: "ctest -R array_stream_test"
  - file: src/nanoarrow/testing/testing_test.cc
    source: apache-arrow-nanoarrow-0.9.0/src/nanoarrow/testing/testing_test.cc
    description: "Upstream gtest binary: nanoarrow_testing_test"
    command: "ctest -R nanoarrow_testing_test"
  - file: src/nanoarrow/integration/c_data_integration_test.cc
    source: apache-arrow-nanoarrow-0.9.0/src/nanoarrow/integration/c_data_integration_test.cc
    description: "Upstream gtest binary: c_data_integration_test"
    command: "ctest -R c_data_integration_test"
  - file: src/nanoarrow/hpp/array_stream_test.cc
    source: apache-arrow-nanoarrow-0.9.0/src/nanoarrow/hpp/array_stream_test.cc
    description: "Upstream gtest binary: hpp_array_stream"
    command: "ctest -R hpp_array_stream"
  - file: src/nanoarrow/hpp/buffer_test.cc
    source: apache-arrow-nanoarrow-0.9.0/src/nanoarrow/hpp/buffer_test.cc
    description: "Upstream gtest binary: hpp_buffer"
    command: "ctest -R hpp_buffer"
  - file: src/nanoarrow/hpp/exception_test.cc
    source: apache-arrow-nanoarrow-0.9.0/src/nanoarrow/hpp/exception_test.cc
    description: "Upstream gtest binary: hpp_exception"
    command: "ctest -R hpp_exception"
  - file: src/nanoarrow/hpp/unique_test.cc
    source: apache-arrow-nanoarrow-0.9.0/src/nanoarrow/hpp/unique_test.cc
    description: "Upstream gtest binary: hpp_unique"
    command: "ctest -R hpp_unique"
  - file: src/nanoarrow/hpp/view_test.cc
    source: apache-arrow-nanoarrow-0.9.0/src/nanoarrow/hpp/view_test.cc
    description: "Upstream gtest binary: hpp_view"
    command: "ctest -R hpp_view"

test_package_tests:
  - file: test.c
    description: "Consumer verification: version query, int32 array build/verify, string array build/verify, schema deep-copy"
    command: "./test_nanoarrow"

assertion_count: 4
