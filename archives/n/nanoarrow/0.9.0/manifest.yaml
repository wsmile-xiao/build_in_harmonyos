# 版本级 manifest — nanoarrow 0.9.0

version: "0.9.0"
software: "nanoarrow"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39: 官方 GitHub tag 归档）
  url: "https://github.com/apache/arrow-nanoarrow/archive/refs/tags/apache-arrow-nanoarrow-0.9.0.tar.gz"

  # 官方 tag apache-arrow-nanoarrow-0.9.0 解引用 commit
  upstream_commit: "9fad80292360d0f3978264c11ba865ccc94020d8"

  # 源码校验和（官方 tag tarball sha256，已下载核验）
  sha256: "22c3edeaa5cb384c6da091f32a4e1c937779f2d62f84d646028de658b03d4385"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: cmake（核心库 nanoarrow_static/nanoarrow_shared）
  system: cmake

  configure_options:
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DNANOARROW_INSTALL_SHARED=OFF"
  - "-DNANOARROW_IPC=OFF"
  - "-DNANOARROW_DEVICE=OFF"
  - "-DNANOARROW_TESTING=OFF"
  - "-DNANOARROW_BUILD_TESTS=ON"
  - "-DNANOARROW_BUILD_TESTS_WITH_ARROW=OFF"
  - "-DNANOARROW_BUILD_APPS=OFF"
  - "-DNANOARROW_BUILD_BENCHMARKS=OFF"
  - "-DNANOARROW_BUILD_INTEGRATION_TESTS=OFF"
  - "-DNANOARROW_BUNDLE=OFF"

  # 编译依赖列表（格式: name/version）— 核心库零外部依赖
  # （上游测试用随源码 vendored 的 googletest，无需下载）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained: []
