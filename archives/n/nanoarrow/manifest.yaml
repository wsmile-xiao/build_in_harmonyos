software: nanoarrow
display: "nanoarrow"
description: "Helpers for Arrow C Data, C Stream and C Device interfaces (Apache nanoarrow C library)"
category: library
homepage: "https://github.com/apache/arrow-nanoarrow"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 核心库：默认仅构建 nanoarrow（IPC/DEVICE OFF），零外部依赖"
    - "上游测试 NANOARROW_BUILD_TESTS=ON（vendored googletest，无需 Arrow C++），build() 内 ctest --output-on-failure 真实执行"
    - "HMBS 证据：build() 解析 ctest 汇总输出 HMBS_UPSTREAM_TEST_RESULT 并持久化 res/hmbs_upstream.json，test_package 每轮复发"
    - "test_package 实质调用 C Data API：版本查询、int32/string 数组构建校验、schema 深拷贝"
  common_dependencies: []

versions:
  "0.9.0":
    status: built
    build_date: "2026-09-10"
    conan_ref: "nanoarrow/0.9.0"
