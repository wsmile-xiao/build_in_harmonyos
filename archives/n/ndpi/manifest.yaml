# 软件级 manifest
# 文件位置: archives/n/ndpi/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: ndpi
display: "nDPI"
description: "Open source deep packet inspection (DPI) library"
category: network
homepage: "https://www.ntop.org/products/deep-packet-inspection/ndpi/"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 项目：release tarball 无预生成 configure，需 autoreconf（tool_requires automake/libtool）"
    - "完整构建需要 libpcap（example/ndpiReader 与上游 tests/do.sh 的运行基础）"
    - "json-c 缺席时上游单测 tests/unit 自动禁用（configure 行为），do.sh/do-dga.sh 仍完整运行"
    - "package 仅发布库（libndpi + 头文件 + libndpi.pc）；示例工具 ndpiReader 只用于构建期上游测试"
  common_dependencies:
    - libpcap

versions:
  "5":
    status: built
    build_date: "2026-09-15"
    conan_ref: "ndpi/5.0"
    note: "Upstream tag 5.0 (AC_INIT 5.0.0)；目录保持任务卡版本 5，制品经 set_version() 归一化为 5.0（E563）"
