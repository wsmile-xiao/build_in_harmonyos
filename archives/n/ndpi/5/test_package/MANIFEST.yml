# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

# 目录版本保持任务卡 "5"（L0n 分支门禁）；制品版本经 set_version() 归一化为
# 上游 tag "5.0"（E563），此处与制品版本对齐。
package: ndpi/5.0
homepage: "https://github.com/ntop/nDPI"

# 上游测试命令 (tests/Makefile.am: TESTS = do.sh do-dga.sh [+ do-unit.sh])
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（代表性条目；do.sh 内部对 tests/cfgs/*/pcap
# 逐个回放，全量 pcap 数以真机 make check 日志为准）
upstream_tests:
  - file: tests/do.sh
    source: nDPI-5.0/tests/do.sh
    description: "ndpiReader pcap 回放：tests/cfgs 下各配置的 pcap 与 result 逐字节 diff"
    command: "make check"
  - file: tests/do-dga.sh
    source: nDPI-5.0/tests/do-dga.sh
    description: "DGA 检测准确率/精确率/召回率门禁（tests/dga CSV 数据集）"
    command: "make check"
  - file: tests/unit/unit.c
    source: nDPI-5.0/tests/unit/unit.c
    description: "C 单元测试（需 json-c；制品仓暂无 published 的 json-c，本配方未启用，make check 自动跳过）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：init/finalize/协议数/HTTP 与 DNS 命名/flow 结构大小/版本串共 7 项断言"
    command: "ctest --output-on-failure -R test_ndpi"

# 测试断言总数 (test.c 的 7 项真实断言；上游计数以真机 evidence 为准)
assertion_count: 7
