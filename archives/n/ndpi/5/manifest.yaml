# 版本级 manifest
# 文件位置: archives/n/ndpi/5/manifest.yaml

version: "5"
software: "ndpi"
status: built
build_date: "2026-09-15"
build_system: "autotools"
# 目录版本 "5" 保持任务卡原值（L0n 分支门禁）；制品版本经 set_version()
# 归一化为上游 tag "5.0"（E563，Conan >=2 字符校验）。
artifact_version: "5.0"
conan_ref: "ndpi/5.0"

source:
  url: "https://github.com/ntop/nDPI/archive/refs/tags/5.0.tar.gz"
  sha256: "8b0d3dc0c8a6a68578e09a18c922021ef6458d4aca1c7a20ce04efc267aa9ea5"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static/--disable-shared（shared=False 时）"
    - "默认完整构建（含 example/tests，不带 --with-only-libndpi，以便运行上游测试）"
  dependencies:
    - libpcap/1.10.6
  build_dependencies:
    - automake/1.18
    - libtool/2.5.4
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "GitHub archive tarball 无 configure，必须 autoreconf；与 aircrack 1.7 同模式"
  - "缺 json-c 时 configure 自动禁用 tests/unit，make check 仍跑 do.sh + do-dga.sh"
  - "make install 会附带 bin/ndpiReader 与 share/ndpi，package 阶段移除以保持纯 library"
