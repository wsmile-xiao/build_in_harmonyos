# test_package/MANIFEST.yml 鈥?netsurf-buildsystem 1.10
# CI L0e requires this file to exist.

package: netsurf-buildsystem/1.10
homepage: "https://www.netsurf-browser.org/"

# netsurf-buildsystem is a build-system project: it ships only Makefile fragments
# and helper scripts. The upstream `make test` target is a documented no-op.
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective: build a small static library
# that consumes the upstream makefile fragments on OHOS aarch64)
test_package_tests:
  - file: test.sh
    description: "Consumer smoke validation: invoke upstream makefiles via NSSHARED to build a minimal lib-static libsmoke.a, verifying the makefile fragments are usable end-to-end on OHOS clang 15 / aarch64"
    command: "sh test.sh ${netsurf-buildsystem_package_path}/share/netsurf-buildsystem"

# Approximate assertion count (presence checks for 4 files + libsmoke.a
# non-empty verification)
assertion_count: 5
