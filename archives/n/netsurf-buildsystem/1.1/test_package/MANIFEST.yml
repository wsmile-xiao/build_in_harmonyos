package: netsurf-buildsystem/1.1
homepage: "https://www.netsurf-browser.org/"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

upstream_tests:
  - file: Makefile
    source: buildsystem-1.1/Makefile
    description: "Official upstream test target (the release intentionally has no test commands)"
    command: "make test"

test_package_tests:
  - file: test.sh
    description: "Checks installed files, executable helper modes, and builds a static consumer through Makefile.tools and Makefile.top."
    command: "sh test.sh <package-folder>/share/netsurf-buildsystem"

assertion_count: 7
test_modifications:
  - "No upstream source or test files are modified."
  - "The consumer fixture is additive and exercises the packaged makefile fragments with a real compiler and archiver."
