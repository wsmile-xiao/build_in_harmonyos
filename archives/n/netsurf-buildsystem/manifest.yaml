software: netsurf-buildsystem
display: "NetSurf Build System"
description: "NetSurf shared makefile build system for downstream NetSurf libraries"
category: build-tool
homepage: "https://www.netsurf-browser.org/"
license: MIT
build_system: make

ohos_adaptation:
  key_points:
    - "Build-scripts package: no compiled artifacts, only Makefile fragments and helper scripts"
    - "Preserves the upstream share/netsurf-buildsystem layout for NSSHARED consumers"
    - "Exports NSSHARED through Conan build and run environments"
    - "Consumer validation exercises the installed makefile fragments because upstream make test is a no-op"
  common_dependencies: []

versions:
  "1.1":
    status: in_progress
    notes: "Original HarmonyOS PC adaptation with an installed-fragment consumer test."
  "1.10":
    status: built
    build_date: "2026-09-07"
    notes: "Newer OHOS aarch64 adaptation already present on main."
