software: netsurf-buildsystem
display: "NetSurf Build System"
description: "NetSurf shared makefile build system for downstream NetSurf libraries"
homepage: "https://www.netsurf-browser.org/"
license: "MIT"
build_system: make

ohos_adaptation:
  key_points:
    - "Buildscripts package: no compiled artifacts, only Makefile fragments and helper scripts"
    - "MIT license"
    - "Downstream consumers expect NSSHARED env var pointing at share/netsurf-buildsystem"
    - "The makefile fragments are plain GNU make; no shim or compat layer needed on OHOS"
  common_dependencies: []

versions:
  "1.10":
    status: built
    build_date: "2026-09-07"
    notes: "Initial OHOS aarch64 adaptation. test_package consumer runs upstream make fragments to build a small static library."
