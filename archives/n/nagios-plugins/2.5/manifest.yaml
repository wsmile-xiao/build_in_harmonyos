# 版本级适配清单：nagios-plugins 2.5
version: "2.5"
software: "nagios-plugins"
status: built
build_date: "2026-09-11"
build_system: autotools

source:
  url: "https://nagios-plugins.org/download/nagios-plugins-2.5.tar.gz"
  sha256: "44d1510b5e17055fd9aa4a1d9662a234fc5d5c1b96548852c8e78701584b2684"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--libexecdir=/bin"
    - "--enable-extra-opts"
    - "--enable-perl-modules=no"
    - "--with-openssl=${OPENSSL_PREFIX}"
    - "--with-gnutls=no"
    - "--with-pgsql=no"
    - "--without-dbi"
    - "--without-radius"
    - "--without-ldap"
    - "--with-mysql=no"
  ohos_configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--with-ps-command=/bin/ps -o stat,uid,pid,ppid,vsz,rss,pcpu,comm,args"
    - "--with-ps-format=%s %d %d %d %d %d %f %s %n"
    - "--with-ps-cols=9"
    - "--with-ps-varlist=procstat,&procuid,&procpid,&procppid,&procvsz,&procrss,&procpcpu,procprog,&pos"
  ohos_cflags:
    - "-include"
    - "utmp.h"
    - "-Dpthread_cancel=pthread_self"
    - "-Dsetutxent=setutent"
    - "-Dgetutxent=getutent"
    - "-Dendutxent=endutent"
    - "-Drindex=strrchr"
  dependencies:
    - "openssl/3.5.6"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 2.5 发布包自带 configure，采用 Autotools out-of-source 构建。"
  - "OpenSSL 作为独立 Conan 依赖启用 check_http/check_tcp 的 TLS 支持；数据库、LDAP、RADIUS、DBI 插件显式关闭，避免混入未适配依赖。"
  - "plugins-root 的 check_dhcp/check_icmp 使用 install-packager 非 setuid 安装，设备侧不自动授予特权。"
  - "HarmonyOS 设备通过显式 aarch64-unknown-linux-gnu build/host triplet 固定 canonical host，并通过 configure 参数固定 /bin/ps 的 9 列输出格式。"
  - "设备 HMDFS 临时目录由 configure 的 umask 077 创建后不可写；配方在构建缓存中的 configure 临时目录逻辑改为 umask 000。"
  - "HarmonyOS libc 缺少 pthread_cancel、utmpx 三个 x 符号和 BSD rindex 别名；使用 pthread_self、setutent/getutent/endutent 和 strrchr 的编译期兼容映射后通过链接。"
  - "CI profile 不保证预包含 utmp 声明；配方显式预包含 utmp.h，确保 utmpx 兼容宏展开后的 setutent/getutent/endutent 原型可见。"
  - "上游 plugins/Makefile 将 check_tcp 别名硬编码为 ln -s；配方在 configure 后将构建期和安装期别名改为 cp -p，适配设备文件系统的符号链接限制。"

validation:
  target: ohos-aarch64
  profile: ohos-aarch64-fixed
  conan_version: "2.29.1"
  conan_create:
    result: passed
    command: "conan create archives/n/nagios-plugins/2.5 -pr:h=ohos-aarch64-fixed -pr:b=default --build=missing -c tools.build:jobs=1"
  upstream_test:
    result: passed
    total: 20
    passed: 20
    failed: 0
  test_package:
    result: passed
    command: "conan test archives/n/nagios-plugins/2.5/test_package nagios-plugins/2.5 -pr:h=ohos-aarch64-fixed -pr:b=default"
    checks: "check_dummy exit/output, check_tcp, check_udp, check_disk, check_http and check_simap --version"
  device_smoke:
    result: passed
    checks: "check_dummy, check_tcp, check_udp, check_disk, check_http, check_simap, check_users, check_load, check_procs, check_dns, check_ftp, check_imap, check_nntp and check_pop --version; check_ftp/check_udp are regular files"
