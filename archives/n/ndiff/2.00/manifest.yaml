# 版本级 manifest — ndiff 2.00
# 遵循 ARCHIVE-SPEC v2.0

version: "2.00"
software: "ndiff"
status: built
build_date: "2026-09-07"
build_system: autotools

source:
  url: "https://ftp.deu.edu.tr/pub/Solaris/sunfreeware/SOURCES/ndiff-2.00.tar.gz"
  sha256: "b35ce7741631b55ed728da845ea8bf5e28e2b0e34881ce65adf9cc3228708ff5"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "make LN=cp"
    - "make check TMPDIR=<build_folder>/check-tmp LN=cp"
    - "make install LN=cp"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Upstream release is ndiff 2.00; the task platform displays version 2, but Conan rejects bare integer version 2, so the archive and Conan reference use ndiff/2.00."
  - "Conan's HTTP downloader is used with a public HTTPS mirror; its extracted source tree matches the official ftp.math.utah.edu ndiff-2.00 tarball."
  - "Default build uses native long-double precision and does not require optional GMP; do not pass --without-gmp because this old configure script treats any --with/--without-gmp occurrence as selecting GMP."
  - "Upstream make check runs 26 checks after a temporary install; pass a writable TMPDIR on OHOS because /tmp is read-only."
  - "Upstream install creates versioned executable hard links via LN=ln; pass LN=cp because HMDFS rejects hard links."
