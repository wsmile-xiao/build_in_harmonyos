# test_package/MANIFEST.yml — ndiff 2.00
# CI L0e requires this file to exist.

package: ndiff/2.00
homepage: "https://www.math.utah.edu/~beebe/software/ndiff/"

# Upstream test suite
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check TMPDIR=<build_folder>/check-tmp LN=cp"

upstream_tests:
  - file: Makefile.in
    source: ndiff-2.00/test/check001.in1 .. ndiff-2.00/test/check026.opt
    description: "Official make check suite installs ndiff to a temporary prefix and runs 26 numeric comparison cases against okay-ldb expected outputs"
    command: "make check"

test_package_tests:
  - file: test.sh
    description: "Runs ndiff --version, verifies tolerance-accepted comparison, and verifies out-of-tolerance relative error reporting"
    command: "bash test.sh"

assertion_count: 31
