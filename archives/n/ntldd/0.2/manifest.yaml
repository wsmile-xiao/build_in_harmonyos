version: "0.2"
status: built
build_date: "2026-09-29"
build_system: manual-cc

source:
  url: "https://ghfast.top/https://github.com/LRN/ntldd/archive/refs/tags/0.2.tar.gz"
  sha256: "3c63d83333413be19dcf0823dc17bd3f014447a43b8d48212829c4cc5fbf74ce"
  tar_format: tar.gz
  upstream_repository: "https://github.com/LRN/ntldd"
  upstream_tag: "0.2"

build:
  system: manual-cc
  configure_options: []
  compiler_flags:
    - "-U_WIN32 (select the pe_compat portability layer)"
    - "-Wno-format (upstream printf format mismatches)"
  dependencies: []

patches_applied:
  - "patches/0001-ohos-pe-compat-port.patch"

tests:
  upstream:
    command: "./ntldd --version"
    cases: 0
    passed: 0
    note: "Upstream ntldd 0.2 ships no automated test suite (no test/ dir, no make check target); a --version self-check runs in build() when not cross-building."
  test_package:
    command: "bash test_ntldd.sh <ntldd-binary>"
    cases: 6
    passed: 6
    note: "Passed on OHOS armv8 shadow CI (L2 smoke --version also passed). 6 assertions: --version, --help, KERNEL32.dll listing, advapi32.dll listing, not-found reporting, -i import listing."

platform:
  validated_architecture: "OHOS/armv8 validated by shadow CI (clang 15, aarch64-linux-ohos)"
  limitations:
    - "The ported tool parses PE files only; it does not resolve or execute Windows binaries."
    - "on_self mode (inspecting the running process) is Windows-only and returns an error off-Windows; the ntldd CLI never enables it."
