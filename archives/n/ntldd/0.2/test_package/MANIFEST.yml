package: ntldd/0.2
homepage: "https://github.com/LRN/ntldd"

upstream_check_command: "./ntldd --version"
upstream_test_in_build: false
upstream_test_command: "./ntldd --version"

upstream_tests:
  - file: "(none)"
    source: "ntldd-0.2 upstream ships no test suite"
    description: "Upstream has no automated tests; --version self-check runs in build when not cross-building"
    command: "./ntldd --version"

test_package_tests:
  - file: test_ntldd.sh
    description: "Validate --version, --help, dependency listing on a generated tiny PE, unresolved-DLL reporting, and -i import listing"
    command: "bash test_ntldd.sh <ntldd-binary>"
  - file: gen_pe.py
    description: "Generate a tiny valid PE32 with two import dependencies (verified against llvm-objdump)"
    command: "python3 gen_pe.py tiny.exe"

assertion_count: 6
