# nmail 5.14.12 适配清单
# 终端 Email UA（ncursesw TUI，C++17），CMake 构建。
# libetpan 走 vendored（HAS_CUSTOM_LIBETPAN=ON 默认为内嵌 ext/libetpan 源码编译），
# notmuch 全源码零引用（非依赖，任务情报作废）。

version: "5.14.12"
status: built

source:
  url: "https://github.com/d99kris/nmail/archive/refs/tags/v5.14.12.tar.gz"
  sha256: "d089e315bcca1906a2bd12a940ad7ebbc0b62e10ed1d2c12a952f2cf8ad71556"
  tar_format: tar.gz
  sha256_verification: "GitHub tarball 下载 sha256 == Homebrew homebrew-core Formula/n/nmail.rb 5.14.12 记录（双源核对一致）；FreeBSD ports 无 nmail（404）"

build:
  system: cmake
  cc: clang
  cxx_std: 17
  cmake_variables:
    - "CURSES_NEED_NCURSES=TRUE"
    - "CURSES_NEED_WIDE=TRUE"
  notes: |
    - CMakeLists 使用 XAPIAN_INCLUDE_DIR/XAPIAN_LIBRARIES/CURSES_LIBRARIES/
      SQLite3_LIBRARIES/CYRUS_SASL_LIBRARY/MAGIC_LIBRARY/LIBUUID_LIBRARIES
      等大写变量；conan CMakeDeps 生成小写变量名不匹配 → conanfile generate()
      用 CMakeToolchain.variables 显式注入依赖包绝对路径（ncview 手法：
      vendored 静态 + XXX_LIBS 显式绝对路径传库）。
    - libetpan 默认 HAS_CUSTOM_LIBETPAN=ON，vendored ext/libetpan 内嵌编译
      （LIBETPAN_STATIC=ON，LIBETPAN_LIBNAME=etpan-nmail），依赖 curl/expat/
      zlib/openssl/sasl2 由 conan 注入同一批变量。
    - cyrus-sasl 用 2.1.28.1（默认 --without-openssl 无 openssl 硬依赖）——
      2.1.28 钉 openssl/3.5.6 与 curl 8.15.0.1 钉 openssl/3.5.6.1 版本冲突。
    - 无头冒烟只用纯 IO 退出路径（-v/-h/--help），不启动 TUI。

patches_applied:
  - "见 patches/ 目录（refresh-patch 生成）"

test:
  upstream_cases: 0
  upstream_suite: "上游无测试框架：make.sh tests 分支写死 `true # currently this project has no tests`，CMakeLists 无 enable_testing/add_test"
  runnable: 0
  consumer_test: "test_package 运行 nmail -v/--version 断言版本 banner + 退出码 0；-h/--help 断言帮助文本 + 退出码 0；未知参数断言退出码 1（R34 真实执行被测二进制）"

knowledge_gained:
  - "nmail 5.14.12 的 notmuch 是假情报：全源码零引用（grep notmuch 无命中），实际搜索依赖是 xapian-core"
  - "libetpan 走 vendored 时需 curl/expat/zlib/openssl/sasl2 外部依赖（ext/libetpan/CMakeLists.txt find_package+find_library 实证）"
  - "cyrus-sasl 2.1.28 钉 openssl/3.5.6（--with-openssl），2.1.28.1 默认 --without-openssl 无该硬依赖 → 换 2.1.28.1 可解 curl 链 openssl/3.5.6.1 版本冲突"
  - "conan CMakeDeps 生成小写变量（xapian_INCLUDE_DIRS），上游 CMake 用大写（XAPIAN_INCLUDE_DIR）→ 大小写不匹配，须 CMakeToolchain.variables 显式注入绝对路径"