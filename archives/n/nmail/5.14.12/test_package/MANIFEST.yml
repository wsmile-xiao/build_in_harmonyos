package: nmail/5.14.12
homepage: "https://www.nmail.org/"

upstream_check_command: "not available (upstream has no test framework)"
upstream_test_in_build: false
upstream_test_command: "not run: make.sh tests branch is literally 'true # currently this project has no tests'; CMakeLists.txt has no enable_testing/add_test"

upstream_tests: []

test_package_tests:
  - file: "src/test_nmail.sh"
    description: "nmail --version prints the version banner and exits 0 (pure-IO path, no TUI init)"
    command: "nmail --version && grep -q 'nmail'"
  - file: "src/test_nmail.sh"
    description: "nmail -v prints the version banner and exits 0"
    command: "nmail -v && grep -q 'nmail'"
  - file: "src/test_nmail.sh"
    description: "nmail --help prints usage text and exits 0"
    command: "nmail --help && grep -q 'Usage: nmail'"
  - file: "src/test_nmail.sh"
    description: "nmail -h prints usage text and exits 0"
    command: "nmail -h && grep -q 'Usage: nmail'"
  - file: "src/test_nmail.sh"
    description: "nmail with an unknown option is rejected with exit code 1"
    command: "nmail --definitely-not-an-option; expect exit 1"

assertion_count: 5