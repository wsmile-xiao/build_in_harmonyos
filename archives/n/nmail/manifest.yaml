software: nmail
display: "nmail"
description: "终端 Email 客户端（ncurses TUI，支持 IMAP/SMTP、全文搜索、多账户）"
category: mail
homepage: "https://www.nmail.org/"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "libetpan 走上游默认 HAS_CUSTOM_LIBETPAN=ON（vendored ext/libetpan 源码内嵌编译），无需 ohpcd libetpan 包（实测 ohpcd 0 匹配 libetpan/1.9.4，任务情报作废）"
    - "notmuch 全源码零引用（CMakeLists.txt 无 find_package、src/ 无 include/链接），任务情报作废，非依赖"
    - "依赖链全走 ohpcd 已发布制品：ncurses/6.6 + openssl/3.5.6.1 + xapian-core/1.4.26 + sqlite3/3.53.4 + cyrus-sasl/2.1.28.1 + libmagic/5.48 + uuid/2.40.1 + curl/8.15.0.1 + expat/2.8.4 + zlib/1.3.1.1"
    - "cyrus-sasl 选 2.1.28.1 而非 2.1.28：2.1.28 钉 openssl/3.5.6 与 curl 钉 openssl/3.5.6.1 版本冲突；2.1.28.1 默认 --without-openssl 无该硬依赖"
    - "CMakeLists 用 XAPIAN_INCLUDE_DIR/CURSES_LIBRARIES/SQLite3_LIBRARIES 等大写变量，conan CMakeDeps 生成小写变量不匹配 → generate() 用 CMakeToolchain.variables 显式注入绝对路径库（ncview vendored 静态 + XXX_LIBS 手法）"
    - "无头冒烟只用纯 IO 退出路径：nmail -v/--version、-h/--help 在参数解析阶段直接 return 0，不启动 TUI"
  common_dependencies:
    - ncurses
    - openssl
    - xapian-core
    - sqlite3
    - cyrus-sasl
    - libmagic
    - uuid
    - curl
    - expat
    - zlib

versions:
  "5.14.12":
    status: built
    build_date: "2026-09-11"
    conan_ref: "nmail/5.14.12"
