version: "0.52"
software: "netris"
status: built
build_date: "2026-09-08"
build_system: custom

source:
  url: "https://deb.debian.org/debian/pool/main/n/netris/netris_0.52.orig.tar.gz"
  sha256: "8bc770ebb2c3ead1611ca7a1a2f3d833e169536c78d53b3fcf49381164ee9706"
  tar_format: tar.gz

build:
  system: custom
  configure_options: []
  dependencies:
    - "ncurses/6.6"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "netris 0.52 uses a custom Configure script (not autoconf); Configure uses sed s/-VAR-/ with bare substitution, so paths containing '/' break it"
  - "Makefile patching via replace_in_file is required to inject ncurses include/lib paths after Configure"
  - "ncurses/6.6 is the only runtime dependency; link with -lncursesw via -L<ncurses_prefix>/lib"
  - "No upstream test suite (no tests/ directory, no make check target); verification via netris -h"
