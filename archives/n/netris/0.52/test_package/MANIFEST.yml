# test_package/MANIFEST.yml — netris 0.52
# R34/R51: test_package must exercise the binary

package: netris/0.52
homepage: "https://www.netris.org"

# 上游测试: netris 0.52 没有正式测试套件 (无 Makefile check target, 无 tests/ 目录)
upstream_check_command: "make check  # Netris 0.52 does not define a check target"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
# R51 上游测试三步法:
# 1. 清点: netris 0.52 无 tests/ 目录, Makefile 无 check target, 无 ctest/pytest 注册
# 2. 实测: make check 返回 "No rule to make target 'check'" (exit 2)
# 3. 结论: 上游确实无正式测试 (仅 sr.c 示例机器人协议)

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "运行 netris -h 验证二进制可执行 + 版本串校验 + sr 存在性"
    command: 'netris -h'

# 测试断言: 2 (netris -h 返回 0 + 版本串 "Netris version 0.52")
assertion_count: 2
