# 软件级 manifest — ngt
# 文件位置: archives/n/ngt/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: ngt
display: "NGT (Neighborhood Graph and Tree)"
description: "高近似率最近邻（ANN）搜索 C++ 库与命令行工具（Yahoo Japan 出品）：支持 ANNG/ONNG/森林图索引构建与检索，附 C/C++ API 与 ngt/qbg 命令行"
category: library
homepage: "https://github.com/NGT-labs/NGT"
license: "Apache-2.0"

build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake + C++17；CMAKE_SYSTEM_NAME 覆盖为 Linux（E092：CMake 不识别 HarmonyOS/OHOS 为 UNIX，NGT 整树构建都在 if(UNIX) 内）"
    - "OpenMP 由 OHOS SDK clang 提供（-fopenmp=libomp），运行时依赖 ohpcd libomp/15.0.4；QBG(NGTQ) 需 BLAS/LAPACK，用 openblas/0.3.34 提供 sgemm_/dgemm_ 符号"
    - "NGT CMake 用裸名 -llapack/-lblas 链系统库且无条件链 -lstdc++fs（GCC 专属）→ 补丁改用 find_package(BLAS/LAPACK) 结果 + 仅 GNU 链 stdc++fs"
    - "MmapManager::getErrorStr 的 strerror_r 需兼容 POSIX(int) 变体（OHOS libc），补丁忽略返回值"
    - "OHOS HMDFS/conan 子进程无法创建符号链接（shell 可）：NGT 共享库去 VERSION/SOVERSION 出无版本 libngt.so（loader 亦拒绝经符号链接加载 .so，E316）"
    - "命令产物 bin/ngt + bin/qbg（工具）；库 libngt.so/libngt.a"
  common_dependencies:
    - "openblas/0.3.34"
    - "libomp/15.0.4"

versions:
  "2.8.0":
    status: published
    build_date: "2026-09-04"
