# test_package/MANIFEST.yml — ngt 2.8.0
# 上游测试清点 (R51，2026-09-04 对上游 v2.8.0 tarball 复核)：
#   - NGT v2.8.0 顶层 CMakeLists.txt 未 enable_testing()、未 add_subdirectory(tests)、
#     无 BUILD_TESTS/NGT_TEST CMake option，无 make check 目标（实测 ctest -N = 0 tests）。
#   - tests/ 目录仅含基准数据集与结果图片（ann-benchmarks-results/*.png、
#     datasets/ann-benchmarks/），无可运行测试程序。
#   - python/ 子目录仅 ngtpy 绑定源码（setup.py/ngtpy.cpp），无 pytest/unittest 用例。
#   - samples/ 为示例程序（cosine-float、l2-uint8、hamming-uint8 等），随构建生成但
#     非测试目标（无断言、无 ctest 注册）。
#   - 功能验证改由 test_package 消费侧测试矩阵完成（R34）：真实调用 NGT C++ API。

package: ngt/2.8.0
homepage: "https://github.com/NGT-labs/NGT"

# 上游没有 ctest/make check 测试目标（实测 ctest -N = 0 tests）
upstream_check_command: "ctest -N   # (built tree) No tests were found"
upstream_test_in_build: false
upstream_test_command: ""

# 上游 tests/ 目录内容（仅基准数据，无可运行测试）
upstream_tests:
  - file: tests/ann-benchmarks-results/
    description: "上游 ann-benchmarks 基准结果图片（*.png，非测试程序）"
    command: ""
  - file: tests/datasets/ann-benchmarks/
    description: "上游基准数据集（tsv，仅数据非测试）"
    command: ""

# test_package 消费侧实质测试矩阵 (R34)：每个二进制真实调用被测包 C++ API，
# 确定性数据、自查询断言（exact self match），任一断言失败非零退出并输出 FAIL。
test_package_tests:
  - file: test.cpp
    description: >-
      基线：200×16 float/L2 ANNG 建索引→save→重新 open→前 5 条自查询，
      断言 top-1 即查询自身（id 匹配 + distance≈0）。
    command: "./test_ngt"
    assertion_count: 11
  - file: test_distance.cpp
    description: >-
      距离类型矩阵：float 对象分别以 L1/L2/Angle/Cosine 建独立小索引（120×8），
      重开读回 distanceType/dimension 并自查询验证。4 场景×(属性 2+3 查询×2)。
    command: "./test_distance"
    assertion_count: 32
  - file: test_objecttype.cpp
    description: >-
      对象类型矩阵：Float(L2)/Uint8(L2)/Uint8(Hamming) 各建 120×16 索引，
      append 模板/查询按 uint8 与 float 两种类型真实执行，重开读回 objectType 并自查询。
      3 场景×(属性 2+3 查询×2)。
    command: "./test_objecttype"
    assertion_count: 24
  - file: test_graph.cpp
    description: >-
      图类型矩阵：通过 Property.graphType 分别构造 ANNG/ONNG/IANNG（float/L2，
      120×8 与 100×8），save 后重开读回 graphType 并自查询验证可检索性。
      3 场景×(graphType+dim 读回 2+3 查询×2)。
    command: "./test_graph"
    assertion_count: 24
  - file: test_persist.cpp
    description: >-
      持久化一致性：100×12 float/L2 索引 save 后经 4 个会话（rw/ro 交替）重开，
      每会话校验对象数=N 且自查询 exact match。4 会话×(count 1+2 查询×2)+build count。
    command: "./test_persist"
    assertion_count: 21
  - file: test_crud.cpp
    description: >-
      CRUD：100 对象建索引后 remove(id 50/20)→save→重开对象数减 2；被删向量查询
      top-1 不再 distance≈0；保留向量仍 exact match；再 remove(id 90) 递增验证。
    command: "./test_crud"
    assertion_count: 15
  - file: test_batch.cpp
    description: >-
      批量查询：同一索引会话内批量执行 8 条 SearchQuery 查询 + 4 条经
      allocateObject()/SearchContainer/deleteObject() 低层路径的查询，逐条断言
      top-1 即查询自身。8×2 + 4×2。
    command: "./test_batch"
    assertion_count: 24
  - file: test_property.cpp
    description: >-
      getProperty/setProperty 往返一致性：float/L2/ANNG 与 uint8/Hamming 两类索引
      重开后读回 dimension/objectType/distanceType/graphType，并将读回属性经
      setProperty 写回后再 getProperty 校验不变。
    command: "./test_property"
    assertion_count: 11
  - file: test_errors.cpp
    description: >-
      异常/边界路径：open 不存在索引、open 非索引路径、dimension=0 create、
      维度不匹配 append、不支持类型 SearchQuery 均必须抛 NGT::Exception。
    command: "./test_errors"
    assertion_count: 5

# 断言总数 = 11+32+24+24+21+15+24+11+5 = 167（原 test_ngt 单场景 11 条）
assertion_count: 167
