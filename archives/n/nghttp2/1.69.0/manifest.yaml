software: nghttp2
version: "1.69.0"
status: built
build_date: "2026-08-07"
build_system: cmake

source:
  url: "https://github.com/nghttp2/nghttp2/releases/download/v1.69.0/nghttp2-1.69.0.tar.gz"
  sha256: "c866b7477cbb7512ab6863a685027adbb1bb8da8fc3bab7429ed43d3281d5aa9"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DENABLE_LIB_ONLY=OFF"
    - "-DENABLE_APP=ON"
    - "-DENABLE_HPACK_TOOLS=ON"
  dependencies:
    - zlib/1.3.2
    - openssl/3.5.6.1.1
    - libev/4.33
    - jansson/2.15.1.1
    - c-ares/1.34.6
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-src-http2.h.patch"
  - "0003-src-http3.h.patch"
  - "0004-src-shrpx_log.h.patch"
  - "0005-src-template.h.patch"
  - "0006-src-util.h.patch"

knowledge_gained:
  - "OHOS libc++ (LLVM 15) has partial C++20 ranges support: begin/end/size/concepts work but algorithms (copy/fill/find/sort/distance/next etc.) do not"
  - "ranges_compat.h provides 30+ missing std::ranges algorithms and std::views (take/drop/transform) and std::source_location"
  - "std::span cannot be constructed from std::string_view on OHOS libc++ — must use explicit data()/size()"
  - "std::string_view does not support <=> operator on OHOS libc++"
  - "std::source_location header not available on OHOS libc++"

notes: |
  Full build: libnghttp2 + applications (nghttp, nghttpd, nghttpx, h2load) + HPACK tools (inflatehd, deflatehd).
  Created ranges_compat.h compatibility header providing 30+ missing C++20 std::ranges algorithms.
  Dependencies resolved via Conan ohpcd repo: zlib, openssl, libev, jansson, c-ares.
