software: nghttp2
version: "1.69.0"
status: built
build_date: "2026-04-30"

source:
  url: "https://github.com/nghttp2/nghttp2/releases/download/v1.69.0/nghttp2-1.69.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DENABLE_LIB_ONLY=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"

knowledge_gained:
  - "config.guess 需添加 HarmonyOS 识别（aarch64:HarmonyOS:*:*)"
  - "应用程序需要 C++20 std::ranges，鸿蒙 libc++ 不完全支持"

# 编译说明
notes: |
  只编译了库（libnghttp2），未编译应用程序。
  原因：应用程序需要 C++20 std::ranges 支持，鸿蒙 libc++ 不完全支持。
  
  使用 CMake 构建，配置选项：
  -DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX
  -DENABLE_LIB_ONLY=ON
