software: nvm
display: "nvm — Node Version Manager"
description: "Node Version Manager - Simple bash script to manage multiple active node.js versions"
category: language
homepage: "https://github.com/nvm-sh/nvm"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Pure shell script project, no C/C++ compilation"
    - "nvm.sh is a POSIX-compliant function (sourced, not executed)"
    - "Uses urchin test framework with 297 registered tests"
    - "No patches needed — nvm.sh has built-in platform detection"
  common_dependencies:
    - bash (preinstalled)
    - curl or wget (for downloading Node.js versions)

versions:
  "0.40.6":
    status: built
    build_date: "2026-09-14"
    source_url: "https://github.com/nvm-sh/nvm/archive/refs/tags/v0.40.6.tar.gz"
