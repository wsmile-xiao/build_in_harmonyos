software: nu
display: "Nu"
description: "Nu 编程语言（programming-nu）：基于 Objective-C 的 Lisp 方言解释器，提供 nush 交互式 shell"
category: development
homepage: "https://github.com/programming-nu/nu"
license: Apache-2.0
build_system: make + nuke 引导（Objective-C/GNUstep，无 autotools）

ohos_adaptation:
  key_points:
    - "Objective-C/GNUstep 项目，make + nuke 自举引导（Nu 用自身实现 boot 引导），无 autotools configure"
    - "native ObjC 异常需 -fobjc-exceptions -fexceptions -fblocks；OHOS SDK libunwind.a/libc++_shared.so 完整提供 _Unwind_*（历史 Block A 误判已推翻）"
    - "gnustep-base --disable-icu 缺 NSRegularExpression 实现，以 POSIX regex（regcomp/regexec）实现自包含 NuRegex/NuRegexMatch 绕过（历史 Block B）"
    - "ffi closure 作为 ObjC IMP 被非变参 objc_msgSend 调用会 SIGSEGV：NuBridge 改用 ffi_closure_alloc，比较操作符走 nu_calling_objc_method_handler"
    - "R38: 命令行工具（nush + share/libNu 标准库），软件级 commands.json 已声明"
  common_dependencies:
    - gnustep-base
    - libobjc2
    - libffi
    - readline
    - ncurses
    - curl

versions:
  "2.3.0":
    status: built
    build_date: "2026-09-07"
    conan_ref: "nu/2.3.0"
