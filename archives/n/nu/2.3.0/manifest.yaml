  system: makefile
  configure_options: []
  dependencies:
  - gnustep-base/1.31.1
  - libobjc2/2.2.1
  - libffi/3.5.2
  - readline/8.3
  - ncurses/6.6
  - curl/8.15.0
  cc: clang
  cxx: clang++
