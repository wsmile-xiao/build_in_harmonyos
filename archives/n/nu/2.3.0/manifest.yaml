  url: https://github.com/programming-nu/nu/archive/refs/tags/v2.3.0.tar.gz
  sha256: 1a6839c1f45aff10797dd4ce5498edaf2f04c415b3c28cd06a7e0697d6133342
  tar_format: tar.gz
