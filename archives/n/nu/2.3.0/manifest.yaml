knowledge_gained:
- 历史 Block A（OHOS 缺 _Unwind_Resume）被推翻：OHOS SDK libunwind.a / libc++_shared.so 完整提供
  _Unwind_*；native ObjC 异常在加 -fobjc-exceptions 后完全可用（实测 @try/@catch、Nu try/break/continue
  全部工作）
- 历史 Block B（NSRegularExpression 缺失）被绕过：gnustep-base 以 --disable-icu 构建确实缺实现，但 OHOS
  libc 提供 POSIX regex，(regcomp/regexec) 实现自包含 NuRegex/NuRegexMatch 后 Nu 正则功能完整可用
- OHOS/libobjc2 上 ffi closure 作为 ObjC IMP 被非变参 objc_msgSend 调用会 SIGSEGV：NuBridge 改用
  ffi_closure_alloc，比较操作符走 nu_calling_objc_method_handler（Nu 方法从 block table 直接执行）
- ohpcd gnustep-base 的 [NSException raise:format:] 不触发 ObjC 异常：新增 nu_raise()（@throw
  + exceptionWithName）并全局替换 45 处调用点
- '测试框架 inheritedByClass: 回调在类注册期调用 Nu 方法（ffi closure 时机）崩溃：test.nu runAllTests 改为按
  ''Test'' 前缀扫描；NSLog 在 OHOS gnustep-base 有格式化问题，改用 puts'
