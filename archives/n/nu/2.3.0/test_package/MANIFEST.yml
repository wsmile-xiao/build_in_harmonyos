# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nu/2.3.0
homepage: "https://github.com/programming-nu/nu"

# 上游测试命令: Nu 使用自举工具 nutest (tools/nutest)，逐文件运行 test/test_*.nu
upstream_check_command: "./nush tools/nutest test/test_*.nu"

# conanfile.py build() 中未集成上游测试（测试在本地验证阶段执行，test_package 做消费者验证）
upstream_test_in_build: false
upstream_test_command: "./nush-full tools/nutest test/test_*.nu"

# 上游实际运行的测试程序（47 个 test_*.nu 文件，通过 nutest 框架）
upstream_tests:
  - file: test/test_numbers.nu
    source: nu-2.3.0/test/test_numbers.nu
    description: "NSNumber 扩展测试 (times/downTo/upTo)"
    command: "./nush tools/nutest test/test_numbers.nu"
  - file: test/test_control.nu
    source: nu-2.3.0/test/test_control.nu
    description: "控制结构测试 (loop/for/break/continue/cond)"
    command: "./nush tools/nutest test/test_control.nu"
  - file: test/test_regex.nu
    source: nu-2.3.0/test/test_regex.nu
    description: "正则表达式测试 (POSIX-regex 适配版 NuRegex)"
    command: "./nush tools/nutest test/test_regex.nu"
  - file: test/test_array.nu
    source: nu-2.3.0/test/test_array.nu
    description: "NSArray 扩展测试 (each/sort/indexing)"
    command: "./nush tools/nutest test/test_array.nu"

# test_package 中自带的测试（消费者视角验证，见 conanfile.py test() 方法）
test_package_tests:
  - file: conanfile.py
    description: "消费者验证: 运行 nush 执行算术/控制流/异常/正则/列表 5 类断言"
    command: "python3 conanfile.py (conan test)"
  - file: test_smoke.sh
    description: "鸿蒙特有测试: OHOS 平台识别 (uname) + Nu-ObjC 桥接 (NSProcessInfo) 2 项"
    command: "bash test_smoke.sh <nush路径> <libNu路径>"

# 测试断言总数 (近似值；上游 47 文件 260+ 测试方法；test_package 含 7 组核心断言含 2 项鸿蒙特有)
assertion_count: 267
