software: normalize
display: "normalize"
description: "音频音量电平归一化命令行工具"
category: utility
homepage: "https://savannah.nongnu.org/projects/normalize/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "2005 版 config.guess 需补 aarch64:HarmonyOS 识别（输出 aarch64-unknown-linux-gnu，保持 native 非 cross 构建）"
    - "config.status 临时目录 umask 077->000（HMDFS 属主不同导致 Permission denied）"
    - "静态 libaudiofile.a 含 C++ 对象，LIBS 末尾追加 -lc++"
    - "AM_PATH_AUDIOFILE 宏需 audiofile-config 脚本，配方生成私有 shim 注入"
  common_dependencies:
    - audiofile

versions:
  "0.7.7":
    status: built
    build_date: "2026-09-03"
    conan_ref: "normalize/0.7.7"
    source_url: "https://deb.debian.org/debian/pool/main/n/normalize-audio/normalize-audio_0.7.7.orig.tar.gz"
