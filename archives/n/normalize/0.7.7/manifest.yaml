# 版本级 manifest
# 文件位置: archives/n/normalize/0.7.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "0.7.7"
software: normalize

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian pool 权威镜像，上游 SourceForge 下载不可达）
  url: "https://deb.debian.org/debian/pool/main/n/normalize-audio/normalize-audio_0.7.7.orig.tar.gz"
  sha256: "6055a2abccc64296e1c38f9652f2056d3a3c096538e164b8b9526e10b486b3d8"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=<DEFAULT_PREFIX>"
    - "LIBS=-lc++（audiofile 静态库含 C++ 对象）"
    - "PATH+audiofile-config shim / AUDIOFILE_CONFIG（AM_PATH_AUDIOFILE 宏）"
  dependencies:
    - audiofile/0.3.6
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "config.guess 需补 aarch64:HarmonyOS / aarch64:Linux 分支，保持 native 构建避免字节序/类型长度误判"
  - "autotools configure config.status 临时目录 umask 077 在 HMDFS 报 Permission denied，需 umask 000"
  - "静态库含 C++ 目标时，C 链接驱动需在 LIBS 末尾追加 -lc++（LDFLAGS 位置太靠前无效）"
  - "老式 AM_PATH_AUDIOFILE 宏只认 audiofile-config 脚本，conan 依赖包未携带时需生成 shim 注入 PATH/AUDIOFILE_CONFIG"

# 测试摘要
tests:
  upstream_make_check: "3/3 passed (test8bit.sh, test16bit.sh, test24bit.sh); test-tools SKIP (外部工具缺失)"
  test_package: "normalize --version + 16-bit PCM WAV 测量/就地归一化 功能测试通过"
