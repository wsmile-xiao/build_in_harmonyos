# conandata.yml — normalize 0.7.7
# 上游源码: Debian pool 的 orig tarball（上游官方托管 SourceForge 不可达，
# Debian pool 为权威镜像源，R39 合规）

sources:
  "0.7.7":
    url: "https://deb.debian.org/debian/pool/main/n/normalize-audio/normalize-audio_0.7.7.orig.tar.gz"
    sha256: "6055a2abccc64296e1c38f9652f2056d3a3c096538e164b8b9526e10b486b3d8"

patches:
  "0.7.7":
    - patch_file: "patches/0001-config-config.guess.patch"
      patch_type: "portability"
      patch_source: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos"
      patch_description: |
        The bundled 2005-era config.guess does not recognise the OHOS platform
        (uname -s returns "HarmonyOS"). Add aarch64:HarmonyOS:*:* (and
        aarch64:Linux:*:*) cases that emit aarch64-unknown-linux-gnu, keeping
        configure in native (non-cross) mode so endianness/type sizes are
        measured instead of guessed.
    - patch_file: "patches/0002-configure.patch"
      patch_type: "portability"
      patch_source: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos"
      patch_description: |
        configure's config.status creates its scratch dir with `umask 077`;
        on HMDFS that dir is owned by a different uid and becomes unwritable
        for the build user ("Permission denied" writing confstatXXXXXX/out).
        Change umask 077 to 000 for the tmp dir creation.
