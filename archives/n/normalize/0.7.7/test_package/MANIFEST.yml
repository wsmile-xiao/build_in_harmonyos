# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: normalize/0.7.7
homepage: "https://savannah.nongnu.org/projects/normalize/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（src/mktestwav 生成 wav 后由 bin/normalize 处理）
upstream_tests:
  - file: test/test8bit.sh
    source: normalize-0.7.7/test/test8bit.sh
    description: "8-bit mono/stereo WAV volume measure + in-place normalize (md5-verified)"
    command: "./test8bit.sh"
  - file: test/test16bit.sh
    source: normalize-0.7.7/test/test16bit.sh
    description: "16-bit mono/stereo WAV volume measure + in-place normalize (md5-verified)"
    command: "./test16bit.sh"
  - file: test/test24bit.sh
    source: normalize-0.7.7/test/test24bit.sh
    description: "24-bit mono/stereo WAV volume measure + in-place normalize (md5-verified)"
    command: "./test24bit.sh"
  - file: test/test-tools
    source: normalize-0.7.7/test/test-tools
    description: "Helper-tool chain tests (madplay/lame/flac/oggenc); SKIP when helpers absent"
    command: "./test-tools"

# test_package 中自带的测试 (消费者视角验证；实质运行 normalize 二进制)
# smoke_test.py 为独立测试源文件（满足 CI L0c 门禁），由 conanfile.py test() 调用
test_package_tests:
  - file: smoke_test.py
    description: |
      Consumer test source: synthesises a 16-bit PCM WAV with Python stdlib
      `wave`, then runs the packaged binary — `normalize --version`, measure
      with `normalize -qn` and in-place adjust with `normalize -q`
      (R34 — real invocation of the binary; CI L0c source-file gate).
    command: "normalize --version / normalize -qn <wav> / normalize -q <wav> (via smoke_test.py)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
