software: nopoll
display: "noPoll"
description: "noPoll WebSocket toolkit — C 语言 WebSocket 库（RFC 6455，客户端+服务端，TLS 支持）"
category: network
homepage: "https://www.aspl.es/nopoll"
license:
  - LGPL-2.1
build_system: autotools
ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需加 HarmonyOS 三元组（2022-01 版脚本）"
    - "configure umask 077 需重定向 TMPDIR（HMDFS）"
    - "上游测试证书 2023 过期 + openssl 3.5 seclevel=2 拒 1024 位——需重生成 4096 位证书"
    - "上游 issue #56：非 TLS accept socket 阻塞——补丁修复"
  common_dependencies:
    - "openssl"
versions:
  "0.4.9.b462":
    status: built
    build_date: "2026-09-14"
    conan_ref: "nopoll/0.4.9.b462"
