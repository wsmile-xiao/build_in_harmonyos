# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nopoll/0.4.9.b462
homepage: "https://www.aspl.es/nopoll"

# 上游测试命令 (用于分析)
upstream_check_command: "cd test && ./nopoll-regression-listener & ./nopoll-regression-client"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "test/nopoll-regression-client (48 test blocks, requires listener + refreshed certs)"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/nopoll-regression-client.c
    source: test/nopoll-regression-client.c
    description: "回归客户端 48 个测试块（strings/base64/masking/握手/echo/IPv6/流式/TLS 各版本/cookie/半包/超时等），依赖 nopoll-regression-listener 提供本地回显服务"
    command: "./nopoll-regression-client"
  - file: test/nopoll-regression-listener.c
    source: test/nopoll-regression-listener.c
    description: "配套常驻 listener（端口 1234-1240，含 TLS），client 测试的服务端对端"
    command: "./nopoll-regression-listener"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：进程内 listener+client 回环 websocket echo（ctx_new/listener_new/conn_new/send_text/get_msg 全链路）"
    command: "./test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
