# 编译中学到的知识
knowledge_gained:
  - "config.guess/config.sub 2022-01 版加 HarmonyOS 三元组（*:HarmonyOS:* 与 ohos-linux case）"
  - "configure 的 umask 077 + ./confXXXXXX 在 HMDFS 失败，重定向到 ${TMPDIR:-/tmp}"
  - "上游 update-def 目标假设 DLL 构建（读 .libs/libnopoll.exp），纯静态构建需容错"
  - "上游测试证书 test-certificate.crt 2013 签发 2023-03 过期；上游 master 也未更新（自 2013 无证书提交）"
  - "conan openssl/3.5.6 默认 security level=2，拒绝上游 1024 位 SHA1 证书（SSL_CTX_use_certificate:ee key too small）；需按上游 gen-certificates-test-21.sh 脚本思路重生成 4096 位证书"
  - "上游 issue #56：非 TLS accept 的 socket 默认阻塞，单个慢连接可卡死 listener 单线程循环；补丁将非阻塞设置移出 TLS 分支"
  - "regression client 的 48 测试块中 test_26 依赖外网 echo.websocket.org（现返回 301，服务已变更），环境限制豁免"
  - "测试建议分段跑（listener 长跑大量连接后 select 循环健壮性下降），head(01-22)+tail(23-36) 两段对同一 listener 均全绿"

