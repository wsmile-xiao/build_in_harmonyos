# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: npush/0.7
homepage: "https://npush.sourceforge.net/"

# npush 上游无任何测试套件（源码包只有单文件 npush.cpp + levels 数据；
# Makefile 无 check 目标，readme/CHANGES 无测试说明）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 功能性测试：pty 中启动游戏 → 渲染主菜单 → Down Down Enter
# 选择 Quit → 干净退出(exit 0)。真实调用被测二进制 + ncurses 依赖。
test_package_tests:
  - file: functional_test.py
    description: "pty 内启动 npush，验证主菜单渲染并可正常退出（R34 实质调用）"
    command: "python3 functional_test.py <bin/npush>"

assertion_count: 3
