software: nethack
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "5.0.0"

# 编译状态: published | built | failed | archived
status: built

# 编译日期 (YYYY-MM-DD)
build_date: "2026-09-12"

# Conan 引用
conan_ref: "nethack/5.0.0"

# 源码信息
source:
  url: "https://www.nethack.org/download/5.0.0/nethack-500-src.tgz"
  sha256: "2959b7886aac76185b90aea0c9f80d14343f604de0ae96b3dd2a760f7ab3bde9"
  tar_format: tgz

# 构建配置
build:
  system: makefile
  configure_options: []
  dependencies:
    - "ncurses/6.6"
    - "lua/5.4.8"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "NetHack 5.0 使用 sys/unix/setup.sh + hints/*.500 生成 Makefile，纯 make 构建，无 configure"
  - "5.0 hints 为模块化结构（#-PRE/#-INCLUDE/#-POST），配方复用 linux.500 并追加 OHOS conan 覆盖，而非 3.6.7 式全手写 hints"
  - "tty + curses 窗口需在 multiw-2.500 求值前强制 WANT_WIN_TTY/WANT_WIN_CURSES，make 命令行再传一次双保险"
  - "5.0 必需 Lua 5.4.8（Makefile.top LUA_VERSION），用仓库 lua/5.4.8 作 system Lua，LUATOPLIB 置空跳过内嵌构建与 make fetch-lua 网络下载"
  - "tty 窗口依赖 ncurses，OHOS 上链接仓库自带的 ncurses/6.6（ncursesw 宽字符静态库）"
  - "上游 make install 不支持 DESTDIR 且会 rm -rf HACKDIR，改为手动打包"
  - "上游 test/ 9 个 Lua 文件为 wizmode 手工用例（需 DLB 关闭 + 安装 + wizloadlua 交互），无自动化 harness；默认构建无 make check/ctest 目标"
