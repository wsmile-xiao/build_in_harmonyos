knowledge_gained:
  - nginx configure 不是标准 autotools，是自定义脚本
  - nginx 可正确识别 HarmonyOS HongMeng Kernel 1.12.0 aarch64 平台
  - nginx 使用系统 zlib 库，无需额外配置
  - nginx 支持 DESTDIR 模式，make install DESTDIR=$TEST_PREFIX 正常工作
  - 编译选项：--without-http_rewrite_module 可禁用 PCRE 依赖，简化编译
