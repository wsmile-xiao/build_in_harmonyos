software: newsraft
display: "newsraft"
description: "Lightweight terminal RSS/Atom feed reader"
category: news
homepage: "https://codeberg.org/newsraft/newsraft"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 POSIX makefile，无 autoconf；通过 Conan 显式注入依赖路径"
    - "TUI 使用内嵌 termbox2 header-only 实现，无 ncurses/stfl 依赖"
    - "run-check.sh 传递 AUXCFLAGS/LDFLAGS，支持 OHOS 无头测试"
  common_dependencies:
    - libcurl
    - expat
    - sqlite3
    - gumbo-parser

versions:
  "0.37":
    status: built
    build_date: "2026-09-10"
