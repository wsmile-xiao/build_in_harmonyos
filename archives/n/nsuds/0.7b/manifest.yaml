# 版本级 manifest — nsuds 0.7b（上游 0.7B）
# 版本号按 Conan 2 全小写引用约束归一化 0.7B → 0.7b；二进制仍输出 0.7B。

version: "0.7b"
software: "nsuds"

# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://codeload.github.com/jubalh/nsuds/tar.gz/003eecf94a274f015e18764669dc8ee6c966f678"
  sha256: "000b16bb332c63d99c985df309c033e8cd57b67d5f1aeb27e0434e20f4429866"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  configure_options:
    - --prefix=/
    - --disable-setgid
  dependencies:
    - ncurses/6.6
  tool_requires:
    - automake/1.18
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-remove-chgrp-install-hooks.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "Conan 2 recipe ref 必须全小写：上游 0.7B 需归一化为 0.7b（source URL 不变，二进制内 VERSION 宏仍来自 configure.ac）"
  - "codeload.github.com/<sha> 无归档扩展名，conan get() 需显式 filename='<name>.tar.gz' 否则按 zip 解压报 BadZipFile"
  - "老 ANSI-C 项目头文件 tentative definition + clang≥11 默认 -fno-common → duplicate symbol：编译加 -fcommon"
  - "autotools git 快照无 configure：tool_requires automake/1.18 + autoreconf --install 自举（OHOS 基础镜像无 automake，E178）"
  - "E114：HMDFS 下 configure/config.status 的 umask 077+mktemp 产生不可写目录，须 sed 将 umask 077 改 000 后再 configure"
  - "OHOS toybox 无 chgrp/games 组：Makefile.am install-*hook 无条件 chgrp 会使 make install 失败，需 patch 移除（并 --disable-setgid）"
  - "R26：ncurses 6.6 widec 静态包仅 libncursesw.a，configure 探测 -lncurses 失败；build 私有 libncurses.a→libncursesw.a 别名（不动系统库）"
