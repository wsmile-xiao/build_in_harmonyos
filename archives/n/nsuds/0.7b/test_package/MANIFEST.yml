# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: nsuds/0.7b
homepage: "https://github.com/jubalh/nsuds"

# nsuds upstream ships no test suite: no TESTS in Makefile.am, no tests/
# directory in the source tree, and `make check` is a no-op.  Version was
# confirmed via `make check` (exit 0, "Nothing to be done for 'check-am'").
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游无任何测试程序（无单元/集成测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证): 运行打包后的 nsuds 二进制
# 的非交互 CLI 路径并断言真实输出内容（R34/PF3，非空壳）。
test_package_tests:
  - file: test.sh
    description: "nsuds --version/-v/--help/-h 真实执行并断言输出内容（版本号 0.7B、usage 文本）"
    command: "bash test.sh <bin/nsuds>"

assertion_count: 5
