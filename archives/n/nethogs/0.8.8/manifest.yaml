software: nethogs
version: "0.8.8"
status: built
build_date: "2026-08-18"
build_system: makefile

source:
  url: "https://github.com/raboof/nethogs/archive/refs/tags/v0.8.8.tar.gz"
  sha256: "111ade20cc545e8dfd7ce4e293bd6b31cd1678a989b6a730bd2fa2acc6254818"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "VERSION=0.8.8"
    - "NCURSES_LIBS=-lncursesw"
  dependencies:
    - libpcap/1.10.6
    - ncurses/6.5
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-MakeApp.mk.patch"
  - "0002-src-cui.cpp.patch"
  - "0003-src-conninode-test.cpp.patch"

knowledge_gained:
  - "rindex/index not available on HarmonyOS/musl, replace with strrchr/strchr"
  - "nethogs uses custom Makefile (MakeApp.mk) not autotools; ncurses must link -lncursesw"
  - "determineVersion.sh needs bash and git, override VERSION=0.8.8 for tarball builds"
  - "install command not available on HarmonyOS, use mkdir+cp instead"
  - "OHOS 构建容器不暴露可读真实 /proc/net（root 亦 fopen 返回 NULL），conninode_test 的 2 个真实 /proc/net 检查为平台不可跑，按上游 Apple/FreeBSD 模式以 __OHOS__ 守卫平台排除（不计入 discovered，仅 4 个 testfiles 样例检查真实运行）"
  - "upstream make test 运行 src/conninode_test（6 断言，4 个加载 testfiles/ 样例真实运行 + 2 个真实 /proc/net 平台排除），decpcap_test 需外部 pcap 文件不进 make test"