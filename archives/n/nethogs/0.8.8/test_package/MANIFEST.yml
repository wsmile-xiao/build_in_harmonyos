# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nethogs/0.8.8
homepage: "https://github.com/raboof/nethogs"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C src -f MakeApp.mk test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C src -f MakeApp.mk test VERSION=0.8.8 NCURSES_LIBS=-lncursesw"

# 上游实际运行的测试程序（make test 运行 src/conninode_test）：
# 上游共 6 个检查点：4 个加载 testfiles/ 下 /proc/net 样例（返回点 1/2/4/5）
# + 2 个加载真实系统 /proc/net/{tcp,udp}（返回点 3/6）。
# 在 OHOS 上，2 个真实 /proc/net 检查经 patch 0003 以 __OHOS__ 守卫排除
# （OHOS 构建容器不暴露 /proc/net，root 亦 fopen 返回 NULL），
# 本平台仅 4 个 testfiles 样例检查为可发现/可执行。
upstream_tests:
  - file: "src/conninode_test.cpp"
    source: "nethogs-0.8.8/src/conninode_test.cpp"
    description: "conninode 解析 /proc/net/tcp|udp 连接-进程 inode 映射；断言 addprocinfo 加载 4 个 testfiles 样例成功；2 个真实 /proc/net 检查为 OHOS 平台不可跑（patch 0003 以 __OHOS__ 守卫排除）。"
    command: "make -C src -f MakeApp.mk test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test.sh"
    description: "执行安装后的 nethogs 二进制：-V 输出版本 0.8.8，-h 输出 usage。"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 4 个 testfiles 样例检查 + test_package 2 个烟雾测试 = 6
assertion_count: 6