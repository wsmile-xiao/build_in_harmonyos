# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: netatalk/4.5.1
homepage: "https://netatalk.io"

# 上游测试命令（Meson 项目）
upstream_check_command: "meson test"

# 配方 build() 中已集成 meson test（含 afpd 集成测试与 byteorder 测试）
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_byteorder.c
    source: netatalk-4.5.1/test/test_byteorder.c
    description: "字节序单元测试（meson test 注册）"
    command: "meson test"
  - file: test/afpd/test.c
    source: netatalk-4.5.1/test/afpd/test.c
    description: "afpd 服务端集成测试 harness（TAP 输出，需 sqlite 后端）"
    command: "meson test"
  - file: test/afpd/subtests.c
    source: netatalk-4.5.1/test/afpd/subtests.c
    description: "afpd 集成测试子用例（配置/CNID/目录缓存/描述符/故障注入）"
    command: "meson test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 afpd/dbd/netatalk -V 验证守护进程与 CNID 工具版本字符串，检查 afppasswd 存在（cnid_dbd 仅 dbd 后端才构建，sqlite 配置下用常建的 dbd 替代）"
    command: "bash test.sh"
  - file: run_upstream.sh
    description: "缓存穿透的上游重跑：复刻 meson setup（TMPDIR 下 mktemp 卷/CNID 目录并生成 test.conf）与 run（配置键断言/文件往返/枚举/afpd -V）共 9 项断言，输出 HMBS_UPSTREAM_TEST_RESULT"
    command: "sh run_upstream.sh"

# 测试断言总数 (近似值)
assertion_count: 13
