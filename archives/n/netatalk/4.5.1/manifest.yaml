software: netatalk
version: "4.5.1"
status: built
build_date: "2026-09-09"
build_system: meson

source:
  url: "https://github.com/Netatalk/netatalk/releases/download/netatalk-4-5-1/netatalk-4.5.1.tar.xz"
  sha256: "f091de10b0c40996ebf7d6502cf947cfd87dfe1a7e62f9d96013225573938524"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dwith-cnid-backends=sqlite"
    - "-Dwith-eventloop=libevent"
    - "-Dwith-tests=true"
    - "-Dwith-testsuite=false"
    - "-Dwith-docs=[]"
    - "-Dwith-init-style=none"
    - "-Dwith-acls=false"
    - "-Dwith-appletalk=false"
    - "-Dwith-cracklib=false"
    - "-Dwith-cups=false"
    - "-Dwith-dtrace=false"
    - "-Dwith-gssapi=false"
    - "-Dwith-kerberos=false"
    - "-Dwith-krbV-uam=false"
    - "-Dwith-ldap=false"
    - "-Dwith-pam=false"
    - "-Dwith-quota=false"
    - "-Dwith-tcp-wrappers=false"
    - "-Dwith-zeroconf=false"
    - "-Dwith-spotlight=false"
    - "-Dwith-shell-check=false"
    - "-Dwith-init-hooks=false"
    - "-Dwith-install-hooks=false"
    - "-Dwith-statedir-creation=false"
    - "-Dwith-rpath=false"
    - "-Dwrap_mode=nodownload"
  dependencies:
    - bstring/1.0.3
    - iniparser/4.2.6
    - libevent/2.1.12
    - libgcrypt/1.11.0
    - sqlite3/3.49.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Netatalk 4.x uses Meson (not Autotools); minimal OHOS config is sqlite CNID backend only"
  - "afpd integration tests require the sqlite backend and -Dwith-tests=true"
