version: "v0.1.1"
status: published
build_date: "2026-06-09"

source:
  url: "https://github.com/MayaPosch/NymphRPC/archive/refs/tags/v0.1.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - poco/1.15.3
  cc: clang
  cxx: clang++
  products:
    - type: library
      name: libnymphrpc.a
      path: usr/local/lib/libnymphrpc.a
    - type: library
      name: libnymphrpc.so.0.1
      path: usr/local/lib/libnymphrpc.so.0.1

patches_applied:
  - "0001-Makefile.patch"

knowledge_gained:
  - "HarmonyOS SDK libc++ 需要 ohos_fix.h 预包含头修复 nullptr_t 问题"
  - "需要移除 ~/usr/local/include/ 中的 musl 头文件干扰"
  - "C++17 标准是 HarmonyOS SDK libc++ 的最低要求"