software: nymphrpc
display: "NymphRPC"
description: "Lightweight C++ RPC library for microservices and distributed applications"
category: network
homepage: "https://github.com/MayaPosch/NymphRPC"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "需要 POCO C++ Libraries 依赖"
    - "HarmonyOS SDK libc++ 需要 ohos_fix.h 预包含头修复 nullptr_t 和 __promote 问题"
    - "必须移除 ~/usr/local/include/ 中的 musl 头文件干扰"
    - "需要升级到 C++17 标准"
  common_dependencies:
    - poco

versions:
  "v0.1.1":
    status: published
    build_date: "2026-06-09"
    published_as: nymphrpc