# ncurses 6.4 编译档案

software: ncurses
version: 6.4
status: success
build_system: autotools
compile_date: 2024-03-15

dependencies:
  required: []
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
    - --with-shared
    - --enable-widec
    - --enable-overwrite
  cflags: "-fPIC -O2"

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: 添加 HarmonyOS 系统检测
    lines_changed: 30

compatibility:
  level: high
  issues: []
  notes: |
    - 使用 --enable-overwrite 让头文件安装到顶层
    - readline 依赖 ncurses

test_results:
  type: manual
  note: "通过实际使用验证功能正常"

knowledge_gained:
  - "ncurses 使用 --enable-overwrite 简化头文件路径"
  - "readline 依赖 ncurses"

references:
  - title: ncurses 官方
    url: https://invisible-island.net/ncurses/

maintainer: OpenHarmony Community
tags: [ncurses, terminal, tui]