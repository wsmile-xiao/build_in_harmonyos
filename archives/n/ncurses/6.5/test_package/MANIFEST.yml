# ncurses/6.5 test_package
# Verifies ncurses headers and libraries are usable

package: ncurses/6.5
homepage: "https://www.gnu.org/software/ncurses"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - file: Makefile.in
    source: ncurses-6.5/Makefile.in
    description: "Top-level ncurses make check target validates generated headers and build metadata in the cross build tree."
    command: "make -j1 check"

test_package_tests:
  - file: test.c
    description: "验证 ncurses 头文件和链接"
    command: "./test_ncurses"

assertion_count: 1
