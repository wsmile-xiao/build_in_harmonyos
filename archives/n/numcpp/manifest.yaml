# 软件级 manifest — numcpp
# 文件位置: archives/n/numcpp/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: numcpp
display: "NumCpp"
description: "NumCpp — a templatized header-only C++17 implementation of the Python NumPy library"
category: library
homepage: "https://github.com/dpilger26/NumCpp"
license: MIT

# ============================================================
# 构建信息
# ============================================================

build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 header-only：include/ 下 544 个 .hpp，无编译/链接产物；package_type=header-library，package_id() clear"
    - "上游默认配置（NUMCPP_NO_USE_BOOST=OFF）下公共头会 include Boost.Math/DateTime/Random/Polynomial/Log 头；recipe requires boost/1.84.0（transitive_headers=True）并经 cpp_info.requires 把 boost::boost_headers 传播给每个消费者"
    - "nc::logger / nc::special 等 Boost 模块仅 include Boost 头即可编译链接；真正调用 nc::logger 输出时才需要 Boost.Log 编译库（ohpcd 生态暂无，属已知缺口；本机自建 Boost.Log 已跑通上游 gtest LoggerTests 5/5，MANIFEST/notes 如实记录）"
    - "上游官方测试为 Python/pytest（pybind11 绑定）：25 文件/748 定义/747 收集，已在 OHOS PC venv 全量真实运行（numpy 2.2.6：732 passed/12 上游 skip/3 平台差异豁免，逐条证据见 reports/pytest-failures-analysis.md）；默认 conan create/CI 只跑纯 C++ 子集（test/multiple build() 真实编译运行 + test_package 28 断言），不依赖 Python 科学栈"
    - "libc++ 需 -stdlib=libc++（conan toolchain 注入）；musl 无 pthread_setcancelstate，上游子集直接 clang++ 编译时注入 -DBOOST_SP_NO_PTHREAD_SETCANCELSTATE；pybind11 绑定编译在 OHOS libc++ 下有 signbit 未限定调用歧义，测试期一行适配（reports/upstream-test-binding-ohos.patch）"
  common_dependencies:
    - boost (header-only，经 cpp_info 传播)

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.16.1":
    status: built
    build_date: "2026-09-04"
