# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: numactl/2.0.18
homepage: "https://github.com/numactl/numactl"

# Upstream test command
upstream_check_command: "make check"

# Upstream tests are not integrated in build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (from test/ directory in source)
upstream_tests:
  - file: test/tbitmap.c
    source: numactl-2.0.18/test/tbitmap.c
    description: "Test bitmap data structure operations"
    command: "./test/tbitmap"
  - file: test/distance.c
    source: numactl-2.0.18/test/distance.c
    description: "Test NUMA distance query (requires NUMA hardware)"
    command: "./test/distance"
  - file: test/nodemap.c
    source: numactl-2.0.18/test/nodemap.c
    description: "Test NUMA node map (requires NUMA hardware)"
    command: "./test/nodemap"

# test_package consumer test
test_package_tests:
  - file: test.c
    description: "Verify libnuma is linkable and numa_available() is callable"
    command: "./test_numactl"

# Approximate assertion count
assertion_count: 3
