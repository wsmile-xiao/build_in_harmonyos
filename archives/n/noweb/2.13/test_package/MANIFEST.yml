# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: noweb/2.13
homepage: "https://www.cs.tufts.edu/~nr/noweb"

# 上游测试命令：noweb v2_13 官方 tarball 内没有 `make check`/regression 目标
# （顶层 test/regression 目录为空），上游发布说明也建议以功能使用为准，
# 因此这里用真实 .nw 文件跑 notangle/noweb/noweave/noroots/nodefs 作回归。
upstream_check_command: "make check (not provided upstream — test/regression empty)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游未随包提供独立测试程序）
upstream_tests:
  - file: demo.nw
    source: test_package/demo.nw
    description: "noweb 2.13 literate-program sample — named root chunk for noweb -t"
    command: "notangle -Rdemo.c demo.nw"
  - file: hello.nw
    source: test_package/hello.nw
    description: "noweb 2.13 literate-program sample — root chunk for notangle"
    command: "notangle hello.nw"

# test_package 中自带的测试 (消费者视角验证)
# 注意三级断言结构（与 reports/conan-create.log 中 conan 环境表现保持一致）：
#   1) C 核心断言 5 项（notangle/noweb -t/notangle -R + 2 个 --version）：
#      noweb 纯 tangle 管道为 C 实现（markup/nt/mnt），conan 环境内恒跑；
#   2) weave/xref 断言 3 项（noroots/noweave -t/nodefs）：依赖 GNU awk
#      （上游 INSTALL 要求），仅当 PATH 上存在 GNU awk 时才执行；
#   3) 鸿蒙化消费者端到端用例 1 项（build_consumer.sh + test.sh 运行段）：
#      notangle tangle hello.nw → 鸿蒙工具链 clang 编译 hello_ohos →
#      本机(OHOS)运行产物并断言输出 "hello noweb"（noweb 产出→鸿蒙构建→鸿蒙运行）。
# 因此断言总数 = 5（恒跑）+ 3（GNU awk 条件）+ 1（鸿蒙消费者）。本机 gawk+clang
# 全量 9/9 通过；conan create 环境无 GNU awk 时实际执行 C 核心 + 鸿蒙消费者子集。
test_package_tests:
  - file: test.sh
    description: >
      真实调用被测包：notangle/noweb tangling hello.nw|demo.nw 并断言输出包含
      main()/printf 内容（C 管道，恒跑）；noroots/noweave -t/nodefs 在检测到
      GNU awk 时追加执行（weave/xref 管道）；并运行 build_consumer.sh 产出的
      hello_ohos 断言鸿蒙消费者输出。断言数：5 恒跑 + 3 gawk 条件 + 1 鸿蒙消费者。
    command: "sh test.sh"
  - file: build_consumer.sh
    description: >
      鸿蒙化消费者端到端用例（编译侧）：notangle tangle hello.nw 生成 C 源码，
      用鸿蒙工具链 clang 编译为可执行 hello_ohos（aarch64/OHOS ELF），供
      test.sh 在本机运行断言。由 test_package/conanfile.py build() 以
      env=["conanrun","conanbuild"] 调用（conanrun 供被测 notangle、
      conanbuild 供鸿蒙 clang）。
    command: "sh build_consumer.sh"
    harmonyos_consumer: true

# 测试断言总数 (近似值, 用于质量评估)：
# 恒跑 5 项 + GNU awk 条件 3 项 + 鸿蒙消费者 1 项；
# 本机 gawk+clang 全量 9/9 通过
assertion_count: 9
