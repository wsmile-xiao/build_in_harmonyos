# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS/HarmonyOS-PC 上 strip 后的 ELF（去 .symtab/.codesign 元数据）无法执行（exec 报 EPERM/126）；Makefile 里 strip 步骤必须去掉，保留未裁剪二进制"
  - "OHOS 的 /tmp 为只读 erofs，libc tmpfile() 写 /tmp 失败；mnt/finduses 改用 $TMPDIR + mkstemp+unlink 匿名临时文件（新增 nw_tmpfile 辅助）"
  - "noweb 分发脚本引用 nawk，OHOS 无 nawk（有 awk=gawk）：按上游 INSTALL 用 awkname 把引用改为 awk"
  - "L2 smoke 门禁要求 bin 工具支持 --version/--help：为 noweb/notangle/noweave/nountangle/noroots/nodefs 等命令 wrapper 增加标准 --version/--help"
  - "noweb 2.13 官方 GitHub tag（test/regression 为空）不提供 make check/回归测试集；用真实 .nw 文件跑 notangle/noweb/noweave/noroots/nodefs 作功能回归"
  - "weave/index 管道依赖 GNU awk（INSTALL 说明）；纯 tangle（notangle/noweb -t）为 C 实现不依赖 awk"

