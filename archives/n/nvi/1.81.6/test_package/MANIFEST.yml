# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nvi/1.81.6
homepage: "https://sites.google.com/view/bostic-nvi"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# nvi 上游无独立测试套件（make check 无 TESTS，探索阶段实测 exit 0）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 实质运行 vi 二进制：vi -e -s + stdin ex 命令编辑临时文件并验证写回内容（R34）
test_package_tests:
  - file: test.sh
    description: "运行 nvi vi 二进制，ex 脚本模式执行 s/nvi/nvi-ok/ 替换并 wq 写回，验证文件内容包含 nvi-ok"
    command: "vi -e -s <file>（stdin 喂 ex 命令）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
