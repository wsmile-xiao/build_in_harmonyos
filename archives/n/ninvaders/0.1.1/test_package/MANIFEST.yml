# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: ninvaders/0.1.1
homepage: "https://ninvaders.sourceforge.net"

# 上游测试套件审计结论:
# ninvaders 0.1.1（SourceForge 发布包 ninvaders-0.1.1.tar.gz）为纯 C 的 ncurses
# 终端游戏，发布包仅含 12 个文件：6 个 .c 源文件、6 个 .h 头文件、Makefile、
# README、ChangeLog、gpl.txt。Makefile 仅定义 all / nInvaders / .c.o / clean
# 四个目标，无 check / test / TESTS / check_PROGRAMS 目标；发布包无 tests/ 或
# test/ 目录；上游仓库（ninvaders.sourceforge.net）无 CI 测试配置。
# 结论：上游确实没有任何自动化测试，status=no_tests 如实上报。
upstream_tests_exist: false
upstream_test_audit:
  - path: "Makefile"
    finding: "上游 Makefile 仅含 all / nInvaders / .c.o / clean 四个目标；grep 确认无 check、test、TESTS、check_PROGRAMS 等测试目标，make -n check 返回 'No rule to make target'。"
  - path: "发布包源码树（ninvaders-0.1.1.tar.gz，共 12 文件）"
    finding: "仅 globals/view/aliens/ufo/player/nInvaders 六个 .c + 六个 .h + Makefile + README + ChangeLog + gpl.txt；无 tests/ 目录、无自动化测试脚本、无 configure/meson 等可挂接测试的构建体系。游戏的交互行为无法在无终端环境自动断言，由 test_package 对安装产物做 CLI 契约验证（-help 路径输出 version+usage）。"

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "对安装产物 bin/nInvaders 做 CLI 契约验证：-help 调用真实执行二进制，断言 stderr 输出包含版本横幅 'nInvaders' 与 'Usage: nInvaders'，并接受上游约定的退出码 1（nInvaders 无 --version 参数，未知选项即打印帮助并退出 1）"
    command: "bash test.sh（由 test_package/conanfile.py test() 经 self.run 实际执行）"

assertion_count: 2