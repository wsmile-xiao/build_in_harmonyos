package: nanodbc/2.14.0
homepage: "https://github.com/nanodbc/nanodbc"

# 上游官方测试在源码树独立构建中真跑（ctest -R utility_tests；DB 型测试需
# TEST_NANODBC_CONNSTR 真数据库，OHOS PC 沙箱无 ODBC 数据源，环境排除如实
# 记录——见 notes.md 与 PR 统计表）。
upstream_test_in_build: false
upstream_test_command: "ctest -R utility_tests（源码树独立构建 + 0001 patch 同款注入，见 notes.md）"

test_package_tests:
  - file: test.cpp
    description: >-
      消费者离线冒烟（9 项断言）：connection 默认构造 connected()==false（幂等）+
      transactions()==0 + 未连接 disconnect() no-op；statement 默认构造
      connected()==false + reset() no-op；result 默认构造 operator bool==false；
      date/time/timestamp POD 哨兵构造；database_error 离线构造 what()。
      链接交付的 libnanodbc.a + include/nanodbc/nanodbc.h（-lodbc 由 CMakeDeps
      经 nanodbc 的 requires unixodbc 传导，消费者无需显式 find_package）；
      CI L1e 移走 lib/include 后重跑 conan test 必失败——真依赖被测包。
    command: "conan create（自动触发 test_package）"

assertion_count: 9
