version: "2.14.0"
software: nanodbc
status: built
build_date: "2026-10-02"
build_system: cmake

source:
  url: "https://github.com/nanodbc/nanodbc/archive/refs/tags/v2.14.0.tar.gz"
  sha256: "56228372042b689beccd96b0ac3476643ea85b3f57b3f23fb11ca4314e68b9a5"
  tar_format: tar.gz
  note: "上游 GitHub 官方 tag tarball（GitHub 由本仓库惯例接受；单 URL + sha256 校验通过）"

build:
  system: "CMake（顶层 CMakeLists.txt，库本体 + install 导出 nanodbc-config）"
  cmake_options:
    - "NANODBC_DISABLE_EXAMPLES=ON（禁示例程序，交付库本体）"
    - "NANODBC_DISABLE_TESTS=ON（禁上游测试目标；上游测试在源码树独立构建真跑，见下）"
    - "ODBC_INCLUDE_DIR / ODBC_LIBRARY 显式注入（由 0001 patch 的探测链前分支消费）"
  dependencies:
    - "unixodbc/2.3.12（ODBC 驱动管理器：libodbc.so + libodbcinst.so + sql.h/sqlext.h；本仓库制品仓已发布）"
  cc: clang

patches_applied:
  - file: "patches/0001-ohos-conan-unixodbc-injection.patch"
    target: "CMakeLists.txt"
    description: >-
      交叉构建 ODBC 探测链改造：①cmake_minimum_required 3.0.0→3.10（CMake 4.x
      拒绝 <3.5）；②在 odbc_config/find_path/iodbc-config 宿主专用探测链之前
      插入显式路径分支（ODBC_INCLUDE_DIR+ODBC_LIBRARY 命中即直接采用 Conan
      unixodbc 包注入的路径）；③④两处 if(UNIX) 守卫扩展为
      if(UNIX OR (ODBC_INCLUDE_DIR AND ODBC_LIBRARY))——CMAKE_SYSTEM_NAME=
      HarmonyOS 不定义 UNIX 变量，故所有 UNIX 守卫块需同步扩展。portability。

test_passed: 1
test_failed: 0

test_results:
  upstream_registered: 199
  upstream_executed: 1
  upstream_passed: 1
  upstream_failed: 0
  upstream_skipped: 198
  upstream_assertions: 7
  upstream_note: >-
    test/ 下 utility_test（1 个 TEST_CASE "convert"，纯离线，7 断言）真跑通过
    （源码树独立构建 + ctest -R utility_tests，All tests passed）；mssql 60 /
    mysql 34 / postgresql 36 / sqlite 38 / vertica 30 共 198 个 TEST_CASE_METHOD
    需 TEST_NANODBC_CONNSTR 真数据库连接（fixture 构造即 REQUIRE 连接），OHOS PC
    沙箱无 ODBC 数据源，环境排除如实记录；odbc_test.cpp 的 27 个为上游自注
    dummy（test/CMakeLists.txt: "odbc_test.cpp is a dummy"，上游从不构建），
    不计入注册数。
  test_package_registered: 1
  test_package_executed: 1
  test_package_passed: 1
  test_package_failed: 0
  assertion_count: 9
  adapter_self_checks: 0

knowledge_gained:
  - "nanodbc 是 header+单 cpp 的 ODBC 轻封装：库本体 nanodbc/nanodbc.cpp 编译为 libnanodbc（默认静态），install 布局 include/nanodbc/nanodbc.h + lib/ + nanodbc-config.cmake 导出。"
  - "上游 ODBC 探测链（odbc_config 程序 → find_path uodbc_stats.h → iodbc-config）全部宿主专用，交叉构建下 CMAKE_SYSTEM_NAME=HarmonyOS 连 UNIX 变量都不定义，探测链必然落空 FATAL_ERROR。解法：探测链前插 if(ODBC_INCLUDE_DIR AND ODBC_LIBRARY) 显式分支 + 三处 UNIX 守卫同步扩展（conan CMakeToolchain variables 注入两路径）。"
  - "上游测试双形态：utility_test.cpp 纯离线（#include nanodbc.cpp 直访私有 convert，1 TEST_CASE 7 断言，无 DB 依赖）可在沙箱真跑；mssql/mysql/postgresql/sqlite/vertica 五套 TEST_CASE_METHOD 共 198 例经 base_test_fixture 构造即 REQUIRE(TEST_NANODBC_CONNSTR 真连接)——连接串未设时 fixture REQUIRE 直接失败，属环境排除而非跳过。"
  - "odbc_test.cpp 的 27 个 TEST_CASE_METHOD 是上游自注 dummy（test/CMakeLists.txt 明文 'odbc_test.cpp is a dummy'，test_list 只列 mssql mysql postgresql sqlite vertica）——统计上游注册数时应剔除，勿虚报 226。"
  - "离线消费者冒烟可用 API 面（均为库内实现、无驱动交互）：connection/statement/result 默认构造语义（connected()==false / operator bool==false）、未连接 disconnect() no-op、transactions()==0、statement 空态 close() no-op、date/time/timestamp POD（注意 timestamp 字段名是 fract 非 fraction）、database_error(nullptr,0,info) 离线构造。"
  - "本机 OHOS 原生运行测试需补 LD_LIBRARY_PATH：unixodbc 包 lib/ + OHOS SDK llvm/lib + /system/lib64（libc++_shared.so 真身在系统分区）；否则动态加载器报 libodbc.so.2/libc++_shared.so 双缺失。"
