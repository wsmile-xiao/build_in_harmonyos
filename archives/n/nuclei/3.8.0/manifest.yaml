software: nuclei
version: "3.8.0"
status: published
build_date: "2026-06-01"
build_system: custom

source:
  url: "https://github.com/projectdiscovery/nuclei/archive/refs/tags/v3.8.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOPROXY=https://goproxy.cn,direct"
    - "go build -ldflags=-s -w ./cmd/nuclei"
  dependencies:
    - "go/1.26.3"
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Go项目必须CGO_ENABLED=0静态编译（PIE/DYN会签名损坏TLS header）"
  - "go.mod要求1.25.7+，必须用Go1.26.3（1.26.0有corrupted runtime source）"
  - "Go linker mmap在HMDFS上失败，输出到/data/storage/el2/base/cache/"
  - "nuclei主入口在cmd/nuclei而非根目录"
