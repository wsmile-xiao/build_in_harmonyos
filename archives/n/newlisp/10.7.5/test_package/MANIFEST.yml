# test_package/MANIFEST.yml
package: newlisp/10.7.5
homepage: http://www.newlisp.org

# 上游 make check 在本地独立实跑并记录（见版本级 manifest test_results），
# 不在 conan build() 内集成：qa-dot 的 semaphore 测试会触发平台沙箱 SIGSYS，
# 集成会导致 conan create 在 CI 上失败。
upstream_test_in_build: false
upstream_tests:
  - type: unit
    count: 12
    framework: "newlisp make check"
    description: "上游 make check 12 个测试脚本（Makefile check 目标）"
    known_failures: 1
    failure_details: "qa-dot 在 semaphore(System V IPC) 处触发 HarmonyOS 沙箱 SIGSYS(Bad system call, rc=159)；semaphore 之前的全部 built-in 函数测试通过；其余 11 项测试全部通过"

# test_package 自带测试（消费者视角，执行 newlisp 二进制断言输出）
test_package_tests:
  - file: test_newlisp.c
    description: "执行 newlisp 二进制断言：(+ 1 2) 输出 3；-v 输出含 10.7.5"
    command: "ctest"

assertion_count: 2