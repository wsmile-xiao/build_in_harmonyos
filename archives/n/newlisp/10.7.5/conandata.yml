sources:
  # 官方源 https://www.newlisp.org/downloads/newlisp-10.7.5.tgz 在本地与 CI Worker 均 DNS 不可达
  # (NameResolutionError)。改用 MacPorts 官方 distfile 镜像（权威镜像源，R39 合规），
  # sha256=dc2d0ff6... 与 Homebrew homebrew-core 公开值双源核对字节一致。
  url: "https://distfiles.macports.org/newlisp/newlisp-10.7.5.tgz"
  sha256: "dc2d0ff651c2b275bc4af3af8ba59851a6fb6e1eaddc20ae75fb60b1e90126ec"
  # 备用镜像（字节一致）：https://www.newlisp.org/downloads/newlisp-10.7.5.tgz

patches:
  - patch_file: "patches/0001-configure-alt-harmonyos-uname.patch"
    patch_description: "configure-alt 的 uname 平台识别增加 HarmonyOS 分支（映射为 LINUX），使非交互配置脚本能在 OpenHarmony 设备上生成 makefile_build；仅一行 case 识别，不引入任何 C 平台宏"
    patch_type: "portability"
  - patch_file: "patches/0002-nl-filesys-c-pipe-fdopen-handles1.patch"
    patch_description: "修复 p_pipe() 中写端 fdopen 误用读端句柄 handles[0] 的真实上游 bug（应为 handles[1]），pipe 函数在设备 musl libc 上触发 SIGRT42 崩溃；通用 POSIX 修复"
    patch_type: "bugfix"