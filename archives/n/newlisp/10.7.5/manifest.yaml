software: newlisp
version: "10.7.5"
status: built
build_date: "2026-09-10"
build_system: makefile

source:
  url: "https://www.newlisp.org/downloads/newlisp-10.7.5.tgz"
  sha256: "dc2d0ff651c2b275bc4af3af8ba59851a6fb6e1eaddc20ae75fb60b1e90126ec"
  tar_format: tar.gz

build:
  system: configure-alt + make
  configure_options:
    - "--disable-readline"
    - "--disable-ffi"
    - "--enable-static"
  dependencies: []
  cc: clang
  cflags: "-Wall -Wno-long-long -Wno-strict-aliasing -O2 -c"
  ldflags: "-static -lm"
  note: "STRIP 禁用：HarmonyOS exec 沙箱拒绝 stripped ELF"

patches_applied:
  - "0001-configure-alt-harmonyos-uname.patch"
  - "0002-nl-filesys-c-pipe-fdopen-handles1.patch"

test_results:
  - item: "上游测试资产（47 个 qa 文件：qa-dot + qa-specific-tests/qa-* 46 个）"
    note: "make check 门禁组合（上游 make check 目标）实跑 12 项：11 项通过，qa-dot 平台限制失败"
    passed: 11
    failed: 1
    failure_detail: "qa-dot: 测试 semaphore(System V IPC) 时被 HarmonyOS 沙箱 SIGSYS 终止 rc=159；semaphore 之前全部 built-in 函数测试通过；组合外 35 个 qa 文件不属上游 make check 门禁范围"
  - item: "消费者冒烟 newlisp -e '(+ 1 2)'"
    result: "输出 3，rc=0"
  - item: "newlisp -v"
    result: "newLISP v.10.7.5 64-bit on Linux IPv4/6 UTF-8.，rc=0"

knowledge_gained:
  - "HarmonyOS exec 沙箱只允许静态链接且未被 strip 的 ELF：动态 ELF 与 llvm-strip 后 ELF 均 Permission denied (EACCES, rc=126)"
  - "System V IPC(semget/semop) 在设备上触发 seccomp SIGSYS 'Bad system call'，semaphore 相关测试为平台限制失败"
  - "configure-alt 的 uname case 不识别 HarmonyOS（uname 返回 'HarmonyOS'），需增加 HarmonyOS→LINUX 映射后才能脚本化配置"
  - "newlisp p_pipe() 存在真实上游 bug：写端 fdopen 误用读端句柄 handles[0]（应为 handles[1]），在 musl libc 环境触发 SIGRT42 崩溃"

patch_generation:
  method: per-file-difflib
  patches_count: 2

patch_classification:
  - file: 0001-configure-alt-harmonyos-uname.patch
    type: platform_compat
    description: "configure-alt uname 识别增加 HarmonyOS → LINUX 映射（一行 case）"
    platform_only: true
  - file: 0002-nl-filesys-c-pipe-fdopen-handles1.patch
    type: bugfix
    description: "p_pipe() 写端 fdopen 使用错误句柄（handles[0] → handles[1]），真实上游 bug 修复，通用 POSIX"
    platform_only: false