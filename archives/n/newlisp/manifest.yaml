software: newlisp
display: "newLISP"
description: "newLISP is a Lisp-like, general-purpose scripting language. 纯 C 单体解释器，单一可执行文件。"
category: tool
homepage: "http://www.newlisp.org"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "configure-alt 非交互配置 → make 构建；0001 补丁为 uname 识别增加 HarmonyOS→LINUX 映射"
    - "必须静态链接(--enable-static)且禁用 strip：HarmonyOS 设备 exec 沙箱只接受静态且未 strip 的 ELF"
    - "关闭 readline/ffi（无第三方运行时依赖）；System V IPC(semaphore) 被设备沙箱 SIGSYS 拦截为平台限制"
  common_dependencies: []

versions:
  "10.7.5":
    status: built
    build_date: "2026-09-10"
    format: conan