package: nob.h/3.9.0
homepage: "https://github.com/tsoding/nob.h"

upstream_check_command: "clang -std=c99 -Wall -Wextra -Wno-unused-function -D_POSIX_C_SOURCE=200112L -I. -I./tests tests/*.c -o build/<name> && ./build/<name> && diff -u tests/<name>.stdout.txt build/<name>.out"
upstream_test_in_build: false
upstream_test_command: "clang -x c -o nob nob.c && ./nob"

upstream_tests:
  - path: tests/
    type: C test programs (each tests/<name>.c is a standalone program comparing stdout with tests/<name>.stdout.txt, driven by nob.c)
    case_count: 19
    source_case_count: 19
    not_compiled_case_count: 0
    assertion_count: 19
    source_file_count: 19
    command: "clang -x c -o nob nob.c && ./nob"
    executed: true
    passed_case_count: 18
    skipped_case_count: 0
    reason: "18/19 passed byte-identical against upstream baseline; chain fails only on merged stdout/stderr ordering (OHOS libc buffering), content identical (94.7% full pass rate)."

test_package_tests:
  - file: test_nob_consumer.c
    description: "Consumer uses installed public header nob.h (NOB_IMPLEMENTATION) and exercises sv_trim / da_append / temp_sprintf public APIs with observable assertions"
    command: "./test_nob_consumer"
    case_count: 1
    assertion_count: 3
    result: "ALL PASS (ran inside conan create -pr:h=ohos-aarch64)"
  - file: test_nob_ohos.c
    description: "OHOS special test: da invariants (append/resize), temp allocator, string-view edges, UTF-8 length on OHOS(aarch64) toolchain"
    command: "./test_nob_ohos"
    case_count: 1
    assertion_count: 10
    result: "ALL PASS (ran inside conan create -pr:h=ohos-aarch64)"

assertion_count: 13