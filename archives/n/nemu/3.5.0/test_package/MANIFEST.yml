# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: nemu/3.5.0
homepage: "https://github.com/nemuTUI/nemu"

# 上游测试依赖可执行 OHOS 环境、QEMU、tmux、可写 /tmp 和 OVA 数据。
upstream_check_command: "NEMU_TARGET_OS=OHOS NEMU_TEST_DIR=<upstream-test-dir> test_package/runtime-check.sh <package-folder>/bin/nemu"
upstream_test_in_build: false
upstream_test_command: "python3 -m unittest -v vm_test.py ova_test.py"

upstream_tests:
  - file: test/vm_test.py
    count: 8
    description: "VM 创建、配置、磁盘和网络集成测试"
  - file: test/ova_test.py
    count: 1
    description: "OVA 导入集成测试"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：启动 test_nemu，调用打包后的 nemu --version 并传播退出状态"
    command: "Conan test() invokes test_nemu with the packaged bin/nemu path"
  - file: smoke.py
    description: "最小包边界冒烟：校验 Conan 包目录中的 nemu/ntty、配置和 locale 文件，以及 nemu 的 AArch64 ELF 头"
    command: "python3 test_package/smoke.py <conan-package-folder>"
  - file: runtime-check.sh
    description: "R40 运行验收入口：在可执行 OHOS 环境中原样运行上游 9 个集成测试；缺少前置条件时退出 77，不计为通过"
    command: "NEMU_TARGET_OS=OHOS NEMU_TEST_DIR=<upstream-test-dir> test_package/runtime-check.sh <conan-package-folder>/bin/nemu"

# 当前已执行并统计的测试断言总数；runtime-check.sh 是待人工执行的 R40 验收入口，不计为 PASS。
assertion_count: 2

# 上游 9 个用例已全部真实执行（Ran 9 tests, FAILED errors=9），0 通过。
# 逐用例「无法运行」证据链（报错位置/修复尝试/系统级证明）见
# archives/n/nemu/3.5.0/reports/unrunnable-evidence.md。
