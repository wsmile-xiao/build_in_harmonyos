# 编译中学到的知识
knowledge_gained:
  - "上游用 MODULE 变量式 find（SQLITE3_LIBRARIES 等），CMakeDeps CONFIG target 不填这些变量，需桥接或显式 cache"
  - "gettext conan 包未声明 cpp_info.libs 时 Intl::Intl 为空 target，需注入 INTERFACE_LINK_LIBRARIES"
  - "python.org 构建的 libpython 为 BIND_NOW，LD_PRELOAD 拦不到其 os.mkdir，python 层需 sitecustomize"
  - "tmux daemonize 后的 pane 进程 open HMDFS 文件返回 EACCES（直接子进程正常），测试数据需 tmpfs 化"
  - "nemu 上游测试断言 QEMU 命令行字符串而非实际启动 VM，qemu 可桩化"
