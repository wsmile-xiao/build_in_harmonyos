software: nanomsg
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/nanomsg/nanomsg/archive/refs/tags/1.2.tar.gz"

  # 源码校验和
  sha256: "6ef7282e833df6a364f3617692ef21e59d5c4878acea4f2d7d36e21c8858de67"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DNN_ENABLE_DOC=OFF"
    - "-DNN_TESTS=OFF"
    - "-DNN_TOOLS=ON"
  # 说明：NN_ENABLE_DOC 关闭 asciidoctor 文档依赖；上游 43 项测试在独立源码
  # 构建中真跑（本地实机 ctest 39/43 通过，4 项 ipc 系 AF_UNIX bind EPERM
  # 平台限制，见 notes.md 证据链）

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS 平台识别：CMAKE_SYSTEM_NAME MATCHES HarmonyOS 分支 + set(UNIX TRUE)，与 Android 同构走 POSIX 路径"
  - "上游 ipc:// 传输受系统 AF_UNIX bind EPERM 限制（独立最小程序可复现），tcp/inproc/ws 可用"
  - "nanomsg 1.2 无外部 conan 依赖，仅系统 pthread"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/nanomsg-1.2-src
  source_work_dir: /storage/Users/currentUser/tmp/nm-src-work
  source_orig_hash: 6ef7282e833df6a3
  source_work_hash: 39c8b1f0d2a5e671
  generated_at: '2026-09-15T00:12:00'
  patches_count: 1

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: platform
    platform_only: True
    guard: 'cmake_minimum_required + CMAKE_SYSTEM_NAME MATCHES HarmonyOS'
