# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: nanomsg/1.2
homepage: "https://nanomsg.org/"
upstream_check_command: "ctest -j4 --output-on-failure"

# conanfile.py build() 中 NN_TESTS=OFF（上游测试二进制与库同链构建会拉入全部 44 个
# 测试可执行文件，产物臃肿）；上游完整测试在独立源码构建中真跑：
# 本地（HarmonyOS PC aarch64 实机）CMake configure + make -j1 + ctest
# 实测 43 项注册、39 通过、4 项 ipc/separation 因系统 AF_UNIX bind EPERM 被拒
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试（CMakeLists.txt add_libnanomsg_test 宏注册）
upstream_tests:
  - file: tests/inproc.c
    source: nanomsg-1.2/tests/inproc.c
    description: "inproc 传输套件（8 项）+ 协议套件（6 项）+ 功能套件（29 项）共 43 项 ctest：39 通过（91%）；ipc/ipc_shutdown/ipc_stress/separation 4 项因 HarmonyOS 系统对 AF_UNIX socket bind 返回 EPERM（Operation not permitted）失败——已用独立最小程序复现该系统限制（bind: Operation not permitted errno=1），非源码缺陷"
    command: "ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者: nn_socket/nn_bind/nn_connect/nn_send/nn_recv 闭环（inproc pair 回环 + tcp 127.0.0.1 回环 + pubsub/reqrep socket 创建 + __OHOS__ 宏探测）"
    command: "./test_nanomsg"

assertion_count: 12
