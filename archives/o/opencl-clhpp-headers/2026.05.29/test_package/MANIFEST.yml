# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: opencl-clhpp-headers/2026.05.29
homepage: "https://github.com/KhronosGroup/OpenCL-CLHPP"

# 上游测试命令分析
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 在鸿蒙 PC 真机上手动初始化 CMock + Unity submodule 后本地运行
upstream_tests:
  - file: tests/test_openclhpp.cpp
    source: OpenCL-CLHPP-2026.05.29/tests/test_openclhpp.cpp
    description: "上游 OpenCL C++ header 测试，12 个变体（6 版本 × 2 选项组），每变体 173 个测试，1 个失败（CMock mock 期望值不匹配）"
    command: "ctest"
    result: "172/173 PASS (99.4%)"
  - file: tests/test_versions.cpp
    source: OpenCL-CLHPP-2026.05.29/tests/test_versions.cpp
    description: "版本兼容性测试，需 OpenCL ICD Loader，鸿蒙环境无法运行"
    command: "ctest"
    result: "0/0 (ICD Loader 不可用)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "基础 include 验证：CL/opencl.hpp 可被 include，CL_HPP_TARGET_OPENCL_VERSION 宏正确"
    command: "./test_include"
  - file: test_version.cpp
    description: "版本宏验证：CL_HPP_TARGET_OPENCL_VERSION >= 200，CL_HPP_MINIMUM_OPENCL_VERSION >= 120"
    command: "./test_version"
  - file: test_types.cpp
    description: "核心类型验证：cl::Platform/Device/Context/CommandQueue/Buffer/Event/UserEvent/Sampler/Program/Kernel 类定义存在且非零大小"
    command: "./test_types"
  - file: test_api_surface.cpp
    description: "API 表面验证：cl::QueueProperties 枚举、cl_bool/cl_mem_flags/cl_map_flags 等 C 类型、cl::NDRange 可用"
    command: "./test_api_surface"

# 测试断言总数
assertion_count: 18
