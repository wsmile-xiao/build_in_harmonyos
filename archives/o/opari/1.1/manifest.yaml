software: opari
version: "1.1"
status: built
build_date: "2026-10-08"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "opari 1.1 是手写 Makefile 工程（C++ 工具 + C 运行时），无 autotools/cmake；本 recipe 用 conan 手动编译（tools.build:compiler_executables 取 clang/clang++）。"
    - "libpomp 的 pomp_lib.c 需要 omp.h，须以 -fopenmp 编译；pomp_fwrapper.c（Fortran 面向）依赖自动生成的 pomp_fwrapper_def.h，仅 Fortran 消费者需要，C 运行时仅 pomp_lib.o 即可。"
    - "opari 生成的 .opari.inc 仅定义区域描述符 omp_rd_N；POMP_MAX_ID 与 pomp_rd_table[] 由 pomp_lib.h 声明为 extern，须在可执行文件中自行定义（test_package 用 pomp_rt.c 提供零初始化表）。"
    - "消费者链接 libomp 时，OHOS clang -fopenmp 自动在二进制写入 RUNPATH 指向 SDK llvm/lib，运行时 libomp.so 无需额外 LD_LIBRARY_PATH。"
  knowledge_gained:
    - "source-to-source OpenMP 插桩工具（opari 类）：工具本体不依赖 OpenMP 运行时；消费者须把 libpomp 与 libomp 一并链接，且 POMP_MAX_ID / pomp_rd_table 必须由可执行文件定义（零初始化表即可，区域事件直接引用 &omp_rd_N） (ref: notes.md §4 与 1.1/test_package/pomp_rt.c)"
    - "libpomp 的 pomp_lib.c 未见 #include <omp.h> 却使用 omp_lock_t，必须以 -fopenmp 编译；lib/pomp_fwrapper.c 依赖自动生成的 pomp_fwrapper_def.h，仅 Fortran 消费者需要，C 运行时只需 pomp_lib.o (ref: notes.md §4)"
    - "aarch64 上 ptrdiff_t 传给 %.*s 的精度位是真实 64 位缺陷（clang -Wformat，-Werror 下必挂），需显式 (int) 强转 (ref: patches/0001-opari-format-precision-64bit.patch)"
    - "手写 Makefile 工程（无 autotools/cmake）的配方写法：用 tools.build:compiler_executables 取 clang/clang++/llvm-ar 逐 TU 编译，并把上游 shell 测试脚本（c_test.sh / table_test.sh）放进 build() 执行以保留 R51 上游测试 (ref: notes.md §3 §5)"
    - "OHOS clang -fopenmp 会把 RUNPATH 写进二进制指向 SDK llvm/lib，libomp.so 运行时直接解析，test_package 无需额外 LD_LIBRARY_PATH (ref: notes.md §4 与 reports/test-report.md)"
