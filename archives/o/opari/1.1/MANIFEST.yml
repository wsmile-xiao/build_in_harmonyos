# MANIFEST — opari 1.1
# OPARI: OpenMP Pragma And Region Instrumentor (source-to-source tool + libpomp)

name: opari
version: "1.1"
description: "OPARI OpenMP Pragma And Region Instrumentor (C++ tool + libpomp C runtime)"
homepage: "https://www.fz-juelich.de/ias/jsc/opari/"
license: "GPL-2.0-or-later"
language: C/C++
build_system: makefile

# 上游测试清点 (R51 三步法 - 第 1 步)
# tool/Test/ 下有 4 个测试驱动：
#   c_test.sh      —— opari 对 11 个 C 用例插桩输出与 .out / .opari.inc.out 比对
#   table_test.sh  —— opari -table 生成的 region 表 (opari.rc / opari.tab.c) 比对
#   f77_test.sh / f90_test.sh —— Fortran 测试（已排除，原因见下）
upstream_tests:
  - description: >-
      C 测试套件：tool/Test/c_test.sh 对 11 个 C 用例 (test1/test2/test4/test5/
      test6/test8/test9/testA/testB/testC/testD) 插桩，diff 比对 .mod.c 与
      .opari.inc；table_test.sh c 比对 region 表。Fortran 测试 (f77/f90) 因 OHOS
      SDK 无 gfortran 编译器已排除（具体技术原因：目标平台未提供 Fortran 工具链）。
    count: 11
    status: "pass"

# test_package 自带测试（消费者视角验证）
test_package_tests:
  - file: conanfile.py
    description: >-
      鸿蒙消费者可行性测试：用 opari 对 C OpenMP 程序插桩 -> 编译 -> 链接
      libpomp + libomp -> 在 aarch64 OHOS 真机运行，断言 sum=4950 且 POMP 区域
      事件（init/parallel/for/finalize）实际执行。
    command: "conan test"
