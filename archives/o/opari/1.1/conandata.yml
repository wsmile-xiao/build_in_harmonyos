# conandata.yml — single source of truth for source URL + SHA256 + patches.
# opari 1.1 upstream (Forschungszentrum Jülich, 2001) original tarball is no
# longer hosted; the Debian +dfsg repack is used (consistent with the 241
# existing deb.debian.org sources already in this repo).
#
# Patch 0001 is a genuine 64-bit portability fix: on aarch64 `dot - infile` is
# a 64-bit ptrdiff_t while "%.*s" reads its precision as `int`, which clang
# reports as -Wformat (and would be fatal under -Werror).

sources:
  url: "https://deb.debian.org/debian/pool/main/o/opari/opari_1.1+dfsg.orig.tar.bz2"
  sha256: "17c3915d5630d4111d219963974cc26e16bc1a89c9758d0d67fdcd7e6269a1bf"

patches:
  - patch_file: "patches/0001-opari-format-precision-64bit.patch"
    patch_description: "Cast the ptrdiff_t precision argument of %.*s to int (64-bit/aarch64 -Wformat defect in opari.cc output-name generation)"
    patch_type: "portability"
