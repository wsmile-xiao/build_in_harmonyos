schema_version: 1
software: opari
version: 1.1

upstream_tests:
  - name: c_test.sh
    command: "sh tool/Test/c_test.sh"
    cases: 11
    expected: pass
  - name: table_test.sh
    command: "sh tool/Test/table_test.sh c"
    cases: 1
    expected: pass

consumer_tests:
  - name: opari_instrument_consumer_ohos
    source: consumer.ohos.c
    api_calls:
      - "opari (instrument tool)"
      - "pomp_init"
      - "libpomp + libomp link"
    expected: "sum=4950 + POMP region events on stderr (aarch64 OHOS)"

# HarmonyOS-specific assertions. Without these the consumer case would also
# pass on a plain Linux/glibc + libomp box, i.e. it would prove nothing about
# the OHOS port. Each assertion is falsifiable.
ohos_assertions:
  - id: A
    kind: platform_gate
    check: "settings.os == 'OHOS' && settings.arch == 'armv8'"
    why: "OHOS clang -fopenmp + OHOS libomp only exist on OpenHarmony"
  - id: B
    kind: target_architecture
    check: "ELF header of ./consumer: ei_class == ELFCLASS64 && e_machine == EM_AARCH64 (183)"
    why: "proves the instrumented consumer was built for the OHOS PC target"
  - id: C
    kind: platform_runtime
    check: "stderr POMP events > 0 and contain 'begin parallel', 'enter for', 'finalize'"
    why: "proves the OHOS libomp worker threads really executed the instrumented regions"

test_policy:
  upstream_inventory_frozen: true
  cross_build_runtime: target_device_required
  ohos_case_required: true
