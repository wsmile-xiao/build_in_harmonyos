software: opari
display: "OPARI"
description: "OpenMP Pragma And Region Instrumentor — 源码级 OpenMP 插桩工具与 libpomp 测量运行时"
category: devel
homepage: "https://www.fz-juelich.de/ias/jsc/opari/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "手写 Makefile，无 autotools/cmake；conan 手动编译 clang/clang++。"
    - "libpomp 须 -fopenmp 编译；pomp_fwrapper.c 仅 Fortran 需要。"
    - "POMP_MAX_ID/pomp_rd_table 由消费者定义。"
  knowledge_gained:
    - "source-to-source OpenMP 插桩工具：工具不依赖 OpenMP 运行时，libpomp 须与 libomp 链接，POMP_MAX_ID/pomp_rd_table 由消费者定义。"

versions:
  "1.1":
    status: built
    build_date: "2026-10-08"
    packaging: conan
    source_url: "https://deb.debian.org/debian/pool/main/o/opari/opari_1.1+dfsg.orig.tar.bz2"
