software: openvpn
# 版本级 manifest（遵循 ARCHIVE-SPEC v2.0）
# 文件位置: archives/o/openvpn/2.7.6/manifest.yaml

version: "2.7.6"
status: built
build_system: autotools
build_date: "2026-09-13"

source:
  url: "https://github.com/OpenVPN/openvpn/releases/download/v2.7.6/openvpn-2.7.6.tar.gz"
  sha256: "10e24a9385f23cc38cc5cf448f3ca0769f939bc4cbecc4f4647d7e006e52db74"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-plugin-auth-pam"
    - "--disable-dco"
  dependencies:
    - openssl/3.5.6
    - lzo/2.10
    - lz4/1.10.0
    - libcap-ng/0.8.5
    - cmocka/2.0.2 (tool_requires，上游单元测试用)
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-sockaddr-storage-clash.patch"
  - "0002-syshead-socket-guard.patch"

knowledge_gained:
  - "E119/E091: OHOS musl sysroot linux/socket.h 与 sys/socket.h 重定义 sockaddr_storage，_UAPI_LINUX_SOCKET_H guard + __kernel_sa_family_t typedef 修法"
  - "E114: configure umask 077 + HMDFS setgid 产生不可写 config.status 临时目录，去 umask 前缀"
  - "E074: HMDFS jobserver fifo EPERM，make -j1"
  - "E002: /tmp 只读（erofs ro 挂载）对上游测试的影响分两类——可绕过类（硬编码 /tmp 临时文件）用 LD_PRELOAD open/fopen/stat/unlink 重定向 shim 不改上游源码解决；不可绕过类（root/tun 依赖）逐项实证 SKIP"
  - "openvpn 2.7.6: TLS-less 静态密钥需 --allow-deprecated-insecure-static-crypto；默认 BF-CBC 已被 OpenSSL 3.x 移除需显式 cipher；ping-exit 替代 ping-restart 保证退出"
  - "CI L0c/L0d: test_package 须有测试源码文件且 test() 用 self.run()——CLI 二进制包用 .sh 功能脚本驱动最贴合"
  - "conan tool_requires 的 .pc 不进默认 PkgConfigDeps 生成——PkgConfigDeps.build_context_activated=['cmocka'] + build 依赖 pc 目录注入 PKG_CONFIG_PATH 可让上游 configure 探测通过（cmocka/2.0.2 已在 ohpcd 发布）"
  - "上游 automake `if !CROSS_COMPILING` 门控 TESTS 执行但 check_PROGRAMS 照常构建——交叉构建产物若与主机同架构（OHOS arm64 本机），可在 conanfile build() 里逐个真实执行并 fail build"
