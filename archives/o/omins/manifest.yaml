software: omins
display: "Omins"
description: "A collection of LADSPA plugins for modular synthesizers"
category: audio
homepage: "https://www.nongnu.org/om-synth/omins.html"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "18 个 LADSPA 共享对象、28 个插件描述符，均通过 dlopen 运行，不依赖 GUI 或音频守护进程"
    - "autoreconf 更新 2005 年的构建文件，并显式设置 build/host 三元组以识别 aarch64-unknown-linux-ohos"
    - "configure 使用系统 POSIX shell，并将临时目录 umask 调整为 022，兼容 HarmonyOS PC HMDFS 权限语义"
    - "真机消费者测试加载并运行全部插件，并验证 __OHOS__ 与 aarch64 运行环境"
  common_dependencies:
    - "ladspa-sdk/1.17"

versions:
  "0.2.0":
    status: built
    build_date: "2026-10-08"
    conan_ref: "omins/0.2.0"
