schema_version: 1
software: omins
version: "0.2.0"

upstream_tests:
  count: 0
  command: "make -j1 check"
  inventory: []
  note: "Upstream has no test sources or Automake TESTS/check_PROGRAMS; make check is still executed as the upstream test command."

port_tests:
  count: 3
  command: "conan create . -pr:h=ohos-aarch64 -pr:b=ohos-aarch64 --build=omins/0.2.0"
  cases:
    - name: harmonyos_platform_gate
      type: harmonyos-specific
      assertions: 3
      description: "Compile-time __OHOS__ gate, aarch64 runtime uname check, and fixed 18-module inventory check."
    - name: complete_module_loading
      type: integration
      assertions: 54
      description: "Each of the 18 packaged modules must dlopen, export ladspa_descriptor, and enumerate at least one descriptor."
    - name: complete_descriptor_execution
      type: functional
      assertions: 113
      description: "All 28 descriptors must have valid metadata and nonzero IDs, instantiate successfully, and produce finite output; the final descriptor total must be exactly 28."

summary:
  upstream_test_count: 0
  port_test_count: 3
  assertion_count: 170
  harmonyos_specific_test_count: 1
