knowledge_gained:
  - "Omins installs 18 independent LADSPA modules and exports 28 descriptors; a useful consumer test must enumerate every module and exercise every descriptor"
  - "The 2005 generated Autotools files require autoreconf for the OHOS triplet, then the E011 umask normalization for HMDFS config.status scratch files"
  - "The upstream custom install rule ignores DESTDIR, so package() copies the verified src/.libs module set directly into lib/ladspa"
  - "OHOS dlopen cannot safely execute the legacy reserved _init and _fini entry points; compiler constructor and destructor attributes preserve lifecycle semantics through init arrays"

