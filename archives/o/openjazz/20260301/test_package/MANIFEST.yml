# test_package/MANIFEST.yml — openjazz 20260301
# CI L0e 要求此文件存在。

package: openjazz/20260301
homepage: "https://alister.eu/jazz/oj/"

# 上游无测试套件：openjazz 20260301 无 enable_testing/CTest/make check
# （grep enable_testing|add_test|ctest 全仓零命中）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游 tarball 内无测试程序
upstream_tests: []

# test_package 消费者视角测试：
# 复制被测二进制到临时目录、OHOS ELF 签名后真实执行，
# 只走 argparse 的纯 IO 退出路径（-v/--version/--help），不初始化 SDL 显示
test_package_tests:
  - file: test.sh
    description: "二进制存在且可执行"
    command: "bash test.sh"
  - file: test.sh
    description: "运行 OpenJazz -v 并断言版本输出含 OpenJazz 20260301（rc=0）"
    command: "bash test.sh"
  - file: test.sh
    description: "运行 OpenJazz --version 并断言版本输出含 OpenJazz 20260301（rc=0）"
    command: "bash test.sh"
  - file: test.sh
    description: "运行 OpenJazz --help 并断言输出含 Usage: OpenJazz 与 Engine options（rc=0）"
    command: "bash test.sh"

# 断言总数
assertion_count: 4
