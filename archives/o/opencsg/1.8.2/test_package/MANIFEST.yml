# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md
#
# OpenCSG 1.8.2 上游没有单元测试套件。唯一的测试/示例源码是 example/，
# 它是一个需要真实 GLUT/OpenGL 窗口与 GL context 的演示程序，无法在无头
# CI worker 上运行，因此本次适配中 BUILD_EXAMPLE=OFF，把它留到设备
# shadow CI（见下方 device_shadow_ci 说明）。

package: opencsg/1.8.2
homepage: "http://www.opencsg.org"

# 上游没有任何可收集的自动化测试（无 ctest / 无单元测试源文件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游唯一的测试性源码：GLUT 演示程序，需要真实 GL 上下文
upstream_tests:
  - file: example/main.cpp
    source: OpenCSG-opencsg-1-8-2-release/example/main.cpp
    description: "GLUT/OpenGL CSG 演示程序，需真实 GL context；本机/无头 CI 无法执行"
    command: "cmake -DBUILD_EXAMPLE=ON && ./opencsgexample"
    executed: false

# test_package 中自带的测试（消费者视角验证安装后的包）
test_package_tests:
  - file: test_opencsg.cpp
    description: "消费者测试：链接 libopencsg，调用 Primitive 基类 API / setOption / setContext，并探测 libGLv4.so 与 libEGL.so 的加载器符号"
    command: "./test_opencsg"

# 确定性断言数（版本宏 2 + Primitive 4 + 选项 2 + 上下文 1 = 9）
assertion_count: 9

# 额外的条件性断言：libGLv4.so 导出 glGetString、libEGL.so 导出 eglGetProcAddress
# 仅在对应库存在时执行，不存在时记为 skip（不是 fail），不计入 assertion_count。
conditional_assertions: 2

# 设备 shadow CI 计划（本轮未执行，见 notes.md「下一步」）
device_shadow_ci:
  - "sh $HOME/bin/ohos-prepare-isolated-conan-job.sh --user codex --job <job> --package archives/o/opencsg/1.8.2 --repo-source <existing-repo>"
  - "sh $HOME/ohos-users/codex/<job>/run-conan-heavy.sh"
  - "在设备侧确认 libGLv4.so / libEGL.so 可被 dlopen（test_opencsg 的 loader 探针）"
  - "可选：-DBUILD_EXAMPLE=ON 构建 example/opencsgexample，用真实 GL context 跑通 CSG 渲染"
