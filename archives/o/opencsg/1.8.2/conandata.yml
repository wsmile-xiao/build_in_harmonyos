# conandata.yml — opencsg 1.8.2
# CI 的唯一源码/补丁输入；conanfile.py 通过 self.conan_data 读取。
#
# 源码使用上游官方 tag 归档（R39）。URL 带明确的 .tar.gz 后缀，
# 避免 Conan get() 按 codeload basename 误判为 zip（见知识条目 E276）。
# sha256 与本地下载归档实测一致。

sources:
  url: "https://github.com/floriankirsch/OpenCSG/archive/refs/tags/opencsg-1-8-2-release.tar.gz"
  sha256: "63c74513f8197ceaef68bd90502c096b64146997d67e0979a82e0e8db2928527"

patches:
  - patch_file: "patches/0001-glad-ohos-opengl-loader.patch"
    patch_description: "Append libGLv4.so to glad's GL library candidates and fall back to eglGetProcAddress when GLX is unavailable (POSIX-generic, no platform macro)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-CMakeLists-optional-opengl-lookup.patch"
    patch_description: "Make find_package(OpenGL) optional; the library resolves GL entry points at runtime via glad and never links GL"
    patch_type: "portability"
