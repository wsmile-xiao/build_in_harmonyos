knowledge_gained:
  - "OpenCSG 自带私有 glad（符号收入 OpenCSG 命名空间），所有 GL 入口点都在 render() 里 dlopen 解析；库本身不链接任何 GL 库（实测 DT_NEEDED 只有 libc++_shared.so 和 libc.so）"
  - "HarmonyOS 无桌面 GL 开发包：src/CMakeLists.txt 的 find_package(OpenGL REQUIRED) 在 OHOS 上必然失败，尽管 opencsg 目标并不链接 GL；改为可选即可"
  - "HarmonyOS 随 SDK 提供桌面 GL 入口库 libGLv4.so（导出 glBegin/glGetString/FBO/遮挡查询等 840 个 GL 符号），glad 的 NAMES 候选需加入它"
  - "HarmonyOS 的 eglGetProcAddress 来自 libEGL.so（非 libGL.so），glad 过程地址助手应在 glXGetProcAddressARB 取不到时回退 libEGL.so 的 eglGetProcAddress（POSIX 通用写法，不引入平台宏）；未命中的入口点再由 glad_gl_get_proc 回退 dlsym"
  - "OpenCSG 1.8.2 上游无单元测试套件；example/ 是需真实 GL context 的 GLUT 程序，不适合无头 CI"
  - "真机 shadow CI：hnp 工具链 cmake/make/ninja 位于 /data/service/hnp/bin，需由运行环境 PATH 提供（隔离 runner 的 run-conan-heavy.sh 未注入该目录）；这是运行环境问题，不应在库里加 tool_requires(\"cmake/...\")（ohpcd 无 cmake recipe，会 L0i 失败）"
  - "已知限制：OHOS CMake 缺 Platform/HarmonyOS.cmake，CMake 共享库不生成版本化 SONAME（最小复现确认，影响所有 CMake 库，非本库补丁问题）"
  - "无头 CI 验证上下文依赖库的方法：把公开 API 拆成'无上下文断言 + 运行时加载器探针'，需 context 的路径如实延后；既过 R34/L1e 又不谎报覆盖"

