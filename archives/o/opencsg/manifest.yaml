software: opencsg
display: "OpenCSG"
description: "Image-based CSG rendering library for OpenGL (Goldfeather / SCS algorithms)"
category: gfx
homepage: "http://www.opencsg.org"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "OpenCSG 自带 glad，所有 GL 入口点在运行时 dlopen 解析，库本身不链接 GL；OHOS 需让 glad 认识 libGLv4.so（桌面 GL 入口）与 libEGL.so（eglGetProcAddress）"
    - "src/CMakeLists.txt 的 find_package(OpenGL REQUIRED) 在无 GL 开发包的 OHOS 上失败，需改为可选（目标并不链接 GL）"
    - "需要设备侧提供 libGLv4.so / libEGL.so；render() 的实际渲染验证需真实 GL context（真机 shadow CI）"
    - "构建 example/ 需 GLUT，适配中关闭（BUILD_EXAMPLE=OFF）"
  common_dependencies: []

versions:
  "1.8.2":
    status: built
    build_date: "2026-09-11"
    conan_ref: "opencsg/1.8.2"
    difficulty: "B-candidate"
    adaptation_path: "Path A OpenGL/CMake adaptation plus Path B knowledge-extension candidate"
