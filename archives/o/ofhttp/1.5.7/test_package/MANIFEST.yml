# test_package/MANIFEST.yml — ofhttp 1.5.7 验证清单
#
# 上游测试来源与执行方式（rule4 / PF3：真实执行，不做声明式占位）：
#   - 上游工程: ObjFW 1.5.7（ofhttp 位于 utils/ofhttp，随主仓一起发布）
#   - 上游官方测试入口: 顶层 Makefile 的 check target
#         check: tests
#             ${MAKE} -C tests -s run
#   - 上游用例规模（按 runner 自身发现规则精确统计）: tests/**/*.m 中 645 个
#     无参 test 方法（src/test/OTAppDelegate.m 的 testsInClass: 要求 selector
#     以 test 开头、返回 void、无参数）。评审使用的宽松静态口径为 652，
#     差额来自 (struct TestStruct)testStruct 一类非用例命中。
#   - configure 的特性探测会在 OHOS 上关掉 6 个测试文件（合计 15 个方法）：
#     Appletalk / IPX / SPX / SCTP / Windows 注册表，OHOS 无对应头文件或非
#     Windows 平台；其余 630 个方法全部编入 tests/tests
#   - tests/tests 按"类"枚举可达的 test 方法（继承到具体子类的父类方法会按子类
#     各跑一次），因此实际执行 1242 个用例
#
# 上述上游套件在 conanfile.py 的 build() 中通过 `make check` 真实执行，
# 失败或无法解析出汇总行都会让构建失败；不存在"只声明不执行"的情况。
# 下面的 test_package 则是针对**本包交付物**的消费者验收。
package: ofhttp/1.5.7
homepage: https://objfw.nil.im/

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: objfw-testsuite
    count: 652
    precise_count: 645
    file: tests
    source: "ObjFW-1.5.7-release/tests/**/*.m"
    description: "ObjFW 上游 ObjC 用例套件（顶层 make check -> make -C tests -s run）"
    command: "make check"
    count_note: >-
      count=652 为评审使用的宽松静态口径；precise_count=645 为按 runner 发现规则
      （无参 - (void)testXxx）精确统计的结果
    not_compiled_on_ohos: 15
    not_compiled_reason: >-
      configure 特性探测关闭 6 个文件：OFDDPSocketTests.m / OFIPXSocketTests.m /
      OFSPXSocketTests.m / OFSPXStreamSocketTests.m / OFSCTPSocketTests.m /
      OFWindowsRegistryKeyTests.m（Appletalk、IPX、SCTP 头文件在 OHOS 不存在，
      注册表仅 Windows）
    compiled_on_ohos: 630
    executed_cases: 1242
    executed_classes: 73
    result_on_ohos_aarch64: "1242 passed / 0 failed / 0 skipped"

test_package_tests:
  - file: test_ofhttp.py
    command: "python3 test_ofhttp.py <package_folder>"
    description: >-
      针对本包交付物的消费者验收。所有断言都读 package() 真实打包出的字节或真实
      执行 bin/ofhttp；断言全部收敛在本文件，test_package/conanfile.py 只负责解析
      包目录并按 can_run() 决定是否执行运行期那一半。
    artifact_assertions:
      - "bin/ofhttp 是真实文件，且 mode 位含可执行位（读 mode 位而非 os.access，"
      - "  因为 uid 0 下 os.access 会对 0644 也返回真）"
      - "bin/ofhttp 是 ELF64 + little-endian，e_machine=183(AArch64)、e_type∈{EXEC,DYN}，"
      - "  防止打包进 host/x86 残留物"
      - "解析 PT_DYNAMIC/DT_NEEDED，断言不含 libobjfw*/libobjfwtls/libssl/libcrypto/"
      - "  libstdc++/libgcc_s，即『消费者只需 C 运行时』是被验证的"
      - "share/ofhttp/localization/localizations.json 把 de/deutsch/german 映射到 de，"
      - "  de.json 含 OFHTTP.m/ProgressBar.m 真正经 OF_LOCALIZED 渲染的 8 个 message id"
      - "  （这两个文件是 ObjFW 的 JS 对象字面量而非 JSON，故按其真实格式解析）"
      - "share/man/man1/ofhttp.1 含上游写法 .TH ofhttp"
      - "licenses/COPYING 与 COPYING.LESSER 含 GNU LGPL 正文且非空壳"
    runtime_assertions:
      - "`ofhttp --version` 退出码 0；stdout 逐行含上游 version() 的四行原文"
      - "（`ofhttp 1.5.7` / `(ObjFW 1.5.7)` / `<https://objfw.nil.im/>` / `Licensed under the LGPL 3.0 <...>`）"
      - "  且 **stderr 必须为空**（上游 version() 只写 OFStdOut）——「横幅打到 stderr」"
      - "  因此被拒，这是 5 条断言里唯一能区分 stdout/stderr 的一条"
      - "`ofhttp --help` 退出码 0；stdout 含上游 14 条选项及原始列对齐写法"
      - "  （`-b  --body=` … `-O  --detect-filename` … `--ignore-status` … `--version`）"
      - "  且 stderr 的 usage 横幅必须回显**本进程实际执行的绝对路径**"
      - "  （上游 %[prog] 取 argv[0] 原样，固定横幅的 stub 无法复现这一点）"
      - "回环 HTTP GET：本地服务返回 2128 字节全字节值载荷，ofhttp -o 落盘内容逐字节相等"
      - "`-H` 自定义请求头 X-Ofhttp-Probe 被服务端回显并落盘，值完全一致"
      - "HTTP 404 默认退出码非 0；加 --ignore-status 后退出码 0 且响应体落盘"
    falsifiability:
      command: "python3 test_ofhttp.py <package_folder> --self-test"
      runtime_command: >-
        同一命令的后半段：把 5 条运行期断言分别指向两个『exit 0 的冒充者』——
        一个完全沉默，一个把 --version 横幅原样打到 stderr（内容对、流错），
        共 5x2=10 例，要求全部拒收。任一条接受了任一 stub 即报 ASSERTION IS A NO-OP。
        写完 stub 先探测一次：必须 rc=0 且 stdout 为空，任何会打到 stdout 的冒充者
        在被当作证伪器之前先被拒掉（否则一个"会打印横幅"的 stub 会被误当成证伪器）。
      description: >-
        复制真实包 13 份、每份各破坏一处（删 bin/ofhttp / 去可执行位 / 换成 shell 脚本 /
        换成 x86-64 ELF / 注入 libobjfw.so.1 / 注入 libssl.so+libcrypto.so /
        localizations.json 不再映射德语 / localizations.json 不是对象字面量 /
        de.json 不是对象字面量 / de.json 丢掉 TLS message / 换成 wget 的 man page /
        删 COPYING.LESSER / 用非许可文本冒充 COPYING），要求每条断言各自拒收自己
        那一份；任何一条断言接受了坏包即报 ASSERTION IS A NO-OP 并让测试失败。
      cases: 13
      runtime_cases: 10
      total_cases: 23

assertion_count: 11
artifact_assertion_count: 6
runtime_assertion_count: 5
selftest_case_count: 23
selftest_artifact_case_count: 13
selftest_runtime_case_count: 10
