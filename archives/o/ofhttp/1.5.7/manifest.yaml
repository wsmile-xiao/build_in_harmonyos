# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.7"

# 软件名
software: "ofhttp"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ObjFW/ObjFW/archive/refs/tags/1.5.7-release.tar.gz"

  # 源码校验和
  sha256: "2febf4c2012f058eb1e4f1574ed9e9e7315478f9dc22362caf80871759c1060c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--enable-runtime"
    - "--disable-shared"
    - "--with-tls=openssl"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/1.1.1w
    # 例如:
    # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

  # 构建阶段真实执行的上游测试
  upstream_test_command: "make check"
  upstream_test_in_build: true

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 说明: config.sub 的 ohos triplet 注入与 configure/config.status 的
# umask 077 -> 022 改写均在 conanfile.py 的 build() 中就地完成
# （_patch_config_sub / _relax_umask），因此不产生 patches/ 文件。
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "tarball 不含 configure，需 autogen.sh + tool_requires(automake, libtool)"
  - "automake --add-missing 会覆盖 config.sub，autogen 后必须重新注入 ohos*"
  - "config.status 内嵌 umask 077，在 HMDFS 上导致 confXXXXXX 不可执行，需改 022"
  - "工具链 PATH 中的失效 triplet 桩会让 AC_CHECK_TOOL 选中坏编译器，需手工固定 OBJC/OBJCPP"
  - "OHOS NDK sysroot 无 unwinder，_Unwind_* 来自 SDK 的 native/llvm/lib/<triple>/libunwind.a"
  # 例如:
  # - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
  # - "内嵌 libuv 需要禁用，使用系统 libuv"
