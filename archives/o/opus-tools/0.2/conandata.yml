      patch_description: "Replace config.guess with version supporting HarmonyOS"
      patch_type: "portability"
    - patch_file: "patches/0002-config.h.in.patch"
      patch_description: "Add HAVE_OPUSURL define to config.h.in"
      patch_type: "portability"
    - patch_file: "patches/0003-config.sub.patch"
      patch_description: "Replace config.sub with version accepting linux-ohos tuples"
      patch_type: "portability"
    - patch_file: "patches/0004-configure.patch"
      patch_description: "Regenerated configure with opusurl optional and HMDFS umask fix"
      patch_type: "portability"
    - patch_file: "patches/0005-configure.ac.patch"
      patch_description: "Make opusurl optional in configure.ac for HarmonyOS"
      patch_type: "portability"
    - patch_file: "patches/0006-src-opusdec.c.patch"
      patch_description: "Add #if HAVE_OPUSURL conditional for opusurl fallback"
      patch_type: "portability"
