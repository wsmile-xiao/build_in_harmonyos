# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: objgraph/3.6.2
homepage: "https://mg.pov.lt/objgraph/"

# 上游测试命令 — 上游自带测试入口即 tests.py（unittest.main(defaultTest='test_suite')），
# 汇集单元测试 + docs/*.txt 的 doctest，共 59 项。
upstream_check_command: "python3 tests.py"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 tests.py（cwd=源码根；经 sitecustomize 修 posix_spawn，PATH 含 graphviz 的 dot，LD_LIBRARY_PATH 含整条依赖链 lib）"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests.py
    source: objgraph-3.6.2/tests.py
    description: >-
      上游自带测试入口，59 项 = 单元测试（unittest TestCase）+ docs/*.txt
      doctest（6 个文件渲染图形，经 graphviz 的 dot 生成 PNG）
    command: "python3 tests.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_objgraph.py
    description: >-
      消费者视角真实 API（R34）：导入 objgraph、校验版本与导出面、
      by_type/count 计数、show_refs/show_backrefs 渲染 .dot 并校验文件、
      get_leaking_objects、at_addrs/safe_repr、
      shortest_path/object_graph 遍历、growth 增量探测
    command: "python3 test_objgraph.py <site-packages-dir>"

# 测试断言总数（实测计数，非近似值）
#   实测 `objgraph 3.6.2 consumer API: 27/27 passed`（27 个硬失败点，
#   任一条失败即 sys.exit(1)）。其中 17 个来自 PUBLIC_API 逐项可调用性校验。
assertion_count: 27

# 上游测试实测结果（R51 如实申报）
upstream_test_note: >-
  实测 Ran 59 tests, 0 failures, 2 skipped。
  2 个 skip 全为上游自身的 Python 2 专用闸
  （@skipIf(sys.version_info[0] > 2, "Python 3 has no unbound methods")，
  tests.py 的 test_short_repr_unbound_method 与 test_edge_label_unbound_method），
  在任何 Python 3 上均不可达 —— 非依赖缺失、非适配缺陷、非本适配可消除。
  其余 57 项真实执行并通过；其中 6 个 doctest 会实际调用 dot 渲染 PNG。
