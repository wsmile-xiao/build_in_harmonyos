# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []
  tool_requires:
    - graphviz/13.1.2
  note: |
    objgraph 本体**零运行时依赖**：整个库是单个顶层模块 objgraph.py
    （纯 Python，无 C 扩展），不 import 任何三方包；graphviz 的 dot
    仅在渲染图像时以子进程调用，属**可选**能力（缺失时退化为只写 .dot）。

    graphviz/13.1.2 已发布 ohpcd（R36 前置确认通过），故按上游
    appveyor.yml 的口径（`choco install graphviz` + `dot -V` 后
    `tox -e py`）正式声明为 **tool_requires**，而非把相关用例 skip 掉。

    为何用 tool_requires 而非 test_requires：dot 是构建/测试期**工具**，
    不是本包 host 运行期依赖。实测 test_requires 会把 graphviz 的整条
    host 依赖链（cairo→fontconfig、pango→harfbuzz、gd、poppler…）并入
    本包图并触发版本冲突：
      ERROR: Version conflict: Conflict between fontconfig/2.18.1.1 and
             fontconfig/2.18.1 in the graph. Conflict originates from cairo/1.18.4
    tool_requires 走 build 上下文，图隔离，无此冲突。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Python 单模块，无二进制产物；不产生
    bindirs，故无需 commands.json，R38 不适用）。
    构建：get(源码) → apply_conandata_patches(空操作) → build() 内真实运行
    上游测试（python3 tests.py）→ package() 仅拷 objgraph.py 到
    lib/python3.12/site-packages。
    package_info() 以 runenv_info/buildenv_info 声明 PYTHONPATH，消费方
    可直接 import objgraph；无 C/C++ 库可链接（cpp_info.libs=[]，R26 不适用）。

