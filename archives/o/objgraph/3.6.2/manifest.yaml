patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues: []
  notes: |
    纯 Python、无平台相关代码、无编译产物，aarch64-ohos 与上游行为一致。
    **未修改任何上游文件**——OHOS 平台缺陷（posix_spawn 不解析 PATH）通过
    build() 注入 sitecustomize 修正，测试文件保持原样。

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 59
  failed: 0
  skipped: 2
  note: |
    上游测试（R51）：入口为上游自带的 `python3 tests.py`
    （unittest.main(defaultTest='test_suite')），实测 **Ran 59 tests,
    0 failures, 2 skipped**，已集成进 build()（upstream_test_in_build: true）。
    2 个 skip 是上游自身的 Python 2 专用闸
    （@skipIf(sys.version_info[0] > 2, "Python 3 has no unbound methods")，
    见 tests.py 的 test_short_repr_unbound_method / test_edge_label_unbound_method），
    在任何 Python 3 上都不可达，非依赖缺失、非适配缺陷。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 平台 CPython 因 _IS_HARMONYOS 强制 subprocess 走 posix_spawn 快速路径，而 posix_spawn 不做 PATH 解析——以**裸名**启动外部程序（如 objgraph 调用 'dot'）即使程序在 PATH 上且可执行，仍抛 FileNotFoundError: [Errno 2] No such file or directory。修法：build() 注入 sitecustomize 设 subprocess._USE_POSIX_SPAWN=False 改走 fork/exec（execvpe 解析 PATH），与 meson 1.11.0.1 同款 (ref: E405, DRAFT-ohos-posix-spawn-sitecustomize-fix)"
  - "上游测试套件若**内嵌 doctest 去 import 本包的 setup.py**（objgraph tests.py 的 doctest_setup_py_works 即 `import setup`），而 setup.py 顶端是 from setuptools import setup，则该用例能否通过**取决于跑测试的解释器是否恰好装了 setuptools**——CI worker 的裸 HNP python 不带它即报 ModuleNotFoundError: No module named 'setuptools'。危害在于**抖动**：装了 setuptools 的 worker 上同一 SHA 全绿（#52272）、没装的必红（#52317/#52318），表现为无代码变更的时红时绿，极易误判为平台故障或 flaky。修法：build() 内先 import setuptools 探测，缺失才 pip install --no-deps --target <build>/_pybootstrap setuptools wheel（清华源）并前置到 PYTHONPATH，装完复检；只装 build 目录、不碰系统 python（pillow/10.4.0、numpy/2.5.2 的 _pybootstrap 同款）(ref: E512, E544)"
  - "Python 包的上游测试若依赖外部可执行程序（objgraph→graphviz dot），应在制品仓确认该程序已发布后声明为 test_requires 并真实运行，而不是 skip 相关用例；graphviz 的 dot 渲染 PNG 还需**整条传递依赖链**的 lib 目录进入 LD_LIBRARY_PATH（仅加 graphviz 自身 lib 会在 -Tpng 时报 Format: \"png\" not recognized），另需 GVBINDIR 指向插件目录 (ref: DRAFT-ohos-posix-spawn-sitecustomize-fix)"

references:
