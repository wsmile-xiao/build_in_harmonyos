# test_package/MANIFEST.yml — oomd 0.5.0 上游测试声明
# CI L0e 门禁要求此文件存在；统计口径见 notes.md「测试口径」。

package: oomd/0.5.0
homepage: "https://github.com/facebookincubator/oomd"

# 上游测试命令（来源：.github/workflows/ci.yml = meson build/ && ninja -C build/
# && ninja -C build/ test；测试注册点在顶层 meson.build 的 core_tests 列表）
upstream_check_command: "meson test"

# conanfile.py build() 内已集成上游测试（随 conan create 真实执行）
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs --num-processes 2 --timeout-multiplier=10"

# 上游测试套件（gtest；顶层 meson.build core_tests，12 套件静态 207 宏 / 运行期 N=208）
# 单位套件计数来自对 *Test.cpp 的 TEST/TEST_F/TEST_P 静态统计（1 个 TEST_P 展开 2 例）。
upstream_tests:
  - file: src/oomd/config/JsonConfigParserTest.cpp
    source: oomd-0.5.0/src/oomd/config/JsonConfigParserTest.cpp
    description: "config 套件 — JSON 配置解析（2 例，fixture 驱动）"
    command: "./build/oomd_config_tests"
  - file: src/oomd/util/FixtureTest.cpp + util/FsTest.cpp + util/ScopeGuardTest.cpp + util/SystemMaybeTest.cpp + util/UtilTest.cpp + util/PluginArgParserTest.cpp
    source: oomd-0.5.0/src/oomd/util/
    description: "util 套件 — Fs/资源解析等（67 例，全部基于内存 fixture，不读真实 /proc 与 cgroupfs）"
    command: "./build/oomd_util_tests"
  - file: src/oomd/CgroupContextTest.cpp
    source: oomd-0.5.0/src/oomd/CgroupContextTest.cpp
    description: "cgctx 套件 — 10 例；其中 MonitorRootHost 读取真实 cgroup2 挂载点（无 cgroup2 时走上游 GTEST_SKIP 分支），其余 9 例用内存 fixture"
    command: "./build/oomd_cgctx_tests"
  - file: src/oomd/OomdContextTest.cpp
    source: oomd-0.5.0/src/oomd/OomdContextTest.cpp
    description: "context 套件 — OomdContext（5 例，内存 fixture）"
    command: "./build/oomd_context_tests"
  - file: src/oomd/LogTest.cpp
    source: oomd-0.5.0/src/oomd/LogTest.cpp
    description: "log 套件 — 日志缓冲（7 例）"
    command: "./build/oomd_log_tests"
  - file: src/oomd/include/AssertTest.cpp
    source: oomd-0.5.0/src/oomd/include/AssertTest.cpp
    description: "assert 套件 — 断言工具（3 例）"
    command: "./build/oomd_assert_tests"
  - file: src/oomd/include/CgroupPathTest.cpp
    source: oomd-0.5.0/src/oomd/include/CgroupPathTest.cpp
    description: "cpath 套件 — cgroup 路径拼接/归一（7 例）"
    command: "./build/oomd_cpath_tests"
  - file: src/oomd/config/ConfigCompilerTest.cpp
    source: oomd-0.5.0/src/oomd/config/ConfigCompilerTest.cpp
    description: "compiler 套件 — 配置 IR 编译（18 例）"
    command: "./build/oomd_compiler_tests"
  - file: src/oomd/plugins/CorePluginsTest.cpp
    source: oomd-0.5.0/src/oomd/plugins/CorePluginsTest.cpp
    description: "plugin 套件 — 全部核心插件行为（74 例，内存 fixture 构造 cgroup 树）"
    command: "./build/oomd_plugin_tests"
  - file: src/oomd/StatsTest.cpp
    source: oomd-0.5.0/src/oomd/StatsTest.cpp
    description: "stats 套件 — 统计 socket（6 例）"
    command: "./build/oomd_stats_tests"
  - file: src/oomd/dropin/DropInServiceAdaptorTest.cpp + dropin/FsDropInServiceTest.cpp
    source: oomd-0.5.0/src/oomd/dropin/
    description: "dropin 套件 — drop-in 配置服务（6 例，临时目录 fixture）"
    command: "./build/oomd_dropin_tests"
  # 第 12 套件（条件编译，本平台不参与构建）：
  # plugins/systemd/SystemdPluginsTest.cpp（2 例）— 上游 meson.build 仅在
  # dependency('libsystemd') 命中时加入 core_tests；制品仓无 libsystemd ⇒
  # SystemdRestart 插件与其测试均不构建，按「跳过项逐条技术原因」记账。

# test_package 中自带的测试（消费者视角，真实执行打包产物）
test_package_tests:
  - file: test.sh
    description: "消费者冒烟 10 断言：--help rc=0/usage/--cgroup-fs、ELF64·小端·AArch64、DT_NEEDED 真链 jsoncpp、etc/oomd/oomd.json 与 man/oomd.1 随包安装"
    command: "bash test.sh <package_folder>"

# 测试断言总数（近似值，静态统计 EXPECT_*/ASSERT_* 宏出现次数）
# 全量 18 个测试文件 = 1163；扣除不参与构建的 systemd 套件 8 处 = 1155。
assertion_count: 1155
