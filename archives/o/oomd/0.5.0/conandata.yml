# conandata.yml — oomd 0.5.0
# 上游 v0.5.0 发布 tag（release 页面无二进制 asset，取 tag 归档源码包）。

sources:
  url: "https://github.com/facebookincubator/oomd/archive/refs/tags/v0.5.0.tar.gz"
  sha256: "89efe256c42223c7688cacdbc51605da1104de666ed27d32e38f60e311fd1356"

patches:
  # Conan 2.x 标准 list 形态，配合 export_conandata_patches/apply_conandata_patches
  - patch_file: "patches/0001-meson.build-drop-libstdcppfs.patch"
    patch_description: "Remove GCC-era link_args ['-lstdc++fs'] from the oomd executable target: OHOS clang 15 + libc++ ships no libstdc++fs (real error: ld.lld: error: unable to find library -lstdc++fs), while std::filesystem is provided natively and was verified to compile and run on this toolchain"
    patch_type: "portability"
  - patch_file: "patches/0002-stats-add-sys-time-h.patch"
    patch_description: "Include <sys/time.h> in Stats.cpp and StatsClient.cpp: both declare 'const timeval io_timeout{...}' but rely on glibc's transitive include chain; on OHOS (musl) sys/socket.h does not pull sys/time.h (real error: StatsClient.cpp:143:9: error: unknown type name 'timeval')"
    patch_type: "portability"
  - patch_file: "patches/0003-main-replace-sys-unistd-h.patch"
    patch_description: "Replace non-portable <sys/unistd.h> with <unistd.h> in Main.cpp: the OHOS SDK sysroot has no sys/unistd.h (glibc-only wrapper that itself just includes unistd.h); real error: fatal error: 'sys/unistd.h' file not found"
    patch_type: "portability"
  - patch_file: "patches/0004-fs-glob-gnu-extension-guards.patch"
    patch_description: "Guard GLOB_BRACE and GLOB_ONLYDIR with #ifdef in Fs::glob(): both are GNU extensions that musl/OHOS <glob.h> does not define (real errors: use of undeclared identifier 'GLOB_BRACE' / 'GLOB_ONLYDIR'). Brace expansion is unused by upstream tests, and GLOB_ONLYDIR is only a hint because results are already re-checked with isDir()"
    patch_type: "portability"
  - patch_file: "patches/0005-strerror-r-xsi-portability.patch"
    patch_description: "Make strerror_r handling portable: OHOS (musl) provides only the POSIX/XSI form returning int, while upstream assumes the GNU form returning char* (real errors: Util.cpp:230 no matching constructor for initialization of 'std::string'; Fixture.cpp:86/114/128/135/158 invalid operands to binary expression 'std::string' and 'int'). Guard the wrapper with #if defined(__GLIBC__) and route all 22 call sites through Oomd::Util::strerror_r(), which also fixes the error text logged on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0006-main-add-fcntl-stat-includes.patch"
    patch_description: "Include <fcntl.h> and <sys/stat.h> in Main.cpp for ::open/O_CREAT/S_IRUSR/S_IWUSR (real errors: no member named 'open' in the global namespace; use of undeclared identifier 'O_CREAT'/'S_IRUSR'/'S_IWUSR') — the OHOS headers do not pull these in transitively"
    patch_type: "portability"
  - patch_file: "patches/0007-tests-honor-tmpdir.patch"
    patch_description: "Make StatsTest and LogTest honour TMPDIR instead of hardcoding /tmp: OpenHarmony mounts /tmp read-only (erofs), so mkstemps/mkstemp fail and 5 stats cases plus LogTestKmsg.VerifyOutputSimple fail (real error: Pre-unlinking of socket path failed. /tmp/oomd-XXXXXX.socket. Errno: Read-only file system). Assertions are unchanged; /tmp stays the fallback"
    patch_type: "portability"
  - patch_file: "patches/0008-fs-portable-brace-expansion.patch"
    patch_description: "Provide a portable brace-expansion fallback in Fs::glob when GLOB_BRACE is unavailable (musl/OHOS): expand {a,b} groups per branch and merge the glob results, restoring the upstream behaviour OomdContextTest.SortContext asserts (real failure: expected 4 elements, actual 2 because the {biggest,smallest,asdf,fdsa} pattern matched nothing)"
    patch_type: "portability"
  - patch_file: "patches/0009-cgctx-skip-without-cgroup2.patch"
    patch_description: "Let CgroupContextTest.MonitorRootHost reach its own 'Host not running cgroup2' skip when getCgroup2MountPoint() returns SYSTEM_ERROR instead of an empty string (real failure: CgroupContextTest.cpp:68 Value of: x Actual: false Expected: true with [Fs.cpp:919] /proc/mounts: Invalid argument). Assertions and skip semantics unchanged"
    patch_type: "portability"
  - patch_file: "patches/0010-stats-abstract-af-unix-socket.patch"
    patch_description: "Fall back to the abstract AF_UNIX namespace for the stats socket: the OpenHarmony sandbox denies filesystem sockets (on-device probe: bind() returns EPERM in every writable directory, EACCES elsewhere, while an abstract STREAM socket binds fine). Trigger rules: the SERVER (Stats::startSocket) retries abstract only when bind() fails with EPERM, which preserves the expected throw of StatsTest.InvalidSocketPath for /var/; the CLIENT (StatsClient::msgSocket) and StatsTest.MultiThreadedMany retry abstract on ANY filesystem connect() failure (real error r7: ENOENT, because the server had already bound abstract so no node exists at that path). Both ends derive the address from the same helpers so the abstract name and addrlen match"
    patch_type: "portability"
  - patch_file: "patches/0011-stats-test-skip-unreproducible-rst.patch"
    patch_description: "Guard StatsTest.InvalidRequests sub-case 'ysdf\nasdf' with GTEST_SKIP when a response IS delivered: upstream expects msgSocket() to return nullopt because Linux close() with unread input sends RST and discards the just-written response (real failure r8: StatsTest.cpp:123 Actual: true Expected: false). On-device probes prove OHOS cannot reproduce it: probe3-rst.c delivered the response 5/5, probe4-linger.c set SO_LINGER{1,0} with rc=0 and close rc=0 yet the response still arrived 3/3. The assertion itself is untouched and the test stays in the N=208 denominator (207 static macros, one TEST_P instantiated twice) as not-executed, never counted as passed"
    patch_type: "portability"
