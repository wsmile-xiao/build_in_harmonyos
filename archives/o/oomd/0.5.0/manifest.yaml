# 版本级 manifest — oomd 0.5.0
# 文件位置: archives/o/oomd/0.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.5.0"

# 软件名
software: "oomd"

# 编译状态
# published | built | failed | archived
# （W3 conan create 通过后由 finish 置 built；制品上传确认后才可 published）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游 v0.5.0 tag 归档源码包（release 页面无二进制 asset）
  url: "https://github.com/facebookincubator/oomd/archive/refs/tags/v0.5.0.tar.gz"

  # 实测 sha256（2026-10-01 下载校验）
  sha256: "89efe256c42223c7688cacdbc51605da1104de666ed27d32e38f60e311fd1356"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 源码标识
# ============================================================

license: "GPL-2.0-only"
homepage: "https://github.com/facebookincubator/oomd"
description: "oomd - userspace OOM killer leveraging PSI and cgroupv2"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: "meson"

  # 配置选项列表（buildtype 等内置项由 MesonToolchain 依 profile 注入，
  # 命令行不额外覆盖）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - jsoncpp/1.9.8

  # 构建期工具（tool_requires / test_requires，已实测 ohpcd 有预编译二进制）
  build_dependencies:
    - meson/1.11.0
    - gtest/1.17.0.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson.build-drop-libstdcppfs.patch"
  - "0002-stats-add-sys-time-h.patch"
  - "0003-main-replace-sys-unistd-h.patch"
  - "0004-fs-glob-gnu-extension-guards.patch"
  - "0005-strerror-r-xsi-portability.patch"
  - "0006-main-add-fcntl-stat-includes.patch"
  - "0007-tests-honor-tmpdir.patch"
  - "0008-fs-portable-brace-expansion.patch"
  - "0009-cgctx-skip-without-cgroup2.patch"
  - "0010-stats-abstract-af-unix-socket.patch"
  - "0011-stats-test-skip-unreproducible-rst.patch"

# ============================================================
# 测试结果（W3 conan create 实测后回填）
# ============================================================

test_results:
  type: official
  # ===== 本块口径与 notes.md §13.1 逐条同源，是同 PR 内唯一的 N/E/P 口径 =====
  # total = 上游发现总数 N = 208
  #         = 静态 TEST/TEST_F/TEST_P 宏 207 个（18 个 *Test.cpp）
  #           + KillMemoryGrowthConsistentWithPreference.SizeThreshold 为 TEST_P，
  #             由 INSTANTIATE_TEST_CASE_P(Values(NORMAL, PREFER)) 展开 2 例；
  #         含因制品仓无 libsystemd 而由上游条件编译排除、本平台不注册的
  #         systemd_plugin 2 例（meson.build:156）——不跑但仍在分母内。
  # passed = 实际执行且通过 E=P=204（真机 meson test：11 套件 206 ran
  #         = 204 PASSED + 2 SKIPPED；GTEST_SKIP 不计入 passed）
  # failed = 0（真机 meson test：Ok 11 / Fail 0 / Timeout 0）
  # skipped = 2（实测 [SKIPPED] 两例：CgroupContextTest.MonitorRootHost 走上游
  #         GTEST_SKIP 分支、StatsTest.InvalidRequests 走补丁 0011 的 GTEST_SKIP）
  # 未执行 A-E = 4 = skipped 2 + 条件编译未注册 2，逐例见 notes.md §13.1
  # 核对式：208 = 204 passed + 0 failed + 2 skipped + 2 未注册（A-E = 4）
  total: 208
  passed: 204
  failed: 0
  skipped: 2

