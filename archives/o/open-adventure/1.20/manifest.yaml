software: open-adventure
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.20/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.20"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-16"

# 构建系统类型（简写）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.com/esr/open-adventure/-/archive/1.20/open-adventure-1.20.tar.bz2"

  # 源码校验和
  sha256: ""  # TODO: fill after download

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "LIBS=-ledit -lncurses"
    - "CC=clang"
    - "CFLAGS=-fPIC -O2"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libedit/20240808
    - ncurses/6.4

  # 编译器
  cc: clang
  cxx: clang++

