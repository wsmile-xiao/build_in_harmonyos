software: open-adventure
display: "Open Adventure"
description: "经典的 Colossal Cave Adventure 文本冒险游戏的开源重实现版本"
category: game
homepage: "https://gitlab.com/esr/open-adventure"
license: BSD-2-Clause
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Makefile 构建，无 configure 脚本和 install 目标"
    - "需要设置 PKG_CONFIG_PATH 以找到 libedit"
    - "libedit 和 ncurses 静态链接（缺少 .so 符号链接）"
    - "Makefile 无 install 目标，需手动 cp 二进制到 DESTDIR 和本地 prefix"
  common_dependencies:
    - libedit
    - ncurses

# 版本索引
versions:
  "1.20":
    status: published
    build_date: "2026-06-17"
