patches:
  - patch_file: "patches/0001-test_server_ohos_access.patch"
    patch_description: "OHOS 测试接入修复：src/test_server.zig 的 server 端到端用例用 `std.Io.Dir.cwd().access()`（新 std.Io API → faccessat）探测 odiff 可执行文件是否存在，OHOS 上该 access 调用对 cwd 下已安装的 zig-out/bin/odiff 报错，导致用例走 `error.SkipZigTest` 被静默跳过（8/48 未真正执行）；改用 `std.Io.Dir.cwd().statFile(io, ...)`（同 std.Io API 的 fstatat 家族，`dirStatFile` 派发，OHOS 支持，fixture 文件 IO 已证实可行）做存在性探测，不再退回已弃用的 `std.fs.*`。与首版不同，statFile 返回 `!Io.File.Stat`（非 `!void`），其各 catch 块均以 `return ...` 结束（类型 noreturn，满足 langref：catch 右操作数须匹配载荷类型或为 noreturn），但成功路径的 `File.Stat` 值位于语句位置，必须用 `_ =` 显式丢弃否则 Zig 报 `error: value of type 'Io.File.Stat' ignored` 编译失败；故全部 9 处语句统一加 `_ =` 前缀丢弃成功值——odiff 已由 getInstallStep 安装到 cwd 的 zig-out/bin/odiff，statFile 命中后用例真正 spawn --server 执行，实现 48/48 全量执行通过"
    patch_type: "portability"
    sha256: "062738eb5b512dd81ef5d552b54f59647d72c4dfc22d48bedefecf14be3d0b7e"
