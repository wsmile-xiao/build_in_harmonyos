# conandata.yml — odiff 4.5.0
# odiff 是 Zig 项目（build.zig + build.zig.zon，minimum_zig_version=0.16.0），
# 通过 build.zig.zon 声明 imgz 依赖；imgz 又带 libspng/libjpeg-turbo/libtiff/
# zlib/zstd/libwebp 六个兜底依赖（其中 zlib/zstd 是 zig 包装包，二者又各自依赖
# madler/zlib 与 facebook/zstd 源码）。
#
# 真机无法直连 github.com/gitlab.com（ConnectionResetByPeer / ConnectTimeout，
# 见 fancy-cat/flow-control 经验），`zig build` 按 zon url 自动拉取必然失败。故把
# 整棵依赖树（共 9 个依赖包）下载到 deps/，并把各 build.zig.zon 改写为 .path
# 本地依赖，`zig build` 全程离线。
#
# URLs 全部是「有序列表：镜像源在前，官方原始 URL 在后」——真机预检不做 CI 的
# mirror-fallback 重写，直接按 conandata 逐条 URL 尝试。github 用 gh-proxy.com
# 镜像（与 ci/conan/build_and_test.sh 的 get_mirrors 同源，2026-08-06 实测仅
# gh-proxy.com 可用），提供与官方完全一致的归档，sha256 保持不变；官方原始 URL
# 保留在后作为回退。
sources:
  url:
    - "https://gh-proxy.com/https://github.com/dmtrKovalenko/odiff/archive/refs/tags/v4.5.0.tar.gz"
    - "https://github.com/dmtrKovalenko/odiff/archive/refs/tags/v4.5.0.tar.gz"
  sha256: "4b78712394c0f628331a21086615eadb6853d28a30d4dfa188b12d823d3ccec0"

# odiff 的 build.zig.zon 依赖 imgz（git 固定 commit）
imgz:
  url:
    - "https://gh-proxy.com/https://github.com/shreyassanthu77/imgz/archive/4d77943fa6a3ace131a946df508f9bb31c1c3fdb.tar.gz"
    - "https://github.com/shreyassanthu77/imgz/archive/4d77943fa6a3ace131a946df508f9bb31c1c3fdb.tar.gz"
  sha256: "e9ce8c2c506a1dbd8f376eaa8902d65a143a8d2118e6595fd6c8d3be8516c951"

# imgz 的 build.zig.zon 依赖（lazyDependency 消费）
libspng:
  url:
    - "https://gh-proxy.com/https://github.com/randy408/libspng/archive/refs/tags/v0.7.4.zip"
    - "https://github.com/randy408/libspng/archive/refs/tags/v0.7.4.zip"
  sha256: "7a8906b527976f2d926254558351e92a8b229d32f03300489c69f3188d31c86e"

libjpeg_turbo:
  url:
    - "https://gh-proxy.com/https://github.com/libjpeg-turbo/libjpeg-turbo/archive/refs/tags/3.1.2.zip"
    - "https://github.com/libjpeg-turbo/libjpeg-turbo/archive/refs/tags/3.1.2.zip"
  sha256: "6e00419fda381550de184da3c662041e7be11202f80a3ec177954d55221c2757"

# 说明：imgz 的 tiff.zig 以标准 libtiff 布局消费 libtiff（libtiff/ 目录 +
# VERSION/RELEASE-DATE + tif_config.h.cmake.in/tiffconf.h.cmake.in/
# tiffvers.h.cmake.in，跨版本稳定）。imgz 在 build.zig.zon 里把 libtiff 钉在
# gitlab commit 57dd777d…（gitlab.com 被 Cloudflare 拦截；github 镜像无该 commit
# 且不提供归档）。因此改用它钉的 master 最近的官方稳定版 tiff-4.7.2
# （2026-07-03 发布，download.osgeo.org 官方下载站），由 zig 配方以 .path 本地
# 依赖消费，不再使用 zon 的 gitlab url 与 hash。
libtiff:
  url:
    - "https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz"
  sha256: "672bd7d10aee4606171afb864f3570b83340f6a33e2c186dc0512f7145ffdf6a"

