# odiff/4.5.0 test_package — 上游测试声明
# CI 门禁 (build_and_test.sh L0e) 强制要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md

package: odiff/4.5.0
homepage: "https://github.com/dmtrKovalenko/odiff"

# 上游测试审计（结论：存在可执行的 Zig 测试套件，配方在 build() 全量运行）：
# 1) odiff 是 Zig 项目（build.zig），测试分为两套耗时步骤，均由 `zig build test-all`
#    驱动（等价 test + test-integration）：
#    - 单元测试（test step，run_lib_unit_tests）：src/root.zig 导入的库模块里
#      src/terminal_graphics.zig 有 5 个 test "..." 用例。
#    - 集成测试（test-integration step）：build.zig 的 integration_tests_with_io
#      （test_core 11 / test_io_png 6 / test_io_bmp 3 / test_io_jpg 3 /
#      test_io_tiff 3 / test_avx 2 / test_io_webp 3）= 31，加 pure_zig
#      （test_color_delta 4 / test_server 8）= 12，合计 43。
#    总计 48 个 Zig test 用例（test "…" 声明数，源码 src/*.zig，逐文件核对）。
# 2) 集成测试依赖 test/ 目录的图片夹具（test/png、test/jpg、test/tiff、test/bmp、
#    test/aa），随源码归档一起构建，在源码根目录以相对路径读取。
# 3) build.zig 仅在 !is_cross_compiling（本机 target == host aarch64-linux）时挂载
#    test-integration；OHOS 上配方以 `-Dtarget=aarch64-linux-musl` 显式构建
#    （同 arch/os，is_cross_compiling 仍为 false）故集成测试照常可跑。
# 4) Zig 0.16 每个测试二进制成功时输出 "N/N tests passed"（空为 "All 0 tests passed"），
#    配方据此从真机日志确定性汇总计数。
upstream_tests_exist: true
upstream_test_audit: "审计 odiff-4.5.0 源码（github tag v4.5.0，sha256 见 conandata.yml）：src/test_core.zig 11 + test_io_png.zig 6 + test_io_bmp.zig 3 + test_io_jpg.zig 3 + test_io_tiff.zig 3 + test_avx.zig 2 + test_io_webp.zig 3 + test_color_delta.zig 4 + test_server.zig 8 = 43 集成测试；单元测试 src/terminal_graphics.zig 5（经 src/root.zig 的 test step）。合计 48 个 Zig test 用例，均由 `zig build test-all` 执行；图片夹具在 test/ 目录随源码归档。"

upstream_check_command: "zig build test-all -Doptimize=ReleaseSafe"
upstream_test_in_build: true
upstream_test_command: "zig build test-all -Doptimize=ReleaseSafe"

upstream_tests:
  - file: src/terminal_graphics.zig
    source: odiff-4.5.0/src/terminal_graphics.zig
    description: "单元测试（zig build test）：raw chunk size / placement 5 个 test 用例"
    command: "zig build test-all -Doptimize=ReleaseSafe"
  - file: src/test_core.zig
    source: odiff-4.5.0/src/test_core.zig
    description: "集成测试：核心 diff 语义（antialiasing/threshold/ignore/diff color/layout/diff_cols）11 例"
    command: "zig build test-all -Doptimize=ReleaseSafe"
  - file: src/test_io_png.zig
    source: odiff-4.5.0/src/test_io_png.zig
    description: "集成测试：PNG 读写对比 6 例"
    command: "zig build test-all -Doptimize=ReleaseSafe"
  - file: src/test_io_bmp.zig
    source: odiff-4.5.0/src/test_io_bmp.zig
    description: "集成测试：BMP 读写对比 3 例"
    command: "zig build test-all -Doptimize=ReleaseSafe"
  - file: src/test_io_jpg.zig
    source: odiff-4.5.0/src/test_io_jpg.zig
    description: "集成测试：JPG 读写对比 3 例"
    command: "zig build test-all -Doptimize=ReleaseSafe"
  - file: src/test_io_tiff.zig
    source: odiff-4.5.0/src/test_io_tiff.zig
    description: "集成测试：TIFF 读写对比 3 例"
    command: "zig build test-all -Doptimize=ReleaseSafe"
  - file: src/test_avx.zig
    source: odiff-4.5.0/src/test_avx.zig
    description: "集成测试：enable_asm 路径对比 2 例（aarch64 上走 SIMD 使能路径）"
    command: "zig build test-all -Doptimize=ReleaseSafe"
  - file: src/test_io_webp.zig
    source: odiff-4.5.0/src/test_io_webp.zig
    description: "集成测试：WebP 读写对比 3 例"
    command: "zig build test-all -Doptimize=ReleaseSafe"
  - file: src/test_color_delta.zig
    source: odiff-4.5.0/src/test_color_delta.zig
    description: "集成测试：color delta 定点/浮点/向量化对比 4 例"
    command: "zig build test-all -Doptimize=ReleaseSafe"
  - file: src/test_server.zig
    source: odiff-4.5.0/src/test_server.zig
    description: "集成测试：server 模式端到端 8 例"
    command: "zig build test-all -Doptimize=ReleaseSafe"

# Counting unit: 一个 Zig test "…" 用例（test 声明块）。单框架（zig build）且可
# 逐源码解析（src/*.zig 的 test 声明），故 upstream_test_count_method: auto。
# 权威计数以真机 `zig build test-all` 日志中的 HMBS_UPSTREAM_TEST_RESULT 标记为准
# （discovered/executed/passed/skipped 取自各测试二进制汇总与审计总数调和），
# 下方 passed/failed/skipped 为审计预期值，最终以真机日志为准。
#
# 历史缺口（已修复，见 conandata patch 0001-test_server_ohos_access.patch）：
#   先前 odiff 的 src/test_server.zig 全部 8 个 server 端到端用例，用
#   `std.Io.Dir.cwd().access()`（新 std.Io API → faccessat）探测 odiff 可执行文件
#   是否存在；OHOS 上该 access 调用对 cwd 下已安装的 zig-out/bin/odiff 报错，用例
#   因而走进 `error.SkipZigTest` 被静默跳过（8/48 未真正执行），`zig build test-all`
#   虽退出 0 但实际只执行 40/48，造成状态与上游结果的矛盾（rule4：passed 状态与
#   上游结果矛盾）。
#   修复：conandata patch 把存在性探测改为 `_ = std.Io.Dir.cwd().statFile(io, ...)`（同
#   std.Io API 的 fstatat 家族，`dirStatFile` 派发，OHOS 支持，fixture 文件 IO 已证
#   可行；不退回已弃用的 `std.fs.*`）。statFile 返回 `!Io.File.Stat`，成功值在语句
#   位置必须用 `_ =` 显式丢弃，否则 zig 报 `error: value of type 'Io.File.Stat'
#   ignored` 编译失败。odiff 已由 test-integration 依赖的
#   getInstallStep 安装到 cwd 的 zig-out/bin/odiff，statFile 命中后用例真正
#   spawn --server 执行。真机实测（多轮收敛）：8 个 server 端到端用例在 OHOS 上
#   仍因 spawn 自身子进程受限而走 error.SkipZigTest 判跳过（40/48 执行通过、
#   skipped=8），非 OHOS 设备缺陷、平台无关，属 ohos_feature 缺口；配方如实上报
#   skipped 并给出 gaps，status 因有缺口不再标 passed 而是 incomplete（rule4 要求
#   status=passed 等价 passed==discovered 100%）。以下 passed/skipped 为真机实际值。
upstream_test_total: 48
upstream_test_count_method: auto
upstream_test_passed: 40
upstream_test_failed: 0
upstream_test_skipped: 8

# test_package 消费者冒烟测试（真实执行包内 bin/odiff）
test_package_tests:
  - file: test_odiff.py
    description: "R34 反空壳：真实调用 bin/odiff——生成相同/不同两对 BMP，相同图对比期望退出 0（match）、不同图对比期望退出 22（pixel diff）并校验 diff 输出非空；另校验 --version/--help（odiff 经 std.debug.print 写 stderr，故合并校验 stdout+stderr）。diff 输出扩展名用 .png：odiff v4.5.0 的 saveImageWithFormat 仅支持 PNG 输出，其余返回 error.UnsupportedFormat"
    command: "python test_odiff.py <odiff_bin> <workdir>"

# 消费者冒烟断言数（--version/--help/相同图对比/不同图对比/diff 输出校验）
assertion_count: 5
