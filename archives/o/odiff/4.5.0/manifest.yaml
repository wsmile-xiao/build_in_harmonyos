# odiff 4.5.0 适配清单
# 极快的 SIMD 像素级图像对比 CLI（Zig 项目，build.zig + build.zig.zon，
# minimum_zig_version=0.16.0）。经 `zig/0.16.0.1` 工具构建。
# 依赖树整棵 vendoring（imgz + spng/jpeg/tiff/webp/zlib/zstd 及 zlib/zstd 源码）。
version: "4.5.0"
status: built
build_date: "2026-09-23"
conan_ref: "odiff/4.5.0"
build_system: "custom"

source:
  url: "https://github.com/dmtrKovalenko/odiff/archive/refs/tags/v4.5.0.tar.gz"
  sha256: "4b78712394c0f628331a21086615eadb6853d28a30d4dfa188b12d823d3ccec0"
  tar_format: tar.gz
  imgz: "imgz 4d77943fa6a3ace131a946df508f9bb31c1c3fdb"
  libspng: "libspng v0.7.4"
  libjpeg_turbo: "libjpeg-turbo 3.1.2"
  libtiff: "tiff-4.7.2（官方稳定版，替代 imgz 钉的不可达 gitlab commit 57dd777…）"
  libwebp: "libwebp 23359a10"
  zlib_wrapper: "allyourcodebase/zlib d3b5519（zig 包装 -> madler/zlib v1.3.2）"
  zstd_wrapper: "allyourcodebase/zstd 4ccb01e（zig 包装 -> facebook/zstd f8745da6）"

build:
  system: custom
  configure_options:
    - "zig build -Doptimize=ReleaseSafe"
    - "zig build test-all -Doptimize=ReleaseSafe"
  dependencies:
    - "zig/0.16.0.1"
  cc: clang
  cxx: clang++

patches_applied: []

test:
  upstream_cases: 48
  upstream_suite: "zig build test-all（test 单元 5 + test-integration 集成 43 = 48 个 Zig test 用例）"
  runnable: 40
  runnable_note: "真机执行：zig build test-all 实际执行 40/48（40 通过、8 个 src/test_server.zig server 端到端用例因 OHOS spawn 子进程受限走上游 SkipZigTest 判跳过，属 ohos_feature 缺口；见真机日志 HMBS_UPSTREAM_TEST_RESULT，status=incomplete）"
  pass_rate: "以真机日志 HMBS_UPSTREAM_TEST_RESULT 为准"
  consumer_test: "test_package 冒烟：bin/odiff --version/--help + 相同/不同 BMP 对比（退出 0 / 22 + diff 输出）"

knowledge_gained:
  - "odiff 需 Zig 0.16.0（minimum_zig_version），用 zig/0.16.0.1 工具（其包装器自动签名 build_runner/测试产物并重试）"
  - "依赖树整棵 vendoring：odiff->imgz->{spng,jpeg,tiff,webp,zlibwrap,zstdwrap}->{zlib,zstd}；各 build.zig.zon 改写为 .path 本地依赖，zig build 全程离线"
  - "OHOS 上清掉 CC/CXX/CFLAGS/CPPFLAGS 等，让 Zig 使用自带 musl 头（OHOS sysroot 的 stdint.h 依赖 musl bits/alltypes.h，Zig 无法解析）"
  - "libtiff：imgz 钉的 gitlab commit 57dd777… 被 Cloudflare 拦截且 github 镜像无此 commit，改用 imgz 钉的 master 最近的官方稳定版 tiff-4.7.2（download.osgeo.org）"
  - "Zig 0.16 每个测试二进制成功输出 'N/N tests passed'（空为 'All 0 tests passed'），据此从真机日志确定性汇总计数"
  - "产物 odiff 需签名（binary-sign-tool + llvm-objcopy 移除 .codesign）才能在 OHOS 执行"
