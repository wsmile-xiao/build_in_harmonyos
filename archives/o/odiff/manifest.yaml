software: odiff
display: "ODiff"
description: "极快的 SIMD 像素级图像对比命令行工具"
category: utility
homepage: "https://github.com/dmtrKovalenko/odiff"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Zig 项目（minimum_zig_version=0.16.0），用 zig/0.16.0.1 工具构建"
    - "依赖树（imgz + spng/jpeg/tiff/webp/zlib/zstd）整棵 vendoring 到 deps/，改写各 build.zig.zon 为 .path 本地依赖，zig build 全程离线"
    - "OHOS 上清掉 CC/CXX/CFLAGS 等环境变量，让 Zig 使用自带 musl 头"
    - "产物与测试二进制需签名才能在 OHOS 执行"
  common_dependencies:
    - zig

versions:
  "4.5.0":
    status: built
    build_date: "2026-09-23"
    published_as: odiff
