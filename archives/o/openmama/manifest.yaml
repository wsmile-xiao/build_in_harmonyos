software: openmama
display: "OpenMAMA"
description: "Middleware agnostic messaging API (MAMA) with C, C++ and MAMDA bindings, middleware bridges and the upstream tools"
category: middleware
homepage: "https://github.com/finos/OpenMAMA"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake has no HarmonyOS platform module (E092): alias CMAKE_SYSTEM_NAME to Linux so upstream picks the linux platform sources and the UNIX link branch instead of the Windows rpcrt4 one"
    - "Crop the qpid-proton AMQP bridge and the qpidmsg payload: proton is not published for OHOS and those two components are its only consumers (source level audit in the version notes)"
    - "APR-util is not published either; its single real use (apr_uri_parse in the resource pool) is replaced by a local parser that keeps the APR pool lifetime, and APRUTIL_* point at apr so the upstream link line stays resolvable"
    - "This libc has no static recursive mutex initialiser: WSTATIC_MUTEX_INITIALIZER falls back to {{{PTHREAD_MUTEX_RECURSIVE}}}, without which the property lexer lock self deadlocks and mama_open() hangs forever"
    - "OHOS requires a valid code signature on dlopen()ed shared objects and executed binaries, and CMake's install step invalidates it by rewriting the RUNPATH, so the package re-signs lib/*.so and bin/* after installing"
  common_dependencies:
    - "apr/1.7.6.1"
    - "libevent/2.1.13"
    - "e2fsprogs/1.47.4"

versions:
  "6.3.2":
    status: built
    build_date: "2026-09-18"
