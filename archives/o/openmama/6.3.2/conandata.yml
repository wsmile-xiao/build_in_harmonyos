# conandata.yml — openmama 6.3.2
# 官方源：FINOS OpenMAMA 的 release tag 归档（GitHub 自动生成的 tag tarball）。
# sha256 由本地下载后实测（sha256sum），并与 GitHub 重新下载的同一 URL 双源比对一致。

sources:
  6.3.2:
    url: "https://github.com/finos/OpenMAMA/archive/refs/tags/OpenMAMA-6.3.2-release.tar.gz"
    sha256: "5c09b5c73467c4122fe275c0f880c70e4b9f6f8d1ecbaa1aeeac7d8195d9ffef"

patches:
  6.3.2:
    - patch_file: "patches/0001-port-h-posix-portability.patch"
      patch_description: "平台 libc 不提供 GNU 扩展的 _NP 递归锁初始化宏（PTHREAD_RECURSIVE_MUTEX_INITIALIZER_NP / PTHREAD_MUTEX_RECURSIVE_NP），改用标准宏；pthread_t 在本平台是指针类型，INVALID_THREAD 不能为 -1"
      patch_type: "portability"
    - patch_file: "patches/0002-resourcepool-uri-parser.patch"
      patch_description: "APR-util 未在 OHOS 制品仓发布，资源池对其的唯一用途是 apr_uri_parse；补入等价的本地实现 mamaResourcePoolUri_parse（同样由 APR pool 持有结果，scheme/authority/path/query 语义与 apr_uri_t 对齐），并替换 C 侧调用点"
      patch_type: "portability"
    - patch_file: "patches/0003-mamaresourcepool-uri-parser.patch"
      patch_description: "C++ 绑定 MamaResourcePool 中的同一 apr_uri_parse 调用点改用 mamaResourcePoolUri_parse"
      patch_type: "portability"
    - patch_file: "patches/0004-noop-bridge-loadable-name.patch"
      patch_description: "上游 noop 示例桥接的库名写成 mama<rabbitmq>impl，而入口符号是 noopBridge_init、桥接名是 noop，导致 mama_loadBridge 既找不到库也找不到符号；改为 noop 让这个随包发布的 stub 桥接可被加载"
      patch_type: "build-system"
    - patch_file: "patches/0005-mamda-examples-optional-curses.patch"
      patch_description: "MAMDA orderbooks 示例把 curses 当系统必装件（find_package(Curses REQUIRED)），本平台不引入 ncurses；改为可选依赖：装了 curses 才编 bookviewer，否则跳过该示例而不使整个 configure 失败"
      patch_type: "build-system"
    - patch_file: "patches/0006-perf-tools-x86-only.patch"
      patch_description: "性能测试工具 mamaconsumerc_v2 / mamaproducerc_v2 / mamapingpongc 用 x86 rdtsc 内联汇编与 glibc 专有的 M_TRIM_THRESHOLD/M_MMAP_MAX，非 x86 架构无法编译；按 CMAKE_SYSTEM_PROCESSOR 收窄为仅 x86 构建，其余性能工具不受影响"
      patch_type: "build-system"
    - patch_file: "patches/0007-gunittest-gtest-cmake.patch"
      patch_description: "上游 gtest 单测目录补 include(GoogleTest)（gtest_discover_tests 由 CMake 自带模块提供，find_package(GTest) 走 config 模式时不加载），并把单测目标的 C++ 标准抬到 17（上游顶层写死 11，而制品仓 GoogleTest 要求 C++17）"
      patch_type: "build-system"
    - patch_file: "patches/0008-uuid-generate-time-safe.patch"
      patch_description: "本平台 libuuid（e2fsprogs 制品）没有 util-linux 才有的 uuid_generate_time_safe（头文件与库均无），linux wUuid.h 中该入口退回到同族的 uuid_generate_time"
      patch_type: "portability"
    - patch_file: "patches/0009-base-bridge-no-double-join.patch"
      patch_description: "baseBridge_close 对 timer dispatch 线程做了第二次 pthread_join，而 destroyHeap 内部已经 join 过该线程并释放了堆（以及线程描述符），在有 join 后立即归还描述符的 libc（本平台 musl）上会段错误；删掉这次多余的 join"
      patch_type: "portability"
    - patch_file: "patches/0010-thread-destroy-no-double-join.patch"
      patch_description: "wombatThread_destroy 在清理具名线程表项时又 join 了一次线程，而其调用方 mamaDispatcher_destroy 已经先 join 过（同一 pthread_t），musl 下第二次 join 会段错误；该函数本职是表项清理，去掉这次多余的 join"
      patch_type: "portability"
