# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: openmama/6.3.2
homepage: "https://github.com/finos/OpenMAMA"

# 上游测试入口 (CMake + CTest；enable_testing() 在顶层与各 gunittest 子目录)
# gunittest 是 gtest 驱动的单元测试工程，通过 -DWITH_UNITTEST=ON 打开；
# GoogleTest 走制品仓已发布的 gtest/1.17.0.1（配方 build_requirements），
# 由 conanfile.py build() 在真机上执行（见 reports/upstream-tests.md）。
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际存在的测试程序
upstream_tests:
  - file: common/c_cpp/src/gunittest/c/CMakeLists.txt
    source: OpenMAMA-6.3.2-release/common/c_cpp/src/gunittest/c
    description: "UnitTestCommonC：wombat 公共层单元测试（gtest，需 -DWITH_UNITTEST=ON）"
    command: "ctest -R UnitTestCommonC"
  - file: mama/c_cpp/src/gunittest/c/CMakeLists.txt
    source: OpenMAMA-6.3.2-release/mama/c_cpp/src/gunittest/c
    description: "UnitTestMamaC 及 DateTime/Price/FieldCache 等 C 套件（gtest）"
    command: "ctest -R UnitTestMamaC"
  - file: mama/c_cpp/src/gunittest/cpp/CMakeLists.txt
    source: OpenMAMA-6.3.2-release/mama/c_cpp/src/gunittest/cpp
    description: "UnitTestMamaCPP：C++ 绑定单元测试（gtest）"
    command: "ctest -R UnitTestMamaCPP"
  - file: mamda/c_cpp/src/gunittest/CMakeLists.txt
    source: OpenMAMA-6.3.2-release/mamda/c_cpp/src/gunittest
    description: "UnitTestMamda*：MAMDA 层单元测试（gtest）"
    command: "ctest -R UnitTestMamda"

# 未在上游运行的套件（必须逐条给出理由）
upstream_tests_skipped:
  - suite: "gtest 单元测试中打开 MAMA 的 1351 项（ctest 口径 1862 项中的其余部分）"
    reason: "上游以 -m qpid -p qpidmsg 注册这些用例，需要 qpid 中间件桥与 qpidmsg payload；两者都是 qpid-proton 的唯一消费方，而 proton 尚未导入本平台（裁剪路线）。不依赖该中间件的 511 项已执行并通过，逐条归因见 reports/upstream-tests.md"
  - suite: "C# / Java 单元测试"
    reason: "mamaunittestscs 需要 .NET，java_unittests 需要 JDK + gradle，本平台均不可用（WITH_CSHARP/WITH_JAVA=OFF）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_openmama.c
    description: "C API：版本宏/运行时版本一致性；mama_open/mama_close 生命周期；加载随包发布的 noop stub 桥接；qpid 桥接缺失的反向断言（裁剪证据）"
    command: "./test_openmama_c"
  - file: test_openmama_cpp.cpp
    description: "C++ 绑定：Mama::loadBridge/open/getVersion/close 生命周期，验证 libmamacpp 可链接可用"
    command: "./test_openmama_cpp"
  - file: test_openmama_uri.c
    description: "资源池 URI 解析器（替代 apr_uri_parse 的本地实现）：scheme/authority/path/query 按 apr_uri_parse 语义逐形态断言（含 query 紧跟 authority、空 authority、无 authority、fragment 剔除、scheme 大小写）"
    command: "./test_openmama_uri"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 29
