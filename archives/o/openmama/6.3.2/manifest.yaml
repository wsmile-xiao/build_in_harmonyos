# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS libc 没有静态递归互斥量初始化宏（PTHREAD_RECURSIVE_MUTEX_INITIALIZER_NP / PTHREAD_MUTEX_RECURSIVE_NP 都不存在），退回 PTHREAD_MUTEX_INITIALIZER 会让属性词法锁自死锁、mama_open() 永久挂起；正解是 {{{PTHREAD_MUTEX_RECURSIVE}}}（本平台该结构首字段即类型，实测可同线程二次加锁）"
  - "OHOS 上 dlopen 的 .so 与被 exec 的二进制都必须带有效代码签名，而签名是内容哈希：CMake install 会去掉安装产物的 RUNPATH（原地改写字节）从而使签名失效，表现为 dlopen 报 Permission denied；解法是 package() 后对 lib/*.so 与 bin/* 重新 objcopy 去签名节再 binary-sign-tool 签名（仓内 248 处同类先例）"
  - "CMake 在 OHOS 上既不定义 UNIX 也不认识 CMAKE_SYSTEM_NAME=HarmonyOS：上游 `if(UNIX)` 会走到 Windows 分支去链 rpcrt4，`string(TOLOWER ${CMAKE_SYSTEM_NAME} system)` 会拼出不存在的 common/c_cpp/src/c/harmonyos 路径；统一用 -DCMAKE_SYSTEM_NAME=Linux 解决（知识条目 E092，仓内 160 处先例）"
  - "消费方二进制动态链接 SDK 的 libc++_shared.so，而它不在默认搜索路径；测试运行环境需用 clang++ -print-file-name=libc++_shared.so 自省定位后注入 LD_LIBRARY_PATH"
  - "APR-util 未在 OHOS 制品仓发布，但 OpenMAMA 只在资源池的 URI 解析用到 apr_uri_parse 一个符号（C 与 C++ 各一处）；补入等价本地实现并让 APRUTIL_* 指向 apr 包即可，无需引入 apr-util"
  - "上游 noop 示例桥接的库名（mama rabbitmq impl）与入口符号（noopBridge_init）不一致，导致 mama_loadBridge 永远加载不了；改成 BRIDGE_STUB_NAME=noop 后该 stub 桥接可用作 MAMA 生命周期冒烟的 null middleware"
  - "接入老式 gtest 工程（find_package(GTest) + 旧式 GTEST_INCLUDE_DIRS/GTEST_BOTH_LIBRARIES + gtest_discover_tests）时：CMake 自带的 GoogleTest 模块并不会因 config 模式 find_package 而加载，须显式 include(GoogleTest)；且上游若把 CMAKE_CXX_STANDARD 写死在顶层（此处 11），而制品仓 gtest 1.17 要求 C++17，要按目录局部抬标准而不是改全局，避免老 C++ 代码被 C++17 的新规则打死"
  - "本平台 libuuid（e2fsprogs 制品）只有 uuid_generate/uuid_generate_random/uuid_generate_time，util-linux 的 uuid_generate_time_safe 不在其中；引用它的代码需退回同族接口"
  - "上游单测默认以 -m qpid -p qpidmsg 注册（中间件桥和 payload 桥都要，且 payload/qpidmsg 是树内唯一 payload，无替代路线）：补齐 qpid-proton 并打开 WITH_PROTON 后，上游套件在本平台 1862/1862 全绿（另一 67 条为上游自身 DISABLED_ 用例），见 reports/upstream-tests.md"
  - "用本地实现替换某个上游依赖函数时，要照抄被替实现的**实现口径**而不是只对齐语义：apr_uri_parse 是'每个分量各自 apr_pstrmemdup 一份'，若改成在同一个 uri 缓冲里就地写 \\0 切分，authority 后面的 `/` 或 `?` 会被覆写掉，导致 path 退化为空串、query 丢失（两个调用点对合法 URI 全失败）；此类改造必须配逐形态回归测试（test_package/test_openmama_uri.c）"
  - "上游 FindXXX 模块（FindAPR/FindLibevent/FindUUID/FindProton）除 *_ROOT 之外还会搜默认路径，CMake 也会搜由 PATH 推出的前缀（CI profile 把 $HOME/usr/local/bin 放进了 PATH）——在 CI worker 上这会引入 worker 侧的残留库（实测 CI-021 报 `No rule to make target '.../usr/local/lib/libssl.so'`，同代码在 CI-007/CI-020 全绿）。把 APR/LIBEVENT/UUID/PROTON 的库与头路径作为 **cache 变量**交给 CMake（find_* 见 cache 值即跳过搜索）即可让构建自洽于依赖包"
  - "OHOS 的 ld-musl-aarch64.so.1 就是 libc：崩溃 pc 落在 '/system/lib/ld-musl-aarch64.so.1' 里说明问题在 pthread_*/free/malloc 等 libc 函数，而不是动态加载器"
  - "musl 在第一次 pthread_join 时就归还线程描述符，因此『对同一个 pthread_t join 两次』会直接段错误（glibc 上通常只是返回 ESRCH，故这类上游缺陷在 Linux 上长期潜伏）。本库有两处：baseBridge_close 对 timer dispatch 线程重复 join（destroyHeap 内部已 join），以及 wombatThread_destroy 与 mamaDispatcher_destroy 对 dispatcher 线程重复 join；两者在 WITH_PROTON 打开、mama_open() 真正成功之后才第一次被执行到"
  - "上游单测默认以 -m qpid -p qpidmsg 注册，且 mama_loadBridge/mama_loadPayloadBridge/插件加载都是按名字 dlopen：跑 ctest 时必须把构建树内所有含 lib*.so 的目录放进 LD_LIBRARY_PATH（否则加载不到 libmamaqpidimpl.so / libmamaqpidmsgimpl.so / libmamaentnoop.so / libmamaplugindqstrategy.so）。上游自己的 CI 是 make install 后用安装树的 lib 目录解决同一问题"
  - "本机排查无 gdb 时的可用手法（ptrace 被禁、musl 的 backtrace() 返回 0 帧）：LD_PRELOAD 型 SIGSEGV 处理器用 ucontext 取 pc/sp/lr 并 dump /proc/self/maps 做归属；再加生命周期插桩（mama_loadBridge/mama_open/mama_close、dlopen/dlclose、pthread_join）。注意 OHOS 要求 LD_PRELOAD 的 .so 必须签名，且 HMDFS 写读延迟要求改完源码 sleep 后再编译"
