  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "CMAKE_SYSTEM_NAME=Linux（E092：CMake 不识别 HarmonyOS，别名到 Linux；否则 UNIX 未定义，上游会去链 Windows 的 rpcrt4）"
    - "CMAKE_SYSTEM_PROCESSOR=aarch64"
    - "OPENMAMA_VERSION=6.3.2（tarball 无 .git，上游强制要求显式版本）"
    - "WITH_PROTON=ON（qpid-proton/0.38.0 已发布，构建 AMQP 桥接 bridge/qpid 与 qpidmsg payload）"
    - "WITH_BASE_BRIDGE=ON / WITH_NOOP_BRIDGE=ON / WITH_OMPB_BRIDGE=ON"
    - "WITH_CPP=ON / WITH_MAMDA=ON / WITH_EXAMPLES=ON / WITH_TESTTOOLS=ON"
    - "WITH_JAVA=OFF / WITH_CSHARP=OFF / WITH_UNITTEST=ON / WITH_DOC=OFF / WITH_TUTORIALS=OFF（单测用制品仓 gtest/1.17.0.1，见 reports/upstream-tests.md）"
    - "APR_ROOT / APRUTIL_ROOT / APRUTIL_INCLUDE_DIR / APRUTIL_LIBRARY → apr 包（APR-util 未发布，见 notes.md）"
    - "LIBEVENT_ROOT / UUID_DIR → libevent、e2fsprogs 包"
    - "PROTON_ROOT / PROTON_INCLUDE_DIR / PROTON_LIBRARY → qpid-proton 包（FindProton 的头查找会搜 /usr/local，故钉死）"
    - "GTest_ROOT / GTest_DIR / GTEST_INCLUDE_DIRS / GTEST_BOTH_LIBRARIES → gtest 包（上游单测读旧式变量）；CMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST"
    - "CMAKE_POSITION_INDEPENDENT_CODE=ON（静态产物需 PIC）"
  dependencies:
    - "apr/1.7.6.1"
    - "libevent/2.1.13"
    - "e2fsprogs/1.47.4"
    - "qpid-proton/0.38.0（bridge/qpid 与 payload/qpidmsg 的唯一依赖）"
    - "gtest/1.17.0.1（test_requires：仅配方构建期构建/运行上游单测，不进消费者传播面）"
  cc: clang
  cxx: clang++

