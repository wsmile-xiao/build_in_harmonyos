software: osm2pgsql
display: "osm2pgsql"
description: "Tool for loading OpenStreetMap data into a PostgreSQL / PostGIS database"
category: utility
homepage: "https://osm2pgsql.org/"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake invokes the C compiler driver (clang) to link; on OHOS it does not auto-link libc++/libc++abi, so -lc++ -lc++abi must be added at link time."
    - "Upstream includes <lua.hpp>; the Conan lua/5.4.8 package ships only C headers, so a local lua.hpp shim is added via patch."
    - "Module-mode find_package(EXPAT/BZip2/ZLIB/Lua/PostgreSQL) needs explicit *_INCLUDE_DIR/*_LIBRARY and PostgreSQL_ROOT variables (CMakeDeps config files don't populate the legacy module variables)."
    - "Upstream CTest suite: only the NoDB-labeled unit-test binaries can run on HarmonyOS; DB-dependent tests need a live PostgreSQL server + pg_virtualenv."
  common_dependencies:
    - libpq/18.1
    - boost/1.90.0.4
    - lua/5.4.8
    - nlohmann-json/3.11.2
    - zlib/1.3.1.1.1
    - bzip2/1.0.8
    - expat/2.8.2.1

versions:
  "2.3.1":
    status: built
    build_date: "2026-08-19"
    notes: "Full CMake build on HarmonyOS aarch64. All 32 NoDB upstream ctest binaries pass (256 test cases / 2203 assertions); DB-dependent tests not run (no PostgreSQL server on device)."
