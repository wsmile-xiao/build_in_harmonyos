package: osm2pgsql/2.3.1
homepage: "https://osm2pgsql.org/"

# 上游测试命令 (ctest via CMake, BUILD_TESTS=ON)
# 真机实测：仅 NoDB 子集可无 PostgreSQL 运行；32/32 通过，256 个 test cases / 2203 assertions。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest -L NoDB --output-on-failure"

# 上游实际运行的测试程序 (Catch2 单元测试, BUILD_TESTS=ON ctest -L NoDB 子集)
# 真机实测：32 个 NoDB ctest 用例全部执行并通过 (100% tests passed, 0 failed out of 32)。
# 此处列出的 file/source/command 供审计对照；真实执行数与通过数由 build() 中的
# ctest 输出解析产生 (HMBS_UPSTREAM_TEST_RESULT marker)，数字来自 ctest 自身汇总。
upstream_tests:
  - file: test-check-input
    source: osm2pgsql-2.3.1/tests/test-check-input.cpp
    description: "OSM input ordering and id validation (Catch2, NoDB)"
    command: "ctest -L NoDB"
  - file: test-util
    source: osm2pgsql-2.3.1/tests/test-util.cpp
    description: "Utility helpers (Catch2, NoDB)"
    command: "ctest -L NoDB"
  # 其余 30 个 NoDB ctest 二进制同属此子集（见真机 ctest 输出 32 项）；
  # DB 依赖的 test-middle / test-output-* / test-pgsql* 需活动 PostgreSQL 服务器 +
  # pg_virtualenv，HarmonyOS 上未执行，未计入 32。通过数按反馈要求用实际值 (32/32)。

# test_package 中自带的测试 (消费者视角验证二进制可用)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke 测试: osm2pgsql --version / --help + default.style 随包安装检查"
    command: "bash test.sh <osm2pgsql_bin_dir> <osm2pgsql_share_dir>"
  - file: conanfile.py
    description: "Conan test() 入口, 调用 test.sh 实测二进制"
    command: "conan test test_package"

# 测试断言总数 (test.sh 实际检查点: --version 输出 + --help 输出 + default.style 存在且含 node/way)
assertion_count: 3
