version: "2.3.1"
status: built
build_date: "2026-08-19"
conan_ref: osm2pgsql/2.3.1

source:
  url: "https://github.com/osm2pgsql-dev/osm2pgsql/archive/refs/tags/2.3.1.tar.gz"
  sha256: "e90461bd78787fd5cf82f73ac4bc0cfccbc4f498f35dce59eb4d168a380d6ac0"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_TESTS=ON"
    - "WITH_PROJ=OFF"
    - "WITH_LUAJIT=OFF"
  dependencies:
    - libpq/18.1
    - boost/1.90.0.4
    - lua/5.4.8
    - nlohmann-json/3.11.2
    - zlib/1.3.1.1.1
    - bzip2/1.0.8
    - expat/2.8.2.1

patches_applied:
  - "0001-add-lua-hpp-shim.patch"

upstream_tests:
  command: "ctest -L NoDB --output-on-failure"
  test_count: 32
  notes: >
    Upstream registers 62 ctest binaries (374 Catch2 TEST_CASE in source). The 32
    NoDB-labeled binaries are pure unit tests and run without a PostgreSQL server.
    On HarmonyOS all 32 NoDB binaries pass: 256 test cases / 2203 assertions.
    The remaining 30 binaries (test-middle, test-output-*, test-pgsql*, ...) require
    a live PostgreSQL server + pg_virtualenv, which is not present on HarmonyOS, so
    their 114 DB-dependent test cases cannot be executed here.

test_package:
  assertion_count: 3
  description: "Runs the packaged osm2pgsql executable (--version) and verifies the default.style file is shipped under share/osm2pgsql."
