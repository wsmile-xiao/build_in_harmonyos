# 版本级 manifest — opendkim 2.11.0-beta2
# 文件位置: archives/o/opendkim/2.11.0-beta2/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 为 CI 唯一输入，本文件为交叉校验元数据）

# ============================================================
# 必须字段
# ============================================================

version: "2.11.0-beta2"
software: "opendkim"

# 编译状态: published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: "autotools"
conan_ref: "opendkim/2.11.0-beta2"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39：GitHub 官方 tag；
  # SourceForge 无 Beta2 发行包，最新官方发行包为 2.10.3）
  url: "https://github.com/trusteddomainproject/OpenDKIM/archive/refs/tags/rel-opendkim-2-11-0-Beta2.tar.gz"
  # 源码校验和（与 conandata.yml 一致）
  sha256: "b3052047279fe6f114cc36b0080bd3db185ed0cc98363327ac5c53d511850016"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--with-milter=$MILTER_PREFIX"
    - "--with-openssl=$OPENSSL_PREFIX"
    - "--with-tre=$TRE_PREFIX"
    - "--with-unbound=$UNBOUND_SHIM_PREFIX"
    - "--enable-diffheaders"
    - "--disable-filter"
    - "--enable-static"
    - "--disable-shared"

  # 注意：GitHub tag tarball 不含 Makefile.in/ltmain.sh，构建前需
  # libtoolize -> aclocal -> autoheader -> automake -> autoconf 自举
  # （tool_requires automake/1.18 + libtool/2.5.4）。

  dependencies:
    - openssl/3.5.6.1
    - libmilter/8.18.2
    - tre/0.9.0
    - unbound/1.22.0
    - libevent/2.1.12   # unbound 传递依赖，.la shim 需要
    - expat/2.8.2       # unbound 传递依赖，.la shim 需要

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-libopendkim-dkim-dns.c.patch"    # musl 无 _res 全局：RES_USE_DNSSEC 用 __GLIBC__ 守卫
  - "0002-libopendkim-tests-t-testdata.h.patch"  # E002: 测试 KEYFILE /tmp 只读 → 相对路径

# 配方内联修复（生成文件类，refresh-patch 会丢弃，不进 patches/）：
#   - configure 的 AS_TMPDIR umask 077→022 + mktemp 路径 ./confXXXXXX→$TMPDIR（E097）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "GitHub tag tarball 无 Makefile.in：tool_requires automake/1.18 + libtool/2.5.4 自举（abiword-plugin-eml 先例）"
  - "aclocal 必须看到 pkg.m4（PKG_CHECK_MODULES 宏），否则 configure 残留 11 处未展开 AC_MSG_WARN"
  - "unbound conan 包的 libunbound.la dependency_libs 有 DESTDIR 烤死的 //lib/libevent.la：generate() 建 shim 目录重写 .la"
  - "E097: configure tmpdir umask 077 在 HMDFS setgid 目录下 config.status 写 subs1.awk 被拦"
  - "musl stub resolver 无 _res 全局/res_ninit：dkim_res_init 走 res_init() 分支，RES_USE_DNSSEC 用 __GLIBC__ 守卫"
  - "E002: 上游测试 KEYFILE 硬编码 /tmp/testkeys，patch 为相对路径"
  - "E002: z-tag/stub-DNS 测试（t-test52/73/141）经 DKIM_TMPDIR 落临时文件，make check 需注入可写目录"
  - "libbsd 不需要：musl 原生 strlcpy/strlcat，configure AC_CHECK_FUNCS 直接命中"

