# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: opendkim/2.11.0-beta2
homepage: "https://trusteddomainproject.org/"

# 上游测试命令
upstream_check_command: "make -C libopendkim/tests check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C libopendkim/tests check"

# 上游实际运行的测试程序（libopendkim/tests 的 161 个 C 单元测试，
# 本适配实测 161/161 全部通过（conan create 内置 make check，
# DKIM_TMPDIR 指向可写目录后 t-test52/73/141 亦通过），见
# reports/test-report.md）
upstream_tests:
  - file: libopendkim/tests/t-setup.c
    source: OpenDKIM-rel-opendkim-2-11-0-Beta2/libopendkim/tests/t-setup.c
    description: "测试初始化：写本地 keyfile（供 FILE 查询方式使用）"
    command: "./t-setup"
  - file: libopendkim/tests/t-test00.c
    source: OpenDKIM-rel-opendkim-2-11-0-Beta2/libopendkim/tests/t-test00.c
    description: "签名/验证/规范算法/报告类单元测试（161 个 t-test*，代表性列举）"
    command: "make -C libopendkim/tests check"
  - file: libopendkim/tests/t-signperf.c
    source: OpenDKIM-rel-opendkim-2-11-0-Beta2/libopendkim/tests/t-signperf.c
    description: "签名性能基准测试（3 个 t-signperf-*）"
    command: "./t-signperf-sha1"

# opendkim/tests 下 142 个 Lua+miltertest 脚本测试未运行：需要
# miltertest 驱动 + 完整 MTA/libmilter 运行环境（--disable-filter 构建
# 下不可用），属集成级测试，超出库包 CI 范围。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：dkim_init/libfeature/options/sign/header/eoh/body/eom/getsighdr/free/close 完整签名流程 API 冒烟（12 项断言）"
    command: "./test_opendkim"

# 测试断言总数 (近似值, 用于质量评估)
# 161 上游 C 测试（每测试 1-60+ assert）+ 12 test_package 断言
assertion_count: 173
