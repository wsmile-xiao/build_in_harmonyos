version: "1.3.4"
software: oaml
# published | built | failed | archived
status: built
build_date: "2026-10-08"
build_system: cmake

source:
  url: "https://github.com/oamldev/oaml/archive/v1.3.4.tar.gz"
  sha256: "4000dabf043938bcff3069ead1052fb06a77a7004bda67adcc5bc9538d32908f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DENABLE_STATIC=ON"
    - "-DENABLE_SHARED=ON"
    - "-DENABLE_OGG=ON"
    - "-DENABLE_SOXR=ON"
    - "-DENABLE_RTAUDIO=OFF"
    - "-DENABLE_UNITYPLUGIN=OFF"
    - "-DENABLE_TEST=ON"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies:
    - "libvorbis/1.3.7"
    - "libsoxr/0.1.3"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 CMakeLists 写死 cmake_minimum_required(VERSION 2.8)，CMake 4 直接硬拒绝；不必打源码补丁，传 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 即可放行（同类 knowledge_ref: E103）"
  - "OHOS SDK llvm/bin 缺 llvm-ranlib（ohos.toolchain.cmake 硬指过去 → 静态库归档报 inaccessible or not found）；llvm-ranlib 与目标架构无关，用 -DCMAKE_RANLIB 指向宿主 hnp 工具链即可（knowledge_ref: 待入库）"
  - "上游自带的 FindOggVorbis/FindVorbisFile/FindSoxr 模块用裸 find_path/find_library，OHOS 交叉链 FIND_ROOT_PATH=ONLY 下搜不到 conan 依赖，须预置 find 缓存变量指向依赖包真实路径（同类 knowledge_ref: E524）"
  - "上游 FindSoxr.cmake 定义复数 SOXR_INCLUDE_DIRS 而 CMakeLists 用单数 ${SOXR_INCLUDE_DIR}（单复数错配），且 CMakeLists 不把 OGG include 加入编译（vorbis/codec.h 包含 ogg/ogg.h）——都可在配方层用缓存变量/CFLAGS 修复，免源码补丁（同类 knowledge_ref: E524）"
  - "oaml 消费者必须先 SetAudioFormat 再 PlayTrack：否则 OpenFile 的 soxr 分支按 GetSampleRate()==0 计算 totalSamples=0 → HasFinished 恒真 → 每帧重开文件、恒静音（上游 oamlTest 的 InitAudioDevice 内含 SetAudioFormat，故上游未暴露）（同类 knowledge_ref: E285）"
  - "oamlAudioFile::Load 预加载路径在 clean EOF 时失败：wavFile::Read 在数据块读完后的下一次调用于 EOF 读块头失败返回 -1，Load 判 OAML_ERROR；流式混音路径不受影响（knowledge_ref: 待入库）"
  - "oaml MixToBuffer(buffer,size) 的 size 语义是采样点数（frames*channels，与 RtAudio 回调 nBufferFrames*2 一致），不是字节数（同类 knowledge_ref: E285）"
  - "oaml.defs 是 tinyxml2 解析的 XML：根 <track> 为老式格式，audio 不写 <type> 即主循环；消费者用例可在运行时生成 wav+defs 实现无外部数据的自包含测试（同类 knowledge_ref: E393）"
  - "HMDFS 不支持 FIFO：Unix Makefiles 生成器的 jobserver（mkfifo）报 Operation not permitted 且偶发子进程 spawn 失败 → cmake 配方用 -G Ninja 规避（CI 能力矩阵 ninja ✅）（同类 knowledge_ref: E074）"

patch_generation:
  method: none
  patches_count: 0
