# test_package/MANIFEST.yml
# 上游官方测试声明文件（docs/TEST_QUALITY_SPEC.md / CI L0e）
package: oaml/1.3.4
homepage: "https://github.com/oamldev/oaml"

# 上游测试命令
# 上游无 tests/ 目录、无 ctest/pytest 注册；唯一测试入口是 CMake 开关
# ENABLE_TEST 构建的 oamlTest 可执行文件（src/test.cpp）：交互式 demo，
# 依赖真实音频设备（RtAudio InitAudioDevice）且从 stdin 读命令循环，
# 无任何自动化断言 → 上游自动化测试用例数为 0。
upstream_check_command: "cmake -DENABLE_TEST=ON ... && ./oamlTest"

# conanfile.py build() 中是否集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake --build build-ohos（含 oamlTest 目标，验证上游测试入口可编译）"

# 鸿蒙消费者用例（R51 新增，可运行性验证）
test_package_tests:
  - file: test_oaml.cpp
    description: "鸿蒙消费者用例：Init(defs)+PlayTrack+MixToBuffer 真实解码混音 + 播放状态断言"
    command: "./test_oaml"
assertion_count: 9
