software: ortp
display: "oRTP"
description: "RTP protocol library implementing RFC 3550 for real-time multimedia communications"
category: network
homepage: "https://www.linphone.org/technical-corner/ortp"
license: AGPL-3.0-or-commercial
build_system: cmake

# OHOS 适配知识
ohos_adaptation:
  key_points:
    - "需要将 cmake_minimum_required(VERSION 3.1) 改为 3.5 以兼容 CMake 4.x"
    - "依赖 bctoolbox，需手动编译（cmd-pkgs 无预编译包）"
    - "需添加 -Wno-error=sign-compare 处理 CMSG_NXTHDR 宏类型比较警告"
    - "建议禁用测试程序编译（-DENABLE_TESTS=NO）"
  common_dependencies:
    - bctoolbox/5.5.0
  known_issues:
    - "函数原型声明弃用警告（不影响编译）"
    - "CMSG_NXTHDR 宏类型比较警告（平台头文件定义问题）"

# 版本索引
versions:
