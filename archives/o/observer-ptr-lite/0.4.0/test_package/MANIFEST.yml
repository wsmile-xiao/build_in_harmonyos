package: observer-ptr-lite/0.4.0
homepage: "https://github.com/martinmoene/observer-ptr-lite"
upstream_check_command: "clang++ -std=c++11 -Iinclude -Itest -Dlest_FEATURE_AUTO_REGISTER=1 test/observer-ptr-main.t.cpp test/observer-ptr.t.cpp -o observer_ptr_tests && ./observer_ptr_tests --pass"
upstream_test_in_build: true
upstream_test_command: "./observer_ptr_tests --pass"
upstream_tests:
  - file: observer-ptr.t.cpp
    source: observer-ptr-lite-0.4.0/test/observer-ptr.t.cpp
    description: "lest-based test suite (37 tests) covering observer_ptr construction, access, reset, comparison, hash. Verified passing on OHOS/aarch64."
    command: "./observer_ptr_tests --pass"
test_package_tests:
  - file: test.cpp
    description: "Consumer-side API validation: make_observer, get, deref, reset, comparison. 9 assertions."
    command: "./test_observer_ptr_lite"
assertion_count: 9
