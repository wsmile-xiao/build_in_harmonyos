package: onnx/1.20.0
homepage: "https://onnx.ai"

# 上游测试命令（ONNX_BUILD_TESTS=ON 后由 ctest 驱动，cmake/unittest.cmake 定义 onnx_gtests）
upstream_check_command: "ctest --output-on-failure --no-tests=error"

# conanfile.py build() 中已集成上游测试（仅原生可执行时运行；交叉本地跳过）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error"

# 上游实际运行的测试程序（R51 清点：onnx/test/cpp/*.cc）
upstream_tests:
  - file: onnx/test/cpp/data_propagation_test.cc
    source: onnx-1.20.0/onnx/test/cpp/data_propagation_test.cc
    description: "data propagation gtest 用例"
  - file: onnx/test/cpp/function_context_test.cc
    source: onnx-1.20.0/onnx/test/cpp/function_context_test.cc
    description: "function context gtest 用例"
  - file: onnx/test/cpp/function_get_test.cc
    source: onnx-1.20.0/onnx/test/cpp/function_get_test.cc
    description: "function get gtest 用例"
  - file: onnx/test/cpp/function_verify_test.cc
    source: onnx-1.20.0/onnx/test/cpp/function_verify_test.cc
    description: "function verify gtest 用例"
  - file: onnx/test/cpp/inliner_test.cc
    source: onnx-1.20.0/onnx/test/cpp/inliner_test.cc
    description: "inliner gtest 用例"
  - file: onnx/test/cpp/ir_test.cc
    source: onnx-1.20.0/onnx/test/cpp/ir_test.cc
    description: "ir gtest 用例"
  - file: onnx/test/cpp/op_reg_test.cc
    source: onnx-1.20.0/onnx/test/cpp/op_reg_test.cc
    description: "op reg gtest 用例"
  - file: onnx/test/cpp/parser_test.cc
    source: onnx-1.20.0/onnx/test/cpp/parser_test.cc
    description: "parser gtest 用例"
  - file: onnx/test/cpp/schema_registration_test.cc
    source: onnx-1.20.0/onnx/test/cpp/schema_registration_test.cc
    description: "schema registration gtest 用例"
  - file: onnx/test/cpp/shape_inference_test.cc
    source: onnx-1.20.0/onnx/test/cpp/shape_inference_test.cc
    description: "shape inference gtest 用例"
  - file: onnx/test/cpp/test_main.cc
    source: onnx-1.20.0/onnx/test/cpp/test_main.cc
    description: "gtest main（测试入口）"
  - file: onnx/test/cpp/utf8_conversion_test.cc
    source: onnx-1.20.0/onnx/test/cpp/utf8_conversion_test.cc
    description: "utf8 conversion gtest 用例"
