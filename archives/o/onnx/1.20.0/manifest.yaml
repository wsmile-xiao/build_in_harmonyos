# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "1.20.0"
software: onnx
# published | built | failed | archived
status: built
build_system: cmake
build_date: "2026-09-16"

source:
  url: "https://github.com/onnx/onnx/archive/refs/tags/v1.20.0.tar.gz"
  sha256: "e9e9273cd39d460348aa3e2eb370a444b510e138c5f45dfa86ce50461901257b"
  tar_format: tar.gz

build:
  system: cmake
  # 以下 -D*_DIR 由 conanfile.py generate() 动态写入（protobuf 包 cmake_find_mode=none）
  configure_options:
    - "-DONNX_ML=ON"
    - "-DONNX_BUILD_PYTHON=OFF"
    - "-DONNX_BUILD_TESTS=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_CXX_STANDARD=17"
    - "-DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON"
    - "-DProtobuf_DIR=<protobuf>/lib/cmake/protobuf"
    - "-Dutf8_range_DIR=<protobuf>/lib/cmake/utf8_range"
    - "-Dabsl_DIR=<abseil-cpp>/lib/cmake/absl"
  dependencies:
    - protobuf/33.6.1
    - abseil-cpp/20260107.1
    - zlib/1.3.1
    - googletest/1.17.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "protobuf 注册表包 cmake_find_mode=none，下游必须显式设置 Protobuf_DIR/utf8_range_DIR/absl_DIR（grpc/etcd 同款）"
  - "交叉构建时目标 protoc 为 aarch64，无法在 x86_64 构建机执行；配方支持 ONNX_HOST_PROTOC 指向宿主 protoc，CI 原生构建时回退到目标 protoc"
  - "ONNX 的 ONNX_CUSTOM_PROTOC_EXECUTABLE 分支要求 protobuf::libprotobuf 预先存在，用 CMAKE_PROJECT_INCLUDE 预载 find_package(Protobuf CONFIG)，不改上游源码"
  - "注册表 gtest 包目标名为 gtest::gtest，ONNX 需要 GTest::gtest → 改用 googletest 包（cmake_file_name=GTest），并作为 test_requires"
  - "CMakeDeps 包装的 ONNXConfig 引用不存在的 protobuf::protobuf → 配方 package_info 设 cmake_find_mode=none，消费者用上游 ONNXConfig 并需显式链接 protobuf::libprotobuf"
