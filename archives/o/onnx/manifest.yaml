software: onnx
display: "ONNX"
description: "Open Neural Network Exchange - open format to represent machine learning models"
category: data
homepage: "https://github.com/onnx/onnx"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "依赖 protobuf/33.6.1 与 abseil-cpp/20260107.1，CONFIG 模式提供 protobuf::libprotobuf target"
    - "交叉编译必须使用 host protoc（ONNX_CUSTOM_PROTOC_EXECUTABLE），目标端 protoc 不可在构建机运行"
    - "onnx.proto 系由上游 gen_proto.py + protoc 生成，python 绑定不构建"

versions:
  "1.22.0":
    status: built
    build_date: "2026-09-12"
    source_url: "https://github.com/onnx/onnx/archive/refs/tags/v1.22.0.tar.gz"
