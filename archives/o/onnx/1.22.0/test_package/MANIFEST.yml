package: onnx/1.22.0
homepage: "https://github.com/onnx/onnx"

upstream_check_command: "./onnx_gtests"
upstream_test_in_build: false
upstream_test_command: "onnx_gtests (gtest)"
upstream_test_reason: "ONNX upstream C++ tests (onnx/test/cpp, 15 gtest sources; 111 TEST macros, 108 registered under HarmonyOS) require ONNX_BUILD_TESTS=ON plus googletest, so they are not part of the default package build. They were nonetheless built and executed for real on HarmonyOS PC aarch64 during adaptation: 107/108 passed. The single non-executed case CHECKER.OpenExternalDataTest triggers SIGSYS (Bad system call) under the host seccomp sandbox, unrelated to the adaptation. Python tests are not run by design (Python binding not built)."
upstream_tests:
  - file: onnx/test/cpp/checker_test.cc
    source: onnx-1.22.0/onnx/test/cpp/checker_test.cc
    description: "External data location validation, symlink traversal checks"
    command: "onnx_gtests"
  - file: onnx/test/cpp/shape_inference_test.cc
    source: onnx-1.22.0/onnx/test/cpp/shape_inference_test.cc
    description: "Shape inference engine (schema merge, graph inferencer, custom ops)"
    command: "onnx_gtests"
  - file: onnx/test/cpp/parser_test.cc
    source: onnx-1.22.0/onnx/test/cpp/parser_test.cc
    description: "Model/Graph/Node parsing and printing round-trips"
    command: "onnx_gtests"
  - file: onnx/test/cpp/ir_test.cc
    source: onnx-1.22.0/onnx/test/cpp/ir_test.cc
    description: "IR graph/node APIs"
    command: "onnx_gtests"

test_package_tests:
  - file: test_onnx.cpp
    description: "Constructs a minimal ModelProto (Identity, FLOAT, opset 13), validates with checker::check_model, and round-trips binary serialization (11 runtime assertions)"
    command: "ctest --output-on-failure --no-tests=error"
  - file: CMakeLists.txt
    description: "Consumes the packaged ONNXConfig.cmake via find_package(onnx CONFIG) and links ONNX::onnx together with protobuf::libprotobuf"
    command: "ctest --output-on-failure --no-tests=error"

assertion_count: 11
