version: "1.22.0"
software: "onnx"
status: built
build_date: "2026-09-12"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/onnx/onnx/archive/refs/tags/v1.22.0.tar.gz"
  sha256: "70bb8b25cf31ea9b1d9f94baacfdc8c4fa27a760f9a10f5d93881bc9eede5fbc"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DONNX_BUILD_PYTHON=OFF"
    - "-DONNX_BUILD_TESTS=OFF"
    - "-DONNX_ML=ON"
    - "-DONNX_INSTALL=ON"
    - "-DONNX_USE_PROTOBUF_SHARED_LIBS=OFF"
    - "-DONNX_CUSTOM_PROTOC_EXECUTABLE=<protobuf pkg>/bin/protoc"
    - "-DProtobuf_PROTOC_EXECUTABLE=<protobuf pkg>/bin/protoc"
    - "-DProtobuf_DIR=<protobuf pkg>/lib/cmake/protobuf"
    - "-Dabsl_DIR=<abseil pkg>/lib/cmake/absl"
    - "-Dutf8_range_DIR=<protobuf pkg>/lib/cmake/utf8_range"
  dependencies:
    - "protobuf/33.6.1"
    - "abseil-cpp/20260107.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "onnx 1.22.0 要求 protoc >= 4.25.1（INSTALL.md 明文），制品仓 protobuf 33.6.1 满足"
  - "onnx CMake 优先走 CONFIG 模式探测 protobuf（TARGET protobuf::libprotobuf），需注入 Protobuf_DIR/absl_DIR/utf8_range_DIR 指向包内 config 才能命中，否则回退 FetchContent 自建（交叉编译下不可接受）"
  - "protobuf 33.6.1 包内 protoc 为 OHOS aarch64 目标二进制，同架构构建机上可直接执行，无需单独 host protoc 构建"
  - "onnx 的 pb.cc 由 gen_proto.py + protoc 在构建期生成（python3 -m 调用），构建机需 python3"
  - "ONNX_ML=ON 默认生成 onnx-ml.pb.h 系，onnx_pb.h 通过 ONNX_ML 宏选择包含 onnx-ml.pb.h 或 onnx.pb.h"
  - "Python 绑定（ONNX_BUILD_PYTHON）不构建：目标只是 C++ 库与 onnx.proto 工具"
  - "Conan 配方中不得用裸 conanbuild 作为 save_script 名：与 Conan 聚合脚本 conanbuild.sh 同名冲突会使聚合脚本自 source，递归至栈溢出，表现为 cmake.configure() 处 ConanException Error -11（cmake 零输出 SIGSEGV）；改用 CMake 变量替代 PATH 注入"
  - "onnx 的 find_program(protoc) 分支可用 cache 变量 Protobuf_PROTOC_EXECUTABLE 预置，无需把 protobuf/bin 注入 PATH"
  - "上游 gtest 套件在 HarmonyOS PC aarch64 可真实执行：以制品仓 gtest/1.17.0 经 -DGTest_DIR 增量构建 onnx_gtests，绕过上游 FetchContent 下载，实测 107/108 通过"

patch_generation:
  method: none
  patches_count: 0
