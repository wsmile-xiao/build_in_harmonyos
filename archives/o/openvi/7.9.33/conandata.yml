# conandata.yml — openvi 7.9.33
# 事实源：上游官方 GitHub tag 归档（johnsonjh/OpenVi tag "7.9.33"）。
# 归档形式为 GitHub archive（/archive/refs/tags/<tag>.tar.gz），非 codeload 直连
# （codeload 形式在 CI worker 上曾报 BadZipFile，见 cudd 9c9d764d 记录）。
# sha256 于 2026-09-12 实测核验：
#   3b807837b8458609b37e107fa063160298ee3655998dd8df590885c297af1fd3（723073 B）

sources:
  "7.9.33":
    url: "https://github.com/johnsonjh/OpenVi/archive/refs/tags/7.9.33.tar.gz"
    sha256: "3b807837b8458609b37e107fa063160298ee3655998dd8df590885c297af1fd3"

patches:
  # 上游源码补丁仅一枚：让临时文件名跟随 $TMPDIR。
  # 背景：openvi 把编辑期间的备份文件写死在 "/tmp/vi.XXXXXX"
  # （common/exf.c、ex/ex_filter.c），恢复目录写死在 _PATH_PRESERVE
  # = "/var/tmp/vi.recover"（common/options.c 的 recdir 选项）。HarmonyOS
  # HMFS 把 /tmp 挂为只读，运行期报
  # `Error: Unable to create temporary file: Read-only file system`。
  # 上游不认 $TMPDIR，故打补丁：有 $TMPDIR 用之，无则回退原路径（不改默认行为）。
  # 纯手写 GNUmakefile（非 autotools）本身无需补丁：无 configure/config.h，
  # 通过命令行变量 CC/INCLDS/CURSESLIB/LINKLIBS 覆盖即可交叉编译；
  # ncurses 头文件/静态库来自 Conan 依赖 ncurses/6.6，不写回源码。
  "7.9.33":
    - patch_file: "patches/0001-honor-tmpdir.patch"
      patch_description: "Honor $TMPDIR for the backup temp file and the recovery dir instead of the hard-coded /tmp/vi.XXXXXX and /var/tmp/vi.recover"
      patch_type: "portability"
      patch_source: "HarmonyOS adaptation"
