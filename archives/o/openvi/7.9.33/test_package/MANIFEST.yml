# test_package MANIFEST — openvi 7.9.33
software: openvi
version: "7.9.33"
test_type: cli_functional

# 上游官方测试：无测试套件（无 test/ 或 tests/ 目录、无 check/test
# make 目标、无 .github/workflows）。层1 build() 内做 smoke 自证
#（ex 批处理往返：写入 OPENVI_BUILD_SMOKE_OK → grep -qx 回读）。
# 官方归档: https://github.com/johnsonjh/OpenVi/archive/refs/tags/7.9.33.tar.gz
#（sha256 3b807837…297af1fd3，723073 B，2026-09-12 实测核验）。
upstream_check_command: "make（无 check/test 目标）"
upstream_check_count: 0

# test_package 测试：test.sh 8 项断言式检查，全部走 ex 批处理模式
#（不初始化屏幕，无需 tty/TERM/terminfo，无头 CI 可跑），真正覆盖
# 行编辑缓冲、BSD regex 兼容层、BSD db 快照、文件读写与 BSD setmode。
test_package_tests:
  - "bin/ex 别名按 argv[0] 进入 ex 模式"
  - "ex 批处理新建文件并写入（a / . / wq 往返）"
  - "ex %s 正则替换正确（BSD regex 兼容层）"
  - "ex 1,2d 范围删除并保留剩余行"
  - "ex $a 追加行且既有内容不变"
  - "ex -R 只读模式拒绝写回（文件未被修改）"
  - "xinstall -m 0640 复制且权限位正确（BSD setmode 兼容层）"
  - "bin/vi 副本可运行（vi 模式 -e 进入 ex）"
assertion_count: 8
fixture_count: 0
fixture_origin: "无 fixtures（test.sh 运行时生成测试文件，TMPDIR 指向可写构建目录）"
