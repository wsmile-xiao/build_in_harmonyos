# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯手写 GNUmakefile（非 autotools）：无 configure/config.h/codegen，交叉编译只需命令行变量覆盖 CC/INCLDS/CURSESLIB/LINKLIBS（R33：CC 从 conan conf tools.build:compiler_executables 取）"
  - "上游 PAWK=command -p env PATH=\"$(command -p getconf PATH)\" awk 依赖 getconf + 标准 PATH 探测，在 OHOS 上探测链不可靠；两个 .h 生成规则（ex/ex_def.h、common/options_def.h）只跑 POSIX awk 脚本，故覆盖 PAWK=awk 直接走 PATH 里的 awk（语义等价，不改源码）"
  - "默认 LINKLIBS=-lutil -lncurses：musl 把 openpty(3) 放进 libc（非 glibc 的 libutil），故去掉 -lutil，只链 Conan ncurses 静态库"
  - "argv[0] 决定模式：bin/ex 直接进 ex 模式；vi 模式 getopt 串 \"c:C:eFlRrSt:w:\" 不含 -s，ex 模式串 \"c:C:FlRrSst:vw:\" 才含 s（与 R 只读）——批处理必须走 bin/ex，不能用 bin/vi -e -s"
  - "ex 批处理模式不初始化屏幕（不需要 tty），可在无头 CI worker 上实跑；因此层1 smoke 与 test_package 功能验证都在 ex 模式下进行"
  - "「无 tty」不等于「无 terminfo」：openvi 的程序入口是 cl/cl_main.c 的 main()（不是 common/main.c 的 editor()），它在 editor() 之前无条件 term_init()→setupterm()，失败即 `ex: No terminal database found` + exit 1——ex 批处理模式也必须能定位 terminfo 数据库（取自 Conan ncurses/6.6 自带 share/terminfo；conanbuild 环境不含依赖 runenv，build() 内须显式指过去）"
  - "HarmonyOS HMFS 把 /tmp 挂为只读：openvi 把备份临时文件写死 /tmp/vi.XXXXXX（common/exf.c、ex/ex_filter.c）、恢复目录写死 _PATH_PRESERVE=/var/tmp/vi.recover（common/options.c 的 recdir），上游不认 $TMPDIR → 打 0001-honor-tmpdir.patch 让两者跟随 $TMPDIR（无 $TMPDIR 时回退原路径）"
  - "制品级别名：上游 install 用 ln -s 生成 ex/view，Conan 打包改用同内容副本，规避 symlink 解析差异"
  - "捆绑 xinstall 自带 BSD setmode/parsemode 兼容层（xinstall -m 0640 解析权限位），可独立功能验证"
  - "OpenVi 是 OpenBSD vi/ex（nvi 血统）的独立可移植重打包，自带 BSD db（btree/hash/mpool）/regex/openbsd 兼容层"

patch_generation:
  method: manual
  patches_count: 1

patch_classification:
  - type: portability
    patch: "patches/0001-honor-tmpdir.patch"
    reason: "HarmonyOS HMFS /tmp 只读，上游写死路径不可写；改为跟随 $TMPDIR（可写目录），无 $TMPDIR 时行为不变"
