package: onetbb/2023.1.0
homepage: https://github.com/uxlfoundation/oneTBB
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - name: "oneTBB CTest suite"
    count: 142
    command: "ctest --output-on-failure"
    source: "test/CMakeLists.txt"
    ohos_supported_count: 136
    ohos_skipped:
      - name: "conformance_resumable_tasks"
        reason: "__TBB_RESUMABLE_TASKS is false on OHOS; the upstream test uses an unavailable task suspend/resume API"
      - name: "test_malloc_compliance"
        reason: "the OHOS runtime does not provide the enforceable RLIMIT_AS behavior required by this test"
      - name: "test_malloc_atexit"
        reason: "TBBMALLOC_PROXY_BUILD is disabled because glibc-style allocator interposition is unavailable"
      - name: "test_malloc_overload"
        reason: "TBBMALLOC_PROXY_BUILD is disabled because glibc-style allocator interposition is unavailable"
      - name: "test_malloc_overload_disable"
        reason: "TBBMALLOC_PROXY_BUILD is disabled because glibc-style allocator interposition is unavailable"
      - name: "test_malloc_new_handler"
        reason: "TBBMALLOC_PROXY_BUILD is disabled because glibc-style allocator interposition is unavailable"
test_package_tests:
  - file: test_onetbb.cpp
    description: "oneapi::tbb::parallel_for computes and verifies 1000 independent elements"
    command: "./test_onetbb"
assertion_count: 3
