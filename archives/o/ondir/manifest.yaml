# 软件级 manifest — ondir
# 遵循 ARCHIVE-SPEC v3.0

software: ondir
display: "ondir"
description: "进入/离开目录时自动执行目录专属脚本的环境变更命令行工具"
category: utility
homepage: "https://github.com/alecthomas/ondir"
license: "BSD-3-Clause"
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "手写 Makefile（无 autoconf/configure），无外部库依赖（仅 POSIX regex.h/stat/getcwd）"
    - "Makefile 硬编码 CC=cc / LD=cc，OHOS musl 工具链无 cc，需 patch 改为 clang（Error 127）"
    - "上游仓库无 git tag，0.2.3 以发布提交 cb2f9f8b21e3 为准（R39 codeload 官方源）"
    - "上游无自动化测试套件（Makefile 无 check/test target），L1 上游测试为空"
    - "ondir 仅支持 -V（非 --version），CI L2 冒烟探测 --version/--help 均为非阻塞 warn"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.2.3":
    status: built
    build_date: "2026-09-10"
