# 软件级 manifest — ondir
# 遵循 ARCHIVE-SPEC v3.0

software: ondir
display: "ondir"
description: "进入/离开目录时自动执行目录专属脚本的环境变更命令行工具"
category: utility
homepage: "https://github.com/alecthomas/ondir"
license: "BSD-3-Clause"
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "手写 Makefile（无 autoconf/configure），无外部库依赖（仅 POSIX regex.h/stat/getcwd）"
    - "Makefile 硬编码 CC=cc / LD=cc，OHOS musl 工具链无 cc，需 patch 改为 clang（Error 127）"
    - "上游仓库无 git tag，0.2.3 以发布提交 cb2f9f8b21e3 为准（R39 codeload 官方源）"
    - "上游无自动化测试套件（Makefile 无 check/test target），L1 上游测试为空"
    - "ondir 仅支持 -V（非 --version），CI L2 冒烟探测 --version/--help 均为非阻塞 warn"
    - "git 系版本（0.2.3-git20140220.55279f0）与 0.2.3 的 Makefile 逐字节相同，补丁可整份复用；差异仅 ondir_prompt_hook.fish 新增 + scripts.zsh 改用 chpwd_functions，故 packaging 需多拷一个 fish 钩子"
    - "上游 Makefile 的 VERSION 变量不随提交递增，git 系版本的 -V 仍打印 0.2.3；版本区分只能靠源码 commit sha，不能靠二进制自述"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.2.3":
    status: built
    build_date: "2026-09-10"
  "0.2.3-git20140220.55279f0":
    status: built
    build_date: "2026-09-19"
