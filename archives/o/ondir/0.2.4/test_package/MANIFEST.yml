# test_package MANIFEST — ondir 0.2.4
software: ondir
version: "0.2.4"
test_type: cli_functional

# 上游官方测试：无测试套件（无 tests/ 目录、无 make check 目标、
# 无断言式验证程序）。层1 build() 内做 smoke 验证（ondir -V 版本输出）。
# 官方 dist tarball: https://swapoff.org/files/ondir/ondir-0.2.4.tar.gz
#（sha256 52921cdcf…0bda343a，与 Homebrew formula 声明逐字符一致）。
upstream_check_command: "make（无 check 目标）"
upstream_check_count: 0

# test_package 测试：test.sh 7 项断言（5 项上游功能 + 2 项鸿蒙特有），
# HOME 隔离到可写构建目录（HMFS /etc 只读）。
#   功能检查：enter/leave 规则触发、$ONDIRWD/正则捕获组 $1 展开、
#             -V 版本、无匹配静默。
#   鸿蒙特有：规则路径 `~/...` 经 getenv("HOME") 展开为绝对路径（HMFS
#             /etc 只读且无 /etc/ondirrc，$HOME/.ondirrc 是唯一配置通道，
#             该分支在 OHOS 上是实际生效路径）；省略 dst 参数时经 OHOS
#             bionic getcwd() 补全并正常退出（上游无此判据）。
test_package_tests:
  - "-V 输出版本号 0.2.4"
  - "enter 规则触发 + $ONDIRWD 展开"
  - "leave 规则触发 + $ONDIRWD 展开"
  - "POSIX 正则捕获组 $1 展开"
  - "无匹配规则时无输出（静默性）"
  - "鸿蒙特有：规则 `~/...` 经 $HOME 展开为绝对路径"
  - "鸿蒙特有：单参数形式经 getcwd() 补全 dst 后退出码 0"
assertion_count: 7
fixture_count: 1
fixture_origin: "test.sh 运行时生成的 $HOME/.ondirrc（enter/leave/正则捕获/`~` 折叠四条规则）"
