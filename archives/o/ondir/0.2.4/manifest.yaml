knowledge_gained:
  - "GitHub 镜像仓（alecthomas/ondir）无 tag 且 2014 年停更；官方发布渠道为作者站点 swapoff.org dist tarball——sha256 用 Homebrew homebrew-core Formula/o/ondir.rb 声明值交叉核验（52921cdcf…0bda343a 逐字符一致）"
  - "纯手写 Makefile（非 autotools）：CC 覆盖即编，conf.c+ondir.c 两编译单元，无 configure/config.h/codegen"
  - "上游 Makefile CFLAGS 两行后者生效（-Wall -c -g -DVERSION -DGLOBAL_CONF），USE_ONENTERLEAVE 默认关（上游标注 not recommended）"
  - "ondir 语义：`ondir <old> [new]` 把 enter/leave 规则对应的 shell 命令打印到 stdout 由 shell 钩子 eval，ondir 自身不执行——功能测试断言 stdout 内容而非副作用"
  - "HMFS /etc 只读：GLOBAL_CONF 固化 /etc/ondirrc 但测试经 HOME 隔离写 ~/.ondirrc；/tmp 只读：测试脚本 here-doc 须 TMPDIR 重定向"

