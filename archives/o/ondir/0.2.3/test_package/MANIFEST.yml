# test_package/MANIFEST.yml
# CI script (ci/conan/build_and_test.sh L0e) requires this file to exist.
# R51 — upstream test inventory (audited 2026-09-10 against the 0.2.3 tarball).

package: ondir/0.2.3
homepage: "https://github.com/alecthomas/ondir"

# ── R51 upstream test inventory ─────────────────────────────────────
# ondir 0.2.3 ships NO automated test suite. Evidence collected on the
# upstream tarball (sha256 447f3d9e…c1235a569565732):
#   $ make -n check  -> make: *** No rule to make target 'check'.  Stop.  (exit 2)
#   $ make -n test   -> make: *** No rule to make target 'test'.   Stop.
#   $ ls             -> 19 files, no tests/ directory, no *test* artifact;
#                       Makefile targets are: ondir, clean, install, package,
#                       slackware, rpm, dist, dep.
# => upstream tests: 0 files, 0 registered cases, 0 assertions.
upstream_check_command: "make -n check  # no 'check' target exists (No rule to make target 'check')"

# Upstream tests are not wired into build(): there is nothing to wire.
upstream_test_in_build: false
upstream_test_command: ""

# Upstream ships no runnable test programmes (see inventory above).
upstream_tests: []

# ── test_package tests (consumer-side verification) ─────────────────
# test.sh executes the *installed* ondir binary. 18 assertions.
test_package_tests:
  - file: test.sh
    description: "Executes the installed ondir binary: -V reports 0.2.3; no-arg invocation exits non-zero with the documented usage text; unknown option is rejected; a real enter/leave directory change emits the expected ~/.ondirrc hook commands; the installed man page, shell hooks, example config and docs are present."
    command: "bash test.sh <package_folder>"

# Number of assertions performed by test.sh (approx./exact).
assertion_count: 18
