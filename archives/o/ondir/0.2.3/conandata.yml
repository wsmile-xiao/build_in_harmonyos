# conandata.yml — ondir 0.2.3
# Source: upstream release commit cb2f9f8b21e336165fc0a310d677fda75c8e8513
# ("Release 0.2.3.", 2013-09-19). The repository has no git tags, so the
# release commit is the authoritative source; the tarball is fetched from
# GitHub's official codeload service (official source, R39).

sources:
  url: "https://codeload.github.com/alecthomas/ondir/tar.gz/cb2f9f8b21e336165fc0a310d677fda75c8e8513"
  sha256: "447f3d9ec0c7600d54864d4bd7f92aa0852a30bb66c879880c1235a569565732"

patches:
  # The 0.2.3 Makefile hard-codes CC=cc / LD=cc. The OHOS musl toolchain ships
  # clang only (no `cc` shim), so a plain `make` fails with
  # "make: cc: No such file or directory" (Error 127). The patch points the
  # compiler/linker driver at clang, which the OHOS toolchain provides.
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "0001 Makefile use clang instead of cc"
    patch_type: "portability"
