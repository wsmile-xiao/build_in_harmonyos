knowledge_gained:
  - "ondir 0.2.3-git20140220.55279f0 上游无 git tag：版本 = 提交 55279f0366c32e4295c9f114cbee5ac7776e4d53（R39 codeload 官方源）"
  - "OHOS musl 工具链只提供 clang，没有 cc shim：Makefile 硬编码 CC=cc/LD=cc 会使 make 报 cc: No such file or directory (Error 127)"
  - "ondir 上游无自动化测试套件：Makefile 无 check/test target，需要在 test_package 中补真实功能验证（R34/R51）"
  - "ondir 仅支持 -V（非 --version）：CI L2 冒烟探测 --version/--help 均失败但为非阻塞 warn"

references:
