# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。

package: oaknut/1.2.2-git20240301.94c726c
homepage: "https://github.com/merryhime/oaknut"

upstream_check_command: "ctest -N"

# 上游测试依赖 Catch2 3，本仓库仅有 catch2/2.13.10-r0（v2 不兼容），
# 配方 BUILD_TESTING=OFF 跳过上游 Catch2 测试，不在此声明 upstream_test_in_build。
upstream_test_in_build: false
upstream_test_skipped_reason: "上游 find_package(Catch2 3 REQUIRED) 依赖缺失（本仓库仅 catch2/2.13.10）"

test_package_tests:
  - file: test_oaknut.cpp
    description: >-
      消费者测试：验证 oaknut header-only 库链接、CodeGenerator/VectorCodeGenerator
      指令编码（MOV/RET/ADC/ADD/AND）与 PageOffset 页偏移编码，与上游已知编码向量一致。
      确定性编码断言，无 JIT、无 Catch2。
    command: "./test_oaknut"

assertion_count: 13
