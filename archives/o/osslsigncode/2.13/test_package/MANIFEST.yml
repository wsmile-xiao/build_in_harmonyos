# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: osslsigncode/2.13
homepage: "https://github.com/mtrojnar/osslsigncode"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --timeout 120"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/
    source: osslsigncode-2.13/tests/
    description: "Python-based signing/verification tests (sign, verify, extract-signature, attach-signature, remove-signature, add, extract-data)"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: runs osslsigncode --version to verify binary is functional"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 355
