patches:
  - patch_file: "patches/0001-BaseTools-header.makefile-drop-nostdlib.patch"
    patch_description: "BaseTools 是 host 工具，header.makefile 硬编码的 -nostdlib 会使 host 工具缺失 libc，移除（保留 -fshort-wchar，EDK2 CHAR16 依赖）"
    patch_type: "portability"
  - patch_file: "patches/0002-GenFv-drop-unused-libuuid-include.patch"
    patch_description: "GenFvInternalLib.c 的 uuid/uuid.h include 为历史遗留（无 uuid 函数调用），HarmonyOS 无 libuuid 头文件，移除该 include"
    patch_type: "portability"
  - patch_file: "patches/0003-brotli-types.h-drop-stddef-for-musl-wchar.patch"
    patch_description: "brotli types.h 的 #include <stddef.h> 在 -fshort-wchar + musl 下触发 wchar_t 重定义冲突，用内置 __SIZE_TYPE__ 替代 size_t"
    patch_type: "portability"
  - patch_file: "patches/0004-LzmaCompress-7zTypes.h-drop-stddef-for-musl-wchar.patch"
    patch_description: "LZMA SDK 7zTypes.h 的 #include <stddef.h> 在 -fshort-wchar + musl 下触发 wchar_t 重定义冲突，用内置 __SIZE_TYPE__ 替代 size_t"
    patch_type: "portability"
  - patch_file: "patches/0005-GenFds-bash-wrapper-tools.patch"
    patch_description: "GenFds 生成的 FV makefile 直接调用 GenSec/GenFfs/GenFv/GenFw/EfiRom（bash 脚本），HarmonyOS 拒绝无签名脚本 execve，命令名加 bash 前缀（LaunchCommand 用 shell=True）"
    patch_type: "portability"
  - patch_file: "patches/0006-FfsInfStatement-bash-Trim.patch"
    patch_description: "FfsInfStatement 生成 FV makefile 时 Trim --Vfr-Uni-Offset 直接调用（bash 脚本），加 bash 前缀"
    patch_type: "portability"
  - patch_file: "patches/0007-GenFds-GuidTool-bash.patch"
    patch_description: "GenFds GuidTool 调用 LzmaCompress/TianoCompress 压缩 FVMAIN（bash 脚本），命令名加 bash 前缀"
    patch_type: "portability"
