# ═════════════════════════════════════════════════════════════
# ovmf 0.0.202605 — 版本级 manifest
# OVMF / EDK II UEFI 固件（AArch64 QEMU_EFI.fd）
# 遵循 ARCHIVE-SPEC v2.0
# ═════════════════════════════════════════════════════════════
version: "0.0.202605"
software: "ovmf"
status: built               # 真机 shadow CI 构建 + test_package 验证通过
build_date: "2026-09-17"
build_system: edk2           # EDK II 自定义构建系统（BaseTools + build 脚本）

# 版本语义：0.0.202605 = 上游 edk2-stable202605 tag（2026-05 季度稳定版）
# 上游无 "ovmf" 独立 tag；OVMF 是 edk2 仓库内 OvmfPkg 的俗称。
conan_ref: "ovmf/0.0.202605"

source:
  url: "https://github.com/tianocore/edk2/archive/refs/tags/edk2-stable202605.tar.gz"
  sha256: "871ffdc477ccb64fc82ea6169d8de262a661888bf21b41f70fab62e825648bce"
  commit: "b03a21a63e3bd001f52c527e5a57feddb53a690b"
  tag: "edk2-stable202605"
  tar_format: tar.gz

build:
  system: edk2
  # AArch64 目标（HarmonyOS PC 为 aarch64）：ArmVirtQemu.dsc → QEMU_EFI.fd
  # OvmfPkgX64.dsc 为 X64 目标，aarch64 宿主无可用 X64 工具链（缺 nasm），故不做。
  platform: "ArmVirtPkg/ArmVirtQemu.dsc"
  target_arch: AARCH64
  toolchain: CLANGDWARF     # edk2 中支持 AARCH64 的 clang 工具链族（CLANG38 不支持 AARCH64）
  build_target: RELEASE
  configure_options: []
  dependencies: []
  tool_requires:
    - acpica-unix/20260408   # iASL（ACPI ASL 编译器，固件 ACPI 表编译需要）
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-BaseTools-header.makefile-drop-nostdlib.patch"
  - "0002-GenFv-drop-unused-libuuid-include.patch"
  - "0003-brotli-types.h-drop-stddef-for-musl-wchar.patch"
  - "0004-LzmaCompress-7zTypes.h-drop-stddef-for-musl-wchar.patch"
  - "0005-GenFds-bash-wrapper-tools.patch"
  - "0006-FfsInfStatement-bash-Trim.patch"
  - "0007-GenFds-GuidTool-bash.patch"

knowledge_gained:
  - "ovmf 版本号 0.0.202605 精确对应上游 edk2-stable202605 tag（commit b03a21a63e3bd001f52c527e5a57feddb53a690b）"
  - "OVMF 传统指 OvmfPkg（X64/IA32）；HarmonyOS PC 为 aarch64，等价产物是 ArmVirtPkg/ArmVirtQemu.dsc 构建的 QEMU_EFI.fd"
  - "edk2 的 CLANG38 工具链族不支持 AARCH64；AArch64 的 clang 构建走 CLANGDWARF 工具链族（-target aarch64-linux-gnu -fuse-ld=lld）"
  - "BaseTools 需先 make -C BaseTools 构建 native C 工具；edksetup.sh 必须 source 执行以导出 WORKSPACE/CONF_PATH/PATH"
  - "产物 QEMU_EFI.fd 为 bare-metal 固件映像，非宿主可执行文件/库，按固件资源包打包（resdirs=[res]，无 libs/bindirs）"
  - "GitHub tag archive 不含 git submodule（E150），需在 source() 补齐 brotli×2/openssl/libfdt/mipisyst/oniguruma/libspdm/tpm/mbedtls 共 8 个 submodule"
  - "HarmonyOS 无 gcc（E001），BaseTools 用 clang/clang++/llvm-ar；/usr/bin/env 不可执行（E037），PYTHON_COMMAND 显式传入"
  - "HarmonyOS 拒绝执行无签名脚本（E054/E087），EDK2 wrapper 工具（Trim/GenFw/GenSec/GenFfs/GenFv/GenDepex/VfrCompile/EfiRom/AmlToC/LzmaCompress）须用 bash 显式调用"
  - "BaseTools 的 -fshort-wchar 与 musl 32 位 wchar_t 冲突，brotli/LZMA SDK 的 stddef.h include 需用内置 __SIZE_TYPE__/__PTRDIFF_TYPE__ 替代"

validation:
  level: built
  notes: |
    HarmonyOS PC 真机 shadow CI 完整通过：
    - BaseTools（EDK2 构建工具链）编译成功
    - ArmVirtQemu AArch64 固件全部模块（含完整 openssl）编译成功
    - FVMAIN 固件卷生成成功，QEMU_EFI.fd（3,145,728 bytes）产出
    - test_package 5/5 断言通过（目录/固件存在/非空>=1MB/非宿主ELF/许可证）
    - L0=pass, L1=pass, L2=skip(无 bin/), L4=pass, L5=warn(固件包无 artifacts)
    - Pass rate: 100.0% (1/1)
    - 上游 host-based 单元测试 AArch64 实测（上游审查机器人实测 316 项）：28 个
      二进制，977 通过 + 7 个架构边界失败（通过率 977/984 = 99.3%）；
      上游全部 9 个 host 测试 DSC 均实测运行，无架构专属未运行项
      （UefiCpuPkg MtrrLib 640/CpuPageTableLib 8、DynamicTablesPkg Cedt/Dbg2 各 13、
      SecurityPkg DxeImageVerification 5 均已跑通；7 个失败为 SampleGoogleTestHost
      的 ASan/示例自检在 AArch64 上的架构语义边界，详见 notes.md W6）
