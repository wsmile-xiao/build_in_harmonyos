# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# OVMF/EDK II 无传统“单元测试框架”；上游测试为平台级启动验证（需 QEMU/KVM 真机）。
# 本包的消费者验证聚焦固件资源完整性（QEMU_EFI.fd 存在/非空/格式特征/许可证）。

package: ovmf/0.0.202605
homepage: https://github.com/tianocore/edk2

# 上游测试命令（EDK II 无 make check/ctest；构建本身就是验证）
upstream_check_command: "build -a AARCH64 -t CLANGDWARF -p ArmVirtPkg/ArmVirtQemu.dsc -b RELEASE"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
# EDK II 无独立测试目标：构建产物 QEMU_EFI.fd 即验证结果
upstream_test_command: "build -a AARCH64 -t CLANGDWARF -p ArmVirtPkg/ArmVirtQemu.dsc -b RELEASE"

# 上游测试（EDK II 无单元测试框架，构建成功即上游验证通过）
upstream_tests:
  - file: ArmVirtPkg/ArmVirtQemu.dsc
    source: edk2-stable202605.tar.gz/ArmVirtPkg/ArmVirtQemu.dsc
    description: "AArch64 QEMU UEFI 固件平台构建（产物 QEMU_EFI.fd）"
    command: "build -a AARCH64 -t CLANGDWARF -p ArmVirtPkg/ArmVirtQemu.dsc -b RELEASE"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_ovmf.sh
    description: "QEMU_EFI.fd 固件资源完整性验证（存在/非空/大小/非宿主 ELF/许可证）"
    command: "bash test_ovmf.sh <package>/res/firmware"

# 测试断言总数
assertion_count: 5
