software: objfw
package: objfw/1.5.7
version: "1.5.7"
homepage: "https://objfw.nil.im/"
license: "LGPL-3.0-only"
status: built
build_date: "2026-09-12"
build_system: configure

source:
  url: "https://objfw.nil.im/downloads/objfw-1.5.7.tar.gz"
  sha256: "e637c32731dc07396b812c4019f34d1417a3f7aa39d450b7f27c9bcdc23b3e12"
  tar_format: tar.gz

build:
  system: configure
  configure_options:
    - "--host=aarch64-linux-ohos"
    - "--build=aarch64-unknown-linux-ohos"
    - "--with-tls"
  dependencies:
    - "openssl/3.5.6"
    - "zlib/1.3.1"
  cc: clang
  objc: clang

patches_applied:
  - "0001-config.sub-ohos.patch"
  - "0002-configure-hmdfs-umask.patch"

knowledge_gained:
  - "E011: configure 的 umask 077 需改为 umask 022 解决 HMDFS 权限问题"
  - "E072: config.sub 需要 ohos-linux triplet 支持"
  - "ObjFW 自带 runtime + ObjC 编译需 clang -fobjc-runtime=objfw，OHOS clang 15.0.4 原生支持"

test_summary:
  upstream: "make check: 1243 tests succeeded, 0 failed, 0 skipped"
  local: "make check 实跑全绿（本机 HarmonyOS PC arm64）"
