name: test_package
type: conan-test
package: objfw/1.5.7
test_files:
  - test_package.m
  - run_test.py
description: |
  实际调用 ObjFW API 的 ObjC 测试程序（test_package.m，由 run_test.py 驱动编译与运行）：
  - OFString 创建与 UTF-8 编码（stringWithUTF8String/dataWithEncoding:）
  - OFNumber 装箱与取值（numberWithLongLong/longLongValue）
  - OFArray 集合操作（arrayWithObjects/count）
  - 常量字符串字面量消息发送（containsString: @"..."，覆盖 ObjFW runtime ABI）
  - description 链式调用
  驱动脚本以 -fobjc-runtime=objfw -fconstant-string-class=OFConstantString
  编译（与 cpp_info.objcflags 一致）并实跑断言，返回码 0 为通过。
