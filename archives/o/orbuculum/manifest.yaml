software: orbuculum
display: "orbuculum"
description: "ARM Cortex-M SWO/SWV (ITM) 追踪采集与后处理工具集，含 liborb 库与 11 个命令行工具"
category: utility
homepage: "https://github.com/orbcode/orbuculum"
license: GPL-2.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建；上游用 wrap subproject 在 configure 期下载 libdwarf 源码，需改为 Conan 依赖 dependency('libdwarf') 以离线构建"
    - "PkgConfigDeps 生成 .pc + MesonToolchain 的 pkg_config_path 指向 generators 目录，是消费无 pkg-config 元数据依赖（libdwarf/capstone）的标准手法"
    - "OHOS/HMDFS 文件系统大小写不敏感：禁止用纯大小写别名区分 pkg-config 模块名（SDL2.pc vs sdl2.pc）"
    - "OHOS 无 linux uapi 的 asm/ 子目录头（asm/ioctls.h、asm/termios.h），kernel ABI 头用 asm-generic/ 通用版"
    - "libusb/capstone 的包含路径应写成 <libusb.h> / <capstone/capstone.h>，以适配 Conan 包的 include 布局"
    - "静态链接 libdwarf 时其内部符号 _dwarf_error 会与同名应用函数冲突（ld.lld duplicate symbol）"
    - "上游 Tests/test_cobs.c 相对当前 API 已陈旧（main 原型 + COBSEncode 参数个数），需最小化修补后才能在 build() 中执行"
  common_dependencies:
    - libusb
    - libzmq
    - ncurses
    - libelf
    - libdwarf
    - capstone
    - sdl2

versions:
  - version: "2.2.0"
    status: built
    build_date: "2026-09-24"
