version: "2.2.0"
software: "orbuculum"
status: "built"
build_date: "2026-09-24"
build_system: "meson"

source:
  url: "https://github.com/orbcode/orbuculum/archive/refs/tags/V2.2.0.tar.gz"
  sha256: "6614fba7044aa62e486b29ff4a81d0408d6e88499249bf2b839ccadfc54eec83"
  tar_format: "tar.gz"

build:
  system: "meson"
  configure_options:
    - "default_library=shared"
    - "wrap_mode=nodownload"
  dependencies:
    - "libusb/1.0.27"
    - "libzmq/4.3.5"
    - "ncurses/6.6"
    - "libelf/0.8.13.1"
    - "libdwarf/0.11.1"
    - "capstone/5.0.7"
    - "sdl2/2.32.10"
  cc: "clang"

patches_applied:
  - "0001-meson-build-use-conan-libdwarf.patch"
  - "0002-libusb-include-portable.patch"
  - "0003-capstone-include-portable.patch"
  - "0004-loadelf-drop-libdwarf-symbol-conflict.patch"
  - "0005-nwclient-drop-linux-tcp-header.patch"
  - "0006-orbuculum-linux-header-parity.patch"
  - "0007-test-cobs-modernize-api.patch"

homepage: "https://github.com/orbcode/orbuculum"
license: "GPL-2.0-or-later"

tests:
  upstream:
    command: "clang -D_GNU_SOURCE -IInc Src/cobs.c Tests/test_cobs.c -o test_cobs && ./test_cobs"
    cases: 34
    passed: 34
    note: "11 组 COBS 向量 × 3 条执行路径（33）+ 10000 次随机编解码往返压力用例（1）；实测 0 失败。"
  adapted:
    command: "test_package: ./orbuculum_cobs_test + bash test.sh"
    cases: 53
    passed: 53
    pass_rate: "53/53 (100%)"
    note: "33 上游单元 + 1 上游压力 + 11 CLI 工具可执行 + 8 liborb COBS API 断言。"

knowledge_gained:
  - "上游 meson 用 wrap subproject 拉 libdwarf 源码：改为 Conan 依赖 + PkgConfigDeps 生成 .pc 后即可完全离线构建（meta-file 的 pkg_config_path 默认指向 generators 目录）。"
  - "OHOS 无 linux uapi 的 asm/ 头（asm/ioctls.h、asm/termios.h）；内核 ABI 头应改用通用版 asm-generic/ioctls.h、asm-generic/termbits.h（TCGETS2/struct termios2 同源可用）。"
  - "HMDFS/OHOS 文件系统大小写不敏感（git core.ignorecase=true）：同一目录内不能同时存在 SDL2.pc 与 sdl2.pc，大小写别名方案会自我覆盖。"
  - "libdwarf 静态链接时其内部 _dwarf_error 符号会与同名应用函数冲突（ld.lld duplicate symbol），应用侧死代码需删除。"
  - "libusb/capstone 的 Conan 包 pkg-config 只暴露 include/ 或 include/libusb-1.0；<libusb-1.0/libusb.h> 这类"带包名前缀"的包含只能靠系统 include 根，可移植写法是 <libusb.h> 与 <capstone/capstone.h>。"
  - "上游 Tests/test_cobs.c 相对当前 cobs.h 已陈旧（main 原型非法 + COBSEncode 5 参 vs 7 参），需最小化修补后才能编译运行。"
