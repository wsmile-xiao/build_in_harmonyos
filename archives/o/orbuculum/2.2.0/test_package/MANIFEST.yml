# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: orbuculum/2.2.0
homepage: "https://github.com/orbcode/orbuculum"

upstream_check_command: "clang -D_GNU_SOURCE -IInc Src/cobs.c Tests/test_cobs.c -o test_cobs && ./test_cobs"
upstream_test_in_build: true
upstream_test_command: "clang -D_GNU_SOURCE -IInc Src/cobs.c Tests/test_cobs.c -o test_cobs && ./test_cobs"
upstream_tests:
  - file: "Tests/test_cobs.c"
    source: "orbuculum-2.2.0/Tests/test_cobs.c"
    description: >-
      COBS 编解码单元测试：11 组向量（维基百科 COBS 示例）× 3 条执行路径
      （COBSSimpleDecode / COBSPump / COBSEncode），外加 10000 次随机编解码往返压力。
      程序恒返回 0，判定依据为输出中不出现 FAILED。上游 meson.build 未接入 test() 目标，
      因此由 conanfile.build() 显式编译执行（实测 0 失败）。
    command: "clang -D_GNU_SOURCE -IInc Src/cobs.c Tests/test_cobs.c -o test_cobs && ./test_cobs"

test_package_tests:
  - file: "test_orb.c"
    description: >-
      链接已安装的 liborb，调用公共 COBS API
      （COBSEncode / COBSSimpleDecode / COBSgetFrameExtent / COBSInit / COBSPump /
      COBSGetErrors / COBSDelete）执行 8 项断言（实测 8/8 通过）。
    command: "./orbuculum_cobs_test"
  - file: "test.sh"
    description: >-
      校验 11 个命令行工具均已安装到 bin/，并验证 10 个工具 -V 输出包含 2.2.0
      （orbprofile 为上游"开发预览"版，无版本开关）。
    command: "bash test.sh"

assertion_count: 19
