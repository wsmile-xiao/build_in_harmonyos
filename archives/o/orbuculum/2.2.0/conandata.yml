# conandata.yml — orbuculum 2.2.0
# Upstream: https://github.com/orbcode/orbuculum (tag V2.2.0, commit 21285f8)
# sha256 verified against two independent download paths (codeload.github.com
# and a mirror of github.com/.../archive/refs/tags/V2.2.0.tar.gz) — both match.

sources:
  url: "https://github.com/orbcode/orbuculum/archive/refs/tags/V2.2.0.tar.gz"
  sha256: "6614fba7044aa62e486b29ff4a81d0408d6e88499249bf2b839ccadfc54eec83"

patches:
  - patch_file: "patches/0001-meson-build-use-conan-libdwarf.patch"
    patch_description: "meson.build: consume the Conan-provided libdwarf (generated libdwarf.pc) instead of the download-only wrap subproject (self-contained build, no network fetch of libdwarf-0.7.0), and also accept the canonical lower-case 'sdl2' pkg-config module name for SDL2"
    patch_type: "conan"
  - patch_file: "patches/0002-libusb-include-portable.patch"
    patch_description: "orbtraceIf.h: include <libusb.h> as provided by pkg-config (consistent with the existing OSX/FreeBSD/Win32 branches; <libusb-1.0/libusb.h> only resolves against a system-wide include root)"
    patch_type: "portability"
  - patch_file: "patches/0003-capstone-include-portable.patch"
    patch_description: "loadelf.h: include the canonical <capstone/capstone.h> so the header resolves both from a system install and from the Conan package layout"
    patch_type: "portability"
  - patch_file: "patches/0004-loadelf-drop-libdwarf-symbol-conflict.patch"
    patch_description: "loadelf.c: drop the unused _dwarf_error() helper, which is dead code in the tree and collides with libdwarf's own internal _dwarf_error symbol when libdwarf is linked statically"
    patch_type: "portability"
  - patch_file: "patches/0005-nwclient-drop-linux-tcp-header.patch"
    patch_description: "nwclient.c: drop the unused <linux/tcp.h> include — no TCP_* symbol is used, and on OHOS the linux uapi socket header redefines struct sockaddr_storage already provided by <sys/socket.h>"
    patch_type: "portability"
  - patch_file: "patches/0006-orbuculum-linux-header-parity.patch"
    patch_description: "orbuculum.c: use <libusb.h> and the generic kernel ABI headers <asm-generic/ioctls.h> / <asm-generic/termbits.h> (OHOS ships no asm/ioctls.h or asm/termios.h); keeps the Linux termios2 custom-baud path working"
    patch_type: "portability"
  - patch_file: "patches/0007-test-cobs-modernize-api.patch"
    patch_description: "Tests/test_cobs.c: fix the invalid main() prototype and the two stale 5-argument COBSEncode() call sites (the current prototype takes 7 arguments: front, lfront, back, lback, input, linput, out) so the upstream test can be built and executed"
    patch_type: "portability"
