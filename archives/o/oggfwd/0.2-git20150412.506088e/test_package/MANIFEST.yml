# test_package/MANIFEST.yml — oggfwd 0.2-git20150412.506088e
package: oggfwd/0.2-git20150412.506088e
homepage: "https://icecast.org/"

# 上游无任何测试（源码仅 oggfwd.c / Makefile / oggfwd.1 / README / ChangeLog / LICENSE，无 tests/、无 check/test 目标）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试（消费者视角：编译假 Icecast 服务器 → 运行被测 oggfwd → 校验握手与行为）
test_package_tests:
  - file: test_fake_icecast.c
    description: "oggfwd -h 用法横幅与退出码 1"
    command: "test_fake_icecast <oggfwd>"
  - file: test_fake_icecast.c
    description: "缺少参数被拒绝（Wrong number of arguments）"
    command: "test_fake_icecast <oggfwd>"
  - file: test_fake_icecast.c
    description: "与假 Icecast 服务器真实握手：401 挑战后凭据重试、挂载点、Basic 认证、-n/-g 与 -m 元数据文件覆盖、空输入退出 0"
    command: "test_fake_icecast <oggfwd>"
  - file: test_fake_icecast.c
    description: "连接被拒（端口关闭）报 Error connecting，退出 1"
    command: "test_fake_icecast <oggfwd>"

assertion_count: 11
