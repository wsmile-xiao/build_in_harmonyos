software: overdrive
display: "Overdrive"
description: "OverDrive 有声书下载工具（纯 Bash CLI）：读取图书馆借出的 .odm 文件，申请 license 并下载无 DRM 的 MP3 分段与封面"
category: tool
homepage: "https://github.com/chbrown/overdrive"
license: MIT
build_system: none

ohos_adaptation:
  key_points:
    - "纯 Bash 单文件脚本（overdrive.sh，410 行），无需编译，零 conan requires"
    - "运行时依赖为 6 个 PATH 上的可执行文件：curl、uuidgen、xmllint、iconv、openssl、base64（overdrive.sh:87 PREREQ 清单）"
    - "OHOS aarch64 上六件套均可定位：curl/openssl 与 toybox 的 uuidgen/iconv/base64 在 /usr/bin，xmllint(libxml 2.11.9) 在 /data/service/hnp/bin"
    - "shebang 为 #!/usr/bin/env bash，而 /usr/bin 无 bash，依赖 /data/service/hnp/bin/bash(5.3.0)，该目录在设备与 CI worker 的系统 PATH 及 conan profile buildenv 中"
    - "上游无 LICENSE 文件（README.md:263-266 声明 MIT），故打包文档到 share/doc/overdrive，不伪造 licenses/"
    - "无需任何源码补丁，零平台宏注入（R8）"

versions:
  "2.4.1":
    status: built
    build_date: "2026-09-12"
