package: overdrive/2.4.1
homepage: "https://github.com/chbrown/overdrive"

# 上游测试命令：无。2.4.1 的发布归档只含两个文件
# (tar tzf overdrive-2.4.1.tar.gz -> README.md, overdrive.sh)，
# 仓库根目录亦无 Makefile / configure / CMakeLists.txt / .github/，
# 因此不存在 make check / ctest -N / meson test --list 任何测试清单入口。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: "No upstream automated test suite (release archive contains only README.md + overdrive.sh)"

# 上游确无测试，清点计数为 0（证据见 notes.md「上游测试清点」一节）
upstream_tests: 0

# 上游唯一的可执行测试入口，由 Homebrew core Formula/o/overdrive.rb 的
# test 块声明；本包在 test_package 中逐字复跑（case enoent_download_exit2）：
#   overdrive download fake_file.odm   -> "Specified media file does not exist", exit 2
# 其余 10 个用例覆盖 --version / usage / bash -n / xmllint+sed+awk 元数据链路 /
# 许可证哈希管线（iconv | openssl dgst -sha1 | base64）。
upstream_executable_entry: "overdrive download fake_file.odm (brew test assertion, rc=2)"

test_package_tests:
  - file: test_overdrive.py
    description: "Consumer test: 安装后的 bin/overdrive 存在且可执行、bash -n 语法检查、--version=2.4.1、无参数 usage rc=1、brew 声明的 ENOENT 入口 rc=2、六个运行时 PREREQ 可在 PATH 定位、合成 .odm 的 metadata/info 解析（作者、清洗后标题、12:34+03:26=960 秒）、.metadata 旁文件生成、离线许可证哈希管线产出合法 base64(SHA-1)"
    command: "python3 test_overdrive.py <package_folder>"

assertion_count: 11
