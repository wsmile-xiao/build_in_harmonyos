software: "overdrive"
version: "2.4.1"
status: built
build_date: "2026-09-12"
build_system: none

source:
  url: "https://github.com/chbrown/overdrive/archive/refs/tags/2.4.1.tar.gz"
  sha256: "accc3ec4dab889f6bc003970be102ca7c85290b6516f71c8394e61946fb28860"
  tar_format: tar.gz

# 纯 Bash CLI：无 conan requires。运行时依赖是 PATH 上的可执行文件，
# 在 OHOS aarch64 上全部已具备（见 notes.md 依赖表），故不引入 conan 依赖链。
dependencies:
  required: []
  optional: []

build:
  system: none
  notes: >-
    No compilation. package() copies overdrive.sh to bin/overdrive (rename + chmod
    0755), mirroring Homebrew's `bin.install "overdrive.sh" => "overdrive"`; README.md
    goes to share/doc/overdrive. package_id() clears info because the artefact is
    architecture independent.
  runtime_dependencies:
    - "bash >= 4 (shebang #!/usr/bin/env bash; OHOS: /data/service/hnp/bin/bash 5.3.0)"
    - "curl"
    - "uuidgen"
    - "xmllint (libxml2)"
    - "iconv"
    - "openssl"
    - "base64 (coreutils/toybox)"
    - "sed, awk, tr, seq, cat, head, mkdir, rm (coreutils/sed/gawk 范畴)"

patches_applied: []

test_results:
  type: manual
  upstream_suite_total: 0
  upstream_suite_passed: 0
  upstream_suite_failed: 0
  upstream_suite_skipped: 0
  upstream_suite: >-
    None: the 2.4.1 release archive contains only README.md + overdrive.sh, with no
    Makefile/configure/tests/.github, so no make check / ctest -N list exists (R51
    inventory evidence in reports/test-report.md §1).
  upstream_executable_entry: >-
    overdrive download fake_file.odm -> "Specified media file does not exist", rc=2
    (the assertion of Homebrew core's test block). Executed from the source dir, the
    staging prefix and the installed Conan package: rc=2 every time.
  consumer_test: "test_package/test_overdrive.py — 11 cases, 11 passed, 0 failed, 0 skipped"

artifacts:
  - "bin/overdrive"
  - "share/doc/overdrive/README.md"

knowledge_gained:
  - "OHOS 无 install(1)（toybox 0.8.12 未编该 applet），脚本类包 staging 安装须用 cp + chmod。"
  - "subprocess 带 cwd= 参数启动子进程时，bash 在 HMDFS 上会打印 shell-init: getcwd: cannot access parent directories；测试脚本改用绝对路径、不传 cwd 后噪声消失。"
  - "OHOS /usr/bin 无 bash 与 xmllint：bash 5.3.0 与 xmllint(libxml 2.11.9) 在 /data/service/hnp/bin，依赖设备/CI 系统 PATH 与 conan profile buildenv 注入。"
  - "toybox 0.8.12 的 tr -Cs '[:alnum:] ._-' - 与 GNU 语义一致（相邻非集合字符正确压缩），无需为脚本类包覆盖 PATH。"
  - "上游打包动作用 conan.tools.files.rename 完成 overdrive.sh -> overdrive，避免自写 shell mv。"

knowledge_ref: []
