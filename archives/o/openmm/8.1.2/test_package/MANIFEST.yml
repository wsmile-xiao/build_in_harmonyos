# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: openmm/8.1.2
homepage: "https://openmm.org/"

# Upstream test command
upstream_check_command: "ctest --test-dir build/tests"

# conanfile.py build() method does NOT integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs (from CMake ctest)
upstream_tests:
  - file: TestReferenceHarmonicBondForce.cpp
    source: openmm-8.1.2/platforms/reference/tests/TestReferenceHarmonicBondForce.cpp
    description: "Harmonic bond force reference platform tests"
    command: "./TestReferenceHarmonicBondForce"
  - file: TestReferenceHarmonicAngleForce.cpp
    source: openmm-8.1.2/platforms/reference/tests/TestReferenceHarmonicAngleForce.cpp
    description: "Harmonic angle force reference platform tests"
    command: "./TestReferenceHarmonicAngleForce"
  - file: TestReferenceNonbondedForce.cpp
    source: openmm-8.1.2/platforms/reference/tests/TestReferenceNonbondedForce.cpp
    description: "Nonbonded force reference platform tests"
    command: "./TestReferenceNonbondedForce"

# test_package tests (consumer-perspective verification)
test_package_tests:
  - file: test_openmm.cpp
    description: "Consumer test: create system, add particle, verify version and platforms"
    command: "./test_openmm"

# Approximate assertion count (for quality assessment)
assertion_count: 4
