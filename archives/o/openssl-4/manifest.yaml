software: openssl-4
display: "OpenSSL 4"
description: "Industry-standard TLS/SSL and cryptographic library (OpenSSL 4.x series)"
category: crypto
homepage: "https://www.openssl.org/"
license: "Apache-2.0"
build_system: custom-perl

ohos_adaptation:
  key_points:
    - "使用 Perl Configure（大写C），而非 autotools 的 ./configure"
    - "4.0.1 内置 linux-aarch64 target，无需自定义平台配置"
    - "与 openssl（3.x 系列）是不同包名，上游 4.x 大版本独立成包，制品仓无冲突"
    - "使用 -j1 构建：HMDFS 并行 make 会触发 .d.tmp mv 竞争导致随机失败"
    - "核心加密功能完全可用（AES/RSA/TLS 1.3/QUIC），QUIC 默认启用"
    - "4.0 移除 engines（ENGINESDIR 不复存在），no-engine 恒为禁用态"
    - "许多软件依赖 OpenSSL（Python _ssl、curl、git 等）；下游如需 4.x API 需引用 openssl-4"
  common_dependencies:
    - perl

versions:
  "4.0.1":
    status: built
    build_date: "2026-09-03"
    notes: "OpenSSL 4.0.1 首次适配：保留 3.5.6.1 系列的 getrandom 熵源策略与 musl fd_set 补丁（按 4.0.1 上下文重新生成），新增 no-pinshared 选项"
