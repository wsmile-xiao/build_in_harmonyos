version: "0.6.5"
software: "onak"
status: built
build_date: "2026-09-26"
build_system: "cmake"

source:
  url: "https://deb.debian.org/debian/pool/main/o/onak/onak_0.6.5.orig.tar.xz"
  sha256: "84bfe7fd0fa410e87dd06505d408948c8a2098f5bd00648b9dee37af7167ef39"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DDBTYPE=dynamic"
    - "-DKEYD=OFF"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_BDB=TRUE"
  dependencies:
    - "nettle/3.9.1"
    - "hogweed/3.9.1"
    - "gmp/6.3.0"
  cc: clang

patches_applied:
  - "patches/0001-libonak-ld-drop-insert-after.patch"
  - "patches/0002-cmakelists-use-conan-nettle-hogweed-gmp.patch"
  - "patches/0003-keydb-drop-curl-postgres.patch"
  - "patches/0004-onak-strtouq-to-strtoull.patch"
  - "patches/0005-keydb-fs-hardlink-symlink-fallback.patch"

knowledge_gained:
  - "lld 不支持 libonak.ld 的 INSERT AFTER .text；EXTERN 符号本就由 -Wl,-export-dynamic 导出，删除该指令即可"
  - "onak 用 pkg_check_modules 找 nettle/hogweed；Conan 的 nettle 只导出 libnettle（hogweed 需单独包），改用 CMakeDeps 的 nettle::nettle/hogweed::hogweed/gmp::gmp 更稳"
  - "Conan gmp 准备包未导出 includedirs，需在配方里显式把 <pkg>/include 传给 CMake"
  - "OHOS bionic 无 strtouq → strtoull；**HMDFS 不支持硬链接（link() 返回 EPERM，ln 实测 Operation not permitted）**，fs 后端的词/子钥/skshash 索引回退为 symlink"
  - "上游 runtests 用 ctest sanitytests 接入；本机直接 sh runtests → 47 条脚本调用全过"
