# test_package/MANIFEST.yml
# onak 0.6.5 - upstream test declaration.

package: onak/0.6.5
homepage: "https://www.earth.li/projectpurple/progs/onak.html"

upstream_tests_exist: true
upstream_test_audit: >-
  Upstream wires a shell test suite through CTest: `enable_testing()` adds
  `sanitytests` (the `runtests` script in the source root) and `syntaxtest`
  (`perl -cw onak-mail.pl`).  `runtests` iterates the built keydb backends
  (`keydb/libkeydb_*.so`) and for each runs the matching `t/<backend>-*.t`
  plus every `t/all-*.t`; the .t files drive the compiled `onak` binary.
  With the backends built here (dummy/file/fs/keyring/stacked) this is
  47 script invocations.  Run directly in build(): `sh runtests` ->
  "** all tests succeeded (47)".
upstream_check_command: "sh runtests"
upstream_test_in_build: true
upstream_test_command: "sh runtests"
upstream_tests:
  - file: "t/*.t (27 scripts, 47 invocations across the built backends)"
    description: "keyserver add/get/delete/index/cgi/maxpath/sixdegrees behaviours against the onak binary"

test_package_tests:
  - file: test_onak.sh
    description: "installed onak + packaged file backend: add a key, get by long/short keyid, delete, verify gone"
    command: "sh test_onak.sh"

test_files:
  - path: "test_package/test_onak.sh"
    test_type: "R34"
    assertion_count: 6

test_package_test_count: 1
consumer_assertion_count: 6
upstream_test_cases: 47
assertion_count: 6
