software: onak
display: "onak"
description: "OpenPGP 密钥服务器（含 libonak 与可插拔 keydb 后端）"
category: utility
homepage: "https://www.earth.li/projectpurple/progs/onak.html"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "DBTYPE=dynamic 构建全部后端 .so；KEYD=OFF；关闭 BDB/HKP/PostgreSQL 后端"
    - "依赖 nettle/hogweed/gmp，改用 CMakeDeps imported targets（Conan gmp 未导出 includedirs，配方显式补 include）"
    - "lld 不支持 libonak.ld 的 INSERT AFTER；bionic 无 strtouq；HMDFS 不支持硬链接 → fs 后端索引回退 symlink"
    - "上游 runtests 实跑：47/47 脚本调用通过"
  common_dependencies:
    - "nettle/3.9.1"
    - "hogweed/3.9.1"
    - "gmp/6.3.0"

versions:
  - version: "0.6.5"
    status: built
    build_date: "2026-09-26"
