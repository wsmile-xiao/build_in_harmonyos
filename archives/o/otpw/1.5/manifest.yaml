knowledge_gained:
  - "otpw 1.5 上游是裸 Makefile（M18 烧路径族）：`CC=gcc` 裸赋值须命令行覆盖；`install:` 烧死 Debian PAMLIB=/lib/x86_64-linux-gnu/security 且用 rsync ⇒ package() 自行拷贝产物，不跑 make install"
  - "musl/OHOS 无 PAM 生态（pam_otpw.so 链 -lcrypt -lpam -lpam_misc 且要 PAM 头）⇒ `make TARGETS=otpw-gen` 命令行覆盖裁剪，零补丁交付 CLI；demologin 同样不构建"
  - "`otpw-gen -f <hashfile>` 显式指定哈希文件后跳过 /etc/passwd 的 otpw_getpwuid 查询 ⇒ 在 uid 无 passwd 条目的主机（如鸿蒙 SSH 会话 uid）上正向生成路径照样可执行；不带 -f 则报 'Can't access your passwd database entry!' fatal"
  - "otpw-gen 的 prefix password 从 stdin 读两行（一致才继续）⇒ 测试用 `printf 'pw\\npw\\n'` 喂入；-m 不是免交互模式（实测 -m 仍要求 prefix password）"
  - "熵要求下限 30 bits（`-e 8` 报 'Entropy must be at least 30 bits!'，默认 48）；外部熵命令 `ps lax`/`last | head -50` 在鸿蒙 toybox 环境无输出、/proc/net/tcp 无权限读 ⇒ 实测 -e 30 走通（/dev/urandom 的 head -c 20 在熵源列表内）"
  - "-r 路径（随机密码建议）不经任何数据库/交互，可直接实测输出"
  - "license 定案：otpw.html 声明 GPL v2 or later（README 无 license 段，勿写 MIT/BSD）"
  - "上游 9 个源文件无任何测试（无 test 目录/无 check 目标/无测试框架），清点证据见 reports/upstream-test-scan.txt"

upstream_tests_exist: false
upstream_test_audit: "Audited the otpw 1.5 release tarball (17 files: CHANGES, Makefile, README, TODO, demologin.c, md.c, md.h, otpw-gen.1, otpw-gen.c, otpw-l.c, otpw.c, otpw.h, otpw.html, pam_otpw.8, pam_otpw.c, rmd160.c, rmd160.h). No tests/ directory, no check target in the bare Makefile, no test framework include or runner. Scan kept at reports/upstream-test-scan.txt."

reason: "otpw 1.5 ships no upstream test suite (bare Makefile with no check target, 17 tarball entries, zero test sources). test_package/test.sh therefore adds HarmonyOS consumer assertions that really execute the packaged otpw-gen binary: the full password-list generation path is exercised end to end via `-f <hashfile>` (which skips the /etc/passwd lookup unavailable to this uid) with the prefix password fed on stdin, plus the -r suggestion path, usage/error paths and artifact hygiene checks."
