# test_package/MANIFEST.yml — otpw 1.5
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
#
# 清点结论: 上游 1.5 无任何自动化测试。裸 Makefile 无 check 目标、无 TESTS
# 变量；17 个文件无测试目录/测试文件；六类标记命中的仅为英文单词表
# （otpw-gen.c:239）、MD 测试向量注释（md.c:151）、libc assert() 与 prose。
# Makefile 唯一的 `test-login:` 目标是 `ssh -o
# PreferredAuthentications=keyboard-interactive localhost` —— 给安装者的
# 手工验证指引（依赖本机 sshd 与已装 PAM 模块），不是自动化测试。
# 完整清点: reports/upstream-test-scan.txt

package: otpw/1.5
homepage: "https://www.cl.cam.ac.uk/~mgk25/otpw.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "鸿蒙消费者断言：正向生成（-f + stdin 喂 prefix password + -e 30）、-r 建议路径、usage/坏参数路径、产物面与 TARGETS 裁剪校验"
    command: "/bin/sh test.sh <bindir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 19
