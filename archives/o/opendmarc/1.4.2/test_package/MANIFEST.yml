# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: opendmarc/1.4.2
homepage: "https://www.trusteddomain.org/opendmarc/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（libopendmarc/tests，本地单元测试，无网络依赖）
upstream_tests:
  - file: libopendmarc/tests/test_tld.c
    source: opendmarc-1.4.2/libopendmarc/tests/test_tld.c
    description: "TLD 表查找单元测试"
    command: "./test_tld"
  - file: libopendmarc/tests/test_finddomain.c
    source: opendmarc-1.4.2/libopendmarc/tests/test_finddomain.c
    description: "组织域提取单元测试"
    command: "./test_finddomain"
  - file: libopendmarc/tests/test_dmarc_parse.c
    source: opendmarc-1.4.2/libopendmarc/tests/test_dmarc_parse.c
    description: "DMARC 记录解析单元测试"
    command: "./test_dmarc_parse"
  - file: libopendmarc/tests/test_dmarc_fetch.c
    source: opendmarc-1.4.2/libopendmarc/tests/test_dmarc_fetch.c
    description: "DMARC 记录获取单元测试"
    command: "./test_dmarc_fetch"
  - file: libopendmarc/tests/test_xml_parse.c
    source: opendmarc-1.4.2/libopendmarc/tests/test_xml_parse.c
    description: "XML 报告解析单元测试"
    command: "./test_xml_parse"
  - file: libopendmarc/tests/test_parse_to_buf.c
    source: opendmarc-1.4.2/libopendmarc/tests/test_parse_to_buf.c
    description: "记录序列化单元测试"
    command: "./test_parse_to_buf"
  - file: libopendmarc/tests/test_alignment.c
    source: opendmarc-1.4.2/libopendmarc/tests/test_alignment.c
    description: "DKIM/SPF 对齐单元测试"
    command: "./test_alignment"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 opendmarc_policy_parse_dmarc 解析合法/非法 DMARC 记录"
    command: "./test_opendmarc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
