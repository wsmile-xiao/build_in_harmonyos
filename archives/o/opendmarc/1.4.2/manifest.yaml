knowledge_gained:
  - "上游 tarball 不含 configure（只有 configure.ac），需要 build() 内 autoreconf -fi 引导；CI 缺 automake/libtool，用 tool_requires 拉取（同 abiword-plugin-clarisworks 先例）"
  - "OHOS musl 风格 resolv.h 无全局 _res 变量，引用 _res 的代码需改用本地 struct __res_state + res_init()/res_query()"
  - "opendmarc 的 milter 过滤程序依赖 sendmail libmilter（OHOS 无），configure 需 --disable-filter 只构建 libopendmarc 库"

