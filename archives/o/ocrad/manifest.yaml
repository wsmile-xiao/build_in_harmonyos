# 软件级 manifest — ocrad
# 遵循 ARCHIVE-SPEC v2.0

software: ocrad
display: "ocrad (GNU Ocrad)"
description: "GNU 光学字符识别 (OCR) 程序和库，基于特征提取方法"
category: utility
homepage: "https://www.gnu.org/software/ocrad/"
license: GPL-2.0-or-later

build_system: custom

ohos_adaptation:
  key_points:
    - "自定义 configure 脚本（非标准 autotools），不支持 --enable-static/--disable-shared"
    - "configure 接受 CXX/CXXFLAGS/CPPFLAGS/LDFLAGS/LIBS 作为 makefile 变量"
    - "共享依赖（libpng16.so）需在 build 环境设置 LD_LIBRARY_PATH 供 configure conftest 和二进制运行"
    - "源码包为 .tar.lz (lzip) 格式，需特殊处理解压"
    - "产物包含 CLI 二进制 (ocrad) 和静态库 (libocrad.a)"
  common_dependencies:
    - libpng
