# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ocrad/0.29
homepage: "https://www.gnu.org/software/ocrad/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testsuite/check.sh
    source: ocrad-0.29/testsuite/check.sh
    description: "ocrad 自带测试套件，运行 OCR 测试用例验证识别正确性"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 ocrad --version 验证二进制可执行且版本正确"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
