# 版本级 manifest — ocrad 0.29
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.29"
software: "ocrad"
status: built
build_date: "2026-09-04"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.gnu.org/gnu/ocrad/ocrad-0.29.tar.lz"
  sha256: "11200cc6b0b7ba16884a72dccb58ef694f7aa26cd2b2041e555580f064d2d9e9"
  tar_format: tar.lz

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom
  configure_options:
    - 'CXX=clang++'
    - 'CXXFLAGS=-fPIC -O2'
  dependencies:
    - libpng/1.6.58.2
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "自定义 configure 脚本不支持 --enable-static/--disable-shared"
  - "configure 接受 CPPFLAGS/LDFLAGS/LIBS 作为命令行参数（非环境变量）"
  - "源码包为 .tar.lz 格式，需要 lzip 解压"
  - "libpng 为共享库，运行时需设置 LD_LIBRARY_PATH"
