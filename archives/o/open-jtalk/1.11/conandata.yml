# conandata.yml — open-jtalk 1.11
# 上游项目主页: SourceForge open-jtalk（Open JTalk / 名古屋工业大学 HTS Working Group）

sources:
  url: "https://downloads.sourceforge.net/project/open-jtalk/Open%20JTalk/open_jtalk-1.11/open_jtalk-1.11.tar.gz"
  sha256: "20fdc6aeb6c757866034abc175820573db43e4284707c866fcd02c8ec18de71f"

# open_jtalk 的 configure 强制要求 hts_engine_API 的头文件与静态库
# （--with-hts-engine-header-path / --with-hts-engine-library-path），
# 而 hts_engine_API 既未发布到 ohpcd Conan 制品仓，也不在 cmd-pkgs 预编译包中
# （2026-09-13 实测：conan list 'hts_engine/*' -r=ohpcd 为 0 条；cmd-pkgs 1248 个包无 hts）。
# 因此在本配方内私有构建并静态链接进 open_jtalk 可执行文件，
# 与 archives/a/aws-c-http 的 private_sources 做法一致。
private_sources:
  hts_engine_API:
    url: "https://downloads.sourceforge.net/project/hts-engine/hts_engine%20API/hts_engine_API-1.10/hts_engine_API-1.10.tar.gz"
    sha256: "e2132be5860d8fb4a460be766454cfd7c3e21cf67b509c48e1804feab14968f7"

# 私有源码的补丁不走 Conan 的 apply_conandata_patches（它只作用于本包源码树），
# 由配方 build() 内的 _apply_private_patches() 用 patch() 工具显式应用。
# 0001 直接复用本包的 config.guess/config.sub 补丁：两个 tarball 的这两个文件字节完全相同
# （config.guess sha256 e0c1d7ef8ce964fb57c35e7704ae8661d7e4ca87d6a3c18950e503ae26b62319，
# config.sub sha256 f7e62c3cb15cd5bbc4e7f3617793b227481fc554d39697a9c322a266d20fb626），
# 故同一补丁可按不同 root 应用到 hts_engine_API 源码树。
private_patches:
  hts_engine_API:
    - "patches/0001-config-guess-sub-ohos.patch"
    - "patches/hts_engine/0001-configure-hmdfs-umask.patch"
    - "patches/hts_engine/0002-HTS_misc-use-ftell.patch"

patches:
  "1.11":
    - patch_file: "patches/0001-config-guess-sub-ohos.patch"
      patch_description: "config.guess 增加 aarch64:HarmonyOS 运行时识别分支（旧式脚本，无 GUESS 变量），config.sub 补 linux-ohos 双锚点，使 aarch64-unknown-linux-ohos 三元组被接受"
      patch_type: "portability"
    - patch_file: "patches/0002-configure-hmdfs-umask.patch"
      patch_description: "移除 configure 内 config.status 临时目录创建时的 umask 077（HMDFS 下 0700 临时目录不可写，configure 直接失败）"
      patch_type: "portability"
