# 版本级 manifest — open-jtalk 1.11
# ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.11"
software: "open-jtalk"
status: built
build_date: "2026-09-13"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://downloads.sourceforge.net/project/open-jtalk/Open%20JTalk/open_jtalk-1.11/open_jtalk-1.11.tar.gz"
  sha256: "20fdc6aeb6c757866034abc175820573db43e4284707c866fcd02c8ec18de71f"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--with-hts-engine-header-path=<build>/_hts_engine/prefix/include"
    - "--with-hts-engine-library-path=<build>/_hts_engine/prefix/lib"
    - "CXXFLAGS += -Wno-register"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
#
# patches/0001、0002 作用于 open_jtalk 本体；
# patches/hts_engine/0001、0002 作用于配方内私有构建的 hts_engine_API 1.10
# （conandata.yml 的 private_patches 段，由 build() 显式应用；其中 0001
#  直接复用本包的 config.guess/config.sub 锚点补丁，因为两个 tarball 的
#  这两个文件字节相同）。

patches_applied:
  - "patches/0001-config-guess-sub-ohos.patch"
  - "patches/0002-configure-hmdfs-umask.patch"
  - "patches/hts_engine/0001-configure-hmdfs-umask.patch"
  - "patches/hts_engine/0002-HTS_misc-use-ftell.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "open_jtalk 1.11 的 bin/Makefile.am 用 @top_srcdir@ 绝对路径链接各子目录静态库，只支持 in-tree 构建；VPATH/out-of-tree 构建报 No rule to make target '<src>/text2mecab/libtext2mecab.a'"  # reference: knowledge/drafts/DRAFT-audacious-buildsys-in-source-static-chain.md
  - "hts_engine_API 1.10 是 open_jtalk 的 configure 硬依赖，但未发布到 ohpcd Conan 制品仓也不在 cmd-pkgs 预编译索引中；本配方用 conandata 的 private_sources 私有构建并静态链接"  # reference: archives/a/aws-c-http/0.10.14/conanfile.py
  - "上游 tarball 自带的 2013 版 config.guess/config.sub 是旧式脚本（无 GUESS 变量），E007 的 perl 工具锚点不适用；按 E564 用手工最小锚点补丁（config.guess 加 aarch64:HarmonyOS 运行时分支、config.sub 补 linux-ohos 双锚点），config.guess 输出且 config.sub 接受 aarch64-unknown-linux-ohos，全程不使用 __OHOS__ 平台宏"  # knowledge_ref: E564, E007
  - "HMDFS 上 umask 077 创建的临时目录对构建用户不可写：configure 为 config.status 建临时目录时会直接失败，configure 内 2 处 umask 077 改为 022（E011 口径）"  # knowledge_ref: E011
  - "OHOS SDK 26 的 fpos_t 是 union _G_fpos64_t（char __opaque[16]; long long __lldata; double __align;），没有 glibc 的 __pos 成员；hts_engine_API 的 HTS_misc.c 取 pos.__pos 编译失败，改为 ftell() 可移植"  # knowledge_ref: E6342
  - "open_jtalk 内置的 MeCab 0.996 是 C++98 代码，使用 C++17 已删除的 register 关键字；profile cppstd=17 下必须加 -Wno-register，否则 clang 直接报 error"  # reference: archives/a/autodocksuite/4.2.6/conanfile.py
  - "open_jtalk 运行时还需外部 .htsvoice 声学模型（源码包不含）；没有该文件时 -x 指定的词典仍会先正常加载，随后在 HTS_Engine_load 处按上游行为退出 1"  # reference: upstream INSTALL/README (SourceForge open-jtalk)
  - "autotools helper 脚本的执行位在部分 OHOS 适配链路上可能不被保留，配方在 configure 前对 configure/config.guess/config.sub/install-sh/missing 等已知脚本恢复执行位"  # knowledge_ref: E490
