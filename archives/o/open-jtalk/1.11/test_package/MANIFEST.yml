# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: open-jtalk/1.11
homepage: "https://open-jtalk.sourceforge.net/"

# 上游测试入口：Makefile.am 未定义 check_PROGRAMS/TESTS，make check 为空操作
upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: >-
      open_jtalk 消费者测试：验证交付产物为 OHOS aarch64 ELF、open_jtalk -h 可用并打印
      Open JTalk 与 hts_engine_API（HTS_COPYRIGHT 宏，证明私有依赖已链入）横幅、
      随包安装的 NAIST-JDic 词典文件齐全，并以 -x <dic> 实际走通词典加载路径
      （无 .htsvoice 声学模型时按上游文档化行为退出 1）
    command: "bash test.sh"

assertion_count: 4
