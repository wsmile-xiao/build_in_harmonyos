# 软件级 manifest — open-jtalk
# 位置: archives/o/open-jtalk/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: open-jtalk
display: "Open JTalk"
description: "HMM-based Japanese text-to-speech synthesis system (Open JTalk) using hts_engine_API as the synthesis backend"
category: utility
homepage: "https://open-jtalk.sourceforge.net/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "只支持 in-tree 构建：bin/Makefile.am 用 @top_srcdir@ 绝对路径链接各子目录静态库，VPATH 构建必然失败"
    - "hts_engine_API（configure 硬依赖）未发布到 ohpcd registry / cmd-pkgs，用 private_sources 在配方内私有构建并静态链接"
    - "2013 版 config.guess/config.sub 是旧式脚本（无 GUESS 变量），不识别 HarmonyOS 且 config.sub 拒绝 ohos 三元组；按 E564 用最小锚点补丁补齐（无 __OHOS__ 宏）"
    - "内置 MeCab 0.996 用 C++17 已删除的 register 关键字，需注入 -Wno-register"
    - "产物为 CLI + 约 98 MB 的 MeCab NAIST-JDic 词典（dic/）；真实语音合成还需外部 .htsvoice 模型，源码包不含"
  common_dependencies: []

versions:
  "1.11":
    status: built
    build_date: "2026-09-13"
    conan_ref: "open-jtalk/1.11"
