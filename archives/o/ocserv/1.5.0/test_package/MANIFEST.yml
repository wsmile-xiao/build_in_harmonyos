# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: ocserv/1.5.0
homepage: "https://gitlab.com/ocserv/ocserv"

# 上游测试命令 (meson test；OHOS 上 conanfile.py build() 内直接执行测试二进制
# —— meson 官方 runner 用 /bin/sh 无法执行未签名 ELF，结果等价)
upstream_check_command: "conanfile.py build() 内直接执行 16 个 C 单元测试二进制"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "build() 内 _run_upstream_tests(): 逐个执行 tests/<name> C 单元测试二进制"

# 上游 C 单元测试 (tests/meson.build, 16 个)
upstream_tests:
  - file: tests/str-test.c
    source: ocserv-1.5.0/tests/str-test.c
    description: "字符串处理工具函数"
    command: "./str-test"
  - file: tests/str-test2.c
    source: ocserv-1.5.0/tests/str-test2.c
    description: "字符串处理工具函数 (第二组)"
    command: "./str-test2"
  - file: tests/kkdcp-parsing.c
    source: ocserv-1.5.0/tests/kkdcp-parsing.c
    description: "KKDCP 代理 URL 解析 (需 GSSAPI，编译期禁用时 exit 77 预期跳过)"
    command: "./kkdcp-parsing"
  - file: tests/json-escape.c
    source: ocserv-1.5.0/tests/json-escape.c
    description: "JSON 输出转义"
    command: "./json-escape"
  - file: tests/ban-ips.c
    source: ocserv-1.5.0/tests/ban-ips.c
    description: "IP 封禁列表解析"
    command: "./ban-ips"
  - file: tests/port-parsing.c
    source: ocserv-1.5.0/tests/port-parsing.c
    description: "端口列表解析"
    command: "./port-parsing"
  - file: tests/human_addr.c
    source: ocserv-1.5.0/tests/human_addr.c
    description: "socket 地址可读格式化"
    command: "./human_addr"
  - file: tests/valid-hostname.c
    source: ocserv-1.5.0/tests/valid-hostname.c
    description: "主机名合法性校验"
    command: "./valid-hostname"
  - file: tests/url-escape.c
    source: ocserv-1.5.0/tests/url-escape.c
    description: "URL 转义"
    command: "./url-escape"
  - file: tests/html-escape.c
    source: ocserv-1.5.0/tests/html-escape.c
    description: "HTML 转义"
    command: "./html-escape"
  - file: tests/ipv4-prefix.c
    source: ocserv-1.5.0/tests/ipv4-prefix.c
    description: "IPv4 前缀匹配"
    command: "./ipv4-prefix"
  - file: tests/ipv6-prefix.c
    source: ocserv-1.5.0/tests/ipv6-prefix.c
    description: "IPv6 前缀匹配"
    command: "./ipv6-prefix"
  - file: tests/proxyproto-v1.c
    source: ocserv-1.5.0/tests/proxyproto-v1.c
    description: "PROXY protocol v1 头解析"
    command: "./proxyproto-v1"
  - file: tests/proxyproto-v2.c
    source: ocserv-1.5.0/tests/proxyproto-v2.c
    description: "PROXY protocol v2 头解析"
    command: "./proxyproto-v2"
  - file: tests/cstp-recv.c
    source: ocserv-1.5.0/tests/cstp-recv.c
    description: "CSTP 帧接收 (依赖 gnutls)"
    command: "./cstp-recv"
  - file: tests/config-inherit.c
    source: ocserv-1.5.0/tests/config-inherit.c
    description: "vhost 配置继承 (#705, 依赖 gnutls+inih+pcl；OHOS patch 尊重 TMPDIR)"
    command: "./config-inherit"

# 上游 shell 脚本测试（部分可在 OHOS 运行的，已在设备手动验证）
upstream_script_tests_verified_on_device:
  - file: tests/ocpasswd-test
    description: "ocpasswd 完整功能链 (12 项子断言) — 设备实测 PASS"
  - file: tests/test-fw-normalize-route
    description: "防火墙路由规范化 — 设备实测 PASS"

# 上游 shell 脚本测试（OHOS 无法运行，原因见 reports/test-report.md）
# ~105 个脚本需要 openconnect 客户端 / root / namespace / cwrap / radcli / krb5

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "ocserv --version / ocpasswd --version / ocserv-worker 守卫消息 (3 检查)"
    command: "./test.sh"

# 测试结论: C 单元测试 15 PASS + 1 SKIP(77 GSSAPI 禁用)；test_package smoke 全过
assertion_count: 19
