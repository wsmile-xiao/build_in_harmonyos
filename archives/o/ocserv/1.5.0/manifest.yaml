# 版本级 manifest — ocserv 1.5.0
# 文件位置: archives/o/ocserv/1.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.5.0"

software: "ocserv"

status: published

build_date: "2026-09-02"
build_system: "meson"

source:
  url: "https://gitlab.com/ocserv/ocserv/-/archive/1.5.0/ocserv-1.5.0.tar.gz"
  sha256: "e7e7073fd51b62c09b8629f1320558a1e80b8bf832a51513dd95e4e309a9d11e"
  tar_format: tar.gz

build:
  system: meson

  configure_options:
    - "--buildtype=release"
    - "-Dlocal-talloc=true"
    - "-Dlocal-llhttp=true"
    - "-Dlocal-protobuf=true"
    - "-Dlocal-pcl=true"
    - "-Dpam=disabled"
    - "-Dradius=disabled"
    - "-Dgssapi=disabled"
    - "-Dliboath=disabled"
    - "-Dlibnl=disabled"
    - "-Dmaxmind=disabled"
    - "-Dgeoip=disabled"
    - "-Dlz4=disabled"
    - "-Dseccomp=disabled"
    - "-Dsystemd=disabled"
    - "-Dutmp=disabled"
    - "-Dlibwrap=disabled"
    - "-Dsock-diag=disabled"
    - "-Doidc-auth=disabled"
    - "-Dcompression=disabled"
    - "-Dnamespaces=disabled"
    - "-Danyconnect-compat=enabled"

  dependencies:
    - gnutls/3.8.10
    - libev/4.33
    - readline/8.3

  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-ocpasswd-ocpasswd.c.patch"
  - "0002-tests-meson.build.patch"
  - "0003-tests-config-inherit.c.patch"
  - "0004-pre-generated-protobuf-c-sources.patch"

knowledge_gained:
  - "OHOS musl 无 getpass(3)，ocpasswd 需要 __OHOS__ 兼容实现"
  - "protoc/protoc-c 不可用时用预生成 pb-c 文件走 meson fs.exists fallback"
  - "cc.find_library 不读 pkg-config：libev/readline 的 include/lib 路径需注入 cflags/ldflags"
  - "ELF 可执行文件必须 binary-sign-tool 签名后才能在 OHOS 执行"
  - "上游 tests/meson.build 假设 gnutls 在系统路径，conan prefix 构建需补 gnutls_dep"
