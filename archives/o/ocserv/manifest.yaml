# 软件级 manifest — ocserv
# 文件位置: archives/o/ocserv/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: ocserv

display: "OpenConnect VPN Server"

description: "OpenConnect VPN 服务端，实现 Cisco AnyConnect/OpenConnect SSL VPN 协议"

category: network

homepage: "https://gitlab.com/ocserv/ocserv"

license: GPL-2.0-or-later

build_system: meson

ohos_adaptation:
  key_points:
    - "ocserv 1.5.0 上游已从 autotools 迁移到 meson 构建系统"
    - "必需依赖 gnutls/libev 由 conan 提供，talloc/llhttp/protobuf-c/pcl 用上游 bundled 源码"
    - "OHOS musl 无 getpass(3)，ocpasswd 需 __OHOS__ 兼容实现（读 /dev/tty 关回显）"
    - "protoc/protoc-c 在构建主机与 CI 不可用：用预生成 pb-c 文件（meson fs.exists fallback 分支）"
    - "ELF 可执行文件需 binary-sign-tool 签名后才能在 OHOS 上执行（E077 四步流程）"
    - "tests/meson.build 上游假设 gnutls 头文件在系统路径，conan prefix 构建需显式传递 gnutls_dep"

versions:
  "1.5.0":
    status: published
    build_date: "2026-09-02"
