# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: opentracing-cpp/1.5.1
homepage: "https://github.com/opentracing/opentracing-cpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试（配方 build 默认 BUILD_TESTING=OFF，测试由本台账覆盖）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（枚举台账详见 notes.md / 任务最终回报 upstream-test-census：11/11 通过）
upstream_tests:
  - file: test/tracer_test.cpp
    source: opentracing-cpp-1.5.1/test/tracer_test.cpp
    description: "noop tracer 基本操作（TEST_CASE tracer，3 个 SECTION）"
    command: "./tracer_test"
  - file: test/string_view_test.cpp
    source: opentracing-cpp-1.5.1/test/string_view_test.cpp
    description: "string_view 行为（1 TEST_CASE，5 个 SECTION）"
    command: "./string_view_test"
  - file: test/value_test.cpp
    source: opentracing-cpp-1.5.1/test/value_test.cpp
    description: "Value 类型转换/比较（1 TEST_CASE，7 个 SECTION）"
    command: "./value_test"
  - file: test/util_test.cpp
    source: opentracing-cpp-1.5.1/test/util_test.cpp
    description: "time_point 转换（1 TEST_CASE）"
    command: "./util_test"
  - file: test/dynamic_load_test.cpp
    source: opentracing-cpp-1.5.1/test/dynamic_load_test.cpp
    description: "动态加载 mocktracer 库（1 TEST_CASE，4 个 SECTION）"
    command: "./dynamic_load_test --mocktracer_library libopentracing_mocktracer.so"
  - file: test/multiple_tracer_link_test.cpp
    source: opentracing-cpp-1.5.1/test/multiple_tracer_link_test.cpp
    description: "多 tracer 链接回归（自定义 main 链接用例）"
    command: "./multiple_tracer_link_test"
  - file: mocktracer/test/tracer_test.cpp
    source: opentracing-cpp-1.5.1/mocktracer/test/tracer_test.cpp
    description: "mocktracer tracer + json_recorder（2 TEST_CASE，11 个 SECTION）"
    command: "./mocktracer_tracer_test"
  - file: mocktracer/test/tracer_factory_test.cpp
    source: opentracing-cpp-1.5.1/mocktracer/test/tracer_factory_test.cpp
    description: "tracer factory 配置解析（1 TEST_CASE，6 个 SECTION）"
    command: "./mocktracer_tracer_factory_test"
  - file: mocktracer/test/propagation_test.cpp
    source: opentracing-cpp-1.5.1/mocktracer/test/propagation_test.cpp
    description: "propagation inject/extract（1 TEST_CASE，14 个 SECTION）"
    command: "./mocktracer_propagation_test"
  - file: mocktracer/test/json_test.cpp
    source: opentracing-cpp-1.5.1/mocktracer/test/json_test.cpp
    description: "JSON 序列化（1 TEST_CASE）"
    command: "./mocktracer_json_test"
  - file: example/tutorial/tutorial-example.cpp
    source: opentracing-cpp-1.5.1/example/tutorial/tutorial-example.cpp
    description: "tutorial 示例（样例，非独立用例）"
    command: "./tutorial-example"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者用例：仅通过安装的公开头文件与 OpenTracing::opentracing 链接目标调用 MakeNoopTracer/StartSpan/Finish"
    command: "./consumer_opentracing"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 32