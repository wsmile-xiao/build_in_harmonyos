# 软件级 manifest — opentracing-cpp

software: opentracing-cpp
display: "opentracing-cpp"
description: "C++ implementation of the OpenTracing API（分布式追踪埋点标准接口）"
category: library
homepage: "https://github.com/opentracing/opentracing-cpp"
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: cmake

# ============================================================
# 版本索引
# ============================================================

versions:
  - version: "1.5.1"
    status: built
    build_date: "2026-09-16"
    notes: "首次适配；CMake >= 4.x 兼容补丁；上游测试 11/11 通过；知识草稿 DRAFT-opentracing-cpp-1.5.1-cmake-not-unix-logic-gate-option-invalid"

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  - topic: "CMake UNIX 变量"
    detail: "OHOS 无 CMake Platform module，内置 UNIX 变量为假；上游 if(NOT ... OR NOT UNIX) 逻辑门控会强制关闭平台特性，-D<OPT>=ON 无效，需 -DUNIX=ON（详见 knowledge/drafts/DRAFT-opentracing-cpp-1.5.1-cmake-not-unix-logic-gate-option-invalid）"
  - topic: "CMake 版本"
    detail: "cmake_minimum_required < 3.5 的库在 CMake 4.x 下需 bump 到 3.5（patches/0001-CMakeLists.txt.patch，同 E103）"
  - topic: "测试运行"
    detail: "斜杠相对 DT_NEEDED 按 cwd 解析导致跨目录 ctest 失败时，建父目录符号链接 + LD_LIBRARY_PATH 恢复（同 DRAFT-libjpeg-turbo-3.0.4-slash-relative-NEEDED-ctest-loading）"