software: openfst
version: "1.8.4.1"
status: built
build_system: autotools
build_date: "2026-10-03"

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://openfst.org/twiki/pub/FST/FstDownload/openfst-1.8.4.tar.gz"
  sha256: "a8ebbb6f3d92d07e671500587472518cfc87cb79b9a654a5a8abb2d0eb298016"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  configure_options:
    - "--enable-bin"
    - "--enable-grm"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []  # 无外部依赖，仅需系统 libc/libc++（系统库）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-flags-help-exit.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "openfst 上游 configure 默认 far/pdt/mpdt=no，GRM 扩展（--enable-grm 是 far+mpdt+pdt 的别名）必须显式开启；下游 OpenGrm Thrax 1.3.10 的 configure 对 fst/extensions/{far,pdt,mpdt} 头文件做 AC_MSG_ERROR 硬校验，缺失即构建失败"
  - "上游源码与 1.8.4 相同，4 个平台补丁（config.guess/config.sub/configure/flags-help-exit）原样复用"
  - "config.guess/config.sub 需添加 aarch64-ohos 平台识别（E007）"
  - "configure 脚本复杂引号在 toybox sh 下不兼容，需手动修复 pipe/cat 语句（E064）"
  - "fstcompile 不支持 --version，需用 --help 验证（E081）"
  - "OpenFst --help 原本打印用法后返回 1，需改为返回 0 以通过通用 smoke check"
  - "make check 需在 make install 前于构建目录执行"
