software: openldap
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.6.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.6.9"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
compile_date: "2026-06-08"

# 构建系统类型（必须字段）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/openldap/openldap-2.6.9.tar.gz"

  # 源码校验和
  sha256: "2cb7dc73e9c8340dff0d99357fbaa578abf30cc6619f0521972c555681e6b2ff"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-mdb"
  # 禁用 MDB backend，因为 musl libc 不支持 robust mutex

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 无外部依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0003-configure.patch"
# 补丁说明：
# - 0003: configure 脚本 TMPDIR 修复（解决 HMDFS 临时文件创建限制）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E083: HMDFS 文件系统限制 autotools 创建临时文件，TMPDIR 方案有效"
  - "E084: musl libc 不支持 robust mutex (pthread_mutexattr_setrobust)"
  - "configure 补丁: 修改 mktemp -d './confXXXXXX' 为 '$TMPDIR/confXXXXXX'"
  - "config.status 补丁: 去掉 umask 077 避免临时目录权限过严"

patch_generation:
  method: per-file-difflib
  generated_at: '2026-06-08T16:17:46'
  patches_count: 1

patch_classification:
  - file: 0003-configure.patch
    type: core-fix
    platform_only: true
    guard: TMPDIR
    description: "核心补丁：修改 configure 使用 TMPDIR 创建临时目录"
