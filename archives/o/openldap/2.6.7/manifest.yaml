software: openldap
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.6.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.6.7"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/openldap/openldap/archive/refs/tags/OPENLDAP_REL_ENG_2_6_7.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 配置选项列表
  configure_options:
    - "--enable-mdb=no"
    - "--enable-ldif=yes"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.log.patch"
  - "0002-config.status.patch"
  - "0003-configure.log.patch"
# 注意：这些补丁是编译过程的日志文件，不应用于其他平台
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 文件系统临时目录限制：需要修改 config.status 使用固定临时目录"
  - "LMDB 后端依赖 robust mutex 函数（pthread_mutexattr_setrobust/pthread_mutex_consistent），鸿蒙平台不支持，需禁用 mdb 后端"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/openldap-2.6.7.orig
  source_work_dir: /storage/Users/currentUser/builds/openldap-2.6.7.work
  source_orig_hash: d5e78e1530784864
  source_work_hash: d82b2d6f964feaac
  generated_at: '2026-05-27T11:38:28'
  patches_count: 3

patch_classification:
  - file: 0001-config.log.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.status.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.log.patch
    type: auto
    platform_only: True
    guard: 'pending'
