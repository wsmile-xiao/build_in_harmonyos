# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: openldap/2.6.7
homepage: "https://www.openldap.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\", args=[\"-j1\", \"-k\"])"

# 上游实际运行的测试程序
# 规则 4 技术论证（与 conanfile.py 注释、notes.md 证据链一致）：
# - OpenLDAP 上游 tests/run 首行即 `if test ! -x ../servers/slapd/slapd; then echo "Could not locate slapd(8)"; exit 1; fi`
#   全部 90 个集成测试（tests/scripts/test000-rootdse ~ test088-syncprov-glue-rwm，含 test081-totp.py）均为 slapd-tester，
#   需启动 slapd 服务端进程并占用端口/文件系统。核验：`ls tests/scripts/test* | wc -l` == 90。
# - 本配方为依赖项场景（asterisk-ldap 仅需客户端库 libldap/liblber），显式 --disable-slapd（见 conanfile.py generate）
#   且 --enable-mdb=no（OHOS musl 不支持 pthread robust mutex，见 notes.md），因此 slapd 二进制在构建产物中不存在，
#   make check 在 conan 沙箱内必然以「Could not locate slapd(8)」失败退出，属「上游绝大部分测试未运行」的客观限制。
# - 即便启用 --enable-slapd，slapd 需 fork 守护进程、监听 9010+ 端口、写临时 DB，在 conan 干净构建沙箱内亦无法运行。
# - 补偿措施：conanfile.py build() 末尾以 `make check -j1 -k` 尽力执行并以 warning 保留证据（非阻断），
#   test_package 以 6 组离线消费者测试覆盖 libldap/liblber 可验证能力（见下方 assertion_count）。
upstream_tests:
  - file: tests/run
    source: openldap-2.6.7/tests/run
    description: "OpenLDAP 上游 slapd-tester 集成测试入口（90 个，tests/scripts/test000-rootdse ~ test088-syncprov-glue-rwm 含 test081-totp.py，需 slapd 服务端，沙箱内无法运行）"
    command: "cd tests && make check"
    runnable_in_sandbox: false
    reason: "配方 --disable-slapd 未构建 slapd；tests/run 首行即检查 slapd 二进制，缺失则 exit 1；且需端口/fork 沙箱受限；上游实测 90 个 test* 脚本"

# test_package 中自带的测试 (消费者视角验证)
# 6 组离线用例覆盖客户端库与 BER 编解码（无需网络/slapd）：
# 1) ldap_create/set_option/get_option/unbind_ext  2) LDAP_OPT_API_INFO  3) ldap_url_parse/free/desc2str/is_ldap_url
# 4) ldap_str2dn/dn2str/dnfree  5) ldap_err2string  6) lber ber_alloc_t/printf/flatten2/free
test_package_tests:
  - file: test.c
    description: "消费者测试 6 组离线用例：ldap_create+API_INFO+url_parse+str2dn+err2string+lber BER 编解码（无网络无需 slapd，链接 libldap/liblber 实跑）"
    command: "./test_openldap"

# 测试断言总数（CHECK 宏计数 + PASS 计数，近似值）
assertion_count: 22
