# OpenLDAP 软件级 manifest
# 文件位置: archives/o/openldap/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: openldap
name: OpenLDAP
description: |
  OpenLDAP 是一个开源的 LDAP (Lightweight Directory Access Protocol) 实现，
  提供目录服务功能，包括客户端工具（ldapsearch、ldapmodify等）和服务器（slapd）。

category: Network/LDAP
website: https://www.openldap.org/
source_url: https://github.com/openldap/openldap

# 已编译版本索引
versions:
  - version: "2.6.7"
    status: published
    build_date: "2026-05-27"
    notes: "禁用 mdb 后端（LMDB robust mutex 不支持）"

# 平台适配说明
platform_notes:
  - "HMDFS 临时文件限制：需修改 config.status 使用固定临时目录"
  - "LMDB 后端禁用：鸿蒙平台不支持 robust mutex 函数"
  - "功能限制：只能使用 ldif/monitor/relay 后端"

# 依赖关系
dependencies: []

# 关键知识
knowledge_refs:
  - E081-HMDFS-heredoc
  - E082-LMDB-robust-mutex

---
