software: osmium-tool
display: "osmium-tool"
description: "处理 OpenStreetMap 数据的多功能命令行工具（osmium，23 个子命令）"
category: utility
homepage: "https://osmcode.org/osmium-tool/"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 CMake 使用自带的模块式 find 模块（cmake/FindOsmium.cmake / FindProtozero.cmake / FindLZ4.cmake），只消费旧式 *_INCLUDE_DIR / *_LIBRARY 变量；Conan 工具链默认 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON，走 *-config.cmake 只提供小写变量与 imported target，故在 generate() 中把上游仍读取的大写变量（含 ZLIB_LIBRARIES / LZ4_INCLUDE_DIRS / LZ4_LIBRARIES）显式注入缓存。"
    - "FindOsmium 要求 Osmium >= 2.23.1，制品仓只有 libosmium/2.23.0（且 2.23.1 回退了对象排序语义，影响 sort/apply-changes 输出），故 libosmium v2.23.1 与 protozero v1.8.2 作为 header-only 源码在 source() 阶段按官方 tarball 下载，经 OSMIUM_INCLUDE_DIR / PROTOZERO_INCLUDE_DIR 注入。"
    - "CMake 4.x 的 FindBZip2 只设置 BZip2_FOUND（混合大小写），上游 FindOsmium.cmake 仍检查 BZIP2_FOUND → 补丁 0001 增加兼容别名。"
    - "cmake --install 会重写 RPATH 破坏 OHOS .codesign fs-verity 哈希导致 ELF 不可加载，package() 改为按字节复制构建树可执行文件。"
    - "expat 制品为共享库（libexpat.so.1），二进制运行需要 LD_LIBRARY_PATH（conanrun 环境提供）。"
  common_dependencies:
    - boost/1.90.0.4
    - nlohmann-json/3.11.2
    - zlib/1.3.1.1.1
    - bzip2/1.0.8
    - expat/2.8.2.1
    - lz4/1.10.0
    - libosmium v2.23.1 (header-only, vendored)
    - protozero v1.8.2 (header-only, vendored)

versions:
  "1.19.1":
    status: built
    build_date: "2026-09-24"
    notes: "CMake 构建；上游 375 个 CTest 用例全部执行通过（375/375）；消费者用例 18/18。"
