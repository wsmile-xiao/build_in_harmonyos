version: "1.19.1"
status: built
build_date: "2026-09-24"
conan_ref: osmium-tool/1.19.1

source:
  url: "https://github.com/osmcode/osmium-tool/archive/refs/tags/v1.19.1.tar.gz"
  sha256: "e629d2f3e500ffa5df6f1b1689161ab3dea3a82f66beec2b453a74b8d782f949"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_TESTING=ON"
    - "USE_CPP_VERSION=17"
    - "WITH_LZ4=ON"
  dependencies:
    - boost/1.90.0.4
    - nlohmann-json/3.11.2
    - zlib/1.3.1.1.1
    - bzip2/1.0.8
    - expat/2.8.2.1
    - lz4/1.10.0
    - "libosmium v2.23.1 (header-only, vendored at source() time)"
    - "protozero v1.8.2 (header-only, vendored at source() time)"

patches_applied:
  - "0001-cmake4-findbzip2-compat.patch"

upstream_tests:
  command: "ctest --output-on-failure"
  test_count: 375
  notes: >
    Upstream test/CMakeLists.txt registers 375 CTest cases (measured with
    `ctest -N`): 1 Catch2 unit_tests binary (83 TEST_CASE macros), 23
    help_cmd_* usage tests and 351 per-command functional / output-comparison
    tests (cat, extract, export, formats, changeset-filter, getid, sort,
    tags-filter, check-refs, merge, fileinfo, time-filter, renumber, diff,
    derive-changes, getparents, removeid, show, apply-changes,
    add-locations-to-ways, ...). All 375 execute and pass on HarmonyOS
    aarch64 (ctest: "100% tests passed, 0 tests failed out of 375").

test_package:
  assertion_count: 18
  description: >
    Runs the installed `osmium` executable: version contract, top-level and
    sub-command help, XML->OPL parsing, XML->PBF write + fileinfo read-back,
    PBF->OPL round-trip byte equality and tags-filter semantics (18 assertions).
