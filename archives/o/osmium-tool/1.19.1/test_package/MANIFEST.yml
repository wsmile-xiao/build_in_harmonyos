package: osmium-tool/1.19.1
homepage: "https://osmcode.org/osmium-tool/"

# ── 上游测试声明 ────────────────────────────────────────────────
# 上游 test/CMakeLists.txt 注册 375 个 CTest 用例（`ctest -N` 实测）：
#   1  unit_tests（Catch2，83 个 TEST_CASE）
#   23 help_cmd_*（每个子命令 `osmium <cmd> -h` 的 PASS_REGULAR_EXPRESSION）
#   351 命令级功能/输出比对（cat/extract/export/formats/changeset-filter/
#       getid/sort/tags-filter/check-refs/merge/fileinfo/time-filter/
#       renumber/diff/derive-changes/getparents/removeid/show/
#       apply-changes/add-locations-to-ways/... 及 help/misc 杂项）
# 全部在 HarmonyOS aarch64 执行：ctest "100% tests passed, 0 tests failed out of 375"。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: unit_tests
    source: osmium-tool-1.19.1/test/unit_tests.cpp
    description: "Catch2 单元测试二进制（83 个 TEST_CASE，注册为 1 个 CTest 用例）"
    command: "ctest -R '^unit_tests$'"
  - file: help_cmd_*
    source: osmium-tool-1.19.1/test/CMakeLists.txt
    description: "23 个子命令的 `-h` 用法输出断言（PASS_REGULAR_EXPRESSION）"
    command: "ctest -R '^help_cmd_'"
  - file: test/*/
    source: osmium-tool-1.19.1/test/
    description: "各子命令的端到端输出比对（cmake/run_test_compare_output.cmake 调用构建出的 osmium 可执行文件，与 test/ 下参考文件逐字节比对；含 formats 的 PBF 二进制比对）"
    command: "ctest --output-on-failure"

# ── 消费者视角测试（test_package/，R34） ─────────────────────────
test_package_tests:
  - file: test.sh
    description: "消费者 18 项断言：osmium --version 版本契约 / --help / cat -h / XML→OPL / XML→PBF / fileinfo 回读 / PBF→OPL 往返逐字节一致 / tags-filter 过滤语义"
    command: "bash test.sh"
  - file: conanfile.py
    description: "conanrun 环境驱动 test.sh 实测安装后的 osmium 可执行文件"
    command: "conan test test_package"

# ── 断言计数 ──
assertion_count: 18

# ── 实测结果（OHOS aarch64，feat/osmium-tool-1.19.1） ─────────────
verification:
  upstream_total: 375
  upstream_passed: 375
  upstream_failed: 0
  upstream_pass_rate: "375/375 = 100%"
  consumer_total: 18
  consumer_passed: 18
  consumer_pass_rate: "18/18 = 100%"
  platform_exemptions: 0
  dependency_disabled: 0
  failure_root_cause: "none"
