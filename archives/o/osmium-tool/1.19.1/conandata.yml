# conandata.yml — osmium-tool 1.19.1

sources:
  url: "https://github.com/osmcode/osmium-tool/archive/refs/tags/v1.19.1.tar.gz"
  sha256: "e629d2f3e500ffa5df6f1b1689161ab3dea3a82f66beec2b453a74b8d782f949"

# libosmium / protozero 是 header-only 依赖，制品仓现状无法满足上游构建要求：
#   - osmium-tool 1.19.1 的 cmake/FindOsmium.cmake 要求 Osmium >= 2.23.1（CMakeLists.txt:67），
#     而制品仓只有 libosmium/2.23.0；且 2.23.1 回退了 2.21.0 的对象排序改动
#     （object_order_type_id_reverse_version 不再考虑 visible），直接影响
#     `osmium sort/apply-changes/merge-changes` 的输出，2.23.0 头文件会产出错误结果。
#   - protozero 需求为 >= 1.6.3（FindOsmium 内部 find_package(Protozero 1.6.3)）。
# 故在 source() 阶段按官方 tarball（固定 sha256）下载两个 header-only 源码，
# 通过 CMake 缓存变量 OSMIUM_INCLUDE_DIR / PROTOZERO_INCLUDE_DIR 注入头文件路径。
vendored:
  libosmium:
    url: "https://github.com/osmcode/libosmium/archive/refs/tags/v2.23.1.tar.gz"
    sha256: "eb47d8163396c73870dbf27819dcadda0c56f0191935c4f8659d1e61b261552f"
  protozero:
    url: "https://github.com/mapbox/protozero/archive/refs/tags/v1.8.2.tar.gz"
    sha256: "68d1df951b4d8397355c8fc9ffed40d9c06282a877fe847403feac6edcee3ef1"

patches:
  - patch_file: "patches/0001-cmake4-findbzip2-compat.patch"
    patch_description: "CMake 4.x 的 FindBZip2 只设置 BZip2_FOUND（混合大小写），而上游 FindOsmium.cmake 仍检查旧式 BZIP2_FOUND，导致 XML 组件被判定缺失、find_package(Osmium) 失败；补一行兼容别名保留真实探测结果"
    patch_type: "portability"

