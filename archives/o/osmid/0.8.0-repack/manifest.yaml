# 版本级 manifest — osmid 0.8.0-repack
# 文件位置: archives/o/osmid/0.8.0-repack/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.8.0-repack"
software: "osmid"
status: built
build_date: "2026-10-10"
build_system: "cmake"

source:
  url: "https://github.com/llloret/osmid/archive/refs/tags/v0.8.0.tar.gz"
  sha256: "774d6c2c7ba81d1ab9d4e7ee031ce15a1506f19ee940166d277dbdee98f87b50"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DALSA_INCLUDE_DIR=<alsa-lib package>/include"
    - "-DALSA_LIBRARY=<alsa-lib package>/lib/libasound.so"
  dependencies:
    - "alsa-lib/1.2.16"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-ohos-alsa-x11.patch"

# 构建期文本改写（非 .patch 文件，不进上表）：
# conanfile.build() 的 _patch_spdlog_musl() 把内嵌
# spdlog-0.11.0/details/os.h 的 errno_str #elif 条件追加 !defined(__GLIBC__)，
# 使 musl/OHOS 走 XSI 分支；锚点缺失时直接报错中断。

knowledge_gained: []
