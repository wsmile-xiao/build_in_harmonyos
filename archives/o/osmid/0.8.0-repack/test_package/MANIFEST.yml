# test_package/MANIFEST.yml — osmid 0.8.0-repack
# CI L0e requires this file to exist.

package: osmid/0.8.0-repack
homepage: "https://github.com/llloret/osmid"

# 上游源码审计：v0.8.0 GitHub 归档不含任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "源码树 (osmid v0.8.0, 664 files, tag v0.8.0 commit 2a5c8eb)"
    reason: "无 tests/、test/ 目录；顶层仅 src/*.cpp（m2o/o2m 业务）、JuceLibraryCode、external_libs（oscpack/spdlog/cxxopts/JUCE 第三方）、utils，无 osmid 自身测试文件。"
  - source: "CMakeLists.txt（顶层构建）"
    reason: "无 enable_testing、无 add_test、无 BUILD_TESTING 选项；默认目标仅 m2o、o2m 两个可执行文件；无 check/test 目标，ctest -N 为空。"
  - source: "构建系统与测试框架"
    reason: "无 CTest/gtest/pytest 注册；external_libs 下 oscpack_1_1_0/tests、spdlog-0.11.0/tests、juce_core/unit_tests 均为被打包第三方的自带用例，非 osmid 上游测试。"
  - conclusion: "上游 0.8.0 未提供自动化测试；由 test_package 对打包二进制做消费者视角 CLI 验证（m2o/o2m --help + 非空断言 + 未知选项负向 4 项真实执行）。"
upstream_test_total: 0
upstream_test_count_method: ctest_entries
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_skipped: 0

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_osmid.sh
    description: "真实执行打包的 m2o/o2m 二进制：m2o --help 输出 'Bridges MIDI to OSC'（exit 1）、o2m --help 输出 'Bridges OSC to MIDI'（exit 1）、help 非空且含 'Display this help message'、未知选项退出非零"
    command: "bash test_osmid.sh"

assertion_count: 4
