# 软件级 manifest — osmid
# 文件位置: archives/o/osmid/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: osmid
display: "osmid"
description: "MIDI 与 OSC 互转桥接工具（m2o/o2m，Sonic Pi 通信组件）"
category: utility
homepage: "https://github.com/llloret/osmid"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "ALSA 由 alsa-lib/1.2.16 制品提供，经 ALSA_INCLUDE_DIR/ALSA_LIBRARY 转发给 FindALSA"
    - "HarmonyOS 下去掉 X11 链接（无头 MIDI 桥，无 GUI 模块）"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容 CMake>=4"
  common_dependencies:
    - "alsa-lib"

versions:
  "0.8.0-repack":
    status: built
    build_date: 2026-10-10
