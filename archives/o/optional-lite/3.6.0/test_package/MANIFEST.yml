# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: optional-lite/3.6.0
homepage: "https://github.com/nonstd-lite/optional-lite"

upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: lest 框架, 4 个 CTest 可执行文件 (cpp98/cpp11/cpp14/cpp17)
# test/optional.t.cpp 含 82 个功能 lest 用例（静态）,
# test/optional-main.t.cpp 另含 6 个 [.tag] 隐藏诊断用例（lest 默认不执行）, 静态合计 88
upstream_tests:
  - file: test/optional.t.cpp
    source: optional-lite-3.6.0/test/optional.t.cpp
    description: "optional 核心单元测试 (82 个 lest 功能用例: 构造/赋值/访问/value_or/value_or_eval 等)"
    command: "ctest -R test-cpp11"
  - file: test/optional-main.t.cpp
    source: optional-lite-3.6.0/test/optional-main.t.cpp
    description: "诊断信息用例 (6 个 [.tag] 隐藏用例: 版本/配置/编译器特性报告, lest 默认跳过)"
    command: "ctest -R test-cpp11"

test_package_tests:
  - file: test_optional_lite.cpp
    description: "消费者测试 (C++17 std 模式): 验证链接与 optional 构造/value/value_or/make_optional/reset/emplace API"
    command: "./test_optional_lite"
  - file: test_optional_lite_ext.cpp
    description: "消费者测试 (C++14 nonstd 模式): 验证 3.6.0 新增 value_or_eval() 扩展 API (非空/空/右值)"
    command: "./test_optional_lite_ext"

assertion_count: 11
