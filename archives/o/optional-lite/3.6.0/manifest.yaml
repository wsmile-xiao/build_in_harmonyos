  - "CMake 命名空间：nonstd::optional-lite"
  - "上游测试使用 lest 框架（内置于 test/lest/lest_cpp03.hpp，无需网络）：88 个静态 CASE，其中 14 个带 [.tag] 隐藏标签默认不执行，每变体默认执行 74 个"
