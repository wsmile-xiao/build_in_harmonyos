# test_package/MANIFEST.yml — osip 5.3.2
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制）
#
# 上游测试口径（四维账本）：
#   N_static = 0 —— 上游 src/test/Makefile.am 将 11 个测试程序注册为
#   noinst_PROGRAMS（COMPILE_TESTS 条件下），顶层及任何目录均无 TESTS
#   变量，`make check` 空转（已实测）。故上游静态注册测试数为 0。
#   本配方在 build() 中以 --enable-test 真实构建上游 torture 工具并执行
#   其自带 SIP 消息语料：torture_hgs 42 条 + torture_msgs2 93 条，
#   共 135 条消息解析全部通过（torture_test 逐条解析并自断言）。
#   torture_sdps 是纯 SDP 样例数据（非 torture_test 的 SIP 消息输入
#   格式，直接喂入会因缺少 SIP start-line 而报 FAILED），不构成
#   torture_test 的测试输入，故不执行。

package: osip/5.3.2
homepage: "https://www.gnu.org/software/osip/"

# 上游测试命令（make check 为空转，已实测记录）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./torture_test res/torture_hgs && ./torture_test res/torture_msgs2"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test/torture.c
    source: osip-5.3.2/src/test/torture.c
    description: "上游 SIP 消息 torture 解析工具（逐条解析语料并自断言）"
    command: "./torture_test res/torture_hgs (42 条消息, 全部通过)"
  - file: src/test/torture.c
    source: osip-5.3.2/src/test/torture.c
    description: "上游 SIP 消息 torture 解析工具（同上，第二组语料）"
    command: "./torture_test res/torture_msgs2 (93 条消息, 全部通过)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 libosipparser2 真实 API 解析 SIP INVITE 并断言 method/Call-ID/CSeq/From 六项"
    command: "./test_osip"

# 测试断言总数 (近似值: 上游 torture 135 条消息解析断言 + 消费者 6 项字段断言)
assertion_count: 141
