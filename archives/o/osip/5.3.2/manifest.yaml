# 知识沉淀
# ============================================================

knowledge_gained:
  - "2014 版 config.sub 的 KERNEL-OS 列表无 linux-ohos：maybe_os 列表加 1 项即可识别（配合 --build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos，aalib/1.4p5 同模式）"
  - "HMDFS 上 config.status 的 umask 077 临时目录不可写（E011 同型），configure 内 umask 077 需改 022"
  - "上游 src/test 的 check 目标以 ./$(top_srcdir) 前缀执行驱动脚本，out-of-source 构建时 top_srcdir 为绝对路径导致路径拼接失效；去除 ./ 前缀即可"
  - "osip 无 TESTS 注册（make check 空转，N_static=0）；--enable-test 构建的 tst/torture_test 驱动配合 res/ 语料（sip0-98、sip-malformed0-22、torture_hgs 42、torture_msgs2 93）是上游真实测试资产"

