software: open-completion
display: "Open Completion"
description: "macOS open 命令的 bash 自动补全脚本"
category: utility
homepage: "https://github.com/moshen/open-bash-completion"
license: MIT
build_system: custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 bash 脚本，无需编译，安装到 share/bash-completion/completions/open"
    - "需要 bash-completion 包提供补全框架函数（运行时依赖，_open 函数体内调用）"
    - "上游 open 脚本以 Darwin 守卫包裹定义与注册，非 Darwin 主机需用 fake uname 复现注册行为"
    - "上游无专用测试 harness，以 Homebrew 公式 test 块对应的上游意图 6 项功能检查在真机真实执行并以 passed 放行"
  common_dependencies:
    - bash-completion

# 版本索引（所有已归档版本，含状态）
versions:
  "1.0.5":
    status: built
    build_date: "2026-09-15"
