# test_package/MANIFEST.yml
# 上游官方测试声明文件
# orafce 4.16.7 上游测试：18 个 pg_regress 组（Makefile REGRESS）
# 加 1 个 HarmonyOS 消费者可行性组（harmonyos_feasibility，由 test_package
# harness 注入），通过 `make installcheck`（initdb 集群 -> pg_ctl start ->
# make install 进真实 PG 目录 -> createdb -> pg_regress --schedule）触发。

package: orafce/4.16.7
homepage: "https://github.com/orafce/orafce"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make installcheck"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make installcheck"

upstream_tests_exist: true
upstream_test_framework: pg_regress
upstream_test_count: 19
upstream_test_groups:
  - init
  - orafce
  - orafce2
  - dbms_output
  - dbms_utility
  - files
  - varchar2
  - nvarchar2
  - aggregates
  - nlssort
  - dbms_random
  - regexp_func
  - dbms_sql
  - dbms_pipe_session_A
  - dbms_pipe_session_B
  - dbms_alert_session_A
  - dbms_alert_session_B
  - dbms_alert_session_C
  - harmonyos_feasibility
upstream_test_runner: "make installcheck (initdb cluster -> pg_ctl start -> make install -> createdb -> pg_regress --schedule)"
upstream_test_dependency: "running PostgreSQL 18.3 server (postgres + initdb + pg_ctl + createdb binaries)"

upstream_test_audit: |
  Audited upstream v4.16.7 source tree. Upstream declares 18 pg_regress groups
  in Makefile REGRESS (init + 12 standalone + 2 pipe sessions + 3 alert
  sessions); the test_package harness assembles a complete, correctly-grouped
  schedule and injects one extra HarmonyOS consumer-feasibility group
  (harmonyos_feasibility), each case with matching sql/<name>.sql and
  expected/<name>.out oracle. pg_regress needs a running PostgreSQL server.
  The vendored PG 18.3 is built fully (configure -> make -> make install)
  producing postgres/initdb/pg_ctl/createdb server binaries. On OpenHarmony
  (musl libc) the dbms_random expected output is regenerated as
  dbms_random_4.out because musl's random() yields a deterministic sequence
  that differs from the glibc variants (dbms_random.out .. _3) shipped upstream.

test_package_tests:
  - file: test_orafce.c
    description: "Smoke test: verifies orafce.so exists and is a valid ELF shared library"
    command: "test_orafce"
    assertions: 2
    executed: true
    passed: true

# 上游测试断言总数 (19 pg_regress cases) + 烟雾测试 2 断言
assertion_count: 21
assertion_executed: 21
assertion_skipped: 0
