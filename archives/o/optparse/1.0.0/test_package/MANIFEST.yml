# test_package/MANIFEST.yml
# Upstream and consumer test declaration for CI L0/L1 quality gates.

package: optparse/1.0.0
homepage: "https://github.com/skeeto/optparse"

upstream_check_command: "make test CC=<conan tools.build:compiler_executables.c>"
upstream_test_in_build: true
upstream_test_command: "make test CC=<conan tools.build:compiler_executables.c> && ./test"

upstream_tests:
  - file: test.c
    source: optparse-1.0.0/test.c
    description: "Upstream optparse short/long option parser regression test suite"
    command: "make test CC=<conan tools.build:compiler_executables.c> && ./test"

test_package_tests:
  - file: test.c
    description: "Consumer test: include optparse.h and parse short options through the packaged header"
    command: "./test_optparse"

assertion_count: 0
