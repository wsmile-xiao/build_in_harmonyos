package: oath/2.6.14
homepage: "https://oath-toolkit.codeberg.page/"
upstream_check_command: "make check -j1"
upstream_test_in_build: true
upstream_test_command: "make check -j1"
upstream_tests:
  - file: liboath/tests/Makefile.am
    source: oath-toolkit-2.6.14/liboath/tests/
    description: "Seven C tests and two shell tests declared by upstream"
    command: "make check -j1"
  - file: oathtool/tests/Makefile.am
    source: oath-toolkit-2.6.14/oathtool/tests/
    description: "Two upstream oathtool shell tests"
    command: "make check -j1"
test_package_tests:
  - file: test_oath.c
    description: "Link the installed liboath and check the RFC 6238 time-59 TOTP vector"
    command: "test_oath"
assertion_count: 4
