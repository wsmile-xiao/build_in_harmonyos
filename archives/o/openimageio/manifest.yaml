software: openimageio
display: "OpenImageIO"
description: "Library for reading and writing images, including a format-agnostic image file"
category: graphics
homepage: "https://openimageio.readthedocs.io/"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建系统"
    - "需要设置 PKG_CONFIG_PATH 指向本地安装的依赖库"
    - "禁用 Python 绑定 (-DUSE_PYTHON=OFF) 避免依赖问题"
    - "依赖：zlib, Imath, OpenEXR, libjpeg-turbo, TIFF, OpenColorIO, fmt, PNG, WebP"
  common_dependencies:
    - zlib
    - Imath
    - OpenEXR
    - libjpeg-turbo
    - TIFF
    - OpenColorIO
    - fmt
    - PNG
    - WebP

versions:
  "3.1.13.1":
    status: published
    build_date: "2026-05-21"
    notes: "首次成功编译，禁用 Python 绑定"