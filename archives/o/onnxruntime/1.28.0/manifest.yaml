  - "0008-onnxruntime-core-mlas-lib-mlasi.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS toybox patch 不支持 --binary 和 --ignore-whitespace，需用 -l 替代"
  - "OHOS 工具链清空 CMAKE_CXX_FLAGS 缓存，需用 add_compile_options 替代 -D 传参"
  - "bfloat16_t 类型需 __ARM_FEATURE_BF16 守卫，因自定义 -march 的文件不包含 bf16 扩展"
  - "musl libc 不支持 pthread_setaffinity_np，需 __MUSL__ 守卫"
  - "cpuinfo 库不认识 OHOS 平台，需在 CMake configure 后 patch 为 Linux"
  - "ONNX Runtime 的 CMakeLists.txt 在 cmake/ 子目录，需 build_script_folder=cmake"

