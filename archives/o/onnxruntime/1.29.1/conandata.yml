# conandata.yml — onnxruntime 1.29.1
# Source: github.com/microsoft/onnxruntime tag v1.29.1
# sha256 computed from the downloaded tarball (codeload archive of tag v1.29.1).

sources:
  # NOTE: the first URL must end in a real archive filename.  Conan derives the
  # filename from the URL tail; a tail like `.../tar.gz/refs/tags/v1.29.1`
  # yields the extension-less name `v1.29.1`, which Conan then tries to open as
  # a zip ("BadZipFile: File is not a zip file") even though the bytes are a
  # gzip tarball.  Keep a `.tar.gz`-terminated URL first.
  url:
    - "https://gh-proxy.com/https://github.com/microsoft/onnxruntime/archive/refs/tags/v1.29.1.tar.gz"
    - "https://github.com/microsoft/onnxruntime/archive/refs/tags/v1.29.1.tar.gz"
    - "https://codeload.github.com/microsoft/onnxruntime/tar.gz/refs/tags/v1.29.1"
  sha256: "aba6ff915ffa3689af9bd6a84102a221ad35427e602f22bb18ae8323997d0f0d"

patches:
  - patch_file: "patches/0001-cmake-adjust_global_compile_flags.cmake.patch"
    patch_description: "OHOS: add -march=armv8.2-a+bf16+fp16 and suppress toolchain warnings"
    patch_type: "portability"
  # NOTE: there is deliberately no patch for cmake/onnxruntime_mlas.cmake here.
  # That change (BF16+FP16 target flags) is applied by conanfile.py's
  # _patch_mlas_cmake(), because patch-ng could not match the hunk against the
  # 1.29.1 tree.
  - patch_file: "patches/0003-cmake-external-abseil-cpp.cmake.patch"
    patch_description: "Replace patch(1) --binary --ignore-whitespace with -l (the OHOS/toybox patch supports neither the long options nor --binary)"
    patch_type: "portability"
  - patch_file: "patches/0004-cmake-external-eigen.cmake.patch"
    patch_description: "Replace patch(1) --binary --ignore-whitespace with -l for the Eigen FetchContent patch step"
    patch_type: "portability"
  - patch_file: "patches/0005-cmake-external-onnxruntime_external_deps.cmake.patch"
    patch_description: "Replace patch(1) long options with -l for protobuf/date/GSL/ONNX/flatbuffers/dawn/coremltools, and skip the flatbuffers patch step on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0006-cmake-external-xnnpack.cmake.patch"
    patch_description: "Replace patch(1) --binary --ignore-whitespace with -l for the XNNPACK FetchContent patch step"
    patch_type: "portability"
  - patch_file: "patches/0007-onnxruntime-core-platform-posix-env.cc.patch"
    patch_description: "Guard pthread_setaffinity_np usage with !defined(__MUSL__) — OHOS musl does not provide it"
    patch_type: "portability"
  - patch_file: "patches/0008-onnxruntime-core-mlas-lib-mlasi.h.patch"
    patch_description: "Guard the SBGEMM BF16 kernel declarations with __ARM_FEATURE_BF16 so MLAS does not require compiler BF16 intrinsics"
    patch_type: "portability"
