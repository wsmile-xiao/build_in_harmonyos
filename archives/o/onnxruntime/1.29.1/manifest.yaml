software: onnxruntime

# 版本号
version: "1.29.1"

# 编译状态
status: built

# 编译日期
build_date: "2026-09-13"

# 构建系统
build_system: cmake

# 源码信息
source:
  url: "https://codeload.github.com/microsoft/onnxruntime/tar.gz/refs/tags/v1.29.1"
  sha256: "aba6ff915ffa3689af9bd6a84102a221ad35427e602f22bb18ae8323997d0f0d"
  tar_format: tar.gz

# 构建配置
build:
  system: cmake
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=<OHOS SDK>/ohos/native/build/cmake/ohos.toolchain.cmake"
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DCMAKE_CXX_STANDARD=20"
    - "-Donnxruntime_BUILD_SHARED_LIB=ON"
    - "-Donnxruntime_BUILD_UNIT_TESTS=OFF"
    - "-Donnxruntime_ENABLE_PYTHON=OFF"
    - "-Donnxruntime_MINIMAL_BUILD=OFF"
    - "-Donnxruntime_DISABLE_EXCEPTIONS=OFF"
    - "-Donnxruntime_DISABLE_RTTI=OFF"
    - "-Donnxruntime_DISABLE_CONTRIB_OPS=OFF"
    - "-Donnxruntime_USE_NNAPI_BUILTIN=OFF"
    - "-Donnxruntime_BUILD_JAVA=OFF"
    - "-Donnxruntime_BUILD_CSHARP=OFF"
    - "-Donnxruntime_BUILD_OBJC=OFF"
    - "-DFLATBUFFERS_BUILD_FLATC=OFF"
    - "-DONNX_CUSTOM_PROTOC_EXECUTABLE=<host protoc built from protobuf v21.12>"
  dependencies: []
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied:
  - "0001-cmake-adjust_global_compile_flags.cmake.patch"
  - "0002-cmake-onnxruntime_mlas.cmake.patch"
  - "0003-cmake-external-abseil-cpp.cmake.patch"
  - "0004-cmake-external-eigen.cmake.patch"
  - "0005-cmake-external-onnxruntime_external_deps.cmake.patch"
  - "0006-cmake-external-xnnpack.cmake.patch"
  - "0007-onnxruntime-core-platform-posix-env.cc.patch"
  - "0008-onnxruntime-core-mlas-lib-mlasi.h.patch"

# 知识沉淀
knowledge_gained:
  - "1.29.1 的 cmake_minimum_required 提升到 3.28（cmake/CMakeLists.txt:6），且 C++ 标准下限提升到 20 并用 FATAL_ERROR 强制（cmake/onnxruntime_language_standard_versions.cmake:9,48-65）"
  - "ONNX Runtime 仍然没有顶层 CMakeLists.txt，cmake/ 是唯一入口（build_script_folder='cmake' 依旧正确）"
  - "1.29.1 中 onnxruntime_MINIMAL_BUILD=ON 会经 cmake_dependent_option（cmake/CMakeLists.txt:200,202）连带把 DISABLE_EXCEPTIONS 与 DISABLE_RTTI 置为 ON——这会静默削弱运行时能力，本配方显式 MINIMAL_BUILD=OFF 且把两者置 OFF"
  - "交叉编译必须提供宿主 protoc：cmake/external/protobuf_function.cmake:40-45 在 ONNX_CUSTOM_PROTOC_EXECUTABLE 未设置时会回退到 $<TARGET_FILE:protobuf::protoc>，即把 aarch64 protoc 拿到构建主机执行"
  - "flatbuffers 的 FLATBUFFERS_BUILD_FLATC 只对 iOS/tvOS/visionOS/Android/Emscripten 自动关闭（onnxruntime_external_deps.cmake:449-452），OHOS 不在名单——必须显式 -DFLATBUFFERS_BUILD_FLATC=OFF，否则会构建 aarch64 flatc 作为 ALL 依赖；上游已提交生成好的 *.fbs.h，不需要 flatc"
  - "cpuinfo 经 FetchContent 引入，其 Linux 分支判断不认 OHOS（onnxruntime_external_deps.cmake:378-397 只匹配 CMAKE_SYSTEM_NAME=Linux），因此无法用 conandata 补丁修复，需要在 configure 之后就地改写 _deps/pytorch_cpuinfo-src/CMakeLists.txt"
  - "onnxruntime_USE_PREINSTALLED_EIGEN 是死选项（全树仅其自身声明一处），Eigen 始终走 FetchContent"
  - "OHOS 上 patch(1) 为 toybox 实现，不支持 --binary / --ignore-whitespace 长选项，上游各处 FetchContent PATCH_COMMAND 需要替换为 -l -p1（补丁 0003/0005/0006，0003/0005 已针对 1.29.1 重新生成——1.29.1 把 vcpkg-ports/abseil/*.patch 的路径与调用列表都改了）"
  - "1.29.1 的 cmake/deps.txt 仍是 Name;Url;SHA1 的 CSV 格式，1.27.1 recipe 的解析与镜像机制可直接沿用"
