# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: onnxruntime/1.29.1
homepage: "https://onnxruntime.ai"

# 上游测试命令
upstream_check_command: "./onnxruntime_test_all && ./onnxruntime_shared_lib_test   # 或 ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试规模（实测 onnxruntime-1.29.1 源码树）：
#   - onnxruntime/test/**/*_test.cc : 519 个
#   - onnxruntime/test/ 下全部文件  : 784 个
#   - 测试模型/数据（*.onnx 等）    : 924 个
#   - 框架                          : 自带 gtest（cmake/external/googletest）
#   - 启用条件                      : onnxruntime_BUILD_UNIT_TESTS=ON（本配方 OFF）
upstream_tests:
  - file: onnxruntime/test/
    description: "onnxruntime_test_all（算子/图优化/EP 测试），每文件一个 gtest 目标"
    command: "./onnxruntime_test_all"
    count: 519
    executed: false
    not_run_reason: "本配方 onnxruntime_BUILD_UNIT_TESTS=OFF；完整单测会再引入数百个 TU 与测试模型，单线程设备上不可行（详见 notes.md 的诚实申报）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_onnxruntime.cpp
    description: "Consumer test (C API): OrtGetApiBase/GetVersionString/GetApi → CreateEnv → 创建与释放 SessionOptions、RunOptions 等运行时对象"
    command: "./test_onnxruntime"
    assertions: 11

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11
