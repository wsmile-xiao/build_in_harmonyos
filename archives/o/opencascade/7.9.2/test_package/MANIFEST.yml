package: opencascade/7.9.2
homepage: "https://dev.opencascade.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# OCCT 上游测试基于 tests/ 目录的 Tcl 脚本体系（draw 需要 DRAWEXE 与 Tcl/TK），
# 本适配关闭了 Draw/DETools 模块，故不运行上游 tests 全集。

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "几何内核+布尔+STEP 往返真实功能断言（体积/面数/版本宏）"
    command: "./test_probe"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17