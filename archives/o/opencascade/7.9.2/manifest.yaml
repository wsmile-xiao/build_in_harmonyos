software: opencascade
version: "7.9.2"
build_system: cmake
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-19"

# 源码信息
source:
  url: "https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/V7_9_2.tar.gz"
  sha256: "3cd080d3fc33ba0c6c157e110afe3e015859524c4694dbb09812ec9d61595639"
  tar_format: tar.gz

# 构建配置
build:
  system: cmake
  configure_options:
    - "-DBUILD_MODULE_FoundationClasses=ON"
    - "-DBUILD_MODULE_ModelingData=ON"
    - "-DBUILD_MODULE_ModelingAlgorithms=ON"
    - "-DBUILD_MODULE_ApplicationFramework=ON"
    - "-DBUILD_MODULE_DataExchange=ON"
    - "-DBUILD_MODULE_Visualization=OFF"
    - "-DBUILD_MODULE_Draw=OFF"
    - "-DBUILD_MODULE_DETools=OFF"
    - "-DUSE_OPENGL=OFF"
    - "-DUSE_GLES2=OFF"
    - "-DUSE_XLIB=OFF"
    - "-DUSE_VTK=OFF"
    - "-DUSE_TK=OFF"
    - "-DUSE_TCL=OFF"
    - "-DUSE_D3D=OFF"
    - "-DUSE_OPENVR=OFF"
    - "-DUSE_FREEIMAGE=OFF"
    - "-DUSE_FFMPEG=OFF"
    - "-DUSE_FREETYPE=OFF"
    - "-DUSE_DRACO=OFF"
    - "-DUSE_TBB=OFF"
    - "-DUSE_RAPIDJSON=OFF"
    - "-DUSE_EIGEN=OFF"
  dependencies: []

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "os=OHOS 时 conan 默认把 CMAKE_SYSTEM_NAME 设成 HarmonyOS，而 cmake 只有 OHOS.cmake 平台文件，必须显式改回 OHOS 否则无 SONAME（沿用 7.9.3 经验）"
  - "package() 必须对产物 .so 显式重签（llvm-objcopy 去 .codesign + binary-sign-tool sign -selfSign 1），否则 dlopen 报 Permission denied（沿用 7.9.3 经验）"
  - "BUILD_MODULE_Visualization=OFF 不阻止 DataExchange/ApplicationFramework 内部工具库通过 EXTERNLIB 强依赖把 TKV3d/TKService 作为 full-deps 编出；如实声明进 cpp_info.libs"