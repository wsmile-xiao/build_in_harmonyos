software: opencascade
display: "Open CASCADE Technology (OCCT)"
description: "工业级三维几何内核：实体建模、布尔运算、STEP/IGES 等 CAD 数据交换"
category: cad
homepage: "https://dev.opencascade.org/"
license: LGPL-2.1-only-with-exception
build_system: cmake

versions:
  "7.9.2":
    status: built
    build_date: "2026-08-19"
    notes: >-
      沿用 7.9.3 已评审模块开关的方案，编译几何内核与数据交换
      （FoundationClasses/ModelingData/ModelingAlgorithms/ApplicationFramework/DataExchange）。
      产出 47 个 TK* 库，其中比 7.9.3 多 TKService/TKV3d 两个可视化依赖库——
      它们是被 DataExchange/ApplicationFramework 工具库经 EXTERNLIB 强依赖拉入的
      full-deps，非主动开启 Visualization；已在 cpp_info.libs 中如实声明。
      真机 conan create + test_package（17 断言）通过。
  "7.9.3":
    status: built
    build_date: "2026-08-04"
    notes: >-
      首个鸿蒙 PC conan 配方。只做几何内核与数据交换（FoundationClasses/ModelingData/
      ModelingAlgorithms/ApplicationFramework/DataExchange），共 44 个 TK* 库；
      Visualization/Draw/DETools 与 OpenGL/GLES/XLib/VTK/TK/TCL/D3D/OpenVR 全部关闭
      ——它们依赖桌面图形栈或 Windows 专有 API，鸿蒙 PC 上不适用。
      真机 conan create 通过，141 个 .so 的 SONAME 与 DT_NEEDED 全部合规。
