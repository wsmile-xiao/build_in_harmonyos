sources:
  url: "https://github.com/openscenegraph/OpenSceneGraph/archive/refs/tags/OpenSceneGraph-3.6.5.tar.gz"
  sha256: "aea196550f02974d6d09291c5d83b51ca6a03b3767e234a8c0e21322927d1e12"

patches:
  "3.6.5":
    - patch_file: "patches/0001-src-OpenThreads-CMakeLists.txt.patch"
      patch_description: "0001 src/OpenThreads/CMakeLists.txt: accept HarmonyOS as a UNIX-like platform for the pthreads backend (needed for native CMAKE_SYSTEM_NAME=HarmonyOS builds; harmless under Linux system name)"
      patch_type: "portability"
    - patch_file: "patches/0002-src-OpenThreads-pthreads-CMakeLists.txt.patch"
      patch_description: "0002 src/OpenThreads/pthreads/CMakeLists.txt: replace unconditional HAVE_PTHREAD_{TESTCANCEL,CANCEL,SETCANCELSTATE} defines with CHECK_FUNCTION_EXISTS probes (musl on OHOS does not implement thread cancellation); accept HarmonyOS in the _GNU_SOURCE branch"
      patch_type: "portability"
    - patch_file: "patches/0003-src-OpenThreads-pthreads-PThread.cpp.patch"
      patch_description: "0003 src/OpenThreads/pthreads/PThread.cpp: replace sys/unistd.h with unistd.h (OHOS musl sysroot has no sys/unistd.h)"
      patch_type: "portability"
    - patch_file: "patches/0004-src-osgUtil-tristripper-graph_array.h.patch"
      patch_description: "0004 src/osgUtil/tristripper/include/detail/graph_array.h: replace std::mem_fun_ref (deprecated C++11, removed C++17) with the equivalent explicit loop so osgUtil compiles under cppstd=17"
      patch_type: "portability"
    - patch_file: "patches/0005-src-osgPlugins-obj-obj.cpp.patch"
      patch_description: "0005 src/osgPlugins/obj/obj.cpp: replace std::not1(std::ptr_fun<int,int>(isspace)) (removed in C++17) with equivalent lambdas so the obj plugin compiles under cppstd=17"
      patch_type: "portability"
