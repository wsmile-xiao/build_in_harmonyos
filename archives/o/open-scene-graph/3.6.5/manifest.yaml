software: open-scene-graph
version: "3.6.5"
status: built
build_date: "2026-09-10"

source:
  url: "https://gh-proxy.com/https://github.com/openscenegraph/OpenSceneGraph/archive/refs/tags/OpenSceneGraph-3.6.5.tar.gz"
  sha256: "aea196550f02974d6d09291c5d83b51ca6a03b3767e234a8c0e21322927d1e12"
  tar_format: tar.gz

build:
  build_system: cmake
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DOPENGL_PROFILE=GLES3"
    - "-DOSG_GLES3_AVAILABLE=ON"
    - "-DOSG_GL1_AVAILABLE=OFF"
    - "-DOSG_GL2_AVAILABLE=OFF"
    - "-DOSG_GL3_AVAILABLE=OFF"
    - "-DOSG_GLES1_AVAILABLE=OFF"
    - "-DOSG_GLES2_AVAILABLE=OFF"
    - "-DOSG_GL_FIXED_FUNCTION_AVAILABLE=OFF"
    - "-DOSG_GL_DISPLAYLISTS_AVAILABLE=OFF"
    - "-DOSG_GL_MATRICES_AVAILABLE=OFF"
    - "-DOSG_GL_VERTEX_FUNCS_AVAILABLE=OFF"
    - "-DOSG_GL_VERTEX_ARRAY_FUNCS_AVAILABLE=OFF"
    - "-DOSG_WINDOWING_SYSTEM=None"
    - "-DBUILD_OSG_EXAMPLES=OFF"
    - "-DBUILD_OSG_APPLICATIONS=ON"
    - "-DBUILD_OSG_PLUGINS=ON"
    - "-DOSG_TEXT_USE_FONTCONFIG=OFF"
    - "-DBUILD_SHARED_LIBS=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-OpenThreads-CMakeLists.txt.patch"
  - "0002-src-OpenThreads-pthreads-CMakeLists.txt.patch"
  - "0003-src-OpenThreads-pthreads-PThread.cpp.patch"
  - "0004-src-osgUtil-tristripper-graph_array.h.patch"
  - "0005-src-osgPlugins-obj-obj.cpp.patch"

knowledge_gained:
  - "OpenSceneGraph 3.6.5 上游无 ctest 注册测试（全库 0 个 add_test/enable_testing）；测试形态是 examples/ 交互式 GPU 演示，无头 CI 不可跑，N=0 全量豁免"
  - "GLES3 profile: OPENGL_gl_LIBRARY/EGL_LIBRARY 需手动注入 OHOS sysroot 的 libGLESv3.so/libEGL.so（CMake FindOpenGL 不支持 GLES-only sysroot）"
  - "musl 无 pthread_cancel 族函数：用 CHECK_FUNCTION_EXISTS 探测后再定义 HAVE_PTHREAD_*（补丁 0002）"
  - "OHOS musl sysroot 无 sys/unistd.h，改用顶层 unistd.h（补丁 0003）"
  - "CMAKE_SYSTEM_NAME=Linux + aarch64（E092）使上游 IF(UNIX) 分支走 pthreads 后端，兼容旧 CMake 语法"
  - "std::mem_fun_ref C++17 移除：tristripper graph_array.h 改显式循环（补丁 0004）"
  - "std::ptr_fun/not1 C++17 移除：osgPlugins/obj obj.cpp 改 lambda（补丁 0005）"
  - "cfg 插件 lex/yacc 生成代码用 register 关键字（C++17 移除）：注入 -Wno-register（clang 下降级为忽略）"
  - "OpenThreads CheckAtomicOps try_run 交叉编译不可执行：预置 _OPENTHREADS_ATOMIC_USE_GCC_BUILTINS_EXITCODE=0（同 examples/osgemscripten 上游自用方案）"
  - "CMake install 期 RPATH 重写在 HMDFS 上损坏 ELF（安装副本 musl 加载失败、构建副本正常）：CMAKE_BUILD_WITH_INSTALL_RPATH=ON 使 install 变纯复制"
  - "HMDFS conan 缓存包目录拒绝 execve：消费者验证需把包产物字节级镜像到可执行目录运行"
