# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: open-scene-graph/3.6.5
homepage: "https://github.com/openscenegraph/OpenSceneGraph"

# 上游测试口径（源码审计 OpenSceneGraph-3.6.5 tag）：
# - 全库 0 个 add_test / enable_testing 注册（CTestConfig.cmake 仅配置 CDash
#   dashboard，从未被喂入测试）。
# - 上游的"测试"形态是 examples/ 交互式 GPU 演示（BUILD_OSG_EXAMPLES 默认 OFF），
#   需要显示服务器 + GPU，无头 CI 环境不可运行（2026-06 原生构建同样确认
#   "make check: 无自动化测试"）。
# - 因此上游注册测试目标数 N=0，无可跑项，也无需逐项豁免。
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest (0 tests registered upstream)"
upstream_registered_test_count: 0
upstream_tests: []

# 适配侧验证（无 GPU 环境的替代验证链）：
# 1. 构建期 smoke: conanfile.build() 运行已构建的 osgversion 二进制
# 2. 消费者测试: test_package 链接 libosg/libosgDB/libOpenThreads 调用真实 API
test_package_tests:
  - file: test_osg_consumer.cpp
    description: "消费者测试：链接打包的 osg/osgDB/OpenThreads 库，调用 osgGetVersion/osgDB::Registry/OpenThreads::GetNumberOfProcessors 并运行打包的 osgversion"
    command: "./test_osg_consumer"

# 断言数：上游 0 + 消费者 4（版本串/Registry 非空/处理器数/退出码）
assertion_count: 4
