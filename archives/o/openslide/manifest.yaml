software: openslide
display: "OpenSlide"
description: "A C library for reading whole slide images (virtual slides)，数字病理全幻灯片图像读取库"
category: imaging
homepage: "https://openslide.org/"
license: LGPL-2.1-only
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 构建，全部 11 个依赖均为硬依赖（无格式裁剪开关），依赖链 glib/cairo/libtiff/openjpeg/libpng/libjpeg/zstd/zlib/libxml2/sqlite3/libdicom 全部来自 ohpcd 制品仓"
    - "openjpeg 配方未声明 libopenjp2 pkg-config 名，配方 generate() 中通过 PkgConfigDeps.set_property 补 libopenjp2.pc 别名"
    - "wrap_mode=nodownload 禁用 meson subproject 下载（libdicom/uthash/xdelta3 wrap）；llvm-ar/ranlib 全路径注入 native file"
    - "安装产物含 slidetool 命令行工具（另 3 个旧工具为指向它的符号链接）"
  common_dependencies:
    - glib/2.84.0.2
    - cairo/1.18.4
    - libjpeg-turbo/3.2.0
    - libpng/1.6.58
    - libtiff/4.7.2
    - openjpeg/2.5.4
    - libxml2/2.15.3.1
    - sqlite3/3.53.4
    - libdicom/1.3.0
    - zstd/1.5.7
    - zlib/1.3.1.1

versions:
  "4.0.1":
    status: built
    build_date: "2026-09-12"
