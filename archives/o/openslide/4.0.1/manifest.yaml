name: openslide
version: "4.0.1"
status: built
build_date: "2026-09-12"
build_system: meson
conan_ref: "openslide/4.0.1"

source:
  url: "https://github.com/openslide/openslide/releases/download/v4.0.1/openslide-4.0.1.tar.xz"
  sha256: "df82f6b264f98d11eeb80d85bbb10c7935fcd69c7abae1d610ce49b9a0437faf"
  release_date: "2026-06-08"

build:
  package_type: library
  default_variant: static
  target: aarch64-linux-ohos
  jobs: 1
  wrap_mode: nodownload

dependencies:
  - "zlib/1.3.1.1"
  - "zstd/1.5.7"
  - "libjpeg-turbo/3.2.0"
  - "libpng/1.6.58"
  - "openjpeg/2.5.4"
  - "libtiff/4.7.2"
  - "glib/2.84.0.2"
  - "cairo/1.18.4"
  - "libxml2/2.15.3.1"
  - "sqlite3/3.53.4"
  - "libdicom/1.3.0"

patches_applied: []

notes:
  - "全部 meson 依赖为硬依赖，无格式裁剪开关；test/doc 关闭，wrap_mode=nodownload"
  - "openjpeg 补 libopenjp2.pc 别名（PkgConfigDeps.set_property）"