# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
package: openslide/4.0.1
homepage: "https://openslide.org/"

# 上游测试命令（openslide 上游用 meson 构建开发者测试程序，由 test/driver.py
# 驱动；driver.py 依赖 cjpeg/djpeg/xdelta3 与外部幻灯片样例语料库，在离线 CI
# 中不可获取。因此配方在 build() 中直接构建并执行上游全部 6 个测试程序本体，
# 输入为配方生成的合成 tiled generic-TIFF 幻灯片）
upstream_check_command: "meson compile -C build extended mosaic parallel profile query try_open"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "extended <slide> | mosaic <dir> <index> <out.png> | parallel <slide> 4 | profile <slide> 0 | query -n <slide> | try_open -n generic-tiff <slide>"

# 上游实际运行的测试程序 (openslide-4.0.1/test/)
upstream_tests:
  - file: "test/extended.c"
    source: "openslide-4.0.1.tar.xz/test/extended.c"
    description: "Extended API surface tests: level/downsample queries, NULL and empty region reads, property enumeration, associated images and ICC profiles, out-of-bounds fetches, border opacity, quickhash, fd-leak and cloexec checks, shared-cache threading stress"
    command: "extended synthetic-generic-tiff.tif"
  - file: "test/parallel.c"
    source: "openslide-4.0.1.tar.xz/test/parallel.c"
    description: "Reads a whole level 0 through 4 concurrent reader threads and reports tiles/sec"
    command: "parallel synthetic-generic-tiff.tif 4"
  - file: "test/try_open.c"
    source: "openslide-4.0.1.tar.xz/test/try_open.c"
    description: "Opens a slide, checks the detected vendor, properties and regions, and verifies that no file descriptors leak after close"
    command: "try_open -n generic-tiff synthetic-generic-tiff.tif"
  - file: "test/query.c"
    source: "openslide-4.0.1.tar.xz/test/query.c"
    description: "Reports the slide vendor (openslide_detect_vendor)"
    command: "query -n synthetic-generic-tiff.tif"
  - file: "test/mosaic.c"
    source: "openslide-4.0.1.tar.xz/test/mosaic.c"
    description: "Renders a tile mosaic of the slide through Cairo and writes a PNG"
    command: "mosaic . mosaic-index.ini mosaic.png"
  - file: "test/profile.c"
    source: "openslide-4.0.1.tar.xz/test/profile.c"
    description: "Reads an entire level in 1000x1000 chunks through openslide_read_region"
    command: "profile synthetic-generic-tiff.tif 0"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test_package/test_openslide.c"
    description: "Consumer smoke test: writes a minimal tiled 256x256 RGB TIFF (128x128 tiles), asserts vendor detection, openslide_open non-NULL with clean error, level_count>=1, level-0 dimensions 256x256, read_region clean status with nonzero pixels, and openslide_close. Executed for real; a non-zero exit status fails the build"
    command: "./test_openslide"

# 测试断言总数（上游 6 个测试程序 + 消费者测试 8 项断言）
assertion_count: 14
