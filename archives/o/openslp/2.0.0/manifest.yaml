# 版本级 manifest — openslp 2.0.0
# 遵循 ARCHIVE-SPEC v2.0

version: "2.0.0"
software: "openslp"
status: built
build_date: "2026-09-04"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/openslp/2.0.0/2.0.0%20Release/openslp-2.0.0.tar.gz"
  sha256: "924337a2a8e5be043ebaea2a78365c7427ac6e9cee24610a0780808b2ba7579b"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
  - "--disable-dependency-tracking"
  - "--disable-shared"
  - "--enable-static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
- "OpenSLP 2.0.0 官方 release tarball 自带 configure（2012 版 config.sub），无需 autoreconf；交叉编译仅需给 config.sub 补 linux-ohos OS 识别"
- "2012 版 config.sub 已含 aarch64，只需三处补丁：kernel-os 组合表 linux-ohos*、valid-os 表 -linux-ohos*、-linux* 归一化前的 -linux-ohos* 特例"
- "configure 的 'working POSIX fnmatch' 探针是运行时测试，交叉编译无法执行返回 cross → 误走 LIBOBJS 替换分支链接不存在的 fnmatch_.h；设 ac_cv_func_fnmatch_works=yes（musl 自带 fnmatch）"
- "本地 WSL 用 Windows BiSheng clang.exe 交叉时，-MP 依赖文件含 D: 盘符头路径会使 make 报 multiple target patterns → configure --disable-dependency-tracking"
- "静态构建（--disable-shared --enable-static）同时规避 libtool .so 符号链接在 \\wsl$ UNC 下不可读的问题"
