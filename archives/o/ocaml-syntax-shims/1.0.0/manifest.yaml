# 版本级 manifest 模板
# 文件位置: archives/o/ocaml-syntax-shims/1.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 软件名
software: "ocaml-syntax-shims"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-15"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (GitHub archive endpoint, .tar.gz format)
  url: "https://github.com/ocaml-ppx/ocaml-syntax-shims/archive/refs/tags/1.0.0.tar.gz"

  # 源码校验和
  sha256: "3a477125a3413cab0fcd759165918a492d0a7c0aa5fccca1b90b705bc838ea3a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ocaml/4.14.1.1.2
    - dune/3.17.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "dune install 在 HMDFS 上失败（遍历父目录权限问题），需手动拷贝构建产物"
  - "dune 二进制硬编码编译时 OCaml 包路径，可能需创建符号链接修复 stale path"
