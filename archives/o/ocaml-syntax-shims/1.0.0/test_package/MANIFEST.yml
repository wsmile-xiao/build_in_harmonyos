# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: ocaml-syntax-shims/1.0.0
homepage: "https://github.com/ocaml-ppx/ocaml-syntax-shims"

# 上游测试命令 (dune runtest)
upstream_check_command: "dune runtest -p ocaml-syntax-shims"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "dune runtest -p ocaml-syntax-shims"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.ml
    source: ocaml-syntax-shims-1.0.0/test/test.ml
    description: "Syntax transformation test (future_syntax preprocessing)"
    command: "dune runtest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ocaml_syntax_shims.sh
    description: "Shell wrapper: feeds test_input.ml to ocaml-syntax-shims binary"
    command: "bash test_ocaml_syntax_shims.sh <bin_path>"
  - file: conanfile.py
    description: "Runs ocaml-syntax-shims binary on OCaml source input"
    command: "echo 'let x = 1' | ocaml-syntax-shims"

# 测试断言总数
assertion_count: 1
