# 软件级 manifest — archives/o/open-dis-cpp/manifest.yaml
# 遵循 knowledge/ARCHIVE-SPEC.md v3.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: open-dis-cpp

# 显示名
display: "OpenDIS C++"

# 一句话描述
description: "分布式交互仿真 DIS 协议 (IEEE 1278.1) 的 C++ 实现，提供 DIS6/DIS7 两套协议编解码库"

# 分类标签
category: network

# 官网 URL
homepage: "https://github.com/open-dis/open-dis-cpp"

# 开源许可证（SPDX 标识）
license: BSD-2-Clause

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "CMake 4.x 下需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5（上游 cmake_minimum_required(VERSION 3.2) 已失去兼容）"
    - "DIS6 与 DIS7 两库类同名但内存布局不同（92 个同名头文件、同处 namespace DIS），必须按协议版本二选一链接，配方拆成 dis6/dis7 两个 component"
    - "上游示例应用 BUILD_EXAMPLES 依赖 SDL2/SDL2_net（可选依赖，缺省关闭，不构成止损）"
    - "上游测试为自带 Catch2 v2.13.10（test/catch.hpp 单头），BUILD_TESTS=ON 后由 CTest 驱动"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0.1":
    status: built
    build_date: "2026-09-29"
    conan_ref: "open-dis-cpp/1.0.1"
