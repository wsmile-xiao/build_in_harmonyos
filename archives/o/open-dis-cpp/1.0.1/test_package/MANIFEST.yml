# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求, L0e 门禁)
package: open-dis-cpp/1.0.1
homepage: "https://github.com/open-dis/open-dis-cpp"

# 上游测试命令 (上游 CMake 选项 BUILD_TESTS=ON → enable_testing + add_test)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试 (can_run 下 cmake.test())
upstream_test_in_build: true
upstream_test_command: "cmake.test() -> ctest --output-on-failure (Catch2 v2.13.10; CTest 注册 1 个入口 UnitTestSuite, 内含 8 个 TEST_CASE)"

# 上游测试源文件 (Catch2 v2.13.10, test/catch.hpp 随源码自带, 8 个 TEST_CASE = 源码宏 8 = --list-tests 注册 8)
upstream_tests:
  - file: test/DataStreamTests.cpp
    source: open-dis-cpp-1.0.1/test/DataStreamTests.cpp
    description: "DataStream 编解码与链式数据类型 (TEST_CASE 2 / tag [DataStream])"
    command: "./test/UnitTestSuite \"[DataStream]\""
  - file: test/IncomingMessageTests.cpp
    source: open-dis-cpp-1.0.1/test/IncomingMessageTests.cpp
    description: "IncomingMessage 处理器注册/观测 (TEST_CASE 4 / tag [IncomingMessage])"
    command: "./test/UnitTestSuite \"[IncomingMessage]\""
  - file: test/PduMarshallTests.cpp
    source: open-dis-cpp-1.0.1/test/PduMarshallTests.cpp
    description: "EntityStatePdu / DetonationPdu 序列化回环 (TEST_CASE 2 / tag [PduMarshall])"
    command: "./test/UnitTestSuite \"[PduMarshall]\""

# test_package 中自带的测试 (消费者视角验证, 不计入上游分母)
test_package_tests:
  - file: test_dis6_roundtrip.cpp
    description: "DIS6 消费者: DataStream + EntityStatePdu marshal/unmarshal 回环 (16 项断言)"
    command: "ctest --output-on-failure -R test_dis6_roundtrip"
  - file: test_dis7_roundtrip.cpp
    description: "DIS7 消费者: DataStream + EntityStatePdu marshal/unmarshal 回环 (15 项断言)"
    command: "ctest --output-on-failure -R test_dis7_roundtrip"
  - file: test_ohos_runtime.cpp
    description: "鸿蒙运行时: 位宽/字节序/网络序落盘 + 打包 .so 的 DT_NEEDED 与运行时映射核对 (9 项断言, 实测 skipped=0)"
    command: "ctest --output-on-failure -R test_ohos_runtime"

# 测试断言总数 = 上游 Catch2 实跑断言 157 + test_package 消费者断言 40 (16+15+9)
assertion_count: 197
