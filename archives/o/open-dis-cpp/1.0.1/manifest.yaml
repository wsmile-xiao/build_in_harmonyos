# 版本级 manifest — archives/o/open-dis-cpp/1.0.1/manifest.yaml
# 遵循 knowledge/ARCHIVE-SPEC.md v3.0（CI 以 conanfile.py 为唯一输入，本文件为交叉校验元数据）

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.1"

# 软件名
software: "open-dis-cpp"

# 编译状态（published | built | failed | archived；本工作区 O5：合并+release upload 前只写 built）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方 tag 归档）
  url: "https://github.com/open-dis/open-dis-cpp/archive/refs/tags/v1.0.1.tar.gz"

  # 源码校验和（与 conandata.yml 同源，sha256sum 实测）
  sha256: "c8c899aa3553da898f586c31e1b34512a448921a77bd15fc2611c0b1a7ce49b2"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（与 conanfile.py generate() 中的 cache_variables 一致）
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTS=ON"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # CMake/Meson 入口的单行构建选项（autotools 入口读 configure_options）：
  # 干净构建验证（G0）走 cmake 时按本键取参，缺它则 G0 因 CMake 4.x 拒绝
  # cmake_minimum_required(VERSION 3.2) 而 configure 失败（实测见 notes.md #1）
  build_options: "-DBUILD_SHARED_LIBS=ON -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表：上游零外部依赖（W0 双源复核，见 notes.md）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 本版本无需补丁（全部适配走配方 configure 变量，上游源码零改动）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 全程未踩到引擎未命中的新坑 → 零草稿为正常终态（AGENTS §3.8）
knowledge_gained: []
