patches:
  "0.6":
    - patch_file: "patches/0001-rename-select-signal-callbacks.patch"
      patch_description: "Rename the file-local static 'select' signal callbacks in the four chooser algorithms (closest_diff, max_fisher, max_kl, pick_rand) to 'select_cb'. OHOS musl declares the POSIX select(2) prototype in sys/select.h (reached via glib/gmain.h) in the default mode without any feature macro, so a file-local `static gint select(...)` collides with it and clang raises a hard error ('static declaration of select follows non-static declaration') that cannot be downgraded with -Wno-error. Only the C identifier is renamed; the GObject signal name \"select\" is untouched."
      patch_type: "portability"
