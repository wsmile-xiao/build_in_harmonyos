# 版本级 manifest — oscats 0.6
# 遵循 ARCHIVE-SPEC v2.0

version: "0.6"
software: oscats

status: built
build_date: "2026-09-11"
build_system: autotools
conan_ref: "oscats/0.6"

source:
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/oscats/oscats-0.6.tar.gz"
  sha256: "2f7c88cdab6a2106085f7a3e5b1073c74f7d633728c76bd73efba5dc5657a604"
  tar_format: tar.gz

build:
  package_type: library
  default_variant: static
  target: aarch64-linux-ohos
  system: autotools
  configure_options:
  - "--build=aarch64-linux --host=aarch64-linux"
  - "--disable-glibtest --disable-gsltest"
  - "--disable-gtk-doc --disable-gtk-doc-html"
  - "make -C src（仅 src/liboscats；bindings/doc 不参与。不可用 make SUBDIRS=src —— 命令行变量经 MAKEFLAGS 递归覆盖 src/Makefile 的 SUBDIRS=liboscats）"
  dependencies:
  - "glib/2.84.0.1"
  - "gsl/2.8"
  cc: clang

patches_applied:
- "patches/0001-rename-select-signal-callbacks.patch — 把四个选题算法（closest_diff/max_fisher/max_kl/pick_rand）的文件内 static 信号回调 `select` 改名 `select_cb`；OHOS musl 的 sys/select.h（经 glib/gmain.h 引入）在默认模式下无条件声明 POSIX select(2)，clang 报硬错误（-Wno-error 无法降级，宏改名同样无效）。GObject 信号名 \"select\" 不变"
compat_files:
- "compat/config.sub — 2022 FSF 版（上游 2009 版不认识 aarch64）"
- "compat/glib-compat.h — 补齐 glib 2.80 移除的 G_MIN*/G_MAX* 常量（-include 注入）"

knowledge_gained:
- "basic_layout(self, src_folder=\".\") 若不显式传 build_folder=\".\"，folders.build 默认是 build-<build_type>；build() 期间 os.getcwd()==build_folder 与 source_folder 分离 → 按 self.build_folder 拼的源码树路径（config/config.sub、configure）全部落空、被 os.path.isdir 守卫静默跳过，且 make() 以 os.getcwd() 为工作目录找不到 src/"
- "2009 版 autotools tarball 的 config.sub 完全不认识 aarch64（实测 `config.sub aarch64-linux` → machine not recognized）；给 configure 显式 --build/--host 后 config.guess 不会被调用。注意替换目标：configure.in 有 AC_CONFIG_AUX_DIR([config]) → configure 用的是 config/config.sub，不是构建根的 config.sub"
- "glib 2.80 把 G_MININT/G_MAXINT/G_MINUINT/G_MAXUINT/G_MAXDOUBLE/G_MINDOUBLE 等经典常量从 glib/gtypes.h 移除（改用 limits.h/float.h）；而 gtypes.h 自身不 include limits.h/float.h → 兼容 shim 必须自带这两个头，再用 -include 强制注入"
- "automake 的 liboscats_la_CFLAGS 硬编码 -Werror 时，可在 CFLAGS 追加 -Wno-error 覆盖（编译行里 CFLAGS 位于 per-target CFLAGS 之后，clang/gcc 后写者胜）"
- "2011 年代码依赖 tentative definition → 需 -fcommon（clang 15 默认 -fno-common 会 multiple definition）"
- "make 命令行变量（SUBDIRS=src）会写入 MAKEFLAGS 递归传给所有子 make 且优先级高于子 Makefile → 覆盖 src/Makefile 自己的 SUBDIRS=liboscats；只进某子目录请用 make -C <dir>"
- "SHELL/CONFIG_SHELL 必须实测选定并让 configure 与 make 两侧统一：profile 把两者指向 HNP bash（HMDFS 上 getcwd 失败）；若 configure 侧 shell 有 print 内建而 make 侧没有，config.status 会写 60+ 次 `print: command not found`，生成的 libtool 引号失衡 → `libtool: line 315: syntax error near unexpected token '}'`"
- "TMPDIR 不能落在 HMDFS：make 4.4+ 的 jobserver 需在 $TMPDIR 下 mkfifo，HMDFS 不支持（Operation not permitted）；但 TMPDIR 指到沙箱外又可能不可写。须逐候选实测「可写 + mkfifo 可用」"
- "依赖包提供的 *-config/.pc 路径不可盲信：制品仓 gsl/2.8 的 bin/gsl-config 前缀写死为 /，--cflags 输出 -I//include、--libs 输出 -L//lib；AX_PATH_GSL 原样抄进 GSL_CFLAGS，配合 --disable-gsltest 跳过自检 → 直到编译 models/*.c 才报 'gsl/gsl_vector.h' file not found。修法：复制该脚本到构建目录就地改写路径后用 GSL_CONFIG 指向副本"
- "AM_PATH_GLIB_2_0 只需 glib-2.0.pc + gobject-2.0.pc（MODULES=gobject）；交叉环境下用 --disable-glibtest/--disable-gsltest 关掉 compile+run 自检"
- "写消费测试注意：oscats_space_dim_get_max() 只接受自然维度（内部 g_return_val_if_fail 断言 OSCATS_DIM_NAT），对连续维度调用会打 OSCATS-CRITICAL 断言并返回 0；连续维度应用 oscats_space_dim_get_name()/oscats_space_validate()"
