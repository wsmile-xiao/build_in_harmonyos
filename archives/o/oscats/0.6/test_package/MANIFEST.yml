# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
#
# 上游 oscats 0.6 无任何自动化测试：全仓 Makefile.am 无 TESTS / check_PROGRAMS
# 赋值（doc/liboscats/Makefile.am 仅有注释掉的 `#TESTS = $(GTKDOC_CHECK)`，
# 属 gtk-doc 自带且未启用；examples/Makefile.am 的 ex01–ex03 是 bin_PROGRAMS
# 交互式演示，ex04 被注释不编译）——故上游实测 N = 0。
# test_package 为 OHOS 适配自研的消费者侧 L1 验证。

package: oscats/0.6
homepage: "https://code.google.com/archive/p/oscats/"

upstream_official_tests: []
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 适配补全测试（自研，非上游迁移）
adapted_tests: []

test_package_tests:
  - file: test_oscats.c
    origin: ohos-adaptation (self-authored)
    description: >-
      消费者契约：用公开 API 跑一次真实 1D CAT 闭环。1 个连续潜变量维度 →
      20 个 1PL 题项（b~N(0,1)）→ OscatsTest 注册 SIMULATE/ESTIMATE/
      EXPOSURE_COUNTER/FIXED_LENGTH(len=10)/CLOSEST_DIFF → 3 名考生各作答
      10 题。断言：OscatsSpace/OscatsItemBank/OscatsTest 构造成功、
      space size/dim max、题库题数、施测题数、能力估计有限、题目曝光率
      落在 [0,1]。
    command: "./test_oscats"

# 运行期断言执行次数：8 个断言点，其中施测循环内 2 个断言点 × 3 名考生，
# 故 6 + 2×3 = 12 次（程序末尾打印 "N checks, M failed" 亦为 12）。
assertion_count: 12
