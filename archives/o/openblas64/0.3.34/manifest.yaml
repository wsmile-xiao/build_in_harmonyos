software: openblas64
version: "0.3.34"
status: built
build_system: makefile
build_date: 2026-09-12

source:
  url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.34/OpenBLAS-0.3.34.tar.gz"
  sha256: "cd7e129868320cc2d033afa920e31202dfe0b8066a5b66661900ccc0f197dfed"
  tar_format: tar.gz

build:
  system: makefile
  cc: clang
  make_args:
    - "TARGET=ARMV8"
    - "BINARY=64"
    - "INTERFACE64=1"
    - "LIBNAMESUFFIX=64"
    - "NOFORTRAN=1"
    - "NO_SHARED=0"
    - "NO_AFFINITY=1"
    - "shared"

patches_applied:
  - "patches/0002-ohos-musl-affinity.patch"

knowledge_gained:
  - "ILP64 要素：INTERFACE64=1（64 位整型 ABI，blasint/lapack_int 为 64 位）+ LIBNAMESUFFIX=64（库名 libopenblas64，与 LP64 的 libopenblas 并存不冲突；不用 SYMBOLSUFFIX=64_，单包内符号保持上游默认）"
  - "NOFORTRAN=1 是官方主变量（Makefile.system 自动置 C_LAPACK=1）；ILP64 与 NOFORTRAN 可组合（C 版 LAPACK 按 LAPACK_ILP64 编译）"
  - "blas_server.c 的 openblas_setaffinity/getaffinity 由通用能力宏 HAVE_PTHREAD_SETAFFINITY_NP 门控（构建期编译+链接探测产生，无平台宏）；musl 工具链（如 OHOS）libc.so 不导出 pthread_setaffinity_np/getaffinity_np 且该段不受 NO_AFFINITY 保护，探测失败则不编译该段以避免链接错误"
  - "build() 与 package() 必须用同一套 make 变量（Makefile.system 推导库名与安装布局）；package() 走 make install（生成 openblas_config.h/lapack.h、加工 cblas.h、产出 openblas64.pc 与 cmake 配置）"
  - "上游测试：utest + ctest/CBLAS 为纯 C（无 Fortran 依赖），在 ILP64 下同样构建执行；Fortran 测试（test/、lapack-netlib/）缺编译器时如实跳过，不伪装通过"
