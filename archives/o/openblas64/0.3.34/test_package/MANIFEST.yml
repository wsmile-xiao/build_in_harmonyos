# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: openblas64/0.3.34
homepage: "https://github.com/OpenMathLib/OpenBLAS"

# conanfile.py build() 方法中已集成上游测试（_run_upstream_tests 在构建期内
# 真实构建+执行 utest/ctest，非手工替代；变量含 INTERFACE64=1 LIBNAMESUFFIX=64）
upstream_test_in_build: true
upstream_test_command: "make -C utest && ./openblas_utest && ./openblas_utest_ext && make -C ctest all"

upstream_tests:
  - name: utest (C)
    source: "utest/ (openblas_utest + openblas_utest_ext)"
    case_basis: "utest 2 个可执行（openblas_utest + openblas_utest_ext）；同源 openblas 0.3.33 内层用例 1650 项（128 + 1522）仅供参考，声明口径按 C 可执行数（utest 2 + ctest 12 = 14）"
    result: "待真机预检回填"
  - name: ctest/CBLAS (C)
    source: "ctest/ (xscblat1/2/3、xdcblat1/2/3、xccblat1/2/3、xzcblat1/2/3)"
    case_basis: "12 个可执行；C 可执行合计 14（utest 2 + ctest 12），0.3.34 以真机预检实测为准"
    result: "待真机预检回填"
  - name: test/ Fortran BLAS
    source: "test/ (14 个 .f 主程序)"
    case_basis: "14 项"
    result: "未执行——OHOS/aarch64 环境没有 gfortran/flang/flang-new（NOFORTRAN=1 构建不依赖 Fortran）"
  - name: lapack-netlib Fortran
    source: "lapack-netlib/ (INSTALL/BLAS/TESTING/TESTING)"
    case_basis: "约 1243 项（同源 0.3.33 口径）"
    result: "未执行——同上缺 Fortran 编译器；恢复条件：Fortran 可用后执行 make lapack-test/blas-test"

external_integration_note: >-
  可执行的 C 上游测试以真机预检实测为准（utest + ctest/CBLAS）；
  Fortran 上游测试未执行（test/ + lapack-netlib，缺编译器）；
  上游完整测试通过率不得将未执行测试标记为通过；
  恢复条件：待 OHOS Fortran 编译器及运行时可用后执行 make blas-test、make lapack-test。

test_package_tests:
  - file: test.c
    description: "适配后测试（独立于上游测试统计）：直接链接 libopenblas64 并做真实数值计算——CBLAS 的 cblas_ddot/cblas_dgemm（64 位整型参数），LAPACK 的 LAPACK_dgesv（解线性方程组）/LAPACK_dpotrf（Cholesky），LAPACKE 的 LAPACKE_dgesv，逐项校验计算结果；另核对 sizeof(lapack_int)==8（ILP64 证明）与 openblas_get_config() 版本串含 0.3.34"
    command: "./test_probe"

assertion_count: 7
