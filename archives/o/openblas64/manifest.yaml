software: openblas64
display: "OpenBLAS64"
description: "Optimized BLAS (Basic Linear Algebra Subprograms) library based on GotoBLAS2, ILP64 64-bit integer interface"
category: foundation
homepage: "https://github.com/OpenMathLib/OpenBLAS"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "OpenBLAS ILP64 变体：INTERFACE64=1（blasint/lapack_int 为 64 位）+ LIBNAMESUFFIX=64（库名 libopenblas64，与 LP64 的 libopenblas 并存）"
    - "使用 make 构建系统；NOFORTRAN=1（f2c 版 LAPACK，不依赖 Fortran 工具链）"
    - "TARGET=ARMV8，设备原生构建；package() 走 make install（生成 openblas_config.h/lapack.h、加工 cblas.h、产出 openblas64.pc）"
    - "affinity 代码由构建期真实探测的 HAVE_PTHREAD_SETAFFINITY_NP 门控（无平台宏）"

versions:
  "0.3.34":
    status: built
    build_date: "2026-09-12"
    notes: "ILP64 首配；NOFORTRAN=1；utest/ctest 在 build 流程内执行；test_package 7 项断言"
