software: openexr
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.1.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.1.5"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（顶级字段，用于 G4 检查）
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/AcademySoftwareFoundation/openexr/tar.gz/refs/tags/v3.1.5"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_TESTING=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "zlib/1.3.1"
    - "imath/3.1.5"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 自动下载 Imath 依赖"
  - "平台未知警告不影响编译"