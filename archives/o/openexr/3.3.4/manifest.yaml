# openexr 3.3.4 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "3.3.4"
software: openexr
status: built
build_date: "2026-09-10"
build_system: cmake

source:
  url: "https://github.com/AcademySoftwareFoundation/openexr/releases/download/v3.3.4/openexr-3.3.4.tar.gz"
  sha256: "73a6d83edcc68333afb95e133f6e12012073815a854bc41abc1a01c1db5f124c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_TESTING=OFF"
    - "OPENEXR_BUILD_TOOLS=ON"
    - "OPENEXR_BUILD_LIBS=ON"
    - "OPENEXR_FORCE_INTERNAL_DEFLATE=OFF"
    - "BUILD_SHARED_LIBS=ON"
  dependencies:
    - "imath/3.2.2"
    - "libdeflate/1.22"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-test-tmpdir.patch"

knowledge_gained:
  - "CMakeDeps 组件目标名与上游 find_package 期望名不一致时用 set_property(cmake_target_name) 对齐，避免上游 FetchContent 回退"
  - "依赖包 cpp_info 组件 includedirs 缺子目录（如 include/Imath）时，在下游配方 generate() 对 components 直接改绝对路径列表（相对路径会被丢弃、包级修改不传导组件）"
  - "CMake 对 HarmonyOS 无 platform module 不传 SONAME，需显式注入 CMAKE_SHARED_LIBRARY_SONAME_C/CXX_FLAG，否则库间 NEEDED 为构建树相对路径"
  - "上游测试 tmpDir 硬编码 /var/tmp，POSIX 通用改法：imf_tmp_dir() 运行时解析 IMF_TMP_DIR/TMPDIR 环境变量回退 /var/tmp（无平台宏，Linux 兼容）"
