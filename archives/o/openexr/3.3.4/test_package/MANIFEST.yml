# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: openexr/3.3.4
homepage: "https://www.openexr.com"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 说明：OpenEXR 上游测试套（BUILD_TESTING 门控的 135 项注册测试）不在
# conan 包产物中（conan create 默认 BUILD_TESTING=OFF，与 conan-center-index
# 3.x 官方配方口径一致）。上游套件通过独立构建树（BUILD_TESTING=ON +
# 0001-ohos-test-tmpdir.patch）全量执行，135/135 通过（100%），
# 结果记录于 ../reports/test-report.md 与 ../notes.md。
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游实际运行的测试（ctest -N 实测注册数 135，按套件分组）
upstream_tests:
  - file: src/test/OpenEXRCoreTest
    source: openexr-3.3.4/src/test/OpenEXRCoreTest
    description: "OpenEXRCore C API 核心测试套（60 项：testBase…testDeepZIPSCompression）"
    command: "ctest -L OpenEXRCore"
  - file: src/test/OpenEXRTest
    source: openexr-3.3.4/src/test/OpenEXRTest
    description: "OpenEXR C++ API 主测试套（58 项注册：testAttributes…testIDManifest）"
    command: "ctest -R OpenEXR.test"
  - file: src/test/OpenEXRUtilTest
    source: openexr-3.3.4/src/test/OpenEXRUtilTest
    description: "OpenEXRUtil 工具库测试套（3 项：testFlatImage/testDeepImage/testIO）"
    command: "ctest -R OpenEXRUtil"
  - file: src/test/bin
    source: openexr-3.3.4/src/test/bin
    description: "命令行工具测试（12 项：exrinfo/exrheader/exrcheck + exr2aces 等 9 工具，Python3 驱动）"
    command: "ctest -R OpenEXR.bin"
  - file: src/test/IexTest
    source: openexr-3.3.4/src/test/IexTest
    description: "Iex 异常库单元测试（1 项）"
    command: "ctest -R OpenEXR.Iex"
  - file: src/examples
    source: openexr-3.3.4/src/examples
    description: "示例程序测试（1 项）"
    command: "ctest -R OpenEXRExamples"

# 上游 Fuzz 套（4 项）被 OPENEXR_RUN_FUZZ_TESTS=OFF 默认门控，不在注册口径

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "C++ API：Imf::Header 默认值断言 + Imath::V2i + dataWindow（OpenEXR::OpenEXR + imath 传递链）"
    command: "./test_openexr"
  - file: test_core.c
    description: "C API：exr_get_library_version==3.3.4 + 默认最大图像尺寸（OpenEXR::OpenEXRCore + libdeflate 链路）"
    command: "./test_core"
