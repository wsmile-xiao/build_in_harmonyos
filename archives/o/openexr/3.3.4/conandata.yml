  "3.3.4":
    - patch_file: "patches/0001-ohos-test-tmpdir.patch"
      patch_description: "上游测试临时目录适配（POSIX 通用，无平台宏）：上游测试套硬编码 /var/tmp/，在 /var 只读的平台（如 HarmonyOS）mkdir 失败。改为运行时解析临时目录——优先 IMF_TMP_DIR/TMPDIR 环境变量，回退上游默认 /var/tmp/，行为对 Linux 完全兼容；只读平台通过导出 TMPDIR 指向可写目录即可运行上游测试套。涉及 OpenEXRTest/OpenEXRCoreTest/OpenEXRUtilTest 共用的 tmpDir.h 与各测试 main.cpp/testBadTypeAttributes.cpp 的目录拼接用法（共 5 文件），测试断言与逻辑零改动，库本体（BUILD_TESTING=OFF 构建）不受影响。"
      patch_type: "portability"
      patch_source: "https://github.com/AcademySoftwareFoundation/openexr/blob/v3.3.4/src/test/OpenEXRTest/tmpDir.h"
