schema_version: 1
package: oystr
version: 0.2.0
homepage: https://github.com/p-ranav/oystr
upstream_test_in_build: true
upstream_tests:
  - file: test/source/oystr_test.cpp
    description: upstream CMake/CTest test executable
    command: ctest --test-dir <build> -R oystr_test --output-on-failure
    status: pass
    result: "TOTAL=1 PASS=1 FAIL=0 SKIP=0 NOT_RUN=0"
test_package_tests:
  - file: test.sh
    description: search a file through a PTY and search stdin through a pipe
    command: oy needle <file>; printf ... | oy needle
    assertions:
      - file search output contains needle
      - stdin search output contains needle
assertion_count: 2
build_files:
  - conanfile.py
  - test.sh
outputs:
  - bin/oy
require_nonempty: true
