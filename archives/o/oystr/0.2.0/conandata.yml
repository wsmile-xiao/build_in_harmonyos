sources:
  "0.2.0":
    url: "https://github.com/p-ranav/oystr/archive/refs/tags/v0.2.0.tar.gz"
    sha256: "a53d3c953bf675482062d544b86e134cd2da1493814fda4e5440472155fcbe9f"
patches:
  "0.2.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Use Conan argparse and fmt packages instead of FetchContent; remove native CPU flags"
      patch_type: "portability"
    - patch_file: "patches/0002-source-searcher.cpp.patch"
      patch_description: "Replace unavailable nftw extensions with std::filesystem traversal"
      patch_type: "portability"
    - patch_file: "patches/0003-source-searcher.hpp.patch"
      patch_description: "Guard x86-only intrinsic header"
      patch_type: "portability"
    - patch_file: "patches/0004-source-sse2_strstr.cpp.patch"
      patch_description: "Provide a portable string-search fallback on non-x86 targets"
      patch_type: "portability"
