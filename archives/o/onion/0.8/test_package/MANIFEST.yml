# 上游官方测试声明文件
# 上游自研框架在原生构建中启用并完整执行。消费者和鸿蒙特有测试分别计数。

package: onion/0.8
homepage: "https://github.com/davidmoreno/onion"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "python3 upstream_test.py --source <source> --build <build> --output <create-new-output>"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 upstream_test.py --source <source> --build <build> --output <create-new-output>"

# 上游实际运行的测试程序
upstream_tests:
  - file: upstream_test.py
    description: "19 upstream harnesses, both original prerecorded fixtures in LF/CRLF, original asset-tool scenario; native runtime inventory 89/89"

# test_package 中自带的测试 (消费者视角验证, 调用已安装库)
test_package_tests:
  - file: main.c
    description: "One real HTTP roundtrip using a private ephemeral loopback listener; checks remain active under NDEBUG"
    command: "onion_smoke"
  - file: harmony_tests/hmdfs_http.c
    description: "Independent native HarmonyOS signed library/HMDFS UTF-8 file HTTP response, exact bytes and cleanup"
    command: "onion_harmony <task-private-temp-root>"

# 原生运行清单的独立测试用例数，不把消费者断言冒充上游用例。
harmony_test_count: 1
upstream_test_count: 89
consumer_test_count: 1
w3_run: onion-20261005-r020
w3_binding_report: "reports/r020-validation-binding.json"
# The next candidate has a shared-only recipe contract. Old r012/r019 runs are
# preserved history, not validation of this candidate. Read the current report.
