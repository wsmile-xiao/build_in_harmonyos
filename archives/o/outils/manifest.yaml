software: outils
display: "outils"
description: "OpenBSD 非标准工具移植集（apply/calendar/cksum/jot/lam/lndir/md5/rdate/rs/sha*/signify/ts/unvis/vis/what）"
category: system
homepage: "https://github.com/leahneukirchen/outils"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯手写 Makefile 项目，无 configure 脚本；make CC=clang -j1"
    - "musl 缺少 explicit_bzero/reallocarray/adjtime：补链对象 + 新增 adjtime 兼容实现"
    - "HarmonyOS 无 /usr/bin/cpp：calendar 改为内置 #include 展开（保留 -I 搜索语义）"
    - "md5 别名以真实副本安装（argv[0] 分派），规避 HMDFS 软链接限制"
  common_dependencies: []

versions:
  "0.14":
    status: built
    build_date: "2026-09-21"
