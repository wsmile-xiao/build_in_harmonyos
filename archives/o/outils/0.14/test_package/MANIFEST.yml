# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）

package: outils/0.14
homepage: "https://github.com/leahneukirchen/outils"

# 上游测试命令：无
upstream_check_command: "无 —— 上游仓库无 tests/ 目录，Makefile 无 test/check 目标"
upstream_test_in_build: false
upstream_test_command: ""

# R51 上游测试清点证据（适配前申报）
upstream_test_inventory:
  tests_directory: false
  makefile_test_target: false
  makefile_check_target: false
  evidence:
    - "v0.14 解压树顶层仅 LICENSE / Makefile / README / src，无 tests/ 或 test/ 目录"
    - "Makefile 目标仅 all / clean / install / install-calendars；无 test/check 目标"
    - "各工具源码无自测入口（无 --test/--self-test 选项），上游 README 未声明测试套件"

# 上游无测试套件 → 适配回归测试全部由 test_package 补全（R51）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，含鸿蒙特有场景）
test_package_tests:
  - file: test.sh
    description: >-
      20 条断言，真实执行安装后的全部 17 个命令：md5/sha1/sha256/sha512 已知向量
      (abc)、cksum CRC32+size、md5 文件模式；jot 3；lam/rs/ts 管道；vis|unvis
      二进制往返；what 标记提取；apply 逐参执行；lndir 影子目录；signify
      keygen/sign/verify 全链路；calendar 直读文件、内置 #include 展开（鸿蒙特有：
      OHOS 无 /usr/bin/cpp，验证补丁行为）与随包数据 calendar.usholiday；rdate
      用法诊断。
    command: "bash test.sh"

# 测试断言总数（= test.sh 中 chk 调用数）
assertion_count: 20
