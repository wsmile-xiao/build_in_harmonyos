# conandata.yml — outils 0.14
sources:
  url: "https://github.com/leahneukirchen/outils/archive/refs/tags/v0.14.tar.gz"
  sha256: "e4dcbd92b25bbb371216b0fad5aa80cdff19f466f7ec8b5e145111fb348c91eb"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: >-
      补齐上游 Makefile 在 musl 上缺失的链接对象：lam 增加 explicit_bzero.o
      （recallocarray 引用）、ts 增加 reallocarray.o、rdate 增加 adjtime.o、
      calendar 增加 preprocess.o（内置 include 展开）。
    patch_type: "portability"
  - patch_file: "patches/0002-src-liboutils-adjtime.c.patch"
    patch_description: >-
      新增 adjtime(3) 兼容实现（基于 clock_adjtime(2)）：musl libc（HarmonyOS）
      不提供 adjtime，rdate -a 滑动校时需要。
    patch_type: "portability"
  - patch_file: "patches/0003-src-liboutils-outils.h.patch"
    patch_description: >-
      在可移植头文件中声明 adjtime(3) 原型，消除隐式声明。
    patch_type: "portability"
  - patch_file: "patches/0004-src-usr.bin-calendar-calendar.h.patch"
    patch_description: >-
      声明 expand_calendar()（calendar 内置预处理器入口）。
    patch_type: "portability"
  - patch_file: "patches/0005-src-usr.bin-calendar-io.c.patch"
    patch_description: >-
      calendar 输入改为经 calin 流读取；当 /usr/bin/cpp 不存在时（HarmonyOS 无
      外部 C 预处理器），改用内置 #include 展开（pipe+fork 流式，语义与上游 cpp
      调用一致：-I. 加 _PATH_INCLUDE 搜索路径）。
    patch_type: "portability"
  - patch_file: "patches/0006-src-usr.bin-calendar-preprocess.c.patch"
    patch_description: >-
      新增日历文件 #include 展开器（支持 <> 与 "" 两种形式、递归深度限制、
      缺失 include 警告不中断）。
    patch_type: "portability"
