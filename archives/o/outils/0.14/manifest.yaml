knowledge_gained:
  - "musl 不提供 glibc 的 explicit_bzero/reallocarray：Makefile 项目需显式补链 liboutils 自带对象（knowledge_ref: E229）"
  - "musl 不实现 adjtime(3)：可用 clock_adjtime(2)（ADJ_OFFSET|ADJ_STATUS + STA_PLL）等价实现（knowledge_ref: E164）"
  - "OHOS /tmp 只读：tmpfile() 失败 errno=EACCES(13)；open_memstream 不累积输出、fmemopen 读取 SIGILL；pipe+fork 流式替代最稳（knowledge_ref: E272, E302, E002）"
  - "OpenBSD calendar 依赖 /usr/bin/cpp 展开 #include；无 cpp 环境需内置展开（knowledge_ref: E6401-draft）"
  - "md5 单二进制按 argv[0] 分派 cksum/sha1/sha256/sha512：副本安装与软链接行为一致（knowledge_ref: E018, E050）"

compatibility:
  level: high
  issues:
    - "calendar -a（cron 邮件模式）需要 sendmail，OHOS 无此程序；普通用法不受影响"

