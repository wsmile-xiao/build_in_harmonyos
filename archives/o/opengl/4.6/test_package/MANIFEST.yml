# test_package/MANIFEST.yml
# opengl 4.6 — 消费者用例 + 鸿蒙专项测试台账
package: opengl/4.6
homepage: "https://github.com/KhronosGroup/OpenGL-Registry"

# 上游 OpenGL-Registry 为规范仓库 (XML registry + 头文件生成源), 无上游可执行测试入口:
# 无 tests/ 目录、无 ctest/pytest/Catch2 注册 (详见 reports/upstream-test-ledger.md)
upstream_check_command: ""
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试 (消费者视角 + 鸿蒙专项)
test_package_tests:
  - file: test_package.c
    description: "消费者用例 — 仅用已安装公开头文件/宏/类型 API 编译链接运行; 断言 GL_VERSION_4_6、PFNGLCLEARPROC 函数指针类型、GL_ARB_multisample、GL_ES_VERSION_2_0/3_0、khronos_int64_t/ssize_t"
    command: "ctest -R consumer"
  - file: harmonyos_test.c
    description: "鸿蒙专项 — aarch64-ohos 平台语义: 64 位指针、非 _WIN32 空调用约定 (APIENTRY/GLAPIENTRY)、khrplatform 类型宽度 (int8/16/32/64/float)、GLenum/GLboolean 宽度"
    command: "ctest -R harmonyos"

assertion_count: 18
