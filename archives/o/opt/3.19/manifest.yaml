# 版本级 manifest — opt 3.19（ARCHIVE-SPEC v2.0）
# 全部字段为设备实测值（取数命令见 notes.md 与 $TASK_DIR/w0/）

version: "3.19"
software: "opt"

# built：设备验证已完成；按 O5 口径，合并 + release upload 确认前不得写 published
status: built
build_date: "2026-09-24"
build_system: autotools

source:
  url: "https://ftp.debian.org/debian/pool/main/o/opt/opt_3.19.orig.tar.gz"
  sha256: "9feb44c0f9ed88d12b08dab6d3c32da6f0b5094007cc1e6e112d2d53e6435acc"
  tar_format: tar.gz

build:
  system: autotools
  # 随包 autoconf 2.13 configure 的实际入参（标志走环境注入，见 notes.md）
  configure_options:
    - "--prefix=/"
    - "CFLAGS=-O3 -pipe -DNDEBUG -fPIC"
    - "CXXFLAGS=-O3 -pipe -DNDEBUG -fPIC"
  # 硬依赖缺集 = ∅（静态 + 动态双 profile 互证；readline 为 opt-in 可选且默认关）
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-testcc-cxx-iostream.patch"

# 下列每条末尾的引用注释是官方脚本唯一认的形态（§3.8）
knowledge_gained:
  - "随包 autoconf 2.13 configure 三坑：命令行 CFLAGS=... 被当 host type（invalid host type）、--datarootdir 是 invalid option、configure.in 字面 CXX=g++ 经 AC_SUBST 固化进 Makefile；正解=环境注入+make 行双钉+绝不 autoreconf"  # knowledge_ref: E717
  - "上游站 2011-04-28 消亡的 2004 时代包取源改道 Debian/Ubuntu pool：四源法（同名文件 8 次取数 sha 全等）+ 双 .dsc Checksums-Sha256 佐证 + PF7 classify=None 才定 URL，deb.debian.org 双坑实测绕开"  # knowledge_ref: E718
  - "上游断言在 64 位 OHOS 必失败不凑绿：opt_atou 里 (unsigned long)atof(-1) 属 UB（aarch64 fcvtzu 饱和=0）+ 期望值 4294967295 是 32 位字长写死；配方白名单闸只放行 USHORT error/ULONG error，其余失败一律阻断（Debian rules 同组容忍为第三方佐证）"  # knowledge_ref: E719

upstream_tests:
  command: "make check"
  test_count: 3
  assertion_count: 78
  notes: "automake 1.4-p5 TESTS = t_num checkopt checkoptcc；78 = 56 + 10 + 12（静态计数与运行时点计数全等）；每 TEST rc：t_num=0、checkopt=2、checkoptcc=0；76 PASS / 2 FAIL（USHORT error、ULONG error 为上游已知 32 位字长 + UB 期望缺陷，白名单闸放行，根因与 Debian 佐证见 notes.md）"

test_package:
  assertion_count: 15
  description: "链接已安装 libopt.a：头常量 2 + optreg 注册槽位 6 + opt() 解析 6 + 鸿蒙特有（OHOS/aarch64 OPT_USHORT \"-1\" 饱和语义）1"
