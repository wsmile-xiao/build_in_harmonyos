# test_package/MANIFEST.yml — 上游测试与消费者测试声明（CI L0e 强制）
# 计数口径：上游 78 断言与消费者 15 断言**分栏**，不混用（R51 / jsoncons 先例）。

package: opt/3.19
homepage: "http://nis-www.lanl.gov/~jt/Software/opt/"

# 上游官方测试入口（automake TESTS；在 conanfile.build() 内执行）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: t_num
    command: "./t_num"
    expected: "rc=0；12 行数字解析用例全部 CORRECT（=== t_num total incorrect: 0 ===）"
  - name: checkopt
    command: "../src/test/checkopt   # 从 srcdir 调（out-of-source 不复制脚本）"
    expected: "56 断言 → 54 PASS / 2 FAIL（USHORT error、ULONG error = 上游已知 32 位字长与 UB 期望缺陷，Debian rules 同组容忍，根因见 notes.md）；rc=2"
  - name: checkoptcc
    command: "../src/test/checkoptcc"
    expected: "rc=0；10 断言全部 PASS（依赖补丁 0001 把 <iostream.h> 换成 <iostream>）"

# 上游断言合计（四口径取最大，静态==运行时）：56 + 10 + 12 = 78
upstream_assertion_count: 78

# test_package 自带测试（消费者视角，独立分栏）
test_package_tests:
  - file: test.c
    description: "链接已安装 libopt.a：头常量 2 + 注册槽位 6 + opt() 解析 6 + OHOS/aarch64 USHORT 语义 1"
    command: "./test_opt"
    expected: "all 15 assertions passed"

assertion_count: 15
