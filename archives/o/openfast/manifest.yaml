# OpenFAST 软件级 manifest

software: openfast
display: "OpenFAST"
description: "NREL-supported OpenFAST whole-turbine simulation code（风轮机整机气动-水动-伺服-弹性耦合非线性时域仿真，Fortran 2008+）"
homepage: "https://openfast.readthedocs.io/"
repository: "https://github.com/OpenFAST/openfast"
license: Apache-2.0
category: utility

build_system: cmake

ohos_adaptation:
  key_points:
    - "Fortran 编译器由 tool_requires flang-ohos/20.1.0 提供（仓内 archives/f/flang-ohos，设备原生 LLVM Flang 20.1.0）"
    - "Fortran 链接驱动保持 flang：需给全 -resource-dir（crtbegin/crtend 与 libclang_rt.builtins.a 在其中）与 -L <sdk>/llvm/lib/aarch64-linux-ohos（libunwind.a 只在该目录），且三条 linker flags 规则都要给（共享库规则不含 <CMAKE_Fortran_LINK_FLAGS>）"
    - "BLAS/LAPACK 由 openblas/0.3.34 提供（上游顶层 find_package(LAPACK) 找不到即 FATAL_ERROR）"
    - "CMake 4.x 对 HarmonyOS 不设 UNIX 变量、且把 LLVM Flang 新驱动识别为 LLVMFlang，均需补丁适配（0001/0003）"
    - "上游单元测试纳入构建：BUILD_TESTING=ON + BUILD_UNIT_TESTING=ON，build() 内 cmake.test() 执行 5 项 CTest（补丁 0006 让缺 r-test 数据子模块时跳过 reg_tests 注册；补丁 0007 适配 Flang 的 TRANSFER 尺寸语义）"
    - "可选模块（FAST.Farm / C++ API / C++ Driver / Library Driver / Simulink / OpenMP）全部保持上游默认 OFF，最小构建 + DOUBLE_PRECISION=ON"
  common_dependencies:
    - openblas
    - flang-ohos

versions:
  5.0.0:
    packaging: conan
    status: built
    build_date: "2026-09-18"
    notes: >-
      设备原生 CMake 最小构建（openfast 可执行 + 16 个模块级 driver + libopenfastlib.so）。
      7 个源码补丁：2 个上游缺陷（ModVar.f90 未定义函数 cotan、FAST_Library.f90 的 TRANSFER
      长度不一致）+ 5 个平台/编译器适配（HarmonyOS 无 UNIX 变量、LLVMFlang 编译器 ID、
      未开 OpenMP 时的 use OMP_LIB 守卫、缺 r-test 数据子模块时跳过 reg_tests、
      Flang 的 TRANSFER 尺寸语义）。
      上游 unit_tests 5/5 通过（build() 内 CTest 真实执行）；test_package 消费者用例 8 断言全通过；
      上游 reg_tests 200 项因依赖 r-test 数据子模块未执行，书面归因见版本级 manifest 与 notes.md。
