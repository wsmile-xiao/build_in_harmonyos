# test_package/MANIFEST.yml
package: openfast/5.0.0
homepage: "https://openfast.readthedocs.io/"

# 上游测试命令（在配方 build() 内执行）
#   cmake --build <build> --target unit_tests   # unit_tests 是自定义目标，不属 ALL
#   ctest --output-on-failure
upstream_check_command: "cmake --build <build> --target unit_tests && ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "cmake.build(target='unit_tests') + cmake.test()（conanfile.py build() 内；失败即 conan create 失败）"

# 取数口径：分母 = 本配方实际配置下 CTest 注册的用例数（5）；
# 分子 = ctest 的执行结果（5 passed / 0 failed / 0 skipped / 0 not run）。
# 上游注册 6 项，其中 amrex_reader_utest 需 AMREX_READER 且 BUILD_FASTFARM，最小构建下不注册
# （与上游同条件行为）。reg_tests 的 200 项整机回归未纳入（依赖 reg_tests/r-test 数据子模块，
# 官方源码包不含该数据，见 notes.md「上游测试说明」）。
upstream_test_count: 5

upstream_tests:
  - file: unit_tests/CMakeLists.txt
    source: "openfast-5.0.0/unit_tests + modules/*/tests"
    description: "aerodyn_utest（AeroDyn FVW/UA 等单元测试）"
    command: "ctest -R aerodyn_utest --output-on-failure"
  - file: unit_tests/CMakeLists.txt
    source: "openfast-5.0.0/modules/beamdyn/tests"
    description: "beamdyn_utest（BeamDyn 曲率/形函数/积分点等 8 组用例）"
    command: "ctest -R beamdyn_utest --output-on-failure"
  - file: unit_tests/CMakeLists.txt
    source: "openfast-5.0.0/modules/inflowwind/tests"
    description: "inflowwind_utest（风场类型/输出等 5 组用例）"
    command: "ctest -R inflowwind_utest --output-on-failure"
  - file: unit_tests/CMakeLists.txt
    source: "openfast-5.0.0/modules/nwtc-library/tests"
    description: "nwtc_library_utest（文件信息、随机数、C_Binding 等 3 组用例）"
    command: "ctest -R nwtc_library_utest --output-on-failure"
  - file: unit_tests/CMakeLists.txt
    source: "openfast-5.0.0/modules/version/tests"
    description: "versioninfo_utest（版本信息参数校验）"
    command: "ctest -R versioninfo_utest --output-on-failure"

# test_package 中自带的测试（消费者视角验证，不计入上游分母）
test_package_tests:
  - file: smoke.c
    description: >-
      OpenFAST 库级链路冒烟：FAST_AllocateTurbines（分配 2 台涡轮机数据）+ FAST_DeallocateTurbines
      （释放）；断言 ErrStat==0 与 ErrMsg 在 1025 字节内 NUL 结尾（3 断言）。
      注意 FAST_AllocateTurbines 首参为 INTENT(IN) 的涡轮机数量，非返回值。
    command: "./smoke"
  - file: abi.c
    description: >-
      交付面契约：按绝对路径 dlopen(libopenfastlib.so, RTLD_NOW|RTLD_LOCAL) 并逐个 dlsym
      FAST_AllocateTurbines / FAST_DeallocateTurbines / FAST_Sizes，最后 dlclose。
      可捕获未解析符号、架构不符、SONAME/代码签名（XPM）失效等加载期缺陷（5 断言）。
      被测包 lib 目录经 OPENFAST_PACKAGE_LIBDIR 传入，保证加载的就是被测包那一份。
    command: "OPENFAST_PACKAGE_LIBDIR=<pkg>/lib ./abi"

# 测试程序数 / 断言总数（用于质量评估）
test_executables: 3
assertion_count: 8
note: >-
  另有 bin/openfast -v 版本冒烟（banner 含 OpenFAST 版本、Compiler: flang version 20.1.0、
  Precision: double、OpenMP: No），计入 test_executables 但不单独计断言。
