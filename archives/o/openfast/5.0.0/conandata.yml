sources:
  url: "https://github.com/OpenFAST/openfast/archive/refs/tags/v5.0.0.tar.gz"
  sha256: "f84793e7e6e8e5c6b995f8c8727c5104f3f8d3729ea2aae095b86d770e60063a"
patches:
  "5.0.0":
    - patch_file: "patches/0001-ohos-unix-platform-guards.patch"
      base_path: "openfast-5.0.0"
      patch_description: "OHOS 平台守卫：CMake 4.x 对 CMAKE_SYSTEM_NAME=HarmonyOS 不设 UNIX 变量（报 System is unknown to cmake），
        nwtc-library 的 NWTC_SYS_FILE（SysFlangLinux.f90）Flang 分支与各模块 IMPLICIT_DLLEXPORT 分支用
        if(APPLE OR UNIX) 均不命中 → configure 直接 FATAL。统一改为 if(NOT WIN32)（OHOS 属非 Windows 语义）"
      patch_type: "portability"
    - patch_file: "patches/0002-fix-undefined-cotan-in-modvar.patch"
      base_path: "openfast-5.0.0"
      patch_description: "上游 v5.0.0 缺陷修复：nwtc-library/ModVar.f90 的 rvec_to_tan_inv 调用 cotan()，
        但该函数在 v5.0.0 全仓（官方 tarball sha256 f84793e7...）无任何定义，模块内 implicit none 生效，
        Flang 报 'No explicit type declared for cotan'（gfortran 同样无法通过）。按同式数学等价替换为 1/tan()"
      patch_type: "bugfix"
    - patch_file: "patches/0003-accept-llvmflang-compiler-id.patch"
      base_path: "openfast-5.0.0"
      patch_description: "LLVM Flang 编译器 ID 适配：flang-ohos（LLVM 20.1.0 新驱动）在 CMake（实测 4.1.2）
        下被识别为 CMAKE_Fortran_COMPILER_ID=LLVMFlang，而上游 set_fast_fortran 的白名单只认
        GNU/Intel/Flang → configure 直接 FATAL_ERROR；nwtc-library 的 NWTC_SYS_FILE 分支同样漏掉该 ID。
        在两处判定中加入 LLVMFlang 并复用 set_fast_flang()（其中 -fdefault-real-8/-DFLANG_COMPILER
        是双精度正确性所必需，不能绕过）"
      patch_type: "portability"
    - patch_file: "patches/0004-guard-omp-lib-use.patch"
      base_path: "openfast-5.0.0"
      patch_description: "OpenMP 可选性修复：aerodyn 的 FVW.f90 与 FVW_BiotSavart.f90 在未启用 OpenMP 时
        仍无条件 use OMP_LIB（二者均无任何 omp_* 过程调用，仅用 !$OMP 指示符，未开 -fopenmp 时按注释忽略），
        而 flang-ohos/20.1.0 不提供 OpenMP Fortran 支持（无 omp_lib.mod，-fopenmp 实测报
        'Cannot parse module file for module omp_lib'）→ aerodynlib 直接编不过。按上游代码内注释
        （'wrap with #ifdef _OPENMP if this causes an issue'）加 #ifdef _OPENMP 守卫，
        OPENMP=ON 时行为不变，OFF 时正常构建"
      patch_type: "portability"
    - patch_file: "patches/0005-fix-errmsg-transfer-extent.patch"
      base_path: "openfast-5.0.0"
      patch_description: "上游 v5.0.0 缺陷修复：openfast-library/FAST_Library.f90 的 FAST_CFD_Solution0 中
        `ErrMsg_c = TRANSFER( ErrMsg, ErrMsg_c )` 源串 1024 字符（模块变量 CHARACTER(IntfStrLen-1)）
        而目标数组 1025（IntfStrLen），Flang 报 'Dimension 1 of left-hand side has extent 1025,
        but right-hand side has extent 1024'（gfortran 容忍）。同文件其余 31 处均为上游写法
        `TRANSFER( ErrMsg//C_NULL_CHAR, ErrMsg_c )`，此处补上 '//C_NULL_CHAR' 与全文件一致"
      patch_type: "bugfix"
    - patch_file: "patches/0006-guard-regtests-without-submodule.patch"
      base_path: "openfast-5.0.0"
      patch_description: "开启上游单元测试所需：BUILD_TESTING=ON 时顶层先 add_subdirectory(reg_tests)，
        而 reg_tests 需要 reg_tests/r-test 数据子模块（仿真输入与校验基线，官方源码包不含，仅有空占位目录）
        → add_subdirectory(r-test/...) 直接报错。改为按内容判定（reg_tests/r-test/glue-codes 存在才注册），
        使 unit_tests 能在不引入 r-test 数据的前提下构建并执行"
      patch_type: "portability"
    - patch_file: "patches/0007-fix-transfer-size-in-c-binding.patch"
      base_path: "openfast-5.0.0"
      patch_description: "Flang TRANSFER 尺寸语义适配：nwtc-library/NWTC_C_Binding.f90 的 SetErrStat_F2C 用
        `TRANSFER( TRIM(ErrMsg_F)//C_NULL_CHAR, ErrMsg_C )` 把短字符串（14 字节）赋给 8197 元素数组，
        Flang 按源串大小给结果（实测运行期 `Assign: mismatching element counts in array assignment
        (to 8197, from 14)`），而 F2018 规定结果大小 = MOLD 大小。显式加 SIZE(ErrMsg_C) 使结果尺寸与
        目标数组一致（上游 nwtc_library_utest 中的 test_NWTC_C_Binding 因此通过）"
      patch_type: "portability"
