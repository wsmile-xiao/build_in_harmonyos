# 版本级 manifest.yaml — openfast 5.0.0

software: openfast
version: "5.0.0"
status: built
build_date: "2026-09-18"
conan_ref: "openfast/5.0.0"
platform_compatibility: "HarmonyOS PC aarch64：设备原生 CMake 构建通过 + 上游 unit_tests 5/5 通过（build() 内 CTest 真实执行）+ Conan test_package 消费者用例通过"

source:
  url: "https://github.com/OpenFAST/openfast/archive/refs/tags/v5.0.0.tar.gz"
  sha256: "f84793e7e6e8e5c6b995f8c8727c5104f3f8d3729ea2aae095b86d770e60063a"
  tar_format: tar.gz

build:
  system: cmake
  shared: false
  fortran: true
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_UNIT_TESTING=ON"
    - "-DDOUBLE_PRECISION=ON"
    - "-DCMAKE_Fortran_COMPILER=<flang-ohos>/bin/flang"
    - "-DCMAKE_Fortran_FLAGS=... --sysroot=<SDK sysroot> -resource-dir=<SDK clang resource>"
    - "-DCMAKE_EXE_LINKER_FLAGS / CMAKE_SHARED_LINKER_FLAGS / CMAKE_MODULE_LINKER_FLAGS=-L<sdk>/llvm/lib/aarch64-linux-ohos"
    - "-DBLAS_LIBRARIES / -DLAPACK_LIBRARIES=<openblas>/lib/libopenblas.so"
  dependencies:
    - openblas/0.3.34
  tool_requires:
    - flang-ohos/20.1.0
  cc: clang
  cxx: clang++
  fc: flang

patches_applied:
  - "patches/0001-ohos-unix-platform-guards.patch"
  - "patches/0002-fix-undefined-cotan-in-modvar.patch"
  - "patches/0003-accept-llvmflang-compiler-id.patch"
  - "patches/0004-guard-omp-lib-use.patch"
  - "patches/0005-fix-errmsg-transfer-extent.patch"
  - "patches/0006-guard-regtests-without-submodule.patch"
  - "patches/0007-fix-transfer-size-in-c-binding.patch"

validation:
  upstream_native:
    status: pass
    command: "cmake --build <build> --target unit_tests && ctest --output-on-failure（由 conanfile.py build() 内 cmake.build(target=unit_tests)+cmake.test() 执行）"
    total: 5
    pass: 5
    fail: 0
    skip: 0
    not_run: 0
    note: >-
      上游 unit_tests 注册 6 项，其中 amrex_reader_utest 需 AMREX_READER 且 BUILD_FASTFARM，
      最小构建下不注册（与上游同条件）；已执行的 5 项 CTest 输出 100% tests passed, 0 tests failed。
    report: "learninglog/20260912openfast-5.0.0/conan-create-10.log"
  upstream_regression:
    status: not_run
    reason: >-
      reg_tests 注册 200 项整机回归，执行依赖 git submodule reg_tests/r-test（仿真输入与校验基线
      数据，官方源码包不含该子模块数据）与 Python 驱动脚本，设备无头环境不具备完整执行条件；
      未伪装执行，计数为源码实测（reg_tests/CTestList.cmake 逐项统计）。
    total: 200
    pass: 0
    fail: 0
    skip: 0
    not_run: 200
    report: "learninglog/20260912openfast-5.0.0/进度.md"
  target_conan:
    status: pass
    command: "conan create archives/o/openfast/5.0.0 -pr:h ci/conan/profiles/ohos-aarch64 --build=missing"
    exit_code: 0
    upstream_tests_executed_in_build: true
    report: "learninglog/20260912openfast-5.0.0/conan-create-10.log"
  target_consumers:
    status: pass
    total: 8
    pass: 8
    fail: 0
    command: >-
      test_package：bin/openfast -v（版本冒烟）；./smoke（FAST_AllocateTurbines + FAST_DeallocateTurbines，
      3 断言）；OPENFAST_PACKAGE_LIBDIR=<pkg>/lib ./abi（dlopen(RTLD_NOW) + dlsym 3 符号 + dlclose，
      5 断言），由 conan create 的 test_package 阶段直跑
    report: "learninglog/20260912openfast-5.0.0/conan-create-10.log"

knowledge_gained:
  - "OHOS 上 Fortran 链接驱动保持 flang 即可，只需给全 -resource-dir（crtbegin/crtend 与 libclang_rt.builtins.a 在其中）与 -L <sdk>/llvm/lib/aarch64-linux-ohos（libunwind.a 只在该目录）；用 SDK clang 顶替 Fortran 链接规则是反模式（消费者加载期符号缺失）"
  - "CMake 4.x 下 LLVM Flang 新驱动的 CMAKE_Fortran_COMPILER_ID 是 LLVMFlang（不是 Flang），消费方按 ID 判定的构建系统需一并接受"
  - "CMAKE_Fortran_FLAGS 会同时进入编译与链接行（<FLAGS>），而 -L 类链接标志必须写入 CMAKE_{EXE,SHARED,MODULE}_LINKER_FLAGS —— 共享库链接规则不含 <CMAKE_Fortran_LINK_FLAGS> 占位符"
  - "未启用 OpenMP 时 !$OMP 指示符按注释忽略，但无条件 use OMP_LIB 会硬性要求 omp_lib.mod；flang-ohos/20.1.0 不提供 OpenMP Fortran 支持"
  - "Flang 的 TRANSFER 在内置函数结果尺寸上比 gfortran 严格（按源串而非 MOLD 计算，且常量尺寸不匹配会报编译期/运行期错误）；跨 C/Fortran 字符串互转需显式给 SIZE= 或使源串长度与目标数组一致，否则 TRANSFER 会被静默截断（丢 NUL 终止符）"
  - "上游测试挂在 BUILD_TESTING 之后且同层还有依赖数据子模块的回归测试时，可用「按内容判定子模块是否存在」的最小补丁保住单元测试，而不是整体关闭 BUILD_TESTING"
