# 版本级 manifest
# 文件位置: archives/o/openbabel/3.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.1.1"

# 软件名
software: "openbabel"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-09"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub release，tag openbabel-3-1-1）
  url: "https://github.com/openbabel/openbabel/releases/download/openbabel-3-1-1/openbabel-3.1.1-source.tar.bz2"

  # 源码校验和
  sha256: "a6ec8381d59ea32a4b241c8b1fbd799acb52be94ab64cdbd72506fb4e2270e68"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（CMakeToolchain 注入）
  configure_options:
  - "-DCMAKE_SYSTEM_NAME=Linux"
  - "-DBUILD_SHARED=OFF"
  - "-DENABLE_TESTS=ON"
  - "-DWITH_STATIC_INCHI=ON"
  - "-DWITH_STATIC_LIBXML=ON"
  - "-DWITH_MAEPARSER=OFF"
  - "-DWITH_COORDGEN=OFF"
  - "-DENABLE_OPENMP=OFF"
  - "-DENABLE_VERSIONED_FORMATS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - zlib/1.3.1
  - libxml2/2.15.3
  - eigen/3.4.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（均 patch_type=portability）
patches_applied:
- "0001-CMakeLists.txt.patch"
- "0002-tools-CMakeLists.txt.patch"
- "0003-src-CMakeLists.txt.patch"
- "0004-formats-cmake.patch"
- "0005-test-CMakeLists.txt.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（对应 knowledge/drafts/E545-E547）
knowledge_gained:
- "knowledge_ref: E545 — CMake>=4 拒绝 cmake_minimum_required<3.5 与显式 policy OLD；CMAKE_POLICY_VERSION_MINIMUM 必须走命令行 -D（toolchain 变量加载时机太晚）"
- "knowledge_ref: E546 — conan CMakeToolchain 强制 CONFIG 优先后，上游 Module 风格全大写 EIGEN3_FOUND/LIBXML2_FOUND 判断失效，需补丁接受 Eigen3_FOUND/LibXml2_FOUND 并在 generate() 注入 module-mode 绝对路径变量"
- "knowledge_ref: E547 — 静态配方 + 制品仓 shared-only 依赖：CMAKE_FIND_LIBRARY_SUFFIXES 钉 .a 与 -static/LINK_SEARCH_END_STATIC 全静态链接双重冲突，需放宽后缀并改部分静态"
