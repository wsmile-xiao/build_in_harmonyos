# conandata.yml — openbabel 3.1.1
# Official GitHub release asset (tag openbabel-3-1-1).

sources:
  url: "https://github.com/openbabel/openbabel/releases/download/openbabel-3-1-1/openbabel-3.1.1-source.tar.bz2"
  sha256: "a6ec8381d59ea32a4b241c8b1fbd799acb52be94ab64cdbd72506fb4e2270e68"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "CMake >=4 portability: CMP0042 OLD->NEW; static branch CMAKE_FIND_LIBRARY_SUFFIXES '.a'->'.a;.so' (shared-only libxml2); accept Eigen3_FOUND / LibXml2_FOUND config-mode results so HAVE_EIGEN3 is defined and CML/XML support is not silently dropped"
    patch_type: "portability"
  - patch_file: "patches/0002-tools-CMakeLists.txt.patch"
    patch_description: "OHOS/musl has pthread inside libc (no standalone libpthread); only append PTHREAD_LIBRARY when actually found, else obabel generate fails with NOTFOUND"
    patch_type: "portability"
  - patch_file: "patches/0003-src-CMakeLists.txt.patch"
    patch_description: "Accept Eigen3_FOUND (CONFIG mode) in all src/CMakeLists gates (incl. the spaced variant) so distgeom/conformersearch/qeq/eqeq/qtpie/conformer-ops are compiled into the static lib; LibXml2_FOUND fallback on the WITH_STATIC_LIBXML gate"
    patch_type: "portability"
  - patch_file: "patches/0004-formats-cmake.patch"
    patch_description: "Same CONFIG-mode fallbacks in src/formats/formats.cmake: Eigen-gated format and the XML/CML format group (theXMLFormat etc.) must be compiled into the static lib"
    patch_type: "portability"
  - patch_file: "patches/0005-test-CMakeLists.txt.patch"
    patch_description: "Same CONFIG-mode fallbacks in test/CMakeLists.txt: align tests and cmlreadfile stay registered under config-mode Eigen3/LibXml2 detection"
    patch_type: "portability"
