# test_package/MANIFEST.yml
# 上游官方测试声明文件 — openbabel/3.1.1
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试体系：test/CMakeLists.txt 以单一 test_runner 二进制 + CTest 注册。
# 注册口径 = add_test 条目（ctest 用例数）：
#   cpptests（obtest.h 新式）：29 个模块 159 例；+align(Eigen3) 5 例 = 164
#   origtests（旧式 "not ok"）：30 个源 44 例；+cmlreadfile 1 例
#     （本适配静态构建 + WITH_STATIC_LIBXML=ON，cmlreadfile 参与注册，
#      见 patches/0005 对 LIBXML2_FOUND 的 CONFIG 模式兼容）
#   inchi（test_inchiwrite）：3 例
#   python 绑定测试（PYTHON_BINDINGS，本适配不启用）：不注册
#   => 本适配配置（静态构建 + Eigen3 + LibXml2 + WITH_STATIC_LIBXML）共
#      164 + 45 + 3 = 212 例（与 conanfile.py UPSTREAM_TEST_DISCOVERED=212 一致）
package: openbabel/3.1.1
homepage: "https://openbabel.org"

# 上游测试命令 (ctest -N 于 build 目录枚举)
upstream_check_command: "ctest -N (test/test_runner, BABEL_DATADIR=<src>/data)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "test/bin/test_runner <module> <part>（签名后设备实跑，BABEL_DATADIR=<src>/data）"

# 上游实际运行的测试程序（代表性子集，28 个 add_test 用例；
# 全量 212 例中长耗时数值套件未跑，见 conanfile.py HMBS_UPSTREAM_TEST_RESULT.gaps）
upstream_tests:
  - file: test/conversiontest.cpp
    source: openbabel-3.1.1/test/conversiontest.cpp
    description: "OBConversion 转换管线测试"
    command: "test_runner conversiontest 1"
  - file: test/smilestest.cpp
    source: openbabel-3.1.1/test/smilestest.cpp
    description: "SMILES 读写/合法性测试"
    command: "test_runner smilestest 1|2|3"
  - file: test/cansmi.cpp
    source: openbabel-3.1.1/test/cansmi.cpp
    description: "规范化 SMILES 一致性"
    command: "test_runner cansmi 1"
  - file: test/formula.cpp
    source: openbabel-3.1.1/test/formula.cpp
    description: "分子式计算"
    command: "test_runner formula 1"
  - file: test/format.cpp
    source: openbabel-3.1.1/test/format.cpp
    description: "格式注册/发现"
    command: "test_runner format 1"
  - file: test/aromatest.cpp
    source: openbabel-3.1.1/test/aromatest.cpp
    description: "芳香性感知"
    command: "test_runner aromatest 1"
  - file: test/atom.cpp
    source: openbabel-3.1.1/test/atom.cpp
    description: "原子属性 API"
    command: "test_runner atom 1|2|3|4"
  - file: test/bond.cpp
    source: openbabel-3.1.1/test/bond.cpp
    description: "键属性 API"
    command: "test_runner bond 1"
  - file: test/math/*.cpp
    source: openbabel-3.1.1/test/math
    description: "数学库（矩阵/向量/变换）"
    command: "test_runner math 1|2|3|4"
  - file: test/iterators.cpp
    source: openbabel-3.1.1/test/iterators.cpp
    description: "迭代器 API"
    command: "test_runner iterators 1"
  - file: test/invalidsmiles.cpp / test/invalidsmarts.cpp
    source: openbabel-3.1.1/test
    description: "非法输入健壮性"
    command: "test_runner invalidsmiles 1; test_runner invalidsmarts 1"
  - file: test/gziptest.cpp
    source: openbabel-3.1.1/test/gziptest.cpp
    description: "gzip 压缩流读写（zlib 集成）"
    command: "test_runner gziptest 1"
  - file: test/addhtest.cpp
    source: openbabel-3.1.1/test/addhtest.cpp
    description: "氢原子加成"
    command: "test_runner addhtest 1"
  - file: test/ringtest.cpp
    source: openbabel-3.1.1/test/ringtest.cpp
    description: "环检测（SSSR）"
    command: "test_runner ringtest 1"
  - file: test/residue.cpp
    source: openbabel-3.1.1/test/residue.cpp
    description: "生物残基数据"
    command: "test_runner residue 1"
  - file: test/unitcell.cpp
    source: openbabel-3.1.1/test/unitcell.cpp
    description: "晶胞 API"
    command: "test_runner unitcell 1"
  - file: test/phmodel.cpp
    source: openbabel-3.1.1/test/phmodel.cpp
    description: "pH 模型校正"
    command: "test_runner phmodel 1"
  - file: test/mol.cpp
    source: openbabel-3.1.1/test/mol.cpp
    description: "OBMol 分子 API"
    command: "test_runner mol 1"
  - file: test/datatest.cpp
    source: openbabel-3.1.1/test/datatest.cpp
    description: "数据文件加载（BABEL_DATADIR）"
    command: "test_runner datatest 1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_openbabel.cpp
    description: "消费者端到端测试：SMILES 解析→规范化/分子式→MOL 往返→InChI 生成→MW 描述符（含断言 11 项）"
    command: "./test_openbabel"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 220
