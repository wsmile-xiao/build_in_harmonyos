  - "patches/0002-src-descriptor.cpp.patch"
  - "patches/0003-src-fingerprint.cpp.patch"
  - "patches/0004-src-forcefield.cpp.patch"
  - "patches/0005-src-format.cpp.patch"
  - "patches/0007-src-op.cpp.patch"
  - "patches/0008-src-ops-loader.cpp.patch"
  - "patches/0009-include-openbabel-generic.h.patch"
  - "patches/0006-src-generic.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "插件注册表 DSO 分裂：头内 inline function-local static 的 Map() 每个 DSO 各持一份（libopenbabel/插件/可执行文件），插件注册与调用方查表落在不同 DSO → FindType 恒 null；修法=无条件启用外置定义路径（Map 库内单点定义），即上游 Cygwin/MinGW 分支的正解"
  - "跨 DSO dynamic_cast 失败：模板特化（OBPairTemplate<int/double/bool>）多 DSO 各自 WEAK typeinfo，aarch64 Itanium ABI 唯一 typeinfo 语义（operator== 只比指针）→ 判定恒 false 后空指针解引用 SIGSEGV；修法=extern template 声明 + 库内单点显式实例化"
  - "OHOS 工具链默认不设 SONAME 旗标：无 SONAME 的共享库被依赖时，DT_NEEDED 记录相对路径，dlopen 按进程 CWD 相对解析失败；注入 CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG=-Wl,-soname,"
  - "上游测试 ENVIRONMENT 在 configure 期烘焙 $ENV{LD_LIBRARY_PATH} 进 CTestTestfile.cmake（$ENV{} 求值后定死）：build() 内跑 ctest 必须在 configure 前预置 os.environ；插件加载优先读 BABEL_LIBDIR 环境变量（回退编译期 OB_MODULE_PATH，构建期未生成）"
  - "CMake 4.1.2 陷阱（最小复现实证）：-D 传入的 LIB_INSTALL_DIR/BIN_INSTALL_DIR 相对值（UNINITIALIZED 缓存条目）在上游 set(CACHE PATH) 类型升级时被解析到 CMAKE_BINARY_DIR，主库安装源=目的被 cmake --install 静默跳过（包内缺库）；此类安装目录变量一律传绝对路径"
  - "conan 进程 PATH 不含 profile buildenv（仅注入 self.run shell 环境）：build() 内 subprocess 调 ctest 需显式路径解析（/data/service/hnp/bin/ctest）"
  - "ConanFile.run() 的 env 参数是 env 脚本文件名列表（generators 目录找 <name>.sh source），非 VAR=VALUE 列表；传 VAR=VALUE 会被当文件名找不到后原样执行（无环境修改）"
  - "libxml2 conan 包 + openbabel：上游 module 模式 find_package(LibXml2) 判 LIBXML2_FOUND，被 conan 生成的 LibXml2Config.cmake PREFER_CONFIG 抢占（只置 LibXml2_FOUND）→ cmake_find_mode=none 回退 module 模式 + 注入 LIBXML2_INCLUDE_DIR/LIBXML2_LIBRARY"
  - "ohpcd 静态 zlib (libz.a) 无 -fPIC，不可链入 aarch64 共享库；改用 OHOS SDK sysroot 共享 libz.so（ZLIB_INCLUDE_DIR/ZLIB_LIBRARY 注入）"
  - "openbabel 3 头文件装在版本化目录 include/openbabel3/openbabel/，package_info 须设 includedirs=[include/openbabel3]"
  - "OpenBabel 3 API 变更：SetAtomicNum/GetAtomicNum（v2 旧名 SetAtomicNumber/GetAtomicNumber 已移除）；OBMol 在 mol.h、OBAtom 在 atom.h"

