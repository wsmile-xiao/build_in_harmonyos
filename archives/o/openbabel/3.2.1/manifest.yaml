# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.2.1"

# 软件名
software: "openbabel"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-03"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/openbabel/openbabel/archive/refs/tags/openbabel-3-2-1.tar.gz"

  # 源码校验和
  sha256: "e140c25480fe1678d00b9a52462368fa4e7805fba67b12ee496784437f3e239e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（conanfile.py generate() 注入的 cache 变量，详见 notes.md）
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DBUILD_SHARED=ON"
  - "-DCMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG=-Wl,-soname,"
  - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,"
  - "-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=<build>/lib"
  - "-DLIB_INSTALL_DIR=<package>/lib"
  - "-DLIBXML2_INCLUDE_DIR=<libxml2 pkg>/include/libxml2"
  - "-DLIBXML2_LIBRARY=<libxml2 pkg>/lib/libxml2.so"
  - "-DRAPIDJSON_FOUND=TRUE"
  - "-DRAPIDJSON_INCLUDE_DIRS=<rapidjson pkg>/include"
  - "-DRAPIDJSON_VERSION=1.1.0"
  - "-DZLIB_INCLUDE_DIR=<sysroot>/usr/include"
  - "-DZLIB_LIBRARY=<sysroot>/usr/lib/aarch64-linux-ohos/libz.so"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
  - "eigen/3.4.1"
  - "libxml2/2.15.3.1"
  - "rapidjson/1.1.0"
  # zlib 不走 conan 包（制品仓 zlib/1.3.1 静态非 PIC，不可链入共享库），
  # 用 OHOS SDK sysroot 共享 libz.so（配方自动探测最新 SDK 路径）

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
