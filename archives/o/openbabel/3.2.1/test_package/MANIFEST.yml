# test_package MANIFEST — openbabel 3.2.1 消费者测试
package: openbabel/3.2.1
test_type: consumer_assertion
entry: test.cpp
binary: test_package_exe
description: |
  SMILES→InChI 转换硬断言消费者测试（R34 实质依赖被测包）：
  1. OBConversion::SetInAndOutFormats("smi","inchi")
     —— 同时验证格式插件 dlopen 加载链路与插件注册表查找
  2. ReadString("CCO") —— SMILES 解析（被测包核心分子 API）
  3. WriteString + 断言输出含 "InChI=1S/C2H6O"
     —— InChI 生成经 libinchi（被测包内置源码构建的依赖库）
  任一环节（插件加载/注册表/解析/生成）失败即非零退出。
  OHOS 忽略 DT_RUNPATH，test() 显式收集依赖图全部 libdir 注入
  LD_LIBRARY_PATH 后执行。
runtime_env:
  LD_LIBRARY_PATH: "<依赖图全部 libdir：openbabel/lib + libxml2/lib + ...>"
expected: 退出码 0，stdout 含 4 行 "ok:" 与 "全部断言通过"
