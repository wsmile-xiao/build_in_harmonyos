# conandata.yml — openbabel 3.2.1
#
# 补丁分两组（均为平台无关的可移植修复，无平台宏）：
#
# 组 1 — 插件注册表单实例化（0001-0005、0007、0008、0010）
#   根因：plugin.h 的 MAKE_PLUGIN 在默认分支把 Map() 定义为头内 inline 的
#   function-local static，每个 DSO（libopenbabel.so、各格式插件 .so、测试/
#   消费者可执行文件）各持一份私有注册表：插件注册进 A 表、调用方查 B 表，
#   FindType() 恒返回 null（表现为 SetInFormat() 失败、大量格式转换假失败）。
#   上游为 Cygwin/MinGW 已备好同一问题的正解（Map() 外置定义、由
#   PLUGIN_CPP_FILE 在库内单点定义）。本组补丁删除该条件编译，无条件采用
#   外置定义路径：全进程单一注册表。
#
# 组 2 — OBPairTemplate 跨 DSO typeinfo 唯一性（0006、0009）
#   根因：OBPairTemplate<int/double/bool> 在多个 DSO 各自实例化出 WEAK 的
#   typeinfo/vtable；aarch64 的 Itanium ABI 采用唯一 typeinfo 语义
#   （operator== 只比指针），跨 DSO 的 dynamic_cast<OBPairFloatingPoint*>
#   判定失败返回 null，紧随其后的空指针解引用导致 SIGSEGV。
#   修法：generic.h 加 extern template 声明、generic.cpp 在库内单点显式
#   实例化，三个特化在 libopenbabel 中各有一个强符号 typeinfo。

sources:
  url:
    - "https://github.com/openbabel/openbabel/archive/refs/tags/openbabel-3-2-1.tar.gz"
  sha256: "e140c25480fe1678d00b9a52462368fa4e7805fba67b12ee496784437f3e239e"

patches:
  "3.2.1":
    # ── 组 1：插件注册表单实例化（外置定义路径无条件启用）──
    - patch_file: "patches/0010-include-openbabel-plugin.h.patch"
      patch_description: "Make the plugin registry (BaseClass::Map) a single process-wide instance: drop the platform conditional and unconditionally use the out-of-line definition path (PLUGIN_CPP_FILE emits the one strong definition in the library) instead of the inline function-local static variant, which splits the registry across libopenbabel, the format plugin modules and the consumer binaries"
    - patch_file: "patches/0001-src-chargemodel.cpp.patch"
      patch_description: "Emit the single OBChargeModel::Map() definition unconditionally (remove the platform guard around PLUGIN_CPP_FILE)"
    - patch_file: "patches/0002-src-descriptor.cpp.patch"
      patch_description: "Emit the single OBDescriptor::Map() definition unconditionally (remove the platform guard around PLUGIN_CPP_FILE)"
    - patch_file: "patches/0003-src-fingerprint.cpp.patch"
      patch_description: "Emit the single OBFingerprint::Map() definition unconditionally (remove the platform guard around PLUGIN_CPP_FILE)"
    - patch_file: "patches/0004-src-forcefield.cpp.patch"
      patch_description: "Emit the single OBForceField::Map() definition unconditionally (remove the platform guard around PLUGIN_CPP_FILE)"
    - patch_file: "patches/0005-src-format.cpp.patch"
      patch_description: "Emit the single OBFormat::Map() definition unconditionally (remove the platform guard around PLUGIN_CPP_FILE)"
    - patch_file: "patches/0007-src-op.cpp.patch"
      patch_description: "Emit the single OBOp::Map() definition unconditionally (remove the platform guard around PLUGIN_CPP_FILE)"
    - patch_file: "patches/0008-src-ops-loader.cpp.patch"
      patch_description: "Emit the single OBLoader::Map() definition unconditionally (remove the platform guard around PLUGIN_CPP_FILE)"
    # ── 组 2：OBPairTemplate 跨 DSO typeinfo 唯一性 ──
    - patch_file: "patches/0009-include-openbabel-generic.h.patch"
      patch_description: "Declare the frequently used OBPairTemplate<int/double/bool> specializations as extern template so that every translation unit binds to the single instantiation in the library (unique typeinfo across DSOs)"
    - patch_file: "patches/0006-src-generic.cpp.patch"
      patch_description: "Explicitly instantiate OBPairTemplate<int/double/bool> once in libopenbabel (matches the extern template declarations in generic.h), giving each specialization one strong typeinfo/vtable so cross-DSO dynamic_cast resolves under the Itanium unique-typeinfo ABI"
