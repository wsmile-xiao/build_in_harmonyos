# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: openxr/1.1.63
homepage: "https://www.khronos.org/openxr/"

# 上游测试形态说明：上游用 CTest + vendored Catch2 v3。
# 全树（不含 src/external/catch2 这个测试框架本体）只有一个注册的测试目标：
#   src/tests/loader_test/CMakeLists.txt:72
#     add_test(NAME loader_test COMMAND loader_test
#              WORKING_DIRECTORY "$<TARGET_FILE_DIR:loader_test>")
# 该目标由 BUILD_TESTS=ON 打开（Catch2 只在 BUILD_TESTS OR
# BUILD_CONFORMANCE_TESTS 时才 add_subdirectory），并且它的 add_dependencies
# 需要 BUILD_API_LAYERS=ON。上游的 conformance 测试（src/conformance）不注册
# ctest、且需要图形 API 与真实运行时，本包关闭。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游唯一 ctest 目标：loader_test（Catch2 v3，6 个 TEST_CASE / 10 个 SECTION）
upstream_tests:
  - file: src/tests/loader_test/loader_test.cpp
    description: "Catch2 v3 套件，6 个 TEST_CASE / 10 个 SECTION / 56 个断言。4 个 TEST_CASE 开头是 `if (!g_has_installed_runtime) SKIP(...)`，能否执行取决于 loader 能否发现上游生成的 test_runtime 清单"
    command: "ctest -R loader_test --output-on-failure"

# test_package 中自带的测试（消费者视角验证，真实编译 + 真实运行）
test_package_tests:
  - file: test_package/test_openxr.cxx
    description: "8 条断言，3 组：A 无运行时下的确定性行为（XR_RUNTIME_JSON 未设 + XDG 指向空目录 → XR_ERROR_RUNTIME_UNAVAILABLE，且 stub 哨兵不存在）；B loader 内核符号经 version script 导出（xrGetInstanceProcAddr(XR_NULL_HANDLE,\"xrCreateInstance\") == XR_SUCCESS 且指针非空；未知名返回 XR_ERROR_HANDLE_INVALID 且指针被清空）；C 运行时协商链路（stub 哨兵文件出现）"
    command: "test_openxr <runtime_json> <marker> <empty_xdg_dir>"
  - file: test_package/stub_runtime.cxx
    description: "最小 XR 运行时（MODULE 库 libstub_runtime.so），只导出 xrNegotiateLoaderRuntimeInterface；故意让协商失败，但在返回前把 OPENXR_STUB_MARKER 指向的文件写出来，作为「loader 真的 dlopen+dlsym+调用」的唯一可靠判据"
    command: "（由 test_openxr 通过运行时清单间接触发 dlopen）"
  - file: test_package/conanfile.py
    description: "测试驱动：CMakeToolchain + find_package(OpenXR) 直吃上游安装的 CMake 包配置（刻意不用 CMakeDeps）；写运行时清单、切断继承的 XR_RUNTIME_JSON、把包 lib 与 OHOS SDK llvm/lib 注入 LD_LIBRARY_PATH，然后 self.run() 真实执行被测程序"
    command: "conan test"

# 平台特有测试：OHOS（musl 加载器 + 无兜底搜索路径）上 dlopen 一条运行时
platform_specific_tests:
  - description: "鸿蒙特有：loader 能否在 OHOS 上 dlopen 一个运行时并调进其协商入口。XR_RUNTIME_JSON 指向合法清单后，loader 必须 dlopen libstub_runtime.so、dlsym 到 xrNegotiateLoaderRuntimeInterface 并真的调用它 —— 判据是 stub 落下的哨兵文件出现。**不能靠 xrCreateInstance 的返回码判断**：RuntimeInterface::LoadRuntime 会把 negotiate 的任何失败统一归一化成 XR_ERROR_RUNTIME_UNAVAILABLE，与「根本没找到运行时」同码"
    command: "XR_RUNTIME_JSON=<json> OPENXR_STUB_MARKER=<marker> test_openxr"

# 断言总数：
#   test_package/test_openxr.cxx 内 8 条
# = 8
assertion_count: 8
