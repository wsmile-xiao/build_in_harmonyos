sources:
  url: "https://github.com/KhronosGroup/OpenXR-SDK-Source/archive/refs/tags/release-1.1.63.tar.gz"
  sha256: "a3b97a36f11abe256a7ea1668a0a468aac9b738e94bea6b468f0ae31ad537a46"

patches:
  - patch_file: "patches/0002-src-CMakeLists.txt.patch"
    patch_description: >-
      Treat HarmonyOS as a Linux-compatible platform: the Conan OHOS toolchain
      sets CMAKE_SYSTEM_NAME=HarmonyOS, which misses the `STREQUAL "Linux"`
      branch that defines XR_OS_LINUX.  Without XR_OS_LINUX the loader's
      platform helpers (dlopen/dlsym wrappers in loader_platform.hpp and
      PlatformUtilsGetEnv in common/platform_utils.hpp) are not compiled at
      all, and the XDG_CONFIG_HOME runtime-discovery branch in
      manifest_file.cpp is skipped.
    patch_type: "portability"
