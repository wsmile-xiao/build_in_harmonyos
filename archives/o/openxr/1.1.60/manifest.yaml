# ============================================================

test_results:
  # 测试状态
  status: passed

  # 测试日期
  test_date: "2026-06-09"

  # 测试覆盖率
  coverage:
    installation: "100%"
    symbol_export: "100%"
    dynamic_loading: "100%"
    api_functionality: "100%"
    compilation_link: "100%"

  # 关键发现
  findings:
