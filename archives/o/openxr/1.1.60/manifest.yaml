software: openxr
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.60/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.60"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/openxr-sdk-1.1.60.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=toolchain.cmake"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_TESTS=OFF"
    - "-DBUILD_CONFORMANCE_TESTS=OFF"
    - "-DBUILD_API_LAYERS=OFF"
    - "-DDYNAMIC_LOADER=ON"
    - "-DPRESENTATION_BACKEND=none"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: /data/service/hnp/bin/clang
  cxx: /data/service/hnp/bin/clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0002-src-CMakeLists.txt.patch"
  - "0003-src-cmake-presentation.cmake.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OpenHarmony 系统 uname -s 返回 'HarmonyOS'，CMAKE_SYSTEM_NAME 应设置为 'Linux' 以使用 Linux-compatible API"
  - "必须使用系统 OHOS SDK 的 clang（15.0.4），用户编译的 clang（18.1.8）缺少运行时库会导致链接失败"
  - "OpenXR 的 presentation backend 检查可以添加 'none' 选项来支持无图形库的系统"
  - "OpenXR loader 可以在无 XR runtime 的环境下正常加载和链接，但完整功能需要 XR runtime"
  - "导出符号数量: 56 个 xr* API 函数，符号命名规范统一"

# ============================================================
