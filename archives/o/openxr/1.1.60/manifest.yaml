    - "所有 OpenXR API 符号正确导出（56 个）"
    - "依赖简洁：仅 libc++_shared.so 和 libc.so"
    - "需要 XR runtime 才能完整使用（预期限制）"
    - "可以正常编译链接 OpenXR 程序"

  # 性能指标
  performance:
    library_size: "559KB"
    load_time: "<50ms"
    symbol_resolution: "<10ms"

  # 测试评级
  rating: "A级 - 完全可用（在无 XR runtime 环境下）"

