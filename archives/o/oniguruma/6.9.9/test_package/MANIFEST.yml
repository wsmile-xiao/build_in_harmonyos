# test_package/MANIFEST.yml
# 上游官方测试声明文件 — oniguruma 6.9.9
# 上游 CMake 测试注册见 test/CMakeLists.txt（BUILD_TEST 时 add_subdirectory(test)）

package: oniguruma/6.9.9
homepage: "https://github.com/kkos/oniguruma"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（CMake 注册的可执行测试目标）
upstream_tests:
  - file: test/test_utf8.c
    source: oniguruma-6.9.9/test/test_utf8.c
    description: "UTF-8 正则核心用例（SUCC/FAIL/ERROR 统计）"
    command: "./test_utf8"
  - file: test/test_syntax.c
    source: oniguruma-6.9.9/test/test_syntax.c
    description: "语法正则用例（SUCC/FAIL/ERROR 统计）"
    command: "./test_syntax"
  - file: test/test_options.c
    source: oniguruma-6.9.9/test/test_options.c
    description: "编译选项/配置用例"
    command: "./test_options"
  - file: test/testc.c
    source: oniguruma-6.9.9/test/testc.c
    description: "EUC 编码用例（非 MSVC 专属）"
    command: "./testc"
  - file: test/testu.c
    source: oniguruma-6.9.9/test/testu.c
    description: "多字节/Unicode 用例"
    command: "./testcu"
  - file: test/test_regset.c
    source: oniguruma-6.9.9/test/test_regset.c
    description: "RegSet 集合用例"
    command: "./test_regset"
  - file: test/test_back.c
    source: oniguruma-6.9.9/test/test_back.c
    description: "向后引用用例"
    command: "./test_back"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：oniguruma.h API 编译链接 + onig_new/onig_search 真实匹配"
    command: "./test_oniguruma"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7