# 软件级 manifest 模板
# 文件位置: archives/o/otf2bdf/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: otf2bdf

# 显示名
display: "OTF to BDF Converter"

# 一句话描述
description: "将 OpenType 字体转换为 BDF 字体的工具，使用 FreeType 2 渲染器"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: gfx

# 官网 URL
homepage: "https://www.math.nmsu.edu/~mleisher/Software/otf2bdf.html"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "使用 pkg-config 检查 FreeType（设置 PKG_CONFIG_PATH）"
    - "补丁提供简化的 configure 脚本，避免 autoconf 复杂语法"
    - "使用 cc wrapper 避免链接器环境问题"
    - "补丁包含 Makefile.in 支持 DESTDIR 模式"

  # 跨版本通用依赖
  common_dependencies:
    - freetype
    - zlib
    - libpng

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.1":
    status: published
    build_date: 2026-06-16