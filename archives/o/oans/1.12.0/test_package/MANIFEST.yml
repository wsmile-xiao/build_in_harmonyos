# MANIFEST.yml — oans/1.12.0
package: oans/1.12.0
homepage: "https://github.com/martinus/oans"
upstream_check_command: "make test && make integration"
upstream_test_in_build: true
upstream_test_command: "make -j1 test && DUPEREMOVE=./oans python3 tests/run.py -j 4"

# 上游单元测试全集：25 个 C 源文件（main.c 与 tu_*.c 为测试入口/翻译单元）
upstream_tests:
