test_package_tests:
  - file: test.sh
    type: smoke
    command: "OANS_BIN=oans ./test.sh"
    result: PASS
    cases:
      - name: packaged_command_metadata
        result: PASS
        description: "验证 oans 和 duperemove 的 --version 与 --help 输出"
      - name: consumer_duplicate_scan
        result: PASS
        description: "创建两个同内容文件，执行打包后的 oans 扫描并断言识别为 2 个 identical files"
test_package_total: 2

