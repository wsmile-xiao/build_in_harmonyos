# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# outils-ts 0.14（= outils 0.14 的 ts 组件）上游无任何自动化测试套件：
#   - 全树 13 个 Makefile 均无 test/check/regress 目标（计数 = 0）
#   - tarball 内无 tests/ 目录、无 .github/.gitlab-ci.yml/.travis.yml
#   - ts 组件目录 src/usr.bin/ts/ 仅 ts.c + ts.1（无测试文件）
#   - 全树唯一自检入口是 md5 组件的 `md5 -t`（digest_test()），与 ts 无关
# 因此适配后补全二进制级功能测试（依据上游 ts(1) 手册的 SYNOPSIS/EXAMPLES）
# 以及 HarmonyOS 专项测试（reallocarray 增长路径 + ELF ABI/loader/deps）。

package: outils-ts/0.14
homepage: "https://github.com/leahneukirchen/outils"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 实测：make -n check -> "make: *** No rule to make target 'check'. Stop."
upstream_check_command: "make -n check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无测试程序，此处为空
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 上游无测试套件，以下为适配后补全的测试（断言值均来自本机真实执行基线）
test_package_tests:
  - file: test_package/test_ts.sh
    description: "T1 默认格式 %b %d %H:%M:%S：两行输入各得一个时间戳前缀"
    command: "./test_ts.sh (T1 default format)"

  - file: test_package/test_ts.sh
    description: "T2 -i 显示与上一行的间隔，默认格式 %H:%M:%S"
    command: "./test_ts.sh (T2 interval)"

  - file: test_package/test_ts.sh
    description: "T3 -s 显示自程序启动起经过的时间（%H:%M:%S）"
    command: "./test_ts.sh (T3 since start)"

  - file: test_package/test_ts.sh
    description: "T4 -m 使用单调时钟生成时间戳"
    command: "./test_ts.sh (T4 monotonic)"

  - file: test_package/test_ts.sh
    description: "T5 位置参数 format 生效（'%Y-%m-%d'）"
    command: "./test_ts.sh (T5 custom format)"

  - file: test_package/test_ts.sh
    description: "T6 微秒扩展 %.S（上游手册 EXAMPLES: ls | ts -i %.S）"
    command: "./test_ts.sh (T6 microsecond %.S)"

  - file: test_package/test_ts.sh
    description: "T7 -i 与 -s 互斥：exit 1 + stderr usage 行 + stdout 为空"
    command: "./test_ts.sh (T7 mutually exclusive options)"

  - file: test_package/test_ts.sh
    description: "T8 多余位置参数：exit 1 + stderr usage 行"
    command: "./test_ts.sh (T8 extra operand)"

  - file: test_package/test_ts.sh
    description: "T9 [鸿蒙特有] reallocarray(3) 动态扩容路径（OHOS 补丁 0001 所补对象的调用点）：'%2000Y' 迫使 strftime 溢出缓冲，断言输出 >2000 字符且输入行保留"
    command: "./test_ts.sh (T9 OHOS reallocarray growth)"

  - file: test_package/test_ts.sh
    description: "T10 [鸿蒙特有] 打包 ELF 的 ABI/加载器/依赖形状（9 断言）：ELF 魔数 + ELF64/LE + ET_DYN(PIE) + EM_AARCH64 + 唯一 NEEDED=libc.so + musl aarch64 解释器 + 无 RPATH/RUNPATH"
    command: "./test_ts.sh (T10 OHOS ELF/ABI/deps)"

# 测试断言总数 (近似值, 用于质量评估)
# 10 个测试组共 23 个断言点（含鸿蒙特有 11 个：T9 两项 + T10 九项）
# 实测：conan create → test_package 输出 "--- results: 23 passed, 0 failed ---"
assertion_count: 23
