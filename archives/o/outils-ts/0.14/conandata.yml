# conandata.yml — outils-ts 0.14
# ts(1) component of the outils project (tag v0.14).
sources:
  url: "https://github.com/leahneukirchen/outils/archive/refs/tags/v0.14.tar.gz"
  sha256: "e4dcbd92b25bbb371216b0fad5aa80cdff19f466f7ec8b5e145111fb348c91eb"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: >-
      OHOS/musl 的 libc 不提供 reallocarray(3)（glibc 提供），上游 Makefile 的
      ts 链接闭包因此缺对象，链接报 "undefined symbol: reallocarray"。
      补丁把同源兼容实现 src/liboutils/reallocarray.o 加入 ts 目标。
    patch_type: "portability"
