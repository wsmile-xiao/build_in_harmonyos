# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "outils 是纯手写 GNU Makefile 工程（无 configure/cmake）；各工具目录的 OpenBSD bsd.prog.mk 风格 Makefile 不参与顶层构建"
  - "OHOS（clang 15 / musl）libc 不提供 reallocarray(3)：ts 的链接闭包（ts.o + strlcpy.o + pledge.o）缺 src/liboutils/reallocarray.o，链接报 undefined symbol: reallocarray"
  - "ts 的 reallocarray 调用点在 fmtprint()：strftime() 返回值 0（缓冲不足）时用 reallocarray 扩容，故可用超宽格式（如 %2000Y）在运行期覆盖该路径"
  - "上游 install 目标依赖 coreutils install(1) 且写入写死的系统 PREFIX，OHOS 上改用 Conan copy() 打包"
  - "ts 无 --version/--help；用 -i -s 互斥或多余操作数触发 usage（exit 1）作为可执行性冒烟探针"

