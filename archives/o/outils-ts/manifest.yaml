# 软件级 manifest — outils-ts
software: outils-ts
display: "outils-ts"
description: "ts(1)：为标准输入的每一行添加时间戳（outils OpenBSD 工具移植集中的 ts 组件），可选 -i/-s/-m 与 strftime 格式"
category: utility
homepage: "https://github.com/leahneukirchen/outils"
license: 0BSD
build_system: makefile
ohos_adaptation:
  key_points:
    - "outils 为纯手写 GNU Makefile 工程（无 configure/cmake）；本包只构建 ts 目标，不构建其余 12 个工具"
    - "OHOS（clang 15 / musl）libc 无 reallocarray(3)：上游 ts 链接闭包缺 src/liboutils/reallocarray.o，补丁 0001 补链该同源对象"
    - "零第三方依赖：ts 仅依赖 libc（+ 同源 liboutils 对象：strlcpy / pledge 空实现 / reallocarray）"
    - "上游 install 目标依赖 coreutils install(1) 且写入写死的系统 PREFIX，OHOS 上改用 Conan copy() 打包（bin/ts + share/man/man1/ts.1）"
    - "上游无任何测试套件（13 个 Makefile 的 test/check/regress 目标计数 = 0）；test_package 补全 10 组 23 断言，含鸿蒙特有 11 项（reallocarray 增长路径 + ELF/ABI/依赖形状）"
    - "ts 无 --version/--help：可执行性探针用 '-i -s' 互斥触发 usage（exit 1）"
  common_dependencies: []

versions:
  "0.14":
    status: built
    build_date: "2026-09-26"
    conan_ref: outils-ts/0.14
