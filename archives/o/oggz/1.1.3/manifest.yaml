knowledge_gained:
  - "config.guess/config.sub 需加 HarmonyOS 三元组支持 (E007/E072): uname -s=HarmonyOS"
  - "config.status 临时目录 mktemp -d ./confXXXXXX 在 OHOS HMDFS 不可用 (E002), 改 mkdir (flac 同款修复)"
  - "conan 的 get(strip_root) 在该 tarball 顶层 PATCHES 文件与导出的 patches/ 目录在大小写不敏感沙箱 FS 冲突 (EISDIR), 用手动 tarfile 解压并跳过 PATCHES"
  - "DEFAULT_PREFIX/bin 下的 coreutils shim (cat/timeout) 会破坏 conan 内 configure 的 heredoc/管道 (E540): 运行时固定 PATH=/system/bin:/usr/bin:/bin:... 并用 python subprocess 驱动 configure/make/install"
  - "libogg 配方 (cmake_layout) 不向 CMakeDeps 宣告 include 目录: 下游需显式提供 <libogg>/include"
  - "libogg 系统同名库必须静态消费 (R26): default_options libogg/*:shared=False"

