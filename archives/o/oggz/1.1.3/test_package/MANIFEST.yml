# test_package/MANIFEST.yml
# 上游官方测试声明文件 (L0e)

package: oggz/1.1.3
homepage: "https://www.xiph.org/oggz/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 中是否集成上游测试 (未集成: 完整测试在 CI/manual 验证)
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序 (liboggz 1.1.3 自带测试; 本适配环境 make check 因
# HMDFS getcwd/mktemp 限制无法通过 libtool wrapper 执行, 单元测试已直接运行验证通过)
upstream_tests:
  - file: comment-test.c
    source: oggz-1.1.3/src/tests/comment-test.c
    description: "Ogg comment (Vorbis/Speex/Theora) generate/read/iterate unit test"
    command: "./comment-test"
  - file: httpdate_test.c
    source: oggz-1.1.3/src/tools/oggz-chop/httpdate_test.c
    description: "oggz-chop HTTP-date parser unit test"
    command: "./httpdate_test"

# test_package 自带消费者视角测试
test_package_tests:
  - file: test.c
    description: "liboggz write+read API smoke test (oggz_open_stdio/oggz_close)"
    command: "./test_oggz"

assertion_count: 8
