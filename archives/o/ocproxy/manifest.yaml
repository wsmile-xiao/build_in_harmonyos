software: ocproxy
display: "ocproxy"
description: "基于 lwIP 的用户态 SOCKS5 代理与端口转发工具，配合 OpenConnect 的 --script-tun 使用"
category: network
homepage: "https://github.com/cernekee/ocproxy"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 release tarball 只带 autotools 源码（configure.ac/Makefile.am），没有预生成的 configure 与 Makefile.in，配方里必须自己跑 autoreconf"
    - "config.guess 无法识别 HarmonyOS（设备上也没有 cc 可执行文件供它探测），configure 会以 cannot guess build type 失败；必须用 config.sub 能识别的 aarch64-linux-ohos 显式给 --build/--host，且两者相同以保持 native 语义"
    - "autoconf 生成的 configure 用 (umask 077 && mktemp -d) 建私有临时目录，HMDFS 下该目录落盘为 2700、连创建者进程都写不进去，config.status 写 subs1.awk 时 Permission denied；生成补丁去掉 umask"
    - "vpnns 用到 GNU 专有的 get_current_dir_name()，OHOS libc 完全没有该符号（隐式声明返回 int，被 -Werror=int-conversion 拦下），改用 POSIX 的 getcwd(NULL, 0)"
    - "AutotoolsDeps 只给 -L/-l、不给 rpath（非 macOS 分支不注入），configure 的 C 编译器可用性与 AC_CHECK_LIB 探针必须先拿到 libevent 的 LD_LIBRARY_PATH 才能跑通"
    - "lwIP 与 lwIP unix contrib port 已随 tarball vendored，无需外部依赖；libevent 是唯一外部依赖且已发布（libevent/2.1.13）"
    - "ocproxy/vpnns 都动态链接 libevent，运行期需要 libevent 的 lib 目录在加载器搜索路径上（conanrun 已注入）"
    - "autoreconf 需要 automake，但不能依赖宿主环境：设备 PATH 里有 ~/.harmonybrew/bin 的 aclocal，CI worker 没有，直接跑会在 aclocal 处失败；用 tool_requires(automake/1.18) 从 registry 取"
  common_dependencies:
    - libevent
  common_tool_dependencies:
    - automake

versions:
  "1.6":
    status: built
    build_date: "2026-09-13"
    conan_ref: "ocproxy/1.6"
  "1.60":
    status: built
    build_date: "2026-09-19"
    conan_ref: "ocproxy/1.60"
