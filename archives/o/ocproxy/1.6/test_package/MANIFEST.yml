# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ocproxy/1.6
homepage: "https://github.com/cernekee/ocproxy"

# ── 上游测试清点 ───────────────────────────────────────────────
# 上游 1.6 没有自动化测试套件。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_tests_exist: false

upstream_test_audit:
  - source: "Makefile.am"
    reason: "142 行里没有 TESTS、check_PROGRAMS、check-local 或 check 目标，只定义 bin_PROGRAMS = ocproxy 与可选的 vpnns。取数命令：grep -nE 'TESTS|check_PROGRAMS|check-local|check:' Makefile.am（无命中）。"
  - source: "configure.ac"
    reason: "只有 --enable-debug 与 --enable-vpnns 两个开关，没有任何测试相关宏或 AC_CONFIG_TESTDIR。取数命令：grep -nE 'check|test' configure.ac（返回 3 行，均为 shell 条件与 AM_CONDITIONAL：第 23/45 行的 `if test` 与第 50 行的 `AM_CONDITIONAL`，没有测试框架宏）。"
  - source: "lwip/test/unit/"
    reason: "随 tarball vendored 的 lwIP 自带 22 个 START_TEST 用例（core 4、tcp 12、dhcp 4、etharp 1、udp 1），但依赖 Check 框架且 ocproxy 的构建系统完全不引用 lwip/test：Makefile.am 的 LWIP_SOURCES 只列 lwip/src 与 contrib/ports/unix，没有 lwip/test 路径。取数命令：grep -c '^START_TEST' lwip/test/unit/*/*.c。"
  - source: "conclusion"
    reason: "本包构建实际运行的上游测试数 N = 0（可运行入口为 0）；vendored lwIP 的 22 个用例属死代码，不构成本包的上游测试覆盖，也不作为分母申报。"

# ── test_package 自带测试（消费者视角，R34：必须实质调用被测产物）──
test_package_tests:
  - file: run_test.py
    description: "两个打包产物存在且可加载（libevent 符号全部解析）。"
    command: "python3 run_test.py <package>/bin"
  - file: run_test.py
    description: "失败闭合：未设 VPNFD、非数字 VPNFD 均以非 0 退出并给出既有诊断文案。"
    command: "python3 run_test.py <package>/bin"
  - file: run_test.py
    description: "-D 拉起真实 SOCKS5 监听端口：版本/方法协商返回 05 00，CONNECT 请求被接受并把 lwIP 生成的报文写进 VPNFD 隧道（socketpair 实测收到 227 字节）。"
    command: "python3 run_test.py <package>/bin"
  - file: run_test.py
    description: "-L 拉起真实本地端口转发监听端口；畸形 -D（not-a-port）与截断 -L（1234:onlyhost）以文档化文案失败闭合。"
    command: "python3 run_test.py <package>/bin"
  - file: run_test.py
    description: "补丁新增的 CLI 出口：ocproxy --version/-V/--help 在无隧道环境下退出码 0 并输出内容；vpnns -h 退出 1 打印用法、-v 退出 0 打印版本、无参以 no command given 失败闭合（补丁前为段错误）。"
    command: "python3 run_test.py <package>/bin"

test_scenario_count: 5
assertion_count: 17
assertion_count_basis:
  package_layout: 2
  failure_modes: 2
  live_socks_and_forward: 6
  version_help_switches: 4
  vpnns_cli_and_guard: 3

upstream_test_source: "upstream ocproxy 1.6 tarball: Makefile.am, configure.ac and the vendored lwip/test/unit tree"
