version: "1.6"
software: "ocproxy"
status: built
build_date: "2026-09-13"
build_system: autotools

source:
  url: "https://github.com/cernekee/ocproxy/archive/refs/tags/v1.60.tar.gz"
  sha256: "a7367647f07df33869e2f79da66b6f104f6495ae806b12a8b8d9ca82fb7899ac"
  tar_format: tar.gz
  # The GitHub archive extracts to ocproxy-1.60/ because the upstream tag is
  # v1.60 while the platform task card (and this directory) say 1.6.  The bytes
  # are identical to Debian's signed orig tarball:
  #   https://deb.debian.org/debian/pool/main/o/ocproxy/ocproxy_1.60.orig.tar.gz
  verified_mirror: "https://deb.debian.org/debian/pool/main/o/ocproxy/ocproxy_1.60.orig.tar.gz"

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
  dependencies:
    - libevent/2.1.13
  tool_dependencies:
    - automake/1.18
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-ocproxy.c.patch"
  - "0002-src-vpnns.c.patch"

test_results:
  type: test_package-integration
  total: 17
  passed: 17
  failed: 0
  reason: "The packaged ocproxy drives a real SOCKS5 negotiation and a real local-forward listener over the VPNFD tunnel; failure paths (missing/invalid VPNFD, malformed -D/-L) fail closed; the vpnns CLI and the no-command guard are covered."

upstream_tests:
  declared_total: 0
  run: 0
  reason: "Upstream 1.6 ships no automated test suite: Makefile.am has no TESTS/check_PROGRAMS/check-local target and configure.ac defines no check target. The vendored lwIP tree carries 22 START_TEST cases under lwip/test/unit, but ocproxy's build system never references lwip/test (not in LWIP_SOURCES, no check target), so they are dead code in this build. Details and the counting commands are in reports/upstream-test-inventory.md."

knowledge_gained:
  - "config.guess fails on HarmonyOS by construction: uname -s reports HarmonyOS and the device has no cc for its compile probe, so configure aborts with cannot guess build type. Use the config.sub-recognised aarch64-linux-ohos explicitly as both --build and --host to stay in native mode."  # knowledge_ref: E007
  - "The autoconf-generated configure embeds (umask 077 && mktemp -d ./confXXXXXX); on HMDFS the directory lands as drwx--S--- 2700 and even the creating process cannot write into it, so config.status dies with Permission denied while writing subs1.awk. Dropping the umask fixes it."  # knowledge_ref: E011
  - "AutotoolsDeps injects -L but no rpath on OHOS (the rpath branch is macOS-only), so configure's cannot run C compiled programs failure is really libevent being absent from the loader path; adding the dependency lib dir to LD_LIBRARY_PATH in the build environment makes AC_CHECK_LIB/AC_CHECK_HEADERS pass."  # knowledge_ref: E467
  - "The GNU-only get_current_dir_name() has neither a declaration nor a symbol in the OHOS libc; it compiles as an implicit int declaration and is rejected by the project's own -Werror=int-conversion. getcwd(NULL, 0) is the equivalent POSIX call."  # knowledge_ref: E505
  - "On HMDFS a pipe write end is not reported readable by select()/poll() even when data is buffered (measured: os.pipe() gave 0 bytes, a socketpair delivered the frame), so end-to-end tunnel observability tests must use a socketpair."  # knowledge_ref: E233
  - "A tarball that ships autotools sources but no generated configure needs automake from the registry, not from the host: the device resolves aclocal from ~/.harmonybrew/bin so the build looks green locally, while the CI worker PATH has no aclocal at all and autoreconf dies with 'aclocal failed with exit status: 2'. Declaring tool_requires('automake/1.18') makes its package_info export ACLOCAL_PATH/AUTOMAKE/ACLOCAL/PERL5LIB and works on both."  # knowledge_ref: E490
