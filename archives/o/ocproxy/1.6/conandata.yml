# ocproxy 1.6 upstream release tarball.
#
# The upstream project tags the release as "v1.60" while configure.ac declares
# AC_INIT([ocproxy], [1.60]) and the platform task card says "1.6"; the tarball
# therefore extracts to ocproxy-1.60/. The bytes of this GitHub archive are
# identical to Debian's signed orig tarball ocproxy_1.60.orig.tar.gz (sha256
# matches byte for byte), which is an independent authoritative mirror.
sources:
  url: "https://github.com/cernekee/ocproxy/archive/refs/tags/v1.60.tar.gz"
  sha256: "a7367647f07df33869e2f79da66b6f104f6495ae806b12a8b8d9ca82fb7899ac"

patches:
  - patch_file: "patches/0001-src-ocproxy.c.patch"
    patch_description: "Add -V/--version and -h/--help to ocproxy so packaging and CI smoke checks can identify the binary without a tunnel (matches the option style upstream added in 1.60 for vpnns); includes <config.h> for PACKAGE_VERSION and pre-scans argv so the informational switches work before the VPNFD check"
    patch_type: "portability"
  - patch_file: "patches/0002-src-vpnns.c.patch"
    patch_description: "Port vpnns to the OHOS libc: replace the GNU-only get_current_dir_name() with the POSIX getcwd(NULL, 0); BEHAVIOUR CHANGE: a vpnns invocation without a command now prints usage and exits 1 instead of launching $SHELL through the namespace setup path (which dereferenced the missing command and crashed on kernels that refuse the namespace setup)"
    patch_type: "portability"

