package: ols/dev-2026-06
homepage: https://github.com/DanielGavin/ols

# 上游测试命令（上游 ci.sh 的 CI 分支，开发者在源码树根执行）
#   ci.sh CI  →  cd tests && odin test ../tests -collection:src=../src -o:speed \
#                  -define:ODIN_TEST_THREADS=1
upstream_check_command: "ci.sh CI"
upstream_test_in_build: true
upstream_test_command: "cd tests && odin test ../tests -collection:src=../src -o:speed -define:ODIN_TEST_THREADS=1 -extra-linker-flags:<build>/ohos_libc_compat.o（构建期真实执行，非致命记录）"

# 上游测试套件统计（dev-2026-06 tag 源码树实测，2026-09-18）
#   tests/ 下 12 个 *_test.odin 文件声明 860 项 @(test)（另有 3 处同形文本不构成测试：
#   completions_test.odin 的 fixtures 字符串内 1 处、/* */ 注释块内 2 处）。
#   该套件为 ols 自身的 LSP 端到端测试（hover/completion/definition/references/
#   signature/documentSymbol/rename/inlay hints/actions 等），无需网络与外部资产，
#   本机（= 目标平台 aarch64 HarmonyOS PC）可完整真实执行。
upstream_total_tests: 860
upstream_test_assets_required: false

upstream_subset_result:
  platform: "aarch64 HarmonyOS PC（本机 = OHOS 目标平台）"
  attempts: 860
  passed: 860
  failed: 0
  skipped: 0
  note: >-
    全量真跑，无跳过、无豁免：`Finished 860 tests in 3.658747813s. All tests were
    successful.`（rc=0）。runner 计数经 -define:ODIN_TEST_JSON_REPORT 交叉核对为 860
    条，与静态声明数（863 处 grep 命中减去 3 处非测试文本）一致。未修改上游任何
    测试用例与源码。测试期仅以 -extra-linker-flags 注入 OHOS libc 线程取消符号
    空桩（平台链接垫片，见 conanfile.py 说明）。

upstream_tests: []

# test_package 中自带的测试（消费者视角，6 项；由 conanfile.py 的 test() 调用）
test_package_tests:
  - file: run_tests.sh
    description: "测试驱动（6 项检查由此脚本执行，无头 LSP 会话）"
    command: "bash run_tests.sh <ols_bin> <pkg_dir> <work_dir>"
  - file: lsp/init.json
    description: "纯 IO 契约：bin/ols version 输出 'ols version dev-2026-06' 且 rc=0（服务端启动前的退出路径）"
    command: "bin/ols version | grep -F 'ols version dev-2026-06'"
  - file: lsp/init.json
    description: "运行期资产：bin/builtin/{builtin.odin,intrinsics.odin} 与 bin/ols 同级（上游 README 要求）"
    command: "test -f <pkg>/bin/builtin/builtin.odin"
  - file: lsp/init.json
    description: "initialize 握手：id 回显 + result.capabilities 及 8 项能力字段（hover/definition/documentSymbol/formatting/references/workspaceSymbol/rename/completion.triggerCharacters）"
    command: "printf 'Content-Length: %d\\r\\n\\r\\n%s' ... | bin/ols"
  - file: lsp/did_open.json
    description: "功能验证：didOpen + documentSymbol 返回函数符号 add(line 4)/main(line 8)，kind=12(SymbolKind.Function)"
    command: "同上会话内 textDocument/documentSymbol"
  - file: lsp/shutdown.json
    description: "优雅退出：shutdown 返回 {\"id\": 2, \"result\": null}，exit 通知后进程 rc=0（无超时/崩溃）"
    command: "同上会话内 shutdown + exit"

assertion_count: 6
