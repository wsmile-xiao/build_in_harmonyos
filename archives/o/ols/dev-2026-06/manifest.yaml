software: ols
version: "dev-2026-06"
build_system: odin build（上游 ci.sh 等价命令，配方内直接构造）
status: built
source:
  url: "https://github.com/DanielGavin/ols/archive/refs/tags/dev-2026-06.tar.gz"
  sha256: "f8055ff723994dc4debc02817c230d0173c43a23df4a9d6a7104fea69bfeeb79"
knowledge_gained:
  - "ols 是纯 Odin 语言实现的 LSP 服务器（package main，src/main.odin）；上游构建 100% 由 odin 编译器驱动（build.sh 本地 / ci.sh CI），无 CMake/Make/Autotools，无平台分支脚本可绕"
  - "上游 CI 构建命令：odin build src/ -show-timings -collection:src=src -out:ols -no-bounds-check -o:speed -define:VERSION=$OLS_VERSION（ci.sh#L42）；本地 build.sh 额外带 -microarch:native。本配方采用 ci.sh 形态（CI 与本地一致、无 host CPU 特性耦合）"
  - "VERSION 经 -define:VERSION 注入，上游默认为 nightly-<UTC日期>-<短sha>（非 git 树构建不可复现）；本适配固定为 dev-2026-06，使 ols version 可断言、构建可复现"
  - "构建工具链经 conan tool_requires 引入 odin/dev-2026-08（Odin 编译器）与 llvm/22.1.0；odin 属 build context，conan 聚合其运行环境进 conanbuild（PATH 含 odin bin/；LD_LIBRARY_PATH 含 llvm lib/），ODIN_ROOT 需显式指向 odin 包根"
  - "OHOS libc（SDK sysroot 与设备端）未导出线程取消符号 pthread_cancel / pthread_setcancelstate / pthread_setcanceltype / pthread_testcancel；ols 经 core:thread（main.odin L56 thread.create_and_start_with_data）创建请求线程，直接编译即 ld.lld: undefined symbol: pthread_setcancelstate（ols.o 内 thread_unix.odin）。以无害空桩 + -extra-linker-flags 注入链接解决，0 补丁、不改上游源码"
  - "ols 的 LSP 帧格式为标准 Content-Length + CRLF（src/server/requests.odin read_and_parse_header 强制 message[len-2] == '\\r'），可用命名管道/进程管道直接驱动"
  - "上游 initialize 响应只有 result.capabilities，无 serverInfo（types.odin: ResponseInitializeParams :: struct { capabilities }）；能力断言应落在 capabilities 字段"
  - "无头环境下的上游行为（不作为本适配缺陷，已落盘上报）：stdin 提前 EOF 时 reader 线程直接 return，主循环 consume_requests 仍同步 sema_wait，进程永久阻塞 —— 无头测试必须显式走 initialize→…→shutdown→exit 完整生命周期，不能靠关闭 stdin 收尾"
  - "运行期资产：上游 README 要求 builtin/ 目录位于 ols 二进制同级（get_builtin_path 用 /proc/self/exe 推断目录，回退 OLS_BUILTIN_FOLDER 与 /usr/share/ols/builtin），故随包安装到 bin/builtin/"
  - "bin/ols 的 DT_NEEDED 仅 libc.so（RUNPATH=$ORIGIN），运行期无第三方动态库依赖；仍按 OHOS XPM 要求以 binary-sign-tool 自签"
  - "上游测试套件 tests/ 共 860 项 @(test)（12 个 *_test.odin），是本仓自带的 LSP 端到端测试，无网络/外部资产依赖，在 OHOS 目标平台真实全量通过（860/860）"
