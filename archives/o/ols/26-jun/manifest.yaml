# ols 26-jun — 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

software: ols
version: "26-jun"

# 编译状态: built（等待真机 hmbs 预检确认）
status: built

build_date: "2026-09-13"

# 构建系统
build_system: odin-build

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/DanielGavin/ols/archive/refs/tags/dev-2026-08.tar.gz"
  sha256: "e8d368f35b6833efa7e840753881d01f76607f3c0872c614e536f2b7e939f800"
  tar_format: tar.gz

dependencies: []

patches_applied: []

# ============================================================
# 构建配置
# ============================================================

build:
  system: odin-build
  configure_options: []
  dependencies: []
  cc: clang (/data/service/hnp/bin/clang on OHOS)
  cxx: clang++
  custom_command: |
    odin build src/ -collection:src=src -out:ols -no-bounds-check -o:speed -define:VERSION=26-jun
    odin build tools/odinfmt/main.odin -file -collection:src=src -out:odinfmt -no-bounds-check -o:speed
    cd tests && odin test ../tests -collection:src=../src -define:ODIN_TEST_THREADS=1

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Odin 语言项目使用 `odin build src/` 编译；需内嵌 Odin 编译器作为构建工具"
  - "Odin 静态链接二进制（aarch64 ELF）可运行于 OHOS，无需外部 libc"
  - "ols dev-2026-08 需匹配 Odin dev-2026-08 编译；Odin dev-2026-09 移除了 Inline_Asm_Expr 导致编译失败"
  - "上游测试套件 893 个用例，使用 Odin @(test) 装饰器 + `odin test` 命令运行"
  - "OHOS 设备上需 LLVM signing tools (binary-sign-tool) 对 ELF 可执行文件签名"
