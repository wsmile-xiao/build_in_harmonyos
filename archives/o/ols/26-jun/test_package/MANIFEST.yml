package: ols/26-jun
homepage: https://github.com/DanielGavin/ols
upstream_check_command: odin test ../tests -collection:src=../src
upstream_test_in_build: true
upstream_test_command: odin test ../tests -collection:src=../src -define:ODIN_TEST_THREADS=1
  -define:ODIN_TEST_TRACK_MEMORY=false
upstream_tests:
- file: tests/hover_test.odin
  source: ols-dev-2026-08/tests/hover_test.odin
  description: hover 功能测试（384 个测试用例）
  command: odin test ../tests -collection:src=../src -define:ODIN_TEST_THREADS=1 -define:ODIN_TEST_TRACK_MEMORY=false
- file: tests/completions_test.odin
  source: ols-dev-2026-08/tests/completions_test.odin
  description: 自动补全功能测试（255 个测试用例）
  command: odin test ../tests -collection:src=../src
- file: tools/odinfmt/tests/
  source: ols-dev-2026-08/tools/odinfmt/tests
  description: odinfmt 格式化快照测试
  command: odin run tests.odin -file -collection:src=../../src
test_package_tests:
- file: test_package/test_ols_lsp.sh
  description: 'LSP JSON-RPC 握手测试：构造 initialize/shutdown/exit 序列，写入文件，通过 shell
    脚本实参传给 ols，断言响应含 Content-Length 帧及 "result" 字段（R34 实质调用被测包 LSP API）'
  command: 'sh test_ols_lsp.sh <stdin.jsonrpc> <builtin_dir> <bin/ols>'
upstream_test_count: 921
assertion_count: 922
upstream_test_skipped_reasons: 全部 921 个上游测试（893 ols @(test) + 28 odinfmt 快照）已在 build()
  中经 odin test 完整执行并通过，无跳过。
