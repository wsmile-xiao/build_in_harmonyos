software: ols
version: "dev_2026_05"
build_system: odin build（上游 ci.sh 等价命令，配方内直接构造）
status: built
source:
  url: "https://codeload.github.com/DanielGavin/ols/tar.gz/refs/tags/dev-2026-05"
  sha256: "387b9f47304abab5c7cbe12f041c85de892ddc94a54e03f2789ff6ac9fc16386"
knowledge_gained:
  - "ols 是纯 Odin 语言实现的 LSP 服务器（package main，src/main.odin）；上游构建 100% 由 odin 编译器驱动（build.sh 本地 / ci.sh CI），无 CMake/Make/Autotools，无平台分支脚本可绕"
  - "上游 CI 构建命令：odin build src/ -show-timings -collection:src=src -out:ols -no-bounds-check -o:speed -define:VERSION=$OLS_VERSION（ci.sh）；本地 build.sh 额外带 -microarch:native。本配方采用 ci.sh 形态（CI 与本地一致、无 host CPU 特性耦合）"
  - "登记版本 dev_2026_05 对应上游 tag dev-2026-05（平台任务版本字段用下划线，tag 用连字符）；VERSION 经 -define:VERSION 注入，上游默认为 nightly-<UTC日期>-<短sha>（非 git 树构建不可复现），本适配固定为 dev_2026_05，使 ols version 可断言、构建可复现"
  - "取源码 URL 用官方归档端点 codeload.github.com：真机直连 github.com/<o>/<r>/archive/... 实测 ConnectTimeout（curl 45s），而 codeload 同一 tag 可达且**字节同一**（均 1305906 B、sha256 387b9f47…）。codeload 的 URL 末段是 tag 名、无 .tar.gz 后缀，conan 的 get() 会按扩展名误判成 zip 报 BadZipFile，故 source() 必须显式传 filename=。本仓先例：archives/a/azure-core-cpp/1.16.4、archives/c/cdda2wav/2024-03-21、archives/j/jose/14"
  - "构建工具链经 conan tool_requires 引入 odin/dev-2026-08（Odin 编译器）与 llvm/22.1.0；odin 属 build context，conan 聚合其运行环境进 conanbuild（PATH 含 odin bin/；LD_LIBRARY_PATH 含 llvm lib/），ODIN_ROOT 需显式指向 odin 包根"
  - "跨 release 用较新的 Odin 编较旧的 ols 源码树会撞 builtin 枚举漂移：odin/dev-2026-08 的 builtin `Odin_OS_Type` 已无 `Haiku`，而 ols dev-2026-05 仍引用 `.Haiku` → `Error: Undeclared name 'Haiku' for type 'Odin_OS_Type'`（3 处）。处置=逐字 backport 上游自己在 dev-2026-06 里做的同一删除（纯删 6 行、0 新增、不碰测试）。判据：`grep -c Haiku` 在 dev-2026-05 与 dev-2026-06 的同名文件里分别非 0 / 为 0"
  - "OHOS libc（SDK sysroot 与设备端）未导出线程取消符号 pthread_cancel / pthread_setcancelstate / pthread_setcanceltype / pthread_testcancel；ols 经 core:thread（main.odin thread.create_and_start_with_data）创建请求线程，直接编译即 ld.lld: undefined symbol: pthread_setcancelstate（ols.o 内 thread_unix.odin）。以无害空桩 + -extra-linker-flags 注入链接解决，0 补丁、不改上游源码；odinfmt 快照测试二进制同样需要该垫片"
  - "上游 ci.sh 的 CI 分支是**两段**测试：先 `cd tests && odin test ../tests -collection:src=../src -o:speed -define:ODIN_TEST_THREADS=1`（ols 自身的 LSP 端到端套件，本配方执行它），再 `tools/odinfmt/tests.sh`（golden 快照，被测对象是 odinfmt 这个独立产物）。本包只交付 bin/ols，odinfmt 不构建不安装，故第 (2) 段不在验证面内——本仓两条已合入的 ols 配方（26-jun、dev-2026-06）口径相同"
  - "odinfmt 第 (2) 段在真机试跑过的结果要记下来，免得下个会话重查：21 项里 20 项进入比对、19 项 SUCCESS，`tests/random/demo.odin` 与其 golden 不符，随后 1 项未执行——因为上游 harness 用 `snapshot_file(match) or_return`，一个语料失败会让整个目录的循环提前 return（递归子目录时更是忽略返回值，所以退出码也不可信，判定必须看日志差异行）。定位：该 golden 在 dev-2026-05 与 dev-2026-06 之间逐字相同，而格式化器本体 `src/odin/printer/{printer,visit}.odin` 两版有差异 → 上游该 pin 的 fixture/实现偏斜，与 OHOS 平台无关"
  - "odinfmt 快照 harness（tools/odinfmt/snapshot/snapshot.odin）对每个 *.odin 语料打印 `Testing snapshot <path>` 且**不带换行**，故统计执行数必须按出现次数（grep -o | wc -l）而不是按行数；差异时打印 `Formatted file was different from snapshot file` 并写出 `<golden>_failed`"
  - "该 harness 递归子目录时忽略子目录返回值（snapshot_directory(match) 未 or_return），故子目录内的失败不一定反映在退出码上；判定必须以日志中的差异行数为准，不能只看 rc"
  - "ols 的 LSP 帧格式为标准 Content-Length + CRLF（src/server/requests.odin read_and_parse_header 强制 message[len-2] == '\\r'），可用进程管道直接驱动"
  - "上游 initialize 响应只有 result.capabilities，无 serverInfo（types.odin: ResponseInitializeParams :: struct { capabilities }）；能力断言应落在 capabilities 字段"
  - "无头环境下的上游行为（不作为本适配缺陷，如实记录）：stdin 提前 EOF 时 reader 线程直接 return，主循环 consume_requests 仍同步 sema_wait，进程永久阻塞 —— 无头测试必须显式走 initialize→…→shutdown→exit 完整生命周期，不能靠关闭 stdin 收尾"
  - "运行期资产：上游 README 要求 builtin/ 目录位于 ols 二进制同级（get_builtin_path 用 /proc/self/exe 推断目录，回退 OLS_BUILTIN_FOLDER 与 /usr/share/ols/builtin），故随包安装到 bin/builtin/"
  - "bin/ols 的 DT_NEEDED 仅 libc.so（RUNPATH=$ORIGIN），运行期无第三方动态库依赖；仍按 OHOS XPM 要求以 binary-sign-tool 自签"
  - "上游测试必须在 build() 内经 self.run（conanbuild 环境）执行，不能换成 subprocess + 自建 env：真机实测后者链接阶段报 `clang: error: unable to execute command: posix_spawn failed: No such file or directory` + `clang: error: linker command failed with exit code 1`，因为 conan 的 VirtualBuildEnv 才会把 llvm/22.1.0 包的 bin/（内含 clang 要 spawn 的 ld.lld）拼进 PATH；自建 env 只拼了 llvm 的 lib/，于是 odin 能跑、链接不了。同理 profile [env] 里声明的 AR/LD 也只有走 conan 的 runner 才生效"
  - "签名与 objcopy 工具必须按「PATH 优先 → /data/service/hnp/bin 回退」解析（同 abx/0.1）：/data/service/hnp/bin 只在 CI worker 上存在，真机连不上该路径（硬编码即 rc=127 `/bin/sh: /data/service/hnp/bin/binary-sign-tool: inaccessible or not found`）；真机 SDK 亦无 binary-sign-tool，此时告警跳过，实测未自签产物在本机可正常 exec"
