sources:
  # 上游 tag dev-2026-05（任务登记版本写作 dev_2026_05）。
  # 真机直连 https://github.com/DanielGavin/ols/archive/... 实测 ConnectTimeout
  # （2026-09-20 本机，curl 45s/65s 均失败，连 releases/download 也连不上），而官方归档
  # 端点 codeload 可达且**内容字节同一**：两条 URL 均为 1305906 B、sha256
  # 387b9f47304abab5c7cbe12f041c85de892ddc94a54e03f2789ff6ac9fc16386。二者都是 GitHub
  # 官方域，不经任何第三方加速镜像。
  # codeload 的 URL 末段是 tag 名、没有 .tar.gz 后缀，conan 的 get() 会按扩展名误判成
  # zip 报 BadZipFile，故 source() 显式传 filename=（本仓先例：azure-core-cpp/1.16.4、
  # cdda2wav/2024-03-21、jose/14）。
  url: "https://codeload.github.com/DanielGavin/ols/tar.gz/refs/tags/dev-2026-05"
  sha256: "387b9f47304abab5c7cbe12f041c85de892ddc94a54e03f2789ff6ac9fc16386"

patches:
  - patch_file: "patches/0001-backport-upstream-haiku-removal.patch"
    patch_description: >
      Backport upstream's own removal of the Odin_OS_Type `Haiku` entries, so that
      the dev-2026-05 source tree compiles against the Odin compiler that this
      repository publishes for OHOS (odin/dev-2026-08, whose builtin enum no longer
      has Haiku).  Without it the build dies with
      `src/server/build.odin(73:20) Error: Undeclared name 'Haiku' for type
      'Odin_OS_Type'` (3 occurrences, all the same name).
      The patch is a pure deletion of 6 lines and is byte-for-byte the same
      deletion upstream made in the very next release: dev-2026-05 still contains
      `Haiku` in src/server/build.odin (4 lines), src/server/when.odin (1 line) and
      builtin/builtin.odin (1 line), while the dev-2026-06 tarball has 0 occurrences
      of `Haiku` in all three files.  No logic, no API, no expected value and no
      test case is touched; the Haiku OS simply becomes unnameable in ols.json build
      contexts, exactly as upstream decided.
    patch_type: "upstream-fix"
