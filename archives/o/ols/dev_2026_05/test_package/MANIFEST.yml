package: ols/dev_2026_05
homepage: https://github.com/DanielGavin/ols

# 上游测试命令（上游 ci.sh 的 CI 分支第 (1) 段，开发者在源码树根执行）
#   ci.sh CI  →  (1) cd tests && odin test ../tests -collection:src=../src -o:speed \
#                     -define:ODIN_TEST_THREADS=1
#                (2) tools/odinfmt/tests.sh   ← 被测对象是 odinfmt 这个独立可执行产物，
#                     本包不构建也不安装（package() 只装 bin/ols + bin/builtin），
#                     故不属于本包的交付/验证面。详见下方 odinfmt_suite_scope。
upstream_check_command: "ci.sh CI"
upstream_test_in_build: true
upstream_test_command: "cd tests && odin test ../tests -collection:src=../src -o:speed -define:ODIN_TEST_THREADS=1 -extra-linker-flags:<build>/ohos_libc_compat.o（构建期真实执行，非致命记录）"

# 上游测试套件统计（dev-2026-05 tag 源码树实测，2026-09-21 真机）
#   tests/ 下 15 个 .odin 文件声明 804 项 @(test)（另有 2 处同形文本不构成测试：
#   completions_test.odin:875 与 signatures_test.odin:782，均位于 /* */ 注释块内）。
#   该套件是 ols 自身的 LSP 端到端测试（hover/completion/definition/references/
#   signature/documentSymbol/rename/inlay hints/actions/semantic tokens 等），
#   无网络与外部资产依赖，本机（= 目标平台 aarch64 HarmonyOS PC）可完整真实执行。
upstream_total_tests: 804
upstream_test_assets_required: false
upstream_test_count_command: "grep -rn '@(test' tests | wc -l  →  806，减去 /* */ 注释块内 2 处（completions_test.odin:875、signatures_test.odin:782）→ 804"

upstream_subset_result:
  platform: "aarch64 HarmonyOS PC（本机 = OHOS 目标平台）"
  attempts: 804
  passed: 804
  failed: 0
  skipped: 0
  note: >-
    全量真跑，无跳过、无豁免、未修改任何用例：runner 原文
    `Finished 804 tests in 1.616987187s. All tests were successful.`，
    其计数与静态声明数（806 处 grep 命中减 2 处注释块内同形文本 = 804）一致。
    测试期仅以 -extra-linker-flags 注入 OHOS libc 线程取消符号空桩（平台链接垫片，
    见 conanfile.py 说明）；唯一的源码补丁是 0001-backport-upstream-haiku-removal.patch，
    其目标文件清单为 src/server/build.odin、src/server/when.odin、builtin/builtin.odin，
    不含 tests/ 下任何文件（判据 `grep '^+++ ' patches/0001-*.patch`）。

# ci.sh 第 (2) 段的存在性与本适配的处置（如实记录，避免下个会话重查）
odinfmt_suite_scope:
  location: "tools/odinfmt/tests.sh → odin run tests.odin -file -collection:src=../../src -out:tests.exe"
  cases: 21
  shipped_by_this_package: false
  reason: >-
    该套件用 golden 快照校验 odinfmt（格式化工具）的输出。本包只交付 bin/ols
    （见 package() 与 archives/o/ols/commands.json 的 binary 声明），odinfmt 既不构建
    也不安装，因此不在本包的验证面内；本仓两条已合入的 ols 配方（ols/26-jun、
    ols/dev-2026-06）同样只执行 ci.sh 第 (1) 段。
  observation_on_device: >-
    本适配曾在真机把该段也实跑过一轮（同编译器、同设备）：20 项进入比对，19 项
    `- SUCCESS`，`tests/random/demo.odin` 与其 golden 不符，其后 1 项
    （tests/random/document.odin）因上游 harness 的 snapshot_file(...) or_return 在
    失败处直接 return 而未执行。定位：该 revision 的 golden 与 dev-2026-06 的
    逐字相同（`diff` 无输出），而格式化器本体
    `src/odin/printer/{printer,visit}.odin` 在两版之间被上游改动 → 属上游该 pin 的
    fixture/实现偏斜，与 HarmonyOS 平台无关，也与本适配的补丁无关（补丁不触碰
    src/odin/printer 与 tools/odinfmt）。

upstream_tests: []

# test_package 中自带的测试（消费者视角，6 项；由 conanfile.py 的 test() 调用）
test_package_tests:
  - file: run_tests.sh
    description: "测试驱动（6 项检查由此脚本执行，无头 LSP 会话）"
    command: "bash run_tests.sh <ols_bin> <pkg_dir> <work_dir>"
  - file: lsp/init.json
    description: "纯 IO 契约：bin/ols version 输出 'ols version dev_2026_05' 且 rc=0（服务端启动前的退出路径）"
    command: "bin/ols version | grep -F 'ols version dev_2026_05'"
  - file: lsp/init.json
    description: "运行期资产：bin/builtin/{builtin.odin,intrinsics.odin} 与 bin/ols 同级（上游 README 要求）"
    command: "test -f <pkg>/bin/builtin/builtin.odin"
  - file: lsp/init.json
    description: "initialize 握手：id 回显 + result.capabilities 及 8 项能力字段（hover/definition/typeDefinition/documentSymbol/formatting/references/workspaceSymbol/rename/completion.triggerCharacters）"
    command: "printf 'Content-Length: %d\\r\\n\\r\\n%s' ... | bin/ols"
  - file: lsp/did_open.json
    description: "功能验证：didOpen + documentSymbol 返回函数符号 add(line 4)/main(line 8)，kind=12(SymbolKind.Function)"
    command: "同上会话内 textDocument/documentSymbol"
  - file: lsp/shutdown.json
    description: "优雅退出：shutdown 返回 {\"id\": 2, \"result\": null}，exit 通知后进程 rc=0（无超时/崩溃）"
    command: "同上会话内 shutdown + exit"

assertion_count: 6
