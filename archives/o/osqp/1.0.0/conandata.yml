# conandata.yml — osqp 1.0.0
#
# 两个 sources 条目，均为官方 GitHub release/tag 归档（R39 官方源）：
#   osqp  : 目标库本体源码（tag v1.0.0）
#   qdldl : 上游 CMake FetchContent 在配置期联网 git clone 的线性代数求解器
#           （algebra/_common/lin_sys/qdldl/qdldl.cmake 固定 GIT_TAG v0.1.8）。
#           这里用官方 tarball 固定内容与校验值，配合
#           -DFETCHCONTENT_SOURCE_DIR_QDLDL 实现离线、可复现构建。
#           注意：osqp 以 OBJECT library 内联编译 qdldl，并把 qdldl.c 打进
#           share/osqp/codegen_files/ 资源包，属源码级依赖，无法改用
#           qdldl 预编译二进制包（后者仅提供 libqdldl.a + 头文件）。
# 两个条目的 sha256 均已在本机对官方 URL 下载结果实测核验（见 notes.md）。
#
# 说明：CI 的 mirror fallback / pre-download 会在构建期临时改写 url
# （单值→镜像列表、或改成本地 file://），构建结束后必须还原为本文件的官方
# 单 URL 形态再提交（R39/PF7；历史上 conan-verify 的 E017 注入曾留下残留）。

sources:
  osqp:
    url: "https://github.com/osqp/osqp/archive/refs/tags/v1.0.0.tar.gz"
    sha256: "dd6a1c2e7e921485697d5e7cdeeb043c712526c395b3700601f51d472a7d8e48"
  qdldl:
    url: "https://github.com/osqp/qdldl/archive/refs/tags/v0.1.8.tar.gz"
    sha256: "ecf113fd6ad8714f16289eb4d5f4d8b27842b6775b978c39def5913f983f6daa"

patches:
  "1.0.0":
    - patch_file: "patches/0001-src-CMakeLists.txt.patch"
      patch_description: "中断监听源文件分支纳入 HarmonyOS/OHOS（修复 3 个 undefined symbol）"
      patch_type: "portability"
