# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 软件名
software: osqp

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/osqp/osqp/archive/refs/tags/v1.0.0.tar.gz"

  # 源码校验和
  sha256: "dd6a1c2e7e921485697d5e7cdeeb043c712526c395b3700601f51d472a7d8e48"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DFETCHCONTENT_SOURCE_DIR_QDLDL=<官方 qdldl v0.1.8 源码目录>（离线喂给上游 FetchContent）"
  - "-DOSQP_BUILD_UNITTESTS=ON（仅探索阶段实跑上游测试；配方构建为 OFF）"
  - "-DOSQP_BUILD_DEMO_EXE=OFF"
  - "-DOSQP_ALGEBRA_BACKEND=builtin"
  - "-DOSQP_PROFILER_ANNOTATIONS=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # conan requires：空（qdldl 以上游官方源码离线内联，非 conan 包依赖）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-src-CMakeLists.txt.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "osqp v1.0.0 用 CMake FetchContent 在配置期 git clone QDLDL v0.1.8；无需新增 BUILD_QDLDL 开关，直接 -DFETCHCONTENT_SOURCE_DIR_QDLDL=<本地官方源码> 即可离线可复现（少一个上游补丁）"  # knowledge_ref: E342
- "conan.tools.files.get(strip_root=True) 会剥掉 tarball 顶层目录，配合 FETCHCONTENT_SOURCE_DIR_* 时目标目录名必须自定（_offline_deps/qdldl），不能沿用 tarball 里的 qdldl-0.1.8"  # knowledge_ref: E606
- "osqp 以 $<TARGET_OBJECTS:qdldlobject> 内联 qdldl 且把 qdldl.c 打进 share/osqp/codegen_files/，故 qdldl 是源码级依赖；已发布的 qdldl 二进制包（只有 libqdldl.a+头）无法满足"  # knowledge_ref: E606
- "OHOS 上 CMAKE_SYSTEM_NAME=HarmonyOS，上游仅识别 Linux/Darwin/Windows 的中断源分支会导致 interrupt_unix.c 漏编，链接报 3 个 undefined symbol（osqp_start_interrupt_listener/osqp_is_interrupted/osqp_end_interrupt_listener）"  # knowledge_ref: E607
- "osqp 上游会随 install 一并安装 include/qdldl/* 与 lib/cmake/*；配方应裁掉以免与独立发布的 qdldl 包重复提供头文件（参考 CCI osqp 0.6.x 同样裁剪）"  # knowledge_ref: E342
- "osqp v1.0 公共 API 改名：osqp_GetVersion→osqp_version，osqp_update_lin_cost→osqp_update_data_vec(solver,q,l,u)；消费者测试须按新签名编写"  # knowledge_ref: E342
- "设备到 GitHub 的 conan 下载通道会瞬时超时（curl 同 URL 立即可下）；core.download:retry 属 core.* 不能在命令行注入，重试 conan create 即可，CI 由 build_and_test.sh pre-download 兜底"  # knowledge_ref: E017
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/osqp-1.0.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/osqp-1.0.0.work
  source_orig_hash: 0744d83c71dfecbc
  source_work_hash: 678f5518ae48424c
  generated_at: '2026-09-08T21:40:08'
  patches_count: 1

patch_classification:
  - file: 0001-src-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: 'pending'

# ---- 实测测试结果（R51：上游测试真实执行结果，逐用例见 test_package/MANIFEST.yml）----
test_total: 104
test_passed: 104
test_failed: 0
test_skipped: 0
