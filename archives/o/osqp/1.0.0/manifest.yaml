software: osqp
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-16"

# 构建系统类型
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/osqp/osqp/archive/refs/tags/v1.0.0.tar.gz"

  # 源码校验和
  sha256: "dd6a1c2e7e921485697d5e7cdeeb043c712526c395b3700601f51d472a7d8e48"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DOSQP_BUILD_DEMO_EXE=OFF"
    - "-DOSQP_BUILD_UNITTESTS=OFF"
    - "-DOSQP_CODEGEN=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-algebra-_common-lin_sys-qdldl-qdldl.cmake.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OSQP cmake FetchContent 需改为 SOURCE_DIR 指向本地路径（SSL受限环境）"
  - "OSQP 源码目录中 configure 是目录而非脚本，导致自动检测为 autotools"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/osqp-1.0.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/osqp-1.0.0.work
  source_orig_hash: 0744d83c71dfecbc
  source_work_hash: 1082dd79a3a2392f
  generated_at: '2026-06-16T12:27:11'
  patches_count: 1

patch_classification:
  - file: 0001-algebra-_common-lin_sys-qdldl-qdldl.cmake.patch
    type: auto
    platform_only: True
    guard: 'pending'
