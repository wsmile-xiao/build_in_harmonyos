# test_package/MANIFEST.yml — osqp/1.0.0
# 上游官方测试声明文件（R51：清点 → 实跑 → 如实回填）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点（官方源码 sha256 dd6a1c2e7e921485697d5e7cdeeb043c712526c395b3700601f51d472a7d8e48）：
#   tests/ 子目录 21 个，tests/**/CMakeLists.txt 24 个，add_test 注册 3 项，
#   TEST_CASE 宏 72 处（展开为 Catch2 用例后 38+28+38=104 项，见下）
#   测试数据由 tests/generate_tests_data.py（Python + numpy + scipy）在构建期生成
#
# 运行环境：OHOS aarch64 本机原生构建，clang 15.0.4，CMake 4.1.2，
#   Python 3.12.9 / numpy 2.5.2 / scipy 1.18.0
#   Catch2 v2.13.6 与 QDLDL v0.1.8 均以上游官方源码离线提供
#   （-DFETCHCONTENT_SOURCE_DIR_QDLDL / -DFETCHCONTENT_SOURCE_DIR_CATCH2）
#
# 实跑结果汇总（3 个测试程序 / 104 用例 / 1255 断言，全部通过）：
#   命令: ctest --test-dir build --output-on-failure   -> 100% tests passed, 0 failed out of 3
#   日志: reports/test-report.md 与适配工作区 logs/step4-*.log

package: osqp/1.0.0
homepage: "https://osqp.org/"

# 上游测试命令（ctest --test-dir build -N 实测注册 3 项）
upstream_check_command: "ctest --test-dir build --output-on-failure"

# conanfile.py build() 中是否集成上游测试：否。
# 原因（技术性的，非"没环境"）：tests/CMakeLists.txt:4-28 在**配置期**即要求
# Python + numpy + scipy，缺失直接 FATAL_ERROR；CI 干净执行机不保证有 scipy。
# 因此上游测试在适配阶段以 OSQP_BUILD_UNITTESTS=ON 独立构建并全量实跑，
# 结果如实登记于下方与 reports/test-report.md。
upstream_test_in_build: false
upstream_test_command: ""

