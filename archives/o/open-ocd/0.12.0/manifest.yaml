software: open-ocd
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.12.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.12.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/downloads/openocd-0.12.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-hmdfs-permission-and-harmonyos-support.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "HMDFS 文件系统 umask 077 导致临时目录权限问题，需修改为 umask 000"
- "config.guess 需添加 HarmonyOS 分支识别，并使用 echo+exit 0 格式输出"
- "config.sub 需在 maybe_os 和 kernel-os 白名单中添加 linux-ohos* 和 ohos*"
- "jimtcl 子项目使用 autosetup 构建系统，也需修改其 autosetup-config.guess"
- "源码函数原型问题：target_call_timer_callbacks() 需添加 (void) 参数声明"
- "禁用 -Werror 可快速完成编译（源码包含未使用变量警告）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
