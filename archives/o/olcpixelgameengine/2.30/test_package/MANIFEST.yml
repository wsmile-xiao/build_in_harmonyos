# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: olcpixelgameengine/2.30
homepage: https://github.com/OneLoneCoder/olcPixelGameEngine

# 上游为单头文件库，无构建系统、无 tests/ 目录、无 ctest/GTest/pytest 注册。
# examples/TEST_*.cpp（6 个）为需要窗口后端的样例程序，非独立测试用例，
# 全部列入 notes.md 上游测试台账，不计入独立上游用例（独立用例数 = 0）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立单元测试用例（无正式测试套件；examples 为样例程序）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者用例：OLC_PGE_HEADLESS 无头模式消费公开 API（Sprite 像素读写 / 无头 Construct / Pixel 颜色），编译链接运行"
    command: "./test_olcpixelgameengine"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
