software: odin
version: "dev-2026-08"
build_system: make (build_odin.sh 等价命令，配方内直接构造)
status: built
source:
  url: "https://github.com/odin-lang/Odin/archive/refs/tags/dev-2026-08.tar.gz"
  sha256: "52dd989d8fe0590c086c745c6ca90621525ac84aec57294358d055c4f09c0729"
knowledge_gained:
  - "Odin 编译器为 C++ unity build（main.cpp include 14 个 cpp + libtommath.cpp），依赖 LLVM C++ API，非自举式构建"
  - "制品仓 llvm/22.1.0 为 shared 聚合库（libLLVM-22.so），上游 build_odin.sh 的组件列表 --libs arm/x86/wasm/riscv 在此形态报 unknown component，需改用 core native + --libfiles"
  - "上游 build_odin.sh 的 uname -s 分支不含 HarmonyOS，需绕开脚本直接构造 Linux 分支等价命令"
  - "非 git 目录构建时 ODIN_VERSION_RAW 由 date 生成 dev-2026-09，需显式注入 dev-2026-08 对齐登记版本"
  - "odin 通过 ODIN_ROOT 环境变量或 exe 所在目录推断根，运行时库目录（base/core/shared/vendor）须随包安装"
  - "llvm/22.1.0 聚合库为 AArch64-only：X86/ARM/WebAssembly/RISCV 分支的 per-target 初始化声明缺失，需 patch 统一改用 LLVMInitializeAll* 系列"
  - "bin/odin 无 RUNPATH，DT_NEEDED=libLLVM.so.22.1；构建期冒烟与 test_package 必须用 conanrun 环境（注入 llvm lib/），用 conanbuild 会连锁报符号重定位失败（rc=127）"
  - "OHOS libc（SDK sysroot 与设备端）未导出线程取消符号（pthread_cancel/pthread_setcancelstate/pthread_setcanceltype/pthread_testcancel）；core:testing→core:thread 引用之，使 `odin test` 链接（ld.lld: undefined symbol: pthread_cancel）或加载（Error relocating ...: symbol not found）失败，需以无害空桩补齐测试运行环境"
  - "上游 tests/core 整包 `odin test tests/core` 经 normal.odin 的 @(init) 调 download_assets.py 联网拉取测试资产，本机与 CI 均无外网故不可用；改跑无外部资产依赖的核心子包（48 个）可在本机真实编译运行，实测累计 623 项 @(test) 全通过"
  - "`odin test <子包>` 的 ODIN_ROOT 必须指向含 tests/ 与 base/core 的源码树根：指向安装包根（无 tests/）会使依赖 tests/core/assets 的用例（如 text/i18n、encoding/hxa）误报 File_Error"
