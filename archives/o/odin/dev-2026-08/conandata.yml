sources:
  # 只写官方原始 URL：CI 的 build_and_test.sh 会自动改写为镜像 fallback 列表
  # （gh-proxy 等），手工追加镜像前缀会与自动注入重复并固化未纳白名单的第三方域名。
  url: "https://github.com/odin-lang/Odin/archive/refs/tags/dev-2026-08.tar.gz"
  sha256: "52dd989d8fe0590c086c745c6ca90621525ac84aec57294358d055c4f09c0729"
patches:
  - patch_file: "patches/0001-llvm-backend-all-target-init.patch"
    patch_description: "制品仓 llvm/22.1.0 为 AArch64-only 聚合库，per-target 初始化声明缺失，X86/WebAssembly/RISCV/ARM 分支改用 LLVMInitializeAll* 系列"
    patch_type: "portability"
    sha256: "c30f86e31791248b8a35ec70724c2c7942aa95a325a903138104e1cb4978bcf8"
