software: odinfmt
version: "dev-2026-06"
build_system: odin build（上游 ci.sh/odinfmt.sh 等价命令，配方内直接构造）
status: built
source:
  url: "https://github.com/DanielGavin/ols/archive/refs/tags/dev-2026-06.tar.gz"
  sha256: "f8055ff723994dc4debc02817c230d0173c43a23df4a9d6a7104fea69bfeeb79"
knowledge_gained:
  - "odinfmt 上游无独立仓库：源码位于 DanielGavin/ols 的 tools/odinfmt/，格式化核心在 ols 的 src/odin/format 与 src/odin/printer，故 source 取 ols 源码树"
  - "构建命令与上游 ci.sh / odinfmt.sh 完全一致（odin build tools/odinfmt/main.odin -file -collection:src=src -out:odinfmt -no-bounds-check -o:speed），本平台无需平台分支补丁、无需 LLVM 链接改动，0 补丁"
  - "构建工具链经 conan tool_requires 引入 odin 编译器（odin/dev-2026-08）与 llvm/22.1.0；odin 作为 build context 工具，其运行期环境由 conan 聚合进 conanbuild（VirtualBuildEnv）而非 conanrun，故配方用 conan 解析出的 package_folder 显式构造 ODIN_ROOT 与 LD_LIBRARY_PATH"
  - "odin 无 RUNPATH，DT_NEEDED=libLLVM.so.22.1：LD_LIBRARY_PATH 缺 llvm/22.1.0 的 lib/ 时报 Error loading shared library 并连锁符号重定位失败（rc=127）"
  - "odinfmt 产物 DT_NEEDED 仅 libc.so（RUNPATH=$ORIGIN），运行期无动态库依赖，消费者无需额外环境"
  - "odinfmt 无 --version/-help 开关（core:flags 未定义 help 字段）：--help 报 Unable to find any flag named `-help`；无参数调用输出 Usage 并 exit 1，构成可断言的 CLI 契约"
  - "odinfmt 输出确定性依赖显式 -config：未指定时 find_config_file_or_default 会向上逐级查找 odinfmt.json，可能命中源码树根配置；test_package 因此显式传 -config"
  - "上游 tools/odinfmt/tests.odin 是快照测试（遍历 tests/ 输入 .odin，格式化后与 .snapshots/ 逐字符比对），共 22 例，无网络与外部资产依赖，可在目标平台真实执行"
  - "tests/random/demo.odin 快照与 Odin dev-2026-08 工具链不一致：仅 10 处行注释尾随空白差异，本适配输出与上游 ols dev-2026-08 快照逐字节一致（cmp 通过），判定为陈旧快照而非平台适配缺陷"
  - "-w 写回模式对每个文件先重命名为 <path>_bk 再写入，成功后删除备份；写入失败会残留 _bk —— 可用作断言点"
