package: odinfmt/dev-2026-06
homepage: https://github.com/DanielGavin/ols

# 上游测试命令（上游 ci.sh 的 CI 分支，开发者在源码树根执行）
#   ci.sh CI  →  tools/odinfmt/tests.sh
#   即： cd tools/odinfmt && odin run tests.odin -file -collection:src=../../src -out:tests.exe
upstream_check_command: "tools/odinfmt/tests.sh"
upstream_test_in_build: true
upstream_test_command: "cd tools/odinfmt && odin run tests.odin -file -collection:src=../../src -out:<build>/odinfmt_tests（构建期真实执行，非致命记录）"

# 上游测试套件统计（dev-2026-06 tag 源码树实测，2026-09-18）
#   tools/odinfmt/tests.odin 为快照（golden file）测试：遍历 tests/ 下输入 .odin，
#   格式化后与 .snapshots/ 同名快照逐字符比对。tests/ 下共 22 个输入 .odin
#   （含 allman/convert_do/random/single_line_switch 四个带独立 odinfmt.json 的子目录）。
#   该套件无需网络与外部资产，本机（= 目标平台 aarch64 HarmonyOS PC）可直接真实执行。
upstream_total_tests: 22
upstream_test_assets_required: false

upstream_subset_result:
  platform: "aarch64 HarmonyOS PC（本机 = OHOS 目标平台）"
  attempts: 21
  passed: 20
  failed: 1
  skipped: 1
  note: >-
    tests/random/demo.odin 快照不一致：差异为 10 处行注释的尾随空白（上游
    dev-2026-06 快照保留，本适配输出剥离），无任何非空白字符差异。已实测本适配
    对 demo.odin 的输出与上游 ols dev-2026-08 的 .snapshots/demo.odin 逐字节一致
    （cmp 通过），说明该快照相对 Odin dev-2026-08 工具链已陈旧（ols 的 format/printer
    依赖 Odin 自带 core:odin/parser 与 core:odin/tokenizer，跨 Odin dev 版本存在
    行为差异）。tests/random/document.odin 因同目录 demo.odin 先失败被上游
    snapshot_directory 的 or_return 短路未执行，单独复跑通过，计入 21/22 通过。
    未修改上游任何测试用例与快照。

upstream_tests: []

# test_package 中自带的测试（消费者视角，5 项；由 conanfile.py 的 test() 调用）
test_package_tests:
  - file: run_tests.sh
    description: "测试驱动（5 项检查由此脚本执行）"
    command: "bash run_tests.sh <odinfmt_bin> <pkg_dir> <work_dir>"
  - file: conanfile.py
    description: "CLI 契约：无参数调用须输出 Usage 并返回非 0（stderr 含 'Missing path to format'）"
    command: "odinfmt ; test $? -ne 0"
  - file: sample.odin
    description: "文件模式：odinfmt -config:odinfmt.json sample.odin 的 stdout 与 expected.odin 逐字节一致"
    command: "odinfmt -config:odinfmt.json sample.odin | diff - expected.odin"
  - file: expected.odin
    description: "幂等性：对已格式化输出再格式化一次，结果逐字节不变"
    command: "odinfmt -config:odinfmt.json expected.odin | diff - expected.odin"
  - file: expected.odin
    description: "stdin 模式：odinfmt -stdin 的 stdout 与文件模式一致"
    command: "odinfmt -config:odinfmt.json -stdin < sample.odin | diff - expected.odin"
  - file: sample.odin
    description: "-w 写回模式：目标文件内容变为 expected.odin 内容，且不残留 *_bk 备份"
    command: "cp sample.odin t.odin && odinfmt -config:odinfmt.json -w t.odin && diff t.odin expected.odin"

assertion_count: 5
