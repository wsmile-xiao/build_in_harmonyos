# test_package/MANIFEST.yml — opensmtpd-table-socketmap 1.1.1-r0
# CI L0e requires this file to exist.

package: opensmtpd-table-socketmap/1.1.1-r0
homepage: "https://github.com/OpenSMTPD/table-socketmap"

# No upstream test suite in the tarball (autotools project, no `make check` target with tests)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Sends config|ready to table-socketmap via stdin, verifies register|ready handshake response"
    command: "bash test.sh"

# Single assertion: register|ready in output
assertion_count: 1
