# 软件级 manifest — openkermit
# 遵循 ARCHIVE-SPEC v2.0

software: openkermit
display: "OpenKermit (C-Kermit)"
description: "Kermit 网络/串口通信、文件传输与脚本工具（C 语言实现，含自有协议栈与脚本解释器）"
category: network
homepage: "https://www.openkermit.org/"
license: BSD-3-Clause
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游是单文件手写巨型 makefile（无 autoconf/CMake/Meson），缺省 CC=cc/CC2=cc 可被命令行覆盖，不需要 gcc symlink/shim"
    - "不要走 `make linux`：该目标做主机探测（grep /usr/include/*、ld -lXXX），交叉环境无意义；官方 musl 目标是直接调 `make xermit` 并显式传 CFLAGS"
    - "musl 缺 getusershell()/vhangup()：getusershell 用 -DNOGETUSERSHELL 关闭；vhangup 需补丁把 CK_VHANGUP 收进 #ifdef __GLIBC__"
    - "musl 的 FILE 不透明：-DNOARROWKEYS 避开 ckucmd.c 的 stdin->_cnt 窥探分支"
    - "无 curses 裁剪：直接调 xermit 时 CK_NCURSES 永不定义，产物 DT_NEEDED 仅 libc.so"
    - "C-Kermit >=10.0 的 --version 只输出 major.minor，版本断言必须用 \\v(fullversion)"
    - "上游 11.0.508 起才有自动化测试；仅 tests/test_scripting.py 的 4 个 .ksc 脚本用例不依赖 pty/网络/python，可在 OHOS 环境真跑"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "11.0.508":
    status: built
    build_date: "2026-09-18"
    source_url: "https://codeload.github.com/OpenKermit/ckermit/tar.gz/refs/tags/v11.0.508"
