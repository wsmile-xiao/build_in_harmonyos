# 版本级 manifest
# 文件位置: archives/o/openkermit/11.0.508/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "11.0.508"
software: "openkermit"
status: built
build_date: "2026-09-18"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 tag 归档（GitHub 发布用包，与官方 SHA256SUMS 资产对应）。
  # 不可用 .../archive/refs/tags/... 自动归档 URL：每次生成带时间戳，
  # 同一 tag 两次下载 hash 不同。
  url: "https://codeload.github.com/OpenKermit/ckermit/tar.gz/refs/tags/v11.0.508"
  sha256: "252f716bbac57d0a665a0c087f18abab095acc8369786cd08d1dde831ecd4747"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "make xermit CC=<conan-cc> CC2=<conan-cc> CFLAGS=<LINUXCFLAGS + NOCURSES/musl guards> LIBS=-lm SHELL=<bash> -j1"
  dependencies: []
  cc: clang

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-ckupty.c-libc-vhangup.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "codeload 风格 URL（末段是 tag 名、无扩展名）必须给 conandata sources 加 filename: *.tar.gz，否则 Conan get()/unzip() 退回 zip 解码器报 BadZipFile"
  - "上游真实仓库是 OpenKermit/ckermit（任务提示词的 kermitproject/ok 不存在）；11.0.508 tag 于 2026-08-10 发布"
  - "纯手写巨型 makefile（9858 行）：缺省 CC=cc / CC2=cc（makefile:961），linuxa 用 \"CC=$(CC)\" 转发，故直接调 xermit 无需 gcc shim（9.0.302 的 gcc 硬编码问题在 11.0.508 的 xermit 路径上不存在）"
  - "官方 linux+musl 目标即 '直接调 xermit + 显式 CFLAGS'（makefile:7336），本配方完全沿用该官方 pattern，避开 linux 目标的 /usr/include 与 ld -l* 主机探测"
  - "NOCURSES 裁剪：直接调 xermit 时 CK_NCURSES 永不定义（只有 linux/linuxc 探测路径才定义），产物 DT_NEEDED 仅 libc.so，零第三方动态库依赖"
  - "C-Kermit >=10.0 起 --version 只输出 major.minor（ckcmai.c:90 注释明示），版本断言必须用 \\v(fullversion) 或启动 herald 才能看到 edit 号（11.0.508）"
  - "musl 适配三项均由编译器宏完成，零源码补丁（NOGETUSERSHELL 关掉 GETUSERSHELL，NOARROWKEYS 避开 stdin->_cnt，CK_VHANGUP 仅 glibc 定义）"
  - "上游 11.0.508 首次提供自动化测试套件：pytest 32 文件 300 个 def test_（参数化后 1792 用例）+ libcheck 单元测试 8 程序 132 例 + 3 个 .ksc 脚本"
  - "测试依赖缺口可在制品仓补齐：libcheck 用制品仓 check/0.15.2（OHOS armv8 静态包），pytest 栈用 pip（pyftpdlib/pytest-timeout/pytest-xdist）；补齐后上游全套可真跑（2026-09-19 实测：pytest 1137 passed/645 skipped/1 failed，libcheck 111/120 断言通过）"
  - "libcheck 在 OHOS 需可写 TMPDIR：上游 tests/unit/test_zfnqfp.c 硬编码 /tmp（OHOS 只读）会致 mkdtemp 失败 6 例；/etc/hosts 若把 ::1 映射为 ip6-localhost 会致 test_net 3 例 + test_ipv6 1 例断言失败（均为测试对环境的硬编码假设，非适配缺陷）"
