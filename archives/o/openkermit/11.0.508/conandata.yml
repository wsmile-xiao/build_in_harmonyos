# conandata.yml — openkermit 11.0.508
# Official Open Kermit Project source archive from the v11.0.508 tag of
# https://github.com/OpenKermit/ckermit.
#
# sha256 双源核对（2026-09-12）：
#   1. 官方 release 资产 SHA256SUMS 公开值（ckermit-11.0.508.tar.gz）：
#      252f716bbac57d0a665a0c087f18abab095acc8369786cd08d1dde831ecd4747
#   2. 本地直连官方 codeload URL 计算值：完全一致（252f716b…）
#
# URL 说明：必须用 codeload.github.com 的 tag tarball（官方发布用包，
# 与 SHA256SUMS 对应）；GitHub 自动归档 URL（.../archive/refs/tags/...）
# 每次生成带时间戳，同一 tag 两次下载 hash 不同（99992beb… ≠
# 252f716b…），不可用。
#
# filename 说明：codeload URL 末段是 tag 名（…/tar.gz/refs/tags/v11.0.508），
# 不带扩展名，Conan get() 会推出去文件名 "v11.0.508"，unzip() 退回 zip
# 解码器 → BadZipFile。显式给 *.tar.gz 文件名，unzip() 才会选 tar.gz 解码器。

sources:
  url: "https://codeload.github.com/OpenKermit/ckermit/tar.gz/refs/tags/v11.0.508"
  filename: "ckermit-11.0.508.tar.gz"
  sha256: "252f716bbac57d0a665a0c087f18abab095acc8369786cd08d1dde831ecd4747"

patches:
  - patch_file: "patches/0001-ckupty.c-libc-vhangup.patch"
    patch_description: "HarmonyOS (musl): no vhangup(), only define CK_VHANGUP on glibc"
    patch_type: "portability"
