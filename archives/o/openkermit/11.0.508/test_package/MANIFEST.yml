# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: openkermit/11.0.508
homepage: "https://www.openkermit.org/"

# ---------------------------------------------------------------------------
# 上游源码审计（实测计数，非估算）
# ---------------------------------------------------------------------------
# 上游 11.0.508 首次引入完整自动化测试套件（9.0.302 完全没有），实测：
#   * tests/test_*.py           32 个 pytest 文件，300 个 `def test_` 用例
#                               （pytest 参数化后实际采集 1792 个执行用例）
#   * tests/unit/*.c            8 个 libcheck C 单元测试程序，132 个 tcase_add_test（运行时 120 断言）
#   * tests/scripts/*.ksc       3 个 kermit 脚本，由 tests/test_scripting.py 的 4 个用例驱动
# 2026-09-19 再修改：按官方口径补齐缺失测试依赖（制品仓 check/0.15.2 + pip pytest 栈）后真跑全套，
# 结果见下方 upstream_test_audit.conclusion。
upstream_tests_exist: true

upstream_test_audit:
  - source: "tests/test_*.py（32 个文件）"
    reason: "pytest 套件，实测 300 个 `def test_` 用例（pytest.ini: addopts=-n auto, timeout=120）。覆盖传输回环（pty/raw-socket/telnet）、FTP/HTTP、SSL、IPv6、ZMODEM、权限、脚本、unicode 等。"
  - source: "tests/README.txt"
    reason: "上游自述依赖：libssl-dev / python3-pyftpdlib / pytest-xdist / pytest-timeout / lrzsz / check（Debian 口径），并需 pty 与网络回环。"
  - source: "tests/unit/*.c（8 个文件）+ makefile `check: unit-test`（makefile:9845）"
    reason: "libcheck 单元测试，实测 132 个 tcase_add_test（fnsplit 19 / hasdotdot 10 / lib 8 / mpsafe 18 / net 55 / rq_confirm 6 / strings 10 / zfnqfp 6）；make check 用 `pkg-config --cflags --libs check` 或 `-lcheck_pic -lrt -lm -lsubunit` 链接。"
  - source: "tests/scripts/*.ksc + tests/test_scripting.py"
    reason: "3 个 kermit 脚本（test_basic/test_args/test_control），由 tests/test_scripting.py 的 4 个 pytest 用例以 `wermit <script> -Y` 方式驱动，断言脚本输出与退出码。"
  - conclusion: "上游 11.0.508 声明 432 个用例（pytest 参数化后 1792 个执行用例 + libcheck 132 个 tcase）。2026-09-19 再修改按官方口径补齐缺失测试依赖（制品仓 check/0.15.2 + pip pytest 栈）并真跑全套：pytest 1137 passed / 1 failed / 645 skipped / 9 xfailed，libcheck 111/120 断言通过 ⇒ 合计执行 1258、通过 1248（99.2%）。跳过 645 例（对端参考实现缺失 452 / 未启用 SSL 128 / 无 lrzsz 49 / 未启用 VSOCK 15 / IPv6 网卡 1）与失败 10 例（测试硬编码 /tmp 只读 6 + /etc/hosts 的 ::1→ip6-localhost 4）逐类归因见 PR 正文与 learninglog/20260912openkermit-11.0.508/remod-20260919/。"

# 上游测试命令（2026-09-19 再修改：依赖已补齐并真跑）
upstream_check_command: "make check CHECK_LIBS_CMD='echo -I<check_pkg>/include <check_pkg>/lib/libcheck.a -pthread -lm'（制品仓 check/0.15.2；实测 111/120 断言通过，9 失败为环境性）"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests/ -n4 --basetemp=<writable> -rs（需 pytest/pyftpdlib/pytest-timeout/pytest-xdist，pip 可得；实测 1137 passed / 645 skipped / 1 failed / 9 xfailed）"

# 真正在 OHOS 环境执行过的上游测试（4 个 pytest 用例，1:1 复刻）
upstream_tests:
  - file: "scripts/test_basic.ksc"
    origin: "tests/scripts/test_basic.ksc (upstream v11.0.508, 逐字节一致 sha256 e4e9847e1e78bba1f9d5122f01734364ca128422972f5fd80b04ce929482a69a)"
    upstream_test: "tests/test_scripting.py::test_script_basic"
    description: "宏定义 / 单字符变量 / 点号赋值三条路径的取值与回显"
  - file: "scripts/test_args.ksc"
    origin: "tests/scripts/test_args.ksc (upstream v11.0.508, 逐字节一致 sha256 6297e2f899377deace70fccb444f3ce0b2475fc279fbb3546fa763ff52bf10b8)"
    upstream_test: "tests/test_scripting.py::test_script_args_success / test_script_args_missing"
    description: "位置参数映射（有参 rc=0、缺参非零退出）"
  - file: "scripts/test_control.ksc"
    origin: "tests/scripts/test_control.ksc (upstream v11.0.508, 逐字节一致 sha256 864de6e1a857cd3a87cda498d17f037f53b366046e3a428e4f34b64390e7d812)"
    upstream_test: "tests/test_scripting.py::test_script_control"
    description: "条件（SUCCESS/FAILURE/EXIST/比较）/ FOR-WHILE-GOTO 循环边界与跳转"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_kermit.sh
    description: "真实执行打包的 kermit 二进制：CLI 版本契约（--version=major.minor、\\v(fullversion)=11.0.508）+ 上游 3 个 .ksc 脚本用例（1:1 复刻 tests/test_scripting.py 断言）"
    command: "bash test_kermit.sh"

# 测试断言总数（实测：test_kermit.sh 的 ok/no 调用数，conan create r2 实测 37/37）
assertion_count: 37
