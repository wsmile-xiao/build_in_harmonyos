# 版本级 manifest — openddl-parser 0.5.1
# 文件位置: archives/o/openddl-parser/0.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.5.1"

# 软件名
software: "openddl-parser"

# 编译状态
# published | built | failed | archived
# （O5: 未合并/未确认 release upload 前一律 built）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档）
  url: "https://github.com/kimkulling/openddl-parser/archive/refs/tags/v0.5.1.tar.gz"

  # 源码校验和（与 CCI conandata 逐字一致）
  sha256: "511146377636f56a8a3bd6daace5ac2ed9672f4be28fc2c90597f4e88e069ffc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（conanfile.py generate() 注入的 CMake 变量）
  configure_options:
    - "-DDDL_STATIC_LIBRARY=ON"
    - "-DDDL_BUILD_SHARED_LIBS=OFF"
    - "-DDDL_BUILD_TESTS=ON"
    - "-DDDL_BUILD_PARSER_DEMO=OFF"

  # 编译依赖列表（格式: name/version）
  # 上游 0 运行时依赖（W0 实测 preflight_check.sh: 无依赖需要检查）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本版本零补丁：平台无关、上游 CMake 原样可构建）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（§3.8: 全程未踩到 engine 未命中的新坑 ⇒ 零草稿为正常终态）
knowledge_gained: []
