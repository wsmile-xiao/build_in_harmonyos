# test_package/MANIFEST.yml — openddl-parser 0.5.1 上游测试声明
# CI 脚本 (ci/conan/build_and_test.sh L0e/L1) 强制要求此文件存在
# 详见 docs/TEST_QUALITY_SPEC.md §3 / §4
#
# 统计口径（四口径不混用，见 AGENTS §3.5）:
#   1) 源码宏数        = test/*.cpp 中 TEST/TEST_F 注册宏        = 125
#   2) 框架注册/实跑数 = gtest 运行时报告 (10 test cases)        = 125
#   3) 断言数          = test/*.cpp 中 EXPECT_*/ASSERT_* 宏      = 423
#   4) 消费者断言数    = test_package/consumer.cpp 的 check() 条目 = 9（不进上游分母）

package: openddl-parser/0.5.1
homepage: "https://github.com/kimkulling/openddl-parser"

# 上游测试入口（上游 CMake 无 ctest 注册，直接运行 gtest 可执行文件）
upstream_check_command: "bin/openddlparser_unittest"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "bin/openddlparser_unittest"

# 上游实际运行的测试（按源文件分组；每组行值 = 该文件 TEST/TEST_F 宏数）
upstream_tests:
  - file: test/DDLNodeTest.cpp
    source: openddl-parser-0.5.1/test/DDLNodeTest.cpp
    description: "DDLNode 单元测试（12 个 TEST/TEST_F）"
    command: "./bin/openddlparser_unittest --gtest_filter=DDLNodeTest.*"
  - file: test/OpenDDLCommonTest.cpp
    source: openddl-parser-0.5.1/test/OpenDDLCommonTest.cpp
    description: "公共组件（Name/Text/Property/Value 解析辅助）单元测试（9 个）"
    command: "./bin/openddlparser_unittest --gtest_filter=OpenDDLCommonTest.*"
  - file: test/OpenDDLDefectsTest.cpp
    source: openddl-parser-0.5.1/test/OpenDDLDefectsTest.cpp
    description: "上游 issue 回归测试（10 个）"
    command: "./bin/openddlparser_unittest --gtest_filter=OpenDDLDefectsTest.*"
  - file: test/OpenDDLExportTest.cpp
    source: openddl-parser-0.5.1/test/OpenDDLExportTest.cpp
    description: "导出（exportContext）单元测试（10 个）"
    command: "./bin/openddlparser_unittest --gtest_filter=OpenDDLExportTest.*"
  - file: test/OpenDDLIntegrationTest.cpp
    source: openddl-parser-0.5.1/test/OpenDDLIntegrationTest.cpp
    description: "集成解析测试（5 个）"
    command: "./bin/openddlparser_unittest --gtest_filter=OpenDDLIntegrationTest.*"
  - file: test/OpenDDLParserTest.cpp
    source: openddl-parser-0.5.1/test/OpenDDLParserTest.cpp
    description: "解析器核心单元测试（36 个）"
    command: "./bin/openddlparser_unittest --gtest_filter=OpenDDLParserTest.*"
  - file: test/OpenDDLParserUtilsTest.cpp
    source: openddl-parser-0.5.1/test/OpenDDLParserUtilsTest.cpp
    description: "解析器工具函数单元测试（18 个）"
    command: "./bin/openddlparser_unittest --gtest_filter=OpenDDLParserUtilsTest.*"
  - file: test/OpenDDLStreamTest.cpp
    source: openddl-parser-0.5.1/test/OpenDDLStreamTest.cpp
    description: "流（DDLStream）单元测试（2 个）"
    command: "./bin/openddlparser_unittest --gtest_filter=OpenDDLStreamTest.*"
  - file: test/OssFuzzTest.cpp
    source: openddl-parser-0.5.1/test/OssFuzzTest.cpp
    description: "OSS-Fuzz 语料回归测试（3 个，语料在 test/TestData/）"
    command: "./bin/openddlparser_unittest --gtest_filter=OssFuzzTest.*"
  - file: test/ValueTest.cpp
    source: openddl-parser-0.5.1/test/ValueTest.cpp
    description: "Value 单元测试（20 个）"
    command: "./bin/openddlparser_unittest --gtest_filter=ValueTest.*"

# test_package 中自带的测试（消费者视角验证，计入「鸿蒙特有测试」行，不进上游分母）
test_package_tests:
  - file: consumer.cpp
    description: "消费者测试：经 conan 导出目标链接并运行——版本接口、合法 OpenDDL 解析与根节点树结构、垃圾输入拒绝（9 条 check 断言）"
    command: "./test_openddlparser"

# ── 计数（同一统计单位；上游/适配后两表同口径）──
upstream_test_case_count: 125
upstream_test_case_count_unit: "TEST/TEST_F 注册宏（源码口径）"
upstream_test_count_command: 'grep -c -E "^\s*(TEST|TEST_F)[[:space:]]*\(" test/*.cpp   # 合计 125'
upstream_runner_registered_case_count: 125
upstream_runner_registered_case_count_unit: "gtest 运行时注册并实跑（10 个 test case）"
upstream_test_passed_count: 125
upstream_test_failed_count: 0
upstream_test_skipped_count: 0
upstream_test_not_run_count: 0
upstream_test_total_count: 125
upstream_assertion_count: 423
upstream_assertion_count_unit: "test/*.cpp 中 EXPECT_*/ASSERT_* 宏（断言口径，不与用例数混用）"
test_package_case_count: 9
test_package_case_count_unit: "test_package/consumer.cpp 的 check() 断言条目（鸿蒙特有测试行）"
test_package_passed_count: 9
test_package_failed_count: 0
test_package_not_run_count: 0

# 测试断言总数（>0 是提交前 checklist 项；= 上游 423 + 消费者 9）
assertion_count: 432
