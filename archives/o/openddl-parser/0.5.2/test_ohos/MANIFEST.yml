# test_ohos/MANIFEST.yml — openddl-parser 0.5.2 HarmonyOS PC 专项验证

package: openddl-parser/0.5.2
platform: HarmonyOS PC (aarch64, musl)

# 专项验证项：
#   T1  aarch64 ELF 验证（测试可执行文件为 ELF64 AArch64）
#   T2  musl libc 动态链接（无 glibc / 无 ld-linux）
#   T3  无宿主绝对路径泄漏（strings 扫描静态库内宿主路径）
#   T4  真实解析验证（OpenDDL 文本 parse -> getRoot 遍历，链最终静态库）
# 注：本包为静态库（无最终签名可执行），不适用 OHOS 可执行签名段（.codesign）检查

checks:
  - id: T1
    name: aarch64-elf
    description: 消费者可执行文件为 ELF64 AArch64
  - id: T2
    name: musl-libc
    description: 动态链接 musl libc，无 glibc/ld-linux 依赖
  - id: T3
    name: no-host-path-leak
    description: 无 /storage/、/home/ 等宿主绝对路径泄漏
  - id: T4
    name: real-parse
    description: 公开 API 真实解析验证（Metric/GeometryNode 统计）

run_command: "python3 run_ohos_test.py <conan_package_folder>"
