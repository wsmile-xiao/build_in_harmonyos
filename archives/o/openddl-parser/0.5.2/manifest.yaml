# 版本级 manifest — openddl-parser 0.5.2

version: "0.5.2"
software: openddl-parser

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag，R39）
  url: "https://github.com/kimkulling/openddl-parser/archive/refs/tags/v0.5.2.tar.gz"

  # 源码校验和（实测 sha256sum）
  sha256: "8058caacdc989a010c2ad3ab62df99f9f3034b4981649c5fb832efa6fbf10c36"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version，本库无第三方依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无，源码零修改）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "openddl-parser 官方 v0.5.2 tag 源码内嵌 Version 字符串仍为 0.4.0（上游未同步版本号），配方版本以官方 tag 为准，getVersion() 返回 0.4.0 属上游事实"
- "上游 CMake 工程将全部 gtest 用户测试源编译进单一 openddlparser_unittest 可执行，源码声明 125 个 TEST 用例"
