# test_package/MANIFEST.yml — openddl-parser 0.5.2
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）

package: openddl-parser/0.5.2
homepage: "https://github.com/kimkulling/openddl-parser"

# 上游测试命令（CMake 工程：test 目标为 openddlparser_unittest）
# 枚举证据：上游源码 test/ 目录下 10 个独立 gtest 用户测试源文件，
# CMakeLists.txt 将所有测试源编译进单一可执行 openddlparser_unittest。
upstream_check_command: "cd build && ctest -N"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "openddlparser_unittest"

# 上游实际运行的测试程序（本机实测：125 个 TEST 声明全部编译进
# openddlparser_unittest 并运行通过，125/125 PASSED）
upstream_tests:
  - file: test/DDLNodeTest.cpp
    source: openddl-parser-0.5.2/test/DDLNodeTest.cpp
    description: "DDLNode 节点 API 单元测试（12 个 TEST）"
    command: "./bin/openddlparser_unittest"
  - file: test/OpenDDLCommonTest.cpp
    source: openddl-parser-0.5.2/test/OpenDDLCommonTest.cpp
    description: "OpenDDLCommon 公共类型单元测试（9 个 TEST）"
    command: "./bin/openddlparser_unittest"
  - file: test/OpenDDLDefectsTest.cpp
    source: openddl-parser-0.5.2/test/OpenDDLDefectsTest.cpp
    description: "缺陷回归测试（10 个 TEST）"
    command: "./bin/openddlparser_unittest"
  - file: test/OpenDDLExportTest.cpp
    source: openddl-parser-0.5.2/test/OpenDDLExportTest.cpp
    description: "OpenDDL 导出测试（10 个 TEST）"
    command: "./bin/openddlparser_unittest"
  - file: test/OpenDDLIntegrationTest.cpp
    source: openddl-parser-0.5.2/test/OpenDDLIntegrationTest.cpp
    description: "集成解析测试（5 个 TEST）"
    command: "./bin/openddlparser_unittest"
  - file: test/OpenDDLParserTest.cpp
    source: openddl-parser-0.5.2/test/OpenDDLParserTest.cpp
    description: "解析器核心测试（36 个 TEST）"
    command: "./bin/openddlparser_unittest"
  - file: test/OpenDDLParserUtilsTest.cpp
    source: openddl-parser-0.5.2/test/OpenDDLParserUtilsTest.cpp
    description: "解析器工具函数测试（18 个 TEST）"
    command: "./bin/openddlparser_unittest"
  - file: test/OpenDDLStreamTest.cpp
    source: openddl-parser-0.5.2/test/OpenDDLStreamTest.cpp
    description: "OpenDDLStream 流测试（2 个 TEST）"
    command: "./bin/openddlparser_unittest"
  - file: test/OssFuzzTest.cpp
    source: openddl-parser-0.5.2/test/OssFuzzTest.cpp
    description: "OssFuzz 回归测试（3 个 TEST）"
    command: "./bin/openddlparser_unittest"
  - file: test/ValueTest.cpp
    source: openddl-parser-0.5.2/test/ValueTest.cpp
    description: "Value 值对象单元测试（20 个 TEST）"
    command: "./bin/openddlparser_unittest"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_openddl_parser.cpp
    description: "消费者验证：公开 API parse/getRoot 遍历/版本查询"
    command: "./test_openddl_parser"

# 测试断言总数（上游 125 个 TEST 声明，实测 125/125 通过）
assertion_count: 125