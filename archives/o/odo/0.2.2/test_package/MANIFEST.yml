# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: odo/0.2.2
homepage: "https://github.com/atomicobject/odo"

# 上游测试命令：本项目为纯 Makefile 工程，测试入口为 `make test`
# 内部执行 ./test_odo（shell 脚本，并发跑 odo 进程，统计正确性）
upstream_check_command: "make test"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test_odo
    source: odo-0.2.2/test_odo
    description: "上游 shell 测试：并发 increment + set + print + reset 计数正确性（含 9998 个并发自增断言与 set/print 断言）"
    command: "./test_odo"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：直接调用打包后的 odo CLI，验证 increment/set/cat/reset/print 真实行为"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估: 上游 9998 并发 + 4 个顺序断言 + test.sh 6 个断言)
assertion_count: 10008
