# 软件级 manifest — olsrd
# 遵循 ARCHIVE-SPEC v2.0

software: olsrd
display: "olsrd"
description: "OLSR (RFC3626) 路由守护进程 — olsr.org 实现，附 20+ 可加载插件"
category: network
homepage: "http://www.olsr.org"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "构建必须强制 OS=linux：make/guess_os.sh 对 OHOS 内核返回 UNKNOWN，否则误入 win32 分支"
    - "OHOS NDK musl sys/socket.h 与 bionic 风格 linux/socket.h 的 sockaddr_storage 重定义：编译期注入 -D__MUSL__（sysroot 内建协调钩子）解决"
    - "cfgparser 需要 flex+bison 现场生成 oparse.c/oscan.c（上游未提交生成文件）"
    - "pud 插件依赖 gpsd<=3.18 客户端 API（gps_data_t.status/online/PRN[] 等），gpsd/3.20+ 破坏性变更；olsrd 0.9.8 停更 → 构建范围裁剪排除 pud"
    - "llvm-strip 后的 ELF 在本平台无法执行(EACCES)，打包不 strip"
  common_dependencies:
    - openssl

versions:
  "0.9.8":
    status: built
    build_date: "2026-09-05"
