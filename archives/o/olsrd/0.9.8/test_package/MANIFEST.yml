# test_package/MANIFEST.yml — olsrd 0.9.8
# CI L0e requires this file to exist.

package: olsrd/0.9.8
homepage: "http://www.olsr.org"

# Upstream has NO automated test suite: no `make check`/`make test`/ctest
# target and no tests/ directory in the 0.9.8 tarball (full-tree scan empty).
# Real verification entry is running the daemon: `olsrd -h` prints the version
# banner + usage then self-terminates (olsr_exit raises SIGTERM).  It cannot be
# run as a full routing daemon in a sandbox (needs root + network interfaces).
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs the packaged olsrd -h and asserts the 0.9.8 version banner and usage text appear"
    command: "bash test.sh"

assertion_count: 2
