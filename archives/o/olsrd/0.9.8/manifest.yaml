knowledge_gained:
  - "OHOS NDK musl sys/socket.h 以 #ifndef __MUSL__ 包裹 sockaddr_storage；编译期注入 -D__MUSL__ 可消除与 bionic 风格 linux/socket.h 的重定义（E091/E119 另见 sysroot 内建协调钩子方案）"
  - "bison>=3.x 的 -d -o x.c-tmp 生成 x.h-tmp 并在生成的 .c 中引用该临时名，Makefile 需 sed 改写为最终头文件名"
  - "clang 对 struct msghdr 位置初始化中 NULL 赋给 int 字段(msg_flags)为硬错误，须用 0"
  - "olsrd 0.9.8 的 pud 插件使用 gpsd<=3.18 客户端 API（gps_data_t.status/online(double)/PRN[] 等），gpsd>=3.20 破坏性变更导致无法编译；适配排除 pud 可选插件"

