software: osm2pgrouting
display: "osm2pgrouting"
description: "Import OpenStreetMap data into a PostgreSQL/PostGIS database as a routing topology"
category: utility
homepage: "https://github.com/pgRouting/osm2pgrouting"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 cmake/FindPostgreSQL.cmake 调 pg_config 并扫 /usr/include/postgresql*、cmake/FindPQXX.cmake 扫 /usr/include —— 两者描述的都是构建主机，OHOS 交叉构建下必须改为消费 Conan CMakeDeps 的 config 包（libpq::libpq / libpqxx::pqxx / expat::expat / Boost::program_options）。"
    - "Boost 同样要用 CONFIG 模式，否则被 CMake 内建 FindBoost（module 模式）按主机路径截胡。"
    - "上游按 PQXX>=7 选 C++17，但 libpqxx 8.x 要求 C++20；且 profile 钉的是 cppstd=17，CMakeLists 里的 set(CMAKE_CXX_STANDARD ...) 会遮蔽 toolchain 的 cache 变量，因此补丁与工具的 cppstd block 必须同时改。"
    - "expat 选 2.8.2.1：仓库里更新的 2.8.4 在本 profile 选项下没有 ohpcd 预编译包。"
    - "上游不带任何测试套件（无 tests/、无 enable_testing()），验证全部由 test_package 的 22 条消费者侧 CLI 功能断言承担。"
  common_dependencies:
    - libpq/18.1
    - libpqxx/8.0.1
    - expat/2.8.2.1
    - boost/1.84.0

versions:
  "3.0.0":
    status: built
    build_date: "2026-09-21"
    notes: "CMake build on HarmonyOS aarch64. 产物为 bin/osm2pgrouting 与 share/osm2pgrouting/{mapconfig.xml,mapconfig_for_cars.xml,mapconfig_for_bicycles.xml,mapconfig_for_pedestrian.xml,COPYING,README.md}。上游无测试套件；test_package/test.sh 22/22 断言通过。"
