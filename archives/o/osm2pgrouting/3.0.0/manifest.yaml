version: "3.0.0"
software: osm2pgrouting
status: built
build_date: "2026-09-21"
build_system: cmake
conan_ref: osm2pgrouting/3.0.0

source:
  url: "https://github.com/pgRouting/osm2pgrouting/archive/refs/tags/v3.0.0.tar.gz"
  sha256: "3d3042aa0dd30930d27801c9833ebfbe16eba0ab0e5d6277636ce17b157f2a0f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_CXX_STANDARD=20（配方 patch 0001 内设置；profile 的 cppstd=17 不够，libpqxx 8.x 要求 C++20）"
    - "依赖全部经 CMakeDeps 的 config 包解析（libpq::libpq / libpqxx::pqxx / expat::expat / Boost::program_options）"
    - "OHOS: cmake_system_name=OHOS, cmake_system_processor=aarch64"
  dependencies:
    - libpq/18.1
    - libpqxx/8.0.1
    - expat/2.8.2.1
    - boost/1.84.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"

upstream_tests:
  command: ""
  test_count: 0
  notes: >-
    上游 v3.0.0 不附带测试套件：find -iname '*test*' 无输出，CMakeLists.txt 没有
    enable_testing()/add_test，也没有 tests/ 目录。唯一的 .github/workflows/ubuntu.yml
    是“拉起真 PostgreSQL+PostGIS+pgRouting 服务端再跑命令”的黑盒流程，不产出可枚举用例。
    故上游用例数 = 0，验证全部由 test_package 的消费者侧功能测试承担。

test_package:
  assertion_count: 22
  description: >-
    test.sh 执行已安装的 osm2pgrouting：--version/-v 版本串、--help 选项表、缺必需参数
    与未知选项两条 boost::program_options 错误路径、对 127.0.0.1:1 的真实连接（打通
    boost→libpqxx→libpq 全栈，无服务端时退出码 1）、以及安装出的 4 个 mapconfig*.xml 与
    COPYING。
