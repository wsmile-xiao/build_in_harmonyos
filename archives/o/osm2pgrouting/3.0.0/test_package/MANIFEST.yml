# test_package/MANIFEST.yml
# CI 脚本 (ci/conan/build_and_test.sh L0e) 要求此文件存在。
# R51 — 上游测试清单（2026-09-21 对照 v3.0.0 tarball 审计）。

package: osm2pgrouting/3.0.0
homepage: "https://github.com/pgRouting/osm2pgrouting"

# ── R51 上游测试清单 ────────────────────────────────────────────────
# osm2pgrouting 3.0.0 不附带任何自动化测试套件。审计证据（上游 tarball
# sha256 3d3042aa0dd30930d27801c9833ebfbe16eba0ab0e5d6277636ce17b157f2a0f）：
#   $ find . -iname "*test*" -o -iname "*spec*"   -> 无输出
#   $ ls                                          -> 无 tests/ 目录，无 CTest 配置，
#                                                    CMakeLists.txt 中无 enable_testing()
#                                                    / add_test / BUILD_TEST 之类开关
#   顶层 CMakeLists.txt 只产出 bin/osm2pgrouting 与 share/osm2pgrouting/*
#   唯一的 CI 配置 .github/workflows/ubuntu.yml 是“起一个真 PostgreSQL+PostGIS
#   +pgRouting 服务端再跑命令”的黑盒流程，不产出可被 ctest 枚举的用例
# => 上游测试：0 个文件、0 个注册用例、0 条断言。
upstream_check_command: "find . -iname '*test*'  # 无输出；CMakeLists.txt 无 enable_testing()/add_test"

# 上游测试未接入 build()：没有可接入的对象。
upstream_test_in_build: false
upstream_test_command: ""

# 上游无可运行测试程序（见上方清单）。
upstream_tests: []

# ── test_package 测试（消费者视角验证） ─────────────────────────────
# test.sh 执行**已安装**的 osm2pgrouting 二进制，共 22 条断言。
test_package_tests:
  - file: test.sh
    description: "执行已安装的 osm2pgrouting：校验 --version/-v 输出版本串、--help 的选项表、缺必需参数与未知选项两条 boost::program_options 错误路径、对 127.0.0.1:1 发起真实连接以打通 boost→libpqxx→libpq 全栈（无可用服务端时以退出码 1 结束），并检查安装出的 4 个 mapconfig*.xml 与 COPYING。"
    command: "bash test.sh <package_folder>"

# test.sh 执行的断言总数（精确值，见脚本末行 'assertions: N, failures: M'）。
assertion_count: 22
