# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: open-tyrian/2.1.20221123
homepage: "https://github.com/opentyrian/opentyrian"

# 上游测试命令
upstream_check_command: "make check"

# 上游无测试套件（游戏项目，Makefile 无 check/test 目标，无 tests/ 目录）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_open-tyrian.c
    description: "运行 opentyrian --help 验证二进制可执行"
    command: "./test_open-tyrian"

# 测试断言总数
assertion_count: 1
