# 软件级 manifest
# 文件位置: archives/o/osv-scanner/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: osv-scanner

# 显示名
display: "OSV Scanner"

# 一句话描述
description: "扫描项目依赖并对照 OSV 漏洞数据库检测已知安全漏洞"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://github.com/google/osv-scanner"

# 开源许可证（SPDX 标识）
license: Apache-2.0

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "Go 工具链（GOROOT/pkg/tool/ 下的 compile/link/asm 等）必须用 binary-sign-tool 逐一签名才能在 OHOS 上执行"
    - "Go 链接器使用 fallocate() 预分配输出文件空间，HMDFS/tmpfs 返回 EACCES 导致链接失败；需用 go build -toolexec 包装器将链接器输出重定向到 /dev/shm"
    - "编译出的 Go 二进制必须用 binary-sign-tool --selfSign 签名才能在 OHOS 上执行"
    - "CGO_ENABLED=0 纯 Go 编译，避免 C 依赖和交叉编译复杂性"
    - "Go 不在默认 PATH 中，call analysis 功能不可用（不影响核心扫描功能）"

  # 跨版本通用依赖
  common_dependencies:
    - "go (Go 工具链，需签名)"

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.1.0":
    status: built
    build_date: 2026-07-02
    # published_as: osv-scanner  # 仅 published 时需要
