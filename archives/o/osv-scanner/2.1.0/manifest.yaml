software: osv-scanner
# 版本级 manifest
# 文件位置: archives/o/osv-scanner/2.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.0"

# 编译状态
# published | built | failed | archived
# conan-verify 8道门禁全部PASS，功能测试28/28全PASS，未执行CI upload
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# 构建系统类型（顶层字段，供自检读取）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/google/osv-scanner/archive/refs/tags/v2.1.0.tar.gz"

  # 源码校验和
  sha256: "129f534cb55c0811dcf80efec9da7314a4fd87255c093718db9502a4ba19f704"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建系统说明: Go 项目，使用 go build 编译
  # 入口点: cmd/osv-scanner/ 和 cmd/osv-reporter/
  # Go module: github.com/google/osv-scanner/v2
  # Go version: go1.24.4 linux/arm64

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOPROXY=https://goproxy.cn,direct"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 纯Go项目，无C依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go工具链内部工具（compile/link/asm等）在OHOS上需要签名才能执行"
  - "Go链接器使用fallocate()预分配输出文件空间，HMDFS/tmpfs返回EACCES导致失败"
  - "解决方案：使用go build -toolexec包装器，将链接器输出重定向到/dev/shm（支持fallocate）"
  - "Go编译的二进制必须用binary-sign-tool签名才能在OHOS上执行"
  - "Conan 2.x的self.run() env参数需要是列表格式['KEY=VALUE']而非字典"
  - "Conan 2.x中basic_layout的self.build_folder指向子目录，二进制在self.source_folder中"
  - "Conan 2.x中test_package应使用self.dependencies[name].package_folder而非deps_cpp_info"

# ============================================================
# 功能测试
# ============================================================

functional_test:
  # 测试日期
  date: "2026-07-02"

  # 测试结论
  # pass | partial | fail
  result: pass

  # 测试用例数
  total_cases: 28
  passed: 28
  failed: 0

  # 测试覆盖
  coverage:
    - "基础功能 (--version/--help)"
    - "在线漏洞扫描 (npm/Maven/Go 生态系统)"
    - "递归目录扫描"
    - "输出格式 (table/JSON/Markdown/SARIF/CycloneDX/SPDX/HTML)"
    - "文件输出 (--output)"
    - "错误处理 (不存在文件/无参数/无效命令)"
    - "离线模式"
    - "fix 子命令"
    - "osv-reporter SARIF 生成"

  # 已知限制
  known_limitations:
    - "Go call analysis 不可用（Go 不在默认 PATH 中，可选功能不影响核心扫描）"
    - "离线模式需先执行 --download-offline-databases 下载数据库"
    - "fix 命令需要完整格式的 lockfile（含 root node）"

  # 测试报告路径
  report_path: "reports/functional-test-report.md"
