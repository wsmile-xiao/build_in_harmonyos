# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: osv-scanner/2.1.0
homepage: "https://github.com/google/osv-scanner"

# osv-scanner is a Go project — no make check equivalent
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Go test suite — not integrated in conan build)
upstream_tests:
  - file: "cmd/osv-scanner/main.go"
    source: "osv-scanner-2.1.0/cmd/osv-scanner/main.go"
    description: "osv-scanner 主程序入口"
    command: "go test ./cmd/osv-scanner/..."
  - file: "cmd/osv-reporter/main.go"
    source: "osv-scanner-2.1.0/cmd/osv-reporter/main.go"
    description: "osv-reporter 主程序入口"
    command: "go test ./cmd/osv-reporter/..."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证安装的 osv-scanner 和 osv-reporter 二进制可执行 --version"
    command: "conan test test_package osv-scanner/2.1.0"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
