name: openrct2
version: "0.5.3"
build_system: cmake
compiler: clang
build_date: "2026-09-12"
status: built
description: "OpenRCT2 — RollerCoaster Tycoon 2 开源重制（C++），headless 服务器形态（bin/openrct2-cli：host 联机服务器/simulate/sprite/convert 命令 + share/openrct2 数据）"
upstream: https://github.com/OpenRCT2/OpenRCT2
upstream_tag: v0.5.3
dependencies:
  - icu4c/78
  - libzip/1.11.4
  - zstd/1.5.7.1
  - libcurl/8.5.0
  - freetype/2.14.3
  - fontconfig/2.18.1.1
  - libpng/1.6.58
  - openssl/3.5.6.1.1
  - zlib/1.3.1.1
  - nlohmann-json/3.11.2
patches: 19
notes: |
  headless 形态（DISABLE_GUI=ON）决策依据：
  1) 仓内 sdl2/2.30.10 OHOS 定制版视频后端仅 DUMMY/OFFSCREEN（无 X11/Wayland），
     GUI 编译可行但运行时无真实渲染路径；
  2) 音频层依赖冲突：flac/1.4.3→libogg/1.3.5 vs libvorbis/1.3.7→libogg/1.3.6
     （conan 图冲突，均在 openrct2-ui 层）。
  openrct2-cli headless server 为官方支持形态（--headless / host / simulate）。
  OHOS clang15/libc++15 C++20 兼容：19 个 patch（详见 notes.md 修复清单）。
