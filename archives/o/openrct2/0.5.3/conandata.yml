sources:
  url: "https://github.com/OpenRCT2/OpenRCT2/archive/refs/tags/v0.5.3.tar.gz"
  sha256: "cde0192b50cddaffc32c28b066afa81943563850c295f201e9f4be396b7b6be8"

# 上游测试资产（WITH_TESTS=ON 时下载；URL/sha256 均来自源码树 assets.json，
# 与上游 CI 使用的 release 资产一致）：
#   - replays：ReplayTests TEST_P 参数化数据（上游 CMake install 期下载，
#     DOWNLOAD_REPLAYS=OFF 后由配方手动放置，避开 DESTDIR 语义差异）
#   - objects：rct1/rct2/tt/ww + official objects（park 加载必需——sv6/park
#     文件引用的物件缺失时 LoadParkFromFile 报 "missing objects"）
#   - openmusic：official/music openrct2.music.* parkobj（EverythingPark.park
#     引用的音乐物件在 objects.zip 之外的 openmusic 包内）
testdata:
  replays:
    url: "https://github.com/OpenRCT2/replays/releases/download/v0.0.95/replays.zip"
    sha256: "df4082741c6f1fda1f10cfaf091abbcbbd5078670926b548feb29ee8aa85e3f5"
  objects:
    url: "https://github.com/OpenRCT2/objects/releases/download/v1.7.10/objects.zip"
    sha256: "f483be266dc22077ba8517bbf32ffe388c3543b2ee585e0afbd4102db4528021"
  openmusic:
    url: "https://github.com/OpenRCT2/OpenMusic/releases/download/v1.6.1/openmusic.zip"
    sha256: "994b350d3b180ee1cb9619fe27f7ebae3a1a5232840c4bd47a89f33fa89de1a1"

patches:
  - patch_file: "patches/0001-src-openrct2-CMakeLists-conan-deps-integration.patch"
    patch_description: "Replace PKG_CHECK_MODULES/find_package(OpenSSL,ICU) with conan CMakeDeps find_package + targets"
    patch_type: "portability"
  - patch_file: "patches/0002-toplevel-CMakeLists-headless-install-guard.patch"
    patch_description: "Guard g2/fonts/palettes/tracks .dat install rules with DISABLE_GUI (headless never builds them)"
    patch_type: "portability"
  - patch_file: "patches/0003-core-BackgroundWorker-stop_token-typename.patch"
    patch_description: "Drop unused <stop_token> include (libc++15 lacks it) and add missing typename"
    patch_type: "portability"
  - patch_file: "patches/0004-core-Random-typename.patch"
    patch_description: "Add missing typename for enable_if dependent types"
    patch_type: "portability"
  - patch_file: "patches/0005-management-NewsItem-typename.patch"
    patch_description: "Add missing typename for std::array dependent types"
    patch_type: "portability"
  - patch_file: "patches/0006-core-BitSet-typename.patch"
    patch_description: "Add missing typename for dependent StorageBlockType"
    patch_type: "portability"
  - patch_file: "patches/0007-core-Guard-source_location-polyfill.patch"
    patch_description: "Include SourceLocationCompat.hpp instead of <source_location>"
    patch_type: "portability"
  - patch_file: "patches/0008-core-SourceLocationCompat-new-file.patch"
    patch_description: "Add std::source_location polyfill via clang builtins for libc++15"
    patch_type: "portability"
  - patch_file: "patches/0009-core-Endianness-typename.patch"
    patch_description: "Add missing typename for ByteSwap::UIntType"
    patch_type: "portability"
  - patch_file: "patches/0010-FileClassifier-make_unique_for_overwrite.patch"
    patch_description: "make_unique_for_overwrite (C++23) -> make_unique"
    patch_type: "portability"
  - patch_file: "patches/0011-object-ObjectRepository-make_unique_for_overwrite.patch"
    patch_description: "make_unique_for_overwrite (C++23) -> make_unique"
    patch_type: "portability"
  - patch_file: "patches/0012-actions-RideCreateAction-ranges-fill.patch"
    patch_description: "std::ranges::fill -> std::fill (libc++15 ranges incomplete)"
    patch_type: "portability"
  - patch_file: "patches/0013-windows-Intent-ranges-lower_bound.patch"
    patch_description: "std::ranges::lower_bound -> std::lower_bound with projection lambda"
    patch_type: "portability"
  - patch_file: "patches/0014-core-OrcaStream-typename.patch"
    patch_description: "Add missing typename for std::underlying_type"
    patch_type: "portability"
  - patch_file: "patches/0015-scripting-ScriptEngine-typename.patch"
    patch_description: "Add missing typename for enable_if"
    patch_type: "portability"
  - patch_file: "patches/0016-scripting-HookEngine-CTAD-deduction-guide.patch"
    patch_description: "Add explicit CTAD deduction guide for HookValuesToJS aggregate"
    patch_type: "portability"
  - patch_file: "patches/0017-scripting-ScriptEngine-ExtensionCallbacks-ctor.patch"
    patch_description: "Add explicit constructor (libc++15 construct_at lacks C++20 aggregate init)"
    patch_type: "portability"
  - patch_file: "patches/0018-sprite-SpriteExportAll-sstream.patch"
    patch_description: "Add missing <sstream> include"
    patch_type: "portability"
  - patch_file: "patches/0019-sprite-SpriteExportObject-sstream.patch"
    patch_description: "Add missing <sstream> include"
    patch_type: "portability"
  - patch_file: "patches/0020-toplevel-CMakeLists-ohos-gtest-sign-compare.patch"
    patch_description: "OHOS (HarmonyOS) + gtest 1.17: downgrade -Wsign-compare from error (gtest headers EXPECT_LE/GE compare size_t vs int under clang15; upstream CI system gtest is older and does not trigger)"
    patch_type: "portability"
