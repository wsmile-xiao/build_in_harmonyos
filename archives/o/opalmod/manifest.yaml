software: "opalmod"
display: "opalmod"
description: "Ola Lundqvist 的 Perl 模块集合（OpaL::where/read/dir/manipulate/action）"
category: dev-tool
homepage: "https://packages.debian.org/source/opalmod"
license: "GPL-2.0-or-later"
build_system: perl-makemaker

# 跨版本通用说明
ohos_adaptation:
  key_points:
    - "纯 Perl（无 XS）→ 无需编译器，只装 .pm"
    - "上游顶层 Makefile 用 for 循环驱动 5 个独立 Makefile.PL 子目录，配方逐个驱动"
    - "用 INSTALL_BASE 绝对路径 staging，无需 DESTDIR"
    - "package_info() 按 OpaL/*.pm 实际位置反推 PERL5LIB，不可硬编码落盘层级"
  common_dependencies: []

# 版本索引
versions:
  - version: "0.2.2.1"
    status: built
    build_date: "2026-09-12"
    notes: "纯 Perl 模块库；conan create EXIT=0；上游自测 5/5；test_package 真实调用导出函数"
