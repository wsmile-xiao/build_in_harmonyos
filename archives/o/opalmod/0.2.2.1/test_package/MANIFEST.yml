# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: opalmod/0.2.2.1
homepage: "https://packages.debian.org/source/opalmod"

# 上游测试命令
# 上游每个子模块自带 test.pl（ExtUtils::MakeMaker 的经典自测，Test::Harness 1..1 协议），
# 但顶层 Makefile 与各 Makefile.PL 均未声明 test 目标，故不能用 `make test` 统一驱动；
# 实跑方式是逐个执行 perl OpaL/<part>/test.pl（需先把模块放进 PERL5LIB）。
upstream_check_command: "for p in where read dir manipulate action; do perl OpaL/$p/test.pl; done"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（5 个子模块各 1 个用例）
upstream_tests:
  - name: "OpaL::where test.pl"
    file: "OpaL/where/test.pl"
    command: "perl OpaL/where/test.pl"
    description: "验证 which() 能定位可执行文件（ok 1）"
  - name: "OpaL::read test.pl"
    file: "OpaL/read/test.pl"
    command: "perl OpaL/read/test.pl"
    description: "验证模块加载（ok 1）"
  - name: "OpaL::dir test.pl"
    file: "OpaL/dir/test.pl"
    command: "perl OpaL/dir/test.pl"
    description: "验证模块加载（ok 1）"
  - name: "OpaL::manipulate test.pl"
    file: "OpaL/manipulate/test.pl"
    command: "perl OpaL/manipulate/test.pl"
    description: "验证模块加载（ok 1）"
  - name: "OpaL::action test.pl"
    file: "OpaL/action/test.pl"
    command: "perl OpaL/action/test.pl"
    description: "验证模块加载（ok 1）"

# 上游用例总数（5 个子模块 × 1 个用例）
upstream_test_count: 5

# 实测结果
upstream_test_result:
  upstream_as_is: "4/5 通过 —— OpaL::where 的 test.pl 失败"
  after_required_patch: "5/5 通过"
  failure_root_cause: >
    OpaL::where / OpaL::dir / OpaL::manipulate 把函数定义在 __END__ 之后（靠
    AutoLoader 按需加载），却只把 AutoLoader 放进 @ISA、从未 import 其 AUTOLOAD。
    现代 Perl（5.22+）禁止「对非方法调用使用继承来的 AUTOLOAD」→ 模块能加载但
    所有函数不可调用。where 的唯一导出函数 which 即因此失败。
    注：OpaL::action（debarchiver 实际依赖者）的函数都在 __END__ 之前，未受影响 ——
    这正是该缺陷长期未被上游发现的原因。
  fix_patch: "patches/0001-fix-autoloader-autoload.patch（在 @ISA 前补 use AutoLoader qw(AUTOLOAD);）"

upstream_test_note: |
  上游测试形态：ExtUtils::MakeMaker 生成的标准 test.pl 骨架，采用 Test::Harness
  的经典 `1..1` 协议 ——
      BEGIN { $| = 1; print "1..1\n"; }
      END   { print "not ok 1\n" unless $loaded; }
      use OpaL::<part> ...;  $loaded = 1;
      print "ok 1\n";
  每模块仅 1 个用例（共 5 个），断言实质是"模块能否被加载"（OpaL::where 额外
  验证 which("perl") 返回定义值）。

  ⚠️ 实测注意：`make test` 不可用 —— 顶层 Makefile 与各子模块 Makefile.PL 均未
  声明 test 目标。须**逐个**执行 `perl OpaL/<part>/test.pl`，且需先把子模块目录
  放入 PERL5LIB。

  由于上游用例覆盖面极薄（每模块仅"可加载"），本配方另在
  `test_package/run_opalmod_tests.py` 中**真实调用各模块的导出函数**做功能验证
  （where::which / read::readscalarfile / dir::getdirlist / action set-getDebugLevel），
  并含 1 项负向用例（加载不存在的模块必须失败）。
