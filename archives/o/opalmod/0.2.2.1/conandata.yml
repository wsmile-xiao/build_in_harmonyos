# conandata.yml — opalmod 0.2.2.1
# opalmod: Perl 通用「库」集合（OpaL::where / read / dir / manipulate / action），
#          是 debarchiver 的硬前置（Debian control 中 opalmod >= 0.1.10）。
#
# 源：Debian 官方池（R39 单一官方 URL，无镜像前缀）

sources:
  url: "https://deb.debian.org/debian/pool/main/o/opalmod/opalmod_0.2.2.1.tar.xz"
  sha256: "c2b42bfc47caf8d37e7095cb8409944b59c12101ec0da6f87f867d985779c652"

patches:
  - patch_file: "patches/0001-fix-autoloader-autoload.patch"
    patch_description: >
      为 OpaL::where / OpaL::dir / OpaL::manipulate 补上 `use AutoLoader qw(AUTOLOAD);`。
      三个模块都把函数定义在 `__END__` 之后（靠 AutoLoader 按需加载），却只把
      AutoLoader 放进 `@ISA`、从未 import 其 AUTOLOAD —— 现代 Perl（5.22+）已禁止
      「对非方法调用继承来的 AUTOLOAD」，导致函数无从解析。
    patch_type: "portability"
    strip: 1
