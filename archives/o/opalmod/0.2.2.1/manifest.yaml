version: "0.2.2.1"
software: "opalmod"
status: "built"
build_date: "2026-09-12"
build_system: "perl-makemaker"

source:
  url: "https://deb.debian.org/debian/pool/main/o/opalmod/opalmod_0.2.2.1.tar.xz"
  sha256: "c2b42bfc47caf8d37e7095cb8409944b59c12101ec0da6f87f867d985779c652"
  tar_format: "tar.xz"

build:
  system: "perl-makemaker"
  configure_options:
    - "INSTALL_BASE=<build_folder>/lib/perl5"
  dependencies: []
  notes:
    - "纯 Perl（实测 .xs 与 .c 均为 0），无 XS 编译、无 C 依赖"
    - "上游顶层 Makefile 以 for part in where read dir manipulate action 循环驱动；配方逐个驱动子目录"
    - "用 INSTALL_BASE 绝对路径 staging 到 build 目录，无需 DESTDIR（与仓库 Data-UUID 配方同一做法）"
    - "package_info() 按 OpaL/*.pm 实际所在位置反推 PERL5LIB（MakeMaker 落盘层级随 INSTALL_BASE/INSTALLDIRS 而变，不可硬编码）"
  parts:
    - OpaL::where
    - OpaL::read
    - OpaL::dir
    - OpaL::manipulate
    - OpaL::action

patches_applied: []

knowledge_gained:
  - "Perl 模块包的产物定位不能硬编码层级：MakeMaker 的 INSTALL_BASE 落盘结果可能是 lib/perl5、lib/perl5/<version> 或 lib/perl5/<arch>/…，须按模块文件实际位置反推 PERL5LIB。"
  - "上游顶层 Makefile 用 for 循环驱动多个独立 Makefile.PL 子目录时，用 conan 逐个 self.run(cwd=...) 驱动比调用上游 Makefile 更可控。"
  - "opalmod 是 debarchiver 的硬前置（BEGIN 阶段 use OpaL::action），须先行适配并发布。"

verification:
  upstream_tests: "上游原样 4/5（OpaL::where 因 AutoLoader 缺陷失败）→ 打必需补丁后 5/5（见 notes.md）"
  test_package: "11/11 通过（1 项包内容检查 + 5 个模块加载 + 4 项真实功能调用 + 1 项负向）"

homepage: "https://packages.debian.org/source/opalmod"
license: "GPL-2.0-or-later"
