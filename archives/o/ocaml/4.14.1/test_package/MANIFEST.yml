package: ocaml/4.14.1
homepage: "https://ocaml.org"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  - file: tests/
    source: ocaml-4.14.1/tests/
    description: "OCaml compiler test suite"
    command: "make check"

test_package_tests:
  - file: conanfile.py
    description: "Verify ocaml binary reports version correctly"
    command: "ocaml -version"

assertion_count: 1
