software: openconnect
display: "openconnect"
description: "OpenConnect SSL VPN 客户端命令行工具与库"
category: network
homepage: "https://www.infradead.org/openconnect/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需补 aarch64 HarmonyOS -> linux-ohos"
    - "configure 临时目录 umask 077 -> 007 (HMDFS setgid 写权限)"
    - "<linux/tcp.h> 重定义 sockaddr_storage, __OHOS__ rename-guard (4 个 .c)"
    - "GnuTLS 依赖 conan 包坏 .la 卡 libtool: gnutls.pc 改 Requires.private"
  common_dependencies:
    - gnutls/3.8.10
    - libxml2/2.15.3
    - zlib/1.3.1

versions:
  "9.12":
    status: built
    build_date: "2026-09-02"
