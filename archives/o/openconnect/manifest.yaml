# 软件级 manifest — openconnect
# 文件位置: archives/o/openconnect/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: openconnect

display: "OpenConnect VPN Client"

description: "OpenConnect VPN 客户端，连接 Cisco AnyConnect / Juniper / GlobalProtect / Pulse SSL VPN 网关（ocserv 的姊妹客户端）"

category: network

homepage: "https://www.infradead.org/openconnect/"

license: LGPL-2.1-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "官方 infradead.org release tarball 自带预生成 configure（GitHub tag 归档无 configure 且构建机无 automake/libtoolize，不可用）"
    - "OHOS musl 下 <linux/tcp.h> 链入 <linux/socket.h> 与 <sys/socket.h> 的 sockaddr_storage 重定义 → __OHOS__ 下改用 <netinet/tcp.h>"
    - "musl 不像 glibc 那样间接引入 <stdlib.h> → 8 个使用 malloc/calloc/free/exit/setenv/mkstemp 的源文件显式补 include"
    - "tarball 内 2020 版 ltmain.sh 与 autoconf 2.72 生成的 config.status 转义不兼容：libtool 模板变量双引号内提前展开（ar cru 无参数/chmod 无文件）→ 配方内修复引号 + ksh print→printf"
    - "config.status 的 umask 077 临时目录在 HMDFS 上 0700 权限导致 subs1.awk Permission denied（cattle/opensp 先例）"
    - "ohpcd 依赖包 .la 文件 libdir='//lib' 残留 → 链接期重写为实际缓存路径（cattle-1.0 / CI#16082 先例）"
    - "make 必须用 -j1：OHOS 沙箱无 mkfifo（automake jobserver）"
    - "ELF 可执行文件需 binary-sign-tool 签名后才能在 OHOS 执行"

versions:
  "8.10":
    status: published
    build_date: "2026-09-02"
