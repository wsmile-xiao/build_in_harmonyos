# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表 (本地探索编译实测; conan create 时由 conanfile.py generate() 注入)
  configure_options:
    - "--prefix=/"
    - "--disable-docs"
    - "--with-vpnc-script=/etc/vpnc/vpnc-script"
    - "--enable-shared"
    - "--disable-static"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gnutls/3.8.10
    - libxml2/2.15.3
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

