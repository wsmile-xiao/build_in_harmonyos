# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: openconnect/9.12
homepage: "https://www.infradead.org/openconnect/"

# 上游测试命令 (make check — 本地探索编译已执行, 5/5 PASS)
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (本地探索编译执行 make check 的实测结果)
upstream_tests:
  - file: tests/test.sh
    source: openconnect-9.12/tests
    description: "autocompletion — openconnect CLI completes; runs the binary with GnuTLS+libxml2"
    command: "make check (5 tests: autocompletion/lzstest/seqtest/buftest/symbols, 5/5 PASS)"
    note: "其余网络类测试 (server-auth/DTLS/PPP 等) 需要 test-server/socat/root, 平台缺失自动跳过"

# test_package 中自带的测试 (消费者视角验证; R34: 真实执行包内二进制)
test_package_tests:
  - file: test.sh
    description: "运行安装后的 openconnect 二进制: --version 与 --help"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
