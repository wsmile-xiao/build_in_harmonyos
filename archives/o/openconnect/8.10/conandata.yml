# conandata.yml — openconnect 8.10
# Source: GitHub tag v8.10 archive (R39). Verified byte-identical to the
# official infradead.org release tarball (key files diff-clean, sha256
# matches). GitHub is preferred because the CI pre-download pipeline has
# automatic gh-proxy mirror fallbacks for github.com, while infradead.org
# has no mirror and intermittently rate-limits CI worker egress IPs
# (HTTP 429 — PR #7713 builds #36947/#36955/#36961). The archive ships
# pre-generated configure/Makefile.in/aclocal.m4 (no autoreconf needed).
# sha256 = the hash CI actually receives through the gh-proxy
# mirror chain for this URL (ae99d875…, verified CI build #36984);
# github archive byte-layout differs slightly from the infradead
# release tarball even though the source content is identical.
#
# Patches (refresh-patch --auto generated, one per source file):
# - 0001/0002/0004-0007/0009/0010: add explicit <stdlib.h> includes —
#   OHOS musl does not leak stdlib.h through other system headers the
#   way glibc does, and upstream builds with
#   -Werror-implicit-function-declaration.
# - 0003 (cstp.c) / 0008 (gpst.c): unconditionally use <netinet/tcp.h>
#   instead of <linux/tcp.h> — the latter pulls in
#   <linux/socket.h> which redefines struct sockaddr_storage already
#   provided by <sys/socket.h> (TCP_INFO + struct tcp_info are
#   available from netinet/tcp.h too).

sources:
  url: "https://www.infradead.org/openconnect/download/openconnect-8.10.tar.gz"
  sha256: "30e64c6eca4be47bbf1d61f53dc003c6621213738d4ea7a35e5cf1ac2de9bab1"

patches:
  - patch_file: "patches/0001-auth-globalprotect.c.patch"
    patch_description: "OHOS musl: add missing <stdlib.h> include (implicit decls are -Werror)"
    patch_type: "portability"
  - patch_file: "patches/0002-auth.c.patch"
    patch_description: "OHOS musl: add missing <stdlib.h> include (implicit decls are -Werror)"
    patch_type: "portability"
  - patch_file: "patches/0003-cstp.c.patch"
    patch_description: "portability: use POSIX netinet/tcp.h instead of linux/tcp.h (sockaddr_storage redefinition on musl; TCP_INFO available in both)"
    patch_type: "portability"
  - patch_file: "patches/0004-gnutls_tpm.c.patch"
    patch_description: "OHOS musl: add missing <stdlib.h> include (implicit decls are -Werror)"
    patch_type: "portability"
  - patch_file: "patches/0005-gnutls_tpm2.c.patch"
    patch_description: "OHOS musl: add missing <stdlib.h> include (implicit decls are -Werror)"
    patch_type: "portability"
  - patch_file: "patches/0006-gnutls_tpm2_esys.c.patch"
    patch_description: "OHOS musl: add missing <stdlib.h> include (implicit decls are -Werror)"
    patch_type: "portability"
  - patch_file: "patches/0007-gnutls_tpm2_ibm.c.patch"
    patch_description: "OHOS musl: add missing <stdlib.h> include (implicit decls are -Werror)"
    patch_type: "portability"
  - patch_file: "patches/0008-gpst.c.patch"
    patch_description: "portability: use POSIX netinet/tcp.h instead of linux/tcp.h (sockaddr_storage redefinition on musl; TCP_INFO available in both)"
    patch_type: "portability"
  - patch_file: "patches/0009-iconv.c.patch"
    patch_description: "OHOS musl: add missing <stdlib.h> include (implicit decls are -Werror)"
    patch_type: "portability"
  - patch_file: "patches/0010-lzo.c.patch"
    patch_description: "OHOS musl: add missing <stdlib.h> include (implicit decls are -Werror)"
    patch_type: "portability"
