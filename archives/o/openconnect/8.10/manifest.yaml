version: "8.10"

software: "openconnect"

status: published

build_date: "2026-09-02"
build_system: "autotools"

source:
  url: "https://www.infradead.org/openconnect/download/openconnect-8.10.tar.gz"
  sha256: "30e64c6eca4be47bbf1d61f53dc003c6621213738d4ea7a35e5cf1ac2de9bab1"
  tar_format: tar.gz

build:
  system: autotools

  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--with-vpnc-script=/etc/vpnc/vpnc-script"
    - "--disable-shared"
    - "--disable-symvers"
    - "--without-lz4"
    - "--without-libproxy"
    - "--without-stoken"
    - "--without-libpcsclite"
    - "--without-libpskc"
    - "--without-gssapi"
    - "--without-java"

  dependencies:
    - gnutls/3.8.10
    - libxml2/2.15.3
    - zlib/1.3.1

  cc: clang

