  - "0001-auth-globalprotect.c.patch (musl stdlib.h)"
  - "0002-auth.c.patch (musl stdlib.h)"
  - "0003-cstp.c.patch (netinet/tcp.h)"
  - "0004-gnutls_tpm.c.patch (musl stdlib.h)"
  - "0005-gnutls_tpm2.c.patch (musl stdlib.h)"
  - "0006-gnutls_tpm2_esys.c.patch (musl stdlib.h)"
  - "0007-gnutls_tpm2_ibm.c.patch (musl stdlib.h)"
  - "0008-gpst.c.patch (netinet/tcp.h)"
  - "0009-iconv.c.patch (musl stdlib.h)"
  - "0010-lzo.c.patch (musl stdlib.h)"

knowledge_gained:
  - "OHOS musl <linux/tcp.h> 链入 <linux/socket.h> 与 <sys/socket.h> 的 sockaddr_storage 重定义，__OHOS__ 下可用 <netinet/tcp.h> 等价替代（knowledge_ref: E543-draft）"
  - "2020 版 ltmain.sh + autoconf 2.72：libtool 模板变量双引号提前展开（ar cru/chmod 无参数），需修复引号 + ECHO print→printf（knowledge_ref: E543-draft）"
  - "musl 不间接引入 <stdlib.h>，隐式声明被 -Werror 拦截需显式补 include（knowledge_ref: E543-draft）"
  - "ohpcd 依赖包 .la 残留 libdir='//lib' 导致 'not a valid libtool archive'（cattle-1.0 同款坑）（knowledge_ref: E011, E129）"
  - "官方 release tarball 与 GitHub tag 归档不等价：前者带预生成 configure，后者需要 automake/libtoolize（knowledge_ref: E209）"

