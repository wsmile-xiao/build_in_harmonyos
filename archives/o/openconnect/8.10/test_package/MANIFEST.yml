# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: openconnect/8.10
homepage: "https://www.infradead.org/openconnect/"

# 上游测试命令 (autotools `make check`，tests/Makefile.am 注册 3 项；
# conanfile.py build() 内以 `make check` 原样运行，LD_LIBRARY_PATH 指向
# conan 依赖库目录 —— 设备实测 3/3 PASS)
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "build() 内 _run_upstream_tests(): make check（tests/Makefile.am 注册 3 项）"

# 上游注册测试 (tests/Makefile.am check_PROGRAMS + TESTS)
upstream_tests:
  - file: tests/autocompletion
    source: openconnect-8.10/tests/autocompletion
    description: "bash 补全脚本测试（执行构建出的 openconnect 二进制解析 --help/--version）"
    command: "make check"
  - file: tests/lzstest.c
    source: openconnect-8.10/tests/lzstest.c
    description: "LZS 解压单元测试 (C)"
    command: "make check"
  - file: tests/seqtest.c
    source: openconnect-8.10/tests/seqtest.c
    description: "ESP 序列号重放窗口测试 (C)"
    command: "make check"

# 上游未注册进 check_PROGRAMS 的脚本测试（tests/scripts/，需 VPN 服务器/softhsm2/root netns，
# 在 conan 沙箱内不可运行，逐项原因见 notes.md 与 reports/test-report.md）
# - test-auth-pkcs11 / auth-*: 需要 ocserv 测试服务器 + softhsm2 PKCS#11 令牌
# - bad_dtls / dtls-psk: 需要 DTLS 服务器端配合
# - 这些均属"依赖外部测试基础设施"（比赛 FAQ #18 路径 B 范畴）

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "openconnect --version 版本横幅验证 (含 GnuTLS 特性列表)"
    command: "self.run(openconnect --version)"

# 测试结论: make check 3/3 PASS（autocompletion/lzstest/seqtest）；
# test_package 版本横幅验证通过（设备实测输出含 v8.10 + GnuTLS 3.8.10 + DTLS/ESP）
assertion_count: 4
