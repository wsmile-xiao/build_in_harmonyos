software: oidn
display: "OpenImageDenoise"
description: "Intel's high-performance denoising library for ray tracing rendering"
category: gfx
homepage: "https://openimagedenoise.github.io"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "musl libc 不支持 pthread_getaffinity_np/setaffinity_np，需替换为 sched_getaffinity/sched_setaffinity"
    - "OIDN_ARCH 自动检测在 HarmonyOS 上失效，需手动指定 -DOIDN_ARCH=ARM64"
    - "ISPC 需要 LLVM 18+，系统 LLVM 15 不满足要求，需手动安装"
    - "预训练权重（Git LFS）网络下载困难，需外部获取"
  common_dependencies:
    - tbb
    - ispc
    - llvm

versions:
  "2.5.0":
    status: published
    build_date: "2026-06-09"
    published_as: OpenImageDenoise