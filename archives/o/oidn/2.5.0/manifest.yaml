software: oidn
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.5.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"
compile_date: "2026-06-09"

# 构建系统类型
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gh-proxy.com/https://github.com/OpenImageDenoise/oidn/releases/download/v2.5.0/oidn-2.5.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DOIDN_DEVICE_CPU=ON"
  - "-DOIDN_ARCH=ARM64"
  - "-DTBB_ROOT=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - tbb/2021.13.0
  - ispc/1.30.0
  - llvm/18.1.8
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-cmake-oidn_platform.cmake.patch"
- "0002-core-thread.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "musl libc 不支持 pthread_getaffinity_np/setaffinity_np，需替换为 sched_getaffinity/sched_setaffinity"
- "OIDN ARCH 自动检测在 HarmonyOS 上失效，需手动指定 -DOIDN_ARCH=ARM64"
- "ISPC 需 LLVM 18+，系统 LLVM 15 不满足要求"
- "musl libc 系统无法使用 glibc 预编译的 ISPC 包（ABI 不兼容）"

# ============================================================
# 质量测试备注
# ============================================================

quality_notes: |
  功能测试结果 (2026-06-09):

  测试状态: PARTIAL（核心功能正常，运行时受限）

  验证通过项:
  - LLVM/Clang 18.1.8: 版本验证 PASS, AArch64 目标支持 PASS, LLVM IR 生成 PASS
  - TBB 2021.13.0: 库完整性 PASS, 符号导出 PASS, 头文件完整 PASS
  - ISPC 1.30.0: 版本验证 PASS, NEON 目标支持 PASS, 编译测试 PASS（完全通过）
  - OIDN 2.5.0: 库完整性 PASS, API 符号 PASS, CPU device 支持 PASS

  遗留问题:
  1. 运行时库缺失: 缺少 libc++_shared.so，影响可执行文件运行
  2. 系统头文件: 需要 OHOS SDK 提供 C/C++ 标准库头文件才能编译完整程序
  3. RPATH 问题: OIDN 库使用相对路径依赖 (../libOpenImageDenoise_core.so)

  建议: 在 OHOS 设备/模拟器上运行完整功能测试，添加 libc++ 运行时库

