knowledge_gained:
  - "openkim-models 为 OpenKIM 势模型集合纯数据包：34 个模型驱动源码目录（C++，上游由 kim-api 的 collections-management 编译）+ 445 个 portable-model 参数集 + 96 个 simulator-model 定义，共 4228 文件；Debian 以 openkim-models 1:2021.08.11 按 /usr/share/openkim-models/ 布局分发（all 架构无编译）"
  - "上游官方发行在 s3.openkim.org（txz），Debian/Ubuntu 再打包归档 openkim-models_2021.08.11.orig.tar.xz 无 +dfsg 后缀即未剔除内容，sha256 6104f6ea... 与 Launchpad .dsc PGP 记录一致；Ubuntu 池镜像（USTC/阿里云）对 CI worker 可达（kicad-library/lebiniou-data 实证）"
  - "KIM 集合结构不变量：每个条目目录必含 kimspec.edn（EDN 格式，extended-id 键值=目录名）、CMakeLists.txt 与 kimcite*.bib；575 条目目录 575 kimspec/CMakeLists，LICENSE* 606 个（9 个 ReaxFF/ASAP 仿真模型目录无 LICENSE 文件，上游即如此）"
  - "全树无软链、无测试套件（上游测试=kim-api 编译期验证，需先适配 kim-api）；根 LICENSE 为 CDDL-1.0"
  - "纯数据包适配范式（lebiniou-data/kicad-demos 同款）：build() 防漂移清单校验（3 目录逐目录计数 415/3108/703 + 根标记 2 文件）、package() 原样复制三集合目录+根 CMakeLists/LICENSE、package_id 清空、KIM_MODELS_DIR runenv 指向 share/openkim-models/"
  - "源同源性实证（2026-09-26）：s3 官方发行 txz（sha256 f42d2419...）全量下载后与 Debian orig 解包树逐文件 diff 零差异——Ubuntu 池镜像内容与官方发行完全一致"
  - "真机双坑（2026-09-26 首验抓出已修）：①OHOS clang 下 ::rmdir 无全局声明（MinGW 靠传递包含侥幸编译过）→ 探针显式 #include <unistd.h>；②package() 把 LICENSE 只放 licenses/ 漏了集合根（探针 G1 钉住）→ 集合树根一并复制，Debian 布局原样分发"
