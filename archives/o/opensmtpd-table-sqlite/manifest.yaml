software: opensmtpd-table-sqlite
display: "OpenSMTPD Table SQLite"
description: "OpenSMTPD 的 SQLite 表后端，提供基于 SQLite 数据库的表查询功能"
category: mail
homepage: "https://github.com/OpenSMTPD/table-sqlite"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools 项目，需要 automake 作为 tool_requires"
    - "依赖 sqlite3/3.49.1（conan 制品仓已发布）"
    - "HMDFS umask 077 workaround：configure/config.status 中 umask 077 需改为 022"
    - "构建产物为可执行文件 table-sqlite，安装到 libexec/smtpd/"
  common_dependencies:
    - sqlite3/3.49.1
    - automake/1.18

versions:
  "1.0.1-r0":
    status: built
    build_date: "2026-08-25"
