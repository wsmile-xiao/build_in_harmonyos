package: opensmtpd-table-sqlite/1.0.1-r0
homepage: "https://github.com/OpenSMTPD/table-sqlite"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: "Makefile.am"
    source: "table-sqlite-1.0.1/Makefile.am"
    description: "Upstream has no standalone test suite; make check passes with no tests defined."
    command: "make check"
test_package_tests:
  - file: "conanfile.py"
    description: "Runs the installed table-sqlite binary directly, verifying it starts and exits with expected error when no config is provided."
    command: "echo '' | table-sqlite"
assertion_count: 1
