# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁强制要求存在）

package: openiked/7.4
homepage: "https://github.com/openiked/openiked-portable"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试（regress/ 需要 root/pfkey 内核 IKE 环境——OHOS 设备不可行，
# 平台限制降级；消费者视角验证由下方 test_package 承担，R51 如实申报）
upstream_tests:
  - file: regress/dh
    source: openiked-portable-7.4/regress/dh
    description: "Upstream DH regression binary (needs build-time crypto only)"
    command: "ctest"

test_package_tests:
  - file: test_basic.sh
    description: "Consumer test: iked -V banner (rc=0) + ikectl usage (rc!=0) — signed ELF execution + crypto/event linkage"
    command: "test_basic.sh <bin-dir>"

# 测试断言总数 (近似值)
assertion_count: 4
