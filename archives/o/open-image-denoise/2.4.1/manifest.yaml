  - "OIDN CPU device requires ISPC compiler which cannot execute on HarmonyOS (permission denied due to security policy)"
  - "OIDN built with OIDN_DEVICE_CPU=OFF produces core library without ISPC/TBB dependencies"
  - "pthread_getaffinity_np/pthread_setaffinity_np not available on OHOS, use sched_getaffinity/sched_setaffinity instead"
