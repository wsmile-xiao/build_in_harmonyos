    - "-DOIDN_DEVICE_SYCL=OFF"
    - "-DOIDN_DEVICE_CUDA=OFF"
    - "-DOIDN_DEVICE_HIP=OFF"
    - "-DOIDN_APPS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - tbb/2021.13.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

