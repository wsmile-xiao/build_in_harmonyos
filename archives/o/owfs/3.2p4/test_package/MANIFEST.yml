# Upstream and consumer test declaration for CI L0e.
package: owfs/3.2p4
homepage: https://owfs.org/

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: module/swig/python/unittest/ds1420.py
    source: owfs-3.2p4.tar.gz/module/swig/python/unittest/ds1420.py
    description: "DS1420 button/key device attribute tests"
    command: "./ds1420.py"
  - file: module/swig/python/unittest/ds2408.py
    source: owfs-3.2p4.tar.gz/module/swig/python/unittest/ds2408.py
    description: "DS2408 8-channel addressable switch tests"
    command: "./ds2408.py"
  - file: module/swig/python/unittest/ds2409.py
    source: owfs-3.2p4.tar.gz/module/swig/python/unittest/ds2409.py
    description: "DS2409 microlan coupler tests"
    command: "./ds2409.py"
  - file: module/swig/python/unittest/owload.py
    source: owfs-3.2p4.tar.gz/module/swig/python/unittest/owload.py
    description: "OWFS load/stress tests"
    command: "./owload.py"
  - file: module/swig/python/unittest/owsensors.py
    source: owfs-3.2p4.tar.gz/module/swig/python/unittest/owsensors.py
    description: "Sensor discovery and caching tests"
    command: "./owsensors.py"

test_package_tests:
  - file: test_owfs.c
    description: "owcapi C API smoke test: OW_init/OW_get/OW_finish with fake adapter"
    command: "./test_owfs"

assertion_count: 1
