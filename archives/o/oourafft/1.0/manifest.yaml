version: "1.0"
software: "oourafft"
status: built
build_date: "2026-09-26"
build_system: "custom (upstream ships no build system; recipe compiles the C sources)"

source:
  url: "https://codeload.github.com/petewarden/OouraFFT/tar.gz/refs/tags/v1.0"
  sha256: "5f4dabc2ae21e1f537425d58a49cdca1c49ea11db0d6271e2a4b27e9697548eb"
  tar_format: tar.gz
  note: >-
    Debian orig oourafft_1.0.orig.tar.gz is byte-identical to the GitHub v1.0
    archive (sha256 matches), so the official codeload URL is used.

build:
  system: custom
  configure_options: []
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
  - "上游 OouraFFT-1.0 无任何构建系统，只有原始 Ooura FFT 的 C 源码与两个 sample/ 目录"
  - "fftsg.c/fft4f2d.c 各自定义同名私有 helper（makewt/bitrv2/cftf...），因此 fft4f2d 不能与 fftsg/fftsg2d 同时链接；只安装 fft2d_fftsg + fft2d_fftsg2d + fft2d_alloc（与 Debian libfft2d-dev 一致）"
  - "上游 sample1/testxg.c 可非交互运行：`echo 64 | ./testxg`，对 6 种变换做正反变换误差检查，误差均 < 1e-9"
