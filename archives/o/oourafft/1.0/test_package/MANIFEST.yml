# test_package/MANIFEST.yml
# oourafft 1.0 - upstream test declaration.

package: oourafft/1.0
homepage: "https://github.com/petewarden/OouraFFT"

upstream_tests_exist: true
upstream_test_audit: >-
  Upstream 1.0 ships no build system; the only test material is the original
  Ooura sample directory. sample1/testxg.c is the 1-D FFT test for the "fast"
  packages (fft*g.c): it fills a buffer with a deterministic LCG, applies the
  forward and inverse transform and prints the maximum round-trip error for
  each of cdft, rdft, ddct, ddst, dfct, dfst (6 checks). sample1/testxg_h.c is
  the equivalent for the simple "_h" variants (not built here); sample2/pi_fft.c
  is a benchmark (pi computation), not a test.
upstream_check_command: "clang sample1/testxg.c fftsg.c -lm -o testxg && echo 64 | ./testxg"
upstream_test_in_build: true
upstream_test_command: "clang -O2 sample1/testxg.c libfft2d_fftsg.a -lm -o testxg && echo 64 | ./testxg"
upstream_tests:
  - file: "sample1/testxg.c"
    description: "1-D forward+inverse round-trip error check for cdft/rdft/ddct/ddst/dfct/dfst (6 checks); recipe asserts every error < 1e-9"
test_package_tests:
  - file: test_oourafft.c
    description: "C consumer: libm sanity, 1-D cdft/rdft round trips, alloc helpers, and a 2-D cdft2d round trip"
    command: "clang test_oourafft.c -lfft2d_fftsg2d -lfft2d_fftsg -lfft2d_alloc -lm && ./test_oourafft"

test_files:
  - path: "test_package/test_oourafft.c"
    test_type: "R34"
    assertion_count: 7

test_package_test_count: 1
consumer_assertion_count: 7
upstream_test_cases: 6
assertion_count: 7
