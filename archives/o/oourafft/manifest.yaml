software: oourafft
display: "oourafft"
description: "Ooura 通用 FFT 包（离散 Fourier/Cosine/Sine 变换，1/2/3 维，长度 2^N）"
category: library
homepage: "https://github.com/petewarden/OouraFFT"
license: "Permissive (see readme.txt)"
build_system: custom

ohos_adaptation:
  key_points:
    - "上游无构建系统：配方把 fftsg/fftsg2d/fftsg3d/fft4f2d/shrtdct/alloc 直接编译为静态库"
    - "fft4f2d 与 fftsg 同名 helper 冲突，只安装 fft2d_fftsg + fft2d_fftsg2d + fft2d_alloc（同 Debian libfft2d-dev）"
    - "上游 sample1/testxg.c 以 `echo 64 |` 非交互运行，6 种变换正反变换误差 < 1e-9"
  common_dependencies: []

versions:
  - version: "1.0"
    status: built
    build_date: "2026-09-26"
