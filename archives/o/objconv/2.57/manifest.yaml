software: objconv
# 版本级 manifest
# 文件位置: archives/o/objconv/2.57/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.57"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://agner.org/optimize/objconv.zip"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "objconv 使用极简构建系统，无需 configure/make"
  - "源码包双层嵌套（objconv.zip + source.zip）"
  - "无平台适配需求，编译过程完全自包含"
  - "无依赖库，静态可执行文件"