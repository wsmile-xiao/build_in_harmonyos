software: orcania
display: "Orcania"
description: "Potluck with different functions for different purposes that can be shared among C programs"
homepage: "https://github.com/babelouest/orcania/"
license: "LGPL-2.1-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Pure C99 library with no runtime external dependencies (only libc)"
    - "LGPL-2.1-or-later license; static linking is fine for non-distributed use"
    - "Harmony PC aarch64 OHOS target is a normal linux-like environment; CMake native build works"
    - "Test suite (libcheck) requires libcheck + libsubunit; disabled in package but kept in upstream source"
    - "BUILD_BASE64URL controls whether the base64url CLI is built; keep default ON to expose the helper"
  common_dependencies:
    - libc

versions:
  "2.3.3":
    status: built
    build_date: "2026-09-07"
    notes: "Initial OHOS aarch64 adaptation. Pure C99; no upstream patch needed. Smoke validation via test_package C consumer."
