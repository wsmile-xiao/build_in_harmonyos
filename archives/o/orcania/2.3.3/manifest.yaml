version: "2.3.3"
software: orcania
status: built
build_date: "2026-09-07"
build_system: cmake

source:
  url: "https://github.com/babelouest/orcania/archive/refs/tags/v2.3.3.tar.gz"
  sha256: "e26947f7622acf3660b71fb8018ee791c97376530ab6c4a00e4aa2775e052626"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - BUILD_SHARED=OFF
    - BUILD_STATIC=ON
    - BUILD_BASE64URL=ON
    - BUILD_ORCANIA_TESTING=ON
    - BUILD_ORCANIA_DOCUMENTATION=OFF
    - WITH_STRSTR=OFF
  dependencies:
    - name: check
      version: 0.15.2
      role: test_requires  # build/run upstream CTest suite only; not a consumer dep

patches_applied:
  - patch_file: "patches/0001-ohos-subunit-optional.patch"
    patch_type: portability
    description: "Relax Subunit hard-requirement on OHOS (self-contained libcheck); upstream test/*.c unmodified."

knowledge_gained:
  - "orcania 2.3.3 is a self-contained C99 library; runtime deps = libc only. Test-build stage depends on check/0.15.2 (ohpcd)."
  - "Upstream v2.3.3 CTest suite = 4 programs (str_test/split_test/memory_test/pointer_list_test), EXCLUDE_FROM_ALL, Check framework; run 4/4 on OHOS aarch64 inside conan create."
  - "OHOS libcheck (check/0.15.2, ohpcd) is self-contained (no Subunit); upstream CMake's hard find_package(Subunit REQUIRED) on Linux/OHOS is a Debian-era default -> portability patch makes it optional without touching test sources."
  - "orcania's own cmake-modules/FindCheck.cmake is on CMAKE_MODULE_PATH; build() seeds CHECK_INCLUDE_DIR/CHECK_LIBRARY with the Conan check prefix so no host /usr lib is used. No CMAKE_PREFIX_PATH is passed: the toolchain sets CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON, which would resolve find_package(Check) to the installed check-config.cmake (Check::check / Check_FOUND) and skip upstream's module (Check::Check / CHECK_FOUND), dropping the CTest tree."
  - "Upstream test/*.c contain 410 ck_assert* macros total (str 294, split 24, memory 3, pointer_list 89); the test_package adds 5 HarmonyOS consumer API checks."
