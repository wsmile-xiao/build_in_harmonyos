# test_package/MANIFEST.yml — orcania 2.3.2
# CI L0e requires this file to exist. Upstream test declaration (rule 4:
# no fabricated pass rates — every number below is backed by the conan create
# build log which builds + runs the 4 unmodified upstream CTest programs).

package: orcania/2.3.2
homepage: "https://github.com/babelouest/orcania"

# Upstream v2.3.2 exposes a CTest suite via BUILD_ORCANIA_TESTING=ON
# (Check framework, 4 test programs under test/). The recipe's conanfile.py
# build() enables it and runs ctest against the unmodified upstream tests.
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

# The 4 official upstream CTest programs. Built explicitly (upstream marks them
# EXCLUDE_FROM_ALL) and executed on OHOS aarch64 during conan create; see the
# build log for "100% tests passed, ... out of 4". 51 START_TEST cases total
# (34 str_test + 11 pointer_list_test + 4 split_test + 2 memory_test), all
# registered via tcase_add_test and all executed/passed.
upstream_tests:
  - file: test/str_test.c
    source: orcania-2.3.2/test/str_test.c
    description: "string/base64/base64url/strdup APIs (Check framework; 34 START_TEST cases)"
    command: "./str_test"
  - file: test/split_test.c
    source: orcania-2.3.2/test/split_test.c
    description: "o_split/o_strsplit etc. (4 START_TEST cases)"
    command: "./split_test"
  - file: test/memory_test.c
    source: orcania-2.3.2/test/memory_test.c
    description: "o_malloc/o_realloc/o_free wrappers (2 START_TEST cases)"
    command: "./memory_test"
  - file: test/pointer_list_test.c
    source: orcania-2.3.2/test/pointer_list_test.c
    description: "pointer-list container APIs (11 START_TEST cases)"
    command: "./pointer_list_test"

# test_package tests (consumer perspective: link Orcania::Orcania-static and
# exercise the public API on OHOS aarch64) — HarmonyOS-added validation.
test_package_tests:
  - file: test_orcania.c
    description: "Compile + link consumer that calls o_strdup, o_strnullempty (3 branches: empty/non-empty/NULL), o_strcmp, o_strcasecmp, o_base64_encode, then asserts the binary runs and prints PASS"
    command: "./test_orcania"

# HarmonyOS-added consumer assertions only (5 API checks in a single binary run).
# The 4 upstream CTest programs are tracked separately in upstream_tests above.
assertion_count: 5