version: "2.3.2"
software: orcania
status: built
build_date: "2026-09-16"
build_system: cmake

source:
  url: "https://github.com/babelouest/orcania/archive/refs/tags/v2.3.2.tar.gz"
  sha256: "fcd93c554afeb694a36ac3c8bd1fa767028b373cb0b94a9396124c4e36d24038"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - BUILD_SHARED=OFF
    - BUILD_STATIC=ON
    - BUILD_BASE64URL=ON
    - BUILD_ORCANIA_TESTING=ON
    - BUILD_ORCANIA_DOCUMENTATION=OFF
    - WITH_STRSTR=OFF
  dependencies:
    - name: check
      version: 0.15.2
      role: test_requires  # build/run upstream CTest suite only; not a consumer dep

patches_applied:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_type: portability
    description: "Relax Subunit hard-requirement on OHOS (self-contained libcheck); upstream test/*.c unmodified."

knowledge_gained:
  - "OHOS CMake+Check 库上游 CTest 树：find_package(Subunit REQUIRED) 需去 REQUIRED + if(SUBUNIT_FOUND) 条件链接（libcheck/check-0.15.2 自包含，测试只用 check.h）"
  - "FindCheck 模块种子注入 CHECK_INCLUDE_DIR/CHECK_LIBRARY；禁用 CMakeDeps 以免 CONFIG 模式（CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON）让 CHECK_FOUND 守卫失效、CTest 树静默跳过"
  - "finish refresh-patch 会把补丁重命名为 0001-CMakeLists.txt.patch，conandata.yml patch_file 必须与之对齐，否则 conan create export_sources 报 Patch file does not exist"

patch_generation:
