      patch_description: "OHOS portability: relax upstream CMake's hard find_package(Subunit REQUIRED) and only link Subunit::Subunit when SUBUNIT_FOUND. The OHOS Conan libcheck (check/0.15.2) is self-contained and the 4 official CTest programs (str_test/split_test/memory_test/pointer_list_test) use only check.h. Upstream test/*.c and assertions are untouched."
