# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.8.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.8"

# 软件名
software: openlibm

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/JuliaMath/openlibm/archive/refs/tags/v0.8.8.tar.gz"

  # 源码校验和
  sha256: "721bab18ff37160fd9e903eb211ff26fdee38c3d0041d556b07d76089c435d17"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
# 编译中学到的知识
knowledge_gained:
- "openlibm 为 Makefile 驱动（无 configure），conan 配方用 makefile 模板且 build() 需 cwd=self.source_folder"
- "Openlibm 头文件装在 include/openlibm/ 子目录，cpp_info.includedirs 必须指向该子目录"
- "OHOS 消费者运行时无法解析 libopenlibm.so 动态库（HMDFS 加载问题），默认 shared=False 静态构建安装"
- "conan 2 的 tools.build:compiler_executables 是 dict 类型，须用 check_type=dict 读取，不能带 :c 后缀"
- "aarch64 上 long double 为 128 位（LONG_DOUBLE_NOT_DOUBLE=1），ld128/ 树参与编译"

# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
