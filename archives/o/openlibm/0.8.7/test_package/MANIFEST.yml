# test_package/MANIFEST.yml
package: openlibm/0.8.7
homepage: "https://github.com/JuliaMath/openlibm"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/test-double.c
    source: openlibm-0.8.7/test/test-double.c
    description: "双精度浮点数学函数测试 (1118 cases + 932 exception flag tests)"
    command: "./test/test-double"
  - file: test/test-float.c
    source: openlibm-0.8.7/test/test-float.c
    description: "单精度浮点数学函数测试 (1101 cases + 923 exception flag tests)"
    command: "./test/test-float"

test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 sin/cos/exp/log 基本数学函数正确性"
    command: "./test_openlibm"

assertion_count: 4074
