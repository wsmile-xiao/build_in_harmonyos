# 版本级 manifest — openlibm 0.8.7
# 遵循 ARCHIVE-SPEC v2.0

version: "0.8.7"
software: "openlibm"
status: published
build_date: "2026-09-04"
build_system: "makefile"

source:
  url: "https://github.com/JuliaMath/openlibm/archive/refs/tags/v0.8.7.tar.gz"
  sha256: "e328a1d59b94748b111e022bca6a9d2fc0481fb57d23c87d90f394b559d4f062"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "USECLANG=1"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "openlibm 使用 Makefile+Make.inc 构建系统，非 autotools/cmake"
  - "USECLANG=1 选择 clang 编译器，ARCH 自动检测为 aarch64"
  - "头文件安装在 include/openlibm/ 子目录，内部用无前缀 #include，需设置 includedirs"
  - "静态构建时只构建 libopenlibm.a，避免 CMakeDeps 误链接动态库"
