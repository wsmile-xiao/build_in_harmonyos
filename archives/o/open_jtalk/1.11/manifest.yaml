software: open_jtalk
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.11"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-16"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/open-jtalk/Open%20JTalk/open_jtalk-1.11/open_jtalk-1.11.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-hts-engine-header-path=/storage/Users/currentUser/usr/local/include"
    - "--with-hts-engine-library-path=/storage/Users/currentUser/usr/local/lib"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "hts_engine_API/1.10"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-config-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "open_jtalk 1.11 依赖 hts_engine_API，需指定 --with-hts-engine-header-path 和 --with-hts-engine-library-path 配置选项"
  - "open_jtalk 1.11 内置 MeCab 分词器和 NAIST 词典（mecab-naist-jdic），make 时自动构建词典数据到 dic/ 目录"
  - "open_jtalk 配置的 CONFIG_SHELL 必须设为 bash，因为 /bin/sh 是 musl shell 不兼容 autotools configure"
  - "open_jtalk 运行时需额外下载 HTS voice 模型文件（如 nitech_jp_atr503_m001.htsvoice），不在源码包中"
  - "open_jtalk 的 hts_engine_API 依赖不在 cmd-pkgs 预编译包中，需手动从 SourceForge 下载编译"
  - "open_jtalk 的 HTS_misc.c 中 fpos_t 在 HarmonyOS 上是16字节结构体，需用 ftell() 替代 fgetpos 方案（此修补在 hts_engine_API 中）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/open_jtalk-1.11.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/open_jtalk-1.11.work
  source_orig_hash: 71ab6900eab4743c
  source_work_hash: 1c4d7c5fcfb82ce1
  generated_at: '2026-06-16T07:39:19'
  patches_count: 3

patch_classification:
  - file: 0001-config-config.guess.patch
    type: platform_detection
    platform_only: True
    guard: 'always'  # HarmonyOS 平台检测需要更新的 config.guess
    description: '将 2013 版 config.guess 替换为 2023 版（来自 automake-1.17），以支持 aarch64-unknown-linux-ohos triplet 检测'
  - file: 0002-config-config.sub.patch
    type: platform_detection
    platform_only: True
    guard: 'always'  # HarmonyOS 平台检测需要更新的 config.sub
    description: '将 2013 版 config.sub 替换为 2023 版（来自 automake-1.17），以支持 aarch64-unknown-linux-ohos triplet 检测'
  - file: 0003-configure.patch
    type: hmdfs_compat
    platform_only: True
    guard: 'hmdfs'  # 仅在 HMDFS 文件系统环境下需要
    description: '移除 configure 中 mktemp -d 和 mkdir 前的 umask 077，因为 HMDFS 文件系统忽略 umask 设置导致临时目录权限为 0700 无法写入文件'
