software: openttd-opengfx
build_system: custom
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/8.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cdn.openttd.org/opengfx-releases/8.0/opengfx-8.0-all.zip"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # OpenGFX 是数据包，使用预构建包安装

  # 编译依赖列表（格式: name/version）
  dependencies:
    - nml/0.9.0
    - Pillow/12.2.0
    - clang/15.0.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无补丁 - 使用预构建包

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OpenGFX 是数据包而非传统可编译软件，需要 nmlc + grfid 从源码编译"
  - "PIL .so 在 HMDFS 上 Permission denied（即使签名后），无法从源码编译 .grf"
  - "grfcodec 需要 Boost C++ 库，环境中不可用"
  - "数据包适用预构建包安装方式"