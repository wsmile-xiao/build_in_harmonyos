# 失败详细说明
failure_details: |
  ostree v2026.1 编译失败，缺少必需依赖 e2p (ext2fsprogs)。

  **依赖检查结果**:
  ✅ glib 2.88.0（已安装）
  ✅ liblzma 5.6.2（已安装预编译包）
  ✅ zlib 1.3.1（已安装）
  ✅ libcurl 8.5.0（已安装）
  ✅ bison（已安装）
  ❌ e2p（缺失，阻塞）

  **依赖处理尝试**:
  1. 查询预编译包列表（resolve-deps --list-available）: 未找到 e2fsprogs/e2p
  2. 搜索下载 URL（search-url e2fsprogs）: 未找到自动下载链接
  3. 查找系统已安装: 未找到 libe2p 或 ext2_fs.h

  **configure 输出**:
  ```
  checking for e2p... no
  configure: error: Package requirements (e2p) were not met:
  No package 'e2p' found
  ```

  **源码分析**:
  - configure.ac 注释: "We're not actually linking to this, just using the header"
  - 实际使用: src/libostree/ostree-repo-commit.c 和 ostree-linuxfsutil.c 使用 ext2fs/ext2_fs.h
  - 依赖类型: 仅头文件，不链接库
  - 但 pkg-config 检查为必需依赖，无法绕过

  **根本原因**:
  - e2fsprogs 未收录在预编译包列表中
  - e2p 被 ostree configure.ac 设为必需依赖
  - 无法通过环境变量绕过 pkg-config 检查（AC_MSG_ERROR 硬编码）

  **解决方案建议**:
  1. 手动编译 e2fsprogs v1.47.0（推荐）
     - 源码: https://sourceforge.net/projects/e2fsprogs/files/e2fsprogs/v1.47.0/
     - 编译产物: libe2p.so + ext2fs/ext2_fs.h + e2p.pc
     - 预估耗时: 30-60 分钟
  2. 将 e2fsprogs 添加到预编译包列表（长期方案）

  **编译进度**:
  - Phase 1 (init-build): ✅ 成功
  - Phase 2 (平台检测修复): ✅ 成功（应用 E007 补丁）
  - Phase 3 (依赖检查): ❌ 失败（e2p 缺失）
  - Phase 4 (configure): ❌ 阻塞
