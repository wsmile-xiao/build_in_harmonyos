# 软件级 manifest.yaml
# 文件位置: archives/o/ostree/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件基本信息
# ============================================================

# 软件名称
name: ostree

# 软件描述
description: Operating system and container binary deployment and upgrades

# 官方网站
homepage: https://ostreedev.github.io/ostree/

# 源码仓库
repository: https://github.com/ostreedev/ostree

# 许可证
license: LGPL-2.0-or-later

# 编程语言
language: C

# 构建系统
build_system: autotools

# 分类
category: system

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表（按版本号降序）
versions:
  - version: "2026.1"
    status: failed
    build_date: "2026-05-27"
    notes: "源码下载失败（GitHub访问受限，网络问题）"

# ============================================================
# 依赖关系
# ============================================================

# 上游依赖（本软件依赖的其他软件）
dependencies:
  required:
    - "glib >= 2.66.0"
    - "liblzma >= 5.0.5"
    - "zlib"
    - "e2p"
    - "bison"
  optional:
    - "libcurl >= 7.29.0"  # HTTP下载（推荐启用）
    - "gpgme >= 1.8.0"  # GPG签名验证
    - "openssl >= 1.0.1"  # 加密校验
    - "libarchive >= 2.8.0"  # tar解析
    - "libselinux >= 2.1.13"  # SELinux（禁用）
    - "libsystemd"  # systemd集成（禁用）

# 下游依赖（依赖本软件的软件）
dependents:
  - "flatpak"  # 应用分发框架
  - "rpm-ostree"  # Fedora CoreOS
  - "torizon-os"  # 嵌入式系统

# ============================================================
# 平台兼容性
# ============================================================

# OpenHarmony 兼容性
ohos_compatible: true

# 兼容性说明
compatibility_notes: |
  ✅ 适合OpenHarmony平台

  原因：
  - 不依赖Linux桌面栈（GTK+/X11/GNOME）
  - 核心依赖轻量且可移植（glib/liblzma/zlib）
  - 已有嵌入式系统成功案例（Torizon OS、汽车OS）
  - 提供原子化更新和回滚能力

  需要适配：
  - 引导加载器集成（OpenHarmony可能使用不同bootloader）
  - 禁用Linux特有依赖（systemd、selinux、libmount）
  - 文件系统特性（hardlinks、xattrs）

# ============================================================
# 备注
# ============================================================

notes: |
  当前阻塞：源码下载失败（GitHub访问受限）

  适合场景：
  - OpenHarmony系统OTA更新框架
  - A/B分区原子化升级
  - 文件系统版本控制

  已有嵌入式成功案例证明可行性。