version: "3.13"
software: onednn
status: built
build_date: "2026-09-15"
build_system: cmake
source:
  url: "https://github.com/uxlfoundation/oneDNN/archive/refs/tags/v3.13.tar.gz"
  sha256: "f90a34cc3f1a5af511570d72f4437205efdf97e1d28c576418daa7ef1a34daaa"
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
    - "-DONEDNN_CPU_RUNTIME=SEQ"
    - "-DONEDNN_GPU_RUNTIME=NONE"
    - "-DONEDNN_TARGET_ARCH=AARCH64"
    - "-DONEDNN_BUILD_GRAPH=OFF"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "OHOS 上必须显式 DNNL_TARGET_ARCH=AARCH64，否则默认 X64 会加 -msse4.1"
  - "CPU runtime 用 SEQ，避免 OpenMP"
