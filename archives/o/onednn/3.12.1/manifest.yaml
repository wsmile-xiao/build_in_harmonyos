version: "3.12.1"
software: onednn
status: built
build_date: "2026-09-19"
build_system: cmake
source:
  url: "https://github.com/uxlfoundation/oneDNN/archive/refs/tags/v3.12.1.tar.gz"
  sha256: "e1db6e9c3771ba137a6e9292c31870471362977760d0ca00adef2fd39e23840b"
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
    - "-DONEDNN_CPU_RUNTIME=OMP"
    - "-DONEDNN_GPU_RUNTIME=NONE"
    - "-DONEDNN_TARGET_ARCH=AARCH64"
    - "-DONEDNN_BUILD_GRAPH=OFF"
    - "-DONEDNN_BUILD_TESTS=ON"
    - "-DONEDNN_ENABLE_WORKLOAD=TRAINING"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "OHOS 上必须显式 DNNL_TARGET_ARCH=AARCH64，否则默认 X64 会加 -msse4.1"
  - "musl/OHOS 无 _SC_LEVEL*_CACHE_SIZE sysconf 键，xbyak_aarch64 需写死 L1/L2 容量"
  - "tests/CMakeLists.txt 需注释 add_subdirectory(benchdnn)，benchdnn 是独立基准套件"
