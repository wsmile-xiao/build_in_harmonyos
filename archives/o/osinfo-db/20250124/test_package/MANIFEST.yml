# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: osinfo-db/20250124
homepage: "https://libosinfo.org/"

# osinfo-db is a pure data package (XML/JSON files, no compilation)
# There is no upstream make check / ctest / meson test
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# No upstream test suite — data-only package
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: verify_data.sh
    description: "Verify osinfo-db data files (VERSION, directories, XML content) are correctly installed"
    command: "bash verify_data.sh <osinfo_dir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
