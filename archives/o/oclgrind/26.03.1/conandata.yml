patches:
  - patch_file: "patches/0001-tmpdir-env.patch"
    patch_description: "SPIR dump 临时目录优先取 TMPDIR/TMP/TEMP，回退 /tmp；只换临时根，不跳过测试"
    patch_type: "portability"
  - patch_file: "patches/0002-oclgrind-exe-realpath-fallback.patch"
    patch_description: "oclgrind launcher 在 realpath 失败时回退到未规范化的 exepath，不再直接退出；只改路径解析，不跳过测试"
    patch_type: "portability"
