package: oclgrind/26.03.1
homepage: "https://github.com/jrprice/Oclgrind"
upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - file: tests/kernels/TESTS
    source: Oclgrind-26.03.1/tests/kernels/TESTS
    description: "上游 kernel 仿真套件: 90 个用例 (alignment/async_copy/atomics/barrier/bugs/data-race/interactive/memcheck/misc/uninitialized/wait_event), 经 run_test.py + oclgrind-kernel 驱动"
    command: "ctest --output-on-failure"
  - file: tests/runtime/build_program.c
    source: Oclgrind-26.03.1/tests/runtime/build_program.c
    description: "上游 runtime 套件之一: 程序构建行为校验 (rt_build_program)"
    command: "ctest -R rt_build_program --output-on-failure"
  - file: tests/runtime/map_buffer.c
    source: Oclgrind-26.03.1/tests/runtime/map_buffer.c
    description: "上游 runtime 套件之一: 缓冲映射行为校验 (rt_map_buffer)"
    command: "ctest -R rt_map_buffer --output-on-failure"
  - file: tests/apps/vecadd/vecadd.c
    source: Oclgrind-26.03.1/tests/apps/vecadd/vecadd.c
    description: "上游 app 套件之一: 向量加法端到端 (app_vecadd)"
    command: "ctest -R app_vecadd --output-on-failure"
test_package_tests:
  - file: test_oclgrind.c
    description: "消费者测试: 链接 liboclgrind-rt 并调用 clGetPlatformIDs/clGetPlatformInfo/clGetDeviceIDs, 校验 Oclgrind 平台与设备可枚举"
    command: "./test_oclgrind"
  - file: conanfile.py
    description: "消费者测试: 运行 oclgrind --version, 校验 CLI 落盘可执行"
    command: "oclgrind --version"
assertion_count: 99
