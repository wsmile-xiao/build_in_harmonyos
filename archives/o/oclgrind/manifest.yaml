software: oclgrind
display: "Oclgrind"
description: "OpenCL device simulator and debugger"
category: utility
homepage: "https://github.com/jrprice/Oclgrind"
license: BSD-3-Clause
build_system: cmake
ohos_adaptation:
  key_points:
    - "CMake 构建, 需 LLVM/Clang >= 18.0 开发库与头文件 (上游硬要求)"
    - "LLVM/Clang >= 18 由 requires clang/22.1.8 提供 (ccls 已验证先例，ohpcd 制品仓已发布)"
    - "readline 仅用于交互调试器历史记录, 缺失时上游警告不断构建"
    - "oclgrind-rt 以 SONAME libOpenCL.so 提供 OpenCL 运行时, 保留 .so"
    - "上游测试为 97 个 ctest 用例 (90 kernel + 5 runtime + 2 app), 由 ctest 驱动"
  common_dependencies:
    - readline
versions:
  "26.03.1":
    status: built
    build_date: "2026-09-10"
