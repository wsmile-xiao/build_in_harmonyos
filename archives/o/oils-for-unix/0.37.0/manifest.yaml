# 版本级 manifest
# 文件位置: archives/o/oils-for-unix/0.37.0/manifest.yaml

version: "0.37.0"
software: "oils-for-unix"

# 编译状态（finish 阶段会校验/更新）
status: built

build_date: "2026-09-06"
build_system: "custom"

source:
  url: "https://oils.pub/download/oils-for-unix-0.37.0.tar.gz"
  sha256: "f4d41d20a0523dbcfbd4ba231f82edf25b08d4965d65bc71fcb56666d6743000"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "--prefix={package_folder}"
    - "--cxx-for-configure=clang"
    - "--without-readline"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-tolerate-in-tree-symlink-failure.patch"

knowledge_gained:
  - "oils-for-unix 上游为自定义 configure + _build/oils.sh 构建，非 autotools；configure 的 --cxx-for-configure 默认 cc，OHOS 无 cc 需显式传入 clang"
  - "OHOS 上 strip 重写后的 ELF 镜像执行报 Operation not permitted，需安装未 strip 的二进制"
  - "coreutils install 位于 /bin/install（不在默认 PATH），配方改为直接 copy 打包，避免依赖 install 命令"
