# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: oils-for-unix/0.37.0
homepage: "https://oils.pub/"

# 上游测试命令：发布 tarball 不包含完整测试套件（test/spec 目录仅在 git 仓库中），
# 且无 Makefile / `make check` 目标。构建验证即上游 INSTALL.txt 的 smoke test 流程。
upstream_check_command: "none (release tarball bundles no test suite; see notes.md)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（发布 tarball 未内置可运行测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，真实调用打包出的 osh/ysh 二进制)
test_package_tests:
  - file: test.sh
    description: "运行 osh/ysh/oils-for-unix 二进制，校验版本、POSIX shell 核心特性（变量展开、命令替换、管道/read、if/for、函数、case、退出码、glob）、YSH 结构化特性（list/dict/json read/字符串方法）以及错误路径（命令不存在、语法错误）"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
