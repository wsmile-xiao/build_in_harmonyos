# 软件级 manifest
# 文件位置: archives/o/oils-for-unix/manifest.yaml

software: oils-for-unix
display: "Oils for Unix"
description: "Oils 项目的 C++ 版 Unix shell，提供 OSH 与 YSH 两个 shell"

category: utility

homepage: "https://oils.pub/"
license: Apache-2.0

build_system: custom

ohos_adaptation:
  key_points:
    - "自定义 configure + _build/oils.sh 构建，需显式传入 --cxx-for-configure 与 --cxx"
    - "OHOS 无 GNU readline，使用 --without-readline 禁用可选依赖"
    - "strip 后的二进制在 OHOS 上触发 ELF 校验 EPERM，需打包未 strip 二进制"
  common_dependencies: []

versions:
  "0.37.0":
    status: built
    build_date: 2026-09-06
