software: osmfilter
# 文件位置: archives/o/osmfilter/0.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-21"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitLab 官方 archive）
  url: "https://gitlab.com/osm-c-tools/osmctools/-/archive/0.9/osmctools-0.9.tar.gz"

  # 源码校验和
  sha256: "2f5298be5b4ba840a04f360c163849b34a31386ccd287657885e21268665f413"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip | git
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 配置选项列表（Makefile 构建方式，无 configure 脚本）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # osmconvert 依赖 zlib
  dependencies:
    - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码补丁，仅修改了生成的 config.status）
patches_applied: []

# ============================================================
# 产物信息
# ============================================================

products:
  - name: osmfilter
    version: "1.4.4"
    type: binary
    size: 166336
  - name: osmconvert
    version: "0.8.10"
    type: binary
    size: 362944
    depends: [zlib]
  - name: osmupdate
    version: "0.4.5"
    type: binary
    size: 55680

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS上config.status umask 077创建的临时目录不可写入，需改为umask 007（E081）"
  - "git仓库源码需要autoreconf -fi生成configure脚本"
  - "init-build不支持git仓库URL，需要手动clone并创建tar.gz"
