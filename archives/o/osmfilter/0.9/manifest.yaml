software: osmfilter
# 文件位置: archives/o/osmfilter/0.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-16"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（git 仓库，需手动 clone 并打包）
  url: "https://gitlab.com/osm-c-tools/osmctools.git"

  # 源码校验和（手动创建的 tar.gz）
  sha256: "b35c6b18cece8ec20490c0beeb8b05575718ef64023f4176b1be96e576015e41"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip | git
  tar_format: git

# ============================================================
# 构建配置
# ============================================================

build:
  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  # osmconvert 依赖 zlib，但 zlib 已作为系统库安装
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码补丁，仅修改了生成的 config.status）
patches_applied: []

# ============================================================
# 产物信息
# ============================================================

products:
  - name: osmfilter
    version: "1.4.4"
    type: binary
    size: 166336
  - name: osmconvert
    version: "0.8.10"
    type: binary
    size: 362944
    depends: [zlib]
  - name: osmupdate
    version: "0.4.5"
    type: binary
    size: 55680

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS上config.status umask 077创建的临时目录不可写入，需改为umask 007（E081）"
  - "git仓库源码需要autoreconf -fi生成configure脚本"
  - "init-build不支持git仓库URL，需要手动clone并创建tar.gz"
