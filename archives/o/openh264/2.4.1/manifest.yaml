software: openh264
version: 2.4.1
status: built
category: multimedia
description: OpenH264 is a codec library which supports H.264 encoding and decoding
url: https://github.com/cisco/openh264
license: BSD-2-Clause

build_system: meson
configure_options:
  - --prefix=/storage/Users/currentUser/usr/local

dependencies:
  build:
    - meson >= 0.52
    - ninja
    - clang
  runtime:
    - pthread
    - libm

artifacts:
  libraries:
    - libopenh264.so.2.4.1
    - libopenh264.so.7
    - libopenh264.so
  headers:
    - codec_api.h
    - codec_app_def.h
    - codec_def.h
    - codec_ver.h
  executables:
    - h264dec
    - h264enc
  pkgconfig:
    - openh264.pc

platform_adaptations:
  - Added harmonyos to supported systems in meson.build
  - Created platform-harmonyos.mk using linux/gnu-chain configuration

compile_date: 2026-05-22
compiler: clang 15.0.4