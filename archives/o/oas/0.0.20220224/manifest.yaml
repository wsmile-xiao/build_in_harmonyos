upstream_tests:
  command: null
  test_count: 0
  notes: "Upstream ships no test suite: the release archive holds 12 files and neither configure.ac nor the two Makefile.am declare a TESTS/check target, so `make check` has nothing to run (清点命令与 0 命中的实测见 notes.md §3，全树文件清点与 autotools 实体失效形态见 §1 第 2-3 条). 本配方的可执行验证面是 test_package（4 条断言）。"

test_package:
  assertion_count: 4
  description: "Links liboas and runs four oas_address_score() assertions: a NULL argument yields the no-match sentinel, a sockaddr_in6 yields the sentinel or a positive rule number, two calls on the same address agree, and dlsym on the installed liboas.so resolves the exported oas_address_score. The connect() interposer is not exercised by test_package (disclosed in notes.md §3)."
