package: opendht/3.7.1
homepage: "https://github.com/savoirfairelinux/opendht"
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - file: tests/infohashtester.cpp
    source: opendht-3.7.1/tests/infohashtester.cpp
    description: "InfoHash cppunit tester"
    command: "./infohashtester"
  - file: tests/valuetester.cpp
    source: opendht-3.7.1/tests/valuetester.cpp
    description: "Value cppunit tester"
    command: "./valuetester"
  - file: tests/cryptotester.cpp
    source: opendht-3.7.1/tests/cryptotester.cpp
    description: "Crypto cppunit tester"
    command: "./cryptotester"
  - file: tests/dhtrunnertester.cpp
    source: opendht-3.7.1/tests/dhtrunnertester.cpp
    description: "DhtRunner cppunit tester"
    command: "./dhtrunnertester"
  - file: tests/storagetester.cpp
    source: opendht-3.7.1/tests/storagetester.cpp
    description: "Storage cppunit tester"
    command: "./storagetester"
  - file: tests/threadpooltester.cpp
    source: opendht-3.7.1/tests/threadpooltester.cpp
    description: "ThreadPool cppunit tester"
    command: "./threadpooltester"
test_package_tests:
  - file: test.cpp
    description: "Consumer test - InfoHash::get SHA-1 via GnuTLS"
    command: "./test_opendht"
assertion_count: 2
