# test_package/MANIFEST.yml
# Upstream official test declaration file

package: openjph/0.31.0
homepage: "https://github.com/aous72/OpenJPH"

# 上游测试入口（CTest；tests/ 目录的 gtest 套件）
upstream_check_command: "ctest"

# conanfile.py 的 build() 中已集成并执行上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试（tests/ 目录，gtest 用例）
# googletest 与测试码流由配方提供（gtest/1.17.0 + conandata test_codestreams），
# 替换上游 tests/CMakeLists.txt 的 FetchContent 联网下载，见 patches/0001
upstream_tests:
  - name: "test_executables"
    source: "tests/test_executables.cpp"
    count: 85
    description: "命令行工具端到端套件：ojph_compress/ojph_expand 编解码 + mse_pae/compare_files 质量校验，覆盖 9/7 与 5/3 变换、分块(Cblk)、码率(-rate)、量化(-qfactor)、无损(-reversible)、多解析、LRCP/RLCP/RPCL/PCRL/CPRL 进程序、PPM/YUV/PGM I/O 等"
    command: "ctest --output-on-failure -R TestExecutables"
  - name: "test_mixed_coc"
    source: "tests/test_mixed_coc.cpp"
    count: 1
    description: "库 API 常规：4 分量图像混合可逆/不可逆小波编码（COC/QCC marker 生成与回读，分量级可逆性保持），并做完整解码回读校验"
    command: "ctest --output-on-failure -R TestMixedCOC"

# test_package 测试（消费者视角）
test_package_tests:
  - file: test_openjph.cpp
    description: "生成 PPM 测试图 → ojph_compress 编码 → ojph_expand 解码 → 像素逐字节校验 + 库级 API 冒烟（版本宏 + j2c_infile/codestream init/decode/释放）"
    command: "./test_openjph"

# Approximate assertion count
assertion_count: 10
