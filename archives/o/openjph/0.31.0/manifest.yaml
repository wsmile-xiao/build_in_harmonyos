# 版本级 manifest
# 文件位置: archives/o/openjph/0.31.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.31.0"
software: "openjph"
status: built
build_date: "2026-09-12"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/aous72/OpenJPH/archive/refs/tags/0.31.0.tar.gz"
  sha256: "fe169dbbaae71a169a0a6a68dccb346616193252c1ca044217afa0d5d1dc436f"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DOJPH_ENABLE_TIFF_SUPPORT=OFF"
    - "-DOJPH_BUILD_TESTS=ON"
    - "-DOJPH_BUILD_EXECUTABLES=ON"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,"
    - "-DCMAKE_INSTALL_RPATH=$ORIGIN/../lib"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-tests-use-conan-gtest-and-local-codestreams.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OpenJPH 0.31.0 无 TBB 依赖（早期版本的 TBB 并行已在 0.31.0 移除），无需裁剪"
  - "CMake 在 OHOS 上不识别平台，需要手动设置 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 修复 SONAME"
  - "OJPH_ENABLE_TIFF_SUPPORT=OFF 可裁剪 libtiff 依赖，PPM/YUV I/O 不受影响"
  - "上游 gtest 套件（tests/，86 用例）原用 FetchContent 联网下载 googletest v1.14.0 与 jp2k_test_codestreams；改用制品仓已发布的 gtest/1.17.0（test_requires）+ conandata test_codestreams 源（commit 固定）后，可在离线 Conan/CI 环境完整执行"
  - "OHOS 上 CMake 不写 build tree 的 RPATH：执行上游测试（含测试进程 popen 出的 ojph_expand/ojph_compress）前需显式注入 libopenjph.so 的 LD_LIBRARY_PATH"
  - "gtest 包安装的上游 GTestConfig.cmake（lib/cmake/GTest）保留 GTest::gtest_main target，Conan CMakeDeps 组件体（gtest::gtest）不含该 target —— 通过 GTest_DIR 指向包内 config 即可零改动复用上游 target 名"
  - "target_arch.cmake 通过编译器预定义宏（#error 编译输出）检测架构，交叉编译安全"