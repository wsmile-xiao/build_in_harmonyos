ohos_adaptation:
  key_points:
    - "CMake 构建，需设置 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 修复 OHOS SONAME"
    - "裁剪 TIFF 支持（OJPH_ENABLE_TIFF_SUPPORT=OFF），PPM/YUV I/O 不受影响"
    - "0.31.0 无 TBB 依赖"
    - "上游 gtest 套件（86 用例）已纳入 Conan 构建并真实执行：gtest 用制品仓 gtest/1.17.0，测试码流 jp2k_test_codestreams 随配方下载（commit 固定），补丁 0001 移除上游 FetchContent 联网下载"
    - "OHOS 上 CMake 不写 build tree RPATH，执行上游测试前需注入 libopenjph.so 的 LD_LIBRARY_PATH"

