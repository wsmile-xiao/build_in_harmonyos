software: oidentd
version: 3.1.0
status: built
build_system: autotools
build_date: 2026-09-26

dependencies:
  required: []
  optional:
    - libnetfilter_conntrack（masq/NAT 支持所需；本配方 --disable-masq/--disable-nat/--disable-libnfct 全关，故不引入）

build_config:
  target: aarch64-linux-ohos
  options:
    - --disable-masq --disable-nat --disable-libnfct（关闭可选特性 → 0 运行时依赖）
    - --build=aarch64-linux-ohos --host=aarch64-linux-ohos（AutotoolsToolchain 不自行推导 OHOS 三元组，需显式注入）
    - tool_requires flex/2.6.4 + bison/3.8.2（configure 的 AC_PROG_LEX/AC_PROG_YACC 硬性探测，缺失即 AC_MSG_ERROR）
    - make -j1（R9）

patches_applied:
  - file: 0001-config.sub-linux-ohos.patch
    purpose: "上游 config.sub（GNU config 2018-02-24）不含 HarmonyOS：在 maybe_os 内核-OS 组合列表与 OS 接受列表中补入 linux-ohos*，使 --host=aarch64-linux-ohos 被接受（纯三元组列表扩展，不引入平台条件宏，R8）"
    lines_changed: 4
  - file: 0002-configure-tmpdir-umask.patch
    purpose: "E011 HMDFS 权限：autoconf 生成的 configure/config.status 用 `tmp=`(umask 077 && mktemp -d \"./confXXXXXX\")`` 建临时目录，而 GNU mktemp -d 恒以 0700 建目录（不受 umask 影响），HMDFS 又将新目录属主映射为 uid 20001006 并置 setgid 位，导致该进程无法写入自己刚建的目录（config.status: could not setup config files machinery）。改为 shell 唯一名 + umask 000 建目录，使权限在创建时确定（设备与 CI worker 语义一致）"
    lines_changed: 6
  - file: 0003-linux-sockaddr-storage.patch
    purpose: "E091 struct sockaddr_storage 重定义：OHOS sysroot 的 linux/socket.h 无条件定义该结构，而 Linux 后端（src/kernel/linux.c → 配置期生成 src/os.c）同时包含 <sys/socket.h> 与 <linux/netlink.h>，二者冲突（redefinition of 'sockaddr_storage'）。在包含内核头期间临时重命名内核侧定义、包含后还原；以 libc 特性检测（#if defined(__linux__) && !defined(__GLIBC__)）适配而非平台条件宏（R8）"
    lines_changed: 8

compatibility:
  level: high
  issues:
    - "ident 协议服务端需监听 113/TCP 且以 root 降权运行，容器/CI 环境无法进行端到端协议会话；验证以版本横幅 + 构建特性开关为准"
    - "man 页由上游 .adoc 预生成并随 release 一同发布，其 mtime 新于 .adoc，因此不触发 asciidoctor 规则（环境无 asciidoctor）"
  notes: "产物为 sbin 语义的守护进程，经 AutotoolsToolchain 的 --sbindir=${prefix}/bin 映射安装到 bin/，与 Conan application package_type 默认 bindirs=[bin] 一致"

test_results:
  type: auto
  passed: 4
  failed: 0
  skipped: 0
  note: |
    上游未提供自动化测试套件（树内无 make check / testsuite 目标），
    故验证分两层：test_package 以 `oidentd -v` 断言退出码、版本号 oidentd 3.1.0、
    "Build information:" 横幅与 Kernel driver=linux（4 条断言）；并以 --disable-*
    生效反证特性开关抵达 config.h。

knowledge_gained:
  - "oidentd release asset 内含预生成 configure/config.sub/install-sh 与 flex/bison 产物（src/cfg_scan.c、src/cfg_parse.c），因此无需 autoreconf/automake/libtool；但 git tag tarball 不含 configure，源选择必须固定为 release asset"
  - "configure.ac 复用单个 enableval 变量依次判断 AC_ARG_ENABLE，--disable-masq 与 --disable-nat 均归约到 masq_support=no，进而 want_libnfct=no，实现 0 运行时依赖"
  - "Conan AutotoolsToolchain 的 _default_configure_install_flags 会把 --sbindir 映射到第一个 bindir（application 默认 bin），省去 sbin→bin 手工折叠"
  - "upstream os.c 在 src/ 内按 $host_os 由 src/kernel/<os>.c 复制生成，configure 末尾以 $srcdir 相对路径写回 src/，因此必须 in-source 构建"

references:
  - https://github.com/janikrabe/oidentd
  - https://oidentd.janikrabe.com

patch_generation:
  method: conandata-patches
  patches_count: 3
