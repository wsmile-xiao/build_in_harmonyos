# conandata.yml — oidentd 3.1.0
# 上游官方项目: github.com/janikrabe/oidentd (tag v3.1.0)
# 官方源 = 上游 release asset（R39 官方 HTTPS 直链），包含预生成的
# configure / config.sub / config.h.in 与 flex+bison 产物
# src/cfg_scan.c、src/cfg_parse.c，无需 autoreconf 自举。
# sha256 已按 release asset 核验（262170 字节）。
#
# 注意: git tag tarball (gh-v3.1.0.tar.gz) 不含预生成 configure，
# 不可用；此处固定使用 release asset。

sources:
  url: "https://github.com/janikrabe/oidentd/releases/download/v3.1.0/oidentd-3.1.0.tar.gz"
  sha256: "cb2bdc9da6f136470830e899063be83a6fe9123ac65c5b785b8486e65a6b91b7"

patches:
  - patch_file: "patches/0001-config.sub-linux-ohos.patch"
    patch_description: "上游 config.sub (2018-02-24) 不认识 HarmonyOS uname 输出（uname -s = HarmonyOS）与 aarch64-linux-ohos 三元组：在 maybe_os 内核-OS 组合列表与 OS 接受列表中补入 linux-ohos*，使 --host=aarch64-linux-ohos 可通过（纯 OS 列表扩展，不引入平台条件宏，R8）"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-tmpdir-umask.patch"
    patch_description: "HMDFS 上 configure/config.status 建临时目录失败：autoconf 生成的 `tmp=`(umask 077 && mktemp -d \"./confXXXXXX\")`` 中 GNU mktemp -d 恒以 0700 建目录（不受 umask 影响），而 HMDFS 会把新目录属主映射为 uid 20001006 并使 setgid 位生效，导致当前进程无法写入自己刚建的目录（config.status: could not setup config files machinery）。改为 shell 唯一名 + umask 000 建目录（权限在创建时确定，设备与 CI worker 语义一致）"
    patch_type: "portability"
  - patch_file: "patches/0003-linux-sockaddr-storage.patch"
    patch_description: "平台内核头与 libc 头重复定义 struct sockaddr_storage：oidentd 的 Linux 后端（configure 生成 os.c 时取自 src/kernel/linux.c）同时包含 <sys/socket.h> 与 <linux/netlink.h>，OHOS sysroot 的 linux/socket.h 无条件定义该结构，与 libc 侧定义冲突（redefinition of 'sockaddr_storage'）。在包含内核头期间临时重命名内核侧定义、包含后还原，以 libc 特性检测（__GLIBC__）适配而非平台条件宏（R8）"
    patch_type: "portability"
