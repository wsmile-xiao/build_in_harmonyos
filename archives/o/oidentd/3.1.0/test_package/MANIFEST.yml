package: oidentd/3.1.0
homepage: https://oidentd.janikrabe.com

# Upstream ships no automated test suite: the tree contains only the
# autotools build system, C sources and doc/ (asciidoc) — there is no
# `make check` / testsuite / ctest target.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_oidentd.py
    description: "Run `oidentd -v` and assert the version banner, the verbose build-information block and Kernel driver=linux"
    command: "python3 test_oidentd.py <package>/bin/oidentd"

assertion_count: 4
