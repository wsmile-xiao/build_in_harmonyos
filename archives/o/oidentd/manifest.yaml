software: oidentd
display: "oidentd"
description: "RFC 1413 (Ident) 守护进程，为 IRC/邮件等场景提供可配置的连接身份查询服务"
category: network
homepage: "https://oidentd.janikrabe.com"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "源码固定取上游 release asset：其中含预生成的 configure/config.sub/install-sh 与 flex+bison 产物（src/cfg_scan.c、src/cfg_parse.c），故无需 autoreconf/automake/libtool 自举；git tag tarball 不含 configure，不可替代"
    - "可选特性全关（--disable-masq --disable-nat --disable-libnfct）：configure.ac 中 masq_support=no 会归约 want_libnfct=no，从而完全不链接 libnetfilter_conntrack → 0 运行时依赖"
    - "config.sub 不识别 HarmonyOS：补 0001-config.sub-linux-ohos.patch 扩展三元组列表（纯列表扩展，无 #ifdef __OHOS__ 平台宏，R8）"
    - "AutotoolsToolchain 不自行推导 OHOS 三元组（ohos-aarch64 profile 未设 tools.gnu:host_triplet）→ 显式传 --build/--host=aarch64-linux-ohos"
    - "configure 的 AC_PROG_LEX/AC_PROG_YACC 为硬性探测，缺失即报错 → tool_requires flex/2.6.4 + bison/3.8.2"
    - "os.c 由 configure 在源码树内按 $host_os 从 src/kernel/<os>.c 复制生成（src 内相对路径写回）→ 必须 in-source 构建（folders.build=\".\"）"
    - "上游 sbin_PROGRAMS=oidentd，经 AutotoolsToolchain 的 --sbindir=${prefix}/<首个 bindir> 映射落到 bin/，与 application 默认 bindirs=[bin] 一致，无需手工折叠"
  common_dependencies: []

versions:
  "3.1.0":
    status: built
    build_date: "2026-09-26"
    source_url: "https://github.com/janikrabe/oidentd/releases/download/v3.1.0/oidentd-3.1.0.tar.gz"
