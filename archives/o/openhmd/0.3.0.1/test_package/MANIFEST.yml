# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: openhmd/0.3.0.1
homepage: "https://github.com/OpenHMD/OpenHMD"

# 上游测试命令（autotools tests/unittests；上游 CMake 构建树不含 tests/，
# 本配方用独立小 CMake 工程原样编译同一批源码，语义等价于 make check）
upstream_check_command: "make check"

# 上游测试是否已在 conanfile.py build() 内执行（0.3.0.1 起为 true）
upstream_test_in_build: true
upstream_test_command: >-
  cmake -S <build>/upstream-unittests -B <build>/upstream-unittests/build
  -DOHMD_SOURCE_DIR=<source> -DOPENHMD_LIBRARY=<build>/libopenhmd.a
  && cmake --build <build>/upstream-unittests/build
  && ./openhmd_upstream_unittests

# 上游测试用例（源码零修改，原样编译执行）
upstream_tests:
  source: "tests/unittests/{main.c,vec.c,quat.c,highlevel.c}"
  count: 11
  cases:
    - test_ovec3f_get_dot
    - test_ovec3f_get_length
    - test_ovec3f_get_angle
    - test_ovec3f_normalize_me
    - test_oquatf_get_dot
    - test_oquatf_init_axis
    - test_oquatf_inverse
    - test_oquatf_diff
    - test_oquatf_get_rotated
    - test_highlevel_open_close_device
    - test_highlevel_open_close_many_devices

# test_package 消费者测试用例（公共头文件 <openhmd.h>，真实打开设备）
# 末条 test_ohos_loader_dependency_contract 为鸿蒙特有测试（OHOS 装载器 + hidapi
# 依赖闭包运行期契约；Linux/glibc 约定下无对应行为，单列不计入其它分类）
test_package_tests:
  source: "test_package/test.c"
  count: 8
  cases:
    - test_ctx_create_probe_destroy
    - test_device_list_metadata
    - test_device_open_close
    - test_device_properties
    - test_device_control_metadata
    - test_shader_source_strings
    - test_device_settings_and_pose_roundtrip
    - test_ohos_loader_dependency_contract

# 用例总数 = 上游 11 + 本适配消费者 7（1 单元 + 6 集成）+ 鸿蒙特有 1 = 19
test_case_count: 19
# 本适配 test_package/test.c 内的 TAssert 断言调用点条数（不含宏定义本身）
assertion_count: 89
