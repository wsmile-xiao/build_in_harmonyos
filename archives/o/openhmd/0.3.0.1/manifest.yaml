source:
  url: "https://github.com/OpenHMD/OpenHMD/archive/refs/tags/0.3.0.tar.gz"
  sha256: "ec5c97ab456046a8aef3cde6d59e474603af398f1d064a66e364fe3c0b26a0fa"
  upstream_tag: "0.3.0"
  note: "0.3.0.1 为适配改进版本（测试执行方式 + 消费者用例），源码与 0.3.0 一致"
build:
  system: cmake
  os: OHOS
  arch: aarch64
  library_type: static
  dependencies:
    - hidapi/0.14.0
  # 上游 11 例（构建期真实执行，全过）
  upstream_tests_in_build: 11
  # 本适配消费者 7 例 + 鸿蒙特有 1 例
  test_package_tests: 8
  # 其中鸿蒙特有 1 例（含在上一行的 8 例内，不重复计数）
  ohos_specific_tests: 1
patches_applied: 0
knowledge_gained:
  - "上游 FindHIDAPI 为 module 模式（find_library/find_path），与 conan CMakeDeps 的 config 模式不互通；直接注入 HIDAPI_LIBRARY/HIDAPI_LIBRARIES/HIDAPI_INCLUDE_DIR/HIDAPI_INCLUDE_DIRS 四个 cache 变量即可零补丁消费 conan 包（reference: 上游 cmake/FindHIDAPI.cmake + CMakeLists.txt:48）"
  - "上游驱动源码平铺 #include <hidapi.h>，而 conan hidapi 包头文件位于 include/hidapi/hidapi.h，注入的 include 目录需探测嵌套层级（reference: archives/h/hidapi/0.14.0/conanfile.py）"
  - "旧 cmake_minimum_required(VERSION 3.1) 在 CMake 4.x 下被拒，用 CMAKE_POLICY_VERSION_MINIMUM=3.5 传参解决，无需打补丁（reference: 上游 CMakeLists.txt:1 + CMake 官方兼容开关）"
  - "上游测试若不在 CMake 构建树（autotools/meson 独有），可在 build() 内用独立小 CMake 工程原样编译测试源码并链接刚构建的库，实现 build() 内执行上游测试（reference: docs/ADAPTATION_GUIDE.md 适配检查清单；先例 archives/a/ableton-link/3.1.2/conanfile.py）"
  - "OHOS 运行时装载契约与 Linux/glibc 约定不同：制品仓动态库只发布不带版本号的 .so（实测 libhidapi-libusb.so 存在、libhidapi-libusb.so.0 不存在），dlopen/dlsym/dladdr 由 libc 提供（/usr/lib 无独立 libdl.so）；openhmd 的 hidapi 后端驱动在运行期才解析 hid_* 符号，故用 dlopen(RTLD_NOW) + dlsym(驱动实引符号) + dladdr(路径归属) 一次性验证 hidapi → libusb-1.0 整条依赖闭包可解析（reference: 本机探针实测 + test_package/test.c 的 test_ohos_loader_dependency_contract）"
  - "消费者用例断言不得绑定环境相关返回值：hid_init() 依赖宿主 /dev/bus/usb 访问（开发机返回 0 / CI 沙箱返回 -1），断言 rc==0 会本机全绿而 CI 必红；应改按值域断言并把语义写进输出，且仅在初始化成功时调用配套 API（reference: knowledge/drafts/E548-draft-EADD.kv，CI build-51367 实测）"
