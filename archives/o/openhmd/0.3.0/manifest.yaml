# 版本级 manifest
# 文件位置: archives/o/openhmd/0.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.0"

# 软件名
software: "openhmd"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/OpenHMD/OpenHMD/archive/refs/tags/0.3.0.tar.gz"

  # 源码校验和
  sha256: "ec5c97ab456046a8aef3cde6d59e474603af398f1d064a66e364fe3c0b26a0fa"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5（cache 文件注入，兼容 CMake 4.x）"
  - "-DOPENHMD_EXAMPLE_SIMPLE=OFF（上游示例假定构建树内链接，conan 分离布局不适配）"
  - "HIDAPI_LIBRARY/HIDAPI_INCLUDE_DIR/HIDAPI_LIBRARIES/HIDAPI_INCLUDE_DIRS cache 注入（绕开 CMAKE_FIND_PACKAGE_PREFER_CONFIG 对上游 FindHIDAPI 模块的抢占）"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - hidapi/0.14.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "CMake 4.x 移除 <3.5 兼容：旧项目用 CMAKE_POLICY_VERSION_MINIMUM=3.5 初始 cache 变量解决，零源码补丁"
- "conan toolchain 的 CMAKE_FIND_PACKAGE_PREFER_CONFIG ON 会令上游 find_package(HIDAPI) 命中 CMakeDeps config 而绕过上游 Find 模块：预置 Find 模块的结果变量（单数）+ CMakeLists 消费变量（复数）双份 cache 即可打通"
- "OHOS 内核存在 /dev/hidraw* 与 /dev/bus/usb 节点（shell 用户不可读）；制品仓 hidapi/0.14.0 为 libusb 后端"
- "openhmd ohmd_device_getf(OHMD_ROTATION_QUAT) 返回融合状态（初始全 0），非驱动原始值——属性断言要用 ohmd_device_geti 直读"
