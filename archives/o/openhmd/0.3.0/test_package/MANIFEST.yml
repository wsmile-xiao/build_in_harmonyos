# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: openhmd/0.3.0
homepage: "https://github.com/OpenHMD/OpenHMD"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 0.3.0 的单元测试仅由 autotools (make check) / meson (meson test) 定义，
# CMake 构建树不含 tests/ —— 上游测试已在 test_package 中完整移植
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（tests/unittests/，本包测试为完整移植）
upstream_tests:
  - file: tests/unittests/main.c
    source: OpenHMD-0.3.0/tests/unittests/main.c
    description: "单元测试主入口：vec3f(4) + quatf(5) + highlevel(2) 共 11 个测试"
    command: "./unittests"
  - file: tests/unittests/vec.c
    source: OpenHMD-0.3.0/tests/unittests/vec.c
    description: "向量数学测试：normalize/length/angle/dot（5+6+4+3=18 项数据断言）"
    command: "./unittests"
  - file: tests/unittests/quat.c
    source: OpenHMD-0.3.0/tests/unittests/quat.c
    description: "四元数数学测试：init_axis/get_rotated/get_dot/inverse/diff（4+5+1+1+1=12 项数据断言）"
    command: "./unittests"
  - file: tests/unittests/highlevel.c
    source: OpenHMD-0.3.0/tests/unittests/highlevel.c
    description: "高层 API 测试：ctx 创建/设备探测/开合（含 dummy 设备 16 次开合压力）"
    command: "./unittests"

# test_package 中自带的测试 (消费者视角验证 — 上游 unittests 完整移植 + 公共 API 扩展)
test_package_tests:
  - file: test.c
    description: "上游 11 个单元测试移植（vec3f×4/quatf×5/highlevel×2）+ 公共 API 版本/枚举×2"
    command: "./test_openhmd"

# 测试断言总数 (近似值, 用于质量评估)
# vec: 18 + quat: 12 + highlevel: ~15 + public api: ~12 ≈ 57 项 TAssert
assertion_count: 57
