# 版本级 manifest — oatpp 1.3.1
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.1"

# 软件名
software: "oatpp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方 tag tarball）
  url: "https://github.com/oatpp/oatpp/archive/refs/tags/1.3.1.tar.gz"

  # 源码校验和（官方 release tarball SHA-256）
  sha256: "9dd31f005ab0b3e8895a478d750d7dbce99e42750a147a3c42a9daecbddedd64"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（OHOS aarch64）
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DOATPP_INSTALL=ON"
    - "-DOATPP_BUILD_TESTS=ON"
    - "-DOATPP_COMPAT_BUILD_NO_SET_AFFINITY=ON"
    - "-DOATPP_LINK_ATOMIC=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（oatpp 1.3.1 核心为纯 C++ 库，无外部 Conan 硬依赖）
  dependencies: []

  # 编译器（OHOS clang 15, aarch64-linux-ohos triplet）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本次适配无源码补丁；平台差异全部走上游 CMake 选项）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（OHOS 适配经验，每个候选条目已按 governance 流程查重，
# 复用知识 E092/E017；新增差异以草稿/notes 记录）
knowledge_gained:
  - "OHOS musl sysroot 无 pthread_setaffinity_np；使用上游选项 OATPP_COMPAT_BUILD_NO_SET_AFFINITY=ON 即可，无需源码补丁"
  - "OHOS 无 libatomic.a；aarch64 原子操作由 clang 内建实现，OATPP_LINK_ATOMIC=OFF 关闭上游 libatomic 链接"
  - "CMake 4.x 移除对 cmake_minimum_required(<3.5) 的兼容；老项目需在 configure 时传 -DCMAKE_POLICY_VERSION_MINIMUM=<最低版本>（toolchain 变量读取时机过晚，必须走 configure 命令行）"
  - "oatpp 安装到版本子目录 ${libdir}/oatpp-<ver>、${includedir}/oatpp-<ver>/oatpp；conanfile package_info 需显式声明 libdirs/includedirs，否则 CMakeDeps 报 Library not found / 头文件找不到"
