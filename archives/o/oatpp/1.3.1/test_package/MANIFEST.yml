# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: oatpp/1.3.1
homepage: "https://github.com/oatpp/oatpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 oatppAllTests 套件在适配期手工运行并通过（52/53），未集成进 conan create build()
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/oatpp/AllTestsMain.cpp
    source: oatpp-1.3.1/test/oatpp/AllTestsMain.cpp
    description: "oatpp 上游全部单元/集成测试入口（46 个 RUN_TEST 类 + 7 个显式 web 实例），单二进制 oatppAllTests，OATPP_BUILD_TESTS=ON 时构建"
    command: "./test/oatppAllTests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_oatpp.cpp
    description: "HarmonyOS HTTP 回环消费者测试：127.0.0.1 起 oatpp 服务端 + 客户端 GET /，校验 200 与响应体，验证 OHOS socket/线程/HTTP 栈"
    command: "./test_oatpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
