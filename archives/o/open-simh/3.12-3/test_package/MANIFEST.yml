package: open-simh/3.12-3
homepage: https://github.com/open-simh/simh

# 上游测试注册口径（rule4）：SIMH v3.12-3 的 GNU makefile 定义了
# RegisterSanityCheck 钩子（find_test = .../tests/<sim>_test.ini），但 v3.12-3
# 源码树不包含任何 tests/*.ini 文件（regress 测试体系是 simh v4 才引入的，
# v3.12-3 的 find . -name "*.ini" 为空）——上游构建系统注册的测试目标数为 0。
upstream_check_command: "find . -name '*.ini' | wc -l   # -> 0"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_simh.py
    description: "24 simulator banner smoke tests + pdp11 deposit/step functional test"
    command: "python3 test_simh.py <package>/bin"

assertion_count: 25
