# manifest.yaml — open-simh 3.12-3
# 遵循 ARCHIVE-SPEC v2.0

version: "3.12-3"
software: "open-simh"
status: published
build_date: "2026-09-11"
build_system: "makefile"

source:
  url: "https://codeload.github.com/open-simh/simh/zip/refs/tags/v3.12-3"
  sha256: "89db5dd31c3446430dfc67e422f59c5448ac2ae0ebe946e467564f481181550d"
  tar_format: zip

build:
  system: makefile
  configure_options:
    - "GCC=clang"
    - "NONETWORK=1"
    - "TESTS=0"
    - "CFLAGS_G=-fcommon"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "clang15 默认 -fno-common 拒绝老 C 代码的 tentative definition（pdp11_defs.h 的 uint32 uc15_memsize; 在多个翻译单元重复定义）——加 CFLAGS_G=-fcommon 恢复 C99 前语义"
  - "SIMH v3.12-3 无 install 目标，package() 手工拷贝 BIN/<sim> 到 bin/"
  - "SIMH v3 无 tests/*.ini（v4 才有 regress 体系），上游注册测试目标 N=0，测试口径为自建 24 模拟器冒烟+指令级功能实测"
