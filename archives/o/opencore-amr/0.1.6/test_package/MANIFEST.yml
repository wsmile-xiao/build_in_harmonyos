# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: opencore-amr/0.1.6
homepage: "https://sourceforge.net/projects/opencore-amr/"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/amrnb-decoder.c
    source: opencore-amr-0.1.6/test/amrnb-decoder.c
    description: "AMR-NB decoder test"
    command: "./amrnb-decoder"

test_package_tests:
  - file: test.c
    description: "消费者测试 - 验证 Decoder_Interface_init() API"
    command: "./test_opencore_amr"

assertion_count: 2
