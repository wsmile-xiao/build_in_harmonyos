sources:
  url: https://github.com/Project-OSRM/osrm-backend/archive/refs/tags/v26.5.0.tar.gz
  sha256: 3e4f5ed09ac0c77158314ef99b5f8c9e336a80339b3f0e62da48abd06acafef9
patches:
  26.5.0:
  - patch_file: patches/0001-boost-components-test-headers-libarchive-target.patch
    patch_description: 裁剪未使用的 boost date_time/thread 组件、测试改用 Boost.Test 头文件模式（included
      variant）、LibArchive 目标名对齐 Conan CMakeDeps
    patch_type: portability
  - patch_file: patches/0002-msb-countl-zero-fallback.patch
    patch_description: msb() 在无 std::countl_zero 的标准库上回退 __builtin_clzll 保留原语义
    patch_type: portability
  - patch_file: patches/0003-popcount-builtin-fallback.patch
    patch_description: bit_range size() 在无 std::popcount 的标准库上回退 __builtin_popcountll
      保留原语义
    patch_type: portability
  - patch_file: patches/0004-atomic-ref-builtin-fallback.patch
    patch_description: compare_and_swap 在无 std::atomic_ref 的标准库上回退 __atomic_compare_exchange_n
      保留原语义
    patch_type: portability
  - patch_file: patches/0005-test-member-non-included.patch
    patch_description: 单元测试成员TU回退为非included声明头，仅BOOST_TEST_MODULE主TU保留included模式，消除框架符号重复
    patch_type: portability
  - patch_file: patches/0006-testdata-makefile-node-free.patch
    patch_description: test/data Makefile 去 node 依赖：md5 校验改用系统 md5sum，移除 timer.js
      包装（设备 node/V8 在 musl 上不可用）
    patch_type: portability
  - patch_file: patches/0007-shm-lockdir-ohos-skip-probe.patch
    patch_description: shared_memory 锁目录测试增加 /dev/shm 可写性探测：OHOS namefs tmpfs 非特权进程不可创建文件时如实跳过，实现回退逻辑不受影响
    patch_type: portability
