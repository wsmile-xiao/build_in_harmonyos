software: odpi
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.6.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.6.4"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/oracle/odpi/archive/refs/tags/v5.6.4.tar.gz"

  # 源码校验和
  sha256: "d8ba665d9deb0f0c601e38de477d3808e7d426438b9e37345bef53f0e75687ea"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "make LDFLAGS=-shared PREFIX=$PREFIX"
  # ODPI 使用纯 Makefile，无 configure 脚本
  # LDFLAGS=-shared 需显式指定（环境变量覆盖 Makefile ?= 默认值）

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 无外部依赖（仅系统库 -ldl -lpthread）

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ODPI 使用纯 Makefile（非 autotools），无 configure 脚本，build_system 应为 makefile"
  - "Makefile LDFLAGS ?= -shared 被环境变量覆盖，需显式传 LDFLAGS=-shared"
  - "Makefile 不支持 DESTDIR，make install 直接到 PREFIX 目录"
  - "无 make check 目标（测试需要 Oracle DB 连接）"
