# test_package/MANIFEST.yml
# odpi 6.0.0 — 测试声明
#
# 上游测试清点（R51/R52，如实申报）：
#   * 评审工具口径（dpiTest_ 字面引用去重实测）：N=512
#   * 本地上游源码复现：test/ 下 36 个测试模块（test_1000_context.c ~
#     test_4500_sessionless_txn.c）以 dpiTestSuite_addCase 注册 463 例；
#     test/*.c 的 addCase 行数 465（含 TestLib.c 框架内部 2 处）；
#     其余约 46 处为同一用例标识在 TestSuiteRunner/注册描述等处的字面
#     引用重复，非独立可执行用例。
#   * 本包 N'=0：全部用例需 Oracle Client（libclntsh.so）+ 可达 Oracle DB，
#     鸿蒙 PC 无此生态，0 例可运行（非删改，上游用例原样保留）。
#   * Makefile 无 check target，上游测试未集成进 build()。
#
# 鸿蒙特有验证（R12/R53）：test_package/test_ohos.py — pure-python（仅
# stdlib struct，无 readelf/objdump/llvm-readelf/file 外部依赖），对
# lib/libodpic.so.6.0.0 做 9 项独立断言（见下），失败即非零退出。

package: odpi/6.0.0
homepage: https://github.com/oracle/odpi

# 上游无独立 check target；test/ 目录测试需 Oracle Client/DB
upstream_check_command: "(none — no check target; tests require Oracle DB)"

# conanfile.py build() 中未集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游 test/ 测试需 Oracle Client/DB，不在 CI 跑（make check 无 target）
upstream_tests: []

# test_package 消费者测试 — 实质依赖被测包
test_package_tests:
  - file: test.c
    source: archives/o/odpi/6.0.0/test_package/test.c
    description: "消费者实跑：调用 dpiContext_createWithParams 验证库符号/头文件/动态链接（无 Oracle Client 时走 DPI- 错误路径，仍证明库已正确加载）"
    command: "./test_odpi"
    api_calls:
      - dpiContext_createWithParams
      - DPI_VERSION_NUMBER
  - file: test_ohos.py
    source: archives/o/odpi/6.0.0/test_package/test_ohos.py
    description: "R53 鸿蒙特有 9 断言（pure-python ELF 解析，无 readelf 依赖）：ELF magic / ELFCLASS64+LE / e_type=ET_DYN+e_machine=AArch64(183) / 程序头解析+PT_INTERP 策略（若有必须为 ld-musl-aarch64.so.1）/ .note.ohos.ident 标记(owner OHOS) / .codesign 段 / DT_NEEDED 非空 / DT_SONAME=libodpic.so.6 / 无 DT_RPATH·DT_RUNPATH"
    command: "python3 test_ohos.py <pkg>/lib/libodpic.so.6.0.0"
    harmony_specific: true
    assertions:
      - "ELF magic \\x7fELF"
      - "EI_CLASS=2 (ELF64) + EI_DATA=1 (little-endian)"
      - "e_type=3 (ET_DYN shared object) + e_machine=183 (EM_AARCH64)"
      - "program headers 解析 + PT_INTERP 策略（存在时必须为 ld-musl-aarch64.so.1）"
      - "section .note.ohos.ident 存在且 note owner == OHOS"
      - "section .codesign 存在且非空"
      - "dynamic DT_NEEDED 非空且全部可解析"
      - "dynamic DT_SONAME == libodpic.so.6"
      - "无 DT_RPATH / DT_RUNPATH"

# 鸿蒙特有测试断言数（test_ohos.py 9 项，与 PR 正文一致）
assertion_count: 9
