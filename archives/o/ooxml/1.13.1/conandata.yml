sources:
  "1.13.1":
    url: "https://fossil.sowaswie.de/ooxml/tarball/version-1.13.1/ooxml-1.13.1.tar.gz"
    sha256: "ee6c87c4e564c2ca76640022dfcabacef9c29658bc7996532a21297cd0712809"
patches:
  "1.13.1":
    - patch_file: "patches/0001-tests-xlsx-formula.test.patch"
      patch_description: >-
        xlsx-formula.test 对 Tcl < 9 硬性 `package require vfs::zip`，在只有内建
        zlib zip 读取器的环境（无 tclvfs / tcllib）整文件报错退出、全部用例不执行。
        改为容错加载：有 tclvfs 则加载，无则回落到库的内建 zlib 读取器（xl_read
        的默认首选路径）。仅测试文件，不改库代码。
      patch_type: "test"
    - patch_file: "patches/0002-tests-xlsx-simple.test.patch"
      patch_description: >-
        xlsx-simple.test 的 else 分支（Tcl 9 zipfs 与 tcllib 之外的场合）假定
        tclvfs 存在：MountXLSX-2.1 直接 vfs::zip::Mount、DocPropsApp-3.1 /
        DocPropsCore-4.1 直接 open ${zipfs}…，无 tclvfs 时连锁失败。补齐
        zipAccessMethod == "zlib" 分支：MountXLSX-2.1 用库内建 ZipOpen 验证、
        两个 DocProps 用例用 ::ooxml::ZlibZipGet 读回成员、结尾清理分支相应补
        zlib 场合（close zlibfd）。仅测试文件，不改库代码。
      patch_type: "test"
