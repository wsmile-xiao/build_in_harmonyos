package: ooxml/1.13.1
homepage: "https://fossil.sowaswie.de/ooxml/"

# 上游官方测试在 recipe 的 build() 里真跑（tests/all.tcl，tcltest 套件；
# CI 的 host/build profile 同为 ohos-aarch64 → 原生构建 → 真跑）。
upstream_test_in_build: true
upstream_test_command: "tclsh8.6 tests/all.tcl -load \"package ifneeded ooxml 1.13.1 ...\"（TCL_LIBRARY/TCLLIBPATH/TZ 由 recipe 注入）"

upstream_tests:
  - file: tests/all.tcl
    source: ooxml-1.13.1/tests/all.tcl
    description: >-
      tcltest 驱动的主测试入口，source 29 个测试文件（docx 19 个 +
      xlsx 10 个：basic/comments/ecma/features/headerfooter/import/lib/math/
      media/misc/notes/pkg/reg/settings/style/tables/val/write、benchmark/
      bigpart/formatcell/formula/misc/namedfmts/printarea/readerror/simple/view）。
      实测 626 个用例（Passed 617 / Skipped 9 / Failed 0），完全无头。
      配方内两处测试补丁仅补齐 zipAccessMethod=zlib 分支（无 tclvfs/tcllib 时），
      不改库代码；TZ=Europe/Berlin 忠实复现上游时区敏感用例预期。
    command: "tclsh8.6 tests/all.tcl -load \"package ifneeded ooxml 1.13.1 [list source ooxml.tcl]\""
upstream_summary:
  total: 626
  passed: 617
  skipped: 9
  failed: 0
  note: >-
    本机原生复现（同一份源码 + 配方同款环境：tcl/8.6.16 的 tclsh8.6 +
    tdom/0.9.6 + TZ=Europe/Berlin）实测汇总行 all.tcl: Total 626 Passed 617
    Skipped 9 Failed 0；skip 明细：mutation 9（tcltest 约束，需变异测试工具）。

test_package_tests:
  - file: test_ooxml.tcl
    description: >-
      完整消费者用例（rule12 端到端业务流程）：用交付的 lib/ooxml1.13.1/
      （pkgIndex.tcl + ooxml*.tcl）经 package require ooxml 加载，
      xl_write 生成 xlsx（双 sheet/字符串/数值）→ xl_read（内建 zlib zip
      读取器）读回逐项核对 → 数值格式写入读回往返 → docx 导出（tdom 后端）
      → 内建 zip 读取器校验 docx 包内成员与 document.xml 内容 → 错误路径，
      12 项可核对结果，任一失败退出码非零。
    command: "tclsh8.6 test_ooxml.tcl <package_folder>"
  - file: test_layout.py
    description: >-
      适配自检（M=12）：TEA 布局（lib/ooxml1.13.1/ 下 4 个运行期脚本 +
      pkgIndex.tcl）、pkgIndex 注册 1.13.1/docx 0.6、无模板占位符、ooxml.tcl
      实质内容（xl_write/xl_read）、license.terms、无 bin/（无需 commands.json）、
      无 usr/ 前缀、无隐藏文件（JC5）、未夹带上游 tests/。
    command: "python3 test_layout.py <package_folder>"

assertion_count: 12
