software: ooxml
display: "ooxml"
description: "Pure-Tcl Office Open XML library: read/write Excel .xlsx (xl_write/xl_read/tablelist_to_xl) and export Word .docx"
category: office
homepage: "https://fossil.sowaswie.de/ooxml/"
license: alexander-shoepe
build_system: none

ohos_adaptation:
  key_points:
    - "纯 Tcl 包，无编译产物：交付 lib/ooxml1.13.1/ 下的 ooxml*.tcl + pkgIndex.tcl（pkgIndex.tcl.in 模板替换生成）"
    - "依赖 tcl/8.6.16（tclsh8.6 运行时 + tcltest）与 tdom/0.9.6（docx 写入路径），均仓库已发布"
    - "读 xlsx 优先走内建 zlib zip 读取器，无需 tclvfs/tcllib；tests/ 两处假定 tclvfs 的用例以测试补丁补齐 zlib 分支"
    - "上游测试 docProps 时间戳用例期望值按维护者时区（Europe/Berlin +01）硬编码，跑测试时显式设 TZ=Europe/Berlin"
  common_dependencies:
    - tcl/8.6.16
    - tdom/0.9.6

versions:
  "1.13.1":
    status: published
    build_date: "2026-10-04"
    published_as: ooxml
