# conandata.yml — openscap 1.4.3
# Sources and patches for OpenSCAP 1.4.3 OHOS adaptation

sources:
  url: "https://github.com/OpenSCAP/openscap/archive/refs/tags/1.4.3.tar.gz"
  sha256: "858799e405b58c662a6f32df02fe216ac1a88b7e372d4461ee9bb17875c68f10"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Map Conan imported targets to old-style CMake variables, add XMLSEC_CRYPTO_OPENSSL for all platforms, add CURL include dirs"
    patch_type: "portability"
  - patch_file: "patches/0002-compat-CMakeLists.txt.patch"
    patch_description: "Enable dev_to_tty compat source on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0003-src-OVAL-CMakeLists.txt.patch"
    patch_description: "Use ENABLE_PROBES_UNIX instead of UNIX for fts_sun.c inclusion"
    patch_type: "portability"
  - patch_file: "patches/0004-src-OVAL-fts_sun.c.patch"
    patch_description: "Enable fts_sun.c on OHOS, add _D_EXACT_NAMLEN macro"
    patch_type: "portability"
  - patch_file: "patches/0005-src-OVAL-probes-SEAP-sch_queue.c.patch"
    patch_description: "HarmonyOS doesn't support pthread_cancel - no-op macros"
    patch_type: "portability"
  - patch_file: "patches/0006-src-OVAL-probes-crapi-CMakeLists.txt.patch"
    patch_description: "Link libgcrypt target for include dir propagation"
    patch_type: "portability"
  - patch_file: "patches/0007-src-OVAL-probes-oval_fts.c.patch"
    patch_description: "Use fts_sun.h on OHOS instead of missing fts.h"
    patch_type: "portability"
  - patch_file: "patches/0008-src-OVAL-probes-oval_fts.h.patch"
