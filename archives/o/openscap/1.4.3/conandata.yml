    patch_type: "portability"
  - patch_file: "patches/0010-src-OVAL-probes-probe-input_handler.c.patch"
    patch_description: "HarmonyOS doesn't support pthread_cancel - no-op macros"
    patch_type: "portability"
  - patch_file: "patches/0011-src-OVAL-probes-probe-probe_main.c.patch"
    patch_description: "HarmonyOS doesn't support pthread_cancel - no-op macros"
    patch_type: "portability"
