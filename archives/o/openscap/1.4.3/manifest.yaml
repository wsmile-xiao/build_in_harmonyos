knowledge_gained:
  - "OpenSCAP uses CMake (not autotools) build system"
  - "HarmonyOS lacks pthread_cancel (no-op macros needed)"
  - "HarmonyOS lacks fts.h (use fts_sun.h compat)"
  - "HarmonyOS lacks fgetpwent/fgetspent (implement compat)"
  - "HarmonyOS lacks program_invocation_short_name (use getprogname)"
  - "Conan CMakeDeps needs direct requires for all find_package targets"
  - "fts_sun.c guarded by OS_SOLARIS, needs HAVE_FTS_OPEN feature detection"

