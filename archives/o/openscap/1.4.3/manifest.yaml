    - "ENABLE_SCE=OFF"
    - "ENABLE_PYTHON3=OFF"
    - "ENABLE_PERL=OFF"
    - "OPENSCAP_ENABLE_SHA1=ON"
    - "OPENSCAP_ENABLE_MD5=ON"
  dependencies:
    - "libxml2/2.15.3"
    - "libxslt/1.1.45.2"
    - "xmlsec1/1.3.11"
    - "openssl/3.5.6"
    - "pcre2/10.47"
    - "libgcrypt/1.12.2"
    - "bzip2/1.0.8"
    - "libcurl/8.5.0"
  cc: clang
  cxx: clang++

