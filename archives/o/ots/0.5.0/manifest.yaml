# 版本级 manifest — ots 0.5.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.5.0"
software: "ots"
status: built
build_date: "2026-09-19"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://deb.debian.org/debian/pool/main/o/ots/ots_0.5.0.orig.tar.gz"
  sha256: "ea908d22256166d1200fef55a82dd3ea8e096a249eaaf0b926f3577f1a63e137"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-gtk-doc"
  dependencies:
    - glib/2.84.0.1
    - libxml2/2.15.3
    - popt/1.16
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "2007 年老式 autotools（configure.in）：复制为 configure.ac 后 autoreconf -fi，用 conan 的 automake/libtool 装入 2024 新式 config.guess/config.sub 再打 E007 补丁"
  - "configure.in 用 PKG_CHECK_MODULES 探测 glib-2.0/libxml-2.0，用 AC_CHECK_LIB 探测 popt：generate() 需同时提供 PkgConfigDeps 与 AutotoolsDeps"
  - "上游无任何测试套件（无 TESTS/check_PROGRAMS/tests 目录），make check 为 no-op"
  - "E114：生成 configure 中 umask 077 改为 022；E074：make 用 -j1"
