# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ots/0.5.0
homepage: "http://libots.sourceforge.net/"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: ots_0.5.0.orig.tar.gz, sha256 ea908d22256166d1200fef55a82dd3ea8e096a249eaaf0b926f3577f1a63e137)
# 审计方法: 下载 conandata.yml 首选镜像源实测 (2026-09-25, 371126 字节, sha256 与配方一致, 共 104 个文件)
upstream_test_audit:
  source_tarball: "ots_0.5.0.orig.tar.gz"
  source_sha256: "ea908d22256166d1200fef55a82dd3ea8e096a249eaaf0b926f3577f1a63e137"
  top_level_files:
    - configure.in        # 无 TESTS/check_PROGRAMS 相关宏, 仅 PKG_CHECK_MODULES + AC_CHECK_LIB(popt) 探测
    - Makefile.am         # SUBDIRS=src dic doc, 无 TESTS / check 目标
    - src/Makefile.am     # 仅 lib_LTLIBRARIES=libots-1.la + bin_PROGRAMS=ots, 无 check_PROGRAMS / TESTS
    - articles/Makefile.am  # 11 篇示例文本仅作 pkgdata_DATA 安装 (非测试)
    - dic/Makefile.am     # 38 个词典 xml 仅作 pkgdata_DATA 安装 (非测试)
    - doc/Makefile.am     # 仅 gtk-doc 文档, 无测试目标
  scanned_for:
    - "Makefile.am TESTS / check_PROGRAMS / check 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "*test* / *check* 源文件"
    - "gtest TEST()/TEST_F / pytest def test_"
    - "make check / ctest / meson test 目标"
  scan_result: "0 matches — 全包 104 个文件无 testlike 文件名; 全部 Makefile.am/ configure.in 逐行 grep TESTS/check_PROGRAMS/check_/gtest 均无命中; 无 tests/ 或 test/ 目录"
  make_check_output: "make check => 无 check 目标 (等价于 Nothing to be done, automake 默认 no-op)"
  reason: "ots 0.5.0 为 2007 年 autotools 小库, 上游 Debian orig 包不含任何测试套件; articles/ 仅为 11 篇待摘要示例文本, 非测试用例"

# 上游测试命令 (无测试套件, 故 check 命令不适用; 保持空串, 避免门禁误判清单存在测试)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ots.c
    description: "安装包消费者测试：真实摘要流水线（parse 8 句英文短文、grade 定标题、highlight 50%、text/HTML 摘要非空且短于原文），3 个断言"
    command: "./test_ots"
  - file: conanfile.py
    description: "CLI 烟雾测试：运行已安装的 ots --version 验证二进制可执行"
    command: "ots --version"

# 测试断言总数 (test_ots.c 内 3 个 PASS 检查点)
assertion_count: 3

# 上游测试总数（官方口径：autotools TESTS/check_PROGRAMS 注册数，经审计为 0）
upstream_test_total: 0
upstream_test_count_method: autotools_tests
