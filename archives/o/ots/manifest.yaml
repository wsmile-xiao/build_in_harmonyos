# 软件级 manifest — ots
# 遵循 ARCHIVE-SPEC v2.0

software: ots
display: "ots (Open Text Summarizer)"
description: "Open Text Summarizer 文本自动摘要工具和库，读取文本并筛选重要句子生成摘要"
category: utility
homepage: "http://libots.sourceforge.net/"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "2007 年老式 autotools（configure.in + 预生成 configure）：autoreconf -fi 重建，tool_requires 补齐 automake/libtool"
    - "E007：新式 config.guess/config.sub 打 HarmonyOS 识别补丁，不传 --build/--host"
    - "依赖 glib/libxml2（pkg-config）与 popt（AC_CHECK_LIB），双通道提供"
    - "上游无测试套件，test_package 用真实 API 摘要流程验证"
    - "产物包含 CLI 二进制 (ots) 与 libots-1 库"
  common_dependencies:
    - glib
    - libxml2
    - popt

versions:
  "0.5.0":
    status: built
    build_date: "2026-09-19"
    conan_ref: "ots/0.5.0"
