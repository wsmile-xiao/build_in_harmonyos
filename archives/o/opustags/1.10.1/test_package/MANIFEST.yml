# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: opustags/1.10.1
homepage: "https://github.com/fmang/opustags"

# 上游测试（t/ 目录,tag 1.10.1）：5 个 C++ TAP 测试程序（system/opus/ogg/
# cli/base64,共 21 项断言）+ oggdump 调试工具 + perl prove 编排
# （t/opustags.t + CMake check 目标）。平台无 perl,编排改为直接执行各
# 测试二进制并统计 TAP 断言（测试程序与 golden 夹具零修改）。
# 真机执行结果（2026-09-25）：
#   system.t 4/4、opus.t 6/6、base64.t 2/2 全过；
#   ogg.t 4/5、cli.t 3/4 —— 合计 19/21（90.5%）,2 项失败逐类归因：
#   1. ogg.t「build and check a fresh stream」:断言 ogg_writer 产物页
#      尺寸=67 字节,libogg 1.1.1(制品仓仅有版本)与上游要求的 1.3.3+
#      封帧行为有差异所致;
#   2. cli.t「check options parsing errors」:断言缺参错误信息含选项名,
#      musl getopt_long 在缺参场景的 optopt 取值与 glibc 不同,错误信息
#      文本缺失选项名(CLI 防御行为本身正常)。
#   另:oggdump 调试工具编译失败——上游自身缺陷(oggdump.cc:37 引用
#   ot::st 枚举中不存在的 end_of_stream 值,1.10.1 未同步),该工具仅被
#   perl 编排入口引用,不影响测试与交付。
upstream_check_command: "cmake 构建 t/*.t 测试程序后逐个直接执行(TAP 断言统计)"
upstream_test_in_build: false
upstream_test_command: "真机已执行:19/21 TAP 断言通过(90.5%),2 项失败逐类归因见上"

upstream_tests:
  - file: "t/system.cc"
    description: "system 层测试,4 项 TAP 断言全过"
  - file: "t/opus.cc"
    description: "Opus 头/标签解析,6 项 TAP 断言全过"
  - file: "t/ogg.cc"
    description: "Ogg 页面读写,5 项断言 4 过 1 败(libogg 1.1.1 封帧行为差异,归因见上)"
  - file: "t/cli.cc"
    description: "CLI 行为,4 项断言 3 过 1 败(musl getopt_long optopt 语义差异,归因见上)"
  - file: "t/base64.cc"
    description: "base64 编解码,2 项 TAP 断言全过"

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_opustags_cli.sh
    description: >-
      CLI 消费者测试（2 项断言）：--help 输出 Usage 且退出 0（1）；
      不存在的文件优雅报错、非 0 退出且有诊断（2）。
