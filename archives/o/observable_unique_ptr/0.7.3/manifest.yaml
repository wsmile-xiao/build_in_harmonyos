# 版本级 manifest — observable_unique_ptr 0.7.3
# 文件位置: archives/o/observable_unique_ptr/0.7.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
#
# 包定位：平台任务 id=14446（依赖项 / C++ 智能指针）；上游
# github.com/cschreib/observable_unique_ptr，包名与 conan-center-index
# recipes/observable_unique_ptr 一致（config.yml 只收录 0.7.3）。
# 仓内 archives/o/observer-ptr-lite 是另一个项目（martinmoene/observer-ptr-lite，
# 非观察者生命周期库），与本包不同源，无别名关系。

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.7.3"

# 软件名
software: "observable_unique_ptr"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档，zip 形态与 conan-center-index conandata 一致）
  url: "https://github.com/cschreib/observable_unique_ptr/archive/refs/tags/v0.7.3.zip"

  # 源码校验和（与 conan-center-index recipes/observable_unique_ptr/all/conandata.yml
  # 的 "0.7.3" 条目逐字一致，2026-09-28 设备实测下载复核通过，92223 字节）
  sha256: "7bb69fb686212441c1bb84eac433278e147fa571f45fb084c8343e4fc3198699"

  # 压缩格式: tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

  # 上游 tag 与指向 commit（git ls-remote 2026-09-28 实测，轻量 tag；上游 14 个 tag 全量命中）
  tag: "v0.7.3"
  tag_commit: "12c33cc49d9a92b570d8dff2089b630331881f65"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游根 CMakeLists 为 INTERFACE 目标，header-only）
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  # OUP_DO_TEST=ON 打开上游测试面（12 个编译期用例 + snitch 运行期套件）；
  # FetchContent 的 snitch 源由 conandata 第二源预置到 _deps/snitch-src（构建期零网络）
  configure_options:
    - "OUP_DO_TEST=ON"
    - "FETCHCONTENT_SOURCE_DIR_SNITCH=_deps/snitch-src"

  # 编译依赖列表（格式: name/version）
  # 软件本体 0 依赖（stdlib only）；snitch 测试框架是测试面预置源，不进依赖链
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试统计（四口径并列，不混用；N 取 case 级候选数法最大值）
# ============================================================

test_summary:
  # 口径一：源码宏数（tests/*.cpp 的 snitch 注册宏词面）
  #   TEMPLATE_LIST_TEST_CASE = 170、TEST_CASE = 3 → 173
  upstream_source_macros_tag: 173

  # 口径二：框架注册数（snitch 注册口径 = 实际注册 case）
  #   170 个 TEMPLATE_LIST_TEST_CASE × owner_types 25 个类型 + 3 个 TEST_CASE = 4253
  upstream_framework_registered: 4253

  # 口径三：上游编译期用例（tests/CMakeLists.txt 的 run_compile_test，configure 阶段 try_compile）
  upstream_compile_time_cases: 12

  # 口径四：断言数（snitch 运行期自报，次口径、不作 N）
  upstream_assertions_total: 30587

  # 消费者断言数（test_package，不进上游分母）
  consumer_assertions: 25

  # 申报 N = case 级候选最大值 = 4253（框架注册数）+ 12（编译期用例）= 4265
  upstream_declared_n: 4265
  upstream_n_prime: 4265               # 本次实际运行数
  upstream_pass: 4265
  upstream_fail: 0
  upstream_skip: 0
  upstream_not_run: 0
  # 差额归因（源码宏 173 → 注册 4253 = 170 × (25 − 1) 条类型展开；
  #           注册 4253 → 申报 4265 = +12 条编译期用例；断言 30587 属另一口径单列）
  upstream_test_programs: 1            # oup_runtime_tests（snitch 运行期）
  upstream_test_files: 31              # 19 个运行期 .cpp + 12 个编译期 .cpp
  test_package_programs: 1

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "header-only CMake INTERFACE 库配方模式（关闭上游 tests 默认值 / 消费上游 CONFIG 目标）" # knowledge_ref: E322
  - "header-only 无编译面库仍需显式 build()（conan-verify G1）" # knowledge_ref: E257
  - "测试面 bootstrap 下载必须与离线包构建分离（FetchContent 依赖随 conandata 预置到本地目录）" # knowledge_ref: E342
  - "上游测试计数：源码宏数 / 框架注册数 / 断言数 / 消费者断言数四口径不得混用，申报 N 取候选数法最大值并逐项归因差额" # knowledge_ref: knowledge/drafts/DRAFT-jsoncons-1.9.0-test-count-and-baseline-noise.kv
