# 上游测试框架 snitch —— tests/CMakeLists.txt 用 FetchContent 固定拉取 v1.3.2
# （GIT_REPOSITORY https://github.com/cschreib/snitch.git GIT_TAG v1.3.2）。
# CI worker 的 git 协议不通 github.com（FetchContent git clone 必失败），故在 source()
# 阶段把 snitch 官方 tag zip 预置到 _deps/snitch-src，并由 generate() 用
# FETCHCONTENT_SOURCE_DIR_SNITCH 指向本地目录，构建期零网络、零协议依赖
# （libassert-cpp/1.2.1 预置 cpptrace 的同款先例）。
# 该键是测试面依赖，不进配方 requires/tool_requires —— 软件本体仍是 0 依赖。
snitch:
