# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: observable_unique_ptr/0.7.3
homepage: "https://github.com/cschreib/observable_unique_ptr"

# 上游测试入口（上游 CI .github/workflows/cmake.yml：
#   cmake .. -DOUP_DO_TEST=1 && cmake --build . --target oup_runtime_tests_run）
# 编译期用例在 configure 阶段以 try_compile 判定（run_compile_test →
# `Test <name> passed.` / `FAILED test:`），运行期用例由 snitch 自报计数。
upstream_check_command: "cmake -S . -B build -DOUP_DO_TEST=ON -DFETCHCONTENT_SOURCE_DIR_SNITCH=_deps/snitch-src && cmake --build build --target oup_runtime_tests && ./build/tests/oup_runtime_tests"

# conanfile.py build() 方法中是否已集成上游测试
# observable_unique_ptr 为 header-only 库，但上游测试面（12 编译期用例 + snitch 运行期
# 套件）已在 build() 内真实执行：snitch v1.3.2 随 conandata 第二源预置到 _deps/snitch-src
# （FetchContent git clone 在 CI worker 不通），构建期零网络。
upstream_test_in_build: true
upstream_test_command: "build() 内：cmake configure（12 条编译期用例判定）→ cmake --build --target oup_runtime_tests → 运行 tests/oup_runtime_tests"

# ============================================================
# N 口径（四口径并列、不混用；申报 N = case 级候选数法最大值）
# ============================================================
# 1) 源码宏数 @被审 v0.7.3 = 173
#      grep -cE '^\s*TEMPLATE_LIST_TEST_CASE\s*\(' tests/*.cpp → 170
#      grep -cE '^\s*TEST_CASE\s*\('             tests/*.cpp →   3
# 2) 框架注册数 @被审 v0.7.3 = 4253（snitch 注册口径 = 实际运行 case）
#      snitch 运行自报 `4253 test cases`；= 170 × owner_types(25 类型) + 3
# 3) 上游编译期用例 = 12（tests/CMakeLists.txt 的 run_compile_test 调用数，
#      configure 输出 12 行 `Test … passed.`）
# 4) 断言数（snitch 运行期自报）= 30587 —— 次口径（统计单位是 assertion 不是 case），
#      按「四口径不得混用」单列，不作 N
# 5) 消费者断言数（test_package）= 25 —— 不进上游分母，计入 PR「鸿蒙特有测试」行
#
# 差额归因：
#   源码宏 173 → 注册 4253 = 170 个 TEMPLATE_LIST_TEST_CASE 各按 owner_types 展开
#                          25 个类型，+4080（= 170 × 24）
#   注册 4253 → 申报 4265 = +12 条上游编译期用例（compile-fail/compile-pass 检查）
#   断言 30587 与 case 4253 属不同统计单位，不参与 N 的取值
# ============================================================

upstream_declared_n: 4265
upstream_n_prime: 4265
upstream_pass: 4265
upstream_fail: 0
upstream_skip: 0
upstream_not_run: 0

# 上游实际运行的测试面
upstream_tests:
  - file: tests/oup_runtime_tests
    source: observable_unique_ptr-0.7.3/tests/runtime_tests_*.cpp（19 个 .cpp）
    description: "snitch v1.3.2 运行期套件：170 个 TEMPLATE_LIST_TEST_CASE × owner_types 25 类型 + 3 个 TEST_CASE = 4253 个 case，自报 30587 条断言全通过"
    command: "./build/tests/oup_runtime_tests"
  - file: tests/CMakeLists.txt（run_compile_test × 12）
    source: observable_unique_ptr-0.7.3/tests/compile_test_*.cpp（12 个 .cpp）
    description: "编译期用例 12 条（try_compile 期望编译成功 1 条 + 期望编译失败 11 条），configure 输出逐条 `Test … passed.`"
    command: "cmake configure 阶段（配方 build() 内显式判读计数）"

test_package_tests:
  - file: test_observable_unique_ptr.cpp
    description: "消费者面：交付头内容断言 3 条 + sealed/unique 生命周期与观察者语义 22 条 = 25 条运行期断言，逐条打印 [consumer] PASS，末行 [consumer] TOTAL=25 FAIL=0；另含 3 条 static_assert 编译期约束"
    command: "./test_observable_unique_ptr"

assertion_count: 25
