# 关键特性
features:
  - "Far: 高级 API，用于细分曲面的数据表示和评估"
  - "Bfr: 面评估框架，用于限制曲面表示"
  - "Vtr: 低级拓扑表示"
  - "Sdc: 细分方案（Catmark、Loop、Bilinear）"
  - "Osd: CPU/GPU 评估器"

# 平台适配说明
platform_notes:
  openharmony:
    - "核心 CPU 库可用，禁用了可视化功能（OpenGL）和 GPU 加速（CUDA/OpenCL）"
    - "依赖 libtbb.so（已预装）和系统 C++ 库"
    - "适用于细分曲面计算，不包含可视化功能"

