software: opa

version: "0.70.0"

status: published

build_date: "2026-06-01"

build_system: custom

source:
  url: "file:///storage/Users/currentUser/tmp/opa-0.70.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options: []
  dependencies: []
  cc: go1.26.3
  cxx: ""

  build_commands:
    - "TMPDIR=/data/storage/el2/base/cache CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOPROXY=https://goproxy.cn,direct GOROOT=~/sdk/go1.26.3 PATH=~/sdk/go1.26.3/bin:$PATH go build -ldflags='-s -w' -o /data/storage/el2/base/cache/opa ."

patches_applied: []

knowledge_gained:
  - "Go 项目在 OpenHarmony 使用 CGO_ENABLED=0 静态编译"
  - "本地 Go 1.24.2 安装的 compile 工具实际为 1.23.6 版本，存在版本不匹配；使用 Go 1.26.3 编译解决"
  - "Go linker mmap 在 HMDFS 上失败，输出到 /data/storage/el2/base/cache/"
  - "opa vendor 目录为空（只有 modules.txt），需删除后使用 GOPROXY 下载依赖"
  - "ELF 签名后才能在 OpenHarmony 上执行"