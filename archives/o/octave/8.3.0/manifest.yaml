patches_applied:
  - "config.guess: Added HarmonyOS platform detection"
  - "f2c.h: integer/uinteger/logical/flag/ftnlen/ftnint changed from long int to int (4 bytes)"
  - "liboctave/numeric/oct-convn.h: Added 'inline' keyword to convert_enum function"
  - "liboctave/util/mach-params.c: Created C replacement for d1mach_/i1mach_/r1mach_"
  - "omp_stub.c: Created OpenMP stub implementations (single-threaded)"
  - "lapack_real_funcs.c: C implementations for dnrm2_, snrm2_, dznrm2_, dlamc3_, slamc3_, drotg_, srotg_, crotg_, zrotg_"
  - "dgebal_f77.f: Patched dgebal.f from Fortran 90 to Fortran 77 syntax for f2c compatibility"
  - "libf2c.a: Fixed ctype.o (My_ctype symbol missing)"
  - "Makefile: Patched autotools regeneration rules to no-op"
  - "config.status: failed mktemp→mkdir, ECHO='print -r --'"
  - "libtool: Patched ECHO='print -r --'"
  - "BLAS/LAPACK: Rebuilt with corrected f2c.h (integer=int, 4 bytes)"

knowledge_gained:
  - "f2c integer type must be int (4 bytes) to match Octave F77_INT=int32_t on 64-bit platforms"
  - "Fortran 90 .f90 files (dnrm2, drotg) cannot be compiled by f2c; need C replacements"
  - "dgebal.f uses EXIT/CYCLE/END DO (Fortran 90); must rewrite to F77 (GO TO + CONTINUE) for f2c"
  - "DLAMCH machine constants fail when compiled by f2c; direct C constants (IEEE 754) needed"
  - "OpenMP runtime unavailable on HarmonyOS; omp_stub.c provides single-threaded stubs"
  - "Autotools regeneration loops must be disabled (no-op) to prevent make hangs"
  - "Makefile may become empty after patching; manual libtool linking is the fallback"
  - "ctype.o in libf2c may have missing symbols; recompile from source"
  - "BLAS/LAPACK must be rebuilt with corrected f2c.h to avoid integer size mismatch runtime crashes"

