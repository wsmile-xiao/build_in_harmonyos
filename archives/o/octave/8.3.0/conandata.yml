# conandata.yml — octave 8.3.0
# Source + patch declarations for Conan CI

sources:
  url: "https://ftp.gnu.org/gnu/octave/octave-8.3.0.tar.gz"
  sha256: "2b48111cb67b312817e5d1f3e171f5bad1512bb067e1674b9c4b29281895b97a"

patches:
  "0001-aclocal.m4.patch":
