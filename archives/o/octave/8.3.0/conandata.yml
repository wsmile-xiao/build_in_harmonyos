    patch_description: "Disable autotools regeneration loops (aclocal) to prevent make hangs on HarmonyOS"
    patch_type: "portability"
  "0002-build-aux-config.guess.patch":
    patch_file: "patches/0002-build-aux-config.guess.patch"
    patch_description: "Add HarmonyOS platform detection to config.guess"
    patch_type: "portability"
  "0003-configure.patch":
    patch_file: "patches/0003-configure.patch"
    patch_description: "Patch configure script for HarmonyOS compatibility (config.status, mktemp, ECHO)"
    patch_type: "portability"
  "0004-liboctave-numeric-oct-convn.h.patch":
    patch_file: "patches/0004-liboctave-numeric-oct-convn.h.patch"
    patch_description: "Add 'inline' keyword to convert_enum function in oct-convn.h"
    patch_type: "bugfix"
