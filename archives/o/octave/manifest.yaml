software: octave
display: "GNU Octave"
description: "High-level numerical computing language and interactive environment for numerical computations and visualization"
category: data
homepage: "https://www.octave.org"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "No native Fortran compiler on HarmonyOS; f2c + custom gfortran wrapper used as substitute"
    - "f2c.h integer type must be patched from long int to int (4 bytes) to match Octave's F77_INT=int32_t"
    - "BLAS/LAPACK .f90 files (dnrm2, drotg, etc.) cannot be compiled by f2c; C implementations provided"
    - "dgebal.f uses Fortran 90 syntax (EXIT, CYCLE, END DO); must be patched to Fortran 77 for f2c"
    - "DLAMCH machine constants return wrong values via f2c; C replacement (mach-params.c) provides IEEE 754 constants"
    - "OpenMP not available; omp_stub.c provides single-threaded stub implementations"
    - "Autotools regeneration loops (aclocal, config.status recheck) must be patched to no-op to prevent hangs"
    - "Makefile may become empty after patching; manual libtool linking required as fallback"
    - "PCRE 8.45 must be built from source with UTF and Unicode properties support"
  common_dependencies:
    - f2c
    - blas
    - lapack
    - pcre
    - freetype
    - libpng
    - zlib

versions:
  "8.3.0":
    status: built
    build_date: "2026-06-26"
    conan_ref: "octave/8.3.0@ohpcd/stable"
    conan_verify: skipped
    conan_verify_reason: "Complex build (f2c + gfortran wrapper + manual BLAS/LAPACK) cannot be reproduced by conan create"
