# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5"

# 软件名
software: "ogmtools"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://www.bunkus.org/videotools/ogmtools/ogmtools-1.5.tar.bz2"

  # 源码校验和
  sha256: "c8d61d1dbceb981dc7399c1a85e43b509fd3d071fb8d3ca89ea9385e6e40fdea"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（conan build() 运行时注入，见 conanfile.py）
  configure_options:
  - "--enable-static"
  - "--disable-shared"
  - "--with-ogg-prefix=<conan libogg package_folder>（运行时注入）"
  - "--with-vorbis-prefix=<conan libvorbis package_folder>（运行时注入）"
  - "--with-dvdread-prefix=<conan libdvdread package_folder>（运行时注入）"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - libogg/1.3.6
  - libvorbis/1.3.7
  - libdvdread/7.1.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "E126 变体: HMDFS 上 mktemp -d 创建的目录属主不可写（mode drwx--S---，mkdir 目录 drwxrws--x 可写）→ config.status confstat* Permission denied，Makefile 静默缺失；conan 环境无系统 shim 时 configure 自带 mkdir fallback 不触发（mktemp 返回 0）。对策: build() 注入 PATH 前缀 mktemp shim（转译 mkdir+随机名）"
- "XIPH_PATH_OGG/VORBIS 老宏（2000 年代）不读 pkg-config，仅 --with-*-prefix 定位依赖；AC_TRY_RUN 测试失败时清空 CFLAGS/LIBS，需 LD_LIBRARY_PATH 注入依赖 lib 使测试程序可运行"
- "conan autotools out-of-tree 构建（basic_layout CWD=build-release）下 Makefile.am 的相对 -Iavilib 失效，需 CPPFLAGS 追加绝对 -I<source_folder>/avilib"
- "HMDFS 不支持 jobserver mkfifo（Operation not permitted）→ make -j1"
- "test_package 需 layout() 隔离测试产物，否则 conan test 就地落盘污染配方目录（首次提交误入 3 个运行时文件）"
