package: ogmtools/1.5.2
homepage: "https://www.bunkus.org/videotools/ogmtools/"

# 上游无测试套件：make check 目标存在但 "Nothing to be done for check-am"（无测试程序）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check (official target, no upstream suite)"

# 上游 tarball 不含任何测试程序
upstream_tests: []

test_package_tests:
  - file: conanfile.py
    description: "6个已安装工具版本检查和1个完整PCM往返；另计独立鸿蒙HMDFS专项"
    command: "conan create (test_package)"

consumer_test_count: 7
harmony_test_count: 1
HARMONY_TEST_COUNT: 1
harmony_tests:
  - file: media_roundtrip.py
    description: "HarmonyOS/aarch64 HMDFS投影属主及中文空格路径的不同PCM输入逐字节往返"
    command: "media_roundtrip.py harmony <tested-package-bin> <task-private-build>"
