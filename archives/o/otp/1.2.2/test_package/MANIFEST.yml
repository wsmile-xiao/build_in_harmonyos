# test_package/MANIFEST.yml
# otp 1.2.2.

package: otp/1.2.2
homepage: https://www.fourmilab.ch/onetime/

upstream_tests_exist: true
upstream_test_audit: "test.sh performs five ./otp invocations with a fixed -R seed (-rTEST; default letters, -c12, -e12, -S5 -e -c, -d4) and writes per-run MD5 signature files; the Makefile check target concatenates the output and diffs it against the golden file test.mas"
upstream_check_command: "make check (= sh test.sh + diff test.mas test.out)"
upstream_test_in_build: true
upstream_test_command: "sh test.sh && diff test.mas test.out"
upstream_test_count: 6
upstream_tests_ran: 6
upstream_tests_passed: 6
upstream_tests_note: "5 deterministic ./otp runs plus 1 golden-file diff; all executed in build() and compared byte-for-byte against test.mas"

test_package_tests:
  - file: test_otp.sh
    description: "runs the installed bin/otp: -U banner, deterministic -rTEST key lists (letters and digits) and a deterministic -m MD5 signature file"
    command: "sh test_otp.sh"

test_files:
  - path: "test_package/test_otp.sh"
    test_type: "R34"
    assertion_count: 4

test_package_test_count: 1
consumer_assertion_count: 4
assertion_count: 4
