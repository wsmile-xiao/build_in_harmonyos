patches:
  - patch_file: "patches/0001-gethostid-portable-uname.patch"
    patch_description: "otp.c 在 Unix 熵源分支调用 gethostid()（glibc 有、OHOS/musl 系 libc 不导出该符号，链接期 undefined symbol: gethostid）。改为可移植的 POSIX uname() 节点名哈希，保持“主机身份”熵的语义，且不引入任何平台条件宏。"
    patch_type: "portability"
