software: otp
display: "otp"
description: "一次性密码本 / 密码列表生成器（随机字母、数字或英语二元组易记口令；可输出每个口令的 MD5 签名）"
category: tool
homepage: "https://www.fourmilab.ch/onetime/"
license: Public Domain
build_system: make

ohos_adaptation:
  key_points:
    - "纯 C 三源文件（otp.c/md5.c/random.c），无依赖，直接 make"
    - "上游 Makefile 硬编码 CC=gcc → 命令行覆盖为 OHOS clang"
    - "上游自带确定性回归套件（test.sh + test.mas 金标准），build() 中实跑"
    - "CLI 工具：装 bin/otp + man1/otp.1，并提供软件级 commands.json"

versions:
  "1.2.2":
    status: built
    build_date: "2026-09-21"
    conan_ref: "otp/1.2.2"
