# conandata.yml — omniorb 4.3.4
# Official SourceForge release; sha256 cross-checked against the
# FreeBSD ports record (devel/omniORB, a279f641) and Fossies
# (79720d415d23cd8da99287a4ef4da0aa1bd34d3e4c7b1530715600adc5ed3dc3,
# 2635770 bytes).
# 2026-09-30 preflight hit a transient IncompleteRead on the
# downloads.sourceforge.net redirector, so the URL was first made an
# ordered list (Conan 2.x tries each in order): the direct
# master.dl.sourceforge.net mirror node first (same official backend,
# same bytes), the redirector kept last as fallback. sha256 unchanged.
# 2026-10-01 preflight round 2 failed in source() on ALL FOUR URLs:
# omniorb.sourceforge.io/snapshots also Error 522 (it is SourceForge-
# hosted, same CDN as *.dl.sourceforge.net), and fossies.org direct file
# returned 401 Unauthorized (Fossies blocks conan/requests downloads).
# Per same-fingerprint-must-differ rule, this round drops both failed
# hosts and switches to BSD/distfiles infra (plain static hosts, no SF
# CDN, no bot-blocking), official SF URLs kept last as fallback;
# sha256 unchanged:
#   1) https://www.mirrorservice.org/sites/distfiles.macports.org/omniORB/omniORB-4.3.4.tar.bz2
#      (MacPorts official distfiles mirror, index lists omniORB-4.3.4.
#      tar.bz2 2026-01-22 2.5M = 2635770 bytes, verbatim upstream copy;
#      2026-10-01 preflight: this URL downloaded correctly after the
#      distcache https URL failed TLS verification, so it is first)
#   2) http://distcache.freebsd.org/ports-distfiles/omniORB-4.3.4.tar.bz2
#      (same official FreeBSD distfiles backup cache as the https variant
#      below, plain http avoids the worker TLS failure
#      "SSL CERTIFICATE_VERIFY_FAILED, hostname mismatch for
#      'distcache.freebsd.org'" seen on 2026-10-01; identical file, same
#      sha256; precedent archives/l/libarc/2.0.2 lists the http variant
#      first for the same reason. NOTE (AI review P3, 2026-10-02): this
#      plain-http entry is download-channel only; tamper resistance comes
#      from the Conan-enforced sha256 below (byte-identical to the
#      official SourceForge release, cross-checked against the FreeBSD
#      ports record and Fossies). No https equivalent exists on this
#      host (its https variant fails TLS verification on the worker), so
#      the entry is kept with this explicit sha256 guarantee.)

