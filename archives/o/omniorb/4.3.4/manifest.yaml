# 版本级 manifest
# 文件位置: archives/o/omniorb/4.3.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（交叉校验元数据，CI 以 conanfile.py 为准）

# 版本号
version: "4.3.4"

# 软件名
software: "omniorb"

# 编译状态
# published | built | failed | archived
# 首轮仅完成工作树，真机预检（conan create 全量构建+测试）尚未执行；
# 状态待预检通过后由 HMBS 修正，详见 notes.md。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: "autotools"
conan_ref: "omniorb/4.3.4"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 conandata.yml 一致）
  url: "https://downloads.sourceforge.net/project/omniorb/omniORB/omniORB-4.3.4/omniORB-4.3.4.tar.bz2"

  # 源码校验和
  sha256: "79720d415d23cd8da99287a4ef4da0aa1bd34d3e4c7b1530715600adc5ed3dc3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（与 conanfile.py generate() 一致）
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "PYTHON=<worker python3 absolute path>"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-bin-scripts-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: 2001 版 config.sub 不认 aarch64/ohos，需补丁接受 aarch64 cpu 与 linux-ohos OS"
  - "显式指定 build==host 仍为 native 构建，AC_RUN_IFELSE 特性探针照常执行"
  - "上游无测试套件：无 tests/ 目录、无 check 目标，build() 内做源码审计并发 no_tests 标记"
  - "configure 默认同时构建 static+shared；--disable-static 可关闭静态库"
  - "OpenSSL/zlib/zstd 缺席时自动禁用对应特性，不报错；因此配方零 conan 依赖"
  - "hnp bash 在 conan 构建缓存目录不可访问致 configure re-exec Error 127（E386）：profile buildenv 注入的 CONFIG_SHELL 会在 helper 采源 conanbuild.sh 后覆盖单层 os.environ，故用双层守卫（generate 存 zzz_hmbs_shell 脚本 + build/package 内 scrub），helper 不断工具链环境"
  - "SourceForge redirector 有下载抖动（IncompleteRead）：conandata url 用有序列表，官方 master.dl.sourceforge.net 直连节点在前、redirector 在后，sha256 不变"
