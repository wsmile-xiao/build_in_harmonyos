# 软件级 manifest
# 文件位置: archives/o/omniorb/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# 软件名称（小写，与目录名一致）
software: omniorb

# 显示名
display: "omniORB"

# 一句话描述
description: "Robust high performance CORBA ORB for C++ (runtime libraries, omniidl IDL compiler, omniNames naming service)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://omniorb.sourceforge.io/"

# 开源许可证（SPDX 标识）
license: LGPL-2.1-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "自带 config.guess/config.sub 为 2001 版，不识别 aarch64 与 HarmonyOS，需补丁接受 aarch64-unknown-linux-ohos 三元组（E007）"
    - "使用 --build/--host 显式指定同一三元组，仍为 native 构建，configure 的 AC_RUN_IFELSE 探针不受影响"
    - "构建需要 Python 3（omniidl 后端），取自构建机 PATH，通过 PYTHON= 绝对路径传入 configure"
    - "无 OpenSSL/zlib/zstd 开发文件时 SSL 与 ZIOP 支持自动关闭，构建不报错"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "4.3.4":
    status: built
    build_date: "2026-10-01"
    conan_ref: "omniorb/4.3.4"
