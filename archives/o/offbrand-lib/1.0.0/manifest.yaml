# 版本级 manifest — offbrand-lib 1.0.0
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.0.0"

# 软件名
software: "offbrand-lib"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/theck01/offbrand_lib/archive/refs/tags/v1.0.0.tar.gz"

  # 源码校验和
  sha256: "d949084179abb0373e541a346d56c9399c3ecd92a8e2e5a4804c87b4e9900d79"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 裸 Makefile 工程，无 configure 脚本；直接 make bin/offbrand.a

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 仅依赖 OHOS musl libc 标准头（stdlib/stdio/string/regex.h），无第三方 Conan 依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无补丁：配方内直接 make + 手工安装（上游无 install 目标）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "裸 Makefile 库 ARFLAGS=rvs 产出无 lib 前缀归档（offbrand.a），package() 需重命名 liboffbrand.a 以匹配 CMakeDeps 查找（ref: knowledge/drafts/DRAFT-offbrand-lib-1.0.0-raw-makefile-nolib-prefix-cmakedeps.kv）"
  - "引用计数容器（obvector/obmap）消费者测试必须存 obj 兼容实例，裸 malloc 指针在 dealloc 时被 ob_release 解引用导致段错误（ref: knowledge/drafts/DRAFT-offbrand-lib-1.0.0-raw-makefile-nolib-prefix-cmakedeps.md）"
  - "OHOS 构建主机缺 /bin/bash 时上游 scripts/prepare shebang 失败，配方应手动 mkdir bin 目录并只构建归档目标（ref: knowledge/drafts/DRAFT-offbrand-lib-1.0.0-raw-makefile-nolib-prefix-cmakedeps.md）"
