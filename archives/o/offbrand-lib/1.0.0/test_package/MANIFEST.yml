# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: offbrand-lib/1.0.0
homepage: "https://github.com/theck01/offbrand_lib"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (8 个独立可执行：6 个核心库测试 + 2 个 minlog 应用测试)
upstream_tests:
  - file: src/tests/obdeque_test.c
    source: offbrand-lib-1.0.0/src/tests/obdeque_test.c
    description: "obdeque 双端队列单元测试"
    command: "./bin/tests/obdeque_test"
  - file: src/tests/obint_test.c
    source: offbrand-lib-1.0.0/src/tests/obint_test.c
    description: "obint 整数类单元测试"
    command: "./bin/tests/obint_test"
  - file: src/tests/obmap_test.c
    source: offbrand-lib-1.0.0/src/tests/obmap_test.c
    description: "obmap 哈希表单元测试"
    command: "./bin/tests/obmap_test"
  - file: src/tests/obstring_test.c
    source: offbrand-lib-1.0.0/src/tests/obstring_test.c
    description: "obstring 字符串类单元测试"
    command: "./bin/tests/obstring_test"
  - file: src/tests/obtest_test.c
    source: offbrand-lib-1.0.0/src/tests/obtest_test.c
    description: "obtest 测试框架类单元测试"
    command: "./bin/tests/obtest_test"
  - file: src/tests/obvector_test.c
    source: offbrand-lib-1.0.0/src/tests/obvector_test.c
    description: "obvector 动态数组单元测试"
    command: "./bin/tests/obvector_test"
  - file: apps/minlog/src/tests/NCube_test.c
    source: offbrand-lib-1.0.0/apps/minlog/src/tests/NCube_test.c
    description: "minlog 应用 NCube 类单元测试"
    command: "./apps/minlog/bin/tests/NCube_test"
  - file: apps/minlog/src/tests/RTable_test.c
    source: offbrand-lib-1.0.0/apps/minlog/src/tests/RTable_test.c
    description: "minlog 应用 RTable 类单元测试"
    command: "./apps/minlog/bin/tests/RTable_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者验证：obvector/obstring 公开 API 调用（new/store_at_index/length/obj_at_index/release）"
    command: "./test_offbrand-lib"
  - file: test_ohos.c
    description: "鸿蒙专项测试：引用计数/obmap 哈希表/obstring 正则匹配（OHOS musl 运行时真实行为）"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
