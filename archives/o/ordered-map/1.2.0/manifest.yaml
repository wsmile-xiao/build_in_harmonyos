  note: "上游 tests/ 为 Boost.Test 套件，共 67 个用例定义（62 BOOST_AUTO_TEST_CASE + 5 BOOST_AUTO_TEST_CASE_TEMPLATE）。ohpcd 制品仓的 boost 二进制均不含 unit_test_framework（实测 1.84.0 仅 filesystem/iostreams/program_options/regex，1.90.x 亦无），无法按上游方式链接执行。build() 将三个上游测试源文件与 utils.h 原封不动地对随配方归档的零依赖 shim（仅替换 <boost/test/unit_test.hpp> 与 <boost/mpl/list.hpp> 两个头）编译并在鸿蒙 PC 真机执行：5 个模板用例按其类型列表展开（4 个 map 模板 × 5 类型 + 1 个 set 模板 × 6 类型），67 个定义共展开为 88 个运行时用例，88/88 通过、183624 个断言，编译选项 -std=c++11 -DTSL_DEBUG -UNDEBUG 与上游一致。test_package 另做消费侧 10 项 CHECK。"

library:
  header: "include/tsl/"
