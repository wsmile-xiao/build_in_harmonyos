knowledge_ref: []
knowledge_gained:
  - "tsl/ordered-map 上游测试只依赖两个 Boost 头：编译型 Boost.Test（unit_test_framework，ohpcd boost 二进制不提供）与纯头文件 Boost.MPL（仅用 mpl::list 类型序列）。用一个随配方归档的 shim/ 目录替换这两个头，即可在鸿蒙 PC 上原封不动地编译执行全部 67 个上游用例定义（运行时展开为 88 个用例）。"
  - "上游 tag 为 v1.2.0（带 v 前缀）。tests/CMakeLists.txt 使用 -Werror -Wall -Wextra -Wold-style-cast 与 -DTSL_DEBUG -UNDEBUG；移植保留语义相关选项（TSL_DEBUG、UNDEBUG、c++11），-Werror 一族告警门禁不随 shim 复刻。main.cpp 仅定义 BOOST_TEST_MODULE 并依赖编译型 Boost.Test 提供 main()，由 shim_main.cpp 等价替换。"
