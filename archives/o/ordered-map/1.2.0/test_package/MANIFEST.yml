# test_package/MANIFEST.yml
package: ordered-map/1.2.0
homepage: "https://github.com/Tessil/ordered-map"

upstream_check_command: "tests/CMakeLists.txt (find_package Boost REQUIRED COMPONENTS unit_test_framework)"
upstream_test_in_build: true
upstream_test_command: "clang++ -std=c++11 -DTSL_DEBUG -UNDEBUG -I shim (archived Boost.Test shim) + upstream tests/*.cpp -> ./ordered_map_tests executed"

upstream_tests:
  - file: ordered_map_tests.cpp
    source: ordered-map-1.2.0/tests/ordered_map_tests.cpp
    description: >-
      57 BOOST_AUTO_TEST_CASE + 4 BOOST_AUTO_TEST_CASE_TEMPLATE definitions
      (each template iterates a 5-type boost::mpl::list). Compiled UNMODIFIED
      against the archived shim/ headers and executed in recipe build().
    command: "./ordered_map_tests"
  - file: ordered_set_tests.cpp
    source: ordered-map-1.2.0/tests/ordered_set_tests.cpp
    description: >-
      4 BOOST_AUTO_TEST_CASE + 1 BOOST_AUTO_TEST_CASE_TEMPLATE over a 6-type
      list. Compiled UNMODIFIED against the shim; executed in recipe build().
    command: "./ordered_map_tests"
  - file: custom_allocator_tests.cpp
    source: ordered-map-1.2.0/tests/custom_allocator_tests.cpp
    description: >-
      1 stateful-allocator case (test_custom_allocator_1). Compiled UNMODIFIED
      against the shim; executed in recipe build(). utils.h
      (TSL_OH_CHECK_THROW, mod_hash, move_only_test, get_filled_hash_map)
      is used as-is.
    command: "./ordered_map_tests"

test_package_tests:
  - file: test.cpp
    description: >-
      Consumer-side API validation of the packaged headers: 10 CHECKs
      exercising insertion-order preservation (front/nth), find/at/erase,
      order retention across erase and rehash, ordered_set insert/erase/count,
      and a 1000-element map. Returns non-zero on any failed check.
    command: "./test_ordered_map"

assertion_count: 10
