# Build hints for open62541 1.5.3 on OHOS
# Used by ohc-run.py clean-verify to know how to build this software

build_system: cmake

# CMake configure options (used by clean-verify instead of ./configure)
cmake_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
  - "-DCMAKE_C_COMPILER=clang"
  - "-DCMAKE_CXX_COMPILER=clang++"

# out-of-source build required for cmake projects
out_of_source_build: true

# Source patches needed for OHOS platform
source_patches:
  - description: "bits/stdio_lim.h not available on musl/OHOS"
    files: ["arch/posix/eventloop_posix.h"]
    patch: "0001-arch-posix-eventloop_posix.h.patch"
  - description: "linux/net_tstamp.h conflicts with sys/socket.h on OHOS; txtime structs unavailable"
    files: ["arch/posix/eventloop_posix_eth.c"]
    patch: "0002-arch-posix-eventloop_posix_eth.c.patch"
