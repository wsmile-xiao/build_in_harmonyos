software: open62541
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/open62541/open62541/archive/refs/tags/v1.5.3.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"
    - "-DCMAKE_BUILD_TYPE=Release"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-arch-posix-eventloop_posix.h.patch"
  - "0002-arch-posix-eventloop_posix_eth.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "glibc bits/stdio_lim.h 在 musl/OHOS 上不存在，需要 #ifdef __OHOS__ 守卫（R8）"
  - "linux/net_tstamp.h 在 OHOS 上与 sys/socket.h 冲突（sockaddr_storage 重定义），需要 #ifndef __OHOS__ 守卫（R8）"
  - "SO_TXTIME 在 OHOS 上已定义但 sock_txtime/SOF_TXTIME_REPORT_ERRORS 来自 net_tstamp.h 不可用，需 #if !defined(SO_TXTIME) || defined(__OHOS__) 组合守卫"
  - "open62541 是纯库包（无可执行文件），G2 '无二进制文件' warning 为预期行为"
  - "open62541 cmake 项目需要 out-of-source 构建（mkdir build && cd build && cmake ..）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/open62541-1.5.3.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/open62541-1.5.3.work
  source_orig_hash: 05f18c9608fb6c68
  source_work_hash: 19aac03c9e8f89a1
  generated_at: '2026-06-15T11:29:54'
  patches_count: 2

patch_classification:
  - file: 0001-arch-posix-eventloop_posix.h.patch
    type: platform_compat
    platform_only: True
    guard: __OHOS__
    description: "bits/stdio_lim.h 头文件在 musl/OHOS 上不存在，添加 #ifndef __OHOS__ 守卫"
  - file: 0002-arch-posix-eventloop_posix_eth.c.patch
    type: platform_compat
    platform_only: True
    guard: __OHOS__
    description: "linux/net_tstamp.h 与 sys/socket.h 冲突导致 sockaddr_storage 重定义；txtime struct/SOF_TXTIME_REPORT_ERRORS 在 OHOS 不可用，添加 #ifndef __OHOS__ 守卫"
