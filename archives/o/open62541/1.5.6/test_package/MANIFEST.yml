# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: open62541/1.5.6
homepage: "https://open62541.org"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试当前未在本机运行：本轮只准备生产包和消费者测试。
upstream_tests:
  - file: tests/
    source: open62541-1.5.6/tests/
    description: "Official CTest unit suite; requires the Check test framework"
    command: "ctest"
    status: "not_run"
    reason: "Deferred from the production build; check/0.15.2 is available for a later test-only integration."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: CMakeLists.txt
    description: "Consumer build: find the installed open62541 CMake target"
    command: "cmake --build ."
  - file: test.c
    description: "Consumer test: create and destroy a UA_Server instance"
    command: "./test_open62541"

# 测试断言总数
assertion_count: 3
