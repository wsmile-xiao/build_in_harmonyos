# test_package/MANIFEST.yml — open62541/1.5.7
# 上游官方测试声明（docs/TEST_QUALITY_SPEC.md；CI L0e 强制存在）

package: open62541/1.5.7
homepage: "https://open62541.org"

# 上游测试命令（完整枚举入口：tests/CMakeLists.txt 的 ua_add_test +
# tests/nodeset-compiler/CMakeLists.txt；生成 ctest 测试项）
upstream_check_command: "ctest (UA_BUILD_UNIT_TESTS=ON)"

# conanfile.py build() 已集成上游测试：configure + build + cmake.test()
upstream_test_in_build: true
upstream_test_command: "cmake.test() -> ctest（build 阶段执行）"

# 上游实际运行的测试程序（本配方配置下的启用子集；加密/MQTT/FULL-NS0
# 门控用例未启用，完整台账见回报中的测试枚举）
upstream_tests:
  - file: tests/CMakeLists.txt
    source: open62541-1.5.7/tests/CMakeLists.txt
    description: "209 个 ua_add_test() 条目；本配置启用其中非门控子集（encryption=OFF, MQTT=OFF, NS0=REDUCED, PubSub=ON, multithreading=100）"
    command: "ctest"
  - file: tests/nodeset-compiler/CMakeLists.txt
    source: open62541-1.5.7/tests/nodeset-compiler/CMakeLists.txt
    description: "test_generate_datatypes_cross_ns（Python 脚本测试，REDUCED NS0 下启用）；7 个 nodeset 编译 C 测试门控于 NS0=FULL（未启用）"
    command: "ctest"

# test_package 自带测试（消费者视角，HarmonyOS 专项）
test_package_tests:
  - file: test_open62541_ohos.c
    description: "真实 UA_Server（opc.tcp loopback）发布 Int32 变量 + 真实 UA_Client 连接后读 42 / 写 43 / 回读 43"
    command: "./test_open62541_ohos"

# 测试断言总数（近似值 = 本配置实际启用的 ctest 测试程序数）
assertion_count: 130
