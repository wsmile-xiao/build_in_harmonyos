patches:
  - patch_file: "patches/0001-src-diff.c.patch"
    patch_description: "Portable tmpdir: tmp_file_from_buf() honors $TMPDIR (fallback /tmp) instead of hardcoded /tmp"
    patch_type: "portability"
  - patch_file: "patches/0002-src-parser.c.patch"
    patch_description: "Portability: parser.c forward declaration uses size_t len to match the gperf-generated parser_hash.h (64-bit safe; upstream fixed this in 4.0.0)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-languages.h.patch"
    patch_description: "Portability: languages.h forward declaration uses size_t len to match the gperf-generated language_hash.c (64-bit safe; upstream fixed this in 4.0.0)"
    patch_type: "portability"
  - patch_file: "patches/0004-test-unit-parser_test.h.patch"
    patch_description: "Test harness: include and invoke the orphaned cmake/golang/puppet/qml/typescript aggregators"
    patch_type: "test"
  - patch_file: "patches/0005-test-unit-sourcefile_test.h.patch"
    patch_description: "Portable tmpdir: test_tmp_dir scans $TMPDIR (fallback /tmp) instead of hardcoded /tmp"
    patch_type: "portability"
  - patch_file: "patches/0006-test-unit-parsers-test_golang.h.patch"
    patch_description: "Test fix: use the registered language name golang (upstream used the nonexistent go)"
    patch_type: "test"
  - patch_file: "patches/0007-test-unit-parsers-test_jsp.h.patch"
    patch_description: "Test harness: invoke the orphaned test_jsp_comment case"
    patch_type: "test"