# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ohcount/4.0.0
homepage: "https://github.com/blackducksoftware/ohcount"

# ─────────────────────────────────────────────────────────────────────
# 上游测试清点与实跑（R51 三步法，tarball 全量实测 + build() 实跑，2026-09-24）
#
# C 核心套件（test/unit/all_tests.c 编译出的 test/unit/run_tests，
# 上游 build 脚本目标 `sh build tests`；本包 build() 已集成实跑）：
#   - 命名用例 280：
#       sourcefile_test.h 10（含 5 个 diff 相关 + test_tmp_dir）
#       detector_test.h   25（函数体内 123 条 ASSERT_DETECT/ASSERT_NODETECT
#                             数据断言，覆盖 test/detect_files/ 样本）
#       loc_test.h        25
#       license_test.h     2（src_vs_expected_tests + very_long_file_test，5.5MB 压力用例）
#       unit/parsers/*.h 218（96 个 test_<lang>.h 头文件中的命名用例）
#   - 数据驱动 249 组（实际执行口径：循环访问且配对成功的样本）：
#       test/src_dir ↔ test/expected_dir 逐文件解析比对 154 组
#         （src_dir 158 个样本中 4 个无同名 expected：classic_basic1.classic_basic、
#          html.cgi、mysql-stale-table-sniper、postscript.ps；expected_dir 中
#          perl.cgi、postscipt.ps 两个无同名 src（上游拼写错误），不会被循环访问）
#       test/src_licenses ↔ test/expected_licenses 许可证比对 95 组
#   - C 套件合计 529 个入口（280 + 154 + 95）
# Ruby 绑定测试（test/unit/ruby/）：14 个 *_test.rb，85 个 test 方法
# Python 绑定测试（test/unit/python/python_test.py）：5 个 test 方法
# 上游 N 合计 = 529 + 85 + 5 = 619
#
# N′（2026-09-24 实测）= C 529/529 通过；绑定 0/90 未执行：
#   1. C 套件原因 /tmp 硬编码不可运行（src/diff.c:625 与
#      test/unit/sourcefile_test.h:230）：已用 POSIX/TMPDIR 方式修复
#      （patches/0001、0005），build() 注入 TMPDIR 到可写构建目录后
#      实编译、实跑，日志 UPSTREAM TEST SUMMARY: total=529 passed=529 failed=0。
#   2. Ruby/Python 绑定套件需先构建绑定模块：本环境无 swig（PATH 与
#      /data/service/hnp/bin 均无），ruby 开发头文件未安装，绑定模块无法生成；
#      绑定测试列 0/90（工具链缺失，非代码失败）。
#   3. 上游 all_parser_tests() 漏挂 cmake/golang/puppet/qml/typescript 聚合器
#      （并漏 include test_cmake.h）、all_jsp_tests() 漏调 test_jsp_comment，
#      且 golang 用例语言名 "go" 未注册（实际为 "golang"）；已通过
#      patches/0002/0003/0004 补挂并跑通，14 个孤儿用例全部计入 218。
# ─────────────────────────────────────────────────────────────────────
upstream_check_command: "sh build tests   # = build_test_suite + run_test_suite (test/unit/all_tests.c -> test/unit/run_tests)"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "build(): clang 编译 test/unit/all_tests.c + 核心源文件 -> test/unit/run_tests，注入 TMPDIR（可写构建目录）/MAGIC（libmagic 数据库）/PATH（GNU diff），cwd=test/unit 运行；任一断言失败即构建失败"

# 上游测试运行清单（实跑结果）
upstream_tests:
  - suite: "C unit suite (test/unit/all_tests.c -> test/unit/run_tests)"
    total: 529
    passed: 529
    failed: 0
    skipped: 0
    command: "./run_tests"
    evidence: "UPSTREAM TEST SUMMARY: total=529 passed=529 failed=0"
  - suite: "Ruby bindings (test/unit/ruby, 14 files / 85 methods)"
    total: 85
    passed: 0
    failed: 0
    skipped: 85
    reason: "swig 缺失（无法生成 ruby/ohcount_wrap.c）；ruby 开发头文件未安装"
  - suite: "Python bindings (test/unit/python/python_test.py)"
    total: 5
    passed: 0
    failed: 0
    skipped: 5
    reason: "python 绑定模块（依赖 swig 生成）未构建"

# test_package 中自带的测试 (消费者视角验证，实跑安装后的 bin/ohcount)
test_package_tests:
  - file: ohos_specific_test.py
    description: "R34/R53 共 10 条断言：①实跑安装后的 bin/ohcount 对 C fixture 断言 c 1/4/5/1/10、对 Python fixture 断言 python 1/4/2/1/7（精确语言+LOC）；②pure-python ELF 解析（无 readelf 依赖）断言 bin/ohcount 安装存在、ELF64 LE、e_machine=AArch64(183)、PT_INTERP=ld-musl-aarch64.so.1、.codesign 段、无 DT_RPATH/DT_RUNPATH、pcre/libmagic 静态链接（DT_NEEDED 无 libpcre/libmagic）"
    command: "python3 ohos_specific_test.py <bindir>"

# 测试断言总数（与脚本实际打印的 PASS 计数一致）
assertion_count: 10
