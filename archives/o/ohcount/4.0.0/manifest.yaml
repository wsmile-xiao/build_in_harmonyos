knowledge_gained:
  - "ohcount 官方 tarball 不含 Ragel/gperf 生成产物（src/hash/*_hash.h + src/parsers/*.h），且制品仓无 ragel：需以纯文本预生成产物随配方提交（generated/），build() 覆盖进源码树后编译"
  - "src/parsers 的 107 个 .h 由 src/hash/parser_hash.h 统一 #include，故 parser.c 单文件编译即含全部解析器（对象约 2.2MB）"
  - "上游 run_tests 硬编码 /tmp（src/diff.c:625、test/unit/sourcefile_test.h:230）：已以 POSIX/TMPDIR 语义（$TMPDIR 回退 /tmp）修复，build() 注入 TMPDIR 到可写构建目录后 C 套件 529/529 实跑通过（无 #ifdef __OHOS__，R8）"
  - "上游 all_parser_tests() 漏挂 cmake/golang/puppet/qml/typescript 聚合器（并漏 include test_cmake.h）、all_jsp_tests() 漏调 test_jsp_comment，golang 用例语言名 \"go\" 未注册（实际 \"golang\"）：补挂/修正后 14 个孤儿用例纳入实跑"
  - "上游 C 套件运行需要：libmagic 数据库（MAGIC=<libmagic 包>/share/misc/magic.mgc）与 GNU diff（>100kB 的 diff 用例 popen 调用，PATH 注入 /data/service/hnp/bin）"
  - "Ruby/Python 绑定测试（90 例）需 swig + ruby 开发头文件构建绑定模块；本工具链无 swig，绑定测试 0/90（技术原因申报，非代码失败）"

