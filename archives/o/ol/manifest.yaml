software: ol
display: "ol (Otus Lisp)"
description: "Purely functional, embeddable Scheme dialect: interpreter, olvm shared library and standard library"
category: development
homepage: "https://github.com/yuriy-chumak/ol"
license: LGPL-3.0-or-later OR MIT
build_system: make

ohos_adaptation:
  key_points:
    - "plain GNUmakefile 工程：只传 CC（来自 tools.build:compiler_executables）与 PREFIX，不传 CFLAGS（会覆盖上游全部 `CFLAGS +=`）"
    - "必须传 UNAME=Linux：鸿蒙 uname -s 为 HarmonyOS，会跳过上游 Linux 分支而丢掉 -Xlinker --export-dynamic，导致运行期 FFI（OLVM_ffi）不可用"
    - "OHOS 无 coreutils install(1)，不能用上游 make install —— package() 按上游 install 布局自行落盘"
    - "olvm 经 strip 后内核拒绝执行（rc=126）——bin/ 下 ELF 用 binary-sign-tool 重新自签名；libol.so 保持 hnp clang 自带链接器签名，不重签"
    - "运行期 OL_HOME 由 package_info() 的 runenv/buildenv 导出为 <包>/lib/ol，包可重定位"
  common_dependencies: []

versions:
  "2.7":
    status: built
    build_date: "2026-09-13"
    conan_ref: "ol/2.7"
