# test_package/MANIFEST.yml — ol (Otus Lisp) 2.7
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
package: ol/2.7
homepage: "https://github.com/yuriy-chumak/ol"

# 上游测试由 conanfile.py build() 内的 `make check` 驱动，在 OHOS worker 上原生执行。
# 注意：language / rosettacode 的 `tests` 目标**恒返回 0**（失败只写 FAILMARK），
# 配方因此解析 `make check` 日志的表格单元格与分组头，任何失败/零用例都会让
# conan create 失败；doc/reference 的 check-reference 目标本身会 exit 1。
upstream_check_command: "make check"
# 编排：四组 language-tests / rosettacode-tests / ffi-tests / check-reference 各复制一份已构建
# 源码树、在副本里并行跑（各组自身 -j1），逐组落盘后按固定顺序拼接为 upstream-check.log；
# 独立副本用于消除并发 make 对共享中间产物的竞态。
# 用例集合与串行 make check 完全一致（不抽样、不减 debug/release 变体）。
upstream_test_orchestration: "4 groups in isolated per-group source-tree copies, run in parallel (each -j1); HAVE_* feature detection preset on the command line"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试（make check = regression-tests + check-reference）
upstream_tests:
  - "tests/*.scm + tests/*.bin — language regression（make language-tests）"
  - "tests/rosettacode/**.scm — Rosetta Code 示例（make rosettacode-tests）"
  - "tests/ffi/tier-1/*.scm — FFI tier-1（make ffi-tests，aarch64 平台清单）"
  - "tests/ffi/tier-2/*.scm — FFI tier-2（make ffi-tests，aarch64 平台清单）"
  - "doc/reference/*.md — 参考手册代码块（make check-reference）"

# 计数口径（R51）：N = 上游测试文件数（清点所得）；N′ = 本次实际运行数。
# 取数：从 `make check` 日志按分组头切段，分别统计
#   declared = 以 `|` 开头、含 .scm/.bin/.md 的「测试名行」
#   resolved = 其后确实打出 `| ok | ok |` 或 `|fail|fail|` 结果的行
#   make language-tests    : tests/*.scm 61 + tests/*.bin 1                            = 62
#   make rosettacode-tests : tests/rosettacode/*.scm 109 + sorting_algorithms/*.scm 3  = 112
#   make ffi-tests         : tier-1 7 + tier-2 9（aarch64 平台清单注册）                = 16
#   make check-reference   : $(wildcard doc/reference/*.md)                            = 21
#   → 清点 N = 211
#
# 其中 tests/fasl-binary.bin **上游默认不执行**：extras/check.mk 的 `%.bin.ok` 规则
# 被整段注释（该文件第 154 行起），`tmp/check.log`（378 条 = language 61×2 +
# rosettacode 112×2 + ffi 16×2）里没有它的执行记录，日志中只有名字行、没有结果行。
# 这类用例既不是 PASS 也不是本包的 SKIP（第 7.3 节口径），故单列：
#   → 实际运行 N′ = 210
# aarch64 上 DEV_MODE=0，每个用例在 native platform 上跑 debug + release 两个 olvm
# （tmp/olvm-native-debug、tmp/olvm-native-release），故执行次数 = 2N′ = 420。
upstream_tests_total: 211
upstream_tests_run: 210
upstream_tests_passed: 210
upstream_tests_failed: 0
upstream_tests_skipped: 0
upstream_tests_not_run: 1
upstream_tests_not_run_reason: "tests/fasl-binary.bin：上游 extras/check.mk 的 %.bin.ok 规则被整段注释，任何平台都不执行（tmp/check.log 无记录）——上游默认不执行，非本包跳过"
upstream_test_variants: "native-debug + native-release（每个已运行用例 2 次执行，共 420 次）"

# test_package 自带的消费者验证（与上游计数分栏，不并入 N）
test_package_tests:
  - file: embed_test.c
    description: "C 消费者：链接 libol.so，用 <ol/ol.h> 嵌入 API 断言 5 项求值结果"
    command: "./embed_test"
  - file: harness.scm
    description: "用安装好的 bin/ol 解释器执行 7 项标准库断言，退出码承载结论"
    command: "bin/ol test_package/harness.scm"
  - file: conanfile.py
    description: "bin/olvm --version（验证 strip 后重新签名的虚拟机可执行）"
    command: "bin/olvm --version"

assertion_count: 12
