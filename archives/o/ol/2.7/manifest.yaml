  sha256: "32dec0d527d456cce3273b907ffface6386a61288edf33f8724e2dd1bfb22319"
  tar_format: tar.gz

build:
  system: make
  configure_options:
    - "make release -j1 CC=<ohos clang> UNAME=Linux PREFIX=/usr"
    - "2 个补丁：0001 给 libol.so 补 -Wl,-soname,libol.so；0002 把 rosettacode 序列化用例的落盘路径从 /tmp 改到构建树内"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-GNUmakefile.patch"
  - "0002-tests-rosettacode-object_serialization.scm.patch"

knowledge_gained:
  - "OHOS 未提供 coreutils install(1)（command -v install 为空）：上游 make install 直接 127 'No such file or directory'，配方改为 package() 自行落盘，布局与上游 install 目标一致"  # knowledge_ref: E188
  - "上游 olvm 目标链接后 strip，剥离符号时连 .codesign 一起丢失 → 鸿蒙内核 EPERM（rc=126 Operation not permitted）；须 binary-sign-tool 先删段再 selfSign 重签，libol.so 不重签"  # knowledge_ref: E077
  - "鸿蒙 uname -s 返回 HarmonyOS（uname -a 尾部仍是 GNU/Linux），上游 ifeq ($(UNAME),Linux) 分支被跳过 → 丢 -Xlinker --export-dynamic → 运行期 (dlsym (dlopen) \"OLVM_ffi\") 取不到符号；用上游 UNAME ?= 覆盖入口传 UNAME=Linux（llvm-nm -D ol 的 OLVM_ffi 计数 0→1）"  # knowledge_ref: E140
  - "conanbuild 把 OHOS 目标 sysroot（.../llvm/lib/aarch64-linux-ohos）前置进 LD_LIBRARY_PATH，其目标 libc++.so 遮蔽宿主工具 binary-sign-tool 的 libc++ → 'Error loading shared library libc++.so' + 'Error relocating ... symbol not found'；对宿主工具清空 LD_LIBRARY_PATH 即恢复"  # knowledge_ref: knowledge/drafts/E543-draft-F19E（沙箱 libc++ 遮蔽，草稿）
  - "plain GNUmakefile 工程：不要向 make 传 CFLAGS=（GNU make 命令行变量优先于 makefile 内全部 CFLAGS +=，会整段覆盖上游 flags）；basic_layout 下源码副本即 self.source_folder，构建须 cwd=self.source_folder"  # knowledge_ref: DRAFT-cd-hit-4.8.1-make-conan-recipe
  - "上游 -shared 未传 -Wl,-soname，OHOS 工具链产出的 libol.so 动态段无 DT_SONAME（llvm-readelf -dW 无 SONAME 行），CI 的 L5a 门禁判「下游链接器无法按 SONAME 寻址」；补 -Wl,-soname,libol.so 后 SONAME=libol.so"  # knowledge_ref: E383

