# conandata.yml — ol (Otus Lisp) 2.7
# 源码来自上游作者仓库 yuriy-chumak/ol 的官方 tag 归档（GitHub tag tarball），
# 顶层目录 ol-2.7/，不随发行版改动。
sources:
  url: "https://github.com/yuriy-chumak/ol/archive/refs/tags/2.7.tar.gz"
  sha256: "32dec0d527d456cce3273b907ffface6386a61288edf33f8724e2dd1bfb22319"

patches:
  - patch_file: "patches/0001-GNUmakefile.patch"
    patch_description: "libol.so 链接补 -Wl,-soname,libol.so：上游 -shared 未设 SONAME，产出的 .so 动态段无 DT_SONAME，下游链接器无法按 SONAME 寻址（CI L5a 门禁失败）"
    patch_type: "bugfix"
  - patch_file: "patches/0002-tests-rosettacode-object_serialization.scm.patch"
    patch_description: "tests/rosettacode/object_serialization.scm: 序列化落盘从硬编码 /tmp 改到构建树内相对路径 tmp/（OHOS 的 /tmp 是 root 属主只读挂载，fasl-save 必然失败）"
    patch_type: "portability"
