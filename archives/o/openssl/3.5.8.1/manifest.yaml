# OpenSSL 3.5.8.1 编译档案
software: openssl
version: 3.5.8.1
status: published
build_date: 2026-09-03
build_system: openssl-perl
compile_date: 2026-09-03

# R37: 3.5.8.1 = 3.5.8 + 适配修复
#   上游版本 3.5.8 (RELEASE_DATE: 25 Aug 2026)
#   制品仓已存在 openssl/3.5.6/3.5.6.1/3.5.6.1.1（2026-07-12~08-03 发布）
#   升级上游到 3.5.8，按 L0j/R37 递增版本后缀 → 3.5.8.1

dependencies:
  required: [perl]
  optional: []

build_config:
  target: linux-aarch64
  configure_options:
    - linux-aarch64
    - --prefix=$DEFAULT_PREFIX
    - --openssldir=$DEFAULT_PREFIX/ssl
    - --no-asm
    - --no-shared
    - --with-rand-seed=getrandom
    - CC=clang
  cflags: "-fPIC -pthread -Wa,--noexecstack -Qunused-arguments -O2"

patches_applied:
  - "0001-apps-speed.c.patch"
  - "0002-include-internal-sockets.h.patch"

compatibility:
  level: high
  issues: []
  notes: |
    - OpenSSL 3.5.8 内置 linux-aarch64 target，无需自定义平台配置
    - 本机无 gcc，conan 配方 build() 必须显式传 CC=clang（从 profile compiler_executables 读取）
    - conan create 干净构建通过（no-asm no-shared，静态库，R26 系统同名库隔离）
    - 复用 3.5.6.1.1 的两个补丁（FD_SET → openssl_fdset 有界实现），3.5.8 源码上下文一致

test_results:
  type: automated
  passed: 130
  failed: 0
  skipped: 1
  note: |
    - openssl version: OpenSSL 3.5.8 25 Aug 2026 ✅
    - make test 超时前 130 个测试文件 ok，0 失败（partial）
    - L1 test_package: 12/12 PASS (T1-T12 全部通过, 含 RFC 4231 KAT + ECDSA tamper)

knowledge_gained:
  - "OpenSSL 3.5.x 内置 linux-aarch64 target，无需自定义平台配置文件"
  - "openssl Configure 默认选 gcc，无 gcc 环境必须显式传 CC=clang（R33）"
  - "Conan 2.29 支持 core.sources:download_cache，可用 sha256 预置源码包跳过网络"
  - "3.5.6 → 3.5.8 的 FD_SET 补丁上下文一致，patch 可复用"

precompiled_package:
  name: openssl-3.5.8.1-ohos-aarch64
  contents:
    - libcrypto.a
    - libssl.a
    - openssl (CLI tool)
    - include/openssl/*.h

references:
  - https://www.openssl.org/source/
  - https://github.com/openssl/openssl/releases/download/openssl-3.5.8/