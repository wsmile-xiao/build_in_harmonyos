# OpenSSL 3.0.16 编译档案
software: openssl
version: 3.0.16
status: built
build_system: openssl-perl
compile_date: 2026-09-03

dependencies:
  required: [perl]
  optional: [zlib]

build_config:
  target: linux-aarch64
  configure_options:
    - linux-aarch64
    - --prefix=<self.package_folder>
    - --openssldir=<self.package_folder>/ssl
  cflags: "-fPIC -pthread -Qunused-arguments -O2"

patches_applied: []

compatibility:
  level: high
  issues: []
  notes: |
    - OpenSSL 3.0.16 is the latest patch of 3.0 LTS series
    - Built-in linux-aarch64 target, identical to 3.5.x
    - Core crypto functionality (AES/RSA/TLS 1.3) fully usable

test_results:
  type: conan-verify
  passed: 8
  failed: 0
  skipped: 0
  note: "G0-G4 + L2/L4/L5 all PASS (L2/L4/L5 skipped in local verify, covered by CI)"

knowledge_gained:
  - "OpenSSL 3.0.x uses perl ./Configure build system"
  - "linux-aarch64 target built-in to source tree"
  - "no-shared forces static linking to avoid HMDFS .so symbol conflicts"
  - "R33: openssl Configure defaults to gcc — must pass CC=clang explicitly"
  - "R49: use self.package_folder as prefix, not shell DEFAULT_PREFIX"

precompiled_package:
  contents:
    - libcrypto.a
    - libssl.a
    - openssl (CLI tool)
    - include/openssl/*.h

references:
  - https://www.openssl.org/source/
  - https://github.com/openssl/openssl/releases/download/openssl-3.0.16/
