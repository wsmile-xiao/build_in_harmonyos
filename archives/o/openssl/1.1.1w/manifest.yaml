# OpenSSL 1.1.1w 编译档案

software: openssl
version: 1.1.1w
status: success
build_system: custom-perl
compile_date: 2024-03-21

dependencies:
  required: [perl]
  optional: [zlib]

build_config:
  target: openharmony-aarch64
  configure_options:
    - --prefix=$HOME/usr/local
    - --openssldir=$HOME/usr/local/ssl
    - no-asm
  cflags: "-fPIC -O2 -D__OHOS__"
  env:
    CC: clang
    AR: llvm-ar
    RANLIB: llvm-ranlib

patches_applied:
  - file: 0001-support-build-in-harmonyos.patch
    purpose: 添加 HarmonyOS 平台配置和自动检测
    lines_changed: 120
    files_modified:
      - Configurations/15-openharmony.conf
      - Configure

compatibility:
  level: high
  issues: []
  notes: |
    - 核心加密功能完全可用
    - 使用 no-asm 禁用汇编优化（避免 BAD_SIGNATURE bug）
    - TLS 1.3 正常工作
  syscalls:
    available: [pthread, dl, socket]
    missing: []
    workaround: []

test_results:
  type: manual
  total: 35
  passed: 29
  failed: 6
  skipped: 0
  note: |
    核心测试全部通过，失败的是边缘功能测试。
    详细报告见 reports/test-report.md
  key_features:
    - AES 加密
    - RSA 密钥生成
    - TLS 1.3 连接
    - HTTPS 客户端

knowledge_gained:
  - "OpenSSL 使用自定义 Perl Configure 脚本"
  - "使用 no-asm 禁用汇编优化避免 RSA-PSS BAD_SIGNATURE 错误"
  - "Python _ssl 模块需要手动链接 libssl 和 libcrypto"
  - "需要设置 AR=llvm-ar RANLIB=llvm-ranlib"

references:
  - title: OpenSSL 官方文档
    url: https://www.openssl.org/docs/
  - title: OpenSSL 下载
    url: https://www.openssl.org/source/openssl-1.1.1w.tar.gz

maintainer: OpenHarmony Community
last_updated: "2024-03-21"
tags: [ssl, cryptography, tls, security]