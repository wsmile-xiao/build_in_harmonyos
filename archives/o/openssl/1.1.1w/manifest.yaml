# OpenSSL 1.1.1w 编译档案
software: openssl
version: 1.1.1w
status: success
build_system: custom-perl
compile_date: 2026-04-12

dependencies:
  required: [perl]
  optional: [zlib]

build_config:
  target: openharmony-aarch64
  configure_options:
    - --prefix=$TEST_PREFIX
    - --openssldir=$TEST_PREFIX/ssl
    - no-asm
  cflags: "-fPIC -O2 -D__OHOS__"
  env:
    CC: clang
    AR: llvm-ar
    RANLIB: llvm-ranlib

patches_applied:
  - file: 0001-Configurations-openharmony-conf.patch
    purpose: 添加 HarmonyOS 平台配置
  - file: 0002-Configure.patch
    purpose: Configure 自动平台检测 + shebang 修复

compatibility:
  level: high
  issues:
    - "HMDFS 不支持 ln -s，需用 cp -a 替代"
    - "动态库需设置 LD_LIBRARY_PATH"
  notes: |
    - 核心加密功能完全可用（AES/RSA/TLS 1.3）
    - 使用 no-asm 禁用汇编优化
    - HMDFS 文件系统需用 cp -a 替代 ln -s

test_results:
  type: manual
  passed: 3
  failed: 0
  note: "openssl version / AES 加密解密 / RSA 2048 密钥生成均通过"

knowledge_gained:
  - "OpenSSL 使用自定义 Perl Configure，需用 openharmony-aarch64 target"
  - "no-asm 是必须的（R15）"
  - "HMDFS 不支持 ln -s，Makefile 中需 sed 替换为 cp -a"
  - "gitee.com/mirrors/openssl 可作为国内镜像下载"

references:
  - https://www.openssl.org/source/
