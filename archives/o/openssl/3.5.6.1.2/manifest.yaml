version: "3.5.6.1.2"
software: "openssl"
status: built
build_date: "2026-09-08"
conan_ref: "openssl/3.5.6.1.2"
build_system: "perl Configure + make"
source:
  url: "https://github.com/openssl/openssl/releases/download/openssl-3.5.6/openssl-3.5.6.tar.gz"
  sha256: "deae7c80cba99c4b4f940ecadb3c3338b13cb77418409238e57d7f31f2a3b736"
  tar_format: tar.gz
build:
  system: perl Configure + make
  configure_options:
    - "shared=True（动态库：libssl.so/libcrypto.so，OpenSSL 3.x 带 OPENSSL_3.0.0 符号版本节点）"
    - "no-asm"
    - "--with-rand-seed=getrandom"
  dependencies: []
  cc: clang
patches_applied:
  - "0001-apps-speed.c.patch"
  - "0002-include-internal-sockets.h.patch"
knowledge_gained:
  - "3.5.6.1.2：动态库版（R37 版本后缀）。制品仓 3.5.6.1.1 为静态库（R26 no-shared 防 .so 污染）；本版本条件化 no-shared（shared=True 时构建并打包 libssl.so/libcrypto.so），供 harmonybrew rust 工具链（librsvg 构建）的 cargo 运行时使用（cargo NEEDED libssl.so/libcrypto.so，需 OPENSSL_3.0.0 版本化符号；harmonybrew 的 openssl@3 bottle 404 缺失）"
  - "用途：非系统库（R26 静态设计仍适用于系统场景），本动态版仅作为 rust 工具链运行时依赖随包分发"
