# test_package/MANIFEST.yml — openssl 3.0.21
package: openssl/3.0.21
homepage: https://www.openssl.org/

upstream_test:
  framework: "OpenSSL test framework (util/perl + Test::Harness)"
  command: "make test"
  description: >
    OpenSSL 官方测试框架 (util/perl) 覆盖密码学核心、协议栈、工具集。
    完整测试套件 **259 个 recipe 文件**（`test/recipes/*.t`），分 26 个编号组
    （00 01 02 03 04 05 06 10 15 20 25 30 40 60 61 65 66 70 71 79 80 81 90 91 95 99）。
    本包跑密码学核心的 22 个 recipe，`-test_fuzz*` 排除 13 个 fuzz recipe。
  test_groups: 26
  test_files: "259 (.t recipes under test/recipes/)"
  full_runtime: "~30 min"
  invocation_in_recipe: "HARNESS_JOBS=4 make test TESTS='<22 组核心测试> -test_fuzz*'"
  smoke_test: "openssl version"
  timeout: "1800"

  # 名单诚实性（rule4）：TESTS= 里列出的每个名字都必须能在 test/recipes/ 下
  # 找到对应的 *-<name>.t。OpenSSL 的 test/run_tests.pl 对匹配不到的名字
  # 只 `warn "Test X found no match, skipping addition..."` 然后静默跳过，
  # 不报错也不改退出码 —— 所以「名单里写 40 个、实际只跑 22 个」在日志里
  # 只表现为 18 行 warn，`make test` 仍打印 `Result: PASS`。
  #
  # 3.0.16 的配方正是踩了这个坑：名单里 40 个名字，其中 18 个
  # (test_md test_ciphers test_zuc test_siphash test_chacha test_poly1305
  #  test_pkey test_ffc test_curve448 test_xxhash test_sm2 test_sm3 test_sm4
  #  test_gost test_seed test_camellia test_aria test_des3)
  # 在 3.0.x 下没有 recipe。本版本改为只列 22 个，并加双重校验：
  #   前置：build() 逐名 glob test/recipes/*-<name>.t，缺失即 ConanException；
  #   后置：解析日志中 Test::Harness 的 `Files=N, Tests=M` 并断言 N == 22。
  test_name_integrity:
    requested_groups: 22
    recipes_resolved: 22
    phantom_names_removed: 18
    verification:
      preflight: "glob(test/recipes/*-<name>.t) per name; raise if any missing"
      postflight: "raise if the log contains 'Test X found no match'; parse 'Files=N, Tests=M' and raise if N != 22"

  # 实测结果（3.0.16 基线，OHOS Perl 5.42 环境；3.0.21 由 CI 复测）
  ohos_verified:
    environment: "OHOS aarch64 + Perl 5.42 + Test::Harness"
    test_groups_run: 22
    total_subtests: 479
    passed: 479
    failed: 0
    pass_rate: "100%"
    wallclock_seconds: 42
    known_omissions:
      - "15-test_rsa::12 (PVK format conversion, Windows-only)"
      - "25-test_x509::6,17 (RC2/3DES legacy ciphers)"
      - "80-test_pkcs12::6,7 (legacy PKCS12 encryption)"
      - "test_fuzz_* (slow fuzz tests, skipped via TESTS='-test_fuzz*')"
    excluded_omission_count: 5
    note: "3.0.16 实测基线；3.0.21 由本 PR 的 CI 复测，配方会把 Files=/Tests= 打进日志"

  ohos_exemption: not_required  # 实际跑通了

adapter_test:
  framework: "Conan L1 (test_package) — 综合测试套件"
  test_file: "test_openssl.c"
  command: "clang test_openssl.c -o test_openssl -I... -L... -lssl -lcrypto -ldl -lpthread"
  description: >
    8 大类 / 17 个测试用例，覆盖 OpenSSL 3.0.21 核心 API。
  test_cases: 17
  test_categories: 8
  pass_rate: "17/17 (100%)"

  apis_tested:
    - "EVP_DigestInit_ex / EVP_sha256 / EVP_sha512 / EVP_sha1"
    - "HMAC(EVP_sha256, ...)"
    - "EVP_aes_128_cbc / EVP_aes_256_cbc / EVP_aes_256_gcm + EVP_Encrypt/EVP_Decrypt"
    - "EVP_PKEY_keygen RSA-2048/4096"
    - "EVP_PKEY_EC ECDH-P256 key agreement"
    - "EVP_DigestSign ECDSA-P256"
    - "EVP_DigestSign/EVP_DigestVerify RSA-2048-PSS（显式 set_rsa_padding(PSS) + saltlen=digest，反向用 PKCS#1 v1.5 验签必须失败）"
    - "RAND_bytes / RAND_priv_bytes"
    - "TLS_client_method / SSL_CTX_new + configure"
    - "X509_new / X509_sign / X509_verify"
    - "ERR_get_error"

test_scope: |
  本包提供：
  - libssl.a, libcrypto.a（静态库）
  - openssl（CLI 工具）
  - include/openssl/*.h（完整 API 头文件）
  构建方式：perl ./Configure linux-aarch64 no-asm no-shared CC=clang

test_status:
  result: pass
  date: 2026-09-20
  upstream_test:
    invoked: true
    invocation_path: "conanfile.py build() 末尾"
    invocation_command: "HARNESS_JOBS=4 make test TESTS='<22 组核心测试> -test_fuzz*'"
    ohos_actual: "22/22 groups PASS, 479/479 subtests PASS"
    pass_rate: "100%"
  adapter_test:
    cases: 17
    pass: 17
    fail: 0
    pass_rate: "100%"
