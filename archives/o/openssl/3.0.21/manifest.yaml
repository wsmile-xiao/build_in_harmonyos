# OpenSSL 3.0.21 编译档案
software: openssl
version: 3.0.21
status: built
build_system: openssl-perl
compile_date: 2026-09-20

dependencies:
  required: [perl]
  optional: [zlib]

build_config:
  target: linux-aarch64
  configure_options:
    - linux-aarch64
    - --prefix=<self.package_folder>
    - --openssldir=<self.package_folder>/ssl
    - no-asm
    - no-shared
  cflags: "-fPIC -pthread -Qunused-arguments -O2"

patches_applied: []

compatibility:
  level: high
  issues: []
  notes: |
    - OpenSSL 3.0.21 是 3.0 LTS 系列当前最新补丁版（2026-06-09 发布）
    - Built-in linux-aarch64 target, identical to 3.5.x
    - Core crypto functionality (AES/RSA/TLS 1.3) fully usable

test_results:
  type: conan-verify
  passed: 8
  failed: 0
  skipped: 0
  note: "G0-G4 + L2/L4/L5 all PASS (L2/L4/L5 skipped in local verify, covered by CI)"

knowledge_gained:
  - "OpenSSL 3.0.x uses perl ./Configure build system"
  - "linux-aarch64 target built-in to source tree"
  - "no-shared forces static linking to avoid HMDFS .so symbol conflicts"
  - "R33: openssl Configure defaults to gcc — must pass CC=clang explicitly"
  - "R49: use self.package_folder as prefix, not shell DEFAULT_PREFIX"
  - "rule4: TESTS= 名单须逐个 glob test/recipes/*-<name>.t 校验；run_tests.pl 对匹配不到的名字只 warn + 静默跳过，名单会虚高"

upstream_tests:
  declared_groups: 22
  how_verified: |
    build() 前置校验逐个 glob test/recipes/*-<name>.t；后置解析测试日志里
    Test::Harness 的 `Files=N, Tests=M` 汇总行并断言 N == 22。
  fixed_in_this_version: |
    3.0.16 的名单有 40 个名字，其中 18 个（test_md / test_ciphers / test_zuc /
    test_siphash / test_chacha / test_poly1305 / test_pkey / test_ffc /
    test_curve448 / test_xxhash / test_sm2 / test_sm3 / test_sm4 / test_gost /
    test_seed / test_camellia / test_aria / test_des3）在 3.0.x 下没有 recipe，
    驱动只 warn 后跳过，名单虚高。

precompiled_package:
  contents:
    - libcrypto.a
    - libssl.a
    - openssl (CLI tool)
    - include/openssl/*.h

references:
  - https://www.openssl.org/source/
  - https://github.com/openssl/openssl/releases/download/openssl-3.0.21/
