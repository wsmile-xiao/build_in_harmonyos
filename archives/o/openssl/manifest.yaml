software: openssl
display: "OpenSSL"
description: "Industry-standard TLS/SSL and cryptographic library"
category: crypto
homepage: "https://www.openssl.org/"
license: "Apache-2.0 (3.x); OpenSSL and SSLeay (1.1.1w)"
build_system: custom-perl

ohos_adaptation:
  key_points:
    - "使用 Perl Configure（大写C），而非 autotools 的 ./configure"
    - "3.5.6+ 内置 linux-aarch64 target，无需自定义平台配置"
    - "1.1.1w 需使用 no-asm 禁用汇编优化（ARM64汇编在 RSA-PSS 签名验证有 bug）"
    - "HMDFS 不支持 ln -s，Makefile 中需 sed 替换为 cp -a"
    - "使用 -j1 构建：HMDFS 并行 make 会触发 .d.tmp mv 竞争导致随机失败"
    - "核心加密功能完全可用（AES/RSA/TLS 1.3/QUIC）"
    - "4.0 移除 engines（ENGINESDIR 不复存在），no-engine 恒为禁用态"
    - "4.x 系列为 openssl 包的 4.0.x 版本，与 1.1.1/3.x 系列同属一个 Conan 包"
    - "许多软件依赖 OpenSSL（Python _ssl、curl、git 等）"
  common_dependencies:
    - perl

versions:
  "1.1.1w":
    status: published
    build_date: "2026-04-12"
    notes: "需使用 openharmony-aarch64 target 和 no-asm 选项"
  "3.5.6":
    status: published
    build_date: "2026-05-19"
    notes: "内置 linux-aarch64 target，测试套件跳过"
  "3.5.6.1":
    status: built
    build_date: "2026-08-03"
    notes: "3.5.6 适配修复（R37）：build() 显式传 CC=clang，conan-verify 全通过"
  "3.5.6.1.1":
    status: built
    build_date: "2026-08-03"
    notes: "3.5.6.1 再递增（远端已占用 3.5.6.1 recipe）：make build_sw -j2 适配 W3 600s 门禁"
  "3.5.7":
    status: built
    build_date: "2026-09-19"
    notes: "上游 3.5.7 安全修复版；沿用 3.5.8.1 的 musl 有界 fd_set 两补丁 + getrandom 熵源 + no-asm/no-shared；build() 内改为真实执行上游 make test（不再超时截断，参考 3.0.16）"
  "3.5.8.1":
    status: published
    build_date: "2026-09-03"
    notes: "升级上游 3.5.8 (R37)，复用 3.5.6.1.1 补丁（fd_set 有界实现）；新增 LD_LIBRARY_PATH 修复 lld 缺 libxml2.so.16；12-case L1 测试 (R34) 全部通过；test_package/conanfile.py 也注入 LD_LIBRARY_PATH"
  "4.0.1":
    status: built
    conan_ref: "openssl/4.0.1"
    build_date: "2026-09-03"
    notes: "OpenSSL 4.0.1 首次适配：保留 3.5.6.1 系列的 getrandom 熵源策略与 musl fd_set 补丁（按 4.0.1 上下文重新生成），新增 no-pinshared 选项"
