software: openssl
display: "OpenSSL"
description: "Industry-standard TLS/SSL and cryptographic library"
category: crypto
homepage: "https://www.openssl.org/"
license: OpenSSL
build_system: custom-perl

ohos_adaptation:
  key_points:
    - "使用自定义 Perl Configure，需用 openharmony-aarch64 target"
    - "必须使用 no-asm 禁用汇编优化（ARM64汇编在 RSA-PSS 签名验证有 bug）"
    - "HMDFS 不支持 ln -s，Makefile 中需 sed 替换为 cp -a"
    - "核心加密功能完全可用（AES/RSA/TLS 1.3）"
    - "许多软件依赖 OpenSSL（Python _ssl、curl、git 等）"
  common_dependencies:
    - perl

versions:
  "1.1.1w":
    status: published
    build_date: "2026-04-12"
