# OpenSSL 3.5.7 编译档案
software: openssl
version: 3.5.7
status: built
build_date: 2026-09-19
build_system: openssl-perl
compile_date: 2026-09-19

# 上游坐标：官方 tag openssl-3.5.7（RELEASE 日期 2026-06-09，`openssl version` 实测
# "OpenSSL 3.5.7  9 Jun 2026"）。任务版本 3.5.7 与 tag 一一对应，未用 master/main 顶替。
# 制品仓已占用 3.5.6 / 3.5.6.1 / 3.5.6.1.1 / 3.5.6.1.2 / 3.5.8.1 / 4.0.1 / 3.0.16 / 1.1.1w，
# 均非本版本 → 不触发 L0j/R37。

dependencies:
  required: [perl]
  optional: []

build_config:
  target: linux-aarch64
  configure_options:
    - linux-aarch64
    - --prefix=$DEFAULT_PREFIX
    - --openssldir=$DEFAULT_PREFIX/ssl
    - no-asm
    - no-shared
    - --with-rand-seed=getrandom
    - CC=<profile tools.build:compiler_executables> -D__MUSL__
  cflags: "-fPIC -pthread -Wall -O3 -DNDEBUG"
  make_jobs: 2
  test_harness_jobs: 4

patches_applied:
  - "0001-apps-speed.c.patch"
  - "0002-include-internal-sockets.h.patch"

compatibility:
  level: high
  issues: []
  notes: |
    - 沿用 3.5.8.1/3.5.6.1.1 的全部 OHOS 结论：Configure 默认选 gcc（真机无 gcc）必须显式传 CC=clang；
      musl 无 glibc 私有符号 __fd_chk → 0002 补丁提供有界 fd_set 并由 -D__MUSL__ 激活；
      R26 系统同名库（libssl/libcrypto）→ no-shared 静态；no-asm 规避 perlasm 与 SDK 汇编器组合问题
    - 3.5.7 源码上下文与 3.5.8 一致，两个补丁原样复用，`git apply --check -p1` 与 conan
      `Apply patch (portability)` 两轮均干净应用，无需重生成
    - 与 3.5.8.1 的关键差别：build() 不再「make test 跑到一半超时即算过」，而是
      `HARNESS_JOBS=4 timeout 1500 make test TESTS="<116 个安全关键脚本>"` 真实执行上游
      harness 且不吞失败；全量 345 脚本另在真机跑了两轮留证（见 test_results.note）

test_results:
  type: automated
  passed: 3086
  failed: 0
  skipped: 0
  note: |
    - 本清单记录 **推送的配方**（build() 内 `HARNESS_JOBS=4 timeout 1500 make test TESTS="<116 个 .t>"`）
      的真机第 3 轮：`Files=116, Tests=3086, 736 wallclock secs, Result: PASS`，`not ok` 0 条，
      116 个脚本全部 ok；`conan create` 退出码 0（16:40:26 → 17:09:28，29 min 02 s）。
      另有一次同一清单单独计时：`Files=116, Tests=3085, 665 s`，RC=0。
    - 上游 **全量 345 脚本** 另在真机实跑两轮（13:31:29→14:01:30 与 15:25:07→16:00:47），
      两轮均 `Files=344, Tests=4024, Result: PASS` / `CREATE_EXIT:0`（930 s 与 1144 s）。
      48 个脚本按构建配置自跳过（fips-only / windows-only / enable-tfo / rc5 未启用 /
      no-compression / dynamic-engine 因 no-shared 不可用 / 7 个 95-test_external_* 需第三方外部套件），
      逐条原因与取数命令见 `reports/test-report.md`。
    - CI 内不跑全量的原因：单包预算 3600 s（`ci/config/build_timeouts.txt` 无 openssl 条目，
      rule5 禁止贡献者改 `ci/`），而 `make test` 会先编译 248 个测试程序再跑 930～1144 s，
      叠加 worker 编译速度未知没有余量。详见 `notes.md`「为什么 build() 跑 116 个脚本而不是全量 345」。
    - L1 test_package 消费者：12/12 PASS（T1-T12，含 RFC 4231 HMAC KAT、AES-GCM SET_TAG、
      RSA-2048 OAEP、EC P-256 篡改拒绝、TLS 1.3 上下文、X.509 自签验签）

knowledge_gained:
  - "openssl 全量上游套件在真机 8 核需 build_sw ≈14 min + make test 930~1144 s（两轮相差 23%），3600 s 的 CI 单包预算放不下，故 build() 内跑 116 个安全关键脚本并用 timeout 1500 加硬失败护栏"
  - "conandata.yml 的 sources.url 必须写成单值：CI 的镜像注入 replace_url() 只匹配单行 `url: \"https://...\"`，list 形态等于关掉镜像，worker 直连 github 会在 20 MiB 处 IncompleteRead 直到 3600 s 超时"
  - "conandata.yml 的注释里不要写带 :// 的地址——CI 按整行正则扫全文抓 URL，注释里的地址会被当成源码去预下载"
  - "真机 github.com/openssl.org 走 conan 下载会因 DNS 失败；conan 2.29 用 core.sources:download_cache + <cache>/s/<sha256> 预置官方包可跳过网络，且只能写在 global.conf（-c 与 profile 都拒绝 core.*），要用独立 CONAN_HOME 承载以免污染全队共享配置"
  - "3.5.7 与 3.5.8 的 apps/speed.c、include/internal/sockets.h 上下文一致，fd_set 两补丁跨版本零改动复用"

precompiled_package:
  name: openssl-3.5.7-ohos-aarch64
  contents:
    - libcrypto.a
    - libssl.a
    - openssl (CLI tool)
    - include/openssl/*.h

references:
  - https://github.com/openssl/openssl/releases/tag/openssl-3.5.7
  - https://www.openssl.org/source/openssl-3.5.7.tar.gz.sha256
