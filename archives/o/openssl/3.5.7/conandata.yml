# conandata.yml — openssl 3.5.7
# R39: 只声明官方 HTTPS 源，不用任何第三方加速镜像。
# 注意 url 必须是**单值字符串**：CI 的镜像注入（ci/conan/build_and_test.sh 的 replace_url）
# 只匹配单值的 url 键，脚本注释里写明「不处理已经是列表的」。写成列表会让
# CI 退回 worker 直连 github.com —— 实测 53MB 包固定断在 20MiB（IncompleteRead），
# 重试到 3600s 预算耗尽。单值形态下 CI 会自动展开为镜像列表 + 原源兜底。
# 本文件注释里不要出现带 scheme 的地址：CI 按整行正则扫全文抓 URL，注释也会被当源码预下载。
# 上游同一份官方产物也发布于 www.openssl.org 的 source 目录（校验值一致，见 notes.md）。

sources:
  url: "https://github.com/openssl/openssl/releases/download/openssl-3.5.7/openssl-3.5.7.tar.gz"
  sha256: "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8"

patches:
  - patch_file: "patches/0001-apps-speed.c.patch"
    patch_description: "Route the async speed test through OpenSSL's bounded fd_set helper"
    patch_type: "portability"
  - patch_file: "patches/0002-include-internal-sockets.h.patch"
    patch_description: "Implement the bounded fd_set helper for musl without private __fd_chk"
    patch_type: "portability"
