software: ocl-icd
# 文件位置: archives/{letter}/{name}/2.3.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 必须字段

# 版本号
version: "2.3.4"

# 编译状态
status: published

build_date: "2026-06-11"

# 源码信息

source:
  # 源码下载 URL
  url: "https://github.com/OCL-dev/ocl-icd/archive/refs/tags/v2.3.4.tar.gz"

  # 源码校验和
  sha256: "1a302b71b7304cca5a36f69d017b1af2b762cc4c2dd1c0c0e2fc1933db25c9cc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# 构建配置

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  pre_configure: autoreconf -vi -Wall
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# 补丁信息

# 应用的补丁列表
patches_applied: []

# 知识沉淀

# 编译中学到的知识
knowledge_gained:
  - "E090: HMDFS上umask 077创建的目录无法写入文件，需将config.status临时目录路径改为$TMPDIR子目录"
  - "ocl-icd原始tarball不含configure脚本，需先运行autoreconf -vi -Wall"

# Top-level build_system (required by verify gate)
build_system: autotools
