# 版本级 manifest
# 文件位置: archives/o/ocl-icd/2.3.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.3.5"

software: "ocl-icd"

# 编译状态
# published | built | failed | archived
# 首轮工作树尚未经过真机验证，标记为 built，待 HMBS 预检通过后再定级。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"
build_system: "autotools"

source:
  # 源码下载 URL（官方 GitHub tag 归档）
  url: "https://github.com/OCL-dev/ocl-icd/archive/refs/tags/v2.3.5.tar.gz"

  # 源码校验和（实测下载 117902 字节计算所得）
  sha256: "cdd7984425fa92d37273eee4180b5f57b047eda6dd8fd623e58498f844b09b75"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"

  # 编译依赖列表（格式: name/version）
  # 主配方零运行时依赖：构建使用源码自带的 khronos-headers 副本；
  # automake/libtool 仅为构建工具（tool_requires），ruby 由真机系统提供。
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# 应用的补丁列表
patches_applied: []

# 编译中学到的知识
knowledge_gained:
  - "ocl-icd 的 GitHub 归档不含 configure，需 autoreconf 自举（与 zbar 同模式）"
  - "自带 config.guess 无法识别 HarmonyOS，需显式 --build/--host=aarch64-unknown-linux-ohos"
  - "HMDFS 下 autoreconf 产物继承 umask 077，需改写为 022（E011）"
  - "上游测试为 34 个 autotest 用例（15+16+3），由 make check 驱动，testsuite.log 为取数来源"
