# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ocl-icd/2.3.5
homepage: "https://github.com/OCL-dev/ocl-icd"

# 上游测试命令（autotest 套件由 make check 驱动）
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# 源码审计（v2.3.5 tag）：check_PROGRAMS 提供 ocl_test / ocl_test_icdl；
# tests/ 下 autotest 用例共 34 个（standard 15 + default-platform 16 + workaround 3）。
upstream_tests:
  - file: ocl_test.c
    source: ocl-icd-2.3.5/ocl_test.c
    description: "上游自检程序：枚举平台并校验 ICD 加载流程（含 --default-platform 模式）"
    command: "./ocl_test"
  - file: ocl_test_icdl.c
    source: ocl-icd-2.3.5/ocl_test_icdl.c
    description: "上游自检程序：校验 clGetICDLoaderInfoOCLICD 扩展信息"
    command: "./ocl_test_icdl"
  - file: tests/testsuite
    source: ocl-icd-2.3.5/tests/testsuite.at
    description: "上游 autotest 套件：34 个用例覆盖 vendors 枚举、默认平台选择与 Intel workaround"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libOpenCL 并调用 clGetPlatformIDs 验证库可链接可调用"
    command: "./test_ocl_icd"

# 测试断言总数（上游 34 + 消费者 1）
assertion_count: 35
