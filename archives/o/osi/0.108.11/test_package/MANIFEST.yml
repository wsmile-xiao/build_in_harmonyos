# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: osi/0.108.11
homepage: "https://github.com/coin-or/Osi"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Osi/test/unitTest，需 Sample+Netlib 数据)
upstream_tests:
  - file: Osi/test/unitTest.cpp
    source: osi-0.108.11/Osi/test/unitTest.cpp
    description: "Osi unit test driver：OsiRowCut/OsiColCut/OsiCuts/OsiTestSolverInterface/SolverInterface 各套件"
    command: "Osi/test/unitTest -mpsDir=Data/Sample -netlibDir=Data/Netlib -testOsiSolverInterface"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_osi.cpp
    description: "消费者测试：通过公开 API 构造 OsiRowCut/OsiCuts 并校验切割属性"
    command: "./test_osi"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
