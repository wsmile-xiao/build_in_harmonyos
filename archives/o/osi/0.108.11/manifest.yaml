# osi 0.108.11 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.108.11"

# 软件名
software: "osi"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag，非镜像/非缓存）
  url: "https://github.com/coin-or/Osi/archive/refs/tags/releases/0.108.11.tar.gz"

  # 源码校验和（SHA-256）
  sha256: "1063b6a057e80222e2ede3ef0c73c0c54697e0fee1d913e2bef530310c13a670"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表（与 conanfile.py generate() 对齐）
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--disable-dependency-tracking"
    - "--without-glpk"
    - "--without-soplex"
    - "--without-cplex"
    - "--without-mosek"
    - "--without-xpress"
    - "--without-gurobi"

  # 编译依赖列表（格式: name/version，均已发布到 ohpcd 制品仓）
  dependencies:
    - coinutils/2.11.13

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Osi-config.guess.patch"
  - "0002-Osi-config.sub.patch"
  - "0003-Osi-configure.patch"
  - "0004-config.guess.patch"
  - "0005-config.sub.patch"
  - "0006-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "COIN-OR 系 autotools 项目（Osi 及同族）config.guess/config.sub 无 OHOS 三元组支持，需加 HarmonyOS→Linux/musl 与 *-linux-ohos→*-linux-musl 钩子（E007）"
  - "configure 的 confstat 临时目录 umask 077 在 HMDFS 上 Permission denied，需改为 umask 022（E011）"
  - "L0i 静态 AST 提取 tool_requires 不感知平台分支，Windows-only 死分支（msys2/cci.latest）导致 registry_unreachable 假失败，Linux/OHOS-only 配方应删除死分支（DRAFT-osi-0.108.11-l0i-platform-dead-branch）"
  - "COIN-OR 上游 unitTest 依赖独立数据仓 Data-Sample/Data-Netlib，官方 tarball 不含测试数据，缺数据时 Signal 11（DRAFT-osi-0.108.11-coin-or-external-test-data）"

