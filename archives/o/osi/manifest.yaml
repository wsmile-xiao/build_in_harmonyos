software: osi
display: "COIN-OR Open Solver Interface"
description: "COIN-OR Open Solver Interface, a uniform API for LP/MIP solvers"
category: library
homepage: "https://github.com/coin-or/Osi"
license: EPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools in-source build with HarmonyOS config.guess recognition as Linux musl"
    - "Disables proprietary and out-of-scope solver backends, keeps OsiTestSolver default path"
    - "Runs upstream Osi unitTest with official Data-Sample 1.2.13 MPS input on native OHOS"
  common_dependencies:
    - coinutils

versions:
  "0.108.12":
    status: built
    build_date: "2026-09-11"
    conan_ref: "osi/0.108.12"
    note: "Initial HarmonyOS PC adaptation"
