    patch_description: "LP64 修复：int32 变为 int 后 operator<<(int) 与 operator<<(int32) 签名重复，LP64 下排除"
  - patch_file: "patches/0003-osc-OscReceivedElements.h.patch"
    patch_description: "LP64 修复：int32 变为 int 后 ReceivedPacket(int) 与 ReceivedPacket(osc_bundle_element_size_t) 重复，LP64 下排除"
