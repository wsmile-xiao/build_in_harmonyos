# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OscTypes.h 假设非 x86_64 为 32 位平台（typedef long int32），aarch64 LP64 下 sizeof(int32)==8 导致 OutboundPacketStream 内部状态破坏并段错误；LP64 平台移植时优先检查 int32=long 类假设（ref: knowledge/drafts/DRAFT-oscpack-1.1.0-lp64-long-int32-typedef.kv）"
- "Release 构建（-DNDEBUG）会编译掉上游 sanity assert，类型错误以运行期内存破坏形式延迟暴露，调试时用 -O0 或 ASan 构建配合无缓冲输出定位真实崩溃点（ref: knowledge/drafts/DRAFT-oscpack-1.1.0-lp64-long-int32-typedef.kv）"
- "上游 CMakeLists 声明 cmake_minimum_required(2.6)，CMake >=4 需注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（ref: knowledge/drafts/DRAFT-oscpack-1.1.0-lp64-long-int32-typedef.kv）"
- "上游无 install 规则，补丁按源码根相对布局安装 osc/ 与 ip/ 头文件（消费者 include \"osc/OscTypes.h\"）（ref: knowledge/drafts/DRAFT-oscpack-1.1.0-lp64-long-int32-typedef.kv）"

