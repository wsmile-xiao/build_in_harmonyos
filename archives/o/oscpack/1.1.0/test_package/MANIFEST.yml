# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: oscpack/1.1.0
homepage: "http://www.rossbencina.com/code/oscpack"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -B build && cmake --build build && ./build/OscUnitTests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: OscUnitTests.cpp
    source: oscpack-1.1.0/tests/OscUnitTests.cpp
    description: "上游官方单元测试：OSC 消息打包/解包、类型编解码、异常健壮性（91 个用例，本地实测 91 passed, 0 failed）"
    command: "./OscUnitTests"
  - file: OscSendTests.cpp
    source: oscpack-1.1.0/tests/OscSendTests.cpp
    description: "上游发送端测试：UDP 回环发送各类 OSC 消息（与 OscReceiveTest 配对使用）"
    command: "./OscSendTests"
  - file: OscReceiveTest.cpp
    source: oscpack-1.1.0/tests/OscReceiveTest.cpp
    description: "上游接收端测试：UDP 回环接收并解析 OscSendTests 发送的消息"
    command: "./OscReceiveTest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_oscpack.cpp
    description: "端到端消费者测试：打包 bundle/消息 -> 按网络字节流解析回 -> 逐字段断言，含 LP64 类型修复校验与错误类型异常校验"
    command: "./test_oscpack"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 23
