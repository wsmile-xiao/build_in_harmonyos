# test_package/MANIFEST.yml
# Upstream test declaration file (CI L0e requires this file to exist)
# See docs/TEST_QUALITY_SPEC.md

package: "ogg/1.1.1"
homepage: "https://xiph.org/ogg/"

# Upstream test command: src/Makefile.am wires `check:` to build and run
# both self-test programs in the build tree.
upstream_check_command: "make check"

# The upstream test suite is executed inside conanfile.py build() via
# autotools.make(target="check") during conan create.
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream self-test programs (compiled from the library sources with
# -D_V_SELFTEST, per src/Makefile.am noinst_PROGRAMS + check: rule).
upstream_tests:
  - file: src/bitwise.c
    description: "oggpack 位读写自测（LSb/MSb 两套各 8 项，共 16 项断言）"
    command: "./test_bitwise"
  - file: src/framing.c
    description: "Ogg 页面编解码/同步/丢页恢复自测（共 14 项断言）"
    command: "./test_framing"

# test_package consumer tests (installed-package verification)
test_package_tests:
  - file: test_package.c
    description: "安装包消费者回环测试：编码一个 Ogg packet 到 page，再通过第二个流状态解码回来，逐字节校验 payload"
    command: "./ogg_consumer"

# Assertion count: upstream 16 (bitwise) + 14 (framing) + 1 (consumer round trip)
assertion_count: 31
