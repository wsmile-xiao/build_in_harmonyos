# manifest.yaml — ogg 1.1.1 version-level metadata
# follows ARCHIVE-SPEC v2.0 (bwm-ng 0.6.3 precedent: version dir only,
# no software-level manifest needed for a single-version package line)

version: "1.1.1"
software: ogg
status: built
build_date: "2026-09-15"
build_system: autotools

source:
  url: "https://codeload.github.com/xiph/ogg/tar.gz/refs/tags/v1.1.1"
  sha256: "9edf7e7922c4f922d972e2e8f2b769dc437ce7f2dbdf3f33444b536dbfd16931"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
  dependencies: []
  tool_requires:
    - automake/1.18
    - libtool/2.5.4
  cc: clang

patches_applied: []
# config.guess/config.sub 补丁在 autoreconf 之后由配方运行时施加（源码包
# 不含这两份脚本，autoreconf -fi 安装新式 2024 版脚本后用 E007 补丁），
# 无静态补丁文件（同 bwm-ng 0.6.3）。

knowledge_gained:
  - "2004 老式 autotools 包（configure.in 而非 configure.ac，无预生成 configure，无内置 config.guess/config.sub）：autoreconf >= 2.70 只读 configure.ac，需先复制 configure.in → configure.ac（bwm-ng 0.6.3 同款）"
  - "tarball 不含 config.guess/config.sub 反而简化 E007：autoreconf -fi 从 conan automake/libtool 包装入 2024 新式脚本（带 GUESS= 变量），官方 perl 补丁工具直接适用——E564 旧式锚点问题不复存在"
  - "codeload.github.com tar.gz 链接无文件名扩展提示，conan get() 字节嗅探会把 gzip 误判为 zip：source() 里 setdefault('filename', '<名>-<版本>.tar.gz') 显式指定（bwm-ng 同款）"
  - "上游 make check（src/Makefile.am 的 check: 规则）直接跑 ./test_bitwise（16 断言）+ ./test_framing（14 断言），无需额外测试框架"
  - "autotools 生成的 libogg.so.0.5.1 天然带 SONAME=libogg.so.0（-version-info 5:1:5），无 libogg 1.3.6 CMake 版的 patchelf 补 SONAME 需求"
  - "E114（umask 077→022）+ E074（make -j1）+ E178（tool_requires automake/libtool）三件套为 OHOS 上 2004 年代 autotools 包的标准适配"
