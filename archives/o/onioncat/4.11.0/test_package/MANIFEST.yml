# test_package/MANIFEST.yml — onioncat 4.11.0
# CI L0e requires this file to exist.

package: onioncat/4.11.0
homepage: "https://github.com/rahra/onioncat"

# Upstream has NO automated test suite: no `make check`/`make test`/TESTS
# target in configure.ac or Makefile.am, no tests/ directory in the 4.11.0
# tarball (full-tree scan empty).  This is a network daemon tool class —
# N=0 exemption applies.  Real verification is running the binary: the
# offline conversion modes (-i/-o/-h) exercise ocat's core onion<->IPv6
# address conversion logic without needing root, a TUN device or a running
# Tor daemon.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs packaged ocat: -h version banner, -i onion->IPv6 conversion, -o IPv6->onion conversion, invalid-input rejection"
    command: "bash test.sh"

assertion_count: 4
