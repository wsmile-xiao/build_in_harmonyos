# 版本级 manifest — onioncat 4.11.0
# 遵循 ARCHIVE-SPEC v2.0
version: "4.11.0"
software: onioncat
status: built
build_date: "2026-09-11"
build_system: autotools

source:
  url: "https://github.com/rahra/onioncat/archive/refs/tags/v4.11.0.tar.gz"
  sha256: "75ff9eed332e97a9efb7999bbe48867d00e06ac20601cc72b87897d5b1859f99"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>"
  dependencies:
    - autoconf/2.72 (tool_requires)
    - automake/1.18 (tool_requires)
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "automake 1.18（制品仓 tool 包）自带的新版 config.guess 已原生识别 HarmonyOS/aarch64-unknown-linux-ohos，onioncat 这类无老版 config.guess 的包无需 E160 系补丁"
  - "E011（umask 077 → HMDFS setgid 不可写）在无 configure 的 autotools 包上的应用点：bootstrap 生成 configure 后、跑 configure 前改写生成文件（xz/tar/wget 同类先例）"
  - "OHOS musl libc 自带 pthread（-lpthread 空解析）与 socket/inet 全套，onioncat 零外部库依赖即可编译"

patch_generation:
  method: none
  patches_count: 0
  note: "无源码补丁；唯一平台适配（umask）作用于 build() 内生成的 configure，非上游源文件"

patch_classification: []
