# 软件级 manifest — onioncat
# 遵循 ARCHIVE-SPEC v2.0

software: onioncat
display: "onioncat"
description: "OnionCat — Tor/I2P 匿名网络透明 IPv6 VPN 适配层（ocat 守护进程）"
category: network
homepage: "https://github.com/rahra/onioncat"
license: GPL-3.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "发布 tarball 无 configure，需 autoreconf 引导（tool_requires autoconf/2.72 + automake/1.18）"
    - "automake 1.18 新版 config.guess 原生识别 HarmonyOS，无需 E160 系 config.guess 补丁"
    - "E011：configure/config.status 的 umask 077 临时目录在 HMDFS setgid 下不可写，build() 内改写生成 configure 为 umask 022"
    - "零外部库依赖（pthread/socket 由 musl libc 提供）"
    - "产物不 strip（llvm-strip 后 ELF 本平台 EACCES）"
  common_dependencies: []

versions:
  "4.11.0":
    status: built
    build_date: "2026-09-11"
