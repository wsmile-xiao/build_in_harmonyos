software: open-mpi
homepage: "https://www.open-mpi.org"
license: BSD-3-Clause
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.0.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.0.10"

# 编译状态
# published | built | failed | archived
status: published

# 发布信息（published 状态必须）
published_as: open-mpi

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.10.tar.gz"

  # 源码校验和
  sha256: "5692cc80554a7117c99eaa725d35100edd8bbf73423a5e265ff867979192df7d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-3rd-party-prrte-src-mca-plm-ssh-plm_ssh_module.c.patch"
  - "0002-disable-sysv-shmem-on-ohos.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "musl libc 不提供 rindex()，需要 #define rindex strrchr"
  - "Open MPI 自带 libevent 和 hwloc，无需外部依赖"
  - "config.guess/config.sub 已支持 aarch64-unknown-linux-ohos"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_classification:
  - file: 0001-3rd-party-prrte-src-mca-plm-ssh-plm_ssh_module.c.patch
    type: portability
    platform_only: true
  - file: 0002-disable-sysv-shmem-on-ohos.patch
    type: portability
    platform_only: true
