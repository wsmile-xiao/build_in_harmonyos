software: open-mpi
display: "Open MPI"
description: "High performance message passing library (MPI implementation)"
category: network
homepage: "https://www.open-mpi.org"
license: BSD-3-Clause
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "musl libc 不提供 rindex()，需要 #define rindex strrchr"
    - "自带 libevent 和 hwloc，无需外部依赖"
    - "config.guess/config.sub 已支持 aarch64-unknown-linux-ohos"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "5.0.10":
    status: published
    build_date: "2026-05-28"
    published_as: open-mpi