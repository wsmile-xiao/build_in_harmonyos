software: ocrmypdf
display: "OCRmyPDF"
description: "OCRmyPDF 为扫描的 PDF 文件添加 OCR 文字层，使其可搜索和复制粘贴。支持多语言、自动旋转校正、PDF/A 输出等功能"
category: document
homepage: "https://github.com/ocrmypdf/OCRmyPDF"
license: MPL-2.0
build_system: python

ohos_adaptation:
  key_points:
    - "OCRmyPDF 是纯 Python 包，使用 hatchling 作为构建后端"
    - "需要外部依赖：Ghostscript (gs)、Tesseract OCR"
    - "支持 Python 3.11+"
    - "安装方式：pip install 或 uv sync"
  common_dependencies:
    - ghostscript
    - tesseract

versions:
  "17.4.2":
    status: built
    build_date: "2026-05-21"
    source_url: "https://files.pythonhosted.org/packages/source/o/ocrmypdf/ocrmypdf-17.4.2.tar.gz"