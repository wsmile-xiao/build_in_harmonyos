# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: oksh/7.8
homepage: "https://github.com/ibara/oksh"

# 上游测试命令
upstream_check_command: "make check"

# oksh 无 make check 测试套件（Makefile test 目标仅输出 "No tests"）
upstream_test_in_build: false
upstream_test_command: ""

# 上游无自动化测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "oksh 功能 smoke 测试：echo/算术/参数替换/for循环/KSH_VERSION/条件判断"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 6
