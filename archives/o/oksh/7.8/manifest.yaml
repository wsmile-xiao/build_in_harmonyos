software: oksh
build_system: autotools
version: "7.8"
status: published
build_date: "2026-06-16"

source:
  url: "https://github.com/ibara/oksh/releases/download/oksh-7.8/oksh-7.8.tar.gz"
  sha256: "3b30d5a1183b829590cc020d8ab87f22d288e98dc3fdf12feb7159536beaa950"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "oksh 7.8 configure 自动检测 HarmonyOS 平台，无需源码修改或补丁"
  - "oksh 无 make check 测试套件（Makefile test 目标仅输出 No tests），需通过手动功能测试验证"
  - "oksh 因未检测到 curses 库编译为无屏幕清除支持模式，不影响核心 shell 功能"
  - "oksh 二进制在 HarmonyOS 上首次执行需 ELF 签名（ohc-run.py sign-elf），否则报 Operation not permitted"
  - "oksh 不支持 bash 的 ${var/pattern/replacement} 模式替换语法（报 bad substitution），应使用 ksh 的 ${var#pattern} 和 ${var%pattern} 字符串截取"
  - "verify_build.py G4 检查 manifest 中 build_system 字段为扁平字段而非嵌套 build.system，需在顶层添加 build_system: autotools"
