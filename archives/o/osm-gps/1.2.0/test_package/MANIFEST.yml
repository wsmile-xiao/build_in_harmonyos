# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: osm-gps/1.2.0
homepage: "https://github.com/nzjrs/osm-gps-map"

# osm-gps-map 发布 tarball 无独立测试套件(无 tests/ 目录、无 TESTS 目标)，
# 无上游 criterion/gtest 用例可运行。test_package 提供消费者端 smoke 测试:
#   test_osm.c — 编译链接消费者程序(含 osm-gps-map.h 公共头, 经 pkg-config
#   传递拉取 GTK3/GLib 头), 调用 osm_gps_map_get_type() 注册 GObject 类型
#   (无需 X/display, 可 headless 运行), 返回非 0 类型判定 PASS。

test_type: smoke
tests:
  - name: test_osm
    source: test_osm.c
    description: >-
      消费者 smoke 测试：编译链接 libosmgpsmap-1.0, 调用 osm_gps_map_get_type()
      验证公开 API 可链接/可执行(依赖 .so 实体化至 local-libs 以规避 HMDFS 符号链接)

# 上游测试命令(无上游测试套件)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序(无)
upstream_tests: []

# test_package 中自带的测试(消费者视角验证, 调用已安装库)
test_package_tests:
  - file: test_osm.c
    description: "消费者测试 — 编译链接 libosmgpsmap-1.0 并调用 osm_gps_map_get_type()"
    command: "./test_osm"

# 上游测试断言总数(无上游测试)
assertion_count: 1
