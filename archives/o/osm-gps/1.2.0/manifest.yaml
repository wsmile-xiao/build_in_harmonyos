# 版本级 manifest
# 文件位置: archives/o/osm-gps/1.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.0"

# 软件名（适配归档名，沿用用户指定的 osm-gps，上游为 osm-gps-map）
software: osm-gps

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-09"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游 release tarball，已 strip_root）
  url: "https://github.com/nzjrs/osm-gps-map/releases/download/1.2.0/osm-gps-map-1.2.0.tar.gz"

  # 源码校验和
  sha256: "ddec11449f37b5dffb4bca134d024623897c6140af1f9981a8acc512dbf6a7a5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（./configure 参数）
  configure_options:
    - "--disable-introspection"
    - "--disable-gtk-doc"
    - "--enable-shared"
    - "--disable-static"
    - "--build=aarch64-linux"
    - "--host=aarch64-linux"
    - "PKG_CONFIG_PATH=<generators_folder>"
  # 注: 链接阶段追加 -fuse-ld=lld（OHOS 无 GNU ld）；
  #     HMDFS TMPDIR 在 build() 内打补丁固定。

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gtk/3.24.43
    - cairo/1.18.4
    - libsoup/2.74.3
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（conandata 文件补丁，本包无）
patches_applied: []
# 注: HMDFS TMPDIR 补丁在 build() 内以字符串改写 configure 实现，
#     非文件补丁，故不在此列出。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS/OHOS 安全框架阻断 configure config.status 在构建树内建临时子目录，须提供固定可写 TMPDIR 并改写 ac_tmp=$tmp 模板、移除 rm -fr 清理 trap（E114）。"
  - "libtool -version-info 2:0:1 产 .so.1.1.0，SONAME 为 libosmgpsmap-1.0.so.1；打包须显式建 SONAME 链接，否则消费者运行时报 'Error loading shared library libosmgpsmap-1.0.so.1'（当前已用 readelf 读取 SONAME 自动建链）。"
  - "OHOS zlib 版本冲突: glib2/2.88.0 要 zlib/1.3.1，GTK3 栈其余用 1.3.1.1，须 requires zlib/1.3.1.1 override 以复用已发布二进制。"
  - "glib 不固定版本，由 gtk/3.24.43 约束解析到 2.84.0.1，避免与 PkgConfigDeps 透传的 glib-2.0.pc 冲突。"
  - "safe-delete 经 BASH_ENV 把 rm/unlink/rmdir 定义为函数 exec ${CODEBUDDY_SAFE_DELETE_BIN_DIR}/rm，该变量必须为绝对路径，否则 libtool 链接报 Error 127。"
  - "libsoup/2.74.3 发布二进制静态内嵌 GLib GObject 类型系统并全局导出 g_type_register_fundamental/g_param_type_register_static（readelf 确认其 NEEDED 不含 libgobject，nm -D 确认导出整组 GType API）；任何同时经 gtk 加载共享 libgobject 的消费者会在进程内得到两份 GType 系统（同 soname）而 abort（'cannot register existing type gchar' / 'g_param_type_register_static assertion'）。绕行: test_package LD_PRELOAD 一个 shim，经显式 dlopen(libgobject-2.0.so.0) 把全部 GType 注册汇入共享 libgobject 单表并按类型名幂等。根本修复须让 libsoup 链共享 glib（当前配方 require 空包 glib2/2.88.0 致内嵌）。"
  - "test_package 实体化依赖 .so 到 local-libs 时，目录落在源码树会跨 conan-verify 保留；conan 安装包只读，旧副本无法被 shutil.copy 覆盖（Operation not permitted）。须运行前 rmtree 旧目录（先解除只读）、拷贝后 chmod 0755。"
