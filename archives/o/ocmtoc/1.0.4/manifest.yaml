version: "1.0.4"
software: "ocmtoc"
status: built
build_date: "2026-09-12"
build_system: "custom"

source:
  url: "https://github.com/acidanthera/ocmtoc/archive/refs/tags/1.0.4.tar.gz"
  sha256: "dbc33ca5d5ae436b2845e36fc13ba878261480788db86fc6daab89dc5588e51a"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "-DCURRENT_PROJECT_VERSION='\"1.0.4\"'"
    - "-Iportability/shim -Iinclude -Iinclude/stuff"
    - "no LTO_SUPPORT (no libLTO on HarmonyOS)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-mmap-flags-portability.patch"

knowledge_gained:
  - "ocmtoc 的 mtoc 目标仅需 efitools/mtoc.c + libstuff 静态库（Xcode 工程实证）"
  - "ofile.c 的 LTO 引用全部包在 #ifdef LTO_SUPPORT 内，不定义即无需 lto.c"
  - "libstuff 的 mach 依赖可用 POSIX 等价实现（calloc/munmap/uname）"
  - "writeout.c 是 ar/ranlib 归档写出器，mtoc 零调用；其 O_FSYNC/host_sched_info 需内核支持非头垫片可解，应从闭包剔除而非逐个补符号"
