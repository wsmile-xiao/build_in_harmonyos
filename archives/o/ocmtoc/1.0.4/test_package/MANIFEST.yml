package: "ocmtoc/1.0.4"
homepage: "https://github.com/acidanthera/ocmtoc"
upstream_tests_exist: true
upstream_test_audit: "Upstream ships two test collections. (1) tests/test-cases: 103 cctools run-tests
  cases, every Makefile declares '# PLATFORM: MACOS' and tests/include/common.makefile funnels all
  tools through xcrun and Apple (internal) SDKs; upstream CI (.github/workflows/main.yml) never runs
  run-tests (only 'xcodebuild -scheme mtoc') and 0 cases target mtoc -- not runnable on HarmonyOS and
  not applicable to this package. (2) libstuff_test/: portable C unit tests for libstuff (custom test.h
  harness, no Xcode dependency). Executed here: the subset whose object-under-test is linked into the
  shipped mtoc binary -- allocate_test (libstuff/allocate.c, 4 tests), arch_test (libstuff/arch.c,
  7 tests), get_arch_from_host_test (libstuff/get_arch_from_host.c, 1 test), rnd_test (libstuff/rnd.c,
  2 tests) plus harness init (null_test, 1 test) = 15 tests total, built with the same flags/shims as
  mtoc and run as ./libstuff_test in build(); summary parsed from its 'tests completed (N/M passing)'
  line. Excluded libstuff_test files (align/args/depinfo/guess_short_name/version_number/
  reset_load_command_pointers) cover modules outside the mtoc link closure (absent from the recipe's
  _mtoc_sources list; reset_* additionally needs writeout.c, excluded for its macOS-kernel-only
  throttle path), so they cannot validate this deliverable."
upstream_test_in_build: true
upstream_test_command: "./libstuff_test in conanfile build() (upstream libstuff unit suite, closure subset);
  result persisted to build/upstream_test_result.json, shipped as res/upstream_test_result.json,
  re-emitted verbatim by test_package every round (cache-hit safe)"
upstream_tests:
  - description: "upstream libstuff unit tests for shipped modules: allocate (4), arch (7), get_arch_from_host (1), rnd (2), harness init (1)"
    command: "./libstuff_test (built in build() from libstuff_test/ + mtoc closure objects)"
  - description: "cctools run-tests suite: 103 test-cases, all PLATFORM: MACOS, require Xcode toolchain; none targets mtoc; unwired from upstream CI"
    command: "tests/run-tests (not runnable on HarmonyOS, documented exclusion)"
  - description: "build-time smoke: mtoc --version prints 1.0.4"
    command: "test \"$(mtoc --version)\" = \"1.0.4\""
  - description: "build-time smoke: mtoc --fullversion prints Acidanthera ocmtoc 1.0.4"
    command: "mtoc --fullversion | grep -q \"Acidanthera ocmtoc 1.0.4\""
  - description: "build-time smoke: no-arg invocation fails via usage()"
    command: "if mtoc; then exit 1; fi"
  - description: "build-time smoke: garbage input is rejected with an error diagnostic"
    command: "mtoc bad.bin bad.pe fails, stderr contains error"
test_package_tests:
  - file: "verify_mtoc.py"
    description: "Execute packaged mtoc --version and assert stdout is 1.0.4 with exit 0"
    command: "python3 verify_mtoc.py (check 1/3)"
  - file: "verify_mtoc.py"
    description: "Execute packaged mtoc --fullversion and assert upstream identity string"
    command: "python3 verify_mtoc.py (check 2/3)"
  - file: "verify_mtoc.py"
    description: "Execute packaged mtoc on a garbage file and assert non-zero exit, error diagnostic, no output file"
    command: "python3 verify_mtoc.py (check 3/3)"
assertion_count: 7
