software: openvdb
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/12.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游 tag v12.1.1——用户给 12.1.1 存在，按真实版）
version: "12.1.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"

# 构建系统标识（verify-build 要求）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（codeload 官方）
  url: "https://codeload.github.com/AcademySoftwareFoundation/openvdb/tar.gz/refs/tags/v12.1.1"

  # 源码校验和
  sha256: "91ed895f088f831096abc8eb4761abcbb1e5cc280a94ee5cb5279376868dd743"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 构建系统标识（verify-build 要求）
  build_system: cmake

  # 配置选项列表（blosc 关闭——制品仓无；关 Python/文档/Houdini/AX）
  configure_options:
    - "-DOPENVDB_USE_BLOSC=OFF"
    - "-DOPENVDB_BUILD_PYTHON_MODULE=OFF"
    - "-DOPENVDB_BUILD_DOCS=OFF"
    - "-DOPENVDB_BUILD_HOUDINI_PLUGIN=OFF"
    - "-DOPENVDB_BUILD_MAYA_PLUGIN=OFF"
    - "-DOPENVDB_BUILD_AX=OFF"
    - "-DOPENVDB_BUILD_UNITTESTS=OFF"

  # 编译依赖列表（格式: name/version）——tbb/zlib/boost 制品仓均有
  dependencies:
    - "tbb/2023.0.0"
    - "zlib/1.3.1"
    - "boost/1.90.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "openvdb（稀疏体积库）CMake 构建，依赖 tbb/zlib/boost（制品仓均有）；blosc 制品仓无——OPENVDB_USE_BLOSC=OFF 关闭绕过"
    - "上游测试：openvdb/unittest 套件 118 个 Test*.cc / 118 test suites / 723 用例，本地源码树 -DOPENVDB_BUILD_UNITTESTS=ON 跑 vdb_test 二进制 gtest 全量实跑 721 通过 / 2 失败（99.72%）——TestLevelSetUtil.testExtractEnclosedRegion、TestPoissonSolver.testSolveWithSegmentedDomain 均抛 TypeError: signedFloodFill is supported only for signed value grids（上游套件自身问题，与归档适配无关）；归档构建 UNITTESTS=OFF；消费测试 1/1 验证 libopenvdb 链接 + 头文件可用"
