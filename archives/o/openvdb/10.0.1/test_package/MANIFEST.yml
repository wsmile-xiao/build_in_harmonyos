package: openvdb/10.0.1
homepage: "https://www.openvdb.org/"

# openvdb 10.0.1 上游测试（rule4 攻坚真跑口径，2026-09-14）：
# 宏口径：openvdb/unittest 110 个 Test*.cc（含 main.cc）/ 703 个 GTest
# 用例宏 + nanovdb/unittest 2 个 .cc / 118 个用例宏 = 821 宏
# （TEST/TEST_F/TEST_P/TYPED_TEST 逐文件 grep，v10.0.1 tarball 口径）。
# 实跑口径：TEST_P/TYPED_TEST 参数化实例展开后实际执行 843 用例：
#   vdb_test                695 实例（691 PASS / 4 FAIL）
#   nanovdb_test_nanovdb    115 实例（115 PASS，85 宏展开）
#   nanovdb_test_openvdb     33 实例（33 PASS，33 宏）
# 合计 839 PASS / 4 FAIL（99.5%），OHOS 本机 conanbuild 环境真实执行。
# 4 失败定性（均非适配引入，上游平台依赖缺陷）：
#   1. TestLevelSetUtil.testExtractEnclosedRegion /
#      TestPoissonSolver.testSolveWithSegmentedDomain：
#      "TypeError: signedFloodFill is supported only for signed value grids"
#      ——上游 computeEnclosedRegionMask 内部对 ValueConverter<char> 树调
#      signedFloodFill，其 enable_if 用 std::is_signed<ValueType>；ARM
#      AAPCS ABI 下 char 默认 unsigned（x86 默认 signed）→ ARM 上走
#      dummy 分支抛 TypeError。上游源码对 char signedness 的平台依赖。
#   2. TestLinearInterp.testStencilsMatchFloat/Double：
#      EXPECT_EQ 严格比较浮点，0.778334379 vs 0.77833432（float 第 7
#      位/ double 第 16 位 ulp 级差异）——跨架构浮点求值顺序差异。
# 消费测试验证库可用性：libopenvdb 存在 + openvdb.h 头文件 +
# consumer 编译链接真实执行，1/1 ALL PASS。
upstream_tests: 821
upstream_test_result: "宏口径 821；实跑 843 实例（参数化展开），839 PASS / 4 FAIL（99.5%）——4 失败均为上游平台依赖缺陷（2 例 signedFloodFill char signedness ARM ABI 差异 TypeError + 2 例浮点 ulp 级 EXPECT_EQ 精度差异），非适配引入，逐例定性见 conan create 日志 HMBS_UPSTREAM_TEST_RESULT 与失败明细"
upstream_test_command: "OPENVDB_BUILD_UNITTESTS=ON + OPENVDB_BUILD_NANOVDB=ON NANOVDB_BUILD_UNITTESTS=ON 真实编译 vdb_test/nanovdb_test_nanovdb/nanovdb_test_openvdb，build() 内 conanbuild 环境真实执行（gtest/1.17.0.1 test_requires，制品仓 OHOS 二进制）"

test_package_tests:
  - file: test_openvdb.py
    description: "消费测试：libopenvdb 存在 + openvdb.h 头文件 + consumer 编译链接（3 断言），1/1 ALL PASS"
    command: "python3 test_openvdb.py <package_folder>"

assertion_count: 3
