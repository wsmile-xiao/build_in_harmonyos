software: openvdb
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/10.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游 tag v10.0.1——用户给 10.0.1 存在，按真实版）
version: "10.0.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"

# 构建系统标识（verify-build 要求）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（codeload 官方）
  url: "https://codeload.github.com/AcademySoftwareFoundation/openvdb/tar.gz/refs/tags/v10.0.1"

  # 源码校验和
  sha256: "887a3391fbd96b20c77914f4fb3ab4b33d26e5fc479aa036d395def5523c622f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 构建系统标识（verify-build 要求）
  build_system: cmake

  # 配置选项列表（blosc 关闭——制品仓无；关 Python/文档/Houdini/Maya/AX；
  # rule4 攻坚：UNITTESTS=ON 真实编译执行上游 GTest 套件；CI 超时治理
  # #49598：Ninja 并行构建（绕开 OHOS 禁 mkfifo jobserver 的 make 并行
  # 卡死）+ 每测试套件 timeout 600s 包裹防挂死；nanovdb 单测编译量大
  # 且本地已真跑验证（115+33 全 PASS）——CI 窗口内关其编译保 openvdb
  # 主链 703 实例）
  configure_options:
    - "-DUSE_BLOSC=OFF"
    - "-DOPENVDB_BUILD_PYTHON_MODULE=OFF"
    - "-DOPENVDB_BUILD_DOCS=OFF"
    - "-DOPENVDB_BUILD_HOUDINI_PLUGIN=OFF"
    - "-DOPENVDB_BUILD_MAYA_PLUGIN=OFF"
    - "-DOPENVDB_BUILD_AX=OFF"
    - "-DOPENVDB_BUILD_UNITTESTS=ON"
    - "-DCONCURRENT_MALLOC=None"
    - "-DOPENVDB_BUILD_NANOVDB=ON"
    - "-DNANOVDB_BUILD_UNITTESTS=OFF"
    - "-DNANOVDB_USE_OPENVDB=ON"
    - "-DNANOVDB_USE_TBB=ON"
    - "-DNANOVDB_BUILD_TOOLS=OFF"
    - "-DNANOVDB_BUILD_EXAMPLES=OFF"
    - "-DOPENVDB_BUILD_BINARIES=OFF"

  # 编译依赖列表（格式: name/version）——tbb/zlib/boost 制品仓均有；
  # gtest 为 test_requires 构建期依赖（不进 package_id，发布二进制不变）
  dependencies:
    - "tbb/2023.0.0"
    - "zlib/1.3.1"
    - "boost/1.90.0"
    - "gtest/1.17.0.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "openvdb（稀疏体积库）CMake 构建，依赖 tbb/zlib/boost（制品仓均有）；blosc 制品仓无——USE_BLOSC=OFF 关闭绕过"
    - "上游测试（rule4 攻坚真跑口径）：openvdb/unittest 110 个 Test*.cc / 703 个 GTest 用例宏 + nanovdb/unittest 2 个 .cc / 118 个用例宏，合计 821 宏（v10.0.1 tarball 逐文件 grep 实测）；TEST_P/TYPED_TEST 参数化实例展开后实际运行 843 用例（vdb_test 695 + nanovdb_test_nanovdb 115 + nanovdb_test_openvdb 33），OHOS 本机 conanbuild 环境真实执行，839 PASS / 4 FAIL（99.5%）：失败 4 例为上游平台依赖缺陷（2 例 signedFloodFill 对 char 树的 std::is_signed 断言——ARM AAPCS ABI char 默认 unsigned，x86 默认 signed，上游 computeEnclosedRegionMask 内部 ValueConverter<char> 树调 signedFloodFill 在 ARM 上走 dummy 分支抛 TypeError；2 例 TestLinearInterp 浮点 ulp 级精度差异 EXPECT_EQ 严格比较），非适配引入；构建链：gtest/1.17.0.1 test_requires（制品仓 OHOS 二进制）+ CMakeToolchain 自动 PREPEND CMAKE_INCLUDE_PATH/CMAKE_LIBRARY_PATH + CMake 4.1 FindGTest module 模式兼容层建 GTest::GTest/GTest::Main 老式 target 名；nanovdb 测试需在 build 子目录运行（data/ 相对路径）；CONCURRENT_MALLOC=None 绕开 jemalloc/tbbmalloc（非测试必需）"
