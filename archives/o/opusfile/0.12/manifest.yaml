# 版本级 manifest
# 文件位置: archives/o/opusfile/0.12/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: opusfile
version: "0.12"
status: built
build_date: "2026-05-20"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://downloads.xiph.org/releases/opus/opusfile-0.12.tar.gz"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom  # 手动编译避开 E100 问题
  configure_options:
    - "--disable-http"  # 禁用 HTTP 支持，避开 OpenSSL 依赖
  dependencies:
    - opus/1.4
    - libogg/1.3.5
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - 0001-config.guess.patch

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "autotools config.status 临时文件权限问题（E100），手动编译是可靠替代方案"
  - "最新 config.sub（2025-07-10）已支持 linux-ohos 三元组"
  - "禁用 HTTP 支持可避开 OpenSSL 依赖复杂性"