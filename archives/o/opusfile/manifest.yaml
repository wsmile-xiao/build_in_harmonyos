# 软件级 manifest
# 文件位置: archives/o/opusfile/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: opusfile
display: "opusfile"
description: "Opus 音频文件读取和解码库，支持 Ogg Opus 文件格式"
category: library
homepage: "https://opus-codec.org/"
license: BSD-3-Clause

# ============================================================
# 构建信息
# ============================================================

build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "autotools 在 HarmonyOS 上可能遇到临时文件权限问题（E100），需要手动编译或切换构建系统"
    - "最新 config.sub（2025-07-10）已支持 linux-ohos 三元组"
    - "禁用 HTTP 支持（--disable-http）避开 OpenSSL 依赖"
  common_dependencies:
    - opus
    - libogg

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.12":
    status: built
    build_date: "2026-05-20"
    build_type: custom  # 手动编译避开 autotools E100 问题