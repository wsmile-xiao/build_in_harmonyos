# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.24.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.24.1"

# 软件名
software: "openal"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/kcat/openal-soft/archive/refs/tags/1.24.1.tar.gz"

  # 源码校验和
  sha256: "e1b6ec960e00bfed3d480330274b0f102dc10e4ae0dbb70fd9db80d6978165b1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（由 conanfile.py generate() 的 CMakeToolchain 注入）
  configure_options:
    - "LIBTYPE=STATIC"
    - "ALSOFT_DLOPEN=OFF"
    - "ALSOFT_UTILS=OFF"
    - "ALSOFT_EXAMPLES=OFF"
    - "ALSOFT_TESTS=OFF"
    - "ALSOFT_UPDATE_BUILD_VERSION=OFF"
    - "ALSOFT_EMBED_HRTF_DATA=OFF"
    - "ALSOFT_INSTALL_CONFIG=OFF"
    - "ALSOFT_INSTALL_HRTF_DATA=OFF"
    - "ALSOFT_INSTALL_AMBDEC_PRESETS=OFF"
    - "ALSOFT_EAX=OFF"
    - "ALSOFT_BACKEND_ALSA=OFF"
    - "ALSOFT_BACKEND_PIPEWIRE=OFF"
    - "ALSOFT_BACKEND_PULSEAUDIO=OFF"
    - "ALSOFT_BACKEND_JACK=OFF"
    - "ALSOFT_BACKEND_OSS=OFF"
    - "ALSOFT_BACKEND_SOLARIS=OFF"
    - "ALSOFT_BACKEND_SNDIO=OFF"
    - "ALSOFT_BACKEND_PORTAUDIO=OFF"
    - "ALSOFT_BACKEND_SDL2=OFF"
    - "ALSOFT_BACKEND_COREAUDIO=OFF"
    - "ALSOFT_BACKEND_OBOE=OFF"
    - "ALSOFT_BACKEND_OPENSL=OFF"
    - "ALSOFT_BACKEND_WAVE=OFF"
    - "ALSOFT_CPUEXT_SSE=OFF / SSE2 / SSE3 / SSE4_1=OFF, NEON=ON (armv8)"

  # 编译依赖列表（格式: name/version）；外部后端全部关闭，无 Conan 依赖，
  # fmt-11.0.2 由源码树内置（add_subdirectory EXCLUDE_FROM_ALL）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（1.24.1 面向 C++17，无需 1.25.2 的 libc++15/Clang15 兼容补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OpenAL Soft 1.24.1 全项目 C++17（CXX_STANDARD 17），无 <format>/<ranges>/source_location 等 C++20 依赖，OHOS clang15/libc++15 零补丁编译通过（对比 1.25.2 C++20 需 9 个兼容补丁）"  # ref: archives/o/openal-soft/1.25.2/notes.md
  - "CMakeToolchain 将 os=OHOS 映射为 CMAKE_SYSTEM_NAME=HarmonyOS，CMake 打印 'System is unknown to cmake, create: Platform/HarmonyOS' 属预期噪音，pthread/rt/m 探测全部正常、构建与测试不受影响"  # knowledge_ref: knowledge/doc/E092.md
  - "loopback 是伪后端：CMake 后端摘要只列 Null，但 alc/backends/loopback.cpp 无条件编译，alcLoopbackOpenDeviceSOFT/alcRenderSamplesSOFT 在无音频设备环境可直接做真机级渲染验证"  # ref: knowledge/drafts/openal-1.24.1-alext-prototypes-loopback.kv
  - "alext.h 的扩展函数原型（alcLoopbackOpenDeviceSOFT 等）必须先 #define AL_ALEXT_PROTOTYPES 才声明，枚举宏则无条件；漏定义时报隐式函数声明 + int→指针错误，极易误判为头文件缺失"  # knowledge_ref: knowledge/drafts/openal-1.24.1-alext-prototypes-loopback.md
  - "ALSOFT_DRIVERS=null + ALC_SOFT_loopback（mono/short/8kHz）渲染 220Hz 正弦实测：peak=16383（恰为 0.5FS）、过零 54 次（≈2×频率×时长，正弦每周期升/降各过零一次），消费者断言应校验波形特征而非仅'非零'"  # ref: knowledge/drafts/openal-1.24.1-alext-prototypes-loopback.md

