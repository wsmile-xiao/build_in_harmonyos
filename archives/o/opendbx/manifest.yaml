software: opendbx
display: "OpenDBX"
description: "Database abstraction layer with a C and C++ API"
category: db
homepage: "https://www.linuxnetworks.de/doc/index.php/OpenDBX"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Builds the backend-independent core libraries only (libopendbx + libopendbxplus); every backend needs a vendor client library unavailable on OHOS"
    - "Disables the odbx-sql utility (--disable-utils) to avoid the readline/ncurses chain and NLS (--disable-nls) to avoid libintl"
    - "C++ sources predate C++11 and are compiled with -std=c++14, matching Gentoo and Alpine"
    - "Upstream regression suite needs live database servers, so API contracts are covered by test_package/"
  common_dependencies: []

versions:
  "1.4.6":
    status: built
    build_date: "2026-09-11"
    conan_ref: "opendbx/1.4.6"
