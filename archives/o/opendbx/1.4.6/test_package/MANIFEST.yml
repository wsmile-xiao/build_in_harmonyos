package: "opendbx/1.4.6"
homepage: "https://www.linuxnetworks.de/doc/index.php/OpenDBX"

upstream_check_command: "make -j1 check"
upstream_test_in_build: false
upstream_test_command: "test_upstream_sqlite3 <tmpdir> sqlite3 (sqlite3 file backend, offline CREATE/INSERT/SELECT/DROP via installed libopendbx; backend staged under bare soname on LD_LIBRARY_PATH since odbx_init takes a backend name)"

# Upstream ships a 9-backend regression matrix (test/odbxtest.sh runs
# odbxtest/odbxplustest against live database servers configured via a
# per-site odbxtest.site credential file; Gentoo RESTRICTs the suite as
# interactive-only). Eight backends (mysql, pgsql, sqlite, firebird, mssql,
# sybase, oracle, odbc) need live servers/credentials and cannot run on the
# OHOS preflight machine. The ninth -- sqlite3 -- is a local file backend
# needing no server (upstream: odbxtest -b sqlite3backend -h <dir> -d
# <file>); this recipe builds it (--with-backends=sqlite3, vendored
# sqlite-autoconf-3490100 amalgamation, zero Conan deps)
# and test_upstream_sqlite3.c exercises its exact path (init/bind/query/
# result/row_fetch/field_value over CREATE/INSERT/SELECT/DROP) against a
# temp file, verifying row content and a non-empty backing file.
upstream_tests:
  - file: test/odbx-regression.c
    source: opendbx-1.4.6/test/odbx-regression.c
    description: "C regression runner (odbxtest): init/bind/query/result/LOB paths against a live backend"
    command: "odbxtest -b <backend> -h <host> -d <database> -u <user> -w <password> (requires live database server; 8 of 9 backends)"
  - file: test/odbxplus-regression.cpp
    source: opendbx-1.4.6/test/odbxplus-regression.cpp
    description: "C++ regression runner (odbxplustest): same matrix through the OpenDBX::Conn API"
    command: "odbxplustest -b <backend> -h <host> -d <database> -u <user> -w <password> (requires live database server; 8 of 9 backends)"
  - file: test_package/test_upstream_sqlite3.c
    source: "archives/o/opendbx/1.4.6/test_package/test_upstream_sqlite3.c"
    description: "Runnable offline subset of the upstream sqlite3 path: same init/bind/query/result sequence as odbxtest -b sqlite3backend against a temp file, no server (backend name sqlite3, staged under bare soname on LD_LIBRARY_PATH)"
    command: "test_upstream_sqlite3 <tmpdir> sqlite3"

test_package_tests:
  - id: "c-api-contract"
    source: "test_opendbx.c"
    command: "test_opendbx"
    description: >-
      Exercise the libopendbx C API without a database server: parameter
      validation, unknown-backend dlopen failure branch, error message/type
      reporting, library version option and null-handle guards.
  - id: "cxx-api-contract"
    source: "test_opendbxplus.cpp"
    command: "test_opendbxplus"
    description: >-
      Exercise the libopendbxplus C++ API without a database server:
      Exception value semantics and the throws-on-unusable-handle contract
      of Conn, including NOTEXIST propagation for unknown backends.

test_counting:
  upstream_independent_total: 1
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 22
