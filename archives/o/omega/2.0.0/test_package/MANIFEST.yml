# test_package/MANIFEST.yml
# 上游官方测试声明 — omega/2.0.0 (xapian-omega)
# 依据 2026-09-10 真机构建实测（见 archives/o/omega/2.0.0/notes.md 日志路径）

package: omega/2.0.0
homepage: "https://xapian.org/omega"

# 上游测试入口：automake serial harness（Makefile.am:176-192）
upstream_check_command: "make check"

# conanfile.py build() 已集成上游测试（can_run 保护下执行 make -j1 check）
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的 11 个注册用例（Makefile.am TESTS 全量清单）
upstream_tests:
  - file: atomparsertest.cc
    source: xapian-omega-2.0.0/atomparsertest.cc
    description: "Atom/RSS feed parser unit test"
    command: "./atomparsertest"
  - file: csvesctest.cc
    source: xapian-omega-2.0.0/csvesctest.cc
    description: "CSV escaping helper unit test"
    command: "./csvesctest"
  - file: htmlparsertest.cc
    source: xapian-omega-2.0.0/htmlparsertest.cc
    description: "HTML parser unit test"
    command: "./htmlparsertest"
  - file: jsonesctest.cc
    source: xapian-omega-2.0.0/jsonesctest.cc
    description: "JSON escaping helper unit test"
    command: "./jsonesctest"
  - file: md5test.cc
    source: xapian-omega-2.0.0/md5test.cc
    description: "MD5 digest unit test"
    command: "./md5test"
  - file: sdbntest.cc
    source: xapian-omega-2.0.0/clickmodel/tests/sdbntest.cc
    description: "SDBM database unit test"
    command: "./sdbntest"
  - file: urlenctest.cc
    source: xapian-omega-2.0.0/urlenctest.cc
    description: "URL encode/decode unit test"
    command: "./urlenctest"
  - file: utf8converttest.cc
    source: xapian-omega-2.0.0/utf8converttest.cc
    description: "UTF-8/iconv conversion unit test"
    command: "./utf8converttest"
  - file: omegatest.pl
    source: xapian-omega-2.0.0/omegatest.pl
    description: "omega CGI integration suite (scriptindex-driven, hundreds of internal assertions; faketime-dependent cases self-skip)"
    command: "./omegatest.pl"
  - file: sourcetest
    source: xapian-omega-2.0.0/sourcetest
    description: "source-tree sanity checks (headers, shebangs, trailing whitespace)"
    command: "./sourcetest"
  - file: omindextest
    source: xapian-omega-2.0.0/omindextest
    description: "omindex MIME-detection integration test (needs MAGIC env pointing at libmagic magic.mgc)"
    command: "./omindextest"

# test_package 消费者视角测试（运行包内 omega/omindex/scriptindex 全链路）
test_package_tests:
  - file: smoke.sh
    description: "version 断言 + scriptindex 建库 + omega CGI 查询端到端"
    command: "bash smoke.sh"

# 注册用例数（omegatest.pl 另有内部断言数百项，不计入）
assertion_count: 11
