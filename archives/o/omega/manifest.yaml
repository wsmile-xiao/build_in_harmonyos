# 软件级 manifest
# 文件位置: archives/o/omega/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: omega

# 显示名
display: "Xapian Omega"

# 一句话描述
description: "Xapian 搜索引擎的 CGI 检索前端与文件索引器（xapian-omega）"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://xapian.org/omega"

# 开源许可证（SPDX 标识）
license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "xapian-omega 2.0.x requires xapian-core >= 2.0.0 (configure XO_REQUIRE); 1.4.x cannot substitute"
    - "Autotools package needs config.guess/config.sub linux-ohos recognition"
    - "configure tmp-dir creation needs umask 022 under HMDFS/toybox mktemp"
    - "Consumers of published packages must not trust baked-in *-config prefixes (xapian-config prefix=\"/\" rewrite)"
    - "omindex MIME detection via static libmagic requires MAGIC env pointing at magic.mgc from the libmagic package"
    - "omega CGI query parameter is P= (not query=); upstream omegatest.pl is the reference"
  # 跨版本通用依赖
  common_dependencies:
    - "xapian-core"
    - "zlib"
    - "pcre2"
    - "libmagic"

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.0.0":
    status: built
    build_date: "2026-09-10"
