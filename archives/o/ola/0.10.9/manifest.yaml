# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/{version}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10.9"

# 软件名
software: "ola"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游 GitHub tag tarball——R39 官方源）
  url: "https://github.com/OpenLightingProject/ola/archive/refs/tags/0.10.9.tar.gz"

  # 源码校验和
  sha256: "d2a80d907f5a0a5169583060bd32aa0fdbb2fdfe18d1194dd922595ab6d447b5"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表（路径 A：核心库 + olad 守护进程 + 20 协议插件；
  # unittests 开启并实跑；HTTP/Python/Java 组件关闭）
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-shared --enable-static"
    - "--enable-unittests"
    - "--disable-http"
    - "--disable-examples"
    - "--disable-python-libs"
    - "--disable-java-libs"
    - "--disable-fatal-warnings"
    - "--without-dns-sd"

  # 编译依赖列表（全部来自 ohpcd 制品仓）
  dependencies:
    - "protobuf/3.17.3"
    - "uuid/2.40.1"

  # 构建工具依赖
  build_dependencies:
    - "automake/1.18"
    - "libtool/2.5.4.1"

  # 测试依赖（make check 用）
  test_dependencies:
    - "cppunit/1.15.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
# 共 2 份补丁（可重现的源码变更）：
#   0001 — common/network/NetworkUtils.cpp: OHOS bionic 无 _res 符号的
#          NameServers() 优雅降级 + /proc/net/route DefaultRoute() 通用
#          POSIX 回退（feature-detection 守护，非平台宏）
#   0002 — configure.ac: AC_CACHE_CHECK+AC_LINK_IFELSE 探针探测全局
#          _res resolver state 符号（可链接则定义 HAVE_DECL__RES；OHOS
#          musl resolv.h 无 glibc 式全局 _res 声明，探针失败→不定义
#          →0001 的降级分支生效）+ netlink/sys-socket 共存探针
# config.guess/config.sub 的 HarmonyOS 识别与 configure 的 umask 077→022
# 修复属"生成文件运行期编辑"（R6），在 conanfile.py build() 内完成，
# 不作为补丁入 patches/。

patches_applied:
  - "0001-common-network-NetworkUtils.cpp.patch"
  - "0002-configure-ac-res-symbol.patch"

# ============================================================
# 产物信息
# ============================================================

artifacts:
  libraries:
    - "libolacommon.a (4.3 MB, 公共库: 网络/线程/RDM/IO/protobuf)"
    - "libola.a (客户端 RPC 库)"
    - "libolaserver.a (服务器核心)"
    - "libolaserverplugininterface.a (插件 API)"
    - "20 个协议插件静态库 (artnet/e131/usbpro/spi/...)"
  executables:
    - "olad (DMX512 守护进程)"
    - "ola_trigger (RDM 触发器)"
    - "usbpro_firmware (USB Pro 固件工具)"
    - "rdmpro_sniffer (RDM 嗅探器)"
  headers: "182 个头文件 (include/ola + include/olad)"

# ============================================================
# 测试信息
# ============================================================

test:
  # 上游测试（make check 实跑）
  upstream_tests: "79 (78 CppUnit Tester 二进制 + 1 shell 脚本)"
  upstream_pass: 77
  upstream_fail: 2
  upstream_fail_detail:
    - "common/base/CredentialsTester: setuid/setgid Operation not permitted（OHOS 应用沙箱禁 root 切换，环境限制）"
    - "ola/OlaClientTester: OlaDaemon 需 getpwuid 解析 home 目录（OHOS 无 passwd 数据库，环境限制）"
  test_package: "test_ola (22 CHECK 断言，libolacommon 5 大公共 API)"

# ============================================================
# 备注
# ============================================================

notes: "完整适配过程见同目录 notes.md"
