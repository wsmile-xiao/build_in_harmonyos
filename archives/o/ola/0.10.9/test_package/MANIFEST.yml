# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ola.cpp
    description: "消费者测试：真实调用 libolacommon API（IPV4Address/MACAddress/UID/DmxBuffer/StringUtils，22 个 CHECK 断言）"
    command: "./test_ola"

# 测试断言总数 (CppUnit 每个 Tester 含多个用例，总数约 430)
assertion_count: 430
