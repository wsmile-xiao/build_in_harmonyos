# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ola/0.10.9
homepage: "https://www.openlighting.org/ola/"

# 上游测试命令 (autotools check 目标)
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试 (make -j1 check)
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的测试 (make check, 本配置形态下 TESTS=79: 78 个 CppUnit
# Tester 二进制 + 1 个 FileValidateTest.sh; python 系 12 个脚本因
# --disable-python-libs 未注册, 详见版本目录 notes.md)
