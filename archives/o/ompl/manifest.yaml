name: ompl
description: Open Motion Planning Library - a sampling-based motion planning library
category: scientific
license: BSD-3-Clause
website: https://ompl.kavrakilab.org/
repository: https://github.com/ompl/ompl

# Dependencies
dependencies:
  required:
    - boost >= 1.68
    - cmake >= 3.12
    - eigen >= 3.3
  optional:
    - vamp
    - doxygen
    - flann
    - spot
    - yaml-cpp

# Build system
build_system: cmake

# Version index
versions:
  2.0.0:
    release_date: "2024-04-07"
    status: pending