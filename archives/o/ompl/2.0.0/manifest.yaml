software: ompl
name: ompl
version: 2.0.0
release_date: "2024-04-07"
status: built

# Build configuration
build_system: cmake
configure_options:
  - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DOMPL_BUILD_VAMP=OFF"
  - "-DOMPL_BUILD_PYTHON_BINDINGS=OFF"
  - "-DOMPL_BUILD_TESTS=OFF"
  - "-DOMPL_BUILD_DEMOS=OFF"

# Source information
source_url: https://github.com/ompl/ompl/archive/refs/tags/2.0.0.tar.gz
source_checksum: ""

# Dependencies
dependencies:
  required:
    - boost >= 1.68
    - cmake >= 3.12
    - eigen >= 3.3

# Build log
build_log: []

# Knowledge gained
knowledge_gained: []