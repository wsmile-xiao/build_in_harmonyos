software: osmcoastline
display: "OSMCoastline"
description: "从 OpenStreetMap 数据提取海岸线并转换为 GIS 格式的命令行工具"
category: data
homepage: "https://osmcode.org/osmcoastline/"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake + ohos.toolchain；package_type=application"
    - "libosmium 和 protozero 无 Conan 制品，构建时下载 header-only 源码注入"
    - "C++ 标准同步 profile cppstd=17（上游默认 14）"
    - "LZ4 支持开启（lz4/1.10.0 可用）"
  common_dependencies:
    - zlib
    - expat
    - bzip2
    - gdal
    - geos
    - lz4
    - libosmium (header-only, vendored)
    - protozero (header-only, vendored)

versions:
  "2.5.0":
    status: built
    build_date: "2026-08-15"
    conan_ref: "osmcoastline/2.5.0"
