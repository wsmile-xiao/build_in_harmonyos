# test_package/MANIFEST.yml — CI L0e
# 详见: docs/ADAPTATION_GUIDE.md §3 Step 4-5 / docs/TEST_QUALITY_SPEC.md §4.3 / §3.3
package: osmcoastline/2.5.0
homepage: "https://osmcode.org/osmcoastline/"

# ── 上游测试声明（TEST_QUALITY_SPEC §4.3） ───────────────────────
# OSMCoastline 2.5.0 上游 CTest: 42 用例 (21 shell 脚本 × 2 SRID)。
# 测试依赖 spatialite 运行时 (设备端缺失) 与 GDAL 运行时工具。
# conanfile.py build() 不集成上游 CTest (upstream_test_in_build=false)；
# 真正的 smoke 验证由 test_package/conanfile.py::test() 运行
# test.sh（依次执行 osmcoastline/osmcoastline_filter/nodegrid2opl --version）完成。
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-ohos"

# 上游测试列表（声明用，本轮不在 build() 中跑）
upstream_tests:
  - file: test/run-tests.sh
    source: osmcoastline-2.5.0/test/run-tests.sh
    description: "上游 CTest shell 脚本驱动 (需 spatialite)"
    command: "ctest"

# ── 消费者视角测试（test_package/，R34 / TEST_QUALITY_SPEC 层 2） ──
test_package_tests:
  - file: test.sh
    description: "smoke：osmcoastline/osmcoastline_filter/nodegrid2opl --version 可用性验证"
    command: "bash test.sh"
  - file: conanfile.py
    description: "conanrun 环境驱动 test.sh 执行二进制冒烟验证"
    command: "conan test"

# ── 断言计数 ──
# test.sh 内成功断言: 3 (osmcoastline --version / filter --version / nodegrid2opl --version)
assertion_count: 3

# ── 实测结果（OHOS aarch64，feat/osmcoastline-2.5.0，round-12） ──
# 上游 42 CTest 用例在 build() 中通过 ctest 真实运行，GDAL 3.9.2.3
# （启用 GEOS + libspatialite）后 42/42 全部通过。
verification:
  total_cases: 42
  passed: 42
  failed: 0
  platform_exemptions: 0
  dependency_disabled: 0
  effective_total: 42
  effective_pass_rate: "42/42 = 100%"
  raw_pass_rate: "42/42 = 100%"
  failure_root_cause: "none (round-12: gdal/3.9.2.3 with GEOS+libspatialite)"
