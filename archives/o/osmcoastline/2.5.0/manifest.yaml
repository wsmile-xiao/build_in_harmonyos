version: "2.5.0"
status: built
build_date: "2026-08-15"
conan_ref: "osmcoastline/2.5.0"

source:
  url: "https://github.com/osmcode/osmcoastline/archive/refs/tags/v2.5.0.tar.gz"
  sha256: "7980c77acbbf460d6de7df1d30b2f2d9da550db1512d0e828623851c687b238a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_CXX_STANDARD=17"
    - "-DUSE_CPP_VERSION=17"
    - "-DWITH_LZ4=ON"
  dependencies:
    - zlib/1.3.1.1
    - expat/2.8.2.1
    - bzip2/1.0.8
    - gdal/3.9.2.3
    - libspatialite/5.1.0.2
    - sqlite3/3.49.1
    - geos/3.13.1
    - lz4/1.10.0
    - libosmium/2.20.0 (header-only, vendored at build time)
    - protozero/1.7.1 (header-only, vendored at build time)
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libosmium and protozero not available as Conan packages; vendored at build time"
  - "C++ standard synced to 17 (profile cppstd=17, upstream default 14)"
