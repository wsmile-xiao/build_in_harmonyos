# 软件级 manifest — omath（ARCHIVE-SPEC v3.0）

software: omath
display: "omath"
description: "General purpose C++ math library：向量/矩阵/四元数/三角函数、碰撞检测（GJK/EPA）、路径查找与游戏玩法数学"
category: library
homepage: "https://github.com/orange-cpp/omath"
license: Zlib

build_system: cmake

ohos_adaptation:
  key_points:
    - "上游核心模板 omath::Angle<Type,Min,Max,Flags> 用 C++20 浮点非类型模板参数，OHOS SDK clang 15.0.4 不支持 ⇒ 必须 tool_requires clang/22.1.8 作编译器（下游实例化该模板的消费者同理）"
    - "SDK libc++15 缺 <expected>/<print>/<source_location>/<memory_resource> ⇒ 以同名兼容头随包交付在 files/compat（构建期 -isystem，安装期进 include/）"
    - "SDK libc++15 的 <format> 被 _LIBCPP_HAS_NO_INCOMPLETE_FORMAT 关闭 ⇒ -fexperimental-library + -lc++experimental（std::format_error 符号在 libc++experimental.a）"
    - "aarch64 上 check_cxx_compiler_flag(-mavx2) 仍返回真 ⇒ 必须显式 -DOMATH_USE_AVX2=OFF，否则上游给全部目标加 -mfma -mavx2 并无条件 include <immintrin.h>"
    - "上游单测由 tests/CMakeLists.txt 的 GLOB_RECURSE 注册（仅 general/ 与 engines/），lua/modules 两组按上游选项不参与构建；上游测试计数按 §3.5 候选数法取最大值：源码宏全 tests/ 清点 N=1413（general 855 + engines 309 + lua 248 + modules 1），框架注册 case 1168（全部 PASS），未编译 NOT_RUN 251（lua 248 + modules 1 + imgui 2，均上游默认 OFF）"
  common_dependencies: []

versions:
  "5.6.0":
    status: built
    build_date: "2026-09-26"
    conan_ref: "omath/5.6.0"
