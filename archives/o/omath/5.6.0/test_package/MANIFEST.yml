package: omath/5.6.0
homepage: "https://github.com/orange-cpp/omath"

# 上游单测在配方 build() 内以 ctest 全量执行（OMATH_BUILD_TESTS=ON，gtest_discover_tests 在
# build 期完成发现，--no-tests=error 保证「发现 0 条」判失败，避免空套件假绿）
upstream_check_command: "ctest --test-dir tests --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir tests --output-on-failure --no-tests=error"

upstream_tests:
  - name: "上游 GoogleTest 单测（tests/general + tests/engines，CMakeLists GLOB_RECURSE 注册）"
    command: "ctest --test-dir tests --output-on-failure --no-tests=error"
    expected: "全部发现用例 PASS；tests/lua（OMATH_ENABLE_LUA=OFF）248 条、tests/modules（OMATH_ENABLE_MODULES=OFF）1 条、imgui 集成 2 条按上游 CMakeLists/宏守卫不参与编译 → 计入上游分母的 NOT_RUN 251（逐项归因见 test_counting）"
  - name: "上游自检入口 pixi/run.unit.tests.cmake（cmake -P）"
    command: "ctest --test-dir tests --output-on-failure --no-tests=error"
    expected: "同一套用例；pixi 工作流在 OHOS 不可用，等价执行方式为配方内 ctest"

test_package_tests:
  - file: test_omath.cpp
    description: "打包的 libomath.a 与头文件被真实消费者链接并调用（Angle 浮点 NTTP / angle_between / base64 / std::format formatter）"
    command: "test_omath"
    expected: "exit code 0，打印 'omath consumer checks passed'"

# ── N 的取数口径（§3.5 / R51：候选数法取最大值 + 差额逐项归因；四种口径各自说明、不混用）──
# 返修记录（外部审查 191780157，2026-09-27 16:43，仅 rule4 FAIL）：
#   「少报: 上游实测 N=1413 > 声明 N=1168」——根因=原声明取了较小候选值（框架注册 1168），
#   未按候选数法取最大值（全 tests/ 树源码宏 1413）。审方口径同值反推：
#   grep -rhoE "(^|[^A-Za-z0-9_])(TEST|TEST_F|TEST_P)\(" <src>/tests | wc -l → 1413（逐字同值）。
test_counting:
  unit: "源码宏（TEST|TEST_F|TEST_P）＝N 的单位；框架注册 gtest case 并列记录，不与宏混算"
  upstream_total_N: 1413
  upstream_run_N_prime: 1162          # 源码宏口径实跑（PASS）＝ 1413 − 251 未编译宏
  upstream_registered_cases: 1168     # 框架注册 gtest case 实跑数（全部 PASS，与 N′ 差 +6 见 attribution）
  not_run: 251                        # = lua 248 + modules 1 + imgui 2
  commands:
    source_macro_count: 'grep -rhoE "(^|[^A-Za-z0-9_])(TEST|TEST_F|TEST_P)\(" tests | wc -l   # 1413（N＝候选数法最大值；分目录 general 855 + engines 309 + lua 248 + modules 1）'
    source_macro_general_engines: 'grep -rhoE "(^|[^A-Za-z0-9_])(TEST|TEST_F|TEST_P)\(" tests/general tests/engines | wc -l   # 1164（已构建面源码宏）'
    framework_registered_count: 'HOME=$TASK_DIR/test-home ctest --test-dir tests -N | tail -1   # Total Tests: 1168'
    gtest_list_count: 'unit_tests --gtest_list_tests | awk 逐行计   # 102 套件 + 1168 case = 1270 行'
    ctest_add_test_count: 'grep -c add_test <build>/Release/tests/unit_tests[1]_tests.cmake   # 1168'
    assertion_count: 'grep -rhoE "(^|[^A-Za-z0-9_])(EXPECT|ASSERT)_[A-Z_]+\(" tests/general tests/engines | wc -l   # 2645，不同口径，不作 N'
    consumer_assertion_count: 'test_package/test_omath.cpp 中 return fail(...) 检查点   # 6，不进上游分母'
  attribution:
    - "1413 源码宏 = tests/general 855 + tests/engines 309 + tests/lua 248 + tests/modules 1（TEST 995 + TEST_F 417 + TEST_P 1）"
    - "NOT_RUN 251 = tests/lua 248（上游 OMATH_ENABLE_LUA 默认 OFF，需 lua/sol2 依赖）+ tests/modules 1（OMATH_ENABLE_MODULES 默认 OFF）+ tests/general/unit_test_imgui_intergration.cpp 2（整文件 #ifdef OMATH_IMGUI_INTEGRATION，上游默认 OFF）"
    - "PASS 1162 = 1413 − 251（已构建面源码宏，即 general 855 − 2 imgui + engines 309）"
    - "TEST_P(CanTraceLineParam, VariousRays) 1 个宏展开为 7 个参数化实例（INSTANTIATE_TEST_SUITE_P 7 个 TraceCase）→ 框架注册 1162 + 6 = 1168"
    - "1164 − 1（TEST_P 模板本体不计 case） + 7（实例） − 2（imgui 未编译） = 1168，与 ctest -N / --gtest_list_tests / add_test 三处读数逐条吻合"
    - "1168 个注册 case 全部 PASS（采信轮日志原文 100% tests passed, 0 tests failed out of 1168）→ 框架注册面 1168/1168 = 100%"
    - "tests/lua 与 tests/modules 的 GLOB 需上游 OMATH_ENABLE_LUA/OMATH_ENABLE_MODULES=ON 及额外依赖，均上游默认 OFF → 属「上游默认未编译」，计入 NOT_RUN（既非 PASS 也非 SKIP），不删不改"

assertion_count: 6
