# conandata.yml — omath 5.6.0
# 上游官方源（GitHub tag archive，R39 / PF7）；sha256 与任务卡 CCI 读数逐字一致
sources:
  url: "https://github.com/orange-cpp/omath/archive/refs/tags/v5.6.0.tar.gz"
  sha256: "9ddd9ae712b0d2edd46bb161043825a850211a85dcc5a8c284718a6e02f59f66"

# 源码改动 2 处，均只动构建接线/测试夹具，不碰任何测试用例与算法逻辑：
#   0001 tests/CMakeLists.txt        —— Conan CMakeDeps 的 gtest 目标名与上游 vcpkg 假设不一致
#   0002 tests/general/mem_fd_helper.hpp —— OHOS 禁止经 /proc/self/fd 重开 memfd（EACCES），补运行期回退
# libc++15 缺失的 4 个标准头走 files/compat 同名兼容头（随包交付，不改源码），
# 其余构建选项差异全部由 conanfile.py 的 CMakeToolchain 变量表达。
patches:
  - patch_file: "patches/0001-tests-CMakeLists.txt.patch"
    patch_description: "portability: Conan CMakeDeps 导出的目标名是 gtest::gtest（该包无 components、不导出 gtest_main），补 GTest::gtest/GTest::gtest_main 包装目标以匹配上游 vcpkg 风格链接行；tests/main.cpp 自带 main，gtest_main 的 main 不会被拉入"
    patch_type: "portability"
  - patch_file: "patches/0002-tests-general-mem_fd_helper.hpp.patch"
    patch_description: "portability: OHOS 内核禁止 open(/proc/self/fd/<memfd>)（EACCES，raw open 探针实测），memfd 路径打开失败时回退到唯一命名临时文件；析构/移动同时清理两条路径，用例本身零改动"
    patch_type: "portability"
