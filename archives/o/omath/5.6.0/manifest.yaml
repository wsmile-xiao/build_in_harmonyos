knowledge_gained:
  - "OHOS SDK clang 15.0.4 不支持 C++20 浮点非类型模板参数（sorry, non-type template argument of type 'float'），而 omath::Angle 的 Min/Max 正是浮点 NTTP ⇒ 必须用 tool_requires clang/22.1.8 作编译器"
  - "libc++15 缺 <expected>/<print>/<source_location>/<memory_resource>，且 <format> 被 _LIBCPP_HAS_NO_INCOMPLETE_FORMAT 关闭：前四个用同名兼容头随包交付（files/compat），后者用 -fexperimental-library + -lc++experimental"
  - "aarch64 上 check_cxx_compiler_flag(-mavx2) 返回真（clang 只报 unused-argument 警告）⇒ 上游默认开 OMATH_USE_AVX2 并给全部目标加 -mfma -mavx2，必须显式 -DOMATH_USE_AVX2=OFF"
  - "libc++15 的 std::variant 析构不是 constexpr（std::optional 是）⇒ <expected> 兼容头用双 optional 存储，否则上游 static_assert(base64_decode(..).has_value()) 无法常量求值"
