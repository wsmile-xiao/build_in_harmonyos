# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kfourinline/26.04.0.

package: kfourinline/26.04.0
homepage: https://invent.kde.org/games/kfourinline

upstream_check_command: "grep -rn 'add_test\\|enable_testing\\|ecm_add_tests' --include='*.txt' --include='*.cmake' . | grep -v '^./po' || true"
upstream_test_in_build: false
upstream_test_command: "n/a - upstream registers no test suite (no tests/, autotests/ or add_test() in the 26.04.0 tarball)"

upstream_tests:
  - file: "(none)"
    source: kfourinline-v26.04.0.tar.gz
    description: "No upstream test suite: the tarball contains no tests/, autotests/ or test/ directory and no add_test()/enable_testing()/ecm_add_tests() call in any CMakeLists.txt (grep -rn over the extracted sources returns nothing outside po/). Upstream QA for this module happens via KDE CI source builds (.kde-ci.yml requires-passing-tests-on: Linux/FreeBSD/Windows)."
    command: "n/a"

test_package_tests:
  - file: test_package/test.sh
    description: "Runtime smoke of the shipped executables: (1) kfourinline --version prints the 26.04.0 version string and exits 0 (QCommandLineParser/KAboutData handle --version before GUI creation, QT_QPA_PLATFORM=offscreen keeps it headless-safe); (2) kfourinlineproc (computer-player AI engine process, no GUI) prints its 'AI process starts up' stderr banner and runs its stdin/stdout KGame IO event loop until stdin EOF, exiting with the upstream-designed code 1."
    command: "conan create (test_package runs test.sh against the installed bin/kfourinline and bin/kfourinlineproc)"

assertion_count: 4
