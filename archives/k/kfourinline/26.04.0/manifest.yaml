software: kfourinline
version: "26.04.0"
status: built
package_type: application
build_system: cmake
created_at: 2026-09-19
language: cpp
description: "KDE four-in-a-row game (KWin4) - kfourinline GUI application plus the kfourinlineproc computer-player AI engine process, built on KDEGames6/libkdegames"
homepage: https://invent.kde.org/games/kfourinline
upstream_source: https://invent.kde.org/games/kfourinline/-/archive/v26.04.0/kfourinline-v26.04.0.tar.gz
source_sha256: 425ac5e7fb35bcf1b1ec921448dae6b9e610a71ee0b1035dd8455c5ebbfe03aa
license: "GPL-2.0-or-later AND GFDL-1.2-only"

dependencies:
  required:
    - qtbase/6.11.1
    - qtsvg/6.11.1
    - kconfig/6.18.0
    - kconfigwidgets/6.18.0
    - kcoreaddons/6.18.0
    - kcrash/6.18.0
    - kdbusaddons/6.18.0
    - kdnssd/6.29.0
    - ki18n/6.18.0
    - kwidgetsaddons/6.18.0
    - kxmlgui/6.18.0
    - kiconthemes/6.18.0
    - libkdegames/26.04.0
  build:
    - ecm/6.26.0
  forced:
    - karchive/6.18.0 (override=True: libkdegames 26.04.0 graph precedent - the newest kiconthemes/6.18.0 recipe revision requires karchive/6.19.0 which conflicts with knewstuff/6.18.0 (karchive/6.18.0))

patches_applied:
  - patches/0001-ohos-skip-kdoctools.patch

test_results:
  type: no_upstream_tests_consumer_verified
  upstream: "No upstream test suite: the 26.04.0 tarball contains no tests/, autotests/ or test/ directory and no add_test()/enable_testing()/ecm_add_tests() call in any CMakeLists.txt (grep -rn over the extracted sources returns nothing outside po/). Upstream QA for this module happens via KDE CI source builds (.kde-ci.yml requires-passing-tests-on: Linux/FreeBSD/Windows)."
  test_package: "passed: 2/2 runtime smoke assertions - (1) kfourinline --version prints 'kfourinline 26.04.0' and exits 0 (QCommandLineParser/KAboutData handle --version before GUI creation, QT_QPA_PLATFORM=offscreen headless-safe); (2) kfourinlineproc (computer-player AI engine process, no GUI) prints its 'AI process starts up' stderr banner proving ELF load + Qt runtime init + KGame process construction, then terminates cleanly on SIGTERM (rc=143; the upstream process has no stdin-EOF exit path by design - EOF floods the KMessageFilePipe cookie parser and the process is normally spawned/closed by the game via the KGame message protocol)."
  package_id: "40c9b7ce2f8cf4da4573c8a93f7833b6195a9d53"

platform_adaptations:
  - "KF6 DocTools removed from the REQUIRED component list and doc/ handbook + kdoctools_install(po) dropped (patch 0001): kdoctools is not part of the published KF6 6.18/6.26 closure and the DocBook handbook is not a runtime requirement for the game (audiocd 26.04.3 / libkcddb 26.04.3 precedent)"
  - "KF_IGNORE_PLATFORM_CHECK=TRUE (KDE platform detection does not know OHOS)"
  - "KF_SKIP_PO_PROCESSING=ON (translation catalogs skipped; gettext msgfmt toolchain not needed for the smoke-verified deliverable)"
  - "karchive/6.18.0 override=True pin (libkdegames 26.04.0 graph precedent)"
  - "Linker flags -Wl,-z,max-page-size=0x1000: default lld 0x10000 page size can place .dynsym/.dynstr into separate high-address RW LOAD segments which the OHOS musl loader refuses to mmap (audiocd 26.04.3 precedent)"
  - "ECM_MODULE_PATH + conan_cmakedeps_paths.cmake written manually (qtbase/KF6 packages use cmake_find_mode=none)"
  - "7Zip stays optional and absent (libkdegames 26.04.0 precedent): theme SVGZ generation uses the gzip -9 -n -c fallback"

known_issues:
  - "kfourinline is a GUI game: on a headless machine it needs QT_QPA_PLATFORM=offscreen for the --version smoke; full gameplay requires a display/launcher environment"
  - "Network games (KDNSSD LAN invitation) depend on mDNS infrastructure on the target platform"
