# 版本级 manifest — kjumpingcube 26.04.0
# 遵循 ARCHIVE-SPEC v2.0

version: "26.04.0"
software: "kjumpingcube"

# 编译状态: pending（候选提交后运行权威 CI；结果回填 progress.json，
# PASS 后由 Coordinator/交付流程翻转为 built）
status: pending
build_system: cmake
created_at: 2026-09-25

source:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/kjumpingcube-26.04.0.tar.xz"
  sha256: "834e1245d84b40608d06d80c34c10eeaf7fdf26d068b56335b04aa19c60ba447"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=OFF (上游无测试套件, NO_UPSTREAM_TESTS 路线)"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKF_SKIP_PO_PROCESSING=ON"
  dependencies:
    required:
      - qtbase-sql-dbus/6.11.1 (Qt6::DBus 供给变体, 知识 E323/E441)
      - qtsvg/6.11.1
      - kio/6.14.0 (ohpcd 无 6.18.0; 其 KF6 6.14 依赖族经 override 钉到 6.18.0, 见 conanfile)
      - karchive/6.18.0 (override)
      - kauth/6.18.0 (override)
      - kbookmarks/6.18.0 (override)
      - kcolorscheme/6.18.0 (override)
      - kcompletion/6.18.0 (override)
      - kconfig/6.18.0 (override)
      - kconfigwidgets/6.18.0 (override)
      - kcoreaddons/6.18.0 (override)
      - kcrash/6.18.0 (override)
      - kguiaddons/6.18.0 (override)
      - ki18n/6.18.0 (override)
      - kiconthemes/6.18.0 (override)
      - kjobwidgets/6.18.0 (override)
      - kservice/6.18.0 (override)
      - kwidgetsaddons/6.18.0 (override)
      - kwindowsystem/6.18.0 (override)
      - solid/6.18.0 (override)
      - kdbusaddons/6.18.0
      - kxmlgui/6.18.0
      - openal-soft/1.25.2 (KDEGames 音频后端运行时闭包, conan skip-binaries 规避)
      - libsndfile/1.2.2 (同上)
      - libkdegames/26.04.0.1 (SONAME 修复版; 官方 26.04.0 为缺陷版禁止消费)
    build:
      - ecm/6.26.0
    tools:
      - llvm-readelf (DT_NEEDED 读取, 仅构建期清洗校验)
      - in-place .dynstr patch + llvm-objcopy --remove-section .codesign + binary-sign-tool -selfSign 1 (conanfile 自带实现, bin/lib 产物 DT_NEEDED 路径形态清洗并重签名; 禁用 patchelf — 知识 E537)
  cc: clang
  cxx: clang++

license: "GPL-2.0-or-later (代码) / GFDL-1.2-or-later (文档) / BSD-3-Clause / CC0-1.0 (杂项)"

patches_applied:
  - patches/0001-CMakeLists.txt.patch

test_results:
  type: pending
  upstream: "NO_UPSTREAM_TESTS: 上游无测试套件（无 autotests/、无 tests/ 目录，全树无 add_test/enable_testing/ECMAddTests；证据见 test_package/MANIFEST.yml 与 notes.md）"
  test_package: "pending（权威 CI 首跑回填）"
