# MANIFEST.yml - test_package for kjumpingcube 26.04.0
name: kjumpingcube
version: "26.04.0"
test_type: consumer
description: >
  Consumer test for the kjumpingcube 26.04.0 conan package on HarmonyOS PC
  (aarch64). kjumpingcube is a KXmlGui GUI application (bin/kjumpingcube,
  no shipped libraries), so the test executes the packaged binary headless
  under the offscreen Qt platform with a sandboxed HOME/XDG tree, plus OHOS
  portability assertions on the installed artifact's DT_NEEDED entries.
build_system: none
language: shell
runner: direct

# ---------------------------------------------------------------------------
# NO_UPSTREAM_TESTS route (discovery_status: EVIDENCE_COMPLETE)
# ---------------------------------------------------------------------------
# Upstream 26.04.0 ships no test suite. Verified against the official
# release archive
# (https://download.kde.org/stable/release-service/26.04.0/src/kjumpingcube-26.04.0.tar.xz,
#  sha256 834e1245d84b40608d06d80c34c10eeaf7fdf26d068b56335b04aa19c60ba447):
#   - no autotests/ directory, no tests/ directory
#   - no add_test()/enable_testing()/include(ECMAddTests)/ecm_add_test
#     anywhere in the source tree (grep over all CMakeLists.txt, po/ excluded)
#   - src/CMakeLists.txt only registers add_executable(kjumpingcube)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
discovery_status: EVIDENCE_COMPLETE

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质消费被测包的产物 (执行 bin/kjumpingcube)
test_package_tests:
  - file: test_kjumpingcube.sh
    description: >
      Headless consumer smoke: `kjumpingcube --version` under
      QT_QPA_PLATFORM=offscreen with sandboxed HOME/XDG (exit 0 + version
      output asserted), plus OHOS assertions: no path-form DT_NEEDED entries
      in the installed binary (E537 SONAME/NEEDED repair parity) and
      libKDEGames6 present in DT_NEEDED (real consumption of the
      libkdegames/26.04.0.1 dependency closure).
    command: "sh test_kjumpingcube.sh <pkg>/bin/kjumpingcube"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
