software: kjumpingcube
display: "KJumpingCube"
description: "KDE 回合制策略棋类游戏 KJumpingCube（KXmlGui GUI 应用，KDE release-service 26.04.0）"
category: game
homepage: "https://apps.kde.org/kjumpingcube"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "KF_SKIP_PO_PROCESSING=ON skips the ki18n_install(po) catalog step (gettext toolchain not needed)"
    - "KF6DocTools patched out: no kdoctools/6.18.0 on ohpcd (doc handbook not built)"
    - "KIO genuinely consumed via kio/6.14.0 (src/game.cpp uses KIO::stat/KIO::file_copy for game-state save/load through URLs); ohpcd has no kio/6.18.0 and 6.26.0 would demand a nonexistent 6.26 KF family, so kio's 6.14 requirement pins are overridden up to the uniform 6.18.0 family (KF6 ABI stable within the major version)"
    - "Qt6::DBus via the qtbase-sql-dbus/6.11.1 variant (E323/E441), deterministically first on the CMake prefix path so the plain qtbase variant dragged in transitively cannot shadow it"
    - "consumes libkdegames/26.04.0.1 (SONAME-fixed re-release); the official libkdegames 26.04.0 is the defective SONAME-less release"
    - "karchive pinned to 6.18.0 with override=True (kiconthemes/6.18.0 requires karchive/6.19.0 vs knewstuff/6.18.0 karchive/6.18.0)"
    - "package() sanitizes path-form DT_NEEDED entries to basenames (in-place .dynstr patch) and re-signs the ELF (llvm-objcopy + binary-sign-tool); patchelf forbidden (E537)"
    - "NO_UPSTREAM_TESTS: upstream ships no test suite (no autotests//tests dirs, no add_test); test_package runs bin/kjumpingcube --version headless plus OHOS DT_NEEDED assertions"
  common_dependencies:
    - qtbase-sql-dbus
    - qtsvg
    - kconfig
    - kio
    - kxmlgui
    - kdbusaddons
    - kcrash
    - kiconthemes
    - libkdegames
    - ecm

versions:
  "26.04.0":
    status: pending
    build_date: "2026-09-25"
    conan_ref: "kjumpingcube/26.04.0"
