# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）

package: komihash/5.34
homepage: https://github.com/avaneev/komihash

# 上游无构建系统（无 Makefile/CMake/CTest），无测试注册层；
# 唯一测试程序 testvec.c 由配方 build() 直接编译并运行。
upstream_check_command: "上游无构建系统与测试注册入口；静态清点唯一测试程序 testvec.c"
upstream_test_in_build: true
upstream_test_command: "clang -O2 -std=c99 -I. testvec.c -o testvec && ./testvec"

upstream_tests:
  - file: testvec.c
    source: testvec.c
    description: "上游唯一测试程序（打印型向量程序，无内置断言）：打印 3 组种子 x (5 字符串 + 17 块长度) 的 komihash 向量与 3 组 x 12 komirand 输出；通过判据为编译成功、退出码 0、输出结构完整（3 个 UseSeed 段、15 个字符串向量、51 个 bulk 向量、3 个 komirand 段）；真实值断言由消费者测试以 README 官方参考向量补齐"
    command: "conan create 内由 OHOS profile 编译器（tools.build:compiler_executables）编译并运行"

test_package_tests:
  - file: test_package/test_komihash.c
    description: "消费者测试：以库使用者身份编译链接已安装包，共 6 项断言（README 参考向量、KOMIHASH_VER_STR、流式==单发、komirand 连续输出不同、komirand 种子状态更新、komihash_seedless==komihash(seed=0)）"
    command: "conan create（编译并运行 test_komihash）"

assertion_count: 6
upstream_discovered: 1
upstream_compiled: 1
upstream_executed: 1
upstream_passed: 1
upstream_skipped: 0
