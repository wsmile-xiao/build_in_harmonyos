source_sha256: e6b6562114c2cb71db6ca48fdf0ebed2df70e164c48295b35433a80b03385847
knowledge_gained:
  - "kauth 6.26.0 does NOT need a source patch on OHOS: all three upstream autotest targets compile and KAuthSetupActionTest passes unpatched. The previously recorded 'qdbusxml2cpp DBus adaptor moc incompatibility on OHOS' was never actually verified (the patch was an orphan: conandata.yml had no patches: section and build() never called apply_conandata_patches), and the real build failure had a different root cause (see below). KAuthHelperTest/KAuthFdTest are not blocked by the toolchain either - they only need a D-Bus session bus."
  - "CRITICAL dependency pitfall (KeyError 'OHOS'): expat/2.8.2 on ohpcd declares tool_requires(\"cmake/[>=3.17]\") (guarded by Version(self.version) >= \"2.7.4\"). The CCI cmake recipe resolves a prebuilt binary by OS key (conandata sources only has Linux/Macos/Windows), so an OHOS build aborts in cmake's build() with `KeyError: 'OHOS'`; with conancenter disabled it aborts earlier with `cmake/[>=3.17] not resolved`. Fix: self.requires(\"expat/2.8.2.1\", override=True) - the ohpcd-adapted expat has no conan-side cmake tool_require (same as avahi-tools / avahi-compat-libdns_sd / awf-gtk)."
  - "CRITICAL header-mixing pitfall: kcoreaddons/6.26.0 references the plain qtbase/6.11.1, whose qconfig.h defines QT_NO_DBUS (QT_FEATURE_dbus -1 / FEATURE_dbus=OFF), while qtbase-sql-dbus/6.11.1 provides the QtDBus headers. CMake then compiles qdbuserror.h with QT_NO_DBUS defined, so its `#else` dummy branch `class Q_DBUS_EXPORT QDBusError {};` is selected while Q_DBUS_EXPORT was never defined, failing with `variable has incomplete type 'class Q_DBUS_EXPORT'` plus `unknown type name 'QDBusConnection'` in DBusHelperProxy.h. Fix: self.requires(\"qtbase/6.11.1.1\", override=True) to unify the graph on the FEATURE_dbus=ON variant (same as baloo/6.28.0 and statusnotifieritem/6.26.0)."
  - "Upstream kauth autotests are Qt GUI tests: QtTest links Qt6::Gui, so the test binaries abort with `Could not find the Qt platform plugin \"xcb\"` unless QT_QPA_PLATFORM=offscreen (plus LD_LIBRARY_PATH / QT_PLUGIN_PATH / QT_QPA_PLATFORM_PLUGIN_PATH pointing at the dependency packages) is exported for the ctest run."
  - "dbus/1.14.10 on ohpcd ships libdbus-1 only (no dbus-daemon; the daemon fails to link against expat in the OHOS cross build). Any upstream test that needs a session bus must therefore be excluded and reported as excluded, following the akonadi/25.12.3 precedent, and never counted as passing."
  - "The rule12 HarmonyOS-specific test revealed that kauth does not ship backend/helper plugins on OHOS, so BackendsManager::init() falls back to FakeBackend at runtime; the packaged libKF6AuthCore.a still embeds the compile-time KAUTH_BACKEND_PLUGIN_DIR absolute path. The artifact check asserts the plugin directory is absent (the fallback precondition) rather than asserting the absence of host paths, since the baked path is upstream behavior, not a packaging leak."
  - "test_package/conanfile.py carried a stale `LD_PRELOAD=.../lib/libKF6AuthCore.so.6` copied from the 6.18.0 recipe even though 6.26.0 is packaged shared=False (static .a only); the loader silently ignored the missing target, so the old test passed by accident. Replaced with a plain LD_LIBRARY_PATH prefix."
