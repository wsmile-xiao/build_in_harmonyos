# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kauth/6.26.0
homepage: "https://invent.kde.org/frameworks/kauth"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -j1"
# 说明: OHOS 上以 QT_QPA_PLATFORM=offscreen 运行；当环境中不存在 dbus-daemon 时，
# 依赖 D-Bus session bus 的测试以 -E 排除，并以 excluded 记录（不计入通过）。

# 上游 test/autotests/ 声明 5 项 CTest，实际注册取决于构建配置：
#   - KAuthSetupActionTest / KAuthHelperTest / KAuthFdTest 由 ecm_add_test 注册，
#     需要 Qt6::Test 与 Qt6::DBus（本配方经 qtbase-sql-dbus 提供）。
#   - KAuthPolicyGenTest / KAuthPolicyGenTestCompare 仅在 KAUTH_BACKEND_NAME != FAKE
#     时注册；OHOS 基线使用 FAKE 后端，故这 2 项不注册。
upstream_tests:
  - file: autotests/SetupActionTest.cpp
    source: kauth-6.26.0/autotests/
    description: "KAuthSetupActionTest — KAuth::Action property/authorization unit tests (5 test functions). Runs without a D-Bus session bus."
    command: "ctest --output-on-failure -R KAuthSetupActionTest"
  - file: autotests/HelperTest.cpp
    source: kauth-6.26.0/autotests/
    description: "KAuthHelperTest — DBusHelperProxy helper round-trip. Requires a D-Bus session bus; excluded when dbus-daemon is unavailable (dbus/1.14.10 ships the client library only)."
    command: "ctest --output-on-failure -R KAuthHelperTest"
  - file: autotests/FdTester.cpp
    source: kauth-6.26.0/autotests/
    description: "KAuthFdTest — file-descriptor passing through the helper. Requires a D-Bus session bus; excluded when dbus-daemon is unavailable."
    command: "ctest --output-on-failure -R KAuthFdTest"
  - file: autotests/foo_actions.actions
    source: kauth-6.26.0/autotests/
    description: "KAuthPolicyGenTest / KAuthPolicyGenTestCompare — policy generator output comparison. Not registered on OHOS because KAUTH_BACKEND_NAME=FAKE."
    command: "(not registered: KAUTH_BACKEND_NAME=FAKE)"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke constructs KAuth::Action through KF6::AuthCore and checks name()."
    command: "conan create"

# ── 鸿蒙特有测试 (rule12) ──────────────────────────────────────────────
# OHOS 无 Polkit、无 D-Bus session bus，配方以 KAUTH_BACKEND_NAME=FAKE 构建。
# 无后端插件时 BackendsManager::init() 回落 FakeBackend（NoCapability），
# 这是一条鸿蒙平台特有的适配路径，下面两项测试即断言该路径的可观测事实。
harmonyos_specific_tests:
  - file: test_package/test_kauth_ohos.cpp
    description: >-
      鸿蒙特有测试（运行期）：断言 OHOS FAKE 后端适配路径的可观测行为 ——
      具名 Action 的 isValid()==true 且 name() 往返一致、无 name 的 Action
      status()==InvalidStatus、具名 Action status()==DeniedStatus、
      execute() 返回的 ExecuteJob 以 ActionReply::BackendError 失败且
      errorString() 为 "The backend does not specify how to authorize"、
      无 helper 绑定（helperId() 空、hasHelper()==false）、
      setDetailsV2()/detailsV2() 往返一致。仅需 QCoreApplication，
      无需 session bus / Polkit / Qt 平台插件。
    command: "./test_kauth_ohos"
    assertion_count: 13
  - file: test_package/fixtures/ohos_artifact_check.py
    description: >-
      鸿蒙特有测试（产物层）：对最终 Conan 包产物 libKF6AuthCore.a 做平台校验 ——
      ar 归档 magic、成员非空、成员为 ELF64/little-endian/EM_AARCH64/ET_REL，
      且包内不含 lib/plugins/kf6/kauth 后端插件（FakeBackend 回落的前提）。
      纯标准库解析，不依赖 readelf/llvm-ar。
    command: "python3 fixtures/ohos_artifact_check.py <kauth package_folder>"
    assertion_count: 6

# 鸿蒙特有测试数（规则 12 口径：PC 平台特有 / 鸿蒙适配特有）
harmony_specific_test_count: 1

assertion_count: 25
