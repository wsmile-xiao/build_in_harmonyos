tests:
  upstream_suite: "kea-hooks-tests"
  upstream_test_command: "meson test -v --no-rebuild -C <builddir> kea-hooks-tests"
  upstream_test_macros: 122          # 源码 TEST/TEST_F 宏总数
  upstream_tests_executed: 121       # gtest 实际注册并执行
  upstream_tests_passed: 121
  upstream_tests_failed: 0
  upstream_tests_skipped: 0
  upstream_tests_disabled: 1         # ServerHooksTest.DISABLED_OldDuplicateHooks
  upstream_test_suites: 11
  upstream_test_exit_code: 0
  ohos_specific_tests: 1             # test_package: test_ohos_platform
  ohos_test_command: "./test_ohos_platform <package>/lib/libkea-hooks.so"
  local_ci: "W3: JC/L0/L1/L4/L5 pass, Pass rate 100% (1/1)"

knowledge_gained:
  - "Meson 在 OHOS 报 system=harmonyos，Kea 平台白名单不含 → 顶层归一化为 linux（命中 E090）"
  - "musl pthread.h 无 pthread_setcancelstate → boost BOOST_SP_NO_PTHREAD_SETCANCELSTATE（命中 E085/E127/E507）"
  - "meson clang 默认归档器裸名 llvm-ar 探测失败 → MesonToolchain tc.binaries 注入绝对路径（命中 E481）"
  - "meson 配置期 cpp.run() 运行探针（log4cplus）需 LD_LIBRARY_PATH 含 host 共享依赖 libdirs（未命中，新增草稿 E2179-draft-C112）"
  - "libkea-hooks.so 直接 DT_NEEDED 只有 4 个 kea 库（cc/log/util/exceptions）——lld 的 --as-needed 会丢弃 link_with 中未被真正引用的库；包内 7 个 kea 库合起来构成完整加载闭包（另含 asiolink/cryptolink/log-interprocess），打包按 readelf 实测闭包而非 meson link_with 列表"
  - "本包不编译 src/lib/dhcp（不在 libkea-hooks 的依赖闭包内），故不涉及 OHOS linux/socket.h 与 musl sys/socket.h 的 sockaddr_storage 冲突（E091/E119），补丁集因此只需 1 个"
  - "meson test 默认会先重建整个工程（等价 ninja 全目标）；只构建本包目标时必须用 meson test --no-rebuild"
  - "产物 ABI 特征（鸿蒙特有）：ELFCLASS64 + EM_AARCH64，DT_NEEDED 为 libc.so / libc++_shared.so（OHOS musl + libc++），非 glibc libc.so.6 —— 由 test_package/test_ohos_platform.cpp 实测断言"
  - "OHOS 专用消费者宏随 package_info 传播：cpp_info.defines 在 os=OHOS 时导出 BOOST_SP_NO_PTHREAD_SETCANCELSTATE，否则消费方包含 kea/hooks/*.h（头链经 boost sp_thread_sleep.hpp）直接编译失败（未命中，新增草稿 E543-draft-58D4）"

