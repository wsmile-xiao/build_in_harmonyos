  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1   # test_requires
    - meson/1.11.0     # tool_requires
  cc: clang
  cxx: clang++

patches_applied:
