# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hooks/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> kea-hooks-tests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> kea-hooks-tests"

# 上游实际运行的测试程序
upstream_tests:
  - file: kea-hooks-tests
    source: src/lib/hooks/tests/
    description: >-
      gtest 单元套件覆盖 hook 框架（callout handle / callout handle associate /
      callout manager / handles / hooks manager / library manager /
      library manager collection / parking lots / server hooks）；源码 TEST 宏
      122 个，其中 1 个为 DISABLED_（gtest 不注册），本次实测执行 121 个用例
      全部通过、0 失败、0 跳过
    command: "./kea-hooks-tests"

# test_package 中自带的消费者视角测试
test_package_tests:
  - file: test_kea_hooks.cpp
    description: >-
      链接 libkea-hooks 并调用公共 API：ServerHooks 注册/查询、命令名与 hook 名
      互转、HookLibInfo/extractNames。本次实测 9 条断言全部通过
    command: "./test_kea_hooks"
    assertion_count: 9
  - file: test_ohos_platform.cpp
    description: >-
      鸿蒙特有测试用例：__OHOS__ 编译期守卫；package_info 导出的 OHOS 专用宏
      BOOST_SP_NO_PTHREAD_SETCANCELSTATE 是否进入消费者编译行（该 TU 内包含
      依赖此宏才可编译的 boost/core/detail/sp_thread_sleep.hpp）；产物为
      ELFCLASS64 + EM_AARCH64；DT_NEEDED 为 OHOS musl 命名 libc.so /
      libc++_shared.so（非 glibc libc.so.6）；OHOS loader dlopen(RTLD_NOW)
      可解析 libkea-hooks.so 及其 kea 运行库闭包。本次实测 12 条断言全部通过
    command: "./test_ohos_platform <package>/lib/libkea-hooks.so"
    assertion_count: 12

# 鸿蒙特有测试用例数量（要求 >= 1）
ohos_specific_tests: 1

# 测试用例总数（本次实测执行的上游用例数）
assertion_count: 121
