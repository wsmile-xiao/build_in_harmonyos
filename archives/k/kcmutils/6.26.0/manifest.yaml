test_results:
  type: see notes
  upstream: "upstream CTest autotest targets registered after the QML plugin cut: kcmultidialogtest, module_data_test (kcmloadtest requires the QML plugin and is registered only when KCMUTILS_BUILD_QML_PLUGIN is set); see notes.md for the local OHOS run evidence"
  test_package: "consumer smoke: KCModuleData constructed through KF6::KCMUtilsCore (real API, R34)"
source_url: https://download.kde.org/stable/frameworks/6.26/kcmutils-6.26.0.tar.xz
source_sha256: 6d0810649b71528124cdf9dbdeb8b3c6c6d31d787325ca3e4a20c536ecbdf2d9
knowledge_gained:
  - "kcmutils 6.26.0 src/qml (kcmutilsqmlplugin) links KF6::KIOGui; ohpcd kio/6.26.0 is a KIOCORE_ONLY baseline without KIOGui, so the QML plugin is cut behind KCMUTILS_BUILD_QML_PLUGIN while KCMUtilsCore/KCMUtilsQuick/KCMUtils remain fully functional."
  - "kconfigwidgets is only published at 6.18.0 on ohpcd; the find_package/find_dependency floor is lowered via patch and the conan graph uses override=True on the transitive KF6 deps (same approach as kxmlgui 6.26.0)."
  - "kinfocenter (task #12847) consumes the widget path (KPageDialog/KCMultiDialog via KF6::KCMUtils), which does not require the declarative QML plugin."
