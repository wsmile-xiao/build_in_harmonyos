patches:
  "6.26.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "0001 lower the KF6ConfigWidgets dependency floor to the published 6.18.0 cap (project CMakeLists.txt + exported KF6KCMUtilsConfig.cmake.in); guard the declarative kcmutilsqmlplugin and its QML KCM test fixture behind KCMUTILS_BUILD_QML_PLUGIN (KF6::KIOGui is not published; kio 6.26.0 is KIOCORE_ONLY); drop the kirigami qmldir build-time check that only serves the QML plugin build (kirigami 6.26 not on ohpcd yet)"
      patch_type: "portability"
