- patch_string: "diff --git a/common/k3conf.c b/common/k3conf.c\n--- a/common/k3conf.c\n\
    +++ b/common/k3conf.c\n@@ -129,0 +130,5 @@\n+\tif (!strcmp(argv[0], \"--version\"\
    )) {\n+\t\tk3conf_print_version(stdout);\n+\t\tgoto main_exit;\n+\t}\n+\ndiff\
    \ --git a/common/mmio.c b/common/mmio.c\n--- a/common/mmio.c\n+++ b/common/mmio.c\n\
    @@ -43 +42,0 @@\n-#include <error.h>\ndiff --git a/common/sec_proxy.c b/common/sec_proxy.c\n\
    --- a/common/sec_proxy.c\n+++ b/common/sec_proxy.c\n@@ -40 +39,0 @@\n-#include\
    \ <error.h>\ndiff --git a/common/cmd_dump.c b/common/cmd_dump.c\n--- a/common/cmd_dump.c\n\
    +++ b/common/cmd_dump.c\n@@ -345,2 +345,2 @@\n-static int dump_rm_resource(u_int32_t\
    \ type, u_int32_t subtype,\n-\t\t\tu_int32_t host_id, char *value)\n+static int\
    \ dump_rm_resource(uint32_t type, uint32_t subtype,\n+\t\t\tuint32_t host_id,\
    \ char *value)\n"
