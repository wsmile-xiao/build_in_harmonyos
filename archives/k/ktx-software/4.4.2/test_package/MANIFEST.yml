# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ktx-software/4.4.2
homepage: "https://github.com/KhronosGroup/KTX-Software"

# 上游测试命令 (KTX 使用 ctest)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (KTX_FEATURE_TESTS 控制是否编译测试)
# 由于我们在配方中禁用了 KTX_FEATURE_TESTS (减小体积)，上游测试不参与
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 ktxTexture_CreateFromMemory API 验证 libktx 可链接和调用"
    command: "./test_ktx"

# 测试断言总数
assertion_count: 2
