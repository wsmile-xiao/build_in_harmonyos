# 版本级 manifest — ktx-software 4.4.2
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "4.4.2"
software: "ktx-software"
status: built
build_date: "2026-09-01"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/KhronosGroup/KTX-Software/archive/refs/tags/v4.4.2.tar.gz"
  sha256: "9412cb45045a503005acd47d98f9e8b47154634a50b4df21e17a1dfa8971d323"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DKTX_FEATURE_TESTS=OFF"
    - "-DKTX_FEATURE_TOOLS=ON"
    - "-DKTX_FEATURE_GL_UPLOAD=OFF"
    - "-DKTX_FEATURE_VK_UPLOAD=OFF"
    - "-DKTX_GIT_VERSION_FULL=v4.4.2"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS clang 定义 __linux__ 和 __aarch64__，ktx-software Linux 代码路径自动生效"
  - "ASTC 编码器 NEON 后端在 arm64 上自动启用"
  - "所有依赖内置（basisu/astc-encoder/zstd/miniz），无需外部依赖"
  - "从 tarball 构建需设置 KTX_GIT_VERSION_FULL 避免依赖 git"
  - "package_info 需声明 system_libs=[c++, dl, pthread, m] 以链接 C++ 标准库"
  - "KTX_FEATURE_GL_UPLOAD/VK_UPLOAD 使用 dlopen 动态加载，可按需开关"
