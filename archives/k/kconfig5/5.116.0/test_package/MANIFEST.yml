# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kconfig5/5.116.0
homepage: "https://invent.kde.org/frameworks/kconfig"

# 上游测试命令 (cmake + ctest 构建配置)
upstream_check_command: "ctest --test-dir build"
upstream_test_in_build: true
upstream_test_command: "cmake configure -DBUILD_TESTING=ON && make && ctest"

# 上游实际运行的测试程序 (autotests/, 部分按 OHOS 差异排除)
upstream_tests:
  - file: autotests/kconfigtest.cpp
    source: kconfig-5.116.0/autotests/kconfigtest.cpp
    description: "KConfig core API 单元测试 (readEntry/writeEntry/group round-trip)"
    command: "./kconfigtest"
  - file: autotests/kconfigguitest.cpp
    source: kconfig-5.116.0/autotests/kconfigguitest.cpp
    description: "KConfig GUI (KConfigSkeleton) 测试"
    command: "./kconfigguitest"
  - file: autotests/kconfigloadertest.cpp
    source: kconfig-5.116.0/autotests/kconfigloadertest.cpp
    description: "KConfigLoader 测试"
    command: "./kconfigloadertest"
  - file: autotests/kdesktopfiletest.cpp
    source: kconfig-5.116.0/autotests/kdesktopfiletest.cpp
    description: "KDesktopFile 解析测试"
    command: "./kdesktopfiletest"
  - file: autotests/kconfigskeletontest.cpp
    source: kconfig-5.116.0/autotests/kconfigskeletontest.cpp
    description: "KConfigSkeleton 测试"
    command: "./kconfigskeletontest"

# test_package 中自带的测试 (消费者视角验证, R34 实质 API 调用)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: KConfig/KConfigGroup 读写 round-trip"
    command: "./test_kconfig5"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 330
