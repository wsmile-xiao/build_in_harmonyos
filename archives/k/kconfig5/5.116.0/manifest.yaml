knowledge_gained:
  - "KConfig KF5 5.116.0 hard-depends on Qt5Xml (find_package(Qt5 Xml) in src/gui and src/kconfig_compiler); use qt5-qtbase/5.15.2.2 which ships Qt5Xml (5.15.2 plain does not)."
  - "KF5 uses KCONFIG_USE_DBUS/KCONFIG_USE_QML option names (KF6 renamed to USE_DBUS/USE_QML); both OFF drops the unavailable Qt5DBus/Qt5Qml deps."
  - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses KDE platform detection for OHOS; KCMakeSettings sets QT_MAJOR_VERSION=5 via Qt5 when ECM finds Qt5."
  - "The OHOS CMake platform module does NOT define CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG, so KF5 .so ship without a DT_SONAME and consumers record path-form DT_NEEDED like 'bin/libKF5ConfigCore.so' that the loader cannot resolve (E537). Fix: set CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG=-Wl,-soname, so lld emits a real soname."
  - "ECM_MODULE_PATH must be fed manually from ecm.package_folder (CMakeDeps-generated ECMConfig.cmake does not propagate it); qtbase's bin/moc etc. are arm64 musl and run natively on OHOS host, no separate host tools needed."
  - "ecm_install_po_files_as_qm(poqm) requires Qt5LinguistTools which is absent from qt5-qtbase, so the recipe patches it out (same as KF6 kconfig 6.26.0)."
  - "CMakeDeps with qtbase cmake_find_mode=none requires a hand-written conan_cmakedeps_paths.cmake that prepends qtbase lib/cmake + ECM modules to CMAKE_PREFIX_PATH/CMAKE_MODULE_PATH."

