# 软件级 manifest — kwstyle
# 遵循 ARCHIVE-SPEC v3.0

software: kwstyle
display: "KWStyle (Kitware Style Checker)"
description: "Kitware 官方源码风格检查器，在多人协作流程中强制统一 C++ 代码风格（缩进/头注释/行长/命名/空行等）"
category: utility
homepage: "https://github.com/Kitware/KWStyle"
# 上游根目录无 LICENSE，唯一许可证文件 Copyright.txt 为 Kitware BSD 式许可
# （产品源码根目录 38 个文件写 "See Copyright.txt"）；metaCommand.cxx/h 带
# Apache-2.0 头（Copyright NumFOCUS）且被编入 bin/KWStyle，随包安装的
# share/KWStyle/headers/ITKHeader.h 亦为 Apache-2.0；vendored boost 为 BSL-1.0。
# 故声明复合 SPDX，而非单一 Apache-2.0（详见 1.1.0-.../notes.md §9）。
license: "BSD-3-Clause AND Apache-2.0 AND BSL-1.0"

build_system: cmake

ohos_adaptation:
  key_points:
    - "零外部依赖：上游 CMakeLists.txt 全文无 find_package/find_library/find_program，源码内 vendored KWSys（Utilities/KWSys）作为静态库 kwssys 一并编译，不存在依赖链断裂风险"
    - "R26 终端工具静态构建：BUILD_SHARED_LIBS=OFF"
    - "E577：CMake 无 Platform/HarmonyOS.cmake（只有 OHOS.cmake），CMAKE_SYSTEM_NAME 停在 HarmonyOS 时 UNIX 未定义，KWSys 会误选 ProcessWin32.c；配方显式设 CMAKE_SYSTEM_NAME=OHOS 修复"
    - "E507/E099：OHOS musl 无 pthread_setcancelstate；以能力宏 BOOST_SP_NO_PTHREAD_SETCANCELSTATE + patches/0001 修复（无平台宏）"
    - "patches/0002：上游 include-guard 检查用整条路径子串判断（find('.c')），Conan 2 缓存根 ~/.conan2 含 '.c' 使其被静默禁用，导致 Test5059 失败；改为按文件扩展名判断"
    - "上游测试为自包含 CTest（41 项 = 6 单元测试 + 35 bug 基线对比），无网络/GUI/外部数据依赖"
    - "交叉编译守卫：build() 以 can_run() 包裹 ctest；本机 OHOS aarch64 原生构建时真实执行，远端交叉编译时仅编译（benchmark 1.9.5 同范式）"
    - "package_type=application：产物为 bin/KWStyle 可执行文件，消费者用例以 CLI 方式验证而非链接静态库"
  common_dependencies: []

versions:
  "1.1.0-git20250114.eb1e46d":
    status: built
    build_date: 2026-09-25
    conan_ref: "kwstyle/1.1.0-git20250114.eb1e46d"
    notes: "零外部依赖；CMake + CTest；conan create 退出码 0，上游 CTest 41/41（100%），消费者用例 3/3；含 2 个补丁（boost 能力宏、include-guard 扩展名判断）"
