# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kwstyle/1.1.0-git20250114.eb1e46d
homepage: "https://github.com/Kitware/KWStyle"

# ── 上游测试套件（源码 eb1e46d57db0）────────────────────────────────
# 上游使用 CMake 自带 CTest，入口 Testing/CMakeLists.txt：
#   - 6 个 add_test：foreach 遍历 KWStyleTests_SRCS 注册 6 个单元测试
#   - 35 个 ADD_TEST_FROM_BUG_TRACKER()：bug 回归基线对比测试
#       （每个用例以 KWStyleTests 的 kwsRunKWStyleTest 驱动 KWStyle 二进制，
#         -exportxml 产出后由 KWStyleTests --compare 与 Testing/Data 基线逐条比对）
#   - kwsRunKWStyleTest 是上述 35 个用例的驱动函数，不是独立的 ctest 条目
# 合计 41 项，全部在 conanfile.py 的 build() 中以 ctest 执行（本机原生构建时）。
upstream_check_command: "ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

# 上游测试函数（Testing/KWStyleTests.cxx 的 RegisterTests）
upstream_tests:
  - kwsIndentTest
  - kwsSemiColonSpaceTest
  - kwsStatementPerLineTest
  - kwsVariablePerLineTest
  - kwsSwitchCaseTest
  - kwsBadCharactersTest
  - kwsRunKWStyleTest

# 上游 CTest 用例总数（conan create 日志实测：ctest -N 列出 41 项）
#   6 个单元测试（kwsIndentTest ... kwsBadCharactersTest）
# + 35 个 Test<bugid> 基线对比用例
upstream_test_count: 41

# 本轮实测结果（conan create，2026-09-25，OHOS aarch64 原生执行）
upstream_result:
  passed: 41
  failed: 0
  skipped: 0
  total: 41
  pass_rate: "100%"
  evidence: "conan create 日志 ctest 汇总：100% tests passed, 0 tests failed out of 41"

# ── 消费者视角验证（test_package 自带）──────────────────────────────
# KWStyle 是 CLI 工具而非库，消费者用例 = 把它当工具调用并验证可观测行为（R34）。
test_package_tests:
  - file: test.sh
    description: "CLI 消费者验证: -version 可执行并输出版本串; 对含制表符+超长行的 bad.cpp 必须报错(exit!=0 且 XML 含 <Error>); 对干净的 good.cpp 必须通过(exit=0)"
    command: "bash test.sh"

# test.sh 中的断言数（3 个主断言 + 若干子断言）
assertion_count: 3

# 说明：无需豁免（不在 ci/config/no_official_test.txt 中）
notes:
  - "上游 CTest 为自包含测试（无网络、无 GUI、无外部数据），在 OHOS 原生构建下可真实执行"
  - "远端交叉编译时 conanfile.py 以 can_run() 守卫跳过执行，仅编译（与 benchmark 1.9.5 同范式）"
  - "Test5059 依赖 NDEFINE 检查；它原先因构建路径含 Conan 2 缓存根 '.conan2'（子串 '.c'）而被静默跳过，已由 patches/0002 修正为按文件扩展名判断"
