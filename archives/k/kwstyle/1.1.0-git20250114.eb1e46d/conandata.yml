# conandata.yml — KWStyle 1.1.0-git20250114.eb1e46d
#
# Source: Kitware/KWStyle (Kitware Style Checker, C++).
# 平台任务把版本号固定为 "上游版本-git日期.commit" 形式，对应 master 上的
# commit eb1e46d57db0（2025-01-14，"COMP: Improve type size correctness"）。
# 上游 CMakeLists.txt 自身声明的 project VERSION 为 1.1.0，二者关系见 notes.md。
#
# sha256 由实际下载的 tarball 计算得出（经 gh-proxy.com 镜像下载，3,539,061 bytes）。
# 依 R39：主源为官方正式源（官方 GitHub archive），镜像 fallback 由 CI 自动补齐
# （ci/conan/build_and_test.sh 的 get_mirror_list 对 github.com 主源自动前置
#  gh-proxy.com）。此处只列官方源，不再手工罗列镜像 —— 手工列出的镜像若在本地
#  不可达会让预下载逐条重试（3 次 × connect-timeout 30s），显著拖慢本地 CI。

sources:
  url: "https://github.com/Kitware/KWStyle/archive/eb1e46d57db0.tar.gz"
  sha256: "93cab9d40052a01a237525f6f25b16ac97c94ee5fd4b725fadd1f2e51dbe4eaf"

# OHOS 适配补丁。
#
# 0001 — KWStyle 自带（vendored）的 boost 在 boost/core/detail/sp_thread_sleep.hpp
#   中调用 pthread_setcancelstate()，OHOS musl libc 不声明该函数（与 Android 同样缺失，
#   上游已为 Android 留了 !defined(__ANDROID__) 例外，但未覆盖 OHOS）。
#   补丁把守卫扩展为同时接受能力宏 BOOST_SP_NO_PTHREAD_SETCANCELSTATE，
#   由 conanfile.py generate() 定义该宏。**不使用任何平台宏**
#   （不出现 __OHOS__/HarmonyOS 分支），符合 R8 与知识库 E507 的 forbid 约束。
#   同口径先例：archives/b/boost-1.85/1.85.0-b2-nodocs/patches/0001-ohos-pthread-cancel-fix.patch
#   （自述 "R8-compliant (no platform macro)"）；另见 E507 / E099 / E127。
#
# 0002 — 上游 kwsCheckIfNDefDefine.cxx 用整条路径的子串判断来跳过 C 源文件检查：
#     `if(m_Filename.find(".c") != std::string::npos) return false;`
#   Conan 2 的构建/源码路径位于缓存根 `~/.conan2` 之下，其中就含子串 ".c"，
#   于是该检查对**所有**文件被静默跳过，导致上游基线 Test5059（期望
#   NDEFINE/ErrorNumber 14）拿不到应有的错误而失败：
#     "The baseline as more errors than the test"
#   补丁把判断改为检验**文件扩展名**（.c/.cc/.cxx/.cpp/.c++），保留上游
#   "跳过 C/C++ 源文件" 的本意，同时不再受父目录名影响 —— .h 头文件恢复正常检查。
#   实测：修复后 Test5059 输出与上游基线逐条一致（5/5 条 Error 全中）。
#   行为差异仅限「路径中含 .c 的头文件」，其余扩展名判定与原先一致。
patches:
  - patch_file: "patches/0001-boost-sp-thread-sleep-skip-pthread-setcancelstate.patch"
    patch_description: "Gate boost sp_thread_sleep's pthread_setcancelstate calls behind the BOOST_SP_NO_PTHREAD_SETCANCELSTATE capability macro (OHOS musl lacks the symbol; same approach as boost/1.85.0). No platform macro is introduced."
    patch_type: "portability"
  - patch_file: "patches/0002-kwsCheckIfNDefDefine-test-file-extension-not-path.patch"
    patch_description: "Test the file extension instead of a substring of the whole path when skipping C/C++ sources in CheckIfNDefDefine(). The Conan 2 cache root '~/.conan2' contains '.c', which silently disabled the include-guard check for headers and made upstream baseline Test5059 (NDEFINE) fail."
    patch_type: "portability"
