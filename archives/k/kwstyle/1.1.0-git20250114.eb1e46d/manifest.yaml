# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "KWStyle 为零外部依赖的纯 C++11 + CMake 项目，源码内 vendored KWSys（Utilities/KWSys）作为静态库 kwssys 一并编译，无依赖链风险"
  - "上游 install(TARGETS KWStyle RUNTIME DESTINATION bin) 把可执行文件装到 bin/，另装 Documentation/*.kws.xml 与 Web/headers 到 share/KWStyle"
  - "上游测试为自包含 CTest（41 项 = 6 单元测试 + 35 bug 基线对比），无网络/GUI/外部数据依赖，OHOS 原生构建下可真实执行"
  - "测试程序输出到 CMAKE_RUNTIME_OUTPUT_DIRECTORY（构建目录 bin/），ADD_TEST_FROM_BUG_TRACKER 用 ${KWStyle_BINARY_DIR}/KWStyle 调起被测二进制并比对 Testing/Data/*-output.xml 基线"
  - "交叉编译时上游 CMake 的 add_subdirectory(Testing) 仅编译不执行，配方以 can_run() 守卫 ctest，与 benchmark 1.9.5 同范式"
  - "E577：CMake 无 Modules/Platform/HarmonyOS.cmake（只有 OHOS.cmake，内容为 include(Platform/Linux)），故 CMAKE_SYSTEM_NAME 停在 HarmonyOS 时 UNIX 未定义；KWSys 以 if(NOT UNIX) 选择 ProcessWin32.c 导致 'windows.h file not found'。配方显式设 CMAKE_SYSTEM_NAME=OHOS 修复，实测 KWSys 改用 ProcessUNIX.c"
  - "E507/E099：OHOS musl 无 pthread_setcancelstate；KWStyle vendored boost 的 sp_thread_sleep.hpp 上游只为 Android 留了例外。以能力宏 BOOST_SP_NO_PTHREAD_SETCANCELSTATE + patches/0001 修复（无平台宏，与 boost/1.85.0 补丁同口径）"
  - "上游 kwsCheckIfNDefDefine.cxx 用整条路径的子串判断跳过 C 源文件（find('.c')）；Conan 2 缓存根 ~/.conan2 含 '.c'，导致 include-guard 检查对所有文件被静默跳过，Test5059（NDEFINE/ErrorNumber 14）因基线多出一条错误而失败。patches/0002 改为按文件扩展名判断后 Test5059 通过"
  - "上游 KWStyleTests 的 Compare() 对『测试输出无 <Error>』的情形会直接判 PASS（posError/posErrorBase 均从 testfileBuffer 取初值，均为 -1 时跳过循环），故空输出的用例会假通过；判读 ctest 结果时需注意该口径"
