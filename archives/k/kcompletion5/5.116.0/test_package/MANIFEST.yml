version: 1
package: kcompletion5/5.116.0
homepage: "https://invent.kde.org/frameworks/kcompletion"

upstream_check_command: "ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "conan create (BUILD_TESTING=ON builds and runs the upstream CTest suite)"

upstream_tests:
  - file: autotests/kcompletioncoretest.cpp
    source: "kcompletion-5.116.0/autotests/kcompletioncoretest.cpp"
    description: "KCompletion core matching and item ordering tests."
    command: "ctest -R '^kcompletioncoretest$'"
  - file: autotests/klineedit_unittest.cpp
    source: "kcompletion-5.116.0/autotests/klineedit_unittest.cpp"
    description: "KLineEdit completion and keyboard interaction tests."
    command: "ctest -R '^klineedit_unittest$'"
  - file: autotests/kcombobox_unittest.cpp
    source: "kcompletion-5.116.0/autotests/kcombobox_unittest.cpp"
    description: "KComboBox completion behavior tests."
    command: "ctest -R '^kcombobox_unittest$'"
  - file: autotests/ksortablelisttest.cpp
    source: "kcompletion-5.116.0/autotests/ksortablelisttest.cpp"
    description: "KSortableList ordering and lookup tests."
    command: "ctest -R '^ksortablelisttest$'"
  - file: tests/
    source: "kcompletion-5.116.0/tests/"
    description: "Three upstream manual GUI test applications (kcomboboxtest, kcompletionuitest, klineedittest); built but not registered with CTest because they require interactive manual use."
    command: "Manual GUI execution; not part of automated CTest."

test_package_tests:
  - file: test_package/test.cpp
    description: "HarmonyOS-specific integration test verifies uname is HarmonyOS/aarch64, launches QApplication/KLineEdit, injects Qt key events, and checks completion of a real candidate."
    command: "conan create (test_package CTest and executable test_kcompletion5)"

assertion_count: 261
