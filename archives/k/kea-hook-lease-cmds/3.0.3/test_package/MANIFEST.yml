# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-lease-cmds/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的两个 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> dhcp-lease-cmds-lib-tests dhcp-lease-cmds-libload-tests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-lease-cmds-lib-tests dhcp-lease-cmds-libload-tests"

# 上游实际运行的测试程序（本次适配实测：24 + 355 = 379 个用例全部通过）
upstream_tests:
  - file: dhcp-lease-cmds-lib-tests
    source: src/hooks/dhcp/lease_cmds/tests/
    description: >-
      binding_variables_unittest.cc / lease_cmds_func4_unittest.cc /
      lease_cmds_func6_unittest.cc 覆盖 lease-cmds hook 的绑定变量缓存与
      DHCPv4/DHCPv6 offer/committed callout；本配置注册 24 个用例
      （BindingVariableTest 5、BindingVariableCacheTest 2、BindingVariableMgrTest 5、
      LeaseCmdsFuncTest4 6、LeaseCmdsFuncTest6 6）
    command: "./dhcp-lease-cmds-lib-tests"
  - file: dhcp-lease-cmds-libload-tests
    source: src/hooks/dhcp/lease_cmds/libloadtests/
    description: >-
      lease_cmds4_unittest.cc / lease_cmds6_unittest.cc / lease_cmds_unittest.cc /
      load_unload_unittests.cc 通过 dlopen 加载 libdhcp_lease_cmds.so 并逐条驱动
      lease4-*/lease6-* 命令 callout 的加载、注销与错误路径；本配置注册 355 个用例
      （Lease4CmdsTest 162、Lease6CmdsTest 184、LeaseCmdsTest 4、LeaseCmdsCbLibLoadTest 5）
    command: "./dhcp-lease-cmds-libload-tests"

# test_package 中自带的测试（1 项消费者契约 + 1 项鸿蒙特有）
test_package_tests:
  - file: test_lease_cmds_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload 契约符号、lease4-*/lease6-* 命令 callout 与 hook ABI 版本"
    command: "./test_lease_cmds_hook <package>/lib/kea/hooks/libdhcp_lease_cmds.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有用例：校验包内 libdhcp_lease_cmds.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc libc.so.6、
      链接 libc++_shared.so）并验证 OHOS 加载器可 dlopen(RTLD_NOW) 解析
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_lease_cmds.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（本次适配实测：1 个，1/1 通过）
ohos_specific_tests:
  count: 1
  entries:
    - test_ohos_platform
  command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_lease_cmds.so"
  result: "1/1 passed"

# 测试用例总数（本次实测执行的上游用例数：24 + 355）
assertion_count: 379
