# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kcolorscheme/6.18.0.1.

package: kcolorscheme/6.18.0.1
homepage: https://invent.kde.org/frameworks/kcolorscheme

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kcolorscheme-6.18.0/autotests/
    description: "KColorScheme upstream CTest/autotests suite"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    condition: "run in the Conan build with BUILD_TESTING=ON"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke constructs KColorScheme and checks a valid background brush."
    command: "conan create (test_package builds and runs test_kcolorscheme)"

assertion_count: 1
