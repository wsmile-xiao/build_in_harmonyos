package: kcolorscheme/6.26.0
homepage: "https://invent.kde.org/frameworks/kcolorscheme"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/kcolorschemetest.cpp
    source: kcolorscheme-6.26.0/autotests/kcolorschemetest.cpp
    description: "KColorScheme construction, color-role lookup, and contrast behavior"
    command: "kcolorschemetest"
    condition: "BUILD_TESTING=ON; run by CTest with QT_QPA_PLATFORM=offscreen"

test_package_tests:
  - file: test.cpp
    description: "Link KF6::ColorScheme and validate background, foreground, decoration, and contrast APIs"
    command: "./test_kcolorscheme"

assertion_count: 4
