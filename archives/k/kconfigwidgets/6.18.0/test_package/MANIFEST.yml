# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kconfigwidgets/6.18.0.

package: kconfigwidgets/6.18.0
homepage: https://invent.kde.org/frameworks/kconfigwidgets

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kconfigwidgets-6.18.0/autotests/
    description: "KConfigWidgets upstream CTest/autotests suite"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    condition: "run in the Conan build with BUILD_TESTING=ON"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke constructs KConfigDialog, verifies exists() registration, addPage(), currentPage(), and teardown."
    command: "conan create (test_package builds and runs test_kconfigwidgets)"

assertion_count: 5
