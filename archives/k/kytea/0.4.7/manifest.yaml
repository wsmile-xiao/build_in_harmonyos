version: "0.4.7"
software: kytea
status: built
build_system: autotools
build_date: "2026-09-16"

source:
  url: "https://www.phontron.com/kytea/download/kytea-0.4.7.tar.gz"
  sha256: "534a33d40c4dc5421f053c71a75695c377df737169f965573175df5d2cff9f46"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix={package_folder}"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-guess-sub-ohos-aarch64.patch"
  - "0002-configure-umask-hmdfs.patch"
  - "0003-string-util-narrowing-cast.patch"
  - "0004-test-analysis-tmpdir.patch"

upstream_tests:
  command: "make check"
  test_count: 47
  notes: "test-kytea runs 6 suites: TestKytea 10, TestAnalysis 15, TestSentence 1, TestCorpusIO 9, TestCorpusIOEuc 6, TestCorpusIOSjis 6. TestAnalysis writes /tmp fixtures, patched to honor TMPDIR (read-only /tmp on OHOS)."

test_package:
  assertion_count: 8
  description: "Library consumer links libkytea (StringUtil type map/round-trip, FullCorpusIO tagged parse, trainAll + calculateWS); CLI consumer trains a model with train-kytea -full then analyzes raw text with kytea -model."

knowledge_gained:
  - "kytea 0.4.7 tarball 携带维护者机器上生成的陈旧 src/include/kytea/config.h（定义 HAVE_BOOST_TR1_*）：VPATH 构建下 <kytea/config.h> 只解析到源码树陈旧文件并引入不存在的 boost 头，必须 in-source configure 让 config.status 覆盖之"
  - "configure 报 'cannot run C compiled programs' 的真实根因是 HMDFS 拒绝 umask 077 的 mkdir（mktemp 目录创建失败），umask 022 即可修复，与编译器无关"
  - "上游测试 test-analysis 写 /tmp/kytea-* 模型文件，OHOS /tmp 只读，需补丁改为尊重 TMPDIR"
  - "clang-15 默认 -Werror=c++11-narrowing 会拒绝 char arr[2]={c,0} 的隐式收窄，需 static_cast<char>"
  - "OHOS 无 /bin/sh：configure 会 exec $CONFIG_SHELL 自我重启且 libtool 用其写包装脚本 shebang（须绝对路径），CONFIG_SHELL 应取 shutil.which('bash') 的绝对值"
  - "Kytea::~Kytea() 接管 delete config_：消费者重复 delete config 即 double-free（SIGTRAP）"
  - "上游训练/分析是两个 CLI：train-kytea（-full/-tok/-part 语料）与 kytea（-model 分析）；分析模式不接受训练参数。相对路径模型名在 HMDFS 上写模型阶段重开失败，须绝对路径"
