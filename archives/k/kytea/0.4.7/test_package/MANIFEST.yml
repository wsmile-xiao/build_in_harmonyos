package: kytea/0.4.7
homepage: "https://www.phontron.com/kytea/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: test-kytea
    source: kytea-0.4.7/src/test/test-kytea.cpp
    description: "Combined upstream suite: TestKytea (10) feature extraction, TestAnalysis (15) training/prediction, TestSentence (1), TestCorpusIO (9) + EUC (6) + SJIS (6) corpus IO"
    command: "./test/test-kytea"

test_package_tests:
  - file: test.cpp
    description: "Library consumer: StringUtilUtf8 type map + round-trip, FullCorpusIO tagged-corpus parse, Kytea trainAll + calculateWS segmentation"
    command: "./kytea_lib_test"
  - file: conanfile.py (CLI)
    description: "CLI consumer: train-kytea trains a model from a fully annotated corpus, then kytea analyzes raw text with the trained model"
    command: "train-kytea -full <corpus> -model <abs-model>; kytea -model <model> <raw>"

assertion_count: 8
