sources:
  - url: "https://www.phontron.com/kytea/download/kytea-0.4.7.tar.gz"
    sha256: "534a33d40c4dc5421f053c71a75695c377df737169f965573175df5d2cff9f46"

patches:
  - patch_file: "patches/0001-config-guess-sub-ohos-aarch64.patch"
    patch_description: "config.guess/config.sub recognize aarch64-linux-ohos (2011-era scripts)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-hmdfs.patch"
    patch_description: "configure temp dir uses umask 022 (HMDFS rejects umask 077 mkdir)"
    patch_type: "portability"
  - patch_file: "patches/0003-string-util-narrowing-cast.patch"
    patch_description: "fix C++ narrowing in char array init (clang-15 -Werror by default in config)"
    patch_type: "bugfix"
  - patch_file: "patches/0004-test-analysis-tmpdir.patch"
    patch_description: "test suite honors TMPDIR for temp model/corpus files (read-only /tmp on OHOS)"
    patch_type: "portability"
