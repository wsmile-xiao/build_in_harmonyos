# conandata.yml — kea-admin 3.0.3 (ISC Kea)
# 官方发布包（ISC ftp）：Kea 3.0.3 起用 Meson 构建，kea-admin 位于 src/bin/admin。
sources:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"

patches:
  - patch_file: "patches/0001-meson.build.patch"
    patch_description: "Normalize the HarmonyOS/OpenHarmony system name to Linux so the Meson platform branch selects the Linux sources and flags"
    patch_type: "portability"
  - patch_file: "patches/0002-src-bin-admin-kea-admin.in.patch"
    patch_description: "Resolve kea-admin's runtime pieces (admin-utils.sh and the database maintenance scripts) relative to the script location so the Conan package is relocatable, and invoke the upgrade scripts through sh because the HarmonyOS PC kernel refuses script execve"
    patch_type: "portability"
  - patch_file: "patches/0003-meson.build.patch"
    patch_description: "Invoke the configure-time helper scripts (env.sh, cd-and-run.sh, grabber.py, config-report.sh) through their interpreters (sh/python3) because the HarmonyOS PC kernel refuses script execve"
    patch_type: "portability"
  - patch_file: "patches/0004-src-bin-admin-tests-meson.build.patch"
    patch_description: "Register the admin shell test scripts through sh because the HarmonyOS PC kernel refuses script execve"
    patch_type: "portability"
  - patch_file: "patches/0005-src-bin-admin-tests-admin_tests.sh.in.patch"
    patch_description: "Invoke kea-admin through sh in the admin error-reporting tests because the HarmonyOS PC kernel refuses script execve"
    patch_type: "portability"
  - patch_file: "patches/0006-src-lib-testutils-dhcp_test_lib.sh.in.patch"
    patch_description: "Start script tools through sh in the shared version_test helper while ELF binaries keep being executed directly"
    patch_type: "portability"
  - patch_file: "patches/0007-src-share-database-scripts-meson.build.patch"
    patch_description: "Resolve the admin-utils.sh path of the mysql/pgsql maintenance scripts relative to the script location so the Conan package is relocatable"
    patch_type: "portability"
  - patch_file: "patches/0008-src-lib-process-cfgrpt-meson.build.patch"
    patch_description: "Invoke the config-report generator (tools/mk_cfgrpt.sh) through sh because the HarmonyOS PC kernel refuses script execve"
    patch_type: "portability"
  - patch_file: "patches/0009-src-lib-testutils-dhcp_test_lib.sh.in.patch"
    patch_description: "Hoist the $(date +%s) command substitution out of the arithmetic expansion in the wait_for_file/wait_for_process_to_stop helpers because the HarmonyOS PC /system/bin/sh (ksh93) duplicates the command name inside $(( $(...) )), making the deadline degenerate"
    patch_type: "portability"
