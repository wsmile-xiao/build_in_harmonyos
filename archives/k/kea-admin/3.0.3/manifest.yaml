# 版本级 manifest — kea-admin 3.0.3
# 文件位置: archives/k/kea-admin/3.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.3"
software: "kea-admin"

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-10-04"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

# 上游代码仓库（发布包之外的仓库地址，供 PR body / 评审引用）
upstream_url: "https://gitlab.isc.org/isc-projects/kea"

# 测试汇总（上游用例级 20 = admin 17 + memfile 3，全部通过；消费者测试 45 项另计）
test_passed: 20
test_failed: 0
test_skipped: 0

# 命中的知识图谱条目（R17）
knowledge_ref:
  - E087
  - E090
  - E127
  - E481
  - DRAFT-12776-kea-admin-3.0.3-ohos-ksh93-arith-cmdsubst-doubling
  - DRAFT-12776-kea-admin-3.0.3-conan-verify-g4-local-cache-json-shape

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  # kea-admin 目标（src/bin/admin/meson.build）无编译、无 dependencies/link_with：
  # 上游唯一动作是 configure_file()——展开 kea-admin.in / admin-utils.sh.in
  # 并物化 mysql/pgsql 维护脚本。本包在 Meson 配置阶段停止（configure 已产出
  # 全部交付物）；build() 内仅额外跑上游 admin 测试套件。
  phases: ["configure"]
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
  # 工程级配置期门禁依赖（Kea 以单一 Meson 工程配置；不进入交付物）
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================

artifacts:
  - "bin/kea-admin（由 kea-admin.in 经 configure_file 生成，chmod 0755；平台内核拒绝脚本 execve，运行形态为 sh <package>/bin/kea-admin）"
  - "share/kea/scripts/admin-utils.sh（工具与全部维护脚本共用的助手，可 source）"
  - "share/kea/scripts/mysql/（40 个 upgrade_*.sh + dhcpdb_create.mysql/dhcpdb_drop.mysql/wipe_data.sh）"
  - "share/kea/scripts/pgsql/（34 个 upgrade_*.sh + dhcpdb_create.pgsql/dhcpdb_drop.pgsql/wipe_data.sh）"
  - "licenses/COPYING"

# ============================================================
# 上游测试（build() 内真实执行 + 本地验证全量执行）
# ============================================================

upstream_tests:
  registered_by: "src/bin/admin/tests/meson.build（suite shell-tests；门禁 -D tests=enabled）。mysql/pgsql 套件仅在后端 configured 时注册，本配方 -Dmysql=disabled -Dpostgresql=disabled，与上游注册条件一致，故不注册。"
  registrations: 2
  in_package_build_suite: "admin_tests.sh"
  in_package_build_cases: 17
  # 真机实测（2026-10-04，Verdict 见版本级 notes.md）：
  in_package_build_result: "17/17（meson 1/1 OK，85.68 s，--timeout-multiplier 4；随 G2 干净构建实跑，17 例全 [OK]）"
  local_validation_suites_run: 1
  local_validation_cases_run: 3
  local_validation_cases_passed: 3
  local_validation_cases_failed: 0
  local_validation_cases_skipped: 0
  local_validation_command: >-
    meson test -v --no-rebuild --timeout-multiplier 10 -C <builddir> memfile_tests.sh
    （全树构建完成后执行；HMDFS 无符号链接，须先补齐构建树 SONAME 文件
    libkea-*.so.<major>，详见版本级 notes.md 问题表）
  local_validation_note: >-
    memfile 3 例（memfile.init / memfile.upgrade / memfile.version）会启动
    kea-dhcp4/kea-dhcp6/kea-lfc 三个服务端/工具并用 CsvFile 持久化建库校验，
    这些是本 Meson 工程的其它目标、不属于本包交付物，故不在配方 build() 内
    执行；本地验证阶段在全树构建后全量执行。
  timeout_note: >-
    meson 默认单测超时为 30 s；admin 套件在本机需 85.68 s（每例一个 kea-admin
    进程），故配方内使用 --timeout-multiplier 4，本地 memfile 套件使用
    --timeout-multiplier 10。

# ============================================================
# 鸿蒙特有测试（test_package，2 个用例）与消费者契约测试
# （消费者契约测试 test_kea_admin.py 共 45 项校验，属通用消费者验证，
