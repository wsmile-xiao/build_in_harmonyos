# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kea-admin 是 POSIX shell 脚本工具（src/bin/admin/meson.build 无编译、无 dependencies/link_with），配方在 meson setup 后即可交付；但因为 Kea 以单一 Meson 工程配置，仍须通过顶层 configure 门禁（boost 无 fallback、openssl 默认 crypto 后端、log4cplus wrap fallback），这些依赖只服务配置期探针"
  - "Meson 报告 OHOS 为 system='harmonyos'，Kea 平台白名单不含它（meson.build:186 直接 error）：补丁 0001 把 SYSTEM 归一化为 'linux'（知识 E090 同类）"
  - "HarmonyOS PC 内核拒绝 shebang 脚本 execve（EACCES/126，与可执行位无关，文件本身 0770+可执行位仍在）：kea-admin 及其维护脚本、配置期辅助脚本、测试脚本共 6 枚补丁改为解释器前缀调用（0002/0003/0004/0005/0006/0008），配方内 meson 包装脚本（#! 脚本）同样经 sh 调用（知识 E087 同类）；运行时说明：sh <package>/bin/kea-admin"
  - "上游把 configure 期绝对前缀（--prefix=/）烘进脚本：kea-admin 的 admin-utils.sh/SCRIPTS_DIR 与 mysql/pgsql 维护脚本的 datarootdir 都指向 /share/kea——包内不存在：补丁 0002/0007 改为按脚本自身位置运行时解析（<root>/bin/kea-admin → <root>/share/kea/scripts）"
  - "meson test 只重建测试注册中 depends: 声明的目标；本包 admin 套件注册无 depends（上游 memfile 注册的 depends 行亦为注释态，补丁 0004 上下文），build() 内不触发任何编译——kea-admin 交付物全部由 meson setup/configure_file 产出；memfile 本地验证依赖工程其它目标（kea-dhcp4/6/lfc），须另以 meson compile 全树构建（本机 414 个目标、-j 6——OHOS 沙箱进程配额有限，建议限并发）"
  - "上游 meson 测试注册直接 exec 测试脚本，在 OHOS 上必挂 EACCES：补丁 0004 把四套 shell 测试（admin/memfile/mysql/pgsql）统一经 sh 注册，测试脚本内部对 kea-admin 的调用同样 sh 前缀（0005/0006），脚本类工具 sh、ELF 类二进制直跑的判据用 head -c 2 是否为 '#!'"
  - "boost 制品 1.90/1.91 包头文件不全（缺 boost/interprocess、boost/circular_buffer 等 Kea 以 required:true 探测的头文件）→ 锁 boost/1.85.0"
  - "OHOS musl <pthread.h> 未声明 pthread_setcancelstate，boost sp_thread_sleep.hpp 依赖它：注入 -DBOOST_SP_NO_PTHREAD_SETCANCELSTATE（知识 E127）"
  - "MesonToolchain 需 PkgConfigDeps 生成 .pc；配置期 cpp.run() 探针真实执行，host 依赖须经 LD_LIBRARY_PATH 可见；CI worker PATH 无 llvm-ar/llvm-ranlib，需从编译器路径推导（知识 E481）"
  - "官方 conan-verify 的 L2 冒烟门禁直接 execve 包内 bin/*：纯脚本包在本平台必然 PermissionError（_run 只捕获 TimeoutExpired/FileNotFoundError，异常穿透导致整个验证崩溃、不留报告；l2_probe.py 复现见证）。平台惯例脚本工具经 sh 前缀调用（E087、cdb 先例），本次验证以 sh-proxy 驱动官方 runner 运行（驱动只把 /.conan2/p/ 下 #! 文件改经 sh 启动，模板逻辑零改动），L2 经代理通过；建议上游 runner 对脚本产物用 sh 冒烟"
  - "OHOS 上 CPython subprocess 走 posix_spawn 不按 PATH 解析可执行名：消费者测试内裸 'sh' 报 ENOENT，须 shutil.which('sh') 解析出绝对路径后调用"
  - "OHOS /system/bin/sh 是 ksh93 语义（banner 自带 tracked alias 汇总）：算术展开内嵌命令替换 $(( $(cmd) + n )) 会把命令名翻倍（date→datedate、echo→echoecho、id 报 bad uid），展开按空值继续计算，等待类 helper 的 deadline 退化为纯 timeout 值、立即判超时（memfile.init 实证：'kea-dhcp4.csv was not created in time' 且 sh -x 轨迹为 '+ datedate +%s'）；修复=把 $(date +%s) 提前取出到变量再做算术（补丁 0009；扫描全树后仅 dhcp_test_lib.sh wait_for_file/wait_for_process_to_stop 两处命中）"
  - "HMDFS 不支持符号链接：meson 构建树中共享库只有实体名 libkea-*.so.<major>.<minor>.<patch>，SONAME 名文件 libkea-*.so.<major> 缺失，从构建树直接启动 kea-dhcp4/kea-dhcp6/kea-lfc 会报 'Error loading shared library libkea-*.so.<major>' 与 relocation error，上游 memfile 测试套件因此无法运行；本地验证环境以复制代替链接（ka_libfix.sh，把实体文件复制为 SONAME 名）。同理，任何在无符号链接文件系统上从 meson 构建树运行共享库程序的场景都需要该补齐；本包交付物为纯脚本包，不受影响"

