# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-admin/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 在 src/bin/admin/tests/meson.build 注册两个 shell 套件
# （suite shell-tests；门禁 -D tests=enabled）。mysql/pgsql 套件仅在后端配置
# 开启时注册（配方禁用后端，故不注册，与上游 CMake/Meson 的注册条件一致）。
upstream_check_command: "meson test -C <builddir> --list"
upstream_test_in_build: true
upstream_test_command: "meson test -v --timeout-multiplier 4 -C <builddir> admin_tests.sh"

# 上游实际运行的测试程序
upstream_tests:
  - file: admin_tests.sh
    source: src/bin/admin/tests/（configure_file 生成，suite shell-tests）
    description: >-
      kea-admin 错误报告套件 17 例（kea_admin_error_reporting_test.*）：
      db-init 的 mysql 参数缺参族（-u/--user、-h/--host、-n/--name、
      -d/--directory 每个含短/长选项两例）、lease-upload 的 -i/--input
      与租约类型缺参、lease-dump 的 -o/--output 与租约类型缺参、
      db-version 的 -x 与多余参数，全部不需要数据库后端；本包 build()
      内真实执行（meson 1/1 OK，85.68 s，--timeout-multiplier 4）
    command: "meson test -v --timeout-multiplier 4 -C <builddir> admin_tests.sh"
  - file: memfile_tests.sh
    source: src/bin/admin/tests/（suite shell-tests）
    description: >-
      memfile 目录套件 3 例：memfile.init（kea-dhcp4/kea-dhcp6 服务端以
      CsvFile 持久化建库并校验 header）、memfile.upgrade（kea-lfc -4/-6
      升级）、memfile.version（version_test 辅助）。服务端/工具是本 Meson
      工程的 kea-dhcp4/kea-dhcp6/kea-lfc 目标、不属于本包交付物，故不在
      配方 build() 内执行；已在本地验证阶段全树构建后全量执行（3/3 通过）
    command: "meson test -v --timeout-multiplier 10 -C <builddir> memfile_tests.sh"

# test_package 中自带的测试（消费者视角验证，45 项校验；鸿蒙特有 2 例）
test_package_tests:
  - file: test_kea_admin.py
    description: >-
      以 conanrun 环境驱动包内 kea-admin（经 sh 解释器启动）：45 项校验 =
      产物清单（bin/kea-admin shebang/可执行位、admin-utils.sh、mysql 40
      个 upgrade_*.sh 与 3 个基础脚本、pgsql 34+3、licenses/COPYING）、
      重定位（运行期按包根解析 share/kea/scripts、无 configure 残留绝对
      路径、upgrade 脚本 sh 前缀调用、admin-utils.sh 可 source）、版本/用法
      （-v/--version/-V/--help 与默认脚本目录回显）、错误面（10 条错误路径
      + memfile stats-recount 正常路径）、mysql/pgsql 全链路（db-init/
      db-upgrade/db-version 经 C 桩替换 mysql/psql 客户端：argv 透传、
      schema 字节数、40 条 Processing、>=40 次 schema_version 查询）、
      2 项负向控制（缺 admin-utils、缺 schema 脚本）
    command: "python3 test_kea_admin.py"

# 鸿蒙特有测试用例统计（test_package 内，实测结果见版本级 notes.md）
ohos_specific_tests:
  count: 2
  entries:
    - "sh 解释器调用形态：全部 45 项校验经 sh <package>/bin/kea-admin 启动（OHOS 内核拒绝脚本 execve——直接执行 EACCES/126——平台惯例以 sh 前缀调用脚本工具）"
    - "relocation/sh_wrapped_upgrade_calls：upgrade_*.sh 的 mysql/pgsql 调用均为 sh 前缀（同一平台限制）"
  command: "sh <package>/bin/kea-admin -v"

# 上游测试用例总数（admin_tests 17 + memfile 3；实际运行记录见版本级 manifest/notes）
assertion_count: 20
