# 软件级 manifest — kea-admin
# 文件位置: archives/k/kea-admin/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: kea-admin
display: "Kea Admin"
description: "ISC Kea 的数据库管理工具（kea-admin），负责租约库初始化、模式版本查询/升级与租约导入导出（mysql/pgsql）"
category: network
homepage: "https://www.isc.org/kea/"
license: MPL-2.0
build_system: meson

ohos_adaptation:
  key_points:
    - "kea-admin 是 POSIX shell 脚本工具（src/bin/admin）：上游 Meson 目标无编译、无 dependencies/link_with，唯一构建动作是 configure_file()——展开 kea-admin.in 与 admin-utils.sh.in，并把 mysql（40 个 upgrade_*.sh 加 3 个基础脚本）与 pgsql（34 加 3）维护脚本物化到构建树。"
    - "配方在 Meson 配置阶段（meson setup）停止：该阶段已经产出全部交付物，本包无需编译、无需链接。"
    - "Kea 以单一 Meson 工程配置，顶层 meson.build 的门禁要求 boost（无 fallback）、openssl（默认 crypto 后端）、log4cplus（wrap fallback），故这些工程级依赖在配方中声明；它们只服务配置期探针，不进入交付物。"
    - "OHOS 上 meson 报告 system='harmonyos'，Kea 平台分支白名单不含它：补丁 0001 将 SYSTEM 归一化为 'linux'，否则 meson setup 直接失败。"
    - "上游把 configure 时的绝对前缀写进脚本（kea-admin 与数据库维护脚本都经 /share/kea 绝对路径解析运行时部件），Conan 包内不存在该路径：补丁 0002/0007 改为按脚本自身位置运行时定位（<root>/bin/kea-admin 到 <root>/share/kea/scripts）。"
    - "HarmonyOS PC 内核拒绝 execve 无解释器前缀的 #!/bin/sh 脚本（与可执行位无关）：补丁 0002/0004/0005/0006 让 kea-admin、upgrade 脚本与上游 shell 测试统一经 sh 启动；配方内 meson 包装脚本（同为 #!/bin/sh）也经 sh 调用。"
    - "Kea 的 meson 配置/构建期还有多处直接执行脚本：顶层 meson.build 的 CD_AND_RUN/env.sh/grabber.py 与 configure_file(command:) 的 config-report.sh（补丁 0003），以及 tools/mk_cfgrpt.sh（src/lib/process/cfgrpt/meson.build，补丁 0008）——全部改为解释器前缀调用（sh / python3）。"
    - "上游 meson test 只重建测试注册中 `depends:` 声明的目标（本包 admin 套件注册无 depends，相邻 memfile 注册的该行上游即为注释态）；build() 内因此不触发编译，交付物全部在 meson setup 阶段产出。admin 套件运行时以 sh 前缀注册（补丁 0004/0005），测试内的其它脚本调用点（dhcp_test_lib.sh 的 version_test，补丁 0006）只在目标是脚本时才经 sh。"
    - "boost 必须锁定 1.85.0：制品仓 1.90/1.91 包头文件不全（缺 boost/interprocess、boost/circular_buffer 等 Kea 以 required:true 探测的头文件）。"
  common_dependencies:
    - boost
    - openssl
    - log4cplus

versions:
  "3.0.3":
    status: built
    build_date: "2026-10-04"
    path: archives/k/kea-admin/3.0.3
