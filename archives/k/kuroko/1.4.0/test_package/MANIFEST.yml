package: kuroko/1.4.0
homepage: "https://github.com/kuroko-lang/kuroko"
upstream_check_command: "make -j1 test"
upstream_test_in_build: true
upstream_test_command: "make -j1 test"
upstream_tests:
  - file: "test/*.krk"
    source: "kuroko-1.4.0/test/*.krk"
    description: "148 official script/expected-output pairs run by make test"
    command: "make -j1 test"
test_package_tests:
  - file: test_runtime.py
    description: "Installed interpreter, module import, tool, and C API consumer"
    command: "python3 test_runtime.py <package directory> <compiled consumer>"
  - file: consumer.c
    description: "Embeddable C API consumer compiled against installed headers and library"
    command: "./consumer"
assertion_count: 5
