software: kcontacts
display: "KContacts"
description: "KDE Frameworks 6 contacts/address book library (KF6Contacts: vCard addressee and contact-group model, import/export helpers)"
category: library
homepage: "https://invent.kde.org/frameworks/kcontacts"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "USE_QML=OFF keeps the Akonadi contact-library surface; BUILD_TESTING=ON keeps upstream CTest coverage"
    - "patch 0001 disables ki18n_install(po) (Qt Linguist tools not in the qtbase package)"
    - "cmake_system_name=OHOS + CMAKE_USER_MAKE_RULES_OVERRIDE defines -Wl,-soname flags (no CMake Platform/HarmonyOS module; DRAFT-cmake-harmonyos-platform-soname-flag)"
    - "post-install ELF re-signing for the OHOS runtime loader; dependency .so* symlinked (not copied) for runtime checks to preserve signatures"
    - "OHOS SDK llvm/lib prepended to host-tool LD_LIBRARY_PATH only (SDK lld needs libxml2.so.16), never into CTest target execution"

versions:
  - version: "6.18.0"
    status: verified
    date: 2026-08-27
    dependencies:
      required:
        - qtbase/6.11.1
        - kcodecs/6.18.0
        - kconfig/6.18.0
        - kcoreaddons/6.18.0
        - ki18n/6.18.0
      build:
        - ecm/6.26.0
        - shared-mime-info/2.5.1
    runner: "codex-a-kcontacts-kcontacts-6.18.0-r2-20260827-204232-31359"
    note: "upstream CTest 30/30 runnable entries passed; the 2 excluded address tests need the iso-codes geographic data surface absent from the OHOS device image (environment limitation)"
  - version: "6.14.0"
    status: verified
    date: 2026-09-21
    dependencies:
      required:
        - qtbase/6.11.1
        - kcodecs/6.14.0
        - kconfig/6.14.0
        - kcoreaddons/6.14.0
        - ki18n/6.14.0
      build:
        - ecm/6.26.0
        - shared-mime-info/2.5.1
    runner: "manual: ZCode builder run on ohpc device 2026-09-21 (ci-run.log; ci-metadata build_trace.runner=manual)"
    note: "KF6 6.14 family alignment so KF6 6.14 exact pins (mauikit/4.0.2, kio/6.14.0) resolve; same patch 0001; upstream CTest 30/30 runnable entries passed (2 address tests excluded, iso-codes geographic data surface absent from the OHOS device image, environment limitation); test_package 2/2 including the SONAME DT_NEEDED consumer check"
