# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kcompletion/6.26.0.

package: kcompletion/6.26.0
homepage: https://invent.kde.org/frameworks/kcompletion

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kcompletion-6.26.0/autotests/
    description: "KCompletion upstream CTest/autotests suite"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    condition: "run in the Conan build with BUILD_TESTING=ON"
  - file: tests/
    source: kcompletion-6.26.0/tests/
    description: "Manual upstream widget probe executables"
    command: "built by cmake --build; not registered by upstream as CTest tests"
    condition: "not executed because these are manual/interactive UI probes"
  - file: CMakeLists.txt
    source: kcompletion-6.26.0/CMakeLists.txt
    description: "ECM AppStream metadata validation hook"
    command: "appstreamcli"
    condition: "not set up because appstreamcli is unavailable as a host tool on the OHOS runner"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke constructs KCompletion and verifies matching results."
    command: "conan create (test_package builds and runs test_kcompletion)"

assertion_count: 3
