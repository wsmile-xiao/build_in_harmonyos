package: kconfig-frontends/4.11.0.1
homepage: "https://gitlab.com/ymorin/kconfig-frontends"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []
test_package_tests:
  - file: src/test_parser.c
    description: "Conan consumer calls conf_parse/conf_read, looks up ENABLE_PARSER, changes it through the parser API, and saves it with conf_write"
    command: "kconfig_parser_consumer <fixtures/Kconfig>"
  - file: conanfile.py
    description: "Runs installed kconfig-conf and verifies bool, integer, choice, string defaults and saved-value preservation; on OHOS also uses $HOME/tmp for HMDFS-backed config I/O"
    command: "kconfig-conf --olddefconfig <fixtures/Kconfig>"
  - file: test_text_frontends.py
    description: "Runs installed kconfig-mconf and kconfig-nconf in a PTY and verifies both initialize and exit successfully"
    command: "python test_text_frontends.py <kconfig-mconf> <kconfig-nconf> <fixtures/Kconfig>"
assertion_count: 19
harmonyos_assertion_count: 4
