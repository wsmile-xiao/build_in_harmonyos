version: "4.11.0.1"
status: built
conan_ref: "kconfig-frontends/4.11.0.1"
build_system: autotools

source:
  url: "https://gitlab.com/ymorin/kconfig-frontends.git"
  commit: "f22fce3a308be1c7790ebefc6bbedb33c5f7c86a"
  sha256: "66a0c8ef1f2cc1e825fc1c8805067501de509d39ff508e4432a9bd8edbc95f08"
  sha256_scope: "Unprefixed git archive tar of the pinned commit"

build:
  system: autotools
  configure_options:
    - "--enable-frontends=conf,mconf,nconf"
    - "--disable-kconfig"
    - "--disable-utils"
    - "--disable-L10n"
  dependencies:
    - "ncurses/6.6"
  build_tools:
    - "autoconf/2.72"
    - "automake/1.18"
    - "libtool/2.5.4"
    - "m4/1.4.19"
    - "bison/3.8.2"
    - "flex/2.6.4.2"
    - "gperf/3.3"

patches_applied: []

upstream_tests:
  command: "make check"
  test_count: 0
  testable_count: 0
  notes: "The pinned upstream tree contains no tests/ directory and Makefile.am registers no TESTS or check_PROGRAMS. make check is run only as an Autotools target check."

test_package:
  assertion_count: 19
  harmonyos_assertion_count: 4
  description: "Calls the parser API, validates conf output and saved choices, and launches mconf/nconf through a PTY. On OHOS it verifies HOME resolves below /storage/Users and reads/writes the config below $HOME/tmp."
