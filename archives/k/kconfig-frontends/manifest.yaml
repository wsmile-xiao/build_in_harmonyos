software: kconfig-frontends
display: "Kconfig Frontends"
description: "Standalone Kconfig parser and text configuration frontends"
category: build-tool
homepage: "https://gitlab.com/ymorin/kconfig-frontends"
license: "GPL-2.0-only"
build_system: autotools

ohos_adaptation:
  key_points:
    - "Build the parser library and conf/mconf/nconf text frontends; omit GTK/Qt GUI frontends."
    - "Link against static ncurses to avoid shadowing the HarmonyOS system curses library."
    - "Run parser/config tests under the writable HarmonyOS user-home path."
  common_dependencies:
    - ncurses

versions:
  "4.11.0.1":
    status: built
    conan_ref: "kconfig-frontends/4.11.0.1"
