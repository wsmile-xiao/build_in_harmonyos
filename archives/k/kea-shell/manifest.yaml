# 软件级 manifest — kea-shell
# 文件位置: archives/k/kea-shell/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: kea-shell
display: "Kea Shell"
description: "ISC Kea 的 REST 文本客户端（kea-shell），通过 HTTP/HTTPS 向 Kea 服务端发送控制命令"
category: network
homepage: "https://www.isc.org/kea/"
license: MPL-2.0
build_system: meson

ohos_adaptation:
  key_points:
    - "kea-shell 是 Python 3 脚本工具（src/bin/shell），上游 Meson 目标无编译、无 dependencies/link_with，唯一构建动作是 configure_file()：把 kea-shell.in 展开为 kea-shell 脚本，并复制 kea_conn.py / kea_connector3.py。"
    - "配方在 Meson 配置阶段（meson setup）停止：该阶段已经产出全部交付物，本包无需编译、无需链接。"
    - "Kea 以单一 Meson 工程配置，顶层 meson.build 的门禁要求 boost（无 fallback）、openssl（默认 crypto 后端）、log4cplus（wrap fallback），故这些工程级依赖在配方中声明；它们只服务配置期探针，不进入交付物。"
    - "OHOS 上 meson 报告 system='harmonyos'，Kea 平台分支白名单不含它：补丁 0001 将 SYSTEM 归一化为 'linux'，否则 meson setup 直接失败。"
    - "上游把构建机 python3 的绝对路径写进脚本 shebang 与 PKGPYTHONDIR：补丁 0002 改为 /usr/bin/env python3；两个模块与脚本同目录安装，由 CPython 的脚本目录 sys.path 项解析。"
    - "boost 必须锁定 1.85.0：制品仓 1.90/1.91 包头文件不全（缺 boost/interprocess、boost/circular_buffer 等 Kea 以 required:true 探测的头文件）。"
  common_dependencies:
    - boost
    - openssl
    - log4cplus

versions:
  "3.0.3":
    status: built
    build_date: "2026-09-16"
    path: archives/k/kea-shell/3.0.3
