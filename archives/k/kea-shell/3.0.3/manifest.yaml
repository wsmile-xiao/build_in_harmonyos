  # configure_file()。本包在 Meson 配置阶段停止（configure 已产出全部交付物）。
  phases: ["configure"]
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
  # 工程级配置期门禁依赖（Kea 以单一 Meson 工程配置；不进入交付物）
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

