# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kea-shell 是 Python 3 脚本工具：上游 Meson 目标（src/bin/shell/meson.build）无 executable()/library()/dependencies:/link_with:，唯一动作是 configure_file()；meson setup（configure 阶段）已产出 kea-shell 脚本与两个模块，配方无需 conan 编译步骤"
  - "Meson 报告 OHOS 为 system='harmonyos'，Kea 平台分支白名单不含它（meson.build:186 直接 error）：补丁 0001 把 SYSTEM 归一化为 'linux'（知识 E090 同类）"
  - "上游把构建机 python3 的绝对路径写进 kea-shell 的 shebang（#!@PYTHON@）与 sys.path.append('@PKGPYTHONDIR@')：shebang 改为 /usr/bin/env python3（OHOS 上 /usr/bin/env 由 toybox 提供，知识 E037 的条件 1 分支）；PKGPYTHONDIR 指向构建机 site-packages，Conan 包无法占用该路径，故两个模块与脚本同目录安装，由 CPython 的脚本目录 sys.path 项解析"
  - "Kea 单 Meson 工程配置期门禁：boost 无 fallback（required）、openssl 为默认 crypto 后端（缺失即 error）、log4cplus 有 wrap fallback；因此即使交付物是纯 Python 脚本，meson setup 仍需这三个工程级依赖"
  - "OHOS musl <pthread.h> 未声明 pthread_setcancelstate，boost sp_thread_sleep.hpp 依赖它：注入 -DBOOST_SP_NO_PTHREAD_SETCANCELSTATE（知识 E127）"
  - "MesonToolchain 需要 PkgConfigDeps 生成 .pc 才能解析 boost/log4cplus/openssl；配置期 cpp.run() 探针在 native 构建下真实执行，host 依赖需经 LD_LIBRARY_PATH 可见；CI worker PATH 无 llvm-ar/llvm-ranlib，需从编译器路径推导（知识 E481）"
  - "kea-shell 的 12 个 .sh 上游进程测试在本机需 29–260 s（meson 默认 30 s 单测预算会误判超时），高负载下必须使用 --timeout-multiplier"

