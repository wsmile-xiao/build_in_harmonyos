# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-shell/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：src/bin/shell/tests/meson.build 注册 13 个 test()
# （1 个 python-tests + 12 个 shell-tests；门禁 -D tests=enabled）
upstream_check_command: "meson test -C <builddir> --list"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> --suite python-tests"

# 上游测试程序（本次适配实测：13/13 入口通过，用例级 79/79）
upstream_tests:
  - file: shell_unittest.py
    source: src/bin/shell/tests/（configure_file 生成，suite python-tests）
    description: >-
      kea_conn.py 的 CARequest 单元测试（请求体、Content-Length、版本、
      Basic 认证、Unicode 口令），11 个用例；本包 build() 内执行（无需编译）
    command: "meson test -v -C <builddir> --suite python-tests"
  - file: ca_basic_auth_tests.sh / d2_basic_auth_tests.sh / dhcp4_basic_auth_tests.sh / dhcp6_basic_auth_tests.sh
    source: src/bin/shell/tests/（suite shell-tests）
    description: >-
      4 个 basic-auth 进程测试，各 7 个子用例，驱动 kea-shell 对
      kea-ctrl-agent / kea-dhcp-ddns / kea-dhcp4 / kea-dhcp6 做认证场景验证
      （--auth-user/--auth-password/--auth-password-file、优先级、坏口令文件）
    command: "meson test -v -C <builddir> --timeout-multiplier=10 ca_basic_auth_tests.sh d2_basic_auth_tests.sh dhcp4_basic_auth_tests.sh dhcp6_basic_auth_tests.sh"
  - file: shell_ca_process_tests.sh / shell_d2_process_tests.sh / shell_dhcp4_process_tests.sh / shell_dhcp6_process_tests.sh
    source: src/bin/shell/tests/（suite shell-tests）
    description: >-
      4 个进程测试，各 7 个子用例，校验 kea-shell 的版本输出、
      list-commands、空/畸形配置、bogus 命令与认证组合
    command: "meson test -v -C <builddir> --timeout-multiplier=10 shell_ca_process_tests.sh shell_d2_process_tests.sh shell_dhcp4_process_tests.sh shell_dhcp6_process_tests.sh"
  - file: tls_ca_process_tests.sh / tls_d2_process_tests.sh / tls_dhcp4_process_tests.sh / tls_dhcp6_process_tests.sh
    source: src/bin/shell/tests/（suite shell-tests）
    description: >-
      4 个 TLS 进程测试，各 3 个子用例，校验 kea-shell 的 --ca/--cert/--key
      HTTPS 路径（含 --cert 与 --key 必须成对校验）
    command: "meson test -v -C <builddir> --timeout-multiplier=10 tls_ca_process_tests.sh tls_d2_process_tests.sh tls_dhcp4_process_tests.sh tls_dhcp6_process_tests.sh"

# test_package 中自带的消费者视角测试
test_package_tests:
  - file: test_kea_shell.py
    description: >-
      以 conanrun 环境运行包内 kea-shell：版本输出（-v/-V）、--cert 无 --key
      的拒绝路径、对本地 stub Kea 端点的真实 HTTP POST 往返（校验请求体、
      User-Agent、Content-Type、Basic 认证头）、端点不可达时的退出码；
      另含 1 个鸿蒙特有案例：校验包内产物上的 OHOS 适配确实生效
      （shebang 为 /usr/bin/env python3 而非构建机绝对路径、/usr/bin/env 存在、
      两个 helper 模块与脚本同目录安装），共 16 项断言
    command: "python3 test_kea_shell.py"

# 用例总数：上游 11 + 68 = 79；test_package 16 项断言（含 1 个鸿蒙特有案例）
upstream_case_count: 79
upstream_passed_case_count: 79
upstream_skipped_case_count: 0
test_package_assertion_count: 16
ohos_specific_case_count: 1
assertion_count: 95
