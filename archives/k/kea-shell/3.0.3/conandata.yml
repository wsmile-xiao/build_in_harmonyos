# conandata.yml — kea-shell 3.0.3 (ISC Kea)
# 官方发布包（ISC ftp）：Kea 3.0.3 起用 Meson 构建，kea-shell 位于 src/bin/shell。
sources:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"

patches:
  - patch_file: "patches/0001-meson.build.patch"
    patch_description: "Normalize the HarmonyOS/OpenHarmony system name to Linux so the Meson platform branch accepts the host and selects the Linux sources and flags"
    patch_type: "portability"
  - patch_file: "patches/0002-src-bin-shell-kea-shell.in.patch"
    patch_description: "Use /usr/bin/env python3 as the kea-shell interpreter so the packaged tool is relocatable instead of embedding the build-time interpreter path (which lives under the builder's home directory)"
    patch_type: "portability"
