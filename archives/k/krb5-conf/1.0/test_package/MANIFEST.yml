name: krb5-conf
version: 1.0
upstream_url: http://web.mit.edu/kerberos/www/

test_manifest:
  - type: script_check
    platform: OHOS
    arch: armv8
    source:
      - "check_krb5_conf.py"
    description: "消费者测试脚本，验证 krb5.conf 在 OHOS aarch64 下存在且内容有效"
    assertions:
      - "os=OHOS"
      - "os.version=6.0"
      - "arch=armv8"
      - "etc/krb5.conf 存在"
      - "内容包含 [libdefaults]"
