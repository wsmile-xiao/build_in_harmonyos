package: kuickshow/0.11.0
homepage: "https://invent.kde.org/graphics/kuickshow"

upstream_check_command: "grep -rn 'add_test\\|enable_testing\\|ECMAddTests' CMakeLists.txt src/CMakeLists.txt — no matches; no tests/, autotests/ directories in the tarball (N=0)"
upstream_test_in_build: false
upstream_test_command: "n/a — upstream registers no test suite (N=0); see upstream_check_command evidence"

upstream_tests: []

test_package_tests:
  - file: main.cpp
    description: "Application-package consumer verification (N=0 compensation): Part 1 (R34) executes the installed kuickshow binary with --version under QT_QPA_PLATFORM=offscreen and asserts the 0.11.0 version string; Part 2 validates the Imlib palette data contract (share/kuickshow/im_palette.pal: 64 lines of \"0xR 0xG 0xB\" hex triplets — the format src/imlib_imlib1.cpp consumes); Part 3 validates the app data contract (share/kuickshow/pics/: the 9 files from pics/CMakeLists.txt); Part 4 validates the desktop integration contract (org.kde.kuickshow.desktop Exec/Type/Icon, 3+ hicolor icons, kuickshow.categories logging categories)"
    command: "./kuickshow_consumer_test"
