software: kuickshow
version: "0.11.0"
status: built
package_type: application
build_system: cmake
created_at: 2026-10-01
build_date: 2026-10-01
language: cpp
description: "KDE KuickShow - a fast and versatile image viewer (Qt6 Widgets + KF6, pure-Qt image backend)"
homepage: https://invent.kde.org/graphics/kuickshow
upstream_source: https://invent.kde.org/graphics/kuickshow/-/archive/v0.11.0/kuickshow-v0.11.0.tar.gz
source_sha256: 8b68f67db4fb97ca76081ebbb5a762b708da950ac849c78e94504560fa4d399e
license: "GPL-2.0-or-later"

dependencies:
  required:
    - qtbase/6.11.1
    - ki18n/6.14.0
    - kiconthemes/6.14.0
    - kio/6.14.0
    - kwindowsystem/6.14.0
    - kxmlgui/6.14.0
    - libxml2/2.15.3
  build:
    - ecm/6.20.0

patches_applied:
  - patches/0001-ohos-trim-printsupport-kdoctools.patch
  - patches/0002-ohos-cxx17-for-kf6-headers.patch
  - patches/0003-ohos-drop-x11-only-kwindowsystem-parts.patch

test_results:
  upstream_suite: "N/A - upstream registers no test suite (N=0, grep evidence in test_package/MANIFEST.yml)"
  consumer_suite: "kuickshow_consumer_test: binary --version + palette contract + app data + desktop entry (see test_package/MANIFEST.yml)"

upstream_tests_count: 0

platform_adaptations:
  - "X11-only kwindowsystem parts dropped (patch 0003): KStartupInfo::appStarted() startup-notification handshake removed (comment, the else branch keeps hide()); Kuick::frameSize() NET WM frame query (KWindowInfo) replaced by the invalid-s_frameSize fallback (zero frame size - same as upstream 'window not shown yet' path). The published kwindowsystem/6.14.0 is built with KWINDOWSYSTEM_X11=OFF and ships neither header"
  - "Qt6 PrintSupport removed from REQUIRED_QT_MODULES and target_link_libraries, src/printing.cpp + printing_page.ui dropped, print actions report unavailability (patch 0001): the published qtbase/6.11.1 package ships no libQt6PrintSupport.so / Qt6PrintSupport cmake config"
  - "KF6 DocTools removed from the REQUIRED component list and doc/ handbook guarded behind KF6DocTools_FOUND + CMAKE_DISABLE_FIND_PACKAGE_KF6DocTools=TRUE (patch 0001): kdoctools is not part of the published KF6 closure (kfourinline 26.04.0 / kgoldrunner 26.04.0 precedent)"
  - "CMAKE_CXX_STANDARD 11 -> 17 (patch 0002): the KF6 6.14 headers require C++17"
  - "USE_IMLIB1=OFF / USE_IMLIB2=OFF: pure-Qt image backend (src/imlib_qt.cpp) - Imlib1/2 would pull in X11/QX11Info"
  - "KF_IGNORE_PLATFORM_CHECK=TRUE (KDE platform detection does not know OHOS)"
  - "KF_SKIP_PO_PROCESSING=ON (translation catalogs skipped; worker msgfmt fails to load its own libintl - audiocd precedent)"
  - "Linker flags -Wl,-z,max-page-size=0x1000: default lld 0x10000 page size can place .dynsym/.dynstr into separate high-address RW LOAD segments which the OHOS musl loader refuses to mmap (audiocd 26.04.3 precedent)"
  - "ECM_MODULE_PATH + conan_cmakedeps_paths.cmake written manually (qtbase/KF6 packages use cmake_find_mode=none)"

known_issues:
  - "kuickshow is a GUI viewer: on a headless machine it needs QT_QPA_PLATFORM=offscreen for the --version smoke; full viewing requires a display/launcher environment"
  - "Printing is unavailable on this platform (Qt6 PrintSupport not published); the Print Image action shows an information dialog instead"
notes: "KF6 6.14.0 baseline line matches the kio/6.14.0 + kxmlgui/6.14.0 binary closure; N=0 compensated by consumer test"
