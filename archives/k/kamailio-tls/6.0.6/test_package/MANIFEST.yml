# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: kamailio-tls/6.0.6
homepage: "https://www.kamailio.org"

# 上游测试命令
# 清点结论（R51 三步法，证据见 notes.md）：
#   - kamailio 6.0.6 源码包顶层为 CMakeLists.txt/ COPYING/ ChangeLog/ INSTALL/ Makefile/
#     README/ cmake/ doc/ etc/ misc/ pkg/ src/ utils/，不含 test/ 目录
#     （utils/kamctl/dbtextdb/tests/ 是 kamctl 工具的 Python 测试数据，与 tls 模块无关）
#   - src/modules/tls/ 内仅源码 + doc/，无测试源文件
#   - src/modules/tls/CMakeLists.txt 无 add_test/enable_testing；顶层与 src/Makefile
#     均无 check 目标（上游 CI 走 pkg/kamailio 的 Smoketest，非源码内自动化套件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无 tls 模块自动化测试套件）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: check_tls.py
    description: "产物结构校验：ELF aarch64/ET_DYN、OpenSSL 静态链入（SSL_CTX_new/SSL_new/TLS_server_method/TLS_client_method/mod_register 符号 + NEEDED 无 libssl/libcrypto）、tls.cfg 随包、licenses/COPYING、无 RPATH/RUNPATH 泄漏"
    command: "python3 check_tls.py"

# 测试断言总数（check_tls.py 中的 check() 调用数，readelf 存在时 13 项）
assertion_count: 13
