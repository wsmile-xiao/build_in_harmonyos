# 版本级 manifest — kamailio-tls 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-tls"
status: published
build_date: "2026-09-25"
build_system: makefile                # kamailio 经典 Makefile 体系（非 autotools/cmake）

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "make cfg include_modules=tls LOCALBASE=<openssl package_folder> SSL_BUILDER= CRYPTO_BUILDER= extra_defs='<platform defs>'"
    - "make modules modules=modules/tls -j1 LOCALBASE=<openssl package_folder> SSL_BUILDER= CRYPTO_BUILDER= extra_defs='<platform defs>'"
  dependencies:
    - openssl/3.5.7
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 上游 6.0.6 源码包原生识别 aarch64-unknown-linux-ohos，未应用任何补丁；
# 平台探测宏经 make 命令行 extra_defs 注入（见 notes.md），无需改源码
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`，否则报 No rule to make target 'cfg-defs'"
  - "tls 模块 Makefile 的 OpenSSL 探测：SSL_BUILDER 非空走自定义命令；否则 CROSS_COMPILE 为空时 pkg-config 探测 libssl，未命中回退 LOCALBASE；CROSS_COMPILE 非空则跳过 pkg-config 直接 LOCALBASE。conan 的 openssl 包（静态库布局）无 pkg-config 元数据，显式传 SSL_BUILDER= CRYPTO_BUILDER=（make 命令行变量优先）钉死 LOCALBASE 回退分支，LOCALBASE 指向 openssl 包目录"
  - "OS=harmonyos 不在 Makefile.defs 的 linux/solaris/freebsd/darwin 任一分支 → HAVE_GETHOSTBYNAME2/HAVE_SCHED_YIELD 等平台探测宏全部缺失，core 头 resolve.h/sched_yield.h 直接 #error。解法：make 命令行 extra_defs 注入 linux 分支等价宏集（-D_GNU_SOURCE -DHAVE_GETHOSTBYNAME2 -DHAVE_SCHED_YIELD -DHAVE_MSG_NOSIGNAL -DHAVE_MSGHDR_MSG_CONTROL -DHAVE_ALLOCA_H -DHAVE_TIMEGM -DHAVE_SCHED_SETSCHEDULER -DHAVE_IP_MREQN），每个宏的符号均已对照 OHOS SDK sysroot 头文件实证存在（musl 语义）"
  - "HAVE_UNION_SEMUN 不注入：musl sys/sem.h 不导出 union semun，kamailio core lock_ops.h 在宏未定义时自带条件定义，注入反而会与 core 兜底逻辑冲突；编译通过即实证"
  - "_GNU_SOURCE 必须注入：gethostbyname2 族在 musl netdb.h 的 _GNU_SOURCE 守卫内"
  - "openssl/3.5.7 包为静态库布局（libssl.a/libcrypto.a），模块 .so 静态链入 OpenSSL，NEEDED 仅 libc.so——避免对系统 libssl 的动态依赖，符合 R26 精神"
  - "打包产物 tls.so 无 RPATH/RUNPATH；debug 字符串内含构建目录绝对路径（仅调试信息，与运行时依赖解析无关）"

