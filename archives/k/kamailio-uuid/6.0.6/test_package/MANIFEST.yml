# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: kamailio-uuid/6.0.6
homepage: "https://www.kamailio.org"

# 上游测试命令
# 清点结论（R51 三步法，证据见 notes.md）：
#   - kamailio 6.0.6 源码包顶层不含 test/ 目录（utils/kamctl/dbtextdb/tests/
#     是 kamctl 工具的 Python 测试数据，与 uuid 模块无关）
#   - src/modules/uuid/ 内仅 Makefile / README / CMakeLists.txt / doc/ / uuid_mod.c，
#     无任何 *test*/*spec* 文件
#   - src/modules/uuid/CMakeLists.txt 无 add_test/enable_testing；顶层 Makefile 与
#     src/Makefile 均无 check 目标（上游 CI 走 pkg/kamailio 的 Smoketest，
#     需运行中的 SIP 场景，非源码内自动化套件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无 uuid 模块自动化测试套件）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: check_uuid.py
    description: "产物结构校验：ELF aarch64/ET_DYN、libuuid 静态链入（uuid_generate/uuid_unparse_lower/uuid_clear/mod_register 符号 + NEEDED 无 libuuid + nm -u 无未解析 uuid_*）、licenses/COPYING 随包、无 RPATH/RUNPATH 泄漏"
    command: "python3 check_uuid.py"

# 测试断言总数（check_uuid.py 中的 check() 调用数，readelf+nm 均存在时 12 项）
assertion_count: 12
