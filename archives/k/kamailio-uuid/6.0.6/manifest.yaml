# 版本级 manifest — kamailio-uuid 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-uuid"
status: published
build_date: "2026-09-25"
build_system: makefile                # kamailio 经典 Makefile 体系（非 autotools/cmake）

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "make cfg include_modules=uuid LOCALBASE=<uuid package_folder> BUILDER= extra_defs='<platform defs>'"
    - "make modules modules=modules/uuid -j1 LOCALBASE=<uuid package_folder> BUILDER= extra_defs='<platform defs>'"
  dependencies:
    - uuid/2.40.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 上游 6.0.6 源码包原生识别 aarch64-unknown-linux-ohos，未应用任何补丁；
# 平台探测宏经 make 命令行 extra_defs 注入（见 notes.md），无需改源码
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`，否则报 No rule to make target 'cfg-defs'"
  - "uuid 模块 Makefile 的 libuuid 探测：BUILDER 非空走自定义命令；否则 CROSS_COMPILE 为空时 pkg-config 探测 uuid，未命中回退 LOCALBASE；CROSS_COMPILE 非空则跳过 pkg-config 直接 LOCALBASE。显式传 BUILDER=（make 命令行变量优先于 Makefile 内部赋值）钉死 LOCALBASE 回退分支，LOCALBASE 指向 conan uuid 包目录，构建机/CI 机器系统 libuuid 无法劫持探测"
  - "OS=harmonyos 不在 Makefile.defs 的 linux/solaris/freebsd/darwin 任一分支 → HAVE_GETHOSTBYNAME2/HAVE_SCHED_YIELD 等平台探测宏全部缺失，core 头 resolve.h/sched_yield.h 直接 #error。解法：make 命令行 extra_defs 注入 linux 分支等价宏集（-D_GNU_SOURCE -DHAVE_GETHOSTBYNAME2 -DHAVE_SCHED_YIELD -DHAVE_MSG_NOSIGNAL -DHAVE_MSGHDR_MSG_CONTROL -DHAVE_ALLOCA_H -DHAVE_TIMEGM -DHAVE_SCHED_SETSCHEDULER -DHAVE_IP_MREQN），每个宏的符号均已对照 OHOS SDK sysroot 头文件实证存在（musl 语义）"
  - "HAVE_UNION_SEMUN 不注入：musl sys/sem.h 不导出 union semun，kamailio core lock_ops.h 在宏未定义时自带条件定义，注入反而会与 core 兜底逻辑冲突；编译通过即实证"
  - "uuid/2.40.1 包为静态库布局（libuuid.a，无 .so），uuid.so 静态链入 libuuid（uuid_generate/uuid_unparse_lower/uuid_clear 为 T 符号），NEEDED 仅 libc.so——无未解析 uuid_* 符号、无 RPATH/RUNPATH"
  - "kamailio uuid 模块仅提供 SIP 配置脚本伪变量 $u(...)（uuid_generate/uuid_generate_random/uuid_generate_time/uuid_generate_time_safe 等模式），无独立可执行产物，故不声明 commands.json（R38）"

# 本配方 0 补丁：探索阶段未改动任何源文件（extra_defs 全部经 make 命令行注入），
# refresh-patch --auto 无候选可生成
