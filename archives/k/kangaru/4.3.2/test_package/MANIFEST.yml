# test_package/MANIFEST.yml — kangaru 4.3.2
# 上游官方测试声明：kangaru 为 CMake header-only 库，测试在 test/CMakeLists.txt
# 注册为 ctest 目标（KANGARU_TEST=ON 时 21 个），测试框架为 Catch2（submodule，
# 由 conan test_requires(catch2/2.13.10-r0) 提供）。
package: kangaru/4.3.2
homepage: "https://github.com/gracicot/kangaru"

# 上游测试通过 ctest 运行（已由 conanfile.py build() 集成 _run_upstream_tests）
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游 21 个 ctest 目标（test/src/*.cpp 共 109 个 TEST_CASE）：
#   17 个常规目标: autocall/autowire/basic/container/default_services/definition/
#                  dependency/invoke/operator/service_map/service_range/single/virtual
#                  + 4 个 noexcept 变体（noexcept.cpp，-fno-exceptions）
#   2 个编译期错误目标: error_not_service_no_forward / error_not_service_has_forward
#   2 个标准变体: generic_lambdas(C++14) / noexcept_invoke(C++17)
# 完整枚举台账见 reports/test-run-ledger.log（109 TEST_CASE / 21 目标，本地全量 21/21 通过）
upstream_tests:
  - file: test/src/container.cpp
    source: kangaru-4.3.2/test/src/container.cpp
    description: "container 服务检索/分叉/重基（Catch2，8 个 TEST_CASE）"
    command: "./container_test"
  - file: test/src/service_map.cpp
    source: kangaru-4.3.2/test/src/service_map.cpp
    description: "service_map 映射与 autowire（Catch2，13 个 TEST_CASE）"
    command: "./service_map_test"

# test_package 自带消费者测试：4 个真实 API 断言
test_package_tests:
  - file: test.cpp
    description: "消费者测试：single_service 生命周期、service<>() 取值、autowire 注入、emplace 去重"
    command: "./test_kangaru"

assertion_count: 109
