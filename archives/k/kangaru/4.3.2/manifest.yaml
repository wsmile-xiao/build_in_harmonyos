# 版本级 manifest — kangaru 4.3.2
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "4.3.2"

# 软件名
software: "kangaru"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag v4.3.2 归档）
  url: "https://github.com/gracicot/kangaru/archive/refs/tags/v4.3.2.tar.gz"

  # 源码校验和（官方 tarball SHA-256）
  sha256: "ed2dec53087fe4c5fbfc7f7ffcb0e963b3e0a7f27699338c4bc5a116193113b8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DKANGARU_TEST=ON"
    - "-DKANGARU_TEST_CXX14=ON"
    - "-DKANGARU_TEST_CXX17=ON"
    - "-DKANGARU_REVERSE_DESTRUCTION=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  # 运行时无第三方依赖（header-only）；测试框架 Catch2 由 recipe test_requires 提供
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本库无需补丁）
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "kangaru 为 header-only CMake 库：add_library INTERFACE + install include/kangaru，无需编译产物"
  - "官方 release tarball 不含 test/third_party/Catch2 submodule（空目录），测试需经 conan test_requires(catch2) 提供 Catch2Config"
  - "上游测试 21 ctest 目标 / 109 TEST_CASE 在 OHOS clang15+libc++17 下全量通过（21/21）"