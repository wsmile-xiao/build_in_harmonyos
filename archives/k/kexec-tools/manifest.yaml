software: kexec-tools
display: "kexec-tools"
description: "Userspace tools for the Linux kernel kexec/kdump mechanism (kexec loader + vmcore-dmesg)"
category: system
homepage: "https://kernel.org/pub/linux/utils/kernel/kexec/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess（HarmonyOS case 分支 + echo/exit 输出）与 config.sub（ohos-linux 三元组 + linux-ohos kernel-os 组合）补丁"
    - "configure 内 umask 077→022：HMDFS 上 `umask 077 && mktemp -d` 创建的目录带 setgid 怪癖（2700）拒所有者写入，config.status 报 Permission denied"
    - "上游 dist tarball 误打包开发机残留 include/config.h（HAVE_LIBZSTD=1），污染 -I 搜索顺序遮蔽新生成的 config.h，补丁删除"
    - "kexec_load/kexec_file_load 系统调用在 OHOS 内核未实现（syscall 探针实测 SIGSYS/Bad system call）——kexec 真实加载/热启动属运行时内核依赖，构建按工具构建可用性验证（如实申报）"
  common_dependencies: []

versions:
  "2.0.32":
    status: built
    build_date: "2026-09-18"
