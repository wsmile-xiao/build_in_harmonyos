# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kexec-tools/2.0.32
homepage: "https://kernel.org/pub/linux/utils/kernel/kexec/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# kexec-tools 上游无 make check / ctest / autotests 测试框架；
# 唯一 test 目标 kexec_test 为 x86-only 调试 payload：
#   kexec_test/Makefile: BUILD_KEXEC_TEST = no; 仅 ARCH=i386/x86_64 时 = yes
#   （arm64 默认形态上游即不注册该测试目标——非 OHOS 专属限制）
upstream_check_command: "make -n check  # => No rule to make target 'check'（上游无测试框架）"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（arm64/aarch64 默认形态：0 个）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "C 侧消费者测试：kexec --version 版本断言 / --help 用法断言 / vmcore-dmesg 错误路径断言（工具构建可用性验证）"
    command: "./test_kexec_tools <bindir>"
  - file: conanfile.py
    description: "Python 侧消费者测试（conan create test 阶段自动执行）：kexec --version/--help/无参用法 + vmcore-dmesg 文件错误路径"
    command: "conan create ... && conan test（test_package 实质执行被测二进制）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
