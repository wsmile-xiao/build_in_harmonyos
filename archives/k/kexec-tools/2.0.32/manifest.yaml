software: kexec-tools
version: 2.0.32
status: built
build_system: autotools
compile_date: 2026-09-18

dependencies:
  required: []
  optional:
    - zlib（系统库，configure 自动检测，--without-zlib 可关）

build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - --prefix=<pkg prefix>
    - （未传 --build/--host/--target，靠 config.guess/config.sub 重锚，R1/E007）

patches_applied:
  - file: 0001-config-config.guess.patch
    purpose: config.guess 添加 HarmonyOS 识别分支（aarch64/arm/x86_64/i686 映射 + echo 三元组 + exit 0）
    lines_changed: 12
    note: "上游 2020-09-19 版 config.guess 为 echo+exit 老式分支模型，补丁需直接 echo+exit 而非仅赋值 GUESS（否则落到末尾 unable to guess）"
  - file: 0002-config-config.sub.patch
    purpose: config.sub 添加 ohos-linux 三元组 + linux-ohos* 加入 kernel-os 合法组合列表
    lines_changed: 4
  - file: 0003-configure-umask-hmdfs.patch
    purpose: configure 内嵌的临时目录创建 `umask 077` 改为 `umask 022`——HMDFS 上该组合经 mktemp -d 创建的目录呈 2700（setgid）状态拒所有者写入，config.status 阶段报 Permission denied
    lines_changed: 2
  - file: 0004-remove-stale-include-config-h.patch
    purpose: 删除上游 dist tarball 误打包的开发机残留 include/config.h（HAVE_LIBZSTD=1/HAVE_LIBZ=1），其位于 -I 搜索路径前端，遮蔽 builddir 新生成的 config.h 导致 zstd.h not found
    lines_changed: 82

compatibility:
  level: medium
  issues:
    - "kexec_load（syscall 104）/kexec_file_load（syscall 281）在 OHOS 内核未实现——syscall 探针实测均触发 SIGSYS（Bad system call, core dumped）"
  notes: "kexec 二进制构建/加载/选项解析全通（--version/--help/用法路径），真实内核加载动作属运行时内核依赖；vmcore-dmesg 纯文件解析不受影响"

test_results:
  type: manual+test_package
  upstream_registered_tests: 0
  upstream_note: "上游无 make check/ctest 测试框架；唯一 test 目标 kexec_test 为 x86-only 调试 payload（kexec_test/Makefile: BUILD_KEXEC_TEST=no unless ARCH=i386/x86_64）——arm64 默认形态上游即不注册，非 OHOS 专属"
  passed: 4
  failed: 0
  note: |
    工具构建可用性验证（本地实测，HarmonyOS aarch64）：
    kexec --version → "kexec-tools 2.0.32" PASS
    kexec --help    → 用法文本正常 PASS
    kexec（无参数）  → "No kernel specified" + 用法 PASS
    vmcore-dmesg <不存在文件> → "Cannot open ...: No such file or directory" PASS（ELF 加载/链接/libc 正常）
    syscall 探针（C 直调 syscall(104)/(281)）→ SIGSYS，证明内核未实现（运行时限制，如实申报）

knowledge_gained:
  - "kexec-tools 的 config.guess 位于 config/ 子目录（非 build-aux/），补丁路径不同"
  - "上游 2020-09-19 版 config.guess 是 echo+exit 老式分支模型：HarmonyOS 分支必须 echo 三元组并 exit 0，仅赋值 GUESS 变量不生效（新版 config.guess 才是统一 GUESS 输出模型）"
  - "config.sub 除 ohos-linux 三元组外，还须把 linux-ohos* 加入末尾 kernel-$os 合法组合列表（linux-gnu*|linux-android*|... 那行），否则报 Invalid configuration: Kernel 'linux' not known to work with OS 'ohos'"
  - "HMDFS 新坑：`(umask 077 && mktemp -d ...)` 创建的目录呈 2700（setgid）状态且拒所有者写入（chmod 修正也不生效）；strace 6.19 先例（configure 内 umask 077→022 替换）对 kexec-tools 同样有效且更干净"
  - "kexec-tools dist tarball 误打包开发机 include/config.h（HAVE_LIBZSTD=1），-I 顺序在 builddir config.h 之前导致 zstd.h not found——删除即可（config.h 是 configure 产物不该进 dist）"
  - "OHOS 内核无 kexec_load/kexec_file_load syscall（SIGSYS 实测）；kexec 工具本体构建验证照常，真实加载动作属运行时内核依赖"

references:
  - https://kernel.org/pub/linux/utils/kernel/kexec/
  - https://git.kernel.org/pub/scm/utils/kernel/kexec/kexec-tools.git

patch_generation:
  method: orig/work diff（tarball 原始解压 vs 修改后源码树）
  generated_at: '2026-09-18T15:37'
  patches_count: 4
