# conandata.yml — kio-kwallet 6.28.0
#
# The platform dispatch entry names this package "kio-kwallet"; it builds the
# KDE Frameworks 6 KWallet (kwallet) API library — the kwallet member of the
# KIO dependency chain (kio's .kde-ci.yml lists frameworks/kwallet for Linux).
# The repository already carries the API-only kwallet/6.18.0 baseline (built
# for libkgapi); this entry delivers the 6.28.0 upgrade under the dispatch
# name, keeping the same KF6::Wallet API-only scope.
sources:
  url: "https://download.kde.org/stable/frameworks/6.28/kwallet-6.28.0.tar.xz"
  sha256: "e21130c86ffa0be49065648f4e753d63d3d786fab876f511d9d09da16480f691"

patches:
  "6.28.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Relax KF_DEP_VERSION to 6.18.0 (published ohpcd daemon-scope KF6 generation) and align find_package(ECM) with the published ohpcd 6.26 baseline; drop the ki18n_install(po) call (no msgfmt toolchain, translations not part of the deliverable)"
      patch_type: "conan"
    - patch_file: "patches/0002-src-api-KWallet-CMakeLists.txt.patch"
      patch_description: "Drop the VERSION/SOVERSION target properties (E018: OHOS sandbox denies symlink(2) for the conan process tree, so cmake_symlink_library cannot create the versioned chain); the recipe keeps the upstream DT_SONAME and materializes the soname name as a copy"
      patch_type: "conan"
