# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: kamailio-cpl/6.0.6
homepage: "https://www.kamailio.org"

# 上游测试命令
# 清点结论（R51 三步法，证据见 notes.md）：
#   - kamailio 6.0.6 源码发布包（kamailio-6.0.6_src.tar.gz）不含 test/ 目录：
#     顶层为 CMakeLists.txt/ COPYING/ ChangeLog/ INSTALL/ Makefile/ README/ cmake/
#     doc/ etc/ misc/ pkg/ src/ utils/。test/ 仅存在于上游 git 仓库，不随发布包分发
#   - src/modules/cplc/ 内仅模块源码（cplc.c/cpl_parser.c/cpl_db.c/cpl_run.c/...）
#     与 cpl-06.dtd/doc/，无测试源文件，Makefile 无 check/test 目标
#   - 上游 git 仓库 test/unit/ 下确有 CPL 脚本夹具 cpl_test.xml / cpl_ignore.xml
#     （2026-09-28 经上游仓库 tree 核），但 test/ 为整体 kamailio 的集成测试
#     套件：需完整 kamailio 核心二进制 + DB 后端 + 外部测试框架，且不在发布包内，
#     本包构建/CI 环境（仅构建模块 .so）无法运行
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（cplc 模块上游无随包自动化测试套件）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: check_cplc.py
    description: "产物结构/平台合规：ELF64 aarch64/ET_DYN、模块契约符号 exports 定义、NEEDED 含 libxml2 共享库与 musl libc.so、无 RPATH/RUNPATH 泄漏、UND 含 kamailio core 契约符号（模块特征）、随包 cpl-06.dtd 与 licenses/COPYING、模块内嵌导出命令/参数契约名"
    command: "python3 check_cplc.py"
  - file: check_cplc_runtime.py
    description: "运行时消费者验证（OHOS aarch64 原生执行）：注入 kamailio core 符号桩后真实 dlopen cplc.so 并解析模块契约 exports.name=cplc；再以模块 cpl_parser.c 同一 libxml2 API 路径（xmlParseDTD/xmlParseDoc/xmlValidateDtd）校验随包 cpl-06.dtd —— 合法 CPL 脚本通过、非法脚本被拒（负向对照）"
    command: "python3 check_cplc_runtime.py <cplc.so> <cpl-06.dtd> <valid.xml> <invalid.xml> <CC>"

# 测试断言总数（check_cplc.py 12 项 + check_cplc_runtime.py 7 项）
assertion_count: 19
