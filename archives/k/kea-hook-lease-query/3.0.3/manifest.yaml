  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================

artifacts:
  - "lib/kea/hooks/libdhcp_lease_query.so"
  - "lib/libkea-*.so* (hook 运行时依赖闭包，20 个 kea 库)"

# ============================================================
# 上游测试（build() 内真实执行）
# ============================================================

upstream_tests:
  command: "meson test -v -C <builddir> dhcp-lease-query-tests dhcp-lease-query-libloadtests"
  suites_run: 2
  cases_run: 160
  cases_passed: 160
  cases_failed: 0
  cases_skipped: 0
  cases_unregistered: 112
  cases_unregistered_reason: "112 个用例位于 HAVE_MYSQL/HAVE_PGSQL 条件块内，默认配置不注册；其中 56 个 PgSQL 用例可在 -o with_postgresql=True 下注册并执行，56 个 MySQL 用例因制品仓无 mysqld/mariadbd 服务端二进制且 mysql-client 的 openssl 版本冲突无法运行"
  optional_backend:
    option: "with_postgresql"
    default: false
    dependency: "libpq/18.6"
    command: "conan create . -pr:h=<ohos-aarch64> -pr:b=<ohos-aarch64> -o kea-hook-lease-query/*:with_postgresql=True"
    cases_run: 216
    cases_passed: 216
    cases_failed: 0
    cases_skipped: 0
    log: "reports/conan-create-pgsql.log"

# ============================================================
# 鸿蒙特有测试（test_package，1 个用例）
# ============================================================

ohos_specific_tests:
  count: 1
  entries:
    - "test_package/test_ohos_platform.c → test_ohos_platform"
  command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_lease_query.so"
  checks:
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so）"
    - "OHOS 加载器 dlopen(RTLD_NOW|RTLD_LOCAL) 可解析插件及其 20 个 Kea 运行库"
  cases_run: 1
  cases_passed: 1
  cases_failed: 0

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson.build.patch"
  - "0002-src-lib-dhcp-iface_mgr_linux.cc.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Meson 报告 OHOS 为 system='harmonyos'，Kea 的 build_machine.system() 白名单不含它：需在顶层归一化为 linux 才会选中 Linux 源码分支（iface_mgr_linux.cc / pkt_filter_lpf.cc）"
  - "OHOS sysroot 的 linux/socket.h（bionic 派生）定义 struct sockaddr_storage，与 musl sys/socket.h 冲突：用 define-guard 重命名内核侧定义（__linux__ && !__GLIBC__ 守卫）"
  - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core sp_thread_sleep.hpp 依赖它：定义 BOOST_SP_NO_PTHREAD_SETCANCELSTATE（boost 官方逃生宏）"
  - "Conan MesonToolchain 默认只设 pkg_config_path=generators_folder，需同时使用 PkgConfigDeps 生成依赖 .pc，meson 才能解析 boost/log4cplus/openssl/gtest"
  - "Meson 的 cpp.run() 特性探针在 native 构建下会真实执行，host 共享依赖（log4cplus）必须通过 LD_LIBRARY_PATH 在配置期可见"
  - "CI worker 的 PATH 不含 llvm-ar/llvm-ranlib，meson project() 探测静态链接器会失败：从 tools.build:compiler_executables 的编译器路径推导同目录工具写入 machine file"
  - "制品仓 boost/1.85.0 无 libboost_system，需 meson >= 1.10 的 header-only 模块回退；meson 版本必须 >= 1.10"

