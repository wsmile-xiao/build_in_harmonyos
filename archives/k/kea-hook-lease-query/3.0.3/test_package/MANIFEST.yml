# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-lease-query/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的两个 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> dhcp-lease-query-tests dhcp-lease-query-libloadtests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-lease-query-tests dhcp-lease-query-libloadtests"

# 上游实际运行的测试程序（本次适配实测：153 + 7 = 160 个用例全部通过）
upstream_tests:
  - file: dhcp-lease-query-tests
    source: src/hooks/dhcp/lease_query/tests/
    description: >-
      13 个 gtest 单元文件覆盖 lease-query hook；本配置注册 153 个用例
      （源码另有 112 个用例位于 HAVE_MYSQL/HAVE_PGSQL 条件块内，可选 DB 后端关闭时不注册）
    command: "./dhcp-lease-query-tests"
  - file: dhcp-lease-query-libloadtests
    source: src/hooks/dhcp/lease_query/libloadtests/
    description: "7 个 gtest 用例，校验 libdhcp_lease_query.so 可被 Kea hook 框架加载/卸载"
    command: "./dhcp-lease-query-libloadtests"

# test_package 中自带的测试（1 项消费者契约 + 1 项鸿蒙特有）
test_package_tests:
  - file: test_lease_query_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload 契约符号与 hook ABI 版本"
    command: "./test_lease_query_hook <package>/lib/kea/hooks/libdhcp_lease_query.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有（平台 ABI）：校验包内 libdhcp_lease_query.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc libc.so.6、
      链接 libc++_shared.so）并验证 OHOS 加载器可 dlopen(RTLD_NOW) 解析插件及其
      20 个 Kea 运行时库闭包
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_lease_query.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（本次适配实测：1 个，1/1 通过）
ohos_specific_tests:
  count: 1
  entries:
    - test_ohos_platform
  command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_lease_query.so"
  result: "1/1 passed"

# 测试用例总数（本次实测执行的上游用例数：153 + 7）
assertion_count: 160
