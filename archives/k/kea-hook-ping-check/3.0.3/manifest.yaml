# 版本级 manifest — kea-hook-ping-check 3.0.3
# 文件位置: archives/k/kea-hook-ping-check/3.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.3"
software: "kea-hook-ping-check"

# 编译状态: published | built | failed | archived
status: published

build_date: "2026-09-27"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================

artifacts:
  - "lib/kea/hooks/libdhcp_ping_check.so"
  - "lib/libkea-*.so* (hook 运行时依赖闭包，20 个 kea 库)"

# ============================================================
# 上游测试（build() 内真实执行）
# ============================================================

upstream_tests:
  command: "meson test -v -C <builddir> dhcp-ping-check-tests dhcp-ping-check-libloadtests"
  suites_run: 2
  # 源码 TEST/TEST_F 宏计数：tests/ 90（Root 组 48 + 常规 42）+ libloadtests/ 4
  cases_in_source: 94
  root_cases: 48
  root_cases_detail: "RootICMPSocketTest 2 + RootPingCheckMgr 2 + RootPingChannelTest 18 + RootPingCheckMgrTest 26：真实 SOCK_RAW ICMP 套接字与 127.0.0.1 回显往返，上游 CI 以 root 运行；OHOS 沙箱下 gtest 全部 SKIPPED（跳过计 48）"
  # 真机实测（2026-09-27 真机 conan create，meson test 实跑）：
  # dhcp-ping-check-tests 90 例中 PASSED 42 + SKIPPED 48（全部为 Root 组），
  # dhcp-ping-check-libloadtests 4 例全 PASSED，两个套件 FAILED = 0。
  cases_run: 94
  cases_passed: 46
  cases_failed: 0
  cases_skipped: 48
  cases_unregistered: 0
  cases_unregistered_reason: "无：源码 TEST/TEST_F 宏 94 个（90 + 4），本配置全部注册"

# ============================================================
# 鸿蒙特有测试（test_package，3 个用例）
# ============================================================

ohos_specific_tests:
  count: 3
  entries:
    - "test_package/test_ping_check_hook.c → test_ping_check_hook（hook 加载与契约）"
    - "test_package/test_ohos_platform.c → test_ohos_platform（平台 ABI）"
    - "test_package/test_ohos_runtime.c → test_ohos_runtime（运行时闭包）"
  command: "./test_ping_check_hook <so> && ./test_ohos_platform <so> && ./test_ohos_runtime <so>"
  checks:
    - "dlopen(RTLD_NOW) 加载 hook，KEA_HOOKS_VERSION == 30003，load/unload 契约符号可解析"
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so），且不含 GNU libstdc++ 命名"
    - "OHOS 加载器 dlopen(RTLD_NOW|RTLD_LOCAL) 可解析插件及其 Kea 运行库闭包（实测 DT_NEEDED 11 项）"
    - "包内 Kea 运行时库（lib/libkea-*.so*）在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 成功（实测 40/40）"
    - "闭包驻留后 hook 仍可加载，load/unload 契约符号可在运行时解析"
  cases_run: 3
  cases_passed: 3
  cases_failed: 0

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson.build.patch"
  - "0002-src-lib-dhcp-iface_mgr_linux.cc.patch"
  - "0003-meson.build.patch"
  - "0004-src-lib-process-cfgrpt-meson.build.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Meson 报告 OHOS 为 system='harmonyos'，Kea 的 build_machine.system() 白名单不含它：需在顶层归一化为 linux 才会选中 Linux 源码分支（iface_mgr_linux.cc / pkt_filter_lpf.cc）"
  - "OHOS sysroot 的 linux/socket.h（bionic 派生）定义 struct sockaddr_storage，与 musl sys/socket.h 冲突：用 define-guard 重命名内核侧定义（__linux__ && !__GLIBC__ 守卫）"
  - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core sp_thread_sleep.hpp 依赖它：定义 BOOST_SP_NO_PTHREAD_SETCANCELSTATE（boost 官方逃生宏）"
  - "OHOS 上 CPython subprocess 走 posix_spawn，不按 PATH 解析可执行名：裸名 'llvm-ar'（来自宿主 AR 环境变量）执行报 ENOENT，即使 which 能找到——须在 machine file 注入绝对路径"
  - "Conan MesonToolchain 默认只设 pkg_config_path=generators_folder，需同时使用 PkgConfigDeps 生成依赖 .pc，meson 才能解析 boost/log4cplus/openssl/gtest"
  - "Meson 的 cpp.run() 特性探针在 native 构建下会真实执行，host 共享依赖（log4cplus）必须通过 LD_LIBRARY_PATH 在配置期可见（缺失时探针返回 127，上游 meson.build:824 报 Unknown variable 'log4cplus'）"
  - "制品仓 boost/1.85.0 无 libboost_system，需 meson >= 1.10 的 header-only 模块回退；meson 版本必须 >= 1.10"
  - "ping-check 插件的 IcmpSocket 为 header-only 模板（icmp_socket.h），底层是 boost::asio::ip::icmp::socket（Linux 上即 socket(AF_INET, SOCK_RAW, IPPROTO_ICMP) 原始套接字）：上游 46 个 Root 用例依赖 CAP_NET_RAW，OHOS 沙箱下处置见 notes.md"
  - "OHOS 内核拒绝 shebang 脚本 execve（与可执行位无关）：conan 的 meson 包 bin/meson 是 shell 包装脚本，必须 sh '<meson 包>/bin/meson' 调用（Error 126 实测）；meson 的 run_command 数组首参语法（['/bin/sh', 脚本] / [python3, 脚本]）真机验证通过（RC_SH_OK/RC_PY_OK）"
  - "Kea configure 期直接执行自带脚本：scripts/env.sh 探包类型（meson.build:587/592，Error 13 实测）、scripts/grabber.py 做文件列表（src/share/api、yang、doc/sphinx 等多处）——补丁把脚本变量重定义为解释器前缀数组，所有调用点零改动"
  - "configure 期还有两处 configure_file(command:) 直接执行脚本：生成的 config-report.sh（顶层 meson.build:1025）与 tools/mk_cfgrpt.sh（src/lib/process/cfgrpt/meson.build）——同样经 /bin/sh 前缀修复（补丁 0003 hunk 2 + 0004）"
  - "OHOS /storage 沙箱拒绝创建符号链接（ln -s → EPERM）：meson 以 version: 'N.M.K' 构建共享库时只以符号链接发布 soname 名，链接名文件在 OHOS 上根本不存在，加载器按 NEEDED 名查找全部落空（'Error loading shared library libkea-X.so.N'）。build() 在 compile 后以复制方式物化 soname 名（_materialize_sonames，幂等），meson test 与 package() 遍历都能吃到"
  - "真机曾出现 package 产物落盘为 0 字节的瞬时问题（/storage 写回异常）：package() 收尾增加空产物复核，0 字节的 Kea 库从构建树重拷（自愈 + WARNING 日志），test_package 的运行时闭包测试（40 个库逐个 dlopen）兜底拦截回归"
  - "真机 meson test 实测：dhcp-ping-check-tests 90 例 = PASSED 42 + SKIPPED 48（48 个 Root 组用例在无 CAP_NET_RAW 的 OHOS 沙箱下全部自动 SKIP，无 FAILED）；dhcp-ping-check-libloadtests 4 例全 PASSED——上游 Root 组在 OHOS 上的行为是跳过而非失败，测试面结论可复用于家族配方"

patch_generation:
  method: family-template
  source_family: kea-hook-limits/3.0.3
  note: "补丁 0001/0002 作用于 Kea 3.0.3 顶层 meson.build 与 src/lib/dhcp/iface_mgr_linux.cc，与家族模板 kea-hook-limits 逐字节一致（同一上游源码树、同一平台差异）；补丁 0003/0004 为本配方适配中新增：configure 期脚本（env.sh/grabber.py/cd-and-run.sh/config-report.sh/mk_cfgrpt.sh）在 OHOS 内核下需经解释器前缀调用——同一上游树的家族配方若重跑 configure 亦会命中，可回移植"
  patches_count: 4

