# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-ping-check/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的两个 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> dhcp-ping-check-tests dhcp-ping-check-libloadtests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-ping-check-tests dhcp-ping-check-libloadtests"

# 上游实际运行的测试程序（源码 TEST/TEST_F 宏计数：90 + 4 = 94）
upstream_tests:
  - file: dhcp-ping-check-tests
    source: src/hooks/dhcp/ping_check/tests/
    description: >-
      ping-check hook 单元测试（config_cache / ICMP 消息编解码 / PingChannel
      状态机 / PingCheckMgr 流程 / PingContext 存储），本配置注册 90 个用例
      （与源码 TEST/TEST_F 宏数一致，无未注册用例）。其中
      RootICMPSocketTest(2)/RootPingChannelTest(18)/RootPingCheckMgrTest(26)
      共 46 例为上游标记的 root 用例（真实 SOCK_RAW ICMP 往返），需按目标
      平台沙箱能力处置，见版本级 notes.md
    command: "./dhcp-ping-check-tests"
  - file: dhcp-ping-check-libload-tests
    source: src/hooks/dhcp/ping_check/libloadtests/
    description: "4 个 gtest 用例，校验 libdhcp_ping_check.so 可被 Kea hook 框架加载/卸载（meson 注册的套件名 dhcp-ping-check-libloadtests）"
    command: "./dhcp-ping-check-libload-tests"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_ping_check_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload 契约符号与 hook ABI 版本"
    command: "./test_ping_check_hook <package>/lib/kea/hooks/libdhcp_ping_check.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 libdhcp_ping_check.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc libc.so.6、
      链接 libc++_shared.so）并验证 OHOS 加载器可 dlopen(RTLD_NOW) 解析
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_ping_check.so"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 包内
      20 个 Kea 运行时库（lib/libkea-*.so*），校验完整 NEEDED 闭包可解析、
      闭包驻留后 hook 仍可加载且 load/unload 契约符号可解析
    command: "./test_ohos_runtime <package>/lib/kea/hooks/libdhcp_ping_check.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（test_package 内，实测结果见版本级 notes.md）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <so> && ./test_ohos_runtime <so>"

# 上游测试用例宏总数（本次适配源码计数：90 + 4；实际注册执行数见版本级 manifest）
assertion_count: 94
