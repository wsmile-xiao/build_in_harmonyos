software: kconfig
display: "KConfig"
description: "KDE Frameworks 6 configuration system (KConfig/KConfigGroup/KConfig XT)"
category: library
homepage: "https://invent.kde.org/frameworks/kconfig"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "KCONFIG_USE_QML=OFF and USE_DBUS=OFF keep the Akonadi KF baseline minimal"
    - "ecm_install_po_files_as_qm(poqm) patched out: Qt6LinguistTools not published to ohpcd"
    - "ECM 6.26+ KDEInstallDirs6 runs qtpaths at configure time; sandbox LD_LIBRARY_PATH must have /system/lib64 prepended so the compatible libc++_shared.so is found"
    - "kconfigtest target needs C++20 chrono calendar types (6.26.0+) - skipped at build time on HarmonyOS (clang 15/libc++/cppstd=17)"
  common_dependencies:
    - qtbase
    - ecm

versions:
  "6.26.0":
    status: built
    build_date: "2026-09-03"
    conan_ref: "kconfig/6.26.0"
  "6.18.0":
    status: built
    build_date: "2026-08-18"
    conan_ref: "kconfig/6.18.0"
  "6.14.0":
    status: built
    build_date: "2026-08-10"
    conan_ref: "kconfig/6.14.0"
