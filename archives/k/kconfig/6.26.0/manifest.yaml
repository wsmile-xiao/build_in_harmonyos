knowledge_gained:
  - "kconfig 6.26.0 keeps Qt6Xml/Qt6Gui as required Qt components and now requires Qt6CorePrivate (Qt >= 6.10) for the new qiodevicetest/parsetest autotests; both are satisfied by qtbase/6.11.1."
  - "kconfig 6.26.0 raises cmake_minimum_required from 3.16 to 3.29 and Qt minimum from 6.7 to 6.9; qtbase 6.11.1 satisfies the Qt requirement."
  - "ECM 6.26.0 derives test name prefixes from the ECM_TEST_NAME_PREFIX variable (strategy since ECM 6.22), producing the same kconfigcore-/kconfiggui-/kconfigcompiler- prefixes as the 6.18.0 explicit NAME_PREFIX."
  - "The 6.18.0 OHOS patch required regeneration: upstream moved the ecm_install_po_files_as_qm line (BUILD_FUZZERS block added above it) and reworked the kconfig_compiler_test() function so the old hunks no longer apply. The semantic changes (disable poqm, make Qt6::Qml link + QML_REGISTRATION tests conditional on KCONFIG_USE_QML) are identical."
  - "KCONFIG_USE_QML=OFF and USE_DBUS=OFF keep the Akonadi KF baseline minimal; QML and DBus integration can be enabled later if a package explicitly needs them."
  - "ecm_install_po_files_as_qm(poqm) still requires Qt6LinguistTools, so the OHOS recipe patches it out."
  - "Upstream CTest is viable with a small OHOS exclusion set for locale/config-path and unavailable QML/DBus-adjacent assumptions."
