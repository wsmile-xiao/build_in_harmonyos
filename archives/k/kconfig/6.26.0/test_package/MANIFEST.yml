# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kconfig/6.26.0.

package: kconfig/6.26.0
homepage: https://invent.kde.org/frameworks/kconfig

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E \"^(kconfigcore-kconfigtest|kconfigcore-kdesktopfiletest|kconfigcore-test_kconf_update|kconfiggui-kstandardshortcutwatchertest|kconfigcompiler-basic-test)$\""

upstream_tests:
  - file: autotests/
    source: kconfig-6.26.0/autotests/
    description: "KConfig upstream CTest/autotests suite"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON; excludes five OHOS-incompatible tests"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke writes and reads a KConfigGroup entry through KF6::ConfigCore."
    command: "conan create (test_package builds and runs test_kconfig)"

assertion_count: 1
