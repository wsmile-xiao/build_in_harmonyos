# 软件级 manifest
# 文件位置: archives/k/kerneltop/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（CI 不读取本文件，用于人读索引与交叉校验）

# ============================================================
# 必须字段
# ============================================================

software: kerneltop

display: "kerneltop"

description: "以 top 风格整屏显示内核函数命中次数的命令行工具，读取 /proc/profile 并用 System.map 还原符号"

category: system

homepage: "https://www.infradead.org/~rdunlap/src/"

license: GPL-2.0-or-later

# 裸 makefile，无 configure/cmake/meson
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "makefile 里 CC=gcc 与 CCFLAGS=-s 都是普通赋值（没有 override 指令），交叉编译与去 strip 都靠 make 命令行变量覆盖，不需要改源码"
    - "else 分支的 -s 是链接期 strip；OHOS 内核校验 SDK 链期写入的 .codesign 段，链后再改写 ELF（llvm-strip / objcopy）会让产物 exec 报 Operation not permitted（rc=126），而 -s 由驱动在签名前完成、实测仍可执行，两者要分开看"
    - "没有 install 目标且 OHOS 无 install 命令，package() 自己 copy 产物；上游 tar 包不含 man page 与文档件，因此包内只有一个可执行文件"
    - "界面是 vidsupport.h 里的纯 ANSI 转义序列写 stdout，不需要 controlling tty；配合 -m/-p 指向普通文件即可在非特权环境跑通完整的解析-差分-排序-打印链"
    - "上游无长选项：--version 与 --help 会落进 getopt 的 default 分支打印 usage 并返回 1，取版本要用 -V"
    - "makefile 文件名是全小写 makefile（不是 Makefile），GNU make 会自动发现，但 make 必须在 source_folder 执行（E392 第三坑）"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.92":
    status: built
    build_date: "2026-09-26"
    conan_ref: "kerneltop/0.92"
