# 版本级 manifest
# 文件位置: archives/k/kerneltop/0.92/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.92"

# 软件名
software: "kerneltop"

# 编译状态
# published | built | failed | archived（§3 四态全部以 conan_verify PASS 为前提）
# W3 未跑绿期间本字段取 pending_ci（仓内 16+ 件先例同款写法，CI 脚本不读该
# 字段）；conan-verify 三处同判为绿之后落回真值 built，未 upload 故不是 published。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL —— 作者 Randy Dunlap 的官方发布目录（实测 HTTP 200）
  url: "https://www.infradead.org/~rdunlap/src/kerneltop-0.92.tar.gz"

  # 源码校验和（本机自算，与 Debian sid 的 .orig 逐字相等）
  sha256: "a18b048dd06409e3e9b085863b9c115b05011f792f6f3b47f90260f749a3d6aa"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表（裸 makefile，无 configure 阶段）
  configure_options: []

  # 编译依赖列表（格式: name/version）—— 本包零外部依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表：源码一字未改，交叉编译全部靠 make 命令行变量覆盖
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "裸 makefile 若把 CCFLAGS 写成普通赋值（无 override 指令），make 命令行变量会赢，可用 CCFLAGS= 精确摘掉链接期 -s 而不动 -O2/-Wall 语义"
  - "OHOS 上判 strip 是否破坏产物的正确对照是「同一枚 ELF 改前/改后」：链后 llvm-strip 使 exec 报 rc=126（.codesign 失效），而链接期 -s 由 SDK 在 strip 之后签名、实测仍可执行"
  - "kerneltop 的界面是 vidsupport.h 里纯 ANSI 转义序列写 stdout，不需要 controlling tty，因此 /proc/profile 之外整条计算与打印链可在非特权、无终端环境真实跑通"
