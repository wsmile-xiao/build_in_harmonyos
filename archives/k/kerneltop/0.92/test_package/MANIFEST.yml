# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# kerneltop 0.92 上游没有任何测试：官方 release tar 包内只有 3 个文件
# (kerneltop.c, makefile, vidsupport.h)，makefile 只有 all 与 clean 两个
# 目标，没有 check/test 目标，也没有 tests/ 目录或 CI 配置。
# 实测证据（同机 GNU Make 4.4.1）：
#   $ make -n check   -> make: *** No rule to make target 'check'.  Stop.   rc=2
#   $ make -n test    -> make: *** No rule to make target 'test'.  Stop.    rc=2
# 上游静态测试用例合计 = 0，因此下方 test_package_tests 全部是适配后补全的
# 消费者级用例。

package: kerneltop/0.92
homepage: "https://www.infradead.org/~rdunlap/src/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无 check/test 目标，故无可运行的测试命令。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 上游 0 个用例，以下 10 项全部为适配后补全，且每项都真正 exec 打包后的 ELF。
test_package_tests:
  - file: test_package/test_kerneltop.sh
    description: "kerneltop -V prints 'Version 0.92' on stdout and exits 0"
    command: "./test_kerneltop.sh (case 1: version flag)"

  - file: test_package/test_kerneltop.sh
    description: "kerneltop -Z (unknown option) prints the option table on stderr and exits non-zero"
    command: "./test_kerneltop.sh (case 2: unknown option)"

  - file: test_package/test_kerneltop.sh
    description: "kerneltop -m with an absent map file reports ENOENT and exits non-zero"
    command: "./test_kerneltop.sh (case 3: missing map file)"

  - file: test_package/test_kerneltop.sh
    description: "a malformed map line is rejected with 'wrong map line'"
    command: "./test_kerneltop.sh (case 4: malformed map line)"

  - file: test_package/test_kerneltop.sh
    description: "a map without a _stext symbol is rejected"
    command: "./test_kerneltop.sh (case 5: missing _stext)"

  - file: test_package/test_kerneltop.sh
    description: "descending address order inside the text range is rejected"
    command: "./test_kerneltop.sh (case 6: descending map)"

  - file: test_package/test_kerneltop.sh
    description: "sorted pass over a synthetic System.map and profile emits func_gamma=10, func_beta=2, _stext=1, total 13"
    command: "./test_kerneltop.sh (case 7: sorted histogram pass)"

  - file: test_package/test_kerneltop.sh
    description: "-u emits the same ticks in table order, proving case 7 really sorted them"
    command: "./test_kerneltop.sh (case 8: unsorted differential check)"

  - file: test_package/test_kerneltop.sh
    description: "-t 5 keeps only the 10-tick symbol and drops the 1- and 2-tick ones"
    command: "./test_kerneltop.sh (case 9: tick threshold)"

  - file: test_package/test_kerneltop.sh
    description: "a valid map plus an absent profile reaches profile_read and prints the profiling hint"
    command: "./test_kerneltop.sh (case 10: profile_read path)"

# 测试断言总数 (退出码断言 + 输出文本断言逐条计)
# case 1..10 分别为 2+3+2+2+2+2+4+2+2+2 = 23 个断言点
assertion_count: 23
