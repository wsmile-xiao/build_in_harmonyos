# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: ki18n/6.26.0
homepage: "https://invent.kde.org/frameworks/ki18n"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# ki18n 为 CMake 项目，上游测试用 ctest 注册；设备端 BUILD_TESTING=OFF 跳过
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成：OHOS 设备端无法运行依赖翻译文件/locale/qttranslations 的上游
# 用例（约 11 个 CTest 目标），沿用 6.14.0 既定策略 BUILD_TESTING=OFF
upstream_test_in_build: false
upstream_test_command: ""

# 实际执行的测试程序
upstream_tests:
  - file: test.cpp
    source: ki18n-6.26.0/test.cpp
    description: "KLocalizedString 格式化 API 消费者测试（ki18n(\"hello %1\").subs(\"world\").toString()）"
    command: "./test_ki18n"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "KLocalizedString 格式化 API 消费者测试（ki18n(\"hello %1\").subs(\"world\").toString()）"
    command: "./test_ki18n"

# 测试断言总数 (近似值, 用于质量评估)
# test.cpp 实际断言数：正断言 1（subs 格式化结果正确）+ 负断言 1（缺少
# 替换参数被拒绝，%1 占位符保留）＝ 2
assertion_count: 2
