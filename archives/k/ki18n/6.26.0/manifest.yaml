# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.26.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.26.0"

# 软件名
software: ki18n

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-19"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.kde.org/stable/frameworks/6.26/ki18n-6.26.0.tar.xz"

  # 源码校验和
  sha256: "484aad486bfafef6c86d8d5b26529258e67c74c96250c1ac212ddf568448c7c0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py generate() 中 tc.variables 一致；
  # CMAKE_BUILD_TYPE / CMAKE_SYSTEM_NAME 由 Conan profile/toolchain 处理，不在此列出）
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=OFF"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DBUILD_WITH_QML=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - qtbase/6.11.1
    - gettext/0.22.5
    - ecm/6.26.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-cmake-KF6I18nMacros.cmake.in.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
