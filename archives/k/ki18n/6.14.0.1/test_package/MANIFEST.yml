# test_package/MANIFEST.yml
# Upstream and consumer test declaration for ki18n/6.14.0.1.

package: ki18n/6.14.0.1
homepage: https://invent.kde.org/frameworks/ki18n

revision_note: >
  6.14.0.1 enables BUILD_WITH_QML=ON (qtdeclarative/6.11.1 is published; the
  6.14.0 assumption "Qt6 Qml not published" is stale). Ships the QML add-on
  libKF6I18nQml.so (KLocalizedQmlContext) required by KF6NewStuff
  (task contrib-3768) as a dependency item.

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E \"^(kcatalogtest|kcountrytest|kcountrysubdivisiontest|ktimezonetest)$\""

upstream_tests:
  - file: autotests/
    source: ki18n-6.14.0/autotests/
    description: "KI18n upstream CTest suite — 12 executed with BUILD_WITH_QML=ON (incl. the NEW ki18ndeclarativetest QML engine test), 4 locale-data tests excluded (need iso-codes JSON on device)"
    command: "ctest --output-on-failure"
    status: "12/12 PASS (ki18ndeclarativetest fixed via QML2_IMPORT_PATH wiring to qtdeclarative <pkg>/qml in recipe runtime env)"

test_package_tests:
  - file: test_package/test.cpp
    description: >
      Consumer test, 3 layers / 6 checks: (1) core ki18n formatting;
      (2) KLocalizedContext domain property + untranslated pass-through;
      (3) the NEW QML add-on KLocalizedQmlContext.i18n()/i18nc() against a
      live QQmlEngine — the exact class KF6NewStuff links. Requires
      QCoreApplication (QJSEngine aborts without it) and the ../../bin
      farm + cwd handling (relative DT_NEEDED without SONAME).
    command: "conan create (test_package builds and runs test_ki18n)"

assertion_count: 6
