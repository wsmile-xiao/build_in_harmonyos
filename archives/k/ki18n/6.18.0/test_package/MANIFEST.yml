# test_package/MANIFEST.yml
# Upstream and consumer test declaration for ki18n/6.18.0.

package: ki18n/6.18.0
homepage: https://invent.kde.org/frameworks/ki18n

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E \"^(kcatalogtest|kcountrytest|kcountrysubdivisiontest|ktimezonetest)$\""

upstream_tests:
  - file: autotests/
    source: ki18n-6.18.0/autotests/
    description: "KI18n upstream CTest/autotests suite"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON; excludes four locale-data tests requiring unavailable OHOS iso-codes data"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke formats a localized KLocalizedString through KF6::I18n."
    command: "conan create (test_package builds and runs test_ki18n)"

assertion_count: 1
