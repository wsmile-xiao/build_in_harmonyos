knowledge_gained:
  - "6.18.0.1 turns BUILD_WITH_QML=ON: the QML add-on libKF6I18nQml.so (KLocalizedQmlContext) is required by KF6NewStuff widgets/dialogs (contrib-3596), so the 6.18.0 assumption 'Qt6 Qml not published' is stale."
  - "BUILD_WITH_QML=ON adds a 12th upstream autotest (ki18ndeclarativetest) on top of the 6.18.0 set; the exclude list must stay a regex anchored with ^(...)$ because ctest -E does substring matching and would otherwise drop the qtcatalog-*-with-fallback tests that contain the substring 'catalog'."
  - "The QML engine needs qtdeclarative's <pkg>/qml tree on QML2_IMPORT_PATH/QML_IMPORT_PATH, otherwise ki18ndeclarativetest fails with 'module QtQml is not installed' while plain unit tests still pass."
  - "ki18n 6.18.0 keeps LibIntl as a required dependency and Python3 as a configure-time macro dependency."
  - "KF_SKIP_PO_PROCESSING=ON skips translation catalog generation while preserving the KF6::I18n library and installed CMake package."
  - "The 4 excluded locale-data tests (kcatalogtest/kcountrytest/kcountrysubdivisiontest/ktimezonetest) fail on OHOS with 'Unable to open iso_3166-1.json' because ohpcd has no iso-codes package; they are excluded, not failing."
