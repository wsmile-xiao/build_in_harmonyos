# test_package/MANIFEST.yml
# Upstream and consumer test declaration for ki18n/6.26.0.1.

package: ki18n/6.26.0.1
homepage: https://invent.kde.org/frameworks/ki18n

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E '^(kcatalogtest|kcountrytest|kcountrysubdivisiontest|ktimezonetest)$'"

upstream_tests:
  - file: autotests/
    source: ki18n-6.26.0/autotests/
    description: "KI18n upstream CTest autotests: KLocalizedString/KLazyLocalizedString, ktranscript + ktranscriptcleantest, the QML declarative test, ki18n_install, and the Qt catalog fallback checks"
    condition: "run in the Conan build with BUILD_TESTING=ON"
  - file: tests/
    source: ki18n-6.26.0/tests/
    description: "Upstream spinbox example tool (built when Qt6::Widgets is available; not registered as a ctest test)"
    condition: "built with BUILD_TESTING=ON"

test_package_tests:
  - file: test_package/test.cpp
    description: >-
      Consumer test: calls the KLocalizedString C++ API and instantiates
      KLocalizedContext (R34), then loads the QML module org.kde.ki18n through
      an offscreen QQmlEngine, resolving the KI18n singleton (KI18n.i18nc)
      and the i18n() context object (R53).
    command: "conan create (test_package builds and runs test_ki18n)"
  - file: test_package/conanfile.py
    description: >-
      test() asserts the shipped QML module files (qmldir declares
      'module org.kde.ki18n', a plugin .so and a .qmltypes exist) and that the
      QML plugin and libKF6I18n.so DT_NEEDED contain no relative/absolute
      paths (R53).
    command: "conan create (test_package test())"

assertion_count: 16
