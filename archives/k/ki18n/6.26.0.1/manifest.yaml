knowledge_gained:
  - "The org.kde.ki18n QML module was introduced upstream in KF 6.21 (src/i18n-qml/CMakeLists.txt uses ecm_add_qml_module URI \"org.kde.ki18n\"); 6.18/6.19/6.20 only build libKF6I18nQml.so, so re-basing on a 6.18 revision cannot produce the module."
  - "The QML type exposed by org.kde.ki18n is the singleton 'KI18n' (LocalizedContext QML_NAMED_ELEMENT(KI18n), QML_FOREIGN(KLocalizedQmlContext)); KLocalization::setupLocalizedContext() must run first so the singleton's create() can find the engine root-context object. The legacy C++ class KLocalizedContext (src/i18n, deprecated since 6.8) is separate and still compiles/instantiates."
  - "OHOS CMake emits no SONAME by default, so the QML plugin linked against a sibling build-tree library records '../../bin/libKF6I18n.so' in DT_NEEDED; restoring CMAKE_SHARED_LIBRARY_SONAME_*/RUNTIME_* via CMAKE_USER_MAKE_RULES_OVERRIDE makes the linker record the bare SONAME (libKF6I18n.so.6). Same root fix as kitemodels 6.18.0.1."
  - "CMake rewrites the RUNPATH of installed shared libraries, invalidating the OHOS build-time .codesign section; every packaged ELF must be re-signed with llvm-objcopy --remove-section .codesign + binary-sign-tool sign --selfSign 1 (6 ELFs for ki18n 6.26.0.1)."
  - "Conan's CMakeDeps-generated gettext config declares a bogus 'asprintf' library on OHOS and shadows CMake's own FindGettext module when KF6I18nMacros.cmake runs find_package(Gettext). Consumers must set cmake_find_mode=none for gettext (CMakeDeps.set_property) so FindGettext is used, or find_package(Gettext) fails at configure time."
  - "ki18n 6.26 upstream autotests: 16 registered; the 4 KF6::I18nLocaleData tests need the optional iso-codes JSON runtime data and remain excluded on OHOS; the other 12 (incl. ki18ndeclarativetest and ki18n_install, which needs gettext msgfmt) pass."
