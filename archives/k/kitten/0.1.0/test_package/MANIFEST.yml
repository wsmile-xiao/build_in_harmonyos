# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kitten/0.1.0
homepage: "https://github.com/rvarago/kitten"

# 上游测试入口：根 CMakeLists.txt option(BUILD_TESTS ON) + include(CTest) +
# add_subdirectory(tests)，tests/CMakeLists.txt 用 add_executable(kitten_tests …)
# 编出单个可执行文件并 add_test(kitten_tests kitten_tests)（`make test`/ctest 跑它）。
# 无 autotools `make check`、无 meson。
upstream_check_command: "ctest（tests/CMakeLists.txt 的 add_test(kitten_tests kitten_tests)，入口为单个 kitten_tests 可执行文件）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "build() 内直调编译器（-O0 -Wall -Wextra -Werror -ansi -pedantic -std=c++17 -I<source>/include -I<catch2/2.13.10>/include）把 5 个上游测试翻译单元编成 kitten_tests 并以 `-r compact` 真跑；Catch2 汇总行解析出 test cases / assertions，并与源码 SCENARIO 声明数交叉核对（不等即构建失败），结果以 HMBS_UPSTREAM_TEST_RESULT={…} 写进 conan/CI 日志"

# 上游实际运行的测试程序（单个可执行文件，4 个 SCENARIO 用例、45 条断言）
upstream_tests:
  - file: tests/main.cpp
    source: kitten-0.1.0/tests/main.cpp
    description: "Catch2 v2 主程序（#define CATCH_CONFIG_MAIN），0 个用例声明，提供测试入口"
    command: "./kitten_tests -r compact"
  - file: tests/function_test.cpp
    source: kitten-0.1.0/tests/function_test.cpp
    description: "function_wrapper 的 functor 实例（1 个 SCENARIO，6 个 BDD section 声明，1 条 CHECK 断言）"
    command: "./kitten_tests -r compact -s \"[function_wrapper]\"（与全量运行同一二进制，同轮已执行）"
  - file: tests/optional_test.cpp
    source: kitten-0.1.0/tests/optional_test.cpp
    description: "std::optional 的 functor/applicative/monad 实例（1 个 SCENARIO，28 个 BDD section 声明，16 条 CHECK 断言）"
    command: "./kitten_tests -r compact（同上）"
  - file: tests/sequence_container_test.cpp
    source: kitten-0.1.0/tests/sequence_container_test.cpp
    description: "序列容器（std::vector 别名模板）的 functor/applicative/monad 实例（1 个 SCENARIO，28 个 BDD section 声明，24 条 CHECK 断言）；本包唯一补丁作用于产品头 sequence_container.h，**测试文件本身零改动**"
    command: "./kitten_tests -r compact（同上）"
  - file: tests/variant_test.cpp
    source: kitten-0.1.0/tests/variant_test.cpp
    description: "std::variant 的 multifunctor 实例（1 个 SCENARIO，6 个 BDD section 声明，4 条 CHECK 断言）"
    command: "./kitten_tests -r compact（同上）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者断言链 21 项：从已安装包头覆盖 functor/monad/applicative/function_wrapper/multifunctor 五类实例面（含 liftF<别名模板> 补丁靶点路径），显式计数、任一失败进程非零退出"
    command: "./test_kitten"

# 上游断言总数（Catch2 汇总行读数：All tests passed (45 assertions in 4 test cases)，
# 多轮运行恒定——上游断言不含与时序/渲染相关的动态重复）
assertion_count: 45
