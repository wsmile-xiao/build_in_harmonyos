# conandata.yml — kitten 0.1.0
# 正式源 URL 只写在下方 sources.url 这一处（CI 预下载器对全文件做无边界 URL 抓取，
# 注释里重复写 URL 会被整串替换并连带改写真源前缀，故本文件注释不含任何 URL）。
#
# sha256 三路取证（逐字节同值，14728 字节）：
#   路 1 = 官方 tag 归档（sources.url）
#   路 2 = 同仓库 codeload 端点 tar.gz/0.1.0
#   路 3 = 任务卡/平台登记值 sha=fe04a3f5…（task-scout 导入 2026-09-25 记录）
#   结果 = fe04a3f58cd521effef2503ac6137eac37684d2d442034e9d19d77a2a01afd57 三路一致，
#   且与 conan-center-index 的 kitten 0.1.0 conandata 记录值逐字相同。
# tag 形态：0.1.0（**无 v 前缀**），git ls-remote --tags 实证；tag 指向
#   07758d926211271b69a9862ce73ef6039e5f494d（轻量 tag，单行无 ^{} 剥离行）。

sources:
  url: "https://github.com/rvarago/kitten/archive/0.1.0.tar.gz"
  sha256: "fe04a3f58cd521effef2503ac6137eac37684d2d442034e9d19d77a2a01afd57"

# 补丁：由 `refresh-patch --auto` 生成（diff 基线 = .orig vs .work），条目与文件名同步。
# 唯一 1 个补丁作用在**产品头** include/kitten/instances/sequence_container.h：
#   上游把 SFINAE 守卫写成 enable_if_sequence_container<容器模板>（按模板身份判定），
#   而 clang 不把 alias 模板规范化为模板模板实参（GCC 会）⇒ is_sequence_container<别名>
#   恒 false ⇒ enable_if_t<false> 在实例化 functor<别名> 时被急切求值为硬错误，
#   上游 tests/sequence_container_test.cpp 的 liftF<SequenceContainer> 在 clang 下无法
#   编译（最小探针：t<std::vector> 断言通过 / t<别名模板> 断言失败）。
#   修法 = 守卫改为按实例化类型 SequenceContainer<A> 判定（std::vector/deque/list 三种
#   实例化仍为真、其它仍为假），并依赖成员模板参数 A 保持 SFINAE 语义。
#   上游**测试文件零改动**，4 个 SCENARIO 全部原样运行。
patches:
  - patch_file: "patches/0001-include-kitten-instances-sequence_container.h.patch"
    patch_type: "portability"
    patch_description: "sequence_container.h: key the SFINAE guard on the instantiated type (SequenceContainer<A>) instead of the template identity, so clang can instantiate functor<alias-template> without a hard error"
