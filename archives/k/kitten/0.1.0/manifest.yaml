# 版本级 manifest
# 文件位置: archives/k/kitten/0.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.0"

# 软件名
software: "kitten"

# 编译状态
# published | built | failed | archived
# （O5：只有合并后 release upload 已确认才 published，本单按 built）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
# 上游构建系统是 CMake（根 CMakeLists.txt project(kitten LANGUAGES CXX)、
# add_library(kitten INTERFACE)），但本配方是 header-only：无库编译阶段，
# build() 按上游 tests/CMakeLists.txt 的编译口径直调编译器编译并运行上游测试
# ⇒ 配方侧构建入口记 custom（不使用上游 CMake 树的配置与安装步骤）。
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub tag 归档，官方源；**tag 无 v 前缀**）
  url: "https://github.com/rvarago/kitten/archive/0.1.0.tar.gz"

  # 源码校验和（三路独立下载逐字节同值，14728 字节；与 conan-center-index 记录值相同）
  sha256: "fe04a3f58cd521effef2503ac6137eac37684d2d442034e9d19d77a2a01afd57"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

  # tag 与 tag 提交（git ls-remote --tags 实证，轻量 tag 无 ^{} 剥离行）
  tag: "0.1.0"
  tag_commit: "07758d926211271b69a9862ce73ef6039e5f494d"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（配方侧入口：直调编译器，见上方 build_system 注释）
  system: custom

  # 配置选项列表（header-only，无 configure 步骤）
  configure_options: []

  # 编译依赖列表（格式: name/version；交付依赖 0 个——头文件树仅依赖 C++17 标准库）
  dependencies: []

  # 上游测试依赖（test_requires，不进交付依赖）
  test_dependencies:
    - "catch2/2.13.10"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（1 个 portability 补丁，作用于**产品头**；上游测试文件零改动）
patches_applied:
  - "0001-include-kitten-instances-sequence_container.h.patch"
# clang 不把 alias 模板规范化为模板模板实参 ⇒ 上游按模板身份判定的 SFINAE 守卫
# enable_if_sequence_container<容器模板> 对别名恒 false，且在实例化 functor<别名>
# 时被急切求值为硬错误（"no type named 'type' in 'std::enable_if<false>'"），
# 上游 tests/sequence_container_test.cpp 的 liftF<SequenceContainer> 无法编译。
# 修法：守卫改为按实例化类型 SequenceContainer<A> 判定，依赖成员模板参数保持 SFINAE。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "header-only 库的 conan 配方：package_type=header-library + package_id 清空 + package() 只拷 include/ 与 LICENSE；上游测试以 test_requires catch2/2.13.10 在 build() 内直编直跑，不进交付依赖"
  - "clang 不把 alias 模板规范化为模板模板实参（GCC 会）：按模板身份写的 enable_if 守卫对别名恒 false，且在类实例化期被急切求值成硬错误；守卫须按实例化类型 SequenceContainer<A> 判定才 SFINAE-friendly"
  - "header-only 包的 G4/L2/L4/L5 门禁走跳过分支却并列打 ✅，需按 device-facts §二 人工补测写 reports/conan-verify-supplement.md"

