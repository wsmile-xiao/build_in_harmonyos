# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kcoreaddons5/5.116.0
homepage: "https://invent.kde.org/frameworks/kcoreaddons"

# 上游测试命令 (ctest, CMake 项目)
upstream_check_command: "ctest --test-dir build --output-on-failure --no-tests=error"

# conanfile.py build() 中是否已集成上游测试
# 说明: 上游 34 项 ctest 已在探索性/真机阶段实际运行 (31 通过 / 3 项为 OHOS
# 平台限制失败: kusertest 无 user/group 数据库, kdirwatch 硬链接与 inotify 不可用),
# 结果记录于 reports/test-report.md。conan 配方 build() 不内嵌 ctest, 以免
# OHOS 平台限制项使 conan create 失败, 故此处如实声明为 false。
upstream_test_in_build: false

# 上游实际运行的测试程序 (ctest 34 项)
upstream_tests:
  - file: autotests/kaboutdatatest.cpp
    source: kcoreaddons5-5.116.0/autotests/kaboutdatatest.cpp
    description: KAboutData 构造/查询/序列化上游单测
    command: "./bin/kaboutdatatest"
  - file: autotests/kshelltest.cpp
    source: kcoreaddons5-5.116.0/autotests/kshelltest.cpp
    description: KShell 引用/展开上游单测
    command: "./bin/kshelltest"
  - file: autotests/krandomtest.cpp
    source: kcoreaddons5-5.116.0/autotests/krandomtest.cpp
    description: KRandom/KRandomSequence 上游单测
    command: "./bin/krandomtest"

# test_package 中自带的测试 (消费者视角验证, 调用 KF5CoreAddons API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 调用 KAboutData/KRandom/KShell API 验证库可链接、头文件可包含、运行时符号可解析"
    command: "./test_kcoreaddons5"

# 测试断言总数 (近似值, 用于质量评估; 上游 34 项 ctest + test_package 内自检)
assertion_count: 34
