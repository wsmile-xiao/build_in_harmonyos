# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "禁用 ecm_install_po_files_as_qm(poqm)：Qt5LinguistTools 未发布到 ohpcd"
  - "cmake 用 CMAKE_SYSTEM_NAME=Linux 使 if(UNIX) 生效，保留 kuser_unix/kshell_unix 源码"
  - "test_package：OHOS 沙箱无法执行动态链接二进制（忽略 LD_LIBRARY_PATH + 拒绝 exec），改用 readelf/nm 做链接级 R34 校验"
  - "kusertest 的失败原因曾被写作『无用户/组数据库』，实测不成立：/etc/passwd 有 392 条、pwd.getpwnam('root') 正常。真实原因是沙箱以 uid 20020101 运行而该 uid 不在 passwd/group 中，getpwuid(20020101) 失败；kusertest 用 KUser(KUser::UseRealUserID)。修复是给测试环境补该 uid 自身的身份数据（test_shim/identity_shim.c，其余查询透传 libc），代码不动、断言不动"
  - "kdirwatch 两个 backend 的失败只集中在 testHardlinkChange：本环境拒绝硬链接（探针实测 EPERM），与 inotify 无关（inotify 同样缺失，但未导致失败）"
  - "OHOS 镜像的 /system/bin/lsof 是精简版（usage: lsof [-lt] [-p PID...] [FILE...]）：不认 +d，把它当路径并整单中止（Can't stat +d，rc=1、stdout 空）；任一路径 stat 失败会废掉整批查询。同 uid 进程的 /proc/<pid>/fd 可读（lsof -t <file> 正常输出 pid），所以不是 /proc 权限问题——KListOpenFilesJob 需按此特征回退为对目录直接子项的逐路径查询（patches/0002）"
  - "验证环境差异会改写成败：CI 的 PATH 含 /system/bin（lsof 可见 → 三个 lsof 用例执行，其中 testOpenFiles 在未修复库上 FAIL），farm 受控 PATH 不含（lsof NOT INSTALLED → 三项 QSKIP）。配方 _test_env() 现将 /system/bin 追加进测试 PATH，lsof 探针按同一 PATH 解析并加报 +d 支持情况，两端不再分叉"
  - "『全部构建 ≠ 逐个执行』的可审计做法：在 build() 内、构建树仍在时解析 CTestTestfile.cmake 并逐个执行，两层账目（程序层/用例层）打印进同一份 verify 日志；事后拿旧构建树的 CTestTestfile 去跑会因路径失效全部落到 ***Not Run"

