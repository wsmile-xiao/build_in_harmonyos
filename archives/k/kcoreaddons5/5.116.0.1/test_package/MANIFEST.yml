# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kcoreaddons5/5.116.0.1
homepage: "https://invent.kde.org/frameworks/kcoreaddons"

# 上游测试命令 (ctest, CMake 项目)
upstream_check_command: "ctest --test-dir build --output-on-failure --no-tests=error"

# conanfile.py build() 中是否已集成上游测试
# 说明: 是。build() 在构建树仍在时解析 CTestTestfile.cmake，逐个执行全部 34 项
# CTest 注册，并把两层账目（程序层/用例层）打印进 verify 日志，因此下面每个
# 数字都能从该日志的 [upstream] 段落直接复算，而不是引用一次没有留下记录的
# 手工探索。
#
# 本轮实测（这些数字随日志更新，见 manifest.yaml 的 test_results）:
#   34 项注册 → 34 项有判决（PASS 32 / FAIL 2 / SKIP 0 / NOT_RUN 0 / UNKNOWN 0）
#   524 个 runtime case = 522 通过 / 2 失败 / 0 跳过
#
#   测试 PATH 现含 /system/bin（与 CI 门禁、设备 shell 一致），lsof 三个
#   用例因此全部实际执行：testNoOpenFiles / testNonExistingDir 通过；
#   testOpenFiles 在精简版 lsof（无 +d，把它当路径整单中止）上曾拿空列表，
#   由 patches/0002 的条目查询回退修复后通过（程序 6p/0f/0s）。
#
#   2 个失败程序均为平台拒绝硬链接（探针实测 EPERM），断言原文见 _ENV_ALLOWLIST:
#     kdirwatch_stat_unittest       17p/1f
#     kdirwatch_qfswatch_unittest   17p/1f
#
#   kusertest 的 4 条身份断言此前因沙箱 uid 20020101 无 passwd/group 记录而
#   失败；test_shim/identity_shim.c 为测试环境补齐该 uid 自身身份数据
#   （其余查询透传 libc）后 6p/0f 通过。注意: 不是"没有用户库"——
#   /etc/passwd 有 392 条且 getpwnam('root') 正常。
#
# 这些失败不是被"放过"的: 配方 _ENV_ALLOWLIST 中每一项都记录了断言原文，
# 并在判决时重跑对应环境探针；出现新断言文本、失败数超出记录、或探针不再
# 成立，验证即失败。
upstream_test_in_build: true
upstream_measured:
  built_executables: 39          # 构建树内的可执行程序（不含 test_package）
  ctest_registrations: 34
  runtime_cases: 524
  passed: 522
  failed: 2
  skipped: 0
  not_run: 0
  unknown_cases: 0
  verified_head: "3bd71a13664779a00c77ede3fcaf0686d9ca1e7b"

# 上游实际运行的测试程序 (ctest 34 项)
upstream_tests:
  - file: autotests/kaboutdatatest.cpp
    source: kcoreaddons5-5.116.0/autotests/kaboutdatatest.cpp
    description: KAboutData 构造/查询/序列化上游单测
    command: "./bin/kaboutdatatest"
  - file: autotests/kshelltest.cpp
    source: kcoreaddons5-5.116.0/autotests/kshelltest.cpp
    description: KShell 引用/展开上游单测
    command: "./bin/kshelltest"
  - file: autotests/krandomtest.cpp
    source: kcoreaddons5-5.116.0/autotests/krandomtest.cpp
    description: KRandom/KRandomSequence 上游单测
    command: "./bin/krandomtest"

# test_package 中自带的测试 (消费者视角验证, 调用 KF5CoreAddons API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 调用 KAboutData/KRandom/KShell API 验证库可链接、头文件可包含、运行时符号可解析"
    command: "./test_kcoreaddons5"

# 上游 runtime case 总数（真机实测：各测试二进制 Totals: 行之和；ctest 注册数是 34）
assertion_count: 524
