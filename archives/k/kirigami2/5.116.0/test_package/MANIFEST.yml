package: kirigami2/5.116.0
homepage: "https://invent.kde.org/frameworks/kirigami"

upstream_check_command: "ctest --test-dir build --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/CMakeLists.txt
    source: kirigami2-5.116.0/autotests
    description: "19 upstream Qt Quick Test cases registered by the kirigami_add_tests macro (13 top-level + 2 pagepool + 4 wheelhandler) and executed on HarmonyOS PC"
    command: "ctest --test-dir build --output-on-failure --no-tests=error"

upstream_test_inventory:
  framework: "Qt5::QuickTest via CTest (qmltest harness)"
  declared_test_targets: 19
  executed_test_targets: 19
  result: "7 passed, 12 failed — all 12 failures share one root cause: qt5-qtbase/5.15.2.2 is published with the `accessibility` feature disabled, so the QML `Accessible` attached object does not exist and every QML type assigning `Accessible.role`/`Accessible.name` fails instantiation (Non-existent attached object). The 7 cases that do not touch Accessible pass 100%: tst_icon, tst_mnemonicdata, tst_theme, wheelhandler/tst_filterMouseEvents, wheelhandler/tst_invokables, wheelhandler/tst_onWheel, wheelhandler/tst_scrolling."

adapted_tests:
  - file: test_package/test_kirigami2.cpp
    origin: consumer-validation
    description: "C++ and QML consumer test: links KF5::Kirigami2, checks the Kirigami::Units/Kirigami::PlatformTheme meta objects, verifies the installed QML payload (lib/qml/org/kde/kirigami.2 with qmldir + libKirigamiPlugin.so), and imports org.kde.kirigami 2.19 with a real QQmlEngine"
    command: "./test_kirigami2"
  - file: test_package/test_kirigami2_harmonyos.cpp
    origin: ohos-adaptation
    description: "HarmonyOS-specific test: requires __OHOS__, verifies uname reports HarmonyOS on aarch64, and asserts the KF5Kirigami2 Kirigami::Units meta object is exported to consumers"
    command: "./test_kirigami2_harmonyos"

test_package_tests:
  - file: test_package/test_kirigami2.cpp
    description: "Consumer validation of the KF5::Kirigami2 C++ API and the installed org.kde.kirigami QML module"
    command: "./test_kirigami2"
  - file: test_package/test_kirigami2_harmonyos.cpp
    description: "HarmonyOS PC platform validation with __OHOS__, uname sysname/machine checks and the KF5Kirigami2 link assertion"
    command: "./test_kirigami2_harmonyos"

assertion_count: 10
