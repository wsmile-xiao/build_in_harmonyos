knowledge_gained:
  - "The published Qt5 chain splits the Qt5 CMake configs across four Conan packages and qt5-qtdeclarative ships NO native Qt5Quick/Qt5QuickTest config files at all (its package_info declares only cmake_file_name=Qt5Qml, so CMakeDeps emits a single Qt5QmlConfig.cmake covering the whole package). Any KF5/Qt5 consumer using the umbrella find_package(Qt5 COMPONENTS ...) needs a Qt5Config bridge: include the native qtbase Qt5Config for the base components, then dispatch Qml/Quick/QuickTest through Qt5QmlConfig with alias targets, and QuickControls2/QuickTemplates2/Svg through their native/CMakeDeps configs."
  - "CMakeToolchain.cmake prepends the generators folder to CMAKE_PREFIX_PATH AFTER the project-top-level includes, so the CMakeDeps-generated package-level Qt5Config.cmake (no component dispatch) always wins against any bridge directory — the bridge must be installed over generators/Qt5Config.cmake itself (write after tc.generate())."
  - "qt5-qtbase's Qt5CoreConfigExtrasMkspecDir.cmake carries a build-tree remnant ('${_qt5Core_install_prefix}/../b//mkspecs/linux-clang') that breaks the imported Qt5::Core target with 'references the file ... does not exist'. Stage a fixed copy of lib/cmake (0.9MB) in the generators folder, mirror the package layout with symlinks, and put the staged root FIRST on CMAKE_PREFIX_PATH."
  - "The CMakeDeps Qt5Qml DEPS_TARGET references Qt5::Network in its link interface (qtdeclarative's package_info requires), so Qt5Network/Qt5Core/Qt5Gui/Qt5Concurrent must be materialised BEFORE find_package(Qt5Qml) — a bridge 'preliminary components' loop fixes the 'target was not found' generate error."
  - "Qt 5.15.19 headers stop leaking QColor/QCoreApplication through QDir/QIcon/QQuickItem includes: kirigami2 5.116.0 needs explicit <QColor> in src/icon.h + src/shadowedrectangle.h and <QCoreApplication> in src/libkirigami/kirigamipluginfactory.cpp (patch 0001)."
  - "QTest::setMainSourcePath (needed by QUICK_TEST_MAIN_WITH_SETUP) lives in qtbase's libQt5Test, NOT in qtdeclarative's libQt5QuickTest — a Qt5::QuickTest alias must link qt5-qtdeclarative::qt5-qtdeclarative + Qt5::Test together. An auto-generated Qt5QuickTestConfig.cmake shim (plus ConfigVersion) in generators/ satisfies the upstream find_package(Qt5QuickTest 5.15.2 CONFIG QUIET)."
  - "qtbase/5.15.2.2 is built with the accessibility feature DISABLED: every kirigami2 QML test instantiating a type that assigns `Accessible.*` fails with 'Non-existent attached object' (12/19 upstream cases). Same root cause as the qt5-qtquickcontrols2 archive's documented limitation; the 7 cases that do not touch Accessible pass 100%."
  - "Kirigami::Units' constructor queries the QGuiApplication font table; in the headless offscreen test environment it segfaults without a QGuiApplication instance. The consumer test asserts the static meta objects (Units/PlatformTheme) and the QML module payload/import instead of constructing Units — same pattern as the validated qtquickcontrols2 test_package."
  - "qt5-qtsvg/5.15.2.1 still pins qt5-qtbase/5.15.2 (the flameshot/14.0.0 precedent): force the graph onto 5.15.2.2 with self.requires('qt5-qtbase/5.15.2.2', override=True); with an override in the graph, Conan 2.29 rejects cpp_info.requires entries referencing qt5-qtbase:: components ('not a direct requirement') — omit cpp_info.requires in that case."
