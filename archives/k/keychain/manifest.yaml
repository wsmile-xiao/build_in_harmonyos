software: keychain
display: "keychain"
description: "SSH/GPG key agent 管理器，Bourne shell 脚本实现"
category: security
homepage: "https://github.com/danielrobbins/keychain"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "plain Makefile 构建，无 configure 脚本"
    - "构建需要 Perl（pod2man/pod2text 生成 man page）"
    - "无标准 make install 目标，conanfile.py 手动安装"
    - "R32 平台兼容：validate() 检查 settings.os in [Linux, OHOS]"
    - "SSL fallback：source() 先尝试 GitHub 在线下载，失败回退本地 tarball"
  common_dependencies:
    - autoconf 2.72

versions:
  "2.9.8":
    status: built
    build_date: "2026-07-02"
    source_url: "https://github.com/danielrobbins/keychain/archive/refs/tags/2.9.8.tar.gz"
