# 版本级 manifest — kidletime 6.14.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.14.0"

# 软件名
software: kidletime

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-27"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（KDE 官方源，R39）
  url: "https://download.kde.org/stable/frameworks/6.14/kidletime-6.14.0.tar.xz"

  # 源码校验和
  sha256: "16775b2bdc3efd54c65a96bce6f27a001d119905531d84bb23e23215a196ecb8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DWITH_X11=OFF"
    - "-DWITH_WAYLAND=OFF"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DCMAKE_CXX_STANDARD=20"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - qtbase/6.11.1
    - ecm/6.20.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本包无需源码补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "kidletime 上游 CMakeLists 探测 X11/XCB 与 Wayland 后端；OHOS 制品仓无 x11/xcb 组件且 PlasmaWaylandProtocols 缺失，须 WITH_X11=OFF/WITH_WAYLAND=OFF，核心 KF6IdleTime 库仅依赖 Qt6Core+Qt6Gui 仍可编译"
  - "KF_IGNORE_PLATFORM_CHECK=TRUE 绕过 KDE 平台白名单（OHOS 不在 Linux/FreeBSD/Windows/macOS 列表）"
  - "ECM_MODULE_PATH 由 CMakeDeps 生成的 ECMConfig.cmake 不传播，需在 generate() 手工设置"
  - "qtbase 使用 cmake_find_mode=none，需手工生成 conan_cmakedeps_paths.cmake 将 qtbase 的 lib/cmake 加入 CMAKE_PREFIX_PATH"
