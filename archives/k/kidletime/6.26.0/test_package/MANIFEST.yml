# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kidletime/6.26.0.

package: kidletime/6.26.0
homepage: https://invent.kde.org/frameworks/kidletime

# kidletime ships no upstream test suite (only an example executable);
# there is no ctest target in the upstream build.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: examples/
    source: kidletime-6.26.0/examples/
    description: "KIdleTest example executable (requires a display/X11; not installed, not run on OHOS)"
    command: "./kidletime_example"
    condition: "not run: no display backend on OHOS"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke instantiates KIdleTime::instance(), queries idleTime(), and checks the installed version header."
    command: "conan create (test_package builds and runs test_kidletime)"

assertion_count: 3
