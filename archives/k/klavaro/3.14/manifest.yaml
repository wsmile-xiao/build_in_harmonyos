# 版本级 manifest — klavaro 3.14
# 遵循 ARCHIVE-SPEC v2.0

version: "3.14"
software: klavaro
status: published
build_date: "2026-09-09"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/klavaro/klavaro-3.14.tar.bz2"
  sha256: "87187e49d301c510e6964098cdb612126bf030d2a875fd799eadcad3eae56dab"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux"
    - "--host=aarch64-linux"
  dependencies:
    - gtk/3.24.43
    - gtkdatabox/1.0.0
    - curl/8.15.0
    - intltool/0.51.0
    - fontconfig/2.18.1.1
    - expat/2.8.2.1
    - glib/2.84.0.1
    - cairo/1.18.4
    - pango/1.50.14.1.1
    - gdk-pixbuf/2.44.6.1
    - atk/2.38.0.1.1
    - harfbuzz/14.2.0.1.1.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-bypass-xml-parser-check.patch"
  - "0002-config.sub-accept-linux-ohos.patch"
  - "0003-src-Makefile.in-link-curl-intl.patch"

knowledge_gained:
  - "klavaro 3.14 上游无测试套件（configure.ac 无 AM_TESTS，make check 无目标）——N=0 实证"
  - "XML::Parser perl XS 模块在 OHOS 应用沙箱内无法 dlopen（musl loader 对用户区 .so 返回 Permission denied）——intltool -x 模式必须 shim 绕过（goffice 先例制度化）"
  - "configure 把 INTLTOOL_MERGE 绝对路径烤进 Makefile——PATH shim 不生效，必须 configure 后重写 Makefile 变量"
  - "上游 AC_CHECK_LIB 探测 curl/libintl 但不进链接线——补丁追加 -lcurl -lintl 到 klavaro_LDADD（LIBS env 注入会污染 conftest 探测）"
  - "cairo/1.18.4 新 revision pin fontconfig/2.18.1.1+expat/2.8.2.1，与 gtkdatabox/1.0.0 的 2.18.1/2.8.2 精确 pin 冲突——顶层 override 对齐 cairo 分支解决"
  - "PkgConfigDeps 生成的 pc 文件 Libs 行带引号变量引用（-L\"${libdir}\"）——程序化提取需展开变量并去引号，否则 clang 收到字面引号找不到库"
  - "gtkdatabox（cmd-pkgs 系统栈构建）DT_NEEDED 携带无版本号 libffi.so——运行期闭包需 HNP libffi.org 路径"
  - "CI#43592 教训：glib 的 libintl.h 用 #define gettext g_libintl_gettext 无条件宏重定向（命令行恒等宏无法覆盖），裸 -lintl 依赖 -L 顺序在异构 Worker 上会命中 sysroot 无 g_libintl_* 的 stub——修法为 LDADD 的 -lintl 钉死为 glib 包 libintl.so 绝对路径"
