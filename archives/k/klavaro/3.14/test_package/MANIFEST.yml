# test_package/MANIFEST.yml — klavaro/3.14
#
# 上游测试实证（2026-09-09，klavaro-3.14.tar.bz2 官方 tarball）：
# - configure.ac：无 AM_TESTS / AC_CONFIG_TESTDIR 声明
# - src/Makefile.am：无 TESTS 变量、无 check_PROGRAMS
# - Makefile.am：SUBDIRS = src data doc po，均无测试目标
# - `make check` 实跑输出：所有子目录 "Nothing to be done for 'check'"
# → 上游 klavaro 3.14 无自动化测试套件（N=0）
#
# 消费者侧（test_package）以二进制/ELF/加载器三层探针替代（R34/R40），
# 并补 2 项鸿蒙特有验证（NEEDED 闭包含 gtkdatabox/curl、headless 加载器
# 全链解析探测），详见 test_package/conanfile.py。

package: klavaro/3.14
homepage: "https://klavaro.sourceforge.io/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
# 上游无测试（N=0，证据见文件头注释）

test_package_tests:
  - file: test.c
    description: "消费者探针：编译期确认被测包引用（占位源，实际验证在 conanfile.py 的 ELF/NEEDED/加载器三层探针）"
    command: "conan create test_package（ELF magic/AArch64/NEEDED 闭包/加载器解析）"

# 断言计数：
# - ELF magic (1) + AArch64 e_machine (1) + NEEDED 闭包 6 项 (6)
# - 加载器解析失败 FAIL 分支 (1) + headless Cannot open display PASS 分支 (1)
assertion_count: 10
