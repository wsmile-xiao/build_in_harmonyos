sources:
  url: "https://downloads.sourceforge.net/project/klavaro/klavaro-3.14.tar.bz2"
  sha256: "87187e49d301c510e6964098cdb612126bf030d2a875fd799eadcad3eae56dab"

patches:
  "3.14":
    - patch_file: "patches/0001-configure-bypass-xml-parser-check.patch"
      patch_type: "backport"
      patch_description: "Bypass XML::Parser perl module check: intltool -x (XML merge) mode needs the XS extension which cannot dlopen from OHOS app-sandbox paths; the appdata.xml merge is regenerated by a pure-perl shim in the recipe instead."
    - patch_file: "patches/0002-config.sub-accept-linux-ohos.patch"
      patch_type: "portability"
      patch_description: "Accept linux-ohos triplet in config.sub (standard OHOS cross-compile fix)."
    - patch_file: "patches/0003-src-Makefile.in-link-curl-intl.patch"
      patch_type: "bugfix"
      patch_description: "Append -lcurl -lintl to klavaro_LDADD: upstream configure.ac AC_CHECK_LIB probes curl/libintl but never wires them into the link line (system-path assumption); on OHOS the conan-provided libs need explicit -l flags. -lintl resolves the proxy-libintl g_libintl_* symbols from the glib package."
