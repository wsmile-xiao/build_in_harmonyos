software: kylin-ai-proto
display: "kylin-ai-proto"
description: "Kylin AI protocol definitions (gdbus XML + grpc proto), pure data package"
category: protocol
homepage: "https://gitee.com/openkylin/kylin-ai-proto"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游为 INTERFACE 库 (add_library(KylinAiProto INTERFACE))，无编译代码，纯数据分发"
    - "协议文件安装到 share/kylin-ai/protocols/（gdbus XML + grpc proto）"
    - "移除 install(DIRECTORY protocols/usr/ DESTINATION /usr) 直写系统根（conan package() 阶段报错）"
    - "CMake package config 迁到 lib/cmake/KylinAiProto/（Conan 约定 + G4 产物完整性门禁）"
    - "零外部依赖，无平台宏补丁"
  common_dependencies: []

versions:
  "1.0.0.1":
    status: built
    build_date: "2026-09-17"
