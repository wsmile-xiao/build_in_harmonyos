# test_package/MANIFEST.yml
# 上游官方测试声明文件 — kylin-ai-proto/1.0.0.1

package: kylin-ai-proto/1.0.0.1
homepage: "https://gitee.com/openkylin/kylin-ai-proto"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# R51 三步法清点证据（tag build/1.0.0.1-ok0.3，commit 9074982）：
#   1. `find . -iname '*test*' -not -path './.git/*'` -> 无结果
#   2. `ls tests` -> "ls: tests: No such file or directory"
#   3. CMakeLists.txt 无 enable_testing()/add_test()/add_executable()
# 结论：上游确无测试（0 个测试用例），test_package 消费者测试为唯一实质验证。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 链接 KylinAiProto::KylinAiProto (find_package 目标存在) + 校验包内 share/kylin-ai/protocols/ 的 gennlpservice.xml / milvus.proto 存在且非空"
    command: "./test_kylin-ai-proto"

# 测试断言总数 (近似值：C++ 2 文件检查 + test() Python 侧 2 文件存在性检查)
assertion_count: 4
