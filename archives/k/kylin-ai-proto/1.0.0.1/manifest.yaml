# 版本级 manifest — kylin-ai-proto 1.0.0.1
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.0.1"
software: "kylin-ai-proto"

# 编译状态: built（conan-verify G0-G4/L2/L4/L5 全绿，未 upload）
status: built

build_date: "2026-09-17"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源（gitee，openKylin 官方项目托管）
  url: "https://gitee.com/openkylin/kylin-ai-proto.git"

  # 注意：不伪造 sha256 —— source() 用 Git clone 官方源 + 固定 tag
  # build/1.0.0.1-ok0.3（annotated tag 对象 c502d9a8，指向 commit 9074982），
  # 无 tar 归档可哈希；固定的是 git commit（见 conandata.yml）。
  sha256: null

  # 压缩格式（git clone 方式，无 tar）
  tar_format: git

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器（INTERFACE 库无编译代码，仅运行 CMake install）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
- "0001-CMakeLists.txt.patch"

knowledge_gained:
- "INTERFACE 库纯数据分发：G4 产物完整性门禁要求 bin/lib/include 至少一项非空，CMake package config 迁到 lib/cmake/KylinAiProto/ 既符合 Conan 约定又满足门禁"
- "gitee /repository/archive/ 归档端点对 conan 下载器返回 HTML 反爬页，纯数据包也用 Git clone + 固定 tag 取源"

patch_generation:
  method: git-diff-manual
  patches_count: 1
