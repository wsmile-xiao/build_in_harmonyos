# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-pgsql/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的三个 test() 套件。无需数据库的 libload 套件在
# build() 内真实执行；两个需要活体 PostgreSQL 的 DB 套件在 OHOS 设备侧以
# 制品仓 postgresql/18.3 包提供的真实服务器 + keatest schema 夹具全量实测
# （夹具按上游 doc/devel/unit-tests.dox pgsqlUnitTestsPrerequisites 节准备）。
upstream_check_command: "meson test -C <builddir> dhcp-pgsql-libload-tests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-pgsql-libload-tests"

# 上游实际运行的测试程序（本次适配实测：3 + 602 + 47 = 652 例全部通过）
upstream_tests:
  - file: dhcp-pgsql-libload-tests
    source: src/hooks/dhcp/pgsql/libloadtests/
    declared_cases: 3
    description: >-
      3 个 gtest 用例，校验 libdhcp_pgsql.so 可被 Kea hook 框架加载/卸载
      （validLoad4/validLoad6/invalidDaemonLoad）。load() 仅注册 PostgreSQL
      后端工厂，不需要数据库连接。
    command: "./dhcp-pgsql-libload-tests"
    result: "3/3 passed（build() 内真实执行）"
  - file: dhcp-pgsql-lib-tests
    source: src/hooks/dhcp/pgsql/tests/
    declared_cases: 602
    description: >-
      PostgreSQL 后端集成测试（config backend DHCPv4/v6 mgr、forensic log、
      host data source、lease mgr、extended info、bootp）。每个用例通过
      pgsql testutils 复用 keatest schema（soft-wipe 只清数据）。
    command: "./dhcp-pgsql-lib-tests"
    result: "602/602 passed（设备侧活体 PostgreSQL 18.3 + keatest schema 实测，exit 0；另有上游自带 DISABLED_ 用例 4 个，不计入）"
  - file: kea-pgsql-tests
    source: src/lib/pgsql/tests/
    declared_cases: 47
    description: >-
      libkea-pgsql 单元测试（pgsql_exchange、pgsql_connection、schema 等），
      同样依赖活体 PostgreSQL + keatest schema。
    command: "./kea-pgsql-tests"
    result: "47/47 passed（设备侧活体 PostgreSQL 18.3 + keatest schema 实测，exit 0）"

# DB 套件夹具要点（上游 unit-tests.dox 指定的 keatest/keatest_readonly 夹具）
db_test_fixture:
  postgresql: "postgresql/18.3（制品仓 conan 包内置服务器，OHOS 设备本机运行）"
  users: "keatest / keatest_readonly，口令 keatest；schema 以 keatest 加载 dhcpdb_create.pgsql"
  readonly_grants: "ALTER DEFAULT PRIVILEGES + GRANT SELECT ON ALL TABLES IN SCHEMA public（上游文档给出的 PG 新版已知问题对策）"
  auth: "pg_hba.conf 必须为密码认证（scram-sha-256）：OpenDatabase 3 例验证错误口令被拒（DbOpenError），trust 下会产生假失败"

# 首轮 DB 实测 596/602，6 例失败经归因全部为夹具问题（trust 认证、缺
# keatest_readonly 授权、高负载时序抖动），按上游文档修复夹具后复跑全绿，
# 无一例涉及 OHOS 移植缺陷（失败明细与归因见 3.0.3/notes.md）。

# test_package 中自带的测试（1 项消费者契约 + 1 项鸿蒙特有）
test_package_tests:
  - file: test_pgsql_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload/multi_threading_compatible 契约、dhcp4_srv_configured/dhcp6_srv_configured 服务 callout 与 hook ABI 版本（无需数据库）"
    command: "./test_pgsql_hook <package>/lib/kea/hooks/libdhcp_pgsql.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有用例：校验包内 libdhcp_pgsql.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc
      libc.so.6、链接 libc++_shared.so、链接 libpq.so.5 与 libkea-pgsql.so.88）、
      OHOS 加载器可 dlopen(RTLD_NOW) 解析，且 pgsql hook callout
      （dhcp4_srv_configured/dhcp6_srv_configured）与 hook ABI 30003 可经其解析
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_pgsql.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（本次适配实测：1 个，1/1 通过）
ohos_specific_tests:
  count: 1
  entries:
    - test_ohos_platform
  command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_pgsql.so"
  result: "1/1 passed"

# 测试用例总数（本次实测执行的上游用例数：3 + 602 + 47）
assertion_count: 652
