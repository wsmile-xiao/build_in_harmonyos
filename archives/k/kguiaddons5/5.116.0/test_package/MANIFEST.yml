# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kguiaddons5/5.116.0.

package: kguiaddons5/5.116.0
homepage: https://invent.kde.org/frameworks/kguiaddons

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
upstream_test_result:
  registered: 7
  passed: 7
  failed: 0
  skipped: 0
  pass_rate: "100%"
  log: "archives/k/kguiaddons5/5.116.0/reports/w3-local-ci.log"

upstream_tests:
  - file: autotests/
    source: kguiaddons-5.116.0/autotests/
    description: >
      KGuiAddons upstream CTest suite (autotests/): kwordwraptest,
      kcolorutilstest, kiconutilstest, kcursorsavertest,
      keysequencerecordertest, kurlhandlertest (via ecm_add_tests, linked
      against KF5::GuiAddons + Qt5::Test) and kgeourihandlertest (Qt5::Test
      only, independent of the library). tests/ holds interactive manual
      executables (kguiaddons_executable_tests, ecm_mark_as_test, no ctest
      registration with assertions) and systemclipboard/tests/paste.cpp is a
      BUILD_TESTING helper tool, not a ctest case.
    command: "ctest --output-on-failure"
    status: "executed in build()"

manual_runs:
  - executable: kcolorcollectiontest
    exit_code: 0
    note: "读取颜色集合，无断言输出（tests/，未注册进 CTest）"
  - executable: openurltest
    exit_code: 0
    note: "无参时打印 please use ./openurltest <url>，需外部 URL 参数"
  - executable: kcolorschemewatchertest
    exit_code: 124
    note: "GUI 事件循环常驻，25s 超时；非自动化用例"
  - executable: kmodifierkeyinfotest
    exit_code: 124
    note: "交互式 GUI；offscreen 下报 No modifierkeyinfo backend for platform \"offscreen\"（WITH_X11/WITH_WAYLAND=OFF）"
  - executable: kcursorsavergui_test
    exit_code: 124
    note: "交互式 GUI（按钮切换光标），25s 超时"

upstream_test_exclusions:
  - tests: "（无）CTest 注册的 7 个 autotests 用例全部执行且通过，未做任何排除"
    reason: "autotests/ 均为不依赖窗口系统的 QtTest 用例，offscreen 环境下 7/7 通过"
  - tests: "kcolorschemewatchertest、kmodifierkeyinfotest、kcursorsavergui_test"
    reason: >
      tests/ 下的交互式手工程序，上游 ecm_mark_as_test 未注册 add_test；无头环境事件循环
      常驻（实测 25s 超时），无法自动判定，故不计入自动化通过率（详见 manual_runs）。

test_package_tests:
  - file: test_package/test.cpp
    description: >
      Consumer smoke test, 6 checks mirroring upstream kcolorutilstest
      assertions: (1) opaque overlayColors leaves color unchanged; (2-4)
      low-opacity mix leaves colorB unchanged (redF/greenF/blueF <= 0.01,
      upstream testMix); (5-6) contrast ratio black/white = 21.0 and
      black/black = 1.0 (upstream testContrast), plus the failure-count guard.
    command: "conan create (test_package builds and runs test_kguiaddons5)"

assertion_count: 6
