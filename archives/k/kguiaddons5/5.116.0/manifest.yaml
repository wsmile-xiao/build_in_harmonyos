# 版本级 manifest - kguiaddons5/5.116.0
# 遵循 ARCHIVE-SPEC v3.0

version: "5.116.0"
software: kguiaddons5
status: published
build_date: "2026-09-18"
build_system: cmake

source:
  url: "https://download.kde.org/stable/frameworks/5.116/kguiaddons-5.116.0.tar.xz"
  sha256: "5c10d56cb02cb60710c2412d4a3d02671cad74f25d1e9889c6c741f6e833fce6"
  tar_format: tar.xz

dependencies:
  - qt5-qtbase/5.15.2.2
  - ecm/6.26.0 (tool_requires)

build:
  system: cmake
  configure_options:
    - "-DQT_MAJOR_VERSION=5"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DWITH_WAYLAND=OFF"
    - "-DWITH_X11=OFF"
    - "-DWITH_DBUS=OFF"
    - "-DBUILD_GEO_SCHEME_HANDLER=OFF"
    - "-DBUILD_TESTING=ON"

patches_applied: []

knowledge_gained:
  - "KF5/KF6 KColorUtils API 改名差异：KF5 是 overlayColors，KF6 才是 blend，消费者代码不能照抄 KF6 示例"
  - "OHOS 未映射 Linux 平台导致 CMAKE_SHARED_LIBRARY_SONAME_{C,CXX}_FLAG 未定义，需显式置 -Wl,-soname, 并配 CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE（ki18n5 已验证方案）"
  - "qtbase 包 Qt5CoreConfigExtrasMkspecDir.cmake 硬编码 <pkg>/../b/mkspecs/linux-clang，build() 前需从包内 mkspecs 拷贝到该路径"
  - "KF5 kguiaddons 上游 autotests 共 7 个 CTest 用例；tests/ 目录是交互式手工程序（仅 ecm_mark_as_test）不计入自动化口径"
  - "KGuiAddons 的 X11/Wayland/DBus 功能面经 WITH_*=OFF 裁剪（qtbase 对应模块未发布 ohpcd），与 kguiaddons 6.x 基线口径一致"
