name: khelpcenter
description: "KDE Help Center (KDE Gear 26.04, KF6/Qt6): headless Xapian documentation search stack for HarmonyOS PC - khcdocmetainfo library + khc_xapianindexer/khc_xapiansearch tools, WebEngine viewer trimmed"
homepage: https://invent.kde.org/kde/khelpcenter
upstream: https://invent.kde.org/kde/khelpcenter
license: GPL-2.0-or-later AND GFDL-1.2-or-later
type: library
versions:
  26.04.0:
    status: published
    date: 2026-09-20
    entry: khc_xapianindexer/khc_xapiansearch (libexec tools) + libkhcdocmetainfo.so
    lang: cpp
    build: cmake
    deps: qtbase/6.11.1, karchive/6.19.0, kconfig/6.26.0, kcoreaddons/6.26.0, kdoctools/6.19.0, ki18n/6.26.0, xapian-core/1.4.26, libxml2/2.15.3, zlib/1.3.1.1(override)
    notes: >-
      WebEngine viewer trimmed (qtwebengine unpublished, qtbase/6.11.1 lacks
      PrintSupport - algobox 1.1.1 precedent). Delivers the headless Xapian
      search stack. Upstream testmetainfo kept (links the library).
