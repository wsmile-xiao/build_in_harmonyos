package: kimwitu/2.3.13
homepage: "https://www.nongnu.org/kimwitu-pp/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_note: "上游 make check 依赖 perl/测试框架，本包以 test_package 真实调用覆盖核心功能（kc++ 执行 + 代码生成）"

test_package_tests:
  - file: test_kimwitu.sh
    description: "运行 kc++ --version（静态链接版）+ 用最小规格 test_kimwitu.k 真实代码生成，断言 test_kimwitu.cc/h 生成且含 namespace kc"
    command: "sh test_kimwitu.sh"
  - file: test_kimwitu.k
    description: "最小 kimwitu 规格输入（Tree -> Leaf(child: Tree) 递归 phylum）"

assertion_count: 4
