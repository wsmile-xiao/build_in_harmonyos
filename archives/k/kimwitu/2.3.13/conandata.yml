sources:
  url: "https://download.savannah.gnu.org/releases/kimwitu-pp/kimwitu++-2.3.13.tar.gz"
  sha256: "3f6d9fbb35cc4760849b18553d06bc790466ca8b07884ed1a1bdccc3a9792a73"

patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: "config.status tmp dir: umask 077 && mktemp -d in cwd is blocked by HarmonyOS security framework; use TMPDIR absolute path without umask"
    patch_type: "portability"
  - patch_file: "patches/0002-src-Makefile.patch"
    patch_description: "boot target: strip in-place write is blocked (EPERM) and dynamically linked kc++ (libc++_shared) cannot be exec'd; link boot kc++ with -static"
    patch_type: "portability"
