software: "kamailio-db"
display: "Kamailio DB-backend modules"
description: "Kamailio SIP 服务器 DB-backend 模块集（33 个运行时加载模块 .so，Alpine kamailio-db 子包口径）"
category: "sip-server"
homepage: "https://www.kamailio.org"
license: "GPL-2.0-or-later"
build_system: makefile

ohos_adaptation:
  approach: "零补丁 + make 命令行变量注入平台口径（OS=linux SCTP=0 DEFS_RM=-DHAVE_RESOLV_RES，与 OHOS 上 core 完全一致）"
  scope: "仅编译 33 个 DB-backend 模块，不编译 kamailio 主程序（模块 .so 由 kamailio 运行时 loadmodule 加载）"
  deps: []   # 无强制第三方依赖
  notes: "详细适配记录见 6.0.6/notes.md"

versions:
  "6.0.6":
    status: built
    conan_ref: "kamailio-db/6.0.6@ohpcd/stable"
    build_date: "2026-10-03"
