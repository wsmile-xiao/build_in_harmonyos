# 版本级 manifest — kamailio-db 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-db"
status: built
build_date: "2026-10-03"
# kamailio 经典 Makefile 体系（非 autotools/cmake）
build_system: makefile
conan_ref: "kamailio-db/6.0.6@ohpcd/stable"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方仓库 tag 归档（含完整 test/ 树，供 R51 上游测试核验）
  url: "https://github.com/kamailio/kamailio/archive/refs/tags/6.0.6.tar.gz"
  sha256: "5b8cd435aa52137857bbfc27804479b687a495df5634e7d8513b3ff45e98e1b6"
  tar_format: tar.gz
  note: "官网 src 包 kamailio-6.0.6_src.tar.gz（sha256 32e4290c…）不含 test/ 目录，故采用仓库 tag 归档"

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  scope: "33 个 DB-backend 模块（Alpine kamailio-db 子包口径），不编译 kamailio 主程序"
  configure_options:
    - "make cfg OS=linux SCTP=0 DEFS_RM=\"-DHAVE_RESOLV_RES\" CC=\"<clang>\" LD=\"<clang>\"（生成 src/config.mak）"
    - "make modules modules=\"modules/acc … modules/usrloc\" -j1 OS=linux SCTP=0 DEFS_RM=\"-DHAVE_RESOLV_RES\""
  platform_vars: "OS=linux SCTP=0 DEFS_RM=-DHAVE_RESOLV_RES（与 OHOS 上 core 完全一致：目标标识 aarch64/linux + 编译标志集合）"
  parallel_jobs: 1
  parallel_jobs_reason: "E525/E074：OHOS SELinux 禁止用户进程创建 FIFO，GNU make jobserver 靠 FIFO 传递令牌 → -j>1 有挂起/报错风险；与同族 kamailio-* 配方一致固定 -j1"
  modules:
    - acc
    - alias_db
    - auth_db
    - avpops
    - cfg_db
    - db_cluster
    - db_flatstore
    - dialog
    - dispatcher
    - domain
    - drouting
    - group
    - htable
    - imc
    - matrix
    - mohqueue
    - msilo
    - mtree
    - pdt
    - permissions
    - pipelimit
    - prefix_route
    - p_usrloc
    - registrar
    - sipcapture
    - siptrace
    - speeddial
    - sqlops
    - topos_htable
    - uac
    - uri_db
    - userblocklist
    - usrloc
  # 无强制第三方依赖（详见 notes.md §3）
  dependencies: []
  cc: clang
  cxx: clang++
  compiler_source: "conan profile tools.build:compiler_executables（R33）"

# ============================================================
# 补丁信息
# ============================================================

# 0 补丁（平台差异全部经 make 命令行变量表达）
patches_applied: []

# ============================================================
# 验证
# ============================================================

verification:
  conan_create:
    rc: 0
    log: "reports/conan-create.log"
    test_package_assertions: "37 通过 / 0 失败"
    ohos_loader_probe: "[H7] dlopen total=33 failed=0"
  conan_verify:
    verdict: PASS
    report: "reports/conan-verify-report.md"
    gates: "G1/G2/G3/G4 PASS；L2/L4/L5 PASS（cache 路径不可得时跳过）"
  upstream_tests:
    entry: "test/unit/Makefile（49 个 .sh）"
    total: 49
    ok: 5
    fail: 9
    skip: 35
    timeout: 0
    summary: "reports/upstream_tests_summary.tsv"
    detail: "reports/upstream_tests_detail.log"
    fail_probe: "reports/40_fail_probe.log, reports/41_fail_probe_deep.log"
    note: "9 FAIL 均为平台限制/上游用例陈旧/缺独立 DB 驱动子包，非本包产物缺陷（notes.md §5.3）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 系（自有 make 体系）在 OHOS 上必须显式 OS=linux：uname -s=HarmonyOS 无匹配分支 → core/resolve.h:290 #error 中断"
  - "模块与 core 需同口径（OS=linux SCTP=0 DEFS_RM=-DHAVE_RESOLV_RES）：kamailio 校验目标标识 (aarch64/<os>) + 编译标志集合"
  - "OHOS 无 /bin/bash，上游 test/unit 需按 shebang 选解释器（#!/bin/bash → /data/service/hnp/bin/bash）"
  - "db_* 为独立子包；DB 场景用例在缺驱动时按上游守卫 SKIP（非模块缺陷）"
