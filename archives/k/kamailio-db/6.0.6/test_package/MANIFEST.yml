# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: kamailio-db/6.0.6
homepage: "https://www.kamailio.org"

# ── 上游测试清点（R51 三步法，逐项证据见 ../notes.md「上游测试申报表」） ──
#   源码包：github.com 官方仓库 tag 归档 kamailio-6.0.6.tar.gz
#           sha256 5b8cd435aa52137857bbfc27804479b687a495df5634e7d8513b3ff45e98e1b6
#           （与 conandata.yml 一致；**含完整 test/ 树**，非 kamailio.org 的 src 包）
#   测试入口：test/unit/Makefile（all = 依次执行 test/unit/*.sh）
#   用例规模：test/unit 下 49 个 .sh（+ 28 个 .cfg、.sip 数据、include/ 公共脚本）
#   项目级测试套件：无（上游未注册 ctest/pytest；Alpine APKBUILD 标注 options="!check"）
#   无 make check 目标。
#
# ── 实测（OHOS PC aarch64，全量 49/49 执行，未漏测） ──
#   执行方式：逐用例 `cd test/unit && <interp> ./N.sh`（120s 超时，用例间清理 kamailio 进程）
#   解释器：OHOS 无 /bin/bash（仅 /bin/sh），而 36/49 用例 shebang 为 #!/bin/bash →
#           按 shebang 显式选择（#!/bin/bash → /data/service/hnp/bin/bash；#!/bin/sh → /bin/sh）
#   外部工具：sipsak 由 conan 包 sipsak/0.9.7.1 提供并加入 PATH
#   结果：total=49, OK=5, FAIL=9, SKIP=35, TIMEOUT=0
#     5 个 OK：1（最小配置加载）、3（kamdbctl mysql 建库/删库）、9（kamctl mysql DB 操作）、
#              24（kamdbctl postgres 建库/删库）、60（sdpops SDP 操作 SIP 端到端）
#     9 个 FAIL 逐项根因（均非本包产物缺陷，证据 logs/40_fail_probe.log、
#                        logs/41_fail_probe_deep.log）：
#       4/5   —— OHOS 平台限制：mkfifo EPERM → jsonrpcs FIFO transport 初始化失败
#                （`Can't create FIFO: Operation not permitted`；OHOS 亦无 mkfifo 命令）
#       7     —— 上游用例陈旧：7.cfg 使用 tm 模块的 delete_timer 参数，6.0.6 已移除
#       14    —— 上游用例陈旧：14.cfg loadmodule mi_fifo，该模块 6.0.6 上游已移除
#       6/15  —— 用例覆盖：2.cfg（全模块清单）引用 dialplan / userblacklist / app_sqlang
#                等**非本子包**模块（属其他发行版子包），故无法加载
#       8     —— DBTEXT 建库已成功（kamdbctl create rc=0），DBTEXT drop 走交互式确认
#                `Continue with drop? (y/n):`，非交互环境无 stdin → rc=1
#       10    —— dbtextdb.py shebang 为 #!/usr/bin/python3，OHOS 无 /usr/bin/python3
#                （python3 位于用户级路径），执行报 No such file or directory（rc=126）
#       18    —— 用例依赖 `id -u/-g` 与用户切换，OHOS 无 id 命令（rc=127）且平台限制
#                setuid/setgid
#     35 个 SKIP：均为上游用例自身守卫（check_module / check_sipsak / check_sipp /
#                check_netcat）在缺前置时自行 exit 0 —— 缺 DB 驱动模块（db_mysql /
#                db_postgres / db_unixodbc / db_berkeley，属**独立子包**）或 sipp/nc 工具
#
# ── 结论 ──
#   本包 33 个模块在 test/unit 中由多个用例间接覆盖（如 usrloc/registrar/dialog/
#   permissions/htable/siptrace 等经 2.cfg 与各 .cfg 加载），但**无 DB 驱动的独立
#   子包**（db_mysql/db_postgres/db_unixodbc/db_text）时，多数 DB 场景用例按上游自身
#   守卫 SKIP。本包未修改任何上游测试文件（patches/ 为空），test_package 亦**不替代**
#   上述统计。

test_type: consumer
test_scale: "upstream: 49/49 executed (OK=5/FAIL=9/SKIP=35/TIMEOUT=0); test_package: 33 modules x (ELF+契约+依赖闭合) + 鸿蒙 [H1][H2][H5][H6][H7]"
kamailio_specific:
  distinct_tests_min_1: true
  ohos_specific_tests:
    - "[H1] OHOS ABI 契约（ELF64 / AArch64 / ET_DYN）"
    - "[H2] OHOS 依赖自洽（DT_NEEDED ⊆ {libc.so}）"
    - "[H5] 模块目标标识 kamailio 6.0.6 (aarch64/linux)（与 OHOS core 口径一致）"
    - "[H6] 编译标志集合不含 USE_SCTP / HAVE_RESOLV_RES（与 OHOS core 口径一致）"
    - "[H7] OHOS 动态加载器实测（真实 dlopen 33 个 .so）"
