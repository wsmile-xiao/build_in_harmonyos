# conandata.yml — kamailio-db 6.0.6
#
# 源码取上游官方仓库 tag 归档（GitHub 官方仓库 kamailio/kamailio @ refs/tags/6.0.6）。
#
# 说明 1：kamailio 官网发布包 kamailio-6.0.6_src.tar.gz（sha256 32e4290c…）**不含 test/
#         目录**（实测顶层无 test/ 条目），而本包 R51 上游测试入口位于 test/unit/**；
#         为满足上游测试可核验性，采用官方仓库 tag 归档（含完整 test/ 树，49 个 .sh 用例）。
# 说明 2：采用 github.com 官方归档端点而非 codeload 直连端点 —— `codeload.github.com` 不在
#         CI mirror-fallback 域名白名单内（见 ci/conan/build_and_test.sh 镜像重写正则），
#         Worker 直连该域会超时；`github.com/<owner>/<repo>/archive/refs/tags/<tag>.tar.gz`
#         与 codeload 同路径归档为**同一字节**（sha256 已实测一致），且可命中官方镜像回退
#         （镜像由 CI 侧自动注入，本文件只保留官方源，不含任何镜像域名）。
# 说明 3：显式给出 filename，避免镜像/重定向端点的末段路径影响归档类型识别。
sources:
  url: "https://github.com/kamailio/kamailio/archive/refs/tags/6.0.6.tar.gz"
  filename: "kamailio-6.0.6.tar.gz"
  sha256: "5b8cd435aa52137857bbfc27804479b687a495df5634e7d8513b3ff45e98e1b6"

# 0 补丁：33 个成员模块源码不含平台条件编译（仅 solaris/darwin 分支，OHOS 走通用路径），
# 平台差异全部经 make 命令行变量表达（见 conanfile.py build()）。
patches: {}
