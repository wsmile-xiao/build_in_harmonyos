# conandata.yml - single source of truth for source URL + sha256.
# Read by conanfile.py via self.conan_data["sources"] and apply_conandata_patches().
#
# URL is the official upstream GitHub tag archive (R39). CI automatically
# adds GitHub mirror fallbacks, so no mirror prefix is added here.
sources:
  url: "https://github.com/stefanprodan/kustomizer/archive/refs/tags/v2.2.1.tar.gz"
  sha256: "bba48e2eed5b84111c39b34d9892ffc9f0575b6f6470d50f832f47ff6417bf03"

# No source patches are required: the upstream module builds unchanged with
# the bootstrapped static Go toolchain. The sandbox-specific kube-apiserver
# advertise-address wrapper used for the upstream tests is test-only
# infrastructure (documented in reports/upstream-test-ledger.md), not a
# modification of the upstream sources.
patches: []
