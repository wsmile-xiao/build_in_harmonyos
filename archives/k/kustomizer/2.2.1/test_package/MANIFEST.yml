# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 要求）
# 详见 docs/TEST_QUALITY_SPEC.md
#
# kustomizer 是 Go 命令行应用（将 Kubernetes 配置作为 OCI 制品发布/获取/
# 应用）。上游测试位于 cmd/kustomizer/*_test.go（14 个文件），通过
# `go test ./cmd/kustomizer` 在 envtest 本地控制平面 + 内置本地 registry
# 上运行，共 15 个顶层测试函数 / 37 个子测试。
#
# 上游测试不在普通 conan build 中执行（其依赖完整 Go 工具链与 envtest
# assets），本次适配已用自举 go1.24.13 工具链实际全量运行，逐条结果见
# reports/upstream-test-ledger.md（15/15、37/37，100% 通过）。
# test_package 从消费者视角真实执行被测二进制（R34，非空壳）：
# --version、--help 与离线 build inventory。

package: kustomizer/2.2.1
homepage: "https://github.com/stefanprodan/kustomizer"

# 上游测试命令分析
upstream_check_command: "go test ./cmd/kustomizer"
upstream_test_in_build: false
upstream_test_command: "go test ./cmd/kustomizer"

# 上游实际测试文件（14 个 _test.go）
upstream_tests:
  - file: apply_inventory_test.go
    source: cmd/kustomizer/apply_inventory_test.go
    description: "TestApply: server-side apply/labels/prune/wait/immutable 重建"
    command: "go test -run TestApply"
  - file: build_inventory_test.go
    source: cmd/kustomizer/build_inventory_test.go
    description: "TestBuild: 清单构建与 patch"
    command: "go test -run TestBuild"
  - file: config_view_test.go
    source: cmd/kustomizer/config_view_test.go
    description: "TestConfigView: 配置查看"
    command: "go test -run TestConfigView"
  - file: delete_inventory_test.go
    source: cmd/kustomizer/delete_inventory_test.go
    description: "TestDelete: 创建后删除对象"
    command: "go test -run TestDelete"
  - file: diff_artifact_test.go
    source: cmd/kustomizer/diff_artifact_test.go
    description: "TestDiffArtifact: OCI 制品 push/pull 后 diff"
    command: "go test -run TestDiffArtifact"
  - file: diff_inventory_test.go
    source: cmd/kustomizer/diff_inventory_test.go
    description: "TestDiffInventory: 空/创建/YAML diff"
    command: "go test -run TestDiffInventory"
  - file: get_inventories_test.go
    source: cmd/kustomizer/get_inventories_test.go
    description: "TestGetInventories: inventory 列表/详情"
    command: "go test -run TestGetInventories"
  - file: inspect_artifact_test.go
    source: cmd/kustomizer/inspect_artifact_test.go
    description: "TestInspect: 制品与镜像信息 inspect"
    command: "go test -run TestInspect"
  - file: main_test.go
    source: cmd/kustomizer/main_test.go
    description: "TestMain: envtest 控制平面启停夹具（含 TestGetInventory/TestApplyArtifact/TestApplyEncryptedArtifact）"
    command: "go test ./cmd/kustomizer"
  - file: list_artifact_test.go
    source: cmd/kustomizer/list_artifact_test.go
    description: "TestListArtifact: 版本/预发布列表"
    command: "go test -run TestListArtifact"
  - file: pull_artifact_test.go
    source: cmd/kustomizer/pull_artifact_test.go
    description: "TestPull: 制品 push 后 pull"
    command: "go test -run TestPull"
  - file: push_artifact_test.go
    source: cmd/kustomizer/push_artifact_test.go
    description: "TestPush: 构建并 push 制品"
    command: "go test -run TestPush"
  - file: tag_artifact_test.go
    source: cmd/kustomizer/tag_artifact_test.go
    description: "TestTag: 制品打标签并 pull 验证"
    command: "go test -run TestTag"

# test_package 自带的消费者视角测试（真实执行二进制）
test_package_tests:
  - file: test.sh
    description: "运行 kustomizer --version，断言输出 'kustomizer version 2.2.1'"
    command: "kustomizer --version"
  - file: test.sh
    description: "运行 kustomizer --help，断言子命令列表"
    command: "kustomizer --help"
  - file: test.sh
    description: "离线运行 kustomizer build inventory -f testdata/cm.yaml，断言渲染输出 ConfigMap"
    command: "kustomizer build inventory smoke-app -n smoke-ns -f testdata/cm.yaml"

# 测试断言总数（test_package 内的断言点）
assertion_count: 7
