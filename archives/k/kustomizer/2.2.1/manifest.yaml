software: kustomizer
version: "2.2.1"
status: built
build_date: "2026-10-05"
build_system: go

source:
  url: "https://github.com/stefanprodan/kustomizer/archive/refs/tags/v2.2.1.tar.gz"
  sha256: "bba48e2eed5b84111c39b34d9892ffc9f0575b6f6470d50f832f47ff6417bf03"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOPROXY=https://goproxy.cn,https://goproxy.io,direct"
    - "GOTOOLCHAIN=local"
    - "-trimpath"
    - "-ldflags=-s -w -X main.VERSION=2.2.1"
  dependencies: []
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Go 1.19 official linux-arm64 toolchain is dynamically linked against glibc and cannot run on the OHOS musl-only user space; Go >= 1.20 official linux-arm64 builds are pure-static, so a newer static toolchain (go1.24.13) is bootstrapped instead"
  - "On HarmonyOS every ELF that is executed must be self-signed, including not only bin/go but also the pkg/tool compile/link/asm tools inside the bootstrapped GOROOT"
  - "Older Go-linked ELF layouts fail the signer with a .codesign save error; running GNU strip first normalises section headers and makes signing succeed"
  - "envtest's kube-apiserver must be given --advertise-address=127.0.0.1 in the sandbox because there is no default route for address auto-detection; etcd requires TMPDIR on a fallocate-capable filesystem (/data/storage/el2/base/cache)"
