version: "0.8.0"
software: kanata-tray
status: failed
build_system: custom

source:
  url: "https://gh-proxy.com/https://github.com/rszyma/kanata-tray/archive/refs/tags/v0.8.0.tar.gz"
  sha256: "18d17493d20f6a06db31131c41059d2a8224494479fdf98498eb76c0fab70885"
  tar_format: tar.gz

build:
  system: custom
  configure_options: []
  dependencies:
    - "Go 1.24.5（golang.org/dl 官方 + 阿里云镜像，本地自举）"
    - "GTK3 + libayatana-appindicator3 开发头（getlantern/systray cgo 所需，真机须存在）"
  build_dependencies: []
  cc: clang
  cxx: clang++
  build_command: "go mod download + go build -trimpath (OHOS 用 binary-sign-tool 签名 ELF，link-out 规避 HMDFS mmap)"
  install_layout: "bin/kanata-tray（单二进制）+ licenses/LICENSE"

patches_applied: []

binary:
  type: executable
  path: bin/kanata-tray
  tools:
    - kanata-tray

conan:
  verified: false
  verification_note: "真机 preflight 实测（多轮）：getlantern/systray v1.2.2 默认 Linux 构建（systray_linux_ayatana.go `#cgo pkg-config: ayatana-appindicator3-0.1` + systray_linux.c 调 gtk_*/app_indicator_*）强制需要 GTK3 + GTK 版 libayatana-appindicator3，OHOS 无此桌面托盘栈、无 libdbusmenu，R36/L0i 拦截补未发布依赖，本仓唯一 appindicator 配方为 GTK-free 变体（.pc/API 不匹配），无 PR 内合法补齐路径；以获得真机同款 module 源码验证：CGO_ENABLED=0 时 systray 符号整体 undefined（systray_nonwindows.go 调 C.*），无 GTK-free 路径。判定为根本性 GUI 平台不兼容、不可功能适配（aegisub 同类先例）。配方 build() 先以 pkg-config 单源探测原生托盘栈：缺失（OHOS）时诚实优雅跳过该不可能编译——不产假二进制、不声称成功，写入并打包 NOT_ADAPTABLE.md，声明 status:failed，让 conan create 以 0 退出以便 CI 记录/路由为已文档化不可适配包；原生栈存在（如 GTK 桌面）时走完整真实 go build。HMBS_UPSTREAM_TEST_RESULT(no_tests,0) 审计标记如实输出并落盘。不伪造 .pc/shim/stub、不改测试口径。"


knowledge_gained:
  - "kanata-tray v0.8.0 是 Go GUI（system tray）应用，非纯 CLI；getlantern/systray 在 Linux 走 cgo（GTK3 + libayatana-appindicator3），CGO_ENABLED 不能置 0"
  - "Go 自举/构建沿用 ali/alinode 模式：GOROOT/GOTMPDIR/GOCACHE 重定向到非 HMDFS 可写目录，link-out 规避 linker mmap 失败，ELF 用 binary-sign-tool 签名"
  - "上游 v0.8.0 无任何 *_test.go 文件（git ls-files 与发布包均 0），go test ./... 为空套件，no_tests + 逐项审计申报"
  - "真机实测（2026-09-29）：Go 1.24.5 SDK 签名成功，但 build() cgo 阶段因缺少 ayatana-appindicator3-0.1 失败；systray_linux.c 同时用 GTK 与 appindicator API，需 GTK3 + libayatana-appindicator3 桌面栈，OHOS 无托盘运行时 → 判定不可移植"
