software: kanata-tray
display: "kanata-tray"
description: "A simple wrapper for kanata to control it from a system tray icon (kanata keyboard remapper companion, Go)"
homepage: "https://github.com/rszyma/kanata-tray"
license: GPL-3.0-or-later
category: utility
build_system: custom
ohos_adaptation:
  key_points:
    - "Go GUI（system tray）应用，getlantern/systray v1.2.2 默认 Linux 构建走 cgo，需 GTK3 + libayatana-appindicator3（ayatana-appindicator3-0.1.pc）开发头；CGO_ENABLED 不能置 0"
    - "真机 preflight 实测：Go 1.24.5 SDK 自举+签名成功，但 build() cgo 阶段因 OHOS 缺 libayatana-appindicator3 桌面托盘栈而失败；本仓库无匹配成品配方 → 判定不可移植（详见 0.8.0/notes.md）"
    - "Go linker 输出到可写区 link-out 规避 HMDFS mmap 失败（E051/E046）；ELF 经 binary-sign-tool 签名"
    - "上游 v0.8.0 无任何 *_test.go 文件，go test 为空套件，按 no_tests + 审计申报"
  common_dependencies: []
versions:
  "0.8.0":
    status: failed
    build_date: "2026-09-29"
