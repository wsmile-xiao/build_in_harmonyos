# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: kuba-zip/0.3.2
homepage: "https://github.com/kuba--/zip"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_open.c
    source: zip-0.3.2/test/test_open.c
    description: "zip_open/zip_close 基本打开关闭"
    command: "./test_open.out"
  - file: test/test_read.c
    source: zip-0.3.2/test/test_read.c
    description: "zip_entry_read 读取内容"
    command: "./test_read.out"
  - file: test/test_write.c
    source: zip-0.3.2/test/test_write.c
    description: "zip_entry_write 写入内容"
    command: "./test_write.out"
  - file: test/test_append.c
    source: zip-0.3.2/test/test_append.c
    description: "zip_append 追加条目"
    command: "./test_append.out"
  - file: test/test_extract.c
    source: zip-0.3.2/test/test_extract.c
    description: "zip_extract 解压"
    command: "./test_extract.out"
  - file: test/test_entry.c
    source: zip-0.3.2/test/test_entry.c
    description: "zip_entry 条目遍历"
    command: "./test_entry.out"
  - file: test/test_static.c
    source: zip-0.3.2/test/test_static.c
    description: "静态库链接使用"
    command: "./test_static.out"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者视角写入+读取 roundtrip"
    command: "./test_kuba-zip"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 28
