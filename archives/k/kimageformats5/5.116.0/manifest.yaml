knowledge_gained:
  - "Qt5 imageformats plugins deploy to plugins/imageformats inside the Conan package; Qt discovers them through QCoreApplication::addLibraryPath on OHOS."
  - "zlib version pins conflict across the KDE Qt5 line: qt5-qtbase pins zlib/1.3.1 while libavif's libpng chain pins zlib/1.3.1.1, so AVIF/HEIF plugins cannot coexist in one graph; LibRaw builds codec-free to avoid the same conflict."
  - "openexr consumers on OHOS need imath/libdeflate package lib dirs on LD_LIBRARY_PATH at runtime because the published openexr binaries carry DT_NEEDED absolute paths."
