# 版本级 manifest
# 文件位置: archives/k/kernel-hardening-checker/0.6.17.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.6.17.1"

# 软件名
software: kernel-hardening-checker

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"
build_system: python3

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游 GitHub 官方标签归档）
  url: "https://codeload.github.com/a13xp0p0v/kernel-hardening-checker/tar.gz/refs/tags/v0.6.17.1"

  # 源码校验和
  sha256: "2383e851b44fe74c9a5db32919b897af05f022e676e8d1184cc53594bb9b344c"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（纯 Python，pip/setuptools PEP 517）
  system: python3

  # 配置选项列表
  configure_options:
    - "pip install --no-deps --no-build-isolation --prefix=<staging> <src>"

  # 编译依赖列表（运行时由 Python 环境解析，conan 侧仅需 python 运行时）
  dependencies:
    - python3

  # 构建工具（setuptools>=77.0.3 + wheel，pip 引导安装）
  build_tools:
    - setuptools
    - wheel

  # 编译器（纯 Python 包，实际未使用）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本版本无补丁：上游代码无平台分支，纯 stdlib）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "kernel-hardening-checker 为纯 Python CLI（GPL-3.0-only），运行时依赖闭包为空（纯 stdlib），无 C/C++ 编译"
  - "包内无 __main__.py，python3 -m kernel_hardening_checker 不可用；wrapper 需 import 包后直接调用 main()（上游 bin/ 免安装 launcher 同款方式）"
  - "pyproject 要求 setuptools>=77.0.3；pip staging 安装加 --no-build-isolation 复用设备已装 setuptools 84，避免隔离环境重新下载构建依赖"
  - "pip 生成的 console script shebang 指向构建机 Python 路径，不可迁移；需改写为 /bin/sh wrapper，且 wrapper 自行解析相对 site-packages（CI L2 会裸跑 bin/ 下可执行文件）"
  - "实测上游 wheel 已含全部 94 个 kernel_hardening_checker/config_files/ 样例文件（pyproject 配置模式 include_package_data 默认 True，Curator zipfile 清点 94/94）；recipe 仍从导出源码幂等补拷，为防御式保险（实测 wheel 已含），保证 -c 官方示例配置可用"
  - "functional_test.sh 依赖 /proc/config.gz、/boot、/proc/cmdline、sudo、coverage、tty，OHOS 设备不可原样运行；-a autodetect 在设备必失败，冒烟用 --version/-p/-g/-c"
