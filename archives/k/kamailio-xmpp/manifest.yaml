software: "kamailio-xmpp"
display: "Kamailio XMPP module"
description: "kamailio xmpp 模块（xmpp.so）—— SIP↔XMPP 网关（component/server 形态），XMPP stanza 经 expat 解析；由 kamailio 运行时 loadmodule 加载"
category: "sip-server"
homepage: "https://www.kamailio.org"
license: "GPL-2.0-or-later"
build_system: makefile

ohos_adaptation:
  approach: "1 个上游缺陷修复补丁（xode 空指针）+ make 命令行变量注入平台差异（OS=linux / SCTP=0 / DEFS_RM=-DHAVE_RESOLV_RES / LOCALBASE 钉死 expat 探测）"
  scope: "仅编译打包 kamailio 源码树 src/modules/xmpp（不编译 kamailio 主程序，模块 .so 由运行时 loadmodule 加载）"
  deps:
    - "expat/2.8.2.1.1（**动态**：模块 Makefile 唯一外部依赖 -lexpat；OHOS sysroot 与目标机均无 libexpat ⇒ 非系统同名库，按 R26 口径由 conan 依赖链提供运行时 .so，部署需 LD_LIBRARY_PATH / conanrun 环境；包内 libexpat.so 带 SONAME，消费方 DT_NEEDED 为裸名可重定位）"
  notes: "详细适配记录（含上游 49 项测试逐用例台账与 9 项 FAIL 根因）见 6.0.6/notes.md"

versions:
  "6.0.6":
    status: built
    conan_ref: "kamailio-xmpp/6.0.6"
    build_date: "2026-10-03"
