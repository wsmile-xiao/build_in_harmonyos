# conandata.yml — kamailio-xmpp 6.0.6
#
# 源码取上游官方仓库 tag 归档（GitHub 官方仓库 kamailio/kamailio @ refs/tags/6.0.6）。
#
# 说明 1（选源依据，实测）：kamailio 官网发布包 kamailio-6.0.6_src.tar.gz **不含 test/ 目录**
#         （`tar tzf … | grep -c '^kamailio-6.0.6/test/'` → 0 命中），而本包的上游测试入口位于
#         test/unit/**（49 个 .sh）；为满足 R51「上游测试可核验」，采用官方仓库 tag 归档
#         （含完整 test/ 套件，实测 7731 个条目 / test/unit 109 个条目）。
#         同族先例：kamailio-lua 6.0.6 / kamailio-db 6.0.6 采用同一官方归档端点与同一 sha256。
# 说明 2：采用 github.com 官方归档端点而非 codeload 直连端点 —— codeload.github.com 不在 CI 的
#         mirror-fallback 域名白名单内（ci/conan/build_and_test.sh 的镜像重写正则），Worker 直连会超时；
#         github.com/<owner>/<repo>/archive/refs/tags/<tag>.tar.gz 与 codeload 同路径归档为同一字节
#         （sha256 实测一致：5b8cd435…），且可命中官方镜像回退。本文件只保留官方源，不含镜像域名。
# 说明 3：显式给出 filename，避免镜像/重定向端点的末段路径影响归档类型识别。
sources:
  url: "https://github.com/kamailio/kamailio/archive/refs/tags/6.0.6.tar.gz"
  filename: "kamailio-6.0.6.tar.gz"
  sha256: "5b8cd435aa52137857bbfc27804479b687a495df5634e7d8513b3ff45e98e1b6"

# 1 个补丁：上游 xode 解析器对「无属性元素」的空指针解引用修复（bugfix，非平台相关）。
# 实测依据：expat 2.7.3 与 2.8.2 对无属性元素的 start 回调均传「非 NULL 数组 + atts[0]==NULL」，
# 而 xode_from.c 的 while(*(atts[i]) != '\0') 直接解引用 atts[0] → 段错误；任何无属性元素
# （<body>/<status>/<show> 等）都会触发，故必须修复才能交付可用模块。详见 notes.md。
# OHOS 平台适配本身（OS=linux / SCTP=0 / DEFS_RM=-DHAVE_RESOLV_RES / LOCALBASE）经 make 变量完成，
# 不产生补丁；平台宏未进入本补丁（补丁与平台无关，全局生效）。
patches:
  - patch_file: "patches/0001-src-modules-xmpp-xode_from.c.patch"
    patch_description: >-
      xode_from.c _xode_put_expatattribs(): guard atts[i] against NULL before
      dereferencing (expat passes a non-NULL array whose first element is NULL
      for elements without attributes) — fixes SIGSEGV on any attribute-less
      XML element.
    patch_type: "bugfix"
