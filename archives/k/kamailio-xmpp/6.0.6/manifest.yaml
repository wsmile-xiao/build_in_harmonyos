# 版本级 manifest
# 文件位置: archives/k/kamailio-xmpp/6.0.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-xmpp"
status: built
build_date: "2026-10-03"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方仓库 tag 归档（含 test/ 树；官网 src 包不含 test/，实测 0 命中）
  url: "https://github.com/kamailio/kamailio/archive/refs/tags/6.0.6.tar.gz"
  sha256: "5b8cd435aa52137857bbfc27804479b687a495df5634e7d8513b3ff45e98e1b6"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  # kamailio 经典 Makefile 体系：make cfg + make modules（模块级构建）
  configure_options:
    - "make cfg include_modules=xmpp OS=linux SCTP=0 DEFS_RM=\"-DHAVE_RESOLV_RES\" LOCALBASE=<expat pkg> BUILDER="
    - "make modules modules=modules/xmpp -j1 （同上口径）"
  dependencies:
    - expat/2.8.2.1.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-src-modules-xmpp-xode_from.c.patch"

patch_classification:
  - file: 0001-src-modules-xmpp-xode_from.c.patch
    type: bugfix
    platform_only: False
    guard: none   # 上游缺陷修复与平台无关（expat 语义全平台一致）；按 R8 口径不加平台宏
