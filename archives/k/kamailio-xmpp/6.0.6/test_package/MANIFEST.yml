# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: kamailio-xmpp/6.0.6
homepage: "https://www.kamailio.org"

# 上游测试命令（R51 三步法：清点 → 实跑 → 回填；逐项证据与失败根因见 ../notes.md §6）
#
# 【清点】源码取自官方仓库 tag 归档 kamailio-6.0.6.tar.gz（sha256 5b8cd435…，与 conandata.yml 一致）：
#   - 上游测试入口为 **test/unit/*.sh 共 49 个**（shell 集成用例，逐个启动 kamailio 二进制加载
#     SIP 配置并断言退出码）；test/unit 目录实测 109 个条目。
#   - **无 make check 目标、无 ctest / pytest 注册**（src/Makefile 未注册测试目标；
#     test/README.md 自述 under development）。
#   - 官网发布包 kamailio-6.0.6_src.tar.gz **不含 test/ 树**（实测 `grep -c '^kamailio-6.0.6/test/'` = 0），
#     故选源改用官方仓库 tag 归档，使上游测试入口随源码可核验。
#   - 运行前置：需完整 kamailio 主程序（src/kamailio）+ 模块树；部分用例还需外部工具
#     sipsak / sipp / netcat 与 DB 驱动模块（db_mysql / db_postgres / db_unixodbc / db_berkeley）。
#
# 【实跑】OHOS PC aarch64（完整 core 由探索性构建树产出，见 notes.md §3.2/§4.1）：
#   49/49 **全量执行** → OK=5 / FAIL=9 / SKIP=35 / TIMEOUT=0（通过率 5/49 = 10.2%）。
#   9 项 FAIL 逐个复现取真实首错，均为环境能力缺口或上游用例与 6.0.6 工具链漂移，非本包产物缺陷；
#   未修改任何上游用例。逐项台账：kamailio-xmpp-6.0.6-evidence/logs/40_upstream_tests_summary.tsv。
#
# 【本包产物口径】只编译打包 src/modules/xmpp → xmpp.so（7 秒级模块级构建），
#   上游 test/unit 需要完整 kamailio 主程序，故**不在 conanfile.py build() 内执行**
#   （build() 只做模块构建 + 产物存在性校验）；上游测试在适配期独立全量执行并如实回填。
upstream_check_command: "cd test/unit && ./<N>.sh（49 个；无 make check / ctest / pytest 入口）"
upstream_test_in_build: false
upstream_test_command: "bash 40_run_upstream_tests.sh（49/49 全量执行，须先构建完整 kamailio 主程序）"

# 上游测试清单（test/unit 全量 49 项，逐项结果见 ../notes.md §6.3 表）
upstream_tests:
  - file: test/unit/*.sh
    source: kamailio-6.0.6.tar.gz/test/unit/
    description: "上游 49 个 shell 集成用例（最小配置启动 / 模块装载 / DB 与 SIP 场景 / RPC 与伪变量）"
    command: "timeout 120 <interp> ./<N>.sh  （按 shebang 选 /bin/sh 或 hnp bash）"
    cases: 49
    executed: true
    result: "49/49 全量执行 → OK=5（1/3/9/24/60）/ FAIL=9（4/5/6/7/8/10/14/15/18）/ SKIP=35 / TIMEOUT=0"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: check_module.py
    description: >-
      产物与鸿蒙平台契约 19 项：ELF64/ET_DYN/AArch64、装载契约串
      （SER_FULL_VERSION=kamailio 6.0.6 (aarch64/linux) 与 SER_COMPILE_FLAGS：
      USE_TCP/F_MALLOC 在、USE_SCTP/HAVE_RESOLV_RES 不在——core/sr_module.c 严格 strcmp 项）、
      core 契约符号与 exports 接口表动态导出、expat 链接证据（NEEDED 含 libexpat.so +
      未解析 XML_* + 无本地桩顶替）、NEEDED 全裸名可重定位/无 glibc 专名库/无 RPATH·RUNPATH、
      COPYING 与模块 README 随包。其中 9 项为鸿蒙专项（标注 [H]）。
    command: "python3 check_module.py"
  - file: test_consumer.c
    description: >-
      消费者用例 12 项（鸿蒙运行时实测）：dlopen libexpat.so → dlopen xmpp.so(RTLD_NOW，全部重定位当场解析)
      → dlsym 契约符号（module_version/module_flags 按 core 口径作 char ** 数据符号）→
      经 dlsym 真实调用模块自身 XMPP stanza 解析 API：xode_from_str → xode_get_name /
      xode_get_attrib / xode_get_tagdata / xode_to_str / xode_free（内部走 expat XML_ParserCreate/XML_Parse），
      并含非法 XML 负例（必须返回 NULL）。core 符号桩由 nm 未解析表生成，排除依赖库导出符号
      （expat 的 XML_*）与本进程可解析符号；桩与二进制生成在 $TMPDIR 并在 test() 结束清理。
    command: "LD_LIBRARY_PATH=<expat pkg>/lib ./test_consumer <xmpp.so>"

# 测试断言总数（check_module.py 19 项 + test_consumer.c 12 项 = 31，实测 31 PASS / 0 FAIL）
assertion_count: 31
