# 版本级 manifest — kernel-headers 6.12.77
# 遵循 ARCHIVE-SPEC v2.0

version: "6.12.77"
software: "kernel-headers"

# 编译状态: published | built | failed | archived
#（当前 built：conan create + test_package 实测通过，未 upload）
status: built

build_date: "2026-09-18"
build_system: kernel-kbuild-headers

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 kernel.org tarball + 清华 TUNA 镜像 fallback（url 列表形态）
  url: "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.77.tar.xz"
  mirror:
    - "https://mirrors.tuna.tsinghua.edu.cn/kernel/v6.x/linux-6.12.77.tar.xz"
  sha256: "358836ebe5caef41e7ae9492e7fbcdf5be6e53ee43c99752aebda81e1b2cff67"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: kernel-kbuild-headers
  # make ARCH=arm64 HOSTCC=clang O=<build> headers（HDRINST 阶段）
  # + 配方 package() 阶段 conan copy *.h（替代末步 rsync，worker 无 rsync）
  configure_options:
    - "ARCH=arm64"
    - "HOSTCC=clang"
    - "O=<build_folder> (out-of-tree)"
    - "headers (HDRINST export pipeline)"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试统计
# ============================================================

test_summary:
  # 上游 kbuild 构建系统无测试目标注册（headers_check 已于 6.12 移除）
  upstream_registered_targets: 0
  upstream_passed: 0
  upstream_failed: 0
  upstream_test_note: "Linux kernel 6.12 构建系统无测试套件注册：headers_check 目标已从顶层 Makefile 移除（grep 实证），仅存 headers_install/headers 导出目标；导出管线自带 scripts/headers_install.sh 逐头清洗校验随 make headers 一体执行"
  test_package_passed: 1
  test_package_failed: 0
  exported_headers: 963

# ============================================================
# 产物形态
# ============================================================

package:
  type: header-library
  exports: "include/ 下 963 个 UAPI 头文件（linux/ asm/ asm-generic/ drm/ misc/ mtd/ rdma/ regulator/ scsi/ sound/ video/ xen/）"
  version_macro: "LINUX_VERSION_CODE=396365 (6.12.77)"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Linux 内核 UAPI 头文件包：make ARCH=arm64 headers 即导出（HDRINST 阶段），纯头文件交付 package_type=header-library"
  - "kbuild headers_install 末步依赖 rsync（Makefile:1299），OHOS worker 无 rsync → 配方 package() 用 conan copy('*.h') 等价替代"
  - "worker 无 gcc，HOSTCC=clang 编译 fixdep/unifdef 宿主工具实测通过；make[1]: gcc not found 是 sub-make 版本探测 warning 不致命（rc=0）"
  - "O= out-of-tree 必须从干净源码跑：曾跑过 in-tree 构建的源码树 make clean 不会清 usr/include，二次构建产物头文件数不一致（944 vs 963）"
  - "arm64 语义：include/uapi/Kbuild 对 arch 有 generated/uapi/asm/kvm_para.h wrapper 时 no-export-headers 排除 linux/kvm_para.h；asm/*.h 为 #include <asm-generic/xxx.h> wrapper 形态"
  - "conan get() 原生支持 conandata url 列表做镜像 fallback（先例 compile-time-regular 3.11.0）；华为云 kernel 镜像实测返回 WAF HTML 拦截页不可用，TUNA 实测 sha256sums.asc 与官方一致"
