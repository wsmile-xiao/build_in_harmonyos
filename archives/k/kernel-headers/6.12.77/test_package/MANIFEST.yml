# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kernel-headers/6.12.77
homepage: "https://kernel.org"

# 上游测试命令（Linux kernel 6.12 构建系统无测试套件注册：
# headers_check 目标已在 5.x 后从顶层 Makefile 移除，6.12 仅有
# headers_install/headers 导出目标，无 add_test/ctest 等价注册）
upstream_check_command: "make ARCH=arm64 headers (导出管线本身；无注册测试目标，N=0)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "N/A — 上游构建系统（kbuild）无测试目标注册（headers_check 已移除）；导出管线自带的 scripts/headers_install.sh 逐头清洗校验随 make headers 一体执行"

# 上游实际执行的测试（kbuild 无测试注册 → 空列表，N=0 如实申报）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_kernel_headers.c
    description: "消费者冒烟：编译期 #error 断言版本一致性（LINUX_VERSION_CODE == KERNEL_VERSION(6,12,77)）+ 交叉编译下 linux/version.h、linux/types.h（__u16/__u32）、linux/input.h（struct input_id/BUS_USB/KEY_A）、linux/input-event-codes.h、linux/if_ether.h（ETH_P_IP）、linux/ioctl.h（_IOC 宏）、asm/byteorder.h、asm/posix_types.h、asm/unistd.h（__NR_io_setup）联合编译 + 运行期断言退出码 0"
    command: "./test_kernel_headers"

# 编译期断言 2 个（#error 版本一致性 + 宏存在性）+ 运行期断言 8 项
assertion_count: 10
