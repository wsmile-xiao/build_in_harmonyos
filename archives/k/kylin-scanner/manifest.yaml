software: kylin-scanner
display: "kylin-scanner"
description: "openKylin 麒麟扫描软件：基于 Qt5 的扫描仪图形应用，含图像后处理与 OCR"
category: utility
homepage: "https://gitee.com/openkylin/kylin-scanner"
license: GPL-3.0-or-later
build_system: qmake

ohos_adaptation:
  key_points:
    - "上游 qmake 工程保留原构建系统，使用制品仓 qt5-qtbase/5.15.2.2 提供的 qmake/moc/uic/rcc 交叉构建"
    - "移除 src.pro 中 pkg-config（gio/opencv4）与硬编码 x86_64 sane 路径，改为 Conan 依赖包路径经 qmake 命令行 INCLUDEPATH/LIBS 注入"
    - "移除安装到 /usr 的 INSTALLS 目标，由 Conan package() 收集 bin 与资源文件"
    - "OHOS 平台对产物可执行文件进行代码签名"
  common_dependencies:
    - qt5-qtbase/5.15.2.2
    - glib/2.84.0.2
    - opencv/4.12.0
    - leptonica/1.87.0
    - tesseract/5.5.3
    - sane-backends/1.2.1

versions:
  "1.0.0":
    status: published
    build_date: "2026-09-03"
    conan_ref: "kylin-scanner/1.0.0"
    source_url: "https://gitee.com/openkylin/kylin-scanner/releases/download/debian/1.0.0-2/kylin-scanner_1.0.0.orig.tar.gz"
