package: kylin-scanner/1.0.0
homepage: "https://gitee.com/openkylin/kylin-scanner"
upstream_check_command: "无（上游无自动化测试套件）"
upstream_test_in_build: false
upstream_test_command: "无"
upstream_tests: []
# 上游仓库无 tests/ 目录、无 ctest/pytest 注册项，工程内未发现任何自动化测试代码。
test_package_tests:
  - file: conanfile.py
    description: "冒烟测试：实跑被测 GUI 二进制 kylin-scanner（QT_QPA_PLATFORM=offscreen），验证二进制可加载全部依赖库（Qt5/glib/opencv/leptonica/tesseract/sane/libxml2）并完成 Qt 初始化"
    command: "./kylin-scanner"
    assertion_count: 1
  - file: consumer_test.sh
    description: "消费者用例（端到端）：启动 kylin-scanner 应用并验证其在 offscreen 模式下稳定运行 10s 无崩溃，验证资源文件完整性（翻译/图标/桌面文件），随后正常终止应用"
    command: "./consumer_test.sh <bin_path> 10"
    assertion_count: 3
# 计数口径：冒烟测试 1 项（二进制加载全部依赖并初始化） + 消费者用例 3 项（资源完整性检查 + 启动运行 + 稳定运行 10s 无崩溃）
