patches:
  "1.0.0":
    - patch_file: "patches/0001-fix-pro-deps-and-install-paths.patch"
      patch_description: "Remove pkg-config/hardcoded x86 sane paths from src.pro; drop /usr install targets (Conan manages packaging)"
      patch_type: "portability"
    - patch_file: "patches/0002-make-lockfile-path-configurable.patch"
      patch_description: "Allow QLockFile path override via KYLIN_SCANNER_LOCK_FILE env var (OHOS /tmp is read-only)"
      patch_type: "portability"
