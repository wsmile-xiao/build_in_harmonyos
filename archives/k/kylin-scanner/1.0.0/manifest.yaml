version: "1.0.0"
software: "kylin-scanner"
status: published
build_date: "2026-09-03"
build_system: qmake

source:
  url: "https://gitee.com/openkylin/kylin-scanner/releases/download/debian/1.0.0-2/kylin-scanner_1.0.0.orig.tar.gz"
  sha256: "5be51b6769ce65b1056884afa71448acda69050d36e2c13f88880ef3d3551d47"
  tar_format: tar.gz

build:
  system: qmake
  configure_options:
    - "qmake -spec linux-clang kylin-scanner.pro（依赖路径经 INCLUDEPATH+=/LIBS+= 注入）"
  dependencies:
    - qt5-qtbase/5.15.2.2
    - glib/2.84.0.2
    - opencv/4.12.0
    - leptonica/1.87.0
    - tesseract/5.5.3
    - sane-backends/1.2.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-pro-deps-and-install-paths.patch"

preflight:
  zlib_override: "zlib/1.3.1.1（对齐 glib 与 qt5-qtbase 的版本冲突）"
  expat_override: "expat/2.8.2.1（对齐 fontconfig 与 dbus 的版本冲突）"
  openssl_override: "openssl/3.5.6.1（对齐 curl 与 ffmpeg 的版本冲突）"

knowledge_gained:
  - "QMake Qt5 应用可复用制品仓 qt5-qtbase 的 bin/qmake（需 _fix_qtbase_paths 修正 qt.conf/.pri 可重定位路径）"
  - "src.pro 的 pkg-config 依赖可用 qmake 命令行 INCLUDEPATH+=/LIBS+= 从 Conan 依赖包注入，避免交叉环境 pkg-config"
