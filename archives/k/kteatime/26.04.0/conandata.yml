patches:
  "26.04.0":
    - patch_file: "patches/0001-kteatime-no-tray-and-notifyconfig.patch"
      description: "裁减依赖 Qt6 DBus 的托盘与通知配置：Qt6 DBus 未发布到 ohpcd（qtbase FEATURE_dbus=OFF），KStatusNotifierItem 是 StatusNotifierWatcher 的 DBus 客户端且 OHOS 无系统托盘、KNotifyConfigWidget 同样依赖 DBus 通知配置——TopLevel 基类 KStatusNotifierItem→QWidget、托盘 API no-op、移除『配置通知』菜单项（通知由 KNotification 承担）；根/子 CMakeLists 移除 KF6::StatusNotifierItem 与 KF6::NotifyConfig"
    - patch_file: "patches/0002-settings-include-qwindow.patch"
      description: "src/settings.cpp 第 70 行 resize(windowHandle()->size()) 的 QWindow 在 OHOS 头文件集下仅前置声明（<QWidget> 传递包含未带上 <QWindow>，Ubuntu 下恰好被其他传递包含补齐）→ member access into incomplete type 'QWindow' 编译失败（CI #60814 实测）。补 #include <QWindow>（QtGui/qwindow.h 提供完整类型，QTBUG-40584 workaround 所需）"
