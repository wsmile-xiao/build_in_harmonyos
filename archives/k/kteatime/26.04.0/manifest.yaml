# 版本级 manifest — kteatime 26.04.0
# 位置: archives/k/kteatime/26.04.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "26.04.0"
software: kteatime
status: built
build_date: "2026-09-03"
build_system: cmake

source:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/kteatime-26.04.0.tar.xz"
  sha256: "9d5dcd070c34c18374f087d14a65ae2d69d3c75cf27f2f8a96365ae6203a2c3a"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=HarmonyOS"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DUSE_DBUS=OFF"
    - "-DKF_SKIP_PO_PROCESSING=ON"
  dependencies:
    - qtbase/6.11.1
    - kconfig/6.14.0
    - kcoreaddons/6.14.0
    - kcrash/6.14.0
    - kguiaddons/6.14.0
    - ki18n/6.14.0
    - kiconthemes/6.14.0
    - knotifications/6.14.0
    - ktextwidgets/6.14.0
    - kxmlgui/6.14.0
    - ecm/6.20.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-kteatime-no-tray-and-notifyconfig.patch"

knowledge_gained:
  - "Qt6 DBus 未发布到 ohpcd（qtbase FEATURE_dbus=OFF）：KStatusNotifierItem 是 StatusNotifierWatcher 的 DBus 客户端、KNotifyConfigWidget 依赖 DBus 通知配置，二者无法构建——裁减为 QWidget 基类 + 托盘 API no-op，通知由 KNotification 承担（同 ktextwidgets 的 USE_DBUS=OFF 先例）"
  - "KF_SKIP_PO_PROCESSING=ON：lconvert 在本平台加载 libQt6Core 失败，.qm 翻译目录非必需"
  - "ECM_MODULE_PATH 须手工设置：CMakeDeps 生成的 ECMConfig.cmake 不传播该变量（同 kxmlgui 配方）"
