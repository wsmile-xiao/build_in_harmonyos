# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游 kteatime 26.04.0 无任何测试用例：源码树无 tests/ 目录、无 *test*
# 源文件、顶层/子 CMakeLists 无 test 目标（纯 Qt Widgets GUI 小工具，
# KDE Gear release-service 26.04.0）。如实申报 0 用例（不虚报不伪造）。
# 适配后按模板补全 smoke test：test() 中以 QT_QPA_PLATFORM=offscreen
# 真实运行安装后的 kteatime 二进制（--version 经 KAboutData 打印版本并
# 退出 0，验证可执行 + Qt6/KF6 共享库依赖可解析）。

package: kteatime/26.04.0
homepage: "https://invent.kde.org/utilities/kteatime"

# 上游测试命令 (用于 ctest -N / make check 分析)
# 上游无测试目标：ctest -N 无可用测试
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游无测试用例（0 个），无可集成；如实声明 false
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（0 个，如实申报）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# L0c 修复（2026-09-25）：新增测试源文件 test_kteatime.py，test() 改经
# 脚本真实运行（此前仅 conanfile.py 内联 self.run，L0c 判
# "No test source files in test_package/"）；L0k 修复：软件级
# archives/k/kteatime/commands.json（type: tool，登记 kteatime 可执行）。
test_package_tests:
  - file: test_kteatime.py
    description: "消费者冒烟测试（L0c 测试源文件）：QT_QPA_PLATFORM=offscreen 真实运行 kteatime --version（KAboutData 打印版本退出 0；验证二进制可执行、Qt6/KF6 依赖解析），非 0 退出码/超时 → FAIL，subprocess.run(timeout=60) 兜底（不用 shell timeout 命令，OHOS worker 无此命令）"
    command: "python3 test_kteatime.py（test() 内经 conanrun env 调用）"
  - file: conanfile.py
    description: "test() 调用 test_kteatime.py（L0c 测试源入口，self.run + conanrun env + QT_QPA_PLATFORM=offscreen）"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 0 用例；适配后补全 smoke test 1 项
assertion_count: 1
