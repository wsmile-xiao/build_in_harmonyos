software: kteatime
display: "KTeaTime"
description: "KDE tea timer - tea steeping reminder utility"
category: utils
homepage: "https://invent.kde.org/utilities/kteatime"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "Qt6 Widgets + KF6 组件应用；Qt6 DBus 未发布到 ohpcd，依赖 DBus 的 KStatusNotifierItem（系统托盘）/KNotifyConfigWidget（通知配置）已裁减：TopLevel 基类 KStatusNotifierItem→QWidget、托盘 API no-op、移除『配置通知』菜单项"
    - "KF_IGNORE_PLATFORM_CHECK=TRUE（OHOS 不在 KDE 平台列表）；USE_DBUS=OFF；KF_SKIP_PO_PROCESSING=ON（lconvert 加载 libQt6Core 失败，.qm 非必需）"
    - "ECM_MODULE_PATH 手工设置（CMakeDeps 的 ECMConfig.cmake 不传播）+ conan_cmakedeps_paths.cmake（qtbase cmake_find_mode=none，find_package(Qt6 CONFIG) 需手工路径）"
  common_dependencies:
    - qtbase
    - kconfig
    - kcoreaddons
    - kcrash
    - kguiaddons
    - ki18n
    - kiconthemes
    - knotifications
    - ktextwidgets
    - kxmlgui

versions:
  "26.04.0":
    status: built
    build_date: "2026-09-03"
