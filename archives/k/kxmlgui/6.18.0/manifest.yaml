knowledge_gained:
  - "kxmlgui 6.18.0 requires Qt6Widgets, Qt6Xml, Qt6Network, Qt6CorePrivate, and the upper KF widget stack."
  - "Qt6PrintSupport is removed from the OHOS build by patching CMake, not exposing the KShortcutsDialog Print action, and leaving the internal print slot inert."
  - "FORCE_DISABLE_KGLOBALACCEL=ON, USE_DBUS=OFF, BUILD_DESIGNERPLUGIN=OFF, BUILD_PYTHON_BINDINGS=OFF, and KF_SKIP_PO_PROCESSING=ON keep optional integrations out of the initial Akonadi baseline."
  - "KDEPrivate::initializeLanguages may not make QLocale::system() switch to the application-specific LANGUAGE value on the runner; the autotest now uses a runtime skip for that single row instead of adding an OHOS platform macro."
