# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kxmlgui/6.26.0.

package: kxmlgui/6.26.0
homepage: https://invent.kde.org/frameworks/kxmlgui

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kxmlgui-6.26.0/autotests/
    description: "KXmlGui upstream CTest/autotests suite"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON; one QLocale application-language row is skipped only when the runtime language update is not observed"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke constructs KXmlGuiWindow through KF6::XmlGui."
    command: "conan create (test_package builds and runs test_kxmlgui)"

assertion_count: 1
