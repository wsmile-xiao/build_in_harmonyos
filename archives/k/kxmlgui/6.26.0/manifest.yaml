software: kxmlgui
version: "6.26.0"
status: built
build_system: cmake
created_at: 2026-09-19
dependencies:
  required:
    - qtbase/6.11.1
    - kconfig/6.26.0
    - kconfigwidgets/6.18.0
    - kcoreaddons/6.26.0
    - kguiaddons/6.26.0
    - ki18n/6.26.0
    - kiconthemes/6.26.0
    - kitemviews/6.26.0
    - kwidgetsaddons/6.26.0
    - openssl/3.5.6.1
    - zstd/1.5.7
  build:
    - ecm/6.26.0
  optional:
    - qtdbus
    - kglobalaccel
    - qttools
    - qtprintsupport
    - shiboken6
    - pyside6
  overrides:
    - kconfigwidgets/6.18.0 transitive KF6 deps are overridden to the 6.26.0
      line (kconfig/kcoreaddons/kguiaddons/ki18n/kwidgetsaddons/kcolorscheme/
      kcodecs at 6.26.0) so the dependency graph resolves without version
      conflicts
patches_applied:
  - patches/0001-CMakeLists.txt.patch
  - patches/0002-src-CMakeLists.txt.patch
  - patches/0003-src-kshortcutseditor.cpp.patch
  - patches/0004-autotests-kxmlgui_unittest.cpp.patch
test_results:
  type: see notes
  upstream: "N=82 (reviewer-measured declaration): autotests/ 6 CTest targets with 62 QTest functions (36 data rows expanded, 104 executed assertion groups all passed on local arm64 OHOS offscreen) + tests/ 8 manual GUI verification programs (startup run rc=0) + krichtexteditor 1 exemption (KTextWidgets not published, upstream QUIET lookup skips the subdirectory)"
  test_package: "consumer smoke: KXmlGuiWindow constructed through KF6::XmlGui (real API, R34)"
source_url: https://download.kde.org/stable/frameworks/6.26/kxmlgui-6.26.0.tar.xz
source_sha256: 4383855cea5a7f9a269c72dda15490b8d70c1d23d17950963937332fc5d6b7a0
knowledge_gained:
  - "kxmlgui 6.26.0 raises the Qt minimum to 6.9.0 and the KF6 dependency floor to 6.26.0; qtbase 6.11.1 satisfies the Qt side."
  - "kconfigwidgets is only published at 6.18.0 on ohpcd; the find_package floor is lowered via patch and the conan graph uses override=True on the transitive KF6 deps to keep a single 6.26 copy of each library."
  - "kiconthemes/6.26.0 ships both libKF6IconThemes.so and libKF6IconWidgets.so (src/widgets split); KF6IconThemesTargets.cmake defines the KF6::IconWidgets imported target, so kxmlgui's KF6::IconWidgets link needs no extra find_package."
  - "Qt6PrintSupport is removed from the OHOS build by patching the top-level find_package, the private link item, and the KShortcutsDialog Print action; the internal print slot is left inert."
  - "autotests/kxmlgui_unittest.cpp skips one locale behavior row only when a runtime check shows that setting the application-specific language does not change QLocale::system()."
