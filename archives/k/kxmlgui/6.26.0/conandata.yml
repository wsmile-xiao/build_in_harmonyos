# conandata.yml - kxmlgui 6.26.0
# Based on the 6.18.0 recipe (same OHOS adaptation set, updated for the
# KF6 6.26 dependency line).

sources:
  url: "https://download.kde.org/stable/frameworks/6.26/kxmlgui-6.26.0.tar.xz"
  sha256: "4383855cea5a7f9a269c72dda15490b8d70c1d23d17950963937332fc5d6b7a0"

patches:
  "6.26.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "0001 drop Qt6PrintSupport from the top-level find_package; lower the KF6ConfigWidgets dependency floor to the published 6.18.0 cap in both the project CMakeLists.txt and the exported KF6XmlGuiConfig.cmake.in template"
      patch_type: "portability"
    - patch_file: "patches/0002-src-CMakeLists.txt.patch"
      patch_description: "0002 drop the private Qt6::PrintSupport link item from KF6XmlGui"
      patch_type: "portability"
    - patch_file: "patches/0003-src-kshortcutseditor.cpp.patch"
      patch_description: "0003 remove the QPrinter/QPrintDialog based printShortcuts implementation and the KShortcutsDialog Print button (Qt6PrintSupport not published to ohpcd)"
      patch_type: "portability"
    - patch_file: "patches/0004-autotests-kxmlgui_unittest.cpp.patch"
      patch_description: "0004 skip the QLocale application-language autotest row when the runtime locale is not updated by KDEPrivate::initializeLanguages"
      patch_type: "portability"
