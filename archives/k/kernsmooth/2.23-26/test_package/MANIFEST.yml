# test_package/MANIFEST.yml
# 上游官方测试声明文件 — kernsmooth 2.23-26
# 上游测试 = CRAN R 包测试（tests/bkfe.R + tests/locpoly.R），
# 依赖 R 解释器与 carData 包，本环境无 R（r-base 未发布），无法运行，
# 由 test_package 的 C 数值测试替代（R34 实质调用 libkernsmooth.a API）。

package: kernsmooth/2.23-26
homepage: "https://cran.r-project.org/package=KernSmooth"

# 上游测试命令（R 包无 ctest/make check，安装时无测试步骤）
upstream_check_command: "R CMD check（需 R 环境，不可用）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（R 脚本，需 R 解释器 + carData，无法在本环境执行）
upstream_tests:
  - file: tests/bkfe.R
    source: kernsmooth-2.23-26/tests/bkfe.R
    description: "bkfe() 与 bkde2D() 回归测试（R 脚本，需 R，无法运行）"
    command: "Rscript tests/bkfe.R（不可用）"
  - file: tests/locpoly.R
    source: kernsmooth-2.23-26/tests/locpoly.R
    description: "locpoly() 回归测试（R 脚本，需 R + carData，无法运行）"
    command: "Rscript tests/locpoly.R（不可用）"

# test_package 中自带的测试（消费者视角验证，R34 实质调用）
test_package_tests:
  - file: test_kernsmooth.c
    description: "C 程序实质调用 linbin_/rlbin_/locpol_ 并验证数值（17 项断言）"
    command: "./test_kernsmooth"

# 测试断言总数（C 数值测试 17 项 + linbin/rlbin/locpol 输出检查）
assertion_count: 17
