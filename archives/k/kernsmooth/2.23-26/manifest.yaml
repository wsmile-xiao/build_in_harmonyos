# 版本级 manifest — kernsmooth 2.23-26
version: "2.23-26"
software: "kernsmooth"

# 编译状态: built（本地 conan create + test_package 通过；待 PR 合并后 CI upload 转 published）
status: built
build_date: "2026-09-24"
build_system: "custom-fortran-static-lib"

# 源码信息
source:
  url: "https://cran.r-project.org/src/contrib/Archive/KernSmooth/KernSmooth_2.23-26.tar.gz"
  sha256: "b465bdac197f7faa787e625412ae03d1b7c2c134b1c924cfeb775faf9c4da73e"
  tar_format: tar.gz

build:
  # 非标准构建：flang 直接编译 Fortran 77 源码为静态库（R CMD INSTALL 路线不可用）
  system: custom
  configure_options: []
  # 编译依赖
  dependencies:
    - openblas/0.3.33
    - flang-ohos/20.1.0
  # 编译器：C 侧 clang；Fortran 侧 flang（tool_requires flang-ohos/20.1.0）
  cc: clang
  cxx: clang++
  fortran: flang

# 补丁信息
patches_applied:
  - "0001-add-linpack-dqrdc.f.patch"
  - "0002-add-linpack-dqrsl.f.patch"

# 知识沉淀
knowledge_gained:
  - "kernsmooth 是 CRAN R 包（KernSmooth），r-base/4.5.1 未发布到 ohpcd，R CMD INSTALL 路线不可行，改走独立 Fortran 数值库路线"
  - "src/ 下 11 个 F77 文件除 LINPACK dgefa/dgesl/dgedi 外全部编译为静态库；init.c 是 R glue（依赖 R 头文件）不编译"
  - "blkest.f/cp.f 依赖 LINPACK dqrdc/dqrsl，openblas 与 lapack 制品均不提供（LAPACK 只有 dgeqrf），必须自带 netlib 公共领域源码"
  - "flang 20.1.0 对 F77 符号按小写+下划线 mangling（locpol -> locpol_），参数按引用传递"
  - "kernsmooth Fortran 代码纯数值计算，无 R 依赖，可独立编译为静态库供 C/C++ 调用"
