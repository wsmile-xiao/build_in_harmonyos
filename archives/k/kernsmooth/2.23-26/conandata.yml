patches:
  - patch_file: "patches/0001-add-linpack-dqrdc.f.patch"
    patch_description: "添加 netlib LINPACK 公共领域例程 dqrdc.f 到 src/：blkest.f 与 cp.f 通过 call dqrdc 依赖该符号，而 openblas/0.3.33 与 lapack/3.12.1 均不提供（LAPACK 只有 dgeqrf，无 dqrdc/dqrsl）。本地实测 openblas+lapack 链接 dqrdc_ 报 undefined symbol 后确认必须自带。"
    patch_type: "portability"
  - patch_file: "patches/0002-add-linpack-dqrsl.f.patch"
    patch_description: "添加 netlib LINPACK 公共领域例程 dqrsl.f 到 src/：与 dqrdc 配套，blkest.f/cp.f 的 call dqrsl 依赖该符号。"
    patch_type: "portability"
