patches:
  "1.109.0":
    - patch_file: "patches/0001-mimalloc-disable-override.patch"
      patch_description: >-
        Disable the mimalloc `override` feature. On HarmonyOS the MI_MALLOC_OVERRIDE
        path replaces the system malloc/free, which conflicts with the platform
        memory manager and makes the binary crash (SIGSEGV, exit 139) before main()
        — matches knowledge entry E210. Keeping mimalloc as a regular allocator
        (without override) builds and runs correctly.
      patch_type: "portability"
      sha256: "c4b685873c369ef84ed329e1bc87c8a488d65965468e19b6d53deb04bab9479e"
