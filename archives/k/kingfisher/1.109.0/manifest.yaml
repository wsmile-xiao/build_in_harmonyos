# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "R47 语言预检：mongodb/kingfisher 主体为 Rust/cargo（源文件 271 个主体占比 90%），如实按 --lang rust 适配；vendor/vectorscan-rs 的 795 个 C/C++ 属 vendored 第三方引擎，不改变主体语言判定"
  - "mimalloc override feature 在 HarmonyOS 上导致启动期 SIGSEGV（exit 139）：MI_MALLOC_OVERRIDE 覆盖系统 malloc/free 与平台内存管理冲突（E210）。注意 rustc 在本目标上 target_os=linux、target_env=ohos，故上游 any(..., target_os=\"linux\", ...) 条件恒真——仅 --no-default-features 关不掉 mimalloc，必须改造 override feature"
  - "OHOS SDK 工具链的 CMAKE_SYSTEM_PROCESSOR 未进 CMake 缓存（且 `set(UNIX TRUE CACHE BOOL FROCE)` 拼写错误），aws-lc-sys 因此推导 ARCH=generic 并静默跳过全部 s2n-bignum .S 汇编，链接期报 undefined aws_lc_0_41_0_bignum_copy_row_from_table / ChaCha20_ctr32_neon；overlay 中 CACHE FORCE 钉住 CMAKE_SYSTEM_PROCESSOR=aarch64 即修复（同类：martin/1.13.0、hf-mount/0.9.0，但本次定位到 ARCH=generic 的确切机制）"
  - "OHOS SDK llvm/bin 有 llvm-ar 但缺 llvm-ranlib；用 `exec llvm-ar s \"$@\"` 包装即可满足 CMake 的 ranlib 调用"
  - "vendored Vectorscan（vectorscan-rs 0.0.6）经 CMake 编译 C++，需要 Boost >= 1.61 头文件（BOOST_ROOT + CPATH 指向 brew 前缀）"
  - "Vectorscan build.rs 用 Command::new(\"c++\") 探测编译器；OHOS 仅提供 clang/clang++，需建 cc/c++ 兼容别名"
  - "OHOS 上 ELF 必须用 binary-sign-tool 签名才能执行，否则 Operation not permitted"
  - "libgit2.so.1.9 位于 Harmonybrew 前缀，musl 加载器忽略 DT_RUNPATH，需 LD_LIBRARY_PATH 显式包含；且 libgit2 的 safe.directory 所有权校验会拒绝 worker 组所有的临时仓库（uid 20001006/gid 1006）"
  - "与 SKILL 旧 CI 能力矩阵『Rust ❌』不同：本仓库已积累 57 个 cargo 配方（built/published 为主）且 rust-toolchain/1.97.1 已发布制品仓，Rust 应用在 OHOS 原生构建可行"

knowledge_ref:
  - "E210"

