# 软件级 manifest — kingfisher
# 文件位置: archives/k/kingfisher/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: kingfisher
display: "Kingfisher"
description: "MongoDB 密钥泄露扫描与在线校验工具（Rust）"
category: security
homepage: "https://github.com/mongodb/kingfisher"
license: Apache-2.0
build_system: cargo

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Rust/cargo 项目：cargo build --release --locked，依赖由 Cargo.lock 锁定，无 Conan 制品依赖"
    - "OHOS 上 rustc 的 target_os=linux、target_env=ohos，上游 any(target_os = \"linux\") 条件恒真，mimalloc 无法用 --no-default-features 关闭"
    - "必须关闭 mimalloc 的 override feature：MI_MALLOC_OVERRIDE 覆盖系统 malloc/free 与鸿蒙内存管理冲突，启动期 SIGSEGV（E210）"
    - "OHOS SDK 工具链未把 CMAKE_SYSTEM_PROCESSOR 写入 CMake 缓存，aws-lc-sys 会推导 ARCH=generic 并静默跳过 s2n-bignum 汇编；需 overlay 钉住 aarch64 并补 llvm-ranlib 包装"
    - "vendored vectorscan-rs 由 CMake 构建，需要 Boost>=1.61 头文件，且其 build.rs 以 'c++' 探测编译器，需建 cc/c++ 兼容别名"
    - "OHOS 上 ELF 必须经 binary-sign-tool 签名才能执行；musl 加载器忽略 DT_RUNPATH，libgit2 等 brew 库需显式 LD_LIBRARY_PATH"
  common_dependencies:
    - rust

