knowledge_gained:
  - "Kirigami 6.26.0 requires C++20: src/primitives/scenegraph uses std::span and std::unordered_map::contains. The shared OHOS profile pins compiler.cppstd=17 and ConanToolchain emits a NON-cache `set(CMAKE_CXX_STANDARD 17)` that shadows any CMAKE_CXX_STANDARD cache variable (and ECM's own KDECompilerSettings default, because it only sets 20 `if (NOT CMAKE_CXX_STANDARD)`), so the recipe must raise the setting in configure() (self.settings.compiler.cppstd = \"20\") — tc.variables alone is not enough."
  - "Kirigami 6.26.0 links Qt6::GuiPrivate in src/platform and the top level hard-requires find_package(Qt6GuiPrivate) when Qt6Gui >= 6.10.0. qtbase/6.11.1 ships the complete native Qt6 CMake tree (including Qt6GuiPrivateConfig.cmake) and is consumed with cmake_find_mode=none + the install prefix on CMAKE_PREFIX_PATH, so no extra package is needed."
  - "Kirigami itself needs only ECM 6.26.0 + Qt6 (Core Gui Quick QuickControls2 Concurrent Svg ShaderTools). kconfig/kguiaddons/ki18n are dependencies of APPLICATIONS built from templates/kirigami6 (and of the downstream kirigami-app-components), not of the framework; kirigami 6.26.0 has zero ecm_find_qmlmodule(KF6 ...) calls."
  - "Qt's optional OPTIMIZED shader option invokes the external Vulkan SDK tool spirv-opt, which qtshadertools/6.11.1 does not ship. Stripping the OPTIMIZED token from the CMake files before configure keeps qsb baking the shaders (the 6.18.0 precedent) without a source patch to the tarball."
  - "OHOS loads ELF only with a valid .codesign note: the Kirigami QML plugins are linked against sibling build libraries and the OHOS loader treats a slash in DT_NEEDED as a cwd-relative path. package() rewrites `../bin/libKirigami*.so` NEEDED entries to the bare soname and then re-signs every installed ELF with llvm-objcopy --remove-section .codesign + binary-sign-tool sign. Verified: plugin NEEDED = [libKirigami.so.6, libKirigamiPlatform.so.6, libQt6*.so.6, libc++_shared.so, libomp.so, libc.so] and both lib+plugin carry .codesign."
  - "R51 upstream tests: 38 registered / 38 executed / 100% passed. The 6.18.0 recipe excluded tst_theme.qml, but on 6.26.0 it passes (10 passed / 1 upstream-skip) once src/styles/org.kde.desktop/Theme.qml is staged into the built QML tree, so no test is excluded."
  - "R38: library-only package (no bin/), so no software-level commands.json is added (PF8 would reject one)."
