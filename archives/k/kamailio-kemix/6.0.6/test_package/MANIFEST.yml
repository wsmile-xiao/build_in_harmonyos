#   官方源码包 kamailio-6.0.6_src.tar.gz 内 `test/`、`tests/` 目录共 4 个、文件共 17 个：
#     utils/kamctl/dbtextdb/tests/  10 个（dbtextdb_test.py 的用例数据）
#     src/modules/janssonrpcc/test/  3 个（jsonrpc-c 模块，脚本 + 配置）
#     src/modules/rtpproxy/test/     3 个（rtpproxy 模块，配置 + 命令行记录）
#     src/modules/tm/test/           1 个（tm 模块，开发期 IPC 清理脚本）
#   kemix 模块自身源码目录 src/modules/kemix/ 内无测试源、无 check/ctest 目标注册
#   （源码包仅含 kemix_mod.c / kemix.so 构建产物，文档在 doc/ 下）。
#
# 实跑口径：17 个文件中唯一自包含、无需运行中 kamailio 实例的上游测试是
#   utils/kamctl/dbtextdb/dbtextdb_test.py（上游自带 unittest 入口，3 个用例，
#   仅依赖 Python 标准库；用例数据取自同目录 tests/ 下 10 个文件）。
#   → 已在 conanfile.py build() 末尾真实执行（层 1 门禁）：Ran 3 tests, OK (3/3)。
