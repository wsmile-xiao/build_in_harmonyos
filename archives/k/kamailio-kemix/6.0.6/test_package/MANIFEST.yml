# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: check_kemix.py
    description: "产物结构校验（纯 Python ELF 解析，无外部工具依赖）：ELF64 LSB、ET_DYN、EM_AARCH64、动态依赖仅 libc、导出符号 exports/mod_register/module_version|interface_ver|flags、未定义符号面含 core 契约 sr_kemi_modules_add+sr_kemi_xval_null（core 插件特征）、无 RPATH/RUNPATH、licenses/COPYING 为 GPL 文本、模块大小区间"
    command: "python3 check_kemix.py"
  - file: test_kemix_e2e.c
    description: "鸿蒙特有端到端消费者用例（rule12）：以消费者身份走通 kamailio core 的 loadmodule 路径 —— dlopen(kemix.so, RTLD_NOW) → 取模块导出描述符 exports（校验 name 为 kemix、dlflags 已设、无 cfg 命令导出）→ dlsym+调用 mod_register → 校验 core 侧 sr_kemi_modules_add 恰被调用一次并取得 69 项 KEMI 函数表 → 全表校验（子模块名 kx / 返回类型 SR_KEMIP_XVAL / 函数指针非空 / 8 个上游函数名存在）→ 真实调用 (kx, get_ruri) 并断言 NULL 消息返回 SR_KEMIP_NULL → dlclose；共 25 项断言全 PASS"
    command: "./test_kemix_e2e <kemix.so>"
  - file: kamailio_core_stub.c
    description: "core 符号最小实现层：kemix.so 是 core 插件，引用 sr_kemi_modules_add/sr_kemi_xval_null/sr_kemi_eng_get/dprint_crit 等 kr_core_api 符号；OHOS 的 musl 加载器不做惰性绑定（dlopen 即等价 RTLD_NOW），故由本文件随 e2e 一起编译并以 -Wl,--export-dynamic 导出符号供 dlopen 解析（sr_kemi_modules_add 记录函数表以供用例观察，为与 core 同语义的真实实现）"
    command: "（与 test_kemix_e2e.c 同一次 clang 调用，见 conanfile.py test()）"

# 测试断言总数（check_kemix.py 中的 check() 调用数，12 项）
assertion_count: 12

# e2e 消费者用例断言数（test_kemix_e2e.c 运行时断言展开数：18 个静态断言点，其中
# 8 个上游函数名断言在 EXPECTED_NAMES 循环内展开 → 18-1+8 = 25）
e2e_assertion_count: 25
