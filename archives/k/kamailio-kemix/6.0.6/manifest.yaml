# 上游 6.0.6 源码包原生识别 aarch64-unknown-linux-ohos，未应用任何补丁
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`，否则报 No rule to make target 'cfg-defs'"
  - "kemix 是纯 core 插件模块：模块 Makefile 的 LIBS 为空、无第三方依赖，配方无需 LOCALBASE/ODBCCFG 一类变量注入"
  - "kemix 的 exports 描述符零导出（无 cfg 命令/RPC/伪变量/mod_init），功能全部在加载期由 mod_register() → sr_kemi_modules_add(sr_kemi_kx_exports) 注册；KEMI 函数表是 static 符号（不导出），故 dlopen 后只能经 mod_register 观察表内容"
  - "kamailio 同时提供 CMake 与经典 Makefile 两套构建体系；仅打包单个模块时用经典 Makefile 更直接"
  - "OHOS/musl 加载器不做惰性绑定（dlopen ≡ RTLD_NOW），core 插件模块独立加载时未定义 core 符号必须全部可解析 → 端到端消费者用例需随用例编译最小 core 符号桩并以 -Wl,--export-dynamic 导出"

# 本配方 0 补丁：探索阶段未改动任何源文件（编辑追踪器无变更记录），
# refresh-patch --auto 无候选可生成（探索阶段的构建生成物不纳入补丁候选）
patch_generation:
  method: none
  patches_count: 0
  note: "编辑追踪器无变更记录，0 候选；conandata.yml 为 patches: {}"
