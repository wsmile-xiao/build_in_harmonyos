# 版本级 manifest — kamailio-kemix 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-kemix"
status: published
build_date: "2026-09-26"
build_system: makefile                # kamailio 经典 Makefile 体系（非 autotools/cmake）

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "make cfg include_modules=kemix"
    - "make modules modules=modules/kemix -j1"
  dependencies: []                    # kemix 无外部库依赖（模块 Makefile LIBS 为空）
  cc: clang
  cxx: clang++

# ============================================================
