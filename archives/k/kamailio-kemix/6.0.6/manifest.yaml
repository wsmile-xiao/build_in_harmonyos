# 实测 = 其中唯一自包含、无需运行中 kamailio 实例的上游 unittest（3 个用例）已真实执行
upstream_tests:
  command: "python3 dbtextdb_test.py -v"
  source_path: "kamailio-6.0.6/utils/kamctl/dbtextdb/dbtextdb_test.py"
