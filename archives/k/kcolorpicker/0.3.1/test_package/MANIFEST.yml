# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kcolorpicker/0.3.1
homepage: https://github.com/ksnip/kColorPicker

# 上游测试命令 — kColorPicker 上游用 CTest 运行 tests/（QTest 单测，
# 上游 CI 用 xvfb-run make test）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/buttons/ColorButtonTest.cpp
    source: kColorPicker-0.3.1/tests/buttons/ColorButtonTest.cpp
    description: "上游 QTest 唯一测试：ColorButton click 触发 colorSelected 信号（QSignalSpy 断言 count==1 且颜色一致）"
    command: "ctest --output-on-failure -R '^ColorButtonTest$'（QT_QPA_PLATFORM=offscreen）"
    condition: "设备原生编译（can_run）时在 build() 内执行；offscreen QPA，无需显示服务器"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_kcolorpicker.cpp
    description: "下游契约验证：find_package(kColorPicker-Qt6 0.3.1 REQUIRED) + kColorPicker::kColorPicker 链接；offscreen QPA 下实例化 KColorPicker 并验证 setColor/color 往返与 resetColors；覆盖 OHOS 适配点（offscreen 平台、共享库重签名后真实加载、Qt Widgets 事件循环）"
    command: "conan create (test_package: compile & run test_kcolorpicker)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
