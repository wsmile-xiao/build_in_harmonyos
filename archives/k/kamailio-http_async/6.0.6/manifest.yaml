# 版本级 manifest
# 文件位置: archives/{letter}/{name}/6.0.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.0.6"

# 软件名
software: "kamailio-http_async"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（kamailio.org 官方 src 包；GitHub tag tarball 哈希不符，
  # 与 kamailio-lua 先例一致）
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"

  # 源码校验和
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（kamailio 纯 Makefile 构建体系：make cfg + make modules）
  configure_options:
    - "make cfg include_modules=http_async_client LOCALBASE=<curl pkg> BUILDER= CC=/data/service/hnp/bin/clang"
    - "make modules modules=modules/http_async_client -j1"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - curl/8.15.0.1
    - libevent/2.1.12

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（模块源码零修改：平台探测宏经 extra_defs 注入，
# 与 kamailio-lua 同源方案）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "kamailio 模块适配范式：make cfg include_modules=<m> + make modules modules=<path>，平台宏经 extra_defs 注入（OS=harmonyos 不在 Makefile.defs 平台分支内）"
  - "模块 Makefile 经 pkg-config libcurl 探测 CURLLIBS：LOCALBASE 指向 conan 依赖目录 + PKG_CONFIG_PATH 劫持探测（构建机系统 curl 无法介入）"
  - "共享 curl 变体优先：静态 curl 触发 openssl 全量重编译（成本不可控）"
  - "消费者测试模型：模块 .so 由 kamailio core loadmodule 装载；测试按 core 装载协议 dlopen + dlsym（module_version/module_flags/mod_register/exports），libcurl API 经 dlsym 从被测模块解析，消费者自身零链接 curl/event"
