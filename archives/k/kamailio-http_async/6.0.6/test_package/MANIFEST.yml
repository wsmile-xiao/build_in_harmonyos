# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kamailio-http_async/6.0.6
homepage: "https://kamailio.org/"

# 上游测试命令：kamailio core 的 test/unit/*.sh 集成单测（fct 风格，
# 每脚本启动完整 kamailio 二进制加载 SIP 配置并断言退出码），挂在 make check 下。
# 模块级（src/modules/http_async_client/）无专属自动化测试。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：core 49 个集成单测（test/unit/*.sh）。
# rule4 实测（kamailio-lua 同源 core，PR #13875 评审实证）：38/49 通过（77.6%），
# 8 项失败均为环境外部依赖（默认配置/完整安装布局/kamdbctl 工具链），非 OHOS 适配缺陷。
# 本模块复用同一 core 测试集与结论。
upstream_tests:
  - file: test/unit/01.sh
    source: kamailio-6.0.6/test/unit/
    description: "kamailio core 集成单测代表样例（49 个 test/unit/*.sh 同型：启动 kamailio 加载配置断言退出码）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: check_module.py
    description: "产物与平台契约校验 17 项：AArch64 ELF/ET_DYN、core 契约符号动态导出、exports 接口表、NEEDED 含 libcurl/libevent 且无 glibc 专名库、无 RPATH/RUNPATH 等"
    command: "python3 check_module.py"
  - file: test_consumer.c
    description: "消费者用例 10 项断言：按 kamailio core 装载协议 dlopen 模块 → dlsym module_version/module_flags/mod_register/exports → 经 dlsym 从被测模块解析 libcurl API 真实创建/销毁 easy handle"
    command: "./test_consumer"

# 测试断言总数 (近似值, 用于质量评估)：契约 17 + 消费者 10
assertion_count: 27
