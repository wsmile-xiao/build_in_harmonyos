# test_package/MANIFEST.yml
# 上游官方测试声明文件（L0e 强制要求）

package: kdtree/0.5.7
homepage: "https://github.com/jtsiomb/kdtree"

# 上游测试命令
upstream_check_command: "make -n check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本包无独立 check 目标，示例程序为 examples/）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "consumer: kd_create/kd_insert3/kd_nearest3 public API + observable result"
    command: "./test_kdtree"

# 测试断言总数（近似值）
assertion_count: 2
