package: kdecoration3/6.7.0
homepage: https://invent.kde.org/plasma/kdecoration

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_dir> --output-on-failure --no-tests=error --timeout 90"

upstream_tests:
  - file: autotests/
    source: kdecoration-6.7.0/autotests/
    description: "Complete upstream KDecoration3 CTest suite"
    command: "ctest --output-on-failure"
    condition: "BUILD_TESTING=ON and QT_QPA_PLATFORM=offscreen"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer validates five DecorationThemeMetaData and BorderSize API results."
    command: "conan create builds and runs test_kdecoration3"
  - file: test_package/test_ohos.cpp
    description: "鸿蒙特有测试：验证 OHOS AArch64/64 位小端 ABI，真实调用 KDecoration3 API，并断言适配后的 libkdecorations3.so.6 与 libkdecorations3private.so.2 已按 SONAME 正确装载。"
    command: "conan create for OHOS builds and runs test_kdecoration3_ohos"

assertion_count: 11
