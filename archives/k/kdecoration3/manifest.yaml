software: kdecoration3
display: "KDecoration3"
description: "KDE Plasma window-decoration plugin interface library"
category: library
homepage: "https://invent.kde.org/plasma/kdecoration"
license: "LGPL-2.1-only OR LGPL-3.0-only OR LicenseRef-KDE-Accepted-LGPL"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Enable the KDE platform-check override when cross-building for OHOS"
    - "Keep public and private shared libraries together with stable SONAME dependencies and a relocatable $ORIGIN RUNPATH"
    - "Skip translation catalog generation when the OHOS build environment does not provide msgmerge"
  common_dependencies:
    - qtbase
    - ki18n
    - ecm

versions:
  "6.7.0":
    status: built
    build_date: "2026-09-09"
    conan_ref: "kdecoration3/6.7.0"
