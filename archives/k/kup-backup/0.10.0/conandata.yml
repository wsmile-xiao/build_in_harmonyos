# conandata.yml — kup-backup 0.10.0
# KDE 备份方案（kup-daemon 调度 + kup-filedigger 归档浏览 + kio_bup worker + kup-purger）
#
# 源码注意：上游 tag 名为 kup-0.10.0（无 v 前缀），GitLab 归档文件名为
# kup-kup-0.10.0.tar.gz（repo-tag 双段命名）；download.kde.org 无 0.10.0
# 正式发布目录（invent 归档实测 HTTP 200）。

sources:
  url: "https://invent.kde.org/system/kup/-/archive/kup-0.10.0/kup-kup-0.10.0.tar.gz"
  sha256: "7942c68d85ed1dc62142fb594c5d34ccec747cf0121318828f4a0d0219b4c973"

patches:
  "0.10.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      description: "OHOS 根构建适配：project(kup) 前移到 find_package(ECM) 之前（上游 ECM-first 布局下 conan toolchain 的 conan_cmakedeps_paths.cmake include 钩子在 project() 才处理，ECM 前缀此前不可见——首轮 CI 实测 CMakeLists.txt:16 找不到 ECMConfig.cmake；纯重排无语义变化）；libgit2 imported target 的 INTERFACE_INCLUDE_DIRECTORIES 由 <pkg>/./include/git2 重指到 <pkg>/include：kup 以 <git2/global.h> 形式包含头文件需父目录；且 include/git2/stdint.h 是 libgit2 的 MSVC 兼容 shim（全文包裹在 #ifdef _MSC_VER 内，clang 下预处理为空），却以 -I 优先级劫持 #include <stdint.h>，musl 真头从未被包含、libc++『using ::intmax_t』落空——第 4-6 轮 kup-filedigger mocs_compilation.cpp 的 <ratio> intmax_t 错误实测根因（kup-daemon 不链 libgit2 始终编译通过为对照）；QT_MAJOR_VERSION 钉 6（ohpcd 图仅 Qt6）；find_package(LibGit2)→find_package(libgit2)（conan 包 CONFIG 模式，ECM FindLibGit2 在 OHOS 无系统包可探）；移除 KDEClangFormat/KDEGitCommitHooks 与 clang-format 全量重排（非必需工具）；KF6 组件表删 KCMUtils（kcmutils 仅 6.26 线，与 kio 6.14 完整构建闭包冲突）；删 Plasma/Plasma5Support plasmoid 安装（ohpcd 未发布）；子目录删 dataengine/kcm（前者依赖 Plasma，后者依赖 kcmutils），保留 daemon/icons/filedigger/kioworker/purger；ki18n_install(po) 移除（lconvert 本平台加载 libQt6Core 失败，.qm 非必需，kjobwidgets 6.14.0 先例）"
    - patch_file: "patches/0002-filedigger-CMakeLists.txt.patch"
      description: "filedigger 链接目标 LibGit2::LibGit2→libgit2::libgit2package（conan libgit2 包自带 libgit2Config.cmake 导出的实际 target 名）；补链 Qt::DBus（mergedvfs.cpp 的 QDBusInterface 调 daemon runIntegrityCheck：上游 Linux 靠 KF6::KIOCore 传递提供 Qt6::DBus 头，ohpcd kio/6.14.0 为 USE_DBUS=OFF 构建传递链断裂——第 7 轮 QDBusInterface file not found 实测；daemon 目标同款写法已实证链接通过）"
    - patch_file: "patches/0003-kioworker-CMakeLists.txt.patch"
      description: "kioworker 链接目标 LibGit2::LibGit2→libgit2::libgit2package（同 0002）"
    - patch_file: "patches/0004-kupdaemon-no-kuiserverjobtracker.patch"
      description: "裁减 kup-daemon 的 KUiServerJobTracker（备份进度的 kuiserver/DBus 集成）：ohpcd kjobwidgets/6.14.0 为 USE_DBUS=OFF 构建，kuiserver 系列类仅剩头文件（libKF6JobWidgets.so 实测只导出 KWidgetJobTracker 系符号，链接报 KUiServerJobTracker::KUiServerJobTracker(QObject*) undefined）；OHOS 无 kuiserver 进程与会话总线，KupDaemon::registerJob/unregisterJob 改 no-op（Q_UNUSED），mJobTracker 成员与 include 移除；备份进度可见性由 planexecutor 的 KNotification 通知承担（kteatime 26.04.0 裁托盘同款先例）；filedigger 的 KWidgetJobTracker 不受影响（6.14.0 包内实存）"
