# 版本级 manifest — kup-backup 0.10.0
# 位置: archives/k/kup-backup/0.10.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.10.0"
software: kup-backup
status: built
build_date: "2026-10-06"
build_system: cmake

source:
  # 上游 tag 名 kup-0.10.0（无 v 前缀），GitLab 归档文件名 kup-kup-0.10.0.tar.gz
  url: "https://invent.kde.org/system/kup/-/archive/kup-0.10.0/kup-kup-0.10.0.tar.gz"
  sha256: "7942c68d85ed1dc62142fb594c5d34ccec747cf0121318828f4a0d0219b4c973"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies:
    - qtbase-sql-dbus/6.11.1
    - kconfig/6.14.0
    - kcoreaddons/6.14.0
    - ki18n/6.14.0
    - knotifications/6.14.0
    - solid/6.14.0
    - kidletime/6.14.0
    - kjobwidgets/6.14.0
    - kwidgetsaddons/6.14.0
    - kxmlgui/6.14.0
    - kio/6.14.0
    - kdbusaddons/6.14.0
    - libgit2/1.9.0
    - openssl/3.5.6
    - zlib/1.3.1.1.1
    - libxml2/2.15.3
    - ecm/6.26.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-filedigger-CMakeLists.txt.patch"
  - "0003-kioworker-CMakeLists.txt.patch"
  - "0004-kupdaemon-no-kuiserverjobtracker.patch"

knowledge_gained:
  - "上游 tag 命名勘误：kup 的 tag 是 kup-0.10.0（无 v 前缀），GitLab 归档文件名是 kup-kup-0.10.0.tar.gz（repo-tag 双段）；任务卡原始 URL v0.10.0 实测 404"
  - "kio 版本线抉择：ohpcd 上 kio 6.18+ 全部是 KIOCORE_ONLY 基线（无 KF6::KIOFileWidgets），仅 kio/6.14.0 完整构建（KIOCore+KIOGui+KIOWidgets+KIOFileWidgets 四库齐）——需要 KIOFileWidgets 的消费者必须钉 6.14.0 并用 KF6 6.14 线"
  - "kcmutils 仅发布在 6.26 线（与 kio 6.14 完整构建闭包冲突）→ 需要 KCMUtils 的 KDE 应用在 kio 6.14 线上必须裁掉 KCM 模块"
  - "libgit2/1.9.0 预构建钉 openssl/1.1.1w+zlib/1.3.1，与 kio→karchive 线（openssl/3.5.6+zlib/1.3.1.1.1）冲突：override 对齐后 package_id 变化触发源码重建（静态库 INTERFACE_LINK_LIBRARIES 还烤死了发布机绝对路径，重建同时修复）"
  - "libgit2 包 INTERFACE_INCLUDE_DIRECTORIES 导出 <pkg>/./include/git2，其 MSVC 兼容 stdint.h shim（#ifdef _MSC_VER 全包裹）以 -I 优先级劫持 <stdint.h>，musl 真头未被包含 → libc++ intmax_t 落空（kup-filedigger mocs_compilation.cpp <ratio> 20 errors）；解法=get_target_property+set_target_properties 重指 <pkg>/include（<git2/global.h> 包含形式需父目录）"
  - "kjobwidgets/6.14.0 为 USE_DBUS=OFF 构建：kuiserver 系列类被裁（.so 实测只导出 KWidgetJobTracker 系），头文件残留导致编译过链接炸 → KUiServerJobTracker 消费者需 no-op 裁剪（KNotification 承担通知）"
  - "kio/6.14.0 USE_DBUS=OFF 断了 KIOCore→Qt6::DBus 头传递：QDBusInterface 消费者（跨进程调 daemon）需显式补链 Qt::DBus"
  - "Qt6::DBus 消费路径：qtbase-sql-dbus/6.11.1 是唯一提供者（cmake 配置 Qt6DBus/Qt6DBusPrivate + libQt6DBus.so 实存）；双 Qt 图混编时 sql-dbus 前缀必须排查找顺序最前（kglobalacceld 6.7.2 先例）"
