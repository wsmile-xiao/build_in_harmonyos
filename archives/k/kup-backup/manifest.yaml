software: kup-backup
display: "Kup Backup"
description: "KDE 备份方案：kup-daemon 调度 bup/rsync 备份计划，kup-filedigger 浏览/恢复 bup 归档，kio_bup KIO worker，kup-purger 清理旧备份"
category: utils
homepage: "https://invent.kde.org/system/kup"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF6 6.14 线 + kio/6.14.0（唯一含 KIOFileWidgets 的构建）+ qtbase-sql-dbus/6.11.1 双 Qt 图（Qt6::DBus 唯一提供者，前缀排查找最前，kglobalacceld 先例）"
    - "裁减：plasmoid/dataengine（Plasma 不在档）、kcm（kcmutils 仅 6.26 线冲突）、ki18n_install(po)（lconvert 平台加载失败）；保留 daemon/filedigger/kioworker/purger/icons"
    - "libgit2 override openssl/3.5.6+zlib/1.3.1.1.1 对齐 kio 线 → 源码重建（预构建二进制钉 1.1.1w/1.3.1 冲突且 INTERFACE_LINK_LIBRARIES 烤死发布机路径）"
    - "ECM_MODULE_PATH 手工注入 + conan_cmakedeps_paths.cmake 手工写（KF6/Qt 包 cmake_find_mode=none）；lld max-page-size=0x1000；SONAME flag 手工提供"
  common_dependencies:
    - qtbase-sql-dbus
    - kconfig
    - kcoreaddons
    - ki18n
    - knotifications
    - solid
    - kidletime
    - kjobwidgets
    - kwidgetsaddons
    - kxmlgui
    - kio
    - kdbusaddons
    - libgit2

versions:
  "0.10.0":
    status: built
    build_date: "2026-10-06"
