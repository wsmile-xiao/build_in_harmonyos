# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求）

package: kyua/0.13-git20240311-0a43bb8d89e3
homepage: "https://github.com/freebsd/kyua"

# 上游测试命令：`make check` = bootstrap autotest testsuite
# （check-bootstrap）+ kyua 自举全套件运行（check-kyua: ./local-kyua test）
upstream_check_command: "make check"

# conanfile.py build() 已集成上游测试（_run_upstream_tests 解析 check.log）
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试总量（静态审计，见 notes.md；真机执行数以 check.log 汇总行为准）
upstream_test_total: 1435
upstream_test_count_method: autotools_tests
upstream_test_audit: >-
  源码包 0a43bb8d89e3.tar.gz 实测清点：1253 个 ATF_TEST_CASE 声明
  （104 个 *_test.cpp，声明行数 == ATF_TEST_CASE_BODY 行数，去重精确值；
  ATF_TEST_CASE_HEAD 90 行均为无分号块起始行，不计入）+ 160 个
  utils_test_case（12 个 integration/*.sh）+ 12 个 atf_test_case
  （doc/manbuild_test.sh）+ 10 个 AT_SETUP（bootstrap/testsuite.at）；
  顶层 Kyuafile 注册 116 个 atf_test_program + bootstrap 1 个
  plain_test_program。ATF 宏无独立口径，取最接近的 autotools_tests
  口径（经 make check 执行的 ATF/autotest 混合套件）。

# make check 实际运行的测试集合
upstream_tests:
  - file: cli/*_test.cpp engine/*_test.cpp utils/*_test.cpp model/*_test.cpp store/*_test.cpp drivers/*_test.cpp
    source: kyua-0a43bb8d89e3/<各子目录>/*_test.cpp
    description: "C++ ATF 测试程序 104 个，共 1253 个 ATF_TEST_CASE，经 kyua 自举运行"
    command: "./local-kyua test"
  - file: integration/*.sh
    source: kyua-0a43bb8d89e3/integration/*.sh
    description: "atf-sh 集成测试 12 个程序，共 160 个 utils_test_case，经 kyua 自举运行"
    command: "./local-kyua test"
  - file: doc/manbuild_test.sh
    source: kyua-0a43bb8d89e3/doc/manbuild_test.sh
    description: "atf-sh 文档构建测试 12 个 atf_test_case"
    command: "./local-kyua test"
  - file: bootstrap/testsuite.at
    source: kyua-0a43bb8d89e3/bootstrap/testsuite.at
    description: "autotest 引导套件 10 个 AT_SETUP（check-bootstrap）"
    command: "./testsuite"

# test_package 中自带的测试 (消费者视角验证，R34: 真实执行被测二进制)
test_package_tests:
  - file: test_kyua.py
    description: "kyua about version 退出码为 0 且输出非空并提及 kyua（含版本数字；本快照无 --version 接口，见 notes round-51）"
    command: "python3 test_kyua.py <bindir>"
  - file: test_kyua.py
    description: "kyua help 退出码为 0 且列出 test 命令"
    command: "python3 test_kyua.py <bindir>"
  - file: test_kyua.py
    description: "最小 Kyuafile + plain 测试程序的 kyua test 烟雾：要求 1/1 passed (0 failed)"
    command: "python3 test_kyua.py <bindir>"

# 测试断言总数 (消费者 3 项检查，各含输出非空/内容双重校验)
assertion_count: 6
