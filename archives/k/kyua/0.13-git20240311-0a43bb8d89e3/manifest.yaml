  - "ATF_CHECK_CXX/SH 走 PKG_CHECK_MODULES：复用 lutok 0.6.2 的私有 atf-c++.pc/atf-sh.pc 写法，绕开 atf-0.23 制品 prefix=/ 的坏 .pc/.la"
  - "上游测试为 kyua 自举运行（./local-kyua test）+ bootstrap autotest testsuite：计数唯一可信源是 kyua 汇总行 `N/M passed (K failed)`（cli/cmd_test.cpp）与 autotest `N tests were successful` 行"
  - "静态审计上游总量 1435：1253 个 ATF_TEST_CASE（104 个 *_test.cpp）+ 172 个 atf-sh 用例（12 个 integration + doc/manbuild_test.sh）+ 10 个 AT_SETUP（bootstrap/testsuite.at）"
