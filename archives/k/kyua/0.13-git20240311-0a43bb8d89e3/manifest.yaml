knowledge_gained:
  - "GitHub archive 快照不含 generated configure，需 tool_requires(automake/autoconf/libtool/pkgconf) + 手动 autoreconf 自举（librb 2.0.0 先例，system perl 规避 conan perl XS 加载失败）"
