software: kyua
display: "Kyua"
description: "Testing framework for infrastructure software (ATF test runner)"
category: tool
homepage: "https://github.com/freebsd/kyua"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub archive 为无 configure 的 git 快照：tool_requires(automake/autoconf/libtool/pkgconf) + 手动 autoreconf 自举（system perl）"
    - "configure.ac 对 ATF M4 宏 m4_fatal 硬依赖：autoreconf 必须 -I atf-0.23 的 aclocal 目录"
    - "ATF_CHECK_CXX/SH 走 pkg-config：自写 atf-c++.pc/atf-sh.pc，绕开 atf-0.23 制品 prefix=/ 的坏 .pc/.la"
    - "上游测试为 kyua 自举运行 + bootstrap autotest：计数唯一可信源是汇总行 `N/M passed (K failed)` 与 `N tests were successful`"
  common_dependencies:
    - "lutok"
    - "sqlite3"

versions:
  "0.13-git20240311-0a43bb8d89e3":
    status: built
    build_date: "2026-09-26"
    conan_ref: "kyua/0.13-git20240311-0a43bb8d89e3"
