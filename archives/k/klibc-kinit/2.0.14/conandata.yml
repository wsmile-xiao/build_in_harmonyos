# conandata.yml — klibc-kinit 2.0.14
# 源码：kernel.org 官方发布归档（klibc-2.0.14.tar.xz，2025-03-04），固定 SHA256。
# 本包只交付 klibc 上游 usr/kinit 组件（initramfs 的 PID 1 程序 kinit）。
# 许可证为混合：MIT + BSD-3-Clause + GPL-2.0-only（见 usr/klibc/LICENSE）。

sources:
  url: "https://www.kernel.org/pub/linux/libs/klibc/2.0/klibc-2.0.14.tar.xz"
  sha256: "281bfb683e196818412af70b8968b7726475a80ff1c4bd67119e6bf5059f9075"

patches:
  "2.0.14":
    - patch_file: "patches/0001-usr-include-ohos-asm-layout.patch"
      patch_description: "usr/include/Kbuild：asm 头由 ln -fsn 符号链接改为 cp -rf 复制（规避 HMDFS 符号链接限制、物化 asm 头供构建使用），并用 KLIBCASMDIR 变量支持 OHOS 的 asm 头布局（aarch64-linux-ohos/asm 而非标准 asm-arm64）"
      patch_type: "portability"
    - patch_file: "patches/0002-signal-kernel-nsig-compat.patch"
      patch_description: "usr/include/signal.h：OHOS 内核头用 _KERNEL__NSIG 而非标准 Linux 的 _NSIG，加映射使 sys_siglist/sys_sigabbrev 能解析 _NSIG"
      patch_type: "portability"
    - patch_file: "patches/0003-kbuild-sharedlib-cp-not-ln.patch"
      patch_description: "usr/klibc/Kbuild：共享库 soname 由 ln 硬链接改为 cp 复制（HMDFS 不支持硬链接，见知识库 E079）"
      patch_type: "portability"
    - patch_file: "patches/0004-kbuild-libc-kinit-only.patch"
      patch_description: "顶层 Kbuild：all 目标收敛为 scripts/basic + usr/klibc + usr/kinit，跳过与本包无关的 usr/dash、usr/utils、usr/gzip（kinit 需要 libc.a/crt0.o 先构建）"
      patch_type: "portability"
