knowledge_gained:
  - "klibc 上游一个归档被平台拆成 klibc / libklibc / klibc-kinit / klibc-dash / klibc-klcc / klibc-fstype / klibc-nfsmount / klibc-run-init 多条任务；本包只交付 usr/kinit 组件（静态版 kinit）"
  - "顶层 Kbuild 的 all 目标默认递归 scripts/basic + usr/klibc + usr/kinit + usr/dash + usr/utils + usr/gzip；已合入的 klibc/2.0.14 用 patch 0004 收成 libc-only，本包用 0004-kbuild-libc-kinit-only 收成 scripts/basic + usr/klibc + usr/kinit"
  - "usr/kinit/Kbuild 把 ipconfig/ nfsmount/ run-init/ fstype/ resume/ 作为目录写进 static/kinit-y，kbuild 会先进这些子目录建 lib.a 再链进 kinit，所以构建 kinit 必然连带编译全部子组件，但产物只有一个 kinit"
  - "kbuild 的 $(PERL) 必须解析到真实存在的 perl：scripts/Kbuild.klibc 走 usr/klibc/syscalls/Kbuild 生成 SYSCALLS.i / typesize.c / klibc/havesyscall.h，而 syscalls.mk 是以 `-include` 方式引入的，perl 路径无效时 make 会**忽略该 include 的重建失败**并继续，最后死在 sigsuspend.c 的 `'klibc/havesyscall.h' file not found`，报错点离根因很远"
  - "真机上 SDK 的 native/llvm/bin 没有 perl（CI worker 的 /data/service/hnp/bin 有），配方需按 [cc 目录, /data/service/hnp/bin, ~/.harmonybrew/bin, PATH] 顺序探测"
  - "kinit 组件的上游测试是两段编译期宏包起来的 standalone 自测 main：usr/kinit/devname.c 的 #ifdef TEST_DEVNAME 与 usr/kinit/name_to_dev.c 的 #ifdef TEST_NAMETODEV；后者的输出走 kinit.h 的 dprintf，上游只在 -DDEBUG 下把 dprintf 定义为 printf，所以不带 -DDEBUG 编译该自测会一声不出"
  - "klibc 的 dev_t 编码在 usr/include/sys/sysmacros.h：major=(dev>>8)&0xfff、minor=(dev&0xff)|((dev>>12)&0xfff00)；usr/kinit/do_mounts.h 的 Root_RAM0/NFS/MTD/MULTI 按此展开为 (1,0)/(0,255)/(0,254)/(0,253)，可作为与宿主无关的断言基准"
  - "bdevname() 会扫 /sys/block 反查盘名，设备上该目录对普通用户 Permission denied 时回落成 dev —— 因此断言只能比对行尾的 (major,minor)，不能比对盘名"
  - "usr/kinit/nfsmount/Kbuild 第 6 行 `#FIXME - build is broken static-y := dummypmap`：dummypmap_test.c 全文只有 `#define TEST` + `#include \"dummypmap.c\"`，而 dummypmap.c 里没有 TEST 条件块也没有 main()，上游第 3 个自测入口按源码现状无法链接"
  - "kinit 是 PID 1 程序：main() 里 open(\"/dev/console\")、mount_sys_fs(\"/proc\"|\"/sys\")，失败路径 umount2(\"/proc\")/umount2(\"/sys\")，成功路径经 initrd.c/run-init 的 MS_MOVE 重挂根 + chroot + exec init。在在线系统上执行属破坏性操作，消费者测试只做装载前静态校验"
  - "上游 Kbuild 同时出 static/kinit 与 shared/kinit；shared 版的 PT_INTERP 指向 /lib/klibc-<hash>.so（klibc 包的共享库），单独发布本包无法解析，故只交付静态版"
  - "toybox 的 grep 对二进制文件不做行匹配（grep -ac 恒为 0），消费者脚本改用 `tr -c '[:print:]' '\n'` 先抽出可打印串再 grep -F"
