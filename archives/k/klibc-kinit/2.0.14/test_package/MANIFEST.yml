# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: klibc-kinit/2.0.14
homepage: "https://www.kernel.org/pub/linux/libs/klibc/"

# 上游测试命令：klibc 没有面向 usr/kinit 的 make check/ctest 目标（顶层 Makefile 的
# test 目标只构建 usr/klibc/tests，那是 libc 本体的套件）。kinit 组件自带两个
# standalone 自测 main，用编译期宏打开：
#   usr/kinit/devname.c     #ifdef TEST_DEVNAME
#   usr/kinit/name_to_dev.c #ifdef TEST_NAMETODEV
upstream_check_command: "clang -DTEST_DEVNAME/-DTEST_NAMETODEV 编译 usr/kinit/{devname,name_to_dev}.c 后静态链 klibc 并逐个输入运行"

# conanfile.py build() 是否集成上游测试：是
upstream_test_in_build: true
upstream_test_command: "build() 内 make（scripts/basic + usr/klibc + usr/kinit）后编译并运行两个自测程序，共 17 项输入断言"

# 上游测试用例清单（usr/kinit 组件范围内 grep 到的全部 TEST 入口）
upstream_tests:
  - file: "usr/kinit/devname.c"
    source: "klibc-2.0.14/usr/kinit/devname.c (#ifdef TEST_DEVNAME)"
    description: "bdevname() 的 dev_t -> (major,minor) 分解自测；配方按 klibc usr/include/sys/sysmacros.h 的编码断言 7 个输入（含 Root_NFS/Root_MTD/Root_RAM0/Root_MULTI 与 (4095,255) 边界）"
    command: "test_devname 0x00000000 0x000000fd 0x000000fe 0x000000ff 0x00000100 0x00000807 0x000fffff"
  - file: "usr/kinit/name_to_dev.c"
    source: "klibc-2.0.14/usr/kinit/name_to_dev.c (#ifdef TEST_NAMETODEV)"
    description: "name_to_dev_t() 的 root= 参数解析自测（覆盖文件头注释枚举的 8 类变体）；输出走 kinit.h 的 dprintf，上游仅在 -DDEBUG 下把它定义为 printf，故按上游设计带 -DDEBUG 编译。配方断言 10 个输入的 (major,minor)"
    command: "test_name_to_dev 0x000000fe ... 8:7 /dev/nfs /dev/ram /dev/mtd/root sda,1 nonexistentdisk99"
  - file: "usr/kinit/nfsmount/dummypmap_test.c"
    source: "klibc-2.0.14/usr/kinit/nfsmount/dummypmap_test.c"
    description: "未运行，原因：上游 usr/kinit/nfsmount/Kbuild 第 6 行写着 `#FIXME - build is broken static-y := dummypmap`，该目标没有被登记进 static-y/shared-y，构建系统从不构建它；且该文件全文只有 `#define TEST` + `#include \"dummypmap.c\"`，而 2.0.14 的 dummypmap.c 里没有任何 TEST 条件块或 main()（`grep -c 'ifdef TEST' usr/kinit/nfsmount/dummypmap.c` = 0），按上游源码构造也无法链接。属上游自身失效的用例，非本环境缺依赖"
    command: "（无：上游未登记该构建目标）"

# test_package 自带测试（消费者视角，R34：真实校验包内交付物）
test_package_tests:
  - file: test_klibc_kinit.sh
    description: "消费者视角 18 项断言：bin/kinit 存在与可执行位、尺寸、ELF 魔数/ELFCLASS64/小端/e_type=ET_EXEC/e_machine=EM_AARCH64、三类解释器路径（ld-musl / ld-linux / /lib/klibc-）均不存在以证明交付的是 static/kinit 而非 shared/kinit、ipconfig 与 run-init 目标文件确被链入 kinit 的字面量证据、内核命令行参数解析器已链入、上游自测取证 failures=0、许可证随包。字面量匹配走 od -v -tx1 十六进制流（toybox 的 grep 不做二进制行匹配、tr -c '[:print:]' 在 toybox 0.8.12 上是恒等变换）"
    command: "sh test_klibc_kinit.sh <package_bindir>"

# 交付物 kinit 是 initramfs 的 PID 1 程序，消费者测试不对它做 exec：
# 它一旦跑起来就会 umount2("/proc")/umount2("/sys")（usr/kinit/kinit.c:288-320）、
# 用 MS_MOVE 重挂根并 chroot（usr/kinit/initrd.c:113-154 与 usr/kinit/run-init/），
# 然后接管 init。在非 PID 1 的在线 HarmonyOS 系统上执行属破坏性操作，因此消费者侧
# 只做装载前静态校验（ELF 头字段 + 静态链接证据 + 链入组件的字面量）。
kinit_not_executed_reason: "PID 1 initramfs init: umount2 /proc /sys + MS_MOVE re-root + exec init; running it on a live HarmonyOS system is destructive"

# 测试断言总数（test_package 18 项断言；上游 2 个自测程序的 17 项输入断言在 build() 内执行）
assertion_count: 18
