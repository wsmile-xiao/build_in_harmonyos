# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "上游为无 tag 滚动仓库（GitLab master），版本语义取 0.0-git<date>.<short-sha>，源码身份由冻结 commit a8c0d0ec 唯一确定；归档必须用 GitLab API 端点（/api/v4/projects/<url-encoded-path>/repository/archive.tar.gz?sha=...），web 端 /-/archive/ 形态会被 Cloudflare 拦截命令行下载（403）"
- "纯 Python 工具集的安装语义是整体保留源码树：klc-check 等入口脚本以 os.path.dirname(__file__)/../common 相对引用公共模块，不能像常规包那样把可执行文件抽到 bin/（会破坏 import）；配方用 resdirs=share/ + 子目录 bindirs 表达"
- "命令行工具集合应诚实用 package_type=\"application\" + 软件级 commands.json（R38）：L0k 门禁按 bindirs 非空 / application 类型任一命中即要求 commands.json；数据/资源型才用 unknown（kicad-symbols 先例）"
- "上游测试体系为 unittest（Makefile test-klc-symbols / test-klc-footprints），无需 pytest；统一 python3 -B 调用属包目录卫生口径：不向已安装包写入 __pycache__、保持包目录与构建修订一致（HMDFS 路径下字节码写入本身可行，非失败规避）"
- "上游 Makefile 的 lint/style/spelling/symgen/comparelibs 目标依赖 black/isort/flake8/codespell/click 等可选重依赖，不属于核心检查路径的依赖闭包，不应声明为本包依赖"

