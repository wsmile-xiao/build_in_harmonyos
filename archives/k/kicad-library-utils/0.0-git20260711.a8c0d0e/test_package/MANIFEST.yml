# test_package/MANIFEST.yml — 上游官方测试声明（CI 门禁 L0e 强制要求）
# 详见: docs/TEST_QUALITY_SPEC.md 与 ci/tools/extract_upstream_tests.sh

package: kicad-library-utils/0.0-git20260711.a8c0d0e
homepage: "https://gitlab.com/kicad/libraries/kicad-library-utils"

# 上游测试命令：上游仓库自带 Makefile 测试目标（test-klc-symbols /
# test-klc-footprints 为 unittest 体系，test-symgen 为纯标准库符号生成器冒烟；
# 均不需要 pytest）。本包 test_package 在 OHOS 真机上真实执行这些命令
# （3 个目标共 4 条命令）。
upstream_check_command: "make test-klc-symbols test-klc-footprints test-symgen（上游 Makefile；3 个目标共 4 条命令）"

# conanfile.py build() 中是否集成上游测试：build() 为显式 no-op（纯 Python
# 工具集无构建步骤），上游测试在 test_package 阶段真实执行（见 test_package_tests）。
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: klc-check/check_symbol.py
    source: 上游 Makefile target test-klc-symbols
    description: "符号 KLC 规则检查器自测试：--unittest 驱动 klc-check/test_symbol/*.kicad_symdir 全部用例"
    command: "python3 -B klc-check/check_symbol.py --unittest klc-check/test_symbol/*.kicad_symdir"
    verified: "真实运行（test_package 内，OHOS 真机 python 3.12.9）：exit 0，133 个用例全部 passed"
  - file: klc-check/check_footprint.py
    source: 上游 Makefile target test-klc-footprints
    description: "封装 KLC 规则检查器自测试：--unittest 驱动 klc-check/test_footprint.pretty/*__*.kicad_mod 全部用例"
    command: "python3 -B klc-check/check_footprint.py --unittest klc-check/test_footprint.pretty/*__*.kicad_mod"
    verified: "真实运行（test_package 内，OHOS 真机 python 3.12.9）：exit 0，53 个用例全部 passed"
  - file: klc-check/check_footprint.py
    source: 上游 Makefile target test-klc-footprints（第二条命令）
    description: "真实封装单文件检查（-vv 长输出路径）：SO-8_3.9x4.9mm_P1.27mm.kicad_mod 应无错误"
    command: "python3 -B klc-check/check_footprint.py -vv klc-check/test_footprint.pretty/SO-8_3.9x4.9mm_P1.27mm.kicad_mod"
    verified: "真实运行（test_package 内）：exit 0，'Checking footprint SO-8_3.9x4.9mm_P1.27mm - No errors'"
  - file: symbol-generators/from_csv_generator.py
    source: 上游 Makefile target test-symgen
    description: "符号生成器冒烟：从 BQ24004-example.csv 生成符号（纯标准库 + 包内 common/kicad_sym，无第三方依赖；无 --output 时生成物落在输入 CSV 旁）"
    command: "python3 -B symbol-generators/from_csv_generator.py symbol-generators/BQ24004-example.csv"
    verified: "真实运行（test_package 内）：exit 0，生成 BQ24004-example.kicad_sym（约 6.9KB）校验存在且非空后移除该单文件恢复包目录原状"

# 上游 Makefile 中未纳入运行的目标（非测试或依赖不可用，见 notes.md 第 5 节）：
#   make lint / style / spelling —— black/isort/flake8/codespell 代码风格工具，非测试断言
#   make test-comparelibs-symbols —— comparelibs 自测试设计上接受退出码 2/3（不在意
#     是否 KLC 合规）且 --junit 落盘写文件，与本 test_package 全零退出断言冲突；
#     其被测核心模块（rulebase/junit）已被符号/封装两套 unittest 覆盖

# test_package 自带测试（消费者视角）：先校验包内 klc-check 树完整（3 项布局
# 断言，证明实质依赖被测包），再按上游 Makefile 原样执行上面 4 条命令。
test_package_tests:
  - file: test_klc_check.py
    description: "消费者测试：校验 klc-check/check_symbol.py、test_symbol/、test_footprint.pretty/ 测试数据齐备后，真实执行上游 4 条测试命令（含 test-symgen 生成物存在性校验与包目录恢复），任一非零退出即失败"
    command: "python3 -B test_klc_check.py <package_folder>"

# 断言总数 = 上游 188 个用例断言（符号 133 + 封装 53 + SO-8 单检 1 + test-symgen 1）
#            + test_klc_check.py 自身 3 项布局断言
assertion_count: 191
