# 软件级 manifest — archives/k/kicad-library-utils/
# 遵循 knowledge/ARCHIVE-SPEC.md v3.0

software: kicad-library-utils
display: "KiCad Library Utils"
description: "KiCad 官方库工具集：KLC 规则检查（符号/封装/库表）、库对比、符号生成等纯 Python 命令行工具，KiCad 官方库仓库 CI 的质量门禁"
category: build-tool
homepage: "https://gitlab.com/kicad/libraries/kicad-library-utils"
license: GPL-3.0
build_system: python

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Python 工具集：无 C/C++ 编译单元、无 CMake、非 pip 包；安装语义为整体保留源码树布局（klc-check 等脚本以相对路径引用 ../common），无任何构建步骤"
    - "核心检查路径（common/ + klc-check/）仅依赖 Python 标准库；可选第三方依赖（bs4/click/requests/PIL 等）只出现在 tools/、symbol-generators/、html-diff/、scripts/ 子目录，不在 Conan 依赖闭包内声明"
    - "统一以 python3 -B 调用上游脚本：不写字节码，保持已安装包目录卫生（运行/测试不在包内遗留 __pycache__，包目录与构建修订保持一致）"
    - "上游测试体系为 unittest（上游 Makefile test-klc-symbols / test-klc-footprints），不需要 pytest"
  common_dependencies:
    - "python3 (>= 3.8；OHOS PC 真机为 3.12.9)"

# 版本索引
versions:
  "0.0-git20260711.a8c0d0e":
    status: built
    build_date: "2026-09-25"
    conan_ref: "kicad-library-utils/0.0-git20260711.a8c0d0e"
