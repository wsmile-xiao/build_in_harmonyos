knowledge_gained:
  - "KPlotting is the lightest KF5 Tier 1 piece: zero KF5 library dependencies (Qt5Widgets + ECM only), so the whole CMAKE_SYSTEM_NAME=Linux double-override skeleton (kcoreaddons5/kitemviews5/kpeople5 chain) builds it with no extra dependency wiring."
  - "The OHOS conan toolchain maps os=OHOS to CMAKE_SYSTEM_NAME=HarmonyOS (no UNIX, cross-compiling, no CMake >= 4 Platform/ module); the double override (tc.variables + tc.cache_variables with the matching CMAKE_SYSTEM_PROCESSOR, kcalcore5 precedent) is what survives the toolchain's own early system-name detection and makes ECM register the four ecm_add_tests cases."
  - "examples/ is added unconditionally by the 5.116.0 tarball (no ENABLE_EXAMPLES guard) and upstream installs nothing from it (no install() rule), so the package deliverable stays lib + headers + cmake configs + mkspecs pri; the kplottest demo still builds as a free consumer-side header validation."
  - "E537-class: CMAKE_BUILD_WITH_INSTALL_RPATH=ON leaves the install step nothing to rewrite so libKF5Plotting.so keeps loading (OHOS refuses mmap PROT_EXEC on post-link-rewritten ELFs); unversioned DT_SONAME via CMAKE_PLATFORM_NO_VERSIONED_SONAME + -Wl,-soname, passes the W3 CI L5 gate."
  - "In-package OHOS signing (kdsingleapplication/1.2.1 block): llvm-objcopy --remove-section .codesign then binary-sign-tool sign -selfSign 1 on every installed relocatable ELF; verified by readelf/objdump on the packaged lib and asserted by the test_package R53 check."
