version: 1
package: kplotting5/5.116.0
homepage: https://invent.kde.org/frameworks/kplotting

tests:
  upstream:
    status: passed
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    source: "kplotting-5.116.0/autotests/"
    expected:
      - kplotpointtest
      - kplotaxistest
      - kplotobjecttest
      - kplotwidgettest
  package:
    status: passed
    source: test.cpp
    command: "./test_kplotting5"
    description: >-
      Drives the real KPlotting public API (KPlotPoint geometry/label/barWidth,
      KPlotAxis tick format/marks, KPlotObject pen/brush/points, KPlotWidget
      limits/objects/colors/padding) and asserts HarmonyOS-specific behaviour:
      the offscreen QPA platform plugin is active; the loaded libKF5Plotting.so
      carries the unversioned DT_SONAME plus a DT_RUNPATH (E537 install-RPATH
      adaptation) and a .codesign section (OHOS binary-sign-tool signing).

notes:
  - "KPlotting is a pure Qt5 Widgets library; OHOS runs it headless through
     the offscreen QPA platform plugin (QT_QPA_PLATFORM=offscreen)."
  - "The recipe forces CMAKE_SYSTEM_NAME=Linux (variables + cache_variables
     double override, kcalcore5 precedent) so CMake defines UNIX and does not
     report a cross build; without that ECM skips the ctest registration of
     the four upstream tests and the POSIX flag/rpath settings."
  - "Upstream tests are run from build() with ctest; all four pass with no
     exclusions (the suite needs no session bus and no display server)."
