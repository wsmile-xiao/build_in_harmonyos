# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kelbt/0.16
homepage: "http://www.colm.net/open-source/kelbt/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游无 make check 目标（automake foreign 且 Makefile.am 无 TESTS），上游测试为空
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：kelbt --version + 用 .kh 语法文件生成 parser header + 输出断言"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 6
