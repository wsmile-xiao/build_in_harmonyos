version: "0.16"
status: built
build_date: "2026-09-21"

source:
  url: "https://www.colm.net/files/kelbt/kelbt-0.16.tar.gz"
  sha256: "252566b17001b082ad03b8eb5ae0cde9429b661478b605ec018840cba7a2c4b3"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$HOME/usr/local"
  dependencies: []

patches_applied:
  - "0001-configure-fix-hmdfs-tmpdir.patch"

knowledge_gained:
  - "kelbt 上游发布包自带生成的 klscan.cpp / klparse.{h,cpp}，DIST 文件 build_parsers=no，configure 无需 ragel/kelbt bootstrap"
  - "configure.ac 未调用 AC_CANONICAL_HOST，因此不存在 config.guess 平台识别问题，无需 --host/--build triplet"
  - "上游无 make check 目标（automake foreign 且无 TESTS），上游测试套件为空"
  - "HMDFS 屏蔽 other 执行位且文件 owner uid 与构建进程不一致，configure 直接 exec 报 Permission denied，需用 sh 显式执行"
  - "鸿蒙 /tmp 只读，configure/config.status 需把 TMPDIR 指向 /data/storage/el2/base/cache，临时目录移到 TMPDIR"
  - "ARM64 上 char 默认 unsigned，kelbt 生成的 klparse.cpp 中 char arr[]={-1} 触发 C++11 narrowing，需加 -fsigned-char"
