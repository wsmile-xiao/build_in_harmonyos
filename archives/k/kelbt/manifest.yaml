software: kelbt
display: "kelbt"
description: "Backtracking LR parser generator — generates C++ parsers from .kl/.kh grammar files"
category: build-tool
homepage: "http://www.colm.net/open-source/kelbt/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游发布包自带生成的 klscan.cpp/klparse.{h,cpp}（DIST=build_parsers=no），无需 ragel/kelbt bootstrap"
    - "configure.ac 未调用 AC_CANONICAL_HOST，无 config.guess 平台识别问题，无需 --host/--build triplet"
    - "R26 终端工具静态链接：OHOS 下 tc.extra_ldflags.append('-static')"
    - "HMDFS 屏蔽 other 执行位（E046/E047）→ configure 用 sh 显式执行，绕过直接 exec 的 Permission denied"
    - "鸿蒙 /tmp 只读（E002）→ TMPDIR 指向 /data/storage/el2/base/cache"
    - "confXXX 临时目录在 HMDFS 导致 awk 脚本权限异常（E087）→ 补丁 0001 把 ac_tmp 移到 TMPDIR"
    - "ARM64 上 char 默认 unsigned 触发 C++11 narrowing（klparse.cpp 的 char arr[]={-1}）→ 加 -fsigned-char"
    - "上游无 make check 目标，test_package 用 .kh 语法文件生成 header 自行构造消费验证"
  common_dependencies: []
  status: built

versions:
  "0.16":
    status: built
    build_date: "2026-09-21"
