    - ki18n/6.18.0
    - kiconthemes/6.18.0.1
    - kwidgetsaddons/6.18.0
    - kxmlgui/6.18.0
    - kdbusaddons/6.29.0
    - statusnotifieritem/6.26.0
    - libx11/1.8.13
    - libxtst/1.2.5
    - extra-cmake-modules/6.29.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-x11-cmake-fixes.patch"
  - "0002-ohos-x11-dead-includes.patch"

knowledge_gained:
  - "本机 cmake 4.1.2 无 HarmonyOS 平台模块：SYSTEM=HarmonyOS → UNIX=FALSE → FindX11 等 if(UNIX) 模块整体静默跳过（configure 无错误、仅 X11_FOUND=FALSE）；toolchain 设 CMAKE_SYSTEM_NAME=Linux 修复（ref: E092）"
  - "kmousetool 源码 5 个 X11 头为死 include：Intrinsic.h/StringDefs.h/xtestext1.h 仅 libXt 提供而全仓无 libxt 包；fixx11h.h 为 kdelibs 遗留头不存在；Xmd.h 由 xorgproto 提供可保留（ref: E092 同类 find_path 静默失败诊断法）"
  - "鸿蒙PC 开发机对 conan 工具链构建的 GUI 应用 ELF 执行一律 EPERM（execve errno=1），与大小/PIE/RUNPATH/程序头无关；应用型包 test_package 按 actiona 先例做产物契约断言 + 编译运行 API smoke（ref: E253 create_process EPERM 同源平台限制）"
