version: "26.04.0"
software: "kmousetool"

# 编译状态: built (本地 conan create 全量通过 + conan-verify 通过，未上传远端)
status: built
build_date: "2026-09-19"
build_system: cmake

source:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/kmousetool-26.04.0.tar.xz"
  sha256: "3eec4e18549856a6f30836f96de7c33ba136c41ddccbcfe7ec44269e26216b81"
