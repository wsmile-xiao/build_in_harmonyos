software: ksystemstats
display: "KSystemStats"
description: "KDE Plasma system statistics daemon (org.kde.ksystemstats D-Bus service) with its sensor plugins and the kstatsviewer CLI"
category: system
homepage: "https://invent.kde.org/plasma/ksystemstats"
license: GPL-2.0-only OR GPL-3.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "平台判定错配：OHOS clang 定义 __linux__，源码走 Q_OS_LINUX 分支，而 conan 映射的 CMAKE_SYSTEM_NAME=HarmonyOS 让 CMake 的 Linux 门控为假；统一到 KSYSTEMSTATS_LINUX_PLATFORM 后 Linux 后端（/proc、sysfs、rtnetlink、PSI、hwmon）才真正启用"
    - "libQt6DBus 运行期 dlopen(libdbus-1)，制品仓只有静态 libdbus-1.a；必须 vendor 共享 libdbus-1.so 才能使用会话总线"
    - "已发布 libksysguard/6.7.2 未启用 lm-sensors，不导出 KSysGuard::makeSensorsFeatureSensor；温度传感器与 lmsensors 插件因此关闭（见 notes.md，恢复需先重发 libksysguard）"
    - "已发布 libksysguard 的 ELF 含旧 Conan cache 绝对路径与 ../bin 相对路径 DT_NEEDED，需按 E537 建兼容链接"
    - "KDEInstallDirs 把插件装到 lib/plugins，QT_PLUGIN_PATH 必须指向它"
  common_dependencies:
    - libksysguard
    - qtbase
    - kcoreaddons
    - solid

versions:
  "6.7.2":
    status: built
    build_date: "2026-09-27"
    conan_ref: "ksystemstats/6.7.2"
