# conandata.yml — ksystemstats 6.7.2
sources:
  url: "https://download.kde.org/stable/plasma/6.7.2/ksystemstats-6.7.2.tar.xz"
  sha256: "b4f6dedd0db69ce5b2e4a56500664c6409802b6986096febed3ceb8a49e04f2f"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Treat HarmonyOS as a Linux-like platform, lower the KF6 floor to the published 6.18 series, make KF6KIO and the lm-sensors temperature sensors selectable, and import the KSysGuard link-interface components"
    patch_type: "portability"
  - patch_file: "patches/0002-plugins-CMakeLists.txt.patch"
    patch_description: "Build the pressure plugin on the Linux-like platform family"
    patch_type: "portability"
  - patch_file: "patches/0003-plugins-cpu-CMakeLists.txt.patch"
    patch_description: "Build the Linux CPU backend on the Linux-like platform family"
    patch_type: "portability"
  - patch_file: "patches/0004-plugins-cpu-autotests-CMakeLists.txt.patch"
    patch_description: "Register the upstream TestLinuxCpu autotest on the Linux-like platform family and give it the private KF6::I18n/lm-sensors dependencies its sources need"
    patch_type: "portability"
  - patch_file: "patches/0005-plugins-cpu-linuxcpu.cpp.patch"
    patch_description: "Compile the CPU temperature sensor only when lm-sensors support is enabled"
    patch_type: "portability"
  - patch_file: "patches/0006-plugins-cpu-linuxcpuplugin.cpp.patch"
    patch_description: "Compile the CPU hwmon temperature discovery only when lm-sensors support is enabled"
    patch_type: "portability"
  - patch_file: "patches/0007-plugins-disks-CMakeLists.txt.patch"
    patch_description: "Link the disks plugin against KF6KIO only when KSYSTEMSTATS_USE_KIO is enabled"
    patch_type: "portability"
  - patch_file: "patches/0008-plugins-disks-disks.cpp.patch"
    patch_description: "Report filesystem free space through QStorageInfo when KIO is disabled"
    patch_type: "portability"
  - patch_file: "patches/0009-plugins-gpu-CMakeLists.txt.patch"
    patch_description: "Build the Linux GPU backend on the Linux-like platform family, locate the libdrm include directory for the Intel helper and wire the lm-sensors paths"
    patch_type: "portability"
  - patch_file: "patches/0010-plugins-gpu-IntelHelper.cpp.patch"
    patch_description: "Replace std::ranges::transform, which the standard library in use does not provide, with the classic algorithm"
    patch_type: "portability"
  - patch_file: "patches/0011-plugins-gpu-LinuxAmdGpu.cpp.patch"
    patch_description: "Compile the AMD GPU hwmon temperature discovery only when lm-sensors support is enabled"
    patch_type: "portability"
  - patch_file: "patches/0012-plugins-lmsensors-CMakeLists.txt.patch"
    patch_description: "Wire the lm-sensors include/library paths into the lmsensors plugin"
    patch_type: "portability"
  - patch_file: "patches/0013-plugins-memory-CMakeLists.txt.patch"
    patch_description: "Build the memory plugin and its Linux backend on the Linux-like platform family"
    patch_type: "portability"
  - patch_file: "patches/0014-plugins-network-CMakeLists.txt.patch"
    patch_description: "Build the rtnetlink network backend on the Linux-like platform family"
    patch_type: "portability"
  - patch_file: "patches/0015-plugins-network-RtNetlinkBackend.h.patch"
    patch_description: "Guard the kernel-side struct sockaddr_storage definition while the netlink headers are parsed on non-glibc Linux systems"
    patch_type: "portability"
  - patch_file: "patches/0016-src-CMakeLists.txt.patch"
    patch_description: "Wire the lm-sensors include/library paths into the daemon core"
    patch_type: "portability"
  - patch_file: "patches/0017-src-daemon.cpp.patch"
    patch_description: "Initialise and clean up lm-sensors only when sensors support is enabled"
    patch_type: "portability"
