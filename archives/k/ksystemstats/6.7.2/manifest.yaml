knowledge_gained:
  - "OHOS platform detection is split: the clang target aarch64-linux-ohos defines both __OHOS__ and __linux__, so Qt's qsystemdetection.h reports Q_OS_LINUX and every #ifdef Q_OS_LINUX branch in a source tree is taken, while conan maps settings.os=OHOS to CMAKE_SYSTEM_NAME=HarmonyOS, for which the upstream CMAKE_SYSTEM_NAME STREQUAL \"Linux\" gates are all false. Any project using both idioms ends up compiling the CMake-excluded sources against Linux-only headers and fails; the fix is one KSYSTEMSTATS_LINUX_PLATFORM-style variable that both sides agree on."
  - "The published libksysguard/6.7.2 (and any KSysGuard consumer) exports makeSensorsFeatureSensor only when it was itself configured with lm-sensors: systemstats/CMakeLists.txt compiles SensorsFeatureSensor.cpp under if(SENSORS_FOUND) but the header declares the function under a bare #ifdef Q_OS_LINUX. On OHOS the registry has lm-sensors but no libksysguard built with it, so supplying lm-sensors (which upstream marks REQUIRED on Linux) turns into an undefined-symbol link error. Consumers must gate the sensors API on the same condition the library uses (HAVE_SENSORS in this recipe)."
  - "libQt6DBus loads its dbus client with QLibrary(\"libdbus-1\") at runtime and therefore records neither a DT_NEEDED entry nor undefined dbus_* symbols, which makes readelf inspection suggest a statically linked client. The registry only publishes a static libdbus-1.a, so the load fails silently and QDBusConnection::sessionBus() returns an unconnected connection (isConnected()==false, baseService empty); QtDBus then crashes with SIGSEGV at ~0x60 when a DBusInterface call is issued. Runtimes must vendor/build a shared libdbus-1.so.3 and put it on LD_LIBRARY_PATH."
  - "The published libksysguard/6.7.2 carries two unloadable DT_NEEDED forms: libKSysGuardFormatter.so names its KF6 dependencies by absolute path under the Conan cache layout of the build machine (~/.cache/conan2, a prefix that no longer exists), and libKSysGuardSystemStats.so names libKSysGuardFormatter.so by the relative path ../bin/libKSysGuardFormatter.so. Loaders resolve any NEEDED entry containing a slash verbatim (LD_LIBRARY_PATH never applies), so one directory symlink bridging the stale prefix plus materialized ../bin links for each ctest working directory are required (E537 pattern)."
  - "KDEInstallDirs installs plugins under <prefix>/lib/plugins, not <prefix>/plugins, so a package's runenv_info QT_PLUGIN_PATH must point at lib/plugins for KPluginMetaData::findPlugins(\"<app>\") to discover them; pointing at <prefix>/plugins silently yields a daemon with no providers."
  - "kstatsviewer --list prints a container as \"<id> <name>\" when the container has no child objects yet and as \"<id>/...\" once objects exist, so assertions on published containers must accept both forms."
