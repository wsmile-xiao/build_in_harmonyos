# test_package manifest for ksystemstats 6.7.2
name: consumer_check
description: >-
  Consumer-side end-to-end test for ksystemstats 6.7.2 on HarmonyOS PC.
  Starts the packaged org.kde.ksystemstats daemon against a private
  (TCP + ANONYMOUS) session bus, then drives it with the packaged
  kstatsviewer CLI: asserts that the packaged sensor plugins published
  sensors for the cpu/memory/disk/network/os/power/pressure/gpu containers
  and that cpu/all/usage reports a live value over D-Bus.
version: 1.0.0

homepage: "https://invent.kde.org/plasma/ksystemstats"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error --timeout 120"
upstream_registered: 8
upstream_executed: 8
upstream_pass_rate: "8/8 (100%)"
upstream_executables_registered: 3
upstream_executables_executed: 3
upstream_count_basis: "QTest test functions (3 CTest executables / 8 functions); *_data() providers are not counted separately"

upstream_tests:
  - file: autotests/main.cpp
    source: ksystemstats-6.7.2/autotests/main.cpp
    description: >-
      ksystemstatstest — QTest over the real Daemon (org.kde.ksystemstats):
      sensor lookup, update frame dispatch, subscription/unsubscription
      refcounting, value change propagation and the D-Bus API (allSensors /
      sensorData / subscribe / newSensorData). Needs a session bus.
      6 QTest functions, all passing: initTestCase, findById, update,
      subscription, changes, dbusApi.
    command: "ctest -R ksystemstatstest"
  - file: plugins/cpu/autotests/TestLinuxCpu.cpp
    source: ksystemstats-6.7.2/plugins/cpu/autotests/TestLinuxCpu.cpp
    description: >-
      TestLinuxCpu — QTest parsing the bundled /proc/cpuinfo fixtures
      (amd64, amd64 NUMA, arm, arm without trailing newline) through
      LinuxCpuPluginPrivate. Registered only when the Linux platform is
      selected; enabled by patch 0004.
      1 QTest function, passing: testParseCpuinfo (4 data rows).
    command: "ctest -R TestLinuxCpu"
  - file: plugins/gpu/autotests/nvidia.cpp
    source: ksystemstats-6.7.2/plugins/gpu/autotests/nvidia.cpp
    description: >-
      nvidiatest — QTest parsing the bundled nvidia-smi dmon fixtures through
      NvidiaSmiProcess. Registered together with the gpu plugin, which needs
      UDev (provided by eudev/3.2.14).
      1 QTest function, passing: testDmonParsing (3 data rows).
    command: "ctest -R nvidiatest"

test_package_tests:
  - file: consumer_check.sh
    description: >-
      Starts the packaged daemon and drives it with the packaged kstatsviewer
      CLI; asserts the executables are present, that the daemon publishes
      sensors for the cpu/memory/disk/network/os/power/pressure/gpu
      containers, and that cpu/all/usage reports a live value.
    command: "sh consumer_check.sh <package_folder> <dbus-daemon> <work_dir>"

assertion_count: 14
