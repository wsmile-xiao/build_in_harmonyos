package: kicad-library-templates/10.0.5
homepage: "https://gitlab.com/kicad/libraries/kicad-templates"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  上游 10.0.5 是纯模板资源仓库，没有独立 tests/ 目录、CTest 测试或测试目标；
  本测试包提供资源消费者验证和 HarmonyOS 专项验证。
test_package_tests:
  - file: test_package.cpp
    description: >-
      消费者视角验证 19 个工程模板、177 个安装资源文件、19 个工程/板卡/原理图
      文件和 36 个 worksheet，并读取 KiCad 文件头部格式。
    command: "kicad_templates_probe <template-resource-root>"
  - file: harmonyos_specific_test.cpp
    description: >-
      鸿蒙特有测试：确认 __OHOS__ 与 HarmonyOS PC aarch64/x86_64 架构，
      并用 HarmonyOS POSIX open/read 实际读取工程模板和 worksheet。
    command: "kicad_templates_harmonyos_probe <template-resource-root>"
assertion_count: 13
