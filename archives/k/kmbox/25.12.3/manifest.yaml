knowledge_gained:
  - "KMbox exports the KPim6Mbox CMake package and KPim6::Mbox target."
  - "The library depends publicly on KMime through KPim6::Mime."
  - "The upstream test suite registers mbox-mboxtest and mbox-mboxbenchmark when BUILD_TESTING is enabled."
  - "MBoxEntry::isValid() treats offset 0 as invalid, while the first message in an empty mbox is legitimately written at offset 0; consumer tests should validate first-message append with messageSize() or a reload/readback."
  - "OHOS target file permission handling does not make the chmod-read-only test file reopen through QFile as read-only, so the upstream read-only-permission subtest is skipped without changing library code."
