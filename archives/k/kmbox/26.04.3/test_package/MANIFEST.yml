package: kmbox/26.04.3
homepage: "https://invent.kde.org/pim/kmbox"

upstream_check_command: "ctest --test-dir <build-folder> --output-on-failure --no-tests=error --timeout 300 -j 1"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build-folder> --output-on-failure --no-tests=error --timeout 300 -j 1"
upstream_tests:
  - file: autotests/mboxtest.cpp
    source: kmbox-26.04.3/autotests/mboxtest.cpp
    description: "上游 CTest 唯一目标 mbox-mboxtest，验证 mbox 邮件持久化"
    command: "ctest --test-dir <build-folder> -R '^mbox-mboxtest$' --output-on-failure --no-tests=error --timeout 300 -j 1"

test_package_tests:
  - file: test_package/test_kmbox.cpp
    description: "消费者通过 KMbox 公开 API 写入并重新读取 MIME 邮件"
    command: "conan create archives/k/kmbox/26.04.3 -pr:h=ohos-aarch64 -pr:b=ohos-aarch64 --build=missing"

assertion_count: 11
device_result: "HarmonyOS AArch64：共享与静态各运行 1 个消费者用例，均通过；每种配置 11 项断言"
