software: kealib
version: "1.6.2"
category: science
status: built

build_system: cmake
compiler: clang 15.0.4
linker: GNU ld 2.45

dependencies:
  hdf5: 1.14
  gdal: 3.8

configure_options:
  - CMAKE_INSTALL_PREFIX=$HOME/usr/local
  - CMAKE_BUILD_TYPE=Release

build_notes:
  - No source modifications needed - built cleanly with HDF5 and GDAL
  - ELF signed for HarmonyOS execution

artifacts:
  - libkea.so shared library
  - kea-config utility
  - KEA header files
  - Kealib cmake configs

source_url: https://github.com/ubars/kealib/archive/kealib-1.6.2.tar.gz
