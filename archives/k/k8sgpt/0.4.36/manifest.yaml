knowledge_gained:
  - "Go 1.26+ 的 go/linker 二进制内嵌 '.codesign' 字面字符串，按内容 grep '.codesign' 判断已签名会全部误判跳过（Go 1.24 无此问题），必须无条件 objcopy 去段后重签"
  - "OHOS 沙箱内 Go 进程 fork/exec 脚本文件（shebang）被 EACCES 拒绝（fork/exec 签名 ELF 正常），go test -exec wrapper 必须编译成 ELF 后自签再用"
  - "OHOS 沙箱按二进制标签做访问控制：自签名 ELF 不可读 /etc/hosts（系统签名 cat 可读），Go 纯解析器因此跳过 hosts 直查 DNS，测试内 localhost 拨号全部 NXDOMAIN"
  - "gomonkey 运行时改码依赖 mprotect(PROT_EXEC)，被 OHOS Seccomp W^X 策略阻断，属平台硬限制（pkg/analysis 1 个用例）"
  - "Go linker 在 HMDFS 上 mmap 失败，链接输出与 GOCACHE/GOMODCACHE/TMPDIR 全部重定向到 /data/storage/el2/... 非 HMDFS 工作区"

