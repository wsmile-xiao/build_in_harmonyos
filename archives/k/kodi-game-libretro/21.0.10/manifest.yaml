source:
  url: https://github.com/kodi-game/game.libretro/archive/refs/tags/21.0.10-Omega.tar.gz
  sha256: 42afe6b98a6ca7f65f06b4e88abf98ad58cf74d20397b591397b83bd4c526fc7
  tar_format: tar.gz
build:
  system: cmake
  configure_options: []
  dependencies:
    - tinyxml/2.6.2
    - "kodi add-on SDK headers from xbmc 21.3-Omega tarball (kodi-dev-kit include subtree, sha256 a60afcb556e4a00cb19fc35b7e77758107c9a8096c6ce9b66af5f92396be31aa)"
    - "vendored libretro-common @ 50c15a88eb741cbe675743a282d8cc4c89421e3f (header-only, sha256 042986fad22dc37188df7a186d17a258edfe8e552353f9b509a47418e8dfa623)"
    - "vendored rcheevos v9.2.0 (static lib, sha256 c8ed6ca74f905ea0c256250e46cced579922880001337e7c3d3d68179ad89d4e)"
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - Upstream build needs find_package(Kodi)+build_addon() (kodi-addon-dev);
    recipe supplies its own CMake entry under recipe-cmake/ consumed via
    build_script_folder, building the unmodified upstream sources
  - Kodi add-on SDK headers are extracted selectively (kodi-dev-kit include
    only) from the xbmc 21.3-Omega tarball via conandata sources.sdk
  - libretro-common/rcheevos have no conan packages; vendored per upstream
    depends/common pins — libretro-common headers rearranged to
    libretro-common-include/libretro-common (sources use the
    "libretro-common/<header>.h" include form), rcheevos built as a PIC
    static lib with the upstream source list and RC_DISABLE_LUA, public
    headers mirrored to rcheevos-include/rcheevos/ (sources use the
    "rcheevos/<header>.h" include form)
  - Module target keeps the exact upstream output name game.libretro.so
    (PREFIX ""); game clients need no GLES/EGL (rendering goes through the
    Kodi Game API)
software: kodi-game-libretro
build_system: cmake
