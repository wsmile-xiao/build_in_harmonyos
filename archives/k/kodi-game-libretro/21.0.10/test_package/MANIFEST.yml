# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: kodi-game-libretro/21.0.10
homepage: "https://github.com/kodi-game/game.libretro"

# Upstream game.libretro 21.0.10-Omega ships no test suite:
# no tests/ directory, no enable_testing()/add_test() in CMakeLists.txt; the
# upstream CI configurations (.github/workflows/ has only
# sync-addon-metadata-translations.yml, azure-pipelines.yml and Jenkinsfile)
# only build the add-on through the kodi/cmake/addons pipeline.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream has no test programs
upstream_tests: []

# test_package consumer-side tests
test_package_tests:
  - file: test_game_libretro.cpp
    description: "dlopen()s the packaged game.libretro.so, verifies the Kodi 21 binary add-on entry points (ADDON_Create, ADDON_GetTypeVersion, ADDON_GetTypeMinVersion) resolve, and runs ADDON_GetTypeVersion()/ADDON_GetTypeMinVersion() for the game client instance (type 104) expecting 3.0.2 / min 3.0.0"
    command: "./test_game_libretro <libdir>/game.libretro.so"
    assertion_count: 5

assertion_count: 5

notes: |
  上游 game.libretro 21.0.10-Omega 无任何测试注册（无 tests/ 目录，CMakeLists
  无 enable_testing/add_test，.github/workflows 仅 i18n 同步，
  azure-pipelines/Jenkins 仅构建）。test_package 为消费者侧真实检查：
  dlopen 打包产物、dlsym 三个入口符号、并实际调用
  ADDON_GetTypeVersion/MinVersion 校验 game client 实例 API 版本
  3.0.2（min 3.0.0）。
