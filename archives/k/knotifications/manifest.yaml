software: knotifications
display: "KNotifications"
description: "KDE Frameworks 6 desktop notification library (KNotification/KNotificationPermission/KNotificationReplyAction/KNotifyConfig)"
category: library
homepage: "https://invent.kde.org/frameworks/knotifications"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "USE_DBUS=OFF + patch disabling the DBus/Canberra block: Qt6DBus component not published, libcanberra not yet in ohpcd registry"
    - "BUILD_PYTHON_BINDINGS patched back to quiet probing (6.26 upstream made it a REQUIRED option)"
    - "ecm_install_po_files_as_qm(poqm) patched out: Qt6LinguistTools not published to ohpcd"
    - "ECM 6.26+ KDEInstallDirs6 runs qtpaths at configure time; sandbox LD_LIBRARY_PATH must have /system/lib64 prepended so the compatible libc++_shared.so is found"
    - "Upstream CTest add_test count is 0 in this feature set: autotest commented out upstream (needs DBus session bus), tests/ guarded by HAVE_DBUS"
  common_dependencies:
    - qtbase
    - kconfig
    - ecm

versions:
  "6.26.0":
    status: built
    build_date: "2026-09-06"
    conan_ref: "knotifications/6.26.0"
  "6.14.0":
    status: built
    build_date: "2026-08-11"
    conan_ref: "knotifications/6.14.0"
