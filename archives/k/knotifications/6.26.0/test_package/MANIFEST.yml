# test_package/MANIFEST.yml
# Upstream and consumer test declaration for knotifications/6.26.0.
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: knotifications/6.26.0
homepage: https://invent.kde.org/frameworks/knotifications

# Upstream test commands (used for ctest -N analysis)
upstream_check_command: "ctest -N"

# Upstream tests are integrated in the Conan build (BUILD_TESTING=ON)
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=ignore"

# Upstream tests actually registered in the current feature set
# (USE_DBUS=OFF, no Qt6Qml/Quick, no DBus session bus in headless CI):
#   - autotests/CMakeLists.txt: the KNotificationTest ecm_add_test block is
#     commented out UPSTREAM (needs a DBus session bus +
#     fake_notifications_server); 0 CTest entries from this dir.
#   - tests/CMakeLists.txt: unitylaunchertest + knotificationdbustest are
#     guarded by if (HAVE_DBUS); 0 CTest entries with USE_DBUS=OFF.
#   - examples/: notificationtester + actiontest are manual example
#     executables (no add_test, need Qt6 Quick which is not published).
# Upstream N (CTest add_test count, measured with ctest -N): 0.
# ctest is run with --no-tests=ignore (not error) because the upstream
# add_test count is genuinely 0 in this feature set; the command still
# executes and would fail on any real test failure.
upstream_tests: []

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke: KNotification eventId/title/text/icon/flags/actions API assertions"
    command: "conan create (test_package builds and runs test_knotifications)"

# Test assertion count (approximate, for quality assessment)
assertion_count: 6
