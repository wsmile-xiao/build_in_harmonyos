# 版本级 manifest
# 文件位置: archives/{letter}/{name}/6.26.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.26.0"

# 软件名
software: "knotifications"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.kde.org/stable/frameworks/6.26/knotifications-6.26.0.tar.xz"

  # 源码校验和
  sha256: "2033a798856a9d2776e6e4cef6f3eb3bc24b938c0d00b06b2f6e71be44e1446a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=ON"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DUSE_DBUS=OFF"
    - "-DBUILD_DESIGNERPLUGIN=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - qtbase/6.11.1
    - kconfig/6.26.0
    - ecm/6.26.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "KDE Frameworks 6.26 版本跟进：DBus+Canberra 块 if(FALSE) 禁用（沿 6.14 底稿语义）"
  - "BUILD_PYTHON_BINDINGS 上游 6.26 从 dependent_option 改为显式 option，需补丁恢复静默探测语义"
  - "ecm_install_po_files_as_qm 需注释（Qt6LinguistTools 不在 qtbase 制品包）"
