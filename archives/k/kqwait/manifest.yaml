software: kqwait
display: "kqwait"
description: "BSD kqueue 文件/目录等待工具（OHOS 移植版：inotify 实现）"
category: system
homepage: "https://github.com/sschober/kqwait"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "核心依赖 kqueue/kevent(EVFILT_VNODE)，OHOS 无此 API —— 以 inotify 语义等价重写（见 patches/kqwait-ohos-inotify-port.patch）"
    - "CLI/输出/退出码与上游完全一致：file 事件打印路径，dir 事件打印 dirinfo 对称差（+/- 前缀）"
    - "上游测试 t/kqwait.pl 依赖 perl IPC::Run（本机不可满足），断言 1:1 移植为 t/run_upstream_tests.sh"
  common_dependencies: []

versions:
  "1.0.3":
    status: built
    build_date: "2026-09-15"
