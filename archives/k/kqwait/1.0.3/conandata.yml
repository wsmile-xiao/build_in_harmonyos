patches:
  "1.0.3":
    - patch_file: "patches/0001-kqwait-ohos-inotify-port.patch"
      patch_description: "OHOS port: replace BSD kqueue with inotify (semantics-preserving). kqueue/kevent/EVFILT_VNODE do not exist on OHOS (no sys/event.h in the sysroot, no kqueue/kevent symbols in libc). The patch rewrites the event source to inotify while keeping CLI, stdout format and exit codes byte-identical to upstream. Also fixes an upstream getopt() bug that loops forever on unsigned-char platforms (arm64: char defaults to unsigned)."
      patch_type: "portability"
