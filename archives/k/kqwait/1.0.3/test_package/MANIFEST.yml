# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kqwait/1.0.3
homepage: https://github.com/sschober/kqwait

# 上游测试命令（上游 Makefile: test: prove -v t/*.pl）
upstream_check_command: "make test"

# 上游测试 = prove -v t/kqwait.pl（15 项 Test::More 断言），
# 依赖 perl IPC::Run —— 本机 perl 无该模块且不可安装（Can't locate IPC/Run.pm），
# 按 TEST_QUALITY_SPEC 3.3 声明豁免：断言 1:1 移植为 t/run_upstream_tests.sh
#（POSIX sh），由 conanfile.py build() 直接执行（RC!=0 即失败）。
upstream_test_in_build: true
upstream_test_command: "sh t/run_upstream_tests.sh"

upstream_tests:
  - name: "kqwait"
    source: kqwait-1.0.3/t/kqwait.pl
    description: "上游集成测试（5 场景 × 3 断言 = 15 项：单文件写/多文件选择/目录 create/目录 delete/文件+目录混合），prove + IPC::Run 依赖不可满足，断言移植为 t/run_upstream_tests.sh 在 build() 执行"

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "消费者功能测试：--help/-v 冒烟 + 单文件写等待（打印路径退出 0）+ OHOS 专项（目录 delete → dirinfo diff 输出 '- path/victim'、目录 create → '+ path/created'），验证 inotify 移植的等待/事件核心行为"
    command: ""

# 上游 15 项断言（移植执行）+ 消费者测试 6 组断言（rc/out/err 校验）
assertion_count: 21
