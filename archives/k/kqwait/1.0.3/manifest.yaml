software: kqwait
version: "1.0.3"
build_system: makefile  # 上游单行 clang 编译，conanfile.py 等价直呼 cc
status: built
build_date: "2026-09-15"

test_passed: 21
test_failed: 0

source:
  url: "https://github.com/sschober/kqwait/archive/refs/tags/kqwait-v1.0.3.tar.gz"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []  # 无 configure，直接编译 kqwait.c + dirinfo.c
  cc: clang

patches_applied:
  - patches/0001-kqwait-ohos-inotify-port.patch  # kqueue→inotify 移植 + getopt unsigned-char 修复

knowledge_gained:
  - "kqwait 以 BSD kqueue/kevent(EVFILT_VNODE) 为核心，OHOS libc 无 kqueue/kevent（sysroot 无 sys/event.h），内核亦不提供该 syscall"
  - "OHOS 内核 inotify 完整可用（7 类边沿事件探针全过），kqueue 等待语义可用 inotify 忠实重写：NOTE_WRITE→IN_MODIFY/IN_CREATE/IN_DELETE/IN_MOVED_*，NOTE_DELETE→IN_DELETE_SELF，NOTE_RENAME→IN_MOVE_SELF/IN_MOVED_*"
  - "关键映射陷阱：inotify IN_DELETE=子项被删（走 dirinfo diff），IN_DELETE_SELF=被 watch 路径自身被删（对应 kqueue NOTE_DELETE 短路 '- path'），混淆会破坏上游输出语义"
  - "上游 getopt() 用 char 存返回值，在 unsigned-char 平台（aarch64）(char)-1!= -1 导致无限循环 —— 移植需改 int"
  - "上游 tag kqwait-v1.0.3 内 version.h 为 'v1.0.2-1-g0425-dirty'（打包失误），构建时需覆写为 v1.0.3"
