  - "Qt6GuiPrivate is required by the upstream autotest link set (Qt >= 6.10); it ships with qtbase/6.11.1."
  - "With X11/Wayland/QML disabled the only registered CTest is kwindowsystemplatformwaylandtest, which QSKIPs when weston is absent - same single-test surface as 6.18.0."
