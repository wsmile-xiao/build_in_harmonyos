knowledge_gained:
  - "kwindowsystem 6.26.0 keeps the same OHOS option set as 6.18.0: KWINDOWSYSTEM_X11=OFF / KWINDOWSYSTEM_WAYLAND=OFF / KWINDOWSYSTEM_QML=OFF (dummy backend provides the symbols)."
  - "The 6.18.0 CMake patch needed regeneration for 6.26.0: line numbers moved (ECMQmlModule include now at line 29, ecm_install_po_files_as_qm at line 89) and the QT deprecation baseline changed from 6.10.0 to 6.11.0; the semantic changes are identical."
