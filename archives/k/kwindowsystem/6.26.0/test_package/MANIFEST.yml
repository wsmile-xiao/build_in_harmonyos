# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kwindowsystem/6.26.0.

package: kwindowsystem/6.26.0
homepage: https://invent.kde.org/frameworks/kwindowsystem

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kwindowsystem-6.26.0/autotests/
    description: "KWindowSystem upstream CTest/autotests suite"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON; with X11/Wayland off, the only registered test is the wayland platform test which skips itself without weston"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke calls KWindowSystem::showingDesktop()."
    command: "conan create (test_package builds and runs test_kwindowsystem)"

assertion_count: 1
