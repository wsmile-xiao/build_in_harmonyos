# 版本级 manifest — kamailio-gcrypt 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-gcrypt"
status: built                      # R29 口径：conan_verify/conan create 已 PASS 但尚未 conan upload → built；发布流水线（合并后）上传成功再转 published
build_date: "2026-09-29"
build_system: makefile                # kamailio 经典 Makefile 体系（非 autotools/cmake）
conan_ref: "kamailio-gcrypt/6.0.6"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  scope: "gcrypt 模块（不编译 kamailio 主程序）"
  configure_options:
    - "make cfg include_modules=\"gcrypt\" extra_defs=\"见本文件 build.platform_defs\" GCRYPT_BUILDER=\"pkg-config libgcrypt\" LOCALBASE=<libgcrypt 包目录>"
    - "make modules modules=\"modules/gcrypt\" -j1 extra_defs=\"见本文件 build.platform_defs\" GCRYPT_BUILDER=\"pkg-config libgcrypt\" LOCALBASE=<libgcrypt 包目录>"
  platform_defs: "-D_GNU_SOURCE -DHAVE_GETHOSTBYNAME2 -DHAVE_SCHED_YIELD -DHAVE_MSG_NOSIGNAL -DHAVE_MSGHDR_MSG_CONTROL -DHAVE_ALLOCA_H -DHAVE_TIMEGM -DHAVE_SCHED_SETSCHEDULER -DHAVE_IP_MREQN（共 9 项 = -D_GNU_SOURCE + 8 个 -DHAVE_*，与 conanfile.py PLATFORM_DEFS 逐项一致）"
  parallel_jobs: 1
  parallel_jobs_reason: "E525/E074：OHOS SELinux 禁止用户进程创建 FIFO，GNU make jobserver 靠 FIFO 传递令牌 → -j>1 有挂起/报错风险；与同族其余 kamailio-* 配方一致固定 -j1"
  modules:
    - gcrypt
  dependencies:
    - libgcrypt/1.12.2
    - libgpg-error/1.55
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 上游 6.0.6 源码包原生识别 aarch64-unknown-linux-ohos；平台差异全部经 make
# 命令行变量表达（OS=harmonyos + extra_defs 宏集 + libgcrypt 依赖探测钉死），
# 未改动任何上游源文件/构建文件
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`（生成 src/config.mak），否则报 No rule to make target 'cfg-defs'；`make modules modules='modules/gcrypt'` 指定单模块目录即可只编该模块 (knowledge_ref: notes.md#3-构建方法)"
  - "OS=harmonyos 不在 Makefile.defs 的 linux/solaris/freebsd/darwin 任一分支 → HAVE_GETHOSTBYNAME2/HAVE_SCHED_YIELD 等平台探测宏全部缺失，core 头 resolve.h/sched_yield.h 直接 #error。解法：make 命令行 extra_defs 注入 linux 分支等价宏集（9 项，对照 OHOS SDK sysroot 实证存在） (knowledge_ref: notes.md#41-平台探测宏缺失)"
  - "只编模块、不编 core 是零补丁的关键：core/resolve.c 的 _res（HAVE_RESOLV_RES）与 core/lock_ops.h 的 union semun（HAVE_UNION_SEMUN）在 OHOS musl 头文件中无对应定义，仅编译 kamailio 主程序时才触发 (knowledge_ref: notes.md#42-只编模块不编-core)"
  - "gcrypt/Makefile 在 CROSS_COMPILE 为空时用 `pkg-config --exists libgcrypt` 探测（GCRYPT_BUILDER），未命中回退 LOCALBASE；因该 Makefile 无 DEFS/LIBS 覆盖变量，钉死依赖包的正确姿势是『命令行变量覆盖 GCRYPT_BUILDER + PKG_CONFIG_PATH 指向依赖包』，并以 CPATH/LIBRARY_PATH 兜底（pkg-config 缺失时仍可编译链接） (knowledge_ref: notes.md#43-libgcrypt-依赖探测三重钉死)"
  - "OHOS/musl 加载器不做惰性绑定（dlopen 等价 RTLD_NOW），core 插件类 .so 的消费测试须自带 core 符号桩层；桩层类型必须逐字段对齐上游头文件（my_pid/dprint_color 是函数而非变量、log_level_info 是数组、_km_log_func 须指向非空 sink），否则日志路径 LM_ERR 解引用野指针 → SIGSEGV 掩盖真实失败原因 (knowledge_ref: knowledge/drafts/kamailio-gcrypt-6.0.6-ohos-plugin-stub-type-alignment.kv)"
  - "插件模块携带非系统同名库 DT_NEEDED（此处 libgcrypt.so.20）时的产物闭包校验与运行时定位口径：编译通过 ≠ 可加载，须验证未定义符号 100% 被依赖包提供 + 依赖链闭合；依赖链由 conan 提供运行时 .so（不静态、不打 RPATH），部署经 LD_LIBRARY_PATH 定位 (knowledge_ref: knowledge/drafts/kamailio-gcrypt-6.0.6-ohos-plugin-external-dynlib-closure.kv)"

# 本配方 0 补丁：平台差异全部经 make 命令行（extra_defs/依赖变量）注入，未改动上游源文件。
