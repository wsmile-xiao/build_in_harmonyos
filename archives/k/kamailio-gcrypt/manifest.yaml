software: "kamailio-gcrypt"
display: "Kamailio gcrypt module"
description: "Kamailio SIP 服务器 gcrypt 模块（libgcrypt 密码学函数，运行时加载模块 .so）"
category: "sip-server"
homepage: "https://www.kamailio.org"
license: "GPL-2.0-or-later"
build_system: makefile

ohos_adaptation:
  approach: "零补丁 + make 命令行变量注入平台差异（OS=harmonyos + extra_defs 宏集 + libgcrypt 探测钉死）"
  scope: "仅编译 gcrypt 模块，不编译 kamailio 主程序（模块 .so 由 kamailio 运行时 loadmodule 加载）"
  deps:
    - "libgcrypt/1.12.2（构建期与运行时依赖，**动态**：OHOS sysroot 与目标机均无 libgcrypt → 非系统同名库，由 conan 依赖链提供运行时 .so，部署需 LD_LIBRARY_PATH）"
    - "libgpg-error/1.55（libgcrypt 的传递依赖，同样动态）"
  notes: "详细适配记录见 6.0.6/notes.md"

versions:
  "6.0.6":
    status: built
    conan_ref: "kamailio-gcrypt/6.0.6"
    build_date: "2026-09-29"
