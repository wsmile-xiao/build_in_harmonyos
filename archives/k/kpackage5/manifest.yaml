software: kpackage5
display: "kpackage5"
description: "KDE Frameworks 5 library and tool for loading and installing non-binary package content (Qt5)"
category: desktop
homepage: "https://invent.kde.org/frameworks/kpackage"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "Qt5-only KF5 module; requires Qt5 Core and Qt5 DBus (no USE_DBUS switch in 5.116.0)"
    - "qt5-qtbase/5.15.2.2 is the only Qt5 revision on this farm built with -dbus"
    - "KF_IGNORE_PLATFORM_CHECK / KF_SKIP_PO_PROCESSING / KF5DocTools disabled for the OHOS baseline"
    - "Upstream CTest suite runs from build() with HOME and XDG_* redirected into the build tree"
  common_dependencies:
    - "qt5-qtbase/5.15.2.2"
    - "karchive5/5.116.0"
    - "kcoreaddons5/5.116.0"
    - "ki18n5/5.116.0"
    - "ecm/6.26.0"

versions:
  "5.116.0":
    status: built

