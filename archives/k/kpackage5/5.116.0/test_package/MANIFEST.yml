package: kpackage5/5.116.0
homepage: "https://invent.kde.org/frameworks/kpackage"

upstream_check_command: "ctest --test-dir <build> --output-on-failure --no-tests=error -E ^plasma-plasmoidpackagetest$"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error -E ^plasma-plasmoidpackagetest$"
upstream_tests:
  - file: autotests/CMakeLists.txt
    description: "Registers 5 plasma-* QTest binaries (32 test functions) plus 6 kpackagetool5 appstream integration entries; total 11 CTest entries"
  - file: autotests/packagestructuretest.cpp
    description: "KPackage::PackageStructure load/description assertions"
  - file: autotests/querytest.cpp
    description: "PackageLoader query and metadata resolution; needs KPACKAGE_DEP_RESOLVERS_PATH"
  - file: autotests/kpackagetoolappstreamtest.cmake
    description: "Driver for the 6 appstream integration entries; execs the built kpackagetool5 binary"

test_package_tests:
  - file: test_kpackage5.cpp
    description: "Link against KF5::Package and load a package structure through KPackage::PackageLoader"
    command: "./test_kpackage5"

assertion_count: 3
