knowledge_gained:
  - "kpackage 5.116.0 hard-requires Qt5 Core AND Qt5 DBus (CMakeLists.txt:45); 5.116.0 has no USE_DBUS switch."
  - "qt5-qtbase/5.15.2.2 is built with -dbus and publishes a Qt5DBus component; the older qt5-qtbase/5.15.2 is -no-dbus and therefore unusable for kpackage5."
  - "kcoreaddons5/5.116.0 and ki18n5/5.116.0 are already published on ohpcd; karchive5 5.116.0 is the single missing member of the required KF5 set."
  - "ECM 6.x numerically satisfies find_package(ECM 5.116.0); this repository already relies on that for attica5 5.116.0."
  - "Because the library cannot be configured, the L0-L5 CI gates and the upstream CTest suite are unreachable at this time."
