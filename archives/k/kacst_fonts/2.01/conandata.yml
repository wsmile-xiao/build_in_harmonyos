  "2.01":
    # 上游：KACST（沙特阿卜杜勒阿齐兹国王科技城）阿拉伯字体集 2.01。
    # 平台任务名 kacst_fonts / 版本 2.01；Debian 源包 fonts-kacst 的
    # `2.01+mry.orig` 引用同一份字体数据（"mry" 是 Debian 维护者的重打包标记，
    # 字体文件本身未改），文件名里的 "+" 在 URL 里写作 %2B。
    url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/f/fonts-kacst/fonts-kacst_2.01%2Bmry.orig.tar.bz2"
    sha256: "6f2899ce9622314ea426cf8d48849f1cf17302726d73cb683486d5fdf2a23338"
