knowledge_gained:
  - "kwidgetsaddons 6.26.0 still defaults BUILD_PYTHON_BINDINGS to ON (guarded off only for ANDROID/APPLE/WIN32/HAIKU or static builds); the OHOS recipe must keep passing BUILD_PYTHON_BINDINGS=OFF to avoid Shiboken6/PySide6 discovery (6.18.0 precedent)."
  - "kwidgetsaddons 6.26.0 raises cmake_minimum_required from 3.16 to 3.29 and Qt minimum from 6.7 to 6.9; qtbase 6.11.1 satisfies the Qt requirement."
  - "The po/qm patch needed only a context-line refresh for 6.26.0 (QT deprecation version line moved from 6.10 to 6.11); the semantic change (disable ecm_install_po_files_as_qm) is identical."
  - "New upstream autotest kactionmenutest appears in 6.26.0 (26 CTest entries total); the two 6.18.0 OHOS headless exclusions (ktooltipwidgettest hang, kwidgetsaddons-kcolumnresizertest offscreen geometry assert) remain required."
