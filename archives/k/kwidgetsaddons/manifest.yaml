software: kwidgetsaddons
display: "KWidgetsAddons"
description: "KDE Frameworks 6 widgets add-ons (KPageWidget/KMessageWidget/KDatePicker/KPasswordDialog/KColorScheme and 30+ widget helpers)"
category: library
homepage: "https://invent.kde.org/frameworks/kwidgetsaddons"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "BUILD_PYTHON_BINDINGS=OFF: upstream 6.26 still defaults it ON (only auto-off for ANDROID/APPLE/WIN32/HAIKU/static); Shiboken6/PySide6 not published to ohpcd"
    - "BUILD_DESIGNERPLUGIN=OFF: Qt6UiPlugin/Qt Designer plugin not published to ohpcd"
    - "ecm_install_po_files_as_qm(poqm) patched out: Qt6LinguistTools not published to ohpcd"
    - "ECM 6.26+ KDEInstallDirs6 runs qtpaths at configure time; sandbox LD_LIBRARY_PATH must have /system/lib64 prepended so the compatible libc++_shared.so is found"
    - "Two upstream autotests excluded on OHOS headless: ktooltipwidgettest (offscreen hang) and kwidgetsaddons-kcolumnresizertest (offscreen geometry assert)"
  common_dependencies:
    - qtbase
    - ecm

versions:
  "6.26.0":
    status: built
    build_date: "2026-09-05"
    conan_ref: "kwidgetsaddons/6.26.0"
  "6.18.0":
    status: built
    build_date: "2026-08-19"
    conan_ref: "kwidgetsaddons/6.18.0"
  "6.14.0":
    status: built
    build_date: "2026-08-10"
    conan_ref: "kwidgetsaddons/6.14.0"
