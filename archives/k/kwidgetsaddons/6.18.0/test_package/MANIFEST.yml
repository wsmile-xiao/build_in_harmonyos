# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kwidgetsaddons/6.18.0.

package: kwidgetsaddons/6.18.0
homepage: https://invent.kde.org/frameworks/kwidgetsaddons

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: autotests/
    source: kwidgetsaddons-6.18.0/autotests/
    description: "KWidgetsAddons upstream CTest/autotests suite"
    command: "ctest --output-on-failure"
    condition: "not run in the Conan build because BUILD_TESTING=OFF"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke creates KPageWidgetModel and checks addPage/rowCount behavior."
    command: "conan create (test_package builds and runs test_kwidgetsaddons)"

assertion_count: 2
