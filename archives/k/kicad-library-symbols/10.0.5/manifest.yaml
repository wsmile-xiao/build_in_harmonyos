version: "10.0.5"
software: kicad-library-symbols
status: built
build_date: "2026-09-18"
build_system: cmake

source:
  url: "https://gitlab.com/kicad/libraries/kicad-symbols/-/archive/10.0.5/kicad-symbols-10.0.5.tar.gz"
  sha256: "8d3b17c9f1d9266d546eb22552d29a427f02d9956b88858f6a0ca2bb197c9cf4"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DKICAD_PACK_SYM_LIBRARIES=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "纯数据 CMake 工程 project(NONE)：无编译产物，构建期仅用上游自带 Python 脚本把 .kicad_symdir 打包为单文件 .kicad_sym（Python3 需在 PATH，profile buildenv 已提供）"
  - "安装布局遵循上游默认 KICAD_DATA=share/kicad：符号库在 share/kicad/symbols，全局符号表在 share/kicad/template/sym-lib-table，仿真模型 Simulation_SPICE.sp 一并安装"
  - "设备无 Python3 或打包失败时可回退 -DKICAD_PACK_SYM_LIBRARIES=OFF（原样安装 .kicad_symdir 目录树），test_package 数据校验对两种模式均兼容"
