package: kicad-library-symbols/10.0.5
homepage: "https://gitlab.com/kicad/libraries/kicad-symbols"

# Upstream ships NO automated test suite: upstream CI (.gitlab-ci.yml) only
# runs kicad-library-utils KLC style linting against the symbols, which is a
# repository-side static check, not an executable test for this payload.
upstream_check_command: "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build && cmake --install build"
upstream_test_in_build: false
upstream_test_command: "none (no upstream test suite — NO_UPSTREAM_TESTS)"

upstream_tests: []

test_package_tests:
  - file: validate_data.py
    description: "Data-integrity validation: symbol libraries installed, well-formed s-expression data, sym-lib-table parses with full entries, SPICE model present"
    command: "python3 validate_data.py <package_folder>"

assertion_count: 0
