knowledge_gained:
  - "klibc 为 kernel-style kbuild 构建（自定义 Makefile），通过 KLIBCARCH/CC/AR/LD 等变量交叉编译，无 make install 兼容性（用 Conan copy 打包）"
  - "klibc 构建硬依赖 Linux UAPI 头（KLIBCKERNELSRC）；OHOS SDK sysroot 提供 linux/ 与 asm-generic/，但 asm 头位于 aarch64-linux-ohos/asm 而非标准 asm-arm64，需 KLIBCASMDIR 变量适配"
  - "usr/include/Kbuild 用 ln -fsn 创建 asm 符号链接，HMDFS 有符号链接限制；改 cp -rf 复制并物化 asm 头供 package 打包"
  - "HarmonyOS 无 gcc/ar/ld，klibc 需命令行覆盖 CC/AR/RANLIB/STRIP/NM/OBJCOPY/OBJDUMP/LD/HOSTCC 为 clang/llvm-*（GNU make 命令行变量覆盖 Makefile 普通赋值）"
  - "klibc 2.0.14 已内置 clang/lld 支持：cc-name 检测 clang 分支、LD_IS_LLD 自动切换 --image-base/-Ttext-segment"
  - "构建还需 perl（syscalls.pl/makeerrlist.pl 生成 syscall 桩与 errlist）与 HOSTCC（编译 fixdep/sha1hash 主机工具）"
  - "klibc 静态 main 入口为三参数 main(argc, argv, envp)，crt0.S 调 __libc_init 解析初始栈"
  - "klibc 是 initramfs 专用 libc，syscall 为 Linux ABI 编号，与 OHOS 内核 syscall 兼容性需真机运行确认"
  - "OHOS clang 不支持 --print-sysroot，需用 --print-resource-dir 向上 4 级推导 sysroot"
  - "OHOS sysroot 的 include 含 musl 头（stdarg.h 依赖 bits/alltypes.h），klibc 编译只应 -I linux/asm/asm-generic 内核 UAPI 头，否则 #include_next 污染"
  - "OHOS 内核头用 _KERNEL__NSIG 而非标准 Linux _NSIG，需映射适配"
  - "HMDFS 不支持硬链接（E079），klibc 共享库 soname 的 ln -f 需改 cp -f"
  - "klibc 顶层 Kbuild 的 all 目标递归 usr/kinit、usr/dash、usr/utils、usr/gzip 等额外工具，libc 本体适配只需 scripts/basic + usr/klibc"
  - "klibc 消费者需 -D__KLIBC__=2 -D__KLIBC_MINOR__=0 -D_BITSIZE=64 及 -isystem clang-include（stdarg.h #include_next）"
  - "klibc 上游测试 ELF 由 kbuild 的 ld.lld 直接链接 + strip，无 .codesign 段被内核拒绝 exec（E077）；运行前 binary-sign-tool -selfSign 1 签名 + chmod +x 后 35/39 通过"
  - "真机 shadow CI 通过：L0/L1/L4/L5 pass、L2 skip（klcc 非阻塞），Build Summary Success 1；上游测试 37 passed / 2 failed（testrand48 上游硬编码 return 1、malloctest3 因 OHOS mmap VA 限制 4GB+1 分配失败，均非 klibc 缺陷）"
