# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: klibc/2.0.14
homepage: "https://www.kernel.org/pub/linux/libs/klibc/"

# 上游测试命令：klibc 用 make test 构建 usr/klibc/tests 下的测试程序（不运行），
# 再由配方逐个运行静态版本。
upstream_check_command: "make test"

# conanfile.py build() 是否集成上游测试：是（build() 内 make test 构建后逐个运行，15s 超时保护）
upstream_test_in_build: true
upstream_test_command: "make test; 逐个运行 usr/klibc/tests 下的静态测试程序"

# 上游测试程序（usr/klibc/tests 下 39 个 .c，static + shared 两版本）
upstream_tests:
  - file: "usr/klibc/tests/*.c"
    source: "klibc-2.0.14/usr/klibc/tests/"
    description: "klibc 上游测试套件：39 个静态测试程序（字符串/stdio/stdlib/time/socket/mmap 等），build() 内 make test 构建后逐个运行"
    command: "make test; 逐个运行 usr/klibc/tests 下的静态程序（timeout 15 保护）"

# test_package 自带测试（消费者视角，R34：真实调用 klibc API）
test_package_tests:
  - file: test_klibc.c
    description: "消费者视角：strcpy/strcat/strlen/strcmp/printf 验证 klibc 头文件与静态库可用"
    command: "./test_probe"

# 测试断言总数（test_package 3 项断言；上游测试为独立程序，不计入断言数）
assertion_count: 3
