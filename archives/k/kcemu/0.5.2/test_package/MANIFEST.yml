# test_package/MANIFEST.yml
# kcemu 0.5.2 - upstream test declaration.

package: kcemu/0.5.2
homepage: "https://github.com/redcode/kc85_emu"

upstream_tests_exist: true
upstream_test_audit: >-
  Upstream's automake test suite declares three TESTS across test/kc and
  test/libaudio: t_prefs (test/kc/prefs), t_memstream (test/kc) and t_load
  (test/libaudio).  t_memstream and t_load are only built under the
  HAVE_CPPUNIT conditional, and configure.ac hardcodes
  `AM_CONDITIONAL(HAVE_CPPUNIT, false)` (line 271), so they are never built -
  only t_prefs actually runs.  The recipe builds t_prefs and runs it; the two
  cppunit tests are skipped by the upstream hardcoded conditional.
upstream_check_command: "make -C test/kc/prefs t_prefs && ./test/kc/prefs/t_prefs"
upstream_test_in_build: true
upstream_test_command: "./test/kc/prefs/t_prefs"
upstream_tests:
  - file: "test/kc/prefs/t_prefs.cc"
    description: "preferences save/load; built and run here"
  - file: "test/kc/t_memstream.cc"
    description: "not built: gated on HAVE_CPPUNIT which configure.ac hardcodes false"
  - file: "test/libaudio/t_load.cc"
    description: "not built: gated on HAVE_CPPUNIT which configure.ac hardcodes false"

test_package_tests:
  - file: test_kcemu.cpp
    description: "C++ consumer: installed prefs/dbg/sys libraries drive Preferences init/find_profile/save (4 assertions)"
    command: "clang++ test_kcemu.cpp -lprefs -ldbg -lsys_unix -lglib-2.0 && ./test_kcemu"

test_files:
  - path: "test_package/test_kcemu.cpp"
    test_type: "R34"
    assertion_count: 4

test_package_test_count: 1
consumer_assertion_count: 4
upstream_test_cases: 4
assertion_count: 4
