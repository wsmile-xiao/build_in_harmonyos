version: "0.5.2"
software: "kcemu"
status: built
build_date: "2026-09-26"
build_system: "autotools (autoreconf + configure + make)"

source:
  url: "https://deb.debian.org/debian/pool/contrib/k/kcemu/kcemu_0.5.2+dfsg.orig.tar.gz"
  sha256: "4fe1dad607ae3a1bfcab8808eec9932f169e58067631a3bdea642a5431d7c744"
  tar_format: tar.gz
  note: >-
    另外在 source() 取 z80ex 1.1.21（z80ex_1.1.21.orig.tar.gz，
    sha256 6f5e521d068a614b41e10180ad4ae45b1bc258ec28c962543feb9078856c2530）——
    它是硬依赖但制品仓没有，配方内自行编译。

build:
  system: autotools
  configure_options:
    - "--host=aarch64-linux-gnu"
    - "--with-debug-level=1"
    - "--disable-sound"
    - "--disable-nls"
    - "禁用到全部可选编解码库"
  dependencies:
    - "glib/2.84.0.1"
    - "zlib/1.3.1.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-configure-ac-config-headers.patch"

knowledge_gained:
  - "kcemu 的 configure.ac 用废弃的 AM_CONFIG_HEADER（automake>=1.13 移除）→ 改 AC_CONFIG_HEADERS"
  - "GTK+2 完整栈在本环境无法构建（pango 需 meson，且制品仓只有 recipe 无二进制）→ 用 stub gtk+-2.0.pc（暴露 glib）让 configure 通过，只构建非 GUI 部分"
  - "AM_PATH_SDL 在无 SDL 时仍会被 autoconf 展开 → 提供 config/m4/sdl.m4 桩"
  - "配置时撞上 E011（HMDFS + autoconf umask 077：config.status 的 subs1.awk Permission denied）→ sed 改 umask 022"
  - "z80ex 未在制品仓 → 配方内用 clang 编译 z80ex.c/z80ex_dasm.c 为静态库并装到本地 prefix"
  - "只跑上游 t_prefs（其余两个测试被 configure.ac 硬编码 HAVE_CPPUNIT=false 关掉）"
