software: kcemu
display: "kcemu"
description: "KC85/CCS 等计算机模拟器（本适配打包 CLI 工具与 prefs/dbg/sys 库）"
category: utility
homepage: "https://github.com/redcode/kc85_emu"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GTK+2 完整栈无法在本环境构建（pango 需 meson）→ stub gtk+-2.0.pc 只暴露 glib，仅构建非 GUI 部分"
    - "z80ex 硬依赖但制品仓没有 → 配方内编译 z80ex.c/z80ex_dasm.c"
    - "AM_CONFIG_HEADER 废弃 → AC_CONFIG_HEADERS；提供 AM_PATH_SDL 桩宏"
    - "E011（HMDFS umask 077 导致 config.status subs1.awk Permission denied）→ sed 改 umask 022"
    - "上游 configure.ac 硬编码 HAVE_CPPUNIT=false，只跑 t_prefs"
  common_dependencies:
    - "glib/2.84.0.1"
    - "zlib/1.3.1.1"

versions:
  - version: "0.5.2"
    status: built
    build_date: "2026-09-26"
