# 编译中学到的知识
knowledge_gained:
- "制品仓 qtbase/6.11.1 FEATURE_printsupport=OFF（组件仅 core/gui/network/widgets/xml），Qt 应用需打印功能时须裁剪或改用 QtGui 的 QPdfWriter"
- "制品仓 qtbase/6.11.1 实际包含 libQt6Test.so + Qt6TestConfig.cmake（FEATURE_testlib=ON），纯 Qt6Test 单元测试可在 CI offscreen 运行，不应以'无 Test 模块'为由跳过上游测试"
- "上游 TranslateMetainfo.cmake 硬依赖 Gettext(msgfmt)，CI clean 环境无 gettext，Linux 桌面元数据处理需裁剪"
- "qt_add_translations(qttools LinguistTools) 组件目录需显式注入 Qt6LinguistTools_DIR（Qt6Config 组件搜索受 PATHS 限定）"

