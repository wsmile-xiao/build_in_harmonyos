# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kapow/1.7.0
homepage: "https://gottcode.org/kapow/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -DENABLE_TESTS=ON . && ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest（conanfile.py build() 内 cmake.test()，offscreen 运行）"

# 上游实际运行的测试程序 (ENABLE_TESTS=ON 时 CTest 注册 2 项，W3 实测 2/2 Passed)
upstream_tests:
  - file: tests/test_filters/test_filters.cpp
    source: kapow-1.7.0/tests/test_filters/test_filters.cpp
    description: "FilterModel 单元测试（QTest，13 项断言，实测 Passed 0.06s）"
    command: "test_filters"
  - file: tests/test_sessions/test_sessions.cpp
    source: kapow-1.7.0/tests/test_sessions/test_sessions.cpp
    description: "Session/SessionModel 单元测试（QTest，34 项断言，实测 Passed 0.04s）"
    command: "test_sessions"

# 集成说明：上游测试仅链接 Qt6::Core+Qt6::Test（不依赖 GUI）。制品仓
# qtbase/6.11.1 包内含 libQt6Test.so 与 Qt6TestConfig.cmake
# （FEATURE_testlib=ON），配方 ENABLE_TESTS=ON + build() 内 cmake.test()
# 即可在 CI offscreen 环境运行。W3 本地实测：100% tests passed,
# 0 tests failed out of 2。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "offscreen 冒烟测试：启动 kapow 二进制，验证 Qt 初始化与主窗口构造成功"
    command: "bash test.sh"

# 测试断言总数 (上游 QTest 断言近似值, 用于质量评估)
assertion_count: 47
