# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: krb5-strength/3.3
homepage: "https://www.eyrie.org/~eagle/software/krb5-strength/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 TAP 套件 22 文件 / 332 测试由 try/except 守卫: C 测试驱动是 target
# 二进制, 交叉编译时 host 无法执行 (R51 技术原因), 原生构建时全量运行。
upstream_test_in_build: true
upstream_test_command: "make check (try-except guarded: target binaries execute natively on OHOS workers, degraded on x86 shadow)"

# 上游实际运行的测试程序 (TAP harness: tests/runtests 驱动)
upstream_tests:
  - file: tests/plugin/mit-t.c
    source: krb5-strength-3.3/tests/plugin/mit-t.c
    description: "MIT pwqual 插件功能测试 (密码强度策略检查)"
    command: "./tests/plugin/mit-t"
  - file: tests/plugin/heimdal-t.c
    source: krb5-strength-3.3/tests/plugin/heimdal-t.c
    description: "Heimdal kadm5 钩子功能测试"
    command: "./tests/plugin/heimdal-t"
  - file: tests/util/messages-t.c
    source: krb5-strength-3.3/tests/util/messages-t.c
    description: "util/messages 消息格式化测试"
    command: "./tests/util/messages-t"
  - file: tests/util/messages-krb5-t.c
    source: krb5-strength-3.3/tests/util/messages-krb5-t.c
    description: "util/messages-krb5 Kerberos 错误消息测试"
    command: "./tests/util/messages-krb5-t"
  - file: tests/portable/asprintf-t.c
    source: krb5-strength-3.3/tests/portable/asprintf-t.c
    description: "portable asprintf 测试"
    command: "./tests/portable/asprintf-t"
  - file: tests/portable/mkstemp-t.c
    source: krb5-strength-3.3/tests/portable/mkstemp-t.c
    description: "portable mkstemp 测试"
    command: "./tests/portable/mkstemp-t"
  - file: tests/portable/reallocarray-t.c
    source: krb5-strength-3.3/tests/portable/reallocarray-t.c
    description: "portable reallocarray 测试"
    command: "./tests/portable/reallocarray-t"
  - file: tests/portable/strndup-t.c
    source: krb5-strength-3.3/tests/portable/strndup-t.c
    description: "portable strndup 测试"
    command: "./tests/portable/strndup-t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "dlopen 加载 pwqual 插件并校验 pwqual_strength_initvt 接口符号 (RTLD_NOW 全量符号解析, 验证 krb5 动态库依赖链)"
    command: "./test_krb5-strength <plugin-path>"

# 测试断言总数 (近似值, 用于质量评估)
# host 探索编译: Files=22, Tests=332, 全部通过, 159 skipped
# (skip 原因: host 缺 IPC::Run/cdb/DBI perl 模块, xmalloc 仅作者构建, valgrind 未启用)
assertion_count: 332
