# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 门禁 L0e 强制要求存在；口径见 docs/TEST_QUALITY_SPEC.md）

package: knxd/0.14.73
homepage: "https://github.com/knxd/knxd"

# automake 的 check 目标存在，但上游所有 Makefile.am 里 TESTS / check_PROGRAMS 均为 0
# （计数命令见 notes.md「测试账本」节）=> make check 是"零用例的通过"，不是有内容跑过了。
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游真实存在的测试资产：一个未接入 make check 的手工集成脚本 + 一个未构建的可选用例
upstream_tests:
  - file: tools/test.sh
    source: knxd-0.14.73/tools/test.sh
    description: "手工集成测试：knxd 参数语义 7 条（Bad argument A–F 6 条 + 第 49 行组缓存前置门 1 条） + 三守护进程组播/隧道链路 14 条（合计 21 条断言）。上游未接入 make check，不在 SUBDIRS 里"
    command: "sh tools/test.sh"
    executed_in_build: false
    not_executed_reason: >-
      后 14 条要起 3 个 knxd 守护进程并用组播 224.99.98.x/UDP 隧道与 golden log 比对，
      本轮 W3 未取该面证据；前 6 条（Bad argument A–F）已在 test_package/test.sh 中以同判据复现，
      第 49 行组缓存前置门 1 条未移植（其失败路径是 exit 0 提前退出，不构成可判定断言）。
  - file: tools/test_inih.cpp
    source: knxd-0.14.73/tools/test_inih.cpp
    description: "可选 inih 配置解析用例（noinst_PROGRAMS）；本包未装 libinih（configure 的 AC_CHECK_HEADER(ini.h) 未命中），且 tools/ 不在 AC_CONFIG_FILES/SUBDIRS 内，上游从不构建它"
    command: "(not built)"
    executed_in_build: false
    not_executed_reason: "依赖未提供的 libinih；上游 Makefile.am 未把 tools/ 纳入 SUBDIRS"

# test_package 自带的测试
test_package_tests:
  - file: test_eibclient.c
    description: "真链接 libeibclient：NULL/错误入参守卫 7 条 + 自建 AF_UNIX 正向链路 4 条"
    command: "ctest 构建产物 test_eibclient（conan test 自动执行）"
  - file: test.sh
    description: "knxd/knxtool 二进制语义：安装定位 2 + --version/--help/版本串 3 + 上游 Bad argument A–F 判据 6 + knxtool 用法 1 + knxd_args 1（合计 13 条）"
    command: "sh test.sh"

# 上游静态合计（make check 面 0 条 + tools/test.sh 21 条 = 21）
assertion_count: 21
