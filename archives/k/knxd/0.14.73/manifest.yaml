# 版本级 manifest
# 文件位置: archives/k/knxd/0.14.73/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "0.14.73"
software: knxd

# published | built | failed | archived | pending_ci
# ⚠ W3(finish step5) 未跑绿前不得写 built/published
status: built

build_date: "2026-09-27"
build_system: autotools

source:
  url: "https://github.com/knxd/knxd/archive/refs/tags/0.14.73.tar.gz"
  sha256: "fc66bb8d4f74e815d9677e0bd5520d965c7049ae306e09956c04ec74599167c3"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-java"
  dependencies:
    - libev/4.33
    - fmt/8.1.1
    - argp-standalone/1.5.0
    - libusb/1.0.27
  tool_dependencies:
    - automake/1.18
    - libtool/2.5.4
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-version.sh-tarball-version-fallback.patch"
  - "0002-ipsupport.cpp-sockaddr-storage-netlink-guard.patch"
  - "0003-Makefile.am-VPATH-version.sh-reference.patch"

knowledge_gained:
  - "GitHub tag 归档是 git 树快照：无 configure/Makefile.in/config.sub，autotools 包必须自举；自举工具在设备上不可用时走 tool_requires（build profile = ohos-aarch64 有已发布二进制）"
  - "设备 ~/usr/local/bin/{aclocal,automake,libtoolize} 的 shebang 指向不存在的 /storage/Users/currentUser/usr/local/bin/perl ⇒ 执行报 'No such file or directory'（缺解释器，不是缺文件），长得像 automake 没装"
  - "上游用 tools/version.sh + m4_esyscmd_s 把版本号绑在 git 元数据上 ⇒ 无 .git 时 AC_INIT 版本为空，且 Makefile.am 的 version.h/REAL_VERSION 也跟着变空"
  - "OHOS musl 无 argp.h/argp_parse（E169）；knxd 主程序用 argp ⇒ 需要 argp-standalone"
  - "configure 硬编码 LIBS=\"-lfmt\" 且工程被 -std=c++0x 钉在 C++11 ⇒ 只能选支持 C++11 的 fmt（8.1.1），11.x/12.x 需 C++17"
  - "HMDFS: configure 的 umask 077 临时目录（E011/E129/E136）须在 autoreconf **之后**改生成物 configure"

patch_generation:
  method: per-file-difflib
  note: "补丁由本地 python difflib(unified_diff, n=3) 生成，并用 git apply --check -p1 验证可应用"

patch_classification:
  - file: 0001-version.sh-tarball-version-fallback.patch
    type: auto
    platform_only: False
    guard: 'n/a'
    note: "非平台宏：修的是「从源码包构建时取不到版本」这一通用缺陷，对所有平台成立，不含 __OHOS__（PF5 面）"
  - file: 0002-ipsupport.cpp-sockaddr-storage-netlink-guard.patch
    type: auto
    platform_only: True
    guard: '__OHOS__'
    note: "平台专属：OHOS sysroot 的 linux/socket.h（内核自动生成件）无条件定义 sockaddr_storage，与 musl 的 sys/socket.h 定义相撞（E091 记录的头文件不一致）。按 E091 rec_approach 的 define-guard 房式写法只在 __OHOS__ 下改名再还原，改动块外有 HAVE_LINUX_NETLINK 包裹 ⇒ 其他平台零影响。PF5(R8) 平台宏闸命中，按其自陈口径以 PR 正文披露理由 + --no-preflight 显式跳过（同基线存量含平台宏补丁实测 662 例，计数命令 grep -rl __OHOS__ archives/*/*/*/patches/*.patch 后 wc -l）。"
  - file: 0003-Makefile.am-VPATH-version.sh-reference.patch
    type: auto
    platform_only: False
    guard: 'n/a'
    note: "非平台宏：树外（VPATH）构建下相对路径 tools/version.sh 找不到 ⇒ 版本号静默为空，属通用 autotools 缺陷，不含 __OHOS__（PF5 面）"
