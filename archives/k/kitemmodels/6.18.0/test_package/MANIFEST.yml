# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kitemmodels/6.18.0.

package: kitemmodels/6.18.0
homepage: https://invent.kde.org/frameworks/kitemmodels

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kitemmodels-6.18.0/autotests/
    description: "KItemModels upstream CTest/autotests suite"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke creates KNumberModel and checks row count/data values."
    command: "conan create (test_package builds and runs test_kitemmodels)"

assertion_count: 3
