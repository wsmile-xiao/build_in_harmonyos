# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kitemmodels/6.18.0.1.

package: kitemmodels/6.18.0.1
homepage: https://invent.kde.org/frameworks/kitemmodels

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kitemmodels-6.18.0/autotests/
    description: "KItemModels upstream CTest/autotests suite (core + QtQml tests)"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON"
  - file: tests/
    source: kitemmodels-6.18.0/tests/
    description: "Upstream widget/QML example tools (proxy model test app, rearrangecolumns)"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON"

test_package_tests:
  - file: test_package/test.cpp
    description: >-
      Consumer test: calls the KNumberModel and KModelIndexProxyMapper C++
      API (R34) and loads the QML module org.kde.kitemmodels via QQmlEngine,
      instantiating KSortFilterProxyModel and asserting its filtered row count
      (R53).
    command: "conan create (test_package builds and runs test_kitemmodels)"

assertion_count: 9
