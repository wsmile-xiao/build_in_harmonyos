knowledge_gained:
  - "kitemmodels 6.18.0 core library needs only Qt6Core, but the QML module org.kde.kitemmodels (src/qml) is only configured when Qt6::Qml is found; enabling it requires qtdeclarative/6.11.1 as a hard requirement."
  - "The QML plugin installs to <prefix>/lib/qml/org/kde/kitemmodels (KDE_INSTALL_QMLDIR defaults to LIBDIR/qml), including qmldir and libitemmodelsplugin.so; no extra copy/package logic is needed."
  - "qtbase and qtdeclarative both use cmake_find_mode=none; both lib/cmake dirs must be PREPENDed to CMAKE_PREFIX_PATH manually."
  - "Qt host tools from the split packages (qmltyperegistrar/qmlcachegen in qtdeclarative/libexec) need the dependency lib dirs on LD_LIBRARY_PATH during configure/build or they fail to relocate Qt6Core symbols."
  - "OHOS CMake emits no SONAME by default: the QML plugin then records a build-tree relative path in DT_NEEDED which the loader cannot resolve. Restore the soname/rpath flags via CMAKE_USER_MAKE_RULES_OVERRIDE."
  - "CMake rewrites the RUNPATH of installed shared libraries, invalidating the OHOS .codesign section; the loader then reports Permission denied. Re-sign every packaged ELF with llvm-objcopy + binary-sign-tool."
