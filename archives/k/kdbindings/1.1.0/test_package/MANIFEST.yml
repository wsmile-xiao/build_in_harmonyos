# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kdbindings/1.1.0
homepage: "https://github.com/KDAB/KDBindings"

# 上游测试命令 (ctest 注册的 5 个测试程序)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 中未集成上游测试（header-only 库，配方只装头文件与 CMake 配置）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（native Release 实测 5/5 通过）
upstream_tests:
  - file: tests/binding/tst_binding.cpp
    source: KDBindings-1.1.0/tests/binding/tst_binding.cpp
    description: "binding 模块测试（Property 绑定/求值）"
    command: "./test-binding"
  - file: tests/node/tst_node.cpp
    source: KDBindings-1.1.0/tests/node/tst_node.cpp
    description: "node 模块测试（表达式节点）"
    command: "./test-node"
  - file: tests/property/tst_property.cpp
    source: KDBindings-1.1.0/tests/property/tst_property.cpp
    description: "property 模块测试"
    command: "./test-property"
  - file: tests/signal/tst_signal.cpp
    source: KDBindings-1.1.0/tests/signal/tst_signal.cpp
    description: "signal 模块测试"
    command: "./test-signal"
  - file: tests/utils/tst_utils_main.cpp
    source: KDBindings-1.1.0/tests/utils/tst_utils_main.cpp
    description: "utils 模块测试（gen_index_array/get_arity）"
    command: "./test-utils"

# test_package 中自带的测试 (消费者视角验证，实际调用 Property/Signal API)
test_package_tests:
  - file: test_kdbindings.cpp
    description: "消费者测试：Property 双向绑定 + Signal 发射接收"
    command: "./test_kdbindings"

# 鸿蒙特有测试 (rule12 补齐：独立新增入口，验证鸿蒙平台行为)
harmony_specific_tests:
  - file: test_harmony_specific.cpp
    description: "uname 平台值进入绑定链 + HMDFS 写读 round-trip + Signal 回调顺序/断开 + /tmp EROFS 只读"
    command: "./test_harmony_specific"

# 测试断言总数 (approx: 5 个 ctest 程序 + 消费者测试 3 组断言 + 鸿蒙特有测试 11 组断言)
assertion_count: 500
