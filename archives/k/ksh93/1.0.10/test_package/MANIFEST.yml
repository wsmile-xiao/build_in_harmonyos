name: ksh93
version: 1.0.10
upstream_url: https://github.com/ksh93/ksh

test_manifest:
  - type: test
    build_system: AST
    source:
      - "bin/package quiet test"
    description: "上游回归测试（14287 tests，13495 passed，通过率 94.5%）"

  - type: test
    build_system: Shell
    source:
      - "test.sh"
    description: "消费者冒烟测试：ksh 基础功能、算术运算、鸿蒙专属检查（6 项）"

  - type: harmonyos_specific
    description: "鸿蒙专属测试"
    cases:
      - "ksh 在无 /bin/bash 的 HarmonyOS 环境下可正常执行"
      - "安装布局中的可执行文件具备执行权限（+x）"
      - "SHELL 环境变量指向的路径在 HarmonyOS 上确实存在"
      - "shcomp 编译器可正常运行"
