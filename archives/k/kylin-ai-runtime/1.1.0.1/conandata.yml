# conandata.yml — kylin-ai-runtime 1.1.0.1
#
# 主源码：openKylin 官方打包 tag build/1.1.0.1-ok0.9（gitee 归档端点对 conan
# 下载器返回 HTML 反爬页，故 source() 改用 Git clone 固定 tag，commit 172314c2）。
#
# 私有依赖（OHOS 制品仓无配方，L0i 要求 requires() 只声明已发布包，故
# 三个 openKylin 私有库在本配方内 vendor 构建，装入 staging 前缀供主构建用）：
#   - ai-proto（协议源）：openkylin/libkylin-ai-system-private debian/1.2.0.1-1
#     内嵌 ai-proto（KylinAiProtoConfig + Functions/Generate 宏 + gdbus XML×7
#     + grpc vector-db protos）。runtime ok0.9 需要 7 个 gdbus 服务 XML 与
#     vecclient 需要的 grpc protos 均在其中；独立 kylin-ai-proto 仓库 XML 旧。
#   - libkysdk-vector-engine-client 1.2.0.0：grpc 客户端 SHARED 库
#     （kysdk-vector-engine-client.pc，runtime pkg_check_modules VECTOR_DB）。
#   - kylin-ai-document-qa-service 1.2.0.0 的 document-qa-client 子目录：
#     gdbus 客户端 SHARED 库（kyai-knowledgebase-client.pc，runtime
#     pkg_check_modules KYAI_KNOWLEDGE_BASE_CLIENT，生成 knowledgebase glue）。
sources:
  # runtime ok0.9 需 AiSdkCommonErrorCode::AISDK_SSL_CERTIFICATE_ERROR，仅
  # kysdk-ai-common build/1.1.0.1-ok0.3+ 的头文件有；制品仓已发布的
  # kysdk-ai-common/1.1.0.1 头较旧 → 头文件 vendor（仅头使用，保留发布依赖
  # 以满足 find_package(KysdkAiCommon)）
  ai-common:
    url: "https://gitee.com/openkylin/kysdk-ai-common/repository/archive/build%2F1.1.0.1-ok0.3.tar.gz"
    sha256: "dd46cf0b9842afb856020f00dd939a41d4e9e8af373a7eb3ed1512efded1afd4"
  ai-proto:
    url: "https://gitee.com/openkylin/libkylin-ai-system-private/repository/archive/debian%2F1.2.0.1-1.tar.gz"
    sha256: "9252749b0112bbfb621ddb6c6e018417e7b1c052315cc36d004affc4f4ff1cc0"
  vecclient:
    url: "https://gitee.com/openkylin/libkysdk-vector-engine-client/repository/archive/upstream%2F1.2.0.0.tar.gz"
    sha256: "68e567888cb886961ba5f9eae35d35a6adca753e932878178cd79c3f1fa2ce65"
  # 注意：取 build/1.2.0.0-ok0.7（openKylin 打包 tag）而非 upstream/1.2.0.0——
  # runtime ok0.9 期望 knowledgebase::KnowledgebaseErrorCode::
  # KNOWLEDGEBASE_VECTOR_DATABASE_DATA_UNAVAILABLE，仅 ok0.6+ 头文件有该枚举
  docqa:
    url: "https://gitee.com/openkylin/kylin-ai-document-qa-service/repository/archive/build%2F1.2.0.0-ok0.7.tar.gz"
    sha256: "4f82ba9838831a355487f4b80e054bbf38cf605dfaef131f79b9df2fc925b2a5"
  main:
    url: "https://gitee.com/openkylin/kylin-ai-runtime.git"
    tag: "build/1.1.0.1-ok0.9"
    commit: "172314c21d7bf3be95dadaf162042cddffd7c4e4"

patches:
  "1.1.0.1":
    - patch_file: "patches/0001-cmakelists-conan-deps-install.patch"
      base_path: "src"
      description: "主 CMakeLists：jsoncpp→JsonCpp::JsonCpp、crypto→OpenSSL::Crypto、curl→CURL::libcurl、pulse/pulse-simple→PkgConfig::LIBPULSE（补 libpulse-simple 模块）、ICU→find_package(icu CONFIG)+icu::icu；pkg_check_modules 块后补 link_directories（-L 不传给 lld 则裸 -l 名找不到）；install /usr/bin|/etc|/usr 绝对路径越权改前缀相对"
    - patch_file: "patches/0002-jsoncpp-include-prefix.patch"
      base_path: "src"
      description: "44 处 #include <jsoncpp/json/...> → <json/...>（制品仓 jsoncpp 头文件在 include/json/，同 libkysdk-ai-private 0002/speech 0005 模式）；test/CMakeLists 的 crypto/jsoncpp 裸名同步改 CONFIG 目标 + link_directories"
    - patch_file: "patches/0003-kylin-ai-proto-functions-paths.patch"
      base_path: "vendor/ai-proto"
      description: "KylinAiProto 宏路径变量化：gdbus-codegen /usr/bin→${KYLAI_GDBUS_CODEGEN}、gdbus XML /usr/share→${KYLAI_GDBUS_PROTOCOL_DIR}、grpc proto /usr/share→${KYLAI_GRPC_PROTOCOL_DIR}、grpc_cpp_plugin find_program→${KYLAI_GRPC_CPP_PLUGIN}（可外部钉死）"
    - patch_file: "patches/0004-kylin-ai-proto-install-prefix.patch"
      base_path: "vendor/ai-proto"
      description: "ai-proto CMakeLists：install(DIRECTORY protocols/usr/ DESTINATION /usr) 绝对路径写 /usr 越权 → ${CMAKE_INSTALL_PREFIX}（staging）"
    - patch_file: "patches/0005-vecclient-cmakelists-conan-targets.patch"
      base_path: "vendor/vecclient"
      description: "vecclient：pkg_check_modules(grpc)+find_package(Protobuf) 改 find_package(gRPC CONFIG)/find_package(Protobuf CONFIG)（grpc 配方 cmake_find_mode=none，注入 gRPC_DIR/Protobuf_DIR/absl_DIR 用上游安装 config），链接目标 grpc++/protobuf → gRPC::grpc++/protobuf::protobuf；install usr/ 绝对路径越权改前缀"
    - patch_file: "patches/0006-docqa-client-install-prefix.patch"
      base_path: "vendor/docqa-client"
      description: "docqa document-qa-client：install(.pc DESTINATION /usr/share/pkgconfig) 绝对路径越权 → ${CMAKE_INSTALL_PREFIX}/share/pkgconfig"
