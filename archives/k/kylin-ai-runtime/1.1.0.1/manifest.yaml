# 版本级 manifest — kylin-ai-runtime 1.1.0.1
# 遵循 ARCHIVE-SPEC v2.0

version: "1.1.0.1"
software: "kylin-ai-runtime"
status: published
build_date: "2026-09-28"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # openKylin 官方打包 tag（gitee 归档端点对 conan 下载器返回 HTML 反爬页，
  # source() 改用 Git clone 固定 tag，commit 172314c2）
  url: "https://gitee.com/openkylin/kylin-ai-runtime.git"
  tag: "build/1.1.0.1-ok0.9"
  git_commit: "172314c21d7bf3be95dadaf162042cddffd7c4e4"
  tar_format: git

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
  # 制品仓已发布依赖（requires()）
  dependencies:
    - "zlib/1.3.2"
    - "openssl/3.5.8.1"
    - "spdlog/1.17.0"
    - "fmt/12.2.0"
    - "jsoncpp/1.9.8.1"
    - "curl/8.22.0"
    - "icu/76.1"
    - "glib/2.88.0"
    - "pulseaudio/17.0.1"
    - "libsodium/1.0.20"
    - "grpc/1.84.0"
    - "nlohmann-json/3.11.2"
    - "libkylin-ai-system-private/1.2.0.0"
    - "kysdk-ai-common/1.1.0.1"
  # 制品仓无配方的 openKylin 私有依赖（本配方内 vendor 构建，R49 staging）
  vendored:
    - "kylin-ai-proto (libkylin-ai-system-private debian/1.2.0.1-1 内嵌 ai-proto)"
    - "kysdk-vector-engine-client (upstream/1.2.0.0)"
    - "document-qa-client (kylin-ai-document-qa-service build/1.2.0.0-ok0.7)"
    - "kysdk-ai-common 头文件 (build/1.1.0.1-ok0.3，仅头使用)"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-cmakelists-conan-deps-install.patch"
  - "0002-jsoncpp-include-prefix.patch"
  - "0003-kylin-ai-proto-functions-paths.patch"
  - "0004-kylin-ai-proto-install-prefix.patch"
  - "0005-vecclient-cmakelists-conan-targets.patch"
  - "0006-docqa-client-install-prefix.patch"

# ============================================================
# 测试
# ============================================================

tests:
  upstream_tests: 5
  upstream_passed: 5
  added_consumer_scenarios: 1
  added_consumer_assertions: 3

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "openKylin 私有库（ai-proto / vector-engine-client / document-qa-client / kysdk-ai-common 新头）在制品仓无配方，需在本配方 source() 内 vendor 并以 R49 staging 前缀供主构建 find_package/pkg_check_modules"
  - "gitee repository/archive 下载端点按 User-Agent 过滤，conan get() 必须带 headers={\"User-Agent\": \"curl/8.0\"}，否则得到 HTML 反爬页"
  - "fmt 12 移除 ostream/枚举格式化回退：日志里的 enum 需 static_cast<int>、std::atomic<bool> 需 .load()，fmt::join 需显式 #include <fmt/ranges.h>"
  - "icu 配方以 --disable-icuio 构建，源码不得 #include <unicode/ustdio.h>"
  - "OHOS 强制加载带 .codesign 的签名 ELF，未签名 .so 使进程 rc=127；上游 pulseaudio/17.0.1 包未签名，需在 test_package 内 binary-sign-tool -selfSign 后使用"
  - "glib/2.88.0 仅提供静态归档：vendor 客户端 .so 与主二进制各自静态内嵌一份 glib，同进程两份 gobject 类型表触发 g_type_register_static 断言；改为从静态归档合成 shared glib（glib/gobject/gmodule/gthread/gio）统一动态链接"
  - "application 类型包（无 cpp_info）的 test_package 不会自动传播 requires，需显式 self.requires(ref, transitive_libs=True) 才能得到完整 LD 闭包"
  - "pkg_check_modules 的 -L（link_directories）不会自动传给 lld，裸 -l 名链接失败时需显式 link_directories"
  - "OHOS PC 上 CMake 探测 CMAKE_SYSTEM_NAME=HarmonyOS 但无 Platform/HarmonyOS.cmake，平台 soname 变量为空，set_target_properties(... SOVERSION) 被忽略、共享库无 DT_SONAME；需按目标传 CMAKE_SHARED_LINKER_FLAGS=-Wl,-soname,lib<name>.so"
