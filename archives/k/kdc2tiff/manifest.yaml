# 软件级 manifest — kdc2tiff
# 遵循 ARCHIVE-SPEC v3.0

software: kdc2tiff
display: "kdc2tiff (Kodak DC120 KDC converter)"
description: "命令行图像格式转换器：把柯达 DC120 的 .kdc 原始图（也可读 TIFF/JPEG）输出为 TIFF 或 JPEG"
category: gfx
homepage: "https://sourceforge.net/projects/kdc2tiff/"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - 'E114: configure 里 config.status 的临时目录用 umask 077 创建，HMDFS 强制 setgid 后属主也写不进去，需移除 umask 077（实测解包件 `grep -c "umask 077" configure` = 2）'
    - 'E050（knowledge/doc/E050.md，本包 B 判定 hit 的命中条目）: HMDFS 不允许创建硬链接——上游 Makefile 用 `ln -f kdc2tiff kdc2jpeg`（实测 Makefile.am:21、Makefile.in:432）造第二个入口名，实跑报 `cannot create hard link ... Operation not permitted`，必须改 `cp -f`。E050 推荐方案原文：「对于 make install, 将 $(LN_FORCE) 改为 $(HARDLINK)(鸿蒙上为 cp -p)」；hit 四条件见 0.35/notes.md 3.1 节'
    - "clang 15 不接受无返回类型的 main（2004 年代码常见写法），补 int"
    - "tarball 不含 config.guess/config.sub（find 结果为空），autoconf-2.58 的 configure 也从不调用它们（config.guess 仅 configure:1293 一处赋值）⇒ E007 处方不适用本包：0001 的出处是 E114、0003 是 clang 补 int main，两枚都与 E007 无关"
    - "产物是两个可执行文件（bin/kdc2tiff、bin/kdc2jpeg），package_type=application，故软件级需 commands.json"
  common_dependencies:
    - libtiff
    - libjpeg-turbo

versions:
  "0.35":
    status: built
    build_date: 2026-09-27
    # W4 整改（审计 W4-02）：本节标题的 ✅ PASS 是 harness 固定文案，真判决在标题下一行；
    # conan-verify 实际只真做了 G0/G1/G2/G3。
    notes: 'conan-verify：G0/G1/G2/G3 真做并通过（G2 conan create 成功、configure 在 reports/w3-local-ci.log:204 被真实 RUN）；G4 正文「⚠️ 无法找到程序包 ID」，L2/L4/L5 正文「⏭️ 跳过（无 cache 路径）」⇒ 运行面复核未做，证据改由 test_package/test.sh 的 29 条断言（判决原文 reports/w3-local-ci.log:462 = SUMMARY kdc2tiff consumer: total=29 passed=29 failed=0）与 pkg/bin 实测承接（恰 kdc2tiff/kdc2jpeg 两枚、各 109184 B、同 sha256 0ffecdb134d353ebfc0116926141a3560c5846c364bcc1075027a2d70cee1ba6、inode 不同）。G0 另有未处理告警 E490（autotools 脚本可执行位），本环境 G2 未因此失败。3 个补丁：0001 configure 去 umask 077（E114）、0002 Makefile ln -f→cp -f（E050）、0003 kdc2tiff.cpp 补 int main（clang，非 E007）。两档 RREV：本地整编证据 = 注入档 4890466954cbc948e72e295ee3e5d8b5/PKGID cc91ff87ca05a40e640fad0984a2654e990285c6，交付态 = 官方 URL 档 c2cb7785e3654e9a2ae534d2cf1eb8cb（仅 conan export 级证据，未整轮重编），细则见 0.35/notes.md「注意事项」'
