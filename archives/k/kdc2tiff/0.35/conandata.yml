patches:
  - patch_file: "patches/0001-configure-umask-077.patch"
    patch_description: "E114: config.status 临时目录去掉 umask 077（HMDFS 强制 setgid，使属主也无法写入）"
    patch_type: "platform"
  - patch_file: "patches/0002-Makefile-ln-f-to-cp-f.patch"
    patch_description: "HMDFS 不允许创建硬链接（ln: cannot create hard link: Operation not permitted）：kdc2jpeg 改由 cp -f 生成"
    patch_type: "platform"
  - patch_file: "patches/0003-kdc2tiff.cpp-int-main.patch"
    patch_description: "clang 15 拒绝无返回类型的 main（C++ 从未支持隐式 int）：补 int"
    patch_type: "portability"
