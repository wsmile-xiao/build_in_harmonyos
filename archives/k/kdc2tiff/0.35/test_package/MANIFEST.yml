# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kdc2tiff/0.35
homepage: "https://sourceforge.net/projects/kdc2tiff/"

# 上游测试命令 —— kdc2tiff 0.35 上游没有自动化测试套件。
# 清点依据（R51 三步法第一步）：
#   1) tarball 内文件全集无 tests/、无 test-*：
#      GFile*.{cpp,h} GICBayer.* GImage*.{cpp,h} KDCFile.* OutputOptions.*
#      kdc2tiff.cpp xtif_dir.c xtiffio.h xtiffiop.h include/{port,tif_dir,tiffconf,tiffiop}.h
#      aclocal.m4 config.h.in configure configure.in install-sh Makefile.am Makefile.in
#      missing mkinstalldirs stamp-h.in AUTHORS COPYING ChangeLog INSTALL NEWS README TODO
#   2) `grep -n "^check\|^test\|TESTS" Makefile.am Makefile.in` 实测只命中 2 行：
#        Makefile.in:354  check-am: all-am
#        Makefile.in:355  check: check-am
#      即 Makefile.am 侧 0 命中、Makefile.in 里只有 automake-1.4-p4 的**空壳目标**
#      （只有依赖声明、没有任何 recipe 命令；紧邻 Makefile.in:356/357 的 installcheck
#        同样为空），且全包无 TESTS 变量 ⇒ 空壳 check 目标存在但不注册任何用例。
#      （整改前这里写成"无 check/test 目标"，与该 grep 的实际读数不符，W4 审计 W4-04
#        点名后按实测更正；结论"上游成体系测试 0"不变。）
#      `grep -c "AC_CHECK_PROG.*ctest\|enable-test" configure` → 0 命中，无测试相关选项
#   3) README/INSTALL/ChangeLog 未提及 make check 或测试用例
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（kdc2tiff 0.35 无上游测试程序）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，R34：真跑已安装的二进制）
test_package_tests:
  - file: test.sh
    description: >
      端到端功能测试：两个入口名在位、ELF 机器码与 DT_NEEDED 依赖链取证、
      argv[0] 驱动的 usage 分支与 Version: 0.35、缺失输入的真实失败形态、
      合成 4x4 无压缩 RGB TIFF 后做 TIFF->TIFF 与 TIFF->JPEG 两次真实转换
      （产物从格式侧解析：TIFF 魔数与 IFD 尺寸/通道、JPEG SOI/EOI），
      最后把自产的 TIFF 再读回一次（往返）
    command: "bash test.sh"

# 测试断言总数：与 test.sh 末行 SUMMARY 自报值、判决日志逐字同源（四处同值 29）。
#   判决原文：reports/w3-local-ci.log:462
#     SUMMARY kdc2tiff consumer: total=29 passed=29 failed=0
#   （w3 日志全文唯一 SUMMARY 行；同次 [PASS] 实测 29 行、[FAIL] 0 行；
#     conan-verify G2 独立再跑的 reports/conan-create.log:173 同为 29/29）
#   静态复算：test.sh 里 `^chk ` 调用点 21 处（L34/36/166/169/171/173/175/182/184/186/
#     190/197/202/206/210/214/216/221/226/228/232）+ 内联 `if …; then ok/bad` 判定点 8 处
#     （L180/187/195/198/203/211/222/233）= 29；脚本无循环展开（L24 的 chk() 定义不计站点）。
#   整改前此值写 24（既非实测 29、也非静态 21），W4 审计 W4-01 点名后四处改齐。
assertion_count: 29
