patches_applied:
  - "0001-configure-umask-077.patch"
  - "0002-Makefile-ln-f-to-cp-f.patch"
  - "0003-kdc2tiff.cpp-int-main.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  # 本包 B 判定 = hit，命中的是基线既有条目 E050（第 2 条即其逐字引用与落点）；
  # hit 四条件与产物强证据见 notes.md「3.1）核心机制的知识条目归属：E050」。
  - 'E114: HMDFS 对目录强制 setgid；autoconf 的 `umask 077 && mktemp -d` 产生的 drwx--S--- 目录连属主都写不进去，需从 configure 的 config.status 模板里移除 umask 077（实测解包件 `grep -c "umask 077" configure` = 2，恰为 0001 单 hunk 覆盖的 2 处）'
  - "E050（knowledge/doc/E050.md，copy-replace-symlink）: HMDFS 不允许用 link 造第二个名字——上游 Makefile 以 `ln -f kdc2tiff kdc2jpeg` 生成 kdc2jpeg（实测 Makefile.am:21、Makefile.in:432），实跑 `ln -f` 报 `cannot create hard link ... Operation not permitted` ⇒ 必须改 `cp -f`（0002）。E050 推荐方案原文逐字：『对于 make install, 将 $(LN_FORCE) 改为 $(HARDLINK)(鸿蒙上为 cp -p)』；本包机制的另一半是 mtime 顺序（0002 里 Makefile.am 的 hunk 在前、Makefile.in 的在后）"
  - "clang 15 拒绝无返回类型的 main（`error: a type specifier is required for all declarations`），2004 年 autotools 包普遍存在，补 int 即可"
  - "上游 tarball 不含 config.guess/config.sub，且 autoconf-2.58 的 configure 从未调用它们 ⇒ E007 的 patch-autotools-ohos.pl 处方对本包不适用"
  - "automake-1.4-p4 的 maintainer 规则会在 Makefile.am/aclocal.m4 看起来比 Makefile.in 新时调 automake/autoconf/autoheader；worker 上没有这些工具，配方打完补丁后需把 mtime 顺序归一化"
  - "补丁归因台账（W4 整改，纠正主窗把 0001/0003 记成 E007 的口径）: 0001 = E114；0002 = E050（本包 hit 条目）；0003 = clang 需补 int main（HMDFS 无对应条目）。E007 在本包 0 处方落地；另确认 configure 实参无 --build/--host、日志无 ac_cv_* 缓存绕过（reports/w3-local-ci.log:204、grep -c ac_cv = 0）"
  - "两档 RREV（不得合并宣称一档）: 本地 W3 整编证据 = 注入档 4890466954cbc948e72e295ee3e5d8b5 / PKGID cc91ff87ca05a40e640fad0984a2654e990285c6（Pre-download 把 conandata 的 url 换成 file:// 后导出，reports/w3-local-ci.log:96-100/111/186/373，:493 已还原）；交付态官方 URL 档 = c2cb7785e3654e9a2ae534d2cf1eb8cb（本地仅 conan export 级证据，未整轮重编）。两档只差 conandata 的 url 串，tarball 同一枚 sha256 bde9e3ed41bf09ded586e0ac87c2fe6e48780e4e98f9927a31d1c19e192f51ec"

