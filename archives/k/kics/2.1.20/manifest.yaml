# manifest.yaml — kics 2.1.20 (HarmonyOS PC)
version: "2.1.20"
software: "kics"
status: "built"
build_date: "2026-09-18"
arch:
  - "armv8"
  - "x86_64"
build_system:
  - "conan2"
  - "go1.25.0"
toolchain:
  go: "1.25.0"
  cgo: false
source:
  upstream: "https://github.com/Checkmarx/kics"
  tag: "v2.1.20"
  url: "https://github.com/Checkmarx/kics/archive/refs/tags/v2.1.20.tar.gz"
  sha256: "7424ca07901a8534f6aa9b9d21b4c3aa873a027cf22e4bf334c5cf7fba134ae3"
  license: "Apache-2.0"
build:
  entry: "go build -trimpath ./cmd/console"
  output_binary: "kics"
  ldflags: "-s -w -X github.com/Checkmarx/kics/v2/internal/constants.Version=v2.1.20"
patches_applied:
  - "OHOS: pkg/engine/provider/extract.go GetSources short-circuits local paths (skip go-getter os.Symlink; symlink() syscall is denied to self-signed ELF on OHOS)"
  - "OHOS: internal/console/helpers/helpers.go GetFullPath walk-up query path resolution (exe-parent probe + cwd walk-up; upstream kics-dir truncation heuristic breaks under conan hash layouts; also fixes 206 terraform remediation false failures)"
knowledge_gained:
  - "kics 2.1.20 is a pure-Go CLI (module github.com/Checkmarx/kics/v2, main entry cmd/console/main.go); CGO disabled, GOOS=linux, static binary for OHOS/arm64."
  - "kics does NOT embed the full query set: only assets/libraries/*.rego|json and secrets regexes are //go:embed-ed; the full assets/queries (1099 queries) is loaded from the filesystem via --queries-path, so package() must ship assets/ alongside bin/kics."
  - "Go linker mmap fails on HMDFS: link output is placed on an ext2-like writable workspace (/data/storage/el2/base/cache/kics-2.1.20-go)."
  - "On OHOS every executed ELF (the kics binary and all Go SDK tool binaries) must carry a .codesign section; sign with binary-sign-tool (found at /data/service/hnp/bin/binary-sign-tool)."
  - "kics 2.1.20 contains 121 *_test.go files (testify-based); `go test -v -count=1 ./...` is the upstream test entry and is executed in build() with full output captured to build_folder/upstream_test_full.log."
  - "No conan third-party dependencies: all 270 Go modules are fetched at build time via go mod download + GOPROXY (goproxy.cn reachable; proxy.golang.org blocked — recipe defaults to goproxy.cn,direct)."
validation:
  local:
    conan_create: "passed (exit 0; final authoritative build attempt 8 + conan-verify G2 clean build @ohpcd/stable)"
    conan_verify: "passed (G1/G2/G3 PASS, 2026-09-18)"
    upstream_tests: "executed: PASS=8286 FAIL=18 SKIP=1 of 8305 cases in 69 packages (99.78%); 18 failures fully attributed: 9 OHOS symlink platform limit (analyzer dead_symlink fixtures), 9 local HMDFS fixture phantom-loss (verified present in upstream v2.1.20 tag via GitHub API); details in notes.md"
    test_package: "passed 2/2 (ALL_CONSUMER_TESTS_PASSED; real scan queries_total=1099, failed=0)"
  ohos:
    binary_runs: "passed (kics version + kics scan terraform on device)"
    signed: "passed (.codesign injected via binary-sign-tool for kics, Go SDK and all test binaries)"
