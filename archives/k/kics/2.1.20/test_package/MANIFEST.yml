# test_package MANIFEST — kics 2.1.20
# HarmonyOS consumer feasibility test (separate from upstream `go test ./...`).
upstream_tests_exist: true
upstream_test_in_build: true
test_package:
  command: "test.sh <kics-binary>"
  assertions: 2
  cases:
    - name: "kics version reports 2.1.20 on OHOS"
      type: smoke
      expect: "exit 0 and stdout contains 2.1.20"
    - name: "kics scan produces JSON report from embedded queries on OHOS"
      type: consumer-feasibility
      expect: "report file kics_hn_result.json created"
