package: kuserfeedback/6.28.0
homepage: "https://invent.kde.org/frameworks/kuserfeedback"

upstream_check_command: "ctest --output-on-failure (offscreen)"
upstream_test_in_build: true
upstream_test_command: "QT_QPA_PLATFORM=offscreen ctest --output-on-failure"

# 上游 BUILD_TESTING=ON 时 autotests/ 通过 uf_add_test() 注册的测试
# （ENABLE_CONSOLE=OFF / ENABLE_PHP=OFF 后实际注册的目标，N 口径见 notes.md）
upstream_tests:
  - file: autotests/datasourcetest.cpp
    source: kuserfeedback-6.28.0/autotests/datasourcetest.cpp
    description: "AbstractDataSource id/name/description behavior"
    command: "datasourcetest"
  - file: autotests/openglinfosourcetest.cpp
    source: kuserfeedback-6.28.0/autotests/openglinfosourcetest.cpp
    description: "OpenGLInfoSource (skips when KUSERFEEBACK_SKIP_TESTOPENGLINFOSOURCE=1, no GL on headless OHOS)"
    command: "openglinfosourcetest"
  - file: autotests/providertest.cpp
    source: kuserfeedback-6.28.0/autotests/providertest.cpp
    description: "Provider telemetry mode/schedule/encouragement logic"
    command: "providertest"
  - file: autotests/selectionratiosourcetest.cpp
    source: kuserfeedback-6.28.0/autotests/selectionratiosourcetest.cpp
    description: "SelectionRatioSource ratio accounting"
    command: "selectionratiosourcetest"
  - file: autotests/surveyprovidertest.cpp
    source: kuserfeedback-6.28.0/autotests/surveyprovidertest.cpp
    description: "SurveyProvider expression/targeting logic"
    command: "surveyprovidertest"
  - file: autotests/feedbackconfigtest.cpp
    source: kuserfeedback-6.28.0/autotests/feedbackconfigtest.cpp
    description: "FeedbackConfig widget/config persistence (KF6UserFeedbackWidgets)"
    command: "feedbackconfigtest"
  - file: autotests/surveytargetexpressiontest.cpp
    source: kuserfeedback-6.28.0/autotests/surveytargetexpressiontest.cpp
    description: "Survey target expression lexer/parser/evaluator (flex+bison, HAVE_SURVEY_TARGET_EXPRESSIONS)"
    command: "surveytargetexpressiontest"

expected_skips:
  - "openglinfosourcetest: headless OHOS has no OpenGL/EGLOS; upstream provides the KUSERFEEBACK_SKIP_TESTOPENGLINFOSOURCE env knob (same guard upstream uses on WIN32), the QSKIP branch runs and passes"
  - "Console/PHP-gated tests (producttest, schematemplatetest, sampletest, serverinfotest, schemamodeltest, datamodeltest, timeaggregationmodeltest, categoryaggregationmodeltest, numericaggregationmodeltest, ratiosetaggregationmodeltest, productapitest, productmodeltest, surveyapitest, submittest, 7 PHPUnit targets): not registered because ENABLE_CONSOLE=OFF (Qt6Charts not published to ohpcd) and ENABLE_PHP=OFF (no PHP server stack on OHOS)"

test_package_tests:
  - file: test.cpp
    description: "Consumer-side smoke: link KF6::UserFeedbackCore, exercise productIdentifier/telemetryMode/submissionInterval/surveyInterval/dataSource API"
    command: "./test_kuserfeedback"

assertion_count: 6
