# 版本级 manifest
# 文件位置: archives/k/kuserfeedback/6.28.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "6.28.0"
software: "kuserfeedback"
status: built
build_date: "2026-10-05"
build_system: cmake

source:
  url: "https://download.kde.org/stable/frameworks/6.28/kuserfeedback-6.28.0.tar.xz"
  sha256: "07f279845b3cd6e675513afb81f3c6274b2f6757edc149d163116b3c50dfa0df"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE"
    - "KF_SKIP_PO_PROCESSING=ON"
    - "ENABLE_PHP=OFF"
    - "ENABLE_PHP_UNIT=OFF"
    - "ENABLE_DOCS=OFF"
    - "ENABLE_CONSOLE=OFF"
    - "ENABLE_SURVEY_TARGET_EXPRESSIONS=ON"
    - "BUILD_TESTING=ON"
  dependencies:
    - qtbase/6.11.1
    - qtdeclarative/6.11.1
    - ecm/6.26.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-lower-ecm-version.patch"
  - "0002-disable-po-qm-processing.patch"

knowledge_gained:
  - "kuserfeedback 6.28.0 上游 find_package(ECM \${KF_DEP_VERSION}) 门槛 6.28.0, ohpcd registry KF6 代 ECM 最新 6.26.0, 照 attica/6.28.0 + kdnssd/6.29.0 先例降版补丁解决"
  - "ECM 6.26.0 实测: ecm_create_qm_loader 宏体纯 configure_file(ECMQmLoader.cpp.in) 不需要 Qt6LinguistTools; po 目录处理由 KF_SKIP_PO_PROCESSING=ON 跳过, 顶层 ecm_install_po_files_as_qm(poqm) 一并注释 (140 个上游 .po)"
  - "上游 server/Elasticsearch PHP 栈与 UserFeedbackConsole(Qt6Charts) 全关后, 剩余 provider 库仅需 Qt6 Core/Network/Gui/Widgets + Qt6Qml(qtdeclarative); vanilla qtbase/6.11.1 (FEATURE_dbus=OFF) 即满足, 无需 qtbase-sql-dbus 变体"
  - "ENABLE_SURVEY_TARGET_EXPRESSIONS=ON 走 OHOS SDK 自带 flex 2.6.4 / bison 3.8.2 (find_package FLEX/BISON 可命中), surveytargetexpressiontest 得以注册"
