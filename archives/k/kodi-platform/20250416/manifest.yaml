knowledge_gained:
  - Upstream CMakeLists requires kodi-addon-dev SDK (FindKodi.cmake); recipe
    supplies its own CMakeLists under recipe-cmake/ consumed via
    build_script_folder since the single TU uses no Kodi headers
  - Conan merges exports_sources into the source folder BEFORE source() runs,
    so tarball extraction clobbers same-named files; ship entry points in an
    upstream-absent subfolder (recipe-cmake/) instead
  - OHOS conan 2.29 CMakeDeps leaves indirect deps' include dirs empty in
    consumer builds; test_package must require transitive deps explicitly
software: kodi-platform
