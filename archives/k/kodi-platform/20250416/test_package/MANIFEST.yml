# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: kodi-platform/20250416
homepage: "https://github.com/xbmc/kodi-platform"

# Upstream kodiplatform-20250416 ships no test suite:
# no CTest registration, no test directory, no add_test() in CMakeLists.txt
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream has no test programs
upstream_tests: []

# test_package consumer-side tests
test_package_tests:
  - file: test_kodi_platform.cpp
    description: "Tests XMLUtils Set/Get round-trips (int/string/bool/float/hex/path), range-clamped getters, HasChild, GetEncoding, HasUTF8Declaration"
    command: "./test_kodi_platform"
    assertion_count: 18

assertion_count: 18

notes: |
  上游 kodiplatform-20250416 无任何测试注册（CMakeLists 无 enable_testing/add_test，
  无 test/ 目录）。消费者测试覆盖 XMLUtils 全部 28 个公开方法中的核心 18 项断言，
  包括 tinyxml/p8-platform 链接验证（SetInt 内部走 p8-platform 的 StringUtils::Format）。
