# 软件级 manifest — kinect-audio-setup
# 文件位置: archives/k/kinect-audio-setup/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: kinect-audio-setup
display: "kinect-audio-setup"
description: "使 Microsoft Kinect 感应器的音频输入在 GNU/Linux 上可用（固件上传 + udev 规则）"
category: hardware
homepage: "https://git.ao2.it/kinect-audio-setup.git"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建（顶层 Makefile 递归 kinect_upload_fw/Makefile），无 configure"
    - "依赖 libusb-1.0，通过 pkg-config 发现；配方用 PkgConfigDeps 生成 conan 化 .pc 注入 PKG_CONFIG_PATH"
    - "编译产物 kinect_upload_fw 静态链接 libusb-1.0.a（R26 系统同名库），仅动态依赖 libc.so"
    - "OHOS 无 GNU install 命令，package() 直接 copy 产物到 sbin（避开 install 工具缺失）"
    - "构建期工具 endian 在 OHOS arm64 本机可运行（生成本机字节序 endian.h），无交叉执行问题"
    - "上游无测试套件（Makefile 无 check 目标），test_package 以二进制实跑自证（无设备时报错路径正常）"
  common_dependencies:
    - libusb

versions:
  "0.5":
    status: published
    build_date: "2026-09-27"
    conan_ref: "kinect-audio-setup/0.5"
