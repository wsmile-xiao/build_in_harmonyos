# test_package MANIFEST — kinect-audio-setup 0.5
software: kinect-audio-setup
version: "0.5"
test_type: cli_functional

# 上游测试：无。仓库仅含 Makefile（all/install/install_udev_rules/clean）+
# NEWS + README；无 tests/ 目录、无 make check/ctest 目标（R51 已核查顶层
# Makefile 与 kinect_upload_fw/Makefile）→ 无可 vendored 的上游测试。
upstream_check_command: ""
upstream_check_count: 0

# test_package 测试：test.sh 3 项断言。
# 程序以 argv[1] 为固件文件名，无硬件时 libusb_open 失败路径正常（证明
# libusb 已静态链入且符号可解析）；配合 ELF 可执行检查证明产物在 OHOS 可用。
test_package_tests:
  - "sbin/kinect_upload_fw 存在且可执行"
  - "--help 触发固件打开错误路径（argc==2 分支，输出 'Failed to open --help'）"
  - "真实固件文件时报 libusb_init/libusb_open 错误（证明 libusb 静态链接符号可解析；沙箱无 USB 权限时 libusb_init 报 LIBUSB_ERROR_IO）"
assertion_count: 3
fixture_count: 0
fixture_origin: "无 fixtures（用错误路径 stderr 输出作为断言素材）"