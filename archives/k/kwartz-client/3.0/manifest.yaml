software: kwartz-client
version: "3.0"
status: built
build_date: "2026-10-02"
build_system: none-posix-shell

source:
  url: "https://salsa.debian.org/georgesk/kwartz-client/-/archive/debian/3.0-17/kwartz-client-debian-3.0-17.tar.gz"
  sha256: "8093f591b9dec4085061fa3a7e87220d1d44562d92aab64de791d5cceb5c8167"
  tar_format: tar.gz
  source_identity: >-
    kwartz-client 3.0 = Debian revision 3.0-17 (salsa release tag
    debian/3.0-17, commit 17208cb88caf19c3074df506b4fa3f2e064a11c2);
    upstream identity corroborated by Debian orig tarball
    (kwartz-client_3.0.orig.tar.xz sha256
    7a15f5f7873bf802518577434934a1ede481d130dac26a6b27425f4df44ab290,
    kwartz-cloud/ subtree byte-identical inside the pinned snapshot)

build:
  system: none
  configure_options:
    - "zero compilation units (debian/rules = bare 'dh $@', Architecture: all)"
    - "build() is a data-integrity audit only: 30-file set check + per-file sha256 pins + debconf template-variable contract"
  dependencies: []
  cc: none

patches_applied: []

knowledge_gained:
  - "Functional body of Debian admin shell tools can live entirely in debian/ (kwartz-install.tpl + debconf config/templates/postinst): the orig tarball alone would ship a functionally hollow package; salsa release-tag snapshot is the correct complete official archive, with the orig tarball retained as upstream-identity corroboration (kwartz-cloud/ subtree diff -r clean)."
  - "ci/config/no_official_test.txt whitelist is NOT required for zero-test upstreams: the CI L1 gate passes via test_package execution traces (L1a) when the package is absent from the whitelist — no ci/** modification needed (zsdx same-path precedent)."
  - "Pure-shell packages: zero-ELF invariant is asserted in pure bash (read -N 4 magic), making the test harness self-contained on OHOS (no od/dd/head dependency)."
  - "Debconf envsubst contract (postinst db_get 9 vars, template references 8; landing_page is postinst-only) is machine-checked at build() and asserted at test_package, guaranteeing the template renders to valid shell even though the rendering itself (dpkg/debconf lifecycle) never runs on OHOS."

upstream_tests:
  exists: false
  test_count: 0
  command: "N/A: upstream ships no test suite of any kind (no tests/, no debian/tests autopkgtest, rules has no check target)"
  notes: "Full discovery evidence chain in test_package/EXCLUDED-TESTS.md and UPSTREAM-TESTS-EVIDENCE.json; discovery marker emitted by conanfile.py build() (NO_UPSTREAM_TESTS, status not_applicable)."

test_package:
  assertion_count: 18
  description: >
    Consumer smoke in 6 groups: harness sanity (2), zero-ELF pure-shell
    invariants (3), bash -n syntax gates for kwartz-cloud and
    kwartz-install.tpl + POSIX sh shebang (3), install-face fidelity vs
    debian/kwartz-client.install + manpages and GPL license face (5),
    per-file sha256 byte fidelity vs pinned upstream (2), debconf envsubst
    template-variable contract + conf-source/desktop-launch data-flow
    contracts (3). Reads the tested package only via PKG_ROOT; self-contained
    under bash/5.3; no ELF signing (nothing to sign).

quality_gates:
  W0_dependencies: "No conan dependencies; test_package harness uses published bash/5.3."
  W1_source: "POSIX shell + data package; public face = /usr/bin/kwartz-cloud command + kwartz-install.tpl template."
  W4_local: "ohos-aarch64 conan create + test_package executed on-device (zero compile; L4 readelf surface empty by construction)."
  R38_commands_json: "Satisfied: software-level archives/k/kwartz-client/commands.json declares kwartz-client/3.0 (type tool, binary: false — shell script, not ELF)."

ohos_adaptation:
  key_points:
    - "Zero-compile data+script package at POSIX capability level: no platform macros, no platform branches (R8); adaptation = byte-faithful install + machine-checked integrity audit + consumer smoke."
    - "Install layout mirrors debian/kwartz-client.install + kwartz-client.manpages: bin/kwartz-cloud (755), share/icons, share/applications, etc/kwartz-cloud.conf, share/doc/kwartz-client/kwartz-install.tpl, share/man/man1, licenses/copyright."
    - "Functional-disclosure (runtime, not packaging defects): the enrolment stack (gettext-base envsubst, libnss-ldapd, libpam-ldapd, cifs-utils, winbind, smbclient, libpam-mount, net-tools, oidentd, inetutils-inetd, debconf — 12 Debian runtime deps) has no OHOS counterpart; 'domain join' is unreachable on OHOS. kwartz-cloud additionally needs zenity/host/nemo. Verification face = installable + syntax-valid + template contract asserted."
    - "postinst envsubst rendering is a dpkg/debconf lifecycle step that never runs on OHOS; the template ships verbatim at its Debian location and its validity is guarded by bash -n + the 8-variable contract assertions."
    - "copyright-declared upstream (forge.aeif.fr) is DNS-unreachable from this network (Scout-recorded); authoritative source is the Debian-maintained salsa repository (recorded, not re-judged)."

blockers: []
