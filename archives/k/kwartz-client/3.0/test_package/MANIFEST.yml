# test_package/MANIFEST.yml — kwartz-client 3.0 上游测试声明
#
# 上游测试体系：不存在。源 = salsa 发布 tag `debian/3.0-17`（commit
# 17208cb88caf19c3074df506b4fa3f2e064a11c2，归档 sha256
# 8093f591b9dec4085061fa3a7e87220d1d44562d92aab64de791d5cceb5c8167），
# 全树 30 个文件（配方 build() 机读复核文件集合）：kwartz-cloud/ 6 文件 +
# README.md + .gitignore + debian/ 打包目录（changelog/control/copyright/
# config/install/manpages/postinst/postrm/templates/kwartz-install.tpl/
# po//source/format）。无 tests/ 目录、无 debian/tests（autopkgtest）、
# debian/rules 为裸 `dh $@`（4 行，无 check/test 目标）、无任何构建系统
# 与测试 runner（POSIX shell 脚本 + 数据，Architecture: all 零编译单元）。
# 判定为 not_applicable / NO_UPSTREAM_TESTS（零测试上游，非"有测试而跳过"），
# 完整证据链见同目录 EXCLUDED-TESTS.md 与 UPSTREAM-TESTS-EVIDENCE.json（机读）。

package: kwartz-client/3.0
homepage: "https://usb.freeduc.org"
upstream_tag: "debian/3.0-17 (Debian revision of upstream 3.0)"
upstream_commit: "17208cb88caf19c3074df506b4fa3f2e064a11c2"

upstream_check_command: "n/a — upstream ships no test suite of any kind (NO_UPSTREAM_TESTS)"
upstream_test_in_build: false
upstream_test_command: "test_package: kwartz_client_test.sh（零测试上游的适配点静态冒烟，launchctl-completion/zsdx 先例范式）"

# 上游实际运行的测试：无（discovered=0，机读复核见 UPSTREAM-TESTS-EVIDENCE.json）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，全部断言只经 PKG_ROOT 读被测包、
# 纯 bash 自包含（read -N 4 判 ELF 魔数），不写包外路径、不执行被测脚本——
# kwartz-cloud 需要 zenity/nemo GUI、kwartz-install.tpl 需要 root 与 Debian
# 系统路径，在 OHOS 上均不可达，见诚实披露）
test_package_tests:
  - file: kwartz_client_test.sh
    description: >
      18 条断言 6 组：A 组 2 条（harness bash 就位、包根在位）；B 组 3 条
      （bin/kwartz-cloud 在位可执行、非 ELF、全包零 ELF——纯 shell 数据包
      的 OHOS 适配不变量，L4 readelf 面为空的结构性证明）；C 组 3 条
      （bash -n 语法解析 kwartz-cloud 与 kwartz-install.tpl——模板经 postinst
      envsubst 渲染成 root 脚本，替换前必须已是合法 shell；POSIX sh shebang，
      无 /bin/bash 运行期依赖）；D 组 5 条（安装面对齐 debian/kwartz-client.install
      + manpages：icons/applications/etc/man 四件套 + licenses/copyright GPL 声明，
      用全称 "GNU General Public License" 断言——zsdx 教训：不断言原文没有的缩写）；
      E 组 2 条（bin/kwartz-cloud 与 kwartz-install.tpl 的 sha256 与上游
      逐字节一致，E241 固定输出精确比对）；F 组 3 条（模板引用 postinst
      db_get 导出的全部 8 个 envsubst 变量——landing_page 为 postinst 专用、
      上游模板即不引用；kwartz-cloud 与打包 etc/kwartz-cloud.conf 的
      conf-source 契约；desktop Exec 与 bin 安装件的启动链）。
    command: "bash kwartz_client_test.sh"

# 断言总数：18（A2 B3 C3 D5 E2 F3）
assertion_count: 18

# NOT_RUN 说明：不适用。上游零测试（status=not_applicable，而非 skipped——
# skipped 语义是"有测试但被跳过"）。功能面证据由上述 18 条适配点断言承担；
# OHOS 上"入域功能"（LDAP/PAM/Samba 栈）不可达属运行期披露，见 manifest.yaml。

# CI L1 门禁契约备注：本包未加入 ci/config/no_official_test.txt 白名单——
# 该白名单在 CI 中仅用于"跳过 L1 检查"；不进白名单时 L1a 以 conan create
# 日志中出现 test_package 真实执行痕迹判 pass（zsdx 先例同款
# "L1 test_package executed, no whitelist"路径），无需改动任何 ci/** 文件。
