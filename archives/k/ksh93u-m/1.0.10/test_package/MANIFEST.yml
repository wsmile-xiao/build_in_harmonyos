# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# ksh93u-m 上游测试 = bin/shtests 套件（56 脚本 × 3 变体：plain / C.UTF-8 / shcomp）
# 权威运行日志: /storage/Users/currentUser/builds/ksh93u-m-shtests-final.runner002.log

package: ksh93u-m/1.0.10
homepage: "https://github.com/ksh93/ksh"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# ksh93u-m 非 autotools/meson：无 make check/ctest，上游测试入口是 bin/shtests
upstream_check_command: "bin/shtests"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 shtests 全套 56×3 在 OHOS 上约需 1 小时，W3/conan create 时点不适合内嵌执行；
# 已由独立验证任务跑完整套并出具 test-report.md（通过率 99.36%）
upstream_test_in_build: false
upstream_test_command: "bin/shtests"

# 上游实际运行的测试程序（56 个脚本 × 3 变体，代表项列出，完整清单见 reports/test-report.md §1）
upstream_tests:
  - file: tests/basic.sh
    source: ksh93u-m-1.0.10/src/cmd/ksh93/tests/basic.sh
    description: "核心 shell 功能（basic 147×3 全过）"
    command: "bin/shtests basic"
  - file: tests/bracket.sh
    source: ksh93u-m-1.0.10/src/cmd/ksh93/tests/bracket.sh
    description: "[ ] 测试（-r/-w/-rw/-O chmod 类失败为 HMDFS 平台限制）"
    command: "bin/shtests bracket"
  - file: tests/path.sh
    source: ksh93u-m-1.0.10/src/cmd/ksh93/tests/path.sh
    description: "PATH 搜索（16 项失败：unreadable script 12 + /bin 只读 3 + FPATH 1）"
    command: "bin/shtests path"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ksh.sh
    description: "消费者视角功能测试——用打包的 ksh 真机执行（算术/参数替换/循环/条件/KSH_VERSION）"
    command: "ksh test_ksh.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14515
