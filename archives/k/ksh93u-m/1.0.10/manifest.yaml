knowledge_gained:
  - "ksh93u-m 1.0.10 使用自定义 AST Mamfile 构建体系（bin/package），非 autotools/meson；构建命令: CC=clang bash bin/package quiet make"
  - "bin/package 同时产出 flat（静态，bin/）与 dyn（动态，dyn/bin + dyn/lib）两套产物；flat bin/ksh 仅依赖 libc.so，可自包含打包"
  - "bin/package install 默认安装 dyn/bin 动态版本，需手工复制静态 bin/ksh、bin/shcomp 才能得到自包含交付物"
  - "env_init() 中 A__z 属性标记环境变量会被作为普通变量再次导入并重新导出，产生重复 A__z（子进程环境出现两个 A__z），toybox env 操作 A__z 时崩溃；修复为跳过导入（纯逻辑修复，无 __OHOS__ 平台宏）"
  - "shtests 套件 56 脚本 × 3 变体在 OHOS 上总体通过率 99.36%（14515 断言 / 93 错误）"

