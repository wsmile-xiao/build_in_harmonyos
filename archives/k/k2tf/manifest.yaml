software: k2tf
display: "k2tf"
description: "Convert Kubernetes API objects (YAML) to Terraform HCL configuration (Go CLI)"
homepage: "https://github.com/sl1pm4t/k2tf"
license: MPL-2.0
category: utility
build_system: custom
ohos_adaptation:
  key_points:
    - "Go 1.24.5 自举并签名，GOROOT/GOTMPDIR/GOCACHE/GOMODCACHE 重定向到非 HMDFS 工作区"
    - "Go linker 输出到 /data/storage/el2/.../link-out 规避 HMDFS mmap 失败"
    - "go test -exec wrapper 自动签名 .test ELF"
    - "k2tf 无 vendor 目录，依赖经 GOPROXY(goproxy.cn) 拉取 go module"
  common_dependencies: []
versions:
  "0.8.0":
    status: built
    build_date: "2026-09-29"
