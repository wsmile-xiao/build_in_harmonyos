# test_package/MANIFEST.yml
# 上游官方测试声明文件 — knavalbattle 26.04.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: knavalbattle/26.04.0
homepage: "https://apps.kde.org/knavalbattle"

# 上游测试清点 (R51 第一步): 源码树中没有任何测试 —
#   全树 grep 未命中 enable_testing / add_test / ctest / qtest /
#   ECMAddTests / BUILD_TESTING，也无 tests/ 目录（详见 notes.md
#   "R51 上游测试清点证据"节）。因此无上游 ctest 可运行，
#   不设置 upstream_check_command。
upstream_check_command: "none (上游无测试, 见 notes.md R51 证据)"
upstream_test_in_build: false
upstream_test_command: "无 (上游不注册任何测试目标)"

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, R34: 真实执行被测二进制)
test_package_tests:
  - file: conanfile.py
    description: >
      消费者测试: 组装完整运行时环境 (所有依赖 lib 目录 + link farm 解析
      相对 DT_NEEDED + 物化陈旧绝对 DT_NEEDED 路径) 后, 以 offscreen QPA
      真实执行打包出的 bin/knavalbattle --version。--version 由
      KAboutData/QCommandLineParser 处理, 在任何显示/DBus/网络服务启动前
      打印版本串并退出码 0; 非零退出 = 二进制无法启动 (加载器依赖缺失/
      ELF 损坏)。

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
