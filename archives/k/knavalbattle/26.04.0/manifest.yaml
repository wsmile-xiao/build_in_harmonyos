# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（CMake + KF6/Qt6，非 autotools——.build-context 里的 autotools 是误判）
  system: cmake

  # 配置选项列表（conanfile.py generate() 实际写入 CMakeToolchain 的变量）
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
  - "-DKF_SKIP_PO_PROCESSING=ON"
  - "-DBUILD_TESTING=OFF"
  - "-DBUILD_SHARED_LIBS=ON"
  - "-DCMAKE_INSTALL_LIBDIR=lib"
  - "-DCMAKE_BUILD_RPATH=$ORIGIN"
  - "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--disable-new-dtags"
  - "-DECM_MODULE_PATH=<ecm>/share/ECM/modules;<ecm>/share/ECM/find-modules;<ecm>/share/ECM/kde-modules"

  # 编译依赖列表（格式: name/version）——最终 requirements 版本清单
  dependencies:
  - qtbase/6.11.1
  - qtbase-sql-dbus/6.11.1
  - karchive/6.18.0
  - kcompletion/6.18.0
  - kconfig/6.18.0
  - kcoreaddons/6.18.0
  - kcrash/6.18.0
  - kdbusaddons/6.14.0
  - kdnssd/6.29.0
  - ki18n/6.18.0
  - ktextwidgets/6.14.0
  - kwidgetsaddons/6.18.0
  - kxmlgui/6.18.0
  - libkdegames/26.04.0
  - ecm/6.26.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-CMakeLists.txt.patch"
- "0002-doc-CMakeLists.txt.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "kdbusaddons/6.29.0 需 Qt6DBus 组件（仅 qtbase/6.11.1.1 变体携带），与 libkdegames 闭包的 qtbase/6.11.1 冲突且不能共存——改用 kdbusaddons/6.14.0（构建于 qtbase-sql-dbus/6.11.1）+ 直接 requires qtbase-sql-dbus/6.11.1 补齐 Qt6DBus 组件。"
- "KF6 图保持单版本：libkdegames/26.04.0 将 kcoreaddons/kconfig/ki18n/kcompletion/kwidgetsaddons/kxmlgui 钉在 6.18.0 线，下游 conanfile 用 override=True 强制 6.18.0；kdoctools/6.19.0（依赖 karchive/6.19.0）与 libkdegames 的 karchive/6.18.0 冲突，直接整体移除并打补丁跳过 DocBook/kdoctools 处理（不阻塞游戏二进制）。"
- "ECM_MODULE_PATH 需手动注入：CMakeDeps 生成的 ECMConfig 不传播该变量，且 KF6/qtbase 包用 cmake_find_mode=none 使 CMakeDeps 不加 lib/cmake 到 CMAKE_PREFIX_PATH——配方手写 conan_cmakedeps_paths.cmake 逐依赖 prepend 前缀路径。"
- "OHOS ELF 签名：包内 bin/knavalbattle 需用 llvm-objcopy 移除 .codesign 段 + binary-sign-tool sign -selfSign 1 签名，否则设备上不可执行；test_package 需直接 requires openal-soft（libkdegames 传递运行时依赖，默认 static 会被 Conan 从测试图剔除导致游戏无法启动）。"
- "CI L0c 门禁要求 test_package/ 有独立测试源文件（.c/.cpp/.cc/.cxx/.sh/.py，排除 conanfile.py）：本地目录残留 conan 生成的 conanbuild.sh/conanrun.sh 会命中 .sh 造成假阳性通过，CI 干净 checkout 才暴露（povray PR #37803 同型）。修复：断言逻辑抽为独立 run_test.py（normalize smoke_test.py 先例），conanfile test() 导入其 check_run_output() 校验退出码与版本输出；L0d 还要求 test() 内保留 self.run() 调用，两闸须同时满足。"

