version: "0.19.1"
software: "ko"
status: built
build_date: "2026-09-18"
build_system: "custom"

source:
  url: "https://github.com/ko-build/ko/archive/refs/tags/v0.19.1.tar.gz"
  sha256: "7accc1f4ad074285086573b084387bef5871872ef16e3f292d5818a99e4feeae"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux (OHOS pre-adaptation strategy)"
    - "GOARCH=<target arch>"
    - "GOTOOLCHAIN=local"
    - "go mod download via GOPROXY=goproxy.cn (ko ships no vendor/ directory)"
    - "ldflags -X github.com/google/ko/pkg/commands.Version=v0.19.1"
    - "Go 1.26.3 SDK auto-bootstrap when GO/GOROOT/PATH lacks a usable Go"
  dependencies: []
  tool_dependencies:
    - "go >= 1.26.3 (go.mod:3 go 1.26.3; auto-downloaded from golang.google.cn with dl.google.com fallback when missing)"
    - "binary-sign-tool"
  cc: go
  cxx: ""

patches_applied: []

validation:
  local:
    conan_create: passed
    conan_verify: passed
    test_package: passed
    upstream_tests: "278 executed / 260 passed / 18 failed (all 18 attributed to OHOS platform or environment limits, see notes.md) / 0 skipped"
    reason: "18 upstream failures are HMDFS symlink lstat (12), os.Symlink denial (2), hardcoded /tmp with read-only /tmp (2), docker daemon dependency (2); none are code or recipe defects. TestDebugger (github clone) is intermittent network: passed in round 3."
  ohos:
    target: "linux/arm64 static ELF (CGO_ENABLED=0), self-signed with binary-sign-tool"
    smoke: "ko version -> v0.19.1 (exit 0)"

knowledge_gained:
  - "ko 0.19.1 is a pure-Go CLI (import \"C\"=0, #cgo=0, no //go:embed): CGO_ENABLED=0 static binary, zero system-library deps."
  - "ko ships NO vendor/ directory, so modules (19 direct + 142 indirect, go.sum 586 lines) must be fetched with `go mod download` via goproxy.cn; do NOT copy ahoy's GOFLAGS=-mod=vendor."
  - "Version is injected with -X github.com/google/ko/pkg/commands.Version=v0.19.1 (pkg/commands/version.go declares `var Version string`)."
  - "Go 1.26.3 SDK requires go.mod `go 1.26.3` exactly (GOTOOLCHAIN=local prevents silent toolchain download)."
  - "Go linker requires /data/storage/el2 ext2-like workspace on HarmonyOS to avoid HMDFS mmap permission denied."
  - "OHOS Go executables (and the Go SDK tool binaries) must be self-signed with binary-sign-tool before fork/exec."
  - "Verified empirically: a self-signed Go binary CAN fork/exec the system git (2.45.2) on this device, so pkg/internal/git upstream tests run for real without -test.skip."
