# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: check_lost.py
    description: "L1 产物结构校验：ELF aarch64/ELFCLASS64/ET_DYN、NEEDED 仅 libc/libdl/libxml2/libcurl 且无 RPATH/RUNPATH、NEEDED 同时含 libxml2 与 libcurl（双依赖产物面证据）、loadmodule 入口符号导出（exports/module_version/module_flags/module_interface_ver）、无 mod_register（负断言）、无 glibc 版本化符号、licenses/COPYING 为 GPL 正文"
    command: "python3 check_lost.py（由 test_package/conanfile.py 的 test() 驱动）"
    cases: 15
  - file: conanfile.py
    description: "L1 测试入口：定位制品内 lib/kamailio/modules/lost.so，注入 LOST_MODULE/LOST_PACKAGE_FOLDER 驱动 check_lost.py（R34 实质验证，非空壳 print）"
    command: "conan create . --build=missing（CI 自动执行 test()）"
  - file: e2e_consumer.c
    description: "L2 消费者 E2E：以最小 kamailio 核心桩（28 个未定义符号）dlopen lost.so，校验 cmds/params 表后真实执行 lost_held_dereference() 全链路——libxml2 组 locationRequest、http_client_query_c 投递、xmlReadMemory 解析回包、pv 回写；覆盖 LocByVal(202)/LocByRef(201)/非法根元素(400)/HTTP 404(400)/空响应体(400) 五条分支"
    command: "由 check_lost.py 的层 2 用 clang 编译并运行（LD_LIBRARY_PATH 注入依赖包 lib 目录）"
    cases: 45

# 桩符号集口径（层 2 的 dlopen(RTLD_NOW) 必须能解析 lost.so 的全部未定义符号）
e2e_stub_symbols:
  note: "实测 readelf --dyn-syms lost.so 的 UND 集：libc 与 libxml2 的符号由 DT_NEEDED 解析，其余 28 个为 kamailio 核心符号，由 e2e_consumer.c 提供。"
  kamailio_core_data:
    - "_km_log_func（函数指针变量，非函数——形态写错会 SIGBUS）"
    - "_ksr_slog_func"
    - "_pkg_root（sr_pkg_api_t：mname/mem_pool/mem_block/xmalloc/xmallocxz/xrealloc/xreallocxf/xfree；本包 config.mak 带 -DDBG_SR_MEMORY，xmalloc 调用形态为 5 参）"
    - "dprint_crit"
    - "log_color"
    - "log_level_info"
    - "log_prefix_val"
    - "log_stderr"
    - "process_no"
  kamailio_core_funcs:
    - "find_export（真实实现：返回 bind_http_client 的绑定函数）"
    - "get_str_fparam（真实实现：按调用次序返回 url / responseTime / responseType）"
    - "dprint_color, dprint_color_reset, get_debug_facility, get_debug_level, my_pid"
    - "parse_uri, parse_headers, parse_from_header, parse_pai_header, get_body_part_by_filter, free_rdata_list, reg_replace, get_record"
    - "fixup_spve_null, fixup_free_spve_null, fixup_pvar_null, fixup_free_pvar_null"
  libc_libxml2:
    - "libc: __cxa_finalize fprintf getnameinfo inet_pton memchr memcpy memset rand snprintf sscanf strcat strcpy strlen strncasecmp strstr strtol stderr"
    - "libxml2: xmlAddChild xmlCopyNode xmlDocDumpFormatMemory xmlDocGetRootElement xmlDocSetRootElement xmlFree xmlFreeDoc xmlNewChild xmlNewDoc xmlNewNode xmlNewProp xmlNodeGetContent xmlParseInNodeContext xmlReadMemory xmlStrcasecmp xmlStrchr xmlStrcmp xmlStrdup xmlXPathEvalExpression xmlXPathFreeContext xmlXPathFreeObject xmlXPathNewContext xmlXPathRegisterNs"

# 与同族先例 kamailio-slack/6.0.6 的符号集差异（两者同为 kamailio 模块，但导出面不同）
symbol_set_diff_vs_slack:
  - "lost 无 KEMI 导出：dynsym 中不含 mod_register（slack 有），故 REQUIRED_EXPORTS 少一项并增加负断言"
  - lost 多一个 DT_NEEDED：libxml2.so.16（slack 只有 libcurl.so）——这正是本包「双原生依赖」的来源

# 测试断言总数（绿路径实测值，与 conan create 日志「层 1 产物结构：X passed」「层 2 消费者 E2E：Y passed」一致）
assertion_count: 60
assertion_count_layer1: 15
assertion_count_layer2: 45