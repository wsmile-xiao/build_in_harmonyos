# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: kamailio-lost/6.0.6
homepage: "https://www.kamailio.org"

# 上游测试命令（R51 三步法：清点 → 实跑 → 回填，完整台账见 notes.md 第四节）
#
# 清点口径（源码包内 `test/`、`tests/` 命名目录全量清点，命令可复现）：
#   tar tzf kamailio-6.0.6_src.tar.gz | grep -E '/(test|tests)/' | grep -v '/$' | wc -l  → 17
#   官方源码包内共 4 个此类目录、17 个文件：
#     utils/kamctl/dbtextdb/tests/   10 个（dbtextdb_test.py 的用例数据）
#     src/modules/janssonrpcc/test/   3 个（jsonrpc-c 模块，脚本 + 配置）
#     src/modules/rtpproxy/test/      3 个（rtpproxy 模块，配置 + 命令行记录）
#     src/modules/tm/test/            1 个（tm 模块，开发期 IPC 清理脚本）
#   lost 模块自身源码目录 src/modules/lost/ 内无测试源、无 check/ctest 目标注册
#   （源码清单：CMakeLists.txt Makefile README doc/{Makefile,lost.xml,lost_admin.xml}
#     functions.{c,h} lost.c naptr.{c,h} pidf.{c,h} response.{c,h} utilities.{c,h}
#     —— 17 个文件，与构建产物 *.o/*.d/lost.so/librpath.lst/makecfg.lst 区分开）。
#
# 实跑口径：17 个文件中唯一自包含、无需运行中 kamailio 实例与外部网络的上游测试是
#   utils/kamctl/dbtextdb/dbtextdb_test.py（上游自带 unittest 入口，3 个用例，
#   仅依赖 Python 标准库；用例数据取自同目录 tests/ 下 10 个文件）。
#   → 已在 conanfile.py build() 末尾真实执行（层 1 门禁）。
upstream_check_command: "python3 dbtextdb_test.py -v"
upstream_check_source: "kamailio-6.0.6/utils/kamctl/dbtextdb/dbtextdb_test.py"
declared_test_count: 17
executed_test_count: 3
passed: 3
failed: 0

