  # ── 未独立执行：用例数据（10 个，由上条 unittest 消费）──────────────────
  - file: "tests/bad_table_null, tests/bad_table_int, tests/bad_table_long_row, tests/bad_table_short_row, tests/bad_table_wrong_type, tests/bad_table_auto_dupe, tests/unsorted_table, tests/unsorted_table2, tests/subscriber, tests/test"
