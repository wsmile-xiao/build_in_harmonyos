# 版本级 manifest — kamailio-lost 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-lost"
status: published                      # published | built | failed | archived
build_date: "2026-09-28"
build_system: makefile             # kamailio 经典 Makefile 体系（非 autotools/cmake）

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "make cfg include_modules=lost OS=linux LOCALBASE=<不存在的路径> XML2CFG= CURL_BUILDER="
    - "make modules modules=modules/lost -j1 OS=linux LOCALBASE=<不存在的路径> XML2CFG= CURL_BUILDER="
    - "CPATH=<libxml2 包>/include/libxml2:<libxml2 包>/include:<curl 包>/include"
    - "LIBRARY_PATH=<libxml2 包>/lib:<curl 包>/lib"
  dependencies:
    - libxml2/2.15.3.1
    - curl/8.15.0.1
  cc: clang
  cxx: clang++

