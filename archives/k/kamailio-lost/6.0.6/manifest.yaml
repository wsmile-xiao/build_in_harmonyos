# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "多原生依赖模块不能用单值 LOCALBASE 兜底：modules/lost/Makefile 的 libxml2 与 curl 两段兜底分支共用同一个 $(LOCALBASE)，而 Conan 2 每个依赖一个包目录——先例 kamailio-slack 的 LOCALBASE=<curl 包目录> 手法在这里必然让 libxml2 侧失配（实测 ld 前的编译即失败于 libxml/parser.h）"
  - "可行解是逐依赖注入：XML2CFG= CURL_BUILDER= 置空 + LOCALBASE 指向不存在路径（让上游兜底分支整体落空）+ CPATH/LIBRARY_PATH 按依赖逐个列出各包 include/lib"
  - "pkg-config 修补路线实测不可用：libxml2.pc 的 prefix=/usr/local、curl.pc 的 prefix 指向构建期 cache 目录，且 libcurl.pc 的 Requires.private: openssl,zlib 会让 pkg-config --cflags 直接 rc=1"
  - "kamailio 经典 Makefile 用 uname -s 识别平台（Makefile.defs:125），HarmonyOS 落到 OS=harmonyos，不匹配任何 ifeq ($(OS), ...) 分支：实测 linux 分支比 harmonyos 分支多 11 个能力宏（HAVE_GETHOSTBYNAME2 等），其中 core/resolve.h:290 因缺 HAVE_GETHOSTBYNAME2 直接 #error，其余 10 个是静默行为差异；根因解法是 make cfg OS=linux（必须先重新 cfg，见下条）"
  - "make cfg 生成的 src/config.mak 会把 OS/C_DEFS/LOCALBASE 整个烘死；之后仅仅在 make modules 命令行追加 OS=linux 无效，因为 config.mak 的普通赋值会覆盖按 OS 重新计算出的 C_DEFS——必须让 make cfg 与 make modules 使用同一个 OS 值"
  - "lost 模块 DT_NEEDED 含 libcurl.so，但模块自身不调用任何 curl_* 符号（出站 HTTP 全部经 http_client 模块的 httpapi）——-lcurl 是链接期产物；运行期真正需要先 loadmodule 的是 http_client.so"
  - "lost 无 KEMI 导出（dynsym 无 mod_register），与同族 kamailio-slack 的符号集不同"
  - "打包产物 sha256 不可跨构建目录复现：lost.so 内含编译器记录的源码绝对路径字符串 （/storage/.../.conan2/p/b/kamai<build-id>/b/src/src/modules/lost），换 build folder 重建后 实测两次哈希分别为 3360fe9e…/b2869b30…，cmp -l 差异 86 行且全部落在该路径字符串内；本配方的 LOCALBASE=<不存在路径> 未泄漏（strings 命中 0）。引用产物指纹须限定同一 build folder。"