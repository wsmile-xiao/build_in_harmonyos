# conandata.yml - kshisen 26.04.0
# KDE Gear 26.04.0 official release-service tarball (R39: official source).

sources:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/kshisen-26.04.0.tar.xz"
  sha256: "a9ba5bed3520980bf70473d4183e57dcc990e71da60a050a63609b9ec4a457b4"

patches:
  "26.04.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: >
        OHOS: drop the KF6 DocTools component from find_package(KF6) and
        comment out kdoctools_install(po) — no meinproc/DocBook toolchain
        in the OHOS baseline; kdoctools is also unusable in a graph with
        libkdegames' karchive/6.18.0 override because its published
        binary is built against karchive/6.19.0
      patch_type: "portability"
    - patch_file: "patches/0002-doc-CMakeLists.txt.patch"
      patch_description: >
        OHOS: skip DocBook handbook generation (kdoctools_create_handbook)
        — the handbook is not needed by the game binary and there is no
        meinproc/DocBook XSL toolchain in the OHOS baseline
      patch_type: "portability"
