# MANIFEST.yml - test_package for kshisen 26.04.0
name: kshisen
version: "26.04.0"
test_type: consumer
description: >
  Consumer test for the kshisen 26.04.0 conan package on HarmonyOS PC
  (aarch64). kshisen is a QApplication GUI game (bin/kshisen, no shipped
  libraries), so the test executes the packaged binary headless under
  the offscreen Qt platform with a sandboxed HOME/XDG tree, plus OHOS
  portability assertions on the installed artifact's DT_NEEDED entries.
build_system: none
language: shell
runner: direct

# ---------------------------------------------------------------------------
# Upstream test suite: N=1 (movetest), discovery_status: EVIDENCE_COMPLETE
# ---------------------------------------------------------------------------
# Upstream 26.04.0 registers exactly one test. Verified against the
# official release archive
# (https://download.kde.org/stable/release-service/26.04.0/src/kshisen-26.04.0.tar.xz,
#  sha256 a9ba5bed3520980bf70473d4183e57dcc990e71da60a050a63609b9ec4a457b4):
#   - src/tests/CMakeLists.txt registers add_executable(movetest) +
#     add_test(NAME movetest COMMAND movetest), gated by BUILD_TESTING
#   - movetest.cpp is a Qt Test suite (QTEST_APPLESS_MAIN) linking
#     Qt6::Test against ../move.cpp — 15 test slots (x1/y1/x2/y2/tile1/
#     tile2/hasSlide/slide/slideX1/slideY1/slideX2/slideY2/swapTiles +
#     initTestCase/cleanupTestCase), ~37 QCOMPARE assertions
#   - the only add_test() in the whole tree: N=1
#
# The upstream test runs INSIDE the recipe build() via ctest
# (BUILD_TESTING=ON, recipe _run_upstream_tests, keditbookmarks
# kbookmarkmodeltest precedent: offscreen QPA, sandboxed HOME/XDG,
# --no-tests=error). This test_package is the consumer-side complement
# on the packaged artifact (R34).
upstream_check_command: "ctest --test-dir <build> (invoked by recipe build())"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error (recipe _run_upstream_tests)"
upstream_tests:
  - name: movetest
    suite: Qt Test (QTEST_APPLESS_MAIN)
    source: src/tests/movetest.cpp + ../move.cpp
    registered_by: src/tests/CMakeLists.txt add_test(NAME movetest)
    run_in: recipe build() via ctest
discovery_status: EVIDENCE_COMPLETE

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质消费被测包的产物 (执行 bin/kshisen)
test_package_tests:
  - file: test_kshisen.sh
    description: >
      Headless consumer smoke: `kshisen --version` under
      QT_QPA_PLATFORM=offscreen with sandboxed HOME/XDG (exit 0 + version
      output asserted), plus OHOS assertions: no path-form DT_NEEDED
      entries in the installed binary (E537 SONAME/NEEDED repair parity),
      libKDEGames6 AND libKMahjongg6 present in DT_NEEDED (real
      consumption of the libkdegames/26.04.0.1 and libkmahjongg/26.04.0
      dependency closure).
    command: "sh test_kshisen.sh <pkg>/bin/kshisen"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
