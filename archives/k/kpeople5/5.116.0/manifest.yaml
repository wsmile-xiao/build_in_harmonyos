knowledge_gained:
  - "kpeople5 needs three Qt5 supply packages wired together: qt5-qtbase/5.15.2.2 (Core/Gui/Widgets/Test/DBus native configs), qt5-qtdeclarative/5.15.2 (Qml/Quick, libs only) and qt5-qtsql/5.15.19 (Sql + QSQLITE, native config). The top-level find_package(Qt5 CONFIG REQUIRED Gui Sql Widgets Qml Quick) is served through a hand-written aggregated Qt5Config.cmake shim in the generators folder."
  - "qt5-qtsql/5.15.19 transitively requires qt5/5.15.19 whose CMakeDeps lowercase qt5-config.cmake aggregate (Core/Network/Gui/Widgets/Test/Xml/Concurrent only — no Sql/Qml/Quick) hijacks find_package(Qt5); the fix is cmake_find_mode=none on qt5 plus the hand-written Qt5Config shim (exact-name match wins)."
  - "kcoreaddons5/5.116.0 still pins qt5-qtbase/5.15.2 while the KF5 chain uses 5.15.2.2; self.requires('qt5-qtbase/5.15.2.2', force=True) normalises the graph onto the DBus-capable superset binary."
  - "kpeople upstream tests are QTEST_GUILESS_MAIN binaries with the FakeContactSource stub injected via PersonPluginManager::setDataSourcePlugins and a per-test QTemporaryFile sqlite db — no D-Bus session bus and no QStandardPaths data dir needed, so the full upstream suite really runs on OHOS."
