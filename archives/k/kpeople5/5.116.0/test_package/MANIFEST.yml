version: 1
package: kpeople5/5.116.0
homepage: https://invent.kde.org/frameworks/kpeople

tests:
  upstream:
    status: planned
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    source: "kpeople-5.116.0/autotests/"
    expected:
      - persondatatest
      - personsmodeltest
      - personsproxymodeltest
  package:
    status: planned
    source: test.cpp
    command: "./test_kpeople5"
    description: >-
      Drives the real KPeople public API (PersonsModel, PersonPluginManager
      registry, PersonsSortFilterProxyModel requiredProperties round-trip,
      iconNameForPresenceString / presenceSortPriority helpers, PersonData on
      an invalid URI) and asserts HarmonyOS-specific behaviour: the loaded
      libKF5People.so carries the unversioned DT_SONAME plus a DT_RUNPATH
      (E537 install-RPATH adaptation).

notes:
  - "kpeople5 is a pure library package (KF5People / KF5PeopleWidgets /
     KF5PeopleBackend shared libraries plus the QML plugin installed under
     lib/qml/org/kde/people); no commands.json is required (R38)."
  - "The three upstream QTEST targets are QTEST_GUILESS_MAIN binaries using
     the FakeContactSource stub injected through
     PersonPluginManager::setDataSourcePlugins - no D-Bus session bus and no
     QStandardPaths data location are needed (the persons db is a per-test
     QTemporaryFile)."
  - "Upstream tests are run from build() with ctest; any test that cannot
     run in the headless sandbox is listed in notes.md with the concrete
     reason."
