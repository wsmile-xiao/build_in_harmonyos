package: kdsingleapplication/1.2.1
homepage: "https://github.com/KDAB/KDSingleApplication"

upstream_check_command: "ctest --test-dir <build> --output-on-failure -j1"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error -j1"

upstream_tests:
  - file: tests/auto/simpletest/test/CMakeLists.txt
    source: tests/auto/simpletest/tst_simpletest.cpp
    description: "Single primary/secondary process messaging across all upstream data rows"
    command: "ctest -R '^tst_simpletest$' --output-on-failure"
  - file: tests/auto/stresstest/test/CMakeLists.txt
    source: tests/auto/stresstest/tst_stresstest.cpp
    description: "Multi-process stress and exactly-one-primary validation"
    command: "ctest -R '^tst_stresstest$' --output-on-failure"
  - file: tests/auto/namelengthtest/test/CMakeLists.txt
    source: tests/auto/namelengthtest/tst_namelengthtest.cpp
    description: "Long application-name and socket-path handling"
    command: "ctest -R '^tst_namelengthtest$' --output-on-failure"
  - file: tests/auto/disconnectduringreadtest/test/CMakeLists.txt
    source: tests/auto/disconnectduringreadtest/tst_disconnectduringreadtest.cpp
    description: "Secondary disconnect while the primary reads a message"
    command: "ctest -R '^tst_disconnectduringreadtest$' --output-on-failure"

test_package_tests:
  - file: test_public_api.cpp
    description: "Consume the installed upstream CMake target and validate the public primary-instance API"
    command: "ctest -R '^test_public_api$' --output-on-failure"
  - file: test_harmony_ipc.cpp
    description: "HarmonyOS-specific test of cross-process QLocalServer IPC in the socket-capable runtime cache"
    command: "ctest -R '^test_harmony_ipc$' --output-on-failure"

test_case_count: 44
assertion_count: 44
