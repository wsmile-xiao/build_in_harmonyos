software: kgb
display: "kgb"
description: ".kgb 高压缩比归档工具（基于 PAQ6，压缩/解压）"
category: utility
homepage: "https://github.com/FS-make-simple/kgb/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C++（src/kgb_arch_posix.cc）+ 手写 Makefile；无三方依赖"
    - "沿用上游 Makefile 默认 CXXFLAGS（-std=c++0x -O3 -DPROGNAME='KGB_arch'），只覆盖 CXX=clang++，并清空默认 LDFLAGS=-s"
    - "archive 格式与 PROGNAME 宏绑定，移植时保持 KGB_arch 不变"
  common_dependencies: []

versions:
  - version: "1.0b5"
    status: built
    build_date: "2026-09-23"
