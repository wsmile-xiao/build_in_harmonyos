knowledge_gained:
  - "kgb 的 archive 格式与 Makefile 的 MAGIC/PROGNAME 宏绑定（默认 KGB_arch）；移植时不能改这个宏，否则与既有 .kgb 归档不兼容"
  - "上游 Makefile 用 CXXFLAGS ?=；当 CI 环境已注入 -fPIC -O2 时，上游默认参数会被跳过，必须显式传入 -std=c++0x 与 -DPROGNAME='\"KGB_arch\"'；默认 LDFLAGS=-s 需清空交由工具链处理"
