# test_package/MANIFEST.yml
# kgb 1.0b5 - upstream test declaration.

package: kgb/1.0b5
homepage: "https://github.com/FS-make-simple/kgb/"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream 1.0b5 ships a single src/kgb_arch_posix.cc plus a hand-written
  Makefile whose only targets are all/clean. There is no test suite (no
  `make check`, no ctest, no tests/ directory). Debian adds its own packaging
  test (debian/test.sh), which is not upstream, and is reproduced in spirit by
  test_package/test_kgb.sh.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_kgb.sh
    description: "installed kgb consumer checks: usage banner, -0 byte-exact round-trip, KGB_arch magic, default-level deterministic archive (Debian's gpl.kgb checksum) and LICENSE round-trip"
    command: "sh test_kgb.sh"

test_files:
  - path: "test_package/test_kgb.sh"
    test_type: "R34"
    assertion_count: 9

test_package_test_count: 1
consumer_assertion_count: 9
upstream_test_cases: 0
assertion_count: 9
