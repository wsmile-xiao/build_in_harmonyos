# 版本级 manifest — kamailio-outbound 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-outbound"
status: published
build_date: "2026-09-26"
build_system: makefile                # kamailio 经典 Makefile 体系（非 autotools/cmake）

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "make cfg include_modules=outbound LOCALBASE=<openssl package_folder> BUILDER="
    - "make modules modules=modules/outbound -j1 LOCALBASE=<openssl package_folder> BUILDER="
  dependencies:
    - openssl/3.5.6
  cc: clang
  cxx: clang++

# ============================================================
# 上游测试（R51 三步法台账，完整清单见 notes.md 第四节）
# ============================================================
# 清点面 = 官方源码包内 test/、tests/ 目录文件数（4 个目录 / 17 个文件）
# 实测 = 其中唯一自包含、无需运行中 kamailio 实例的上游 unittest（3 个用例）已真实执行
upstream_tests:
  command: "python3 dbtextdb_test.py -v"
  source_path: "kamailio-6.0.6/utils/kamctl/dbtextdb/dbtextdb_test.py"
  test_count: 17
  executed_count: 3
  passed: 3
  failed: 0
  notes: "17 = 源码包内 test/tests 目录文件数（10 个 dbtextdb 用例数据 + janssonrpcc 3 + rtpproxy 3 + tm 1）。仅 dbtextdb_test.py 可自执行（3 个 unittest 用例，仅依赖 Python 标准库），已在 conanfile.py build() 末尾真实执行并 3/3 通过；模块自身 src/modules/outbound/ 无测试源、无 check/ctest 目标。其余 14 项逐项技术原因见 test_package/MANIFEST.yml 的 upstream_tests[].not_executed_reason。"

