patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`，否则报 No rule to make target 'cfg-defs'"
  - "outbound 模块 Makefile 在 CROSS_COMPILE 为空时用 `which pkg-config` 探测 OpenSSL；只要构建机 PATH 里有 pkg-config，就会注入宿主 OpenSSL 的 cflags/libs → 交叉编译产物指向宿主库。必须显式传 BUILDER=（make 命令行变量优先级高于 Makefile 内部赋值）钉死 LOCALBASE 回退分支（同族 snmpstats 的 SNMPCONFIG=、unixodbc 的 ODBCCFG= 同手法）"
  - "回退分支写的 -I$(LOCALBASE)/ssl/include 与 conan openssl 包布局（<pkg>/include）不一致，头文件真实路径靠 CPATH=<openssl>/include 提供；库路径由 LIBRARY_PATH=<openssl>/lib 提供"
  - "R26 系统同名库静态化：conan openssl 默认 shared=False，模块静态吸收 libssl/libcrypto（产物 4,512,128 bytes，DT_NEEDED 仅 libc.so，无 libssl.so/libcrypto.so 依赖串），不污染目标机 /lib 同名库"
  - "kamailio 同时提供 CMake 与经典 Makefile 两套构建体系；仅打包单个模块时用经典 Makefile 更直接"
  - "打包产物 outbound.so 无 RPATH/RUNPATH、无 glibc 版本化符号（GLIBC_ 字符串 0 处，musl/clang 交叉编译）；产物未 strip，debug 字符串内含构建目录绝对路径（仅调试信息，与运行时依赖解析无关）"

# 本配方 0 补丁：探索阶段未改动任何源文件（conandata.yml 为 patches: {}），
# 平台识别与依赖探测全部通过 make 变量 + 环境变量解决，无需源码改动
patch_generation:
