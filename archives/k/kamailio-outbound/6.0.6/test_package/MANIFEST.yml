    executed: false
    not_executed_reason: "配置文件，无执行入口；随 janssonrpcc 模块测试使用"
  # ── 未执行：rtpproxy 模块测试目录（3 个）──────────────────────────────
  - file: kamailio.cfg
    source: kamailio-6.0.6/src/modules/rtpproxy/test/kamailio.cfg
