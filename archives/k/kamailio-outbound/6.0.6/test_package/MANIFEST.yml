    source: kamailio-6.0.6/utils/kamctl/dbtextdb/dbtextdb_test.py
    description: "kamctl dbtextdb 驱动 unittest（testParseQuery/testOpenTable/testExecute）"
    command: "python3 dbtextdb_test.py -v"
    cases: 3
    executed: true
    result: "Ran 3 tests ... OK (3/3, failures=0 errors=0)"
  # ── 未独立执行：用例数据（10 个，由上条 unittest 消费）──────────────────
  - file: "tests/bad_table_null, tests/bad_table_int, tests/bad_table_long_row, tests/bad_table_short_row, tests/bad_table_wrong_type, tests/bad_table_auto_dupe, tests/unsorted_table, tests/unsorted_table2, tests/subscriber, tests/test"
    source: kamailio-6.0.6/utils/kamctl/dbtextdb/tests/
    description: "dbtextdb_test.py 的用例数据文件（非独立用例，无执行入口）"
    executed: false
    not_executed_reason: "纯数据文件（无执行位、无断言），由已执行的 dbtextdb_test.py 读取消费（该 unittest 已 3/3 通过）"
  # ── 未执行：janssonrpcc（jsonrpc-c）模块测试（3 个）────────────────────
  - file: run-tests.sh
