    executed: false
    not_executed_reason: "纯文本命令行记录（无执行位、无断言），非可执行用例"
  - file: exec_pjsua.txt
    source: kamailio-6.0.6/src/modules/rtpproxy/test/exec_pjsua.txt
    description: "pjsua 客户端启动命令行记录（音视频呼叫联调用）"
    executed: false
    not_executed_reason: "纯文本命令行记录（无执行位、无断言），依赖 pjsua 等外部二进制"
  # ── 未执行：tm 模块开发期清理脚本（1 个）──────────────────────────────
  - file: kill_sem.sh
    source: kamailio-6.0.6/src/modules/tm/test/kill_sem.sh
    description: "tm 模块开发期 IPC 清理脚本（ipcrm 删除宿主全部 SysV 信号量/共享内存）"
    executed: false
    not_executed_reason: "非测试用例：需 root 且 ipcrm 会删除构建机全部 SysV IPC 对象，在共享 CI worker 上执行将破坏其他进程；上游仅作开发调试清理用"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  # ── 鸿蒙特有测试：完整消费者用例（人工评审 rule12 要求）───────────────────
  - file: test_outbound_e2e.c
    description: >-
      鸿蒙特有测试（完整消费者用例，非纯断言）：以真实消费者身份 dlopen(outbound.so)
      → dlsym("exports") 读导出表 → init_mod_f()（shm 密钥分配/配置组声明/依赖探测）
      → bind_ob() 绑定 API → encode_flow_token() 生成 flow-token（独立实现的 base64
      解码器交叉验证 <HMAC-SHA1-80><proto><dst_ip><dst_port><src_ip><src_port> 布局，
      IPv4=23B/32 字符、IPv6=47B/64 字符两分支，并做 UDP/TCP 协议矩阵复核）
      → decode_flow_token() 还原地址、端口与协议 → use_outbound() → destroy_mod_f()
      （shm/pkg 分配释放平衡）→ 二次 init_mod_f()/destroy_mod_f()（消费者热重载语义下
      生命周期复跑）→ dlclose；
      负例覆盖：无 token / 空 token / base64 合法但长度非法 / 非 base64 / HMAC 篡改
      / encode(NULL) / bind_ob(NULL)。
    command: "cc -std=gnu11 -Wl,--export-dynamic -o outbound_e2e test_outbound_e2e.c kamailio_core_stub.c && ./outbound_e2e"
    e2e: true
    cases: 81
  - file: kamailio_core_stub.c
    description: >-
      消费者进程内的 kamailio core 符号层：pkg/shm 分配器根（_pkg_root/_shm_root 及
      xmalloc/xfree/xrealloc）、cfg_declare、日志层（_km_log_func 等）、base64 8K 查表
      （_bx_b64_12/_bx_ub64）。作用：让 outbound.so 能在进程内按 RTLD_NOW 真实加载
      —— OHOS/musl 无惰性绑定（RTLD_LAZY 等同 RTLD_NOW），模块的全部未定义符号
      必须可解析。
  - file: kamailio_core_stub.h
    description: >-
      core ABI 最小复刻（sip_msg.ldv@1792 / ldv 224B / flow.rcv@8 / receive_info 208B
      / module_exports 80B / cmd_export 48B / param_export 24B / ip_addr 24B），
      由 test_outbound_e2e.c 的 _Static_assert 在编译期复核，与本机探针实测一致。
  # ── 产物面校验 ───────────────────────────────────────────────────────────
  - file: check_outbound.py
    description: "产物结构校验：ELF aarch64/ET_DYN、模块导出符号（exports/use_outbound/outbound_cfg）、无 glibc 版本化符号、OpenSSL 静态吸收、licenses/COPYING、NEEDED 仅 libc.so 且无 RPATH/RUNPATH"
    command: "python3 check_outbound.py"
  - file: conanfile.py
    description: "L1 测试入口：定位制品内 lib/kamailio/modules/outbound.so，注入 OUTBOUND_MODULE/OUTBOUND_PACKAGE_FOLDER 后先跑 check_outbound.py，再编译并实跑消费者端到端用例（R34 实质验证，非空壳 print）"
    command: "conan create . --build=missing（CI 自动执行 test()）"

# 断言总数（check_outbound.py 中的 check() 调用数，10 项为无条件断言；
# 另含 2 项 readelf 动态段复核断言，构建机无 readelf/llvm-readelf 时走 SKIP 分支）
assertion_count: 10

# 鸿蒙特有测试（消费者端到端）断言数：test_outbound_e2e.c 的 E2E_ASSERTIONS_OK
# 本机实跑（OHOS aarch64, clang）81/81 通过，失败数 0（conan create rc=0）
e2e_assertion_count: 81
