  - "上游 CMake 在 BUILD_TESTING=ON 时生成 kcp_test，但不注册 CTest，recipe 直接运行该可执行文件；详见 test_package/MANIFEST.yml"
  - "上游 LatencySimulator 测试应用测试专用补丁，使用跨 libc 一致的丢包/延迟序列并取消交互等待，避免 OHOS CI 在 dead_link 后无限等待"
