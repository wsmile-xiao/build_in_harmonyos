# KCP 2.1.1 upstream and consumer test declaration.

package: kcp/2.1.1
homepage: "https://github.com/skywind3000/kcp"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "kcp-2.1.1.tar.gz (GitHub 2.1.1 tag archive)"
  source_sha256: "54d3c80928d206529f67cba6f96f2c98007182b46e3112819b200d914f96e425"
  build_system: "CMake 4.0 project; BUILD_TESTING adds the kcp_test executable"
  test_definition: >
    Upstream test.cpp includes ikcp.c and runs the default, normal, and fast
    latency-simulator scenarios from main(), for three scenarios total. Each
    scenario transfers more than 1000 simulated packets through two KCP
    endpoints and prints a mode result; the recipe applies a test-only patch
    that makes the loss/latency sequence portable across libc implementations,
    removes the interactive pause, and fails a scenario after 120 seconds
    instead of waiting indefinitely.

upstream_check_command: "cmake --build <build-dir> --target kcp_test && <build-dir>/kcp_test"
upstream_test_in_build: true
upstream_test_command: "<build-dir>/kcp_test"

upstream_tests:
  - file: test.cpp
    source: "kcp-2.1.1/test.cpp"
    description: "LatencySimulator integration test in default, normal, and fast modes"
    scenarios: 3

test_package_tests:
  - file: test_kcp.c
    description: >
      Link a C consumer against the packaged kcp::kcp target, configure both
      endpoints, send a fragmented 4096-byte payload through a deterministic
      in-memory packet queue, and verify the reassembled payload.
    command: "./test_kcp"
    assertions: 13

assertion_count: 13
