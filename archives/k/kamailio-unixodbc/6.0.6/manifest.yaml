# 版本级 manifest — kamailio-unixodbc 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-unixodbc"
status: published
build_date: "2026-09-25"
build_system: makefile                # kamailio 经典 Makefile 体系（非 autotools/cmake）

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "make cfg include_modules=db_unixodbc LOCALBASE=<unixodbc package_folder> ODBCCFG="
    - "make modules modules=modules/db_unixodbc -j1 LOCALBASE=<unixodbc package_folder> ODBCCFG="
  dependencies:
    - unixodbc/2.3.12
  cc: clang
  cxx: clang++

# ============================================================
# 上游测试（R51 三步法台账，完整清单见 notes.md 第四节）
# ============================================================
# 清点面 = 官方源码包内 test/、tests/ 目录文件数（4 个目录 / 17 个文件）
# 实测 = 其中唯一自包含、无需运行中 kamailio 实例的上游 unittest（3 个用例）已真实执行
upstream_tests:
  command: "python3 dbtextdb_test.py -v"
  source_path: "kamailio-6.0.6/utils/kamctl/dbtextdb/dbtextdb_test.py"
  test_count: 17
  executed_count: 3
  passed: 3
  failed: 0
  notes: "17 = 源码包内 test/tests 目录文件数（10 个 dbtextdb 用例数据 + janssonrpcc 3 + rtpproxy 3 + tm 1）。仅 dbtextdb_test.py 可自执行（3 个 unittest 用例，仅依赖 Python 标准库），已在 conanfile.py build() 末尾真实执行并 3/3 通过；其余 14 项逐项技术原因见 test_package/MANIFEST.yml 的 upstream_tests[].not_executed_reason。"

# ============================================================
# 补丁信息
# ============================================================

# 上游 6.0.6 源码包原生识别 aarch64-unknown-linux-ohos，未应用任何补丁
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`，否则报 No rule to make target 'cfg-defs'"
  - "db_unixodbc 模块 Makefile 在 CROSS_COMPILE 为空时用 `which odbc_config` 探测 unixODBC；conan 的 unixodbc 包不含 bin/odbc_config，但构建机若存在系统 odbc_config 会被命中并注入宿主路径 → 必须显式传 ODBCCFG=（make 命令行变量优先级高于 Makefile 内部赋值）钉死 LOCALBASE 回退分支"
  - "unixodbc/2.3.12 包仅提供 include/ 与 lib/（无 bin/），LOCALBASE 回退分支即得 -I<uni>/include -L<uni>/lib -lodbc"
  - "kamailio 同时提供 CMake 与经典 Makefile 两套构建体系；仅打包单个模块时用经典 Makefile 更直接"
  - "打包产物 db_unixodbc.so 无 RPATH/RUNPATH，动态依赖仅 libodbc.so.2 + libc.so；产物未 strip，debug 字符串内含构建目录绝对路径（仅调试信息，与运行时依赖解析无关）"

# 本配方 0 补丁：探索阶段未改动任何源文件（编辑追踪器无变更记录），
# refresh-patch --auto 无候选可生成（对比 kamailio-snmpstats：24 个候选全为构建生成物）
patch_generation:
  method: none
  patches_count: 0
  note: "编辑追踪器无变更记录，0 候选；conandata.yml 为 patches: {}"
