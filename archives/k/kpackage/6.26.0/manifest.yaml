test_results:
  type: passed
  upstream: "passed: 8/8 executed upstream CTest tests (fallbackpackagetest, packagestructuretest, querytest, 5x appstream); plasmoidpackagetest excluded (-E) because it hangs on the OHOS runner (R01 baseline)"
  ohos_test: "passed: test_ohos_adaptation exercises KPackage::PackageLoader + Package + PackageJob::install (KArchive extraction) + KPluginMetaData on OHOS"
notes: >-
  KF_DEP_VERSION lowered 6.26.0 -> 6.19.0 via 0001 patch because the ohpcd
  registry caps karchive at 6.19.0 (knewstuff 6.29.0 precedent); kcoreaddons
  and ki18n are consumed at their published 6.26.0 versions (>= 6.19.0 floor).
  ECM 6.26 KDEInstallDirs6 runs the qtbase qtpaths host tool during configure;
  /system/lib64 is prepended to LD_LIBRARY_PATH in the build and test
  environments so the compatible libc++_shared.so is resolved (kconfig 6.26.0
  / bluez-qt 6.28.0 precedent).
