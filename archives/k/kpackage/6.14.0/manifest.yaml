knowledge_gained:
  - "kpackage 6.14.0 adapted from 6.18.0.1 patches with line number adjustments for changed source code."
  - "OHOS: QStandardPaths::standardLocations(GenericDataLocation) derives from XDG_DATA_DIRS/XDG_DATA_HOME which are unset by default; package/plugin discovery needs an OH-equivalent data-root fallback."
  - "OHOS: QMimeDatabase resolves .tar.gz to application/gzip while upstream kpackage only accepts application/x-compressed-tar family, so plain kpackage tarballs are rejected unless application/gzip is accepted."
  - "OHOS: KArchive copyTo() may fail under restricted syscalls (setreuid/chroot); a plain recursive content-extraction fallback keeps PackageJob::install working."
  - "KF6 KArchiveEntry exposes symlinks only via symLinkTarget() (isFile()/isDirectory() false for symlinks); there is no isSymLink()/KSymLinkEntry in this version."
