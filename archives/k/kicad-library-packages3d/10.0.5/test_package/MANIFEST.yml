package: kicad-library-packages3d/10.0.5
homepage: "https://gitlab.com/kicad/libraries/kicad-packages3D"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  kicad-packages3D 10.0.5 是纯 3D 模型资源集合（上游 CMakeLists.txt 仅有
  install(DIRECTORY ...) 一条指令），不含任何测试目标或测试框架。
  KiCad 10 起上游移除全部 VRML .wrl 模型，归档实测仅含 .step。
test_package_tests:
  - file: kicad_packages3d_probe.cpp
    description: >-
      真消费者测试：核对包内 .3dshapes 家族目录数与目录名集合
      （105 个家族、7245 个 .step、48 个辅助文件、共 7293 个文件），
      全量校验 .step 文件 ISO-10303-21 头/尾结构，并对截断 .step
      做故障注入负向校验。
    command: "kicad_packages3d_probe <package-3dmodels-root>"
assertion_count: 14771
assertion_count_note: >-
  1（资源根为目录）+ 105（根级条目均为 .3dshapes 目录）+ 105（家族目录
  非空）+ 7293（家族目录内均为普通文件）+ 4（目录/.step/辅助/总文件计数）
  + 15（spot 目录在位）+ 7245（.step 逐个头/尾结构校验）+ 1（校验数核对）
  + 2（负向注入：缺头/缺尾截断文件被拒绝）
