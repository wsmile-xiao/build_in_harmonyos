# ============================================================
# 必须字段
# ============================================================

version: "3.0.3"
software: "kea-hook-flex-option"

# 编译状态: published | built | failed | archived
status: published

build_date: "2026-09-29"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================

artifacts:
  - "lib/kea/hooks/libdhcp_flex_option.so"
  - "lib/libkea-*.so* (hook 运行时依赖闭包，20 个 kea 库)"

# ============================================================
# 上游测试（build() 内真实执行）
# ============================================================

upstream_tests:
  command: "meson test -v -C <builddir> dhcp-flex-option-lib-tests dhcp-flex-option-libload-tests"
  suites_run: 2
  # 源码 TEST/TEST_F 宏计数：tests/ 148（flex_option_unittests 63 + sub_option_unittests 85）+ libloadtests/ 5
  cases_in_source: 153
  root_cases: 0
  root_cases_detail: "无：flex-option 为纯选项表达式逻辑 hook，无 SOCK_RAW/无特权依赖/无外部数据文件（与 ping-check 的 48 个 Root 组用例形成对比）"
  # 真机实测（2026-09-29 真机 conan create，meson test 实跑，22:51 验证报告）：
  # dhcp-flex-option-lib-tests 148 例 + dhcp-flex-option-libload-tests 5 例，
  # 零 root 零 SKIP 全 PASSED（[  PASSED  ] 148 / [  PASSED  ] 5，Ok: 2 Fail: 0）。
  cases_run: 153
  cases_passed: 153
  cases_failed: 0
  cases_skipped: 0
  cases_unregistered: 0
  cases_unregistered_reason: "无：源码 TEST/TEST_F 宏 153 个（148 + 5），本配置全部注册"

# ============================================================
# 鸿蒙特有测试（test_package，3 个用例）
# ============================================================

ohos_specific_tests:
  count: 3
  entries:
    - "test_package/test_flex_option_hook.c → test_flex_option_hook（hook 加载与契约）"
    - "test_package/test_ohos_platform.c → test_ohos_platform（平台 ABI）"
    - "test_package/test_ohos_runtime.c → test_ohos_runtime（运行时闭包）"
  command: "./test_flex_option_hook <so> && ./test_ohos_platform <so> && ./test_ohos_runtime <so>"
  checks:
    - "dlopen(RTLD_NOW) 加载 hook，KEA_HOOKS_VERSION == 30003，load/unload 契约符号可解析"
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so），且不含 GNU libstdc++ 命名"
    - "OHOS 加载器 dlopen(RTLD_NOW|RTLD_LOCAL) 可解析插件及其 Kea 运行库闭包（实测 DT_NEEDED 项数见 notes.md）"
    - "包内 Kea 运行时库（lib/libkea-*.so*）在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 成功（实测 40/40）"
    - "闭包驻留后 hook 仍可加载，load/unload 契约符号可在运行时解析"
  # 真机实测（2026-09-29 22:51 验证报告，test_package 在 G2 内实跑）：
  # test_flex_option_hook OK（hooks version 30003）+ test_ohos_platform OK
  # （DT_NEEDED 11 项 = kea 闭包 9 + libc++_shared.so + libc.so）+
  # test_ohos_runtime OK（40 found / 40 loaded）。
  cases_run: 3
  cases_passed: 3
  cases_failed: 0

