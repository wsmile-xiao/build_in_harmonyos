# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-flex-option/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的两个 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> dhcp-flex-option-lib-tests dhcp-flex-option-libload-tests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-flex-option-lib-tests dhcp-flex-option-libload-tests"

# 上游实际运行的测试程序（源码 TEST/TEST_F 宏计数：148 + 5 = 153）
upstream_tests:
  - file: dhcp-flex-option-lib-tests
    source: src/hooks/dhcp/flex_option/tests/
    description: >-
      flex-option hook 单元测试（选项配置解析 / 表达式求值 / 表达式缓存 /
      sub-option 定义与值替换 / DHCPv4 选项加工流程），本配置注册 148 个用例
      （与源码 TEST/TEST_F 宏数一致，无未注册用例）。全部为纯逻辑用例：
      无 SOCK_RAW、无特权依赖、无外部数据文件，OHOS 沙箱下零 root 全实跑
    command: "./dhcp-flex-option-lib-tests"
  - file: dhcp-flex-option-libload-tests
    source: src/hooks/dhcp/flex_option/libloadtests/
    description: "5 个 gtest 用例，校验 libdhcp_flex_option.so 可被 Kea hook 框架加载/卸载（meson 注册的套件名 dhcp-flex-option-libload-tests）"
    command: "./dhcp-flex-option-libload-tests"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_flex_option_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload 契约符号与 hook ABI 版本"
    command: "./test_flex_option_hook <package>/lib/kea/hooks/libdhcp_flex_option.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 libdhcp_flex_option.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc libc.so.6、
      链接 libc++_shared.so）并验证 OHOS 加载器可 dlopen(RTLD_NOW) 解析
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_flex_option.so"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 包内
      20 个 Kea 运行时库（lib/libkea-*.so*），校验完整 NEEDED 闭包可解析、
      闭包驻留后 hook 仍可加载且 load/unload 契约符号可解析
    command: "./test_ohos_runtime <package>/lib/kea/hooks/libdhcp_flex_option.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（test_package 内，实测结果见版本级 notes.md）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <so> && ./test_ohos_runtime <so>"

# 上游测试用例宏总数（本次适配源码计数：148 + 5；实际注册执行数见版本级 manifest）
assertion_count: 153
