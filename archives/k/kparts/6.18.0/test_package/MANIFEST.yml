# test_package/MANIFEST.yml — kparts/6.18.0
# Upstream and consumer test declaration (CI build_and_test.sh L0e requires
# this file; see docs/TEST_QUALITY_SPEC.md).

package: kparts/6.18.0
homepage: https://invent.kde.org/frameworks/kparts

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

# 上游实际运行的测试（kparts 上游 autotests 注册的两个 QTest 可执行）
# 实测总计 20 项（parttest 12 + partloadertest 8，QTest Totals 原样统计，
# 含 initTestCase/cleanupTestCase），0 失败。
upstream_tests:
  - file: autotests/parttest.cpp
    source: kparts-6.18.0/autotests/parttest.cpp
    description: "上游 QTest 套件 1：Part 生命周期/自动删除、OpenUrlArguments 回环、本地文件 openUrl->openFile 分派、自动 MIME 探测、closeUrl 状态复位、PartManager/MainWindow 工具栏可见性（QTEST_MAIN + QApplication，QT_QPA_PLATFORM=offscreen 运行）"
    command: "ctest --test-dir <build_folder> -R '^parttest$' --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON; QTest GUI cases need the qtbase offscreen QPA plugin"
    cases_measured: 12
    cases_passed: 12
    measured_totals: "Totals: 12 passed, 0 failed, 0 skipped, 0 blacklisted"
    case_list: "initTestCase, testOpenUrlArguments, testAutomaticMimeType, testActivationEvent, testToolbarVisibility, testAutoDeletePart, testNoAutoDeletePart, testAutoDeleteWidget, testNoAutoDeleteWidget, testEmptyUrlAfterCloseUrl, testShouldNotCrashAfterDelete, cleanupTestCase"
  - file: autotests/partloadertest.cpp
    source: kparts-6.18.0/autotests/partloadertest.cpp
    description: "上游 QTest 套件 2：KParts::PartLoader 插件发现/加载（notepadpart MODULE）、mimeapps.list 关联、能力位查询与兼容接口"
    command: "ctest --test-dir <build_folder> -R '^partloadertest$' --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON; needs the notepadpart plugin from the build tree on the Qt/KF plugin path"
    cases_measured: 8
    cases_passed: 8
    measured_totals: "Totals: 8 passed, 0 failed, 0 skipped, 0 blacklisted"
    case_list: "initTestCase, shouldListParts, shouldInstantiatePart, shouldLoadPlainTextPart, shouldHandleNoPartError, testPartCapabilities, testPartCapabilitiesCompat, cleanupTestCase"

upstream_cases_total: 20
upstream_cases_passed: 20

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.cpp
    description: "消费者端到端（1 个场景 / 15 项断言）：自定义 KParts::ReadOnlyPart 子类完整驱动本地文件生命周期——OpenUrlArguments 回环、openUrl(local file) -> urlChanged/started 信号 -> openFile() 回调经 localFilePath() 读取真实文件 -> completed() 信号 -> 二次 openUrl -> closeUrl() 状态复位；同一二进制复用于 DAYU200 真机端到端证据"
    command: "conan create (test_package builds and runs test_kparts)"
    cases_measured: 1
    assertions: 15
    measured_output: "RESULT: kparts 6.18.0 consumer end-to-end: 15/15 checks passed"

# 测试断言总数（消费者端到端 15 项断言）
assertion_count: 15
