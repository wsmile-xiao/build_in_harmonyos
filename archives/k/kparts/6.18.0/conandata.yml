# conandata.yml — kparts 6.18.0
sources:
  url: "https://download.kde.org/stable/frameworks/6.18/kparts-6.18.0.tar.xz"
  sha256: "846e522e6aff2a219064a52e9baeefdfbcbea71dadb1810b9c58cb9c41821604"

patches:
  - patch_file: "patches/0001-lower-kf-dep-version.patch"
    patch_description: "Lower KF_DEP_VERSION from 6.18.0 to 6.14.0. ohpcd's only kio containing KIOWidgets is kio/6.14.0 (kio/6.26.0 is a KIOCORE_ONLY build: no KIOWidgets target and no KUriFilter header, while kparts' NavigationExtension really does use KUriFilter/KUriFilterData). Mixing kio/6.14.0 with the KF6 6.18 series would force kio 6.14 to be rebuilt from source, which fails in its trash worker. The whole KF6 graph therefore stays on the published 6.14.0 series; every KF6/KIO API used by kparts 6.18 exists there."
    patch_type: "portability"
  - patch_file: "patches/0002-lowercase-kio-includes.patch"
    patch_description: "Include the KIO headers by their installed paths (kio/filecopyjob.h, kio/statjob.h) instead of the CamelCase forwarding names (<KIO/FileCopyJob>, <KIO/StatJob>). The ohpcd kio package installs the headers under include/KF6/KIOCore/kio/, so the CamelCase spelling only resolves on a case-insensitive filesystem while the exported include directory is include/KF6/KIOCore. Identical declarations, no behaviour change; makes the build filesystem independent."
    patch_type: "portability"
