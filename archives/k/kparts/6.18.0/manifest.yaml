# 版本级 manifest — ARCHIVE-SPEC v2.0
# 文件位置: archives/k/kparts/6.18.0/manifest.yaml

version: "6.18.0"
software: kparts
status: built
build_date: "2026-09-29"
build_system: cmake

source:
  url: "https://download.kde.org/stable/frameworks/6.18/kparts-6.18.0.tar.xz"
  sha256: "846e522e6aff2a219064a52e9baeefdfbcbea71dadb1810b9c58cb9c41821604"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=ON"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DCMAKE_CXX_STANDARD=20"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies:
    - qtbase/6.11.1
    - kconfig/6.14.0
    - kcoreaddons/6.14.0
    - ki18n/6.14.0
    - kservice/6.14.0
    - kwidgetsaddons/6.14.0
    - kxmlgui/6.14.0
    - kjobwidgets/6.14.0
    - kio/6.14.0
  tool_requires:
    - ecm/6.26.0
  cc: clang
  cxx: clang++

patches_applied:
  - patches/0001-lower-kf-dep-version.patch
  - patches/0002-lowercase-kio-includes.patch

knowledge_gained:
  - "ohpcd 无 kio/6.18.0；kio/6.26.0 为 KIOCORE_ONLY（无 KIOWidgets 目标、无 KUriFilter 头、CamelCase 头目录被裁剪），kio/6.14.0 才是含 KIOWidgets 的全栈包。kparts 6.18 的 src/navigationextension.cpp 真实调用 KIOWidgets 的 KUriFilter/KUriFilterData，故必须使用 kio/6.14.0"
  - "kio/6.14.0 配方把 17 个 KF6 共享库精确钉在 6.14.0；用 override 强制 6.18.0 会让 kio 从源码重建，而其 kioworkers/trash/trashimpl.cpp 依赖 <solid/block.h>，已发布的 solid 包只装 include/KF6/Solid/Solid/block.h（大小写不匹配），故混合栈路线不可行"
  - "最终方案：整图钉在 ohpcd 已发布的 KF6 6.14.0 系列（零依赖重建，kio/6.14.0 直接下载二进制），kparts 只放宽自己的 KF_DEP_VERSION=6.14.0（patch 0001）。KF6 在同一大版本内保持 API 兼容，kparts 6.18 用到的 KF6/KIO API 在 6.14.0 全部存在"
  - "OHPC CI 构建机上文件名大小写不敏感（已发布 kio/6.14.0 内含 lib/plugins/kf6/kio/kio_trash.so，其 trashimpl.cpp 写 <solid/block.h>），而本地验证环境为 ext4 大小写敏感；因此配方不能依赖 CamelCase 头解析。kparts 源码中仅 3 处 <KIO/...> 包含，patch 0002 统一改写为 kio/6.14.0 实际安装的小写路径（<kio/filecopyjob.h>、<kio/statjob.h>）"
  - "已发布依赖包的 DT_NEEDED 带两种解析形态：绝对路径（发布机 conan 缓存 /storage/Users/currentUser/.cache/conan2/p/<hash>/p/lib/）与相对路径（如 ../../bin/libKF6ConfigCore.so，来自 kconfig/kiconthemes/ki18n/kbookmarks 的同工程库）。musl 对含 / 的 DT_NEEDED 按进程 CWD 解析，LD_LIBRARY_PATH 对这类名字无效；OHOS 内核对 ELF 做代码签名校验，改写副本会被拒绝。配方在运行 ctest 前按平台知识库方案（PR #9573 先例）用软链接补齐这些路径（软链接不改变目标文件内容，签名保持有效），并把依赖闭包（含传递依赖）全部加入 LD_LIBRARY_PATH"
