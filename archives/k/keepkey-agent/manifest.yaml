# 软件级 manifest — keepkey-agent
# 遵循 ARCHIVE-SPEC v3.0

software: keepkey-agent
display: "keepkey-agent"
description: "keepkey-agent — KeepKey 硬件钱包 SSH/GPG agent 命令行工具（romanz/trezor-agent 生态 KeepKey 变体，纯 Python）"
category: tool
homepage: "https://github.com/romanz/trezor-agent"
license: LGPL-3.0
build_system: setuptools

ohos_adaptation:
  key_points:
    - "纯 Python noarch 包——无 C/C++ 编译；上游 sdist 是 1352 字节壳包（keepkey_agent.py 4 行 + setup.py），实体逻辑全在依赖闭包里"
    - "Python 级运行时依赖（libagent 0.9.0 / keepkey 0.7.3 / ecdsa / semver / protobuf / mnemonic）未发布到 ohpcd 制品仓——从 OHOS pypi 镜像 vendor 纯 Python 组件随包分发"
    - "keepkeylib 0.7.3 是 2017 年 py2 代码：打 4 处 py3 兼容补丁（unicode() 字面量 / serialized_pb bytes / _ParseOptions bytes / 裸 import 改包内相对导入——py3 全局 descriptor pool 下双模块实例 RegisterExtension 撞 wire_in 60002 实测）"
    - "ed25519 C 扩展包不可用（OHOS 无签名 wheel 不可 dlopen）——写纯 Python ed25519 shim（API 兼容 libagent.formats 消费面），数学后端 pure25519，RFC 8032 测试向量验证通过"
    - "keepkeylib 的 USB HID 传输层（transport_hid.py import hid——hidapi C 扩展）按需导入：keepkey_agent 入口链不触发；真实设备连接需另行提供 hidapi（硬件钱包场景设备侧限制，如实申报）"
  common_dependencies: []

versions:
  "0.9.0":
    status: built
    build_date: "2026-09-19"
    conan_ref: "keepkey-agent/0.9.0"
