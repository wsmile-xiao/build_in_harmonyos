# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: keepkey-agent/0.9.0
homepage: "https://github.com/romanz/trezor-agent"

# 上游 0.9.0 无 tests/ 目录（pypi sdist 仅 1352 字节：keepkey_agent.py
# 4 行壳模块 + setup.py + egg-info；无任何测试文件）。
# keepkey 0.7.3 的 tests/（34 个文件）全部依赖真实 KeepKey USB 设备
# （tests/common.py 直接构造 HidTransport 枚举真设备 + debuglink，
# setUp 即 wipe_device）——CI 无硬件，逐项豁免。
# build() 跑的是功能性实测（导入链/CLI 入口/协议 wire 往返/双曲线
# 签名验证闭环）——设备无关的实体逻辑路径全覆盖。
upstream_test_in_build: true
upstream_test_command: "python3 kka_checks.py (functional checks: import chain / CLI argparse / protobuf wire round-trip / NIST256+ED25519 sign-verify closed loops)"

upstream_tests:
  - name: keepkey_agent-0.9.0 sdist tests/
    count: "0"
    description: "上游 sdist 不含任何测试文件（1352B 壳包：keepkey_agent.py 4 行 + setup.py + egg-info）——romanz/trezor-agent v0.9.0 tag 的 keepkey_agent/ 子目录同样只有 keepkey_agent.py 与 setup.py，无 tests/。N=0 如实申报"
  - name: keepkey-0.7.3 tests/（依赖库，豁免）
    count: "34"
    description: "keepkey 0.7.3 的 34 个测试文件全部依赖真实 KeepKey USB 硬件设备：tests/common.py 的 KeepKeyTest.setUp() 直接构造 HidTransport（USB HID 枚举）+ DebugLinkTransport 并 wipe_device——CI 环境无 KeepKey 设备，全部豁免（硬件依赖）。设备无关的协议层逻辑（protobuf wire 序列化往返、消息构造）已在功能实测中覆盖（t_keepkeylib_protocol）"

test_package_tests:
  - file: test_keepkey_agent.py
    description: "R34 消费验证：①HARD 文件存在性（keepkey_agent.py + 完整运行时闭包 11 组件）；②keepkey-agent 入口脚本 --help 实跑（argparse 全链）；③导入链 keepkey_agent->libagent(.ssh/.gpg/.device.keepkey)->keepkeylib；④protobuf Ping 消息 wire 往返；⑤NIST256p SSH 签名验证闭环（KeepKey 主曲线，设备无关）；⑥ED25519 签名验证闭环（ed25519 shim + pure25519，含篡改签名拒绝）"
    command: "python3 test_keepkey_agent.py <package>"

assertion_count: 16
