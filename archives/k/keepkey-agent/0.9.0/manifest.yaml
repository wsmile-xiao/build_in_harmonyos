  - category: L1
    content: "纯 Python noarch 适配通用模式（同 kegtron-ble/rich/python-magic）：直接拷贝源码模块到 lib/pythonX.Y/site-packages + package_info() 注入 env_info.PYTHONPATH——绕过 pip 构建（环境 setuptools egg_info 加载 entry point 报 pbr 缺失实测）"
