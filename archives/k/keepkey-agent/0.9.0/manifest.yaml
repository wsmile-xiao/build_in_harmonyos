  - category: L2
    content: "2017 年 py2 时代 protobuf pb2 模块在 py3 的完整修复配方（keepkeylib 0.7.3 实测）：①unicode(\"x\", \"utf-8\") → \"x\"（默认值字面量）；②serialized_pb='...' → b'...'（bytes 字面量）；③_ParseOptions(..., '...') 第二参数 → b'...'；④裸 import types_pb2 → try 相对导入（py3 全局 descriptor pool 下，裸名与包名两个模块实例各自执行 RegisterExtension 会撞 AssertionError: Extensions \"wire_in\" and \"wire_in\" both try to extend ... field number 60002）；protobuf 版本选 3.15.4（最后一个支持老式 descriptor 构造 API 的纯 py2.py3 wheel 线；3.0.0 的运行时 containers.py 用 collections.MutableMapping 在 py3.10+ 崩；4.x+ 删除老 API）"
    reason: "老 py2 protobuf 生态包（trezor/keepkey 家族）py3 迁移方法论"
  - category: L2
    content: "C 扩展 Python 依赖不可用（OHOS 无签名 wheel 不可 dlopen）时的纯 Python shim 替代模式：分析消费面（libagent.formats 只用 ed25519.VerifyingKey/SigningKey/BadSignatureError/keys 四个入口）→ 写 API 兼容 shim 模块，数学后端选纯 Python 实现（pure25519）→ RFC 8032 官方测试向量验证正确性（pubkey/sig/verify/篡改拒绝全对）后随包 vendor 分发"
    reason: "C 扩展依赖的替代闭环方法论（比豁免更强的完整性）"
  - category: L3
    content: "keepkey-agent 0.9.0 是 4 行代码壳包（ssh_agent = lambda: libagent.ssh.main(keepkey.KeepKey)），实体全在 libagent 0.9.0 + keepkey 0.7.3；上游无测试（sdist 1352B 无 tests/；keepkey 0.7.3 的 34 个测试全依赖真实 KeepKey USB 设备——tests/common.py setUp 直接构造 HidTransport 枚举真设备）；USB HID 传输层（import hid）按需导入不阻塞入口链"
    reason: "本版本形态与测试豁免口径记录"
