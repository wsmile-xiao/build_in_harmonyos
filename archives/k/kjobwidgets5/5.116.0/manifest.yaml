# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "KF5 依赖必须与 qtbase 同链（qt5-qtbase/5.15.2.2 含 Qt5Widgets/Qt5DBus/Qt5Test），5.15.2 是无 Widgets 的桩，无法满足 find_package(Qt5 ... Widgets)。knowledge_ref: knowledge/drafts/E429-draft-AC34.kv"
  - "上游 CMAKE_SYSTEM_NAME=HarmonyOS 时 CMake 不定义 UNIX，ECM 的 POSIX 标志/RPATH 处理与 ctest 注册（if(NOT CMAKE_CROSSCOMPILING)）全部失效；强制 Linux 平台恢复原生构建。knowledge_ref: knowledge/doc/E537.md"
  - "OHOS CMake 平台模块未定义 soname 链接标志 → .so 无 DT_SONAME（E537）；CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE + -Wl,-soname, + CMAKE_BUILD_WITH_INSTALL_RPATH=ON 三件套修复。knowledge_ref: knowledge/doc/E537.md"
  - "ecm_install_po_files_as_qm(poqm) 需要 Qt5LinguistTools（lconvert/lrelease），qt5-qtbase 不含 → KF_SKIP_PO_PROCESSING=ON 或补丁注释掉。knowledge_ref: knowledge/doc/E438.md"
  - "kjobwidgets 上游无自动化测试：autotests/ 仅空模板，tests/ 的 2 个程序是进入 exec() 的交互式 GUI 演示且未被 ctest 注册（ecm_mark_as_test 不调用 add_test）。knowledge_ref: knowledge/doc/E298.md"
  - "KJobWidgets 的 X11 集成依赖可选的 find_package(X11)；OHOS 无 X11 头也无窗口系统 → WITH_X11=OFF，QX11Info 分支编译剔除。knowledge_ref: knowledge/doc/E383.md"
  - "沙箱加载器不解析 LD_LIBRARY_PATH 且拒绝执行用户路径 ELF，test_package 需备链接级 R34 兜底校验。knowledge_ref: knowledge/doc/E540.md"

