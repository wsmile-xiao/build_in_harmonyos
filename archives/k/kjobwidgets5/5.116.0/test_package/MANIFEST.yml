# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kjobwidgets5/5.116.0
homepage: "https://invent.kde.org/frameworks/kjobwidgets"

# 上游测试命令: BUILD_TESTING=ON 时注册的 ctest 套件
# 实测注册数 = 0（见 notes.md「上游测试（R51 三步法）」）:
#   - autotests/CMakeLists.txt 仅有被注释掉的 TODO 模板，无测试源
#   - tests/CMakeLists.txt 用 add_executable + ecm_mark_as_test 构建 2 个
#     交互式 GUI 程序，ecm_mark_as_test() 不调用 add_test()，
#     实测 `ctest -N` 输出 "Total Tests: 0"
# 因套件为空，build() 内不嵌入 ctest —— 空套件 rc=0 会制造 L1 假痕迹
upstream_check_command: "ctest --test-dir <build_folder> -N"
upstream_test_in_build: false
upstream_test_command: "cmake -DBUILD_TESTING=ON ... && cmake --build ."

# 上游测试程序 (tests/ 目录，均未注册 ctest；本 worker 沙箱无法执行，未取得运行证据，见 notes.md/reports/test-report.md)
upstream_tests:
  - file: tests/kjobtrackerstest.cpp
    source: kjobwidgets-5.116.0/tests/kjobtrackerstest.cpp
    description: "交互式 GUI 演示：KWidgetJobTracker + KStatusBarJobTracker + KUiServerJobTracker 追踪一个模拟 KJob，进入 QApplication::exec() 且无退出路径、无断言"
    command: "./kjobtrackerstest"
  - file: tests/kjobcreator.cpp
    source: kjobwidgets-5.116.0/tests/kjobcreator.cpp
    description: "交互式 GUI 演示：KJobCreator 对话框驱动 KJob 进度/错误状态，进入 QApplication::exec() 且无退出路径、无断言"
    command: "./kjobcreator"

# test_package 中自带的测试 (消费者视角验证, R34 实质 API 调用)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 链接 KF5::JobWidgets，实际调用 KJobWidgets::setWindow/window、KJobWindows::window、KWidgetJobTracker::registerJob/widget/unregisterJob、KStatusBarJobTracker::widget、KDialogJobUiDelegate，并断言 OHOS offscreen QPA 与已安装库的 ELF 适配属性"
    command: "./test_kjobwidgets5"

# 测试断言总数 (test_package/test.cpp 的 check() 调用数，见 reports/test-report.md)
assertion_count: 16
