# conandata.yml — klibc-run-init 2.0.14
# 源码：kernel.org 官方发布归档 klibc-2.0.14.tar.xz（2025-03-04）。
# 与父配方 archives/k/klibc/2.0.14 复用完全相同的源码归档（URL+SHA256 一致，三镜像为 kernel.org 官方镜像）。
# 本配方只构建 usr/kinit/run-init 子工具（run-init），不打包 libc 本体。
# 许可证：run-init 源码为 MIT（H. Peter Anvin）；静态链接 klibc libc（BSD/MIT + Linux 内核派生 GPL-2.0）。

sources:
  url:
    - "https://mirrors.edge.kernel.org/pub/linux/libs/klibc/2.0/klibc-2.0.14.tar.xz"
    - "https://cdn.kernel.org/pub/linux/libs/klibc/2.0/klibc-2.0.14.tar.xz"
    - "https://www.kernel.org/pub/linux/libs/klibc/2.0/klibc-2.0.14.tar.xz"
  sha256: "281bfb683e196818412af70b8968b7726475a80ff1c4bd67119e6bf5059f9075"

patches:
  "2.0.14":
    - patch_file: "patches/0001-usr-include-ohos-asm-layout.patch"
      patch_description: "usr/include/Kbuild：asm 头由 ln -fsn 符号链接改为 cp -rf 复制（规避 HMDFS 符号链接限制、物化 asm 头），并用 KLIBCASMDIR 变量支持 OHOS 的 asm 头布局（aarch64-linux-ohos/asm）。与父配方同源复用"
      patch_type: "portability"
    - patch_file: "patches/0002-signal-kernel-nsig-compat.patch"
      patch_description: "usr/include/signal.h：OHOS 内核头用 _KERNEL__NSIG 而非标准 Linux 的 _NSIG，加映射使 sys_siglist/sys_sigabbrev 能解析 _NSIG。与父配方同源复用"
      patch_type: "portability"
    - patch_file: "patches/0003-kbuild-sharedlib-cp-not-ln.patch"
      patch_description: "usr/klibc/Kbuild：共享库 soname 由 ln 硬链接改为 cp 复制（HMDFS 不支持硬链接，见知识库 E079）。与父配方同源复用"
      patch_type: "portability"
    - patch_file: "patches/0004-kbuild-libc-kinit-only.patch"
      patch_description: "顶层 Kbuild：all 目标只构建 scripts/basic + usr/klibc + usr/kinit（跳过 usr/dash、usr/utils、usr/gzip）。父配方 0004 的变体：保留 usr/kinit 以构建 run-init，连带编译 kinit/ipconfig/nfsmount/fstype/resume 闭包（klibc+UAPI 纯 C）"
      patch_type: "portability"
