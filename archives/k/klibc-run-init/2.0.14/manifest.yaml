knowledge_gained:
  - "klibc-run-init 与父配方 archives/k/klibc/2.0.14 完全同源（相同 tarball URL+SHA256），是子工具配方先例（参考 archives/k/kbd-vlock/2.8.0）：父配方负责 libc 本体，子工具配方只构建并打包一个 kbuild 子目录工具"
  - "父配方 patch 0004 把 usr/kinit 从 all 目标剔除；本配方 0004 变体保留 usr/kinit 仅剔除 usr/dash、usr/utils、usr/gzip，复用父配方 0001/0002/0003 即可完成 usr/kinit 闭包构建"
  - "usr/kinit 闭包（kinit/ipconfig/nfsmount/fstype/resume/run-init）为 klibc+UAPI 纯 C，在 OHOS 上可直接构建；run-init 静态版链接 ../lib.a 自包含，适合放进 initramfs"
  - "run-init 无上游专属测试（usr/klibc/tests 属父配方职责且已执行）；CI 层验证以负向 smoke（无参调用 usage 加退出码 1）为门禁，真实删根/MS_MOVE/chroot 与 -n dry-run（仍会 chroot）在 CI 禁止执行"
  - "OHOS ELF 需 .codesign 签名（E077）：package() 内 llvm-objcopy 清除旧签名段后 binary-sign-tool -selfSign 1 签名并恢复执行权限"
  - "真机权威 CI 通过（2026-09-22 r3）：L0 pass、L1 pass（test_package 真实执行，ELF+codesign 校验与负向 usage smoke 通过）、L2 skip（无 --version/--help，非阻塞）、L4 pass、L5 pass；Build Summary Success 1 / Failed 0"