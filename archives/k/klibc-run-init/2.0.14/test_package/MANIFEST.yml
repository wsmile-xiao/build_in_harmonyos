# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: klibc-run-init/2.0.14
homepage: "https://www.kernel.org/pub/linux/libs/klibc/"

# 上游测试核查结论（NO_UPSTREAM_TESTS，EVIDENCE_COMPLETE）：
# klibc 2.0.14 源码树中不存在 run-init 专属测试：
#   - usr/kinit/run-init/ 仅含 Kbuild、run-init.c、run-init.h、runinitlib.c，无任何测试文件
#   - usr/kinit/Kbuild 与顶层 Makefile/Kbuild 均无 run-init 测试目标；
#     顶层唯一 test 目标调用 $(klibc)=usr/klibc/tests，属父配方
#     archives/k/klibc/2.0.14 职责且已在父配方 CI 执行（37/39 passed）
#   - usr/kinit 下唯一含 test 字样的文件 nfsmount/dummypmap_test.c 是 nfsmount 的
#     源码（stub portmap 服务器），不是测试套件
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_notes: "run-init 无上游专属测试；klibc 全局测试套件 usr/klibc/tests 属父配方职责（父配方已执行，37/39 passed）。本包验证以 test_package 负向 smoke（无参调用期望 usage 加退出码 1，同时覆盖 E077 签名可执行性）为准；真实删根/MS_MOVE/chroot 路径需 root 加 PID-1 上下文，-n dry-run 仍会 chroot，均在 CI 中禁止执行。"

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "负向 smoke：无参调用 run-init 期望 stderr 打印 Usage 并以退出码 1 结束（未签名 ELF 会被内核拒绝 exec 而得到非 1 退出码，同时覆盖 E077 可执行性）"
    command: "bash test.sh 带包内 bin/run-init 绝对路径参数"
  - file: conanfile.py
    description: "包产物校验：bin/run-init 存在、为 ELF（0x7F-ELF 魔数）且带 OHOS .codesign 签名段（E077）"
    command: "build() 内读取包内 run-init 校验魔数与 .codesign 段"

# 测试断言总数（可执行性 1 加退出码 1 加 usage 输出 1）
assertion_count: 3
