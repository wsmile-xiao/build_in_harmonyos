software: kubeaudit
build_system: custom
version: "0.22.2"
status: built
build_date: "2026-09-23"

source:
  url: "https://github.com/Shopify/kubeaudit/archive/refs/tags/v0.22.2.tar.gz"
  sha256: "90752d42c4d502ab6776af3358ae87a02d2893fc2bb7a0364d6c1fdcd8ff0570"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOFLAGS=-mod=mod"
    - "GOTOOLCHAIN=local"
    - "GOPROXY=https://goproxy.cn,direct"
    - "LDFLAGS=-s -w -X github.com/Shopify/kubeaudit/cmd.Version=v0.22.2"
  dependencies:
    - "go/1.24.0"
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Go项目使用 go build 编译，无 configure/make 流程；绕开上游 Makefile（$(error go<1.22.1) 且 ldflags.sh 依赖 git）"
  - "上游无 vendor/ 目录，构建期需 -mod=mod + GOPROXY(goproxy.cn) 拉取模块闭包（与 kubeconform 的最大 delta）"
  - "版本输出来自 go:embed cmd/commands/VERSION；ldflags.sh 的 -X cmd.Version/Commit/BuildDate 目标在上游代码中已不存在，为 Makefile 对齐仍按固定值注入"
  - "上游测试 37 个 _test.go、21 个包、64 个顶层 Test 函数；MANIFEST_MODE 走本地 YAML fixture 完全离线，LOCAL_MODE 需 kubectl+kind 且 USE_KIND!=true 时静默跳过"
  - "HMDFS 上 go 链接输出放 go-workspace/link-out 单遍成型后拷贝，测试 ELF 按 E318 编译-签名-回源码目录运行"
