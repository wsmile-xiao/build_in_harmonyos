software: kubeaudit
display: "kubeaudit"
description: "A Kubernetes security auditor that checks clusters and manifests against security best practices"
category: network
homepage: "https://github.com/Shopify/kubeaudit"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 项目，CGO_ENABLED=0 静态编译，无 C 依赖，无 musl 耦合"
    - "上游无 vendor 目录，构建期 -mod=mod + GOPROXY(goproxy.cn) 拉取模块（GOTOOLCHAIN=local 防工具链自动下载）"
    - "版本输出为 go:embed cmd/commands/VERSION；-ldflags 按上游 Makefile 口径注入固定 Version/Commit/BuildDate"
    - "OHOS 上 GOOS=linux，产物与 go test 编译出的 .test ELF 均需 binary-sign-tool 自签名"
    - "Go 工作目录（GOCACHE/GOMODCACHE/链接输出）路由到 OHOS go-workspace，规避 HMDFS mmap 链接限制（E124/E134/E166/E318）"
  common_dependencies:
    - "go/1.24.0"

versions:
  "0.22.2":
    status: built
    build_date: "2026-09-23"
