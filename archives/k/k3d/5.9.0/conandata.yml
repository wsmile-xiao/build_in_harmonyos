# conandata.yml — k3d 5.9.0
# Source: https://github.com/k3d-io/k3d (tag v5.9.0)
# conanfile.py reads self.conan_data["sources"] and self.conan_data["go_toolchain"].

sources:
  # k3d 5.9.0 ships a Go workspace root module github.com/k3d-io/k3d/v5 with a
  # committed vendor/ tree (Makefile GOFLAGS=-mod=vendor).  Ordered URL list:
  # gh-proxy mirror first, official GitHub last (matches repo convention).
  url:
    - "https://gh-proxy.com/https://github.com/k3d-io/k3d/archive/refs/tags/v5.9.0.tar.gz"
    - "https://github.com/k3d-io/k3d/archive/refs/tags/v5.9.0.tar.gz"
  sha256: "969cce82c4871bb829be798655abe2b6709b77cc0f42f7ff69293c621dfbbab0"

# Go toolchain bootstrap when the device has no go / only an old go.
# k3d go.mod declares `go 1.26.3` and go.work `go 1.26.3`, so we pin the
# exact go1.26.3 toolchain (GOTOOLCHAIN=local).  sha256 are the official
# go.dev distribution hashes (go1.26.3, released 2026-05-07); aliyun mirrors
# serve byte-identical official tarballs (vibecheck/1.7.7 precedent).
go_toolchain:
  version: "1.26.3"
  linux-amd64:
    url: "https://mirrors.aliyun.com/golang/go1.26.3.linux-amd64.tar.gz"
    sha256: "2b2cfc7148493da5e73981bffbf3353af381d5f93e789c82c79aff64962eb556"
    filename: "go1.26.3.linux-amd64.tar.gz"
  linux-arm64:
    url: "https://mirrors.aliyun.com/golang/go1.26.3.linux-arm64.tar.gz"
    sha256: "9d89a3ea57d141c2b22d70083f2c8459ba3890f2d9e818e7e933b75614936565"
    filename: "go1.26.3.linux-arm64.tar.gz"

# k3d is a pure-Go CLI (CGO_ENABLED=0, static binary) using committed vendor/;
# no source portability patches are required on HarmonyOS.
patches: []
