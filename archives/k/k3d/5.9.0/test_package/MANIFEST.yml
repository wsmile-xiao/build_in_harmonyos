# test_package/MANIFEST.yml
# 上游官方测试声明文件 + HMBS 测试计数声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: k3d/5.9.0
homepage: "https://github.com/k3d-io/k3d"

# ── 上游测试审计（守则「上游测试套件执行」）──────────────────────────
# k3d 5.9.0 是纯 Go CLI（go.mod / go.work 均要求 go 1.26.3），源码仓库自带
# vendor/（上游 Makefile GOFLAGS=-mod=vendor）。官方单元测试通过
# `go test -v ./...` 运行（根模块，go.work workspace 模式）。统计口径 =
# go test 函数计数（go_test_functions）：`go test -v` 对每个顶层 `TestXxx`
# 各输出一行 `--- PASS/FAIL/SKIP: TestXxx`（子测试前导空格被忽略）。
# 已逐一核点 13 个 *_test.go 中的 `^func Test` 声明（总数 23）：
#   cmd/util/ports_test.go                :  1  Test_ParsePortExposureSpec_PortMatchEnforcement
#   pkg/client/registry_test.go           :  1  TestRegistryGenerateLocalRegistryHostingConfigMapYAML
#   pkg/client/tools_test.go              :  2  Test_findRuntimeImage, Test_findImages
#   pkg/config/config_test.go             :  5  TestRead{Simple,Cluster,ClusterList,Unknown,SimpleConfigRegistries}Config
#   pkg/config/jsonschema_test.go         :  2  TestValidateSchema, TestValidateSchemaFail
#   pkg/config/merge_test.go              :  1  TestMergeSimpleConfig
#   pkg/config/migrate_test.go            :  1  TestMigrate
#   pkg/config/process_test.go            :  1  TestProcessClusterConfig
#   pkg/config/transform_test.go          :  3  TestTransform{SimpleConfigToClusterConfig,EmptyRegistryCreateIsNil,RegistryUseOnlyConfig}
#   pkg/config/validate_test.go           :  1  TestValidateClusterConfig
#   pkg/runtimes/docker/translate_test.go :  1  TestTranslateNodeToContainer
#   pkg/util/yaml_test.go                 :  2  TestSplitYAML, TestYAMLEncoder
#   version/version_test.go               :  2  TestGetK3sVersion, TestFetchLatestK3sVersion
#   合计 = 23
#
# 其中 TestGetK3sVersion（version/version_test.go）是唯一依赖真机外网的上游
# 用例：它以非空 channel 调用 GetK3sVersion("v1.20")，会实时访问 k3s 的
# channel server（https://update.k3s.io/v1-release/channels/stable）拉取最新
# 版本号并与正则比对。该测试不依赖 OHOS 特定能力，但要求设备具备到
# update.k3s.io 的出网。若真机沙箱无法出网，它会如实 FAIL（t.Fatal），由
# 标记的 failed/gaps 承载，绝不伪造通过（不给它打桩/删断言）。其余 22 个
# 均为自包含纯逻辑单元测试（config/yaml/translate/registry/ports/tools 等，
# Test_findImages 仅需可写 TMPDIR，translate/registry 的 Docker 常量不建立
# 真实 docker 连接），可在真机真实执行。
#
# 统计口径（upstream_test_total=23）：go test 函数计数（全模块出现次数）。
upstream_test_total: 23
upstream_test_count_method: go_test_functions

# 上游测试命令（用于测试执行分析）
upstream_check_command: "go test -v -mod=vendor ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "go test -v -mod=vendor ./... (k3d go.work workspace, root module)"

# 上游实际运行的测试程序（包级组织，函数级见 upstream_test_audit）
upstream_tests:
  - file: cmd/util/ports_test.go
    source: k3d-5.9.0/cmd/util/ports_test.go
    description: "端口暴露规格解析与端口匹配校验 (1 个 Test*)"
    command: "go test -v ./cmd/util/"
  - file: pkg/client/tools_test.go
    source: k3d-5.9.0/pkg/client/tools_test.go
    description: "运行时镜像查找/image 导出 tar 查找 (2 个 Test*)"
    command: "go test -v ./pkg/client/"
  - file: pkg/client/registry_test.go
    source: k3d-5.9.0/pkg/client/registry_test.go
    description: "本地 registry ConfigMap YAML 生成 (1 个 Test*)"
    command: "go test -v ./pkg/client/"
  - file: pkg/config
    source: k3d-5.9.0/pkg/config
    description: "config 读/校验/merge/transform/process/migrate/jsonschema (14 个 Test*)"
    command: "go test -v ./pkg/config/"
  - file: pkg/runtimes/docker/translate_test.go
    source: k3d-5.9.0/pkg/runtimes/docker/translate_test.go
    description: "Node->Container 翻译纯逻辑 (1 个 Test*)"
    command: "go test -v ./pkg/runtimes/docker/"
  - file: pkg/util/yaml_test.go
    source: k3d-5.9.0/pkg/util/yaml_test.go
    description: "YAML split/encoder 工具 (2 个 Test*)"
    command: "go test -v ./pkg/util/"
  - file: version/version_test.go
    source: k3d-5.9.0/version/version_test.go
    description: "k3s 版本获取 (TestGetK3sVersion 依赖外网) + mock 版本抓取 (2 个 Test*)"
    command: "go test -v ./version/"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "冒烟测试: k3d version 断言 v5.9.0 + k3d --help 正常退出"
    command: "sh test.sh <bin/k3d>"

# 测试断言总数（test_package 冒烟 2 条）
assertion_count: 2
