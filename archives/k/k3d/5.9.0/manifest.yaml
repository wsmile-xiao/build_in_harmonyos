software: k3d
# 版本级 manifest —— k3d 5.9.0
# 遵循 ARCHIVE-SPEC v2.0

version: "5.9.0"

# 编译状态（published | built | failed | archived）
# 当前为已写入配方的初始工作树状态，等待 hmbs 真机预检确认。
# hmbs 预检 conan-create 沙盒只注入 cmake/make/ninja/python3，不注入 Go；若
# 真机无 go（或仅有旧于 1.26 的 go），配方自动从 aliyun Go 镜像 bootstrap
# go1.26.3 工具链（sha256 核对官方 go.dev 哈希，ELF 全部签名，vibecheck/1.7.7
# 先例），再真实运行上游 `go test -v -mod=vendor ./...`，因此上游 23 个
# Test* 会真正执行。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"

# 构建系统类型
build_system: go

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方上游 GitHub release tarball
  url: "https://github.com/k3d-io/k3d/archive/refs/tags/v5.9.0.tar.gz"
  sha256: "969cce82c4871bb829be798655abe2b6709b77cc0f42f7ff69293c621dfbbab0"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（cmake|autotools|makefile|meson|cargo|custom|go）
  system: go

  # 配置选项列表
  configure_options:
    - "build_system=go"
    - "CGO_ENABLED=0"
    - "GOFLAGS=-mod=vendor"
    - "go.work workspace mode (root module github.com/k3d-io/k3d/v5)"
    - "runtime toolchain: go1.26.3 (go.mod & go.work 要求，GOTOOLCHAIN=local)"

  # 编译依赖列表 —— Go 模块依赖全部由仓库 vendor/ 承载（-mod=vendor，离线），无 conan 依赖
  dependencies: []

  # 编译器（Go 工具链，非 clang）
  cc: go
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 上游测试审计（守则「上游测试套件执行」）
# ============================================================

upstream_tests_exist: true
upstream_tests_executable: true
upstream_test_total: 23
upstream_test_count_method: go_test_functions
upstream_test_audit: |
  k3d 5.9.0 是纯 Go CLI（go.mod / go.work 均要求 go 1.26.3），源码仓库自带
  vendor/（上游 Makefile GOFLAGS=-mod=vendor，构建完全离线）。上游官方测试
  经 `go test -v ./...`（根模块，go.work workspace 模式）。源码审计确认共
  23 个顶层 Test* 函数，分布 13 个 *_test.go / 7 个包：
    cmd/util/ports_test.go(1) pkg/client/tools_test.go(2)
    pkg/client/registry_test.go(1) pkg/config/*(14: config 5 + jsonschema 2 +
    merge 1 + migrate 1 + process 1 + transform 3 + validate 1)
    pkg/runtimes/docker/translate_test.go(1) pkg/util/yaml_test.go(2)
    version/version_test.go(2)
  合计 23。统计口径 = go test 函数计数（全模块 Test* 出现次数，与 go test -v
  输出的顶层 `--- (PASS|FAIL|SKIP): TestXxx` 行一一对应；本模块无跨包同名
  Test，故等于去重函数名数）。本模块无同名冲突，计数确定。

  {TestGetK3sVersion 网络依赖} version/version_test.go 的 TestGetK3sVersion 是
  唯一依赖真机外网的上游用例：以非空 channel 调用 GetK3sVersion("v1.20")，
  实时访问 k3s channel server（https://update.k3s.io/v1-release/channels/stable）
  拉取最新版本号并与 v1.20.* 正则比对。它不依赖 OHOS 特有能力，但要求设备出网
  到 update.k3s.io。若真机沙箱无法出网，它会如实 FAIL（t.Fatal），由标记的
  failed/gaps 承载；不给它打桩/删断言。内容其余 22 个均为自包含纯逻辑单元测试
  （config/yaml/translate/registry/ports/tools；Test_findImages 仅需可写
  TMPDIR，translate/registry 中的 Docker 常量不建立真实 docker 连接）。

  上游测试在 hmbs 预检沙盒中真实执行：配方先探测设备 go（which / HNP_GO /
  HNP_GOROOT / find），若缺失或旧于 1.26，自动从 aliyun Go 镜像 bootstrap
  go1.26.3（sha256 核对官方 go.dev 哈希，go/bin 与 go/pkg/tool 下全部 ELF 用
  binary-sign-tool 签名，vibecheck/1.7.7 先例）。build() 内先跑
  `go test -v -mod=vendor ./...`（-p 1，OHOS 下用 -exec 包装器先签名再执行测试
  二进制），再 `go build -mod=vendor` 产出 k3d CLI。test_package/ 冒烟 2 条
  （k3d version 断言 v5.9.0 + --help），产出 HMBS_TEST_PACKAGE_RESULT。

  test_result 的 23 个上游用例与 test_package 2 条的真实通过/未运行计数一律以
  真机预检日志为准，本 manifest 不预填、不猜测。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Go binary CLI 构建系统：k3d 用 go.work workspace + 自带 vendor/，构建命令 go build -mod=vendor -trimpath -o k3d .（根模块 main.go），无 configure 步骤"
  - "go.mod/go.work 要求 go 1.26.3：设备 go 缺失或过旧时须 bootstrap 精确 go1.26.3（GOTOOLCHAIN=local），不能降级"
  - "k3d 依赖极其庞大（k8s client-go / docker SDK / gRPC / OpenTelemetry），但全部经 vendor/ 离线承载，-mod=vendor 使构建与测试均不依赖 GOPROXY 拉取"
  - "go.work workspace 模式：vendor/modules.txt 含 tools/docgen 子模块依赖，必须在 workspace 模式（不设 GOWORK=off）下编译，否则报 inconsistent vendoring"
  - "Go 静态链接：CGO_ENABLED=0 生成静态二进制，无需 RPATH；ldflags 注入 version.Version=v5.9.0 使 k3d version 输出正式版本号"
  - "hmbs 预检 conan-create 沙盒只注入 cmake/make/ninja/python3，不注入 go（与 vibecheck/addchain 先例一致）"
  - "OHOS 下运行 go test：用 -exec 包装器对每个测试二进制先签名再执行，否则 OHOS 执行策略 EACCES"
  - "Go linker 在 hmdfs 上 mmap 输出失败：链接输出目录放非 hmdfs work root（/data/storage/el2/base/cache 下 conan-go-build/k3d-5.9.0/link-out）后再拷贝到 build_folder"

notes:
  - "源码 tarball: github.com/k3d-io/k3d/archive/refs/tags/v5.9.0.tar.gz, sha256 969cce82..."
  - "源码镜像：conandata url 有序列表 gh-proxy.com 前缀镜像置前，官方 GitHub 置后（规则 3.18b）"
  - "Go 工具链 conandata.go_toolchain：linux-arm64 用 aliyun go1.26.3（sha256 9d89a3ea... 官方 go.dev 哈希）；linux-amd64 2b2cfc71..."
  - "上游测试共 23 个 Test*，go test 函数计数；唯一外网用例 TestGetK3sVersion 可能因沙箱无出网 FAIL，如实上报"
  - "OHOS /tmp 只读，GOCACHE/GOMODCACHE/TMPDIR 指向 go work root（/data/storage/el2/base/cache 下 conan-go-build/k3d-5.9.0），链接输出也放该 root 的 link-out/"
