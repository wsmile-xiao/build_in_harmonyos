# 软件级 manifest —— k3d
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: k3d

# 显示名
display: "k3d"

# 一句话描述
description: "k3d 在 Docker 中运行 k3s 的轻量级 Kubernetes 开发集群命令行工具"

# 分类标签（utility / build-tool）
category: utility

# 官网 URL
homepage: "https://k3d.io"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: go

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "纯 Go CLI（github.com/k3d-io/k3d/v5），go.work workspace + 自带 vendor/，go.mod/go.work 要求 go 1.26.3"
    - "用 go build -mod=vendor + CGO_ENABLED=0 静态构建；依赖全部由仓库 vendor/ 离线承载（-mod=vendor），无需 GOPROXY 拉取"
    - "hmbs 预检 conan-create 沙盒只注入 cmake/make/ninja/python3，不注入 go——设备无 go 或过旧时自动从 aliyun Go 镜像 bootstrap go1.26.3 工具链并 ELF 签名（vibecheck/1.7.7 先例），再真实运行上游 go test"
    - "OHOS 下运行 go test 用 -exec 包装器先给测试二进制签名再执行，避免 OHOS 执行策略 EACCES"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "5.9.0":
    status: built
    build_date: "2026-09-29"
    conan_ref: "k3d/5.9.0"
