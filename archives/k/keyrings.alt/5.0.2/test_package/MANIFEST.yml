# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: keyrings.alt/5.0.2
homepage: "https://github.com/jaraco/keyrings.alt"

# Upstream test command
upstream_check_command: "python3 -m pytest tests/ -p no:cacheprovider -o addopts=''"

# conanfile.py build() method - upstream test integration
# 上游 pytest 套件在本地联网环境实跑（CI 离线跑不了，见 notes.md 上游测试节）
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs（上游 v5.0.2 sdist tests/ 目录 pytest 套件，
# 183 个用例：本地 OHOS 环境实跑 98 passed + 85 skipped（环境条件跳过）+ 0 failed，
# 测试依赖 pip 供给 keyring/jaraco/pycryptodome/pycryptodomex，见 notes.md 上游测试节）
upstream_tests:
  - file: tests/test_file.py
    source: keyrings.alt v5.0.2 sdist tests/test_file.py
    description: "文件型 keyring：Plaintext/Encrypted 后端读写/加密往返/scheme/version 校验"
    command: "python3 -m pytest tests/test_file.py -o addopts=''"
  - file: tests/test_crypto.py
    source: keyrings.alt v5.0.2 sdist tests/test_crypto.py
    description: "加密文件 keyring（getpass 桩替）：TestCryptedFileKeyring 21 用例"
    command: "python3 -m pytest tests/test_crypto.py -o addopts=''"
  - file: tests/test_multi.py
    source: keyrings.alt v5.0.2 sdist tests/test_multi.py
    description: "MultipartKeyringWrapper 分片密码包装器"
    command: "python3 -m pytest tests/test_multi.py -o addopts=''"
  - file: tests/test_keyczar.py
    source: keyrings.alt v5.0.2 sdist tests/test_keyczar.py
    description: "keyczar Crypter/EnvironCrypter（mocks.py 桩注入）"
    command: "python3 -m pytest tests/test_keyczar.py -o addopts=''"
  - file: tests/test_Gnome.py
    source: keyrings.alt v5.0.2 sdist tests/test_Gnome.py
    description: "GnomeKeyring 后端（需 GnomeKeyring 模块，OHOS 环境跳过）"
    command: "python3 -m pytest tests/test_Gnome.py -o addopts=''"
  - file: tests/test_Google.py
    source: keyrings.alt v5.0.2 sdist tests/test_Google.py
    description: "Google Docs keyring（需 gdata 模块，OHOS 环境跳过）"
    command: "python3 -m pytest tests/test_Google.py -o addopts=''"
  - file: tests/test_Windows.py
    source: keyrings.alt v5.0.2 sdist tests/test_Windows.py
    description: "Windows 注册表/win32 crypto 后端（需 Windows，OHOS 环境跳过）"
    command: "python3 -m pytest tests/test_Windows.py -o addopts=''"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test_keyrings_alt.py
    description: "包结构+import 冒烟+8 后端模块 find_spec 寻址+escape 往返+桩替 keyring/jaraco 后 PlaintextKeyring/MultipartKeyringWrapper/keyczar 真实功能往返+entry-points 元数据"
    command: "python3 test_keyrings_alt.py"
  - file: conanfile.py
    description: "Conan test_package entrypoint — runs test_keyrings_alt.py"

