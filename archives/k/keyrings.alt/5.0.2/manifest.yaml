software: keyrings.alt
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.0.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（PyPI sdist 官方发布物，多 URL fallback 同源同 sha256）
  url: "https://files.pythonhosted.org/packages/source/k/keyrings.alt/keyrings_alt-5.0.2.tar.gz"

  # 源码校验和
  sha256: "8f097ebe9dc8b185106502b8cdb066c926d2180e13b4689fd4771a3eab7d69fb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "pip install --target=install --no-deps"

  # 编译依赖列表（格式: name/version）
  # R36: jaraco.classes/jaraco.context/keyring 在制品仓无配方（L0i 门禁
  # 拦截未发布依赖声明），不声明——见 conanfile.py docstring 与 notes.md
  dependencies: []

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "keyrings.alt is a pure Python package (no C extension to compile)"
  - "Runtime deps per upstream pyproject: jaraco.classes + jaraco.context (NOT published in registry — cannot declare, aetos 2.0.0 precedent)"
  - "keyring itself is a test-extra dep of keyrings.alt AND a backend-module runtime import; archives/k/keyring/25.6.0 has only manual wheel records, no recipe — not declarable either"
  - "keyrings/alt/__init__.py is empty — import keyrings.alt is zero-dependency; backend modules import keyring/jaraco lazily on module load, not on package import"
  - "Built using pip install --target --no-deps (gitpython/3.1.57 precedent recipe pattern)"
  - "Upstream pytest suite: 183 collected, 98 passed / 85 skipped (env-conditional: Need Windows x21/GnomeKeyring x17/Google Docs gdata x32/RegistryKeyring x15) / 0 failed on local OHOS env with test deps pip-supplied (keyring 25.7.0 + jaraco + pycryptodome/pycryptodomex 3.23.0) — pass rate 98/183 = 53.6%"
  - "pycryptodome/pycryptodomex native .so loads fine from user dir on OHOS (2026-09-24 verified: earlier E212 'unsigned ELF dlopen denied' was caused by install location, not a platform limit) — 67 Encrypted/crypto cases all pass once supplied"
  - "HMDFS user paths: os.chmod is a no-op (E046-class: chmod 0o600 → stat 0o660, group_other=0o060) — upstream test_keyring_not_created_world_writable fails on HMDFS; TMPDIR must point to tmpfs (/data/storage/el2/base/cache) where chmod semantics are normal"
