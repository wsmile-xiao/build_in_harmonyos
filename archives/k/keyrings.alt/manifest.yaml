software: keyrings.alt
display: "keyrings.alt"
description: "Alternate keyring implementations (backends for the keyring package)"
category: development
homepage: "https://github.com/jaraco/keyrings.alt"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Pure Python package, no compilation required"
    - "Runtime deps jaraco.classes/jaraco.context and the keyring package itself have no registry recipes (R36) — requires stays empty (aetos 2.0.0 precedent)"
    - "keyrings/alt/__init__.py is empty — import keyrings.alt is zero-dependency; backend modules import keyring/jaraco lazily at module load"
    - "Built using pip install --target --no-deps (gitpython/3.1.57 precedent recipe pattern)"
    - "pycryptodomex native .so (PyPI wheel) cannot dlopen on OHOS — Encrypted backends unavailable, upstream skipif handles automatically"
  common_dependencies: []

versions:
  "5.0.2":
    status: built
    build_date: "2026-09-20"
