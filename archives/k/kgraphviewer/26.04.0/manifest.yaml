knowledge_gained:
  - "KF6::Parts/XmlGui/JobWidgets/ConfigWidgets that a KDE application
     needs but ohpcd only publishes on the 6.18 track (or not at all) can
     be vendored as one SHARED staging chain against the 6.26 line
     (E277); QObject frameworks must stay SHARED so qobject_cast/
     metaobject identity survives across .so boundaries."
  - "The qtbase package's Qt6Config.cmake resolves Qt component packages
     (Qt6Svg, Qt6Core5Compat, ...) only inside its own prefix; split
     conan Qt packages must be exposed via
     QT_ADDITIONAL_PACKAGES_PREFIX_PATH (Qt's official split-prefix
     mechanism, alligator/26.04.0 precedent) — CMAKE_PREFIX_PATH alone
     is not consulted for components."
  - "Published ohpcd KF6/Qt5Compat libraries ship without DT_SONAME, so
     CMake links them by absolute cache path and ld leaks that path into
     DT_NEEDED (E537). Fixed at generate time with a find_package hook
     injected through conan_cmakedeps_paths.cmake (included by the CI
     toolchain in every project of the build): each affected imported
     target's location is swapped for a private patchelf --set-soname
     proxy copy in the build dir — a link-time input only, never shipped
     (HMDFS refuses patchelf-rewritten .so at runtime). ld records only
     the soname basename; LD_LIBRARY_PATH resolves it to the real
     published library. Additionally: CMAKE_*_LINKER_FLAGS -L entries
     must be written unquoted — embedded quotes split the toolchain's
     set() into a CMake list and invalidate every -L entry."
  - "kparts 6.18.0 builds against KIOCORE_ONLY kio/6.26.0 once its PRIVATE
     KF6::KIOWidgets link is dropped: the sources only use KIOCore classes."
  - "Mixed KF6 track consumption via conan overrides is a dead end for
     application recipes: overriding any KF6 dep version invalidates the
     package_id of every published consumer-side package, and the forced
     rebuilds replay their recipes' in-build ctest suites which fail in
     the OHOS sandbox (r4: full KF6 rebuild; r5: kcolorscheme/6.18.0
     missing #include <QVariant>; r6: kconfigwidgets/6.18.0 7 ctest
     failures). Vendoring the unpublished/mixed-track frameworks with
     BUILD_TESTING=OFF is the reproducible alternative."
  - "kxmlgui 6.18.0 supports building without kglobalaccel
     (FORCE_DISABLE_KGLOBALACCEL=ON) and without DBus (USE_DBUS=OFF);
     kjobwidgets' KF6Notifications dependency is only used by
     KNotificationJobUiDelegate and can be patched out when unused."
  - "Device conan cache can hold corrupted entries (package registered in
     the cache DB with its folder missing: conan create crashes with
     FileNotFoundError in os.utime at install time); conan remove
     '<ref>:*' + rebuild fixes it (harfbuzz/14.2.0.1:1b5bfb05 case)."
