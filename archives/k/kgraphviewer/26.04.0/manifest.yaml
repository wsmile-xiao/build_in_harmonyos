feature_downgrades:
  - "No printing: the simple printing subsystem is compiled out because
     the published qtbase line is built with Qt6::PrintSupport disabled.
     DotGraphView::print/printPreview/pageSetup and hideToolsWindows
     remain as exported no-ops; the GUI actions are removed;
     KgvPageFormat::defaultFormat() defaults to DIN A4 (QPrinterInfo
     unavailable). Same treatment inside the vendored
     kxmlgui (KShortcutsEditor::printShortcuts no-op)."
  - "No D-Bus single-instance: the published qtbase/6.11.1 line is built
     with FEATURE_dbus=OFF and the OHOS sandbox has no session bus (kio/
     knotifications USE_DBUS=OFF platform precedent). The app starts a new
     window per invocation; the D-Bus adaptor/registration code is removed."
  - "KF6::Parts/XmlGui/JobWidgets/ConfigWidgets are vendored (6.18.0 built
     SHARED inside this package against the 6.26 line): kparts is not
     published on ohpcd, and kxmlgui/kconfigwidgets/kjobwidgets only exist
     on the 6.18 track while kio (hard kparts dependency) is only
     published at 6.26. kjobwidgets additionally drops its
     KF6Notifications dependency (KNotificationJobUiDelegate unused by
     kgraphviewer/kparts; knotifications is 6.18-track only). The vendored
     kparts drops the KUriFilter usage in
     NavigationExtension::pasteRequest (KUriFilter is not shipped by the
     KIOCORE_ONLY kio; pasted text is opened as a plain user-input URL,
     the same fallback upstream takes when no filter matches)."
