# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kgraphviewer/26.04.0.
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kgraphviewer/26.04.0
homepage: https://invent.kde.org/graphics/kgraphviewer

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# 上游测试在 build() 中未执行：上游 26.04.0 tarball 不含任何测试
# （完整 discovery 证据记录见 manifest.yaml 的 upstream_tests 段与 notes.md）
upstream_test_in_build: false
upstream_test_command: "none — upstream has no test suite (NO_UPSTREAM_TESTS)"

# 上游实际运行的测试
upstream_tests:
  - file: none
    source: none
    description: "NO_UPSTREAM_TESTS (discovery.status=EVIDENCE_COMPLETE): the
      26.04.0 tarball contains zero test files, no add_test/enable_testing/
      BUILD_TESTING in any CMakeLists.txt, .gitlab-ci.yml is a build-only
      template, and .kde-ci.yml's require-passing-tests declaration has no
      test targets to run."
    command: "none"
    condition: "not applicable"

# test_package 中自带的测试 (消费者视角验证 + 新增鸿蒙特有断言)
test_package_tests:
  - file: test_package/test_kgraphviewer.cpp
    description: "In-process consumer test (offscreen): loads the installed
      kgraphviewerpart KParts plugin via QPluginLoader and casts to
      KParts::ReadOnlyPart (vendored libKF6Parts.so.6 ABI), opens a .dot
      file and waits for the KParts completed() signal (full in-process DOT
      parse + graphviz layout via loadLibrarySync/InternalLibrary), then
      drives the graphviz C API directly (agread + gvLayout dot + plain
      render with GVBINDIR plugin config)."
    command: "conan create (test_package builds and runs test_kgraphviewer)"
  - file: test_package/test_kgraphviewer.cpp (OHOS adaptation assertions)
    description: "OHOS-specific ELF assertions via readelf on the installed
      package: libkgraphviewer.so.0 has a DT_SONAME (manual SONAME flag —
      CMake has no Platform/HarmonyOS module); no absolute or ../ DT_NEEDED
      entries in libkgraphviewer.so.0 / libKF6Parts.so.6 (relocatable
      linking, E537); libQt6PrintSupport absent from DT_NEEDED (printing
      subsystem compiled out on this baseline); libgvc.so present in
      DT_NEEDED (E447 FindGraphviz bridge actually linked); vendored
      libKF6Parts.so.6 and the part plugin shipped."
    command: "readelf -d (executed inside test_package test())"
  - file: test_package/conanfile.py (app smoke)
    description: "L2-style offscreen smoke: bin/kgraphviewer --version
      returns 0 with QT_QPA_PLATFORM=offscreen and the conan dependency
      closure on LD_LIBRARY_PATH."
    command: "conan create (test_package test() runs the app)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
