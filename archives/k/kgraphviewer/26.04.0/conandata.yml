# conandata.yml — kgraphviewer 26.04.0
# KDE release-service 26.04.0 source archive (download.kde.org, no official
# .sha256 sidecar; the hash below was verified against the fetched archive).
sources:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/kgraphviewer-26.04.0.tar.xz"
  sha256: "0c6c84b5a75c970eaaf4a5dfa6dd6c2afe4e31137c2547c78a0176c0833d3bfc"

patches:
  "26.04.0":
    - patch_file: "patches/0001-CMakeLists-drop-printsupport-dbus.patch"
      patch_description: "Drop Qt6 PrintSupport and DBus from the required find_package (published qtbase line has PrintSupport disabled and FEATURE_dbus=OFF)"
      patch_type: "portability"
    - patch_file: "patches/0002-cmake-FindGraphviz-version-macros.patch"
      patch_description: "FindGraphviz: fall back to GRAPHVIZ_VERSION(_STRING/_MAJOR/_MINOR/_PATCH) when PACKAGE_VERSION is absent (graphviz 13)"
      patch_type: "portability"
    - patch_file: "patches/0003-src-part-CMakeLists-drop-printing.patch"
      patch_description: "Compile out the simple printing subsystem sources/ui and the Qt6::PrintSupport link"
      patch_type: "portability"
    - patch_file: "patches/0004-src-part-dotgraphview-print-noop.patch"
      patch_description: "DotGraphView print/printPreview/pageSetup become exported no-ops (printing unavailable on OHOS)"
      patch_type: "portability"
    - patch_file: "patches/0005-src-part-kgraphviewer_part-no-print-actions.patch"
      patch_description: "Do not create the print/print preview/page setup GUI actions"
      patch_type: "portability"
    - patch_file: "patches/0006-src-part-kgraphviewer_part.rc-no-print-actions.patch"
      patch_description: "Remove print actions from the part's XMLGUI ui.rc definition"
      patch_type: "portability"
    - patch_file: "patches/0008-src-CMakeLists-drop-dbus-adaptor.patch"
      patch_description: "Do not generate the D-Bus adaptor for the app (no Qt D-Bus on this platform)"
      patch_type: "portability"
    - patch_file: "patches/0009-src-main-no-dbus-single-instance.patch"
      patch_description: "Replace the D-Bus single-instance startup flow with plain window startup"
      patch_type: "portability"
    - patch_file: "patches/0010-src-kgraphviewer-no-dbus-registration.patch"
      patch_description: "Drop the D-Bus service registration in KGraphViewerWindow"
      patch_type: "portability"
    - patch_file: "patches/0016-kgvpagelayout-no-printer-a4.patch"
      patch_description: "KgvPageFormat::defaultFormat() returns DIN A4 directly: QPrinterInfo (Qt6::PrintSupport) is unavailable on this platform"
      patch_type: "portability"
