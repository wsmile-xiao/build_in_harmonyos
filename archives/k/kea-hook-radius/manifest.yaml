software: kea-hook-radius
display: "ISC Kea RADIUS hook"
description: "RADIUS authentication/accounting hook plug-in (libdhcp_radius.so) for the ISC Kea DHCP servers, with its own standalone RADIUS client implementation"
category: network
homepage: "https://www.isc.org/kea/"
license: MPL-2.0
build_system: meson

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Meson 在 OHOS 上报告 system='harmonyos'，Kea 的平台白名单不含它：需归一化为 linux 才能选中 Linux 源码分支"
    - "OHOS sysroot 的 linux/socket.h 与 musl sys/socket.h 都定义 struct sockaddr_storage，包含 netlink 头时需 define-guard"
    - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core 需 BOOST_SP_NO_PTHREAD_SETCANCELSTATE"
    - "boost 必须固定 1.85.0（1.90/1.91 制品仓包缺 Kea 实际使用的头文件），且 meson 需 >= 1.10"
    - "OHOS 上 Python subprocess 不解析 PATH：meson 探测静态链接器时须给 ar/ranlib 绝对路径"
    - "RADIUS hook 自 2.6.0 起为 standalone 实现（自带 RADIUS 客户端与字典），无第三方 RADIUS 库依赖"
  common_dependencies:
    - boost
    - log4cplus
    - openssl

# 版本索引（所有已归档版本，含状态）
versions:
  "3.0.3":
    status: built
    build_date: "2026-09-19"
    conan_ref: "kea-hook-radius/3.0.3"
