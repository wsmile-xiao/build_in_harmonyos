  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================

artifacts:
  - "lib/kea/hooks/libdhcp_radius.so"
  - "lib/libkea-*.so* (hook 运行时依赖闭包，20 个 kea 库)"

# ============================================================
# 上游测试（build() 内真实执行）
# ============================================================

upstream_tests:
  command: "meson test -v -C <builddir> dhcp-radius-tests dhcp-radius-libloadtests"
  suites_run: 2
  # 源码宏口径 N=428：tests/*.cc 直接宏 395 + request_unittests.h（15 宏）经
  # async/sync 两处 include 实例化 30 + libloadtests 3；gtest 运行期对重名套件
  # 计数合并后报告 427 个运行条目（差 1 为计数合并，非用例缺失）
  source_macro_count: 428
  cases_run: 427
  cases_passed: 427
  cases_failed: 0
  cases_skipped: 0
  cases_unregistered: 0
  cases_unregistered_reason: "无未注册的已启用用例：本配置注册并执行 424 + 3 = 427 个；仅 1 个 DISABLED_ 前缀用例（gtest 显式禁用）与 #ifdef HAVE_MYSQL/HAVE_PGSQL 后端用例（后端已 disabled）不参与运行"
  environment_notes: >-
    ServerClassTest.getAddress 依赖真实 DNS（上游断言 does-not-exist.isc.org
    解析失败抛 BadValue）；本机 HarmonyOS 开发机存在 fake-IP 劫持（该域名被解析为
    198.18.0.39）时离线复跑会失败，属环境限制非适配缺陷。2026-09-22 conan create
    流程内实测（DNS 正常）427/427 全部通过。其余 423 用例不依赖外网，稳定通过。

# ============================================================
# 鸿蒙特有测试（test_package，2 个用例）
# ============================================================

ohos_specific_tests:
  count: 2
  entries:
    - "test_package/test_ohos_platform.c → test_ohos_platform（平台 ABI）"
    - "test_package/test_ohos_runtime.c → test_ohos_runtime（运行时闭包）"
  command: "./test_ohos_platform <so> && ./test_ohos_runtime <so>"
  checks:
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so）"
    - "OHOS 加载器 dlopen(RTLD_NOW|RTLD_LOCAL) 可解析插件及其 20 个 Kea 运行库"
    - "包内 20 个 Kea 运行时库（lib/libkea-*.so*）在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 成功"
    - "闭包驻留后 hook 仍可加载，load/unload 契约符号可在运行时解析"
  cases_run: 2
  cases_passed: 2
  cases_failed: 0

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson.build.patch"
  - "0002-src-lib-dhcp-iface_mgr_linux.cc.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Meson 报告 OHOS 为 system='harmonyos'，Kea 的 build_machine.system() 白名单不含它：需在顶层归一化为 linux 才会选中 Linux 源码分支（iface_mgr_linux.cc / pkt_filter_lpf.cc）"
  - "OHOS sysroot 的 linux/socket.h（bionic 派生）定义 struct sockaddr_storage，与 musl sys/socket.h 冲突：用 define-guard 重命名内核侧定义（__linux__ && !__GLIBC__ 守卫）"
  - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core sp_thread_sleep.hpp 依赖它：定义 BOOST_SP_NO_PTHREAD_SETCANCELSTATE（boost 官方逃生宏），否则 HAVE_GENERIC_TLS_METHOD 探针编译失败、meson.build:477 报 Boost TLS support broken"
  - "OHOS 上 CPython subprocess 走 posix_spawn，不按 PATH 解析可执行名：裸名 'llvm-ar' 执行报 ENOENT，即使 which 能找到——须在 MesonToolchain 注入绝对路径 ar/ranlib"
  - "Conan MesonToolchain 默认只设 pkg_config_path=generators_folder，需同时使用 PkgConfigDeps 生成依赖 .pc，meson 才能解析 boost/log4cplus/openssl/gtest"
  - "Meson 的 cpp.run() 特性探针在 native 构建下会真实执行，host 共享依赖（log4cplus）必须通过 LD_LIBRARY_PATH 在配置期可见（缺失时探针返回 127，上游 meson.build:824 报 Unknown variable 'log4cplus'）"
  - "制品仓 boost/1.85.0 无 libboost_system，需 meson >= 1.10 的 header-only 模块回退；meson 版本必须 >= 1.10"
  - "Kea hook 的打包单元是整棵源码树：libdhcp_radius.so 的 NEEDED 闭包含 20 个 libkea-* 运行库，须随包分发才能被 kea-dhcp4/6 加载"

