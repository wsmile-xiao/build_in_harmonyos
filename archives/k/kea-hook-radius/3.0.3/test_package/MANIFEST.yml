# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-radius/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的两个 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> dhcp-radius-tests dhcp-radius-libloadtests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-radius-tests dhcp-radius-libloadtests"

# 上游实际运行的测试程序（本次适配实测：424 + 3 = 427 个用例全部通过）
upstream_tests:
  - file: dhcp-radius-tests
    source: src/hooks/dhcp/radius/tests/
    description: >-
      radius hook 单元测试（RADIUS 报文编解码、属性/字典、client/server 交互、
      backend/host 查询、config 解析、同步/异步请求）；本次实测注册 424 个用例、
      19 个 gtest 套件，全部通过
    command: "./dhcp-radius-tests"
  - file: dhcp-radius-libload-tests
    source: src/hooks/dhcp/radius/libloadtests/
    description: >-
      3 个 gtest 用例（RadiusLibLoadTest.validLoad / invalidDaemonLoad / unknown），
      校验 libdhcp_radius.so 可被 Kea hook 框架加载/卸载
      （meson 注册的套件名 dhcp-radius-libloadtests）
    command: "./dhcp-radius-libload-tests"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_radius_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload 契约符号与 hook ABI 版本"
    command: "./test_radius_hook <package>/lib/kea/hooks/libdhcp_radius.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 libdhcp_radius.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc libc.so.6、
      链接 libc++_shared.so）并验证 OHOS 加载器可 dlopen(RTLD_NOW) 解析
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_radius.so"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 包内
      20 个 Kea 运行时库（lib/libkea-*.so*），校验完整 NEEDED 闭包可解析、
      闭包驻留后 hook 仍可加载且 load/unload 契约符号可解析
    command: "./test_ohos_runtime <package>/lib/kea/hooks/libdhcp_radius.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（本次适配实测：2 个，2/2 通过）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <so> && ./test_ohos_runtime <so>"
  result: "2/2 passed"

# 测试用例总数（本次实测执行的上游用例数：424 + 3）
assertion_count: 427
