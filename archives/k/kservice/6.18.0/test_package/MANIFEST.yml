version: 1
package: kservice/6.18.0
homepage: https://invent.kde.org/frameworks/kservice

tests:
  upstream:
    status: planned
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    source: "kservice-6.18.0/autotests/"
    expected:
      - ksycocatest
      - ksycoca_xdgdirstest
      - ksycocathreadtest
      - kservicetest
      - kapplicationtradertest
      - kmimeassociationstest
  package:
    status: planned
    source: test.cpp
    command: "ctest && ./test_kservice"
    description: "Constructs KService and verifies name/exec/icon accessors."

notes:
  - "tests/ helper executables are built by upstream as ecm_mark_as_test targets and are not registered CTest tests."
