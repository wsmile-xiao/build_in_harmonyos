knowledge_gained:
  - "kservice 6.18.0 requires Qt6Xml, KF6Config, KF6CoreAddons, KF6I18n, and ECM."
  - "KF6DocTools is optional; disabling its discovery keeps docs/tooling out of the baseline package."
  - "Python bindings are optional and require Shiboken/PySide, so they are disabled for the baseline build."
  - "Upstream CTest autotests are registered from autotests/, while tests/ contains manual ecm_mark_as_test helper executables."
  - "KService upstream sycoca tests need both shared-mime-info package XML for QMimeDatabase and per-type mime/*.xml entries for KBuildMimeTypeFactory."
  - "The current OHOS runner keeps a WriteOwner-only sycoca file readable and does not always advance sycoca mtime for the future-file test, so those two subtests are guarded with explicit skips in the package test environment."
