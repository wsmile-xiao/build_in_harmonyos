# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kservice/6.26.0.

package: kservice/6.26.0
homepage: https://invent.kde.org/frameworks/kservice

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kservice-6.26.0/autotests/
    description: "KService upstream CTest/autotests suite (ksycocatest, ksycoca_xdgdirstest, ksycocathreadtest, kservicetest, kapplicationtradertest, kmimeassociationstest)"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    condition: "run in the Conan build with BUILD_TESTING=ON"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke constructs a KService and verifies name/exec/icon accessors."
    command: "conan create (test_package builds and runs test_kservice)"

assertion_count: 1
