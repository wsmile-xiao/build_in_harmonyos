# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`，否则报 No rule to make target 'cfg-defs'"
  - "db_postgres 模块 Makefile 的 libpq 探测有三级：pkg-config libpq → `which pg_config` → LOCALBASE/SYSBASE 回退。构建机若存在系统 libpq 的 pkg-config 或 pg_config，会注入宿主路径 → 必须显式传 LIBPQ_BUILDER= 与 PGCFG=（make 命令行变量优先级高于 Makefile 内部赋值）钉死回退分支，并以 LOCALBASE 指向 conan 的 libpq 包目录"
  - "libpq/18.6.1 包同时提供 include/libpq-fe.h、lib/libpq.so.5.x 与 lib/pkgconfig/libpq.pc，`-lpq` 默认取动态库；db_postgres.so 的 NEEDED 即 libpq.so.5 + libc.so"
  - "OHOS/musl 加载器不做惰性绑定，且 kamailio 模块产物带 FLAGS_1=DF_1_NOW：独立 dlopen 该模块时，consumer 进程必须导出模块引用的全部 core 符号（db_use_table/db_do_init/db_do_init2/db_pool_*/_pkg_root/db_fld 等），否则报 Error relocating … symbol not found —— 这使 test_package 的 e2e 用例成为真正的平台加载契约验证"
  - "kamailio 源码包内自包含可跑的上游测试只有 utils/kamctl/dbtextdb/dbtextdb_test.py（3 个 unittest 用例）；其余 test/tests 内容都需要运行中的 kamailio 主程序"
