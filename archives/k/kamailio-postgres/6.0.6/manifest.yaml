# 版本级 manifest — kamailio-postgres 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

version: "6.0.6"
software: "kamailio-postgres"
status: built
build_date: "2026-10-10"
build_system: makefile                # kamailio 经典 Makefile 体系（非 autotools/cmake）
conan_ref: "kamailio-postgres/6.0.6@ohpcd/stable"

# ============================================================
# 源码信息
# ============================================================

source:
  # kamailio.org 官方发布端点（源码包含 db_postgres 模块与本包 R51 上游测试入口）
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  scope: "仅 db_postgres 模块（Alpine kamailio-postgres 子包口径：_mod_list_postgres=\"db_postgres\"），不编译 kamailio 主程序"
  configure_options:
    - "make cfg include_modules=db_postgres LOCALBASE=<libpq package_folder> LIBPQ_BUILDER= PGCFG=（生成 src/config.mak）"
    - "make modules modules=modules/db_postgres -j1 LOCALBASE=<libpq package_folder> LIBPQ_BUILDER= PGCFG="
  platform_vars: "CC=<clang> CPATH=<libpq>/include LIBRARY_PATH=<libpq>/lib；LIBPQ_BUILDER=/PGCFG= 为空以钉死 LOCALBASE 回退分支（防止宿主 pkg-config libpq / pg_config 被自动探测命中）"
  parallel_jobs: 1
  parallel_jobs_reason: "E525/E074：OHOS SELinux 禁止用户进程创建 FIFO，GNU make jobserver 靠 FIFO 传递令牌 → -j>1 有挂起/报错风险；与同族 kamailio-* 配方一致固定 -j1"
  modules:
    - db_postgres
  dependencies:
    - libpq/18.6.1
  cc: clang
  cxx: clang++

# ============================================================
# 上游测试（R51 三步法台账，完整清单见 notes.md 第四节）
# ============================================================
# 清点面 = 官方源码包内 test/、tests/ 目录文件数（4 个目录 / 17 个文件）
# 实测 = 其中唯一自包含、无需运行中 kamailio 实例的上游 unittest（3 个用例）已真实执行
upstream_tests:
  command: "python3 dbtextdb_test.py -v"
  source_path: "kamailio-6.0.6/utils/kamctl/dbtextdb/dbtextdb_test.py"
  test_count: 17
  executed_count: 3
  passed: 3
  failed: 0
  notes: "17 = 源码包内 test/tests 目录文件数（10 个 dbtextdb 用例数据 + janssonrpcc 3 + rtpproxy 3 + tm 1）。仅 dbtextdb_test.py 可自执行（3 个 unittest 用例，仅依赖 Python 标准库），已在 conanfile.py build() 末尾真实执行并 3/3 通过；其余 14 项逐项技术原因见 test_package/MANIFEST.yml 的 upstream_tests[].not_executed_reason。"

