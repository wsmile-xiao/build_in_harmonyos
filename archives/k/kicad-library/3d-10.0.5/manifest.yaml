version: "3d-10.0.5"
software: "kicad-library"
status: published
build_date: "2026-09-24"
build_system: cmake

source:
  url: "https://mirrors.ustc.edu.cn/ubuntu/pool/universe/k/kicad-packages3d/kicad-packages3d_10.0.5.orig.tar.xz"
  sha256: "318d41cfe816fc13686ec6964040c3de888b1f6ab357a3e9f98b119c7ba47e4c"
  tar_format: tar.xz

build:
  system: cmake
  configure_options: []
  dependencies: []
  cc: ""
  cxx: ""
  build_tools:
    - "CMake >= 3.10"

patches_applied: []

upstream_tests:
  status: unavailable
  reason: "上游 .gitlab-ci.yml 仅 include 外部 kicad-library-utils GitLab CI 模板，源码归档没有本地 CTest 测试套件。"

adapted_tests:
  test_package: "test_package/kicad_library_3d_probe.cpp"
  assertions:
    - "105 个 .3dshapes 目录完整安装"
    - "7245 个 .step 文件完整安装"
    - "每个 .3dshapes 目录至少包含 1 个 .step 模型"
    - "代表性 STEP 模型头部可解析（ISO-10303-21 / FILE_SCHEMA / END-ISO-10303-21）"
    - "截断的 STEP 输入被拒绝"
    - "OHOS 构建要求 __OHOS__ 运行时断言"

license: "CC-BY-SA-4.0"
homepage: "https://gitlab.com/kicad/libraries/kicad-packages3D"
description: "Official KiCad 3D model libraries; data/resource package without C/C++ artifacts"
