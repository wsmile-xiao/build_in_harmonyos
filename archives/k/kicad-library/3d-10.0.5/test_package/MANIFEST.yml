schema_version: 1
package: k/kicad-library/3d-10.0.5
test_package:
  type: consumer
  executable: kicad_library_3d_probe
  language: cxx17
  assertions:
    - installed tree contains exactly 105 .3dshapes directories
    - installed tree contains exactly 7245 .step model files
    - every .3dshapes directory contains at least one .step model
    - representative STEP models have valid ISO-10303-21 structure
    - truncated STEP input is rejected
    - --require-ohos succeeds only in an __OHOS__ build
upstream_tests:
  status: unavailable
  reason: upstream .gitlab-ci.yml includes the external kicad-library-utils GitLab CI template; the source archive has no local CTest tests
