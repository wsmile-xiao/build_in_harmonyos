# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kegtron-ble/1.0.2
homepage: "https://github.com/Bluetooth-Devices/kegtron-ble"

# 上游测试在 GitHub tests/ 目录（pytest——test_parser.py 3 个用例）；
# PyPI sdist 不含 tests/（纯包：LICENSE/PKG-INFO/README/pyproject/src）。
# 配方 build() 从 GitHub v1.0.2 tag 下载 tests/ 并运行 pytest
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest tests/ -q --override-ini=addopts="

upstream_tests:
  - name: tests/test_parser.py（pytest——can_create / kt100 / kt200 3 用例）
    count: "3"
    description: "上游测试实测（rule 4）：本地真跑 3/3 PASS（0.04s）——上游 poetry.lock 锁定依赖组合（sensor-state-data 2.19.0 / bluetooth-data-tools 0.3.1 / bluetooth-sensor-state-data 1.7.5 / home-assistant-bluetooth 1.4.0，全部纯 Python wheel）vendor 后 PYTHONPATH 直跑；3 用例均为纯数据解析（构造 27 字节 Kegtron manufacturer data 帧 -> 解析设备型号/桶型/容积/端口状态断言），无 BLE 硬件依赖——解析层不触碰 bleak 后端（bleak 仅是 home-assistant-bluetooth 声明的可选扫描后端，实测移除 bleak 后 import 链与解析全通过）"

test_package_tests:
  - file: test_kegtron_ble.py
    description: "R34：import kegtron_ble + KT-100 真实广告帧解析（设备识别 model=KT-100/manufacturer=Kegtron、keg_size=18.927、keg_type=Corny (5.0 gal)、volume_start=5.0、volume_dispensed=0.738、port_state=Configured、port_name=Single Port、signal_strength=-82、entity_descriptions=8 项完整）"
    command: "python3 test_kegtron_ble.py <package>"

assertion_count: 12
