knowledge_gained:
  - category: L1
    content: "纯 Python noarch 适配通用模式（同 rich/python-magic/packaging）：直接拷贝源码模块到 lib/pythonX.Y/site-packages + package_info() 注入 env_info.PYTHONPATH——绕过 pip 构建（环境 setuptools egg_info 加载 entry point 报 pbr 缺失实测）"
    reason: "纯 Python 包 conan 适配先例复用"
  - category: L2
    content: "Python 级运行时依赖未发布到 ohpcd 制品仓时的处理：主配方不写 conan requires（PF4 依赖闸禁引未发布依赖），build()/test_package() 从 OHOS pypi 镜像（pypi.repo.openharmony.cn）vendor 上游 poetry.lock 锁定版本的纯 Python wheel（py3-none-any）组装 PYTHONPATH——版本组合以 lock 为准（本包实测：home-assistant-bluetooth 用最新 2.0.0 会拖进 habluetooth 6.26.5 带 aarch64-linux-ohos .so 未签名不可 dlopen，回退 lock 锁定的 1.4.0 纯 Python 版本即全通过）"
    reason: "BLE 解析库家族（*-ble 生态）适配的依赖闭包方法论"
  - category: L2
    content: "habluetooth 新版（6.x）带 Cython 扩展 .so 在 OHOS 未签名不可加载（ImportError: Permission denied）——选依赖版本时优先 py3-none-any 纯 wheel；HNP Python 设置 PYTHONPATH 后默认 sys.path[0]（/data/storage/el2/base/files/interpreters/pip-global）会被移除，pytest 等工具需一并装进 PYTHONPATH 指向的目录"
    reason: "OHOS 平台 Python 环境两处坑实测"
  - category: L3
    content: "kegtron-ble 1.0.2 解析层不依赖 bleak：上游 lock 里 bleak 0.17.0 只是 home-assistant-bluetooth 的传递依赖；实测从 PYTHONPATH 移除 bleak 后 import 链与 3 个上游测试全通过（parser 只用 BluetoothServiceInfo 数据类，不触碰 BLE 扫描后端）"
    reason: "本版本依赖边界实测记录"
