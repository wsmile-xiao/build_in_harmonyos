# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游 ktimer 26.04.0 无任何测试用例：源码树无 tests/ 与 autotests/ 目录，
# CMakeLists.txt 无 add_test()/enable_testing()/ecm_add_tests() 调用
# （grep -rn 扫描 *.txt/*.cmake 于提取后的源码树，除 po/ 外零命中），
# 上游 QA 由 KDE CI 的源码构建承担（.kde-ci.yml）。如实申报 0 用例
# （不虚报不伪造）。适配后按规范补全 smoke test：test() 以
# QT_QPA_PLATFORM=offscreen 真实运行安装后的 ktimer 二进制
# （--version 经 KAboutData 打印版本并退出 0，验证可执行 + Qt6/KF6/Qt6DBus
# 依赖可解析）。

package: ktimer/26.04.0
homepage: "https://invent.kde.org/utilities/ktimer"

# 上游测试命令 (用于 ctest -N / make check 分析)
# 上游无测试目标：ctest -N 无可用测试
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游无测试用例（0 个），无可集成；如实声明 false
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（0 个，如实申报）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ktimer.py
    description: "消费者冒烟测试（L0c 测试源文件）：QT_QPA_PLATFORM=offscreen 真实运行 ktimer --version（KAboutData::processCommandLine 在 KDBusService/托盘/主窗口创建前处理并退出 0；验证二进制可执行、Qt6/KF6/Qt6DBus 依赖解析），非 0 退出码/超时 → FAIL，subprocess.run(timeout=60) 兜底（OHOS worker 无 shell timeout 命令）"
    command: "python3 test_ktimer.py（test() 内经 conanrun env 调用）"
  - file: conanfile.py
    description: "test() 调用 test_ktimer.py（L0c 测试源入口，self.run + conanrun env + QT_QPA_PLATFORM=offscreen），并重构 KF6 依赖包烤死的坏 RPATH（kteatime 26.04.0 先例）"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 0 用例；适配后补全 smoke test 1 项（程序存在 + --version 退出码 + 版本串 + 程序名）
assertion_count: 1
