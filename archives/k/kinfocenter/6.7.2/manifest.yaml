test_results:
  type: see notes
  upstream: "upstream samba autotests (ksambasharemodeltest/smbmountmodeltest) run on the local arm64 OHOS runner via BUILD_TESTING=ON + ctest; appium GUI test exempted (Linux AT-SPI requirement); see notes.md"
  test_package: "consumer test: KPluginFactory::loadFactory(kcm_cpu) + dlopen(libKInfoCenterInternal.so.1) + installed KCM module set verification"
knowledge_gained:
  - "kinfocenter's 'binary' is a symlink to systemsettings (not in the OHOS package set) — the conan package payload is the KCM plugin set under lib/plugins/plasma/kcms/kinfocenter + libKInfoCenterInternal.so.1."
  - "kcmutils 6.26.0 closure (kio KIOCORE_ONLY + kconfigwidgets 6.18 pin + KF6 6.26 overrides) supports the full kinfocenter KCM set except about-distro (KIOGui/libdrm/UDev/vulkan) — trimmed with upstream autotests preserved."
