software: kodi-inputstream-rtmp
display: "Kodi inputstream.rtmp"
description: "Kodi binary add-on implementing RTMP/RTMPS/RTMPE input streams"
category: multimedia
homepage: "https://github.com/xbmc/inputstream.rtmp"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 CMakeLists 依赖 Kodi 构建系统（find_package(Kodi) 的 build_addon/KODI_INCLUDE_DIR），registry 无 kodi 包；配方自带 recipe-cmake/ 构建入口，构建上游原样源码"
    - "上游 FindRTMP.cmake 走 pkg-config，改接 Conan CMakeDeps 的 librtmp::librtmp target；librtmp 头在 include/librtmp 下，上游用 <librtmp/rtmp.h> 风格包含，需补其父目录"
    - "kodi-dev-kit 头（<kodi/General.h>、<kodi/addon-instance/Inputstream.h>）以 xbmc 21.3-Omega 归档原样内嵌于版本目录 kodi-dev-kit/kodi（include/kodi 的 kodi/ 子树），inputstream instance API 3.3.0 与插件源码 override 签名逐一核对兼容"
    - "产物为单一共享模块（dlopen 型插件），shared=True 默认；静态 librtmp 被编入模块，OpenSSL/zlib 为共享运行时依赖"
  common_dependencies:
    - librtmp/2.4_git20190330
    - openssl/3.5.6
    - "zlib: 系统 libz.so（conan zlib 为静态非 PIC，不可链入共享模块；DT_NEEDED=libz.so 由 OHOS 加载器默认搜索路径解析到系统组件 /system/lib64/chipset-sdk-sp/libz.so → libshared_libz.z.so）"

versions:
  "21.1.2":
    status: built
    build_date: "2026-09-22"
    conan_ref: "kodi-inputstream-rtmp/21.1.2"
