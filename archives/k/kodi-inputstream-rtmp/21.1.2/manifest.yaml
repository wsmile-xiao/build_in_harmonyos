version: "21.1.2"
status: built
build_date: "2026-09-22"
conan_ref: "kodi-inputstream-rtmp/21.1.2"

source:
  url: "https://github.com/xbmc/inputstream.rtmp/archive/refs/tags/21.1.2-Omega.tar.gz"
  sha256: "b7223a30d2774e4c7cbd6c4f8a266bf4d186d160590077be627bd0490d80645c"
  tar_format: tar.gz
  # 版本映射：产品版本 21.1.2 对应上游 tag 21.1.2-Omega
  # （release commit fb2745b7768c9babd922dbaf0d811968814306b9）
  kodi_dev_kit_headers:
    # 内嵌于版本目录 kodi-dev-kit/kodi（= xbmc/addons/kodi-dev-kit/include/kodi 原样内容；
    # 归一化掉 include/ 路径段，避开仓库 .gitignore 的 archives/**/include/ 规则）
    origin_tarball: "https://github.com/xbmc/xbmc/archive/refs/tags/21.3-Omega.tar.gz"
    origin_tarball_sha256: "a60afcb556e4a00cb19fc35b7e77758107c9a8096c6ce9b66af5f92396be31aa"
    vendored_subpath: "xbmc/addons/kodi-dev-kit/include/kodi -> kodi-dev-kit/kodi"

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON（插件为 Kodi dlopen 模块，shared=True 默认）"
  dependencies:
    - librtmp/2.4_git20190330（静态 PIC，编入模块）
    - openssl/3.5.6（静态 PIC，编入模块）
    - zlib: 系统 libz.so（conan zlib/1.3.1 为静态非 PIC 归档，无法链入共享模块；
      产物 DT_NEEDED=libz.so（链接期来自 SDK sysroot libz.so，其 SONAME=libz.so）；
      运行时由 OHOS musl 加载器按 /etc/ld-musl-aarch64.path 默认搜索路径解析到
      系统组件 /system/lib64/chipset-sdk-sp/libz.so（symlink → libshared_libz.z.so，
      实测 env -i 下即可解析，/proc/self/maps 证实），与 /usr/lib/libz.so.1 无关、
      无需 LD_LIBRARY_PATH）
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 CMakeLists 的 find_package(Kodi)/build_addon() 在 registry 无 Kodi 构建系统时不可用；仿 kodi-platform 用 recipe-cmake/ 自备构建入口（build_script_folder 消费），上游源码零修改"
  - "librtmp 包 includedirs 指向 include/librtmp（其消费者用 #include \"rtmp.h\"），上游代码用 <librtmp/rtmp.h>，需在 conanfile generate() 把 include 的父目录注入 CMake 变量"
  - "kodi-dev-kit 头可直接从 xbmc 21.3-Omega 归档的 xbmc/addons/kodi-dev-kit/include/kodi 原样内嵌；ADDON_INSTANCE_VERSION_INPUTSTREAM=3.3.0 与 21.1.2 插件源码兼容（所有 override 签名逐一核对）"
  - "内嵌头树路径归一化掉 include/ 段（仓库 .gitignore 有 archives/**/include/ 规则），kodi-dev-kit/kodi + CMake include 指向 kodi-dev-kit/"
  - "kodi/versions.h 的 *_USED 宏由 Kodi 构建系统注入；不定义 BUILD_KODI_ADDON 时所有版本分支均编译进来，test_package 可无宿主调用 ADDON_GetTypeVersion 断言版本"
  - "ADDONCREATOR 导出的 ADDON_GetTypeVersion/ADDON_GetTypeMinVersion 是纯函数，可在无 Kodi 宿主时真实执行验证"
  - "conan zlib/1.3.1 是静态非 PIC 归档（R26 系统同名库），不可链入共享模块（aarch64 重定位错误）；共享库消费者应剪掉 librtmp 传递接口改链系统 libz.so（sysroot 与真机均存在）"
