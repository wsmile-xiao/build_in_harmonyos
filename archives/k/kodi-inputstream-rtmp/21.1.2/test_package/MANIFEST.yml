# test_package/MANIFEST.yml
# Upstream test declaration file (required by CI build_and_test.sh L0e)

package: kodi-inputstream-rtmp/21.1.2
homepage: "https://github.com/xbmc/inputstream.rtmp"

# Upstream 21.1.2-Omega ships no test suite. Checked entries/evidence:
# - CMakeLists.txt: no enable_testing()/add_test()/CTest registration, no
#   tests/ directory in the archive
# - Jenkinsfile: single line buildPlugin("Omega") — build only, no test stage
# - .github/workflows/build.yml ("Build and run tests"): the only job builds
#   the add-on; the "Debian package test" job runs xbmc's
#   debian-addon-package-test.sh (fakeroot/dpkg packaging build with
#   sudo apt-get build-dep) — a packaging smoke build, not a test suite, and
#   not runnable in this environment
# - azure-pipelines.yml / appveyor.yml / .travis.yml: build-only CI configs
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# Consumer-side tests (test_package)
test_package_tests:
  - file: test_inputstream_rtmp.cpp
    description: |
      Part 1 (6 assertions): links the built inputstream.rtmp shared module
      and executes the ADDONCREATOR-exported C entry points
      ADDON_GetTypeVersion/ADDON_GetTypeMinVersion (pure functions, no Kodi
      host needed): asserts inputstream instance API 3.3.0, general API
      1.0.5/1.0.4, main API 2.0.2/2.0.0, proving the vendored kodi-dev-kit
      headers compiled in and all DT_NEEDED (OpenSSL/zlib) resolve at load.
      Part 2 (15 assertions, review rule12 full-consumer flow): dlopen()s the
      packaged module (the test binary links it, so dlopen by DT_SONAME
      attaches to the loaded module — the standard way a binary-add-on host
      obtains the module handle), dlsym()s the ADDONCREATOR factory export
      ADDON_Create, and drives a real host-stub session over the stable C
      ABI —
      ADDON_Create instantiates the real CMyAddon and the add-on wires its
      KodiToAddonFuncTable; create_instance(ADDON_INSTANCE_INPUTSTREAM)
      constructs the real CInputStreamRTMP and wires
      open/close/get_capabilities; GetCapabilities must report exactly
      IPOSTIME|SEEK|PAUSE; Open() on an invalid RTMP URL and on an
      unreachable server (loopback port 1, connection refused — probed)
      must fail in a controlled way through the real librtmp session path
      (RTMP_Alloc/RTMP_Init/RTMP_SetupURL/RTMP_Connect/RTMP_Close) and leave
      the instance consistent; destroy_instance/destroy/dlclose tear down
      cleanly. Every failure exits non-zero.
    command: "./test_inputstream_rtmp"
    assertion_count: 21

assertion_count: 21

notes: |
  上游 21.1.2-Omega 无任何测试注册（CMakeLists 无 enable_testing/add_test，
  无 tests 目录；Jenkinsfile 仅 buildPlugin；GitHub Actions 仅构建与 Debian
  打包冒烟）。因此按 pre-ci-policy 记录 NO_UPSTREAM_TESTS。
  消费者测试为真实执行，分两部分：
  - Part 1（6 断言）：链接产物并运行，断言 ADDONCREATOR 导出的
    ADDON_GetTypeVersion/ADDON_GetTypeMinVersion 返回 kodi-dev-kit
    (21.3-Omega) 的版本宏值；
  - Part 2（15 断言，review rule12 完整消费者用例）：dlopen 产物 +
    dlsym ADDON_Create 工厂导出，以最小 Kodi 宿主桩走一次真实
    声明/打开流程：ADDON_Create 实例化真实 CMyAddon；create_instance
    构造真实 CInputStreamRTMP 并布线 open/close/get_capabilities；
    GetCapabilities 精确断言 IPOSTIME|SEEK|PAUSE；对非法 RTMP URL 与
    不可达服务器（127.0.0.1:1 连接拒绝，已实测）Open 经真实 librtmp
    会话路径受控失败并正确传播 false，实例状态保持一致；
    destroy_instance/destroy/dlclose 无崩溃收尾。任一断言失败进程
    返回非零。
