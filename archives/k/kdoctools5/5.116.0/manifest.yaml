software: kdoctools5
version: "5.116.0"
status: built
build_date: 2026-10-07
created_at: 2026-10-07
build_system: cmake
homepage: https://invent.kde.org/frameworks/kdoctools
license: LGPL-2.0-or-later
description: KDE Frameworks 5 DocBook documentation processing tools
source:
  url: https://mirrors.bfsu.edu.cn/kde/Attic/frameworks/5.116/kdoctools-5.116.0.tar.xz
  sha256: 36a0a60e422907b2baead8b82cec56008240b7a950678294bb2e1df65e1a6bb3
  tar_format: tar.xz
build:
  system: cmake
  configure_options:
    - -DQT_MAJOR_VERSION=5
    - -DBUILD_TESTING=ON
    - -DMEINPROC_NO_KARCHIVE=OFF
  dependencies:
    - qt5-qtbase/5.15.2.2
    - karchive5/5.116.0
    - zlib/1.3.1.1 (force=True; PIC rebuild required by KArchive's shared library)
    - libxml2/2.15.3
    - libxslt/1.1.45.1
  build_dependencies:
    - ecm/6.26.0
patches_applied:
  - patches/0001-uriencode-perlmodules-optional.patch
  - patches/0002-docbook-data-optional.patch
  - patches/0003-l10n-helper-without-docbook-xsl.patch
  - patches/0004-docs-optional-on-ohos.patch
  - patches/0005-docbook-upstream-tests-guard.patch
test_results:
  type: target-device
  platform: HarmonyOS PC 6.0, aarch64 (armv8), clang 15.0.4
  conan_version: 2.29.1
  conan_create: "passed on the native HarmonyOS device; package built and installed"
  upstream: "After installing official DocBook XML 4.5 DTD and DocBook XSL 1.79.2 in the user-level device test prefix and reconfiguring, upstream test items meinproc_template and kdoctools_install both passed on HarmonyOS aarch64 (2/2)"
  consumer: "Conan test_package passed with content verification (1/1); checkXML5 accepted valid XML and rejected malformed XML, and the standard DocBook HTML stylesheet produced the expected text"
  local_ci: "ci/conan/setup.sh and build_and_test.sh passed on HarmonyOS aarch64 (1/1 package); user-authorized W0/R36 dependency gate was skipped. L0, L1, L4, and L5 passed; L2 was non-blocking skip."
knowledge_gained:
  - "Conan's OHOS profile maps to CMAKE_SYSTEM_NAME=HarmonyOS; build-system conditions that check only OHOS do not skip host-only documentation targets. (knowledge_ref: notes.md)"
  - "Qt5's dependency graph selects zlib/1.3.1 by default, while the reviewed KArchive binary requires the PIC zlib/1.3.1.1 build. Force the PIC version at the KDocTools recipe level so Conan reuses the matching KArchive binary instead of rebuilding it against non-PIC zlib. (knowledge_ref: notes.md)"
  - "The initial build environment lacked Perl URI::Escape and system DocBook XML/XSL data, so optional guards were needed. Installing the official DocBook XML 4.5 DTD and XSL 1.79.2 in the device user test prefix and reconfiguring enabled both upstream integration test items (2/2), positive/negative checkXML5 runs, and a standard DocBook HTML transform; test data is not a Conan dependency. (knowledge_ref: knowledge/drafts/E14723-draft-18C1.md)"
  - "The SSH test user cannot write /data/local/tmp; use the writable per-user temporary directory selected from TMPDIR, $HOME/tmp, or Python's tempfile path. (knowledge_ref: notes.md)"
knowledge_ref:
  - knowledge/drafts/E14723-draft-18C1.md
