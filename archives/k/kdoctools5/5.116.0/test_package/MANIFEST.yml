package: kdoctools5/5.116.0
homepage: https://invent.kde.org/frameworks/kdoctools

upstream_check_command: "ctest --test-dir <build-dir> --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build-dir> --output-on-failure"

upstream_tests:
  - file: autotests/CMakeLists.txt
    source: kdoctools-5.116.0/autotests/CMakeLists.txt
    description: "meinproc_template converts the upstream DocBook template; enabled when system DocBook XML 4.5 and DocBook XSL data are available."
    command: "ctest --test-dir <build-dir> --output-on-failure -R meinproc_template"
  - file: autotests/CMakeLists.txt
    source: kdoctools-5.116.0/autotests/CMakeLists.txt
    description: "kdoctools_install configures and installs a CMake consumer with DocBook-generated man and HTML files; enabled when system DocBook XML 4.5 and DocBook XSL data are available."
    command: "ctest --test-dir <build-dir> --output-on-failure -R kdoctools_install"

test_package_tests:
  - file: test_package/test_ohos_docbook.py
    description: "On HarmonyOS, execute the packaged meinproc5 with libxml2/libxslt to transform an XML article fixture into HTML in the SSH user's writable temp directory and verify the rendered content."
    command: "conan create kdoctools5/5.116.0"

assertion_count: 7
