# KDE Frameworks 5.116 is archived; list domestic mirrors first and retain
# KDE's official Attic source as the final fallback (R39).
sources:
  "5.116.0":
    url:
      - "https://mirrors.bfsu.edu.cn/kde/Attic/frameworks/5.116/kdoctools-5.116.0.tar.xz"
      - "https://mirrors.ustc.edu.cn/kde/Attic/frameworks/5.116/kdoctools-5.116.0.tar.xz"
      - "https://mirror.nju.edu.cn/kde/Attic/frameworks/5.116/kdoctools-5.116.0.tar.xz"
      - "https://download.kde.org/Attic/frameworks/5.116/kdoctools-5.116.0.tar.xz"
    sha256: "36a0a60e422907b2baead8b82cec56008240b7a950678294bb2e1df65e1a6bb3"

patches:
  "5.116.0":
    - patch_file: "patches/0001-uriencode-perlmodules-optional.patch"
      patch_description: "Allow URI::Escape to be absent on HarmonyOS while retaining Perl path encoding when available"
      patch_type: "portability"
    - patch_file: "patches/0002-docbook-data-optional.patch"
      patch_description: "Treat system DocBook DTD and XSL data as optional build-time components"
      patch_type: "portability"
    - patch_file: "patches/0003-l10n-helper-without-docbook-xsl.patch"
      patch_description: "Generate a minimal localization catalog when DocBook XSL is not installed"
      patch_type: "portability"
    - patch_file: "patches/0004-docs-optional-on-ohos.patch"
      patch_description: "Skip host manual generation targets on OHOS"
      patch_type: "portability"
    - patch_file: "patches/0005-docbook-upstream-tests-guard.patch"
      patch_description: "Register DocBook transformation tests only when the system DTD and XSL data are available"
      patch_type: "portability"
