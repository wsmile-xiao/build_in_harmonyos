    note: >
      229 source TEST_CASE macros vs 225 registered: a few macros sit behind
      upstream #if guards (x86-only SIMD paths, FLAC/codec I/O) that do not
      compile on aarch64/generic, while Catch2 parameterisation registers extra
      concrete cases per macro; net registered-and-executed = 225, all passed.
    real_pass_rate: "225/225 (1.0)"
    ctest: "100% tests passed out of 2 (all_tests Passed 256.06s, audio_test Passed 4.05s)"
    evidence_log: "res/upstream_test_run.txt"
  test_package:
