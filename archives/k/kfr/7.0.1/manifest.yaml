status: built
build_date: "2026-09-21"
build_system: cmake

source:
  url: "https://codeload.github.com/kfrlib/kfr/tar.gz/refs/tags/7.0.1"
  sha256: "42b36126f2af8719eff6f26e87e9f155816bc3bb110376e4747ba5de536c2cce"
  tar_format: tar.gz
  fetch_mode: "direct codeload URL; SHA-256 verified by Conan"

build:
  system: cmake
  configure_options:
    - "ENABLE_TESTS=ON"
    - "ENABLE_EXAMPLES=OFF"
    - "KFR_ENABLE_DFT=ON"
    - "KFR_SKIP_TESTS=OFF"
    - "KFR_ARCH=generic"
    - "KFR_LINK_LIBSTDCXX=OFF"
    - "KFR_USE_BOOST_MATH=OFF"
    - "BUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - patch_file: "patches/0001-ohos-libcxx.patch"
    patch_type: portability
    description: >
      HarmonyOS ships libc++ only (the Conan OHOS profile already selects
      -stdlib=libc++). KFR 7.0.1's top-level CMakeLists sets STD_LIB=stdc++ on
      every target that is not iOS and not Android, then links
      `kfr INTERFACE ${STD_LIB} pthread m`, so consumers of libkfr_*.a can get an
      unresolved -lstdc++. CMake does not model Platform/HarmonyOS, so its system
      name is not a usable trigger for the guard; the patch adds a KFR_LINK_LIBSTDCXX
      cache switch and, when it is defined and OFF, leaves STD_LIB empty. The
      recipe passes KFR_LINK_LIBSTDCXX=OFF so OHOS deterministically avoids
      -lstdc++ while every other platform keeps the upstream behaviour. Only the
      STD_LIB guard changes; no library source, test, or expected value is touched.

