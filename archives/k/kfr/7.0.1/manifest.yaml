    binary: test_kfr
    assertions: 12
    result: "checks=12 failures=0 -> RESULT: PASS (12/12)"

known_issues:
  - "Elliptic filter design (kfr::dsp `elliptic(N, rp, rs)`) is disabled by
     setting KFR_USE_BOOST_MATH=OFF. Upstream implements it by pulling
     boostorg/math via CMake FetchContent (git clone of github.com/boostorg/math
     at tag boost-1.89.0). github.com is intermittently unreachable from the
     build device/CI (observed `SSL_read: unexpected eof` mid-clone), which makes
     `conan create` non-deterministic. The symbol is guarded by
     `#ifdef KFR_HAVE_ELLIPTIC` and is referenced by no upstream test, so turning
     it off yields a fully offline, deterministic build of every other feature.
     No test was disabled or trimmed."
  - "7.0.1 dropped the C++14/variable-template inline workaround and the x86-only
     -mstackrealign flag that 3.0.8 needed (it now mandates cxx_std_20), and the
     absmin/absmax signed-overflow UB is already fixed upstream (IsNotMinInt is
     present in tests/unit/simd/min_max.cpp). Only the stdc++/libc++ guard is
     still required."
