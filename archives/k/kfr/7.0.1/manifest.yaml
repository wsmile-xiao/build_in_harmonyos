  conan_create_exit: 0
  target_system: "HarmonyOS PC aarch64 (OHOS, musl, clang-15, native build)"
  package_id: "885d6d4f2d1935229411dd8a58da12f5a7eb00eb"
  build_result: "PASS (libkfr_io.a, libkfr_dft.a, libkfr_dsp.a, libkfr_audio.a, 152 headers + config.h installed)"
  upstream_suite:
    framework: "Catch2 (amalgamated) via ctest"
    registered_ctest_tests: 2
    ctest_names: [all_tests, audio_test]
    source_declared_TEST_CASE_macros: 229
    grep_command: "grep -rIhE '\\bTEST_CASE\\b' tests | wc -l"
    registered_test_cases: 225
    all_tests_cases: 203
    audio_test_cases: 22
    executed: 225
