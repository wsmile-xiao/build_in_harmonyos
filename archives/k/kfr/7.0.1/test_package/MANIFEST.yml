# test_package/MANIFEST.yml - kfr 7.0.1 (HarmonyOS PC)
# CI L0e/L0d require this file to exist. Every number below is backed by a real
# device run; see the version manifest's verification block and res/upstream_test_run.txt.
package: kfr/7.0.1
homepage: "https://www.kfrlib.com"

# ---------------------------------------------------------------------------
# A. Source declarations (upstream test suite)
# ---------------------------------------------------------------------------
# Upstream registers TWO CTest entries inside tests/CMakeLists.txt (enable_testing()
# lives there, not at the root, so ctest must run from <build>/tests):
#     add_test(NAME all_tests  COMMAND .../bin/all_tests)   # Catch2: tests/unit/** + dft_test.cpp
#     add_test(NAME audio_test COMMAND .../bin/audio_test)  # Catch2: audio/IO round-trips
# kfr core is header-only; 7.0.1 replaced the old "testo" framework with Catch2
# (amalgamated), so counts are Catch2 TEST_CASE registrations.
upstream_check_command: "ctest --output-on-failure   # in <build>/tests"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: tests/all_tests.cpp
    source: kfr-7.0.1/tests/all_tests.cpp
    description: >
      Catch2 runner aggregating tests/unit/** (base/dsp/io/math/simd/meta) plus
      dft_test.cpp. Registers 203 test cases at runtime for the aarch64/generic
      build; all passed.
    command: "./bin/all_tests"
  - file: tests/audio_test.cpp
    source: kfr-7.0.1/tests/audio_test.cpp
    description: >
      Catch2 audio/IO round-trip suite. Registers 22 test cases on this build
      (a further set of TEST_CASE behind #if FLAC/codec guards do not compile on
      OHOS); all passed.
    command: "./bin/audio_test"

# TEST_CASE macros across the whole tests/ tree (grep口径 used by the reviewer):
#   grep -rIhE '\bTEST_CASE\b' tests | wc -l  -> 229
# Registered + executed Catch2 cases on device: 203 + 22 = 225 (all passed).
test_case_macros_source: 229
test_cases_registered: 225

# ---------------------------------------------------------------------------
# B. HarmonyOS consumer test (this test_package)
# ---------------------------------------------------------------------------
test_package_tests:
  - file: test_kfr.cpp
    description: >
      Consumer program linking the exported kfr::kfr target (header-only core +
      kfr_io + kfr_dft archives): convolve()/correlate() exact expected values,
      realdft()/irealdft() round-trip shape check, plus sum()/rms()/abs() and
      expression-template checks. 12 assertions; exit code is the PASS/FAIL
      signal.
    command: "./test_kfr"

# 12 checks in test_kfr.cpp (counted from the source).
assertion_count: 12

# ---------------------------------------------------------------------------
# C. Measured device results (kfr 7.0.1, HarmonyOS PC aarch64, clang-15)
# ---------------------------------------------------------------------------
device_results:
  conan_create_exit: 0
  source_test_case_macros: 229
  runtime_registered: 225
  executed: 225
  passed: 225
  failed: 0
  errored: 0
  ctest_wrappers: "2/2 PASS (all_tests 256.06s, audio_test 4.05s; 100% tests passed out of 2)"
  test_package: "1/1 PASS (test_kfr, checks=12 failures=0)"
  evidence_log: "res/upstream_test_run.txt"
