sources:
  # Provenance URL only. conanfile.py source() unpacks the byte-identical
  # archive from exports_sources/res/ and never requests this URL on the worker.
  url: "https://codeload.github.com/kfrlib/kfr/tar.gz/refs/tags/7.0.1"
  sha256: "42b36126f2af8719eff6f26e87e9f155816bc3bb110376e4747ba5de536c2cce"

patches:
  - patch_file: "patches/0001-ohos-libcxx.patch"
    patch_description: >
      Do not ask the linker for libstdc++ when the Conan recipe builds for
      HarmonyOS.  Upstream unconditionally appends -lstdc++ to the interface of
      the kfr target on every platform that is neither iOS nor Android; the
      OHOS NDK ships libc++ only (clang++ selects it on its own), so the link
      of every consumer of libkfr_*.a fails with an unresolved -lstdc++.
      CMake's own platform name cannot be used as the trigger here: a native
      build on OHOS does not report a system name CMake recognises, so the new
      KFR_LINK_LIBSTDCXX cache switch is passed explicitly by the recipe and
      every other platform keeps the upstream behaviour unchanged.
    patch_type: "portability"
