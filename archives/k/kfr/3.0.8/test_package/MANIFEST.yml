# test_package/MANIFEST.yml - kfr 3.0.8 (HarmonyOS PC)
# CI L0e/L0d require this file to exist. Every number below is backed by a real
# device run; see the version manifest's verification block.
package: kfr/3.0.8
homepage: "https://www.kfrlib.com"

# ---------------------------------------------------------------------------
# A. Source declarations (upstream test suite)
# ---------------------------------------------------------------------------
# Upstream registers ONE CTest entry inside tests/CMakeLists.txt:
#     add_test(NAME all_tests COMMAND ${PROJECT_BINARY_DIR}/bin/all_tests)
# and enable_testing() lives in tests/CMakeLists.txt, so ctest must be run from
# <build>/tests. That single wrapper binary contains the whole testo suite.
upstream_check_command: "ctest --output-on-failure   # in <build>/tests"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: tests/all_tests.cpp
    source: kfr-3.0.8/tests/all_tests.cpp
    description: >
      testo runner aggregating the 7 suite translation units (base/complex/dft/
      dsp/expression/intrinsic/io) plus tests/unit/**; runtime discovers 128
      test instances (source declarations counted statically = 111; the
      difference comes from macro/template instantiation).
    command: "./bin/all_tests"

# ---------------------------------------------------------------------------
# B. HarmonyOS consumer test (this test_package)
# ---------------------------------------------------------------------------
test_package_tests:
  - file: test_kfr.cpp
    description: >
      Consumer program linking the exported kfr::kfr target (header-only core +
      kfr_io + kfr_dft archives): convolve() and correlate() exact expected
      values, FFT-based convolve_filter(), realdft()/irealdft() round trip,
      plus expression/sum/rms/abs checks. 13 assertions; exit code is the
      PASS/FAIL signal.
    command: "./test_kfr"

# 13 checks in test_kfr.cpp (counted from the source).
assertion_count: 13

# ---------------------------------------------------------------------------
# C. Measured device results (kfr 3.0.8, HarmonyOS PC aarch64)
# ---------------------------------------------------------------------------
# Source declarations : 111
# Runtime discovered  : 128
# Executed            : 128
# Passed              : 128
# Failed              : 0
# Crashed             : 0
# CTest wrapper       : 1/1 PASS (entry "all_tests")
# test_package        : 1/1 PASS (test_kfr)
device_results:
  source_declarations: 111
  runtime_discovered: 128
  executed: 128
  passed: 128
  failed: 0
  crashed: 0
  ctest_wrapper: "1/1 PASS"
  test_package: "1/1 PASS"
