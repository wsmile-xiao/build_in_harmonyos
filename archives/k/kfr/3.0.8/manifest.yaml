version: "3.0.8"
software: kfr
status: built
build_date: "2026-09-19"
build_system: cmake

source:
  url: "https://github.com/kfrlib/kfr/archive/refs/tags/v3.0.8.tar.gz"
  sha256: "f61068e8ae401853ca04ac00fe25fff06ef181789fad97c3950c452395c6bc46"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "ENABLE_TESTS=ON"
    - "ENABLE_DFT=ON"
    - "SKIP_TESTS=OFF"
    - "CPU_ARCH=generic"
    - "BUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - patch_file: "patches/0001-ohos-aarch64-portability.patch"
    patch_type: portability
    description: >
      (1) C++17 instead of C++14 and `inline` on the explicit specialisations of
      the variable templates kfr::data::c_sin_table<f64> /
      kfr::intrinsics::fp_precision_limit<f32>. Those definitions live in headers
      (dft/data/sincos.hpp, math/impl/round.hpp) but were not inline under C++14,
      so every TU emitted a strong definition and lld aborted the all_tests link
      with "duplicate symbol".
      (2) Gate the x86-only -mstackrealign flag behind X86.
      (3) Do not link libstdc++ on HarmonyOS (libc++ only).

verification:
  conan_create: passed
  conan_create_exit: 0
  target_system: "HarmonyOS PC aarch64 (OHOS 6.0, musl, clang 15.0.4)"
  build_result: "PASS (libkfr_io.a, libkfr_dft.a, headers installed)"
  upstream_suite:
    framework: "kfr testo via ctest"
    registered_ctest_tests: 1
    ctest_name: all_tests
    source_declared_TEST_cases: 128
    executed: 128
    passed: 128
    failed: 0
    skipped: 0
    errors: 0
    testo_error_blocks: 0
    real_pass_rate: "128/128 (1.0)"
    ctest: "100% tests passed, 0 tests failed out of 1"
    evidence_log: "res/upstream_test_run.txt"
  test_package:
    status: passed
    binary: test_kfr
    ctest: "100% tests passed, 0 tests failed out of 1"

known_issues:
  - "RESOLVED via upstream backport. absmin/absmax failed because the upstream
    test reference lambda `x = x >= 0 ? x : -x` has signed-overflow UB when
    x == std::numeric_limits<T>::min(); on aarch64 kfr's integer abs path keeps
    INT_MIN while the reference collapses to 0, so absmin got INT_MIN vs 0 and
    absmax got 0 vs INT_MIN, for int/long and vec<int,N>/vec<long,N> only
    (float/double were unaffected).
    Fixed by backporting upstream commit cabdebd284 'Avoid undefined behavior in
    absmin and absmax' (2019-11-25, postdates the v3.0.8 tag d1ef651da3 of
    2019-03-15). v3.0.8 already provides the 4th predicate hook of
    test_function2 (include/kfr/simd/vec.hpp:1126), so NO harness prerequisite
    was needed; the only mechanical adaptation was qualifying
    is_floating_point/is_unsigned to their std:: equivalents, which upstream
    could use unqualified from cometa. Library implementation untouched,
    expected values untouched; only the genuinely-undefined input domain is
    excluded from the matrix." 
