sources:
  url: "https://github.com/kfrlib/kfr/archive/refs/tags/v3.0.8.tar.gz"
  sha256: "f61068e8ae401853ca04ac00fe25fff06ef181789fad97c3950c452395c6bc46"

patches:
  - patch_file: "patches/0001-ohos-aarch64-portability.patch"
    patch_description: >
      aarch64 / OHOS portability, three independent fixes:
      (1) C++17 instead of C++14. KFR declares explicit specialisations of
      variable templates (kfr::data::c_sin_table<f64>, fp_precision_limit<f32>,
      ...) whose definitions are only implicitly inline from C++17. Under
      C++14 each translation unit emits a strong definition and lld aborts
      with "duplicate symbol". C++17 matches the cppstd=17 the OHOS Conan
      profile already mandates.
      (2) Gate the x86-only -mstackrealign driver flag behind X86; clang
      rejects it on aarch64 with "unsupported option '-mstackrealign'".
      (3) Do not link libstdc++ on HarmonyOS, which ships libc++ only
      (clang++ adds it automatically), so -lstdc++ would be unresolved.
    patch_type: "portability"
  - patch_file: "patches/0002-upstream-absmin-absmax-intmin-ub.patch"
    patch_description: >
      Upstream test-only backport of kfr commit cabdebd284 "Avoid undefined
      behavior in absmin and absmax" (2019-11-25), which postdates the v3.0.8
      tag (d1ef651da3, 2019-03-15). The upstream test reference lambda
      `x = x >= 0 ? x : -x` has signed-overflow UB for x == numeric_limits<T>::min(),
      so on aarch64/NEON the reference and kfr's integer abs path diverge
      (absmin: expected 0 vs actual INT_MIN; absmax: expected INT_MIN vs actual 0)
      for int/long and vec<int,N>/vec<long,N> only. The commit adds an
      IsNotMinInt filter that excludes that genuinely-UB input domain from the
      matrix. It touches ONLY tests/unit/math/min_max.cpp: the kfr library
      implementation is unchanged and no expected value is altered.
    patch_type: "upstream-fix"
