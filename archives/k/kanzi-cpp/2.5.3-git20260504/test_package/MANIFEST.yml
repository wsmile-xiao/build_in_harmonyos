# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求)
package: kanzi-cpp/2.5.3-git20260504
homepage: "https://github.com/flanglet/kanzi-cpp"

# 上游测试存在：true（CMakeLists.txt 含 enable_testing() + 8 add_test，
# 无开关，默认构建全部测试可执行文件）
upstream_tests_exist: true

# 上游测试审计（源码为 f68e09f commit tarball，sha256 见 conandata.yml）
upstream_test_audit:
  source_tarball: "f68e09f6f7f841baa0119c366783ff5fc380bd93.tar.gz (GitHub commit archive)"
  source_sha256: "f85ec7ccbf855494093de95548abee777ae42d7cf2bcfa2aa8ab3d768022858c"
  build_system: "CMake (>= 3.10), C++17, Threads"
  test_definition: >
    顶层 CMakeLists.txt 通过 enable_testing() 注册 8 个 add_test 条目，
    每个条目对应一个测试可执行文件（BWT/Transforms/EntropyCodec/
    DefaultBitStream/Factories/MalformedStream/CompressedStream/API）。
    测试可执行文件无条件构建（无 BUILD_TESTS 开关）；DefaultBitStream
    用例的临时文件路径取自 $TMPDIR/$TEMP/$TMP，缺省回退 /tmp。
  scanned_for:
    - "enable_testing() / add_test (ctest entries, runner 粒度)"
    - "src/test/*.cpp + src/test/TestAPI.c (测试源)"
    - "CMAKE_BUILD_TESTING / BUILD_TESTS option (不存在)"
    - "gtest / catch2 / python 测试框架 (不存在)"
  scan_result: "8 add_test 条目全部可构建可运行；以 ctest entries 为官方口径"

# HMBS 官方盘点口径（用于校验 discovered 与总分母）
upstream_test_total: 8
upstream_test_count_method: ctest_entries

# 上游测试命令 (conanfile.py build() 方法中已集成)
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure (build 目录)"

# 上游实际运行的测试程序（8 个 ctest entries）
upstream_tests:
  - file: src/test/TestBWT.cpp
    source: kanzi-cpp-f68e09f/src/test/TestBWT.cpp
    description: "BWT/BWTS 正反变换与分块编解码"
    command: "ctest -R BWT"
  - file: src/test/TestTransforms.cpp
    source: kanzi-cpp-f68e09f/src/test/TestTransforms.cpp
    description: "全部 transform 编解码 (-type=all)"
    command: "ctest -R Transforms"
  - file: src/test/TestEntropyCodec.cpp
    source: kanzi-cpp-f68e09f/src/test/TestEntropyCodec.cpp
    description: "全部熵编码器编解码 (-type=all)"
    command: "ctest -R EntropyCodec"
  - file: src/test/TestDefaultBitStream.cpp
    source: kanzi-cpp-f68e09f/src/test/TestDefaultBitStream.cpp
    description: "默认位流读写 (临时文件 $TMPDIR/testDefaultBitStream.tmp)"
    command: "ctest -R DefaultBitStream"
  - file: src/test/TestFactories.cpp
    source: kanzi-cpp-f68e09f/src/test/TestFactories.cpp
    description: "codec/transform 工厂创建"
    command: "ctest -R Factories"
  - file: src/test/TestMalformedStream.cpp
    source: kanzi-cpp-f68e09f/src/test/TestMalformedStream.cpp
    description: "畸形位流解码硬化回归"
    command: "ctest -R MalformedStream"
  - file: src/test/TestCompressedStream.cpp
    source: kanzi-cpp-f68e09f/src/test/TestCompressedStream.cpp
    description: "压缩流多场景往返 (含多 job/校验和组合)"
    command: "ctest -R CompressedStream"
  - file: src/test/TestAPI.c
    source: kanzi-cpp-f68e09f/src/test/TestAPI.c
    description: "纯 C API (Compressor/Decompressor) 往返与非法参数"
    command: "ctest -R API"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_kanzi_roundtrip.cpp
    description: "消费者测试: 64 KiB 确定性载荷经 C++ 流 API 压缩往返 (5 项 CHECK)"
    command: "ctest -R roundtrip"
  - file: cli_test.cmake
    description: "消费者测试: 打包的 kanzi 可执行文件压缩/解压往返并逐字节比对"
    command: "ctest -R cli_roundtrip"

# 测试断言总数 (test_package: 5 C++ CHECK + 1 CLI 往返 = 6; 上游 8 ctest entries)
assertion_count: 6
