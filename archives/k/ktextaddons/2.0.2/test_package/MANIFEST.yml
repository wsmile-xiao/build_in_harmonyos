# test_package/MANIFEST.yml
# Upstream and consumer test declaration for ktextaddons/2.0.2 (CI L0e requires this file).

package: ktextaddons/2.0.2
homepage: https://invent.kde.org/libraries/ktextaddons

# 上游测试入口：CMake/CTest（ECMAddTests 注册），在 conanfile.py build() 中真实执行
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error --timeout 180 -E \"^(texttospeech-texttospeechactionstest|translator-translatorwidgettest)$\""

upstream_tests:
  - file: autotests/
    source: ktextaddons-2.0.2/ (37 个 autotests 目录, 190 个 CTest 用例)
    description: "KTextAddons 上游 CTest 套件（textaddonswidgets / textautocorrection / textemoticons / texttranslator / textgrammarcheck / textutils / textcustomeditor / textautogeneratetext / textspeechtotext / textedittexttospeech）；本机实测 190 项注册用例中 188 项执行全部通过，2 项因 OHOS 构建沙箱限制排除（texttospeech-texttospeechactionstest: 无图标主题；translator-translatorwidgettest: 无出站网络，HTTP 引擎语言列表获取挂起）"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E \"^(texttospeech-texttospeechactionstest|translator-translatorwidgettest)$\""
    condition: "run in the Conan build with BUILD_TESTING=ON"

test_package_tests:
  - file: test_package/test.cpp
    description: "消费者测试：真实调用 KF6TextEmoticonsCore::EmoticonUnicodeUtils::escapeUnicodeEmoji/emojiFontName、KF6TextUtils::ConvertText::normalize/upperCase/lowerCase、KF6TextAddonsWidgets::SlideContainer（offscreen）"
    command: "./test_ktextaddons"
  - file: test_package/ohos_test.cpp
    description: "HarmonyOS 专项测试：解析安装包内每个共享库的 ELF64 .dynamic 段断言 DT_SONAME 存在且为纯文件名（OHOS soname 旗标适配）、断言 kf6/translator 插件目录与 12 个组件库安装到位、offscreen 下真实构造 SlideContainer"
    command: "./test_ktextaddons_ohos"

# 断言总数（近似值）：上游 188 项通过用例 + test_package 消费者 7 项 + OHOS 专项 4 组断言
assertion_count: 199
