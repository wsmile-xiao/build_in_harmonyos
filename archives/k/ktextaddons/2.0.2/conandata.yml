# conandata.yml - ktextaddons 2.0.2 (HarmonyOS PC)
sources:
  url: "https://download.kde.org/stable/ktextaddons/ktextaddons-2.0.2.tar.xz"
  sha256: "0d7f82a976ef682f45822b221e2f15cefc0039488bc8c700a6b0e7594aaebdea"

patches:
  "2.0.2":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "0001 drop KF6::TextWidgets from the required KF6 component set (ktextwidgets is only published on ohpcd as a 6.18.0 build bound to the qtbase/6.11.1.3 tree, incompatible with the published 6.26 line; the single consumer, the TextAutoGenerateTextLineEdit chat input, is ported to QTextEdit by patch 0007) and lower the Qt6Keychain requirement from 0.15.0 to the published 0.14.2"
      patch_type: "portability"
    - patch_file: "patches/0002-textaddonswidgets-CMakeLists.txt.patch"
      patch_description: "0002 drop the KF6::KIOFileWidgets link item from KF6TextAddonsWidgets (ohpcd kio is a KIOCore-only package, KIOWidgets/KIOGui/KIOFileWidgets do not exist)"
      patch_type: "portability"
    - patch_file: "patches/0003-textaddonswidgets-misc-savefileutils.patch"
      patch_description: "0003 replace KFileWidget::getStartUrl (KIOFileWidgets) with the XDG documents location in the save-file dialog helper"
      patch_type: "portability"
    - patch_file: "patches/0004-textcustomeditor-kio-consumers.patch"
      patch_description: "0004 drop the unconditional KUriFilterSearchProviderActions include/member/constructor initializer from PlainTextEditor/RichTextBrowser/RichTextEditor (the KIO web-shortcut menu itself is already guarded by HAVE_KTEXTADDONS_KIO_SUPPORT, which is 0 without the KIOWidgets target)"
      patch_type: "portability"
    - patch_file: "patches/0005-textcustomeditor-autotests-web-shortcut.patch"
      patch_description: "0005 align the plaintexteditor/richtexteditor/richtextbrowser autotests with the configured feature state: without KIOWidgets the web-shortcut support property is disabled, so the assertions expect false"
      patch_type: "portability"
    - patch_file: "patches/0006-textautogeneratetext-CMakeLists.txt.patch"
      patch_description: "0006 drop the KF6::KIOWidgets link items (textautogeneratetext core, ollama plugin and their autotests) and the KF6::TextWidgets link item from the widgets autotests"
      patch_type: "portability"
    - patch_file: "patches/0007-textautogeneratetext-lineedit.patch"
      patch_description: "0007 port TextAutoGenerateTextLineEdit from KTextEdit (ktextwidgets) to QTextEdit: the class keeps its send/key handling, the KTextEdit spell-checking and find/replace integration is dropped together with the ktextwidgets dependency"
      patch_type: "portability"
    - patch_file: "patches/0008-textautogeneratetext-open-file-and-image.patch"
      patch_description: "0008 replace the KIO::ApplicationLauncherJob based open-with paths (show-image widget and attachment open-file job) with QDesktopServices::openUrl"
      patch_type: "portability"
    - patch_file: "patches/0009-textautogeneratetext-ollama-customize-widget.patch"
      patch_description: "0009 replace the KUrlRequester (KIO widgets) default-model-path field of the ollama customize widget with a QLineEdit plus a directory chooser button, and align its autotest"
      patch_type: "portability"
