knowledge_gained:
  - "The published ohpcd KF6 lines are not mutually consistent: the 6.18.0-line binaries were built against different qtbase trees (ktextwidgets/6.18.0 and the 6.18.0.1/.2 variants against qtbase/6.11.1.3, the plain 6.18.0 packages against qtbase/6.11.1) and additionally an override-only `self.requires(..., override=True)` is pruned by Conan when no other node requires the package. A consumer must therefore pick one complete line; the KF6 6.26 line is the only one whose binaries all resolve with --build=never."
  - "ktextaddons 2.0.2 requires Qt6::Sql and Qt6::DBus, which the published qtbase/6.11.1 does not provide (FEATURE_sql/dbus=OFF). The qtbase-sql-dbus/6.11.1 variant is the Qt provider; it must be prepended to CMAKE_PREFIX_PATH (and CMAKE_LIBRARY_PATH/CMAKE_INCLUDE_PATH processed in reverse order) so it wins over the plain qtbase pulled in by the KF6 packages, and the Qt modules published as separate packages need QT_ADDITIONAL_PACKAGES_PREFIX_PATH for Qt6Config.cmake component resolution (akonadi 25.12.3 precedent)."
  - "ECMAddTests bakes QT_PLUGIN_PATH=<build>/bin into every generated CTestTestfile, which overrides the inherited environment: runtime plugins needed by upstream tests must be staged inside <build>/bin (kf6/translator, kf6/textautogeneratetext, sqldrivers for the Qt SQLite driver, platforms for the offscreen platform plugin)."
  - "Several published KF6/Qt packages record build-layout relative DT_NEEDED names (../../bin/libKF6ConfigCore.so, ../../bin/libKF6I18n.so, ../../bin/libKF6SonnetCore.so, ../../lib/libQt6Multimedia.so); the musl loader resolves slash-containing DT_NEEDED entries against the process CWD, so the links have to be created below every CTest test directory before running the upstream suite (kcalendarcore / ktextaddons 1.5.0 precedent)."
  - "With the soname flags restored (CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG/C_FLAG) the ktextaddons libraries carry a proper DT_SONAME, but the DT_NEEDED entries recorded for dependency libraries that themselves lack DT_SONAME stay absolute conan-cache paths - the same shape kio 6.26.0 exhibits."
