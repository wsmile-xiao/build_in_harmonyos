# conandata.yml - ktextaddons 1.5.0
sources:
  url: "https://github.com/KDE/ktextaddons/archive/refs/tags/v1.5.0.tar.gz"
  sha256: "fe1825f510c19eed31d5963e1aeef3a24bb99366e582a22504cdde5748d8be17"

patches:
  "1.5.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "0001 drop KIO from the required KF6 component set (ohpcd kio is KIOCore-only, no KIOWidgets/KIOGui targets; the only consumer is removed by 0002-0005) and soften Qt6Keychain from TYPE REQUIRED to OPTIONAL so the build proceeds when the library is absent"
      patch_type: "portability"
    - patch_file: "patches/0002-textcustomeditor-CMakeLists.txt.patch"
      patch_description: "0002 drop the private KF6::KIOWidgets link item from KF6TextCustomEditor"
      patch_type: "portability"
    - patch_file: "patches/0003-textcustomeditor-plaintexteditor-plaintexteditor.cpp.patch"
      patch_description: "0003 remove the KIO::KUriFilterSearchProviderActions include/member/web-shortcut context menu block from PlainTextEditor and the dead QtDBus includes (no QDBusConnection use in this TU, Qt6 DBus module not published on the ohpcd baseline)"
      patch_type: "portability"
    - patch_file: "patches/0004-textcustomeditor-richtexteditor-richtexteditor.cpp.patch"
      patch_description: "0004 remove the KIO::KUriFilterSearchProviderActions include/member/web-shortcut context menu block from RichTextEditor and the dead QtDBus includes"
      patch_type: "portability"
    - patch_file: "patches/0005-textcustomeditor-plaintexteditor-autotests-CMakeLists.txt.patch"
      patch_description: "0005 drop KIOWidgets from the plaintexteditor autotests link set"
      patch_type: "portability"
    - patch_file: "patches/0006-texttranslator-translator-plugins-CMakeLists.txt.patch"
      patch_description: "0006 guard the deepl/libretranslate translator plugins (Qt6Keychain credential storage; qtkeychain on ohpcd would pull a second Qt tree via qtbase-sql-dbus) behind if(TARGET qt6keychain) so they are skipped gracefully"
      patch_type: "portability"
    - patch_file: "patches/0007-CMakeLists.txt.patch"
      patch_description: "0007 remove -DQT_NO_CAST_FROM_ASCII (added by KDEFrameworkCompilerSettings): kconfig 6.26 removed the deprecated KConfigGroup(KConfigBase*, const char*) overload, so the KF5-style char-array config group names (9 static const char[] names + 8 string-literal call sites) can only compile through the implicit QString(const char*) conversion"
      patch_type: "portability"
    - patch_file: "patches/0008-googleengineplugin-QRegularExpression.patch"
      patch_description: "0008 add the missing #include <QRegularExpression> to googleengineplugin.cpp: the file uses QRegularExpression but only had the forward declaration from qstringfwd.h, which fails to compile on Qt 6.11 (incomplete type)"
      patch_type: "portability"
