  - patches/0002-textcustomeditor-CMakeLists.txt.patch
  - patches/0003-textcustomeditor-plaintexteditor-plaintexteditor.cpp.patch
  - patches/0004-textcustomeditor-richtexteditor-richtexteditor.cpp.patch
  - patches/0005-textcustomeditor-plaintexteditor-autotests-CMakeLists.txt.patch
  - patches/0006-texttranslator-translator-plugins-CMakeLists.txt.patch
test_results:
  type: see notes
  upstream: "N=62 upstream-registered tests: 56/56 executed passed (100%), 6 excluded for OHOS sandbox environment limits (2 network HTTP to kde.org, 3 icon-theme assertion, 1 network-hanging widget init; reasons per-test in notes.md); deepl/libretranslate plugin autotests not built (plugins skipped via qt6keychain guard, patch 0006)"
  test_package: "consumer smoke: ctest 1/1 + direct binary run 6/6 assertions ALL PASS (TextUtils::ConvertText::normalize/upperCase/lowerCase + TextAddonsWidgets::SlideContainer, real API, R34)"
source_url: https://github.com/KDE/ktextaddons/archive/refs/tags/v1.5.0.tar.gz
source_sha256: fe1825f510c19eed31d5963e1aeef3a24bb99366e582a22504cdde5748d8be17
knowledge_gained:
  - "kio on ohpcd is a KIOCore-only package (KIOCORE_ONLY=ON): the KIOWidgets/KIOGui targets do not exist. Consumers of KIO::KUriFilterSearchProviderActions must either patch the usage out or wait for a full kio publication; the web-shortcut menu feature is the only ktextaddons consumer and is removed by patch."
  - "qtkeychain/0.14.2 on ohpcd requires qtbase-sql-dbus/6.11.1, a second Qt package tree that conflicts with the plain qtbase/6.11.1 baseline (duplicate Qt6::Core cmake targets). Packages whose keychain usage is confined to optional plugins should soften the find_package to TYPE OPTIONAL and guard the plugin subdirectories with if(TARGET qt6keychain)."
  - "QtDBus includes in ktextaddons 1.5.0 plaintexteditor.cpp/richtexteditor.cpp are dead code (no QDBusConnection call sites); Qt6 DBus is not published on the ohpcd qtbase baseline, so the includes must be removed by patch."
  - "ktextaddons upstream concentrates all find_package calls in the top-level CMakeLists.txt (subdirectory CMakeLists only reference targets); the QT_MAJOR_VERSION/KF_MAJOR_VERSION pair selects Qt6/KF6 and the textedittexttospeech subdirectory is auto-skipped when Qt6TextToSpeech is not found."
