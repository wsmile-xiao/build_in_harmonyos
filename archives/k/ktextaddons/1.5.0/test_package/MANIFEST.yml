# test_package/MANIFEST.yml
# Upstream and consumer test declaration for ktextaddons/1.5.0.

package: ktextaddons/1.5.0
homepage: https://invent.kde.org/libraries/ktextaddons

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E <OHOS-excluded>"

upstream_tests:
  - file: textutils/autotests/
    source: ktextaddons-1.5.0/textutils/autotests/
    description: "TextUtils ConvertText autotests (normalize/case conversion)"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON"
  - file: textaddonswidgets/autotests/
    source: ktextaddons-1.5.0/textaddonswidgets/autotests/
    description: "TextAddonsWidgets SlideContainer autotests"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON, offscreen platform"
  - file: textautocorrection/*/(auto)tests/
    source: ktextaddons-1.5.0/textautocorrection/
    description: "TextAutoCorrection core/widgets autotests"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON"
  - file: textemoticons/*/autotests/
    source: ktextaddons-1.5.0/textemoticons/
    description: "TextEmoticons core/widgets autotests (emoji model, unicode emoticons)"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON"
  - file: textcustomeditor/*/autotests/
    source: ktextaddons-1.5.0/textcustomeditor/
    description: "TextCustomEditor plain/rich/widgets autotests"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON, offscreen platform; KIOWidgets removed by patch 0005"
  - file: textgrammarcheck/*/autotests/
    source: ktextaddons-1.5.0/textgrammarcheck/
    description: "TextGrammarCheck common/grammalecte/languagetool autotests; network-dependent languagetool job tests excluded (no outbound network in the OHOS build sandbox)"
    command: "ctest --output-on-failure -E languagetoolresultjobtest|languagetoolgetlistoflanguagejobtest"
    condition: "run in the Conan build with BUILD_TESTING=ON"
  - file: texttranslator/**/(auto)tests/
    source: ktextaddons-1.5.0/texttranslator/
    description: "TextTranslator core/widgets + bing/google/lingva/yandex plugin autotests; deepl/libretranslate plugin tests skipped together with their plugins (Qt6Keychain not on the ohpcd baseline, patch 0006)"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke: TextUtils::ConvertText::normalize/upperCase/lowerCase + TextAddonsWidgets::SlideContainer (real APIs, R34)."
    command: "conan create (test_package builds and runs test_ktextaddons)"

assertion_count: 6
