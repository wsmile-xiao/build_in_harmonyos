package: ktoblzcheck/1.53
homepage: "https://ktoblzcheck.sourceforge.net/"

upstream_check_command: "cmake -B build -DENABLE_BANKDATA_DOWNLOAD=OFF && cmake --build build"
upstream_test_in_build: true
upstream_test_command: "ctest"

upstream_tests:
  - name: ktoblzcheck
    command: "ktoblzcheck-bin --file=<bankdata> 20050550 1262693334"
    expect: "valid"
  - name: ibanchk_de
    command: "ibanchk \"DE89 3704 0044 0532 0130 00\""
    expect: "exit 0"
  - name: ibanchk_fr
    command: "ibanchk \"fr14 2004 1010 0505 0001 3m02 606\""
    expect: "exit 0"
  - name: benchmark
    command: "benchmark 5 <bankdata>"
    expect: "exit 0"

test_package_tests:
  - file: test_ktoblzcheck.cpp
    description: "链接 libktoblzcheck 调用 findBank 查询真实银行（10000000 Bundesbank）并执行 check() 校验，断言银行存在且校验结果非 bank-not-found"
    command: "cmake build + run test_ktoblzcheck <bankdata>"

assertion_count: 1
