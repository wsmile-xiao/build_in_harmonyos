  source_family: kea-hook-limits/3.0.3 + kea-hook-ping-check/3.0.3
  note: "补丁 0001/0002 作用于 Kea 3.0.3 顶层 meson.build 与 src/lib/dhcp/iface_mgr_linux.cc，与家族模板 kea-hook-limits 逐字节一致；补丁 0003/0004（configure 期脚本 execve 修补）与家族配方 kea-hook-ping-check 逐字节一致。同一上游源码树、同一平台差异，0001-0004 整组复用零改动；0005（沙箱 netlink bind 拒绝的 getifaddrs 回退）为本插件新增，由 HA 首次暴露（首个构造 IfaceMgr 的家族成员）"
