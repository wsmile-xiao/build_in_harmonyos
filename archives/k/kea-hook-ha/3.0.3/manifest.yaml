# 版本级 manifest — kea-hook-ha 3.0.3
# 文件位置: archives/k/kea-hook-ha/3.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.3"
software: "kea-hook-ha"

# 编译状态: published | built | failed | archived
status: published

build_date: "2026-10-02"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================

artifacts:
  - "lib/kea/hooks/libdhcp_ha.so"
  - "lib/libkea-*.so* (hook 运行时依赖闭包，20 个 kea 库)"

# ============================================================
# 上游测试（build() 内真实执行）
# ============================================================

upstream_tests:
  command: "meson test -v -C <builddir> dhcp-ha-lib-tests dhcp-ha-libload-tests"
  suites_run: 2
  # 源码 TEST_F 宏计数：tests/ 443（10 个测试文件）+ libloadtests/ 7
  cases_in_source: 450
  root_cases: 0
  root_cases_detail: "无：HA 测试全部走本地回环（127.0.0.1）与纯逻辑路径（无 SOCK_RAW、无特权依赖、无外部数据文件、无证书文件依赖），与 ping-check 的 48 个 Root 组用例形成对比"
  # 真机实测（2026-10-02 真机 conan create 实跑，Verdict: PASS，见版本级 notes.md）：
  # libload 1/2 OK 0.34s（7 tests）+ lib-tests 2/2 OK 31.39s（443 tests）
  cases_run: 450
  cases_passed: 450
  cases_failed: 0
  cases_skipped: 0
  cases_unregistered: 0
  cases_unregistered_reason: "无：源码 TEST_F 宏 450 个（443 + 7），本配置全部注册"

# ============================================================
# 鸿蒙特有测试（test_package，2 个用例）
# （test_package 另含 1 个通用消费者契约测试 test_ha_hook，与兄弟 kea 配方相同，
#  不属鸿蒙特有；声明见 test_package/MANIFEST.yml 的 test_package_tests）
# ============================================================

ohos_specific_tests:
  count: 2
  entries:
    - "test_package/test_ohos_platform.c → test_ohos_platform（平台 ABI）"
    - "test_package/test_ohos_runtime.c → test_ohos_runtime（运行时闭包）"
  command: "./test_ohos_platform <so> && ./test_ohos_runtime <so>"
  checks:
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so），且不含 GNU libstdc++ 命名"
    - "OHOS 加载器 dlopen(RTLD_NOW|RTLD_LOCAL) 可解析插件及其 Kea 运行库闭包（实测 DT_NEEDED 项数见 notes.md）"
    - "包内 Kea 运行时库（lib/libkea-*.so*）在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 成功（实测 40/40）"
    - "闭包驻留后 hook 仍可加载，load/unload 契约符号可在运行时解析"
  # 真机实测（2026-10-02，鸿蒙特有 2/2 全绿；消费者契约 test_ha_hook 1/1，见版本级 notes.md）
  cases_run: 2
  cases_passed: 2
  cases_failed: 0

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson.build.patch"
  - "0002-src-lib-dhcp-iface_mgr_linux.cc.patch"
  - "0003-meson.build.patch"
  - "0004-src-lib-process-cfgrpt-meson.build.patch"
  - "0005-src-lib-dhcp-iface_mgr_linux-getifaddrs-fallback.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Meson 报告 OHOS 为 system='harmonyos'，Kea 的 build_machine.system() 白名单不含它：需在顶层归一化为 linux 才会选中 Linux 源码分支（iface_mgr_linux.cc / pkt_filter_lpf.cc）"
  - "OHOS sysroot 的 linux/socket.h（bionic 派生）定义 struct sockaddr_storage，与 musl sys/socket.h 冲突：用 define-guard 重命名内核侧定义（__linux__ && !__GLIBC__ 守卫）"
  - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core sp_thread_sleep.hpp 依赖它：定义 BOOST_SP_NO_PTHREAD_SETCANCELSTATE（boost 官方逃生宏）"
  - "OHOS 上 CPython subprocess 走 posix_spawn，不按 PATH 解析可执行名：裸名 'llvm-ar'（来自宿主 AR 环境变量）执行报 ENOENT，即使 which 能找到——须在 machine file 注入绝对路径"
  - "Conan MesonToolchain 默认只设 pkg_config_path=generators_folder，需同时使用 PkgConfigDeps 生成依赖 .pc，meson 才能解析 boost/log4cplus/openssl/gtest"
  - "Meson 的 cpp.run() 特性探针在 native 构建下会真实执行，host 共享依赖（log4cplus）必须通过 LD_LIBRARY_PATH 在配置期可见（缺失时探针返回 127，上游 meson.build:824 报 Unknown variable 'log4cplus'）"
  - "制品仓 boost/1.85.0 无 libboost_system，需 meson >= 1.10 的 header-only 模块回退；meson 版本必须 >= 1.10"
  - "HA 为 v4/v6 双协议 hook：除服务配置与租约提交 callout 外，ha_service 的 190 例以真实 HA 服务实例 + 回环通信驱动通信状态机（communication_state 57 例），全部零 root 实跑"
  - "OHOS 内核拒绝 shebang 脚本 execve（与可执行位无关）：conan 的 meson 包 bin/meson 是 shell 包装脚本，必须 sh '<meson 包>/bin/meson' 调用（Error 126 实测）；meson 的 run_command 数组首参语法（['/bin/sh', 脚本] / [python3, 脚本]）真机验证通过"
  - "Kea configure 期直接执行自带脚本：scripts/env.sh 探包类型、scripts/grabber.py 做文件列表——补丁把脚本变量重定义为解释器前缀数组，所有调用点零改动（家族补丁 0003）"
  - "configure 期还有两处 configure_file(command:) 直接执行脚本：生成的 config-report.sh（顶层 meson.build:1025）与 tools/mk_cfgrpt.sh（src/lib/process/cfgrpt/meson.build）——同样经 /bin/sh 前缀修复（补丁 0003 hunk 2 + 0004）"
  - "OHOS /storage 沙箱拒绝创建符号链接（ln -s → EPERM）：meson 以 version: 'N.M.K' 构建共享库时只以符号链接发布 soname 名，链接名文件在 OHOS 上根本不存在，加载器按 NEEDED 名查找全部落空。build() 在 compile 后以复制方式物化 soname 名（_materialize_sonames，幂等），meson test 与 package() 遍历都能吃到"
  - "真机曾出现 package 产物落盘为 0 字节的瞬时问题（/storage 写回异常）：package() 收尾增加空产物复核，0 字节的 Kea 库从构建树重拷（自愈 + WARNING 日志；重拷后复验，有界重试 3 次仍为 0 则打包直接失败），test_package 的运行时闭包测试（包内 Kea 库逐个 dlopen）兜底拦截回归"
  - "OHOS app 沙箱限制并发进程数：ninja 默认按 20 核并发（~45 个活动 spawn）会触发 posix_spawn EAGAIN 中断编译——meson compile 须限并发 -j 8（家族配方 host-cmds 实测，本配方沿用）"
  - "OHOS 沙箱对 AF_NETLINK 只放行 socket() 创建、拒绝显式 bind()（EPERM）：Kea 的 Linux IfaceMgr 构造即向 detectIfaces() → Netlink::rtnl_open_socket() 的 bind 失败地雷上撞，抛 IfaceDetectError（'Failed to bind netlink socket.'）；HA 建伙伴连接时构造 IfaceMgr（ha_service.cc addExternalSocket），首次暴露（48 例测试失败）。沙箱内 getifaddrs()/if_nametoindex/ioctl 全部可用——回退 getifaddrs() 枚举（AF_PACKET 取 MAC/HWType）与上游自带 BSD/Solaris 实现同构，netlink 正常时回退永不触发（kea-hook-ha 补丁 0005，本插件新增）"
  - "家族复用取证：HA 与已合入的 kea-hook-limits/kea-hook-ping-check/kea-hook-flex-option/kea-hook-bootp 同属 Kea 3.0.3 单源码树（src/hooks/dhcp/high_availability/ 平级目录），0001-0004 补丁整组逐字节复用（0001/0002 与 limits 一致、0003/0004 与 ping-check 一致），0005 为本插件新增（沙箱 netlink 回退）；本配方测试面新增结论：HA hook 的 450 例（443 + 7）在 OHOS 沙箱零 root 零 SKIP 全实跑，且 libloadtest 证明 v4/v6 双协议加载（validLoadDhcp4 + validLoadDhcp6）与拒绝加载（invalidDaemonLoad）真机成立"

