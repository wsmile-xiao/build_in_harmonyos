# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-ha/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的两个 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> dhcp-ha-lib-tests dhcp-ha-libload-tests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-ha-lib-tests dhcp-ha-libload-tests"

# 上游实际运行的测试程序（源码 TEST/TEST_F 宏计数：443 + 7 = 450）
upstream_tests:
  - file: dhcp-ha-lib-tests
    source: src/hooks/dhcp/high_availability/tests/
    description: >-
      High Availability hook 单元测试（HA 协议核心库，共 443 例：
      command_creator 26、communication_state 57、ha_config 61、ha_impl 62、
      ha_mt 3、ha_relationship_mapper 5、ha_service 190、
      lease_sync_filter 5、lease_update_backlog 2、query_filter 32），
      本配置注册 10 个测试文件的全部用例（与源码 TEST_F 宏数一致，无未注册用例）。
      全部基于本地回环（127.0.0.1）与纯逻辑用例：无 SOCK_RAW、无特权依赖，
      TLS 材料由 Kea testutils 自带测试 CA 生成，OHOS 沙箱下零 root 全实跑
    command: "./dhcp-ha-lib-tests"
  - file: dhcp-ha-libload-tests
    source: src/hooks/dhcp/high_availability/libloadtests/
    description: >-
      7 个 gtest 用例（load_unload 3 + close 4），校验 libdhcp_ha.so 可被
      Kea hook 框架在 dhcp4/dhcp6 两种服务形态下加载/卸载与关闭
      （meson 注册的套件名 dhcp-ha-libload-tests）
    command: "./dhcp-ha-libload-tests"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_ha_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload 契约符号与 hook ABI 版本"
    command: "./test_ha_hook <package>/lib/kea/hooks/libdhcp_ha.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 libdhcp_ha.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc libc.so.6、
      链接 libc++_shared.so）并验证 OHOS 加载器可 dlopen(RTLD_NOW) 解析
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_ha.so"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 包内
      20 个 Kea 运行时库（lib/libkea-*.so*），校验完整 NEEDED 闭包可解析、
      闭包驻留后 hook 仍可加载且 load/unload 契约符号可解析
    command: "./test_ohos_runtime <package>/lib/kea/hooks/libdhcp_ha.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（test_package 内，实测结果见版本级 notes.md）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <so> && ./test_ohos_runtime <so>"

# 上游测试用例宏总数（本次适配源码计数：443 + 7；实际注册执行数见版本级 manifest）
assertion_count: 450
