software: kea-hook-ha
display: "ISC Kea High Availability hook"
description: "High Availability (HA) hook plug-in for the ISC Kea DHCPv4/DHCPv6 servers: redundant server cluster (hot-standby / load-balancing / passive-backup) with heartbeat, lease synchronisation and maintenance command coordination"
category: network
homepage: "https://www.isc.org/kea/"
license: MPL-2.0
build_system: meson

# 跨版本通用的 OHOS 适配知识（与 kea-hook-limits/kea-hook-ping-check/kea-hook-flex-option/kea-hook-bootp 家族共享，逐项保留）
ohos_adaptation:
  key_points:
    - "Meson 在 OHOS 上报告 system='harmonyos'，Kea 的平台白名单不含它：需归一化为 linux 才能选中 Linux 源码分支"
    - "OHOS sysroot 的 linux/socket.h 与 musl sys/socket.h 都定义 struct sockaddr_storage，包含 netlink 头时需 define-guard"
    - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core 需 BOOST_SP_NO_PTHREAD_SETCANCELSTATE"
    - "boost 必须固定 1.85.0（1.90/1.91 制品仓包缺 Kea 实际使用的头文件），且 meson 需 >= 1.10"
    - "OHOS 上 Python subprocess 不解析 PATH：meson 探测静态链接器时须给 ar/ranlib 绝对路径"
    - "OHOS 内核拒绝 shebang 脚本 execve：configure 期脚本（env.sh/grabber.py/config-report.sh/mk_cfgrpt.sh）与 conan 的 meson 包装脚本一律经解释器前缀调用"
    - "OHOS /storage 沙箱拒绝符号链接：meson 版本化 soname 名需以复制方式物化"
    - "OHOS app 沙箱限制并发进程：meson compile 须 -j 8 防 posix_spawn EAGAIN"
    - "OHOS 沙箱拒绝 netlink bind（socket 可建、bind EPERM）：Kea Linux IfaceMgr 构造即抛 IfaceDetectError，需在 detectIfaces() 回退 getifaddrs() 枚举（kea-hook-ha 补丁 0005，本插件新增）"
  common_dependencies:
    - boost
    - log4cplus
    - openssl

# 版本索引（所有已归档版本，含状态）
versions:
