# conandata.yml — klibc-dash 2.0.14
# 上游：klibc（minimalistic libc subset for initramfs，H. Peter Anvin 等维护）
# 本包为其源码树内 usr/dash 组件（内嵌 dash 快照，构建产物 static/sh）的独立打包。
# 源码：kernel.org 官方发布归档 klibc-2.0.14.tar.xz（2025-03-04），固定 SHA256。
# 许可证：usr/dash 为 BSD-3-Clause（Herbert Xu / Regents of the University of
# California）；静态链接入的 usr/klibc 为 BSD/MIT + Linux 内核派生文件 GPL-2.0。

sources:
  url: "https://www.kernel.org/pub/linux/libs/klibc/2.0/klibc-2.0.14.tar.xz"
  sha256: "281bfb683e196818412af70b8968b7726475a80ff1c4bd67119e6bf5059f9075"

patches:
  "2.0.14":
    - patch_file: "patches/0001-usr-include-ohos-asm-layout.patch"
      patch_description: "usr/include/Kbuild：asm 头由 ln -fsn 符号链接改为 cp -rf 复制（规避 HMDFS 符号链接限制、物化 asm 头），并用 KLIBCASMDIR 变量支持 OHOS 的 asm 头布局（aarch64-linux-ohos/asm 而非标准 asm-arm64）"
      patch_type: "portability"
    - patch_file: "patches/0002-signal-kernel-nsig-compat.patch"
      patch_description: "usr/include/signal.h：OHOS 内核头用 _KERNEL__NSIG 而非标准 Linux 的 _NSIG，加映射使 sys_siglist/sys_sigabbrev 能解析 _NSIG"
      patch_type: "portability"
    - patch_file: "patches/0003-kbuild-sharedlib-cp-not-ln.patch"
      patch_description: "usr/klibc/Kbuild：共享库 soname 由 ln 硬链接改为 cp 复制（HMDFS 不支持硬链接，见知识库 E079）"
      patch_type: "portability"
    - patch_file: "patches/0004-kbuild-libc-and-dash-only.patch"
      patch_description: "顶层 Kbuild：all 目标只构建 scripts/basic + usr/klibc + usr/dash（本包只需 dash 及其链接的 klibc libc），跳过 usr/kinit、usr/utils、usr/gzip 等其他工具"
      patch_type: "portability"
    - patch_file: "patches/0005-mktokens-tmpdir.patch"
      patch_description: "usr/dash/mktokens：临时文件路径由硬编码 /tmp/ka$$ 改为 ${TMPDIR:-/tmp}/ka$$（OHOS /tmp 只读，见知识库 E002；与同树 mkbuiltins 的既有写法一致）"
      patch_type: "portability"
    - patch_file: "patches/0006-tests-malloctest3-no-builtin.patch"
      patch_description: "usr/klibc/tests/Kbuild：对 malloctest3.o 追加 -fno-builtin。clang 在 -Os/-O1/-O2 下按 C 标准/glibc 语义把 malloc(0) != NULL 折叠为真（反汇编可见 assert 被替换为无条件 __assert_fail），而 klibc 的 malloc(0) 语义为返回 NULL，上游第 1 条断言即断此点；仅关该文件的语义假设，保留 -Os 与上游源码/断言不变"
      patch_type: "portability"
    - patch_file: "patches/0007-tests-testrand48-exit-code.patch"
      patch_description: "usr/klibc/tests/testrand48.c：上游硬编码 return 1（该程序只打印 rand48 值供人工比对、无任何断言），改为 return 0 以便纳入基于退出码的通过/失败统计（上游测试用例修改说明见 notes.md）"
      patch_type: "portability"
