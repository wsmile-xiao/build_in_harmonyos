# test_package/MANIFEST.yml
# 上游测试声明文件 —— CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
package: klibc-dash/2.0.14
homepage: "https://www.kernel.org/pub/linux/libs/klibc/"

# 上游测试命令（klibc 顶层 Makefile:120 `test: klibc` → scripts/Kbuild.klibc obj=usr/klibc/tests）
upstream_check_command: "make test"

# conanfile.py build() 中是否已构建并运行上游测试
upstream_test_in_build: true
upstream_test_command: "make test  # 构建 usr/klibc/tests，随后逐个签名执行 39 个用例"

# 上游测试清单（真实清点结果，证据见 notes.md「上游测试清单」）
# 说明：本包目标组件是 klibc 源码树内的 usr/dash，该目录**无任何上游测试文件**
#      （无 tests/ 目录、无 make check/ctest 注册；README.dash 记录导入时未包含 dash 的
#       tests/）。上游树内唯一的自动化测试入口是 usr/klibc/tests（dash 静态链接的
#      klibc libc 的测试套件），共 39 个用例。
upstream_tests:
  - suite: "usr/klibc/tests"
    kind: "kbuild 构建的 C 测试程序（static）"
    count: 39
    passed: 39
    failed: 0
    skipped: 0
    runner: "conanfile.py build() → _run_upstream_tests()"
    args_required:
      - name: fnmatch
        args: '"*.c" "foo.c" 0'
      - name: mmaptest
        args: "可写临时文件路径（上游硬编码 /tmp，OHOS /tmp 只读）"
    cases_modified:
      - name: malloctest3
        change: "usr/klibc/tests/Kbuild: 该单文件追加 KLIBCCFLAGS_malloctest3.o += -fno-builtin"
        reason: "clang 15 在 -Os/-O1/-O2 下把 malloc(0) != NULL 折叠为真（反汇编可见 assert 被替换为无条件 __assert_fail），与 klibc malloc(0) 返回 NULL 的语义冲突；源码与断言未改，保留 -Os"
      - name: testrand48
        change: "usr/klibc/tests/testrand48.c: return 1 -> return 0"
        reason: "上游硬编码 return 1，该程序只打印 rand48 值供人工比对、无断言，改 0 以便纳入退出码统计"
    shared_variants: "39 个 shared 二进制已构建但在 OHOS 上不可执行（PT_INTERP=/lib/klibc-<hash>.so；/lib 为只读系统分区）"
  - suite: "usr/dash（组件自身）"
    kind: "无"
    count: 0
    note: "usr/dash 无 tests/ 目录、无测试注册；Debian 打包期冒烟入口 sh -c \"exit\" 已在 build() 执行（rc=0）"

# test_package 中自带的测试（消费者视角验证，不能替代上游测试统计）
test_package_tests:
  - file: run_tests.sh
    description: "启动器：用 bash 起 ELF，实际用例由被测包内 bin/sh 解释执行"
    command: 'bash run_tests.sh <packaged bin/sh> test_dash.sh'
  - file: test_dash.sh
    description: >-
      POSIX shell 行为用例 + 3 个 [OHOS-*] 平台专有用例（TMPDIR 可写、pwd 内建 cwd、
      签名 ELF 自我重执行）
    command: '"<packaged sh>" test_dash.sh <packaged sh>'
    result: "TOTAL=28 PASS=28 FAIL=0 SKIP=0"

# test_package 断言总数（28 个执行用例 + conanfile build() 中 2 项 OHOS 静态校验）
assertion_count: 30
