knowledge_gained:
  - "klibc-dash = klibc 源包内 usr/dash 组件的独立打包（内嵌 dash 快照，产物 sh）；版本号口径取 klibc 发行版本（usr/klibc/version = 2.0.14），不是 dash 自身版本串（config.h 内的 0.5.7）（knowledge_ref: DRAFT-COMPONENT-SPLIT-FROM-UMBRELLA-TARBALL）"
  - "klibc 根 Kbuild 的 all 目标会连带构建 usr/kinit、usr/dash、usr/utils、usr/gzip；单组件成包时用 patch 收窄 all 目标，只保留本组件与其同树依赖（knowledge_ref: DRAFT-COMPONENT-SPLIT-FROM-UMBRELLA-TARBALL）"
  - "usr/dash/Kbuild 用 EXTRA_KLIBCCFLAGS 承载 -include config.h 与 -DBSD -DSMALL -DJOBS=0 -DHAVE_CONFIG_H -DSHELL 配置宏；GNU make 命令行变量优先级会整体覆盖该变量（:=/+= 全失效），导致 dash 丢失 config.h 与配置宏 —— 编译 system.h 时 long sysconf(int) 声明被 klibc 的 sysconf 函数式宏展开，报 'expected )' / 'cannot redeclare builtin function __builtin_constant_p'。正解是把 --target / -m <emu> 写进 CC / LD 的内容，而不是 EXTRA_KLIBCCFLAGS / EXTRA_KLIBCLDFLAGS（knowledge_ref: DRAFT-KBUILD-EXTRA-KLIBCCFLAGS-CMDLINE-OVERRIDE）"
  - "usr/dash/mktokens 硬编码 /tmp/ka$$ 写临时文件；OHOS /tmp 只读（E002）导致 \"can't create /tmp/ka12264: Read-only file system\" 而中断 token.h 生成；同一 tarball 的 usr/dash/mkbuiltins 已用 ${TMPDIR:-/tmp} 写法，patch 对齐即可（knowledge_ref: E002）"
  - "klibc 的 dash（-DBSD=1 -DSMALL -DJOBS=0，config.h 关闭 glob/fnmatch/strtod/getrlimit）在 OHOS aarch64 上可正常构建并运行：printf/算术/函数/循环/case/参数展开/命令替换/管道/重定向/heredoc/子 shell/read 内建均通过（knowledge_ref: E325）"
  - "klibc 静态 ELF（含 sh）在 OHOS 必须带 .codesign 段否则内核拒绝 exec（E077）；package() 内 binary-sign-tool -selfSign 1 签名后 chmod 755（knowledge_ref: E077）"
  - "上游 usr/dash 无自动化测试（无 tests/ 目录、无注册；dash 的 tests/ 未随 klibc 导入），上游树内唯一自动化测试入口是 make test -> usr/klibc/tests（39 用例，实测 39/39 通过）；逐个用例输出必须重定向到独立日志文件，否则 inet_aton/inet_pton 的原始地址字节会让工具链文本解码崩溃（knowledge_ref: DRAFT-UPSTREAM-TEST-BINARY-NONUTF8-LOG-DECODE-CRASH, E265）"
  - "上游用例 malloctest3 在 clang 15 的 -Os/-O1/-O2 下失败：编译器按 C 标准/glibc 语义把 malloc(0) != NULL 折叠为真（反汇编可见 assert 被替换为无条件 __assert_fail 调用、malloc 调用被消除），而 klibc 的 malloc(0) 语义是返回 NULL；对该单文件加 -fno-builtin 即可（保留 -Os、源码与断言语义不变，-O0/-fno-builtin 均通过）（knowledge_ref: E265）"
  - "上游用例 testrand48 硬编码 return 1（打印型样例、无断言），需改为 return 0 才能纳入退出码统计；此类'非判定型样例'在跨平台适配中应作为'上游测试用例修改说明'如实申报（knowledge_ref: E265）"
  - "上游用例的 static/shared 双形态：shared 形态以 klibc 共享库本身作为 ELF 解释器（PT_INTERP=/lib/klibc-<hash>.so），而 OHOS /lib -> /system/lib 为只读系统分区 → shared 形态在 OHOS 上结构性不可执行；可执行用例数应据此申报（knowledge_ref: E002, E265）"
  - "OHOS 上 /system/bin/sh（mksh）无法 exec ELF，test_package 需用 bash 作启动器、再由被测包内 sh 解释用例脚本，并显式校验包内 ELF 的 .codesign 与无 PT_INTERP（knowledge_ref: E325, E077）"

