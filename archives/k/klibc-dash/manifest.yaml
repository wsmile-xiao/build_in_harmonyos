software: klibc-dash
display: "klibc-dash"
description: "klibc 内嵌的 dash shell（initramfs POSIX /bin/sh），静态链接 klibc libc"
category: system
homepage: "https://www.kernel.org/pub/linux/libs/klibc/"
license: BSD-3-Clause AND MIT AND GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "klibc 为 kernel-style kbuild 构建（自定义 Makefile），无 make install（HarmonyOS 无 GNU install，E098），用 Conan copy 手动打包"
    - "根 Kbuild 的 all 目标会连带构建 usr/kinit/usr/utils/usr/gzip —— patch 0004 收窄为 scripts/basic + usr/klibc + usr/dash（本包只需 dash 及其链接的同树 libc）"
    - "OHOS SDK sysroot 提供 linux/ 与 asm-generic/ 头，但 asm 头位于 aarch64-linux-ohos/asm（非标准 asm-arm64）—— patch 0001 用 KLIBCASMDIR 变量适配，并把 ln -fsn 符号链接改 cp -rf（规避 HMDFS 符号链接限制）"
    - "OHOS 内核 UAPI 用 _KERNEL__NSIG 而非 Linux _NSIG —— patch 0002"
    - "HMDFS 不支持硬链接（E079）—— patch 0003 把 klibc 共享库 soname 的 ln -f 改 cp -f"
    - "usr/dash/mktokens 硬编码 /tmp/ka$$ 写临时文件，OHOS /tmp 只读（E002）—— patch 0005 改为 ${TMPDIR:-/tmp}"
    - "架构标志必须写进 CC/LD 的命令行内容而非 EXTRA_KLIBCCFLAGS/EXTRA_KLIBCLDFLAGS 变量：usr/dash/Kbuild 用 EXTRA_KLIBCCFLAGS 承载 -include config.h 与 -DBSD -DSMALL -DJOBS=0 -DHAVE_CONFIG_H 等 dash 配置宏，命令行变量会整体覆盖它，导致 system.h 的 sysconf() 声明与 klibc 的 sysconf 函数式宏冲突而编译失败"
    - "OHOS 要求可执行 ELF 带 .codesign 段，否则内核拒绝 exec（E077）—— package() 内 binary-sign-tool -selfSign 1 签名"
    - "产物为静态自包含 bin/sh（klibc libc 静态链接，无 PT_INTERP，不依赖 OHOS musl 动态加载器）"
    - "上游测试 make test -> usr/klibc/tests 39 用例实测 39/39 通过；两处测试侧修改已申报：malloctest3 单文件 -fno-builtin（clang -Os 折叠 malloc(0)!=NULL）、testrand48 硬编码 return 1 -> return 0"
    - "上游用例的 shared 形态在 OHOS 上结构性不可执行（PT_INTERP=/lib/klibc-<hash>.so，/lib 为只读系统分区），覆盖口径按可执行的 static 39 个申报"
  common_dependencies: []

versions:
  "2.0.14":
    status: built
    build_date: "2026-09-25"
