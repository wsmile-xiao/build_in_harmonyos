# test_package/MANIFEST.yml
# Upstream and consumer test declaration for ki18n5/5.116.0.

package: ki18n5/5.116.0
homepage: https://invent.kde.org/frameworks/ki18n

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E \"^(kcatalogtest|kcountrytest|kcountrysubdivisiontest|ktimezonetest)$\""

upstream_tests:
  - file: autotests/
    source: ki18n-5.116.0/autotests/
    description: >
      KI18n upstream CTest suite. With BUILD_WITH_QML=OFF upstream itself
      only registers: ki18n-klocalizedstringtest, ki18n-klazylocalizedstringtest,
      ki18n-ktranscripttest, ki18n-ktranscriptcleantest, ki18n_install
      (CMake install test), plus the 4 iso-codes-dependent tests
      (kcatalogtest/kcountrytest/kcountrysubdivisiontest/ktimezonetest).
      The QML test (ki18ndeclarativetest) and the localedata-qml module are
      not registered by upstream when Qt${QT_MAJOR_VERSION}::Qml is absent.
    command: "ctest --output-on-failure"
    status: "executed in build(); exclusions below"

upstream_test_exclusions:
  - tests: "kcatalogtest, kcountrytest, kcountrysubdivisiontest, ktimezonetest"
    reason: >
      Require iso-codes JSON data files via the optional upstream IsoCodes
      runtime dependency, which is not published on the ohpcd artifact
      repository (same exclusion as the ki18n 6.x recipes).

test_package_tests:
  - file: test_package/test.cpp
    description: >
      Consumer smoke test, 3 checks: (1) i18n() placeholder substitution via
      KLocalizedString; (2) chained subs() formatting; (3) application
      domain accessible from the built library.
    command: "conan create (test_package builds and runs test_ki18n5)"

assertion_count: 3
