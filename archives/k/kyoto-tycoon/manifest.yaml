software: kyoto-tycoon
display: "Kyoto Tycoon"
description: "京都大亨——Kyoto Cabinet 的缓存/存储服务器（HTTP/REST/RPC 网络接口，支持内存与文件后端）"
category: db
homepage: "https://dbmx.net/kyototycoon/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "custom configure + 后缀规则 Makefile（无 VPATH），必须源内构建（同 kyoto-cabinet）"
    - "--with-kc 指向 kyoto-cabinet/1.2.80 的 Conan 包目录，zlib 走 AutotoolsDeps"
    - "Lua 扩展保持上游默认关闭（myscript.cc 只认 Lua 5.1 API）"
    - "上游测试全量运行：make check（126）+ 本地 ktserver 回环 check-remote（53）"
  common_dependencies: ["kyoto-cabinet", "zlib"]

versions:
  "0.9.56":
    packaging: conan
    status: built
    build_date: "2026-09-18"
    notes: >-
      首个 conan 配方。源内构建，-j1 串行。上游 make check 126 条 +
      本地 ktserver 回环 check-remote 53 条，共 179 条；test_package 24 项
      （TimedDB API 20 + kttimedmgr CLI 4）。Lua 服务端脚本扩展关闭。
