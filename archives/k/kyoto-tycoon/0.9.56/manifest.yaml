software: kyoto-tycoon
version: "0.9.56"
status: built
build_date: "2026-09-18"
build_system: autotools
package_type: library
license: GPL-3.0-or-later
homepage: "https://dbmx.net/kyototycoon/"

source:
  url: "https://dbmx.net/kyototycoon/pkg/kyototycoon-0.9.56.tar.gz"
  sha256: "553e4ea83237d9153cc5e17881092cefe0b224687f7ebcc406b061b2f31c75c6"
  tar_format: tar.gz

build:
  system: autotools
  in_source: true
  configure_options:
    - "--enable-static --disable-shared"
    - "--disable-lua (upstream default; Lua 5.1-only extension, see notes)"
    - "--with-kc=<kyoto-cabinet/1.2.80 package folder>"
  dependencies:
    - kyoto-cabinet/1.2.80
    - zlib/1.3.1.1 (override=True unifies kyoto-cabinet's transitive zlib/1.3.1)
  cc: clang
  cxx: clang++

artifacts:
  - include/ktcommon.h
  - include/ktutil.h
  - include/ktsocket.h
  - include/ktthserv.h
  - include/kthttp.h
  - include/ktrpc.h
  - include/ktulog.h
  - include/ktshlib.h
  - include/kttimeddb.h
  - include/ktdbext.h
  - include/ktremotedb.h
  - include/ktplugserv.h
  - include/ktplugdb.h
  - lib/libkyototycoon.a
  - libexec/ktplugservmemc.so
  - libexec/ktplugdbvoid.so
  - bin/ktutiltest
  - bin/ktutilmgr
  - bin/ktutilserv
  - bin/kttimedtest
  - bin/kttimedmgr
  - bin/ktserver
  - bin/ktremotetest
  - bin/ktremotemgr
  - lib/pkgconfig/kyototycoon.pc

validation:
  upstream_tests: "make -j1 check (126) + ktserver loopback + make -j1 check-remote (53) run in build()"
  consumer_smoke: true

# Upstream test audit (static facts from Makefile.in; pass counts pending preflight).
upstream_audit:
  check-util: 8
  check-timed: 118
  check-remote: 53
  total: 179
  excluded: "check-heavy / check-timed-heavy (not part of upstream `make check`)"

notes:
  - "Custom configure + suffix-rule Makefile without VPATH: in-source build, like kyoto-cabinet."
  - "Lua extension OFF (upstream default). Server-side Lua scripting not covered."
  - "check-remote runs against a local ktserver (127.0.0.1:1978, in-memory DB)."
