# test_package/MANIFEST.yml — kyoto-tycoon 0.9.56
type: test_package
package: kyoto-tycoon/0.9.56
backend: timed (TimedDB tree database, file-backed casket.kct)
tests:
  description: "checks against installed TimedDB: create, write, read, append, remove, iterate, close+reopen, persistence, sync/fsync, invalid path, cleanup; plus kttimedmgr CLI smoke (create/set/get/remove) on the installed binary"
  count: 24
  cpp_checks: 20
  cli_checks: 4
  source_files:
    - test.cpp
  test_framework: "custom check() + exit code"
  upstream_tests:
    make_targets:
      - "make check (check-util + check-timed)"
      - "make check-remote (against local ktserver 127.0.0.1:1978)"
    total_commands: 179
    sub_targets:
      check-util: 8
      check-timed: 118
      check-remote: 53
    excluded:
      - "check-heavy / check-timed-heavy: millions of records, not part of upstream `make check`"
    test_executables: 3
    test_tools: "ktutiltest + kttimedtest + ktremotetest; CLIs ktutilmgr/kttimedmgr/ktremotemgr"
  notes: |
    All DB files are created inside the test build directory (argv[1]).
    File locking and synchronization are NOT disabled.
    Any HMDFS incompatibility must surface as a test failure.
    The Lua scripting extension is OFF (upstream default); server-side
    Lua is not covered. See notes.md.
