# conandata.yml — kyoto-tycoon 0.9.56
# Official source: https://dbmx.net/kyototycoon/ (FAL Labs official site;
# the old fallabs.com domain is dead). Same URL + sha256 as Homebrew and
# FreeBSD ports. Verified by local download: 503581 bytes.

sources:
  url: "https://dbmx.net/kyototycoon/pkg/kyototycoon-0.9.56.tar.gz"
  sha256: "553e4ea83237d9153cc5e17881092cefe0b224687f7ebcc406b061b2f31c75c6"

patches:
  - patch_file: "patches/0001-clang-cpp17-constexpr-narrowing.patch"
    patch_description: "clang C++17 build fix: constexpr for in-class static const double FLUSHWAIT, explicit uint64 casts for int64 file sizes in braced FileStatus init"
    patch_type: "portability"
  - patch_file: "patches/0002-ktdbext-use-kc-getpid.patch"
    patch_description: "use kyoto-cabinet kc::getpid() wrapper instead of bare POSIX getpid() which is undeclared without transitive unistd.h on the OHOS libc++ toolchain"
    patch_type: "portability"
  - patch_file: "patches/0003-ktremotedb-null-pointer-return.patch"
    patch_description: "return NULL instead of false in char* cursor methods (get_key/get_value/get/seize); bool-to-pointer conversion is an error under C++11 and later"
    patch_type: "portability"
  - patch_file: "patches/0004-kthttp-localhost-fallback.patch"
    patch_description: "fall back to 127.0.0.1 when the local hostname does not resolve (empty host means local host; sandboxed HarmonyOS containers have unresolvable hostnames)"
    patch_type: "portability"
