software: kaldi
version: "g20231112"
status: built
build_system: custom-configure-makefile
build_date: "2026-09-25"

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://github.com/kaldi-asr/kaldi/archive/e8ed6107cb8880fb2b9a2b7dea2f5889962b614b.tar.gz"
  sha256: "a6f29f01e801d62324c2e7cbc95aa905a3ba8f7c00e23e4cd5f264a5df9b1271"
  tar_format: tar.gz
  upstream_repo: "https://github.com/kaldi-asr/kaldi"
  commit: "e8ed6107cb8880fb2b9a2b7dea2f5889962b614b"
  snapshot_date: "2023-11-12"

# ============================================================
# 构建配置
# ============================================================
build:
  system: configure-makefile
  configure_options:
    - "--use-cuda=no"
    - "--mathlib=OPENBLAS"
    - "--openblas-root=<openblas/0.3.34 package_folder>"
    - "--fst-root=<openfst/1.8.4 package_folder>"
    - "--static-fst"
    - "--fst-version=1.8.4"
  make_variables:
    EXTRA_CXXFLAGS: "-std=c++17 -fPIC"
  dependencies:
    - "openfst/1.8.4"
    - "openblas/0.3.34"
  package_type: static-library
  libs: 21
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-ohos-build-system-portability.patch"
  - "0002-openfst-1.8-api-migration.patch"
  - "0003-openblas-lapack-headers.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "kaldi src/configure 用 `uname` 判平台，OHOS 内核名是 HarmonyOS，需加入 Linux 分支"
  - "OHOS 无 /bin/bash，kaldi configure 的 shebang 与 Makefile 的 SHELL 都要改（/usr/bin/env bash + command -v bash）"
  - "OHOS /tmp 只读，src/base/get_version.sh 的 mktemp /tmp/... 需改用 $TMPDIR"
  - "OpenFst >= 1.8 移除 <fst/types.h>：kaldi-types.h 需自行复刻 int8..uint64 全局别名"
  - "OpenFst >= 1.8 全局 flag 改为 FST_FLAGS_*；MapFst/MapFstOptions→ArcMapFst/ArcMapFstOptions；Map()→ArcMap()；FstPrinter::Print 收引用；CompactFst 静态 WriteFst() 移除；StateIteratorData::base 改 unique_ptr；MatcherBase::Properties 用 uint64_t"
  - "LAPACK >= 3.10 头文件（OpenBLAS 自带）给 Fortran 入口追加隐藏字符串长度参数，与 cblas-wrappers.h 的 CLAPACK 原型冲突，改用 kaldi 自带 tools/CLAPACK 头"
  - "OpenBLAS >= 0.3.x 不再需要 -lgfortran，OHOS 也无 gfortran 运行库，链接参数需去掉"
  - "OpenFst 1.8.4 头文件要求 C++17，kaldi 的 linux_openblas_aarch64.mk 写死 -std=c++14，需用 EXTRA_CXXFLAGS 覆盖"
