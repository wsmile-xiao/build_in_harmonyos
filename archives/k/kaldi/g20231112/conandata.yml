# 上游无 release tag；按仓库 git 快照版本惯例记为 g20231112。
# 快照对应 kaldi-asr/kaldi master 分支 commit
# e8ed6107cb8880fb2b9a2b7dea2f5889962b614b（2023-11-10，2023-11-12 当日 HEAD）。

patches:
  - patch_file: "patches/0001-ohos-build-system-portability.patch"
    patch_description: "HarmonyOS 构建系统可移植性：configure 的 uname 平台探测接受 HarmonyOS；用 /usr/bin/env bash 作为解释器（OHOS 无 /bin/bash）；Makefile 的 SHELL 改为探测 bash；get_version.sh 的 mktemp 改用 $TMPDIR（OHOS /tmp 只读）；去掉 OpenBLAS 链接里遗留的 -lgfortran（OpenBLAS 已不再依赖 Fortran 运行库，OHOS 包内也没有）。"
    patch_type: "portability"
  - patch_file: "patches/0002-openfst-1.8-api-migration.patch"
    patch_description: "适配 OpenFst 1.8.4：<fst/types.h> 已在 1.8 移除，改从 <cstdint> 复刻全局定宽别名；全局 flags 改名 FST_FLAGS_*；MapFst/MapFstOptions 改名 ArcMapFst/ArcMapFstOptions；自由函数 Map() 改名 ArcMap()；FstPrinter::Print 接受流引用而非指针；FloatWeightTpl::GetPrecisionString 返回 string_view；MatcherBase::Properties 形参改为 uint64_t；StateIteratorData::base 改为 unique_ptr；CompactFst 的静态 WriteFst() 已移除，改为构造 CompactFst 后调用 Write()。"
    patch_type: "portability"
  - patch_file: "patches/0003-openblas-lapack-headers.patch"
    patch_description: "LAPACK >= 3.10 头文件（OpenBLAS 自带）给 Fortran 入口追加了隐藏的字符串长度参数，与 cblas-wrappers.h 中 CLAPACK 指针风格调用不匹配；改用 Kaldi 自带 tools/CLAPACK 的 f2c.h/clapack.h 原型（同一例程 ABI，纯指针参数）。"
    patch_type: "portability"
