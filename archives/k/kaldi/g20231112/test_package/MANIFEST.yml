# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
package: kaldi/g20231112
homepage: "https://kaldi-asr.org/"

# 上游测试入口：kaldi 没有顶层 make check / ctest / pytest，
# 上游真实入口是 `make -C src test`（= $(SUBDIRS_LIB) 各自的 test 目标，
# 编译并运行 src/*/ *-test 程序）。源码依据：src/Makefile `test: $(addsuffix /test, $(SUBDIRS_LIB))`
# 与 src/makefiles/default_rules.mk 的 `test: test_compile` 规则。
upstream_check_command: "make -C src test"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j<JOBS> SHELL=<bash> EXTRA_CXXFLAGS=\"-std=c++17 -fPIC\" test"

# 上游实际运行的测试程序（全量 123 个，主要类别如下）
upstream_tests:
  - file: src/base/kaldi-math-test
    source: src/base/kaldi-math-test.cc
    description: "kaldi 数学函数（Exp/Log/指数下溢、随机数）"
    command: "./kaldi-math-test"
  - file: src/matrix/matrix-lib-test
    source: src/matrix/matrix-lib-test.cc
    description: "矩阵/向量库（含 BLAS/LAPACK 调用）"
    command: "./matrix-lib-test"
  - file: src/matrix/sp-matrix-test
    source: src/matrix/sp-matrix-test.cc
    description: "packed 对称矩阵（ssptrf_/ssptri_ 等 CLAPACK 原型路径）"
    command: "./sp-matrix-test"
  - file: src/fstext/fstext-utils-test
    source: src/fstext/fstext-utils-test.cc
    description: "OpenFst 扩展工具（ArcMap/ArcMapFst 等 1.8 API）"
    command: "./fstext-utils-test"
  - file: src/fstext/table-matcher-test
    source: src/fstext/table-matcher-test.cc
    description: "TableMatcher（MatcherBase::Properties 签名）"
    command: "./table-matcher-test"
  - file: src/lat/kaldi-lattice-test
    source: src/lat/kaldi-lattice-test.cc
    description: "lattice 读写（FstPrinter::Print 流引用）"
    command: "./kaldi-lattice-test"
  - file: src/feat/feature-mfcc-test
    source: src/feat/feature-mfcc-test.cc
    description: "MFCC 特征提取"
    command: "./feature-mfcc-test"
  - file: src/online2/online-feature-test
    source: src/online2/online-feature-test.cc
    description: "在线特征流水线"
    command: "./online-feature-test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_kaldi
    description: "链接 kaldi 静态库并调用 Matrix/SpMatrix/BLAS/LAPACK，断言 17 项数值结果"
    command: "./test_kaldi"
  - file: libkaldi_ohos_probe.so
    description: "鸿蒙特有：kaldi 静态库链入共享库 + 真机 dlopen 调用"
    command: "./test_ohos_kaldi.sh <pkg> <bindir>"

# 测试断言总数（上游 123 个测试程序内的 CHECK 断言远多于此，此处仅统计已核验入口）
assertion_count: 17
