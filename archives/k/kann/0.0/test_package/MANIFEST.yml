# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: kann/0.0
homepage: "https://github.com/attractivechaos/kann"

# 上游测试命令：kann 为纯 Makefile 库，无 make check/ctest/meson 测试目标
upstream_check_command: "make all"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：上游无独立测试用例（无 tests/、无测试框架）
# 全部 7 个上游样例用 clang 编译通过；rnn-bit 样例已实际训练并验证预测
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 kann 公开 API 构建/训练/预测 MLP，验证第三方使用者可编译、链接、运行"
    command: "./test_kann"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
