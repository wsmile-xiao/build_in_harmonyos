# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-ddns-tuning/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的两个 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> dhcp-ddns-tuning-tests dhcp-ddns-tuning-libloadtests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-ddns-tuning-tests dhcp-ddns-tuning-libloadtests"

# 上游实际运行的测试程序（源码 TEST/TEST_F 宏计数：46 + 19 = 65）
upstream_tests:
  - file: dhcp-ddns-tuning-tests
    source: src/hooks/dhcp/ddns_tuning/tests/
    description: >-
      DDNS tuning hook 单元测试（46 例：ddns_tuning_unittests 32 +
      expression_cache_unittests 14）。ddns_tuning_unittests 覆盖配置解析
      （ddns-tuning.enable / qualifying-suffix / expression 键的非法与空配置、
      全局表达式、子网表达式、全局+子网叠加、新子网/既有子网场景、缓存重填充，
      v4/v6 各 8 组）与 hostname 改写语义；expression_cache_unittests 覆盖
      表达式缓存（构造、v4/v6 合法与非法表达式、空表达式、cache flush）。
      每组均有 MultiThreading 变体（Kea 3.0 多线程模式测试路径）。全部为纯逻辑
      用例：无 SOCK_RAW、无特权依赖、无外部数据文件，OHOS 沙箱下零 root 全实跑
    command: "./dhcp-ddns-tuning-tests"
  - file: dhcp-ddns-tuning-libloadtests
    source: src/hooks/dhcp/ddns_tuning/libloadtests/
    description: >-
      DDNS tuning hook 加载与 callout 集成测试（19 例 = callout4 8 + callout6 8 +
      load_unload 3，全部经 Kea hook 框架真实 dlopen libdhcp_ddns_tuning.so）。
      callout4/callout6 覆盖 ddns4_update/ddns6_update callout 的表达式场景矩阵、
      DHCPv4/v6 服务器配置识别、CB（config backend）更新、SKIP_DDNS 类处理
      （各 4 组 × MultiThreading 变体）；load_unload 验证可加载进 DHCPv4 与
      DHCPv6 服务器（validLoad4/validLoad6）、其他守护进程加载失败
      （invalidDaemonLoad）
    command: "./dhcp-ddns-tuning-libloadtests"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_ddns_tuning_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload 契约符号与 hook ABI 版本"
    command: "./test_ddns_tuning_hook <package>/lib/kea/hooks/libdhcp_ddns_tuning.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 libdhcp_ddns_tuning.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc libc.so.6、
      链接 libc++_shared.so）并验证 OHOS 加载器可 dlopen(RTLD_NOW) 解析
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_ddns_tuning.so"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 包内
      20 个 Kea 运行时库（lib/libkea-*.so*），校验完整 NEEDED 闭包可解析、
      闭包驻留后 hook 仍可加载且 load/unload 契约符号可解析
    command: "./test_ohos_runtime <package>/lib/kea/hooks/libdhcp_ddns_tuning.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（test_package 内，实测结果见版本级 notes.md）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <so> && ./test_ohos_runtime <so>"

# 上游测试用例宏总数（本次适配源码计数：46 + 19；实际注册执行数见版本级 manifest）
assertion_count: 65
