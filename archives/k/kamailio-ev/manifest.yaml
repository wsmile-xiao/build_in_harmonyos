software: "kamailio-ev"
display: "Kamailio evapi module"
description: "Kamailio SIP 服务器 evapi 模块（基于 libev 的网络事件广播 API，运行时加载模块 .so）"
category: "sip-server"
homepage: "https://www.kamailio.org"
license: "GPL-2.0-or-later"
build_system: makefile

ohos_adaptation:
  approach: "零补丁 + make 命令行变量注入平台差异（extra_defs 宏集 + BUILDER= 依赖探测钉死 + LOCALBASE 指向 conan libev 包）"
  scope: "仅编译 evapi 模块，不编译 kamailio 主程序（模块 .so 由 kamailio 运行时 loadmodule 加载）"
  deps:
    - "libev/4.33（构建期与运行时依赖，**动态**：OHOS sysroot 与目标机均无 libev → 非系统同名库，由 conan 依赖链提供运行时 .so，部署需 LD_LIBRARY_PATH）"
  notes: "详细适配记录见 6.0.6/notes.md"

versions:
  "6.0.6":
    status: built
    conan_ref: "kamailio-ev/6.0.6"
    build_date: "2026-10-02"
