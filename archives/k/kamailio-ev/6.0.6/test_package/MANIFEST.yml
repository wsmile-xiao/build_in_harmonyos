# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: check_evapi_module.py
    description: "产物结构/依赖闭包校验（纯 Python ELF 解析，无外部工具依赖）：ELF64 LSB、ET_DYN、EM_AARCH64、模块契约名 exports->name == \"evapi\"、30 个契约导出符号（exports/mod_register/module_version|flags|interface_ver/evapi_* 运行期入口/pv_*_evapi）、DT_NEEDED == {libc.so, libev.so} 且 libev.so 真实存在于 conan 依赖包、无 RPATH/RUNPATH、97 个未定义符号 100% 归类（libc/CRT 37 + libev 4 + kamailio core 56）、逐符号核验依赖包导出全部被引用的 ev_* 符号、libev.so 自身 DT_NEEDED ⊆ {libc.so} 且同为 aarch64 ET_DYN 且无 RPATH、licenses/COPYING 随包"
    command: "python3 check_evapi_module.py"
  - file: test_evapi_e2e.c
    description: "鸿蒙特有端到端消费者用例（rule12）：以消费者身份走通 kamailio core 的 loadmodule 路径 —— dlopen(evapi.so, RTLD_NOW|RTLD_GLOBAL) → 取模块导出描述符 exports（校验 name == evapi、dlflags 为 DEFAULT_DLFLAGS 哨兵值 0、rpcs == 0、cfg 命令表 9 项含名称与参数个数且 evapi_close 两个重载 fixup 为 NULL、参数表 7 项含绑定目标指针与默认值 workers=1/max_clients=8/wait_idle=500000/wait_increase=3/dispatcher_pid=-1、PV 表 1 项 $evapi 类型 PVT_OTHER 且 getf/setf/parse_name 非空）→ dlsym+调用 mod_register → 校验 core 侧 sr_kemi_modules_add 恰被调用一次并取得 8 项 KEMI 函数表（子模块名 evapi、relay/relay_unicast/relay_multicast/close/set_tag/async_relay/async_unicast/async_multicast、返回类型 SR_KEMIP_INT、参数类型 str/str 序列）→ 真实调用 evapi_env_reset（conidx 置 -1、其余字段清零、NULL 契约不崩溃）与 evapi_init_environment（桩层记录恰好解析 evapi:connection-new/-closed/message-received 三个事件路由）与 evapi_set_tag/evapi_cfg_close（NULL 分支返回 -1）→ 真实调用运行时依赖 libev（ev_default_loop + ev_io_start + ev_run + ev_io_stop 完成一次管道可读事件回调）→ dlclose；共 134 项断言全 PASS"
    command: "./test_evapi_e2e <evapi.so>"
  - file: kamailio_core_stub.c
    description: "core 符号最小实现层：evapi.so 是 core 插件，引用 sr_kemi_modules_add/route_lookup/fixup_*/dprint/… 等 kamailio core 符号（实测 56 个）；OHOS 的 musl 加载器不做惰性绑定（dlopen 即等价 RTLD_NOW），故由本文件随 e2e 一起编译并以 -Wl,--export-dynamic 导出符号供 dlopen 解析（sr_kemi_modules_add 记录函数表并计数、route_lookup 记录解析到的路由名，均为与 core 同语义的真实实现；类型口径严格对齐上游 dprint.h/route.h/kemi.h，如 my_pid/dprint_color 为函数、log_level_info 为数组、event_rt 为 struct route_list、_km_log_func 指向 sink 而非 NULL）"
    command: "（与 test_evapi_e2e.c 同一次 clang 调用，见 conanfile.py test()）"

# 测试断言总数（check_evapi_module.py 中的 check() 调用数，17 项）
assertion_count: 17

# e2e 消费者用例断言数（test_evapi_e2e.c 运行时断言展开数，实测 134 项：
#   KAM_STUB_CHECK 宏在 stdout 汇总中打印 ALL CHECKS PASSED (134/134)）
e2e_assertion_count: 134

# 鸿蒙特有测试用例登记（≥1）
ohos_specific_tests:
  - name: "OHOS 加载器同源 dlopen 路径（RTLD_NOW 全符号解析 + core 桩层）"
    file: test_evapi_e2e.c
    assertions: 134
    note: "OHOS/musl 加载器不做惰性绑定，本用例以 RTLD_NOW dlopen evapi.so 并由 core 桩层提供 56 个 core 符号，等价复现 kamailio loadmodule 的加载语义"
  - name: "libev 运行时依赖在 OHOS 上可加载且可运行"
    file: test_evapi_e2e.c
    assertions: 5
    note: "evapi.so 的 DT_NEEDED 含 libev.so（OHOS sysroot 无此库，由 conan 依赖链提供）；用例真实调用 ev_default_loop/ev_io_start/ev_run/ev_io_stop 完成一次 fd 就绪回调"
