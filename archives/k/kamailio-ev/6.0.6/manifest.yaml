# 版本级 manifest — kamailio-ev 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-ev"
status: built                      # R29 口径：conan_verify/conan create 已 PASS 但尚未 conan upload → built；发布流水线（合并后）上传成功再转 published
build_date: "2026-10-02"
build_system: makefile                # kamailio 经典 Makefile 体系（非 autotools/cmake）
conan_ref: "kamailio-ev/6.0.6"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  scope: "evapi 模块（不编译 kamailio 主程序）"
  configure_options:
    - "make cfg include_modules=\"evapi\" extra_defs=\"见本文件 build.platform_defs\" BUILDER= LOCALBASE=<libev 包目录>"
    - "make modules modules=\"modules/evapi\" -j1 extra_defs=\"见本文件 build.platform_defs\" BUILDER= LOCALBASE=<libev 包目录>"
  platform_defs: "-D_GNU_SOURCE -DHAVE_GETHOSTBYNAME2 -DHAVE_SCHED_YIELD -DHAVE_MSG_NOSIGNAL -DHAVE_MSGHDR_MSG_CONTROL -DHAVE_ALLOCA_H -DHAVE_TIMEGM -DHAVE_SCHED_SETSCHEDULER -DHAVE_IP_MREQN（共 9 项 = -D_GNU_SOURCE + 8 个 -DHAVE_*，与 conanfile.py PLATFORM_DEFS 逐项一致）"
  parallel_jobs: 1
  parallel_jobs_reason: "E525/E074：OHOS SELinux 禁止用户进程创建 FIFO，GNU make jobserver 靠 FIFO 传递令牌 → -j>1 有挂起/报错风险；与同族其余 kamailio-* 配方一致固定 -j1"
  modules:
    - evapi
  dependencies:
    - libev/4.33
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 上游 6.0.6 源码包原生识别 aarch64-unknown-linux-ohos；平台差异全部经 make
# 命令行变量表达（extra_defs 宏集 + BUILDER= 依赖探测钉死 + LOCALBASE 指向依赖包），
# 未改动任何上游源文件/构建文件
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`（生成 src/config.mak），否则报 No rule to make target 'cfg-defs'；`make modules modules='modules/evapi'` 指定单模块目录即可只编该模块 (knowledge_ref: notes.md#3-构建方法)"
  - "OS=harmonyos 不在 Makefile.defs 的 linux/solaris/freebsd/darwin 任一分支 → HAVE_GETHOSTBYNAME2/HAVE_SCHED_YIELD 等平台探测宏全部缺失，core 头 resolve.h/sched_yield.h 直接 #error。解法：make 命令行 extra_defs 注入 linux 分支等价宏集（9 项，对照 OHOS SDK sysroot 实证存在） (knowledge_ref: notes.md#41-平台探测宏缺失)"
  - "只编模块、不编 core 是零补丁的关键：core/resolve.c 的 _res（HAVE_RESOLV_RES）与 core/lock_ops.h 的 union semun（HAVE_UNION_SEMUN）在 OHOS musl 头文件中无对应定义，仅编译 kamailio 主程序时才触发 (knowledge_ref: notes.md#42-只编模块不编-core)"
  - "kamailio 模块 Makefile 的 pkg-config 探测变量名**因模块而异**（tls→SSL_BUILDER、gcrypt→GCRYPT_BUILDER、evapi→裸 BUILDER），且 evapi/Makefile 会在 `pkg-config --exists libev` 失败时**自动清空 BUILDER** 回退 LOCALBASE。当 conan 依赖包不提供 .pc 文件（libev/4.33 即如此）或构建机装有同名系统库时，链路有两种落点；显式传 `BUILDER=`（make 命令行变量优先于文件内赋值）可确定性钉死 LOCALBASE 回退。实测（evidence/logs/builder-pin-experiment.log）：假 pkg-config 置于 PATH 时，不传 BUILDER= 被劫持为 `-L/FAKE_HIJACK/lib -lev`；传 BUILDER= 后稳定走 LOCALBASE (knowledge_ref: knowledge/drafts/DRAFT-14412-kamailio-ev-6.0.6-module-pkgconfig-probe-pinning.kv)"
  - "OHOS/musl 加载器不做惰性绑定（dlopen 等价 RTLD_NOW），core 插件类 .so 的消费测试须自带 core 符号桩层；桩层类型必须逐字段对齐上游头文件（my_pid/dprint_color 是函数而非变量、log_level_info 是数组且字段序为 {char *name; int syslog_level}、event_rt 为 struct route_list、_km_log_func 须指向非空 sink），否则日志路径 LM_ERR 解引用野指针 → SIGSEGV 掩盖真实失败原因 (knowledge_ref: 同族课程 knowledge/drafts/kamailio-gcrypt-6.0.6-ohos-plugin-stub-type-alignment.kv)"
  - "模块携带非系统同名库 DT_NEEDED（此处 libev.so）时的产物闭包校验与运行时定位口径：编译通过 ≠ 可加载，须验证未定义符号 100% 被依赖包提供 + 依赖链闭合；libev/4.33 无 SONAME，链接时 `-lev` 记录的 DT_NEEDED 即字面 `libev.so`，与包内文件名一致；依赖链由 conan 提供运行时 .so（不静态、不打 RPATH），部署经 LD_LIBRARY_PATH 定位 (knowledge_ref: 同族课程 knowledge/drafts/kamailio-gcrypt-6.0.6-ohos-plugin-external-dynlib-closure.kv)"

# 本配方 0 补丁：平台差异全部经 make 命令行（extra_defs/依赖探测变量）注入，未改动上游源文件。
patch_generation:
  method: none
  patches_count: 0
  note: "refresh-patch --auto 复核无候选补丁；patches/ 为空、conandata.yml 为 patches: {}"

