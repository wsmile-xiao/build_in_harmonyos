# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Qt6Config.cmake resolves each component's _DIR relative to its own location (qtbase's lib/cmake); components living in separate conan packages (Qt6Qml in qtdeclarative, Qt6Multimedia in qtmultimedia) must be pointed at explicitly via -DQt6<Component>_DIR on the configure line or os.environ in build()"
  - "HarmonyOS CMake platform module does not define CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG, so shared libraries get no DT_SONAME and the linker records relative NEEDED paths (../../../feedback/libKTactileFeedback.so) that the loader cannot resolve; define it explicitly to -Wl,-soname, (same fix as kdecoration 6.7.2)"
  - "KF_IGNORE_PLATFORM_CHECK=TRUE is required to bypass KDE's platform allowlist (OHOS is not in it)"
  - "ECM_MODULE_PATH must be set manually because CMakeDeps-generated ECMConfig.cmake does not propagate it"
  - "qtbase uses cmake_find_mode=none, so conan_cmakedeps_paths.cmake must be created manually to inject qtbase's lib/cmake into CMAKE_PREFIX_PATH"
  - "qhdbusxml2cpp/qdbusxml2cpp-style Qt codegen tools need the conan libexpat (and the OHOS SDK libc++_shared) on LD_LIBRARY_PATH during build"
  - "qtdeclarative/qtmultimedia pin qtbase/6.11.1, so the recipe must require qtbase/6.11.1 (not 6.11.1.2) to avoid a conan version conflict"