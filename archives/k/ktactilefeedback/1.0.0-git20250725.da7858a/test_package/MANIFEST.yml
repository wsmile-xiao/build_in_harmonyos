# test_package/MANIFEST.yml
# 上游官方测试声明文件 (R51 三步法回填)

package: ktactilefeedback/1.0.0-git20250725.da7858a
homepage: "https://invent.kde.org/jbbgameich/ktactilefeedback"

# 上游测试命令 (ctest -N 结果)
upstream_check_command: "ctest -N"

# conanfile.py build() 中已集成上游测试 (ctest 在 _run_upstream_tests 执行)
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error --timeout 120"

# 上游实际运行的测试程序 (清点结果: autotests/ 下 4 个 QtTest)
upstream_tests:
  - file: autotests/qfeedbackactuator/tst_qfeedbackactuator.cpp
    source: ktactilefeedback-da7858aaa125588d4c309f273afefff93222e8f9/autotests/qfeedbackactuator/tst_qfeedbackactuator.cpp
    description: "QFeedbackActuator 基础 API 测试 (QTest)"
    command: "./build/autotests/qfeedbackactuator/qfeedbackactuator"
  - file: autotests/qfeedbackhapticseffect/tst_qfeedbackhapticseffect.cpp
    source: ktactilefeedback-da7858aaa125588d4c309f273afefff93222e8f9/autotests/qfeedbackhapticseffect/tst_qfeedbackhapticseffect.cpp
    description: "QFeedbackHapticsEffect API 测试 (QTest)"
    command: "./build/autotests/qfeedbackhapticseffect/qfeedbackhapticseffect"
  - file: autotests/qdeclarativefeedback/tst_qdeclarativefeedback.cpp
    source: ktactilefeedback-da7858aaa125588d4c309f273afefff93222e8f9/autotests/qdeclarativefeedback/tst_qdeclarativefeedback.cpp
    description: "QML declarative feedback 模块测试 (载入 org.kde.tactilefeedback QML 组件)"
    command: "./build/autotests/qdeclarativefeedback/qdeclarativefeedback"
  - file: autotests/qfeedbackmmk/tst_qfeedbackmmk.cpp
    source: ktactilefeedback-da7858aaa125588d4c309f273afefff93222e8f9/autotests/qfeedbackmmk/tst_qfeedbackmmk.cpp
    description: "QtMultimedia(mmK) 后端反馈效果测试"
    command: "./build/autotests/qfeedbackmmk/qfeedbackmmk"

# test_package 中自带的测试 (消费者视角验证)
# rule12: 鸿蒙特有完整消费者用例（真实跑通功能/流程的端到端用例，非纯断言）
test_package_tests:
  - file: test.cpp
    description: >
      鸿蒙特有完整消费者用例（rule12）：
      (A) C++ QtFeedback 消费流程——枚举 QFeedbackActuator（真实触发随包
      feedbackd/hfd/mmk 后端插件发现与加载）、构造 QFeedbackHapticsEffect 配置
      包络、执行 start()/stop() 状态机转换（Stopped→Running→Stopped），并在无
      触觉硬件时断言启动被拒路径（保持 Stopped、无 error 信号）；
      (B) QML declarative 消费流程——QQmlEngine 加载随包 org.kde.tactilefeedback
      模块、创建 HapticsEffect 绑定 Actuator、经 QML running 属性驱动真实生命周期。
    command: "./test_ktactilefeedback"

# 测试断言总数 (近似值; 完整消费者用例断言数)
assertion_count: 34