version: "2.7"
software: "kerberos-configs"
status: built
build_date: "2026-09-18"
build_system: "none"  # 纯配置包：上游无编译系统，debian/rules 仅为 debconf 安装器拼接脚本
license: "GPL-2.0-only"
source:
  url: "https://codeload.github.com/deepin-community/kerberos-configs/tar.gz/refs/tags/2.7"
  sha256: "b77e8802b4c0907309a3afa238d6d3c5ecb6a5bb30a4c3c5d7ad8ed9142cae33"
  tar_format: "tar.gz"
  upstream_tag: "2.7"
build:
  system: "none"
  configure_options: []
  dependencies: []  # 零依赖件：纯配置数据，无编译无链接
  cc: "none"        # 无编译器参与
  profile: "ci/conan/profiles/ohos-aarch64"
patches_applied: []  # 无补丁：纯配置包，载荷原样安装
tests:
  upstream: "no_tests（上游无自动化测试套件：无 tests/ 目录、CI 仅打标签工作流；根目录 test-cases 为人工测试清单非可执行用例；debian/rules 无 test 目标。审计见 test_package/MANIFEST.yml）"
  test_package: "test_kerberos_configs.sh（6 项内容级检查：载荷落位/krb5.conf 三段语法/花括号配平/default_realm/内容标记/规模健全）"
  cli_smoke: "不适用（纯配置包，无 ELF 可执行文件，R38 commands.json 不适用）"
knowledge_gained:
  - "kerberos-configs 2.7 为 Debian 纯配置包：主载荷 krb5.conf.template（84 行 INI 模板），debian/krb5-config.install 只装此一个文件到 usr/share/kerberos-configs/。"
  - "上游 debian/rules 的 genblob/krb5-config.in 拼接产物是 Debian debconf 安装器脚本（依赖 Debconf::Client 模块），对 conan/OHOS 交付无意义——packaging-only 模式直接安装配置模板。"
  - "源码 URL 用 codeload.github.com 直链（200 无跳转）替代 github archive 302 重定向链，规避 worker 缺 curl 时整链死（mmkv #9693 教训），sha256 与 archive 形态一致。"
  - "纯配置包 test_package 用 shell 内建+grep/wc 做内容级真实验证（R34 非空壳）：三段语法/花括号配平/内容标记/规模检查，规避 OHOS worker python3/perl 不可用问题（adduser #17506 教训）。"
  - "L0p 门禁（CI #50186）：settings 必须四项全声明（os/compiler/build_type/arch）——8 月的 os/arch 两项先例已过时；noarch 包配套 package_id() self.info.clear() 归一（adamstark-audiofile 先例）。"
