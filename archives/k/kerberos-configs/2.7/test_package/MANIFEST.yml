# kerberos-configs 2.7 test_package MANIFEST
# 测试案例清单（适配后新增的鸿蒙特有测试）
#
# 上游测试情况（N=0，如实申报）：
#   - 上游仓库无自动化测试套件：无 tests/ 目录、无 CI 测试目标
#     （.github/workflows 仅 call-auto-tag/call-chatOps 打标签工作流）
#   - 根目录 test-cases 文件为【人工测试清单】（"When testing major changes
#     to krb5-config, the following are currently covered"——需人工配置
#     DNS TXT 记录/修改 hostname/降低 debconf 优先级等操作步骤，非可执行
#     自动化测试），不构成测试用例数
#   - 上游构建系统 debian/rules 无 make check/test 目标
#
# 适配后新增测试案例（M=6 类检查，全部通过）：
#   1. 载荷落位：krb5.conf.template + krb5confparse.pl + README +
#      packaging-guidelines 均安装在 share/kerberos-configs/
#   2. krb5.conf 语法健全性：[libdefaults]/[realms]/[domain_realm] 三段必备段存在
#   3. realm 块花括号配平（10/10）
#   4. default_realm 赋值存在
#   5. 内容完整性标记（ATHENA.MIT.EDU/stanford.edu/kerberos.mit.edu）
#   6. 模板规模健全（≥80 行，上游 84 行）
#
# 上游测试用例数：0（无自动化测试套件，人工清单不计数）
# 适配后测试用例数：6（test_kerberos_configs.sh 六类检查，shell 内建+grep/wc，
#   规避 OHOS CI worker 上 python3/perl 不可用/卡死问题——adduser #17506 教训）
# 通过率：6/6 = 100%

test_cases:
  - name: "payload_presence"
    description: "验证 krb5.conf.template/krb5confparse.pl/README/packaging-guidelines 落位 share/kerberos-configs/"
    type: "smoke"
    command: 'test -f "$pkg/share/kerberos-configs/krb5.conf.template" ...'
    expected: "OK (all 4 artifacts present)"
  - name: "krb5_conf_sections"
    description: "krb5.conf 语法健全性：[libdefaults]/[realms]/[domain_realm] 段存在"
    type: "content-validation"
    command: 'grep -qE "^\s*\[libdefaults\]" "$template" ...'
    expected: "OK (3 sections present)"
  - name: "realm_braces_balanced"
    description: "realm 块花括号配平（grep -o 计数 { 与 }）"
    type: "content-validation"
    command: 'open=$(grep -o "{" "$template" | wc -l); close=$(grep -o "}" "$template" | wc -l)'
    expected: "OK (10/10 balanced)"
  - name: "default_realm_assignment"
    description: "[libdefaults] 段 default_realm 赋值存在"
    type: "content-validation"
    command: 'grep -qE "^[^#;]*default_realm\s*=" "$template"'
    expected: "OK"
  - name: "content_markers"
    description: "已知 realm 标记存在（ATHENA.MIT.EDU/stanford.edu/kerberos.mit.edu）"
    type: "content-validation"
    command: 'grep -qF "ATHENA.MIT.EDU" "$template" ...'
    expected: "OK (3 markers present)"
  - name: "template_size_sane"
    description: "模板规模健全（≥80 行，上游 84 行）"
    type: "smoke"
    command: 'lines=$(wc -l < "$template"); test "$lines" -ge 80'
    expected: "OK (84 lines)"
