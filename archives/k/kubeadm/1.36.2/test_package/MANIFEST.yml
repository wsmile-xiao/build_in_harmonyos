# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 ctest -N / make -n check (或等价命令) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: kubeadm/1.36.2
homepage: "https://kubernetes.io/docs/reference/setup-tools/kubeadm/"

# 上游测试命令 (kubernetes 仓库测试体系基于 ginkgo 且强依赖集群环境:
# hack/make-rules/test.sh 全量套件需 cluster + etcd + kubelet,
# cmd/kubeadm 子包不携带可独立运行的单元测试)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无: 0 条可独立执行的上游测试, 如实声明)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_kubeadm.sh
    description: "消费者冒烟: kubeadm version 可执行且版本注入为 v1.36.2"
    command: "./test_kubeadm.sh <bin_path>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
