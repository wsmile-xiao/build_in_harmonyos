software: kubeadm
build_system: go
# 版本级 manifest 模板
# 文件位置: archives/k/kubeadm/1.36.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.36.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（主源 gitee 镜像，curl 风格 UA 可达，含 vendor/；
  # 后备官方 codeload https://codeload.github.com/kubernetes/kubernetes/tar.gz/refs/tags/v1.36.2
  # sha256 ffbc46612cf32ad08a3b606de064b63afc350ae1dd1a691e99b5cd127d716c26，
  # 两者内容相同但 tar 元数据不同，recipe 对两个 sha 都校验）
  url: "https://gitee.com/mirrors/kubernetes/repository/archive/v1.36.2.tar.gz"

  # 源码校验和（主源 sha；后备源 sha 见上方注释）
  sha256: "dbfd3b50644f2e14046110901d032986e829d2726de19b8aedbf3b1f7389f732"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | go | custom
  system: go

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "GO111MODULE=on"
    - "GOPROXY=off"
    - "GOFLAGS=-mod=vendor"
    - "GOSANDBOX=off"
    - "go build -ldflags=\"-w -s -X k8s.io/component-base/version.gitVersion=v1.36.2 -X k8s.io/component-base/version.gitCommit=unknown -X k8s.io/component-base/version.gitTreeState=clean -X k8s.io/component-base/version.buildDate=2026-09-23\" -o kubeadm ./cmd/kubeadm"

  # 编译依赖列表（格式: name/version）
  # Go 1.26.4 工具链由 recipe 自举（有界下载 golang.google.cn/dl.google.com + binary-sign-tool 自签），
  # 无 conan registry 依赖；其余依赖全部来自源码自带 vendor/ 目录。
  dependencies:
    - "go/1.26.4 (recipe 自举, 非 registry 依赖)"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "kubeadm 是 k8s.io/kubernetes 模块下 cmd/kubeadm 子包，go.mod 要求 go 1.26.0，需 Go 1.26 工具链"
  - "CI worker 无预装 Go：recipe 自举 Go 1.26.4（有界下载器下载 golang.google.cn/dl.google.com 镜像列表，sha256 校验），conan 2.29.1 无 conan.tools.go/unpack，用 stdlib tarfile 解压"
  - "OHOS 上 Go 工具链全部 ELF（bin/go、gofmt、pkg/tool/*）须 binary-sign-tool 自签后才能执行（E318），.ohos-signed marker 避免重复签名"
  - "OHOS 上 go build 链接输出必须放可写 workspace 目录（linker 对输出文件的 RWX mmap 在 /tmp 失败），GOSANDBOX=off 关闭 sandbox"
  - "版本号通过 ldflags 注入 k8s.io/component-base/version 包变量，不依赖 git 元数据"
  - "kubernetes 归档自带 vendor/ 目录（gitee 镜像/codeload 双源），-mod=vendor + GOPROXY=off 离线编译；gitee 仅对 curl 风格 UA 放行真实 tarball；conan get() 受 CI CONAN_REQUEST_TIMEOUT=300+CONAN_RETRY=10 最坏 10x330s 无界重试可击穿 3600s 窗口，recipe 改用有界下载器（120s x 2/镜像）规避"
