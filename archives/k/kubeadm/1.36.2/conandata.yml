sources:
  # 完整源码归档（含 vendor/，go 1.26.0 module，顶层目录 kubernetes-v1.36.2）。
  # 主源用 gitee 镜像：仅对 curl 风格 UA 返回真实 tarball（recipe 的有界下载器
  # 显式发送 User-Agent: curl/8.5.0，本机实测全量下载 15s）。
  # 官方 codeload 等价归档（后备，内容相同、tar 元数据不同故 sha256 不同，
  # recipe 对两个 sha 都校验）:
  #   https://codeload.github.com/kubernetes/kubernetes/tar.gz/refs/tags/v1.36.2
  #   sha256: ffbc46612cf32ad08a3b606de064b63afc350ae1dd1a691e99b5cd127d716c26
  # 不用 conan get() 下载: CI 设 CONAN_REQUEST_TIMEOUT=300 + CONAN_RETRY=10,
  # 单 URL 最坏 10x(300+30)s=3300s 可击穿默认 3600s 构建窗口; recipe 改用
  # 有界下载器（每镜像 120s 超时 x 2 次尝试）。
  url: "https://gitee.com/mirrors/kubernetes/repository/archive/v1.36.2.tar.gz"
  sha256: "dbfd3b50644f2e14046110901d032986e829d2726de19b8aedbf3b1f7389f732"

patches: []
