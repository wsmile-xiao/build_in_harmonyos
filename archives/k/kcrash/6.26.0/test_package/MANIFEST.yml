# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kcrash/6.26.0.

package: kcrash/6.26.0
homepage: https://invent.kde.org/frameworks/kcrash

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kcrash-6.26.0/autotests/
    description: "KCrash upstream CTest/autotests suite (kcrashtest, coreconfigtest, metadatatest)"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    condition: "run in the Conan build with BUILD_TESTING=ON"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke calls KCrash::setDrKonqiEnabled(false)."
    command: "conan create (test_package builds and runs test_kcrash)"

assertion_count: 1
