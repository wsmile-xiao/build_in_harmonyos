# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: keycloak-archlinux/2.0.1
homepage: "https://gitlab.archlinux.org/archlinux/keycloak-archlinux-theme"

# 上游无测试套件（NO_UPSTREAM_TESTS）：
# - Arch PKGBUILD 无 check()（仅 build()/package()）
# - 上游 .gitlab-ci.yml @v2.0.1 仅 build/v2 两个构建 job，无任何测试命令
# - gradle 路径：lib/src 仅 main/resources，无 test 源集/测试依赖
# - keycloakify 路径：v2/package.json 无 test 脚本，devDeps 无测试框架
# - 归档内无 Makefile test 目标、无独立测试脚本（docker-compose 为手动视觉调试环境）
# discovery 清单与证据见 notes.md《上游测试门禁 discovery》
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，在鸿蒙真机运行)
test_package_tests:
  - file: test.sh
    description: >-
      主题 JAR 制品级实质验证（R34）：JAR 存在、keycloak-themes.json 注册 archlinux、
      login/account/welcome 关键 FTL 与 theme.properties、login/email i18n messages、
      品牌 SVG/背景图资源、MANIFEST.MF、JVM URLClassLoader 真实加载 3 个资源
      并校验 themes.json 内容（unzip 清单落盘模式，规避 grep -q SIGPIPE 竞态）
    command: "bash test.sh"

# 测试断言总数
# 上游：0（无测试套件，NO_UPSTREAM_TESTS）
# test_package：17 个断言
# （1 JAR 存在 + 1 themes.json 注册 + 5 FTL 页面 + 1 theme.properties
#   + 2 i18n messages + 2 品牌资源 + 1 MANIFEST.MF + 1 JVM 加载探针
#   探针内部再校验 3 资源可读 + themes.json 内容）
assertion_count: 17
