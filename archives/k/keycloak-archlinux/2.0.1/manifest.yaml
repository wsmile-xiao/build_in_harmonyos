# 版本级 manifest — keycloak-archlinux 2.0.1

version: "2.0.1"
software: "keycloak-archlinux"
status: built
build_date: "2026-09-30"
build_system: gradle

# 身份映射（如实注明）：任务卡名 keycloak-archlinux 是截短名，
# 实际上游 = Arch Linux 官方包 keycloak-archlinux-theme 2.0.1-1（extra，arch=any），
# 上游项目即 Arch 官方 GitLab 仓库，tag 带 v 前缀：v2.0.1。
identity_mapping:
  task_card_name: "keycloak-archlinux"
  arch_package: "keycloak-archlinux-theme 2.0.1-1"
  upstream_tag: "v2.0.1"
  license: "Apache-2.0（根 LICENSE + Arch 包页一致；内层 v2/package.json 标 MIT 属上游不一致，以根 LICENSE 为准）"

source:
  url: "https://gitlab.archlinux.org/archlinux/keycloak-archlinux-theme/-/archive/v2.0.1/keycloak-archlinux-theme-v2.0.1.tar.gz"
  sha256: "a2473f1e8d7b4c4e8928fd90788d6d9f43c85814a5bdaf3afa19ce27ca51b2eb"

build:
  system: gradle
  dependencies:
    - bishengjdk 17.0.13
    - gradle 9.3.0 (via wrapper, tencent mirror pre-fetch, sha256 pinned)
    - maven central（build.gradle.kts 声明了 repositories，但零编译依赖，实际未访问）
  notes: "纯资源主题 JAR：lib/src/main/resources/theme/**（27 个 FTL/CSS/图片/properties 资源）经 gradle build 直接装配，无任何 Java 编译"

# 构建路径偏离说明（如实注明，reviewer 必读）
deviation:
  from: "Arch PKGBUILD 走 v2/ keycloakify 路径（yarn install --frozen-lockfile + yarn run build-keycloak-theme，产出 React 版主题 JAR）"
  chose: "上游支持的双路径之一：根目录 gradle 经典 FTL 主题路径（上游 README 文档化、上游 .gitlab-ci.yml build job 同款命令 gradle build，产出 lib/build/libs/keycloak-archlinux-theme.jar）"
  reason: >-
    keycloakify 路径在 OHOS 真机上不可用：vite 硬依赖 esbuild（外来预编译 Go
    二进制），而 HarmonyOS SecureAccessFence 拒绝对不携带 OHOS 工具链注入的
    .note.ohos.ident section 的 ELF 执行 exec()。实测证据（Auditor 全新 shell
    复测，见 reports/curator/probe/auditor-exec-policy.txt、auditor-sign-combo.txt）：
    本机 clang 构建的二进制可运行；对可运行二进制做「改 section 名 / 清零
    note 内容 / 抹掉 section 表」任一操作即被拒（EPERM）；android-NDK node 与
    esbuild 官方 linux-arm64 制品无论改 note/PT_NOTE/section 表（A/C/D/E/F
    五种注入变体）均 exec 拒绝；设备官方签名工具 binary-sign-tool selfSign
    对 OHOS 构建对照物成功（add codesign section success → exit 42）、对外来
    工具 ELF 实测失败（Failed to save 4K data to .codesign section，根因未定），
    注入+签名组合亦失败。node 本体的设备自建通道可行但未走通到产物：v22.14.0
    configure 成功（磁盘证据止于 config.gypi/config.mk/config.status，configure
    日志未落盘），实际构建止步于 gyp 再生成失败（gyp: Undefined variable python
    → make Error 1），编译从未启动；即便 node 自建成功，vite 缺 esbuild 即无法
    运行，故 keycloakify 全链（yarn→tsc→vite→keycloakify→maven）在当前设备
    安全策略下无法打通。如设备策略放宽（可运行 OHOS 构建的 esbuild/node），
    可在后续版本补走 keycloakify 路径。
  artifact_difference: "gradle 路径产出经典 FTL 主题 JAR（同视觉主题的经典实现，含 login/account/admin/email/welcome 五主题 + i18n）；与 keycloakify 版 React 主题 JAR 功能面不同，与 Arch 发行物不完全等价"

upstream_tests:
  framework: "无（PKGBUILD 无 check()；.gitlab-ci.yml 仅 build/v2 两个构建 job 无任何测试命令；两条构建路径均无测试目录/测试依赖；docker-compose.yml 仅手动视觉调试环境）"
  test_files: 0
  test_methods: 0
  test_command: ""
  run_in_build: false
  discovery_note: "NO_UPSTREAM_TESTS —— discovery 证据链见 notes.md《上游测试门禁 discovery》"

patches_applied: []

knowledge_gained:
  - "任务卡名截短：keycloak-archlinux ↔ Arch keycloak-archlinux-theme 2.0.1-1；上游 tag 带 v 前缀 v2.0.1（与 keycloak-metrics 无 v 前缀惯例相反）"
  - "HarmonyOS SecureAccessFence：仅携带 OHOS 工具链注入的 .note.ohos.ident（SHT_NOTE section + PT_NOTE，note 28 字节 namesz=12/descsz=4/type=1/name='OHOS'+8NUL/desc=1）的 ELF 可 exec；外来预编译二进制（glibc/android/Go 静态）一律 EACCES 拒绝，note/section 表注入变体均无法绕过——预编译 x86/arm64 linux 工具链在真机不可用，必须 OHOS 工具链自建"
  - "HMDFS 上 make --jobserver-style=fifo 默认 mkfifo 被拒（Operation not permitted），GNU make 并行需 --jobserver-style=pipe"
  - "musl 环境 python subprocess.Popen 裸命令名 ENOENT（posix_spawn 不做 PATH 解析）——设备上给 configure/构建系统传编译器必须用绝对路径"
  - "设备 gyp/gn 类 Python 元构建的 'python' 依赖需区分两类：'python 命令名缺失'类（pixelmatch 同款，PATH 前置 python→python3 符号链接有验证可解）与 gyp <(python) 变量展开类（本 run：已尝试符号链接 + PATH 前置，未验证成功——构建仍止于 gyp: Undefined variable python → make Error 1，见 knowledge/drafts/DRAFT-secure-access-fence-exec-policy.md）"
  - "gradle 9.3.0-bin.zip 腾讯镜像可达（services.gradle.org 直连超时不变），wrapper distributionUrl 追加 file:// 行 + 直接 java -cp gradle-wrapper.jar 调 GradleWrapperMain 的 keycloak-metrics 方案对 gradle 9.3 同样适用"
  - "上游源码归档由 gitlab.archlinux.org 提供，字节稳定（双次下载 sha256 一致）；gitlab.archlinux.org 不在 CI mirror-fallback 域名清单内，conandata 不会被 CI 改写"
