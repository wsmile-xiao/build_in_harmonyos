name: test_package for keditbookmarks 26.04.0
description: >
  Application smoke test: packaged kbookmarkmerger --help and keditbookmarks
  headless --importkde3/--exportns round trip (exercises libkbookmarkmodel,
  KBookmarks, importers, exporters end to end).
language: cpp
type: app-smoke

test_steps:
  - kbookmarkmerger --help (QCommandLineParser usage output)
  - keditbookmarks --importkde3 bookmarks.xml --exportns out.html (headless)

expected:
  - exit 0 for both
  - export output file exists and is a Netscape bookmark HTML file
