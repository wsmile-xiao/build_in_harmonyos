software: keditbookmarks
version: "26.04.0"
status: built
package_type: application
build_system: cmake
created_at: 2026-09-19
build_date: 2026-09-19
language: cpp
description: "KDE bookmark editor - keditbookmarks GUI organizer/editor + kbookmarkmerger CLI, with the private libkbookmarkmodel (KDE Gear 26.04.0, Qt6/KF6)"
homepage: https://invent.kde.org/utilities/keditbookmarks
upstream_source: https://download.kde.org/stable/release-service/26.04.0/src/keditbookmarks-26.04.0.tar.xz
source_sha256: ebaff000124ea716fe39d7de89049ce5fde0d8da64432c0ec87e9279bf053bd2
license: "GPL-2.0-only OR GPL-3.0-only"

dependencies:
  required:
    - qtbase/6.11.1
    - kcodecs/6.14.0
    - kcompletion/6.14.0
    - kconfig/6.14.0
    - kconfigwidgets/6.14.0
    - kcoreaddons/6.14.0
    - kcrash/6.14.0
    - ki18n/6.14.0
    - kiconthemes/6.14.0
    - kio/6.14.0
    - kbookmarks/6.14.0
    - ktextwidgets/6.14.0
    - kwidgetsaddons/6.14.0
    - kwindowsystem/6.14.0
    - kxmlgui/6.14.0
    - libxml2/2.15.3
  build:
    - ecm/6.20.0

patches_applied:
  - patches/0001-ohos-adaptation.patch

test_results:
  type: upstream_test_subset_executed
  upstream: "Upstream registers 1 ctest target: kbookmarkmodeltest (src/kbookmarkmodel/tests, ecm_add_test QTest). Executed inside conan create via ctest with QT_QPA_PLATFORM=offscreen and a sandboxed HOME/XDG tree: 1/1 PASS."
  test_package: "passed: kbookmarkmerger --help (usage text, exit 0); keditbookmarks headless two-step round trip: --importkde3 bookmarks.xml (writes default XBEL store under XDG_DATA_HOME/konqueror, exit 0) then --exportns out.html (Netscape bookmark file written; both imported URLs present in output - verified DOCTYPE NETSCAPE-Bookmark-file-1 + KDE Homepage + keditbookmarks upstream entries)"
  package_id: "b3741dcadae35e594e699f44707b5c66b8620e13"

platform_adaptations:
  - "KF6::Parts dependency removed (kparts not published on ohpcd; its only use, FavIconUpdater::downloadIconUsingWebBrowser + FavIconWebGrabber, loaded a text/html KPart at runtime which does not exist on HarmonyOS PC - dead fallback path). The KIO-based favicon flow (KIO::favIconForUrl + KIO::FavIconRequestJob) is kept."
  - "Qt6 DBus component removed (not in the published qtbase/6.11.1 line): single-instance D-Bus detection (askUser) and KEBApp D-Bus object registration were runtime no-ops without a session bus on HarmonyOS PC."
  - "KF6DocTools stays OPTIONAL (upstream TYPE OPTIONAL) and is not provided: kdoctools 6.19.0 is published but conflicts with the 6.14 baseline (kfourinline/khealthcertificate same-family precedent, audiocd DocTools handling). The doc/ handbook subdir is skipped by upstream logic."
  - "KF_IGNORE_PLATFORM_CHECK=TRUE (KDE platform whitelist bypass), KF_SKIP_PO_PROCESSING=ON (no lconvert/Qt6 LinguistTools)."
  - "ECM_MODULE_PATH set manually; conan_cmakedeps_paths.cmake written manually (qtbase and KF6 packages use cmake_find_mode=none) - baloo 26.04.3 / libkdegames 26.04.0 precedent."
  - "KF6 6.14.0 baseline line chosen to match the published kio/kxmlgui/kbookmarks 6.14.0 binaries (same qtbase/6.11.1, no override, whole-graph binary reuse)."

known_issues:
  - "keditbookmarks requires a running Qt platform plugin for GUI use; smoke tests run with QT_QPA_PLATFORM=offscreen."
  - "The web-browser favicon fallback path (HTML KPart) does not exist on this platform; bookmarks without a cached favicon export without icons."
