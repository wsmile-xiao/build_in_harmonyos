patches:
  "26.04.0":
    - patch_file: "patches/0001-ohos-adaptation.patch"
      patch_description: >
        OHOS: drop KF6::Parts (unpublished on ohpcd; its only use loaded a
        text/html KPart at runtime which does not exist on HarmonyOS PC -
        dead fallback path); drop Qt6 DBus component (not in the published
        qtbase/6.11.1 line; single-instance D-Bus detection and object
        registration were runtime no-ops without a session bus).
      patch_type: "portability"
