software: kodi-pvr-iptvsimple
display: "Kodi pvr.iptvsimple (IPTV Simple PVR client)"
description: "Kodi IPTV Simple PVR client add-on (M3U playlists, EPG, channels/groups/providers)"
category: multimedia
homepage: "https://github.com/kodi-pvr/pvr.iptvsimple"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 CMakeLists 依赖 Kodi 构建系统（find_package(Kodi) 的 build_addon/addon_version），registry 无 kodi 包；配方自带 recipe-cmake/ 构建入口，构建上游原样源码"
    - "上游 Findpugixml/Findlzma（pkg-config 风格）改接 Conan CMakeDeps 的 pugixml::pugixml / lzma::lzma；zlib 链系统 libz.so"
    - "kodi-dev-kit 头（<kodi/AddonBase.h>、<kodi/addon-instance/PVR.h>、pvr/*）以 xbmc 21.3-Omega 归档原样内嵌于版本目录 kodi-dev-kit/kodi；PVR instance API 8.3.0/8.2.0 与插件源码逐一核对兼容"
    - "产物为 dlopen 型 Kodi 模块 pvr.iptvsimple.so（MODULE + PREFIX \"\"），链接静态 pugixml/lzma，运行时依赖系统 libz 与 libc++"
    - "CMake --install 的 RPATH 改写会修改 ELF 触发 OHOS 加载器完整性校验失败（dlopen EACCES）；置 CMAKE_SKIP_RPATH=ON 使安装产物与链接器输出逐字节一致"
  common_dependencies:
    - pugixml/1.15-r0
    - lzma/5.6.2
    - "zlib: 系统 libz.so（conan zlib 为静态非 PIC，不可链入共享模块；DT_NEEDED=libz.so 由 OHOS 加载器解析到 /system/lib64/platformsdk/libz.so）"

versions:
  "21.11.0":
    status: built
    build_date: "2026-10-10"
    conan_ref: "kodi-pvr-iptvsimple/21.11.0"
