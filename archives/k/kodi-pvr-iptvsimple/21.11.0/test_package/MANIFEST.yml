# test_package/MANIFEST.yml
# Upstream test declaration file (required by CI build_and_test.sh L0e)

package: kodi-pvr-iptvsimple/21.11.0
homepage: "https://github.com/kodi-pvr/pvr.iptvsimple"

# Upstream 21.11.0-Omega ships no test suite. Checked entries/evidence:
# - no tests/ directory anywhere in the source archive (find -iname '*test*'
#   returns nothing under the extracted tree)
# - CMakeLists.txt: no enable_testing()/add_test()/CTest registration (only
#   find_package + addon_version + build_addon)
# - Jenkinsfile: single line buildPlugin("Omega") — build only, no test stage
# - .github/workflows/build.yml ("Build and run tests"): the only job builds
#   the add-on against the xbmc Omega tree; the (disabled) "Debian package
#   test" job runs xbmc's debian-addon-package-test.sh — a fakeroot/dpkg
#   packaging smoke build (sudo apt-get build-dep), not a test suite, and not
#   runnable in this environment
# - azure-pipelines.yml / build-install-mac.sh: build-only helper configs
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# Consumer-side tests (test_package)
test_package_tests:
  - file: test_kodi_pvr_iptvsimple.cpp
    description: |
      Consumer test (16 assertions). Part 1 — Kodi 21 binary add-on contract:
      dlopen()s the packaged pvr.iptvsimple.so and asserts the ADDONCREATOR C
      entry points (ADDON_Create / ADDON_GetTypeVersion / ADDON_GetTypeMinVersion)
      are exported, that the PVR instance API reported is 8.3.0 (min 8.2.0),
      global main 2.0.2/2.0.0, general 1.0.5/1.0.4 and unknown types "0.0.0"
      (matching the vendored xbmc 21.3-Omega kodi/versions.h). Part 2 — real
      functionality through the packaged code: the add-on's exported FileUtils
      helpers are called directly — GzipInflate() decodes an embedded gzip
      stream to the exact expected text (zlib inflate path), XzDecompress()
      decodes an embedded xz stream to the exact expected text (liblzma path),
      and both yield no data for invalid input streams; PathCombine() builds a
      POSIX path. Every failed assertion exits non-zero.
    command: "./test_kodi_pvr_iptvsimple <addon.so>"
    assertion_count: 16
  - file: test_ohos.cpp
    description: |
      HarmonyOS-specific test (strictly compiled with -Wall -Wextra -Werror).
      Verifies platform behaviour of the OHOS (aarch64-linux-ohos, musl +
      libc++) build: (1) the module dlopen()s with RTLD_NOW, i.e. every
      relocation of the module and its DT_NEEDED entries resolves eagerly on
      OHOS/musl; (2) the add-on's zlib symbols resolve at runtime against the
      OHOS system zlib — dlsym("inflate") through the module handle plus
      dladdr() must report the system libz library (the recipe links the SDK
      sysroot libz.so because the conan zlib archive is static non-PIC and
      cannot be linked into a shared module); (3) the module file resolved by
      dladdr(ADDON_Create) is the packaged pvr.iptvsimple.so and the PVR API
      version compiled in is 8.3.0/8.2.0.
    command: "./test_kodi_pvr_iptvsimple_ohos <addon.so>"
    assertion_count: 9

assertion_count: 25

notes: |
  上游 21.11.0-Omega 无任何测试注册（无 tests 目录；CMakeLists 无
  enable_testing/add_test；Jenkinsfile 仅 buildPlugin；GitHub Actions 仅构建
  与 Debian 打包冒烟）。因此按 pre-ci-policy 记录 NO_UPSTREAM_TESTS。
  消费者测试为真实执行，两部分：
  - test_kodi_pvr_iptvsimple.cpp（Part 1 契约 + Part 2 功能）：dlopen 产物并
    断言 ADDONCREATOR 导出的 C 入口；直接调用产物导出的 FileUtils::
    GzipInflate / XzDecompress，用内嵌 gzip/xz 样本验证 zlib 与 liblzma 解压
    路径的真实行为；PathCombine 构造 POSIX 路径。
  - test_ohos.cpp（鸿蒙专项）：RTLD_NOW 即时绑定（OHOS/musl 全重定位）、
    zlib 符号运行时解析到 OHOS 系统 libz（dladdr 取证）、产物身份与 PVR
    API 版本（8.3.0/8.2.0）核对；-Werror 严格编译。
  任一断言失败进程返回非零。
