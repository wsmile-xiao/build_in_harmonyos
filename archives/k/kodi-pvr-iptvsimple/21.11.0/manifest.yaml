version: "21.11.0"
status: built
build_date: "2026-10-10"
conan_ref: "kodi-pvr-iptvsimple/21.11.0"

source:
  url: "https://github.com/kodi-pvr/pvr.iptvsimple/archive/refs/tags/21.11.0-Omega.tar.gz"
  sha256: "377fb3c69d39866c0b3b8a3a7d4c790241b15997b140f45443209c4e44e62418"
  tar_format: tar.gz
  # 版本映射：产品版本 21.11.0 对应上游 tag 21.11.0-Omega
  # （release commit fe95755432cd16acfdadac2926780bac088179ac）
  kodi_dev_kit_headers:
    # 内嵌于版本目录 kodi-dev-kit/kodi（= xbmc/addons/kodi-dev-kit/include/kodi
    # 原样内容；归一化掉 include/ 路径段，避开仓库 .gitignore 的
    # archives/**/include/ 规则），来源与 kodi-inputstream-rtmp/21.1.2 一致
    origin_tarball: "https://github.com/xbmc/xbmc/archive/refs/tags/21.3-Omega.tar.gz"
    origin_tarball_sha256: "a60afcb556e4a00cb19fc35b7e77758107c9a8096c6ce9b66af5f92396be31aa"
    vendored_subpath: "xbmc/addons/kodi-dev-kit/include/kodi -> kodi-dev-kit/kodi"
    pvr_instance_api: "8.3.0 (min 8.2.0)"

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SKIP_RPATH=ON（避免 cmake --install 改写 ELF：OHOS 加载器对产物做"
    - "  整文件完整性校验，链接后任何改动都会导致 dlopen EACCES；见 notes.md）"
  dependencies:
    - pugixml/1.15-r0（静态，编入模块；上游 pin 1.14，同 1.x 系列兼容）
    - lzma/5.6.2（XZ Utils，静态 PIC，编入模块；上游 pin xz-utils 5.4.3）
    - zlib: 系统 libz.so（conan zlib/1.3.1 为静态非 PIC 归档，无法链入共享模块；
      产物 DT_NEEDED=libz.so，运行时解析到 OHOS 系统组件
      /system/lib64/platformsdk/libz.so，test_ohos.cpp dladdr 实证）
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 CMakeLists 的 find_package(Kodi)/build_addon()/addon_version() 在 registry 无 Kodi 构建系统时不可用；仿 kodi-inputstream-rtmp 用 recipe-cmake/ 自备构建入口（build_script_folder 消费），上游源码零修改"
  - "kodi-dev-kit 头可从 xbmc 21.3-Omega 归档的 xbmc/addons/kodi-dev-kit/include/kodi 原样内嵌；ADDON_INSTANCE_VERSION_PVR=8.3.0（min 8.2.0）与 21.11.0 插件源码兼容；不定义 BUILD_KODI_ADDON 时 versions.h 编译全部版本分支，test_package 可无宿主断言"
  - "上游 Findpugixml/Findlzma（pkg-config 风格）改接 Conan CMakeDeps 的 pugixml::pugixml / lzma::lzma；zlib 用系统 z"
  - "⭐ CMake --install 的 RPATH 改写会修改产物 ELF，触发 OHOS 加载器整文件完整性校验失败（dlopen EACCES）；置 CMAKE_SKIP_RPATH=ON 使安装文件与链接器输出逐字节一致后恢复正常（单字节翻转实验为证）"
  - "addon.xml 的 library_linux 期望名为 pvr.iptvsimple.so，故 MODULE + PREFIX \"\"（不加 lib 前缀），并显式 -Wl,-soname 满足 CI L5a"
