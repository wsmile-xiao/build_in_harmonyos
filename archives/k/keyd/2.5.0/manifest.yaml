upstream_tests:
  command: "./bin/test-io t/test.conf t/*.t   # Makefile:99 test-io 目标，Makefile:113 执行行"
  test_count: 86
  notes: >
    上游 86 个 t/*.t DSL 用例（同一批语料有两条执行入口）。进程内单元入口
    （Makefile:99/113，bin/test-io 解释 t/test.conf + t/*.t）由本配方 build() 真实执行，
    读数为 registered=86 passed=86 failed=0；逐用例一个进程，因为 t/test-io.c:268 的
    run_test() 在首个不匹配处 exit(-1)，共用进程会在第 1 例之后静默截断套件。
    端到端集成入口（t/run.sh 第 5-9 行 whoami!=root 即 sudo 重启，起真实 keyd 后经 t/runner.py:50 打开
    /dev/uinput、runner.py:146 的 glob.glob("/dev/input/event*") 枚举、:147 逐个 open）在 OHOS 上 0 执行：本机无 root，
    且 input 子系统对用户态整片不可见（stat/open/opendir/inotify_add_watch 四类 syscall 共六条入口逐字
    EACCES，见 notes.md 问题表 #6）。这 86 例按"平台受限未执行"单列并附逐字 errno，
    不删用例、不缩分母、不并入通过。两条入口消费同一批 86 个语料文件，不重复计入分母。

test_package:
  assertion_count: 41
  description: "消费者测试驱动已安装 keyd 二进制与打包数据面：版本三形态互洽、usage 行与 5 个客户端命令可达性、未知子命令回落 help、list-keys 键码表（310 个命名、无空白、唯一、含 esc/a/leftshift/capslock、跨运行确定性）、守护进程无特权下的 socket 平面逐字错误串与组降权告警、reload/listen/bind/input/do 五条客户端的 IPC 失败串、monitor 先撞 input 子系统的 inotify EACCES、以及打包数据面（100 个 layout 全非空且落在 share/keyd/layouts、keyd.1.gz、keyd.compose、keyd-application-mapper 可执行）。第 3 层内嵌 probe_input（252 行、10 例内核接口探针，按 src/vkbd/uinput.c:41 与 src/device.c:218/130/58/260/266 的真实调用序列）并逐条断言 errno 为 EACCES，同时断言 open(/dev/null) 与 readdir(/dev) 两条阳性对照成立。"

knowledge_gained:
  - "DRAFT-keyd-2.5.0-ohos-input-subsystem-mac-invisible: OHOS MAC 把整个 input 子系统对用户态隐藏——stat() 与 open() 同为 EACCES（存在性在用户态不可判定，区别于 E237 的 ENOENT），且 opendir(\"/dev/input\") 返回 EACCES 而非空集合，使\"枚举到 0 个 event*\"与\"被策略拒绝\"在计数式探测里不可区分（假绿家族，与 E584 同族但机制不同——本条 syscall 正常返回 -1/EACCES） ｜ knowledge_ref: DRAFT-keyd-2.5.0-ohos-input-subsystem-mac-invisible（本条新增，同 PR 成对 .kv/.md）"
  - "uname -s 在本机返回 HarmonyOS，命中 keyd Makefile 的非 Linux 分支并追加 -linotify；OHOS 把 inotify 留在 musl libc 内且不提供 libinotify，链接期必然不可解 ⇒ 用命令行 platform=Linux 覆盖 makefile 的 = 赋值（Linux 分支仅差 COMPAT_FILES 为空） ｜ knowledge_ref: none-本包自发现（Makefile:25 platform 与 :27 ifeq 分支，无既有条目覆盖）"
  - "仓库 CI profile 的 tools.build:compiler_executables 指向 /data/service/hnp/bin/clang，而该绝对路径的可达性随设备状态变化（重启前 stat 报 Permission denied ⇒ make Error 2；重启后可 stat、X_OK 为真且交付构建正是用它，create11.log:101 逐字 CC=/data/service/hnp/bin/clang）⇒ 配方取编译器必须先用 os.access(X_OK) 校验 profile 取值，再退到 PATH 查找（同族问题也命中 CONFIG_SHELL/SHELL 指向 hnp bash） ｜ knowledge_ref: 经验汇总 §12.38 / E543 同族（hnp 工具链路径不可得 + HMDFS 默认 660 的新表现）"
  - "make install 在本包不可用的理由是需要 root：Makefile:72 执行 groupadd keyd、PREFIX 默认 /usr/local 非 root 不可写。设备自带 install（/bin/install = toybox 0.8.12，补测 install -D -m 0755、install -d、install -m 0644（父目录已存在时）三条均 rc=0）。本窗先后两次归因都不成立并在此一并更正：早先说【设备没有 install 二进制】是错的；后来说【conan buildenv 把 PATH 重写成不含 /bin】也是错的——profile 的 [buildenv] 用 PATH=+(path)/... 前插而非替换（create11.log:31 可见），基础 PATH 仍含 /bin。故 package() 不走 make install，而是逐条复现其安装行到 package_folder（Makefile:65-70 的 mkdir 与 :73-79 的 install，覆盖 bin/share/man/doc；licenses 由配方按 LICENSE 单独拷入，不在上游 install: 内）并显式 chmod 0755；不覆盖 :52-57 的 systemd 单元 keyd.service 与 :77 的 cp -r data/gnome-*（鸿蒙 PC 无 systemd/GNOME，不随包交付）。 ｜ knowledge_ref: M13-install 家族反向用例（本包属权限门槛，非 NO_INSTALL、非缺工具）"
  - "本机 /var/run 不存在 ⇒ keyd 守护进程在抵达 uinput 之前先死在 socket 锁的 open 上（ENOENT，逐字串 'open: No such file or directory'，rc=255）；因此\"跑守护进程\"取到的 errno 不是 input 平面的 errno，两个平面必须分开断言 ｜ knowledge_ref: none-本包自发现（/var/run 不存在使 socket 平面先 ENOENT，须与 input 平面分开断言）"
