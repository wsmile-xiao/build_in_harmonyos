# test_package/MANIFEST.yml — 上游官方测试声明（keyd 2.5.0）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
package: keyd/2.5.0
homepage: "https://github.com/rvaiya/keyd"

# 上游测试命令（Makefile 实测，非推测）：
#   Makefile:94  `test:`      —— 目标本身无先决条件：遍历 `t/*.sh`（唯一脚本 run.sh），由 `run.sh:28`
#                        自行 `make CONFIG_DIR=<tmpdir>` 构建 bin/keyd，再起守护进程并 `run.sh:40 ./runner.py -ev *.t`
#                        （端到端路径，需要 root + /dev/uinput）
#   Makefile:99  `test-io:`   —— 从 t/test-io.c + 8 个 src/*.c 编出 bin/test-io，
#   Makefile:113              然后执行 `./bin/test-io t/test.conf t/*.t`
# 因此上游同一个 `t/*.t` 语料（86 个 DSL 用例文件）有两条执行入口：
#   进程内单元入口 test-io（本配方 build() 真实执行）与
#   端到端集成入口 t/run.sh → t/runner.py（需 root、真实键盘抓取，本机不可用）。
# 用例语料只有 86 个文件，两条入口不重复计数（AGENTS §10.1「不得重复计数」）。
upstream_check_command: "make -n test-io   # 单元入口；集成入口为 t/run.sh -> ./runner.py -ev *.t"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 platform=Linux CC=<cc>  后由 build() 调 _run_upstream_unit_suite()：\
  编译 bin/test-io 并以「一个用例一个进程」的方式跑完 t/*.t 全部 86 例\
  （test-io.c:268 run_test() 在首个不匹配处 exit(-1)，共用进程会截断套件）"

# 上游实际运行的测试程序
upstream_tests:
  - file: "t/*.t (86 files) + t/test.conf + t/test-io.c"
    source: keyd-2.5.0/t/
    description: "上游 keyd 配置/键盘引擎 DSL 用例集，86 个 .t 文件（chord/composite/layer/macro/layout/disarm/overload/... ），由进程内驱动 t/test-io.c 解释执行；本适配逐字注册、逐条执行、零删减，实测 registered=86 passed=86 failed=0"
    command: "./bin/test-io t/test.conf t/*.t"
  - file: "t/run.sh + t/runner.py"
    source: keyd-2.5.0/t/
    description: "同一批 86 个 .t 用例的端到端集成入口：t/run.sh 第 5-9 行 whoami!=root 即 sudo 重启自己，随后起真实 keyd 守护进程、打开 /dev/uinput（runner.py:50）并以 `runner.py:146` 的 `glob.glob('/dev/input/event*')` 枚举、`runner.py:147` 逐个 open。OHOS 上 root 不可得且 input 子系统被 MAC 整体拒绝（stat/open 均 EACCES），本机 0 执行，逐字 errno 见 test_keyd.py 第 3 层探针输出与 notes.md 问题表 #6/#7"
    command: "./t/run.sh   # 需 root + /dev/uinput + /dev/input/event*"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test_keyd.py"
    description: "消费者测试 — 以 keyd 使用者的身份驱动安装包内的真实产物：keyd/客户端子命令的退出码与逐字错误串（版本三形态、usage 行、5 个客户端命令可达性、list-keys 键码表 310 个命名/无空白/唯一/确定性、守护进程无特权下的 socket 平面失败串、组降权告警、reload/listen/bind/input/do 的 IPC 错误串、monitor 先撞 input 子系统的 'inotify: Permission denied'），以及打包数据面（100 个 layout 全非空、keyd.1.gz、keyd.compose、keyd-application-mapper 可执行）"
    command: "python3 test_keyd.py <package_folder> <probe_input>"
  - file: "probe_input.c"
    description: "内核接口探针 — 按 src/vkbd/uinput.c:41（open /dev/uinput）与 :106（ioctl UI_DEV_CREATE）、src/device.c:218/130/58/260/266 的真实调用序列逐个打开/枚举 input 子系统，逐字打印 errno，并带 open /dev/null 与 readdir /dev 两条阳性对照证明拒绝是子系统级而非全局；probe_input 自身 fail=0 由 test_keyd.py 断言"
    command: "./probe_input"

# 测试断言总数
#   上游单元入口实际执行 86 例 + 消费者断言 41 条 = 127
#   （与 PR 正文「适配后测试用例统计」合计同源）
assertion_count: 127
upstream_assertions: 86
consumer_assertions: 41
platform_limited_cases: 86
max_rss_mb: 176
notes: >
  口径说明：上游 86 个 .t 语料在 OHOS 上有两条入口，本适配真实执行的是进程内单元入口
  （86/86 通过）；端到端集成入口需要 root 与 /dev/uinput 写入权限，二者在本机均不可得
  （stat/open /dev/uinput 返回 EACCES，readdir /dev/input 返回 EACCES），因此按
  AGENTS §10.1 单列 86 例为「平台受限未执行」并附逐字 errno，不计入通过、也不用
  timeout 或 || true 吞掉以制造假通过。86 例未执行不改变上游语料总数分母。
