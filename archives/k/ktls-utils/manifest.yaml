# 软件级 manifest — ktls-utils
# 遵循 ARCHIVE-SPEC v3.0

software: ktls-utils
description: Userspace TLS handshake agent (tlshd) for in-kernel TLS consumers
category: networking
license: GPL-2.0-only
homepage: https://github.com/oracle/ktls-utils
repository: https://github.com/oracle/ktls-utils
keywords:
  - ktls
  - tls
  - handshake
  - netlink
  - daemon

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Autotools 项目（AM_INIT_AUTOMAKE，无 libtool、无 AC_CANONICAL_HOST）：只装一个 sbin 守护进程 tlshd。dist tarball 已含预生成 configure / Makefile.in / config.h.in，真机与 CI worker 无 autoconf/automake 也能构建——必须用 release 资产 ktls-utils-<ver>.tar.gz，GitHub tag 归档只有 configure.ac + autogen.sh"
    - "编译所需内核 UAPI：仅 <linux/tls.h>，由 OHOS SDK native sysroot 提供（含 TLS_TX/TLS_RX、TLS_CIPHER_AES_GCM_128、struct tls12_crypto_info_aes_gcm_128、TLS_1_2/1_3_VERSION）；net/handshake 家族的枚举/属性由上游在 src/tlshd/netlink.h 内自带一份（_UAPI_LINUX_HANDSHAKE_H 守卫），不依赖系统 <linux/handshake.h>"
    - "构建依赖全部来自 ohpcd 制品仓：gnutls/3.8.10、libkeyutils/1.6.3、libnl/3.11.0、glib/2.84.0，另加 pkgconf/3.0.5 作 tool_requires；PkgConfigDeps 生成的 .pc 名对齐：gnutls / libnl-3.0 / libnl-genl-3.0 / glib-2.0"
    - "唯一的 pkg-config 名称错配：keyutils 包的 pkg_config_name 是 \"keyutils\"，而上游 configure 用 PKG_CHECK_MODULES([LIBKEYUTILS],[libkeyutils]) 探测模块 \"libkeyutils\" → build() 在生成目录里把 keyutils.pc 复制为 libkeyutils.pc（pkg-config 按文件名解析），不改任何上游源码"
    - "session-tags（libyaml 的唯一消费者）默认关闭，配方保持默认，故不引入 libyaml"
    - "上游无任何测试套件（Makefile.am 无 TESTS/check_PROGRAMS，无 tests/ 目录）→ 上游用例数 0；按 §3.6 补鸿蒙特有消费者测试（test_package/test.sh）：tlshd --version/-v/--help 冒烟 + 未知选项/缺失配置两条负向，全部走用户态、不触碰内核 handshake 派发"
    - "config.status 的 `umask 077 && mktemp -d ./confXXXXXX` 在 HMDFS 上建出属主不可写目录 → subs1.awk Permission denied；补丁把 dist tarball 已生成 configure 里该块放宽到 022（同 jellyfish E011/E114），不碰源码"
    - "OHOS 的 <linux/netlink.h>→<linux/socket.h>（Android/bionic 生成的 UAPI）直接定义 `struct sockaddr_storage`，与 musl <sys/socket.h> 撞名，-Werror 下编译即失败（tlshd.h 与 libnl <netlink/netlink.h> 两条 include 路径都会触发）。所有 .c 首行都是 `#include <config.h>`，故补丁 0002 在 config.h.in 生成 config.h 顶部 `#define _UAPI_LINUX_SOCKET_H` 跳过内核重复定义并 typedef __kernel_sa_family_t（netlink.h 的 sockaddr_nl 需要它）"
  common_dependencies:
    - gnutls/3.8.10
    - libkeyutils/1.6.3
    - libnl/3.11.0
    - glib/2.84.0

