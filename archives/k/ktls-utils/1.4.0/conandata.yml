# conandata.yml — ktls-utils 1.4.0
# 事实源：上游 GitHub release 资产 ktls-utils-1.4.0.tar.gz（tag ktls-utils-1.4.0 的
# autotools dist 包，内含预生成的 configure / Makefile.in / config.h.in，
# 真机与 CI worker 都无 autoconf/automake 时可构建）。
# sha256 本机 2026-09-22 实算（232203 B），create 时由 conan 二次校验；
# 设备侧 sha256 于 conan create 的 source() 校验通过为准（禁止抄用其它版本值）。
sources:
  url: "https://github.com/oracle/ktls-utils/releases/download/ktls-utils-1.4.0/ktls-utils-1.4.0.tar.gz"
  sha256: "acd9e1851e492e7e16b879b30fc800f4a98d4214fa534ebb7e24d379f5984770"

patches:
  - patch_file: "patches/0001-config-status-umask.patch"
    patch_description: "Relax config.status tmp-dir umask 077 -> 022 so HMDFS keeps the dir owner-writable (subs1.awk Permission denied)"
    patch_type: "portability"
  - patch_file: "patches/0002-config-h-in-musl-socket-storage.patch"
    patch_description: "OHOS/musl: suppress <linux/socket.h>'s sockaddr_storage (collides with musl <sys/socket.h> under -Werror) via _UAPI_LINUX_SOCKET_H in config.h.in, re-declaring netlink.h's __kernel_sa_family_t"
    patch_type: "portability"

