# test_package/MANIFEST.yml — ktls-utils/1.4.0
# 上游官方测试声明文件 (CI L0e 强制要求存在)
#
# 上游事实：ktls-utils 1.4.0 的 dist tarball 中没有任何测试套件——
#   顶层与所有子目录 Makefile.am 均无 TESTS / check_PROGRAMS /
#   noinst_PROGRAMS；仓库无 tests/ 目录、无 *test*/*check* 脚本。
#   取数命令（在 ktls-utils-1.4.0/ 内）：
#     grep -rniE 'TESTS|check_PROGRAMS|noinst_PROGRAMS' --include=Makefile.am . ; find . -iname '*test*'
#   两条命令输出均为空。故上游用例数为 0，本配方不声明、也不可能运行任何上游用例。
# 按赛事 §3.6：上游 N=0 → 表格写 0、勾选「补全=是」，并提供鸿蒙特有消费者测试 (>=1)。

package: ktls-utils/1.4.0
homepage: "https://github.com/oracle/ktls-utils"

# 上游无测试套件
upstream_check_command: "none"
upstream_test_in_build: false
upstream_tests: []

# 未运行项的具体技术原因（上游根本没有可运行的用例，非平台限制）
skipped_reasons:
  upstream_suite: "上游 ktls-utils 1.4.0 未提供任何测试（Makefile.am 无 TESTS/check_PROGRAMS，无 tests/ 目录，无 test/check 脚本），可用例数为 0；不存在'有用例未跑'的情形"

# test_package 中自带的测试（消费者视角，运行期在 OHOS aarch64 真机执行）
test_package_tests:
  - file: test.sh
    description: >-
      消费者测试：对已打包的 tlshd 二进制做命令行冒烟与负向断言——
      (1) 位于 PATH 且可执行；(2) `tlshd --version` 退出 0；(3) 版本串含
      "ktls-utils 1.4.0"；(4) `tlshd -v` 同样输出版本串；(5) `tlshd --help`
      退出 0 且含 "usage:"；(6) 未知选项被拒（非 0 退出）；(7) 显式
      `-c <不存在的配置>` 被拒（非 0 退出）。仅覆盖用户态代码路径，
      间接验证 gnutls/libkeyutils/libnl/glib 的动态链接在 OHOS 上成功解析。
    command: "bash test.sh"

# 断言总数（与 test_package/test.sh 中 pass()/fail() 计数一致）
assertion_count: 7
