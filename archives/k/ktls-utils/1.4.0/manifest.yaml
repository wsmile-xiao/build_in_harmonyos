# 版本级 manifest — ktls-utils 1.4.0 (OpenHarmony PC / OHOS aarch64)
# 文件位置: archives/k/ktls-utils/1.4.0/manifest.yaml

version: "1.4.0"
software: "ktls-utils"
status: built
build_date: "2026-09-22"
build_system: autotools

source:
  url: "https://github.com/oracle/ktls-utils/releases/download/ktls-utils-1.4.0/ktls-utils-1.4.0.tar.gz"
  sha256: "acd9e1851e492e7e16b879b30fc800f4a98d4214fa534ebb7e24d379f5984770"
  tar_format: tar.gz

build:
  system: autotools
  configure_options: []
  dependencies:
    - "gnutls/3.8.10"
    - "libkeyutils/1.6.3"
    - "libnl/3.11.0"
    - "glib/2.84.0.2"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-status-umask.patch"
  - "0002-config-h-in-musl-socket-storage.patch"

knowledge_gained:
  - "ktls-utils 只需 <linux/tls.h> 一个内核 UAPI 头（OHOS SDK native sysroot 已提供，含 TLS_TX/RX、TLS_CIPHER_AES_GCM_128、tls12_crypto_info_aes_gcm_128、TLS_1_2/1_3_VERSION），net/handshake 家族的枚举/属性上游在 src/tlshd/netlink.h 自带一份，故不需要系统 <linux/handshake.h>；configure 的 AC_COMPILE_IFELSE 探测 TLS_TX_MAX_PAYLOAD_LEN 在 SDK 头里不存在→自动 HAVE_TLS_TX_MAX_PAYLOAD_LEN=no，无需干预"
  - "制品仓的 keyutils 包 (libkeyutils/1.6.3) 把 pkg_config_name 定为 \"keyutils\"，而上游 configure 用 PKG_CHECK_MODULES([LIBKEYUTILS],[libkeyutils]) 找模块名 \"libkeyutils\"——最小修法是 build() 里把生成的 keyutils.pc 复制成 libkeyutils.pc（pkg-config 以文件名解析模块），完全不碰上游源码"
  - "libnl/3.11.0 通过 components 暴露 libnl-3.0 与 libnl-genl-3.0 两个 pkg_config_name，glib/2.84.0.2 暴露 glib-2.0，gnutls/3.8.10 默认取包名 gnutls——PkgConfigDeps 直接对齐 configure 需要的模块名，唯一需要补名的是 libkeyutils"
  - "CI #56165 证明 glib/2.84.0 的静态 glib-2.0.pc 把 OHOS loader 当 gettext 符号库链接：去掉该项会留下 bindtextdomain/gettext 未定义，保留则 CI 沙箱找不到 /lib/ld-musl-aarch64.so.1。改用已发布 glib/2.84.0.2（共享 GLib，proxy-libintl 静态并入 GLib），保留 gettext 行为且不要求 CI 的绝对 /lib 路径"
  - "上游无任何测试套件（所有 Makefile.am 都没有 TESTS/check_PROGRAMS/noinst_PROGRAMS，仓库无 tests/ 目录、无 test/check 脚本）→ 诚实声明上游用例 0，按 §3.6 用消费者测试补：对打包后的 tlshd 做 --version/-v/--help 冒烟并加两条负向（未知选项、显式缺失配置文件），全部走用户态代码，不触碰需要内核 handshake netlink 家族的 tlshd_genl_dispatch()"
  - "构建输入用 release 资产 ktls-utils-1.4.0.tar.gz（232203 B，内含预生成 configure/Makefile.in），不能用 GitHub tag 归档（只有 configure.ac + autogen.sh，真机/CI worker 无 autoconf 无法再生成）"
  - "config.status 的 `umask 077 && mktemp -d ./confXXXXXX` 在 HMDFS 上建出属主不可写目录（`./config.status: line 622: ./confXXXXXX/subs1.awk: Permission denied` → `could not setup config files machinery`）——放宽 umask 到 022 即可（同 jellyfish E011/E114）；补丁打在 dist tarball 已生成的 configure 里 config.status 的 tmp 块（7714-7723 行），不碰源码"
  - "OHOS 的 <linux/netlink.h>→<linux/socket.h> 是 Android(bionic) 生成的 UAPI，里面直接定义 `struct sockaddr_storage`（守卫 `_UAPI_LINUX_SOCKET_H`），与 musl <sys/socket.h> 的 `sockaddr_storage` 撞名，在 `-Werror` 下编译即失败（client.c 经 tlshd.h、config.c/netlink.c 经 libnl <netlink/netlink.h> 两条路都会触发）。因 libnl 那条 include 早于 tlshd.h，只在 tlshd.h 里设守卫不够；用 `-include` 强注 shim 又没能进 CFLAGS（conan AutotoolsToolchain 只在 CFLAGS 留 -O3）。最稳的注入点是 config.h：所有 .c 第一行都是 `#include <config.h>`，故补丁 0002 改 config.h.in，在生成 config.h 顶部 `#define _UAPI_LINUX_SOCKET_H` 跳过内核重复定义并 `typedef unsigned short __kernel_sa_family_t;`（netlink.h 的 sockaddr_nl 需要它，而它只在被跳过的 linux/socket.h 里有定义）"

patch_generation:
  method: manual-diff
  patches_count: 2

