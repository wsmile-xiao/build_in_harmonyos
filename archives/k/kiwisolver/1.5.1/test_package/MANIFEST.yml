# test_package/MANIFEST.yml — kiwisolver 1.5.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: kiwisolver/1.5.1
homepage: "https://github.com/nucleic/kiwi"

# 上游测试套件：tests/ 下 7 个 googletest 测试文件（googletest v1.16.0）
# 运行方式：CMake KIWI_BUILD_TESTS=ON → add_subdirectory(tests) →
# gtest_discover_tests(kiwi_tests)。本地实测：38/38 全通过。
upstream_check_command: "cmake -DKIWI_BUILD_TESTS=ON && ctest"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/kiwi_tests
    source: kiwi-1.5.1/tests/*.cpp
    description: "googletest 套件：ConstraintTest 5 + ExpressionTest 7 + SimplexTest 1 + SolverTest 9 + StrengthTest 2 + TermTest 7 + VariableTest 7 = 38 个 TEST 用例"
    command: "./kiwi_tests"

# test_package 消费者测试（R34 真实 API：编译 + 求解 kiwi::Solver）
test_package_tests:
  - file: test_kiwisolver.cpp
    description: "Compiles against packaged <kiwi/kiwi.h> and actually solves a constraint system (x+y=10, x-y=4 => x=7,y=3) plus edit-variable/strength checks; asserts the solution values"
    command: "./test_kiwisolver"

# 断言总数：上游 38 + test_package 求解断言 2 组
assertion_count: 40
