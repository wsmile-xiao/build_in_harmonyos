# 版本级 manifest — kiwisolver 1.5.1
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.5.1"

# 软件名
software: kiwisolver

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-30"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub release tag 归档）
  url: "https://github.com/nucleic/kiwi/archive/refs/tags/1.5.1.tar.gz"

  # 源码校验和（sha256，tar tzf 实测）
  sha256: "dffda5b3207852201ab66f82364ec6cf06c3285eb13cf688ae90b12a99445d9d"

  # 压缩格式
  compression: tar.gz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "kiwi-1.5.1"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  # header-only INTERFACE 库（kiwi::kiwi），CMake 无 install() 规则
  options: []
  notes: "package_type=header-library，package() 手动拷贝 kiwi/*.h 到 include/kiwi"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: "header-only C++11 库，仅依赖标准 C++，无外部依赖，跨平台兼容性好"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 38
  failed: 0
  note: |
    上游测试：tests/ 下 7 个 googletest 测试文件（googletest v1.16.0 FetchContent）
    ——ConstraintTest 5 + ExpressionTest 7 + SimplexTest 1 + SolverTest 9 +
    StrengthTest 2 + TermTest 7 + VariableTest 7 = 38 个 TEST 用例。
    运行方式：KIWI_BUILD_TESTS=ON 时 add_subdirectory(tests)，gtest_discover_tests 注册。
    适配后：test_package 编译消费者程序真实调用 kiwi::Solver API（R34），
    用例数见 test_package 验证（编译 + 求解断言）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kiwisolver（nucleic/kiwi）是 header-only C++ Cassowary 求解器库，CMake INTERFACE 库（kiwi::kiwi），无 install() 规则——header-only 库配方：package() 手动拷头文件 + package_type=header-library"

references:
  - https://github.com/nucleic/kiwi
  - https://kiwisolver.readthedocs.io/en/latest/
