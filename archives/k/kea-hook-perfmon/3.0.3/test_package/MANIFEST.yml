# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-perfmon/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的两个 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> dhcp-perfmon-lib-tests dhcp-perfmon-libload-tests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-perfmon-lib-tests dhcp-perfmon-libload-tests"

# 上游实际运行的测试程序（本次适配实测：125 + 5 = 130 个用例全部通过）
upstream_tests:
  - file: dhcp-perfmon-lib-tests
    source: src/hooks/dhcp/perfmon/tests/
    description: >-
      9 个 gtest 单元文件覆盖 perfmon hook（alarm/duration key/monitored duration/
      config/commands/manager）；本配置注册 125 个用例，源码另有 1 个 DISABLED_speed
      用例被 gtest 排除（宏计 126）
    command: "./dhcp-perfmon-lib-tests"
  - file: dhcp-perfmon-libloadtests
    source: src/hooks/dhcp/perfmon/libloadtests/
    description: "5 个 gtest 用例，校验 libdhcp_perfmon.so 可被 Kea hook 框架加载/卸载"
    command: "./dhcp-perfmon-libload-tests"

# test_package 中自带的测试（1 项消费者契约 + 1 项鸿蒙特有）
test_package_tests:
  - file: test_perfmon_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload 契约符号、perfmon 控制入口与 hook ABI 版本"
    command: "./test_perfmon_hook <package>/lib/kea/hooks/libdhcp_perfmon.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有用例：校验包内 libdhcp_perfmon.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc libc.so.6、
      链接 libc++_shared.so）并验证 OHOS 加载器可 dlopen(RTLD_NOW) 解析
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_perfmon.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（本次适配实测：1 个，1/1 通过）
ohos_specific_tests:
  count: 1
  entries:
    - test_ohos_platform
  command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_perfmon.so"
  result: "1/1 passed"

# 测试用例总数（本次实测执行的上游用例数：125 + 5）
assertion_count: 130
