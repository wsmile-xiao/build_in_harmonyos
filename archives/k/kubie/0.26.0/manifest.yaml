  - "Rust项目在OHOS上使用aws-lc-rs作为TLS crypto backend会链接失败(undefined reference to aws_lc_*函数)，需替换为ring backend"
  - "Cargo.toml添加rustls依赖with ring feature可解决aws-lc-rs链接问题"
  - "cargo build --release --target aarch64-unknown-linux-ohos是OHOS Rust项目标准编译方式"

