package: keyboards-rg/0.3-nmu2
homepage: "https://packages.debian.org/sid/keyboards-rg"

upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: ""

# The source contains test/slgul_rg, but it is an XKB layout fixture rather
# than an executable or registered upstream test. debian/rules has no test
# target, so the package has zero upstream tests to run.
upstream_tests: []

test_package_tests:
  - file: test_keyboards_rg.py
    description: "Consumer validation of the exact XKB layouts, console maps, helper scripts, license, source hashes, and relocatable package paths"
    command: "python3 test_keyboards_rg.py PACKAGE_FOLDER source_inventory.json TARGET_OS"
  - file: test_keyboards_rg.sh
    description: "HarmonyOS consumer validation using the target /bin/sh and sha256sum utilities"
    command: "sh test_keyboards_rg.sh PACKAGE_ROOT source_inventory.json"
  - file: test_keyboards_rg.sh
    description: "HarmonyOS end-to-end execution of cyrx, eox, and skx through a recorded setxkbmap backend boundary"
    command: "sh test_keyboards_rg.sh PACKAGE_ROOT source_inventory.json"

assertion_count: 63
