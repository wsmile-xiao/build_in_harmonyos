# test_package/MANIFEST.yml
# 上游官方测试声明文件
# kaitai-runtime 0.11 — 上游测试为 tests/unittest.cpp (gtest, 53 tests)

package: kaitai-runtime/0.11
homepage: "https://github.com/kaitai-io/kaitai_struct_cpp_stl_runtime"

# 上游测试命令 (cmake 构建后运行 unittest)
upstream_check_command: "cmake --build build -j4 && ./build/tests/unittest"

# conanfile.py build() 中未集成上游测试；上游测试在本地门禁中实际执行
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: unittest.cpp
    source: kaitai-runtime-0.11/tests/unittest.cpp
    description: "KaitaiStream unit tests: byte reading, bit access, string encoding (ICONV incl. IBM437), zlib process"
    command: "./build-dir/tests/unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: kstream 读取 + bytes_to_str(IBM437→CP437 别名) 编码转换"
    command: "./test_kaitai-runtime"

# 测试断言总数 (上游 53 tests + test_package 2 断言)
assertion_count: 55
