# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-limits/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的两个 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> dhcp-limits-tests dhcp-limits-libloadtests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-limits-tests dhcp-limits-libloadtests"

# 上游实际运行的测试程序（本次适配实测：192 + 15 = 207 个用例全部通过）
upstream_tests:
  - file: dhcp-limits-tests
    source: src/hooks/dhcp/limits/tests/
    description: >-
      limits hook 单元测试（limit_manager / lease limiting / rate limiting），
      本配置注册 192 个用例（与源码 TEST/TEST_F 宏数一致，无未注册用例）
    command: "./dhcp-limits-tests"
  - file: dhcp-limits-libload-tests
    source: src/hooks/dhcp/limits/libloadtests/
    description: "15 个 gtest 用例，校验 libdhcp_limits.so 可被 Kea hook 框架加载/卸载（meson 注册的套件名 dhcp-limits-libloadtests）"
    command: "./dhcp-limits-libload-tests"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_limits_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload 契约符号与 hook ABI 版本"
    command: "./test_limits_hook <package>/lib/kea/hooks/libdhcp_limits.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 libdhcp_limits.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc libc.so.6、
      链接 libc++_shared.so）并验证 OHOS 加载器可 dlopen(RTLD_NOW) 解析
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_limits.so"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 包内
      20 个 Kea 运行时库（lib/libkea-*.so*），校验完整 NEEDED 闭包可解析、
      闭包驻留后 hook 仍可加载且 load/unload 契约符号可解析
    command: "./test_ohos_runtime <package>/lib/kea/hooks/libdhcp_limits.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（本次适配实测：2 个，2/2 通过）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <so> && ./test_ohos_runtime <so>"
  result: "2/2 passed"

# 测试用例总数（本次实测执行的上游用例数：192 + 15）
assertion_count: 207
