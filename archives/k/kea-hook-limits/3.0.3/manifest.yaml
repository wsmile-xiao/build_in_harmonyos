# ============================================================
# 鸿蒙特有测试（test_package，2 个用例）
# ============================================================

ohos_specific_tests:
  count: 2
  entries:
    - "test_package/test_ohos_platform.c → test_ohos_platform（平台 ABI）"
    - "test_package/test_ohos_runtime.c → test_ohos_runtime（运行时闭包）"
  command: "./test_ohos_platform <so> && ./test_ohos_runtime <so>"
  checks:
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so）"
    - "OHOS 加载器 dlopen(RTLD_NOW|RTLD_LOCAL) 可解析插件及其 20 个 Kea 运行库"
    - "包内 20 个 Kea 运行时库（lib/libkea-*.so*）在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 成功"
    - "闭包驻留后 hook 仍可加载，load/unload 契约符号可在运行时解析"
  cases_run: 2
  cases_passed: 2
  cases_failed: 0

