name: kernel-hooks
version: 0.3
upstream_url: https://gitlab.alpinelinux.org/alpine/aports/

test_manifest:
  - type: upstream
    build_system: none
    available: false
    reason: "上游 APKBUILD 中 options=\"!check\" 明确声明无测试，且为纯 Shell 脚本包"
    source: []
    description: "上游未提供任何测试用例"

  - type: harmony
    build_system: Shell
    source:
      - "test_package.sh"
    description: "消费者测试：验证 README 与 trigger 脚本安装路径、可执行权限、Shell 语法以及无 hooks 目录时的 exit 0 行为"
