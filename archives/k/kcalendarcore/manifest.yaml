software: kcalendarcore
display: "KCalendarCore"
description: "KDE Frameworks 6 calendar access library (events/todos/journals, ICal/vCal/xCal formats on libical)"
category: library
homepage: "https://invent.kde.org/frameworks/kcalendarcore"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "USE_QML=OFF: Qt6Qml not published to ohpcd (qtbase package)"
    - "BUILD_PYTHON_BINDINGS=OFF: Shiboken6/PySide6 unavailable on OHOS"
    - "LibIcal found via the project's cmake/FindLibIcal.cmake module finder; libical package root injected into CMAKE_PREFIX_PATH"
    - "461 data-driven CTest entries need perl (tool_requires perl/5.42.2) + diff"
    - "TZ=UTC + libical builtin tzdata (share/libical/zoneinfo) keep timezone tests deterministic"
    - "ECM 6.26+ KDEInstallDirs6 runs qtpaths at configure time; sandbox LD_LIBRARY_PATH must have /system/lib64 prepended so the compatible libc++_shared.so is found"
  common_dependencies:
    - qtbase
    - libical
    - ecm

versions:
  "6.26.0":
    status: built
    build_date: "2026-09-06"
    conan_ref: "kcalendarcore/6.26.0"
