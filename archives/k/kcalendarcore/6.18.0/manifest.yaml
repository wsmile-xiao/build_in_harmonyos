knowledge_gained:
  - "kcalendarcore exports the KF6CalendarCore CMake package and KF6::CalendarCore target."
  - "The main library links LibIcal privately, and the upstream autotests link LibIcal directly, so this package validates that libical/4.0.1 is consumable by the Akonadi calendar chain."
  - "The recipe uses the upstream FindLibIcal module with explicit libical include/library hints so the expected LibIcal imported target is available."
  - "libical 4 exposes status parsing as icalproperty_string_to_status; the xCal parser patch updates the single older icalenum_string_to_status call."
  - "The verified consumer smoke serializes and parses a UTC calendar event through KF6::CalendarCore, proving the libical-backed calendar path is consumable by later Akonadi calendar libraries."
  - "The current OHOS package profile does not expose a Qt-consumable IANA/system timezone database, so QTimeZone cannot resolve the named zones required by the excluded upstream timezone tests."
