# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kcalendarcore/6.26.0.

package: kcalendarcore/6.26.0
homepage: https://invent.kde.org/frameworks/kcalendarcore

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kcalendarcore-6.26.0/autotests/
    description: "KCalendarCore upstream CTest suite: 505 registered entries = 44 unit test executables + 461 data-driven file tests (RecurNext/RecurPrev/RecursOn over RecurrenceRule fixtures, Compat/VCalIn/XCalIn format round-trips) driven through autotests/runsingletestcase.pl"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON (perl + diff required)"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke creates MemoryCalendar/Event/Todo and round-trips an ICal string through ICalFormat (libical-backed parser)."
    command: "conan create (test_package builds and runs test_kcalendarcore)"

assertion_count: 3
