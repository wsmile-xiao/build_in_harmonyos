# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: kamailio/6.1.3
homepage: "https://www.kamailio.org"

# 上游测试命令
# 清点结论（R51 三步法，证据见 notes.md §3）：
#   - kamailio 6.1.3 官方 src tarball 顶层为 COPYING/ ChangeLog/ INSTALL/
#     Makefile/ README/ cfg/ doc/ misc/ pkg/ src/ utils/，不含 tests/ 目录
#   - src/Makefile 无 check 目标；src/core/ 无独立测试源文件
#   - 上游 CI 走 pkg/kamailio 的 Smoketest（需运行中 SIP 场景），非源码内
#     自动化套件（与 6.0.6 模块族口径一致）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无 core 自动化测试套件）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: check_kamailio.py
    description: "产物结构校验：ELF aarch64/ET_DYN(PIE)、版本标识 kamailio 6.1.3、core 特征标记（二进制内嵌字节）、NEEDED 仅 libc.so、licenses/COPYING 随包、无 RPATH/RUNPATH 泄漏"
    command: "python3 check_kamailio.py"

# 测试断言总数（check_kamailio.py 中的 check() 调用数，readelf 存在时 12 项）
assertion_count: 12
