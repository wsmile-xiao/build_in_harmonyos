# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.1.3"

# 软件名
software: "kamailio"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.kamailio.org/pub/kamailio/6.1.3/src/kamailio-6.1.3_src.tar.gz"

  # 源码校验和
  sha256: "e3db3d2166f44d8f3dd90db09063f70b55bbecce295abd7f31c34d8b9dd79721"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E429 草稿（D35C）core 验证扩展：锁机制需 -DUSE_PTHREAD_MUTEX；musl _res 缺失需 env DEFS=-UHAVE_RESOLV_RES（零补丁）"
  - "DRAFT-E257 新增：musl 不导出 glibc _res 全局（libc 面独立 delta，供同类网络软件复用）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
