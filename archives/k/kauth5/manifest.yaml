software: kauth5
display: "KAuth (KF5)"
description: "KDE Frameworks 5 (Qt5) authorization framework: execute privileged actions through a backend/helper architecture (libKF5AuthCore + libKF5AuthWidgets, SOVERSION 5)"
category: library
homepage: "https://invent.kde.org/frameworks/kauth"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KAUTH_BACKEND_NAME=FAKE / KAUTH_HELPER_BACKEND_NAME=FAKE: PolkitQt-1 is not published to ohpcd and needs a running polkit daemon; upstream ConfigureChecks.cmake falls back to FAKE when no backend is found, so the same decision is pinned explicitly. Consequence: kauth-policy-gen and the plugin MODULE targets are not built, and KAuthPolicyGenTest/KAuthPolicyGenTestCompare are not registered"
    - "QT_MAJOR_VERSION=5 forced in the toolchain: ECM 6.20 (>= 5.240) would otherwise default BUILD_WITH_QT6=ON and steer find_package(Qt${QT_MAJOR_VERSION}) at Qt6"
    - "qt5-qtbase/5.15.2.2 required instead of 5.15.2: only that revision ships the Qt5Widgets and Qt5DBus components; kcoreaddons5/5.116.0 references 5.15.2, so the version family is unified with override=True (kcoreaddons5 stays a published-binary cache hit)"
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "Qt5 targets resolve through the native CMake tree shipped by the qmake-built qt5-qtbase package (lib/cmake/Qt5*, bin/moc|rcc|uic, Qt5*Macros.cmake) - no CMakeDeps-regenerated Qt5Config (unlike kwidgetsaddons5)"
    - "ecm_install_po_files_as_qm(poqm) patched out: Qt5LinguistTools is not part of the qt5-qtbase package"
    - "SONAME flags provided explicitly (-Wl,-soname,): HarmonyOS is not mapped to the Linux CMake platform, so the shared libraries would otherwise lack DT_SONAME (CI L5)"
    - "BUILD_TESTING=ON with QT_QPA_PLATFORM=offscreen; a private dbus-daemon (bin/dbus-daemon from the dbus package pulled in by qt5-qtbase) is started for KAuthHelperTest and torn down after the run; when no daemon is available the test is excluded and reported as excluded, never as passing"
  common_dependencies:
    - qt5-qtbase
    - kcoreaddons5
    - ecm

versions:
  "5.116.0":
    status: built
    build_date: "2026-10-03"
    conan_ref: "kauth5/5.116.0"
