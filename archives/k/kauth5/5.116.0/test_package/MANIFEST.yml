# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI build_and_test.sh L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md

package: kauth5/5.116.0
homepage: "https://invent.kde.org/frameworks/kauth"

# 上游测试命令 (CMake/CTest 项目)
upstream_check_command: "ctest --test-dir build --output-on-failure --no-tests=error"

# conanfile.py build() 中是否已集成上游测试
# 说明: 上游 autotests/CMakeLists.txt 在 BUILD_TESTING=ON 且 Qt5::Test 可用时
# 注册 KAuthSetupActionTest / KAuthHelperTest（KAuthPolicyGenTest 与
# KAuthPolicyGenTestCompare 需要非 FAKE 后端，OHOS 上不注册）。两项已在 conan
# 配方 build() 末尾通过 ctest 实际运行（真机实测见 reports/test-report.md）：
#   KAuthSetupActionTest  自包含，可直接运行
#   KAuthHelperTest       需要 D-Bus session bus，配方用 dbus 包自带的
#                         bin/dbus-daemon 启动私有 session bus 后运行
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure --no-tests=error -j1"

# 上游实际注册/运行的测试程序
upstream_tests:
  - file: autotests/SetupActionTest.cpp
    source: kauth-5.116.0/autotests/SetupActionTest.cpp
    description: "KAuth Action/ExecuteJob/ActionReply 上游单测（自包含，使用 autotests 内的 TestBackend 与 BackendsManager）"
    command: "./bin/KAuthSetupActionTest"
  - file: autotests/HelperTest.cpp
    source: kauth-5.116.0/autotests/HelperTest.cpp
    description: "KAuth DBusHelperProxy 上游单测（通过 session bus 驱动 helper，需要 dbus-daemon）"
    command: "./bin/KAuthHelperTest"

# 未注册的上游测试（需非 FAKE 后端）
upstream_tests_not_registered:
  - name: KAuthPolicyGenTest
    reason: "add_test 位于 if(NOT KAUTH_BACKEND_NAME STREQUAL \"FAKE\") guard 内；OHOS 使用 FAKE 后端（PolkitQt-1 未发布到 ohpcd）"
  - name: KAuthPolicyGenTestCompare
    reason: "同上"

# test_package 中自带的测试 (消费者视角验证, 调用 KF5AuthCore API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 调用 KAuth::Action 构造/name/detailsV2/arguments/helperId 往返、空 Action 无效性、FAKE 后端下 status==DeniedStatus 与 execute() 失败于 BackendError、ActionReply 工厂函数"
    command: "./test_kauth5"
  - file: test_kauth5_ohos.cpp
    description: "鸿蒙特有测试: 断言 OHOS FAKE 后端回退路径的可观测行为（无 helper 绑定时 helperId 为空、setHelperId 后可往返且 hasHelper()==true、execute() 失败于 BackendError、空 Action 为 InvalidStatus）"
    command: "./test_kauth5_ohos"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 2 项 ctest（KAuthSetupActionTest 约 20 个 QVERIFY/QCOMPARE、
# KAuthHelperTest 约 25 个）+ test_package 2 个消费程序（约 20 个断言分支）
assertion_count: 45
