# 版本级 manifest — kauth5 5.116.0 (KDE Frameworks 5 / Qt5)
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "5.116.0"
software: "kauth5"
status: built
build_date: "2026-10-03"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.kde.org/stable/frameworks/5.116/kauth-5.116.0.tar.xz"
  sha256: "ace1ee1ac0aa1b291c4c50c93fc3503b62318eeef0df0ee394a5a08da9691ff4"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DQT_MAJOR_VERSION=5"
    - "-DBUILD_TESTING=ON"
