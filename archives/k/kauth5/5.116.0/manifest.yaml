  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-CMakeLists.txt.patch"

# ============================================================
# 测试结果（真机实测，2026-10-03）
# ============================================================

test_results:
  type: local_audit_pass
  upstream: >-
    Upstream autotests/CMakeLists.txt declares 4 CTest entries. With
    KAUTH_BACKEND_NAME=FAKE, KAuthPolicyGenTest and KAuthPolicyGenTestCompare
    are not registered (they sit inside `if(NOT KAUTH_BACKEND_NAME STREQUAL
    "FAKE")`), leaving 2 registered: KAuthSetupActionTest and KAuthHelperTest.
    Both targets compiled 100% with no source patch. KAuthSetupActionTest
    executed and passed 1/1 ("100% tests passed, 0 tests failed out of 1").
    KAuthHelperTest was actually attempted with a private dbus-daemon session
    bus (bin/dbus-daemon from the dbus package pulled in by
    qt5-qtbase/5.15.2.2, started with its own share/dbus-1/session.conf); it
    does not complete because registering the helper D-Bus service
    ("org.kde.kf5auth.autotest") never succeeds on OHOS ("Error registering
    helper DBus service ... Not connected to D-Bus server"), so it timed out at
    the 60s cap and is reported as excluded, never counted as passed.
  upstream_counts:
    discovered: 4
    registered: 2
    executed: 2
    passed: 1
    failed: 0
    skipped: 0
    excluded: 1
    not_registered: 2
    names_registered:
      - KAuthSetupActionTest
      - KAuthHelperTest
    names_not_registered:
      - KAuthPolicyGenTest
      - KAuthPolicyGenTestCompare
    names_excluded:
      - KAuthHelperTest
  test_package: >-
    "2/2 passed - conan create built test_package/test_kauth5 and
    test_package/test_kauth5_ohos against the installed KF5::AuthCore and
    executed both on the OHOS runtime: test_kauth5 printed 'kauth5 test_package
    OK (KF5AuthCore 5.116.0)' and test_kauth5_ohos printed 'test_kauth5_ohos:
    PASS (KF5AuthCore 5.116.0, FAKE backend fallback verified)'."
  ohos_run: >-
    "passed - both consumer binaries executed natively on the HarmonyOS
    aarch64 device (conan create on the device itself), with the dependency
    libraries served from a signed private copy"
  harmony_specific:
    count: 1
    tests:
      - file: test_package/test_kauth5_ohos.cpp
        layer: runtime
        description: >-
          HarmonyOS-specific test. Asserts the observable behaviour of the OHOS
          FAKE-backend adaptation path: a well-formed Action is still valid but
          reports DeniedStatus; helperId() is empty until setHelperId() and
          hasHelper() then returns true; execute() fails with
          ActionReply::BackendError. Guarded by `#ifndef __OHOS__ #error`.

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "KAUTH_BACKEND_NAME=FAKE（非 PolkitQt-1）：polkit-qt-1 未发布到 ohpcd，且运行需要 polkit daemon；上游 ConfigureChecks.cmake 在探测不到后端时本就回退 FAKE，此处显式固定同一决策。副作用：kauth-policy-gen 与两个插件 MODULE 目标不构建，KAuthPolicyGen*/KAuthPolicyGenTestCompare 两项 ctest 不注册"
  - "QT_MAJOR_VERSION=5 必须显式固定：ECM 6.20 >= 5.240，QtVersionOption.cmake 会在尚无 Qt target 时默认 BUILD_WITH_QT6=ON，导致 find_package(Qt${QT_MAJOR_VERSION}) 去找 Qt6（kcoreaddons5/kwidgetsaddons5 先例）"
  - "qt5-qtbase 必须用 5.15.2.2 而非 5.15.2：只有 5.15.2.2 起才提供 Qt5Widgets/Qt5DBus 组件（上游需要 find_package(Qt5 ... Widgets) 与 Qt5DBus CONFIG REQUIRED）；kcoreaddons5 声明的是 5.15.2，用 override=True 统一版本族（KDE 迁移固定的依赖版本族不匹配 #4979 模式）"
  - "qt5-qtbase 是 qmake/configure 产物，自带完整 native cmake 配置树（lib/cmake/Qt5*、bin/moc|rcc|uic、Qt5*Macros.cmake）；KAuth 的 Qt5 target 解析直接走该原生配置，无需像 kwidgetsaddons5 那样用 CMakeDeps 重建 Qt5Config"
  - "dbus/1.14.10 在 ohpcd 未打包 dbus-daemon？实际打包了 bin/dbus-daemon 与 bin/dbus-run-session（qt5-qtbase/5.15.2.2 经 dbus 依赖引入），因此 KAuthHelperTest 可为其启动私有 session bus 真实运行（与 kauth/6.26.0 记录的环境相反，凸显环境语义可迁移性核验 W0b 的必要性）"
  - "test_package 运行环境：OHOS 沙箱对用户路径二进制可能拒绝 exec，失败时回退到 readelf/nm 链接级 R34 证明（kcoreaddons5 先例）"

patch_generation:
  method: manual
  patches_count: 1

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: 'pending'
