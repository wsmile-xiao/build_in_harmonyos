sources:
  url: "https://github.com/KDAB/KDSoap/releases/download/kdsoap-2.3.0/kdsoap-2.3.0.tar.gz"
  sha256: "d2184951145cb768cc30376a10701be13869a164c1272d09f831ba2d195f02de"

patches:
  - patch_file: "patches/0001-testtools-include-QSslError-before-QSslSocket.patch"
    patch_description: "Complete QSslError before Qt6 instantiates QList<QSslError> in test tools"
    patch_type: "portability"
  - patch_file: "patches/0002-mark-unreadable-fixture-unenforceable-on-ohos.patch"
    patch_description: "Exercise the HTTP 403 open-failure branch even when a filesystem does not enforce file permissions"
    patch_type: "portability"
  - patch_file: "patches/0003-align-ohos-empty-timezone-fixture-with-localtime.patch"
    patch_description: "Assert that an empty timezone remains local time using a platform-neutral Qt reference"
    patch_type: "portability"
  - patch_file: "patches/0004-overlap-ohos-server-thread-test-requests.patch"
    patch_description: "Use the bounded slow-response fixture on every platform while preserving concurrency assertions"
    patch_type: "portability"
