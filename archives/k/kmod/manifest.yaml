software: kmod
display: "kmod"
description: "Library and tools for managing Linux kernel modules"
category: system
homepage: "https://git.kernel.org/pub/scm/utils/kernel/kmod/kmod.git"
license: LGPL-2.1-or-later
build_system: meson

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "OHOS musl 无 glibc 扩展 program_invocation_* / get_current_dir_name，需 musl 兼容补丁（__progname / getcwd）"
    - "OHOS toybox ln 不支持长选项，meson 安装符号链接脚本需容错，由配方 python 创建"
    - "上游 testsuite 需 Linux kernel kbuild，OHOS 无法运行（-Dbuild-tests=false）"
  common_dependencies:
    - zlib
    - xz
    - zstd
    - openssl

# 版本索引
versions:
  "34":
    status: built
    build_date: "2026-09-05"
    conan_ref: "kmod/34"
