package: kmod/34
homepage: "https://git.kernel.org/pub/scm/utils/kernel/kmod/kmod.git"

upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test -C build"

upstream_tests:
  - file: testsuite/test-testsuite.c
    source: kmod-34/testsuite/test-testsuite.c
    description: "libkmod testsuite harness (16 test-*.c executables registered via meson test)"
    command: "test-testsuite"

test_package_tests:
  - file: test.c
    description: "Consumer test: kmod_new + kmod_get_dirname + kmod_module_new_from_name/get_name"
    command: "./test_kmod"

assertion_count: 3
