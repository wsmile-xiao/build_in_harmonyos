sources:
  url: "https://www.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.tar.xz"
  sha256: "12e7884484151fbd432b6a520170ea185c159f4393c7a2c2a886ab820313149a"

patches:
  - patch_file: "patches/0001-musl-compat.patch"
    patch_description: "musl compat: define program_invocation_name/short_name from __progname (kmod.h decl + log.c init) and fall back to getcwd(NULL,0) for the glibc-only get_current_dir_name"
    patch_type: "portability"
  - patch_file: "patches/0002-testsuite-ohos-enable.patch"
    patch_description: "testsuite on OHOS: path.c undef open64/fopen64/stat64 (sysroot fcntl.h aliases them to open), testsuite/meson.build invokes setup scripts via explicit bash (no /bin/bash on OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0003-module-playground-stub-build.patch"
    patch_description: "module-playground: build dummy kernel modules with stub kernel headers (stub-linux/) + native clang instead of a Linux kbuild tree (absent on OHOS); produces .ko with .modinfo for libkmod parsing"
    patch_type: "portability"
  - patch_file: "patches/0004-setup-scripts-portable.patch"
    patch_description: "setup-modules.sh cp --archive -> cp -r; setup-rootfs.sh install -d/-t/-D -> mkdir/cp (toybox lacks install(1)/cp --archive)"
    patch_type: "portability"
