  dependencies:
    - "go/1.26.5"
  cc: go
  cxx: ""

patches_applied: []

test_passed: 418
test_failed: 0
test_skipped: 0
test_blocked: 23
test_total: 441

knowledge_gained:
  - "Go TUI 项目使用 go build ./cmd/ktea 编译，无 configure/make 流程；版本经 -ldflags -X main.version=v0.8.0 注入（package main var version），无 --version flag，smoke 用 --help（Go flag 对 -help 打印 usage 且 exit 0）"
  - "上游无 vendor/ 目录，构建期需 -mod=mod + GOPROXY(goproxy.cn) 拉取模块闭包（约 638MB，含 docker/containerd/k8s 间接依赖，来自 testcontainers）"
  - "kadmin/sradmin 测试的 TestMain 用 testcontainers 起 Docker Kafka/Schema-Registry，OHOS 无 Docker 硬跑必挂：仅 go test -c 编译证明可编译，23 个 Test 如实计 blocked 不虚报通过率"
  - "27 个可运行包（UI 组件/页面均为内存 mock 的 model/Update/View 断言）编译-签名-回源码目录 -test.v 运行：418 用例全过 0 fail 0 skip"
  - "Go 1.26.5 SDK 自举后必须签名全部工具 ELF（bin/go、gofmt、pkg/tool/linux_arm64/* 含 link），未签名 link 报 fork/exec permission denied"
  - "HMDFS 上 go 链接输出放 go-workspace/link-out 单遍成型后拷贝（E124/E134/E166），测试 ELF 按 E318 编译-签名-回源码目录运行"

patch_generation:
  method: none
  patches_count: 0
