package: ktea/0.8.0
homepage: https://github.com/jonas-grgt/ktea

upstream_check_command: "go test -mod=mod -v ./... (29 pkgs; kadmin/sradmin TestMain need Docker testcontainers and are compile-only on OHOS)"
upstream_test_in_build: true
upstream_test_command: "go test -mod=mod -c <each pkg> + signed run -test.v -test.count=1 (27 runnable pkgs) + compile-only for kadmin/sradmin"

upstream_tests:
  - file: cmd/ktea/main_test.go
    source: ktea-0.8.0/cmd/ktea/
    description: "TUI model: no-cluster bootstrap and tab cycling (in-memory mocks, no TTY)"
    command: "go test -mod=mod -c ./cmd/ktea + signed run"
  - file: config/config_test.go
    source: ktea-0.8.0/config/
    description: "Config file loading / parsing tests"
    command: "go test -mod=mod -c ./config + signed run"
  - file: kcadmin/kc_lister_test.go
    source: ktea-0.8.0/kcadmin/
    description: "Kafka consumer group listing helpers"
    command: "go test -mod=mod -c ./kcadmin + signed run"
  - file: serdes/avro_test.go
    source: ktea-0.8.0/serdes/
    description: "Avro serialization/deserialization tests"
    command: "go test -mod=mod -c ./serdes + signed run"
  - file: ui/components/*/*_test.go
    source: ktea-0.8.0/ui/components/
    description: "UI component tests: border, chips, cmdbar, notifier, statusbar, tab"
    command: "go test -mod=mod -c ./ui/components/{border,chips,cmdbar,notifier,statusbar,tab} + signed run"
  - file: ui/pages/*/*_test.go
    source: ktea-0.8.0/ui/pages/
    description: "UI page tests: cgroups, configs, consume form/page, clusters, schemas, topics, kcon, publish, records, subjects, etc."
    command: "go test -mod=mod -c ./ui/pages/<page> + signed run (17 pages)"
  - file: ui/tabs/*/*_test.go
    source: ktea-0.8.0/ui/tabs/
    description: "UI tab tests: cgroups_tab, clusters_tab"
    command: "go test -mod=mod -c ./ui/tabs/{cgroups_tab,clusters_tab} + signed run"
  - file: kadmin/*_test.go
    source: ktea-0.8.0/kadmin/
    description: "kadmin: TestMain boots Docker testcontainers Kafka/Redpanda - compile-only on OHOS (no Docker)"
    command: "go test -mod=mod -c ./kadmin (compile-only)"
  - file: sradmin/*_test.go
    source: ktea-0.8.0/sradmin/
    description: "sradmin: TestMain boots Docker testcontainers compose Schema-Registry - compile-only on OHOS (no Docker)"
    command: "go test -mod=mod -c ./sradmin (compile-only)"

test_package_tests:
  - file: test.sh
    description: "Offline checks: binary exists, ELF magic, ktea --help prints plain-fonts/debug usage; OHOS-only: ELF signature section and static linking"
    command: "bash test.sh <bin/ktea> [--ohos]"

assertion_count: 5
