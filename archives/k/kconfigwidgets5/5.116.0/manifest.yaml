# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0
version: "5.116.0"
software: "kconfigwidgets5"
status: built
build_date: "2026-09-24"
build_system: cmake

source:
  url: "https://download.kde.org/stable/frameworks/5.116/kconfigwidgets-5.116.0.tar.xz"
  sha256: "e45697f01297a1f7a6058be267e08bdf0b4f7332e3b8d78f932a36e5bd57c5b8"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DQT_MAJOR_VERSION=5"
    - "-DWITH_KAUTH=OFF"
    - "-DBUILD_DESIGNERPLUGIN=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DBUILD_TESTING=ON"
  dependencies:
    - "qt5-qtbase/5.15.2.2"
    - "kconfig5/5.116.0"
    - "kcoreaddons5/5.116.0"
    - "kguiaddons5/5.116.0"
    - "ki18n5/5.116.0"
    - "kwidgetsaddons5/5.116.0"
    - "kcodecs5/5.116.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-CMakeLists.txt.patch"

knowledge_gained:
  - "OHOS lld 输出占位符 .codesign，沙箱加载器拒绝加载（dlopen Permission denied）——构建树与依赖包的 lib*.so 需 binary-sign-tool -selfSign 1 重签名后才能跑 ctest/test_package（knotifications5 先例，扩展到依赖包）"
  - "qt5-qtbase 5.15.2.2 的 QT_FEATURE_accessibility=-1：Q_PROPERTY accessibleName 被编译剔除，上游 setAccessibleName 调用需要 QT_NO_ACCESSIBILITY 守卫（kwidgetsaddons5 填链实证）"
  - "KStandardShortcutWatcher 配置变更通知依赖 inotify，OHOS 沙箱不触发——changingShortcut 类测试需豁免（kconfig5 kstandardshortcutwatchertest 同根因）"
