software: kamailio-lua
display: "Kamailio app_lua (Lua scripting module)"
description: "Kamailio SIP server app_lua module — embedded Lua scripting support (KEMI/script routes)"
category: network
homepage: "https://www.kamailio.org"
license: GPL-2.0-or-later
build_system: makefile

# OHOS 适配要点（跨版本通用）
ohos_adaptation:
  key_points:
    - "本包是 kamailio 的模块子包（发行版 kamailio-lua = 上游 src/modules/app_lua），产物 app_lua.so 由 kamailio 运行期 dlopen"
    - "OHOS 无系统 liblua、无 lua 的 pkg-config 文件：Lua 由 Conan 依赖 lua/<ver> 提供，经上游模块 Makefile 支持的 LOCALBASE 注入；PKG_CONFIG_LIBDIR 指向空目录避免宿主探测串入"
    - "kamailio 的 OS 判定基于 uname -s（OHOS 上为 HarmonyOS，无专属分支），core 必须显式 OS=linux（Linux ABI）构建"
    - "OHOS 额外口径：SCTP=0（sysroot 无 netinet/sctp.h）、DEFS_RM=-DHAVE_RESOLV_RES（OHOS libc 无 _res）"
    - "关键：kamailio 加载模块时校验 (arch/os) 目标标识与编译标志集合，模块必须与 core 完全同口径，否则 version/flags mismatch 拒绝加载"
    - "app_lua 模块源码不含平台条件编译，可零补丁构建（patches 为空）"
  common_dependencies:
    - "lua（唯一强制第三方依赖；OHOS 需 >=5.4 线，已证 5.4.8.1 可消费）"

# 版本索引
versions:
  "6.0.6":
    status: built
    build_date: "2026-10-02"
    notes: "首个 OHOS 适配版本；零源码补丁；上游 test/unit 49 例全量执行（OK=5/FAIL=10/SKIP=34）"
