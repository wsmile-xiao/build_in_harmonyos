software: kamailio-lua
version: "6.0.6"
status: built
build_date: "2026-10-02"
build_system: makefile
package_type: shared-library
license: GPL-2.0-or-later
homepage: "https://www.kamailio.org/"

# 发行版二进制子包名 -> 上游模块映射
upstream:
  project: kamailio
  repo: "https://github.com/kamailio/kamailio"
  module: "src/modules/app_lua"
  module_name: app_lua
  artifact: app_lua.so

source:
  url: "https://github.com/kamailio/kamailio/archive/refs/tags/6.0.6.tar.gz"
  filename: "kamailio-6.0.6.tar.gz"
  sha256: "5b8cd435aa52137857bbfc27804479b687a495df5634e7d8513b3ff45e98e1b6"
  tar_format: tar.gz
  tag_commit: "ca1f198369533a29443b8e6bc7662472523a1a02"
  note: "官网发布包 kamailio-6.0.6_src.tar.gz 不含 test/ 目录；采用官方仓库 tag 归档以保留上游测试入口。github.com 归档端点与 codeload 同路径归档字节一致，且可命中 CI 镜像回退（codeload 不在白名单）"

build:
  system: makefile
  target: "modules=modules/app_lua"
  dependencies:
    - lua/5.4.8.1
  cc: clang
  make_vars:
    - "LOCALBASE=<lua package_folder>"
    - "PKG_CONFIG_LIBDIR=<empty dir>"
    - "OS=linux"
    - "SCTP=0"
    - "DEFS_RM=-DHAVE_RESOLV_RES"
  note: "OS/SCTP/DEFS_RM 三项必须与 OHOS 上 core 的构建口径一致：kamailio 加载模块时校验 (arch/os) 与编译标志集合，不一致将拒绝加载"

artifacts:
  - lib/kamailio/app_lua.so
  - licenses/COPYING

patches_applied: []

validation:
  conan_create: true
  conan_verify: true
  test_package_assertions: 16
  harmony_specific_tests:
    - "H1 OHOS ABI 契约（ELF64/AArch64/ET_DYN）"
    - "H2 OHOS 依赖自洽（NEEDED 仅 libc.so，无 liblua.so）"
    - "H6 OHOS 动态加载器实测 dlopen"
    - "H7 模块目标标识 aarch64/linux 与 core 一致"
    - "H8 编译标志集合与 OHOS core 口径一致（无 USE_SCTP/HAVE_RESOLV_RES）"
  upstream_tests: "test/unit 49 个用例全量执行：OK=5 / FAIL=10 / SKIP=34（逐项见 reports/test-report.md）"
  upstream_e2e: "包产物 + OHOS 构建的 kamailio core：上游 61 用例场景（修正 3 处陈旧 API）三子用例全绿"

knowledge_gained:
  - "kamailio 自有 make 体系的 OS 判定基于 uname -s，OHOS（`HarmonyOS`）无专属分支，必须显式 OS=linux，否则 core 编译失败"
  - "kamailio 模块加载双重校验：目标标识 aarch64/<os> + 编译标志集合；模块必须与 core 完全同口径，否则 version/flags mismatch 拒绝加载"
  - "OHOS sysroot 无 netinet/sctp.h -> SCTP=0；OHOS libc 无 _res -> DEFS_RM=-DHAVE_RESOLV_RES"
  - "OHOS sysroot 的 linux/socket.h 与 libc sys/socket.h 对 sockaddr_storage 重定义（netlink 引入点需守卫）"
  - "OHOS PC 无 /bin/bash，上游 test/unit 中 36/49 个 #!/bin/bash 用例需按 shebang 显式选解释器"
  - "上游 test/unit/61（app_lua 唯一对应用例）停留在旧 API：register 参数、sr.* 命名空间、sdp_remove_line_by_prefix 旧名"

issues_encountered:
  - "sync: 无源码补丁（app_lua 模块无平台条件编译，按上游 make 体系直接构建）"
  - "env: 上游 test/unit 需要完整 kamailio 服务端与 MySQL/PostgreSQL/SIP 工具，仅作测试环境使用，不进入本包配方"
  - "upstream_test_stale: 61.sh/61.cfg 与本版实现脱节（3 处 API 变更），本包未修改上游测试文件"

build_success: true
