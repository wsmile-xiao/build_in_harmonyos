# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kamailio-lua/6.0.6
homepage: "https://www.kamailio.org/"

# 上游测试命令：kamailio 自带 test/unit/Makefile（目标 test / all / run）
#   make -C test/unit test   -> kamailio -c 语法检查
#   make -C test/unit all    -> 依次执行 test/unit/*.sh
upstream_check_command: "make -C test/unit all"

# 上游测试是否集成进 conanfile.py build()：
#   否 —— 上游 test/unit 需要完整 kamailio 主程序 + 大量可选模块（含
#   db_mysql/db_postgres 等需要外部客户端库的模块）与外部 SIP 工具（sipsak/sipp/nc），
#   不适合放进包构建流程；本次适配已单独实际执行并如实统计（见 reports/test-report.md）。
upstream_test_in_build: false
upstream_test_command: "make -C test/unit all"

# 上游实际运行的测试程序（共 49 个 .sh 用例，逐项结果见 reports/test-report.md）
upstream_tests:
  - file: test/unit/1.sh
    source: kamailio-6.0.6/test/unit/1.sh
    description: "最小配置加载（core 冒烟）"
    command: "make -C test/unit UNIT=1.sh run"
  - file: test/unit/60.sh
    source: kamailio-6.0.6/test/unit/60.sh
    description: "sdpops 模块 SDP 操作（SIP 端到端，sipsak）"
    command: "make -C test/unit UNIT=60.sh run"
  - file: test/unit/61.sh
    source: kamailio-6.0.6/test/unit/61.sh
    description: "app_lua 模块（Lua 调用 sdpops，SIP 端到端，sipsak）——本包直接对应用例"
    command: "make -C test/unit UNIT=61.sh run"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_app_lua_ohos.sh
    description: "L1 结构/ABI/符号检查（含 OHOS ABI、OHOS 依赖自洽等鸿蒙特有用例）"
    command: "/bin/sh test_app_lua_ohos.sh <package_folder>"
  - file: dlopen_probe.c
    description: "L1 鸿蒙特有用例：OHOS 动态加载器实测 dlopen 插件"
    command: "dlopen_probe <package_folder>/lib/kamailio/app_lua.so"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16
