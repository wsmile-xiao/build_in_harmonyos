partial_adaptation:
  scope: >-
    klevernotes hard-depends on QtWebEngine upstream (CMake REQUIRED
    WebEngineQuick, unconditional QtWebEngineQuick::initialize() in main.cpp,
    WebEngineView markdown preview in TextDisplay.qml, printToPdf +
    QtQuick.Pdf printing in PrintingPage.qml/PrintingDialog). No qtwebengine
    recipe exists on ohpcd and the port is deemed infeasible, so this port
    ships a WebEngine-free build selected by the new upstream option
    KLEVER_WITH_WEBENGINE (default OFF): markdown preview degrades to a pure
    QML rich-text renderer (TextDisplayNative.qml), the PDF print page and
    PrintingUtility (QPrinter) drop out of the build, and the print dialog
    hides its PDF entry at runtime. The ON path remains compilable when a
    qtwebengine recipe ever lands (option turns all gates back on).
  user_decision_pending: true

