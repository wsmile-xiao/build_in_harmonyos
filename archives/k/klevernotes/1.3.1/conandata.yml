# conandata.yml — klevernotes 1.3.1
# Official KDE release archive; URL and SHA256 fixed from the upstream
# release metadata (invent.kde.org/office/klevernotes tag v1.3.1,
# commit 1e6f4c1b). Sources key layout mirrors the kirigami-addons/alligator
# recipes: flat sources, patches keyed by version for
# apply_conandata_patches().

sources:
  url: "https://download.kde.org/stable/klevernotes/1.3.1/klevernotes-1.3.1.tar.xz"
  sha256: "df8c39f534febd8ea92465b71e03df3404bc849ccf44f3200b8a0f29e51fcad4"

patches:
  "1.3.1":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Gate the WebEngineQuick/PrintSupport find_package calls behind the new KLEVER_WITH_WEBENGINE option (default OFF): QtWebEngine is not published to ohpcd and qtbase/6.11.1 does not ship PrintSupport, so the WebEngine preview + PDF printing pipeline must be optional"
      patch_type: "portability"
    - patch_file: "patches/0002-src-CMakeLists.txt.patch"
      patch_description: "Select the preview/printing sources by KLEVER_WITH_WEBENGINE: OFF builds TextDisplayNative.qml instead of TextDisplay.qml and drops PrintingPage.qml (QtQuick.Pdf) plus printingHelper.cpp (QPrinter/PrintingUtility) from the module; move Qt::WebChannel/Qt::PrintSupport/Qt6::WebEngineQuick links behind the option"
      patch_type: "portability"
    - patch_file: "patches/0003-src-main.cpp.patch"
      patch_description: "Guard the unconditional QtWebEngineQuick::initialize() (and its include) with KLEVER_WITH_WEBENGINE so the OFF build starts without QtWebEngine"
      patch_type: "portability"
    - patch_file: "patches/0004-src-contents-ui-textEditor-EditorView.qml.patch"
      patch_description: "Type the display property as var (both preview variants satisfy the same interface) and export note HTML from the parser-rendered HTML when there is no WebEngineView to interrogate (OFF path)"
      patch_type: "portability"
    - patch_file: "patches/0005-src-contents-ui-Main.qml.patch"
      patch_description: "Detect at runtime whether the PrintingPage component exists in the QML module and refuse to build the Printing page on the degraded build"
      patch_type: "portability"
    - patch_file: "patches/0006-src-contents-ui-dialogs-PrintingDialog.qml.patch"
      patch_description: "Hide the 'Print to PDF' entry when the PDF pipeline is absent (printingAvailable); keep the Flatpak gating message when it is only Flatpak-disabled"
      patch_type: "portability"
    - patch_file: "patches/0007-src-contents-ui-textEditor-TextDisplayNative.qml.patch"
      patch_description: "New pure QML preview fallback: renders the parser HTML in a read-only rich-text TextArea, keeps the TextDisplay interface (view/renderedHtml/makePdf/visible) so EditorView works unchanged; CSS-based preview theming is a documented degradation"
      patch_type: "portability"
    - patch_file: "patches/0008-src-contents-ui-dialogs-KIconDialog.qml.patch"
      patch_description: "New wrapper isolating the org.kde.iconthemes import (KIconThemes.IconDialog): the published kiconthemes package ships no QML module, so consumers create this wrapper through a runtime availability check"
      patch_type: "portability"
    - patch_file: "patches/0009-src-contents-ui-dialogs-ItemPropertiesDialog.qml.patch"
      patch_description: "Detect the icon-dialog wrapper at runtime and degrade the icon picker to a plain icon-name text field when the org.kde.iconthemes QML module is absent"
      patch_type: "portability"
