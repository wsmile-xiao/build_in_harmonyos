type: test_package
name: klevernotes
version: "1.3.1"
checks:
  - ohos_gate_elf_needed (new OHOS-specific test: test_ohos_gate.py, pure-python
    ELF64 parser, asserts no WebEngine/WebChannel/PrintSupport/Qt6Pdf DT_NEEDED
    and QML+KIO closure linked on the packaged binary)
  - offscreen_launch_smoke (packaged app launched with offscreen QPA; timeout
    exit code 124 == QML engine loaded Main.qml and reached the event loop)
  - upstream_tests_run_in_build_phase (the 3 upstream QtTest suites
    klevernotes-extendedSyntax / klevernotes-noteLinking / klevernotes-emoji
    run via ctest inside the recipe build(), BUILD_TESTING=ON)
upstream_test_sources:
  - src/autotests/parser/extendedSyntaxTest.cpp
  - src/autotests/parser/noteLinkingTest.cpp
  - src/autotests/parser/emojiTest.cpp
