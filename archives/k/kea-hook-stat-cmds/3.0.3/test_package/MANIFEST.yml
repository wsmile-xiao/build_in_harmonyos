# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-stat-cmds/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的两个 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> dhcp-stat-cmds-lib-tests dhcp-stat-cmds-libload-tests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-stat-cmds-lib-tests dhcp-stat-cmds-libload-tests"

# 上游实际运行的测试程序（本次适配实测：10 + 3 = 13 个用例全部通过）
upstream_tests:
  - file: dhcp-stat-cmds-lib-tests
    source: src/hooks/dhcp/stat_cmds/tests/
    description: >-
      stat_cmds_unittest.cc 的 10 个 gtest 用例覆盖 lease-statistics hook：
      commands/multipleLoads、stat-lease4-get（正常/参数错误/子网缺失/孤立统计）、
      stat-lease6-get（正常/参数错误/子网缺失/孤立统计）
    command: "./dhcp-stat-cmds-lib-tests"
  - file: dhcp-stat-cmds-libload-tests
    source: src/hooks/dhcp/stat_cmds/libloadtests/
    description: "3 个 gtest 用例，校验 libdhcp_stat_cmds.so 可被 Kea hook 框架加载/卸载（validLoad4/validLoad6/invalidDaemonLoad）"
    command: "./dhcp-stat-cmds-libload-tests"

# test_package 中自带的测试（1 项消费者契约 + 1 项鸿蒙特有）
test_package_tests:
  - file: test_stat_cmds_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload/multi_threading_compatible 契约、stat_lease4_get/stat_lease6_get 命令 callout 与 hook ABI 版本"
    command: "./test_stat_cmds_hook <package>/lib/kea/hooks/libdhcp_stat_cmds.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有用例：校验包内 libdhcp_stat_cmds.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc libc.so.6、
      链接 libc++_shared.so）、OHOS 加载器可 dlopen(RTLD_NOW) 解析，
      且 stat-cmds callout（stat_lease4_get/stat_lease6_get）与 hook ABI 30003 可经其解析
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_stat_cmds.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（本次适配实测：1 个，1/1 通过）
ohos_specific_tests:
  count: 1
  entries:
    - test_ohos_platform
  command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_stat_cmds.so"
  result: "1/1 passed"

# 测试用例总数（本次实测执行的上游用例数：10 + 3）
assertion_count: 13
