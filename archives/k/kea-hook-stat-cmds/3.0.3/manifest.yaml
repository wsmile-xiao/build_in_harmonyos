  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1   # test_requires
    - meson/1.11.0     # tool_requires
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-meson.build.patch"
  - "0002-src-lib-dhcp-iface_mgr_linux.cc.patch"

# ============================================================
# 鸿蒙特有测试（test_package，1 个用例）
# ============================================================

ohos_specific_tests:
  count: 1
  entries:
    - "test_package/test_ohos_platform.c → test_ohos_platform"
  command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_stat_cmds.so"
  checks:
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so）"
    - "OHOS 加载器 dlopen(RTLD_NOW|RTLD_LOCAL) 可解析插件及其 20 个 Kea 运行库"
    - "stat-cmds callout（stat_lease4_get/stat_lease6_get）与 hook ABI 30003 可经 OHOS 加载器解析"
  cases_run: 1
  cases_passed: 1
  cases_failed: 0

knowledge_gained:
  - "Meson 在 OHOS 报 system=harmonyos，Kea 平台白名单不含 → 顶层归一化为 linux（命中 E090）"
  - "OHOS sysroot linux/socket.h 定义 sockaddr_storage 与 musl sys/socket.h 冲突 → define-guard 重命名（命中 E091/E119，本次用 __linux__ && !__GLIBC__ 守卫而非平台宏）"
  - "musl pthread.h 无 pthread_setcancelstate → boost BOOST_SP_NO_PTHREAD_SETCANCELSTATE（命中 E085/E127/E507）"
  - "meson clang 默认归档器裸名 llvm-ar 探测失败 → MesonToolchain tc.binaries 注入绝对路径（命中 E481）"
  - "meson 配置期 compile-and-run 探针（log4cplus）需 LD_LIBRARY_PATH 含 host 共享依赖 libdirs（未命中正式条目，新增草稿 knowledge/drafts/E429-draft-C4CE）"

