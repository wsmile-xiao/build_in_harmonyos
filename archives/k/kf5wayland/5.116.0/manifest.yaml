# 携带第二源码 (registry 无此包; libkscreen 6.7.2 先例)
extra_sources:
  - name: plasma-wayland-protocols
    version: "1.9.0"
    url: "https://download.kde.org/stable/plasma-wayland-protocols/plasma-wayland-protocols-1.9.0.tar.xz"
    note: "OHPC registry 无 plasma-wayland-protocols 包; 经 PLASMA_WAYLAND_PROTOCOLS_DIR + 合成 config 暴露"

# R51 上游测试: ctest 目标 47 (client 42 + server 5) + tests/ 15 个交互程序
# (不注册 ctest, 需真实合成器)。本机实注册 46/47 进程内可跑 (testWaylandFullscreenShell
# weston 门控未注册); 运行时适配 (LD_PRELOAD shim + 短 XDG_RUNTIME_DIR +
# build tree .so 目录 LD_LIBRARY_PATH) 后 -E 排除 17 项 → 实跑 29, 29/29 全过
# (conan create 实测 2026-09-29)。排除项分类经 2026-10-01 双窗口隔离复跑细化:
# 9 确定性失败 + 2 负载翻转 + 6 批量负载敏感 (见 notes.md "A1 双窗口隔离复跑" 节
# 与 pr-body "统一排除矩阵"; 旧 "connectionDied 簇 11" 口径已被取代)
testing:
  upstream_in_build: "ctest --output-on-failure --repeat until-pass:3 --timeout 60 --no-tests=error -E 'testWaylandFullscreenShell|testWaylandRegistry|testWaylandSurface|testWaylandSeat|testSubSurface|testPlasmaShell|testPlasmaWindowModel|testError|testXdgShellV6|testPointerConstraints|testQtSurfaceExtension|testWaylandShell|testSubCompositor|testRegion|testCompositor|testDataSource|testDataDevice|testShmPool'（-E 列表 18 项 = 1 项 weston 未注册 no-op + 17 项有效排除: 9 确定性失败 + 2 负载翻转 + 6 批量负载敏感, 逐项理由见 notes.md R51 与 A1 双窗口复跑; until-pass:3 = 共享机负载 flaky 重试吸收, 确定性失败已排除）"
  test_package: "consumer 构造 KF5WaylandClient 协议对象 + KF5WaylandServer Display/createCompositor + .codesign section 断言 (R34 实质依赖, 5 断言)"

# R38: 库包 (client+server .so); 包内 libexec 测试 server 为测试支持产物,
# 非用户 CLI, 不声明 bindirs/commands.json。
package_type: library

