# kf5wayland 5.116.0 sources.
# First URL = official KDE release; the bfsu mirror is the fallback that
# was actually used for the local source checkout (same file, verified by
# the sha256 below).
sources:
  url:
    - "https://download.kde.org/stable/frameworks/5.116/kwayland-5.116.0.tar.xz"
    - "https://mirrors.bfsu.edu.cn/kde/Attic/frameworks/5.116/kwayland-5.116.0.tar.xz"
  sha256: "88b5970c2d6f6d5f46e6ffac66233bf23f2fcf016dea39fffbd9f47b1fc0aed8"

# Second source: plasma-wayland-protocols 1.9.0 (the minimum accepted by
# upstream find_package(PlasmaWaylandProtocols 1.9.0 CONFIG)). Not published
# to the ohpcd registry, so it is carried alongside and exposed through
# PLASMA_WAYLAND_PROTOCOLS_DIR (libkscreen 6.7.2 precedent).
plasma_wayland_protocols:
  url: "https://download.kde.org/stable/plasma-wayland-protocols/plasma-wayland-protocols-1.9.0.tar.xz"
  sha256: "a4275b9a854716fa5ed9c2ba2d697df2b0749fc45a28ad965e68d0aa36c5d4c8"

# The Qt6 path patch: upstream only loads ECM's QtWaylandScanner
# find-module (source of ecm_add_qtwayland_server_protocol) inside the
# Qt5 CMake branch, so the Qt6 configure dies on an undefined function
# at src/server/CMakeLists.txt. The OHOS platform adaptations (scanner
# signing, .pc relocation, config synthesis, ctest exclusion) stay in
# conanfile.py. The second patch ports the KF5WaylandServer link line,
# which hardcodes Qt5::Gui / Qt5::Concurrent, to the version-parameterized
# target names used by the rest of the tree.
patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Qt6: load ECM's QtWaylandScanner find-module in the else branch"
    patch_type: "portability"
  - patch_file: "patches/0002-src-server-CMakeLists.txt.patch"
    patch_description: "Qt6: KF5WaylandServer uses version-parameterized Qt target names and the generic KDE_INSTALL_INCLUDEDIR_KF (the version-pinned KDE_INSTALL_INCLUDEDIR_KF5 is empty under a Qt6 build, collapsing the header install DESTINATION to the absolute path /KWayland/Server and failing cmake --install; top-level and src/client already use the generic variable)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-server-shell_interface.cpp.patch"
    patch_description: "Qualify wl_shell_surface_resize with the enum tag: the wayland client protocol header declares a same-named request function that hides the enum type name in C++"
    patch_type: "portability"
  - patch_file: "patches/0004-tests-renderingservertest.cpp.patch"
    patch_description: "Qt6: tests/renderingservertest.cpp includes <QFile> directly (Qt6 header reorganization dropped the transitive include; one line, test file only, no logic change)"
    patch_type: "portability"
