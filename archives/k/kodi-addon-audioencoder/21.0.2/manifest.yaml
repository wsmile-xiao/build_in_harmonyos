name: kodi-addon-audioencoder
version: "21.0.2"
status: built
build_date: "2026-10-06"
source:
  url: https://github.com/xbmc/audioencoder.wav/archive/refs/tags/21.0.2-Omega.tar.gz
  sha256: 2bbc3e15706e02bbd3e6be3c232522e2091509a6fdf88d8af5db4cd6bf7b3476
  tar_format: tar.gz
build:
  system: cmake
  configure_options: []
  dependencies:
    - "kodi add-on SDK headers from xbmc 21.3-Omega tarball (kodi-dev-kit include subtree, sha256 a60afcb556e4a00cb19fc35b7e77758107c9a8096c6ce9b66af5f92396be31aa); no external codec libraries — upstream DEPLIBS is empty"
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - Upstream build needs find_package(Kodi)+build_addon() (kodi-addon-dev);
    recipe supplies its own CMake entry under recipe-cmake/ consumed via
    build_script_folder, building the unmodified upstream sources — a single
    translation unit (src/EncoderWav.cpp) with zero external codec libraries
    (PCM written through host VFS callbacks)
  - Kodi add-on SDK headers are extracted selectively (kodi-dev-kit include
    only) from the xbmc 21.3-Omega tarball via conandata sources.sdk
  - Audio encoder add-on has no GL/EGL render path and no shared-library
    DT_NEEDED of its own — module target keeps the exact upstream output
    name audioencoder.wav.so (PREFIX ""); test_package dlopen needs no
    LD_LIBRARY_PATH preloading (unlike kodi-addon-imagedecoder)
  - DRAFT-KODI01 trap confirmed at the header level — kodi/versions.h guards
    the ADDON_INSTANCE_AUDIOENCODER (103) switch case with
    "#if !defined(BUILD_KODI_ADDON) || defined(ADDON_INSTANCE_VERSION_AUDIOENCODER_USED)",
    so BUILD_KODI_ADDON must stay undefined; test_package asserts
    ADDON_GetTypeVersion(103)=="3.0.0" at runtime
software: kodi-addon-audioencoder
build_system: cmake
