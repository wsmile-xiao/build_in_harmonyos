# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: kodi-addon-audioencoder/21.0.2
homepage: "https://github.com/xbmc/audioencoder.wav"

# Upstream audioencoder.wav 21.0.2-Omega ships no test suite:
# no tests/ directory, no enable_testing()/add_test() in CMakeLists.txt; the
# upstream CI configurations (.github/workflows/build.yml, .travis.yml,
# appveyor.yml, azure-pipelines.yml, Jenkinsfile) only build the add-on
# (Debian package build test).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream has no test programs
upstream_tests: []

# test_package consumer-side tests
test_package_tests:
  - file: test_audioencoder_wav.cpp
    description: "dlopen()s the packaged audioencoder.wav.so, verifies the Kodi 21 binary add-on entry points (ADDON_Create, ADDON_GetTypeVersion, ADDON_GetTypeMinVersion) resolve, and runs ADDON_GetTypeVersion()/ADDON_GetTypeMinVersion() for the audio encoder instance (type 103) expecting 3.0.0 / 3.0.0"
    command: "./test_audioencoder_wav <libdir>/audioencoder.wav.so"
    assertion_count: 5

assertion_count: 5

notes: |
  上游 audioencoder.wav 21.0.2-Omega 无任何测试注册（无 tests/ 目录，
  CMakeLists 无 enable_testing/add_test，上游 CI 仅构建；门禁判定留待后续
  阶段）。test_package 为消费者侧真实检查：dlopen 打包产物、dlsym 三个入口
  符号、并实际调用 ADDON_GetTypeVersion/MinVersion 校验 audio encoder 实例
  API 版本 3.0.0/3.0.0（xbmc 21.3-Omega SDK kodi/versions.h 口径，
  ADDON_INSTANCE_AUDIOENCODER=103）。
