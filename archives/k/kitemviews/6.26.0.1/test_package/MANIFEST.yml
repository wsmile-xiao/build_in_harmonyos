# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kitemviews/6.26.0.1.

package: kitemviews/6.26.0.1
homepage: https://invent.kde.org/frameworks/kitemviews

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

# Counting convention (same as the PR-review side): upstream test targets = 4
# -> autotests/ 1 (CTest-registered) + tests/ 3 (interactive GUI demos that
# upstream never registers, because ECM's ecm_mark_as_test does not call add_test).
upstream_test_target_count: 4
upstream_ctest_registered_count: 1
upstream_tests:
  - file: autotests/
    source: kitemviews-6.26.0/autotests/
    description: "KItemViews upstream autotests suite (1 CTest case: kitemviews-klistwidgetsearchlinetest)"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON"
  - file: tests/kcategorizedviewtest.cpp
    source: kitemviews-6.26.0/tests/
    description: "Interactive GUI demo (main() -> show()/exec()); no programmatic assertions, not registered by upstream"
    command: "QT_QPA_PLATFORM=offscreen timeout 6 <build>/bin/kcategorizedviewtest"
    condition: "compiled; launched under offscreen QPA (rc=124 = event loop alive)"
  - file: tests/ktreewidgetsearchlinetest.cpp
    source: kitemviews-6.26.0/tests/
    description: "Interactive GUI demo (QDialog based); no programmatic assertions, not registered by upstream"
    command: "QT_QPA_PLATFORM=offscreen timeout 6 <build>/bin/ktreewidgetsearchlinetest"
    condition: "compiled; launched under offscreen QPA (rc=124 = event loop alive)"
  - file: tests/kwidgetitemdelegatetest.cpp
    source: kitemviews-6.26.0/tests/
    description: "Interactive GUI demo; no programmatic assertions, not registered by upstream"
    command: "QT_QPA_PLATFORM=offscreen timeout 6 <build>/bin/kwidgetitemdelegatetest"
    condition: "compiled; launched under offscreen QPA (rc=124 = event loop alive)"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke creates KTreeWidgetSearchLine and verifies treeWidget wiring."
    command: "conan create (test_package builds and runs test_kitemviews)"

assertion_count: 1
