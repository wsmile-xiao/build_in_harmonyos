software: kitemviews
display: "KItemViews"
description: "KDE Frameworks 6 ItemViews widget add-ons (KCategoryDrawer/KCategorizedView/KTreeWidgetSearchLine/KWidgetItemDelegate)"
category: library
homepage: "https://invent.kde.org/frameworks/kitemviews"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "BUILD_DESIGNERPLUGIN=OFF: Qt6UiPlugin/Qt Designer plugin not published to ohpcd"
    - "ecm_install_po_files_as_qm(poqm) patched out: Qt6LinguistTools not published to ohpcd"
    - "ECM 6.26+ KDEInstallDirs6 runs qtpaths at configure time; sandbox LD_LIBRARY_PATH must have /system/lib64 prepended so the compatible libc++_shared.so is found"
    - "Upstream klistwidgetsearchlinetest runs headless under QT_QPA_PLATFORM=offscreen"
  common_dependencies:
    - qtbase
    - ecm

versions:
  "6.26.0":
    status: built
    build_date: "2026-09-05"
    conan_ref: "kitemviews/6.26.0"
  "6.18.0":
    status: built
    build_date: "2026-08-19"
    conan_ref: "kitemviews/6.18.0"
  "6.14.0":
    status: built
    build_date: "2026-08-10"
    conan_ref: "kitemviews/6.14.0"
