software: kylin-burner
display: "麒麟刻录 (Kylin Burner)"
description: "光盘刻录与拷贝工具（GNOME Brasero 分叉，openKylin 麒麟桌面维护；GTK3 GUI 主程序 burner，含 --cli 命令行烧录模式）"
category: multimedia
homepage: "https://gitee.com/openkylin/kylin-burner"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GTK3 应用在 OHOS 无 gdk-x11-3.0（conan gtk3 仅 broadway 后端）：generate() 写 gdk-x11-3.0.pc 重定向（Requires: gtk+-3.0）+ ohos-stubs/gdk/gdkx.h 桩头，不定义 GDK_WINDOWING_X11 使 X11 代码编译期排除"
    - "libcanberra conan 包以 --disable-gtk3 构建（无 libcanberra-gtk3.pc）：写 libcanberra-gtk3.pc 重定向（Requires: canberra gtk+-3.0）+ canberra-gtk.h 桩（ca_gtk_play_for_widget 返回 0，音效静默跳过）"
    - "intltool（XML::Parser）OHOS 不可用：IT_PROG_INTLTOOL 由 m4/ohos-stubs.m4 shim 提供 INTLTOOL_* 替换，指向 intltool-merge-shim（perl -pe 剥 _ 翻译标记），.desktop/.xml 数据文件仍可生成；构建时 INTLTOOLIZE=/bin/true 使 autoreconf 通过"
    - "上游 orig tarball 无 configure：autoreconf -fi 引导（configure.ac 加 AC_CONFIG_MACRO_DIRS([m4])；m4/ 含 pkg.m4 + ohos-stubs.m4，GNOME/yelp/gtk-doc 宏 shim；NLS/po、docs、help 从构建移除）"
    - "GTK3 GUI 二进制在无显示 OHOS 环境无法运行且 conan GTK3 运行时无法加载：bin/burner 改为 launcher 包装脚本应答 --version/--help，真实 ELF 为 bin/burner-bin（不可执行），CLI 查询路径任何环境可用"
    - "conan gstreamer/gst-plugins-base 以包名输出 pc（gstreamer.pc/gst-plugins-base.pc）：generate() 写 gstreamer-1.0/gstreamer-base-1.0/gstreamer-pbutils-1.0/gstreamer-tag-1.0/gstreamer-video-1.0 五个重定向满足 configure 模块查询"
    - "依赖图 zlib 冲突（gtk→glib→zlib/1.3.1.1 vs gstreamer→glib2→zlib/1.3.1）：zlib/1.3.1.1 force=True 对齐（与 sound-juicer 同解）；configure 硬查 sm/ice（BURNER_SM）需补 libsm/libice；外部刻录后端（cdrtools/cdrdao/cdrkit/growisofs/libburnia）无对应包，显式 --disable-* 关闭"
  common_dependencies:
    - glib
    - gtk
    - gstreamer
    - gst-plugins-base
    - libcanberra
    - libnotify
    - libxml2
    - libsm
    - libice
    - zlib

versions:
  "3.0.11":
    status: built
    build_date: "2026-09-22"
