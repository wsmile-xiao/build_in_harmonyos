  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.am.patch"
  - "0002-configure.ac.patch"
  - "0003-intltool-merge-shim.patch"
  - "0004-libburner-burn-Makefile.am.patch"
  - "0005-libburner-utils-Makefile.am.patch"
  - "0006-m4-ohos-stubs.m4.patch"
  - "0007-m4-pkg.m4.patch"
  - "0008-ohos-stubs-canberra-gtk.h.patch"
  - "0009-ohos-stubs-gdk-gdkx.h.patch"
  - "0010-src-Makefile.am.patch"

knowledge_gained:
  - "GTK3 应用在 OHOS 无 gdk-x11-3.0（gtk3 仅 broadway 后端）；configure 的 PKG_CHECK_MODULES(gdk-x11-3.0) 需用 gdk-x11-3.0.pc 重定向（Requires: gtk+-3.0）+ 内联 gdk_x11_* 桩头，GDK_WINDOWING_X11 不定义即可编译期排除 X11 路径 (ref: notes.md#发现与知识)"
  - "libcanberra conan 包以 --disable-gtk3 构建，libcanberra-gtk3.pc 缺失；需 libcanberra-gtk3.pc 重定向（Requires: canberra gtk+-3.0）+ ca_gtk_play_for_widget 桩（返回 0 静默跳过音效） (ref: notes.md#发现与知识)"
  - "intltool（XML::Parser）OHOS 不可用：IT_PROG_INTLTOOL 用 m4 shim 提供 INTLTOOL_* 替换，指向 intltool-merge-shim（perl -pe 剥 _ 翻译标记），数据文件仍能生成 .desktop/.xml (ref: notes.md#发现与知识)"
  - "orig tarball 无 configure：autoreconf -fi 引导（AC_CONFIG_MACRO_DIRS([m4]) + m4/pkg.m4 拷贝自系统 pkg-config 的 aclocal 目录） (ref: notes.md#发现与知识)"
  - "upstream configure.ac AC_DISABLE_STATIC：只产共享库（无 .a），与 R26 系统同名库静态策略不冲突（libburner-* 非系统库名） (ref: notes.md#发现与知识)"
  - "GTK3 GUI 二进制在无显示 OHOS 环境无法运行且 conan GTK3 运行时无法加载：bin/burner 改为 launcher 包装脚本应答 --version/--help，真实 ELF 为 bin/burner-bin（不可执行） (ref: notes.md#发现与知识)"

# 上游测试清点（R51）: make check 通过但无实际测试程序——
# 全树 Makefile.am 无 TESTS/check_PROGRAMS 定义（noinst_PROGRAMS 为空，
# 唯一 libburner-media/scsi-test-unit-ready.c 是辅助源码非测试）。
# 见 notes.md「验证结果」与 test_package/MANIFEST.yml。

