  dependencies:
    - glib/2.84.0.1
    - gtk/3.24.43
    - gstreamer/1.28.3
    - gst-plugins-base/1.28.3
    - libcanberra/0.30
    - libnotify/0.8.3
    - libxml2/2.15.3
    - libsm/1.2.6
    - libice/1.1.2
