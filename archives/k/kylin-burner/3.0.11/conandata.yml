# conandata.yml — kylin-burner 3.0.11
# Source: openKylin release tarball (debian/3.0.11-2 upstream source)

sources:
  url: "https://gitee.com/openkylin/kylin-burner/releases/download/debian%2F3.0.11-2/kylin-burner_3.0.11.orig.tar.gz"
  sha256: "68c7d8d4e36a096e0f4e0b255d22e996eb3084610ee15964b120f6c5a2045fa2"

patches:
  - patch_file: "patches/0001-Makefile.am.patch"
    patch_description: "Root Makefile.am: drop po/ (NLS/intltool), docs/ (gtk-doc), help/ (yelp-tools) from SUBDIRS; add -I m4 to ACLOCAL_AMFLAGS."
    patch_type: "portability"
  - patch_file: "patches/0002-configure.ac.patch"
    patch_description: "configure.ac: add AC_CONFIG_MACRO_DIRS([m4]); neutralise YELP_HELP_INIT/GTK_DOC_CHECK/AM_GLIB_GNU_GETTEXT/IT_PROG_INTLTOOL (m4 shim); drop docs/help/po from AC_CONFIG_FILES."
    patch_type: "portability"
  - patch_file: "patches/0003-intltool-merge-shim.patch"
    patch_description: "New executable intltool-merge-shim: strips _ translation markers from .desktop.in/.xml.in without intltool (XML::Parser unavailable on OHOS)."
    patch_type: "portability"
  - patch_file: "patches/0004-libburner-burn-Makefile.am.patch"
    patch_description: "libburner-burn/Makefile.am: add -I$(top_srcdir)/ohos-stubs to AM_CPPFLAGS."
    patch_type: "portability"
  - patch_file: "patches/0005-libburner-utils-Makefile.am.patch"
    patch_description: "libburner-utils/Makefile.am: add -I$(top_srcdir)/ohos-stubs to AM_CPPFLAGS."
    patch_type: "portability"
  - patch_file: "patches/0006-m4-ohos-stubs.m4.patch"
    patch_description: "New m4/ohos-stubs.m4: no-op macros for gnome-common (GNOME_COMPILE_WARNINGS/GNOME_CXX_WARNINGS/GNOME_MAINTAINER_MODE_DEFINES), yelp-tools (YELP_HELP_INIT), gtk-doc (GTK_DOC_CHECK) and intltool (IT_PROG_INTLTOOL shim providing INTLTOOL_* substitutions)."
    patch_type: "portability"
  - patch_file: "patches/0007-m4-pkg.m4.patch"
    patch_description: "New m4/pkg.m4: pkg-config's pkg.m4 copied into the project m4 dir so PKG_CHECK_MODULES expands under autoreconf."
    patch_type: "portability"
  - patch_file: "patches/0008-ohos-stubs-canberra-gtk.h.patch"
    patch_description: "New ohos-stubs/canberra-gtk.h: stub for libcanberra-gtk3 (ca_gtk_play_for_widget returns 0) since the conan libcanberra is built without the gtk3 backend."
    patch_type: "portability"
  - patch_file: "patches/0009-ohos-stubs-gdk-gdkx.h.patch"
    patch_description: "New ohos-stubs/gdk/gdkx.h: stub for gdk-x11 on OHOS (gtk3 broadway-only): XID/gdk_x11_window_* inline stubs; GDK_WINDOWING_X11 not defined so X11 code paths compile out."
    patch_type: "portability"
  - patch_file: "patches/0010-src-Makefile.am.patch"
    patch_description: "src/Makefile.am: add -I$(top_srcdir)/ohos-stubs to AM_CPPFLAGS."
    patch_type: "portability"
