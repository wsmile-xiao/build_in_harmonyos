# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kylin-burner/3.0.11
homepage: "https://gitee.com/openkylin/kylin-burner"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游清点（R51）: 全树 Makefile.am 无 TESTS/check_PROGRAMS 定义
#   （noinst_PROGRAMS 为空; libburner-media/scsi-test-unit-ready.c 是辅助
#   源码而非测试程序）。make check 各子目录均为 "Nothing to be done for
#   'check'" —— 无实际上游测试程序，仅有构建期校验。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# kylin-burner 是 GTK3 GUI 应用，headless OHOS 无显示会话且 conan GTK3
# 运行时不可加载 → 完整 GUI 不可运行（R40/E252 边界）。可验证的消费者
# 契约：①编译 consumer API 源码（burner-units.h 头文件可用性，R34）；
# ②执行打包的 bin/burner launcher --version 断言 3.0.11；③校验真实 ELF
# (bin/burner-bin) 与三个共享库存在。
test_package_tests:
  - file: test.c
    description: "编译消费方 API 源码（burner-units.h 宏 + glib 头），验证公共头文件自洽"
    command: "clang -c test.c -I<burner3> -I<glib>"
  - file: test.sh
    description: "执行 bin/burner --version 断言 3.0.11；校验 bin/burner-bin ELF magic 与 lib/libburner-{media3,burn3,utils3}.so 存在"
    command: "bash test.sh <package_folder>/bin/burner"

# 测试断言总数 (近似值, 用于质量评估)
# test.sh: launcher 存在/可执行(2) + --version 含 3.0.11(1) + ELF magic(1)
#          + 3 个库存在(3) = 7；test.c 头文件编译 = 1
assertion_count: 8
