package: kew/4.2.5
homepage: https://codeberg.org/ravachol/kew

upstream_check_command: ""
upstream_test_in_build: false
upstream_tests: []

upstream_test_census:
  method: >
    Three counters inside the v4.2.5 release tarball plus the target list of
    the upstream Makefile: (1) test -d t / test -d tests / test -d test;
    (2) grep -nE 'TESTS|add_test|^check:|^test:' Makefile and
    grep -nE '^[a-zA-Z_.-]+:' Makefile; (3) find . -iname '*test*'.
  denominator_rule: >
    The denominator counts registrable/executable upstream test cases ONLY:
    tests-directory count + Makefile check/test target count + ctest or
    add_test registration count. A file that merely matches a name lookup is
    not a test case and does not enter the denominator.
  denominator: 0
  usable: 0
  tests_directories: 0
  test_named_files: 0
  registered_tests: 0
  make_check_target: false
  make_test_target: false
  find_matches_non_test: 2
  detail: >
    The name lookup matched 2 entries and both are documentation pages
    (pages/testimonials.html,
    website/site_src/testimonials.md), not test drivers. The upstream Makefile
    only exposes all, kew, install, uninstall, clean and i18n: there is no
    "test" and no "check" target and no target invokes a test driver, so the
    upstream test count is 0 and no upstream suite is run during the build.

test_package_tests:
  - file: test_kew.py
    description: >
      Consumer test of the packaged kew executable: packaged layout and the
      executable bit; ELF identity and hardening posture read straight out of
      the ELF headers (ELF64, AArch64, ET_DYN/PIE, PT_GNU_RELRO, non-executable
      PT_GNU_STACK); DT_NEEDED wiring for every shared object the dependency
      graph ships as shared objects (twelve dependency sonames from eight
      packages plus the libc++ runtime, i.e. the 13 prefixes expanded by one
      loop, plus one separately asserted musl libc); proof that TagLib and
      zlib are statically absorbed instead of left dangling; proof that every
      non-system DT_NEEDED soname is a real file inside the Conan run
      environment; the installed data tree (themes, layouts, zh_CN and ja
      catalogues, man page, desktop entry); and the two runtime CLI paths that
      need neither a sound card nor a terminal (kew --version, kew --help).
    command: "python3 test_kew.py <package>/bin/kew <package> <LD_LIBRARY_PATH>"

assertion_count: 36
# Assertion arithmetic: 25 rec.check call sites, minus 1 for the mutually exclusive ELF-magic if/else pair, plus 12 for the 13-iteration DT_NEEDED prefix loop => 36 executed assertions (same figure as notes.md, manifest.yaml and the SUMMARY line).
