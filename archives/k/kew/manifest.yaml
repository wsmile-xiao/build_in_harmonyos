software: kew
display: "Kew"
description: "Terminal music player (TUI) with cover-art character graphics, a spectrum visualiser and lyrics"
category: multimedia
homepage: "https://codeberg.org/ravachol/kew"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "裸 Makefile 的 Conan 配方三陷阱按 E392 处方落地：get() 显式 filename、tools.build:compiler_executables 按字典读、make 固定 cwd=self.source_folder"
    - "make 统一 -j1（E525）；build 与 package/install 两次传同一套变量，避免重编与 PREFIX 宏漂移"
    - "CC/CXX 必须走 make 命令行：上游 Makefile 在 origin CC 为 default 时强制 CC := gcc，而 OHOS worker 没有 gcc"
    - "UNAME_S=Linux 显式覆盖：本机 uname -s 返回 HarmonyOS，否则 PIE/RELRO/BIND_NOW 加固块被静默剔除"
    - "PkgConfigDeps 只写 .pc、不扩 PKG_CONFIG_PATH（E468）⇒ make 命令内显式把 generators 目录放进该变量"
    - "PREFIX 注入 package_folder 且 USE_FAAD=0，规避上游 Makefile 里 /usr/local/lib 与 /opt/homebrew 的硬编码前缀探测（E524 家族）"
    - "glib 的 gettext 宏落到 g_libintl_* 符号，由 proxy-libintl 提供（E142/E508 家族）"
    - "已发布依赖把 opusfile.h 装进 <pkg>/include/opus 而未导出该层，按其自带 .pc 的口径补 -I，不改该依赖的配方"
    - "STRIP=0：本机 MAC 拒绝对 strip 后的二进制 exec（同 archives/a/abduco/0.6 的处置）"
    - "消费者测试的运行环境交接：run env 的 LD_LIBRARY_PATH 会抢在 DT_RUNPATH 之前，故先取出再 unset，经 argv 只对被测二进制生效"
    - "音频/显示能力面按真实失败形态断言：本机无 libasound*、/dev/snd Permission denied ⇒ 播放主流程结构性不可行，只申报 CLI 自检与装机树，不声称能出声"
    - "上游无成体系测试：分母 0、可用 0（find 命中的 2 枚是文档页，不计入分母）"
  common_dependencies:
    - glib
    - chafa
    - fftw3f
    - opus
    - opusfile
    - libvorbis
    - libogg
    - taglib
    - proxy-libintl
    - zlib

versions:
  "4.2.5":
    status: built
    build_date: "2026-09-27"
    conan_ref: "kew/4.2.5"
    note: "消费者测试 36 条断言全绿（见 4.2.5/notes.md 第 5 节与 4.2.5/manifest.yaml 的 test_results）；上游无成体系测试（分母 0、可用 0）"
