software: karchive
display: "KArchive"
description: "KDE Frameworks 6 file compression and archive library (KTar/KZip/KAr/K7Zip/KRcc/KCompressionDevice)"
category: library
homepage: "https://invent.kde.org/frameworks/karchive"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "KF_SKIP_PO_PROCESSING=ON: Qt6LinguistTools not published to ohpcd, ecm_install_po_files_as_qm(poqm) must not run"
    - "WITH_BZIP2=OFF (static bzip2 without PIC guarantee for a shared KF library), WITH_LIBZSTD=OFF (PkgConfig probe outside the baseline dep set), WITH_LIBLZMA=ON + WITH_OPENSSL=ON via published xz/openssl"
    - "ECM 6.26+ KDEInstallDirs6 runs qtpaths at configure time; sandbox LD_LIBRARY_PATH must have /system/lib64 prepended so the compatible libc++_shared.so is found"
    - "6.26.0: upstream uses std::ranges::any_of/std::bit_cast (C++20) in src/k7zip.cpp; ohos-aarch64 profile pins cppstd=17 and CMakeToolchain re-forces CMAKE_CXX_STANDARD 17 at every project(), so a value-identical C++17 rewrite patch is required"
    - "6.26.0: karchivetest has cross-function file dependencies and cleanupTestCase() deletes shared files per process; per-row exclusions must run in a single process"
    - "6.26.0: ossfuzz_testcase_6213340184772608.7z crashes K7Zip::open() with SIGSEGV on the OHOS runner (passes upstream Linux CI); excluded at run time with disclosure"
  common_dependencies:
    - qtbase
    - zlib
    - ecm

