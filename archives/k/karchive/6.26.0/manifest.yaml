knowledge_gained:
  - "karchive 6.26.0 raises cmake_minimum_required to 3.29, ECM to 6.26.0 and Qt to 6.9.0; the published qtbase/6.11.1 and ecm/6.26.0 satisfy them, so no version-lowering patch is needed."
  - "Upstream 6.26.0 already carries the static_cast<int>(mode) fix (the 6.18.0 OpenMode-cast patch is obsolete and dropped)."
  - "src/k7zip.cpp now uses std::ranges::any_of and std::bit_cast (C++20). The ohos-aarch64 conan profile pins compiler.cppstd=17 and CMakeToolchain re-applies CMAKE_CXX_STANDARD 17 at every project() call (verified with a cmake experiment: a toolchain-file set() overrides a CMakeLists set() placed before project()), so per-project C++20 cannot be enabled without patching; a value-identical C++17 rewrite patch is used instead."
  - "The new upstream ecm_generate_pkgconfig_file(KF6Archive) call is satisfied by ecm/6.26.0 which ships modules/ECMGeneratePkgConfigFile.cmake (and the ECMQmLoader.cpp.in / ECMVersionHeader.h.in templates that older ECM packaging lacked)."
  - "karchivetest has cross-function file dependencies (testReadZip reads the archive written by testCreateZip) and cleanupTestCase() deletes karchivetest.zip at the end of each process, so per-function invocations must happen in a single process; QTest position arguments support mixing plain function names with function:datatag filters."
  - "The 6.26.0 OSS-Fuzz regression file ossfuzz_testcase_6213340184772608.7z crashes K7Zip::open() with SIGSEGV (SEGV_ACCERR) on the OHOS runner (musl/libc++): reproduced with a minimal standalone program, survives a 64MB stack retry, and passes upstream Linux CI; excluded at run time with disclosure."
  - "test7ZipReadCoder registers bzip2/zstd rows unconditionally, so builds with WITH_BZIP2=OFF / WITH_LIBZSTD=OFF must exclude those two rows at run time (they decode 7z coder payloads through the disabled backends)."
