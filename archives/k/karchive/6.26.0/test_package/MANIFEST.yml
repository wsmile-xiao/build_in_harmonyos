# test_package/MANIFEST.yml
# Upstream and consumer test declaration for karchive/6.26.0.

package: karchive/6.26.0
homepage: https://invent.kde.org/frameworks/karchive

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E \"^karchivetest$\" && ./bin/karchivetest <full function list with per-row exclusions>"

upstream_tests:
  - file: autotests/
    source: karchive-6.26.0/autotests/
    description: "KArchive upstream CTest/autotests suite (karchivetest, kfiltertest, klimitediodevicetest, kcompressiondevicetest)"
    command: "ctest -E ^karchivetest$ && karchivetest <functions/rows>"
    condition: "run in the Conan build with BUILD_TESTING=ON; 3 of 118 karchivetest data rows excluded at run time (1 OHOS SIGSEGV fuzz row, 2 rows needing disabled BZip2/Zstd backends), upstream test sources unmodified"
  - file: tests/
    source: karchive-6.26.0/tests/
    description: "Manual upstream archive command probe executables"
    command: "built by cmake --build; not registered by upstream as CTest tests"
    condition: "not executed because they are manual helper executables"
  - file: autotests/ossfuzz/
    source: karchive-6.26.0/autotests/ossfuzz/
    description: "OSS-Fuzz fuzz targets"
    command: "not built by the baseline recipe"
    condition: "BUILD_FUZZERS=OFF"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke writes and reads back a gzip-compressed tar with KTar."
    command: "conan create (test_package builds and runs test_karchive)"

assertion_count: 8
