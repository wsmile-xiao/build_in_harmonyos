knowledge_gained:
  - "karchive 6.18.0 requires Qt6Core and ECM; compression backends are probed with CMake Find modules."
  - "The current OHOS runner has no host pkg-config, so upstream LibZstd probing cannot be required."
  - "The current local bzip2/1.0.8 package is static and does not guarantee PIC objects, so it is not linked into libKF6Archive.so."
  - "Qt 6.11 QString::arg() does not accept QIODevice::OpenMode QFlags directly; cast the mode value to int in diagnostic strings."
  - "Upstream kfiltertest and KTar filename auto-detection require shared-mime-info inheritance for gzip/xz/lzma/lzip and compressed tar types; a minimal test-only MIME XML under XDG_DATA_DIRS keeps the official CTest intact on the current runner."
