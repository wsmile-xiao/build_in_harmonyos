software: kcodecs5
display: "KCodecs (KF5/Qt5)"
description: "KDE Frameworks 5 string/text codecs (base64/uuencode/quoted-printable, RFC2047, charset encoding detection) built against Qt5"
category: library
homepage: "https://invent.kde.org/frameworks/kcodecs"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "CMAKE_SYSTEM_NAME=Linux: CMake 4.1 has no Platform/HarmonyOS module, forcing Linux semantics keeps KDE CMake logic POSIX-correct"
    - "KDE_INSTALL_USE_QT_SYS_PATHS=OFF: install into kcodecs5's own prefix"
    - "ecm_install_po_files_as_qm(poqm) patched out: Qt5LinguistTools not published to ohpcd"
    - "ECM_MODULE_PATH set manually: CMakeDeps-generated ECMConfig.cmake does not propagate it"
    - "conan_cmakedeps_paths.cmake written by the recipe: qtbase uses cmake_find_mode=none"
    - "Qt5 mkspecs mirror: Qt5CoreConfigExtrasMkspecDir.cmake references ../b/mkspecs/linux-clang, copied from p/mkspecs"
    - "Unlike the KF6 kcodecs, no libiconv fallback needed: KF5 uses QTextCodec (Qt5Core ships legacy charsets without ICU)"
  common_dependencies:
    - qt5-qtbase
    - ecm

versions:
  "5.116.0":
    status: published
    build_date: "2026-09-25"
    conan_ref: "kcodecs5/5.116.0"