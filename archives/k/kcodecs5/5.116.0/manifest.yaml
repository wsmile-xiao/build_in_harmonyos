# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "KF5/Qt5 kcodecs 走 QTextCodec（Qt5Core 内置 legacy charset，不依赖 ICU），与 KF6（QStringDecoder + 无 ICU → 需 libiconv fallback）不同，OHOS 上 rfc2047test 也直接通过"
  - "init-build/conan-init 会把 kcodecs5 误判为 autotools，需手工改用 CMake 配方（参考 kcoreaddons5/5.116.0 改写）"
  - "Qt5CoreConfigExtrasMkspecDir.cmake 引用 ${prefix}/../b/mkspecs/linux-clang，qt5-qtbase conan 包布局下需复制 p/mkspecs → b/mkspecs"
  - "link-level proof 用 nm -u 匹配符号时应使用 demangled 稳定子串（如 base64Encode），mangled 长度前缀易写错"

