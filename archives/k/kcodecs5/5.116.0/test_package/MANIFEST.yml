# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kcodecs5/5.116.0
homepage: "https://invent.kde.org/frameworks/kcodecs"

# 上游测试命令 (ctest, CMake 项目)
upstream_check_command: "ctest --test-dir build --output-on-failure --no-tests=error"

# conanfile.py build() 中是否已集成上游测试
# 说明: 上游 7 项 ctest 已在探索性/真机阶段实际运行 (7/7 通过), 结果记录于
# reports/test-report.md。conan 配方 build() 不内嵌 ctest, 以保持 conan create
# 在 CI 沙箱环境可复现 (OHOS 沙箱对 LD_LIBRARY_PATH 与用户路径二进制 exec 有限制),
# 故此处如实声明为 false。
upstream_test_in_build: false

# 上游实际运行的测试程序 (ctest 7 项)
upstream_tests:
  - file: autotests/kencodingprobertest.cpp
    source: kcodecs-5.116.0/autotests/kencodingprobertest.cpp
    description: KEncodingProber 编码探测上游单测
    command: "./bin/kencodingprobertest"
  - file: autotests/rfc2047test.cpp
    source: kcodecs-5.116.0/autotests/rfc2047test.cpp
    description: RFC2047 encoded-word 编解码上游单测
    command: "./bin/rfc2047test"
  - file: autotests/base45test.cpp
    source: kcodecs-5.116.0/autotests/base45test.cpp
    description: Base45 编解码上游单测
    command: "./bin/base45test"
  - file: autotests/codectest.cpp
    source: kcodecs-5.116.0/autotests/codectest.cpp
    description: KCodecs 内建 codec (base64/qp/uuencode) 上游单测
    command: "./bin/codectest"
  - file: autotests/kemailaddresstest.cpp
    source: kcodecs-5.116.0/autotests/kemailaddresstest.cpp
    description: KEmailAddress 解析/验证上游单测
    command: "./bin/kemailaddresstest"
  - file: autotests/kcharsetstest.cpp
    source: kcodecs-5.116.0/autotests/kcharsetstest.cpp
    description: KCharsets 字符集/实体解析上游单测
    command: "./bin/kcharsetstest"
  - file: autotests/kusasciitextcodectest.cpp
    source: kcodecs-5.116.0/autotests/kusasciitextcodectest.cpp
    description: KUsAsciiTextCodec 上游单测
    command: "./bin/kusasciitextcodectest"

# test_package 中自带的测试 (消费者视角验证, 调用 KF5Codecs API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 调用 KCodecs base64/quotedPrintable/RFC2047 API 验证库可链接、头文件可包含、运行时符号可解析"
    command: "./test_kcodecs5"

# 测试断言总数 (近似值, 用于质量评估; 上游 7 项 ctest + test_package 内自检)
assertion_count: 7