# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kopeninghours/26.04.0
homepage: "https://invent.kde.org/libraries/kopeninghours"

# 上游测试命令 (cmake --build 后由 build() 内执行)
upstream_check_command: "ctest --test-dir <build-dir> --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build-dir> --output-on-failure --no-tests=error --timeout 300"

# 上游实际运行的测试程序 (autotests/CMakeLists.txt 注册的 7 个 ecm_add_test)
upstream_tests:
  - file: autotests/parsertest.cpp
    description: "OSM opening hours expression parser (359 data rows)"
  - file: autotests/jsonldtest.cpp
    description: "schema.org JSON-LD openingHours import"
  - file: autotests/intervaltest.cpp
    description: "Interval arithmetic (begin/end/state transitions)"
  - file: autotests/eastertest.cpp
    description: "Easter date computation for variable-date expressions"
  - file: autotests/evaluatetest.cpp
    description: "Expression evaluation incl. variable time (sunrise/sunset/dawn-dusk)"
  - file: autotests/iterationtest.cpp
    description: "Interval iteration over time (sunrise/Pacific-Auckland data)"
  - file: autotests/intervalmodeltest.cpp
    description: "QAbstractListModel wrapper (IntervalModel) behaviour"

upstream_test_note: >-
  7 upstream autotests registered by autotests/CMakeLists.txt under
  BUILD_TESTING; executed via ctest during conan create with the offscreen
  Qt platform, isolated XDG/HOME, TZ=UTC and TZDIR/QT_ZONEINFO pointing at
  the tzdata/2026.3 zoneinfo tree (OHOS ships no /usr/share/zoneinfo).
  Actual results: 7/7 pass (parsertest 359, jsonldtest 6, intervaltest 6,
  eastertest 9, evaluatetest 132, iterationtest 29, intervalmodeltest 6).

test_package_tests:
  - file: test_kopeninghours.cpp
    description: >-
      Real consumer test: find_package(KOpeningHours) + KOpeningHours link,
      parses "Mo-Fr 08:00-12:00", asserts Monday 09:00 is Open with correct
      begin/end, Monday 13:00 is Closed and nextInterval() yields Tuesday
      08:00, plus normalizedExpression() and schema.org JSON-LD import via
      OpeningHours::fromJsonLd.
    command: "test_kopeninghours"

assertion_count: 547
