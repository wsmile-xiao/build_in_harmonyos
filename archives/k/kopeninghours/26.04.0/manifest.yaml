software: kopeninghours
version: "26.04.0"
status: published
build_date: "2026-09-20"
build_system: cmake
conan_ref: "kopeninghours/26.04.0"
source:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/kopeninghours-26.04.0.tar.xz"
  sha256: "dbcb9aa8018fe1b42bab1031b4f76d363aa0872380e125e04649f4ef5f6421ef"
  tar_format: tar.xz
build:
  system: cmake
  configure_options:
    - "BUILD_TESTING=ON"
    - "BUILD_WITH_QT6=ON (ECM QtVersionOption defaults to Qt5)"
    - "ECM_VERSION=6.28.0 (legacy ECM_VERSION >= 5.91 check would force Qt5)"
    - "GETTEXT_MSGFMT_EXECUTABLE=<gettext pkg bin/msgfmt> (ki18n_install(po))"
    - "KF_IGNORE_PLATFORM_CHECK=TRUE"
  dependencies:
    - "qtbase/6.11.1"
    - "ki18n/6.18.0.1"
    - "kholidays/6.28.0"
    - "tzdata/2026.3"
    - "extra-cmake-modules/6.28.0 (tool)"
    - "flex/2.6.4.2 (tool)"
    - "bison/3.8.2 (tool)"
    - "m4/1.4.19 (tool)"
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "kopeninghours 26.04.0 顶层 CMakeLists 仍有 Qt5/Qt6 双路径旧代码：需 BUILD_WITH_QT6=ON + ECM_VERSION 双 pin 才能走 Qt6"
  - "ki18n_install(po) 构建期运行 msgfmt：GETTEXT_MSGFMT_EXECUTABLE 需指向 gettext 包，且 gettext lib 须在 LD_LIBRARY_PATH"
  - "bison 3.8.2 pkgdatadir 编译为 /share/bison：需 BISON_PKGDATADIR + M4 指向 conan 包"
  - "OHOS 无 /usr/share/zoneinfo 且 qtbase timezone_tzdb 关闭：Qt 测试需 TZDIR/QT_ZONEINFO 指向 tzdata zoneinfo（kcalendarcore 先例）"
  - "python/3.12.9 作为 tool_require 会把其 lib 注入 LD_LIBRARY_PATH，遮蔽系统 python 的 libpython（sys.platform 变 linux）导致 sysconfigdata 缺失崩溃——本包不引入"
  - "手动 conan_cmakedeps_paths.cmake 会替换工具链 find_paths 块：必须显式补 kholidays/ki18n 的 lib/cmake 路径"
upstream_test_pass_rate: "7/7 (100%)"
adapted_test_pass_rate: "100% (consumer test passes)"
test_command: "conan create . --build=missing (recipe build() 内 ctest)"
