# 版本级 manifest — kwindowsystem5 5.116.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.116.0"

# 软件名
software: "kwindowsystem5"

# 编译状态
# published | built | failed | archived
# verify 通过但尚未 upload（upload 在 PR 合并到 main 后由 CI 执行）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方 KDE Frameworks 源, R39)
  url: "https://download.kde.org/stable/frameworks/5.116/kwindowsystem-5.116.0.tar.xz"

  # 源码校验和
  sha256: "7ec97633752fbde2505b40d762d933b642cae42b6b86d6e801fbdfcd2eeb5334"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DQT_MAJOR_VERSION=5"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_SHARED_LIBS=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - qt/5.15.19
    - ecm/6.26.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-poqm-disable.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "qt5-qtbase/5.15.2 的 OHOS 预编译包不含 Qt5Widgets，KDE Framework 5 需 Widgets 的库必须依赖全量 qt/5.15.19"
  - "ecm 作为 tool_requires 时其 share/ECM/ 不会自动接入 host config 路径，需显式设置 ECM_DIR + ECM_MODULE_PATH 指向 ecm package 目录"
  - "HarmonyOS 未映射到 Linux CMake 平台，需 CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE + CMAKE_SHARED_LIBRARY_SONAME_{C,CXX}_FLAG=-Wl,-soname, 否则 .so 无 DT_SONAME"
  - "poqm 翻译 .ts 需要 Qt5LinguistTools/lrelease，打包 Qt5 不含；注释 ecm_install_po_files_as_qm(poqm) 跳过"
  - "autotests/ 中 15/16 用例被 X11_FOUND 门控，OHOS 无 X11 不参与构建；仅 wayland 用例 QSKIP 通过"
