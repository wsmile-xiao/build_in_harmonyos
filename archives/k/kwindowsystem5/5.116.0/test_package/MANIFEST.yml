# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kwindowsystem5/5.116.0
homepage: "https://invent.kde.org/frameworks/kwindowsystem"

# 上游测试命令 (CMake project: ctest / make check)
upstream_check_command: "cd build && ctest --test-dir . --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error"

# 上游实际运行的测试程序
# kwindowsystem 5.116 使用 autotests/ 下的 QtTest 程序。在 OHOS (无 X11/WM)
# 环境下，autotests/ 中 15/16 个用例位于 if(X11_FOUND) 门内，不参与编译；
# 仅 1 个无条件注册用例被构建并注册：
#   kwindowsystem_platform_wayland_test.cpp -> kwindowsystemplatformwaylandtest
# 该用例 initTestCase 探测 weston，未安装则 QSKIP（skip=通过，退出码 0）。
# tests/ 下的 5 个演示程序同样被 X11_FOUND 门控，不参与构建。
upstream_tests:
  - file: autotests/kwindowsystem_platform_wayland_test.cpp
    source: "autotests/kwindowsystem_platform_wayland_test.cpp"
    description: "Wayland 平台测试；无 weston 时 QSKIP (skip=pass)"
    command: "./kwindowsystemplatformwaylandtest"
    result: "pass (skip)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用 KWindowSystem::self/numberOfDesktops + KWindowInfo 真实 API"
    command: "./test_kwindowsystem5"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
