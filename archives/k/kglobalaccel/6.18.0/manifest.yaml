knowledge_gained:
  - "kglobalaccel 6.18.0 requires Qt6DBus/Gui/Widgets (via qtbase-sql-dbus), ECM and Qt6LinguistTools (qttools) for PO->QM; WITH_X11=OFF avoids Qt6::GuiPrivate X11 dependency on OHOS."
  - "KF_IGNORE_PLATFORM_CHECK=TRUE lets KF6 CMake proceed on HarmonyOS (unlisted platform)."
  - "Upstream registers NO ctest tests: tests/CMakeLists.txt uses add_executable(kglobalacceltest) without ecm_add_test/add_test; the QML GUI test needs org.kde.kquickcontrols (KeySequenceItem), a running D-Bus session bus and a display, so it is built but not ctest-runnable headless."
  - "qtdeclarative is only needed to compile the kglobalacceltest target (Qt6Qml); use build_requires so it does not leak into the runtime dependency set."
