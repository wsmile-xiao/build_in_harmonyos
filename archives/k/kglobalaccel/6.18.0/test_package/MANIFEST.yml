# test_package/MANIFEST.yml
# 上游官方测试声明文件 (R51: 清点 → 运行 → 回填)
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kglobalaccel/6.18.0
homepage: "https://invent.kde.org/frameworks/kglobalaccel"

# 上游测试清点:
#   tests/ 目录: 1 个测试源文件 (kglobalacceltest.cpp + kglobalacceltest.qml)
#   ctest 注册数: 0
#   tests/CMakeLists.txt 使用 add_executable 构建 kglobalacceltest，
#   但未调用 ecm_add_test/add_test，上游本身未将其注册到 ctest。
#   该测试是 QML GUI 集成测试 (QApplication + ApplicationWindow)，
#   运行需要 org.kde.kquickcontrols QML 模块 (KeySequenceItem) +
#   运行中的 D-Bus session bus + kglobalacceld 守护进程 + 图形显示，
#   在 OHOS 无头构建环境中不可运行 (详见 reports/upstream-tests.md)。
upstream_check_command: "cmake --build build && ctest --test-dir build"

# conanfile.py build() 中已集成上游测试 (ctest, 0 注册 → 空套件通过)
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir {build_folder} --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: kglobalacceltest.cpp
    source: kglobalaccel-6.18.0/tests/kglobalacceltest.cpp
    description: "QML GUI 集成测试 (需要 kquickcontrols QML 模块 + DBus session + 显示; 未注册 ctest)"
    command: "./tests/kglobalacceltest"
    status: "built-ok / not-runnable-headless (kquickcontrols module + DBus + display required)"

# test_package 中自带的测试 (消费者视角验证, R34 实质调用被测库 API)
test_package_tests:
  - file: test.cpp
    description: "调用 KGlobalAccel::self()/setShortcut/isGlobalShortcutAvailable/globalShortcutsByKey"
    command: "./test_kglobalaccel"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
