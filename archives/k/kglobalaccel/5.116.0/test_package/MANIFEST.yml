# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kglobalaccel/5.116.0.

package: kglobalaccel/5.116.0
homepage: https://invent.kde.org/frameworks/kglobalaccel

# Upstream KF5 5.116.0 ships two test entry points:
#   - autotests/kglobalshortcuttest (1 ctest case via ecm_add_tests): the
#     recipe builds it with BUILD_RUNTIME=OFF via
#     patches/0002-build-autotest-without-runtime.patch, which links the
#     public KF5::GlobalAccel + compiles src/sequencehelpers_p.cpp instead of
#     the daemon-side private target KF5::GlobalAccelPrivate (test source
#     unchanged). It is registered in the build tree:
#     $ ctest --test-dir <build_folder> -N  ->  Total Tests: 1
#   - tests/kglobalacceltest: a non-asserting QML smoke executable with NO
#     add_test()/ctest registration (also built; exercised in the notes.md
#     R51 declaration).
upstream_check_command: "ctest --test-dir <build_folder> -N  # Total Tests: 1"

upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> -N  # 1 registered case (kglobalshortcuttest)"

upstream_tests:
  - file: autotests/kglobalshortcuttest.cpp
    source: kglobalaccel-5.116.0/autotests/kglobalshortcuttest.cpp
    registered_by: autotests/CMakeLists.txt (ecm_add_tests; BUILD_RUNTIME guard
      bypassed for the library-only configuration by
      patches/0002-build-autotest-without-runtime.patch)
    inventory: 1 ctest case (kglobalshortcuttest)
    command: "ctest --test-dir <build_folder> -N"
    execution: >-
      Executed in full on the real OHOS PC device against a live D-Bus session
      bus (dbus-daemon 1.14.10, abstract-socket address, no kglobalaccel
      daemon service present). Exit code 0.
      Totals: 9 passed, 0 failed, 10 skipped, 0 blacklisted (~2.1s).
      Passed: initTestCase, testComponentAssignment, testNotification,
      testMangle, testCrop, testReverse, testMatch,
      testOverrideMainComponentData, cleanupTestCase — real assertions over
      the public KGlobalAccel API and the Utils:: sequence helpers.
      Skipped (upstream's own degradation path, concrete technical reasons):
      8 slots QSKIP "kglobalaccel not installed" — every daemon-dependent slot
      checks initTestCase's startService("org.kde.kglobalaccel") result, which
      fails with org.freedesktop.DBus.Error.ServiceUnknown because the
      kglobalacceld daemon is X11/XCB-only and is excluded from the OHOS
      adaptation (BUILD_RUNTIME=OFF, see recipe docstring);
      testActivateShortcut QSKIP "This test requires to be compiled with
      XCB-XTEST" — the daemon's X11 XTEST-based injection path, not built on
      OHOS. Full per-line excerpt: reports/test-report.md §2.3 (the raw log
      was removed from the PR per repo file rule 19 — no *.log in PR);
      binary hash: reports/upstream-test-binary.txt.
    evidence:
      - reports/test-report.md
      - reports/upstream-test-inventory.txt
      - reports/upstream-test-binary.txt
  - file: tests/kglobalacceltest.cpp
    source: kglobalaccel-5.116.0/tests/kglobalacceltest.cpp
    description: >-
      QML smoke executable (loads tests/qmltest.qml via QmlTestRunner
      pattern). Upstream declares no add_test() for it, so it never registers
      a ctest case; it additionally requires a live org.kde.kglobalaccel
      daemon to be meaningful. Not part of the upstream ctest inventory
      (N=1 above already covers everything upstream registers).
    command: "ctest --test-dir <build_folder> -N  # not registered upstream"

why_not_run_in_recipe: >-
  build() records the ctest inventory only (ctest -N). A full in-recipe ctest
  run would crash before any QSKIP: with no D-Bus session bus in the build
  sandbox, QDBusConnection::sessionBus().interface() returns nullptr and the
  upstream initTestCase dereferences it (probe excerpt in
  reports/test-report.md §2.2 — "iface=0" without a bus, connected and
  non-null with one). The suite is therefore executed on the real device with
  a live session bus, and the results are excerpted into reports/test-report.md
  (R51 three-step declaration: inventory / run / report).

test_package_tests:
  - file: test_package/test.cpp
    description: >-
      Consumer test (R34 real API usage, 13 assertions, non-zero exit on
      failure). Degradation-path assertions: KGlobalAccel::self() != nullptr;
      hasShortcut() is false before registration and false again after
      removeAllShortcuts(); hasShortcut() after setShortcut() equals the
      setShortcut() result; shortcut() returns at most the requested
      sequence; isGlobalShortcutAvailable() is idempotent for the same
      sequence; defaultShortcut() is empty after removeAllShortcuts().
      Positive-path assertions (falsifiable without the daemon — they fail
      if the client-side registration chain regresses):
      setDefaultShortcut() accepts a well-formed sequence and
      defaultShortcut() round-trips it (garbage-keycode check -> doRegister()
      bookkeeping -> default-shortcut map insert, all client-side);
      setShortcut() rejects an action without objectName() and the refused
      action stays unregistered (doRegister guard); setShortcut() refuses a
      sequence containing a garbage keycode (-1) and stays unregistered
      (checkGarbageKeycode guard). All assertions are deterministic on
      desktop sessions and headless OHOS devices.
    command: "conan create (test_package builds and runs test_kglobalaccel)"

assertion_count: 13
