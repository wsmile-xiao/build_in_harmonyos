patches:
  "5.116.0":
    - patch_file: "patches/0001-guard-poqm-on-qt5linguisttools.patch"
      patch_description: "Guard ecm_install_po_files_as_qm(poqm) on Qt5LinguistTools_FOUND: the OHOS Qt5 packages do not ship Qt5LinguistTools (lrelease/lconvert) and no such Conan package exists in the OHOS registry, so configure would fail on find_package(Qt5LinguistTools CONFIG REQUIRED). Translation .qm compilation is skipped; library code and public API are unaffected."
      patch_type: "portability"
    - patch_file: "patches/0002-build-autotest-without-runtime.patch"
      patch_description: "Build autotests/kglobalshortcuttest when BUILD_RUNTIME=OFF by linking the public KF5::GlobalAccel library and compiling src/sequencehelpers_p.cpp (helpers exported for exactly this unit test) instead of the daemon-side private target KF5::GlobalAccelPrivate. Test source code is unchanged; the suite still self-skips at runtime when the org.kde.kglobalaccel daemon service is absent (OHOS has no X11/XCB session, so the daemon is excluded). This keeps the upstream test inventory (1 ctest case) present in the test build."
      patch_type: "test_infrastructure"
