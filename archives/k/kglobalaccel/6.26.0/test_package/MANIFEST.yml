# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kglobalaccel/6.26.0.

package: kglobalaccel/6.26.0
homepage: https://invent.kde.org/frameworks/kglobalaccel

# Upstream ships tests/CMakeLists.txt with a single executable target
# (kglobalacceltest) and NO add_test()/ctest registration:
#   $ ctest --test-dir <build_folder> -N  ->  Total Tests: 0
# The executable is a GUI/QML smoke program (QApplication +
# QQmlApplicationEngine + app.exec()); it has no assertions and never
# returns, so it cannot be used as an automated test case.
upstream_check_command: "ctest --test-dir <build_folder> -N"

upstream_test_in_build: false
upstream_test_command: "ctest --test-dir <build_folder> -N  # 0 registered cases"

upstream_tests:
  - file: tests/CMakeLists.txt
    source: kglobalaccel-6.26.0/tests/CMakeLists.txt
    description: >-
      Only an executable target is declared (kglobalacceltest, linked against
      KF6::GlobalAccel + Qt6::Qml + Qt6::Test). No add_test() call exists, so
      ctest registers 0 cases; MANIFEST records this as "no automated cases".
    command: "ctest --test-dir <build_folder> -N"

test_package_tests:
  - file: test_package/test.cpp
    description: >-
      Consumer test (R34 real API usage, 6 assertions, non-zero exit on
      failure): asserts KGlobalAccel::self() != nullptr; hasShortcut() is false
      before registration and false again after removeAllShortcuts();
      hasShortcut() after setShortcut() equals the setShortcut() result;
      shortcut() returns at most the requested sequence;
      isGlobalShortcutAvailable() is idempotent for the same sequence. All
      assertions are written against API consistency (not a D-Bus side effect)
      so they are deterministic on desktop sessions and headless OHOS devices.
    command: "conan create (test_package builds and runs test_kglobalaccel)"

assertion_count: 6
