knowledge_gained:
  - "kglobalaccel is tier 1: its only KF-side dependency is ECM (upstream .kde-ci.yml: frameworks/extra-cmake-modules '@same'); no other KF6 library is needed."
  - "ECM's KDEMetaInfoPlatformCheck aborts configure because metainfo.yaml lists Linux/FreeBSD only; KF_IGNORE_PLATFORM_CHECK=TRUE is mandatory on HarmonyOS."
  - "Qt6::DBus is only available from qtbase-sql-dbus/6.11.1 (qtbase/6.11.1 ships FEATURE_dbus=OFF and no Qt6DBus cmake module), so recipes needing Qt6::DBus must require qtbase-sql-dbus."
  - "ecm_install_po_files_as_qm() performs find_package(Qt6 COMPONENTS LinguistTools CONFIG REQUIRED); with Qt modules split across package folders the lookup must be enabled via QT_ADDITIONAL_PACKAGES_PREFIX_PATH (Qt6_DIR alone locks the search inside the Qt6 base package folder)."
  - "WITH_X11 defaults ON and src/kglobalaccel.cpp includes <private/qtx11extras_p.h>; OHOS Qt builds do not ship that private header, so WITH_X11=OFF is required."
  - "Upstream registers no CTest cases for kglobalaccel 6.26.0 - the only test entry point is the non-asserting GUI/QML executable kglobalacceltest that never returns."
  - "On HarmonyOS (CMAKE_SYSTEM_NAME=HarmonyOS, no CMake platform module) CMake ignores VERSION/SOVERSION and emits an unversioned .so without DT_SONAME, failing the L5 SONAME gate; setting CMAKE_SHARED_LIBRARY_SONAME_C_FLAG/CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG to -Wl,-soname, restores versioned filenames and DT_SONAME (CMake's Platform/OHOS.cmake is only used when CMAKE_SYSTEM_NAME=OHOS)."
