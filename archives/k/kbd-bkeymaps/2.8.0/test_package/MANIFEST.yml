package: kbd-bkeymaps/2.8.0
homepage: "https://kbd-project.org/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_notes: "This data package does not build the full kbd utilities or run the upstream suite; the consumer test validates every generated binary keymap."

upstream_tests: []

test_package_tests:
  - file: test_bkeymaps.py
    description: "Validate gzip integrity and BusyBox bkeymap structure for every packaged map"
    command: "test_bkeymaps.py share/bkeymaps"
  - file: test_bkeymaps.py
    description: "On HarmonyOS AArch64, validate that the installed keymap data is readable and structurally valid"
    command: "test_bkeymaps.py share/bkeymaps --ohos"

assertion_count: 4
