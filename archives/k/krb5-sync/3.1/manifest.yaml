package: krb5-sync
software: krb5-sync
version: "3.1"
status: built
build_date: "2026-09-26"
build_system: autotools
homepage: https://www.eyrie.org/~eagle/software/krb5-sync/
license: BSD-3-Clause

source:
  url: https://archives.eyrie.org/software/kerberos/krb5-sync-3.1.tar.xz
  sha256: b26918d7564e1c03b8ca392ffdf882cfa201789e54a97ed00f043a082a92814e
  tar_format: tar.xz

build:
  system: autotools
  command: "sh ./configure --prefix=/ --bindir=/bin --sbindir=/bin --libdir=/lib --includedir=/include --with-krb5-include=/storage/Users/currentUser/tmp/ch/home-z68-krb5fix/p/krb50acf73e42647a/p/include --with-krb5-lib=/storage/Users/currentUser/tmp/ch/home-z68-krb5fix/p/krb50acf73e42647a/p/lib --with-ldap-include=/storage/Users/currentUser/tmp/ch/home-z68-krb5fix/p/openla04925142be38/p/include --with-ldap-lib=build-release/.la-free-libs --host=aarch64-linux-ohos --build=x86_64-linux-gnu TMPDIR=build-release/tmp CONFIG_SHELL=/bin/sh SHELL=/bin/sh && make -j1 SHELL=/bin/sh && LD_LIBRARY_PATH=<全部 requires 的 libdirs 冒号串> make -j1 SHELL=/bin/sh check > build-release/make-check.log 2>&1; make install（上游 check 在有集 aborted 时 rc≠0：本轮 rc=2；配方不按 rc 判成败，而是要求 make-check.log 里出现 runtests 摘要行，取不到即抛 ConanException；Conan 工具链另按 DESTDIR 安装；依赖目录取 CONAN_HOME/p 下的实际包目录，openldap 的库目录经 E236 la-free 镜像）"
  dependencies: ["krb5/1.22.1", "openldap/2.6.7"]

patches_applied: ["0001-config-sub-ohos.patch", "0002-config-tmpdir-umask.patch"]

knowledge_gained:
  - "libtool 链接墙：依赖制品的 .la 元数据不可搬迁（openldap 的 libdir 记为 双斜杠 lib、libldap.la 的 dependency_libs 带绝对项）⇒ 按 knowledge/graph/E236.kv:29 建 build 私有 la-free 镜像并只收非 .la 载荷，链接即通；复算读数 见 notes.md 的链接一节  ref: notes.md:149"
  - "conan 生成件才是重定向的正确落点：AutotoolsDeps 写的 LDFLAGS 会被 configure 抄进 config.status 与 Makefile，事后改 Makefile 会被 config.status 还原  ref: notes.md:150"
  - "--prefix=/ 让本包自产双斜杠 lib 字符串（libtool -rpath 与自身 .la）：追加 --libdir=/lib 消掉，DESTDIR 安装布局不变  ref: notes.md:151"
  - "无公开头文件的插件包必须显式 cpp_info.includedirs 置空，否则 CMakeDeps 的 INTERFACE_INCLUDE_DIRECTORIES 指向不存在目录、test_package 在 cmake.configure 就红；工具链把 sbindir 定为 prefix/bin ⇒ 制品在 bin/，test_package 与 runenv 不得照抄 sbin  ref: notes.md:152"
  - "capability-tested shell：profile buildenv 的 bash 在 HMDFS 构建目录 getcwd 坏，判据取 rc=0 且 stderr 为空且输出绝对路径（探壳行见 w3 日志），内联前缀而非 Environment().define  ref: knowledge/graph/E386.kv:31 + notes.md:154"
  - "上游 2012 版 build-aux/config.sub 需把 linux-ohos 加进 maybe_os 分支并从 -linux-ohos* 拒绝表摘除，本快照补丁 hunk 落在 115 与 1376 行；先例 knowledge/graph/E122.kv 的锚点（第 118 与 1379 行）直拿会报 Hunk 1 FAILED 1754/1754 ⇒ 锚点按快照自制  ref: notes.md:155"
  - "configure 的 mktemp 辅助在 HMDFS 上必须 umask 022 运行，否则临时目录 drwx--S--- 拒绝探针写入（补丁 0002）  ref: notes.md:156"

platform:
  target_architecture: OHOS/armv8
  limitations:
    - "sync.so is dlopen'ed by kadmin at runtime; cpp_info.libs stays empty on purpose (no import library). The two CLI tools are the linkable deliverables (R38 commands.json)."
    - "Upstream make check really runs inside build(): inline LD_LIBRARY_PATH over every requirement libdir, output redirected to build_folder/make-check.log, and a missing runtests summary raises ConanException, so this declaration has execution evidence. Measured on HarmonyOS aarch64 (B machine, 2026-09-26 18:57, fresh CONAN_HOME ~/tmp/ch/home-z68-krb5fix2): Files=17, Tests=1250, Aborted 7 test sets, passed 1180/1250 tests, 1 test skipped (util/xmalloc is author-only upstream). 8 sets ok, 1 set skipped, 7 sets aborted, 1 set crashed. The suite is therefore NOT declared as fully passing."
    - "Same-round residue recovery (test hygiene, not a workaround): plugin/queue-only mkdirs tests/tmp/queue and then dies, so the directory is left behind *inside the same make check pass* and the next set plugin/queuing aborts on 'cannot mkdir queue: File exists' with 0 of its 47 assertions executed. Clearing the directory before make check cannot help (the residue is created by that very run), so build() re-runs only that set afterwards, inline LD_LIBRARY_PATH, with its own narrow guard (no verdict, no plan count, ABORTED/MISSED/skipped, or a summary denominator that disagrees with the plan all raise ConanException). Measured: plugin/queuing executed 47, passed 42, failed 5, rc=1 (KRB5_QUEUE_HYGIENE_RESULT=set=plugin/queuing discovered=1 executed=47 failed=5 passed=42 declared=47 rc=1, reports/w3-local-ci.log:496). No set was skipped, deleted or re-planned; the 1250 denominator is unchanged."
    - "The two failing C sets have two different root causes, disclosed rather than merged: (1) tests/data/make-krb5-conf line 38 uses the GNU sed extension 0,/re/d, but the only sed on HarmonyOS PC is toybox 0.8.12, which accepts that expression, emits 0 bytes and returns 0, so the generated krb5.conf is truncated and plugin/config.c takes the !HAVE_KRB5_REALM path and frees a NULL default realm (SEGV_MAPERR at NULL+8) -> plugin/queue-only MISSED 1-23 (killed by signal 11), 23 assertions never executed. (2) The 5 failures of plugin/queuing after the recovery run are all '...mode of queue file is correct' (is_int(0600, st.st_mode & 0777), seen 0640): this build filesystem rewrites a 0600 create mode to 0640 (0700 -> 0740) and a later chmod(0600) does not clear the group-read bit either (probe reproduced 3/3 with umask=022, so 0600 & ~0022 = 0600 cannot explain it). Recovering (1) needs an upstream test-data patch; recovering (2) would mean loosening an upstream assertion -> neither was done, both are reported for user/maintainer adjudication. Forensic record: tmp/uc2/z68-krb5/queue-only-forensics.md on the build host; earlier note that a clean single run of queuing returns rc=0 was wrong, the measured rc is 1."
    - "docs/pod, docs/pod-spelling, perl/critic, perl/minimum-version, perl/strict and tools/backend abort with execution failed -- not found?: the device ships no perl/pod interpreter or pod toolchain (capability gap; these 6 sets contribute 0 assertions)."
