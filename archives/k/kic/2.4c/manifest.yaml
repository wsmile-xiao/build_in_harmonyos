# 版本级 manifest — kic 2.4c
# 遵循 ARCHIVE-SPEC v2.0

version: "2.4c"
software: "kic"
status: built
build_date: "2026-09-22"
build_system: autotools

source:
  url: "https://www.wrcad.com/ftp/pub/kic-2.4c.tar.gz"
  sha256: "2240ac0a34bee786de67263bff6898892478b5f815e82d0a13559e9d6789833e"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
    - "--x-includes=<libx11-package>/include"
    - "--x-libraries=<libx11-package>/lib"
  dependencies:
    - libx11/6.4.0
  cc: clang

patches_applied:
  - "patches/0001-config-sub-ohos.patch"
  - "patches/0002-fix-x-library-path.patch"
  - "patches/0003-configure-hmdfs-umask.patch"

upstream_tests_exist: false
upstream_test_audit: "Audited kic-2.4c source archive: top-level Makefile and all src/*/Makefile* have no check/test/TESTS target (recursive targets are 'all install uninstall clean' only); no tests/ directory, no dejagnu/autotest/ctest bindings. Upstream ships no automated test harness; verification tooling is limited to the interactive X11 GUI. Evidence recorded in notes.md and reports/test-report.md."
reason: "kic 2.4c ships no upstream automated tests. HarmonyOS consumer end-to-end cases (8 assertions: ciftokic CIF->kic + kictocif kic->CIF roundtrip with geometry assertion B 100 100 50 50) added in test_package/test.c."

knowledge_gained:
  - "autoconf 2.13 遗留变量 $ac_x_libraries 在 2.63 configure 中恒为空，-L 后路径丢失需替换为 $x_libraries"
  - "kic 上游硬编码 CFLAGS，依赖头文件路径只能在 make 阶段通过 CFLAGS 覆盖注入（需保留 -DUSE_OLD_MALLOC 上游语义）"
  - "X11 头文件分属两个 conan 包：Xlib.h 在 libx11，X.h/Xatom.h 等在 xorgproto，两者 -I 都要注入"
  - "老 config.guess（2013）在 HarmonyOS 宿主探测失败，--build 与 --host 需显式同为 aarch64-linux-ohos"
