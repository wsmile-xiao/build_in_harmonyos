package: kic/2.4c
homepage: "http://www.wrcad.com/"

# 上游测试清点（R51）：顶层 Makefile 仅 dummy/install/uninstall/clean/distclean
# 目标，src/*/Makefile* 均无 check/test 目标，仓库内无 tests/ 目录 ——
# 上游无自动化测试入口，无测试可执行。
upstream_check_command: "无（上游无自动化测试）"
upstream_test_in_build: false
upstream_test_command: "无"
upstream_tests: []

# 鸿蒙消费者用例（真实执行被测包二进制的端到端转换链路）
test_package_tests:
  - file: test.c
    description: "消费者端到端用例 1：执行 ciftokic 将样例 CIF 转为 kic 单元文件（exit 0 + Root/Symbol1 生成）"
    command: "./test_kic（用例 1-3）"
  - file: test.c
    description: "消费者端到端用例 2：执行 kictocif（KIC_LIB_DIR 指向包内启动文件）回转 Root 单元为 CIF（exit 0 + Root.cif 生成）"
    command: "./test_kic（用例 4-5）"
  - file: test.c
    description: "消费者端到端用例 3：校验回转 CIF 内容保留原始几何 B 100 100 50 50（数据一致性断言）"
    command: "./test_kic（用例 6）"

assertion_count: 8
