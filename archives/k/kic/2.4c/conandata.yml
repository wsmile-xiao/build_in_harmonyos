# conandata.yml — kic 2.4c
# 官方源（Whiteley Research freestuff 页面直链）

sources:
  url: "https://www.wrcad.com/ftp/pub/kic-2.4c.tar.gz"
  sha256: "2240ac0a34bee786de67263bff6898892478b5f815e82d0a13559e9d6789833e"

patches:
  - patch_file: "patches/0001-config-sub-ohos.patch"
    patch_description: "config.sub（autoconf 2.63，2013）不识别 OHOS 三元组：在 basic_machine 与 os 两处白名单加入 linux-ohos*（aarch64 已内建）"
    patch_type: "portability"
  - patch_file: "patches/0002-fix-x-library-path.patch"
    patch_description: "configure/configure.in 沿用 autoconf 2.13 遗留变量 $ac_x_libraries（2.63 中已更名 $x_libraries 且 ac_ 版恒为空），导致 Makefile LIBS 变成 '-L -lX11' 链接失败；替换为 $x_libraries"
    patch_type: "bugfix"
  - patch_file: "patches/0003-configure-hmdfs-umask.patch"
    patch_description: "HMDFS 对目录强制 setgid，configure/config.status 的 `umask 077 && mktemp -d` 产生 drwx--S--- 临时目录连属主都无法写入，config.status 报 subs1.awk: Permission denied（CI 构建失败 E114）；去掉 umask 077 使临时目录以可写权限创建"
    patch_type: "portability"
