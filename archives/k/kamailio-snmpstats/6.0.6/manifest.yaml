# 版本级 manifest — kamailio-snmpstats 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-snmpstats"
status: published                      # published | built | failed | archived
build_date: "2026-09-25"
build_system: makefile             # kamailio 经典 Makefile 体系（非 autotools/cmake）

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "make cfg include_modules=snmpstats LOCALBASE=<net-snmp package_folder> BUILDER="
    - "make modules modules=modules/snmpstats -j1 LOCALBASE=<net-snmp package_folder> BUILDER="
  dependencies:
    - net-snmp/5.9.4
    - openssl/3.5.6
  cc: clang
  cxx: clang++

# ============================================================
# 上游测试（R51 三步法台账，完整清单见 notes.md 第四节）
# ============================================================
# 清点面 = 官方源码包内 `test/`、`tests/` 目录文件数（4 个目录 / 17 个文件）
# 实测 = 其中唯一自包含、无需运行中 kamailio 实例的上游 unittest（3 个用例）已真实执行
upstream_tests:
  command: "python3 dbtextdb_test.py -v"
  source_path: "kamailio-6.0.6/utils/kamctl/dbtextdb/dbtextdb_test.py"
  test_count: 17
  executed_count: 3
  passed: 3
  failed: 0
  notes: "17 = 源码包内 test/tests 目录文件数（10 个 dbtextdb 用例数据 + janssonrpcc 3 + rtpproxy 3 + tm 1）。仅 dbtextdb_test.py 可自执行（3 个 unittest 用例，仅依赖 Python 标准库），已在 conanfile.py build() 末尾真实执行并 3/3 通过；其余 7 个独立文件逐项技术原因见 test_package/MANIFEST.yml 的 upstream_tests[].not_executed_reason。snmpstats 模块自身在源码包内无任何测试文件。"

# ============================================================
# 补丁信息
# ============================================================

# 上游 6.0.6 源码包原生识别 aarch64-unknown-linux-ohos，未应用任何补丁
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`，否则报 No rule to make target 'cfg-defs'"
  - "net-snmp 配方的 net-snmp-config --prefix 为 /，模块 Makefile 的 BUILDER 分支会产出 -L//lib 无效路径；须传 BUILDER=（空）+ LOCALBASE=<net-snmp 包目录> 走 LOCALBASE 分支"
  - "net-snmp 公开头文件包含 openssl 头，须 requires openssl 并将其 include 目录加入 CPATH"
  - "kamailio 同时提供 CMake 与经典 Makefile 两套构建体系；仅打包单个模块时用经典 Makefile 更直接"

# refresh-patch 曾把构建生成物误判为源码改动（src/config.mak、src/modules.lst、
# snmpstats/*.d、librpath.lst、makecfg.lst 共 24 个），经人工核对全部为生成产物，
# 未形成任何源码适配补丁 → 本配方 0 补丁（conandata.yml 为 patches: {}）
patch_generation:
  method: none
  patches_count: 0
  note: "24 个候选文件全部判为 GENERATED（构建产物），已清理，无补丁"
