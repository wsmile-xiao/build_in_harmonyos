# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: kamailio-snmpstats/6.0.6
homepage: "https://www.kamailio.org"

# ============================================================
# 声明 N —— 机器可读字段，供检视「少报核验」直接比对（判定式：实测 N ≤ 声明 N）
#
# 清点口径（与评审脚本同口径）：官方源码包内 `test/`、`tests/` 目录下的文件数。
# 复现命令：
#   tar tzf kamailio-6.0.6_src.tar.gz | grep -E '/(test|tests)/' | grep -v '/$' | wc -l
# 上游 tag 6.0.6 实测 = 17；本文件声明 N = upstream_test_count = 17（无少报）。
#
# 清点面明细（4 个目录 / 17 个文件，逐项登记见下方 upstream_tests）：
#   utils/kamctl/dbtextdb/tests/   10 个（dbtextdb_test.py 的用例数据）
#   src/modules/janssonrpcc/test/   3 个（jsonrpc-c 模块：脚本 + 配置）
#   src/modules/rtpproxy/test/      3 个（rtpproxy 模块：配置 + 命令行记录）
#   src/modules/tm/test/            1 个（tm 模块：开发期 IPC 清理脚本）
#   snmpstats 模块自身 src/modules/snmpstats/ 内无测试文件、无 check/ctest 目标注册。
# ============================================================
upstream_test_count: 17          # 声明 N（= 上游 test/tests 目录文件数，实测 17）
upstream_executed_test_count: 3  # 其中真实执行的上游用例数（dbtextdb_test.py 的 3 个 unittest 用例）
upstream_passed: 3
upstream_failed: 0
upstream_pass_rate: "100%"

# 上游统计三列（与 PR 描述「上游统计」表逐项一致）
upstream_stats:
  unit: 3            # dbtextdb_test.py 的 3 个 unittest 用例（唯一可在构建期自执行项）
  integration: 0
  other: 14          # 其余 14 个测试资产文件（合计 17 - 单元 3）
  total: 17
# 适配后统计（与 PR 描述「适配后」表逐项一致）
adapted_stats:
  unit: 3
  integration: 0
  other: 10          # 鸿蒙特有测试：check_snmpstats.py 的 10 条产物断言
  total: 13

# 构建期真实执行的官方测试（R51 三步法：清点 → 实跑 → 回填）
upstream_check_command: "python3 dbtextdb_test.py -v"
upstream_test_in_build: true
upstream_test_command: "python3 dbtextdb_test.py -v"

# 补丁情况（与 conandata.yml 的 patches: {} 一致）
patches_count: 0

# ============================================================
# 执行器（runner）—— 不在声明 N 的清点面内，单独登记
# 该文件位于 utils/kamctl/dbtextdb/（路径不含 test/ 段），故不计入 17；
# 它是上面 10 个用例数据文件的消费者，单独列出以免与 17 个测试资产混淆。
# ============================================================
upstream_test_runner:
  file: dbtextdb_test.py
  path: kamailio-6.0.6/utils/kamctl/dbtextdb/dbtextdb_test.py
  command: "python3 dbtextdb_test.py -v"
  cases: 3
  executed: true
  executed_in: "conanfile.py build() → _run_upstream_tests()"
  result: "Ran 3 tests ... OK（failures=0, errors=0）"
  note: "上游自带 unittest 入口，仅依赖 Python 标准库；用例数据取自同目录 tests/ 下 10 个文件；实跑日志见 reports/conan-create.log"

# ============================================================
