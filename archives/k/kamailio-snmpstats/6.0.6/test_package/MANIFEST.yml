# ============================================================
# test_package 中自带的测试（消费者视角验证）
# ============================================================
test_package_tests:
  - file: check_snmpstats.py
    description: "产物结构校验：ELF aarch64/ELFCLASS64/ET_DYN、AgentX 依赖（libnetsnmpagent/libnetsnmpmibs）与 AgentX 导出符号、KAMAILIO MIB 数据文件 5 个、动态段 NEEDED 复核"
    command: "python3 check_snmpstats.py（由 conanfile.py test() 注入 SNMPSTATS_MODULE/SNMPSTATS_PACKAGE_FOLDER 后执行）"
    assertions: 10
  - file: conanfile.py
    description: "L1 测试入口：定位制品内 lib/kamailio/modules/snmpstats.so，注入环境变量驱动 check_snmpstats.py（非空壳 print）"
    command: "conan create . --build=missing（CI 自动执行 test()）"

# test_package 断言总数（check_snmpstats.py 运行时 check() 执行次数）
#   9 条无条件 + 1 条依赖工具链（有 llvm-readelf/readelf 时执行）
#   本机与 CI worker 均存在 /data/service/hnp/bin/llvm-readelf，故实测 = 10
assertion_count: 10
assertion_count_unconditional: 9
assertion_count_toolchain_gated: 1
