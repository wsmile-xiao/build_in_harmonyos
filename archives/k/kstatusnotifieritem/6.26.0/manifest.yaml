version: "6.26.0"
software: "kstatusnotifieritem"
status: built
build_date: "2026-09-20"
build_system: cmake

source:
  url: "https://download.kde.org/stable/frameworks/6.26/kstatusnotifieritem-6.26.0.tar.xz"
  sha256: "898914c94820f99889d879f33cabbb5fbe7b9f4e24a6a1d9a9b4439489bc3266"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE"
    - "WITHOUT_X11=ON"
    - "USE_DBUS=OFF"
    - "BUILD_PYTHON_BINDINGS=OFF"
    - "BUILD_TESTING=ON"
  dependencies:
    - qtbase/6.11.1
    - kwindowsystem/6.26.0
    - ecm/6.26.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-disable-po-qm-processing.patch"

knowledge_gained:
  - "kstatusnotifieritem 是 KDE Gear 应用(如 kteatime)的 StatusNotifierItem 硬依赖; ohpcd 制品仓此前未发布, 本配方补齐"
  - "USE_DBUS=OFF 时上游代码经 #if HAVE_DBUS 守卫全部安全跳过, 无需源码改动"
  - "上游 tests/kstatusnotifieritemtest 是交互式 QApplication demo(main 以 app.exec() 结束且未注册 add_test), 以 offscreen + timeout 启动稳定性检查代替直接运行"
