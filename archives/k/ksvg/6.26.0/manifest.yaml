# 版本级 manifest
# 文件位置: archives/k/ksvg/6.26.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.26.0"

# 软件名
software: "ksvg"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.kde.org/stable/frameworks/6.26/ksvg-6.26.0.tar.xz"

  # 源码校验和
  sha256: "f3a7412e227d13b1cafec91c1b58dd3f86980abefc08b2535b46bef362b4c07e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=ON"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKF_SKIP_PO_PROCESSING=ON"
    - "-DBUILD_TOOLS=OFF"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DCMAKE_INSTALL_QMLDIR=lib/qml"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - qtbase/6.11.1
    - qtdeclarative/6.11.1
    - qtsvg/6.11.1
    - kconfig/6.18.0
    - kcoreaddons/6.18.0
    - karchive/6.19.0
    - kcolorscheme/6.18.0
    - kguiaddons/6.18.0
    - kirigami/6.18.0
    - zlib/1.3.1.1
    - zstd/1.5.7
    - ecm/6.26.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-lower-kf-dep-version.patch"
  - "0002-ohos-framecontrast-backport.patch"
  - "0003-ohos-qml-kirigami-6.18-compat.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "qtdeclarative/6.11.1 已在 ohpcd 发布（含完整 Qt6Qml/Qt6Quick/Qt6QuickControls2 二进制），KDE QML 组件库不再需要一律禁用 QML 部分"
  - "kcolorscheme/6.18.0 导出配置锁 kconfig/6.18.0，与 kconfig/6.26.0 同图会版本冲突——KF6 链须统一 6.18.0"
  - "ecm_add_qml_module 的宿主工具（qmlcachegen 等）在 qtdeclarative 包 bin/+libexec/，PATH 前置即可（kirigami 先例）"
  - "QImage 软渲染路径 + QT_QPA_PLATFORM=offscreen 可在无头环境跑 SVG 渲染测试"
