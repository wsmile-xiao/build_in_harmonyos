# test_package/MANIFEST.yml
# Upstream and consumer test declaration for ksvg/6.26.0.
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: ksvg/6.26.0
homepage: https://invent.kde.org/frameworks/ksvg

# Upstream test commands (used for ctest -N analysis)
upstream_check_command: "ctest -N"

# Upstream tests are integrated in the Conan build (BUILD_TESTING=ON)
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

# Upstream tests actually registered in the current feature set
# (BUILD_TESTING=ON, BUILD_TOOLS=OFF, full QML feature set):
#   - autotests/CMakeLists.txt registers 3 ecm_add_test entries with the
#     plasmasvg- name prefix: plasmasvg-framesvgtest, plasmasvg-imagesettest,
#     plasmasvg-svgtest. They link Qt6::Qml + Qt6::Test + KF6::Svg +
#     KF6::Archive + KF6::CoreAddons + KF6::ConfigGui + KF6::ColorScheme and
#     render SVG themes through the QImage software path (QSvgRenderer via
#     QPainter), executed headless with QT_QPA_PLATFORM=offscreen.
#   - tests/*.qml are manual example files, not CTest targets.
# Upstream N (CTest add_test count, measured with ctest -N): 3.
upstream_tests:
  - name: "plasmasvg-framesvgtest"
    description: "FrameSvg margins/contentsRect/imageSet/resizeMask/loadQrc assertions"
  - name: "plasmasvg-imagesettest"
    description: "ImageSet theme selection/cache API assertions"
  - name: "plasmasvg-svgtest"
    description: "Svg size/elements/colors/stylesheet recoloring assertions"

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke: Svg validity/hasElement/size/resize/image(QImage render)/elementRect/status/colorSet/colorOverride + FrameSvg validity/resizeFrame/margins API assertions"
    command: "conan create (test_package builds and runs test_ksvg)"

# Test assertion count (approximate, for quality assessment)
assertion_count: 14
