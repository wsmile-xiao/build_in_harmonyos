# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: klustakwik/3.0.2
homepage: "https://sourceforge.net/projects/klustakwik/"

# ── 上游测试审计 ──
# 审计结论: klustakwik 3.0.2 (MaskedKlustaKwik) 上游没有任何自动化测试
# 审计依据:
#   1. 官方 tarball (sourceforge.net/projects/klustakwik, maskedKlustaKwik/
#      KlustaKwik-3.0.2.bz2) 解包后仅含 *.cpp/*.h、makefile、dan_changes.txt、
#      expected_output.txt、expected_output_2.txt、profile.txt、gmon.out，
#      不存在 tests/、test/ 等任何测试目录或测试源文件；
#   2. makefile 仅定义 all/clean/native/install 目标，无 check/test 目标；
#      make -n check 无对应规则；
#   3. expected_output*.txt 是作者在自备 dantest 数据上的参考运行日志，
#      tarball 内不含配套 .fet/.mask 输入数据，无法复现运行；
#   4. 该项目为单二进制科研聚类工具（spike sorting），上游无测试套件。
upstream_tests_exist: false
upstream_test_audit: "tarball 解包审计：无测试目录/测试源文件；makefile 无 check/test 目标（仅 all/clean/native/install）；expected_output*.txt 为作者参考日志且包内无配套 .fet 输入数据，不可复现；单二进制科研工具无测试套件"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_klustakwik.sh
    description: "验证 KlustaKwik 二进制存在且可执行"
    command: "./test_klustakwik.sh <bin> <data-dir> <work-dir>"
  - file: test_klustakwik.sh
    description: "验证二进制为 aarch64 ELF（HarmonyOS PC arm64 目标）"
    command: "./test_klustakwik.sh <bin> <data-dir> <work-dir>"
  - file: test_klustakwik.sh
    description: "在合成 4 特征数据（200 点、2 高斯簇）上实际运行聚类"
    command: "./test_klustakwik.sh <bin> <data-dir> <work-dir>"
  - file: test_klustakwik.sh
    description: "验证 .clu.1 输出形状（1 行簇数头 + 200 行标签）"
    command: "./test_klustakwik.sh <bin> <data-dir> <work-dir>"
  - file: test_klustakwik.sh
    description: "验证聚类质量：2 高斯数据恢复出恰好 2 个簇"
    command: "./test_klustakwik.sh <bin> <data-dir> <work-dir>"

# 测试断言总数
assertion_count: 5
