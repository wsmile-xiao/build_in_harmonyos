# 库级 manifest — kconfiglib
software: kconfiglib
display: "Kconfiglib Kconfig implementation"
description: "Zephyr 项目维护的纯 Python Kconfig 解析库，附带 menuconfig/olddefconfig 等配置工具"
category: python
homepage: "https://github.com/zephyrproject-rtos/Kconfiglib"
license: ISC
build_system: setuptools

ohos_adaptation:
  key_points:
    - "纯 Python 包，无 C 扩展，无需编译；适配 = wheel 布局 + PYTHONPATH 暴露"
    - "⚠ guiconfig 依赖 Tkinter，OHOS Python 无 _tkinter 模块（实测 ModuleNotFoundError），且 harmonybrew 无 tcl/tk，故 package() 阶段剔除该模块"
    - "源码取 GitHub tag 归档而非 PyPI sdist —— 后者不含 testsuite.py 与 tests/，无法满足 R51 上游测试要求"
    - "上游测试为自带 testsuite.py 自测套件（非 pytest），比对 tests/ 下 71 个 Kconfig 用例"
  common_dependencies:
    - python3

versions:
  "14.1.0":
    status: built
    build_date: "2026-09-28"
    conan_ref: "kconfiglib/14.1.0"
    note: "纯 Python 适配；guiconfig（Tkinter）在 OHOS 不可用，其余 13 个模块与 CLI 工具均可用"
