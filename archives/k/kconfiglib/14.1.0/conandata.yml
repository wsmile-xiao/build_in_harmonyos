#   与 tests/ 下 71 个 Kconfig 用例文件。
#
# 源码 URL 只用官方 GitHub tag 归档（与已合入的 liblqr 0.4.3 同款端点）。
# 此前用于兜底的第三方 GitHub 代理镜像既在 R39/PF7 的镜像黑名单内，CI worker
# 也无法访问，正是 conan-build-test 阶段源码下载超时的根因，故整体移除。
# 官方端点直连可用（本机实测 5.3s 下完 182990 字节），sha256 与镜像分发字节一致。
#
# sha256 由本机下载官方归档后 sha256sum 计算。

