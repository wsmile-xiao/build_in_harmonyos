# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kconfiglib/14.1.0
homepage: "https://github.com/zephyrproject-rtos/Kconfiglib"

# 上游测试命令 —— 上游自带脚本式自测套件（非 pytest）
#   1) testsuite.py run_selftests()：纯 Kconfiglib 自测（词法 / 依赖求解 / 选择语义 /
#      依赖环检测 / 预处理器 / .config 读写等），无需外部依赖
#   2) testsuite.py run_compatibility_tests()：与 Linux 内核 C 实现逐项比对，
#      硬依赖内核源码树 + gcc（testsuite.py:2739-2746）→ OHOS 平台不适用
upstream_check_command: "python3 -c \"import testsuite; testsuite.run_selftests()\""

# conanfile.py build() 中是否集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 _run_selftests.py（装配 Kconfiglib/ 目录副本后 import testsuite 执行 run_selftests()，成功打印 UPSTREAM_SELFTESTS_OK）"

# 上游实际运行的测试（2026-10-09 真机实测记录，设备 HAD-W32 / OHOS aarch64）：
#   - run_selftests() 全节通过，尾行输出 UPSTREAM_SELFTESTS_OK，无 skip / xfail
#   - run_compatibility_tests() 平台不适用（无内核源码树、无 gcc），非跳过不跑
upstream_tests:
  - file: testsuite.py
    source: Kconfiglib-14.1.0/testsuite.py（GitHub tag 归档 v14.1.0）
    description: "上游自测套件 3204 行：run_selftests() 覆盖词法、escape()/unescape()、_ordered_unique()、表达式求值、用户自定义预处理器函数、KCONFIG_WARN_UNDEF 等；tests/ 下 60 个 Kconfig 用例由 run_selftests() 一并解析校验"
    command: "python3 -c \"import testsuite; testsuite.run_selftests()\"（真机全部通过，UPSTREAM_SELFTESTS_OK）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_kconfiglib.py
    description: >-
      消费者测试：真实 API（R34）—— VERSION 断言 (14,1,0)；Kconfig / MenuNode /
      KconfigSyntaxError 等公开符号存在；解析 Kconfig 与 .config 读写闭环；
      依赖语义（关闭 FOO 后 BAR 值变空）；7 个 CLI 模块可导入且
      olddefconfig.main() 实际执行；guiconfig 已按平台剔除（OHOS 无 _tkinter）。
    command: "python3 test_kconfiglib.py <site-packages-dir>（真机 29 passed）"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 29
