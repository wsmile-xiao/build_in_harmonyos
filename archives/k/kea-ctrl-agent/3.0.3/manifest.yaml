# 版本级 manifest — kea-ctrl-agent 3.0.3
# 文件位置: archives/k/kea-ctrl-agent/3.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.3"
software: "kea-ctrl-agent"

# 编译状态: published | built | failed | archived
status: published

build_date: "2026-10-04"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

# ============================================================
# 产物（可执行工具形态：bin/ + 运行库闭包 lib/）
# ============================================================

artifacts:
  - "bin/kea-ctrl-agent"
  - "lib/libkea-*.so* (Kea 运行时库全集 20 库 40 文件：soname 名 + 全版本名；代理递归 NEEDED 闭包实测 16 库，家族 bootp/ha 同口径)"

# ============================================================
# 上游测试（build() 内真实执行）
# ============================================================

upstream_tests:
  command: "meson test -v -C <builddir> kea-agent-tests；meson test -v --wrapper sh -C <builddir> ca_process_tests.sh"
  suites_run: 2
  # 源码 TEST/TEST_F 宏计数：kea-agent-tests 98 + ca_process_tests.sh 7 = 105
  cases_in_source: 105
  root_cases: 0
  root_cases_detail: "无：全部用例以普通应用身份在沙箱内实跑（零 root）；跳过仅 9 个平台性跳过（探针判定，见 cases_skipped_detail），另 2 例上游 DISABLED_ 不执行"
  # 真机实测（2026-10-04 真机全量跑，八门禁全 PASS，见版本级 notes.md）：
  # kea-agent-tests 96 ran: 87 passed / 9 skipped（平台探针）/ 0 failed（另 2 例上游 DISABLED_ 不执行）
  # ca_process_tests.sh 7/7 通过
  cases_run: 103
  cases_passed: 94
  cases_failed: 0
  cases_skipped: 9
  cases_skipped_detail: "9 个命令转发用例（CtrlAgentCommandMgrTest 的 unix 控制通道组，patch 0006）：鸿蒙 hmdfs 存储拒绝 AF_UNIX 路径名 bind()（EPERM），平台不支持；上游用例的校验点、逻辑与注册数零改动，常规 Linux 探针恒真不触发"
  cases_unregistered: 0
  cases_unregistered_reason: "无：98 + 7 个用例全部注册（2 例 DISABLED_ 为上游源码自带前缀，gtest 不执行，计入未执行而非跳过）"

# ============================================================
# 鸿蒙特有测试（test_package，2 个用例）
# （test_package 另含 1 个通用消费者契约测试 test_kea_ctrl_agent.py，与兄弟 kea
#  配方相同，不属鸿蒙特有；声明见 test_package/MANIFEST.yml 的 test_package_tests）
# ============================================================

ohos_specific_tests:
  count: 2
  entries:
    - "test_package/test_ohos_platform.c → test_ohos_platform（平台 ABI）"
    - "test_package/test_ohos_runtime.c → test_ohos_runtime（运行时闭包）"
  command: "./test_ohos_platform <bin>/kea-ctrl-agent && ./test_ohos_runtime <bin>/kea-ctrl-agent"
  checks:
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "e_type == ET_DYN（PIE 可执行文件，OHOS 要求）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so）"
    - "DT_NEEDED 的每个 Kea 库（libkea-*.so）均在包内 lib/ 落盘"
    - "包内 Kea 运行时库（lib/libkea-*.so*）在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 成功"
    - "真实执行包内 kea-ctrl-agent -v 成功且输出 3.0.3（完整 NEEDED 闭包在 OHOS 运行时可解析）"
  # 真机实测（2026-10-04，鸿蒙特有 2/2 全绿；消费者契约 test_kea_ctrl_agent 见版本级 notes.md）
  cases_run: 2
  cases_passed: 2
  cases_failed: 0

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson.build.patch"
  - "0002-src-lib-dhcp-iface_mgr_linux.cc.patch"
  - "0003-meson.build.patch"
  - "0004-src-lib-process-cfgrpt-meson.build.patch"
  - "0005-src-lib-testutils-sandbox.h.patch"
  - "0006-src-bin-agent-tests-ca_command_mgr_unittests-skip-unix-channel.patch"
  - "0007-src-bin-agent-tests-ca_command_mgr_unittests-socket-path-tmpdir-fallback.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Meson 报告 OHOS 为 system='harmonyos'，Kea 的 build_machine.system() 白名单不含它：需在顶层归一化为 linux 才会选中 Linux 源码分支（同一上游树全部 kea 组件共用，补丁 0001）"
  - "OHOS sysroot 的 linux/socket.h（bionic 派生）定义 struct sockaddr_storage，与 musl sys/socket.h 冲突：用 define-guard 重命名内核侧定义（__linux__ && !__GLIBC__ 守卫，补丁 0002；kea-ctrl-agent 构建全树，libdhcp 的 iface_mgr_linux.cc 同样编译到）"
  - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core sp_thread_sleep.hpp 依赖它：定义 BOOST_SP_NO_PTHREAD_SETCANCELSTATE（boost 官方逃生宏）"
  - "OHOS 上 CPython subprocess 走 posix_spawn，不按 PATH 解析可执行名：裸名 'llvm-ar'（来自宿主 AR 环境变量）执行报 ENOENT——须在 machine file 注入绝对路径"
  - "Conan MesonToolchain 默认只设 pkg_config_path=generators_folder，需同时使用 PkgConfigDeps 生成依赖 .pc，meson 才能解析 boost/log4cplus/openssl/gtest"
  - "Meson 的 cpp.run() 特性探针在 native 构建下会真实执行，host 共享依赖（log4cplus）必须通过 LD_LIBRARY_PATH 在配置期可见"
  - "制品仓 boost/1.85.0 无 libboost_system，需 meson >= 1.10 的 header-only 模块回退；meson 版本必须 >= 1.10"
  - "OHOS 内核拒绝 shebang 脚本 execve（与可执行位无关）：conan 的 meson 包 bin/meson 是 shell 包装脚本，必须 sh '<meson 包>/bin/meson' 调用（Error 126 实测）；meson 的 --wrapper sh 可把脚本型测试命令包给 sh 执行（ca_process_tests.sh 实测通过）"
  - "Kea configure 期直接执行自带脚本：scripts/env.sh、scripts/grabber.py（补丁 0003）与生成的 config-report.sh、tools/mk_cfgrpt.sh（补丁 0003 hunk2 + 0004）——把脚本变量/命令重定义为解释器前缀数组，调用点零改动"
  - "OHOS /storage 沙箱拒绝创建符号链接（ln -s → EPERM）：meson 以 version: 'N.M.K' 构建共享库时只以符号链接发布 soname 名，加载器按 NEEDED 名查找全部落空。build() 在 compile 后以复制方式物化 soname 名（_materialize_sonames，幂等），meson test 与 package() 遍历都能吃到"
  - "真机曾出现 package 产物落盘为 0 字节的瞬时问题（/storage 写回异常）：package() 收尾增加空产物复核，0 字节的产物从构建树重拷（自愈 + WARNING 日志；有界重试 3 次仍为 0 则打包直接失败），test_package 的运行时闭包测试（包内 Kea 库逐个 dlopen + 真实执行 -v）兜底拦截回归"
  - "OHOS app 沙箱限制并发进程数：ninja 默认按 20 核并发（~45 个活动 spawn）会触发 posix_spawn EAGAIN 中断编译——meson compile 须限并发 -j 8"
  - "可执行工具形态（对照 hook .so 形态）：kea-ctrl-agent 上游安装到 SBINDIR，Conan 包按约定落 bin/；运行期的 Kea 库全集（20 库 40 文件——Kea 累积链接 LIBS_BUILT_SO_FAR 使闭包深于二进制直接 DT_NEEDED：直接 9 库、递归 16 库，家族 bootp/ha 同口径）随包落 lib/（package_info.libdirs 保留，bindirs=bin），test_package 以真实控制通道端到端（回环端口启动真实进程，HTTP POST config-get 校验 HTTP 200 + result 0）证明闭包在 OHOS 加载器下可服务——比单跑 -v 更强的运行时证据"
  - "家族复用取证：kea-ctrl-agent 与已合入的 kea-hook-limits/kea-hook-ping-check/kea-hook-flex-option/kea-hook-bootp/kea-hook-ha/kea-perfdhcp 同属 Kea 3.0.3 单源码树（src/bin/agent 平级目录），0001-0004 补丁整组逐字节复用（0001/0002 与 limits 一致、0003/0004 与 ping-check 一致）；Control Agent 无 DHCP 接口管理路径、不构造 IfaceMgr，dhcp6 的沙箱 netlink 回退补丁不存在触发场景；本组件测试期另新增 3 个补丁（0005-0007，见对应条目）"
  - "上游 DISABLED_ 用例惯例：kea-agent-tests 的 DISABLED_configParseEmpty / DISABLED_connectionTimeout 为上游源码自带前缀（gtest 统计为 2 例不执行），适配类配方计数口径=执行 96 + shell 7 = 103，源码宏计 105，须在 MANIFEST.yml/manifest.yaml 中区分「未执行」与「跳过」"
  - "共享测试辅助 isc::test::Sandbox 以 P_tmpdir 拼 mkdtemp 模板：OHOS app 沙箱 /tmp 只读时 mkdtemp 返回 NULL，std::string 空指针赋值令 gtest 二进制整体 SIGSEGV——测试工具临时目录须优先 TMPDIR（补丁 0005，与 kea-dhcp6 配方对同一共享文件的移植逐字节一致 md5 a0a1ef2f）"
  - "鸿蒙 hmdfs 用户存储拒绝 AF_UNIX 路径名 socket bind()（EPERM，真机全盘探针：仅抽象命名空间可用）：命令转发用例以「与测试服务器同路径、同原语」的 bind 探针判定后 GTEST_SKIP（补丁 0006，本包 9 例）；问题类在库草稿 DRAFT-ohos-agent-socket-tmpdir-only-bindable-path（AF_UNIX 路径名 bind 挂载点白名单实测：普通存储 EPERM、抽象命名空间全可用、仅 user storage base 可 bind）"
  - "AF_UNIX socket 路径必须过 sockaddr_un::sun_path 长度门（108 字节含 NUL）：深 out-of-tree 构建目录（如共享包缓存）令测试夹具拼接出的 socket 路径超限，connect() 对任何超限路径一律抛 ENAMETOOLONG（与文件系统无关）——测试夹具应在拼接超限时回退短的可写目录（TMPDIR，未设时行为不变）（补丁 0007，本包新增；同类在库草稿 DRAFT-10004-qtwayland-qt-tests-deep-path-socket-tmpdir-qpa 覆盖 conan 深缓存构建路径超限的短 TMPDIR 回退）"
  - "Kea 对文件 logger 的输出路径做白名单校验（白名单目录取环境变量 KEA_LOG_FILE_DIR，默认 /var/log/kea；OHOS 上 /var/log 不存在）：给 Kea 进程配置绝对日志文件路径时须导出 KEA_LOG_FILE_DIR 指向可写目录——上游 ca_process_tests.sh.in / dhcp4_process_tests.sh.in / d2_process_tests.sh.in 等全部进程测试即此做法（消费者 e2e 用例同款处置）"

