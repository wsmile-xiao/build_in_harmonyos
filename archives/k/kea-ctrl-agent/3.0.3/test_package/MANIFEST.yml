# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-ctrl-agent/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：src/bin/agent/tests/meson.build 注册 2 个 test()
# （'kea-agent-tests' protocol: 'gtest' 与 'ca_process_tests.sh' suite: 'shell-tests'，
#  门禁 -D tests=enabled），本包 build() 内真实执行；shell 套件因 HarmonyOS PC
#  内核对脚本 execve 的限制以 meson --wrapper sh 包装执行（家族配方口径一致）
upstream_check_command: "meson test -C <builddir> --list"
upstream_test_in_build: true
upstream_test_command: >-
  meson test -v -C <builddir> kea-agent-tests；meson test -v --wrapper sh
  -C <builddir> ca_process_tests.sh

# 上游实际运行的测试程序（源码 TEST/TEST_F 宏计数：98 + 7 = 105；
# 其中 gtest 2 例为上游源码自带 DISABLED_ 前缀，gtest 不执行）
upstream_tests:
  - file: kea-agent-tests
    source: src/bin/agent/tests/
    description: >-
      Control Agent 单元测试（单个 gtest 可执行文件，源码 98 例：ca_cfg_mgr 20、
      ca_command_mgr 15、ca_controller 22、ca_process 2、
      ca_response_creator_factory 1、ca_response_creator 14、get_config 1、
      parser 23；其中 DISABLED_configParseEmpty 与 DISABLED_connectionTimeout
      为上游自带 DISABLED_ 用例）。覆盖 Control Agent 配置解析
      （http-host/http-port、auth、loggers、hooks-libraries）、命令管理器转发与
      应答构造、控制通道 HTTP 会话的响应工厂、原生命令（config-get 等）处理、
      进程管理接口与 parser 生成器。其中 ca_command_mgr 的 9 个命令转发用例
      因鸿蒙 hmdfs 存储拒绝 AF_UNIX 路径名 bind()（EPERM）按 patch 0006 的
      同型探针判定后 GTEST_SKIP（常规 Linux 探针恒真不触发）
    command: "./kea-agent-tests"
  - file: ca_process_tests.sh
    source: src/bin/agent/tests/
    description: >-
      进程级 shell 套件（7 个具名用例：kea-ctrl-agent.server_pid_file_test、
      ctrl-agent.sigterm_test、ctrl-agent.sigint_test、
      ctrl-agent.syntax_check_success、ctrl-agent.syntax_check_bad_syntax、
      ctrl-agent.syntax_check_bad_values、ctrl-agent.password_redact_test）：
      以真实二进制驱动，校验 pid 文件二次启动拒绝、SIGTERM/SIGINT 优雅退出、
      -t 配置检查的成功/语法错误/取值越界三态、日志口令脱敏
      （sensitive 隐藏 / superadmin 可见）
    command: "sh ca_process_tests.sh"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_kea_ctrl_agent.py
    description: >-
      以 conanrun 环境运行包内 kea-ctrl-agent：版本输出（-v/-V）、-W 配置报告、
      无参数 usage 错误路径、-t 对合法配置的接受与对语法错误/越界端口的拒绝，
      以及一次真实控制通道端到端（在回环端口启动真实进程，POST config-get 校验
      HTTP 200 + result 0 + 返回运行中的 http-port，POST 不支持命令校验非零
      result——应答为 Kea 单元素 JSON 数组形制，解包后判定——并以
      KEA_LOG_FILE_DIR 导出验证配置日志落盘，SIGTERM 优雅停止），共 7 项用例
    command: "python3 test_kea_ctrl_agent.py"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 bin/kea-ctrl-agent 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64 / ET_DYN PIE、DT_NEEDED 链接 musl libc.so 且非
      glibc libc.so.6、链接 libc++_shared.so），共 8 项检查
    command: "./test_ohos_platform <package>/bin/kea-ctrl-agent"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：校验包内 DT_NEEDED 的 Kea 库全部随包分发，
      在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 包内 libkea-*.so* 全部成功，
      并真实执行包内 kea-ctrl-agent（-v 输出 3.0.3），证明真实进程的完整 NEEDED
      闭包在 OHOS 运行时可解析，共 6 项检查（另有逐库 dlopen 结果行）
    command: "./test_ohos_runtime <package>/bin/kea-ctrl-agent"
    ohos_specific: true

# 鸿蒙特有测试用例统计（test_package 内，实测结果见版本级 notes.md）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <agent> && ./test_ohos_runtime <agent>"

# 用例总数：上游源码宏 98 + 7 = 105（gtest 2 例为上游 DISABLED_ 不执行）；
# 实测执行 96 + 7 = 103 例：94 例通过（87 gtest + 7 shell）+ 9 例按平台
# 探针判定 GTEST_SKIP（hmdfs 拒绝 AF_UNIX 路径名 bind，patch 0006）
upstream_case_count: 103
upstream_passed_case_count: 94
upstream_skipped_case_count: 9
upstream_disabled_case_count: 2
test_package_assertion_count: 21
assertion_count: 124
