software: kea-ctrl-agent
display: "ISC Kea Control Agent"
description: "RESTful control-channel front end shipped with the ISC Kea servers (kea-ctrl-agent)"
category: network
homepage: "https://www.isc.org/kea/"
license: MPL-2.0
build_system: meson

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Meson 在 OHOS 上报告 system='harmonyos'，Kea 的平台白名单不含它：需归一化为 linux 才能选中 Linux 源码分支"
    - "OHOS sysroot 的 linux/socket.h 与 musl sys/socket.h 都定义 struct sockaddr_storage，包含 netlink 头时需 define-guard"
    - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core 需 BOOST_SP_NO_PTHREAD_SETCANCELSTATE"
    - "OHOS 内核拒绝 shebang 脚本 execve：conan meson 包装脚本经 sh 调用；configure 期脚本（env.sh/grabber.py/config-report.sh/mk_cfgrpt.sh）经解释器前缀调用"
    - "meson 对 clang 默认用裸名 llvm-ar 探测归档器，本环境/CI 上失败：需从 tools.build:compiler_executables 推导绝对路径写入 machine file"
    - "配置期 cpp.run() 探针要求 host 共享依赖在 LD_LIBRARY_PATH 可见（log4cplus shared=True）"
    - "boost 必须固定 1.85.0（1.90/1.91 制品仓包缺 Kea 实际使用的头文件），且 meson 需 >= 1.10"
    - "OHOS /storage 沙箱拒绝创建符号链接：meson 的 soname 符号链接须在 build() 内以复制方式物化（_materialize_sonames）"
    - "OHOS app 沙箱 /tmp 只读：共享测试辅助 isc::test::Sandbox 的 mkdtemp(P_tmpdir) 返回 NULL 致 gtest 崩溃，测试沙箱临时目录模板须优先 TMPDIR（补丁 0005）"
    - "鸿蒙 hmdfs 用户存储拒绝 AF_UNIX 路径名 bind()（EPERM）：命令转发测试以同型探针判定后 GTEST_SKIP（本包 9 例，补丁 0006）"
    - "AF_UNIX socket 路径受 sockaddr_un::sun_path 108 字节上限约束：深 out-of-tree 构建目录（共享包缓存）令测试 socket 路径超限、connect() 抛 ENAMETOOLONG，测试夹具须在拼接超限时回退 TMPDIR（补丁 0007，跨平台通用）"
    - "ninja 默认并行度在 OHOS 沙箱触发 posix_spawn EAGAIN：meson compile 须限并发 -j 8"
    - "kea-ctrl-agent 的产物是可执行文件：包内按 bin/ 落盘并提供 commands.json（R38）"
    - "Kea 对配置文件 logger 的输出路径做白名单校验（白名单目录 = 环境变量 KEA_LOG_FILE_DIR，默认 /var/log/kea；OHOS 上 /var/log 不存在）：给 Kea 进程配置文件 logger 时须导出 KEA_LOG_FILE_DIR 指向可写目录（上游各进程测试 .sh.in 同款做法）"
  common_dependencies:
    - boost
    - log4cplus
    - openssl

# 版本索引（所有已归档版本，含状态）
versions:
  "3.0.3":
    status: published
    build_date: "2026-10-04"
    conan_ref: "kea-ctrl-agent/3.0.3"
    device_verify: "八门禁（G0-G4 + L2/L4/L5）全 PASS，Verdict: PASS（2026-10-04）；上游实跑 94/103 通过（9 例平台探针 SKIP，另 2 例上游 DISABLED_ 不执行）+ test_package 3/3 + 闭包 40/40 dlopen（运行时全集 20 库）"
