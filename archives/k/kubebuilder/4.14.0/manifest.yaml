software: kubebuilder
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.14.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.14.0"

# 编译状态
# published | built | failed | archived
status: published
build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/kubernetes-sigs/kubebuilder/archive/refs/tags/v4.14.0.tar.gz"

  # 源码校验和
  sha256: "36a659663a294bac86af81ff1fc60ff930a325ac0eccad8180891059f5e3c772"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "go build -v -o kubebuilder ."
    - "GOPROXY=https://goproxy.cn,direct"
    - "GOTOOLCHAIN=go1.25.11"
    - "GOROOT=/data/storage/el2/base/cache/go1.25.11-install/go"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.25.11

  # 编译器
  cc: go
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
