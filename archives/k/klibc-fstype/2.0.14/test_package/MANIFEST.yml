# test_package/MANIFEST.yml
# Upstream test declaration for the packaged klibc fstype utility.

package: klibc-fstype/2.0.14
homepage: "https://www.kernel.org/pub/linux/libs/klibc/"

# The fstype component has no upstream make check / ctest target or TEST_* self-test.
upstream_check_command: "None: usr/kinit/fstype has no upstream test target or test cases"
upstream_test_in_build: false
upstream_test_command: "Not applicable: upstream fstype component provides no tests"
upstream_tests: []

test_package_tests:
  - file: test_fstype.sh
    description: "Four consumer assertions: detect gzip magic from a path and stdin, report an unknown image and size, and reject excess arguments."
    command: "sh test_fstype.sh <package_bindir>/fstype"

assertion_count: 4
