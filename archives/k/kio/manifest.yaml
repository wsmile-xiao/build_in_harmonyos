software: kio
display: "KIO"
description: "KDE Frameworks 6 input/output and networking layer (libKF6KIOCore + kioworker + file/remote/trash workers)"
category: library
homepage: "https://invent.kde.org/frameworks/kio"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KIOCORE_ONLY=ON baseline: KIOGui/KIOWidgets/KIOFileWidgets and ftp/http workers excluded (KF6 6.26 deps not on ohpcd; Qt6Network built without SSL)"
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "USE_DBUS=OFF / WITH_X11=OFF / WITH_WAYLAND=OFF / BUILD_DESIGNERPLUGIN=OFF"
    - "E132: libxml2/2.15.3 lib dir injected into LD_LIBRARY_PATH for the OHOS SDK lld (libxml2.so.16 SONAME)"
    - "CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG set manually (no CMake Platform/HarmonyOS module)"
    - "6.14.0 full-stack build: KIOCore/KIOGui/KIOWidgets/KIOFileWidgets + file worker (KF6 6.14 GUI deps are on ohpcd); SSL-dependent surface trimmed by patches (qtbase Qt6Network without SSL)"
    - "6.14.0 patch 0015: link-time -Wl,-soname for the four KIO libraries (no DT_SONAME otherwise; post-build ELF rewriting denied: in-place rewrite invalidates .codesign signatures)"
    - "6.14.0 patch 0016: KProcessRunner self-deletes on QProcess::FailedToStart (exec failures never emit finished(), which leaked the instance and its KProcess)"
    - "6.14.0 patch 0017: KShortUriFilter no longer appends a second :// when the default scheme already carries one (prevents malformed https:////host URIs)"

versions:
  - version: "6.26.0"
    status: built
    date: 2026-09-11
  - version: "6.14.0"
    status: built
    date: 2026-09-15
    binary: false
    note: "not yet published to the artifact repo; released after merge"
