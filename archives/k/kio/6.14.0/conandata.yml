      patch_description: "Add -Wl,-soname link options to the four KIO libraries: the OHOS CMake platform does not honor VERSION/SOVERSION, so libraries carry no DT_SONAME and linkers record build-tree relative DT_NEEDED for intra-project dependencies; an explicit soname makes dependents record bare filenames and gives the libraries a DT_SONAME"
