    - patch_file: "patches/0016-src-gui-kprocessrunner.cpp.patch"
      patch_description: "KProcessRunner self-deletes on QProcess::FailedToStart: exec() failures never emit finished(), so slotProcessExited() never runs and the instance (plus its KProcess) leaks; report the error via the same deferred path used for exit code 127 and schedule deletion"
      patch_type: "portability"
    - patch_file: "patches/0017-src-urifilters-shorturi-kshorturifilter.cpp.patch"
      patch_description: "KShortUriFilter: do not append a second :// when the default URL scheme already contains the authority separator, even if the ksycoca protocol registry has no entry for it; prevents malformed URIs like https:////host on systems without indexed protocol metadata"
      patch_type: "portability"
