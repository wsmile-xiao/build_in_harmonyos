# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kio/6.14.0.

package: kio/6.14.0
homepage: https://invent.kde.org/frameworks/kio

# Upstream test surface (autotests/ = 74 .cpp, 12 ecm_add_test(s) blocks,
# tests/ = manual GUI executables). This build sets BUILD_TESTING=OFF: the
# upstream suite requires a desktop session (DBus session bus for
# KSycoca/KApplicationTrader tests, systemd scopes for the KProcessRunner
# family), the ftp/webdav integration tests need Ruby ftpd + wsgidav daemons
# (USE_FTPD_WSGIDAV_UNITTEST, guarded to CMAKE_SYSTEM_NAME=Linux), and the
# autotests/http/ executables exercise the http KIO worker which is not built
# (SSL-trimmed qtbase). NOT_RUN in this build; feasibility assessment and
# evidence are in the run report / notes.md.
upstream_check_command: "ctest (BUILD_TESTING=ON)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: autotests/
    source: kio-6.14.0/autotests/
    description: "KIO upstream CTest suite (kiocore-*/kiogui-*/kiowidgets-*/kiofilewidgets-* via 12 ecm_add_test(s) blocks + 12 KProcessRunner add_test entries)"
    command: "not executed: needs DBus session bus, systemd scopes, KSycoca desktop services; ftp/webdav rows need Ruby ftpd/wsgidav daemons absent from CI"
    condition: "BUILD_TESTING=OFF in this build (headless OHOS CI has no desktop session)"
  - file: autotests/http/
    source: kio-6.14.0/autotests/http/
    description: "17 http worker integration executables (gettest/headtest/puttest/...)"
    command: "not executed: http worker is not built (SSL-trimmed qtbase, patch 0013)"
    condition: "upstream registers no add_test for these; they are build-only even upstream"
  - file: tests/
    source: kio-6.14.0/tests/
    description: "Manual GUI test executables (kfilewidgettest_gui, kdirlistertest_gui, ...)"
    command: "not executed: HAVE_QTDBUS is false (USE_DBUS=OFF) so upstream builds none of them"
    condition: "manual helper executables, no upstream add_test"

# test_package consumer test (always executed by conan create)
test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke links KF6::KIOCore via kio's own KF6KIOConfig.cmake and roundtrips KIO::UDSEntry fields + queries KProtocolInfo."
    command: "conan create (test_package builds and runs test_kio)"

assertion_count: 2
