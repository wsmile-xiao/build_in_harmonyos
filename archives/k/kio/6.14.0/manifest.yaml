knowledge_gained:
  - "OHOS reports CMAKE_SYSTEM_NAME=OHOS, so CMake UNIX is false: KIO's UNIX gates (KF6Auth find_package, kioglobal_p_unix.cpp, file worker Qt6::Network+KF6::AuthCore link) must be rewritten to NOT WIN32 / NOT ANDROID style guards or the Unix-like code paths silently drop out."
  - "The published kauth/6.14.0 package installs lowercase case-sensitive headers (kauth/action.h); upstream KIO includes <KAuth/Action> camelCase wrappers which do not exist on a case-sensitive filesystem."
  - "The published qtbase Qt6Network is built without SSL, so KIO's KSSL surface (ksslcertificatemanager, ksslerroruidata, ksslcertificatebox, ksslinfodialog, sslui) and the ftp/http workers must be trimmed by patch; showSslDetails degrades to a no-op."
  - "qtbase/6.11.1 FEATURE_dbus=OFF makes Qt6DBus unconsumable (E323), so USE_DBUS=OFF and upstream HAVE_QTDBUS guards exclude kiod/kssld and DBus KIOCore sources."
  - "KIO 6.14 uses C++20 std::ranges in kfilewidgettest-era sources (kfilefiltercombo.cpp/systemdprocessrunner.cpp); the ohos-aarch64 profile pins cppstd=17, so value-identical C++17 iterator rewrites are used (karchive 6.26.0 precedent)."
  - "OHOS CMake platform does not honor VERSION/SOVERSION (upstream ecm_setup_version(SOVERSION 6) is ignored), so KF6 libs carry no DT_SONAME and linkers record path-form DT_NEEDED (absolute conan-cache paths for external deps, build-tree relative for intra-project deps); patch 0015 adds -Wl,-soname link options so the four KIO libs get a DT_SONAME and intra-project NEEDED entries become resolvable bare filenames."
  - "In-place post-build ELF rewriting breaks the .codesign signature and the device refuses dlopen with Permission denied (E517/E077 face); a discriminating experiment (2026-09-13 path-update round) proved the security.isolate/hmdfs.perm/selinux xattr labels are NOT the deciding factor: rewritten, untouched and re-signed copies carry identical labels, only the E077 re-signed copy loads, and a remove-section-without-resign negative control stays denied. DT_NEEDED/SONAME repair must happen at link time (patch 0015); if a post-build rewrite is ever unavoidable it must follow the E077 remove-section -> rewrite -> re-sign -> chmod flow. The seed recipe patchelf post-process step was removed (it was also a worker-dependent silent no-op when readelf is absent from CI PATH)."
  - "OHOS lld needs libxml2.so.16 at link time; libxml2/2.15.3 lib dir is injected into LD_LIBRARY_PATH for build and run."

