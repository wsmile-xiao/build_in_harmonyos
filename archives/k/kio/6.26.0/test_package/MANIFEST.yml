# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kio/6.26.0.
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kio/6.26.0
homepage: https://invent.kde.org/frameworks/kio

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

# 上游实际运行的测试（KIOCORE_ONLY 基线下注册的 kiocore-* 套件）
upstream_tests:
  - file: autotests/
    source: kio-6.26.0/autotests/
    description: "KIOCore upstream CTest/autotests suite: 22 registered targets (21 kiocore-* from autotests/CMakeLists.txt + kioworkers-testtrash). 19 executed inside conan create (kiocore-jobremotetest, kiocore-jobtest, kioworkers-testtrash excluded via ctest -E: kioworker subprocess spawn blocks forever in the OHOS sandbox procmgr_wait / read-only /tmp / no mount points); http/ftp SSL tests and KIOWidgets/KIOFileWidgets suites excluded by the KIOCORE_ONLY OHOS baseline"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E '^(kiocore-jobremotetest|kiocore-jobtest|kioworkers-testtrash)$'"
    condition: "run in the Conan build with BUILD_TESTING=ON and KIOCORE_ONLY=ON"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke: KFileItem construction, KIO::convertSize, KFileFilter value-style construction round-trip (6.26.0 API), KIO::iconNameForUrl (pure KIOCore APIs, no worker subprocess)."
    command: "conan create (test_package builds and runs test_kio)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
