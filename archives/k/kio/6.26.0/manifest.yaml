knowledge_gained:
  - "KIOCORE_ONLY baseline carries over unchanged from 6.18.0: solid/kbookmarks/kcolorscheme/kjobwidgets/kiconthemes 6.26 are still unpublished on ohpcd, so only KF6KIOCore + kioworker + file/remote/trash workers are built."
  - "qtbase 6.11 QString/QStringView QCOMPARE strictification: QCOMPARE(QString, HelperWithStringViewMembers) fails template instantiation before member overloads are considered; the fix needs BOTH member overloads (QString/QLatin1String) AND a free operator==(const QString&, const Helper&) for the reversed-operand qCompare instantiation (patch 0006)."
  - "kioworker-spawning autotests (jobremotetest/jobtest) hang forever in the OHOS sandbox: the spawned worker blocks in procmgr_wait with no usable process supervisor. They must be excluded via ctest -E (baloo/kdbusaddons environment-limitation precedent)."
  - "6.26.0 upstream replaced KFileFilter setName/addMimeType setters with value-style construction (label, filePatterns, mimePatterns ctor + fromMimeType/fromMimeTypes factories); consumers must migrate (test_package r7/r8 iterations)."
  - "KFileFilter with BOTH mime and file patterns cannot be converted to a filter string by design (upstream warning 'KFileFilters with both mime and file patterns cannot be converted to filter strings'); test assertions must use pattern-only or mime-only filters."
  - "E132 LD_LIBRARY_PATH for libxml2.so.16 (SONAME of libxml2/2.15.3) is required by the OHOS SDK lld at link time; declare libxml2 as a requirement and inject its lib dir into buildenv/runenv (kservice/kcompletion 6.26 precedent)."
