  upstream: "executed 19 of 22 registered upstream CTest tests inside conan create (BUILD_TESTING=ON); 14 tests fully passing; subcase totals 191 passed / 34 failed / 5 skipped out of 225 executed subcases (84.9%). Excluded 3 OHOS-sandbox-incompatible tests via ctest -E: kiocore-jobremotetest + kiocore-jobtest (kioworker subprocess spawn blocks forever in procmgr_wait; jobtest additionally needs writable /tmp), kioworkers-testtrash (KMountPoint sees no mountpoints in the sandbox). 34 failing subcases individually qualified in notes.md (sandbox root-like permission semantics, missing shared-mime-info database, no external network, http/ftp workers disabled by design, HMDFS QLockFile limitation)."
