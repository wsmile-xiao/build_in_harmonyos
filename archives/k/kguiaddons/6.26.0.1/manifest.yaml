knowledge_gained:
  - "kguiaddons 6.26.0.1（本版实际增量）：相对已发布 6.26.0 的唯一改动是在 CMakeToolchain 注入 CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG / _C_FLAG = -Wl,-soname,。OHOS 原生构建不加载 CMake 的 Platform/HarmonyOS 模块（不存在），CMake 不会自动附加 -soname，VERSION/SOVERSION 不生效 → 产物无 DT_SONAME，消费者会把构建机绝对路径写进 DT_NEEDED，在干净缓存/CI worker 上加载失败。"
  - "验证证据：readelf -d 显示 SONAME = libKF6GuiAddons.so.6；上游 CTest 8/8 通过；消费者 test_package 1/1 通过；包 id 57ffd8c720a5bfee7e8827990cd6550a49181c1b。"
  - "kguiaddons 6.26.0（基线，零补丁）：KF_IGNORE_PLATFORM_CHECK=TRUE + WITH_WAYLAND/WITH_X11/USE_DBUS/BUILD_GEO_SCHEME_HANDLER/BUILD_PYTHON_BINDINGS 全 OFF 即可通过，是纯 Qt6::Gui 核心库型 KDE Frameworks 的最简模板。"
  - "test_package 消费者二进制运行必须 self.run(..., env='conanrun')，否则 Error loading shared library libQt6*.so。"
  - "test_package/CMakeLists.txt 未定义 add_test 时 cmake.test() 会报 No rule to make target 'test'；直接运行消费者二进制即可。"
