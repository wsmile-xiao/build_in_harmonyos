package: kguiaddons/6.26.0
homepage: "https://invent.kde.org/frameworks/kguiaddons"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error"

# 上游 autotests/ 实际运行的核心测试（BUILD_TESTING=ON 时由 ctest 执行）
upstream_tests:
  - file: autotests/kwordwraptest.cpp
    source: kguiaddons-6.26.0/autotests/kwordwraptest.cpp
    description: "KWordWrap text wrapping logic"
    command: "kwordwraptest"
  - file: autotests/kcolorutilstest.cpp
    source: kguiaddons-6.26.0/autotests/kcolorutilstest.cpp
    description: "KColorUtils luma/lighten/darken/tint color math"
    command: "kcolorutilstest"
  - file: autotests/kiconutilstest.cpp
    source: kguiaddons-6.26.0/autotests/kiconutilstest.cpp
    description: "KIconUtils icon rendering helpers"
    command: "kiconutilstest"

expected_skips:
  - "kcursorsavertest / kkeysequencerecordertest (Wayland/X11 disabled on OHOS headless baseline)"
  - "kgeourihandlertest / kurlhandlertest (geo scheme handler disabled)"
  - "kcountryflagemojiiconenginetest (may depend on platform icon engine availability)"

test_package_tests:
  - file: test.cpp
    description: "Consumer-side smoke: link KF6::GuiAddons, exercise KColorUtils color math"
    command: "./test_kguiaddons"

assertion_count: 4
