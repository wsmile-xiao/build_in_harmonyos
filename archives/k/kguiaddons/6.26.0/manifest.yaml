# 版本级 manifest
# 文件位置: archives/k/kguiaddons/6.26.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "6.26.0"
software: "kguiaddons"
status: published
build_date: "2026-08-24"
build_system: cmake

source:
  url: "https://download.kde.org/stable/frameworks/6.26/kguiaddons-6.26.0.tar.xz"
  sha256: "8375342f852104f36fd72a6870eb9795183af4516592cd6fa73445ea6b813172"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE"
    - "WITH_WAYLAND=OFF"
    - "WITH_X11=OFF"
    - "USE_DBUS=OFF"
    - "BUILD_GEO_SCHEME_HANDLER=OFF"
    - "BUILD_PYTHON_BINDINGS=OFF"
    - "BUILD_TESTING=ON"
  dependencies:
    - qtbase/6.11.1
    - ecm/6.26.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "纯 Qt6::Gui 核心库型 KDE Frameworks 最简模板: WITH_WAYLAND/WITH_X11/USE_DBUS/BUILD_GEO_SCHEME_HANDLER/BUILD_PYTHON_BINDINGS 全 OFF 即可零补丁通过"
  - "test_package 消费者二进制运行必须 self.run(..., env='conanrun') 并物化 libKF6*.so 兼容链接, 否则 Error loading shared library libQt6*.so"
  - "test_package/CMakeLists.txt 未定义 add_test 时 cmake.test() 报 No rule to make target 'test'; 直接运行消费者二进制即可"
