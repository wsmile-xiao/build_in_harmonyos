# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kguiaddons/6.18.0.1.

package: kguiaddons/6.18.0.1
homepage: https://invent.kde.org/frameworks/kguiaddons

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kguiaddons-6.18.0/autotests/
    description: "KGuiAddons upstream CTest/autotests suite"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke calls KColorUtils::mix through KF6::GuiAddons."
    command: "conan create (test_package builds and runs test_kguiaddons)"

assertion_count: 1
