package: kholidays/6.28.0
homepage: "https://invent.kde.org/frameworks/kholidays"
upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build-dir> --output-on-failure --no-tests=error"
upstream_tests:
  - file: autotests/testlunar.cpp
    description: "Upstream lunar phase computation test"
  - file: autotests/testseasons.cpp
    description: "Upstream astro seasons test"
  - file: autotests/testsunriseset.cpp
    description: "Upstream sunrise/sunset computation test"
  - file: autotests/testzodiac.cpp
    description: "Upstream zodiac signs test"
  - file: autotests/testholidayregion.cpp
    description: "Upstream holiday region parsing/data test"
  - file: autotests/testsunevents.cpp
    description: "Upstream solar events (dawn/dusk/noon) test"
  - file: autotests/testcategories.cpp
    description: "Upstream holiday categories test"
upstream_test_note: >-
  7 upstream autotests registered by autotests/CMakeLists.txt under
  BUILD_TESTING; executed via ctest during conan create with the
  offscreen Qt platform and an isolated XDG/HOME environment.
test_package_tests:
  - file: test_kholidays.cpp
    description: >-
      Real consumer test: find_package(KF6Holidays) + KF6::Holidays link,
      computes Beijing solstice sunrise/sunset via KHolidays::SunEvents and
      validates event ordering (civil dawn < sunrise < solar noon < sunset <
      civil dusk), day length and solar-noon UTC ranges, polar day/night
      predicates (isPolarDay/isPolarNight) and polar-night SunEvents sanity.
    command: "test_kholidays"
assertion_count: 12
