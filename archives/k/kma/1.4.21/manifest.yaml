# 版本级 manifest（archives/k/kma/1.4.21/manifest.yaml）
# 遵循 ARCHIVE-SPEC v2.0/v3.0

version: "1.4.21"
software: "kma"
status: "built"
build_date: "2026-09-25"
build_system: "makefile"

source:
  # 上游是 git 仓库 https://bitbucket.org/genomicepidemiology/kma。上游至今
  # 不发布任何正式 release 工件、也不公布任何归档的校验和——这句话在换源之后仍然
  # 成立，本包取的不是带校验和的官方 release，也没有把它写成官方 release。上游
  # 可下载的只有 Bitbucket 按 ref 即时生成的快照，本包取 tag 1.4.21 那一份；
  # B 机 2026-09-25 复测：HTTP 200、application/x-tar-gz、690007 字节、sha256
  # fb6dc991d8777df49f0d02fadf6ccb7800531a68a5c22800de9f324d29f5750e；对照组
  # 不存在的 ref（get/v1.4.21.tar.gz）回 HTTP 404 + 23 字节 text/plain，且该体
  # 被 tar 判为 not gzip ⇒ 端点确按 ref 区分。该快照由移动 tag 即时生成、自身不
  # 带任何上游公布的校验和，故下面 pin 的 sha256 是本机实测值、不是上游声明。
  # 换源理由是门禁、不是内容：本包原先取下游发行版 pool 的 pristine
  # kma_1.4.21.orig.tar.xz，而 preflight PF7/R39 对该族域名无条件判作下游重打包
  # 源（scripts/ohc/preflight.py 的 check_source_urls），建 PR 前的闸门又是
  # fail-closed（scripts/gitcode_pr.py 调用它、不暴露跳过开关）⇒ 即便两份归档逐
  # 文件等价也过不了闸；改取上游快照同时消掉经下游转一道手的间接层。
  # 等价性复算（B 机 2026-09-25；被替换件留档读数：630940 字节、sha256
  # fb50e3fa72133285db0f9058060991fa1306f9be492f00f646e62cb7eb49a635、154 个
  # tar 条目、tar tJf | grep -c debian 实测 0 命中 ⇒ 无发行版重打包目录、无 dfsg
  # 式删减）：diff -rq 两棵解包树 rc=0、零差异行；两侧各 148 个常规文件；两侧逐
  # 文件 sha256 清单完全一致；剥掉顶层目录后的 tar 条目名集合一致。为排除比较器
  # 哑火同轮做了正对照（对植入差异的两个目录跑同样两种比对，两者均报警）。
  # 顶层目录名两侧不同（genomicepidemiology-kma-c0dca4d8c4ac 对 kma-1.4.21），
  # 配方 source() 走 strip_root=True ⇒ 不影响构建；patches 仍为空、无补丁应用。
  # 证据件：~/tmp/uc2/z33-kma-fix/eq4-readings.out、eq4b.out、
  # eq4b-diff-rq.txt（0 字节）、eq4b-manifest-tag.txt、eq4b-manifest-orig.txt。
  # 另见 notes.md 源码获取节。
  url: "https://bitbucket.org/genomicepidemiology/kma/get/1.4.21.tar.gz"
  sha256: "fb6dc991d8777df49f0d02fadf6ccb7800531a68a5c22800de9f324d29f5750e"
  tar_format: tar.gz
  size_bytes: 690007

build:
  system: makefile
  # 上游无 configure/cmake：make 命令行变量覆盖。GNU make 下命令行 CFLAGS
  # 会屏蔽 Makefile 的 `CFLAGS += -std=c99`，故 -Wall -O3 -std=c99 三项显式
  # 重述，再追加 zlib 的 -I/-L。
  configure_options:
    - "CC=<conan conf tools.build:compiler_executables:c>"
    - "AR=<llvm-ar beside the compiler>"
    - "CFLAGS=-Wall -O3 -std=c99 -I<zlib>/include"
    - "LDFLAGS=-L<zlib>/lib"
    - "make -j1 all"
  outputs:
    - "bin/kma"
    - "bin/kma_index"
    - "bin/kma_shm"
    - "bin/kma_update"
  dependencies:
    - "zlib/1.3.1.1"
  cc: clang
  cxx: clang++

patches_applied: []

tests:
  # 上游注册测试 0 条（手工清点：无 check/test 目标、make -n check rc=2、
  # 跨框架 grep 0 命中、无 t/tests/test/spec 目录、上游 CI 无测试步骤）。
  upstream_tests: 0
  upstream_test_command: ""
  added_consumer_scenarios: 1
  added_consumer_assertions: 12

knowledge_gained:
  - "机制层（本包实测复证，归池内既有条目、本包不重申报）：本平台 seccomp-BPF 按 syscall 号把 SysV shmget/shmat/shmdt/msgget/semget 击杀成 SIGSYS(31)，被击杀时拿不到 errno；而 shmctl/msgctl/semctl 进内核返 EINVAL、ftok 与 POSIX shm、文件后端 mmap 放行 ⇒ SysV IPC 类软件要逐 syscall 号探，不能按类别一概而论。knowledge_ref: knowledge/drafts/DRAFT-ohos-sysv-shmget-sigsys.md（池内既有条目，本包挂靠机制层；其第 22 行「拦 shmctl」一句已被本包与 radioclk 两侧实测否证，修正请求随 knowledge/drafts/DRAFT-kma-1.4.21-unconditional-sysv-probe-makes-upstream-file-fallback-unreachable-and-wall-is-per-subcommand.md 第三节披露，并已建知识库扩展 Issue #3402 回填号）"
  - "同一道能力墙按子命令分面，故可用面/不可用面/未测面必须逐子命令点名并各给一手读数行号（B=create 的新增面之一：既有条目只以台账形态隐含分列，未把按子命令点名披露写成规则句）：kma map 默认路径不可用（rc=159、四件输出全 0 字节；runA.log:8 的 Signal 31）而带 -mmap 可用（rc=0、数值与上游语义一致，reports/w3-local-ci.log:339-350）；kma db（db.c:59 直连 hashMapKMA_load）不可用（dbB.log:2）、kma shm 依 syscall 探针与源码判定不可用（未实跑本子命令）——grep -rl 该调用位掩码全树只命中 kmers.c 与 sparse.c。可用面（有 rc=0 与产物读数）只有 kma -v、kma index、kma -mmap 比对三项；kma dist、kma trim、kma seq2fasta、kma -h、kma update 一律按未测登记（无功能读数，不得当成可用）；kma map 默认路径、kma db、kma shm 为不可用。未测项的现存读数：dist 见 steps.log:43 与 dist.log:1（首轮选项写错）、distB.log 0 字节；trim 只见于编译行与归档行 reports/w3-local-ci.log:234/:247；seq2fasta 见 steps.log:42 与 s2f.log:1-5（只有 usage 页）；-h 无单独实跑留痕（绑定日志 reports/w3-local-ci.log:365 是 W3 L2 的双横线冒烟形态、同段判决 reports/w3-local-ci.log:372 为 L2_RESULT=skip）；update 见 ~/tmp/uc2/z33-kma-fix2/up2-bare.log:2 的 rc=0 与首行原文 :4、~/tmp/uc2/z33-kma-fix2/up2-i.log:2 的 rc=1 与 :4 的 Invalid option（第 4 轮审计判明旧两件 ~/tmp/uc2/z33-kma-fix/up-bare.log、up-i.log 只落 stdout、全件内无 rc 行，故补跑记 rc；rc=0 只走到 usage 打印，不是可用证据）。knowledge_ref: knowledge/drafts/DRAFT-kma-1.4.21-unconditional-sysv-probe-makes-upstream-file-fallback-unreachable-and-wall-is-per-subcommand.md（本包新增判据的载体，随本 PR 原子提交），并挂靠 knowledge/drafts/DRAFT-E584-bus-sysv-ipc-sigsys-catchable.md 第 51-60 行与第 62-72 行的按入口分列台账（**隐含**形态：该条全文 93 行未把按 API/子命令面点名披露写成规则句，本包只借其分列形态并把判据显式化），其第 79 行同时是把解法类型路由到既有条目的桥句；解法类型（编译通过、运行期改走平台放行后端）另挂 knowledge/doc/E237.md 第 26、28 行的 compile-verify-with-runtime-degradation。差额与判据：E237 三选项均以运行期无事件源为前提、未逐字覆盖零补丁 + 运行期 argv 开关这一形态（kma.c:525 是 strcmp(argv[args], -mmap)），而 DRAFT-ohos-sysv-shmget-sigsys.md 可复用修复模式第 36-38 行只覆盖编译期开关、第 39-45 行是手工重写 setup_shm ⇒ 二者都不覆盖本包解法；按 经验文档/手册/03-路径B与C.md:82-83 两条前置均不满足（条目外新行为偏差 + 既有条目没写的另一条解法）判 **create**，知识库扩展 Issue 已建并回填号 #3402"
  - "上游自带兜底不等于兜底可达（B=create 的新增面：把一般结论升成可执行的静态读码判据——先判兜底的进入条件是被拦调用的返回值还是被拦调用本身，后者在 SECCOMP_RET_TRAP/KILL 下恒不可达）：hashmapkma.c:321-330 的普通文件回退以 shmget 的返回值为进入条件，而 :319-320 的 ftok+shmget 是无条件前置探测、本平台命中即 SIGSYS ⇒ 判定从未求值、回退永不可达（对照同文件 :27-36 的 #ifdef _WIN32 恒失败桩宏，本平台三元组 aarch64-unknown-linux-ohos 无此桩）。knowledge_ref: knowledge/drafts/DRAFT-kma-1.4.21-unconditional-sysv-probe-makes-upstream-file-fallback-unreachable-and-wall-is-per-subcommand.md（本包新增判据的载体，随本 PR 原子提交）；挂靠 knowledge/drafts/DRAFT-E577-buffer-sysv-ipc-posix.md 第 31-36 行「按 errno 写的回退 ⇒ 永不生效（进程已死）」的一般性结论与其第 38-44 行旁证清单（本条不重申报）"
  - "GNU make：命令行赋值的变量优先级最高、makefile 内对被命令行赋值的变量的 += 会被忽略，故覆盖 CFLAGS 时必须把 += 里的 -std=c99 一并重述（首轮构建因此报 C99 语法错）。knowledge_ref: knowledge/drafts/DRAFT-smemstat-0.02.13-make-cli-cflags-override.md（同一机制的池内既有条目，本包复证）"
