# conandata.yml -- kma 1.4.21
#
# Source provenance (measured, not guessed).
#   Upstream is the git repository https://bitbucket.org/genomicepidemiology/kma.
#   Upstream publishes NO release artifact and therefore no upstream published
#   checksum for any archive -- that is still true after the swap recorded below,
#   and this recipe does not claim otherwise: what is taken here is the archive
#   Bitbucket generates on demand for tag 1.4.21, i.e. a per-tag snapshot, not a
#   signed release with a checksum.  Re-measured on the build host 2026-09-25:
#   HTTP 200, content-type application/x-tar-gz, 690007 bytes, sha256
#   fb6dc991d8777df49f0d02fadf6ccb7800531a68a5c22800de9f324d29f5750e.  The
#   control request for a nonexistent ref (get/v1.4.21.tar.gz) answers HTTP 404
#   with 23 bytes of text/plain that tar rejects as not-gzip, so the endpoint
#   really is per-ref.  Because that archive is generated from a moving tag,
#   nobody publishes its checksum: the sha256 pinned below is OUR OWN
#   measurement taken on the build host, not an upstream statement of fact.
#
#   Why the source moved off the downstream distro pool: preflight PF7/R39
#   classifies a pool source unconditionally as a downstream repackaging source
#   (scripts/ohc/preflight.py, check_source_urls), and the pre-PR gate is
#   fail-closed (scripts/gitcode_pr.py runs it and exposes no skip flag), so even
#   a content-identical pristine archive pinned there cannot pass.  Pointing at
#   the upstream per-tag archive satisfies that gate and also removes one hop of
#   indirection from the provenance chain.
#
#   Content equivalence of the two archives, re-measured on the build host
#   2026-09-25.  The previously pinned pristine archive is kept here for the
#   record: kma_1.4.21.orig.tar.xz -- 630940 bytes, sha256
#   fb50e3fa72133285db0f9058060991fa1306f9be492f00f646e62cb7eb49a635, 154 tar
#   entries, tar tJf | grep -c debian -> 0 (no distro repackaging directory, no
#   dfsg-style stripping):
#     diff -rq <per-tag archive tree> <pristine tree>  -> rc=0, 0 differing lines
#     regular files per side                           -> 148 / 148
#     per-file sha256 manifest of each tree            -> byte-identical lists
#     tar entry-name sets (top directory stripped)     -> identical
#   Both comparators were positive-controlled against a planted difference and
#   both fired, so the zero above is not an inert comparator.
#   The two top directories are genomicepidemiology-kma-c0dca4d8c4ac/ and
#   kma-1.4.21/; source() unpacks with strip_root=True, so the name difference is
#   immaterial.  So this is upstream content, no patches applied (patches: {} is
#   unchanged).  Full readings and raw artefacts: notes.md (source section) and
#   ~/tmp/uc2/z33-kma-fix/eq4-readings.out, eq4b.out, eq4-tag-1.4.21.tar.gz,
#   eq4-tag-v1421-control.tar.gz, eq4b-diff-rq.txt, eq4b-manifest-tag.txt,
#   eq4b-manifest-orig.txt.
