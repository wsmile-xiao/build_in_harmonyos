# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求存在）
#
# 上游测试清点：**手工做**，未使用 ci/tools/extract_upstream_tests.sh
# （该脚本硬编码只读 /tmp，在本设备必失败，它的 log 不能当"上游 0 测试"的证据）。
# 实测命令与读数（HarmonyOS PC B 机，2026-09-25；完整输出落
# ~/tmp/uc2/z33-kma/inventory-report.txt 与 ~/tmp/uc2/z33-kma/inventory/）：
#
#   取源换向说明（2026-09-25）：下面这段清点是对 Debian pristine
#   kma_1.4.21.orig.tar.xz 做的；conandata.yml 现已改指上游 Bitbucket 按 tag
#   即时生成的归档 get/1.4.21.tar.gz。两棵树在 B 机复算下逐文件等价（diff -rq
#   rc=0 零差异；各 148 个常规文件 / 154 个 tar 条目；两侧逐文件 sha256 清单完全
#   一致），故下列读数在新源下同样成立，清点未重跑（见 notes.md 源码获取节）。
#   sha256sum kma_1.4.21.orig.tar.xz
#     -> fb50e3fa72133285db0f9058060991fa1306f9be492f00f646e62cb7eb49a635  630940 B
#   tar tJf kma_1.4.21.orig.tar.xz | wc -l                      -> 154
#   tar tJf kma_1.4.21.orig.tar.xz | grep -icE "test|spec|check" -> 3
#        唯一三条命中全是文件名巧合：KMAspecification.pdf、qualcheck.c、
#        qualcheck.h（后两条是测序质量分数处理代码，不是测试）
#   干净解包后 grep -nE '^[A-Za-z0-9_.-]+:' Makefile            -> 63 条目标行
#        （all、kma、kma_index、kma_shm、kma_update、libkma.a、clean
#          7 个真目标 + 56 条 .o 头文件依赖声明）
#   grep -nE '^(check|test|install)[[:space:]:]' Makefile       -> 无命中
#   make -n check                                               -> rc=2（No rule）
#   grep -rlE "Test::More|use_ok\(|def test_|TEST_CASE|add_test\(|enable_testing" .
#                                                              -> 0 命中
#   find . -type d \( -name t -o -name tests -o -name test -o -name spec \)
#                                                              -> 0 目录
#   grep -rnE "make (check|test)|ctest|pytest|prove" .github/ bitbucket-pipelines.yml
#                                                              -> 0 命中（.github
#        的四个 workflow 只做 linux/osx/noarch 手工构建与 release 打包）
#   tar tzf performanceAndComparisonCMDs.tar.gz | wc -l          -> 5
#        （benchmarkCMDs/ 目录 + bedToTemplate.pl + benchMarkCMDs.txt +
#          chop_DB.c + ResFinder.fasta —— 论文复现用的基准命令与参考数据集，
#          属测试**资产**，无任何注册测试入口与断言）
#
# 结论：上游注册测试 0 条；因此 test_package 必须自带真实行为断言。

package: kma/1.4.21
homepage: "https://bitbucket.org/genomicepidemiology/kma"

# 上游没有 check/test 目标：make -n check 实测 rc=2（No rule to make target）
upstream_check_command: ""

# conanfile.py build() 未集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - name: 上游 0 条注册测试（手工清点证据见本文件头部注释与 notes.md）
    count: 0
    source: kma-1.4.21/Makefile
    description: "Makefile 仅有 all/kma/kma_index/kma_shm/kma_update/libkma.a/clean 七个真目标，无 check/test/install 目标，make -n check 实测 rc=2；包内 154 个条目中无 t/tests/test/spec 目录，跨框架测试注册 grep 0 命中，上游 CI（.github/workflows 四份 + bitbucket-pipelines.yml）无任何测试步骤；performanceAndComparisonCMDs.tar.gz 是 5 条基准命令与参考数据集（测试资产，非注册测试）。R51 口径如实登记为 0，并附清点命令与读数。"

test_package_tests:
  - file: test_kma.py
    description: "真实端到端：用打包产物 kma index 建真实模板库（校验 testdb.comp.b > 1 MiB），再用上游自带 -mmap 非 SysV 路径 kma -i query.fa -t_db testdb -mmap 做真实比对，逐字段核对 .res 的 Template/Score/Query_Identity/Template_length/Template_Coverage/Query_Coverage 数值与 .aln 的比对串（5 段 60 连竖线全匹配 + 5 段 60 连下划线未覆盖）。"
    command: "python3 test_kma.py <pkg>/bin/kma db.fa query.fa <workdir>"
  - file: db.fa
    description: "真实 FASTA 输入：3 条模板 x 600 bp（t1/t2/t3），建库用。"
  - file: query.fa
    description: "真实 FASTA 输入：t1 前 300 bp 的精确子串（q1），比对用，期望 100% identity。"

# test_kma.py 内的 check() 断言条数（A1..A12）
assertion_count: 12
