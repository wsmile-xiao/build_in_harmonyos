# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-perfdhcp/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：src/bin/perfdhcp/tests/meson.build 注册 1 个 gtest 套件
# （test('perfdhcp-tests', protocol: 'gtest', is_parallel: false, priority: -1)，
#  门禁 -D tests=enabled），本包 build() 内真实执行
upstream_check_command: "meson test -C <builddir> --list"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> perfdhcp-tests"

# 上游测试程序（本次适配实测：1/1 套件通过，用例级 140/140）
upstream_tests:
  - file: perfdhcp-tests
    source: src/bin/perfdhcp/tests/
    description: >-
      单个 gtest 可执行文件，覆盖 perfdhcp 全部编译单元：avalanche/basic 场景、
      命令行解析（CommandOptionsTest，含 -v/-V/-h）、packet storage、DHCPv4/v6
      报文构造与解析、速率控制、receiver、统计管理器、TestControl 场景控制
      （13 个套件、140 个用例；源码 TEST/TEST_F 宏计 140，无 DISABLED 用例）
    command: "\"./perfdhcp-tests\"（工作目录 src/bin/perfdhcp/tests，需 TEST_DATA_DIR）"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_perfdhcp.py
    description: >-
      以 conanrun 环境运行包内 perfdhcp：版本输出（-v/-V）、usage 文本、
      非法 --scenario 的拒绝路径、一次真实 IPv6 交换尝试（校验进程能加载全部
      Kea 运行库、无 "Error loading shared library"、并产出统计报告），共 11 项断言
    command: "python3 test_perfdhcp.py"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 bin/perfdhcp 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64 / ET_DYN PIE、DT_NEEDED 链接 musl libc.so 且非
      glibc libc.so.6、链接 libc++_shared.so），共 8 项断言
    command: "./test_ohos_platform <package>/bin/perfdhcp"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：校验包内 DT_NEEDED 的 Kea 库全部随包分发，
      在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 包内 10 个 libkea-*.so* 全部成功，
      并真实执行包内 perfdhcp（-v 输出 3.0.3），证明真实进程的完整 NEEDED 闭包
      在 OHOS 运行时可解析，共 6 项断言（另有 10 条逐库 dlopen 结果行）
    command: "./test_ohos_runtime <package>/bin/perfdhcp"
    ohos_specific: true

# 鸿蒙特有测试用例统计（本次适配实测：2 个，2/2 通过）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <perfdhcp> && ./test_ohos_runtime <perfdhcp>"
  result: "2/2 passed"

# 用例总数：上游 140 个 gtest 用例（1 个 meson 套件）
upstream_case_count: 140
upstream_passed_case_count: 140
upstream_skipped_case_count: 0
test_package_assertion_count: 25
assertion_count: 165
