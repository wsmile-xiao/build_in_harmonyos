# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio core 插件（debugger.so）不在 ELF DT_NEEDED 里依赖 kamailio 本体：模块导出 module_exports 由主程序 dlopen 时解析。因此独立打包模块时不能把 kamailio core 作为 requires，改为在 test_package 里提供 core 符号 shim 才能真实加载模块"
  - "OHOS/musl 无惰性绑定（RTLD_LAZY 等价 RTLD_NOW）：dlopen 一个引用 kamailio core 符号的模块，进程必须已导出全部这些符号，否则 dlopen 直接失败。shim 需用 -Wl,--export-dynamic 导出（仅加 -rdynamic/不加该链接参数时，符号在目标文件的动态符号表里不可见，dlopen 仍解析失败）"
  - "core/sr_module.h 的 #define DEFAULT_DLFLAGS 是模块 dlopen 标志来源；shim 头必须按 core 真实定义提供这些宏，否则消费者用例编译期即失败（本包定位到 core/sr_module.h:188）"
  - "kamailio 模块的 core ABI 结构体（cmd_export_t/ksr_cmd_export_t @ core/sr_module.h:206-231、rpc_export_t @ core/rpc.h:134-141）布局必须与 core 完全一致：模块用 memset 整结构体 + 按偏移逐项赋值，字段顺序/数量不符会写坏栈"
  - "debugger 模块导出 32 个关键符号（exports/mod_init/child_init/dbg_init_rpc 等），构成可用消费者用例的验证面：dlopen → dlsym('exports') → mod_init → child_init(PROC_INIT) → dbg_init_rpc 链路可在无 kamailio 实例的环境下真实跑通"
  - "编译期缺 core 符号仅出现在链接/加载期：模块自身编译（make modules）不校验 core 符号，故交叉编译能直接通过，问题完全暴露在 test_package 的实跑环节"
  - "打包产物 debugger.so 无 RPATH/RUNPATH、无 glibc 版本化符号（GLIBC_ 字符串 0 处，musl/clang 交叉编译）"

