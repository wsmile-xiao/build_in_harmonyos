# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: kamailio-debugger/6.0.6
homepage: "https://www.kamailio.org"

# 上游测试命令（R51 三步法：清点 → 实跑 → 回填，完整台账见 notes.md 第四节）
#
# 清点口径（源码包内 `test/`、`tests/` 命名目录全量清点，脚本口径可复现）：
#   官方源码包 kamailio-6.0.6_src.tar.gz 内共 4 个此类目录、17 个文件：
#     utils/kamctl/dbtextdb/tests/   10 个（dbtextdb_test.py 的用例数据）
#     src/modules/janssonrpcc/test/   3 个（jsonrpc-c 模块，脚本 + 配置）
#     src/modules/rtpproxy/test/      3 个（rtpproxy 模块，配置 + 命令行记录）
#     src/modules/tm/test/            1 个（tm 模块，开发期 IPC 清理脚本）
#   模块自身源码目录 src/modules/debugger/ 内无测试源、无 check/ctest 目标注册
#   （源码清单：CMakeLists.txt Makefile README doc/ debugger_act.{c,h} debugger_api.{c,h}
#     debugger_config.{c,h} debugger_json.{c,h} debugger_mod.c —— 12 个源文件 + doc/，
#     与构建产物 *.o/*.d/debugger.so/librpath.lst/makecfg.lst 区分开）。
#
# 实跑口径：17 个文件中唯一自包含、无需运行中 kamailio 实例的上游测试是
#   utils/kamctl/dbtextdb/dbtextdb_test.py（上游自带 unittest 入口，3 个用例，
#   仅依赖 Python 标准库；用例数据取自同目录 tests/ 下 10 个文件）。
#   → 已在 conanfile.py build() 末尾真实执行（层 1 门禁）。
upstream_check_command: "python3 dbtextdb_test.py -v"
upstream_test_in_build: true
upstream_test_command: "python3 dbtextdb_test.py -v"

# 上游测试清单（源码包内 test/tests 目录全量 17 个文件，逐项登记）
upstream_tests:
  # ── 已真实执行：Python unittest 入口（3 个用例）──────────────────────────
  - file: dbtextdb_test.py
    source: kamailio-6.0.6/utils/kamctl/dbtextdb/dbtextdb_test.py
    description: "kamctl dbtextdb 驱动 unittest（testParseQuery/testOpenTable/testExecute）"
    command: "python3 dbtextdb_test.py -v"
    cases: 3
    executed: true
    result: "Ran 3 tests ... OK (3/3, failures=0 errors=0)，执行日志见 reports/w3-local-ci.log 与 reports/conan-verify-report.md"
  # ── 未独立执行：用例数据（10 个，由上条 unittest 消费）──────────────────
  - file: "tests/bad_table_null, tests/bad_table_int, tests/bad_table_long_row, tests/bad_table_short_row, tests/bad_table_wrong_type, tests/bad_table_auto_dupe, tests/unsorted_table, tests/unsorted_table2, tests/subscriber, tests/test"
    source: kamailio-6.0.6/utils/kamctl/dbtextdb/tests/
    description: "dbtextdb_test.py 的用例数据文件（非独立用例，无执行入口）"
    executed: false
    not_executed_reason: "纯数据文件（无执行位、无断言），由已执行的 dbtextdb_test.py 读取消费（该 unittest 已 3/3 通过）"
  # ── 未执行：janssonrpcc（jsonrpc-c）模块测试（3 个）────────────────────
  - file: run-tests.sh
    source: kamailio-6.0.6/src/modules/janssonrpcc/test/run-tests.sh
    description: "jsonrpc-c 模块冒烟脚本：cd src && ./kamailio -f modules/jsonrpc-c/test/test.cfg"
    executed: false
    not_executed_reason: "需同源码树构建的 kamailio 主程序（不在本包制品内）+ 该模块自身 loadmodule 运行实例；本包产物仅 debugger.so，不构建 kamailio core"
  - file: mem-test.sh
    source: kamailio-6.0.6/src/modules/janssonrpcc/test/mem-test.sh
    description: "同上，但以 valgrind --leak-check=full 驱动 kamailio 主程序"
    executed: false
    not_executed_reason: "除 kamailio 主程序外还依赖 valgrind，且属 janssonrpcc 模块（非本包模块）"
  - file: test.cfg
    source: kamailio-6.0.6/src/modules/janssonrpcc/test/test.cfg
    description: "上述两个脚本使用的 kamailio 配置（loadmodule json/jsonrpc-c）"
    executed: false
    not_executed_reason: "配置文件，无执行入口；随 janssonrpcc 模块测试使用"
  # ── 未执行：rtpproxy 模块测试目录（3 个）──────────────────────────────
  - file: kamailio.cfg
    source: kamailio-6.0.6/src/modules/rtpproxy/test/kamailio.cfg
    description: "rtpproxy 模块手工联调用 kamailio 配置样例"
    executed: false
    not_executed_reason: "配置样例，无执行入口；需运行中 kamailio + 外部 rtpproxy 进程（与本包 debugger 模块无关）"
  - file: exec_rtpproxy.txt
    source: kamailio-6.0.6/src/modules/rtpproxy/test/exec_rtpproxy.txt
    description: "rtpproxy 进程启动命令行记录"
    executed: false
    not_executed_reason: "纯文本命令行记录（无执行位、无断言），非可执行用例"
  - file: exec_pjsua.txt
    source: kamailio-6.0.6/src/modules/rtpproxy/test/exec_pjsua.txt
    description: "pjsua 客户端启动命令行记录（音视频呼叫联调用）"
    executed: false
    not_executed_reason: "纯文本命令行记录（无执行位、无断言），依赖 pjsua 等外部二进制"
  # ── 未执行：tm 模块开发期清理脚本（1 个）──────────────────────────────
  - file: kill_sem.sh
    source: kamailio-6.0.6/src/modules/tm/test/kill_sem.sh
    description: "tm 模块开发期 IPC 清理脚本（ipcrm 删除宿主全部 SysV 信号量/共享内存）"
    executed: false
    not_executed_reason: "非测试用例：需 root 且 ipcrm 会删除构建机全部 SysV IPC 对象，在共享 CI worker 上执行将破坏其他进程；上游仅作开发调试清理用"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: check_debugger.py
    description: "L1 产物结构校验：ELF aarch64/ELFCLASS64/ET_DYN、NEEDED 仅 libc/libdl 且无 RPATH/RUNPATH、core 插件 API 导出（exports/mod_register/dbg_rpc/dbg_cfg/dbg_init_rpc 等 10 项）、无 glibc 版本化符号、licenses/COPYING 为 GPL 正文"
    command: "python3 check_debugger.py（由 test_package/conanfile.py 的 test() 驱动）"
    cases: 14
  - file: test_debugger_e2e.c
    description: "消费者端到端用例（非纯断言）：dlopen(RTLD_NOW) 加载 debugger.so → dlsym(exports) 取得模块描述符 → 按 core ABI 重放命令表/modparam 表加载（逐条核对名字/参数个数/处理函数/fixup/顺序）→ 调用模块真实 API dbg_init_rpc() 并向 core 注册 RPC 表（8 个 dbg.* 方法逐一核对）→ 按描述符调用命令处理函数与各 fixup（含非法参数字符串负例）→ 调用 destroy_mod_f 验证 mod_destroy 状态清理 → dlclose。配套 kamailio_core_stub.{c,h} 提供 core 未定义符号最小实现层（OHOS/musl 无惰性绑定，RTLD_NOW 语义下必须全部可解析）"
    command: "test_debugger_e2e <package_folder>/lib/kamailio/modules/debugger.so"
    cases: 92
    evidence: "本机实测：92 passed, 0 failed, 0 skipped（clang 15 / aarch64-linux-ohos，2026-09-25）"
  - file: conanfile.py
    description: "L1 测试入口：定位制品内 lib/kamailio/modules/debugger.so，注入 DEBUGGER_MODULE/DEBUGGER_PACKAGE_FOLDER 驱动 check_debugger.py；随后用 OHOS clang 编译并运行消费者 E2E 用例（R34 实质验证，非空壳 print）"
    command: "conan create . --build=missing（CI 自动执行 test()）"

# 测试断言总数
assertion_count: 14        # check_debugger.py：10 项无条件 + 4 项依赖 readelf/nm 可用性（缺失走 skip）
e2e_assertion_count: 92    # test_debugger_e2e.c：本机实测 92 passed / 0 failed / 0 skipped
