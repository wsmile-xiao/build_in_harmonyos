# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-dhcp4/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：src/bin/dhcp4/tests/meson.build 注册 2 个测试
#   1. test('kea-dhcp4-tests', protocol: 'gtest', is_parallel: false, priority: -1,
#      timeout: 60, depends: [co1, co2, co3, co4, kea_dhcp4]) —— 本包 build() 内真实执行
#   2. test('dhcp4_process_tests.sh', suite: 'shell-tests') —— 本包 build() 内真实执行（见下）
upstream_check_command: "meson test -C <builddir> --list"
upstream_test_in_build: true
upstream_test_command: "meson test -v --timeout-multiplier 10 -C <builddir> kea-dhcp4-tests dhcp4_process_tests.sh"

# 上游测试程序（源码 TEST/TEST_F/TEST_P 宏计 948 个用例，24 个含用例的测试文件；
# 真机运行期注册 1024 用例 / 29 套件，含 TEST_P 实例化展开，以 gtest 输出为准）
upstream_tests:
  - file: kea-dhcp4-tests
    source: src/bin/dhcp4/tests/
    description: >-
      单个 gtest 可执行文件（28 个源文件，其中 24 个含用例），覆盖 DHCPv4
      服务器全部编译单元；源码宏计 948 个用例（classify 68、config_parser 148、
      dhcp4_srv 128、http_control_socket 84、dora 82、vendor_opts 63、
      ctrl_dhcp4_srv 55、hooks 55、fqdn 53、shared_network 31、parser 25、
      out_of_range 20、kea_controller 20、client_handler 18、host 18、
      release 16、decline 12、d2 10、inform 9、direct_client 8、
      host_options 8、config_backend 6、dhcp4to6_ipc 5、simple_parser4 5，
      以及 get_config 的 1 个 TEST_P——实例化后实际用例数由 gtest 输出为准）；
      其中 2 个上游 DISABLED_ 前缀用例（Dhcp4ParserTest.DISABLED_Uint32Parser、
      JSONFileBackendTest.DISABLED_loadAllConfigs）由 gtest 标记为不运行；
      真机实测运行数/通过率见下
    command: "\"./kea-dhcp4-tests\"（工作目录 src/bin/dhcp4/tests，需 TEST_DATA_DIR、test_data/marker 头与 co1-co4 callout 库）"
  - file: dhcp4_process_tests.sh
    source: src/bin/dhcp4/tests/dhcp4_process_tests.sh.in
    description: >-
      同目录注册的 POSIX shell 套件（suite: shell-tests，649 行，14 个子用例）：
      以真实 kea-dhcp4 进程验证 pid 文件互斥、SIGHUP 动态重配置（坏配置保持
      运行）、SIGTERM/SIGINT 优雅停机、版本、日志变量、LFC 定时触发两轮、
      6 项语法校验（成功 / 坏语法 / 坏取值 / hooks 加载失败 / callout 加载失败 /
      callout 轮询失败）与密码脱敏；全部配置 interfaces: []（不开 socket、
      零特权）。真机实测 14/14 子用例全过（exit status 0，48.86s）
    command: "\"dhcp4_process_tests.sh\"（工作目录 src/bin/dhcp4/tests）"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_dhcp4.py
    description: >-
      以 conanrun 环境运行包内 kea-dhcp4：版本/扩展版本/构建配置报告输出
      （-v/-V/-W）、命令行错误路径（未知选项、缺配置）、配置校验模式 -t 的
      正反路径（最小 DHCPv4 配置通过并以 "Syntax check OK" 确认；坏 JSON、
      缺 Dhcp4 元素、文件不存在分别被拒），共 21 项检查
    command: "python3 test_dhcp4.py"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 bin/kea-dhcp4 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64 / ET_DYN PIE、DT_NEEDED 链接 musl libc.so 且非
      glibc libc.so.6、链接 libc++_shared.so 且非 GNU libstdc++，另有 DT_STRSZ
      与 NEEDED 解析守卫防静默截断），共 11 项检查
    command: "./test_ohos_platform <package>/bin/kea-dhcp4"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：校验 DT_NEEDED 的 Kea 库全部随包分发、
      ≥20 个去重后的 libkea-* 库在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 全部
      成功（成对 dlclose），并真实执行包内 kea-dhcp4（-v 输出 3.0.3），
      共 6 项检查（另有逐库 dlopen 结果行）
    command: "./test_ohos_runtime <package>/bin/kea-dhcp4"
    ohos_specific: true

# 鸿蒙特有测试用例统计（本次适配实测：2 个）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <kea-dhcp4> && ./test_ohos_runtime <kea-dhcp4>"
  result: "2/2 passed"

# 用例总数：上游两个注册套件
#   gtest 套件源码宏计 948（2 项 DISABLED_ 由 gtest 标记不运行；真机实测以 gtest 输出为准）
#   shell 进程套件 14 个子用例（真机实测结果见版本级 manifest 与 notes.md）
upstream_case_count: 948
upstream_passed_case_count: 967
upstream_skipped_case_count: 57
upstream_shell_suite_subcases: 14
upstream_shell_suite_result: "14/14 通过（meson OK，exit status 0）"
test_package_assertion_count: 38
assertion_count: 1076  # = 真机实测执行 1038（gtest 1024 + shell 14）+ test_package 38
