  - "0006-src-lib-testutils-sandbox.h.patch"
  - "0007-src-bin-dhcp4-tests-dhcp4_test_utils-unix-socket-check.patch"
  - "0008-src-bin-dhcp4-tests-ctrl_dhcp4_srv_unittest-skip-unix-channel.patch"
  - "0009-src-bin-dhcp4-tests-config-commit-skip-unix-control-sockets.patch"
  - "0010-src-bin-dhcp4-tests-http_control_socket_unittest-tmpdir.patch"
  - "0011-src-bin-dhcp4-tests-meson.build-shell-test-via-sh.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "家族复用取证：kea-dhcp4 与已合入的 kea-perfdhcp / kea-hook-limits / kea-hook-ping-check / kea-hook-flex-option / kea-hook-bootp / kea-hook-ha 同属 Kea 3.0.3 单源码树（src/bin/dhcp4/ 与若干平级目录共用同一顶层 meson.build 与 src/lib/），0001-0005 补丁整组逐字节复用（sha256 逐一核对，见 notes.md），零改动"
  - "Meson 报告 OHOS 为 system='harmonyos'，Kea 的 build_machine.system() 白名单不含它：需在顶层归一化为 linux（补丁 0001）"
  - "OHOS sysroot 的 linux/socket.h 定义 struct sockaddr_storage，与 musl sys/socket.h 冲突：define-guard 重命名（补丁 0002）"
  - "OHOS 内核拒绝 shebang 脚本 execve：conan meson 包装脚本须 sh 前缀调用，Kea configure 期脚本（env.sh/grabber.py/config-report.sh/mk_cfgrpt.sh）须重定义为解释器前缀数组（补丁 0003/0004 与配方 _meson()）"
  - "OHOS /storage 沙箱拒绝符号链接（EPERM）：meson 只以符号链接发布的 soname 名须在 compile 后以复制方式物化（_materialize_sonames），否则 meson test 与运行时加载器按 NEEDED 名查找全部落空"
  - "真机曾出现 /storage 落盘 0 字节瞬时异常：package() 收尾做空产物三重补拷复核自愈（有界重试仍 0 则打包失败），test_package 的逐库 dlopen 测试兜底"
  - "OHOS app 沙箱限制并发进程数：ninja 默认按核数并发触发 posix_spawn EAGAIN，meson compile 须 -j 8"
  - "OHOS 沙箱对 AF_NETLINK 只放行 socket()、拒绝 bind()：Kea Linux IfaceMgr 检测抛 IfaceDetectError；getifaddrs() 回退与上游 BSD/Solaris 实现同构（补丁 0005，kea-hook-ha 引入、本包复用——DHCPv4 服务器测试构造生产 IfaceMgr 检测路径）"
  - "服务器类 CLI 组件的沙箱内消费测试口径：kea-dhcp4 -t（check-only）完整走过 JSON 解析→Dhcp4 元素→全部配置处理器（IfacesConfigParser 带 check_only 参数跳过接口检测），不开 socket 不需 root——比真实 -c 启动低环境依赖，同时覆盖整条配置链"
  - "kea-dhcp4 -W 输出的 configure 报告来自 configure 期 mk_cfgrpt.sh 生成的 config_report.cc：该路径给 OHOS 脚本 execve 修补链（补丁 0003/0004）提供了运行时端到端校验点"
  - "OHOS app 沙箱 /tmp 只读：上游 testutils sandbox 默认在 P_tmpdir（/tmp）建沙箱目录失败且 mkdtemp 返回 NULL 后解引用——补丁 0006 让 sandbox 先行取 TMPDIR；HTTP 控制通道配置写测试同样把路径建在 TMPDIR（补丁 0010）；CtrlChannel 系 fixture 的 Sandbox 成员在构造期即命中（本包实测 Signal 11）"
  - "OHOS 用户存储（hmdfs 挂载）不承载 AF_UNIX pathname socket：控制通道用例须以服务器同款 bind 操作先探测再整体跳过（bind 被拒 EPERM；解析路径超 sockaddr_un.sun_path 上限报 ENAMETOOLONG）——补丁 0007-0009（55 例控制通道服务器用例 + 2 例配置 commit 用例）"
  - "OHOS 内核拒绝 shebang 脚本 execve（与可执行位无关）：meson test 注册的 dhcp4_process_tests.sh 被 meson 直接 spawn 时报 PermissionError [Errno 13]——补丁 0011 把 test() 的 command 改为经 sh 执行（同一内核特性在 configure 期脚本上的表现即补丁 0003/0004 所修）"
  - "kea-dhcp4 的 DT_NEEDED 闭包在最终制品（bin/kea-dhcp4）上以 readelf/dlopen 实证全部随包分发（实测项数见 notes.md），白名单按全树 20 库运行时集合收口"

