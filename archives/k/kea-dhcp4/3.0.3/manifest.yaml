# 版本级 manifest — kea-dhcp4 3.0.3
# 文件位置: archives/k/kea-dhcp4/3.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.3"
software: "kea-dhcp4"

# 编译状态: published | built | failed | archived
status: published

build_date: "2026-10-04"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================

artifacts:
  - "bin/kea-dhcp4"
  - "lib/libkea-*.so* (服务器运行时依赖闭包，20 个 kea 库)"

# ============================================================
# 上游测试（build() 内真实执行）
# ============================================================

upstream_tests:
  command: "meson test -v --timeout-multiplier 10 -C <builddir> kea-dhcp4-tests dhcp4_process_tests.sh"
  suites_run: 2
  # 套件 1：gtest 可执行文件 kea-dhcp4-tests —— 源码 TEST/TEST_F/TEST_P 宏计数
  # （24 个含用例文件，逐文件计数见 test_package/MANIFEST.yml）
  cases_in_source: 948
  cases_in_source_detail: "源码宏计 948（24 个含用例文件）；gtest 二进制真机运行期注册 1024 用例 / 29 套件（含 TEST_P 实例化展开），平台适配跳过的控制通道用例（55+2）含于其中，见 cases_skipped"
  root_cases: 0
  root_cases_detail: "无：测试源码零 geteuid/getuid 守卫、零 GTEST_SKIP；DORA/控制通道用例走模拟报文与回环高位端口，不绑定特权端口 67（报文比对里的 67 为常量）；shell 套件配置 interfaces: [] 同样零特权"
  # 套件 2：shell 进程套件 dhcp4_process_tests.sh —— 14 个子用例（真实 kea-dhcp4 进程）
  shell_suite_subcases: 14
  shell_suite_detail: "pid 文件互斥 / SIGHUP 动态重配置（坏配置保持运行）/ SIGTERM 与 SIGINT 优雅停机 / 版本 / 日志变量 / LFC 定时触发两轮 / 6 项语法校验（成功、坏语法、坏取值、hooks 加载失败、callout 加载失败、callout 轮询失败）/ 密码脱敏"
  # 真机实测（2026-10-04 干净构建）：gtest 运行期 1024 例实跑（967 通过 + 57
  # 平台性 SKIP + 0 失败；另 2 例上游 DISABLED_ 不运行）；shell 套件 14/14
  # 子用例通过；两套件合并执行 1038 例（meson 套件行 Ok: 2 / Fail: 0）
  cases_run: 1038
  cases_passed: 981
  cases_failed: 0
  cases_skipped: 57
  cases_unregistered: 2
  cases_unregistered_reason: "2 个上游 DISABLED_ 前缀用例（Dhcp4ParserTest.DISABLED_Uint32Parser、JSONFileBackendTest.DISABLED_loadAllConfigs）由 gtest 标记为不运行"

# ============================================================
# 鸿蒙特有测试（test_package，2 个用例）
# （test_package 另含 1 个通用消费者契约测试 test_dhcp4.py，与兄弟 kea 配方同构，
#  不属鸿蒙特有；声明见 test_package/MANIFEST.yml 的 test_package_tests）
# ============================================================

ohos_specific_tests:
  count: 2
  entries:
    - "test_package/test_ohos_platform.c → test_ohos_platform（平台 ABI）"
    - "test_package/test_ohos_runtime.c → test_ohos_runtime（运行时闭包）"
  command: "./test_ohos_platform <kea-dhcp4> && ./test_ohos_runtime <kea-dhcp4>"
  checks:
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "e_type == ET_DYN（OHOS 要求的 PIE 可执行文件形态）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so），且不含 GNU libstdc++ 命名"
    - "DT_STRSZ 与 NEEDED 解析守卫：kea 的 dynstr 约 156 KB，超出缓冲即失败而非静默截断"
    - "DT_NEEDED 中的 Kea 库全部随包分发；包内 ≥20 个去重 libkea-*.so* 在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 成功"
    - "真实执行 bin/kea-dhcp4（-v 输出 3.0.3），完整 NEEDED 闭包在 OHOS 运行时可解析"
  # 真机实测（conan create test_package 阶段）：2 个用例程序 2/2 全过
  # （平台 ABI 11 项 + 运行时闭包 6 项检查全过）
  cases_run: 2
  cases_passed: 2
  cases_failed: 0

# ============================================================
