software: kea-dhcp4
display: "ISC Kea DHCPv4 server"
description: "DHCPv4 server daemon shipped with ISC Kea, driven by JSON configuration"
category: network
homepage: "https://www.isc.org/kea/"
license: MPL-2.0
build_system: meson

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Meson 在 OHOS 上报告 system='harmonyos'，Kea 的平台白名单不含它：需归一化为 linux 才能选中 Linux 源码分支"
    - "OHOS sysroot 的 linux/socket.h 与 musl sys/socket.h 都定义 struct sockaddr_storage，包含 netlink 头时需 define-guard"
    - "OHOS 内核拒绝 shebang 脚本 execve：conan 的 bin/meson 包装脚本与 Kea configure 期脚本（env.sh/grabber.py/config-report.sh/mk_cfgrpt.sh）都须经解释器前缀调用；同一特性也命中 meson test() 注册的 shell 套件——meson 直接 spawn 脚本本体报 PermissionError [Errno 13]，须改为经 sh 运行（find_program('sh') + args）"
    - "OHOS /tmp 只读（上游 testutils 测试沙箱默认 P_tmpdir 建目录失败、mkdtemp 返回 NULL 后解引用崩溃）且用户存储（hmdfs）不承载 AF_UNIX pathname socket：测试侧须让沙箱与 HTTP config-write 路径改走 TMPDIR，控制通道用例（unix 命令通道 / 相关配置 commit）用服务器同款 bind 操作探测后按需 GTEST_SKIP"
    - "OHOS 沙箱对 AF_NETLINK 放行 socket() 但拒绝 bind()：IfaceMgr 接口检测需回退 getifaddrs()（服务器测试构造生产 IfaceMgr 路径）"
    - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core 需 BOOST_SP_NO_PTHREAD_SETCANCELSTATE"
    - "OHOS /storage 沙箱拒绝符号链接：meson 只以符号链接发布的 soname 名须在 compile 后以复制方式物化；package() 另做 0 字节落盘三重补拷复核"
    - "OHOS app 沙箱限制并发进程数：meson compile 须限并发 -j 8 防 posix_spawn EAGAIN"
    - "meson 对 clang 默认用裸名 llvm-ar 探测归档器，本环境/CI 上失败：需从 tools.build:compiler_executables 推导绝对路径写入 machine file"
    - "配置期 cpp.run() 探针要求 host 共享依赖在 LD_LIBRARY_PATH 可见（log4cplus shared=True）"
    - "boost 必须固定 1.85.0（1.90/1.91 制品仓包缺 Kea 实际使用的头文件），且 meson 需 >= 1.10"
    - "kea-dhcp4 的产物是可执行文件：包内按 bin/ 落盘并提供 commands.json（R38）"
  common_dependencies:
    - boost
    - log4cplus
    - openssl

# 版本索引（所有已归档版本，含状态）
versions:
  "3.0.3":
    status: built
    build_date: "2026-10-04"
    conan_ref: "kea-dhcp4/3.0.3"
