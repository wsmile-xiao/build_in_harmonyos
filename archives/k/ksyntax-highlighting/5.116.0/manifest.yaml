# 版本级 manifest — KSyntaxHighlighting 5.116.0 (KDE Frameworks 5)
software: ksyntax-highlighting
version: "5.116.0"
status: built
build_date: "2026-09-19"
build_system: cmake

source:
  url: "https://download.kde.org/stable/frameworks/5.116/syntax-highlighting-5.116.0.tar.xz"
  sha256: "6f8ccacebd0dc9ce050b2b23b715750c97938b3336fbbb80967920cb8c1dfaa7"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DQT_MAJOR_VERSION=5"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DQRC_SYNTAX=ON"
    - "-DKSYNTAXHIGHLIGHTING_USE_GUI=ON"
    - "-DKF_SKIP_PO_PROCESSING=ON"
  dependencies:
    - qt5-qtbase/5.15.2.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "KF5 5.116 ECMPoQmTools 支持 KF_SKIP_PO_PROCESSING=ON，无需 poqm 补丁（不同于 KF6 6.18）"
  - "Qt5 组件(Core/Network/Test/Gui) 由 qt5-qtbase/5.15.2.2 提供，测试用例经 Qt5Test"
  - "katehighlightingindexer 在交叉编译下需以 host 工具运行（KF5 5.116 走 ExternalProject 原生化）"
  - "Perl 是 PHP 语法定义生成的 REQUIRED 工具，perl/5.42.2 供应"
  - "QRC_SYNTAX=ON 将语法/主题定义打入库内资源，消费者无需外部数据文件"
