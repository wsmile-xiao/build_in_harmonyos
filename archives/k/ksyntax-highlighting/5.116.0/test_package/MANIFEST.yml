# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ksyntax-highlighting/5.116.0
homepage: "https://invent.kde.org/frameworks/syntax-highlighting"

# 上游测试命令 (用于 make -n check / ctest -N 分析)
upstream_check_command: "ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir {build_folder} --output-on-failure --no-tests=error"

# 上游实际运行的测试程序 (autotests/CMakeLists.txt 注册)
upstream_tests:
  - file: autotests/wildcardmatcher_test.cpp
    source: syntax-highlighting-5.116.0/autotests/wildcardmatcher_test.cpp
    description: "wildcardmatcher_test: wildcard pattern matching"
    command: "./build/autotests/wildcardmatcher_test"
  - file: autotests/repository_test.cpp
    source: syntax-highlighting-5.116.0/autotests/repository_test.cpp
    description: "repository_test: syntax definition repository lookup"
    command: "./build/autotests/repository_test"
  - file: autotests/theme_test.cpp
    source: syntax-highlighting-5.116.0/autotests/theme_test.cpp
    description: "theme_test: theme loading"
    command: "./build/autotests/theme_test"
  - file: autotests/testhighlighter.cpp
    source: syntax-highlighting-5.116.0/autotests/testhighlighter.cpp
    description: "testhighlighter_test: basic syntax highlighter"
    command: "./build/autotests/testhighlighter_test"
  - file: autotests/html/htmlhighlighter_test.cpp
    source: syntax-highlighting-5.116.0/autotests/html/htmlhighlighter_test.cpp
    description: "htmlhighlighter_test: HTML highlighter"
    command: "./build/autotests/htmlhighlighter_test"
  - file: autotests/folding/foldingtest.cpp
    source: syntax-highlighting-5.116.0/autotests/folding/foldingtest.cpp
    description: "folding_test: folding region computation"
    command: "./build/autotests/folding_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ksyntax_highlighting.cpp
    description: "消费者用例: 加载 C++ 语法定义 + 默认主题 (Repository/Definition/Theme 公开 API)"
    command: "./test_ksyntax_highlighting"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
