# kubergrunt 0.19.0 适配清单（Gruntwork，Apache-2.0）
# Go 项目：main 包在 ./cmd，上游用 build-go-binaries 打包
#   --app-name kubergrunt --src-path ./cmd --dest-path ./bin
#   --ld-flags "-X main.VERSION=$CIRCLE_TAG -extldflags '-static'"
# 本配方等价：go build -trimpath -ldflags "-s -w -X main.VERSION=0.19.0" ./cmd
# 本机无 OHOS SDK ⇒ 配方自举 Go 1.26.3 工具链，模块经 goproxy.cn 拉取，
# 在 OHOS 上对工具链与交付二进制用 binary-sign-tool 自签名（E128）。

version: "0.19.0"
status: built

source:
  url: "https://github.com/gruntwork-io/kubergrunt/archive/refs/tags/v0.19.0.tar.gz"
  sha256: "0bc4d67db238b974bb2a80b4786beb8ff3c38b748b3e10448c5f0174c7ead488"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "go build -trimpath -ldflags \"-s -w -X main.VERSION=0.19.0\" -o <ext2>/out/kubergrunt ./cmd"
  cc: go-1.26.3
  notes: "CGO_ENABLED=0 + GOOS=linux + GOARCH=arm64；GOPROXY=goproxy.cn；Go 1.26.3 自举工具链（golang.google.cn/dl.google.com/aliyun 三个镜像）；GOCACHE/GOMODCACHE/GOPATH/GOTMPDIR/TMPDIR 与链接输出全部落在 ext2 分区（E166）"

dependencies: []

patches_applied: []

test:
  upstream_cases: 89
  upstream_suite: "go test -count=1 -json -timeout 300s ./...（cmd/eks/eksawshelper/kubectl/tls 共 5 个含 _test.go 的包，89 个顶层 Test 函数，另含 55 个子测试）"
  runnable: 29
  runnable_note: "29 个离线确定性用例（不依赖 AWS 凭据 / Kubernetes 集群 / terraform）作为硬门禁必须全过；其余 60 个用例依赖外部资源，CI 无凭据无集群，构建日志中如实列出失败清单"
  pass_rate: "离线门禁 29/29 = 100%；全量 89 个顶层用例中 50 pass / 39 fail（失败全部为外部资源依赖，Linux 预检实测）"
  consumer_test: "test_package/consumer_check.py 真跑 bin/kubergrunt：--version/--help/eks --help/k8s --help/tls gen --help 的真实 stdout 与退出码，以及 --issuer-url 缺失、未知子命令、非法 --loglevel 三条失败路径的退出码与 stderr"
  self_checks: 13

knowledge_gained:
  - "kubergrunt 是纯 Go CLI（main 包在 ./cmd），CGO_ENABLED=0 即可产出静态 ELF；-X main.VERSION=<ver> 注入版本号（上游 build-go-binaries 同款）"
  - "go test 的测试二进制由 go 内部生成、无法预先签名 ⇒ 用 go test -exec=<wrapper> 在 execve 前就地签名（E128），参照 aliae 1.5.0"
  - "HMDFS 不支持 getcwd，go 需要从 cwd 向上找 go.mod ⇒ 源码整树复制到 ext2 再构建/测试"
  - "上游 89 个顶层测试中 39 个依赖 AWS 凭据/Kubernetes 集群/terraform，CI 环境无法通过，需在配方里如实统计而非静默跳过"
