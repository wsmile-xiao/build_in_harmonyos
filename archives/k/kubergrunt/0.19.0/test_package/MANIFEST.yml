# kubergrunt/0.19.0 test_package 清单
# 上游测试在 conanfile.py 的 build() 阶段真跑（go test -json ./...），
# 本 test_package 负责消费者视角：真跑 bin/kubergrunt 并做交付形态自检。

package: kubergrunt/0.19.0
homepage: "https://github.com/gruntwork-io/kubergrunt"

# 上游测试命令（值即 build() 里真实执行的命令；OHOS 上追加
# -exec=<go-test-exec.sh> 对 go 内部生成的测试二进制就地签名，E128）
upstream_check_command: "go test -count=1 -json -timeout 300s ./..."
upstream_test_in_build: true
upstream_test_command: "go test -count=1 -json -timeout 300s ./...  -exec=<binary-sign-tool wrapper>"

upstream_tests:
  - file: cmd/common_test.go
    source: kubergrunt-0.19.0/cmd/common_test.go
    description: "main 包 TLS subject-info JSON 解析（2 个顶层 Test）"
    command: "go test -count=1 ./cmd/"
  - file: eksawshelper/arn_test.go
    source: kubergrunt-0.19.0/eksawshelper/arn_test.go
    description: "EKS ARN 解析：cluster name / region（4 个顶层 Test）"
    command: "go test -count=1 ./eksawshelper/"
  - file: kubectl/config_test.go + kubectl/secret_test.go
    source: kubergrunt-0.19.0/kubectl/
    description: "kubeconfig 组装与 Secret 结构（31 个顶层 Test，其中 13 个不依赖集群）"
    command: "go test -count=1 ./kubectl/"
  - file: tls/options_test.go + tls/ecdsa_keys_test.go + tls/rsa_keys_test.go
    source: kubergrunt-0.19.0/tls/
    description: "TLS 选项校验与密钥对生成（33 个顶层 Test，其中 23 个不依赖集群/openssl）"
    command: "go test -count=1 ./tls/"
  - file: eks/deploy_state_test.go + eks/asg_test.go
    source: kubergrunt-0.19.0/eks/
    description: "EKS 部署状态解析与 ASG/实例操作（18 个顶层 Test，其中 8 个不依赖 AWS）"
    command: "go test -count=1 ./eks/"

offline_gating_tests:
  description: "不依赖 AWS 凭据 / Kubernetes 集群 / terraform 的 29 个离线确定性用例，配方里作为硬门禁必须全部通过（见 conanfile.py 的 _OFFLINE_TESTS）"
  count: 29
  packages: "cmd(2) + eksawshelper(4) + kubectl(11) + tls(12)"

test_package_tests:
  - file: consumer_check.py
    description: "消费者用例 C1-C8：真跑 bin/kubergrunt 的 --version/--help/eks --help/k8s --help/tls gen --help 与三条失败路径，断言真实 stdout/stderr/退出码；并做 M1-M13 交付形态自检"
    command: "python3 consumer_check.py <package_folder> --expect-machine aarch64 --expect-version 0.19.0 --require-signature"

assertion_count: 41
