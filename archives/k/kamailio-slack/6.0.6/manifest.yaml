# 版本级 manifest — kamailio-slack 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-slack"
status: published                      # published | built | failed | archived
build_date: "2026-09-26"
build_system: makefile             # kamailio 经典 Makefile 体系（非 autotools/cmake）

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "make cfg include_modules=slack LOCALBASE=<curl package_folder> CURL_BUILDER="
    - "make modules modules=modules/slack -j1 LOCALBASE=<curl package_folder> CURL_BUILDER="
  dependencies:
    - curl/8.15.0.1
  cc: clang
  cxx: clang++

# ============================================================
# 上游测试（R51 三步法台账，完整清单见 notes.md 第四节）
# ============================================================
# 清点面 = 官方源码包内 `test/`、`tests/` 目录文件数（4 个目录 / 17 个文件）
# 实测 = 其中唯一自包含、无需运行中 kamailio 实例的上游 unittest（3 个用例）已真实执行
upstream_tests:
  command: "python3 dbtextdb_test.py -v"
  source_path: "kamailio-6.0.6/utils/kamctl/dbtextdb/dbtextdb_test.py"
  test_count: 17
  executed_count: 3
  passed: 3
  failed: 0
  notes: "17 = 源码包内 test/tests 目录文件数（10 个 dbtextdb 用例数据 + janssonrpcc 3 + rtpproxy 3 + tm 1）。仅 dbtextdb_test.py 可自执行（3 个 unittest 用例，仅依赖 Python 标准库），已在 conanfile.py build() 末尾真实执行；其余文件逐项技术原因见 test_package/MANIFEST.yml 的 upstream_tests[].not_executed_reason。slack 模块自身在源码包内无任何测试文件。"

# ============================================================
# 补丁信息
# ============================================================

# 上游 6.0.6 源码包原生识别 aarch64-unknown-linux-ohos，未应用任何补丁
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`，否则报 No rule to make target 'cfg-defs'"
  - "slack 模块 Makefile 的第三方库探测变量是 CURL_BUILDER（非 net-snmp 系的 BUILDER）：置空即回落 LOCALBASE 分支，宿主 curl-config/pkg-config 不再参与交叉编译"
  - "slack 模块通过 http_client 的 bind_http_client API 发消息（httpc_load_api → find_export），运行期需 http_client 模块先加载；本包只提供 slack.so"
  - "kamailio 同时提供 CMake 与经典 Makefile 两套构建体系；仅打包单个模块时用经典 Makefile 更直接"
