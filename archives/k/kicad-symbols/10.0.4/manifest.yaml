# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "上游 kicad-symbols 10.x 已从“单文件符号库”改为“每符号一文件的 .kicad_symdir 目录”，仓库内 23012 个文件对应 222 个库；顶层 CMakeLists 用 project(kicad-symbols NONE) + tools/kicad_lib_pack.py 把它们重新打包成单文件 .kicad_sym 并改写 sym-lib-table（KICAD_PACK_SYM_LIBRARIES 默认 ON）。复用上游 CMake 而不是自行 copy 文件，可保证产物与 Debian 官方包同构"
- "数据/资源型包不要用 package_type=\"application\"：CI 门禁 L0k（R38）把 package_type==application 直接判定为“含 CLI 工具”，会强制要求软件级 commands.json。资源型包应 package_type=\"unknown\" + cpp_info.resdirs=[\"share\"]（同 E255/E305 模式）"
- "CMake 工程若 project(... NONE)，ConanToolchain 注入的 CMAKE_SYSTEM_NAME/编译器变量均不生效，OHOS 与原生构建产物完全一致——交叉编译风险为零，但需要显式给出 Python3_EXECUTABLE（上游 find_package(Python3) 失败会 FATAL_ERROR）"
- "对 s-expression 数据（.kicad_sym）做括号配平校验必须跳过引号内的括号：属性字符串里含括号，直接 text.count('(')==text.count(')') 会误报（实测 Connector_Generic.kicad_sym 差 60 个）"
- "KiCad 符号可声明 (body_styles demorgan)，此时每个 unit 会输出两套 body style 各含一份引脚，引脚计数是普通符号的 2 倍（74LS00：4 门×3 引脚×2 + 电源单元 2 = 26，而非直觉的 14）"

