# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 门禁 L0e 强制要求）
# 详见: docs/TEST_QUALITY_SPEC.md 与 ci/tools/extract_upstream_tests.sh
#
# 填写方法（本项目为数据/资源型包，标准方法做了适配）:
#   1. 解压上游源码包；
#   2. 本仓库内**没有**任何测试目标（无 make check / 无 ctest / 无 meson test：
#      顶层 CMakeLists.txt 只有 pack_symbols 与 install，project() 为 NONE）；
#   3. 上游的测试在**另一个仓库** kicad-library-utils 中，由 .gitlab-ci.yml 的
#      klc-check 作业调用（见下方 upstream_tests）。

package: kicad-symbols/10.0.4
homepage: "https://gitlab.com/kicad/libraries/kicad-symbols"

# 上游测试命令：本仓库无 make check / ctest 目标；上游 .gitlab-ci.yml 把全部测试
# 委托给 kicad-library-utils 仓库的 klc-check 作业（该作业脚本 check_symbols.sh
# 会再 clone kicad-footprints，并读取 git 历史以对比上一版本）。
upstream_check_command: "klc-check/check_symbols.sh (kicad-library-utils 仓库; 本仓库无 make check / ctest / meson test)"

# conanfile.py build() 方法中是否已集成上游测试
# build() 真实执行上游构建逻辑（CMake pack_symbols → 上游 tools/kicad_lib_pack.py），
# 但其中不含断言型测试，故为 false。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（位于 kicad-library-utils 仓库，无法在本 PR 内联运行：
#   - 需 git 历史（comparelibs.py --old/--new 对比上一版本符号库）
#   - 需 clone https://gitlab.com/kicad/libraries/kicad-footprints.git
#   - klc-check/junit.py → common/rulebase.py → common/print_color.py 的第三方依赖链
# 因此本 PR 以自包含方式等价复现 check_lib_table.py 的全部判定，见 test_package_tests。
upstream_tests:
  - file: klc-check/check_lib_table.py
    source: kicad-library-utils (https://gitlab.com/kicad/libraries/kicad-library-utils)
    description: "符号库表 sym-lib-table 与库文件集合的一致性（Path separators / Incorrect nickname / Extra library / Duplicated library / Missing library / Library table bad lines）"
    command: "python3 klc-check/check_lib_table.py <pkg>/share/kicad/symbols/*.kicad_sym --table <pkg>/share/kicad/template/sym-lib-table"
    verified: "判定逻辑已由 test_package/test_kicad_symbols.py 自包含等价复现并在 CI 真实执行（26/26 断言通过，其中 9 条对应本程序的全部检查项）"
  - file: klc-check/comparelibs.py
    source: kicad-library-utils (https://gitlab.com/kicad/libraries/kicad-library-utils)
    description: "KLC（KiCad Library Convention）规则检查 + 与上一版本符号库对比（--check --check-derived --footprint_directory）"
    command: "python3 klc-check/comparelibs.py -v --old <prev> --new <changed> --check --check-derived --footprint_directory <kicad-footprints> -m"
    verified: "NOT RUN — 需要 git 历史与 kicad-footprints 仓库 clone，离线 CI 无法复现；影响面见 reports/test-report.md‘未纳入的上游测试’一节"

# test_package 中自带的测试（消费者视角验证：真实读取包内库表与 222 个打包符号库）
test_package_tests:
  - file: test_kicad_symbols.py
    description: "消费者测试：解析包内 sym-lib-table（222 项）并与 222 个打包库逐项互验；校验每个库文件的 s-expression 完整性与括号配平；校验 Device:R / Device:C / power:GND / 74xx:74LS00 存在、具备 Reference/Value 属性且引脚数正确"
    command: "python3 -B test_kicad_symbols.py <package_folder>"

# 测试断言总数（test_kicad_symbols.py 实测 26 条）
assertion_count: 26
