# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ksanecore/26.04.0
homepage: "https://invent.kde.org/graphics/ksanecore"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir . --output-on-failure --no-tests=error"

# 上游实际运行的测试程序
# ksanecore 上游 autotests/CMakeLists.txt 仅定义了 ksane_tests() 宏但未
# 注册任何测试（无测试源文件、无 add_test 调用），故上游 CTest 注册数为 0。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：Option/DeviceInformation 公共 API 功能断言（不依赖真实扫描硬件）"
    command: "./test_ksanecore"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
