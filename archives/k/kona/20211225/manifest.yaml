software: kona
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/20211225/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "20211225"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统（顶层字段，用于质量门禁）
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/kevinlawler/kona/archive/refs/tags/Win64-20211225.tar.gz"

  # 源码校验和
  sha256: "cd5dcc03394af275f0416b3cb2914574bf51ec60d1c857020fbd34b5427c5faf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "make CC=clang CFLAGS='-fPIC -O2' PRODFLAGS='-O3 -fPIC' PREFIX=$DEFAULT_PREFIX"
  # Makefile-based build, no configure step

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # kona is self-contained, no external library dependencies

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
# Makefile 补丁：添加 harmonyos 操作系统检测分支、依赖规则块，以及 DESTDIR 安装支持

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "kona 使用 uname -s 做平台检测，HarmonyOS 返回 'harmonyos'，原 Makefile 无此分支"
  - "添加 ifeq (harmonyos,$(OS)) 块，镜像 linux 配置（CFLAGS += -pthread, LDFLAGS = -lm -ldl）"
  - "原 Makefile 的 install target 不支持 DESTDIR，需增加 $(DESTDIR) 前缀和 mkdir"
  - "src/va.c 有 2 个编译警告（long long 到 double 隐式转换），非关键，不影响功能"
  - "kona 是自包含 C 项目，无任何外部库依赖"
  - "知识图谱草稿 E105：Makefile 平台检测模式（类似 E090 meson 平台检测）"

