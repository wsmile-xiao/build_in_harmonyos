software: kleidiai
version: "1.19.0"
status: built
build_date: "2026-09-20"
build_system: cmake
conan_ref: "kleidiai/1.19.0"

source:
  url: "https://github.com/ARM-software/kleidiai/releases/download/v1.19.0/kleidiai-v1.19.0-src.tar.gz"
  sha256: "c50afd97e130f2f68f6adabb881696e410e1b57147dce87443dcd3bba012b287"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DKLEIDIAI_BUILD_TESTS=ON"
    - "-DKLEIDIAI_BUILD_BENCHMARK=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

artifacts:
  static_libraries:
    - lib/libkleidiai.a
  headers:
    - include/kai

knowledge_gained:
  - "KleidiAI 1.19.0 is an aarch64-only static library of Arm micro-kernels with no external runtime dependencies."
  - "CPU feature detection uses getauxval(AT_HWCAP/AT_HWCAP2) under __aarch64__ && __linux__; HarmonyOS musl provides sys/auxv.h and getauxval."
  - "GoogleTest is bundled as third_party/googletest-v1.17.0.zip and fetched locally by CMake FetchContent, so no network access is needed for tests."
  - "HarmonyOS /tmp is read-only, but googletest hard-codes /tmp/ for captured stream files; the recipe rewrites it to a writable build-folder path before compiling tests."
  - "The monolithic kleidiai_test binary runs the whole suite in a single process in ~59s; ctest per-test process spawns are far too slow for 58k parameterized cases."

validation:
  ohos_shadow_ci:
    conan_create: passed
    l0: pass
    l1: pass
    l2: skip
    l4: pass
    l5: pass
    upstream_tests: "22203 passed / 36182 skipped / 0 failed (58385 total)"
    consumer_assertions: "10/10"
