knowledge_gained:
  - "KItemViews registers only 1 ctest test (autotests/klistwidgetsearchlinetest via ecm_add_test); the tests/ directory programs use ecm_mark_as_test(), which never calls add_test() — they are interactive GUI demos (app.exec()/QDialog::exec()), so upstream automated coverage is 1 test, not 4."
  - "The OHOS toolchain maps os=OHOS to CMAKE_SYSTEM_NAME=HarmonyOS (no UNIX, cross-compiling); forcing CMAKE_SYSTEM_NAME=Linux restores UNIX=1 and makes the ECM ctest registration build the tests, which is required for R51 to have any runnable upstream test."
  - "BUILD_DESIGNERPLUGIN defaults ON for a non-cross build and src/designer links Qt5Designer/Qt5UiPlugin (not in qt5-qtbase); it must be disabled explicitly."
  - "E537-class: OHOS refuses to mmap PROT_EXEC a shared library whose ELF was rewritten after linking; CMAKE_BUILD_WITH_INSTALL_RPATH=ON makes the linker write the final install RPATH so the install step does not rewrite libKF5ItemViews.so."
  - "Unversioned DT_SONAME (CMAKE_PLATFORM_NO_VERSIONED_SONAME + CMAKE_SHARED_LIBRARY_SONAME_{C,CXX}_FLAG) and the mkspec/qplatformdefs + AUTOMOC/AUTORCC/AUTOUIC wiring are reused verbatim from the validated kcoreaddons5/kconfig5 KF5 skeleton."
