version: 1
package: kitemviews5/5.116.0
homepage: https://invent.kde.org/frameworks/kitemviews

tests:
  upstream:
    status: planned
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    source: "kitemviews-5.116.0/autotests/ + kitemviews-5.116.0/tests/"
    expected:
      - kitemviews-klistwidgetsearchlinetest
      - kcategorizedviewtest
      - kwidgetitemdelegatetest
      - ktreewidgetsearchlinetest
  package:
    status: planned
    source: test.cpp
    command: "./test_kitemviews5"
    description: >-
      Drives the real KItemViews public API (KListWidgetSearchLine,
      KTreeWidgetSearchLine, KFilterProxySearchLine,
      KCategorizedSortFilterProxyModel, KCategorizedView, KCategoryDrawer) and
      asserts HarmonyOS-specific behaviour: the offscreen QPA platform plugin
      is active and the loaded libKF5ItemViews.so carries the unversioned
      DT_SONAME plus a DT_RUNPATH (E537 install-RPATH adaptation).

notes:
  - "KItemViews is a pure Qt5 Widgets library; OHOS runs it headless through
     the offscreen QPA platform plugin (QT_QPA_PLATFORM=offscreen)."
  - "The recipe forces CMAKE_SYSTEM_NAME=Linux so CMake defines UNIX and does
     not report a cross build; without that ECM skips the ctest registration
     of the upstream tests and the POSIX flag/rpath settings."
  - "Upstream tests are run from build() with ctest; any test that cannot run
     in the headless sandbox is listed in notes.md with the concrete reason."
