software: knighttime
version: "6.7.2"
status: built
build_date: "2026-09-19"
conan_ref: "knighttime/6.7.2"
source:
  url: "https://invent.kde.org/plasma/knighttime/-/archive/v6.7.2/knighttime-v6.7.2.tar.gz"
  sha256: "0e5ea2dde7893e82b873765b64fc0651f788d3ef7ae0b33f00bbb76cff794505"
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
    - "BUILD_TESTING=ON"
    - "KF_IGNORE_PLATFORM_CHECK=TRUE"
    - "CMAKE_CXX_STANDARD=20 (upstream sets 23, OHOS clang15/libc++ compiles cleanly under 20)"
  dependencies:
    - "qtbase/6.11.1"
    - "qtbase-sql-dbus/6.11.1 (Qt6::DBus provider)"
    - "qtpositioning/6.11.1"
    - "kholidays/6.28.0"
    - "kconfig/6.26.0"
    - "kcoreaddons/6.26.0"
    - "kdbusaddons/6.18.0"
    - "ki18n/6.26.0"
    - "extra-cmake-modules/6.29.0 (tool)"
  cc: clang
  cxx: clang++
patches_applied:
  - "0002-relax-kf6-min-version-for-ohos-ecosystem.patch"
knowledge_gained:
  - "knighttime is a C++ library (KNightTime) + daemon, not a pure QML plasmoid: KHolidays::SunEvents is the core dependency for the sun-driven dark-light schedule"
  - "Upstream CMAKE_CXX_STANDARD 23 not needed for OHOS clang15: sources compile cleanly under C++20 (no C++23-specific features in the 6.7.2 source)"
  - "Qt6::DBus exists only in qtbase-sql-dbus/6.11.1 (plain qtbase has FEATURE_dbus=OFF); mixing qtbase + qtbase-sql-dbus in one graph is safe (different package names by design)"
  - "KF6 kdbusaddons version matrix on OHOS: 6.18 (qtbase-sql-dbus ecosystem) vs 6.29 (qtbase/6.11.1.1 ecosystem) are mutually exclusive via conan version conflicts; upstream KF6_MIN_VERSION gates need a portability patch when picking the older ecosystem"
  - "QT_ADDITIONAL_PACKAGES_PREFIX_PATH points Qt6Config at split Qt module packages (qtpositioning), same mechanism as qtdeclarative in kholidays"
  - "KDarkLightSchedule::forecast(dateTime, morning, evening, duration, N) returns N+1 cycles (N full days + in-progress anchor); KDarkLightTransition::test() has a 60s tolerance"
upstream_test_pass_rate: "3/3 (100%)"
adapted_test_pass_rate: "100% (consumer test 16/16 assertions)"
test_command: "conan create . --build=missing"
