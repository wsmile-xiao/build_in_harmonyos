package: knighttime/6.7.2
homepage: "https://invent.kde.org/plasma/knighttime"
upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build-dir> --output-on-failure --no-tests=error"
upstream_tests:
  - file: autotests/transition_test.cpp
    description: "Upstream KDarkLightTransition relation/progress test"
  - file: autotests/cycle_test.cpp
    description: "Upstream KDarkLightCycle navigation test"
  - file: autotests/schedule_test.cpp
    description: "Upstream KDarkLightSchedule forecast/serialization test"
upstream_test_note: >-
  3 upstream autotests registered by autotests/CMakeLists.txt under
  BUILD_TESTING; executed via ctest during conan create with the offscreen
  Qt platform and an isolated XDG/HOME environment.
test_package_tests:
  - file: test_knighttime.cpp
    description: >-
      Real consumer test: find_package(KNightTime) + KNightTime link;
      fixed-times forecast (7 cycles, 30min transitions, relation
      classification, progress midpoint), next/previous transition
      navigation, toState/fromState serialization round-trip, and the
      sun-driven forecast for Beijing exercising KHolidays::SunEvents
      end to end.
    command: "test_knighttime"
assertion_count: 16
