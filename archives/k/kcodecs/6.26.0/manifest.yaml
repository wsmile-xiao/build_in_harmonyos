knowledge_gained:
  - "kcodecs 6.26.0 keeps the same OHOS adaptation set as 6.18.0: disable ecm_install_po_files_as_qm (Qt6LinguistTools unavailable), libiconv fallback for RFC2047 legacy charset decoding (qtbase built without ICU)."
  - "cmake_minimum_required raised from 3.21 (6.18.0) to 3.29; Qt minimum 6.9 satisfied by qtbase/6.11.1."
  - "The 6.18.0 patch hunks required regeneration for 6.26.0: src/CMakeLists.txt gained target_compile_features(KF6Codecs PUBLIC cxx_std_20) between the include_directories and link_libraries lines, and parseEncodedWord now calls QStringDecoder(defaultCS) without .constData()."
  - "6.26.0 news: maybeCharset in parseEncodedWord is now a QByteArrayView, so the iconv-fallback conversionCharset needs QByteArray(maybeCharset) explicit conversion."
  - "6.26.0 news: kencodingproberunittest (new upstream test) does not link KF6::Codecs, so cxx_std_20 is not propagated and it compiles with -std=c++17 breaking std::span; patched with explicit target_compile_features(kencodingproberunittest PRIVATE cxx_std_20)."
  - "6.26.0 news: kcharsets.cpp uses std::string_view <=> std::string_view which the OHOS libc++ (clang 15 toolchain) does not implement; patched to compare() <=> 0 (built-in integer <=>)."
  - "rfc2047test 'working-QP' rows expect QStringEncoder('ISO-8859-15'); without ICU the encoder is invalid and KCodecs falls back to the System codec ('Locale'), so the test is on the runner's exclusion list (environment limitation, kconfig precedent)."
