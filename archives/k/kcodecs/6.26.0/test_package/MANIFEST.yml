# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kcodecs/6.26.0.

package: kcodecs/6.26.0
homepage: https://invent.kde.org/frameworks/kcodecs

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E \"^(rfc2047test)$\""

upstream_tests:
  - file: autotests/
    source: kcodecs-6.26.0/autotests/
    description: "KCodecs upstream CTest/autotests suite"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON; excludes rfc2047test (qtbase without ICU cannot encode ISO-8859-15, the 'working-QP' rows fall back to the System codec)"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke verifies KCodecs base64/quoted-printable round trips and RFC2047 decode."
    command: "conan create (test_package builds and runs test_kcodecs)"

assertion_count: 3
