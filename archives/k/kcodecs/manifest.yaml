software: kcodecs
display: "KCodecs"
description: "KDE Frameworks 6 string/text codecs (base64/uuencode/quoted-printable, RFC2047, charset encoding detection)"
category: library
homepage: "https://invent.kde.org/frameworks/kcodecs"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "ecm_install_po_files_as_qm(poqm) patched out: Qt6LinguistTools not published to ohpcd"
    - "libiconv fallback for RFC2047 legacy charset decoding because qtbase is built without ICU on OHOS"
    - "ECM_MODULE_PATH set manually: CMakeDeps-generated ECMConfig.cmake does not propagate it"
    - "conan_cmakedeps_paths.cmake written by the recipe: qtbase uses cmake_find_mode=none"
  common_dependencies:
    - qtbase
    - ecm
    - libiconv

versions:
  "6.26.0":
    status: built
    build_date: "2026-09-05"
    conan_ref: "kcodecs/6.26.0"
  "6.18.0":
    status: built
    build_date: "2026-08-20"
    conan_ref: "kcodecs/6.18.0"
  "6.14.0":
    status: built
    build_date: "2026-08-11"
    conan_ref: "kcodecs/6.14.0"
