knowledge_gained:
  - "kcodecs 6.26.0.1（本版）：配方与已发布 6.26.0 内容一致（仅版本号字符串）。.1 由 kio/6.26.0.1 闭包版本对齐驱动（下游 kcompletion/6.26.0.1、kconfigwidgets/6.18.0.1 精确 require kcodecs/6.26.0.1）；该引用配方尚未合入 main，本 PR 为闭包前置发布，制品仓不支持同版本多 revision 并存（R37）。"
  - "kcodecs 6.26.0 / 6.26.0.1（基线）：OHOS 原生构建落在 CMake Generic 平台模块（无 Platform/HarmonyOS），CMAKE_SHARED_LIBRARY_SONAME_* 为空 → 必须注入 -Wl,-soname, 才能让 VERSION/SOVERSION 生效并产生 DT_SONAME。"
  - "kcodecs 6.26.0 keeps the same OHOS adaptation set as 6.18.0: disable ecm_install_po_files_as_qm (Qt6LinguistTools unavailable), libiconv fallback for RFC2047 legacy charset decoding (qtbase built without ICU)."
  - "cmake_minimum_required raised from 3.21 (6.18.0) to 3.29; Qt minimum 6.9 satisfied by qtbase/6.11.1."
  - "kencodingproberunittest（6.26.0 新上游测试）未链接 KF6::Codecs，C++20 特性不传递，OHOS 工具链下以 c++17 编译 std::span 失败 → 补丁 0004 显式加 cxx_std_20（仅 CMake，未改测试源码）。"
  - "kcharsets.cpp 使用 std::string_view <=> std::string_view，OHOS libc++（clang 15）未实现 → 补丁 0005 改为 compare() <=> 0。"
  - "rfc2047test 的 working-QP 行依赖 ICU 提供的 ISO-8859-15 编码器；OHOS qtbase 无 ICU 时 KCodecs 回退 System codec，属环境限制，按 kconfig 6.26.0 排除清单先例运行期排除（用例仍编译）。"
