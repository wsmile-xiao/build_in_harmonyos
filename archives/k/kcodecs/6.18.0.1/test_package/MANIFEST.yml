# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kcodecs/6.18.0.1.

package: kcodecs/6.18.0.1
homepage: https://invent.kde.org/frameworks/kcodecs

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: autotests/
    source: kcodecs-6.18.0/autotests/
    description: "KCodecs upstream CTest/autotests suite"
    command: "ctest --output-on-failure"
    condition: "not run in the Conan build because BUILD_TESTING=OFF"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke verifies KCodecs base64 encode/decode round trip."
    command: "conan create (test_package builds and runs test_kcodecs)"

assertion_count: 1
