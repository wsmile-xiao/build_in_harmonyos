# kubeseal/0.35.0 test_package 清单
# 上游测试在 conanfile.py 的 build() 阶段真跑（go test -count=1 -json ./...），
# 本 test_package 负责消费者视角：真跑 bin/kubeseal + bin/controller（11 个用例）
# 与 14 项交付形态自检。

package: kubeseal/0.35.0
homepage: "https://github.com/bitnami-labs/sealed-secrets"

# 上游测试命令（值即 build() 里真实执行的命令；OHOS 上追加
# -exec=<go-test-exec.sh> 对 go 内部生成的测试二进制就地签名，E128）
upstream_check_command: "go test -count=1 -json -timeout 300s ./..."
upstream_test_in_build: true
upstream_test_command: "go test -count=1 -json -timeout 300s ./...  -exec=<binary-sign-tool wrapper>"

upstream_tests:
  - file: pkg/kubeseal/kubeseal_test.go
    source: sealed-secrets-0.35.0/pkg/kubeseal/kubeseal_test.go
    description: "kubeseal 加解密核心（11 个顶层 Test：证书解析、seal/unseal、命名空间与 scope）"
    command: "go test -count=1 ./pkg/kubeseal/"
  - file: pkg/apis/sealedsecrets/v1alpha1/sealedsecret_test.go
    source: sealed-secrets-0.35.0/pkg/apis/sealedsecrets/v1alpha1/sealedsecret_test.go
    description: "SealedSecret v1alpha1 转换与语义（20 个顶层 Test）"
    command: "go test -count=1 ./pkg/apis/sealedsecrets/v1alpha1/"
  - file: pkg/controller/*_test.go
    source: sealed-secrets-0.35.0/pkg/controller/
    description: "控制器键管理/条件/指标/键注册表（27 个顶层 Test，其中 TestHttpCert 固定占 TCP :8080、属环境依赖已单列）"
    command: "go test -count=1 ./pkg/controller/"
  - file: cmd/kubeseal/main_test.go + cmd/controller/main_test.go
    source: sealed-secrets-0.35.0/cmd/
    description: "两个 CLI 的版本/帮助/参数处理（6 + 1 个顶层 Test）"
    command: "go test -count=1 ./cmd/kubeseal/ ./cmd/controller/"
  - file: pkg/crypto/keys_test.go, pkg/flagenv/flagenv_test.go, pkg/pflagenv/flagenv_test.go, pkg/multidocyaml/multidocyaml_test.go
    source: sealed-secrets-0.35.0/pkg/
    description: "密钥/环境变量 flag/多文档 YAML 工具（各 1 个顶层 Test）"
    command: "go test -count=1 ./pkg/crypto/ ./pkg/flagenv/ ./pkg/pflagenv/ ./pkg/multidocyaml/"
  - file: integration/integration_suite_test.go
    source: sealed-secrets-0.35.0/integration/
    description: "⚠ 默认不调度（不计入门禁）：//go:build integration 标记，需要真实 K8s 集群"
    command: "go test -tags integration ./integration/"

offline_gating_tests:
  description: "上游 9 个测试包的 68 条离线确定性用例（69 条调度用例减去 1 条环境依赖的 TestHttpCert）作为硬门禁：不得有失败、不得少跑（见 conanfile.py 的 _GATED_PACKAGES/_ENV_DEPENDENT_TESTS）"
  count: 68
  packages: "cmd/controller 1 + cmd/kubeseal 6 + pkg/apis/sealedsecrets/v1alpha1 20 + pkg/controller 26 + pkg/crypto 1 + pkg/flagenv 1 + pkg/kubeseal 11 + pkg/multidocyaml 1 + pkg/pflagenv 1"

test_package_tests:
  - file: consumer_check.py
    description: "消费者用例 C1-C11：kubeseal --version/--help、离线 SealedSecret 加解密往返（json 与 yaml 两条路径、逐字段比对原 Secret）、用错私钥必须解不开（no key could decrypt secret）、缺证书文件、非法输入，以及 controller --version/--help；并做 M1-M14 交付形态自检（含 bin/ 集合与 commands.json 声明一致）"
    command: "python3 consumer_check.py <package_folder> --expect-machine aarch64 --expect-version v0.35.0 --require-signature"

assertion_count: 55
