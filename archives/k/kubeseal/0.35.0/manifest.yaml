# kubeseal 0.35.0 适配清单（bitnami-labs/sealed-secrets，Apache-2.0）
# 单模块双命令 Go 项目（go.mod 要求 go 1.25.7）：
#   cmd/kubeseal   → bin/kubeseal（客户端：离线用 RSA 证书把 Secret 加密成 SealedSecret）
#   cmd/controller → bin/controller（sealed-secrets 控制器，即服务端）
# 上游 Makefile 用 `go build -o $@ $(GO_FLAGS) -ldflags "-X main.VERSION=$(VERSION)"`
# （VERSION 取 `git describe --exact-match` 的 tag；不加 -X 时源码默认值是 UNKNOWN），
# 本配方等价命令：
#   go build -trimpath -ldflags "-s -w -X main.VERSION=v0.35.0" -o <ext2>/out/<name> ./cmd/<name>
# 本机无 OHOS SDK ⇒ 配方自举 Go 1.26.3 工具链，模块经 goproxy.cn 拉取，
# 在 OHOS 上对工具链与两个交付二进制用 binary-sign-tool 自签名（E128）。

version: "0.35.0"
status: built

source:
  url: "https://github.com/bitnami-labs/sealed-secrets/archive/refs/tags/v0.35.0.tar.gz"
  sha256: "2ded0a68ee2a39f32214c6c11c4f6ba5597bc383cf1359594e95b9eede349fc1"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "go build -trimpath -ldflags \"-s -w -X main.VERSION=v0.35.0\" -o <ext2>/out/kubeseal ./cmd/kubeseal"
    - "go build -trimpath -ldflags \"-s -w -X main.VERSION=v0.35.0\" -o <ext2>/out/controller ./cmd/controller"
  cc: go-1.26.3
  notes: "CGO_ENABLED=0 + GOOS=linux + GOARCH=arm64；GOPROXY=goproxy.cn；Go 1.26.3 自举工具链（golang.google.cn / dl.google.com / aliyun 三镜像）；GOCACHE/GOMODCACHE/GOPATH/GOTMPDIR/TMPDIR 与链接输出全部落在 ext2 分区（E166）；源码整树复制到 ext2（E046/HMDFS 无 getcwd）"

dependencies: []

patches_applied: []

test:
  upstream_cases: 112
  upstream_suite: "go test -count=1 -json -timeout 300s ./...（9 个包被调度：cmd/controller、cmd/kubeseal、pkg/apis/sealedsecrets/v1alpha1、pkg/controller、pkg/crypto、pkg/flagenv、pkg/kubeseal、pkg/multidocyaml、pkg/pflagenv；69 个顶层 Test 函数 + 43 个子测试 = 112 个用例事件）"
  runnable: 68
  runnable_note: "68 条离线确定性用例（69 条调度用例减去 1 条环境依赖的 pkg/controller/TestHttpCert）为硬门禁：不得有失败、不得少跑；TestHttpCert 固定绑定 TCP :8080 并 http.Get 它，端口被占用时必然失败（本机已复现 'listen tcp :8080: bind: address already in use'），如实单列不计入门禁"
  pass_rate: "Linux/x86_64 预检：112 个用例事件 pass 111 / fail 1 = 99.1%；硬门禁 68/68 = 100%（唯一失败项 TestHttpCert 为固定端口的环境依赖，见上）"
  consumer_test: "test_package/consumer_check.py 真跑 bin/kubeseal 与 bin/controller 共 11 个用例：版本串（v0.35.0）、--help、**离线 SealedSecret 加解密往返**（json 与 yaml 两条路径，逐字段比对原 Secret 的 data.foo/data.hello）、用错私钥必须解不开（no key could decrypt secret）、缺证书文件、非法输入，以及 controller 的版本/帮助"
  self_checks: 14

knowledge_gained:
  - "上游 release 的版本串靠 `-X main.VERSION=$(git describe --exact-match --tags)` 注入；tarball 里没有 .git ⇒ 必须显式注入 v0.35.0，否则两个二进制都打印 UNKNOWN（pkg/buildinfo.DefaultVersion）"
  - "pkg/controller/TestHttpCert 固定绑定 TCP :8080 并真实 http.Get 它，属固定端口的环境依赖（端口被占用即失败），不能进离线确定性门禁"
  - "controller 用的是 k8s flag 包：--help 写 stderr（kubeseal 写 stdout），消费者用例需合并两条流断言"
  - "integration 套件需要真实 K8s 集群，带 //go:build integration 标记，默认 go test ./... 不调度"
