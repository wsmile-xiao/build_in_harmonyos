knowledge_gained:
  - "kquickcharts is a pure QML module (org.kde.quickcharts): it installs NO public C++ headers; the API is the QML types BarChart/LineChart/PieChart (consumed via QML import, not find_package)"
  - "qt_add_qml_module (Qt 6.11) clears VERSION/SOVERSION on the backing library target, so the built .so has no ELF SONAME and plugins/tests record a relative DT_NEEDED ('../bin/libQuickCharts.so') that only resolves against the CWD. Fix: force -Wl,-soname,libQuickCharts.so.1 via LINK_FLAGS (patch) and create versioned .so symlinks in build bin + package lib."
  - "CMakeDeps-generated ECMConfig.cmake does not define ECM_GLOBAL_FIND_VERSION; ECM's QtVersionOption then defaults to Qt5 (KDEInstallDirs5/ECMQmlModule5) and configure aborts with add_library CMP0002. Must set ECM_GLOBAL_FIND_VERSION >= 5.240 (use 6.26.0) in the toolchain."
  - "CMakeDeps ECMConfig.cmake also does not set ECM_MODULE_DIR (needed by KDEInstallDirs for ECMQueryQt.cmake) or ECM_MODULE_PATH; both must be set manually."
  - "qt6_add_shaders runs the qsb host tool which loads Qt6Core: the build must run with qtbase+qtshadertools libs on LD_LIBRARY_PATH (qsb is an OHOS arm64 binary that runs on this host)."
  - "ecm/6.28.0 is NOT published on ohpcd (only 6.20.0/6.26.0/7.0.7); lower find_package(ECM 6.28.0) to 6.26.0 AND KF_DEP_VERSION so the installed KF6QuickChartsConfig.cmake asks for ECM 6.26.0."
