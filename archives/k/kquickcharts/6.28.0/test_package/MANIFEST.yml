# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kquickcharts/6.28.0
homepage: "https://invent.kde.org/frameworks/kquickcharts"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --test-dir <build> --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software QML2_IMPORT_PATH=<dep qml>:<build bin> ctest --test-dir <build> --output-on-failure"

# 上游实际运行的测试程序 (autotests/CMakeLists.txt: ecm_add_tests + add_qml_tests)
upstream_tests:
  - file: autotests/ArraySourceTest.cpp
    source: kquickcharts-6.28.0/autotests/ArraySourceTest.cpp
    description: "C++ unit test for the ArraySource data source"
    command: "./ArraySourceTest"
  - file: autotests/MapProxySourceTest.cpp
    source: kquickcharts-6.28.0/autotests/MapProxySourceTest.cpp
    description: "C++ unit test for the MapProxySource data source"
    command: "./MapProxySourceTest"
  - file: autotests/HistoryProxySourceTest.cpp
    source: kquickcharts-6.28.0/autotests/HistoryProxySourceTest.cpp
    description: "C++ unit test for the HistoryProxySource data source"
    command: "./HistoryProxySourceTest"
  - file: autotests/ItemBuilderTest.cpp
    source: kquickcharts-6.28.0/autotests/ItemBuilderTest.cpp
    description: "C++ unit test for ItemBuilder (chart item construction)"
    command: "./ItemBuilderTest"
  - file: autotests/tst_BarChart.qml
    source: kquickcharts-6.28.0/autotests/tst_BarChart.qml
    description: "QML test for BarChart rendering (qmltest driver)"
    command: "./bin/qmltest -platform offscreen -import <build>/bin -input tst_BarChart.qml"
  - file: autotests/tst_LineChart.qml
    source: kquickcharts-6.28.0/autotests/tst_LineChart.qml
    description: "QML test for LineChart rendering (qmltest driver)"
    command: "./bin/qmltest -platform offscreen -import <build>/bin -input tst_LineChart.qml"
  - file: autotests/tst_PieChart.qml
    source: kquickcharts-6.28.0/autotests/tst_PieChart.qml
    description: "QML test for PieChart rendering (qmltest driver)"
    command: "./bin/qmltest -platform offscreen -import <build>/bin -input tst_PieChart.qml"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_kquickcharts.cpp
    description: "Consumer test: QQmlEngine loads org.kde.quickcharts and instantiates BarChart/LineChart/PieChart, feeds ArraySource, reads properties back"
    command: "./test_kquickcharts"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
