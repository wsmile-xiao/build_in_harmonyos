software: kquickcharts
display: "KQuickCharts"
description: "KDE Frameworks 6 - Qt Quick Charts (QML module org.kde.quickcharts: BarChart, LineChart, PieChart)"
category: graphics
homepage: "https://invent.kde.org/frameworks/kquickcharts"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "Pure QML module: no public C++ headers; API is the QML types BarChart/LineChart/PieChart consumed via import org.kde.quickcharts"
    - "qt_add_qml_module clears VERSION/SOVERSION on the backing library; force -Wl,-soname and create versioned .so symlinks so plugins resolve libQuickCharts.so.1 via LD_LIBRARY_PATH (not CWD-relative '../bin/...')"
    - "CMakeDeps ECMConfig.cmake lacks ECM_GLOBAL_FIND_VERSION/ECM_MODULE_DIR/ECM_MODULE_PATH; set all three manually (otherwise ECM defaults to Qt5 and configure fails with add_library CMP0002)"
    - "ecm/6.28.0 not published on ohpcd; use ecm/6.26.0 with a lowered find_package(ECM) and KF_DEP_VERSION"
    - "qt6_add_shaders invokes the qsb host tool; build must export qtbase+qtshadertools libs on LD_LIBRARY_PATH"
    - "Upstream autotests: 4 C++ + 3 QML via qmltest, run under QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software (7/7 pass)"
  common_dependencies:
    - qtbase
    - qtdeclarative
    - qtshadertools
    - ecm

versions:
  "6.28.0":
    status: built
    build_date: "2026-09-19"
    conan_ref: "kquickcharts/6.28.0"
