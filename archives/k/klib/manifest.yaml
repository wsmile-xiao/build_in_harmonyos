software: klib
display: "klib"
description: "Standalone and lightweight generic C library"
category: library
homepage: "https://github.com/attractivechaos/klib"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Packages upstream headers and component C sources without inventing a monolithic library"
    - "Pins a dated snapshot because upstream publishes no formal releases"
    - "Preserves and compiles all 19 upstream Makefile targets"
  common_dependencies:
    - zlib

