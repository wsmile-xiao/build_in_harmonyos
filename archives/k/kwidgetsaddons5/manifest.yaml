software: kwidgetsaddons5
display: "KWidgetsAddons (KF5)"
description: "KDE Frameworks 5 (Qt5) widgets add-ons: KPageWidget/KMessageWidget/KDatePicker/KPasswordDialog/KColorScheme/KColumnResolver and 30+ widget helpers (libKF5WidgetsAddons)"
category: library
homepage: "https://invent.kde.org/frameworks/kwidgetsaddons"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "QT_MAJOR_VERSION=5 forced in the toolchain: ECM 6.26 QtVersionOption would default BUILD_WITH_QT6=ON (ECM >= 5.240) and steer the KF5 branch at Qt6"
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "BUILD_DESIGNERPLUGIN=OFF: Qt5UiPlugin not part of the qt5-qtbase package"
    - "ecm_install_po_files_as_qm(poqm) patched out: Qt5LinguistTools not part of the qt5-qtbase package"
    - "setAccessibleName in KPasswordDialog guarded with #ifndef QT_NO_ACCESSIBILITY: qt5-qtbase is configured -no-accessibility"
    - "qt_wrap_ui provisioned by appending an include of qt5-qtbase Qt5WidgetsMacros.cmake to conan_toolchain.cmake; CMakeAUTOMOC/AUTORCC/AUTOUIC executables pointed at qt5-qtbase bin tools"
    - "QT_CORE_LIB/QT_GUI_LIB/QT_WIDGETS_LIB/QT_TEST_LIB defined build-wide: CMakeDeps-regenerated Qt5 configs carry no INTERFACE_COMPILE_DEFINITIONS and QTEST_MAIN/qtest_gui.h gating would break autotest compilation"
    - "Unversioned DT_SONAME emitted explicitly (CMAKE_PLATFORM_NO_VERSIONED_SONAME + -Wl,-soname,) because HarmonyOS is not the Linux CMake platform"
    - "Two upstream autotests excluded on the OHOS headless runner: ktooltipwidgettest (offscreen hang) and kwidgetsaddons-kcolumnresizertest (offscreen geometry assert)"
  common_dependencies:
    - qt5-qtbase
    - ecm

versions:
  "5.116.0":
    status: built
    build_date: "2026-09-18"
    conan_ref: "kwidgetsaddons5/5.116.0"
