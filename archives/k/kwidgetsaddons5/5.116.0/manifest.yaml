knowledge_gained:
  - "kwidgetsaddons 5.116.0 (KF5) needs only Qt5Widgets (>= 5.15.2) + ECM (>= 5.116.0); with QT_MAJOR_VERSION=5 forced in the toolchain, ECM 6.26's QtVersionOption keeps the project on Qt5 (BUILD_WITH_QT6 would default ON for ECM >= 5.240) and KDEInstallDirs dispatches to the Qt5 variants."
  - "qt5-qtbase/5.15.2.2 ships Qt5Widgets plus bin/moc, bin/uic, bin/rcc and lib/cmake/Qt5Widgets/Qt5WidgetsMacros.cmake; the CMakeDeps configs regenerated from its cpp_info define no Qt5 macros and no QT_*_LIB interface defines, so qt_wrap_ui (src/ + tests/) must be provisioned by appending an include of Qt5WidgetsMacros.cmake to conan_toolchain.cmake and QT_CORE_LIB/QT_GUI_LIB/QT_WIDGETS_LIB/QT_TEST_LIB must be defined build-wide, otherwise QTEST_MAIN instantiates QCoreApplication and qtest.h omits qtest_gui.h so autotests using QTest::keyClick/qWaitForWindowExposed fail to compile."
  - "kwidgetsaddons 5.116.0 uses the same CTest names as 6.x for the problematic pair (ktooltipwidgettest, kwidgetsaddons-kcolumnresizertest via NAME_PREFIX); 26 CTest entries total; tests/ holds manual GUI apps (ecm_mark_as_test only, no ctest entries)."
  - "qt5-qtbase is configured -no-accessibility: kpassworddialog.cpp 5.116.0 carries the only unguarded setAccessibleName call (kcapacitybar/kcollapsiblegroupbox/kled already have the #ifndef QT_NO_ACCESSIBILITY guard upstream); patching the same guard in keeps the build compiling."
  - "5.116.0 has no BUILD_PYTHON_BINDINGS option (KF6-only); the 6.x recipe knob must not be copied."
