# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kwidgetsaddons5/5.116.0.

version: 1
package: kwidgetsaddons5/5.116.0
homepage: https://invent.kde.org/frameworks/kwidgetsaddons

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "conan create 内嵌上游 autotests（BUILD_TESTING=ON，ctest 执行，排除 OHOS headless 不适用的 ktooltipwidgettest 与 kwidgetsaddons-kcolumnresizertest）"

upstream_tests:
  - file: autotests/
    source: kwidgetsaddons-5.116.0/autotests/
    description: "KWidgetsAddons upstream CTest/autotests suite (26 tests; 2 excluded for OHOS headless/offscreen limits, kwidgetsaddons 6.x precedent)"
    command: "ctest --output-on-failure --timeout 60 -E '^(ktooltipwidgettest|kwidgetsaddons-kcolumnresizertest)$'"
    condition: "run inside the Conan build (BUILD_TESTING=ON) under QT_QPA_PLATFORM=offscreen; ktooltipwidgettest hangs and kwidgetsaddons-kcolumnresizertest asserts offscreen-only layout geometry under the offscreen QPA platform"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke creates KPageWidgetModel and checks addPage/rowCount behavior."
    command: "conan create (test_package builds and runs test_kwidgetsaddons5)"

assertion_count: 2
