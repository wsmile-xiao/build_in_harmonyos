patches:
  "5.116.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Comment out ecm_install_po_files_as_qm(poqm): the qt5-qtbase package does not ship Qt5LinguistTools (lconvert/lrelease), so translating the poqm catalogs would fail during the build."
      patch_type: "portability"
    - patch_file: "patches/0002-kpassworddialog-guard-setAccessibleName.patch"
      patch_description: "Guard the setAccessibleName call in KPasswordDialogPrivate::init with #ifndef QT_NO_ACCESSIBILITY: qt5-qtbase is configured with -no-accessibility, and this is the only unguarded accessible-name call site in 5.116.0 (kcapacitybar/kcollapsiblegroupbox/kled already carry the guard upstream)."
      patch_type: "portability"
