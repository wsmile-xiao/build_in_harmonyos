# Consumer-test declaration for kicad-templates/10.0.0.
package: kicad-templates/10.0.0
homepage: "https://gitlab.com/kicad/libraries/kicad-templates"

# Upstream is a resource-only CMake project and has no executable test entry.
# Source census evidence: no tests/ directory, no CTest/add_test registration,
# no pytest registration, and the top-level CMakeLists.txt only installs the
# 19 Projects directories and Worksheets resources.
upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: null
upstream_tests: []

test_package_tests:
  - file: kicad_templates_probe.cpp
    description: >-
      C++17 consumer probe for the installed template root, exact resource
      census, project metadata/files, format parsing, negative fixtures, and
      the real OHOS macro/access/stat path.
    command: "conan test (test_package builds and runs kicad_templates_probe)"

# The real OHOS path emits 20 named assertions. Cross builds use the explicit
# KICAD_TEMPLATES_VM_RUNNER hook and fail instead of silently skipping runtime.
