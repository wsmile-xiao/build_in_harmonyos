why_not_run_in_recipe: >-
  build() records the ctest inventory only (ctest -N, R51 step 1). The suites
  are QtTest GUI tests needing a QPA platform and an event loop; they are
  executed in full on the real OHOS PC device with QT_QPA_PLATFORM=offscreen
  and the results excerpted into reports/test-report.md (R51 three-step:
  inventory / run / report).

test_package_tests:
  - file: test_package/test.cpp
    description: >-
      Consumer test (R34 real API usage). 12 test cases run by a case
      executor: each case prints TEST PASS / TEST FAIL, a SUMMARY line
      (n/12 passed) is emitted at the end, and the process exits non-zero if
      any case failed (rule 12: a real test executor, not bare assertions —
      jakarta-auth precedent). Real QtWidgets docking scenario offscreen.
      Every case's asserted behavior was verified against the upstream 2.4.0
      sources: MainWindow::uniqueName() round-trip; DockRegistry counts both
      dock widgets (DockRegistry::registerDockWidget runs in the DockWidget
      ctor); DockWidget::title() defaults to the construction uniqueName
      (Private ctor title(dockName)); setTitle() updates title(); the second
      dock widget's title is intact; both dock widgets are docked (not
      floating) after addDockWidget(); LayoutSaver::saveToFile() succeeds;
      closing a docked dock widget hides it (closeEvent removes it from the
      layout, the widget stays registered); LayoutSaver::restoreFromFile()
      succeeds and re-docks the closed dock widget (widgets matched by
      uniqueName, visible again, not floating). All cases are deterministic
      on desktop sessions and headless OHOS devices.
    command: "conan create (test_package builds and runs test_kddockwidgets)"

test_case_count: 12
