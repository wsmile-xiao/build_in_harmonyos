    command: "ctest --test-dir <build_folder> -N"
    execution: >-
      Executed in full on the real OHOS PC device with QT_QPA_PLATFORM=offscreen
      (qt5-qtbase/5.15.2.2 ships the offscreen QPA plugin; xcb unavailable).
