# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kddockwidgets/2.4.0.

package: kddockwidgets/2.4.0
homepage: https://github.com/KDAB/KDDockWidgets

# Upstream qtwidgets-frontend test inventory (KDDockWidgets_QT6=OFF,
# KDDockWidgets_FRONTENDS=qtwidgets, KDDockWidgets_TESTS=ON). tests/CMakeLists.txt
# registers tst_qtwidgets (qtwidgets/tst_qtwidgets.cpp + mainwindow.ui) and 23
# core suites; the exact ctest -N total is recorded on the real device
# (reports/upstream-test-inventory.txt). The qtquick frontend is out of scope
# for this adaptation (requires Qt5 Quick/QuickControls2; see notes.md).
upstream_check_command: "ctest --test-dir <build_folder> -N  # expected 24 (tst_qtwidgets + 23 core suites)"

upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder>  # full run on the real OHOS PC device (offscreen QPA)"

upstream_tests:
