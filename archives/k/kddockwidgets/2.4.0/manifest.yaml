# 版本级 manifest — kddockwidgets 2.4.0
version: "2.4.0"
software: "kddockwidgets"
status: published
build_date: "2026-09-30"
build_system: "cmake"

source:
  url: "https://github.com/KDAB/KDDockWidgets/releases/download/v2.4.0/kddockwidgets-2.4.0.tar.gz"
  sha256: "51dbf24fe72e43dd7cb9a289d3cab47112010f1a2ed69b6fc8ac0dff31991ed2"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DKDDockWidgets_QT6=OFF"
    - "-DKDDockWidgets_FRONTENDS=qtwidgets"
    - "-DKDDockWidgets_EXAMPLES=OFF"
    - "-DKDDockWidgets_TESTS=ON"
    - "-DKDDockWidgets_DEVELOPER_MODE=ON"
    - "-DKDDockWidgets_NO_SPDLOG=ON"
    - "-DKDDockWidgets_X11EXTRAS=OFF"
    - "-DBUILD_SHARED_LIBS=ON"
  dependencies:
    - "qt5-qtbase/5.15.2.2"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 v2.3.0 起默认 Qt6；OHOS 制品仓提供 Qt5 栈（qt5-qtbase/5.15.2.2 含 Widgets/Test/offscreen 插件），KDDockWidgets_QT6=OFF + FRONTENDS=qtwidgets 是上游受支持配置（QT_MIN_VERSION 5.15）"
  - "KDDockWidgets_NO_SPDLOG=ON 消除 spdlog/fmt 两个 QUIET 可选依赖的不确定性（regular-build 分支 find_package QUIET，缓存中有包时行为分叉）"
  - "KDDockWidgets_X11EXTRAS=OFF：Qt5 分支会追加 Qt5::X11Extras（OHOS 无 X11，该模块不存在）"
  - "tests/CMakeLists.txt 对 qtwidgets 前端开启 CMAKE_AUTOUIC（mainwindow.ui），需 CMAKE_AUTOUIC_EXECUTABLE 指向 qt5-qtbase bin/uic（kglobalaccel 先例只设 moc/rcc）"
  - "上游 CMakeLists.txt:302 无条件 include(KDQtInstallPaths)，硬性要求 Qt5::qmake/qtpaths target 并执行 qmake -query；qt5-qtbase 的 CMakeDeps Qt5Config 无 qmake 组件 → 配方 generate() 生成 imported Qt5::qmake 并经 CMAKE_PROJECT_INCLUDE 注入（qmake 为 OHOS 构建，真机原生执行，-query 输出仅用于 .pri 生成）"
  - "上游 src/CMakeLists.txt:381 对 qtwidgets 前端无条件 PRIVATE 链接 Qt5::WidgetsPrivate；Qt5+X11EXTRAS=OFF 配置实际用到的私有头仅 QtGui/private/qhighdpiscaling_p.h（+依赖 QtCore/private/qglobal_p.h），qt5-qtbase/5.15.2.2 无 WidgetsPrivate 组件且 CMakeDeps include 根不含 include/<Module>/5.15.2 私有根 → 注入 INTERFACE IMPORTED 映射到公开 Qt5::Widgets（同一 .so）+ 追加 QtGui/QtCore/QtWidgets 的 5.15.2 私有 include 根（制品实际带齐私有头，真机实证）"
  - "上游 add_subdirectory(tests) 双重门控于 KDDockWidgets_TESTS AND KDDockWidgets_DEVELOPER_MODE（CMakeLists.txt:620），只设 TESTS=ON 时 ctest -N 为 0 例（真机实测 Total Tests: 0）→ 必须同时开 DEVELOPER_MODE；dev 模式副作用仅 -Wall/-Wextra + PRIVATE QT_FORCE_ASSERTS + 库目标 PUBLIC DOCKS_DEVELOPER_MODE/DOCKS_TESTING_METHODS（本配置跳过 gcc>14 -fhardened 与 spdlog REQUIRE 分支）"
  - "dev 模式下上游直发 find_package(Qt5Test 5.15 REQUIRED)（src/CMakeLists.txt:436、tests/CMakeLists.txt:16），CMakeDeps 只生成 Qt5Config.cmake（已含 Qt5::Test 组件）→ 配方 generate() 写 Qt5TestConfig.cmake shim（include 同目录 Qt5Config）+ Qt5TestConfigVersion.cmake 入 generators_folder"
  - "OHOS Qt5 port 裁剪了 stock Qt 5.15 testlib 的窗口辅助 API（qtest_gui.h/qtest_widgets.h 尾部 qWaitForWindowActive/qWaitForWindowExposed 整节被删，且 QtGui include 链不再补全 QWindow/QGuiApplication）；上游 tst_qtwidgets.cpp:3083 用 qWaitForWindowActive(QWidget*)、tst_native_qpa.cpp 解引用 QWindow/qGuiApp → 配方 generate() 注入 shim 头 kddw_qt_windowactive_shim.h 并经 add_compile_options(-include) 强制包含（stock 语义轮询 isActive，offscreen QPA 模拟激活真机探针实证），上游源码零补丁"
  - "OHOS musl 动态加载器忽略 ELF RUNPATH，只认 LD_LIBRARY_PATH：conanrun.sh 只覆盖依赖包库目录（qt5 等），不含本包构建树 lib/（libkddockwidgets.so 落在 build/Release/lib/ 而非 bin/）→ ctest 24 例全部 0.07s 内报 Error loading shared library libkddockwidgets.so 速败；真机跑上游 ctest 时须显式把 $BUILD/lib 前置进 LD_LIBRARY_PATH（修正后 tst_native_qpa 单测预检 EXIT=0）"
