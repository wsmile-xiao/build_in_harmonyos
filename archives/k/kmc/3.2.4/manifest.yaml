# 版本级 manifest
# 文件位置: archives/k/kmc/3.2.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.2.4"

# 软件名
software: "kmc"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub tag archive，与 refresh-bio/KMC 官方 release 同源）
  url: "https://github.com/refresh-bio/KMC/archive/refs/tags/v3.2.4.tar.gz"

  # 源码校验和
  sha256: "dde49d9a3c9b30dd9e231650265f6de335e180e5a642503677ebbcad8e85504c"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表（KMC 为裸 Makefile，无 configure 选项；
  # 构建目标与编译器由 conanfile build() 显式传入）
  configure_options: []

  # 编译依赖列表（捆绑 zlib 走源码子模块，无外部 conan 依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-libcxx-portability-ext-algorithm-to-std-algorithm.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  # knowledge_ref: E672（DRAFT-E672，路径 B 草稿 knowledge/drafts/DRAFT-E672.{kv,md}）
  - "libc++ (OHOS NDK) 无 libstdc++ 的 <ext/algorithm>：__gnu_cxx::copy_n 改 std::copy_n（copy_n 本身是 C++ 标准算法）"  # knowledge_ref: E672
  - "捆绑 zlib 子模块 configure 探测默认 gcc：设备/CI 仅 clang，需 CC=clang 预构建 libz.a（上游 Makefile 的 LIB_ZLIB 规则即被跳过）"  # knowledge_ref: E672
  - "上游 Makefile 硬赋值 CC=g++：命令行覆盖 make CC=<clang++ 绝对路径>（make 命令行变量优先于 makefile 赋值）"  # knowledge_ref: E672
  - "libkmc_core.a 引用捆绑 zlib 符号：package() 须把 libz.a 一并入包、cpp_info.libs=[kmc_core,z] 顺序敏感（官方发行物不带是假设消费者自备）"  # knowledge_ref: E672
  - "捆绑 pybind11 2.3.dev × Python>=3.11 (PyFrameObject 不透明化)：按上游发行物/CI 是否交付该产物判 NOT_RUN+替代验证，勿硬修第三方依赖"  # knowledge_ref: E672
