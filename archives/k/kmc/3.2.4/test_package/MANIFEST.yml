# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制）

package: kmc/3.2.4
homepage: "https://github.com/refresh-bio/KMC"

# 上游无 make check / ctest / meson test 目标：顶层 Makefile 仅有
# all/kmc/kmc_dump/kmc_tools/py_kmc_api/clean（已清点核实）。
# 上游测试入口共三个家族，口径分栏清点（详见 PR 正文测试统计表）：
upstream_check_command: "(none: top-level Makefile has no check/test target)"

# conanfile.py build() 是否集成上游测试：是 —— 逐字复刻
# .github/workflows/main.yml linux-remote job 的 4 步（含 2 个硬 cmp 断言）。
upstream_test_in_build: true
upstream_test_command: "bash upstream_ci_checks.sh  # 由 build() 生成，内容与上游 workflow 逐字一致"

upstream_tests:
  - file: .github/workflows/main.yml
    source: KMC-3.2.4/.github/workflows/main.yml
    description: "家族A: linux-remote job 4 个测试步骤（k=28 ci=1 cmp Total==70 / small k -cs1 / KMC1 small-k-opt -fkmc 重跑 / issue-180 cmp pattern.dump）——build() 内运行，N=4"
    command: "bash upstream_ci_checks.sh (in build())"
  - file: tests/py_kmc_api/
    source: KMC-3.2.4/tests/py_kmc_api/
    description: "家族B: pytest 套件 11 用例（test_py_kmer_api.py 7 + test_py_kmc_file.py 4）——NOT_RUN：捆绑 pybind11 2.3.dev 与 Python>=3.11 不兼容（设备 3.12.9，PyFrameObject 不透明化 9 errors），py_kmc_api.so 无法构建；上游官方发行物亦不含该模块、上游 CI 不构建/不运行。替代验证=本 test_package T5 以底层 kmc_runner.h API 覆盖等价功能路径"
    command: "(NOT_RUN — see PR body test table)"
  - file: tests/kmc_CLI/run_small_fastq_tests.py
    source: KMC-3.2.4/tests/kmc_CLI/run_small_fastq_tests.py
    description: "家族C: small-fastq 参数化比较套件 2816 参数组（11 输入 × k=1..256，每组 ≥3 次比较）——NOT_RUN：需 11 个外部 SRA fastq.gz（prerequisite-files.txt md5 锚定），ENA filereport 实测总体积 3,382,514,277 bytes (3.15GB)，不在源码包/发行物内，超出体积预算；上游 GitHub CI 亦不引用该脚本"
    command: "(NOT_RUN — see PR body test table)"

test_package_tests:
  - file: test.sh
    description: "T1 鸿蒙特有① NEON 选路符号断言；T2 鸿蒙特有② OHOS aarch64 ELF+NEEDED 断言；T3 上游 fixture 计数复刻(70)；T3b issue-180 pattern cmp；T4 kmc_tools dump 链路；T5 KMC::Runner API 消费者 consumer.cpp（70/1/40 三断言）"
    command: "bash test.sh <package_folder> <cxx>  (via conanfile test(), env=conanrun)"
  - file: consumer.cpp
    description: "C++ 消费者：kmc_runner.h + libkmc_core 链接运行，Stage1/Stage2 结果断言 nSeqences=1 / nTotalKmers=70 / nUniqueKmers=40"
    command: "./consumer_bin <input.fastq> <tmp> <out_db>"

# test_package 断言总数（T1×3 + T2×3 + T3×1 + T3b×1 + T4×1 + T5×3 = 12）
assertion_count: 12
