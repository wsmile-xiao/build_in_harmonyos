software: kvazaar
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.2"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（顶层快捷字段，供 verify-build G4 检查）
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/kvazaar-2.3.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # CONFIG_SHELL=bash bash ./configure --prefix=$DEFAULT_PREFIX

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.patch"  # HMDFS umask 077 → umask 022 修复

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 文件系统不支持 umask 077 创建目录后写入文件，需将 config.status/configure 中的 umask 077 改为 umask 022"
  - "HMDFS 不支持 mkfifo，导致 make -j 并行编译的 jobserver 失败，但 make 自动降级为串行模式"
  - "系统默认 /bin/sh 是 mksh R59，autotools 编译建议使用 CONFIG_SHELL=bash"
  - "GitHub archive 需 autoreconf -fi 生成 configure 脚本（git submodule 需单独获取）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/kvazaar-2.3.2.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/kvazaar-2.3.2.work
  source_orig_hash: a6e17330f20739cb
  source_work_hash: 5e44b7a3f8638d58
  generated_at: '2026-06-18T01:38:35'
  patches_count: 1

patch_classification:
  - file: 0001-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
