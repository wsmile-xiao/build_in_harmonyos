# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-dhcp-ddns/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：src/bin/d2/tests/meson.build 注册 1 个 gtest 套件
# （test('kea-d2-tests', protocol: 'gtest', is_parallel: false, priority: -1)）
# 与 1 个进程级 shell 套件（test('d2_process_tests.sh', suite: 'shell-tests')）——
# 两者均在 -Dtests=enabled 下由本包 build() 真实执行
upstream_check_command: "meson test -C <builddir> --list"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> kea-d2-tests（+ build() 以 sh 直接驱动 d2_process_tests.sh 的 10 个进程级场景，见下）"

# 上游实际运行的测试程序（真机实测注册执行 426 个 gtest 用例 + shell 场景 10 个）
upstream_tests:
  - file: kea-d2-tests
    source: src/bin/d2/tests/
    description: >-
      D2 守护进程单元测试（38 个 gtest 套件共 426 个用例：更新管理与队列管理
      （d2_update_mgr/d2_queue_mgr）、NCR 构造与解析（nc_add/nc_remove/
      check_exists_add/check_exists_remove、simple_add/simple_remove 含
      without_dhcid 变体）、D2 配置解析与校验（parser/d2_simple_parser/
      d2_cfg_mgr）、控制器与进程内测试（d2_controller/d2_process）、HTTP 控制
      命令与 TLS（d2_http_command）、命令行/控制命令（d2_command）、get_config
      等），全部为本地回环（127.0.0.1）与纯逻辑用例：无 SOCK_RAW、无特权依赖、
      无外部网络数据；OHOS 沙箱下零 root 实跑（其中 26 个 unix 命令通道用例
      因平台拒绝 AF_UNIX 路径名 bind 条件性跳过，补丁 0007；本次适配真机实测
      见版本级 notes.md）
    command: "\"./kea-d2-tests\"（工作目录 src/bin/d2/tests，TEST_CA_DIR/TEST_DATA_BUILDDIR 由 meson 注入）"
  - file: d2_process_tests.sh
    source: src/bin/d2/tests/
    description: >-
      进程级 shell 套件（Meson 注册名 d2_process_tests.sh，suite shell-tests）：
      驱动真实 kea-dhcp-ddns 守护进程（127.0.0.1:53001）校验 10 个场景——
      server_pid_file（含重复启动拒绝 DCTL_ALREADY_RUNNING）、
      dynamic_reconfiguration（SIGHUP：合法→非法→恢复全流程）、
      sigterm（信号 15）/sigint（信号 2）优雅停机、version、logger_vars
      （日志变量展开）、syntax_check×3（合法配置 / CONFIG_BAD_SYNTAX /
      CONFIG_BAD_VALUE，经 -t 校验退出码 0/1/1）、password_redact（日志脱敏）。
      OHOS 内核拒绝 shebang 脚本 execve，故由 build() 以 sh 直接驱动（工作目录
      即 meson 注册的 src/bin/d2/tests），零 root 全实跑
    command: "sh d2_process_tests.sh（工作目录 src/bin/d2/tests）"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_kea_dhcp_ddns.py
    description: >-
      以 conanrun 环境运行包内 kea-dhcp-ddns 守护进程：版本输出（-v，stdout
      恰为 3.0.3；以及本包新增的 GNU 风格别名 --version 同输出 / --help 打印
      usage 文本，两者均退出 0）、配置语法检查三路径（-t 合法配置退出 0 /
      坏 JSON 退出 1 / 越界端口 80000 退出 1）、一次完整守护进程生命周期
      （-c 启动 → DCTL_CONFIG_COMPLETE → pidfile 落盘 → SIGTERM →
      DCTL_SHUTDOWN，并校验全程无 "Error loading shared library"），
      共 15 项校验点
    command: "python3 test_kea_dhcp_ddns.py"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 bin/kea-dhcp-ddns 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64 / ET_DYN PIE、DT_NEEDED 链接 musl libc.so 且非
      glibc libc.so.6、链接 libc++_shared.so），共 8 项校验点
    command: "./test_ohos_platform <package>/bin/kea-dhcp-ddns"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：校验包内 DT_NEEDED 的 Kea 库全部随包分发，
      在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 包内 Kea 运行时库（20 个
      libkea-*.so* 库名，含 soname 实体文件共 40 个）全部成功，并真实执行包内
      kea-dhcp-ddns（-v 输出 3.0.3），证明真实进程的完整 NEEDED 闭包在 OHOS
      运行时可解析，共 6 项校验点（另有 20 条逐库 dlopen 结果行）
    command: "./test_ohos_runtime <package>/bin/kea-dhcp-ddns"
    ohos_specific: true

# 鸿蒙特有测试用例统计（test_package 内，实测结果见版本级 notes.md）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <kea-dhcp-ddns> && ./test_ohos_runtime <kea-dhcp-ddns>"
  result: "2/2 passed"

# 用例总数：上游 426 个 gtest 用例（1 个 meson 套件）+ 10 个进程级 shell 场景
upstream_case_count: 436
upstream_passed_case_count: 410
upstream_skipped_case_count: 26
test_package_assertion_count: 29
assertion_count: 465
