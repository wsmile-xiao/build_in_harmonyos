# 版本级 manifest — kea-dhcp-ddns 3.0.3
# 文件位置: archives/k/kea-dhcp-ddns/3.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.3"
software: "kea-dhcp-ddns"

# 编译状态: published | built | failed | archived
status: published

build_date: "2026-10-04"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
    - "-DBOOST_SP_NO_PTHREAD_SETCANCELSTATE (extra_cxxflags)"
    - "tc.binaries ar/ranlib = <compiler dir>/llvm-ar|llvm-ranlib (MesonToolchain)"
    - "LD_LIBRARY_PATH += host 依赖 libdirs（配置期 cpp.run() 探针）"
    - "meson compile -j 8（OHOS 沙箱并发进程配额）"
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================

artifacts:
  - "bin/kea-dhcp-ddns"
  - "lib/libkea-*.so*（守护进程运行时依赖闭包，20 个 kea 库）"

# ============================================================
# 上游测试（build() 内真实执行）
# ============================================================

upstream_tests:
  command: "meson test -v --timeout-multiplier 4 -C <builddir> kea-d2-tests + sh <builddir>/src/bin/d2/tests/d2_process_tests.sh"
  suites_run: 2
  # gtest 实测注册执行 426 个（38 个套件）+ 脚本套件驱动 10 个场景
  cases_in_source: 436
  cases_in_source_detail: "gtest 426 个实际执行（38 套件）+ d2_process_tests.sh 驱动 10 个进程级场景"
  root_cases: 0
  root_cases_detail: "无：全部用例以普通应用身份在沙箱内实跑（零 root；26 个 unix 命令通道用例为平台条件性跳过，见下）"
  # 真机实测（2026-10-04 真机全量跑）：
  # kea-d2-tests gtest 9.41s（426 ran: 400 passed / 26 skipped / 0 failed）
  # d2_process_tests.sh（10/10）
  cases_run: 436
  cases_passed: 410
  cases_failed: 0
  cases_skipped: 26
  cases_skipped_detail: "26 个 CtrlChannelD2Test 用例（unix 命令通道 fixture，patch 0007）：鸿蒙 hmdfs 存储拒绝 AF_UNIX 路径名 bind()（EPERM），平台不支持；探测 unixControlSocketsUsable() 在可 bind AF_UNIX 的主机上放行全部 26 例"
  cases_unregistered: 0
  cases_unregistered_reason: "无：源码注册的 426 个 gtest 用例与 10 个 shell 场景在本配置全部注册并执行"

# ============================================================
# 鸿蒙特有测试（test_package，2 个用例）
# （test_package 另含 1 个通用消费者契约测试 test_kea_dhcp_ddns.py，与兄弟 kea 配方相同，
#  不属鸿蒙特有；声明见 test_package/MANIFEST.yml 的 test_package_tests）
# ============================================================

ohos_specific_tests:
  count: 2
  entries:
    - "test_package/test_ohos_platform.c → test_ohos_platform（平台 ABI）"
    - "test_package/test_ohos_runtime.c → test_ohos_runtime（运行时闭包）"
  command: "./test_ohos_platform <kea-dhcp-ddns> && ./test_ohos_runtime <kea-dhcp-ddns>"
  checks:
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so）"
    - "DT_NEEDED 闭包中的每个 Kea 库（libkea-*.so*）都随包分发"
    - "包内 Kea 运行时库（lib/libkea-*.so*）在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 成功（实测 20 个 soname 实体）"
    - "真实执行包内 kea-dhcp-ddns（-v 输出 3.0.3），证明真实进程完整 NEEDED 闭包在 OHOS 运行时可解析"
  # 真机实测（鸿蒙特有 2/2：平台 ABI 8/8 + 运行时闭包 6/6（40/40 库 dlopen）；消费者契约 test_kea_dhcp_ddns.py 15/15，见版本级 notes.md）
  cases_run: 2
  cases_passed: 2
  cases_failed: 0

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson.build.patch"
  - "0002-src-lib-dhcp-iface_mgr_linux.cc.patch"
  - "0003-meson.build.patch"
  - "0004-src-lib-process-cfgrpt-meson.build.patch"
  - "0005-src-lib-process-d_controller.cc.patch"
  - "0006-src-lib-testutils-sandbox.h.patch"
  - "0007-src-bin-d2-tests-d2_command_unittest-unix-socket-skip.patch"
  - "0008-src-bin-d2-tests-d2_http_command_unittest-tmpdir.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "家族复用取证：kea-dhcp-ddns 与已合入的 kea-hook-ha / kea-perfdhcp / kea-shell 同属 Kea 3.0.3 单源码树（src/bin/d2 与 src/hooks/... 平级），0001-0004 补丁与 kea-hook-ha 逐字节一致（md5 对账通过），整组复用零改动"
  - "平台工具链 CLI 探测契约（本包首创发现）：OHOS PC 打包工具链（真机 conan-verify 的 L2 冒烟门禁与 MR CI 冒烟测试）以 GNU 惯例 --version/--help 探测包内可执行文件，而 Kea 守护进程命令行只接受 getopt 短选项表 dvVWc:t:X——长选项经 getopt 报 'Usage error: unsupported option: --'，DControllerBase::launch 把 InvalidUsage 重抛为空消息异常、main.cc 置 EXIT_FAILURE，实测 rc=1，冒烟门禁对守护进程包全判 FAIL。补丁 0005 在 parseArgs 前置扫描 argv 把 --version/--help 处理为纯别名（--version 与 -v 同输出、--help 打印 usage 后成功退出），对 CLI 契约零改动"
  - "OHOS /storage 沙箱拒绝符号链接（ln -s → EPERM）：meson 以 version: N.M.K 构建共享库时 soname 名只以符号链接发布，加载器按 NEEDED 名全部落空（d2 测试与真实守护进程启动均报 'Error loading shared library libkea-*.so.N'）。build() 在 compile 后以复制物化 soname（_materialize_sonames，幂等，与 kea-hook-* 家族同款），真机实测物化 40 文件 / 20 soname 实体"
  - "OHOS 内核拒绝 shebang 脚本 execve（与可执行位无关）：上游进程级 shell 套件 d2_process_tests.sh 由 meson test 直接执行报 Error 126——本包不改测试源码/注册，配方 _run_process_shell_tests() 以 sh 驱动同一脚本、同一工作目录、同一参数（对照：kea-dhcp6 以补丁改注册命令，两路线均可）"
  - "OHOS app 沙箱限制并发进程数：ninja 默认按 20 核并发触发 posix_spawn EAGAIN 中断编译——meson compile 须限并发 -j 8（家族配方沿用）"
  - "d2_process_tests.sh 按下 30s 通用预算，真实守护进程多场景串行启动需更长——meson test 须 --timeout-multiplier 4（家族配方沿用）"
  - "Kea 3.0.3 构建树在真机上的实测构成：kea-dhcp-ddns 守护进程 + 38 个 gtest 套件（426 例，400 通过 / 26 平台条件性跳过 / 0 失败）+ 10 个进程级 shell 场景（10/10），零 root 实跑，守护进程 CLI 契约（-v/-V/-W/-t/-c）全部与上游一致"
  - "真机测试崩溃根因（本包首曝、家族补丁修复）：上游测试 Sandbox 构造在编译期 P_tmpdir（/tmp）下调用 mkdtemp——鸿蒙 PC /tmp 只读，mkdtemp 返回 NULL，std::string 直接赋值 NULL 指针即未定义行为，测试二进制在首个 fixture 构造时 SIGSEGV（gdb 受沙箱 ptrace 限制不可用，经插桩 std::cerr 轨迹定位到成员构造序）。补丁 0006 先读 TMPDIR（未设回退 P_tmpdir），与 kea-dhcp6 同名补丁逐字节一致（md5 a0a1ef2f）"
  - "鸿蒙 hmdfs 用户存储拒绝 AF_UNIX 路径名 socket 的 bind()（EPERM，探测 /storage 各目录均失败，系统目录不可写）：unix 命令通道测试在真机无法执行。补丁 0007 以真实 bind 探测（unixControlSocketsUsable()）+ fixture SetUp() GTEST_SKIP：平台不支持时如实跳过 26 例，可 bind 的主机上全部照常执行（家族先例 kea-dhcp6 0006-0008 同款路线）"
  - "HTTP 控制通道 config-write 全路径用例硬编码 /tmp 为读写路径，鸿蒙 /tmp 只读即失败——补丁 0008 改取 TMPDIR（未设回退 /tmp），Http/Https 两个 fixture 共享的尾函数一处修复（与 kea-dhcp6 0010 同款）"

