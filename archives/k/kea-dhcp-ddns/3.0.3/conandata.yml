# conandata.yml — kea-dhcp-ddns 3.0.3 (ISC Kea)
# Upstream release tarball from the ISC ftp server (official source).
# kea-dhcp-ddns is a target of the Kea monorepo (src/bin/d2), so the source is
# the full Kea release tarball.
sources:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"

patches:
  - patch_file: "patches/0001-meson.build.patch"
    patch_description: "Normalize the HarmonyOS/OpenHarmony system name to Linux so the Meson platform branch selects the Linux sources and flags"
    patch_type: "portability"
  - patch_file: "patches/0002-src-lib-dhcp-iface_mgr_linux.cc.patch"
    patch_description: "Rename the UAPI struct sockaddr_storage while including the netlink headers, avoiding its redefinition against the musl sys/socket.h one"
    patch_type: "portability"
  - patch_file: "patches/0003-meson.build.patch"
    patch_description: "Invoke the configure-time helper scripts (env.sh, cd-and-run.sh, grabber.py, config-report.sh) through their interpreters (sh/python3) because the HarmonyOS PC kernel refuses script execve"
    patch_type: "portability"
  - patch_file: "patches/0004-src-lib-process-cfgrpt-meson.build.patch"
    patch_description: "Invoke tools/mk_cfgrpt.sh through /bin/sh when generating config_report.cc because the HarmonyOS PC kernel refuses script execve"
    patch_type: "portability"
  - patch_file: "patches/0005-src-lib-process-d_controller.cc.patch"
    patch_description: "Accept the GNU-style long options --version and --help in DControllerBase::parseArgs as pure aliases of the stock -v handling, because the OpenHarmony PC packaging tool-chain (device verify smoke gate and CI smoke test) probes packaged executables with those spellings"
    patch_type: "portability"
  - patch_file: "patches/0006-src-lib-testutils-sandbox.h.patch"
    patch_description: "Honour TMPDIR before P_tmpdir when creating the test sandbox directories: the HarmonyOS PC mounts /tmp read-only, so the default mkdtemp(P_tmpdir) returns NULL and constructing the sandbox crashes the test binary"
    patch_type: "portability"
  - patch_file: "patches/0007-src-bin-d2-tests-d2_command_unittest-unix-socket-skip.patch"
    patch_description: "Skip the unix command-channel fixture (CtrlChannelD2Test) on hosts that cannot host AF_UNIX pathname sockets, via a probe that performs the very bind() the server would (the HarmonyOS PC user storage is an hmdfs mount that rejects the bind with EPERM)"
    patch_type: "portability"
  - patch_file: "patches/0008-src-bin-d2-tests-d2_http_command_unittest-tmpdir.patch"
    patch_description: "Build the HTTP control-socket config-write full-path test under TMPDIR (falling back to /tmp) because the HarmonyOS PC /tmp is read-only"
    patch_type: "portability"
