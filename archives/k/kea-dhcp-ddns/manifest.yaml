software: kea-dhcp-ddns
display: "ISC Kea DHCP-DDNS (D2)"
description: "DHCP-DDNS daemon shipped with the ISC Kea servers: receives NameChangeRequests from kea-dhcp4/kea-dhcp6 and performs TSIG-signed DNS dynamic updates"
category: network
homepage: "https://www.isc.org/kea/"
license: MPL-2.0
build_system: meson

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Meson 在 OHOS 上报告 system='harmonyos'，Kea 的平台白名单不含它：需归一化为 linux 才能选中 Linux 源码分支"
    - "OHOS sysroot 的 linux/socket.h 与 musl sys/socket.h 都定义 struct sockaddr_storage，包含 netlink 头时需 define-guard"
    - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core 需 BOOST_SP_NO_PTHREAD_SETCANCELSTATE"
    - "meson 对 clang 默认用裸名 llvm-ar 探测归档器，本环境/CI 上失败：需从 tools.build:compiler_executables 推导绝对路径写入 machine file"
    - "配置期 cpp.run() 探针要求 host 共享依赖在 LD_LIBRARY_PATH 可见（log4cplus shared=True）"
    - "OHOS 内核拒绝 shebang 脚本 execve：configure 期脚本与 meson 包装器统一经解释器前缀调用；上游进程级 shell 套件（d2_process_tests.sh）同样经 sh 执行"
    - "OHOS /storage 沙箱拒绝符号链接：meson 的 soname 符号链接须在编译后以复制物化（_materialize_sonames）"
    - "OHOS app 沙箱限制并发进程：meson compile 限 -j 8 防 posix_spawn EAGAIN"
    - "boost 必须固定 1.85.0（1.90/1.91 制品仓包缺 Kea 实际使用的头文件），且 meson 需 >= 1.10"
    - "kea-dhcp-ddns 的产物是可执行守护进程：包内按 bin/ 落盘并提供 commands.json（R38）"
  common_dependencies:
    - boost
    - log4cplus
    - openssl

# 版本索引（所有已归档版本，含状态）
versions:
  "3.0.3":
    status: published
    build_date: "2026-10-04"
    conan_ref: "kea-dhcp-ddns/3.0.3"
