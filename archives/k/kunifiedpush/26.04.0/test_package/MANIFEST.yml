# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kunifiedpush/26.04.0.

package: kunifiedpush/26.04.0
homepage: https://invent.kde.org/libraries/kunifiedpush

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/connectorutilstest.cpp
    source: kunifiedpush-26.04.0/autotests/connectorutilstest.cpp
    description: "ConnectorUtils::selectDistributor sort/priority logic with a real Connector over the session bus"
    command: "ctest --test-dir <build_folder> -R connectorutilstest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON and KUNIFIEDPUSH_CLIENT_ONLY=ON"
  - file: autotests/contentencryptiontest.cpp
    source: kunifiedpush-26.04.0/autotests/contentencryptiontest.cpp
    description: "RFC 8291 content decryption vectors (testDecrypt/testEmpty/testInvalidMessage/testInvalidKey/testKeyGen)"
    command: "ctest --test-dir <build_folder> -R contentencryptiontest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON and KUNIFIEDPUSH_CLIENT_ONLY=ON"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke instantiates KUnifiedPush::Connector (D-Bus adaptor registration) and round-trips the VAPID public-key property."
    command: "conan create (test_package builds and runs test_kunifiedpush)"

assertion_count: 2
