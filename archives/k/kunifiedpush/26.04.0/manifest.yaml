knowledge_gained:
  - "kunifiedpush 26.04.0 ships four deliverables on desktop; KUNIFIEDPUSH_CLIENT_ONLY=ON restricts the build to the client connector library (libKUnifiedPush.so), the same client scope upstream builds on Android."
  - "The client library keeps a hard Qt6::DBus + Qt6::Test + OpenSSL::Crypto dependency set; the qtbase-sql-dbus/6.11.1 variant provides Qt6::DBus with the qdbusxml2cpp host tool and Qt6DBusMacros, while the qtbase/6.11.1 registry package is a reduced-surface build with FEATURE_dbus=OFF."
  - "The distributor/notifier/KCM deliverables require Qt6::WebSockets and the KF6 stack (I18n, Solid, Service, KCMUtils, Crash); solid and qtwebsockets are absent from the ohpcd registry, so the client library is the shippable scope (W0 dependency verification)."
