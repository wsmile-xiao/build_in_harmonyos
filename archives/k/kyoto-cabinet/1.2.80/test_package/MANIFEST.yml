# test_package/MANIFEST.yml — kyoto-cabinet 1.2.80
type: test_package
package: kyoto-cabinet/1.2.80
backend: hash (file-backed HashDB)
tests:
  description: "checks against installed file-backed HashDB: create, write, read, overwrite, remove, iterate, close+reopen, persistence, sync/fsync, invalid path, corrupted header, truncated file"
  count: 27
  source_files:
    - test.cpp
  test_framework: "custom check() + exit code"
  upstream_tests:
    make_target: "make check"
    total_commands: 512
    sub_targets:
      check-util: 38
      check-proto: 16
      check-stash: 9
      check-cache: 9
      check-grass: 9
      check-hash: 77
      check-tree: 77
      check-dir: 76
      check-forest: 76
      check-poly: 111
      check-langc: 14
    test_executables: 17
    test_tools: "kc{util,proto,stash,cache,grass,hash,tree,dir,forest,poly}test + kc{hash,tree,dir,forest}mgr + kcutilmgr + kclangctest"
  notes: |
    All DB files are created inside the test build directory (argv[1]).
    File locking, mmap, atomic ops and synchronization are NOT disabled.
    Any HMDFS incompatibility must surface as a test failure.
