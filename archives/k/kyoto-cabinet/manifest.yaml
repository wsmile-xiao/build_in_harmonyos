software: kyoto-cabinet
display: "Kyoto Cabinet"
description: "京都资料柜——高速键值数据库（文件哈希/树/目录/森林数据库，QDBM 后继）"
category: db
homepage: "https://dbmx.net/kyotocabinet/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "官方站 fallabs.com 已 404，源码改用官方镜像 dbmx.net，SHA256 不变"
    - "configure 生成临时目录 umask 077，HMDFS 上失败，打补丁改 022"
    - "上游 Makefile 无 VPATH，必须源内构建"
    - "make check 512 条命令共享 casket* 测试库文件，须 -j1 串行"
    - "zlib 压缩默认开启（上游默认），lzma/lzo 关闭"
  common_dependencies: ["zlib"]

versions:
  "1.2.80":
    packaging: conan
    status: built
    build_date: "2026-09-03"
    notes: >-
      首个 conan 配方。umask 补丁针对纯净 configure 重制。上游测试
      make check 全量 512 条命令通过（真机串行）；test_package 27 项
      断言覆盖创建/写入/读取/覆盖/删除/迭代/重开/持久化/非法路径/
      损坏输入，全部真机运行且不关闭文件锁、mmap 与同步。
