software: kodi-addon-inputstream
display: "kodi-addon-inputstream (inputstream.adaptive)"
description: "Kodi InputStream Adaptive binary add-on: MPEG-DASH, HLS and SmoothStreaming client with Widevine single-sample decrypter (ssd_wv)"
category: multimedia
homepage: "https://github.com/xbmc/inputstream.adaptive"
license: GPL-2.0-or-later
build_system: cmake
ohos_adaptation:
  key_points:
    - "OHOS: recipe embeds the xbmc Bento4 fork (upstream ENABLE_INTERNAL_BENTO4 flow) - the add-on code requires the fork's extended AP4 API which vanilla Bento4 (registry 1.6.0-641) does not provide"
    - "OHOS: own recipe-cmake entry point replicating kodi-addon-dev build_addon() semantics (no Kodi SDK build system on the registry); upstream sources unmodified"
    - "OHOS: Kodi add-on SDK headers extracted selectively (kodi-dev-kit include) from the xbmc 21.3-Omega tarball via conandata sources.sdk"
    - "OHOS: CMP0077 OLD (fork declares cmake_minimum_required 3.10) makes option() wipe plain set() variables - BUILD_APPS must be forced at cache level"
    - "OHOS: aarch64 atomics workaround in wvdecrypter (upstream issue #1128 pattern); zero platform-macro dependency, no source patches"
versions:
  "21.1.2":
    status: built
    build_date: "2026-10-02"
    packaging: conan
    notes: "conan recipe (os=OHOS arch=armv8); deps pugixml/1.15-r0 + in-tree xbmc Bento4 fork 1.6.0-639-8-Omega; upstream 51/51 unit tests pass on-device; test_package is dlopen-based (18 checks)"
    dependencies:
      - pugixml/1.15-r0
      - "xbmc Bento4 fork 1.6.0-639-8-Omega (in-tree static build, upstream ENABLE_INTERNAL_BENTO4 pin)"
      - "gtest/1.17.0 (test_requires, only for the upstream unit-test build)"
      - "kodi add-on SDK headers from xbmc 21.3-Omega tarball (kodi-dev-kit include subtree)"
