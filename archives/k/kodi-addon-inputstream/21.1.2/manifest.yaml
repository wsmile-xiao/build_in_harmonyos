name: kodi-addon-inputstream
version: "21.1.2"
status: built
build_date: "2026-10-02"
conan_ref: "kodi-addon-inputstream/21.1.2"

source:
  url: "https://github.com/xbmc/inputstream.adaptive/archive/refs/tags/21.1.2-Omega.tar.gz"
  sha256: "50eb66172be216eef80def770e7318883027207d1cc2206c0027e4a9871a1af6"
  tar_format: tar.gz
  # 版本映射：产品版本 21.1.2 对应上游 tag 21.1.2-Omega
  # （release commit 6ca1c7d5f9b689bcf4c95db50919bc2f8f874cf7）
  bundled_bento4:
    # 内嵌 Bento4 fork：上游 depends/common/bento4/bento4.txt 固定 pin（ENABLE_INTERNAL_BENTO4
    # 默认开）；sha256 与上游自带的 depends/common/bento4/bento4.sha256 逐字一致
    origin_tarball: "https://github.com/xbmc/Bento4/archive/refs/tags/1.6.0-639-8-Omega.tar.gz"
    origin_tarball_sha256: "d7fc48e52f0037ce977d7f54c49d4f8936cca0e58447c9ce7c55ab64d268e23d"
    reason: "add-on code requires the fork's extended AP4 API (AP4_File stream+factory+movie ctor, AP4_AvcFrameParser::ReadGolomb, AP4_UnknownUuidAtom::GetData, SetParentIsOwner, changed virtual signatures); vanilla Bento4 1.6.0-641 on the registry does not provide them"
    build_mode: "fork 自带 CMakeLists add_subdirectory，-DBUILD_APPS=OFF（上游 flags.txt 同款），PIC 静态 libap4.a 编入两个模块"
  kodi_dev_kit_headers:
    origin_tarball: "https://github.com/xbmc/xbmc/archive/refs/tags/21.3-Omega.tar.gz"
    origin_tarball_sha256: "a60afcb556e4a00cb19fc35b7e77758107c9a8096c6ce9b66af5f92396be31aa"
    extract_subpath: "xbmc/addons/kodi-dev-kit/include（source() 时选择性解出 kodi-sdk-include，不落归档）"

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON（插件为 Kodi dlopen 模块，shared=True 默认）"
    - "-DINPUTSTREAM_TESTS=ON（with_tests=True 时构建上游单元测试 inputstream.adaptive_test）"
  dependencies:
    - pugixml/1.15-r0（静态 PIC，编入主模块；上游 pin 1.13，registry 无 1.13，取同系列 1.15-r0，
      仅用稳定 DOM 子集 xml_document/xml_node/PUGIXML_TEXT，API 兼容，偏差已记录）
    - "xbmc Bento4 fork 1.6.0-639-8-Omega（conandata sources.bento4 内嵌构建，静态 PIC libap4.a 编入
      inputstream.adaptive.so 与 ssd_wv.so；非 conan 依赖，复刻上游 ENABLE_INTERNAL_BENTO4 流程）"
    - gtest/1.17.0（test_requires；上游 pin 1.13.0，同系列 TEST() API 兼容；仅测试构建需要）
    - "kodi add-on SDK 头文件：xbmc 21.3-Omega 的 kodi-dev-kit include 子树（ADDON_INSTANCE_VERSION_INPUTSTREAM=3.3.0）"
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  upstream_tests:
    runner: "inputstream.adaptive_test（上游 src/test，gtest；with_tests=True 时随 conan create 在真机构建并运行）"
    total: 51
    passed: 51
    failed: 0
    suites: "TestDASHTree 32 + TestHLSTree 12 + TestSmoothTree 2 + TestUtils 5"
  consumer_checks:
    runner: "test_package/test_kodi_addon_inputstream（dlopen 真机）"
    total: 18
    passed: 18
    failed: 0
    detail: "6 version asserts + 9 C-ABI factory flow checks + 3 ssd_wv smoke checks"

knowledge_gained:
  - "上游 add-on 对 Bento4 是 API 硬依赖 xbmc fork：AP4_File(stream,factory,moov_only,movie) 4 参构造、
    AP4_AvcFrameParser::ReadGolomb、AP4_UnknownUuidAtom::GetData、SetParentIsOwner、被改写的 AP4 虚签名——
    vanilla Bento4（registry 1.6.0-641）全部缺失且插件侧无法补（虚签名是插件外链接期符号）；唯一可行路线是内嵌 fork"
  - "上游 ENABLE_INTERNAL_BENTO4 默认 ON（FindBento4.cmake ExternalProject + depends/common/bento4/*.txt/.sha256/
    flags.txt），配方内嵌 fork = 复刻上游官方流程；fork 自带 CMakeLists 的 install 语义是头文件平铺进
    include/bento4/，add_subdirectory 路线需在 source() 把 Core/Codecs/Crypto/MetaData 的头平铺 stage 到
    <staging>/bento4/ 以匹配上游 #include <bento4/...>"
  - "Bento4 fork CMakeLists 声明 cmake_minimum_required(3.10) → CMP0077 OLD：子目录 option(BUILD_APPS ON)
    会删除父作用域同名普通变量并重建缓存 ON——set(BUILD_APPS OFF) 必须写成 set(... CACHE BOOL \"\" FORCE)"
  - "上游测试的构建入口：顶层全局 include_directories（含 SDK 头与 bento4）被 tests 子目录继承；Iaes_decrypter.h
    直接 include <bento4/Ap4Types.h>，测试可执行需链 ap4；运行参数传 manifests 目录
    （src/test/manifests），51 个 TEST_F 全部离线可用"
  - "GetCapabilities 固定掩码 0x5F（IDEMUX|IPOSTIME|IDISPLAYTIME|SEEK|PAUSE|ICHAPTER），来自
    SDK versions.h 的 ADDON_INSTANCE_INPUTSTREAM=105 / INPUTSTREAM_VERSION_LEVEL=4——test_package C ABI 流程断言值"
  - "HMDFS 环境：GNU make 4.4.1 在 -jN 顶层会尝试 mkfifo jobserver（TMPDIR 下 GMfifo*），hmdfs 返回
    Operation not permitted 但仅为警告不致命；真正风险是并行 OOM（32GB 机器内存紧张时 20 路并行 clang 被杀、
    报 Error 1 且无 stderr）——验证期用 -c tools.build:jobs=1 串行最稳"
  - "conan.tools.files.get() 的目标目录参数名是 destination（不是 dest），conan 2.29 下传 dest 会 TypeError"

software: kodi-addon-inputstream
build_system: cmake
