# test_package/MANIFEST.yml
# Upstream test declaration file (required by CI build_and_test.sh L0e)

package: kodi-addon-inputstream/21.1.2
homepage: "https://github.com/xbmc/inputstream.adaptive"

# Upstream 21.1.2-Omega ships a real test suite: src/test (CMakeLists.txt
# registers enable_testing()-style add_test "manifest_tests" running
# inputstream.adaptive_test against src/test/manifests data). 51 TEST_F
# cases over the DASH/HLS/Smooth tree parsers and utils, compiled against
# upstream's own complete Kodi API stub header src/test/KodiStubs.h — no
# Kodi host needed and fully offline (curl is stubbed, manifests are local
# files). The recipe replicates that build in recipe-cmake/CMakeLists.txt
# (INPUTSTREAM_TESTS=ON) and runs it in the main recipe build() when option
# with_tests=True (R51 protocol; executed on the target during this
# adaptation — see notes.md / version manifest for the run record). CI's
# default conan create (with_tests=False) skips it.
upstream_check_command: "grep -c TEST_F src/test/Test{DASHTree,HLSTree,SmoothTree,Utils}.cpp"
upstream_test_in_build: true
upstream_test_command: "conan create . -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 -o with_tests=True"

upstream_tests:
  - name: TestDASHTree (32 TEST_F)
    command: "inputstream.adaptive_test src/test/manifests"
    expected: "pass"
  - name: TestHLSTree (12 TEST_F)
    command: "inputstream.adaptive_test src/test/manifests"
    expected: "pass"
  - name: TestSmoothTree (2 TEST_F)
    command: "inputstream.adaptive_test src/test/manifests"
    expected: "pass"
  - name: TestUtils (5 TEST_F)
    command: "inputstream.adaptive_test src/test/manifests"
    expected: "pass"

# Consumer-side tests (test_package)
test_package_tests:
  - file: test_kodi_addon_inputstream.cpp
    description: |
      Consumer test driving the packaged modules like a minimal Kodi host.
      Part 1 (8 assertions): dlopen()s the packaged inputstream.adaptive.so
      and dlsym()s the ADDONCREATOR-exported C entry points
      ADDON_GetTypeVersion/ADDON_GetTypeMinVersion (pure functions, no Kodi
      host needed): asserts inputstream instance API 3.3.0/3.3.0, general
      API 1.0.5/1.0.4, main API 2.0.2/2.0.0, proving the vendored kodi-dev-kit
      headers compiled in (no BUILD_KODI_ADDON/ADDON_*_USED defined → full
      version table) and all DT_NEEDED resolve at load.
      Part 2 (9 assertions, full-consumer flow): dlsym()s the ADDONCREATOR
      factory export ADDON_Create and drives a real host-stub flow over the
      stable C ABI — ADDON_Create instantiates the real CMyAddon and the
      add-on wires its KodiToAddonFuncTable; create_instance(
      ADDON_INSTANCE_INPUTSTREAM) constructs the real CInputStreamAdaptive
      and wires open/close/get_capabilities + the instance handle;
      GetCapabilities must report exactly
      IDEMUX|IPOSTIME|IDISPLAYTIME|SEEK|PAUSE|ICHAPTER (upstream fixed mask,
      INPUTSTREAM_VERSION_LEVEL 4); Close() with no open session is a safe
      no-op and GetCapabilities stays stable; destroy_instance/destroy/
      dlclose tear down cleanly.
      Part 3 (3 assertions): dlopen()s the packaged ssd_wv.so (the Widevine
      single-sample-decrypter helper the add-on dlopen()s at runtime) and
      asserts its C factory exports CreateDecryptorInstance/
      DeleteDecryptorInstance resolve, then dlclose()es it.
      Every failure exits non-zero.
    command: "./test_kodi_addon_inputstream <libdir>/inputstream.adaptive.so <libdir>/ssd_wv.so"
    assertion_count: 20

assertion_count: 20

notes: |
  上游 21.1.2-Omega 测试套件完整：src/test 的 51 个 TEST_F
  （TestDASHTree 32 + TestHLSTree 12 + TestSmoothTree 2 + TestUtils 5），
  CMake 注册 add_test manifest_tests，对 src/test/manifests 本地清单数据
  运行；用上游自带的完整 Kodi API 桩头 src/test/KodiStubs.h 编译（无需
  Kodi 宿主、curl 桩化、完全离线）。配方按 R51 三步法在 with_tests=True
  时于主配方 build() 编译并在目标真机运行（本次适配已实测，见
  notes.md / 版本 manifest 记录）；CI 默认构建（with_tests=False）不启用。
  消费者测试为真实执行，分三部分：
  - Part 1（8 断言）：dlopen 产物并 dlsym ADDONCREATOR 导出的
    ADDON_GetTypeVersion/ADDON_GetTypeMinVersion，断言返回 kodi-dev-kit
    (21.3-Omega) 的版本宏值（inputstream 3.3.0、general 1.0.5/1.0.4、
    main 2.0.2/2.0.0）；
  - Part 2（9 断言）：dlsym ADDON_Create 工厂导出，以最小 Kodi 宿主桩走
    稳定 C ABI 真实声明流程：ADDON_Create 实例化真实 CMyAddon；
    create_instance 构造真实 CInputStreamAdaptive 并布线
    open/close/get_capabilities 与实例句柄；GetCapabilities 精确断言
    IDEMUX|IPOSTIME|IDISPLAYTIME|SEEK|PAUSE|ICHAPTER（上游固定掩码，
    SDK 的 INPUTSTREAM_VERSION_LEVEL=4）；无会话 Close 安全空操作且
    capabilities 复查一致；destroy_instance/destroy/dlclose 无崩溃收尾。
    C ABI 结构体为 kodi-dev-kit c-api 头的逐字段转写，static_assert
    守卫布局漂移（与 kodi-inputstream-rtmp/21.1.2 同一 SDK 转写）。
  - Part 3（3 断言）：dlopen 打包的 ssd_wv.so（Widevine 单样本解密器
    助手模块，运行时由插件按 WIDEVINECDMFILENAME 旁加载），断言其 C 工厂
    导出 CreateDecryptorInstance/DeleteDecryptorInstance 可解析，dlclose
    收尾。
  注：Open() 的完整网络路径（CSession::Initialize → 清单下载/解析）需要
  Kodi VFS 回调与真实网络栈，不在无宿主消费者测试范围；该路径由上游
  51 个 TEST_F 对解析树/清单逻辑的全覆盖补偿。
