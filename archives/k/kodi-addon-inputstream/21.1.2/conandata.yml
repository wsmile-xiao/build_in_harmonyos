# conandata.yml — kodi-addon-inputstream 21.1.2
# Upstream project id: inputstream.adaptive (Kodi MPEG-DASH / HLS /
# SmoothStreaming client add-on with Widevine SSD), tag 21.1.2-Omega
# (release commit 6ca1c7d5f9b689bcf4c95db50919bc2f8f874cf7).
#
# Three source inputs:
#   addon  — the upstream add-on sources themselves
#   bento4 — the xbmc Bento4 fork the upstream build consumes when
#            ENABLE_INTERNAL_BENTO4=ON (its default): the add-on source tree
#            pins it via depends/common/bento4/bento4.txt and ships the
#            tarball sha256 in depends/common/bento4/bento4.sha256 (cross-
#            checked against this entry). The upstream add-on code is
#            written against the fork's extended AP4 API (AP4_File stream +
#            factory + movie ctor, AP4_AvcFrameParser::ReadGolomb,
#            AP4_UnknownUuidAtom::GetData, SetParentIsOwner, ...), which the
#            vanilla Bento4 release (ohpcd registry bento4/1.6.0-641) does
#            not provide — hence the fork is built into the package exactly
#            like the upstream internal flow does (-DBUILD_APPS=OFF, PIC,
#            static libap4.a). See conanfile.py / recipe-cmake/CMakeLists.txt.
#   sdk    — Kodi binary add-on SDK headers (xbmc/addons/kodi-dev-kit/include)
#            from the xbmc 21.3-Omega release tarball, the same source the
#            kodi-tools/21.3, kodi-addon-screensaver/21.0.2 and
#            kodi-inputstream-rtmp/21.1.2 recipes record (sha256 cross-checked
#            against those recipes' values). Only the include subtree is
#            extracted at source() time (the full xbmc tree is several
#            hundred MB).
# Official upstream URLs only (R39/PF7 — no mirror hosts in new recipes);
# CI adds its own mirror fallback on download failure.
sources:
  "21.1.2":
    addon:
      url:
        - "https://gh-proxy.com/https://github.com/xbmc/inputstream.adaptive/archive/refs/tags/21.1.2-Omega.tar.gz"
        - "https://github.com/xbmc/inputstream.adaptive/archive/refs/tags/21.1.2-Omega.tar.gz"
      sha256: "50eb66172be216eef80def770e7318883027207d1cc2206c0027e4a9871a1af6"
    bento4:
      url:
        - "https://gh-proxy.com/https://github.com/xbmc/Bento4/archive/refs/tags/1.6.0-639-8-Omega.tar.gz"
        - "https://github.com/xbmc/Bento4/archive/refs/tags/1.6.0-639-8-Omega.tar.gz"
      sha256: "d7fc48e52f0037ce977d7f54c49d4f8936cca0e58447c9ce7c55ab64d268e23d"
    sdk:
      url:
        - "https://gh-proxy.com/https://github.com/xbmc/xbmc/archive/refs/tags/21.3-Omega.tar.gz"
        - "https://github.com/xbmc/xbmc/archive/refs/tags/21.3-Omega.tar.gz"
      sha256: "a60afcb556e4a00cb19fc35b7e77758107c9a8096c6ce9b66af5f92396be31aa"
patches: {}
