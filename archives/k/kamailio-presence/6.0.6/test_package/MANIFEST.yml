# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: check_presence_modules.py
    description: "18 模块产物结构/契约/依赖闭包校验（纯 Python ELF 解析，无外部工具依赖）：逐模块核 ELF64 LSB、ET_DYN、EM_AARCH64、core 插件契约名（exports->name == 模块名）、契约导出符号 exports/module_version/module_flags/module_interface_ver（mod_register 按上游加载器语义为可选：sr_module.c:624 先 dlsym，:643 回退 exports，6.0.6 上游本包 6/18 模块含该符号）、DT_NEEDED 落在文档化允许集合（libc / libxml2.so / libcurl.so，presence 家族实测仅此三类）并按模块组断言必需依赖已声明（libxml2 6 组模块、curl 1 个 xcap_client）、无 RPATH/RUNPATH、未定义符号 100% 归类（libc/CRT 前缀 + 依赖包符号前缀 xml*/curl_* + 余下 kamailio core 符号），并对 libxml2/curl 逐符号复核被引用符号真实存在于依赖包导出集，另核 licenses/COPYING 随包"
    command: "python3 check_presence_modules.py"
  - file: test_presence_modules_e2e.c
    description: "鸿蒙特有端到端消费者用例：以消费者身份走通 kamailio core 的 loadmodule 路径 —— 18 个模块逐个 dlopen(presence 模块 .so, RTLD_NOW|RTLD_GLOBAL) → 取导出描述符 exports（校验模块名、dlflags 对齐上游 DEFAULT_DLFLAGS 哨兵值 0）→ dlsym+调用 mod_register（若模块提供）→ 校验 core 侧 sr_kemi_modules_add 收到的 KEMI 表（条目数、子模块名一致性、参数类型位合法；期望表逐模块按上游源码表项计数校准：presence 10 命令/38 参数/1 KEMI 等 18 项）→ 遍历 cfg 命令表/modparam 表核计数与字段（presence_xml 3/16、pua 3/13、rls 5/26、xcap_server 3/7、xcap_client 1/4 等）→ 再以三个模块的真实源码算法做行为用例：presence 的 a_to_i 数值解析（含边界与非法输入）、xcap_server 的 xcaps_path_get_auid_type 与 xcap_parse_uri（URL 解码/XCAP_NSS 截断/子树与 auid 解析/4 组失败路径）、xcap_client 的 xcapInitNodeSel / xcapNodeSelAddStep（命名空间绑定、通配 step、extra_sel 长度口径、size 累计）/ get_node_selector / xcapFreeNodeSel（分配-释放守恒，扣除调用方持有缓冲）→ 断言分配/释放计数真实增长 → dlclose；共 362 项断言全 PASS"
    command: "./test_presence_modules_e2e <modules_dir>"
  - file: kamailio_core_stub.c
    description: "core 符号最小实现层：18 个模块是 core 插件，引用 sr_kemi_modules_add/fixup_*/dprint/… 等 kamailio core 符号；OHOS 的 musl 加载器不做惰性绑定（dlopen 即等价 RTLD_NOW），故由本文件随 e2e 一起编译并以 -Wl,--export-dynamic 导出符号供 dlopen 解析。含两类真实语义：(1) sr_kemi_modules_add 记录函数表并计数、日志路径 sink 化（类型对齐上游：my_pid/dprint_color 为函数、log_level_info 为数组、_km_log_func 指向 sink 而非 NULL）；(2) kamailio 6.x 内存 API 表全局 `_shm_root`/`_pkg_root`（上游 memapi.h 的 sr_shm_api_t/sr_pkg_api_t 逐字段镜像；模块经 `_pkg_root.xmalloc(_pkg_root.mem_block, …)` 分配），后端为 libc 分配并计数——**pkg 分配返回清零内存（calloc 语义）**：上游 xcap_client/xcap_functions.c:193-207 的命名空间节点未给 next 赋值，后端若返回未清零内存则 ns_list 链尾为堆垃圾，遍历 ns_list 的用例（含 get_node_selector）会读野指针且崩溃点随 ASLR 漂移；清零使被测路径确定可复现（上游该未初始化字段已记入 notes.md）。DBG_SR_MEMORY 6 参调试签名对齐（file/func/line/mname 不读取）"
    command: "（与 test_presence_modules_e2e.c 同一次 clang 调用，见 conanfile.py test()）"
  - file: gen_core_stub.py
    description: "弱桩自动生成器：按 18 个被测 .so 的 .dynsym 未定义符号面（实测 180 个），扣除 libc/libc++ 提供方（sysroot libc.so 已定义符号集）与 conan 依赖包提供方（libxml2/curl 等 .so 导出集）后，其余 kamailio core 符号生成为 __attribute__((weak)) 弱定义（强定义胜出，二者共存不冲突）；函数/数据分类按**重定位类型**判定（st_value==0 的 NOTYPE 符号按引用方式归类，实测 .dynsym 的 st_info 分类会得 0 函数）；内置 NEVER_STUB 豁免表（CRT 符号 _init/_fini/_start/__libc_start_main/__cxa_finalize/__dso_handle/__stack_chk_*，以及内存 API 表全局 _shm_root/_pkg_root——后者必须由 kamailio_core_stub.c 提供真实实现）+ libc 前缀误伤例外表（str2facility 等 4 个确属 core 的符号，同仓 kamailio-ims 同类坑）"
    command: "python3 gen_core_stub.py --modules-dir <modules_dir> --out <generated.c> --provided-so <libc.so|依赖 .so …>"

# 测试断言总数（check_presence_modules.py 中的 check() 调用数，实测 249 项，失败 0）
assertion_count: 249

