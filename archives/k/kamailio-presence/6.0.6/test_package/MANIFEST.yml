#     （逐模块 Makefile 无 test 目标，模块目录内 0 个 test* 文件）——即上游对
#     **本包 18 个模块**无可运行的上游用例；本包模块 presence_conference 的
#     test_framework/（17 个 shell/xml 脚本）需 root + sipp/ngrep + 真实 5060 端口上
#     运行中的 kamailio 实例 → 未执行（已在清点表登记）。（与同仓 kamailio-ims 不同：ims_ipsec_pcscf 至少有一个
#     已失效的 spi_list_tests.c）。
#   - 因此本包的上游测试实跑项 = 全包唯一自包含的 Python unittest
#     utils/kamctl/dbtextdb/dbtextdb_test.py（3 个用例，仅依赖 Python 标准库）。
#
# 【实跑】
#   (a) utils/kamctl/dbtextdb/dbtextdb_test.py → 已在 conanfile.py 的 build() 末尾
#       对**上游源码树真实执行**（OHOS aarch64 交叉构建环境）：
#       Ran 3 tests in 0.015s / OK（3/3，failures=0 errors=0）。
#   (b) 本包 18 模块专属上游用例：清点结果 0 处（见上）；本包模块 presence_conference 的
#       test_framework（17 脚本）非自包含（需 root+sipp/ngrep+运行中实例），已登记「未执行」。
#
# 【回填】本文件据实登记：上游用例 17 个文件逐项列明执行与否及具体技术原因；
#   本包自带的消费者用例（test_package/）承担 18 模块的契约层与算法行为层验证。
upstream_check_command: "python3 dbtextdb_test.py -v"
upstream_test_in_build: true
upstream_test_command: "python3 dbtextdb_test.py -v"

