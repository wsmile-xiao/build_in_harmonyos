# 版本级 manifest — kamailio-presence 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-presence"
status: built                      # R29 口径：conan create/verify 已 PASS 但尚未 conan upload → built；发布流水线（合并后）上传成功再转 published
build_date: "2026-09-30"
build_system: makefile             # kamailio 经典 Makefile 体系（非 autotools/cmake）
conan_ref: "kamailio-presence/6.0.6"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  scope: "presence 家族 18 个模块（不编译 kamailio 主程序）"
  configure_options:
    - "make cfg include_modules=\"presence presence_conference presence_dfks presence_dialoginfo presence_mwi presence_profile presence_reginfo presence_xml pua pua_bla pua_dialoginfo pua_reginfo pua_rpc pua_usrloc pua_xmpp rls xcap_client xcap_server\" extra_defs=\"见本文件 build.platform_defs\" LOCALBASE=<libxml2 包目录> XML2CFG="
    - "make modules modules=\"modules/presence … modules/xcap_server\"（共 17 个，libxml2 组） -j1 extra_defs=\"见本文件 build.platform_defs\" LOCALBASE=<libxml2 包目录> XML2CFG="
    - "make modules modules=\"modules/xcap_client\"（curl 组，单独一次：LOCALBASE 须改指 curl 包目录） -j1 extra_defs=\"见本文件 build.platform_defs\" LOCALBASE=<curl 包目录> CURLCFG= CURL_BUILDER="
  platform_defs: "-D_GNU_SOURCE -DHAVE_GETHOSTBYNAME2 -DHAVE_SCHED_YIELD -DHAVE_MSG_NOSIGNAL -DHAVE_MSGHDR_MSG_CONTROL -DHAVE_ALLOCA_H -DHAVE_TIMEGM -DHAVE_SCHED_SETSCHEDULER -DHAVE_IP_MREQN（共 9 项 = -D_GNU_SOURCE + 8 个 -DHAVE_*，与 conanfile.py PLATFORM_DEFS 逐项一致）"
  parallel_jobs: 1
  parallel_jobs_reason: "E525/E074：OHOS SELinux 禁止用户进程创建 FIFO，GNU make jobserver 靠 FIFO 传递令牌 → -j>1 有挂起/报错风险；与同族其余 kamailio-* 配方一致固定 -j1"
  modules:
    - presence
    - presence_conference
    - presence_dfks
    - presence_dialoginfo
    - presence_mwi
    - presence_profile
    - presence_reginfo
    - presence_xml
    - pua
    - pua_bla
    - pua_dialoginfo
    - pua_reginfo
    - pua_rpc
    - pua_usrloc
    - pua_xmpp
    - rls
    - xcap_client
    - xcap_server
  dependencies:
    - libxml2/2.15.3.1
    - curl/8.15.0.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 上游 6.0.6 源码包原生识别 aarch64-unknown-linux-ohos；平台差异全部经 make
# 命令行变量表达（OS=harmonyos + extra_defs 宏集 + 两个外部库探测钉死），
# 未改动任何上游源文件/构建文件
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`（生成 src/config.mak），否则报 No rule to make target 'cfg-defs'；`make modules modules='modules/<m> …'` 以空格分隔的目录列表一次可只编指定模块集（本包 18 个模块共用一次 cfg + 两次 modules 调用） (knowledge_ref: notes.md#3-构建方法)"
  - "OS=harmonyos 不在 Makefile.defs 的 linux/solaris/freebsd/darwin 任一分支 → HAVE_GETHOSTBYNAME2/HAVE_SCHED_YIELD 等平台探测宏全部缺失，core 头直接 #error。解法：make 命令行 extra_defs 注入 linux 分支等价宏集（9 项，对照 OHOS SDK sysroot 实证存在） (knowledge_ref: notes.md#41-平台探测宏缺失)"
  - "只编模块、不编 core 是零补丁的关键：core/resolve.c 的 _res（HAVE_RESOLV_RES）与 core/lock_ops.h 的 union semun（HAVE_UNION_SEMUN）在 OHOS musl 头文件中无对应定义，仅编译 kamailio 主程序时才触发 (knowledge_ref: notes.md#42-只编模块不编-core)"
  - "LOCALBASE 是单值变量，同一批 make 内无法同时指向两个第三方库包目录：本包 xcap_client 的 Makefile 回退分支是 `-I$(LOCALBASE)/include -L$(LOCALBASE)/lib -lcurl`，与 libxml2 组的 `-I$(LOCALBASE)/include/libxml2 -L$(LOCALBASE)/lib -lxml2` 互斥 → 须拆成两次 make，各自命令行传 LOCALBASE (knowledge_ref: notes.md#43-多依赖库的-localbase-拆分)"
  - "xcap_client/Makefile 的探测分支变量名是 `CURLCFG`（不是文件内同时定义的 `CURL_BUILDER`——后者是未被任何条件引用的上游遗留死代码）：仅置 `CURL_BUILDER=` 不生效，必须同时置 `CURLCFG=` 才能钉死 LOCALBASE 回退分支，否则构建机的 curl-config/pkg-config 参与交叉编译 (knowledge_ref: notes.md#44-xcap_client-的-curlbuilder-死代码)"
  - "presence/presence_xml/rls 三模块 Makefile 的 icu-uc 探测整块被 `ifeq ($(OS), darwin)` 包裹 → OS=harmonyos 下 ICU_BUILDER 恒空、该分支不生效，本包不引入 ICU 依赖（DT_NEEDED 实测无 libicu*） (knowledge_ref: notes.md#45-icu-探测的-darwin-守卫)"
  - "18 个 presence 家族模块的消费者级验收手法：逐模块 dlopen + dlsym(\"exports\") 校验 module_exports 契约（name/version/cmds/params/kemi 计数与上游源码逐项对齐），并以 RTLD_NOW 全量符号解析暴露 core 桩层缺口——core 桩必须逐字段对齐上游头类型，否则日志路径解引用野指针 SIGSEGV 掩盖真实失败；OHOS 的 musl 加载器不做惰性绑定（dlopen 即等价 RTLD_NOW），core 桩须随用例一起以 -Wl,--export-dynamic 导出符号 (knowledge_ref: test_package/kamailio_core_stub.c, test_package/test_presence_modules_e2e.c)"
  - "上游 kamailio 6.0.6 的 xcap_client/xcap_functions.c:193-207 存在未初始化链表节点缺陷：xcapNodeSelAddStep 分配 ns_list_t 新节点后未给 ns->next 赋值（同文件 :186 的 step_t 分支有 s->next = NULL），而 pkg_malloc 后端不保证清零 → ns_list 链尾为堆垃圾，任何遍历该链的调用方（用例链长统计、模块 get_node_selector）读野指针 SIGSEGV，崩溃地址随 ASLR 漂移（实测 si_addr=0x40000018, pc=0x0）。处置：测试设施层把 pkg 分配后端改为清零分配（calloc 语义）使链遍历确定可复现（本包走零补丁路线，不改上游源码）；上游缺陷已在 notes.md 与知识条目登记，供真机集成方评估 (knowledge_ref: knowledge/drafts/E999-draft-B183.kv)"
  - "OHOS 设备上 gdb/lldb 因 ptrace 受限（warning: ptrace: Permission denied）无法追踪进程：崩溃定位改走「信号处理器 + dladdr 打印出错符号/偏移」+「独立最小探针二分（先证桩侧分配正常再回用例层）」+「关键轨迹走 stderr 直写绕开 stdout 缓冲丢失」三步法 (knowledge_ref: knowledge/drafts/E999-draft-B183.kv)"

patch_generation:
  method: none
  patches_count: 0
  note: "refresh-patch --auto 复核无候选补丁；patches/ 为空、conandata.yml 为 patches: {}"

patch_classification: []
