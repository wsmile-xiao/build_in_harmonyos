# Kyoto Cabinet 软件元数据

software: kyotocabinet
category: database
description: 高性能键值存储数据库库，支持多种数据库类型（HashDB/TreeDB/PolyDB/ForestDB）

# 版本索引
versions:
  - version: "1.2.80"
    status: published
    build_date: "2026-05-29"
    notes: 功能测试通过，所有数据库类型正常工作

# 软件特性
features:
  - HashDB（哈希数据库）
  - TreeDB（B+树数据库）
  - PolyDB（多态数据库）
  - ForestDB（文档数据库）

