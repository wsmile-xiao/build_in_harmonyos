# 版本级 manifest — archives/k/ktextwidgets/6.14.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "6.14.0"
software: "ktextwidgets"

# built — conan create + test_package 通过；published 由 release 流水线决定
status: built
build_date: "2026-08-29"
build_system: cmake

source:
  url: "https://download.kde.org/stable/frameworks/6.14/ktextwidgets-6.14.0.tar.xz"
  sha256: "4e24e6da477e08d0f71552f081206516fcd9ab4a593cf37d77ebd690856b76b5"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKF_SKIP_PO_PROCESSING=ON"
    - "-DWITH_TEXT_TO_SPEECH=OFF"
    - "-DBUILD_DESIGNERPLUGIN=OFF"
    - "-DBUILD_TESTING=ON"
  dependencies:
    - kcompletion/6.14.0
    - kconfig/6.14.0
    - ki18n/6.14.0
    - kwidgetsaddons/6.14.0
    - sonnet/6.26.0
    - qtbase/6.11.1
    - qtbase-gui/6.11.1
    - ecm/6.20.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "KF6 已发布二进制包的 DT_NEEDED 含 ../../bin/*.so 构建树相对路径：ctest/test_package 运行前需在 <build>/../bin 建依赖 .so 软链接农场（kxmlgui 模式）"
  - "KF6*Config.cmake 会对全部直接 KF6 依赖做 find_dependency：test_package 必须显式 requires 这些包并注入各自 lib/cmake 前缀"
  - "find_package(KF6Sonnet 6.14.0) 版本范围 [6.14.0,7.0) 可由 sonnet/6.26.0 满足，无需重复适配旧版"
  - "Qt6UiPlugin 未发布 → KF6 包统一 BUILD_DESIGNERPLUGIN=OFF；Qt6TextToSpeech 未发布 → WITH_TEXT_TO_SPEECH=OFF"
