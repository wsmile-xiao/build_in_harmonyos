# test_package/MANIFEST.yml
# Upstream and consumer test declaration for ktextwidgets/6.14.0.

package: ktextwidgets/6.14.0
homepage: https://invent.kde.org/frameworks/ktextwidgets

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/kfindtest.cpp
    source: ktextwidgets-6.14.0/autotests/kfindtest.cpp
    description: "KFind widget behavior tests"
    command: "ctest -R ktextwidgets-kfindtest"
  - file: autotests/kreplacetest.cpp
    source: ktextwidgets-6.14.0/autotests/kreplacetest.cpp
    description: "KReplace widget behavior tests"
    command: "ctest -R ktextwidgets-kreplacetest"
  - file: autotests/krichtextedittest.cpp
    source: ktextwidgets-6.14.0/autotests/krichtextedittest.cpp
    description: "KRichTextEdit toolbar/formatting tests"
    command: "ctest -R ktextwidgets-krichtextedittest"
  - file: autotests/kpluralhandlingspinboxtest.cpp
    source: ktextwidgets-6.14.0/autotests/kpluralhandlingspinboxtest.cpp
    description: "KPluralHandlingSpinBox tests"
    command: "ctest -R ktextwidgets-kpluralhandlingspinboxtest"
  - file: autotests/ktextedit_unittest.cpp
    source: ktextwidgets-6.14.0/autotests/ktextedit_unittest.cpp
    description: "KTextEdit unit tests"
    command: "ctest -R ktextedit_unittest"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer test: KRichTextEdit/KTextEdit real API (className, setPlainText/toPlainText, insertHtml, setReadOnly, checkSpellingEnabled sonnet path) - 9 assertions."
    command: "conan create (test_package builds and runs test_ktextwidgets)"

assertion_count: 9
