software: kimageformats
version: "6.26.0"
status: built
build_date: "2026-06-05"

source:
  url: "https://invent.kde.org/frameworks/kimageformats/-/archive/v6.26.0/kimageformats-v6.26.0.tar.bz2"
  sha256: ""
  tar_format: tar.bz2

build_system: cmake

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_TESTING=OFF"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKIMAGEFORMATS_HEIF=OFF"
    - "-DKIMAGEFORMATS_JXL=OFF"
    - "-DKIMAGEFORMATS_JP2=OFF"
    - "-DKIMAGEFORMATS_WITH_KNOWN_CRASHES_JXR=OFF"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"
  dependencies:
    - qt6/6.11.1
    - ecm/6.26.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ECM version must match kimageformats version (6.26.0 required)"
  - "KIMAGEFORMATS_HEIF, JXL, JP2, JXR must be disabled for musl libc OHOS"
  - "KF_IGNORE_PLATFORM_CHECK=TRUE required for cross-platform build"