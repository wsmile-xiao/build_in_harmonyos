software: kworkflow
display: "kworkflow (kw)"
description: "面向 Linux 内核开发者的 bash 工具集（构建、部署、代码探索、远程管理、补丁流程等）"
category: development
homepage: "https://github.com/kworkflow/kworkflow"
license: GPL-2.0-or-later
build_system: bash-scripts

ohos_adaptation:
  key_points:
    - "纯 bash 脚本项目，零编译产物；setup.sh 不可原样执行（依赖 rsync/sphinx/git 联网 clone patch-hub 并安装进 $HOME），conanfile.py 按 setup.sh 的安装布局手动打包（bin/kw + lib/kw 全树 + etc/kw 模板 + share 数据 + bash 补全）"
    - "kw 硬依赖 bash>=4.3（local -n nameref x47、declare -A x18、mapfile x6）；直接 requires bash/5.3（ohpcd 已发布 armv8 静态二进制），kw 入口 shebang 保持 #!/usr/bin/env bash（知识 E049 shebang-portable-fix），package_info 通过 PATH + KW_LIB_DIR/XDG_CONFIG_HOME/XDG_DATA_HOME 传播运行环境契约"
    - "OHOS toybox 与 GNU coreutils 长选项不兼容：patches/ohos-toybox-longopts.patch 将 sort --dictionary-order→sort -d、ln --symbolic --force→ln -sf、rm --recursive --force→rm -rf、sed --in-place [--follow-symlinks] [--regexp-extended]→sed -i [-r]、grep --line-regexp→grep -x、date --date @→date -d @、cut --delimiter=--fields=→-d/-f、diff 丢弃 --color=always；sed --follow-symlinks 无 toybox 等价物已丢弃（symlink 配置原地编辑会替换链接本身，行为偏差已记录）"
    - "GNU date 字符串解析/日期算术（date --date='X + N day'）toybox 完全不支持（探针 date -d '2026/01/01' → bad date）：kw 的周/月统计、get_week_day 等日历类功能在 OHOS 受限；秒级换算（date -d @epoch）可用。相关上游单测（kw_time_and_date、statistics）据此排除"
    - "sparse/smatch/cscope 非 0.10 依赖纠偏：kw 源码对三者零引用，不写入依赖闭包"
    - "test_package 通过 Conan 2 合法 API self.dependencies[...].package_folder 拼装 bash 的 bin 路径注入测试进程 PATH（bash/5.3 的 package_info 仅 cpp_info.libs=[\"bash\"]，不暴露 bin）"
  common_dependencies:
    - bash 5.3

versions:
  "0.10":
    status: built
    build_date: "2026-09-23"
    source_url: "https://github.com/kworkflow/kworkflow/archive/refs/tags/0.10.tar.gz"
