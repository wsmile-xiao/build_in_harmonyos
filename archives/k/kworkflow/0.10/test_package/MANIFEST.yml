# test_package/MANIFEST.yml — kworkflow 0.10 上游测试声明
#
# 上游测试体系：run_tests.sh + shunit2（需 vendor 到 tests/shunit2）。
# 集成套件 tests/integration 走 podman 容器（OHOS 设备无 podman，不可行）。
# 单测中可运行的"纯脚本自足子集"经 toybox/bash 探针逐一核对后真实运行；
# 其余逐个排除，理由见 EXCLUDED-TESTS.md（每条附设备探针/源码证据）。

package: kworkflow/0.10
homepage: "https://github.com/kworkflow/kworkflow"
upstream_tag: "0.10"
upstream_commit: "2d8a04bb29533d161fa5661578c78ce0569661b7"

upstream_check_command: "./run_tests.sh --unit"
upstream_test_in_build: false
upstream_test_command: "test_package: kw_test_runner.sh Section B（复刻上游 run_tests.sh 的 init_env + export -f include + shunit2 执行语义）"

# 注：上游 tests/unit/lib/ 三个自足单测在本仓 vendor 为 tests/unit/lib_tests/
# （工程 .gitignore 的 archives/**/lib/ 规则会忽略名为 lib/ 的目录，仅改 vendored
# 路径，文件内容与上游逐字节一致）。
upstream_tests:
  - file: tests/unit/lib_tests/kw_string_test.sh
    source: "kworkflow-0.10/tests/unit/lib/kw_string_test.sh"
    description: "字符串库（chop/last_char/trim/string_to_unix_filename 等），纯 bash + sed/tr"
  - file: tests/unit/lib_tests/kw_include_test.sh
    source: "kworkflow-0.10/tests/unit/lib/kw_include_test.sh"
    description: "include 加载机制（去重/异常路径/同名冲突），realpath 探针通过"
  - file: tests/unit/lib_tests/kwio_test.sh
    source: "kworkflow-0.10/tests/unit/lib/kwio_test.sh"
    description: "IO/输出/ask_yN/load_module_text，纯 bash + toybox 可用命令；vendored 机械调整：wait \"$!\"→wait 共 10 处（消除上游 alert 后台任务竞态，详见 EXCLUDED-TESTS.md D4）"
  - file: tests/unit/kw_test.sh
    source: "kworkflow-0.10/tests/unit/kw_test.sh"
    description: "入口脚本全局变量与 repo 模式（KW_LIB_DIR/KWORKFLOW/export 校验）"
  - file: tests/unit/kw_env_test.sh
    source: "kworkflow-0.10/tests/unit/kw_env_test.sh"
    description: "kw env 创建/切换/销毁/迁移（覆盖 mktemp -d 与补丁后的 ln -sf / sort -d 路径）"
  - file: tests/unit/kw_remote_test.sh
    source: "kworkflow-0.10/tests/unit/kw_remote_test.sh"
    description: "remote 配置增删改查/默认远程（覆盖补丁后的 sed -i -r / grep -x 路径）；vendored 机械调整 1 行：setup 中 ln --symbolic → ln -sf（toybox ln 不支持 GNU 长选项，属测试自身 setup 代码，与源码补丁同类）"
  - file: tests/unit/self_update_test.sh
    source: "kworkflow-0.10/tests/unit/self_update_test.sh"
    description: "self-update 参数解析与 TEST_MODE 更新路径（不触网）"
  - file: tests/unit/permissions_test.sh
    source: "kworkflow-0.10/tests/unit/permissions_test.sh"
    description: "src 下 .sh 文件权限一致性（stat -c %a，toybox 支持已探针）"
  - file: tests/unit/help_test.sh
    source: "kworkflow-0.10/tests/unit/help_test.sh"
    description: "help/man/version 输出（man 为 TEST_MODE 字符串断言；repo 模式版本走真实 git 2.45.2）"
  - file: tests/unit/diff_test.sh
    source: "kworkflow-0.10/tests/unit/diff_test.sh"
    description: "diff_main/diff_folders（源码已补丁为 diff --recursive --brief，toybox 输出格式已探针一致）；其 3 个磁盘首扇区二进制样本以 first_set_of_bytes_from_disk_b64/*.b64 单行 base64 存储、运行前由 runner 物化还原（见 EXCLUDED-TESTS.md §D.5）"
  - file: tests/unit/explore_test.sh
    source: "kworkflow-0.10/tests/unit/explore_test.sh"
    description: "explore 命令构造与 git 仓内搜索（设备 git 2.45.2 真实 init/commit）；vendored 机械调整：wc --lines → wc -l 共 4 处（toybox wc 不支持 GNU 长选项，属测试自身统计代码，与源码补丁同类）"

test_package_tests:
  - file: kw_test_runner.sh
    description: "OHOS 适配用例（A1-A10：bash>=4.3 与 nameref/declare -A/mapfile 探针、PATH 注入、shebang 可移植、打包布局/版本、无 CRLF 无绝对路径、toybox 补丁生效、--version/--help smoke、kw env --create/--use 走 mktemp 路径、create_shared_memory_dir）+ 上游子集真实运行"
    command: "bash kw_test_runner.sh"

assertion_count: 200

# NOT_RUN 说明：
# - 集成套件（podman）与本单测排除项逐条理由见 EXCLUDED-TESTS.md，
#   均为环境限制/工具缺失（podman/fish/sqlite3/dialog/perl/sudo/rsync/make）
#   或 OHOS toybox 缺失 GNU date 字符串算术，非本配方工程质量问题。
