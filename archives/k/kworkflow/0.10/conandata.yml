    patch_description: "OHOS toybox 兼容：GNU 长选项改为等价短选项（sort/ln/rm/diff/sed/grep/cut/tr/date -d@）；base64 丢弃 toybox 不支持的 --wrap=0（补 base64 | tr -d '\\n' 输出规整保持单行 token）；diff 丢弃 --color=always；sed 丢弃 --follow-symlinks（toybox 无等价物；kw_remote.sh 以 sed_in_place 助手解析链接目标后原位编辑，已恢复保持符号链接语义）；create_shared_memory_dir 在 /dev/shm mktemp 失败（MAC）时回落默认临时目录"
    patch_type: "portability"
