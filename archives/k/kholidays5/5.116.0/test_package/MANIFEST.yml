version: 1
package: kholidays5/5.116.0
homepage: https://invent.kde.org/frameworks/kholidays

tests:
  upstream:
    status: planned
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error --timeout 300"
    source: "kholidays-5.116.0/autotests/"
    expected:
      - testlunar
      - testseasons
      - testsunriseset
      - testzodiac
      - testholidayregion
  package:
    status: planned
    source: test.cpp
    command: "./test_kholidays5"
    description: >-
      Drives the real public KHolidays API the way downstream KDE
      consumers (Plasma digital-clock holidays, eventviews, calendar
      plugins) use it (HolidayRegion regionCodes registry +
      rawHolidaysWithAstroSeasons over the plan2 corpus, SunRiseSet
      utcSunrise/utcSunset reference values, LunarPhase phaseAtDate,
      Zodiac signAtDate/signName, the org.kde.kholidays QML plugin
      deliverable) and asserts HarmonyOS-specific behaviour (R53): the
      packaged libKF5Holidays.so carries the OHOS-required unversioned
      DT_SONAME and a DT_RUNPATH (E537 install-RPATH adaptation), parsed
      from the ELF dynamic section of the consumer-visible package path.

notes:
  - "kholidays5 is a library package (libKF5Holidays.so plus the
     org.kde.kholidays QML plugin, KF5HolidaysConfig.cmake / headers /
     .pri metadata); no commands.json is required (R38)."
  - "Upstream tests are run from build() with ctest: the five autotests
     (testlunar 3 functions, testseasons 2, testsunriseset 5, testzodiac
     a plain-main smoke run, testholidayregion 11 Q_SLOTS functions) are
     pure computation tests over the qrc-embedded region data with TZ=UTC;
     the three KDESRCDIR fixture directories resolve from the source tree."
