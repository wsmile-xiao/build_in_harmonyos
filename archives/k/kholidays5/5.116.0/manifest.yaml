knowledge_gained:
  - "kholidays 5.116.0 is a Tier-1 KF5 library with zero KF5 library dependencies: the top-level find_package needs only Qt5 5.15.2 Core + Qml, so the Qt5 supply is the two-package split qt5-qtbase/5.15.2.2 (native per-module configs) + qt5-qtdeclarative/5.15.2 (CMakeDeps Qt5Qml config) with a hand-written aggregated Qt5Config.cmake shim in the generators folder (kpeople5 precedent, reduced to this graph's components)."
  - "The plan-language parser sources are pre-generated in the 5.116.0 tarball (holidayparserplan.cpp / holidayscannerplan.cpp shipped alongside the .ypp/.lpp grammars; no bison/flex/m4 tool_requires needed, unlike the KF6 kholidays 6.28.0 line where the generated files were dropped from the tarball)."
  - "KF_SKIP_PO_PROCESSING=ON skips only the poqm catalog processing (ecm_process_po_files_as_qm / ecm_install_po_files_as_qm return early); ecm_create_qm_loader still generates the qm loader source the library links, so the library API stays intact with an empty catalog set."
