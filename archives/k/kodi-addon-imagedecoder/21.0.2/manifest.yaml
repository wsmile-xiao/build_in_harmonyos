name: kodi-addon-imagedecoder
version: "21.0.2"
status: built
build_date: "2026-09-25"
source:
  url: https://github.com/xbmc/imagedecoder.mpo/archive/refs/tags/21.0.2-Omega.tar.gz
  sha256: 09c2466da38cc270051cd8c6df29b40628803ab4f17be5a2895c17e0e5c040b6
  tar_format: tar.gz
build:
  system: cmake
  configure_options: []
  dependencies:
    - libjpeg-turbo/3.2.0
    - tinyxml2/10.1.0
    - "kodi add-on SDK headers from xbmc 21.3-Omega tarball (kodi-dev-kit include subtree, sha256 a60afcb556e4a00cb19fc35b7e77758107c9a8096c6ce9b66af5f92396be31aa)"
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - Upstream build needs find_package(Kodi)+build_addon() (kodi-addon-dev);
    recipe supplies its own CMake entry under recipe-cmake/ consumed via
    build_script_folder, building the unmodified upstream sources — the
    vendored libmpo and TinyEXIF sources are compiled straight into the
    add-on module (upstream links them through DEPLIBS mpo_static)
  - Kodi add-on SDK headers are extracted selectively (kodi-dev-kit include
    only) from the xbmc 21.3-Omega tarball via conandata sources.sdk
  - Image decoder add-on has no GL/EGL render path (writes decoded pixels
    into the host buffer), so no HAS_GLES/GLESv3/EGL is needed — module
    target keeps the exact upstream output name imagedecoder.mpo.so
    (PREFIX "")
  - Registry libjpeg-turbo package is shared-only (ENABLE_STATIC=OFF), so
    the module keeps DT_NEEDED libjpeg/libtinyxml2; test_package prepends
    the dependency libdirs to LD_LIBRARY_PATH for the dlopen() check
software: kodi-addon-imagedecoder
build_system: cmake
