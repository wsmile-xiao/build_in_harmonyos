software: kubeconform
display: "kubeconform"
description: "A FAST Kubernetes manifests validator, with support for Custom Resources"
category: network
homepage: "https://github.com/yannh/kubeconform"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 项目，CGO_ENABLED=0 静态编译，无 C 依赖"
    - "上游自带 vendor 目录，-mod=vendor 离线构建"
    - "版本注入 -X main.version=v0.7.0（与 goreleaser 一致）"
    - "OHOS 上 GOOS=linux，产物需 binary-sign-tool 自签名"
  common_dependencies:
    - "go/1.24.0"

versions:
  "0.7.0":
    status: built
    build_date: "2026-09-18"
