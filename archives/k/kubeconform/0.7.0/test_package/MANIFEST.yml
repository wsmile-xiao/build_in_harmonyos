package: kubeconform/0.7.0
homepage: https://github.com/yannh/kubeconform

upstream_check_command: "go test -mod=vendor -v ./..."
upstream_test_in_build: true
upstream_test_command: "go test -mod=vendor -v ./..."

upstream_tests:
  - file: pkg/config/config_test.go
    source: kubeconform-0.7.0/pkg/config/config_test.go
    description: "Config flag parsing tests (TestSkipKindMaps, TestFromFlags)"
    command: "go test -mod=vendor -v ./pkg/config"
  - file: pkg/loader/http_test.go
    source: kubeconform-0.7.0/pkg/loader/http_test.go
    description: "HTTP loader tests against local httptest servers"
    command: "go test -mod=vendor -v ./pkg/loader"
  - file: pkg/output/*_test.go
    source: kubeconform-0.7.0/pkg/output/
    description: "Output formatter tests (json, junit, pretty, tap, text)"
    command: "go test -mod=vendor -v ./pkg/output"
  - file: pkg/registry/registry_test.go
    source: kubeconform-0.7.0/pkg/registry/registry_test.go
    description: "Schema path template test (TestSchemaPath)"
    command: "go test -mod=vendor -v ./pkg/registry"
  - file: pkg/resource/*_test.go
    source: kubeconform-0.7.0/pkg/resource/
    description: "Resource discovery and parsing tests (files, resource, stream)"
    command: "go test -mod=vendor -v ./pkg/resource"
  - file: pkg/validator/validator_test.go
    source: kubeconform-0.7.0/pkg/validator/validator_test.go
    description: "Validator tests with in-memory mock registries"
    command: "go test -mod=vendor -v ./pkg/validator"

test_package_tests:
  - file: test.sh
    description: "Offline consumer checks: version, help, valid/invalid local-schema validation, stdin pipeline"
    command: "bash test.sh <bin/kubeconform>"

assertion_count: 5
