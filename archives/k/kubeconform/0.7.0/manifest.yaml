software: kubeconform
build_system: custom
version: "0.7.0"
status: built
build_date: "2026-09-18"

source:
  url: "https://github.com/yannh/kubeconform/archive/refs/tags/v0.7.0.tar.gz"
  sha256: "9cb00e6385346c9de21e8fe318a4ec9854a8c7165d08b10b20ed32e28faef9a8"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOFLAGS=-mod=vendor"
    - "GOTOOLCHAIN=local"
    - "GOPROXY=https://goproxy.cn,direct"
    - "LDFLAGS=-s -w -X main.version=v0.7.0"
  dependencies:
    - "go/1.24.0"
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Go项目使用 go build 编译，无 configure/make 流程"
  - "上游自带 vendor 目录，-mod=vendor 可离线构建，无需 go mod download"
  - "版本注入路径为 main.version（goreleaser ldflags -X main.version），-v 即打印版本"
  - "上游 go test 共 12 个 _test.go 文件、20 个 Test 函数，全部离线可跑"
  - "acceptance.bats 需 docker/bats/在线 schema，真机与 CI 均不运行"
