knowledge_gained:
  - "kdbusaddons/6.29.0 requires qtbase/6.11.1.1 which conflicts with the qtbase/6.11.1 the published KF6 6.26 stack links; the 6.18.0 line aligns on qtbase-sql-dbus/6.11.1 (version-floor lowering, aurorae precedent)."
  - "The OHOS GNU make 4.4.1 port uses an mkfifo-based jobserver and the OHOS sandbox denies mkfifo everywhere (HMDFS EPERM, /tmp EROFS): any make -jN build dies; use the Ninja generator (ninja 1.13.1 in /data/service/hnp/bin)."
  - "HMDFS is case-insensitive: CMake targets differing only by case (KGlobalAccelD vs kglobalacceld) collide on CMakeFiles/<target>.dir and <target>_autogen.dir, silently overwriting AUTOMOC output (moc_*.cpp not found); rename one target and keep the artifact name via OUTPUT_NAME."
  - "OHOS qtbase builds Qt6DBus with dbus-linked=OFF: libQt6DBus dlopens libdbus-1.so.3 at runtime, but the registry ships only static libdbus-1.a — without a shared libdbus every Qt6DBus consumer gets an invalid session bus. Vendors a shared dbus-1 client lib in-recipe until a shared dbus package is published."
  - "E537 method 1 (IMPORTED_SONAME stamping) does not change CMake's link line for imported targets; method 2 (target_link_directories + bare -l + re-added INTERFACE_INCLUDE_DIRECTORIES) removes the absolute Conan cache paths from DT_NEEDED."
