# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kglobalacceld/6.7.2.

package: kglobalacceld/6.7.2
homepage: https://invent.kde.org/plasma/kglobalacceld

# Upstream ships autotests/ with 3 ecm_add_test-registered QtTest cases
# (BUILD_TESTING=ON): migrateconfigtest, shortcutstest, allowlisttest.
# They are compiled by the package build and really executed on the device
# inside conanfile.py build() via ctest (migrateconfigtest is file-based;
# shortcutstest/allowlisttest drive the daemon over a session bus started
# from the dbus/1.14.10.1 tool package: TCP + ANONYMOUS, since the OHOS
# sandbox forbids AF_UNIX binds — DRAFT-dbus-1.14.10.1-ohos-session-bus-runtime).
upstream_check_command: "ctest --test-dir <build_folder> -N  # 3 tests"

upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --timeout 120 (executed in conanfile.py build(), OS=OHOS)"

upstream_tests:
  - file: autotests/CMakeLists.txt
    source: kglobalacceld-6.7.2/autotests/CMakeLists.txt
    description: >-
      3 QtTest cases registered with ecm_add_test: migrateconfigtest
      (config migration, file-based), shortcutstest (shortcut
      registration/triggering through the dummy static platform plugin),
      allowlisttest (allow-list gating through the daemon D-Bus service).
    command: "ctest --test-dir <build_folder> --output-on-failure --timeout 120"

test_package_tests:
  - file: test_package/test.cpp
    description: >-
      OHOS-specific consumer test (real API usage, non-zero exit on failure):
      links K::KGlobalAccelD via the exported KGlobalAccelD CMake package;
      asserts the driver-provided DBUS_SESSION_BUS_ADDRESS (TCP+ANONYMOUS
      session bus shim — no AF_UNIX bus exists on OHOS); runs
      KGlobalAccelD::init() with no platform grabber plugin (WITH_X11=OFF)
      and asserts the daemon still registers /kglobalaccel and owns
      org.kde.kglobalaccel on that bus; verifies clean tear-down with a
      second init cycle.
    command: "conan create (test_package builds and runs test_ohos_daemon)"
  - file: test_package/conanfile.py (_elf_artifact_checks)
    description: >-
      OHOS-specific artifact assertions (readelf): packaged
      libKGlobalAccelD.so carries DT_SONAME libKGlobalAccelD.so.0;
      DT_NEEDED contains no libKF6KIO*/libKF6JobWidgets* (WITH_KIO=OFF
      patches effective) and no libxcb*/libX11* (WITH_X11=OFF effective);
      libexec/kglobalacceld binary exists; the xcb platform plugin
      directory is absent.
    command: "conan create (test_package test(), OS=OHOS only)"

assertion_count: 11
