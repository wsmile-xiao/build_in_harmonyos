# conandata.yml — kglobalacceld 6.7.2
sources:
  url: "https://download.kde.org/stable/plasma/6.7.2/kglobalacceld-6.7.2.tar.xz"
  sha256: "40cd6b417678faba69847e1fa4d9efc8f500cdf95db17e317d6d868d18c95339"

patches:
  "6.7.2":
    - patch_file: "patches/0001-ohos-optional-kio-jobwidgets.patch"
      patch_description: "Make KF6KIO/KF6JobWidgets optional via WITH_KIO (OHOS has no KIOGui provider)"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-kserviceactioncomponent-no-kio-fallback.patch"
      patch_description: "Guard the KIO-based desktop-file launch path with HAVE_KIO; log a warning instead of launching when KIO is off"
      patch_type: "portability"
    - patch_file: "patches/0003-ohos-kf6-min-version-floor-6.18.0.patch"
      patch_description: "Lower KF6_MIN_VERSION 6.26.0 -> 6.18.0: kdbusaddons 6.29.0 requires qtbase/6.11.1.1 which conflicts with the qtbase/6.11.1 the published KF6 6.26 stack links; kdbusaddons 6.18.0 aligns on qtbase-sql-dbus/6.11.1 (aurorae 6.7.2 precedent)"
      patch_type: "portability"
    - patch_file: "patches/0004-ohos-hmdfs-case-insensitive-target-collision.patch"
      patch_description: "Rename the executable CMake target to kglobalacceld_daemon: HMDFS is case-insensitive and the kglobalacceld/KGlobalAccelD target build dirs collide, overwriting AUTOMOC output; installed binary name kept via OUTPUT_NAME"
      patch_type: "portability"
    - patch_file: "patches/0005-ohos-e537-imported-soname-basenames.patch"
      patch_description: "E537: stamp IMPORTED_SONAME on SONAME-less imported KF6 targets (deferred) so the linker records bare basenames instead of absolute Conan cache paths in DT_NEEDED"
      patch_type: "portability"
