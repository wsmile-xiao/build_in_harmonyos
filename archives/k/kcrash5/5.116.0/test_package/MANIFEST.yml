# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kcrash5/5.116.0
homepage: "https://invent.kde.org/frameworks/kcrash"

# 上游测试命令 (CMake project: ctest)
upstream_check_command: "ctest --test-dir <build> --output-on-failure --no-tests=error"

# conanfile.py build() 方法中是否已集成上游测试
# kcrash5 采用 kcoreaddons5 / kcodecs5 先例：BUILD_TESTING=ON 会**编译**全部上游
# autotest，但 ctest 不嵌入 build() —— kcrashtest 需要 spawn 子进程 SIGSEGV 崩溃并等待
# KCrash 的 exec 自重启，沙箱行为不得成为 conan create 的失败源。用例在探索阶段实测，
# 结果见 reports/test-report.md。
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error"

# 上游实际运行的测试程序（kcrash 5.116 autotests/）
# CMakeLists 门控：find_package(Qt5Widgets QUIET) 不满足时整段 return()，
# 本配方用 qt5-qtbase/5.15.2.2（widgets-capable）因此三组用例 + test_crasher 全部构建。
upstream_tests:
  - file: autotests/coreconfigtest.cpp
    source: "autotests/coreconfigtest.cpp"
    description: "CoreConfig 解析 core_pattern（exec/exec-apport/no-exec/不存在路径 4 例）"
    command: "./coreconfigtest"
    result: "见 reports/test-report.md"
  - file: autotests/metadatatest.cpp
    source: "autotests/metadatatest.cpp"
    description: "崩溃元数据 ini 读写"
    command: "./metadatatest"
    result: "见 reports/test-report.md"
  - file: autotests/kcrashtest.cpp
    source: "autotests/kcrashtest.cpp"
    description: "spawn test_crasher → SIGSEGV → 期望 KCrash exec 自重启（AR/ARD/ES 三例）"
    command: "./kcrashtest"
    result: "见 reports/test-report.md"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：DrKonqi 开关、setFlags(AutoRestart) 装 handler、紧急保存回调往返、自定义 handler、错误元数据"
    command: "./test_kcrash5"

# 测试断言总数 (近似值, 用于质量评估)
# test_package/test.cpp：DrKonqi 开关 / AutoRestart 装 handler / 紧急保存回调写入 / 清空 / 自定义 handler = 5
assertion_count: 5
