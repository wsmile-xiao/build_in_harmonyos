# 版本级 manifest — kcrash5 5.116.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.116.0"

# 软件名
software: "kcrash5"

# 编译状态
# published | built | failed | archived
# verify 通过但尚未 upload（upload 在 PR 合并到 main 后由 CI 执行）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方 KDE Frameworks 源, R39)
  url: "https://download.kde.org/stable/frameworks/5.116/kcrash-5.116.0.tar.xz"

  # 源码校验和
  sha256: "81d346f9d663ccab1d388cb8fc45fb6c60efa33683b942251cf811e24179e865"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py generate() 的 tc.variables 一一对应）
  configure_options:
    - "-DQT_MAJOR_VERSION=5"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKDE_INSTALL_USE_QT_SYS_PATHS=OFF"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_QCH=OFF"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DWITH_X11=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"
    - "-DCMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG=-Wl,-soname,"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - kcoreaddons5/5.116.0
    - qt5-qtbase/5.15.2.2
    - ecm/6.26.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本轮零补丁：全部适配走 CMake 变量）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "kcrash 的上游依赖只有 kcoreaddons（PRIVATE 链 KF5::CoreAddons）+ Qt5 Core/Gui/Test：全文 grep 无任何 KF5WindowSystem 引用，任务备注里的 kwindowsystem 不是本包依赖"
  - "上游 CMakeLists 在 UNIX 下默认 WITH_X11=ON 并 find_package(X11 REQUIRED)，HarmonyOS PC 无 X11 头/库 ⇒ 必须显式 -DWITH_X11=OFF，否则 configure 阶段直接中止"
  - "kcrash 无条件 find_package(Qt5Test)（不在 BUILD_TESTING 门内）⇒ 即使不跑测试也必须给出 Qt5Test；qt5-qtbase/5.15.2.2 同时提供 Qt5Test 与 Qt5Widgets"
  - "自重启链（KCrash::AutoRestart）在 setFlags 时若检测到 KCRASH_AUTO_RESTARTED 环境变量会改为延迟 10s 装 handler，测试断言 crashHandler() 非空前必须先清掉该环境变量"
  - "KF5 CrashConfig 在 shared 构建下只 find_dependency(Qt5Core)，KF5CoreAddons 是 PRIVATE 链 ⇒ 消费者测试包只需求 Qt5Core 即可配置通过"
