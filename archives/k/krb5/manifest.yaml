software: krb5
display: "MIT Kerberos 5"
description: "MIT Kerberos 5 - network authentication protocol library and tools"
category: security
homepage: "https://web.mit.edu/kerberos/"
license: "MIT"
build_system: autotools

ohos_adaptation:
  key_points:
    - "源码在 src/ 子目录，conanfile.py source() 中提升到根目录"
    - "config.guess/config.sub 需更新以支持 HarmonyOS 平台检测"
    - "configure 中 TMPDIR umask 077 导致 mktemp 权限问题 (E082)"
    - "musl libc 不支持 _res 全局变量，dnsglue.c 需修改"
    - "必须使用 make -e 确保环境变量传递给子进程"
  common_dependencies: []

versions:
  - version: "1.22.1"
    status: built
    conan: true
    build_date: "2026-05-19"
    notes: "Conan adaptation added 2026-08-07"
  - version: "1.22.2"
    status: built
    conan: false
    build_date: "2026-05-19"
