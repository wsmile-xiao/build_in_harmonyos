# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: krb5/1.22.1
homepage: "https://web.mit.edu/kerberos/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/verify/kdb5_mktree
    source: krb5-1.22.1/src/tests/verify
    description: "krb5 verification test suite"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 - 初始化krb5上下文并获取默认realm"
    command: "./test_krb5"

# 测试断言总数
assertion_count: 3
