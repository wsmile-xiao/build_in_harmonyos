# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "源码在 src/ 子目录，conanfile.py source() 中需提升到根目录"
  - "configure TMPDIR umask 077 问题 (E082)，需设置可写 TMPDIR 和 umask 022"
  - "musl libc 不支持 _res 全局变量，dnsglue.c PRIMARY_DOMAIN 返回 NULL"
  - "必须使用 make -e 确保环境变量传递给子进程"
  - "config.guess/config.sub 需更新支持 HarmonyOS 检测"

