software: katago
display: "KataGo"
description: "KataGo is a powerful, open-source Go engine with techniques from AlphaZero"
category: game              # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|game
homepage: "https://github.com/lightvector/KataGo"
license: MIT
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "需要使用 EIGEN backend（纯CPU后端）"
    - "需要定义 BYTE_ORDER/LITTLE_ENDIAN/BIG_ENDIAN 宏（HarmonyOS 兼容）"
    - "需要检测架构避免使用 SSE 指令（aarch64 平台）"
    - "需要注释 libatomic 链接（aarch64 平台不需要）"
  common_dependencies:
    - eigen
    - zlib

# 版本索引（所有已归档版本，含状态）
versions:
  "v1.13.2":
    status: built             # published | built | failed | archived
    build_date: "2026-05-21"
    backend: EIGEN            # 使用纯 CPU 后端