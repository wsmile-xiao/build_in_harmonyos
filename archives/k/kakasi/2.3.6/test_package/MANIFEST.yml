package: kakasi/2.3.6
homepage: "http://kakasi.namazu.org/"

upstream_check_command: "sh ./kakasi-N (loop over tests)"
upstream_test_in_build: true
upstream_test_command: "for t in kakasi-2 kakasi-3 kakasi-4 kakasi-5 kakasi-7 kakasi-8; do sh ./$t; rc=$?; [ $rc -eq 0 ] || [ $rc -eq 77 ] || exit 1; done"

upstream_tests:
  - file: tests/kakasi-2
    source: kakasi-2.3.6/tests/kakasi-2
    description: "Hiragana/Katakana to Romaji conversion"
    command: "sh ./kakasi-2"
  - file: tests/kakasi-3
    source: kakasi-2.3.6/tests/kakasi-3
    description: "Romaji conversion (Hepburn/Kunrei/old Hepburn)"
    command: "sh ./kakasi-3"
  - file: tests/kakasi-8
    source: kakasi-2.3.6/tests/kakasi-8
    description: "libkakasi linkable from a C consumer"
    command: "sh ./kakasi-8"

test_package_tests:
  - file: test_kakasi.py
    description: "Validate installed version banner and Kanji->Hiragana conversion"
    command: "python3 test_kakasi.py <kakasi-binary>"

assertion_count: 3
