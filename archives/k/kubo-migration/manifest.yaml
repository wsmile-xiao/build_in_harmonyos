software: kubo-migration
display: "kubo-migration"
description: "IPFS repo 15→16 迁移工具（fs-repo-15-to-16），Alpine kubo 0.42.0 的 kubo-migration 子包"
category: system
homepage: "https://github.com/ipfs/fs-repo-migrations"
license: MIT
build_system: go

ohos_adaptation:
  key_points:
    - "纯 Go 静态编译：CGO_ENABLED=0 + GOOS=linux + GOARCH=arm64"
    - "OHOS/HMDFS 上 Go link 输出需放到可写本地文件系统（mmap 失败），再复制回包目录"
    - "OHOS 上 ELF 需 binary-sign-tool 签名才能执行"
    - "vendor/ 已内置，构建全程离线（GOPROXY 仅兜底）"
  common_dependencies:
    - golang

versions:
  "0.42.0":
    status: built
    build_date: "2026-09-21"
    conan_ref: "kubo-migration/0.42.0"
