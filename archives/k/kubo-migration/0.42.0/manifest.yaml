software: kubo-migration
version: "0.42.0"

status: built
build_system: go
build_date: "2026-09-21"
conan_ref: "kubo-migration/0.42.0"

source:
  url: "https://github.com/ipfs/fs-repo-migrations/archive/refs/tags/fs-repo-15-to-16/v1.0.0.tar.gz"
  sha256: "a1eab2531302921eb817d13f19febbdef45596722a1a70968ff2c5133ffec9ef"
  tar_format: tar.gz
  note: "上游仓库 tag 名含斜杠（fs-repo-15-to-16/v1.0.0），构建目标为 monorepo 解压后 fs-repo-15-to-16/ 子目录（与 Alpine APKBUILD 一致）"

build:
  system: go
  configure_options:
    - "GOTOOLCHAIN=local"
    - "CGO_ENABLED=0"
    - "GOOS=linux GOARCH=arm64"
    - "go build -mod=vendor -trimpath -o fs-repo-15-to-16 ."
  dependencies:
    - golang/1.26.3
  cc: go
  cxx: ""

patches_applied: []

patch_classification: []

knowledge_gained:
  - "kubo-migration 是 Alpine kubo 0.42.0 的 kubo-migration 子包，对应上游 fs-repo-migrations 仓库 tag fs-repo-15-to-16/v1.0.0（fs-repo-15-to-16/ 子目录）"
  - "纯 Go CLI，go.mod 仅依赖 github.com/ipfs/fs-repo-migrations/tools（vendor/ 已内置），构建全程离线"
  - "OHOS/HMDFS 上 Go link 阶段 mmap 输出文件失败（permission denied），链接输出必须放到可写本地文件系统（/data/storage/el2/base/...），再复制回包目录"
  - "OHOS 上 ELF 需 binary-sign-tool 签名才能执行（含 go 工具链与最终产物）"
  - "上游测试：无 Go 单元测试（3 个包均无 *_test.go）；e2e 测试 test-e2e/test.sh 用 go run 驱动，OHOS 上临时 ELF 未签名无法 exec，改由 test_package 用已签名二进制执行同语义测试"

test:
  upstream_cases: "1 (e2e) + 0 (go unit)"
  upstream_suite: "test-e2e/test.sh + go test ./..."
  runnable: "1/1 (e2e 适配运行) + 0/0 (go unit)"
  pass_rate: "100%（本地实测，详见 notes.md R51 申报表）"
  consumer_test: "test_package 真实执行 -help + 15→16 正向迁移（diff 断言）+ 回退（diff 断言）"
