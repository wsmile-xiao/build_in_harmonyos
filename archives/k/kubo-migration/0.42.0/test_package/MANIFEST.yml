# kubo-migration/0.42.0 test_package
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）
#
# 上游测试清点（R51 三步法，详见 notes.md）：
# - Go 单元测试：fs-repo-15-to-16 模块 3 个包（. /atomicfile /migration）
#   均无 *_test.go，go test ./... 实测 0 个测试用例（无测试文件，exit 0）
# - e2e 测试：test-e2e/test.sh（复制 repo-v15 → 正向迁移 → diff 与 repo-v16
#   一致 → 回退 → diff 与 repo-v15 一致），共 2 个 diff 断言 + 2 个 version 断言
# - 实测结果：go test ./... 0/0 通过；e2e 适配运行 1/1 通过（2/2 diff 断言），
#   通过率 100%

package: kubo-migration/0.42.0
homepage: "https://github.com/ipfs/fs-repo-migrations"

upstream_check_command: "make test   # cd test-e2e && ./test.sh"
upstream_test_in_build: false
upstream_test_command: "cd test-e2e && ./test.sh   # 上游用 go run .. 驱动；OHOS 上改由 test_package 用已签名二进制执行同语义测试"

upstream_tests:
  - name: go-test
    description: "Go 单元测试（fs-repo-15-to-16 模块 . /atomicfile /migration 包），上游无 *_test.go，go test ./... 实测 0 用例"
  - name: e2e-test
    description: "test-e2e/test.sh：repo-v15 fixture 正向迁移后 diff -r 与 repo-v16 一致，再 -revert 回退后 diff -r 与 repo-v15 一致（真实执行迁移二进制）"

test_package_tests:
  - file: test_kubo_migration.sh
    description: "按上游 test-e2e/test.sh 同语义真实执行：鸿蒙签名校验（binary-sign-tool display-sign → self-sign，OHOS 拒绝未签名 ELF）+ -help 冒烟 + 正向 15→16 迁移（version=16 + diff repo-v16）+ 回退（version=15 + diff repo-v15）"
    command: "sh test_kubo_migration.sh <bin/fs-repo-15-to-16> <fixtures> <work>"

assertion_count: 6
