package: kamilalisp
version: "0.3.0.1"
homepage: "https://github.com/iczelia/kamilalisp"
license: GPL-3.0-only
status: built
build_system: maven
build_date: "2026-10-10"

source:
  url: "https://github.com/iczelia/kamilalisp/archive/refs/tags/v0.3.0.1.tar.gz"
  sha256: "1cfcce062e0c9fd4b0a923b071fae2915a21d5bd2bddef4990dbd8e4e03cbc57"

build:
  system: maven
  configure_options:
    - "clean package"
    - "-DskipTests=false"
    - "-Dproguard.skip=true"
    - "-Duser.home=$HOME"
  dependencies:
    - "BiSheng JDK 17.0.13 (cmd-pkgs install-jdk.sh)"
    - "Maven 3.6.3 (archive.apache.org binary; kamilalisp ships no mvnw wrapper)"
  cc: ""
  cxx: ""

patches_applied: []

upstream_tests:
  framework: "JUnit 5 (junit-jupiter 5.9.3, maven-surefire-plugin 3.1.2)"
  test_files: 23
  test_cases: 102
  test_classes: 22
  command: "mvn clean package -B -DskipTests=false -Dproguard.skip=true -Duser.home=$HOME"
  run_in_build: true
  result: "Tests run: 102, Failures: 0, Errors: 0, Skipped: 0"

test_package:
  assertion_count: 5
  ohos_specific_assertions: 1
  description: "Runs the packaged bin/kamilalisp CLI on a KamilaLisp script and asserts arithmetic/string evaluation, plus a HarmonyOS platform assertion (JVM os.name == HarmonyOS)."

knowledge_gained:
  - "KamilaLisp 0.3.0.1 是纯 Java 17 + Maven 项目，无原生 C/C++ 代码；OHOS 适配走 JDK+Maven 路径（与 airlift-slice 等存量 Java 配方一致）。"
  - "BiSheng JDK 17 在 OpenHarmony 上 JVM user.home 解析为 '?'，Maven 会据此把 ~/.m2 解析到非法路径；必须显式传 -Duser.home=$HOME。"
  - "ProGuard 7.3.2 混淆 36MB fat JAR 在鸿蒙 worker 上被 SIGKILL（result=137，OOM）；混淆是非功能性打包步骤，用 -Dproguard.skip=true 跳过，保留功能完整的 shaded JAR。"
  - "maven-shade-plugin 产出 target/kamilalisp-0.3.jar（fat JAR，Main-Class 为 REPL Main）。"
  - "CLI 入口：无参启动交互 REPL；带脚本路径参数执行脚本并退出；脚本用 io:writeln 打印。"
