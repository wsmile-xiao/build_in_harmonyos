# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: kamilalisp/0.3.0.1
homepage: "https://github.com/iczelia/kamilalisp"

# 上游测试通过 Maven Surefire 运行（mvn clean package，package 阶段含 test）
# 上游测试框架：JUnit 5 (junit-jupiter 5.9.3)
# 实测：Tests run: 102, Failures: 0, Errors: 0, Skipped: 0（22 个测试类）
upstream_check_command: "mvn clean package -B -DskipTests=false -Dproguard.skip=true -Duser.home=$HOME"
upstream_test_in_build: true
upstream_test_command: "mvn clean package -B -DskipTests=false -Dproguard.skip=true -Duser.home=$HOME"

upstream_tests:
  - file: src/test/java/
    source: kamilalisp-0.3.0.1/src/test/java/
    description: "上游 JUnit 5 测试套件（22 个 Test*.java + Common.java，102 个用例）"
    command: "mvn clean package -B -DskipTests=false -Dproguard.skip=true -Duser.home=$HOME"

# test_package 中的消费者视角测试（在鸿蒙真机运行）
test_package_tests:
  - file: test.sh
    description: "通过 bin/kamilalisp CLI 运行 KamilaLisp 脚本，校验算术/字符串求值 + HarmonyOS 平台断言（R34 实质性验证）"
    command: "bash test.sh"

# 断言总数：上游 102 + test_package 5（含 1 个 HarmonyOS 专属断言）
assertion_count: 107
