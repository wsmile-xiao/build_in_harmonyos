# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "上游 kicad-packages3d 是 KiCad 官方 3D 模型库，纯数据包：一个 tag 含 105 个 *.3dshapes 目录 / 7238 个 STEP（*.step）模型，0 个 C/C++ 源文件。顶层 CMakeLists 用 project(kicad-packages3d NONE) + install(DIRECTORY *.3dshapes DESTINATION share/kicad/3dmodels FILES_MATCHING PATTERN *.step)，只安装 STEP（不安装 WRL），与 Debian 官方 kicad-library-packages3d 包同构。复用上游 CMake install 而非自行 copy，可保证产物与发行版一致"
- "tag 10.0.3 仓库内**没有任何测试**：无 enable_testing / add_test / include(CTest) / BUILD_TESTING，无 C/C++ 源文件、无 Python/Shell 脚本、无 .gitlab-ci.yml、无 tests/ 目录（唯一 .yml 为 .github/lockdown.yml 的 GitHub issue 锁定机器人配置，非测试）。因此上游测试注册总数为 0，test_package 以消费者视角验证 STEP 数据"
- "数据/资源型包不要用 package_type=\"application\"：CI 门禁 L0k（R38）把 package_type==application 直接判定为“含 CLI 工具”，会强制要求软件级 commands.json。资源型包应 package_type=\"unknown\" + cpp_info.resdirs=[\"share\"]（同 E255/E305 模式）"
- "STEP（ISO-10303-21）文件有效性可作数据完整性判据：非空、以 ISO-10303-21; 开头、以 END-ISO-10303-21; 结尾（用于消费者测试对 7238 个模型逐一核对）"

