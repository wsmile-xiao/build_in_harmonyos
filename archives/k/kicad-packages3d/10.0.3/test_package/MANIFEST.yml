# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 门禁 L0e 强制要求）
# 详见: docs/TEST_QUALITY_SPEC.md 与 ci/tools/extract_upstream_tests.sh
#
# 填写方法（本项目为纯数据/资源型包，上游**确实没有任何测试**）:
#   1. 解压上游源码包 kicad-packages3D-10.0.3.tar.gz（7410 个条目）；
#   2. 逐项审计确认无任何测试（见 upstream_test_audit）：
#      - 顶层 CMakeLists.txt 为 project(kicad-packages3d NONE)，只有 list_models /
#        uninstall 自定义目标与 install(DIRECTORY *.3dshapes …)；无 enable_testing /
#        add_test / include(CTest) / BUILD_TESTING；
#      - 仓库内 0 个 C/C++ 源文件、0 个 Python/Shell 脚本；
#      - 无 .gitlab-ci.yml 或任何 CI 测试配置（仅 .github/lockdown.yml，GitHub issue
#        锁定机器人配置，非测试）；
#   3. 因此 upstream_test_total = 0、upstream_tests_exist = false。

package: kicad-packages3d/10.0.3
homepage: "https://gitlab.com/kicad/libraries/kicad-packages3D"

# 上游源码测试审计（hmbs 硬门禁：确认无测试时才允许 upstream_tests_exist=false）
upstream_tests_exist: false
upstream_test_audit:
  - source: "CMakeLists.txt"
    reason: "project(kicad-packages3d NONE)；仅有 list_models / uninstall 自定义目标与 install(DIRECTORY *.3dshapes … FILES_MATCHING PATTERN *.step)；grep 实测无 enable_testing / add_test / include(CTest) / BUILD_TESTING 关键字（0 命中）。"
  - source: "源码树（7410 个条目）"
    reason: "0 个 C/C++ 源文件（.c/.cc/.cpp/.h/.hpp），0 个 Python/Shell 脚本（.py/.sh/.pl）；全部 7238 个文件为 *.step 3D 模型，105 个 *.3dshapes 目录 + 文档（README/LICENSE/CREDITS/TODO/Vrml_materials_doc）/ CMakeModules / .github。"
  - source: "CI 配置"
    reason: "仓库无 .gitlab-ci.yml、无 tests/、无 ctest/make check 目标；唯一 .yml 为 .github/lockdown.yml（GitHub issue 锁定机器人，非测试）。"
  - conclusion: "上游 kicad-packages3d 10.0.3 未提供任何自动化测试套件；由 test_package 执行消费者视角的真实 STEP 3D 模型数据验证。"

# 上游注册测试总数（口径：审计确认无任何测试框架，故为 0）
upstream_test_total: 0
upstream_test_count_method: none

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 自带的测试（消费者视角验证：真实读取包内 3D 模型数据）
test_package_tests:
  - file: test_kicad_packages3d.py
    description: "消费者测试：校验安装布局（share/kicad/3dmodels + licenses/LICENSE.md）、模型覆盖度（105 个 *.3dshapes 目录 / 7238 个 STEP 模型，与上游 tag 10.0.3 一致）、每个 STEP 文件都是非空且以 ISO-10303-21; 头 / END-ISO-10303-21; 尾闭合的合法文件、5 个已知经典模型存在（Resistor_SMD R_01005_0402Metric / Package_DIP DIP-10_W7.62mm / Package_TO_SOT_THT Analog_TO-46-4_ThermalShield / Capacitor_SMD CP_Elec_10x10 / Diode_SMD D_0603_1608Metric）"
    command: "python3 -B test_kicad_packages3d.py <package_folder>"

# 测试断言总数（test_kicad_packages3d.py 实测 21 条）
assertion_count: 21
