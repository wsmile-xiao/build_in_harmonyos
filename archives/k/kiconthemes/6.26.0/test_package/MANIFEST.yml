# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kiconthemes/6.26.0.

package: kiconthemes/6.26.0
homepage: https://invent.kde.org/frameworks/kiconthemes

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E \"^(kiconloader_unittest|kiconengine_unittest)$\"; run supported qtest subsets for kiconloader_unittest and kiconengine_unittest"

upstream_tests:
  - file: autotests/
    source: kiconthemes-6.26.0/autotests/
    description: "KIconThemes upstream CTest/autotests suite"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E \"^(kiconloader_unittest|kiconengine_unittest)$\" plus supported qtest subsets"
    condition: "run in the Conan build with BUILD_TESTING=ON; one shared-mime-info data row and kiconengine_unittest::testMode are excluded because their required data/integration is unavailable in the current OHOS baseline; kquickiconprovidertest is not registered because QtQuick is unavailable"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke creates the KIconLoader singleton through KF6::IconThemes."
    command: "conan create (test_package builds and runs test_kiconthemes)"

assertion_count: 1
