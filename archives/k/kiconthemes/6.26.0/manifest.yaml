knowledge_gained:
  - "kiconthemes 6.26.0 requires Qt6Widgets, Qt6Svg, Qt6GuiPrivate (Qt >= 6.10), KF6Archive, KF6I18n, KF6WidgetsAddons, and KF6ColorScheme."
  - "KICONTHEMES_USE_QTQUICK=OFF, USE_DBUS=OFF, USE_BreezeIcons=OFF, and BUILD_DESIGNERPLUGIN=OFF keep unavailable optional integrations out of the OHOS baseline."
  - "The unconditional ECMQmlModule include is patched out for the Qt6Qml-free baseline (same as 6.18.0.1)."
  - "karchive 6.26.0 needed local materialization for the W3 run: upstream sources use C++20 (std::ranges/std::bit_cast), the conan toolchain pins cppstd=17 via a normal set() that shadows cache overrides, and test7ZipOssFuzzIssues hangs on OHOS with crafted 7z fuzz data."
