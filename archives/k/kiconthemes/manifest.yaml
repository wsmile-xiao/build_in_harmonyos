software: kiconthemes
display: "KIconThemes"
description: "KDE Frameworks 6 icon theme support (KIconLoader/KIconTheme/KIconEngine/KIconButton/KIconDialog)"
category: library
homepage: "https://invent.kde.org/frameworks/kiconthemes"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "KICONTHEMES_USE_QTQUICK=OFF + ECMQmlModule patched out: Qt6Qml/Qt6Quick not published to ohpcd"
    - "USE_DBUS=OFF: Qt6DBus not published to ohpcd"
    - "USE_BreezeIcons=OFF: KF6BreezeIcons not published to ohpcd (kiconengine testMode excluded accordingly)"
    - "BUILD_DESIGNERPLUGIN=OFF: Qt6UiPlugin/Qt Designer plugin not published to ohpcd"
    - "ECM 6.26+ KDEInstallDirs6 runs qtpaths at configure time; sandbox LD_LIBRARY_PATH must have /system/lib64 prepended so the compatible libc++_shared.so is found"
    - "Upstream autotests run headless under QT_QPA_PLATFORM=offscreen; kiconloader_unittest runs a 29-check subset (one shared-mime-info data row unavailable), kiconengine_unittest runs 8 checks (testMode needs BreezeIcons)"
  common_dependencies:
    - qtbase
    - qtsvg
    - ecm

versions:
  "6.26.0":
    status: built
    build_date: "2026-09-06"
    conan_ref: "kiconthemes/6.26.0"
  "6.18.0.1":
    status: built
    build_date: "2026-08-19"
    conan_ref: "kiconthemes/6.18.0.1"
  "6.14.0":
    status: built
    build_date: "2026-08-10"
    conan_ref: "kiconthemes/6.14.0"
