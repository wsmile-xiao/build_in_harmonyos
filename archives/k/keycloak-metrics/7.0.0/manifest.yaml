knowledge_gained:
  - "上游 tag 无 v 前缀：7.0.0（不是 v7.0.0）——codeload 200 验证"
  - "上游 gradle.properties 固定 project.version=6.0.1-SNAPSHOT，产物 jar 名 keycloak-metrics-spi-6.0.1-SNAPSHOT.jar"
  - "pom 声明 java 21 但代码无 Java 21 特性，gradle 路径 sourceCompatibility=17，bishengjdk 17 可编译"
  - "keycloak 系依赖全部 provided scope——jar 不内嵌 keycloak，无制品仓依赖断链"
  - "gradlew 脚本在鸿蒙 busybox xargs 下 JVM 参数引号 bug——绕过脚本直接 java -cp wrapper.jar 调 GradleWrapperMain"
  - "services.gradle.org java 直连超时——腾讯镜像 curl 预下载 zip + distributionUrl 改 file://"
  - "本机 bishengjdk17 libjvm.so 需 libc++_shared.so（conan clang 缓存目录提供）"
  - "CI L0 门禁要求 settings 全四项 os/compiler/build_type/arch（missing_setting_compiler/build_type 拦截）——graalvm/25.0.3 同款四项写法"
  - "Mockito 在 OHOS CI worker 上动态 attach API 整体不可用（installExternal 挂死 + 自附加 IllegalStateException）→ 全部测试 initializationError；-javaagent 预装载 byte-buddy-agent（premain 注册 Instrumentation）彻底解决，attach 调用完全短路"
  - "test.sh jar 条目断言禁 `unzip -l | grep -q` 管道：grep -q 提前退出→unzip SIGPIPE(141)→pipefail 下随机约 25% 误报 not shaded/missing；unzip -l 落盘清单再 grep 彻底消除"
  - "R32: validate() 检查 settings.os in (Linux, OHOS)"
  - "R38: 库包，不需要 commands.json"
