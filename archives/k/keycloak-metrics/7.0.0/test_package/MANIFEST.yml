# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: keycloak-metrics/7.0.0
homepage: "https://github.com/aerogear/keycloak-metrics-spi"

# 上游测试通过 Gradle test 运行（与上游 Jenkinsfile 的 ./gradlew test 一致）
# 上游测试框架：JUnit 4.13 + Mockito 5.4 + system-stubs-junit4 2.0.2
upstream_check_command: "gradle test (via wrapper, 见 conanfile.py _gradle())"
upstream_test_in_build: true
upstream_test_command: "gradle test (via wrapper, 见 conanfile.py _gradle())"

# 上游 JUnit 测试用例（在 build() 中运行）
# 统计来源：src/test/java/org/jboss/aerogear/keycloak/metrics/
# 2 个测试类，26 个 @Test 方法（PrometheusExporterTest 24 + MetricsFilterTest 2）
upstream_tests:
  - file: src/test/java/org/jboss/aerogear/keycloak/metrics/
    source: keycloak-metrics-spi-7.0.0.tar.gz/src/test/java/org/jboss/aerogear/keycloak/metrics/
    description: "上游 JUnit 测试套件（26 个 @Test 方法，2 个测试类）"
    command: "gradle test"

# test_package 中自带的测试 (消费者视角验证，在鸿蒙真机运行)
test_package_tests:
  - file: test.sh
    description: "解包 fat jar 验证 SPI 注册文件/prometheus shading/类齐全 + JVM 加载测试 (R34 实质性验证)"
    command: "bash test.sh"

# 测试断言总数
# 上游：26 个 @Test 方法（在 build() 中通过 gradle test 运行）
# test_package：10 个断言（1 JAR 存在 + 2 SPI 注册 + 1 shade + 5 类存在 + 1 JVM 加载 PASS）
assertion_count: 36
