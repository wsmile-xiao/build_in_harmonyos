# conandata.yml - karchive5 5.116.0 (KDE Frameworks 5 / Qt5)
#
# 源码 URL 采用「国内镜像在前 + 官方源兜底」列表形态（R39：官方源必须保留）。
# Conan 2 的 get()/download() 原生支持 url 列表：优先下载第一个，
# 失败时按序回退后续条目（见 conan.tools.files.download 文档）。
#
# 为什么需要镜像（CI 实测）：
#   官方 download.kde.org 不在 CI 的 mirror-fallback 白名单内
#   （ci/conan/build_and_test.sh 只覆盖 github/gnu/gnome/kernel.org/... 等域名），
#   因此 CI 不会自动为其追加镜像。而 5.116 已归档到 Attic/，
#   https://download.kde.org/stable/frameworks/5.116/... 会经过
#   stable/ -> Attic/ -> 境外镜像（ftp.kaist.ac.kr）两跳 302，
#   受限 Worker 无法完成该重定向链 -> 源码下载超时。
#   mirrors.bfsu.edu.cn 的 Attic 路径直接返回 200（无重定向），
#   实测 SHA256 与官方归档逐字节一致。
#   同款做法见 archives/l/libkdepim/25.12.3/conandata.yml。

sources:
  "5.116.0":
    url:
      - "https://mirrors.bfsu.edu.cn/kde/Attic/frameworks/5.116/karchive-5.116.0.tar.xz"
      - "https://mirrors.ustc.edu.cn/kde/Attic/frameworks/5.116/karchive-5.116.0.tar.xz"
      - "https://mirror.nju.edu.cn/kde/Attic/frameworks/5.116/karchive-5.116.0.tar.xz"
      - "https://download.kde.org/Attic/frameworks/5.116/karchive-5.116.0.tar.xz"
    sha256: "1663e3c970b84063ece7f28548a87c97bc7592e79da0a0afaa4f6354f8dea30a"

patches:
  "5.116.0": []
