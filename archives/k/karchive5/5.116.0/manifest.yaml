source_url_note: >
  5.116 已归档至 KDE Attic。官方 download.kde.org 不在 CI mirror-fallback 白名单内
  （ci/conan/build_and_test.sh 只覆盖 github/gnu/gnome/kernel.org 等域名），
  且 stable/ 路径会经 stable->Attic->境外镜像 两跳 302，受限 Worker 无法完成该重定向链，
  表现为「源码下载超时」。conandata.yml 因此采用 url 列表：国内镜像（bfsu/ustc/nju）在前、
  官方 Attic 源兜底，四条目均实测 HTTP 200 且 SHA256 与官方归档一致。
knowledge_gained:
  # 本条记录适配过程中的平台处理措施（路径 A：基础适配，未新增独立知识条目）。
  - "qt5-qtbase/5.15.2.2 pins zlib/1.3.1 whose published libz.a is non-PIC; linking it into a shared library on AArch64 fails with 'relocation R_AARCH64_ADR_PREL_PG_HI21 cannot be used against symbol z_errmsg; recompile with -fPIC'. Consume the PIC rebuild zlib/1.3.1.1 with force=True so the version conflict against qt5-qtbase's pin is resolved while the dependency stays consuming (a plain override=True would leave package_folder=None and the FindZLIB search roots could not be emitted)."
  - "conan_toolchain.cmake force-sets CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON, which makes find_package(ZLIB/BZip2/LibLZMA) hit the CMakeDeps configs. Those define only lowercase targets (zlib::zlib) and mixed-case result variables (BZip2_FOUND, LibLZMA_FOUND), while upstream links ZLIB::ZLIB/BZip2::BZip2/LibLZMA::LibLZMA and reads BZIP2_FOUND/LIBLZMA_FOUND. Injecting a CMAKE_PROJECT_INCLUDE file that flips PREFER_CONFIG back OFF lets CMake's own Find modules run and satisfies both."
  - "The ohpcd zstd/1.5.7 package ships a non-relocatable libzstd.pc (prefix=/usr/local). pkg_check_modules(LibZstd libzstd) then either reports 'No package libzstd found' or points at /usr/local/include, which CMake rejects as a non-existent INTERFACE_INCLUDE_DIRECTORIES entry. Define the PkgConfig::LibZstd imported target and LibZstd_FOUND against the Conan package before the project's probe runs."
  - "KTar picks the compression filter by looking the file name up in QMimeDatabase. OHOS ships no system shared-mime-info database, so QMimeDatabase only sees Qt's built-in type set (779 types measured), which has no zstd entry: '.tar.zst' resolves to application/octet-stream, KTar silently writes an uncompressed tar, and upstream karchivetest fails with 'ZSTD_decompressStream ... Unknown frame descriptor' / 'totalSize > 26000'. Generate a test-only shared-mime-info database covering the compressed-tar types (zstd included) and expose it through XDG_DATA_DIRS for the test run only."
  - "KTar relies on qplatformdefs.h; Qt5CoreConfigExtrasMkspecDir.cmake points at a build-tree path (<pkg>/../b/mkspecs/linux-clang). Copying only that subdirectory is not enough - mkspecs/linux-clang/qplatformdefs.h includes '../common/posix/qplatformdefs.h', so the whole mkspecs tree has to be mirrored."
