software: kernelshark
display: "kernelshark"
description: "Kernel Shark: front-end reader of the Linux kernel tracing (ftrace/trace-cmd) data (libkshark core layer)"
category: system
homepage: "https://kernelshark.org/"
license: "GPL-2.0-only / LGPL-2.1-only (libkshark)"
build_system: cmake

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "libkshark 核心层交付；plot(freeglut/GLU)与 GUI(Qt6+字体)层因依赖缺失未构建"
    - "libtraceevent/libtracefs/libtracecmd 无 Conan 包：recipe 内 vendored 构建并随包交付"
    - "OHOS btf.h 缺 BTF kinds 16-19、musl 无 qsort_r：vendored 兼容头"
  common_dependencies:
    - json-c/0.18
  known_issues:
    - "freeglut/GLU 仓内与制品仓缺失，plot+GUI 层阻塞"
    - "libtraceevent 插件运行期需 TRACEEVENT_PLUGIN_DIR 指向包内 lib/traceevent/plugins"
    - "上游 Boost.Test 套件需外网测试数据（kernel-shark_testdata），CI 内不可达"

# 版本索引
versions:
  "2.4.0":
    status: built
    build_date: "2026-09-18"
