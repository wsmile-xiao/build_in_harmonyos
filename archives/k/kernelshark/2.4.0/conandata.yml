# 源取 GitHub 上游官方镜像（commit OID 固定，等同 kernel.org 对应 tag）：
#   kernel-shark          -> yordan-karadzhov/kernel-shark（上游维护者本人维护，
#                            README 指明官方仓库在 kernel.org）
#   其余三个 libtrace* /  -> rostedt/*（Steven Rostedt 的 kernel.org 官方
#   trace-cmd                clone，仓库自述 "Clone of ... from kernel.org"）
# 权衡：官方 PR CI worker 对 git.kernel.org 不可达（403/超时断流），GitHub
# 可达；上游作者镜像非第三方 fork。ref 为 kernel.org tag 的 peeled commit
# OID（kernelshark-v2.4.0=60ac62e5, libtraceevent-1.9.0=13701b55,
# libtracefs-1.8.3=6fad6a14, trace-cmd-v3.3.3=9da7e594），git 内容寻址保证
# 树一致（与原 cgit snapshot 解包 diff -r 零差异）；镜像未同步 tag 故用
# commit OID 作 ref。双 URL 为 GitHub codeload/archive 两域（同 commit 归档
# 字节一致，同仓 accel-config 先例）。
sources:
  url:
    - "https://codeload.github.com/yordan-karadzhov/kernel-shark/tar.gz/60ac62e57bd4bbdb7d206d30ea0280d041287792"
    - "https://github.com/yordan-karadzhov/kernel-shark/archive/60ac62e57bd4bbdb7d206d30ea0280d041287792.tar.gz"
  sha256: "c3e806aa055556f0a5d8c025ef444622cc69fdcfdf159f797fb34db496e0c560"
  filename: "kernelshark-v2.4.0.tar.gz"

# ── vendored 依赖（R36：仓内与 ohpcd 制品仓均无 Conan 包，无法 requires）──
# 参照 archives/a/address-standardizer/3.7.0 vendored PostgreSQL 先例，
# 构建期在 recipe 内 bootstrap 并随包交付（libkshark.so 的 DT_NEEDED 闭包）。
libtraceevent:
  url:
    - "https://codeload.github.com/rostedt/libtraceevent/tar.gz/13701b5532e0c3295bf5670361692b0d0044228d"
    - "https://github.com/rostedt/libtraceevent/archive/13701b5532e0c3295bf5670361692b0d0044228d.tar.gz"
  sha256: "9ea838192731bd29ee10664531b7c4797bbb751123ca130e73588edbd58c61d5"
  filename: "libtraceevent-1.9.0.tar.gz"

libtracefs:
  url:
    - "https://codeload.github.com/rostedt/libtracefs/tar.gz/6fad6a14ba0d4c4b437d9e4eed7098d4bb07b4fc"
    - "https://github.com/rostedt/libtracefs/archive/6fad6a14ba0d4c4b437d9e4eed7098d4bb07b4fc.tar.gz"
  sha256: "e8b81f964dde4aed0b0eee852dc67a765d411133b2c216c35d6b94e7e09bd76c"
  filename: "libtracefs-1.8.3.tar.gz"

# trace-cmd v3.3.3（libtracecmd 1.5.3）：与 kernelshark 2.4.0（2025-04/05
# 发布）同期稳定的 3.3 系列维护版；快照不含 lib/traceevent、lib/tracefs
# 子模块，正好由 Makefile 的 pkg-config 外部依赖指向上面两个 stage 包。
tracecmd:
  url:
    - "https://codeload.github.com/rostedt/trace-cmd/tar.gz/9da7e594cc9a33694b4e8aae9da9898241d399d8"
    - "https://github.com/rostedt/trace-cmd/archive/9da7e594cc9a33694b4e8aae9da9898241d399d8.tar.gz"
  sha256: "3105b987b2d90aeeec16c2e9030bf7a3ca34caf99b8a4b6fcbed262599844ca9"
  filename: "trace-cmd-v3.3.3.tar.gz"

patches:
  - patch_file: "patches/0001-kernelshark-cmake-ohos-core-layer.patch"
    patch_description: "kernelshark CMake 核心层可移植性：① plot 层门控从 OPENGL_FOUND 收紧为 OPENGL_FOUND AND GLUT_FOUND（上游只按 OpenGL 门控但链接 GLUT::GLUT/GLU，GL 存在而 GLUT 缺失时生成期报 target 未定义；examples/CMakeLists.txt 本身就是双条件门控，对齐之）；② 顶层 find_package(Qt6 COMPONENTS Network OpenGLWidgets StateMachine REQUIRED) 去掉 REQUIRED（上一行 Qt6Widgets 已是可选探测，Qt 缺席时核心层应可独立构建，GUI 层由 Qt6Widgets_FOUND AND TT_FONT_FILE 自然关闭）；③ 删除 install() 里的 bash ldconfig CODE 块（Linux 发行版专属，OHOS 无 ldconfig，属安装期 Linux-ism）"
    patch_type: "portability"
  - patch_file: "patches/0002-libtraceevent-ohos-btf-compat-include.patch"
    patch_description: "vendored libtraceevent 1.9.0：src/trace-btf.c 在 <linux/btf.h> 后 include 本仓 vendored 的 trace-btf-compat.h（OHOS 内核 UAPI 头缺 BTF_KIND_FLOAT/DECL_TAG/TYPE_TAG/ENUM64、struct btf_decl_tag/btf_enum64 且 NR_BTF_KINDS=16；musl 无 qsort_r）。与 archives/l/libtraceevent/1.9.0 归档记载同一问题，该仓库存档只有 trace-btf.c 的 include 补丁、compat 头本体缺失，这里一并 vendored"
    patch_type: "portability"
  - patch_file: "patches/0003-libtracefs-ohos-vsock-header-conflict.patch"
    patch_description: "vendored libtracefs 1.8.3：src/tracefs-vsock.c 去掉 <linux/vm_sockets.h>（其连带 linux/socket.h 重定义 sockaddr_storage 与 sys/socket.h 冲突），本地定义 AF_VSOCK/VMADDR_CID_ANY/struct sockaddr_vm。内容对齐 archives/l/libtracefs/1.8.3/patches/ 的同名补丁（重制为计数正确的 unified diff）"
    patch_type: "portability"
