package: kernelshark/2.4.0
# 上游 tests/ 为 Boost.Test（libkshark-tests.cpp 等，需 Boost unit_test_framework
# + ctest get_test_data 项 git clone github.com/yordan-karadzhov/kernel-shark_testdata）。
# CI conan create 内不引入 Boost 依赖（find_package(Boost) 探测不到 → 上游
# tests 子目录不进构建图），上游套件的真机补跑与阻塞证据见 run 报告上游测试章节。
upstream_test_in_build: false
upstream_tests:
  - name: "tests/libkshark-tests.cpp (Boost.Test + kernel-shark_testdata)"
    scope: "NOT_RUN in CI：需 Boost unit_test_framework 与 ctest get_test_data 项从 github clone 测试数据（CI 无凭据外网拉取且 Boost 未入依赖图）；真机补跑入口与阻塞证据在 run 报告记录，最终由 Coordinator 提请用户决定"
  - name: "tests/libkshark-gui-tests.cpp (Boost.Test + GUI)"
    scope: "NOT_RUN：GUI 层（Qt6 + plot/GLUT）本次不构建（freeglut/GLU 仓内与制品仓均缺失），测试目标不在构建图中"
test_package_tests:
  - file: test_kernelshark.c
    description: "真实消费方探针（基于上游 examples/configio.c 的 API 路径）：kshark_instance 会话创建 + kshark_add_stream 流分配 + kshark_hash_id_add 集合语义 + kshark_filter_config_new/kshark_export_filter_array json-c 序列化 + conf.json 落盘 → kshark_hash_id_clear 清空 → kshark_open_config_file/kshark_config_doc_get/kshark_import_filter_array 反序列化，pid 314/42 与 'Hello Kernel' 消息逐项断言（真实文件 round-trip），覆盖 libkshark.so → libtracecmd/libtracefs/libtraceevent（vendored）+ libjson-c 的完整运行时闭包。注：不用 kshark_export_all_filters——其内部 kshark_get_data_stream 要求 stream->interface，裸流在所有平台（含 Linux）返回 NULL，上游示例对该返回值未检查"
    command: "./test_probe"
assertion_count: 4
