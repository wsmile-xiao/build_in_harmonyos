software: kernelshark
# 版本级 manifest
# 文件位置: archives/k/kernelshark/2.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"

# 构建系统类型（顶层字段，用于 G4 检查）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://git.kernel.org/pub/scm/utils/trace-cmd/kernel-shark.git/snapshot/kernel-shark-kernelshark-v2.4.0.tar.gz"

  # 源码校验和
  sha256: "3cc1f259c957e469663421cc5eb3427d60e8df3d966dafbf7f1ec14bc3a5ea43"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=TRUE"
    - "-DJSONC_INCLUDE_DIR=<json-c include 父目录>"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - json-c/0.18
    # vendored（构建期源码内 bootstrap，随包交付）：
    #   libtraceevent 1.9.0 / libtracefs 1.8.3 / libtracecmd 1.5.3 (trace-cmd v3.3.3)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-kernelshark-cmake-ohos-core-layer.patch"
  - "0002-libtraceevent-ohos-btf-compat-include.patch"
  - "0003-libtracefs-ohos-vsock-header-conflict.patch"
  # 另有 vendored 新文件（非补丁）：
  #   trace-btf-compat.h（libtraceevent OHOS BTF/qsort_r 兼容头）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libtraceevent/libtracefs/libtracecmd 仓内无 Conan 包且制品仓缺失：vendored 构建是唯一边界内可行解（address-standardizer 先例）"
  - "上游 CMake plot 层只按 OPENGL_FOUND 门控但链接 GLUT::GLUT，GL 有而 GLUT 无时必须双条件门控，否则生成期报 target 未定义"
  - "上游顶层 find_package(Qt6 ... REQUIRED) 与 Qt6Widgets 可选探测自相矛盾，去 REQUIRED 后核心层可独立构建"
  - "OHOS btf.h 已有 NR_BTF_KINDS 宏（=16）但无 FLOAT/DECL_TAG/TYPE_TAG/ENUM64，compat 头需先 #undef 再重定义"
  - "libtraceevent/libtracefs Makefile 的 libdir_relative 默认按 LP64 探测为 lib64，需显式 libdir_relative=lib 否则 .pc 指错目录"
  - "libtraceevent 插件目录编译期烧入 staging 绝对路径，运行期用 TRACEEVENT_PLUGIN_DIR 环境变量覆盖到包内 lib/traceevent/plugins"
  - "OHOS 运行时无 libomp.so，OpenMP 必须显式禁用；libz 由 /system/lib64/ndk/libz.so 提供"
