package: kblocks/26.04.0
homepage: https://apps.kde.org/kblocks

upstream_check_command: "ctest --test-dir build --output-on-failure --no-tests=error"

upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error --timeout 90 (QT_QPA_PLATFORM=offscreen; run inside conanfile.py build())"

upstream_tests:
  - file: autotests/basic.cpp
    source: kblocks-26.04.0/autotests/basic.cpp
    description: "Basic Qt Test smoke (Qt6::Test)"
    command: "./basic"
  - file: autotests/test_KBlocksGameLogic.cpp
    source: kblocks-26.04.0/autotests/test_KBlocksGameLogic.cpp
    description: "KBlocksGameLogic unit test (KBlocksCore)"
    command: "./KBlocksGameLogic"
  - file: autotests/test_KBlocksItemGroup.cpp
    source: kblocks-26.04.0/autotests/test_KBlocksItemGroup.cpp
    description: "KBlocksItemGroup unit test (KBlocksCore)"
    command: "./KBlocksItemGroup"
  - file: autotests/test_KBlocksScene.cpp
    source: kblocks-26.04.0/autotests/test_KBlocksScene.cpp
    description: "KBlocksScene unit test (KBlocksCore)"
    command: "./KBlocksScene"
  - file: autotests/test_KBlocksWin.cpp
    source: kblocks-26.04.0/autotests/test_KBlocksWin.cpp
    description: "KBlocksWin unit test (KBlocksCore + KBlocksTesting)"
    command: "./KBlocksWin"
  - file: autotests/test_View-Scene.cpp
    source: kblocks-26.04.0/autotests/test_View-Scene.cpp
    description: "View-Scene integration test (KBlocksCore)"
    command: "./View-Scene"

test_package_tests:
  - file: test.sh
    description: "Consumer cases: 4 cases / 6 assertions, incl. 1 HarmonyOS-specific non-assertion case — (1) --version reports 26.04.0; (2) --help command-line interface; (3) --author / --license KAboutData metadata; (4) [OHOS-specific, non-assertion] shared-library closure load: launches the shipped kblocks binary so the OHOS dynamic linker resolves the whole DT_NEEDED closure (unpatched relative \"../../bin/libX.so\" entries fail on OHOS musl, pass trivially on glibc)"
    command: "sh test.sh <kblocks-bin>"

assertion_count: 6
