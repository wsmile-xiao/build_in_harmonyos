patches_applied: []

knowledge_gained:
  - "OHOS: C++20 std::ranges 在 OHOS libc++(clang15) 下被禁用（__config 定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES），需在 CMAKE_CXX_FLAGS 追加 -D_LIBCPP_ENABLE_EXPERIMENTAL 才可用 std::ranges::any_of"（knowledge_ref: E130）
  - "Conan: ConanToolchain 会按 settings.compiler.cppstd 覆写 CMAKE_CXX_STANDARD，上游强制标准版本时需 tc.variables 显式写入且配合 tools.build:compiler_cppstd"（knowledge_ref: E538）
  - "Qt6: 分包发布的 qtdeclarative/qtpositioning 不在 qtbase 前缀下，find_package(Qt6 COMPONENTS Qml/Positioning) 需 QT_ADDITIONAL_PACKAGES_PREFIX_PATH 补入各自包前缀"（knowledge_ref: E542）
  - "ECM: include(ECMQmlModule) 在 configure 早期即需 Qt6::Qml，普通 CMAKE_PREFIX_PATH 注入太晚，需经 CMAKE_PROJECT_TOP_LEVEL_INCLUDES 注入文件在 project() 时加载"（knowledge_ref: E542）
  - "ECM: CMakeDeps 对 ECM_MODULE_PATH 无内置传播，消费方需手工 set ECM_MODULE_PATH 指向 modules/find-modules/kde-modules"（knowledge_ref: E487）
  - "KDE: 不在 ECM 平台白名单时用 -DKF_IGNORE_PLATFORM_CHECK=TRUE 放行（不修改上游源码）"（knowledge_ref: E487）
  - "ECM: GenerateExportHeader 产出的公共头按小写裸前缀 #include <pkg/pkg_export.h> 引用，而 INCLUDE_INSTALL_DIR 安装为驼峰布局时头文件无法解析，package() 补 include/<pkg> 小写相对符号链接即可"（knowledge_ref: E130）
  - "KDE: 库名遵循上游 target 名而非 KF6 前缀（此处实为 libKWeatherCore.so），cpp_info.libs 与消费方链接必须用 -lKWeatherCore"（knowledge_ref: E216）
  - "OHOS: 交叉 SDK 的 host 工具（qmltyperegistrar 等）musl 下 dlopen Qt 依赖失败，需将依赖包 lib/bin + SDK llvm lib 前置到 LD_LIBRARY_PATH"（knowledge_ref: E004）

