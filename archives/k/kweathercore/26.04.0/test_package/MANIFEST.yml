# test_package/MANIFEST.yml — kweathercore 26.04.0 上游测试清点（R51）
#
# 清点方法：解压上游源码包 kweathercore-26.04.0.tar.xz（sha256
# 5d2f47c6b47a352911c1697704bc0a6fd51fe93807def98aab4bdc193e7dcc3b），
# autotests/ 共 8 个 QTest 套件，经两次 ecm_add_tests 注册（7 个基础套件 +
# geotimezonetest 单独注册；均含 Qt6::Test，capparsertest 需 capdata/ 与
# metnoparsertest 需 met.no/ 数据目录，geotimezonetest 需 Qt6::Network 访问外部服务）。

package: kweathercore/26.04.0
homepage: "https://invent.kde.org/libraries/kweathercore"

# 上游测试命令（需 Qt6::Test 测试模块 + 数据目录，交叉构建下不可直接运行）
upstream_check_command: "ctest --test-dir build  # SKIP: 需 Qt6::Test 模块与 capdata/met.no 数据目录，交叉 SDK 无 OHOS 运行时"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试（autotests/CMakeLists.txt 逐套件清点）
upstream_tests:
  - file: autotests/capparsertest.cpp
    source: kweathercore-26.04.0/autotests/capparsertest.cpp
    description: "CAP 警报消息解析器测试（需 autotests/capdata/ 数据目录）"
    command: "ctest -R capparsertest  # SKIP: 交叉构建无 OHOS 运行时"
  - file: autotests/metnoparsertest.cpp
    source: kweathercore-26.04.0/autotests/metnoparsertest.cpp
    description: "MET Norway 天气预报 JSON 解析测试（需 autotests/met.no/ 数据目录）"
    command: "ctest -R metnoparsertest  # SKIP: 交叉构建无 OHOS 运行时"
  - file: autotests/hourlyweatherforecasttest.cpp
    source: kweathercore-26.04.0/autotests/hourlyweatherforecasttest.cpp
    description: "HourlyWeatherForecast 值对象构造/访问器测试"
    command: "ctest -R hourlyweatherforecasttest  # SKIP: 交叉构建无 OHOS 运行时"
  - file: autotests/dailyweatherforecasttest.cpp
    source: kweathercore-26.04.0/autotests/dailyweatherforecasttest.cpp
    description: "DailyWeatherForecast 值对象构造/访问器测试"
    command: "ctest -R dailyweatherforecasttest  # SKIP: 交叉构建无 OHOS 运行时"
  - file: autotests/weatherforecasttest.cpp
    source: kweathercore-26.04.0/autotests/weatherforecasttest.cpp
    description: "WeatherForecast 值对象构造/访问器测试"
    command: "ctest -R weatherforecasttest  # SKIP: 交叉构建无 OHOS 运行时"
  - file: autotests/locationquerytest.cpp
    source: kweathercore-26.04.0/autotests/locationquerytest.cpp
    description: "LocationQuery/LocationQueryReply/LocationQueryResult 值对象测试"
    command: "ctest -R locationquerytest  # SKIP: 交叉构建无 OHOS 运行时"
  - file: autotests/pendingweatherforecasttest.cpp
    source: kweathercore-26.04.0/autotests/pendingweatherforecasttest.cpp
    description: "PendingWeatherForecast 值对象构造/访问器测试"
    command: "ctest -R pendingweatherforecasttest  # SKIP: 交叉构建无 OHOS 运行时"
  - file: autotests/geotimezonetest.cpp
    source: kweathercore-26.04.0/autotests/geotimezonetest.cpp
    description: "GeoTimezone 时区查询测试（需 Qt6::Network 访问外部时间服务）"
    command: "ctest -R geotimezonetest  # SKIP: 需网络访问外部服务 + OHOS 运行时"

# test_package 中自带的测试（消费者视角验证，复刻上游值对象套件核心路径）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：KWeatherCore::LocationQueryResult 构造/latitude()/name()/countryCode() 访问器 + KWEATHERCORE_VERSION_STRING 版本宏（复刻 locationquerytest/dailyweatherforecasttest 值对象核心路径）"
    command: "./test_probe  # 交叉构建仅验编译+链接（libKWeatherCore 符号解析）"

# 测试断言总数（test.cpp 4 处 check：版本宏 1 + 访问器 3）
assertion_count: 4
