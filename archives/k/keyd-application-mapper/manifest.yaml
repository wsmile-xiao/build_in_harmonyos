software: keyd-application-mapper
display: "keyd-application-mapper"
description: "keyd 的应用级按键重映射客户端（Per-application key remapping client for the keyd daemon）"
category: system
homepage: "https://github.com/rvaiya/keyd"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "上游 make 对本产物只做复制（Makefile:37 `cp scripts/keyd-application-mapper bin/`），无编译/链接"
    - "解释器行适配：上游硬编码 #!/usr/bin/python3（OHOS 无该路径）→ 补丁改为 #!/usr/bin/env python3"
    - "运行时解释器由依赖 python/3.12.9 提供（其 bin/ 经 Conan run 环境进入 PATH）"
    - "随包安装上游预生成的 man 页（data/keyd-application-mapper.1.gz），无需 scdoc"
    - "同树 keyd 守护进程（Makefile:38）不属本包：它是运行期对端，经 /var/run/keyd.socket 的 `keyd bind reset` 交互"
  common_dependencies:
    - python/3.12.9

versions:
  "2.6.0":
    status: built
    build_date: "2026-09-19"
    conan_ref: "keyd-application-mapper/2.6.0"
