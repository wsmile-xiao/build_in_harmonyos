# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: keyd-application-mapper/2.6.0
homepage: "https://github.com/rvaiya/keyd"

# 上游测试总入口：t/ 目录（94 个 .t 用例）。
# 注意：全部 94 个用例面向 keyd 守护进程的 keymap 引擎，
#       没有一个覆盖 keyd-application-mapper 本身（见 upstream_coverage_* 字段）。
upstream_check_command: "make test-io   # 上游 Makefile:104-118；另有 t/run.sh、make test"
upstream_test_in_build: false
upstream_test_command: "make test-io"

# 上游实际运行的测试程序（本次适配在 OHOS aarch64 上实测）
upstream_tests:
  - file: t/*.t（94 个用例）
    source: keyd-2.6.0/t/（test.conf + 94 个 .t 期望序列）
    description: >-
      测试驱动 t/test-io.c 链接 keyd 核心（keyboard/string/macro/config/log/ini/
      keys/unicode）后逐用例比对按键事件序列；纯用户态，无需 root、/dev/uinput
      或运行中的 keyd 守护进程。覆盖对象是 keyd 的 keymap 引擎，
      不包含 keyd-application-mapper（mapper 只通过 `keyd bind reset` IPC 调用守护进程）。
    command: "make test-io"
    measured_result: "94/94 PASSED, 0 FAILED, 0 SKIPPED"
    log: "reports/upstream-test-io.log, reports/upstream-test-cases.md"
  - file: t/run.sh
    source: keyd-2.6.0/t/run.sh（主入口：构建 bin/keyd 后由 t/runner.py 通过 /dev/uinput 驱动）
    description: >-
      上游 CI 用的主入口：要求 root、无运行中的 keyd、可用的 /dev/uinput，
      用 t/runner.py 创建虚拟键盘并逐用例驱动真实守护进程。
    command: "sh t/run.sh"
    measured_result: >-
      未通过（rc=255）：① OHOS Toybox 无 whoami/id（脚本第 9 行 root 判定失败）；
      ② 非 root 且无 sudo，/dev/input 与 /dev/uinput 权限拒绝；
      ③ run.sh 未覆盖 platform 变量，make 走非 Linux 分支加 -linotify → 链接失败。
      完整原始输出见日志。
    log: "reports/upstream-test-runsh.log"
  - file: "Makefile test: 目标"
    source: keyd-2.6.0/Makefile:99-103
    description: >-
      上游 Makefile 的 test: 目标遍历 t/*.sh（仓库中只有 run.sh），实际等价于再跑一次
      t/run.sh，因此与上一入口同因失败。
    command: "make test"
    measured_result: "未通过（rc=2）：复用 t/run.sh 后因 -linotify 链接失败而中止"
    log: "reports/upstream-test-runsh.log"

# 上游测试对 keyd-application-mapper 的覆盖情况（本次核验结论）
upstream_coverage_of_this_package: false
upstream_coverage_evidence: >-
  grep -rn 'application-mapper|app-mapper|app.conf' t/ → rc=1（无任何命中）；
  全树仅 Makefile / README.md / docs/ / data/gnome-extension* 引用本命令，t/ 不引用。
upstream_coverage_note: >-
  上游确实没有针对本命令的自动化测试。可用等价证据：本包 build() 中以声明的解释器
  执行 `keyd-application-mapper -h` 作为入口自检；test_package 中按“消费者视角”实测
  命令的 16 项可观察行为。

# test_package 中自带的消费者视角测试
test_package_tests:
  - file: test_keyd_application_mapper.py
    description: >-
      通过 Conan run 环境调用包内命令（不直接调解释器，以验证补丁后的 shebang 能自行解析）：
      ① OHOS 适配生效（interpreter 行为 /usr/bin/env python3，非构建机绝对路径）且 /usr/bin/env 存在；
      ② 声明的 python/3.12.9 依赖确实提供 PATH 上的 python3；
      ③ 命令可执行、`-h` 退出码为 0 且输出用法与 --daemonize/--verbose；
      ④ 无 ~/.config/keyd/app.conf 时的配置发现路径；
      ⑤ 有 app.conf 且无桌面环境时的真实执行路径（解析配置 → 建单实例锁 → 窗口检测失败退出）；
      ⑥ `-v` 参数面；⑦ 随包安装的 man 页存在且内容正确。
    command: "python3 test_keyd_application_mapper.py"
    assertion_count: 16
    ohos_specific_assertions: 3

# 真机（DAYU200 · OpenHarmony 6.0.0.47）消费者端到端证据
# 采集方式：automation/device_runner.sh（hdc 直连，采集退出码 + _device_evidence.json）
device_tests:
  - job: kdy_mapper_app
    device: "润和 DAYU200-RK3568 / OpenHarmony 6.0.0.47 (API20, aarch64, 64bit)"
    description: >-
      用本包产物 bin/keyd-application-mapper + 声明的 python/3.12.9 依赖自带解释器
      （运行时 tar 推送真机解包后原生运行）执行真实消费者流程：解释器就绪 → 命令入口
      -h/参数面 → 缺配置发现路径 → 真实 ~/.config/keyd/app.conf 解析 → 单实例锁
      app.lock 创建 → 无桌面环境窗口监视器探测失败（按设计 rc=255）→ -v 参数面。
    command: "sh mapper_e2e.sh"
    measured_result: "pass=8 fail=0 skip=2（exit 0）"
    skip_reasons:
      - "本机型镜像无 /usr/bin/env（仅 /system/bin/env → toybox），shebang 直接执行不可用；
        OHOS PC 上 /usr/bin/env 存在，故 CI 的 test_package 该项断言实测通过"
      - "第二次并发运行未见锁提示：首次运行在窗口监视器探测阶段即退出并释放锁（短生命周期进程）"
    evidence: >-
      _device_evidence.json / _result.json（真机采集，本地归档）
      {"suite":"keyd-application-mapper-2.6.0-device-consumer-e2e","pass":8,"fail":0,"skip":2}
  - job: keyd_upstream
    device: "润和 DAYU200-RK3568 / OpenHarmony 6.0.0.47 (API20, aarch64, 64bit)"
    description: >-
      上游 make test-io 全量回放（同一上游源码包 t/test.conf + 94 个 .t，静态 test-io 驱动），
      用于佐证上游 94 个用例在真机口径同样全部通过。
    command: "sh upstream_run.sh"
    measured_result: "cases=94 passed=94 failed=0 rc=0"
    evidence: >-
      _device_evidence.json / _result.json
      {"suite":"keyd-upstream-test-io-on-device","cases":94,"pass":94,"fail":0,"rc":0}

# 计数汇总
# 上游：94 个用例全部执行并通过（覆盖 keyd 守护进程 keymap 引擎）；覆盖本命令的上游用例 = 0
upstream_case_count: 94
upstream_passed_case_count: 94
upstream_failed_case_count: 0
upstream_skipped_case_count: 0
upstream_case_count_covering_this_package: 0
test_package_assertion_count: 16
ohos_specific_case_count: 3
assertion_count: 16
device_consumer_e2e_pass: 8
device_consumer_e2e_fail: 0
device_consumer_e2e_skip: 2
