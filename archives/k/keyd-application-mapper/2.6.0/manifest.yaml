knowledge_gained:
  - "本产物在上游 Makefile 中只由 `cp scripts/keyd-application-mapper bin/` 生成（Makefile:37），无编译/链接"
  - "上游硬编码 #!/usr/bin/python3，OHOS 无该路径 → 补丁改为 #!/usr/bin/env python3，解释器由 python/3.12.9 依赖提供"
  - "上游 Makefile:26-33 用 uname -s == Linux 判定平台；OHOS 报告 HarmonyOS → 走非 Linux 分支加 -linotify（OHOS sysroot 无 libinotify），这是同树 keyd 守护进程在 OHOS 的首个真实错误；`make platform=Linux` 可绕过（本包不构建该产物）"
  - "OHOS Toybox 无 whoami/id/install：上游 t/run.sh 的 root 判定直接失败；上游 Makefile 的 install -m755/-m644 需替换为 cp+chmod"
  - "上游 t/ 94 个用例只覆盖 keyd 的 keymap 引擎，对本命令零覆盖；可在无 root 环境运行的入口是 make test-io（OHOS 实测 94/94 PASSED）"
  - "本命令的 KDE/X11 后端分别依赖 dbus-python/python-xlib（制品仓未发布），二者均为延迟 import，缺失时 get_monitor() 自动降级"

