# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-host-cache/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的两个 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> dhcp-host-cache-tests dhcp-host-cache-libloadtests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-host-cache-tests dhcp-host-cache-libloadtests"

# 上游实际运行的测试程序（源码 TEST/TEST_F 宏计数：23 + 30 + 87 + 4 = 144，
# 无 DISABLED_ 前缀，无 TEST_P 参数化套件）
upstream_tests:
  - file: dhcp-host-cache-tests
    source: src/hooks/dhcp/host_cache/tests/
    description: >-
      Host Cache 插件单元测试（3 个翻译单元，共 140 例：cache_unittests.cc 23 例
      覆盖 HostCache 容器（insert/remove/flush/size/capacity/get4/get6 各类查询
      索引）；command_unittests.cc 30 例覆盖 9 个控制通道命令 callout
      （cache-size / cache-clear / cache-flush / cache-get / cache-get-by-id /
      cache-write / cache-insert / cache-load / cache-remove）及其参数与错误
      分支，其中配置/写盘/加载用例会自产 dump.json / source.json 数据文件；
      host_data_source_unittests.cc 87 例覆盖 CacheHostDataSource 接口行为
      （v4/v6 按 HWAddr/ClientId/DUID/CircuitId 查询、FQDN、多个保留冲突、
      deleteByAddr/deleteById、disallowDuplicateIP 等），其中 42 例为
      MultiThreading 模式变体（*MultiThreading 后缀，与基础用例成对））。
      本配置注册 140 个用例（与源码 TEST_F 宏数一致，无未注册用例）。
      全部为内存数据源逻辑用例：
      无 SOCK_RAW、无特权依赖、无预置外部数据文件（写盘用例自产自清），
      OHOS 沙箱下零 root 全实跑
    command: "./dhcp-host-cache-tests"
  - file: dhcp-host-cache-libloadtests
    source: src/hooks/dhcp/host_cache/libloadtests/
    description: >-
      4 个 gtest 用例，经 hook 框架真实 dlopen 校验 libdhcp_host_cache.so 的
      加载/卸载契约：validLoad（kea-dhcp4 与 kea-dhcp6 双协议均可加载——与
      v4-only 的 bootp 不同）、invalidDaemonLoad（family 不匹配及 ctrl-agent/
      dhcp-ddns/bogus 守护进程加载失败）、commands4/commands6（加载后
      9 个 cache-* 命令在 v4/v6 服务器中注册齐全）
    command: "./dhcp-host-cache-libloadtests"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_host_cache_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload 契约符号与 hook ABI 版本"
    command: "./test_host_cache_hook <package>/lib/kea/hooks/libdhcp_host_cache.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 libdhcp_host_cache.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc libc.so.6、
      链接 libc++_shared.so）并验证 OHOS 加载器可 dlopen(RTLD_NOW) 解析
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_host_cache.so"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 包内
      20 个 Kea 运行时库（lib/libkea-*.so*），校验完整 NEEDED 闭包可解析、
      闭包驻留后 hook 仍可加载且 load/unload 契约符号可解析
    command: "./test_ohos_runtime <package>/lib/kea/hooks/libdhcp_host_cache.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（test_package 内，实测结果见版本级 notes.md）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <so> && ./test_ohos_runtime <so>"

# 上游测试用例宏总数（本次适配源码计数：23 + 30 + 87 + 4 = 144）
assertion_count: 144
