# 版本级 manifest — kea-hook-host-cache 3.0.3
# 文件位置: archives/k/kea-hook-host-cache/3.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.3"
software: "kea-hook-host-cache"

# 编译状态: published | built | failed | archived
status: published

build_date: "2026-10-02"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================

artifacts:
  - "lib/kea/hooks/libdhcp_host_cache.so"
  - "lib/libkea-*.so* (hook 运行时依赖闭包，20 个 kea 库)"

# ============================================================
# 上游测试（build() 内真实执行）
# ============================================================

upstream_tests:
  command: "meson test -v -C <builddir> dhcp-host-cache-tests dhcp-host-cache-libloadtests"
  suites_run: 2
  # 源码 TEST_F 宏计数：tests/ 23 + 30 + 87 = 140 + libloadtests/ 4 = 144
  # 其中 1 例（CommandTest.writeEnvVarOverride）经补丁 0005 做平台适配
  # （KEA_DHCP_DATA_DIR 覆盖值 /tmp → TEST_DATA_BUILDDIR；OHOS /tmp 只读），
  # 用例数量与覆盖行为未变，144 例全部注册并实跑
  cases_in_source: 144
  root_cases: 0
  root_cases_detail: "无：host_cache 为纯内存主机保留缓存数据源（容器索引/命令 callout/host 数据源查询，无 SOCK_RAW、无特权依赖），与 ping-check 的 48 个 Root 组用例形成对比"
  # 真机实测（2026-10-02 conan-verify）：
  # dhcp-host-cache-tests 140 例 + dhcp-host-cache-libloadtests 4 例，
  # 零 root 零 SKIP 全 PASSED（[ PASSED ] 140 + [ PASSED ] 4，Ok: 2 Fail: 0）。
  cases_run: 144
  cases_passed: 144
  cases_failed: 0
  cases_skipped: 0
  cases_unregistered: 0
  cases_unregistered_reason: "无：源码 TEST_F 宏 144 个（23 + 30 + 87 + 4），无 DISABLED_ 前缀，本配置全部注册"

# ============================================================
# 鸿蒙特有测试（test_package，3 个用例）
# ============================================================

ohos_specific_tests:
  count: 3
  entries:
    - "test_package/test_host_cache_hook.c → test_host_cache_hook（hook 加载与契约）"
    - "test_package/test_ohos_platform.c → test_ohos_platform（平台 ABI）"
    - "test_package/test_ohos_runtime.c → test_ohos_runtime（运行时闭包）"
  command: "./test_host_cache_hook <so> && ./test_ohos_platform <so> && ./test_ohos_runtime <so>"
  checks:
    - "dlopen(RTLD_NOW) 加载 hook，KEA_HOOKS_VERSION == 30003，load/unload 契约符号可解析"
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so），且不含 GNU libstdc++ 命名"
    - "OHOS 加载器 dlopen(RTLD_NOW|RTLD_LOCAL) 可解析插件及其 Kea 运行库闭包（实测 DT_NEEDED 项数见 notes.md）"
    - "包内 Kea 运行时库（lib/libkea-*.so*）在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 成功（实测见 notes.md）"
    - "闭包驻留后 hook 仍可加载，load/unload 契约符号可在运行时解析"
  # 真机实测（2026-10-02 conan-verify）：test_host_cache_hook OK（hooks version 30003）+
  # test_ohos_platform OK（DT_NEEDED 11 项 = kea 闭包 9 + libc++_shared.so + libc.so）+
  # test_ohos_runtime OK（40 found / 40 loaded）。
  cases_run: 3
  cases_passed: 3
  cases_failed: 0

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson.build.patch"
  - "0002-src-lib-dhcp-iface_mgr_linux.cc.patch"
  - "0003-meson.build.patch"
  - "0004-src-lib-process-cfgrpt-meson.build.patch"
  - "0005-src-hooks-dhcp-host_cache-tests-command_unittests.cc.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Meson 报告 OHOS 为 system='harmonyos'，Kea 的 build_machine.system() 白名单不含它：需在顶层归一化为 linux 才会选中 Linux 源码分支（iface_mgr_linux.cc / pkt_filter_lpf.cc）"
  - "OHOS sysroot 的 linux/socket.h（bionic 派生）定义 struct sockaddr_storage，与 musl sys/socket.h 冲突：用 define-guard 重命名内核侧定义（__linux__ && !__GLIBC__ 守卫）"
  - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core sp_thread_sleep.hpp 依赖它：定义 BOOST_SP_NO_PTHREAD_SETCANCELSTATE（boost 官方逃生宏）"
  - "OHOS 上 CPython subprocess 走 posix_spawn，不按 PATH 解析可执行名：裸名 'llvm-ar'（来自宿主 AR 环境变量）执行报 ENOENT，即使 which 能找到——须在 machine file 注入绝对路径"
  - "Conan MesonToolchain 默认只设 pkg_config_path=generators_folder，需同时使用 PkgConfigDeps 生成依赖 .pc，meson 才能解析 boost/log4cplus/openssl/gtest"
  - "Meson 的 cpp.run() 特性探针在 native 构建下会真实执行，host 共享依赖（log4cplus）必须通过 LD_LIBRARY_PATH 在配置期可见（缺失时探针返回 127，上游 meson.build:824 报 Unknown variable 'log4cplus'）"
  - "制品仓 boost/1.85.0 无 libboost_system，需 meson >= 1.10 的 header-only 模块回退；meson 版本必须 >= 1.10"
  - "host_cache 为纯内存主机保留缓存数据源（容器索引 + 9 个控制通道命令 callout + CacheHostDataSource 查询接口），144 例在 OHOS 沙箱下零 root 零 SKIP 全实跑（含 56 个 MultiThreading 模式变体；与 ping-check 48 个 Root 组用例 SKIP 形成对比，见 notes.md）"
  - "OHOS 内核拒绝 shebang 脚本 execve（与可执行位无关）：conan 的 meson 包 bin/meson 是 shell 包装脚本，必须 sh '<meson 包>/bin/meson' 调用（Error 126 实测）；meson 的 run_command 数组首参语法（['/bin/sh', 脚本] / [python3, 脚本]）真机验证通过"
  - "Kea configure 期直接执行自带脚本：scripts/env.sh 探包类型、scripts/grabber.py 做文件列表——补丁把脚本变量重定义为解释器前缀数组，所有调用点零改动（家族补丁 0003）"
  - "configure 期还有两处 configure_file(command:) 直接执行脚本：生成的 config-report.sh（顶层 meson.build:1025）与 tools/mk_cfgrpt.sh（src/lib/process/cfgrpt/meson.build）——同样经 /bin/sh 前缀修复（补丁 0003 hunk 2 + 0004）"
  - "OHOS /storage 沙箱拒绝创建符号链接（ln -s → EPERM）：meson 以 version: 'N.M.K' 构建共享库时只以符号链接发布 soname 名，链接名文件在 OHOS 上根本不存在，加载器按 NEEDED 名查找全部落空。build() 在 compile 后以复制方式物化 soname 名（_materialize_sonames，幂等），meson test 与 package() 遍历都能吃到"
  - "真机曾出现 package 产物落盘为 0 字节的瞬时问题（/storage 写回异常）：package() 收尾增加空产物复核，0 字节的 Kea 库从构建树重拷（自愈 + WARNING 日志），test_package 的运行时闭包测试（包内 Kea 库逐个 dlopen）兜底拦截回归"
  - "OHOS app 沙箱限制并发进程数：ninja 默认按 20 核并发（~45 个活动 spawn）会触发 posix_spawn EAGAIN 中断编译——meson compile 须限并发 -j 8（家族配方 host-cmds 实测，本配方沿用）"
  - "家族复用取证：host_cache 与已合入的 kea-hook-limits/kea-hook-ping-check/kea-hook-flex-option 同属 Kea 3.0.3 单源码树（src/hooks/dhcp/host_cache/），4 个补丁整组逐字节复用（0001/0002 与 limits 一致、0003/0004 与 ping-check 一致），本配方测试面新增结论：host_cache 的 144 例在 OHOS 沙箱零 root 零 SKIP 全实跑，且 libloadtest 证明 v4/v6 双协议加载能力（validLoad 同时加载进 kea-dhcp4 与 kea-dhcp6）真机成立——与 v4-only 的 bootp 形成对照"
  - "OHOS/HarmonyOS PC 真机的 /tmp 是只读 rootfs 挂载（touch 实测 Read-only file system，目录属 root:root 2024 年出厂镜像）：任何把数据目录/临时目录指向 /tmp 的上游测试在真机上确定性失败（host_cache 的 CommandTest.writeEnvVarOverride 实测：cache-write 命令返回 Unable to open file '/tmp/dump.json' for writing）。平台适配方式=补丁 0005 将该测试的 KEA_DHCP_DATA_DIR 覆盖值改为测试自身 meson 已定义的可写构建目录 TEST_DATA_BUILDDIR——getPath 逐字返回 env 值（仅去尾部 /），与安装常量 DHCP_DATA_DIR 不同，覆盖语义与判别力保留；真机单测复验 140/140"

