# conandata.yml - keepsecret 1.1.0
# Sources are flat (the recipe carries the version) and patches are keyed by
# version for apply_conandata_patches(), mirroring the alligator/klevernotes
# layout used by the other KDE Kirigami application recipes in this archive.

sources:
  url: "https://download.kde.org/stable/keepsecret/keepsecret-1.1.0.tar.xz"
  sha256: "d27a9925cd6b47de16fd29a7e18984e7a1524084eb614be110abdf279a0b57d1"

patches:
  "1.1.0":
    - patch_file: "patches/0001-src-CMakeLists-drop-I18nQml-and-kitemmodels-shim.patch"
      patch_description: >-
        KF6::I18nQml is not published in the conan registry (ki18n builds with
        BUILD_WITH_QML=OFF); drop the link and keep the deprecated
        KLocalizedContext API visible.
      patch_type: "portability"
    - patch_file: "patches/0002-main.cpp-use-KLocalizedContext-and-Basic-style.patch"
      patch_description: >-
        Use the in-registry KLocalizedContext from KF6::I18n and the in-tree
        Basic QQC2 style (qqc2-desktop-style / qqc2-breeze-style are not
        published in the registry).
      patch_type: "portability"
    - patch_file: "patches/0003-About.qml-drop-coreaddons-AboutData.patch"
      patch_description: >-
        The org.kde.coreaddons QML module is not published (kcoreaddons builds
        with KCOREADDONS_USE_QML=OFF); supply the about data as a plain JSON
        object, which FormCard.AboutPage supports natively.
      patch_type: "portability"
    - patch_file: "patches/0004-Main.qml-drop-coreaddons-and-config.patch"
      patch_description: >-
        Drop the unpublished org.kde.coreaddons and org.kde.config QML module
        imports; inline the version string and restore the window geometry from
        a Kirigami settings store.
      patch_type: "portability"
    - patch_file: "patches/0005-CollectionContentsPage.qml-drop-kitemmodels.patch"
      patch_description: >-
        The org.kde.kitemmodels QML module is not published (the kitemmodels
        recipe skips the QML plugin); use the QSortFilterProxyModel shim added
        by patch 0006 instead of KSortFilterProxyModel.
      patch_type: "portability"
    - patch_file: "patches/0006-add-qml-sortfilterproxymodel-shim.patch"
      patch_description: >-
        Add a small QSortFilterProxyModel subclass exposing the
        KSortFilterProxyModel QML surface (sourceModel, filterRole,
        filterString, sortRoleName, ...), which the unpublished
        org.kde.kitemmodels module normally provides.
      patch_type: "portability"
