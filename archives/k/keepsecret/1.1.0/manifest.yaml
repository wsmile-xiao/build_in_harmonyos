# R51 上游测试清点（三步法第一步：适配前清点）
upstream_test_inventory:
  tests_directory: "none"
  ctest_registered: 0
  evidence: >-
    1.1.0 tarball 无 tests/ 或 autotests/ 目录；CMakeLists.txt 与
    src/CMakeLists.txt 均无 add_test()/BUILD_TESTING/add_subdirectory(tests)。
    结论：上游确无测试，非本端遗漏。

test_results:
  type: "passed_with_platform_limitation"
  upstream: >-
    上游 1.1.0 确无测试套件（清点证据见 upstream_test_inventory 与 notes.md）：
    tarball 无 tests/autotests 目录，两个 CMakeLists 无 add_test()/BUILD_TESTING
    命中，.gitlab-ci.yml/.kde-ci.yml 无测试作业，无 Qt6Test find_package。
    配方在 build() 中执行 ctest -N 如实记录上游注册状态（0 条），不伪造测试。
  test_package: >-
    1/2 层实测通过 + 1 层环境阻塞（已声明豁免）：
    (1) test_ohos_gate.py 鸿蒙特有 ELF 适配闸 PASS —— 解析打包后二进制 22 条
        DT_NEEDED，断言 aarch64、无 libKF6I18nQml、含 libKF6I18n/
        libsecret-1/libQt6Qml/libQt6Quick/libQt6Core；
    (2) 离屏启动冒烟 LAUNCH_SMOKE_RESULT=env_blocked（见下）；
    (3) 打包负载完整（bin/keepsecret + org.kde.keepsecret QML 模块 +
        desktop/metainfo/icon 数据文件）。
  launch_smoke: >-
    env_blocked — 本 OHOS 构建沙箱不提供可达的 Secret Service 会话总线，两重原因：
    (a) OHOS 制品仓的 conan dbus 包只发 libdbus，不含 bin/dbus-daemon
    （kio-kwallet 6.28.0 同款实测结论），故 test_package 无法拉起私有总线；
    (b) sandbox 用户无 /etc/passwd 条目（getpwuid 报 uid not found），dbus 对端
    身份校验无法通过。keepsecret 的 KDBusService(KDBusService::Unique) 在 QML 引擎
    创建前记录 "DBus session bus not found" 并 exit(1)（上游 kdbusservice.cpp
    KDBusService::run()），故无法观测到事件循环。这是构建沙箱的环境属性，非本端
    适配缺陷。test_package 现按三条件精确判定该豁免（rc==1 + 应用确实打印
    KDBusService 的 "DBus session bus not found" + QML 引擎未报 Main.qml 加载失败），
    任何其他非零码或 Main.qml 加载失败一律 fail，故真实适配回归（QML 模块缺失、
    引擎崩溃）不会被掩盖；豁免打印完整输出，按 TEST_QUALITY_SPEC §3.3 可审计。
    ELF 适配闸为该产物的权威验证；真机带 Secret Service 提供者环境应可跑通冒烟。
  l0: >-
    pass: 质量门禁全过（G0 知识图谱 541 条完整 / G0e 根目录白名单 / JC 杂项文件
    prdiff 模式 17 文件 / L0i 依赖 15/15 在仓 / L0j 首发布无版本冲突 / L0k
    commands.json type=tool / L0m 目录结构），reports/w3-local-ci.log
  l1: >-
    pass: conan create 执行 test_package（L1a 已执行 / L1b 证据存在 / L1c 上游
    ctest 在 build 阶段执行 / L1e 破坏性负测试确认测试真实依赖产物）
  l2: "skip: keepsecret 无 --version/--help 参数（GUI 应用，非阻断）"
  l4: "pass: 补丁无危险函数（reports/w3-local-ci.log）"
  l5: "pass: bin/ 有内容"
  w3_local_ci: >-
    pass (exit 0, Pass rate 100.0% (1/1)；reports/w3-local-ci.log)
  conan_create: >-
    passed (exit 0, 日志 0 条 ^ERROR；reports/conan-create.log)

