knowledge_gained:
  - "zlib/1.3.1.1 vs zlib/1.3.2 图冲突：karchive/6.18.0（经 kirigami-addons -> kiconthemes 引入）钉 zlib/1.3.2，而 libsecret/0.21.7 的 glib/2.84.0.1 闭包钉 zlib/1.3.1.1；根 override zlib/1.3.2 解冲突，且 glib 保持 2.84.0.1 可复用已发布二进制（改 glib 版本会触发 libsecret 二进制缺失）"
  - "org.kde.coreaddons QML 模块不在制品仓（kcoreaddons 以 KCOREADDONS_USE_QML=OFF 构建），FormCard.AboutPage 无条件下 import 它；aboutData 属性同时接受与 KAboutData 同形的 JS 对象，可内联替代"
  - "org.kde.config QML 模块不在制品仓（kconfig 以 KCONFIG_USE_QML=OFF 构建）；Config.WindowStateSaver 可用 QtCore.Settings 等价替换（qtdeclarative 提供 QtCore QML 模块）"
  - "org.kde.kitemmodels QML 模块不在制品仓（kitemodels 配方不 require qtdeclarative，跳过 QML 插件）；KSortFilterProxyModel 须自建 QSortFilterProxyModel 子类 shim（QML_ELEMENT 注册进应用模块）"
  - "KF6::I18nQml 全版本不在制品仓（ki18n 以 BUILD_WITH_QML=OFF 构建）；KLocalizedContext（KF6::I18n）是等价前代 API，但被 ecm_set_disabled_deprecation_versions(KF 6.17.0) 隐藏，须加 KI18N_DISABLE_DEPRECATED_BEFORE_AND_AT=0"
