type: test_package
name: keepsecret
version: "1.1.0"
checks:
  - "ohos_gate_elf_needed (new OHOS-specific test: test_ohos_gate.py, pure-python
    ELF64 parser; asserts no KF6I18nQml DT_NEEDED - the unpublished I18nQml
    workaround is real in the artifact - and that the QML closure plus the
    libsecret-1 secret-store backend are linked on an AArch64 OHOS binary)"
  - "offscreen_launch_smoke (packaged app launched with offscreen QPA; timeout
    exit code 124 == QML engine loaded Main.qml and reached the event loop;
    exit code 1 + the KDBusService 'DBus session bus not found' message + no
    QML load failure == declared ENV-BLOCKED, since this sandbox has no
    dbus-daemon binary (the OHOS conan dbus package ships libdbus only) and no
    /etc/passwd entry for dbus peer authentication; any other non-zero code,
    and any Main.qml load failure, fails the test)"
  - "package_payload_complete (packaged bin/keepsecret plus the
    org.kde.keepsecret QML module and the .desktop/metainfo/icon data files
    installed by upstream)"
upstream_test_sources: []
notes: >-
  Upstream keepsecret 1.1.0 ships NO test suite. Census (R51 three-step
  protocol): the source tarball has no tests/ or autotests/ directory, and
  neither CMakeLists.txt nor src/CMakeLists.txt registers any add_test(),
  BUILD_TESTING or CTest target. The recipe asserts that upstream state
  (ctest -N run in build()) instead of faking a suite, and the deliverable is
  covered by the two test_package layers above. See notes.md for the full
  census evidence and the upstream test-inventory declaration table.
