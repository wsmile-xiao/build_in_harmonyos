# 软件级 manifest — keepsecret
# 包名 keepsecret = 上游产品 KeepSecret（KDE utilities / Secret Service 客户端）
# 遵循 ARCHIVE-SPEC v2.0

software: keepsecret
display: "KeepSecret"
description: "KDE Secret Service 密码管理器 GUI（Kirigami convergent QML 应用）"
category: utility
homepage: "https://invent.kde.org/utilities/keepsecret"
license: "GPL-2.0-or-later"

build_system: cmake

ohos_adaptation:
  key_points:
    - >-
      上游 Qt/KF 门槛（Qt >= 6.8、KF >= 6.8）在仓基线（Qt 6.11.1 + KF 6.18.0）
      已满足，无需下调；真正的障碍是制品仓缺失的 QML 模块
    - >-
      KF6::I18nQml 全版本不在仓（ki18n 以 BUILD_WITH_QML=OFF 构建）：改用 KF6::I18n
      的 KLocalizedContext，并须加 KI18N_DISABLE_DEPRECATED_BEFORE_AND_AT=0 解除
      ecm_set_disabled_deprecation_versions(KF 6.17.0) 的隐藏
    - >-
      org.kde.coreaddons / org.kde.config / org.kde.kitemmodels 三个 QML 模块不在仓
      （kcoreaddons KCOREADDONS_USE_QML=OFF、kconfig KCONFIG_USE_QML=OFF、kitemmodels
      不 require qtdeclarative 跳过 QML 插件），各自以在仓等价物替换
    - >-
      qqc2-desktop-style / qqc2-breeze-style 均未发布，QQuickStyle 回落内置 Basic
    - >-
      zlib 图冲突：karchive/6.18.0（经 kirigami-addons -> kiconthemes 引入）钉
      zlib/1.3.2，而 libsecret/0.21.7 的 glib/2.84.0.1 闭包钉 zlib/1.3.1.1；
      根 override zlib/1.3.2 解冲突，且必须保持 glib 不动（改 glib 版本会使 libsecret
      已发布二进制缺失，触发源码重编并因 proxy-libintl.pc 缺失失败，实测）
    - >-
      上游 1.1.0 无测试套件（tarball 无 tests/autotests，CMakeLists 无 add_test()/
      BUILD_TESTING），配方在 build() 中执行 ctest -N 如实记录 0 条，不伪造测试
    - "GUI 可执行文件，已声明 commands.json（R38）"
  common_dependencies:
    - qtbase-sql-dbus
    - qtdeclarative
    - kirigami
    - kirigami-addons
    - kcoreaddons
    - kconfig
    - ki18n
    - kitemmodels
    - kcrash
    - kdbusaddons
    - libsecret

versions:
  "1.1.0":
    status: built
    build_date: "2026-09-29"
    source_url: "https://download.kde.org/stable/keepsecret/keepsecret-1.1.0.tar.xz"
