# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kwayland/6.7.2
homepage: "https://invent.kde.org/plasma/kwayland"

# 上游测试命令（本包不注册 ctest 测试，见 upstream_tests 说明）
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir <build_dir> --output-on-failure --no-tests=error --timeout 90"

# 上游 6.7.2 的 tests/CMakeLists.txt 只有 add_executable、没有任何
# add_test（实测），它们运行时依赖的 org-kde-kf5-kwayland-testserver
# 在 KF6 服务端拆分后移出本仓库（KWaylandConfig.cmake.in 里的
# kwaylandtest() 引用的是不存在的 libexec 路径）。因此上游测试只能
# 做到"构建级"验证：BUILD_TESTING=ON 时 12 个测试可执行文件全部真实
# 编译链接通过；运行时验证由 test_package 的 E2E 往返承担。
upstream_tests:
  - category: build-only
    count: 12
    description: "11 个客户端测试可执行文件（copyClient/pasteClient/touchClientTest/panelTest/qtwayland-integration-test/subsurface-test/shadowTest/dpmsTest/plasmasurface-test/xdgforeign-test/xdg-test）+ kwaylandScanner 工具，BUILD_TESTING=ON 全量编译链接通过"
    status: built-not-run
    condition: "上游 tests/CMakeLists.txt 无 add_test 调用（仅 add_executable）；运行依赖的 testserver 不在本仓库"
  - category: build-only
    count: 1
    description: "KWaylandClient 共享库本体（含 46 个协议绑定源文件经 WaylandScanner 生成的客户端代码）编译链接通过"
    status: built-not-run
    condition: "conan create build() 内 cmake --build 全量通过"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: CMakeLists.txt
    description: "CMake 消费者：find_package(KWayland REQUIRED) 经上游 KWaylandConfig.cmake（find_dependency(Qt6Gui)）解析 + find_package(Qt6 Core Gui) + 链接 Plasma::KWaylandClient（configure 阶段断言）"
    command: "conan test"
  - file: src/client_roundtrip.cpp
    description: "E2E 往返：进程内迷你 Wayland 合成器（socketpair + wl_client_create 挂已连接 fd + wl_compositor v4 global，服务端线程）+ KWaylandClient 全链路（setSocketFd → initConnection → connected → Registry::setup → interfacesAnnounced → createCompositor → createSurface → commit → flush），5 项运行时断言：connected 5s 内 / interfacesAnnounced 5s 内 / hasInterface(Compositor) / 对象创建非空 / 服务端 create_surface 计数 == 1"
    command: "conan test"
  - file: src/mini_compositor.c
    description: "服务端实现：wl_global_create 注册 wl_compositor v4（create_surface 计数）+ wl_shm v1，wl_event_loop_dispatch 循环驱动"
    command: "conan test"

# 测试断言总数：上游 13 项全部构建级（built-not-run），test_package
# 1 组 configure 断言 + 5 项运行时断言
assertion_count: 6
