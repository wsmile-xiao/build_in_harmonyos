# conandata.yml — kwayland 6.7.2
# 官方 KDE release tarball（sha256 本地下载复核）。

sources:
  url: "https://download.kde.org/stable/plasma/6.7.2/kwayland-6.7.2.tar.xz"
  sha256: "3d3ca745d4f7a53be8b331fccde825d9cc54a8761d7a33318f4fb2d602b857f4"

patches:
  "6.7.2":
    - patch_file: "patches/0001-ohos-wayland-1.22-minimum.patch"
      patch_description: "Wayland 最低版本 1.24 -> 1.22（ohpcd 生态 qtbase/qtwayland 钉 1.22.0，混用 1.24.0 图冲突，libkscreen 6.7.2 先例）"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-no-wl-fixes-on-wayland-1.22.patch"
      patch_description: "wl_fixes 接口（Wayland 1.24 新增）在 1.22 头文件下整体编译剔除：registry.cpp 五处使用以 WL_FIXES_INTERFACE 宏守护；surface_p.cpp 为 QtWaylandClient 私有头补 struct wl_fixes 前置声明"
      patch_type: "portability"
    - patch_file: "patches/0003-ohos-unversioned-shared-object.patch"
      patch_description: "OHOS 单一无版本共享对象：去掉 KWaylandClient 目标的 VERSION/SOVERSION，避免 CMake 生成 libKWaylandClient.so.6 -> .so.6.7.2 符号链接链（OHOS 构建环境禁止创建符号链接，G2 链接期 cmake_symlink_library Permission denied）；唯一产物的形态与已发布 OHOS 库一致（libKF6Screen.so/libKScreenLocker.so/libkdecorations3private.so）。DT_SONAME 由配方的 CMAKE_SHARED_LIBRARY_SONAME_*_FLAG 继续提供（真机探针实测无版本实体文件仍带 SONAME=libKWaylandClient.so），消费者的 DT_NEEDED 保持裸文件名、可重定位（kdecoration/layer-shell-qt 先例）"
      patch_type: "portability"
