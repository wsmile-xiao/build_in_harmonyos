# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kdbusaddons/6.14.0.

package: kdbusaddons/6.14.0
homepage: https://invent.kde.org/frameworks/kdbusaddons

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: autotests/
    source: kdbusaddons-6.14.0/autotests/
    description: "KDBusAddons upstream autotests (deadservicetest, kdbusservicetest). 沙箱实测 2/2 通过：本机 OHOS 沙箱自建 dbus-daemon 1.14.10 + abstract session bus 运行（kdbusservicetest exit 0、deadservicetest 3 passed/0 failed），详见 reports/dbus-autotests-run.md"
    command: "ctest --output-on-failure"
    condition: "CI 沙箱无 dbus-daemon 故配方 BUILD_TESTING=OFF；沙箱实测通过见 dbus-autotests-run.md"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke test constructs a KDEDModule, sets/reads its module name and exercises KDEDModule::moduleForMessage()."
    command: "conan create (test_package builds and runs test_kdbusaddons)"

assertion_count: 3
