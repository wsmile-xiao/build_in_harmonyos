# 版本级 manifest — kdbusaddons 6.14.0
# 遵循 ARCHIVE-SPEC v2.0

version: "6.14.0"
software: "kdbusaddons"
status: built
build_date: "2026-08-27"
build_system: cmake

source:
  url: "https://download.kde.org/stable/frameworks/6.14/kdbusaddons-6.14.0.tar.xz"
  sha256: "f673c9f295df5998948def94caf92d487d63886452802ffb97ad151315627ee4"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DWITH_X11=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - qtbase-sql-dbus/6.11.1
    - ecm/6.20.0
  cc: clang
  cxx: clang++

patches_applied:
  - patches/0001-CMakeLists.txt.patch

knowledge_gained:
  - "qtbase/6.11.1 的 FEATURE_dbus=OFF，Qt6DBus 只能由 qtbase-sql-dbus/6.11.1 提供；依赖 Qt6DBus 的 KF6 组件须用 qtbase-sql-dbus 而非 qtbase"
  - "kdbusaddons 的 WITH_X11 在 OHOS 上置 OFF，可编译掉 qtx11extras_p.h 代码路径并避免链接 Qt6::GuiPrivate"
  - "OHOS 沙箱无 dbus-daemon 二进制且 unix socket 创建被禁，需自建 dbus-daemon（源码构建）+ abstract/tcp session bus 才能运行依赖 D-Bus 的上游 autotests（kdbusservicetest/deadservicetest 沙箱实测 2/2 通过）"

tests:
  upstream_autotests: "2/2 通过（沙箱实测，reports/dbus-autotests-run.md）"
  test_package: "1/1 通过（test_kdbusaddons，3 项断言）"
