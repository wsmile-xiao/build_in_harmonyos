  optional:
    - kdoctools
patches_applied: []
test_results:
  type: conan_create_ohos_aarch64
  upstream: "blocked: BUILD_TESTING=ON registered kdbusservicetest; full execution was attempted and failed because no DBus session bus was available; the OHOS package profile provides neither dbus-daemon nor dbus-launch, so the final recipe records the registered test with ctest -N and skips that single test"
  test_package: "passed: KF6DBusAddons CMake consumer linked with Qt6::DBus, ran CTest 1/1, and directly verified KDBusService meta-object/runtime construction without a live session bus"
  full_reference: "kdbusaddons/6.18.0#5ecacb20d378e81239ac562ce8702d04:fe643a6a365d349533fe6eecb9772405e9423933#d9889f2164a2dc57c65dba8ddde8031f"
