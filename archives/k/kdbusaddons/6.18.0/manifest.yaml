source_sha256: dce95cd146e18b400c4df31ea8c9bbba8f919e329a52dc1a19635184ac85e49a
knowledge_gained:
  - "kdbusaddons exports the KF6DBusAddons CMake package and KF6::DBusAddons target."
  - "The library requires Qt6::DBus, so this recipe depends on the verified qtbase-sql-dbus package rather than the Qt base package without DBus support."
  - "WITH_X11=OFF avoids the optional Qt X11 private header path, which is not provided by the current OHOS Qt package and is not needed by the Akonadi calendar dependency chain."
  - "The registered upstream CTest entry requires a live DBus session bus; the recipe only skips it when neither dbus-daemon nor dbus-launch is available in the OHOS package profile."
