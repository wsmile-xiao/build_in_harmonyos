# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kdbusaddons/6.29.0
homepage: "https://invent.kde.org/frameworks/kdbusaddons"

# kdbusaddons 6.29.0 上游带 autotests/（kdbusservicetest、deadservicetest
# 及 kdbussimpleservice 辅助进程）与 tests/（dbuscalltest、syncdbusenvtest），
# 全部通过 ECM ctest 注册；这些测试运行时需要活动 D-Bus session bus。
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error --timeout 90"

# 上游实际运行的测试程序（依赖 D-Bus session bus；OHOS 构建机无
# dbus-daemon 时按运行环境限制记录，不阻塞包创建）
upstream_tests:
  - name: kdbusservicetest
    description: "上游 autotest：KDBusService unique/multiple 注册与激活流程（需 session bus）"
  - name: deadservicetest
    description: "上游 autotest：服务死亡检测（需 session bus + kdbussimpleservice）"
  - name: dbuscalltest
    description: "上游 tests：向 session bus 发送信号（需 session bus）"
  - name: syncdbusenvtest
    description: "上游 tests：KUpdateLaunchEnvironmentJob 同步环境到 bus（需 session bus）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_kdbusaddons.cpp
    description: "消费者测试：链接 KF6::DBusAddons 并真实调用 KDBusService API（serviceName/isRegistered，NoExitOnFailure）"
    command: "./test_kdbusaddons"
  - file: test_kdbusaddons_ohos.cpp
    description: "鸿蒙特有测试：断言 OHOS 适配路径行为 —— WITH_X11=OFF 无 X11 依赖、无 session bus 时 NoExitOnFailure 不退出、isRegistered()==false、serviceName() 仍由应用身份生成"
    command: "./test_kdbusaddons_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6