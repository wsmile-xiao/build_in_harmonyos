# 版本级 manifest
# 文件位置: archives/{letter}/{name}/5.116.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.116.0"

# 软件名
software: "knotifications5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.kde.org/stable/frameworks/5.116/knotifications-5.116.0.tar.xz"

  # 源码校验和
  sha256: "485930001af56d647825cb5b99a7693b70a3270b1b270b32224a5f81dc69b44b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=ON"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DQT_MAJOR_VERSION=5"
    - "-DCMAKE_SYSTEM_NAME=Linux"

  # 关键环境变量
  environment:
    LD_LIBRARY_PATH: "/system/lib64 (sandbox libc++ shadowing fix)"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  # 构建依赖
  build:
    - ecm/6.26.0
  # 运行时依赖
  runtime:
    - qt5-qtbase/5.15.2.2
    - kcoreaddons5/5.116.0
    - kconfig5/5.116.0
    - kwindowsystem5/5.116.0

# ============================================================
# 产物信息
# ============================================================

artifacts:
  # 库文件
  libraries:
    - libKF5Notifications.so.5.116.0
  # 头文件目录
  include_dirs:
    - include/KF5/KNotifications

# ============================================================
# 测试信息
# ============================================================

test:
  # 上游测试
  upstream:
    executed: true
    passed: 0
    failed: 0
    total: 0
    note: "Upstream CTest add_test count is 0 in this feature set (Qt5DBus off; KNotificationTest commented out upstream; tests/ executables DBus-guarded)"
  # 消费者测试
  consumer:
    executed: true
    passed: 1
    failed: 0
    total: 1

# ============================================================
# 补丁信息
# ============================================================

patches:
  - file: patches/0001-CMakeLists.txt.patch
    description: "Disable Qt5DBus/Canberra REQUIRED blocks, HAVE_DBUS, poqm and examples"
  - file: patches/0002-src-CMakeLists.txt.patch
    description: "Force TARGET Qt5::DBus source/link guards off in src/"
  - file: patches/0003-tests-CMakeLists.txt.patch
    description: "Force TARGET Qt5::DBus guard off in tests/"
  - file: patches/0004-knotificationmanager.cpp.patch
    description: "Guard Popup plugin include/instantiation with QT_DBUS_LIB; degrade to NotifyByTaskbar"
