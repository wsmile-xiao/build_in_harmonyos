# conandata.yml — knotifications5 5.116.0
# KF5/Qt5 variant of the knotifications recipe chain (KF6 base: 6.26.0).

sources:
  url: "https://download.kde.org/stable/frameworks/5.116/knotifications-5.116.0.tar.xz"
  sha256: "485930001af56d647825cb5b99a7693b70a3270b1b270b32224a5f81dc69b44b"

patches:
  "5.116.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Disable Qt5DBus/Canberra REQUIRED blocks, poqm and examples (not published to ohpcd)"
    - patch_file: "patches/0002-src-CMakeLists.txt.patch"
      patch_description: "Force the four TARGET Qt5::DBus source/link guards off in src/ (the qt5-qtbase CMakeDeps config still defines a Qt5::DBus target that would pull in DBus-only sources without the matching Qt5DBus headers/API)"
    - patch_file: "patches/0003-tests-CMakeLists.txt.patch"
      patch_description: "Force the TARGET Qt5::DBus guard off in tests/ so no DBus-dependent test executables are configured"
    - patch_file: "patches/0004-knotificationmanager.cpp.patch"
      patch_description: "Guard the notifybypopup/notifybyportal include and the Popup plugin instantiation with QT_DBUS_LIB (upstream #else branch assumes DBus on non-Android/Mac/Win); without DBus the Popup action degrades to NotifyByTaskbar"
