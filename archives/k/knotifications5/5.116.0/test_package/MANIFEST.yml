# test_package/MANIFEST.yml
# Upstream and consumer test declaration for knotifications5/5.116.0.
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: knotifications5/5.116.0
homepage: https://invent.kde.org/frameworks/knotifications

# Upstream test commands (used for ctest -N analysis)
upstream_check_command: "ctest -N"

# Upstream tests are integrated in the Conan build (BUILD_TESTING=ON)
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=ignore"

# Upstream tests: upstream default feature set registers N=5 executable
# tests (tests/CMakeLists.txt knotifications_executable_tests macro), all
# linked against Qt5::DBus:
#   1. kpassivepopuptest       - interactive GUI demo (QApplication event
#                                loop, manual verification by design) +
#                                links Qt5::DBus and KF5::WindowSystem
#   2. knotificationrestrictionstest - KNotificationRestrictions is a
#                                DBus-session-service inhibitor; its
#                                implementation source
#                                (knotificationrestrictions.cpp) is compiled
#                                out of this library build (patch 0002:
#                                src/CMakeLists.txt if(TARGET Qt5::DBus)
#                                -> if(FALSE))
#   3. unitylaunchertest       - links Qt5::DBus
#   4. kstatusnotifieritemtest - KStatusNotifierItem DBus backend
#                                (kstatusnotifieritemdbus_p.cpp compiled out
#                                by patch 0002)
#   5. knotificationdbustest   - DBus backend round-trip test
#
# WHY THEY CANNOT RUN HERE (per-test qualification):
#   - OHOS has no dbus-daemon (no session bus); the published qt5-qtbase
#     is built -no-dbus.
#   - The library build is DBus-free by design (patch 0002 removes the
#     DBus backend sources), so DBus-backend tests cannot link against
#     the shipped library (undefined symbols for the compiled-out
#     implementations).
#   - ctest -N in this feature set: 0 CTest entries (patch 0003 disables
#     the test registration block). ctest runs with --no-tests=ignore.
#
# The consumer test below covers the API surface the DBus-free library
# build actually ships, with real execution (not include-only).
upstream_tests:
  - name: kpassivepopuptest
    qualification: "interactive GUI demo; links Qt5::DBus (unavailable: -no-dbus Qt5); KPassivePopup API covered by consumer test show/hide cycle instead"
  - name: knotificationrestrictionstest
    qualification: "KNotificationRestrictions implementation compiled out (patch 0002, OHOS no dbus-daemon); API not shipped in this build"
  - name: unitylaunchertest
    qualification: "links Qt5::DBus (unavailable: -no-dbus Qt5)"
  - name: kstatusnotifieritemtest
    qualification: "KStatusNotifierItem DBus backend compiled out (patch 0002, OHOS no dbus-daemon)"
  - name: knotificationdbustest
    qualification: "DBus session-bus round-trip (OHOS no dbus-daemon)"

# test_package tests (consumer-side verification, real execution)
test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer real-execution test: KNotification eventId/title/text/iconName/flags/actions assertions + KNotification::event() static call (non-DBus backend, returned object asserted non-null) + KNotification::beep() (pure non-DBus path) + KPassivePopup setView/show/visible/hide cycle (pure Widgets, offscreen platform)"
    command: "conan create (test_package builds and runs test_knotifications5 with QT_QPA_PLATFORM=offscreen)"

# Test assertion count (approximate, for quality assessment)
assertion_count: 11
