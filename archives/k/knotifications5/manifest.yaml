software: knotifications5
display: "KNotifications (KF5)"
description: "KDE Frameworks 5 desktop notification library (KNotification/KPassivePopup/KStatusNotifierItem/KNotificationJobUiDelegate/KNotificationReplyAction/KNotifyConfig)"
category: library
homepage: "https://invent.kde.org/frameworks/knotifications"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "Qt5DBus unavailable in packaged OHOS Qt5: DBus/Canberra REQUIRED blocks + TARGET Qt5::DBus guards + HAVE_DBUS assignment disabled via patches (DBus backends not compiled)"
    - "knotificationmanager.cpp Popup plugin guarded with QT_DBUS_LIB; Popup action degrades to NotifyByTaskbar"
    - "ecm_install_po_files_as_qm(poqm) patched out: Qt5LinguistTools not in packaged OHOS Qt5"
    - "examples/ skipped: need Qt5 Quick (qtdeclarative, unpublished)"
    - "CMAKE_SYSTEM_NAME=Linux forced (UNIX unset on OHOS CMake platform, kcoreaddons5 precedent)"
    - "SONAME flags injected (E330); installed ELFs re-signed with binary-sign-tool"
    - "Upstream CTest add_test count is 0 in this feature set: autotest commented out upstream, tests/ DBus-guarded"
  common_dependencies:
    - qt5-qtbase
    - kcoreaddons5
    - kconfig5
    - kwindowsystem5
    - ecm

versions:
  "5.116.0":
    status: built
    build_date: "2026-09-24"
    conan_ref: "knotifications5/5.116.0"
