software: "kamailio-ims"
display: "Kamailio IMS modules"
description: "Kamailio SIP 服务器 IMS（IP 多媒体子系统）模块集（16 个模块 .so：cdp/cdp_avp Diameter 栈 + ims_* 系列，运行时加载模块 .so）"
category: "sip-server"
homepage: "https://www.kamailio.org"
license: "GPL-2.0-or-later"
build_system: makefile

ohos_adaptation:
  approach: "零补丁 + make 命令行变量注入平台差异（OS=harmonyos + extra_defs 宏集 + libxml2/libmnl/openssl 三个外部库探测钉死）"
  scope: "仅编译 Alpine kamailio-ims 子包对应的 16 个模块，不编译 kamailio 主程序（模块 .so 由 kamailio 运行时 loadmodule 加载）"
  deps:
    - "libxml2/2.15.3.1（构建期与运行时依赖，**动态**：OHOS sysroot 与目标机均无 libxml2 → 非系统同名库，由 conan 依赖链提供运行时 .so，部署需 LD_LIBRARY_PATH；被 cdp / ims_auth / ims_icscf / ims_isc / ims_registrar_pcscf / ims_registrar_scscf 共 6 个模块使用）"
    - "libmnl/1.0.5（**静态**：conan 包仅提供 libmnl.a，mnl_* 符号静态内嵌 ims_ipsec_pcscf.so，实测该 .so 的 DT_NEEDED 不含 libmnl；被 ims_ipsec_pcscf 使用）"
    - "openssl/3.5.8.1（**静态**：conan 包仅提供 libssl.a/libcrypto.a，链接期静态内嵌 cdp.so，实测 cdp.so 的 DT_NEEDED 不含 libssl/libcrypto；cdp/Makefile 的 `ifneq ($(OS),darwin)` 分支无条件追加 -lssl -lcrypto）"
  notes: "详细适配记录见 6.0.6/notes.md"

versions:
  "6.0.6":
    status: built
    conan_ref: "kamailio-ims/6.0.6"
    build_date: "2026-09-30"
