#         spi_list_tests.c:34:45: error: no member named 'id' in 'struct _spi_node'
#         spi_list_tests.c:37:20: error: no member named 'id' in 'struct _spi_node'
#         spi_list_tests.c:61:27: error: no member named 'id' in 'struct _spi_node'
#       本配方走 0 补丁路线（不改上游源码），故不执行并如实登记；
