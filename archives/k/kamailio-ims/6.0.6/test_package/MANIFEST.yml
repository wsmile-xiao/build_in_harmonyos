# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: check_ims_modules.py
    description: "16 模块产物结构/契约/依赖闭包校验（纯 Python ELF 解析，无外部工具依赖）：逐模块核 ELF64 LSB、ET_DYN、EM_AARCH64、core 插件契约名（exports->name == 模块名）、契约导出符号 exports/module_version/module_flags/module_interface_ver（mod_register 按上游加载器语义为可选：sr_module.c:624 先 dlsym，:643 回退 exports，6.0.6 上游 10/16 模块不含该符号——含该符号的 6 个为 cdp/ims_charging/ims_dialog/ims_diameter_server/ims_qos/ims_qos_npn）、DT_NEEDED 全量归类（libc/依赖包/无越界路径、无 RPATH/RUNPATH）、未定义符号 100% 归类（libc/CRT 前缀、依赖包符号前缀如 xml*/mnl_*/SSL_*、余下 kamailio core 符号），并对 libxml2 依赖闭包逐符号复核被引用符号真实存在于依赖包导出集"
    command: "python3 check_ims_modules.py"
  - file: test_ims_modules_e2e.c
    description: "鸿蒙特有端到端消费者用例（规则 12）：以消费者身份走通 kamailio core 的 loadmodule 路径 —— 16 个模块逐个 dlopen(ims 模块 .so, RTLD_NOW|RTLD_GLOBAL) → 取导出描述符 exports（校验模块名、dlflags 对齐上游 DEFAULT_DLFLAGS 哨兵值 0）→ dlsym+调用 mod_register（若模块提供）→ 校验 core 侧 sr_kemi_modules_add 收到的 KEMI 表（条目数、子模块名一致性、参数类型位合法，期望表逐模块按上游源码表项计数校准：cdp 41 命令/10 参数/3 KEMI 等 16 项）→ 遍历 cfg 命令表/modparam 表核计数与字段 → 再对 ims_ipsec_pcscf.so 真实算法做 SPI 链表行为用例 6 组（create_list 空表、spi_add 追加两项 + 字段落位 + FIFO 次序、spi_remove_head、spi_remove 命中/未命中、spi_in_list 命中/未命中、destroy_list 释放计数与 NULL 边界），断言分配/释放计数真实增长 → dlclose；共 381 项断言全 PASS"
    command: "./test_ims_modules_e2e <modules_dir>"
  - file: kamailio_core_stub.c
    description: "core 符号最小实现层：16 个 IMS 模块是 core 插件，引用 sr_kemi_modules_add/fixup_*/dprint/… 等 kamailio core 符号；OHOS 的 musl 加载器不做惰性绑定（dlopen 即等价 RTLD_NOW），故由本文件随 e2e 一起编译并以 -Wl,--export-dynamic 导出符号供 dlopen 解析。含两类真实语义：(1) sr_kemi_modules_add 记录函数表并计数、日志路径 sink 化（类型对齐上游：my_pid/dprint_color 为函数、log_level_info 为数组、_km_log_func 指向 sink 而非 NULL）；(2) kamailio 6.x 内存 API 表全局 `_shm_root`/`_pkg_root`（上游 memapi.h 的 sr_shm_api_t/sr_pkg_api_t 逐字段镜像；模块经 `_shm_root.xmalloc(_shm_root.mem_block, …)` 分配，桩化前实测 spm_add 内首次分配 SIGSEGV：`blr x8`，x8=[_shm_root+24]=0），后端为 libc malloc/free 并计数。DBG_SR_MEMORY 6 参调试签名对齐（file/func/line/mname 不读取）"
    command: "（与 test_ims_modules_e2e.c 同一次 clang 调用，见 conanfile.py test()）"
  - file: gen_core_stub.py
    description: "弱桩自动生成器：按 16 个被测 .so 的 .dynsym 未定义符号面，扣除 libc/libc++ 提供方（sysroot libc.so 已定义符号集）与 conan 依赖包提供方（libxml2 等 .so 导出集）后，其余 kamailio core 符号生成为 __attribute__((weak)) 弱定义（强定义胜出，二者共存不冲突）；函数/数据分类按**重定位类型**判定（st_value==0 的 NOTYPE 符号按引用方式归类，实测 .dynsym 的 st_info 分类会得 0 函数）；内置 NEVER_STUB 豁免表（CRT 符号 _init/_fini/_start/__libc_start_main/__cxa_finalize/__dso_handle/__stack_chk_*，以及内存 API 表全局 _shm_root/_pkg_root——后者必须由 kamailio_core_stub.c 提供真实实现）+ libc 前缀误伤例外表（fork_process/free_*/log_* 等 17 个确属 core 的符号）"
    command: "python3 gen_core_stub.py --modules-dir <modules_dir> --out <generated.c> --provided-so <libc.so|依赖 .so …>"

# 测试断言总数（check_ims_modules.py 中的 check() 调用数，实测 208 项，失败 0）
assertion_count: 208

