# 版本级 manifest — kamailio-ims 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-ims"
status: built                      # R29 口径：conan create/verify 已 PASS 但尚未 conan upload → built；发布流水线（合并后）上传成功再转 published
build_date: "2026-09-30"
build_system: makefile                # kamailio 经典 Makefile 体系（非 autotools/cmake）
conan_ref: "kamailio-ims/6.0.6"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  scope: "IMS 模块集 16 个模块（不编译 kamailio 主程序）"
  configure_options:
    - "make cfg include_modules=\"cdp cdp_avp ims_auth ims_charging ims_dialog ims_diameter_server ims_icscf ims_ipsec_pcscf ims_isc ims_ocs ims_qos ims_qos_npn ims_registrar_pcscf ims_registrar_scscf ims_usrloc_pcscf ims_usrloc_scscf\" extra_defs=\"见本文件 build.platform_defs\" LOCALBASE=<libxml2 包目录> XML2CFG= BUILDER="
    - "make modules modules=\"modules/cdp modules/cdp_avp … modules/ims_usrloc_scscf\"（共 16 个） -j1 extra_defs=\"见本文件 build.platform_defs\" LOCALBASE=<libxml2 包目录> XML2CFG= BUILDER="
  platform_defs: "-D_GNU_SOURCE -DHAVE_GETHOSTBYNAME2 -DHAVE_SCHED_YIELD -DHAVE_MSG_NOSIGNAL -DHAVE_MSGHDR_MSG_CONTROL -DHAVE_ALLOCA_H -DHAVE_TIMEGM -DHAVE_SCHED_SETSCHEDULER -DHAVE_IP_MREQN（共 9 项 = -D_GNU_SOURCE + 8 个 -DHAVE_*，与 conanfile.py PLATFORM_DEFS 逐项一致）"
  parallel_jobs: 1
  parallel_jobs_reason: "E525/E074：OHOS SELinux 禁止用户进程创建 FIFO，GNU make jobserver 靠 FIFO 传递令牌 → -j>1 有挂起/报错风险；与同族其余 kamailio-* 配方一致固定 -j1"
  modules:
    - cdp
    - cdp_avp
    - ims_auth
    - ims_charging
    - ims_dialog
    - ims_diameter_server
    - ims_icscf
    - ims_ipsec_pcscf
    - ims_isc
    - ims_ocs
    - ims_qos
    - ims_qos_npn
    - ims_registrar_pcscf
    - ims_registrar_scscf
    - ims_usrloc_pcscf
    - ims_usrloc_scscf
  dependencies:
    - libxml2/2.15.3.1
    - libmnl/1.0.5
    - openssl/3.5.8.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 上游 6.0.6 源码包原生识别 aarch64-unknown-linux-ohos；平台差异全部经 make
# 命令行变量表达（OS=harmonyos + extra_defs 宏集 + 三个外部库探测钉死），
# 未改动任何上游源文件/构建文件
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`（生成 src/config.mak），否则报 No rule to make target 'cfg-defs'；`make modules modules='modules/<m> …'` 以空格分隔的目录列表一次可只编指定模块集（本包 16 个模块共用一次 cfg + 一次 modules 调用） (knowledge_ref: notes.md#3-构建方法)"
  - "OS=harmonyos 不在 Makefile.defs 的 linux/solaris/freebsd/darwin 任一分支 → HAVE_GETHOSTBYNAME2/HAVE_SCHED_YIELD 等平台探测宏全部缺失，core 头直接 #error。解法：make 命令行 extra_defs 注入 linux 分支等价宏集（9 项，对照 OHOS SDK sysroot 实证存在） (knowledge_ref: notes.md#41-平台探测宏缺失)"
  - "只编模块、不编 core 是零补丁的关键：core/resolve.c 的 _res（HAVE_RESOLV_RES）与 core/lock_ops.h 的 union semun（HAVE_UNION_SEMUN）在 OHOS musl 头文件中无对应定义，仅编译 kamailio 主程序时才触发 (knowledge_ref: notes.md#42-只编模块不编-core)"
  - "同一配方内多模块依赖不同外部库时，钉死手段须按模块 Makefile 的探测链逐条选择：xml2 系 6 模块是 `which xml2-config` → `pkg-config --exists libxml-2.0` → LOCALBASE 三段链，只有用命令行变量 `XML2CFG=`（空值）覆盖内部 `$(shell …)` 赋值才能强制走 LOCALBASE 回退分支（仅传 LOCALBASE 不生效，xml2-config 若在构建机 PATH 上即被劫持）；libmnl 模块是 `which pkg-config` + `--exists libmnl` 两段链，用 `BUILDER=`（空值）钉死 `-lmnl` 分支，链接路径由 LIBRARY_PATH 提供 (knowledge_ref: knowledge/drafts/DRAFT-11941-kamailio-module-dep-probe-pinning.kv)"
  - "cdp 模块的 `ifneq ($(OS),darwin)` 分支无条件追加 `-lssl -lcrypto`（与 xml 系探测无关，OS=harmonyos 恒真）→ 必须显式声明 openssl 依赖；OHOS sysroot 实证无 libssl.so/libcrypto.so/libxml2.so/libmnl.so（四者均非系统同名库），故全部经 conan 依赖链提供运行时 .so，不静态、不打 RPATH，部署经 LD_LIBRARY_PATH (knowledge_ref: knowledge/drafts/DRAFT-11941-kamailio-module-dep-probe-pinning.kv)"
  - "16 个 IMS 模块的消费者级验收手法：逐模块 dlopen + dlsym(\"exports\") 校验 module_exports 契约（name/version/cmds/params/kemi 计数与上游源码逐项对齐），并以 RTLD_NOW 全量符号解析暴露 core 桩层缺口——core 桩必须逐字段对齐上游头类型，否则日志路径解引用野指针 SIGSEGV 掩盖真实失败 (knowledge_ref: knowledge/drafts/DRAFT-11942-kamailio-core-plugin-consumer-test.kv)"

patch_generation:
  method: none
  patches_count: 0
  note: "refresh-patch --auto 复核无候选补丁；patches/ 为空、conandata.yml 为 patches: {}"

patch_classification: []
