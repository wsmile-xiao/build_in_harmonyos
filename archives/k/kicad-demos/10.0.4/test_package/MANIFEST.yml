package: kicad-demos/10.0.4
homepage: "https://gitlab.com/kicad/code/kicad"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  KiCad 10.0.4 demos 目录是纯资源集合（上游 CMakeLists.txt 仅有 install(DIRECTORY
  ...) 一条指令），不含任何测试目标或测试框架；kicad 主仓的测试套件全部针对
  应用程序代码（kicad cmake 工程），不随 demos 资源分发。
test_package_tests:
  - file: kicad_demo_probe.cpp
    description: >-
      真消费者测试：全量解析包内 19 个 .kicad_pcb 与 114 个 .kicad_sch 的
      s-expression 头部（根符号/version/generator + 全文件括号配平），
      校验 35 个 .kicad_pro 的 JSON 结构与 board/schematic 节，核对 18 个
      官方演示工程目录在位，并对截断文件做故障注入负向校验。
    command: "kicad_demo_probe <package-demos-root>"
assertion_count: 4
