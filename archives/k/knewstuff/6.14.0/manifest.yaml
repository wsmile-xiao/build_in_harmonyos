knowledge_gained:
  - "OHOS/Qt6 分包场景 find_package(Qt6 COMPONENTS Qml/Quick/QuickWidgets) 必须设 QT_ADDITIONAL_PACKAGES_PREFIX_PATH（含 lib/cmake/Qt6* 的包根列表）；CMAKE_PREFIX_PATH 单独不生效"
  - "已发布 ki18n 全系 BUILD_WITH_QML=OFF（KF6::I18nQml 缺失）：消费方用 if(TARGET) 守卫 + __has_include 条件编译降级，另见 ki18n/6.18.0.1 依赖项补全任务"
  - "kpackage 仅发布 6.18.0 且图内钉死 karchive/kcoreaddons/ki18n=6.18.0 → 与其同图的 KF6 依赖须整线统一 6.18.0（find_package [x.14,7.0) 区间兼容）"
  - "conan Environment.append('LD_LIBRARY_PATH', [list]) 会把 list 字面量拼进变量（符号解析失败假象）；路径列表必须 prepend_path + os.pathsep.join"
  - "KF6 项目内目标互链无 SONAME 时 lld 把相对路径记入 NEEDED，musl 按 CWD 解析 → 消费者测试必须 cwd=bindir + farm"

