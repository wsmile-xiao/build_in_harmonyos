# test_package/MANIFEST.yml
# Upstream and consumer test declaration for knewstuff/6.14.0.

package: knewstuff/6.14.0
homepage: https://invent.kde.org/frameworks/knewstuff

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/knewstuffentrytest.cpp
    source: knewstuff-6.14.0/autotests/knewstuffentrytest.cpp
    description: "Entry model/item tests"
    command: "ctest -R knewstuff-knewstuffentrytest"
    status: "PASS (0.22s)"
  - file: autotests/core/knewstuffauthortest.cpp
    source: knewstuff-6.14.0/autotests/core/knewstuffauthortest.cpp
    description: "Author data tests"
    command: "ctest -R knewstuff-knewstuffauthortest"
    status: "PASS (0.06s)"
  - file: autotests/core/knewstuffenginetest.cpp
    source: knewstuff-6.14.0/autotests/core/knewstuffenginetest.cpp
    description: "Engine config parsing tests"
    command: "ctest -R knewstuff-knewstuffenginetest"
    status: "PASS (1.05s)"
  - file: autotests/core/installationtest.cpp
    source: knewstuff-6.14.0/autotests/core/installationtest.cpp
    description: "Installation job/handler tests (isolated HOME/XDG)"
    command: "ctest -R knewstuff-installationtest"
    status: "PASS (0.24s)"

upstream_test_note: >
  autotests/core additionally registers atticaprovidertest behind an
  upstream `if(LINUX)` gate (freebsd exclusion); OHOS is not LINUX, so it
  is not configured — not a modification on our side. No upstream test
  source was modified (patches only guard the optional KF6::I18nQml
  runtime add-on, see notes.md #2).

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer test across both shipped libs: KNSCore::Entry state machine (isValid + status round-trips, 3 checks) + KNSWidgets::Button real QWidget API (type/text/enabled, 4 checks), executed offscreen via VirtualRunEnv."
    command: "conan create (test_package builds and runs test_knewstuff)"

assertion_count: 7
