# conandata.yml - knewstuff 6.14.0
sources:
  url: "https://download.kde.org/stable/frameworks/6.14/knewstuff-6.14.0.tar.xz"
  sha256: "1e44b71efc5dc4cb05cc7add344d9a55fc8c998de26e74867d300afbd16f8d04"

patches:
  "6.14.0":
    - patch_file: "patches/0001-src-CMakeLists.txt.patch"
      patch_description: "Only build src/tools (knewstuff-dialog6 demo) when the optional KF6::I18nQml add-on exists; published ki18n packages for OHOS do not ship it"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0002-src-widgets-CMakeLists.txt.patch"
      patch_description: "Guard the PRIVATE KF6::I18nQml link of KF6NewStuffWidgets with if(TARGET): no source file references its symbols; it is a QML runtime add-on missing from published ki18n"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0003-src-widgets-dialog.cpp.patch"
      patch_description: "Conditional-compile the KLocalizedQmlContext use in widgets/dialog.cpp via __has_include; falls back to plain QQmlContext when the ki18n QML add-on is absent (OHOS published ki18n), keeping the QML dialog functional"
      patch_type: "portability"
      strip: 1
