knowledge_gained:
  - "KNewStuff exports KF6NewStuff/KF6NewStuffCore and KF6::NewStuffWidgets/KF6::NewStuffCore."
  - "Kirigami and Syndication are optional for this Akonadi contact dependency chain."
  - "Current ki18n packaging does not export the optional KF6::I18nQml target or KLocalizedQmlContext header, so KNewStuff must guard that private QML integration."
  - "Some already published KF dependencies lack SONAME and can carry stale absolute Conan cache DT_NEEDED entries; KNewStuff verification prepares compatibility links so upstream tests exercise KNewStuff instead of failing in the dependency loader."
  - "KNewStuff install-command upstream tests require a writable QDir::tempPath(); the recipe sets isolated TMPDIR/TEMP/TMP because the OHOS target profile does not provide a writable default temporary directory."
  - "The Linux-only attica provider test is not built by upstream CMake on OHOS."
