software: kdeclarative
display: "KDeclarative"
description: "KDE Frameworks 6 declarative bindings framework (QML integration layer: kquickcontrols/kquickcontrolsaddons/draganddrop/graphicaleffects QML plugins + CalendarEvents C++ library)"
category: library
homepage: "https://invent.kde.org/frameworks/kdeclarative"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "KF_SKIP_PO_PROCESSING=ON: Qt6LinguistTools not published to ohpcd"
    - "CMAKE_DISABLE_FIND_PACKAGE_KF6DocTools=ON: kdoctools not published"
    - "HAVE_KGLOBALACCEL forced FALSE: kglobalaccel not in the registry and OHOS has no desktop global-shortcut registry (upstream ANDROID/IOS branch semantics, no stubs)"
    - "KF_DEP_VERSION floor lowered to 6.19.0 so the published 6.26.0 KF6 deps satisfy the ECM find_package graph"
    - "ECM 6.26 KDEInstallDirs6 runs qtpaths at configure time; /system/lib64 prepended to LD_LIBRARY_PATH for the compatible libc++_shared.so"
    - "cmake_find_mode=none deps discovered through a generated conan_cmakedeps_paths.cmake prefix layer injected via CMAKE_PROJECT_TOP_LEVEL_INCLUDES"
  common_dependencies:
    - qtbase
    - qtdeclarative
    - kconfig
    - kcoreaddons
    - ki18n
    - ecm

versions:
  "6.26.0":
    status: built
    build_date: "2026-09-10"
    conan_ref: "kdeclarative/6.26.0"
