knowledge_gained:
  - "kdeclarative 6.26.0 CMakeLists requires KF6GlobalAccel on the generic Linux branch (NOT WIN32 AND NOT APPLE AND NOT ANDROID AND NOT HAIKU); kglobalaccel is not published in the ohpcd registry and OHOS has no desktop global-shortcut registry, so HAVE_KGLOBALACCEL is forced FALSE (same no-op semantics as the upstream ANDROID/IOS branches)."
  - "KF_DEP_VERSION lowered 6.26.0 -> 6.19.0: the published kconfig/kcoreaddons/ki18n/kguiaddons/kwidgetsaddons 6.26.0 packages all satisfy the floor while ECM 6.26 find_package(KF6... 6.26.0) would otherwise reject the graph."
  - "ECM 6.26 KDEInstallDirs6 runs the qtbase qtpaths host tool during configure (ecm_query_qt); /system/lib64 + SDK llvm lib prepended to LD_LIBRARY_PATH so the compatible libc++_shared.so wins over the sandbox bundle copy (kconfig 6.26.0 / kpackage 6.26.0 precedent)."
  - "Upstream tests/CMakeLists.txt registers exactly one test target (qimageitemtest) via ecm_mark_as_test with NO add_test call: CTest N=0 is the true upstream registration count; the target is an interactive manual GUI test (view.show() + app.exec()), verified headless by building it and launching offscreen (exit 124 = timeout-killed event loop = healthy)."
  - "test_package consumer test subclasses CalendarEventsPlugin (Q_OBJECT) so the test_package build needs CMAKE_AUTOMOC ON with the test_kdeclarative.moc include pattern; linking KF6::CalendarEvents through the KF6DeclarativeConfig shipped under lib/cmake."
  - "QML plugin libraries (kquickcontrolsprivate etc.) install as private QML module plugins dlopen'ed via QML2_IMPORT_PATH; cpp_info.libs only carries KF6CalendarEvents and QML2_IMPORT_PATH is exported through runenv_info."
