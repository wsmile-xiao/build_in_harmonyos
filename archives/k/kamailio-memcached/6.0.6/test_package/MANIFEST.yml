# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kamailio-memcached/6.0.6
homepage: "https://www.kamailio.org/"

# 上游测试套件存在性
# Kamailio 6.0.6 发布包**不含任何自动化测试套件**：
#   - 无顶层 test/ / tests/ 目录；
#   - src/modules/memcached/ 内只有 CMakeLists.txt / Makefile / README / doc/ 与
#     4 个源文件（memcached.c/.h、mcd_var.c/.h），无测试代码；
#   - Makefile 层级内无 `TESTS` / `check_PROGRAMS` / `check-local` / `check:` 目标；
#   - src/ 内无 ctest(`enable_testing`/`add_test`) / pytest / gtest 注册；
#   - 源码树内 pkg/kamailio/alpine/APKBUILD:26 明确声明 `options="!check" # no testsuite`。
# 因此为 false —— 真实的上游入口是构建入口 `make modules modules=modules/memcached`。
upstream_tests_exist: false

# 上游测试审计 (源码: kamailio-6.0.6_src.tar.gz,
# sha256 32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48)
upstream_test_audit:
  source_tarball: "kamailio-6.0.6_src.tar.gz"
  source_sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / add_test (ctest)"
    - "TESTS / check_PROGRAMS / check-local (automake make check)"
    - "顶层 test/ 或 tests/ 目录"
  scan_result: >-
    顶层目录清单 CMakeLists.txt CMakelists.notes CODEOWNERS ... misc pkg src utils
    无 test/tests 目录；`grep -rn '^TESTS' <tarball>` 无命中；
    `grep -rn 'TESTS|check-local|check-am|test:' Makefile src/Makefile src/Makefile.*
    src/modules/memcached/Makefile` 无命中；
    `grep -rln 'enable_testing|add_test(|pytest|gtest' src` 的命中全部是**子串误命中**：
    `gtest` 匹配到 cfgt 模块内的标识串 `cfgtest`（`src/modules/cfgt/cfgt_int.c`、
    `.../doc/cfgt_admin.xml`、`.../README`）以及 debugger 模块 `debugger_mod.c` /
    `debugger_api.c` / `README` 中的同名子串，均与 GoogleTest 无关；源码树内
    **无任何测试注册**（`enable_testing`/`add_test(` 实命中数为 0）。
    另经完整清点，源码包内存在 4 处**他模块/工具级**测试目录，均未注册到任何构建或测试
    系统（0 处 `TESTS`/`check_PROGRAMS`、0 处 ctest/pytest），且与本包（memcached 模块）
    无关，故不构成"上游测试套件"：`src/modules/tm/test/`（kill_sem.sh）、
    `src/modules/rtpproxy/test/`（exec_pjsua.txt/exec_rtpproxy.txt/kamailio.cfg 样例）、
    `src/modules/janssonrpcc/test/`（mem-test.sh/run-tests.sh/test.cfg）、
    `utils/kamctl/dbtextdb/tests/`（dbtext 数据夹具）。
  upstream_test_programs: []
  manual_only_programs:
    - "misc/fuzz/fuzz_parse_msg.c、misc/fuzz/fuzz_uri.c — libFuzzer 模糊测试入口，非断言套件（需 AFL/libFuzzer 运行时）"
    - "misc/examples/**、etc/kamailio.cfg — 示例配置，非测试"
    - "misc/tools/**（protoshoot、profile、pike_top 等）— 运维辅助工具，非测试"
    - "src/modules/tm/test/、src/modules/rtpproxy/test/、src/modules/janssonrpcc/test/、utils/kamctl/dbtextdb/tests/ — 他模块/工具级测试目录（shell 脚本 + 样例配置 + dbtext 夹具），未注册进任何构建/测试系统，与 memcached 模块无关"
  reason: >-
    Kamailio 6.0.6 不提供自动化测试套件；模块 memcached 亦无任何测试文件。
    本配方实际执行上游构建入口 `make cfg` + `make modules modules=modules/memcached`，
    交付物以消费方 harness（test_package/）验证：dlopen 模块、解析模块导出的接口表
    `exports`（校验其首字段 `name == "memcached"`）、调用模块内静态链入的 libmemcached
    API（`memcached_lib_version`/`memcached_create`/`memcached_free`），并断言 OHOS 平台
    特有的 ELF/装载器性质。
    注：memcached 模块**不存在** `mod_register`（源码与打包 .so 的动态符号均无），其
    `mod_init`/`mod_destroy` 为 `static`，故 harness 只校验 `exports`。

# 上游测试命令（本包为“无自动化测试套件”，真实入口为构建入口）
upstream_check_command: "make -C src cfg && make -C src modules modules=modules/memcached"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_memcached_module.c
    description: >-
      消费者测试：dlopen(RTLD_LAZY) 加载包内 memcached.so；解析模块导出符号
      `exports` 并校验其首字段 name == "memcached"（module_exports.name）；
      通过模块句柄调用静态链入的 libmemcached（`memcached_lib_version()` 返回
      1.0.18、`memcached_create`/`memcached_free` 可用）。
      （宿主侧 Kamailio core ABI 由 kamailio_host_stubs.c 提供并以 -rdynamic 导出。）
    command: "./test_memcached_module"
  - file: test_memcached_module.c
    description: >-
      鸿蒙特有测试（4 项）：(1) 包内模块为 ELF64/AArch64；(2) DT_NEEDED 仅含
      OHOS 系统运行时 libc.so + libc++_shared.so（无误链 libmemcached.so）；
      (3) 无构建机 RPATH/RUNPATH 泄漏；(4) OHOS/musl 无延迟绑定 —— 模块必须导入
      Kamailio core ABI（pv_get_null/_km_log_func/MD5StringArray）而 libmemcached
      代码须完全内嵌（无 memcached_* 未定义符号），即宿主签名约束成立。
    command: "./test_memcached_module  # checks 7-10 (ohos-*)"

# 测试断言总数
# 数量口径（静态 == 运行期）：test_memcached_module.c 中 `check("<name>", …)` 文本
# 出现 10 次、唯一用例名 10 个、运行期 CHECK-OK 10 条 —— 三者一致（每个 check 只
# 求值一次，无 if/else 分支重复计数）。
assertion_count: 10
