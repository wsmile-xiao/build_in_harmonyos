# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-memcached"

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-10-02"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源（kamailio.org 正式发布目录）
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  # 本包由 kamailio 自有 Makefile 体系构建，仅编译 memcached 模块
  build_commands:
    - "make -C src cfg"
    - "make -C src modules modules=modules/memcached -j1"
  configure_options: []
  dependencies:
    - libmemcached/1.0.18
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无源码补丁：平台适配全部通过构建设置（SHELL/PKG_CONFIG_PATH）完成
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Kamailio 模块不链接 core：memcached.so 保留 21 个 Kamailio core ABI 未定义符号（_km_log_func/dprint_*/pv_*/MD5StringArray 等），由 kamailio 二进制在 dlopen 时提供（ref: 上游 src/modules/memcached/Makefile 只链接 libmemcached；knowledge_ref: knowledge/drafts/E430-draft-74DD.kv）"
  - "OHOS(musl) 无延迟绑定：dlopen 即完成全部重定位，仅提供 core ABI 的宿主才能加载模块；裸进程直接 dlopen 报 'Error relocating ... pv_get_null: symbol not found'（knowledge_ref: knowledge/drafts/E430-draft-74DD.kv）"
  - "libmemcached/1.0.18 包内 .pc 未声明 system_libs（-lm -lc++），而其 package_info 声明了 system_libs=[m,c++]：用包内 .pc 链接会得到 C++ 运行时未解析的 memcached.so（共享库链接 rc=0，隐患静默）；必须用 conan PkgConfigDeps 生成的 .pc（knowledge_ref: knowledge/drafts/E429-draft-B596.kv）"
  - "静态 C++ 依赖链入共享库时 -lc++ 会引入 DT_NEEDED libc++_shared.so（OHOS 系统运行时），属预期（knowledge_ref: knowledge/drafts/E429-draft-B596.kv）"
  - "kamailio 模块 Makefile 的 pkg-config 探测 BUILDER=$(shell which pkg-config) 在 OHOS 默认 /bin/sh 下不稳定（make[1]: --libs: No such file or directory）；以 SHELL=<bash> 驱动 make 可消除（ref: 本包 conanfile.py _make_shell_arg；knowledge_ref: knowledge/drafts/E431-draft-7643.kv）"
  - "kamailio 6.0.6 无自动化测试套件；真实入口为 make modules modules=modules/memcached（ref: reports/upstream-test-audit.md）"
