# 版本级 manifest
# 文件位置: archives/k/kdecoration/6.7.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.7.2"

# 软件名
software: kdecoration

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.kde.org/stable/plasma/6.7.2/kdecoration-6.7.2.tar.xz"

  # 源码校验和
  sha256: "c82e28e59d2cc2e31ae38e3bc48579528214ba3da2d13a2b71a65bdc0dc47771"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py generate() 中 tc.variables 一致；
  # CMAKE_BUILD_TYPE / CMAKE_SYSTEM_NAME 由 Conan profile/toolchain 处理，不在此列出）
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=ON"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DCMAKE_CXX_STANDARD=20"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - qtbase/6.11.1
    - ki18n/6.26.0
    - ecm/6.26.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt-skip-po-install.patch"
  - "0002-CMakeLists.txt-library-output-dir.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "kdecoration 6.7.2 needs C++20 (-std=c++20 via CMAKE_CXX_FLAGS; plain CMAKE_CXX_STANDARD is overridden by the conan toolchain variable_watch)."
  - "ki18n/6.26.0 (KF6I18nConfig.cmake) must be added to CMAKE_PREFIX_PATH manually because CMakeDeps does not propagate it for cmake_find_mode=none consumers."
  - "ki18n_install(po) is skipped on OHOS: msgmerge from gettext tools is not published to the ohpcd remote."
  - "Upstream autotests (decorationButtonTest, decorationTest, decorationShadowTest) run with QT_QPA_PLATFORM=offscreen."
