# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kdecoration/6.7.2.

package: kdecoration/6.7.2
homepage: https://invent.kde.org/plasma/kdecoration

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_dir> --output-on-failure --no-tests=error --timeout 90"

upstream_tests:
  - file: autotests/
    source: kdecoration-6.7.2/autotests/
    description: "KDecoration3 upstream CTest/autotests suite"
    command: "ctest --output-on-failure"
    condition: "run inside conan create build() with QT_QPA_PLATFORM=offscreen (decorationButtonTest, decorationTest, decorationShadowTest)"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke creates DecorationThemeMetaData and checks visibleName/themeName/configurationName/pluginId round-trip plus BorderSize enum."
    command: "conan create (test_package builds and runs test_kdecoration)"

assertion_count: 5
