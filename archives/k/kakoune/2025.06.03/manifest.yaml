software: kakoune
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2025.06.03/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2025.06.03"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（顶级字段，verify-build G4 要求）
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mawww/kakoune/releases/download/v2025.06.03/kakoune-2025.06.03.tar.bz2"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
    - "CXX=clang++"
    - "gzip_man=no"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "C++2b(-std=c++2b)模式下rename()需要#include<cstdio>"
    - "HMDFS不支持ln -sf，需替换为rm -f && ln -s(R5铁律)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/kakoune-2025.06.03.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/kakoune-2025.06.03.work
  source_orig_hash: 1eaa3af78a8134eb
  source_work_hash: d35e7e24196c1bdf
  generated_at: '2026-05-27T17:30:02'
  patches_count: 2

patch_classification:
  - file: 0001-Makefile.patch
    type: platform_compat
    platform_only: True
    guard: 'HMDFS不支持ln -sf，需rm -f && ln -s替代'
  - file: 0002-src-buffer_utils.cc.patch
    type: header_fix
    platform_only: True
    guard: 'C++2b模式下rename()需显式包含<cstdio>'
