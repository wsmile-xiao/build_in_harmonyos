# test_package/MANIFEST.yml
# 上游官方测试声明文件 — kysdk-ai-common/1.1.0.1

package: kysdk-ai-common/1.1.0.1
homepage: "https://gitee.com/openkylin/kysdk-ai-common"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# R51 三步法清点证据（tag upstream/1.1.0.1，commit 8e1950b9）：
#   1. `find . -iname '*test*' -not -path './.git/*'` -> 无结果
#   2. `ls tests` -> "ls: tests: No such file or directory"
#   3. CMakeLists.txt 无 enable_testing()/add_test()
# 结论：上游确无测试（0 个测试用例），test_package 消费者测试为唯一实质验证。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 上游 N=0（无测试套件），按 rule8 补全鸿蒙特有测试；rule12 要求鸿蒙特有测试 ≥ 1。
test_package_tests:
  - file: test.cpp
    type: 鸿蒙特有测试
    count: 3
    passed: 3
    description: "消费者测试: 链接 KysdkAiCommon::KysdkAiCommon, 校验枚举值与 is_ai_subsystem_inited() 在未初始化进程返回 false（3 断言，conan create 内嵌 ctest 实测 3/3 通过）"
    command: "./test_kysdk-ai-common"

# 测试计数（上游 N=0；适配后仅鸿蒙特有测试 3 个断言）
test_counting:
  upstream_independent_total: 0
  integration_independent_total: 0
  harmony_specific_total: 3

# 测试断言总数 (近似值)
assertion_count: 3
