  notes: >-
    KF6 6.14.0 closure chosen deliberately: kio/6.14.0, ktextwidgets/6.14.0 and
    kxmlgui/6.14.0 pin the whole framework graph to one consistent 6.14.0 line
    with no overrides (all 13 frameworks published on ohpcd, R36/PF4 verified
    via conan download --only-recipe). Journald and Audit stay optional and
    absent on OHOS (custom FindJournald/FindAudit probes find neither
    systemd sd-journal nor libaudit; HAVE_JOURNALD/HAVE_AUDIT undefined, the
    modes/* journald directory - the only QtConcurrent consumer besides the
    buildable core - is not compiled).

