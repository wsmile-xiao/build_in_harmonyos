  upstream: "4/4 passed (100%): the 26.04.0 tarball registers 4 ctest entries via ecm_add_tests in autotests/CMakeLists.txt (logModeFactoryTest, systemAnalyzerTest, kernelAnalyzerTest, kioLogFileReaderTest). Built on-device with BUILD_TESTING=ON and run via ctest: logModeFactoryTest Passed 0.07s, systemAnalyzerTest Passed 8.15s, kernelAnalyzerTest Passed 0.10s, kioLogFileReaderTest Passed 0.08s - 100% tests passed, 0 tests failed out of 4. Full protocol in reports/test-report.md."
