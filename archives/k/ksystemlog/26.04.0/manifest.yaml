  package_id: "4b4a1271519cde81c4c981693ed5d816d2d2d414"

platform_adaptations:
  - "Qt6 PrintSupport removed from the REQUIRED component list (root CMakeLists.txt) and from ksystemlog_lib target_link_libraries (src/lib/CMakeLists.txt) via patch 0001: the published qtbase/6.11.1 builds Qt with FEATURE_printsupport=OFF and ships no Qt6PrintSupport module (algobox 1.1.1 / conducteo 5.0.2 precedent)"
  - "Print feature re-targeted to PDF export via patch 0002: LogViewExport::printSelection() now asks for a destination file and renders the selected log lines through QPdfWriter (QtGui) instead of QPrinter/QPrintDialog; QPdfWriter and QPrinter share the QPagedPaintDevice base, so print() only changes its parameter type; printPreview() (QPrintPreviewDialog, PrintSupport) routes to the same PDF export flow. The Print/Print-Preview menu actions keep working in PDF form (conducteo 5.0.2 precedent)"
  - "KF6 DocTools stays optional and absent (no patch needed): find_package(KF6DocTools) is not REQUIRED upstream, the KF6DocTools_FOUND branch (kdoctools_install(po) + doc/ handbook) is simply skipped; DocBook handbook is not a runtime requirement (kfourinline 26.04.0 / audiocd 26.04.3 precedent)"
  - "Journald and Audit modes stay optional and absent: cmake/FindJournald.cmake and cmake/FindAudit.cmake find neither systemd sd-journal nor libaudit on OHOS; HAVE_JOURNALD/HAVE_AUDIT undefined; modes/journald (the only non-buildable QtConcurrent consumer) is not compiled - Qt6Concurrent itself IS found (find_package CONFIG REQUIRED passes) and built in qtbase"
  - "KF_IGNORE_PLATFORM_CHECK=TRUE (KDE platform detection does not know OHOS)"
  - "KF_SKIP_PO_PROCESSING=ON (translation catalogs skipped; gettext msgfmt toolchain not needed for the smoke-verified deliverable; kfourinline 26.04.0 precedent)"
  - "Linker flags -Wl,-z,max-page-size=0x1000: default lld 0x10000 page size can place .dynsym/.dynstr into separate high-address RW LOAD segments which the OHOS musl loader refuses to mmap (audiocd 26.04.3 / kfourinline 26.04.0 precedent)"
  - "ECM_MODULE_PATH + conan_cmakedeps_paths.cmake written manually (qtbase/KF6 packages use cmake_find_mode=none)"

known_issues:
  - "ksystemlog is a GUI application: on a headless machine the smoke verification needs QT_QPA_PLATFORM=offscreen; full interactive use requires a display/launcher environment"
  - "Log modes that read OHOS-absent sources (journald binary logs, audit events, wtmp/lastlog via some analyzers) will show empty lists; the system/kernel/cron/apache/cups/samba file-based modes work against readable log files via KIO"
  - "Printing is exported to PDF (QPdfWriter) instead of driving a physical printer: the published qtbase has no PrintSupport (CUPS disabled); the Print and Print-Preview actions both produce a PDF file through a save dialog"

