# test_package/MANIFEST.yml
# Upstream and consumer test declaration for ksystemlog/26.04.0.

package: ksystemlog/26.04.0
homepage: https://invent.kde.org/utilities/ksystemlog

upstream_check_command: "grep -rn 'ecm_add_test' autotests/CMakeLists.txt"
upstream_test_in_build: true
upstream_test_command: "ctest (BUILD_TESTING=ON; exercised on-device during adaptation - see notes.md / reports/test-report.md)"

upstream_tests:
  - file: autotests/logModeFactoryTest.cpp
    source: ksystemlog-26.04.0.tar.xz
    description: "LogModeFactoryTest (QTest): verifies the log-mode factory creates the correct analyzer/factory pair for every built log mode (system, kernel, X.org, cron, acpid, apache, auth, daemon, xsession, postfix, cups, samba; journald/audit modes are optional and absent on OHOS)."
    command: "ctest -R logModeFactoryTest (on-device: Passed 0.07s)"
  - file: autotests/systemAnalyzerTest.cpp
    source: ksystemlog-26.04.0.tar.xz
    description: "SystemAnalyzerTest (QTest): verifies the system log mode analyzer parses syslog-format lines (date/timestamp, hostname, daemon, message fields) into LogLine models with correct log levels and normalized output."
    command: "ctest -R systemAnalyzerTest (on-device: Passed 8.15s)"
  - file: autotests/kernelAnalyzerTest.cpp
    source: ksystemlog-26.04.0.tar.xz
    description: "KernelAnalyzerTest (QTest): verifies the kernel log mode analyzer parses dmesg-format lines (timestamps, subsystem tags, log levels) into LogLine models."
    command: "ctest -R kernelAnalyzerTest (on-device: Passed 0.10s)"
  - file: autotests/kioLogFileReaderTest.cpp
    source: ksystemlog-26.04.0.tar.xz
    description: "KioLogFileReaderTest (QTest): verifies the KIO-based log file reader loads log files asynchronously and emits linesRead/readFinished signals with correctly split and ordered lines (exercises the full KIO core + KArchive stack)."
    command: "ctest -R kioLogFileReaderTest (on-device: Passed 0.08s)"

test_package_tests:
  - file: test_package/test.sh
    description: "Runtime smoke of the shipped executable: (1) ksystemlog --version prints the 'ksystemlog 26.04.0' version string and exits 0 (QCommandLineParser/KAboutData handle --version before GUI creation, QT_QPA_PLATFORM=offscreen keeps it headless-safe); (2) ksystemlog --help prints the usage banner ('System Logs Viewer by KDE') and exits 0, exercising the full KAboutData/KXmlGui command-line initialization path."
    command: "conan create (test_package runs test.sh against the installed bin/ksystemlog)"

assertion_count: 6
