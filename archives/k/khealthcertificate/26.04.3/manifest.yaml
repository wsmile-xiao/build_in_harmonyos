knowledge_gained:
  - "KHealthCertificate 26.04.3 exports the KHealthCertificate CMake package and target; it needs Qt6 Core/Network/Qml/Test, KF6 Archive/Codecs/I18n (I18nLocaleData for KCountry)."
  - "The icaovds autotest needs iso-codes JSON data (KCountry reads iso_3166-1.json via QStandardPaths GenericDataLocation): stage the iso-codes package share tree via XDG_DATA_DIRS at test time (tool_requires, keeps package_id clean)."
  - "The nlcoronacheck autotest needs QTimeZone(\"Europe/Amsterdam\") to be valid: OHOS has no /usr/share/zoneinfo, so TZDIR/QT_ZONEINFO point at the tzdata/2026.3 package zoneinfo tree (kcalendarcore 6.26.0 precedent)."
  - "Upstream does not install() the health-certificate-decode development CLI (src/cli has no install rules); the package is a pure library + QML plugin."
