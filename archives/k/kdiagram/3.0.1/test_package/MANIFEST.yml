# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kdiagram/3.0.1.

package: kdiagram/3.0.1
homepage: https://invent.kde.org/graphics/kdiagram

upstream_check_command: "grep -rn 'ecm_add_test' --include='CMakeLists.txt' qtests/ src/KGantt/test/"
upstream_test_in_build: true
upstream_test_command: "conan create (BUILD_TESTING=ON runs ctest over the 23 registered ecm_add_test targets)"

upstream_tests:
  - file: qtests/*/main.cpp
    source: kdiagram-3.0.1.tar.xz
    description: "19 KChart QTests (AttributesModel, AxisOwnership, BarDiagrams, CartesianDiagramDataCompressor, CartesianPlanes, ChartElementOwnership, Cloning, DrawIntoPainter, Legends, LineDiagrams, Measure, Palette, ParamVsParam, PieDiagrams, PolarDiagrams, PolarPlanes, QLayout, RelativePosition, WidgetElementOwnership) registered via ecm_add_test under BUILD_TESTING + Qt6Test_FOUND."
    command: "ctest (QT_QPA_PLATFORM=offscreen)"
  - file: src/KGantt/test/*.cpp
    source: kdiagram-3.0.1.tar.xz
    description: "4 KGantt unit tests (KGanttConstraint, KGanttConstraintModel, KGanttMultiItems, KGanttView) registered via ecm_add_test under BUILD_TESTING + Qt6Test_FOUND."
    command: "ctest (QT_QPA_PLATFORM=offscreen)"

test_package_tests:
  - file: test_package/main.cpp
    description: "Consumer-side verification: (1) find_package(KChart6)/find_package(KGantt6) through the installed config files (bare imported target names — upstream install(EXPORT) has no NAMESPACE) — the exact mechanism eventviews (KDE PIM) uses to link KChart; (2) KChart::Chart + BarDiagram over a QStandardItemModel rendered offscreen into a QImage with a non-empty-content assertion; (3) KGantt::View + ConstraintModel API exercise (setModel/setConstraintModel/round-trip)."
    command: "conan create (test_package builds and runs kdiagram_consumer_test via cmake.test)"

assertion_count: 23
