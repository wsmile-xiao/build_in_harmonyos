dependencies:
  required:
    - qtbase/6.11.1
    - qtsvg/6.11.1
  build:
    - ecm/6.26.0
  optional: []
patches_applied:
  - patches/0001-ohos-drop-printsupport.patch
test_results:
  type: see notes
  upstream: "23/23 passed (100%) on the local arm64 OHOS runner via BUILD_TESTING=ON + ctest (ecm_add_test full-tree count: 19 KChart qtests + 4 KGantt tests); log line: '100% tests passed, 0 tests failed out of 23'"
  test_package: "consumer test 1/1 passed (100%): find_package(KChart6)/find_package(KGantt6) installed configs + KChart::Chart/BarDiagram offscreen render + KGantt::View/ConstraintModel API exercise"
knowledge_gained:
  - "kdiagram 3.0.1 is Qt6-generation (QT_REQUIRED_VERSION 6.5.0, ECM >= 5.245 only, no KF6 framework links) — the Qt5 dependency line in the task metadata was a platform metadata error."
  - "The published qtbase/6.11.1 line has PrintSupport=OFF; kdiagram's KGantt carries upstream HAVE_PRINTER guards (kganttgraphicsscene.cpp:36-44) so -DQT_NO_PRINTER turns every printing entry point into a no-op with the API surface preserved — no hand-written no-op bodies needed for the library itself (unlike the kgraphviewer 26.04.0 patch set)."
