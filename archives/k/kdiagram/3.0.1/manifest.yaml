description: "KDE charting libraries: KChart (Cartesian/Polar/Ternary charts) + KGantt (Gantt scene/view toolkit), Qt6/KF-free ECM-only edition (3.0.1, dependency of eventviews)"
homepage: https://invent.kde.org/graphics/kdiagram
