# 版本级 manifest — klick 0.12.2
# 文件位置: archives/k/klick/0.12.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（字段表见 knowledge/ARCHIVE-SPEC.md §4.2；CI 不读此文件，仅人读交叉校验）
# 交叉校验基准: 本文件的 source / patches_applied / build 段与 conandata.yml、
#               conanfile.py 逐字对齐；出现不一致时以 conandata.yml 为准（它是 CI 的实际输入）。

version: "0.12.2"

software: "klick"

# 编译状态：knowledge/ARCHIVE-SPEC.md §3（第 251—258 行）只给四态。
# 时间层一（写于 W3 跑绿之前）：本行曾是 pending_ci，因为 published（255）与
# built（256）的触发条件都写明需 conan_verify PASS，而当时 W3 从未 PASS（构建
# 准入门长期红：MemAvailable 5.3~5.9GB < 6000MB）；failed（257）＝断言编译失败、
# archived（258）＝断言被新版本取代，两者都不是事实，故按仓内既有先例值
# （abiword-plugin-* / alicloud 同口径：CI 验证前不预标 built）取 pending_ci。
# 时间层二（现值依据）：conan-verify 已判 PASS 且 conan create 未向 ohpcd 上传，
# 正好落在第 256 行 built 的触发条件上 ⇒ 本行由 finish 收尾改写为 built；软件级
# ../manifest.yaml 同步改写（该文件不由 finish 维护，本轮人工对齐，见 notes.md）。
status: built

# build_date 是配方与四枚补丁完成并推送到 feat/klick-0.12.2 的日期；W3 跑绿与
# finish 收尾发生在同一自然日，精确判决时间以文末框架块与 reports/ 内读数为准。
build_date: "2026-09-26"
build_system: scons
conan_ref: "klick/0.12.2"

# ============================================================
# 源码信息（与 conandata.yml 逐字一致；R39/PF7：只用官方直链）
# ============================================================

source:
  url: "https://das.nasophon.de/download/klick-0.12.2.tar.gz"
  sha256: "1289533c0849b1b66463bf27f7ce5f71736b655cfb7672ef884c7e6eb957ac42"
  tar_format: tar.gz

# ============================================================
# 构建配置（与 conanfile.py 一致）
# ============================================================

build:
  system: scons
  # 构建命令行 = KLICK_DEPFLAGS="…" CC=<profile c> CXX=<profile cpp>
  #             python3 -m SCons --jobs=2 OSC=0 RUBBERBAND=0 PREFIX=/
  # PREFIX=/ 与 package() 的 DESTDIR=<package_folder> 合起来把安装压到包根；
  # OSC / RUBBERBAND 关闭的原因见下方 knowledge_gained 与 notes.md。
  configure_options:
    - "OSC=0"
    - "RUBBERBAND=0"
    - "PREFIX=/"
  # conanfile.py requirements() 的四个精确依赖（W0 preflight 实测全部已发布）；
  # 构建器 scons==4.10.1 由 generate() 从 PyPI 装进独占隔离前缀，不是 Conan 依赖。
  dependencies:
    - boost/1.84.0
    - jack/1.9.22
    - libsndfile/1.2.2
    - libsamplerate/0.2.2
  cc: clang
  cxx: clang++

# ============================================================
# 应用的补丁列表（顺序与 conandata.yml 的 patches: 一致）
# ============================================================

patches_applied:
  - "0001-source-SConstruct.patch"
  - "0002-source-SConstruct-scons4-compat.patch"
  - "0003-source-constexpr-static-float.patch"
  - "0004-source-tempomap-literal-space.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游顶层只有 SConstruct（无 configure / CMakeLists.txt / Makefile.am），因此 make -n check、ctest -N、meson test --list 三条测试清点路径在本包都不存在；上游 0.12.2 无任何自动化测试（静态合计 0） knowledge_ref: notes.md:84「上游静态测试合计」（三条清点依据与 test_package/MANIFEST.yml 的 upstream_tests 同源）；仓内无同类条目，判据另见 notes.md:74「知识检索口径」"
  - "SCons 4 删除 Options / PathOption / BoolOption 旧拼法，且不再把命令行 NAME=value 隐式写进 Environment ⇒ 必须迁到 Variables/PathVariable/BoolVariable 并显式传 ARGUMENTS（补丁 0002） knowledge_ref: notes.md:31「上游 SConstruct 在 SCons 4 下语义不」；落点 patches/0002-source-SConstruct-scons4-compat.patch 的删除行 opts = Options('scache.conf') 与 opts.AddOptions(...)"
  - "SCons 只在 Environment() 构造点认编译器：命令行 CXX=… 实测只进 ARGUMENTS、进不了 Environment ⇒ CC/CXX 改由 os.environ 传（补丁 0002 的另一半），编译器仍取自 Conan profile 的 tools.build:compiler_executables（R33，键 c 与 cpp） knowledge_ref: notes.md:43「把编译器用命令行传给 SCons」（对 SCons 4.10.1 的逐项实测）；落点 0002 在 Environment() 构造处取 os.environ 的 CC/CXX"
  - "手写构建命令行（SCons/自研 make）不经过 CMakeToolchain / AutotoolsToolchain 生成器，因此依赖在 cpp_info 与 components 上声明的编译宏必须自己转发：boost/1.84.0 声明在 boost_headers 上的 BOOST_SP_NO_PTHREAD_SETCANCELSTATE 少了它，就会在 OHOS（libc 头不声明 pthread 取消 API）报 pthread_setcancelstate 未声明 knowledge_ref: notes.md:28「use of undeclared identifier」；落点提交 18edb788f9（_depflags 转发依赖 cpp_info 与 components 的 defines）。同源根因参照 E507，但其方法（CMake 侧 Threads 符号探测）未复用，本包走手写命令行转发"
  - "clang 把 non-integral 静态数据成员的类内初始化判 error（g++ 当 GNU 扩展放过）：src/metronome_map.hh 的 TICKS_PER_BEAT 与 src/metronome_simple.hh 的 MAX_TAP_AGE、TAP_DIFF 改 static constexpr 即可，值与类型不变（补丁 0003，可移植、非鸿蒙专属） knowledge_ref: notes.md:29「in-class initializer for sta」；落点 patches/0003-source-constexpr-static-float.patch。仓内无对应条目（knowledge/doc 内 grep in-class initializer 零命中），不新造编号"
  - "C++11 词法把紧挨标识符的字符串字面量读成 user-defined string literal：src/tempomap.cc 用 15 处 「…」紧跟 REGEX_XXX 的拼接，clang 直接判 error（invalid suffix on literal），g++ 当扩展折叠 ⇒ 一律在字面量与宏名之间补一个空格（补丁 0004，纯空白改动，拼出的正则逐字不变） knowledge_ref: notes.md:189「### 对话 #3」（词法阶段定性与空白等价性证据）；落点 patches/0004-source-tempomap-literal-space.patch。仓内无对应条目（knowledge/doc 内 grep suffix on literal 零命中），不新造编号"
  - "上游用 pkg-config 探测 jack / samplerate / sndfile，并把 HAVE_SNDFILE_OGG 挂在 pkg-config --atleast-version 上：交叉环境无系统 .pc 库可探且环境变量传参不生效（E075）⇒ 换成 KLICK_DEPFLAGS 注入槽 + 显式 LIBS + 无条件定义 HAVE_SNDFILE_OGG（E151 手工补 have-defines 同族） knowledge_ref: 命中 E075 与 E151。E075（env-var-remove）的机制＝C_INCLUDE_PATH / LIBRARY_PATH 会被 pkg-config 当系统头文件路径而从 --cflags 里过滤掉匹配的 -I，本包据此把依赖信息移出探测链、由 Conan 逐条显式给 -I / -L / -D（比其原方案 unset + 铺 PKG_CONFIG_PATH 更进一层，因交叉环境无系统 .pc 库可探）；E151（manually-add-have-defines）复用其手工补 HAVE_* 定义的方案，定义点由 config.h 换成 SCons 命令行 -D。展开见 notes.md:183「### 对话 #2」"
  - "OHOS 上没有 /bin/sh：配方在 generate() 内把 SCons.Platform.posix 的 SHELL 由 sh 改成 /system/bin/sh（E165 同族），且一次性在 generate 做完而非 build 内（R33） knowledge_ref: 命中 E165（shebang-fix，复用其 /bin/sh -> /system/bin/sh 改法，本包改写的是 SCons.Platform.posix 的 SHELL 而非脚本 shebang）；落点 conanfile.py 的 generate()"
  - "conan 的 build()/package() 以 build_folder 为 cwd，所以 SCons 这类「从顶层构建文件向上找」的构建器不能套 layout 布局 helper（gpsd/3.26 同款结论） knowledge_ref: notes.md:21「刻意不套任何 layout 布局 helper」；同族先例＝仓内 archives/g/gpsd/3.26 的 SCons 隔离前缀与不套 layout 写法"
  - "SCons 以命令行做构建缓存键：package() 必须复用 build() 里逐字相同的 CC/CXX 与 KLICK_DEPFLAGS，否则所有目标被判过期并在 package() 内全量重编 knowledge_ref: notes.md:19「两处命令行必须逐字一致」（build() 与 package() 两处命令行逐字一致的约束）"
  - "可选功能面按依赖发布态裁剪，而非按上游能力裁剪：liblo 与 rubberband 经控制组实证在 ohpcd 未发布（同一 CONAN_HOME/remote 下 boost/1.84.0 与 jack/1.9.22 正常返回 recipe revision，而两者与故意写的不存在 ref 返回同一条 system acceleration policy not enabled）⇒ 走上游自带开关 OSC=0 / RUBBERBAND=0；RUBBERBAND 上游默认即 False，TERMINAL 与 DEBUG 保持上游默认 knowledge_ref: notes.md:57「经**控制组实证**判定为 ohpcd 制品仓未发布」；恢复条件见同节，落盘副作用登记见 notes.md:200「不覆盖 `*.so.N`」"
  - "无 jackd、无真实音频设备的 OHOS 沙箱里，消费者断言只能也只需压在 server-free 路径上：3 条真断言（可 exec 证明动态依赖闭包解析、-V 证明版本横幅与退出码、-h 证明 Usage 块与退出码）共 5 个断言点，同 jack/1.9.22 的 without requiring a running jackd server 口径 knowledge_ref: notes.md:96「3 条用例共 **5 个断言点**」；同族口径＝仓内 archives/j/jack/1.9.22 的 test_package/MANIFEST.yml「without requiring a running jackd server」，判决原文见 notes.md:119「## 验证结果」"
  - "recipe-search 的「无相似配方（语料 6174 条）」是知识库语料检索结论，不能当 ohpcd 发布态判据；W0 一律以 preflight_check.sh 与精确 ref 查询为准 knowledge_ref: notes.md:74「知识检索口径」；落点判据＝preflight_check.sh klick/0.12.2 与精确 ref 查询，另见 notes.md:177「### 对话 #1」"
