# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: klick/0.12.2
homepage: "https://das.nasophon.de/klick/"

# 上游测试命令：klick 0.12.2 用 SCons 构建，顶层只有 SConstruct（无
# configure / Makefile.am / CMakeLists.txt），因此 make -n check、ctest -N、
# meson test --list 三条清点路径都不存在。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清点（R51）：上游 0.12.2 无任何自动化测试。
# 证据（对 sha256 1289533c0849b1b66463bf27f7ce5f71736b655cfb7672ef884c7e6eb957ac42
# 官方 tarball 解包后逐条核对）：
#   1) 文件清单只有 COPYING / NEWS / README / SConstruct / doc/manual.html /
#      samples 下 8 个 wav / src 下 16 个 cc 与 17 个 hh / src/util 下 7 个 hh 加
#      util.cc，无 test、tests 目录，也无任何以 test、check、spec 命名的文件；
#   2) SConstruct 的目标只有 env.Program('klick')、Default('klick') 与
#      env.Alias('install', [...])，没有 check/test 别名；
#   3) README 的构建说明只有 scons 与 scons install 两步，没有测试步骤。
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，调用已安装二进制）
test_package_tests:
  - file: test_klick.sh
    description: "打包工具冒烟测试：断言 bin/klick 存在且可执行（OHOS 下 .codesign 段或运行时依赖闭包不合法会在 execve 阶段直接 126/127）；跑 -V 断言打印版本横幅 klick 0.12.2 且退出码 0；跑 -h 断言打印 Usage: 块且退出码 0。后两者都走 Options::parse 的早期分支，不触碰 JACK 连接。"
    command: "sh test_klick.sh <package>/bin <test-build-folder>/smoke-out"

# 测试断言总数（实测，rule 4）
# 上游无自动化测试套件，上游测试用例数为 0；下列为 test_package 侧断言数。
assertion_count: 5
assertion_count_basis:
  upstream: 0
  test_package: 5
