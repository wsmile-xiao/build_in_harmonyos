# conandata.yml — klick 0.12.2
# Source: official upstream download page (R39/PF7). The Debian pool URL is
# never used; sha256 cross-checked against a verified local download.

sources:
  url: "https://das.nasophon.de/download/klick-0.12.2.tar.gz"
  sha256: "1289533c0849b1b66463bf27f7ce5f71736b655cfb7672ef884c7e6eb957ac42"

patches:
  - patch_file: "patches/0001-source-SConstruct.patch"
    patch_description: "Replace the SConstruct pkg-config probes with a KLICK_DEPFLAGS injection slot (Conan supplies every include/lib search path and every dependency-declared compile definition explicitly), keep the -l link list explicit, and define HAVE_SNDFILE_OGG unconditionally (Conan libsndfile ships vorbis/ogg)."
    patch_type: "portability"
  - patch_file: "patches/0002-source-SConstruct-scons4-compat.patch"
    patch_description: "Move the SConstruct onto the SCons 4 build-variable API (Variables/PathVariable/BoolVariable, plus an explicit ARGUMENTS hand-off, since SCons 4 no longer applies command-line NAME=value to the Environment) and take CC/CXX from the environment at Environment() construction time so the Conan profile compiler is the one that runs."
    patch_type: "portability"
  - patch_file: "patches/0003-source-constexpr-static-float.patch"
    patch_description: "Spell the three in-class float/double constants (MetronomeMap TICKS_PER_BEAT, MetronomeSimple MAX_TAP_AGE and TAP_DIFF) as static constexpr instead of static const with an in-class initializer. C++ requires constexpr for a non-integral static data member with an initializer; clang rejects the bare form (error: in-class initializer for static data member of type 'const double' requires 'constexpr' specifier) while g++ accepts it as a GNU extension. Values, types and all use sites are untouched, so no semantics change."
    patch_type: "portability"
  - patch_file: "patches/0004-source-tempomap-literal-space.patch"
    patch_description: "Spell every adjacency between a string literal and the REGEX_LABEL / REGEX_INT / REGEX_FLOAT / REGEX_PATTERN macro that follows it with a separating space (15 sites in src/tempomap.cc). C++11 lexes a string literal immediately followed by an identifier as a user-defined string literal, and clang rejects the reserved spellings outright (error: invalid suffix on literal) while g++ folds them as an extension. The change is pure whitespace: adjacent literals still concatenate into the very same regex, so no pattern text, type or use site is altered."
    patch_type: "portability"
