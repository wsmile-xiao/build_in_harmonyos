# 软件级 manifest — klick
# 文件位置: archives/k/klick/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（字段表见 knowledge/ARCHIVE-SPEC.md §4.1；CI 不读此文件，仅人读交叉校验）

software: klick
display: "Klick"
description: "命令行 JACK 节拍器：tempo map、节奏型语言与点击轨 WAV 导出"
category: audio
homepage: "https://das.nasophon.de/klick/"
license: GPL-2.0-or-later
build_system: scons

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "构建系统冷门：顶层只有一个 SConstruct（SCons），没有 configure / CMakeLists.txt / Makefile.am，因此 recipe-search 语料侧无同类先例（打印过「无相似配方（语料 6174 条）」）；该结论属知识库语料检索，⛔ 不是 ohpcd 发布态判据"
    - "SCons 4.10.1 由配方在 generate() 内 pip --target 装进本次构建独占的隔离前缀，再以 PYTHONPATH 交给 build()/package()（gpsd/3.26 同路数）：ohpcd 无 scons 配方，且这样 build() 内不再有网络动作"
    - "刻意不套任何 layout 布局 helper：conan 的 build()/package() 以 build_folder 为 cwd，布局 helper 会把源码与构建目录拆开，SCons 在空构建目录里向上找不到 SConstruct"
    - "OHOS 上没有 /bin/sh：generate() 内把 SCons.Platform.posix 的 SHELL 从 sh 一次性改成 /system/bin/sh（E165 同族的解释器路径修正）"
    - "依赖不走 pkg-config：上游 env.ParseConfig('pkg-config --cflags --libs jack samplerate sndfile') 在交叉环境既没有可靠的系统 .pc 库可探、环境变量传参也不生效（E075），一律换成 KLICK_DEPFLAGS 注入槽由 Conan 逐条显式给 -I / -L，链接表与 HAVE_SNDFILE_OGG 改为显式声明（E151 手工补 have-defines）"
    - "依赖在自己 cpp_info / components 上声明的编译宏必须自己转发进构建命令行（-D）：手写 SCons 不经过 CMakeDeps / AutotoolsToolchain 这类生成器，少转一个宏就会在 boost 头里报 pthread_setcancelstate 未声明（OHOS libc 头不声明 pthread 取消 API，boost 靠该宏打补丁并等消费者定义）"
    - "SCons 4 移除了 Options / PathOption / BoolOption 旧拼法、不再把命令行 NAME=value 隐式写进 Environment、编译器只在 Environment() 构造点认 ⇒ 迁到 Variables/PathVariable/BoolVariable + 显式 ARGUMENTS，CC/CXX 由 os.environ 给"
    - "clang 对 non-integral 静态数据成员的类内初始化判 error（g++ 当 GNU 扩展放过）⇒ 写法改 static constexpr，值与类型不变；这是同族可复用的一般性可移植修正"
    - "正则拼接的字符串字面量与宏名之间必须留空格：C++11 会把 「…」紧跟 REGEX_XXX 读成 user-defined string literal，clang 判 error 而 g++ 放过 ⇒ 补空白即可（补丁 0004），拼出的正则不变"
    - "可选功能面按依赖发布态裁剪：OSC（liblo）与 RUBBERBAND（rubberband，上游默认 False）用上游自带开关编译关闭，因两者在 ohpcd 未发布（控制组实证）；核心节拍器链路 JACK transport / tempomap+pattern / WAV 导出不受损，依赖发布后只需翻开关"
    - "运行级验证受限于沙箱无 jackd、无真实音频设备 ⇒ 消费者断言压在 server-free 路径（可 exec 的动态依赖闭包 + -V 版本横幅 + -h 用法块，均走 Options::parse 早期分支，不触碰 JACK 连接），细则见版本级 notes.md"
    - "validate() 只放开 os 为 Linux / OHOS，且 OHOS 仅 armv8"
  common_dependencies:
    - boost
    - jack
    - libsndfile
    - libsamplerate

