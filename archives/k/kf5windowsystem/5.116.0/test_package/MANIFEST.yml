package: kf5windowsystem/5.116.0
homepage: "https://invent.kde.org/frameworks/kwindowsystem"

upstream_check_command: "ctest --test-dir build --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/CMakeLists.txt
    source: kwindowsystem-5.116.0/autotests
    description: "KWindowSystem upstream CTest/autotests suite. X11 is switched off (CMAKE_DISABLE_FIND_PACKAGE_X11), so the two X11-gated kwindowsystem_unit_tests() blocks (12 targets) and the kwindowsystem_executable_tests() block (3 targets) are not configured at all; upstream registers exactly one CTest entry here, the unconditional ecm_add_test(kwindowsystem_platform_wayland_test.cpp)."
    command: "ctest --test-dir build --output-on-failure --no-tests=error"

upstream_test_inventory:
  framework: "Qt5::Test via CTest (QTest harness)"
  declared_test_targets: 1
  executed_test_targets: 1
  result: "1 registered, 1 pass. kwindowsystemplatformwaylandtest QSKIPs in initTestCase (QStandardPaths::findExecutable(\"weston\") is empty, so QProcess::waitForStarted() fails and the case calls QSKIP); ctest reports it as Passed. The remaining upstream test executables under tests/ (blurbehindtest, backgroundcontrasttest) are declared with add_executable + ecm_mark_as_test, which only sets EXCLUDE_FROM_ALL and registers no CTest test, so they are neither built nor run by the default build and ctest invocation."

adapted_tests:
  - file: test_package/test_kf5windowsystem.cpp
    origin: consumer-validation
    description: "C++ consumer test: links KF5::WindowSystem + Qt5::Gui under the offscreen QPA and asserts the dummy-backend behaviour — platform()==Platform::Unknown, isPlatformX11()/isPlatformWayland() false, a live KWindowSystem singleton with its meta object, showingDesktop()/allowedActionsSupported() false, setShowingDesktop() a no-op, and KWindowEffects::isEffectAvailable() false for BlurBehind and BackgroundContrast"
    command: "./test_kf5windowsystem"
  - file: test_package/test_kf5windowsystem_harmonyos.cpp
    origin: ohos-adaptation
    description: "HarmonyOS-specific test: requires __OHOS__, verifies uname reports HarmonyOS/OpenHarmony on aarch64, asserts the KWindowSystem class meta object is exported to consumers, and asserts OHOS claims neither the X11 nor the Wayland backend"
    command: "./test_kf5windowsystem_harmonyos"
  - file: test_package/test_kf5windowsystem_artifacts.py
    origin: ohos-adaptation
    description: "OHOS artefact checks on the installed package tree (15 assertions, pure stdlib, structured ELF header/section/dynamic reads only): exactly one real libKF5WindowSystem.so*, the .so devel link, ELFCLASS64/ELFDATA2LSB/EV_CURRENT, ET_DYN, EM_AARCH64, .text, .codesign, DT_SONAME present + prefixed libKF5WindowSystem.so + naming an existing file in lib/, and the installed KWindowSystem header and KF5WindowSystemConfig.cmake"
    command: "python3 test_kf5windowsystem_artifacts.py <package_folder>"

test_package_tests:
  - file: test_package/test_kf5windowsystem.cpp
    description: "Consumer validation of the KWindowSystem / KWindowEffects C++ API surface against the OHOS dummy backend"
    command: "./test_kf5windowsystem"
  - file: test_package/test_kf5windowsystem_harmonyos.cpp
    description: "HarmonyOS PC platform validation with __OHOS__, uname sysname/machine checks and the KWindowSystem link assertion"
    command: "./test_kf5windowsystem_harmonyos"
  - file: test_package/test_kf5windowsystem_artifacts.py
    description: "OHOS artefact validation of the installed lib/ + include/ + lib/cmake tree (ELF identity, DT_SONAME chain, .codesign, header and CMake package config)"
    command: "python3 test_kf5windowsystem_artifacts.py <package_folder>"

ohos_specific_tests: 9
ohos_specific_note: "5 assertions in test_kf5windowsystem_harmonyos.cpp (uname sysname/machine, meta object, no native backend) + 4 OHOS-specific artefact assertions (EM_AARCH64, .codesign, DT_SONAME present and naming a real file)"
assertion_count: 29
