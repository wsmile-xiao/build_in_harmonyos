knowledge_gained:
  - "KF5 kwindowsystem has no KWINDOWSYSTEM_X11 / KWINDOWSYSTEM_WAYLAND option (unlike the KF6 6.14/6.18/6.26 recipes): the platform is derived from X11_FOUND at the top level. CMAKE_DISABLE_FIND_PACKAGE_X11=TRUE makes both find_package(X11) calls (top level and autotests/) skip the search, so KWINDOWSYSTEM_HAVE_X11 is false and the always-compiled dummy backend (kwindoweffects_dummy.cpp + KWindowSystemPrivateDummy) serves every symbol - the same end state as the KF6 recipes with both backends off."
  - "autotests/ calls find_package(XCB COMPONENTS XCB ICCCM KEYSYMS) unconditionally (not REQUIRED); ECM's FindXCB.cmake only uses find_package_handle_standard_args, so a missing XCB stack is a silent not-found and no CMAKE_DISABLE_FIND_PACKAGE_XCB is required."
  - "ecm_mark_as_test() only sets EXCLUDE_FROM_ALL and registers no CTest test; ecm_add_test() does register one. So kwindowsystem 5.116.0 with X11 off contributes exactly 1 CTest entry (kwindowsystemplatformwaylandtest), which QSKIPs without weston, while the interactive GUI demos under tests/ (blurbehindtest, backgroundcontrasttest) are never built or run by the default target - no app.exec() hang risk and --no-tests=error is satisfied."
  - "ecm_install_po_files_as_qm(poqm) pulls in find_package(Qt5LinguistTools CONFIG REQUIRED); Qt5LinguistTools is not published to ohpcd, so the call is commented out by patch (same adaptation as the KF6 kwindowsystem recipes)."
  - "ecm_create_qm_loader(KF5WindowSystem kwindowsystem5_qt) configures <ECM_MODULE_DIR>/ECMQmLoader.cpp.in, so the recipe must export ECM_MODULE_DIR in addition to ECM_DIR/ECM_MODULE_PATH (ki18n5 pattern)."
  - "HarmonyOS is not mapped to the Linux CMake platform, so CMAKE_SHARED_LIBRARY_SONAME_<lang>_FLAG is undefined and the produced .so would lack DT_SONAME (CI L5 gate); set the soname flag plus CMAKE_PLATFORM_NO_VERSIONED_SONAME (expat/ki18n5 validated pattern)."
  - "The consumer must resolve Qt5 Gui/Widgets before importing KF5::WindowSystem: KF5WindowSystemConfig.cmake calls find_dependency(Qt5Gui 5.15.2) and find_dependency(Qt5Widgets 5.15.2), which the CMakeDeps-generated aggregated Qt5Config (cmake_file_name=Qt5 on qt5-qtbase) provides."
  - "KWindowSystem refuses to load a platform plugin without a QGuiApplication (pluginwrapper.cpp loadPlugin() bails with 'Cannot use KWindowSystem without a QGuiApplication'), so the consumer test runs a QGuiApplication on the offscreen QPA (QT_QPA_PLATFORM=offscreen + QT_QPA_PLATFORM_PLUGIN_PATH) and observes the dummy backend."
