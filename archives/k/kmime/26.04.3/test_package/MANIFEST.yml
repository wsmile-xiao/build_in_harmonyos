type: test_package
name: kmime
version: "26.04.3"
checks:
  - cmake_package_discovery
  - link_exported_library
  - runtime_mime_consumer

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: autotests/
    source: kmime-26.04.3/autotests/
    description: "KMime upstream QtTest suite: 13 autotest CTest targets from ADD_KMIME_TEST"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    condition: "run with BUILD_TESTING=ON"
  - file: tests/
    source: kmime-26.04.3/tests/
    description: "KMime additional CTest targets: test_mdn (built when getopt.h is available) and test_charfreq; both ran on HarmonyOS PC"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    condition: "run with BUILD_TESTING=ON; test_mdn is conditional on HAVE_GETOPT_H"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer assembles a KMime::Message and checks its decoded subject."
    command: "conan create (test_package builds and runs test_kmime)"

assertion_count: 3
