knowledge_gained:
  - "OHOS aarch64 lacks libatomic; hardware supports atomics natively, comment out -latomic link"
  - "Clang 15 OHOS requires typename for dependent type names (InMemHashIndex<T>::OwnedType etc.)"
  - "OHOS libc++ lacks std::ranges:: (C++20 partial), replace with std:: equivalents + begin/end"
  - "OHOS libc++ lacks std::erase_if/std::erase, use erase-remove idiom"
  - "simsimd dynamic dispatch (SVE/SVE2) incompatible with OHOS; rewrite as NEON-only stub"
  - "ohc-run.py init-build may timeout on large tarballs; use manual build context"
  - "CMake warns 'System is unknown to cmake' for HarmonyOS; non-fatal"

