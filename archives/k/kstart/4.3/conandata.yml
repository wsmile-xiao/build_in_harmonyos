# conandata.yml — kstart 4.3
# 源码: 官方 eyrie.org 发布包（Russ Allbery 的 kstart 归档）
# 补丁: 5 个，全部按 0001-0005 顺序经 git apply --check 验证

sources:
  url: "https://archives.eyrie.org/software/kerberos/kstart-4.3.tar.gz"
  sha256: "9527702a48789084e314e5c08d4115129467ca7ef25983d7214c9439d31ef2a6"

patches:
  - patch_file: "patches/0001-configure-umask-022.patch"
    patch_description: "configure umask 077 → 022：HarmonyOS HMDFS 上 mktemp/mkdir 产物权限 0770 导致 config.status 无法写入（E011/E082，与 krb5 1.22.1 0003 同根因）"
    patch_type: "portability"
  - patch_file: "patches/0002-config-guess-ohos.patch"
    patch_description: "build-aux/config.guess 增加 *:HarmonyOS:* 分支，识别 aarch64-unknown-linux-ohos（E007）"
    patch_type: "portability"
  - patch_file: "patches/0003-config-sub-ohos.patch"
    patch_description: "build-aux/config.sub 接受 linux-ohos triplet（E007）"
    patch_type: "portability"
  - patch_file: "patches/0004-fix-kafs-tests-krb5-cppflags.patch"
    patch_description: "tests/kafs 的 basic/haspag-t 缺少 KRB5_CPPFLAGS，交叉编译下 krb5.h 不可达导致 make check 编译失败；Makefile.am 与 Makefile.in 同步修改"
    patch_type: "bugfix"
  - patch_file: "patches/0005-port-perl-test-shebangs.patch"
    patch_description: "20 个 tests/ Perl 脚本 shebang /usr/bin/perl → /usr/bin/env perl（原 -w 脚本保留 warnings 语义），适配 HarmonyOS 无 /usr/bin/perl 的布局"
    patch_type: "portability"
