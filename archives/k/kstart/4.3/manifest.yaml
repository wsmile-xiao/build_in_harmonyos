# kstart 4.3 manifest
# 文件位置: archives/k/kstart/4.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.3"

# 软件名
software: "kstart"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://archives.eyrie.org/software/kerberos/kstart-4.3.tar.gz"

  # 源码校验和
  sha256: "9c9d05e75a788e4b789790a1e6473a7b3cd41a1aa5a372b52258d1d7087b8410"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--with-krb5-include=<conan krb5 package>/include"
    - "--with-krb5-lib=<conan krb5 package>/lib"
    - "LDFLAGS=-L<conan krb5>/lib -Wl,-rpath,<conan krb5>/lib"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "krb5/1.22.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-configure-umask-022.patch"
  - "patches/0002-config-guess-ohos.patch"
  - "patches/0003-config-sub-ohos.patch"
  - "patches/0004-fix-kafs-tests-krb5-cppflags.patch"
  - "patches/0005-port-perl-test-shebangs.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "rra-c-util autoconf snippets (m4/krb5.m4) 提供 --with-krb5-include/--with-krb5-lib，KRB5_CPPFLAGS/KRB5_LDFLAGS 直接指向 Conan krb5 包，绕开 krb5-config 探测"
  - "OHOS HMDFS 上 automake 并行构建触发 jobserver fifo EPERM（E074），make 需 -j1"
  - "config.guess 对 ohos 识别需补 aarch64-unknown-linux-ohos 三元组（E007），config.sub 同步放行"
  - "tests/runtests 依赖 perl 执行 TAP 测试，shebang 硬编码 /usr/bin/perl 需 port 为 /usr/bin/env perl（保留 -w 语义）"
  - "kafs 测试框架需要 KRB5_CPPFLAGS 注入（0004），Makefile.am 与 Makefile.in 需同步修改"
  - "k5start/krenew 的 usage() 对 -h 退出 0，裸调用退出 1；无 --version 长选项，冒烟测试需按此契约设计避免挂起"
