package: kstart/4.3

upstream_tests:
  framework: runtests (rra-c-util C TAP harness, tests/runtests over tests/TESTS)
  how_to_run: "make check (inside conan build())"
  summary: "29 test files / 187 executed assertions, all passing; 20 upstream-conditional skips (no keytab, no krb5.conf, AFS not available, fakeroot not available, author-only, docs)"
  source: tests/TESTS, tests/runtests, test-suite.log

ohos_specific_tests:
  - bin/k5start + bin/krenew are AArch64 ELF64 binaries
  - musl dynamic interpreter (/lib/ld-musl-aarch64.so.1) in PT_INTERP
  - RUNPATH points at the Conan krb5 libdir, no /usr/lib or /usr/local/lib leak
  - .codesign section present after binary-sign-tool self-signing (OHOS only)
  - -h prints usage and exits 0; bare invocation exits 1 (CLI contract)

notes: >-
  kstart is an application package (no library).  Smoke testing executes the
  installed binaries from package_folder only (not the build tree).  Upstream
  skips are preserved as SKIP per repo policy and are not counted as failures.
