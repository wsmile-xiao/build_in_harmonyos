package: kicad-library-footprints/10.0.5
homepage: "https://gitlab.com/kicad/libraries/kicad-footprints"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  The official 10.0.5 footprint repository is a resource-only CMake project
  whose CMakeLists.txt installs footprint files and fp-lib-table but defines no
  upstream test target. External KiCad library convention checks are not part
  of this source archive and are not reproducible as Conan package tests.
test_package_tests:
  - file: test_kicad_footprints.py
    description: >-
      Consumer validation of the installed fp-lib-table, every .pretty library,
      every .kicad_mod s-expression, truncated-file rejection, and the OHOS
      TMPDIR-specific negative test.
    command: "python3 -B test_kicad_footprints.py PACKAGE_FOLDER [--ohos]"
assertion_count: 15456
