knowledge_gained:
  - "kicad-footprints 10.0.5 是 project(kicad-footprints NONE) 的纯资源 CMake 工程，安装语义由上游 install(DIRECTORY) 和 install(FILES) 完整表达。"
  - "上游资源包含 155 个 .pretty 库和 15447 个 .kicad_mod 文件；fp-lib-table 与这些目录一一对应，适配包应保留 share/kicad/footprints 和 share/kicad/template 布局。"
  - "纯资源包不声明 application 或 commands.json；使用 package_type=unknown 和 cpp_info.resdirs=[\"share\"]，避免被命令行工具门禁误判。"
  - "HarmonyOS 专用消费者测试通过 TMPDIR 分支验证临时文件不落入只读 /tmp；测试配方使用 sys.executable 兼容 Windows 与 HarmonyOS 的 Python 命令名。"

upstream_test_pass_rate: "N/A（上游归档无 tests/、ctest/ 或 pytest 注册；GitLab CI 仅远程 include kicad-library-utils 的 footprint 检查）"
adapted_test_pass_rate: "100%（15,456/15,456：安装布局、许可证、库表映射、15,447 个 footprint s-expression、截断负向和 OHOS TMPDIR 测试）"
test_command: "conan create archives/k/kicad-library-footprints/10.0.5 --build=missing"
ohos_test_command: "python3 -B test_package/test_kicad_footprints.py PACKAGE_FOLDER --ohos"

license: "CC-BY-SA-4.0"
homepage: "https://gitlab.com/kicad/libraries/kicad-footprints"
description: "Official KiCad 10.0.5 footprint libraries as a HarmonyOS-compatible resource package"
