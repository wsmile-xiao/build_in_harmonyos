# 版本级 manifest — knowthelist 2.3.1
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.1"

# 软件名
software: "knowthelist"

# 编译状态
# published | built | failed | archived
# conan-verify 通过未 upload → built；发布后改 published
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: "qmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39: 官方源）
  url: "https://github.com/knowthelist/knowthelist/archive/refs/tags/v2.3.1.tar.gz"

  # 源码校验和（sha256sum 实测）
  sha256: "e674a537eb973f329292ed3b9c6030a50de1793282da2195db1f99db62594a6a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | qmake
  system: qmake

  # 配置选项列表
  configure_options: []
  # qmake 命令: qmake QMAKE_PKG_CONFIG=pkg-config src.pro
  # （qmake 交叉编译检测禁用 pkg-config，须显式 QMAKE_PKG_CONFIG=pkg-config）

  # 编译依赖列表（格式: name/version）
  dependencies:
  - qt/5.15.19
  - gstreamer/1.28.3
  - taglib/1.13.1
  - alsa-lib/1.2.16

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（探索阶段 R2: 不生成 .patch，本次无源码补丁；
# .qm 翻译由 build() 生成合法空文件，见 notes.md）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "qmake 交叉编译检测（无 sysroot）会禁用 pkg-config → 必须传 QMAKE_PKG_CONFIG=pkg-config | ref: E999"
- "conanfile generate() 中 save_script(\"conanbuild\") 覆盖 Conan 聚合 env 脚本导致自引用递归 SIGSEGV → 用 env.vars(self).apply() | ref: E999"
- "qt/5.15.19 制品包未随附 lrelease，TRANSLATIONS 的 .qm 需 build() 生成合法空 qm（Qt5 qm v3 头）| ref: knowthelist-2.3.1"
- "PkgConfigDeps 生成的 .pc 以包名命名（gstreamer.pc），src.pro 的 PKGCONFIG 需求 gstreamer-1.0 → 需生成 gstreamer-1.0.pc 别名 | ref: knowthelist-2.3.1"
- "make -jN 并行在 HMDFS 上 mkfifo 失败（Operation not permitted）→ 用 make -j1 | ref: E011"
- "运行时崩溃点：qt/5.15.19 无 QSQLITE 插件（plugins/sqldrivers 空），main.cpp:64 检查失败 → 应用无法启动（见 notes.md 证据链）| ref: knowthelist-2.3.1"
