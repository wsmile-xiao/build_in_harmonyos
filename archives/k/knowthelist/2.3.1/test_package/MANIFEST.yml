# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: knowthelist/2.3.1
homepage: "https://github.com/knowthelist/knowthelist"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（R51 清点：上游 2.3.1 无任何测试）
#   - 无 tests/ 目录、无 test/ 目录
#   - 无 QTest/QTEST 引用、无 QT += testlib
#   - Makefile 中 make check 为 qmake 默认空目标 (check: first)，无实际测试
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "可执行程序冒烟测试：offscreen 运行 knowthelist，验证二进制可执行并如实记录 main.cpp:64 QSQLITE 检查点行为（qt/5.15.19 无 QSQLITE 插件的已知运行限制）"
    command: "test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
