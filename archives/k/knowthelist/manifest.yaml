software: knowthelist
display: "knowthelist"
description: "Qt5 派对音乐播放器：DJ 模式/混合模式混音播放、曲库管理"
category: multimedia
homepage: "https://github.com/knowthelist/knowthelist"
license: LGPL-3.0
build_system: qmake

ohos_adaptation:
  key_points:
    - "qmake 交叉编译检测禁用 pkg-config，须传 QMAKE_PKG_CONFIG=pkg-config"
    - "qt/5.15.19 无 lrelease，.qm 翻译由配方生成合法空文件（界面回退英文）"
    - "PkgConfigDeps 生成 gstreamer.pc，需别名 gstreamer-1.0.pc 供 src.pro PKGCONFIG"
    - "make 并行在 HMDFS 上 mkfifo 失败，须 make -j1"
    - "运行时受 qt/5.15.19 无 QSQLITE 插件限制（main.cpp:64 检查失败，见 2.3.1/notes.md 证据链）"
  common_dependencies: [qt/5.15.19, gstreamer/1.28.3, taglib/1.13.1, alsa-lib/1.2.16]

versions:
  "2.3.1":
    status: built
    build_date: "2026-09-19"
