# test_package/MANIFEST.yml
# Upstream and consumer test declaration for ktuberling/26.04.0.

package: ktuberling/26.04.0
homepage: https://invent.kde.org/games/ktuberling

upstream_check_command: "grep -rn 'add_test\\|enable_testing\\|ecm_add_tests' --include='*.txt' --include='*.cmake' . | grep -v '^./po' || true"
upstream_test_in_build: false
upstream_test_command: "n/a - upstream registers no test suite (no tests/, autotests/ or add_test() in the 26.04.0 tarball)"

upstream_tests:
  - file: "(none)"
    source: ktuberling-26.04.0.tar.xz
    description: "No upstream test suite: the tarball contains no tests/, autotests/ or test/ directory and no add_test()/enable_testing()/ecm_add_tests() call in any CMakeLists.txt (grep -rn over the extracted sources returns nothing outside po/). Upstream QA for this module happens via KDE CI source builds (.kde-ci.yml requires-passing-tests-on: Linux/FreeBSD/Windows)."
    command: "n/a"

test_package_tests:
  - file: test_package/test.sh
    description: "Runtime smoke of the shipped executable: ktuberling --version prints the 26.04.0 version string and exits 0 (KAboutData::setupCommandLine handles --version before GUI creation, QT_QPA_PLATFORM=offscreen keeps it headless-safe)."
    command: "conan create (test_package runs test.sh against the installed bin/ktuberling)"

assertion_count: 2
