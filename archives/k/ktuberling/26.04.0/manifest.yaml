software: ktuberling
version: "26.04.0"
status: built
package_type: application
build_system: cmake
created_at: 2026-09-21
language: cpp
description: "KDE potato game (KTuberling) - Qt6/KF6 drawing game application built on KDEGames6/libkdegames"
homepage: https://invent.kde.org/games/ktuberling
upstream_source: https://download.kde.org/stable/release-service/26.04.0/src/ktuberling-26.04.0.tar.xz
source_sha256: 5a6f2ad4bf22755c890a5899bce54b3c76fe345da19da7806fd8be4708705150
license: "GPL-2.0-or-later AND GFDL-1.2-only"

dependencies:
  required:
    - qtbase/6.11.1
    - qtmultimedia/6.11.1
    - qtsvg/6.11.1
    - kconfig/6.18.0
    - kconfigwidgets/6.18.0
    - kcoreaddons/6.18.0
    - kcrash/6.18.0
    - kdbusaddons/6.18.0
    - ki18n/6.18.0
    - kwidgetsaddons/6.18.0
    - kxmlgui/6.18.0
    - kiconthemes/6.18.0
    - kio/6.14.0
    - libkdegames/26.04.0
  build:
    - ecm/6.26.0
  forced:
    - "karchive/6.18.0 (override=True: libkdegames 26.04.0 graph precedent)"
    - "kservice/kcolorscheme/kguiaddons/kitemviews/kjobwidgets/kwindowsystem/kauth/solid/kbookmarks at 6.18.0 (override=True: lift kio/6.14.0 internal requires onto the 6.18.0 closure; KF6 minor releases are forward-compatible, kio is rebuilt from its published recipe)"

patches_applied:
  - patches/0001-ohos-skip-kdoctools-printsupport.patch
  - patches/0002-ohos-guard-printsupport.patch

test_results:
  type: no_upstream_tests_consumer_verified
  upstream: "No upstream test suite: the 26.04.0 tarball contains no tests/, autotests/ or test/ directory and no add_test()/enable_testing()/ecm_add_tests() call in any CMakeLists.txt (grep -rn over the extracted sources returns nothing outside po/). Upstream QA for this module happens via KDE CI source builds (.kde-ci.yml requires-passing-tests-on: Linux/FreeBSD/Windows)."
  test_package: "passed: 1/1 runtime smoke assertion - ktuberling --version prints 'ktuberling 26.04.0' and exits 0 (KAboutData::setupCommandLine handles --version before GUI creation, QT_QPA_PLATFORM=offscreen headless-safe)."
  package_id: "efcf7d24850971715d7b0c04b13f5f8080bf46b5"

platform_adaptations:
  - "KF6 DocTools removed from the REQUIRED component list (patch 0001): kdoctools is not part of the published KF6 6.18/6.26 closure; doc/ subdirectory and kdoctools_install(po) are already guarded upstream by KF6DocTools_FOUND (kfourinline 26.04.0 precedent)"
  - "Qt6 PrintSupport removed from find_package/link and the print path guarded with __has_include(<QPrintDialog>) (patches 0001+0002): the ohpcd qtbase builds FEATURE_printsupport=OFF (conducteo 5.0.2 / algobox 1.1.1 precedent); only direct printing is lost, Save-as-Picture (QtGui QPagedPaintDevice) is untouched"
  - "kio/6.14.0 with internal requires overridden to the KF6 6.18.0 closure via consumer overrides (registry publishes kio 6.14.0/6.26.0 only; 6.26 conflicts with the libkdegames 6.18 exact pins)"
  - "KF_IGNORE_PLATFORM_CHECK=TRUE (KDE platform detection does not know OHOS)"
  - "KF_SKIP_PO_PROCESSING=ON (translation catalogs skipped; gettext msgfmt toolchain not needed for the smoke-verified deliverable)"
  - "karchive/6.18.0 override=True pin (libkdegames 26.04.0 graph precedent)"
  - "Linker flags -Wl,-z,max-page-size=0x1000: default lld 0x10000 page size can place .dynsym/.dynstr into separate high-address RW LOAD segments which the OHOS musl loader refuses to mmap (audiocd 26.04.3 precedent)"
  - "ECM_MODULE_PATH + conan_cmakedeps_paths.cmake written manually (qtbase/KF6 packages use cmake_find_mode=none)"
  - "7Zip stays optional and absent (libkdegames 26.04.0 precedent)"

known_issues:
  - "ktuberling is a GUI game: on a headless machine it needs QT_QPA_PLATFORM=offscreen for the --version smoke; full gameplay requires a display/launcher environment"
