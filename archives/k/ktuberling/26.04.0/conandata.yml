# conandata.yml - ktuberling 26.04.0

sources:
  url: "https://mirror.nju.edu.cn/kde/stable/release-service/26.04.0/src/ktuberling-26.04.0.tar.xz"
  sha256: "5a6f2ad4bf22755c890a5899bce54b3c76fe345da19da7806fd8be4708705150"

patches:
  "26.04.0":
    - patch_file: "patches/0001-ohos-skip-kdoctools-printsupport.patch"
      patch_description: "Drop KF6 DocTools from REQUIRED components (not in the published KF6 closure) and drop Qt6 PrintSupport from find/link (ohpcd qtbase builds FEATURE_printsupport=OFF); doc/ and kdoctools_install(po) stay guarded upstream by KF6DocTools_FOUND"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-guard-printsupport.patch"
      patch_description: "Guard QPrinter/QPrintDialog/filePrint/print action with QT_NO_PRINTER so the game builds (and loses only direct printing) without Qt PrintSupport; QPagedPaintDevice picture rendering (QtGui) is untouched"
      patch_type: "portability"
