version: "131.2.0"
status: published
build_date: "2026-05-29"

source:
  url: "https://api.github.com/repos/mborgerding/kissfft/tarball/131.2.0"
  sha256: ""
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"
    - "KISSFFT_TOOLS=0"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

notes: |
  首次编译 kissfft 到 OHOS 平台。
  kissfft 是纯数学运算库，无平台特定代码。
  使用 Makefile 构建，仅需指定 PREFIX。

  禁用工具构建（KISSFFT_TOOLS=0）以避免 libpng 依赖。
  核心库可用，满足 FFT 数学运算需求。

  预编译包: kissfft-131.2.0-ohos-aarch64.tar.gz (49KB)

  功能测试: 2026-05-29，全部通过
  - FFT正变换：正确提取频率成分
  - FFT逆变换：完美重建信号
  - 内存管理：稳定可靠
  - 支持多种FFT长度（8-1024）

  推荐使用静态编译方式（无需ELF签名）

# 测试验证（新增字段）
test_validation:
  test_date: "2026-05-29"
  test_method: "static_compile"
  test_result: "all_passed"
  test_report: "reports/test-report.md"
  tested_features:
    - "fft_forward_transform"
    - "fft_inverse_transform"
    - "zero_signal_handling"
    - "memory_allocation"
    - "multiple_fft_sizes"