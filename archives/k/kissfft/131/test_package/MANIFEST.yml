# test_package/MANIFEST.yml
# 上游官方测试声明文件（r02 修正版）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: kissfft/131
homepage: "https://github.com/mborgerding/kissfft"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C test testall && make -C test test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# ─── 独立上游用例（计入 source_declared_total / executed_passed_total）───
upstream_tests:
  - file: testcpp.cc
    source: kissfft-131/test/testcpp.cc
    description: "C++ 模板 kissfft<T> FFT 正/逆与参考 DFT 对比 RMSE（独立用例，5 种 DATATYPE 声明）"
    command: "./testcpp"
  - file: twotonetest.c
    source: kissfft-131/test/twotonetest.c
    description: "1D/2D 复数 FFT 自检 TwoToneTest（独立用例，按 DATATYPE 实例化）"
    command: "./st_<datatype>"
  - file: test_real.c
    source: kissfft-131/test/test_real.c
    description: "实数优化 FFT 自检（独立用例，按 DATATYPE 实例化）"
    command: "./tr_<datatype>"
  - file: kfc 自检 (tools/kfc.c, -DKFC_TEST)
    source: kissfft-131/tools/kfc.c
    description: "KFC 缓存分配器自检（独立用例，按 DATATYPE 实例化）"
    command: "./tkfc_<datatype>"
  - file: testkiss.py
    source: kissfft-131/test/testkiss.py
    description: "多维 FFT vs NumPy SNR（独立用例，py2->3 已修复）"
    command: "python3 testkiss.py"
  - file: test_vs_dft.c
    source: kissfft-131/test/test_vs_dft.c
    description: "FFT vs 朴素 DFT SNR（独立用例，float，未注册 Makefile 但已手动构建运行）"
    command: "./test_vs_dft"
  - file: compfft.py
    source: kissfft-131/test/compfft.py
    description: "KISS FFT 工具 vs numpy.fft 基线 SNR 对比（独立用例，r02 由 Numeric/FFTPACK 迁移到 numpy）"
    command: "python3 compfft.py -n <dims> -u ./kf_float"
  - file: fastfir.py
    source: kissfft-131/test/fastfir.py
    description: "快速卷积 vs 慢速卷积 SNR 对比（独立用例，r02 由 Numeric/FFT 迁移到 numpy）"
    command: "python3 fastfir.py -l 500 -n 128"

# ─── 基准/插件（非独立用例，不计入统计但必须单列）───
benchmarks:
  - file: benchkiss.c
    source: kissfft-131/test/benchkiss.c
    description: "FFT 计时基准（非断言；float/double/int16_t/int32_t 实跑通过；simd 架构互斥）"
    command: "./bm_kiss_<datatype> -x 1000 -n 512"
    count: 5
  - file: benchfftw.c
    source: kissfft-131/test/benchfftw.c
    description: "FFTW 对比基准（非独立用例；float/double/int16_t/int32_t 依赖 libfftw3f / libfftw3 已发布→r03 恢复构建运行通过；simd 架构互斥）"
    command: "./bm_fftw_<datatype>"
    count: 5
  - file: doit.c
    source: kissfft-131/test/doit.c
    description: "FFTW bench 插件（无独立 main，非用户用例，仅台账单列）"
    count: 1

# ─── 双口径统计（r02 修正版）───
# 口径：只有独立用户用例计入 source_declared_total / executed_passed_total；
#       基准（bm_kiss×5、bm_fftw×5）与无 main 插件（doit.c）不计入但单列。
source_declared_total: 20
configured_executable_total: 17
executed_passed_total: 17
failed_total: 0
uninstantiated_total: 3

statistics_note: |
  独立用例源码声明 20 = testcpp(1) + st×5 + tkfc×5 + tr×5 + testkiss(1)
    + test_vs_dft(1) + compfft(1) + fastfir(1)
  当前 OHOS aarch64 配置实例化 17（simd×3 为架构互斥分支：上游 -msse 仅 x86，
    aarch64 上 xmmintrin.h 报错，非缺依赖，单列未实例化）
  executed_passed_total = 17，失败 0
  全量通过率 = 17/20 = 85.0%（未实例化计入分母不计通过）
  当前配置可执行集合通过率 = 17/17 = 100%
  基准单列：bm_kiss 4/5 实跑通过（simd 互斥）；bm_fftw 4/5 恢复构建运行通过
    （r03：float 依赖 libfftw3f/3.3.10 已发布并恢复运行；double/int16_t/int32_t 依赖 libfftw3 已发布；simd 互斥）；doit.c 无 main
  逐项映射（源码声明→构建条件→构建目标→执行日志）见 reports/test-report.md 台账

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：kiss_fft_alloc/正变换/逆变换重建，验证 bin1 峰值与 max_err<1e-5"
    command: "./test_kissfft"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17