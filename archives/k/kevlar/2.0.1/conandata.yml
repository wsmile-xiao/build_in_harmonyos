# conandata.yml — kevlar 2.0.1

sources:
  url: "https://github.com/Aadv1k/kevlar/archive/refs/tags/v2.0.1.tar.gz"
  sha256: "47f5e3027f59cd364d011ba0aab36cfd275c27b032c94f511675198ca508993f"

patches:
  "2.0.1":
    - patch_file: "patches/0001-recipes-md2html.c.patch"
      patch_type: "portability"
      patch_description: "recipes/md2html.c calls md_parse() with 2 args but the function takes 3; pass offset=0 so `make all` compiles"
    - patch_file: "patches/0002-src-kevlar_rst_to_html.c.patch"
      patch_type: "portability"
      patch_description: "RST parser safety fixes: (1) getc() loop reads into plain char so EOF is unreachable on unsigned-char targets -> infinite loop; use int. (2) read loop bound by fileLength so EOF does not read uninitialized rows. (3) rst_is_para_only/rst_handle_equal guard line+/-1,+/-2 out-of-bounds on first/last lines. (4) init output buffers used with strcat"