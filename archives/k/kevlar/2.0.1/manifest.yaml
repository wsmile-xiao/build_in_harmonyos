  - "makefile 目标 md2html 硬编码 gcc 链接，CI 无 gcc 时需在 generate() 中提供 gcc->clang 包装并注入 PATH"
  - "getc() 循环用 char 接收返回值在 char 为 unsigned 的平台（如 OHOS arm64）永远无法等于 EOF(-1)，必须用 int 接收"
