# test_package/MANIFEST.yml
# 上游官方测试声明文件
# kevlar 2.0.1（纯 C 静态站点生成器，Makefile 构建）

package: kevlar/2.0.1
homepage: "https://github.com/Aadv1k/kevlar"

# 上游测试命令
# kevlar 的 makefile 无 check/test 目标（已核对 makefile：仅 kevlar/kevlar_win32/
# utils/rst2html/md2html/all/clean），上游 README v3 计划才提出引入单元测试。
upstream_check_command: "make check (makefile 无 check 目标，上游 2.0.1 未提供自动化测试)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 2.0.1 tag 无任何测试源文件（tests/ 目录、ctest、unittest 均不存在）；
# 全源码枚举：src/*.c + recipes/*.c + utils/*.c 均为实现文件，examples/example.rst
# 为 rst 示例。上游唯一功能验证路径为 CLI 手工使用（README: cd kevlar && make all
# && ./bin/kevlar help）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：真实运行 kevlar CLI（help/new/build 生成站点并校验 HTML），并运行 md2html/rst2html"
    command: "bash test.sh"

# 测试断言总数
assertion_count: 6