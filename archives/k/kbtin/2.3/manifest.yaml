# 版本级 manifest
# 文件位置: archives/k/kbtin/2.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.3"

software: "kbtin"

# published | built | failed | archived
status: built

build_date: "2026-09-27"
build_system: "cmake"
conan_ref: "kbtin/2.3"

source:
  url: "https://git.sr.ht/~kilobyte/kbtin/archive/v2.3.tar.gz"
  sha256: "11c566630fe2c16cfca893bbe6e922a7a7eece7cfd1d15c00e76791525e46288"
  tar_format: tar.gz

build:
  system: cmake

  configure_options:
    - "-DMCCP=ON"
    - "-DSSL=ON"
    - "-DCMAKE_INSTALL_DATADIR=res"
    - "-DCMAKE_INSTALL_MANDIR=res/man"
    - "-DCMAKE_SKIP_INSTALL_RPATH=ON"

  dependencies:
    - "libiconv/1.17.1"
    - "zlib/1.3.1"
    - "gnutls/3.8.10"

  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake 的 RPATH 变量机制在 HarmonyOS 交叉配置下整体静默失效：CMAKE_SYSTEM_NAME=HarmonyOS 时 CMake 4.1.2 找不到 Modules/Platform/HarmonyOS.cmake（其 Modules/Platform 只有 OHOS.cmake，内容仅 include(Platform/Linux)），平台模块未加载 ⇒ CMAKE_SHARED_LIBRARY_RUNTIME_C_FLAG 为空 ⇒ 即便 -DCMAKE_BUILD_RPATH=<依赖绝对 lib 目录> 已进命令行，link.txt 里 rpath 命中数为 0、readelf -d 只见 NEEDED 无 RPATH/RUNPATH。改把 -Wl,-rpath 直接写进 conan 的 extra_exelinkflags/extra_sharedlinkflags 后 RUNPATH 落地，上游 ctest 由 88 失败转为 90/90 全通过。"
  - "上游 ctest 的 89 条数据驱动用例经 tests/runtest.sh 以相对路径 ../KBtin 调用主程序 ⇒ 测试工作目录必须是 build/tests，安装树或别处执行会整批假失败。"
  - "runtest.sh 用 which valgrind 探测决定是否附加 --error-exitcode=1；本机 PATH 无 valgrind，判定口径保持上游默认（不因环境改变断言强度）。"
  - "HMDFS 新建文件默认 660：上游根目录 6 个脚本（get_version 在 configure 期被 execute_process 调用，make_commands/make_protos/a2html/help2ansi/fixmanual 在构建期）无执行位会让 configure 直接失败，配方在 build() 前显式补可执行位（E543 家族）。真机日志逐条命中：E543 chmod +x: get_version 等 5 条。"
  - "KBtin 把手册页 gzip 成 KBtin_help.gz 装到 DATA_PATH；配方须用 CMAKE_INSTALL_DATADIR=res 把它放进包的 res 目录，消费者测试按 cpp_info.resdirs 定位而非硬编码路径。"
  - "OHOS 上自装的可执行文件需 binary-sign-tool 自签后方可运行，package() 内对 bin/*.so 逐件 -selfSign 1。"
