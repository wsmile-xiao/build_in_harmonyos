package: kbtin
version: "2.3"
test_package:
  kind: consumer-behaviour      # application 包：运行已安装的二进制并逐字断言输出（AGENTS §10）
  driver: kbtin_behavior.py     # 由 conan test_package 以 python3 调起（无被测库可编，build() 为空）
  invocation: "KBtin -p -q <setup>  (驱动脚本内部调用形态同上游 tests/runtest.sh:9)"
  N_consumer: 6
  N_assertion: 6
  vectors_source: 官方件 tests/data/*.in/.out（逐字抄录，见驱动脚本 CASES 注释）
  extra_check: KBtin_help.gz 随包落地且 gzip 可解（实测解压 73669B，不是 stat）
  max_rss_mb: 64               # 预算值；实测消费者 6 条与 ctest 均为 KB 级驻留，远低于预算
upstream_tests:
  N_static: 90                 # 89 条 foreach(data/*.in) + 1 条 kbtree_itr
  N_registered: 90
  N_executed: 90               # create-210006.log: "100% tests passed, 0 tests failed out of 90"
  N_passed: 90
  N_skipped: 0
  runner: tests/runtest.sh(#!/bin/sh) + diff -u 全量输出比对
  env_dependent: valgrind 若被 which 命中则自动加 -q --error-exitcode=1；本机 PATH 实测无 valgrind，判定口径保持上游默认
  真机读数: 改前 88 failed / 2 passed（create-204630.log，RPATH 未落地）→ 改后 90/90 全通过（create-210006.log）
status: 真机复证完成（conan create 于 2026-09-27 全链路通过，消费者 6/6）
