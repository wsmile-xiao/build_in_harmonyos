# conandata.yml -- kimageannotator 0.7.2

sources:
  # Official upstream URL; the CI adds mirror fallback automatically
  # (do not hand-edit mirror prefixes). Upstream tags carry a "v" prefix
  # (v0.7.2 is the latest tag, released 2025-11-21).
  url: "https://github.com/ksnip/kImageAnnotator/archive/refs/tags/v0.7.2.tar.gz"
  sha256: "7eb593d975b1590a184354ef68dbc3c26479d58eaea00de461d73695176f623c"

patches:
  - patch_file: "patches/0001-image-compare-format.patch"
    patch_description: "AnnotationAreaTest: Qt >= 6.9 QTest compares QImage format strictly; AnnotationArea::image() exports Format_ARGB32_Premultiplied while pixmap.toImage() yields Format_RGB32 on the OHOS offscreen/raster platform. Convert both sides to a canonical format so the test keeps asserting content equality (upstream CI passes only on older Qt where QCOMPARE fell back to QImage::operator==, which converts formats). Test oracle intent unchanged: content equality, full 49-test suite still executed."
    patch_type: "portability"
  - patch_file: "patches/0002-clipboard-ownership.patch"
    patch_description: "Fix double free of the shared AnnotationItemClipboard: AnnotationTabWidget creates ONE clipboard and passes the same pointer to every tab's AnnotationArea while ~AnnotationArea deletes it, so a second tab (public addTab API) segfaults on teardown with a dangling vtable. Reproduced on HarmonyOS PC (aarch64) via the consumer test_package; platform independent latent upstream bug (still present on ksnip master). Fix: AnnotationTabWidget becomes sole owner (deletes it once), AnnotationArea no longer deletes the shared clipboard."
    patch_type: "bugfix"

# Other OHOS adaptation points need no patch:
# - X11: the UNIX find_package(X11 REQUIRED) branch resolves through the
#   in-repo libx11/1.8.13 + xorgproto/2025.1 packages (FindX11 cache variables
#   pinned in conanfile.py generate()); CapsLockStatusChecker keeps its
#   graceful no-display degradation (XOpenDisplay returns nullptr).
# - Export macro: KIMAGEANNOTATOR_LIB (CMakeLists L90) matches the header
#   check in KImageAnnotatorExport.h, so unlike kColorPicker 0.3.1 there is
#   no macro-mismatch quirk; on non-Windows both Q_DECL_EXPORT and
#   Q_DECL_IMPORT map to visibility("default") anyway.
