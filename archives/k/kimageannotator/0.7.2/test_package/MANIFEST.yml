condition: >-
  Device-native build (can_run) runs all of them in conanfile.py build() with
  ctest --output-on-failure -j1 under QT_QPA_PLATFORM=offscreen; 49/49 must pass.

# Tests bundled in test_package (consumer-perspective verification)
test_package_tests:
  - file: test_package/test_kimageannotator.cpp
    description: "Downstream contract + OHOS adaptation points: find_package(kImageAnnotator-Qt6 0.7.2 REQUIRED) + kImageAnnotator::kImageAnnotator link; offscreen QPA assertion; E077 re-signed shared lib real load with loadImage/image()/addTab/imageAt round trip; X11 adaptation probe (XOpenDisplay headless degradation, __linux__/__OHOS__ compile-time guard); loadTranslations() datadir smoke"
    command: "conan create (test_package: compile & run test_kimageannotator)"

# Approximate total assertion count (quality estimate)
assertion_count: 12
