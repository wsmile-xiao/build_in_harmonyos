# test_package/MANIFEST.yml
# Upstream official test declaration file
# The CI script (build_and_test.sh L0e) requires this file to exist

package: kimageannotator/0.7.2
homepage: https://github.com/ksnip/kImageAnnotator

# Upstream test command -- kImageAnnotator upstream uses CTest for tests/
# (49 add_test() calls in tests/CMakeLists.txt; upstream CI runs the suite
# with xvfb-run, the no-display mirror of the offscreen QPA used here)
upstream_check_command: "ctest --output-on-failure"

# Whether the upstream tests are integrated into conanfile.py build()
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"

# Upstream test executables actually run (one per tests/CMakeLists.txt
# UNITTEST_SRC entry; each links GTest::gmock + Qt6::Test + a rebuilt static
# copy of the sources + the shared libkImageAnnotator.so)
upstream_tests:
  - file: tests/annotations/core/AnnotationAreaTest.cpp
    description: "GTest+QTest: AnnotationArea core (image lifecycle, undo stack, tool switching)"
  - file: tests/annotations/core/AnnotationItemFactoryTest.cpp
    description: "GTest+QTest: annotation item factory creates items per ToolType"
  - file: tests/annotations/core/AnnotationPropertiesFactoryTest.cpp
    description: "GTest+QTest: annotation properties factory wiring"
  - file: tests/annotations/modifiers/AnnotationItemResizerTest.cpp
    description: "GTest+QTest: single item resize handles"
  - file: tests/annotations/modifiers/AnnotationMultiItemResizerTest.cpp
    description: "GTest+QTest: multi item resize handles"
  - file: tests/annotations/modifiers/AnnotationItemSelectorTest.cpp
    description: "GTest+QTest: item selection hit testing"
  - file: tests/annotations/modifiers/AnnotationItemModifierTest.cpp
    description: "GTest+QTest: combined modifier (resize/select/arrange) dispatch"
  - file: tests/annotations/modifiers/AnnotationItemArrangerTest.cpp
    description: "GTest+QTest: z-order arrangement of items"
  - file: tests/annotations/modifiers/AnnotationItemMoverTest.cpp
    description: "GTest+QTest: item movement"
  - file: tests/annotations/modifiers/resizeHandles/LineResizeHandlesTest.cpp
    description: "GTest+QTest: line resize handle geometry"
  - file: tests/annotations/modifiers/resizeHandles/RectResizeHandlesTest.cpp
