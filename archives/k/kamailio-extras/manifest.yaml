software: "kamailio-extras"
display: "Kamailio extras modules"
description: "Kamailio SIP 服务器 extras 模块集（31 个运行时加载模块 .so）"
category: "sip-server"
homepage: "https://www.kamailio.org"
license: "GPL-2.0-or-later"
build_system: makefile

ohos_adaptation:
  approach: "零补丁 + make 命令行变量注入平台差异（OS=harmonyos + extra_defs 宏集 + 依赖探测覆盖）"
  scope: "仅编译 31 个 extras 模块，不编译 kamailio 主程序（模块 .so 由 kamailio 运行时 loadmodule 加载）"
  deps:
    - "hiredis/1.2.0（cnxcc 构建期依赖，静态链入）"
    - "libevent/2.1.13（cnxcc 构建期依赖，**动态**：OHOS 侧该包仅发布 .so 且非系统同名库，由 conan 依赖链提供运行时 .so，部署需 LD_LIBRARY_PATH）"
  notes: "详细适配记录见 6.0.6/notes.md"

versions:
  "6.0.6":
    status: built
    conan_ref: "kamailio-extras/6.0.6"
    build_date: "2026-09-29"
