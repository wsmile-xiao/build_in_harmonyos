# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: kamailio-extras/6.0.6
homepage: "https://www.kamailio.org"

# 上游测试清点（R51 三步法，证据与逐项原因见 ../notes.md「上游测试」章节）：
#   - **官方源码包 kamailio-6.0.6_src.tar.gz（sha256 32e4290c…，与 conandata.yml 一致）
#     顶层不含 test/ 目录**（顶层为 src/utils/cmake/doc/etc/misc/pkg 等；包内匹配 test/
#     的路径仅 10 条模块级路径，如 src/modules/<mod>/test/）
#   - 本配方 R51 实测所用的 49 个 test/unit/*.sh **不在该源码包内**，系从源码包之外
#     另行获取的上游 6.0.6 测试树（获取命令未随归档留痕，属已知证据链缺口，如实标注）；
#     该测试树不参与构建、不入包（source() 只解压上述源码包，patches/ 为空）
#   - 无 make check 目标，无 ctest/pytest 注册（src/Makefile、CMake 均未注册测试）
#   - test/unit 脚本需先构建 kamailio 主程序（src/kamailio）与模块树，且多数脚本
#     依赖外部 SIP 工具 sipsak/sipp
#   - extras 31 个模块在 test/unit 中**无专属测试用例**（其覆盖面主要在模块自带
#     doc/ 与上游 CI 的 Smoketest）
#   - 实测（OHOS aarch64，kamailio 主程序由探索性构建树产出）：
#       49 项 = 2 通过（1.sh、9.sh）/ 38 跳过（脚本自检缺前置条件后自行 exit 0，分项加总 = 38：
#         sipp 15 + sipsak 6 + netcat 2 = 23 外部工具未安装；db_mysql 8 + db_postgres 2 +
#         db_berkeley/db_unixodbc/utils 各 1 = 13 模块不在构建子集；3.sh/24.sh = 2 DB 环境前置）/ 9 失败
#       9 项失败逐项原因（**非同一原因**）：
#         6 项（4/5/7/14/15/18.sh）= OHOS mkfifo(2) EPERM → jsonrpcs FIFO transport
#              初始化失败（平台限制，与 extras 模块无关）
#         3 项（6/8/10.sh）= 测试环境依赖：dialplan/db_mysql 不在本次构建子集；
#              utils/kamctl 的 python 工具链在该环境不可用
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: "在另行获取的上游测试树中，逐脚本执行 test/unit 下的 shell 脚本（需先构建 src/kamailio 主程序）— 该测试树不在官方源码包内、获取命令未随归档留痕，故此命令不可原样复现（证据链缺口，已如实标注）"

upstream_tests:
  - file: "test/unit/*.sh"
    count: 49
    description: >-
      上游 test/unit 套件（注：该测试树不在官方源码包内，系另行获取）；实测
      2 通过（1.sh、9.sh）/ 38 跳过（脚本自检缺前置条件后自行 exit 0，分项加总 = 38：
      外部工具未安装 sipp 15 + sipsak 6 + netcat 2 = 23；模块不在构建子集 db_mysql 8 +
      db_postgres 2 + db_berkeley/db_unixodbc/utils 各 1 = 13；DB 环境前置 3.sh/24.sh = 2）/
      9 失败（6 项 = OHOS mkfifo EPERM 平台限制；3 项 = 测试环境依赖缺失，均与 extras 无关）

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: check_extras_modules.py
    description: >-
      31 个模块产物检查（加载器同源语义）：模块齐全性 31/31；逐模块 ELF 身份
      （64-bit LE/ET_DYN/EM_AARCH64）、模块契约字段 exports->name 读取并与
      kamailio 期望名比对、依赖闭合（DT_NEEDED ⊆ 允许集合：libc.so，cnxcc 另允
      libevent.so）、无 RPATH/RUNPATH；cnxcc 依赖链入方式（hiredis 静态链入
      符号证据、无 libhiredis.so、动态依赖 ⊆ {libc.so, libevent.so}）；
      licenses/COPYING 随包
    command: "python3 check_extras_modules.py"

# 测试断言总数（check_extras_modules.py 中 check() 调用数）
assertion_count: 36
