# 版本级 manifest — kamailio-extras 6.0.6
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.0.6"
software: "kamailio-extras"
status: built
build_date: "2026-09-29"
build_system: makefile                # kamailio 经典 Makefile 体系（非 autotools/cmake）
conan_ref: "kamailio-extras/6.0.6"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.kamailio.org/pub/kamailio/6.0.6/src/kamailio-6.0.6_src.tar.gz"
  sha256: "32e4290c6813c9d0289abe9ec2de9138e12e0381179218a7fed374ad813ecc48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  scope: "31 个 extras 模块（不编译 kamailio 主程序）"
  configure_options:
    - "make cfg include_modules=\"auth_diameter auth_xkeys call_control … xprint\"（共 31 个，完整清单见本文件 build.modules，与 Alpine main/kamailio _mod_list_extras 逐项一致）"
    - "make modules modules=\"modules/auth_diameter modules/auth_xkeys … modules/xprint\"（共 31 个） -j1 extra_defs=\"见本文件 build.platform_defs\" HIREDISDEFS=… HIREDISLIBS=… LEVENTDEFS=… LEVENTLIBS=…"
  platform_defs: "-D_GNU_SOURCE -DHAVE_GETHOSTBYNAME2 -DHAVE_SCHED_YIELD -DHAVE_MSG_NOSIGNAL -DHAVE_MSGHDR_MSG_CONTROL -DHAVE_ALLOCA_H -DHAVE_TIMEGM -DHAVE_SCHED_SETSCHEDULER -DHAVE_IP_MREQN（共 9 项 = -D_GNU_SOURCE + 8 个 -DHAVE_*，与 conanfile.py PLATFORM_DEFS 逐项一致）"
  parallel_jobs: 1
  parallel_jobs_reason: "E525/E074：OHOS SELinux 禁止用户进程创建 FIFO，GNU make jobserver 靠 FIFO 传递令牌 → -j>1 有挂起/报错风险；与同族其余 10 个 kamailio-* 配方一致固定 -j1"
  modules:
    - auth_diameter
    - auth_xkeys
    - call_control
    - call_obj
    - cnxcc
    - dmq
    - dmq_usrloc
    - domainpolicy
    - file_out
    - influxdbc
    - log_custom
    - msrp
    - nosip
    - pdb
    - pvtpl
    - qos
    - rtjson
    - sca
    - seas
    - sms
    - ss7ops
    - sst
    - statsd
    - tcpops
    - timer
    - tmrec
    - tsilo
    - uac_redirect
    - xhttp
    - xhttp_rpc
    - xprint
  dependencies:
    - hiredis/1.2.0
    - libevent/2.1.13
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 上游 6.0.6 源码包原生识别 aarch64-unknown-linux-ohos；平台差异全部经 make
# 命令行变量表达（OS=harmonyos + extra_defs 宏集 + cnxcc 依赖路径覆盖），
# 未改动任何上游源文件/构建文件
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "kamailio 模块构建必须先 `make cfg`（生成 src/config.mak），否则报 No rule to make target 'cfg-defs'；`make modules modules='modules/a modules/b'` 列表形式可一次构建多个模块"
  - "OS=harmonyos 不在 Makefile.defs 的 linux/solaris/freebsd/darwin 任一分支 → HAVE_GETHOSTBYNAME2/HAVE_SCHED_YIELD 等平台探测宏全部缺失，core 头 resolve.h/sched_yield.h 直接 #error。解法：make 命令行 extra_defs 注入 linux 分支等价宏集（-D_GNU_SOURCE -DHAVE_GETHOSTBYNAME2 -DHAVE_SCHED_YIELD -DHAVE_MSG_NOSIGNAL -DHAVE_MSGHDR_MSG_CONTROL -DHAVE_ALLOCA_H -DHAVE_TIMEGM -DHAVE_SCHED_SETSCHEDULER -DHAVE_IP_MREQN），各宏符号已对照 OHOS SDK sysroot 头文件实证存在（musl 语义）"
  - "只编模块、不编 core 是 extras 包零补丁的关键：core/resolve.c 的 _res（HAVE_RESOLV_RES）与 core/lock_ops.h 的 union semun（HAVE_UNION_SEMUN）在 OHOS musl 头文件中无对应定义，仅编译 kamailio 主程序时才触发；模块只引用 core 提供的符号，不触碰这两条路径"
  - "cnxcc 模块 Makefile 用 pkg-config 探测 hiredis/libevent（CROSS_COMPILE 为空时），未命中回退 LOCALBASE；经 make 命令行直接覆盖 HIREDISDEFS/HIREDISLIBS/LEVENTDEFS/LEVENTLIBS（命令行变量优先于 Makefile 内部赋值）钉死到 conan 依赖包，构建机系统库无从劫持探测结果"
  - "kamailio 模块 .so 由主程序运行时 loadmodule（dlopen）加载，核心符号由主程序提供 → 模块脱离主程序无法独立 dlopen（实测 31/31 均因未定义 core 符号而无法加载）。消费者视角校验应走『加载器同源语义』：读模块导出结构 struct module_exports 首字段 char *name（kamailio 加载时正是读该字段注册模块），而非尝试独立 dlopen"
  - "对 ET_DYN 模块，exports->name 是指针字段且由 RELATIVE 重定位填充：lld 链接时字段内存中可能仍为 0，真值在 .rela.dyn 相应条目的 addend 中。自解析 ELF 读取该契约名时必须优先取重定位 addend，回退才读字段原始值"
  - "模块声明名不一定等于文件名：ss7ops.so 的导出名是 \"ss7\"（src/modules/ss7ops/ss7ops_mod.c:95），按文件名推断契约名会误判——校验表需记录此类上游事实"
  - "OHOS 平台 mkfifo(2) 返回 EPERM（errno=1）：jsonrpcs 模块 FIFO transport 不可用，实测错误链 jsonrpcs_fifo.c:72 Can't create FIFO: Operation not permitted (mode=432) → jsonrpcs_fifo.c:218/575 → jsonrpcs_mod.c:1250 mod_init 失败 → core/sr_module.c:1041 Error while initializing module jsonrpcs → 进程启动中止（退出码 255）"
  - "kamailio 启动/模块初始化错误默认写 syslog，stderr 静默（表现为『进程无输出即退出』）；排查需加 -E（日志转 stderr）才能看到真实错误链"
  - "31 个 extras 模块依赖闭合：30 个模块 DT_NEEDED 仅 libc.so；cnxcc 另有 libevent.so（OHOS 侧 libevent 包仅发布 .so，且 OHOS sysroot 与目标机 /lib 均无 libevent → 非『系统同名库』，按 R26 口径动态由 conan 依赖链提供；cnxcc.so 自身无 RPATH/RUNPATH，部署时经 LD_LIBRARY_PATH 定位）"
  - "cnxcc 的 hiredis 为静态链入（OHOS 侧 hiredis 包仅发布 libhiredis.a，redisConnect/redisCommand 已在 cnxcc.so 的 .dynsym 中定义，DT_NEEDED 无 libhiredis.so）——依赖链接形态由依赖包发布形态决定，判定『能否静态』须先看依赖包 lib/ 内容与系统是否同名"

