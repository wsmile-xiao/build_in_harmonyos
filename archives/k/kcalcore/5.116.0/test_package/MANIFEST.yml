version: 1
package: kcalcore/5.116.0
homepage: https://invent.kde.org/frameworks/kcalendarcore

tests:
  upstream:
    status: planned
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    source: "kcalendarcore-5.116.0/autotests/"
    expected:
      - testalarm
      - testattachment
      - testattendee
      - testcalfilter
      - testconference
      - testcustomproperties
      - testdateserialization
      - testduration
      - testevent
      - testincidence
      - testexception
      - testfilestorage
      - testfreebusy
      - testfreebusyperiod
      - testincidencerelation
      - testicalformat
      - testidentical
      - testjournal
      - testmemorycalendar
      - testperiod
      - testperson
      - testrecurtodo
      - teststartdatetimesfordate
      - teststatus
      - testtodo
      - testtimesininterval
      - testcreateddatecompat
      - testrecurrenceexception
      - testoccurrenceiterator
      - testreadrecurrenceid
      - incidencestest
      - loadcalendar
      - fbrecurring
      - readandwrite
      - testfb
      - testrecurprevious
      - testrecurrence
      - testrecurrencetype
      - testrecurson
      - testtostring
      - testvcalexport
      - testcalendarobserver
      - testicaltimezones
      - "data-driven RecurNext/RecurPrev/RecursOn/Compat/VCalIn entries (runsingletestcase.pl + diff against .ref snapshots)"
  package:
    status: planned
    source: test.cpp
    command: "./test_kcalcore"
    description: >-
      Drives the real public KCalendarCore API the way downstream KDE PIM
      consumers use it (MemoryCalendar + Event/Todo management, the
      ICalFormat toString/fromRawString round-trip through the libical-
      backed parser inside the packaged libKF5CalendarCore.so, VCalFormat
      vCalendar export) and asserts HarmonyOS-specific behaviour (R53):
      the packaged library carries the OHOS-required unversioned DT_SONAME
      and a DT_RUNPATH (E537 install-RPATH adaptation), parsed from the
      ELF dynamic section of the consumer-visible package path.

notes:
  - "kcalcore is a pure library package (libKF5CalendarCore.so plus its
     KF5CalendarCoreConfig.cmake / headers / pkg-config / .pri metadata);
     no commands.json is required (R38)."
  - "Upstream was renamed kcalcore -> kcalendarcore in the KF 5.68 cycle;
     the official 5.116.0 tarball is kcalendarcore-5.116.0.tar.xz (the
     kcalcore-5.116.0.tar.xz URL does not exist on download.kde.org). The
     recipe keeps the kcalcore package name registered by the platform
     task (#7770) while building those sources."
  - "Upstream tests are run from build() with ctest: 43 QTEST_MAIN unit
     executables plus 454 data-driven entries through
     autotests/runsingletestcase.pl (perl + diff against .ref snapshots).
     The libical relative-soname CWD staging, TZDIR/QT_ZONEINFO tzdata
     wiring and any run-excluded entry are documented in notes.md with the
     concrete reason."
