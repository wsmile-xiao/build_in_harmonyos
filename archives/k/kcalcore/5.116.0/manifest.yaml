knowledge_gained:
  - "Upstream kcalcore was renamed kcalendarcore during the KF 5.68 cycle: the official 5.116.0 tarball is kcalendarcore-5.116.0.tar.xz (download.kde.org serves the KF5 final line from the Attic area via 302; the kcalcore-5.116.0.tar.xz URL does not exist). The recipe keeps the kcalcore package name registered by the platform task while building those sources."
  - "kcalcore 5.116.0 needs NO KF5 framework dependency at all: the top-level CMakeLists only find_package()s ECM 5.116.0, Qt5 Core/Gui (Qt5Test for autotests) and LibIcal >= 3.0 (MODULE-mode cmake/FindLibIcal.cmake). The platform task card's libical/qt5-qtbase/kcoreaddons5/ki18n list overstates the graph: kcoreaddons5 and ki18n are not upstream requirements on this line."
  - "The KF5-line kcalcore 5.116.0 source is written against the libical 3.x C API: a full compile round against libical/4.0.1 produced 20 errors in icalformat_p.cpp/icalformat.cpp (libical 4.0 removed the icalrecurrencetype.by_* struct members, icalcomponent_new_clone, icalproperty_new_rrule/_exrule, and reshaped icalparameter_get_delegatedfrom to return icalstrarray*); the KF6 line (kcalendarcore 6.26.0) is the libical-4 consumer, this KF5 line needs libical3/3.0.20."
  - "libical3/3.0.20 is consumed through the project's MODULE-mode FindLibIcal.cmake and CMAKE_FIND_PACKAGE_PREFER_CONFIG must stay OFF: the config-mode LibIcalConfig.cmake shipped inside libical3 IS version-compatible with the find_package(LibIcal 3.0) request (3.0.20 >= 3.0, same major) and would shadow the MODULE finder while defining ical/icalss/icalvcal targets instead of the LibIcal target the project links. (kcalendarcore 6.26.0 could keep PREFER_CONFIG ON only because libical 4.0.1's same-major version file rejects the 3.0 request.)"
  - "libical3/3.0.20 ships OHOS relative sonames ('./libical.so'): the musl loader resolves DT_NEEDED entries containing a slash from the process CWD, so the libical libraries must be staged into <build>/autotests and <build> before ctest, and next to the test_package consumer binary (kcalendarcore 6.26.0 precedent, testevent 23/23). The ical/icalss/icalvcal core libs carry no glib runtime dependency (readelf: NEEDED only ./libical.so + libc.so; glib is only used by libical-glib.so, which this pure C++/Qt graph never loads)."
  - "The 454 data-driven upstream tests (RecurNext/RecurPrev/RecursOn/Compat/VCalIn) run through autotests/runsingletestcase.pl which shells out to diff; on the OHOS runner the perl package (tool_requires) goes on the ctest PATH and diff comes from the SDK /data/service/hnp/bin."
