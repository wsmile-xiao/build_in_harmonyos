# 版本级 manifest — kglobalaccel5 5.116.0
version: "5.116.0"
software: "kglobalaccel5"
status: published
build_date: "2026-09-21"
build_system: "cmake"

source:
  url: "https://download.kde.org/stable/frameworks/5.116/kglobalaccel-5.116.0.tar.xz"
  sha256: "f6dfaa2482c8a4dfc12ed40094fd120bd41c5053899d3f85c2ff6b8215659866"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DQT_MAJOR_VERSION=5"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DBUILD_RUNTIME=OFF"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_SHARED_LIBS=ON"
  dependencies:
    - "qt5-qtbase/5.15.2.2"
    - "qt5-qtdeclarative/5.15.2"
    - "ecm/6.26.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-guard-poqm-on-qt5linguisttools.patch (portability: KF5 tarball ships poqm/, ECMPoQmTools needs Qt5LinguistTools — guard with if(Qt5LinguistTools_FOUND))"
  - "patches/0002-build-autotest-without-runtime.patch (test_infrastructure: build autotests/kglobalshortcuttest with BUILD_RUNTIME=OFF by linking public KF5::GlobalAccel + compiling src/sequencehelpers_p.cpp instead of KF5::GlobalAccelPrivate; test source unchanged; keeps upstream ctest inventory = 1)"

knowledge_gained:
  - "KF5 5.116.0 框架包在制品仓无 5.x 依赖时可用 ecm/6.26.0 满足 find_package(ECM 5.116.0 NO_MODULE)（CMake 版本检查为 >=）"
  - "BUILD_RUNTIME=OFF 排除 kglobalacceld X11 守护进程，同时消除 KF5Config/CoreAddons/Crash/DBusAddons/WindowSystem 依赖块"
  - "OHOS CMake 无 HarmonyOS 平台模块，需 CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE + SONAME flag 修复 L5 门禁（attica5 模式）"
  - "KF5 tarball 的 poqm/ 使 ECMPoQmTools 无条件依赖 Qt5LinguistTools（OHOS 仓库无此模块），需 if(Qt5LinguistTools_FOUND) 守护 ecm_install_po_files_as_qm"
  - "CMakeDeps 生成的 Qt5DBus config 不含 Qt5DBusMacros.cmake，qt_add_dbus_interface 需行为一致的 shim（qdbusxml2cpp+moc，生成 .h/.cpp/.moc，处理 NO_NAMESPACE/CLASSNAME/INCLUDE/SKIP_AUTOMOC），经 conan_cmakedeps_paths.cmake include"
  - "qt5-qtbase 原生 Qt5CoreConfigExtras.cmake 探测 <qt_pkg>/../b/mkspecs/linux-clang（打包时烘焙的构建目录，发布包内不存在），配方与 test_package 均需 _prepare_qt_mkspec_compat 把 mkspecs/linux-clang 复制到该路径（attica-kf5/5.116.0 先例）"
  - "BUILD_TESTING=ON 时 tests/CMakeLists.txt 需要 Qt5Qml，故依赖 qt5-qtdeclarative/5.15.2；上游测试盘点 ctest -N=1（kglobalshortcuttest 经 patches/0002 在 BUILD_RUNTIME=OFF 下同样构建，与上游默认构建清单一致）"
  - "上游 autotest 链接守护进程侧私有目标 KF5::GlobalAccelPrivate，但测试源码只用公共 API + sequencehelpers_p.cpp（helper 专为该单测导出）；改链公共库即可在排除 runtime 的配置下保留上游测试清单"
  - "autotest 的 <qplatformdefs.h> 在 CMakeDeps 生成的 Qt5::Core config 下不可见（mkspecs 树不在 include/ 下），需把 <qt_pkg>/mkspecs/linux-clang 以 -isystem 注入 buildenv CXXFLAGS"
  - "OHOS 沙箱 Qt5DBus 为 dlopen(libdbus-1.so.3) 模式：若系统无 libdbus-1.so 共享库则所有 Qt DBus 调用瞬间失败（Not connected）；制品仓 dbus 包仅静态库，需从 dbus 源码编共享库并 LD_LIBRARY_PATH 注入（注意 HMDFS 符号链接 dlopen 会 EACCES，须用实文件）"
  - "OHOS 沙箱（uid 不在只读 /etc/passwd）中 dbus-daemon 需 LD_PRELOAD getpwuid[_r] 垫片才能启动；HMDFS 不支持 unix 文件 socket（bind EPERM），dbus 总线须用 unix:abstract= 地址"
  - "无 session bus 时 QDBusConnection::sessionBus().interface() 返回 nullptr，上游 kglobalshortcuttest 的 initTestCase 直接解引用会段错误；因此配方内只做 ctest -N 盘点，全量执行在真机配 session bus 后进行"
