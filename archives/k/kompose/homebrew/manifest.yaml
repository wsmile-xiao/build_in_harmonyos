software: kompose
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/homebrew/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "homebrew"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/kubernetes/kompose/archive/refs/tags/v1.35.0.tar.gz"

  # 源码校验和
  sha256: "62c29b8f57e20335bea5c129d56a7dafc50ddca334ede6f44e6f46f5fe676e4a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # Go 构建系统标识
  build_system: go

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go构建在HMDFS上linker mmap失败，需用/data/storage/el2/base/cache目录构建"
  - "kompose入口为main.go（根目录），非cmd/kompose/"
  - "版本注入ldflags: -X github.com/kubernetes/kompose/pkg/version.VERSION=1.35.0 -X github.com/kubernetes/kompose/pkg/version.GITCOMMIT=v1.35.0"
  - "Go 1.26.3 (~/usr/local/go1263/bin/go) 用于编译，GOPROXY=https://goproxy.cn,direct"
  - "CGO_ENABLED=1 动态链接 musl libc"
