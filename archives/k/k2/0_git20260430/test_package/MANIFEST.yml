# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: k2/0_git20260430
homepage: "https://github.com/serg-meus/k2"

# 上游测试命令: 上游无 `check` 目标；`make test` 构建 test_all 单元测试二进制
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test CC=clang++ CFLAGS='-std=c++0x -Werror -Wall -Wextra -Wpedantic -Wcast-align -Wcast-qual -Wconversion -Wsign-conversion -Wctor-dtor-privacy -Wnon-virtual-dtor -Wold-style-cast -Woverloaded-virtual -Wredundant-decls -Wsign-promo -Wshadow -Weffc++ -Wuninitialized -Wno-unknown-warning-option' && ./test_all"

# 上游实际运行的测试程序
upstream_tests:
  - file: test_all.cpp
    source: k2-8e4531b92dd329358de1c74c23894bf8977e1588/test_all.cpp
    description: "上游单元测试套件：49 个测试函数（utils/bitboards/board/chess/eval/engine/时间管理七组，共 513 个 assert 断言，含 perft、静态交换评估 SEE、走法生成与合法性、将死判定、时间管理），assert 式，全部通过输出 'All tests passed'"
    command: "./test_all"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_k2.py
    description: "UCI 协议功能测试（真机实测）：uci/uciok 握手 + isready/readyok 应答 + position startpos go depth 4 实际搜索产出 bestmove；由 test_package/conanfile.py 以打包产物二进制路径为参数调起"
    command: "test_k2.py <packaged-bin>/k2  (uci.txt/isready.txt/search.txt → uciok/readyok/bestmove)"

# 测试断言总数（上游 test_all.cpp 513 个 assert + test_package 3 项功能断言）
assertion_count: 513
