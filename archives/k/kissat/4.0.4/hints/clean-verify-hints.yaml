# G0 clean-verify hints for kissat 4.0.4
# kissat uses a custom configure script that does NOT support --prefix
build_system: custom
configure_command: "./configure CC=clang"
build_command: "make -j1"
install_command: "mkdir -p __DESTDIR__/$DEFAULT_PREFIX/bin __DESTDIR__/$DEFAULT_PREFIX/lib __DESTDIR__/$DEFAULT_PREFIX/include && cp build/kissat __DESTDIR__/$DEFAULT_PREFIX/bin/ && cp build/libkissat.a __DESTDIR__/$DEFAULT_PREFIX/lib/ && cp src/kissat.h __DESTDIR__/$DEFAULT_PREFIX/include/"
