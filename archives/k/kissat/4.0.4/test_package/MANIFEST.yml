# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kissat/4.0.4
homepage: "https://github.com/arminbiere/kissat"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# kissat 使用 tissat 测试框架，运行 864 个测试任务
upstream_tests:
  - file: test/tissat.c
    source: kissat-4.0.4/test/tissat.c
    description: "TISSAT — kissat 内置测试框架，864 个测试任务覆盖 SAT/UNSAT 求解、DRAT 证明等"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — 调用 kissat API 验证 SAT/UNSAT 求解功能"
    command: "./test_kissat"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
