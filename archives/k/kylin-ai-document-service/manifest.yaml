# 软件级 manifest.yaml
# kylin-ai-document-service — Kylin AI 文档分块服务客户端库
# 文件位置: archives/k/kylin-ai-document-service/manifest.yaml

software: kylin-ai-document-service
display: "kylin-ai-document-service"
description: >-
  Kylin AI 文档分块服务（openKylin AI 子系统）的 gRPC 客户端库：同步/异步/流式
  文档分块请求 + 经 sd-bus 拉起用户级文档服务
category: library
homepage: "https://gitee.com/openkylin/kylin-ai-document-service"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 find_package 依赖经 CMake 包（非 pkg-config）解析：制品仓 grpc.pc 的 Requires 链缺 abseil_* 模块、systemd 包 lib/pkgconfig 为空，故补丁改为 find_package(gRPC/systemd/nlohmann_json CONFIG)"
    - "grpc/protobuf 导出 cmake_find_mode=none，CMakeDeps 不生成其配置：在 generate() 固定 gRPC_DIR/Protobuf_DIR/absl_DIR/utf8_range_DIR 与 protoc/grpc_cpp_plugin 路径"
    - "find_package(KylinAiProto) 由 libkylin-ai-system-private/1.2.0.0 的组件提供（共享目录 share/KylinAiProto/cmake 含生成函数），需固定 KylinAiProto_DIR"
    - "协议定义用源码树 document.proto（制品仓 kylin-ai-proto 副本已过期，缺 max_doc_chars_count/callback_data/Status，而 client.cpp 调用 add_max_doc_chars_count）"
    - "protobuf 33.x 将 JsonPrintOptions::always_print_primitive_fields 改名为 always_print_fields_with_no_presence（补丁 0003）"
    - "OHOS 无 Platform/HarmonyOS.cmake → SONAME 标志为空：注入 CMAKE_SHARED_LIBRARY_SONAME_C(XX)_FLAG，产物才有 DT_SONAME（CI L5a，E537）"
    - "registry zlib/1.3.1 为非 PIC 静态库，链入共享库报 R_AARCH64_ADR_PREL_PG_HI21：用 -Wl,--exclude-libs,ALL 吸收（不 pin PIC 版，避免连带重建 systemd/261，R36）"
    - "上游 install() 绝对路径 /usr/... 改为 GNUInstallDirs；pkg-config 文件改为 ${pcfiledir} 可重定位"
    - "cdylib 依赖注入只落在 build_folder/制品仓包目录，未写共享 /usr/local（R49）"
  common_dependencies:
    - "grpc/1.84.0"
    - "protobuf/33.6"
    - "libkylin-ai-system-private/1.2.0.0"
    - "systemd/261"
    - "nlohmann_json/3.12.0"

versions:
  "1.2.0.0":
    status: built
    build_date: "2026-09-26"
