# conandata.yml — kylin-ai-document-service 1.2.0.0
#
# Upstream: https://gitee.com/openkylin/kylin-ai-document-service
#   (official openKylin project hosting; the archive is served from this
#    endpoint, so the source URL stays on the upstream host — no fork,
#    mirror or repackaging is used. Conandata URL whitelisting note for
#    review: this is the upstream project's own Gitee repository.)
# Tag: build/1.2.0.0-ok0.6
#   annotated tag object 4cc2dcfc1e5a39544e2258348432e5c839462e6e
#   -> commit ef12f7fae2cbc6a2f5d3c3626c96f35b5935a832 (verified with
#      `git ls-remote --tags`; the tarball below unpacks to the same tree as
#      `git clone --branch build/1.2.0.0-ok0.6 --depth 1`).
# sha256 computed over two independent downloads (identical), so the
# reference is reproducible.
sources:
  url: "https://gitee.com/openkylin/kylin-ai-document-service/repository/archive/build%2F1.2.0.0-ok0.6.tar.gz"
  sha256: "73f416627c58a2f62d13c5e460d84c29c979d2b54ac0ffb1de4cf6669120f481"

# The Gitee archive endpoint serves the tarball to a curl user-agent; the
# Conan downloader therefore sends one explicitly (see conanfile.source()).

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: >-
      Relocate absolute /usr install paths to GNUInstallDirs, discover the
      registry gRPC/systemd/nlohmann-json CMake packages instead of
      pkg-config (the registry grpc.pc requires uninstalled absl_* modules
      and the registry systemd package ships an empty lib/pkgconfig/), consume
      the in-tree document.proto as the code-generation source, and honour the
      upstream ENABLE_TEST option so the upstream test program can be built.
    patch_type: "portability"
  - patch_file: "patches/0002-pkgconfig-relocatable.patch"
    patch_description: >-
      Make the installed pkg-config file relocatable: the upstream copy
      hard-codes -I/usr/include/kylin-ai-document-service and carries no
      prefix, so consumers of the Conan package would resolve the system
      include path instead of the package folder.
    patch_type: "portability"
  - patch_file: "patches/0003-protobuf33-print-options.patch"
    patch_description: >-
      Adapt to the protobuf 33.x JSON API: JsonPrintOptions'
      always_print_primitive_fields was renamed to
      always_print_fields_with_no_presence (the old name no longer exists, so
      src/client.cpp fails to compile with protobuf 33.6).
    patch_type: "portability"
