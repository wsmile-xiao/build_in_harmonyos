# test_package/MANIFEST.yml
# 上游官方测试声明文件 — kylin-ai-document-service/1.2.0.0

package: kylin-ai-document-service/1.2.0.0
homepage: "https://gitee.com/openkylin/kylin-ai-document-service"

# 上游测试命令（源码树内唯一测试程序，由 ENABLE_TEST=ON 触发构建）
upstream_check_command: "./test/test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./test/test"

# ── R51 三步法：第 1 步清点 ────────────────────────────────────────────
# 清点证据（tag build/1.2.0.0-ok0.6，commit ef12f7fae2cbc6a2f5d3c3626c96f35b5935a832）：
#   1. `find . -iname '*test*' -not -path './.git/*'`
#      -> test/ 目录、test/CMakeLists.txt、test/test.cpp
#         （另 python/pdftest.pdf 为数据文件，非测试程序）
#   2. `ls tests` -> 不存在（无 tests/ 目录）
#   3. `grep -rn 'enable_testing|add_test|ctest' --include=CMakeLists.txt .`
#      -> 无结果：上游未注册 CTest，测试目标由顶层 option(ENABLE_TEST) 控制
#   4. 上游唯一测试程序：test/test.cpp（1 个），链接被测库
#         target_link_libraries(test PRIVATE kylin-ai-document-service)
# 结论：上游测试总数 N = 1，无 CTest 注册、无单元测试框架。
upstream_tests:
  - file: test/test.cpp
    source: kylin-ai-document-service-build-1.2.0.0-ok0.6/test/test.cpp
    description: >-
      上游唯一测试程序：构造 document::DocumentChunkClient 后调用
      SyncChunkDocument(file_paths, chunker_types, chunk_sizes)。硬编码
      /home/kylin/文档/...docx 路径，catch(...) 后恒 return 0，无任何断言。
    command: "./test/test"
    # ── R51 三步法：第 2 步实际运行 + 第 3 步如实申报 ──
    executed: true
    # 在 OHOS/aarch64（本机原生构建）上确实编译并运行（build() 中 self.run）。
    # 局限（如实申报，不作豁免）：
    #   a) 用例无断言且 catch(...) 后恒 return 0，退出码不反映真实结果；
    #   b) 硬编码 /home/kylin/文档/... 输入文件在本环境不存在；
    #   c) 依赖运行中的文档服务与用户 D-Bus/systemd，OHOS 上不提供。
    # 因此该用例仅能证明「客户端可编译、可链接、可构造并发起调用」，
    # 实质性功能验证由 test_package 的消费者测试承担（见下）。
    passed: true

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_document_service.cpp
    description: >-
      消费者测试：链接 kylin-ai-document-service::kylin-ai-document-service，
      构造 DocumentChunkClient（真实调用 sd_bus_open_user）并调用两个
      SyncChunkDocument 重载（真实走 protobuf 序列化 + gRPC channel + 生成
      Stub + 上游重试逻辑），断言返回状态真实、两重载一致；另校验包内
      include/kylin-ai-document-service/client.h、lib/libkylin-ai-document-service.so、
      share/pkgconfig/kylin-ai-document-service.pc 存在且非空。
    command: "./test_document_service"

# 测试断言总数（test_document_service.cpp 内 5 处 check() + Python 侧 3 项产物校验）
assertion_count: 8

# 上游测试运行实测值（R51 第 3 步回填；禁占位符）
upstream_test_summary:
  total: 1          # N  = 上游测试程序总数（清点结果）
  executed: 1       # N' = 实际运行数
  pass_rate: "1/1"  # 实测：程序执行完成（无断言，故不代表功能正确性）
