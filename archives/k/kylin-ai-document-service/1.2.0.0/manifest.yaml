# 版本级 manifest — kylin-ai-document-service 1.2.0.0
# 遵循 ARCHIVE-SPEC v3.0

version: "1.2.0.0"
software: "kylin-ai-document-service"
status: pending_ci
build_date: "2026-09-26"
build_system: cmake

source:
  url: "https://gitee.com/openkylin/kylin-ai-document-service/repository/archive/build%2F1.2.0.0-ok0.6.tar.gz"
  sha256: "73f416627c58a2f62d13c5e460d84c29c979d2b54ac0ffb1de4cf6669120f481"
  compression: tar.gz
  archive_root: "kylin-ai-document-service-build-1.2.0.0-ok0.6"
  tag: "build/1.2.0.0-ok0.6"
  commit: "ef12f7fae2cbc6a2f5d3c3626c96f35b5935a832"

dependencies:
  required:
    - "grpc/1.84.0"
    - "protobuf/33.6"
    - "libkylin-ai-system-private/1.2.0.0"
    - "systemd/261"
    - "nlohmann_json/3.12.0"
    # Declared directly in requirements() to document the non-PIC static
    # archive constraint and the --exclude-libs,ALL link strategy.
    - "zlib/1.3.1"
  transitive:
    - "openssl/3.5.6"
    - "abseil-cpp/20260107.1"
    - "c-ares/1.34.6"
    - "re2/2024-04-01"
    - "libcap/2.69"
    - "liblzma/5.8.1"
    - "libzstd/1.5.7"
    - "libxcrypt/4.5.2"
    - "libucontext/1.5.2"
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  build_mode: native
  options:
    - "-DENABLE_TEST=ON（构建上游唯一测试程序 test/test）"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-Dprotobuf_MODULE_COMPATIBLE=ON（提供 protobuf_generate_cpp，KylinAiProtoGenerate.cmake 依赖）"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG/-CXX_FLAG=-Wl,-soname,（OHOS 无 Platform/HarmonyOS.cmake）"
    - "-Wl,--exclude-libs,ALL（吸收非 PIC zlib 静态对象）"
  notes: >-
    CMake 原生构建（worker 即 OHOS/aarch64，非交叉）；产物为共享库
    libkylin-ai-document-service.so.2.0.0（SONAME .so.2，VERSION 2.0.0 /
    SOVERSION 2 上游定义）+ 头文件 + 可重定位 pkg-config + python 服务数据
    + systemd user unit

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-pkgconfig-relocatable.patch"
  - "0003-protobuf33-print-options.patch"

compatibility:
  level: medium
  issues:
    - "运行期依赖运行中的文档服务与用户 D-Bus/systemd：OHOS 不提供 systemd 守护进程，startUserService()/sd_bus_open_user() 必然失败（编译与链接不受影响）"
    - "上游测试程序硬编码 /home/kylin/文档/... 输入路径，且 catch(...) 后恒 return 0，无断言"

knowledge_ref:
  - "DRAFT-kylin-ai-document-service-protobuf33-json-print-options-rename"
  - "E537"
  - "E541"

knowledge_gained:
  - "registry zlib/1.3.1 为非 PIC 静态库，链入共享库报 R_AARCH64_ADR_PREL_PG_HI21；用 -Wl,--exclude-libs,ALL 可吸收，无需改依赖版本 (ref: E541)"
  - "OHOS 无 Platform/HarmonyOS.cmake 导致 CMAKE_SHARED_LIBRARY_SONAME_*_FLAG 为空，共享库缺 DT_SONAME，消费者按路径记 DT_NEEDED 后加载失败；注入该标志即可 (ref: E537)"
  - "protobuf 33.x 弃用 JsonPrintOptions::always_print_primitive_fields（改名 always_print_fields_with_no_presence）(ref: DRAFT-kylin-ai-document-service-protobuf33-json-print-options-rename)"
  - "cmake_find_mode=none 的制品仓包（grpc/protobuf）无法被 find_package 直接发现，需在 generate() 固定 *_DIR 与 codegen 二进制路径 (ref: E537)"
  - "build_tree 内运行链接自身 .so 的上游测试程序需显式注入 LD_LIBRARY_PATH（构建树 RPATH 在 OHOS 工具链下无效）(ref: E537)"
