sources:
  url: "https://download.kde.org/stable/frameworks/6.26/knotifyconfig-6.26.0.tar.xz"
  sha256: "062e22f48a1da485d42ef56b37db1fc502f5f9305871483627d218f357560a28"

patches:
  - patch_file: "patches/0001-CMakeLists.txt-skip-ki18n-po-install.patch"
    patch_description: >-
      OHOS: skip ki18n_install(po); the macro shells out to the
      Qt6LinguistTools / gettext tooling that is not published to the ohpcd
      Conan remote, so only the translation catalogues are affected.
    patch_type: "portability"
  - patch_file: "patches/0002-src-CMakeLists.txt-replace-kiowidgets-with-kiocore.patch"
    patch_description: >-
      OHOS: link KF6::KIOCore instead of KF6::KIOWidgets; ohpcd builds kio in
      KIOCORE_ONLY mode, so the KIOWidgets target (and KUrlRequester with it)
      does not exist.
    patch_type: "portability"
  - patch_file: "patches/0003-ui-replace-kurlrequester-with-qlineedit.patch"
    patch_description: >-
      OHOS: replace the KUrlRequester sound field with a plain QLineEdit,
      because KUrlRequester ships in KIOWidgets which is not built.
    patch_type: "portability"
  - patch_file: "patches/0004-actionswidget-drop-kurlrequester-specific-calls.patch"
    patch_description: >-
      OHOS: drop the KUrlRequester-only setStartDir / setMimeTypeFilters /
      setUrl calls and use the QLineEdit text accessors instead.
    patch_type: "portability"
  - patch_file: "patches/0005-src-CMakeLists.txt-link-KF6-ConfigCore.patch"
    patch_description: >-
      OHOS: link KF6::ConfigCore explicitly. <KConfig>/<KConfigGroup> are
      forwarding headers installed under <prefix>/include/KF6/KConfigCore and
      only KF6::ConfigCore puts that directory on the include path; upstream
      inherits the usage requirement transitively through KF6::KIOWidgets,
      which ohpcd does not re-export because kio is built KIOCORE_ONLY.
    patch_type: "portability"
