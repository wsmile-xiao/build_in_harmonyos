# 版本级 manifest
# 文件位置: archives/{letter}/{name}/6.26.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.26.0"

# 软件名
software: "knotifyconfig"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.kde.org/stable/frameworks/6.26/knotifyconfig-6.26.0.tar.xz"
  sha256: "062e22f48a1da485d42ef56b37db1fc502f5f9305871483627d218f357560a28"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DUSE_DBUS=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG=-Wl,-soname,"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,"
    - "-DECM_MODULE_PATH=<ecm>/share/ECM/{modules,find-modules,kde-modules}"

  dependencies:
    - qtbase/6.11.1
    - qtmultimedia/6.11.1
    - kcompletion/6.26.0
    - kconfig/6.26.0
    - ki18n/6.26.0
    - kio/6.26.0
    - ecm/6.26.0

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-CMakeLists.txt-skip-ki18n-po-install.patch"
  - "0002-src-CMakeLists.txt-replace-kiowidgets-with-kiocore.patch"
  - "0003-ui-replace-kurlrequester-with-qlineedit.patch"
  - "0004-actionswidget-drop-kurlrequester-specific-calls.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "KF6 6.26 的 kio 在 ohpcd 上以 KIOCORE_ONLY 构建：没有 KF6KIOCoreConfig.cmake，KF6::KIOCore 由 KF6KIOTargets.cmake 导出，必须先 find_package(KF6KIO) 才可见；KIOWidgets/KIOGui/KIOFileWidgets 均不构建（solid/kbookmarks/kjobwidgets/kiconthemes 6.26 未发布）"
  - "KUrlRequester 属于 KIOWidgets，KIOCORE_ONLY 下不可用；notifyrc 的 Sound 字段改成 QLineEdit 后，.ui 的 <customwidgets> 块必须一并删除，否则 uic 生成的代码仍会 include kurlrequester.h"
  - "KUrlRequester::textChanged(QString) 与 QLineEdit::textChanged(QString) 同名同签名，替换后 actionswidget 构造函数里的 connect 无需改动"
  - "原生 OHOS 构建（os_build == os_host == OHOS）下 CMake 停在 Generic 平台模块，没有共享库 SONAME 规则，必须手工设 CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG/C_FLAG，否则 .so.6 无 DT_SONAME 且导出目标带上 IMPORTED_NO_SONAME"
  - "CMake 在 install 时会重写已安装共享库的 RUNPATH，使 OHOS 构建期 .codesign 段失效，加载器报 Permission denied；package() 必须用 llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1 重签（kiconthemes 6.26.0 / kitemmodels 6.18.0.1 / kirigami 6.18.0 先例）"
  - "KConfig(name) 把裸文件名解析到 QStandardPaths::GenericConfigLocation（即 $XDG_CONFIG_HOME），KNotifyEventList::fill() 另会扫 $XDG_DATA_DIRS/knotifications6/<app>.notifyrc；消费者测试要固定这两个环境变量才能做到免宿主污染"
  - "上游 tests/ 依赖 KF6ConfigWidgets/KF6Notifications/KF6WidgetsAddons/KF6XmlGui 6.26（ohpcd 只到 6.18.0），必须 BUILD_TESTING=OFF；上游 knotifytest 本身是无断言的 GUI 演示程序"
