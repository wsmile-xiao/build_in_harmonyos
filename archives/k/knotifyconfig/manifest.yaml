software: knotifyconfig
display: "KNotifyConfig"
description: "KDE Frameworks 6 notification configuration widget (KNotifyConfigWidget for application notification events)"
category: library
homepage: "https://invent.kde.org/frameworks/knotifyconfig"
license: LGPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "USE_DBUS=OFF: Qt6DBus is not published to ohpcd; the HAVE_DBUS block only guards the post-save 'reload your config' broadcast"
    - "patch 0002 + 0003 + 0004: the sound field used KUrlRequester (KF6::KIOWidgets). ohpcd builds kio in KIOCORE_ONLY mode, so the target links KF6::KIOCore and the widget becomes a plain QLineEdit (the <customwidgets> block must be dropped with it)"
    - "patch 0001: ki18n_install(po) skipped on OHOS; Qt6LinguistTools / gettext are not published to ohpcd"
    - "BUILD_TESTING=OFF: tests/ needs KF6ConfigWidgets / KF6Notifications / KF6WidgetsAddons / KF6XmlGui 6.26, none published (only 6.14.0/6.18.0 exist)"
    - "native OHOS builds land in CMake's Generic platform module, which has no shared-library SONAME rule; CMAKE_SHARED_LIBRARY_SONAME_{CXX,C}_FLAG is set manually so libKF6NotifyConfig.so.6 keeps its DT_SONAME"
    - "ECM_MODULE_PATH set manually because the CMakeDeps-generated ECMConfig.cmake does not propagate it"
    - "conan_cmakedeps_paths.cmake created manually because qtbase uses cmake_find_mode=none, which stops CMakeDeps from adding its builddir to CMAKE_PREFIX_PATH"
    - "installed ELF files are re-signed: CMake rewrites the RUNPATH on install, invalidating the OHOS build-time .codesign section (loader then reports Permission denied)"
  common_dependencies:
    - qtbase
    - qtmultimedia
    - kcompletion
    - kconfig
    - ki18n
    - kio
    - ecm

versions:
  "6.26.0":
    status: built
    build_date: "2026-09-21"
    conan_ref: "knotifyconfig/6.26.0"
