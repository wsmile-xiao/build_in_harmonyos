  - "0002-dummypmap-stddef-and-socklen_t-fixes.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS SDK UAPI <linux/nfs_mount.h> 经 <linux/in.h>→<linux/socket.h> 与 musl 的 sockaddr_storage 冲突（__UAPI_DEF_* 守卫仅 glibc 生效），用 -I shadow 头（剔除 include 链、netinet/in.h 供 sockaddr_in）解决"
  - "musl 无 bindresvport()，static inline 回退（改自 klibc usr/klibc/inet/bindresvport.c）+ 构建期生成 portability.h，mount.c/sunrpc.c 两处调用方 include"
  - "klibc 主包只含 libc 本体，usr/kinit/nfsmount 等工具需独立成包；工具源码可用 clang 直接编译，无需 kbuild/klibc 环境"
  - "链接必须用 clang driver（裸 ld.lld 产物缺 .codesign 段导致设备 Permission denied，E077）"
  - "R51 上游测试实跑：klibc 上游 usr/klibc/tests 全部 39 个测试逐个编译/链接/运行，实测 38/39（97.4%）；唯一失败 testrand48 系上游 testrand48.c:18 硬编码 return 1（主包同败，非缺陷），失败不阻塞 conan create（与主包同口径）"
  - "OHOS exec 授权按祖先链判定（R7 弹窗变体）：python/mksh 祖先链上的 clang-15 exec 有分钟级窗口的间歇静默拒绝（rc=1 无输出），bash 子树根全天放行；将全部编译/测试收拢进单次 bash 脚本（subprocess list 直连，不经 /bin/sh 包装，脚本内自 source conanbuild）可在故障窗口内稳定完成全流程"
