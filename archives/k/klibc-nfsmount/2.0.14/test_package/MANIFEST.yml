# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# R51 三步法（盘点 → 实跑 → 回填）结果：
#   本配方复用 tool_requires(klibc/2.0.14) 的源码树与制品，在 build() 内
#   编译并真实运行 klibc 上游 usr/klibc/tests 下全部 39 个测试程序：
#   实测 38/39 通过（97.4%），唯一失败 testrand48（上游硬编码 return 1，
#   见 notes.md「上游测试」节），如实上报不修改。
#   证据：构建产物 upstream-tests-full.log（3.2MB，含 39 组编译/链接/运行
#   全过程输出与 "UPSTREAM_TEST PASS/FAIL" 逐条标记）。

package: klibc-nfsmount/2.0.14
homepage: "https://www.kernel.org/pub/linux/libs/klibc/"

# 上游测试命令：无独立 make 目标（nfsmount 不参与 klibc 顶层 make test），
# 配方直接编译 usr/klibc/tests 下每个 .c 并逐个运行（klibc 静态链接模板）。
upstream_check_command: ""

# conanfile.py build() 是否集成上游测试：是（build.sh 内逐个编译/链接/运行，timeout 15 保护，失败重试一次）
upstream_test_in_build: true
upstream_test_command: "编译并逐个运行 klibc-2.0.14/usr/klibc/tests/*.c（static + klibc crt0.o/libklibc.a 链接）"

# 上游测试程序（klibc 上游 usr/klibc/tests 下 39 个 .c，全部实跑）
upstream_tests:
  - file: "usr/klibc/tests/*.c"
    source: "klibc-2.0.14/usr/klibc/tests/"
    description: "klibc 上游测试套件 39 个测试程序（字符串/stdio/stdlib/time/socket/mmap/setjmp/进程等），build() 内逐个编译、链接并真实运行；实测 38 通过、1 失败（testrand48，上游硬编码 return 1，非本配方缺陷）"
    command: "conanfile.py build.sh 逐个编译/链接/运行（timeout 15 保护）"

# test_package 自带测试（消费者视角，调用已安装二进制的确定性离线路径）
test_package_tests:
  - file: test.sh
    description: "消费者测试 — nfsmount 无参数/未知选项/坏 -o 子选项/不存在挂载点 4 条确定性离线路径"
    command: "bash test.sh"

# 测试断言总数（上游 39 个测试程序逐条上报 + test_package 自测 4 项断言）
assertion_count: 43
