# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kcoreaddons/6.18.0.

package: kcoreaddons/6.18.0
homepage: https://invent.kde.org/frameworks/kcoreaddons

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: autotests/
    source: kcoreaddons-6.18.0/autotests/
    description: "KCoreAddons upstream CTest/autotests suite"
    command: "ctest --output-on-failure"
    condition: "not run in the Conan build because BUILD_TESTING=OFF"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke creates KAboutData and checks component, display name, and version fields."
    command: "conan create (test_package builds and runs test_kcoreaddons)"

assertion_count: 3
