# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kcoreaddons/6.18.0.1.

package: kcoreaddons/6.18.0.1
homepage: https://invent.kde.org/frameworks/kcoreaddons

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error --timeout 90"

upstream_tests:
  - file: autotests/
    source: kcoreaddons-6.18.0/autotests/
    description: "KCoreAddons upstream CTest/autotests suite"
    command: "ctest --output-on-failure"
    condition: "runs inside build() on OHOS (BUILD_TESTING=ON + _run_upstream_tests()); CI renders this as a test_package note, L0/L1 are the gates"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke creates KAboutData and checks component, display name, and version fields."
    command: "conan create (test_package builds and runs test_kcoreaddons)"

# 说明：CI 容器环境下 kpluginmetadatatest 的 app-dir 拷贝用例由 patches/0005 记为 QSKIP；
# 设备环境（真机 6.18.0 记录）该用例正常执行，30/30 通过。
assertion_count: 3
