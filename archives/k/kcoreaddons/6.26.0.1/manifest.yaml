knowledge_gained:
  - "kcoreaddons 6.26.0.1（本版）：补 DT_SONAME（配方注入 CMAKE_SHARED_LIBRARY_SONAME_{C,CXX}_FLAG=-Wl,-soname,）——CMake 无 Platform/HarmonyOS 模块时 CMAKE_SHARED_LIBRARY_SONAME_* 为空，lld 不写 DT_SONAME，消费方把构建机绝对路径记进 DT_NEEDED。"
  - "kcoreaddons 6.26.0.1（本版）：补丁 0006 把 plugin 测试的文件复制改为读写复制——OHOS 上 QFile::copy 恒返回 FALSE/errno 75(EOVERFLOW)。"
  - "kcoreaddons 6.26.0（基线）保留同一套 OHOS CMake 适配：跳过 po/qm 处理、把 OHOS 视为非 Windows 类 Unix 目标选择源码。"
  - "KCOREADDONS_USE_QML=OFF 让 Akonadi KF 基线只依赖 Qt6Core；QML 插件可作为后续可选扩展。"
  - "上游 CTest 可用，前提是 OHOS 专项修复：dladdr 探测、MIME 复合后缀回退、LANGUAGE locale 回退、硬链接与 user/group 库不可用时的运行期跳过。"
