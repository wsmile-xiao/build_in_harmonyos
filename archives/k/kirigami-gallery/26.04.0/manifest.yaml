# manifest.yaml — kirigami-gallery 26.04.0 (版本级)
# 归档规范 v3.0

version: "26.04.0"
software: "kirigami-gallery"
status: built
build_date: "2026-09-29"

# 源码信息
source:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/kirigami-gallery-26.04.0.tar.xz"
  sha256: "f85b0ac55c7912b4969d6a30facb87675084e36bc994b1142603e6ea6b9f3386"
  tar_format: tar.xz

# 构建配置
build:
  system: cmake
  cmake_version_min: "3.16"
  configure_options:
    - "-DBUILD_TESTING=OFF"
    - "-DENABLE_QML_PROFILING=OFF"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKF_SKIP_PO_PROCESSING=ON"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies:
    - qtbase/6.11.1
    - qtdeclarative/6.11.1
    - qtsvg/6.11.1
    - qtshadertools/6.11.1
    - kirigami/6.26.0
    - kitemmodels/6.18.0.1
  tool_dependencies:
    - ecm/6.26.0
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "KDE Release Service 应用（kirigami-gallery 等）自带 src/android/build.gradle APK 打包辅助文件，lang-preflight 按文件名匹配会误判 java/gradle——真实构建系统是根级 CMakeLists.txt，需按证据链复核（见 notes.md）"
  - "KF_SKIP_PO_PROCESSING=ON 让 ECMPoQmTools.cmake 直接 return()，跳过 poqm→qm 编译，免除 Qt6::LinguistTools(qttools) 依赖（kirigami-addons 1.13.0 同决策）"
  - "Qt6/KF6 应用配方消费模式：CMAKE_PROJECT_TOP_LEVEL_INCLUDES 注入 conan_cmakedeps_paths.cmake（CMAKE_PREFIX_PATH 汇聚全部依赖包目录）+ ECM_MODULE_PATH + QT_ADDITIONAL_PACKAGES_PREFIX_PATH"
  - "QML 应用 headless 验证：QT_QPA_PLATFORM=offscreen + QML2_IMPORT_PATH(依赖包 lib/qml) + QT_QUICK_CONTROLS_STYLE=basic；main.cpp rootObjects().isEmpty()→exit 255 是天然的 QML 加载失败信号，test_runner 以 8s 存活判定验证 QML 栈真实加载"
  - "OHOS 宿主 shell 的 LD_LIBRARY_PATH 携带空白填充条目，Qt 宿主工具(qmlcachegen/qsb) 需显式追加干净的 /system/lib64{,/platformsdk,/ndk}"
