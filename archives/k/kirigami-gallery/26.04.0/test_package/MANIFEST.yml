# test_package/MANIFEST.yml — 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# R51 上游测试三步法清点证据 (2026-09-29, tarball f85b0ac5...3386):
#   1) find kirigami-gallery-26.04.0 -iname "*test*" -o -iname "autotests"
#      -> 空输出（无任何测试目录/文件）
#   2) grep -rn "add_test|enable_testing|ECMAddTests" --include=CMakeLists.txt
#      -> 空输出（无任何 CTest 注册）
#   结论: 上游 kirigami-gallery 26.04.0 不含官方测试套件（demo 应用）。
#   故按 R51 自行补齐消费者测试（见 test_package_tests）。

package: kirigami-gallery/26.04.0
homepage: "https://invent.kde.org/graphics/kirigami-gallery"

# 上游测试命令: 不存在（无测试套件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, R34: 实际执行被测包二进制)
test_package_tests:
  - file: test_runner.c
    source: test_package/test_runner.c
    description: >
      消费者端到端测试: fork+exec 被测包安装的 kirigami2gallery 二进制
      (QT_QPA_PLATFORM=offscreen)，验证完整 QML 栈 (QtQuick +
      org.kde.kirigami 6.26 + org.kde.kitemmodels 1.0 + InfoData C++ 类型)
      真实加载——main.cpp 中 engine.rootObjects().isEmpty() 时以 -1 退出，
      加载成功则事件循环常驻；8 秒内退出 255 = FAIL，存活 8 秒 = PASS
      (SIGTERM 收尾)。
    command: "./test_runner <pkg>/bin/kirigami2gallery"

# 测试断言总数 (近似值, 用于质量评估)
# test_runner.c: 1) exec 成功 2) 无意外退出码 3) 非 255 退出即 QML 失败
#                4) 8s 存活判定 —— 4 组判定路径
assertion_count: 4
