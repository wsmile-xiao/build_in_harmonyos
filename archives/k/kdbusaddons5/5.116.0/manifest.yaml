# 版本级 manifest — kdbusaddons5 5.116.0
# KF5 (Qt5) 系列的 KDBusAddons
# 遵循 ARCHIVE-SPEC v2.0

version: "5.116.0"
software: "kdbusaddons5"
status: built
build_date: "2026-09-18"
build_system: cmake

source:
  url: "https://download.kde.org/stable/frameworks/5.116/kdbusaddons-5.116.0.tar.xz"
  sha256: "03b73a4b04c227175f17bfec9a84ae7acb9f5443adc7a1adbf7bd98926bc8e56"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKF_SKIP_PO_PROCESSING=ON"
    - "-DWITH_X11=OFF"
    - "-DKDE_INSTALL_USE_QT_SYS_PATHS=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - qt5-qtbase/5.15.2.2
    - ecm/6.20.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "KF5 kdbusaddons 的 Qt5DBus 模块只能由 qt5-qtbase/5.15.2.2 提供（其 DBus 变体，requires dbus/1.14.10）；qt5-qtbase/5.15.2 不带 Qt5DBus（configure 无 -dbus），kdbusaddons 的 find_package(Qt5DBus REQUIRED) 会失败，必须用 .2 变体"
  - "KF5 ECM 的 ECMPoQmTools 处理 poqm/ 需要 Qt5LinguistTools（lrelease），qt5 制品仓无此工具；用 KF_SKIP_PO_PROCESSING=ON 跳过 po 转 qm"
  - "Qt5 X11 可选（CONFIG 模式）：OHOS 无 X11 时 WITH_X11/Qt5X11Extras 不存在，HAVE_X11=FALSE，qtx11extras 代码路径被编译掉"
  - "构建产物含 libKF5DBusAddons.so（库）与 kquitapp5（命令行工具），后者需声明 commands.json（R38）"

tests:
  upstream_autotests: "未执行（BUILD_TESTING=OFF，需 dbus-daemon session bus；沙箱无 dbus-daemon）"
  test_package: "待 conan-verify 验证"
