# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: kdnssd/6.29.0
homepage: "https://invent.kde.org/frameworks/kdnssd"

# kdnssd 6.29.0 上游无 autotests/ 目录、无 ctest 目标。
# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（kdnssd 上游未提供自动测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_kdnssd.cpp
    description: "消费者测试：链接 KF6::DNSSD 并真实调用 KDNSSD API（isAvailable/getLocalHostName/ServiceBrowser）"
    command: "./test_kdnssd"
  - file: test_kdnssd_ohos.cpp
    description: "鸿蒙特有测试：断言 OHOS 平台适配路径（dummy backend）行为 —— isAvailable()==Unsupported、getLocalHostName() 为空、startBrowse() 同步触发 finished()、services() 为空"
    command: "./test_kdnssd_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
