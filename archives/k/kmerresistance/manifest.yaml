# 软件级 manifest — archives/k/kmerresistance/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0（模板: templates/manifest-software.yaml）

software: kmerresistance
display: "KmerResistance"
description: "KmerResistance 将耐药基因与 WGS 样本预测物种关联分析（调用 KMA 进行 read mapping）的命令行工具"
category: utility
homepage: "https://bitbucket.org/genomicepidemiology/kmerresistance"
license: Apache-2.0

build_system: makefile

ohos_adaptation:
  key_points:
    - "raw Makefile 项目（无 configure）：配方从 tools.build:compiler_executables 取 CC/AR/RANLIB（R33），不依赖 shell 环境变量"
    - "无平台补丁，上游自带 #define _XOPEN_SOURCE 600，OHOS clang 直接编译通过"
    - "运行时依赖 kma 为外部程序（system() 调用），不打包；test_package 用 stub kma 夹具验证全管线"
  common_dependencies: []

versions:
  "2.2.0":
    status: built
    build_date: 2026-09-20
