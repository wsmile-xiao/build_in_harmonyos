# test_package/MANIFEST.yml - kmerresistance 2.2.0
package: kmerresistance/2.2.0
homepage: "https://bitbucket.org/genomicepidemiology/kmerresistance"

# Upstream ships no test suite: the tarball contains only
# KmerResistance.c, pherror.c/h, qseqs.c/h, Makefile, README.md.
# No make check / ctest target exists (verified: `find . -iname '*test*'` = empty,
# Makefile targets = all/clean only).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "none"
    source: "upstream tarball contains no test sources"
    description: "Upstream has no test suite; functional verification done via test_package"
    command: "see test_package/test.sh"

test_package_tests:
  - file: test.sh
    description: "Functional smoke test: version banner, help, arg validation, full pipeline run with stub kma + synthetic FASTQ/KMA fixtures, .KmerRes/.res output verification"
    command: "bash test.sh <bin/kmerresistance>"
  - file: conanfile.py
    description: "ELF magic check fallback for can_run()==False environments"

# 新增/鸿蒙特有测试 (rule12)
added_tests:
  - name: "harmonyos-specific-test"
    source: test_package/test_ohos.sh
    description: "鸿蒙特有断言: OpenHarmony 平台检查(param get const.ohos.fullname) + ELF64 指针宽度/AArch64 三元组(readelf -h) + 动态依赖闭合(DT_NEEDED 全部可解析) + kmerresistance 在 OHOS 上实际执行"
    command: "bash test_ohos.sh <bin_dir>"

# 测试断言总数 (近似值): test.sh 7 项 + test_ohos.sh 4 项断言
assertion_count: 11
