source_sha256: 8be8057221a982c8d1fe42f95454fac9610eb51975226c6652689293cd335bfd
knowledge_gained:
  - "The upstream tarball is named syntax-highlighting, while the Conan package is named ksyntaxhighlighting."
  - "KSyntaxHighlighting exports the KF6SyntaxHighlighting CMake package and KF6::SyntaxHighlighting target."
  - "The library bundles syntax and theme definitions through Qt resources when QRC_SYNTAX is enabled."
  - "The released source needs Perl during the build to generate merged syntax definitions; perl/5.42.2 supplies that tool."
  - "Qt QML bindings are optional; Qt6Qml is not required for the C++ library target consumed by KDE PIM text-editing code."
