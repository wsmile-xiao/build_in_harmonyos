test_results:
  type: conan_create_ohos_aarch64
  upstream: "passed: 6/6 default CTest entries (wildcardmatcher_test, repository_test, theme_test, testhighlighter_test, htmlhighlighter_test, folding_test)"
  test_package: "passed: CTest 1/1 plus direct run; consumer found KF6SyntaxHighlighting/KF6::SyntaxHighlighting and loaded the built-in C++ syntax and Breeze Light theme"
  not_run: "appstream metadata validation was not registered because appstreamcli is not available; highlighter_benchmark and repository_benchmark are upstream BENCHMARK-configuration tests and are deliberately excluded from normal CTest because they do not add library coverage"
  full_reference: "ksyntaxhighlighting/6.18.0#b19b5e2a737a274fb5e230cc0a781d6a:57ffd8c720a5bfee7e8827990cd6550a49181c1b#97599434dccaaab4613942bfc1373342"
