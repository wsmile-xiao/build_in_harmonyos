# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "家族复用取证：kea-dhcp6 与已合入的 kea-hook-* / kea-perfdhcp 同属 Kea 3.0.3 单源码树（src/bin/dhcp6 与 src/hooks/... 平级），0001-0005 补丁与 kea-hook-ha 逐字节一致（md5 对账通过），整组复用零改动"
  - "鸿蒙 hmdfs 用户存储拒绝 AF_UNIX 路径名 bind()（EPERM）：服务器 unix 命令通道（control-socket）根本无法建立。测试适配不能只按内核特性判定——用与服务器相同的 bind() 做探针（dhcp6_test_utils 的 unixControlSocketsUsable），按探针结果跳过 45 个通道用例 + 2 个 config-commit 用例（补丁 0007-0009）"
  - "Kea 3.x 配置校验新增必填：subnet6 条目带 pools 时缺少 \"id\" 参数直接报 'missing parameter id' 校验失败——语法检查测试的合法样例用 {\"Dhcp6\": {\"subnet6\": []}}"
  - "OHOS app 沙箱 /tmp 只读：上游 testutils sandbox 默认 P_tmpdir（/tmp）建沙箱目录失败且 mkdtemp 返回 NULL 后解引用——补丁 0006 让 sandbox 先行取 TMPDIR；HTTP 控制通道配置写测试同样把路径建在 TMPDIR（补丁 0010）"
  - "OHOS 内核拒绝 shebang 脚本 execve（与可执行位无关）：meson 注册的 dhcp6_process_tests.sh 直接执行报 Error 126——补丁 0011 把 test() 的 command 改为经 sh 执行"
  - "OHOS /storage 沙箱拒绝符号链接（ln -s → EPERM）：meson 以 version: N.M.K 构建共享库时 soname 名只以符号链接发布，链接名在 OHOS 上根本不存在，加载器按 NEEDED 名全部落空（shell 套件的服务器启动即报 'Error loading shared library libkea-dhcpsrv.so.131'）。build() 在 compile 后以复制物化 soname（_materialize_sonames，幂等，与 kea-hook-* 家族同款），meson test 与 package() 遍历都能吃到（真机实测物化 23 个，含非闭包库）"
  - "meson 的 gtest 套件在 OHOS 需先物化 soname 才能跑：kea-dhcp6-tests 二进制本身 NEEDED libkea-*.so.N，缺 soname 时直接 exit 127 'Error relocating … symbol not found'（表象像链接竞态，实质是加载器找不到 soname 文件）"
  - "OHOS app 沙箱限制并发进程数：ninja 默认按 20 核并发（~45 个活动 spawn）触发 posix_spawn EAGAIN 中断编译——meson compile 须限并发 -j 8（家族配方沿用）"
  - "dhcp6_process_tests.sh 按下 30s 通用预算，设备上单测最长约 112s（多组 kea-dhcp6 进程串行启动）——meson test 须 --timeout-multiplier 4（家族配方沿用）"
  - "Kea 3.0.3 构建树在真机上的实测构成：kea-dhcp6 服务器 + 31 个 gtest 套件（965 例）+ 14 个进程级 shell 用例，零 root 实跑，服务器 CLI 契约（-v/-V/-W/-t/-z）全部与上游一致"
  - "鸿蒙平台 ABI 探针解析 ELF 时不要用固定上限缓冲整张 .dynstr：大 C++ 二进制的字符串表随导入符号增长（kea-dhcp6 实测 96373 字节 > 64 KiB），截断缓冲会让所有 DT_NEEDED 名字偏移落在界外而产生 0 条假阴性（官方 verify G2 曾因此误报）——应按 DT_NEEDED 偏移逐条点读字符串（每次 ≤255 字节），并删除 STRTAB_SIZE 类上限"

