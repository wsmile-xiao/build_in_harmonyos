  method: family-template + staged-diff
  source_family: kea-hook-ha/3.0.3
  note: "补丁 0001-0005 与该源码树家族模板 kea-hook-ha/3.0.3 同名补丁逐字节一致（md5 对账通过：0001 fb02d6ec / 0002 73e78987 / 0003 ac87cd3e / 0004 bea535f4 / 0005 963090e6）；0006-0011 为本包新增（沙箱测试适配：sandbox TMPDIR、unix 通道探针与跳过、HTTP 控制通道测试路径 TMPDIR、shell 套件经 sh），按 staged-diff 生成并逐枚在纯净源码树上验证可依序应用"
