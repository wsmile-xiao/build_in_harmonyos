# 版本级 manifest — kea-dhcp6 3.0.3
# 文件位置: archives/k/kea-dhcp6/3.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.3"
software: "kea-dhcp6"

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-10-04"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
    - "-DBOOST_SP_NO_PTHREAD_SETCANCELSTATE (extra_cxxflags)"
    - "tc.binaries ar/ranlib = <compiler dir>/llvm-ar|llvm-ranlib (MesonToolchain)"
    - "LD_LIBRARY_PATH += host 依赖 libdirs（配置期 cpp.run() 探针）"
    - "meson compile -j 8（OHOS 沙箱并发进程配额）"
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================

artifacts:
  - "bin/kea-dhcp6"
  - "lib/libkea-*.so*（服务器运行时依赖闭包，20 个 kea 库）"

# ============================================================
# 上游测试（build() 内真实执行）
# ============================================================

upstream_tests:
  command: "meson test -v --timeout-multiplier 4 -C <builddir> kea-dhcp6-tests dhcp6_process_tests.sh"
  suites_run: 2
  # gtest 实测注册执行 965 个（31 个套件；另源码含 2 个上游 DISABLED_ 用例，
  # 按 gtest 语义不执行）+ 脚本套件驱动调用 14 个
  cases_in_source: 981
  cases_in_source_detail: "gtest 965 个实际执行（源码另有 2 个 DISABLED_ 用例不执行）+ dhcp6_process_tests.sh 驱动调用 14 个"
  root_cases: 0
  root_cases_detail: "无：全部用例以普通应用身份在沙箱内实跑（零 root、零 SKIP 以外的跳过仅 47 个平台性跳过，见下）"
  # 真机实测（2026-10-04 真机全量跑，meson Ok: 2 / Fail: 0，TEST_RC=0）：
  # kea-dhcp6-tests gtest 49.08s（965 ran: 918 passed / 47 skipped / 0 failed）
  # dhcp6_process_tests.sh 112.40s（14/14）
  cases_run: 979
  cases_passed: 932
  cases_failed: 0
  cases_skipped: 47
  cases_skipped_detail: "45 个 unix 命令通道用例（CtrlChannelDhcpv6SrvTest 直接 socket 组 + 继承 socket 组，patch 0008）+ 2 个 config-commit 用例（patch 0009）：鸿蒙 hmdfs 存储拒绝 AF_UNIX 路径名 bind()（EPERM），平台不支持"
  cases_unregistered: 0
  cases_unregistered_reason: "无：源码注册的 965 个可执行用例（+2 DISABLED）在本配置全部注册并执行"

# ============================================================
# 鸿蒙特有测试（test_package，2 个用例）
# （test_package 另含 1 个通用消费者契约测试 test_kea_dhcp6.py，与兄弟 kea 配方相同，
#  不属鸿蒙特有；声明见 test_package/MANIFEST.yml 的 test_package_tests）
# ============================================================

ohos_specific_tests:
  count: 2
  entries:
    - "test_package/test_ohos_platform.c → test_ohos_platform（平台 ABI）"
    - "test_package/test_ohos_runtime.c → test_ohos_runtime（运行时闭包）"
  command: "./test_ohos_platform <kea-dhcp6> && ./test_ohos_runtime <kea-dhcp6>"
  checks:
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so）"
    - "DT_NEEDED 闭包中的每个 Kea 库（libkea-*.so*）都随包分发"
    - "包内 Kea 运行时库（lib/libkea-*.so*）在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 成功（实测 20 个 soname 实体）"
    - "真实执行包内 kea-dhcp6（-v 输出 3.0.3），证明真实进程完整 NEEDED 闭包在 OHOS 运行时可解析"
  # 真机实测（2026-10-04，鸿蒙特有 2/2 全绿；消费者契约 test_kea_dhcp6.py 16/16，见版本级 notes.md）
  cases_run: 2
  cases_passed: 2
  cases_failed: 0

