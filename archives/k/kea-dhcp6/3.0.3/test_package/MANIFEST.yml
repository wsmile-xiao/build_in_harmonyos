# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-dhcp6/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：src/bin/dhcp6/tests/meson.build 注册 2 个套件
# （gtest test('kea-dhcp6-tests', protocol: 'gtest')；
#  脚本 test('dhcp6_process_tests.sh', ...)，本包 patch 0011 改为经 sh 启动，
#  门禁 -D tests=enabled），本包 build() 内真实执行
upstream_check_command: "meson test -C <builddir> --list"
upstream_test_in_build: true
upstream_test_command: "meson test -v --timeout-multiplier 4 -C <builddir> kea-dhcp6-tests dhcp6_process_tests.sh"

# 上游测试程序（本次适配实测：2/2 套件通过，用例级 gtest 965 跑/918 过/47 跳/0 挂，
#  shell 14/14；另有 2 个上游 DISABLED 用例不计入 965）
upstream_tests:
  - file: kea-dhcp6-tests
    source: src/bin/dhcp6/tests/
    description: >-
      单个 gtest 可执行文件，覆盖 kea-dhcp6 全部编译单元：配置解析与继承
      （Dhcp6ParserTest 等）、租约与分配、IA_NA/IA_PD、DUID、iface_mgr、状态机、
      CtrlChannelDhcpv6SrvTest 等（31 个套件、965 个用例实际执行；上游另定义
      2 个 DISABLED_ 用例，不计入）。其中 45 个 unix 命令通道用例
      （CtrlChannelDhcpv6SrvTest 直接 socket 组 + 继承 socket 组）与 2 个
      config-commit 用例因鸿蒙 hmdfs 存储拒绝 AF_UNIX 路径名 bind()（EPERM）
      按 patch 0008/0009 跳过，其余全部通过
    command: "\"./kea-dhcp6-tests\"（工作目录 src/bin/dhcp6/tests，需 TEST_DATA_DIR）"
  - file: dhcp6_process_tests.sh
    source: src/bin/dhcp6/tests/
    description: >-
      端到端 shell 套件：真实启动/停止 kea-dhcp6 守护进程，覆盖进程级
      行为（config 加载、信号、日志文件、server_pid_file、临时目录等），
      14 个用例全部通过（--timeout-multiplier 4：套件按下 30s 通用预算，
      设备上单测最长约 113s）
    command: "sh dhcp6_process_tests.sh（patch 0011 经 sh 执行；meson 套件名同文件名）"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_kea_dhcp6.py
    description: >-
      以 conanrun 环境运行包内 kea-dhcp6：版本输出（-v/-V）、构建配置报告
      （-W 含 "Kea source configure results"）、语法检查 -t 的三个路径
      （合法配置 {"Dhcp6":{"subnet6":[]}} 退出 0；非法 subnet 报
      "Invalid subnet syntax"；缺失文件报 "Unable to open file"）、
      非法选项 -z 的拒绝与 usage 文本，并校验各次运行 stderr 无
      "Error loading shared library"，共 16 个测试用例（真实执行器：逐例 TEST PASS/FAIL + 末行 TEST SUMMARY，任一失败退出码 1）
    command: "python3 test_kea_dhcp6.py"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 bin/kea-dhcp6 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64 / ET_DYN PIE、DT_NEEDED 链接 musl libc.so 且非
      glibc libc.so.6、链接 libc++_shared.so），共 8 个测试用例（逐例 TEST PASS/FAIL + 末行 TEST SUMMARY，任一失败退出码 1）
    command: "./test_ohos_platform <package>/bin/kea-dhcp6"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：校验包内 DT_NEEDED 的 Kea 库全部随包分发，
      在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 包内 20 个 libkea-*.so* 全部成功，
      并真实执行包内 kea-dhcp6（-v 输出 3.0.3），证明真实进程的完整 NEEDED 闭包
      在 OHOS 运行时可解析，共 6 个测试用例（逐例 TEST PASS/FAIL + 末行 TEST SUMMARY，任一失败退出码 1；另有 20 条逐库 dlopen 结果行）
    command: "./test_ohos_runtime <package>/bin/kea-dhcp6"
    ohos_specific: true

# 鸿蒙特有测试用例统计（本次适配实测：2 个，2/2 通过）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <kea-dhcp6> && ./test_ohos_runtime <kea-dhcp6>"
  result: "2/2 passed"

# 用例总数：上游 gtest 965（31 套件，其中 47 按平台跳过）+ shell 套件 14
upstream_case_count: 979
upstream_passed_case_count: 932
upstream_skipped_case_count: 47
test_package_assertion_count: 30
assertion_count: 1009
