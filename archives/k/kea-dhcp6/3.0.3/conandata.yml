# conandata.yml — kea-dhcp6 3.0.3 (ISC Kea)
# Upstream release tarball from the ISC ftp server (official source,
# identical to the one the kea-hook-* / kea-perfdhcp recipes use).
sources:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"

patches:
  - patch_file: "patches/0001-meson.build.patch"
    patch_description: "Normalize the HarmonyOS/OpenHarmony system name to Linux so the Meson platform branch selects the Linux sources and flags"
    patch_type: "portability"
  - patch_file: "patches/0002-src-lib-dhcp-iface_mgr_linux.cc.patch"
    patch_description: "Rename the UAPI struct sockaddr_storage while including the netlink headers, avoiding its redefinition against the musl sys/socket.h one"
    patch_type: "portability"
  - patch_file: "patches/0003-meson.build.patch"
    patch_description: "Invoke the configure-time helper scripts (env.sh, cd-and-run.sh, grabber.py, config-report.sh) through their interpreters (sh/python3) because the HarmonyOS PC kernel refuses script execve"
    patch_type: "portability"
  - patch_file: "patches/0004-src-lib-process-cfgrpt-meson.build.patch"
    patch_description: "Invoke tools/mk_cfgrpt.sh through /bin/sh when generating config_report.cc because the HarmonyOS PC kernel refuses script execve"
    patch_type: "portability"
  - patch_file: "patches/0005-src-lib-dhcp-iface_mgr_linux-getifaddrs-fallback.patch"
    patch_description: "Fall back to getifaddrs()-based interface detection when the netlink socket cannot be opened (the HarmonyOS PC sandbox refuses to bind it), mirroring the BSD/Solaris implementation"
    patch_type: "portability"
  - patch_file: "patches/0006-src-lib-testutils-sandbox.h.patch"
    patch_description: "Honour TMPDIR before P_tmpdir when creating the test sandbox directories: the HarmonyOS PC mounts /tmp read-only, so the default mkdtemp(NULL) fails and the sandbox handle ends up null"
    patch_type: "portability"
  - patch_file: "patches/0007-src-bin-dhcp6-tests-dhcp6_test_utils-unix-socket-check.patch"
    patch_description: "Add a probe that tests the actual AF_UNIX pathname bind() used by the command channel, and a helper for suites to skip on hosts where it cannot succeed (the HarmonyOS PC user storage is an hmdfs mount that rejects the bind with EPERM)"
    patch_type: "portability"
  - patch_file: "patches/0008-src-bin-dhcp6-tests-ctrl_dhcp6_srv_unittest-skip-unix-channel.patch"
    patch_description: "Skip the 45 unix command-channel server tests (both the direct-socket and the inherited-socket groups) on hosts whose storage cannot host AF_UNIX pathname sockets"
    patch_type: "portability"
  - patch_file: "patches/0009-src-bin-dhcp6-tests-config-commit-skip-unix-control-sockets.patch"
    patch_description: "Skip the two config-commit cases that configure a unix control socket on hosts whose storage cannot host AF_UNIX pathname sockets"
    patch_type: "portability"
  - patch_file: "patches/0010-src-bin-dhcp6-tests-http_control_socket_unittest-tmpdir.patch"
    patch_description: "Build the HTTP control-socket config-write test paths under TMPDIR (falling back to /tmp) because the HarmonyOS PC /tmp is read-only"
    patch_type: "portability"
  - patch_file: "patches/0011-src-bin-dhcp6-tests-meson.build-shell-test-via-sh.patch"
    patch_description: "Run dhcp6_process_tests.sh through sh because the HarmonyOS PC kernel refuses script execve regardless of the executable bits"
    patch_type: "portability"
