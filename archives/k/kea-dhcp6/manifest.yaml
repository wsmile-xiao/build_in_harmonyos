software: kea-dhcp6
display: "ISC Kea DHCPv6 server"
description: "DHCPv6 server shipped with ISC Kea (kea-dhcp6), with the Kea runtime libraries it loads"
category: network
homepage: "https://www.isc.org/kea/"
license: MPL-2.0
build_system: meson

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Meson 在 OHOS 上报告 system='harmonyos'，Kea 的平台白名单不含它：需归一化为 linux 才能选中 Linux 源码分支"
    - "OHOS sysroot 的 linux/socket.h 与 musl sys/socket.h 都定义 struct sockaddr_storage，包含 netlink 头时需 define-guard"
    - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core 需 BOOST_SP_NO_PTHREAD_SETCANCELSTATE"
    - "meson 对 clang 默认用裸名 llvm-ar 探测归档器，本环境/CI 上失败：需从 tools.build:compiler_executables 推导绝对路径写入 machine file"
    - "配置期 cpp.run() 探针要求 host 共享依赖在 LD_LIBRARY_PATH 可见（log4cplus shared=True）"
    - "boost 必须固定 1.85.0（1.90/1.91 制品仓包缺 Kea 实际使用的头文件），且 meson 需 >= 1.10"
    - "OHOS 内核拒绝 shebang 脚本 execve（与可执行位无关）：conan 的 meson 包装脚本与 configure/测试期脚本均须经 sh/解释器调用"
    - "OHOS /storage 沙箱拒绝符号链接（EPERM）：meson 的 soname 名只以符号链接发布，须以复制方式物化（_materialize_sonames），否则加载器按 NEEDED 名查找全部落空"
    - "鸿蒙 hmdfs 用户存储拒绝 AF_UNIX 路径名 bind()（EPERM）：服务器 unix 命令通道不可用，测试以同型 bind 探针判定后按平台跳过（本包 47 例）"
    - "OHOS app 沙箱 /tmp 只读：测试沙箱目录与 HTTP 控制通道测试配置路径须改用 TMPDIR"
    - "OHOS app 沙箱限制并发进程数：ninja 并发 spawn 触发 EAGAIN，meson compile 须限 -j 8"
    - "kea-dhcp6 的产物是可执行文件：包内按 bin/ 落盘并提供 commands.json（R38），同时携带 20 个 Kea 运行库"
  common_dependencies:
    - boost
    - log4cplus
    - openssl

# 版本索引（所有已归档版本，含状态）
versions:
  "3.0.3":
    status: built
    build_date: "2026-10-04"
    conan_ref: "kea-dhcp6/3.0.3"
