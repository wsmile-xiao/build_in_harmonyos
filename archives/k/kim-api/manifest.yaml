software: kim-api
display: "KIM API (OpenKIM Interatomic Models)"
description: "Application Programming Interface for the Knowledgebase of Interatomic Models"
category: library
homepage: "https://openkim.org/kim-api"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "Fortran sources require flang-ohos tool package (no system Fortran on OHOS)"
    - "Upstream ctest suite: 33 cases in examples/simulators (KIM_API_BUILD_EXAMPLES=ON); build-tree exes OHOS self-signed before ctest"
    - "Headers install to include/kim-api; CMake target KIM-API::kim-api"
  common_dependencies: []

versions:
  "2.4.1":
    status: built
    build_date: "2026-09-28"
