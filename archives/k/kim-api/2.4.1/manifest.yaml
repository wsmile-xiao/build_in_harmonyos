    - "-DCMAKE_Fortran_FLAGS=--target=aarch64-linux-ohos --sysroot=<sdk>/sysroot -resource-dir=<sdk>/llvm/lib/clang/15.0.4 (OHOS only)"
    - "-DCMAKE_EXE/SHARED/MODULE_LINKER_FLAGS=-L<sdk>/aarch64-linux-ohos -L<flang>/lib -lFortranRuntime -lFortranDecimal -lm (OHOS only)"
    - "-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY (OHOS only)"
  dependencies: []
  tool_dependencies:
    - flang-ohos/20.1.0
  cc: clang
  cxx: clang++

patches_applied: []

