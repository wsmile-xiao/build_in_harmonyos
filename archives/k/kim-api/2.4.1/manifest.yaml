  sha256: "225e3136d43e416a4424551e9e5f6d92cc6ecfe11389a1b6e97d6dcdfed83d44"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DKIM_API_BUILD_EXAMPLES=ON (hosts the 46-case upstream ctest suite; OFF hides it and was rejected by evidence gate)"
