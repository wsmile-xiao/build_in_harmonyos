package: "kim-api/2.4.1"
homepage: "https://openkim.org/kim-api"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests_exist: true
upstream_test_total: 46
upstream_test_count_method: ctest_entries
upstream_test_audit: >-
  kim-api 2.4.1 的 ctest 套件由两部分组成（真机 ctest -N Total Tests=46，口径 ctest_entries）：33 个 simulator 运行由 examples/simulators/CMakeLists.txt 经
  add_kim_api_test() 注册，仅在 KIM_API_BUILD_EXAMPLES=ON 时可见：
  _add_simulator_tests 注册 3 个 collections-example 变体
  （collections-example/-c/-fortran）与 3 个 simulator-model-example 变体；
  _add_simulator_model_tests 以 9 个模型的 _test_models 列表
  （LennardJones612_UniversalShifted__MO_959249795837_003、LennardJones_Ar、
  ex_model_Ar_P_LJ、ex_model_Ar_P_MLJ_Fortran、ex_model_Ar_P_Morse、
  ex_model_Ar_P_Morse_07C、ex_model_Ar_P_Morse_07C_w_Extensions、
  ex_model_Ar_P_Morse_MultiCutoff、ex_model_Ar_SLJ_MultiCutoff）为 3 个
  ex_test_Ar_fcc_cluster 变体（C/C++/Fortran）各展开 9 个 Run_ 用例，共 27 个；
  合计 3+27+3=33；另有 13 个 shared_library_test_* 用例由 model-driver/portable-model/simulator-model 的 KIM item 构建助手注册（2026-09-29 预检日志出现 shared_library_test_ex_model_Ar_SLJ_MultiCutoff、shared_library_test_LennardJones612_UniversalShifted__MO_959249795837_003、shared_library_test_LennardJones_Ar、shared_library_test_Sim_LAMMPS_LJcut_AkersonElliott_Alchemy_PbAu 等，33+13=46）。顶层 CMakeLists.txt 仅 enable_testing() 而无 add_test()，
  utility_forces_numer_deriv 子目录只构建可执行文件、不注册用例。其中 6 个
  （ex_model_Ar_P_Morse_MultiCutoff 与 ex_model_Ar_SLJ_MultiCutoff x 3 变体）
  带 WILL_FAIL TRUE，ctest 按 Passed 计。口径 ctest_entries 即 `ctest -N` 的
  Total Tests 数，本配方 build() 在真机实测（KIM_API_BUILD_EXAMPLES=ON）。
upstream_tests:
  - file: examples/simulators/collections-example/collections-example.cpp
    source: kim-api-2.4.1/examples/simulators/collections-example/collections-example.cpp
    description: "Run_collections-example{,-c,-fortran}：3 个集合接口演示运行（C、C++、Fortran 各一）"
    command: "ctest -R Run_collections-example"
  - file: examples/simulators/ex_test_Ar_fcc_cluster/ex_test_Ar_fcc_cluster.c
    source: kim-api-2.4.1/examples/simulators/ex_test_Ar_fcc_cluster/ex_test_Ar_fcc_cluster.c
    description: "Run_ex_test_Ar_fcc_cluster{,_cpp,_fortran}_<9 models>：3 变体 x 9 模型 = 27 个模拟器运行，其中 6 个 MultiCutoff 为 WILL_FAIL 预期失败（ctest 计 Passed）"
    command: "ctest -R Run_ex_test_Ar_fcc_cluster"
  - file: examples/simulators/simulator-model-example/simulator-model-example.cpp
    source: kim-api-2.4.1/examples/simulators/simulator-model-example/simulator-model-example.cpp
    description: "Run_simulator-model-example{,-c,-fortran}：3 个模拟器模型演示运行（C、C++、Fortran 各一）"
    command: "ctest -R Run_simulator-model-example"

test_package_tests:
  - id: "semver-contract"
    source: "test_semver.c"
    command: "kimapi_semver_contract"
    description: >-
      Exercise the KIM_SEM_VER C API: version string reports 2.4.1,
      ParseSemVer yields 2/4/1 and rejects invalid input, IsLessThan
      orders 2.4.0 < 2.4.1 (9 internal checks).
  - id: "collections-lifecycle"
    source: "test_collections.c"
    command: "kimapi_collections_contract"
    description: >-
      Exercise the KIM Collections and Log C APIs: Create/Destroy
      lifecycle round-trips including a re-create cycle (7 internal checks).

test_counting:
  upstream_independent_total: 46
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 16
