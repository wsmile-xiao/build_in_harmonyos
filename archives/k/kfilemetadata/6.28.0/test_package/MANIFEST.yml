# test_package/MANIFEST.yml
# Upstream and consumer test declaration for kfilemetadata/6.28.0.

package: kfilemetadata/6.28.0
homepage: https://invent.kde.org/frameworks/kfilemetadata

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试（BUILD_TESTING=ON + ctest 实跑）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"

# 上游实际运行的测试程序 (autotests/ 目录，BUILD_TESTING=ON 在 Conan 构建中运行)
upstream_tests:
  - file: autotests/
    source: kfilemetadata-6.28.0/autotests/
    description: "kfilemetadata upstream CTest/autotests suite (extractor coverage, indexer extraction, xml/odf/office2007/postscript/krita/PNG extractors, property/type info, taglib/exiv2 extractor tests)"
    command: "ctest --output-on-failure -j1"
    condition: "runs inside conan create build() with LD_LIBRARY_PATH + QT_PLUGIN_PATH + QT_QPA_PLATFORM=offscreen; poppler/ffmpeg/epub/mobi/appimage tests not registered (backends disabled)"

# test_package 中自带的测试 (消费者视角验证, R34: 真实 API 调用)
test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke test exercises KFileMetaData::SimpleExtractionResult (add/append/properties/text), KFileMetaData::PropertyInfo (property/name) and KFileMetaData::TypeInfo (name)."
    command: "conan create (test_package builds and runs test_kfilemetadata)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
