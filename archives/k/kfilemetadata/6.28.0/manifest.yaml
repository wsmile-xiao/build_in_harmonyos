# 编译中学到的知识
knowledge_gained:
- "kfilemetadata 6.28.0 上游 find_package(ECM 6.28.0)——制品仓 ecm 别名包最高 6.26，需用 extra-cmake-modules/6.28.0（制品仓在仓同名包）。"
- "KF_DEP_VERSION=6.28 会挡住在仓 KF6 依赖（karchive 6.19/kcodecs 6.18 是短板）——patch 降级到 6.18（KF6 同 major 兼容）。"
- "zlib 双版本冲突（taglib→1.3.1, exiv2→1.3.1.1）用 configure() 里 requires(force=True) 归一到 1.3.1.1。"
- "conan taglib/exiv2 静态包与 ECM FindTaglib/FindLibExiv2 的大小姐敌对：包自带 config 定义 TagLib::tag/Exiv2::exiv2lib，kfilemetadata 链接 Taglib::Taglib/LibExiv2::LibExiv2——写 wrapper find-module（find_package(taglib CONFIG) + add_library ALIAS）解决，且 wrapper 需带 zlib/expat 闭包。"
- "ECMConfig.cmake 会 set(ECM_MODULE_PATH) 普通变量覆盖 toolchain 的 CACHE 值，且 CMakeLists L10 set(CMAKE_MODULE_PATH ... ${ECM_MODULE_PATH}) 整体覆盖——wrapper 注入必须走独立变量（CONAN_GENERATORS_DIR）写进 patch 的 set() 列表。"
- "CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON 会让 find_package(Taglib) 绕过 wrapper 直接命中包自带 config（target 名不符）——KF6/Qt6 场景可不设 PREFER_CONFIG。"
- "karchive 6.19 binary（WITH_OPENSSL=ON 构建）的 KF6ArchiveTargets 引用 PkgConfig::LibZstd/OpenSSL::Crypto——消费者图需预定义这些 target 或加 openssl requires。"
- "clang 15 不支持 C++20 结构化绑定捕获进嵌套 lambda（exiv2extractor.cpp offsetTime）——复制为具名局部变量解决。"
- "OHOS 无 /usr/share/mime，QMimeDatabase 仅剩 Qt 内置子集，mimetype 识别退化（kra→application/zip）导致 10 项上游测试失败——tool_requires shared-mime-info/2.4 + 暂存 freedesktop.org.xml.in 到 build/share/mime/packages + XDG_DATA_DIRS 注入（kcalendarcore tzdata 同法），26 测试 15 过→23 过。"
- "conan.tools.files.copy() 单文件改名复制是静默 no-op（pattern 在 src 目录里匹配，src 传具体文件路径时枚举不到）——单文件直拷用 shutil.copy。"

