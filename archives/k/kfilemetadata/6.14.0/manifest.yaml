# 编译中学到的知识
knowledge_gained:
- "kfilemetadata 6.14.0 是 CMake 项目（.build-context 误标 autotools），核心库 libKF6FileMetaData.so 仅需 Qt6Core + KF6::I18n + KF6::CoreAddons。"
- "KF_IGNORE_PLATFORM_CHECK=TRUE 绕过 KDE 平台白名单（OHOS 不在列表内）。"
- "ki18n_install(po) 内部调用 ecm_install_po_files_as_qm → find_package(Qt6 LinguistTools REQUIRED)，qtbase 未提供 LinguistTools，需 patch 移除（与 kconfig/karchive 6.14.0 同法）。"
- "ECM_MODULE_PATH 需手工设置（CMakeDeps 生成的 ECMConfig.cmake 不传播该变量）。"
- "qtbase 使用 cmake_find_mode=none，需手工生成 conan_cmakedeps_paths.cmake 将 qtbase lib/cmake 加入 CMAKE_PREFIX_PATH，find_package(Qt6 Xml/Gui) 才能解析。"
- "可选媒体后端通过 CMAKE_DISABLE_FIND_PACKAGE_Poppler/Taglib/LibExiv2/FFmpeg=ON 显式关闭，保持最小依赖。"
- "C++20：CMAKE_CXX_FLAGS=-std=c++20 强制（conan_toolchain 默认 C++17）。"
- "上游 autotests 可用 BUILD_TESTING=ON 在 OHOS 实跑：21 个不依赖媒体后端的纯 API 测试注册并执行（12/21 通过 57%）；ctest 运行需 LD_LIBRARY_PATH（依赖包 lib + 构建 bin 目录，冒号分隔）与 QT_PLUGIN_PATH/QT_QPA_PLATFORM=offscreen 运行环境；媒体后端测试（poppler/taglib/exiv2/ffmpeg 等）因 CMAKE_DISABLE_FIND_PACKAGE_* 未注册。"

