# test_package/MANIFEST.yml

package: kore/4.2.3
homepage: "https://kore.io"

# 上游源码测试审计（hmbs 硬门禁：确认无测试时才允许 upstream_tests_exist=false）
# 审计对象：https://kore.io/releases/kore-4.2.3.tar.gz（RELEASE 4.2.3，2022-08-22）
# 审计方法：解包后检查顶层 Makefile 目标 + tests/ 目录 + 测试框架关键字。
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile（顶层，4.2.3 tarball）"
    reason: "仅定义 all/clean/install/install-sources/uninstall/tools-build/tools-install/tools-clean/objects/releng-build-examples 目标；全文无 check/test 目标（grep '^test:|^check:|check_PROGRAMS|check_SCRIPTS|add_test|enable_testing' 0 命中）。"
  - source: "源码树（src/ include/ kodev/ misc/ tools/ conf/）"
    reason: "无 tests/ 或 test/ 目录；tools/ 下仅 kore-serve 示例工具源码；misc/ 为平台探测脚本与构建辅助脚本，无任何 *_test.c / test_*.py 测试源文件。"
  - source: "examples/（官方示例应用）"
    reason: "仅为演示应用骨架（含 README 与构建说明，需 kodev run 手动运行），不是自动化测试套件，无断言、无测试运行器。"
  - conclusion: "上游 kore 4.2.3 未提供任何自动化测试套件；由 test_package 执行消费者视角的二进制与安装布局验证。"

# 上游注册测试总数（口径：审计确认无任何测试框架，故为 0）
upstream_test_total: 0
upstream_test_count_method: none

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_kore.sh
    description: "kore 二进制存在且可执行"
    command: "bash test_kore.sh <bin/kore> <bin/kodev> <package_folder>"
  - file: test_kore.sh
    description: "kore -v 退出 0 且输出含 4.2.3"
    command: "bash test_kore.sh <bin/kore> <bin/kodev> <package_folder>"
  - file: test_kore.sh
    description: "kodev help 输出含 Available commands"
    command: "bash test_kore.sh <bin/kore> <bin/kodev> <package_folder>"
  - file: test_kore.sh
    description: "include/kore/kore.h 头文件已安装"
    command: "bash test_kore.sh <bin/kore> <bin/kodev> <package_folder>"
  - file: test_kore.sh
    description: "share/kore/features 构建元数据已安装"
    command: "bash test_kore.sh <bin/kore> <bin/kodev> <package_folder>"

assertion_count: 5
