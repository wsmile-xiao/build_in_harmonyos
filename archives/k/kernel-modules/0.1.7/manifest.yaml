# 版本级 manifest — kernel-modules 0.1.7
# 遵循 ARCHIVE-SPEC v2.0（参照先例 archives/a/akms/0.3.0/manifest.yaml 格式）

version: "0.1.7"
software: "kernel-modules"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: custom

# ============================================================
# 源码信息
# ============================================================
source:
  # 官方源：GitHub saber-nyan/kernel-modules-hook（Arch Linux 官方仓库软件
  # kernel-modules-hook 的上游，pkgver=0.1.7，arch=('any')）
  # 上游无 tag、无 release，默认分支 master；本机仅 raw.githubusercontent.com
  # 可达 → conandata.yml 用多文件 dict 形式（仿 cute_files/1.0.0），每个制品
  # 文件独立 https 官方 raw URL + sha256（与上游 PKGBUILD sha256sums 逐项一致）
  url: "https://raw.githubusercontent.com/saber-nyan/kernel-modules-hook/master/"
  sha256: "见 conandata.yml（5 个制品文件独立 sha256，与上游 PKGBUILD 逐项一致）"
  tar_format: none
  commit: "d5bb3c3750b8e9f7a45a9e3e7893b42e66cbd084"

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型：纯 POSIX shell/配置文件类工具（无 C/C++ 编译），按数据/配置资源包收录
  system: custom
  configure_options: []
  # 编译依赖列表（格式: name/version）
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "kernel-modules 0.1.7 = 上游 Arch Linux 包 kernel-modules-hook（纯 POSIX shell/配置文件类工具，无 C/C++ 编译）：libalpm hook + rsync 备份/恢复 /usr/lib/modules、systemd-tmpfiles 规则、systemd oneshot 清理服务——OHOS 无 libalpm/systemd 运行时，按数据/配置资源包收录，不做编译"
  - "上游无 tag 且本机 github.com 主域/codeload tarball 不可达（仅 raw.githubusercontent.com 可达）→ conandata.yml 用多文件 dict 形式（仿 cute_files/1.0.0），每制品文件独立 https 官方 raw URL + sha256（与 PKGBUILD sha256sums 逐项一致）"
  - "build() 无编译，用 sh -n 校验 hook 内嵌 Exec shell 命令可解析（参考 akms 先例）；systemd service 的 ExecStart 为 bash 语法（[[ ]]），用 bash -n 校验；提取逻辑须还原 systemd ExecStart 转义（$$ → $、\\' → '）后用 shlex.quote 传参（命令体含单引号时安全）"
  - "package_type=application 但无可执行 bin（数据/配置包）→ 软件级 commands.json 声明 binary=false（R38/L0k：package_type=application 即强制声明 commands.json，与 ausweisapp-nftrules 先例一致）"
