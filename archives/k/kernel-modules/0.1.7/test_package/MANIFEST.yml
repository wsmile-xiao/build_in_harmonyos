# test_package/MANIFEST.yml — kernel-modules 0.1.7
# CI L0e 强制要求此文件存在（上游测试声明文件）
# 上游测试清点（R51）：kernel-modules-hook 上游仓库无 tests/ 目录、无测试脚本
# （详见 notes.md「上游测试清点」——GitHub API 全文件清单为证据）。

package: kernel-modules/0.1.7
homepage: "https://github.com/saber-nyan/kernel-modules-hook"

# 上游测试命令：无（纯 POSIX shell/配置文件类工具，无 C/C++ 编译、无测试套件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序：无
upstream_tests: []

# test_package 消费者测试（R34 真实校验：文件存在性 + 非空 + hook/service 内嵌
# shell 命令 sh -n / bash -n 语法真实执行校验）
test_package_tests:
  - file: test_kernel_modules.py
    description: "校验打包产物：share/kernel-modules-hook/ 下 4 个制品文件存在且非空、licenses/UNLICENSE 存在且非空；从 10-linux-modules-pre/post.hook 提取 Exec 内嵌 shell 命令用 sh -n 校验语法、从 linux-modules-cleanup.service 提取 ExecStart 内嵌 bash 命令用 bash -n 校验语法"
    command: "python3 test_kernel_modules.py <pkg_root>"

# 测试断言总数（近似值，用于质量评估）
# 1 目录存在 + 4 制品文件 + 1 许可证 + 2 hook sh -n + 1 service bash -n = 9
assertion_count: 9
