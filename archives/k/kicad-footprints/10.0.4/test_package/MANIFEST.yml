schema_version: 1
package: k/kicad-footprints/10.0.4
test_package:
  type: consumer
  executable: kicad_footprints_probe
  language: cxx17
  assertions:
    - installed fp-lib-table is readable and names 155 libraries
    - every library has a matching .pretty directory
    - the installed tree contains 15435 .kicad_mod files
    - representative footprints have valid KiCad s-expression structure
    - malformed footprint input is rejected
    - --require-ohos succeeds only in an __OHOS__ build
upstream_tests:
  status: unavailable
  reason: upstream .gitlab-ci.yml includes the external kicad-library-utils GitLab CI template; the source archive has no local CTest tests
