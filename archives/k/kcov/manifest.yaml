software: kcov

# 软件级 manifest.yaml
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 基本信息
# ============================================================

name: kcov
description: "代码覆盖率收集工具，支持 C/C++, Bash, Python 等语言"
category: development-tools

# ============================================================
# 版本索引
# ============================================================

versions:
  38:
    status: published
    build_date: "2026-05-27"
    build_system: cmake
    dependencies:
      - elfutils/0.191
      - zlib/1.3.1
    patches: 4
    package_size: 3.1M
    notes: "musl libc 适配，禁用 Coveralls 上报"

# ============================================================
# 最新版本
# ============================================================

latest_version: "38"
latest_status: published

# ============================================================
# 平台支持
# ============================================================

platforms:
  - "ohos-aarch64"

# ============================================================
# 源码信息
# ============================================================

source_url_pattern: "https://github.com/SimonKagstrom/kcov/archive/refs/tags/v{version}.tar.gz"

# ============================================================
# 更新记录
# ============================================================

changelog:
  - version: "38"
    date: "2026-05-27"
    changes:
      - "首次编译，适配 OpenHarmony/musl libc"
      - "修复 __ptrace_request 未定义问题"
      - "修复 pthread_cancel 未定义问题"
      - "禁用 libcurl (Coveralls 上报)"