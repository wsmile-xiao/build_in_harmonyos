software: kea-hook-legal-log
display: "ISC Kea legal log (forensic log) hook"
description: "Legal log (forensic log) hook plug-in for the ISC Kea DHCPv4/v6 servers: timestamped lease/assignment logging with size/time-based rotation, prerotate/postrotate command hooks, file and optional MySQL/PostgreSQL backends"
category: network
homepage: "https://www.isc.org/kea/"
license: MPL-2.0
build_system: meson

# 跨版本通用的 OHOS 适配知识（与 kea-hook-limits/kea-hook-ping-check/kea-hook-host-cmds 家族共享，逐项保留）
ohos_adaptation:
  key_points:
    - "Meson 在 OHOS 上报告 system='harmonyos'，Kea 的平台白名单不含它：需归一化为 linux 才能选中 Linux 源码分支"
    - "OHOS sysroot 的 linux/socket.h 与 musl sys/socket.h 都定义 struct sockaddr_storage，包含 netlink 头时需 define-guard"
    - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core 需 BOOST_SP_NO_PTHREAD_SETCANCELSTATE"
    - "boost 必须固定 1.85.0（1.90/1.91 制品仓包缺 Kea 实际使用的头文件），且 meson 需 >= 1.10"
    - "OHOS 上 Python subprocess 不解析 PATH：meson 探测静态链接器时须给 ar/ranlib 绝对路径"
    - "OHOS 内核拒绝 shebang 脚本 execve：configure 期脚本（env.sh/grabber.py/config-report.sh/mk_cfgrpt.sh）与 conan meson 包装脚本一律经解释器前缀调用"
    - "OHOS 内核拒绝 shebang 脚本 execve 同样作用于运行时：ProcessSpawn 系 fork+execve 无 shell 回退，rotating_file 的 prerotate/postrotate 脚本命令须经 /bin/sh 路由"
    - "OHOS app 沙箱把 /tmp 等系统目录以只读挂载：后端打开日志文件失败（EROFS/EACCES）时回退到 $HOME scratch 目录，配置字符串与校验消息原样保留（重定向只能在文件打开层做）"
    - "OHOS /storage 沙箱拒绝符号链接：meson 版本化共享库的 soname 名须以复制方式物化"
  common_dependencies:
    - boost
    - log4cplus
    - openssl

# 版本索引（所有已归档版本，含状态）
versions:
  "3.0.3":
    status: published
    build_date: "2026-09-29"
    conan_ref: "kea-hook-legal-log/3.0.3"
