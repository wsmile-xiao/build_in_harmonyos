# 版本级 manifest — kea-hook-legal-log 3.0.3
# 文件位置: archives/k/kea-hook-legal-log/3.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.3"
software: "kea-hook-legal-log"

# 编译状态: published | built | failed | archived
status: published

build_date: "2026-09-29"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dcrypto=openssl"
    - "-Dmysql=disabled"
    - "-Dpostgresql=disabled"
    - "-Dnetconf=disabled"
    - "-Dkrb5=disabled"
  dependencies:
    - boost/1.85.0
    - log4cplus/2.2.0.1
    - openssl/3.5.8.1
    - gtest/1.17.0.1
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================

artifacts:
  - "lib/kea/hooks/libdhcp_legal_log.so"
  - "lib/libkea-*.so* (hook 运行时依赖闭包，20 个 kea 库)"

# ============================================================
# 上游测试（build() 内真实执行）
# ============================================================

upstream_tests:
  command: "meson test -v -C <builddir> dhcp-forensic-log-tests dhcp-forensic-log-libloadtests"
  suites_run: 2
  # 源码 TEST/TEST_F 宏计数：tests/ 85（command_log 7+3 + legal_log4 17 +
  # legal_log6 27+1 + legal_log_mgr 11 + rotating_file 19）+ libloadtests/ 10
  cases_in_source: 95
  root_cases: 0
  root_cases_detail: "无：全部用例使用文件后端（ForensicLog）+ 内存后端，无 SOCK_RAW、无 root 依赖、无数据库后端依赖"
  # 本配置注册数：85 + 6 = 91（libloadtests 的 PgSqlLegalLibLoadTest 2 +
  # MySqlLegalLibLoadTest 2 共 4 例受 HAVE_PGSQL/HAVE_MYSQL 守卫，
  # -Dmysql/-Dpostgresql=disabled 下不编译不注册，见 cases_unregistered）
  # 真机实测回填（2026-09-29 二轮 conan-verify，含补丁 0006；见 notes.md 与 reports/ 目录）
  cases_run: 91
  cases_passed: 91
  cases_failed: 0
  cases_skipped: 0
  cases_unregistered: 4
  cases_unregistered_reason: "源码 TEST/TEST_F 宏 95 个（85 + 10）；libloadtests 中 PgSqlLegalLibLoadTest(2)/MySqlLegalLibLoadTest(2) 共 4 例受 HAVE_PGSQL/HAVE_MYSQL 守卫，本配方不提供 mysql/postgresql 依赖，上游构建不编译该 4 例（属上游按配置裁剪，非适配删除）；本配置注册 91 例"

# ============================================================
# 鸿蒙特有测试（test_package，3 个用例）
# ============================================================

ohos_specific_tests:
  count: 3
  entries:
    - "test_package/test_legal_log_hook.c → test_legal_log_hook（hook 加载与契约）"
    - "test_package/test_ohos_platform.c → test_ohos_platform（平台 ABI）"
    - "test_package/test_ohos_runtime.c → test_ohos_runtime（运行时闭包）"
  command: "./test_legal_log_hook <so> && ./test_ohos_platform <so> && ./test_ohos_runtime <so>"
  checks:
    - "dlopen(RTLD_NOW) 加载 hook，KEA_HOOKS_VERSION == 30003，load/unload 契约符号可解析"
    - "ELFCLASS64 + e_machine == EM_AARCH64（OHOS PC aarch64 目标机）"
    - "DT_NEEDED 链接 OHOS musl libc（libc.so），且不含 glibc 命名（libc.so.6）"
    - "DT_NEEDED 链接 OHOS libc++ 运行库（libc++_shared.so），且不含 GNU libstdc++ 命名"
    - "OHOS 加载器 dlopen(RTLD_NOW|RTLD_LOCAL) 可解析插件及其 Kea 运行库闭包"
    - "包内 Kea 运行时库（lib/libkea-*.so*）在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 成功"
    - "闭包驻留后 hook 仍可加载，load/unload 契约符号可在运行时解析"
  cases_run: 3
  cases_passed: 3
  cases_failed: 0

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson.build.patch"
  - "0002-src-lib-dhcp-iface_mgr_linux.cc.patch"
  - "0003-meson.build.patch"
  - "0004-src-lib-process-cfgrpt-meson.build.patch"
  - "0005-src-hooks-dhcp-forensic_log-rotating_file.cc.patch"
  - "0006-src-hooks-dhcp-forensic_log-rotating_file.cc.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Meson 报告 OHOS 为 system='harmonyos'，Kea 的 build_machine.system() 白名单不含它：需在顶层归一化为 linux 才会选中 Linux 源码分支（iface_mgr_linux.cc / pkt_filter_lpf.cc）"
  - "OHOS sysroot 的 linux/socket.h（bionic 派生）定义 struct sockaddr_storage，与 musl sys/socket.h 冲突：用 define-guard 重命名内核侧定义（__linux__ && !__GLIBC__ 守卫）"
  - "OHOS musl pthread.h 不声明 pthread_setcancelstate，boost/core sp_thread_sleep.hpp 依赖它：定义 BOOST_SP_NO_PTHREAD_SETCANCELSTATE（boost 官方逃生宏）"
  - "OHOS 上 CPython subprocess 走 posix_spawn，不按 PATH 解析可执行名：裸名 'llvm-ar'（来自宿主 AR 环境变量）执行报 ENOENT，即使 which 能找到——须在 machine file 注入绝对路径"
  - "Conan MesonToolchain 默认只设 pkg_config_path=generators_folder，需同时使用 PkgConfigDeps 生成依赖 .pc，meson 才能解析 boost/log4cplus/openssl/gtest"
  - "Meson 的 cpp.run() 特性探针在 native 构建下会真实执行，host 共享依赖（log4cplus）必须通过 LD_LIBRARY_PATH 在配置期可见（缺失时探针返回 127，上游 meson.build:824 报 Unknown variable 'log4cplus'）"
  - "制品仓 boost/1.85.0 无 libboost_system，需 meson >= 1.10 的 header-only 模块回退；meson 版本必须 >= 1.10"
  - "OHOS 内核拒绝 shebang 脚本 execve（与可执行位无关）：conan 的 meson 包 bin/meson 是 shell 包装脚本，必须 sh '<meson 包>/bin/meson' 调用；meson 的 run_command 数组首参语法（['/bin/sh', 脚本] / [python3, 脚本]）真机验证通过"
  - "Kea configure 期直接执行自带脚本：scripts/env.sh、scripts/grabber.py、生成的 config-report.sh、tools/mk_cfgrpt.sh——补丁把脚本变量重定义为解释器前缀数组，所有调用点零改动"
  - "OHOS /storage 沙箱拒绝创建符号链接（ln -s → EPERM）：meson 以 version: 'N.M.K' 构建共享库时只以符号链接发布 soname 名，加载器按 NEEDED 名查找全部落空——build() 在 compile 后以复制方式物化 soname 名（_materialize_sonames，幂等）"
  - "真机曾出现 package 产物落盘为 0 字节的瞬时问题（/storage 写回异常）：package() 收尾增加空产物复核，0 字节的 Kea 库从构建树重拷（自愈 + WARNING 日志），test_package 的运行时闭包测试逐个 dlopen 兜底拦截回归"
  - "OHOS app 沙箱限制并发进程数：真机 20 核 + ninja 默认并行度 ≈45 活进程瞬时超配额 → posix_spawn EAGAIN 编译中道崩殂——配方编译行须以 -j 8 限并发"
  - "legal-log 插件运行时进程生成（ProcessSpawnImpl::spawn = fork + execve + _exit，无 shell 回退）：OHOS 内核拒 shebang execve 时 prerotate/postrotate 脚本必死 → 补丁 0005 在 musl-Linux 上把命令经 /bin/sh 路由（脚本路径作 $1，参数语义不变），glibc/Linux 保留原直接 execve 路径（rotating_file 三 spawn 用例真机实测覆盖）"
  - "legal-log 的 libloadtests 源码 10 例中 4 例受 HAVE_PGSQL/HAVE_MYSQL 守卫（PgSql/MySqlLegalLibLoadTest 各 2），-Dmysql/-Dpostgresql=disabled 下上游构建即不编译（属上游按配置裁剪，非适配删除用例）；tests/ 85 例全部注册——本插件无 root 组、无未注册用例，是 kea hook 家族中测试面最干净的插件之一（与 host-cmds 同级）"
  - "OHOS app 沙箱把 /tmp 等系统目录以只读挂载，上游测试假设 /tmp 可写（LegalLogMgrTest.pathEnvVarOverride 设 KEA_LEGAL_LOG_DIR=/tmp）：补丁 0006 在打开失败且 errno ∈ {EROFS, EACCES} 时回退到 $HOME/.kea-legal-log/（路径 '/' 转 '_' 防碰撞，mkdir 幂等），配置字符串与 PathChecker 校验消息原样保留——重定向只能在文件打开层做，不能改 getLogPath() 的返回值（上游测试断言 BadValue 消息里嵌着 '/tmp'）"

