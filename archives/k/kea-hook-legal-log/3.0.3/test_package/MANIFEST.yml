# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 要求存在）
package: kea-hook-legal-log/3.0.3
homepage: "https://www.isc.org/kea/"

# 上游测试入口：Meson 注册的两个 test() 套件（build() 内真实执行）
upstream_check_command: "meson test -C <builddir> dhcp-forensic-log-tests dhcp-forensic-log-libloadtests"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir> dhcp-forensic-log-tests dhcp-forensic-log-libloadtests"

# 上游实际运行的测试程序（源码 TEST/TEST_F 宏计数：85 + 10 = 95）
upstream_tests:
  - file: dhcp-forensic-log-tests
    source: src/hooks/dhcp/forensic_log/tests/
    description: >-
      legal log (forensic log) hook 单元测试（command_log 7+3 / legal_log4 17 /
      legal_log6 27+1 / legal_log_mgr 11 / rotating_file 19，共 85 个用例，
      与源码 TEST/TEST_F 宏数一致，无未注册用例）。其中 rotating_file 的
      prerotateActions/postrotateActions/prerotateAndPostrotateActions 三例
      真实执行测试脚本（forensic_prerotate_test.sh / forensic_postrotate_test.sh，
      configure_file copy 自 .sh.in 模板），在 OHOS 上由补丁 0005 经 /bin/sh
      路由执行，见版本级 notes.md
    command: "./dhcp-forensic-log-tests"
  - file: dhcp-forensic-log-libload-tests
    source: src/hooks/dhcp/forensic_log/libloadtests/
    description: >-
      10 个 gtest 用例，校验 libdhcp_legal_log.so 可被 Kea hook 框架
      加载/卸载（meson 注册的套件名 dhcp-forensic-log-libloadtests）。
      其中 PgSqlLegalLibLoadTest(2)/MySqlLegalLibLoadTest(2) 共 4 例受
      HAVE_PGSQL/HAVE_MYSQL 守卫，本配方 -Dmysql/-Dpostgresql=disabled
      下不编译不注册，实注册 6 例（LegalLibLoadTest，dhcp4/dhcp6 各 3）
    command: "./dhcp-forensic-log-libload-tests"

# test_package 中自带的测试（1 项消费者契约 + 2 项鸿蒙特有）
test_package_tests:
  - file: test_legal_log_hook.c
    description: "dlopen() 加载包内 hook 插件并校验 version/load/unload 契约符号与 hook ABI 版本"
    command: "./test_legal_log_hook <package>/lib/kea/hooks/libdhcp_legal_log.so"
  - file: test_ohos_platform.c
    description: >-
      鸿蒙特有 #1（平台 ABI）：校验包内 libdhcp_legal_log.so 的 OHOS 平台 ABI 特征
      （ELFCLASS64 / EM_AARCH64、DT_NEEDED 链接 musl libc.so 且非 glibc libc.so.6、
      链接 libc++_shared.so）并验证 OHOS 加载器可 dlopen(RTLD_NOW) 解析
    command: "./test_ohos_platform <package>/lib/kea/hooks/libdhcp_legal_log.so"
    ohos_specific: true
  - file: test_ohos_runtime.c
    description: >-
      鸿蒙特有 #2（运行时闭包）：在 OHOS 加载器下逐个 dlopen(RTLD_NOW) 包内
      20 个 Kea 运行时库（lib/libkea-*.so*），校验完整 NEEDED 闭包可解析、
      闭包驻留后 hook 仍可加载且 load/unload 契约符号可解析
    command: "./test_ohos_runtime <package>/lib/kea/hooks/libdhcp_legal_log.so"
    ohos_specific: true

# 鸿蒙特有测试用例统计（test_package 内，实测结果见版本级 notes.md）
ohos_specific_tests:
  count: 2
  entries:
    - test_ohos_platform
    - test_ohos_runtime
  command: "./test_ohos_platform <so> && ./test_ohos_runtime <so>"

# 上游测试用例宏总数（本次适配源码计数：85 + 10；实际注册执行数见版本级 manifest）
assertion_count: 95
