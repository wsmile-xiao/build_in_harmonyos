# conandata.yml — kea-hook-legal-log 3.0.3 (ISC Kea)
# Upstream release tarball from the ISC ftp server (official source).
# Patches 0001-0004 act on the top-level tree and are byte-identical with the
# kea-hook-ping-check/kea-hook-host-cmds family recipes; patches 0005/0006 are
# new to this recipe (RotatingFile prerotate/postrotate script spawn through
# /bin/sh, and a writable-scratch fallback for log paths under the read-only
# HarmonyOS PC system directories).
sources:
  url: "https://ftp.isc.org/isc/kea/3.0.3/kea-3.0.3.tar.xz"
  sha256: "09702ddb078b637e85de9236cbedd3fb9d7af7c6e797026c538b45748ad4d631"

patches:
  - patch_file: "patches/0001-meson.build.patch"
    patch_description: "Normalize the HarmonyOS/OpenHarmony system name to Linux so the Meson platform branch selects the Linux sources and flags"
    patch_type: "portability"
  - patch_file: "patches/0002-src-lib-dhcp-iface_mgr_linux.cc.patch"
    patch_description: "Rename the UAPI struct sockaddr_storage while including the netlink headers, avoiding its redefinition against the musl sys/socket.h one"
    patch_type: "portability"
  - patch_file: "patches/0003-meson.build.patch"
    patch_description: "Invoke the configure-time helper scripts (env.sh, cd-and-run.sh, grabber.py, config-report.sh) through their interpreters (sh/python3) because the HarmonyOS PC kernel refuses script execve"
    patch_type: "portability"
  - patch_file: "patches/0004-src-lib-process-cfgrpt-meson.build.patch"
    patch_description: "Invoke tools/mk_cfgrpt.sh through /bin/sh when generating config_report.cc because the HarmonyOS PC kernel refuses script execve"
    patch_type: "portability"
  - patch_file: "patches/0005-src-hooks-dhcp-forensic_log-rotating_file.cc.patch"
    patch_description: "Route the RotatingFile prerotate/postrotate commands through /bin/sh on musl-based Linux (the HarmonyOS PC kernel refuses script execve and ProcessSpawn runs execve without a shell fallback), keeping the direct execve path on glibc/Linux"
    patch_type: "portability"
  - patch_file: "patches/0006-src-hooks-dhcp-forensic_log-rotating_file.cc.patch"
    patch_description: "Fall back to a writable scratch location under $HOME when opening the log file fails with EROFS/EACCES (the HarmonyOS PC sandbox mounts system directories such as /tmp read-only), keeping the configured path untouched in all configuration strings"
    patch_type: "portability"
