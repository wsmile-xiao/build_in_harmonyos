software: gpac
version: "2.4.0"
status: built
build_system: autotools
build_date: "2026-06-01"

source:
  url: "https://github.com/gpac/gpac/archive/refs/tags/v2.4.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--target-os=Linux"
    - "--static-bin"
    - "--disable-player"
    - "--disable-ssl"
    - "--disable-jpeg"
    - "--disable-png"
    - "--disable-mad"
    - "--disable-faad"
    - "--disable-vorbis"
    - "--disable-theora"
    - "--disable-xvid"
    - "--disable-alsa"
    - "--disable-pulseaudio"
    - "--disable-jack"
    - "--disable-oss"
    - "--disable-dvb4linux"
    - "--disable-x11"
    - "--disable-qjs"
    - "--disable-sdl"
    - "--disable-ffmpeg"
    - "--disable-freetype"
    - "--disable-openjpeg"
    - "--disable-nghttp2"
    - "--disable-libcaca"
    - "--disable-ogg"
    - "--disable-lzma"
    - "--disable-a52"
    - "--disable-directfb"
    - "--disable-ipv6"
    - "--disable-resample"
  dependencies:
    - zlib/system
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "gpac configure uses custom shell script (not autoconf), needs --target-os=Linux on HarmonyOS"
  - "resample_audio filter depends on compositor audio_mixer, must --disable-resample when compositor disabled"
  - "static-bin builds libgpac_static.a + MP4Box static binary"
  - "cp --no-preserve not supported by toybox cp on HarmonyOS"
