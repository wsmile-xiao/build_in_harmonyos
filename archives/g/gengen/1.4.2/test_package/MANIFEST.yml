# test_package/MANIFEST.yml — gengen 1.4.2
package: gengen/1.4.2
homepage: "https://www.gnu.org/software/gengen/"

# 上游测试命令（tests/ 金标 diff 套件 + src/tests 单元测试 + tests/otherdir）
upstream_check_command: "make check"

# 上游测试未集成进 conanfile build()：conan create 只构建并运行 test_package；
# 上游套件在设备探索阶段实际运行，证据见版本级 notes.md 四维账本与 reports/
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试
upstream_tests:
  - file: "tests/（金标 diff 套件）+ src/tests（单元测试）+ tests/otherdir（--output-dir 行为）"
    source: "gengen-1.4.2/tests, gengen-1.4.2/src/tests"
    description: "make check：35 个生成文件金标 diff + 8 个错误输出 diff + 1 个 verbose diff + tests/otherdir 4 个 --output-dir diff + src/tests 4 个单元测试程序（test_replace / test_exp_checker / test_exp_generator / test_type_env）"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.py
    description: "消费者闭环：gengen 生成 demo.h → 断言内容契约 → 编译生成代码 → 运行并逐字断言输出"
    command: "python3 test.py <bin/gengen>"

# 测试断言总数（消费者 test.py 7 项：生成 1 + 内容契约 4 + 编译 1 + 运行输出 1）
assertion_count: 7
