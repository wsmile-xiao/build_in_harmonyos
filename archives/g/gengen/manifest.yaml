software: gengen
display: "GNU gengen"
description: "通用代码文本生成器 — 读 .cc_skel 骨架文件，生成带缩进文本生成能力的 C/C++ 类（gengetopt 的底层）"
category: devtools
homepage: "https://www.gnu.org/software/gengen/"
license: GPL-3.0-or-later
build_system: autotools

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "Autotools 构建系统；纯工具型包（只装 bin/gengen，libgengen.a 为 noinst，无公开头文件）"
    - "2010 版 config.guess/config.sub：config.guess 在 HMDFS 上无法建临时文件且不识 HarmonyOS，config.sub 拒绝 ohos/musl triplet；显式 --build=--host=aarch64-unknown-linux-gnu 跳过猜测（E007/E160）"
    - "configure 内嵌 umask 077 需替换为 022（E011/E129，HMDFS 临时目录权限）"
    - "flex 生成码 src/scanner.cc 含 register 存储说明符，C++17（profile cppstd=17）下必须移除"
    - "设备/CI 无 texinfo：MAKEINFO=true + 顶层 Makefile SUBDIRS 行收窄为 lib src（不可用命令行 SUBDIRS 或 make -C src，gengetopt 实撞）"

common_dependencies: []

versions:
  "1.4.2":
    status: built
    build_date: "2026-09-12"
