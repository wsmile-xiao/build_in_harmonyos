# conandata.yml — gnudos 2.0

sources:
  url: "https://ftp.gnu.org/gnu/gnudos/gnudos-2.0.tar.gz"
  sha256: "887c88f8c94a3c35469dda1b96a3ea46e6b2fbcaba625ca722c5197ea4b1c41a"

patches:
  - patch_file: "patches/0001-musl-fcloseall-to-fflush.patch"
    patch_type: portability
    patch_description: "OHOS musl libc lacks the glibc fcloseall() extension; flush all output streams with fflush(NULL) instead (streams are closed at process exit)"
    patch_source: "GLM-56"
    strip: 1
  - patch_file: "patches/0002-musl-mode_t-type-name.patch"
    patch_type: portability
    patch_description: "OHOS musl sysroot defines mode_t (not the glibc-internal __mode_t alias); normalize the type name in prime/edit.c"
    patch_source: "GLM-56"
    strip: 1
