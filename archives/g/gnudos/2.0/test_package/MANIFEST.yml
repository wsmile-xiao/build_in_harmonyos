# test_package/MANIFEST.yml — gnudos 2.0
# CI L0e requires this file to exist.

package: gnudos/2.0
homepage: "https://www.gnu.org/software/gnudos/"

# gnudos 2.0 ships no automated test suite: no TESTS/check_PROGRAMS in any
# Makefile.am, no tests/ harness (verified against the 2.0 release).
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Runs the installed mino and prime binaries (linked against the packaged ncurses) with --version, asserting the reported program version 2.1 and exit 0"
    command: "bash test.sh"

# mino version + prime version assertions
assertion_count: 2
