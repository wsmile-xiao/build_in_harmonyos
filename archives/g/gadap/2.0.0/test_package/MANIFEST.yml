# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gadap/2.0.0
homepage: "https://cola.gmu.edu/grads/gadap/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试 (make check 构建并运行
# test 程序冒烟; 真实数据测试依赖 test.opendap.org 外部服务器,
# 2026-09 实测数据集路径已 404, 不纳入 pass/fail 判定)
upstream_test_in_build: true
upstream_test_command: "make check && ./test/test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cc
    source: gadap-2.0/test/test.cc
    description: "test program for the gadap library (open/close dataset, var enumeration, station query)"
    command: "./test <OPeNDAP-URL>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cc
    description: "消费者测试：gadap_numopen/gadap_open(错误路径)/gadap_handle(越界)/gadap_sq_new(无效句柄) API 行为断言"
    command: "./gadap_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
