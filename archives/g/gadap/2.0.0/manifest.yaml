# 版本级 manifest — gadap 2.0.0（上游 gadap 2.0 同源码，平台任务版本字段 "2" 有误已反馈）
# 遵循 ARCHIVE-SPEC v2.0

version: "2.0.0"
software: gadap
status: built
build_date: "2026-09-03"
build_system: autotools

source:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/g/gadap/gadap_2.0.orig.tar.gz"
  sha256: "ae9a989ca00ec29fb40616383d170883f07c022456db338399982a8a94ec0100"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
  - "--enable-static"
  - "--disable-shared"
  dependencies:
  - libdap/3.20.6
  - libxml2/2.15.3
  - curl/8.15.0
  - libtirpc/1.3.7
  - uuid/2.40.1
  cc: clang
  cxx: clang++

patches_applied:
- "0001-configure.patch"
- "0002-src-gaBaseTypes.h.patch"
- "0003-src-gaReports.cc.patch"
- "0004-src-gaTypeFactory.h.patch"
- "0005-src-gaUtils.h.patch"
- "0006-test-Makefile.in.patch"
- "0007-test-test.cc.patch"
- "0008-src-gaConnect.h.patch"
- "0009-src-gaConnect.cc.patch"
- "0010-src-gaUtils.cc.patch"
- "0011-src-gadap.cc.patch"

knowledge_gained:
- "libdap 3.20.6 conan 包的 dap-config 有打包缺陷 (prefix=/ 空 + 硬编码构建时 cache 路径): 下游 gadap 的 AC_CHECK_LIBDAP 检测需在配方 generate() 生成重定位版 dap-config 注入 DAP_CONFIG 环境变量 (与 libdap 配方重写 .pc 同源手法)"
- "libdap 3.20.6 的 Connect 对非 http 名字走 _local 分支 (d_http=0), request_dds 解引用空指针 segfault — gadap/libdap 只支持 OPeNDAP 远程数据源, 消费者测试必须用 http URL 错误路径, 不能用本地文件路径"
- "tar 解压保留 2008 时间戳, patch 更新 configure 后 Makefile 的 am--refresh/config.status--recheck 会用设备 autoconf 2.72 重生成 configure (行号漂移 + 引入 E011): build() 里 touch -r configure.ac 拉平生成文件时间戳防重生成"
- "上游代码 2008 年 + libdap 头 strstream/ostrstream: CXXFLAGS 显式覆盖 -std=c++11 (profile cppstd=17 的 -std=c++17 会编不过, libdap 配方同因)"
- "C++ 异常跨库边界传播验证: gadap_open(不可达 http URL) → libdap Error → gaConnect 构造中断 → gadap catch 返回 errval(GADAP_ERR_DAP_ERROR) = -1 * 枚举值"

patch_classification:
  - file: 0001-configure.patch
    type: manual
    platform_only: True
    guard: none
    note: "configure 探测修复: VERSION→GADAP_VERSION (HMDFS 大小写不敏感遮蔽 libc++ <version> 头) + 临时目录 mkdir -m 700 (E011 umask 077 陷阱)"
  - file: 0002-src-gaBaseTypes.h.patch
    type: auto
    platform_only: False
    guard: none
    note: "libdap 3.20.6 命名空间适配: 有限 using 声明引入 gaBaseTypes.h 用到的类型"
  - file: 0003-src-gaReports.cc.patch
    type: auto
    platform_only: False
    guard: none
    note: "补 #include <cstring> (strcpy) + using namespace libdap (.cc 内不污染其他翻译单元)"
  - file: 0004-src-gaTypeFactory.h.patch
    type: auto
    platform_only: False
    guard: none
    note: "libdap 3.20.6 命名空间适配: gaTypeFactory.h 基类引用所需类型 using 声明"
  - file: 0005-src-gaUtils.h.patch
    type: auto
    platform_only: False
    guard: none
    note: "libdap 3.20.6 命名空间适配: gaUtils.h 所需类型 using 声明"
  - file: 0006-test-Makefile.in.patch
    type: manual
    platform_only: True
    guard: none
    note: "VPATH 构建下 test_LDADD 从 $(top_srcdir)/src/ 改 $(top_builddir)/src/"
  - file: 0007-test-test.cc.patch
    type: manual
    platform_only: False
    guard: none
    note: "test.cc 补 #include <cstring> (strcmp)"
  - file: 0008-src-gaConnect.h.patch
    type: auto
    platform_only: False
    guard: none
    note: "libdap 3.20.6 命名空间适配: gaConnect.h (Connect/DAS/DDS/AttrTable/Array)"
  - file: 0009-src-gaConnect.cc.patch
    type: auto
    platform_only: False
    guard: none
    note: "libdap 3.20.6 命名空间适配: gaConnect.cc (DataDDS)"
  - file: 0010-src-gaUtils.cc.patch
    type: auto
    platform_only: False
    guard: none
    note: "libdap 3.20.6 命名空间适配: using namespace libdap (.cc 内)"
  - file: 0011-src-gadap.cc.patch
    type: auto
    platform_only: False
    guard: none
    note: "libdap 3.20.6 命名空间适配: using namespace libdap (.cc 内)"
