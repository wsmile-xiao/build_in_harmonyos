# 软件级 manifest — gadap
# 遵循 ARCHIVE-SPEC v2.0

software: gadap
display: "gadap"
description: "GADAP: GrADS Client Interface for OPeNDAP in-situ (station) data — C++ library"
homepage: "https://cola.gmu.edu/grads/gadap/"
license: GPL-2.0-or-later
category: net
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 2008 年代码针对无命名空间旧 libdap, 11 个补丁适配 libdap 3.20.6 conan 包的 namespace libdap"
    - "libdap conan 包 dap-config 打包缺陷 (prefix=/ + 硬编码路径), 配方 generate() 生成重定位版注入 DAP_CONFIG"
    - "libdap 3.20.6 Connect 本地文件分支 d_http=0 空指针解引用, 消费者只能走 OPeNDAP http URL"
    - "tar 2008 时间戳 + patch 后触发 autoconf 2.72 重生成 configure, build() touch -r 拉平时间戳"
  status: adapted

versions:
  - version: "2.0"
    status: built
    date: "2026-08-03"
    notes: "cmd-pkgs 系统包方案（PR4455 已合入）— libdap 由系统预编译包提供，制品仓已发布 gadap/2.0"
  - version: "2.0.0"
    status: built
    date: "2026-09-05"
    notes: "conan requires 重写版 (libdap/3.20.6 制品仓已发布), test_package 7/7 断言通过, 详见 2.0.0/notes.md"
