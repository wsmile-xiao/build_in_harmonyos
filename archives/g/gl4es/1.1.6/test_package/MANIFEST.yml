# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: gl4es/1.1.6
homepage: "https://github.com/ptitseb/gl4es"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# gl4es 顶层 CMakeLists 的 create_test() 使用 test.cmake + tests/ 参考图哈希，
# 需要真实 X11/GL 渲染输出对比，无窗口/无 GPU 的 CI 环境不可运行，故未集成。
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游测试用例合计 N = 8（见下方 upstream_tests 列表）。
# 上游 gl4es CMakeLists.txt 用 enable_testing() + create_test/create_test_GLES 注册 8 个渲染测试，
# 经 test.cmake -> tests/test.sh 运行外部渲染程序(glxgears/各游戏)并做参考图比对；
# OHOS PC 无 X11 且这些外部二进制不可得 -> 记录保留、不运行；等价的 R34 离屏渲染见 test_package_tests。
upstream_tests:
  - file: glxgears
    description: "create_test 注册的 GLX 渲染基准；需 X11/GL render + 参考图比对，OHOS 不可运行"
    command: ""
  - file: stuntcarracer
    description: "create_test 注册；需外部游戏二进制 + X11，OHOS 不可运行"
    command: ""
  - file: neverball
    description: "create_test 注册；需外部游戏二进制 + X11，OHOS 不可运行"
    command: ""
  - file: foobillardplus
    description: "create_test 注册；需外部游戏二进制 + X11，OHOS 不可运行"
    command: ""
  - file: descent3
    description: "create_test 注册；需外部游戏二进制 + X11，OHOS 不可运行"
    command: ""
  - file: pointsprite
    description: "create_test 注册；需外部游戏二进制 + X11，OHOS 不可运行"
    command: ""
  - file: openra
    description: "create_test_GLES 注册；GLES2 渲染，需外部二进制 + X11，OHOS 不可运行"
    command: ""
  - file: glsl_lighting
    description: "create_test_GLES 注册；GLES2 渲染，需外部二进制 + X11，OHOS 不可运行"
    command: ""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试（R34）：EGL pbuffer GLES2 上下文 + 用 gl4es 画固定管线三角形 + glReadPixels 校验（深蓝清屏：背景像素==清屏色、中心像素≠背景且非黑、非背景像素>200、glGetError==0）"
    command: "./test_gl4es"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
