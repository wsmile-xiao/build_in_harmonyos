sources:
  # E276: codeload URL ends with /v1.1.6 (no extension) -> Conan misdetects &.gz as zip.
  # Provide `filename` with .tar.gz so get() uses untar.
  url: "https://codeload.github.com/ptitseb/gl4es/tar.gz/refs/tags/v1.1.6"
  sha256: "dca1d897e492a0cb163a3390f273fbd4cc7ab2367d236d93dc2b321ce108ed5c"
  filename: "gl4es-1.1.6.tar.gz"
patches:
  # E: cmake 4.x removed compatibility with CMake <3.5; gl4es still requires 2.8.12.
  - patch_file: "patches/0001-cmake-minimum-35.patch"
    base_path: "."
