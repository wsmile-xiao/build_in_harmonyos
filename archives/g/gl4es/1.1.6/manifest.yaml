# 版本级 manifest
# 文件位置: archives/g/gl4es/1.1.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.6"

# 软件名
software: "gl4es"

# 编译状态
# published | built | failed | archived
# 注：本地已完成配方整理并验证可构建；CI 将完成 R26 构建 / R34 验证 / 发布 ohpcd。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-30"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源码 URL（codeload tar.gz，无扩展名 -> conandata.yml 用 filename 补 .tar.gz）
  url: "https://codeload.github.com/ptitseb/gl4es/tar.gz/refs/tags/v1.1.6"

  # 源码校验和
  sha256: "dca1d897e492a0cb163a3390f273fbd4cc7ab2367d236d93dc2b321ce108ed5c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（gl4es 专用：NOX11 关 X11、DEFAULT_ES=2 用 GLES2 后端、CMAKE_SYSTEM_NAME=Linux 才编 GLX/EGL 后端）
  configure_options:
    - "-DNOX11=ON"
    - "-DNOEGL=OFF"
    - "-DDEFAULT_ES=2"
    - "-DCMAKE_SYSTEM_NAME=Linux"

  # 编译依赖列表（格式: name/version）—— gl4es 无额外 conan 依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-cmake-minimum-35.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gl4es 顶层 CMakeLists 无 install() 装头文件；仅 install(TARGETS ... DESTINATION /usr/lib/gl4es/)（绝对路径，无视 prefix）—— package() 必须手动复制 libGL.so.1 + include/，并建 libGL.so->libGL.so.1 软链"
  - "gl4es 仅在 CMAKE_SYSTEM_NAME 匹配 'Linux' 时编译 GLX/EGL 后端（src/CMakeLists 的 glx/*.c）；OHOS 下须强制 CMAKE_SYSTEM_NAME=Linux"
  - "共享库 SUFFIX 为 .so.1（无 libGL.so 软链），链接 -lGL 需手动建软链"
  - "E276: codeload tar.gz URL 无扩展名，conandata.yml 需 filename: gl4es-1.1.6.tar.gz 让 get() 用 untar"
  - "运行时须设 LIBGL_GLES=/system/lib64/libGLESv3.so、LIBGL_EGL=/system/lib64/libEGL.so（OHOS 无 libGLESv2.so，只有 libGLESv3.so）"
  - "本地离屏渲染验证 PASS（EGL pbuffer GLES2 上下文 + 固定管线三角形 glReadPixels：nonblack=512/4096（纯黑清屏，仅三角形区非黑、具区分度）、中心(58,66,131)、glGetError=0x0）；test_package 即为该 R34 真实离屏渲染测试，随 conan create 由 CI 执行（find_library(EGL) 通过将 ohos sysroot 的 usr/lib/aarch64-linux-ohos 与 /system/lib64 加入搜索路径解决）；本地 CI 模拟（ci/conan/build_and_test.sh）已通过：nonblack=512/4096、glGetError=0x0"
