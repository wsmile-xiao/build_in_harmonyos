# test_package/MANIFEST.yml — gnu-pw-mgr 2.7.4
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gnu-pw-mgr/2.7.4
homepage: "https://www.gnu.org/software/gnu-pw-mgr/"

# 上游测试命令（tests/base.test、tests/dom.test 两个 shell 测试脚本）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试（2 项全部执行，均失败于环境限制，详见 notes.md）：
# - base.test：脚本向 /dev/tty 写入测试标识，OHOS SSH 会话无控制终端
#   （"can't create /dev/tty: No such device or address"）
# - dom.test：测试基线由平台 /usr/bin/printf（busybox 语义，%-10.10lu 空格
#   填充）生成，而程序输出经 musl libc printf（POSIX 精度语义，零填充），
#   两侧工具格式语义不一致导致 cmp 失配——程序本体执行链路（配置解析、
#   域存储、输出）均正常运行
upstream_tests:
  - file: tests/base.test
    source: gnu-pw-mgr-2.7.4/tests/base.test
    description: "上游功能测试：口令派生与 TEST ONLY TAG 标识（失败于 /dev/tty 缺失）"
    command: "make check"
  - file: tests/dom.test
    source: gnu-pw-mgr-2.7.4/tests/dom.test
    description: "上游功能测试：域列表管理（失败于平台 printf 语义差异导致的基线失配）"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package/test.sh
    description: "运行安装后的 sort-pw-cfg：--version 冒烟 + 配置校验路径断言（缺 id 标签的配置必须被拒绝并给出 missing id tag 诊断）（1 个消费者程序，2 处断言）"
    command: "conan test test_package gnu-pw-mgr/2.7.4"

# Approximate assertion count
assertion_count: 2
