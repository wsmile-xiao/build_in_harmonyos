# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gsettings-desktop-schemas/49.1
homepage: "https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# gsettings-desktop-schemas 是纯数据/头文件包，无上游测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 gdesktop-enums.h 头文件可被正确包含和枚举值正确"
    command: "./test_gsettings_desktop_schemas"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
