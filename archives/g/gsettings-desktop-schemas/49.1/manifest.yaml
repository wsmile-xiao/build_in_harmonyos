software: gsettings-desktop-schemas
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/49.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "49.1"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（顶层字段用于验证）
build_system: meson

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-06"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/gsettings-desktop-schemas/49/gsettings-desktop-schemas-49.1.tar.xz"

  # 源码校验和
  sha256: "777a7f83d5e5a8076b9bf809cb24101b1b1ba9c230235e3c3de8e13968ed0e63"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dintrospection=false"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "glib-mkenums 是 Perl 脚本，需 wrapper 修正 shebang（/usr/bin/perl 不存在）"
  - "gsettings-desktop-schemas 是纯数据/头文件包，无库文件产出"
  - "必须禁用 introspection 选项（无 gobject-introspection 预编译包）"
