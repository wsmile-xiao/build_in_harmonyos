package: ghex/46.0
homepage: "https://gitlab.gnome.org/GNOME/ghex"

upstream_check_command: "meson test -C build"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_ghex.sh
    description: "静态验证 ghex 二进制 ELF 头 + 架构 + 动态依赖链"
    assertions:
      - "二进制存在且非空"
      - "ELF magic = 0x7f454c46"
      - "readelf -h 输出含 AArch64 + ELF64"
      - "readelf -d 动态依赖含 libgtkhex-4 / libgtk-4 / libadwaita-1"
    command: "sh test_ghex.sh <ghex_bin>"

assertion_count: 4
