# test_package 中自带的测试 (消费者视角验证)
# test.c = 消费者用例：仅通过已安装公开头文件/静态库调用 GUIslice 公开 API
# （gslc_Init + SDL2 驱动、页面/元素创建、页面切换、绘制与更新循环），
# 断言可观察结果（初始化成功、元素几何/ID、页切换、绘制循环无故障）。
test_package_tests:
  - file: test.c
    description: "消费者用例（HarmonyOS 专项）：headless SDL2 软件渲染下真实调用公开 API 并断言可观察结果，14/14 通过"
    command: "SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./test_guislice"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14