# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
# r02: 21 上游入口全量实例化/编译/运行（用户验收口径 21/21）

package: guislice/0.17.2
homepage: "https://github.com/ImpulseAdventure/GUIslice"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# GUIslice 无独立测试套件；Linux 构建入口为 examples/linux/Makefile。
# 21 个上游入口 = test_sdl1.c + test_sdl2.c + 19 个 ex*.c 示例。
# r02 已全部实际编译并在 OHOS headless（SDL_VIDEODRIVER=dummy）下运行：
#   - test_sdl2: 补丁 0001 去 OpenGL 标志 + 软件渲染，rc=1 设计成功码（源码 return 1）
#   - test_sdl1: 经 sdl12-compat/1.2.68（SDL1 API 兼容层，ohpcd 已发布）编译，rc=0
#   - 19 示例: 全部编译通过，headless 运行 rc=1（事件循环稳定）；ex22 补丁 0003
#     守卫 SDL1-only 的 SDL_EnableKeyRepeat
upstream_check_command: "make -C examples/linux all GSLC_DRV=SDL2"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（21 入口全量，r02 实际运行）
upstream_tests:
  - file: examples/linux/test_sdl2.c
    source: guislice-0.17.2/examples/linux/test_sdl2.c
    description: "SDL2 显示驱动自检（补丁 0001），headless 运行 rc=1=设计成功码"
    command: "./test_sdl2"
  - file: examples/linux/test_sdl1.c
    source: guislice-0.17.2/examples/linux/test_sdl1.c
    description: "SDL1 显示驱动自检 —— 经 sdl12-compat/1.2.68 兼容层实例化（ohpcd 已发布），headless 运行 rc=0"
    command: "./test_sdl1"
  - file: examples/linux/ex01_lnx_basic.c
    source: guislice-0.17.2/examples/linux/ex01_lnx_basic.c
    description: "示例（r02 全量：19/19 编译 + headless 运行 rc=1）"
    command: "./ex01_lnx_basic"
  - file: examples/linux/ex02_lnx_btn_txt.c
