patches:
  "0.17.2":
    - patch_file: "patches/0001-examples-linux-ex22_lnx_input_key.c.patch"
      patch_description: "OHOS/SDL2: ex22_lnx_input_key.c 使用 SDL1-only API SDL_EnableKeyRepeat（SDL2 已移除，按键重复由 SDL_KEYDOWN event.repeat 原生交付），按 DRV_DISP_SDL1 守卫使示例可在 SDL2 配置编译并 headless 运行（r02 21 入口全量要求）"
      patch_type: "portability"
    - patch_file: "patches/0002-examples-linux-test_sdl2.c.patch"
      patch_description: "OHOS: test_sdl2.c SDL smoke test — drop SDL_WINDOW_OPENGL and use SDL_RENDERER_SOFTWARE so the upstream test runs headless (SDL_VIDEODRIVER=dummy/offscreen) on the OpenGL-less ohpcd sdl2 build"
      patch_type: "portability"
    - patch_file: "patches/0003-src-GUIslice_drv_sdl.c.patch"
      patch_description: "OHOS: gate SDL_WINDOW_OPENGL behind DRV_SDL_RENDER_ACCEL (the ohpcd sdl2 build has no OpenGL backend, E092); fix GSLC_DEBUG_PRINT empty-vararg compile error by passing an empty argument at the single zero-arg call site; OHOS config header configs/ohos-sdl2-default.h is generated inside build() (software renderer, DRV_SDL_RENDER_ACCEL=0)"
      patch_type: "portability"