knowledge_gained:
  - "GUIslice 无顶层构建系统，嵌套源码检测会把 examples/linux（唯一含 Makefile 的子目录）误提升为源码根，需手动重建 .orig/.work 保留 src/ 真实库源码"
  - "OHOS SDL2（ohpcd sdl2 配方）无 OpenGL 后端（E092），GUIslice SDL2 驱动必须用软件渲染：配置 DRV_SDL_RENDER_ACCEL=0 并跳过 SDL_WINDOW_OPENGL"
  - "GSLC_DEBUG_PRINT 为变参宏，空参调用展开为 gslc_DebugPrintf(sFmt,__VA_ARGS__) 编译错误，需补空字符串实参"
  - "GUIslice 的 gslc_InitDebug 回调签名为 int16_t (*)(char)（逐字符回调），传入 char* 风格回调会导致 gslc_Init 内异常"
  - "r02: SDL1-only API（SDL_EnableKeyRepeat）在 SDL2 配置下按 DRV_DISP_SDL1 守卫（SDL2 以 event.repeat 原生交付按键重复）"
  - "r02: ohpcd 无原生 sdl/1.2.15，但 sdl12-compat/1.2.68 + sdl_ttf/2.0.11 已发布，可经 SDL1 兼容层实例化并运行 test_sdl1"
