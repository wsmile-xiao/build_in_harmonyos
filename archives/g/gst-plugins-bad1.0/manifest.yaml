software: gst-plugins-bad1.0
display: "GStreamer Bad Plugins (gst-plugins-bad1.0)"
description: "GStreamer plugins and support libraries with licensing or distribution concerns"
category: multimedia
homepage: "https://gstreamer.freedesktop.org/"
license: LGPL
build_system: meson

ohos_adaptation:
  key_points:
    - "gst-plugins-base 未发布到制品仓，以官方 tarball vendor 为 meson 子项目构建（同 gst-libav/#4376 配方模式）"
    - "zlib 须 override 到 1.3.1.1（PIC 静态库），否则 base 子项目共享库链接报 R_AARCH64 重定位错误"
    - "glib-mkenums 通过 meson native file [binaries] 钉到 conan glib2 包的 python3 实现（HNP 版本依赖缺失的 perl）"
    - "meson install 改写 DT_RUNPATH 会使 OHOS 内嵌 ELF 签名失效，package() 需用 build 原始产物覆盖（E504 模式）"
    - "消费端测试不能调用 gst_init()（静态 glib/gstreamer 每副本类型注册表死锁），采用 dlopen/dlsym 校验"
    - "平台不兼容插件禁用: gl / opensles / webp / orc"
  common_dependencies:
    - gstreamer/1.28.3
    - glib2/2.88.0
    - zlib/1.3.1.1

versions:
  "1.28.5":
    status: built
    build_date: "2026-09-19"
    notes: "版本跟进件（1.28.3→1.28.5 构建系统零差异平移 #4376 方案）；含 vendored gst-plugins-base 1.28.5 库与插件（base 未单独发布前的过渡形态）"
