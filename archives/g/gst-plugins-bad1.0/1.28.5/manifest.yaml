software: gst-plugins-bad1.0
version: "1.28.5"
build_system: meson
status: built
build_date: "2026-09-19"

# ============================================================
# Source info
# ============================================================

source:
  url:
    - "https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.28.5.tar.xz"
    - "https://cache.gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.28.5.tar.xz"
    - "https://download.gnome.org/sources/gst-plugins-bad/1.28/gst-plugins-bad-1.28.5.tar.xz"
  sha256: "d8af55faef2958c1a8663751475ee46f5164877cf4d8c5913ea906ef180aeb71"
  tar_format: tar.xz

# ============================================================
# Build configuration
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dnls=disabled"
    - "-Dexamples=disabled"
    - "-Dtests=disabled"
    - "-Ddoc=disabled"
    - "-Dintrospection=disabled"
    - "-Dgl=disabled"
    - "-Dopensles=disabled"
    - "-Dwebp=disabled"
    - "-Dorc=disabled"
    - "--wrap-mode=default (gst-plugins-base 1.28.5 vendored as meson subproject)"
    - "-Dgst-plugins-base:gl/x11/pango/ogg/vorbis/theora/alsa/...=disabled"
  dependencies:
    - gstreamer/1.28.3
    - glib2/2.88.0
    - zlib/1.3.1.1 (override; PIC static build)
  cc: clang
  cxx: clang++

# ============================================================
# Patch info
# ============================================================

patches_applied: []

# ============================================================
# Version follow-up analysis (1.28.3 -> 1.28.5)
# ============================================================

version_delta:
  build_system: "meson.build/meson.options 与 1.28.3 逐字节一致（仅版本号行差异），构建配置零改动平移"
  changed_files: 76
  changed_areas:
    - "gst-libs/gst (10 files)"
    - "sys/androidmedia (7)"
    - "ext/webrtc (7)"
    - "gst/videoparsers (6)"
    - "gst/mxf (6)"
    - "sys/va (3)"
    - "gst/rtmp2, pnm, closedcaption, vmnc; ext/svtav1, curl, dtls (杂项 bugfix)"

# ============================================================
# Knowledge gained
# ============================================================

knowledge_gained:
  - "gst-plugins-base 未发布 conan 包：官方 tarball vendor 为 meson subproject（#4376 已验证方案平移）"
  - "gstreamer core 1.28.3 满足 bad 1.28.5 的 meson 版本门（stable 线规则 gst_req='>= 1.28.0'，本地 configure 实测通过）"
  - "zlib override 到 1.3.1.1（PIC 静态库）避免 base 子项目 R_AARCH64 重定位错误"
  - "glib-mkenums 钉到 conan glib2 包的 python3 实现（HNP perl 脚本在 OHOS 不可用）"
  - "meson install 改写 DT_RUNPATH 失效 OHOS ELF 签名——package() 用 build 原始产物覆盖（E504 模式）"
  - "消费端测试不能调 gst_init()（静态 glib/gstreamer 每副本类型注册表死锁），用 dlopen/dlsym"
  - "平台不兼容插件禁用: gl（OHOS GL 头冲突）/ opensles（Android 专属）/ webp（静态符号冲突）/ orc（不在制品仓）"
  - "conan get() 原生支持 url 列表（首为主源，后续为镜像 fallback）"
