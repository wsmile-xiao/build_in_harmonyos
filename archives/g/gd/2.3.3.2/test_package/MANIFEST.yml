package: gd/2.3.3.2
homepage: "https://libgd.github.io/"

upstream_tests:
  - directory: tests
    description: "Upstream CMake test suite with image codec/font/data-driven checks"
  - directory: examples
    description: "Upstream examples and sample image generation programs"
upstream_test_command: "ctest --output-on-failure"
upstream_test_mode: "conan create -o gd/*:with_upstream_tests=True on a runnable OpenHarmony PC"

test_package_tests:
  - file: test_gd.c
    description: "Consumer test: version query, truecolor image creation, fill, pixel readback, and RGB channel checks"
    command: "./test_gd"

assertion_count: 8
