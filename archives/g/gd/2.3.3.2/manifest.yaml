version: "2.3.3.2"
status: built
build_date: "2026-08-14"

source:
  url: "https://github.com/libgd/libgd/releases/download/gd-2.3.3/libgd-2.3.3.tar.gz"
  sha256: "dd3f1f0bb016edcc0b2d082e8229c822ad1d02223511997c80461481759b1ed2"
  tar_format: tar.gz

build:
  system: cmake
  options:
    - "BUILD_STATIC_LIBS=ON"
    - "BUILD_SHARED_LIBS=OFF"
    - "BUILD_TEST=OFF by default; ON with with_upstream_tests=True for runnable-target validation"
    - "ENABLE_CPP=OFF"
    - "GD_PROGRAMS disabled"
    - "ENABLE_* image/dependency options=OFF for first pass"

patches_applied: []

knowledge_gained:
  - "gd can build a core in-memory image library with optional image codec/font stacks disabled"
  - "top-level CMake unconditionally enters tests/examples/docs and src builds helper commands by default; the recipe disables those paths for first-pass library packaging"
