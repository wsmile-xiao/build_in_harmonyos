software: gd
display: "GD Graphics Library"
description: "开源图像处理库，支持 PNG、JPEG、GIF、WebP 等格式"
category: gfx
homepage: "https://libgd.github.io/"
license: MIT-like
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 config.guess/config.sub 补丁支持 HarmonyOS"
    - "依赖 libpng、freetype、libjpeg-turbo 等多个图像库"
    - "configure 会检测可选依赖，缺失不影响核心功能"
  common_dependencies:
    - libpng
    - freetype
    - libjpeg-turbo

versions:
  "2.3.3":
    status: built
    build_date: "2026-04-25"
