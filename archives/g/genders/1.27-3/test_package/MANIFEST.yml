# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: genders/1.27-3
homepage: https://github.com/chaos/genders

# 上游测试命令 (用于 make -n check 分析)
# 注意：上游未注册 automake TESTS，`make check` 为 no-op（如实声明），
# 真实测试 harness 是 genders_test，由 build() 显式执行。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check && ./src/testsuite/libgenders/genders_test -v -v"

# make check 实际运行的测试程序
upstream_tests:
  - file: genders_test.c
    source: genders-genders-1-27-3/src/testsuite/libgenders/genders_test.c
    description: "上游唯一测试 harness：39 个 corner-case + 39 个 functionality 注册测试函数；默认零输出为设计行为，-v -v 打印逐项 PASS 与三行 Total；N=17847（运行级检查点），夹具 testdatabases/ 113 个文件"
    command: "./src/testsuite/libgenders/genders_test -v -v"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接安装的 libgenders（静态），16 项 API 断言（load/计数/isnode/isattr/isattrval/nodelist_create/query×2/nodelist_destroy/testquery/生命周期）"
    command: "./test_genders"
  - file: nodeattr 消费断言
    description: "nodeattr -f <test_genders 写出的夹具> -l 列出属性（rc=0），验证随包 CLI 可消费"
    command: "nodeattr -f test_genders_db.tmp -l"

# 测试断言总数 (近似值, 用于质量评估) = test.c 16 项 + nodeattr CLI 1 项
assertion_count: 17
