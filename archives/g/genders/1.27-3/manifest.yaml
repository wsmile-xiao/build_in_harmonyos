# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "语言预检假终态：src/extensions/{perl,python,java,cplusplus} 是语言绑定目录，其 Makefile.PL 会劫持 manifest 判定（lang_detect 的 _AUX_MANIFEST_DIRS 不含 extensions），占比 <70% 时判 perl → env_unsupported；按停点交接包「先排除绑定目录（R47 附录 D.4）重跑」+ 显式注入任务卡语言 OHPCD_LANG=c 后 detected=c、占比 89% 通过"  # knowledge_ref: E727
  - "HMDFS mktemp 0700 临时目录不可写（euid≠落盘属主）：configure/config.status 的 umask 077 && mktemp -d ./confXXXXXX 归一为 umask 002 && mkdir（config.status 为 configure 尾段范围拷贝，改一处贯通）；config.guess 内嵌同族 mktemp 另以 --build/--host 跳过"  # knowledge_ref: E011
  - "上游 .y 规则 target(genders_query.c) 与实际产物(genders_query.tab.c) 名不匹配 ⇒ 每轮 make 必重跑 bison；make -j>1 并发覆写同一生成物 ⇒ 交叉写坏 ⇒ clang-15 ICE（frontend exit code 135）表象；A/B 实测 -j4 确定性复现、-j1 rc=0 ⇒ 配方钉 -j1"  # knowledge_ref: E728
  - "nodeattr 无 --version/--help 长选项（usage() 恒 exit(1)）会撞 conan-verify L2 冒烟门禁；按 E503（libubox jshn 先例）在 main() 开头拦截两长选项并 exit(0)，usage() 拆为 usage_msg()+usage() 保留既有语义"  # knowledge_ref: E503
  - "本包 build() 内跑 make check（上游 no-op，满足 TEST_QUALITY_SPEC §3.1 口径）+ 显式跑 genders_test -v -v 作为真实上游测试证据；-v -v 是唯一同时给逐项 PASS 与三行 Total 的正证据档（默认零输出是设计行为，不作假绿）"  # reference: docs/TEST_QUALITY_SPEC.md
  - "genders_query 族输出数组是「预分配缓冲区数组」契约：_genders_put_in_array 对 list[index] 直接 strcpy，调用方必须用 genders_nodelist_create（每槽 maxnodelen+1 缓冲）初始化；裸 char *[] 未初始化槽位 → strcpy(垃圾指针) 段错误（ASan 形态则读到 NULL 返回 -1 假 FAIL）。genders_getnodes/getattr/getattr_all 同契约"  # reference: upstream src/libgenders/genders_util.c _genders_put_in_array
  - "不声明 flex/bison tool_requires：BUILT_SOURCES 需 lex/yacc 而生成物不在 tarball；设备与 CI worker PATH 均含 /data/service/hnp/bin/{flex,bison}（device-facts §一.4 worker PATH 实证），避免 registry 二进制构建面"  # reference: notes/device-facts.md §一.4

