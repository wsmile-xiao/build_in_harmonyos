version: "2.10.1"
software: "gnu-typist"
status: built
build_date: "2026-08-16"
build_system: "autotools"

source:
  url: "https://ftp.gnu.org/gnu/gtypist/gtypist-2.10.1.tar.xz"
  sha256: "ca618054e91f1ed5ef043fcc43500bbad701c959c31844d4688ff22849ac252d"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux-gnu"
    - "--host=aarch64-linux-gnu"
    - "--disable-nls"
  dependencies:
    - "ncurses/6.6"

knowledge_gained:
  - "gnu-typist requires ncursesw headers as ncursesw/ncurses.h; ncurses/6.6 exports top-level ncurses.h, so the recipe creates a build-local compatibility include wrapper."
  - "On OHOS, run autotools configure through CONFIG_SHELL and pass LD/AR/RANLIB explicitly when the compiler executable is a shell-wrapped clang."
