# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gdk-pixbuf/2.44.6.1.1
homepage: "https://gitlab.gnome.org/GNOME/gdk-pixbuf"

# 上游测试命令 (meson test 列表来自: meson test --list)
# 注意: gdk-pixbuf 2.44.6 配方构建时以 -Dtests=false 禁用测试（避免 test-only 依赖），
#       上游测试在探索构建阶段未执行；test_package 提供消费者 API 级验证。
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (gdk-pixbuf 2.44.6 探索构建因 -Dtests=false 未运行)
upstream_tests:
  - file: tests/pixbuf-construction.c
    source: gdk-pixbuf-2.44.6/tests/pixbuf-construction.c
    description: "pixbuf 构造/属性测试"
    command: "meson test pixbuf-construction"
  - file: tests/pixbuf-scale.c
    source: gdk-pixbuf-2.44.6/tests/pixbuf-scale.c
    description: "pixbuf 缩放算法测试"
    command: "meson test pixbuf-scale"
  - file: tests/pixbuf-jpeg.c
    source: gdk-pixbuf-2.44.6/tests/pixbuf-jpeg.c
    description: "JPEG loader 测试"
    command: "meson test pixbuf-jpeg"
  - file: tests/pixbuf-gif.c
    source: gdk-pixbuf-2.44.6/tests/pixbuf-gif.c
    description: "GIF loader 测试"
    command: "meson test pixbuf-gif"
  - file: tests/pixbuf-stream.c
    source: gdk-pixbuf-2.44.6/tests/pixbuf-stream.c
    description: "GInputStream 加载测试"
    command: "meson test pixbuf-stream"

# test_package 中自带的测试 (消费者视角验证, 调用真实 gdk-pixbuf API)
test_package_tests:
  - file: test.c
    description: "消费者测试: gdk_pixbuf_new/get_width/get_height/get_has_alpha"
    command: "./test_gdk-pixbuf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
