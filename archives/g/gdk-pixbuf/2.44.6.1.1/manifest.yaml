software: gdk-pixbuf

# ============================================================
# 必须字段
# ============================================================

# 版本号
# R37: 制品仓已存在 gdk-pixbuf/2.44.6（2026-08-04 发布，启用 libtiff）与
# gdk-pixbuf/2.44.6.1（2026-08-22 发布 revision fa6c6d19，仍启用 libtiff），本配方修改
# 了 conanfile/conandata（tiff 禁用、glib/libpng/libjpeg-turbo 依赖集），必须再次递增后缀
version: "2.44.6.1.1"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（顶层字段，供脚本快速检查）
build_system: meson

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-31"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (R39: 官方源)
  url: "https://download.gnome.org/sources/gdk-pixbuf/2.44/gdk-pixbuf-2.44.6.tar.xz"

  # 源码校验和
  sha256: "140c2d0b899fcf853ee92b26373c9dc228dbcde0820a4246693f4328a27466fa"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dgio_sniffing=false"
    - "-Dtiff=disabled"
    - "-Dtests=false"
    - "-Dman=false"
    - "-Dintrospection=disabled"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "glib/2.84.0.1"
    - "libpng/1.6.58"
    - "libjpeg-turbo/3.2.0"
    - "zlib/1.3.1.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-gen-thumbnailer.py.patch"
  - "0002-gdk-pixbuf-meson.build.patch"
  - "0003-thumbnailer-meson.build.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ref: R37/L0j - 制品仓已有 gdk-pixbuf/2.44.6（libtiff 启用版）与 2.44.6.1（fa6c6d19，仍 libtiff 启用版），本地配方修改后必须递增版本后缀：2.44.6.1 → 2.44.6.1.1（cnb.cool 不支持同版本多 revision 并存）"
  - "ref: E123 - glib/2.84.0.1 包自带 proxy-libintl：include/libintl.h 将 gettext/dgettext/ngettext/bindtextdomain 宏重定向到 g_libintl_* 符号（libintl.so 导出），下游需在 glib pc 的 Libs 中注入 -lintl"
  - "ref: E090 - meson 构建中 loaders.cache/thumbnailer 的 custom_target 会在构建期执行宿主二进制，需改为 configure_file 或置空"
  - "ref: E254 - gdk-pixbuf 需 gmodule-no-export-2.0.pc（含 gmodule_supported 变量），但 PkgConfigDeps 只生成 gmodule-2.0.pc，需在 recipe generate() 中合成"
  - "ref: E255 - conanfile 中重签 OHOS ELF 时 self.run() 需 env=None，conanbuild env 的 LD_LIBRARY_PATH 会破坏 Java 版 binary-sign-tool 生成无效签名"
  - "ref: E090 - gdk-pixbuf 2.44.x 使用 meson 构建（registry autotools 提示错误）；2.44 新增 android/glycin loader 源码（默认未启用，不影响构建）"

