# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gason/1.0.0
homepage: "https://github.com/vivkin/gason"

# 上游测试命令：本库为 CMake 项目，无 ctest/make check 注册，
# 官方提供独立测试程序 test-suite（src/test-suite.cpp）。
upstream_check_command: "cmake --build . --target test-suite && ./test-suite"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# test-suite.cpp 内含 43 个独立 JSON 解析断言（16 个应通过 + 27 个应拒绝），
# 单个 main() 顺序执行；ALL TESTS PASSED 为通过标志。
upstream_tests:
  - file: src/test-suite.cpp
    source: gason-1.0.0/src/test-suite.cpp
    description: "gason 官方测试套件：43 个 JSON 解析断言（16 合规 + 27 非法输入拒绝）"
    command: "./test-suite"

# test_package 中自带的测试 (消费者视角验证)
# test_gason: 通过已安装公开头文件/静态库调用 jsonParse 与 JsonValue 迭代
# test_ohos : HarmonyOS 专项：UTF-8 中文键值、数值边界、深层嵌套、非法输入拒绝
test_package_tests:
  - file: test_gason.cpp
    description: "消费者用例：经 gason::gason 链接，解析对象并校验字段/数组/类型"
    command: "./test_gason"
  - file: test_ohos.cpp
    description: "鸿蒙专项用例：UTF-8/边界数值/深层嵌套/错误输入四大类断言"
    command: "./test_ohos"

# 测试断言总数 (上游 43 + 消费者 12 + 鸿蒙专项 10)
assertion_count: 65