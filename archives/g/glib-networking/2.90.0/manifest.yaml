name: glib-networking
version: "2.90.0"
status: built
build_date: "2026-09-11"

source:
  url: "https://download.gnome.org/sources/glib-networking/2.90/glib-networking-2.90.0.tar.xz"
  sha256: "83a75e3d9c36b66ee86d3281c2fc997816101968a5126ba322b2acb9a74dd8c0"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "default_library=shared"
    - "openssl=enabled"
    - "gnutls=disabled"
    - "libproxy=disabled"
    - "gnome_proxy=disabled"
    - "environment_proxy=disabled"
    - "tests=true"
    - "installed_tests=false"
  cc: clang

dependencies:
  - "glib/2.88.3"
  - "openssl/3.5.8.1"
  - "proxy-libintl/0.5"

key_points:
  - "GLib 官方 TLS 后端 GIO 模块（gioopenssl），桥接 OpenSSL，替代 OHOS 上 GDummyTlsBackend 空实现，为 libsoup3 http2 测试链提供真实 TLS"
  - "依赖共享 glib/2.88.3（ohpcd 仅发布静态 glib2/2.88.0，共享 glib 才能避免 GIO 模块与消费进程类型系统双份注册）"
  - "pc 修复：PkgConfigDeps 生成的 gio-2.0.pc 缺 giomoduledir，复制 glib 包真实 .pc 修 prefix 并前置；剥离内嵌 proxy-libintl/zlib/pcre2 的 Requires"
  - "codesign 保护：meson.install() 清理 DT_RUNPATH 改写 .so 导致 OHOS loader 哈希失配，package() 用 build 原始产物覆盖 libgioopenssl.so"
  - "上游测试：80/98 源码口径、80/80 配置可执行口径，4 个 meson test 条目 122 项次全部通过"
