package: "glib-networking/2.90.0"
homepage: "https://gitlab.gnome.org/GNOME/glib-networking"
upstream_check_command: "meson test -v -C <builddir> --timeout-multiplier=16"
upstream_test_in_build: true
upstream_inventory:
  # 源码声明总数 = tls/tests certificate.c 29 + file-database.c 11 + connection.c 43
  #                 + dtls-connection.c 9（上游注释禁用，issue #49）
  #                 + proxy/tests environment.c 3 + gnome.c 3（proxy 后端禁用）= 98
  source_literal_registrations: 98
  # 当前 OHOS 配置（openssl 后端）实际实例化独立用例数：
  #   certificate-openssl 27 + file-database-openssl 11 + connection-openssl 42 = 80
  #   （3 个 pkcs11 用例在 #if HAVE_GNUTLS_PKCS11 内排除）
  configured_total: 80
  # connection-openssl-tls1.2 为同一 42 用例的 TLS1.2 重跑（G_TLS_OPENSSL_MAX_PROTO=0x0303）
  executed_passed_total: 80
  executed_passed_runs: 122
  failed_total: 0
test_package_tests:
  - file: "test_tls_backend.c"
    description: "验证 glib-networking 安装后 g_tls_backend_get_default() 返回真实后端 GTlsBackendOpenssl（非 GDummyTlsBackend），并通过公开 GLib TLS API + 本地 TCP socket 对执行进程级 TLS 握手，确认 openssl 模块代码路径真实运行"
    command: "./test_tls_backend"
assertion_count: 10
target_execution_status: passed
