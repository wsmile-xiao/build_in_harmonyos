# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求）

package: gspell/1.14.4
homepage: "https://gitlab.gnome.org/GNOME/gspell"

# 上游测试入口：tests/meson.build -> subdir('interactive-tests') + subdir('unit-tests')
# 真正注册为 meson test 目标的只有 tests/unit-tests 下的 6 个二进制
# （tests/interactive-tests 只 executable()、没有 test()，不是上游测试目标）。
upstream_check_command: "meson test"

# conanfile.py build() 已集成上游测试：conan create 即编译并运行 unit-tests
upstream_test_in_build: true
upstream_test_command: "meson test test-icu test-text-iter test-utils"

# 上游全集：6 个二进制 / 23 个 g_test_add_func 用例
# （test-checker 3 + test-entry 7 + test-icu 2
#   + test-inline-checker-text-buffer 5 + test-text-iter 3 + test-utils 3）
upstream_tests:
  - file: "tests/unit-tests/test-icu.c"
    source: "gspell-1.14.4/tests/unit-tests/test-icu.c"
    description: "2 个 glib 用例：_gspell_icu_loc_getDisplayNameSimple / _gspell_icu_get_language_name_from_code（断言 en_US -> \"English (United States)\"，证明 ICU 数据已随库静态内嵌可用）"
    command: "./tests/unit-tests/test-icu --tap"
  - file: "tests/unit-tests/test-text-iter.c"
    source: "gspell-1.14.4/tests/unit-tests/test-text-iter.c"
    description: "3 个 glib 用例：_gspell_text_iter_forward_word_end / backward_word_start / starts-ends-inside-word 的参数化前后向迭代断言"
    command: "./tests/unit-tests/test-text-iter --tap"
  - file: "tests/unit-tests/test-utils.c"
    source: "gspell-1.14.4/tests/unit-tests/test-utils.c"
    description: "3 个 glib 用例：_gspell_utils_is_number / str_replace / str_to_ascii_apostrophe"
    command: "./tests/unit-tests/test-utils --tap"
  - file: "tests/unit-tests/test-checker.c"
    source: "gspell-1.14.4/tests/unit-tests/test-checker.c"
    description: "3 个 glib 用例：GspellChecker 构造、语言设置、检查/建议 API（每个用例先 gspell_language_lookup(\"en_US\") 并 g_assert_true(lang != NULL)）"
    command: "./tests/unit-tests/test-checker --tap"
    excluded: true
  - file: "tests/unit-tests/test-entry.c"
    source: "gspell-1.14.4/tests/unit-tests/test-entry.c"
    description: "7 个 glib 用例：GspellEntry 与 GtkEntry 的绑定/内联拼写检查开关（依赖真实词典）"
    command: "./tests/unit-tests/test-entry --tap"
    excluded: true
  - file: "tests/unit-tests/test-inline-checker-text-buffer.c"
    source: "gspell-1.14.4/tests/unit-tests/test-inline-checker-text-buffer.c"
    description: "5 个 glib 用例：内联检查器在 GtkTextBuffer 上的标记/清除行为（依赖真实词典）"
    command: "./tests/unit-tests/test-inline-checker-text-buffer --tap"
    excluded: true

# 未执行的 15 个用例的**技术原因**（构建期由 conanfile.py 依依赖图判定，不是硬编码）：
#   enchant/2.8.2（ohpcd 已发布制品）在 configure 阶段传入了
#   --without-aspell --without-hspell --without-hunspell --without-nuspell
#   --without-voikko --without-zemberek，包内没有 lib/enchant-2/*.so 提供者模块，
#   也没有任何词典数据。于是 enchant_broker_list_dicts() 返回空，
#   gspell_language_lookup("en_US") 返回 NULL，上述三个二进制在
#   g_assert_true(lang != NULL) 处 abort。
#   conanfile.py 的 _enchant_provider_count() 统计 lib/enchant-2/*.so 的个数；
#   为 0 时只运行 test-icu / test-text-iter / test-utils（8 个用例），并把
#   provider 计数与跳过原因写进 HMBS_UPSTREAM_TEST_RESULT 标记。
#   一旦 enchant 侧补齐提供者，同一份配方会自动把这 15 个用例纳入执行。

test_package_tests:
  - file: test_gspell.c
    description: "消费者测试（经 pkg-config gspell-1 链接安装后的共享库）：错误域可用、语言列表可枚举、无词典时 lookup/check_word/get_suggestions 的上游降级语义、GtkTextBuffer/GtkTextView/GtkEntry 工厂函数 attach 与往返、GspellEntry 内联拼写开关往返，共 13 处行为断言"
    command: "./test_gspell"

# 测试断言总数（上游 23 个 glib 用例，本次执行 8 个；消费者程序 13 处行为断言）
assertion_count: 13
