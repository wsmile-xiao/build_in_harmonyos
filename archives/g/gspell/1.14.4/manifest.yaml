# 版本级 manifest
# 遵循 ARCHIVE-SPEC v3.0

version: "1.14.4"
software: "gspell"
status: built
build_date: "2026-09-21"
build_system: meson

source:
  url: "https://github.com/GNOME/gspell/archive/refs/tags/1.14.4.tar.gz"
  sha256: "4861a1fdf26da6ef72f2b0e29da8a594425656eba76f031a62541b6e1c92a3a9"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dgspell_app=false"
    - "-Dgobject_introspection=false"
    - "-Dvapi=false"
    - "-Dgtk_doc=false"
    - "-Dtests=true"
    - "-Dinstall_tests=false"
    - "-Dwrap_mode=nodownload"
  dependencies:
    - "gtk/3.24.43"
    - "glib/2.84.0.1"
    - "enchant/2.8.2"
    - "icu4c/77"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "gspell 1.14.4 的 meson 工程把 ICU 作为**私有**依赖（dependency('icu-uc')），只出现在编译期；安装出去的 gspell-1.pc 的 Requires 只有 gio-2.0 / gtk+-3.0 / enchant-2（上游 PKG_CONFIG.generate(libraries: GSPELL_PUBLIC_DEPS)），所以消费方不需要直接依赖 icu4c"
  - "icu4c 必须选 77 而不是 78：icu4c/78 的 recipe 没有 fPIC 选项、也没有 set_property('pkg_config_name','icu-uc')，PkgConfigDeps 只会生成 icu4c.pc，上游 dependency('icu-uc') 会直接 'Dependency icu-uc not found' 配置失败（ref: archives/i/icu4c 制品）"
  - "icu4c/77 默认 shared=False，是静态 C++ 归档；gspell 是纯 C 工程，libicudata.a 等会带进 __gxx_personality_v0/__cxa_begin_catch，所有 C 链接都要补 -lc++（MesonToolchain.c_link_args），否则共享库链接期 undefined（ref: cif-api/0.4.2 同款处理）"
  - "上游 unit-tests 的 6 个二进制全部调用 gtk_test_init()，需要显示后端；ohpcd 没有 X/Wayland，gtk/3.24.43 是 broadway-only 并自带 bin/broadwayd → 构建期起 broadwayd :5 + GDK_BACKEND=broadway/BROADWAY_DISPLAY=:5 即可跑（ref: ayatana-ido/0.10.4-v2）"
  - "起 broadwayd 时必须把算好的 LD_LIBRARY_PATH 用 env=env 交给 subprocess.Popen：broadwayd 是 gtk 包里的**动态可执行文件**，要按 LD_LIBRARY_PATH 找 libgtk-3.so.0/libgio。只把 LD_LIBRARY_PATH 写进本地 dict 而漏 env=，子进程继承 CI 进程的环境 → 动态加载器找不到库、直接退 127（日志即 'broadwayd exited early (rc=127)'），配方静默退回「无 display」分支，随后每个 gtk_test_init() 用例都崩（rc=-5，只有一行 'Gtk-WARNING: cannot open display:'）。同仓库先例 ayatana-ido/0.10.4-v2 之所以没事，是因为它改的是 os.environ 本身、走的默认继承"
  - "enchant/2.8.2（ohpcd 已发布）在 configure 阶段传了 --without-aspell --without-hspell --without-hunspell --without-nuspell --without-voikko --without-zemberek，包内没有 lib/enchant-2/*.so 提供者，也没有任何词典 → enchant_broker_list_dicts() 恒为空、gspell_language_lookup(\"en_US\") 恒为 NULL；test-checker/test-entry/test-inline-checker-text-buffer 这 15 个上游用例会在 g_assert_true(lang != NULL) 处 abort，是无词典环境下的**确定**结果而非偶发"
  - "上游 unit-tests 用 glib 的测试框架，二进制接受 --tap 直接输出逐用例的 TAP（1..N / ok N / not ok N），比 meson test 的 'Ok: 3' 粒度细，能以**用例数**而不是**二进制数**计量上游通过率"
  - "gspell 的公开头文件安装到 include/gspell-1/gspell/*.h，消费方写 #include <gspell/gspell.h>；cpp_info.includedirs 应为 include/gspell-1"

test_evidence:
  upstream:
    framework: glib-gtest-tap
    command: "meson test test-icu test-text-iter test-utils（构建期逐个二进制加 --tap 运行）"
    total_cases: 23
    executed_cases: 8
    skipped_cases: 15
    result: "8/8 passed (executed set), 0 failed, 15 skipped (no Enchant provider/dictionary available)"
  consumer:
    command: "test_package: pkg-config gspell-1 链接 test_gspell 并在 broadwayd 下真实运行"
    assertions: 13
    result: "13/13 passed"
