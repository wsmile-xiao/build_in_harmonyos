software: gspell
display: "gspell"
description: "GTK 3 应用的拼写检查库（libgspell-1，Enchant 的语言/词典抽象 + GtkEntry/GtkTextView 内联拼写检查）"
category: library
homepage: "https://gitlab.gnome.org/GNOME/gspell"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "上游用 meson：只交付共享库，gspell_app=false 关掉可执行程序 gspell-app，避免 library 包里混进 bin/"
    - "公共依赖链由安装后的 gspell-1.pc 表达（Requires: gio-2.0 gtk+-3.0 enchant-2）；私有依赖 icu-uc 静态链入 libgspell-1.so.3"
    - "icu4c 必须钉 77：icu4c/78 没有 fPIC 选项、也没设 pkg_config_name=icu-uc，上游 dependency('icu-uc') 会解析不到；77 的制品是静态 C++ 归档，所有 C 链接都要补 -lc++"
    - "Conan 的 glib-2.0.pc 不带 -lintl，libglib-2.0.so 的 g_libintl_* 会留未定义；generate() 补 -lintl（同 gtk/3.24.43、vte/0.74.2）"
    - "meson gnome 模块要向 glib-2.0.pc/gio-2.0.pc 取 glib_mkenums / glib_compile_resources 等工具变量，PkgConfigDeps 不生成 → generate() 注入；同时给 glib 包 bin/ 下的工具做 OHOS 签名"
    - "上游 unit-tests 的 6 个二进制都经 gtk_test_init 取显示后端 → 用 gtk 包自带的 broadwayd 起 headless broadway 后端运行"
    - "enchant/2.8.2（ohpcd）编译时关掉了全部 provider（--without-aspell/hspell/hunspell/nuspell/voikko/zemberek），无任何词典，23 个上游用例里有 15 个需要词典 → 构建期按 lib/enchant-2/*.so 个数判定并跳过"
  common_dependencies:
    - gtk
    - glib
    - enchant
    - icu4c

versions:
  "1.14.4":
    status: built
    build_date: "2026-09-21"
    conan_ref: "gspell/1.14.4"
