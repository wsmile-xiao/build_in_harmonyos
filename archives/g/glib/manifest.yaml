software: glib
display: "GLib"
description: "GNOME 核心工具库，提供数据结构、事件循环、IO 抽象等基础功能"
category: foundation
homepage: "https://docs.gtk.org/glib/"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 在 HarmonyOS 上检测 host_system 为 'harmonyos' 而非 'linux'"
    - "需要将 meson.build 中 host_system == 'linux' 改为 host_system in ['linux', 'harmonyos']"
    - "OHOS 内核头文件 linux/socket.h 与 musl sys/socket.h 有 sockaddr_storage 冲突"
    - "推荐使用 default_library=static 构建静态库，避免共享库运行时加载签名问题"
    - "需要禁用：nls, libmount, selinux, tests, xattr, dtrace, systemtap, introspection, oss_fuzz"
  common_dependencies:
    - libffi
    - zlib
    - pcre2

versions:
  "2.86.5":
    status: failed
    build_date: "2026-04-25"
  "2.88.0":
    status: published
    build_date: "2026-04-21"
