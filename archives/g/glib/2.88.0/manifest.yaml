version: "2.88.0"
status: published
build_date: "2026-04-21"

source:
  url: "https://download.gnome.org/sources/glib/2.88/glib-2.88.0.tar.xz"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dnls=disabled"
    - "-Dlibmount=disabled"
    - "-Dselinux=disabled"
    - "-Dtests=false"
    - "-Ddefault_library=static"
    - "-Doss_fuzz=disabled"
    - "-Dxattr=false"
    - "-Ddtrace=disabled"
    - "-Dsystemtap=disabled"
    - "-Dintrospection=disabled"
  dependencies:
    - libffi
    - zlib
    - pcre2
  cc: clang

patches_applied:
  - "0001-gio-gnetworkmonitornetlink.c.patch"
  - "0002-gio-meson.build.patch"
  - "0003-glib-meson.build.patch"
  - "0004-meson.build.patch"

knowledge_gained:
  - "Meson 在 HarmonyOS 上检测 host_system 为 'harmonyos' 而非 'linux'"
  - "需将 host_system == 'linux' 改为 host_system in ['linux', 'harmonyos']"
  - "OHOS 内核头文件 linux/socket.h 与 musl sys/socket.h 有 sockaddr_storage 冲突"
  - "推荐使用 default_library=static 避免共享库签名问题"
