sources:
  url: "https://download.gnome.org/sources/glib/2.88/glib-2.88.3.tar.xz"
  sha256: "ab24d24e698dfa1e408b7bcdb508f4aafc906185a8b8ce72fdf79bbbdc9b383b"

patches:
  - patch_file: "patches/0001-gio-meson.build.patch"
    patch_description: "Gate journal source by UNIX-domain peer-address capability, expose generated config.h, and run the generator with Python"
    patch_type: "portability"
  - patch_file: "patches/0002-glib-gjournal-private.c.patch"
    patch_description: "Provide capability-selected journal peer detection and a safe unavailable fallback"
    patch_type: "portability"
  - patch_file: "patches/0003-glib-gmessages.c.patch"
    patch_description: "Select journal logging behavior from the generated capability result"
    patch_type: "portability"
  - patch_file: "patches/0004-glib-meson.build.patch"
    patch_description: "Use the capability result and the detected Python interpreter"
    patch_type: "portability"
  - patch_file: "patches/0005-gobject-meson.build.patch"
    patch_description: "Run the visibility generator with the detected Python interpreter"
    patch_type: "portability"
  - patch_file: "patches/0006-meson.build.patch"
    patch_description: "Probe UNIX-domain peer addressing and add a fail-closed netlink feature gate"
    patch_type: "portability"
  - patch_file: "patches/0007-meson.options.patch"
    patch_description: "Expose explicit netlink monitor policy as a Meson feature"
    patch_type: "portability"
  - patch_file: "patches/0008-meson.build-intl-provider.patch"
    patch_description: "Probe the external proxy-libintl pkg-config provider before Meson's special intl dependency"
    patch_type: "portability"
  - patch_file: "patches/0009-meson-visibility-python.patch"
    patch_description: "Run every remaining visibility generator through the detected Python interpreter"
    patch_type: "portability"
  - patch_file: "patches/0010-getpass-capability.patch"
    patch_description: "Probe getpass and keep the official TLS console helper buildable through its capability fallback"
    patch_type: "portability"
  - patch_file: "patches/0011-interpreted-test-tools.patch"
    patch_description: "Run interpreted test tools through explicit interpreters and preserve absolute debugger discovery"
    patch_type: "portability"
  - patch_file: "patches/0012-iconv-spawn-userdb-contracts.patch"
    patch_description: "Preserve GLib conversion, PATH search, and runtime-managed user identity contracts across target libc and sandbox behavior"
    patch_type: "portability"
  - patch_file: "patches/0013-runtime-test-capability-branches.patch"
    patch_description: "Exercise libc, local-socket, interpreter, ordering, and pkg-config test contracts through explicit runtime capabilities"
    patch_type: "portability"
  - patch_file: "patches/0014-filesystem-capability-tests.patch"
    patch_description: "Keep filesystem tests meaningful when the writable target filesystem rejects symbolic and hard links"
    patch_type: "portability"
  - patch_file: "patches/0015-archive-tool-test-fallbacks.patch"
    patch_description: "Exercise debugger and Python binding fallbacks, and run real lint tools from source archives without Git metadata"
    patch_type: "portability"
  - patch_file: "patches/0016-runtime-capability-closure.patch"
    patch_description: "Keep libc, locale-format, filesystem, interpreter, test dependency, and path contracts capability-driven on restricted targets"
    patch_type: "portability"
  - patch_file: "patches/0017-target-runtime-tests.patch"
    patch_description: "Validate restricted filesystem, isolated-root localtime setup, ptrace, named-timezone identifiers and caching, POSIX-rule timezone providers (including the documented UTC fallback when named data is absent), locale providers, machine-id, deterministic trap stderr, and bounded Unix-socket runtime outcomes without hiding unavailable capabilities"
    patch_type: "portability"
  - patch_file: "patches/0018-runtime-clock-and-localtime-capability.patch"
    patch_description: "Bind isolated-root localtime trap stages, skip only unavailable namespace or mismatched provider fixtures, and skip coarse monotonic-nanosecond contracts"
    patch_type: "portability"
  - patch_file: "patches/0019-localtime-symlink-capability.patch"
    patch_description: "Skip isolated localtime symlink fixtures only for classified runtime capability errors while preserving all positive and unexpected-error paths"
    patch_type: "portability"
  - patch_file: "patches/0020-target-runtime-capability-fixes.patch"
    patch_description: "Skip or bound tests when target filesystems and IPC runtimes do not provide the POSIX capabilities they exercise"
    patch_type: "portability"
  - patch_file: "patches/0021-flush-progress-timeouts.patch"
    patch_description: "Bound GDBus flush progress waits and include the Unix socket address API used by the runtime probe"
    patch_type: "portability"
  - patch_file: "patches/0022-targeted-ci-runtime-fixes.patch"
    patch_description: "Bound debugger, filesystem mode, GDBus transport and credentials, and settings cleanup tests to target runtime capabilities"
    patch_type: "portability"
  - patch_file: "patches/0023-gdbus-timeout-probes.patch"
    patch_description: "Probe GDBus address construction without worker threads and bound authentication and flush vectors before entering restricted runtimes"
    patch_type: "portability"
  - patch_file: "patches/0024-gdbus-runtime-capability.patch"
    patch_description: "Converge GDBus test timeouts (5s bounded subprocess windows) and gate fd-layout-sensitive closefrom/fd-conflation tests on real descriptor layout"
    patch_type: "portability"
  - patch_file: "patches/0025-fd-query-path-error-gate.patch"
    patch_description: "Accept EINVAL/ENOENT for g_unix_fd_query_path() on an invalid descriptor (OHOS/musl readlink returns EINVAL, glibc ENOENT) and record the observed errno"
    patch_type: "portability"
  - patch_file: "patches/0026-gdbus-non-socket-capability-gate.patch"
    patch_description: "Probe non-socket GDBus capability (AF_UNIX + session bus) up front and skip fast on restricted runtimes instead of hanging until Meson timeout"
    patch_type: "portability"
