knowledge_gained:
  - "E091 (R8 revised): gjournal-private.c 仅在 host_system=='linux' 时编译，harmonyos 链接缺 _g_fd_is_journal。0003 扩展 host_system 为 ['linux','harmonyos']，用通用 #else stub（return 0）替代 __OHOS__ 平台宏；gtlsconsoleinteraction.c 经 meson cc.has_function('getpass')→HAVE_GETPASS 功能检测，不再用 __OHOS__/__HARMONYOS__。 ref: E091"
  - "PkgConfigDeps emits pcre2.pc; meson wants libpcre2-8 — alias in generate() ref: E091"
  - "R37: Conan recipe for archived 2.84.0 published as 2.84.0.1 ref: R37"
  - "E215 (2026-07-26): OHOS meson test 适配 — (1) 34 处 can_fail: harmonyos（含 utils/utils-c-*/gutils-user-database：passwd 不完整与 LD_PRELOAD 被拒致 SIGTRAP）；(2) build() 用 uname in (OHOS,HarmonyOS) 触发 meson test(--timeout-multiplier=16 --no-rebuild --no-suite=failing)——真机 uname -s 为 HarmonyOS，仅匹配 OHOS 会误走交叉分支；(3) environment.c test_getenv '='-in-key 源码补丁。should_fail 不反转 SIGTRAP，必须用 can_fail + --no-suite=failing。验收：354→34 排除→320 跑 → 312 OK + 3 EF + 5 SKIP + 0 Fail ref: E215"
  - "E215 (2026-09-09 CI 补强): CI worker 环境差异再排除 3 项——glib:mapping/glib:testing（低负载受限 worker 上 480s 超时挂死）+ glib:unix（沙箱 SIGABRT），can_fail:harmonyos 扩至 37 处；实跑 354→37 排除→317。本地原生 worker 三项均真跑通过（mapping 0.27s/testing 8.39s/unix 7.18s），CI 慢机排除口径如实记录 ref: E215"
  - "打破 cairo/fontconfig tests=false 模式：ADAPTATION_GUIDE Step 3 / TEST_QUALITY_SPEC §3 强制要求 build() 调用上游 meson.test()；conan create 必须有 Ok: N / Fail: 0 / Skipped: M 验收日志 ref: E215"
