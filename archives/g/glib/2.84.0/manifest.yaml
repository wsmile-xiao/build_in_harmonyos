name: glib
version: 2.84.0
category: core
status: built
build_system: meson
build_date: 2026-05-16
compiler: clang 15.0.4 + GNU ld (bfd)
platform:
  os: ohos
  arch: aarch64

source:
  url: https://github.com/GNOME/glib
  tag: 2.84.0

dependencies:
  runtime:
    - libffi >= 3.4.4
    - pcre2 >= 10.47
  build:
    - meson >= 1.11.1
    - ninja >= 1.13

build_options:
  meson_options:
    - default_library=static
    - selinux=disabled
    - libmount=disabled
    - tests=false

verification:
  static_libs:
    - libglib-2.0.a
    - libgio-2.0.a
    - libgobject-2.0.a
  binaries:
    - gio
    - glib-compile-schemas
    - glib-compile-resources
    - gresource

artifacts:
  package: archives/g/glib/2.84.0/packaging/glib-2.84.0-ohos-aarch64.tar.gz

patches:
  - 0001-disable-netlink-for-harmonyos.patch
  - 0002-add-harmonyos-host-support.patch
