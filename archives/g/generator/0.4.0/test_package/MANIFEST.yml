package: generator/0.4.0
homepage: "https://github.com/TartanLlama/generator"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

upstream_tests:
  - file: tests/test.cpp
    source: generator-0.4.0/tests/test.cpp
    description: "Catch2 suite covers bounded generators, infinite iota, line splitting/enumeration, and pointer generation."
    command: "tl-generator-test-test"
    test_functions: 4
    assertion_failure_macros: 4

test_package_tests:
  - file: test.cpp
    description: "Consumer iterates a real tl::generator and checks generated values and iterator behavior."
    command: "./test_generator"

assertion_count: 4
