software: glpk
display: "GLPK"
description: "GNU Linear Programming Kit：线性规划与混合整数规划求解器"
category: foundation
homepage: "https://www.gnu.org/software/glpk/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools 库给 --build/--host 显式三元组即可跳过 config.guess，无需打补丁"
    - "--with-gmp 时 configure 用 AC_CHECK_HEADER 探 gmp.h，需经 os.environ 补 CPPFLAGS/LDFLAGS 指到 conan 的 gmp 包（autoconf 会把它们烤进 Makefile，比 AutotoolsToolchain.extra_cflags 可靠）"

versions:
  "4.65.1":
    status: built
    build_date: "2026-09-18"
    packaging: conan
    notes: "4.65 官方源码 + 官方 oldapi/lpx 兼容层（examples/oldapi/lpx.c+lpx.h），独立编译单元 liblpx.a 编入制品并随 -lglpk -llpx 导出；消费者经公开 lpx.h 调用 lpx_* 旧 API 真解 LP 校验（LPX_OPT/KKT）；使 COIN-OR 系 OsiGlpk 0.108.11 的 189 处 lpx_* 引用可实例化"
    dependencies:
      - gmp/6.3.0
  "4.65":
    status: built
    build_date: "2026-09-16"
    packaging: conan
    notes: "conan 配方（os=OHOS arch=armv8），依赖 gmp/6.3.0；上游 make check 2/2 通过，示例程序 8/8 成功，鸿蒙专项测试 3 场景全绿（LP 求解/并发/dlopen）；产 libglpk.so.40 与 glpsol（commands.json）"
    dependencies:
      - gmp/6.3.0
  "5.0":
    status: built
    build_date: "2026-07-29"
    packaging: conan
    notes: "conan 配方（os=OHOS arch=armv8），依赖 gmp/6.3.0；真机原生 conan create 验证，test_package 真解一道 LP 并校验最优值与最优解，5 条断言全绿；产 libglpk.so.40"
    dependencies:
      - gmp/6.3.0
