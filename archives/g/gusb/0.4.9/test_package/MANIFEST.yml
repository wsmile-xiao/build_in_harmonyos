# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: gusb/0.4.9
homepage: "https://github.com/hughsie/libgusb"

# 上游自测（gusb-self-test / gusb-umockdev-test）需要 usb.ids (hwdata)
# 与 umockdev——OHOS 不可用，构建时 -Dtests=false -Dumockdev=disabled 关闭
upstream_check_command: "echo \"upstream self-tests require usb.ids+umockdev (unavailable on OHOS); disabled via -Dtests=false\""

# conanfile.py build() 中已按上游 meson 配置裁剪（tests/umockdev 关闭）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_gusb.c
    description: "消费者探针：g_usb_context_new() 创建 GUsbContext，验证 libgusb 链接 + 初始化（无需 USB 设备）"
    command: "clang test_gusb.c -o test_gusb_probe $(pkg-config --cflags --libs gusb) && ./test_gusb_probe"

# 断言总数（test_package 1 个断言）
assertion_count: 1
