software: gusb
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.4.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.9"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: meson

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/hughsie/libgusb/archive/refs/tags/0.4.9.tar.gz"

  # 源码校验和
  sha256: "aa1242a308183d4ca6c2e8c9e3f2e345370b94308ef2d4b6e9c10d5ff6d7763e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 编译器
compiler: clang

# 依赖列表（conan package refs 或系统包名）
requires:
  - "glib/2.84.0.2"
  - "libusb/1.0.27"
  - "json-glib/1.10.6"

# 构建配置选项
build_options:
  - "-Dtests=false -Dumockdev=disabled -Dvapi=false -Ddocs=false -Dintrospection=false"

# ============================================================
# 测试信息
# ============================================================

# 测试结果状态
# passed | failed | skipped | not_run
test_status: passed

# 测试说明
test_note: "上游测试实测（2026-09-08 + 2026-09-10 复查 + 2026-09-11 再复查）：上游 3 个测试仍 **0/3 不可跑**，但本轮把根因**精确定位**（修正此前'json-glib 运行时符号加载问题'这一较笼统的表述）。① **gusb-self-test**：meson tests=true 全量编译成功（复现）；手工编译亦成功（需 -DUSB_IDS=<usb.ids> + -DHAVE_LIBUSB_*，gusb 内部源与 libusb 1.0.27 的 static 定义冲突需跳过）。实跑失败的**新定位根因是依赖 .so 的 dlopen 权限问题，而非符号缺失**：conan 缓存内 libjson-glib-1.0.so.0 权限 `770`、属主 UID 20001006（非当前进程 UID），HMDFS 会**吞掉 chmod**（实测 chmod 777 后仍为 770，'other' 位始终无读）→ 动态加载器报 `Error loading shared library libjson-glib-1.0.so.0: Permission denied`；随后的 `json_object_has_member: symbol not found` 等是**加载失败的下游症状**（库未装载故符号不可解析），并非 json-glib 自身缺符号——`llvm-nm -D` 确认该符号存在（计数 1）。已用 copy-rewrite（读源文件→新建→chmod）复测，权限仍被钳制为 770，dlopen 依旧 Permission denied，沙箱内无法绕过（与 python-dasbus `_gi.so` 同源问题）。② **gusb_context_func** 硬断言 coldplug USB 设备数>0（OHOS 无 USB 设备必失败）；③ **gusb-umockdev-test** 需 umockdev LD_PRELOAD（OHOS 不可用）。按 rule 1.2 声明环境限制。test_package 消费者探针（g_usb_context_new）compile+link+init 通过，1/1"
