# Actual upstream GoogleTest inventory: 172 registered cases on OHOS arm64.

package: gumbo/0.10.1
homepage: "https://github.com/google/gumbo-parser"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "python3 upstream_test.py <source> <new-output> --compiler <cc> --cxx <cxx> --native-ohos"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 upstream_test.py (exact Makefile.am test source list; runtime inventory and XML)"

# 上游实际运行的测试程序
upstream_tests:
  - name: gumbo_test
    description: All unmodified upstream GoogleTest sources
    registered_case_count: 172
    command: gumbo_test --gtest_output=xml:result.xml

# test_package 中自带的测试 (消费者视角验证, 调用已安装库)
test_package_tests:
  - file: main.c
    description: "消费者冒烟 — gumbo_parse/root 标签/元素计数(含 void element)/文本节点计数/body 定位/首子标签/属性取值 共 7 断言"
    command: "gumbo_smoke"

# Case denominators are distinct from the seven consumer assertions.
upstream_case_count: 172
consumer_case_count: 1
consumer_assertion_count: 7
harmony_case_count: 1
