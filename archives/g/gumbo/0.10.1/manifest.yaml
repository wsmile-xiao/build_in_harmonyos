  compile_flags:
    - "-fPIC"
    - "-O1"
    - "-DNDEBUG"
  link:
    soname: "libgumbo.so.1"
    realname: "libgumbo.so.1.0.0"
    version_info: "1:0:0"
  dependencies: []
  cc: clang

