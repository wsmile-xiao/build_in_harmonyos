name: globus-gsi-proxy-ssl
version: "6.6"
status: in_progress
source:
  url: "https://deb.debian.org/debian/pool/main/g/globus-gsi-proxy-ssl/globus-gsi-proxy-ssl_6.6.orig.tar.gz"
  sha256: "2b26087089993bf69d6827e9ce01c1afbc34d9ca8bf9d63cbcd55b5aae370f5b"
license: Apache-2.0
build:
  system: autotools
  dependencies:
    - "openssl/3.5.6"
  patches:
    - "0001-config.sub-ohos.patch（2018-05-05 版 config.sub 增加 ohos OS 识别，--host=aarch64-unknown-linux-ohos 必需；os 归一化大表缺 -linux-ohos* 时会被 -linux* 规则静默改写为 -linux-gnu）"
tests:
  upstream: "20/20 passed (100%)（test/test_pci.pl TAP 1..20 全 ok，build() 内实跑）"
  test_package: "passed on OHOS aarch64（PROXYCERTINFO DER 编码→解码→字段校验→二次编码逐字节比对，der=40 bytes）"
  ohos_aarch64: "package and test_package compiled and linked, upstream TAP 20/20"
  emulator: "not run（本 run 未覆盖模拟器步骤）"
notes:
  - "configure.ac 唯一外部依赖 PKG_CHECK_MODULES([OPENSSL],[openssl >= 1.0])：无 globus-common、无 thr/nothr 变体、无 libltdl（6.6 = 最新 GCT v6.2.20260123 发布版）"
  - "LIBADD 仅 $(OPENSSL_LIBS)（-lssl -lcrypto），openssl 无 .la，无需 .la 替换 hack（区别于 globus-common/callout/openssl-error 先例）"
  - "上游 perl TAP 驱动经 PATH 解析到 libtool 包装脚本会重置 LD_LIBRARY_PATH，构建后用 .libs 真实 ELF 替换包装脚本再运行驱动（不改上游测试文件）"
