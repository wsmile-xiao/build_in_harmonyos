# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游 globus-gsi-proxy-ssl 自带 test/ 目录（automake parallel-tests，
# TAP 输出）：TESTS = test_pci.pl（perl 驱动 Test::More），
#   - 构建 check_PROGRAMS = test_pci（test_proxycertinfo.c）
#   - 5 个用例 × 4 断言 = 20 个 TAP 测试点：
#       norm（-out 生成 DER）/ log（-in 解码再 -out 重编码）/
#       compareder（两次 DER 逐字节比对）/ compare_stdout（两轮 stdout 自比）
#   - 纯本地确定性测试（DER 编码→解码→比对），无网络/证书需求
# 本次适配在 build() 内实跑（审查 rule4，模式同 globus-gsi-openssl-error
# 4.4 整改）：构建 test_pci 后，用 .libs 真实 ELF 替换 libtool 包装脚本
# （包装脚本会重置 LD_LIBRARY_PATH），注入 LD_LIBRARY_PATH（openssl 包
# lib + 本包 library/.libs）后运行 perl 驱动。

package: globus-gsi-proxy-ssl/6.6
homepage: "https://github.com/gridcf/gct"

# 上游官方测试：test/ 目录（automake parallel-tests TAP）
upstream_official_tests:
  - suite: "test/ (test_pci.pl, 等价 make check 的 TESTS 部分)"
    count: 20       # TAP 测试点：5 用例 × 4 断言（norm/log/compareder/compare_stdout）
    kind: "unit"
    command: "perl test/test_pci.pl"
    run_in_build: true
    result: "20/20 通过（100%）——build() 内构建 test_pci 后用 .libs 真实 ELF 替换 libtool 包装脚本，再运行 perl TAP 驱动（TAP 1..20 全 ok），OHOS aarch64 实测通过（见 CI 日志 TAP 输出）"

# 构建阶段执行的测试命令：上游测试已在 build() 实跑（见 conanfile.py build()）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "perl test/test_pci.pl"

# 说明：不使用 `make check` 驱动运行——perl 驱动经 PATH 解析到的是 libtool
# 包装脚本，包装脚本重置 LD_LIBRARY_PATH 导致依赖库运行时加载失败（同
# globus-callout 4.3 / globus-gsi-openssl-error 4.4 的教训）；改为构建后用
# .libs 真实二进制替换包装脚本（仅构建产物，不改上游测试脚本/期望数据），
# 注入 LD_LIBRARY_PATH 后直接运行 perl TAP 驱动。不修改任何上游测试内容。

# 适配补全测试（自研，非上游）：无
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test_package.c
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：include proxycertinfo.h + 链接 libglobus_proxy_ssl，构造 PROXYCERTINFO（path length=10 + PROXYPOLICY 策略与语言 OID）→ i2d DER 编码 → d2i 解码 → path length/策略字节/语言 OID 字段校验 → 解码结果二次编码逐字节比对，编译并运行验证库可用"
    command: "./test_globus_gsi_proxy_ssl"

# 测试断言总数 (test_package 实际统计：9 个 FAIL 出口——构造/set_path_length/
# set 策略/编码/解码/path_length 校验/策略字节校验/语言 OID 校验/二次编码比对)
assertion_count: 9
