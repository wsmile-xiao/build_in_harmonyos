software: gssdp
display: "gssdp"
description: "GSSDP — GObject-based SSDP (Simple Service Discovery Protocol) library (GUPnP stack)"
category: network
homepage: "https://gitlab.gnome.org/GNOME/gssdp"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建；OHOS profile 自动映射 host_system 为 harmonyos"
    - "gnome.mkenums() 交叉编译需 glib2 包 bin 的 glib-mkenums，tc.binaries 钉死绝对路径"
    - "glib2 包 .pc 文件 prefix=/ 损坏，复制+修复 prefix 到真实 package_folder"
    - "sniffer(gtk4)/introspection/vapi/gtk_doc/manpages 在鸿蒙工具链缺失，配方中 disable"
    - "共享库 strip 会破坏 .codesign 哈希，tc.strip=None；meson install 清理 DT_RUNPATH 需用 build 产物覆盖"
  common_dependencies:
    - "glib2"
    - "libsoup3"

versions:
  "1.6.6":
    status: built
    build_date: "2026-09-02"
