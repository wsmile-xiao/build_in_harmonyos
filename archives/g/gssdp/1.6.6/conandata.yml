# conandata.yml — gssdp 1.6.6
# 多镜像 URL：CI Worker 网络受限，单 URL 会下载超时；按可达性验证排序
# （NJU 镜像 200 且对 CI Worker 可达；download.gnome.org 官方源 200 作为备选；USTC/TUNA 对该版本 404 已排除）

sources:
  url:
    - "https://mirror.nju.edu.cn/gnome/sources/gssdp/1.6/gssdp-1.6.6.tar.xz"
    - "https://download.gnome.org/sources/gssdp/1.6/gssdp-1.6.6.tar.xz"
  sha256: "767d2275254ce0efeaeac64419ff9f4f0ad470d134ef672f5c556b2abb786bcb"

patches:
  - patch_file: "patches/0001-libgssdp-gssdp-net-posix.c.patch"
    patch_description: "suppress netlink path via recipe-injected GSSDP_NO_NETLINK feature macro (sysroot linux/socket.h + sys/socket.h both define sockaddr_storage so linux/netlink.h cannot compile; OHOS has no netlink); mac_lookup falls back to ip_address like upstream darwin/win branches"
    patch_type: "portability"
