# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gssdp 直接依赖 glib2(glib/gobject/gio) + libsoup3(libsoup-3.0)，无 libxml2 直接依赖"
  - "OHOS sysroot 的 linux/netlink.h 与 sys/socket.h 双重定义 sockaddr_storage，需 __OHOS__ 守卫排除 netlink"
  - "GObject 多副本 SIGABRT 根治：GLib 系 .pc 的 Libs 置空（含 PkgConfigDeps 生成的 generators/glib-2.0.pc），g_* 全 UND 统一解析到 libsoup-3.0.so 的唯一 gobject 副本"
  - "conan 2.29 override 折叠：根级 override 会折叠下游声明的同包 override require → 传递依赖重建时 PkgConfigDeps 丢 .pc（最小复现实验证实）"
  - "平台 LD_LIBRARY_PATH 含空格时 musl loader 解析失败，ninja 加载 libc++_shared.so 报 rc=127，meson 误报无 ninja"
  - "conan 2.29 移除 meson_layout，需手动 layout(): folders.build='builddir'、folders.generators='builddir/generators'"
  - "gnome.mkenums() 交叉编译需 glib2 包 bin 的 glib-mkenums（python 脚本），tc.binaries 钉死绝对路径"
  - "gssdp 上游测试(test-functional/test-regression)在 OHOS 设备原生执行 meson test 全过：TAP 子用例 9/9"

