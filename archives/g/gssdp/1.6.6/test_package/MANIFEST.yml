# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）

package: gssdp/1.6.6
homepage: https://gitlab.gnome.org/GNOME/gssdp

# 上游测试命令（meson test，build() 中在 OHOS 设备原生执行）
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 中集成上游测试（OHOS 设备原生跑）
upstream_test_in_build: true
upstream_test_command: "meson test -v --no-rebuild --timeout-multiplier=16"

# 上游测试（tests/ 目录，meson test 2 项，TAP 子用例合计 9 个）
upstream_tests:
  - file: tests/test-functional.c
    source: gssdp-1.6.6.tar.xz/tests/test-functional.c
    description: "SSDP 功能测试（7 个 TAP 子用例：client 创建、resource group 发现 ssdp:all/upnp:rootdevice/uuid/版本化匹配/向后兼容/忽略旧版本；localhost UPnP 实测收发）"
    command: "meson test 'Functional test'"
    cases: 7
  - file: tests/test-regression.c
    source: gssdp-1.6.6.tar.xz/tests/test-regression.c
    description: "Bug 回归测试（2 个 TAP 子用例：/bugs/ggo/7、/bugs/ggo/22，resource group 行为回归）"
    command: "meson test 'Bug regression test'"
    cases: 2

# test_package 自带测试（消费者视角，真实 API）
test_package_tests:
  - file: test_gssdp.c
    description: "gssdp 真实 API 冒烟：gssdp_client_new_for_address(回环地址) + gssdp_client_get_active + gssdp_resource_group_new + gssdp_resource_group_add_resource_simple + remove_resource"
    command: "./test_gssdp"

# 断言数：回环地址非空 + client 非空 + 无错误 + active 为真 + group 非空 + resource_id>0
assertion_count: 6
