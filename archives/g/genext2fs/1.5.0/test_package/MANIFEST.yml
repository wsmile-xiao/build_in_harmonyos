# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: genext2fs/1.5.0
homepage: "https://github.com/bestouff/genext2fs"

# Upstream test command（无需 root，可直接运行）
upstream_check_command: "sh test.sh"

# 上游测试套件（test.sh）实际存在且无需 root，本地实测通过：
#   dtest ×17 / ftest ×2 / ltest ×4 / atest ×1 = 24 个测试目标，
#   生成多种 ext2 镜像并做 MD5 字节级比对（含 device_table、tarball、
#   xattr、硬链接、深目录、长文件名、稀疏文件、卷标、-x 起始镜像等）。
#   仅 test-mount.sh（需 root 重新生成 digest）不运行。
# 本地实测：sh test.sh → exit=0，全部 PASS（无需 root）。
upstream_test_in_build: true
upstream_test_passed_locally: true

# test_package consumer-side tests
test_package_tests:
  - file: test_genext2fs.sh
    description: "Run genext2fs --version and generate an ext2 image"

# Test assertion count
assertion_count: 1
