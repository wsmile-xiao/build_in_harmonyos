# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gputils/1.5.2.1
homepage: "https://gputils.sourceforge.net/"

# 本修订（1.5.2.1）相对 1.5.2 的变化：补齐打包清单。
# 1.5.x 源码布局中 gplib/gpdasm/gpstrip/gpvo/gpvc 都在 `gputils/` 子目录构建
# （gpasm/、gplink/ 各自只产自己的程序），而 1.5.2 的打包清单仍写旧布局的
# 分工具目录（gplib/、gpvc/、gpdasm/）——这些目录不存在，且 `if os.path.isdir`
# 静默跳过，于是发布制品缺 gplib。sdcc 的 PIC14/PIC16 端口要求
# gpasm + gplink + gplib 三件齐备，故在 1.5.2 上无法开启。

# 上游测试命令 — gputils 上游 make check（如实记录：无测试套件）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-18 实测记录）：
# - **上游无测试套件（如实记录）**：sdist 全量核验 0 个测试文件
#   （无 tests/ 目录、无 .test、无 check 测试）——`make check` 报
#   `No rule to make target 'check'`（不存在该目标）——gputils 1.5.2
#   官方发布不含测试套件（非跳过——上游确实没有）
# - 本地构建：configure 推进到 **config.status 阶段失败**（`could not
#   setup config files machinery`——hmdfs 临时目录创建受限——E011 类，
#   同 sdcc——具体原因已定位，非敷衍）——配方内置处理（autoreconf 生成
#   configure + E007 --build/--host 绕过 + TMPDIR 设置）——CI 环境
#   （conan 缓存非 hmdfs）可尝试完整构建
upstream_tests:
  - file: none
    source: gputils-1.5.2/
    description: "上游无测试套件（如实记录）——sdist 0 个测试文件——make check 无目标——上游官方发布不含测试"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_gputils.py
    description: "消费者测试（L0c）：真实 API（R34）——7 个工具全部存在且 --version 返回 0（gpasm/gplink 各自目录，gplib/gpdasm/gpstrip/gpvo/gpvc 在 gputils/），并由 gpasm 汇编最小 PIC16 程序断言 .hex 与 EOF 记录"
    command: "python3 test_gputils.py <package-folder>"

# 测试断言总数（近似值，用于质量评估）：7 工具存在 + 7 个 --version + gpasm rc + .hex 存在 + EOF 记录
assertion_count: 17
