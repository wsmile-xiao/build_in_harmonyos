software: gputils
description: GNU PIC Utilities - development tools for PIC microcontrollers
category: embedded-tools

versions:
  1.5.0:
    status: published
    build_date: 2026-06-15
    notes: Successfully compiled on HarmonyOS aarch64 platform
    package: gputils-1.5.0-ohos-aarch64.tar.gz

homepage: https://gputils.sourceforge.net/
license: GPL-2.0+

tools:
  - gpasm (PIC assembler)
  - gplink (PIC linker)
  - gpdasm (disassembler)
  - gplib (library manager)
  - gpstrip (symbol stripper)
  - gpvc (COFF verifier)
  - gpvo (COFF viewer)

platforms_supported:
  - aarch64-unknown-linux-ohos

keywords:
  - pic
  - microcontroller
  - assembler
  - embedded
  - gnu