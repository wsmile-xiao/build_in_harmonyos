# test_package/MANIFEST.yml — gifdec 0.0-git.1dcbae1
# CI L0e requires this file to exist.

package: gifdec/0.0-git.1dcbae1
homepage: "https://github.com/lecram/gifdec"

# Upstream ships NO test suite and NO build system (repository contains
# only gifdec.c, gifdec.h, example.c — an interactive SDL2 player demo —
# and README). There is nothing upstream-testable without SDL2, which is
# a GUI library not available in CI workers.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs (example.c is a demo player, not a test).
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: >-
      Consumer API suite with programmatically synthesized GIF89a byte
      streams (no GIF file assets needed): 49 CHECK assertions covering
      header/LSD/GCT parsing (width/height/depth/palette/bgindex),
      single-pixel LZW decode, multi-code LZW decode, GCE graphic control
      (delay/transparency/tindex), NETSCAPE2.0 loop-count extension,
      local color table override, two-frame default-disposal canvas
      accumulation, gd_is_bgcolor query, gd_rewind re-decode, and the
      error contract (nonexistent file, bad signature, GIF87a version,
      missing GCT, garbage separator -> gd_get_frame -1). All anchors
      calibrated on OHOS aarch64 (clang 15) against unmodified upstream
      gifdec.c.
    command: "./test_gifdec <temp-dir>"

# 测试断言总数 (49 CHECK, 全部锚点经 OHOS aarch64 实测校准)
assertion_count: 49
