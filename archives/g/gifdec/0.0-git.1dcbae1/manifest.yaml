patches_applied: []

knowledge_gained:
  - "上游无构建系统的 .c+.h 分离单文件库：save() 生成薄 CMakeLists.txt 直接 add_library 即可 Conan 化，无需补丁"
  - "上游无测试套件（example.c 需 SDL2 GUI）时：test_package 程序化合成最小 GIF89a 字节流（GIF89a 头+LSD+2 色 GCT+图像描述符+手工 LSB-first 位打包 LZW 数据）即可在零文件资产条件下全 API 实测验证"
  - "gifdec LZW 码流手工构造锚点：min code size=2 时 [clear=4][code0] -> 0x04，[clear][code0][code1] -> 0x44 0x00（9 bit LSB-first 跨字节）"
