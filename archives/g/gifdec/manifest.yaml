# 软件级 manifest
# 文件位置: archives/g/gifdec/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: gifdec
display: "gifdec"
description: "Minimalist C library for reading GIF files (public domain, single gifdec.c + gifdec.h)"
category: library
homepage: "https://github.com/lecram/gifdec"
license: "Unlicense"

build_system: custom

ohos_adaptation:
  key_points:
    - "上游无构建系统（仓库仅 gifdec.c/gifdec.h/example.c/README），conanfile.py 生成薄 CMakeLists.txt 编译为静态库 libgifdec.a + 安装 gifdec.h"
    - ".c+.h 分离形态（非 header/源混合），无需任何实现宏，消费者直接 #include \"gifdec.h\" 链接即可"
    - "纯 C99 零第三方依赖（POSIX fd I/O + mem*，无 libm），OHOS aarch64 musl 交叉编译零补丁通过"
    - "上游无测试套件（example.c 是 SDL2 交互播放器演示），test_package 程序化合成最小 GIF89a 字节流全 API 实测（49 断言，锚点经 OHOS aarch64 实测校准）"
  common_dependencies: []

versions:
  "0.0-git.1dcbae1":
    status: built
    build_date: 2026-10-04
    conan_ref: "gifdec/0.0-git.1dcbae1"
