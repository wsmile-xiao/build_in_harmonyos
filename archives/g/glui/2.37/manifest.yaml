software: glui
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.37/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.37"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libglui/glui/archive/refs/tags/2.37.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  # Note: OpenGL and GLUT are runtime/link-time dependencies
  # Stub headers created for headless compilation
  dependencies:
    - "OpenGL/runtime"
    - "GLUT/runtime"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
# Source modifications tracked via track-edit:
# - CMakeLists.txt: Platform detection, conditional build, install targets
# - gl-stubs/GL/gl.h: Stub OpenGL/GLU header
# - gl-stubs/GL/glut.h: Stub GLUT header
patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-gl-stubs-GL-gl.h.patch"
  - "0003-gl-stubs-GL-glut.h.patch"
patch_count: 3

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "glui 依赖 OpenGL 和 GLUT，OpenHarmony 无预编译包，创建 stub 头文件实现 headless 编译"
  - "CMakeLists.txt 使用 find_package QUIET 实现平台检测，GL 不可用时回退到 stub 头文件"
  - "cmake_minimum_required 需从 2.8 升级到 3.5 以兼容 CMake 4.x"
  - "GLU 类型 GLUquadricObj 和函数 gluBuild2DMipmaps 需在 stub 中定义"
  - "glGetError 返回 GLenum 而非 void，否则 C++ 类型转换报错"

patch_generation:
  method: per-file-difflib
