software: gifski
# 软件级 manifest 模板
# 文件位置: archives/g/gifski/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件描述
description: "pngquant-based GIF encoder for nice-looking animGIFs"

# 主页
homepage: "https://gif.ski"

# 许可证
license: AGPL-3.0-or-later

# 类别（用于依赖排序）
# library | tool | utility | development | system
category: tool

# ============================================================
# 版本索引（软件级）
# ============================================================

# 已编译版本列表（按日期排序，最新在前）
versions:
  - version: "1.34.0"
    status: built
    build_date: "2026-05-25"
    build_system: cargo
    configure_options:
      - "--no-default-features"
      - "--features binary,gifsicle"
      - "--release"

# ============================================================
# 依赖关系（软件级）
# ============================================================

# 编译依赖（格式: software/version）
build_dependencies: []

# 运行依赖（格式: software/version）
runtime_dependencies: []

# ============================================================
# 知识索引（软件级）
# ============================================================

# 相关知识图谱条目
knowledge_links: []

# ============================================================
# 元数据
# ============================================================

# 首次编译日期
first_compile: "2026-05-25"

# 最后更新日期
last_updated: "2026-05-25"