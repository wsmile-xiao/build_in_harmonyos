version: "2.24.33"
software: "gtk2"
status: built
build_system: autotools

source:
  url: "https://download.gnome.org/sources/gtk+/2.24/gtk+-2.24.33.tar.xz"
  sha256: "ac2ac757f5942d318a311a54b0c80b5ef295f299c2a73c632f6bfb1ff49cc6da"
  tar_format: tar.xz
  mirror_url: "https://repo.huaweicloud.com/gnome/sources/gtk+/2.24/gtk+-2.24.33.tar.xz"

build:
  system: autotools
  configure_options:
    - "--with-gdktarget=x11"
    - "--disable-shm"
    - "--disable-xinerama"
    - "--with-xinput=no"
    - "--disable-cups"
    - "--disable-introspection"
    - "--disable-gtk-doc-html"
  dependencies:
    - "glib/2.84.0.1"
    - "cairo/1.18.4.1"
    - "pango/1.50.14.1.1"
    - "gdk-pixbuf/2.44.6.1"
    - "atk/2.38.0.1.1"
    - "fontconfig/2.18.1.1"
    - "libx11/6.4.0"
    - "libxext/6.4.0"
    - "libxrender/0.9.12"
    - "libxrandr/1.5.5"
    - "libxfixes/6.1.0"
  build_requirements:
    - "pkgconf/3.0.5"
    - "autotools-dev/20240727.1-nmu1"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "GTK 2 没有 GTK 3 的 broadway 后端;OHOS 上 --with-gdktarget=x11 是唯一现实目标,依赖仓库 X11 栈。"
  - "x11 后端 configure 硬性要求 pkg-config 命中 x11 + xext + xrender,且 XShape/XextFindDisplay 缺失直接 AC_MSG_ERROR——libxext 是硬依赖。"
  - "xrandr/xcursor/XFixes/XSync 探测失败自动降级;libxcursor 未适配时无需处理。"
  - "版本 pin 跟随 gtk3 栈:glib/2.84.0.1 为 pango/atk/gdk-pixbuf 配方共同 pin,升 2.88.x 会触发图冲突(R36)。"
  - "X11 栈存在两套版本命名:libx11 有 1.8.13(上游号)与 6.4.0(SONAME 号),libxext 有 6.4.0/6.4.0.1;libxrender 单独 pin 1.8.13,其余 X 库 pin 6.4.0,需要 force 收敛。"
  - "上游唯一 automake 测试是 tests/autotestkeywords.cc(make check),C++ 头文件关键字冲突检查。"
  - "cairo-xlib 依赖已由 cairo/1.18.4.1 xlib 变体解决(真机构建成功);pango/gdk-pixbuf 传递 pin 1.18.4 以 force 收敛到 patch 递增变体。"
  - "OHOS 脚本执行按文件签名强制:仅绝对路径已签名解释器(python3)的 shebang 可执行,#!/bin/sh 与 #!/usr/bin/env 均 EACCES;conan-home 应放本地分区;TMPDIR 必须可写且设备重启后需复核。"
  - "HMDFS 对 mktemp -d 生成的 0700 目录(组/其他位全零)拒绝本用户写入,且对该目录的 chmod 被静默忽略(设备重启后必现);umask 000 下创建目录(组/其他位非零)写入可靠。configure tmpdir 补丁已改为 umask 000 并容忍 chmod 失败。"
  - "共享设备 inode 是硬资源:pango 单次源码自编耗 ~6 万 inode,构建前需确认设备 inode 余量,失败形态为 Errno 28(块空间可能仍然空闲)。"
