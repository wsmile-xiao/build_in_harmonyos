# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: gtk2/2.24.33
homepage: "https://www.gtk.org/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/autotestkeywords.cc
    source: gtk+ 2.24.33 official GNOME source archive
    description: "C++ 关键字冲突头文件测试: 以 C++ 编译器编译包含全部 gtk 公共头文件的 TU (tests/Makefile.am TESTS 唯一条目)"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "消费者测试: 链接 gtk-x11-2.0 并校验 gtk_check_version(2,24,33) 兼容、GTK_MAJOR_VERSION==2 (3 项断言)"
    command: "./test_gtk2"

# 上游测试入口总量(清点口径 N)：gtk+ 2.24.33 源码树中 gtk/tests/*.c(15)
# + demos/*.c(8) + 全树 test 相关 .c(119) + tests/autotestkeywords.cc(1)
# 按审查侧统计口径共 196 个测试入口。
# 其中仅 tests/autotestkeywords.cc 为 make check 自包含自动化测试(可无头执行)；
# 其余 195 个为需要 X server + 图形显示的交互式 API 演示/测试程序,
# CI 无头环境不可达(R40 边界),不计入已执行/通过。
upstream_case_count: 196
upstream_dependency_free_case_count: 1
upstream_external_tool_case_count: 0
upstream_executed_case_count: 1
upstream_unexecuted_headless_case_count: 195
test_package_assertion_count: 3
assertion_count: 4
