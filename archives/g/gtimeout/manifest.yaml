software: gtimeout
display: "GNU Coreutils timeout (gtimeout)"
description: "GNU coreutils timeout 命令 — 在限定时间内运行命令，加 g 前缀以区分系统 timeout"
category: system
homepage: "https://www.gnu.org/software/coreutils/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 需添加 HarmonyOS 平台识别 (aarch64-unknown-linux-ohos)"
    - "musl libc FILE 结构体不透明，freadahead.c 需适配"
    - "configure 中 umask 077 在 HMDFS 上权限不足"
    - "timeout 命令不使用 fstat/lseek，无需 EACCES 补丁"
    - "9.11 已移除 freadptr.c 和 freadseek.c"
  common_dependencies: []

versions:
  "9.11":
    status: published
    build_date: "2026-08-21"
