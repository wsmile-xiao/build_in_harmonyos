version: "9.11"
software: gtimeout
status: published
build_date: "2026-08-21"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/coreutils/coreutils-9.11.tar.gz"
  sha256: "2033b8a3049c06bff49a9e3cea72bdf4683bcd0cbeb975211dd56dbaf8b736ae"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "CFLAGS=-fPIC -O2 -g"
  dependencies: []
  cc: "Clang 15.0.4 (HarmonyOS NDK)"
  cxx: clang++

patches_applied:
  - "0001-lib-freadahead.c.patch"
  - "0002-build-aux-config.guess.patch"

knowledge_gained:
  - "config.guess 需要添加 HarmonyOS 平台识别 (aarch64-unknown-linux-ohos)"
  - "musl libc FILE 结构体不透明，freadahead.c 需要适配 (__linux__ && !__GLIBC__)"
  - "configure 中 umask 077 在 HMDFS 上创建临时目录权限不足，需修改为 umask 0"
  - "automake/makeinfo 缺失时可通过 ACLOCAL=true MAKEINFO=true 绕过"
  - "timeout 命令本身不使用 fstat/lseek，无需 EACCES 补丁"
  - "9.11 中 freadptr.c 和 freadseek.c 已被移除，只需适配 freadahead.c"
  - "timeout 二进制安装后复制为 gtimeout 以区分系统 timeout"

binary_count: 1
man_page_count: 1
excluded_count: 0
excluded_commands: {}

test_results:
  method: "staging verification + conan test_package"
  staging_verification: "gtimeout --version PASS, gtimeout 5 echo OK, gtimeout 1 sleep 10 kill OK"
  conan_test: "test.sh runs gtimeout --version, command execution, timeout kill, preserve-status"

patch_generation:
  method: per-file-difflib
  patches_count: 2

conan_recipe:
  conanfile: true
  conandata: true
  test_package: true
  commands_json: true
