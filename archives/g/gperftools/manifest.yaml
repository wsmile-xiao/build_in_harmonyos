software: gperftools
display: "gperftools"
description: "High-performance C++ memory allocator and performance analysis libraries"
category: sys
homepage: "https://github.com/gperftools/gperftools"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "release tarball 的 config.guess 需识别 aarch64:HarmonyOS 为 aarch64-unknown-linux-ohos"
    - "configure 的 HMDFS 临时目录创建需将 umask 077 调整为 022"
    - "默认使用 tcmalloc_minimal 静态库，完整 profiler/heap 功能通过 Conan options 选择"
  common_dependencies: []

versions:
  "2.17.2":
    status: built
    build_date: "2026-09-10"
    conan_ref: "gperftools/2.17.2"
