sources:
  url: "https://github.com/gperftools/gperftools/releases/download/gperftools-2.17.2/gperftools-2.17.2.tar.gz"
  sha256: "bb172a54312f623b53d8b94cab040248c559decdb87574ed873e80b516e6e8eb"

patches:
  - patch_file: "patches/0001-config.guess-ohos.patch"
    patch_description: "0001 Teach config.guess to identify aarch64 HarmonyOS as linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-ohos.patch"
    patch_description: "0002 Use HMDFS-compatible permissions for configure temporary directories"
    patch_type: "portability"
  - patch_file: "patches/0003-generic-writer-test-tmpdir.patch"
    patch_description: "0003 Use TMPDIR-aware temporary files in the generic writer test"
    patch_type: "portability"
  - patch_file: "patches/0004-gtest-tempdir-ohos.patch"
    patch_description: "0004 Use TMPDIR for GoogleTest captured streams"
    patch_type: "portability"
  - patch_file: "patches/0005-heap-profiler-test-tmpdir-ohos.patch"
    patch_description: "0005 Use TMPDIR for heap-profiler test temporary files"
    patch_type: "portability"
  - patch_file: "patches/0006-profiler-pprof-units.patch"
    patch_description: "0006 Parse unit-suffixed Go pprof CPU values in the legacy test"
    patch_type: "portability"
  - patch_file: "patches/0007-profiler-pprof-cumulative.patch"
    patch_description: "0007 Accept cumulative-only cross-thread entries from Go pprof"
    patch_type: "portability"
  - patch_file: "patches/0008-profiler-cpu-timer.patch"
    patch_description: "0008 Keep profiler legacy checks on the CPU timer"
    patch_type: "portability"
