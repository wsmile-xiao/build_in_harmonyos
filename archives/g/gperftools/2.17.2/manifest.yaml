  note: "上游完整配置在设备执行 make check 53/53（TOTAL=53, PASS=53, FAIL=0, SKIP=0, NOT_RUN=0）；默认 Conan 最小配置的 make check 为 29/29；Conan test_package 消费者为 1/1，真实运行 tc_version、tc_malloc、tc_calloc、tc_realloc 与 tc_free。"

upstream_test_count:
