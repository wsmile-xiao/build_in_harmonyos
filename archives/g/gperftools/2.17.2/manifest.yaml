knowledge_gained:
  - "gperftools 2.17.2 release tarball 已包含可接受 ohos* 的 config.sub，仅需补 config.guess"
  - "2.17.2 已移除旧版 heap checker 配置入口，配方不传递过时的 --enable-heap-checker"
  - "默认最小构建仍执行上游 make check，并由 test_package 运行真实 tcmalloc 消费者"
  - "OHOS Conan build() 必须导出 PWD=build_folder：HMDFS 上 getcwd 失败会让 bash 包装器与 configure 报 working directory cannot be determined"
