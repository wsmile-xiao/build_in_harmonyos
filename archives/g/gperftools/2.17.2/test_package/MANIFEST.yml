package: gperftools/2.17.2
homepage: "https://github.com/gperftools/gperftools"

# The source-level denominator is the complete upstream Automake TESTS list.
# The Conan recipe's default minimal configuration executes its 29-target
# subset; the full optional configuration is run separately with the exact
# environment recorded below.
upstream_check_command: "CPUPROFILE_REALTIME=1 PPROF_BINARY_PATH=$PWD TCMALLOC_STACKTRACE_METHOD=generic_fp make -j1 check"
upstream_test_in_build: true
upstream_test_command: "CPUPROFILE_REALTIME=1 PPROF_BINARY_PATH=$PWD TCMALLOC_STACKTRACE_METHOD=generic_fp make -j1 check"
upstream_test_source: "src/Makefile.am TESTS += entries; count command: grep -cE '^[[:space:]]*TESTS[[:space:]]*\\+=' src/Makefile.am"
upstream_test_target_count: 53
upstream_test_count_unit: "Automake TESTS target"
upstream_test_count_result: "TOTAL=53 PASS=53 FAIL=0 SKIP=0 NOT_RUN=0; make exit=0"
default_minimal_test_command: "make -j1 check"
default_minimal_test_target_count: 29

test_package_tests:
  - file: test_gperftools.cpp
    description: "消费者调用 tc_version、tc_malloc、tc_calloc、tc_realloc、tc_malloc_size 和 tc_free"
    command: "./test_gperftools"
    assertion_count: 6

assertion_count: 6
