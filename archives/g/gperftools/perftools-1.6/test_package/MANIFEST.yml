# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gperftools/perftools-1.6
homepage: "https://github.com/gperftools/gperftools"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (perftools-1.6 tag 的 src/tests/ 单元测试)
upstream_tests:
  - file: src/tests/atomicops_unittest.cc
    source: gperftools-perftools-1.6/src/tests/atomicops_unittest.cc
    description: "原子操作 arm64 实现自检"
    command: "./atomicops_unittest"
  - file: src/tests/low_level_alloc_unittest.cc
    source: gperftools-perftools-1.6/src/tests/low_level_alloc_unittest.cc
    description: "低级分配器自检"
    command: "./low_level_alloc_unittest"
  - file: src/tests/stacktrace_unittest.cc
    source: gperftools-perftools-1.6/src/tests/stacktrace_unittest.cc
    description: "栈回溯 (backtrace) 自检"
    command: "./stacktrace_unittest"
  - file: src/tests/addressmap_unittest.cc
    source: gperftools-perftools-1.6/src/tests/addressmap_unittest.cc
    description: "地址映射表自检"
    command: "./addressmap_unittest"
  - file: src/tests/tcmalloc_unittest.cc
    source: gperftools-perftools-1.6/src/tests/tcmalloc_unittest.cc
    description: "tcmalloc 主分配器单测"
    command: "./tcmalloc_minimal_unittest"
  - file: src/tests/realloc_unittest.cc
    source: gperftools-perftools-1.6/src/tests/realloc_unittest.cc
    description: "realloc 语义自检"
    command: "./realloc_unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：tc_malloc/tc_free/malloc/free 可用性验证"
    command: "./test_gperftools"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 36