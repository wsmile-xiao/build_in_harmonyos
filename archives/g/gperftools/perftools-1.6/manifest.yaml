# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS clang 默认把 __thread 编译为 emulated TLS；__emutls_get_address 首访经 malloc 惰性分配 TLS 块，在 tcmalloc 分配器内递归崩溃 -> 全构建注入 -fno-emulated-tls（tc.extra_cxxflags/extra_cflags）"
- "HMDFS 上 mktemp -d 生成 0700 目录本进程不可写 -> configure/config.status 临时目录添加 umask 022 && mkdir 回退分支"
- "C++17 移除 throw 动态异常规范/register/std::random_shuffle；PRI 宏紧贴字符串字面量被解析为用户自定义后缀 -> 需补空格分隔"
- "AArch64 无 32 位原子内置 -> 新增 src/base/atomicops-internals-arm64.h（__sync_*/__atomic_*）并以 exports_sources 携带（refresh-patch 会丢弃 git 风格新文件补丁）"
- "OHOS 上 SetTestResourceLimit 的 RLIMIT_AS=1GiB 下 rnd.alloc(100MB) 大分配受限；测试脚本 /tmp 只读需 TMPBASE 回退 $HOME/tmp"

