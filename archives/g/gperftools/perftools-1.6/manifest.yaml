# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/perftools-1.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "perftools-1.6"

# 软件名
software: "gperftools"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/gperftools/gperftools/archive/refs/tags/perftools-1.6.tar.gz"

  # 源码校验和
  sha256: "da3f377290ec5fa6547a6384ba7e05b8b54a32b130ac553412094f649445e753"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--enable-static"
  - "--disable-shared"
  # gperftools 为系统同名分配器库（tcmalloc），按 R26 强制静态链接；
  # 另注入 -fno-emulated-tls 至 CXXFLAGS/CFLAGS（emutls 惰性 TLS 递归）。

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 无第三方编译依赖；运行时需 libc++_shared（package_info system_libs）

  # 编译器
  cc: clang
  cxx: clang++

