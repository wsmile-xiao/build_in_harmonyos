# test_package/MANIFEST.yml — L0e 声明文件（上游测试 + 消费者测试）
package: gweather-locations/2026.2
homepage: "https://gitlab.gnome.org/GNOME/gweather-locations"

# 上游测试命令（meson test --list 分析）
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test（build() 内 Meson(self).test()，suite=lint）"

# 上游实际注册的测试
# 2026.2 tarball 无 tests/ 目录、无功能测试套件；data/meson.build 仅条件注册
# 2 个 lint 项（required:false）：xmllint --valid 校验 Locations.xml 符合随包
# locations.dtd（xmllint 在 PATH 时注册），pylint 风格检查（pylint 未安装则不注册）。
upstream_tests:
  - name: "Valid Locations file"
    description: "xmllint --valid 校验 Locations.xml 符合随包 locations.dtd"
    command: "meson test 'Valid Locations file'"

# test_package 自带的消费者测试（真实执行证据）
test_package_tests:
  - file: test_locations.py
    description: "纯 python GVariant 反序列化器完整解析 Locations.bin：magic、顶层 5 成员结构、规模下界（locations/timezones/countries/METAR）、全部 children/parent/nearest/tz-hint/zones 索引界内、Europe/Paris + America/New_York、Paris 城市、London/Tokyo 条目、LFPG 台站"
    command: "<python3> test_locations.py <package_folder>/lib/gweather-locations/Locations.bin"
  - file: conanfile.py
    description: "安装面完整性守卫：Locations.bin/Locations.xml/locations.dtd/gweather-locations.pc 存在且 pc 含 locations_db/locations_xml 变量"
    command: "conan test_package（conan create 自动执行）"

# 测试断言总数（test_locations.py 17 项 check + conanfile.py 6 项守卫）
assertion_count: 23
