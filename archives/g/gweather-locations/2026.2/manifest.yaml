knowledge_gained:
  - "上游 meson.build 用 import('python').find_installation('python3', modules:['gi']) 硬依赖 PyGObject：OHOS 用 recipe 内置纯 python gi shim（GLib.Variant 序列化子集）经 PYTHONPATH 供入，探测与生成共用"
  - "GVariant tuple framing offsets 按子顺序逆序追加（等价 GLib 实现）；先前的正序 bug 产出能通过 magic 校验但解析即崩的 Locations.bin（libgweather TAP start<=end 崩溃的根因）"
  - "数组元素 framing offsets 为正序、每元素一个（含末元素）；tuple 为非末变量子元素各一个、逆序——两者不可混用"
  - "framing offset 字宽由容器序列化后总大小决定（<=255:1B / <=65535:2B / <=2^32-1:4B / 其余 8B），解析端可据总大小直接定宽"
  - "上游仅有的 meson test 是条件注册的 lint 项（xmllint --valid 校验 Locations.xml；pylint 未安装则不注册）；xmllint 在 PATH 时 Meson.test() 真实执行 1/1 OK"
  - "gweather-locations.pc 的 locations_db 变量（libdir/gweather-locations/Locations.bin）是 libgweather-4 顶层 meson 的消费入口"
  - "数据型包 conan test_package 消费：self.dependencies 取 package_folder 后用 python 全量解析校验，无 CMake 目标（无头文件/库，CMakeDeps 会生成坏 target）"
