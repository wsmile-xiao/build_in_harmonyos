software: gweather-locations
display: "gweather-locations"
description: "GNOME 世界位置数据库数据包：为 libgweather 4.x 提供 Locations.bin（GVariant 格式世界位置/时区数据库）、Locations.xml/locations.dtd 与翻译"
category: data
homepage: "https://gitlab.gnome.org/GNOME/gweather-locations"
license: GPL-2.0-or-later
build_system: meson
ohos_adaptation:
  key_points:
    - "构建期生成器 build-aux/gen_locations_variant.py 需 python3 + gi（PyGObject）；OHOS 无 PyGObject，recipe 内置纯 python gi shim（GVariant little-endian normal form 序列化子集），经 PYTHONPATH 注入 meson 的 find_installation('python3', modules:['gi']) 探测与 ninja 执行"
    - "GVariant tuple framing offsets 必须按子顺序逆序写入（shim 关键修复点；逆序 bug 会产出 libgweather TAP 解析崩溃的坏库）"
    - "ninja 需以绝对路径经 NINJA 注入（musl python 子进程解析不了 hnp 裸名符号链接）；探测期补 LD_LIBRARY_PATH=/system/lib64"
    - "pkgconfig 输出 locations_db/locations_xml/locations_dtd 变量，是 libgweather-4 meson dependency('gweather-locations') 的消费入口（GWEATHER_LOCATIONS_DB）"
    - "Locations.bin 为 host-endian 数据，settings 保留 os/arch；本包无 C/C++ 编译产物"
  common_dependencies: []
versions:
  "2026.2":
    status: built
    build_date: "2026-10-02"
    conan_ref: "gweather-locations/2026.2"
