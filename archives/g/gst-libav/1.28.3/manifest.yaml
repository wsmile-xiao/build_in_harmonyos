software: gst-libav
build_system: meson
version: "1.28.3"
status: published
build_date: "2026-08-27"

source:
  url: "https://gstreamer.freedesktop.org/data/src/gst-libav/gst-libav-1.28.3.tar.xz"
  sha256: "28fcd45d9ace261d4bda896466d5326af6efd2fcf0a20f24502094b5a9955bdf"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "--wrap-mode=default"
    - "-Dtests=disabled"
    - "-Ddoc=disabled"
  dependencies:
    - gstreamer/1.28.3
    - ffmpeg/7.1.5
    - glib2/2.88.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "gst-plugins-base not published as conan package; built as meson subproject"
  - "FFmpeg .pc files report project version not library ABI version; fixed in build()"
  - "glib2 libintl.a has g_-prefixed gettext; stub library provides standard names"
  - "meson fallback disabled by conan native file; must pass --wrap-mode=default"
