software: gst-libav
build_system: meson
version: "1.28.3"
status: built
build_date: "2026-05-30"

source:
  url: "https://gstreamer.freedesktop.org/src/gst-libav/gst-libav-1.28.3.tar.xz"
  sha256: ""
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dtests=disabled"
    - "-Ddoc=disabled"
  dependencies:
    - gstreamer/1.28.3
    - gst-plugins-base/1.28.3
    - glib/2.88.0
    - ffmpeg/7.1
  cc: clang
  cxx: clang++
  build_commands:
    setup: "meson setup _build --prefix=$DEFAULT_PREFIX -Dtests=disabled -Ddoc=disabled"
    compile: "ninja -C _build"
    install: "ninja -C _build install DESTDIR=$TEST_PREFIX"

patches_applied: []

knowledge_gained:
  - "gst-libav 1.28.3 使用 meson 构建，直接编译无需平台适配补丁"
  - "gst-libav 是纯插件包，无独立可执行文件（bin/ 目录为空）"
  - "FFmpeg 库静态链接到插件中，导致插件体积较大（78MB）"