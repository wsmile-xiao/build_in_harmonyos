software: gitpython
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.1.57/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.1.57"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/source/g/gitpython/gitpython-3.1.57.tar.gz"

  # 源码校验和
  sha256: "c493ec57c0ef6b19743798b6a5af859c71814b524e7e6f97baa2f8e658961488"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "pip install --target=install --no-deps"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "gitdb/4.0.12"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "gitpython is a pure Python package (no C extension to compile)"
  - "Runtime dependency: gitdb>=4.0.1,<5 (declared as Conan requirement gitdb/4.0.12)"
  - "typing-extensions is only required on python_version < 3.10 — not needed for python3.12"
  - "Built using pip install --target --no-deps (gitdb precedent recipe pattern)"
  - "Upstream pytest suite: 784 collected, 695 passed / 74 skipped / 14 failed on local OHOS env (all failures environment-bound, see notes.md)"
