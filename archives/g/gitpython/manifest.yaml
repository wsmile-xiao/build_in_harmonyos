software: gitpython
display: "GitPython"
description: "Python library used to interact with Git repositories"
category: development
homepage: "https://github.com/gitpython-developers/GitPython"
license: BSD-3-Clause
build_system: custom

ohos_adaptation:
  key_points:
    - "Pure Python package, no compilation required"
    - "Runtime dependency: gitdb>=4.0.1,<5 (declared as Conan requirement gitdb/4.0.12)"
    - "typing-extensions only needed on python_version < 3.10 — not required for python3.12"
    - "Built using pip install --target --no-deps (gitdb precedent recipe pattern)"
    - "Requires host git executable at runtime (GIT_PYTHON_GIT_EXECUTABLE or PATH)"
  common_dependencies:
    - "gitdb/4.0.12"

versions:
  "3.1.57":
    status: built
    build_date: "2026-09-19"
