---
test_package: gym
version: "0.26.2"
test_type: explicit
description: |
  Validates the packaged gym 0.26.2 Python package on OHOS aarch64 via
  real API calls (no mocks): package identity (version 0.26.2, imported
  from the conan package), CartPole reset/step loop, SyncVectorEnv,
  cloudpickle round-trip, seeded space sampling, TimeLimit wrapper.
upstream_tests:
  description: |
    Upstream openai/gym 0.26.2 ships a full pytest suite (tests/, 1336
    tests collected when runnable). It is executed FOR REAL in
    conanfile.py build() on the OHOS aarch64 worker (unmodified), with the
    runtime deps (numpy 1.26.4 etc.) installed into a private dir via
    `pip --target` and PYTHONNOUSERSITE=1 (worker user-site numpy 2.x is
    unreadable by the worker uid and unsupported by gym):
      1336 collected; baseline (this platform, numpy 1.26.4 / pytest 9.1.1
      / Python 3.12.9): 1242 passed / 81 failed / 13 skipped (~45 s).
    All 81 failures are ENVIRONMENTAL, zero are OHOS adaptation regressions:
      - 38: upstream assertion code trips on numpy>=1.24 `np.bool8`
        deprecation warnings (upstream pins numpy>=1.18, suite written for
        numpy<1.24)
      - 28: require optional extra box2d+pygame (gym[box2d]) for render
        modes / box2d envs — extra not in install_requires
      - 7: require optional extra moviepy (recording)
      - 4: MultiDiscrete/MultiBinary sample_contains edge under newer
        numpy semantics
      - 3: warning-assertion drift (pytest version)
      - 1: Py3.12 removed pytest.warns(None) usage
  location: "tests/"
  framework: pytest
  executed_in_build: true
  collection_exemptions:
    - file: tests/envs/test_env_implementation.py
      reason: "collection error: requires optional extra box2d+pygame (gym[box2d]), not in install_requires"
    - file: tests/utils/test_play.py
      reason: "collection error: imports pygame (extra), not in install_requires"
    - file: tests/utils/test_save_video.py
      reason: "collection error: requires optional extra moviepy"
    - file: tests/wrappers/test_atari_preprocessing.py
      reason: "collection error: requires optional extra ale (Autoregressive Learning Environments, atari ROMs)"
  failure_exemption: |
    Per TEST_QUALITY_SPEC 3.3: the 81 environmental failures above are
    declared instead of patching upstream tests. No upstream test file is
    modified, no assertion weakened; the suite runs unmodified and the real
    numbers are printed in the conan build log (L1c evidence).
test_package_tests:
  - file: test_gym.py
    description: |
      6 HarmonyOS-PC-specific checks (real API calls against the conan
      package): identity/version, CartPole core loop, SyncVectorEnv,
      cloudpickle round-trip (parallelism path), seeded space sampling,
      TimeLimit wrapper semantics.
conanfile: conanfile.py
settings: ["os", "arch"]
