# 版本级 manifest — gym 0.26.2
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "0.26.2"

# 软件名
software: gym

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub tag tarball — 含上游 tests/；
  # PyPI sdist 不含 tests/，无法真实跑上游 pytest，故不用）
  url: "https://github.com/openai/gym/archive/refs/tags/0.26.2.tar.gz"

  # 源码校验和（sha256，实测两次一致）
  sha256: "96a5fc8345bd92b73a15fc25112d53a294f86fcace1c5e4ef7f0e052b5e1bdf4"

  # tarball 格式
  tar_format: tar.gz

# ============================================================
# 构建信息
# ============================================================

build:
  system: custom
  # 配方 build()：
  #   1. python3 -m pytest tests/（上游官方全量套件 1336 用例真实执行，L1c）
  #      - 4 个文件因可选 extras（box2d/pygame、moviepy、ale）收集期
  #        错误而排除（MANIFEST.yml 已声明豁免，非上游 install_requires）
  #      - 基线（OHOS aarch64, numpy 1.26.4, pytest 9.1.1, Python 3.12.9）：
  #        1242 passed / 81 failed / 13 skipped，81 失败全部为环境性
  #        （np.bool8 弃用告警断言 / 缺 box2d / 缺 moviepy / numpy 新语义 /
  #        Py3.12 pytest.warns(None) 移除），0 个为 OHOS 适配回归
  #   2. 纯 Python 包：gym/ 目录整体复制到 lib/python3.12/site-packages/
  configure_options: []
  dependencies: []
  # 运行时 Python 依赖（worker 基线 aarch64-linux-ohos 轮子，非 Conan 依赖）：
  #   numpy>=1.18, cloudpickle>=1.2.0, gym_notices>=0.0.4（install_requires）
  #   pytest（测试执行器）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# 零源码修改：gym 0.26.2 为 100% 纯 Python（无 C 扩展），
# OHOS aarch64 原生可用，无需任何适配改动。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gym 0.26.2 是 openai/gym 最后一个官方版本（2023-01，MIT），上游已停止维护并迁移到 Farama gymnasium"
  - "PyPI sdist 不含 tests/ 目录 —— 纯 Python 包跑上游测试必须用 GitHub tag tarball"
  - "OHOS worker 基线 numpy 1.26.4 轮子缺 numpy.libs/libopenblas.so.0，需桥接 scipy/.libs/libopenblas.so（配方内自动 symlink）"
  - "gym 上游测试套件对 numpy>=1.24 的 np.bool8 弃用告警断言过严（38/81 失败源），属上游版本漂移，非平台问题"
