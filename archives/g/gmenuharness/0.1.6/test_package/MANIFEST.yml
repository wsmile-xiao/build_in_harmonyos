package: gmenuharness/0.1.6
homepage: "https://gitlab.com/ubports/development/core/gmenuharness"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "./test_upstream_unit (test_package-phase gtest build of vendored tests/unit/TestMatchResult.cpp, 4 cases)"

upstream_tests:
  - file: tests/unit/TestMatchResult.cpp
    source: gmenuharness-0.1.6/tests/unit/TestMatchResult.cpp
    description: "Upstream gtest unit test: SuccessFailAndMessage"
    command: "./test_upstream_unit --gtest_filter=TestMatchResult.SuccessFailAndMessage"
  - file: tests/unit/TestMatchResult.cpp
    source: gmenuharness-0.1.6/tests/unit/TestMatchResult.cpp
    description: "Upstream gtest unit test: MergeTwoFailed"
    command: "./test_upstream_unit --gtest_filter=TestMatchResult.MergeTwoFailed"
  - file: tests/unit/TestMatchResult.cpp
    source: gmenuharness-0.1.6/tests/unit/TestMatchResult.cpp
    description: "Upstream gtest unit test: MergeFailedIntoSuccess"
    command: "./test_upstream_unit --gtest_filter=TestMatchResult.MergeFailedIntoSuccess"
  - file: tests/unit/TestMatchResult.cpp
    source: gmenuharness-0.1.6/tests/unit/TestMatchResult.cpp
    description: "Upstream gtest unit test: CopyAssignment"
    command: "./test_upstream_unit --gtest_filter=TestMatchResult.CopyAssignment"
  - file: tests/functional/FunctionalTests.cpp
    source: gmenuharness-0.1.6/tests/functional/FunctionalTests.cpp
    description: "Upstream gtest functional test ImportSimple (SKIPPED: requires Qt Core+DBus, libqtdbustest, dbus-test-runner and a running D-Bus session daemon, unavailable on OHOS)"
    command: "skipped: Qt DBus + libqtdbustest + D-Bus session daemon unavailable on OHOS"
  - file: tests/functional/FunctionalTests.cpp
    source: gmenuharness-0.1.6/tests/functional/FunctionalTests.cpp
    description: "Upstream gtest functional test ImportDeeperMatchAll (SKIPPED: requires Qt Core+DBus, libqtdbustest, dbus-test-runner and a running D-Bus session daemon, unavailable on OHOS)"
    command: "skipped: Qt DBus + libqtdbustest + D-Bus session daemon unavailable on OHOS"

test_package_tests:
  - file: test.cpp
    description: "Consumer test 1: MatchResult failure/merge/concat_failures via the real library"
    command: "./test_gmenuharness"
  - file: test.cpp
    description: "Consumer test 2: MenuItemMatcher builder chain (label/action/attributes/submenu) links and runs against the real library"
    command: "./test_gmenuharness"

assertion_count: 10
