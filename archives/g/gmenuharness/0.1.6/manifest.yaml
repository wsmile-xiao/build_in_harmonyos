# gmenuharness 0.1.6 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.6"

software: gmenuharness

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-12"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.com/ubports/development/core/gmenuharness/-/archive/0.1.6/gmenuharness-0.1.6.tar.gz"

  # 源码校验和
  sha256: "b07719032ef199789ac279dd2311ad8acfa0f3def57369ae20946b15f8285914"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-Denable_tests=OFF"
    - "-DENABLE_QT6=OFF"
    - "-DWerror=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.88.3
    - gtest/1.17.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-remove-lomiri-api-dependency.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "gmenuharness 核心库仅需 glib-2.0/gio-2.0 + 单个 lomiri/util/ResourcePtr.h 头文件；liblomiri-api 无需整包适配"
  - "上游 enable_tests=ON 强依赖 Qt Core+DBus、GMock、libqtdbustest 与 D-Bus session，OHOS 无此栈；配方以 enable_tests=OFF 构建主库，另行直编直跑 tests/unit 4 个 gtest 用例"
