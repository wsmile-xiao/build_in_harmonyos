# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gcal/v4
homepage: "https://www.gnu.org/software/gcal/"

# 上游测试清点 (R51): gcal 4 源码树无任何测试资产。取数方式已固化进
# conanfile.py 的 build()（_audit_upstream_tests）在每次 conan create 时重打实测值，
# 鸿蒙 aarch64 真机 2026-09-21 日志原文：
#   gcal/v4: upstream_test_audit: Makefile.am=8 test_dirs=0 TESTS_declarations=0
# 即整棵发布树 8 个 Makefile.am、0 个 tests|test|gltests 目录、0 条 `TESTS =` 注册，
# 顶层与 src/Makefile.am 的 check 目标退化为 automake 标准空递归壳。
# 手工等价命令（在解包树根目录）：
#   find . -name Makefile.am | wc -l                                        # 8
#   find . -type d \( -name tests -o -name test -o -name gltests \) | wc -l # 0
#   find . -name Makefile.am | xargs grep -cE '^[[:space:]]*TESTS[[:space:]]*[:+]?='  # 全 0
# 上游静态用例总数: 0
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无 (上游无自动化测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_gcal.py
    description: "消费者测试: 运行打包后的 gcal 二进制, 断言 --version 横幅、1992 年 2 月闰年真实排版(2/1 落 Sa 列、29 天)、无参月度网格(Su-Sa 表头)与未知选项非零退出"
    command: "python3 test_gcal.py <bindir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
