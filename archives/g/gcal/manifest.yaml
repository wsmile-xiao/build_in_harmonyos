software: gcal
display: "GNU gcal"
description: "Gregorian calendar program computing and printing calendar sheets on the command line"
category: utility
homepage: "https://www.gnu.org/software/gcal/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools tree; 2015-era config.guess/config.sub do not know the ohos triplet (E007) — build() swaps in the automake/1.18 copies and pins --build"
    - "configure must run under CONFIG_SHELL=/bin/sh (E386: the profile bash cannot getcwd() on HMDFS)"
    - "config.status umask 077 -> 022 patch (E011: HMDFS uid mapping makes the 0700 mktemp dir unwritable)"
    - "gl_cv_have_weak=no: OHOS toolchain rejects gnulib's #pragma weak pthread_cancel probe"
    - "Upstream registers no automake TESTS; coverage comes from the test_package consumer driver"
  common_dependencies: []

versions:
  "4.0":
    status: built
    build_date: "2026-09-17"
    conan_ref: "gcal/4.0"
  # The task card asks for 4, the same upstream release (upstream publishes no
  # separate "4.0" artifact — the tarball is gcal-4.tar.gz and the banner reads
  # "gcal (GNU cal) 4"). Conan rejects one-character versions, so the archive
  # directory keeps 4 while the artifact is gcal/v4 - same shape as the merged
  # cronic/3 -> cronic/v3 and cmospwd/5 -> cmospwd/v5.
  "4":
    status: built
    build_date: "2026-09-21"
    conan_ref: "gcal/v4"
