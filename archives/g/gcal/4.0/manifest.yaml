# 版本级 manifest — gcal 4.0
# 遵循 ARCHIVE-SPEC v2.0
# 版本串说明：上游发布名为 gcal-4（单字符 4），Conan 版本需 ≥2 字符，故统一用 4.0
# （目录 archives/g/gcal/4.0/、分支 feat/gcal-4.0、配方 version 三处一致）。

version: "4.0"
software: "gcal"

status: built
build_date: "2026-09-17"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/gcal/gcal-4.tar.gz"
  sha256: "0b582b7fad60b66bc3fae139d95ead910a1b4c8ae2d34aed30618f3e92ec16de"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "CONFIG_SHELL=/bin/sh sh configure --build=aarch64-unknown-linux-ohos --prefix=<pkg> --disable-nls gl_cv_have_weak=no"
    - "make -j1 MAKEINFO=true"
  dependencies:
    - automake/1.18   # 构建期工具依赖（E007：提供现代 config.guess/config.sub 副本）
  cc: clang
  cxx: clang++

patches_applied:
  - "0003-configure.patch"

patch_classification:
  - file: 0003-configure.patch
    type: manual
    platform_only: True
    note: "E011 受控方案：config.status 内 umask 077 → 022（保留真实临时目录创建）"

knowledge_gained:
  - "E386：profile buildenv 的 OHOS bash 在 HMDFS 构建目录 getcwd 必挂 → configure 内联 CONFIG_SHELL=/bin/sh"
  - "E007：2015 年老 config.guess/config.sub 不认 aarch64-unknown-linux-ohos → build() 用 automake/1.18 包内副本整体覆盖 + configure 钉 --build 三元组（不落全文件补丁，避免 AI 评审判『变更过大』跳过）"
  - "gnulib 的 #pragma weak pthread_cancel 探测被 OHOS 工具链拒绝 → configure 传 gl_cv_have_weak=no 走非弱符号路径"
  - "构建环境无 texinfo → make 传 MAKEINFO=true 跳过 info 文档"
