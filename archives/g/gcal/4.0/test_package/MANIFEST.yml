# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gcal/4
homepage: "https://www.gnu.org/software/gcal/"

# 上游测试清点 (R51): gcal 4 源码树无任何测试资产 —— 无 tests/ 目录、
# 无 dejagnu/ctest 注册; 顶层与 src/Makefile.am 均无 TESTS 变量定义
# (grep "TESTS" 计 0); Makefile.in 的 check 目标为 automake 标准递归空壳。
# 上游静态用例总数: 0。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无 (上游无自动化测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_gcal.py
    description: "消费者测试: 运行打包后的 gcal 工具, 断言 --version 横幅、1992 年 2 月闰年真实排版(2/1 落 Sa 列、29 天)与未知选项非零退出"
    command: "python3 test_gcal.py <bindir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
