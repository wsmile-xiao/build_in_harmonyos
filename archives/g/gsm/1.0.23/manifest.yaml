version: "1.0.23"
status: published
build_date: "2026-04-24"

source:
  url: "https://www.quut.com/gsm/gsm-1.0.23.tar.gz"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=clang"
    - "CCFLAGS=-c -O2 -DNeedFunctionPrototypes=1 -Wall -Wno-comment -fPIC"
    - "LN=ln -s"
  cc: clang

patches_applied:
  - "0001-makefile-clang-ln-s.patch"

knowledge_gained:
  - "HMDFS 不支持硬链接，需设置 LN=ln -s"
  - "需添加 -fPIC 到 CCFLAGS"
