software: gxr
display: "gxr"
description: "GLib/GObject abstraction for OpenXR and OpenVR APIs"
category: graphics
homepage: "https://gitlab.freedesktop.org/xrdesktop/gxr"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "OHOS AArch64 builds the backend-independent core while preserving and compiling every upstream test target"
    - "OpenXR Vulkan initialization now consumes runtime-required instance/device extensions and validates the selected physical device"
    - "Meson build-machine tools are selected by executable capability, so Linux cross builders never invoke target-architecture pkgconf or glslang"
    - "The X11-only keyboard synthesis example is excluded on HarmonyOS; all other portable examples remain in compile coverage"
  common_dependencies:
    - gulkan
    - gtk
    - glib
    - json-glib
    - harfbuzz

versions:
  "0.15.1":
    status: built
    build_date: "2026-09-09"
    conan_ref: "gxr/0.15.1"
