sources:
  "0.15.1":
    url: "https://gitlab.freedesktop.org/xrdesktop/gxr/-/archive/0.15.1/gxr-0.15.1.tar.gz"
    sha256: "26bb640be6d286ae5fbe54a67ff7151c0f87a9b6725d2c601682b1d6c0f5a2cf"
patches:
  "0.15.1":
    - patch_file: "patches/0001-examples-cube-scene-renderer.c.patch"
      patch_description: "Use integer zero for VkGraphicsPipelineCreateInfo.subpass instead of pointer-typed VK_NULL_HANDLE"
      patch_type: "portability"
      strip: 0
    - patch_file: "patches/0002-src-openxr-openxr-context.c.patch"
      patch_description: "Initialize OpenXR output structures and honor the runtime-selected Vulkan device and required extensions"
      patch_type: "portability"
      strip: 0
    - patch_file: "patches/0003-meson.build.patch"
      patch_description: "Expose POSIX clock APIs and limit Clang 15 warning noise from GLib macros"
      patch_type: "portability"
      strip: 0
    - patch_file: "patches/0004-examples-meson.build.patch"
      patch_description: "Do not build the X11-only keyboard synthesis example on HarmonyOS"
      patch_type: "portability"
      strip: 0
    - patch_file: "patches/0005-examples-cube-meson.build.patch"
      patch_description: "Link the cube example directly to the platform Vulkan loader used by its source files"
      patch_type: "portability"
      strip: 0
    - patch_file: "patches/0006-src-graphene-ext.h.patch"
      patch_description: "Add C++ linkage guards to the public Graphene helper declarations"
      patch_type: "portability"
      strip: 0
    - patch_file: "patches/0007-src-gxr-io.h.patch"
      patch_description: "Add C++ linkage guards to the public IO declarations"
      patch_type: "portability"
      strip: 0
    - patch_file: "patches/0008-src-gxr-time.h.patch"
      patch_description: "Add C++ linkage guards to the public time declarations"
      patch_type: "portability"
      strip: 0
    - patch_file: "patches/0009-src-meson.build.patch"
      patch_description: "Let the core library honor Meson default_library so the Conan shared option is not a dead option"
      patch_type: "portability"
      strip: 0
    - patch_file: "patches/0010-tests-meson.build.patch"
      patch_description: "Build all four upstream test executables, but register the three XR-runtime tests only when a backend is enabled"
      patch_type: "portability"
      strip: 0
