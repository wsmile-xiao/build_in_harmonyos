# Upstream and consumer test declaration for gxr/0.15.1.

package: gxr/0.15.1
homepage: https://gitlab.freedesktop.org/xrdesktop/gxr

upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_disabled_reason: >
  The OHOS core package has no published OpenXR/OpenVR Conan dependency, so
  backend-independent packaging registers test_io and compiles all four test
  programs. A matching OpenXR build executes all four upstream registrations
  with Monado simulated HMD and llvmpipe; that suite passes 4/4.

upstream_tests:
  - file: tests/test_io.c
    description: "GResource extraction and cache-path IO"
    status: "compiled and executed; passed"
  - file: tests/test_overlay.c
    description: "XR context, Vulkan texture and overlay submission"
    status: "compiled and executed in OpenXR simulation; passed"
  - file: tests/test_context.c
    description: "XR scene/overlay context lifecycle and quit event"
    status: "compiled and executed in OpenXR simulation; passed"
  - file: tests/test_actions.c
    description: "XR action manifest and controller binding load"
    status: "compiled and executed in OpenXR simulation; passed"

test_package_tests:
  - file: test_package/gxr_test.cpp
    description: >
      C++ consumer invokes the installed library's timespec conversion,
      GxrDevice state/model/pose API, Graphene transformation round-trip,
      GxrDeviceManager construction and cache path generation.
    command: "conan create (test_package builds and executes gxr_test when target execution is available)"
    status: "OHOS compile/link passed; matching native execution passed"

assertion_count: 19
