software: graphviz
display: "Graphviz"
description: "Graph Visualization Software - open source graph visualization software"
category: data
homepage: "https://graphviz.org/"
license: EPL-1.0
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "CMake 构建系统使用相对库路径（../../lib/gvc/libgvc.so），需使用静态链接"
    - "BUILD_SHARED_LIBS=OFF 解决 DT_NEEDED 相对路径问题"
    - "需要添加 -lc++ -lc++abi 链接选项"
  common_dependencies:
    - cmake

# 版本索引
versions:
  "12.2.1":
    status: published
    build_date: "2026-05-21"
    published_as: graphviz