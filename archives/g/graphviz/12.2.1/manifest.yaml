version: "12.2.1"
status: published
build_date: "2026-05-21"

source:
  url: "https://gitlab.com/graphviz/graphviz/-/archive/12.2.1/graphviz-12.2.1.tar.gz"
  sha256: "unknown"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_CXX_FLAGS=-stdlib=libc++"
    - "-DCMAKE_EXE_LINKER_FLAGS=-lc++ -lc++abi -static-libgcc -static-libstdc++"
    - "-DCMAKE_SHARED_LINKER_FLAGS=-lc++ -lc++abi"
  dependencies:
    - cmake
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "graphviz CMake 构建使用相对库路径（../../lib/gvc/libgvc.so），不适合 DESTDIR 模式"
  - "解决方案：BUILD_SHARED_LIBS=OFF 静态链接"
  - "Autotools 构建不适用：configure.ac 使用函数定义版本，autogen.sh 依赖 Git"
  - "需要添加 -lc++ -lc++abi 链接选项"