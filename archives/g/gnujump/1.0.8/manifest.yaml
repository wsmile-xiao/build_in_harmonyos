# 版本级 manifest
# 文件位置: archives/g/gnujump/1.0.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.0.8"
software: "gnujump"
status: built
build_date: "2026-09-22"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.gnu.org/gnu/gnujump/gnujump-1.0.8.tar.gz"
  sha256: "13c3fe5f430eb0c010560c7e438123a573ca61a55c6708aa750cfbf56bf25e17"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=<conan package_folder>/usr"
    - "--disable-nls"
    - "--disable-sdltest"
    - "SHELL=/bin/sh"
    - "CONFIG_SHELL=/bin/sh"
  dependencies:
    - "sdl12-compat/1.2.68"
    - "sdl-image/1.2.12"
    - "sdl-mixer/1.2.12"
    - "gl4es/1.1.6"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-configure-no-umask-hmdfs.patch"
  - "0002-main-c-setlocale-nls-guard.patch"
  - "0003-setup-c-glgetstring-null-guard.patch"
  - "config.guess / config.sub: 上游随包件实测 timestamp 2012-02-10（不识别 OHOS），构建期整文件替换为现代版（实测在本机直接输出 aarch64-unknown-linux-ohos 且 config.sub 接受该三元组，E007 构建期替换）；因此不再传 --build 伪装交叉编译，--host 原样保留使 host_os 仍为 linux-ohos"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "SDL 1.2 API 由 sdl12-compat（SDL2 后端）满足；上游 AM_PATH_SDL 只认 sdl-config，须在 generate() 生成包装脚本（lgeneral 同模式）"
  - "桌面 OpenGL 由 gl4es（GL→GLES 转译层）满足，AX_CHECK_GL 探测经 CPPFLAGS/LDFLAGS/LIBRARY_PATH 注入命中包内 gl4es；GLU 零调用包检测失败置空即可"
  - "无头环境运行 GL 链接程序：gl4es libGL 构造期 fb0 EACCES 即段错误，须对照程序归因 + R34 留证跳过 + SDL dummy 驱动取启动期断言（DRAFT-gnujump-1.0.8-gl4es-libgl-fb0-constructor-segfault-headless，Issue #3250）"
  - "OHOS sysroot <libintl.h> 是空壳 stub：--disable-nls + setlocale 加 ENABLE_NLS 守卫（补丁 0002）"
  - "GNU make jobserver 在 HMDFS 上创建 command FIFO 失败，autotools 包须 -j1；E386：CONFIG_SHELL/SHELL 钉 /bin/sh"
