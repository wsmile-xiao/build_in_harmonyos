# test_package/MANIFEST.yml — 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gnujump/1.0.8
homepage: "https://www.gnu.org/software/gnujump/"

# 上游测试命令（全树无 TESTS / check_PROGRAMS 声明，automake 生成空 check 目标）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游实际运行的测试程序：N_static=0（证据：grep TESTS/check_PROGRAMS 于全部
# Makefile.am 无命中——src/ skins/ sound/ doc/ po/ 均为纯构建目录，见 notes.md）
# 2026-09-23 独立复核：解包 gnujump-1.0.8.tar.gz（sha256 13c3fe5f…bf25e17 与 conandata
# 一致）后 find -name Makefile.am 得 20 个文件，grep "TESTS|check_PROGRAMS" 命中 0 行。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_gnujump.py
    description: "ELF 结构断言：gnujump 为 ELF64 AArch64 PIE，musl 解释器"
    command: "check_elf(usr/bin/gnujump)"
  - file: test_gnujump.py
    description: "DT_NEEDED 白名单：仅 SDL 兼容链/GL 转译层/图像编解码/musl libc，拒绝 libX11/libasound 等桌面栈污染"
    command: "check_elf NEEDED whitelist"
  - file: test_gnujump.py
    description: "条件执行的启动/运行断言（timeout 20 收口）：以 SDL dummy 驱动真实启动 usr/bin/gnujump，仅当命中 gl4es libGL 构造期崩溃三签（rc=SIGSEGV + 'LIBGL: Initialising gl4es' + /dev/graphics/fb0 EACCES）时按 R34 逐字留证跳过；其它任何异常读数一律 raise。本设备实测命中该三签 ⇒ 启动期与运行时 GL 断言均未执行，已计入未执行分类，不得申报为通过（详见 notes.md「消费者测试」与 reports/control-program-attribution.log）"
    command: "SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy usr/bin/gnujump --help"
    executed_on_device: false
    disposition: "R34 documented-skip"
