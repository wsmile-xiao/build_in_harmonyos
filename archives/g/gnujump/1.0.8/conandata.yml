# conandata.yml — gnujump 1.0.8
# Source: official GNU ftp (https://ftp.gnu.org/gnu/gnujump/, top-level layout,
# no per-version subdirectory).
# Verified: full download + sha256 (2026-09-20, GLM-62, device-side).
#
# patches/ 内不含 .patch：config.guess/config.sub 以整文件替换（OHOS triplet
# 识别），由 conanfile build() 复制，无需 conandata 声明。
sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/gnu/gnujump/gnujump-1.0.8.tar.gz"
    - "https://mirrors.ustc.edu.cn/gnu/gnujump/gnujump-1.0.8.tar.gz"
    - "https://mirrors.aliyun.com/gnu/gnujump/gnujump-1.0.8.tar.gz"
    - "https://ftp.gnu.org/gnu/gnujump/gnujump-1.0.8.tar.gz"
  sha256: "13c3fe5f430eb0c010560c7e438123a573ca61a55c6708aa750cfbf56bf25e17"

patches:
  - patch_file: "patches/0001-configure-no-umask-hmdfs.patch"
    patch_description: "configure: 去掉临时目录创建的 umask 077 包裹（HMDFS 权限组合下 mktemp/mkdir 必挂，E011/E114 受控方案；保留真实临时目录创建，lgeneral 0005 同款）"
    patch_type: "portability"
  - patch_file: "patches/0002-main-c-setlocale-nls-guard.patch"
    patch_description: "src/main.c: setlocale(LC_ALL) 调用用 #if ENABLE_NLS 守卫——--disable-nls 下 locale.h 不被包含（musl 头不泄漏），无守卫则 LC_ALL 未声明编译失败（上游在 glibc 下因头泄漏而未暴露）"
    patch_type: "portability"
  - patch_file: "patches/0003-setup-c-glgetstring-null-guard.patch"
    patch_description: "src/setup.c: glGetString(GL_RENDERER) 返回值加 NULL 守卫——无 GL 上下文（无头/软件渲染环境）时 GL 规范允许返回 NULL，上游直接 strcmp 必段错误；守卫后走已有 error=TRUE 干净退出路径，对真实 GL 环境零行为变化"
    patch_type: "portability"
