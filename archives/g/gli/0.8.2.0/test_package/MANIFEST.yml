# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gli/0.8.2.0
homepage: "https://github.com/g-truc/gli"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/core/core.cpp
    source: gli-0.8.2.0/test/core/core.cpp
    description: "Core texture API tests (ctest test-core)"
    command: "./test/core/test-core"
  - file: test/core/core_load_dds.cpp
    source: gli-0.8.2.0/test/core/core_load_dds.cpp
    description: "DDS load tests (ctest test-core_load_dds)"
    command: "./test/core/test-core_load_dds"
  - file: test/core/core_load_ktx.cpp
    source: gli-0.8.2.0/test/core/core_load_ktx.cpp
    description: "KTX load tests (ctest test-core_load_ktx)"
    command: "./test/core/test-core_load_ktx"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
