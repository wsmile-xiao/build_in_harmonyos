# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gb/0.8.7
homepage: "https://github.com/gingerBill/gb"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# gb 为 single-file public-domain 头文件库，上游无构建系统/无测试套件
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游仓库仅包含 gb.h/gb_gl.h/gb_ini.h/gb_math.h/gb_string.h 头文件，
# 无独立测试源文件、无测试框架、无 ctest/gtest 注册项
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：仅通过公开头文件 gb.h 调用 gb_strlen/gb_strlcpy/gb_abs/gb_clamp，验证第三方消费者可编译、链接、调用并正常运行"
    command: "./test_gb"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4