# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: goaccess/1.10.2
homepage: "https://goaccess.io/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# goaccess is a CLI tool, no traditional unit test suite
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者测试 - 运行 goaccess --version 验证二进制可用"
    command: "goaccess --version"

# 测试断言总数
assertion_count: 1
