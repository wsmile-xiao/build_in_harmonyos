software:
  name: goaccess
  description: Open Source real-time web log analyzer and interactive viewer
  category: network-analysis
  license: MIT
  upstream_url: https://goaccess.io/
  maintainer: balance1234

version:
  number: 1.10.2
  release_date: "2026-04-01"
  status: published

build:
  system: autotools
  configure_options:
    - "--prefix=$HOME/usr/local"
    - "--enable-utf8"
  compiler: clang
  dependencies:
    - ncursesw/6.4

quality:
  g0_clean_build: pending
  g1_binary完整性: pass
  g2功能可用性: pass_with_warning
  g3可移植性: pass
  g4档案完整性: partial

archive:
  patches:
    - 0001-config.guess.patch
    - 0002-config.sub.patch
    - 0003-configure-umask-fix.patch
  packaging:
    - goaccess-1.10.2-ohos-aarch64.tar.gz
  reports:
    - quality-report.md

knowledge:
  count: 3
  extracted:
    - E081: HarmonyOS umask权限陷阱
    - Platform detection: config.guess/config.sub补丁
    - TMPDIR: configure临时目录路径修复

notes:
  created_at: "2026-05-28"
  updated_at: "2026-05-28"