software: gsoap
display: "gSOAP"
description: "SOAP/XML web services toolkit for C and C++"
category: network
homepage: "https://www.genivia.com"
license: GPLv2
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "需要使用 poll() 替代 select()，避免 FD_SET 引用的 __fd_chk 函数缺失"
    - "添加 || defined(__OHOS__) 条件强制使用 HAVE_POLL 路径"
    - "autoreconf -fvi 可以解决 HMDFS 文件系统上的 configure 权限问题"
  common_dependencies:
    - openssl

# 版本索引（所有已归档版本，含状态）
versions:
  "2.8.142":
    status: built
    build_date: "2026-06-09"