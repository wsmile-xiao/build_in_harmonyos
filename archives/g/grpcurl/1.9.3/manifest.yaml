software: grpcurl
version: "1.9.3"
status: published
build_date: "2026-06-01"

source:
  url: "https://github.com/fullstorydev/grpcurl/archive/refs/tags/v1.9.3.tar.gz"
  sha256: "bb555087f279af156159c86d4d3d5dd3f2991129e4cd6b09114e6851a679340d"
  tar_format: tar.gz

build:
  system: go
  build_system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "-ldflags=-s -w -X main.version=1.9.3"
  dependencies:
    - "go/1.22.10"
  cc: ""
  cxx: ""

patches_applied: []

knowledge_gained:
    - "HMDFS 信任路径限制：只有 /data/service/hnp/bin/ 和 ~/usr/local/bin/ 被信任"
    - "Go 静态二进制（EXEC 类型）可用 binary-sign-tool -selfSign 1 签名成功且可执行（与之前认知不同，EXEC 类型也能签名）"
    - "Go PIE/DYN 二进制签名后 TLS program header 被 binary-sign-tool 损毁导致 SIGSEGV"
    - "HMDFS 会主动删除尝试执行的无签名 ELF 文件"
    - "Go 1.22 无 DIT ARM64 汇编指令问题，Go 1.23+ 存在 DIT 问题"
    - "HMDFS 符号链接不能用于执行非信任路径的二进制"
    - "Go 二进制非标准 ELF 布局（section headers 在文件开头 offset 400-680），签名后 section headers 被移到文件末尾"
    - "使用 Go 1.22.10 编译 grpcurl 可避免 DIT 问题"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
