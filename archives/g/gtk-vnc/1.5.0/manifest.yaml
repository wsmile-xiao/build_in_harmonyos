# 版本级 manifest — gtk-vnc 1.5.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.5.0"
software: "gtk-vnc"
status: built
build_date: "2026-09-02"
build_system: "meson"

source:
  # 官方源：GNOME download.gnome.org（含 keycodemapdb subproject）
  url: "https://download.gnome.org/sources/gtk-vnc/1.5/gtk-vnc-1.5.0.tar.xz"
  sha256: "c0beb4747528ad931da43acc567c6a0190f7fc624465571ed9ccece02c34dd23"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
  - "-Dintrospection=disabled"
  - "-Dwith-vala=disabled"
  - "-Dgi-docs=disabled"
  - "-Dpulseaudio=disabled"
  - "-Dsasl=disabled"
  dependencies:
  - glib/2.84.0.1
  - gtk/3.24.43
  - gdk-pixbuf/2.44.6.1
  - gnutls/3.8.10
  - gmp/6.3.0
  - cairo/1.18.4
  - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
- "conan build env 注入的依赖 libdir 含缺符号的 OHOS libintl.so.8，python3.12 加载崩溃：构建环境不注入依赖 LD_LIBRARY_PATH"
- "glib-2.0.pc 需补 -lintl，否则 ld.lld 报 undefined symbol g_libintl_bindtextdomain/g_libintl_textdomain"
- "meson wrapper 用 python -m mesonbuild.mesonmain 而非 python3 -c，避免 sys.argv[0]='-c' 生成畸形命令 <builddir>/-c"
- "test_package 运行时需显式收集全部 host 依赖 libdir + SDK libc++_shared.so，conanrun env 可能缺个别传递依赖"
- "GTK UI 库 test_package 不实例化 widget（OHOS 无显示环境崩溃），仅验证类型注册（E463）"
