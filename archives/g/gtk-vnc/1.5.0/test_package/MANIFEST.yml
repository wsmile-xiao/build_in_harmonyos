# test_package/MANIFEST.yml
# 上游官方测试声明文件
package: gtk-vnc/1.5.0
homepage: "https://gitlab.gnome.org/GNOME/gtk-vnc"

# 上游测试命令（meson）
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序（来自 src/meson.build）
upstream_tests:
  - file: src/dhtest.c
    source: gtk-vnc-1.5.0/src/dhtest.c
    description: "Diffie-Hellman key exchange math unit tests"
    command: "./dhtest"
  - file: src/vncconnectiontest.c
    source: gtk-vnc-1.5.0/src/vncconnectiontest.c
    description: "VNC RFB connection protocol tests"
    command: "./vncconnectiontest"
  - file: src/coroutine_test.c
    source: gtk-vnc-1.5.0/src/coroutine_test.c
    description: "Coroutine backend tests (ucontext/gthread)"
    command: "./coroutinetest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 vnc_connection_new / vnc_connection_get_type / vnc_connection_set_shared / vnc_display_get_type 验证库可链接、头文件可用"
    command: "./test_gtk-vnc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
