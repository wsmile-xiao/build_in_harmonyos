software: googletest
# 版本级 manifest
# 文件位置: archives/g/googletest/1.12.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.12.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-31"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方正式源，R39）
  url: "https://github.com/google/googletest/archive/refs/tags/release-1.12.1.tar.gz"

  # 源码校验和（实际下载 tarball 计算所得）
  sha256: "81964fe578e9bd7c94dfdb09c8e4d6e6759e19967e397dbea48d1c10e45d0df2"

  # 官方发布标签与 commit（GitHub API 核验）
  official_tag: "release-1.12.1"
  release_commit: "58d77fa8070e8cec2dc1ed015d66b454c8d78850"
  release_published_at: "2022-06-30T13:46:47Z"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_GMOCK=ON"
    - "-DINSTALL_GTEST=ON"
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "googletest 零外部依赖，CMake 构建，产出静态库 gtest/gtest_main/gmock/gmock_main (knowledge_ref: notes.md)"