sources:
  "1.12.1":
    url: "https://github.com/google/googletest/archive/refs/tags/release-1.12.1.tar.gz"
    sha256: "81964fe578e9bd7c94dfdb09c8e4d6e6759e19967e397dbea48d1c10e45d0df2"
patches:
  "1.12.1":
    - patch_file: "patches/0001-gtest-port-respect-tmpdir-ohos.patch"
      patch_description: "gtest-port.cc Linux 分支硬编码 /tmp/；改为在 OHOS 沙箱 /tmp 只读时尊重 TMPDIR 环境变量（可写受控临时目录），未设置时安全回退 /tmp/ 保持上游行为"
      patch_type: "portability"
    - patch_file: "patches/0002-python312-assert_-compat.patch"
      patch_description: "Python 3.12 移除 deprecated unittest.TestCase.assert_；新增 gtest_compat_py3.py 恢复 assert_（=assertTrue 语义等价别名）并由 11 个仍使用 assert_ 的上游测试脚本导入，上游逻辑/断言/输出不变"
      patch_type: "compat"
    - patch_file: "patches/0003-gtest-help-ohos-platform-detect.patch"
      patch_description: "gtest_help_test 平台判定：OHOS uname[0]=HarmonyOS 使 IS_LINUX 误判为 False 而错走 assertNotIn 分支；将 HarmonyOS 归入 Linux 族（断言逻辑不变），使 --gtest_stream_result_to 按 Linux 语义 assertIn"
      patch_type: "portability"
