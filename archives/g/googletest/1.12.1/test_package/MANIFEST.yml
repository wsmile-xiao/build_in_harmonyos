# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: googletest/1.12.1
homepage: https://github.com/google/googletest

# googletest 自带完整测试套件（gtest_build_tests + gmock_build_tests=ON）
upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游测试：googletest + googlemock 编译出的测试二进制（gtest_unittest 等）
# 首轮 Adapt 本地验证按任务边界执行（详见 notes.md）
upstream_tests:
  - file: build/googletest/*_test*
    description: "googletest 上游测试二进制"
    command: "./gtest_unittest"
  - file: build/googlemock/*_test*
    description: "googlemock 上游测试二进制"
    command: "./gmock_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_googletest.cpp
    description: "gtest+gmock 消费者测试：TEST(Add) 1+1=2 + TEST(StringEq) 字符串相等 + EXPECT_THAT(42, Gt(10))"
    command: "./test_googletest"
assertion_count: 4