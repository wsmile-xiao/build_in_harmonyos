package: googletest/1.18.0
homepage: https://github.com/google/googletest

upstream_check_command: "ctest --test-dir build/Release --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build/Release --output-on-failure"

upstream_tests:
  - file: googletest/test/*.cc
    description: "Complete GoogleTest C++ upstream suite registered by gtest_build_tests=ON"
    command: "ctest --test-dir build/Release --output-on-failure"
  - file: googlemock/test/*.cc
    description: "Complete GoogleMock C++ upstream suite registered by gmock_build_tests=ON"
    command: "ctest --test-dir build/Release --output-on-failure"
  - file: googletest/test/*.py
    description: "Official Python-driven behavior tests registered by the upstream CMake project"
    command: "ctest --test-dir build/Release --output-on-failure"
  - file: googlemock/test/*.py
    description: "Official GoogleMock Python-driven behavior tests registered by the upstream CMake project"
    command: "ctest --test-dir build/Release --output-on-failure"

test_package_tests:
  - file: test_googletest.cpp
    description: "Consumer link and runtime checks for GoogleTest assertions and GoogleMock string/container matchers"
    command: "./test_googletest"

assertion_count: 3
