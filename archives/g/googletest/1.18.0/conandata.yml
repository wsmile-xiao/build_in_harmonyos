patches:
  "1.18.0":
    - patch_file: "patches/0001-gtest-help-recognize-harmonyos.patch"
      patch_description: "Treat HarmonyOS uname as Linux-compatible in the upstream help-output test so its POSIX socket flag expectation follows the target platform behavior."
      patch_type: "test-portability"
    - patch_file: "patches/0002-tmpdir-ohos-sandbox.patch"
      patch_description: "Honor TMPDIR for CapturedStream temporary files when the OHOS sandbox does not permit writes to /tmp."
      patch_type: "portability"
