knowledge_gained:
  - "GoogleTest 1.18.0 installs GTest::gtest, GTest::gtest_main, GTest::gmock, and GTest::gmock_main components."
  - "HarmonyOS reports uname HarmonyOS; the upstream POSIX help test needs the Linux behavior branch."
  - "CapturedStream uses /tmp on POSIX; TMPDIR is required for read-only OHOS temporary directories."
  - "CTest inventories are platform-specific: MinGW excludes the pthread stress target while OHOS includes and executes it."

