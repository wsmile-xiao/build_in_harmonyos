# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: googletest/1.17.0
homepage: https://github.com/google/googletest

# googletest 自带完整测试套件（gtest_build_tests + gmock_build_tests=ON）
upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游测试：googletest + googlemock CMake 注册的 65 个测试目标
# （45 googletest 侧：24 cxx_test + 3 cxx_test_with_flags + 18 py_test；
#   20 googlemock 侧：15 cxx_test + 1 gmock_stress_test + 2 cxx_test_with_flags
#   + 2 py_test），对应 65 个测试二进制/驱动器
upstream_tests:
  - file: build/Release/googletest/*_test*
    description: "googletest 上游测试二进制，真机实跑"
    command: "./gtest_unittest"
  - file: build/Release/googlemock/*_test*
    description: "googlemock 上游测试二进制，真机实跑"
    command: "./gmock_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "GTest/GMock 消费者测试：find_package(GTest) + 链接 GTest::gtest_main 与 GTest::gmock，执行断言与 HasSubstr 匹配器及 MOCK_METHOD 模拟对象"
    command: "./test_googletest"
assertion_count: 3
