# 版本级 manifest — googletest 1.17.0
# 文件位置: archives/g/googletest/1.17.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "1.17.0"

software: "googletest"
display: "googletest"
description: "GoogleTest + GoogleMock C++ 测试/模拟框架（上游原生包名形态，GTestConfig 桥接）"
category: test

# 编译状态
# published | built | failed | archived
status: built
build_date: "2026-09-12"
build_system: cmake

# 源码信息
source:
  # 源码下载 URL（官方正式源，R39）
  url: "https://github.com/google/googletest/archive/refs/tags/v1.17.0.tar.gz"
  # 源码校验和（实际下载 tarball 计算所得，与 gtest/1.17.0 同源码同 sha256）
  sha256: "65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c"
  official_tag: "v1.17.0"
  tar_format: tar.gz

# 构建配置
build:
  system: cmake
  configure_options:
    - "-DBUILD_GMOCK=ON"
    - "-DINSTALL_GTEST=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-Dgtest_build_tests=ON"
    - "-Dgmock_build_tests=ON"
  dependencies: []
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied:
  - "patches/0001-tmpdir-ohos-sandbox.patch"
  - "patches/0002-gtest-help-ohos-platform-detect.patch"

# 知识沉淀
knowledge_gained:
  - "googletest 1.17.0 与 gtest/1.17.0 同源码同 sha256，配方改包名+对齐上游 find_package 形态即可高度复用（knowledge_ref: notes.md）"
  - "BUILD_GMOCK=ON 形态下 gmock 侧 2 个 py_test（gmock_leak/gmock_output）因 find_package(Python3) 在 gtest 子目录作用域执行不上传父作用域，上游默认形态不注册，实测注册口径 63（knowledge_ref: notes.md）"
