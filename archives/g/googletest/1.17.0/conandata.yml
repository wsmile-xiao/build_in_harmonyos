patches:
  "1.17.0":
    - patch_file: "patches/0001-tmpdir-ohos-sandbox.patch"
      patch_description: "gtest-port.cc mkstemp 临时目录改为读 TMPDIR（OHOS 沙箱 /tmp 只读）"
      patch_type: "portability"
    - patch_file: "patches/0002-gtest-help-ohos-platform-detect.patch"
      patch_description: "gtest_help_test 平台判定：OHOS uname[0]=HarmonyOS 使 IS_LINUX 误判为 False 而错走 assertNotIn 分支；将 HarmonyOS 归入 Linux 族（断言逻辑不变），使 --gtest_stream_result_to 按 Linux 语义 assertIn"
      patch_type: "portability"
