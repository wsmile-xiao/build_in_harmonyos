# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: googletest/release-1.12.1
homepage: "https://github.com/google/googletest"

# 上游自测由 CMake 选项 gtest_build_tests=ON + gmock_build_tests=ON 生成（约 50 个自测二进制，
# 源文件 googletest/test 52 + googlemock/test 22 = 74 个）。无单一 make check 入口。
upstream_check_command: "cmake -Dgtest_build_tests=ON -Dgmock_build_tests=ON 后逐目标 cmake --build <target>"

# conanfile.py build() 中已集成上游自测：gtest_build_tests/gmock_build_tests=ON，
# 对可实跑的「纯逻辑」自测二进制（29 个）逐一 构建 → OHOS binary-sign-tool 自签 → 真机实跑。
# 严格门禁：任一 curated 二进制未构建/未 rc=0 即 raise ConanException，CI 显红取证。
upstream_test_in_build: true
upstream_test_command: >
  上游框架自测「纯逻辑」子集 29 个自测二进制逐一实跑：
  ./<binary> --gtest_color=no --gtest_filter=-*DeathTest*:CaptureTest.*:ParseFlagsTest.*:FlagfileTest.*:
  TestResultPropertyTest.*:AssertTest.FailsFatallyOnFalse:OnCallSyntaxTest.WillByDefaultIsMandatory:
  UnexpectedCallTest.UnsatisifiedPrerequisites:NiceMockTest.ThrowsExceptionForUnknownReturnTypes
  （完整过滤串见 conanfile.py GTEST_SELFTEST_FILTER；过滤项均为 OHOS musl 无 fork / 应用沙箱无可写 /tmp 所致 1-e 类豁免）

# 实际运行的 29 个上游自测二进制（CI 真机 build #37414 strict gate 29/29 rc=0；实跑 [ PASSED ] 1706 用例，
# SKIPPED 3 用例（gtest_skip_test 按 GTEST_SKIP 设计预期跳过），0 用例验证 1 个（gtest_no_test_unittest）。
# 未纳入的其余上游二进制（death-test/fork、py 驱动、非默认编译变体、负向/压力）见 PR_BODY「上游测试用例统计」逐条 1-e 原因。
upstream_tests:
  # googletest/test
  - file: gtest_unittest
    description: "googletest 核心单元测试（断言/打印/参数化等纯逻辑），实跑 PASSED 373"
    command: "./gtest_unittest --gtest_color=no --gtest_filter=-*DeathTest*:ParseFlagsTest.*:FlagfileTest.*:TestResultPropertyTest.*"
  - file: gtest_environment_test
    description: "全局 SetUp/TearDown 环境测试，实跑 PASSED 1"
    command: "./gtest_environment_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: googletest-filepath-test
    description: "FilePath 工具类纯逻辑测试，实跑 PASSED 57"
    command: "./googletest-filepath-test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: googletest-listener-test
    description: "TestEventListener 机制测试，实跑 PASSED 2"
    command: "./googletest-listener-test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gtest_main_unittest
    description: "gtest_main 入口测试，实跑 PASSED 1"
    command: "./gtest_main_unittest --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: googletest-message-test
    description: "Message/流式断言输出测试，实跑 PASSED 17"
    command: "./googletest-message-test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gtest_no_test_unittest
    description: "「无测试程序可运行」路径验证（0 用例，rc=0 即通过）"
    command: "./gtest_no_test_unittest --gtest_color=no"
  - file: googletest-options-test
    description: "gtest flag 选项解析纯逻辑测试，实跑 PASSED 12"
    command: "./googletest-options-test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gtest_pred_impl_unittest
    description: "EXPECT_PRED/断言谓词宏纯逻辑测试，实跑 PASSED 160"
    command: "./gtest_pred_impl_unittest --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: googletest-printers-test
    description: "UniversalPrint/打印器纯逻辑测试，实跑 PASSED 145"
    command: "./googletest-printers-test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gtest_prod_test
    description: "FRIEND_TEST 生产代码友元测试，实跑 PASSED 2"
    command: "./gtest_prod_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gtest_sole_header_test
    description: "单头文件 gtest.h 自包含验证，实跑 PASSED 2"
    command: "./gtest_sole_header_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: googletest-test-part-test
    description: "TestPartResult 记录/传播测试，实跑 PASSED 14"
    command: "./googletest-test-part-test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gtest-unittest-api_test
    description: "单元测试注册 API 纯逻辑测试，实跑 PASSED 4"
    command: "./gtest-unittest-api_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gtest_skip_in_environment_setup_test
    description: "环境 SetUp 中 GTEST_SKIP 行为测试，实跑 PASSED 1"
    command: "./gtest_skip_in_environment_setup_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gtest_skip_test
    description: "GTEST_SKIP 跳转特性自测（3 用例按设计全部 SKIPPED，rc=0 即通过）"
    command: "./gtest_skip_test --gtest_color=no"
  - file: googletest-param-test-test
    description: "参数化测试 INSTANTIATE_TEST_SUITE_P 纯逻辑测试，实跑 PASSED 86"
    command: "./googletest-param-test-test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: googletest-port-test
    description: "gtest 平台抽象层纯逻辑测试（排除依赖可写 /tmp 的流捕获用例），实跑 PASSED 42"
    command: "./googletest-port-test --gtest_color=no --gtest_filter=-*DeathTest*:CaptureTest.*"
  - file: gtest-typed-test_test
    description: "类型参数化测试 TYPED_TEST 纯逻辑测试，实跑 PASSED 47"
    command: "./gtest-typed-test_test --gtest_color=no --gtest_filter=-*DeathTest*"
  # googlemock/test
  - file: gmock_test
    description: "GoogleMock 核心行为测试，实跑 PASSED 13"
    command: "./gmock_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gmock-cardinalities_test
    description: "调用次数约束 (Cardinality) 测试，实跑 PASSED 27"
    command: "./gmock-cardinalities_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gmock_ex_test
    description: "gmock 使用示例/宏展开冒烟，实跑 PASSED 1"
    command: "./gmock_ex_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gmock-function-mocker_test
    description: "MOCK_METHOD 函数模拟器纯逻辑测试，实跑 PASSED 76"
    command: "./gmock-function-mocker_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gmock-matchers-arithmetic_test
    description: "算术匹配器纯逻辑测试，实跑 PASSED 100"
    command: "./gmock-matchers-arithmetic_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gmock-matchers-comparisons_test
    description: "比较匹配器纯逻辑测试，实跑 PASSED 172"
    command: "./gmock-matchers-comparisons_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gmock-matchers-misc_test
    description: "杂项匹配器纯逻辑测试，实跑 PASSED 144"
    command: "./gmock-matchers-misc_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gmock-more-actions_test
    description: "附加 Action 纯逻辑测试，实跑 PASSED 110"
    command: "./gmock-more-actions_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gmock-port_test
    description: "gmock 平台适配层测试，实跑 PASSED 1"
    command: "./gmock-port_test --gtest_color=no --gtest_filter=-*DeathTest*"
  - file: gmock_link_test
    description: "gmock 模板链接/实例化完整性测试，实跑 PASSED 96"
    command: "./gmock_link_test --gtest_color=no --gtest_filter=-*DeathTest*"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "consumer 实跑 gtest+gmock：3 个 TEST/EXPECT 断言 + 1 个 gmock EXPECT_CALL mock 调用"
    command: "./test_probe"

# 测试断言总数 (近似值, 用于质量评估)：上游框架用例按 gtest 用例计（见 PR_BODY 通过率），
# 此处为 test_package 消费者断言数（4）。
assertion_count: 4
