software: google-sparsehash
display: "Google sparsehash"
description: "Memory-efficient C++ hash maps and sets under the Google-era package name (header-only)"
category: data
homepage: "https://github.com/sparsehash/sparsehash"
license: BSD-3-Clause
build_system: custom-cmake-test-harness

ohos_adaptation:
  key_points:
    - "Path A basic adaptation; header-only package with no third-party Conan dependencies."
    - "The recipe writes the sparseconfig.h and config.h headers upstream Autotools would generate, describing the OHOS target rather than the build host."
    - "One patch with two fixes: standard uint16_t instead of BSD u_int16_t in sparsehashtable.h, and hashtable_test honoring TMPDIR over the read-only /tmp."
    - "No __OHOS__ platform macro is introduced."
    - "All seven upstream test programs were built and executed natively on the HarmonyOS PC (aarch64) device inside conan create: 7/7 PASS."
    - "test_package exercises real sparse_hash_map, dense_hash_map, sparse_hash_set, and dense_hash_set consumption through the google-sparsehash::google-sparsehash CMake target."
    - "The HarmonyOS special test passed against the packaged include trees compiled with the real OHOS clang."
  common_dependencies: []

versions:
  "2.0.4":
    status: built
    build_date: "2026-10-09"
    conan_ref: "google-sparsehash/2.0.4"
