# test_ohos/MANIFEST.yml
# google-sparsehash 2.0.4 HarmonyOS PC 专项测试声明

package: google-sparsehash/2.0.4
platform: OHOS aarch64

# 测试类型: 鸿蒙专项测试（真机 aarch64 独立验证，自包含目录）
test_type: ohos_special

# 测试文件
test_files:
  - ohos_special_test.cpp
  - run_ohos_test.py

# 覆盖的公开 API（真实调用并可观察结果）
covered_apis:
  - google::sparse_hash_map (insert/find/erase/iteration/set_deleted_key)
  - google::dense_hash_map (set_empty_key/set_deleted_key/insert/erase/iteration)
  - sparsehash/ 与 legacy google/ 双 include 树

# 运行方式
run_command: "python3 run_ohos_test.py <conan_package_folder>"

# 与上游测试 / 消费者测试的区别
distinct_from: >
  上游 7 测试为源码树内单测；test_package 为 Conan 消费者冒烟；本专项
  在 OHOS 真机验证双 include 树、std::string key、跨 group 增长与 dense
  resize 行为，并校验 aarch64 ELF64 产物。包为 header-only，无 ELF
  library 产物，故不虚构 library 检查，改为验证真实编译运行与产物架构。

assertion_count: 18
