# 版本级 manifest — graaf 1.1.0
# header-only C++20 图库，官方源 github.com/bobluppes/graaf (tag v1.1.0)

version: "1.1.0"
software: "graaf"

status: built
build_date: "2026-09-05"
build_system: "cmake"

source:
  url: "https://github.com/bobluppes/graaf/archive/refs/tags/v1.1.0.tar.gz"
  sha256: "e6bdd6eeb2250d7d01e0b0ea0300114084a7becc58445c3b7cfcaa8af735ba26"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DSKIP_EXAMPLES=ON"
    - "-DSKIP_BENCHMARKS=ON"
    - "-DCMAKE_CXX_STANDARD=20"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-include-graaflib-algorithm-clique_detection-bron_kerbosch.tpp.patch"
  - "0002-include-graaflib-algorithm-coloring-welsh_powell.tpp.patch"
  - "0003-include-graaflib-algorithm-minimum_spanning_tree-prim.tpp.patch"
  - "0004-include-graaflib-properties-vertex_properties.tpp.patch"

knowledge_gained:
  - "OHOS libc++ (libcxx-ohos, llvm15) 无 C++20 std::ranges 算法 (max_element/min_element/count_if)，需等价替换为 std:: 算法 + begin/end 迭代器"
  - "Welsh-Powell 贪心着色依赖 unordered_set 迭代顺序可产生相邻顶点同色，需改为收集已用色集合取最小未用色（确定性）"
  - "header-only .tpp 中非模板自由函数需标 inline，多翻译单元包含时否则 ld.lld duplicate symbol"