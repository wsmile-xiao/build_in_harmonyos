# test_package/MANIFEST.yml
# 上游官方测试声明文件 (graaf 1.1.0)
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 来源: 官方 tag v1.1.0 源码 test/ 目录 (GoogleTest 框架)
# 枚举方式: 全部 25 个上游测试源文件中的 TEST/TEST_F/TYPED_TEST 宏展开
#   -> 本地构建 Graaf_test 可执行文件，GTest 注册 206 个测试套件 / 750 个用例
#   -> 实际运行 750/750 全部通过 (含 4 个鸿蒙专项 OHOSAdaptation 用例)

package: graaf/1.1.0
homepage: "https://github.com/bobluppes/graaf"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# graaf 为 header-only 库: build() 不编译测试，上游测试在 test/ 下用 GTest 独立构建
upstream_test_in_build: false
upstream_test_command: "./Graaf_test --gtest_color=no"

# 上游实际运行的测试程序
upstream_tests:
  - name: Graaf_test
    source: graaf-1.1.0/test/
    description: "GoogleTest 套件: 206 test suites / 750 cases (graph, algorithms, io, properties)"
    command: "./Graaf_test --gtest_color=no"
    expected: "750/750 passed (上游 746 + OHOS 专项 4)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者冒烟: BFS 可达性(4 顶点)、Prim MST(3 边)、K4 Welsh-Powell 正常着色"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 750
