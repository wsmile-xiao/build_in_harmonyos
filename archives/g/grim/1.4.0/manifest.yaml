software: grim
build_system: meson
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/grim-1.4.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dman-pages=disabled"
    - "-Dwerror=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - wayland/1.23.1
    - wayland-protocols/1.36
    - libpng/1.6.43
    - pixman/0.46.4
    - libjpeg/3.1.4.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "grim使用meson构建系统（非autotools），需要wayland-client和wayland-protocols依赖"
    - "编译wayland依赖后需要sign-elf签名才能执行wayland-scanner"
    - "grim需要设置RPATH（LDFLAGS=-Wl,-rpath,...）以便运行时找到共享库"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
