# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gama/2.29
homepage: "https://www.gnu.org/software/gama/"

# 上游测试命令 (make check 结果)
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试脚本 (tests/ 四目录, 共 22 个)
upstream_tests:
  - file: tests/gama-local/gama-local-version.in
    source: gama-2.29/tests/gama-local/gama-local-version.in
    description: "gama-local/gama-g3 版本输出检查"
    command: "gama-local-version.sh"
  - file: tests/gama-local/gama-local-adjustment.in
    source: gama-2.29/tests/gama-local/gama-local-adjustment.in
    description: "上游测试数据全量平差回归（svd/gso/cholesky/envelope 四算法）"
    command: "gama-local-adjustment.sh"
  - file: tests/gama-local/gama-local-algorithms.in
    source: gama-2.29/tests/gama-local/gama-local-algorithms.in
    description: "平差算法矩阵分解对比测试"
    command: "gama-local-algorithms.sh"
  - file: tests/gama-local/gama-local-xml-xml.in
    source: gama-2.29/tests/gama-local/gama-local-xml-xml.in
    description: "XML 输入输出一致性测试"
    command: "gama-local-xml-xml.sh"
  - file: tests/gama-local/gama-local-html.in
    source: gama-2.29/tests/gama-local/gama-local-html.in
    description: "HTML 结果输出与 XML 一致性测试"
    command: "gama-local-html.sh"
  - file: tests/gama-local/gama-local-equivalents.in
    source: gama-2.29/tests/gama-local/gama-local-equivalents.in
    description: "等价观测方程测试"
    command: "gama-local-equivalents.sh"
  - file: tests/gama-local/gama-local-xml-results.in
    source: gama-2.29/tests/gama-local/gama-local-xml-results.in
    description: "XML 结果集回归测试"
    command: "gama-local-xml-results.sh"
  - file: tests/gama-local/gama-local-parameters.in
    source: gama-2.29/tests/gama-local/gama-local-parameters.in
    description: "平差参数组合测试"
    command: "gama-local-parameters.sh"
  - file: tests/gama-local/gama-local-export.in
    source: gama-2.29/tests/gama-local/gama-local-export.in
    description: "结果导出格式测试"
    command: "gama-local-export.sh"
  - file: tests/gama-local/gama-local-externs.in
    source: gama-2.29/tests/gama-local/gama-local-externs.in
    description: "外部接口测试"
    command: "gama-local-externs.sh"
  - file: tests/gama-local/gama-local-yaml2gkf.in
    source: gama-2.29/tests/gama-local/gama-local-yaml2gkf.in
    description: "YAML→GKF 转换测试（yaml-cpp 启用后生效）"
    command: "gama-local-yaml2gkf.sh"
  - file: tests/gama-local/gama-local-gkf2yaml.in
    source: gama-2.29/tests/gama-local/gama-local-gkf2yaml.in
    description: "GKF→YAML 转换测试（yaml-cpp 启用后生效）"
    command: "gama-local-gkf2yaml.sh"
  - file: tests/gama-local/xmllint-gama-local-xsd.in
    source: gama-2.29/tests/gama-local/xmllint-gama-local-xsd.in
    description: "GKF 输出 XSD 校验"
    command: "xmllint-gama-local-xsd.sh"
  - file: tests/gama-local/xmllint-gama-local-adjustment-xsd.in
    source: gama-2.29/tests/gama-local/xmllint-gama-local-adjustment-xsd.in
    description: "平差结果 XML XSD 校验"
    command: "xmllint-gama-local-adjustment-xsd.sh"
  - file: tests/gama-local/xmllint-gama-local-yaml2gkf.in
    source: gama-2.29/tests/gama-local/xmllint-gama-local-yaml2gkf.in
    description: "YAML 转换结果 XSD 校验（yaml-cpp+xmllint 启用后生效）"
    command: "xmllint-gama-local-yaml2gkf.sh"
  - file: tests/gama-local-deformation/gama-local-deformation-diff.in
    source: gama-2.29/tests/gama-local-deformation/gama-local-deformation-diff.in
    description: "形变分析平差回归测试"
    command: "gama-local-deformation-diff.sh"
  - file: tests/compare-xyz/compare-xyz.in
    source: gama-2.29/tests/compare-xyz/compare-xyz.in
    description: "坐标对比工具回归测试"
    command: "compare-xyz.sh"
  - file: tests/krumm/krumm-xml-xml.in
    source: gama-2.29/tests/krumm/krumm-xml-xml.in
    description: "Krumm 1D/2D/3D 测试网 38 组 XML 结果回归"
    command: "krumm-xml-xml.sh"
  - file: tests/krumm/krumm2gama-local.in
    source: gama-2.29/tests/krumm/krumm2gama-local.in
    description: "Krumm 结果→gama-local 格式转换回归"
    command: "krumm2gama-local.sh"
  - file: tests/gama-g3/src/gama-g3-adjustment.in
    source: gama-2.29/tests/gama-g3/src/gama-g3-adjustment.in
    description: "g3 格式平差计算测试"
    command: "gama-g3-adjustment.sh"
  - file: tests/gama-g3/src/gama-g3-ellipsoid-xyz2blh.in
    source: gama-2.29/tests/gama-g3/src/gama-g3-ellipsoid-xyz2blh.in
    description: "g3 椭球坐标转换测试"
    command: "gama-g3-ellipsoid-xyz2blh.sh"
  - file: tests/gama-g3/src/gama-g3-xmllint-xsd.in
    source: gama-2.29/tests/gama-g3/src/gama-g3-xmllint-xsd.in
    description: "g3 结果 XML XSD 校验（含 vyberova_udrzba 大网络）"
    command: "gama-g3-xmllint-xsd.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_gama.sh
    description: "消费者测试：gama-local --version + 上游 traverse-01-en-left.gkf 真实平差（svd）+ XML/文本输出断言"
    command: "./test_gama.sh"

# 测试断言总数 (近似值)
assertion_count: 22
