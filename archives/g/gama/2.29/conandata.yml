sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/gnu/gama/gama-2.29.tar.gz"
    - "https://mirrors.ustc.edu.cn/gnu/gama/gama-2.29.tar.gz"
    - "https://mirrors.aliyun.com/gnu/gama/gama-2.29.tar.gz"
    - "https://ftp.gnu.org/gnu/gama/gama-2.29.tar.gz"
  sha256: "c00fa3c6fff4e777834dfae02afccff2e14884f544f5ac752a0047d56e80b411"

patches:
  - patch_file: "patches/0001-add-sstream-includes.patch"
    patch_description: "Add missing #include <sstream> in 6 files (upstream relies on transitive includes that clang 15/musl does not provide)"
    patch_type: "portability"
  - patch_file: "patches/0003-tests-tmpdir.patch"
    patch_description: "Test scripts write debug info to /tmp (read-only on OHOS, E002); use ${TMPDIR:-/tmp} instead"
    patch_type: "portability"
  - patch_file: "patches/0004-compare-retry.patch"
    patch_description: "Retry result-comparison invocations (check_html / check_xml_xml) up to 4 times with 3s gaps: OHOS HMDFS has a write-read visibility race where a freshly written results file may fail to open (reproducible under I/O load; same file reads fine seconds later)"
    patch_type: "portability"
