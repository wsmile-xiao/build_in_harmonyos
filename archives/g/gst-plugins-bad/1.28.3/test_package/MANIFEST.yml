# test_package/MANIFEST.yml
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: gst-plugins-bad/1.28.3
homepage: "https://gstreamer.freedesktop.org/"

# Upstream test command
upstream_check_command: "meson test --list"

# Whether upstream tests are integrated in build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
upstream_tests:
  - file: tests/check/gstinsertbin.c
    source: gst-plugins-bad-1.28.3/tests/check/gstinsertbin.c
    description: "Upstream insertbin unit test"
    command: "meson test gstinsertbin"

# Consumer test in test_package
test_package_tests:
  - file: test_gst_plugins_bad.c
    description: "Consumer test - verifies gst_insert_bin_new() API from gst-plugins-bad"
    command: "./test_gst_plugins_bad"

# Total assertions
assertion_count: 3
