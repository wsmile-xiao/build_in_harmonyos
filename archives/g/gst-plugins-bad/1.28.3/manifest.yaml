patches_applied: []

# ============================================================
# Knowledge gained
# ============================================================

knowledge_gained:
  - "gst-plugins-bad 1.28.3 uses meson build system"
  - "gst-plugins-base is NOT published in the conan registry; it is vendored into subprojects/gst-plugins-base/ and built as a meson subproject (same approach as the gst-libav recipe)"
  - "zlib must be overridden to 1.3.1.1 (PIC static build): plain zlib/1.3.1 archives are non-PIC and fail R_AARCH64 relocations when linked into the base subproject's shared libs"
  - "find_program('glib-mkenums') resolves via PATH to HNP's broken perl script (no /usr/bin/perl on OHOS); pin the glib2 package's python3 implementation via MesonToolchain binaries (native file [binaries] section)"
  - "gio-unix-2.0.pc must point Cflags at include/gio-unix-2.0 (unixfd plugin includes <gio/gunixfdmessage.h>)"
  - "meson install rewrites DT_RUNPATH of installed libs; any post-link byte change invalidates the OHOS embedded ELF code signature -> loader EACCES. package() must restore pristine build-tree artifacts (E504 pattern)"
  - "conan glib2/gstreamer packages are static-only; each packaged shared lib embeds its own glib/gstreamer copy, so consumer tests must not call gst_init() (per-DSO type registry mix -> deadlock); verify via dlopen/dlsym instead (gst-libav pattern)"
  - "NLS disabled (no gettext on OHOS); gettext compat stub library linked via c_link_args"
  - "AR/AS/STRIP/NM/RANLIB env vars must be pinned by absolute path (CI worker fix)"
  - "glib2/gstreamer pkg-config sub-package .pc files must be generated (conan only ships one .pc per package)"
  - "Platform-incompatible plugins disabled: gl (OHOS GL header conflicts), opensles (Android-only), webp (static symbol conflicts), orc (not in registry)"
  - "gst-plugins-bad produces 17 library .so files plus plugins; gst-plugins-base libraries/plugins ship inside this package from the vendored subproject build"
