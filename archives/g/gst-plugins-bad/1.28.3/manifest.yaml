software: gst-plugins-bad
version: "1.28.3"
build_system: meson
status: built
build_date: "2026-05-30"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.28.3.tar.xz"
  sha256: ""
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dgl=disabled"
    - "-Dopensles=disabled"
    - "-Dwebp=disabled"
  dependencies:
    - gstreamer/1.28.3
    - gst-plugins-base/1.28.3
    - glib/2.88.0
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gst-plugins-bad 1.28.3 使用 meson 构建系统（非 autotools）"
  - "GL 插件需禁用（OHOS GL 头文件冲突：GL_CONTEXT_PROFILE_MASK 等宏未定义）"
  - "opensles 插件需禁用（Android OpenSLES_Android.h 不存在于 OHOS）"
  - "webp 插件需禁用（静态库符号冲突：SharpYuvInit/SharpYuvConvert）"
  - "gst-plugins-base 是必要依赖（gstreamer-plugins-base-1.0.pc）"
  - "meson builddir 必须放在源码目录外（HMDFS 文件系统限制）"
  - "sys/nvcodec, opensles 等 15 个子目录从 .orig 复制到 .work 才能通过 meson 配置"
  - "源码 tarball 中部分 sys 子目录缺失（nvcodec 等），需从 .orig 复制"
