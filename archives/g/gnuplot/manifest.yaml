software: gnuplot
display: "gnuplot"
description: "交互式命令行绘图工具，支持 2D/3D 数据可视化"
category: graphics
homepage: "https://gnuplot.sourceforge.net/"
license: gnuplot
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 中 umask 077 需改为 umask 022（HMDFS 兼容性，E011）"
    - "使用 --with-readline=builtin 避免外部 readline 依赖"
    - "Phase 1 零依赖编译：跳过 gd/cairo/pango/lua/qt/wxwidgets"
    - "Phase 2 集成 libgd：添加 gd/2.3.3 依赖支持 PNG/JPEG/GIF 图片输出"
    - "gd conanfile.py 需设置 pkg_config_name='gdlib' 并使用 PkgConfigDeps 生成器"
    - "make check 因缺少图形终端而部分失败，不阻塞"
  common_dependencies:
    - "gd/2.3.3"

versions:
  "6.0.3":
    status: published
    build_date: "2026-07-23"
  "6.0.3.1":
    status: built
    build_date: "2026-07-23"
