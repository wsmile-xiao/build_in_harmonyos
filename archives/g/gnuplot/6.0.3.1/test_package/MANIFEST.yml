# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gnuplot/6.0.3.1
homepage: https://gnuplot.sourceforge.net/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (make check runs demo suite)
upstream_tests:
  - name: "demo-suite"
    source: gnuplot-6.0.3/demo/
    description: "gnuplot demo suite — generates plots using various terminals (requires graphics output)"

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "gnuplot --version smoke test + PNG image generation test"
    command: "gnuplot --version && gnuplot -e \"set terminal png; set output 'test.png'; plot sin(x)\""

# 测试断言总数 (近似值)
assertion_count: 3
