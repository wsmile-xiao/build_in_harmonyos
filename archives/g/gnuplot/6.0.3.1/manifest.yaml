knowledge_gained:
  - "E011: configure 中 umask 077 在 HMDFS 上导致临时目录创建失败，需改为 umask 022"
  - "Phase 1 零依赖编译：builtin readline，跳过 gd/cairo/pango/lua/qt/wxwidgets"
  - "Phase 2 集成 libgd：添加 gd/2.3.3 依赖，支持 PNG/JPEG/GIF 图片输出"
  - "gd 的 configure 使用 PKG_CHECK_MODULES 检测依赖，需要 PkgConfigDeps 生成 .pc 文件"
  - "gd conanfile.py 需要 --build 和 --host 设置不同值以进入交叉编译模式（避免 conftest 运行失败）"
  - "gd package_info 需设置 pkg_config_name='gdlib' 以匹配 gnuplot configure 的检测"
  - "make check 因缺少图形终端而部分失败（unknown terminal），不阻塞"

