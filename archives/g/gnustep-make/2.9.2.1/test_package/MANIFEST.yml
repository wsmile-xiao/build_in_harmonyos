package: gnustep-make/2.9.2.1
homepage: "https://github.com/gnustep/tools-make"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游 gnustep/tools-make 的 TestFramework/ 目录含 9 个 example 测试
# （example1-9.m），构成上游测试集 N=9。已在本 test_package 中依赖已发布的
# gnustep-base/1.31.1 真实编译并运行全部 9 个 example（example1-9.m 原样从
# 上游 TestFramework/ 复制，未做任何修改）。
# 实测结果：9/9 全部运行通过（EXIT 0）。其中 example3/4 是上游故意设计的
# 异常测试（向 NSString 发送坏消息测异常捕获），在完整 GNUstep 环境下异常被
# NS_DURING/NS_HANDLER 正常捕获（其内部记录的 "Failed test" 为预期行为），
# 程序正常退出，实测通过。
upstream_tests:
  - "TestFramework/example1.m"
  - "TestFramework/example2.m"
  - "TestFramework/example3.m"
  - "TestFramework/example4.m"
  - "TestFramework/example5.m"
  - "TestFramework/example6.m"
  - "TestFramework/example7.m"
  - "TestFramework/example8.m"
  - "TestFramework/example9.m"

# 适配后测试：
# 1) 上游 9 个 example 全部真实编译运行（N'=N=9，无修改，实测 9/9 通过）；
# 2) 鸿蒙特有测试 test_ohos_config.c：7 项断言验证 HarmonyOS 适配配置
#    （NSConstantString / -O0 / gnustep-2.0 ABI / ng-gnu-gnu / IS_LINUX=.so /
#    HAVE_SHARED_LIBS / GNUstep.sh），实测 7/7 通过。
test_package_tests:
  - file: test_package/conanfile.py
    description: >
      Builds and runs all 9 upstream TestFramework examples against the
      installed gnustep-make + published gnustep-base/1.31.1 Foundation
      (transitively libobjc2/libffi/curl), plus a HarmonyOS-specific config
      test (7 assertions). Also injects the OHOS SDK C++ runtime directory
      (libc++_shared.so) needed by libobjc.so.
    command: "conan create (test_package auto-run: example1..example9 + test_ohos_config)"

assertion_count: 9
