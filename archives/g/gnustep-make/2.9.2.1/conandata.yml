sources:
  url: "https://codeload.github.com/gnustep/tools-make/tar.gz/refs/tags/make-2_9_2"
  filename: "gnustep-make-2.9.2.1.tar.gz"
  sha256: "b3fdee058879675f6979c553fb6172b160ca79ffd0f170f51379326b7922941a"

patches:
  - patch_file: "patches/0001-config-noarch.make.in.patch"
    base_path: "."
    patch_type: "portability"
    patch_description: "Default library combo to ng-gnu-gnu (libobjc2 modern runtime)"
  - patch_file: "patches/0002-config.guess.patch"
    base_path: "."
    patch_type: "portability"
    patch_description: "Recognize HarmonyOS aarch64 in config.guess"
  - patch_file: "patches/0003-config.make.in.patch"
    base_path: "."
    patch_type: "portability"
    patch_description: "Use -O0 (avoid constant-string link issue), NSConstantString class, gnustep-2.0 ObjC ABI"
  - patch_file: "patches/0004-config.sub.patch"
    base_path: "."
    patch_type: "portability"
    patch_description: "Accept the linux-ohos configuration triplet"
  - patch_file: "patches/0005-configure.patch"
    base_path: "."
    patch_type: "portability"
    patch_description: "Avoid hmdfs umask failure and optionalize missing chown"
  - patch_file: "patches/0006-target.make.patch"
    base_path: "."
    patch_type: "portability"
    patch_description: "Treat linux-ohos (HarmonyOS) as GNU/Linux so .so libraries build correctly"