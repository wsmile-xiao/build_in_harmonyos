package: gnustep-make/2.9.2
homepage: "https://github.com/gnustep/tools-make"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# The release has no top-level check target. Its TestFramework examples are
# Objective-C Foundation tests and require gnustep-base, which is a downstream
# package that uses gnustep-make to build; they are therefore not claimed here.
upstream_tests: []

test_package_tests:
  - file: test_package/conanfile.py
    description: "Consumer test invokes installed gnustep-config for GNUSTEP_MAKEFILES, GNUSTEP_CONFIG_FILE, and Objective-C flags"
    command: "gnustep-config --variable=GNUSTEP_MAKEFILES; gnustep-config --variable=GNUSTEP_CONFIG_FILE; gnustep-config --objc-flags"

assertion_count: 3
