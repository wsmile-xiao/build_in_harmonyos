software: gcalcli
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.3.0"

# 编译状态
# published | built | failed | archived | partial
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///data/storage/el2/base/cache/gcalcli-4.3.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | python
  system: python

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--root=$TEST_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libffi/3.4.6
    - python-dateutil/2.9.0
  # Python 包依赖（未解决）:
  # - google-api-python-client (需要 cryptography/maturin)
  # - httplib2
  # - oauth2client
  # - parsedatetime
  # - vobject

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Python 包使用 setup.py install --prefix=$DEFAULT_PREFIX --root=$TEST_PREFIX"
  - "Rust 编译器（rustc/cargo）存在但无法执行，需要检查 ELF 签名和动态链接"
  - "Python 包依赖安装需要 cryptography（需要 Rust），在鸿蒙上遇到 Rust 执行问题"
  - "libffi 已安装但头文件在 include/ffi/ffi.h（不在默认 include 目录）"
  - "PyPI 下载速度慢，建议使用本地缓存或镜像"
  - "Python 包编译状态标记为 partial，表示本体成功但依赖未完整"
