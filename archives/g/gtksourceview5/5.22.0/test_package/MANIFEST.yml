# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）
#
# gtksourceview5 5.22.0 上游 testsuite 基于 meson（testsuite/meson.build 注册
# 26 个 g_test 可执行目标 + tests/meson.build 8 个测试工具程序）。交叉构建的
# OHOS 二进制无法在构建机上经 `meson test` 运行，build() 中按子集直接在
# OHOS 宿主上执行（无显示环境豁免的用例如实申报，见 notes.md / reports/）。

package: gtksourceview5/5.22.0
homepage: https://gitlab.gnome.org/GNOME/gtksourceview

# 上游测试命令
upstream_check_command: "meson test -C builddir"
upstream_test_in_build: true
upstream_test_command: "builddir/testsuite/test-* (direct exec on OHOS host, subset)"

# 代表性上游测试（完整 26 项清单与逐项结果见 notes.md）
upstream_tests:
  - file: testsuite/test-language.c
    source: gtksourceview-5.22.0.tar.xz/testsuite/test-language.c
    description: "GtkSourceLanguage 对象与元数据测试"
    command: "builddir/testsuite/test-language"
  - file: testsuite/test-regex.c
    source: gtksourceview-5.22.0.tar.xz/testsuite/test-regex.c
    description: "GtkSourceRegex（pcre2 后端 implregex）测试"
    command: "builddir/testsuite/test-regex"
  - file: testsuite/test-buffer.c
    source: gtksourceview-5.22.0.tar.xz/testsuite/test-buffer.c
    description: "GtkSourceBuffer 核心行为测试"
    command: "builddir/testsuite/test-buffer"

# test_package 自带测试（消费者视角，真实 API）
test_package_tests:
  - file: test.c
    description: "真实 API 冒烟：版本 API×3 + LanguageManager 语言查找/数量 + StyleSchemeManager + Buffer 创建/高亮设置"
    command: "./test_gtksourceview5"

# 断言数：版本×3 + language 非空 + lang name 非空 + 语言数量 + scheme 非空 + buffer 创建
assertion_count: 8
