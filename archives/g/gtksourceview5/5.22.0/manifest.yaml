# gtksourceview5 5.22.0 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "5.22.0"

software: gtksourceview5

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（download.gnome.org 为 GNOME 官方发布镜像）
  url: "https://download.gnome.org/sources/gtksourceview/5.22/gtksourceview-5.22.0.tar.xz"

  # 源码校验和
  sha256: "3ebce33c781e65590a450ecd3ffade480d8e3135b52ee996f1620d6c7dffbbff"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dintrospection=disabled"
    - "-Dvapi=false"
    - "-Ddocumentation=false"
    - "-Dsysprof=false"
    - "-Dbuild-testsuite=true"
    - "-Dinstall-tests=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gtk4/4.22.4
    - glib/2.84.0.1.1
    - libxml2/2.15.3.1
    - pcre2/10.45
    - fribidi/1.0.16

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - patches/0001-meson-remove-gtk-update-icon-cache-post-install.patch
# portability：移除 gnome.post_install(gtk-update-icon-cache)，CI worker 无该
# GTK 宿主工具，老版 meson 视为 configure 硬错误（meson 1.12 仅警告）

# ============================================================
# 测试统计（rule4：N=上游 meson 注册测试目标数）
# ============================================================

test_summary:
  upstream_registered: 26
  upstream_runnable: 2
  upstream_passed: 2
  upstream_display_limited: 24
  consumer_test_package: "8 断言 ALL PASS"
  notes: >-
    26 项中 2 项纯核心测试（stream 类）无显示可跑，6+9=15 断言全 PASS；
    24 项依赖 gtk_test_init 显示（OHOS 无窗口系统，Broadway socket 被
    SELinux 禁止），平台限制如实申报；test_package 消费者测试 8 断言
    全 PASS（含 180 语言 spec 的 libxml2 解析实测）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "meson detect_ninja 对 PATH 裸名探测在 OHOS musl python 下失败：generate() 注入 NINJA 环境变量（绝对路径）解决"
  - "conan 2.29 layout folders.build=builddir 时 self.build_folder 已含 builddir，meson 输出在 build_folder/testsuite 而非 build_folder/builddir/testsuite"
  - "pcre2 需 override 对齐 glib pin（10.45），且 pcre2.pc 需转发 libpcre2-8.pc（组件名探测）"
  - "conan buildenv 重写 LD_LIBRARY_PATH 后 hnp cmake 报 Error relocating：test_package 需显式前置 SDK llvm/lib + /system/lib64"
  - "OHOS 全系统不可 bind unix socket（HMDFS EPERM / /dev/shm 权限拒绝）→ Broadway 显示服务器不可用 → gtk_test_init 类测试恒 abort，属平台限制"
