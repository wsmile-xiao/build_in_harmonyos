software: gst-plugins-ugly
version: "1.28.3"
build_system: meson
status: built
build_date: "2026-05-30"

source:
  url: "https://gstreamer.freedesktop.org/src/gst-plugins-ugly/gst-plugins-ugly-1.28.3.tar.xz"
  sha256: ""
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "-Dbuildtype=debugoptimized"
  dependencies:
    - gstreamer/1.28.3
    - gst-plugins-base/1.28.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "gst-plugins-ugly uses meson (not autotools) - must use meson setup + ninja"
  - "gst-plugins-base libraries on HMDFS can be broken symlinks - need to copy .so files manually from builddir"
  - "iso-codes.pc needs 'domains' variable (not just 'iso_codes_domains') for meson compatibility"
  - "HMDFS filesystem has temp file rename issues affecting meson setup and clang compilation"
  - "Tests fail due to musl dynamic linker not finding shared libs - environment issue not code"
