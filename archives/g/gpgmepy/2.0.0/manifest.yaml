# 版本级 manifest
# 文件位置: archives/g/gpgmepy/2.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.0"

# 软件名
software: "gpgmepy"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-29"
build_system: "setuptools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/gpg/gpgmepy/tar.gz/refs/tags/gpgmepy-2.0.0"

  # 源码校验和
  sha256: "ba0e9dd5fb869726b43247df83513ec2408a853f670b2fa2bc0bbc370f2adfdc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "setup.py.in 占位符替换 (autotools 绕过) 生成 setup.py"
    - "python3.12 setup.py build (swig 生成 + build_ext)"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "gpgme/1.24.0"
    - "libgpg-error/1.55"
    - "python/3.12.9"
    - "swig/4.4.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "gpgmepy 是 SWIG 构建的 Python 扩展 gpg._gpgme + 纯 Python 包 gpg/，用 setup.py build 直接构建（绕过 autotools，本机无 automake/libtool）"
  - "setup.py.in 五个占位符 @VERSION@/@GPGME_CFLAGS@/@GPGME_LIBS@/@GPG_ERROR_CFLAGS@/@GPG_ERROR_LIBS@ 构建时手动替换（E217: 打包的 gpgme-config 缺自身 include 目录）"
  - "setup.py build 需要 in-tree 布局: gpgme.i/helpers.c/helpers.h/private.h 复制到 CWD + gpg -> src 符号链接（复刻 autotools copystamp）"
  - "conan python/3.12.9 不含 setuptools，用本地解包的 setuptools-84.0.0-py3-none-any.whl 通过 PYTHONPATH 提供"
  - "SWIG 需要 SWIG_LIB 指向 swig/4.4.1 包的 share/swig/4.4.1"
  - "HMDFS 上 dlopen 未签名 .so 被拒 (E212)：package() 中 conan copy 后必须用 binary-sign-tool 重签 _gpgme*.so"
  - "上游 26 个 tests/t-*.py 本地实跑（需系统级 GnuPG 2.4.9 运行时，非 conan 制品），通过率如实记于 PR body；上游测试树不随归档（参考 calceph 5.0.0 紧凑消费测试模式）"
  - "本平台 AF_UNIX bind 被 seccomp 拒绝 → gpg-agent 无法启动，依赖引擎的上游测试失败输出如实保留"
