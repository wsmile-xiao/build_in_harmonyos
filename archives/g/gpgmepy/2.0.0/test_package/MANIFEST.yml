# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gpgmepy/2.0.0
homepage: "https://gnupg.org/software/gpgme/"

# 上游测试 tests/ 26 个 Python 测试（autotools make check），需真实
# gpg/gpg-agent 运行时（系统级 GnuPG 2.4.9，非 conan 制品）——本地实跑、
# 结果如实记于 PR body（上游测试树不随归档，参考 calceph 5.0.0 模式）。
# 消费测试：test_gpgmepy.py——import gpg（_gpgme SWIG 扩展 dlopen）+
# 版本属性 + 核心 API 存在性 + gpg.Data 内存读写（5 断言，非空壳）。
upstream_tests: 26
upstream_test_command: "python tests/run-tests.py t-*.py --srcdir tests（autotools make check 等价）"

test_package_tests:
  - file: test_gpgmepy.py
    description: "消费测试：import gpg 自 conan 包（_gpgme 扩展 dlopen）+ __version__/GPGME_VERSION 版本属性 + Context/Data 类与 gpgme 属性 + gpg.Data 内存读写（5 断言）"
    command: "python3 test_gpgmepy.py <site-packages> <python_bin>"

assertion_count: 5
