software: git-flow
display: "Git Flow (AVH Edition)"
description: "A collection of Git extensions to provide high-level repository operations for Vincent Driessen's branching model"
category: build-tool
homepage: "https://github.com/petervanderdoes/gitflow-avh"
license: BSD-2-Clause
build_system: makefile

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "纯 Shell 脚本项目，无需编译"
    - "使用 cp + chmod 替代 install 命令（E098）"
    - "不支持 DESTDIR，需要手动构造路径"
  common_dependencies:
    - git

# 版本索引
versions:
  "1.12.3":
    status: published
    build_date: "2026-05-27"
    published_as: git-flow