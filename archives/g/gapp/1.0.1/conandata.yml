sources:
  url:
    - "https://github.com/KRM7/gapp/archive/refs/tags/v1.0.1.tar.gz"
  sha256: "d0e6eb7da934c96861a4c054cd8c733254dad12bb5271f15e56e5bf3d0a78523"

patches:
  - patch_file: "patches/0001-src-metrics-pop_stats.cpp.patch"
    patch_description: "std::atomic<double>::fetch_add (C++20 floating point atomic RMW) is not implemented by libc++ 15; replace it with an equivalent relaxed compare-exchange loop with identical accumulate semantics"
    patch_type: "portability"
  - patch_file: "patches/0002-src-utility-cpp20_compat.hpp.patch"
    patch_description: "Add cpp20_compat.hpp: polyfills guarded by the standard feature-test macros for std::atomic_ref, std::jthread, std::lexicographical_compare_three_way and the std::ranges algorithm overloads that libc++ 15 does not implement; on a standard library that defines the macro the polyfills are not declared at all"
    patch_type: "portability"
  - patch_file: "patches/0003-src-utility-utility.hpp.patch"
    patch_description: "Include the cpp20_compat.hpp polyfill header from utility.hpp so the library, the upstream tests and downstream consumers all see it before any of the affected call sites"
    patch_type: "portability"
