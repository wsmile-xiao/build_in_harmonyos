# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 所有条目均在设备沙箱 HOME（$TASK_DIR/test-home）下真实执行，
# 原始日志：$TASK_DIR/upstream-ctest.log / upstream-integration.log /
#          upstream-reproducibility.log / upstream-rcu.log / upstream-rcu-assert.log

package: gapp/1.0.1
homepage: "https://github.com/KRM7/gapp"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest --test-dir build-tests --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 计数口径：Catch2 框架注册 test case 数（与源码宏 250 TEST_CASE +
# 58 TEMPLATE_TEST_CASE(182 实例) + 4 TEMPLATE_TEST_CASE_SIG(14 实例) 逐项对齐），
# integration 按实际打印的 "Function:" 场景块计数。
upstream_tests:
  - file: test/unit/CMakeLists.txt
    source: gapp-1.0.1/test/unit
    description: "Catch2 unit suite：ctest 注册 446 个 test case，446 全过（100%）"
    command: "ctest --test-dir build-tests --output-on-failure"
  - file: test/integration/main.cpp
    source: gapp-1.0.1/test/integration
    description: "Benchmark driver：29 个入口函数打印 51 个问题场景结果（上游 sanitizers.yml 运行该程序），exit 0"
    command: "./build/integration_tests"
  - file: test/reproducibility/reproducibility.cpp
    source: gapp-1.0.1/test/reproducibility
    description: "Seeded reproducibility driver：integer-1 == integer-2（11）、multi-thread-1 == multi-thread-2（-0.146872），exit 0"
    command: "./build/reproducibility_test"
  - file: test/misc/rcu.cpp
    source: gapp-1.0.1/test/misc
    description: "RCU soak driver：无退出条件（上游 CI 未注册该入口）；-UNDEBUG 断言生效版运行 60s 与 Release 版运行 250s 均无断言失败/崩溃，随后人工终止"
    command: "./rcu_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_gapp.cpp
    description: "消费者测试：链接已打包的 gapp，跑单目标/多目标 GA，校验边界、适应度一致性、线程 API 与种子可复现（15 条断言）"
    command: "./test_gapp"

# 测试用例总数（上游 499 + 消费者 15）
assertion_count: 514
