      - libgirara.so.5.0

  - version: "2026.07.07.1"
    status: pending
    compiled_at: ''
    notes: |
      - 修复 glib 模块 pkg-config 缺失：meson 改回按 gobject-2.0/gio-2.0 名字查找，
        conanfile 新增 _provide_glib_pc_files() 补齐 PkgConfigDeps 未生成的 glib .pc
      - 修复前，消费方 override glib 导致 girara 重建时链接只有 -lglib-2.0，
        报 20+ 个 g_type_*/g_object_* undefined symbol
      - 不改 glib 版本约束（保持 glib/2.84.0），兼容既有消费方
    dependencies:
      - glib/2.84.0 (Conan)
