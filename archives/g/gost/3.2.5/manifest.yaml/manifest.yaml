software: gost
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.2.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.2.5"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型
build_system: go

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/go-gost/gost/archive/refs/tags/v3.2.5.tar.gz"

  # 源码校验和
  sha256: "fb9840530ded8067622f3c91365300f02b1feccdb7a873e6397eb12d6ed6e01f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | go
  system: go

  # Go build flags (equivalent to configure_options)
  configure_options:
    - "GOARCH=arm64"
    - "GOOS=linux"
    - "CGO_ENABLED=0"
    - "--ldflags=-s -w"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.26.4

  # 编译器
  cc: go1.26.4
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "gost v3.x 使用 go-gost/gost 仓库（非 ginuerzh/gost）"
  - "Go项目使用 CGO_ENABLED=0 静态编译，无需 configure/make 步骤"
  - "Go项目 DESTDIR 模式：手动 mkdir + cp 到 staging 目录"
