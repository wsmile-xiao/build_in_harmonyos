patches:
  "8.3.0":
    - patch_file: "patches/0001-clang15-libcxx15-portability.patch"
      patch_type: "portability"
      patch_description: "clang15/libc++15 可移植性等价改写：函数内 static constexpr 局部变量改等价常量形式、缺 include 补齐、缺失库算法降级为经典迭代器版本、结构化绑定捕获与聚合 CTAD 等价改写、测试源同步适配；全部为特性宏或纯可移植写法无平台条件编译"
    - patch_file: "patches/0002-restore-glaze-expected-fallback.patch"
      patch_strip: 0
      patch_type: "portability"
      patch_description: "恢复上游 v4.4.3 自带的 glz::expected MIT 回退实现并以 __cpp_lib_expected 守卫（libc++ 15 无 std::expected）；补回退分支的 glz::is_expected concept 并给宏加 #ifndef 守卫避免与 generic_fwd.hpp 重定义冲突"
