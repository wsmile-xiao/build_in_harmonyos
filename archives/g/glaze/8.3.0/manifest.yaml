version: "8.3.0"
software: glaze
status: built
build_date: "2026-09-07"
build_system: cmake

source:
  url: "https://github.com/stephenberry/glaze/archive/refs/tags/v8.3.0.tar.gz"
  sha256: "6a8f97f5cdb8df5c87f1b32710679585f3f1a577b67bb66150f2516072e00317"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-Dglaze_DEVELOPER_MODE=ON"
    - "-DBUILD_TESTING=ON"
    - "-Dglaze_ENABLE_SANITIZERS=OFF"
    - "-Dglaze_BUILD_NETWORKING_TESTS=OFF"
    - "-Dglaze_ENABLE_FUZZING=OFF"
    - "-Dglaze_BUILD_PERFORMANCE_TESTS=ON"
    - "-DFETCHCONTENT_FULLY_DISCONNECTED=ON"
  dependencies: []
  cc: clang
  cxx: clang++

# header-only 库本体无编译产物；build 阶段仅校验上游 CMake 包（INTERFACE 目标）

patches_applied:
  - "0001-clang15-libcxx15-portability.patch"
  - "0002-restore-glaze-expected-fallback.patch"

# 说明（无逗号，逗号会破坏 finalize 的列表计数）：
# 0001 = clang15/libc++15 可移植性等价改写（库头文件 17 个 + 测试源 9 个）
# 0002 = 恢复上游 v4.4.3 自带的 glz::expected 回退实现（libc++15 无 std::expected）

knowledge_gained: []
