# 上游默认未编译或按选项排除（非本包缺陷，均有据可查）：
# - networking_tests: glaze_BUILD_NETWORKING_TESTS=OFF（OHOS SDK 无 OpenSSL；
#   glaze/net 扩展还依赖 Asio）。glaze.hpp 核心不包含 net/。
# - jsonb_sqlite_test: 上游 find_package(SQLite3>=3.45 QUIET) 失败自动跳过
#   （configure 日志明示 "jsonb_sqlite_test: disabled (SQLite3 >= 3.45 not found)"）。
# - simple_float_test: 上游默认 OFF（2^32 穷举，独立 CI 工作流执行）。
# - yaml_conformance_data: 上游默认 OFF（需拉取外部 yaml-test-suite 仓库）。
# - p2996_test: 上游默认 OFF（需 GCC 16+/Bloomberg clang-p2996，C++26 反射）。
# - eetf_test: 上游默认 OFF（glaze_EETF_FORMAT）。
# - fuzzing 目标: glaze_ENABLE_FUZZING=OFF（dev-mode 附加项，依赖 libfuzzer 与
#   glaze/net 栈，非 CTest 测试集合成员）。

test_package_tests:
  - file: test_glaze.cpp
    description: "真实消费者：聚合反射 JSON 写读回、generic DOM、BEVE 往返与 JSON 桥、CSV 往返、JSON 指针、错误路径（glz::expected）、map 序列化"
    command: "./test_glaze"

test_package_test_count: 1
# 8 组场景共 20 项断言检查（check() 计数，全部通过才返回 0）
assertion_count: 20
