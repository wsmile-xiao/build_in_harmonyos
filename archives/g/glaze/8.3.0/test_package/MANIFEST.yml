# test_package/MANIFEST.yml — glaze/8.3.0
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md.

package: glaze/8.3.0
homepage: "https://github.com/stephenberry/glaze"

# 上游测试在 OHOS 设备原生执行（非交叉），构建目录
# $HOME/tmp/glaze-8.3.0/native-build，沙箱 HOME 下运行。
upstream_check_command: "cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -Dglaze_DEVELOPER_MODE=ON -DBUILD_TESTING=ON -Dglaze_ENABLE_SANITIZERS=OFF -Dglaze_BUILD_NETWORKING_TESTS=OFF -Dglaze_ENABLE_FUZZING=OFF -Dglaze_BUILD_PERFORMANCE_TESTS=ON -DFETCHCONTENT_FULLY_DISCONNECTED=ON && cmake --build build -j4"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure (87 registrations) or ctest -VV for per-suite counters"
upstream_test_count: 87
upstream_test_count_command: "ctest -N | grep 'Test #' | wc -l  # = 87; per-suite ut counters: ctest -VV | grep -E '^[0-9]+: tests: '"

# CTest 注册 87 项全部通过（100% tests passed, 0 failed out of 87）。
# 计数单位与口径：
# - 73 项为 ut（openalgz/ut v1.2.1）套件，框架自报 tests 合计 6847/6847 通过、
#   asserts 合计 831365/831365 通过（含 *_non_null 等同源双配置变体的重复执行）。
# - float_write_test 自报 99615 次随机有限浮点 round-trip 后 OK。
# - size_optimization_test / indexed_rename_key_test 为自定义检查/框架，输出
#   "all checks passed" / "All tests passed!"。
# - streaming_rejects_* 9 项为编译期拒绝测试：CTest 命令 = `cmake --build
#   --target streaming_rejects_*`，目标必须构建失败（static_assert 拒绝）才通过。
upstream_tests:
  - file: api_test
    description: "glz::meta API 面注册与调用"
  - file: beve_test
    description: "BEVE 二进制序列化/反序列化 + glz::expected 语义"
