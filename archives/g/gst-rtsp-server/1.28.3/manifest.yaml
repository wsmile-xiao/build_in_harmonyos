software: gst-rtsp-server
build_system: meson
version: "1.28.3"
status: built
build_date: "2026-05-30"

source:
  url: "https://gstreamer.freedesktop.org/src/gst-rtsp-server/gst-rtsp-server-1.28.3.tar.xz"
  sha256: ""
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Drtspclientsink=enabled"
    - "-Dexamples=disabled"
    - "-Dtests=disabled"
    - "-Dintrospection=disabled"
    - "-Ddoc=disabled"
    - "-Dglib_assert=false"
    - "-Dglib_checks=false"
  dependencies:
    - gstreamer/1.28.3
    - gst-plugins-base/1.28.3
    - glib/2.88.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "gst-rtsp-server 1.28.3 使用 meson 构建，直接编译无需平台适配补丁"
  - "需要 gstreamer 1.28.3、gst-plugins-base 1.28.3 作为核心依赖"