software: gwenhywfar
version: "5.14.1"
status: published
build_date: "2026-05-26"

source:
  url: "https://www.aquamaniac.de/rdm/attachments/download/630/gwenhywfar-5.14.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--disable-gtk3"
    - "--disable-qt5"
  dependencies:
    - gnutls/3.8.10
    - libiconv/1.17
    - gmp/6.3.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-config-guess.patch"
  - "0002-fix-umask.patch"
  - "0003-fix-makefile-vars.patch"

knowledge_gained:
  - "PKG_CHECK_MODULES 宏在某些情况下未展开，需手动替换 Makefile 变量"
  - "HMDFS 不支持硬链接，需手动复制 .so 文件"
  - "gui 目录需要修改 SUBDIRS 跳过 qt5/gtk3"