# 软件级 manifest — gcem
# 文件位置: archives/g/gcem/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: gcem

# 显示名
display: "GCE-Math"

# 一句话描述
description: "A C++ compile-time math library using generalized constant expressions (header-only)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://github.com/kthohr/gcem"

# 开源许可证（SPDX 标识）
license: Apache-2.0

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "header-only C++11 库，无编译步骤，无需平台适配"
  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.16.0":
    status: built
    build_date: 2026-08-30
    conan_ref: gcem/1.16.0