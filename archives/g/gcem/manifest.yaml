software: gcem
display: "GCE-Math"
description: "C++11 constexpr mathematical functions library (header-only)"
category: library
homepage: "https://github.com/kthohr/gcem"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only C++11 CMake INTERFACE library; no binary library is produced."
    - "No third-party Conan dependencies; only the OHOS C++ standard library/toolchain is used."
    - "CMake 4 compatibility is provided through CMAKE_POLICY_VERSION_MINIMUM=3.5."
    - "The upstream CMake test directory has 46 executable tests but no CTest registrations; the recipe runs every executable and records six OHOS reference-case skips."
    - "Three portability patches fix 128-bit long-double exponent thresholds, tiny-input sqrt convergence, and the OHOS log/log10/log2 oracle limitation."
  common_dependencies: []

versions:
  "1.18.0":
    status: built
    build_date: "2026-09-02"
    conan_ref: "gcem/1.18.0"
