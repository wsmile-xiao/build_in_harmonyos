# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gcem/1.16.0
homepage: "https://github.com/kthohr/gcem"

# 上游测试命令 (gcem header-only：上游自带 tests/ 目录，用 make 编译运行)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（gcem 测试框架为自研 main，断言在编译期与运行期执行）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_gcem.cpp
    description: "编译期 constexpr 断言 + 运行期数值与 std 精度对齐抽查"
    command: "./test_gcem"
  - file: harmonyos_specific_test.cpp
    description: "鸿蒙特有测试：__OHOS__/__aarch64__ 平台宏确认 + gcem API constexpr/运行期校验"
    command: "./harmonyos_specific_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16