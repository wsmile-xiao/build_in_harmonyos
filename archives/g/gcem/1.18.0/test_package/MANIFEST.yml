# test_package/MANIFEST.yml — gcem/1.18.0
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md.

package: gcem/1.18.0
homepage: "https://github.com/kthohr/gcem"

# The upstream CMake test directory has 46 add_executable() entries but no
# enable_testing()/add_test() registration. The recipe builds gcem_tests and
# runs each resulting tests/*.test executable explicitly.
upstream_check_command: "cmake -S . -B build -DGCEM_BUILD_TESTS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build build --target gcem_tests"
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target gcem_tests (then run all tests/*.test executables)"
upstream_test_count: 46
upstream_test_cases_skipped: 6
upstream_test_cases_skip_reason: "tests/log.cpp、log10.cpp、log2.cpp 的六个标准 long-double 参照值在设备标准库上可能对可表示输入返回非有限值；补丁 0002 仅在对应参照值非有限时显式 skip。"

