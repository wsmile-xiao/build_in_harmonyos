version: "1.18.0"
software: gcem
status: built
build_date: "2026-09-02"
build_system: cmake

source:
  url: "https://github.com/kthohr/gcem/archive/refs/tags/v1.18.0.tar.gz"
  sha256: "8e71a9f5b62956da6c409dda44b483f98c4a98ae72184f3aa4659ae5b3462e61"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DGCEM_BUILD_TESTS=ON"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-long-double-exponent-thresholds.patch"
  - "0002-ohos-log-long-double-reference-skip.patch"
  - "0003-scale-small-sqrt-inputs.patch"
knowledge_gained:
  - "C++11 header-only CMake INTERFACE library; no third-party Conan dependencies."
  - "Upstream CMake registers 46 test executables but no CTest tests; the recipe runs all 46 binaries explicitly."
  - "OHOS long double is 128-bit; libc log/log10/log2 return -inf for six finite-range oracle inputs, while gcem sqrt also needs small-input scaling. These are covered by explicit test skips plus consumer regressions."
