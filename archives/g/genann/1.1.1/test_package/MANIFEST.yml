# test_package/MANIFEST.yml — genann 1.1.1
# CI L0e requires this file to exist.

package: genann/1.1.1
homepage: "https://github.com/codeplea/genann"

# Upstream check target: `make check` builds and runs the `test` binary
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "./test"

# Upstream test suite: single test.c with 13 lrun-registered cases
upstream_tests:
  - file: test.c
    description: "Upstream test suite — 13 cases (basic, xor, backprop, train and/or/xor/tanh/relu, gradient tanh/relu, persist, copy, sigmoid), 521586/521586 assertions passed"

# test_package tests (consumer perspective)
test_package_tests:
  - file: consumer_test.c
    description: "Consumer: trains ANN on XOR via public API and asserts 4/4 classification (observable backprop result)"
    command: "consumer_test"

# Approximate assertion count (4 XOR classifications)
assertion_count: 4