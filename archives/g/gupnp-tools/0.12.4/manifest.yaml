# gupnp-tools 0.12.4 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "0.12.4"

software: gupnp-tools

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/gupnp-tools/0.12/gupnp-tools-0.12.4.tar.xz"

  # 源码校验和
  sha256: "2c7f6f538fb36a15322be532217e5de161182c943c0a8b0da4458cf970b4092f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dgui-tools=false"
    - "-Dav-tools=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib2/2.88.0
    - libsoup3/3.6.5-r1
    - gssdp/1.6.6
    - gupnp/1.6.8
    - libxml2/2.15.3
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-meson-add-gui-tools-option-for-headless-CLI-only-bui.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "application 型包（工具集）：产物为 bin/ 下可执行文件，无库无公共头文件；test_package 直接执行被测二进制做冒烟（R34）。knowledge_ref: DRAFT-gupnp-tools-cli-tool-no-argparse-bounded-test"
  - "上游无自动化测试套件（无 tests/、无 meson test 定义），验证方式 = 实际运行工具。knowledge_ref: DRAFT-gupnp-tools-cli-tool-no-argparse-bounded-test"
  - "工具是否有参数解析决定 test_package 写法：无 GOptionContext 的常驻 CLI（gupnp-event-dumper --help 会永久阻塞）必须改用有界运行（后台启动 + SIGTERM + wait，断言干净退出 exit 0）。knowledge_ref: DRAFT-gupnp-tools-cli-tool-no-argparse-bounded-test"
  - "有 GOptionContext 的 CLI（gssdp-discover）--help exit 0，且 -n <秒> 可做真实 SSDP 发现后正常退出，是理想的功能性冒烟入口。knowledge_ref: DRAFT-gupnp-tools-cli-tool-no-argparse-bounded-test"
  - "OHOS gtk/3.24.43(broadway, shared glib/2.84) 与 gupnp 栈（libsoup-3.0.so 内嵌 static glib2/2.88 单 GObject 域）同进程 → 双 GType 注册撕裂 SIGABRT：二者不可共存，GUI 工具（network-light/universal-cp/av-cp）构建期裁剪，只交付 CLI 工具。knowledge_ref: E457"
  - "补丁 0001 引入 gui-tools meson 选项（默认 true，上游行为不变）：false 时 gtk 变可选依赖、GUI subdir 与 data/ 资源跳过、HAVE_GTK_SOURCEVIEW 强制 false；upload 依赖未发布的 gupnp-av，由 av-tools=false 一并裁剪。knowledge_ref: E457"
  - "GLib .pc Libs 置空单副本方案第三度复用（gssdp/gupnp → gupnp-tools）：把 glib-2.0/gobject-2.0/gio-2.0 等 .pc 的 Libs 行置空，静态 glib2 不进链接命令，可执行文件 g_* 全 UND 解析到 libsoup-3.0.so 导出的唯一 gobject 副本。knowledge_ref: E457"
  - "meson install 会改写 ELF（清理 DT_RUNPATH）使 OHOS .codesign 段哈希失配、执行报 Operation not permitted → package() 用 build 目录原始链接产物覆盖安装产物。knowledge_ref: E135"
  - "PkgConfigDeps 只按包名生成一个 .pc；meson 需要多个模块名（glib-2.0/gio-2.0/gssdp-1.6/gupnp-1.6）时，需把依赖包内自带 .pc 目录（修正 prefix 后）前置到 pkg_config_path。knowledge_ref: E348"
