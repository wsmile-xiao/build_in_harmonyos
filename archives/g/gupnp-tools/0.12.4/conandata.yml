# conandata.yml — gupnp-tools 0.12.4
# 多镜像 URL：CI Worker 网络受限，单 URL 会下载超时；按可达性验证排序
# （NJU 镜像 200 且对 CI Worker 可达；download.gnome.org 官方源 200 作为备选；
#  与 gssdp 1.6.6 / gupnp 1.6.8 同款双 URL 方案）

sources:
  url:
    - "https://mirror.nju.edu.cn/gnome/sources/gupnp-tools/0.12/gupnp-tools-0.12.4.tar.xz"
    - "https://download.gnome.org/sources/gupnp-tools/0.12/gupnp-tools-0.12.4.tar.xz"
  sha256: "2c7f6f538fb36a15322be532217e5de161182c943c0a8b0da4458cf970b4092f"

patches:
  - patch_file: "patches/0001-meson-add-gui-tools-option-for-headless-CLI-only-bui.patch"
    patch_description: "meson: add gui-tools boolean option (default true) for headless/CLI-only builds; when disabled gtk+-3.0 becomes optional, GUI subdirs (common/av-cp/upload/network-light/universal-cp) and data/ resources are skipped, HAVE_GTK_SOURCEVIEW forced false, and the CLI tools gssdp-discover + gupnp-event-dumper are still built. Needed on OHOS because the published gtk/3.24.43 binds a second shared glib/2.84 whose GObject domain conflicts with the gupnp stack single-GObject domain (static glib2/2.88 re-exported via libsoup-3.0.so) — dual GType registration tear/SIGABRT, documented in gssdp 1.6.6 / gupnp 1.6.8 notes"
    patch_type: "portability"
