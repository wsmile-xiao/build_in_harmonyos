# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）

package: gupnp-tools/0.12.4
homepage: https://gitlab.gnome.org/GNOME/gupnp-tools

# 上游测试命令（gupnp-tools 是工具集项目，上游无 meson test 测试套件；
# 上游 README 的验证方式是实际运行工具）
upstream_check_command: "gssdp-discover --help && gssdp-discover -n 1"

# 上游无自动测试套件（无 tests/ 目录、无 meson test 定义）
upstream_test_in_build: false
upstream_tests: []

# 说明：gupnp-tools 上游不携带任何自动化测试（tools 项目，无 tests/ 目录，
# meson.build 无 test() 调用）。上游用户文档的验证方式就是运行工具本身。
# 适配后按同等语义验证：执行被测包安装的两个 CLI 工具（真实二进制冒烟，
# R34：test 实质依赖被测包的产物），断言 exit 0。

# test_package 自带测试（消费者视角，真实二进制执行）
test_package_tests:
  - file: test_package/conanfile.py::test
    description: "执行被测包安装的 gssdp-discover --help / gssdp-discover -n 1（真实 GSSDP 工具二进制，exit 0）与 gupnp-event-dumper 的有界运行（SIGTERM 后干净退出 exit 0；LD_LIBRARY_PATH 覆盖 gupnp 栈全部传递依赖）"
    command: "gssdp-discover --help; gssdp-discover -n 1; gupnp-event-dumper (bounded, SIGTERM)"
  - file: test_package/test_gupnp_tools.c
    description: "结构伴随源：验证 conan 工具链在执行工具的同一环境可正常编译链接（application 包无公共头文件/库可编译链接）"
    command: "./test_gupnp_tools"

# 断言数：test() 三次 self.run（gssdp-discover --help / gssdp-discover -n 1 /
# gupnp-event-dumper 有界运行，各 exit 0 = 1 断言）+ 伴随源 exit 0
assertion_count: 4
