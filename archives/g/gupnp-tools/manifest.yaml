software: gupnp-tools
display: "gupnp-tools"
description: "GUPnP Tools — free replacements of Intel's UPnP tools (gssdp-discover SSDP discovery tool, gupnp-event-dumper UPnP event dumper; GUI tools included upstream)"
category: network
homepage: "https://gitlab.gnome.org/GNOME/gupnp-tools"
license: GPL-2.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "application 包（工具集）：产物为 bin/ 下可执行文件，无库无公共头文件"
    - "CLI-only 裁剪补丁（0001）：gui-tools meson 选项，OHOS 构建 false——GUI 工具硬依赖 GTK+3，已发布 gtk/3.24.43(broadway) 绑定第二份 shared glib/2.84 与 gupnp 栈单 GObject 域冲突（双 GType 注册撕裂 SIGABRT，gssdp/gupnp notes 铁证）"
    - "GLib .pc Libs 置空单 GObject 副本方案（gssdp 1.6.6 / gupnp 1.6.8 第三次复用）：工具可执行文件 g_* 全 UND，运行时解析到 libsoup-3.0.so"
    - "上游无测试套件；test_package 执行被测包二进制做真实冒烟（R34）：gssdp-discover --help / -n 1，gupnp-event-dumper 有界运行（上游 main() 无参数解析，--help 会永久阻塞）"
    - "依赖 gupnp/1.6.8 现已发布到 ohpcd（含 OHOS armv8 二进制），PF4 依赖闸可通过"
  common_dependencies:
    - "gssdp"
    - "gupnp"
    - "libsoup3"
    - "glib2"
    - "libxml2"

versions:
  "0.12.4":
    status: built
    build_date: "2026-09-27"
