# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游 globus-callout 自带 test/ 目录（autotools check，TAP 输出）：
#   - callout_test      2 个测试点（test_callout + 整体流程）
#   - callout_chain_test 4 个测试点（chaina/b/c 三个 callout + 整体流程）
#   - 依赖 libtest/libchaina/b/c 四个 dlpreopen 模块 + test.conf
# 本次适配在 build() 内实跑（审查 rule4 整改）：构建两个测试二进制后直接
# 运行，实测 6/6 通过（callout_test 2/2，callout_chain_test 4/4）。

package: globus-callout/4.3
homepage: "https://github.com/gridcf/gct"

# 上游官方测试：test/ 目录 + make check（globus 测试宏 + libtool dlpreopen）
upstream_official_tests:
  - suite: "make check (test/)"
    count: 6        # TAP 测试点：callout_test 2 + callout_chain_test 4
    kind: "unit"
    command: "make check"
    run_in_build: true
    result: "6/6 通过（100%）——build() 内构建 callout_test/callout_chain_test 后直接运行，本地实测通过"

# 构建阶段执行的测试命令：上游测试已在 build() 实跑（见 conanfile.py build()）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 说明：不使用 `make check` 驱动运行——其 LOG_COMPILER 为
# `$(LIBTOOL) --mode=execute`，libtool 包装器重置 LD_LIBRARY_PATH 导致
# libglobus_common.so.0/libltdl.so.7 运行时加载失败；改为直接运行两个
# 测试二进制（已 -dlpreopen 链接进 dlopen 模块），注入 LD_LIBRARY_PATH
# （globus-common/libtool 包 lib + 本包 .libs）与 srcdir（test.conf）。
# 不修改任何上游测试内容。

# 适配补全测试（自研，非上游）：无
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test_package.c
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：include globus_callout.h + 链接 libglobus_callout，编译并运行验证库可用"
    command: "./test_globus_callout"

# 测试断言总数 (实际统计：1 项断言：handle null 检查通过)
assertion_count: 1
