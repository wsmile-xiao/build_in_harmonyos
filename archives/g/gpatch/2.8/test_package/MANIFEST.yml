# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gpatch/2.8
homepage: "https://www.gnu.org/software/patch/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: "testsuite"
    source: "patch-2.8/testsuite"
    description: "GNU patch 上游测试套件 (make check)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
# CLI 工具，通过 bash 执行 patch --version + 基本补丁应用测试
test_package_tests:
  - file: "test_patch.sh"
    description: "通过 bash 执行 patch --version 验证版本 + 基本补丁应用/撤销测试"
    command: 'bash test_patch.sh <patch_bin>'

# 测试断言总数 (近似值)
assertion_count: 3
