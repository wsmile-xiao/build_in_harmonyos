software: gpatch
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.8"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/patch/patch-2.8.tar.xz"

  # 源码校验和
  sha256: "f87cee69eec2b4fcbf60a396b030ad6aa3415f192aa5f7ee84cad5e11f7f5ae3"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
  - "--prefix=${PREFIX}"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E007: config.guess/config.sub 需要添加 OHOS 平台识别"
  - "E011: configure umask 077 需改为 022 适配 HMDFS"

patch_generation:
  method: per-file-difflib
  patches_count: 2

patch_classification:
  - file: 0001-build-aux-config.guess.patch
    type: platform_detection
    platform_only: true
    guard: 'no guard needed'
    description: '添加 HarmonyOS 平台识别支持'
  - file: 0002-build-aux-config.sub.patch
    type: platform_detection
    platform_only: true
    guard: 'no guard needed'
    description: '添加 HarmonyOS 平台识别支持'

# ============================================================
# 测试结果
# ============================================================

test_summary:
  total: 49
  passed: 39
  skipped: 8
  xfail: 2
  failed: 0
  error: 0
  status: pass
  skip_reasons:
    - 'file-create-modes: 文件系统权限限制'
    - 'file-modes: 文件系统权限限制'
    - 'hardlinks: HMDFS 硬链接限制'
    - 'no-mode-change-git-diff: 文件系统权限限制'
    - 'preserve-mode-and-timestamp: 文件系统权限限制'
    - 'read-only-files: 文件系统权限限制'
    - 'unmodified-files: 文件系统限制'
