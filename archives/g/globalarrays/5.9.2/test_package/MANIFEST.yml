package: globalarrays/5.9.2
homepage: "https://github.com/GlobalArrays/ga"
upstream_check_command: "global/testing/unit-tests 单文件 C 程序逐一编译链接并运行（真 MPI，mpiexec -n 1）"
upstream_test_in_build: false
upstream_test_command: "mpiexec -n 1 ./<test>.x"
upstream_tests:
  - file: "unit-tests/ga_add.c"
    source: "global/testing/unit-tests/ga_add.c"
    description: "上游单文件单元测试之一（共 80 个含 main 的测试程序，68 个真 MPI 单进程验证 PASS）。"
    command: "mpiexec -n 1 ./ga_add.x"
  - file: "unit-tests/ga_acc.c"
    source: "global/testing/unit-tests/ga_acc.c"
    description: "上游单文件单元测试之一。"
    command: "mpiexec -n 1 ./ga_acc.x"
  - file: "unit-tests/ga_put2.c"
    source: "global/testing/unit-tests/ga_put2.c"
    description: "上游单文件单元测试之一（真 MPI 下已修复：此前偶发段错误）。"
    command: "mpiexec -n 1 ./ga_put2.x"
test_package_tests:
  - file: "test_ga.c"
    description: "Consumer 测试：GA_Initialize/Nodeid、NGA_Create、NGA_Put/NGA_Get 往返、NGA_Inquire 维度查询、非法维度负向断言（真 MPI，MPI_Init 前置）。"
    command: "./test_ga"
assertion_count: 6
upstream_adaptation_notes: |
  上游测试统计（按单文件测试程序计数，真 MPI/mpich 依赖）：
  - unit-tests 目录 84 个源文件，其中 80 个含 main 的独立测试程序，全部编译链接成功；
  - 实测运行（真 MPI 单进程 mpiexec -n 1，PASS=退出码 0 且输出不含 "GA ERROR"）：
    68 个 PASS（进 CI 的 run_upstream_tests.sh 覆盖），12 个 FAIL；
  - 固定断言失败修复证据（第二轮评审要求）：
    换真 MPI 后 ga_add、ga_put2 已修复（此前 ga_add rc=11、ga_put2 偶发段错误）；
    ga_acc、ga_lgop、ga_median 仍输出 GA ERROR（依赖多进程/分布语义，单进程无法满足）；
    9 个 RUNFAIL（rc=1/4/24/146/255）依赖多进程语义：ga_abs_value、ga_create_irreg、
    ga_create_irreg2、ga_destroy、ga_elem_divide、ga_fill、ga_get_blockinfo、ga_scale、ga_solve；
  - 多进程/PGAS 能力：依赖 mpich/5.0.1（真 MPI），mpiexec -n 1 单进程验证；
    多进程运行（-n 2）因上游单文件测试 MA_init 重复初始化冲突不可行（已有实证）。
  - 其余测试目录（armci/testing、comex/testing、tcgmsg/tests、ga++/testing、
    gparrays/testing 等）依赖 MPI 多进程或 ARMCI 多进程运行时，未运行（N/A）。
  - 断言点口径：每个含 main 的测试程序计 1 个用例；68 个 PASS 用例对应 68 个断言点。
