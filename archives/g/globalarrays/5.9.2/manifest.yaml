version: "5.9.2"
software: "globalarrays"
status: "built"
build_date: "2026-08-19"
build_system: "autotools"

homepage: "https://github.com/GlobalArrays/ga"
license: "BSD-3-Clause"

source:
  url: "https://github.com/GlobalArrays/ga/releases/download/v5.9.2/ga-5.9.2.tar.gz"
  sha256: "cbf15764bf9c04e47e7a798271c418f76b23f1857b23feb24b6cb3891a57fbf2"
  tar_format: "tar.gz"

build:
  system: "autotools"
  configure_options:
    - "--with-mpi"
    - "--disable-shared --enable-static"
    - "--disable-openmp"
  dependencies:
    - "mpich/5.0.1"
  cc: "mpicc (mpich wrapper)"
  cxx: "clang++"

patches_applied:
  - "0001-fix-autoconf-tmpdir-ohos.patch"
  - "0002-fix-armci-configure-tmpdir-ohos.patch"
  - "0003-fix-comex-configure-tmpdir-ohos.patch"
  - "0004-guard-comex-mpi-tests-ohos.patch"
  - "0005-spinlock-aarch64-ohos.patch"

tests:
  upstream:
    command: "global/testing/unit-tests 单文件 C 程序逐一编译链接并运行（真 MPI，mpiexec -n 1）"
    cases: 80
    passed: 68
    failed: 12
    note: "80 个含 main 的上游单文件测试程序全部编译链接成功；真 MPI（mpich 依赖）单进程运行 68 PASS、12 FAIL（ga_acc/ga_lgop/ga_median 输出 GA ERROR 依赖多进程分布语义，ga_abs_value/ga_create_irreg/ga_create_irreg2/ga_destroy/ga_elem_divide/ga_fill/ga_get_blockinfo/ga_scale/ga_solve 依赖多进程语义运行失败）；换真 MPI 后 ga_add/ga_put2 已修复（第二轮评审响应证据）"
  adapted:
    command: "test_package test_ga"
    cases: 6
    passed: 6

knowledge_gained:
  - "globalarrays 是 PGAS 库，消息层硬依赖 MPI；作为依赖项适配 mpich/5.0.1（基线已有配方+缓存 binary），configure --with-mpi 走 mpicc 完成构建。"
  - "config.guess 无法识别 HarmonyOS(uname)，configure 必须显式 --build/--host=aarch64-unknown-linux-ohos。"
  - "autoconf 2.72 的 umask 077 && mktemp -d './confXXXXXX' 在 HMDFS 上创建的 setgid 目录不可写，需补丁改为 ${TMPDIR:-.} + umask 022（dnsperf 同款先例）。"
  - "armci spinlock.h 无 aarch64 分支，需补丁添加 __atomic_exchange_n（LDXR/STXR）原子自旋锁分支。"
  - "上游单文件测试为单进程设计：mpiexec -n 2 会 MA_init 重复初始化冲突超时，须用 -n 1 运行；真 MPI 完整语义修复了 ga_add/ga_put2 等固定断言失败。"
  - "mpich recipe 的 package_info 未设 includedirs，consumer 需在 CMakeToolchain extra_cflags 注入 -I<mpich>/include；cpp_info.requires 用 '包名::组件名' 格式。"
