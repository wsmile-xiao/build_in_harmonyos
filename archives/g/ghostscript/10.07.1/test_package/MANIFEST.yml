# test_package/MANIFEST.yml — ghostscript 10.07.1
# CI L0e 门禁要求此文件存在。
# ghostscript 10.07.1 上游有 make check 但耗时极长（完整 PostScript/PDF 测试套件），
# CI 环境下仅验证 gs --version 可执行。
# test_package smoke test 替代完整 make check。

package: ghostscript/10.07.1
homepage: "https://www.ghostscript.com/"

# 上游测试命令探测：make check 存在但超时
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试程序（make check 依赖完整构建环境及测试文件）
upstream_tests: []

# test_package smoke tests（可执行文件验证）
test_package_tests:
  - file: test.sh
    description: "gs --version 打印 10.07.1 并返回 0"
    command: "bash test.sh"

assertion_count: 1
