upstream_tests:
  - name: "tiff/test"
    count: 162
    description: "独立 libtiff make check。关掉 pixarlog（上游 GS 也未定义 PIXARLOG_SUPPORT），并把 tif_config.h 的 HAVE_SNPRINTF 写成 define，否则 tiffiop.h 会把 snprintf 换成链接不到的 _TIFF_snprintf_f。162 项通过。"
  - name: "libpng/tests"
    count: 34
    description: "make check：31 通过，1 失败（pngtest-all，zlib-ng 字节比较），2 项是辅助程序 pngstest 与 pngstest-large-stride，没有单独的 PASS/FAIL 行，记受阻。"
  - name: "freetype/tests"
    count: 4
    description: "meson test 退出码 0，1/1 regression freetype2:issue-1063 OK。tests/data/As.I.Lay.Dying.ttf 已在树里（23120 字节），该目录不计入 508。重下该字体时 github.com 连接超时，脚本看到字体文件已存在就继续测。"
  - name: "zlib test 与 contrib/*/test"
    count: 36
    description: "顶层 ctest 4 项通过，另有 4 个夹具随套件退出码 0 记通过。minigzip.c 没有 add_test。contrib blast/iostream3/minizip 的嵌套 ctest 退出码 8（find_package）。puff 的 ctest 打印 No tests were found。这 28 项记受阻。"
  - name: "brotli/python/tests"
    count: 6
    description: "setup.py 扩展已链上，pytest 因发行包没有 brotli/tests/testdata（zerosukkanooa.compressed）而 FileNotFoundError。6 项受阻。"
  - name: "tesseract/unittest"
    count: 81
    description: "Makefile.am 要链接未随包提供的 gtest-all.cc；设备没有 gtest.h、leptonica（pkg-config lept 失败）和 traineddata。81 项受阻。"
  - name: "extract/test"
    count: 131
    description: "make test-gs 通过，9 个 gs/docx 相关文件记通过。其余 122 个是 mutool 夹具，设备没有 mutool，记受阻。不在本配方里构建 mupdf。"
  - name: "toolbin/tests"
    count: 51
    description: "3 个脚本退出码 0。45 个是 Python 2 集群脚本，Python 3.14 报 TabError/IndentationError/SyntaxError。README、comparefiles、fuzzy.c 各 1 项：发行包没有 /home/regression/comparefiles。"
  - name: "demos/java/gstest"
    count: 3
    description: ".classpath、.project、Main.java。直接跑脚本时 java 与 javac 都不在 PATH。conanbuild 里若有 javac，Main.java 仍缺 NativePointer 与 GS_SPT_INT，记受阻。3 项受阻。"

