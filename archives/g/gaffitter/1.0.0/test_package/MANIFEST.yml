package: gaffitter/1.0.0
homepage: "https://gaffitter.sourceforge.net/"

upstream_check_command: "none"
upstream_test_in_build: false

upstream_tests:
  - name: none
    command: "n/a"
    expected: "上游 1.0.0 无任何测试（CMakeLists 无 enable_testing/add_test 目标，无 tests/ 目录、测试脚本、CI 配置；grep -rni 'enable_testing|add_test|CTest' 无命中）"

test_package_tests:
  - file: cli_test.sh
    description: "CLI 真实行为测试 40 断言：--version/-h、错误路径退出码（-t 缺值=1、缺 --target/空输入=2）、管道直输 --sp 确定性输出、超大条目排除告警、恰好装满、--bins 截断、GA 容量约束/守恒/理论最优/确定性、真实文件 stat 装箱、管道文件名输入"
    command: "bash cli_test.sh"

assertion_count: 40
