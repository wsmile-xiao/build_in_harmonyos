version: "1.0.0"
status: built
build_date: "2026-10-12"
conan_ref: gaffitter/1.0.0

source:
  url: "https://downloads.sourceforge.net/project/gaffitter/gaffitter/1.0.0/gaffitter-1.0.0.tar.gz"
  sha256: "c85d33bdc6c0875a7144b540a7cce3e78e7c23d2ead0489327625549c3ab23ee"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake >= 4.0 拒绝 cmake_minimum_required(VERSION 2.4)：传 CMAKE_POLICY_VERSION_MINIMUM=3.5（官方兼容机制）免 patch 构建 2015 年代旧项目"
  - "gaffitter 为纯 POSIX C++（stat/lstat/readdir + rand/srand），musl 完整覆盖，无 OS 分支无 patch 即可在 OHOS 构建"
