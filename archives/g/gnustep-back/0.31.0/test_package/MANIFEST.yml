# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gnustep-back/0.31.0
homepage: "https://gnustep.github.io/"

# 上游测试命令 (gnustep-back 无独立 make check 测试套件)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# gnustep-back 0.31.0 源码包无 Tests 目录、无 test 目标（Fonts/Tools 均非测试），
# 上游未提供自动化测试套件。按积分赛模板"上游无测试用例需补全"要求，
# 由 test_package 提供消费者测试验证后端库链接与核心功能。
upstream_tests:
  - name: "upstream-test-suite"
    discovered: 0
    note: "gnustep-back 上游无独立自动化测试套件, 详见说明"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_gnustep_back.m
    description: "消费者测试: NSView/NSString 类解析、NSView frame 操作、GSBackend 符号解析"
    command: "./test_gnustep_back"

# 构建方式说明: 本 test_package 使用直接 clang 编译(本机 cmake 需系统
# libc++_shared.so 而加载失败), 与主配方验证过的工具链一致
build_method: direct-clang

# 测试断言总数
assertion_count: 8