version: "0.31.0"
software: "gnustep-back"
status: adapted
build_date: "2026-09-06"
build_system: "autotools+gnustep-make"

source:
  url: "https://github.com/gnustep/libs-back/releases/download/back-0_31_0/gnustep-back-0.31.0.tar.gz"
  sha256: "04ca1a2d0b46f79b4dfd47c17d7e06f41d079cc5e1dbb45c239f7c3dec95d2ee"
  tar_format: tar.gz

build:
  system: "autotools+gnustep-make"
  configure_options:
    - "--enable-server=headless"
    - "--enable-graphics=headless"
  dependencies:
    - "gnustep-gui/0.31.1"
    - "gnustep-base/1.31.1"
    - "libobjc2/2.2.1"
  tool_requires:
    - "gnustep-make/2.9.2.1"

tests:
  upstream_tests_discovered: false
  upstream_tests_count: 0
  upstream_tests_note: "gnustep-back 上游无独立自动化测试套件（Tests 目录仅含少量示例），本适配以 test_package 消费者测试验证后端库链接与基本加载"
  upstream_tests_executed: 0
  consumer_test: "Objective-C AppKit consumer test in test_package (尝试加载 libgnustep-back 并验证 GNUstep 后端可用性)"

notes:
  - "gnustep-back 0.31.0 依赖 gnustep-gui/0.31.1 与 gnustep-base/1.31.1（均已在制品仓发布）"
  - "OHOS 无 X11，使用 headless 后端（configure 中 graphics=headless 分支无外部图形依赖）"
  - "主库 libgnustep-back.so 由 gnustep-make 构建，产物别名用 copyfile 生成（hmdfs ln 限制）"