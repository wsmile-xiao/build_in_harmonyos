software: goocanvas
# 版本级 manifest
# 文件位置: archives/g/goocanvas/3.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.0"
status: built
build_date: "2026-08-23"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.gnome.org/sources/goocanvas/3.0/goocanvas-3.0.0.tar.xz"
  mirror_url: "https://repo.huaweicloud.com/gnome/sources/goocanvas/3.0/goocanvas-3.0.0.tar.xz"
  sha256: "670a7557fe185c2703a14a07506156eceb7cea3b4bf75076a573f34ac52b401a"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  configure_options:
    - "--disable-introspection"
    - "--disable-python"
    - "--disable-gtk-doc"
    - "--disable-gtk-doc-html"
    - "--disable-gtk-doc-pdf"

  # Conan 依赖（均为已发布版本，R36 验证通过 conan download --only-recipe）
  dependencies:
    - cairo/1.18.4
    - cairo-gobject/1.18.4

  # GTK+3 系依赖来自 OHOS 系统前缀（cmd-pkgs ohos-aarch64 包，gtkdatabox 同款策略）：
  #   glib/2.88.0 gdk-pixbuf/2.42.12 atk/2.38.0 fribidi/1.0.13 libepoxy/1.5.10
  #   libpng/1.6.43 libjpeg-turbo/3.1.4.1 fontconfig/2.16.0 freetype/2.14.3
  #   harfbuzz/14.2.0 pixman/0.46.4 pango/1.50.14 zlib/1.3.1 gtk+/3.24.38

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "config.sub/config.guess 接受 linux-ohos triplet（recipe 内 _patch_config_sub/_patch_config_guess，非独立 patch 文件）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "GTK+3 系 widget 库（goocanvas/gtkdatabox）的 GTK+3 栈由 OHOS 系统前缀（cmd-pkgs）提供，Conan 仅托管系统未带有的 cairo/cairo-gobject"
  - "系统 gtk+-3.0.pc Requires cairo 与 cairo-gobject，二者需 Conan 依赖补齐，否则 pkg-config --exists gtk+-3.0 失败"
  - "PKG_CONFIG_PATH 顺序：系统前缀 lib/pkgconfig 优先于 Conan generators，避免 conan glib 遮蔽系统 glib"
  - "OHOS 共享库必须 binary-sign-tool 签名；conanfile package() 内对 .so 逐一签名"
