package: goocanvas/3.0.0
homepage: "https://wiki.gnome.org/Projects/GooCanvas"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "recipe build() runs configure && make (library). Upstream ships interactive GTK demo programs (noinst_PROGRAMS, built but not installed) and no standalone test suite; make check has no check_PROGRAMS so it is a no-op."

upstream_tests:
  - file: src/
    source: goocanvas-3.0.0/src/
    description: "Library sources compiled by the recipe. No upstream test binaries are shipped; correctness is covered by the consumer test_package below."
    command: "make"
    status: enabled

test_package_tests:
  - file: test_goocanvas.c
    description: "Consumer smoke test that resolves goocanvas-3.0 through pkg-config, links libgoocanvas-3.0, verifies GObject type registration (goo_canvas_get_type/goo_canvas_item_get_type/goo_canvas_item_model_get_type), creates root group/rect/ellipse/text items and a rect model, round-trips item properties via g_object_set/get, computes item bounds, and exercises GooCanvas widget APIs (root item, set/get bounds) when a GTK display backend is available."
    command: "./test_goocanvas"

assertion_count: 27
test_package_pass_rate: "27 assertions; display-dependent widget block runs when gtk_init_check succeeds, otherwise item-level checks still cover the real API."
