# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: graphthewy/1.1
homepage: "https://github.com/alex-87/graphthewy"

# 上游测试命令 (CMake+CTest 项目)
upstream_check_command: "ctest -C Debug"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (CppUTest 依赖, 8 个测试可执行文件)
upstream_tests:
  - file: tests/test_int.cpp
    source: graphthewy-1.1/tests/test_int.cpp
    description: "Undirected graph with int labels"
    command: "./test_int"
  - file: tests/test_char.cpp
    source: graphthewy-1.1/tests/test_char.cpp
    description: "Undirected graph with char labels"
    command: "./test_char"
  - file: tests/test_string.cpp
    source: graphthewy-1.1/tests/test_string.cpp
    description: "Undirected graph with string labels"
    command: "./test_string"
  - file: tests/test_ullint.cpp
    source: graphthewy-1.1/tests/test_ullint.cpp
    description: "Undirected graph with unsigned long long labels"
    command: "./test_ullint"
  - file: tests/test_d_int.cpp
    source: graphthewy-1.1/tests/test_d_int.cpp
    description: "Directed graph with int labels"
    command: "./test_d_int"
  - file: tests/test_d_char.cpp
    source: graphthewy-1.1/tests/test_d_char.cpp
    description: "Directed graph with char labels"
    command: "./test_d_char"
  - file: tests/test_d_string.cpp
    source: graphthewy-1.1/tests/test_d_string.cpp
    description: "Directed graph with string labels"
    command: "./test_d_string"
  - file: tests/test_d_ullint.cpp
    source: graphthewy-1.1/tests/test_d_ullint.cpp
    description: "Directed graph with unsigned long long labels"
    command: "./test_d_ullint"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 头文件编译+环检测功能"
    command: "./test_graphthewy"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8