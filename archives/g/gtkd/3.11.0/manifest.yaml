# 版本级 manifest — gtkd 3.11.0（D 语言 GTK+3 绑定）
# 遵循 ARCHIVE-SPEC v3.0

version: "3.11.0"
software: gtkd
status: built
build_date: "2026-09-20"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游 GitHub 官方 tag（R39 合规）
  url: "https://github.com/gtkd-developers/GtkD/archive/refs/tags/v3.11.0.tar.gz"
  sha256: "c5de7ef0d955c06a35bc979858e2b67c17919294a7aabe36fd593b79c46e5928"
  compression: tar.gz
