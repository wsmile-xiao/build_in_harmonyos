  upstream_tag: "v3.11.0 (17d7dc25e1adc9b86aff381b950f21706118ebeb)"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "gtk/3.24.43"
    - "librsvg/2.62.3.1"
    - "cairo-gobject/1.18.4.3"
  build_required:
    - "ldc/1.42.0"
  note: |
    **构建期与运行期依赖的性质完全不同，这是本包的核心特征。**

    · 构建期 —— 只需 **D 编译器**（`tool_requires("ldc/1.42.0")`），
      **不需要 GTK 头文件、不需要 pkg-config**。原因：gtkd 的绑定代码是
      **运行期 dlopen 型**：
          generated/gtkd/gtk/c/functions.d:
              Linker.link(gtk_window_new, "gtk_window_new", LIBRARY.GTK);
      每个符号都由 `gtkd.Loader`（src/gtkd/Loader.d）在运行时 dlsym 解析。
      GNUmakefile 里那几条 `pkg-config --libs-only-l gtk+-3.0 ...`（SOFLAGS_*）
      只在 `USE_RUNTIME_LINKER` 为空时才生效，而它由
          USE_RUNTIME_LINKER = $(shell grep "Linker" generated/gtkd/atk/c/functions.d)
      判定 —— 实测该文件有 278 处命中 → 分支被跳过。
      实测验证：在**完全没有 GTK** 的环境里 `make libs` 成功产出 5 个静态库。

    · 运行期 —— 必须能 dlopen 到 `gtkd.paths` 列出的库（Linux 分支：
      `libgtk-3.so.0`、`libgdk-3.so.0`、`libgobject-2.0.so.0`、`libgio-2.0.so.0`、
      `librsvg-2.so.2` 等）。故 requires gtk（传递带入 glib/pango/cairo/
      gdk-pixbuf/atk/fribidi/libepoxy 等）+ librsvg，使消费方 `conan install` 后
      LD_LIBRARY_PATH 上就有这些 .so。
      实测：带上 gtk 的运行环境后，`libgtk-3.so.0`/`libgdk-3.so.0`/
      `libgobject-2.0.so.0`/`libgio-2.0.so.0` 均可 dlopen；
      `librsvg-2.so.2` **不在 gtk 传递闭包内**（实测缺失），故单独声明 librsvg。

    · `cairo-gobject` 显式 override —— 版本冲突消解：gtk/3.24.43 钉 1.18.4.2，
      而 librsvg/2.62.3.1 钉 1.18.4.3，二者同图时 conan 直接报
        ERROR: Version conflict: Conflict between cairo-gobject/1.18.4.3
               and cairo-gobject/1.18.4.2 in the graph.
      取较新的 1.18.4.3（ohpcd 已发布，librsvg 为更晚适配版本）。

    · gir-to-d **不需要**：3.11.0 的 sdist 已附 `generated/`（906 个 .d 等），
      绑定是预生成的；只有改上游 API 时才需要重跑代码生成器。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    构建系统为 **GNUmakefile**（上游另有 dub.json，但 ohpcd 无 dub 制品 →
    与 gir-to-d 0.23.3 同一结论，走 Makefile 路径）。

    产物为 **5 个静态库**（package_type=static-library，不声明 shared 选项——
    与同仓 libffi 3.5.2 一致）：dlopen 型绑定无需自建 .so，且 GNUmakefile 的
    shared-libs 目标需要 pkg-config 提供 GTK 链接参数，在 OHOS 上对 conan 包不
    天然可用，故不做。
      libgtkd-3.a（主包，66MB）、libgtkdsv-3.a（GtkSourceView）、
      libgstreamerd-3.a、libvted-3.a、libpeasd-3.a

    **OHOS 上的构建环境适配（均不改上游源码，`patches: {}`）**：
      ① 编译器必须绝对路径（**唯一的致命项**）—— hnp CPython 的 subprocess 走
         posix_spawn、不搜 PATH（E405，cffi 适配同款）；把裸名 `ldc2` 交给 make
         会 `No such file or directory` → `DC=<ldc>/bin/ldc2` 绝对路径（同时满足
         makefile 内 `findstring ldc,$(DC)` 的分支判定）。
      ② `make -j` 的 jobserver 警告（**非致命，不是失败原因**）—— GNU make 的
         jobserver 默认用 FIFO，OHOS 不允许创建，会打印
           `make: jobserver mkfifo: <tmp>/GMfifoNNN: Operation not permitted`
         但 make 4.4.1 **会自动回退到 pipe jobserver**，构建照常完成：
         实测**去掉**本配方的 `--jobserver-style=pipe`、直接 `make -j4 libs`
         → **rc=0，5 个静态库全部产出**（同一警告仍打印）。
         配方仍显式传 `--jobserver-style=pipe` 只为避免该噪音并兼容更老的 make，
         **不是构建成功的必要条件**；已登记的 E074/E525 以及既有草稿
         `E6340-draft-8BEF` 记录的是同一「非致命」结论（pump 类守护进程的
         同一警告亦属此类）。
      另需 `DCFLAGS="-O -I<ldc>/include/d"`：ldc2 默认导入路径不含 Phobos
      源码，实测不给该 -I 会报 `unable to read module 'algorithm'`。

    GNUmakefile 内写死 `GTKD_VERSION=3.10.0`（本包为 3.11.0），但库名与安装目录
    都用 MAJOR（=3），不受影响；本配方在 package() 按真实版本重写 .pc。

