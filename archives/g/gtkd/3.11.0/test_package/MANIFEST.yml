# test_package/MANIFEST.yml — gtkd 3.11.0
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gtkd/3.11.0
homepage: "https://gtkd.org"

# 上游测试命令 — D 语言惯例：unittest 块内嵌在源文件里（非 tests/ 目录）
#
# **本项目无独立的 tests/ 目录，也无 dub testConfiguration。**
# D 语言把测试写成 `unittest { ... }` 块内嵌在源文件中，由 `dub test` 或
# `ldc2 -unittest -main` 驱动。按 Perl/autotools 的 t/ 目录习惯清点会得出
# 「上游无测试」的错误结论（教训见 notes.md）。
#
# GNUmakefile 里的 `test` 目标**不是**单元测试：它编译 demos/gtkD/TestWindow
# 这个 GUI 演示程序（需显示环境），且该 demo 在 3.11.0 上因 `debug(1)` 旧式
# 数字 debug 级别无法通过 LDC 1.42 的 DMD 前端 v2.112.1（需 identifier）。
upstream_check_command: "ldc2 -unittest -main -O -Igenerated/gtkd -I<ldc>/include/d -L-L<ldc>/lib @srcs.txt -of=ut_full && ./ut_full"

# conanfile.py build() 方法中是否已集成上游测试
# （gtkd 的内嵌 unittest 块在库本体之外单独编译运行，见下方 upstream_tests）
upstream_test_in_build: false
upstream_test_command: "ldc2 -unittest -main -O -Igenerated/gtkd -I<ldc>/include/d -L-L<ldc>/lib @srcs.txt -of=ut_full && ./ut_full"

# 上游测试清点与实测（2026-09-20）
upstream_tests:
  - file: generated/gtkd/glib/ListG.d
    source: GtkD-3.11.0/generated/gtkd/glib/ListG.d
    description: "内嵌 unittest 块 ×1（3 条 assert）—— glib.ListG 的 GList 包装"
    command: "ldc2 -unittest -main ... ; ./ut_full"
  - file: generated/gtkd/glib/ListSG.d
    source: GtkD-3.11.0/generated/gtkd/glib/ListSG.d
    description: "内嵌 unittest 块 ×1（3 条 assert）—— glib.ListSG 的 GSList 包装"
    command: "ldc2 -unittest -main ... ; ./ut_full"
  - file: generated/gtkd/glib/c/types.d
    source: GtkD-3.11.0/generated/gtkd/glib/c/types.d
    description: "内嵌 unittest 块 ×1（1 条 assert）—— glib C 类型映射"
    command: "ldc2 -unittest -main ... ; ./ut_full"
  - file: generated/gtkd/gobject/ObjectG.d
    source: GtkD-3.11.0/generated/gtkd/gobject/ObjectG.d
    description: "内嵌 unittest 块 ×1（1 条 assert）—— GObject 引用计数包装"
    command: "ldc2 -unittest -main ... ; ./ut_full"

# 上游测试清点汇总（R51）
upstream_test_inventory:
  unittest_blocks: 4
  assertions: 8
  files: 4
  tests_dir: "无（D 语言惯例：unittest 块内嵌源文件）"
  ci_test_config: "无"
  note: >-
    src/ 与 demos/ 中零 unittest 块；无 pytest/ctest 注册；无 CI 测试配置。
    4 处 unittest 块 / 8 条 assert 全部集中在 generated/gtkd 的 glib 与
    gobject 模块。

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_gtkd.py
    description: >-
      消费者测试（11 断言，R34 真实 API）：以 Python 驱动「用 D 编译器编译一个
      真实 D 程序 → 静态链接包内 libgtkd-3.a → **运行**它」。程序经 gtkd 的
      运行期 dlopen 加载器（gtkd.Loader）调用 gtk_get_major_version() 并校验
      返回 3，另验证 gtkd.paths 的 LIBRARY 库表已填充、运行加载器未静默替换
      符号。前 5 条断言校验包载荷（libgtkd-3.a + D 导入源码 gtk/Version.d）
      与工具链环境齐备。
      为什么用 .py 驱动而非 .d 源：CI 门禁 L0c/PF3 只认
      .c/.cpp/.cc/.cxx/.sh/.py（.d 不在白名单），且 D 程序需「编译 → 运行」
      两步、运行期还需 GTK 的 .so 在 LD_LIBRARY_PATH 上。
    command: "python3 test_gtkd.py"

# 测试断言总数（实测：11）
assertion_count: 11

# 上游测试实测结果（R51 如实申报）
upstream_test_note: >-
  上游测试形态为 **4 处内嵌 unittest 块 / 8 条 assert**（D 语言惯例，
  无 tests/ 目录、无 dub testConfiguration、无 CI 测试配置）。
  以 `ldc2 -i -unittest -main` 逐个编译并运行（等价 `dub test`），
  **如实申报：1 块通过（glib/c/types.d，纯 D 计算）、3 块 SIGSEGV**
  （glib/ListG.d、glib/ListSG.d、gobject/ObjectG.d —— 均经 gtkd 的运行期
  dlopen 加载器调 gobject/glib C 函数）。崩溃机制：gtkd 各模块的
  `shared static this()` 在**启动期**急切登记全部绑定符号，dlopen 失败时
  在模块构造阶段抛异常 → 表现为 SIGSEGV；全库合跑的输出明确打印
  `Library load failed (librsvg-2.so.2)` / `(libharfbuzz-gobject.so.0)`
  （ohpcd 的 librsvg 是静态制品，无 librsvg-2.so.2）。
  被调符号本身可解析（ctypes 直查 libgobject-2.0.so.0 的 g_value_init 等
  全部 OK），库本体交付能力另由消费者测试独立证明（11/11，同一加载器
  成功调用 gtk_get_major_version()）。
  `GNUmakefile` 的 `test` 目标不计入：它编译需要显示环境的 GUI demo，
  且该 demo 在 3.11.0 上语法过时（`debug(1)`），已在 manifest 的
  compatibility.issues 如实记录。
  消费者测试（R34 真实 API）：**11/11 passed**。
