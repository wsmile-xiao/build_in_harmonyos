software: gobuster
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.8.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.8.2"

# 编译状态
# published | built | failed | archived
status: built
build_system: go

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/OJ/gobuster/tarball/v3.8.2"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - golang/1.24.3
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go 工具链链接器需要内存映射（mmap）操作，与鸿蒙系统安全机制冲突"
  - "鸿蒙系统未预装 Go 工具链，需要手动安装并签名所有二进制文件"
  - "Go 项目需要修改 go.mod 中的版本要求以匹配安装的 Go 版本"
  - "当前鸿蒙系统无法使用标准 Go 工具链编译 Go 项目"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/gobuster-3.8.2.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/gobuster-3.8.2.work
