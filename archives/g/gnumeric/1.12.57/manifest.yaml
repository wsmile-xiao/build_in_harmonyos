build:
  system: autotools
  configure_options:
    - "--disable-introspection"
    - "--disable-dependency-tracking"
    - "--without-guile"
    - "--without-psiconv"
    - "--without-paradox"
    - "--without-perl"
    - "--without-python"
    - "--without-mono"
    - "--disable-component"
    - "--without-gda"
