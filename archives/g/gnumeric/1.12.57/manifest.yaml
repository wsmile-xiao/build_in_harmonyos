    - "--host=aarch64-linux"
  # 依赖链已统一到新版本（goffice 0.10.57.1 修复配方同款，2026-08-27 发布）：
  #   glib/2.88.0.1 (shared=True, override) — cmd-pkgs GTK 栈同版本族
  #   zlib/1.3.1.1.1.1 (override) — glib shared 依赖
  dependencies:
    - goffice/0.10.57.1
    - cairo-gobject/1.18.4
    - pixman/0.46.4
    - libpng/1.6.58
    - freetype/2.14.3
    - fontconfig/2.18.1.1
    - zlib/1.3.1.1.1.1 (override)
    - expat/2.8.2.1
    - libgsf/1.14.58
    - glib/2.88.0.1 (override, shared)
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.in.patch"
  - "0002-configure.ac.patch"
  - "0003-doc-Makefile.in.patch"

knowledge_gained:
  - "glib/2.88.0.1 (shared=True) 替代 cmd-pkgs glib：CMD_PKGS 移除 glib，依赖链统一到新版本（goffice 0.10.57.1 同款）"
  - "cmd-pkgs glib-genmarshal 是 python3 脚本：构建环境 LD_LIBRARY_PATH 含 GTK_PREFIX/lib/external（libintl.so.8 与 python3.12 不兼容）→ python 加载失败；生成 unset LD_LIBRARY_PATH 的 wrapper 并前置到 PATH（AutotoolsToolchain 默认 PATH 会挤后，需直接改写 conanautotoolstoolchain.sh）"
  - "gnumeric 上游测试体系 = 159 个 perl 测试（test/Makefile.am TESTS），GnumericTest.pm 驱动 ssconvert/sstest 等二进制"
  - "perl XML::Parser（XS）在用户分区需签名调用者：系统 perl 未签名 dlopen 失败；复制 perl 到运行目录并 binary-sign-tool 签名后可用"
  - "OHOS glib 对 g_log(CRITICAL) 调 raise(SIGTRAP)：perl 驱动（签名进程 fork 链）下 SIGTRAP 杀死 ssconvert；LD_PRELOAD 忽略 SIGTRAP 后断言仅打印、流程继续"
  - "cmd-pkgs GTK 栈静态内嵌 glib（构造器丢失）→ 与动态 glib 双重注册冲突；需生成空实现 stub（智能：字体/纸张/类型函数返回假对象，*_get_type 返回 GEnum/GBoxed/GObject）替换闭包库"
  - "gnumeric GSettings 需要 gschemas.compiled：从 schemas/ 的 .in 经 intltool-merge-shim 处理 + glib-compile-schemas 编译，GSETTINGS_SCHEMA_DIR 指向"
  - "插件加载：GNM_TEST_TOP_BUILDDIR 指向运行目录 + plugins/ 源树布局；module_file 无 .so 后缀需创建同名无后缀文件；插件无 NEEDED（符号从全局表解析）→ LD_PRELOAD 全部闭包库"
  - "libgsf 故意 umask(077)+g_mkstemp 生成 0600 输出文件；HMDFS chmod 不生效 + OHOS 沙箱 uid 隔离 → 测试脚本 -r 检查对 0600 文件失败（roundtrip 类测试 27 项平台限制）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/gnumeric-1.12.57.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/gnumeric-1.12.57.work
  patches_count: 3

patch_classification:
