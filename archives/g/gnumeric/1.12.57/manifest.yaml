    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-configure.ac.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-doc-Makefile.in.patch
    type: auto
    platform_only: True
    guard: 'pending'
