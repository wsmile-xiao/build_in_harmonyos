software: grepcidr
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0"

# 构建系统类型（顶层字段，用于快速查询）
build_system: makefile

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-06"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.pc-tools.net/files/unix/grepcidr-2.0.tar.gz"

  # 源码校验和
  sha256: "61886a377dabf98797145c31f6ba95e6837b6786e70c932324b7d6176d50f7fb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 编译参数
  cflags: "-fPIC -O2 -Wall -Werror"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "使用简单 Makefile，无需 configure，直接 make PREFIX=xxx"
  - "支持 DESTDIR 安装到 staging 目录"
  - "版本选项为 -V 而非 --version"
  - "无外部依赖，单文件 C 程序"
