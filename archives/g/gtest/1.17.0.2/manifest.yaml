# 版本级 manifest —— gtest 1.17.0.2
# 遵循 ARCHIVE-SPEC v2.0

version: "1.17.0.2"
software: gtest

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-16"
build_system: cmake

source:
  url: "https://github.com/google/googletest/archive/refs/tags/v1.17.0.tar.gz"
  sha256: "65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c"
  tar_format: tar.gz
  version_note: "上游源码仍为 v1.17.0 tag；.2 为平台配方递增后缀（本 PR 为元数据修复，不改变构建产物）"

build:
  system: cmake
  configure_options:
    - "CMAKE_CXX_STANDARD=17；BUILD_GMOCK=ON；INSTALL_GTEST=ON"
    - "BUILD_SHARED_LIBS 按 Conan shared 选项映射"
    - "gtest_build_tests=ON / gmock_build_tests=ON（上游测试套件随构建产出）"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-tmpdir-ohos-sandbox.patch：gtest-port.cc 的 mkstemp 临时目录改为读取 TMPDIR（OHOS 沙箱 /tmp 只读）"

knowledge_gained:
  - "package_info() 的分量需同时给出 cmake 目标名与 pkg_config_name：下游（pistache）以 pkg-config 探测 gtest_main 时，只有 pkg_config_name 才能让生成的 .pc 分量名可被发现；缺该属性则探测失败"
  - "C++ 测试框架在 OHOS 上的临时文件必须走 TMPDIR（沙箱 /tmp 只读），这是 gtest-port.cc 里 mkstemp 相关路径需要打补丁的直接原因"
