  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "LDFLAGS=-L/storage/Users/currentUser/usr/local/lib -lintl"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libgpg-error/1.55
    - libassuan/3.0.2
    - gettext/0.22
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: autotools 项目需要修改 config.sub 添加 linux-ohos* 模式识别"
  - "E011: HMDFS 文件系统 umask 077 导致临时目录权限问题，需改为 umask 000"
  - "E012: libtool archive (.la) 文件可能包含硬编码路径，需要检查并修正"
  - "E074: 当依赖库使用静态链接 gettext 时，下游项目需要显式添加 -lintl 到 LDFLAGS"
  - "建议: 编译 libgpg-error 时使用动态链接 gettext，避免静态库符号依赖问题"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

