software: gpgme
version: "1.24.0.1"
status: pending_ci
build_system: autotools
created_at: 2026-08-28
dependencies:
  required:
    - libgpg-error/1.55
    - libassuan/3.0.2
    - qtbase/6.11.1.3
  build:
    - pkgconf/3.0.5
  optional:
    - gnupg-runtime
patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0003-configure.patch"
test_results:
  type: conan_create_ohos_aarch64
  upstream: "blocked: upstream make check requires a real GnuPG runtime (gpg/gpgconf/gpgsm/gpg-agent), which is not packaged in ohpcd"
  test_package: "passed: CMake consumer found gpgme/Gpgmepp/QGpgmeQt6/Qt6 Core, linked C/C++/Qt6 bindings, ran CTest 1/1, and directly printed all three 1.24.0 version checks"
  full_reference: "pending: republished as gpgme/1.24.0.1 because gpgme/1.24.0 is already published as C-only"
source_url: https://www.gnupg.org/ftp/gcrypt/gpgme/gpgme-1.24.0.tar.bz2
source_sha256: 61e3a6ad89323fecfaff176bc1728fb8c3312f2faa83424d9d5077ba20f5f7da
knowledge_gained:
  - "gpgme 1.24.0.1 republishes upstream gpgme 1.24.0 with the C library, GpgME++ target Gpgmepp, and Qt6 binding target QGpgmeQt6 for KDE PIM/libkleo consumers."
  - "The upstream tests are not a useful OHOS gate until a matching GnuPG runtime is packaged; the recipe builds only src, lang/cpp/src, and lang/qt/src."
  - "The package must use --enable-languages=cpp,qt6 and force C++17 so the Qt6 binding can compile with the OHOS Qt 6.11 toolchain."
  - "libgpg-error and libassuan package config scripts and .pc/.la files contain non-relocatable absolute paths, so config-overrides supplies corrected gpgrt-config, libassuan-config, gpg-error.pc, and .la files."
  - "qtbase-sql-dbus .pc files need prefix rewriting before gpgme configure can find Qt6Core through pkgconf."
  - "The active shell, compiler paths, and pkgconf executable are resolved from the Conan profile/dependencies instead of hardcoding CI-specific paths."
  - "Upstream CMake config files install /lib and /include paths; the package rewrites relocatable gpgme, Gpgmepp, and QGpgmeQt6 config files under lib/cmake."
  - "CMakeDeps generation is disabled for gpgme itself so consumers use the custom relocatable package config while package_info still records Conan component metadata."
