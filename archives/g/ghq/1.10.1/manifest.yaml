software: ghq
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.10.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.10.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/x-motemen/ghq/archive/refs/tags/v1.10.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: custom

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "GOTOOLCHAIN=local"
    - "GOPROXY=https://goproxy.cn,direct"
    - "go build -ldflags=-s -w"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: go
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go 1.26.0 has corrupted runtime source (unsafeTraceExpWriter redeclared); use Go 1.26.3"
  - "Go linker mmap fails on HMDFS: must build output to hmfs filesystem (/data/storage/el2/base/cache/)"
  - "Go tool binaries (pkg/tool/linux_arm64/) need ELF signing via ohc-run.py sign-elf --batch"
  - "go test generated binaries need ELF signing before execution on HarmonyOS"
