software: ghq
version: "1.9.4"
status: published
build_date: "2026-06-01"
build_system: custom

source:
  url: "https://github.com/x-motemen/ghq/archive/refs/tags/v1.9.4.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  configure_options:
    - "CGO_ENABLED=0"
    - "GOTOOLCHAIN=local"
    - "GOPROXY=https://goproxy.cn,direct"
    - "go build -ldflags=\"-s -w\""
  dependencies: []
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Go linker mmap fails on HMDFS: must build output to hmfs filesystem (/data/storage/el2/base/cache/)"
  - "Go 1.26.0 installation has corrupted runtime source (duplicate declarations); use Go 1.26.2 from tarball"
  - "Go tool binaries (pkg/tool/linux_arm64/) need ELF signing via ohc-run.py sign-elf --batch"
  - "ghq dependency Songmu/gitconfig requires Go >= 1.25.0; cannot downgrade go.mod"
