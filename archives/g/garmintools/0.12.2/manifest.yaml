  url: "https://codeload.github.com/phako/garmintools/tar.gz/refs/tags/0.12.2"
  sha256: "6df711e54232a43d9f3a4d106b2cf96f34a42ebbaaeae52cf11de9e58af544ee"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dpython-module=false"
    - "-Ddefault_library=static"
  dependencies:
    - libusb/1.0.27
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "codeload.github.com 的 /tar.gz/refs/tags/<tag> URL 末段无 .tar.gz 扩展名时，conan get() 会误判为 zip（BadZipFile），必须在 conandata.yml 显式声明 filename: <name>-<ver>.tar.gz"
  - "meson 安装产物若带指向依赖目录的 RUNPATH，conan create 安装到缓存后 RUNPATH 字符串被掩码（X 掩码），导致本设备 musl dlopen 报 Permission denied；消费者/测试应使用静态链接（-Ddefault_library=static）规避运行时动态库加载"
  - "package_type=application 时 cpp_info 默认 includedirs 为空，必须显式声明 self.cpp_info.includedirs = [\"include\"]，否则 CMakeDeps 生成空 INCLUDE_DIRS"

