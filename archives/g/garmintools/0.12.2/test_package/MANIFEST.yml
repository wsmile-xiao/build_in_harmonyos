# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游 garmintools 0.12.2 无测试：meson 构建系统未注册任何 test() 目标，
# 源码树无 tests/ 目录、无 ctest/meson test 清单、无独立测试源文件
# （仅 doc/man 与 extras/ 下的 10-garmin.rules、fore2gmn.pl 辅助脚本，非测试）。

package: garmintools/0.12.2
homepage: "https://github.com/phako/garmintools"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无，如实声明）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，真实调用公开 API)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过 <garmintools/garmin.h> 调用 garmin_lpid/garmin_gpid/garmin_load 公开 API，验证编译、链接、调用与可观察结果"
    command: "./test_garmintools"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
