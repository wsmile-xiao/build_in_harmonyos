# 运行时 sed 修复（不生成 .patch 文件）：
# - config.guess: HarmonyOS|HongMeng → Linux/musl（E160）
# - configure: config.status tmpdir umask 077 剥离（E011，HMDFS SGID）
patches_applied: []

knowledge_gained:
  - "E160: config.guess 2018 不识别 HarmonyOS，运行时 sed 补 UNAME_SYSTEM 分支"
  - "E011: config.status 的 umask 077 mktemp 在 HMDFS 上产生不可写目录（babeltrace DRAFT-6048 同款），需替换 configure 内嵌模板"
  - "SDK lld 依赖 llvm/lib/libxml2.so.16：构建环境 LD_LIBRARY_PATH 注入 SDK llvm/lib（abx 同款）"
  - "conan 缓存中的 glib ELF 工具（glib-compile-resources）需拷贝+重签后才能在构建目录执行；系统 /data/service/hnp/bin 的旧版工具缺 libffi/坏 perl shebang，make 命令行变量覆盖 configure 固化路径"
  - "GTK3 broadway 客户端忽略 DISPLAY，读 BROADWAY_DISPLAY；:tcpN → TCP 127.0.0.1:9090+N（gdkbroadway-server.c）；:N → abstract unix socket broadway{N+1}.socket"
  - "HMDFS 上 AF_UNIX bind 变 abstract socket（@前缀），path connect ENOENT——broadwayd 用 :tcpN 模式规避"
  - "HMDFS chmod(0600) 后 stat 返回 0660（组写位强制）：上游 file-saver permissions 断言需在 el2 分区（真实 POSIX 语义）跑，TMPDIR 重定向即可"
  - "OHOS 无 /usr/share/mime：guess-language 测试需 XDG_DATA_DIRS 注入 freedesktop mime 数据（globs/globs2/subclasses/mime.cache + packages/freedesktop.org.xml）"
  - "harfbuzz（gtk 传递依赖）NEEDED libc++_shared.so：test 运行时 LD_LIBRARY_PATH 加 /system/lib64（glade test 同款）"
  - "gtk_test_init 走 glib TAP；上游 22 测试程序 102 用例全绿"

