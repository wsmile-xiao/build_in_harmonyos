package: gtksourceview3/3.24.11
homepage: "https://wiki.gnome.org/Projects/GtkSourceView"

upstream_check_command: "make -C testsuite check -n"

upstream_test_in_build: true
upstream_test_command: "cd testsuite && ./test-buffer (x22, TAP via g_test framework; BROADWAY_DISPLAY=:tcpN + XDG_DATA_DIRS=<mime-db>)"

upstream_tests:
  - file: testsuite/test-buffer.c
    source: gtksourceview-3.24.11/testsuite/test-buffer.c
    description: "GtkSourceBuffer API tests (case conversion, sort, brackets, context classes)"
    command: "./testsuite/test-buffer"
  - file: testsuite/test-languagemanager.c
    source: gtksourceview-3.24.11/testsuite/test-languagemanager.c
    description: "Language manager: default manager, get_language, guess_language (needs shared-mime-info db)"
    command: "./testsuite/test-languagemanager"
  - file: testsuite/test-search-context.c
    source: gtksourceview-3.24.11/testsuite/test-search-context.c
    description: "Search context: 18 TAP cases covering search/replace semantics"
    command: "./testsuite/test-search-context"
  - file: testsuite/test-view.c
    source: gtksourceview-3.24.11/testsuite/test-view.c
    description: "GtkSourceView move-lines API (needs display: broadway)"
    command: "./testsuite/test-view"

test_package_tests:
  - file: test_gtksourceview.c
    description: "Consumer test: GtkSourceLanguageManager/GtkSourceBuffer/GtkSourceSearchContext/GtkSourceStyleSchemeManager real API calls, no display needed"
    command: "./test_gtksourceview"

assertion_count: 8
