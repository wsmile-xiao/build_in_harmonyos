# 软件级 manifest
# 文件位置: archives/g/gensio/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: gensio

# 显示名
display: "Gensio"

# 一句话描述
description: "通用串流 I/O 库，提供各种 I/O 流的抽象接口"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://github.com/cminyard/gensio"

# 开源许可证（SPDX 标识）
license: GPL-2.0+ AND LGPL-2.1+

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points: []
  # 例如:
  # - "需要运行 autoreconf -fi 生成 configure 脚本"

  # 跨版本通用依赖
  common_dependencies: []
  # 例如:
  # - openssl（可选，用于 SSL 支持）

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.0.2":
    status: published
    build_date: 2026-06-09