# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: grpc/1.84.0
homepage: "https://grpc.io/"

# 上游测试命令（上游用 bazel / tools/run_tests 驱动；本配方只构建库本体）
upstream_check_command: "bazel test //test/...   # 或 tools/run_tests/run_tests.py -l c++"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试规模（实测 grpc-1.84.0 源码树）：
#   - test/**/*_test.cc          : 655 个
#   - test/ 下的源文件（含 .h）  : 1196 个
#   - test/core/**/*.cc          : 735 个
#   - 框架                       : 自带 gtest（third_party/googletest）
#   - 启用条件                   : CMake 侧 gRPC_BUILD_TESTS=ON；默认 OFF
upstream_tests:
  - file: test/core/**
    description: "gRPC 核心测试（channel/transport/resolver/…），每文件一个测试目标"
    command: "bazel test //test/core/..."
    count: 655
    executed: false
    not_run_reason: "本配方 GPRC_BUILD_TESTS=OFF（库交付形态）；上游 CMake 测试目标需要额外构建数百个测试二进制，且上游主推 bazel 驱动，单线程设备上不可行"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_grpc.cpp
    description: "Consumer test: grpc::Version() + 真实 TCP 监听 socket + grpc::CreateChannel 达到 GRPC_CHANNEL_READY + 死端口反例（必须不是 READY）+ 干净回收"
    command: "./test_grpc"
    assertions: 6

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
