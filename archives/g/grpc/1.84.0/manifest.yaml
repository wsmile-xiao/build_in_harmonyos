software: grpc

# 版本号
version: "1.84.0"

# 编译状态
status: built

# 编译日期
build_date: "2026-09-13"

# 构建系统
build_system: cmake

# 源码信息
source:
  url: "https://github.com/grpc/grpc/archive/refs/tags/v1.84.0.tar.gz"
  sha256: "17a4d25717f4871eb71cfdf191f7491f66a59c8ebc782ab53d52fcbfc478959f"
  tar_format: tar.gz

# 构建配置
build:
  system: cmake
  configure_options:
    - "-DCMAKE_CXX_STANDARD=17"
    - "-DCMAKE_CXX_STANDARD_REQUIRED=ON"
    - "-DgRPC_ABSL_PROVIDER=package"
    - "-DgRPC_CARES_PROVIDER=package"
    - "-DgRPC_PROTOBUF_PROVIDER=package"
    - "-DgRPC_RE2_PROVIDER=package"
    - "-DgRPC_SSL_PROVIDER=package"
    - "-DgRPC_ZLIB_PROVIDER=package"
    - "-DgRPC_BUILD_CODEGEN=ON"
    - "-DgRPC_BUILD_TESTS=OFF"
    - "-DgRPC_INSTALL=ON"
    - "-DgRPC_BUILD_GRPCPP_OTEL_PLUGIN=OFF"
    - "-DgRPC_BUILD_GRPC_CSHARP_PLUGIN=OFF"
    - "-DgRPC_BUILD_GRPC_NODE_PLUGIN=OFF"
    - "-DgRPC_BUILD_GRPC_OBJECTIVE_C_PLUGIN=OFF"
    - "-DgRPC_BUILD_GRPC_PHP_PLUGIN=OFF"
    - "-DgRPC_BUILD_GRPC_PYTHON_PLUGIN=OFF"
    - "-DgRPC_BUILD_GRPC_RUBY_PLUGIN=OFF"
    - "-DgRPC_DOWNLOAD_ARCHIVES=OFF"
    - "-DgRPC_USE_SYSTEMD=OFF"
    - "-DProtobuf_DIR=<protobuf pkg>/lib/cmake/protobuf"
    - "-Dutf8_range_DIR=<protobuf pkg>/lib/cmake/utf8_range"
    - "-Dabsl_DIR=<abseil-cpp pkg>/lib/cmake/absl"
    - "-DOPENSSL_ROOT_DIR=<openssl pkg>"
  dependencies:
    - abseil-cpp/20260107.1
    - protobuf/33.6
    - c-ares/1.34.6
    - re2/2024-04-01
    - openssl/3.5.6
    - zlib/1.3.1
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied:
  - "0001-thd-pthread-cancel.patch"
  - "0003-cares-cmake-target.patch"
  - "0004-ssl-cmake-target.patch"
  - "0005-tmpfile-tmpdir.patch"

# 知识沉淀
knowledge_gained:
  - "1.84.0 移除了 gRPC_BUILD_CSHARP_EXT（全树零命中），旧配方里的该 -D 成为无效 no-op"
  - "1.84.0 新增 cmake/systemd.cmake，在 Linux/POSIX 平台会被 include 并探测 systemd；OHOS 无 systemd，应显式 -DgRPC_USE_SYSTEMD=OFF"
  - "1.84.0 新增 gRPC_DOWNLOAD_ARCHIVES（默认 ON），会为空的 third_party 目录执行 file(DOWNLOAD)；显式 OFF 以杜绝 configure 期网络依赖"
  - "abseil 依赖处理方式变更：制品仓 abseil-cpp/20260107.1 以 ABSL_ENABLE_INSTALL=True 构建，包内自带上游 abslConfig.cmake（lib/cmake/absl），可直接提供 absl::check / absl::log_sink 等 59 个按名引用的组件 target；1.70.0 的别名补丁只覆盖 49 个旧组件名且前缀写法有误（absl_check 而非 check），在 1.84.0 下会因找不到 absl::string_view 等 9 个新组件而失败——因此本版本不再使用该补丁，改为设置 absl_DIR"
  - "proto 代码生成仅在 gRPC_BUILD_TESTS=ON（CMakeLists.txt:708）及 tools_c/tools_cxx/plugins 自定义目标内可达；库源码树自带已生成的 .pb.cc，故关闭测试后库构建不需要宿主 protoc"
  - "grpc 上游在 CMAKE_CROSSCOMPILING 下用 find_program 查找 protoc/grpc_cpp_plugin（CMakeLists.txt:595、cmake/protobuf.cmake:72），且全树无 CROSSCOMPILING_EMULATOR 处理——一旦需要 codegen，必须由构建主机提供 x86_64/aarch64-native 的 protoc 与 grpc_cpp_plugin"
  - "absl ABI 必须与 protobuf 一致（均为 lts_20260107 系），否则 grpc/protobuf 混链会 ABI 冲突"
