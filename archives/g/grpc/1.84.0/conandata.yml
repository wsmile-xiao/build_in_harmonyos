patches:
  - patch_file: "patches/0001-thd-pthread-cancel.patch"
    patch_description: "OHOS musl has no pthread_cancel; route Thread::Kill to the no-op stub when GPR_NO_PTHREAD_CANCEL is defined (mirrors the GPR_ANDROID stub)"
    patch_type: "portability"
  - patch_file: "patches/0003-cares-cmake-target.patch"
    patch_description: "CMakeDeps exports c-ares::c-ares while grpc expects c-ares::cares; accept the registry target name"
    patch_type: "portability"
  - patch_file: "patches/0004-ssl-cmake-target.patch"
    patch_description: "CMakeDeps exports openssl::openssl while grpc expects OpenSSL::SSL; accept the registry target name"
    patch_type: "portability"
  - patch_file: "patches/0005-tmpfile-tmpdir.patch"
    patch_description: "gpr_tmpfile honors $TMPDIR (POSIX) so tests can run where /tmp is read-only; falls back to /tmp"
    patch_type: "portability"
