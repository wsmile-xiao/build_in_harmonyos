# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "1.70.0"
software: grpc
# published | built | failed | archived
status: published
build_system: cmake
build_date: "2026-08-27"

source:
  url: "https://github.com/grpc/grpc/archive/refs/tags/v1.70.0.tar.gz"
  sha256: "3c95034f6b23ce7d286e2e7b5f3f4f223720b8bb3f5a9662ff96b7013b2c3c26"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DgRPC_ABSL_PROVIDER=package"
    - "-DgRPC_CARES_PROVIDER=package"
    - "-DgRPC_PROTOBUF_PROVIDER=package"
    - "-DgRPC_RE2_PROVIDER=package"
    - "-DgRPC_SSL_PROVIDER=package"
    - "-DgRPC_ZLIB_PROVIDER=package"
    - "-DgRPC_BUILD_CODEGEN=ON"
    - "-DgRPC_BUILD_TESTS=OFF"
    - "-DgRPC_INSTALL=ON"
    - "-DgRPC_BUILD_GRPC_CPP_PLUGIN=ON"
    - "-DgRPC_BUILD_GRPC_NODE_PLUGIN=OFF"
    - "-DgRPC_BUILD_GRPC_CSHARP_PLUGIN=OFF"
    - "-DgRPC_BUILD_GRPC_OBJECTIVE_C_PLUGIN=OFF"
    - "-DgRPC_BUILD_GRPC_PHP_PLUGIN=OFF"
    - "-DgRPC_BUILD_GRPC_PYTHON_PLUGIN=OFF"
    - "-DgRPC_BUILD_GRPC_RUBY_PLUGIN=OFF"
  dependencies:
    - abseil-cpp/20260107.1
    - protobuf/33.6
    - c-ares/1.34.6
    - re2/2024-04-01
    - openssl/3.5.6
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-thd-pthread-cancel.patch"
  - "0002-abseil-cpp-cmake-alias.patch"
  - "0003-cares-cmake-target.patch"
  - "0004-ssl-cmake-target.patch"

knowledge_gained:
  - "gitee 镜像对 Conan 的 User-Agent 返回 HTML 而非 tarball，conandata 源码 URL 须用 GitHub 官方源"
  - "grpc 源码根目录存在名为 build 的文件（Bazel BUILD），与 cmake_layout 默认 build/ 目录冲突，须用 build_folder 改名为 cmake-build"
  - "protobuf 配方 cmake_find_mode=none，下游需显式设置 Protobuf_DIR/utf8_range_DIR/absl_DIR"
  - "grpc 安装的 gRPCConfig.cmake 不传播 zlib 链接，test_package 需显式 find_package(zlib CONFIG) 并链接 zlib::zlib"
  - "gRPC 1.70.0 的 node 等语言插件在新 absl 下无法编译（GetJSServiceFilename absl::string_view 不匹配），只构建 C++ 插件"
