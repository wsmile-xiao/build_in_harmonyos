# test_package MANIFEST for grpc 1.70.0
# 遵循 L0c/R34：test 必须实质依赖被测包 API（禁止空壳）
software: grpc
version: "1.70.0"

test_sources:
  - test_grpc.cpp

build_system: cmake

test_assertions:
  - "调用 grpc::Version()（运行时符号解析，验证 grpc++ 库链接）"
  - "调用 grpc::CreateChannel + InsecureChannelCredentials（验证 gRPC++ 通道 API）"
  - "构造 grpc::CompletionQueue（验证 gpr 同步层）"
