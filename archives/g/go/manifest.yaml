ohos_adaptation:
  key_points:
    - "Go 使用自举编译，需要已签名的 bootstrap Go 编译器"
    - "Go 生成的二进制格式非标准 ELF，需要先用 strip 处理再 ELF 签名"
    - "编译时设置 CGO_ENABLED=0 实现静态编译"
    - "临时文件目录需要设置为可写路径（TMPDIR=/data/storage/el2/base/cache）"
  common_dependencies: []

