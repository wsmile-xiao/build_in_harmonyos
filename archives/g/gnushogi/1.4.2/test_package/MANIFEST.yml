# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# gnushogi 1.4.2 上游无自动化测试套件：
#   顶层 Makefile.in 与 gnushogi/Makefile 均无 check/TESTS 目标（已逐项核对），
#   故 N_static=0，以真实行为断言的消费者测试补位。

package: gnushogi/1.4.2
homepage: "https://www.gnu.org/software/gnushogi/"

# 上游测试命令：上游无 check/TESTS 目标，留空
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试：无上游测试可集成
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（上游无自动化测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: consumer.c
    description: "消费者测试：运行引擎断言 --version rc=0 且含版本串；stdin 喂 quit 后输出 GNU Shogi 横幅并干净退出（真实行为断言，R34）"
    command: "./consumer"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
