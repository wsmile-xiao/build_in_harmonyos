# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "E011: configure 的 umask 077 临时目录在 HMDFS 上不可写，改为 umask 022"
- "E386: conan spawn 的 shell 继承 HMDFS 冷节点 cwd 后首次 getcwd 必败，老 autoconf 的 ac_pwd inode 校验据此中止；命令内先 cd / 再进入工作目录可恢复；并以命令内 export CONFIG_SHELL=/bin/sh 覆盖 profile [buildenv] 的 hnp bash"
- "clang 15 默认 -fno-common，2014 年代码的暂定定义（DRAW 等）需 -fcommon"
- "上游 gnushogi/Makefile 的 all: 为防呆占位，真实目标在子目录 gnushogi/Makefile 的 gnushogi"
- "E077/E046/E540: 打包 ELF 需 binary-sign-tool 自签（剥 LD_LIBRARY_PATH）；HMDFS 上 chmod 不生效，消费者测试须把引擎拷到 tmpfs 恢复执行位"

