---
test_package: gymnasium
version: "1.3.0"
test_type: explicit
description: |
  Validates the packaged gymnasium 1.3.0 Python package on OHOS aarch64 via
  real API calls (no mocks): package identity (version 1.3.0, imported from
  the conan package), CartPole reset/step loop, SyncVectorEnv, cloudpickle
  round-trip, seeded space sampling, TimeLimit wrapper.
upstream_tests:
  description: |
    Upstream Farama-Foundation/Gymnasium 1.3.0 sdist ships its full pytest
    suite (tests/test_core.py + tests/testing_env.py). It is executed FOR
    REAL in conanfile.py build() on the OHOS aarch64 worker (unmodified,
    zero ignores), with the runtime deps (numpy 1.26.4, cloudpickle,
    farama-notifications, typing-extensions) installed into a private dir
    via `pip --target` and PYTHONNOUSERSITE=1 (worker user-site numpy 2.x is
    unreadable by the worker uid and unsupported by gymnasium):
      tests/test_core.py + tests/testing_env.py collected and run
      unmodified; real pass/fail numbers are printed in the conan build log
      (L1c evidence).
    test_core.py needs only numpy + pytest (verified: no scipy/dill/
    array_api_extra imports). scipy/dill/array_api_extra are optional
    `testing` extras NOT required by the shipped test files, so they are not
    installed and the suite still runs without modification.
  location: "tests/"
  framework: pytest
  executed_in_build: true
  collection_exemptions: []
  # No upstream test file is excluded: gymnasium's sdist only ships
  # tests/test_core.py + tests/testing_env.py, neither of which imports
  # optional extras (unlike gym, which had to exclude 4 extra-dependent
  # files at collection time).
  failure_exemption: |
    Per TEST_QUALITY_SPEC 3.3: any environmental failures (e.g. numpy>=1.24
    deprecation-warning assertions in upstream test code, Py3.12
    pytest.warns(None) removal) are declared here instead of patching
    upstream tests. No upstream test file is modified, no assertion is
    weakened; the suite runs unmodified and the real numbers are printed in
    the conan build log (L1c evidence). Zero are OHOS adaptation regressions.
test_package_tests:
  - file: test_gymnasium.py
    description: |
      6 HarmonyOS-PC-specific checks (real API calls against the conan
      package): identity/version, CartPole core loop, SyncVectorEnv,
      cloudpickle round-trip (parallelism path), seeded space sampling,
      TimeLimit wrapper semantics.
conanfile: conanfile.py
settings: ["os", "arch"]
