# 版本级 manifest — gymnasium 1.3.0
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.3.0"

# 软件名
software: gymnasium

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 PyPI sdist — 含上游 tests/，可真实跑 pytest；
  # sha256 本地实测一致）
  url: "https://files.pythonhosted.org/packages/4d/ff/14b6880d703dfaca204490979d3254ccd280c99550798993319902873658/gymnasium-1.3.0.tar.gz"

  # 源码校验和（sha256，实测一致）
  sha256: "6939e86e835d6b71b6ba6bfd360487420876deafc79bfb7bacba83a7c446bcf3"

  # tarball 格式
  tar_format: tar.gz

# ============================================================
# 构建信息
# ============================================================

build:
  system: custom
  # 配方 build()：
  #   1. python3 -m pytest tests/（上游官方 sdist 自带 tests/test_core.py +
  #      tests/testing_env.py 全量真实执行，L1c；无 scipy/dill 依赖，
  #      零 ignore，未修改任何上游测试文件）
  #   2. 纯 Python 包：gymnasium/ 目录整体复制到 lib/python3.12/site-packages/
  configure_options: []
  dependencies: []
  # 运行时 Python 依赖（worker 基线 aarch64-linux-ohos 轮子，非 Conan 依赖）：
  #   numpy>=1.21, cloudpickle>=1.2.0, typing-extensions>=4.3.0,
  #   farama-notifications>=0.0.1（install_requires）
  #   pytest（测试执行器）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# 零源码修改：gymnasium 1.3.0 为 100% 纯 Python（setuptools，无 C 扩展、
# 无 POSIX-only API），OHOS aarch64 原生可用，无需任何适配改动。
# OHOS 特殊处理全部位于 build() 的运行时依赖/dlopen 兜底链（与 gym 同款）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gymnasium 1.3.0 是 Farama-Foundation/Gymnasium（openai/gym 的继任者），100% 纯 Python setuptools 包，无编译扩展"
  - "与 gym 0.26.2 不同：gymnasium 的 PyPI sdist 自带 tests/（test_core.py + testing_env.py），可直接跑上游 pytest，无需回退 GitHub tag tarball"
  - "gymnasium/__init__.py 顶层 import numpy + farama_notifications，消费方需两者在 PYTHONPATH 上"
  - "已发布 numpy/1.26.4 Conan 二进制面向 os.version 6.0，而本配方默认 profile 为 5.0——用 conan requires 会触发 numpy 源码重编译，故沿用 gym 的私有 pip 安装运行时依赖模式"
