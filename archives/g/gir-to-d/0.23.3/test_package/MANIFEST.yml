# test_package/MANIFEST.yml — gir-to-d 0.23.3
# CI L0e 强制要求此文件存在（上游测试声明文件）
# 详见: docs/TEST_QUALITY_SPEC.md

package: gir-to-d/0.23.3
homepage: "https://github.com/gtkd-developers/gir-to-d"

# ── 上游测试：D 语言惯例是**源码内嵌 `unittest` 块**（不是独立 t/ 目录）──
# 上游确有 **4 个 unittest 块 / 共 12 条 assert**，位于：
#   source/gtd/GirVersion.d:148  → 8 条
#   source/gtd/GirWrapper.d:826  → 2 条
#   source/gtd/GirWrapper.d:883  → 1 条
#   source/gtd/XMLReader.d:436   → 1 条
# 这**就是**上游自己的测试用例，由 D 生态标准的 `dub test` / `-unittest` 驱动。
#
# 但上游**未把它们接入任何构建路径**（三条构建系统逐一核实）：
#   - GNUmakefile：目标只有 girtod / VERSION / clean，无 test 目标
#   - meson.build：无 test() 调用
#   - dub.json：无 configurations、无 -unittest 标志
# 故 upstream_test_in_build=false（未集成进 build()）。
upstream_check_command: "ldc2 -I<ldc>/include/d -I<src> -L-L<ldc>/lib -unittest -main -of=ut <src>/source/gtd/*.d && ./ut"
upstream_test_in_build: false
upstream_test_command: "ldc2 -I<ldc>/include/d -I<src> -L-L<ldc>/lib -unittest -main -of=ut <src>/source/gtd/*.d && ./ut"

upstream_tests:
  - file: source/gtd/GirVersion.d
    source: gir-to-d-0.23.3/source/gtd/GirVersion.d
    description: "内嵌 unittest 块（:148，8 条 assert）：GirVersion 版本比较语义——minor 取值、< > == >= 与字符串字面量比较"
    command: "./ut"

  - file: source/gtd/GirWrapper.d
    source: gir-to-d-0.23.3/source/gtd/GirWrapper.d
    description: "内嵌 unittest 块 2 处（:826 含 2 条 assert、:883 含 1 条 assert）：stringToGtkD 别名替换、removeUnderscore 驼峰转换"
    command: "./ut"

  - file: source/gtd/XMLReader.d
    source: gir-to-d-0.23.3/source/gtd/XMLReader.d
    description: "内嵌 unittest 块（:436，1 条 assert）：XML 实体转义解码（&lt;test&gt; → <test>）"
    command: "./ut"

# ── R51 实测申报（不虚构、不美化）──
# 以 `ldc2 -unittest -main`（等价 dub test）实测 4 个块 / 12 条断言：
#   **10 条通过 + 2 条失败**，2 处失败均为**上游既有缺陷**（与本配方补丁无关）：
#     - GirVersion.d     8/8 PASS
#     - GirWrapper.d:826 1/2 PASS —— 断言 2 失败：stringToGtkD 把参数里的 `string`
#                        按 GlibTypes 表改写成 `string_`，得
#                        "string_ tokenToGtkD(string_ tok, string_[string_] aliases)"，
#                        与断言期望的 "... string tokenToGtkD(string tok, ...)" 不符
#     - GirWrapper.d:883 1/1 PASS
#     - XMLReader.d:436  0/1 PASS —— ByChar.front 对空 data 取 [0]，抛
#                        ArrayIndexError（缺长度保护）
#   与本配方无关的依据：① 失败点位于 GirWrapper/XMLReader，二者均**不引用**本配方
#   改动过的 LinkedHasMap.d（引用它的只有 GirPackage.d / GirStruct.d）；
#   ② 上游 master 同一断言未变（已核对 raw.githubusercontent.com 的 master 版）；
#   ③ 失败稳定复现。
# 因上游未接入构建路径，本配方**不把 unittest 作为门禁**——若把它们计入门禁，
# 上游通过率即为 10/12（2 处既有缺陷阻塞）；这 2 处缺陷已在
# manifest.yaml / notes.md / reports/test-report.md 中如实记录，未隐藏。

# test_package 消费者测试（R34 真实调用：把真实 .gir 喂给打包出的 girtod，
# 校验它确实生成了预期的 D 绑定源码）
test_package_tests:
  - file: test_girtod.py
    description: "消费者测试：以夹具（Test-1.0.gir + GObject-2.0.gir + APILookup.txt）真实调用打包的 girtod，校验 ①--version 精确输出 GIR to D v0.23.3（防 Makefile 回退到 v0.23.1）；②真实 .gir 上无错误输出；③生成 test/Widget.d、test/c/functions.d、test/c/types.d 三文件；④类模块的 module 名、ObjectG 继承、C struct accessor 与 TestWidget* 类型；⑤extern(C) 中 get_type 与构造函数声明、共享库名取自 .gir；⑥c/types.d 的 gobject.c.types 再导出与 opaque struct"
    command: "python3 test_girtod.py <package_folder>"

# 测试断言总数（消费者测试实测 TAP 计划 1..14）
assertion_count: 14
