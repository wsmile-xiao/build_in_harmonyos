    - "https://gh-proxy.com/https://github.com/gtkd-developers/gir-to-d/archive/refs/tags/v0.23.3.tar.gz"
    - "https://github.com/gtkd-developers/gir-to-d/archive/refs/tags/v0.23.3.tar.gz"
  sha256: "bc7e0a19287407ea3c6fcb889b461b03da3c3b832c07f240a3ca93d747cc60eb"

patches:
  - patch_file: "patches/0001-opEquals-const-scope.patch"
    patch_description: >-
      Change LinkedHashMap.opEquals from `inout` to `scope const` in/out
      parameters. LDC 1.42.0 (DMD frontend v2.112.1) rejects the `inout`
      form: when core.internal.newaa instantiates with a const-qualified key,
      the derived `const(inout(Value[Key]))` parameter cannot be converted to
      the demanded `inout(const(Value[Key]))`, failing with
      "cannot implicitly convert expression of type ... to ...".
      The const form is the modern D idiom and keeps opEquals usable for both
      mutable and const receivers.
    patch_type: "portability"
    sha256: "e3d56a9d1007200df56663a81f7636b37106b9f4a9b2df2353f41cc34bdb5172"
