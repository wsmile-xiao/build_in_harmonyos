# Software-level manifest for grilo
name: grilo
display: "Grilo Media Framework"
description: "Framework for multimedia content discovery and browsing"
category: library
license: LGPL-2.1-or-later
homepage: https://gitlab.gnome.org/GNOME/grilo

# Build system
build_system: meson

# Versions
versions:
  - version: "0.3.19"
    status: built
    build_date: "2026-06-16"

# Dependencies (to be filled after successful build)
dependencies:
  required:
    - glib-2.0 >= 2.66
    - libxml-2.0
  optional:
    - libsoup-2.4
    - totem-plparser

# Known issues
known_issues: []
