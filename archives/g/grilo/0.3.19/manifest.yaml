software: grilo
# Version-level manifest for grilo 0.3.19
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.3.19"
status: built
build_date: "2026-06-16"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.gnome.org/sources/grilo/0.3/grilo-0.3.19.tar.xz"
  mirror_url: "https://ftp.gnome.org/pub/gnome/sources/grilo/0.3/grilo-0.3.19.tar.xz"
  sha256: ""
  format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson

  configure_options:
    - "-Denable-grl-net=true"
    - "-Denable-grl-pls=true"
    - "-Dsoup3=false"
    - "-Denable-introspection=false"
    - "-Denable-vala=false"
    - "-Denable-test-ui=false"
    - "-Denable-gtk-doc=false"

  build_parallel: true
  install_destdir: true

  cc: clang
  cxx: clang++

# ============================================================
# 依赖项
# ============================================================

dependencies:
  required:
    - name: glib-2.0
      version: ">= 2.66"
    - name: gio-2.0
      version: ""
    - name: libxml-2.0
      version: ""

  optional:
    - name: libsoup-2.4
      version: ">= 2.41.3"
      feature: network
      enabled: true
    - name: totem-plparser
      version: ">= 3.4.1"
      feature: playlist
      enabled: true

# ============================================================
# 测试信息
# ============================================================

test:
  run_check: true
  check_timeout: 300
  test_results: "3/5 tests passed (media, operations, registry)"
  test_failures: "autoptr, lib-net (environment issue, not software bug)"

# ============================================================
# 预编译包信息
# ============================================================

package:
  name: "grilo-0.3.19-ohos-aarch64.tar.gz"
  size: "13M"
  files: 99

  artifacts:
    - type: library
      path: lib/libgrilo-0.3.so.0.319.1
      size: "12M"
    - type: library
      path: lib/libgrlnet-0.3.so.0.319.0
      size: "110K"
      feature: network
    - type: library
      path: lib/libgrlpls-0.3.so.0.319.0
      size: "99K"
      feature: playlist
    - type: executable
      path: bin/grl-inspect-0.3
    - type: executable
      path: bin/grl-launch-0.3

# ============================================================
# 质量门禁
# ============================================================

quality_gates:
  G0_clean_build: pending
  G1_binary_integrity: pass
  G2_functionality: pass
  G3_portability: pass
  G4_archive_integrity: warn

# ============================================================
# 功能验证
# ============================================================

features:
  - name: network
    enabled: true
    library: libgrlnet-0.3.so
    pkgconfig: grilo-net-0.3.pc
    dependency: libsoup-2.4

  - name: playlist
    enabled: true
    library: libgrlpls-0.3.so
    pkgconfig: grilo-pls-0.3.pc
    dependency: totem-plparser

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Python 环境需要设置完整的 LD_LIBRARY_PATH 包含 Python lib 目录"
  - "PKG_CONFIG_PATH 应包含 lib/pkgconfig 和 share/pkgconfig 两个目录"
  - "meson soup3=false 参数可以强制使用 libsoup-2.4 而不是 libsoup-3.0"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []