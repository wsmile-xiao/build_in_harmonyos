software: graphicsmagick
version: "1.3.47"
status: built
build_date: "2026-05-26"

source:
  url: "https://sourceforge.net/projects/graphicsmagick/files/GraphicsMagick/1.3.47/GraphicsMagick-1.3.47.tar.xz/download"
  sha256: ""
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-PerlMagick-Makefile.PL.patch"
  - "0002-config-config.guess.patch"
  - "0003-config-config.sub.patch"
  - "0004-configure.patch"

knowledge_gained:
  - "graphicsmagick需要bash代替/bin/sh运行configure（toybox sh ECHO检测问题）"
  - "configure中umask 077在HMDFS上导致权限错误"
  - "config.guess和config.sub需要添加HarmonyOS检测分支"
