# 版本级 manifest — gtkmm 4.0.0.1 (r02 harfbuzz 修复版本消费核验)
# 遵循 ARCHIVE-SPEC v3.0
# 4.0.0.1 = 官方 gtkmm-4.0.0.tar.xz + 本仓 OHOS patches（仓库 .1 修复版本惯例）

version: "4.0.0.1"
software: gtkmm
status: built
build_system: meson
build_date: "2026-09-11"

source:
  url: "https://download.gnome.org/sources/gtkmm/4.0/gtkmm-4.0.0.tar.xz"
  sha256: "3105adb76b738e4af5c0be7b1915f8e39de15474fcfdced9f5a59a2d9b52f83e"
  tar_format: tar.xz

build:
  system: meson
  cc: clang
  cxx: clang++
  configure_options:
    - "default_library=shared"
    - "maintainer-mode=false"
    - "build-documentation=false"
    - "build-demos=false"
    - "wrap_mode=nodownload"
  dependencies:
    - "glib2/2.88.0#aa5b8908c41279c288b09b5e22282c0e (override, gtk4 binary 发布修订)"
    - "glib/2.84.0.1.1 (override, shared=True)"
    - "zlib/1.3.1.1 (override)"
    - "fontconfig/2.18.1.1 (override)"
    - "harfbuzz/14.2.0.1.1.2 (override, r02 修复版本消费核验)"
    - "glibmm/2.68.2"
    - "gtk4/4.22.4"
    - "cairomm/1.18.0"
    - "pangomm/2.50.1"
    - "gdk-pixbuf/2.44.6"

patches_applied:
  - "0001-iconpaintable-final-type-typedef-guard.patch"
  - "0002-gate-demos-on-build-demos.patch"
  - "0003-failing-suite-for-display-dependent-tests.patch"

knowledge_gained:
  - "harfbuzz/14.2.0.1.1.2 可在 gtkmm 整图中 override 消费（gtk4 binary 要求 14.2.Z 范围）"
  - "gtkmm 4.0.0.1 测试需 --no-suite=failing 排除 3 个显示依赖测试（同 4.0.0）"