# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: gtkmm/4.0.0
homepage: https://gitlab.gnome.org/GNOME/gtkmm

# ADAPTATION_GUIDE Step 3 / TEST_QUALITY_SPEC §3：上游 meson 套件在 build() 中跑。
# 4.0.0 的 tests/meson.build 构建 15 个测试程序：4 个可执行测试
# （无窗口系统依赖）原生 OHOS/HarmonyOS 包装后
# meson test -C {build_folder} --timeout-multiplier=16 --no-rebuild
# 其余 11 个 GUI 测试程序（依赖 GTK4 显示服务器）构建但不执行。
# ⚠️ 人工执行后用 `meson test -C build --list` 的实际程序列表修正下方 entries
#    （meson-info/intro-tests.json 为最终依据）。
upstream_check_command: "meson test -C build --timeout-multiplier=16 --no-rebuild"
upstream_test_in_build: true
upstream_test_command: "meson test -C build --timeout-multiplier=16 --no-rebuild"

upstream_tests:
  - file: tests/object_move/main.cc
    description: "Glib::Object move 语义（无窗口，meson test 执行）"
    command: "meson test -C build --timeout-multiplier=16 --no-rebuild object_move_test"
  - file: tests/refcount_dialog/main.cc
    description: "refcount 对话框生命周期（无窗口，meson test 执行）"
    command: "meson test -C build --timeout-multiplier=16 --no-rebuild refcount_dialog_test"
  - file: tests/tree_model_iterator/main.cc
    description: "TreeModel iterator（无窗口，meson test 执行）"
    command: "meson test -C build --timeout-multiplier=16 --no-rebuild tree_model_iterator_test"
  - file: tests/wrap_existing/main.cc
    description: "Glib::wrap 既有对象（无窗口，meson test 执行）"
    command: "meson test -C build --timeout-multiplier=16 --no-rebuild wrap_existing_test"
  - file: tests/bitset_iterator/main.cc
    description: "GtkBitset iterator（GUI 程序，构建但不执行，OHOS Broadway 无窗口）"
    command: "(build only)"
  - file: tests/builder/main.cc
    description: "Gtk::Builder（GUI 程序，构建但不执行）"
    command: "(build only)"
  - file: tests/child_widget/main.cc
    description: "child widget 生命周期（GUI 程序，构建但不执行）"
    command: "(build only)"
  - file: tests/child_widget2/main.cc
    description: "child widget2（GUI 程序，构建但不执行）"
    command: "(build only)"
  - file: tests/child_widget_managed/main.cc
    description: "managed child widget（GUI 程序，构建但不执行）"
    command: "(build only)"
  - file: tests/delete_cpp_child/main.cc
    description: "delete C++ child（GUI 程序，构建但不执行）"
    command: "(build only)"
  - file: tests/dialog_deletethis/main.cc
    description: "dialog delete this（GUI 程序，构建但不执行）"
    command: "(build only)"
  - file: tests/gdk_rgba/main.cc
    description: "Gdk::RGBA（GUI 程序，构建但不执行）"
    command: "(build only)"
  - file: tests/main_with_options/main.cc
    description: "main with options（GUI 程序，构建但不执行）"
    command: "(build only)"
  - file: tests/property_notification/main.cc
    description: "property notification（GUI 程序，构建但不执行）"
    command: "(build only)"
  - file: tests/scrolledwindow/main.cc
    description: "scrolled window（GUI 程序，构建但不执行）"
    command: "(build only)"

test_package_tests:
  - file: test.cpp
    description: "头文件包含 + 链接 gtkmm-4.0/gdkmm-4.0 + 原生运行（Gtk::Window/Label/sigc++-3.0 信号连接，7 断言）"
    command: "./test_probe"

assertion_count: 7