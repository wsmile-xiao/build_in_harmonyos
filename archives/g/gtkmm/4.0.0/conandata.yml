# conandata.yml — gtkmm 4.0.0
# 源码 URL（GNOME 官方 release tarball）+ SHA256。
#
# ⚠️ 必须用 download.gnome.org 的 release tarball（meson dist 产物）：
#    release tarball 自带 untracked/（gdkmm/gtkmm 预生成绑定代码与
#    build_scripts），maintainer-mode=false 即可构建（无需 mm-common/gmmproc
#    生成；gmmproc 仍经 glibmm-2.68.pc 的 gmmprocdir 变量定位，见 conanfile）。
#
# sha256 为 GNOME 官方 sha256sum（下载实测一致）：
#   3105adb76b738e4af5c0be7b1915f8e39de15474fcfdced9f5a59a2d9b52f83e  gtkmm-4.0.0.tar.xz
#
# 适配基线：GTK4 4.22.4 采用 Broadway-only（无 X11/Wayland/EGL/Vulkan），
# gtkmm 作为其 C++ 绑定库沿用同一图形配置；epoxy 仅 demos 需要，关闭 demos。

sources:
  url:
    - "https://mirrors.ustc.edu.cn/gnome/sources/gtkmm/4.0/gtkmm-4.0.0.tar.xz"
    - "https://mirrors.tuna.tsinghua.edu.cn/gnome/sources/gtkmm/4.0/gtkmm-4.0.0.tar.xz"
    - "https://mirror.nju.edu.cn/gnome/sources/gtkmm/4.0/gtkmm-4.0.0.tar.xz"
    - "https://download.gnome.org/sources/gtkmm/4.0/gtkmm-4.0.0.tar.xz"
  sha256: "3105adb76b738e4af5c0be7b1915f8e39de15474fcfdced9f5a59a2d9b52f83e"

patches:
  - patch_file: "patches/0001-iconpaintable-final-type-typedef-guard.patch"
  - patch_file: "patches/0002-gate-demos-on-build-demos.patch"
  - patch_file: "patches/0003-failing-suite-for-display-dependent-tests.patch"