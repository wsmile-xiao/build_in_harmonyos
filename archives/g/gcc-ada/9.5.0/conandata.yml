# Source patches are declared here for provenance and applied by conanfile.py
# after the GCC and bundled dependency trees have been unpacked.
patches:
  - patch_file: "patches/0001-musl-ohos-xpm-loader.patch"
    patch_description: "Enable HarmonyOS XPM checks in the build-only musl GNAT seed loader"
    patch_type: "portability"
  - patch_file: "patches/0002-gcc-ada-ohos-build-rules.patch"
    patch_description: "Apply reproducible HarmonyOS compatibility changes to GCC build rules and sources"
    patch_type: "portability"

