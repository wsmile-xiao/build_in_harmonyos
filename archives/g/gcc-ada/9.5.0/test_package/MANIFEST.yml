package: gcc-ada/9.5.0
homepage: "https://gcc.gnu.org/gcc-9/"

upstream_check_command: "test_package default: 30 GNAT DejaGNU + 11 ACATS installed-package subset; full build-tree check-gnat/check-acats evidence is CI #42755 and can be rerun with GCC_ADA_FULL_UPSTREAM_TESTS=1"
upstream_test_in_build: true
upstream_test_command: "Default CI compiles and runs the 30 GNAT DejaGNU + 11 ACATS installed-package subset plus the AdaCGI 1.6 downstream consumer; the complete build-tree GNAT/ACATS suite was already captured by CI #42755"

test_tool_dependencies:
  - "dejagnu/1.6.3.1"
  - "expect/5.45.4"
  - "tcl/8.6.14"

# package() copies the selected GCC inputs from the checksum-verified source
# tree into the installed package. test_package consumes that path instead of
# carrying a second copy of the 46 upstream files.
upstream_test_source_package: "share/gcc-ada/upstream-tests"

upstream_tests:
  - file: share/gcc-ada/upstream-tests/gnat.dg/*
    source: gcc-9.5.0/gcc/testsuite/gnat.dg
    description: "Thirty unmodified executable GNAT regression tests selected from 2034 upstream files, covering modular/fixed-point arithmetic, bounds, access types, aggregates, alignment, arrays and checked overflow"
    command: "gnatmake <dg-options> <source> -o <test> && binary-sign-tool sign ... && <test>"
    selected_count: 30
    upstream_file_count: 2034
  - file: share/gcc-ada/upstream-tests/acats/tests/*/*.ada
    source: gcc-9.5.0/gcc/testsuite/ada/acats
    description: "Eleven unmodified ACATS tests selected from language and runtime chapters; the official REPORT support package is generated from repspec.ada and repbody.ada"
    command: "gnatchop -w <REPORT-source> && gnatchop -c -w <test-source> && gnatmake -gnat95 -I<support> <main.adb> -o <test> && binary-sign-tool sign ... && <test>"
    selected_count: 11
    upstream_file_count: 2595

  - file: upstream/gnat.dg/gcc-ada.exp
    source: "gcc-9.5.0 test_package harness"
    description: "DejaGNU driver that invokes packaged GNATmake for the thirty selected GNAT regression sources"
    command: "runtest --srcdir=<gnat-dg-source> --tool=gcc-ada --build=aarch64-linux-ohos --host=aarch64-linux-ohos"
    selected_count: 30

integration_tests:
  - file: upstream/adacgi/cgi.ad?
    source: "adacgi-1.6.orig.tar.gz (Debian authoritative upstream mirror, SHA-256 6a417f4936a362c1d3d85b8331c26be4ef381ce152cf03c39ac1d5c86fdb884c)"
    description: "Build the real AdaCGI 1.6 library units with packaged GNAT, link them into a CGI consumer, sign the OHOS ELF and execute thirteen functional assertions"
    command: "gnatmake -gnata -O2 -gnat95 -I<adacgi-source> test_adacgi.adb -o test_adacgi && binary-sign-tool sign ... && REQUEST_METHOD=GET QUERY_STRING=... ./test_adacgi"
    selected_count: 1

test_package_tests:
  - file: test_gcc_ada.adb
    description: "Compile, bind, link, sign and run Ada code using generics, exceptions and tasking"
    command: "gnatmake -q -gnata -O2 test_gcc_ada.adb -o gcc_ada_test && ./gcc_ada_test"
  - file: verify_gcc_ada.py
    description: "Run the signed Ada consumer executable and verify its exact success result"
    command: "python3 verify_gcc_ada.py ./gcc_ada_test"
  - file: verify_upstream_ada.py
    description: "Run all 41 signed upstream executables; require zero exit status and the official ACATS PASS marker"
    command: "python3 verify_upstream_ada.py <upstream-build-root>"
  - file: upstream/adacgi/test_adacgi.adb
    description: "Downstream multi-library consumer covering CGI method parsing, duplicate keys, URL encoding/decoding and HTML escaping"
    command: "gnatmake -gnat95 test_adacgi.adb && REQUEST_METHOD=GET QUERY_STRING='name=HarmonyOS&name=Ada%20CGI' ./test_adacgi"
  - file: verify_adacgi.py
    description: "Run the signed AdaCGI executable with deterministic CGI environment input and require the exact success marker"
    command: "python3 verify_adacgi.py <signed-adacgi-consumer>"

consumer_assertion_count: 20
upstream_full_assertion_count: 3542
upstream_installed_subset_count: 41
upstream_assertion_count: 3542
upstream_test_inventory_count: 4315
upstream_test_inventory_note: "Latest review inventory upper bound; the executed full-suite result count remains 3542."
upstream_test_executed_result_count: 3542
