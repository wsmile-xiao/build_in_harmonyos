software: gcc-ada
display: "GCC Ada/GNAT"
description: "GCC 9.5.0 Ada compiler and GNAT toolchain for HarmonyOS AArch64"
category: build-tool
homepage: "https://gcc.gnu.org/gcc-9/"
license: "GPL-3.0-or-later WITH GCC-exception-3.1"
build_system: custom

ohos_adaptation:
  key_points:
    - "Native OHOS/AArch64 build uses a checksum-pinned Alpine GNAT seed only during bootstrap."
    - "Signed XPM loader and native proxies keep the seed executable and relocatable."
    - "The installed driver injects OHOS SDK libunwind.a only for real link invocations."
  common_dependencies:
    - "Alpine Linux 3.12 AArch64/musl GNAT 9.3 build-only seed"
    - "OHOS SDK AArch64 libunwind.a"

versions:
  "9.5.0":
    status: built
    build_date: "2026-09-09"
