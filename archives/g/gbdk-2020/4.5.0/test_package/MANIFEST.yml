# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gbdk-2020/4.5.0
homepage: "https://github.com/gbdk-2020/gbdk-2020"

# 上游测试命令 — gbdk 上游无独立 CI 单元测试套件（examples 需完整
# 主机工具链 + SDCC），构建验证入口为 make native-build
upstream_check_command: "make native-build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-20 实测记录）：
# - 上游无独立测试套件（无 make test / ctest 入口）
# - 构建验证：native-build 编译 gbdk-support（lcc/png2asset 等）+ 
#   gbdk-lib（sm83/z80 两端口目标库，SDCC 编译）——实测通过
# - 消费者验证（test_package）：lcc 驱动 SDCC 工具链编译最小 Game Boy
#   ROM（.gb，32768 字节）——实测通过（R34）
# - 端口限制：mos6502（NES）需 gbdk 补丁版 SDCC 的 __nonbanked 扩展，
#   stock sdcc 4.6.0 拒绝——PORTS 限 sm83+z80（如实记录，非跳过测试）
upstream_tests: []
