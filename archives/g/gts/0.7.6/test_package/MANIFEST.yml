# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gts/0.7.6
homepage: "https://gts.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/boolean/test.sh
    source: gts-0.7.6/test/boolean/test.sh
    description: "布尔集合运算测试 (set/boole/cubes)，90 个用例，含 XFAIL 标记；26 个用例因上游 tarball 不含 gerris/buildings/wcc 大数据文件而无法执行"
    command: "cd test/boolean && ./test.sh"
  - file: test/boolean/set
    source: gts-0.7.6/test/boolean/set.c
    description: "surface 集合运算 (intersection/union/difference) 断言测试"
    command: "./set"
  - file: test/boolean/boole
    source: gts-0.7.6/test/boolean/boole.c
    description: "布尔运算连接性/几何统计断言测试"
    command: "./boole"
  - file: test/delaunay/two_segments.sh
    source: gts-0.7.6/test/delaunay/two_segments.sh
    description: "Delaunay 三角剖分退化用例测试"
    command: "cd test/delaunay && ./two_segments.sh"
  - file: test/coarsen/flat.sh
    source: gts-0.7.6/test/coarsen/flat.sh
    description: "曲面简化 (coarsening) 测试"
    command: "cd test/coarsen && ./flat.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libgts 并验证 GTS 版本宏可编译"
    command: "./test_gts"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 120
