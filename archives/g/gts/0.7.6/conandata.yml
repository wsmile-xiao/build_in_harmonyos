    - "https://deb.debian.org/debian/pool/main/g/gts/gts_0.7.6+darcs121130.orig.tar.gz"
    - "http://deb.debian.org/debian/pool/main/g/gts/gts_0.7.6+darcs121130.orig.tar.gz"
  sha256: "c23f72ab74bbf65599f8c0b599d6336fabe1ec2a09c19b70544eeefdc069b73b"

patches:
