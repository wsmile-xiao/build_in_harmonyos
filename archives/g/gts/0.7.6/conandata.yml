# conandata.yml — gts 0.7.6
# 源码：Debian 官方源（deb.debian.org pool）托管的 gts 上游 orig 包（gts_0.7.6+darcs121130.orig.tar.gz），
# 内容为 GNU gts 0.7.6 官方上游源码（顶层目录 gts-snapshot-121130，configure.ac 声明 0.7.6）。
# 说明：download.gnome.org 在本构建网络不可达（connection reset），且主流 gnome 镜像不含 gts；
# deb.debian.org 为 Debian 官方归档镜像，符合 R39「官方正式源或权威镜像源」。
# 注意：该 orig 包自带 debian/ 目录，configure 引用 debian/Makefile 可正常生成。

sources:
