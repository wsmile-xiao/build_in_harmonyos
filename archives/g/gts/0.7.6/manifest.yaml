# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "E007: config.guess/config.sub 需识别 HarmonyOS —— config.guess 加 aarch64:HarmonyOS 分支输出 aarch64-unknown-linux-ohos，config.sub 加 aarch64 机器与 linux-ohos 操作系统（旧版 2009 autotools 无 aarch64 需一并补）"
- "gts 0.7.6 自带 2009 年版 libtool：CONFIG_SHELL/SHELL 用 bash 时生成的 libtool 中 archive_cmds/old_archive_cmds 等命令变量 `$` 未转义（链接时 llvm-ar cru 展开为空），且 bash 无 `print` 内建（ECHO=print -r -- 报 command not found）；配方 generate() 需 self.buildenv.define 覆盖为 /bin/sh"
- "config.status 的 mktemp+umask 077 临时目录在 HMDFS 受限环境不可写（E112/E114），configure 需 patch 为普通 mkdir"
- "out-of-tree 构建下，Makefile.in 中代码生成器（predicates_init）编译产物需放构建目录、源码引用用 $(srcdir)，否则 ./predicates_init 找不到二进制"

