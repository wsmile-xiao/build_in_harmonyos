# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gzip-hpp/0.1.0
homepage: "https://github.com/mapbox/gzip-hpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake ../ -DCMAKE_BUILD_TYPE=Release && cmake --build . && ./unit-tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# gzip-hpp 上游测试为 Catch 1.x 用例 (test/main.cpp + test/test_io.cpp + test/test_version.cpp),
# 由 CMakeLists.txt 构建为 unit-tests 可执行文件; 本机以 catch2/2.13.10 + zlib 适配后实际运行。
upstream_tests:
  - file: test/main.cpp
    source: gzip-hpp-0.1.0/test/main.cpp
    description: "Catch 测试入口 (CATCH_CONFIG_MAIN, 框架定义, 非独立用例)"
    command: "./unit-tests"
  - file: test/test_io.cpp
    source: gzip-hpp-0.1.0/test/test_io.cpp
    description: "compress/decompress 往返、gzip magic、大小限制等 8 个 TEST_CASE (2 个仅 DEBUG)"
    command: "./unit-tests"
  - file: test/test_version.cpp
    source: gzip-hpp-0.1.0/test/test_version.cpp
    description: "版本宏 GZIP_VERSION_STRING==1.0.0 (1 个 TEST_CASE)"
    command: "./unit-tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_gzip_hpp.cpp
    description: "消费者验证: 公开头文件 + zlib 链接 + compress/decompress/is_compressed/Decompressor 往返"
    command: "./test_gzip_hpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
