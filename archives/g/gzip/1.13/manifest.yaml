# gzip 编译档案
software: gzip
version: 1.13
status: success
build_system: autotools
compile_date: 2026-04-12

# 依赖信息
dependencies:
  required: []
  optional: []

# 编译配置
build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - --prefix=$TEST_PREFIX
    - CC=clang
    - CFLAGS=-fPIC -O2

# 补丁信息
patches_applied:
  - 0001-build-aux-config.guess.patch
  - 0002-build-aux-config.sub.patch

# 兼容性评估
compatibility:
  level: high
  issues:
    - "shell脚本因shebang限制无法直接执行，需通过 sh 调用"
  notes: "核心压缩解压功能正常，gzip二进制完全可用"

# 测试结果
test_results:
  type: manual
  passed: 5
  failed: 0
  note: "gzip压缩/解压、gunzip、zcat、管道模式测试全部通过"

# 知识沉淀
knowledge_gained:
  - "gzip 1.13 需要 E007 config.guess/config.sub 补丁"
  - "config.sub 需要在 linux-gnu* 行加入 linux-ohos*"
  - "使用 clang 编译器，无需额外补丁"
  - "ohos-linux 三元组需要正确处理（ohos-linux → linux-ohos）"
  - "shell脚本shebang执行受限，需sh直接调用"

# 参考
references:
  - https://www.gnu.org/software/gzip/
