# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "E011: configure 的 umask 077 临时目录在 HMDFS 上不可写，改为 umask 022"
- "E386: conan spawn 的 shell 继承 HMDFS 冷节点 cwd 后首次 getcwd 必败，老 autoconf 的 ac_pwd inode 校验据此中止；命令内先 cd / 再进入工作目录可恢复；并以命令内 export CONFIG_SHELL=/bin/sh 覆盖 profile [buildenv] 的 hnp bash"
- "profile cppstd=17 使预生成 lex.Slip.cc 的 register 存储类硬报错；环境 CXXFLAGS 末尾追加 -std=gnu++11（与上游 AM_CXXFLAGS 一致）即可"
- "libc++ 下 stringstream 不能直接流入 ofstream，需显式 .str()（上游测试驱动 2 处）"

