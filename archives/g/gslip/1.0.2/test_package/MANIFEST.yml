# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# gslip 1.0.2 上游自带 TAP 测试套件（src/test，SlipTest），
# 已在 conanfile.py build() 内以 `make check` 真实执行。

package: gslip/1.0.2
homepage: "https://www.gnu.org/software/gslip/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test/SlipTest.cc
    source: gslip-1.0.2/src/test/SlipTest.cc（tests[] 数组 20 个测试函数 + 完成断言点，TAP 计划 1..21）
    description: "SLIP 库全量 TAP 套件：分配/Datum/队列/栈/头操作/空间/内建/分裂/移动/替换/双链表/Reader/Sequencer/Operators/IO/Errors"
    command: "make check（tap-driver.sh 驱动 SlipTest）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: consumer.cpp
    description: "消费者测试：slipInit 初始化后分配 SlipDatum((LONG)0x15)，经 operator LONG() 读回并断言值一致（编译+链接 libgslip.a+运行）"
    command: "./gslip_consumer"

# 测试断言总数 (近似值, 用于质量评估)：上游 TAP 测试点 21 + 消费者断言 3
assertion_count: 24
