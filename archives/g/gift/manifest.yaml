# 软件级 manifest — gift（遵循 ARCHIVE-SPEC v2.0）
software: gift
display: "GNU Gift"
description: "GNU Image Finding Tool — 开源基于内容的图像检索系统（MRML 协议 C++ 服务端 + 9 个共享库 + 24 个 Perl 客户端脚本）"
category: image
homepage: "https://www.gnu.org/software/gift/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "2002 年 autotools 2.13/libtool 1.4：补丁修复 HMDFS tmpdir 权限、toybox sed 缓冲上限、C++17/libc++ 迁移等 30 余文件"
    - "依赖 expat（XML 解析）与 libuuid（MRML 会话 ID）；依赖均已发布 conan 包"
    - "libGIFTQuPerl/libGIFTAcPerl 引用 perl 解释器符号：库不链 libperl，由嵌入 perl 的最终二进制 -Wl,-E 导出；test_package 探针以同名桩符号满足 BIND_NOW 重定位"
    - "test_package 采用链接期探针（exe NEEDED 全部 9 库同加载组）+ createErrorMessage 实调验证，musl 下 dlopen 探针对含 libc++ 符号的库不可行"

versions:
  "0.1.9":
    packaging: conan
    status: built
    build_date: "2026-09-25"
    notes: >-
      首个 conan 配方。autotools in-source 构建，自定义 gift-regen-config-files.sh
      确定性替代 config.status 再生成（HMDFS 兼容）。补丁含 config.guess 的
      __OHOS__ libc 探针（musl 判定，文档化例外）。
      真机 conan create 通过；test_package 链接期探针 exec 加载全部 9 库并
      真实调用 libMRML createErrorMessage API 验证往返。
