patches:
  "0.1.9":
    - patch_file: "patches/0001-ohos-build-scripts.patch"
      patch_type: "portability"
      description: "config.guess/sub 识别 aarch64-linux-ohos；configure mktemp→mkdir（HMDFS 0700 setgid tmpdir 拒写）；sed 缓冲上限 100000 行并改为文件交接（toybox sed 管道写后读损坏）；gift-check-perl-config.pl 兼容 perl 5.42"
    - patch_file: "patches/0002-cxx-compiler-fixes.patch"
      patch_type: "portability"
      description: "C++ 兼容修复（clang 15/libc++/C++17）：in-class 限定、this->、显式 (bool) 流转换、make_pair 模板参数、cassert、::bind、perl.h 宏 undef、size_type 等 30 个文件"
    - patch_file: "patches/0003-sed-ascii-delimiter.patch"
      patch_type: "portability"
      description: "scripts/perl/Makefile.am、scripts/perl/Makefile.in（预生成）、libMRML/cc/Makefile.am、libMRML/cc/Makefile.in（预生成）中生成 gift-url-to-fts.pl 与 libMRML-config.cc 的 sed 表达式改用 ASCII '|' 分隔符（原文件为 Latin-1 编码的 '§' 0xA7——替换值含 ':' 等不便用 ':'，故补丁用 '|'），消除构建日志中的非法 UTF-8 字节"
