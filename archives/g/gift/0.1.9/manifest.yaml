# 版本级 manifest — gift 0.1.9
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.1.9"
software: "gift"
status: built
build_date: "2026-09-25"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.gnu.org/gnu/gift/gift-0.1.9.tar.gz"
  sha256: "29b6e3324af09b15e22d8933195e3570e71e27abc0007214396eb8f6d9afbf7c"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--host=aarch64-unknown-linux-ohos"
    - "CPPFLAGS=-I<expat>/include -I<libuuid>/include"
    - "LDFLAGS=-L<expat>/lib -L<libuuid>/lib"
  dependencies:
    - "expat/2.8.4"
    - "libuuid/2.42.2"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-ohos-build-scripts.patch"
  - "0002-cxx-compiler-fixes.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "2002 年 autotools 2.13：configure 的 mktemp -d 在 HMDFS setgid tmpdir 上 0700 拒写，需改为 mkdir 生成式"
  - "configure 用 sed 管道把变量交接给 config.status，Makefile 变量数超过 toybox sed 缓冲上限导致写后读损坏；补丁将 ac_max_sed_lines 提到 100000 并改为文件交接"
  - "上游 libtool 1.4 链接 shared 库时丢弃 C++ 运行时与非直接依赖（-nostdlib 老套路），最终二进制链接时补齐（glibc 下传递解析正常，musl 需闭包完整）"
  - "libGIFTQuPerl/libGIFTAcPerl 引用 perl 解释器符号（perl_alloc/perl_parse/Perl_*/PL_*/boot_DynaLoader）：由最终二进制 -Wl,-E(--export-dynamic) 导出，库本身不链 libperl（静态库非 PIC 不能进 -shared）"
  - "【勘误】鸿蒙 musl 加载器对 shell 直接 spawn 的进程支持 LD_LIBRARY_PATH（conanrun 环境实测有效，探针 NEEDED 解析成功）；gift 服务器 exec 失败的真因是 DF_BIND_NOW 下 perl_* 符号无提供者导致 exec 期重定位失败，而非 LDP 失效"
  - "【勘误】OHOS musl dlopen 探针对 UND 含 libc++ 符号的库不可行：即使先 RTLD_GLOBAL dlopen libc++_shared.so，其符号也不进入后续 dlopen 的重定位作用域（dlsym 能找到但重定位解析不到）；改用链接期探针（exe NEEDED 全部 9 库同加载组）可完整 exec 重定位"
  - "lld 自动导出被所链共享库 UND 引用的本可执行文件符号（进 .dynsym）：perl 档符号 25 个 + CAFPerl 构造桩写入探针源码即可满足 BIND_NOW，无需 -rdynamic"
  - "真机链接期探针验证：9 库 exec 加载 + createErrorMessage 实调往返全部通过（test_package/test_probe.cc）"
  - "C++17/libc++ 迁移：in-class 限定、this->、显式 (bool) 流转换、make_pair 显式模板参数、cassert、::bind、perl.h 宏冲突 undef 等 30 文件修复"
