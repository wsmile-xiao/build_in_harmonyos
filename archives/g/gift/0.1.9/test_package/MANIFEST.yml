# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gift/0.1.9
homepage: "https://www.gnu.org/software/gift/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# 上游无测试套件证据 (R51)：
# gift-0.1.9.tar.gz 内无 tests/ 目录；顶层及各子目录 Makefile.am 均无
# check/TESTS/check_PROGRAMS 目标（仅 configure 的 pthread/perl 编译
# 探针源文件 pthread-compile-test-program.cc、perl-compile-test-program.cc，
# 与测试套件无关）。GNU gift 项目未随源码发布任何测试套件。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_probe.cc
    description: >-
      运行时探针：可执行文件 NEEDED 链接包内全部 9 个共享库，exec 时
      musl 加载器对同加载组完成 BIND_NOW 全量重定位（任一库缺失/重定位
      失败即启动失败）；随后真实调用 libMRML 公开 API
      createErrorMessage()，断言返回非空 XML 元素并完整析构。
      附带 25 个 perl 解释器桩符号（仅参与符号解析）与 CAFPerl 构造桩
      （打破 MRML↔AcPerl 加载环）。
    command: "./test_probe"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
