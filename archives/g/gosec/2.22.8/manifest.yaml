software: gosec
build_system: go
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.22.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.22.8"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/securego/gosec/archive/refs/tags/v2.22.8.tar.gz"

  # 源码校验和
  sha256: "e056ace29f030010ca36a5a965b0e05b8a890bee088302fe034612d4e560c4f0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | go | custom
  system: go

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "GO111MODULE=on"
    - "go build -ldflags=\"-w -s -X 'main.Version=v2.22.8' -X 'main.GitTag=v2.22.8' -X 'main.BuildDate=2026-06-16'\" -o gosec ./cmd/gosec/"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "go/1.26.4"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "gosec 是 Go 项目，使用 go build 编译，不使用 configure/make 传统流程"
  - "CGO_ENABLED=0 静态构建，CGo 文件分析测试会失败（正常，不影响核心功能）"
  - "Go 项目在 OpenHarmony 上可直接编译，无需修改 config.guess/config.sub"
