software: gawk
display: "GNU Awk"
description: "GNU implementation of the AWK text processing language"
category: system
homepage: "https://www.gnu.org/software/gawk/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要修改 config.guess 和 config.sub 添加 HarmonyOS 检测"
    - "HarmonyOS 对管道/终端/套接字的 fstat() 返回 EACCES，需要条件编译处理"
    - "扩展模块中 _BSD_SOURCE 需改为 _GNU_SOURCE"
    - "pma.h 包含路径需修正为 support/pma.h"
  common_dependencies: []

versions:
  "5.3.0":
    status: published
    build_date: "2026-04-09"
