version: "5.3.0"
status: published
build_date: "2026-04-09"

source:
  url: "https://ftp.gnu.org/gnu/gawk/gawk-5.3.0.tar.xz"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--prefix=$HOME/usr/local"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-port-for-ohos.patch"

knowledge_gained:
  - "HarmonyOS 对管道/终端/套接字的 fstat() 返回 EACCES，需 __OHOS__ 条件编译"
  - "扩展模块中 _BSD_SOURCE 需改为 _GNU_SOURCE"
  - "pma.h 包含路径需修正为 support/pma.h"
