software: geeqie
# 软件级 manifest 模板
# 文件位置: archives/g/geeqie/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件描述
description: "Geeqie is a lightweight GTK3 image viewer"

# 主页
homepage: "https://www.geeqie.org/"

# 许可证
license: GPL-2.0

# 类别（用于依赖排序）
# library | tool | utility | development | system
category: utility

# ============================================================
# 版本索引（软件级）
# ============================================================

# 已编译版本列表（按日期排序，最新在前）
versions:
  - version: "2.7"
    status: built
    build_date: "2026-05-25"
    build_system: meson
    configure_options:
      - "-Dexecinfo=disabled"
      - "-Dgit=disabled"
      - "-Dpandoc=disabled"
      - "-Dyelp-build=disabled"
      - "-Dunit_tests=disabled"
      - "-Dgps-map=disabled"
      - "-Dheif=disabled"
      - "-Dexr=disabled"
      - "-Dfits=disabled"
      - "-Ddjvu=disabled"
      - "-Djpegxl=disabled"
      - "-Dlibraw=disabled"
      - "-Dlua=disabled"
      - "-Dspell=disabled"
      - "-Dpdf=disabled"
      - "-Dvideothumbnailer=disabled"
      - "-Dwebp=disabled"
      - "-Darchive=disabled"
      - "-Dnpy=disabled"
      - "-Dcms=disabled"
      - "-Dexiv2=disabled"
      - "-Dgtk4=disabled"
      - "-Ddoxygen=disabled"

# ============================================================
# 依赖关系（软件级）
# ============================================================

# 编译依赖（格式: software/version）
build_dependencies:
  - "gtk3/3.24.49"
  - "cairo/1.18.4"

# 运行依赖（格式: software/version）
runtime_dependencies:
  - "gtk3/3.24.49"
  - "cairo/1.18.4"

# ============================================================
# 知识索引（软件级）
# ============================================================

# 相关知识图谱条目
knowledge_links: []

# ============================================================
# 元数据
# ============================================================

# 首次编译日期
first_compile: "2026-05-25"

# 最后更新日期
last_updated: "2026-05-25"