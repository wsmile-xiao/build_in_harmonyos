software: geeqie
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.7"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/BestImageViewer/geeqie/releases/download/v2.7/geeqie-2.7.tar.xz"
  sha256: ""
  tar_format: tar.xz

build:
  build_system: meson
  configure_options:
    - "-Dexecinfo=disabled"
    - "-Dgit=disabled"
    - "-Dpandoc=disabled"
    - "-Dyelp-build=disabled"
    - "-Dunit_tests=disabled"
    - "-Dgps-map=disabled"
    - "-Dheif=disabled"
    - "-Dexr=disabled"
    - "-Dfits=disabled"
    - "-Ddjvu=disabled"
    - "-Djpegxl=disabled"
    - "-Dlibraw=disabled"
    - "-Dlua=disabled"
    - "-Dspell=disabled"
    - "-Dpdf=disabled"
    - "-Dvideothumbnailer=disabled"
    - "-Dwebp=disabled"
    - "-Darchive=disabled"
    - "-Dnpy=disabled"
    - "-Dcms=disabled"
    - "-Dexiv2=disabled"
    - "-Dgtk4=disabled"
    - "-Ddoxygen=disabled"
  dependencies:
    - "gtk3/3.24.49"
    - "cairo/1.18.4"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
