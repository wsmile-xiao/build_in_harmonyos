# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI 强制要求) — 台账以实际运行结果为准（r03 证据闭环）
package: ghc-filesystem/1.5.14
homepage: https://github.com/gulrak/filesystem

# 上游使用 Catch2（bundled test/catch.hpp），CMake 生成 filesystem_test / multifile_test / fwd_impl_test / exception
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false

# 上游 Catch2 测试 — 逐入口台账（r03 实测）
upstream_tests:
  - file: test/filesystem_test.cpp
    source: filesystem-1.5.14/test/filesystem_test.cpp
    description: "ghc::filesystem API 行为测试（Catch2 主套件，70 cases/937 assertions）"
    command: "clang++ -std=c++17 -I include -I test test/filesystem_test.cpp -o filesystem_test && ./filesystem_test"
    result: "70 cases / 58 passed / 12 failed（失败均为平台限制：无 root、tmpfs/hmfs 不支持 hard link/mkfifo/chmod 生效，见 notes.md 台账）"
  - file: test/exception.cpp
    source: filesystem-1.5.14/test/exception.cpp
    description: "无异常模式（-fno-exceptions）编译+运行 smoke 测试"
    command: "clang++ -std=c++17 -fno-exceptions -I include test/exception.cpp -o exception_test && ./exception_test"
    result: "编译 exit 0；运行 exit 0（无断言输出）"
  - file: test/multi1.cpp
    source: filesystem-1.5.14/test/multi1.cpp
    description: "多翻译单元编译测试（multi1.cpp + multi2.cpp），2 cases / 8 assertions"
    command: "clang++ -std=c++17 -I include -I test test/multi1.cpp test/multi2.cpp -o multifile_test && ./multifile_test"
    result: "exit 0，All tests passed (8 assertions in 2 test cases)"
  - file: test/fwd_test.cpp
    source: filesystem-1.5.14/test/fwd_test.cpp
    description: "fwd/impl 两段式使用测试（fwd_test.cpp + impl_test.cpp，复用 filesystem_test 全套 70 cases）"
    command: "clang++ -std=c++17 -I include -I test test/fwd_test.cpp test/impl_test.cpp -o fwd_impl_test && ./fwd_impl_test"
    result: "exit 18，70 cases / 58 passed / 12 failed（失败与 filesystem_test 相同平台限制）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ghc_filesystem.cpp
    description: "path 构造/目录创建/目录遍历/绝对路径判断 4 项真实 API 断言"
    command: "ctest --output-on-failure -R test_package"
    result: "conan create 内 test_package 构建+运行 PASS（PASS: ghc::filesystem header-only API OK）"

# 测试断言总数 (test_package 4 项；上游 937 assertions)
assertion_count: 941