package: gcc-12-cross/12.4.0
homepage: "https://gcc.gnu.org/gcc-12/"

upstream_check_command: "make -C gcc selftest"
upstream_test_in_build: true
upstream_test_command: "make -C gcc selftest && build-time gcc.c-torture/execute 全量枚举与运行（1725 独立用户用例源 × -O0/-O2 = 3450 执行，3414 通过；失败均为上游 effective-target 门控或 OHOS 平台限制，详见 reports/test-report.md）；release 构建 cc1 关闭自测（checking off），selftest target 仍运行且退出 0"

upstream_tests:
  - file: gcc/selftest-run-tests.cc
    source: gcc-12.4.0/gcc/selftest-run-tests.cc
    description: "GCC language-independent internal selftests"
    command: "make -C gcc selftest"
  - file: gcc/c/c-parser.cc
    source: gcc-12.4.0/gcc/c/c-parser.cc
    description: "C frontend parser selftests run through -fself-test"
    command: "make -C gcc selftest"
  - file: gcc/testsuite/gcc.c-torture/execute/20000112-1.c
    source: gcc-12.4.0/gcc/testsuite/gcc.c-torture/execute/20000112-1.c
    description: "Upstream execution torture tests：1725 个独立用户用例源全量枚举，每个以 -O0 与 -O2 编译并执行（3450 次执行，3414 通过 / 98.96%）；失败条目为 x86 专属汇编(990413-2)、DFP 目标不支持(pr80692)、trampolines 需要可执行栈而 OHOS 禁止(nestfunc*/20000822-1 等)、OHOS 只读文件系统 fileio/unwrapped 门控(fprintf-2/printf-2/user-printf)、builtins harness(abs-1)——均在 upstream DejaGNU 中由 dg-require-effective-target/dg-skip-if 门控或属平台限制，非当前库配方可修；ieee 子集按 .x 协议(-fno-inline -fno-trapping-math)全部通过"
    command: "build() torture-execute 全量枚举（xgcc-sign 包装，-fPIC -pie，含 dg-options/builtins 三文件协议/x86 检测）"

test_package_tests:
  - file: test_gcc.c
    description: "消费者用例（R34/L0c）：用打包的 GCC 编译、链接并实际执行一个真实 AArch64 C 程序，验证 __OHOS__ 平台宏、64 位指针与 stdio 运行时（实测输出 gcc9-ohos-ok，RC=0）"
    command: "gcc -O2 -DEXPECT_OHOS=1 test_gcc.c -o gcc_test_program && ./gcc_test_program"
  - file: test_ohos.c
    description: "HarmonyOS 专项测试：用打包的 GCC 编译并实际运行，验证 aarch64-linux-ohos 目标的 __OHOS__/__aarch64__ 平台宏、LP64 ABI 与 uname 系统调用面（实测输出 ohos-uname:HarmonyOS/HongMeng Kernel 1.12.0 musl:0 gcc12-ok，RC=0）"
    command: "gcc -O2 -DEXPECT_OHOS=1 test_ohos.c -o gcc_ohos_test && ./gcc_ohos_test"

assertion_count: 7