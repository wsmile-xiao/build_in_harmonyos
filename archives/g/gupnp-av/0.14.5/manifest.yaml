software: gupnp-av
version: "0.14.5"
status: published
build_date: "2026-09-03"
build_system: meson
conan_ref: "gupnp-av/0.14.5@ohpcd/stable"

source:
  url: "https://download.gnome.org/sources/gupnp-av/0.14/gupnp-av-0.14.5.tar.xz"
  sha256: "93918fcf5af529fda5b3d2d9fc3b77cd93df88064939b82f249f5577d8de1c02"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "default_library=static"
    - "wrap_mode=nodownload"
    - "introspection=false"
    - "vapi=false"
    - "gtk_doc=false"
  cc: clang
  cxx: clang++

patches_applied: []

dependencies:
  - "glib2/2.88.0"
  - "libxml2/2.15.3.1"

test_results:
  validation_round: 1
  upstream_meson_test_discovered: 8
  upstream_meson_test_passed: 8
  upstream_meson_test_failed: 0
  upstream_meson_test_skipped: 0
  upstream_gtest_subtests: 19
  consumer_assertions_passed: 3
  test_environment:
    xsd_datadir: "GUPNP_AV_DATADIR=<pkg>/share/gupnp-av (runenv_info 注入)"

knowledge_gained:
  - "gupnp-av 0.14.5 上游 meson.build 实测只依赖 gobject-2.0/glib-2.0 (>=2.58) + libxml-2.0；不依赖 gupnp/gssdp（名字带 gupnp 仅生态归属，本体是 DIDL-Lite XML 解析库）。 (knowledge_ref: DRAFT-E545/E546 前置事实)"
  - "glib2/2.88.0 的 PkgConfigDeps 直接产出 glib-2.0.pc/gobject-2.0.pc/gio-2.0.pc（Version 2.88.0），无需 graphene 1.10.8 时代的 gobject-2.0.pc 转发 hack。 (knowledge_ref: 无需独立条目，glib2 配方已覆盖)"
  - "gnome.genmarshal 需要 glib-genmarshal：glib2 包内 bin/glib-genmarshal 是 python3 脚本（构建机可直接运行），把 glib-2.0.pc 的 glib_genmarshal 变量改写为包内绝对路径即可（atk 2.38.0.1.1 同款 _augment_glib_pkg_config 处理）。 (knowledge_ref: atk/2.38.0.1.1 先例)"
  - "meson setup 报 Could not detect Ninja：OHOS 子进程链路下 ninja 因 LD_LIBRARY_PATH 缺 libc++_shared 加载失败（rc=127 被静默跳过）+ 裸名 PATH 解析不可靠；配方注入 NINJA 绝对路径 + LD_LIBRARY_PATH 前缀 /system/lib64 解决。 (knowledge_ref: DRAFT-E545)"
  - "gupnp-av 的 XSD 运行时寻址：GUPNP_AV_DATADIR 须指向包内 share/gupnp-av（DATADIR 宏是编译期 prefix=/share/gupnp-av），配方用 runenv_info.define_path 自动注入。 (knowledge_ref: DRAFT-E546)"
