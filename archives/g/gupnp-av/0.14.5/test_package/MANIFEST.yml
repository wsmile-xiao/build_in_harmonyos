# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）
#
# gupnp-av 0.14.5 上游测试为 meson test（TAP 输出），测试目标位于
# tests/（check-search、check-feature-list-parser、fragments）与
# tests/gtest/（test-regression、test-didl-lite-object、
# test-media-collection、test-last-change-parser、
# test-cds-last-change-parser）。上游测试在配方 build() 的
# meson.test() 中真机运行（OHOS 原生环境）。

package: gupnp-av/0.14.5
homepage: https://gitlab.gnome.org/GNOME/gupnp-av

# 上游测试命令
upstream_check_command: "meson test"

# conanfile.py build() 中已集成上游测试（OHOS 真机运行）
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <build_folder> --timeout-multiplier=16 --no-rebuild"

# 代表性上游测试（完整列表见 notes.md）
upstream_tests:
  - file: tests/check-search.c
    source: gupnp-av-0.14.5.tar.xz/tests/check-search.c
    description: "SearchCriteria 字符串转义/解析单元测试"
    command: "meson test check-search"
  - file: tests/gtest/test-didl-lite-object.c
    source: gupnp-av-0.14.5.tar.xz/tests/gtest/test-didl-lite-object.c
    description: "DIDL-Lite object 命名空间与属性单元测试"
    command: "meson test test-didl-lite-object"
  - file: tests/gtest/test-media-collection.c
    source: gupnp-av-0.14.5.tar.xz/tests/gtest/test-media-collection.c
    description: "MediaCollection 读写单元测试"
    command: "meson test test-media-collection"

# test_package 自带测试（消费者视角）
test_package_tests:
  - file: test_gupnp_av.c
    description: "DIDL-Lite writer/object + ProtocolInfo + SearchCriteriaParser 真实 API 冒烟"
    command: "./test_gupnp_av"

# 上游测试目标数（3 顶层 + 5 gtest = 8 个测试目标；保守下界）
assertion_count: 8
