# 软件级 manifest
# 文件位置: archives/g/gupnp-av/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: gupnp-av
display: "gupnp-av"
description: "Utility library for UPnP A/V profiles (DIDL-Lite, search criteria, protocol info)"
category: library
homepage: "https://gitlab.gnome.org/GNOME/gupnp-av"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "纯 C meson 库（DIDL-Lite XML 解析/生成），上游只依赖 glib-2.0/gobject-2.0 (>=2.58) + libxml-2.0；不依赖 gupnp/gssdp"
    - "gnome.genmarshal 依赖 glib-genmarshal（glib2 包内 python3 脚本），通过改写 glib-2.0.pc 的 glib_genmarshal 变量为包内绝对路径解决"
    - "introspection/vapi/gtk_doc 均需关闭（默认 introspection=true 会拉 g-ir-scanner）"
    - "OHOS 静态链接需显式传 libintl.a（glib2 .pc 带 -lintl）"
  common_dependencies:
    - glib2
    - libxml2

versions:
  "0.14.5":
    status: published
    build_date: "2026-09-03"
    conan_ref: "gupnp-av/0.14.5@ohpcd/stable"
