# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# ── 上游测试统计（实测口径，可复现）──────────────────────────────
# 统计命令（对 gnome-menus-3.36.0.tar.xz 原始源码树）：
#   find . -iname "*test*"                                  → 2 个命中，均非自动化用例
#   grep -rn "TESTS *=\|check_PROGRAMS\|check-local\|check_SCRIPTS" .
#                                                           → 0 命中
#   ls tests/                                               → 不存在
#
#   命中项逐条核实：
#   - util/test-menu-spec.c : util/Makefile.am 注册为
#       noinst_PROGRAMS = gnome-menu-spec-test
#       即交互式菜单布局打印工具（人工核对用），不在 check_PROGRAMS/TESTS 中，
#       `make check` 不会执行它。
#   - m4/progtest.m4        : gettext 的 autoconf 宏（AC_PATH_PROG 系列），非测试。
#
#   SUBDIRS = libmenu desktop-directories layout util po（无 tests 子目录）
#
# 结论：上游 3.36.0 自动化测试用例数 = 0（上游本就无测试，非"记录但未运行"）。
# 按 TEST_QUALITY_SPEC §3.1，build() 仍在末尾执行 `make check` 以证明测试目标
# 真实可跑且退出码 0；本机实测 5 个子目录均 "Nothing to be done for 'check'",
# make check 退出码 0（日志见 CI conan-build-test 输出）。

package: gnome-menus/3.36.0
homepage: "https://gitlab.gnome.org/GNOME/gnome-menus"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []

# 上游测试实测结果（2026-09-12，本机 = CI 同款 OpenHarmonyPC 设备）
upstream_test_result:
  command: "make check"
  exit_code: 0
  tests_run: 0
  tests_passed: 0
  tests_failed: 0
  note: "上游无自动化用例；5 个子目录均 Nothing to be done for 'check'"

# test_package 中自带的测试 (消费者视角验证，R34 实质调用被测包)
test_package_tests:
  - file: test_gmenu.c
    description: >-
      C 级实质测试：在沙箱 XDG 目录内构造 applications.menu + .desktop 条目 +
      .directory 子菜单，完整走通 libgnome-menu-3 的
      gmenu_tree_new/gmenu_tree_load_sync/gmenu_tree_get_root_directory/
      gmenu_tree_directory_iter/gmenu_tree_iter_next/gmenu_tree_entry_get_app_info/
      gmenu_tree_get_entry_by_id 路径（与 alacarte 同一 API 面）；
      任一断言失败即非零退出使 conan create 失败。
      另校验 GMenu-3.0.typelib 随包产出。
    command: "clang test_gmenu.c -lgnome-menu-3 && GMENU_TEST_LOG=... ./test_gmenu"

# 测试断言总数
# 上游 0（无自动化用例）+ test_package 25（实测 assertions=25 failures=0）
assertion_count: 25
