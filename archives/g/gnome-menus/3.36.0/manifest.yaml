# 版本级 manifest
# 文件位置: archives/{letter}/{name}/3.36.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.36.0"

# 软件名
software: gnome-menus

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-12"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/gnome-menus/3.36/gnome-menus-3.36.0.tar.xz"

  # 源码校验和
  sha256: "d9348f38bde956fc32753b28c1cde19c175bfdbf1f4d5b06003b3aa09153bb1f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--enable-introspection=yes"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "glib/2.84.0.1"
    - "gobject-introspection/1.78.1.1"
    - "libintl/0.26.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-port-for-ohos.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 增加 HarmonyOS(ohos) 平台识别（*:HarmonyOS:*:* → aarch64-unknown-linux-ohos；config.sub 增加 ohos-linux 分支与 ohos* 系统名）。"
  - "E011: HMDFS umask 077 导致 configure 生成的 config.status 临时 subs*.awk Permission denied，build() 内将 configure 的 umask 077 改写为 022。"
  - "GISCAN 必需三件套（Python 3.12 无 stdlib distutils，CI #42069 复现）：(1) 随配方 vendored distutils 兼容层（distutils+jaraco+more_itertools，giscanner/utils.py:385 模块级 import distutils）经 wrapper 注入 PYTHONPATH；(2) `giscanner._giscanner` 扩展 EXT_SUFFIX 必须与运行的 python 一致，且鸿蒙 loader 只允许 conan python dlopen 自身 lib-dynload 下的扩展（E212），故 wrapper 显式用 conan python 执行并先把包内 giscanner 复制进其 lib-dynload 再签名；(3) giscanner/shlibs.py 调 ldd 解析 --library 的 soname，本机无 ldd，wrapper 旁生成 llvm-readelf -d 版 shim 并前置 PATH。另需 PKG_CONFIG_PATH 指向 conan generators。"
  - "测试质量（TEST_QUALITY_SPEC）：上游 3.36.0 无自动化用例（无 tests/、各 Makefile.am 无 TESTS=/check_PROGRAMS；util/test-menu-spec.c 是 noinst_PROGRAMS 交互工具），build() 仍按 §3.1 执行 make check（退出码 0）；test_package 用沙箱 XDG 树构造 applications.menu 实测 25 断言（gmenu_tree_new/load_sync/get_root_directory/iter/entry_get_app_info/get_entry_by_id + typelib 产出）。"
