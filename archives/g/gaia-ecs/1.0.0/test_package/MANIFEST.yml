# test_package/MANIFEST.yml
# 上游官方测试声明文件 — gaia-ecs 1.0.0

package: gaia-ecs/1.0.0
homepage: "https://github.com/richardbiely/gaia-ecs"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# gaia-ecs 使用 CMake + doctest：GAIA_BUILD_UNITTEST=ON 生成 gaia_test 等 8 个目标的 ctest 注册
upstream_check_command: "cmake -DGAIA_BUILD_UNITTEST=ON .. && make -j4 && ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试（header-only 库无构建，测试在适配验证阶段执行）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（适配验证阶段，官方 tarball 基线）
upstream_tests:
  - file: src/test/src/test_core.cpp
    source: gaia-ecs-1.0.0/src/test/src/test_core.cpp
    description: "核心容器/日志/基础工具测试（43 个 TEST_CASE）"
    command: "./build/src/test/gaia_test"
  - file: src/test/src/test_ecs_entity.cpp
    source: gaia-ecs-1.0.0/src/test/src/test_ecs_entity.cpp
    description: "ECS 实体生命周期测试（30 个 TEST_CASE）"
    command: "./build/src/test/gaia_test"
  - file: src/test/src/test_query_core.cpp
    source: gaia-ecs-1.0.0/src/test/src/test_query_core.cpp
    description: "查询核心测试（74 个 TEST_CASE）"
    command: "./build/src/test/gaia_test"
  - file: src/test/src/test_mt.cpp
    source: gaia-ecs-1.0.0/src/test/src/test_mt.cpp
    description: "多线程/任务系统测试（40 个 TEST_CASE）"
    command: "./build/src/test/gaia_test"

# test_package 中自带的测试（消费者视角验证，真实调用 gaia ECS API）
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：World 实体/组件/更新/删除生命周期"
    command: "./test_package"

# 测试断言总数（上游 doctest 断言 + 消费者断言，近似值）
assertion_count: 2254252