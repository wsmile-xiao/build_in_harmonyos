# 软件级 manifest — gaia-ecs
# 遵循 ARCHIVE-SPEC v2.0

software: gaia-ecs
display: "gaia-ecs"
description: "A simple and powerful entity component system (ECS) written in C++17. Header-only, MIT licensed."
category: gamedev
homepage: "https://github.com/richardbiely/gaia-ecs"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only 库：产物为 single_include/gaia.h 及头文件集，无编译产物；Conan 配方使用 package_type=header-library"
    - "package_info() 仅声明 include 目录与 cmake target gaia::gaia，不声明库文件"
    - "C++17 起，依赖 pthread（OHOS 下同样链接 Threads::Threads）"
  common_dependencies: []

versions:
  "1.0.0":
    status: built
    build_date: 2026-09-03
