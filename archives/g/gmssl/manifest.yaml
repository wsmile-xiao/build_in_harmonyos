software: gmssl
display: "GmSSL"
description: "支持国密算法（SM2/SM3/SM4/SM9）的密码库，兼容 OpenSSL API"
category: crypto
homepage: "https://github.com/guanzhi/GmSSL"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 无法识别 HarmonyOS 平台，需创建工具链文件设置 CMAKE_SYSTEM_NAME=Linux"
    - "测试套件因 ELF 签名限制无法运行，不影响功能"
    - "编译产物需通过 ohc-run.py sign-elf 签名"
  common_dependencies: []

versions:
  "3.1.1":
    status: published
    build_date: "2026-04-24"
