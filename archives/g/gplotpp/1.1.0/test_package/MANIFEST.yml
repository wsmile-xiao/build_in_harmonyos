# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gplotpp/1.1.0
homepage: "https://github.com/ziotom78/gplotpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# gplotpp 为 CMake 工程: tests/CMakeLists.txt 注册单一 CTest 条目 run_tests
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 已集成: build() 构建 run_tests 目标并直接运行 doctest 套件
upstream_test_in_build: true
upstream_test_command: "./tests/run_tests"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/src/run_tests.cpp
    source: gplotpp-1.1.0/tests/src/run_tests.cpp
    description: "doctest 套件: TEST_CASE complex + TEST_CASE animation (2 个独立用例, 5 断言)"
    command: "./tests/run_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者验证: 使用已安装公开头文件 gplot++.h + Gnuplot 公开 API 渲染 dumb 终端并核验系列/坐标轴标签"
    command: "./test_gplotpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5