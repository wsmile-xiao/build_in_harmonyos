# test_ohos/MANIFEST.yml — gplotpp 1.1.0 HarmonyOS PC 专项验证
# 四项独立鸿蒙检查（run_ohos_test.py，任一失败非零退出）：
#   T1_aarch64_elf    ELF64 AArch64（readelf -h）
#   T2_musl_no_glibc  musl libc, 无 GLIBC 符号版本, 无 ld-linux
#   T3_no_host_paths  无宿主绝对路径 / 无 RPATH-RUNPATH
#   T4_real_plot      消费者程序经已安装 gplot++.h 真实制图并验证标签
checks:
  - id: T1_aarch64_elf
    desc: ELF64 AArch64 (readelf -h)
  - id: T2_musl_no_glibc
    desc: musl libc, no GLIBC symbol versions, no ld-linux
  - id: T3_no_host_paths
    desc: no absolute host paths, no RPATH/RUNPATH
  - id: T4_real_plot
    desc: real consumer plot via installed gplot++.h with label verification
assertion_count: 4
assertion_count_note: 3 machine checks + 1 run-and-verify check (T4)
test_language: cpp
test_framework: bare
framework_flavor: bare
