software: gplotpp
display: "GPLOT++"
description: "A C++ header-only interface to Gnuplot"
category: library
homepage: "https://github.com/ziotom78/gplotpp"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only C++17 CMake INTERFACE library; no binary library is produced."
    - "No third-party Conan dependencies; the gnuplot executable is a runtime tool of consumers (ohpcd registry gnuplot/6.0.3)."
    - "CMake 4 compatibility is provided through CMAKE_POLICY_VERSION_MINIMUM=3.5."
    - "Upstream doctest suite (tests/src/run_tests.cpp) has 2 TEST_CASEs requiring the real gnuplot executable; the recipe runs the full suite against gnuplot/6.0.3."
    - "test_ohos compiles and runs a real consumer on device: ELF aarch64, musl, no host path leakage, real SVG render with label checks."
  common_dependencies: []

versions:
  "1.1.0":
    status: built
    build_date: "2026-09-26"
    conan_ref: "gplotpp/1.1.0"