software: gleam
# 软件级 manifest
# 文件位置: archives/g/gleam/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件描述
description: "Statically-typed language for the Erlang VM"

# 官方网站
homepage: "https://gleam.run/"

# 许可证
license: "Apache-2.0"

# 类别（可选）
category: "programming-language"

# ============================================================
# 版本索引（软件级 manifest 核心字段）
# ============================================================

# 当前可用版本列表
versions:
  - version: "1.17.0-r0"
    status: published
    build_date: "2026-06-08"
    source_url: "https://dl-cdn.alpinelinux.org/alpine/edge/community/aarch64/gleam-1.17.0-r0.apk"

# 最新稳定版本
latest_stable: "1.17.0-r0"

# ============================================================
# 附加信息（可选）
# ============================================================

# 软件特性
features:
  - "Statically typed functional programming language"
  - "Compiles to Erlang and JavaScript"
  - "Built-in compiler, build tool, formatter, and package manager"
  - "Part of the BEAM ecosystem"

# 运行时依赖
runtime_dependencies:
  - "erlang (for compiled Gleam programs)"
  - "libc.musl-aarch64.so.1"
  - "libgcc_s.so.1"