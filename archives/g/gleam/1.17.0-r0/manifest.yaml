software: gleam
# 版本级 manifest
# 文件位置: archives/g/gleam/1.17.0-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.17.0-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://dl-cdn.alpinelinux.org/alpine/edge/community/aarch64/gleam-1.17.0-r0.apk"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: apk

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom
  build_system: alpine-apk

  # 配置选项列表
  configure_options:
    - "precompiled-musl-binary"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libc.musl-aarch64.so.1/system"
    - "libgcc_s.so.1/precompiled"

  # 编译器
  cc: precompiled
  cxx: precompiled

  # 构建方式说明
  build_method: "pre-compiled-musl-binary"
  build_notes: "Rust项目，无法从源码编译（rustc在HarmonyOS上SIGSEGV）。使用Alpine Linux gleam 1.17.0-r0 aarch64 musl动态链接二进制作为替代部署方案。需要libc.musl-aarch64.so.1和libgcc_s.so.1两个运行时依赖。经binary-sign-tool self-sign后可正常执行。"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 测试报告
# ============================================================

test_report:
  status: published
  notes: "预编译二进制，验证gleam --version执行成功，输出gleam 1.17.0"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Rust项目在HarmonyOS上无法从源码编译 - rustc SIGSEGV"
  - "Gleam编译器本身不需要Erlang运行时即可执行"
  - "Alpine Linux gleam APK使用musl动态链接，需要2个依赖库"
  - "binary-sign-tool self-sign成功签名后gleam可在HarmonyOS上执行"
  - "Alpine musl动态链接二进制是Rust项目在HarmonyOS上的可行部署方案"