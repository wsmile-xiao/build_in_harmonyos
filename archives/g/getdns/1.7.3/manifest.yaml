software: getdns
version: "1.7.3"
status: published
build_date: "2026-09-16"
build_system: cmake

source:
  url: "https://getdnsapi.net/releases/getdns-1-7-3/getdns-1.7.3.tar.gz"
  sha256: "f1404ca250f02e37a118aa00cf0ec2cbe11896e060c6d369c6761baea7d55a2c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options: >-
    -DENABLE_STUB_ONLY=ON -DBUILD_GETDNS_QUERY=ON -DBUILD_GETDNS_SERVER_MON=ON
    -DBUILD_STUBBY=OFF -DBUILD_TESTING=ON -DBUILD_LIBEV=ON -DBUILD_LIBEVENT2=ON
    -DBUILD_LIBUV=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
  dependencies:
    - openssl/3.5.6
    - libidn2/2.3.8
    - check/0.15.2
    - libev/4.33
    - libevent/2.1.13
    - libuv/1.52.1.1
  cc: clang
  cxx: clang++

patches_applied: []

validation:
  status: passed
  upstream_tests:
    command: "check_getdns / check_getdns_event / check_getdns_ev / check_getdns_uv (Check framework, local thread responder)"
    cases: 241
    note: "4 ctest targets (test_noeventloop/test_libevent/test_libev/test_libuv), 38 suites, 241 Check test cases, executed in build() with local loopback responders; see test-report.md"
  test_package:
    command: "./getdns_smoke"
    cases: 1
    note: "OHOS smoke: __OHOS__ probe + getdns_context_create/destroy + dict set/get bindata + get_names + pretty_print + getdns_get_version."

knowledge_gained:
  - "getdns upstream CMakeLists cmake_minimum_required(3.20): pass CMAKE_POLICY_VERSION_MINIMUM=3.5 on cmake>=4 toolchains"
  - "Upstream Find* modules (FindCheck/FindLibev/FindLibevent2/FindLibuv/FindLibidn2) accept <NAME>_DIR hints; inject Conan dependency rootpath via cmake.definitions"
  - "ENABLE_STUB_ONLY=ON drops the libunbound dependency (recursive mode) — lighter build, stub resolution only"
  - "check_getdns test binaries embed local pthread+select DNS responders (127.0.0.1 loopback) — no external network needed"
