# MANIFEST.yml — test_package 上游测试声明
name: getdns
version: 1.7.3
upstream_tests:
  framework: "Check (libcheck)"
  location: "src/test/"
  description: >
    上游 BUILD_TESTING=ON 时构建 check_getdns 系列测试程序（Check
    框架驱动，内嵌本地线程响应器 run_server：pthread + socket +
    select 回环 127.0.0.1，无外网依赖），由 conanfile.py build()
    末尾真实执行。上游 ctest 注册 4 个测试目标：
    test_noeventloop(check_getdns) / test_libevent(check_getdns_event) /
    test_libev(check_getdns_ev) / test_libuv(check_getdns_uv)。
    另有 tests_stub_async/tests_stub_sync/tests_dict/tests_list/
    tests_namespaces 测试程序（无 ctest 注册，开发者手动运行）。
  executed_in_build: true
  ctest_registered: 4
ohos_specific:
  description: >
    test_package/src/getdns_smoke.c：__OHOS__ 平台宏探测 + libgetdns
    核心 API 实链（context create/destroy、dict set/get bindata、
    get_names、pretty_print、getdns_get_version），OHOS PC 本机执行。
