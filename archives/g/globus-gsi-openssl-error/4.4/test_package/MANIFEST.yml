# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游 globus-gsi-openssl-error 自带 test/ 目录（automake parallel-tests，
# TAP 输出）：TESTS = globus-openssl-error-test.pl（perl 驱动），
#   - 构建 check_PROGRAMS = globus_openssl_error_test
#   - 运行测试程序并逐行比对 globus_openssl_error_test.stdout 期望正则
#   - 4 个 TAP 断言：run <prog> / Open <stdout> / Open <log.stdout> /
#     Match reference output
#   - 纯进程内测试，无网络/证书需求；期望输出对 OpenSSL 1.1/3.x 双兼容
#     （函数码宏缺失分支有 #if defined 守卫）
# 本次适配在 build() 内实跑（审查 rule4，模式同 globus-callout 4.3 整改）：
# 构建 globus_openssl_error_test 后，用 .libs 真实 ELF 替换 libtool 包装
# 脚本（包装脚本会重置 LD_LIBRARY_PATH，同 callout 教训），注入
# LD_LIBRARY_PATH（globus-common/openssl 包 lib + 本包 library/.libs）后
# 运行 perl 驱动，实测 4/4 通过。

package: globus-gsi-openssl-error/4.4
homepage: "https://github.com/gridcf/gct"

# 上游官方测试：test/ 目录（automake parallel-tests TAP）
upstream_official_tests:
  - suite: "test/ (globus-openssl-error-test.pl, 等价 make check 的 TESTS 部分)"
    count: 4        # TAP 测试点：run / Open stdout / Open log.stdout / Match reference output
    kind: "unit"
    command: "perl test/globus-openssl-error-test.pl"
    run_in_build: true
    result: "4/4 通过（100%）——build() 内构建 globus_openssl_error_test 后直接运行 perl TAP 驱动，OHOS aarch64 实测通过（见 CI 日志 TAP 输出）"

# 构建阶段执行的测试命令：上游测试已在 build() 实跑（见 conanfile.py build()）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "perl test/globus-openssl-error-test.pl"

# 说明：不使用 `make check` 驱动运行——perl 驱动经 PATH 解析到的是 libtool
# 包装脚本，包装脚本重置 LD_LIBRARY_PATH 导致依赖库运行时加载失败（同
# globus-callout 4.3 的 LOG_COMPILER 教训）；改为构建后用 .libs 真实
# 二进制替换包装脚本（仅构建产物，不改上游测试脚本/期望数据），注入
# LD_LIBRARY_PATH 后直接运行 perl TAP 驱动。不修改任何上游测试内容。

# 适配补全测试（自研，非上游）：无
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test_package.c
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：include globus_error_openssl.h + 链接 libglobus_openssl_error，activate → ERR_put_error → wrap → cause 链校验 → deactivate，编译并运行验证库可用"
    command: "./test_globus_gsi_openssl_error"

# 测试断言总数 (test_package 实际统计：4 项 FAIL 出口——activate/wrap 非空/
# 顶层消息/cause 链 OpenSSL Error 校验，外加 deactivate 出口)
assertion_count: 5
