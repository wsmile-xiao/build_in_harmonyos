name: globus-gsi-openssl-error
version: "4.4"
status: in_progress
source:
  url: "https://deb.debian.org/debian/pool/main/g/globus-gsi-openssl-error/globus-gsi-openssl-error_4.4.orig.tar.gz"
  sha256: "1879ff269154431700ed158a75acc6e10ca0c96af95d92bc2fa63b7fe998fa6e"
license: Apache-2.0
build:
  system: autotools
  dependencies:
    - "globus-common/18.15"
    - "openssl/3.5.6"
  patches:
    - "0001-config.sub-ohos.patch（2013 版 config.sub 增加 ohos OS 识别，--host=aarch64-unknown-linux-ohos 必需；同 globus-callout 4.3 先例）"
tests:
  upstream: "4/4 passed (100%)（test/globus-openssl-error-test.pl TAP，build() 内实跑）"
  test_package: "passed on OHOS aarch64（activate→wrap→cause 链校验→deactivate）"
  ohos_aarch64: "package and test_package compiled and linked, upstream TAP 4/4"
  emulator: "not run（本 run 未覆盖模拟器步骤）"
notes:
  - "单 flavor（无 thr/nothr 变体），configure.ac 仅依赖 openssl >= 1.0 与 globus-common >= 14"
  - "libtool .la dependency_libs 陷阱按 callout 手法处理：Makefile 中 -lglobus_common 替换为包内 libglobus_common.so 绝对路径"
  - "上游 perl TAP 驱动经 PATH 解析到 libtool 包装脚本会重置 LD_LIBRARY_PATH，构建后用 .libs 真实 ELF 替换包装脚本再运行驱动（不改上游测试文件）"
