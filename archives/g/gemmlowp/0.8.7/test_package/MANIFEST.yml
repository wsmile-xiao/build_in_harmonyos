# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gemmlowp/0.8.7
homepage: "https://github.com/google/gemmlowp"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "cmake -DBUILD_TESTING=ON && ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (contrib/CMakeLists.txt 注册的 5 个 ctest)
upstream_tests:
  - file: test/test_math_helpers.cc
    source: gemmlowp-16e8662c34917be0065110bfcd9cc27d30f52fdf/test/test_math_helpers.cc
    description: "math helpers (RoundingDivideByPOT etc.) 单元测试"
    command: "./test_math_helpers"
  - file: test/test_blocking_counter.cc
    source: gemmlowp-16e8662c34917be0065110bfcd9cc27d30f52fdf/test/test_blocking_counter.cc
    description: "BlockingCounter 多线程计数同步测试"
    command: "./test_blocking_counter"
  - file: test/test_allocator.cc
    source: gemmlowp-16e8662c34917be0065110bfcd9cc27d30f52fdf/test/test_allocator.cc
    description: "Allocator 内存分配器测试"
    command: "./test_allocator"
  - file: test/test_fixedpoint.cc
    source: gemmlowp-16e8662c34917be0065110bfcd9cc27d30f52fdf/test/test_fixedpoint.cc
    description: "fixedpoint 定点数算术测试"
    command: "./test_fixedpoint"
  - file: test/test.cc
    source: gemmlowp-16e8662c34917be0065110bfcd9cc27d30f52fdf/test/test.cc
    description: "gemmlowp 主单元测试（覆盖 EightBitIntGemm 与量化 GEMM）"
    command: "./test_gemmlowp"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cc
    description: "消费者测试：调用公开 API GemmWithOutputPipeline 做 2x2 量化 GEMM 并校验输出"
    command: "./test_gemmlowp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
