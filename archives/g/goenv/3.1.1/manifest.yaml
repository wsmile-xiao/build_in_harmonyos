software: goenv
version: "3.1.1"
build_system: go

# 编译状态
status: published
build_date: "2026-06-01"

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://github.com/go-nv/goenv/archive/refs/tags/3.1.1.tar.gz"
  sha256: "8c107c1ec31cd544bbf59dc822676ef1966811a13e006aa35ba09546a74c4d9b"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOPROXY=https://goproxy.cn,direct"
    - "GOOS=linux"
    - "GOARCH=arm64"
  dependencies:
    - "go/1.24.2"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "Go项目使用CGO_ENABLED=0静态编译，无需configure/make流程"
  - "Go工具链版本不匹配(GOROOT内1.23.6 vs go命令1.24.2)需要使用~/usr/local/go/bin/go并设置GOROOT"
  - "Go test在鸿蒙平台无法运行(未签名test二进制)，需在notes.md记录"