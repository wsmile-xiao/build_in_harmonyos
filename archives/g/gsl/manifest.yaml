software: gsl
display: "GNU Scientific Library"
description: "GNU 科学计算库：特殊函数、线性代数、随机数、统计、积分等"
category: foundation
homepage: "https://www.gnu.org/software/gsl/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "两条可行路线：(a) 2.8 起用 --build/--host 显式三元组（aarch64-unknown-linux-musl）跳过 config.guess，无需打补丁；(b) 2.7 沿用上游骨架既定的 config.guess/config.sub 平台识别补丁 + --host=aarch64-unknown-linux-ohos"
    - "libgsl.so 把 CBLAS 符号留给消费方解析，必须同时链 -lgsl -lgslcblas。单独 dlopen libgsl.so 会报 cblas_sdsdot: symbol not found"
    - "make 必须 -j1（鸿蒙 SELinux 禁止 automake jobserver 并行 FIFO）"
    - "本机动态加载器不跟随符号链接解析 DT_NEEDED，libtool 的 libx.so.N -> libx.so.N.M 软链会导致运行期 Error loading shared library，需摊平为实体文件"

versions:
  "2.8":
    status: built
    build_date: "2026-07-29"
    packaging: conan
    notes: "conan 配方（os=OHOS arch=armv8），真机原生 conan create 验证，test_package 4 条真实数值断言全绿；产 libgsl.so.28 与 libgslcblas.so.0"
  "2.7":
    status: built
    build_date: "2026-09-29"
    packaging: conan
    notes: "conan 配方（os=OHOS arch=armv8）；走上游骨架既定的 config.guess/config.sub 平台识别补丁 + --host=aarch64-unknown-linux-ohos；上游 make check 59/59 全绿，鸿蒙消费者用例 HC-1..HC-6 6/6 全绿；产 libgsl.so.25 与 libgslcblas.so.0"
