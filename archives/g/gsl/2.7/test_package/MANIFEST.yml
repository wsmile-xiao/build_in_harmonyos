# test_package/MANIFEST.yml
# 上游官方测试声明 + 鸿蒙消费者用例声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# rule12: 鸿蒙特有测试按「具名端到端消费者用例」计数，不填断言数

package: gsl/2.7
homepage: "https://www.gnu.org/software/gsl/"

# 上游测试：GSL 自带完整 automake 测试套件（make check）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  - name: "test（55 个功能目录，54 例可执行测试程序）"
    command: "make check"
    expected: "pass（实测 54/54）"
  - name: "test_static（matrix、vector 静态链接各 1 例）"
    command: "make check"
    expected: "pass（实测 2/2）"
  - name: "test_c11（complex，C11 复数接口 1 例）"
    command: "make check"
    expected: "pass（实测 1/1）"
  - name: "pkgconfig.test（顶层，校验安装出的 gsl.pc）"
    command: "make check"
    expected: "pass（实测 1/1）"
  - name: "test_gsl_histogram.sh（顶层，gsl-histogram CLI 端到端）"
    command: "make check"
    expected: "pass（实测 1/1）"

# 上游合计：59 例，实测 59 通过 / 0 失败 / 0 跳过（100%）
upstream_case_total: 59
upstream_case_passed: 59
upstream_case_failed: 0
upstream_case_skipped: 0

# ---------------------------------------------------------------------------
# 鸿蒙特有测试（消费者用例，rule12）—— 按用例数填报
# 每个用例都是完整端到端流程：构造真实输入 → 调 GSL 公开 API → 产出真实结果
# → test.sh 逐字比对 consumer 打印的真实计算值与独立参考值
# ---------------------------------------------------------------------------
harmony_consumer_case_count: 6
harmony_consumer_cases:
  - id: HC-1
    name: "特殊函数：贝塞尔 J0(5) 端到端求值"
    entry: "consumer HC-1"
    expected: "-0.177597"
    ref: "Abramowitz & Stegun 9.4.1（教科书值）"
  - id: HC-2
    name: "线性代数：LU 分解解 2x2 方程组（走 CBLAS 符号）"
    entry: "consumer HC-2"
    expected: "0.800000,1.400000"
    ref: "手算：2x+y=3, x+3y=5"
  - id: HC-3
    name: "随机数：mt19937 固定种子复现序列"
    entry: "consumer HC-3"
    expected: "1608637542,3421126067"
    ref: "MT19937 init_genrand(42) 标准算法独立复算"
  - id: HC-4
    name: "统计：样本均值与总体标准差"
    entry: "consumer HC-4"
    expected: "5.000000,2.000000"
    ref: "手算：n=8 样本"
  - id: HC-5
    name: "BLAS：dgemm 2x2 矩阵乘法"
    entry: "consumer HC-5"
    expected: "19.000000,22.000000,43.000000,50.000000"
    ref: "手算矩阵乘 [[1,2],[3,4]] x [[5,6],[7,8]]"
  - id: HC-6
    name: "直方图：4 箱分箱计数与越界样本丢弃"
    entry: "consumer HC-6"
    expected: "2,1,3,1"
    ref: "手算：8 样本中 1 个越界被丢弃"

# test_package 文件说明
test_package_tests:
  - file: consumer.c
    description: "消费者程序（R34）：真实 #include GSL 公共头并链接 -lgsl -lgslcblas -lm，实现 HC-1..HC-6 六条端到端用例。必须同时链 gslcblas——libgsl.so 把 CBLAS 符号留给消费方解析，单独 dlopen libgsl.so 会报 cblas_sdsdot: symbol not found"
    command: "./consumer --all"
  - file: test.sh
    description: "鸿蒙消费者用例驱动：逐条执行 HC-1..HC-6，读取 consumer 输出的 VALUE 并与参考值逐字比对，输出 6/6 通过率"
    command: "sh test.sh <runtime-dir>"
