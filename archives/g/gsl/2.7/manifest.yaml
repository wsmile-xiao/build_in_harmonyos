# 版本级 manifest — gsl 2.7
# 遵循 ARCHIVE-SPEC v2.0

version: "2.7"
software: "gsl"

status: built
build_date: "2026-09-29"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/gsl/gsl-2.7.tar.gz"
  sha256: "efbbf3785da0e53038be7907500628b466152dbc3c173a87de1b5eba2e23602b"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--host=aarch64-unknown-linux-ohos"
    - "--enable-shared"
    - "--disable-static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-config.guess.patch"
  - "patches/0002-config.sub.patch"

knowledge_gained:
  - "GSL 源码包自带的 config.guess 不认 HarmonyOS：uname -s 返回 HarmonyOS 时落进 unknown 分支；需在 case 里补 *:HarmonyOS:*:* 分支输出 {arch}-unknown-linux-ohos（ref: E007）"
  - "配套的 config.sub 不认 linux-ohos 三元组，需在 KERNEL-OS 白名单加 linux-ohos* 并补 ohos-linux 反向形式（ref: E007）"
  - "conan buildenv 注入的 CONFIG_SHELL 指向 hnp bash，该 bash 在 HMDFS 目录上读取 stdin（cat -）会失败，config.status 拿到的 conftest.c 被截断，configure 误报 C compiler cannot create executables；须在 build() 里把 CONFIG_SHELL/SHELL 覆盖成 /system/bin/sh，且必须写在 conanbuild.sh 尾部（buildenv 在其后 source，会覆盖配方里 tc.environment.define 的赋值）（ref: E386）"
  - "config.status 用 umask 077 创建临时目录，setgid 的 HMDFS 下会建出 drwx--S--- (2700)，写入进程 UID 映射与 owner 不一致即被拒，需把 configure 里的 umask 077 替换为 umask 022（预防性：本次构建目录在 el2 未复现该报错，按 E011 rec_approach 与仓库 1272 份先例预置）（ref: E011、E114）"
  - "HarmonyOS 动态加载器不跟随符号链接解析 DT_NEEDED：libtool 安装出的 libgsl.so.25 -> libgsl.so.25.1.0 软链会让消费方运行期报 Error loading shared library；消费测试须把 .so 名摊平复制成实体文件再跑（ref: E050）"

