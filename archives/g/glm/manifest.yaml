software: glm
display: "GLM"
description: "OpenGL Mathematics - header-only C++ mathematics library"
category: gfx
homepage: "https://github.com/g-truc/glm"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only package: expose the upstream glm::glm CMake target and no library file."
    - "Map OHOS to a Linux/aarch64 CMake toolchain and disable the optional compiled library."
    - "Keep GLM_BUILD_TESTS=OFF for package creation; run the complete upstream CTest inventory separately."
  common_dependencies: []

