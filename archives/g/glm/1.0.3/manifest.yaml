version: "1.0.3"
software: glm
status: built
build_date: "2026-09-08"
build_system: cmake

source:
  url: "https://github.com/g-truc/glm/releases/download/1.0.3/glm-1.0.3.zip"
  sha256: "1c0a0fced9b0d87c7b7bc94e40be490cff6d4c83c25db8488d8f33754e7fdeb2"
  tar_format: zip

build:
  system: cmake
  configure_options:
    - "-DGLM_BUILD_LIBRARY=OFF"
    - "-DGLM_BUILD_TESTS=OFF"
    - "-DGLM_BUILD_INSTALL=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "GLM 1.0.3 is a header-only CMake package; the consumer links the exported glm::glm target and no library file is required."
  - "The package recipe must retain the upstream install metadata while disabling the optional compiled library and test build."
  - "The complete upstream source inventory contains 189 CTest cases across bug, core, ext, gtc and gtx suites; all 189 passed in the isolated source build."
  - "On HMDFS, a path can pass shell -w checks yet reject mkdir; bind and validate the exact task root, and use a create-new successor when the frozen path fails before launch."
