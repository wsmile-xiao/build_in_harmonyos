package: glm/1.0.3
homepage: "https://github.com/g-truc/glm"
upstream_check_command: "cmake -DGLM_BUILD_TESTS=ON -DGLM_BUILD_INSTALL=OFF -DGLM_BUILD_LIBRARY=OFF && cmake --build . && ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_in_test_package: false
upstream_tests:
  - subdir: test/bug
    description: "Upstream bug regression tests"
  - subdir: test/core
    description: "Core vector and matrix tests"
  - subdir: test/ext
    description: "Extension tests"
  - subdir: test/gtc
    description: "GTC extension tests"
  - subdir: test/gtx
    description: "GTX extension tests"
test_package_tests:
  - file: test_package/test_package.cpp
    description: "Consumer test calls glm::dot and matrix/vector multiplication"
    command: "./test_glm"
assertion_count: 4
