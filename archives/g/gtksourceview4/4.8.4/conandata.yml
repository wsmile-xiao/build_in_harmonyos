# conandata.yml — gtksourceview4 4.8.4
# R39：GNOME 官方发布站 download.gnome.org 为主源，规则允许并列镜像 fallback
# （ustc / tuna / nju 为 GNOME 官方镜像），CI 侧按序回退。

sources:
  url:
    - "https://download.gnome.org/sources/gtksourceview/4.8/gtksourceview-4.8.4.tar.xz"
    - "https://mirrors.ustc.edu.cn/gnome/sources/gtksourceview/4.8/gtksourceview-4.8.4.tar.xz"
    - "https://mirrors.tuna.tsinghua.edu.cn/gnome/sources/gtksourceview/4.8/gtksourceview-4.8.4.tar.xz"
    - "https://mirror.nju.edu.cn/gnome/sources/gtksourceview/4.8/gtksourceview-4.8.4.tar.xz"
  sha256: "7ec9d18fb283d1f84a3a3eff3b7a72b09a10c9c006597b3fbabbb5958420a87d"

# 无补丁。
# 4.8.4 全树不存在 gnome.post_install() / gtk-update-icon-cache 调用
# （该 post-install 钩子是 5.x 才引入的），因此同族 gtksourceview5 配方的
# patches/0001-meson-remove-gtk-update-icon-cache-post-install.patch 在此不适用；
# 4.8.4 的 meson.build 也没有 config.guess 类宿主三元组探测（meson 不走
# config.guess），故不需要 gtksourceview3 的 0001-config.guess.patch。
