# gtksourceview4 4.8.4 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "4.8.4"

software: gtksourceview4

# 编译状态
# published | built | failed | archived
# built = 配方 + test_package 就绪，实编与用例执行由 CI（同配方同 profile）复现；
# 本机 ohpcd 远程拉取被网关拦（system acceleration policy not enabled），
# 本地缓存缺 cairo/pixman/gtk 依赖二进制，故本机未跑 conan create（如实申报）。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（download.gnome.org 为 GNOME 官方发布站）
  url: "https://download.gnome.org/sources/gtksourceview/4.8/gtksourceview-4.8.4.tar.xz"

  # 源码校验和
  sha256: "7ec9d18fb283d1f84a3a3eff3b7a72b09a10c9c006597b3fbabbb5958420a87d"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  # 4.8.4 的 meson_options.txt 默认 gir=true / vapi=true → 必须显式关闭
  # （OHOS 无 g-ir-scanner / vapigen / gtk-doc / gladeui 交叉工具链）。
  configure_options:
    - "-Dgir=false"
    - "-Dvapi=false"
    - "-Dgtk_doc=false"
    - "-Dglade_catalog=false"
    - "-Dinstall_tests=false"

  # 编译依赖列表（格式: name/version）
  # 4.8.4 meson dependency() 实测清单：glib-2.0/gobject-2.0/gio-2.0（经 gtk 传递）、
  # gtk+-3.0 >= 3.24、libxml-2.0、fribidi >= 0.19.7
  dependencies:
    - gtk/3.24.43
    - libxml2/2.15.3
    - fribidi/1.0.16

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# 4.8.4 全树无 gnome.post_install() / gtk-update-icon-cache 调用（5.x 才引入），
# 故同族 gtksourceview5 配方的 0001-meson-remove-gtk-update-icon-cache-post-install.patch
# 不适用；meson 构建亦不走 config.guess，无需 gtksourceview3 的
# 0001-config.guess.patch。源码零补丁即可交叉编译。

# ============================================================
# 测试统计（rule4：N=上游源码包 test/tests 目录文件数；另附 meson 注册目标数）
# ============================================================

test_summary:
  upstream_test_files: 105          # tests/ 目录文件数（N 口径）
  upstream_registered: 23           # testsuite/meson.build 注册的 g_test 目标数
  upstream_runnable: 2              # 无显示依赖、可 headless 真跑
  upstream_display_limited: 21      # 调用 gtk_test_init()，OHOS 无窗口系统
  consumer_assertion_count: 16      # test_package 消费者用例 TAP 断言数
  notes: >-
    上游 testsuite 注册 23 个 g_test 二进制，其中仅 2 个（test-buffer-input-stream、
    test-buffer-output-stream）使用普通 g_test_init()，可在无显示的 OHOS PC 上 headless
    运行；其余 21 个调用 gtk_test_init()，运行时 abort 于 "Failed to open display"
    （HarmonyOS PC 无窗口系统，Broadway 后端的 unix socket bind 被 SELinux 拒绝），
    按平台限制如实申报。消费者用例（test_package/test_gtksourceview4.c）16 项 TAP 断言
    覆盖真实使用路径：安装版本宏、LanguageManager 对包内 170 个 *.lang 规格的 libxml2
    解析与 'c' 语言元数据、StyleSchemeManager（7 个已安装配色）、Buffer 文本往返、
    SearchContext 命中计数与 replace_all、undo/redo。断言与用例执行结果以 CI 日志为准
    （UPSTREAM-TEST-PASS / UPSTREAM-TEST-SKIP-DISPLAY 逐项打印）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gtksourceview 4.x 与 5.x 的构建期差异：4.8.4 不用 gnome.post_install()（无 gtk-update-icon-cache 宿主工具硬依赖），但 meson 选项名是 gir/vapi/gtk_doc/glade_catalog，且 gir/vapi 默认 true，交叉编译必须显式关闭——5.x 的 introspection/documentation 命名不能套用"
  - "meson 的 gnome.mkenums_simple()/compile_resources() 工具链解析：PkgConfigDeps 生成的 glib-2.0.pc/gio-2.0.pc 不含 glib_mkenums/glib_compile_resources 变量 → 需注入绝对路径；且 glib 包 bin/ 内的宿主工具 ELF 在 OHOS 需先 binary-sign-tool 自签才能 exec（E077）"
  - "OHOS musl python 下 meson detect_ninja 对 PATH 裸名探测失败：注入 NINJA（绝对路径）环境变量后跳过探测；同时需把 /system/lib64 与 SDK llvm/lib 写入 conanbuildenv-*.sh（os.environ 改动会被 conan 环境重建丢弃）"
  - "meson install 会改写 .so 的 rpath，破坏链接期自签名 → OHOS XPM dlopen 报 Permission denied；解法是用 builddir 原始产物覆盖已安装 so，签名步骤放在覆盖之前"
  - "GTK3 生态库（gtksourceview3/4）在无窗口系统平台上仍可做有效消费者验证：LanguageManager/StyleSchemeManager/Buffer/SearchContext 均不建显示连接，只有 gtk_test_init() 类用例受限"
