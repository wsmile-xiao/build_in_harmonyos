package: gtksourceview4/4.8.4
homepage: "https://gitlab.gnome.org/GNOME/gtksourceview"

upstream_check_command: "meson test -C builddir --list   # 23 registered g_test targets (testsuite/meson.build:43-81)"

upstream_test_in_build: true
upstream_test_command: "cd testsuite && ./test-buffer-input-stream ./test-buffer-output-stream (TAP via g_test; the other 21 targets call gtk_test_init() → OHOS has no display, reported as platform-limited)"

upstream_tests:
  - file: testsuite/test-buffer-input-stream.c
    source: gtksourceview-4.8.4/testsuite/test-buffer-input-stream.c
    description: "GtkSourceBufferInputStream: reads a GtkSourceBuffer through GInputStream (uses plain g_test_init → runs headless on OHOS)"
    command: "./testsuite/test-buffer-input-stream"
  - file: testsuite/test-buffer-output-stream.c
    source: gtksourceview-4.8.4/testsuite/test-buffer-output-stream.c
    description: "GtkSourceBufferOutputStream: writes text into a GtkSourceBuffer (plain g_test_init → runs headless on OHOS)"
    command: "./testsuite/test-buffer-output-stream"

test_package_tests:
  - file: test_gtksourceview4.c
    description: "Consumer test (16 TAP checks): installed version macros 4.8.4; language manager over the package's own language-specs dir (170 *.lang specs enumerated, 'c' language + section name + metadata[mimetypes] parsed through libxml2); style scheme manager (7 installed schemes); GtkSourceBuffer text roundtrip; search context occurrence count + replace_all; buffer undo/redo. No display connection is opened."
    command: "./test_gtksourceview4"

assertion_count: 16
