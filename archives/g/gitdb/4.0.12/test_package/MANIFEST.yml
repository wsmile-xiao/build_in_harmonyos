# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: gitdb/4.0.12
homepage: "https://github.com/gitpython-developers/gitdb"

# Upstream test command
upstream_check_command: "pytest"

# conanfile.py build() method - upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests:
  - file: gitdb/test/test_example.py
    source: gitdb-4.0.12/gitdb/test/test_example.py
    description: "Upstream pytest suite for gitdb example"
    command: "pytest gitdb/test/test_example.py"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test_gitdb.py
    description: "Import gitdb module, verify version string, and exercise core DB API"
    command: "python test_gitdb.py"
  - file: conanfile.py
    description: "Conan test_package entrypoint — runs test_gitdb.py"

# Test assertion count (approximate, for quality assessment)
assertion_count: 4
