software: gitdb
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.0.12/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.0.12"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/source/g/gitdb/gitdb-4.0.12.tar.gz"

  # 源码校验和
  sha256: "5ef71f855d191a3326fcfbc0d5da835f26b13fbcba60c32c21091c349ffdb571"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "pip install --target=install --no-deps"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "smmap/5.0.3"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "gitdb is a pure Python package"
  - "Runtime dependency: smmap>=3.0.1,<6 (declared as Conan requirement)"
  - "Built using pip install --target --no-deps"
  - "Runtime dependency of GitPython"
