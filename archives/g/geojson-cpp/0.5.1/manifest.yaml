version: "0.5.1"
software: geojson-cpp
status: built
build_date: "2026-09-23"
build_system: makefile

source:
  url: "https://github.com/mapbox/geojson-cpp"
  sha256: "05e60b997ff35ab7d6b1f42f08046097248c5934127a4dff35206f0296101757"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - mapbox-geometry/2.0.3
    - mapbox-variant/1.2.0
    - rapidjson/1.1.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-adapt-mapbox-geometry-2-value-abi.patch"

knowledge_gained:
  - "geojson-cpp 0.5.1 面向旧版 mapbox-geometry value（按值 vector/unordered_map），与已发布 mapbox-geometry/2.0.3 的 shared_ptr 语义（const_array_ptr_type/const_object_ptr_type）不兼容，需补丁适配访问器"
  - "mapbox 系列头文件库引用 mapbox-geometry/mapbox-variant/rapidjson 时，conanfile package_info 必须声明 cpp_info.requires 转发，否则下游 CMakeDeps 无法传播 include 路径"
