# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: geojson-cpp/0.5.1
homepage: "https://github.com/mapbox/geojson-cpp"

# 上游测试命令 (make test 编译并运行两个 assert 测试二进制)
upstream_check_command: "make test (build/test + build/test_value，mason 依赖 variant/geometry/rapidjson)"

# conanfile.py build() 方法中已集成上游测试（真实编译+运行）
upstream_test_in_build: true
upstream_test_command: "./test_geojson && ./test_geojson_value (assert 断言，退出码 0 = 全部通过)"

# 上游实际运行的测试程序（本地已实测 0 失败）
upstream_tests:
  - file: test/test.cpp
    source: geojson-cpp-0.5.1/test/test.cpp
    description: "GeoJSON 解析/序列化断言测试（15 个类型用例 + testAll 双路径，22 个 fixtures 驱动）"
    command: "./test_geojson (16 个测试函数，convert/non-convert 双路径)"
  - file: test/test_value.cpp
    source: geojson-cpp-0.5.1/test/test_value.cpp
    description: "GeoJSON value 转换断言测试（13 个 fixture 用例 + 1 个非法输入错误检查）"
    command: "./test_geojson_value (14 个用例)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：parse() 解析 GeoJSON Point → get() 校验坐标 → stringify() 回写"
    command: "./test_geojson-cpp (4 个断言)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 30