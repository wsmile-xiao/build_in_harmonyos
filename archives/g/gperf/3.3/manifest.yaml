test_note: "上游测试**已实测**（2026-09-11）：tests/ 的 **9 个 check 目标全部通过**（check-c / check-ada / check-modula3 / check-pascal / check-lang-utf8 / check-lang-ucs2 / check-smtp / check-test / check-large）—— `make check` **rc=0、error 计 0**，共 **24 次 diff 全部无差异**（每次 diff 无输出即通过），且各目标产物真实落盘（cinset.c / aout / test-7.out / 5000.out 等）。测试素材：30 个 .gperf 输入 + 24 个 .exp 期望输出 + validate 驱动。test_package 另真实执行 gperf --version 断言 3.3，并用真实 .gperf 输入生成 C 查找代码、验证生成物含预期符号（R34 反空壳，直接证明具备 eudev 所需能力）。复现命令：在源码构建树内 `cd tests && make check`（tests/Makefile 用相对路径 `GPERF = ../src/gperf`，故必须在 ../src/gperf 存在的树内运行）。"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "★ gperf 3.3 的 build-aux/config.sub **已原生支持** linux-ohos*（实测 `config.sub aarch64-unknown-linux-ohos` 通过），仅 config.guess 需补 HarmonyOS 分支——新版 autotools 辅助脚本在逐步原生支持 OHOS，动手前应先实测确认，避免生成无谓补丁（本库最终只产出 1 个 patch，而非惯例的 2 个）"
  - "★ 本包是 eudev 的**硬构建依赖**：eudev 构建期由 keyboard-keys.txt 经 AWK 生成 keyboard-keys-from-name.gperf，再由 gperf 生成 keyboard-keys-from-name.h（列入 BUILT_SOURCES），**无法从 tarball 绕过**（官方 eudev tarball 既不含 .gperf 也不含 .h）"
  - "main 上 3.1 的 notes 记录：HMDFS 会令 configure 的 heredoc 创建临时文件失败，当时被迫手工生成 Makefile/config.h 绕过；本配方改走标准 autotools 流程（TMPDIR 重定向到 build 目录 + configure 内 umask 077→022），无需手工干预"
  - "gperf 是构建工具（只装 bin/gperf），cpp_info 的 libdirs/includedirs 应为空——下游（如 eudev）通过 PATH 使用它，而非链接"
