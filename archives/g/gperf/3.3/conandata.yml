# conandata.yml — gperf 3.3
# gperf: GNU 完美哈希函数生成器（给定关键字列表，生成无冲突的 C/C++ 查找代码）
# 上游：https://www.gnu.org/software/gperf/
# 用途：eudev 的硬构建依赖（由 keyboard-keys.txt 生成 keyboard-keys-from-name.h）

sources:
  url: "https://ftp.gnu.org/gnu/gperf/gperf-3.3.tar.gz"
  # 官方 1831294 字节（与 ftp.gnu.org 的 Content-Length 逐字节一致）
  sha256: "fd87e0aba7e43ae054837afd6cd4db03a3f2693deb3619085e6ed9d8d9604ad8"

patches:
  - patch_file: "patches/0001-build-aux-config-guess.patch"
    patch_description: "0001 build-aux config.guess harmonyos support"
    patch_type: "portability"
# 注：gperf 3.3 的 build-aux/config.sub **已原生支持** linux-ohos*
#    （实测 `config.sub aarch64-unknown-linux-ohos` → aarch64-unknown-linux-ohos），
#    故无需为其生成 patch。仅 config.guess 需补 HarmonyOS 分支。
