software: "gdal"
version: "3.9.2.3"
status: built
build_date: "2026-08-21"
build_system: cmake
target_platform: "ohos-aarch64"

source:
  url: "https://github.com/OSGeo/gdal/releases/download/v3.9.2/gdal-3.9.2.tar.gz"
  sha256: "c9767e79ca7245f704bfbcb47d771b2dc317d743536b78d648c3e92b95fbc21e"
  tar_format: tar.gz
  upstream_version: "3.9.2"

configure_options:
  - "-DBUILD_SHARED_LIBS=ON"
  - "-DBUILD_TESTING=OFF"          # conan create 默认；W4 本地实测改 ON + gdalautotest
  - "-DBUILD_PYTHON_BINDINGS=OFF"
  - "-DGDAL_USE_EXTERNAL_LIBS=OFF"
  - "-DGDAL_USE_SQLITE3=ON"
  - "-DGDAL_USE_ZLIB=ON"
  - "-DGDAL_USE_TIFF_INTERNAL=ON"
  - "-DGDAL_USE_GEOTIFF_INTERNAL=ON"
  - "-DGDAL_USE_GEOS=ON"           # 3.9.2.3: 启用 GEOS（geos/3.13.1，≥3.8）
  - "-DGDAL_USE_SPATIALITE=ON"     # 3.9.2.3: 启用 libspatialite（libspatialite/5.1.0.2）
  - "-DGDAL_USE_WEBP=OFF"
  - "-DGDAL_USE_CURL=OFF"

build:
  system: cmake
  dependencies:
    - proj/9.3.1.1
    - sqlite3/3.49.1
    - zlib/1.3.1.1
    - geos/3.13.1
    - libspatialite/5.1.0.2
  cc: clang
  cxx: clang++

patches_applied: []

# 测试摘要（与 test_package/MANIFEST.yml 对齐）
# 公式（TEST_QUALITY_SPEC §3.3）：
#   effective_pass_rate = passed / (total - platform_exemptions - dependency_disabled)
# W4 v2 实跑（2026-08-21，GDAL_USE_GEOS=ON + GDAL_USE_SPATIALITE=ON）：
#   gtest 674 跑 / 666 通过 / 2 platform-exempt（VSISupports*，/tmp 只读）/ 6 dependency
#   （iconv×2、CURL、FITS、JPEGXL×2，feature 未构建按设计 skip）
#   ctest entry 22 总 / 21 独立二进制全过 / 1 包裹层（gdal_unit_test 含 2 platform-exempt）
test_summary:
  framework: "ctest + gtest (autotest/cpp)"
  ctest_entries: 22
  gtest_cases: 674
  gtest_passed: 666
  platform_exemptions: 2    # VSISupports* /tmp readonly — 保留
  dependency_exemptions: 6  # iconv×2 / CURL / 外部FITS / JPEGXL×2（feature 未构建按设计 skip）
  ctest_entry_exemptions: 1 # gdal_unit_test 内部含 2 个 platform_exempt
  upstream_tests_modified: false
  effective_pass_rate: "666/666 = 100%"
  raw_pass_rate: "666/674 = 98.8%"
  report: "test_package/MANIFEST.yml"

knowledge_gained:
  - "3.9.2.3: 启用 GDAL_USE_GEOS=ON（geos/3.13.1，与 libspatialite 共用同一 geos 版本）与 GDAL_USE_SPATIALITE=ON（libspatialite/5.1.0.2）"
  - "选项名必须为 GDAL_USE_SPATIALITE（GDAL_USE_LIBSPATIALITE 不存在，写了等于没写）"
  - "ohos.toolchain 把 CMAKE_FIND_ROOT_PATH_MODE_*=ONLY 设为普通变量遮蔽 -D BOTH；GEOS/SPATIALITE 必须用显式 -DGEOS_INCLUDE_DIR/-DGEOS_LIBRARY/-DSPATIALITE_INCLUDE_DIR/-DSPATIALITE_LIBRARY cache 变量（与 proj/sqlite3/zlib 同模式）"
  - "libspatialite.so DT_NEEDED 闭包扩大：proj/libxml2/geos/geos_c 均已在 ohpcd 发布，conanrun 注入 LD_LIBRARY_PATH"
  - "GEOS=ON 后上游 gtest 14 个 test_ogr_geos 转实跑且全部通过；基线 3.9.2.2 的 '20 个 test_ogr_geos' 实际是 14 geos + 6 能力 skip 的合并计数，3.9.2.3 按实跑拆分"
  - "W4 实测坑：CTest 用自己的 LD_LIBRARY_PATH（build;build/lib）覆盖外部值 → test 子进程加载系统 libxml2 缺符号；改直接调用测试二进制 + 正确 LD_LIBRARY_PATH 执行"

notes: |
  3.9.2.3 over 3.9.2.2: enable GEOS + libspatialite (GDAL_USE_GEOS=ON /
  GDAL_USE_SPATIALITE=ON). Dependency closure grows to 5 direct Conan deps
  (proj/sqlite3/zlib/geos/libspatialite). Ninja generator + _run_sp() +
  _patch_symlink_rules() preserved from 3.9.2.2 (verified paths, not touched).
  W4 v2 measured 2026-08-21: gtest 666/674 passed (2 platform-exempt /tmp,
  6 dependency-disabled feature skips); ctest entry 21/22 + 1 exempt.
  Full details in test_package/MANIFEST.yml and notes.md.
