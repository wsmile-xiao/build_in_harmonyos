# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gifify/2.4.0
homepage: "https://github.com/vvo/gifify"

# 上游测试命令 (gifify 是 npm CLI 工具, 无标准测试套件)
upstream_check_command: "npm test"
upstream_test_in_build: false
upstream_test_command: ""

# gifify 上游无自带测试, 使用 --version 作为 smoke test
upstream_tests:
  - file: bin/gifify
    source: gifify-2.4.0/bin/gifify
    description: "CLI 工具 --version 输出版本号"
    command: "gifify --version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试: gifify --version"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
