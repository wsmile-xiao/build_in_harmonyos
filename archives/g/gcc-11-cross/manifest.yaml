software: gcc-11-cross
display: "GCC 11.5.0 C Cross-Compiler (arm-none-eabi)"
description: "GNU GCC 11.5.0 C 交叉编译器，运行于 HarmonyOS PC，产出 arm-none-eabi 裸机目标代码"
category: build-tool
homepage: "https://gcc.gnu.org/"
license: "GPL-3.0-or-later WITH GCC-exception-3.1"
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================
ohos_adaptation:
  key_points:
    - "config.guess 需识别 HarmonyOS（补丁 0001），交叉构建三元组为 aarch64-linux-ohos"
    - "config.sub 需接受 ohos 系统三元组（补丁 0002）"
    - "生成的宿主工具（xgcc/cc1/collect2 及编译器 wrapper）必须做 OHOS ELF 签名后才能执行"
    - "HMDFS 忽略 chmod，需把 umask 077 归一为 022；HMDFS 无法创建 GNU make 的 FIFO jobserver，需 --jobserver-style=pipe 并限制 -j"
    - "配置脚本需在 bash + ulimit -s unlimited 下运行；/tmp 只读，需使用私有 TMPDIR"
    - "构建环境脚本必须命名 gcc_11_cross_build_env，禁用 Conan 保留名 conanbuild（会递归 source 至 SIGSEGV）"
    - "环境导出的 AS=llvm-as 必须被真实 GNU as/ld 覆盖；预置 gcc_cv_c_no_fpie/gcc_cv_no_pie 保持 PIE 默认，避免 LLD AArch64 拷贝重定位错位"
    - "arm-none-eabi 目标产物无法在 OHOS 宿主执行（无模拟器），上游 torture 测试为编译 + ELF 静态检查"
    - "目标汇编/链接工具来自已发布的 arm-none-eabi-binutils/2.46.1，不随本包重复打包"
  common_dependencies:
    - arm-none-eabi-binutils

# ============================================================
# 版本索引
# ============================================================
versions:
  "26":
    status: built
    build_date: "2026-09-17"
    conan_ref: "gcc-11-cross/26"
