      sha256: "0c166a39e1bf0951dfafcd68949fe0e4b6d3658081d6282f39aeefc6310f2f13"
patches:
  "26":
    - patch_file: "patches/0001-config.guess-ohos.patch"
      patch_description: "Recognise HarmonyOS in the top-level config.guess so the build triplet resolves to aarch64-linux-ohos"
      patch_type: "portability"
    - patch_file: "patches/0002-config.sub-ohos.patch"
      patch_description: "Accept ohos system triplets in the top-level config.sub (linux-ohos)"
      patch_type: "portability"
