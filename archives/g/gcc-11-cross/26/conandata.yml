    # newlib + libgloss provide the target C library (crt0.o, libc.a, libm.a,
    # headers) for the bare-metal arm-none-eabi target.  GCC is configured
    # --with-newlib, matching upstream's own bare-metal layout.
    newlib:
      url:
        - "https://mirrors.tuna.tsinghua.edu.cn/sourceware/newlib/newlib-4.4.0.20231231.tar.gz"
        - "https://mirror.nju.edu.cn/sourceware/newlib/newlib-4.4.0.20231231.tar.gz"
