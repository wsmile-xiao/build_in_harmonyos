test_package_tests:
  - file: test.sh
    description: "HarmonyOS consumer functional cases x7: btpwchk version banner (internal program + libgnubatch_int .so), gbch-hols version banner (curses front-end, exercises ncurses .so chain), gbch-passwd usage error, gbch-passwd password-file creation, btpwchk correct-password roundtrip (crypt() verify via SPROGDIR-redirected gbpwfile), btpwchk wrong-password rejection, btpwchk unknown-user rejection (cases 4-7 are a real roundtrip through the packaged password subsystem)"
    command: "sh test.sh"
    device_fixture:
      file: pwshim.c
      ld_preload: true
      reason: "The OHOS device user runs as a uid (e.g. 20020100) that has NO /etc/passwd entry, /etc is read-only and there is no useradd, so gbch-passwd's getpwuid(getuid()) path exits 4 ('Unable to find current uid N in pw file') and its -u path needs root. test.sh compiles pwshim.c and LD_PRELOADs it for cases 4-7, supplying a synthetic passwd entry for exactly the invoking uid (getpwuid/getpwnam, other lookups delegated to libc). No product code is modified: gbch-passwd still writes a real gbpwfile via crypt() and btpwchk authenticates against it with crypt(). On a root CI (getuid()==0, getpwuid(0)==root) the cases pass without the fixture, which is then simply unused."

assertion_count: 7
