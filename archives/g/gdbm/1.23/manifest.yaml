# gdbm 1.23 编译档案
software: gdbm
version: "1.23"
status: success
build_system: autotools
compile_date: 2026-04-12

dependencies:
  required: []
  optional: [readline]

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$TEST_PREFIX
    - --enable-libgdbm-compat
  cflags: "-fPIC -O2"
  env:
    CC: clang

patches_applied:
  - file: 0001-config.guess-add-HarmonyOS-support.patch
    purpose: config.guess 添加 HarmonyOS 检测
  - file: 0002-config.sub-add-HarmonyOS-support.patch
    purpose: config.sub 添加 ohos 三元组支持

compatibility:
  level: high
  issues: []
  notes: |
    - gdbm_open/store/fetch 全部正常
    - libgdbm_compat 兼容库正常（ndbm/dbm 接口）
    - gdbmtool/gdbm_dump/gdbm_load 全部可用

test_results:
  type: manual
  passed: 4
  failed: 0
  note: "gdbm_open + store 3条 + fetch验证 + 遍历key 全通过"

knowledge_gained:
  - "gdbm 标准 autotools，打 config.guess/config.sub 补丁即可编译"
  - "gdbm_open 路径不能使用 /tmp（HMDFS），需用 $TMPDIR"

references:
  - https://ftp.gnu.org/gnu/gdbm/
