# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: gulrak-filesystem/1.5.8
homepage: "https://github.com/gulrak/filesystem"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（本版本为 header-only 库，上游 CMake 测试入口）
upstream_tests:
  - file: test/filesystem_test.cpp
    source: gulrak-filesystem-1.5.8/test/filesystem_test.cpp
    description: "Catch2 主测试（70 个 TEST_CASE，覆盖 path/operations 全 API）"
    command: "./test/filesystem_test"
  - file: test/multi1.cpp
    source: gulrak-filesystem-1.5.8/test/multi1.cpp
    description: "多文件编译测试 1（multifile_test 目标）"
    command: "./test/multifile_test"
  - file: test/multi2.cpp
    source: gulrak-filesystem-1.5.8/test/multi2.cpp
    description: "多文件编译测试 2（multifile_test 目标）"
    command: "./test/multifile_test"
  - file: test/fwd_test.cpp
    source: gulrak-filesystem-1.5.8/test/fwd_test.cpp
    description: "两段式 fwd/impl 包含验证（fwd_impl_test 目标）"
    command: "./test/fwd_impl_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/test_ghc_fs.cpp
    description: "HarmonyOS 专项消费测试：current_path/create_directories/iterator/remove_all + HMDFS 平台限制错误码"
    command: "./test_ghc_fs"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16