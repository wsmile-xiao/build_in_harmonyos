# 版本级 manifest — gulrak-filesystem 1.5.8
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.8"

# 软件名
software: gulrak-filesystem

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub release tarball）
  url: "https://github.com/gulrak/filesystem/archive/refs/tags/v1.5.8.tar.gz"

  # 源码校验和
  sha256: "726f8ccb2ec844f4c66cc4b572369497327df31b86c04cefad6b311964107139"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（header-only，CMake 仅用于测试/示例）
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_CXX_STANDARD=17"
  - "-DGHC_FILESYSTEM_BUILD_TESTING=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "header-only 库 conan package() 必须用子目录感知模式（如 ghc/*.hpp）复制 include，copy('*.hpp') 不匹配嵌套子目录导致包内 include 为空"
  - "OHOS HMDFS 禁止硬链接/FIFO/socket/mknod 且 chmod 权限位归一化；ghc::filesystem 在此类操作上如实返回 error_code 不崩溃，属平台语义"
  - "W3 junk_check full 模式基于 git ls-files 索引扫描，其他库 main 基线 dotfile 会误报；用 git rm --cached 临时隔离 + git add -f 原样恢复可完成基线隔离复验"