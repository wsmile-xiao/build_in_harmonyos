software: git-cliff
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.10.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.10.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# 构建系统类型
build_system: cargo

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ghfast.top/https://github.com/orhun/git-cliff/archive/refs/tags/v2.10.1.tar.gz"

  # 源码校验和
  sha256: "172888704ad429e238e61472e31704d4fdf5ff9c2c04479bb9452fb70d7a9278"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | cargo
  system: cargo

  # 配置选项列表
  configure_options:
    - "cargo build --release"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - rust/1.95.0
    - cargo/1.95.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
