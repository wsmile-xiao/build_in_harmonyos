software: gegl
display: "GEGL"
description: "Generic Graphics Library - graph-based image processing framework"
category: multimedia
homepage: "https://gegl.org"
license: GPL-3.0
build_system: meson

ohos_adaptation:
  key_points:
    - "GEGL uses meson build system, requires babl/glib/libpng dependencies"
    - "check-def-files validation step skipped on HarmonyOS (libintl/gnulib symbol leak)"
    - "Many optional dependencies (librsvg/libraw/openexr) disabled for simpler build"
  common_dependencies:
    - babl
    - glib
    - libpng

