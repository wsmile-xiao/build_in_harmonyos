# gsound 1.0.3 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.3"

software: gsound

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/gsound/1.0/gsound-1.0.3.tar.xz"

  # 源码校验和
  sha256: "ca2d039e1ebd148647017a7f548862350bc9af01986d39f10cfdc8e95f07881a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dintrospection=false"
    - "-Dgtk_doc=false"
    - "-Denable_vala=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib2/2.88.0
    - libcanberra/0.30

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gsound 是 GObject 封装的 libcanberra 薄封装库，仅依赖 glib2 + libcanberra，不依赖 libsoup3/gssdp/libxml2（ref: E457 GLib 栈适配先例）"
  - "gsound meson.build 默认 introspection/enable_vala/gtk_doc 开启，鸿蒙交叉编译需全部关闭（gobject-introspection/valac/gi-docgen 不在工具链）（knowledge_ref: gupnp-av/0.14.5、atk/2.38.0.1.1 同款先例）"
  - "gsound 无上游测试套件（无 tests/ 目录、无 meson test 注册），适配后仅需验证消费者用例（test_package）（ref: 适配实测，knowledge/doc 无既有条目）"
  - "gsound 对外暴露 libgsound.so.0.0.2（libtool -version-info 0:2:0），conan libs 声明为 gsound（ref: 适配实测，knowledge/doc 无既有条目）"
  - "gsound 头文件由 meson 扁平安装到 include/，配方 package() 将其整理到 include/gsound/，消费者 #include <gsound/gsound.h>，conan includedirs 声明 include（ref: 适配实测，knowledge/doc 无既有条目）"
  - "gsound 不链接 libsoup3，不能照搬 gssdp/gupnp 的 GLib .pc Libs 置空方案（g_* 符号无可借用导出表，直链报 undefined symbol）：保留静态 glib2 链接列表（只修 prefix=），libgsound.so 直链唯一 glib 副本（ref: E457 方案的 gsound 偏差适配）"
