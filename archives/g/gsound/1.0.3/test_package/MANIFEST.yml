# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）

package: gsound/1.0.3
homepage: https://gitlab.gnome.org/GNOME/gsound

# 上游测试命令（无上游测试）
upstream_check_command: "echo 'gsound has no upstream test suite'"

# 无上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试用例
upstream_tests: []

# test_package 自带测试（消费者视角，真实 API）
test_package_tests:
  - file: test_gsound.c
    description: "gsound 真实 API 端到端消费者用例：GSoundContext 创建 → open → set_attributes → play_simple → cache → unref，覆盖 GSound → libcanberra → null-driver 完整管线"
    command: "./test_gsound"

# 断言数：ctx 非空 + open 成功 + set_attributes 成功 + play_simple 完成 + unref 清理
# （cache 在 OHOS 无音频后端下为非致命 INFO，不计入断言）
assertion_count: 5
