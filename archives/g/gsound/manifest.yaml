software: gsound
display: "gsound"
description: "GSound — GObject-based thin wrapper around libcanberra for playing system sounds"
category: multimedia
homepage: "https://gitlab.gnome.org/GNOME/gsound"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建；OHOS profile 自动映射 host_system 为 harmonyos"
    - "gnome.mkenums() 交叉编译需 glib2 包 bin 的 glib-mkenums，tc.binaries 钉死绝对路径"
    - "glib2 包 .pc 文件 prefix=/ 损坏，复制+修复 prefix 到真实 package_folder"
    - "不链接 libsoup3 → 保留静态 glib2 链接列表直链进 libgsound.so（与 gssdp/gupnp 的 .pc Libs 置空方案不同，E457 的 gsound 偏差适配）"
    - "registry zlib/1.3.1 非 PIC，根级 override 到 zlib/1.3.1.1（E324/E541 先例）"
    - "共享库 strip 破坏 .codesign 哈希，tc.strip=None；meson install 清理 DT_RUNPATH 后用 build 产物覆盖（E504）"
    - "introspection/vapi/gtk_doc/enable_vala 在鸿蒙工具链缺失，配方中 disable"
    - "meson 头文件扁平安装到 include/，package() 整理到 include/gsound/；OHOS musl 不跟随符号链接，SONAME（libgsound.so.0）与 dev 链接名（libgsound.so）均建实体副本"
  common_dependencies:
    - "glib2"
    - "libcanberra"

versions:
  "1.0.3":
    status: built
    build_date: "2026-09-30"
