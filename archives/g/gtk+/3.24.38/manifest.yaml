software: gtk+
# 版本级 manifest
# 文件位置: archives/g/gtk+/3.24.38/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.24.38"
status: published
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://repo.huaweicloud.com/gnome/sources/gtk+/3.24/gtk+-3.24.38.tar.xz"
  sha256: ""
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dx11_backend=false"
    - "-Dwayland_backend=false"
    - "-Dbroadway_backend=true"
    - "-Dintrospection=false"
  dependencies:
    - glib/2.88.0
    - cairo/1.18.2
    - cairo-gobject/1.18.2
    - pango/1.50.14
    - gdk-pixbuf/2.42.12
    - atk/2.38.0
    - fribidi/1.0.12
    - epoxy/1.5.10
    - libpng/1.6.43
    - fontconfig/2.16.0
    - freetype/2.14.3
    - harfbuzz/14.2.0
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "meson build.ninja 硬编码路径问题，需创建符号链接"
  - "OpenHarmony 要求共享库必须签名才能加载"
  - "GTK+ 可使用 broadway HTML5 后端替代 X11/Wayland"
  - "手动复制编译产物可绕过 ninja install 失败"