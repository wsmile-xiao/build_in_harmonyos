package: gflags/2.3.1
homepage: "https://gflags.github.io/gflags/"

upstream_check_command: "ctest --test-dir conan-build -C Release --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir conan-build -C Release --output-on-failure"

upstream_tests:
  - file: test/gflags_unittest.cc
    source: gflags-2.3.1/test/gflags_unittest.cc
    description: "Core flag parsing and reporting CTest cases"
    command: "ctest --test-dir conan-build -C Release --output-on-failure"
  - file: test/gflags_strip_flags_test.cc
    source: gflags-2.3.1/test/gflags_strip_flags_test.cc
    description: "Stripped flag help output and binary checks"
    command: "ctest --test-dir conan-build -C Release --output-on-failure"
  - file: test/gflags_declare_test.cc
    source: gflags-2.3.1/test/gflags_declare_test.cc
    description: "Cross-translation-unit flag declaration test"
    command: "ctest --test-dir conan-build -C Release --output-on-failure"
  - file: test/gflags_declare_flags.cc
    source: gflags-2.3.1/test/gflags_declare_flags.cc
    description: "Second translation unit for flag declaration test"
    command: "ctest --test-dir conan-build -C Release --output-on-failure"

test_package_tests:
  - file: test_gflags.cpp
    description: "Sets and reads a real packaged command-line flag"
    command: "conan test_package"

assertion_count: 2