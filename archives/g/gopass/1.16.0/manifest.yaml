software: gopass
version: "1.16.0"
status: published
build_date: "2026-06-17"
build_system: makefile

source:
  url: "https://github.com/gopasspw/gopass/archive/refs/tags/v1.16.0.tar.gz"
  sha256: "c7e6c5688c19765a740b9617eb4034c85645a80aa9c693d713869071d5c023a9"
  tar_format: tar.gz
build:
  system: makefile
  configure_options:
    - "GO111MODULE=on"
    - "CGO_ENABLED=0"
    - "-tags=netgo"
    - "-trimpath"
    - "-ldflags=-s -w -X main.version=1.16.0 -X main.commit=unknown -X main.date=2026-06-17"
  dependencies:
    - "go/1.26.4"
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "Go项目需CGO_ENABLED=0静态编译，PIE模式(-buildmode=pie)在鸿蒙上会segfault"
  - "/dev/shm在鸿蒙不可写，Go tempfile测试需跳过"
  - "Go项目不使用autotools，构建系统应标记为makefile或custom"
