# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gtkspell3/3.0.10-r3
homepage: "https://gtkspell.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# gtkspell3 3.0.10-r3 上游无任何正式测试用例：
#   - Makefile.am 无 TESTS/check_PROGRAMS（make check 无目标）
#   - examples/ 仅为演示程序（noinst_PROGRAMS），非测试套件
# 因此补充同等功能覆盖的自研断言测试（见 test_package_tests）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "gtkspell3 API 冒烟测试：error_quark/类型注册/对象构造/语言列表查询（调用被测包真实 API）"
    command: "./test_gtkspell3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
