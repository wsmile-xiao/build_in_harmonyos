# test_package/MANIFEST.yml — google-benchmark/1.9.5
# CI L0e requires this file.

package: google-benchmark/1.9.5
homepage: "https://github.com/google/benchmark"

# Upstream tests: 54 test/*.cc with benchmark_add_test registration in
# test/CMakeLists.txt (non-gtest) + 12 gtest unit tests when
# BENCHMARK_ENABLE_GTEST_TESTS=ON. For CI we build the library with
# BENCHMARK_ENABLE_TESTING=OFF; the full upstream suite requires gtest,
# which is exercised in the adapt/test gate on-device instead.
upstream_check_command: "cmake -S . -B build -DBENCHMARK_ENABLE_TESTING=ON -DBENCHMARK_ENABLE_GTEST_TESTS=ON && cmake --build build -j2"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_test_count: 66
upstream_test_cases_skipped: 0
upstream_test_cases_skip_reason: ""

test_package_tests:
  - file: test.cpp
    description: "Consumer test: find benchmark::benchmark, register Range/Complexity benchmarks, run them via RunSpecifiedBenchmarks, assert clean init/run/shutdown."
    command: "./test_google_benchmark"

test_package_test_count: 1
assertion_count: 3