# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: greatest/1.5.0
homepage: "https://github.com/silentbicycle/greatest"

# 上游测试命令（greatest 无 make check，直接运行示例程序）
upstream_check_command: "make all_c all_cpp && run each binary"

# conanfile.py build() 方法中是否已集成上游测试（header-only，无 build）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（6 个示例程序，共 1313 个测试用例）
upstream_tests:
  - file: example.c + example_suite.c
    source: greatest-1.5.0/example.c + example_suite.c
    description: "主示例程序：231 tests (175 pass, 37 fail intentional, 19 skip)"
    command: "./example"
  - file: example_no_suite.c
    source: greatest-1.5.0/example_no_suite.c
    description: "无 suite 示例：3 tests (1 pass, 1 fail intentional, 1 skip)"
    command: "./example_no_suite"
  - file: example_no_runner.c
    source: greatest-1.5.0/example_no_runner.c
    description: "自定义 runner 示例：1 test (1 pass)"
    command: "./example_no_runner"
  - file: example_shuffle.c
    source: greatest-1.5.0/example_shuffle.c
    description: "随机顺序测试：1066 tests (1064 pass, 2 fail intentional)"
    command: "./example_shuffle"
  - file: example_trunc.c
    source: greatest-1.5.0/example_trunc.c
    description: "测试名截断示例：11 tests (11 pass)"
    command: "./example_trunc"
  - file: example_cpp.cpp
    source: greatest-1.5.0/example_cpp.cpp
    description: "C++ 集成示例：1 test (1 fail intentional)"
    command: "./example_cpp"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：验证 header 可正常包含并使用 greatest API"
    command: "./test_greatest"

# 测试断言总数（上游 6 个二进制共 1313 个测试用例，422 个显式断言）
assertion_count: 422
