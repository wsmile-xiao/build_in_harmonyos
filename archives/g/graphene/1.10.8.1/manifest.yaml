version: "1.10.8.1"
software: graphene
status: built
build_date: "2026-08-31"
build_system: meson
conan_ref: "graphene/1.10.8.1"

source:
  url: "https://download.gnome.org/sources/graphene/1.10/graphene-1.10.8.tar.xz"
  sha256: "a37bb0e78a419dcbeaa9c7027bcff52f5ec2367c25ec859da31dfde2928f279a"
  tar_format: tar.xz
  note: "上游 tarball 与 1.10.8 完全相同；.1 后缀只标记适配修复（R37/L0j），非上游新版本。"

build:
  system: meson
  configure_options:
    - "default_library=static"
    - "wrap_mode=nodownload"
    - "introspection=disabled"
    - "installed_tests=false"
    - "gtk_doc=false"
    - "tests=true"
  cc: clang
  cxx: clang++

patches_applied: []

dependencies:
  - "glib/2.84.0.1.1"

knowledge_gained:
  - "graphene/1.10.8 以 glib2/2.88.0 为 glib 提供方，而 glib2 声明 zlib/1.3.1（无 fPIC 旧版）；cairo/libpng/pango 链走 zlib/1.3.1.1，于是每个 graphene 消费者都要自己加 zlib override（gtk4、awf-gtk 实测各写一份）。改用 glib/2.84.0.1.1（requires zlib/1.3.1.1）从源头消掉该冲突。"
  - "glib2/2.88.0 的 PkgConfigDeps 只生成 glib-2.0.pc，故 1.10.8 需自写转发型 gobject-2.0.pc；glib/2.84.0.1.1 已把 gobject-2.0 声明为带 pkg_config_name 的正式 component，PkgConfigDeps 直接产出该 .pc，转发 hack 整段删除。"
  - "配方一旦不再自己兜底生成 gobject-2.0.pc，就必须在 generate() 阶段断言该 .pc 存在：缺失意味着依赖侧回归，留给 meson 只会报含糊的 dependency not found。"
