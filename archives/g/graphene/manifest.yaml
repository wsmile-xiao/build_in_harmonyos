# 软件级 manifest
# 文件位置: archives/g/graphene/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: graphene
display: "graphene"
description: "Thin layer of graphic data types for 2D/3D math (MIT)"
category: library
homepage: "https://github.com/ebassi/graphene"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "纯 C meson 库，唯一依赖 glib 的 gobject-2.0（>= 2.30）；1.10.8.1 以 glib/2.84.0.1.1 消费"
    - "glib/2.84.0.1.1 原生声明 gobject-2.0 component，PkgConfigDeps 直接产出 gobject-2.0.pc；1.10.8 走 glib2/2.88.0 时需配方自写转发 .pc，该 hack 在 1.10.8.1 已删除"
    - "glib2/2.88.0 拉无 fPIC 的 zlib/1.3.1，会迫使每个下游消费者自加 zlib override；切到 glib/2.84.0.1.1（zlib/1.3.1.1）后冲突源消失——这是 1.10.8.1 的主要修复"
    - "测试依赖 mutest（tarball 内嵌 subprojects/mutest），wrap_mode=nodownload 离线构建"
  common_dependencies:
    - glib

versions:
  "1.10.8":
    status: built
    build_date: "2026-08-14"
    conan_ref: "graphene/1.10.8"
  "1.10.8.1":
    status: built
    build_date: "2026-08-31"
    conan_ref: "graphene/1.10.8.1"
