software: gdu
version: "5.36.1"
status: built
build_date: "2026-08-06"
build_system: custom

source:
  url: "https://github.com/dundee/gdu/archive/refs/tags/v5.36.1.tar.gz"
  sha256: "dd31ea9afd848edf734143aabd5fdf66236ce2c866dc09f9dededb61d39fe63c"
  tar_format: tar.gz

build:
  build_system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "go_build_cmd=github.com/dundee/gdu/v5/cmd/gdu"
    - "ldflags=-X github.com/dundee/gdu/v5/build.Version=v5.36.1"
    - "GOPROXY=https://goproxy.cn,direct"
  dependencies: []
  cc: clang
  cxx: clang++
  build_notes: |
    Go 项目编译需要特殊处理：
    1. Go linker 需要 mmap 支持的文件系统作为输出目录和 TMPDIR
    2. 使用 /data/storage/el2/base/haps/entry/files/ 作为输出目录和 TMPDIR
    3. PIE 二进制 ELF 签名会破坏 NOBITS section headers，使用静态非 PIE 二进制
    4. CGO_ENABLED=0 构建纯 Go 静态二进制
    5. Go 1.26.5 (via Harmonybrew, auto-downloaded by conanfile.py if not in PATH)
    6. GOPROXY=https://goproxy.cn,direct (proxy.golang.org 不可达)
    7. GOSUMDB=off: sum.golang.org not reachable from HarmonyOS network.
       Security trade-off accepted: conandata.yml sha256 covers main source
       but not Go module transitive dependencies. Acceptable for OHOS CI
       environment with trusted goproxy.cn mirror.

patches_applied: []

knowledge_gained:
  - "Go linker mmap 限制: 鸿蒙 tmpfs 不支持 mmap ACCESS_WRITE"
  - "Go PIE + ELF 签名冲突: 使用非 PIE 静态二进制"
  - "Go module proxy: 需配置 GOPROXY=https://goproxy.cn,direct"

test_results:
  type: official
  total: 6
  passed: 4
  failed: 2
  note: |
    pkg/device: 9/9 PASS
    pkg/path: 1/1 PASS
    pkg/annex: 3/3 PASS
    pkg/timefilter: 1/1 PASS
    pkg/analyze: TestGetFlagWithSymlink FAIL (E002: /tmp read-only)
    pkg/remove: TestItemFromDirParallelWithErr FAIL (E046: SELinux chmod)
