software: gdu
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.36.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.36.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/dundee/gdu/archive/refs/tags/v5.36.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "go_build_cmd=github.com/dundee/gdu/v5/cmd/gdu"
    - "ldflags=-X github.com/dundee/gdu/v5/build.Version=v5.36.1"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.26.4
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

  # 特殊构建注意事项
  build_notes: |
    Go 项目编译需要特殊处理：
    1. Go linker 需要 mmap 支持的文件系统作为输出目录和 TMPDIR（鸿蒙默认 tmpfs 不支持 mmap ACCESS_WRITE）
    2. 使用 /data/storage/el2/base/haps/entry/files/ 作为输出目录和 TMPDIR
    3. PIE 二进制 ELF 签名会破坏 NOBITS section headers，导致 segfault；使用静态非 PIE 二进制
    4. CGO_ENABLED=0 构建纯 Go 静态二进制
    5. 通过 goenv 管理 Go 版本

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go linker mmap 限制: 鸿蒙 tmpfs 不支持 mmap ACCESS_WRITE，需要将输出和 TMPDIR 指向 hmfs 文件系统"
  - "Go PIE + ELF 签名冲突: -buildmode=pie 二进制经 ELF 签名后 NOBITS section offsets 被破坏导致 segfault，应使用非 PIE 静态二进制"
  - "Go 项目 DESTDIR 模式: 手动 cp 二进制到 staging 目录，无传统 make install"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: official
  total: 6
  passed: 4
  failed: 2
  note: |
    pkg/device: 9/9 PASS
    pkg/path: 1/1 PASS
    pkg/annex: 3/3 PASS
    pkg/timefilter: 1/1 PASS
    pkg/analyze: TestGetFlagWithSymlink FAIL (E002: /tmp read-only)
    pkg/remove: TestItemFromDirParallelWithErr FAIL (E046: SELinux chmod)
    失败原因均为已知鸿蒙平台限制
