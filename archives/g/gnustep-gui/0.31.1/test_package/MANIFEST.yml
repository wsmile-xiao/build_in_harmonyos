# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gnustep-gui/0.31.1
homepage: "https://gnustep.github.io/"

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 注意: gnustep-gui 上游的单元测试由 GNUmakefile 驱动(Tests/ 目录),
# 共 16 组 29 个 .m 测试文件(NSBezierPath/NSView/NSCell/NSImage 等)。
# 交叉编译/无显示后端的 OHOS worker 上, TestFramework 收尾会因 /etc/passwd
# 缺少当前 uid 记录而崩溃(GSPlaceholderString initWithString:nil, 与
# make_services 同根因), 无法以退出码 0 完整跑通; 故由 test_package 提供
# 同功能的消费者测试(实质调用 AppKit API 断言)作为适配侧验证。
upstream_tests:
  - name: "Tests/gui (16 组 29 个 .m)"
    discovered: 29
    note: "交叉编译环境无法完整运行, 详见上方说明"

# test_package 中自带的测试 (消费者视角验证, 实质调用 AppKit API)
test_package_tests:
  - file: test_gnustep_gui.m
    description: "消费者测试: 创建 NSView 验证 frame/类解析/Foundation 字符串链, 并断言 test_support.c 的 C 支撑函数"
    command: "./test_gnustep_gui"

# 构建方式说明: 本 test_package 使用直接 clang 编译(见 conanfile.py 注释,
# 本机 OHOS 环境 /data/service/hnp/bin/cmake 启动需系统 libc++_shared.so 而加载失败)。
# CMakeLists.txt 为备选的 CMake 构建描述, 供支持 CMake 的环境使用, 当前测试路径不引用。
build_method: direct-clang
alternative_build: CMakeLists.txt (CMake, 备选)

# 测试断言总数 (近似值, 用于质量评估)
# test_gnustep_gui.m 中 5 项显式检查 (view 创建/frame/类名/字符串/C 支撑函数)
assertion_count: 5
