version: "0.31.1"
software: "gnustep-gui"
status: built
build_date: "2026-08-31"
build_system: "autotools"

source:
  url: "https://github.com/gnustep/libs-gui/releases/download/gui-0_31_1/gnustep-gui-0.31.1.tar.gz"
  sha256: "b5bf50bf86a391e541d3d37fe600175e95e5a004180d43b55aee9ca1d575e8f9"
  tar_format: tar.gz

build:
  system: "autotools+gnustep-make"
  configure_options:
    - "--disable-importing-config-file"
    - "--with-include-flags=<deps include>"
    - "--with-library-flags=<deps lib>"
  dependencies:
    - "gnustep-base/1.31.1"
    - "libobjc2/2.2.1"
    - "libtiff/4.7.2"
    - "libjpeg/10"
    - "libpng/1.6.39"
    - "libffi/3.5.2"
    - "curl/8.15.0"
  tool_requires:
    - "gnustep-make/2.9.2.1"

tests:
  upstream_tests_discovered: true
  upstream_tests_count: 29
  upstream_tests_note: "上游 Tests/gui 共 16 组 29 个 .m 测试文件(NSBezierPath/NSView/NSCell/NSImage 等); 本机实测多数断言可过, 但 TestFramework 收尾因 OHOS worker /etc/passwd 缺少当前 uid 记录崩溃(GSPlaceholderString initWithString:nil, 与 make_services 同根因), 无法以退出码 0 完整跑通; 由 test_package 提供同功能消费者测试"
  upstream_tests_executed: 0
  consumer_test: "Objective-C AppKit API smoke test in test_package (NSView/frame/class resolution/Foundation chain/test_support.c C assert, 5 项断言, 本机实测 rc=0 通过)"

knowledge_gained:
  - "gnustep-gui 必须与 gnustep-base 保持一致的 gcc runtime (OBJC_RUNTIME_LIB=gnu), 不能用默认 ng runtime"
  - "hmdfs 上 conan 子进程创建符号链接受限 (ln -s Permission denied), 需用 copyfile 生成 .so 别名"
  - "ADDITIONAL_CPPFLAGS 必须作为 make 命令行参数传入, GNUstep make 不读环境变量"
  - "GNUstep make 的 mkinstalldirs 脚本在 hmdfs 上 exec 受限, 用 MKDIRS='mkdir -p' 覆写"
  - "gnustep-make 包内脚本 shebang 需复制到本包目录并修复为 /data/service/hnp/bin/bash"
  - "GSBackend 后端类由应用侧链接的后端库提供, test_package 需提供最小 stub"
  - "GNUstepGUI 头文件需平铺到 Library/Headers/GNUstepGUI/ (AppKit.h 以 <GNUstepGUI/GSVersion.h> 引用)"

notes:
  - "gnustep-gui 0.31.1 依赖 gnustep-base 1.31.1 与 gnustep-make 2.9.2.1 (均已在制品仓发布)"
  - "主库 libgnustep-gui.so 632 个 obj 编译 + 链接成功, conan create 全流程通过"
  - "conan-verify G0-G4/L2/L4/L5 全部 PASS, W3 本地 CI 模拟通过"
