version: "0.32.0"
software: "gnustep-gui"
status: adapted
build_system: "autotools+gnustep-make"

source:
  url: "https://ftp.gnustep.org/pub/gnustep/core/gnustep-gui-0.32.0.tar.gz"
  sha256: "0c03a1b6313babd592ec58fcb825091f77eb27429a4ce4306ec3a7cfa7f9a1f6"
  tar_format: tar.gz

build:
  system: "autotools+gnustep-make"
  configure_options:
    - "--without-x"
    - "--disable-ungif"
    - "--disable-icu"
    - "--disable-aspell"
    - "--disable-sound"
    - "--disable-speech"
    - "--disable-speech-recognizer"
    - "--disable-cups"
    - "--with-tiff-include=<libtiff include>"
    - "--with-tiff-library=<libtiff lib>"
    - "--with-jpeg-include=<libjpeg include>"
    - "--with-jpeg-library=<libjpeg lib>"
    - "--build=<cpu>-unknown-linux-gnu (OHOS configure invocation)"
    - "--host=<cpu>-unknown-linux-ohos (OHOS configure invocation)"
    - "--target=<cpu>-unknown-linux-ohos (OHOS configure invocation)"
    - "ac_cv_prog_cc_works=yes (OHOS configure invocation)"
  dependencies:
    - "gnustep-base/1.31.1"
    - "libtiff/4.7.2"
    - "libjpeg/10"
    - "libpng/1.6.58"
  tool_requires:
    - "gnustep-make/2.9.2"

tests:
  upstream_tests_discovered: true
  upstream_tests_executed: 51
  consumer_test: "Objective-C AppKit API smoke test in test_package"

notes:
  - "GNUstep GUI requires gnustep-base and gnustep-make before build."
  - "TIFF is required by upstream configure; JPEG and PNG stay enabled because repository archives exist."
  - "GIF/X11, ICU, aspell, sound, speech, speech-recognizer, CUPS, and ImageMagick are outside the first AppKit-enabling slice."
  - "OHOS configure is forced into autoconf cross mode so CI does not execute unsigned conftest/a.out probes."
  - "Source patch treats empty GNUSTEP_BASE_HAVE_LIBXML as false so clang can compile GSXibKeyedUnarchiver.m with the current GNUstep Base/Make graph."
  - "Recursive GNUstep Make subprojects receive gnustep-base include/lib paths through environment-level ADDITIONAL_INCLUDE_DIRS and ADDITIONAL_LIB_DIRS, preserving subproject-local += include additions."
  - "Transitive runtime dependency include/lib paths, including libobjc2, are exported to recursive GNUstep Make builds for public GNUstep Base headers."
  - "GNUstep GUI tools receive gnustep-base and libobjc2 through ADDITIONAL_TOOL_LIBS so Foundation class symbols resolve during link."
  - "The recipe installs Source first, normalizes libgnustep-gui.so/soname links for GNUstep Make's versioned shared-library naming, and then builds the remaining package subprojects so Tools can resolve -lgnustep-gui on OHOS CI."
  - "Tools/GNUmakefile.preamble is patched so shared tool targets can use a recipe-provided exact staged libgnustep-gui path or wildcard matching under GNUSTEP_SYSTEM_LIBRARIES, Source/obj, or the installed Library/Libraries path before falling back to -lgnustep-gui; the raw -lgnustep-gui token is filtered out of inherited system libs and the package Library/Libraries directory is still appended to recursive link flags."
  - "GNUstep system install variables, including GNUSTEP_HEADERS and GNUSTEP_SYSTEM_LIBRARY, are exported to the package folder so any later install step writes to Library/Headers and Library/Libraries instead of /include and /lib."
  - "GNUstep Make install does not mkdir nested AppKit/Cocoa/GNUstepGUI or gnustep-gui Resources targets, so the recipe pre-creates those directories before the install pass."
  - "To keep Tools linked against the in-tree GUI library, the recipe stages libgnustep-gui aliases after the plain Source build and again after Source install, rewrites Tools/GNUmakefile.preamble directly as a fallback, then passes the exact staged path to Tools as GNUSTEP_GUI_TOOL_LIBS=<path> before continuing with the remaining subprojects."
  - "The staging helper now also accepts plain libgnustep-gui/libgnustep-gui.so build outputs, so Source/obj and Library/Libraries get usable aliases even when GNUstep Make does not emit a dotted versioned filename."
  - "The Tools preamble now prefers a recipe-supplied exact staged path when available, then wildcard candidates, and still accepts symlinked Source build artifacts and plain libgnustep-gui/libgnustep-gui.so aliases as valid link candidates instead of filtering to only regular files."
  - "The release tarball exposes 30 Objective-C test sources, 19 TestInfo files, and 2 GNUmakefiles under Tests/; the discovered inventory is recorded separately from the consumer smoke test."
  - "Path B knowledge drafts shipped with this PR: DRAFT-gnustep-gui-gnustep-env-closure, DRAFT-gnustep-gui-appkit-consumer-closure, DRAFT-gnustep-gui-upstream-test-inventory, DRAFT-gnustep-gui-ohos-autoconf-cross-probe."
  - "Local machine lacks Conan/OHOS build environment; status remains adapted, not built."
