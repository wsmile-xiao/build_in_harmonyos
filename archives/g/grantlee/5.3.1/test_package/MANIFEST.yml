# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）

package: grantlee/5.3.1
homepage: "https://github.com/steveire/grantlee"

# 上游测试命令（CTest 注册）
upstream_check_command: "ctest --output-on-failure（conan create 构建 tree 内）"

# conanfile.py build() 是否已集成上游测试：BUILD_TESTS=ON 随 cmake.build() 编译
upstream_test_in_build: true
upstream_test_command: "cmake --build <builddir>（tests 目录随主构建编译）"

# 上游 add_test 注册（BUILD_TESTS=ON 默认形态，最多 12 个）：
#   templates 8 + scriptabletags 1（需 Qt5Qml，未发布不注册）
#   + internationalization 1（需 Qt5LinguistTools，未发布不注册）
#   + textdocument 2
upstream_tests:
  - file: templates/tests/testsafestring.cpp
    source: grantlee-5.3.1/templates/tests/testsafestring.cpp
    description: "SafeString 语义（add_test: testsafestring）"
    command: "./testsafestring_exec"
  - file: templates/tests/testbuiltins.cpp
    source: grantlee-5.3.1/templates/tests/testbuiltins.cpp
    description: "内建标签/全局（add_test: testbuiltins）"
    command: "./testbuiltins_exec"
  - file: templates/tests/testloadertags.cpp
    source: grantlee-5.3.1/templates/tests/testloadertags.cpp
    description: "include/extends 加载标签（add_test: testloadertags）"
    command: "./testloadertags_exec"
  - file: templates/tests/testdefaulttags.cpp
    source: grantlee-5.3.1/templates/tests/testdefaulttags.cpp
    description: "if/for/block 等默认标签（add_test: testdefaulttags）"
    command: "./testdefaulttags_exec"
  - file: templates/tests/testcachingloader.cpp
    source: grantlee-5.3.1/templates/tests/testcachingloader.cpp
    description: "缓存加载器（add_test: testcachingloader）"
    command: "./testcachingloader_exec"
  - file: templates/tests/testfilters.cpp
    source: grantlee-5.3.1/templates/tests/testfilters.cpp
    description: "内建过滤器（add_test: testfilters）"
    command: "./testfilters_exec"
  - file: templates/tests/testgenerictypes.cpp
    source: grantlee-5.3.1/templates/tests/testgenerictypes.cpp
    description: "泛型类型 QVariant 支持（add_test: testgenerictypes）"
    command: "./testgenerictypes_exec"
  - file: templates/tests/testgenericcontainers.cpp
    source: grantlee-5.3.1/templates/tests/testgenericcontainers.cpp
    description: "泛型容器 QVariant 支持（add_test: testgenericcontainers）"
    command: "./testgenericcontainers_exec"
  - file: templates/tests/testscriptabletags.cpp
    source: grantlee-5.3.1/templates/tests/testscriptabletags.cpp
    description: "脚本化标签（add_test: testscriptabletags；需 Qt5Qml——制品仓 qt5-qtbase/5.15.2 无 Qml 模块，目标不注册，平台豁免）"
    command: "./testscriptabletags_exec"
    skipped_reason: "Qt5Qml 模块未发布（qt5-qtbase 仅 Core/Network/Gui/Test/Concurrent）"
  - file: templates/tests/testinternationalization.cpp
    source: grantlee-5.3.1/templates/tests/testinternationalization.cpp
    description: "i18n 标签（add_test: testinternationalization；需 Qt5LinguistTools——未发布，目标不注册，平台豁免）"
    command: "./testinternationalization_exec"
    skipped_reason: "Qt5LinguistTools 模块未发布"
  - file: textdocument/tests/htmlbuildertest.cpp
    source: grantlee-5.3.1/textdocument/tests/htmlbuildertest.cpp
    description: "HTML 富文本模板（add_test: htmlbuildertest）"
    command: "./htmlbuildertest_exec"
  - file: textdocument/tests/plainmarkupbuildertest.cpp
    source: grantlee-5.3.1/textdocument/tests/plainmarkupbuildertest.cpp
    description: "纯文本标记模板（add_test: plainmarkupbuildertest）"
    command: "./plainmarkupbuildertest_exec"

# test_package 中自带的消费者测试
test_package_tests:
  - file: test_grantlee.cpp
    description: "消费者测试：Grantlee::Engine/Template/Context 渲染链路 5 用例（变量插值/autoescape HTML 转义/for 循环标签/upper 过滤器/未闭合标签错误处理）"
    command: "./test_grantlee"

# 测试断言总数（近似值，用于质量评估）
# 口径：上游 add_test 注册 12（默认形态全量：templates 10 + textdocument 2）；
#       适配后 10 个可注册（2 个因 Qt5Qml/Qt5LinguistTools 未发布豁免）
#       + test_package 5 用例
assertion_count: 17
