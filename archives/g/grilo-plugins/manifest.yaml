# grilo-plugins 软件元数据
# 文件位置: archives/g/grilo-plugins/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: grilo-plugins
name: "Grilo Plugins"
description: "GNOME Grilo 框架的媒体源插件集合"

# ============================================================
# 版本索引
# ============================================================

versions:
  0.3.16:
    status: published
    build_date: "2026-06-16"
    notes: "部分插件启用（dleyna, gravatar），其他插件因缺少依赖被禁用"

# ============================================================
# 软件分类
# ============================================================

category: multimedia
# 可选值: system, development, multimedia, network, graphics, office, science, utils

# ============================================================
# 项目信息
# ============================================================

project:
  homepage: "https://gnome.pages.gitlab.gnome.org/grilo/"
  license: "LGPL-2.1-or-later"
  maintainer: "GNOME Project"

# ============================================================
# 构建特性
# ============================================================

build_features:
  # 构建系统类型
  system: meson

  # 是否需要特殊处理
  special_handling: true
  notes:
    - "使用 Meson 构建系统"
    - "大部分插件依赖 libsoup、lua 等库"
    - "需要设置 PKG_CONFIG_PATH"

  # 平台适配难度
  difficulty: medium
  # easy | medium | hard | very-hard

# ============================================================
# 依赖特性
# ============================================================

dependency_profile:
  # 核心依赖
  core:
    - glib-2.0
    - grilo-0.3

  # 可选依赖（影响插件启用）
  optional:
    - libsoup-3.0
    - libsoup-2.4
    - lua
    - libarchive
    - gstreamer-1.0
    - avahi-client

  # 依赖复杂度
  complexity: high
  # low | medium | high