software: grilo-plugins
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.3.16/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.16"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-16"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/grilo-plugins/0.3/grilo-plugins-0.3.16.tar.xz"

  # 源码校验和
  sha256: "a3f07bf6b1cd5c8e891c7e35d06f65e3e7d7d6a6c0e5a8b5d9c7f8e9a0b1c2d3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson
  build_system: meson

  # 配置选项列表
  configure_options:
    - "-Denable-lua-factory=no"
    - "-Denable-youtube=no"
    - "-Denable-flickr=no"
    - "-Denable-dmap=no"
    - "-Denable-tracker=no"
    - "-Denable-tracker3=no"
    - "-Denable-podcasts=no"
    - "-Denable-magnatune=no"
    - "-Denable-metadata-store=no"
    - "-Denable-bookmarks=no"
    - "-Dhelp=no"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.88.0
    - grilo/0.3.19
    - json-glib/1.6.6
    - libxml2/2.15.3
    - sqlite/3.49.1
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "grilo-plugins 使用 Meson 构建系统，而非 autotools"
  - "需要设置 PKG_CONFIG_PATH 包含本地安装路径"
  - "大部分插件因缺少 libsoup、lua 等依赖被禁用"
  - "默认启用的 lua-factory 插件需要手动禁用（-Denable-lua-factory=no）"
  - "项目没有定义测试套件"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
