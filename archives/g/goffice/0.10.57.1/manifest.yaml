# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "librsvg 在 HarmonyOS PC 不可用（无 Rust 工具链），通过补丁将 librsvg 改为可选依赖 --without-rsvg，并用 GOFFICE_WITH_RSVG 宏守卫相关代码路径"
  - "intltool 需要 XML::Parser perl 模块（HarmonyOS PC 缺失），通过 intltool-merge shim 去除插件 .xml.in 中的翻译标记，并在 Makefile.in 中禁用 po/ 子目录（NLS 禁用）"
  - "GTK+ 栈（gtk+/pango/gdk-pixbuf/atk/harfbuzz/fribidi/libepoxy）由 cmd-pkgs 预编译包提供，需将 GTK_PREFIX/lib/pkgconfig 置于 PKG_CONFIG_PATH 首位以保证 .pc 解析一致"
  - "HMDFS 下 configure 的 ac_tmp/ac_pwd/umask 逻辑需修补（mktemp 权限 022、PWD 回退），否则 conftest 失败"
  - "conan cairo 未启用 glib，需从 cmd-pkgs GTK .pc 中剥离 cairo-gobject 依赖；PkgConfigDeps 仅生成聚合 glib-2.0.pc，需派生 gobject-2.0/gmodule-2.0/gio-2.0 及 cairo-ps/pdf/svg .pc 以满足 configure.ac 检查"

