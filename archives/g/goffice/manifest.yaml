software: goffice
display: "GOffice"
description: "G Office — document-centric objects and utilities (Gnumeric core library)"
category: graphics
homepage: "https://gitlab.gnome.org/GNOME/goffice"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "librsvg 不可用，通过补丁改为可选依赖 --without-rsvg（GOFFICE_WITH_RSVG 宏守卫）"
    - "intltool 需 XML::Parser，通过 intltool-merge shim 禁用 NLS"
    - "GTK+ 栈走 cmd-pkgs，底层库走 conan；GTK_PREFIX/lib/pkgconfig 置于 PKG_CONFIG_PATH 首位"
    - "HMDFS 下需修补 configure 的 ac_tmp/ac_pwd/umask"
  common_dependencies:
    - cairo
    - libgsf
    - gtk+

versions:
  "0.10.57":
    status: built
    build_date: "2026-08-18"
    conan_ref: "goffice/0.10.57"
  "0.10.57.1":
    status: built
    build_date: "2026-08-27"
    conan_ref: "goffice/0.10.57.1"
