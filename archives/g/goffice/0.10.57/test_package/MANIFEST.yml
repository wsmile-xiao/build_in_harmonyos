# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: goffice/0.10.57
homepage: https://gitlab.gnome.org/GNOME/goffice

# 上游测试命令：tests/Makefile.am 的 TESTS 定义 5 个正式测试程序
upstream_check_command: "make check"

# 上游测试已集成到主配方 build()：编译 5 个 TESTS 程序后，把测试二进制连同完整
# DT_NEEDED 闭包部署到独立运行目录（cp -L 按 SONAME 收集 + RUNPATH=$ORIGIN +
# binary-sign-tool ELF 签名），再逐项真实运行。5/5 必须 PASS，不允许 SKIP。
upstream_test_in_build: true
upstream_test_command: "make -C tests test-quad test-math test-format test-dtoa test-decimal"

# 上游测试审计：
# 上游 tests/Makefile.am 声明 check_PROGRAMS = test-quad test-math test-format
# test-dtoa test-decimal constants，其中 TESTS = 前 5 个（constants 为辅助源）。
# 这 5 个测试是纯计算测试（quad 精度数学/数学函数/数字格式化/dtoa/decimal64），
# 源码仅 include <goffice/goffice.h>，不直接依赖 GTK GUI 显示环境。
# 运行期部署方案（本配方 build() 内置，已在 goffice_runtime 实验验证）：
#   1. 复制测试二进制到独立运行目录；
#   2. cp -L 递归收集完整 DT_NEEDED 闭包（按 SONAME 文件名复制真实文件，解引用
#      符号链接——HMDFS 上 loader 无法通过符号链接加载 .so）；
#   3. patchelf 对测试二进制与全部闭包库设置 RUNPATH=$ORIGIN；
#   4. 全部 ELF 重新签名（binary-sign-tool，OHOS 内核要求 codesign 段）；
#   5. bash 逐项运行，退出码 0 = PASS。
# 该方案规避了 OHOS loader namespace 限制（LD_LIBRARY_PATH 被忽略）：闭包自包含
# 在运行目录内，RUNPATH=$ORIGIN 驱动 loader 解析全部依赖。
# 结论：5/5 真实运行 PASS。
upstream_tests_exist: true
upstream_test_audit: |
  审计结论: 上游存在 5 个正式测试程序 (tests/Makefile.am 的 TESTS)。
  本配方在 build() 中编译这 5 个程序并真实运行 (部署 DT_NEEDED 闭包 +
  RUNPATH=$ORIGIN + ELF 签名后逐项执行, 5/5 PASS)。test_package 负责消费者
  smoke test (10/10 断言真实运行 PASS)。

# 上游 5 个正式测试程序（TESTS）的运行结果
upstream_tests:
  - file: tests/test-quad.c
    source: goffice-0.10.57/tests/test-quad.c
    description: "quad 精度数学函数 (go_quad_*) 计算正确性"
    command: "./test-quad"
    compile: PASS
    run: PASS
  - file: tests/test-math.c
    source: goffice-0.10.57/tests/test-math.c
    description: "数学函数 (go_math) 计算正确性"
    command: "./test-math"
    compile: PASS
    run: PASS
  - file: tests/test-format.c
    source: goffice-0.10.57/tests/test-format.c
    description: "数字格式化 (go_format) 输出比对"
    command: "./test-format"
    compile: PASS
    run: PASS
  - file: tests/test-dtoa.c
    source: goffice-0.10.57/tests/test-dtoa.c
    description: "double-to-ascii 转换格式比对"
    command: "./test-dtoa"
    compile: PASS
    run: PASS
  - file: tests/test-decimal.c
    source: goffice-0.10.57/tests/test-decimal.c
    description: "decimal64 (_Decimal64) 运算正确性"
    command: "./test-decimal"
    compile: PASS
    run: PASS

# test_package 自带测试（消费者视角：链接 libgoffice-0.10 + 调用核心 API）
test_package_tests:
  - file: test.c
    description: "链接 libgoffice-0.10.so + 调用 libgoffice_init/libgoffice_shutdown 生命周期 + go_format_get_type/go_format_general 等核心 API (10 项断言)"
    command: "./test_goffice"

# 测试断言总数 (test_package 10 项断言)
assertion_count: 10
