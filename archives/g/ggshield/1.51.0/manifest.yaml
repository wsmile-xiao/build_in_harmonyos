software: ggshield
# 版本级 manifest 模板
# 文件位置: archives/g/ggshield/1.51.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.51.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/51/d5/54067ee60dee03485ceab3f5f3f998fed550ffb087e63a25635797cb0e77/ggshield-1.51.0.tar.gz"

  # 源码校验和
  sha256: "e7f21d6a2693ab7c546f1be84d218e5cd69357ed5ac2e0bfb92fb93cfa367edb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "hatchling/1.30.1"
    - "pathspec/1.1.1"
    - "pluggy/1.6.0"
    - "trove-classifiers/2026.6.1.19"

  # 编译器
  cc: clang
  cxx: clang++

  # 构建方法说明
  build_method: "pip wheel (hatchling backend)"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Python项目使用hatchling构建后端，pip wheel方式构建"
  - "pip在OpenHarmony上因SSL证书问题无法正常使用，需手动下载wheel并unzip安装"
  - "ggshield是纯Python项目（无C扩展），wheel构建需要hatchling及其3个依赖"
  - "ggshield运行依赖约20个Python包(pygitguardian, charset-normalizer, cryptography等)，预编译包不包含运行时依赖"