software: gnu-barcode
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.99/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.99"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/barcode/barcode-0.99.tar.gz"

  # 源码校验和
  sha256: "7c031cf3eb811242f53664379aebbdd9fae0b7b26b5e5d584c31a9f338154b64"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.am.patch"
  - "0002-Makefile.in.patch"
  - "0003-barcode.h.patch"
  - "0004-build-aux-config.guess.patch"
  - "0005-build-aux-config.sub.patch"
  - "0006-configure.patch"
  - "0007-library.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 需手动修补支持 HarmonyOS（旧版 2013 不含 OHOS 分支）"
  - "umask 077 导致 config.status 访问临时 awk 脚本 Permission denied，需改为 umask 022"
  - "barcode.h 中 'int streaming;' 声明导致重复符号，需改为 'extern int streaming;'"
  - "VPATH 构建中 -Ilib 相对路径失效，需改为 -I$(srcdir)/lib"
  - "noinst_LTLIBRARIES 不安装库文件，需在 package() 手动 copy libbarcode.a"
  - "HarmonyOS 禁止 mkfifo，make 并行构建需使用 -j1 禁用 jobserver"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/gnu-barcode-0.99.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/gnu-barcode-0.99.work
  source_orig_hash: 26ccbcfd7370df01
  source_work_hash: 57902d0d33be4ee1
  generated_at: '2026-06-30T17:25:30'
  patches_count: 7

