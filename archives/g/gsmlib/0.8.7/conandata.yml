# conandata.yml — gsmlib 0.8.7
# URL/SHA-256 verified from upstream master tarball (no 0.8.7 tag upstream;
# task binds version 0.8.7 with official URL https://github.com/vbouchaud/gsmlib)

sources:
  url:
    - "https://gh-proxy.com/https://github.com/vbouchaud/gsmlib/archive/refs/heads/master.tar.gz"
    - "https://github.com/vbouchaud/gsmlib/archive/refs/heads/master.tar.gz"
  sha256: "cee4f8c2ee27fa2aa8aa67cefaab6ab904e9de21f5826316ce174f0cbe4044dc"

patches:
  - patch_file: "patches/0001-apps-Makefile.in.patch"
    patch_description: "apps/Makefile.in: add -I$(top_srcdir) so <gsmlib/...> headers resolve in build dir"
    patch_type: "portability"
  - patch_file: "patches/0002-ext-Makefile.in.patch"
    patch_description: "ext/Makefile.in: add -I$(top_srcdir) so <gsmlib/...> headers resolve in build dir"
    patch_type: "portability"
  - patch_file: "patches/0003-gsmlib-Makefile.in.patch"
    patch_description: "gsmlib/Makefile.in: add -I$(top_srcdir) so <gsmlib/...> headers resolve in build dir"
    patch_type: "portability"
  - patch_file: "patches/0004-gsmlib-gsm_sms_codec.cc.patch"
    patch_description: "SMSDecoder: delete[] _p (allocated with new[]) — fixes alloc-dealloc-mismatch SIGSEGV in SMS decode tests"
    patch_type: "bugfix"
  - patch_file: "patches/0005-configure-confstat-tmpdir.patch"
    patch_description: "configure (Autoconf 2.59 config.status): confstat 临时目录改为 ${TMPDIR:-.}，使 CI 沙箱可用 TMPDIR 指向保留 POSIX 权限位的可写挂载点，避免构建 cwd 内 0700 私有目录 EACCES"
    patch_type: "portability"
  - patch_file: "patches/0006-scripts-config.guess.patch"
    patch_description: "config.guess: recognize HarmonyOS system, emit aarch64-unknown-linux-ohos (E007)"
    patch_type: "portability"
  - patch_file: "patches/0007-scripts-config.sub.patch"
    patch_description: "config.sub: recognize linux-ohos triplet and aarch64 machine (E007)"
    patch_type: "portability"
  - patch_file: "patches/0008-tests-Makefile.in.patch"
    patch_description: "tests/Makefile.in: add -I$(top_srcdir) so <gsmlib/...> headers resolve in build dir"
    patch_type: "portability"