# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gsmlib/0.8.7
homepage: "https://github.com/vbouchaud/gsmlib"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 消费者验证用例（本库新增，单独计数）
consumer_test:
  source: "test_gsmlib.cpp"
  command: "cmake -S test_package -B build && cmake --build build && ctest --test-dir build"
  public_api: "gsmlib::Address::toString(), gsmlib::SMSEncoder::getHexString(), gsmlib::SMSDecoder"
