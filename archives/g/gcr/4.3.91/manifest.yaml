software: gcr
version: 4.3.91
status: published
build_date: "2026-05-25"
source_url: https://download.gnome.org/sources/gcr/4.3/gcr-4.3.91.tar.xz
build_system: meson

dependencies:
  - name: glib
    version: 2.88.0
    required: true
  - name: p11-kit
    version: 0.25.5
    required: true
  - name: libgcrypt
    version: 1.10.3
    required: true
  - name: libgpg-error
    version: 1.61
    required: true

build_config:
  compiler: clang
  meson_options:
    - "-Dgpg_path=/bin/false"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Dgtk_doc=false"
    - "-Dgtk4=false"
    - "-Dssh_agent=false"
    - "-Dcrypto=libgcrypt"

products:
  libraries:
    - name: libgck-2.so.2.3.91
      size: 11MB
      description: PKCS#11 wrapper library
    - name: libgcr-4.so.4.3.91
      size: 11MB
      description: Certificate and key handling library
  tools:
    - name: gcr4-ssh-askpass
      description: SSH askpass helper

patches_applied:
  - "0001-console-interaction-ohos-getpass.patch"

notes:
  - "OpenHarmony lacks getpass() function, added compatibility implementation"
  - "Disabled introspection, gtk4, and vapi to simplify build"
  - "GPG functionality disabled for build purposes"

pkgconfig:
  gck-2: 4.3.91
  gcr-4: 4.3.91