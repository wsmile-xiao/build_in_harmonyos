software: gobject-introspection
# 版本级 manifest
# 文件位置: archives/g/gobject-introspection/1.80.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.80.1"
status: built
build_date: "2026-09-18"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.gnome.org/sources/gobject-introspection/1.80/gobject-introspection-1.80.1.tar.xz"
  sha256: "a1df7c424e15bda1ab639c00e9051b9adf5cea1a9e512f8a603b53cd199bc6d8"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "--wrap-mode=nofallback"
    - "-Dbuild_introspection_data=true"
    - "-Dcairo=disabled"
    - "-Ddoctool=disabled"
  dependencies:
    - "glib/2.84.0.2"
    - "zlib/1.3.1.1.1.1"
    - "libintl/0.26.1"
    - "python/3.12.9"
    - "libffi/3.5.2"
  build_dependencies:
    - "flex/2.6.4.2"
    - "bison/3.8.2"
  cc: clang
  cxx: clang++

# ============================================================
# 测试结果
# ============================================================

test_results:
  upstream:
    # 上游 tests/scanner 组（9 个纯 Python unittest 文件）—— 已实测
    # 申报口径按项目规则 = 上游 def test_ 函数数（非文件数）
    files: 9
    registered: 76          # def test_ 函数总数
    ran: 76
    ok: 71
    expected_fail: 2
    skipped: 3
    fail: 0
    errors: 0
    command: "python3 tests/scanner/<file>.py（配方 build() 内 _run_upstream_scanner_tests 逐个实测）"
    verified: "2026-09-18"
    # 规范口径 = passed/(passed+failed+errors) = 71/71 = 100%
    passed_ratio_canonical: "71/71 (100%)"
    passed_ratio_including_skips: "71/76 (93.4%)"
  # 上游 tests/warn 组（19 个夹具）—— 本版**新增实测**
  # 关键区分：本组与 offsets/repository 不是一类。warningtester.py 是纯 Python，
  # 只 import giscanner.*，不加载 typelib、不 dlopen 上游共享库；夹具唯一系统依赖是
  # common.h 的 <glib-object.h>（glib 为本配方现成依赖）。故无平台阻塞。
  upstream_warn:
    fixtures: 19
    ran: 19
    ok: 19
    fail: 0
    command: "python3 warningtester.py <fixture.h>（配方 build() 内 _run_upstream_warn_tests；夹具集解析自上游 tests/warn/meson.build 的 warn_tests，不硬编码）"
    verified: "2026-09-26"
    note: >-
      每个夹具逐条比对内嵌 `// EXPECT:` 声明的期望告警（数量 + 文本均须一致）。
      上一版把本组与 offsets/repository 一起当「需 GLib/GObject/Gio typelib」裁剪，
      该归因不成立 —— 本组不加载任何 typelib。
  # 全量分母（口径修正：上一版 82 → 100）
  full_test_denominator:
    total_all: 100          # 76(scanner def test_) + 1(offsets) + 4(repository) + 19(warn)
    measured_and_passed: 95 # scanner 76 + warn 19，均已实际执行并全通过
    never_run: 5            # offsets 1 + repository 4 —— 不得计为通过
    note: >-
      上一版 total_all 写 82，其中把 warn 记成 1（只数了脚本文件 warningtester.py），
      而同表 offsets/repository 用的是「meson 注册的 test() 目标数」——三个组计量
      单位不一致，导致少算 18 项。按同一把尺子 warn = 19（warn_tests 列表 19 项，
      foreach 各注册一个 warn-<name>），故全量分母 = 100。
  # offsets / repository 两组：本环境无法运行，逐条归因（见 notes.md）
  # 注：warn 组原也在本列表内，其实测无平台阻塞（纯 Python giscanner 路径），
  #     已移入上方 upstream_warn 并真跑通过。
  upstream_not_run:
    suites: ["tests/offsets", "tests/repository"]
    count: 5
    reason: >-
      这两组是**编译型 C 测试**，在 1.80 下**可以链接构建**（girepository 已为共享库），
      但运行期需要 GLib/GObject/Gio 的 typelib，而这些 typelib 自 glib 2.80 起
      由 glib 自身提供；本仓 glib 配方显式 introspection=disabled（0 typelib），
      故运行期报 "Typelib file for namespace 'Gio' not found" 并因
      G_DEBUG=fatal-warnings abort（Signal 5）。gitestoffsets 另需两个命令行参数。
    evidence: "tests/repository/gitestrepo → ERROR **: Typelib file for namespace 'Gio' (any version) not found"
  test_package:
    assertions: 10
    passed: 10
    fail: 0
    verified: "2026-09-18"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0002-giscanner-ccompiler.py.patch"

# 说明：1.78.1.1 的 0001（shared→static）已删除（1.80 上游即 shared_library）；
#       0003（条件化 _giscanner）与 0004（harmonyos 平台 + tests 闸）因 1.80
#       目标上下文格式变化，改为 conanfile.py build() 内联改写。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "glib:sync-func/async-func/finish-func 三个 GIR 注解为 gobject-introspection 1.80.0 引入；glib 的 girparser 只认这三个显式属性，无按 _async 后缀推断的兜底 → 1.78 生成的 GIR 中 Gio 异步方法 is_async 恒 FALSE（上游 callable-info 测试 SIGABRT）"
  - "1.80 上游 girepository/meson.build 直接用 shared_library('girepository-1.0')，1.78 那个 shared→static 的补丁在 1.80 不再需要"
  - "1.80 的 giscanner/meson.build 强制 find_program('flex'/'bison')（1.78 无此要求），需新增 tool_requires"
  - "1.80 的 meson.build 对 Python>=3.12 硬检查 setuptools（conan python 不带），沿用 vendored gi-distutils 方案并注释掉该检查"
  - "签名 glob 必须用 '**/*.so*' 而非 '**/*.so'：版本化实体库（libgirepository-1.0.so.1.0.0）不以 .so 结尾，漏签则 dlopen 报 Permission denied —— 1.78.1.1 因 girepository 是静态库而从未暴露此缺陷"
  - "1.80 上游把 GLib/GObject/Gio/GModule 的 GIR 移入 uninstalled_gir_files（不随包安装），这四个核心 typelib 自 glib 2.80 起由 glib 提供"

# ============================================================
# 平台限制
# ============================================================

platform_limitations:
  - "运行时需设置 LD_LIBRARY_PATH（glib/libintl/libpython 等共享库）"
  - "构建期 gir 生成需 giscanner 置于 conan python 的 lib-dynload 并签名（鸿蒙 loader 白名单按进程绑定，b/ 与 p/ 路径外的共享库不可 dlopen）"
