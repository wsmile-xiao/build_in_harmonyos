# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gobject-introspection/1.78.1.1
homepage: "https://gi.readthedocs.io/"

# 上游测试命令（meson test）
# 注：本变体（开启 introspection）meson 配置为 build_introspection_data=true，
# 但 subdir('tests') 被跳过（girepository 静态、tests 静态链接缺 gobject/gio
# 依赖符号），故不通过 meson test 运行，改由配方 build() 内实测可运行子集。
upstream_check_command: "meson test -C builddir"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  # ── 类别 1：scanner 组 9 个纯 Python unittest —— 已实测（rule4 整改）──
  # 仅 import giscanner（本变体已签名置于 conan python lib-dynload）+
  # vendored distutils，不依赖 C 编译 / typelib 生成。配方 build() 中
  # _run_upstream_scanner_tests() 逐个运行，运行数与通过率输出到 CI 日志
  # （UPSTREAM-SCANNER-TESTS: N/N passed）。测试文件（1.78.1 上游分发）：
  - file: tests/scanner/test_ccompiler.py
    source: gobject-introspection-1.78.1/tests/scanner/test_ccompiler.py
    description: "scanner 纯 Python unittest：CCompiler 命令构造与 spawn 参数"
    command: "python3 tests/scanner/test_ccompiler.py（配方 build() 内实测）"
  - file: tests/scanner/test_shlibs.py
    source: gobject-introspection-1.78.1/tests/scanner/test_shlibs.py
    description: "scanner 纯 Python unittest：ldd 输出解析 / 共享库路径规范化"
    command: "python3 tests/scanner/test_shlibs.py（配方 build() 内实测）"
  - file: tests/scanner/test_sourcescanner.py
    source: gobject-introspection-1.78.1/tests/scanner/test_sourcescanner.py
    description: "scanner 纯 Python unittest：SourceScanner 解析 C 声明/注释"
    command: "python3 tests/scanner/test_sourcescanner.py（配方 build() 内实测）"
  - file: tests/scanner/test_transformer.py
    source: gobject-introspection-1.78.1/tests/scanner/test_transformer.py
    description: "scanner 纯 Python unittest：AST Transformer（typedef/struct/union/数组）"
    command: "python3 tests/scanner/test_transformer.py（配方 build() 内实测）"
  - file: tests/scanner/test_xmlwriter.py
    source: gobject-introspection-1.78.1/tests/scanner/test_xmlwriter.py
    description: "scanner 纯 Python unittest：GIR XMLWriter 输出"
    command: "python3 tests/scanner/test_xmlwriter.py（配方 build() 内实测）"
  - file: tests/scanner/test_pkgconfig.py
    source: gobject-introspection-1.78.1/tests/scanner/test_pkgconfig.py
    description: "scanner 纯 Python unittest：pkg-config 参数拼接与输出解析"
    command: "python3 tests/scanner/test_pkgconfig.py（配方 build() 内实测）"
  - file: tests/scanner/test_docwriter.py
    source: gobject-introspection-1.78.1/tests/scanner/test_docwriter.py
    description: "scanner 纯 Python unittest：DocWriter 构建（缺 mako 时 skip）"
    command: "python3 tests/scanner/test_docwriter.py（配方 build() 内实测）"
  - file: tests/scanner/test_scanner.py
    source: gobject-introspection-1.78.1/tests/scanner/test_scanner.py
    description: "scanner 纯 Python unittest：scannermain get_source_root_dirs"
    command: "python3 tests/scanner/test_scanner.py（配方 build() 内实测）"
  - file: tests/scanner/test_maintransformer.py
    source: gobject-introspection-1.78.1/tests/scanner/test_maintransformer.py
    description: "scanner 纯 Python unittest：MainTransformer 弃用注解处理"
    command: "python3 tests/scanner/test_maintransformer.py（配方 build() 内实测）"
  # ── 类别 2：offsets / repository / warn 组 —— 按类别 1-e 归因（未实测）──
  # 依据（证据）：
  #  a) 本变体依赖本地 libgirepository-1.0 为静态库，gir/meson.build 中
  #     GIRepository-2.0.gir 已跳过（静态库无法解析为共享，conanfile.py 注释）；
  #  b) 上游 tests/meson.build 的 subdir('tests') 在本变体 meson.build 中
  #     被跳过：tests 的共享库/可执行在静态链接下缺 gobject/gio 依赖符号
  #     （conanfile.py build() 注释），meson test 无法构建与运行；
  #  c) 故 offsets（需编译 offsets-1.0.so + gitestoffsets 链接 girepository）、
  #     repository（gitestrepo/giteststructinfo/gitestthrows/gitypelibtest
  #     C 用例，需链接 girepository）、warn（warningtester.py 需 g-ir-scanner
  #     处理 19 个 .h 并依赖完整 include/gir 环境）均无法在本变体构建环境
  #     中编译运行，按类别归因（非“记录不运行”笼统带过）。
  - file: tests/offsets/test_offsets.py
    source: gobject-introspection-1.78.1/tests/offsets/test_offsets.py
    description: "offsets 组：需编译 offsets-1.0 测试库 + g-ir-scanner/compiler + gitestoffsets（链接静态 girepository），本变体跳过 subdir('tests')，1-e 归因"
    command: "（未运行，归因见上）"
  - file: tests/repository/gitestrepo.c
    source: gobject-introspection-1.78.1/tests/repository/gitestrepo.c
    description: "repository 组：C 用例需编译并链接 girepository（静态库），1-e 归因"
    command: "（未运行，归因见上）"
  - file: tests/warn/warningtester.py
    source: gobject-introspection-1.78.1/tests/warn/warningtester.py
    description: "warn 组：19 个 .h 警告用例，需 g-ir-scanner 完整 include/gir 环境，1-e 归因"
    command: "（未运行，归因见上）"

# test_package 中自带的测试 (消费者视角验证，R34 实质调用被测包)
test_package_tests:
  - file: conanfile.py
    description: "GI 基础设施验证：校验 GLib/GObject/Gio typelib 与 g-ir 工具链存在，并实际运行 g-ir-compiler"

# 测试断言总数
assertion_count: 6
