# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gobject-introspection/1.78.1
homepage: "https://gi.readthedocs.io/"

# 上游测试命令
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/offsets/gitestoffsets.c
    source: gobject-introspection-1.78.1/tests/offsets/gitestoffsets.c
    description: "Offsets test — verifies struct layout introspection"
    command: "./gitestoffsets"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Run g-ir-compiler --version — verifies binary links against libgirepository-1.0.a and all static deps"
    command: "g-ir-compiler --version"

# 测试断言总数
assertion_count: 1
