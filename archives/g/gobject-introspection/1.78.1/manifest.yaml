software: gobject-introspection
# 版本级 manifest
# 文件位置: archives/g/gobject-introspection/1.78.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.78.1"
status: built
build_date: "2026-08-06"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.gnome.org/sources/gobject-introspection/1.78/gobject-introspection-1.78.1.tar.xz"
  sha256: "bd7babd99af7258e76819e45ba4a6bc399608fe762d83fde3cac033c50841bb4"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "--wrap-mode=nofallback"
    - "-Dbuild_introspection_data=false"
    - "-Dcairo=disabled"
    - "-Ddoctool=disabled"
    - "default_library=static"
  dependencies:
    - glib2/2.88.0
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-girepository-meson.build.patch"
  - "0002-giscanner-ccompiler.py.patch"
  - "0003-giscanner-meson.build.patch"
  - "0004-meson.build.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Python 3.12 移除 distutils.msvccompiler，需修改为 _msvccompiler"
  - "鸿蒙系统 host_system 为 'harmonyos'，需要在平台检查中添加"
  - "glib2 及其依赖为静态库无 -fPIC，girepository 需改为 static_library"
  - "hmmac 安全标签阻止 Python 扩展模块 dlopen（E212）"

# ============================================================
# 平台限制
# ============================================================

platform_limitations:
  - "Python 扩展模块无法被 Python 直接加载（hmmac 安全标签限制，E212）"
  - "introspection 数据生成功能在构建时禁用（工具仍安装，可在有 hnp 路径权限时生成）"
  - "运行时需要设置 LD_LIBRARY_PATH"
