software: gobject-introspection
# 版本级 manifest 模板
# 文件位置: archives/g/gobject-introspection/1.78.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.78.1"
status: built
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.gnome.org/sources/gobject-introspection/1.78/gobject-introspection-1.78.1.tar.xz"
  sha256: ""
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--wrap-mode=nofallback"
    - "-Dbuild_introspection_data=false"
  dependencies:
    - meson/1.11.1
    - glib/2.88.0
    - libffi/3.4.6
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "python3.12-compat.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Python 3.12 移除 distutils.msvccompiler，需修改为 _msvccompiler"
  - "鸿蒙系统 ELF 签名导致 Python 扩展模块无法加载"

# ============================================================
# 平台限制
# ============================================================

platform_limitations:
  - "Python 扩展模块无法被 Python 直接加载（ELF 签名问题）"
  - "introspection 数据生成功能已禁用"
  - "运行时需要设置 LD_LIBRARY_PATH"
