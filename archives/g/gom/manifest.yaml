software: gom
display: "gom"
description: "GObject to SQLite object mapper library (GNOME)"
category: library
homepage: "https://gitlab.gnome.org/GNOME/gom"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建，依赖 glib/gobject/gio 与 sqlite3"
    - "顶层 meson.build 无条件依赖 gdk-pixbuf-2.0，需随包构建"
    - "禁用 introspection 与 gtk-doc 避免额外工具链"
  common_dependencies:
    - glib
    - sqlite3
    - gdk-pixbuf

versions:
  "0.5.4":
    status: built
    build_date: "2026-08-15"
