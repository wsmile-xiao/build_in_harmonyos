software: gst-plugins-base
display: "GStreamer Base Plugins"
description: "A set of well-maintained GStreamer plugins and libraries"
category: multimedia
homepage: "https://gstreamer.freedesktop.org/"
license: LGPL
build_system: meson

ohos_adaptation:
  key_points:
    - "使用 meson 构建系统，需 meson 1.4+ 和 ninja"
    - "HMDFS/SELinux 环境下 Python 脚本无法直接执行，需通过 python3 解释器调用"
    - "依赖 gstreamer/1.28.3, glib2/2.88.0, orc/0.4.42, libogg, libvorbis, opus, alsa-lib, libx11/6.4.0, libxext/6.4.0, libxv, libxi, libdrm, iso-codes"
    - "需创建 glib2 和 gstreamer 子包的 pkg-config wrapper .pc 文件"
    - "NLS 禁用（OHOS 无 gettext），通过 c_args stub gettext/ngettext 宏"
    - "启用 ogg, vorbis, opus, alsa, orc, x11, xshm, xvideo, xi, drm, iso-codes（依赖已发布）"
    - "X11 栈须用 6.x 版本线（libx11/6.4.0），libxv/libxi/libxext 全部钉该线"
    - "禁用 pango（glib/glib2 双包生态冲突）、gl（无 GL API 库发布）、theora/libvisual/tremor/cdparanoia/qt5（依赖未发布）"
  common_dependencies:
    - gstreamer/1.28.3
    - glib2/2.88.0

versions:
  "1.28.3":
    status: built
    build_date: "2026-09-17"
    notes: "第二轮启用 X11 视频输出(ximagesink/xvimagesink)、DRM 分配器、iso-codes 语言名；40 .a / 41 .pc 产物；剩余禁用项均为依赖生态缺口（见版本级 notes.md）"
