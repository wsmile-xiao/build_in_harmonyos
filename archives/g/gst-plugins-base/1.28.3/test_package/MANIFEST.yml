# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gst-plugins-base/1.28.3
homepage: "https://gstreamer.freedesktop.org/"

# 上游测试命令
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/check/elements/audioconvert.c
    source: gst-plugins-base-1.28.3/tests/check/elements/audioconvert.c
    description: "audioconvert element test"
    command: "meson test audioconvert"
  - file: tests/check/libs/audio.c
    source: gst-plugins-base-1.28.3/tests/check/libs/audio.c
    description: "audio library test"
    command: "meson test audio"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 - 验证 gst_init(), gst_version_string(), gst_pb_utils_init(), gst_audio_format_get_info(), gst_video_format_get_info() 共 5 个 API 调用（其中 3 个带显式 g_assert 断言）"
    command: "./test_gst_plugins_base"

# 已验证 API 调用数（口径：被测 API 调用数；显式 g_assert 断言为 3 处）
assertion_count: 5
