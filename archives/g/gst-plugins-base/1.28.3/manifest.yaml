software: gst-plugins-base
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.28.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.28.3"
build_system: meson
status: built
build_date: "2026-09-17"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://gstreamer.freedesktop.org/src/gst-plugins-base/gst-plugins-base-1.28.3.tar.xz"
  sha256: "27880f3d87efa3bb5aa5f99f7ef6e4be7c95229f44eee928c1633d32e87d0099"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Ddefault_library=static"
    - "-Dnls=disabled"
    - "-Dexamples=disabled"
    - "-Dtests=disabled"
    - "-Dtools=disabled"
    - "-Ddoc=disabled"
    - "-Dintrospection=disabled"
    - "-Dorc=enabled"
    - "-Dorc-compiler=disabled"
    - "-Dogg=enabled"
    - "-Dvorbis=enabled"
    - "-Dopus=enabled"
    - "-Dalsa=enabled"
    - "-Dx11=enabled"
    - "-Dxshm=enabled"
    - "-Dxvideo=enabled"
    - "-Dxi=enabled"
    - "-Ddrm=enabled"
    - "-Diso-codes=enabled"
    - "-Dpango=disabled"
    - "-Dtheora=disabled"
    - "-Dgl=disabled"
    - "-Dcdparanoia=disabled"
    - "-Dlibvisual=disabled"
    - "-Dtremor=disabled"
    - "-Dqt5=disabled"
    - "-Dglib_assert=false"
    - "-Dglib_checks=false"
    - "-Dglib_debug=disabled"

  dependencies:
    - gstreamer/1.28.3
    - glib2/2.88.0
    - orc/0.4.42
    - libogg/1.3.6
    - libvorbis/1.3.7
    - opus/1.5.2.1
    - alsa-lib/1.2.16.1
    - libx11/6.4.0
    - libxext/6.4.0
    - libxv/1.0.13
    - libxi/6.1.0
    - libdrm/2.4.133
    - iso-codes/4.20.1

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson.build-python3-scripts.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS 环境下 Python 脚本需通过 python3 解释器调用"
  - "glib2 conan 包不提供 gobject-2.0/gio-2.0 等子包 .pc 文件，需手动创建"
  - "gstreamer conan 包不提供 gstreamer-1.0/gstreamer-base-1.0 等子包 .pc 文件，需手动创建"
  - "orc conan 包需创建 orc-0.4.pc wrapper（pkg-config 名称不匹配）"
  - "libogg/libvorbis/alsa-lib conan 包需创建 .pc wrapper（名称不匹配）"
  - "OHOS 无 gettext，通过 c_args stub gettext/ngettext 宏"
  - "PkgConfigDeps 生成的空壳 iso-codes.pc 会遮蔽包自带 pc 且缺 domains/prefix 变量，须在 generate() 覆盖（prefix 指向 conan 包目录）"
  - "libdrm conan 包无 pkg_config_name，需 wrapper 且双 include 目录（include/ + include/libdrm/）"
  - "X11 栈两条版本线：libxv/libxi/libxext 全部钉 libx11/6.4.0，消费方必须用 6.x 线（1.8.13 线无扩展库引用）"
  - "libxi/1.8.3 缺 libxfixes 声明致 XInput2.h 编译失败，用 libxi/6.1.0（transitive_headers 修复）"
