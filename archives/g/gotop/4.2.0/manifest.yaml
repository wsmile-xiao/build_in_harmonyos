software: gotop
version: "4.2.0"
build_system: custom
status: built
build_date: "2026-05-26"

source:
  url: "https://github.com/xxxserxxx/gotop/archive/refs/tags/v4.2.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options: []
  dependencies:
    - go/1.24.4
  cc: clang
  cxx: clang++
  build_command: "CGO_ENABLED=0 go build -ldflags='-X main.Version=4.2.0 -X main.BuildDate=2026-05-26' -o gotop ./cmd/gotop"
  go_specific:
    tmpdir_must_be_hmfs: true
    cgo_enabled: false

patches_applied: []

knowledge_gained:
  - "Go链接器需要hmfs文件系统的TMPDIR/GOTMPDIR/GOCACHE（HMDFS不支持mmap写操作） ref:E090"
  - "gotop是纯Go项目，使用go build构建，无Makefile ref:E090"
  - "codeload.github.com可访问（当github.com超时时） ref:E090"
