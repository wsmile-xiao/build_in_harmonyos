software: gtk
display: "GTK+ 3"
description: "GIMP Toolkit — a multi-platform toolkit for creating graphical user interfaces"
category: gui
homepage: "https://www.gtk.org/"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "上游为 meson 构建（无 autotools），init-build 按 URL 误判 autotools，需手写 meson 配方"
    - "OHOS 无 X11/Wayland/Quartz/Win32 原生显示后端，启用 broadway(HTML5) 后端替代"
    - "glib 构建时工具（glib-mkenums/glib-genmarshal）包装为 native 可执行 wrapper（gdk-pixbuf 同款方案）"
    - "PkgConfigDeps 后补转发型别名 .pc，供消费方 dependency('gtk+-3.0') 检测（同 E321 手法）"
    - "官方源 download.gnome.org + 华为云镜像 fallback（R39）；包名 gtk 首字母 g，h/gtkplus 为误判已纠正"
  common_dependencies:
    - glib
    - cairo
    - pango
    - atk
    - gdk-pixbuf
    - fribidi
    - libepoxy

versions:
  "3.24.43":
    status: built
    build_date: "2026-08-21"
