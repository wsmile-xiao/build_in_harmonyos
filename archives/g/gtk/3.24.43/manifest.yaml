version: "3.24.43"
software: "gtk"
status: built
build_date: "2026-08-21"
conan_ref: "gtk/3.24.43"
build_system: "meson"
source:
  url: "https://download.gnome.org/sources/gtk+/3.24/gtk+-3.24.43.tar.xz"
  sha256: "7e04f0648515034b806b74ae5d774d87cffb1a2a96c468cb5be476d51bf2f3c7"
  tar_format: tar.xz
  mirror_url: "https://repo.huaweicloud.com/gnome/sources/gtk+/3.24/gtk+-3.24.43.tar.xz"
build:
  system: meson
  configure_options:
    - "-Dx11_backend=false"
    - "-Dwayland_backend=false"
    - "-Dbroadway_backend=true"
    - "-Dwin32_backend=false"
    - "-Dquartz_backend=false"
    - "-Dxinerama=no"
    - "-Dcloudproviders=false"
    - "-Dprofiler=false"
    - "-Dintrospection=false"
    - "-Dgtk_doc=false"
    - "-Dman=false"
    - "-Ddemos=false"
    - "-Dexamples=false"
    - "-Dtests=false"
  dependencies:
    - glib/2.84.0.1
    - cairo/1.18.4
    - cairo-gobject/1.18.4.2
    - pango/1.50.14.1.1
    - gdk-pixbuf/2.44.6.1
    - atk/2.38.0.1.1
    - fribidi/1.0.16
    - libepoxy/1.5.10
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "GTK+ 3.24.43 上游为 meson，无 autotools；init-build 误判为 autotools，需手写 meson 配方"
  - "鸿蒙无 X11/Wayland，启用 broadway 后端；禁用 xinerama/cloudproviders/introspection"
  - "glib 构建工具（glib-mkenums 等）需包装为 native 可执行（gdk-pixbuf 同款方案）"
  - "官方源为 download.gnome.org，镜像 repo.huaweicloud.com，R39 认可"
  - "包名 gtk 首字母 g，归档 archives/g/gtk/3.24.43， h/gtkplus 误判已纠正为 g/gtk（R42 首字母与包名一致）"
  - "冒烟测试仅覆盖版本/类型注册 API，不初始化显示后端；broadway 运行时行为（gtk_init/broadwayd 会话）需人工确认适配完整性（R40，AI 检视 P3）"
