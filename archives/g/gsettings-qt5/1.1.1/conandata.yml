# conandata.yml — gsettings-qt5 1.1.1
# 官方上游（UBports / Debian UBports Team）GitLab 归档源；sha256 为本地实测值。
# 与同上游的 Qt6 变体包 archives/g/gsettings-qt/1.1.1 使用同一 tarball。

sources:
  url: "https://gitlab.com/ubports/development/core/gsettings-qt/-/archive/v1.1.1/gsettings-qt-v1.1.1.tar.gz"
  sha256: "636cff4336b8729f805bd1cb6904a4c140b69d8a8063949c61f39f8431fe9d00"

patches:
  - patch_file: "patches/0001-ohos-optional-qmlplugindump.patch"
    patch_description: >-
      OHOS 的 Qt5 链不存在 qmlplugindump 宿主工具（qt5-qtdeclarative 包不含 bin/），
      而上游 GSettings/CMakeLists.txt 以 REQUIRED 查找它、cmake-extras 的
      QmlPluginsConfig.cmake 亦在其缺失时 FATAL_ERROR。补丁把该查找改为可选：
      缺失时提供占位 imported target，并跳过（可选的）plugins.qmltypes 元数据
      生成；QML 插件本体在 Qt5 下照常编译安装。
    patch_type: portability
    patch_source: "https://gitlab.com/ubports/development/core/gsettings-qt"
