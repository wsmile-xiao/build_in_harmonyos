# 版本级 manifest — gsettings-qt5 1.1.1（HarmonyOS PC / arm64）
# 文档位置: archives/g/gsettings-qt5/1.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
#
# 包名说明：本包 = 上游 gsettings-qt 1.1.1 的 **Qt5** 变体（上游默认构建模式）。
# 制品仓另有 archives/g/gsettings-qt/1.1.1（同上游、Qt6 模式，产出
# libgsettings-qt6 + gsettings-qt6.pc）。二者源 tarball 相同（同一 sha256），
# 仅 Qt 主版本不同，为 Qt5 下游（kylin-calendar）提供可链接的 ABI。

version: "1.1.1"
software: gsettings-qt5
status: built
build_date: "2026-10-08"
build_system: cmake

source:
  url: "https://gitlab.com/ubports/development/core/gsettings-qt/-/archive/v1.1.1/gsettings-qt-v1.1.1.tar.gz"
  sha256: "636cff4336b8729f805bd1cb6904a4c140b69d8a8063949c61f39f8431fe9d00"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_QT6=OFF"       # 上游默认即 Qt5；显式声明以固定 Qt5 链
    - "-DENABLE_WERROR=OFF"    # clang 15 下 -Wall -Wextra -pedantic 不作为门禁
    - "-DBUILD_TESTING=ON"     # 构建并真实执行上游 ctest 用例
  dependencies:
    - qt5-qtbase/5.15.2.2         # Qt5::Core（qgsettings.h 公开暴露 QObject/QVariant）+ bin/moc
    - qt5-qtdeclarative/5.15.2    # Qt5::Qml（QML 插件）+ Qt5QuickTest（上游 qmltest）+ qml/ 模块
    - glib/2.88.0                 # gio-2.0（源码 <gio/gio.h>；.pc Requires: gio-2.0）+ bin/glib-compile-schemas
  build_tools:
    - pkgconf/3.0.6               # find_package(PkgConfig REQUIRED)
    - cmake-extras/1.9            # CMake 模块 QmlPlugins（add_qmlplugin）
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-optional-qmlplugindump.patch"   # qmlplugindump 在 OHOS Qt5 链缺失 → 改为可选查找

knowledge_gained:
  - "Qt5 生态在本制品仓被拆包：qt5-qtbase 提供 Qt5::Core/Test 与原生 Qt5 config，qt5-qtdeclarative **没有原生 Qt5QmlConfig.cmake**（package_info 仅声明 cmake_file_name=Qt5Qml），CMakeDeps 只生成一个 package 级 Qt5QmlConfig.cmake。上游 find_package(QT NAMES Qt5 COMPONENTS Core Qml) 会『成功但无 Qt5::Qml 目标』，且 CMakeDeps 的 Qt5Config 不提供 AUTOMOC 所需 moc 目标 / Qt 版本变量、也不提供无版本前缀的 Qt:: 目标 → 必须用 Qt5 umbrella bridge 补齐（见 conanfile.py _write_qt5_bridge）。knowledge_ref: archives/q/qtxdg/3.12.0（同类处理）"
  - "OHOS Qt5 链无 qmlplugindump 宿主工具（qt5-qtdeclarative 包不含 bin/），而上游 GSettings/CMakeLists.txt 以 find_program(... REQUIRED) 且 cmake-extras QmlPluginsConfig.cmake 在其缺失时 FATAL_ERROR → 补丁 0001 让查找可选并提供占位 imported target，跳过（可选的）plugins.qmltypes 生成；QML 插件本体照常构建安装。knowledge_ref: archives/c/cmake-extras/1.1/notes.md"
  - "已发布 zlib/1.3.1 是 `./configure --static`（非 -fPIC）产物，链进共享库报 R_AARCH64 relocation（E541）。OHOS 的 Qt5 链本身就用系统 libz.so（libQt5Core.so 带 DT_NEEDED libz.so）→ 本配方摘掉 zlib.pc 的 Conan -L、从 CMAKE_LIBRARY_PATH 移除 zlib libdir、并置空 CMakeDeps 的 zlib::zlib 目标，使 `-lz` 命中 OHOS sysroot 的系统 libz.so。knowledge_ref: E541 / archives/q/qtxdg/3.12.0"
  - "Qt5 的 QML 引擎只读 QML2_IMPORT_PATH（不读 QML_IMPORT_PATH），而上游 set_tests_properties 把它固定为 ${CMAKE_BINARY_DIR}；qtdeclarative 的 QML 模块在另一个包里 → 把 qml/ 模块软链进构建树（QtTest 模块需从其 src/imports/testlib/ 补齐 TestCase.qml 等，属该包 install 未搬运的遗漏）。knowledge_ref: notes.md"
  - "OHOS 受限内核拒绝 mprotect(PROT_EXEC)，Qt5 QML 的 V4 基线 JIT 会 SegFault（mprotect failed in ExecutableAllocator::makeExecutable）→ 上游预留的 QV4_FORCE_INTERPRETER=1 环境变量改用解释器执行。knowledge_ref: notes.md"
  - "OHOS 构建的测试可执行文件与 QML 插件在运行前必须自签名（binary-sign-tool）；签名在 build() 末尾（测试前）与 package() 内各做一次。knowledge_ref: archives/g/gsettings-qt/1.1.1/notes.md"
