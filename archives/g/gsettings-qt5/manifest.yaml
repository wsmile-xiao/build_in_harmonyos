software: gsettings-qt5
display: "gsettings-qt (Qt5 variant)"
description: "Qt5 bindings to GSettings (libgsettings-qt + QML module GSettings 1.1)"
category: library
homepage: "https://gitlab.com/ubports/development/core/gsettings-qt"
license: LGPL-3.0-only
build_system: cmake

# 与 archives/g/gsettings-qt 的关系：同一上游、同一 1.1.1 源 tarball，仅 Qt 主版本
# 不同（Qt6 变体包显式 -DENABLE_QT6=ON；本包用上游默认的 Qt5 分支）。
# Qt6 构建的 libgsettings-qt6.so 无法被 Qt5 程序链接（QObject/QVariant/信号槽 ABI
# 不同），下游 kylin-calendar/5.0.0.0 是 Qt5 程序，故需要本 Qt5 变体。

ohos_adaptation:
  key_points:
    - "Keep the upstream Qt5 build mode (ENABLE_QT6=OFF, the upstream default): the Qt5 variant delivers libgsettings-qt.so + gsettings-qt.pc, which is what pkg_check_modules(gsettings-qt) consumers (kylin-calendar) link against."
    - "Bridge the split Qt5 CMake config: qt5-qtbase ships the native Qt5::Core/Test configs but qt5-qtdeclarative ships no native Qt5Qml config, and CMakeDeps' Qt5Config carries neither AUTOMOC tooling nor the versionless Qt:: targets. generate() overwrites generators/Qt5Config.cmake with an umbrella bridge that includes the CMakeDeps base config and adds moc/Qt-version variables, Qml/QuickTest dispatch and Qt::<Module> aliases."
    - "Link the system libz.so (as libQt5Core.so itself does) instead of Conan's non-PIC static libz.a: zlib/1.3.1 is `--static` without -fPIC and cannot be absorbed into a shared library (E541)."
    - "Patch 0001 makes the qmlplugindump lookup optional: the OHOS Qt5 stack ships no qmlplugindump host tool, while cmake-extras' QmlPluginsConfig.cmake aborts when it is missing. The QML plugin itself is still built and installed; only the optional plugins.qmltypes metadata is skipped."
    - "Stage the qt5-qtdeclarative qml/ modules into the build tree for the upstream qmltest (Qt5 only reads QML2_IMPORT_PATH, which the test properties pin to the build dir); QV4_FORCE_INTERPRETER=1 works around the OHOS mprotect(PROT_EXEC) restriction that would otherwise segfault the QML V4 JIT."
    - "cmake-extras (pure CMake module data package) is declared as tool_requires to keep it out of the consumer dependency chain."
    - "Self-sign built OHOS ELF binaries before running the upstream test suite and before packaging."
  common_dependencies:
    - qt5-qtbase
    - qt5-qtdeclarative
    - glib

versions:
  "1.1.1":
    status: built
    build_date: "2026-10-08"

