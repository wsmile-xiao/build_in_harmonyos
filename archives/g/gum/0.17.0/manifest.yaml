software: gum
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.17.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.17.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# 构建系统类型
build_system: go

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/charmbracelet/gum/archive/refs/tags/v0.17.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: go

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=1"
    - "GOWORK=off"
    - "GOFLAGS=-mod=mod"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.26.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E082-draft: Go项目在HMDFS上需要将linker输出重定向到/dev/shm(tmpfs)"
  - "CGO_ENABLED=1配合clang和musl链接正常工作"
  - "gum使用ldflags注入Version和CommitSHA变量"
  - "E051: Go测试二进制需要ELF签名才能执行(平台限制)"
