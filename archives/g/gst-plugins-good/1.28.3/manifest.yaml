software: gst-plugins-good
build_system: meson
version: "1.28.3"
status: built
build_date: "2026-05-30"

source:
  url: "https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.28.3.tar.xz"
  sha256: ""
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dv4l2=disabled"
    - "-Doss=disabled"
    - "-Doss4=disabled"
    - "-Dximagesrc=disabled"
    - "-Djack=disabled"
    - "-Dpulse=disabled"
    - "-Ddv1394=disabled"
    - "-Dsoup=disabled"
    - "-Dgtk3=disabled"
    - "-Dgdk-pixbuf=disabled"
    - "-Dqt5=disabled"
    - "-Dqt6=disabled"
    - "-Ddirectsound=disabled"
    - "-Dosxaudio=disabled"
    - "-Dosxvideo=disabled"
    - "-Dwaveform=disabled"
    - "-Dexamples=disabled"
    - "-Dtests=disabled"
    - "-Ddoc=disabled"
    - "-Dglib_assert=false"
    - "-Dglib_checks=false"
    - "-Dorc=disabled"
  dependencies:
    - gstreamer/1.28.3
    - gst-plugins-base/1.28.3
    - glib/2.88.0
    - cairo/1.18.4
    - flac/1.4.3
    - libjpeg-turbo/2.1.5.1
    - libpng/1.6.43
    - mpg123/1.32.9
    - opencore-amrnb/0.1.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "V4L2 插件编译失败：gstv4l2object.c 中 initializer element is not a compile-time constant，需要禁用 v4l2"
  - "Linux-specific 插件需要禁用：v4l2, oss, oss4, pulse, jack, dv1394, ximagesrc"
  - "gtk3/gdk-pixbuf 需要 GTK3 运行环境，在无 GTK3 的系统需禁用"
  - "libsoup 3.0 未安装需禁用 soup 插件"
  - "ORC 编译器未安装需禁用 orc 选项"