package: genht/1.1.3
homepage: "http://www.repo.hu/projects/genht/"
upstream_check_command: "make test   # 顶层 Makefile 的 test 目标 → src/Makefile: ./mainsi > mainsi.out; diff mainsi.ref mainsi.out"
upstream_test_in_build: true
upstream_test_command: "make -C src test   # 已集成进 conanfile.py build()，diff 不一致时 make 返回非 0 使构建失败"

upstream_tests:
  - file: src/mainsi.c
    source: genht-1.1.3/src/mainsi.c
    description: "唯一官方回归程序（顶层 `make test` → src/Makefile 的 test 目标）：对 key=str/val=int 实例做 set/has/insert/pop/popentry/迭代/clear，stdout 与 src/mainsi.ref 逐行 diff"
    command: "make -C src test   # ./mainsi > mainsi.out && diff mainsi.ref mainsi.out && echo '*** QC pass ***'"
    result: "PASS (1/1 target；输出 '*** QC pass ***'，OHOS aarch64 交叉产出的 ELF 在本 worker 直接执行)"

test_package_tests:
  - file: test_consumer.c
    description: "【鸿蒙特有测试／完整端到端消费者用例】构造输入（内嵌 13 行访问日志语料）→ 真实执行（htsi×2 累计字节与命中次数、htss 最新状态、htsi+htpp 两级 user 索引、htip 请求注册表、siphash24 指纹；再灌 2000 条合成路径触发多轮扩容并按下标删一半、下线资源含幂等二次删除）→ 产出结果（显式 qsort 的确定性文本报告，不依赖哈希序）→ 校验内容（与独立预算得出的参考输出逐字节比对 + 语义不变量复核）"
    command: "./test_consumer"
    result: "PASS — 47 项检查 0 失败，输出 'PASS: end-to-end pipeline output matches reference'；连跑 3 次结果一致"
  - file: test.c
    description: "API 断言用例（单元级）：用 CMakeDeps 导出的 genht::genht 链接，复刻 src/mainsi.c 的场景与期望值并断言（htsi str→int），叠加 htss（str→str）第二类型实例、hash.h 辅助函数与 version.h 宏校验"
    command: "./test_genht"
    result: "PASS — 43 项断言 0 失败"

assertion_count: 90
# 计数口径：
#   test_consumer.c 运行时 47 项检查（含与参考输出逐字节比对 1 项）
#   test.c 运行时 43 项断言（静态 CHECK 37 处，其中迭代内 1 处执行 7 轮）
#   合计 90 项。
# 另按「用例数」计：鸿蒙特有测试 = 2 个用例
#   （1 个完整端到端消费者用例 + 1 个 API 断言用例），均通过。
