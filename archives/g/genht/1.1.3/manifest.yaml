knowledge_gained:
  - "上游 repo.hu 仅提供 http 源（无 TLS），改用 Debian 官方 pool 的原始上游 tarball（sha256 与 FreeBSD ports distinfo 一致）（knowledge_ref: DRAFT-genht-1.1.3-upstream-http-only-use-debian-orig-tarball）"
  - "交叉产出的 OHOS aarch64 ELF 可在 worker 直接执行 → 上游 `make test` 可真正集成进 build()，无需宿主工具补丁（knowledge_ref: DRAFT-genht-1.1.3-makefile-hostcc-cross-helper-runs-natively）"
  - "conan 2.29 的 dict 型 conf 不能用 `:子键` 取值，须整字典取出再取键（knowledge_ref: DRAFT-genht-1.1.3-conan-conf-dict-subkey-get-raises）"
  - "共享库链接参数含 GNU 风格 -dynamic -rdynamic，OHOS lld 可接受；通过 GENHT_LDFLAGS 补 -Wl,-soname,libgenht.so"
  - "pc-pr-review rule12：「鸿蒙特有测试」不能只有断言，必须有完整端到端消费者用例（构造输入→真实执行→产出结果→校验内容）（knowledge_ref: DRAFT-genht-1.1.3-rule12-needs-e2e-consumer-case）"
