sources:
  "4.7.2-stable":
    url: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/godot-4.7.2-stable.tar.xz"
    sha256: "a18ce0ccec3ecc40b0dd6c4f5132ca934e9fb7c2979717940ff32aee1eb35481"
patches:
  "4.7.2-stable":
    - patch_file: "patches/0001-linuxbsd-detect-skip-libatomic-on-ohos.patch"
      patch_description: "Skip libatomic link request when the user-supplied toolchain flags target *-linux-ohos (musl provides 64-bit atomics as libc builtins); substring detection accepts any arch variant"
      patch_type: "portability"
    - patch_file: "patches/0002-sdl-thread-ohos-no-pthread-setcanceltype.patch"
      patch_description: "Remove the SDL pthread async-cancellation setup block entirely (deferred cancellation, the POSIX default, is sufficient and nothing in the engine calls pthread_cancel); also avoids pthread_setcanceltype() which musl-based libc may not provide"
      patch_type: "portability"
