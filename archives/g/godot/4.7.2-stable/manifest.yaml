software: godot
version: "4.7.2-stable"
status: built
build_system: scons
build_date: "2026-09-13"
source:
  url: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/godot-4.7.2-stable.tar.xz"
  sha256: "a18ce0ccec3ecc40b0dd6c4f5132ca934e9fb7c2979717940ff32aee1eb35481"
  upstream_version: "4.7.2-stable"
build:
  system: scons
  build_target: "template_release (export template; editor build trimmed)"
  configure_options:
    - "platform=linuxbsd target=template_release arch=arm64 use_llvm=yes use_static_cpp=no tests=yes"
    - "x11=no wayland=no dbus=no pulseaudio=no alsa=no udev=no fontconfig=no speechd=no accesskit=no touch=no"
    - "ccflags=--target=aarch64-linux-ohos --sysroot=<OHOS SDK sysroot> (linkflags same)"
    - "module trim: mono/jolt_physics/raycast/openxr/webxr/mobile_vr/camera/fbx/xatlas_unwrap/vhacd/lightmapper_rd disabled"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-linuxbsd-detect-skip-libatomic-on-ohos.patch"
  - "0002-sdl-thread-ohos-no-pthread-setcanceltype.patch"
knowledge_gained:
  - "SCons toolchain injection for OHOS: CC/CXX alone do not carry sysroot/target; inject via SCons ccflags=/linkflags= generic variables (100% coverage of compile commands); ref: notes.md experiments 3-5"
  - "OHOS musl has no libatomic (64-bit atomics are libc builtins) — patch platform detect to skip both -l:libatomic.a and -latomic when toolchain flags target *-linux-ohos; ref: notes.md failure mode #1/#2"
  - "OHOS pthread.h declares PTHREAD_CANCEL_ASYNCHRONOUS but musl provides no pthread_setcanceltype() — R8-clean fix: remove the SDL async-cancellation block entirely (deferred cancellation is the POSIX default; nothing in the engine calls pthread_cancel); ref: notes.md failure mode #3 and R8-fix section"
  - "Module trim matrix: template_release full 2407 TUs -> medium trim 2094 TUs (-13%); see notes.md experiment 6"
  - "SCons posix platform hardcodes env['SHELL']='sh' and ignores the SHELL env var — on OHOS (no /bin/sh on PATH) job spawns die with 'sh: No such file or directory'; fix = patch the installed SCons module's SHELL assignment to /system/bin/sh in generate() (same as gpsd/3.26); env-var SHELL export does NOT work"
knowledge_ref:
  - "archives/g/godot/4.7.2-stable/notes.md"
