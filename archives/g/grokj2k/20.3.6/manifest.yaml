name: grokj2k
version: 20.3.6
description: "Open source JPEG 2000 codec with HTJ2K support"
homepage: "https://github.com/GrokImageCompression/grok"
license: "AGPL-3.0"
build_system: "CMake"
cpp_standard: "C++23"

status: "pre-adaptation"

source:
  url: "https://github.com/GrokImageCompression/grok/archive/refs/tags/v20.3.6.tar.gz"
  sha256: "513c9c61b03b1ec0e0ca91b1981578a508891df09ad743fe776f8794bb54a1e1"

dependencies:
  # All bundled — zero external deps
  system:
    - pthreads
    - atomic

features_disabled:
  - GRK_BUILD_CODEC (no CLI tools)
  - GRK_BUILD_DCI
  - GRK_BUILD_CORE_EXAMPLES
  - GRK_BUILD_CORE_SWIG_BINDINGS (no Python/Java/C# bindings)
  - GRK_BUILD_PLUGIN_LOADER (no GPU plugin)
  - GRK_ENABLE_LIBCURL (no network)
  - BUILD_TESTING (needs test data corpus)

platform:
  os: [Linux, OHOS]
  arch: [aarch64]

notes: |
  - GitHub archive tarball excludes git submodules; recipe downloads them separately
  - C++23 required — clang 15 compatibility needs verification on OHOS
  - Upstream tests require grok-test-data corpus (not included)
