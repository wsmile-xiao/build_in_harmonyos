package: grokj2k/20.3.6
homepage: "https://github.com/GrokImageCompression/grok"

upstream_check_command: "ctest"
upstream_test_in_build: true
# Upstream tests require grok-test-data (large binary test corpus);
# disabled in recipe to avoid external data dependency.
# Upstream CI runs: ctest with GRK_DATA_ROOT pointing to test data.

test_package_tests:
  - file: test.cpp
    description: "Verify grk_version() returns expected 20.3.x version string"
    command: "./test_grokj2k"

assertion_count: 2
