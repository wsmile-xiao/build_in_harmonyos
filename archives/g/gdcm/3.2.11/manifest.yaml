version: '3.2.11'
status: built
build_date: '2026-09-20'

build:
  system: cmake
  dependencies:
    - zlib/1.3.1.1
    - expat/2.8.4
  cc: clang
  options: >-
    GDCM_BUILD_SHARED_LIBS=OFF GDCM_BUILD_APPLICATIONS=ON GDCM_BUILD_TESTING=ON
    GDCM_USE_SYSTEM_ZLIB=ON GDCM_USE_SYSTEM_EXPAT=ON
    其余第三方件（openjpeg/charls/json/uuid/ljpeg/md5/socketxx）用上游内嵌 Utilities 源码

patches_applied:
  - patches/0001-expat-include-dirs.patch
  - patches/0002-fix-TestRescaler2-unsigned-char.patch

test_report:
  upstream_registered: 200
  exempted_network: 7
  ran: 193
  passed: 193
  pass_rate: 100%
  evidence: 'conan create 内嵌 ctest（签名后本机执行）：100% tests passed, 0 tests failed out of 193'
  test_package: '字典查询/Attribute 往返/PixelData 条目/Reader-Writer 链接，运行 ALL OK'

knowledge_gained:
  - 'ohos.toolchain.cmake 强制 CMAKE_RANLIB=<SDK>/llvm/bin/llvm-ranlib，但设备 SDK 的 llvm/bin 缺 llvm-ranlib（只有 ar/nm/objcopy）→ make 静态库链接报 "Error running link command"；SDK 只读，修法=configure 后重写 build 树所有 link.txt 的 ranlib 路径（幂等，CI 有 ranlib 时自动跳过）'
  - 'GDCM_USE_SYSTEM_EXPAT=ON 时上游漏 include_directories(${EXPAT_INCLUDE_DIRS})（对 ZLIB 有、对 EXPAT 无）→ gdcmIOD 编译 fatal error expat.h not found'
  - 'plain char 符号性是实现定义：OHOS arm64 SDK 下 char 是 unsigned（numeric_limits<char>::min()==0），上游 TestRescaler2 的 TestRescaler2Func<char,char> 假设 signed（x86 语义）→ 输入输出双向回绕断言失败；显式 signed char 修复'
  - '裸 cmake 路线下 gdcm 的 find_package(ZLIB/EXPAT) 会抢 sysroot 的系统库，需 -D*_INCLUDE_DIR/-D*_LIBRARY 显式重定向到 conan 依赖'
  - '测试/工具二进制运行时 NEEDED libc++_shared.so 位于 SDK/llvm/lib/aarch64-linux-ohos/（不是 llvm/lib 顶层）；LD_LIBRARY_PATH 继承系统默认会加载缺符号的 libc++ 变体'
