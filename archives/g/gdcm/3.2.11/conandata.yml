patches:
  "3.2.11":
    - patch_file: "patches/0001-expat-include-dirs.patch"
      patch_description: "GDCM_USE_SYSTEM_EXPAT=ON 时 gdcmIOD 缺 EXPAT_INCLUDE_DIRS 导致 expat.h 找不到（上游对 ZLIB 有 include_directories 而对 EXPAT 漏配）"
      patch_type: "portability"
    - patch_file: "patches/0002-fix-TestRescaler2-unsigned-char.patch"
      patch_description: "TestRescaler2 Case11/12 假设 plain char 为 signed（x86 语义），arm64 OHOS 下 char 无符号导致 (char)(min+i) 回绕、min2>max2 断言失败；改用 signed char 明确符号性"
      patch_type: "portability"
