package: gcc-14/14.2.0
homepage: "https://gcc.gnu.org/gcc-14/"

upstream_check_command: "make -C gcc selftest"
upstream_test_in_build: true
upstream_test_command: "make -C gcc selftest && build-time gcc.c-torture/execute subset (50 sources x -O0/-O2 = 100 executions); note: release build has self-tests disabled in cc1 (checking off), the selftest target still runs and exits 0"

upstream_tests:
  - file: gcc/selftest-run-tests.cc
    source: gcc-14.2.0/gcc/selftest-run-tests.cc
    description: "GCC language-independent internal selftests"
    command: "make -C gcc selftest"
  - file: gcc/c/c-parser.cc
    source: gcc-14.2.0/gcc/c/c-parser.cc
    description: "C frontend parser selftests run through -fself-test"
    command: "make -C gcc selftest"
  - file: gcc/testsuite/gcc.c-torture/execute/20000112-1.c
    source: gcc-14.2.0/gcc/testsuite/gcc.c-torture/execute/20000112-1.c
    description: "Upstream execution torture tests: 50 representative sources compiled with the freshly built compiler and executed at -O0 and -O2 (100 runs; 96/100 passed in the 2026-09-17 retry build, within the recipe's <=10% failure gate)"
    command: "build() torture-execute subset via the xgcc-sign wrapper"

test_package_tests:
  - file: test_gcc.c
    description: "Use packaged GCC to compile, link and execute a real AArch64 C program"
    command: "gcc -O2 -DEXPECT_OHOS=1 test_gcc.c -o gcc_test_program && ./gcc_test_program"

assertion_count: 4
