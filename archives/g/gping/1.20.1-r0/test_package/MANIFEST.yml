# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gping/1.20.1-r0
homepage: "https://github.com/orf/gping"

# 上游测试命令
# gping 使用 cargo test 运行测试，但测试需要网络和 ping 命令
# 上游测试主要在 CI 中运行，不适合 conan create 阶段
upstream_check_command: "cargo test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# gping 上游测试在 pinger crate 中，需要网络访问
upstream_tests:
  - file: pinger/src/test.rs
    source: gping-v1.20.1/pinger/src/test.rs
    description: "上游 pinger crate 单元测试（需要网络和 ping 命令）"
    command: "cargo test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_gping.sh
    description: "验证 gping --version 输出正确"
    command: "./test_gping.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
