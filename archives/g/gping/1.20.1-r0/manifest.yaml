# gping 1.20.1-r0 编译元数据
software: gping
version: 1.20.1-r0
display_name: "gping - Ping with a graph"
category: network
build_system: cargo
status: published
build_date: 2026-06-04

# 源码信息
source_url: https://codeload.github.com/orf/gping/tar.gz/gping-v1.20.1
source_type: tar.gz

# 依赖信息
dependencies:
  runtime:
    - openssl@3
  build:
    - rustc
    - cargo

# 编译参数
configure_options: []
build_options:
  - cargo build --release

# 知识提取
knowledge_gained:
  - category: L1
    content: "Rust 工具链在 HarmonyOS 上需要通过 harmonybrew 安装，usr/local/bin 下的预安装版本有损坏的 ELF headers"
    reason: "预安装的 rustc/cargo section 21-22 sh_type 为 SHT_NULL"
  - category: L1
    content: "HarmonyOS musl namespace 系统限制用户目录的共享库加载，harmonybrew 的 $ORIGIN/../lib RPATH 可以绕过"
    reason: "Error relocating ... symbol not found for libssl/libgcc"

# Rust 工具链信息
rust_toolchain:
  rustc_version: 1.95.0
  cargo_version: 1.95.0
  target: default (aarch64-linux-musl)

