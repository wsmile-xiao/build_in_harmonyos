package:
  name: gnu-prolog
  version: "1.5.0"
  description: "GNU Prolog compiler and runtime"
  homepage: "https://gprolog.org/"
  license: "GPL-2.0-or-later"
  category: development

source:
  url: "https://deb.debian.org/debian/pool/main/g/gprolog/gprolog_1.5.0.orig.tar.gz"
  sha256: "8b332c4cd289dddb8074b12adf6358a99adc77717e23722c2333f3727cf149ee"

build:
  system: autotools
  configure_args:
    - "--without-links-dir"
    - "--without-doc-dir"
    - "--without-html-dir"
    - "--without-examples-dir"
    - "--disable-linedit"
    - "--disable-sockets"

test:
  upstream_check_command: "make check"
  upstream_test_in_build: true
  upstream_test_command: "make check"
  upstream_tests:
    - name: "EnginePl"
      command: "make check"
    - name: "Ma2Asm"
      command: "make check"
    - name: "Pl2Wam"
      command: "make check"
    - name: "BipsPl"
      command: "make check"
  test_package_functional: "gprolog evaluates an arithmetic Prolog goal and returns PASS"
  assertion_count: 5

conan:
  reference: "gnu-prolog/1.5.0@ohpcd/stable"
  status: "built"

platform:
  os: "OHOS"
  arch: "armv8"
