package: gnu-prolog/1.5.0
homepage: "https://gprolog.org/"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - name: "EnginePl"
    command: "make check"
  - name: "Ma2Asm"
    command: "make check"
  - name: "Pl2Wam"
    command: "make check"
  - name: "BipsPl"
    command: "make check"
test_package_tests:
  - file: test.sh
    description: "Compiles and runs a consumer Prolog program with an arithmetic assertion"
    command: "gplc -o test_program test.pl && ./test_program"
assertion_count: 5
