software: gnutls
version: "3.8.10"
status: published
build_date: "2026-05-26"

source:
  url: "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.10.tar.xz"
  sha256: ""
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--with-included-libtasn1=no"
    - "--with-included-unistring=no"
  dependencies:
    - nettle/3.10.2
    - libtasn1/4.21.0
    - libgcrypt/1.11.0
    - libgpg-error/1.55
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-config-guess.patch"

knowledge_gained:
  - "从 gnupg.org 下载最新版本，  - "需要 libintl 支持"
  - "psktool 需要额外依赖 libintl_bindtextdomain"