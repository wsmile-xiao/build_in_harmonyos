software: gnutls
display: "GnuTLS"
description: "GNU Transport Layer Security Library"
category: crypto
homepage: "https://www.gnutls.org/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "依赖 nettle >= 3.10"
    - "需要 libtasn1 >= 4.21"
    - "需要 libintl (gettext) 支持"
    - "修复 E007 config.guess/config.sub 平台识别"
  common_dependencies:
    - nettle
    - libtasn1
    - libgcrypt
    - libgpg-error

versions:
  "3.8.10":
    status: published
    build_date: "2026-05-26"
    published_as: gnutls