build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--with-included-libtasn1"
    - "--disable-gost"
  
  # 编译依赖列表（格式: name/version）
  dependencies:
    - "nettle/4.0"
    - "gmp/6.3.0"
  
  # 编译器
  cc: ~/tmp/wrappers/cc-wrapper
  cxx: ~/tmp/wrappers/cxx-wrapper

