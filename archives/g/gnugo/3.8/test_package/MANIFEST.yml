package: gnugo/3.8
homepage: "https://www.gnu.org/software/gnugo/"

# Upstream test command
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test suites (from regression/)
upstream_tests:
  - file: regression/reading.tst
    source: gnugo-3.8/regression/reading.tst
    description: "Reading (tactical) regression tests"
    command: "./regress.sh . reading.tst"
  - file: regression/owl.tst
    source: gnugo-3.8/regression/owl.tst
    description: "Owl (life and death) regression tests"
    command: "./regress.sh . owl.tst"
  - file: regression/ld_owl.tst
    source: gnugo-3.8/regression/ld_owl.tst
    description: "Long-distance owl regression tests"
    command: "./regress.sh . ld_owl.tst"
  - file: regression/optics.tst
    source: gnugo-3.8/regression/optics.tst
    description: "Optics regression tests"
    command: "./regress.sh . optics.tst"
  - file: regression/filllib.tst
    source: gnugo-3.8/regression/filllib.tst
    description: "Fillboard regression tests"
    command: "./regress.sh . filllib.tst"
  - file: regression/atari_atari.tst
    source: gnugo-3.8/regression/atari_atari.tst
    description: "Atari-atari regression tests"
    command: "./regress.sh . atari_atari.tst"
  - file: regression/connection.tst
    source: gnugo-3.8/regression/connection.tst
    description: "Connection regression tests"
    command: "./regress.sh . connection.tst"
  - file: regression/break_in.tst
    source: gnugo-3.8/regression/break_in.tst
    description: "Break-in regression tests"
    command: "./regress.sh . break_in.tst"
  - file: regression/blunder.tst
    source: gnugo-3.8/regression/blunder.tst
    description: "Blunder regression tests"
    command: "./regress.sh . blunder.tst"
  - file: regression/unconditional.tst
    source: gnugo-3.8/regression/unconditional.tst
    description: "Unconditional life regression tests"
    command: "./regress.sh . unconditional.tst"
  - file: regression/trevora.tst
    source: gnugo-3.8/regression/trevora.tst
    description: "TrevorA regression tests"
    command: "./regress.sh . trevora.tst"
  - file: regression/nngs1.tst
    source: gnugo-3.8/regression/nngs1.tst
    description: "NNGS1 regression tests"
    command: "./regress.sh . nngs1.tst"
  - file: regression/strategy.tst
    source: gnugo-3.8/regression/strategy.tst
    description: "Strategy regression tests"
    command: "./regress.sh . strategy.tst"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package/conanfile.py
    description: "Run gnugo --version to verify binary works"
    command: "gnugo --version"

# Approximate assertion count
assertion_count: 500
