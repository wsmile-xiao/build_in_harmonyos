# GNU Go 3.8 编译元数据
software: gnugo
version: 3.8
status: built
build_date: 2026-06-16
build_system: autotools
compiler: clang-15.0.4
platform: HarmonyOS-aarch64

# 编译配置
configure_options:
  - --prefix=/storage/Users/currentUser/usr/local

# 依赖信息
dependencies: []

# 补丁文件
patches:
  - 0001-fix-duplicate-symbol-liberty-h.patch
  - 0002-fix-duplicate-symbol-unconditional-c.patch

# 预编译包信息
package:
  name: gnugo-3.8-ohos-aarch64.tar.gz
  size: 8.1MB
  files:
    - bin/gnugo
    - share/man/man6/gnugo.6
    - share/info/gnugo.info
    - share/info/gnugo.info-1
    - share/info/gnugo.info-2
    - share/info/gnugo.info-3

# 质量门禁
quality_gates:
  G0_clean_build: PASS
  G1_binary_integrity: PASS
  G2_functionality: PASS
  G3_portability: PASS  # 无需 RPATH，动态链接
  G4_archive_integrity: PASS

# 编译环境
build_env:
  TMPDIR: ~/tmp
  DEFAULT_PREFIX: /storage/Users/currentUser/usr/local
  CC: clang-15.0.4

# 编译问题
issues:
  - type: build_error
    description: "重复符号错误：meaningless_black_moves 和 meaningless_white_moves 在多个目标文件中定义"
    solution: "将 liberty.h 中的变量定义改为 extern 声明，在 unconditional.c 中添加实际定义"
    severity: medium
  - type: platform_issue
    description: "/tmp 只读，configure 无法创建临时文件"
    solution: "设置 TMPDIR=~/tmp 环境变量"
    severity: medium
  - type: platform_issue
    description: "HMDFS 文件系统限制，config.status 无法在当前目录创建临时目录"
    solution: "修改 config.status 脚本，使用 TMPDIR 创建临时文件"
    severity: high

# 知识提取
knowledge_gained:
  - "HMDFS 文件系统限制：config.status 无法在当前目录创建临时目录，需要修改脚本使用 TMPDIR"
  - "重复符号问题：全局变量在头文件中定义会导致多个目标文件重复定义，应使用 extern 声明"