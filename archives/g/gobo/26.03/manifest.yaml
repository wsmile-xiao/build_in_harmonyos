  - "strip 会破坏 HarmonyOS ELF 执行权限，必须跳过 strip"
  - "Gobo Eiffel 使用 bootstrap 机制：C源码→gec0→gec1→gec，非 autotools"
  - "clang.cfg 的 libs_gc 变量可添加额外链接对象"
  - "Conan 2.x self.run() env 参数须为 list 格式或用 os.environ"

