software: gcc-snapshot
task_library: "gcc-snapshot@20260705"
conan_ref: "gcc-snapshot/20260705"
version: "20260705"
status: built
build_date: "2026-09-12"
build_system: autotools-custom
difficulty: "C-candidate"
adaptation_path: "Path A native toolchain packaging plus Path B knowledge-extension and Path C complex-toolchain candidates"
source_language: "C/C++"

source:
  url: "https://gcc.gnu.org/pub/gcc/snapshots/17-20260705/gcc-17-20260705.tar.xz"
  sha256: "86253d2e3189cfffb1c9afb7779b67e792b980ce7cf072323b137473896dfcdc"
  tar_format: tar.xz

build:
  system: autotools-custom
  configure_options:
    - "--enable-languages=c"
    - "--disable-bootstrap"
    - "--disable-multilib"
    - "--disable-decimal-float on OHOS"
    - "--without-isl"
  dependencies:
    - "bundled gmp/6.3.0"
    - "bundled mpfr/4.2.2"
    - "bundled mpc/1.3.1"
    - "build tool flex/2.6.4 for gengtype-lex.cc generation"
  cc: clang
  cxx: clang++

source_transforms:
  - "Map linux-ohos to GCC's musl target configuration"
  - "Inject config.sub compatibility into GCC and bundled prerequisites"
  - "Canonicalize none-unknown-linux-ohos from bundled prerequisite configure scripts to aarch64-unknown-linux-ohos"
  - "Replace Autoconf umask 077 with umask 022 for HMDFS"
  - "Apply source transforms before Conan copies the source tree to avoid immediate HMDFS rewrite/execute failures"
  - "Pre-apply additive OHOS compatibility transforms without reading settings in Conan's settings-independent source() phase"
  - "Run the large source-tree transform in a short-lived Python process so its memory and HMDFS state are released before configure"
  - "Use gcc_build_env.sh instead of Conan's reserved conanbuild.sh name to prevent recursive self-sourcing and SIGSEGV"
  - "Run configure, make and install through an explicit shell with an unlimited stack because HarmonyOS shells otherwise crash on GCC's generated scripts"
  - "Retry only signal-11 command failures once after os.sync() because the same command succeeds after HMDFS settles"
  - "Override CI's LLVM IR assembler with the device's GNU as and ld for GCC target assembly"
  - "Relax signing temporary directories from 0700 to 0775 for HMDFS compatibility"
  - "Use a bounded four-way GNU Make pipe jobserver on OHOS because HMDFS does not support the default FIFO jobserver reliably and two-way execution still exceeded the fixed CI window"
  - "Disable decimal floating-point runtime on the minimal OHOS C/libgcc target and remove inherited debug flags from target libgcc compilation to reduce the soft-fp/BID build set and I/O"
  - "Keep GCC host generators as PIE on OHOS to avoid LLD AArch64 copy-relocation alignment failures"
  - "Derive GCC's sysroot from either the resolved OHOS SDK Clang path or the HNP SDK layout so fixincludes can find native headers"
  - "Download the large GCC source archive with bounded parallel HTTP ranges, per-range retries, ordered mirror fallback, and final SHA256 verification"
  - "Build signed ELF launcher aliases for ld, collect-ld and real-ld because collect2 directly spawns collect-ld on HMDFS"

knowledge_gained:
  - "aarch64-linux-ohos must select GCC's musl ABI and /lib/ld-musl-aarch64.so.1"
  - "GCC host generators and output programs require HarmonyOS ELF signing"
  - "GCC snapshot 17-20260705 download_prerequisites selects GMP 6.3.0, MPFR 4.2.2, MPC 1.3.1, ISL 0.24 and gettext 0.22"
  - "GCC snapshot 17-20260705 needs flex/2.6.4 during generator build because gengtype-lex.cc is not shipped pre-generated"
  - "CONFIG_SHELL alone does not replace the initial interpreter or raise its stack limit; invoke the resolved shell explicitly after ulimit -s unlimited"
  - "OpenDesk exports AS=llvm-as, but GCC needs GNU as; /data/service/hnp/bin/as and ld are GNU Binutils 2.45"
  - "GCC's detected -fno-PIE/-no-pie flags trigger an unaligned stderr copy relocation in HarmonyOS LLD"
  - "The device has no /usr/include; Clang uses the OHOS SDK native/sysroot/usr/include tree"
  - "GCC snapshot 20260705's gcc/Makefile.in already uses FLEX = @FLEX@; the OHOS fix only needs shell-wrapped move-if-change and related script calls"
  - "On this device, Conan generate() must default to /data/service/hnp/bin/clang and /data/service/hnp/bin/clang++ because bare clang is not on PATH"
  - "Conan tool_requires does not guarantee flex reaches PATH inside this recipe; generate() must inject the flex bin dir and FLEX variable explicitly"
  - "The worker's published flex/2.6.4 package may omit bin/flex; retain the Conan dependency and fall back only to the worker's matching /data/service/hnp/flex.org/flex_2.6.4/bin/flex"
  - "With --disable-lto, snapshot option generation and LTO consumers still need synchronized source guards and c.opt language-enablement cleanup"
  - "Target option-completion selftests may contain target-inapplicable entries; this OHOS build filters -Wno-underflow, -Wtarget-lifetime and -Warray-temporaries"
  - "Both build-time and installed GCC wrappers must put /data/service/hnp/bin/ before package/build-tree -B paths so OHOS GNU as and ld are selected"
  - "The installed driver must derive the GCC internal directory version from gcc.real -dumpversion instead of using the Conan snapshot date"
  - "collect2 may select gcc/collect-ld instead of ld; a shell script alias is insufficient, so the recipe builds one signed ELF launcher and packages all three linker aliases"
  - "Large source trees should be transformed before later Conan copying, with no_copy_source and an explicit source-cache fallback preserving the official checksum"
  - "HMDFS executable permission must be validated by actually invoking a wrapper through sh or $(SHELL), not by chmod or file mode inspection alone"
  - "Upstream torture sources may carry dg-additional-options; a focused executor must parse and preserve those options to avoid false failures"
  - "A reliable toolchain handoff records host tools, target tools, package tools, linker aliases, consumer output and negative-test evidence separately"
  - "Unexecuted GCC tests must be listed by scope: full DejaGNU, extra frontends, bootstrap, LTO, multilib, shared/plugin, optional runtimes, and cross-platform matrices each need a reason, substitute evidence, and impact statement"
  - "For large source downloads, Conan url lists provide ordered mirror fallback; keep the official URL, a reachable Sourceware mirror, and one SHA256 check for every candidate"
  - "A low-speed but still-open connection can exhaust a fixed CI window without activating URL fallback; use bounded parallel HTTP ranges with per-range retries and one final SHA256 check for large public archives"
  - "Conan build_jobs() returns 1 when the OHOS profile omits processor detection; use an explicit bounded GNU Make pipe jobserver on OHOS, and raise the cap only from stage-boundary evidence without changing CI infrastructure"
  - "When a fixed-timeout CI run reaches all-target-libgcc after completing the GCC selftest, diagnose the last make target rather than skipping tests; use a bounded OHOS -j4 pipe jobserver after checking worker CPU and memory, while keeping package/test_package as separate unexecuted stages until CI reaches them"
  - "For a C-only OHOS toolchain, --disable-decimal-float is an explicit product boundary rather than a hidden test skip; target libgcc uses -O2 -fPIC plus LIBGCC2_DEBUG_CFLAGS=-g0 while host tools retain their normal build flags"

verification:
  local_static_checks: pass
  ohos_ci: pass
  note: "Python syntax checks passed. The official gcc-17-20260705.tar.xz hash was verified locally as 86253d2e3189cfffb1c9afb7779b67e792b980ce7cf072323b137473896dfcdc. Official runner R4 on 10.62.229.155 completed conan create, package install/sign, test_package, 100/100 torture execution, and L0/L1/L2/L4/L5 checks; test_package output was gcc17-ohos-ok and the runner exit code was 0. PR CI #44703 stopped before L1 because the official 99.6 MB source download reset and the worker had no curl; CI #44737 then reached generate() but exposed the SDK-internal clang sysroot path bug. The recipe now uses ordered Sourceware mirrors with the official URL as fallback and resolves native/sysroot from both SDK-internal clang and HNP layouts. PR CI #44804 passed Conan test_package, L0, L1, cleanup, and all seven CI steps. PR CI #44812 passed L0 but the single GCC source connection downloaded only about 88.7 MB before the fixed 3600-second timeout and did not reach compile or test_package; the recipe now uses bounded parallel HTTP ranges, per-range retries, ordered mirrors, and final SHA256 verification. PR CI #44864 reached GCC all-gcc and printed 7,676,387 selftest pass(es), but timed out before conan create completed because the OHOS profile's build_jobs() fell back to serial make; the recipe then enforced OHOS pipe parallelism. PR CI #44912 reached the end of all-target-libgcc with -j2, #44956 repeated the same boundary with -j4, and #44992 reached the same boundary 193 seconds earlier after disabling decimal-float and overriding target flags; all three still hit the 3600-second conan create timeout before package/test_package. PR CI #45033 then passed with the LIBGCC2_DEBUG_CFLAGS=-g0 fix: conan-build-test took 3562 seconds, total build time was 3647 seconds, Conan test_package passed, L0/L1 passed, and worker_preparation, worker-prep, git-clone, checkout-pr, conan-setup, conan-build-test, and cleanup all succeeded. Conan not being on the Windows PATH only limits local orchestration."

path_b_candidate:
  classification: "candidate; final B-class decision is subject to review"
  rationale: "The package is a self-hosting C/C++ toolchain with bundled GMP/MPFR/MPC, a generated GCC host-tool chain, OHOS ELF signing, HMDFS shell/temporary-directory constraints, an isolated flex tool requirement, and a consumer test that compiles and links an OHOS program."
  evidence_scope:
    - "source URL, language, checksum, and bundled prerequisite versions are recorded"
    - "source(), configure, build, package, and test_package boundaries are documented"
    - "independent flex/2.6.4 dependency boundary is documented and reused"
    - "fresh-build failure signatures and corrective transforms are recorded in the GCC-specific knowledge drafts"
  knowledge_drafts:
    - "knowledge/drafts/DRAFT-gcc-snapshot-20260705-ohos-source-tree-and-fresh-build.md"
    - "knowledge/drafts/DRAFT-gcc-snapshot-20260705-ohos-source-tree-and-fresh-build.kv"

path_c_candidate:
  classification: "candidate; final C-class decision is subject to review"
  qualifying_criteria:
    - criterion: 3
      evidence: "GCC contains target-specific assembler integration and generated host-tool architecture; the OHOS build must coordinate GNU as/ld, AArch64 PIE linking, generated ELF signing, target sysroot, and compiler -B search order."
    - criterion: 4
      evidence: "The snapshot combines bundled GMP/MPFR/MPC, the independent flex/2.6.4 generator dependency, m4 and multiple GCC generator/runtime components; the real-device build exceeded the default 3600-second window and requires an execution-only 10800-second window, while 7,676,387 selftest cases and 100 torture executions were verified."
  boundary:
    - "The C candidate claim is based on complex assembler/toolchain architecture and verification cost, not on closed-source binaries or a private compiler toolchain."
    - "The recipe deliberately limits the supported product to the C frontend, non-bootstrap, non-LTO, non-multilib configuration; this limitation is recorded rather than presented as full GCC matrix coverage."
