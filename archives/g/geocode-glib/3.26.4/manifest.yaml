dependencies:
  required:
    - glib/2.84.0
    - json-glib/1.6.6
    - libsoup/3.6.5-r1
  build:
    - meson (host toolchain)
  optional:
    - gobject-introspection (enable-introspection=false)
    - gtk-doc (enable-gtk-doc=false)
patches_applied: []
test_results:
  type: local_recipe_check
  upstream: "upstream registers 3 meson tests (geo-uri, API test, mock backend); cross-built binaries cannot run through meson test on the build host — pure-logic surface (geo URI parsing, location construction, distance) covered by the test_package consumer; the API/mock tests exercise network-flavoured paths that need the Nominatim backend"
  test_package: "consumer test builds against geocode-glib-2.0 pkg-config and runs on the OHOS host: version macro, location coordinate round-trips, distance (Eiffel→Louvre ~3.2 km), geo URI parsing, name round-trip — ALL PASS"
  full_reference: "pending CI"
source_url: https://download.gnome.org/sources/geocode-glib/3.26/geocode-glib-3.26.4.tar.xz
source_sha256: 2d9a6826d158470449a173871221596da0f83ebdcff98b90c7049089056a37aa
knowledge_gained:
  - "geocode-glib 3.26.4 with soup2=false produces the libsoup3 flavour: library libgeocode-glib-2.so and pc file geocode-glib-2.0.pc — this is the name libgweather 4.6.0's meson.build requires."
  - "gir generation is optional (find_program g-ir-scanner required:false + enable-introspection=false) — no gobject-introspection dependency needed for the plain library build."
  - "libsoup 3.6.5-r1 recipe's glib module .pc compat + glib tool variable patches carry over unchanged (gnome.mkenums needs glib_mkenums in glib-2.0.pc)."
