package: gnome-autoar/0.5.2
homepage: "https://gitlab.gnome.org/GNOME/gnome-autoar"

upstream_check_command: "meson test -v -C build"
upstream_test_in_build: true
upstream_test_command: "meson test"

upstream_tests:
  - file: tests/test-extract-unit.c
    source: gnome-autoar-0.5.2/tests/test-extract-unit.c
    description: "One Meson test binary with 22 GLib test cases covering extraction, conflicts, links, path sanitization, permissions, and encrypted archives"
    command: "meson test -v -C build test-extract-unit"

test_package_tests:
  - file: test.c
    description: "Validate ZIP format metadata, create a real ZIP archive, and verify the resulting regular file is non-empty"
    command: "./test_gnome_autoar"

assertion_count: 10

