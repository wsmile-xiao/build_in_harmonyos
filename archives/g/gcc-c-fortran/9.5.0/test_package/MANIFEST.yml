package: gcc-c-fortran/9.5.0
homepage: "https://gcc.gnu.org/gcc-9/"

upstream_check_command: "make -C gcc selftest && build() gfortran.dg smoke subset"
upstream_test_in_build: true
upstream_test_command: "make -C gcc selftest && build-time gfortran.dg subset (floating-point, arrays, intrinsics, formatted I/O)"

upstream_tests:
  - file: gcc/selftest-run-tests.c
    source: gcc-9.5.0/gcc/selftest-run-tests.c
    description: "GCC language-independent internal selftests"
    command: "make -C gcc selftest"
  - file: gcc/fortran/trans-array.c
    source: gcc-9.5.0/gcc/fortran/trans-array.c
    description: "Fortran frontend array translation exercised through the gfortran.dg smoke subset (representative floating-point/array/intrinsic tests compiled and executed with the freshly built compiler)"
    command: "build() gfortran.dg smoke subset via the xgcc-sign wrapper"

test_package_tests:
  - file: test_fortran.f90
    description: "Use packaged gfortran to compile, link and execute a real Fortran 90 program with double-precision arithmetic, arrays, intrinsics and formatted I/O"
    command: "gfortran -O2 -ffree-line-length-none test_fortran.f90 -o fortran_test && binary-sign-tool sign ... && ./fortran_test"

assertion_count: 6