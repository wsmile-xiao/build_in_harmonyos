software: gcc-c-fortran
version: "9.5.0"
status: built
build_date: "2026-09-22"
build_system: autotools-custom

source:
  url: "https://ftp.gnu.org/gnu/gcc/gcc-9.5.0/gcc-9.5.0.tar.xz"
  sha256: "27769f64ef1d4cd5e2be8682c0c93f9887983e6cfd1a927ce5a0a2915a95cf8f"
  tar_format: tar.xz

build:
  system: autotools-custom
  configure_options:
    - "--enable-languages=c,fortran"
    - "--disable-bootstrap"
    - "--disable-multilib"
    - "--disable-libquadmath"
    - "--disable-libgomp"
    - "--disable-libssp"
    - "--disable-libvtv"
    - "--disable-libatomic"
    - "--disable-libitm"
    - "--disable-libsanitizer"
    - "--disable-shared"
    - "--disable-threads"
    - "--without-isl"
  dependencies:
    - "bundled gmp/6.1.0"
    - "bundled mpfr/3.1.4"
    - "bundled mpc/1.0.3"
  cc: clang
  cxx: clang++

source_transforms:
  - "Map linux-ohos to GCC's musl target configuration"
  - "Inject config.sub compatibility into GCC and bundled prerequisites"
  - "Canonicalize none-unknown-linux-ohos from bundled prerequisite configure scripts to aarch64-unknown-linux-ohos"
  - "Replace Autoconf umask 077 with umask 022 for HMDFS"
  - "Apply source transforms before Conan copies the source tree to avoid immediate HMDFS rewrite/execute failures"
  - "Use gcc_build_env.sh instead of Conan's reserved conanbuild.sh name to prevent recursive self-sourcing and SIGSEGV"
  - "Run configure, make and install with Bash and an unlimited stack because HarmonyOS shells otherwise crash on GCC's generated scripts"
  - "Retry only signal-11 command failures once after os.sync() because the same command succeeds after HMDFS settles"
  - "Override CI's LLVM IR assembler with the device's GNU as and ld for GCC target assembly"

knowledge_gained:
  - "aarch64-linux-ohos must select GCC's musl ABI and /lib/ld-musl-aarch64.so.1"
  - "GCC host generators and output programs require HarmonyOS ELF signing"
  - "GCC 9.5.0 officially selects GMP 6.1.0, MPFR 3.1.4 and MPC 1.0.3 for in-tree builds"
  - "CONFIG_SHELL alone does not replace the initial interpreter or raise its stack limit; invoke Bash explicitly after ulimit -s unlimited"
  - "OpenDesk exports AS=llvm-as, but GCC needs GNU as; /data/service/hnp/bin/as and ld are GNU Binutils 2.45"
  - "GCC's detected -fno-PIE/-no-pie flags trigger an unaligned stderr copy relocation in HarmonyOS LLD"
  - "The device has no /usr/include; Clang uses the OHOS SDK native/sysroot/usr/include tree"
  - "libgfortran builds successfully with --disable-libquadmath (no REAL(16) support) and --disable-threads"
  - "libbacktrace must stay ENABLED: GCC 9 cc1/f951 link the host libbacktrace unconditionally (cc1-checksum.c); the target libbacktrace is built with the xgcc-sign wrapper after adding -B<sysroot>/usr/lib/<triplet>/ so configure link probes succeed"
  - "gfortran driver wrapper needs the same GCC_EXEC_PREFIX, -isystem sysroot and -B package_lib injection as the gcc driver"
  - "Fortran test programs (gfortran.dg) need -B to the in-tree libgfortran build directory for static linking"

verification:
  local_static_checks: pass
  ohos_ci: pending
  note: "No HarmonyOS build success is claimed until the official CI completes."
