package: glade/3.40.0
homepage: "https://gitlab.gnome.org/GNOME/glade"

upstream_check_command: "meson test (add-child, create-widgets, refcount, toplevel-order; modules needs python/gjs plugins)"
upstream_test_in_build: true
upstream_test_command: "broadwayd :tcp5 & tests/{add-child,create-widgets,refcount,toplevel-order}"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "glade-3.40.0.tar.xz"
  source_sha256: "31c9adaea849972ab9517b564e19ac19977ca97758b109edc3167008f53e3d9c"
  build_system: "Meson"
  test_definition: "tests/meson.build registers five gtk_test_init TAP executables (add-child, create-widgets, modules, refcount, toplevel-order) driven via meson test"
  display_note: "gtk_test_init requires a display; the GTK+ 3.24.43 build on OHOS only ships the broadway backend, so the suite runs against a broadwayd virtual display (display :tcp5 = 127.0.0.1:9095, the same gtk package's broadwayd, restaged+resigned)"
  portability_changes:
    - "meson.build: subdir('help') skipped via patch 0001 — gnome.yelp requires itstool, unavailable in the OHOS build environment; runtime help docs are optional data"
    - "introspection/gjs/python/webkit2gtk/man disabled via meson options (no gobject-introspection runtime, no pygobject, no webkit2gtk, no docbook xsltproc network fetch)"
    - "hicolor icon theme index + GTK gsettings schemas staged into XDG_DATA_DIRS before running tests: GTK 3.24.43 conan build hits a brk assertion inside gtk_icon_theme_lookup_icon when no hicolor theme exists (musl, no message, SIGTRAP); with a valid index.theme the lookup returns NULL normally"
  environment_limitations:
    - "tests/modules requires the python (pygobject) and gjs plugins which are disabled on OHOS (no pygobject/gjs ecosystem in the registry); both of its data functions bail out on the missing MyPythonBox/MyJSGrid adaptors — skipped with reason, matches upstream behaviour when the features are disabled"

upstream_tests:
  - test_name: "add-child"
    target: "tests/add-child"
    source: "tests/add-child.c"
    description: "GladeWidgetAdaptor parent/child wiring for the whole GTK+ widget zoo (windows, boxes, grids, notebooks, menus, toolbars, cell layouts, text tags)"
    command: "./tests/add-child"
    total: 1228
    passed: 1228
  - test_name: "create-widgets"
    target: "tests/create-widgets"
    source: "tests/create-widgets.c"
    description: "glade_widget_adaptor_create_widget for every catalog adaptor plus finalization checks"
    command: "./tests/create-widgets"
    total: 154
    passed: 154
  - test_name: "refcount"
    target: "tests/refcount"
    source: "tests/refcount.c"
    description: "GladeProject refcounting across load/unload cycles"
    command: "./tests/refcount"
    total: 1
    passed: 1
  - test_name: "toplevel-order"
    target: "tests/toplevel-order"
    source: "tests/toplevel-order.c"
    description: ".glade resource compile + toplevel ordering of loaded projects"
    command: "./tests/toplevel-order"
    total: 7
    passed: 7
  - test_name: "modules"
    target: "tests/modules"
    source: "tests/modules.c"
    description: "python/gjs plugin adaptor lookup (MyPythonBox / MyJSGrid) — requires the optional python and gjs plugins, disabled on OHOS"
    command: "./tests/modules"
    total: 2
    passed: 0
    skipped_reason: "requires pygobject/gjs plugins (meson -Dpython=disabled -Dgjs=disabled on OHOS; no pygobject/gjs packages published)"

upstream_test_total: 1392
upstream_test_passed: 1390
upstream_test_failed: 0
upstream_test_skipped: 2

test_package_tests:
  - file: test_glade.c
    scenario: "consumer-api"
    description: "Build and run a Conan consumer against the packaged libgladeui: glade_init, GladeApp singleton, gtk+ catalog with adaptors, and a minimal .glade XML round-trip through glade_project_load_from_file (toplevel count + GtkBox type assert), under the same broadway virtual display as the upstream suite."
    command: "./test_glade"
    assertions: 10
  - file: conanfile.py (CLI contract)
    scenario: "cli-version"
    description: "The packaged glade binary prints 'glade 3.40.0' and exits 0 for --version (pre-window path exercised under the broadway display)."
    command: "glade --version"
    assertions: 1

assertion_count: 11
