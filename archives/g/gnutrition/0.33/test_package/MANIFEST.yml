# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gnutrition/0.33
homepage: "http://www.gnu.org/software/gnutrition/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# gnutrition 0.33 上游无任何测试入口（R51 清点证据）：
#   - 源码树无 test*/tests/ 目录、无 *.t 测试文件（find 零匹配，见审计台账）
#   - Makefile.am 无 TESTS/check_PROGRAMS/check_SCRIPTS（grep 零匹配）
#   - configure.ac 无 AC_CONFIG_TESTDIR/--enable-tests
# 因此上游声明总数 = 0，conanfile.py build() 无上游测试可集成。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者验证：真实启动已安装 gnutrition 产物（+包内 food.db 数据），断言 sqlite3 数据层加载成功并纪实分类 OHOS headless 显示依赖边界"
    command: "./test_gnutrition"
  - file: harmonyos_specific_test.c
    description: "鸿蒙专项测试：GNUTRITION_DATADIR 环境变量覆盖（有效/无效/未设置三用例），验证 data-path 适配在 OHOS aarch64 上的可观测行为"
    command: "./harmonyos_specific_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6