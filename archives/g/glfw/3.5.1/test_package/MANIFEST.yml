# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: glfw/3.5.1
homepage: "https://www.glfw.org"

# 上游测试命令（上游 tests/ 无 add_test，非 CTest 体系；20 个测试程序为
# GUI 交互程序，按 build-only 验编译口径申报，详见 upstream_test_in_build 注释）
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# glfw 上游 tests/ 只有 add_executable（无 enable_testing/add_test），
# 且 20 个测试程序全部需要真实窗口系统/显示器才能运行（OHOS Null-only
# 构建无 X11/Wayland/Cocoa 后端），故不在 build() 中集成上游测试，
# 上游测试程序按"编译验证"口径申报（GLFW_BUILD_TESTS=OFF 于主配方）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（20 个，tests/CMakeLists.txt add_executable 实测）
upstream_tests:
  - file: tests/allocator.c
    source: glfw-3.5.1/tests/allocator.c
    description: "自定义分配器下创建窗口与上下文（需显示器）"
    command: "./allocator"
  - file: tests/clipboard.c
    source: glfw-3.5.1/tests/clipboard.c
    description: "剪贴板读写（需窗口系统）"
    command: "./clipboard"
  - file: tests/events.c
    source: glfw-3.5.1/tests/events.c
    description: "事件回调打印（需窗口系统）"
    command: "./events"
  - file: tests/msaa.c
    source: glfw-3.5.1/tests/msaa.c
    description: "多重采样抗锯齿（需 GL 渲染）"
    command: "./msaa"
  - file: tests/glfwinfo.c
    source: glfw-3.5.1/tests/glfwinfo.c
    description: "GLFW/上下文信息报告（--platform=null 可无头运行）"
    command: "./glfwinfo --platform=null"
  - file: tests/iconify.c
    source: glfw-3.5.1/tests/iconify.c
    description: "窗口最小化/还原（需窗口系统）"
    command: "./iconify"
  - file: tests/monitors.c
    source: glfw-3.5.1/tests/monitors.c
    description: "监视器枚举与视频模式（需窗口系统）"
    command: "./monitors"
  - file: tests/reopen.c
    source: glfw-3.5.1/tests/reopen.c
    description: "窗口关闭后重开（需窗口系统）"
    command: "./reopen"
  - file: tests/cursor.c
    source: glfw-3.5.1/tests/cursor.c
    description: "光标形状与自定义光标（需窗口系统）"
    command: "./cursor"
  - file: tests/empty.c
    source: glfw-3.5.1/tests/empty.c
    description: "空窗口事件循环（需窗口系统）"
    command: "./empty"
  - file: tests/gamma.c
    source: glfw-3.5.1/tests/gamma.c
    description: "伽马斜坡读写（需显示器）"
    command: "./gamma"
  - file: tests/icon.c
    source: glfw-3.5.1/tests/icon.c
    description: "窗口图标设置（需窗口系统）"
    command: "./icon"
  - file: tests/inputlag.c
    source: glfw-3.5.1/tests/inputlag.c
    description: "输入延迟测量（需窗口系统）"
    command: "./inputlag"
  - file: tests/joysticks.c
    source: glfw-3.5.1/tests/joysticks.c
    description: "手柄枚举与轴/按钮（需输入设备）"
    command: "./joysticks"
  - file: tests/tearing.c
    source: glfw-3.5.1/tests/tearing.c
    description: "撕裂测试渲染（需 GL 渲染）"
    command: "./tearing"
  - file: tests/threads.c
    source: glfw-3.5.1/tests/threads.c
    description: "多线程窗口渲染（需 GL 渲染）"
    command: "./threads"
  - file: tests/timeout.c
    source: glfw-3.5.1/tests/timeout.c
    description: "事件等待超时（需窗口系统）"
    command: "./timeout"
  - file: tests/title.c
    source: glfw-3.5.1/tests/title.c
    description: "UTF-8 窗口标题（需窗口系统）"
    command: "./title"
  - file: tests/triangle-vulkan.c
    source: glfw-3.5.1/tests/triangle-vulkan.c
    description: "Vulkan 三角形渲染（需 Vulkan 驱动）"
    command: "./triangle-vulkan"
  - file: tests/window.c
    source: glfw-3.5.1/tests/window.c
    description: "窗口属性查询与设置（需窗口系统）"
    command: "./window"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "NULL 平台生命周期测试: glfwInitHint(GLFW_PLATFORM, GLFW_PLATFORM_NULL)→glfwInit→glfwGetVersion(3.5.1)→glfwGetVersionString→glfwWindowHint(GLFW_CLIENT_API, GLFW_NO_API)+glfwCreateWindow(640x480)→glfwGetWindowSize→监视器API全链路(GetMonitors/GetPrimaryMonitor/GetMonitorName/GetMonitorPos/ContentScale/GetVideoMode 1920x1080@60/GetGammaRamp 256项,null平台模拟监视器)→glfwGet/SetInputMode(GLFW_CURSOR)→glfwGetKey→glfwGetClipboardString→glfwGetTime/GetTimerFrequency(posix timer)→glfwSetWindowTitle/WindowShouldClose→glfwDestroyWindow→glfwTerminate"
    command: "./test_glfw_null"

# 测试断言总数 (21 个 CHECK 断言)
assertion_count: 21
