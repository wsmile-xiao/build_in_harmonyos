version: "3.5.1"
software: "glfw"
status: published
build_date: "2026-09-06"
build_system: cmake

source:
  url: "https://github.com/glfw/glfw/releases/download/3.5.1/glfw-3.5.1.zip"
  sha256: "ea79bc5feffc254c87291980c2d0bce9acebb68c4983b79f961dcd2cb8a611a0"
  tar_format: zip

build:
  system: cmake
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=<NDK>/build/cmake/ohos.toolchain.cmake"
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DGLFW_BUILD_X11=OFF"
    - "-DGLFW_BUILD_WAYLAND=OFF"
    - "-DGLFW_BUILD_EXAMPLES=OFF"
    - "-DGLFW_BUILD_TESTS=OFF"
    - "-DGLFW_BUILD_DOCS=OFF"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DGLFW_LIBRARY_TYPE=SHARED"
    - '-DCMAKE_C_FLAGS=-D_DEFAULT_SOURCE'
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-posix_time.c.patch"

knowledge_gained:
  - "Null-only 方案：上游 3.5.x 无条件编入 null_*.c，关 X11/Wayland 即得无头 GLFW（glfwInitHint(GLFW_PLATFORM, GLFW_PLATFORM_NULL)）"
  - "3.5.1 比 3.4 多一道 _DEFAULT_SOURCE 坑：上游仅对 CMAKE_SYSTEM_NAME==Linux 注入，OHOS 不命中，需 CMAKE_C_FLAGS=-D_DEFAULT_SOURCE（E152 相关）"
  - "ohos.toolchain 下 UNIX=1，不显式 GLFW_BUILD_X11=OFF 会双关 X11/Wayland → find_package(X11 REQUIRED) FATAL"
  - " 平台会模拟一个假监视器（Null SuperNoop 0, 1920x1080@60），测试断言方向与直觉相反"
  - "glfwCreateWindow 想要 NO_API 必须先 glfwWindowHint(GLFW_CLIENT_API, GLFW_NO_API)，否则 null 平台尝试加载 OSMesa"

