software: glfw
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"
compile_date: "2026-05-27"

# 构建系统类型（兼容旧验证逻辑）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.zip"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DGLFW_BUILD_X11=OFF"
    - "-DGLFW_BUILD_WAYLAND=OFF"
    - "-DGLFW_BUILD_EXAMPLES=OFF"
    - "-DGLFW_BUILD_TESTS=OFF"
    - "-DGLFW_BUILD_DOCS=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_C_FLAGS=-isystem /data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot/usr/include -D_GNU_SOURCE"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-src-posix_time.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E103: OHOS SDK lld 需要设置 LD_LIBRARY_PATH 包含 llvm/lib"
  - "E104: POSIX CLOCK_* 常量需要 -D_GNU_SOURCE"
  - "E105: GLFW 只支持 Null platform (禁用 X11/Wayland)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/glfw-3.4.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/glfw-3.4.work
  source_orig_hash: 00aec57cd05eaa19
  source_work_hash: 42b52b8d758ebae8
  generated_at: '2026-05-27T12:12:15'
  patches_count: 1

patch_classification:
  - file: 0001-src-posix_time.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
