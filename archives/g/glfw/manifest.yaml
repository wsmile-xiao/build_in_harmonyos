# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: glfw
display: "GLFW"
description: "A multi-platform library for OpenGL, OpenGL ES, Vulkan, window and input"
category: graphics
homepage: "https://www.glfw.org"
license: zlib

build_system: cmake

ohos_adaptation:
  key_points:
    - "3.5.1 走上游原版 Null-only：关闭 X11/Wayland 后仅含 null_*.c + posix_*，单次 cmake 无循环依赖，产 libglfw.so.3.5（soname libglfw.so.3）"
    - "3.4.6 用 ohos_native_glfw fork：src/ohos_*.c 原生实现 _GLFWplatform（窗口/输入/事件）+ XComponent，桌面 GL + Vulkan 双后端"
    - "3.4.6 产两个互为 DT_NEEDED 的 .so：libglfw.so.3（主库）+ libglfw_bridge.so（HAP NAPI 桥），two-pass 循环链接（复刻源码 build-ohos.sh）"
    - "cmake 库须让 conan_toolchain include ohos.toolchain（host profile 补 user_toolchain）才出 SONAME，否则 -l:libglfw.so.3 链接失败（见 ML-0035）"
    - "3.4（旧）走 upstream + POSIX 时间补丁，已被 3.4.6 fork 方案取代"
  common_dependencies: []

versions:
  "3.5.1":
    status: published
    build_date: "2026-09-06"
    source_url: "https://github.com/glfw/glfw/releases/download/3.5.1/glfw-3.5.1.zip"
  "3.4":
    status: published
    build_date: "2026-05-19"
    source_url: "https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.zip"
  "3.4.6":
    status: built
    build_date: "2026-07-04"
