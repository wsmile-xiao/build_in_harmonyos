software: "gmime"
version: "3.2.15"
status: built
build_date: "2026-09-13"
build_system: autotools

source:
  url: "https://github.com/jstedfast/gmime/releases/download/3.2.15/gmime-3.2.15.tar.xz"
  sha256: "84cd2a481a27970ec39b5c95f72db026722904a2ccf3fdbd57b280cf2d02b5c4"
  upstream_version: "3.2.15"

configure_options:
  - "--enable-static --disable-shared"
  - "--build=aarch64-linux --host=aarch64-linux"
  - "--disable-maintainer-mode"
  - "--disable-crypto"
  - "--without-libidn"
  - "--disable-gtk-doc --disable-introspection --enable-vala=no"

build:
  system: autotools
  dependencies:
    - glib2/2.88.0
    - pcre2/10.45
    - zlib/1.3.1.1
  jobs: 4

patches_applied: []

notes: |
  gmime 3.2.15 为上游客服端（pan）所需的 MIME 库。源码用上游 GitHub release
  tarball（含预生成的 configure/Makefile.in/aclocal.m4/ltmain.sh），因此
  不像 3.0.5（GitLab git-archive 只有 configure.ac/Makefile.am）那样在配方里
  自举 autotools。依赖仅保留 glib2（glib-2.0>=2.68 + gobject/gio/gthread）、
  其传递依赖 pcre2、以及 zlib；gpgme（PGP/S/MIME）与 libidn2 在 OHOS 上
  不可用且下游不需要，故 --disable-crypto --without-libidn。上游 11 个
  AUTOMATED_TESTS 随 make check 在 build() 内全量执行。
