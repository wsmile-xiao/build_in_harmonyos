# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）
#
# gmime 3.2.15 上游测试基于 autotools：tests/Makefile.am 定义
# AUTOMATED_TESTS 列表，由自定义 check-local 规则逐个执行并汇总
# "Results: N tests passed; M tests failed."，已在配方 build() 中随
# make check 全量执行（11 个自动化测试程序）。
# 已知平台/环境限制导致的失败（见 notes.md）：
#   test-iconv     需要 glibc 独有的 windows-cp1251 iconv 别名，musl 无；
#   test-autocrypt 需要 gpg/gpg2 二进制，OHOS 未提供。

package: gmime/3.2.15
homepage: "https://github.com/jstedfast/gmime"

# 上游测试命令（已在 build() 中集成执行）
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（AUTOMATED_TESTS，无 crypto 时全部 11 个）
upstream_tests:
  - file: tests/test-mime.c
    source: gmime-3.2.15.tar.xz/tests/test-mime.c
    description: "MIME 解析/编码核心测试（addrspec/rfc2047/rfc2184/folding/references 等）"
    command: "./test-mime -v data/mime"
  - file: tests/test-headers.c
    source: gmime-3.2.15.tar.xz/tests/test-headers.c
    description: "头部同步与格式化测试"
    command: "./test-headers -v data/headers"
  - file: tests/test-streams.c
    source: gmime-3.2.15.tar.xz/tests/test-streams.c
    description: "GMimeStream 流抽象测试（mem/file/filter/mmap）"
    command: "./test-streams -v data/streams"
  - file: tests/test-cat.c
    source: gmime-3.2.15.tar.xz/tests/test-cat.c
    description: "GMimeStreamCat 级联流测试"
    command: "./test-cat -v data/cat"
  - file: tests/test-encodings.c
    source: gmime-3.2.15.tar.xz/tests/test-encodings.c
    description: "传输编码（base64/quoted-printable/uuencode）编解码测试"
    command: "./test-encodings -v data/encodings"
  - file: tests/test-filters.c
    source: gmime-3.2.15.tar.xz/tests/test-filters.c
    description: "GMimeFilter 过滤器链测试"
    command: "./test-filters -v data/filters"
  - file: tests/test-mime-part.c
    source: gmime-3.2.15.tar.xz/tests/test-mime-part.c
    description: "GMimePart 部件构造与解析测试"
    command: "./test-mime-part -v data/mime-part"
  - file: tests/test-iconv.c
    source: gmime-3.2.15.tar.xz/tests/test-iconv.c
    description: "charset 转换往返测试 — OHOS musl 缺 windows-cp1251 别名，1 项失败"
    command: "./test-iconv -v data/iconv"
  - file: tests/test-partial.c
    source: gmime-3.2.15.tar.xz/tests/test-partial.c
    description: "message/partial 分段消息重组测试"
    command: "./test-partial -v data/partial"
  - file: tests/test-mbox.c
    source: gmime-3.2.15.tar.xz/tests/test-mbox.c
    description: "mbox 邮箱格式解析测试"
    command: "./test-mbox -v data/mbox"
  - file: tests/test-autocrypt.c
    source: gmime-3.2.15.tar.xz/tests/test-autocrypt.c
    description: "Autocrypt 头生成/解析测试 — 需要 gpg 二进制，OHOS 环境无 gpg"
    command: "./test-autocrypt -v data/autocrypt"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "gmime 真实 API 冒烟：GMimeParser 解析 RFC822 消息 + RFC2047 主题解码 + InternetAddressList 收件人解析 + UTF-8 主题 set/get 往返 + 流过滤器管道 + base64 增量解码"
    command: "./test_gmime"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
