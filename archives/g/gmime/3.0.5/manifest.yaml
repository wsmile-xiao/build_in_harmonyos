# gmime 3.0.5 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "3.0.5"

software: gmime

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GNOME GitLab 官方 archive；gmime 3.0.5 未发布
  # download.gnome.org release tarball，ftp/清华/中科大镜像均 404，
  # GitLab archive 实测可达）
  url: "https://gitlab.gnome.org/GNOME/gmime/-/archive/3.0.5/gmime-3.0.5.tar.gz"

  # 源码校验和（本地实测）
  sha256: "71d4da89e6a1a039e091f7192cce6928fcf2a62f1e8c00fa39c456a9af61c9d3"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-linux"
    - "--host=aarch64-linux"
    - "--prefix=<conan package folder>"
    - "--disable-crypto"
    - "--enable-static"
    - "--disable-shared"
    - "--disable-gtk-doc"
    - "--disable-introspection"
    - "--enable-vala=no"
    - "--without-libidn"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib2/2.88.0
    - zlib/1.3.1.1
    - pcre2/10.45

  # 构建工具依赖（autotools 自举）
  tool_dependencies:
    - automake/1.18
    - libtool/2.5.4.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（gtk-doc.m4 非源码补丁，是 aclocal 必需的宏文件：
# configure.ac 调用 GTK_DOC_CHECK 宏，OHOS 环境无 gtk-doc 包提供）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "GitLab archive tarball 不含 configure/Makefile.in/aclocal.m4，必须 tool_requires automake/1.18 + libtool/2.5.4.1 自举（autoconf/autoheader 用 hnp 2.72）"
  - "automake 必须带 PERL5LIB（指向 automake 包 share/automake-1.18），否则静默不生成 Makefile.in 中的 @GLIB_CFLAGS@ 替换行（wrapper 脚本 RC=0 但 perl 模块加载失败）"
  - "configure.ac 的 GTK_DOC_CHECK 宏需要 gtk-doc.m4，OHOS 无 gtk-doc 包：从 gtk-doc 上游 buildsystems/autotools/gtk-doc.m4 取（patches/ 携带）"
  - "AM_PATH_GLIB_2_0 宏（glib2 包 share/aclocal/glib-2.0.m4）+ pkg.m4（hnp pkg-config）必须在 ACLOCAL_PATH；GLIB_CFLAGS 经 PKG_CHECK_MODULES 的 AC_ARG_VAR 隐式 AC_SUBST 进 Makefile"
  - "glib2/2.88.0 制品包 .pc 文件 prefix=/ 失效 + Requires: pcre2 但 pcre2 包只发 libpcre2-8.pc：复制 pc 到临时目录修 prefix + 生成 pcre2.pc 别名（Libs: -lpcre2-8）"
  - "gmime 需要的 automake 辅助文件：ChangeLog（dist 规则要求，git archive 缺失 touch 空文件）+ gtk-doc.make（EXTRA_DIST 引用，写占位文件）"
  - "上游 make check：8 个 AUTOMATED_TESTS，6 PASS/2 FAIL；test-iconv 失败根因是 musl iconv 无 glibc 的 windows-cp1251 别名（cp1251/windows-1251 均可用），test-autocrypt 需要 gpg 二进制（OHOS 无）——均为平台限制非代码缺陷"
  - "测试数据目录坑：check-local 传 $(srcdir)/data/<name>，构建目录只有运行时生成的 cat/streams 数据，mbox/partial 用源码目录数据实测均 PASS"
