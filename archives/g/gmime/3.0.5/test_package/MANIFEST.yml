# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）
#
# gmime 3.0.5 上游测试基于 autotools check-local（tests/Makefile.am 的
# AUTOMATED_TESTS），已在配方 build() 中随 make check 全量执行：
# 8 个测试程序 6 PASS / 2 FAIL（FAIL 均为 OHOS 平台/环境限制，见 notes.md：
# test-iconv 需要 glibc 独有的 windows-cp1251 iconv 别名，musl 无；
# test-autocrypt 需要 gpg/gpg2 二进制，OHOS 未提供）。

package: gmime/3.0.5
homepage: "https://gitlab.gnome.org/GNOME/gmime"

# 上游测试命令（已在 build() 中集成执行）
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（AUTOMATED_TESTS，全部 8 个）
upstream_tests:
  - file: tests/test-mime.c
    source: gmime-3.0.5.tar.gz/tests/test-mime.c
    description: "MIME 解析/编码核心测试（addrspec/rfc2047/rfc2184/folding/references 等 14 组）"
    command: "./test-mime -v data/mime"
  - file: tests/test-headers.c
    source: gmime-3.0.5.tar.gz/tests/test-headers.c
    description: "头部同步与格式化测试"
    command: "./test-headers -v data/headers"
  - file: tests/test-streams.c
    source: gmime-3.0.5.tar.gz/tests/test-streams.c
    description: "GMimeStream 流抽象测试（mem/file/filter/mmap）"
    command: "./test-streams -v data/streams"
  - file: tests/test-cat.c
    source: gmime-3.0.5.tar.gz/tests/test-cat.c
    description: "GMimeStreamCat 级联流测试"
    command: "./test-cat -v data/cat"
  - file: tests/test-iconv.c
    source: gmime-3.0.5.tar.gz/tests/test-iconv.c
    description: "charset 转换往返测试（27 种字符集）— OHOS musl 缺 windows-cp1251 别名 1 项失败"
    command: "./test-iconv -v data/iconv"
  - file: tests/test-partial.c
    source: gmime-3.0.5.tar.gz/tests/test-partial.c
    description: "message/partial 分段消息重组测试"
    command: "./test-partial -v data/partial"
  - file: tests/test-mbox.c
    source: gmime-3.0.5.tar.gz/tests/test-mbox.c
    description: "mbox 邮箱格式解析测试"
    command: "./test-mbox -v data/mbox"
  - file: tests/test-autocrypt.c
    source: gmime-3.0.5.tar.gz/tests/test-autocrypt.c
    description: "Autocrypt 头生成/解析测试 — 需要 gpg 二进制，OHOS 环境无 gpg"
    command: "./test-autocrypt -v data/autocrypt"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "gmime 真实 API 冒烟：GMimeParser 解析 RFC822 消息 + RFC2047 主题解码 + InternetAddressList 收件人解析 + UTF-8 主题 set/get 往返"
    command: "./test_gmime"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
