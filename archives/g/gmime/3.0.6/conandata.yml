# conandata.yml — gmime 3.0.6
# 源码来源：GNOME GitLab 官方 archive（git tag 3.0.5 的 tarball）。
# 注意：gmime 3.0.5 的 download.gnome.org release tarball 历史上不可靠
#（ftp/清华/中科大镜像曾 404），GitLab archive 实测可达（6.2MB），
# sha256 为本地实测值。
# 上游仓库：https://gitlab.gnome.org/GNOME/gmime
# 版本说明：3.0.6 = 上游 3.0.5 源码 + 配方修订（R37：制品仓已发布 3.0.5，
# cnb.cool 不支持同版本多 revision，适配修复递增后缀；源码 URL/sha 与 3.0.5 相同）。

sources:
  url: "https://gitlab.gnome.org/GNOME/gmime/-/archive/3.0.5/gmime-3.0.5.tar.gz"
  sha256: "71d4da89e6a1a039e091f7192cce6928fcf2a62f1e8c00fa39c456a9af61c9d3"

patches:
  3.0.6:
    - patch_file: patches/0001-test-iconv-portable-charset.patch
      patch_description: tests/test-iconv uses glibc-only alias windows-cp1251; use canonical windows-1251 (same codepage, works on musl and glibc)
      patch_type: portability
    - patch_file: patches/0002-test-autocrypt-optional-gpg.patch
      patch_description: tests/test-autocrypt exits EXIT_FAILURE when no gpg binary exists; run portable subset and warn-skip only the encrypt case when built --disable-crypto on OHOS without gpg
      patch_type: portability
