software: gmime
display: "gmime"
description: "GMime is a C/C++ library for parsing and creating MIME messages"
category: mail
homepage: "https://gitlab.gnome.org/GNOME/gmime"
license: LGPL-2.1
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitLab archive 无 configure/Makefile.in，配方内 aclocal→autoconf→libtoolize→automake 自举（tool_requires automake/libtool）"
    - "gtk-doc.m4/pkg.m4/glib-2.0.m4 宏文件需显式加入 ACLOCAL_PATH（OHOS 无 gtk-doc 包）"
    - "glib2 制品包 .pc prefix=/ 失效 + Requires: pcre2 别名不匹配，配方内复制修复"
    - "依赖 glib2/2.88.0（制品仓静态包）+ zlib/1.3.1.1(PIC) + pcre2/10.45"
common_dependencies:
  - glib2
  - zlib

versions:
  "3.0.5":
    status: published
    build_date: "2026-09-03"
  "3.0.6":
    status: built
    build_date: "2026-09-10"
  "3.2.7":
    status: built
    build_date: "2026-05-27"
