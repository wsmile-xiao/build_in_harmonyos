# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: guilite/2.1
homepage: "https://github.com/idea4good/GuiLite"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# GuiLite v2.1 官方 tag 源码无 tests/ 目录、无 CTest/Makefile check 目标
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：v2.1 tag 未提供任何测试源/测试目标
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用 GuiLite 公开 API（c_rect/c_fifo/get_time_in_second/second_to_day/build_bmp）并验证结果"
    command: "./test_guilite"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
