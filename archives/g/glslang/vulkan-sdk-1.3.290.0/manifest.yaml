software: glslang
version: vulkan-sdk-1.3.290.0
status: built
build_system: cmake
description: "OpenGL and OpenGL ES shader front end and validator"
url: https://github.com/KhronosGroup/glslang/archive/refs/tags/vulkan-sdk-1.3.290.0.tar.gz

dependencies:
  build:
    - cmake >= 3.17.2
    - gcc
    - g++
  runtime:
    - spirv-tools

configure_options:
  - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DALLOW_EXTERNAL_SPIRV_TOOLS=ON"
  - "-DENABLE_OPT=ON"
  - "-DBUILD_SHARED_LIBS=OFF"

build_commands:
  - mkdir -p build && cd build
  - cmake .. -DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX -DCMAKE_BUILD_TYPE=Release
  - make -j$(nproc)
  - make install DESTDIR=$TEST_PREFIX

binaries:
  - glslang
  - spirv-remap

libraries:
  - libglslang.a
  - libSPIRV.a

patches:
  - 0001-add-harmonyos-platform-support.patch

knowledge_gained:
  - "CMake 平台识别问题：HarmonyOS 未被识别为 Unix-like 系统，需要手动添加平台检测"

limitations:
  - "GLSLANG_TESTS 已禁用（部分测试依赖平台特性）"