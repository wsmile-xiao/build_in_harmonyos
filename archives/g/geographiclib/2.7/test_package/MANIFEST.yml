# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: geographiclib/2.7
homepage: "https://geographiclib.sourceforge.io/"

# 上游测试命令 (ctest -N 枚举: 207 具名 add_test + 4 测试程序 = 211 项声明)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 中未集成上游测试 (R51: 测试在独立步骤全量枚举运行)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (独立用户测试源 + 工具门控测试)
upstream_tests:
  - file: geodtest.cpp
    source: geographiclib-2.7/tests/geodtest.cpp
    description: "测地线正反算/弧长测试 (testinverse/testdirect/testarcdirect × Geodesic/GeodesicExact)"
    command: "./geodtest"
  - file: signtest.cpp
    source: geographiclib-2.7/tests/signtest.cpp
    description: "+/-0、+/-180 符号与舍入处理测试 (234 个 check 断言)"
    command: "./signtest"
  - file: polygontest.cpp
    source: geographiclib-2.7/tests/polygontest.cpp
    description: "多边形面积测试 (Planimeter15/19/21/29)"
    command: "./polygontest"
  - file: intersecttest.cpp
    source: geographiclib-2.7/tests/intersecttest.cpp
    description: "测地线求交测试 (checkcoincident1)"
    command: "./intersecttest"

# 全量 ctest 现状（R02 恢复外部数据后实测）: 211 项声明 / 211 项注册 / 211 项全部通过
# （GEOGRAPHICLIB_DATA 指向官方 SourceForge 数据包目录；R01 无数据时为 199 项注册，
#   12 项 Geoid/Magnetic/Gravity 数据门控用例已在本轮全部恢复并运行通过，缺口清零。
#   数据获取方法见 notes.md/测试台账。）
# 各工具门控测试 (GeoConvert0-23, GeodSolve0-101, Planimeter0-29 等) 复用上方
# tools 构建目标, 由 ctest 注册并覆盖, 此处不重复列举。

# test_package 中自带的测试 (消费者视角验证 + OHOS 专项用例)
test_package_tests:
  - file: test.cpp
    description: "OHOS 专项: Geodesic::WGS84().Inverse() 距离断言(参考值 111319.49079327m) + GeoCoords MGRS 解析"
    command: "./test_geographiclib"

# 测试断言总数 (upstream check 独立断言估算: geodtest 120 用例 + signtest 234 + polygontest 4 + intersecttest 1 = 359; 不含 ctest 工具门控正则)
assertion_count: 359