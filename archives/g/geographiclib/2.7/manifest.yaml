# 版本级 manifest — geographiclib 2.7
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "2.7"

# 软件名
software: "geographiclib"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期
build_date: "2026-09-10"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方 GitHub tag v2.7)
  url: "https://github.com/geographiclib/geographiclib/archive/refs/tags/v2.7.tar.gz"

  # 源码校验和 (官方 tarball 实算)
  sha256: "78d77cc8216843b78d14b41970ed9de3dedc34b9cd50ad84af2849c63a41eff8"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型 (实际使用 CMake; init 猜测 autotools 但 tarball 无生成 configure)
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_DOCUMENTATION=OFF"
    - "-DUSE_BOOST=OFF"
    - "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-soname,libGeographicLib.so"

  # 编译依赖列表 (无外部第三方依赖)
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表 (无补丁; SONAME 修复在配方 generate() 中处理)
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 平台 CMake 未识别系统时, 共享库不自动加 SONAME, 工具 DT_NEEDED 会带构建树相对路径; 需显式注入 -Wl,-soname"
  - "GeographicLib 2.7 官方 GitHub tag tarball 无生成的 configure 脚本(仅 configure.ac+autogen.sh), 必须走 CMake 构建"