# 版本级 manifest — git 2.45.2
# 遵循 ARCHIVE-SPEC v2.0

version: "2.45.2"
software: "git"

# published | built | failed | archived
status: published

build_date: "2026-09-25"
build_system: autotools

source:
  url: "https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.45.2.tar.gz"
  sha256: "98b26090ed667099a3691b93698d1e213e1ded73d36a2fde7e9125fce28ba234"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--with-openssl"
    - "--with-curl"
    - "--with-expat"
    - "ac_cv_header_libintl_h=no"
  dependencies:
    - "zlib/1.3.1.1"
    - "openssl/3.5.6.1"
    - "curl/8.15.0.1"
    - "expat/2.8.4"
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-configure-umask-022-for-hmdfs.patch"
    type: portability
    description: "HMDFS UID 映射下 configure 临时目录 umask 077 不可写（知识 E011），放宽为 022"

knowledge_gained:
  - "SDK sysroot 自带 libintl.h 会诱导 configure 追加 -lintl 污染后续链接探测，必须 ac_cv_header_libintl_h=no"
  - "OHOS musl libc 无 pthread_setcancelstate，用官方 NO_PTHREADS 开关走 sigprocmask 回退"
  - "HAVE_DEV_TTY/CURL_LDFLAGS 必须写 config.mak（uname 分支会被 config.mak.autogen 空值覆盖）"
  - "平台无独立 install 命令，install 阶段 PATH 需前置 /system/bin"
  - "RUNTIME_PREFIX 使 bin/git 在包内 relocate 后自动定位 libexec/git-core"
  - "包内置 etc/gitconfig（safe.directory=*）解决 HMDFS dubious ownership"
