# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: git/2.45.2
homepage: "https://git-scm.com/"

# 上游测试命令（git 无 make check，官方测试入口为 make test → t/ 套件）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
# 不集成：t/ 全量 1007 脚本需 perl/网络/守护进程环境且耗时远超 conan create 预算；
# 实测记录见 ../notes.md「R51 上游测试三步法申报表」
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本机 aarch64 实测核心子集，--verbose-log 模式）
upstream_tests:
  - file: t/t0000-basic.sh
    source: git-2.45.2/t/t0000-basic.sh
    description: "test-lib 框架自检 + git 基础命令语义"
    command: "bash t/t0000-basic.sh --verbose-log"
  - file: t/t0001-init.sh
    source: git-2.45.2/t/t0001-init.sh
    description: "git init 全路径（模板/共享目录/重初始化）"
    command: "bash t/t0001-init.sh --verbose-log"
  - file: t/t1300-config.sh
    source: git-2.45.2/t/t1300-config.sh
    description: "git config 读写/include/条件包含全路径"
    command: "bash t/t1300-config.sh --verbose-log"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "执行安装后的 git 二进制：--version 断言 + init/config/add/commit/cat-file/log 冒烟"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
# 实测子集 397 用例；上游全套 1007 脚本约 17866 个注册用例（见 ../notes.md 清点）
assertion_count: 397
