software: git
display: "Git"
description: "分布式版本控制系统"
category: system
homepage: "https://git-scm.com/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "打包时需包含完整的 share/git-core/templates/ 目录"
    - "git 2.35+ safe.directory 安全特性在 HMDFS 上需要配置 safe.directory = *"
    - "安装后需创建 ~/usr/local/etc/gitconfig 包含 safe.directory = *"
  common_dependencies:
    - zlib
    - openssl
    - curl
    - expat
    - gettext

versions:
  "2.49.0":
    status: published
    build_date: "2026-04-25"
