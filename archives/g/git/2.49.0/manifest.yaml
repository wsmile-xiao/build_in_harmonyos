version: "2.49.0"
status: published
build_date: "2026-04-25"

source:
  url: "https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.49.0.tar.gz"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$HOME/usr/local"
  dependencies:
    - zlib
    - openssl
    - curl
    - expat
    - gettext
  cc: clang

patches_applied: []

knowledge_gained:
  - "打包时需包含完整 share/git-core/templates/ 目录"
  - "git 2.35+ safe.directory 安全特性在 HMDFS 上需配置 safe.directory = *"
  - "需创建 ~/usr/local/etc/gitconfig 配置文件"
