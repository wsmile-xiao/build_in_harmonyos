  date: "2026-09-18"
  evidence: "ctest 3/3 PASS（crypto 2.09s / connection_quick 206s / connection_soak 4948.81s 长测）+ p2p 1 项豁免（mock IPv6 loopback 别名需 root，实测 ifconfig ioctl 8916 Permission denied；p2p 二进制构建成功、ctest -N 实测注册 4 项）；test_package 回环 UDP 真实收发 11/11 CHECK 断言 PASS；conan create 全绿（G2 复现验证）"

knowledge_gained:
  - "QUIC 族坑对照：gns 不踩 musl pthread_setaffinity_np（无 affinity 调用）也不踩 CMSG_NXTHDR sign-compare（TOS 辅助数据遍历被 PlatformSupportsRecvTOS() 预处理器裁掉，OHOS 走 false 分支）"
  - "CMake 平台表硬编码 Linux/Darwin/FreeBSD/OpenBSD/Windows（set_target_common_gns_properties FATAL_ERROR），HarmonyOS 不在表内须 CMAKE_SYSTEM_NAME=Linux 强制（msquic/brpc 同款范式）"
  - "protobuf 制品仓包 protoc 是 OHOS 目标二进制：本机同为 OHOS arm64 可直接跑，但需把工具链 libc++_shared.so 目录前插 LD_LIBRARY_PATH（brpc 范式），configure/build 两阶段都要"
  - "protobuf_generate_cpp 在配置期跑 protoc 生成 .pb.cc/.pb.h；CMakeDeps 的 cmake_find_mode=none 包需显式 Protobuf_DIR/utf8_range_DIR/absl_DIR 指向已装 config（grpc/brpc 同款接线）"
  - "ENABLE_ICE 纠偏：上游默认 ON 只加 STEAMNETWORKINGSOCKETS_ENABLE_ICE 定义 + 编译纯 POSIX native ICE client（steamnetworkingsockets_ice_client.cpp，RFC8489 子集），无需任何 submodule，OHOS 可编（BUILD_TESTS=ON 实测）——真正需要 webrtc submodule 的是 USE_STEAMWEBRTC（保持 OFF）。配方恢复上游默认 ENABLE_ICE=ON，交付库携带完整 P2P 面"
  - "上游测试需 BUILD_STATIC_LIB=ON（tests 链 GameNetworkingSockets::static）"
