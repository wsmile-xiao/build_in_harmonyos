# test_package/MANIFEST.yml — gamenetworkingsockets/1.6.0
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md

package: gamenetworkingsockets/1.6.0
homepage: "https://github.com/ValveSoftware/GameNetworkingSockets"

# 上游测试在本地探索目录运行（BUILD_TESTS=ON + ENABLE_ICE=ON 上游默认形态全量构建后 ctest）：
#   connection_quick / connection_soak / crypto / p2p 共 4 项注册测试
#   （p2p 本地豁免：mock IPv6 loopback 别名需 root，见 notes.md 4b）
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - "connection_quick"
  - "connection_soak"
  - "crypto"
  - "p2p"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer test: GameNetworkingSockets_Init（musl pthread 服务线程 + OpenSSL ed25519 证书生成）→ CreateListenSocketIP/CreatePollGroup → ConnectByIPAddress → 回调 AcceptConnection → SendMessageToConnection/ReceiveMessagesOnPollGroup 回环可靠收发 → Close/Destroy/Kill 全生命周期"
