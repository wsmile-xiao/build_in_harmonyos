# test_package/MANIFEST.yml
# glad 2.0.8 — 上游官方测试声明（CI L0e 强制）
package: glad/2.0.8
homepage: "https://github.com/Dav1dde/glad"

# 上游测试命令（官方仓库以 Python 生成器 + C 编译/解析/运行用例为主，
# 无 make check / ctest 顶层入口；此处列出实际核验命令）
upstream_check_command: "python3 -m glad --help; ls test/c/compile test/c/parse test/c/run"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本配方不运行上游 C 用例——它们需要 GPU/EGL 上下文；
# 由 test_package 消费者测试 + HarmonyOS 专项测试覆盖生成 loader 验证）
upstream_tests:
  - file: test/c/compile
    source: glad-2.0.8/test/c/compile
    description: "C 生成器编译用例：76 个独立用例，本机全量生成→clang 编译 76/76 PASS（见 reports/upstream-test-ledger.md）"
  - file: test/c/parse
    source: glad-2.0.8/test/c/parse
    description: "C 生成器解析用例：4 个独立用例，本机全量生成→编译 4/4 PASS（见 reports/upstream-test-ledger.md）"
  - file: test/c/run
    source: glad-2.0.8/test/c/run
    description: "C 运行用例 11 个：需 GLFW/mingw/wine + GPU/显示上下文，本机硬阻塞未运行（GLFW/glfw3.h No such file），见台账"
  - file: test/rust
    source: glad-2.0.8/test/rust
    description: "Rust 生成器用例 8 组：工具链缺失（无 cargo/rustc，R47 能力矩阵 Rust ❌）未运行，不计入 C 交付口径"
