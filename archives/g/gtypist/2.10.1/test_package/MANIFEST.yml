# test_package/MANIFEST.yml - gtypist 2.10.1
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求存在）
# 诚实口径：gtypist 2.10.1 源码无任何自动化测试套件（无 tests/ 目录、无
# TESTS/check_PROGRAMS 注册、无 dejagnu/ctest 注册入口），N_static = 0。

package: gtypist/2.10.1
homepage: "https://www.gnu.org/software/gtypist/"

# 上游测试命令（无 check 目标可运行）
upstream_check_command: ""

# conanfile.py build() 中的上游测试集成（无上游测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序（N_static=0，如实留空并说明）
upstream_tests: []

# test_package 消费者测试（N_consumer=1 个测试程序，3 项行为断言）
test_package_tests:
  - file: test.sh
    description: "运行包内 gtypist 二进制：--version 输出 2.10.1（退出码 0）、--help 输出用法（退出码 0）、非法选项非零退出（gengetopt 标准行为），证明编译产物在 OHOS 上真实链接 ncursesw 并可执行"
    command: "gtypist --version | grep -q 2.10.1 && gtypist --help >/dev/null && ! gtypist --no-such-option-xyz"
  - file: conanfile.py
    description: "调用 test.sh 执行上述 3 项断言（VirtualRunEnv 提供包内 PATH）"
    command: "sh test.sh"
