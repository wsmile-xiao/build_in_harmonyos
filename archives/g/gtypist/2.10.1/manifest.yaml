software: gtypist
version: "2.10.1"
status: built
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/gtypist/gtypist-2.10.1.tar.gz"
  sha256: "09fdea05597b9c44e28dd795b8c9eb79a6afe4d02fef19ea6eb9956bc0813413"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "LDFLAGS=-L/storage/Users/currentUser/usr/local/lib"
    - "CPPFLAGS=-I/storage/Users/currentUser/usr/local/include"
    - "ACLOCAL=/bin/true"
    - "AUTOHEADER=/bin/true"
    - "AUTOMAKE=/bin/true"
    - "--disable-nls"

dependencies:
  - ncurses/6.6

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-umask.patch"
  - "0004-configure-clang.patch"
