software: gpp
version: "2.28"
status: published
build_date: "2026-06-04"

build_info:
  url: "https://files.nothingisreal.com/software/gpp/gpp-2.28.tar.bz2"
  tar_format: "tar.bz2"
  build_system: autotools
  configure_options: "--prefix=/storage/Users/currentUser/usr/local"
  make_options: "-j1"
  extra_env:
    LDFLAGS: "-fuse-ld=bfd -L/storage/Users/currentUser/usr/local/lib"
    CFLAGS: "-fPIC -O2"
    CPPFLAGS: "-I/storage/Users/currentUser/usr/local/include"

dependencies:
  required: []
  optional: []

ohos_adaptation:
  key_points:
    - "lld 链接器依赖 libxml2（系统缺失），需使用 LDFLAGS='-fuse-ld=bfd' 绕过"
    - "configure 生成的 conftest 需要 ELF 签名才能执行（E064: Permission denied）"
    - "config.status 在 HMDFS 上无法创建临时目录，需修改 tmp 路径指向 ~/tmp"
    - "修改的是 autotools 生成的文件（configure/config.status），不创建补丁（R2 铁律）"
  common_dependencies: []
  configure_workarounds:
    - "修改 configure 第 3768 行，在执行 conftest 前调用 sign-elf 签名"
    - "修改 config.status 第 571-589 行，将临时目录指向 ~/tmp 而非当前目录"

knowledge_gained:
  - id: K-gpp-1
    level: L2
    category: autotools
    title: "autotools 在 HMDFS 上的临时目录创建限制"
    description: "config.status 使用 mktemp -d 在当前目录创建临时子目录，HMDFS 不支持在源码目录创建临时目录（Permission denied），需将 tmp 变量指向 ~/tmp"
  - id: K-gpp-2
    level: L2
    category: autotools
    title: "conftest 需 ELF 签名才能在 HarmonyOS 执行"
    description: "configure 执行 conftest 时遭遇 Permission denied（非安全弹窗，而是 ELF 未签名），需在执行前调用 ohc-run.py sign-elf 签名"
  - id: K-gpp-3
    level: L1
    category: linker
    title: "lld 链接器依赖 libxml2 导致编译失败"
    description: "OHOS SDK 的 lld 链接器依赖 libxml2.so.16，系统缺失此库，需使用 LDFLAGS='-fuse-ld=bfd' 切换到 bfd 链接器"

test_results:
  has_test_suite: false
  manual_tests: 16
  manual_tests_passed: 16
  manual_tests_failed: 0
  test_summary: "所有手动功能测试通过，核心预处理能力正常工作"

