software: gpp
version: "2.28"
status: built
build_date: "2026-08-13"

build_info:
  url: "https://files.nothingisreal.com/software/gpp/gpp-2.28.tar.bz2"
  sha256: "343d33d562e2492ca9b51ff2cc4b06968a17a85fdc59d5d4e78eed3b1d854b70"
  tar_format: "tar.bz2"
  build_system: autotools
  configure_options: ""
  make_options: "-j1"
  extra_env: {}

dependencies:
  required: []
  optional: []

ohos_adaptation:
  key_points:
    - "HMDFS 上 mktemp -d 创建的目录权限异常，需 mktemp wrapper 强制 autoconf 使用 mkdir 回退"
    - "默认 lld 链接器在当前环境正常工作（原手动构建使用 bfd 绕过 libxml2 缺失，conan 配方中不需要）"
    - "conftest 可正常执行（默认 lld 产出的 ELF 可执行，无需额外签名）"
  common_dependencies: []
  configure_workarounds:
    - "generate() 创建 mktemp wrapper 返回 exit 1，强制 autoconf AS_TMPDIR 使用 mkdir 回退"

knowledge_gained:
  - id: K-gpp-1
    level: L2
    category: autotools
    title: "HMDFS mktemp -d 权限问题"
    description: "config.status 使用 mktemp -d 创建临时子目录，HMFS 上生成的目录权限为 drwx--S---，导致 awk 文件写入失败。使用 mktemp wrapper 返回失败，强制 autoconf AS_TMPDIR 回退到 mkdir。"
  - id: K-gpp-2
    level: L1
    category: linker
    title: "GNU ld (bfd) 产出的 ELF 不可执行"
    description: "在当前 HarmonyOS 环境中，使用 -fuse-ld=/data/service/hnp/bin/ld (bfd) 链接的二进制会 Permission denied。默认 lld 链接器产出的二进制可正常执行。原手动构建使用 bfd 绕过 libxml2 缺失问题，但在 conan 配方中不使用 bfd。"

test_results:
  has_test_suite: false
  conan_test_package: true
  conan_test_passed: true
  test_summary: "conan test_package: gpp --version 输出 GPP 2.28；预处理测试 #define FOO bar → bar 通过"

notes:
  - "General-purpose preprocessor with customizable syntax"
  - "Autotools 构建系统，无自带测试套件"
  - "无外部依赖，仅依赖 libc.so"
  - "Conan 配方于 2026-08-13 创建并通过本地 CI 模拟构建验证"
