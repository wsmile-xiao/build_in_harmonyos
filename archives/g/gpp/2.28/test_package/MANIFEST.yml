# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gpp/2.28
homepage: "https://logological.org/gpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# gpp 的 make check 无实质内容 (Nothing to be done for 'check')
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# gpp 无自带测试套件, make check 输出 "Nothing to be done for 'check'"
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 gpp --version 和宏展开测试验证二进制功能正常"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
