software: gpp
display: "GPP - General-purpose Preprocessor"
description: "General-purpose preprocessor with customizable syntax"
category: tool
homepage: "https://logological.org/gpp"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "lld 链接器依赖 libxml2（缺失），需 LDFLAGS='-fuse-ld=bfd'"
    - "configure 的 conftest 需要 ELF 签名才能执行（E064）"
    - "config.status 在 HMDFS 上无法创建临时目录，需修改 tmp 路径"
    - "修改的是 autotools 生成的文件，不创建补丁（R2 铁律）"
  common_dependencies: []

versions:
  "2.28":
    status: published
    build_date: "2026-06-04"