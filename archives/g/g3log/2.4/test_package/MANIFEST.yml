# test_package/MANIFEST.yml — g3log 2.4
# 上游官方测试声明文件 (CI L0e 要求)

package: g3log/2.4
homepage: "https://github.com/KjellKod/g3log"

# g3log 上游测试入口: ctest (8 个 gtest 二进制: test_message/test_filechange/
# test_io/test_fatal/test_signal/test_cpp_future_concepts/test_concept_sink/test_sink)
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test_unit/test_message.cpp
    source: g3log-2.4/test_unit/test_message.cpp
    description: "LogMessage/LogCapture 消息构造与字段测试"
    command: "./test_message --gtest_list_tests"
  - file: test_unit/test_io.cpp
    source: g3log-2.4/test_unit/test_io.cpp
    description: "FileSink 文件 IO 与 content check 测试"
    command: "./test_io"
  - file: test_unit/test_fatal.cpp
    source: g3log-2.4/test_unit/test_fatal.cpp
    description: "FATAL 崩溃处理与退出码测试"
    command: "./test_fatal"
  - file: test_unit/test_signal.cpp
    source: g3log-2.4/test_unit/test_signal.cpp
    description: "信号捕获 crash handler 测试"
    command: "./test_signal"
  - file: test_unit/test_sink.cpp
    source: g3log-2.4/test_unit/test_sink.cpp
    description: "自定义 Sink 添加/移除/并发调用测试"
    command: "./test_sink"
  - file: test_unit/test_concept_sink.cpp
    source: g3log-2.4/test_unit/test_concept_sink.cpp
    description: "ConceptSink 多种调用形态测试"
    command: "./test_concept_sink"
  - file: test_unit/test_cpp_future_concepts.cpp
    source: g3log-2.4/test_unit/test_cpp_future_concepts.cpp
    description: "C++ std::future 与 call_sync 测试"
    command: "./test_cpp_future_concepts"
  - file: test_unit/test_filechange.cpp
    source: g3log-2.4/test_unit/test_filechange.cpp
    description: "日志文件切换/滚动测试"
    command: "./test_filechange"

# test_package 中自带的消费者测试
test_package_tests:
  - file: test.cpp
    description: "消费者验证: 通过 g3log API 写日志并校验文件内容"
    command: "./test_g3log"

assertion_count: 86