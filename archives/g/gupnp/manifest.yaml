# gupnp 包级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# 软件名
software: gupnp

display: "gupnp"

# 一句话描述
description: "GUPnP — GObject-based UPnP library (core of the GUPnP stack, on top of gssdp)"

category: network

homepage: "https://gitlab.gnome.org/GNOME/gupnp"

license: LGPL-2.1-or-later

build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建；OHOS profile 自动映射 host_system 为 harmonyos"
    - "补丁 0001 加固 netlink 探测：单头 cc.has_header 在 OHOS sysroot 假阳性(与 sys/socket.h 同译单元才冲突 sockaddr_storage)，组合探测失败即回退上游 unix context manager(ifaddrs)，无平台宏无功能删减"
    - "GObject 单副本教义(继承 gssdp 1.6.6)：GLib 系 .pc Libs 剔除静态 glib，libgupnp 对 g_* 保持 UND，运行时解析到 libsoup-3.0.so 的唯一 gobject 副本"
    - "最小补链归档：g_uuid_string_random/g_zlib_compressor_new 为 libsoup 未导出的 glib/gio API，从静态库提取 guuid.c.o+gzlibcompressor.c.o 组成 libglib-min.a 补链，避免整档级联(实测 3812 符号)"
    - "glib2 包内 libffi.pc prefix 损坏(-L//lib)，pc-fix 复制件需同时从 Requires 剔除 libffi"
    - "gnome.mkenums() 的 glib_mkenums 变量经生成的 glib-2.0.pc 追加注入 + tc.binaries 双保险"
    - "共享库 strip 破坏 .codesign 哈希，tc.strip=None；meson install 清理 DT_RUNPATH 需用 build 产物覆盖"
    - "introspection/vapi/gtk_doc/examples 在配方中 disable；tools/gupnp-binding-tool-1.6 为纯 Python 3 脚本，经 commands.json 以 python3 调用"
  common_dependencies:
    - "glib2"
    - "libsoup3"
    - "gssdp"
    - "libxml2"
    - "zlib(PIC 变体 1.3.1.1)"

versions:
  "1.6.10":
    status: built
    build_date: "2026-09-06"
