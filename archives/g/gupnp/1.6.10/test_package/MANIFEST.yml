# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）

package: gupnp/1.6.10
homepage: https://gitlab.gnome.org/GNOME/gupnp

# 上游测试命令（meson test，build() 中在 OHOS 设备原生执行）
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 中集成上游测试（OHOS 设备原生跑）
upstream_test_in_build: true
upstream_test_command: "meson test -v --no-rebuild --timeout-multiplier=16"

# 上游测试（tests/ 目录，meson test 7 项，TAP 子用例合计 56 个）
# 取数命令：meson test -C builddir 输出 testlog.txt 中逐程序的 "1..N" 计划行
# 与 "^ok " 行计数（glib TAP 格式）；统计单位 = TAP 子用例。
upstream_tests:
  - file: tests/test-context.c
    source: gupnp-1.6.10.tar.xz/tests/test-context.c
    description: "GUPnPContext 创建/属性/生命周期测试（22 个 TAP 子用例：loopback/接口地址/端口/portable/超时/代理/重绑定等）"
    command: "meson test context"
    cases: 22
  - file: tests/test-bugs.c
    source: gupnp-1.6.10.tar.xz/tests/test-bugs.c
    description: "Bug 回归测试（10 个 TAP 子用例：注销根设备时下载取消、context 端口绑定、描述加载等回归项）"
    command: "meson test bugs"
    cases: 10
  - file: tests/test-service.c
    source: gupnp-1.6.10.tar.xz/tests/test-service.c
    description: "GUPnPService 通知订阅测试（2 个 TAP 子用例：notify 流程）"
    command: "meson test service"
    cases: 2
  - file: tests/test-acl.c
    source: gupnp-1.6.10.tar.xz/tests/test-acl.c
    description: "GUPnPAcl 使用与拒绝策略测试（2 个 TAP 子用例：use/reject）"
    command: "meson test acl"
    cases: 2
  - file: tests/test-service-proxy.c
    source: gupnp-1.6.10.tar.xz/tests/test-service-proxy.c
    description: "GUPnPServiceProxy 动作调用测试（13 个 TAP 子用例：同步/异步调用、多值返回等）"
    command: "meson test service-proxy"
    cases: 13
  - file: tests/test-context-filter.c
    source: gupnp-1.6.10.tar.xz/tests/test-context-filter.c
    description: "GUPnPContextFilter 过滤测试（4 个 TAP 子用例：表达树构建与子网匹配）"
    command: "meson test context-filter"
    cases: 4
  - file: tests/test-context-manager.c
    source: gupnp-1.6.10.tar.xz/tests/test-context-manager.c
    description: "GUPnPContextManager 工厂测试（3 个 TAP 子用例：create/参数校验）"
    command: "meson test context-manager"
    cases: 3

# test_package 自带测试（消费者视角，真实 API）
test_package_tests:
  - file: test_gupnp.c
    description: "gupnp 真实 API 冒烟：gupnp_context_manager_create(unix 回退实现) + gupnp_context_new(127.0.0.1) + get_port/get_host_ip + control_point_new/set_active + root_device_new/set_available/get_udn（真实 SSDP/HTTP 回环流量）"
    command: "./test_gupnp"

# 断言数：manager 非空 + lo 非空 + context 无错误 + context 非空 + port>0
# + host_ip 非空 + host_ip 匹配 127.0.0.1 + cp 非空 + active 为真
# + 描述文件写入无错误 + root_device 无错误 + device 非空 + available 为真
# + udn 匹配 = 14 项断言（W4 审计 A1 修正）
assertion_count: 14
