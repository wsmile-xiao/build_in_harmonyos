# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS sysroot 上独立 cc.has_header(linux/rtnetlink.h) 探测为假阳性(单头可编译),与 sys/socket.h 同译单元才触发 sockaddr_storage 重定义;修法是把上游探测改成与真实翻译单元一致的 cc.compiles 组合探测,失败即回退上游 unix context manager,无平台宏无功能删减"  # reference: knowledge/drafts/E547-draft-gupnp-netlink-tu-probe.kv
  - "gupnp 调用 libsoup-3.0.so 未导出的 glib/gio API(g_uuid_string_random、g_zlib_compressor_new)时,用 ar 从静态库提取定义这两个符号的上游翻译单元(guuid.c.o、gzlibcompressor.c.o)组成最小补链归档,避免整档拉取导致 glib 大面积级联(实测 3812 符号)且保持 GObject 单副本(两成员全部 g_type_*/g_object_* 引用均被 libsoup 导出表满足,readelf 逐符号核对)"  # reference: knowledge/drafts/E550-draft-gupnp-min-member-archive.kv
  - "PkgConfigDeps 会把已发布 libsoup3 配方 cpp_info.libs 内联的静态 glib 全家写进 generators/libsoup-3.0.pc 的 Libs 行,需按 token 剔除(-lglib-2.0/-lgobject-2.0/-lgio-2.0/-lgmodule-2.0/-lgthread-2.0/-lffi/-lintl),保留 -lsoup-3.0 本体;仅清空 generators/glib-2.0.pc 不足以防静态 glib 入链"  # reference: notes.md 问题3
  - "glib2 包内 libffi.pc 前缀损坏(prefix=/ 产生 -L//lib -lffi),且设备无系统 libffi;pc-fix 复制件需同时从 Requires 行剔除 libffi,否则 pkg-config 展开 Requires 仍会注入不可解析的 -lffi 导致链接失败"  # reference: notes.md 问题4
  - "静态 glib 单副本方案继承 gssdp 1.6.6:GLib 系 .pc 的 Libs 全部置空,libgupnp.so 对 g_* 保持 UND,运行时统一解析到 libsoup-3.0.so 导出的唯一 gobject 副本"  # reference: archives/g/gssdp/1.6.6/notes.md
  - "gupnp 上游测试(context/bugs/service/acl/service-proxy/context-filter/context-manager 共 7 程序 56 个 TAP 子用例)在 OHOS 设备原生 meson test 全过、0 skip"  # reference: notes.md 测试统计

