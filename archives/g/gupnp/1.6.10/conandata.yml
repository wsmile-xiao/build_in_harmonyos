# conandata.yml — gupnp 1.6.10
# 多镜像 URL：CI Worker 网络受限，单 URL 会下载超时；按可达性验证排序
# （NJU 镜像 200 且对 CI Worker 可达；download.gnome.org 官方源 200 作为备选）
# 两个来源下载的 sha256 实测一致：a1ee07b7b12673c32d7fc73ca158a50c1a4dc69ab35b65e94d24d38ac875345e

sources:
  url:
    - "https://mirror.nju.edu.cn/gnome/sources/gupnp/1.6/gupnp-1.6.10.tar.xz"
    - "https://download.gnome.org/sources/gupnp/1.6/gupnp-1.6.10.tar.xz"
  sha256: "a1ee07b7b12673c32d7fc73ca158a50c1a4dc69ab35b65e94d24d38ac875345e"

patches:
  - patch_file: "patches/0001-meson-build-harden-netlink-detection.patch"
    patch_description: "harden upstream netlink detection (meson.build); standalone cc.has_header(linux/rtnetlink.h) is a false positive on OHOS musl sysroot where linux/netlink.h and sys/socket.h both define struct sockaddr_storage; probe the headers in the same TU the netlink backend actually uses; when unusable the build falls back to the upstream unix context manager (ifaddrs) as on other non-netlink platforms; no platform macros; no functionality removed"
    patch_type: "portability"
