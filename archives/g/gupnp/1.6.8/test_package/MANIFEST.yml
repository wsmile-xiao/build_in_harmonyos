# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）

package: gupnp/1.6.8
homepage: https://gitlab.gnome.org/GNOME/gupnp

# 上游测试命令（meson test，build() 中在 OHOS 设备原生执行）
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 中集成上游测试（OHOS 设备原生跑）
upstream_test_in_build: true
upstream_test_command: "meson test -v --no-rebuild --timeout-multiplier=16"

# 上游测试（tests/ 目录，meson test 7 项，非并行 is_parallel:false；
# cases 为 OHOS 设备原生执行的 TAP 运行时实测子用例数）
upstream_tests:
  - file: tests/test-context.c
    source: gupnp-1.6.8.tar.xz/tests/test-context.c
    description: "GUPnPContext 测试（loopback 上创建 context、SoupServer base_uri、host_path 文档服务；静态注册 12 + 按 host-ip 动态展开，实测 22 子用例，1 个 SKIP 见说明）"
    command: "meson test context"
    cases: 22
  - file: tests/test-bugs.c
    source: gupnp-1.6.8.tar.xz/tests/test-bugs.c
    description: "Bug 回归测试（GUPnP 历史缺陷回归；10 个 g_test_add 子用例）"
    command: "meson test bugs"
    cases: 10
  - file: tests/test-service.c
    source: gupnp-1.6.8.tar.xz/tests/test-service.c
    description: "GUPnPService 测试（通知取消、远端消失处理；2 个 g_test_add 子用例）"
    command: "meson test service"
    cases: 2
  - file: tests/test-acl.c
    source: gupnp-1.6.8.tar.xz/tests/test-acl.c
    description: "GUPnPAcl 访问控制测试（按可用 host-ip 动态生成 /context/http/acl/* 子用例）"
    command: "meson test acl"
    cases: 1
  - file: tests/test-service-proxy.c
    source: gupnp-1.6.8.tar.xz/tests/test-service-proxy.c
    description: "GUPnPServiceProxy 测试（send_action、通知解析、错误处理；13 个 g_test_add 子用例）"
    command: "meson test service-proxy"
    cases: 13
  - file: tests/test-context-filter.c
    source: gupnp-1.6.8.tar.xz/tests/test-context-filter.c
    description: "GUPnPContextFilter 测试（构造、条目管理、启停、匹配；4 个 g_test_add 子用例）"
    command: "meson test context-filter"
    cases: 4
  - file: tests/test-context-manager.c
    source: gupnp-1.6.8.tar.xz/tests/test-context-manager.c
    description: "GUPnPContextManager 测试（manage、filter 启停与增删；3 个 g_test_add 子用例）"
    command: "meson test context-manager"
    cases: 3

# SKIP 说明：/context/creation/error-when-bound 假设 Linux SO_REUSEADDR 语义
# （soup LISTEN 后 gssdp TCP claim 失败走 gupnp-context 域预期警告）；OHOS 内核
# bind-after-listen 恒 EADDRINUSE，gssdp TCP claim 的 g_warning 在 glib 测试
# 框架 fatal mask 下 abort。内核语义差异非功能缺陷（其余 21 个 context 子用例
# 全过），用 GTester 原生 -s 跳过，TAP 显式标注。

# test_package 自带测试（消费者视角，真实 API）
test_package_tests:
  - file: test_gupnp.c
    description: "gupnp 真实 API 冒烟：gupnp_context_new_for_address(回环地址) + gupnp_context_get_server + gupnp_context_get_session + gupnp_context_get_port + gupnp_context_get/set_default_language"
    command: "./test_gupnp"

# 断言数：回环地址非空 + context 非空 + 无错误 + server 非空 + session 非空
# + 默认语言=en + 端口>0 + set 后语言=zh-CN
assertion_count: 8
