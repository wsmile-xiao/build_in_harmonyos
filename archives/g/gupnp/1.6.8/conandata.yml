# conandata.yml — gupnp 1.6.8
# 多镜像 URL：CI Worker 网络受限，单 URL 会下载超时；按可达性验证排序
# （NJU 镜像 200 且对 CI Worker 可达；download.gnome.org 官方源作为备选，
#  与 gssdp 1.6.6 同款双 URL 方案）

sources:
  url:
    - "https://mirror.nju.edu.cn/gnome/sources/gupnp/1.6/gupnp-1.6.8.tar.xz"
    - "https://download.gnome.org/sources/gupnp/1.6/gupnp-1.6.8.tar.xz"
  sha256: "70a003cebd68577293fb3e6af49ff902203bf8768b2fc5d651ddc1f0fa1e11e9"

patches:
  - patch_file: "patches/0001-meson-netlink-probe-compile-check.patch"
    patch_description: "meson netlink probe: has_header(linux/rtnetlink.h) alone passes on OHOS but gupnp-linux-context-manager.c fails to compile (sys/socket.h + linux/netlink.h both define sockaddr_storage in the OHOS sysroot); upgrade probe to cc.compiles() full-chain check (sys/socket.h + linux/netlink.h + linux/rtnetlink.h) so it correctly returns false on OHOS -> unix context manager (ifaddrs path) is used instead, same fallback as upstream non-netlink systems"
    patch_type: "portability"
