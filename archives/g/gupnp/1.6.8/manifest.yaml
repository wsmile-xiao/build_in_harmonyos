# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gupnp 直接依赖 glib2(glib/gio/gio-unix/gmodule/gobject) + libsoup3 + gssdp/1.6.6 + libxml2/2.15.3"
  - "meson has_header('linux/rtnetlink.h') 探测不充分：OHOS sysroot 头文件存在返回 true，但 gupnp-linux-context-manager.c 实际编译时 sys/socket.h + linux/netlink.h 组合 include 因 sockaddr_storage 双重定义必炸；升级为 cc.compiles() 完整编译链探测（含 sys/socket.h）即可正确返回 false → 编译 gupnp-unix-context-manager.c（ifaddrs 路径，OHOS 实测可编译）"
  - "GObject 单副本方案沿用 gssdp/1.6.6：GLib 系 .pc（含 gio-unix-2.0.pc）的 Libs 置空（含 PkgConfigDeps 生成的 generators/glib-2.0.pc），g_* 全 UND 统一解析到 libsoup-3.0.so 的唯一 gobject 副本"
  - "gupnp 无 sniffer/manpages meson 选项（gssdp 才有）；未知选项会使 meson 报 'ERROR: Unknown options'，只传 gtk_doc/introspection/vapi/examples"
  - "context_manager 保持上游默认 system：补丁后 netlink 探测返回 false，meson 自动选择 unix(ifaddrs) 实现路径"
  - "tools/gupnp-binding-tool（python 脚本）装到 bin/ → 软件级需要 commands.json（R38）"
  - "OHOS 内核 TCP bind 语义：SO_REUSEADDR 下两个 socket 不能 bind 同 (addr,port)（第二 bind EADDRINUSE，即使第一个未 LISTEN）；test-context 的 error-when-bound 依赖 Linux 语义 → GTester -s 跳过单用例（其余 21 子用例全过）"
  - "meson test 无法向被测二进制传参（如 GTester 的 -s）；单用例跳过需直驱测试二进制 + 手拼 LD_LIBRARY_PATH（含 builddir/libgupnp）"
  - "conan 2.29 的 apply_conandata_patches 要求补丁为 git format-patch 完整格式（含 diff --git 头），裸 unified diff 会报 'Failed to parse patch / patch stream is incomplete'"

