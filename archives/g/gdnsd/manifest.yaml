software: gdnsd
display: "gdnsd"
description: "gdnsd — Geographic Authoritative DNS server (authoritative-only, plugin-based)"
category: applications
homepage: "https://gdnsd.org"
license: "GPL-3.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "权威 DNS 服务器，纯 C，autotools 构建"
    - "官方 release tarball 自带预生成 configure 与 ragel 产物，无需 autoreconf/ragel"
    - "OHOS musl 无 pthread_setcanceltype：#ifndef 守卫跳过调用"
    - "config.sub 需 linux-ohos 白名单补丁 + 显式 --build/--host 三元组"
    - "HMDFS mktemp 0700 目录不可写：configure 内 mktemp 替换为 mkdir"
  common_dependencies:
    - "libev/4.33 (static)"
    - "userspace-rcu/0.15.6"
    - "libsodium/1.0.22"

versions:
  "3.8.2":
    status: built
    build_date: "2026-09-18"
