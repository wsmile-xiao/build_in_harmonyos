software: gdnsd
version: "3.8.2"
status: built
build_date: "2026-09-18"

source:
  url: "https://github.com/gdnsd/gdnsd/releases/download/v3.8.2/gdnsd-3.8.2.tar.xz"
  sha256: "f303d2ae3a027190057449955559431505b5a1cdb0e6c1190de8f6e54fcbc2c8"
  tar_format: tar.xz

build_system: autotools
build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
  dependencies:
    - "libev/4.33"
    - "userspace-rcu/0.15.6"
    - "libsodium/1.0.22"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-libgdmaps-gdmaps.c.patch"
  - "0002-src-dnsio_tcp.c.patch"
  - "0003-src-dnsio_udp.c.patch"
  - "0004-acaux-config.sub.patch"
  - "0005-configure-mktemp-hmdfs.patch"

knowledge_gained:
  - "E051: pthread_setcanceltype/pthread_cancel 未实现, 需 #ifndef HAVE_PTHREAD_SETCANCELTYPE 守卫 (ref:E051)"
  - "E007/E072: config.guess 无法识别 HarmonyOS 且 2022-01-03 版 config.sub 不认识 linux-ohos 三元组, 需补丁 + 显式 --build/--host (ref:E007,E072)"
  - "官方 release tarball 含预生成 configure 与 ragel 产物 vscf.c, 无需 ragel/autoreconf (git archive 则都没有)"
  - "HMDFS: mktemp -d 建的 0700 目录内写文件 EACCES, configure 的 mktemp 需替换为 mkdir -p (ref:E046)"
  - "gdnsd 3.8.2 不链接 zlib/openssl (Makefile.am LDADD 仅 -lm -lurcu-qsbr -lev -lsodium)"
  - "libev/4.33 registry 仅有 shared 二进制: 应用包消费时强制 static 避免 conftest/裸执行 loader 失败"
patch_generation:
  method: manual a/b tree diff -ruN (equivalent format to refresh-patch --auto; session-less continuation task, see notes.md R3 exemption)
  source_orig_dir: gdnsd-3.8.2.tar.xz (official release)
  generated_at: '2026-09-18'
  patches_count: 5

patch_classification:
  - file: 0001-libgdmaps-gdmaps.c.patch
    type: auto
    platform_only: True
    guard: 'HAVE_PTHREAD_SETCANCELTYPE'
  - file: 0002-src-dnsio_tcp.c.patch
    type: auto
    platform_only: True
    guard: 'HAVE_PTHREAD_SETCANCELTYPE'
  - file: 0003-src-dnsio_udp.c.patch
    type: auto
    platform_only: True
    guard: 'HAVE_PTHREAD_SETCANCELTYPE'
  - file: 0004-acaux-config.sub.patch
    type: manual
    platform_only: True
    guard: 'linux-ohos triplet whitelist'
  - file: 0005-configure-mktemp-hmdfs.patch
    type: manual
    platform_only: True
    guard: 'mktemp -> mkdir HMDFS workaround'
