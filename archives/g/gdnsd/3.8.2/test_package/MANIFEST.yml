# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: gdnsd/3.8.2
homepage: "https://gdnsd.org"

# 上游测试命令
# 上游测试套件为 t/[0-9]*/ 目录下的 56 个 *.t（TAP 协议，prove 驱动，
# t/Makefile.am: ALLTESTS = $(srcdir)/[0-9]*/*.t），入口为 make check
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成：上游测试框架依赖 Socket6 / IO::Socket::INET6 / HTTP::Daemon /
# Net::DNS>=1.03 Perl 模块（configure.ac AX_PROG_PERL_MODULES 可选探测）。
# 实测本机 SDK perl 5.42.0 缺失上述模块（perl -MSocket6 -e 1 失败），
# 无 cpan 工具链可补装；上游在模块缺失时自动跳过（HAVE_TESTSUITE_MODULES=0）。
# 且测试需绑定约 300 个 UDP/TCP 端口起真实 DNS 实例，为重型集成测试。
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序清点（共 56 个 *.t，以下为代表条目；完整清单见
# gdnsd-3.8.2.tar.xz 内 t/ 目录）
upstream_tests:
  - file: t/001basic/001self.t
    source: gdnsd-3.8.2/t/001basic/001self.t
    description: "minimal-config gdnsd 实例启动 + 最简单查询（测试基础设施自检）"
    command: "make check (prove)"
  - file: t/022gdnsdctl/048gdnsdctl.t
    source: gdnsd-3.8.2/t/022gdnsdctl/048gdnsdctl.t
    description: "gdnsdctl 控制 socket 操作"
    command: "make check (prove)"
  - file: t/012cname/038cname.t
    source: gdnsd-3.8.2/t/012cname/038cname.t
    description: "CNAME 解析行为"
    command: "make check (prove)"

# 上游测试整体跳过原因（R51 如实申报）
upstream_test_total: 56
upstream_tests_executed: 0
upstream_tests_skipped_reason: "SDK perl 缺 Socket6/IO::Socket::INET6/HTTP::Daemon/Net::DNS（perl -M<mod> 实测失败），上游 AX_PROG_PERL_MODULES 判定后自动跳过 make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 gdnsd 二进制可执行并报告正确版本号"
    command: "./test_gdnsd"

# 测试断言总数 (近似值)
assertion_count: 1
