# conandata.yml — gdnsd 3.8.2

sources:
  url: "https://github.com/gdnsd/gdnsd/releases/download/v3.8.2/gdnsd-3.8.2.tar.xz"
  filename: "gdnsd-3.8.2.tar.xz"
  sha256: "f303d2ae3a027190057449955559431505b5a1cdb0e6c1190de8f6e54fcbc2c8"

patches:
  - patch_file: "patches/0001-libgdmaps-gdmaps.c.patch"
    patch_description: "Guard pthread_setcanceltype with #ifndef HAVE_PTHREAD_SETCANCELTYPE (OHOS musl libc does not provide the function and upstream configure never defines the macro, so the call is skipped)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-dnsio_tcp.c.patch"
    patch_description: "Guard pthread_setcanceltype with #ifndef HAVE_PTHREAD_SETCANCELTYPE (OHOS musl libc does not provide the function and upstream configure never defines the macro, so the call is skipped)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-dnsio_udp.c.patch"
    patch_description: "Guard pthread_setcanceltype with #ifndef HAVE_PTHREAD_SETCANCELTYPE (OHOS musl libc does not provide the function and upstream configure never defines the macro, so the call is skipped)"
    patch_type: "portability"
  - patch_file: "patches/0004-acaux-config.sub.patch"
    patch_description: "Accept linux-ohos triplets in the shipped config.sub (timestamp 2022-01-03 predates ohos support) so configure can validate the explicit OHOS build/host triplet"
    patch_type: "portability"
  - patch_file: "patches/0005-configure-mktemp-hmdfs.patch"
    patch_description: "Replace mktemp -d with mkdir -p in the shipped configure: on HMDFS, directories created by mktemp get mode 0700 and all writes inside them fail with EACCES, breaking every configure compile test (plain mkdir gets a usable mode)"
    patch_type: "portability"
