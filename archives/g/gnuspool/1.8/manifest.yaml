# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "musl 不提供 l64a/getpass（E213/E093）：沿用源码内 FreeBSD 回退块并把守卫扩展到非 glibc"
  - "HMDFS 不支持硬链接（link() 返回 EPERM）：老 GNU 包的 link() 失败路径需退化为文件复制"
  - "musl 不再传递包含 sys/socket.h、netinet/in.h、arpa/inet.h、netdb.h（hostent/in_addr_t 未定义）"
  - "musl 无 <termio.h>/<sgtty.h>：可用 -DHAVE_TERMIO_H 让老代码走 termios 分支，并把 TCGETA/TCSETA 映射到 TCGETS/TCSETS"
  - "musl 无 SIGCLD：-DSIGCLD=SIGCHLD"
  - "clang 15 默认 -fno-common 会让老代码暂定定义冲突（duplicate symbol）：加 -fcommon"
  - "gnuspool 的 Makefile 只认 CCFLAGS（不认 CPPFLAGS/LDFLAGS）：-I/-L 必须同时进 CCFLAGS"
  - "老 GNU 包假设宿主机装了 libtool：设备 shell 的 PATH 含 harmonybrew 所以本地能过，CI worker 的 PATH 不含 → 构建在 build/lib 第一步就 `libtool: No such file or directory`（Error 127）。配方必须自带构建能力：把 Makefile 的 libtool 调用改写为 $(CC) -fPIC -shared，并修正上游引用的 libtool 专有产物（.lo、.libs/*.a）"
  - "共享库必须放 <pkg>/lib 并声明 cpp_info.libdirs，否则 conanrun 的 LD_LIBRARY_PATH 覆盖不到，运行期 relocation 失败"
  - "工具运行期需要上游 help 数据（share/gnuspool/help/*.help），打包时必须一并带走"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

