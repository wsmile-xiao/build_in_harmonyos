# 补丁由 refresh-patch 按"源码修改"逐文件生成；构建系统级改写（Makefile.in 去
# libtool）在配方 build() 内完成，不进源码补丁集。
patches:
  - patch_file: "patches/0001-src-hdrs-incl_unix.h.patch"
    patch_description: "musl 不再传递包含 sys/socket.h、netinet/in.h、arpa/inet.h、netdb.h（hostent/sockaddr_in/in_addr_t 未定义）：在公共头 incl_unix.h 显式包含"
    patch_type: "portability"
  - patch_file: "patches/0002-src-inline-jfmt_origh.c.patch"
    patch_description: "inline 片段 fmt_orighost 使用 HT_ROAMUSER（src/hdrs/network.h）但未包含该头：补 include 与回退定义"
    patch_type: "portability"
  - patch_file: "patches/0003-src-ins-netwcmd.c.patch"
    patch_description: "musl 无 <termio.h>/<sgtty.h>：改用 termios.h 与 Linux 风格 ioctl 号（TCGETA→TCGETS、TCSETA→TCSETS、termio→termios）"
    patch_type: "portability"
  - patch_file: "patches/0004-src-lib-extdefs.c.patch"
    patch_description: "库成员引用的 nomem() 定义只在未参与本次构建的 src/gtk、src/ins 中：在 src/lib/extdefs.c 补库内定义"
    patch_type: "portability"
