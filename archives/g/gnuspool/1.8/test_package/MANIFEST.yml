# test_package/MANIFEST.yml
# 上游官方测试声明
# 详见: docs/TEST_QUALITY_SPEC.md

package: gnuspool/1.8
homepage: "https://www.gnu.org/software/gnuspool/"

# 上游测试命令
# 清点证据：源码树无 test/tests 目录（ls <source> | grep test 无输出），
# Makefile.in 无 check/test 目标（grep -n '^check\|^test' Makefile.in 无输出）
upstream_check_command: "(上游无 check 目标)"
upstream_test_in_build: false
upstream_test_command: "(上游无自动化测试套件，N_static=0)"

# 上游实际运行的测试程序（上游无，故为空）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: conanfile.py
    description: >-
      以使用者身份运行随包发布的 gspl-cjlist（打印队列作业列表工具），
      断言其用法输出（Usage: ... gspl-cjlist ...）且不报缺少 help 数据文件
    command: "conan create（test() 阶段实际执行被测二进制）"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
