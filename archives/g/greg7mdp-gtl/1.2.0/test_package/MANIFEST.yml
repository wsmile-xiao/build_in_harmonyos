# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: greg7mdp-gtl/1.2.0
homepage: "https://github.com/greg7mdp/gtl"

# 上游测试入口盘点命令（上游为 CMake + gtl_cc_test 注册的 GoogleTest 套件）
upstream_check_command: "ctest --test-dir <build> -N   # 20 个测试程序；每个程序 --gtest_list_tests 求和 = 2207 个 case；源码宏清点 grep -rhE '^[[:space:]]*(TEST|TEST_F|TYPED_TEST_P)\\(' tests/ = 367"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./test_<name> --gtest_also_run_disabled_tests  # 逐个二进制真跑并解析 gtest 汇总行；N = max(源码宏数 367, 框架注册数 2207) = 2207"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/phmap/*.cpp
    source: gtl-1.2.0/tests/phmap/
    description: "GoogleTest hash 容器套件 16 个目标（container_memory / hash_policy_testing / node_hash_policy / raw_hash_set / raw_hash_set_allocator / flat_hash_map / flat_hash_set / node_hash_map / node_hash_set / parallel_flat_hash_map / parallel_flat_hash_set / parallel_node_hash_map / parallel_node_hash_set / parallel_flat_hash_map_mutex / dump_load / erase_if）"
    command: "./test_raw_hash_set --gtest_also_run_disabled_tests  # 逐目标同旗标执行"
  - file: tests/btree/btree_test.cpp
    source: gtl-1.2.0/tests/btree/
    description: "btree 套件 test_btree（69 个注册 case 全部通过）"
    command: "./test_btree --gtest_also_run_disabled_tests"
  - file: tests/misc/*.cpp
    source: gtl-1.2.0/tests/misc/
    description: "misc 套件 3 个目标（lru_cache / bitvector / vector），vector_test.cpp 两次 include vector_test.cpp.h"
    command: "./test_vector --gtest_also_run_disabled_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者断言链：include <gtl/...> 后真实调用 flat_hash_map/flat_hash_set/node_hash_map/parallel_flat_hash_map_m/btree_map/btree_set/bit_vector/lru_cache/stopwatch/vector/gtl::Hash 共 45 个显式检查，并打印 GTL_HAVE_SSE2/GTL_HAVE_SSSE3 以留证构建面走通用路径"
    command: "./test_gtl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 45
