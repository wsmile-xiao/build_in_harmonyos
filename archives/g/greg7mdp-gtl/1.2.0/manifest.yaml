# 版本级 manifest
# 文件位置: archives/g/greg7mdp-gtl/1.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.0"

# 软件名
software: "greg7mdp-gtl"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/greg7mdp/gtl/archive/refs/tags/v1.2.0.tar.gz"

  # 源码校验和（与 conan-center-index recipes/greg7mdp-gtl/all/conandata.yml 全值逐字一致）
  sha256: "1547ab78f62725c380f50972f7a49ffd3671ded17a3cb34305da5c953c6ba8e7"

  # 压缩格式
  tar_format: tar.gz

  # tag 与 tag 提交（git ls-remote --tags 实证）
  tag: "v1.2.0"
  tag_commit: "4c0a7a1d4a86143247b6ea7a5e4c7d6104d78590"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（由 conanfile.py generate() 注入，非命令行传参）
  configure_options:
    - "-DGTL_BUILD_TESTS=ON"
    - "-DGTL_BUILD_EXAMPLES=OFF"
    - "-DGTL_BUILD_BENCHMARKS=OFF"
    - "-DGTL_GTEST_LIBS=GTest::gmock_main"
    - "-DCMAKE_PROJECT_INCLUDE=<build>/gtl-gtest-inject.cmake"

  # 编译依赖列表（运行期/编译期依赖，格式: name/version）
  dependencies: []

  # 上游测试依赖（test_requires，不进交付依赖链）
  test_dependencies:
    - "gtest/1.17.0.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 本次适配未修改任何上游源文件：上游测试树的 googletest 获取改由
# conan 提供（GTL_GTEST_LIBS 缓存变量 + CMAKE_PROJECT_INCLUDE 片段），
# 源码树与发布 tarball 逐字节一致。
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gtl 的 emmintrin.h/tmmintrin.h 是 GTL_HAVE_SSE2/GTL_HAVE_SSSE3 条件 include，aarch64 下两宏为 0 自动走 GroupPortableImpl 通用路径（编译探针实证 GTL_HAVE_SSE2=0 GTL_HAVE_SSSE3=0），不构成平台不可移植止损"
  - "上游 CMake 用 GTL_GTEST_LIBS 缓存变量作为「由父工程提供 gtest 目标」的官方开关，置值即可完全跳过 cmake/DownloadGTest.cmake 的 configure 期网络 clone；配合 CMAKE_PROJECT_INCLUDE 在 project(gtl) 后 find_package(GTest) 即可零补丁接入 conan gtest"
  - "gtest/1.17.0 的 ohpcd 配方只有单一 cmake_file_name=gtest 目标，1.17.0.1/1.17.0.2 才提供 GTest::gmock_main 分量目标，选型须按 1.17.0.2"
  - "gtl 的 parallel_* 五个测试目标是 127 字节的包装文件（#define THIS_HASH_MAP 后 include 共享测试体），且 vector_test.cpp 两次 include vector_test.cpp.h——源码宏数与框架注册数天然不等，N 必须取框架注册数口径"
