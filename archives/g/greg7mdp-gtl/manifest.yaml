# 软件级 manifest
# 文件位置: archives/g/greg7mdp-gtl/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: "greg7mdp-gtl"

# 显示名
display: "greg7mdp gtl"

# 一句话描述
description: "greg7mdp/gtl（Greg's Template Library）：header-only C++ 容器库，提供并行哈希 map/set、btree map/set、bit_vector、lru_cache、stopwatch 等"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://github.com/greg7mdp/gtl"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 header-only 交付：package_type=header-library、package_id 清空，交付物只有 include/gtl/** 与 licenses/LICENSE"
    - "有 x86 SSE 快路径：emmintrin.h/tmmintrin.h 位于 #if GTL_HAVE_SSE2 / #if GTL_HAVE_SSSE3 条件块内，aarch64 下两宏为 0，自动走 GroupPortableImpl 通用路径（编译探针实证）"
    - "上游测试树默认 configure 期 clone googletest（GIT_TAG main），适配时改用 conan gtest：置 GTL_GTEST_LIBS 缓存变量跳过 DownloadGTest，再由 CMAKE_PROJECT_INCLUDE 片段 find_package(GTest)"
    - "上游测试用 google test 的 TYPED_TEST_P 宏，框架注册数（2207）远大于源码宏数（367），申报 N 必须用注册数口径"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "1.2.0":
    status: built
    build_date: "2026-09-29"
    conan_ref: "greg7mdp-gtl/1.2.0"
