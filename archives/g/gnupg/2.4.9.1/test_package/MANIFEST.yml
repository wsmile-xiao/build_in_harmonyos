package: gnupg/2.4.9.1
homepage: https://gnupg.org/
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - name: openpgp
    source: gnupg-2.4.9/tests/openpgp/run-tests.scm
    description: "OpenPGP gpg/gpgv 回归套件；需要测试密钥环"
    command: "make -C tests/openpgp check"
  - name: cms
    source: gnupg-2.4.9/tests/cms/run-tests.scm
    description: "CMS/gpgsm 回归套件；当前 profile 关闭 gpgsm"
    command: "make -C tests/cms check"
  - name: gpgme
    source: gnupg-2.4.9/tests/gpgme/run-tests.scm
    description: "GPGME 后端交互回归套件"
    command: "make -C tests/gpgme check"
  - name: pkits
    source: gnupg-2.4.9/tests/pkits/inittests
    description: "PKITS 证书互操作测试；需要 gpgsm/证书数据库"
    command: "make -C tests/pkits check"
  - name: migrations
    source: gnupg-2.4.9/tests/migrations/run-tests.scm
    description: "密钥目录迁移测试"
    command: "make -C tests/migrations check"
  - name: agent
    source: gnupg-2.4.9/tests/gpgscm/gnupg.scm
    description: "gpg-agent/socket/pinentry 交互测试"
    command: "make check"
test_package_tests:
  - file: conanfile.py
    description: "gpg、gpg-agent、gpgconf 版本命令消费者验证"
    command: "gpg --version && gpg-agent --version && gpgconf --version"
assertion_count: 9
