# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: gnupg/2.5.22
homepage: "https://gnupg.org/"

# ── 上游测试：存在，且规模很大（2026-09-17 实测核实；2026-09-19 实跑补充）────
#
# 上游 gnupg 2.5.22 自带完整集成测试套件（gpgscm Scheme 驱动）：
#   · tests/ 目录 412 个文件；.scm 脚本共 113 个
#   · make check 实际执行的测试清单 XTESTS 合计 77 项（逐子目录）：
#       openpgp 64 / cms 6 / migrations 3 / tpm2dtests 4
#     （gpgme、pkits、gpgscm 子目录的 XTESTS 为空）
#   · 另有 tests/gpgscm 的 check-local 1 项（t-child.scm，IPC/进程原语自测，不在 XTESTS 内）
#   · 其余 .scm（defs.scm / setup.scm / run-tests.scm / all-tests.scm 等）为
#     测试框架与辅助脚本，不计入用例数
#   · 入口：tests/Makefile.am 的 SUBDIRS + 各子目录 XTESTS；由 gpgscm 解释器驱动
#
# ⚠️ 勘误（原申报有误，本次订正）：
#   原 MANIFEST 声明「上游未提供独立单测框架 / 合计 0」——**不准确**，上游测试
#   体量很大（见上）。同时配方里的 `--disable-all-tests` **并非"关闭测试"开关**：
#   实测 configure 中 `--enable-all-tests` 的默认值即 `no`（不传该选项时
#   run_all_tests=no），它只影响"是否运行全部（扩展）测试"；真正关闭测试的选项
#   是 `--disable-tests`（本配方**未**使用）。故不能用 `--disable-all-tests`
#   作为"上游无测试"的依据。
#
# ── 2026-09-19 实跑结果（在构建树 build-release/tests/ 逐子目录 make check）─────
#   构建：conan create archives/g/gnupg/2.5.22 --build=missing（ohos-aarch64）→ EXIT=0
#
#   ⚠️ 关键环境发现（决定通过率）：OHOS 上 /tmp 为只读 erofs，且默认 SELinux 域
#   禁止在 ~/、~/.cache、/dev/shm、conan 构建树等路径上 bind AF_UNIX 路径名 socket
#   → gpg-agent 起不来。实测 /data/storage/el1/base **允许** AF_UNIX bind，
#   故把 TMPDIR 指向该目录（测试框架的 mkdtemp 会把 GNUPGHOME 建在 TMPDIR 之下，
#   见 tests/openpgp/setup.scm:44 "(setenv \"GNUPGHOME\" (getcwd) #t)"）后，
#   gpg-agent 可正常启动，绝大多数用例得以真正执行；并用短名（sun_path 限 108 字节）
#   消除 2 项 agent 超时。对应知识草稿：
#   knowledge/drafts/DRAFT-ohos-agent-socket-tmpdir-only-bindable-path.{kv,md}
#
#   各子套件实测（TMPDIR=/data/storage/el1/base/<短名>）：
#     · tests/gpgscm（check-local 1 项）      → 1 passed（"All good."）
#     · tests/openpgp（64 项）                → 64 run / 64 succeeded / 0 failed / 0 skipped
#     · tests/cms（6 项）                     → 6 run / 6 succeeded / 0 failed
#     · tests/migrations（3 项）              → 3 run / 3 succeeded / 0 failed
#     · tests/tpm2dtests（4 项）              → **4 run / 4 succeeded / 0 failed / 0 skipped**
#     · tests/gpgme、tests/pkits              → XTESTS 为空（All 0 tests passed）
#
#   规范口径通过率（passed/(passed+failed+errors)）：**78/78 = 100.0%**
#   全量口径：**78/78 = 100.0%（0 skipped）**——全部 78 项均已实跑并通过。
#
#   ⚠ 本轮起 make check 改为在配方 build() 内**真实执行**（此前 false：CI 不会替包
#     跑测试，而 L1c 仅按日志正则 `make.*check` 判定，会误命中 configure 的探测句
#     `checking whether "make check" shall run all tests... no` 而产生"通过"假象）。
#     客观计数以 HMBS_UPSTREAM_TEST_RESULT marker 输出。
#
#   通过率演进（五轮收敛）：
#     2/4 = 50.0%（TMPDIR 默认，套件在 setup 阶段大面积中止）
#     → 64/70 = 91.4%（TMPDIR 重定向到可 bind 挂载点）
#     → 70/70 = 100.0%（缩短 TMPDIR + 0004 补丁修复 gpgconf 硬链接回退）
#     → 74/74 = 100.0%（补齐 bzip2/sqlite3/openssh 三项前置；0005/0006 补丁让测试
#        框架本身可用；PATH 以 make 命令行变量传入以绕开 conan buildenv 覆盖）
#     → **78/78 = 100.0%（补 tpm2-tss + swtpm 两项前置、开 card-support、0007 补丁
#        修 shebang → tpm2dtests 4 项首次真正执行并全部通过；0 skipped）**
#
#   0004-gpgconf-link-fallback.patch（本 PR 新增补丁）：
#     gpgconf 的原子提交用 link(2)（tools/gpgconf-comp.c 的
#     `res = link (dest_filename, orig_filename)` 与 `err = link (src_filename,
#     dest_filename)`），而 OHOS 上 HMDFS/hmfs、/dev/shm 等**全部拒绝硬链接**
#     （实测 os.link() 在 ~/、~/.cache、conan 构建树、/data/storage/el1/base 均 EPERM）
#     → gpgconf --change-options 报 "could not commit changes"，
#     连带 trust-pgp-1/2/3/4 与 gpgconf.scm 共 5 项失败。
#     修法：新增 link_or_copy_file()，先试 link()，仅在文件系统**本身**拒绝
#     （EPERM/EACCES/ENOSYS/EXDEV/EOPNOTSUPP）时回退 copy_file()，其余错误照常上抛
#     —— 与上游既有的 HAVE_W32_SYSTEM 分支（用 copy_file）同构。
#     实测该 5 项由全挂转为 5/5 通过。
#
#   原记不可运行的 4 项（tpm2dtests）**本轮已全部实跑并通过** —— 原归因「缺软件 TPM」
#   只对了一半，实测是**三层原因叠加**：
#     1) 缺 tpm2-tss（libtss2-esys 等）→ configure 的
#        `AC_SEARCH_LIBS([Esys_Initialize],[tss2-esys])` 探不到 libtss，
#        于是 tpm2d 不构建、tpm2dtests 不进 SUBDIRS；
#     2) 缺 swtpm（软件 TPM 模拟器）→ 即使有 libtss，`AC_PATH_PROG(SWTPM, swtpm)`
#        为空则 TEST_LIBTSS 条件不成立，仍不跑；
#     3) ★ 配方传了 `--disable-card-support` → `keytotpm` 命令**根本不编译**
#        （g10/keyedit.c:1439-1448 的 `#ifdef ENABLE_CARD_SUPPORT`）→ 4 项全部
#        失败于 "key is not in the TPM"（这是**构建配置**问题，非环境缺失）。
#   修法：运行期 `requires("tpm2-tss/4.2.0")`、`tool_requires("swtpm/0.10.1.1")`、
#   移除 `--disable-card-support`（恢复上游默认 yes），并新增 0007 补丁。
#   （gpgme、pkits 的 XTESTS 为空，不算失败项。）
#
#   本轮新增 0007 补丁——修 tpm2dtests 驱动脚本的 shebang：
#     · 0007 tests/tpm2dtests/start_sw_tpm.sh：`#!/bin/bash` → `#!/bin/sh`。
#       该套件经 defs.scm:356 的 `in-srcdir` **直接执行**该脚本，而 OHOS 上
#       **没有 /bin/bash**（bash 在 HNP：/data/service/hnp/bin/bash）→ 内核解析
#       shebang 失败 ENOENT，表现为裸 "failed" + **空 stderr**（极易被误判为
#       "缺软件 TPM" 之类的环境问题）。脚本正文为 POSIX 兼容，改 /bin/sh 即可。
#
#   本轮新增 0005/0006 补丁——让**测试框架本身**在 OHOS 上可运行：
#     · 0005 tests/gpgscm/ffi.c：非 Windows 平台改读 $TMPDIR（原硬编码 "/tmp"，
#       而 OHOS 的 /tmp 是只读 erofs）→ 否则框架 _mkdtemp 直接失败、所有用例
#       根本跑不起来（此前只能在本机手动打临时补丁）。
#     · 0006 common/sysutils.c：gnupg_tmpfile 在 musl 下走 tmpfile()（编译期
#       P_tmpdir，忽略 $TMPDIR）同理失败，改为在 $TMPDIR 下 mkstemp+unlink+fdopen。
upstream_test_in_build: true
upstream_test_command: "make check（tests/ 下 gpgscm 驱动的集成测试；本配方 build() 内真实执行，计数见下方 run_2026_09_19 与 HMBS_UPSTREAM_TEST_RESULT marker）"

upstream_tests:
  - dir: tests/
    source: gnupg-2.5.22/tests/
    description: "上游集成测试套件（gpgscm Scheme 驱动）：XTESTS 合计 77 项 —— openpgp 64 / cms 6 / migrations 3 / tpm2dtests 4；另有 tests/gpgscm 的 check-local 1 项（t-child.scm），合计 78；另 36 个 .scm 为框架/辅助脚本"
    command: "make check（需 gpg-agent + 软件 TPM/终端环境）"
    run_2026_09_19:
      executed: 78
      passed: 78
      failed: 0
      skipped: 0
      not_executed: 0
      pass_rate_canonical: "78/78 = 100.0%"
      pass_rate_full: "78/78 = 100.0%（0 skipped）"
      tmpdir_workaround: "/data/storage/el1/base（本设备唯一实测允许 AF_UNIX 路径名 bind 的目录；/tmp 只读、~/ 与 /dev/shm 禁 bind）；TMPDIR 取短名以规避 108 字节 sun_path 上限"
      patch_0004: "gpgconf: link(2) 被文件系统拒时回退 copy_file（修复 trust-pgp-1..4 + gpgconf 共 5 项）"
      patch_0005: "tests/gpgscm/ffi.c: 临时目录改读 $TMPDIR（OHOS /tmp 只读，原硬编码致测试框架 _mkdtemp 失败、全部上游用例无法运行）"
      patch_0006: "common/sysutils.c: gnupg_tmpfile 在 $TMPDIR 下 mkstemp+unlink+fdopen（musl 的 tmpfile() 用编译期 /tmp 且忽略 $TMPDIR）"
      new_deps_2026_09_19:
        - "bzip2/1.0.8.2（运行期 requires）：启用 BZIP2 压缩算法 → 解锁 openpgp/4gb-packet.scm"
        - "sqlite3/3.49.1（运行期 requires）：启用 TOFU + keyboxd → 解锁 openpgp/tofu.scm、issue2929.scm"
        - "openssh/10.0p1（tool_requires，构建期工具、不入交付产物）：提供 ssh-add → 解锁 openpgp/ssh-import.scm（该用例同时需要 ssh/ssh-add/ssh-keygen，并用 `ssh -V` 输出须以 OpenSSH_ 开头作为判据，故配方按此实测筛选可用 bindir）"
      path_note: >
        上游 tests/openpgp/Makefile 的 TESTS_ENVIRONMENT 会执行 `PATH="../gpgscm:$(PATH)"`，
        而 conan 的 run() 在启动子进程前重新应用 buildenv（把 tool_requires 的 PATH 顶回最前）。
        因此只改 os.environ 会被覆盖，必须把 PATH 作为 **make 命令行变量**传入
        （make 命令行变量优先级高于环境变量）才能让 $(PATH) 取到配方选定的 ssh 目录。
      sqlite3_note: >
        本仓 sqlite3 配方的 package() 只装 bin/libsqlite3.a/include/*.h，**不装
        lib/pkgconfig/sqlite3.pc**，而 gnupg 用 PKG_CHECK_MODULES([SQLITE3],[sqlite3 >= 3.27])
        探测 → 报 "checking for SQLITE3... no" / "No package 'sqlite3' found" →
        "Building without SQLite support - TOFU and Keyboxd disabled"。
        配方改法：利用 pkg.m4 在**预设** SQLITE3_CFLAGS / SQLITE3_LIBS 时直接采用、
        跳过 pkg-config 的分支，按依赖实际路径预设这两个环境变量（不改动 sqlite3
        配方，避免新增已发布制品的变体，R37）。实测由 "checking for SQLITE3... no"
        转为 "yes"，TOFU support 由 no 转为 yes。
      per_suite:
        gpgscm: "1/1 passed（All good.）"
        openpgp: "64 run / 64 passed / 0 failed / 0 skipped"
        cms: "6/6 passed"
        migrations: "3/3 passed"
        tpm2dtests: "4 run / 4 passed / 0 failed / 0 skipped（补 tpm2-tss + swtpm 前置、开 card-support、0007 补丁修 shebang 后首次真正执行）"
        gpgme: "XTESTS 为空"
        pkits: "XTESTS 为空"
      evolution: "50.0% → 91.4% → 100.0%（70/70）→ 100.0%（74/74）→ 100.0%（78/78，0 skipped；全部 78 项均在 build() 内真实执行）"
      blockers_none: "规范口径与全量口径均为 78/78 = 100.0%，**无失败项、无跳过项**；此前记为「缺软件 TPM」而未执行的 4 项 tpm2dtests 已全部实跑通过（真因是缺 tpm2-tss/swtpm 前置 + 配方 `--disable-card-support` 使 keytotpm 不编译 + 驱动脚本 shebang 为 /bin/bash）"



# test_package 中新增的测试（消费者侧冒烟验证）
test_package_tests:
  - file: test_gnupg.sh
    description: "真实执行 bin/gpgv --version 与 bin/gpg --version 并断言版本号 2.5.22（R34 反空壳，非仅存在性断言）"
    command: "sh test_gnupg.sh <pkg_dir>"

# 断言总数（test_package 2 项版本断言）
assertion_count: 2
