# conandata.yml — gnupg 2.5.22
# gnupg: GnuPG（OpenPGP 实现），提供 gpg / gpgv / gpgsm / gpg-agent 等
# 上游：https://gnupg.org/software/gnupg/
# 说明：apt 的 Release 签名验证依赖 gpgv（本包提供）。

sources:
  url: "https://gnupg.org/ftp/gcrypt/gnupg/gnupg-2.5.22.tar.bz2"
  # 注意：官方文件 8363854 字节；此前若用被截断的下载件算 sha256 会得到错误值
  sha256: "96e27b020ad26510388e06f5f07f3f70a4ed8916ee995f1b72b7a024e6d9d87e"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: "0001 build-aux config.guess harmonyos support"
    patch_type: "portability"
  - patch_file: "patches/0002-build-aux-config.sub.patch"
    patch_description: "0002 build-aux config.sub harmonyos support"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "0003 configure: ohos 走 android 分支(免 iconv 强依赖) + umask 077->022(HMDFS)"
    patch_type: "portability"
  - patch_file: "patches/0004-gpgconf-link-fallback.patch"
    patch_description: "0004 gpgconf: link(2) 被文件系统拒(EPERM/EACCES/EXDEV 等)时回退 copy_file（OHOS HMDFS 不支持硬链接）"
    patch_type: "portability"
  - patch_file: "patches/0005-gpgscm-tmpdir.patch"
    patch_description: "0005 tests/gpgscm/ffi.c: 临时目录改读 $TMPDIR（OHOS /tmp 为只读 erofs，硬编码 /tmp 使测试框架 _mkdtemp 直接失败、上游测试无法运行）"
    patch_type: "portability"
  - patch_file: "patches/0006-gnupg-tmpfile-tmpdir.patch"
    patch_description: "0006 common/sysutils.c: gnupg_tmpfile 在 $TMPDIR 下建临时文件（musl 的 tmpfile() 用编译期 /tmp，OHOS 上只读且忽略 $TMPDIR → common/t-sysutils 全项失败）"
    patch_type: "portability"
  - patch_file: "patches/0007-tpm2dtests-sh-shebang.patch"
    patch_description: "0007 tests/tpm2dtests/start_sw_tpm.sh: shebang 由 /bin/bash 改为 /bin/sh（OHOS 上无 /bin/bash，而套件**直接执行**该脚本 → 内核解析 shebang 失败 ENOENT，表现为裸 failed + **空 stderr**，使 4 项 tpm2dtests 被误判为环境问题；脚本正文为 POSIX 兼容）"
    patch_type: "portability"
