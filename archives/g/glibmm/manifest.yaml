software: glibmm
display: "glibmm"
description: "C++ bindings for GLib and GIO"
category: library
homepage: "https://gtkmm.gnome.org/"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Use GNOME release tarballs containing pre-generated bindings with maintainer-mode disabled"
    - "Re-sign installed shared ELF files on native OHOS after Meson changes them"
    - "Run upstream Meson tests only where target executables are runnable"
  common_dependencies:
    - glib
    - libsigc

versions:
  "2.66.7":
    status: built
    build_date: "2026-08-17"
  "2.66.9":
    status: built
    build_date: "2026-08-02"
