# conandata.yml — glibmm 2.68.2
# 源码 URL（GNOME 官方 release tarball）+ SHA256。
#
# ⚠️ 版本裁决：glibmm 2.68 是 glibmm-2.68 ABI 线（sigc++-3.0，libsigc++ 3.x），
#    与 2.66.x 的 2.4 ABI 线（sigc++-2.0 / libsigc 2.10.8）不同。本 recipe 固定
#    glibmm **2.68.2**（2.68 线官方最新，LATEST-IS-2.68.2）。
#
# ⚠️ 必须用 download.gnome.org 的 release tarball（meson dist 产物）：
#    release tarball 自带 untracked/（预生成绑定代码），maintainer-mode=false
#    即可构建（无需 mm-common/gmmproc）。
#
# sha256 为 GNOME 官方 sha256sum 文件中的真实值：
#   91e0a8618f7b82db4aaf2648932ea2bcfe626ad030068c18fa2d106fd838d8ad  glibmm-2.68.2.tar.xz
#
# 补丁：
#   0001-tls-client-failing-on-harmonyos.patch — giomm_tls_client_test 在 OHOS
#     上无法连接网络（E215 模式），标记为 failing suite，由 build() 的
#     meson test --no-suite=failing 跳过（与 2.66.9 同款）。

sources:
  url: "https://download.gnome.org/sources/glibmm/2.68/glibmm-2.68.2.tar.xz"
  sha256: "91e0a8618f7b82db4aaf2648932ea2bcfe626ad030068c18fa2d106fd838d8ad"

patches:
  - patch_file: "patches/0001-tls-client-failing-on-harmonyos.patch"
