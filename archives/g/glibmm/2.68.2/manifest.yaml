software: glibmm
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.68.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.68.2"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
build_system: meson

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-17"

# Conan 引用
conan_ref: "glibmm/2.68.2@ohpcd/stable"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 conandata.yml 一致）
  url: "https://download.gnome.org/sources/glibmm/2.68/glibmm-2.68.2.tar.xz"
  # 源码校验和（GNOME 官方 sha256sum）
  sha256: "91e0a8618f7b82db4aaf2648932ea2bcfe626ad030068c18fa2d106fd838d8ad"
  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  # 关键说明：tarball 为 meson dist 产物，自带 untracked/ 预生成绑定，
  # maintainer-mode=false 构建（无需 mm-common/gmmproc）
  cc: clang
  cxx: clang++
  # Conan 依赖（ohpcd 制品仓）
  dependencies:
    - "glib/2.84.0.1 (components glib-2.0 / gobject-2.0 / gmodule-2.0 / gio-2.0 / gio-unix-2.0)"
    - "libsigc/3.0.6 (sigc++-3.0)"

# ============================================================
# 补丁清单
# ============================================================

patches_applied:
  - "patches/0001-tls-client-failing-on-harmonyos.patch (giomm_tls_client_test 在 OHOS 无法联网，标记 failing suite 由 build() 跳过)"

# ============================================================
# 知识经验
# ============================================================

knowledge_gained:
  - "版本裁决：glibmm 2.68 是 glibmm-2.68 ABI 线（sigc++-3.0 / libsigc++ 3.x），与 2.66.x 的 2.4 ABI 线（sigc++-2.0 / libsigc 2.10.8）不同；本配方固定 2.68.2（2.68 线官方最新）"
  - "E215 模式：OHOS 平台限制失败的测试用 failing suite 排除（glib 2.84.0.1 同款）"

# ============================================================
# 角色说明
# ============================================================

role: "目标库首轮适配"
note: "glibmm 2.68.2 依赖 libsigc/3.0.6（sigc++-3.0）与 glib/2.84.0.1；两者均已发布到 ohpcd 制品仓"
