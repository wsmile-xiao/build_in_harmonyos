# test_package/MANIFEST.yml — glances 4.5.4

package: glances/4.5.4
homepage: "https://github.com/nicolargo/glances"

# 上游测试命令: pytest（上游 sdist 含 24 个测试文件，需 psutil C 扩展可加载才能运行）
upstream_check_command: "python3 -m pytest tests/"
# 上游测试未在 build() 中集成：OHOS 上 psutil 的 C 扩展 .so 因 ELF 签名限制
# 无法 dlopen（知识库 E179，实测本地编译 .so 同样被拒），上游 pytest 套件
# 在 import glances 阶段即因 psutil 不可加载而退出，无法在本平台执行。
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试用例清点（24 个测试文件，此处列出代表性的 8 个；其余依赖
# 网络接口、可选组件（Docker/GPU/IPMI）或同样依赖 psutil 加载，均无法运行）
upstream_tests:
  - file: tests/test_core.py
    source: glances-4.5.4/tests/test_core.py
    description: "核心功能测试"
    command: "python3 -m pytest tests/test_core.py"
  - file: tests/test_actions_sanitize.py
    source: glances-4.5.4/tests/test_actions_sanitize.py
    description: "Actions 清理测试"
    command: "python3 -m pytest tests/test_actions_sanitize.py"
  - file: tests/test_api.py
    source: glances-4.5.4/tests/test_api.py
    description: "API 测试"
    command: "python3 -m pytest tests/test_api.py"
  - file: tests/test_json_serializer.py
    source: glances-4.5.4/tests/test_json_serializer.py
    description: "JSON 序列化测试"
    command: "python3 -m pytest tests/test_json_serializer.py"
  - file: tests/test_plugin_cpu.py
    source: glances-4.5.4/tests/test_plugin_cpu.py
    description: "CPU 插件测试"
    command: "python3 -m pytest tests/test_plugin_cpu.py"
  - file: tests/test_plugin_mem.py
    source: glances-4.5.4/tests/test_plugin_mem.py
    description: "内存插件测试"
    command: "python3 -m pytest tests/test_plugin_mem.py"
  - file: tests/test_plugin_network.py
    source: glances-4.5.4/tests/test_plugin_network.py
    description: "网络插件测试"
    command: "python3 -m pytest tests/test_plugin_network.py"
  - file: tests/test_plugin_fs.py
    source: glances-4.5.4/tests/test_plugin_fs.py
    description: "文件系统插件测试"
    command: "python3 -m pytest tests/test_plugin_fs.py"

# test_package 中自带的测试
test_package_tests:
  - file: test_glances.py
    description: "验证 glances 包安装正确性和版本号"
    command: "python3 test_glances.py"

# 测试断言总数（口径：test_package 内 conanfile.py test() 与 test_glances.py
# 的断言/校验步骤合计——结构校验 8 项 + 二进制/导入 2 项 + E179 诊断 1 项 +
# 纯 Python 依赖导入 1 项 + 版本校验 2 项 + test_glances.py 2 项，近似值）
assertion_count: ~16
