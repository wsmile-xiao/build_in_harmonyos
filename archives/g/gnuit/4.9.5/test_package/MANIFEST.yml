# test_package/MANIFEST.yml - gnuit 4.9.5
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求存在）
# 诚实口径：gnuit 4.9.5 源码无任何自动化测试套件（无 tests/ 目录、无 make check 目标、
# 无 dejagnu/ctest/pytest 注册入口），N_static = 0，见 notes.md 测试四维账本。

package: gnuit/4.9.5
homepage: "https://www.gnu.org/software/gnuit/"

# 上游测试命令（make -n check 分析结果：上游无 check 目标）
upstream_check_command: ""

# conanfile.py build() 中的上游测试集成（无上游测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序（N_static=0，如实留空并说明）
upstream_tests: []

# test_package 消费者测试（N_consumer=1 个测试程序，3 项行为断言）
test_package_tests:
  - file: test.sh
    source: gnuit-4.9.5/test_package/test.sh
    description: "运行包内 gitwhich 二进制：正向查找 gitfm/gitwhich（退出码 0）+ 反向查找不存在程序（退出码非 0），证明编译产物在 OHOS 上真实链接 ncurses termcap API 并可执行"
    command: "gitwhich gitfm && gitwhich gitwhich && ! gitwhich no-such-gnuit-tool-xyz"
  - file: conanfile.py
    description: "调用 test.sh 执行上述 3 项断言（VirtualRunEnv 提供包内 PATH）"
    command: "sh test.sh"
