software: gnuit
version: "4.9.5"
status: built
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/gnuit/gnuit-4.9.5.tar.gz"
  sha256: "6b6e96db13bafa5ad35c735b2277699d4244088c709a3e134fb1a3e8c8a8557c"
  tar_format: tar.gz

build:
  system: autotools
  # 驱动原始 configure 注入项（CI 同样生效）：
  # - LDFLAGS/CPPFLAGS: ncurses 库与头文件位于 cmd-pkgs 默认前缀（lib/libncursesw.a + conan 包头文件）
  # - ACLOCAL/AUTOHEADER/AUTOMAKE=/bin/true: E041 bypass（HMDFS 时间戳导致 autotools 重生成尝试）
  # - --without-readline: configure 探测 readline 但源码从未使用，显式关闭保证确定性
  configure_options:
    - "LDFLAGS=-L/storage/Users/currentUser/usr/local/lib"
    - "CPPFLAGS=-I/storage/Users/currentUser/usr/local/include"
    - "ACLOCAL=/bin/true"
    - "AUTOHEADER=/bin/true"
    - "AUTOMAKE=/bin/true"
    - "--without-readline"

dependencies:
  - ncurses/6.6

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
