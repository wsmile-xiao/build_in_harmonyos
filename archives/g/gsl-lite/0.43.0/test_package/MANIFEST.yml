# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gsl-lite/0.43.0
homepage: "https://github.com/gsl-lite/gsl-lite"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false

# 上游测试程序（gsl-lite 自带 test/ 目录，使用 lest 框架；adapt 阶段确认后补充）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 验证 gsl-lite.hpp 头文件包含与 gsl::span 基本使用"
    command: "./test_gsl_lite"

# 测试断言总数 (近似值, 用于质量评估)
# 2 个断言: span 构造 + size 校验
assertion_count: 2
