# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: guile/2.2.7.2
homepage: "https://www.gnu.org/software/guile/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C test-suite/standalone <stable-targets> && make -C test-suite/standalone TESTS=\"<36 stable standalone tests>\" check-TESTS && make -C test-suite/vm check && make -C test-suite check-TESTS && sh meta/build-env sh meta/guile -e main -s test-suite/guile-test --test-suite test-suite/tests <174 .test files in 4 chunks>"

# 上游实际运行的测试程序
upstream_tests:
  - suite: "test-suite/standalone"
    count: 36
    command: "make -C test-suite/standalone TESTS=\"<36 stable standalone tests>\" check-TESTS"
    description: "Standalone C/API and Scheme wrapper tests, excluding three OHOS known-failing stress/FFI tests"
  - suite: "test-suite/vm"
    count: 20
    command: "make -C test-suite/vm check"
    description: "Upstream VM Scheme tests"
  - suite: "test-suite/lalr"
    count: 19
    command: "make -C test-suite check-TESTS"
    description: "Upstream LALR parser tests"
  - suite: "test-suite/guile-test"
    count: 174
    command: "sh meta/build-env sh meta/guile -e main -s test-suite/guile-test --test-suite test-suite/tests <174 .test files in 4 chunks>"
    description: "Guile Scheme upstream .test files, run in four chunks on OHOS with confirmed platform boundaries reported as unresolved/unsupported"

upstream_tests_not_in_recipe:
  - "test-suite/standalone/test-ffi: SIGSEGV on OHOS runner"
  - "test-suite/standalone/test-loose-ends: SIGSEGV on OHOS runner"
  - "test-suite/standalone/test-out-of-memory: upstream allocation stress test fails with GC OOM on OHOS runner"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Verify libguile API: scm_with_guile + scm_c_eval_string (+ 1 2) = 3"
    command: "./test_probe"
  - file: conanfile.py
    description: "Verify packaged guile/guild/guile-config commands and Scheme evaluation under conanrun; any nonzero exit fails"
    command: "guile --version && guile -c '(exit (if (= (+ 1 2) 3) 0 1))' && guild --version && guile-config --version && guile-config compile && guile-config link"

# 实测 Scheme 断言数；Automake 测试项与 .test 文件数另计，不能混作断言。
assertion_count: 42462
automake_test_count: 75
scheme_test_file_count: 174
consumer_check_count: 7
