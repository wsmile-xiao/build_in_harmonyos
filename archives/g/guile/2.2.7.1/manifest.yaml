# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Guile 2.2.x 依赖 libltdl（libtool 的库部分），可通过 Conan libtool 包提供"
  - "Guile 2.2.7 要求 libunistring >= 0.9.3，ohpcd 已发布的 libunistring/1.0 满足要求"
  - "HMDFS 文件系统需修改 umask 077 为 022（configure 和 guile-snarf 两处）"
  - "OHOS bionic 缺少 canonicalize_file_name、O_BINARY、timezone_t 等 Guile 2.2.7 期望的兼容定义，需要在源码侧加有保护的 fallback"
  - "OHOS profile 中的 clang/clang++ 包装脚本需通过 sh 显式调用；链接器显式使用可执行的 ld.lld"
  - "OHOS 真机 PATH 中没有裸 ar/ranlib/nm/strip，需要显式设置为 LLVM 工具避免 Autoconf 误探测 link -lib"
  - "生成的 meta/build-env、meta/uninstalled-env、meta/guild、meta/guile 和 guile-snarf 在 HMDFS 上需要通过 sh 调用"
  - "libtool 临时测试 wrapper 若生成 #! sh，make check-TESTS 直接 exec 会报 No such file or directory，需要修正为 #!/bin/sh 或显式 sh 调用"
  - "Signal 5 (SIGTRAP) 在 .go 编译后崩溃不影响产物，用 make -k 容忍"
  - "libguile/scmconfig.h 需先由 make -C libguile scmconfig.h 生成，避免 lib/ 子目录包含 checked-in 线程头时找不到生成头"
  - "Guile 2.2.7 的库名为 libguile-2.2（非 libguile），pkg-config 名为 guile-2.2"
  - "头文件无 libguile.h 总头文件，需直接 include libguile/__scm.h 等"
  - "recipe 级上游测试扩展为 Automake 稳定面 75 项（standalone 36、VM 20、LALR 19）加 guile-test Scheme 上游面 174 个 .test 文件；raw standalone 剩 test-ffi/test-loose-ends/test-out-of-memory 三个 OHOS 边界"
  - "包内 guild/guile-config 不能保留 /bin/guile 绝对路径；guile-config 可替换为相对 prefix 的 shell wrapper，guile-2.2.pc 需改为相对 ${pcfiledir}，并导出 GUILE_LOAD_PATH/GUILE_LOAD_COMPILED_PATH 供消费者运行"
  - "guile-test Scheme 驱动不是 Automake make check 默认入口；OHOS 上需使用短 TMPDIR 并将已确认的平台边界（AF_UNIX 权限、opendir('/') 权限、locale/iconv、文档字符串、FFI callback、itimer/statprof）映射为 unresolved/unsupported 后分段运行"

