software: git-who
display: "git-who"
description: "git blame for file trees — 按文件树统计代码贡献者的 Go 命令行工具"
category: build-tool
homepage: "https://github.com/sinclairtarget/git-who"
license: MIT
build_system: custom
language: Go

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Go CLI 工具，CGO_ENABLED=0 纯静态编译，产物 bin/git-who"
    - "hmbs 预检沙盒不注入 go 工具链，配方探测设备 go 或下载固定 Go SDK（go1.23.8 linux-arm64）"
    - "OHOS 下所有被 fork/exec 的 ELF 需 binary-sign-tool 签名（.codesign 段），含 go 工具链与 go test 临时二进制"
    - "Go linker 在 hmdfs 上 mmap 输出失败，链接输出目录放到非 hmdfs 工作区"
    - "版本号经 ldflags -X main.Version/-X main.Commit 注入"
  common_dependencies: []

versions:
  "1.3":
    status: built
    build_date: "2026-08-15"
    conan_ref: "git-who/1.3"
