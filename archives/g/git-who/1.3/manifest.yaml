# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Go CLI 工具在 OHOS 上构建：hmbs 预检沙盒不注入 go 工具链，配方需探测设备 go 或下载固定版本 Go SDK（go1.23.8 linux-arm64，镜像优先列表）"
  - "Go 工具链 ELF 无 .codesign 段被 OHOS Seccomp 拦截，需 binary-sign-tool 签名 go/gofmt/pkg/tool 后再执行"
  - "Go linker 在 hmdfs 上 mmap 输出失败（E051/E046），链接输出目录必须放到非 hmdfs 工作区（TMPDIR/el2）"
  - "go test 编译的 *.test 二进制直接 fork/exec，需 -exec 包装脚本先签名再执行，否则 0 用例运行"
  - "版本号注入：ldflags -X main.Version=1.3 -X main.Commit=aa656b0 使 git-who --version 输出正式版本号"
  - "上游 3 个集成测试需 git-who-test-repo submodule（不在 GitHub 源码 tarball 内）+ git 二进制，10 个功能测试为 Ruby 套件，均无法在真机运行"
