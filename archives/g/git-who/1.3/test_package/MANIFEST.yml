# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: git-who/1.3
homepage: "https://github.com/sinclairtarget/git-who"

# 上游测试存在性审计（hmbs 硬门禁要求；上游确有测试，已接入并在真机执行）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 git-who 1.3 存在完整测试套件，Go 单元/集成测试已接入并在真机执行。
  1. Go 单元测试 19 个 `func Test`（internal/）：cache/backends 4 + format 3 +
     git(git/parse/pathspec) 7 + tally(bucket/tally/tree) 5，全部纯逻辑、不依赖
     git 二进制或外部仓库，无 t.Skip，可在 OHOS 真机完整执行（go test ./internal/...）。
  2. Go 集成测试 3 个 `func Test`（test/integration/git/args_test.go）：调用
     git rev-parse 验证参数解析，需要 test/repos/test-repo submodule
     （git@github.com:sinclairtarget/git-who-test-repo）——GitHub 源码 tarball
     不含 submodule 内容；配方在 build() 尝试用 git clone 拉取该 fixture 仓库
     （103K，含 root tag 与 6afef287... 提交），clone 成功则连同单元测试一并执行，
     clone 失败则如实披露为未运行（不计入通过）。
  3. Ruby 功能测试（test/functional/*.rb，minitest/Rakefile 套件）：8 个测试文件
     静态 `def test_` 23 个 + table_test.rb 的 define_method 笛卡尔组合用例，
     需 ruby + minitest gem + gunicorn/test-repo submodule 仓库；OHOS 无 Ruby
     运行时，无法在真机执行（如实披露，不计入通过）。
  4. 运行方式：conanfile.py build() 内 `go test -v -count=1 ./internal/...`
     （OHOS 下带 -exec 签名包装脚本），计数解析自 go test stdout 的
     --- PASS/FAIL/SKIP 行。结果持久化为包内 res/upstream_test_result.json，
     test_package 阶段读取该文件并裸 print 输出 HMBS_UPSTREAM_TEST_RESULT
     标记（预检 conan 缓存复用会跳过 build()，test_package 每轮必跑，保证
     标记在每一轮 preflight 日志中出现；数字来自真机 go test 实际输出）。

# 上游测试命令 (Go 项目: go test)
upstream_check_command: "go test -count=1 ./internal/..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "go test -v -count=1 ./internal/..."

# 上游 22 个 Go Test 函数：19 个纯单元测试（internal/，可运行）+
# 3 个集成测试（test/integration/git，需要 git-who-test-repo git submodule，
# 不在 GitHub 源码 tarball 内，且需 git 二进制；配方尝试 clone 后运行）。
# 真机可运行集合 = 19 个 internal/ 单元测试（go test ./internal/...）。
upstream_tests:
  - file: internal/cache/backends/gob_test.go
    source: "git-who-1.3/internal/cache/backends/gob_test.go"
    description: "gob cache backend 读写测试（2 个 Test 函数，纯单元）"
    command: "go test -v -count=1 ./internal/cache/backends/..."
  - file: internal/cache/backends/json_test.go
    source: "git-who-1.3/internal/cache/backends/json_test.go"
    description: "json cache backend 读写测试（2 个 Test 函数，纯单元）"
    command: "go test -v -count=1 ./internal/cache/backends/..."
  - file: internal/format/format_test.go
    source: "git-who-1.3/internal/format/format_test.go"
    description: "输出格式化（相对时间/路径缩短）测试（3 个 Test 函数）"
    command: "go test -v -count=1 ./internal/format/..."
  - file: internal/git/git_test.go
    source: "git-who-1.3/internal/git/git_test.go"
    description: "按 pathspec 过滤 file diff 测试（1 个 Test 函数）"
    command: "go test -v -count=1 ./internal/git/..."
  - file: internal/git/parse_test.go
    source: "git-who-1.3/internal/git/parse_test.go"
    description: "git log --raw 输出解析测试（3 个 Test 函数）"
    command: "go test -v -count=1 ./internal/git/..."
  - file: internal/git/pathspec_test.go
    source: "git-who-1.3/internal/git/pathspec_test.go"
    description: "pathspec 支持/匹配测试（3 个 Test 函数）"
    command: "go test -v -count=1 ./internal/git/..."
  - file: internal/tally/bucket_test.go
    source: "git-who-1.3/internal/tally/bucket_test.go"
    description: "贡献统计 bucket 测试（2 个 Test 函数）"
    command: "go test -v -count=1 ./internal/tally/..."
  - file: internal/tally/tally_test.go
    source: "git-who-1.3/internal/tally/tally_test.go"
    description: "提交贡献统计测试（1 个 Test 函数）"
    command: "go test -v -count=1 ./internal/tally/..."
  - file: internal/tally/tree_test.go
    source: "git-who-1.3/internal/tally/tree_test.go"
    description: "文件树贡献聚合测试（2 个 Test 函数）"
    command: "go test -v -count=1 ./internal/tally/..."

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "3 个真实用例：git-who --version（含 1.3）、--help（Usage: git-who）、临时 git 仓库上 git-who table（输出含作者名）"
    command: "sh test.sh <bin>"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 19 个 Go 单元测试函数（表驱动，断言数多于函数数）；test_package 3 条断言
assertion_count: 22

# 测试套件覆盖说明
test_suite_gaps:
  integration_tests: "test/integration/git/args_test.go 的 3 个测试需要 git-who-test-repo git submodule（git@github.com:sinclairtarget/git-who-test-repo）+ git 二进制；GitHub 源码 tarball 不含 submodule，配方在 build() 尝试 clone 后运行，clone 失败则如实披露"
  functional_tests: "test/functional/*.rb 的 Ruby (Rakefile/minitest) 套件（8 文件、23 个静态 def test_ + table_test.rb 笛卡尔组合用例）需 ruby + minitest gem + gunicorn/test-repo submodule，OHOS 无 Ruby 运行时，无法在真机执行"
