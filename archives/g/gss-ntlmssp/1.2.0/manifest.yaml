# 版本级 manifest
# 文件位置: archives/g/gss-ntlmssp/1.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.0"

# 软件名
software: "gss-ntlmssp"

# 编译状态（O5：合并 + CI upload 确认前一律 built）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游无 release 资产（releases/download 实测 404）→ 取 tag 归档 tarball
  url: "https://github.com/gssapi/gss-ntlmssp/archive/refs/tags/v1.2.0.tar.gz"
  # sha256sum 实测；tag v1.2.0 = 3c3077e2a24b47db1b4c459fb3173ba7f75b9b44
  sha256: "72b6de42cd5e83439b5799a92f8e904854ef9db447a6a9e260c2ba65a8d33c64"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  configure_options:
    - "--without-wbclient"        # wbclient 不在 ohpcd（可选面）
    - "--disable-nls"             # 设备/CI 无 msgfmt
    - "--without-manpages"        # docbook-xsl/xsltproc 缺
    - "--build=aarch64-unknown-linux-gnu"   # uname -s=HarmonyOS，config.guess 不识别
    - "--host=aarch64-unknown-linux-gnu"    # build==host 保持本地构建
    - "--with-openssl=<conan openssl 包目录>"  # AX_CHECK_OPENSSL 无 pkg-config .pc 时的唯一入口

  dependencies:
    - "krb5/1.22.1"        # GSSAPI 硬依赖（gssapi/gssapi.h + krb5-config + libgssapi_krb5）
    - "libunistring/1.0"    # unicase.h/uniconv.h + u8_toupper 硬依赖
    - "openssl/3.0.21"      # AX_CHECK_OPENSSL 硬依赖（静态，MD4 走 legacy provider）
    - "zlib/1.3.1"          # AX_CHECK_ZLIB 硬依赖（crypto.c 引 zlib.h，链接 -lz）

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-src-debug-secure_getenv-ohos.patch"        # portability：OHOS/musl 无 secure_getenv
  - "0002-src-gss_err-strerror_r-xsi.patch"          # portability：strerror_r 变体守卫 glibc 中心假设
  - "0003-src-gss_serialize-rc4-export-length.patch" # portability：RC4 序列化长度假设 RC4_INT=4 字节

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "autotools tag 归档在本设备 autoreconf 自举是 perl 双解释器陷阱：HNP perl(5.42.0 非 i-thread) 与 conan perl(5.42.2 thread-multi) 的 XS ABI 互不兼容，必须 tool_requires 三件套 + PATH 优先级 + aclocal/automake shim 显式钉同一解释器 + shim 复刻重定位参数 # knowledge_ref: E729"
  - "conan AutotoolsToolchain 默认 --prefix=/ 使 *-config 与 provider 模块查找路径失真（krb5-config 输出 -I//include、openssl 找 //ossl-modules）：真实 -I/-L 走 AutotoolsDeps，OPENSSL_MODULES 显式注入 # knowledge_ref: E729"
