# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gss-ntlmssp/1.2.0
homepage: "https://github.com/gssapi/gss-ntlmssp"

# 上游测试命令 (automake 套件)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试（build() 内 make -j2 check）
upstream_test_in_build: true
upstream_test_command: "make -j2 check"

# 上游实际运行的测试程序（automake TESTS = 3 个注册入口，逐字来自 Makefile.am）
upstream_tests:
  - file: ntlmssptest
    source: gss-ntlmssp-1.2.0/tests/ntlmssptest.c
    description: "上游主测试程序：46 个 Test 块（NTLMv1/v2 向量、编解码、GSSAPI 会话、SPI、名字导入等），每入口全量执行"
    command: "./ntlmssptest"
  - file: tests/env1.sh
    source: gss-ntlmssp-1.2.0/tests/env1.sh
    description: "凭据文件形态 A（smbpasswd 哈希，TEST_USER_NAME=testuser）下复跑 46 块"
    command: "./tests/env1.sh"
  - file: tests/env2.sh
    source: gss-ntlmssp-1.2.0/tests/env2.sh
    description: "凭据文件形态 B（DOMAIN\\user 哈希）+ NTLMSSP_TEST_DEBUG 轨迹断言下复跑 46 块（脚本自身另核 trace 产物存在）"
    command: "./tests/env2.sh"

# test_package 中自带的测试 (消费者视角验证, 鸿蒙特有)
test_package_tests:
  - file: gssntlm_probe.c
    description: "鸿蒙特有端到端消费者用例（20 断言）：dlopen 安装树 gssntlmssp.so（musl/OHOS loader + DT_NEEDED 解析）→ 11 个核心 gss_* 入口与 configure 硬校验对 dlsym → iconv UTF16LE 布局 → NTLM_USER_FILE 真凭据获取 cli/srv 凭据 → 四步 init/accept 握手 → gss_wrap(conf)/unwrap 字节级往返 → get_mic/verify_mic 往返 → 资源释放"
    command: "./gssntlm_probe <gssntlmssp.so> <ntlm_user_file>"

# 测试断言总数 (近似值, 用于质量评估)：上游 138（46 Test 块 × 3 个 harness 入口）+ 消费者 20 = 158
assertion_count: 158
