sources:
  url: "https://github.com/gssapi/gss-ntlmssp/archive/refs/tags/v1.2.0.tar.gz"
  sha256: 72b6de42cd5e83439b5799a92f8e904854ef9db447a6a9e260c2ba65a8d33c64

patches:
  - patch_file: "patches/0001-src-debug-secure_getenv-ohos.patch"
    patch_description: "OHOS/musl libc 无 secure_getenv（头无声明+链接无符号，实测），非 glibc/bionic 平台用等价判据内联实现，否则 -Werror-implicit-function-declaration 编译必败"
    patch_type: "portability"
  - patch_file: "patches/0002-src-gss_err-strerror_r-xsi.patch"
    patch_description: "strerror_r 变体守卫是 glibc 中心假设：_GNU_SOURCE 下 musl 走进 GNU 分支（char* 返回）但 musl 只有 XSI 变体（int）→ -Wint-conversion 编译必败；改为按 __GLIBC__ 判别"
    patch_type: "portability"
  - patch_file: "patches/0003-src-gss_serialize-rc4-export-length.patch"
    patch_description: "export_keys 用 sizeof(buf)（258*4）序列化 RC4 状态，而导入按 258*sizeof(RC4_INT) 校验；conan openssl RC4_INT=unsigned char（258B）→ 已建立上下文 import_sec_context 必然 EINVAL（实测 8 例）；改写 RC4_EXPORT 实际写入的 out.length"
    patch_type: "portability"
