software: gitui
version: 0.27.0-r1
status: published
build_system: rust (precompiled_binary)
system: custom
configure_options:
  - source=alpine-edge-community
  - actual_version=0.28.1-r0
  - qsort_r_shim=required
build_date: 2026-06-03
compiler: rustc (precompiled musl binary from Alpine Linux)
platform: linux/arm64 (OpenHarmony)
binary_sign: true
elf_signed: true
strip: true
install_prefix: /storage/Users/currentUser/usr/local
products:
  - path: bin/gitui
    type: binary
    description: "gitui - Blazing fast terminal UI for git"
  - path: lib/libgit2.so.1.9.4
    type: library
    description: "libgit2 - linkable library for Git (patched with qsort_r shim)"
  - path: lib/libssh2.so.1.0.1
    type: library
    description: "libssh2 - library for accessing SSH protocol servers"
  - path: lib/libllhttp.so.9.3.1
    type: library
    description: "llhttp - Port of http_parser to llparse"
  - path: lib/libqsort_r_shim.so
    type: library
    description: "qsort_r compatibility shim for HarmonyOS musl libc"
dependencies:
  - oniguruma
  - openssl
  - libgcc
  - musl
  - pcre2
  - zlib
knowledge_gained: |
  - HarmonyOS musl libc (1.2.5) does not export qsort_r (GNU extension)
  - Alpine edge libgit2 requires qsort_r; solved with custom shim library
  - shim approach: compile qsort_r wrapper using clang, add as NEEDED dependency via patchelf
  - GitHub releases unreachable from HarmonyOS (timeout); Alpine APK repos are accessible
  - Chimera Linux repos also unreachable (DNS resolution failure)
notes: |
  - Precompiled binary approach: Alpine edge gitui 0.28.1 APK (dynamically linked musl)
  - Required 4 additional shared libraries: libgit2, libssh2, libllhttp, qsort_r_shim
  - Version discrepancy: requested 0.27.0-r1 (Chimera), deployed 0.28.1 (Alpine edge)
  - GitHub and Chimera repos were unreachable; Alpine repos accessible via dl-cdn mirrors
  - All ELF files signed for HarmonyOS execution
