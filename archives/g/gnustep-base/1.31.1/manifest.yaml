version: "1.31.1"
software: "gnustep-base"
status: adapted
build_system: "autotools+gnustep-make"

source:
  url: "https://ftp.gnustep.org/pub/gnustep/core/gnustep-base-1.31.1.tar.gz"
  sha256: "e7546f1c978a7c75b676953a360194a61e921cb45a4804497b4f346a460545cd"
  tar_format: tar.gz

build:
  system: "autotools+gnustep-make"
  configure_options:
    - "--with-installation-domain=SYSTEM"
    - "--disable-importing-config-file"
    - "--disable-xml"
    - "--disable-xslt"
    - "--disable-tls"
    - "--disable-zeroconf"
    - "--disable-icu"
    - "--disable-libdispatch"
    - "--disable-nsurlsession"
    - "--disable-iconv"
    - "--with-ffi-include=<libffi include>"
    - "--with-ffi-library=<libffi lib>"
    - "--with-curl=<curl package>"
  dependencies:
    - "libobjc2/2.2.1"
    - "libffi/3.5.2"
    - "curl/8.15.0"
  tool_requires:
    - "gnustep-make/2.9.2"

tests:
  upstream_tests_discovered: true
  upstream_tests_executed: 0
  consumer_test: "Objective-C Foundation API smoke test in test_package"

notes:
  - "GNUstep Base requires GNUSTEP_MAKEFILES from gnustep-make before configure."
  - "libcurl is hard-required when the libobjc2 Objective-C 2.0 runtime is selected."
  - "XML/TLS/ICU/zeroconf/libdispatch/NSURLSession are intentionally disabled for the first Foundation slice to keep the dependency surface bounded."
  - "Path B knowledge drafts added: GNUstep Make environment closure and Objective-C runtime consumer closure for OHOS."
  - "Local machine lacks Conan/OHOS build environment; status remains adapted, not built."
