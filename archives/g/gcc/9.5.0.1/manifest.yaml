# gcc 9.5.0.1 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

software: gcc
version: "9.5.0.1"
status: built
build_date: "2026-09-22"
compile_date: "2026-09-22"
conan_ref: "gcc/9.5.0.1@ohpcd/stable"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/gcc/gcc-9.5.0/gcc-9.5.0.tar.xz"
  sha256: "27769f64ef1d4cd5e2be8682c0c93f9887983e6cfd1a927ce5a0a2915a95cf8f"
  tar_format: tar.xz
  version_note: "9.5.0.1 = 同一上游 gcc-9.5.0 源码，工具链路线重构版（R37 适配修复后缀）：9.5.0 包的宿主工具与目标对象非 PIE，命中 OHOS LLD AArch64 COPY 重定位 bug 导致所编程序段错误（gcc.c-torture nestfunc/printf-2 类失败）。9.5.0.1 全链 PIE + SDK ld.lld 唯一链接器 + LLD 自动签名，取消 binary-sign-tool 依赖。"

build:
  system: autotools
  cc: clang
  cxx: ""
  configure_options:
    - "--build/--host/--target=aarch64-linux-ohos"
    - "--enable-languages=c --disable-bootstrap --disable-lto --disable-plugin --disable-multilib --disable-nls --disable-shared"
    - "--disable-libatomic --disable-libitm --disable-libsanitizer --disable-libgomp --disable-libquadmath --disable-libssp --disable-libvtv --disable-werror --without-isl"
    - "--disable-threads (OHOS libc 无 pthread_cancel，单线程 gthread 后端足够 C 前端+静态 libgcc)"
    - "--with-sysroot=<OHOS SDK sysroot> --with-native-system-header-dir=/usr/include"
    - "--enable-default-pie (全链 PIE；非 PIE 对象命中 OHOS LLD AArch64 COPY 重定位 bug)"
    - "--with-ld=<OHOS SDK ld.lld realpath> (DEFAULT_LINKER 烘焙进驱动，目标链接自动签名)"
  extra_build_transforms:
    - "configure 后清空 gcc/Makefile 的 NO_PIE_CFLAGS/NO_PIE_FLAG(/FOR_BUILD)：宿主生成器保持 PIE（env 预置 gcc_cv_c_no_fpie 无效，见 notes）"
    - "files/prepare_ohos_sources.py：注入 aarch64-linux-ohos triplet/tm_file/t-musl（沿用 9.5.0 已审计变换）"
    - "all-gcc 后断言 xgcc -print-prog-name=ld == 烘焙的 SDK ld.lld（fail-fast，防 --with-ld 未生效走入无签名 GNU ld）"
  dependencies:
    - "gmp 6.1.0 (in-tree)"
    - "mpfr 3.1.4 (in-tree)"
    - "mpc 1.0.3 (in-tree)"

dependencies:
  required: []
  optional:
    - "OHOS SDK (clang/ld.lld/sysroot, 编译期)"
    - "GNU binutils as (目标汇编, 编译期)"

patches_applied: []

test_results:
  type: official
  total: 25200
  passed: 25134
  failed: 66
  upstream:
    entry: "make -C gcc selftest (exit 0) + gcc.c-torture/execute 50 源 x (-O0,-O2) = 100/100 + dejagnu execute.exp/compile.exp 全量"
    total: 25200
    passed: 25134
    failed: 66
  note: "dejagnu 全量（2026-09-22，conan create 构建树）：execute.exp 15761/41/307/15，compile.exp 9373/25/55/283，合计通过率 99.74%。66 失败 100% 归因平台/环境/测试设施限制，无编译器缺陷：trampoline 内核签名 25、musl tmpnam 只读 /tmp 16、stage-1 cc1（clang 构建）病态 10^4 层嵌套 ICE 20、size32plus 探针污染 5；另有 70 unresolved（dg-require 缺头 15 + 300s 单测超时 55）。证据 reports/dejagnu-{execute,compile}.stdout.log"

packaging:
  conan_ref: "gcc/9.5.0.1@ohpcd/stable"

knowledge_gained:
  - "OHOS SDK ld.lld 链接产物自动带 .codesign 且可被内核加载；GNU ld (binutils 2.45) 不签名，产物 rc=126 拒绝执行——工具链必须以 lld 为唯一链接器"
  - "非 PIE 对象 + OHOS lld → AArch64 COPY 重定位（libc stderr 等）按 16 字节对齐装 literal (LO12)，非 PIE 加载地址未对齐 → LDR 未对齐段错误；--enable-default-pie + 清 NO_PIE_* 全链 PIE 是根因修复"
  - "gcc 9.5 顶层 configure 未消费 --with-ld 但经 baseargs 转发给 gcc/configure（DEFAULT_LINKER），gcc.c/collect2 内 access(DEFAULT_LINKER) 直取绝对路径"
  - "gcc_cv_c_no_fpie/gcc_cv_no_pie 的 env 预置不生效（顶层 configure 生态），必须在 configure 后 sed 清空 Makefile 变量；BUILD_NO_PIE_* 经 $(NO_PIE_*) 间接引用自动联动"
  - "CC 注入 -fuse-ld=bfd 会使 clang 对 -E 探测输出 unused-argument 警告 → autoconf conftest.err 非空 → HAVE_LIMITS_H 等误判为 no → limits.h 缺失链式崩溃；且强制 bfd 同时禁用 lld 自动签名"
