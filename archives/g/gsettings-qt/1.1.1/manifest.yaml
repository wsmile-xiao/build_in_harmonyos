# 版本级 manifest — gsettings-qt 1.1.1（HarmonyOS PC / arm64）
# 文档位置: archives/g/gsettings-qt/1.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.1.1"
software: gsettings-qt
status: built
build_date: "2026-09-15"
build_system: cmake

source:
  url: "https://gitlab.com/ubports/development/core/gsettings-qt/-/archive/v1.1.1/gsettings-qt-v1.1.1.tar.gz"
  sha256: "636cff4336b8729f805bd1cb6904a4c140b69d8a8063949c61f39f8431fe9d00"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_QT6=ON"        # 上游默认 Qt5，OHOS 生态与下游消费方均为 Qt6
    - "-DENABLE_WERROR=OFF"    # clang 15 下 -Wall -Wextra -pedantic 不作为门禁
    - "-DBUILD_TESTING=ON"     # 构建并真实执行上游 ctest 用例
  dependencies:
    - qtbase/6.11.1             # Qt6::Core（qgsettings.h 公开暴露 QObject/QVariant）
    - qtdeclarative/6.11.1      # Qt6::Qml（QML 插件）+ Qt6::QuickTest（上游 qmltest）
    - glib/2.88.3               # gio-2.0（源码 <gio/gio.h>；.pc Requires: gio-2.0）
  build_tools:
    - pkgconf/3.0.6             # find_package(PkgConfig REQUIRED)
    - cmake-extras/1.9          # CMake 模块 QmlPlugins（add_qmlplugin）
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 GSettings/CMakeLists.txt 在 configure 阶段 find_program(qmlplugindump REQUIRED)，而 cmake-extras 的 QmlPluginsConfig.cmake 内部还会再查一次；两者都只看 PATH（HINTS /usr/lib/qt6/bin 在 OHOS 不存在）→ 必须在 generate() 把 qtdeclarative 包 bin/ 注入 PATH，并补 LD_LIBRARY_PATH（qmlplugindump 需 libQt6Qml/libQt6Core）。knowledge_ref: DRAFT-gsettings-qt-qml-toolchain"
  - "上游 qmltest 的 set_tests_properties ENVIRONMENT 会覆盖 QML2_IMPORT_PATH（固定为构建树），而 QtTest/TestCase.qml 需要 QtQuick.Window 等模块 → 用 QML_IMPORT_PATH（Qt6 同时读取、不被覆盖）补 qtdeclarative 包的 qml/ 目录即可，无需改上游文件。knowledge_ref: DRAFT-gsettings-qt-qml-toolchain"
  - "上游安装头文件到 <prefix>/include/<triplet>/qt6/QGSettings/ 且转发头文件名为 QGSettings（无后缀）→ 消费方 include 目录必须是该 QGSettings 目录本身（与包内 .pc 的 Cflags 一致），cpp_info.includedirs 不能取父目录。knowledge_ref: notes.md#对话-1--首次适配2026-09-15"
  - "cmake-extras 为纯 CMake 模块数据包，作为 host requires 会触发 conan 'direct dependency not used by cpp_info.requires' 报错 → 应声明为 tool_requires（构建期使用，不进入消费者依赖链）。knowledge_ref: DRAFT-gsettings-qt-qml-toolchain"
  - "OHOS 构建的测试可执行文件与 QML 插件在运行前必须自签名（binary-sign-tool），否则加载失败；签名在 build() 末尾（测试前）与 package() 内各做一次。knowledge_ref: notes.md#对话-1--首次适配2026-09-15"
