# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: gsettings-qt/1.1.1
homepage: "https://gitlab.com/ubports/development/core/gsettings-qt"

# 上游测试通过 CTest 注册（tests/CMakeLists.txt 的 add_test）：
#   cpptest  —— QtTest 用例（tests/cpptest.cpp，5 个测试槽 + initTestCase）
#   qmltest  —— QtQuickTest 用例（tests/test.cpp + tests/tst_GSettings.qml，7 个测试函数）
# 本适配在 conanfile.py build() 内真实执行 ctest（见 upstream_test_command），
# 结果与日志见版本目录 reports/upstream-tests.log。
upstream_check_command: "ctest --test-dir <build> --output-on-failure --parallel 1"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --parallel 1"

upstream_tests:
  - file: tests/cpptest.cpp
    source: gsettings-qt-v1.1.1/tests/cpptest.cpp
    description: "上游 QtTest 用例：deferredDelete/get_set_reset/default_value/keys/changed"
    command: "ctest -R cpptest --output-on-failure"
  - file: tests/test.cpp
    source: gsettings-qt-v1.1.1/tests/test.cpp
    description: "上游 QtQuickTest 驱动：加载 tst_GSettings.qml（7 个 QML 测试函数）"
    command: "ctest -R qmltest --output-on-failure"

test_package_tests:
  - file: test_gsettings_qt.cpp
    description: "消费方验证：QGSettings 构造/get/set/trySet/reset/keys/defaultValue/choices/changed + pkg-config 元数据"
    command: "./test_gsettings_qt"

assertion_count: 13
