software: gsettings-qt
display: "gsettings-qt"
description: "Qt6 bindings to GSettings (libgsettings-qt6 + QML module GSettings 1.1)"
category: library
homepage: "https://gitlab.com/ubports/development/core/gsettings-qt"
license: LGPL-3.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "Force the upstream Qt6 build mode (-DENABLE_QT6=ON): the OHOS Qt ecosystem and its consumers are Qt6; the Qt5 variant is out of scope."
    - "Pin qtbase/6.11.1 exactly, because qtdeclarative/6.11.1 depends on qtbase/6.11.1 with an exact version."
    - "Inject the QML toolchain into the build environment: qtdeclarative's bin/qmlplugindump is required by find_program(REQUIRED) at configure time and by cmake-extras QmlPluginsConfig.cmake; glib's bin/glib-compile-schemas is required by the test suite."
    - "Use QML_IMPORT_PATH to expose the QML modules shipped in the conan packages; upstream tests override QML2_IMPORT_PATH with the build tree, so the legacy variable cannot carry the dependency modules."
    - "cmake-extras (pure CMake module data package) is declared as tool_requires to keep it out of the consumer dependency chain."
    - "Self-sign built OHOS ELF binaries before running the upstream test suite and before packaging."
  common_dependencies:
    - qtbase
    - qtdeclarative
    - glib

versions:
  "1.1.1":
    status: built
    build_date: "2026-09-15"

upstream_tests:
  total: 16
  passed: 16
  failed: 0
  skipped: 0
  command: "ctest --test-dir <build> --output-on-failure --parallel 1"
  evidence: "1.1.1/reports/upstream-tests.log"
