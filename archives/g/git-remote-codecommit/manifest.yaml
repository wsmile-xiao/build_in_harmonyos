software: git-remote-codecommit
display: "Git Remote CodeCommit"
description: "Git remote helper for AWS CodeCommit — simplifies pushing to and pulling from CodeCommit repositories"
category: system
homepage: "https://github.com/aws/git-remote-codecommit"
license: Apache-2.0
build_system: pip

ohos_adaptation:
  key_points:
    - "pip --prefix与--root冲突(Cannot set --home and --prefix together)，需改用setup.py install --prefix --root"
    - "easy_install .egg格式不被importlib.metadata识别，需手动创建console脚本"
    - "botocore等Python依赖需使用清华镜像(pypi.tuna.tsinghua.edu.cn)加速下载"
    - "纯Python包，无ELF二进制，不需要strip/RPATH/签名"
  common_dependencies:
    - botocore

versions:
  "1.17":
    status: published
    build_date: "2026-05-25"