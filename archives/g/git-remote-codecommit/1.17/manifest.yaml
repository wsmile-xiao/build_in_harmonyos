software: git-remote-codecommit
version: "1.17"
status: published
build_system: pip
compile_date: "2026-05-25"
build_date: "2026-05-25"

source:
  url: "https://github.com/aws/git-remote-codecommit/archive/refs/tags/1.17.tar.gz"
  sha256: "e497a0660ea318c2b3d7330a316fea637ff6d865039f2d2f933379b99b97b757"
  tar_format: tar.gz

build:
  system: pip
  configure_options:
    - "--no-deps"
    - "--prefix=$DEFAULT_PREFIX"
    - "--root=$TEST_PREFIX"
  dependencies:
    - botocore/1.43.14
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Python包在鸿蒙上需用pip --target或setup.py install --prefix --root DESTDIR模式"
  - "pip --prefix与--root冲突(Cannot set --home and --prefix together)，改用setup.py install"
  - "easy_install .egg格式不被importlib.metadata识别，需使用pip安装或手动创建console脚本"
  - "botocore等Python依赖需使用清华镜像加速下载(pypi.tuna.tsinghua.edu.cn)"
  - "git-remote-codecommit是Git辅助工具，验证时需用git命令而非--help"