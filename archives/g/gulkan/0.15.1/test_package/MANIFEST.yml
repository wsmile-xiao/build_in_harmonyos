# test_package/MANIFEST.yml
# Upstream and consumer test declaration for gulkan/0.15.1.

package: gulkan/0.15.1
homepage: https://gitlab.freedesktop.org/xrdesktop/gulkan

upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_disabled_reason: >
  The 6 registered upstream tests (test_instance, test_device, test_client,
  test_texture, test_texture_external, test_renderer — they use
  g_assert/g_assert_nonnull throughout) require (a) a live Vulkan device with
  a working ICD and (b) build-time execution of glib-compile-resources +
  glslangValidator for their gresource/shader payloads. Neither holds on
  headless OHOS CI workers, so patches 0001/0002 gate them behind a
  build_tests option (default false). The library itself uses none of them.

upstream_tests:
  - file: tests/test_instance.c
    description: "Instance creation + extension assertions (needs live ICD)"
    status: "disabled on OHOS CI (see upstream_test_disabled_reason)"
  - file: tests/test_device.c
    description: "Device/queue selection assertions (needs live ICD)"
    status: "disabled on OHOS CI"
  - file: tests/test_client.c
    description: "Client/context assertions (needs live ICD)"
    status: "disabled on OHOS CI"
  - file: tests/test_texture.c
    description: "Texture upload assertions (needs live ICD + gresources)"
    status: "disabled on OHOS CI"
  - file: tests/test_texture_external.c
    description: "External memory texture path (conditional, needs ICD)"
    status: "disabled on OHOS CI"
  - file: tests/test_renderer.c
    description: "Render pass/framebuffer assertions (needs live ICD + shaders)"
    status: "disabled on OHOS CI"

test_package_tests:
  - file: test_package/test.c
    description: >
      Consumer test across BOTH layers: (1) libgulkan GObject API —
      gulkan_instance_new / GULKAN_IS_INSTANCE / get_handle==VK_NULL_HANDLE;
      (2) the linked Vulkan loader path — vkEnumerateInstanceExtension
      Properties round-trip through the system /system/lib64/libvulkan.so
      that libgulkan DT_NEEDEs (loader metadata query, no device/ICD needed;
      measured VK_SUCCESS with 13 instance extensions on this platform).
    command: "conan create (test_package builds and runs gulkan_test)"

assertion_count: 5
