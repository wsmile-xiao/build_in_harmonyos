sources:
  url: https://gitlab.freedesktop.org/xrdesktop/gulkan/-/archive/0.15.1/gulkan-0.15.1.tar.gz
  sha256: 35ebf0b1a3e7facbe59223620048b03d775d7fef12c6243382563cdde807fa55
patches:
  0.15.1:
  - patch_file: patches/0001-meson.build.patch
    patch_description: Build tests/ unconditionally (test_instance/device/client need
      only gulkan_deps, no gresources); keep shaders/res behind build_tests option
      (they need glslangValidator/glib-compile-resources + live device)
    patch_type: portability
    strip: 1
  - patch_file: patches/0002-meson_options.txt.patch
    patch_description: Add the build_tests option (default false) guarding shaders/res
      only
    patch_type: portability
    strip: 1
  - patch_file: patches/0003-src-gulkan-texture.c.patch
    patch_description: 'Fix upstream bug: initialise VkFormat with VK_FORMAT_UNDEFINED,
      not VK_NULL_HANDLE (void* -> enum is a hard -Wint-conversion error with current
      clang)'
    patch_type: portability
    strip: 1
  - patch_file: patches/0004-tests-meson.build.patch
    patch_description: Keep only test_instance in tests/meson.build (runs on system
      Vulkan loader without device, verified Ok); drop test_device/client (need live
      device+queue) and texture/renderer (need gresources+device)
    patch_type: portability
    strip: 1
