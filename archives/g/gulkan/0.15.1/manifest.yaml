knowledge_gained:
  - "tool_requires(glib) 会把 proxy libintl.so.8 注入 LD_LIBRARY_PATH 遮蔽真 gettext，崩掉 meson/python —— 构建期 glib 工具改用 MesonToolchain.binaries 注册"
  - "meson find_tool 优先 [binaries]；conan 生成的 gio-2.0.pc 缺 glib_compile_resources pkgvar 时直接抛错不落 PATH 兜底"
  - "OHOS 设备强制 ELF 签名加载：package() 内 binary-sign-tool selfSign 产物（guarded），否则 test_package dlopen EACCES"
  - "VK_NULL_HANDLE(void*) 赋 VkFormat 枚举在新 clang 为硬错误，应 VK_FORMAT_UNDEFINED"
  - "glib(2.84)/glib2(2.88,graphene 线) 并存时 zlib 冲突用 override=True 统一 1.3.1.1（awf-gtk 先例）"
  - "vulkan loader 未发布且 wish-1927 停滞：链接系统 /system/lib64/libvulkan.so + vulkan-headers 包头，包内不打包 libvulkan"

