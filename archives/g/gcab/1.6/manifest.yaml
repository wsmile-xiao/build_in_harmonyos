software: gcab
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/gcab/1.6/gcab-1.6.tar.xz"

  # 源码校验和
  sha256: "2f0c9615577c4126909e251f9de0626c3ee7a152376c15b5544df10fc87e560b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Ddocs=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.88.0
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-libgcab-meson.build.patch"
  - "0002-src-meson.build.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Meson构建系统需要检查meson.build文件，而非configure.ac"
  - "Meson共享库需要设置install_rpath以支持运行时加载，格式：install_rpath : get_option('prefix') / get_option('libdir')"
  - "Meson可执行文件同样需要install_rpath配置，确保能找到依赖的共享库"
  - "GObject Introspection可通过-Dintrospection=false禁用"
  - "VAPI绑定可通过-Dvapi=false禁用（依赖introspection）"
  - "Meson选项格式为-Dxxx=value，不同于autotools的--xxx=value"
  - "GLib测试套件在鸿蒙环境可能失败（G_TEST_DIST找不到测试数据），不影响核心功能"
  - "clean-verify脚本对meson构建系统支持不完善，需要手动验证G0门禁"
  - "Meson的install_rpath在编译后会变成RUNPATH（现代ELF标准）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/gcab-1.6.orig
  source_work_dir: /storage/Users/currentUser/builds/gcab-1.6.work
  source_orig_hash: cde29a0481bc0839
  source_work_hash: 31c08ceaa16ab04b
  generated_at: '2026-06-12T16:19:31'
  patches_count: 2

patch_classification:
  - file: 0001-libgcab-meson.build.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-src-meson.build.patch
    type: auto
    platform_only: True
    guard: 'pending'
