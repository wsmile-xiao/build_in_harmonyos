# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: glbinding/3.5.0
homepage: "https://github.com/cginternals/glbinding"

# 上游测试命令 (gtest 体系，通过上游 glbinding-test 注册的 TEST 宏枚举)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# glbinding 上游测试(glbinding-test)依赖 googletest + glfw + 真实 GL 上下文；
# 在配方 build() 中不集成（OPTION_BUILD_TESTS=OFF，与 glfw 同类图形库一致），
# 上游测试在适配流程中单独用 registry 的 gtest/glfw 枚举构建并实测。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际注册的独立用例（source/tests/glbinding-test，cmake sources 注册 16 个）
# 双口径：source_declared_total=18（另 2 个未注册文件），configured/run=16，全通过
upstream_tests:
  - file: glbinding-test/AllVersions_test.cpp
    source: glbinding-3.5.0/source/tests/glbinding-test/AllVersions_test.cpp
    description: "AllVersions.Compilation —— 编译期校验全部 GL 版本枚举常量可用"
    command: "glbinding-test --gtest_filter=AllVersions.Compilation"
  - file: glbinding-test/RingBuffer_test.cpp
    source: source/tests/glbinding-test/RingBuffer_test.cpp
    description: "RingBuffer_test 7 用例（SimpleTest/StringTest/ObjectTest/ObjectPointerTest/SimpleMultiThreadedTest/MultiThreadedTest2/ResizeTest）"
    command: "glbinding-test --gtest_filter=RingBuffer_test.*"
  - file: glbinding-test/SharedBitfield_test.cpp
    source: source/tests/glbinding-test/SharedBitfield_test.cpp
    description: "SharedBitfield 3 用例（Usage1a/1b/2）——无 GL 上下文的纯逻辑测试"
    command: "glbinding-test --gtest_filter=SharedBitfield.*"
  - file: glbinding-test/Boolean_compilation_test.cpp
    source: source/tests/glbinding-test/Boolean_compilation_test.cpp
    description: "Boolean.Compilation（GLboolean 编译期可用性）"
    command: "glbinding-test --gtest_filter=Boolean.Compilation"
  - file: glbinding-test/Regression_test_82.cpp
    source: source/tests/glbinding-test/Regression_test_82.cpp
    description: "Regression_82.Compilation"
    command: "glbinding-test --gtest_filter=Regression_82.*"
  - file: glbinding-test/Regression_test_185.cpp
    source: source/tests/glbinding-test/Regression_test_185.cpp
    description: "Regression_185 2 用例（GLbooleanReturnValueCall/GetString）"
    command: "glbinding-test --gtest_filter=Regression_185.*"
  - file: glbinding-test/Regression_test_198.cpp
    source: source/tests/glbinding-test/Regression_test_198.cpp
    description: "Regression_198.releaseContext"
    command: "glbinding-test --gtest_filter=Regression_198.*"

# 未注册但存在于源码树的测试文件（source_declared 计入，configured 未实例化）
# MultiContext_test.cpp / MultiThreading_test.cpp：上游 CMakeLists 未列入 sources；
# 最小补丁接入实测编译失败（#include <glbinding/Meta.h> 官方树中不存在，Meta.h 属
# glbinding-aux 命名空间），且依赖 glfw 真窗口/GL 上下文 —— 真实上游条件，保持 uninstantiated
upstream_uninstantiated:
  - file: glbinding-test/MultiContext_test.cpp
    reason: "上游 CMakeLists 未注册；补丁实测编译失败（glbinding/Meta.h 不存在）"
  - file: glbinding-test/MultiThreading_test.cpp
    reason: "上游 CMakeLists 未注册；补丁实测编译失败（glbinding/Meta.h 不存在）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：公开 API 调用（Meta::getString / Version 比较），无需 GL 上下文"
    command: "./test_glbinding"
  - file: test_ohos.cpp
    description: "HarmonyOS 专项测试：公开 API + 加载 /system/lib64/libGLESv3.so 与 libEGL.so，解析 eglGetError/glGetString 符号，校验 EGL_NO_ERROR"
    command: "./test_glbinding_ohos"

# 测试断言总数 (近似值, 用于质量评估)：16 注册用例 + 2 test_package 消费者/鸿蒙测试
assertion_count: 18