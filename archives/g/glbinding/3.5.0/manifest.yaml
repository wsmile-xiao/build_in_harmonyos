software: glbinding
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.5.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/cginternals/glbinding/archive/refs/tags/v3.5.0.tar.gz"

  # 源码校验和
  sha256: "bb39a97d5d94f70fe6e9c2152e0d8d760758bb031b352e1707fa90f00a43fc69"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DOPTION_BUILD_TESTS=OFF"
    - "-DOPTION_BUILD_DOCS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 不识别 HarmonyOS 平台（E092），输出 'System is unknown to cmake' 警告，非阻塞"
  - "glbinding 的 CMakeLists.txt 在 project() 前调用 option(BUILD_SHARED_LIBS ON)，需要在 cmake 命令行和 Conan 工具链中同时设置 BUILD_SHARED_LIBS=OFF"
  - "需要 glfw3 的工具（glcontexts/glfunctions/glinfo 等）在无头显示器平台上正确跳过"
  - "conanfile.py 通过 filemgr 写入时可能产生 null 字节，建议用 bash heredoc 写入"
