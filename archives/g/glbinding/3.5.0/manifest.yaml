# 适配说明
adaptation_notes: >
  OHOS PC (aarch64) 交叉编译：静态库 libglbinding.a / libglbinding-aux.a。
  使用 OHOS NDK ohos.toolchain.cmake 直接驱动 cmake（CMAKE_SYSTEM_NAME=OHOS），
  并显式 -D 传递 BUILD_SHARED_LIBS/OPTION_* 避免 option() 默认值覆盖；
  llvm-ranlib 缺失改用 /data/service/hnp/bin/llvm-ranlib（指向 llvm-ar）。
  纯库交付，不含 CLI 工具（上游 tools 依赖 glfw + GL 上下文，非库交付物，
  R38 库类型不需要 commands.json）。