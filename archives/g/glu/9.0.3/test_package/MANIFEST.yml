# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: glu/9.0.3
homepage: "https://gitlab.freedesktop.org/mesa/glu"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test -C build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 说明：上游 glu 仓库**不含单元测试目录**（其验证依赖 mesa 的整体测试套件与
# 需要 GL 上下文的渲染验证），故此处如实声明为空，不虚构用例。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_glu.c
    description: >-
      消费者视角真实测试：① 链接并调用 gluErrorString()（纯函数，不需要 GL 上下文）
      校验对合法/非法错误码均返回非空描述；② 校验 GLU 版本宏为 1.3；
      ③ 通过一个真正引用 glu* 符号的调用，确保库导出了符号
      （这正是补丁 0001 修复的 gnu_symbol_visibility:hidden 问题——
      未修复时链接期即报 undefined reference）。
    command: "./test_glu"

verify_points:
  - "test_glu 编译通过（consumer 侧 find_package + 链接 libGLU）"
  - "test_glu 实际执行并返回 0"
  - "gluErrorString 返回值非空（GLU_enum 与 GLU_NURBS_ERROR 两类都验证）"
  - "GLU_VERSION == 100800（即 1.3）"
