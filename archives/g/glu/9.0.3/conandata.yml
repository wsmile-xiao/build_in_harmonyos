# conandata.yml — glu 9.0.3
# Mesa OpenGL Utility library（freedesktop/mesa 的 glu）
#
# R39：只写官方原始 URL（镜像由 CI 自动注入）。
# 说明：上游为 gitlab.freedesktop.org/mesa/glu，但其 archive 端点生成的是
# 带 commit 后缀的目录名、且哈希不如正式归档稳定；故使用 mesa 官方的
# **发布归档站** archive.mesa3d.org（同一制品的镜像 mesa.freedesktop.org
# 经实测 sha256 完全一致）。
# 另注：只有 .tar.xz 格式（.tar.gz / .tar.bz2 / .tar.zst 实测均 404）。

sources:
  url: "https://archive.mesa3d.org/glu/glu-9.0.3.tar.xz"
  sha256: "bd43fe12f374b1192eb15fe20e45ff456b9bc26ab57f0eee919f96ca0f8a330f"
  # 注：此处**不写** tar_format —— get() 不识别该参数，通过 ** 展开会报
  # TypeError: get() got an unexpected keyword argument 'tar_format'
  # （dbus 等包的做法是另用显式传参 get(url=..., sha256=...)）。
  # conan 依 URL 扩展名 .tar.xz 自动识别格式，无需该键。
  # 归档格式记录在 manifest.yaml 的 tar_format 字段（属另一套 schema）。

patches:
  # key 必须与 conanfile.version 完全一致（apply_conandata_patches 用
  # str(conanfile.version) 取 key），否则补丁会被静默跳过。
  "9.0.3":
    - patch_file: "patches/0001-remove-gnu-symbol-visibility-hidden.patch"
      patch_description: >-
        src/meson.build 无条件设置 gnu_symbol_visibility: 'hidden'，而源码中没有任何
        visibility default 标注，导致编译成功但动态符号表导出 0 个 glu* 符号
        （符号为 LOCAL HIDDEN），消费者无法链接。删除该行后导出 64 个 glu* 符号。
      patch_type: "portability"
