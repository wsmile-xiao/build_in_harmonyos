software: golang-migrate
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/homebrew/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "homebrew"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/golang-migrate/migrate/tar.gz/refs/tags/v4.19.1"

  # 源码校验和
  sha256: "677bf03c19d684dc5bef47e981ec1b4564482cbf5f9b190cb48e110183fd6d25"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # Go 构建系统标识
  build_system: go

  # 配置选项列表
  configure_options:
    - "build_system=go"
    - "CGO_ENABLED=1"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOPROXY=https://goproxy.cn,direct"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go build with CGO_ENABLED=1 for arm64 requires musl libc headers"
  - "Version injection: -X main.Version=v4.19.1 via ldflags"
  - "Build tags: postgres mysql sqlite sqlite3 file for common drivers"
  - "codeload.github.com works for SSL-challenged environments when github.com fails"
  - "Go build system: custom system + build_system=go in manifest"
  # 例如:
  # - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
  # - "内嵌 libuv 需要禁用，使用系统 libuv"
