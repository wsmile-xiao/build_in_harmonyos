# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: gstreamer/1.28.3
homepage: "https://gstreamer.freedesktop.org/"

# 上游测试命令
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tools/gst-inspect.c
    source: gstreamer-1.28.3/tools/gst-inspect.c
    description: "gst-inspect tool - inspects GStreamer plugins"
    command: "./gst-inspect-1.0"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 - 验证 gst_init() 和 gst_version_string() API"
    command: "./test_gstreamer"

# 测试断言总数
assertion_count: 3
