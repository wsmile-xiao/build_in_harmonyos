software: gstreamer
display: "GStreamer"
description: "Open source multimedia framework"
category: multimedia
homepage: "https://gstreamer.freedesktop.org/"
license: LGPL
build_system: meson

ohos_adaptation:
  key_points:
    - "使用 meson 构建系统，需 meson 1.4+ 和 ninja"
    - "HMDFS/SELinux 环境下 Python 脚本无法直接执行，需通过 python3 解释器调用"
    - "依赖 glib-2.0 (2.88.0+)，需先安装 glib"
    - "禁用 gst_parse 可避免部分 flex/bison 相关问题"
    - "核心库和插件（coreelements, coretracers）完全可用"
  common_dependencies:
    - glib/2.88.0

versions:
  "1.28.3":
    status: built
    build_date: "2026-05-21"
    notes: "最新稳定版，需修复 Python 脚本执行问题"