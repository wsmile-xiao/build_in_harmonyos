# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: geogram/1.10.1
homepage: "https://github.com/BrunoLevy/geogram"

# 上游测试入口；本轮按 release asset 中可在 MinGW host 执行的清单运行
upstream_check_command: "cmake --build upstream-host --parallel 2"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: src/tests/test_nn_search
    source: geogram-1.10.1/src/tests/test_nn_search
    description: "nearest-neighbor search"
    command: "./test_nn_search"
  - file: src/tests/test_convex_cell
    source: geogram-1.10.1/src/tests/test_convex_cell
    description: "convex cell geometry"
    command: "./test_convex_cell"
  - file: src/tests/bench_load
    source: geogram-1.10.1/src/tests/bench_load
    description: "mesh load benchmark"
    command: "./bench_load"
  - file: src/tests/test_expansion_nt
    source: geogram-1.10.1/src/tests/test_expansion_nt
    description: "expansion arithmetic"
    command: "./test_expansion_nt"
  - file: src/tests/test_HLBFGS
    source: geogram-1.10.1/src/tests/test_HLBFGS
    description: "HLBFGS optimizer"
    command: "./test_HLBFGS"
  - file: src/tests/test_RVC
    source: geogram-1.10.1/src/tests/test_RVC
    description: "restricted Voronoi cell"
    command: "./test_RVC"
  - file: src/tests/test_logger
    source: geogram-1.10.1/src/tests/test_logger
    description: "logger behavior"
    command: "./test_logger"
  - file: src/tests/test_CDT_2d
    source: geogram-1.10.1/src/tests/test_CDT_2d
    description: "2D constrained Delaunay triangulation"
    command: "./test_CDT_2d"
  - file: src/tests/test_mesh_syntaxic_sugar
    source: geogram-1.10.1/src/tests/test_mesh_syntaxic_sugar
    description: "mesh syntax helpers"
    command: "./test_mesh_syntaxic_sugar"
  - file: src/tests/test_lifecycled_attribute
    source: geogram-1.10.1/src/tests/test_lifecycled_attribute
    description: "lifecycle attribute"
    command: "./test_lifecycled_attribute"
  - file: src/tests/test_orient_3d_SOS
    source: geogram-1.10.1/src/tests/test_orient_3d_SOS
    description: "3D orientation SOS predicate"
    command: "./test_orient_3d_SOS"

# These upstream entries remain explicit exclusions from the portable host denominator.
excluded_upstream_tests:
  - file: src/tests/test_locks
    reason: "MinGW executable consistently returns 0xC0000005 even with sys:max_threads=1 and nb_times=100; no adaptation change applied."
  - file: src/tests/test_geofile
    reason: "fixed large-grid fixture writes >650MB and reports chunk-size mismatch on MinGW host; requires upstream 64-bit POSIX test environment."

test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：调用 GEO::initialize、GEO::vec3 和向量减法验证 geogram API"
    command: "./geogram_probe"

assertion_count: 4
