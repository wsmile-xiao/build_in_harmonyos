software: gdb
version: "14.1"
status: built
build_date: "2026-05-28"
build_system: autotools

source:
  url: "http://mirrors.ustc.edu.cn/gnu/gdb/gdb-14.1.tar.xz"
  sha256: ""
  tar_format: tar.xz

build:
  system: autotools
  cc: clang
  cxx: clang++
  configure_options:
    - "--with-gmp=/storage/Users/currentUser/usr/local"
    - "--with-mpfr=/storage/Users/currentUser/usr/local"
    - "--with-system-readline"
    - "--disable-werror"
    - "--disable-nls"
    - "--disable-gdbserver"
    - "--disable-sim"
  dependencies:
    - "gmp/6.3.0"
    - "mpfr/4.2.1"
    - "readline/8.2"

patches_applied:
  - "0012-config.guess.patch"
  - "0013-config.sub.patch"

knowledge_gained:
  - "HMDFS umask 077 问题：将 umask 077 改为 umask 022"
  - "OHOS 平台识别：使用 patch-autotools-ohos.pl 补丁"