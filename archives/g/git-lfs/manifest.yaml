software: git-lfs
name: git-lfs
version: 3.7.0
category: development
description: Git extension for versioning large files
website: https://git-lfs.github.com/
license: MIT
dependencies:
  - git >= 2.0.0
build_deps:
  - go >= 1.21
platforms:
  - linux/arm64
source_url: https://github.com/git-lfs/git-lfs/archive/refs/tags/v3.7.0.tar.gz
checksum: ""
binary:
  - git-lfs
environment:
  GOROOT: ~/usr/local/go1.24.4
  GOPATH: ~/go
  GOPROXY: https://goproxy.cn,https://goproxy.io,direct
  CGO_ENABLED: "0"
notes: |
  - Go静态编译，无需RPATH设置
  - 需要签名后才能在OpenHarmony上执行
  - 手动生成mancontent_gen.go和tr_gen.go以跳过go generate