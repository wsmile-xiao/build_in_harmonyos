package: boost1.84-timer/1.84.0
homepage: https://www.boost.org/

# 上游测试说明
# Boost 自带的 B2 构建系统在 OHOS 不兼容（SHELL 执行机制失败，E068），
# 无法直接使用 b2 运行上游测试。本适配沿用 boost/1.84.0 元包的做法，
# 手动编译 Boost.Timer 自带的测试源文件绕过 b2，在 OHOS 环境真实运行：
#   - libs/timer/test/cpu_timer_test.cpp（上游 lightweight_test 框架）
#   - libs/timer/test/original_timer_test.cpp（老式 boost/timer.hpp 测试）
# 编译命令：clang++ -std=c++17 -stdlib=libc++ ... -L<build> -ltimer，
# 链接 conan create 构建出的 libboost_timer.a，直接运行可执行文件。
# 上游还有 progress_display_test.cpp / cpu_timer_info.cpp / msvc10 目录
# 等测试项：progress_display_test 属于 legacy progress_display 组件
# （仅头文件，无需链接）；cpu_timer_info 是信息输出程序（非测试断言）；
# cmake_install_test/cmake_subdir_test 是 CMake 安装方式验证，不属于
# 单元测试范畴。故纳入统计的为上述 2 个 lightweight_test 用例。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/timer/test/cpu_timer_test.cpp"
    description: "Boost.Timer cpu_timer/auto_cpu_timer 单元测试（lightweight_test 框架）"
    command: "clang++ cpu_timer_test.cpp -lboost_timer && ./a.out"
    result: passed
  - file: "libs/timer/test/original_timer_test.cpp"
    description: "Boost.Timer 老式 boost/timer.hpp（progress_timer）测试"
    command: "clang++ original_timer_test.cpp -lboost_timer && ./a.out"
    result: passed

test_package_tests:
  - file: test_boost1_84_timer.cpp
    description: "boost1.84-timer: cpu_timer start/stop/elapsed + format() + auto_cpu_timer + is_stopped/resume"
    command: "ctest boost1_84_timer_test"

assertion_count: 8  # test_package 实际断言数（wall>0、format非空、custom占位符、auto析构、stopped/resume 等 8 项检查）
