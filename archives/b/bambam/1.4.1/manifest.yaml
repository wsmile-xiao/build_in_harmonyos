# 版本级 manifest — bambam 1.4.1（Python 类适配，R47 用户决策覆盖）
# 遵循 ARCHIVE-SPEC v2.0

version: "1.4.1"
software: bambam

# 编译状态（finish 最终更新；如实：本地未跑通 conan create 即 built，
# 跑通未 upload 仍为 built（R29：published 需 CI upload），跑失败即 failed）
# published | built | failed
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-04"
build_system: python

# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL（官方 GitHub tag v1.4.1，R39；gh-proxy 镜像兜底见 conandata.yml）
  url: "https://github.com/porridge/bambam/archive/refs/tags/v1.4.1.tar.gz"
  # 源码校验和（本地 tarball 实测一致）
  sha256: "eb519ac628900056641e70c5c8f69b44e107b83bdc09d20a996f48da660518dc"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型（Python 类：纯 Python 无编译，打包族，参考 pyjson5/0.15.0）
  system: python

  configure_options: []

  # 编译依赖列表（格式: name/version；ohpcd 制品仓均已发布，conan download 实测）
  dependencies:
    - python/3.12.9
    - pygame/2.6.1

  # 编译器（纯 Python 无编译；解释器为 python3.12，图形栈 pygame 2.6.1）
  cc: "n/a（纯 Python 无编译，解释器 python3.12）"
  cxx: "n/a（纯 Python 无编译）"

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []
# 无需补丁：纯 Python 官方源码按原样打包，未修改任何上游文件

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "纯 Python pygame 应用（单文件模块 bambam.py + data/extensions 资源 + bin 包装器）以无构建/打包族配方交付：bambam.py → site-packages + share/bambam/{data,extensions}（run() 按 <prefix>/share/bambam/data 自动发现，bin 放 <prefix>/bin 即命中）+ bin/bambam console 等价包装 + 软件级 commands.json（R38）"
  - "SDL dummy 驱动不支持系统光标：pygame.mouse.set_cursor(pygame.SYSTEM_CURSOR_HAND) 报 'Error while creating system cursor'——pygame 应用 boot 冒烟须以'进程存活到超时（进入事件循环）'为通过判据，并对该 dummy 限制如实上报；--help 在 pygame.init 之前解析可无显示验证"
  - "test_package 消费 pygame 应用：LD_LIBRARY_PATH 须注入 python 依赖包 libdirs（libpython3.12）+ pygame 捆绑 .libs（SDL .so）；PYTHONPATH 指向被测包与 pygame 的 site-packages；SDL dummy + PYGAME_HIDE_SUPPORT_PROMPT 环境"

# ============================================================
# R47 覆盖决策（用户决策，记入 notes.md）
# ============================================================
r47_override: >-
  lang-preflight 实测 detected_language=python（source_stats python:4,
  bash:3, 主体占比 100%，setup.cfg 存在），按 R47 本应 env_unsupported 终态。
  用户明确指示走完整适配+PR 流程，且本仓库有 pyjson5/0.15.0、
  alot/0.12、blendsel/0.11 纯脚本包适配先例（以解释器为运行时依赖交付）。
  按用户决策覆盖 R47 走成功路径适配；覆盖决策与依据详见 notes.md。
