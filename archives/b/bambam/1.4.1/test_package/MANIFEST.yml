# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: bambam/1.4.1
homepage: "https://github.com/porridge/bambam"

# Upstream test command（如实申报实际运行命令，R51）
upstream_check_command: "cd <src> && python3 -m unittest test_e2e_test -v（4/4 通过，实测日志与 sha256 见 .scratch/bambam-subtask/upstream-tests/）"

# Upstream test suite（口径与 PR 正文/notes.md R51 对齐：合计 5 = 4 单元 + 1 端到端；
# 辅助脚本 test/find-freetype.sh、test/redirect-stderr-and-run.sh、run_e2e_test.sh 非用例不计）
upstream_tests_total: 5
upstream_tests_passed: 4
upstream_tests_skipped_reason: "端到端 1 例（test_e2e.py test_functionality）不可运行：需 Xvfb（XWD fbdir 黄金截图对比）+ xdotool（键盘/鼠标事件注入）+ sox（音频输出分析）+ ImageMagick（截屏）以及真实 SDL 视频/音频设备；OHOS CI 无 X11 栈且本机实测 Xvfb/xdotool/sox/ImageMagick 全部缺失，SDL dummy 驱动无真实 framebuffer 与系统光标，故如实标注不可运行（具体技术原因见 notes.md R51 一节），不计入通过数（通过率口径：可运行 4/4 = 100%）"

# Upstream tests run inside conan build
upstream_test_in_build: false
upstream_test_in_build_reason: "纯 Python 无编译包，build() 不定义；上游 4 个单元测试在任务流程内对官方源码实际运行（日志+sha256 见 .scratch/bambam-subtask/），test_package 对已安装制品做实质执行验证"

# test_package consumer-side tests（R34 实质执行）
test_package_tests:
  - file: conanfile.py
    description: "bin/bambam --help：argparse 在 pygame.init 之前解析并正常退出 0（SDL dummy 环境，无显示也能跑，R34 实际运行已安装二进制）"
  - file: test_bambam_ohos.py
    description: "鸿蒙专项测试：import bambam 冒烟 + 包布局断言（share/bambam/data 图片声音、extensions/alphanumeric-en_US/event_map.yaml、bin/bambam 可执行）+ 上游 run() 数据目录发现逻辑（Bambam()._add_base_dir 验证 <prefix>/share/bambam 被发现）+ SDL dummy boot 冒烟（进程存活到超时即通过；SDL dummy 无系统光标限制如实上报；HNP E212 时降级静态制品校验并如实标记 e212Fallback）"
  - file: test_e2e_test.py
    description: "上游 4 个 StreamChecker 单元测试（与 test_e2e.py 一并复制进 test_package，python3 -m unittest test_e2e_test -v，4/4；两文件不 import pygame）"

# Test assertion count（--help 1 + 鸿蒙专项 6 项检查；上游 4 用例断言数不计入）
assertion_count: 7
