# 软件级 manifest — bambam
# 遵循 ARCHIVE-SPEC v2.0

software: bambam
display: "bambam"
description: "Keyboard mashing and doodling game for babies and toddlers"
category: education
homepage: "https://github.com/porridge/bambam"
license: GPL-3.0-or-later

# 纯 Python pygame 幼儿键盘游戏（R47 用户决策覆盖 python_class_task，
# 以 python/pygame 解释器与图形栈为运行时依赖交付，参考 pyjson5/blendsel）
build_system: python

ohos_adaptation:
  key_points:
    - "纯 Python pygame 应用：运行时依赖 conan python/3.12.9 + pygame/2.6.1（ohpcd 预编译制品，CI 可复现），无编译无补丁"
    - "布局：bambam.py → lib/python3.12/site-packages（import bambam 可用）；data/ 与 extensions/ → share/bambam/{data,extensions}（run() 按 dirname(argv[0])/../share/bambam/data 自动发现，bin 放 <prefix>/bin 即命中）；bin/bambam 包装器 shebang env python3"
    - "SDL dummy 驱动无系统光标（set_cursor 报 pygame.error）：test_package 的 boot 冒烟以'进程存活到超时'为通过判据并如实上报该限制；--help 在 pygame.init 之前解析可无显示验证"
    - "端到端上游测试（test_e2e.py）需 X11/Xvfb+xdotool+sox+ImageMagick，OHOS 无 X11 栈不可运行（runnable=0，具体原因见版本 notes.md）"
  common_dependencies:
    - python
    - pygame

versions:
  "1.4.1":
    status: built
    build_date: "2026-10-04"
    archive_path: "1.4.1"
    requires_manual_verification: false
