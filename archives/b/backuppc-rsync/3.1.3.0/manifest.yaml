version: 3.1.3.0
software: backuppc-rsync
status: built
build_date: '2026-08-25'
build_system: autotools
source:
  url: https://github.com/backuppc/rsync-bpc/releases/download/3.1.3.0/rsync-bpc-3.1.3.0.tar.gz
  sha256: 3eeb137319b608512b2d23c54ea8b52b511db806ffbd5fa730a394431d556f3f
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
  - --prefix=$PACKAGE_FOLDER (Conan managed)
  - '--no-create (E114: 先生成 config.status，修复 mktemp 后再执行)'
  - --with-included-popt (OHOS 无系统 libpopt，使用源码内置 popt)
  - '-static ldflag (R26: 终端工具静态链接)'
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied:
- 0001-config.guess.patch
- 0002-config.sub.patch
- 0003-syscall-falloc-macros.patch
- 0004-sysacls-support-guard.patch
- 0005-bpc-standalone-passthrough.patch
knowledge_gained:
- backuppc-rsync 即 BackupPC 上游的 rsync-bpc（AC_INIT([rsync-bpc],[3.1.3.0])），产物为单一命令行工具
  bin/rsync_bpc
- 源码包同时带 configure(/bin/sh 包装器) 与 configure.sh，包装器 exec configure.sh，无需另建符号链接
- 2013 年版 config.guess/config.sub 属旧式脚本：HarmonyOS 分支须用 echo+exit 语法而非 GUESS=（E007
  FAQ）
- 'config.guess 补丁双保险：heredoc 探测加 #elif defined(__OHOS__) LIBC=ohos + 主 case 增加 *:HarmonyOS:*:*)
  分支'
- config.sub(2013) 结构与新版不同：需在 maybe_os 列表加 linux-ohos*、在 OS 列表加 -linux-ohos*，即可规范化
  aarch64-linux-ohos
- zlib 为 rsync 3.1.x 源码内置实现、popt 用 --with-included-popt，包无外部 Conan 依赖
- 上游发布包无测试套件：testsuite 被 BackupPC 打包移除，Makefile.in 无 check 目标（no_tests 审计见 test_package/MANIFEST.yml）
- test_package 功能验证避开 -a/-p/-o 属性保留选项（HMDFS 所有权操作受限），用内容级断言保证确定性
- 'FALLOC_FL_* 探测与可见性不一致：configure 用 <linux/falloc.h> 判定并写 HAVE_FALLOC_FL_ZERO_RANGE，rsync-bpc
  却在 rsync.h 以 #if 0 关闭同一包含；syscall.c 需自行条件包含该头，且使用点应同时校验宏真实可见（否则 OHOS musl fcntl.h
  缺 ZERO_RANGE 时编译失败）'
- 'sysacls.c（3.1.x 时代 Samba 代码）无 SUPPORT_ACLS 整体守卫，而 Makefile.in 无条件编译 lib/sysacls.o：configure
  POSIX ACL 探测失败的平台必然撞文件尾 #error；上游 rsync >= 3.2 已用整体 #ifdef SUPPORT_ACLS 修复（3.3.0
  为 line 27 / 尾行），照搬即可，acls.c/sysxattrs.c 本就有同类守卫'
- rsync-bpc 上游仅按源内构建验证过：AC_CONFIG_FILES 的 dummy 清单（configure.ac:1120）只覆盖 lib/zlib/popt，BackupPC
  新增的 backuppc/ 子目录漏配；VPATH 构建（conan build-release）下 make 以相对路径 -o backuppc/xxx.o
  输出而目录不存在，须在 make 前程序化创建对象子目录
- VPATH 构建缺 backuppc/ 对象子目录：AC_CONFIG_FILES 的 dummy 清单漏配 backuppc/，VPATH 下 clang 无法打开
  backuppc/*.o；build() 中扫描 Makefile 幂等创建对象子目录
- rsync-bpc 强制 BackupPC 四参数门禁导致普通本地同步必报 RERR_SYNTAX；新增 standalone POSIX 透传补丁：缺参时 BPC_Standalone
  标志下全部 bpc_* 包装直转 POSIX 调用
