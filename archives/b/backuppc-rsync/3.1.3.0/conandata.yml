# conandata.yml — backuppc-rsync 3.1.3.0 (rsync-bpc)

sources:
  url:
    - "https://gh-proxy.com/https://github.com/backuppc/rsync-bpc/releases/download/3.1.3.0/rsync-bpc-3.1.3.0.tar.gz"
    - "https://github.com/backuppc/rsync-bpc/releases/download/3.1.3.0/rsync-bpc-3.1.3.0.tar.gz"
  sha256: "3eeb137319b608512b2d23c54ea8b52b511db806ffbd5fa730a394431d556f3f"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess(2013-05-16) 添加 HarmonyOS/__OHOS__ 识别（旧版脚本 echo+exit 语法，E007）"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub(2013-04-24) 添加 linux-ohos 三元组支持（E007）"
    patch_type: "portability"
  - patch_file: "patches/0003-syscall-falloc-macros.patch"
    patch_description: >-
      syscall.c 补充 HAVE_LINUX_FALLOC_H 条件包含 <linux/falloc.h>：
      configure 用该头探测 FALLOC_FL_* 并把 HAVE_FALLOC_FL_ZERO_RANGE 写入
      config.h，而 rsync-bpc 在 rsync.h 里用 #if 0 禁用了同一包含，OHOS
      musl 的 fcntl.h 不提供 FALLOC_FL_ZERO_RANGE，编译期宏不可见导致
      do_punch_hole 报 undeclared identifier；同时把两处使用点改为要求宏
      真实可见，不可见时回落到源码已有的写零路径。
    patch_type: "portability"
  - patch_file: "patches/0004-sysacls-support-guard.patch"
    patch_description: >-
      lib/sysacls.c 整体包进 #ifdef SUPPORT_ACLS（与上游 rsync >= 3.2 同款）：
      Makefile.in 无条件编译 lib/sysacls.o，而该文件的 ACL 平台分支链
      （POSIX/TRU64/SUNOS/HPUX/IRIX/AIX/OSX）在无任何 ACL API 的平台会落到
      "#error No ACL functions defined for this platform!"。OHOS 上 configure
      的 POSIX ACL 探测失败（无 sys/acl.h/libacl，打印 No ACL support found），
      SUPPORT_ACLS 不定义，编译必然命中 #error；加守卫后与 acls.c/sysxattrs.c
      的既有范式一致，SUPPORT_ACLS 未定义时本文件为空翻译单元，
      SAFE_FREE/no_acl_syscall_error 仅本文件内部使用、全树无外部引用，链接安全。
    patch_type: "portability"
  - patch_file: "patches/0005-bpc-standalone-passthrough.patch"
    patch_description: >-
      rsync-bpc standalone POSIX 透传模式：上游在 parse_arguments 中强制要求
      --bpc-top-dir/--bpc-host-name/--bpc-share-name/--bpc-bkup-num 四个
      BackupPC 参数齐全（缺失即 exit_cleanup(RERR_SYNTAX)，options.c 原
      1880-1883 行），而全部文件系统访问经由 BackupPC 池 VFS 模拟层
      （do_open/flist 枚举/io 流统一走 bpc_* 包装，bpc_stat/bpc_opendir 等
      仅查 attrib cache，无任何真实路径透传），因此缺少 BackupPC 参数的
      普通本地同步在编译期之后必然死于 usage error。本补丁：
      ① bpc_sysCall_init() 检测参数不完整时置模块内 BPC_Standalone 标志并
      跳过池初始化；② 约 35 个 bpc_* 包装在标志下转发对应 POSIX 系统调用
      （open/close/read/write/lseek/ftruncate/stat/lstat/fstat/unlink/
      rmdir/mkdir/rename/symlink/readlink/link/lchown/chmod 族/utime 族/
      mknod/access/chdir/opendir/readdir/closedir/mktemp/mkstemp），池专用
      查询（file_checksum/checkFileMatch/poolFileCheck/nlinkSet/
      tmpNameFlagSet/rename_request）取中性失败返回；③ options.c 致命门
      移除并留注释。-c 校验和同步依赖 checksum.c file_checksum() 已有的
      真实内容 md5 慢路径回退（vanilla rsync 同款行为），无需重实现摘要。
      携带完整 BackupPC 参数的既有调用路径逐字节不变；lchmod 引用包进
      #ifdef HAVE_LCHMOD 以免引入不可链接符号。
    patch_type: "portability"
