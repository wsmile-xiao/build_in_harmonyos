# test_package/MANIFEST.yml — backuppc-rsync 3.1.3.0
# 上游无测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）

package: backuppc-rsync/3.1.3.0
homepage: "https://github.com/backuppc/rsync-bpc"

upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "rsync-bpc-3.1.3.0.tar.gz（GitHub 官方 release 资产，sha256=3eeb1373...6f3f）"
    finding: "顶层 213 个文件中无 testsuite/ 目录；上游 rsync 3.1.3 自带的 Perl 测试套件（testsuite/*.test + runtests.sh）被 BackupPC 打包整体移除，仅残留 testhelp/ 目录与 tls.c/t_unsafe.c/t_stub.c/testrun.c/wildtest.c 等 rsync 辅助源码"
  - path: "Makefile.in"
    finding: "全部目标为 all/install/install-all/install-strip/gen/clean/cleantests/conf/reconfigure/distclean/man/proto/proto.h-tstamp/rounding.h/rsync.1/rsyncd.conf.5/doxygen/finddead/splint 及对象规则；无 check/test 目标。CHECK_PROGS 变量（rsync_bpc/tls/getgroups/getfsdev/testrun/trimslash/t_unsafe/wildtest）仅被 clean 目标用于清理 CHECK_OBJS，未接入任何测试运行目标"
  - path: "configure.ac / configure.sh（autoconf 2.69 生成）"
    finding: "无 TESTS、check_PROGRAMS、AC_CHECK_PROGS 测试接线，无 runtests.sh 引用；AC_OUTPUT 仅生成 Makefile、lib/perms.h、popt/findme.c 等构建文件"
  - path: "上游 README/INSTALL 与 GitHub release 说明"
    finding: "仅描述 configure/make/make install 构建流程，未提供任何测试入口或 CI 测试步骤"
  - path: "Debian backuppc-rsync 打包（salsa.debian.org/debian/backuppc-rsync）"
    finding: "debian/rules 仅执行构建与安装，同样未运行任何上游测试，佐证上游无可接入的测试套件"

test_package_tests:
  - file: test_rsync_bpc.sh
    description: "消费者功能测试：真实执行 bin/rsync_bpc 完成 8 项内容级验证——--version 版本号、单文件同步(-r)、递归目录树同步、内容更新传播、校验和模式等长变更(-rc)、--delete 删除传播、--dry-run 不改写目标、--exclude 过滤（R34 合规）"
    command: "<shell> test_rsync_bpc.sh（RSYNC_BPC_BIN 指向包内 bin/rsync_bpc）"

assertion_count: 8
