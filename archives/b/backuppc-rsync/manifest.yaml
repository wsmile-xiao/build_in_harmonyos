software: backuppc-rsync
display: "backuppc-rsync (rsync-bpc)"
description: "BackupPC 定制版 rsync：带 BackupPC 池 shim 层的 rsync，与原生 rsync 协议线级兼容"
category: utility
homepage: "https://github.com/backuppc/rsync-bpc"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess(2013)/config.sub(2013) 过旧，按 E007 打 HarmonyOS 补丁（旧版脚本用 echo+exit 语法）"
    - "config.status mktemp 在 HMDFS 上权限不足，需程序化修复（E114）"
    - "shebang 路径需修复（E165）：/bin/sh → /system/bin/sh"
    - "configure 检测到 getpass 但 OHOS 无头文件声明，需 undef HAVE_GETPASS"
    - "OHOS 无 libpopt，使用 --with-included-popt 内置 popt；zlib 使用源码内置版本"
    - "上游发布包不含 testsuite、Makefile.in 无 check 目标（无上游测试可接入）"
    - "BPC 参数缺失的普通本地同步在上游被 exit_cleanup(RERR_SYNTAX) 拒绝（池 VFS 无真实文件系统透传）；portability 补丁新增 standalone POSIX 透传模式，test_package 的 8 个功能用例据此真实执行"
  common_dependencies: []

versions:
  "3.1.3.0":
    status: built
    build_date: "2026-08-25"
