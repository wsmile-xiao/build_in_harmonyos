# test_package/MANIFEST.yml — btparse 0.35 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: btparse/0.35
homepage: "https://github.com/ambs/Text-BibTeX"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check (tests/Makefile.am TESTS = read_test simple_test postprocess_test)"

# 上游实际运行的测试程序 (automake TESTS 口径, 共 3 个)
# 其余 check_PROGRAMS (macro_test/case_test/name_test/purify_test) 为上游声明的
# 交互式测试, 上游明确不列入 TESTS (tests/Makefile.am 注释), 不构成跳过。
upstream_tests:
  - file: tests/read_test.c
    source: btparse-0.35/tests/read_test.c
    description: "EOF/空串/垃圾输入/过量读取等错误路径解析测试 (CHECK 宏静态计数 13 项断言)"
    command: "./read_test"
  - file: tests/simple_test.c
    source: btparse-0.35/tests/simple_test.c
    description: "regular/macro/comment/preamble 四类条目 × 低/高层扫描 × 处理/未处理 × 单/多/整文件组合 (36 个 ok 实例)"
    command: "./simple_test"
  - file: tests/postprocess_test.c
    source: btparse-0.35/tests/postprocess_test.c
    description: "bt_postprocess_string 空白折叠参数化测试 (26 个实例: 13 组输入 × 折叠/不折叠)"
    command: "./postprocess_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_btparse_api.c
    description: "消费者测试: 解析/字段遍历/后处理/姓名格式化/宏管理 (18 项断言)"
    command: "./test_btparse_api"

# 测试断言总数 (质量评估用)
# 统计单位与取数命令 (上游 3 程序口径一致):
#   TOTAL=3: grep -cE '^PASS: (read_test|simple_test|postprocess_test)$' <make check 日志>
#   断言数 75 = read_test 13 (tests/read_test.c CHECK 宏静态计数)
#            + simple_test 36 (日志 grep -cE '( ok|ok)$', 单位=实例输出行)
#            + postprocess_test 26 (日志 grep -cE '^\[.*\] -> \[')
assertion_count: 75
