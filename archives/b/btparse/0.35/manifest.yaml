knowledge_gained:
  - "HMDFS setgid 目录属主漂移: shell uid 与文件系统属主 uid 不一致, (umask 077 && mktemp/mkdir) 产生的 0700 目录属主类与组类均无写权, 连属主自己都写不进; 2005 年代 autotools 的 config.guess cg* 临时目录与 configure confstat* 临时目录都踩中, umask 077→022 修复。知识 E011/E129/E136/E206 已完整覆盖。reference: knowledge/doc/E206.md"
  - "2005 年代 config.guess/config.sub 早于 aarch64 与 HarmonyOS: patch-autotools-ohos.pl 面向新版文件, 对 2005 版仅部分命中(config.guess 注入分支为新版 GUESS= 赋值风格, 2005 版需 echo+exit 直接输出); 正确做法是分支内 echo 三元组并 exit, config.sub 用参数解析后的早退 case 接受 aarch64-*-linux*/ohos。知识 E007/E072 已覆盖三元组部分, 2005 版输出风格差异为本包新增细节。reference: knowledge/doc/E007.md"
  - "上游 PCCTS 解析器产物 (bibtex.c/scan.c 等) 随 tarball 发布且与语法文件 mtime 相同, make 不会触发 antlr/dlg 重建, 设备无需安装 PCCTS 工具。reference: archives/b/btparse/0.35/notes.md"
  - "上游 tests/Makefile.am 中 macro_test/case_test/name_test/purify_test 为上游明确声明的交互式测试, 不在 TESTS 中 (上游注释原文 'which is why they're not listed in TESTS below'), 上游默认口径即不执行, 不构成跳过或漏报。reference: archives/b/btparse/0.35/test_package/MANIFEST.yml"
patch_generation:
