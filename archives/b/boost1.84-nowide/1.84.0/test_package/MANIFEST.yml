package: boost1.84-nowide/1.84.0
homepage: https://www.boost.org/

# 上游测试说明
# Boost.Nowide 1.84.0 自带测试位于 libs/nowide/test（自带 test.hpp 框架，
# 非 boost.test）。上游 B2 构建系统在 OHOS 不兼容（E068，Boost.Build
# SHELL 执行机制失败），无法用 b2 跑测试。本适配在配方 build() 中手动
# 编译上游测试源文件（clang++ -std=c++17 -stdlib=libc++，链接
# libboost_nowide.a）并真实运行，统计通过率写入 upstream-tests-report.txt。
#
# 上游 POSIX 侧可运行 run 目标清单（libs/nowide/test/Jamfile.v2）：
#   单文件：test_codecvt / test_convert / test_env / test_stackstring /
#           test_stat / test_system(NARROW) / test_stdio / test_traits
#           （test_traits 默认变体测 std::filesystem::path，C++17 自带）
#   带 file_test_helpers：test_filebuf / test_ifstream / test_ofstream /
#           test_fstream / test_fstream_special / test_iostream
#   不在此列：test_fs / test_traits 的 BFS_PATH 变体（需 boost_filesystem
#   编译库，本组件包不含）；test_system 宽字符变体与 *_internal 变体
#   （Windows-only）；test_iostream_interactive（交互式）/passthrough
#   （需 CMake stdin/stdout 管道驱动）。
# 本地实测：14 项，13 通过 / 0 失败 / 1 已知平台差异。
#   test_stdio 失败原因：断言 std::fputs 到只读流应返回负值——POSIX 标准
#   未定义该行为，musl libc 返回 0（glibc/MSVC 返回负值）。属平台 libc
#   语义差异，非 nowide 功能缺陷（该测试中 freopen/fgets 读回内容断言
#   全部通过）。如实记录（配方 diff_tag 豁免机制，未修改上游测试）。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/nowide/test/test_codecvt.cpp"
    description: "codecvt facet 测试"
    command: "clang++ test_codecvt.cpp -lboost_nowide && ./a.out"
    result: passed
  - file: "libs/nowide/test/test_convert.cpp"
    description: "UTF-8 ↔ 宽字符转换测试（widen/narrow/convert_buffer）"
    command: "clang++ test_convert.cpp -lboost_nowide && ./a.out"
    result: passed
  - file: "libs/nowide/test/test_env.cpp"
    description: "环境变量读写测试（nowide::getenv/setenv/putenv）"
    command: "clang++ test_env.cpp -lboost_nowide && ./a.out"
    result: passed
  - file: "libs/nowide/test/test_stackstring.cpp"
    description: "栈上宽字符串转换测试（basic_stackstring）"
    command: "clang++ test_stackstring.cpp -lboost_nowide && ./a.out"
    result: passed
  - file: "libs/nowide/test/test_stat.cpp"
    description: "stat 文件状态测试"
    command: "clang++ test_stat.cpp -lboost_nowide && ./a.out"
    result: passed
  - file: "libs/nowide/test/test_system.cpp"
    description: "system() 命令执行测试（NARROW 变体）"
    command: "clang++ test_system.cpp -DBOOST_NOWIDE_TEST_USE_NARROW=1 -lboost_nowide && ./a.out"
    result: passed
  - file: "libs/nowide/test/test_filebuf.cpp"
    description: "filebuf 文件缓冲测试（含 file_test_helpers）"
    command: "clang++ test_filebuf.cpp file_test_helpers.cpp -lboost_nowide && ./a.out"
    result: passed
  - file: "libs/nowide/test/test_ifstream.cpp"
    description: "ifstream 读文件测试"
    command: "clang++ test_ifstream.cpp file_test_helpers.cpp -lboost_nowide && ./a.out"
    result: passed
  - file: "libs/nowide/test/test_ofstream.cpp"
    description: "ofstream 写文件测试"
    command: "clang++ test_ofstream.cpp file_test_helpers.cpp -lboost_nowide && ./a.out"
    result: passed
  - file: "libs/nowide/test/test_fstream.cpp"
    description: "fstream 读写测试"
    command: "clang++ test_fstream.cpp file_test_helpers.cpp -lboost_nowide && ./a.out"
    result: passed
  - file: "libs/nowide/test/test_fstream_special.cpp"
    description: "fstream 特殊场景测试（关闭后复用等）"
    command: "clang++ test_fstream_special.cpp file_test_helpers.cpp -lboost_nowide && ./a.out"
    result: passed
  - file: "libs/nowide/test/test_iostream.cpp"
    description: "iostream 标准流重定向测试"
    command: "clang++ test_iostream.cpp file_test_helpers.cpp -lboost_nowide && ./a.out"
    result: passed
  - file: "libs/nowide/test/test_stdio.cpp"
    description: "stdio 封装测试（失败：musl 对只读流 fputs 返回 0 非 POSIX 未定义行为差异，其余断言通过）"
    command: "clang++ test_stdio.cpp -lboost_nowide && ./a.out"
    result: failed
  - file: "libs/nowide/test/test_traits.cpp"
    description: "is_path/is_string_container 类型特性测试（std::filesystem::path 默认变体，不依赖 boost.filesystem 编译库）"
    command: "clang++ test_traits.cpp -lboost_nowide && ./a.out"
    result: passed

test_package_tests:
  - file: test_boost_nowide.cpp
    description: "boost nowide 下游消费冒烟（convert 往返 + fstream 写读 + nowide::cout + cstdio 清理）"
    command: "ctest boost1_84_nowide_test"

assertion_count: 8  # test_package 实际断言数（convert 2 + ofstream/ifstream 4 + cout 1 + remove 1）；上游测试 14 项见 upstream_tests 列表
