# test_package/MANIFEST.yml — bork 0.14.0
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: bork/0.14.0
homepage: "https://bork.sh/"

# 上游测试：bork 是纯 bash 配置管理工具，上游测试为 38 个 .bats 文件 / 366 个
# @test 断言（bats 框架）。**已实测全量通过**（2026-09-11）：vendoring bats-core
# 后 `bats test/` 实跑 → **366 通过 / 0 失败（366/366 = 100%）**。
#
# 关键更正：旧声明称「OHOS 无 bats + 测试依赖系统包管理器（brew/apt/dnf/npm/pip/
# sudo）故全部无法运行（0/366）」——**该结论不成立**。实测：上游测试用
# `respond_to` 机制做命令桩替换（如 `respond_to "brew list --formula"
# "cat $fixtures/brew-list.txt"`），并不真调包管理器；test/fixtures/ 下 33 个
# 录制输出即为其数据源，因此绝大多数用例可在 OHOS 真实运行。
#
# 实测环境：需三个 shim 才能让全部用例通过（shim 不修改上游测试源码，
# 仅为补齐 OHOS 与 Linux 的行为差异）
#   ① uname shim：helpers.sh 的 md5cmd 只认 Linux/Darwin/FreeBSD，而 OHOS
#      的 `uname -s` 返回 HarmonyOS → 返回 1，在 bats 的 `set -e` 下致
#      `helpers.sh` 加载失败（366 全灭）。伪装 `uname -s` 为 Linux 即恢复。
#   ② egrep shim：OHOS grep 对 `egrep` 打印 "egrep is obsolescent" 警告，
#      污染 bats 的 `[[ -z ${output} ]]` 断言 → 用 `grep -E` 包装消除。
#   ③ install shim：OHOS 无 coreutils `install`（`command -v install` 为空），
#      bork 的 directory 类型调用该命令得 127 → 转发到 `busybox install`
#      （busybox 有 install applet，支持 -d/-o/-g/-m；剔除其不支持的 -C）。
upstream_check_command: "vendoring bats-core 后执行：BORK_SOURCE_DIR=<src> PATH=<shim>/uname:<shim>/egrep:<shim>/install:$PATH bats test/"
upstream_test_in_build: false
upstream_test_command: "bats test/（需 bats-core + uname/egrep/install 三个 shim）"
upstream_test_result: "366/366 PASS (100%)"

# test_package 消费者测试（R34 真实产物校验：bork 主脚本存在 + bash 语法 + lib 模块）
# 审查修复（2026-09-11）：① 模块安装路径由 share/bork/ 改为 <pkg>/lib/——bork 按
# BASH_SOURCE 推导 BORK_SOURCE_DIR=<pkg> 并 source <pkg>/lib/{helpers,declarations,
# support}/*.sh，不读任何环境变量覆盖，旧布局交付包实际不可用；② 语法校验由
# /system/bin/sh -n 改为 bash -n（bork 是 bash 脚本，sh 校验会误通过/误失败）；
# ③ 改为实际执行 bork version 并断言输出版本号（非仅 rc=0）；④ 找不到 bash 时如实
# 失败，不再退回静态校验造成假成功。
test_package_tests:
  - file: test_bork.py
    description: "断言 bin/bork 存在 + bash -n 语法可解析 + lib/{declarations,helpers,support} 已打包且含 .sh + bash 实际执行 bork version 并断言输出版本号"
    command: "conan create 内自动执行（test() 用 python3 运行）"
