# conandata.yml — bork 0.14.0
# bork 是 Bash 配置管理工具（"the Bash-Operated Reconciling Kludge"），
# 纯 bash 脚本（bin/bork + lib/ 模块）。上游 borksh/bork（mattly/bork 的活跃 fork）。
# 用 Git.clone 下载（git 独立 ssl，CI Python 无 SSL 模块时可下载，E372 方案）。
# sources 段为 G1 完整性要求（git 源以 url+commit+type=git 提供实际 clone 参数）。
# 审查修复（2026-09-10）：去除手工 ghfast.top 镜像前缀（R39——镜像回退由 CI
# 自动追加），url/git_url 均改官方 URL，与 manifest.yaml 一致。
sources:
  url: "https://github.com/borksh/bork.git"
  ref: "v0.14.0"
  type: "git"

git_url: "https://github.com/borksh/bork.git"
git_branch: "v0.14.0"

patches: {}
