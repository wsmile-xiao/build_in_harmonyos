# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "bork 是 Bash 配置管理工具（bash DSL 做声明式配置断言），纯 bash 脚本（bin/bork + lib/declarations/helpers/support 模块），无编译无 conan 库依赖（运行时依赖 bash 3.2 + sed/awk/grep）"
- "Git.clone 浅克隆指定 tag 用 --branch（--depth 1 --branch v0.14.0）即可，不 checkout 臆造固定 commit（浅克隆只有 HEAD，固定 commit 需深克隆，臆造 commit 报 unable to read tree）"
- "纯脚本包 conanfile.py 需 export_sources()/apply_conandata_patches（G1 完整性要求）；test_package 用 python3 + 路径单引号（绕开工作目录括号的 sh 解析问题）"
- "**bork 上游 bats 测试可在 OHOS 全量通过（366/366 = 100%）**：上游测试用 respond_to 机制做命令桩替换（配 test/fixtures/ 录制输出），并不真调 brew/apt/npm/pip 等包管理器——故旧结论「依赖系统包管理器不可运行」不成立；需三个 shim 恢复运行：① uname shim（helpers.sh 的 md5cmd 只认 Linux/Darwin/FreeBSD，OHOS uname -s=HarmonyOS 返回 1，在 bats set -e 下致 helpers.sh 加载失败 → 伪装 -s 为 Linux）② egrep shim（OHOS grep 对 egrep 打印 obsolescent 警告污染 output 断言 → 用 grep -E 包装）③ install shim（OHOS 无 coreutils install → 转发 busybox install，剔除其不支持的 -C）"
- "bork 模块加载路径：按 BASH_SOURCE 推导 BORK_SOURCE_DIR=bin/bork 的上一级并 source <pkg>/lib/{helpers,declarations,support}/*.sh，不读任何环境变量覆盖 → package() 必须装到 <pkg>/lib/（旧实现装 share/bork/ 致交付包不可用）"
- "bork 的 `--help` 走上游 case 兜底分支打印用法后 exit 1（设计行为）；冒烟应改用 `bork version`（exit 0 并输出 bork 0.14.0）"
