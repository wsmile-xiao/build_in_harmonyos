# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.1"

# 软件名
software: bitmapplusplus

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: headeronly

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/baderouaich/BitmapPlusPlus"

  # 源码校验和
  sha256: "dd1ca714c0b1a99f7738f3e340016982409987388348e1378e1b06bc6eaa3c15"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | headeronly
  system: headeronly

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "header-only 模板 package() 从源码根复制 *.hpp 对位于非 include/ 子目录（lib/include/）的头文件漏复制 → include/ 为空；package() src 应指向实际子目录（见 DRAFT-bitmapplusplus-1.1.1-header-only-subdir-header-copy）"
- "header-only 库 package_type 应使用 header-library（E321/E322 同款），避免 'Package type is library but no shared option declared'"
