# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 实测记录 (2026-09-25, pc1-38):
#   header-only 库，无编译产物二进制与独立上游测试二进制；
#   上游以 examples/ 下的 8 个示例程序作为可运行验证入口
#   （examples/CMakeLists.txt add_test 注册：bernoulli_dist、chess_board、
#   draw_primitives、polymorphic_shapes、read_bitmap、rotation、
#   variant_shapes、write_bitmap），示例需 ROOT_DIR/BIN_DIR 宏；
#   integration_tests/{cpm,fetchcontent} 为 CPM/FetchContent 集成演示，
#   非独立用例。test_package 消费者测试覆盖真实公开 API 断言。

package: bitmapplusplus/1.1.1
homepage: "https://github.com/baderouaich/BitmapPlusPlus"

# 上游测试命令 (header-only，示例由 BPP_BUILD_EXAMPLES=ON 时 ctest 注册)
upstream_check_command: "cmake -DBPP_BUILD_EXAMPLES=ON .. && ctest"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (10 个示例程序，见 notes.md 台账；全部为样例程序，非独立断言用例)
upstream_tests:
  - file: examples/bernoulli_dist.cpp
    source: bitmapplusplus-1.1.1/examples/bernoulli_dist.cpp
    description: "示例: 伯努利分布噪点图生成 (样例程序，非独立断言用例)"
    command: "./bernoulli_dist"
  - file: examples/chess_board.cpp
    source: bitmapplusplus-1.1.1/examples/chess_board.cpp
    description: "示例: 棋盘图生成 (样例程序，非独立断言用例)"
    command: "./chess_board"
  - file: examples/draw_primitives.cpp
    source: bitmapplusplus-1.1.1/examples/draw_primitives.cpp
    description: "示例: 图元绘制 (样例程序，非独立断言用例)"
    command: "./draw_primitives"
  - file: examples/julia.cpp
    source: bitmapplusplus-1.1.1/examples/julia.cpp
    description: "示例: Julia 分形图生成 (样例程序，非独立断言用例)"
    command: "./julia"
  - file: examples/mandelbrot.cpp
    source: bitmapplusplus-1.1.1/examples/mandelbrot.cpp
    description: "示例: Mandelbrot 分形图生成 (样例程序，非独立断言用例)"
    command: "./mandelbrot"
  - file: examples/polymorphic_shapes.cpp
    source: bitmapplusplus-1.1.1/examples/polymorphic_shapes.cpp
    description: "示例: 多态形状绘制 (样例程序，非独立断言用例)"
    command: "./polymorphic_shapes"
  - file: examples/read_bitmap.cpp
    source: bitmapplusplus-1.1.1/examples/read_bitmap.cpp
    description: "示例: 读取 BMP 并修改 (样例程序，非独立断言用例)"
    command: "./read_bitmap"
  - file: examples/rotation.cpp
    source: bitmapplusplus-1.1.1/examples/rotation.cpp
    description: "示例: 图片旋转 (样例程序，非独立断言用例)"
    command: "./rotation"
  - file: examples/variant_shapes.cpp
    source: bitmapplusplus-1.1.1/examples/variant_shapes.cpp
    description: "示例: 变体形状绘制 (样例程序，非独立断言用例)"
    command: "./variant_shapes"
  - file: examples/write_bitmap.cpp
    source: bitmapplusplus-1.1.1/examples/write_bitmap.cpp
    description: "示例: 生成 BMP (样例程序，非独立断言用例)"
    command: "./write_bitmap"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_bitmapplusplus.cpp
    description: "消费者测试: 构造/clear/索引/save/load 回环/迭代器/clear 真实 API 断言 (11 组)"
    command: "./test_bitmapplusplus"
  - file: test_bitmapplusplus_ohos.cpp
    description: "鸿蒙特有测试: 专用临时目录 + 24bpp 渐变 BMP 全量回环 + 坏文件异常路径 (4 组)"
    command: "./test_bitmapplusplus_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15