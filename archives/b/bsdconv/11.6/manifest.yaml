knowledge_gained:
  - "bsdconv 使用纯 Make 构建（无 configure），uname -s 在 OHOS 返回 HarmonyOS 而非 Linux，Makefile 的 -ldl 分支不触发；OHOS libc 原生提供 dlopen/dlsym/dlclose，无需 -ldl"
  - "上游 bsdconv_unpack 的 VLA phase_off[i+1] 存在 off-by-one（strsep 返回 NULL 时写 phase_off[phasen+1]），3 阶段转换在 clang 15 下 EINVAL，需 phase_off[i+2]"
  - "bsdconv 运行时通过 BSDCONV_PATH 环境变量或编译宏定位 share/bsdconv 模块目录"
  - "上游 Makefile 链接 libbsdconv 时未加 -Wl,-soname，导致共享库缺 DT_SONAME（CI L5a 门禁）；需加 -Wl,-soname,libbsdconv.so.11"
