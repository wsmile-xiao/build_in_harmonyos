# test_package/MANIFEST.yml — bsdconv 11.6 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bsdconv/11.6
homepage: "https://github.com/buganini/bsdconv"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（R51 清点：上游共 2 个测试入口）
upstream_tests:
  - file: testsuite/api.c
    source: bsdconv-11.6/testsuite/api.c
    description: "官方 C API 测试：bsdconv_pack / insert_phase / replace_phase / replace_codec / insert_codec 断言"
    command: "./testsuite/api"
  - file: testsuite/conversion.py
    source: bsdconv-11.6/testsuite/conversion.py
    description: "Python 转换/过滤功能测试（依赖 python-bsdconv 绑定，Python2 语法）"
    command: "python testsuite/conversion.py"

# test_package 中自带的测试（消费者视角验证，实质调用被测包 API/二进制）
test_package_tests:
  - file: test.c
    description: "消费者测试：3 阶段 create 回归（上游 VLA off-by-one）+ 上游 api.c 全套断言 + bsdconv 二进制端到端转换验证"
    command: "./test_bsdconv"

# 测试断言总数（test_package test.c 实际 check 断言 9 项：上游 api.c 的
# pack/insert_phase/replace_phase/replace_codec/insert_codec 5 组 +
# 自研 4 项：3-phase create 回归、create utf-8,3f、2 个二进制端到端）
assertion_count: 9
