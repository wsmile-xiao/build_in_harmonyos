# conandata.yml — bsdconv 11.6
sources:
  url: "https://github.com/buganini/bsdconv/archive/refs/tags/11.6.tar.gz"
  sha256: "e856e24474deb3731ac059a96af0078ba951895f2cb3b31f125148a29cc32b70"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "add -Wl,-soname when linking libbsdconv.so so the shared library carries a DT_SONAME (L5a gate requirement); upstream Makefile omitted SONAME"
    patch_type: "portability"
  - patch_file: "patches/0002-src-libbsdconv.c.patch"
    patch_description: "fix off-by-one VLA in bsdconv_unpack: phase_off needs phasen+2 slots because while((phase_off[i]=strsep(...))!=NULL) writes phase_off[phasen+1]=NULL when strsep() returns NULL; without the fix 3-phase conversions (e.g. ASCII:COUNT:ASCII) fail with EINVAL on clang 15 / OHOS"
    patch_type: "portability"
