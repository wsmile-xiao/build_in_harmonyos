# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: brynet/1.12.2
homepage: "https://github.com/IronsDu/brynet"

# 上游测试枚举命令（本包无 configure 脚本，直接编译 tests/ 下 9 个可执行文件）
upstream_check_command: "ctest -N (9 个 add_test 注册项)"

# conanfile.py build() 方法中是否已集成上游测试（header-only，无 build）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（9 个独立可执行文件，内置 catch.hpp；实测全部通过）
# 独立用例口径：用户测试源（tests/test_*.cpp）内独立 TEST_CASE 共 10 个，
# 断言 126 条：array 16 / buffer 16 / endian 6 / http 4 / packet 13 /
# stack 54 / sync_connect 9 / timer 7 / wait_group 1。
# 框架文件 catch.hpp（单头测试框架）与 SECTION 子节不计入独立用例。
upstream_tests:
  - file: tests/test_array.cpp
    source: brynet-1.12.2/tests/test_array.cpp
    description: "Array 动态数组单元测试（1 TEST_CASE, 16 断言）"
    command: "./test_array"
  - file: tests/test_buffer.cpp
    source: brynet-1.12.2/tests/test_buffer.cpp
    description: "Buffer 缓冲区单元测试（1 TEST_CASE, 16 断言）"
    command: "./test_buffer"
  - file: tests/test_endian.cpp
    source: brynet-1.12.2/tests/test_endian.cpp
    description: "Endian 字节序转换测试（1 TEST_CASE, 6 断言）"
    command: "./test_endian"
  - file: tests/test_http.cpp
    source: brynet-1.12.2/tests/test_http.cpp
    description: "HTTP 服务端解析测试（1 TEST_CASE, 4 断言）"
    command: "./test_http"
  - file: tests/test_packet.cpp
    source: brynet-1.12.2/tests/test_packet.cpp
    description: "Packet 封包单元测试（1 TEST_CASE, 13 断言）"
    command: "./test_packet"
  - file: tests/test_stack.cpp
    source: brynet-1.12.2/tests/test_stack.cpp
    description: "Stack 栈单元测试（1 TEST_CASE, 54 断言）"
    command: "./test_stack"
  - file: tests/test_sync_connect.cpp
    source: brynet-1.12.2/tests/test_sync_connect.cpp
    description: "同步连接/监听测试（1 TEST_CASE, 9 断言）"
    command: "./test_sync_connect"
  - file: tests/test_timer.cpp
    source: brynet-1.12.2/tests/test_timer.cpp
    description: "异步定时器测试（2 TEST_CASE, 7 断言）"
    command: "./test_timer"
  - file: tests/test_wait_group.cpp
    source: brynet-1.12.2/tests/test_wait_group.cpp
    description: "WaitGroup 同步原语测试（1 TEST_CASE, 1 断言）"
    command: "./test_wait_group"
  - file: tests/catch.hpp
    source: brynet-1.12.2/tests/catch.hpp
    description: "内置单头测试框架（框架文件，非独立用例）"
    command: ""

# test_package 中自带的测试 (消费者视角验证 + HarmonyOS 专项用例)
test_package_tests:
  - file: test_brynet_ohos.cpp
    description: "HarmonyOS 专项：回环 TCP echo 服务+客户端收发验证、Endian/WaitGroup 头文件包含验证（真实调用 brynet API）"
    command: "./test_brynet_ohos"

# 测试断言总数 (上游 126 + 专项用例 2 组)
assertion_count: 128