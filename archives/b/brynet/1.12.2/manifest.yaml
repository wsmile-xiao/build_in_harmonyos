# 版本级 manifest — brynet 1.12.2

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.12.2"

# 软件名
software: "brynet"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag）
  url: "https://github.com/IronsDu/brynet/archive/refs/tags/v1.12.2.tar.gz"

  # 源码校验和（已实测）
  sha256: "b8b740cae39804d1e7037866046321065856c0ea9f565d26f67aeccc7ccd3d51"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）— brynet 为 header-only，无强制依赖
  dependencies: []
  # 可选: openssl（未安装时自动禁用 BRYNET_USE_OPENSSL，非必需）

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（knowledge-reuse 判定：候选 1 W3 基线噪声 → reuse_existing
# DRAFT-libfort/libpopcnt；候选 2 header-only G1 → reuse_existing E257/E321/E322；
# 候选 3 库特征 → path_a_no_knowledge；无新增知识，故不登记新条目，台账见
# reports/knowledge-candidate-ledger.md）
knowledge_gained: []