# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "bsdmake 源码依赖 FreeBSD 专有 <sys/sysctl.h> 与 sysctlbyname()（pc98 检测），OHOS 无 sysctl(3)，需以 #ifdef __FreeBSD__ 守卫 (knowledge_ref: E429-draft)"
  - "FreeBSD sys/cdefs.h 宏 __FBSDID/__dead2 在 OHOS 缺失，需编译参数 -D'__FBSDID(x)=' 与 -D'__dead2=__attribute__((__noreturn__))' (knowledge_ref: E429-draft)"
  - "OHOS libc 无 BSD errc()，等价替换为 errno = EAGAIN + err() (knowledge_ref: E429-draft)"
  - "main() 中 machine 变量依赖 getenv 赋值，若整块加平台守卫会导致未初始化 UB；只守卫 sysctlbyname 调用本体 (knowledge_ref: E429-draft)"

