# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: bsdmake/24
homepage: "https://github.com/apple-oss-distributions/bsdmake"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 bsdmake-24 源码包无自带测试套件（无 unit-tests/regress/autotests 目录），
# 仅含 mk/ 系统规则文件与 PSD.doc 文档。无上游测试可运行。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 针对上游无测试的缺口，编写 4 组功能断言：
#   1. 变量展开 + 规则执行（echo 输出断言）
#   2. .PHONY 依赖图（多目标顺序断言）
#   3. 错误传播（不存在目标须失败）
#   4. 打包系统规则可用性（MAKESYSPATH/sys.mk 存在断言）
test_package_tests:
  - file: test.sh
    description: "运行打包的 bsdmake 对生成 Makefile 执行 4 组功能断言（变量展开/依赖图/错误传播/系统规则）"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
