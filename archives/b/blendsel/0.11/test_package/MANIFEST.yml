# test_package/MANIFEST.yml — blendsel 0.11
# 上游测试声明文件（CI L0e 门禁强制要求）

package: blendsel/0.11
homepage: "https://salsa.debian.org/installer-team/blendsel"

# blendsel 无上游回归测试套件：tests/ 是运行期 task filter hooks
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# 上游 N=0 清点证据（对 upstream 源码目录实质清点，非推测）：
upstream_inventory_evidence:
  - command: "find <src>/tests -type f"
    result: "仅 tests/debconf、tests/new-install 两个文件，无其他测试文件"
  - command: "cat <src>/tests/debconf <src>/tests/new-install"
    result: "/bin/sh 运行期 hook：读 DEBIAN_HAS_FRONTEND/DEBCONF_READFD/NEW_INSTALL 并按参数 return exit 0-3，表达展示/安装语义；无断言、无 runner"
  - command: "grep -n testdir <src>/blendsel.pl"
    result: "13: my $testdir=/usr/lib/blendsel/tests（补丁后随前缀推导）；463-464: -x $testdir/$test 时 system() 调用 hooks（Test-PROGRAM: ARGUMENTS 字段驱动），非自动化测试"
  - command: "grep -nE '^test|^check' <src>/Makefile"
    result: "无匹配（退出码 1）；Makefile 目标仅 all/%.o/po-build_stamp/updatepo/install/install-data/clean，无 test/check target"
  - command: "grep -rln Test::More <src>/tests"
    result: "无匹配；无 Perl 测试框架（Test::More 等）用例"

# Debian 生态依赖说明：install/remove 执行链走 apt-get/dpkg，UI 交互走
# debconf（blendsel-debconf source /usr/share/debconf/confmodule），OHOS
# 无这些子系统 → 上游 tests/ hooks 与交互路径 runnable=0（与 Debian 生态
# 绑定，非本包缺陷）。test_package 覆盖纯 perl 数据链实质验证。
external_integration_note: >-
  blendsel is a Debian-native Perl CLI whose install/remove commands drive
  apt-get/dpkg and whose UI delegates to debconf; none of those subsystems
  exist on OHOS, so those paths cannot run (runnable=0, ecosystem-bound,
  upstream behavior is identical). The pure-Perl data path is fully verified
  by 8 independent assertions executed in the conanrun environment:
  bin/blendsel shebang portability, full Debian-equivalent layout,
  debian-tasks.desc data readability, perl -c syntax under the optional
  Locale::gettext fallback patch, interpreter provenance and version from
  conan perl/5.42.2, --task-packages prefix derivation (prints
  task-med-blend, exit 0), and usage on unknown options (non-zero exit).

test_package_tests:
  - name: blendsel_ohos_cli_smoke
    file: test_blendsel.py
    description: "8 独立断言（OHOS conanrun 实跑）：shebang / 包布局 / desc 数据 / perl -c / perl 来源 / perl 版本 / --task-packages 数据链 / usage；逐项 PASS 计数，任一失败非零退出"
    command: "python3 test_blendsel.py <pkg> <pkg>/bin/blendsel <perl_pkg>/bin/perl <perl_pkg>"
    assertion_count: 8

assertion_count: 8
