software: blendsel
# blendsel 0.11 — 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0 / Conan v3 迁移指南

version: "0.11"
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"

# 构建系统标识
build_system: custom

source:
  url: "https://snapshot-cloudflare.debian.org/archive/debian/20260110T225955Z/pool/main/b/blendsel/blendsel_0.11.tar.xz"
  sha256: "45e2d4d7aae166d2561f7ef2259670bd19e4be188a46ce87020369ba798b0786"
  tar_format: tar.xz
  notes: "Debian native 源包（无独立上游，打包仓库 salsa.debian.org/installer-team/blendsel）；conandata.yml 以 snapshot-cloudflare.debian.org（官方 snapshot 的 Cloudflare CDN 前端）为主源 + snapshot.debian.org 兜底（R39；CI worker 对源站下载超时）"

build:
  system: make
  notes: >-
    纯 Perl 脚本包（tasksel fork 的 blends 安装选择器），无 C/C++ 编译：
    运行时依赖 conan perl/5.42.2（ohpcd 预编译制品，OHOS arm64）；
    补丁 0001 最小改动（env shebang / Locale::gettext 可选加载 + 英文回退 /
    数据路径随 $0 前缀推导，Debian /usr 布局语义不变）；
    debian-tasks.desc 由 makedesc.pl（纯 perl）从 tasks/ 生成，
    man 页由 perl 自带 pod2man 生成并 gzip。

patches_applied:
  - "patches/0001-blendsel-portable-env-gettext-prefix.patch"

dependencies:
  - perl/5.42.2

test:
  upstream_cases: 0
  upstream_suite: "无上游回归测试：tests/{debconf,new-install} 是运行期 task filter hooks（blendsel.pl 按 Test-* 字段调用，上游 Makefile 无 test/check target）"
  runnable: 0
  runnable_note: >-
    install/remove 执行链走 apt-get/dpkg、UI 走 debconf（/usr/share/debconf/
    confmodule），OHOS 无这些 Debian 子系统，交互/安装路径不可运行
    （生态绑定，与上游 Debian 行为同构）；纯 perl 数据链可用。
  pass_rate: "0/0（无上游测试可搬移）；test_package 8 断言全过（shebang / 包布局 / desc 数据 / perl -c / perl 来源 / perl 版本 / --task-packages 数据链 / usage）"
  consumer_test: "test_package 在 conanrun 环境实跑 test_blendsel.py 的 8 项独立断言（含 bin/blendsel --task-packages=med-blend 输出 task-med-blend、未知选项 usage 非零退出、perl 解释器来自 conan perl/5.42.2）"

knowledge_gained:
  - "blendsel/tasksel 系为 Debian native 纯 Perl 包：无 autotools，Makefile 仅安装脚本/数据/pod2man man"
  - "OHOS 自带 perl 5.42（/data/service/hnp/bin/perl），且 ohpcd 有 conan perl/5.42.2 预编译制品（abcselect/1.5 先例同款）"
  - "Locale::gettext（Debian liblocale-gettext-perl）是 XS 模块，纯 perl core 无 → 脚本包需可选加载 + 英文回退补丁（等价 C locale）"
  - "脚本硬编码 /usr 数据路径 → 随 $0 的 bin/.. 前缀推导可 relocation-free（保留 Debian 布局默认）"
  - "makedesc.pl 生成 desc 数据依赖 apt-cache 仅用于 lint（缺失自动降级）；doincludes.pl #include 展开本包 tasks 未使用"
  - "系统 perl 无 /usr/bin/perl 路径 → shebang 改 #!/usr/bin/env perl（E049 shebang-portable-fix 同类）"

knowledge_ref:
  - "E049 (shebang-portable-fix)：解释器硬编码路径在非标准前缀/非 Debian 平台的可移植修复"
  - "abcselect/1.5：纯 Perl 脚本工具 conan 配方蓝本（perl 依赖 + 冒烟 test_package）"
