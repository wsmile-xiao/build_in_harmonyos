# 软件级 manifest — blendsel
# 遵循 ARCHIVE-SPEC v2.0

software: blendsel
display: "blendsel"
description: "Tool for selecting blends for installation on Debian systems"
category: utility
homepage: "https://salsa.debian.org/installer-team/blendsel"
license: GPL-2.0-or-later

# Debian native 源包（无独立上游，仓库即 salsa 打包仓库）：
# 纯 Perl CLI（tasksel fork）无 C/C++，按脚本包范式以 perl 解释器依赖交付
build_system: make

ohos_adaptation:
  key_points:
    - "纯 Perl 脚本包：运行时依赖 conan perl/5.42.2（ohpcd 预编译制品），无交叉编译"
    - "补丁 0001：env shebang / Locale::gettext 可选加载+英文回退 / 数据路径随 \$0 前缀推导"
    - "debian-tasks.desc 由 makedesc.pl 构建期生成；man 由 pod2man 生成"
    - "install/remove 与 debconf UI 依赖 Debian apt/dpkg/debconf 生态（OHOS 无），runnable=0；数据链命令可运行"
  common_dependencies:
    - perl

versions:
  "0.11":
    status: built
    build_date: "2026-09-07"
    archive_path: "0.11"
    requires_manual_verification: false
