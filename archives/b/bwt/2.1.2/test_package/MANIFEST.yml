# test_package/MANIFEST.yml
# Upstream test declaration for bwt/2.1.2

package: bwt/2.1.2
homepage: "https://github.com/MichaelDipperstein/bwt"

# Upstream test command
upstream_check_command: "make test_this.sh"
upstream_test_in_build: true
upstream_test_command: "./test_this.sh"

# Upstream tests
upstream_tests:
  - file: test_this.sh
    source: bwt-2.1.2/test_this.sh
    description: "Upstream BWT encode/decode roundtrip test"
    command: "./test_this.sh"
  - file: sample.c
    source: bwt-2.1.2/sample.c
    description: "BWT library demo program (encode/decode with/without MTF)"
    command: "./sample"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test.c
    description: "Consumer test: BWT roundtrip encode/decode with/without MTF"
    command: "./test_bwt"

# Test assertion count
assertion_count: 4