# test_package/MANIFEST.yml — boost-te 1.0.0
# 上游官方测试声明文件（CI L0e 强制要求）

package: boost-te/1.0.0
homepage: "https://github.com/boost-ext/te"

# 上游测试命令（test/CMakeLists.txt: test(te) → 生成 te 可执行并运行）
upstream_check_command: "cmake -B build && cmake --build build --target te && ./build/te"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成：boost-te 为 header-only 库，配方无编译步骤（header copy）；
# 上游测试在下方台账+任务报告中全量枚举并实际运行，test_package 含消费者测试 + OHOS 专项测试。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（test/te.cpp，自定义轻量框架 test/common/test.hpp，
# 每个 `test name = []{...}` 为独立用例，共 28 个）
upstream_tests:
  - file: test/te.cpp
    source: boost-te-1.0.0/test/te.cpp
    description: "上游全部 28 个独立 TE 类型擦除用例（映射/调用擦除/宏/存储/概念擦除等），单文件单二进制度"
    command: "./build/te"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试 — 包含 boost/te.hpp 并真实调用 te::poly 隐式构造 + te::call 类型擦除 API（3 组断言：Square/Circle/常量引用传递）"
    command: "./test_boost_te"
  - file: ohos_special_test.cpp
    description: "HarmonyOS 专项测试 — __OHOS__ 平台宏 static_assert + te 跨 int64 类型擦除调用验证（R6 实质逻辑）"
    command: "./test_ohos_special"

# 测试断言总数（上游 28 用例中约 90+ expect/static_assert + test_package 6 组断言，实测）
assertion_count: ~100