knowledge_gained:
  - "header-only 配方 package() 中 copy() 的 src/dst 必须用 os.path.join 绝对路径，相对 dst 会被解析到 build 目录导致包内缺 include、test_package 报 Imported target includes non-existent path（草稿 DRAFT-boost-te-1.0.0-headeronly-copy-abs-path-commit-incremental）"
  - "te v1.0.0 的 te::call 模板首参为返回类型（默认 void），必须写 te::call<int>(...)；v1.0.0 无 te::as/te::ref，用 te::poly<T>{Concrete{}} 隐式构造"
  - "新库分支零提交时 finish/W3 junk_check 回退 full 模式会误伤 origin/main 其他库基线杂项；先 commit 本库工作使三点 diff 非空可回退 incremental（commit-first 规避）"