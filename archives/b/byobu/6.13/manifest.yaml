software:
  name: byobu
  version: "6.13"
  category: terminal
  description: "GNU Screen enhancement - text-based window manager and terminal multiplexer"
  homepage: http://byobu.org
  source_url: https://github.com/dustinkirkland/byobu

build:
  system: autotools
  configure_options:
    - --prefix=$HOME/usr/local
  dependencies:
    runtime:
      - tmux >= 1.5
      - screen
    optional:
      - python-newt
      - gsed

status: built

platform_adaptations:
  - issue: E058-home-ownership-check
    description: "HOME directory ownership check fails on OpenHarmony"
    patch: 0001-home-ownership-check.patch

knowledge_gained:
  - type: platform-truth
    content: "OpenHarmony user UID != HOME directory owner UID; shell scripts using -O $HOME check need adaptation"
