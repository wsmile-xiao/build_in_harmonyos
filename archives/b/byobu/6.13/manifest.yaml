software: byobu
version: "6.13"
status: built
build_date: "2026-08-06"
build_system: custom
category: terminal
description: "GNU Screen enhancement - text-based window manager and terminal multiplexer"
homepage: https://github.com/dustinkirkland/byobu
source_url: https://github.com/dustinkirkland/byobu

build_info:
  # 纯脚本包：不运行 configure/make，build() 手动处理 .in 模板（@prefix@ -> package_folder）后拷贝
  build_method: "custom: .in template substitution + file copy, no configure/make"
  dependencies:
    runtime:
      - tmux >= 1.5
      - screen
    optional:
      - python-newt
      - gsed

platform_adaptations:
  - issue: E058-home-ownership-check
    description: "HOME directory ownership check fails on OpenHarmony"
    patch: 0001-usr-bin-byobu.in.patch
