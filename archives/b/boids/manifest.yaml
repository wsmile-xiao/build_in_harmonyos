# 软件级 manifest — boids
# 遵循 ARCHIVE-SPEC v2.0

software: boids

# 显示名
display: "Boids"

# 一句话描述
description: "轻量级 JavaScript 实现的 Boids 群体（鸟群）模拟算法库"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://github.com/hughsk/boids"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统
build_system: nodejs

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 JS（Node.js）库无 C/C++ 编译；构建期用 npm install --ignore-scripts --omit=dev 解析运行时依赖"
    - "打包为 <prefix>/boids/ 模块根 + <prefix>/node_modules/<dep>/，消费者经 NODE_PATH=package_folder 解析"
    - "上游通常无正式测试，需按 API 契约补全功能测试集（Node assert 即可，零外部依赖）"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.0.0":
    status: published
    build_date: 2026-08-27
    published_as: boids