# test_package/MANIFEST.yml — boids 2.0.0
# CI L0e requires this file to exist and declare the upstream test story.

package: boids/2.0.0
homepage: "https://github.com/hughsk/boids"

# Upstream ships NO formal test suite.  Verified by 6 checks: (1) GitHub master
# full tree has only 8 files, no test dir/file; (2) all commit histories never
# contained any test file; (3) npm boids@2.0.0 tarball has only 8 files; (4)
# package.json has no "test" script; (5) benchmark.js is a perf benchmark with
# no assertions; (6) demo.js/index.html are browser canvas demos.
upstream_check_command: "node benchmark.js"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package tests (consumer perspective, run against the installed module)
test_package_tests:
  - file: test.sh
    description: "Checks node/NODE_PATH wiring and that the packaged boids module + bundled inherits dependency are present, then runs test.js"
    command: "bash test.sh"
  - file: test.js
    description: "17-case functional suite: constructor/factory, default & custom boid counts, boid record shape, initial state, position integration, speedLimit, accelerationLimit, attractor, separation, cohesion, alignment, count stability, tick event, long-run no-NaN"
    command: "node test.js"

# 17 assertions + 4 environment/package checks in test.sh
assertion_count: 21