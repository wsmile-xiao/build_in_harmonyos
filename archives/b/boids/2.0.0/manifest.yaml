# 版本级 manifest — boids 2.0.0
# 遵循 ARCHIVE-SPEC v2.0

version: "2.0.0"
software: boids

# 编译状态
# published | built | failed | archived
status: published

# 编译日期
build_date: "2026-08-27"
build_system: nodejs

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag v2.0.0）
  url: "https://github.com/hughsk/boids/archive/refs/tags/v2.0.0.tar.gz"

  # 源码校验和（SHA256）
  sha256: "6a955403c908e3444a992a339267d61cba73cbc169d505f4faf12b35566bbb2f"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: nodejs

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（conan 级无 C/C++ 依赖；运行时依赖 inherits 由 npm install 解析并捆绑）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 JS（Node.js）库可通过 conan recipe 打包：build() 中用 npm install --omit=dev --ignore-scripts 拉取运行时依赖，package() 将模块根与 node_modules 一起打包"
  - "消费者通过 runenv_info.prepend_path('NODE_PATH', package_folder) 暴露模块解析路径，test_package 用 VirtualRunEnv + conanrun 环境即可 require('boids')"
  - "上游无正式测试时，需按 API 契约补全功能测试集（构造器/工厂调用/数量/记录形状/物理不变式/事件/长稳），断言要确定性化（单帧方向判断而非长时动力学）"