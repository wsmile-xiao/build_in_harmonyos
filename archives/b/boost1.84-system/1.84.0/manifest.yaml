software: boost1.84-system
version: 1.84.0
status: built
build_system: custom-manual-compile
configure_options: []
build_options:
  - "CXXFLAGS: -std=c++17 -stdlib=libc++ -fPIC -O2 -DNDEBUG"
  - "DEFINES: BOOST_ALL_NO_LIB BOOST_SYSTEM_NO_DEPRECATED BOOST_SYSTEM_SOURCE"
  - "单一编译单元: libs/system/src/error_code.cpp -> libboost_system.a (llvm-ar rcs)"
dependencies: []
knowledge_gained:
  - Boost.System 自 1.69 起 header-only，唯一编译单元 error_code.cpp 仅含 dummy_exported_function 兼容桩
  - B2 (Boost.Build) 在 OHOS 不兼容（E068），手动编译 libs/system/src/error_code.cpp 即可产出完整组件
  - OHOS musl strerror 对未知 errno 返回 "No error information"（glibc 为 "Unknown error"），上游 error_code_test 有 2 处文本断言依赖 glibc 行为
  - boost/core sp_thread_sleep.hpp 需 BOOST_SP_NO_PTHREAD_SETCANCELSTATE 跳过 OHOS musl 缺失的 pthread_setcancelstate
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题)
issues:
  - error_code_test 2 处 strerror 文本断言失败（glibc vs musl 平台行为差异，非适配缺陷）
compilation_date: 2026-09-05
compiler: clang
platform: OpenHarmony
notes: Boost.System 独立组件包，供下游以 boost1.84-system/1.84.0 精确依赖，不拉取 boost 聚合包；上游 94 测试 93 通过
