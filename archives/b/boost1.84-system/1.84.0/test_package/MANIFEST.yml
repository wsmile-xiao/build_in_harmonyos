package: boost1.84-system/1.84.0
homepage: https://www.boost.org/

# 上游测试说明
# Boost 自带的 B2 构建系统在 OHOS 不兼容（SHELL 执行机制失败，E068），
# 无法直接使用 b2 运行上游测试。本适配通过手动编译 libs/system/test/
# 下的官方测试源文件绕过 b2，在 OHOS 环境真实运行（lightweight_test
# 框架自带断言，退出码 0 判定通过）。
# 测试方式：clang++ -std=c++17 -stdlib=libc++ 编译测试源文件，链接到
# 已编译的 libboost_system.a，直接运行可执行文件。
#
# 共 94 个可运行上游测试（Jamfile.v2 的 run/system-run/compile 目标，
# 排除 Windows 专属与需要动态库变体的用例），93 个通过。
# 唯一失败项：error_code_test，2 处断言依赖 glibc strerror 消息文本
# （"Unknown error"），OHOS musl 对未知 errno 返回 "No error information"，
# 属平台 libc 行为差异，非适配缺陷。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/system/test/error_code_test.cpp"
    description: "boost.system 错误码主测试（232 断言，2 处 strerror 文本断言因 OHOS musl 与 glibc 消息差异失败）"
    command: "clang++ error_code_test.cpp -lboost_system && ./a.out"
    result: failed
  - file: "libs/system/test/error_code_user_test.cpp"
    description: "boost.system 用户自定义错误码测试"
    command: "clang++ error_code_user_test.cpp -lboost_system && ./a.out"
    result: passed
  - file: "libs/system/test/system_error_test.cpp"
    description: "boost.system system_error 异常测试"
    command: "clang++ system_error_test.cpp -lboost_system && ./a.out"
    result: passed
  - file: "libs/system/test/std_interop_test.cpp (+ test2~test16)"
    description: "boost.system 与 std::error_code 互操作测试（16 项）"
    command: "clang++ std_interop_test.cpp -lboost_system && ./a.out"
    result: passed
  - file: "libs/system/test/errc_test.cpp (+ test2~test4)"
    description: "boost.system errc 枚举测试（4 项）"
    command: "clang++ errc_test.cpp -lboost_system && ./a.out"
    result: passed
  - file: "libs/system/test/result_*.cpp (35 项)"
    description: "boost.system result<T,E> 模板测试（35 项全部通过）"
    command: "clang++ result_default_construct.cpp -lboost_system && ./a.out"
    result: passed
  - file: "libs/system/test/{error_category,generic_category,system_category,ec_location,ec_what,ec_wstream,ec_hash_value,snprintf,warnings,before_main,after_main,config,quick,...}_test.cpp"
    description: "boost.system 类别/位置/哈希/警告等其余测试（全部通过）"
    command: "clang++ quick.cpp -lboost_system && ./a.out"
    result: passed

test_package_tests:
  - file: test_boost_system.cpp
    description: "boost1.84-system: error_code 构造/值/类别/消息 + errc 比较 + system_category 映射 + system_error 抛出捕获回环 + std::error_code 互操作（6 组断言）"
    command: "ctest boost_system_test"

assertion_count: 6  # test_package 实际断言组数；上游 94 项测试（~2546 宏断言）见 upstream_tests
