# conandata.yml — boost1.84-type_erasure 1.84.0
# Single source of truth: official source URL + SHA256 + patches.
# conanfile.py reads sources via self.conan_data["sources"] and applies
# patches via apply_conandata_patches().
#
# Source is the official boost 1.84.0 release tarball (same as the
# boost/1.84.0 meta package). This recipe compiles libs/type_erasure/src
# (dynamic_binding.cpp) and packages the full boost header tree.

sources:
  url:
    - "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.gz"
    - "https://downloads.sourceforge.net/project/boost/boost/1.84.0/boost_1_84_0.tar.gz"
  sha256: "a5800f405508f5df8114558ca9855d2640a2de8f0445f051fa1c7c3383045724"

patches:
  # OHOS musl has no pthread_setcancelstate (same platform limitation as the
  # boost/1.84.0 base, verified there). Guarded by the
  # BOOST_SP_NO_PTHREAD_SETCANCELSTATE feature-detection macro, R8-compliant
  # (no platform macro). Same patch as the meta/atomic/log/wave packages.
  - patch_file: "patches/0001-ohos-pthread-cancel-fix.patch"
    patch_description: "Skip pthread_setcancelstate (not available on OHOS musl) via BOOST_SP_NO_PTHREAD_SETCANCELSTATE feature-detection macro, R8-compliant (no platform macro)"
    patch_type: "portability"
