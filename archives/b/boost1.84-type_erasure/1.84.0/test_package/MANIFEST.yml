test_package_tests:
  - file: test_boost_type_erasure.cpp
    description: "Boost.TypeErasure 消费者冒烟：异构 printable any 流式输出与 any_cast 回取、擦除 callable（lambda 与仿函数）、擦除成员函数（BOOST_TYPE_ERASURE_MEMBER）、动态绑定注册与 dynamic 视图转换（register_binding，链接 libboost_type_erasure）"
    command: "./test_boost_type_erasure"

assertion_count: 10
