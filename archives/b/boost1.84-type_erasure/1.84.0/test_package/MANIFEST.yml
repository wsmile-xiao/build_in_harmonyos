package: boost1.84-type_erasure/1.84.0
homepage: https://www.boost.org/doc/libs/1_84_0/doc/html/boost_typeerasure.html

# 上游测试说明
# Boost.TypeErasure 1.84.0 自带测试位于 libs/type_erasure/test（基于
# boost.test，31 个 run 目标 + 5 个 compile 目标 + 24 个 compile-fail
# 负向目标，见 test/Jamfile.jam）。上游 B2 构建系统在 OHOS 不兼容
# （E068，Boost.Build SHELL 执行机制失败），无法用 b2 跑测试。本适配在
# 配方 build() 中绕过 b2 手动驱动全部 60 个目标：
# run 型用 header-only 的 included/unit_test.hpp 单头变体编译运行
# （与 boost1.84-coroutine 同款技巧，无需链接
# libboost_unit_test_framework；仅 test_dynamic_any_cast 额外链接
# libboost_type_erasure）；compile 型 -fsyntax-only 期望成功；
# compile-fail 型 -fsyntax-only 期望失败。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/type_erasure/test/test_binding.cpp"
    description: "binding 创建/比较/空绑定测试（run）"
    command: "clang++ test_binding.cpp (included/unit_test.hpp) && ./ut_test_binding"
