software: bashish
# 版本级 manifest 模板
# 文件位置: archives/b/bashish/2.2.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.2.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-23"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（SourceForge 官方源，CI mirror fallback 覆盖）
  url: "https://downloads.sourceforge.net/project/bashish/bashish/2.2.4/bashish-2.2.4.tar.gz"

  # 源码校验和
  sha256: "3de48bc1aa69ec73dafc7436070e688015d794f22f6e74d5c78a0b09c938204b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=${PACKAGE_FOLDER}"
    - "--bindir=${PACKAGE_FOLDER}/bin"
    - "--datarootdir=${PACKAGE_FOLDER}/share"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "bashish 是纯 bash 脚本包，autoconf 构建（./configure && make && make install）"
  - "make install 用 DESTDIR 做 staging，再复制到 package_folder"
  - "安装布局：bin/bashish + share/bashish/（主题数据）+ share/man/man1/bashish.1"
  - "运行时依赖 bash >=2.04；可选 dialog（curses 主题选择器）、xwininfo/xprop（X 支持）"
