software: bibutils
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/7.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/bibutils/bibutils_7.2_src.tgz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: autotools

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--install-dir /storage/Users/currentUser/usr/local/bin"
    - "--install-lib /storage/Users/currentUser/usr/local/lib"
    - "--static"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "bibutils 使用自定义 configure 脚本，不支持标准 --prefix 参数，使用 --install-dir 和 --install-lib"
  - "configure 不识别 aarch64 OpenHarmony 平台，检测为 Linux_Unknown，使用 cc 编译器"
  - "需要创建 cc -> clang 符号链接，因为系统上没有 cc"
  - "Makefile 不支持 DESTDIR，通过覆盖 INSTALLDIR/LIBINSTALLDIR 实现 staging 安装"
  - "intlist_test 上游测试 bug：m<99 应为 m<100（100 个元素的列表，位置范围 0-99）"
