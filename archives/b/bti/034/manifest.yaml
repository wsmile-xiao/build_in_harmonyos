# 版本级 manifest — bti 034
version: "034"
software: "bti"
conan_ref: "bti/034"
status: built
build_date: "2026-09-13"
build_system: autotools

source:
  url: "https://www.kernel.org/pub/software/web/bti/bti-034.tar.gz"
  sha256: "46e586c8b3ecc645d7ce206ecb9f2dcb6c7ab71984eef8d094ca5e30b6bfe09f"
  tar_format: tar.gz
  note: >
    上游发布 tarball（make dist 产物，自带预生成 configure/Makefile.in）。
    GitHub tag 归档与 Debian bti_034.orig.tar.gz 逐字节相同但无预生成 configure。

build:
  system: autotools
  configure_options:
    - "--prefix=$package_folder（AutotoolsToolchain 注入，recipe 未额外加参数）"
    - "PKG_CONFIG_PATH=$generators_folder（PkgConfigDeps 生成的 .pc；PKG_CHECK_MODULES 用）"
  dependencies:
    - liboauth/1.0.3
    - curl/8.15.0
    - libxml2/2.15.3
    - json-c/0.17
    - pcre/8.45
    - openssl/3.5.6.1（override 统一版本）
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-bti-shrink-urls.patch — bin_SCRIPTS 的 shebang 由 /bin/bash 改为 /bin/sh（OHOS 无 /bin/bash；sh -n 与 --help 实测通过）"
  - "0002-bti.c.patch — json-c 0.13 起移除 is_error 宏；3 处调用改为显式 NULL 比较"
  - "0003-configure.patch — config.status 临时目录 umask 077 → 022（HMDFS 上 0700 目录对构建用户不可写）"

knowledge_gained:
  - "HMDFS 下 autoconf 的 config.status 临时目录用 umask 077 会在 setgid 挂载上建出不可写的 0700 目录；修复是在 configure 内把两处 umask 077 改为 022  # knowledge_ref: E129（同族 E114/E491）"
  - "json-c 0.13 起移除 is_error 宏，2014 年前的 C 客户端会报 undefined symbol: is_error；改为显式 NULL 比较即可  # reference: Debian bti_034-6 patches/replace_removed_is_error.patch"
  - "PkgConfigDeps 生成的 .pc 名默认取 Conan 包名，模块名不同的依赖需改名：liboauth→oauth、pcre→libpcre（PkgConfigDeps.set_property）  # reference: Conan 2 PkgConfigDeps properties: pkg_config_name"
  - "依赖图硬冲突：已发布 liboauth/1.0.3 钉 openssl/1.1.1w、已发布 curl/8.15.0 钉 openssl/3.5.6.1，消费侧需 override 统一（代价：liboauth 从源码重建）  # reference: 本任务 W0 实测图算日志与 feedback/pending/2026-09-13-bti-034.md"

validation:
  native_build:
    status: pass
    command: "PKG_CONFIG_PATH=<gens> CC=/data/service/hnp/bin/clang ./configure && make -j1 && make install"
    note: "见 reports/notes-native-build.md"
  upstream_tests:
    status: pass
    command: "make check"
    note: "上游无测试套件；make check 输出 make: Nothing to be done for 'check'.（退出码 0）"
  conan_verify:
    status: pass
    command: "conan-verify bti 034"
    note: "见 reports/conan-verify-report.md"

patch_generation:
  method: per-file-difflib
  patches_count: 3

patch_classification:
  - file: 0001-bti-shrink-urls.patch
    type: portability
    platform_only: False
    guard: 'none'
  - file: 0002-bti.c.patch
    type: portability
    platform_only: False
    guard: 'none'
  - file: 0003-configure.patch
    type: portability
    platform_only: False
    guard: 'none'
