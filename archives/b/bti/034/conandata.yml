# conandata.yml — bti 034
#
# 上游发布 tarball 由项目主页 https://gregkh.github.io/bti/ 指向 kernel.org
# 的 /pub/software/web/bti/。该 tarball 是 `make dist` 产物，自带预生成的
# configure/Makefile.in/install-sh/depcomp，因此配方不需要 autoreconf
# （CI worker 的 PATH 里没有 automake，走 autoreconf 会稳定失败）。
#
# 交叉核对：GitHub tag 归档（codeload/gregkh/bti/tar.gz/refs/tags/034）与
# Debian 的 bti_034.orig.tar.gz 逐字节相同（sha256
# 1bbd51e96ca95c2e4e7abcc6d1405ffbe33e6e210c85a6a3668ff8a47dfc1805），
# 但二者都不含预生成 configure，故不作为 source URL。
sources:
  url: "https://www.kernel.org/pub/software/web/bti/bti-034.tar.gz"
  sha256: "46e586c8b3ecc645d7ce206ecb9f2dcb6c7ab71984eef8d094ca5e30b6bfe09f"
  filename: "bti-034.tar.gz"

patches:
  - patch_file: "patches/0001-bti-shrink-urls.patch"
    patch_description: >
      OHOS 没有 /bin/bash，bin_SCRIPTS 安装的 bti-shrink-urls 直接执行报
      "bad interpreter: No such file or directory"（rc=126）。改为 #!/bin/sh；
      该脚本在 OHOS 的 /bin/sh 下 `sh -n` 语法检查与 `--help` 运行均通过。
    patch_type: "portability"
  - patch_file: "patches/0002-bti.c.patch"
    patch_description: >
      json-c 0.13 起移除了 is_error 宏，上游 2014 年的 bti.c 仍使用该宏，
      链接期报 undefined symbol: is_error。将 3 处调用改为显式 NULL 比较
      （与 Debian bti 034-6 的 replace_removed_is_error.patch 同口径）。
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: >
      HMDFS 语义：config.status 用 umask 077 创建临时目录，落盘为 0700 目录，
      在 setgid hmdfs 挂载上对构建用户不可写，configure 报
      "can't create ./confXXXXXX/subs1.awk: Permission denied"。发布 tarball
      只提供预生成 configure（无法 autoreconf），故就地放宽为 umask 022。
    patch_type: "portability"
