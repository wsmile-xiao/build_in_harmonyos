software: bti
display: "bti — bash twitter/identi.ca ididocy"
description: "命令行 Twitter / Identi.ca 客户端 — 把标准输入或 bash 命令输出直接发布为状态更新"
category: network
homepage: "https://gregkh.github.io/bti/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游发布 tarball 自带预生成 configure，配方不跑 autoreconf（CI worker 无 automake）"
    - "HMDFS 上 config.status 的 umask 077 临时目录不可写，需放宽为 022"
    - "json-c 0.13 起移除 is_error 宏，需把 3 处调用改为显式 NULL 比较"
    - "已发布 liboauth/1.0.3 与 curl/8.15.0 在 openssl 版本上硬冲突，消费侧需 override 统一到 openssl/3.5.6.1"
  common_dependencies:
    - curl
    - libxml2
    - json-c
    - liboauth
    - pcre
    - openssl

versions:
  "034":
    status: built
    build_date: "2026-09-13"
    conan_ref: "bti/034"
    source_url: "https://www.kernel.org/pub/software/web/bti/bti-034.tar.gz"
