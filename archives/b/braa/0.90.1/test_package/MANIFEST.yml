# test_package/MANIFEST.yml — braa 0.90.1
# CI L0e requires this file to exist.

package: braa/0.90.1
homepage: "https://github.com/mteg/braa"

# braa 0.90.1 has no upstream test suite: plain-Makefile project (no `make
# check` target), no test programs or test runner anywhere in the v0.90.1
# tarball (verified: only COPYING Makefile README VERSION braa.1 *.c *.h mkrelease).
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Exercises the braa binary: -h banner/usage, -r 0 argument validation, and a real SNMP GET over UDP to 127.0.0.1 driving the built-in SNMP stack"
    command: "bash test.sh"

# Approximate assertion count:
#   banner grep + usage grep = 2
#   -r 0 non-zero exit + stderr message = 2
#   SNMP GET: "1 queries made" + "0 queries acknowledged" = 2
assertion_count: 6
