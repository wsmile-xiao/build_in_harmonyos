# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Upstream Makefile hardcodes `cc` in the link rule while the .o implicit rule honors CC: passing only make CC=clang still fails at link (no cc on OHOS); the link line needs the 0001-Makefile.patch to use $(CC)"
  - "Same Makefile runs bare `strip` after linking: patch makes it `-strip` so missing/incompatible host strip only degrades instead of failing the cross build"
  - "queries.c uses `assert(string = strdup(string))` (assignment inside assert): Conan Release injects CPPFLAGS=-DNDEBUG which compiles the strdup away and segfaults query parsing; recipe passes CPPFLAGS= to keep the faithful upstream build (upstream CFLAGS/LDFLAGS are empty, asserts on)"
  - "Packaged OHOS executables must carry a valid .codesign section: the toolchain embeds an unsigned placeholder that makes binary-sign-tool fail with 'section already exists' — remove it with llvm-objcopy before self-signing, and drop LD_LIBRARY_PATH when invoking the signer (Conan env shadows system OHOS libc++ std::__h symbols)"
  - "braa 0.90.1 has no configure/install/check targets: recipe copies the single binary to bin/ and package_type=application with bindirs"

