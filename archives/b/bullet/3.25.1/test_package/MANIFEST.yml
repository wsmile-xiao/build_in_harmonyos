# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bullet/3.25.1
homepage: "https://github.com/bulletphysics/bullet3"

# 上游测试命令
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
# build() 末尾执行 cmake.test()（内部调用 ctest），BUILD_UNIT_TESTS=ON
upstream_test_in_build: true
upstream_test_command: "cmake.test() (ctest --output-on-failure)"

# 上游实际运行的测试程序
# 受 BUILD_BULLET3=OFF 门控，Bullet3(OpenCL)/InverseDynamics(RBdl)/SharedMemory(enet)
# 组被排除；gtest + collision + BulletDynamics 组由 BUILD_UNIT_TESTS=ON 构建并运行。
upstream_tests:
  - file: "test/collision"
    source: Bullet upstream test/collision
    description: "Collision shape tests (gtest-based, Test_Collision)"
    command: "Test_Collision"
  - file: "test/BulletDynamics"
    source: Bullet upstream test/BulletDynamics
    description: "Kinematic character controller test (gtest-based, Test_btKinematicCharacterController)"
    command: "Test_btKinematicCharacterController"
  - file: "test/BulletDynamics/pendulum"
    source: Bullet upstream test/BulletDynamics/pendulum
    description: "Multi-body pendulum dynamics test (Test_BulletDynamics)"
    command: "Test_BulletDynamics"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: creates a dynamics world with ground plane and falling sphere, simulates 3s, verifies sphere rests on ground"
    command: "./test_bullet"

# 测试断言总数
assertion_count: 1
