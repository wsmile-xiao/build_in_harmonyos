# conandata.yml — bullet 3.25.1
# Same upstream source as bullet/3.25 (only one upstream release). 3.25.1 is a
# local recipe version that adds the double-precision `precision` option.
# Uses the official codeload source (GitHub archive URL direct download failed /
# proxy rejected); `filename` is required so conan detects the .tar.gz container
# instead of trying to unzip a gzip'ed tar (earlier BadZipFile).

sources:
  url: "https://codeload.github.com/bulletphysics/bullet3/tar.gz/refs/tags/3.25"
  sha256: "c45afb6399e3f68036ddb641c6bf6f552bf332d5ab6be62f7e6c54eda05ceb77"
  filename: "bullet3-3.25.tar.gz"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "0001 CMakeLists txt"
    patch_type: "portability"
