software: bullet
version: 3.25.1
status: local
build_system: cmake
build_date: "2026-09-03"
created_at: "2026-09-03"
tested_at: "2026-09-03"
platform: OpenHarmony/HarmonyOS PC aarch64 (OS OHOS, os.version 6.0, armv8, clang 15, libc++, cppstd 17)

# 编译配置
configure_options:
  - "-DCMAKE_SYSTEM_NAME=Linux"
  - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DBUILD_UNIT_TESTS=ON"
  - "-DUSE_DOUBLE_PRECISION=ON"   # precision=double: btScalar = double
  - "-DINSTALL_LIBS=ON"
  - "-DBUILD_CPU_DEMOS=OFF"
  - "-DBUILD_PYBULLET=OFF"
  - "-DBUILD_ENET=OFF"
  - "-DBUILD_CLSOCKET=OFF"
  - "-DBUILD_BULLET3=OFF"
  - "-DBUILD_BULLET2_DEMOS=OFF"
  - "-DBUILD_EXTRAS=OFF"
  - "-DUSE_GRAPHICAL_BENCHMARK=OFF"
  - "-DUSE_OPENVR=OFF"
  - "-DENABLE_VHACD=OFF"

# 源码信息
source_url: https://codeload.github.com/bulletphysics/bullet3/tar.gz/refs/tags/3.25
source_sha256: "c45afb6399e3f68036ddb641c6bf6f552bf332d5ab6be62f7e6c54eda05ceb77"

# 编译产物 (本地构建)
products:
  libraries:
    - name: libBulletDynamics.a
      verified: true
    - name: libBulletCollision.a
      verified: true
    - name: libBulletSoftBody.a
      verified: true
    - name: libBulletInverseDynamics.a
      verified: true
    - name: libLinearMath.a
      verified: true
    - name: libBullet3Common.a
      verified: true
  pkgconfig:
    - name: bullet.pc
      verified: true
  cmake:
    - name: UseBullet.cmake
      verified: true
    - name: BulletConfig.cmake
      verified: true
  headers: 299

# 测试结果
# precision=double 本地验证：上游 ctest 3/3 (7 gtest 用例) + test_package test_bullet 1/1
test_results:
  status: PASS
  tests_run: 4
  tests_passed: 4
  tests_failed: 0
  test_program: "ctest (3 upstream) + test_bullet (1 consumer)"

# 顶层测试计数（review 检查顶层 test_passed/test_failed 非零）
test_passed: 4
test_failed: 0

# 质量门禁
quality_gates:
  G0_clean_build: PASS
  G1_binary_integrity: PASS
  G2_functionality: PASS
  G3_portability: PASS
  G4_archive_integrity: PASS

# 补丁信息
patches_applied:
  - "0001-CMakeLists.txt.patch"
patch_count: 1

# 知识沉淀
knowledge_gained:
  - id: K001
    category: cmake_compatibility
    description: "bullet CMakeLists.txt 需 CMAKE_POLICY_VERSION_MINIMUM=3.5 才能在 CMake 4.x 编译（补丁 0001 提升 cmake_minimum_required）"
    severity: medium
  - id: K002
    category: build_precision
    description: "btScalar 双精度由上游 CMake 开关 USE_DOUBLE_PRECISION=ON 控制（ADD_DEFINITIONS -DBT_USE_DOUBLE_PRECISION），比手动注入 CMAKE_CXX_FLAGS 更规范；需 cpp_info.defines 回传消费方保持一致"
    severity: high
  - id: K003
    category: off_on_gating
    description: "开启上游测试用 BUILD_UNIT_TESTS=ON；BUILD_BULLET3 须保持 OFF，否则拉入 OpenCL/clew、RBdl(逆动力学)、enet(共享内存) 等缺失依赖导致构建失败"
    severity: medium

# 平台说明
platform_notes:
  - "在 HarmonyOS PC aarch64 真机原生构建，conan create 会原生编译并运行 aarch64 二进制"
  - "test_package 消费侧测试用 printf 避免 C++ 流链接问题"
  - "静态库无需运行时依赖，可直接链接使用"

# 使用建议
usage_notes:
  - "链接顺序：先功能库（BulletDynamics），再基础库（BulletCollision, LinearMath）"
  - "双精度消费方需编译宏 BT_USE_DOUBLE_PRECISION（配方已在 cpp_info.defines 回传）"
  - "包含路径：-I$DEFAULT_PREFIX/include/bullet"

# 依赖关系
dependencies: []
