# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bitflags/1.5.0
homepage: "https://github.com/m-peko/bitflags"

# 上游测试命令 (CMake + googletest 驱动)
upstream_check_command: "cmake -B build -DBITFLAGS_BUILD_TESTS=ON && cmake --build build --target tests && ./build/src/bitflags_test"

# bitflags 上游测试为 gtest 驱动（tests/src/bitflags_test.cpp，14 个用例）。
# header-only 库无 configure/make 步骤；上游测试依赖 googletest 子模块，
# tarball 内子模块为空，需先拉取 googletest 再启用测试构建。
upstream_test_in_build: false
upstream_test_in_test_package: false

# 上游实际运行的测试程序（gtest 二进制）
upstream_tests:
  - file: tests/src/bitflags_test.cpp
    source: bitflags-1.5.0/tests/src/
    description: "All upstream bitflags unit tests (gtest assertions, 14 cases)"
    command: "./src/bitflags_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_package.cpp
    description: "Downstream consumer test — flag declaration / bitwise ops against bitflags:: API"
    command: "./test_bitflags"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14