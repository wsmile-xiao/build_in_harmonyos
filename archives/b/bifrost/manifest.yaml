software: bifrost
display: "bifrost"
description: "Bifrost：高度并行的彩色压缩 de Bruijn 图构建与索引工具，支持序列组装、查询与可视化导出"
category: bioinformatics
homepage: "https://github.com/pmelsted/bifrost"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建；上游默认 COMPILATION_ARCH=native + ENABLE_AVX2=ON（x86-64 取向），OHOS arm64 必须显式置 OFF"
    - "依赖 zlib（find_package(ZLIB REQUIRED)），由 conan registry 提供"
    - "Bifrost CLI 链接共享库 bifrost_dynamic；库与 CLI 同包交付"
  common_dependencies:
    - "zlib/1.3.1"

versions:
  "1.3.5":
    status: built
    build_date: "2026-09-24"