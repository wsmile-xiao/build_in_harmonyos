# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bifrost/1.3.5
homepage: "https://github.com/pmelsted/bifrost"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# bifrost 1.3.5 官方源码无自动化测试声明（无 ctest/make check/tests 目录），
# 仅有 doc/snippets 编译示例；真实验证依赖 test_package 消费者用例与鸿蒙专项测试。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：通过公共头文件 <bifrost/CompactedDBG.hpp> 构建 de Bruijn 图并查询 k-mer"
    command: "./test_bifrost"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
