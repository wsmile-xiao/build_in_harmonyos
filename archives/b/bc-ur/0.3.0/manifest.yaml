# ============================================================

# 知识沉淀（详见 notes.md 知识候选台账；C1 → 草稿 DRAFT-bc-ur-0.3.0-makefile-install-bare-name-in-source）
knowledge_gained:
  - "autotools 手写 Makefile.in（无 Makefile.am）的 install 规则以裸名引用头文件，out-of-source 下 conan package() 报 install: bad '<h>' → 配方 layout() 折叠 folders.build='.' 强制 in-source"
  - "make jobserver mkfifo Operation not permitted（HMDFS 不支持 fifo）→ 非致命降级串行，配方 -j1（引用 E074）"