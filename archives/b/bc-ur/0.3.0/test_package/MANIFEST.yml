# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bc-ur/0.3.0
homepage: "https://github.com/BlockchainCommons/bc-ur"

# 上游测试命令 (release tarball 自带预生成 configure/Makefile.in)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check (cd test && ./test)"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cpp
    source: bc-ur-0.3.0/test/test.cpp
    description: >
      上游单可执行测试套件：21 个独立用例外层函数（crc32 / bytewords / RNG /
      partition-and-join / fountain 编码与解码 / UR 单部分与多部分编解码），
      make check 实际运行 ./test，assert + assert_throws 断言，输出
      "*** ALL TESTS PASSED ***" 退出码 0
    command: "make check (./test)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：仅经公开头 <bc-ur/bc-ur.hpp> 使用公开 API——Bytewords 已知向量精确编码/往返解码、单部分 UR 编解码往返、多部分 fountain 分片收齐恢复 (32767 字节)"
    command: "./test_bc-ur"
  - file: ohos_test.cpp
    description: "鸿蒙专项测试：-Wall -Wextra -Werror 严格编译；crc32 已知向量 ('Hello, world!'=ebe6c6e6)、Bytewords minimal 往返、256 KiB 大消息 fountain 流式解码逐字节还原"
    command: "./test_bc-ur_ohos"

# 测试断言总数 (上游 21 用例 + test_package 消费者 ~6 + 鸿蒙专项 ~7)
assertion_count: 34