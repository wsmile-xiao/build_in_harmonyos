software: broker
display: "Broker"
description: "Zeek 的消息代理库：进程内 pub-sub 消息总线（C++17，CMake，基于 CAF）"
category: messaging
homepage: "https://github.com/zeek/broker"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游以 git 子模块捆绑 CAF（zeek/actor-framework 固定提交，其内容与 CAF 0.17.6 发布一致），按上游默认 add_subdirectory(caf) 方式构建"
    - "制品仓已有 actor-framework/0.17.6，但其配方固定 CAF_NO_OPENSSL=ON 且不含 openssl/test 组件，broker 需要 find_package(CAF COMPONENTS openssl test io core)"
    - "tag 压缩包不含子模块内容，conandata.yml 补充 3 个官方子模块源（caf/cmake/3rdparty）"
    - "发布 libbroker 静态库 + 捆绑 CAF 头文件与静态库，供下游直接消费"
  common_dependencies:
    - openssl
    - actor-framework

versions:
  "1.4.0":
    status: built
    build_date: "2026-09-05"
    conan_ref: "broker/1.4.0"
