version: "1.4.0"
software: broker
status: built
build_date: "2026-09-05"
build_system: cmake
conan_ref: "broker/1.4.0"

source:
  url: "https://github.com/zeek/broker/archive/refs/tags/v1.4.0.tar.gz"
  sha256: "a680537173dd3ec8592f35c5c843c6ac25b00ad21c341f9977c3b1d5c788a567"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_STATIC_ONLY=ON"
    - "-DCAF_BUILD_STATIC_ONLY=ON"
    - "-DBROKER_DISABLE_TOOLS=ON"
    - "-DBROKER_DISABLE_DOCS=ON"
    - "-DDISABLE_PYTHON_BINDINGS=ON"
  dependencies:
    - openssl/3.5.8.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-filesystem-honor-tmpdir.patch"

knowledge_gained:
  - "Broker 依赖以子模块捆绑的 CAF 固定提交；该提交源码树与 CAF 0.17.6 发布逐字节一致"
  - "制品仓 actor-framework/0.17.6 固定 CAF_NO_OPENSSL=ON 且缺 openssl/test 组件，broker 的 find_package(CAF COMPONENTS openssl test io core) 无法满足"
  - "GitHub tag 压缩包不含子模块内容，需用官方仓库 commit 归档补齐 caf/cmake/3rdparty"
  - "OHOS 上 lld 运行时需要 SDK llvm/lib 目录下的 libxml2.so.16，需注入 LD_LIBRARY_PATH"
  - "broker 上游 C++ 测试（tests/cpp，CTest 注册）可在 OHOS 直接运行 broker-test"
