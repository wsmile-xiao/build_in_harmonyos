# test_package/MANIFEST.yml
# 上游官方测试声明 + test_package 新增测试声明
package: broker/1.4.0
homepage: "https://github.com/zeek/broker"

# 上游测试命令：tests/CMakeLists.txt 将 tests/cpp/ 下 22 个 CAF 套件文件
# （每个文件顶部 #define SUITE <name>）注册为 CTest 用例，均运行
# broker-test 二进制并按套件名 -s 选择执行。实测 22/22 全部通过。
upstream_check_command: "ctest --test-dir <build> -N"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure -j1"

# 上游实际运行的测试程序（22 个 CTest 套件，来源 tests/cpp/*.cc）
upstream_tests:
  - file: tests/cpp/backend.cc
    source: broker-1.4.0/tests/cpp/
    description: "backend: 存储后端（memory/sqlite）"
    command: "./broker-test -s backend"
  - file: tests/cpp/core.cc
    source: broker-1.4.0/tests/cpp/
    description: "core: endpoint/core-actor 发布订阅语义（11 CAF_TEST + fixtures）"
    command: "./broker-test -s core"
  - file: tests/cpp/data.cc
    source: broker-1.4.0/tests/cpp/
    description: "data: broker::data 类型与转换"
    command: "./broker-test -s data"
  - file: tests/cpp/detail/data_generator.cc
    source: broker-1.4.0/tests/cpp/detail/
    description: "data_generator: 数据生成器"
    command: "./broker-test -s data_generator"
  - file: tests/cpp/detail/generator_file_writer.cc
    source: broker-1.4.0/tests/cpp/detail/
    description: "generator_file_writer: 生成器文件写入与回读"
    command: "./broker-test -s generator_file_writer"
  - file: tests/cpp/detail/meta_command_writer.cc
    source: broker-1.4.0/tests/cpp/detail/
    description: "meta_command_writer: 元命令序列化"
    command: "./broker-test -s meta_command_writer"
  - file: tests/cpp/detail/meta_data_writer.cc
    source: broker-1.4.0/tests/cpp/detail/
    description: "meta_data_writer: 元数据序列化"
    command: "./broker-test -s meta_data_writer"
  - file: tests/cpp/error.cc
    source: broker-1.4.0/tests/cpp/
    description: "error: 错误码与错误对象"
    command: "./broker-test -s error"
  - file: tests/cpp/filter_type.cc
    source: broker-1.4.0/tests/cpp/
    description: "filter: 主题过滤器类型"
    command: "./broker-test -s filter"
  - file: tests/cpp/integration.cc
    source: broker-1.4.0/tests/cpp/
    description: "integration: 多 endpoint 网络互通（5 CAF_TEST）"
    command: "./broker-test -s integration"
  - file: tests/cpp/master.cc
    source: broker-1.4.0/tests/cpp/
    description: "master: master 存储语义（2 CAF_TEST）"
    command: "./broker-test -s master"
  - file: tests/cpp/publisher.cc
    source: broker-1.4.0/tests/cpp/
    description: "publisher: 背压发布者（2 CAF_TEST）"
    command: "./broker-test -s publisher"
  - file: tests/cpp/publisher_id.cc
    source: broker-1.4.0/tests/cpp/
    description: "publisher_id: 发布者标识"
    command: "./broker-test -s publisher_id"
  - file: tests/cpp/radix_tree.cc
    source: broker-1.4.0/tests/cpp/
    description: "radix_tree: 前缀匹配树"
    command: "./broker-test -s radix_tree"
  - file: tests/cpp/ssl.cc
    source: broker-1.4.0/tests/cpp/
    description: "ssl: TLS 传输（tests/certs 证书，3 CAF_TEST）"
    command: "./broker-test -s ssl"
  - file: tests/cpp/status.cc
    source: broker-1.4.0/tests/cpp/
    description: "status: 状态对象与序列化"
    command: "./broker-test -s status"
  - file: tests/cpp/status_subscriber.cc
    source: broker-1.4.0/tests/cpp/
    description: "status_subscriber: 状态订阅（1 CAF_TEST）"
    command: "./broker-test -s status_subscriber"
  - file: tests/cpp/store.cc
    source: broker-1.4.0/tests/cpp/
    description: "store: store API"
    command: "./broker-test -s store"
  - file: tests/cpp/store_event.cc
    source: broker-1.4.0/tests/cpp/
    description: "store_event: 存储事件流"
    command: "./broker-test -s store_event"
  - file: tests/cpp/subscriber.cc
    source: broker-1.4.0/tests/cpp/
    description: "subscriber: 订阅者语义（2 CAF_TEST）"
    command: "./broker-test -s subscriber"
  - file: tests/cpp/topic.cc
    source: broker-1.4.0/tests/cpp/
    description: "topic: 主题构造/规范化/序列化"
    command: "./broker-test -s topic"
  - file: tests/cpp/zeek.cc
    source: broker-1.4.0/tests/cpp/
    description: "zeek: Zeek 兼容层功能"
    command: "./broker-test -s zeek"

# test_package 中自带的测试（新增，上游未覆盖的消费者视角场景：
# 上游套件运行于 CAF test_multiplexer 假网络，以下用例全部使用真实
# 127.0.0.1 loopback peer 连接，验证 OHOS 上的实际 TCP 传输）
test_package_tests:
  - file: test_package/test_broker.cpp
    description: "version: endpoint 生命周期与 topic 序列化（2 断言）"
    command: "./test_broker version"
  - file: test_package/test_broker.cpp
    description: "roundtrip: loopback peer 多类型 pub-sub 往返 count/string/table（12 断言）"
    command: "./test_broker roundtrip"
  - file: test_package/test_broker.cpp
    description: "filter: 跨 peer 主题前缀过滤正反路径（4 断言）"
    command: "./test_broker filter"
  - file: test_package/test_broker.cpp
    description: "burst: 1000 条消息分批有序投递（3 断言）"
    command: "./test_broker burst"
  - file: test_package/test_broker.cpp
    description: "store: memory master 存储 put/get/exists/erase（7 断言）"
    command: "./test_broker store"
  - file: test_package/test_broker.cpp
    description: "peer_error: 无重试连接关闭端口快速失败（1 断言）"
    command: "./test_broker peer_error"
  - file: test_package/test_broker.cpp
    description: "status: 状态订阅者空闲态为 broker::none（1 断言）"
    command: "./test_broker status"

# 测试断言总数（新增消费者测试断言 2+12+4+3+7+1+1=30；上游 22 套件
# 经 broker-test 执行，断言归属上游测试框架）
assertion_count: 30
