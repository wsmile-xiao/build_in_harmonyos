# 版本级 manifest — boot 1.3-32
version: "1.3-32"
software: "boot"

# 编译状态: built（本地 conan create + test_package 通过；待 PR 合并后 CI upload 转 published）
status: built
build_date: "2026-10-10"
conan_ref: "boot/1.3-32"
# 纯 R 包，无编译；此处以「R 包树搬运」描述构建形态
build_system: "r-package-data-tree"

# 源码信息（与 conandata.yml 一致，以 conandata.yml 为准）
source:
  url: "https://cran.r-project.org/src/contrib/boot_1.3-32.tar.gz"
  mirror_urls:
    - "https://mirrors.tuna.tsinghua.edu.cn/CRAN/src/contrib/boot_1.3-32.tar.gz"
    - "https://mirrors.ustc.edu.cn/CRAN/src/contrib/boot_1.3-32.tar.gz"
    - "https://mirror.nju.edu.cn/CRAN/src/contrib/boot_1.3-32.tar.gz"
    - "https://mirrors.cernet.edu.cn/CRAN/src/contrib/boot_1.3-32.tar.gz"
  sha256: "3a05aced6fea42a5c310c5c6ab7a2019f69f757f5e77c4961183977747136c97"
  tar_format: tar.gz
  size: 238282
  strip_root: true

build:
  # 非编译构建：上游 R 包树原样安装到 lib/R/library/boot/
  system: r-package-data-tree
  configure_options: []
  # 零依赖：ohpcd 无 r-base（实测 HTTP 404），L0i 对未发布依赖 hard-fail，
  # 故本配方不声明任何 requires / tool_requires（同族先例 kernsmooth 同理）。
  dependencies: []
  cpp_info_libs: []
  cc: ""
  cxx: ""

patches_applied: []

# 上游测试资产（实测）
upstream_tests:
  available: true
  count: 1
  examples_pages: 25
  examples_expression_lines: 915
  files:
    - "tests/parallel-censboot.R"
    - "tests/Examples/boot-Ex.Rout.save"
  # CI 无 R 运行时（ohpcd 无 r-base），上游 R 测试在 CI 不执行
  run_in_ci: false
  run_locally: true
  local_runner: "test_package/R/（run_upstream_examples.R / run_upstream_tests.R / test_boot_api.R）"
  ci_substitute: "test_package/validate_boot.py（R-free 结构/数据校验，229 项断言）"

test_package_assertions: 229

knowledge_gained:
  - "boot 是 CRAN 纯 R 包（NeedsCompilation: no），r-base/4.5.1 未发布到 ohpcd（实测 HTTP 404，全量 7802 配方无 R 系包），故走零未发布依赖路线：不 require 任何包，只把上游 R 包树搬到 lib/R/library/boot/"
  - "R 包纯 R 无编译时的打包形态：整棵源码树（DESCRIPTION/NAMESPACE/R/data/man/inst/po/tests/INDEX/ChangeLog）原样安装为 R 库树，无需 toolchain；package_type=library，package_info 只定义 R_BOOT_PACKAGE_DIR（不臆造 cpp_info.libs）"
  - "CI 无 R 运行时下的测试策略：build()/test_package 两侧跑同一 R-free 校验器（validate_boot.py，229 断言），并对未 Publish 的依赖声明保持为零以规避 L0i hard-fail；上游真实 R 测试（tests/parallel-censboot.R + 25 man 页 915 例）留待本地自建 R 运行时实测"
  - "R .rda 数据的 R-free 校验法：gzip 1f 8b + 解压后 5 字节魔数 {RDX2/RDX3/RDA2/RDA3} + 列名以 R 序列化 CHARSXP 前缀（00 00 04 09 + 4 字节长度 + 名字）在字节流中定位，可在无 R 环境精确核验数据集列名"
