# boot 1.3-32 源码声明
#
# 上游：CRAN R 包 "boot"（Bootstrap Functions，Davison & Hinkley 1997, CUP）
#   https://cran.r-project.org/package=boot
# 源码 tarball：https://cran.r-project.org/src/contrib/boot_1.3-32.tar.gz
#   sha256     = 3a05aced6fea42a5c310c5c6ab7a2019f69f757f5e77c4961183977747136c97
#   size       = 238282 bytes
#   tar_format = tar.gz
#   tarball 根目录为 boot/，故 source() 用 get(strip_root=True) 剥离
#
# URL 采用「4 个权威镜像在前 + CRAN 官方兜底」的列表形式（R39：只允许官方/权威源）：
#   mirrors.tuna.tsinghua.edu.cn / mirrors.ustc.edu.cn / mirror.nju.edu.cn /
#   mirrors.cernet.edu.cn
# sha256 一致性核验：上述 4 个镜像的 boot_1.3-32.tar.gz 实测 HTTP 200，且
# tarball sha256 与官方 cran.r-project.org 完全一致（= 上列 sha256），
# 因此任一镜像下载到的文件都能通过同一 sha256 校验；官方站点同样实测 HTTP 200 兜底。
# Conan download() 按列表顺序尝试，任一下载失败自动切下一个（仅需其一成功）。
# 禁止 file:// / 代理前缀 / 本地路径（PF7 源 URL 闸）。
sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/CRAN/src/contrib/boot_1.3-32.tar.gz"
    - "https://mirrors.ustc.edu.cn/CRAN/src/contrib/boot_1.3-32.tar.gz"
    - "https://mirror.nju.edu.cn/CRAN/src/contrib/boot_1.3-32.tar.gz"
    - "https://mirrors.cernet.edu.cn/CRAN/src/contrib/boot_1.3-32.tar.gz"
    - "https://cran.r-project.org/src/contrib/boot_1.3-32.tar.gz"
  sha256: "3a05aced6fea42a5c310c5c6ab7a2019f69f757f5e77c4961183977747136c97"
  tar_format: "tar.gz"

# boot 是纯 R 语言包（DESCRIPTION: NeedsCompilation: no），无 C/Fortran 源码，
# 无需任何补丁；保持空 map 以满足 L0f patches 段格式校验。
patches: {}
