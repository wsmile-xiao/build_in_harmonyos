# test_package/MANIFEST.yml
# 上游官方测试声明文件 — boot 1.3-32
# CI 脚本 (ci/conan/build_and_test.sh L0e) 强制要求此文件存在。

package: boot/1.3-32
homepage: "https://cran.r-project.org/package=boot"

# ── 上游测试 ────────────────────────────────────────────────────────────────
# boot 是 CRAN R 包，上游以 `R CMD check` 运行 tests/ 下的 R 脚本 + 全部 man
# 页 examples（对比 tests/Examples/boot-Ex.Rout.save）。上游测试资产实测：
#   1) tests/parallel-censboot.R —— 1 个测试脚本（library(survival) 依赖，
#      调用 censboot(..., parallel="multicore", ncpus=2)）；
#   2) tests/Examples/boot-Ex.Rout.save —— 25 个 man 页 examples 的期望输出，
#      其中 "^> " 输入表达式 915 条。
upstream_check_command: "R CMD check boot_1.3-32.tar.gz（需 R 运行时，CI 环境不可用）"

# conanfile.py build() 中是否集成上游测试：
#   false —— CI 环境**无 R 运行时**（ohpcd 无 r-base，无法 tool_requires），
#   上游 R 测试（R CMD check / tests/*.R）在 CI 侧无法执行。build() 代之以
#   R-free 的包树结构/数据校验（test_package/validate_boot.py），保证 CI 日志
#   里有 build 阶段真实测试痕迹（L1b/L1c）。本地由自建 R 运行时实测上游测试。
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/parallel-censboot.R
    source: boot/tests/parallel-censboot.R
    count: 1
    description: >-
      上游并行 censboot 回归测试（Duncan Murdoch 报告，2021-02-04）：
      censboot(boot::aml, statMeanSurv, R=5L, var=1, parallel="multicore",
      ncpus=2L)。需 survival 包 + R 运行时；CI 无 R，故 CI 不执行，
      改由本地 test_package/R/ 脚本实测。
    command: "Rscript tests/parallel-censboot.R（需 R + survival，CI 不可用）"
  - file: tests/Examples/boot-Ex.Rout.save
    source: boot/tests/Examples/boot-Ex.Rout.save
    count: 25
    description: >-
      上游 25 个 man 页 examples 的期望输出（.Rout.save，2008 行，
      其中 "^> " 输入表达式 915 条）。R CMD check 会重跑全部 examples
      并与该基准比对；CI 无 R，故仅校验文件存在与 915 条输入表达式数量。
    command: "R CMD check（examples 逐页重跑并与 .Rout.save 比对，CI 不可用）"

# ── 本仓 test_package 测试（消费者视角，R34 实质校验安装后的包树）──────────
test_package_tests:
  - file: validate_boot.py
    count: 229
    description: >-
      R-free 包树校验器（仅 Python 标准库）：A) DESCRIPTION 逐字段
      （Package/Version/NeedsCompilation=no/License=Unlimited/Depends 含
      R (>= 3.0.0)+graphics+stats/LazyData=yes/ByteCompile=yes）；B) NAMESPACE
      export 集合 == 36 个期望名、import(stats)、importFrom(graphics,...) 8 项、
      7 条 S3method；C) 36 个导出名均在 R/bootfuns.q 或 R/bootpracs.q 中
      有 `<name> <- function` 定义；D) data/ 下 50 个 .rda 均 gzip 魔数 1f 8b +
      可解压 + 头部属 {RDX2/RDX3/RDA2/RDA3}，并抽查 12 个数据集列名
      （CHARSXP 序列化字节）；E) man/ 下 88 个 .Rd、25 个含 examples；
      F) tests/parallel-censboot.R 含 censboot + parallel="multicore"、
      boot-Ex.Rout.save 含 915 条 "^> "；G) 3 项负向自检（不存在路径 /
      复制树后删 NAMESPACE / 删 data/ 必须失败）。
      实测 229 项断言、0 失败；lib/ 被移走时失败（L1e 依赖）。
    command: "python3 validate_boot.py <package_folder>"
  - file: run_test.sh
    count: 229
    description: >-
      POSIX sh 入口（满足 L0c 的 .sh 测试源），set -e 后 exec
      validate_boot.py，透传 <dir>；断言数同 validate_boot.py。
    command: "sh run_test.sh <package_folder>"

# 测试断言总数（validate_boot.py 实测：229 项断言、0 失败）
assertion_count: 229
