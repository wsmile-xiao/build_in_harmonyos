software: boot
display: "boot (Bootstrap Functions)"
description: "CRAN R package: Bootstrap Functions (Davison & Hinkley 1997) — pure R, no compilation"
category: data
homepage: "https://cran.r-project.org/package=boot"
license: Unlimited
build_system: "r-package-data-tree"

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "boot 是纯 R 语言包（NeedsCompilation: no），无 C/Fortran 编译，只做 R 包树搬运到 lib/R/library/boot/"
    - "ohpcd 制品仓无 r-base（实测 HTTP 404，全量 7802 配方无 R 系包），且 CI L0i 对未发布依赖 hard-fail → 配方必须零 requires / 零 tool_requires"
    - "CI 无 R 运行时：build()/test_package 两侧跑 R-free 校验器（validate_boot.py，229 断言）；上游 R 测试由本地自建 R 运行时实测"
    - "package_info 只定义 R_BOOT_PACKAGE_DIR，不臆造 cpp_info.libs（包内无库文件）"
  common_dependencies: []

# 版本索引
versions:
  "1.3-32":
    status: built
    build_date: "2026-10-10"
    conan_ref: "boot/1.3-32"
