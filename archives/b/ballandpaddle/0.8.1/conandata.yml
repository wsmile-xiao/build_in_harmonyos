# conandata.yml — ballandpaddle 0.8.1
# GNU Ball and Paddle：SDL 1.2 时代的打砖块游戏，关卡/皮肤用内嵌 Guile 脚本描述。
# 官方 GNU dist tarball 自带 configure / Makefile.in / po/Makefile.in.in
# （无需 autoreconf，也无需 autopoint 生成 gettext 基础设施）。

sources:
  url: "https://ftp.gnu.org/gnu/ballandpaddle/ballandpaddle-0.8.1.tar.gz"
  sha256: "de82d17ab032e9a997eb0537820053d6a84661b283df1be7724756d054f3f77d"

patches:
  # HMDFS 下 configure 用 umask 077 建临时目录不可写（configure:7360 一带），
  # 表现为 configure 打印成功但 Makefile 从未生成 / subs-1.sed: Permission denied。
  # 同仓库先例：archives/s/sdl_image/1.2.12 的 0001-configure.patch。
  - patch_file: "patches/0001-configure-umask.patch"
    patch_description: "configure/config.status 用 umask 022 建临时目录，规避 HMDFS 0700 目录不可写"
    patch_type: "portability"
  # configure.ac:29 用 AC_CHECK_LIB(guile, ...) 即按 `-lguile` 找库；Guile 1.8 时代
  # soname 是 libguile.so，而已发布的 guile/2.2.7 是 libguile-2.2.so（无 libguile.so）。
  # 源码本身用的就是 Guile 2.x API，故只把探针库名对齐到实际 soname，不改行为。
  - patch_file: "patches/0002-configure-guile-soname.patch"
    patch_description: "AC_CHECK_LIB 的 guile 探针库名 -lguile → -lguile-2.2（与 guile/2.2.7 已发布 soname 一致）"
    patch_type: "portability"
  # Guile 2.2 的 scm_t_subr 是 `typedef void *`（libguile/scm.h），而 main.cpp 是 C++：
  # 函数指针到 void* 的隐式转换 C 允许、C++ 禁止，clang 报
  # `no matching function for call to 'scm_c_define_gsubr'`（68 处注册全中）。
  # 把 `(SCM (*)() ) fcn` 换成 API 自己的形参类型 `(scm_t_subr) fcn`，语义不变。
  - patch_file: "patches/0003-src-main-gsubr-subr-cast.patch"
    patch_description: "68 处 scm_c_define_gsubr 的实参转换 (SCM (*)() ) → (scm_t_subr)（Guile 2.2 的 scm_t_subr 是 void*，C++ 需显式转换）"
    patch_type: "portability"
