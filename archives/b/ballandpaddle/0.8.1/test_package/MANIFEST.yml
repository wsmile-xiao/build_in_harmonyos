# test_package/MANIFEST.yml
# CI 脚本 (ci/conan/build_and_test.sh L0e) 要求本文件存在。
# R51 — 上游测试清单（2026-09-21 对 ballandpaddle-0.8.1 官方 tarball 审计）

package: ballandpaddle/0.8.1
homepage: "https://www.gnu.org/software/ballandpaddle/"

# ── R51 上游测试清单 ────────────────────────────────────────────────
# ballandpaddle 0.8.1 **没有**自动化测试套件。2026-09-21 对官方 tarball
# （sha256 de82d17ab032e9a997eb0537820053d6a84661b283df1be7724756d054f3f77d）
# 的审计证据：
#   $ grep -n 'TESTS\|check_PROGRAMS\|check_SCRIPTS' Makefile.am src/Makefile.am
#       -> 无输出（automake 的 check 目标仅按 SUBDIRS 递归，无任何测试目标）
#   $ ls src/ | grep -i test        -> 无输出（24 个 .cpp 全是游戏本体）
#   $ ls doc/                       -> ballandpaddle.{info,man,texi} fdl.texi
#                                      stamp-vti version.texi，无测试文档
#   $ ls po/                        -> 只有 de/ja 两份翻译，无测试夹具
# => 上游测试：0 个文件、0 个注册用例、0 条断言、0 次执行。
upstream_check_command: "grep -n 'TESTS\\|check_PROGRAMS' Makefile.am src/Makefile.am  # 无输出，上游无测试目标"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── test_package 测试（消费者侧验证）───────────────────────────────
# test_ballandpaddle.sh 实跑**安装后的** bin/ballandpaddle，断言 30 项。
test_package_tests:
  - file: test_ballandpaddle.sh
    description: >
      实跑安装后的 ballandpaddle 二进制：--version 报 0.8.1 且版本串完整；
      --help 输出 Usage 与三个受支持选项；--level 缺值 / --level 1（三件套不全）
      两条参数校验路径给出文档化诊断；并核对 14 个安装产物（levelsets、
      FreeSans.ttf、kochi-gothic.ttf、images/*.png、levels/**/*.scm 与皮肤、
      .desktop、man1、README）。
    command: "sh test_ballandpaddle.sh <package_folder>"

assertion_count: 30

# ── rule12 鸿蒙特有测试 ────────────────────────────────────────────
# 鸿蒙特有集 = B 组（--version，5 条）+ C 组（--help，5 条）= 10 条。这 10 条必须
# **真实执行已安装的 OHOS aarch64 二进制**才能得到输出，而输出由内嵌 Guile 解释器
# boot 完成后的回调 inner_main() 打印（scm_boot_guile(argc, argv, inner_main, 0)），
# 且发生在 SDL 初始化（initAudio / gameStateManager.init）之前。
# 因此「能打印」同时证明了：
#   (1) 该 ELF 在 OHOS 上可执行 —— 动态加载器解析了 libguile-2.2.so（shared）及其
#       全部传递依赖 libgc / libffi / libunistring / libgmp；漏一个就在 main() 之前
#       被拒绝，拿到的是 cannot open shared object 这种**另一种 stderr**；
#   (2) 内嵌的 Guile 2.2 解释器在 OHOS 上 boot 成功（含 ice-9 字节码加载路径，
#       即 GUILE_LOAD_PATH / GUILE_LOAD_COMPILED_PATH 体系可用）——
#       inner_main 是 scm_boot_guile 的回调，Guile 初始化完成前不会被调用；
#   (3) patches/0002 把 configure 的 guile 探针库名（-lguile → -lguile-2.2）对齐到
#       已发布 soname 之后，链接确实命中本配方依赖的 guile（否则 configure 期就报
#       "can't find guile. This software REQUIRES guile."）。
mohos_specific_tests:
  - file: test_ballandpaddle.sh
    description: >
      B 组 5 条 + C 组 5 条：在 OHOS aarch64 上实跑打包后的游戏二进制，断言
      Guile 2.2 嵌入式解释器 boot 后由回调 inner_main() 打印的 --version 与
      --help 全文（含退出码 0），等价于「动态链接链 + Guile boot 全部在 OHOS 上通过」。
    assertion_count: 10

# 未执行项（如实登记，附技术理由）：
#   真正的游戏循环 —— SDL 显示窗口 + 音频 + 从编译期 BAP_DATADIR(=/share/ballandpaddle)
#   读取关卡脚本与皮肤。CI 沙箱无显示设备，且包安装根不是 `/`（数据面位于
#   <package_folder>/share/ballandpaddle），故本脚本只断言数据面**已安装且非空**，
#   不断言运行期加载。这也是 --help/--version 之外的路径一律不被计入通过率的原因。
unexecuted:
  - item: "游戏主循环（SDL 显示/音频 + 关卡脚本 loadImages）"
    reason: "CI 沙箱无显示设备；且 BAP_DATADIR 为编译期绝对路径 /share/ballandpaddle，测试期包目录不等于安装根，无法在不改动被测产物的前提下满足"
