# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# ⚠️ 如实声明测试来源：上游 bliss 0.77【无任何官方测试】
# （无 tests/ 目录，仅 examples/enumerate.cc 示例，无官方测试程序）。
# 本包测试均为 OHOS 适配自研（见下方 test_package_tests）。

package: bliss/0.77
homepage: "https://users.aalto.fi/~tjunttil/bliss/"

# 上游官方测试：无（已核实：v0.77 zip 内无 tests 目录，
# 仅 examples/enumerate.cc 示例程序，无官方测试用例）
upstream_official_tests: []

# 构建阶段执行的测试命令：无（上游无 make check 测试集）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 适配补全测试（自研，非上游）：无（消费者验证集中在 test_package）
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test.cpp
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：构造 Petersen 图（外五边形 + 内五角星步长 2），C++ API canonical_form 计算自同构群大小 = 120（S5），经 Stats 公共 getter 验证；同时检查包内 bliss CLI 可执行"
    command: "./test_bliss"

# 测试断言总数 (实际统计：4 项断言，全部为适配自研断言)
assertion_count: 4
