# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bctoolbox/5.3.115
homepage: "https://gitlab.linphone.org/BC/public/bctoolbox"

# ── 上游测试：已在包构建中真实编译并执行 ────────────────────────────────
# 上游 tester 是 bcunit 驱动的 bctoolbox-tester 可执行文件
# (tester/CMakeLists.txt: add_test(NAME bctoolbox_tester COMMAND bctoolbox_tester --verbose))。
# 本配方的 build() 在 cmake.build() 之后直接执行该二进制，退出码决定包构建成败，
# 因此每次 `conan create` 的日志都带完整 Run Summary。
upstream_check_command: "bctoolbox-tester   # build() 内直接执行（tester/bctoolbox-tester）"
upstream_test_in_build: true
upstream_test_command: "\"<build_folder>/tester/bctoolbox-tester\""

# ── 分母（与审方数法一致）────────────────────────────────────────────
# 审方以「上游注册用例总数」为分母。取数命令：
#   grep -oE "TEST_NO_TAG|TEST_ONE_TAG|TEST_TWO_TAG" tester/*.c tester/*.cc | wc -l
# → 35。分布：containers 7, crypto 10, encrypted_vfs 5, utils(tester/port.c) 4,
#   vfs 3, parser 2, param_string 2, logger 2。
#   tester/ios_utils.cc 为 __APPLE__ 专用（编译与注册双重排除），OHOS 不计入。
upstream_test_total: 35

# ── 实测结果（两套配置，日志与报告见下）──────────────────────────────
# 交付配置 (ENABLE_MBEDTLS=OFF，即发布包；无 mbedtls 依赖)：
#   suites 6 / tests 20 / passed 20 / failed 0 / asserts 779        → 20/20 PASS
#   日志: reports/conan-create.log（conan-verify 干净轮）；$HOME/tmp/bctoolbox-5.3.115/create-bcunit513-round6.log
#   crypto(10) 与 encrypted_vfs(5) 由上游 tester/CMakeLists.txt 的 if(MbedTLS_FOUND) 门控，
#   且 bctoolbox_tester.c 内为 #if (HAVE_MBEDTLS)：该配置下这 15 个用例未编译（非 PASS 也非 SKIP）。
# 全特性验证配置 (ENABLE_MBEDTLS=ON + 测试专用 mbedtls 3.6.6，仅测试用、不进包依赖链)：
#   suites 8 / tests 35 / passed 35 / failed 0 / asserts 103688     → 35/35 PASS
#   日志: $HOME/tmp/bctoolbox-5.3.115/full-feature-create.log
#   报告: reports/upstream-test-full-feature.md（含验证变体与交付配方的逐项差异、
#         任务私有 mbedtls 3.6.6 的来源/校验和/refs、以及必须启用 MBEDTLS_THREADING_C+ALT 的实测依据）
upstream_test_result:
  delivered_config:
    mbedtls: false
    suites: 6
    tests_total: 20
    passed: 20
    failed: 0
    asserts: 779
  full_feature_config:
    mbedtls: "3.6.6 (task-private source build, test-only)"
    suites: 8
    tests_total: 35
    passed: 35
    failed: 0
    asserts: 103688

# 逐套件用例数（分母构成；交付配置中未编译的套件标注 not_compiled）
upstream_tests:
  - suite: Containers
    cases: 7
    delivered_config: compiled
  - suite: Crypto
    cases: 10
    delivered_config: not_compiled
    reason: "上游 if(MbedTLS_FOUND) 门控；ohpcd 仅有 mbedtls/4.1.0（v4 API 与本版本不兼容，缺 mbedtls/ctr_drbg.h）"
  - suite: Encrypted vfs
    cases: 5
    delivered_config: not_compiled
    reason: "同上（mbedtls 后端门控）"
  - suite: Utils
    cases: 4
    delivered_config: compiled
  - suite: vfs
    cases: 3
    delivered_config: compiled
  - suite: Parsing
    cases: 2
    delivered_config: compiled
  - suite: Param string
    cases: 2
    delivered_config: compiled
  - suite: Logging
    cases: 2
    delivered_config: compiled

# 依赖处置（与 conanfile.py 一致）
dependencies_notes:
  - "bcunit/5.3.113: 上游 ENABLE_TESTS_COMPONENT=ON 时硬性 find_package(BCUnit 3.0.2 REQUIRED)；"
  - "  以 test_requires 声明（仅测试用，不进入消费方依赖链，消费者图里为 Skipped binaries）。"
  - "mbedtls: 交付包不启用（ENABLE_MBEDTLS=OFF）；35 用例中的 15 个 crypto/encrypted_vfs 用例"
  - "  在测试专用 mbedtls 3.6.6 的验证配置下执行（见 upstream_test_result.full_feature_config）。"
  - "decaf: 未发布于 ohpcd，ECC 特性关闭（上游软可选，无 stub）。"

# test_package 中自带的测试 (消费者视角验证；同一 SHA 的 conan create 内执行)
test_package_tests:
  - file: test_bctoolbox.c
    description: "C API 消费者: bctbx_list 增删计数 + 日志 handler 回调回路"
    command: "./bin/test_bctoolbox"
    result: "3/3 PASS"
  - file: test_bctoolbox_cpp.cpp
    description: "C++ API 消费者: bctbx_is_matching_regex 正反匹配 + BctbxException 抛出捕获"
    command: "./bin/test_bctoolbox_cpp"
    result: "3/3 PASS"

# 测试断言总数 (test_package 自带消费者测试)
# test_bctoolbox.c: 3 项 check; test_bctoolbox_cpp.cpp: 3 项 check
assertion_count: 6
