sources:
  url: "https://github.com/BelledonneCommunications/bctoolbox/archive/refs/tags/5.3.115.tar.gz"
  sha256: "c2152de18c63ff2557cfae3b5180c76814b53680c42156ff37e5bc82ad81106c"

patches:
  - patch_file: "patches/0001-src-utils-port.c.patch"
    patch_description: "0001 src utils port.c bctbx_clean zeroization fallback when no crypto backend is compiled"
    patch_type: "portability"
  - patch_file: "patches/0002-src-utils-port.c-freeaddrinfo-null.patch"
    patch_description: "0002 src utils port.c bctbx_freeaddrinfo must accept a NULL list like freeaddrinfo does, instead of dereferencing it"
    patch_type: "portability"
  - patch_file: "patches/0003-tester-port.c-addrinfo-sort.patch"
    patch_description: "0003 tester port.c addrinfo sort case takes its IPv6 entry from a documentation-range literal instead of a name that has no IPv6 answer on this platform"
    patch_type: "portability"
  - patch_file: "patches/0004-src-tester.c-mallinfo-glibc-only.patch"
    patch_description: "0004 src tester.c call mallinfo only on glibc, the symbol is not usable on the OHOS C library and corrupted the tester process"
    patch_type: "portability"
