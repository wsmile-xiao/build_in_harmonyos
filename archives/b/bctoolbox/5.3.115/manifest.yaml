# 版本级 manifest — bctoolbox 5.3.115
# 遵循 ARCHIVE-SPEC v3.0

version: "5.3.115"
software: "bctoolbox"
status: built
build_date: "2026-09-11"
conan_ref: "bctoolbox/5.3.115"

source:
  url: "https://github.com/BelledonneCommunications/bctoolbox/archive/refs/tags/5.3.115.tar.gz"
  sha256: "c2152de18c63ff2557cfae3b5180c76814b53680c42156ff37e5bc82ad81106c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_TESTS_COMPONENT=ON"
    - "-DENABLE_UNIT_TESTS=ON"
    - "-DENABLE_MBEDTLS=OFF"
    - "-DENABLE_DECAF=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"   # 默认 static；shared 变体由 options.shared 控制
  # 交付包依赖链为空：上游 tester 需要的 BCUnit 以 test_requires 声明（仅测试用，
  # 不进入消费方依赖链），mbedtls 不启用。测试专用 mbedtls 3.6.6 不属本包依赖。
  dependencies: []
  test_requires:
    - "bcunit/5.3.113"   # 上游 find_package(BCUnit 3.0.2 REQUIRED)；ohpcd 已发布
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-utils-port.c.patch"
  - "0002-src-utils-port.c-freeaddrinfo-null.patch"
  - "0003-tester-port.c-addrinfo-sort.patch"
  - "0004-src-tester.c-mallinfo-glibc-only.patch"

# 上游测试（在 build() 内真实执行，退出码决定包构建成败）
tests:
  upstream_total: 35            # 注册用例总数，取数命令见 test_package/MANIFEST.yml
  delivered_config:             # ENABLE_MBEDTLS=OFF（= 发布配置）
    suites: 6
    passed: 20
    failed: 0
    asserts: 779
  full_feature_config:          # ENABLE_MBEDTLS=ON + 测试专用 mbedtls 3.6.6（仅测试用）
    suites: 8
    passed: 35
    failed: 0
    asserts: 103688
    report: "reports/upstream-test-full-feature.md"
  test_package:
    passed: 6
    failed: 0

knowledge_gained:
  - "核心库 vfs.c 引用 bctbx_clean 而其定义仅在 mbedtls 后端文件；关闭 ENABLE_MBEDTLS 构建时共享库带未定义符号、运行期 relocation 失败，需在 port.c 提供零化兜底（knowledge_ref: notes.md 发现与知识#1）"
  - "bctoolbox 5.3 的 mbedtls 包装器仅兼容 v2/v3 API；mbedtls 4 移除 ctr_drbg.h 等头文件直接致命错误；ohpcd 仅有 mbedtls/4.1.0 时应关闭 ENABLE_MBEDTLS（knowledge_ref: notes.md 发现与知识#2）"
  - "bctoolbox 在 ENABLE_TESTS_COMPONENT=ON 时硬性 find_package(BCUnit 3.0.2 REQUIRED)；BC 系仓按 linphone SDK 锁步打 tag 且项目内版本号冻结在 3.0.2，必须按内容时代选版本（5.3.113 才含 CU_Suite.pUserData / CU_automated_enable_partial_junit），并以 test_requires 声明以免进入消费方依赖链（knowledge_ref: notes.md 发现与知识#3）"
  - "CMakeDeps 默认 SameMajorVersion：依赖包 ref 版本与其内部项目版本跨大版本时必须 set_property(cmake_config_version_compat=AnyNewerVersion)，否则 CONFIG 模式拒绝 config 文件并回退 MODULE 模式二次 find_package 报错（knowledge_ref: notes.md 发现与知识#4）"
  - "conan_toolchain.cmake 固定 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON，上游自带 FindXxx.cmake 成死代码，其 Xxx_TARGET 与写进 config.h 的 HAVE_* 特性宏全部落空；必须在 generate() 预置这些变量（knowledge_ref: notes.md 发现与知识#5）"
  - "CMake 4.1.2 无 HarmonyOS 平台文件时打印 System is unknown to cmake，但 check_include_file/check_library_exists 探测仍正确工作（execinfo.h/rt/dl 全部检出），不构成阻塞（knowledge_ref: notes.md 发现与知识#6）"
  - "C 形态 API 的 C++ 静态库必须声明 cpp_info.system_libs 含 c++，否则纯 C 消费者链接 static 归档时在 std::length_error/__cxa_throw/vtable 上失败（E247 同模式）；shared 包因 .so 自带 libc++_shared 依赖无需声明（knowledge_ref: notes.md 发现与知识#7）"
  - "上游 tester 框架 bctbx_freeaddrinfo() 不遵守 freeaddrinfo(NULL) 契约（首行解引用 ai_canonname），其自带用例会合法地传 NULL——包装类 API 的 NULL 语义必须与底层 libc 对齐（knowledge_ref: notes.md 发现与知识#8）"
  - "mallinfo()/mallinfo2() 是 glibc 设施；OHOS libc 头文件按 API≥20 声明但运行期不可用，调用后进程必崩（独立探针 rc=139），上游 #ifdef __linux__ 宽判据会引入该崩溃，应按 libc 族（__GLIBC_PREREQ）判定（knowledge_ref: notes.md 发现与知识#9）"
  - "依赖源码测试若依赖外网解析（sip3.linphone.org 的 IPv6 记录），无 IPv6 设备上断言前提消失甚至空指针崩溃；用例地址来源应改为保留字面量（knowledge_ref: notes.md 发现与知识#10）"
  - "bctoolbox ≥5.3 在 mbedtls ≥3.6 上走 PSA + ALT 线程路径（src/crypto/mbedtls.cc 按 0x03060000 门控），要求 mbedtls 以 MBEDTLS_THREADING_C+MBEDTLS_THREADING_ALT 构建；mbedtls 3.6 默认关闭 threading，且线程开关会改变上下文结构体布局，库与消费者必须同配置（knowledge_ref: notes.md 发现与知识#11）"
  - "容器 /proc/stat 报 20 CPU 而 affinity 仅 8，conan 默认 tools.build:jobs 取 os.cpu_count()=20（2.5x 超订）；但逐 TU 实测峰值 RSS≈79 MB、20 路约 1.5–2 GB，不足以造成设备级 OOM（同窗口另有其他用户/会话，/proc 下 140/212 进程不可读），故共享设备上应显式 -c tools.build:jobs，口径是并发卫生而非本包打挂设备（knowledge_ref: notes.md 发现与知识#12）"
  - "build() 内执行自建测试程序时工作目录必须是该可执行文件所在目录：shared 构建记录相对 DT_NEEDED（../src/libbctoolbox.so），加载器按字面路径相对 cwd 解析，从 build 根目录启动会 Error loading shared library 并伴随整串误导性 relocation 失败（knowledge_ref: notes.md 发现与知识#13）"
