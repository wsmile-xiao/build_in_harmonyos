# 软件级 manifest — bctoolbox
# 遵循 ARCHIVE-SPEC v3.0

software: bctoolbox
display: "bctoolbox"
description: "Portable utility toolbox used by Belledonne Communications software (logging; lists; maps; VFS; sockets)"
category: library
homepage: "https://gitlab.linphone.org/BC/public/bctoolbox"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "测试组件打开并在包构建内真实执行上游 tester：ENABLE_TESTS_COMPONENT=ON + ENABLE_UNIT_TESTS=ON，BCUnit 以 test_requires 引入（bcunit/5.3.113，不进入消费方依赖链）"
    - "测试框架适配：上游 FindBCUnit.cmake 因 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON 成死代码，需预置 BCUnit_TARGET/HAVE_CU_* 并把 CMakeDeps 版本兼容性设为 AnyNewerVersion"
    - "修复三处上游在 OHOS 上必崩/必失败的测试路径：bctbx_freeaddrinfo(NULL)、Addrinfo sort 用例的 IPv6 名称解析、tester 收尾的 mallinfo()（glibc 专有）"
    - "ENABLE_MBEDTLS 关闭：5.3 包装器仅兼容 mbedtls v2/v3 API 而 ohpcd 仅有 4.1.0；同时需 bctbx_clean 兜底补丁。mbedtls 门控的 15 个用例改由测试专用 mbedtls 3.6.6 源码包验证（仅测试用）"
    - "ENABLE_DECAF 关闭：decaf 未发布于 ohpcd（上游软可选）"
  common_dependencies: []
  test_requires:
    - "bcunit/5.3.113"

versions:
  "5.3.115":
    status: built
    build_date: "2026-09-11"
    conan_ref: "bctoolbox/5.3.115"
    upstream_tests: "35/35 PASS（交付配置 20/20 + 测试专用 mbedtls 配置 35/35）"
    test_package: "6/6 PASS"
