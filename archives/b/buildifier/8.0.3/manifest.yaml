software: buildifier
version: "8.0.3"

status: built
build_date: "2026-06-01"

source:
  url: "https://github.com/bazelbuild/buildtools/archive/refs/tags/v8.0.3.tar.gz"
  sha256: "573345c2039889a4001b9933a7ebde8dcaf910c47787993aecccebc3117a4425"
  tar_format: tar.gz

build_system: go
build:
  system: go
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOPROXY=https://goproxy.cn,direct"
    - "-ldflags=-s -w -X main.buildVersion=8.0.3 -X main.buildScmRevision=v8.0.3"
  dependencies:
    - "go/1.26.3"
  cc: go1.26.3
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Go项目在HarmonyOS上必须使用Go 1.26.3（1.26.0二进制corrupted）"
  - "Go项目无需configure/make，直接go build -o指定输出路径"
  - "buildifier源码包来自bazelbuild/buildtools仓库，编译子包./buildifier"
  - "Go ldflags -X注入版本号: main.buildVersion和main.buildScmRevision"
  - "GitHub直连超时，需用ghfast.top镜像下载"
