software: bruno-cli
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.4.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.4.2"
build_system: npm

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://registry.npmjs.org/@usebruno/cli/-/cli-3.4.2.tgz"

  # 源码校验和
  sha256: "f46a10c0d90ea905c00d44e4e1b9e74293d2146836498734f686cf2dc98570b3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: npm

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器 (不用于 npm 构建系统)
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 JavaScript npm CLI 可用『conan 打包 + node --jitless shell launcher』路径适配（对齐 uglify/bootstrap 先例），build() 用 npm install --ignore-scripts 装依赖并随包分发 node_modules"
  - "worker 侧 CI 失败若为 zsh fork OOM（worker-prep/git-clone 全挂）属基础设施故障，配方未被真正执行，重触发 /rebuild 即可，勿盲目改配方"
  - "PF8/L0p 要求 settings 四项齐全（os/arch/compiler/build_type），npm 类 application 配方也不例外（bootstrap/ai-cli 同构）"
