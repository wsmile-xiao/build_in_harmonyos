software: borgbackup
description: Deduplicating backup program with compression and authenticated encryption
category: backup
homepage: https://www.borgbackup.org/

versions:
  - version: "1.4.4"
    status: built
    build_date: "2026-06-03"

dependencies:
  runtime:
    - python3 >= 3.14
    - openssl
    - liblz4
    - libzstd
    - libxxhash
    - msgpack
  build:
    - Cython
    - pkgconfig
    - setuptools_scm