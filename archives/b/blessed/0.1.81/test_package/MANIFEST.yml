name: blessed
version: 0.1.81
upstream_url: https://github.com/chjj/blessed

test_manifest:
  - type: test
    build_system: npm
    source:
      - "test.sh"
    description: "L0c 测试源文件入口，串行执行上游冒烟测试与鸿蒙专属测试"
  - type: test
    build_system: npm
    source:
      - "test_upstream.js"
    description: "上游冒烟测试：验证 blessed 核心 API (screen/box/list/button) 导出正常，且能创建 Screen 和 Box 实例"
  - type: test
    build_system: npm
    source:
      - "test_harmonyos.js"
    description: "鸿蒙专属测试：在 OHOS 设备上验证真实 Conan 包消费，通过 NODE_PATH 定位包，执行 6 项功能性断言"
