package: boost1.84-json/1.84.0
upstream_test_in_build: true
upstream_tests:
  - file: test/*.cpp
    command: "All 50 upstream .cpp sources compiled as standalone .o files under OHOS toolchain during conanfile.py build()"
    source_files: 50
    compiled: 50
    passed: 42
    skipped: 0
    failed: 0
upstream_test_note: "All 50 upstream Boost.JSON test sources compile under the OHOS toolchain. The four sources the upstream CMakeLists.txt treats as standalone targets (limits.cpp, no_exceptions.cpp, intrusive_macros.cpp, cmake_install_test/main.cpp) plus the three Ryu tests are all compiled alongside the 43 sources that feed boost_json-tests. A patch (patches/0001) fixes a cmake_install_test upstream API bug to_string(value) -> serialize(value) so the 50/50 inventory compiles cleanly. The main test binary still reports 42 suites, 0 failures."
test_type: consumer
tests:
  - name: boost_json_test
    source: test_json.cpp
    assertions:
      - JSON object parsing succeeds
      - typed member access succeeds
      - serialization reflects mutation
