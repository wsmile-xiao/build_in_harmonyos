package: bamtools/2.5.3
homepage: "https://github.com/pezmaster31/bamtools"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "cmake.test()"
upstream_tests:
  - file: tests/CMakeLists.txt
    source: bamtools-2.5.3/tests/CMakeLists.txt
    description: "Validate the bamtools command help path"
    command: "bamtools --help"
  - file: tests/CMakeLists.txt
    source: bamtools-2.5.3/tests/CMakeLists.txt
    description: "Run bamtools stats on the upstream SAM specification BAM fixture"
    command: "bamtools stats -in tests/data/sam_spec_example.bam"

test_package_tests:
  - file: test.cpp
    description: "Link the packaged C++ API and verify BamAlignment mapped-flag mutations"
    command: "./test_bamtools"

assertion_count: 5
