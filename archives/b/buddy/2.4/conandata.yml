# conandata.yml — buddy 2.4
# 源码: SourceForge 官方项目发布物，SHA-256 已真机下载核对，
# 与 spack 官方配方记录值及 Debian/Ubuntu archive 原始包三方一致。
sources:
  url:
    - "https://sourceforge.net/projects/buddy/files/buddy/BuDDy%202.4/buddy-2.4.tar.gz"
    - "https://downloads.sourceforge.net/project/buddy/buddy/BuDDy%202.4/buddy-2.4.tar.gz"
    - "https://deb.debian.org/debian/pool/main/b/buddy/buddy_2.4.orig.tar.gz"
  sha256: "d3df80a6a669d9ae408cb46012ff17bd33d855529d20f3a7e563d0d913358836"

patches:
  - patch_file: "patches/0001-ohos-configure-umask.patch"
    patch_description: >
      HMDFS 上 umask 077 创建的 0700 临时目录对进程不可写（表现为
      drwx--S---），autoconf 2.59 config.status 建 confstat 临时目录失败、
      config.h 不生成。按知识库 E011 方法 2 将 configure 中两处
      umask 077 放宽为 umask 022（子 shell 局部作用域，不影响安装产物）。
      真机对照实测：umask 022 + mktemp -d 可写，umask 077 + mktemp/mkdir
      均不可写（2026-09-05）。
    patch_type: "portability"
