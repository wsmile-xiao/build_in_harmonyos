# test_package/MANIFEST.yml — buddy 2.4
# Upstream and consumer test declaration required by CI L0e.

package: buddy/2.4
homepage: "https://sourceforge.net/projects/buddy/"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "buddy-2.4.tar.gz (official SourceForge release, SHA-256 verified)"
  source_sha256: "d3df80a6a669d9ae408cb46012ff17bd33d855529d20f3a7e563d0d913358836"
  build_system: "Autotools (autoconf 2.59 / automake 1.7.3 / libtool)"
  test_definition: >
    Upstream has no automake TESTS wiring. Every suite under examples/ ships
    a check_PROGRAMS binary, a tcsh runtest script and an expected/ golden
    file; examples/runregression is the tcsh driver. make check therefore
    only builds the 9 check_PROGRAMS (adder, bddcalc, bddtest, cmilner, fdd,
    milner, money, queen, solitare). The recipe runs make check for the
    builds and then reproduces every runtest script 1:1 with sh (the device
    has no tcsh; each script only pipes program output through
    "egrep -v '^Garbage collection'" into ./result) and compares ./result
    against the upstream golden file expected/.
  dependency: >
    tcsh scripts replaced by sh-equivalent loops (tcsh not installed on this
    device; script bodies reproduced verbatim, including the
    '^Garbage collection' output filter and the result append order).
    No other substitution.
  portability_changes:
    - >
      bddtest comparison is equivalence-based instead of byte-exact:
      bddtest.cxx (lines 107-109) drives assertion sizes from rand(), and
      musl (OHOS) yields a different rand() sequence than the glibc machine
      that generated expected/. Both files reduce to the same 65 assertion
      lines "Checking bdd with assignments: Sum-OK. Sub-OK." after number
      normalization and sorting; the conanfile fails the build unless the
      normalized multisets are equal and no FAILED/Error token appears.
      The other 7 suites are compared byte-for-byte against expected/.
  examples_note: >
    solitare builds as a check_PROGRAMS binary under make check but ships no
    runtest/expected pair upstream (examples/runregression only iterates
    suites with both files), so it is an example program, not a test case:
    it contributes 0 cases and is excluded from the totals below.

upstream_check_command: "make check (builds the regression binaries) + per-suite sh runtest loops vs expected/ golden files"
upstream_test_in_build: true
upstream_test_command: "same, executed inside conan build() on the final package sources"

# Counting units (all numbers come from the final build log, not estimates):
#   primary unit = program invocation (one "Running with ..." header or one
#   single-shot run in a runtest loop);
#   secondary unit = suite-level golden comparison (8 suites);
#   bddtest additionally reports 65 assertion lines (one per output line).
# Take-number commands:
#   grep -c '^Running with' examples/adder/result           -> 28
#   grep -c '^Running with cal file' examples/bddcalc/result -> 7
#   grep -c '^Running with' examples/cmilner/result          -> 7
#   grep -c '^Running with' examples/milner/result           -> 8
#   grep -c '^Running with' examples/queen/result            -> 4
#   (fdd, money: single-shot runs = 1 each; bddtest: wc -l result = 65)
upstream_tests:
  - test_name: "adder"
    source: "examples/adder/adder.cxx"
    kind: "regression-suite"
    invocations: 28
    command: "for N in 4 8 11 14; for r in win2 win2ite win3 win3ite sift siftite adder"
    comparison: "byte-exact diff vs expected/"
  - test_name: "bddcalc"
    source: "examples/bddcalc/*.cal (7 calculator programs)"
    kind: "regression-suite"
    invocations: 7
    command: "bddcalc per .cal file (./*.cal examples/*.cal)"
    comparison: "byte-exact diff vs expected/"
  - test_name: "bddtest"
    source: "examples/bddtest/bddtest.cxx"
    kind: "regression-suite (randomized)"
    invocations: 1
    assertion_lines: 65
    command: "./bddtest > result"
    comparison: >
      equivalence vs expected/: normalized (assignment numbers removed) and
      sorted line multisets must be equal; all 65 lines must assert
      "Sum-OK. Sub-OK."
  - test_name: "cmilner"
    source: "examples/cmilner/cmilner.cxx"
    kind: "regression-suite"
    invocations: 7
    command: "cmilner for N in 4 10 16 20 30 50 64"
    comparison: "byte-exact diff vs expected/"
  - test_name: "fdd"
    source: "examples/fdd/fdd.cxx"
    kind: "regression-suite"
    invocations: 1
    command: "./fdd"
    comparison: "byte-exact diff vs expected/"
  - test_name: "milner"
    source: "examples/milner/milner.cxx"
    kind: "regression-suite"
    invocations: 8
    command: "milner for N in 4 10 16 20 30 50 64 80"
    comparison: "byte-exact diff vs expected/"
  - test_name: "money"
    source: "examples/money/money.cxx"
    kind: "regression-suite"
    invocations: 1
    command: "./money"
    comparison: "byte-exact diff vs expected/"
  - test_name: "queen"
    source: "examples/queen/queen.cxx"
    kind: "regression-suite"
    invocations: 4
    command: "queen for N in 4 8 9 10"
    comparison: "byte-exact diff vs expected/"

upstream_test_total: 57
upstream_test_passed: 57
upstream_test_failed: 0
upstream_test_skipped: 0
upstream_test_not_run: 0
upstream_test_suites_total: 8
upstream_test_suites_passed: 8
upstream_excluded_note: >
  solitare: check_PROGRAMS binary built by make check, but upstream ships no
  runtest script or expected/ golden file (see examples_note), so it is not
  a test case and is excluded from totals; its successful build is covered
  by make check.

# Consumer-perspective checks: C core API (init/setvarnum, boolean algebra,
# De Morgan via unique-node identity, support/scanset/makeset, satone),
# C++ wrapper classes (bdd operators, id(), tautology/contradiction),
# finite-domain extensions (fdd_extdomain/domainsize/ithvar/scanvar) and
# bit-vector arithmetic (bvec con/var/add/equ, constant folding), plus a
# reorder-invariance check (bdd_swapvar preserves satcount). Each CHECK has
# a failure exit path (message + exit 1).
test_package_tests:
  - file: test_buddy.cpp
    scenario: "consumer-api"
    description: >
      Build and run a Conan consumer that links buddy::bdd and exercises the
      C core, C++ wrapper, fdd and bvec APIs plus reorder invariance.
    command: "./test_buddy"
    assertions: 60

assertion_count: 60
