version: "2.4"
software: "buddy"
status: built
build_date: "2026-09-05"
build_system: autotools

source:
  url: "https://sourceforge.net/projects/buddy/files/buddy/BuDDy%202.4/buddy-2.4.tar.gz"
  sha256: "d3df80a6a669d9ae408cb46012ff17bd33d855529d20f3a7e563d0d913358836"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu (config.guess 不识别 HarmonyOS 内核)"
    - "--enable-static --disable-shared (默认 shared=False)"
    - "--enable-shared --disable-static (shared=True 时)"
  dependencies: []
  cc: clang
  cxx: clang++
  compiler: clang
  parallelism: 1

patches_applied:
  - "0001-ohos-configure-umask.patch (HMDFS 上 umask 077 临时目录不可写; E011 方法 2)"

knowledge_gained:
  - "HMDFS 上 umask 077 创建的 0700 临时目录对当前进程不可写(目录呈 drwx--S---),autoconf 2.59 config.status 的 mktemp/mkdir 两条路径全部失败且 config.h 不生成;umask 022 下 mktemp -d 实测可写,E011 方法 2(sed umask 077→022)真机复验有效;bash/5.3 的 mktemp-exit-1 包装器依赖的 mkdir 回退同样带 umask 077、真机实测同样不可写 (reference: archives/b/buddy/2.4/notes.md 遇到的问题与解决方案 #1;知识库 E011/E118/E136)"
  - "buddy 2.4 的 C++ 包装由 bdd.h 的 #ifdef CPLUSPLUS 守卫(__cplusplus 自动定义),libbdd 内含 cppext.cxx 提供类外方法;消费方 C++ 直接 include bdd.h 即可启用 bdd/bvec/fdd 类,无需额外宏 (reference: archives/b/buddy/2.4/notes.md 平台与 API 事实)"
  - "buddy 上游无 automake TESTS 接线:examples/* 的回归由 tcsh runtest 脚本 + expected/ 金标组成,make check 仅构建 check_PROGRAMS;无 tcsh 环境用 sh 1:1 复现脚本体并 diff 金标即可完成全套回归 (reference: archives/b/buddy/2.4/notes.md 上游测试一节)"
  - "bddtest 的断言规模由 rand() 驱动(bddtest.cxx:107-109),musl 与 glibc 伪随机序列不同导致输出与金标非字节一致;数值归一化+排序后多集合比对可实现确定性等价判定 (reference: archives/b/buddy/2.4/notes.md 遇到的问题与解决方案 #2)"
  - "2002 年代 flex/bison 生成代码(lexer.cxx/parser.cxx)的 register 存储说明符在 profile cppstd=17 下为 hard error,按 E293 toolchain-flag 方案在 extra_cxxflags 追加 -Wno-error=register/-Wno-error=dynamic-exception-spec 降级即可,无需改上游生成文件 (reference: archives/b/buddy/2.4/notes.md 遇到的问题与解决方案 #4;知识库 E293)"
  - "buddy 2.4 上游缺陷:bdd_support 的静态 supportSize 缓存跨 bdd_done 不重置(bdd_operator_done 释放缓冲但 bddop.c:2059 的 supportSize 残留),同 varnum 二次 init 会话再调 bdd_support 必 SIGSEGV;多会话消费者应只在首个会话用 bdd_support,后续用 bdd_makeset 显式构造变量集 (reference: archives/b/buddy/2.4/notes.md 遇到的问题与解决方案 #3)"
  - "BuDDy 语义事实:bdd_satcount 在全部已声明变量上计数(非支撑集),按支撑集计数用 bdd_satcountset;fdd_domainsize 返回域值数(256)而非编码位数,位数用 fdd_varnum;C++ 消费端 bdd 类对象必须先于 bdd_done 析构(作用域块) (reference: archives/b/buddy/2.4/notes.md 平台与 API 事实)"

validation:
  upstream_tests:
    command: "make check (构建 check_PROGRAMS) + 逐套件 sh runtest 循环与 expected/ 金标比对"
    statistical_unit: "程序调用(每个 'Running with' 头或单次运行);bddtest 另计 65 条断言行"
    suites: 8
    total: 57
    passed: 57
    failed: 0
    skipped: 0
    not_run: 0
  conan_create:
    command: "conan create archives/b/buddy/2.4 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 --build=missing"
    result: passed
  test_package:
    command: "./test_buddy"
    assertions: 60
    result: passed
  excluded: "solitare: 上游无 runtest/expected,属示例程序不计用例(make check 构建覆盖)"
