software: "buddy"
display: "BuDDy"
description: "BuDDy: 二元决策图 (BDD) 包, C 核心 + C++ 包装类 (bdd/bvec/fdd), 支持变量重排序与有限域向量运算"
category: library
homepage: "https://sourceforge.net/projects/buddy/"
license: "BuDDy-2.4-permissive-notice (Jorn Lind-Nielsen 1996-2002, MIT-like notice, not in SPDX)"
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 不识别 HarmonyOS 内核, 需 --build=aarch64-unknown-linux-gnu"
    - "HMDFS 上 umask 077 的 0700 临时目录不可写, configure 需补丁放宽为 022 (知识库 E011)"
    - "上游回归为 tcsh runtest + expected/ 金标, 需 sh 1:1 复现; bddtest 因 rand() 序列差异按归一化等价比对"
  common_dependencies: []

versions:
  - "2.4"
