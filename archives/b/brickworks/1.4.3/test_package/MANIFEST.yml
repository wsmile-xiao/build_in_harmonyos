# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: brickworks/1.4.3
homepage: "https://www.orastron.com/algorithms#brickworks"

# 上游测试命令 (test/Makefile 编译并运行 bw_math 测试程序)
upstream_check_command: "make CC=clang CFLAGS=-I../include"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (brickworks-1.4.3/test/bw_math.c)
upstream_tests:
  - file: test/bw_math.c
    source: brickworks-1.4.3/test/bw_math.c
    description: "bw_math 数学例程验证 (bw_math.h API)"
    command: "./build/bw_math"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: include bw_math.h 并验证 absf/pow2f/clipf"
    command: "./test_brickworks"

# 测试断言总数 (上游 bw_math 程序 1428 条断言 + test_package 3 条)
assertion_count: 1431
