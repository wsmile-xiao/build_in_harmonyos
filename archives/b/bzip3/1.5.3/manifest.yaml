version: "1.5.3"
status: published
build_date: "2026-04-24"

source:
  url: "https://github.com/kspalaiologos/bzip3/releases/download/1.5.3/bzip3-1.5.3.tar.bz2"
  tar_format: tar.bz2

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBZIP3_ENABLE_PTHREAD=ON"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-bzip3-config.cmake.in.patch"
  - "0003-configure.patch"

knowledge_gained:
  - "HMDFS 不支持在当前目录创建临时子目录，导致 autotools config.status 失败"
  - "CMake 构建可作为替代方案"
