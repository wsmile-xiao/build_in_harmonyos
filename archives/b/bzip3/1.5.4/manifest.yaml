# 版本级 manifest — bzip3 1.5.4
# 遵循 ARCHIVE-SPEC v2.0

# 必须字段
version: "1.5.4"
software: bzip3
status: published
build_date: "2026-09-19"
build_system: cmake

# 源码信息
source:
  url: "https://github.com/kspalaiologos/bzip3/releases/download/1.5.4/bzip3-1.5.4.tar.bz2"
  sha256: "9e5e79c56dfb6dc89a3c5851c460954b5aa4999ccff6b451a3430a92f983b7f6"
  tar_format: tar.bz2

# 构建配置
build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBZIP3_BUILD_APPS=ON"
    - "-DBZIP3_ENABLE_PTHREAD=ON"
  dependencies: []
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied:
  - "0001-bzip3-config.cmake.in.patch"

# 知识沉淀
knowledge_gained:
  - "bzip3 1.5.4 release tarball 缺失 bzip3-config.cmake.in（CMakeLists.txt:102 configure_file 直接失败）；上游 git tag 1.5.4 存在该文件，补丁还原即可"
  - "bz3_compress/bz3_decompress 的 *out_size 是 in/out 参数，调用前必须初始化为输出缓冲区容量（libbz3.h 98-99/108 行），否则返回 BZ3_ERR_DATA_TOO_BIG(-6)"
  - "bzip3 1.5.4 官方源码无任何自动化测试声明（无 ctest/make check/tests 目录），真实验证依赖鸿蒙专项 round-trip 测试与 test_package 消费者用例"
