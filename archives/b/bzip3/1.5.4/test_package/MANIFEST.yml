# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bzip3/1.5.4
homepage: "https://github.com/kspalaiologos/bzip3"

# 上游测试命令: bzip3 1.5.4 官方源码无任何测试声明
# (CMakeLists.txt 无 enable_testing/add_test；Makefile.am 无 TESTS/check 目标；
#  无 tests/ 目录、无测试框架、无样例/基准/fixture)
# 完整枚举证据见 reports/upstream-test-enumeration.md
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 0 个（源码声明总数 = 0）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 真实 API 调用, R34)
test_package_tests:
  - file: test.c
    description: "libbz3 公开 API round-trip 测试 (bz3_version/bz3_compress/bz3_decompress)"
    command: "./test_bzip3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
