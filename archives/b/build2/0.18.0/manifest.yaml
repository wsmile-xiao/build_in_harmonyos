# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.18.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.18.0"

# 软件名
software: "build2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: "custom (bootstrap.gmake)"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://git.build2.org/cgit/build2/snapshot/build2-0.18.0.tar.gz"

  # 源码校验和
  sha256: "5F5237390A66FCA11E5901D446402DC8CE333E78A6F0262DE95BEE4613F37F29"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Custom bootstrap recipes must bind the target compiler through Conan conf and keep vendored dependency sources inside the recipe source tree."
  - "On HarmonyOS user storage, a Phase 2 self-rebuild can fail with Operation not permitted; only the verified Phase 1 bootstrap is distributable until a separate writable-storage validation exists."
  - "Vendored build-system snapshots may contain dangling links to separately published subprojects; source() must fetch and hash-bind the missing upstream closure before Phase 2, then rerun the complete upstream suite."
  - "A current-main root temporary file can trigger the CI root-whitelist gate before any package test; merge current main, remove only the confirmed temporary file, and rerun all downstream gates from the new candidate."
  - "When main removes a temporary root file after a prior cleanup commit, the stale deletion can make PR diff application fail before G0e; synchronize the new main so the candidate diff contains no duplicate deletion."
  - "A target build2 runner may require config.cxx even after Phase 2 compilation; bind the resolved Conan compiler in the test operation or all typed testscript targets fail before execution."
  - "Moving-main root whitelist failures must be resolved by synchronizing the latest main; files already present in main must remain in the baseline so the PR diff does not repeat their deletion."
  - "A root file can be present in current main yet still be rejected by a fixed CI whitelist; when the gate is authoritative, remove only the confirmed offending files from the candidate and rerun all downstream tests."
  - "When a PR branch and its file API prove root files deleted but CI still reports them, preserve the exact build log and branch 404 evidence; this is a checkout/diff application boundary, not package-test evidence."
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
