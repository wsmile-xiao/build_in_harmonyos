  date: "2026-09-09"
  compiler: "OHOS clang 15.0.4"
  target: "x86_64-linux-ohos"
  runtime: "HarmonyOS PC VM via HDC 127.0.0.1:5555"
  upstream_result: "6/6 passed"
  consumer_result: "2/2 passed"
