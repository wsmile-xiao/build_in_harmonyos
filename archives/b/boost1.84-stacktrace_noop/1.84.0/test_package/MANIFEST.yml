# test_package/MANIFEST.yml
# 上游官方测试声明文件，供 CI L0e/L1 门禁读取

package: boost1.84-stacktrace_noop/1.84.0
homepage: "https://www.boost.org/doc/libs/1_84_0/libs/stacktrace/"

upstream_check_command: "b2 libs/stacktrace/test (OHOS 上受 E068 阻断；conanfile.py 手动编译运行六个直接 noop 目标)"
upstream_test_in_build: true
upstream_test_command: "conan create (build() 生成 upstream-tests-report.txt，任一目标失败或超时即中止)"

upstream_tests:
  - file: "libs/stacktrace/test/test_noop.cpp"
    description: "noop_ho：header-only noop 主测试，debug symbols on"
    command: "clang++ test_noop.cpp test_impl.cpp -DBOOST_STACKTRACE_USE_NOOP -O0 -g && ./noop_ho"
    result: passed
  - file: "libs/stacktrace/test/test_trivial.cpp"
    description: "trivial_noop_ho：header-only noop 最小输出测试"
    command: "clang++ test_trivial.cpp -DBOOST_STACKTRACE_USE_NOOP -O0 -g && ./trivial_noop_ho"
    result: passed
  - file: "libs/stacktrace/test/test_noop.cpp"
    description: "noop_lib：静态链接 libboost_stacktrace_noop.a 的主测试"
    command: "clang++ test_noop.cpp test_impl.cpp -DBOOST_STACKTRACE_LINK libboost_stacktrace_noop.a -O0 -g && ./noop_lib"
    result: passed
  - file: "libs/stacktrace/test/test_trivial.cpp"
    description: "trivial_noop_lib：静态链接 noop 库的最小输出测试"
    command: "clang++ test_trivial.cpp -DBOOST_STACKTRACE_LINK libboost_stacktrace_noop.a -O0 -g && ./trivial_noop_lib"
    result: passed
  - file: "libs/stacktrace/test/test_noop.cpp"
    description: "noop_ho_no_dbg：header-only noop 无调试符号变体"
    command: "clang++ test_noop.cpp test_impl.cpp -DBOOST_STACKTRACE_USE_NOOP -O2 -DNDEBUG && ./noop_ho_no_dbg"
    result: passed
  - file: "libs/stacktrace/test/test_noop.cpp"
    description: "noop_lib_no_dbg：静态链接 noop 库的无调试符号变体"
    command: "clang++ test_noop.cpp test_impl.cpp -DBOOST_STACKTRACE_LINK libboost_stacktrace_noop.a -O2 -DNDEBUG && ./noop_lib_no_dbg"
    result: passed

test_package_tests:
  - file: test_boost_stacktrace_noop.cpp
    description: "通用消费者：空栈、size、迭代器、复制比较、格式化、内存 dump 零终止项"
    command: "ctest -R boost1_84_stacktrace_noop_test"
    result: passed
  - file: test_ohos_noop.cpp
    description: "HarmonyOS 特有：__OHOS__、目标宏传播、多层空栈、内存/文件安全 dump"
    command: "ctest -R boost1_84_stacktrace_noop_ohos_test"
    result: passed

assertion_count: 15
assertion_detail: "13 个运行期行为检查 + 2 个 HarmonyOS 编译期宏检查"
