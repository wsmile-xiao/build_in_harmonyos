# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bulletml/0.0.6
homepage: "http://shinh.skr.jp/libbulletml/index_en.html"

# 上游没有 make check / ctest 测试目标（顶层 Makefile 仅 all/clean/doxy/distdir）。
# 上游自带的验证程序：ygg/ygg_test.cpp（bundled ygg XML parser 自测）与
# tinyxml/xmltest（bundled tinyxml 自测），均不构成库本身的行为测试。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无库级测试框架，bundled parser 自测不计入）
upstream_tests:
  - file: ygg/ygg_test.cpp
    source: bulletml-0.0.6/ygg/ygg_test.cpp
    description: "bundled ygg XML parser self-test（仅随包，不作为库行为门禁）"
    command: "(bundled, not built by default)"

# test_package 中自带的测试 (消费者视角验证 R34)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：BulletMLParserTinyXML 解析 XML → BulletMLRunner 回调 createSimpleBullet/createBullet，断言解析出 top action 且成功发射子弹"
    command: "./test_bulletml"

# 测试断言总数 (test.cpp: 2 个显式 FAIL 断言 + PASS 输出，用于质量评估)
assertion_count: 2