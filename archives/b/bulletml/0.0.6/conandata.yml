# C++17 兼容：std::auto_ptr 在 C++17 被移除，公共头与 bundled boost 头在
# OHOS consumer (cppstd=17) 编译时需要布局兼容的替代（BULLETML_AUTO_PTR）。
# shim 已内联进公共头 bulletmltree.h，库自身仍以 C++98（上游 -ansi）编译，ABI 不变。
patches:
  - patch_file: "patches/0001-boost-detail-shared_count.hpp.patch"
    patch_description: "Bundled boost shared_count 使用 BULLETML_AUTO_PTR 兼容宏替代 std::auto_ptr"
    patch_type: "portability"
  - patch_file: "patches/0002-boost-scoped_ptr.hpp.patch"
    patch_description: "Bundled boost scoped_ptr 使用 BULLETML_AUTO_PTR 兼容宏替代 std::auto_ptr"
    patch_type: "portability"
  - patch_file: "patches/0003-boost-shared_ptr.hpp.patch"
    patch_description: "Bundled boost shared_ptr 使用 BULLETML_AUTO_PTR 兼容宏替代 std::auto_ptr"
    patch_type: "portability"
  - patch_file: "patches/0004-bulletmltree.h.patch"
    patch_description: "公共头 bulletmltree.h：内联 C++17 auto_ptr 兼容 shim（BULLETML_AUTO_PTR）并替代成员声明"
    patch_type: "portability"
