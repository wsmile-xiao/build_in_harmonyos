# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "GNU config.guess 不包含 HarmonyOS 检测分支，需手动补丁"
  - "config.sub 需添加 linux-ohos 到 kernel-OS 组合列表"
  - "Breakpad release tarball 不含 lss (linux_syscall_support.h)，需创建桩文件"
  - "HarmonyOS sysroot 缺少 stab.h，需创建最小桩文件"
  - "HMDFS 文件系统: umask 077 + mktemp 创建的目录权限 drwx--S--- 导致无法创建文件"
  - "clang 15 不支持 -Wno-deprecated-register 和 -Wno-unused-local-typedefs"
  - "链接器不能用 -static（缺少 libz.a 静态库）"
  - "CMSG_NXTHDR 系统头文件触发 sign-compare 警告，需 -Wno-error=sign-compare"
  - "conan cache path <recipe_ref> 返回 exports 目录而非 package 目录，G4 检查受限"


