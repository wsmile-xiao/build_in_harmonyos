package: "breeze-grub/6.7.2"
homepage: "https://invent.kde.org/plasma/breeze-grub"
upstream_test_in_build: false
upstream_tests: []
upstream_test_count: 0
upstream_test_evidence: >-
  Official KDE 6.7.2 archive has 36 members (33 regular files and 3 directories).
  No tests directory, build system, CTest/pytest registration or functional test script.
  .gitlab-ci.yml only includes KDE's external reuse-lint job; this is license lint,
  not a functional test suite. mkfont.sh regenerates already shipped PF2 fonts.
test_package_tests:
  - file: "test_resources.py"
    count: 7
    description: >-
      Installed 31-file inventory with fixed SHA256 and byte lengths, 12 PNG chunk CRC
      and scanline decoding checks, three PF2 glyph indexes and menu characters,
      theme font/pixmap references, SVG parsing, license metadata and Conan discovery.
    command: "python3 test_resources.py <package>"
  - file: "test_breeze.c"
    count: 3
    description: >-
      Target-native consumer reads all 23 real theme resources and checks byte counts
      and CRC32, rejects a missing theme tree, and rejects a corrupted theme.txt.
    command: "python3 run_tests.py <package> --consumer <build>/test_breeze"
  - file: "test_breeze.c"
    count: 1
    description: >-
      OHOS-only full theme copy to writable TMPDIR, space-containing directory,
      rename to a UTF-8 name and reopen/check all 23 files. SDK-defined __OHOS__
      enables actual filesystem operations; a non-OHOS binary rejects this mode.
    command: "python3 run_tests.py <package> --consumer <build>/test_breeze --ohos"
test_package_assertion_count: 10
harmonyos_test_count: 1
assertion_count: 11
counting_policy: "Named test cases; per-file/subtest checks are not counted as separate cases."
