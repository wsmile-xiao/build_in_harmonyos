software: bossa
version: "1.9.1"
status: published
build_date: "2026-06-17"
build_system: makefile

source:
  url: "https://github.com/shumatech/BOSSA/archive/refs/tags/1.9.1.tar.gz"
  sha256: "ca650455dfa36cbd029010167347525bea424717a71a691381c0811591c93e72"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CXX=clang++"
    - "VERSION=1.9.1"
    - "PREFIX=$DEFAULT_PREFIX"
    - "LDFLAGS=-L$DEFAULT_PREFIX/lib"
    - "CXXFLAGS=-fPIC -O2 -I$DEFAULT_PREFIX/include"
  dependencies:
    - "readline/8.2"
  cc: clang
  cxx: clang++

# 无源码补丁（bossa Makefile 已有 HarmonyOS 规则，仅需 make 参数覆盖）
# R6: 编译产物（bin/bossac, bin/bossash）不是源码修改，不应生成补丁
patches_applied: []

products:
  - name: bossa-1.9.1-ohos-aarch64.tar.gz
    size: 841876
    sha256: "2a6cb4363a8759589af91bd08b50138385f0a0ef8246357563ffe92e2f29b234"
    contents:
      - bin/bossac
      - bin/bossash
      - lib/external/libreadline.so.8
  - name: bossa-1.9.1-ohos-aarch64-debug.tar.gz
    size: 1469683
    sha256: "50a7ebb6ab2d32aca6d1c6b0c82b31a0eec05c1d4cda6146a1f57e85650a1d31"

knowledge_gained:
  - "bossa Makefile 已有 HarmonyOS 规则（OS=Harmony），只构建 bossac/bossash CLI 工具，GUI bossa 需要 wxWidgets 不可用"
  - "bossa VERSION 变量使用 git describe --tags --dirty，非 git 仓库时需手动覆盖 VERSION=1.9.1"
  - "arm-none-eabi 交叉工具链不可用时，WordCopyArm.cpp/.h 预生成文件已存在于源码目录，make 自动跳过 applet 生成步骤"
  - "Makefile all 目标：HarmonyOS 的 all 定义被后续通用 all 定义覆盖，需指定 bossac bossash 目标避免 wxWidgets 编译失败"
  - "Makefile install 目标与 install 目录同名冲突，需用 make -B 强制执行"
