software: bossa
version: "1.9.1"
status: built
build_date: "2026-07-15"
build_system: makefile

source:
  url: "https://github.com/shumatech/BOSSA/archive/refs/tags/1.9.1.tar.gz"
  sha256: "ca650455dfa36cbd029010167347525bea424717a71a691381c0811591c93e72"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "OS=Linux"
    - "CXX=clang++"
    - "VERSION=1.9.1"
    - "CXXFLAGS=-fPIC -O2 -Wno-error"
    - "bin/bossac"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-src-PosixSerialPort-missing-includes.patch"
    type: portability
    description: "Add missing <sys/select.h> and <sys/time.h> includes to PosixSerialPort.cpp for OHOS compatibility"

knowledge_gained:
  - "bossa Makefile 使用 uname -s | cut -c -7 检测 OS，OHOS 返回 Harmony 无匹配规则，需 OS=Linux 覆盖"
  - "Makefile 硬编码 -Werror，源码 Samba.cpp 使用 move() 而非 std::move()，clang 15 触发 -Wunqualified-std-cast-call 警告，需 -Wno-error 降级"
  - "PosixSerialPort.cpp 缺少 <sys/select.h> 和 <sys/time.h> 头文件，OHOS 需补丁添加"
  - "Makefile 目标是路径形式 bin/bossac bin/bossash，不是 bossac bossash"
  - "bossash 需要 readline 库（BOSSASH_LIBS=-lreadline），CI worker 上 readline 不可靠，故只构建 bossac"
