# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bossa/1.9.1
homepage: "https://www.shumatech.com/forum/"

# BOSSA 无独立测试套件，验证通过 test_package 消费者测试完成
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "bossa 冒烟测试：运行 bossac -h 验证可执行文件正常工作"
    command: "bash test.sh"

assertion_count: 1
