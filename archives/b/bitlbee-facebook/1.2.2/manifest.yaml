# 版本级 manifest — bitlbee-facebook 1.2.2
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.2.2"
software: "bitlbee-facebook"

# 编译状态
# published | built | failed | archived
status: built

build_date: "2026-09-01"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/bitlbee/bitlbee-facebook/archive/refs/tags/v1.2.2.tar.gz"
  sha256: "834297cb2472765e5f31ca0ed64b712b0ca9b7b705409c5454cab891414c4265"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  # --build/--host 跳过 config.guess 探测（config.sub 支持 *-linux-ohos）；
  # plugindir 用上游默认 $libdir/bitlbee；BITLBEE/GLIB/JSON 的
  # _CFLAGS/_LIBS + GLIB_GENMARSHAL 经 AutotoolsToolchain 环境注入
  # （pkg.m4 预设变量旁路 PKG_CHECK_MODULES——conan PkgConfigDeps 只产出
  # 聚合 glib-2.0.pc，无 gio-2.0.pc/gobject-2.0.pc/bitlbee.pc）
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"

  # 全部静态嵌入 facebook.so（conan glib/json-glib 在 OHOS 上只有静态库）；
  # openssl 仅构建期（bitlbee 3.6 sdist configure --ssl=openssl 生成
  # config.h 用其头文件）；zlib/1.3.1.1 为 PIC 重建（1.3.1 非 PIC 无法入
  # 共享模块）；宿主 bitlbee/3.6 不进 requires（其 conan 包只含
  # bin/bitlbee 二进制，插件构建从头文件源取——见 notes.md）
  dependencies:
    - glib/2.84.0
    - json-glib/1.6.6
    - libffi/3.4.4
    - pcre2/10.40
    - zlib/1.3.1.1
    - openssl/1.1.1w

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无源码补丁：所有适配在配方内完成（configure 生成后 E114 运行时补丁、
# bitlbee 头文件供给、.la-free 静态库目录、pkg.m4 宏随配方导出）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "bitlbee 插件无独立宿主包可链：bitlbee/3.6 conan 包只含 bin/bitlbee（无头文件/无 bitlbee.pc），插件构建需从同版本 sdist 复现 make install install-dev 语义（configure 生成 config.h + 平铺头文件）"
  - "E114（umask 077 mktemp）+ E236（stale .la metadata）在 libtool 模块构建中叠加出现；.la-free 目录方案可解"
  - "zlib/1.3.1 的 libz.a 非 PIC（R_AARCH64_ADR_PREL_PG_HI21 against z_errmsg），共享模块须用 zlib/1.3.1.1（PIC 重建）"
  - "pkg.m4 预设 <MODULE>_CFLAGS/_LIBS 环境变量可整体旁路 PKG_CHECK_MODULES（两变量同时非空时 pkg-config 完全不执行）——适用于 conan PkgConfigDeps 只产聚合 pc、缺组件 pc 的场景"
  - "dlopen 插件类产物（RTLD_NOW 语义）的 R34 测试范式：桩宿主导出宿主 API 符号面 + -rdynamic + dlopen + 调用真实入口验证 ABI"
