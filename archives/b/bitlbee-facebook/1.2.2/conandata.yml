# bitlbee 3.6 开发文件来源（头文件 + config.h 生成源）：
# conan bitlbee/3.6 包只含 bin/bitlbee 可执行文件——无头文件、无 bitlbee.pc
# （上游 `make install install-dev` 的产物不在该包内）。上游 CI
# （.github/workflows/ci.yml）本身就是克隆 bitlbee 后 make install
# install-dev 再编译插件。本配方从同版本 sdist 复现 install-dev 语义：
# 跑 bitlbee 的 configure 生成 config.h，再平铺 *.h lib/*.h protocols/*.h
# + config.h 到私有 include 目录。sha256 与宿主 archives/b/bitlbee/3.6
# 的 conandata.yml 登记值一致（同源校验）。
bitlbee_dev_source:
  url: "https://deb.debian.org/debian/pool/main/b/bitlbee/bitlbee_3.6.orig.tar.gz"
  sha256: "9f15de46f29b46bf1e39fc50bdf4515e71b17f551f3955094c5da792d962107e"

patches: {}
