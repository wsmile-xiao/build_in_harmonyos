# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bitlbee-facebook/1.2.2
homepage: "https://github.com/bitlbee/bitlbee-facebook"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序——bitlbee-facebook 1.2.2 无任何上游测试
# （tar tzf 实测 44 个条目/38 个文件，无 tests/；上游 CI ci.yml 仅克隆 bitlbee
# → make install install-dev → autogen.sh && make，纯编译无测试步骤；
# 本地实测 make check 输出 "Nothing to be done for 'check-am'"——如实记录）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: run_test.c
    description: "R34：桩宿主（导出 bitlbee 插件 API 全符号面 + -rdynamic）dlopen facebook.so (RTLD_NOW) 全重定位解析；调用 init_plugin_info 验证 plugin_info{abi_version=1, name=facebook, version=1.2.2}；调用 init_plugin 验证 register_protocol×1 + root_command_add×3；包内无 facebook.so 时硬失败（L1e）"
    command: "conan create 自动运行 test_package（clang -rdynamic run_test.c -ldl && ./run_test <package>/lib/bitlbee/facebook.so）"

# 测试断言总数 (近似值, 用于质量评估)
# dlopen 成功(1) + init_plugin_info 存在(1) + abi=1(1) + name=facebook(1)
# + version=1.2.2(1) + register_protocol×1(1) + root_command_add×3(1)
# + 包内模块存在性检查(1)
assertion_count: 8
