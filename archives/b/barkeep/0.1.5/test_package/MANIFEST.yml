# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: barkeep/0.1.5
homepage: "https://github.com/oir/barkeep"

# 上游测试入口：无 autotools `make check`；上游用 meson 注册（tests/meson.build 的
# test() 对 6 个可执行文件各注册一条），README 另给「No tooling」直编口径。
upstream_check_command: "meson test（tests/meson.build test() 注册）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "build() 内直调编译器（-O0 -std=c++20 -pthread -I<src> -I<catch2> [-I<fmt>]）编译 tests/{test,test-fmtlib,test-stdfmt}.cpp 并运行，Catch2 v2 汇总行解析计数，任一非零即构建失败"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test.cpp
    source: barkeep-0.1.5/tests/test.cpp
    description: "Catch2 v2 主套件：动画/状态/计数/进度条/组合/越界（19 个用例宏，模板展开后注册 59 例）"
    command: "./test.out -r compact"
  - file: tests/test-fmtlib.cpp
    source: barkeep-0.1.5/tests/test-fmtlib.cpp
    description: "BARKEEP_ENABLE_FMT_FORMAT + FMT_HEADER_ONLY 路径（5 个用例宏，展开后注册 20 例）"
    command: "./test-fmtlib.out -r compact"
  - file: tests/test-stdfmt.cpp
    source: barkeep-0.1.5/tests/test-stdfmt.cpp
    description: "BARKEEP_ENABLE_STD_FORMAT（std::format）路径 —— OHOS libc++ 15004 未实现 std::format，编译错误签名匹配 ⇒ NOT_RUN（不计入 executed，PR 正文归因）"
    command: "NOT_RUN：clang++ 编译失败 'no member named vformat/make_format_args/format in namespace std'"
  - file: tests/demo.cpp
    source: barkeep-0.1.5/tests/demo.cpp
    description: "演示程序（无任何断言，含 10s 级 sleep 演示动画），上游 meson 亦注册为 test() 但性质为 demo ⇒ 不计入测试用例"
    command: "NOT_RUN（demo 程序，非测试用例）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者断言链 23 项：已安装包头 + 无 TTY（管道）渲染路径，显式计数、失败即非零退出"
    command: "./test_barkeep"

# 测试断言总数（**近似值**：上游 Catch2 断言含逐帧时序检查，随运行波动——本任务多轮实测
# 60331 / 61199 / 64318；权威读数取末轮 reports/conan-create.log 的
# HMBS_UPSTREAM_TEST_RESULT 行。用例数恒为 59 + 20 = 79，消费者断言恒为 23）
assertion_count: 64318
