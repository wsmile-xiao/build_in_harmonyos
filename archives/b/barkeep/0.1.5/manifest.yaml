# 版本级 manifest
# 文件位置: archives/b/barkeep/0.1.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.5"

# 软件名
software: "barkeep"

# 编译状态
# published | built | failed | archived
# （O5：只有合并后 release upload 已确认才 published，本单按 built）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
# 上游构建系统是 meson（根 meson.build project('barkeep','cpp')），但本配方是
# header-only：无库编译阶段，build() 按上游 README「No tooling」口径直调编译器
# 编译并运行 tests/*.cpp ⇒ 配方侧构建入口记 custom（不使用上游 meson 树，
# 其 subprojects/ 依赖 wrap 在 tarball 内为空目录）。
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub tag 归档，官方源）
  url: "https://github.com/oir/barkeep/archive/refs/tags/v0.1.5.tar.gz"

  # 源码校验和（两次独立下载同值，283584 字节）
  sha256: "2577b09cfa7e5e117d13b765cfa4792f9e2b50719715786be275ae32dbf63b7c"

  # 压缩格式
  tar_format: tar.gz

  # tag 与 tag 提交（git ls-remote --tags 实证）
  tag: "v0.1.5"
  tag_commit: "fce9da98cd681954e710926564089484dc3ad5e7"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（配方侧入口：直调编译器，见上方 build_system 注释）
  system: custom

  # 配置选项列表（header-only，无 configure 步骤）
  configure_options: []

  # 编译依赖列表（格式: name/version；交付依赖 0 个——单头文件仅依赖标准库）
  dependencies: []

  # 上游测试依赖（test_requires，不进交付依赖）
  test_dependencies:
    - "catch2/2.13.10"
    - "fmt/11.1.3"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（上游零改动：三个测试翻译单元按 README「No tooling」口径直编）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "barkeep 为单头文件 header-only 库（BARKEEP_VERSION 与配方 version 同源），交付物仅 include/barkeep/barkeep.h，package_id 清空"
  - "release tarball 内 subprojects/Catch2_ 与 subprojects/fmt_ 是空的 git 子模块目录，上游 Makefile 的 -I./subprojects/... 在 tarball 下恒失败 ⇒ 测试按 README「No tooling」口径用 conan test_requires 的 catch2/fmt 头直编"
  - "OHOS SDK clang 15 + libc++ 15004 的 <format> 未实现 std::vformat/std::make_format_args ⇒ tests/test-stdfmt.cpp 按「缺特性」记 NOT_RUN（错误签名匹配才允许跳过），功能面由 fmt 变体等价覆盖"
  - "header-only 包的 G4/L2/L4/L5 门禁走跳过分支却并列打 ✅，需按 device-facts §二 人工补测"

patch_generation:
  method: none
  patches_count: 0
