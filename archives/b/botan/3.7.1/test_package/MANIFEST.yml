# test_package/MANIFEST.yml — botan 3.7.1
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 数据来源：本地解压官方 Botan-3.7.1.tar.xz 后真实统计与真实执行
#   - BOTAN_REGISTER_TEST 注册宏计数：353 个上游测试套件
#   - 完整执行（botan-test --data-dir=src/tests/data）：3,055,115 个测试
#     断言全部通过（43.39 秒，0 失败），日志见 notes.md

package: botan/3.7.1
homepage: "https://botan.randombit.net"

upstream_tests_exist: true
upstream_test_audit: >
  上游测试套件为单体 runner（./botan-test，由 configure.py
  --build-targets=tests 生成，Makefile 链接 src/tests/*.cpp 共 125 个
  测试源文件 + runner/ 4 个文件），测试注册宏 BOTAN_REGISTER_TEST
  实测 353 处（grep -c 官方源码），数据文件在 src/tests/data/（54 个
  文件），全部离线可跑。无第三方测试框架依赖（自研 harness）。
  运行方式：构建阶段在配方 build() 内执行
  `./botan-test --data-dir=./src/tests/data`（全量 3,055,115 断言）。
upstream_test_count: 353
upstream_check_command: "./botan-test --data-dir=./src/tests/data"
upstream_test_in_build: true

# test_package 中自带的测试 (消费者视角验证, R34: 真实链接并断言)
test_package_tests:
  - file: test.cpp
    description: >
      消费者视角功能测试：真实链接 libbotan-3.a 并断言 4 项——
      ① 版本号三段组 == 3.7.1；② SHA-256 FIPS 180-2 KAT
      (hash("abc") == BA7816BF...15AD)；③ HMAC-SHA-256 RFC 4231
      测试向量 2 (== 5BDCC146...3843)；④ AutoSeeded_RNG 生成 16 字节
      随机数长度校验。C++ 源码，4 项全离线
    command: "clang++ -std=c++20 test.cpp -lbotan-3 && ./test_botan"

# 断言总数（消费者 test_package 4 项；上游 3,055,115 断言在构建阶段
# botan-test 全量执行计入 PR 报告）
assertion_count: 4
