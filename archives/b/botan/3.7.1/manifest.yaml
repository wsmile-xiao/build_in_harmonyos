---
version: "3.7.1"
status: "adapted"
upstream_version: "3.7.1"
upstream_url: "https://github.com/randombit/botan"
upstream_source_url: "https://botan.randombit.net/releases/Botan-3.7.1.tar.xz"
license: "BSD-2-Clause"
category: "crypto"
description: "Botan 3.7.1 — C++ cryptography library adapted for HarmonyOS PC (aarch64, static library + upstream test suite)"

build_system: "custom (Python configure.py + make)"

dependencies: []

adaptations:
  - "--os=linux: Botan does not recognize HarmonyOS; Linux compatibility target with --cpu=arm64"
  - "--without-os-features=explicit_bzero: OHOS musl libc does not declare explicit_bzero() (3.6.1 needed post-configure build.h sed; 3.7.1 supports a clean configure flag; Botan falls back to volatile memset zeroization)"
  - "--disable-modules=kyber*,dilithium*,ml_kem,ml_dsa,slh_dsa_*,pqcrystals,tls13_pqc: PQC module family needs C++20 std::ranges beyond OHOS clang-15/libc++"
  - "patch 0001: upstream tests std::ranges::equal/find → classic iterator pairs (2 test files, 6 call sites, library code untouched)"
  - "patch 0002: upstream Test::temp_file_name hardcodes /tmp (read-only EROFS on HarmonyOS PC) → respect TMPDIR"
  - "--build-targets=static,tests: static lib + upstream test runner built; upstream suite (3,055,196 assertions) runs in build() phase with SDK libc++_shared.so LD_LIBRARY_PATH"
  - "shared library not built: runtime symbol relocation issues on OHOS (carried over from 3.6.1)"

knowledge_gained:
  - "OHOS clang-15 libc++ has no std::ranges algorithms (equal/find) even in C++20 mode — classic iterator pairs are the portable fallback (tests-only issue; patch 0001)"
  - "HarmonyOS PC /tmp is a read-only mount; test frameworks hardcoding /tmp must respect TMPDIR (same as ivar 1.4.4 E-prior; patch 0002)"
  - "botan 3.7.x replaced the 3.6.1 build.h post-sed for explicit_bzero with a native configure flag --without-os-features"
