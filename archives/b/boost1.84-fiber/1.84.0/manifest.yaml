knowledge_gained:
  - "Boost.Fiber 库本体（lib boost_fiber）16 TU：algo/{algorithm,round_robin,shared_work,work_stealing}.cpp + barrier/condition_variable/context/fiber/future/mutex/properties/recursive_mutex/recursive_timed_mutex/scheduler/timed_mutex/waker.cpp；NUMA 库 boost_fiber_numa 默认 off（Jamfile numa conditional rule 无 <numa>on 时 <build>no）不打包，segmented stacks 默认 off 符合 OHOS"
  - "fiber 依赖模式可行：requires boost1.84-context/1.84.0 后库 TU 以 -DBOOST_CONTEXT_STATIC_LINK 消费者姿态链接，libboost_fiber.a 无 fcontext 符号（全部来自依赖包 libboost_context.a），package_info 组件 requires 用全限定名 boost1.84-context::boost_context"
  - "CMakeDeps 同 cmake_file_name 撞名实测（conan 2.29.1）：两包同 cmake_file_name=Boost 时聚合 BoostConfig.cmake 只保留一个属主包（实测字母序靠前者 boost1.84-context 赢）的组件，后者组件静默丢弃且无警告；对策：fiber 包用独立 cmake_file_name=boost1.84-fiber（log 先例同款），消费者 find_package(boost1.84-fiber) + target_link_libraries(boost1.84-fiber::boost_fiber)"
  - "上游 fiber 测试面：libs/fiber/test 32 个 [ run ] 目标（minimal 套件 asm+native 各 13 源 x post/dispatch = 26 + extra 套件 6 个 mt 源 x post/dispatch），全部 init_unit_test_suite 模式；mt 测试中 4 个（mutex_mt/condition_mt）用 boost::thread+boost::barrier 需要链接 libboost_thread.a，sleep_for(boost::chrono::milliseconds) 需要 libboost_chrono.a（BOOST_THREAD_USES_CHRONO 默认开启，测试编译必须去掉 -DBOOST_THREAD_DONT_USE_CHRONO）"
  - "测试期依赖本地编译 never packaged：boost_unit_test_framework（19 TU）+ libboost_thread（5 TU，thread #8554 同源集合）+ libboost_chrono（3 TU，BOOST_CHRONO_SOURCE）——32/32 全过"
  - "sp_thread_sleep.hpp 补丁同 thread #8554：OHOS musl 无 pthread_setcancelstate，需 0001 补丁把宏门控改为 !defined(BOOST_SP_NO_PTHREAD_SETCANCELSTATE)（纯命令行 -D 宏不生效，因为上游 1.84 源码只认 __ANDROID__）"

