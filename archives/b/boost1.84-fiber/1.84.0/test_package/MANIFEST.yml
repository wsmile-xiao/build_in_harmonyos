# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: boost1.84-fiber/1.84.0
homepage: "https://www.boost.org/libs/fiber/"

# 上游测试入口：b2 编译系统（OHOS 不兼容，E068），无法直接运行 B2 测试目标；
# 上游 libs/fiber/test/Jamfile.v2 注册 test-suite minimal（asm + native 双套件，
# 各自展开 13 个共享测试源 x post/dispatch = 26 个 [ run ] 目标）+
# test-suite extra（extra-asm + extra-native，6 个 mt 测试源 x post/dispatch
# = 6 个 [ run ] 目标），合计 32 个 [ run ] 注册目标。所有测试源均为
# init_unit_test_suite 模式（无自带 main），链接 boost_unit_test_framework +
# boost_context + boost_fiber + boost_thread（mt 测试）。
# asm 套件固定 <context-impl>fcontext（本包唯一构建的实现）；native 套件
# 经 native-impl 规则在非 windows 平台固定 <context-impl>ucontext（本包
# context 依赖不提供 ucontext 实现，native 变体以 fcontext 实现运行同一
# 测试源，每源计 1 次，与 context 包 test_callcc/test_fiber 变体计法一致）。
upstream_check_command: "b2 libs/fiber/test"

# 本包在 conanfile.py build() 中手动编译 libboost_fiber.a（上游 Jamfile
# 16 TU 同源集合）+ 绕 b2 逐个编译运行 32 个上游测试用例：
# boost_unit_test_framework（19 TU）/ libboost_thread（5 TU）/
# libboost_chrono（3 TU）均为测试期依赖本地编译，never packaged。
upstream_test_in_build: true
upstream_test_command: "conan create（build() 内 _run_upstream_tests 逐个编译运行 libs/fiber/test/test_*.cpp）"

# 上游 fiber 测试全集（N=32，与 libs/fiber/test/ 目录实测 .cpp 数一致：
# 26 minimal（13 源 x post/dispatch）+ 6 mt extra（3 源 x post/dispatch））
upstream_tests:
  - file: libs/fiber/test/test_async_dispatch.cpp
    source: boost_1_84_0/libs/fiber/test/test_async_dispatch.cpp
    description: "上游 fiber 测试 test_async_dispatch（fiber 化 async，dispatch 启动策略）"
    command: "clang++ ... test_async_dispatch.cpp -lboost_fiber -lboost_context && ./ut_test_async_dispatch"
  - file: libs/fiber/test/test_async_post.cpp
    source: boost_1_84_0/libs/fiber/test/test_async_post.cpp
