# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_boost_fiber.cpp
    description: "boost fiber 消费者测试（fiber post/dispatch 启动 join、yield 交错、buffered/unbuffered channel、promise/future、packaged_task、barrier、mutex+condition_variable、sleep_for 共 10 组断言块；经 boost1.84-fiber::boost_fiber 链接并传递 boost1.84-context 的 libboost_context.a）"
    command: "./test_boost_fiber"

# 断言计数：10 组断言块（fiber post / fiber dispatch / yield / buffered_channel /
# unbuffered_channel / promise-future / packaged_task / barrier /
# mutex+condition_variable / sleep_for）
# + 上游 32 个测试源各自内置断言（退出码判定）
assertion_count: 10
