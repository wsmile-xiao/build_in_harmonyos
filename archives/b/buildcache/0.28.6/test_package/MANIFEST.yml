# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: buildcache/0.28.6
homepage: "https://gitlab.com/bits-n-bites/buildcache"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游实际运行的测试程序 (8 个 ctest 可执行, 40 TEST_CASE / 88 SUBCASE / 190 CHECK_EQ)
upstream_tests:
  - file: src/base/env_utils_test.cpp
    source: src/base (buildcache_add_test)
    description: "Environment variable parsing tests"
    command: "ctest -R env_utils_test"
  - file: src/base/file_lock_test.cpp
    source: src/base (buildcache_add_test)
    description: "POSIX fcntl record-lock tests"
    command: "ctest -R file_lock_test"
  - file: src/base/file_utils_test.cpp
    source: src/base (buildcache_add_test)
    description: "File utilities / realpath / path normalization tests"
    command: "ctest -R file_utils_test"
  - file: src/base/hasher_test.cpp
    source: src/base (buildcache_add_test)
    description: "xxHash-based hasher tests"
    command: "ctest -R hasher_test"
  - file: src/base/hmac_test.cpp
    source: src/base (buildcache_add_test)
    description: "HMAC-SHA256 tests (builtin, no OpenSSL)"
    command: "ctest -R hmac_test"
  - file: src/base/string_list_test.cpp
    source: src/base (buildcache_add_test)
    description: "String list utility tests"
    command: "ctest -R string_list_test"
  - file: src/base/unicode_utils_test.cpp
    source: src/base (buildcache_add_test)
    description: "UTF-8 / UCS-2 conversion tests"
    command: "ctest -R unicode_utils_test"
  - file: src/cache/remote_cache_provider_test.cpp
    source: src/cache (buildcache_add_test)
    description: "Remote cache host-description parsing tests (no network)"
    command: "ctest -R remote_cache_provider_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "smoke test: verify buildcache --version 与 -h 可执行"
    command: "buildcache --version && buildcache -h"

# 测试断言总数 (近似值, 用于质量评估)
# 上游: 40 TEST_CASE / 88 SUBCASE / 190 CHECK_EQ (doctest)
# test_package: 2 (buildcache --version 退出码 + buildcache -h 退出码; 负向断言 L1e 由 CI 门禁执行不计入)
assertion_count: 2
