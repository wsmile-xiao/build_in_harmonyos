# 软件级 manifest — buildcache
# 遵循 ARCHIVE-SPEC v3.0

software: buildcache
display: "buildcache"
description: "C/C++ 编译器缓存，加速重新编译（ccache/sccache 的 C++ 独立实现）"
category: build-tool
homepage: "https://gitlab.com/bits-n-bites/buildcache"
license: Zlib
build_system: cmake

ohos_adaptation:
  key_points:
    - "所有第三方依赖 (lz4/xxHash/zstd/hiredis/lua/cJSON/cpp-base64/HTTPRequest) 均 vendored，无外部 conan 依赖"
    - "OpenSSL 可选依赖，构建时以 -DDISABLE_SSL=ON 绕开 OHOS 下 OpenSSL 汇编 BAD_SIGNATURE 问题"
    - "构建/测试全程使用 TMPDIR 指向可写目录（OHOS /tmp 只读，E002）"
    - "上游 8 个 ctest 单元测试在 conan build() 中直接运行（层1 上游官方测试）"
  common_dependencies: []

versions:
  "0.28.6":
    status: built
    build_date: "2026-08-23"
