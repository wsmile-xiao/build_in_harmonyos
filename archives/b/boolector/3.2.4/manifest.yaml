software: boolector
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/3.2.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.2.4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Boolector/boolector/archive/refs/tags/3.2.4.tar.gz"

  # 源码校验和
  sha256: "249c6dbf4e52ea6e8df1ddf7965d47f5c30f2c14905dce9b8f411756b05878bf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DTESTING=OFF"
    - "-DUSE_MINISAT=OFF"
    - "-DUSE_CMS=OFF"
    - "-DUSE_PICOSAT=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "btor2tools/commit-037f1fa"
    - "cadical/commit-cb89cf"
    - "lingeling/commit-7d5db7"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E092: CMake 不识别 HarmonyOS，通过 CMAKE_SYSTEM_NAME=Linux 绕过"
  - "E103: cmake_minimum_required(VERSION 3.3) 在 CMake 4.x 下失败，replace_in_file 改为 3.5"
  - "GitHub SSL 证书问题：设置 SSL_CERT_FILE 和 CURL_CA_BUNDLE 环境变量"
  - "test_package 需声明 system_libs=[pthread, m, c++] 以链接 C++ 运行时"
  - "boolector 依赖（Btor2Tools/CaDiCaL/Lingeling）以内嵌源码方式编译，不使用 Conan 依赖引用"
