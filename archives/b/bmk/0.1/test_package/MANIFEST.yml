package: bmk/0.1
homepage: "https://github.com/realchonk/bmk"

upstream_tests_exist: false
upstream_test_audit:
  - source: "bmk 0.1 source archive"
    reason: "The archive has no test/, tests/, or unit-test directory and contains no dedicated test source files."
  - source: "Mkfile"
    reason: "Only all, clean, distclean, install, and mk targets are declared; there is no check or test target."
  - source: ".builds/*.yml and .cirrus.yml"
    reason: "The upstream CI repeats bootstrap and self-host builds across operating systems and compilers. These are build-environment matrix jobs rather than registered test cases."
  - source: "retroci"
    reason: "The hardware-specific 2.11BSD/4.3BSD expect harness repeats bootstrap/self-host semantics and is not runnable in the OHOS clean CI environment."
  - conclusion: "Upstream has 0 formal unit/integration test cases. The recipe retains every applicable unique upstream validation semantic: bootstrap build and self-hosted rebuild."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_count: 0
upstream_tests: []

upstream_ci_validations:
  - name: "bootstrap build"
    source: ".builds/*.yml and .cirrus.yml"
    command: "./configure && make"
    adapted_command: "sh ./configure && make -j1"
  - name: "self-hosted rebuild"
    source: ".builds/*.yml and .cirrus.yml"
    command: "mk"
    adapted_command: "./mk clean all"

excluded_matrix_variants:
  - "PCC and TCC jobs repeat the same build using alternate compilers unavailable in the OHOS CI capability matrix."
  - "FreeBSD, NetBSD, OpenBSD, macOS, 2.11BSD, and 4.3BSD jobs are operating-system variants, not additional test cases."
  - "OpenBSD desktop.git is an external downstream project not shipped in the bmk 0.1 source archive."

test_package_tests:
  - file: test_bmk.sh
    description: "Executes the packaged mk binary and verifies release identity, a real dependency graph, macro and shell expansion, and no-op behavior for an up-to-date target."
    command: "bash test_bmk.sh"

assertion_count: 4
