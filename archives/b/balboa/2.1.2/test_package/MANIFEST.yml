package: balboa/2.1.2
homepage: "https://github.com/DCSO/balboa"

upstream_check_command: "go test ./... -v"
upstream_test_in_build: true
upstream_test_command: "go test ./..."

upstream_tests:
  - file: format/format_fever_test.go
    source: format/format_fever_test.go
    description: "Go test — FEVER format parsing (3 Test funcs)"
    command: "go test ./format -run TestFever"
  - file: format/format_suricata_test.go
    source: format/format_suricata_test.go
    description: "Go test — Suricata EVE format parsing (3 Test funcs)"
    command: "go test ./format -run TestSuricata"
  - file: query/query_graphql_test.go
    source: query/query_graphql_test.go
    description: "Go test — GraphQL query API (1 Test func)"
    command: "go test ./query -run TestQueryGraphQL"
  - file: query/query_rest_test.go
    source: query/query_rest_test.go
    description: "Go test — REST query API (1 Test func)"
    command: "go test ./query -run TestQueryREST"

test_package_tests:
  - file: test.sh
    description: "验证 Go 前端 balboa --help 可执行"
    command: "sh test.sh # [1/3] balboa --help"
  - file: test.sh
    description: "验证 C 后端 balboa-backend-console 可执行"
    command: "sh test.sh # [2/3] balboa-backend-console"
  - file: test.sh
    description: "验证 C 后端 balboa-mock 可执行"
    command: "sh test.sh # [3/3] balboa-mock"

assertion_count: 3
