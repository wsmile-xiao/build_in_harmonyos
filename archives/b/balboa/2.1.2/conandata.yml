patches:
  - patch_file: "patches/0001-go-version-compat.patch"
    patch_description: "兼容 OHOS 已发布 Go 1.21 工具链：将 go.mod 要求从 1.23 降至 1.21，移除 toolchain 声明"
    patch_type: "portability"
  - patch_file: "patches/0002-sqlite-engine-api.patch"
    patch_description: "修复 balboa-sqlite 新旧 engine API 不一致：改用 engine_config_t 封装 host/port/throttle/db，兼容 v2.1.2 的 lib/engine.h 新接口，移除已内聚到 blb_engine_run 的显式 spawn 调用"
    patch_type: "portability"
