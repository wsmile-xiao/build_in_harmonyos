# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: buckygen/1.1
homepage: "http://caagt.ugent.be/buckygen/"

# 上游测试命令 (buckygen 无自带测试套件；Makefile 仅有 all/prof/stats/clean 目标)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (buckygen 无上游测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_buckygen.py
    description: "buckygen 功能验证：binary存在性、usage帮助、24顶点富勒烯生成计数(=89)"
    command: "python3 test_buckygen.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
