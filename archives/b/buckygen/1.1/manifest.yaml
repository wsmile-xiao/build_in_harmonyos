# 版本级 manifest — buckygen 1.1

version: "1.1"
software: "buckygen"

# 编译状态
# published | built | failed | archived
status: built

build_date: "2026-09-05"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方来源：Ghent University CAAGT）
  url: "http://caagt.ugent.be/buckygen/buckygen-1.1.zip"

  # 源码校验和
  sha256: "c151b33078913bed7f72977821d246c6dda5e01b64a53d963b5f95b65852e634"

  # 压缩格式
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  configure_options: []

  # 编译依赖列表（格式: name/version）——无外部依赖，纯 C 标准库
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无需补丁
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "buckygen 使用纯 Makefile 构建（无 configure），makefile 依赖 ${CC} 环境变量，配方中须从 Conan conf 取得编译器（R33）"
- "源代码单文件 buckygen.c，通过 #include \"splay.c\" 内嵌 splay 树实现，编译命令为 ${CC} -O3 buckygen.c -o buckygen"
- "makefile 无 install 目标，package() 需手动复制 buckygen 二进制到 bin/（参考 b43-fwcutter 配方）"
- "buckygen 是命令行工具（fullerene 生成器），package_type=application，需 commands.json（R38）"
- "C2x 下无原型函数声明（new_splaynode/old_splaynode 等）会产生 -Wdeprecated-non-prototype 警告，非致命"