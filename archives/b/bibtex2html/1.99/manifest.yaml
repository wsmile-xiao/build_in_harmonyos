software: bibtex2html

# 版本号
version: "1.99"

# 编译状态
status: built

# 构建系统类型
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://usr.lmf.cnrs.fr/~jcf/ftp/bibtex2html/bibtex2html-1.99.tar.gz"

  # 源码校验和
  sha256: "d224dadd97f50199a358794e659596a3b3c38c7dc23e86885d7b664789ceff1d"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表
  dependencies:
    - ocaml/4.14.2

  # 编译器
  cc: clang
  cxx: clang++

  # 语言类型
  language: ocaml

  # 编译模式
  compile_mode: bytecode

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# 补丁说明：修改的文件是 configure 生成的临时文件（config.guess, config.status），
# 不属于源码文件，因此未生成正式补丁。
# 具体修改记录见 notes.md。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "bibtex2html 是 OCaml 程序，非 C/C++。需要 OCaml >= 3.07 编译器"
  - "HarmonyOS 上 autoconf config.status 的 umask 077 会创建无法写入的临时目录，需改为 umask 022"
  - "config.guess 需替换为 automake-1.16 版本以识别 aarch64-unknown-linux-ohos"
  - "bibtex2html 的 Makefile.in 不支持 DESTDIR 变量，需手动创建 staging 目录"
  - "OCaml 字节码编译产物为 ocamlrun script，依赖 ocamlrun 运行时"

# ============================================================
# 交付物
# ============================================================

artifacts:
  - path: packaging/bibtex2html-1.99-ohos-aarch64.tar.gz
    size: 921763
    sha256: "ff7742d69e9c7d7fe4c4a8a4b3d2c7428b00fd10aea1435b9b97dc8a2ad57610"

# ============================================================
# 测试
# ============================================================

test:
  make_check: "无 check 目标"
  manual_test: "9 项通过 / 0 失败 / 1 注意(OCaml字节码)"
  report: reports/test-report.md
