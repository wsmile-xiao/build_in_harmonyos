# conandata.yml — bsc 2026.01
#
# bsc（Bluespec Compiler）核心为 Haskell（~500k 行）。OHOS 为纯 musl：唯一可运行
# 的官方 GHC aarch64 bindist 是 aarch64-alpine3_18（musl，解释器与 OHOS 一致）；
# 其运行时依赖（gmp/ffi/ncursesw）取自同版本 alpine v3.18 APK。构建时 htcl/bluetcl
# 还需要 tcl（运行库+头文件）。
#
# downloads.haskell.org 单连接限速（~20-60KB/s）且不在 CI 镜像域名清单内：574MB
# bindist 由配方内分片并行下载器获取（Range 线性扩展，官方 SHA256SUMS 校验）。
#
# 上游源码构建标准库（src/Libraries）在本平台的类型 proviso 求解上存在系统性
# 差异（FixedPoint.bsv "too general"，GHC 9.12.1/9.12.2 复现一致），故标准库部分
# 采用同版本官方 release 的架构无关工件（.bo/.v/tcllib），SAT 求解器与 Bluesim
# 原生库仍从源码以 stub 模式构建。详见 notes.md。

sources:
  url: "https://github.com/B-Lang-org/bsc/archive/refs/tags/2026.01.tar.gz"
  sha256: "f9204b7d6efd6ac2b2c1b42c80b01d179319ac33575d258719eaf73be44d4ec5"

patches:
  - patch_file: "patches/0001-ohos-build-env.patch"
    patch_type: "portability"
    patch_description: "TMPDIR 可写化（src/comp/Makefile 硬编码 /tmp）+ yices stub 版本串过 bsc checkVersion"

# GHC 工具链自举（构建依赖；制品仓无 ghc，上游无 linux-arm64 二进制）
ghc_bootstrap:
  url: "https://downloads.haskell.org/~ghc/9.12.2/ghc-9.12.2-aarch64-alpine3_18-linux.tar.gz"
  sha256: "1e7188253aceda41836242207c943c56d7fdaf1ebe83149b1dbb71bdc41fba7e"
  size: 601250114
  topdir: "ghc-9.12.2-aarch64-unknown-linux"

# GHC bindist 的 musl 运行时依赖 + 构建期 tcl（alpine v3.18 aarch64，与 bindist
# 构建环境一致）。lib/ 下的 .so 随包分发供运行时 LD_LIBRARY_PATH 使用。
ghc_runtime_libs:
  - url: "https://dl-cdn.alpinelinux.org/alpine/v3.18/main/aarch64/gmp-6.2.1-r3.apk"
    sha256: "13f042e07fe32b5487111d6dec4289f6e745cc950a6d64232be679f2435b715d"
  - url: "https://dl-cdn.alpinelinux.org/alpine/v3.18/main/aarch64/libffi-3.4.4-r2.apk"
    sha256: "87d1e17785b654351efa2aca7ee27c61453237690802cdc90b21f1feaa323793"
  - url: "https://dl-cdn.alpinelinux.org/alpine/v3.18/main/aarch64/libncursesw-6.4_p20230506-r0.apk"
    sha256: "a7a3c246e0f3aa7e0666bb8ecb2718cc544db430a14fb7691c01b687cc4d43d2"
  - url: "https://dl-cdn.alpinelinux.org/alpine/v3.18/main/aarch64/ncurses-terminfo-base-6.4_p20230506-r0.apk"
    sha256: "8db6be27304fc2a54c203b7835a46b0429bb4490e7574a9a2fd9c26b1a2e9074"
  - url: "https://dl-cdn.alpinelinux.org/alpine/v3.18/main/aarch64/tcl-8.6.13-r1.apk"
    sha256: "41584aef92db825faf3e755e580d7f1373a18b9f92d0786be5c17515b02848c3"
  - url: "https://dl-cdn.alpinelinux.org/alpine/v3.18/main/aarch64/tcl-dev-8.6.13-r1.apk"
    sha256: "ea16b3180f72e3665d09813c4a0b918e4828b280959c2f6ed5cb5ec55a345070"

# 同版本官方 release（debian-12.13）——标准库 .bo/.v/tcllib 为架构无关工件
official_stdlib:
  url: "https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz"
  sha256: "9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3"

# yices2 源码（tag tarball 内为空目录；STP/YICES 走上游官方 stub 构建）
yices_src:
  url: "https://github.com/B-Lang-org/bsc/releases/download/2026.01/yices-src-for-bsc-2026.01.tar.gz"
  sha256: "a5114c8f1e04a75a06598ac9763922f9186554b6f1326c1454b2e06deafd5575"

