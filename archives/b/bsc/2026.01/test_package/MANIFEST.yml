# Upstream test declaration for bsc 2026.01.
package: bsc/2026.01
homepage: "https://github.com/B-Lang-org/bsc"

upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: "make check-smoke / make check-suite (requires a built bsc + GHC; testsuite/ has upstream suite)"
upstream_tests: []

test_package_tests:
  - file: check_source.sh
    description: "Verify the packaged upstream contract: BSD-3-Clause/Bluespec license, GHC 7.10.3-9.12 requirement, 5-package Haskell dependency list (incl. 2026.01's new strict-concurrency), 2026.01 release identity"
    command: "sh check_source.sh <package>"
    executable: true
  - file: test_consumer.py
    description: "Consumer use case (Path B): downstream toolchain-gating script consuming only the package - derives the supported GHC range from INSTALL.md and gates 9.10.1/9.6.4/7.10.2, extracts the Hackage provisioning manifest from src/Makefile, consults platform.mk for aarch64"
    command: "python3 test_consumer.py <package>"
    executable: true
  - file: test_fib.bsv
    description: "Functional: upstream smoke design (verbatim examples/smoke_test/FibOne.bsv) compiled to Verilog by the packaged bsc binary; generated mkFibOne.v module verified (bsc --version also executed)"
    command: "bsc -verilog -g mkFibOne test_fib.bsv"
    executable: true

assertion_count: 8
