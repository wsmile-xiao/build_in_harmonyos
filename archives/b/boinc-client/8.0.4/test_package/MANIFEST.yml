# test_package/MANIFEST.yml
package: boinc-client/8.0.4
homepage: "https://boinc.berkeley.edu"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清点（rule4 如实申报）：
# BOINC 8.0.4 自带 44 个 gtest 单元测试（tests/unit-tests/，lib 8 文件 + sched 1 文件）。
# 上游仅注册于 CMake 构建树（add_test），autotools 的 make check 未接入该子目录；
# 本配方改在 build() 中用 test_requires("gtest/1.17.0")（ohpcd registry 的 OHOS armv8
# 二进制包）直接编译 tests/unit-tests/lib/*.cpp（42 例）并逐个 suite 真实运行，
# 输出 HMBS_UPSTREAM_TEST_RESULT marker。
# 实测通过率: 37/42（lib 层）；sched 2 例（test_credit）无法在本配方内编译运行：
# 其链接目标是服务端调度库 libsched.a（sched/Makefile.am: lib_LTLIBRARIES = libsched.la），
# 由 68 个服务端源（含 handle_request.cpp/sched_main.cpp 等）+ db 层构成，本配方为
# client-only（--disable-server），configure 后 sched/ 目录不产出 libsched.a。
# 注：审计复核（2026-09-17）确认 ohpcd registry 实际存在 mariadb/11.8.8 的 OHOS armv8
# 二进制包（mysql.h + libmariadbclient.a 齐全），MySQL 客户端依赖本身可解；但即便接入
# mariadb + wolfSSL，test_credit 仍需完整服务端 libsched.a（含 sched_config/sched_shmem/
# sched_customize/sched_util_basic/sched_types/plan_class_spec/handle_request 等 68 源 +
# db 层），属完整服务端构建范畴，超出 client-only 配方边界，故 sched 2 例如实声明未执行。
# lib 42 例失败明细（均已在 OHOS arm64 沙箱实测）：
#  - test_synch.synch: 崩溃 Signal 31 (SIGSYS) — create_semaphore→semget，OHOS 沙箱禁 SysV 信号量
#  - test_shmem.shmem: shmget Permission denied (-144) — 同上，SysV 共享内存被沙箱拒绝
#  - test_util.drand: drand()==0 — drand()=rand()/RAND_MAX，OHOS 首次 rand() 返回 0
#  - test_util.linux_cpu_time: linux_cpu_time(1)==0 — /proc/1/stat 第 14/15 字段在 OHOS 沙箱不可解析
#  - test_str_util.precision_time_to_string: 上游期望串含 INT_MIN 溢出伪影
#    ("...10.-2147483648")，实际输出 "...10.2147483647" 才是正确格式化（上游测试自身 bug）
upstream_tests: []

# test_package 验证（application 包，交叉产物无法在 x86 沙箱运行二进制，
# 改为静态校验；断言与 test_package/test.sh 逐条对应）
test_package_tests:
  - file: test.sh
    description: "定位 boinc_client/boinccmd 二进制（在 VirtualRunEnv PATH 的 bin/ 下）"
    command: "conan test_package"
  - file: test.sh
    description: "验证 boinc_client/boinccmd 均为有效 ELF 文件（file 命令判定）"
    command: "conan test_package"
  - file: test.sh
    description: "验证 boinc_client/boinccmd 二进制体积 > 10000 字节（非空 stub）"
    command: "conan test_package"
  - file: test.sh
    description: "尝试运行 boinc_client --help / boinccmd --version（退出码 0/139/非零均视为可执行，容忍交叉编译崩溃）"
    command: "conan test_package"

# 断言总数（与 test.sh 实际检查点一致）:
# 2(二进制存在) + 2(ELF) + 2(体积) + 2(运行尝试) = 8
assertion_count: 8
