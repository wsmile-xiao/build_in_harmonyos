# 版本级 manifest
# 文件位置: archives/{letter}/{name}/8.0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.0.4"

# 软件名
software: "boinc-client"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/BOINC/boinc/archive/refs/tags/client_release/8.0/8.0.4.tar.gz"

  # 源码校验和
  sha256: "c8383c0106f8de2f74f4959e498e39d14fd427b66040fb6f114a690de7544d27"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-server"
    - "--enable-client"
    - "--disable-manager"
    - "--disable-fcgi"
    - "--with-ssl=<openssl pkg>"
    - "--with-libcurl=<curl pkg>"
    - "--prefix=/"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/3.5.6.1
    - curl/8.15.0
    - zlib/1.3.1.1
    - gtest/1.17.0  # 仅 test_requires（编译/运行上游单元测试）

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/autotools/ (77 files, pre-generated configure/Makefile.in/aclocal.m4)"
  - "pkgconfigdir 修复（lib/api/zip 的 Makefile.am）"
  - "configure.ac 增加 subdir-objects"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CI 沙箱无 automake：预生成 autotools 输出随配方分发，并把 configure.ac/Makefile.am/m4 的 mtime 钉到过去，防止 make 重跑 aclocal/automake"
  - "autotools 默认 ac_default_prefix=/usr/local，configure 必须传 --prefix=/ 才能使二进制装到 package 的 bin/，命中 test_package VirtualRunEnv 的 PATH"
  - "上游 gtest 单元测试仅注册于 CMake 构建树；用 test_requires('gtest/1.17.0')（ohpcd registry 的 OHOS armv8 二进制包）在 build() 直接编译 tests/unit-tests/lib/*.cpp 并逐个 suite 运行，42 例实测 37 通过 / 4 失败 / 1 崩溃（SysV 信号量/共享内存被 OHOS 沙箱拒绝、rand() 首值 0、/proc/1/stat 不可解析、上游期望串含 INT_MIN 溢出伪影）"
  - "test_sched（sched 层 2 例）依赖 MySQL + 服务端 libsched.a，client-only（--disable-server）构建不产出 sched 库，OHOS 无现成 MySQL 客户端库，无法在 client 配方中编译运行"
