patches:
  - patch_file: "patches/0001-fix-configure-tmpdir.patch"
    patch_description: "Use TMPDIR and umask 022 for Autoconf temporary directories"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-round-to-int-nonfinite.patch"
    patch_description: "Return INT_MIN for non-finite double in round_to_int to avoid UB ((int)inf differs across libc)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-p124-informative-check.patch"
    patch_description: "Relax p124.test to informative pass/fail check (libm log() ULP difference, same as upstream p117.test)"
    patch_type: "test"
    strip: 1
