package: bas55/2.0
upstream_test_in_build: true
upstream_tests:
  - file: tests/
    description: "上游 automake TESTS 共 205 个 .test 脚本（p001-p106、p113-p130、p132-p202、p204-p208、printab/printspc/table/truend/pow），每个脚本运行一个 NBS Minimal BASIC 测试程序并对 stdout/.ok 与 stderr/.eok 各做一次 diff 断言（p117 为 INFORMATIVE 特例），合计 410 个 diff 断言点，由 build() 中 make check 全量执行"
upstream_test_note: "上游测试均为批处理运行 .BAS 程序后 diff 期望输出，无 TTY/GUI/网络需求，205/205 全部可在设备实测。断言口径：205 脚本 × 2 diff 断言点 = 410 断言点（其中 p117/p124 两个 INFORMATIVE 特例 stdout 改 grep 通过标记，不逐行 diff，见 notes.md），make check 全 PASS 才继续构建（set -e）。master 与 release tarball 的 tests 结构一致，以 release tarball 为准。"
test_package_tests:
  - file: test_bas55.sh
    description: "bas55 二进制存在、-v 版本输出、-h 用法、运行示例 BASIC 程序输出校验（正向）、非法 BASIC 程序必须在 stderr 报告错误（负向，bas55 容错语义下退出码为 0，校验错误输出）、非法 -g 参数必须被拒绝并输出 bad GOSUB stack size（负向，退出码非 0）"
    command: "bas55 -v; bas55 -h; bas55 hello.bas; bas55 bad.bas (stderr error expected); bas55 -g bogus (must fail)"
assertion_count: 6
