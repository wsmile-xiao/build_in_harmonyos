# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.78/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.78"

# 软件名
software: "boot-info-script"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"

# 构建系统类型
# cmake | autotools | makefile | meson | custom | none
build_system: none

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/arvidjaar/bootinfoscript/archive/refs/tags/v0.78.tar.gz"

  # 源码校验和
  sha256: "19780542c78756cee5eaf2327e118472d8d509df93bc7bf60deefa7db5ada80d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | none
  system: none

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 bash 脚本类工具（无 C/C++ 编译）：conanfile build() 留空，package() 复制脚本并生成 wrapper"
  - "OHOS 无 /bin/bash，shebang 失效——wrapper 用 #!/usr/bin/env sh 定位真实 bash（command -v bash）后显式执行"
  - "语言预检（R47）：纯 bash/纯数据项目被 lang_detect 判为 other，需 OHPCD_LANG=other 声明任务语言（同 ausweisapp-nftrules 先例）"
