# test_package/MANIFEST.yml
# 上游官方测试声明文件 — binn 3.0

package: binn/3.0
homepage: "https://github.com/liteserver/binn"

# 上游测试命令 (makefile 构建，`make test` 编译并运行 test_binn)
upstream_check_command: "make test"

# conanfile.py build() 中已集成上游测试（make test）
upstream_test_in_build: true
upstream_test_command: "make -j1 test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_binn.c
    source: binn-3.0/test/test_binn.c
    description: "binn 核心单元/回归测试（8 个顶层 test 例程：version/endianess/int64/floating/test1/test2/test3/invalid）"
    command: "./test/test_binn"
  - file: test/test_binn2.c
    source: binn-3.0/test/test_binn2.c
    description: "binn 扩展对象/迭代/值转换测试（test_binn2 驱动 7 个子例程）"
    command: "./test/test_binn"
  - file: test/test_binn_json.c
    source: binn-3.0/test/test_binn_json.c
    description: "JSON 转换往返测试（可选，依赖 jansson，独立编译运行）"
    command: "./test/test_binn_json"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 round-trip 测试：binn_object → binn_to_memory → binn_open_memory 读取回写"
    command: "./test_binn"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17