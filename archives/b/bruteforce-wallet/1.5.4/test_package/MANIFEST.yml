# test_package/MANIFEST.yml — bruteforce-wallet 1.5.4
# 上游官方测试声明文件 (CI L0e 强制要求)

software: bruteforce-wallet
version: "1.5.4"
build_system: autotools
package_type: application

# hmbs 真机门禁字段：上游无正式测试框架，但 `make` 构建步骤本身是唯一
# 可验证的上游断言（nwipe/0.39 先例），故标记为 true 并在 build/test 中执行。
upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "bruteforce-wallet 1.5.4 (glv2/bruteforce-wallet tag 1.5.4)"
  top_level_files:
    - Makefile.am      # 仅 bin_PROGRAMS = bruteforce-wallet，无 TESTS / check_PROGRAMS
    - configure.ac     # 仅 AC_PROG_CC/AC_CHECK_HEADERS/AC_CHECK_LIB（-lm/-pthread/-lcrypto/-ldb），无测试相关宏
    - autogen.sh       # 仅 autoreconf 调用，无测试生成
    - src/             # 仅 bruteforce-wallet.c、elliptic-curve.c/.h、version.h，无测试源文件
  scanned_for:
    - "tests/ / test* 目录与文件"
    - "Makefile.am TESTS / check_PROGRAMS"
    - "configure.ac 测试相关宏"
    - "GitHub Actions workflows（仓库 Actions 为空）"
    - "Debian debian/tests（发行版 autopkgtest，非上游测试）"
  scan_result: "0 matches — 上游无正式测试框架；`make check` 无目标可跑"
  reason: "上游唯一可验证步骤是 `make` 构建本身（README：./configure && make）。配方 build() 在真机完成等价直接编译（全部 C 源文件 + 链接二进制），test.sh 的 -h 烟雾（版本横幅 1.5.4 + 用法文本，非空输出断言）证明构建步骤通过，计为 1 个上游断言。"

upstream_check_command: "make (upstream build step)"
upstream_test_in_build: true
upstream_test_command: "direct-cc compile (equivalent of upstream make) + bruteforce-wallet -h smoke"

# 上游实际运行的测试程序（构建等价步骤，真机已执行）
upstream_tests:
  - file: src/bruteforce-wallet.c
    source: bruteforce-wallet-1.5.4/src/bruteforce-wallet.c
    description: "上游构建等价验证：直接编译全部 C 源并链接二进制，-h 烟雾断言版本横幅与用法文本"
    command: "bruteforce-wallet -h"

# test_package 中自带的测试（真实执行被测二进制，R34）
test_package_tests:
  - file: test.sh
    description: "bruteforce-wallet -h：断言用法文本与 1.5.4 版本横幅"
    command: "bruteforce-wallet -h"
  - file: test.sh
    description: "bruteforce-wallet 无参：断言 missing wallet filename 报错"
    command: "bruteforce-wallet"
  - file: test.sh
    description: "bruteforce-wallet -z：断言 unknown option 报错"
    command: "bruteforce-wallet -z"

# 测试断言总数
assertion_count: 3
