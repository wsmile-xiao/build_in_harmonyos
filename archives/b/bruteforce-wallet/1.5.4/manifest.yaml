# 版本级 manifest — bruteforce-wallet 1.5.4
# 遵循 ARCHIVE-SPEC v2.0

version: "1.5.4"
software: "bruteforce-wallet"
status: built
build_date: "2026-09-09"
build_system: autotools

source:
  url: "https://github.com/glv2/bruteforce-wallet/archive/refs/tags/1.5.4.tar.gz"
  sha256: "dd91cf78b33d4862120703ab0c81dac64722d18a8867a104474ffaef0738731c"
  tar_format: tar.gz

build:
  system: direct-cc
  cc_command: "<Conan conf tools.build:compiler_executables> -O2 -Isrc -I<openssl>/include -I<bdb>/include src/*.c -lcrypto -ldb -lm -pthread -static"
  dependencies:
    - openssl/3.5.8.1
    - berkeley-db/4.8.30
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "预检盒无 autoreconf/bash：上游仅 2 个 C 文件且无 config.h，直接 cc 编译绕过 autogen（knock/zimg 先例）"
  - "上游无测试套件：无 tests 目录、无 make check 目标（审计见 test_package/MANIFEST.yml）"
  - "终端工具静态链接 -static（R26，bvi 先例）"
