software: brew-cask-completion
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-21"

# 构建系统
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/xyb/homebrew-cask-completion/archive/refs/tags/v2.1.tar.gz"

  # 源码校验和
  sha256: "27c7ea3b7f7c060f5b5676a419220c4ce6ebf384237e859a61c346f61c8f7a1b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 安装产物
# ============================================================

install_files:
  - path: share/bash-completion/completions/brew-cask
    size: 4349
    sha256: d159cb3cb6e0d7c9828153c2640b29d97c9bfe60151b403b39bdb3873b8ecc60
    type: completion-script
    description: "Bash补全脚本 for brew-cask"
  - path: share/fish/vendor_completions.d/brew-cask.fish
    size: 7413
    sha256: a6262c89da6a8d156665377243b04a087951f08003a2a06fdcfa1941f1f87cbe
    type: completion-script
    description: "Fish补全脚本 for brew-cask"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "brew-cask-completion源码仓库位于xyb/homebrew-cask-completion而非Homebrew组织"
  - "纯补全脚本包无构建系统，需创建Makefile支持DESTDIR模式安装"
  - "SSL_CERT_FILE=/etc/ssl/certs/cacert.pem可解决Python urllib SSL验证失败"
