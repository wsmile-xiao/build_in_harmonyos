# 版本级 manifest — belr 5.3.105
# 遵循 ARCHIVE-SPEC v2.0

version: "5.3.105"
software: "belr"
status: built
build_date: "2026-10-01"
build_system: cmake

source:
  url: "https://gitlab.linphone.org/BC/public/belr/-/archive/5.3.105/belr-5.3.105.tar.gz"
  sha256: "b33f36f367c5e8c4755a1461ac62e257f2f55d8953167aeba7f18c585f8cac16"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_STRICT=OFF"
    - "-DENABLE_UNIT_TESTS=ON（with_unit_tests，默认）"
    - "-DENABLE_TOOLS=OFF（本包只交付库与头文件）"
    - "-DBUILD_SHARED_LIBS=OFF（静态包）"
    - "-DBCToolbox_DIR=<bctoolbox>/share/BCToolbox/cmake（用上游 config 提供 bc_apply_compile_flags 与 BCToolbox_TARGET）"
    - "OHOS: -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=armv8（E092）"
  dependencies:
    - bctoolbox/5.3.115
  test_dependencies:
    - bcunit/5.3.113
  cc: clang
  cxx: clang++

patches_applied: []

package_type: library
artifacts:
  - "lib/libbelr.a"
  - "include/belr/*.h（abnf.h / belr.h / grammarbuilder.h / parser.h）"
  - "include/bctoolbox/**（belr 公共头依赖的 bctoolbox 头文件，随包交付）"
  - "share/Belr/cmake/*（上游 CMake config）"
  - "licenses/LICENSE.txt（GPL-3.0-or-later）"
libs:
  - belr
requires:
  - bctoolbox/5.3.115

tests:
  upstream_suite: bcunit (tester/belr-tester, build() 内直接执行)
  upstream_suites: "Grammar(3) + Parser(2)"
  upstream_registered: 5
  upstream_passed: 5
  upstream_failed: 0
  upstream_skipped: 0
  upstream_pass_rate: "5/5 (100%)"
  consumer_checks: 9
  consumer_failures: 0
  consumer_pass_rate: "9/9 (100%)"
  command: "conan create archives/b/belr/5.3.105 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"

knowledge_gained:
  - "上游不注册 ctest：belr 的 bcunit tester 必须直接执行；资源目录由 config.h 中编译期常量 BELR_LOCAL_RESOURCE_LOCATION 指向源码 tester/res，因此在 build 目录作为 cwd 运行即可"
  - "Belledonne 包的 CMakeDeps 配置不向间接消费者导出 include 目录（实测 bctoolbox_INCLUDE_DIRS 为空，经 bzrtp 间接依赖同样为空），因此依赖 bctoolbox 头的包需随包交付这些头文件（与 bzrtp/5.3.105 同款做法）"
  - "belr 的 handler 需要 std::function（含 result_type/first_argument_type），裸函数指针需要用 make_fn 包装；Parser<shared_ptr<T>> + std::function<shared_ptr<T>(rulename, text)> 是可用的 C++ 消费姿势"
  - "belr 的 parseInput 返回识别器停止位置（叶子规则为最后一个匹配字符的下标），与 handler 收到的完整匹配文本长度相差 1，属上游既有语义"

adaptation_paths:
  - A
