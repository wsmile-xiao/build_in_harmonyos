# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: belr/5.3.105
homepage: "https://gitlab.linphone.org/BC/public/belr"

# 上游没有把 tester 注册进 ctest，测试入口是 tester/belr-tester（bcunit 框架）
upstream_check_command: "tester/belr-tester"

upstream_test_in_build: true
upstream_test_command: "tester/belr-tester (bcunit, 2 suites / 5 cases)"

upstream_test_count: 5
upstream_test_suites:
  - name: Grammar
    cases: 3
    command: "tester/belr-tester --suite Grammar"
  - name: Parser
    cases: 2
    command: "tester/belr-tester --suite Parser"

upstream_tests:
  - file: tester/grammar-tester.cpp
    source: belr-5.3.105/tester/grammar-tester.cpp
    description: "Suite [Grammar]: SIP grammar save and load / SIP grammar with aliases rules / Grammar loader"
    command: "tester/belr-tester"
  - file: tester/parser.cpp
    source: belr-5.3.105/tester/parser.cpp
    description: "Suite [Parser]: Parser connected to C functions / Parser with inheritance"
    command: "tester/belr-tester"

consumer_test_count: 1
test_package_tests:
  - file: test_belr.cpp
    description: "第三方消费者视角: ABNF 语法编译 + Parser 规则处理 + 完整/部分匹配语义, 共 9 个断言"
    command: "./test_belr"

assertion_count: 9
