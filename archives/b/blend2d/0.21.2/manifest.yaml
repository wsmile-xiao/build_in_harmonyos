software: blend2d
version: "0.21.2"
status: published
build_date: "2026-08-27"
build_system: cmake

source:
  url: "https://blend2d.com/download/blend2d-0.21.2.tar.gz"
  sha256: "234ba57a64153c96885a6271f15fdcf6c594ac8cb03adaad19abb8d3b2b533fa"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBLEND2D_STATIC=ON"
    - "-DBLEND2D_TEST=OFF"
    - "-DBLEND2D_NO_JIT=OFF"
    - "-DBLEND2D_NO_INSTALL=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Official source release bundles asmjit — no external dependency needed"
  - "CMake POSIX branch handles OHOS (libc/pthread/libm auto-detected)"
  - "Futex uses __linux__ macro (defined by clang on OHOS)"
  - "API uses snake_case naming"
  - "conan create requires shared option for library package_type"
