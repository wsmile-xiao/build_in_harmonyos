package: boulder-game/1.02
homepage: https://github.com/rh-galaxy/boulder
upstream_check_command: "none (upstream has no automated test target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_no_tests_reason: >-
  The fixed upstream commit contains game/editor sources and desktop Makefiles,
  but no automated test suite or check target. Vendored SDL test headers belong
  to the dependency and are not Boulder tests. Added CTest checks are adaptation
  regression tests and are not described as upstream tests.
test_package_tests:
  - file: test.sh
    description: >-
      Executes the installed boulder-check against 14 images, 25 maps, 18 WAV
      effects and one Vorbis stream; runs a save/load roundtrip using upstream
      editor code; rejects missing assets; verifies packaged ArkUI modules.
    command: bash test.sh PACKAGE_DIR
assertion_count: 11 # top-level shell checks; internal C++ checks are additional
manual_tests:
  - "Signed ArkUI HAP: menu, Enter starts level, Right moves player"
  - "User confirmed audible menu music"
  - "Original editor: draw, S save, L reload, saved map persists after process restart"
  - "F3 selects a 3x3 brush and draws a 3x3 area"
