name: boost1.84-wave
description: "Boost.Wave (C++ preprocessor library) component package from Boost 1.84.0, HarmonyOS PC adapted"
type: library
homepage: https://www.boost.org/
upstream_repo: https://github.com/boostorg/boost
languages: [cpp]
versions:
  - version: "1.84.0"
    status: published
    date: 2026-09-05
    branches:
      - feat/boost1.84-wave-1.84.0
    notes: >
      组件拆分包：从 Boost 1.84.0 官方 tarball 手动编译 libboost_wave 及其
      非头文件依赖（filesystem/thread/program_options），b2 在 OHOS 不可用
      （E068）。补丁 0001 修 sp_thread_sleep（pthread_setcancelstate 缺失）。
      编译加 -fwrapv 保住 wave 整数溢出检测语义。上游 testwave 套件
      226/226 全过。
