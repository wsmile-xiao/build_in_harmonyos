# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: bmt/0.6
homepage: "https://github.com/tautschnig/bmt"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试套件：工具集仅通过 cprover/rules 驱动外部验证工具执行基准，
# 需外部基准数据与验证器（CBMC/CPAchecker 等），仓库内无可运行的 tests/ 或 make check。
# 审计见 notes.md 与下方声明。
upstream_tests: []

test_package_tests:
  - file: test_bmt.sh
    description: "真实冒烟测试：检查 cpbm 可执行、--version 为 0.6、help 子命令完整、bash 语法与 share/cpbm 载荷"
    command: "bash test_bmt.sh <package bin dir> <package folder>"

assertion_count: 6

# 审计声明（供 HMBS 校验 upstream_tests_exist=false）
upstream_tests_exist: false
upstream_test_audit: "审计源码树 scripts/、根目录与 debian 规则：无 tests/、test/、ctest、pytest 或 make check 目标；验证流程依赖外部 C 验证工具与基准数据包，无自包含测试，遂判定上游无可直接运行的测试套件（审计人：gyccc，日期：2026-09-05）"
