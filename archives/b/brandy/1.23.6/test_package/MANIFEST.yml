# test_package/MANIFEST.yml
# 上游官方测试声明文件 — brandy 1.23.6 (Matrix Brandy)

package: brandy/1.23.6
homepage: "https://github.com/stardot/MatrixBrandy"

# 上游测试命令 (CMake 注册的 ctest 目标)
# Regressions: prove --exec ${CMAKE_BINARY_DIR}/sbrandy -r t/
# 注: ctest 直接运行失败是 prove 相对路径 t/ 在 build 目录解析问题；
#     从源码目录以绝对路径运行 prove 全部通过 (Files=1, Tests=3, PASS)。
upstream_check_command: "prove --exec sbrandy -r t/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: 01count.t
    source: brandy-1.23.6/t/01count.t
    description: "TAP 回归测试：BBC BASIC 变量累加与算术断言（3 个 ok 断言）"
    command: "prove --exec <sbrandy> -r t/"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "功能性测试：sbrandy --version + 执行 BBC BASIC 程序（FOR/NEXT/PRINT/IF 算术）断言输出"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
