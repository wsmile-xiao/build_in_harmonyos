# 版本级 manifest — bluez-qt 6.28.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.28.0"

# 软件名
software: "bluez-qt"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（KDE Frameworks 官方源，R39）
  url: "https://download.kde.org/stable/frameworks/6.28/bluez-qt-6.28.0.tar.xz"

  # 源码校验和（KDE 官方 sha256）
  sha256: "ae4410142170e84df104ef9723c7307de1d5ab68b2874c4ccdb0af99e00ae806"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DKF_IGNORE_PLATFORM_CHECK=true"
  - "-DKDE_SKIP_UNINSTALL_TARGET=TRUE"
  - "-DKF_SKIP_PO_PROCESSING=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "extra-cmake-modules/6.28.0"
  - "qtbase/6.11.1.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "bluez-qt 依赖 qtbase 6.11.1.1（FEATURE_dbus=ON，提供 Qt6::DBus 组件）；6.11.1 的 FEATURE_dbus=OFF 不满足 target_link_libraries(Qt6::DBus) 需求"
- "ECM 6.28.0 打包缺 ECMVersionHeader.h.in 与 ECMQtDeclareLoggingCategory.cpp.in/.h.in 模板，需在 generate() 用 ECM 源码模板内容补齐（karchive 同款先例）"
- "qtbase cmake_find_mode=none 不自带 CMakeDeps 生成的 Qt6Config.cmake，需显式设置 Qt6_DIR/Qt6Core_DIR/Qt6DBus_DIR/Qt6Network_DIR 指向 qtbase 包 config 目录"
- "ECM KDEInstallDirs 需 qtpaths（qtbase 包 bin/）查询 QT_INSTALL_PREFIX，generate() 中把 qtbase bin/ 加入 PATH"
