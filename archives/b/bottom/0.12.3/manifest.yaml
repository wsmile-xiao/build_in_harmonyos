software: bottom
version: "0.12.3"
status: built
build_date: "2026-08-27"
build_system: cargo
conan_ref: "bottom/0.12.3"

source:
  url: "https://github.com/ClementTsang/bottom/archive/refs/tags/0.12.3.tar.gz"
  sha256: "1c70894f0eceb7034075959ff3080cf4706c11d7c012912c24e777abe4e62b70"
  tar_format: tar.gz

build:
  system: cargo
  configure_options:
    - "cargo build --release --locked"
    - "OHOS target: aarch64-unknown-linux-ohos"
    - "OHOS fallback: Harmonybrew Rust 1.97.1, OpenSSL, zlib, CA bottles"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "bottom 0.12.3 is a Rust CLI process/system monitor built with cargo."
  - "Uses Harmonybrew Rust toolchain bottles to bootstrap cargo/rustc on OHOS."
  - "Default features (deploy: battery, gpu, zfs) compile successfully on OHOS."
  - "Static musl binary runs on OHOS without ELF signing issues."
  - "Recipe pattern derived from cargo-bloat 0.12.1."
