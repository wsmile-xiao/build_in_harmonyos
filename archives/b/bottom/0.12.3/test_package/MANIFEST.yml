package: bottom/0.12.3
homepage: "https://github.com/ClementTsang/bottom"

upstream_check_command: "cargo build --release --locked"
upstream_test_in_build: false
upstream_test_command: "cargo build --release --locked"

upstream_tests:
  - file: Cargo.toml
    source: bottom-0.12.3/Cargo.toml
    description: "Upstream project builds with default features (deploy: battery, gpu, zfs)"
    command: "cargo build --release --locked"

test_package_tests:
  - file: test_btm.py
    description: "Runs btm --version to verify the binary is functional"
    command: "python3 test_btm.py <btm-binary>"

assertion_count: 2
