# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bacula-pgsql/15.0.3
homepage: "https://www.bacula.org"

# 上游测试命令 — Bacula 有独立 regress 套件（bacula-regress 单独包），
# 本包只构建 PostgreSQL 目录后端（src/cats），regress 需 Director/Storage
# daemons + PostgreSQL server 全套环境
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-21 实测记录）：
# - Bacula regress 套件（独立包 bacula-regress-15.0.3）需要完整备份环境
#   （Director/Storage/File daemons + PostgreSQL server）——OHOS 无
#   PostgreSQL server，无法运行（环境阻塞，如实说明，非跳过）
# - 本包构建：configure --with-postgresql + make -C src/cats 生成
#   libbaccats-postgresql.so ——实测通过
# - 消费者验证（test_package）：库存在 + ELF + libpq 链接（R34 降级，
#   数据库后端运行需 PostgreSQL server，OHOS 无——如实说明）
upstream_tests: []
