# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: babeltrace2/2.1.2
homepage: "https://babeltrace.org"

# 上游测试命令（TESTS 套件随包，依赖 glib 就绪后 make check 运行）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序（configure 崩溃点定位 glib 依赖，0 用例当前可执行）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "babeltrace2 --version 版本断言"
    command: "babeltrace2 --version"

# 测试断言总数
assertion_count: 1
