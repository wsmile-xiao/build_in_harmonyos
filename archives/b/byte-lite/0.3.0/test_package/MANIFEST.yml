# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: byte-lite/0.3.0
homepage: "https://github.com/martinmoene/byte-lite"

upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: lest 框架, 4 个 CTest 可执行文件 (cpp98/cpp11/cpp14/cpp17)
upstream_tests:
  - file: test/byte.t.cpp
    source: byte-lite-0.3.0/test/byte.t.cpp
    description: "byte 核心单元测试 (lest 框架: 构造/运算/转换/比较等)"
    command: "ctest -R test-cpp11"
  - file: test/byte-main.t.cpp
    source: byte-lite-0.3.0/test/byte-main.t.cpp
    description: "测试主函数入口 (lest 框架 main)"
    command: "ctest -R test-cpp11"

test_package_tests:
  - file: test_byte_lite.cpp
    description: "消费者测试: 验证 byte-lite 库链接、byte 构造/to_integer/位运算 API"
    command: "./test_byte_lite"

assertion_count: 3
