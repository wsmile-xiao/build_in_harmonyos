# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bytes/0.0.4
homepage: "https://github.com/clibs/bytes"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: bytes-0.0.4/test.c
    description: "上游断言式测试：string_to_bytes 与 bytes_to_string 两个测试函数"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：仅经公开头文件 bytes.h 调用 string_to_bytes/bytes_to_string 并断言结果"
    command: "./test_package/test_bytes"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14