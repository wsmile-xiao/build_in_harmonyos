# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.0.4"

# 软件名
software: "bytes"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/clibs/bytes/archive/refs/tags/0.0.4.tar.gz"

  # 源码校验和
  sha256: "1d8fa516d2e1c1607b40ee1e46c46b282be420d9aaa1d37d1f3e24bf5cbb1485"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "clibs 单文件 C99 库（Makefile 无 configure/无 make install/仅 make test）需自定义 Conan 配方：CC 直接编译 bytes.c + llvm-ar 归档 libbytes.a，package() 手动安装头文件与静态库"
  - "上游测试为断言式测试函数（非框架 TEST_CASE），双口径台账按独立断言函数计数（bytes: 2/2=100%）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
