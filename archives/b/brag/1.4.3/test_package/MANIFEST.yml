# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# brag 1.4.3 上游发布包不包含官方自动化测试套件。
# 本包测试均为 OHOS 适配自研的离线消费者侧 smoke tests。

package: brag/1.4.3
homepage: "https://brag.sourceforge.net/"

# 上游官方测试：无
upstream_official_tests: []

# 上游没有 make check / ctest 等自动测试入口
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 构建阶段没有额外的适配自研测试
adapted_tests: []

# test_package 中的消费者侧适配测试
test_package_tests:
  - file: test.sh
    origin: ohos-adaptation (self-authored)
    description: "离线 smoke test：验证 brag、tclsh8.6、uudeview 可用；验证 Tcl 8.6.14；验证 uudeview usage；验证 brag 的预期 usage 路径和退出码"
    command: "bash test.sh"

# test.sh 中实际执行的断言/检查点总数
assertion_count: 10
