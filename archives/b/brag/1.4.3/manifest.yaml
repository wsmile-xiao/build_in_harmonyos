knowledge_gained:
  - "brag 1.4.3 is a pure Tcl script and does not require compilation."
  - "The packaged launcher must use tclsh8.6 because the published tcl/8.6.14 package provides tclsh8.6."
  - "tcl/8.6.14 must be declared with run=True so VirtualRunEnv exposes tclsh8.6 at runtime."
  - "brag invokes uudeview during attachment decoding, so uudeview/0.5.20 is a required runtime dependency."
