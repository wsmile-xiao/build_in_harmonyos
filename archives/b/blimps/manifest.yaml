software: blimps
display: "blimps"
description: "FHCRC BLIMPS（BLocks IMProved Searcher）Blocks 蛋白质基序数据库搜索与 Block Maker 生信命令行工具套件，含 blocks_search/blimps 搜索、codehop 引物设计、motifj/motomat Block 构造、blkprob/blksort 结果分析等 49 个工具"
category: bioinformatics
homepage: "https://ftp.ncbi.nlm.nih.gov/repository/blocks/unix/blimps/"
license: "FHCRC non-commercial license"
build_system: makefile

ohos_adaptation:
  key_points:
    - "两份 plain Makefile（blimps/Makefile.Linux + protomat/Makefile.Linux），CC/AR/RANLIB/CL/CFLAGS 全部在 make 命令行覆盖；make -j1（设备 make 无法建 jobserver fifo）"
    - "上游 Makefile 尾部 2004 年 makedepend 生成块引用宿主 /usr/include 路径，必须删除（patch 0001）"
    - "OHOS musl 保留 gets 符号仅 C11 门控其声明：调用只降警可链接运行，-D gets→fgets 命令行宏为可选有界读加固（8KB 语义变更已在 notes/README 声明）"
    - "util.c 遗留同名 getline() 与 musl 默认模式声明的 POSIX getline 冲突（patch 0002 重命名）；pssmdist/papssm static 声明错配、format_block 本地 static 副本与 blocks.h extern 冲突（patch 0003/0004）"
    - "工具把 .cs 等配置路径解析进固定小缓冲区，需在工作目录用短文件名运行；docs/ 数据表随包发布到 share/blimps/docs/"
    - "上游无测试套件（NO_UPSTREAM_TESTS），test_package 用上游 examples 数据 + distribution golden 做逐行比对（codehop/blimps）与功能冒烟（blkprob/motifj）"
  common_dependencies: []

versions:
  "3.9":
    status: built
    build_date: "2026-09-05"
    conan_ref: "blimps/3.9"
