package: blimps/3.9
homepage: "https://ftp.ncbi.nlm.nih.gov/repository/blocks/unix/blimps/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
# NO_UPSTREAM_TESTS: blimps 3.9 ships no test suite. Neither
# blimps/Makefile.Linux nor protomat/Makefile.Linux has a test/check target
# (targets: install/all/lib/local/clean/tags/depend/distribution only), and
# README/UPDATES describe no test harness. examples/ contains csh/perl demo
# driver scripts plus input data; some distributed goldens are stale
# (examples/blimps/distribution/example.blkprob was generated by BLKPROB
# 8/22/03 while the 3.9 code prints 12/23/06.1). Functional verification is
# therefore done below against the two reliable upstream goldens plus
# functional smoke runs.

test_package_tests:
  - file: test_blimps.sh
    description: "codehop 全输出与上游 golden euk.out 逐行一致；blimps 搜索全输出与上游 golden example.bli 逐行一致（仅归一化路径回显行）；blkprob 与 motifj 功能冒烟"
    command: "bash test_blimps.sh"

assertion_count: 10
