# 版本级 manifest
# 文件位置: archives/b/blimps/3.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（§2.2 交叉校验元数据，CI 不依赖）

# 版本号
version: "3.9"

# 软件名
software: "blimps"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"

# Conan 引用
conan_ref: "blimps/3.9"

# 构建系统
build_system: makefile

# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL（NCBI 官方归档）
  url: "https://ftp.ncbi.nlm.nih.gov/repository/blocks/unix/blimps/blimps-3.9.tar.gz"

  # 源码校验和
  sha256: "7dfc62c35055a1f7e5091ef9a719184282f7780f8f360084d4035982d4dd18df"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型
  system: makefile

  # 构建命令（两份 plain Makefile，命令行覆盖工具链变量）
  configure_options:
    - "make -j1 -f Makefile.Linux install CC=clang AR=ar RANLIB=ranlib OPTIMIZ='-O2 -Wno-error=implicit-function-declaration -Wno-error=int-conversion' DEFINES=\"-D'gets(s)=fgets(s,8192,stdin)'\" LDLIBS='-lblimps -lm'  # blimps/"
    - "make -j1 -f Makefile.Linux install CC=clang CL=clang CFLAGS='-O2 -D\"gets(s)=fgets(s,8192,stdin)\" -c'  # protomat/"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-remove-stale-makedepend-block.patch"
  - "patches/0002-rename-legacy-getline.patch"
  - "patches/0003-fix-static-decl-pssm.patch"
  - "patches/0004-rename-format-block-resize.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "blimps 3.9 builds via two plain Makefiles (blimps/Makefile.Linux, protomat/Makefile.Linux); pass CC/AR/RANLIB and CC/CL/CFLAGS overrides on the make command line, and use make install which moves artifacts into the source tree's bin/ and lib/ (no prefix)."
  - "The Makefile carries a generated makedepend block referencing 2004-era /usr/include and gcc 3.3 internal paths; it must be removed or every non-glibc build fails with 'No rule to make target /usr/include/assert.h'."
  - "OHOS musl keeps a working gets symbol (ld-musl exports it); only its declaration is C11-gated, so unpatched calls just warn, link and run. The -D gets-to-fgets command-line macro is optional bounded-read hardening (semantic change: unbounded -> 8KB) covering all 129 call sites, not a build requirement."
  - "util.c defines an uncalled legacy getline() that collides with the POSIX getline declaration OHOS musl stdio.h makes in the default mode (strict ISO hides it); renamed via patch. pssmdist.c/papssm.c/format_block.c have static/non-static declaration mismatches that clang 15 rejects as errors."
  - "The tools parse .cs/.stp config files into fixed-size path buffers, so long absolute paths get corrupted; run them from a working directory with short local file names."
  - "Device make cannot create a jobserver fifo (mkfifo not permitted); build with make -j1."
  - "codehop needs default.amino.frq + identity.frq + a codon usage table in the working directory; blimps search additionally needs default.qij."

test_results:
  type: test_package
  passed: 10
  failed: 0
  note: |
    test_package/test_blimps.sh runs codehop / blimps / blkprob / motifj on
    the upstream example inputs; codehop and blimps outputs are diffed
    against the upstream-distributed golden files (only the path-echo lines
    are normalized). Upstream has no test suite (NO_UPSTREAM_TESTS); see
    test_package/MANIFEST.yml.
