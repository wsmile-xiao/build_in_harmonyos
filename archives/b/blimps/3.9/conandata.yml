sources:
  url: "https://ftp.ncbi.nlm.nih.gov/repository/blocks/unix/blimps/blimps-3.9.tar.gz"
  sha256: "7dfc62c35055a1f7e5091ef9a719184282f7780f8f360084d4035982d4dd18df"

patches:
  - patch_file: "patches/0001-remove-stale-makedepend-block.patch"
    patch_description: "Drop the stale 2004-era makedepend output appended to Makefile.Linux; it references host paths (/usr/include, SuSE gcc 3.3 internals) that break configure-free builds on any non-glibc host"
    patch_type: "portability"
  - patch_file: "patches/0002-rename-legacy-getline.patch"
    patch_description: "Rename the never-called legacy getline() definition in util.c; it collides with the POSIX getline declaration that OHOS musl stdio.h makes in the default mode without feature macros (clang hard error, not downgradable; strict ISO mode hides the declaration)"
    patch_type: "portability"
  - patch_file: "patches/0003-fix-static-decl-pssm.patch"
    patch_description: "Add static to the forward declarations of read_a_freq (pssmdist.c) and read_freq (papssm.c) so they match their static definitions; clang rejects the mismatch as an error"
    patch_type: "portability"
  - patch_file: "patches/0004-rename-format-block-resize.patch"
    patch_description: "Rename format_block.c's file-local static resize_block_sequences copy; it conflicts with the extern declaration in include/blocks.h while the canonical definition lives in blocks.c"
    patch_type: "portability"
