# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bsd-finger/0.17
homepage: "https://github.com/Distrotech/bsd-finger"

# 上游无自带测试：netkit bsd-finger 仅含 Makefile 构建目标（finger/in.fingerd），
# 无 check/test 目标（已实测 `make check` / `grep check\\|test Makefile*` 均无结果）。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游无注册测试用例（无测试源文件/测试程序）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，直接执行 finger/in.fingerd 二进制)
test_package_tests:
  - file: test.sh
    description: "功能测试：finger 无参数输出 'No one logged on.'；未知用户报 no such user；--help/非法选项输出 usage；-l 长格式；in.fingerd 可执行存在"
    command: "bash test.sh"

# 自研测试断言总数（test.sh 中 6 项断言：5 个功能 check + in.fingerd 可执行检查）
assertion_count: 6