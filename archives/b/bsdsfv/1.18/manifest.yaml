# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（SourceForge 官方正式源）
  url: "https://downloads.sourceforge.net/project/bsdsfv/bsdsfv/1.18/bsdsfv-1.18.tar.gz"

  # 源码校验和
  sha256: "577245da123d1ea95266c1628e66a6cf87b8046e1a902ddd408671baecf88495"

