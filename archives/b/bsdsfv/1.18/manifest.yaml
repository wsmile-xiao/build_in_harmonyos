  - "0001-bsdsfv.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "bsdsfv 是单文件 C 项目（Makefile），无需 configure，直接 make CC=clang 即可"
  - "鸿蒙 aarch64 上 char 默认为无符号：getopt() 返回值必须用 int 接收，否则 EOF(-1) 被转成 255 导致循环死转（修复 char ch → int ch）"
  - "CRC32 校验值本质无符号：SFVTABLE.crc 用有符号 int 时，sscanf(%X) 读入高位为 1 的 CRC 会符号扩展，与 64 位 unsigned long 比较误判 BAD（修复 int crc → unsigned int crc）"
  - "鸿蒙 ELF 必须签名才能执行：conan package() 需先 llvm-objcopy --remove-section .codesign 再 binary-sign-tool sign -selfSign 1 再 chmod 755（b2sum 先例范式）"
  - "make install 需要 /usr/bin/install，鸿蒙无此工具，改用 conan copy() 手动打包到 bin/"
  - "test_package 中预期失败的命令（bsdsfv -T 检测到 BAD 返回非 0）必须加 || true 防 set -e 提前退出"
