# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bsdsfv/1.18
homepage: "https://sourceforge.net/projects/bsdsfv/"

# 上游测试命令: 上游无 configure/check target，纯单文件 C 项目（仅 Makefile all/install/clean）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游未提供任何测试套件）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证：SFV 创建/校验/篡改/缺失 4 项闭环）
test_package_tests:
  - file: test.sh
    description: "bsdsfv 功能闭环测试：版本(-v)、创建SFV(-c -a)、校验(-T 全OK)、篡改检测(-T 1bad)、缺失检测(-T 1missing)"
    command: "bash test.sh"

# 测试断言总数（test.sh 中 5 组验证场景的实际 grep 断言：version 1 + create 2 + verify 1 + tamper 1 + missing 1）
assertion_count: 6
