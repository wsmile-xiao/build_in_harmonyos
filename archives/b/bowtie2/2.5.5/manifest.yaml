software: bowtie2
version: "2.5.5"
status: published
build_date: "2026-05-28"
build_system: makefile

source:
  url: "https://github.com/BenLangmead/bowtie2/archive/refs/tags/v2.5.5.tar.gz"
  sha256: "e38d1833ec235ca27fa57589d32d897c9addf87085b7cb7bc978662954662da2"
  tar_format: tar.gz
  submodule_urls:
    - "https://github.com/simd-everywhere/simde-no-tests/archive/refs/heads/master.tar.gz"

build:
  system: makefile
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
    - "CXX=clang++"
    - "CC=clang"
  dependencies:
    - zlib/sysroot
    - simde/submodule
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Release tarball 不含 git submodule 内容（simde-no-tests），需单独下载并填充 third_party/simde/"
  - "aarch64 上，bowtie2 通过 simde/x86/sse2.h（SIMD Everywhere）实现 SSE 到 NEON 的可移植 SIMD"
  - "bowtie2 无标准 make check 目标，使用真实功能验证（建索引+比对+查看）替代"
  - "uname 返回 HarmonyOS（非 Linux）；Makefile 通过 uname -m 正确识别 aarch64 架构"