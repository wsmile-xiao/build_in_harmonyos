software: bowtie2
display: "Bowtie2"
description: "快速灵敏的带间隔读段比对工具，用于测序数据比对"
category: data
homepage: "https://bowtie2.sourceforge.net/"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "使用纯 Makefile（非 autotools），无 configure 脚本"
    - "aarch64 上 SSE2 内联函数通过 simde/x86/sse2.h（SIMD Everywhere）实现可移植"
    - "Release tarball 不含 simde submodule 内容，需手动下载填充 third_party/simde"
    - "uname 返回 HarmonyOS；Makefile 通过 uname -m 正确识别 aarch64"
    - "无标准 make check 目标，使用真实功能验证替代"
  common_dependencies:
    - zlib

versions:
  - version: "2.5.5"
    status: published
    build_date: "2026-05-28"