# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: b64.c/0.1.0
homepage: "https://github.com/jwerle/b64.c"

# 上游测试命令 (make test 目标；需要 deps/ok 开发依赖，tarball 不含)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（test.c：8 个断言，4 编码 + 4 解码）
upstream_tests:
  - file: test.c
    source: b64.c-0.1.0/test.c
    description: "b64.c 上游测试：4 组 b64_encode + 4 组 b64_decode 往返断言"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：b64_encode + b64_decode_ex 往返验证"
    command: "./test_b64.c"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
