# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: badvpn/1.999.130
homepage: "https://github.com/ambrop72/badvpn"

# 上游测试命令 — badvpn 上游无独立 CI 单元测试套件（VPN 工具集，
# 验证 = CMake 构建 + 运行）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-21 本地实测）：
# - 上游无独立测试套件（无 make test/ctest 入口；源码含 tun2socks/udpgw/
#   NCD/P2P VPN 工具，CMake 构建）
# - 构建验证：CMake（-DBUILD_TUN2SOCKS=1 -DBUILD_UDPGW=1，内置 lwIP）
#   生成 tun2socks/udpgw——实测通过
# - 消费者验证（test_package）：test_badvpn.py（二进制存在/可执行/ELF +
#   真实执行尝试——tun2socks/udpgw 运行需 TUN/TAP 设备，OHOS 无，
#   环境阻塞如实说明，R34 降级）
upstream_tests: []
