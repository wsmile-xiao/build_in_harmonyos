upstream_tests: []

test_package_tests:
  - file: test_boops.sh
    description: "Verify BOops.lv2 LV2 bundle: manifest/ttl existence, BOops.so ELF magic, lv2_descriptor symbol and TTL references"
    command: "bash test_boops.sh <bundle_dir> <nm>"
    cases:
      - bundle-exists
      - manifest-ttl-exists
      - boops-ttl-exists
      - boops-so-exists
      - boops-so-elf-magic
      - boops-so-lv2-descriptor
      - manifest-refs-boops-so
      - manifest-refs-boops-ttl

assertion_count: 8
