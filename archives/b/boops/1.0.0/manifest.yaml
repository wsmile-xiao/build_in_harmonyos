version: "1.0.0"
software: boops
status: built
build_date: "2026-09-01"
build_system: make
source:
  url: "https://github.com/sjaehn/BOops/archive/refs/tags/1.8.2.tar.gz"
  sha256: "0a810f869dc7a6bcea09b832fd778df4e161477294d631dd1a08186c6a9ae1fb"
  tar_format: tar.gz
build:
  system: make
  configure_options:
    - 'make BOops.so (DSP only, GUI disabled on OHOS)'
  dependencies:
    - lv2/1.18.11-git
    - libsndfile/1.2.2
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "BOops is LV2 glitch sequencer, Makefile + pkg-config (lv2, sndfile, x11, cairo)"
  - "OHOS build uses DSP only (BOops.so), GUI (BOopsGUI.so) disabled due to no X11"
  - "LV2 1.18+ header compat symlink lv2plug.in/ns/lv2core required"
  - "pkg-config PKG_CONFIG_PATH must include generators_folder (PkgConfigDeps) + deps lib/pkgconfig"
  - "Makefile check evaluates x11/cairo at parse time; patched in build() via re.sub to skip GUI deps"
