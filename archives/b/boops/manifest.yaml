software: boops
display: "BOops"
description: "Glitch effect sequencer LV2 plugin"
category: audio
homepage: "https://github.com/sjaehn/BOops"
license: GPL-3.0-only
build_system: make
ohos_adaptation:
  key_points:
    - "Makefile + pkg-config 构建，DSP 仅需 lv2 与 libsndfile"
    - "OHOS 上禁用 X11/cairo GUI，仅构建 BOops.so DSP 插件"
    - "需处理 LV2 1.18+ 头文件兼容路径 lv2plug.in/ns/lv2core"
    - "通过 PKG_CONFIG_PATH 注入依赖的 pkgconfig 目录"
  common_dependencies:
    - lv2
    - libsndfile
versions:
  "1.0.0":
    status: built
    build_date: "2026-09-01"
    archive_path: "1.0.0"
