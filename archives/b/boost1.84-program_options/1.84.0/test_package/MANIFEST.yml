package: boost1.84-program_options/1.84.0
homepage: https://www.boost.org/doc/libs/1_84_0/doc/html/program_options.html

# 上游测试说明
# Boost.ProgramOptions 的上游测试基于 minitest.hpp 纯 assert 框架，
# 不依赖 boost.test 库——可绕过 b2 直接编译运行。
# 带参数的测试按上游 B2 测试框架行为传入对应数据文件。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/program_options/test/cmdline_test.cpp"
    description: "命令行解析测试"
    command: "clang++ cmdline_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/options_description_test.cpp"
    description: "选项描述测试"
    command: "clang++ options_description_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/variable_map_test.cpp"
    description: "变量映射测试"
    command: "clang++ variable_map_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/positional_options_test.cpp"
    description: "位置选项测试"
    command: "clang++ positional_options_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/split_test.cpp"
    description: "命令行分割测试"
    command: "clang++ split_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/exception_test.cpp"
    description: "异常测试"
    command: "clang++ exception_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/exception_txt_test.cpp"
    description: "异常文本测试"
    command: "clang++ exception_txt_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/optional_test.cpp"
    description: "可选参数测试"
    command: "clang++ optional_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/quick.cpp"
    description: "快速测试（--path=initial）"
    command: "clang++ quick.cpp -lboost_program_options && ./a.out --path=initial"
    result: passed
  - file: "libs/program_options/test/unrecognized_test.cpp"
    description: "未识别选项测试"
    command: "clang++ unrecognized_test.cpp -lboost_program_options && ./a.out"
    result: passed
  - file: "libs/program_options/test/required_test.cpp"
    description: "必需选项测试（required_test.cfg）"
    command: "clang++ required_test.cpp -lboost_program_options && ./a.out required_test.cfg"
    result: passed
  - file: "libs/program_options/test/parsers_test.cpp"
    description: "解析器测试（config_test.cfg）"
    command: "clang++ parsers_test.cpp -lboost_program_options && ./a.out config_test.cfg"
    result: passed
  - file: "libs/program_options/test/unicode_test.cpp"
    description: "Unicode 测试（ucs2.txt utf8.txt）"
    command: "clang++ unicode_test.cpp -lboost_program_options && ./a.out ucs2.txt utf8.txt"
    result: passed

test_package_tests:
  - file: test_boost1_84_program_options.cpp
    description: "上游派生消费者测试：options_description 注册/查找/格式化、parse_command_line 长短选项/默认值/multitoken、variables_map store/notify、positional_options、parse_config_file INI 解析（31 断言）"
    command: "ctest boost1_84_program_options_test"

assertion_count: 31  # test_package 31 checks（上游派生断言计数，minitest.hpp 风格）；上游测试 13 项见 upstream_tests 列表
