sources:
  # 单条官方 URL：CI mirror fallback 会对单值 url 自动追加 gh-proxy.com 镜像列表
  # （build_and_test.sh Mirror fallback 段）。写多 URL 列表会导致 CI 跳过镜像注入。
  url: "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.gz"
  sha256: "a5800f405508f5df8114558ca9855d2640a2de8f0445f051fa1c7c3383045724"

patches:
  - patch_file: "patches/0001-ohos-pthread-cancel-fix.patch"
    patch_description: "Skip pthread_setcancelstate (not available on OHOS musl) via BOOST_SP_NO_PTHREAD_SETCANCELSTATE feature-detection macro, R8-compliant (no platform macro)"
    patch_type: "portability"
