software: busted
display: "busted"
description: "Elegant Lua unit testing framework"
category: development
homepage: "https://lunarmodules.github.io/busted/"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "Install Busted Lua modules under share/lua/5.4"
    - "Install bin/busted command wrapper"
    - "Use explicit LUA_PATH/LUA_CPATH composition in consumers"
  common_dependencies:
    - lua
    - lua_cliargs
    - luasystem
    - dkjson
    - lua-say
    - luassert
    - lua-term
    - lua-penlight
    - mediator_lua

versions:
