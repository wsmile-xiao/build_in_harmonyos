test_package:
  type: consumer
  language: c
  requires:
    - busted/2.2.0-1
    - lua/5.4.8.1
  entrypoint: test_busted.c
  checks:
    - require Busted modules through composed LUA_PATH
    - load native Lua dependencies through composed LUA_CPATH
    - verify Busted version metadata
    - execute packaged busted native launcher
    - verify launcher exposes reusable Lua CLI invocation for pl.app.lua()

