# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: barada-pam/0.5.3
homepage: "https://barada.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check && ./src/HexTest"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/HexTest.cpp
    source: barada-pam-0.5.3/src/HexTest.cpp
    description: "随机字节与十六进制字符串的双向转换往返测试"
    command: "make check && ./src/HexTest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者视角 dlopen PAM 模块并调用 pam_sm_setcred 入口"
    command: "./test_barada_pam <package>/lib/security/pam_barada.so"
  - file: conanfile.py
    description: "执行安装后的 barada-add，验证真实命令和参数处理；WSL qemu 分支使用静态 CLI"
    command: "<package>/bin/barada-add __barada_test_invalid_user__ 123"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
