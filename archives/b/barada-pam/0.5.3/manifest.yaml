  cxx: clang++

patches_applied:
  - "0001-configure.patch: remove obsolete libboost_system probe from shipped configure"
  - "0002-configure.ac.patch: treat Boost.System as header-only with Boost 1.90"
knowledge_gained:
  - "上游仅声明 noinst_PROGRAMS=HexTest，make check 只构建不执行；配方显式运行 build-release/src/HexTest。"
  - "barada-add 安装到 bin，pam_barada.so 安装到 lib/security；软件级 commands.json 必须声明 CLI，OHOS 打包须给两类 ELF 签入 .codesign。"
  - "OHOS W3 需要 profile 提供 /data/service/hnp/bin/bash；macOS 没有该运行时，不能替代 OHOS 验证。"
  - "Boost 1.90 不再提供 libboost_system；发布 tarball 的 configure 与 configure.ac 必须同步去除过时库探测，不能依赖 OHOS 端 autoreconf。"
  - "WSL qemu 没有 OHOS 动态加载器；正式 OHOS 保留动态 PAM 模块，WSL 预审仅对静态 CLI 执行并对安装产物完成 ELF 签名校验。"
  - "binary-sign-tool 对已存在的输入文件执行原位输出；先复制临时文件、去除旧 .codesign、原位签名，再校验签名段。"
  - "鸿蒙 hishell 原生运行时可真实 dlopen pam_barada.so、解析 pam_sm_setcred 并校验 PAM_CRED_UNAVAIL；WSL 的动态加载限制不代表 OHOS 设备限制。"
  - "鸿蒙 HMDFS 上 Autoconf 的 umask 077 私有临时目录不可写，设备验证使用不入库的兼容 shell/mktemp wrapper；配方本身不依赖该 workaround。"

test_results:
