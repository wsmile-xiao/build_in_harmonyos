  note: "鸿蒙 hishell 原生 OHOS conan-verify 与 PR 范围 W3 通过：HexTest、安装后的 barada-add、PAM 模块 dlopen/dlsym/pam_sm_setcred 均通过；两个 ELF 均完成 .codesign 校验。"

