software: barada-pam
display: "barada-pam"
description: "基于 HOTP 的 PAM 双因素认证模块与凭据生成命令"
category: security
homepage: "https://barada.sourceforge.net/"
license: GPL-3.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "AutotoolsDeps 注入 Boost、Linux-PAM 和 OpenSSL 依赖"
    - "保留 make check，并显式执行未注册到 TESTS 的 HexTest"
    - "PAM 模块安装到 lib/security，barada-add 安装到 bin；OHOS 打包阶段对所有 ELF 使用 binary-sign-tool 签名"
  common_dependencies:
    - boost
    - linux-pam
    - openssl

versions:
  "0.5.3":
    status: built
    build_date: "2026-08-25"
