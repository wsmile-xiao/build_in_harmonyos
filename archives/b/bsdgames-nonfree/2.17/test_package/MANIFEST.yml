# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点结论（R51 三步法）:
#   1. 上游 tests/ 目录共 150 个文件，含 10 个 .test 脚本
#      （battlestar/bcd/caesar/factor/morse/number/pig/pom/ppt/primes）
#   2. 本包（bsd-games-non-free 2.17）仅构建 rogue 一个游戏，
#      10 个测试脚本针对的游戏二进制均不在本包构建范围内
#   3. 实测运行：tests/common 中 testexec 检查目标二进制不存在 → exit 0 跳过，
#      10 个脚本均无断言实际执行（rc=0 但为空转）
#   4. 结论：上游测试对本包零可运行，test_package 自研断言补齐

package: bsdgames-nonfree/2.17
homepage: "https://www.ibiblio.org/pub/Linux/games/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "tests/*.test (shell 脚本, 非 make check)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（全部因目标二进制不在本包构建范围内而跳过）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_rogue.sh
    description: "rogue 冒烟测试：二进制存在/可执行、启动横幅 Hey!、退出码 0"
    command: "bash test_rogue.sh <path-to-rogue>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
