# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "b43-fwcutter 源码无 configure 脚本，仅简单 Makefile（fwcutter.c + md5.c → b43-fwcutter）"
  - "Makefile install 目标使用 install -o 0 -g 0，OHOS 上可能失败，需手动 cp"
  - "源码使用 byteswap.h（bionic libc 支持）和 -D_BSD_SOURCE，OHOS 兼容"
  - "上游无测试套件（无 make check 目标），test_package 提供 5 项消费者验证"
  - "源码使用 C99 标准（-std=c99 -Wall -pedantic）"
  - "OHOS Toybox tar 不支持 bzip2，但 Conan get() 使用 Python tarfile 正常处理"
  - "ohos-local profile 的 CFLAGS 包含 -Wl,--code-sign 等链接器标志，编译阶段会产生 unused 警告但不影响构建"
  - "version 宏链: FWCUTTER_VERSION_ → fwcutter_stringify → FWCUTTER_VERSION → string \"019\""
