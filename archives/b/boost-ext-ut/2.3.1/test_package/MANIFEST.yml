# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: boost-ext-ut/2.3.1
homepage: "https://github.com/boost-ext/ut"

upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试（BOOST_UT_BUILD_TESTS=ON + BOOST_UT_BUILD_EXAMPLES=ON）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试全部经 cmake/AddCustomCommandOrTest.cmake 的 ut_add_custom_command_or_test() 注册为 add_test:
#   test/ut/CMakeLists.txt : ut(ut) + ut(win_compat_test)[仅 WIN32]            = 2 个静态注册
#   test/ft/CMakeLists.txt : ft / ft-no-exceptions / ft-link[非 WIN32]            = 3 个静态注册
#   example/CMakeLists.txt : example(...) 41 处（parallel_runner 仅 Clang/APPLE, abort 仅非 WIN32）
#   静态注册合计 46 个 CTest 条目；Linux/clang 实际注册数以 ctest -N 为准（见 notes.md）
upstream_tests:
  - file: test/ut/ut.cpp
    source: ut-2.3.1/test/ut/ut.cpp
    description: "框架自测 (用 ut 测 ut): 断言/运算符/BDD/参数化/reporter/runner 等, 单个 ctest 条目 ut_test"
    command: "ctest -R ut_test"
  - file: test/ft/main.cpp
    source: ut-2.3.1/test/ft/main.cpp
    description: "功能测试 3 个变体: ft / ft-no-exceptions(-fno-exceptions) / ft-link(多 TU 链接), 源 test_suite_1..3.cpp"
    command: "ctest -R '^ft'"
  - file: example/CMakeLists.txt
    source: ut-2.3.1/example/
    description: "41 个示例程序, 每个注册为独立 ctest 条目 boost_ut_<name>, 运行即断言"
    command: "ctest -R boost_ut_"

test_package_tests:
  - file: test_boost_ext_ut.cpp
    description: "消费者测试: 用 boost.ut 编写 6 个测试块 (算术/字符串/sections/BDD/参数化 x4/异常) 共 15 个 expect; runner 运行时报 21 asserts in 14 tests (sections/BDD/参数化展开), 需退出码 0"
    command: "./test_boost_ext_ut"
  - file: test_boost_ext_ut_negative.cpp
    description: "反向探针: 含 2 个 expect (1 通过 + 1 故意失败), 运行器必须报告 FAILED 并以非 0 退出 (test() 反转判定)"
    command: "./test_boost_ext_ut_negative; test $? -ne 0"

# 源码 expect 合计 17 (15 + 2); 运行时 main 套件 21 asserts / 14 tests
assertion_count: 17
