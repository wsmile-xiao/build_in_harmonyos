software: boost-ext-ut
# 版本级 manifest
# 文件位置: archives/b/boost-ext-ut/2.3.1/manifest.yaml

version: "2.3.1"
status: built
build_date: "2026-09-06"
build_system: cmake

source:
  url: "https://github.com/boost-ext/ut/archive/refs/tags/v2.3.1.tar.gz"
  sha256: "e51bf1873705819730c3f9d2d397268d1c26128565478e2e65b7d0abb45ea9b1"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBOOST_UT_DISABLE_MODULE=ON"
    - "-DBOOST_UT_ENABLE_RUN_AFTER_BUILD=OFF"
    - "-DBOOST_UT_BUILD_TESTS=ON"
    - "-DBOOST_UT_BUILD_EXAMPLES=ON"
    - "-DBOOST_UT_BUILD_BENCHMARKS=OFF"
    - "-DBOOST_UT_ENABLE_INSTALL=OFF"
    - "-DBOOST_UT_USE_WARNINGS_AS_ERORS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - file: patches/0001-example-parameterized-guard-std-views-for-incomplete-ranges.patch
    type: portability
    reason: "OHOS libc++ 15 定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES、无 std::views；扩展上游同文件已有 __EMSCRIPTEN__ 守卫，不引入平台宏"
    scope: "example/parameterized.cpp 1 行；仅影响该示例中的 1 个 views 子测试"

# 上游测试四类数字（口径见 notes.md「上游测试统计」节）
# 1) 上游静态注册: 46 个 ut_add_custom_command_or_test/example() 注册点
#    (test/ut 2 [1 个 WIN32-only] + test/ft 3 + example 41)
# 2) 官方套件实际执行: ctest 4/4 通过 (ut_test / ft / ft-no-exceptions / ft-link)
#    examples 全部编译验证；不注册 ctest 属上游设计（enable_testing 位于 add_subdirectory(example) 之后，
#    且上游全部 CI 工作流 -DBOOST_UT_ENABLE_RUN_AFTER_BUILD=NO），与上游 linux CI 口径一致
# 3) 未执行: win_compat_test（WIN32-only，平台条件）；examples 运行未注册（上游设计）
# 4) 新增 test_package 消费者测试: 2 个程序，源码 8 个测试块 17 个 expect（main 6 块 15 + negative 2 块 2）；
#    运行时 runner 报 main 套件 21 asserts in 14 tests（sections/BDD/参数化展开），negative 探针 1 个 expect 故意失败被正确报告

test_stats:
  upstream_static_registrations: 46
  upstream_static_test_dir: 5
  upstream_static_examples: 41
  upstream_ctest_registered: 4
  upstream_ctest_passed: 4
  upstream_ctest_failed: 0
  upstream_examples_compile_verified: true
  upstream_not_built_platform: ["win_compat_test (WIN32-only)"]
  consumer_programs: 2
  consumer_source_expects: 17
  consumer_runtime_tests: 14
  consumer_runtime_asserts: 21
  consumer_failed: 0

knowledge_gained:
  - "boost-ext-ut 2.3.1 是 header-only C++20 库（include/boost/ut.hpp 3378 行完整实现）；ut.cppm 只是 C++23 模块包装，BOOST_UT_DISABLE_MODULE=ON 走纯头模式，消费者无需额外宏"
  - "CMake 目标 Boost::ut（cmake_file_name ut）；INTERFACE compile features cxx_std_20 传播给消费者，profile cppstd=17 下需 configure() rm_safe(compiler.cppstd) 且消费者 target_compile_features cxx_std_20"
  - "上游 cmake/AddCustomCommandOrTest.cmake 的 BOOST_UT_ENABLE_RUN_AFTER_BUILD 默认 ON：POST_BUILD 以裸命令名运行产物，POSIX sh 不搜索 cwd → Error 127 'inaccessible or not found'；上游全部 CI 工作流均 =NO 改走 add_test，配方同样设置"
  - "OHOS clang 15 libc++ 定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES，std::views 命名空间不存在（__cpp_lib_ranges 却已定义，不能用它判断）；用 libc++ 自身缺口宏做条件编译可移植且无平台宏"
  - "上游 examples 的 add_test 在 enable_testing() 之前注册因而不进 ctest，属上游设计；conan create 中 41 个 example 全部编译验证但 ctest 只有 test/ 目录的 4 项"
  - "boost.ut BDD DSL given/when/then 位于 boost::ut::bdd 命名空间，需单独 using（上游 example/BDD.cpp 同款）"
  - "E092: CMake 不识别 OHOS，需 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR"
