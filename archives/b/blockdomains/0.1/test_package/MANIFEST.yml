# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: blockdomains/0.1
homepage: "https://git.rrq.au/rrq/blockdomains.git"

# 上游测试命令（上游 Makefile 仅定义 default/install/clean 目标，
# 无 check 目标；源码树无 test/ 目录；Debian 包亦无 debian/tests）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# blockdomains 上游无自动化测试套件（Makefile 无 check 目标、无 test/
# 目录、README 无测试章节、Debian debian.tar.xz 无 debian/tests）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，版本受控的 test_blockdomains.sh）
test_package_tests:
  - file: test_blockdomains.sh
    description: >
      构建级+冒烟级验证：bin/ 下两个工具存在且可执行；blockdomainsctl
      无参数/坏参数打印用法提示；真实 ACL 文件驱动 daemon 走完"加载黑名单 →
      打开 NFQUEUE"路径，接受两种预期结局（内核 NFQUEUE 可用则常驻运行并
      终止之；不可用则以退出码 1 在 nfq_open() 干净报错），其余结局判失败
    command: "sh test_blockdomains.sh"

# 测试断言总数（6 个 case 断言：二进制存在+可执行、ctl 脚本存在、
# ctl 用法提示、ACL 加载日志、到达 NFQUEUE 阶段、退出码/输出符合两种预期之一）
assertion_count: 6
