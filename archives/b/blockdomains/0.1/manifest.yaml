# 版本号
version: "0.1"

# 编译状态
# published | built | failed | archived
# built: 权威 CI（2026-09-13）全 PASS —— L0 质量门禁（含 L0i R36 依赖
# 发布检查、L0j/L0k/L0m）、知识库与杂项门禁（KC/JC）、conan create +
# test_package（6 断言）、L1/L2/L4/L5 全部通过。早期候选曾被 CI L0i
# (R36) 阻塞（libnetfilter_queue 未入档/未发布），依赖入档并发布后解除。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-13"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/b/blockdomains/blockdomains_0.1.orig.tar.gz"

  # 源码校验和
  sha256: "07ca74811edc09b18b8a0c1c90a62328b47ea57154ea12cb9d6fb90ebfa7ff50"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 上游 Makefile 内嵌 dpkg-buildflags（Debian 专用），OHOS 不可用。
  # recipe 绕过 make，直接用工具链 clang 编译三个源文件并链接
  # -lnetfilter_queue -lnfnetlink（见 conanfile.py build()）。

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libnetfilter_queue/1.0.5"
  # 唯一直接依赖（与 conanfile.py requirements 一致）。libnetfilter_queue
  # 已入档（archives/l/libnetfilter_queue）并发布到制品仓，CI L0i (R36)
  # 通过；libmnl、libnfnetlink 由其 recipe 作为传递依赖拉入，均已入档。

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-harmoneyos-fix-sockaddr-storage-redefinition.patch"
  # 修复 src/blockdomains.c：HarmonyOS musl 下 linux/netfilter.h →
  # linux/in.h → linux/socket.h 与 sys/socket.h 的 sockaddr_storage
  # 重定义冲突；定义 _UAPI_LINUX_SOCKET_H 跳过该头并补充
  # __kernel_sa_family_t（同 babeld 1.13.1 先例）
  - "patches/0002-harmoneyos-provide-compar-fn-t-for-musl.patch"
  # 修复 src/database.c：musl 无 glibc 的 __compar_fn_t typedef，
  # 非 glibc 下条件提供

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 Makefile 内嵌 dpkg-buildflags（Debian 专用），必须绕过 make 直接 clang 编译 src/ 下三个源文件"
  - "HarmonyOS（musl + uapi 头）下 <linux/netfilter.h> 经 <linux/in.h> 拉入 <linux/socket.h>，与 <netinet/in.h> 先行引入的 <sys/socket.h> 冲突（sockaddr_storage 重定义）；_UAPI_LINUX_SOCKET_H 守卫 + __kernel_sa_family_t typedef 可解（babeld 先例）。守卫作用于整个编译单元，libnetfilter_queue 头文件链经 linux/netlink.h 的同类冲突在本库 consumer 编译全程未触发，未对该链单独验证"
  - "musl 不提供 glibc 内部 typedef __compar_fn_t，database.c 的 qsort 比较器 cast 需条件 typedef"
  - "上游无自动化测试套件：Makefile 仅 default/install/clean 目标、无 test/ 目录、README 无测试入口、Debian debian 包无 debian/tests"
  - "上游 install 目标依赖 asciidoctor 生成 man 页，包构建不能直接用 make install"
  - "无内核 NFQUEUE 支持时程序在 nfq_open() 报错退出（退出码 1），属预期行为，可用于冒烟断言"

# ============================================================
# 上游测试
# ============================================================

# 上游无测试套件，证据与结论见 test_package/MANIFEST.yml 与 notes.md
upstream_tests: []
