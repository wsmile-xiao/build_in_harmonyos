software: blockdomains
display: "blockdomains"
description: "Block list based domain name filtering (iptables NFQUEUE)"
category: network
homepage: "https://git.rrq.au/rrq/blockdomains.git"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 内嵌 dpkg-buildflags（Debian 专用），recipe 绕过 make 直接用 clang 编译三个源文件"
    - "依赖 libnetfilter_queue（上游 -lnetfilter_queue）；该依赖已入档并发布（CI 依赖发布检查 L0i R36 通过），libmnl、libnfnetlink 传递依赖均已入档，依赖链已闭环"
    - "HarmonyOS musl 的 linux/netfilter.h → linux/in.h → linux/socket.h 与 sys/socket.h 冲突（sockaddr_storage 重定义），用 _UAPI_LINUX_SOCKET_H 守卫绕过（同 babeld 1.13.1 先例）"
    - "musl 无 glibc 的 __compar_fn_t typedef，database.c 中需条件 typedef"
    - "上游无自动化测试套件（Makefile 仅 default/install/clean 目标，无 test/ 目录，Debian 包亦无 debian/tests）"
  common_dependencies:
    - libnetfilter_queue

versions:
  "0.1":
    status: built
    build_date: "2026-09-13"
    conan_ref: "blockdomains/0.1"
