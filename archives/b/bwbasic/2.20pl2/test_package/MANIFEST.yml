# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bwbasic/2.20pl2
homepage: "https://salsa.debian.org/debian/bwbasic"

# 上游测试命令 (bwbtest/ 无自动化入口，为 41 个人工核对型 .bas 脚本；
# 本配方在 build() 内以断言执行器全部真实运行，见 conanfile.py)
upstream_check_command: "ls bwbtest/*.bas"
upstream_test_in_build: true
upstream_test_command: "run_bwbtest.sh (conanfile build() 内嵌断言执行器)"

# 上游实际运行的测试程序 (bwbtest/ 全部 41 个 .bas 脚本)
upstream_tests:
  - file: bwbtest/abs.bas
    source: bwbasic-2.20pl2/bwbtest/abs.bas
    description: "ABS() 函数"
    command: "bwbasic abs.bas"
  - file: bwbtest/assign.bas
    source: bwbasic-2.20pl2/bwbtest/assign.bas
    description: "赋值语句"
    command: "bwbasic assign.bas"
  - file: bwbtest/callfunc.bas
    source: bwbasic-2.20pl2/bwbtest/callfunc.bas
    description: "FUNCTION 调用与参数"
    command: "bwbasic callfunc.bas"
  - file: bwbtest/callsub.bas
    source: bwbasic-2.20pl2/bwbtest/callsub.bas
    description: "CALL/SUB 调用与参数"
    command: "bwbasic callsub.bas"
  - file: bwbtest/chain1.bas + chain2.bas
    source: bwbasic-2.20pl2/bwbtest/chain1.bas
    description: "CHAIN 程序链接（chain2 为被链脚本，随 chain1 执行）"
    command: "bwbasic chain1.bas"
  - file: bwbtest/dataread.bas
    source: bwbasic-2.20pl2/bwbtest/dataread.bas
    description: "DATA/READ/RESTORE"
    command: "bwbasic dataread.bas"
  - file: bwbtest/deffn.bas
    source: bwbasic-2.20pl2/bwbtest/deffn.bas
    description: "DEF FN 单行函数"
    command: "bwbasic deffn.bas"
  - file: bwbtest/dim.bas
    source: bwbasic-2.20pl2/bwbtest/dim.bas
    description: "DIM 数组"
    command: "bwbasic dim.bas"
  - file: bwbtest/doloop.bas
    source: bwbasic-2.20pl2/bwbtest/doloop.bas
    description: "DO-LOOP"
    command: "bwbasic doloop.bas"
  - file: bwbtest/dowhile.bas
    source: bwbasic-2.20pl2/bwbtest/dowhile.bas
    description: "DO WHILE 嵌套"
    command: "bwbasic dowhile.bas"
  - file: bwbtest/elseif.bas
    source: bwbasic-2.20pl2/bwbtest/elseif.bas
    description: "ELSEIF 多分支（喂入 4）"
    command: "bwbasic elseif.bas"
  - file: bwbtest/end.bas
    source: bwbasic-2.20pl2/bwbtest/end.bas
    description: "END 语句"
    command: "bwbasic end.bas"
  - file: bwbtest/err.bas
    source: bwbasic-2.20pl2/bwbtest/err.bas
    description: "下标越界错误路径（预期打印 ERROR）"
    command: "bwbasic err.bas"
  - file: bwbtest/fncallfn.bas
    source: bwbasic-2.20pl2/bwbtest/fncallfn.bas
    description: "函数嵌套调用"
    command: "bwbasic fncallfn.bas"
  - file: bwbtest/fornext.bas
    source: bwbasic-2.20pl2/bwbtest/fornext.bas
    description: "FOR-NEXT 与 STEP"
    command: "bwbasic fornext.bas"
  - file: bwbtest/function.bas
    source: bwbasic-2.20pl2/bwbtest/function.bas
    description: "内置函数族（DATE$/TIME$ 掩码后断言）"
    command: "bwbasic function.bas"
  - file: bwbtest/gosub.bas
    source: bwbasic-2.20pl2/bwbtest/gosub.bas
    description: "GOSUB 菜单交互（喂入 1, 9）"
    command: "bwbasic gosub.bas"
  - file: bwbtest/gotolabl.bas
    source: bwbasic-2.20pl2/bwbtest/gotolabl.bas
    description: "GOTO/GOSUB 标签"
    command: "bwbasic gotolabl.bas"
  - file: bwbtest/ifline.bas
    source: bwbasic-2.20pl2/bwbtest/ifline.bas
    description: "单行 IF"
    command: "bwbasic ifline.bas"
  - file: bwbtest/input.bas
    source: bwbasic-2.20pl2/bwbtest/input.bas
    description: "INPUT 语句（喂入 hello, 42）"
    command: "bwbasic input.bas"
  - file: bwbtest/lof.bas
    source: bwbasic-2.20pl2/bwbtest/lof.bas
    description: "LOF() 文件长度（喂入定长 109 字节文件）"
    command: "bwbasic lof.bas"
  - file: bwbtest/loopuntl.bas
    source: bwbasic-2.20pl2/bwbtest/loopuntl.bas
    description: "DO-LOOP UNTIL"
    command: "bwbasic loopuntl.bas"
  - file: bwbtest/main.bas
    source: bwbasic-2.20pl2/bwbtest/main.bas
    description: "SUB MAIN"
    command: "bwbasic main.bas"
  - file: bwbtest/mlifthen.bas
    source: bwbasic-2.20pl2/bwbtest/mlifthen.bas
    description: "多行 IF-THEN-ELSE"
    command: "bwbasic mlifthen.bas"
  - file: bwbtest/on.bas
    source: bwbasic-2.20pl2/bwbtest/on.bas
    description: "ON..GOTO（喂入 3）"
    command: "bwbasic on.bas"
  - file: bwbtest/onerr.bas
    source: bwbasic-2.20pl2/bwbtest/onerr.bas
    description: "ON ERROR GOSUB"
    command: "bwbasic onerr.bas"
  - file: bwbtest/onerrlbl.bas
    source: bwbasic-2.20pl2/bwbtest/onerrlbl.bas
    description: "ON ERROR GOSUB 标签形"
    command: "bwbasic onerrlbl.bas"
  - file: bwbtest/ongosub.bas
    source: bwbasic-2.20pl2/bwbtest/ongosub.bas
    description: "ON..GOSUB（喂入 2）"
    command: "bwbasic ongosub.bas"
  - file: bwbtest/opentest.bas
    source: bwbasic-2.20pl2/bwbtest/opentest.bas
    description: "OPEN/PRINT#/LINE INPUT#/CLOSE"
    command: "bwbasic opentest.bas"
  - file: bwbtest/option.bas
    source: bwbasic-2.20pl2/bwbtest/option.bas
    description: "OPTION BASE"
    command: "bwbasic option.bas"
  - file: bwbtest/pascaltr.bas
    source: bwbasic-2.20pl2/bwbtest/pascaltr.bas
    description: "杨辉三角（嵌套循环/数组）"
    command: "bwbasic pascaltr.bas"
  - file: bwbtest/putget.bas
    source: bwbasic-2.20pl2/bwbtest/putget.bas
    description: "随机文件 FIELD/LSET/PUT/GET（喂入两条记录）"
    command: "bwbasic putget.bas"
  - file: bwbtest/random.bas
    source: bwbasic-2.20pl2/bwbtest/random.bas
    description: "RND/RANDOMIZE（数值非确定，按结构断言：两序列各 3 个数且不同）"
    command: "bwbasic random.bas"
  - file: bwbtest/selcase.bas
    source: bwbasic-2.20pl2/bwbtest/selcase.bas
    description: "SELECT CASE（喂入 4）"
    command: "bwbasic selcase.bas"
  - file: bwbtest/snglfunc.bas
    source: bwbasic-2.20pl2/bwbtest/snglfunc.bas
    description: "单行自定义函数"
    command: "bwbasic snglfunc.bas"
  - file: bwbtest/stop.bas
    source: bwbasic-2.20pl2/bwbtest/stop.bas
    description: "STOP 语句"
    command: "bwbasic stop.bas"
  - file: bwbtest/term.bas
    source: bwbasic-2.20pl2/bwbtest/term.bas
    description: "终端控制序列（喂入任意键）"
    command: "bwbasic term.bas"
  - file: bwbtest/whilwend.bas
    source: bwbasic-2.20pl2/bwbtest/whilwend.bas
    description: "WHILE-WEND 嵌套"
    command: "bwbasic whilwend.bas"
  - file: bwbtest/width.bas
    source: bwbasic-2.20pl2/bwbtest/width.bas
    description: "WIDTH 语句（上游未实现：手册有文档、分派代码零实现，data.tmp 不折行；登记为已知局限）"
    command: "bwbasic width.bas"
  - file: bwbtest/writeinp.bas
    source: bwbasic-2.20pl2/bwbtest/writeinp.bas
    description: "WRITE#/INPUT# 往返"
    command: "bwbasic writeinp.bas"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_consumer.c
    description: "消费者测试: 以包内 bwbasic 执行内嵌 BASIC 程序，断言算术/关系分支/数组浮点输出与无效下标错误路径 (4 项检查)"
    command: "./test_consumer <bwbasic-path>"

# 测试断言总数 (实测, rule 4)
# 上游 bwbtest/ 全部 41 个 .bas 测试脚本（41 个文件，chain2 为 chain1 的被链脚本）
assertion_count: 41
