# 下载文件（2026-09-06 核验）。

sources:
  url: "https://deb.debian.org/debian/pool/main/b/bwbasic/bwbasic_2.20pl2.orig.tar.gz"
  sha256: "3aad826d54751180932443da577e3d44cf09b1ad34016700132e1c93477583b4"

patches:
  - patch_file: "patches/0001-bwb_dio.c.patch"
    strip: 1
    patch_description: "随机文件 reopen 后按 buffer 指针判空重新分配缓冲区（修复 CLOSE 释放后 GET 写 NULL/悬垂指针的段错误）"
    patch_type: "portability"
  - patch_file: "patches/0002-bwb_elx.c.patch"
    strip: 1
    patch_description: "int 函数错误路径 return NULL 改 return 0（clang 15 默认拒绝 int 返回指针）"
    patch_type: "portability"
  - patch_file: "patches/0003-bwbasic.c.patch"
    strip: 1
    patch_description: "errfdevice 延迟初始化（OHOS/musl 的 stderr 为宏展开全局变量而非编译期常量）"
    patch_type: "portability"
  - patch_file: "patches/0004-bwx_tty.c.patch"
    strip: 1
    patch_description: "void main 改 int main（clang 15 要求 main 返回 int）"
    patch_type: "portability"
  - patch_file: "patches/0005-renum.c.patch"
    strip: 1
    patch_description: "instr() 指针截断 64 位修复（char* 存入 int 在 aarch64 截断）"
    patch_type: "portability"
