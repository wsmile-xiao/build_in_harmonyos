# conandata.yml — boost1.84-stacktrace_basic 1.84.0
# 单一事实来源: 官方源码 URL + SHA256 + 补丁。
# conanfile.py 通过 self.conan_data["sources"] 与 apply_conandata_patches() 读取。
#
# 源码与 boost/1.84.0 元包同源（boost_1_84_0.tar.gz 官方发行包），
# 本配方打包 Boost.Stacktrace basic 组件（libs/stacktrace/src/basic.cpp）。
# ⚠️ 单 URL（任务纪律 #4）：多 URL 列表会关掉 CI mirror fallback（#8512）。

sources:
  url: "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.gz"
  sha256: "a5800f405508f5df8114558ca9855d2640a2de8f0445f051fa1c7c3383045724"

patches:
  # OHOS musl 无 pthread_setcancelstate（底稿 boost/1.84.0 已验证）
  # 通过 BOOST_SP_NO_PTHREAD_SETCANCELSTATE 特性检测宏守卫，R8 合规（非平台宏）
  - patch_file: "patches/0001-ohos-pthread-cancel-fix.patch"
    patch_description: "Skip pthread_setcancelstate (not available on OHOS musl) via BOOST_SP_NO_PTHREAD_SETCANCELSTATE feature-detection macro, R8-compliant. Same patch as the boost/1.84.0 meta package: the split package ships the full boost header tree, so downstream consumers including boost/thread headers need this guard."
    patch_type: "portability"
