# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: boost1.84-stacktrace_basic/1.84.0
homepage: "https://www.boost.org/doc/libs/1_84_0/libs/stacktrace/"

# 上游测试命令 (b2 构建系统在 OHOS 不兼容 E068，无法直接运行，
# conanfile.py build() 中手动编译运行上游测试目标)
upstream_check_command: "b2 libs/stacktrace/test (upstream; OHOS 上不可用，配方内手动编译 basic 变体)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "conan create (配方 build() 编译运行 libs/stacktrace/test basic+noop 相关 23 个测试目标，报告 upstream-tests-report.txt)"

# 上游实际运行的测试程序（配方 build() 手动编译运行）
# 清单依据 libs/stacktrace/test/Jamfile.v2（boost-1.84.0 实测）：
# OHOS musl 可跑变体全量 = basic（BASIC_DEPS）+ noop（NOOP_DEPS 空）
# 23 目标（2026-09-07 rule4 复核修订 17→23）
upstream_tests:
  - file: "libs/stacktrace/test/test.cpp"
    description: "basic_ho：主测试 header-only 模式（debug 符号 + EXPORTS_TABLE + rdynamic）"
    command: "clang++ test.cpp test_impl.cpp -g -rdynamic && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test.cpp"
    description: "basic_ho_empty：NO_DEBUG_AT_ALL 变体（无符号场景）"
    command: "clang++ test.cpp test_impl.cpp -DBOOST_STACKTRACE_TEST_NO_DEBUG_AT_ALL -rdynamic && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test_trivial.cpp"
    description: "trivial_basic_ho：最小 stacktrace 输出（issue #116 回归）"
    command: "clang++ test_trivial.cpp -g -rdynamic && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test.cpp"
    description: "basic_lib：链接库模式（test.cpp + test_impl.cpp + basic.cpp 编入）"
    command: "clang++ test.cpp test_impl.cpp basic.cpp -g -rdynamic && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test_trivial.cpp"
    description: "trivial_basic_lib：链接 libboost_stacktrace_basic.a"
    command: "clang++ test_trivial.cpp -lboost_stacktrace_basic && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test.cpp"
    description: "basic_ho_no_dbg：无调试符号变体"
    command: "clang++ test.cpp test_impl.cpp -DBOOST_STACKTRACE_TEST_NO_DEBUG_AT_ALL && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test.cpp"
    description: "basic_lib_no_dbg：链接库 + 无调试符号变体"
    command: "clang++ test.cpp test_impl.cpp -DBOOST_STACKTRACE_TEST_NO_DEBUG_AT_ALL && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/thread_safety_checking.cpp"
    description: "basic_lib_threaded：4 线程并发 stacktrace 线程安全测试（辅助 boost_thread/timer 静态库链接）"
    command: "clang++ thread_safety_checking.cpp test_impl.cpp -pthread -lboost_stacktrace_basic -lboost_thread -lboost_timer && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/thread_safety_checking.cpp"
    description: "basic_lib_no_dbg_threaded：线程安全无符号变体"
    command: "clang++ thread_safety_checking.cpp test_impl.cpp -DBOOST_STACKTRACE_TEST_NO_DEBUG_AT_ALL -pthread -lboost_stacktrace_basic -lboost_thread -lboost_timer && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test_void_ptr_cast.cpp"
    description: "void_ptr_cast 指针安全转换（独立小测试）"
    command: "clang++ test_void_ptr_cast.cpp && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test_num_conv.cpp"
    description: "to_hex_array/to_dec_array/try_dec_convert 数值转换（独立小测试）"
    command: "clang++ test_num_conv.cpp && ./a.out"
    result: passed
  - file: "libs/stacktrace/example/assert_handler.cpp"
    description: "basic_assert_handler：断言失败时打印堆栈示例（basic 变体）"
    command: "clang++ assert_handler.cpp -g -rdynamic -lboost_stacktrace_basic && ./a.out"
    result: passed
  - file: "libs/stacktrace/example/debug_function.cpp"
    description: "basic_debug_function：debug() 函数示例（basic 变体）"
    command: "clang++ debug_function.cpp -g -rdynamic -lboost_stacktrace_basic && ./a.out"
    result: passed
  - file: "libs/stacktrace/example/terminate_handler.cpp"
    description: "basic_terminate_handler：未捕获异常终止处理器示例（需 filesystem/system 辅助库）"
    command: "clang++ terminate_handler.cpp -g -rdynamic -lboost_stacktrace_basic -lboost_filesystem -lboost_system && ./a.out"
    result: passed
  - file: "libs/stacktrace/example/throwing_st.cpp"
    description: "basic_throwing_st：嵌套异常堆栈示例（basic 变体）"
    command: "clang++ throwing_st.cpp -g -rdynamic -lboost_stacktrace_basic && ./a.out"
    result: passed
  - file: "libs/stacktrace/example/trace_addresses.cpp"
    description: "basic_trace_addresses：打印帧地址示例（basic 变体）"
    command: "clang++ trace_addresses.cpp -g -rdynamic -lboost_stacktrace_basic && ./a.out"
    result: passed
  - file: "libs/stacktrace/example/user_config.cpp"
    description: "basic_user_config：用户自定义配置示例（basic 变体）"
    command: "clang++ user_config.cpp -g -rdynamic -lboost_stacktrace_basic && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test_noop.cpp"
    description: "noop_ho：noop 模式主测试（BOOST_STACKTRACE_USE_NOOP，空栈语义断言）"
    command: "clang++ test_noop.cpp test_impl.cpp -DBOOST_STACKTRACE_USE_NOOP -g && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test_trivial.cpp"
    description: "trivial_noop_ho：noop 模式最小输出测试"
    command: "clang++ test_trivial.cpp -DBOOST_STACKTRACE_USE_NOOP -g && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test_noop.cpp"
    description: "noop_lib：noop 库形态（链接 libboost_stacktrace_noop.a）"
    command: "clang++ test_noop.cpp test_impl.cpp -DBOOST_STACKTRACE_USE_NOOP -g -lboost_stacktrace_noop && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test_trivial.cpp"
    description: "trivial_noop_lib：noop 库形态最小输出"
    command: "clang++ test_trivial.cpp -DBOOST_STACKTRACE_USE_NOOP -g -lboost_stacktrace_noop && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test_noop.cpp"
    description: "noop_ho_no_dbg：noop 模式无调试符号变体"
    command: "clang++ test_noop.cpp test_impl.cpp -DBOOST_STACKTRACE_USE_NOOP && ./a.out"
    result: passed
  - file: "libs/stacktrace/test/test_noop.cpp"
    description: "noop_lib_no_dbg：noop 库形态无调试符号变体"
    command: "clang++ test_noop.cpp test_impl.cpp -DBOOST_STACKTRACE_USE_NOOP -lboost_stacktrace_noop && ./a.out"
    result: passed

test_package_tests:
  - file: test_boost_stacktrace_basic.cpp
    description: "boost stacktrace 捕获/格式化/frame API/hash/拷贝语义/空栈构造/safe_dump_to/catch 路径下游消费冒烟（CMake find_package(boost1.84-stacktrace_basic COMPONENTS stacktrace_basic) → boost1.84-stacktrace_basic::stacktrace_basic）"
    command: "ctest boost1_84_stacktrace_basic_test"

assertion_count: 18  # test_package 实际断言数（非空 1+帧数 1+marker 1+frame 真 1+比较 1+hash 2+copy 1+empty 2+dump 1+catch 1+输出 2 等共 18 项检查）
