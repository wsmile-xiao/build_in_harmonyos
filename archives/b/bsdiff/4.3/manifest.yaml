  sha256: "18821588b2dc5bf159aa37d3bcb7b885d85ffd1e19f23a0c57a58723fea85f48"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "CC=clang"
    - "CFLAGS=-O2 -Wall -fPIC"
    - "LDFLAGS=-fuse-ld=bfd"
  dependencies:
    - bzip2/1.0.8
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-Makefile.patch"
  - "0002-bspatch.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "BSD Makefile 在 GNU Make 下需补丁适配：.ifndef → ifdef/else/endif"
  - "BSD Make 依赖隐式规则，GNU Make 需显式编译命令"
  - "u_char 是 BSD 特有类型，鸿蒙/Linux 需手动 typedef"
  - "lld 链接器 libxml2 缺失需使用 -fuse-ld=bfd，且必须用 = 赋值"
  - "${INSTALL} 变量未定义时用 cp -f 替代"
  - "鸿蒙平台需 ELF 签名才能执行二进制"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/bsdiff-4.3.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/bsdiff-4.3.work
  source_orig_hash: 02530879c016cf77
  source_work_hash: 78d2b80901c43ea8
  generated_at: '2026-06-08'
  patches_count: 2

patch_classification:
  - file: 0001-Makefile.patch
    type: platform_compat
    platform_only: true
    guard: null
    description: "GNU Make 兼容性补丁：替换 .ifndef 语法、添加显式编译规则、支持 DESTDIR、使用 cp 替代 INSTALL"
  - file: 0002-bspatch.c.patch
    type: platform_compat
    platform_only: true
    guard: "#ifndef u_char"
    description: "添加 u_char 类型定义，解决 BSD 特有类型在鸿蒙/Linux 上缺失的问题"

