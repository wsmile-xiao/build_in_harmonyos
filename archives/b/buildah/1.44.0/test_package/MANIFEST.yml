# test_package/MANIFEST.yml — buildah 1.44.0
# Upstream test suite: https://github.com/containers/buildah/tree/v1.44.0/tests
# Upstream tests require container runtime (runc/crun/containerd) which is
# unavailable on HarmonyOS. This smoke test verifies binary execution only.

upstream_tests:
  - name: "test-unit"
    url: "https://github.com/containers/buildah/tree/v1.44.0/tests"
    status: "skipped"
    reason: "Requires container runtime (runc/crun) unavailable on HarmonyOS"
  - name: "test-integration"
    url: "https://github.com/containers/buildah/tree/v1.44.0/tests"
    status: "skipped"
    reason: "Requires podman/containerd runtime unavailable on HarmonyOS"

smoke_test:
  - name: "buildah --version"
    status: "runnable"
    command: "buildah --version"
