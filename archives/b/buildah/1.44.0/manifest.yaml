software: buildah
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.44.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.44.0"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（顶部字段，verify-build 必检）
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/containers/buildah/tarball/v1.44.0"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=1"
    - "GOPROXY=https://proxy.golang.org,direct"
    - "GOTMPDIR=/data/storage/el2/base/haps/entry/files"
    - "TMPDIR=/data/storage/el2/base/haps/entry/files"
    - "GOFLAGS=-tags containers_image_openpgp exclude_graphdriver_btrfs exclude_seccomp exclude_apparmor no_libsubid no_systemd no_sqlite nolinkednet"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "go/1.25.8"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
  - "0002-internal-mkcw-entrypoint.go.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go linker needs GOTMPDIR/TMPDIR on tmpfs (/data/storage/el2) due to HMDFS mmap restriction"
  - "entrypoint_amd64.gz cross-compile fails on arm64 due to Go linker mmap issue; use entrypoint_arm64.gz for arm64 builds"
  - "Build with minimal tags: exclude_seccomp, exclude_apparmor, no_libsubid, no_systemd, no_sqlite on HarmonyOS"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/buildah-1.44.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/buildah-1.44.0.work
  source_orig_hash: 391d2a30366c811c
  source_work_hash: 008de48dd05e2ab1
  generated_at: '2026-05-29T11:22:30'
  patches_count: 2

patch_classification:
