software: buildah
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.44.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.44.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（顶部字段，verify-build 必检）
build_system: go

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/containers/buildah/tar.gz/refs/tags/v1.44.0"

  # 源码校验和
  sha256: "e3d045700711475e2f1b983b74d094b77a154402b0fbfef2aeea2d3cbd1388b0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "GOPROXY=https://goproxy.cn,https://proxy.golang.org,direct"
    - "GOTMPDIR=/data/storage/el2/base/haps/entry/files (OHOS, E166)"
    - "GOCACHE/GOMODCACHE=go workspace (ext2)"
    - "GOFLAGS=-tags containers_image_openpgp exclude_graphdriver_btrfs exclude_seccomp exclude_apparmor no_libsubid no_systemd no_sqlite nolinkednet"

  # 编译依赖列表（格式: name/version）
  # Go toolchain is self-bootstrapped by the recipe (official SDK 1.25.8
  # tarball from golang.google.cn/dl.google.com, SHA256 pinned) — no
  # pre-installed Go or registry package required.
  dependencies: []

  # 编译器
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
  - "0002-internal-mkcw-entrypoint.go.patch"
  - "0003-pathrs-lite-hongmeng-syscall-probes.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go linker needs GOTMPDIR/TMPDIR on ext2 partition (/data/storage/el2) due to HMDFS mmap restriction (E166)"
  - "entrypoint_amd64.gz must be switched to entrypoint_arm64.gz on arm64 targets (mkcw embed)"
  - "HongMeng kernel delivers SIGSYS (kills process) for unimplemented syscall numbers (open_tree=428, openat2=437) instead of ENOSYS — syscall availability probes must be runtime-guarded via uname"
  - "pathrs-lite HasNewMountAPI/HasOpenat2 probes crash Go binaries at startup on HarmonyOS; legacy fallback path is the fix"
  - "CGO_ENABLED=0 static build works for buildah 1.44.0 with full exclusion tag set (seccomp/apparmor/btrfs/libsubid/systemd/sqlite)"
  - "rootless container storage requires user namespaces which HongMeng kernel denies (fork+CLONE_NEWUSER -> EAGAIN) — buildah images/from/build cannot run unprivileged"

