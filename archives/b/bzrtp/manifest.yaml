# 软件级 manifest — bzrtp
# 遵循 ARCHIVE-SPEC v3.0

software: bzrtp
display: "bzrtp"
description: "ZRTP key agreement protocol implementation (RFC 6189) from Belledonne Communications"
category: library
homepage: "https://gitlab.linphone.org/BC/public/bzrtp"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "与 bctoolbox 同属 5.3 train：find_package(BCToolbox 5.3.0) 用 bctoolbox/5.3.115 满足，BCToolbox_DIR 指向上游自带 config"
    - "上游 bzrtp-tester（30 用例，BCUnit 框架）在 build() 内真实执行，Run Summary + 行数交叉双门禁"
    - "ZID cache 保持上游默认 ON（sqlite3/3.53.4 正式 require），空转跳过判失败"
    - "BCUnit 以 test_requires 引入（bcunit/5.3.113，不进入消费方依赖链）"
    - "无补丁：decaf 缺失由上游测试自适应回退，PQC 保持上游默认关闭"
  common_dependencies:
    - "bctoolbox/5.3.115"
    - "sqlite3/3.53.4"
  test_requires:
    - "bcunit/5.3.113"

versions:
  "5.3.105":
    status: built
    build_date: "2026-09-17"
    conan_ref: "bzrtp/5.3.105"
    upstream_tests: "30 用例（待真机预检回填实测）"
    test_package: "6 项 CHECK-OK（待真机预检回填实测）"
