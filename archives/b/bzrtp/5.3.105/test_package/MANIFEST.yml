# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bzrtp/5.3.105
homepage: "https://gitlab.linphone.org/BC/public/bzrtp"

# ── 上游测试：已在包构建中真实编译并执行 ────────────────────────────────
# 上游测试是 BCUnit/bc_tester 驱动的 bzrtp-tester 可执行文件
# (test/CMakeLists.txt: add_executable(bzrtp-tester ...)，未注册 ctest)。
# 本配方的 build() 在 cmake.build() 之后直接执行该二进制：
#   <build>/test/bzrtp-tester --resource-dir <source>/test
# 退出码 + CUnit Run Summary 双门禁，证据解析见 conanfile.py
# _save_upstream_result（summary 缺失/分母漂移/空转跳过/行数对不上全部判失败）。
upstream_check_command: "bzrtp-tester --resource-dir <source>/test   # build() 内直接执行（test/bzrtp-tester）"
upstream_test_in_build: true
upstream_test_command: "\"<build_folder>/test/bzrtp-tester\" --resource-dir \"<source_folder>/test\""

# ── 分母（与审方数法一致）────────────────────────────────────────────
# 审方以「上游注册用例总数」为分母。取数命令（5.3.105 tag 源码包内执行）：
#   grep -c TEST_NO_TAG test/bzrtpParserTest.c   → 5
#   grep -c TEST_NO_TAG test/bzrtpCryptoTest.cc  → 5
#   grep -c TEST_NO_TAG test/bzrtpConfigsTest.c  → 18
#   grep -c TEST_NO_TAG test/bzrtpZidCacheTest.c → 2
# 合计 30。test/ 目录无其他 TEST_* 宏注册。
upstream_test_total: 30

# 逐套件用例数（分母构成；全部在交付配置下真实编译执行）
upstream_tests:
  - suite: Packet Parser
    cases: 5
    delivered_config: compiled
    source: "test/bzrtpParserTest.c (packet_parser_test_suite)"
  - suite: Crypto Utils
    cases: 5
    delivered_config: compiled
    source: "test/bzrtpCryptoTest.cc (crypto_utils_test_suite)"
  - suite: Key exchange
    cases: 18
    delivered_config: compiled
    source: "test/bzrtpConfigsTest.c (key_exchange_test_suite)"
    note: "X25519 用例经 bctbx_key_agreement_algo_list() 探测回退 DH3k，自适应无 decaf 构建"
  - suite: ZID Cache
    cases: 2
    delivered_config: compiled
    source: "test/bzrtpZidCacheTest.c (zidcache_test_suite)"
    note: "需 ZIDCACHE_ENABLED=ON + patternZIDAlice.sqlite 资源；禁用即空转通过，本配方判失败"

# 依赖处置（与 conanfile.py 一致）
dependencies_notes:
  - "bctoolbox/5.3.115: 上游 find_package(BCToolbox 5.0 REQUIRED ... tester)；"
  - "  同一 5.3 train，用包内上游自带 BCToolboxConfig（BCToolbox_DIR 指向），"
  - "  bc_* 宏与 tester 组件目标由该 config 提供。"
  - "sqlite3/3.49.1#669361066cc2c76e0ed897e6b6a27e38: 上游 bc_find_package(SQLite3 ... REQUIRED)，ZID cache 用；"
  - "  RREV pin 到 ohpcd 已发布修订（v2 API 实测单值 2026-07-10；裸版本双 remote 共存时"
  - "  preflight 先查 conancenter，其 CMake 配方在 OHOS 只读 /tmp 下配置失败）；"
  - "  CMakeDeps 改写其文件/目标名为 SQLite3/SQLite::SQLite3 以精确对齐。"
  - "bcunit/5.3.113: 上游测试组件硬性 find_package(BCUnit 3.0.2 REQUIRED)；"
  - "  以 test_requires 声明（仅测试用，不进入消费方依赖链）。"
  - "PostQuantumCryptoEngine/decaf：未发布于 ohpcd，上游默认即关闭/软可选，无 stub。"

# test_package 中自带的测试 (消费者视角验证；同一 conan create 内执行)
# 实测结果待真机预检回填（首轮仅完成工作树）。
test_package_tests:
  - file: test_bzrtp.c
    description: "C API 消费者: 上下文创建/回调/初始化/双通道/算法查询/MTU 与密钥协商/逐通道销毁"
    command: "./test_bzrtp"
    result: "待真机预检回填（设计 6 项 CHECK-OK 断言）"

# 测试断言总数 (test_package 自带消费者测试)
# test_bzrtp.c: 6 项 CHECK-OK
assertion_count: 6
