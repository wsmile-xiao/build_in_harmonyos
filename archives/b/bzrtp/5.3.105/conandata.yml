sources:
  url:
    - "https://gh-proxy.com/https://github.com/BelledonneCommunications/bzrtp/archive/refs/tags/5.3.105.tar.gz"
    - "https://github.com/BelledonneCommunications/bzrtp/archive/refs/tags/5.3.105.tar.gz"
  sha256: "084a842fffecaf982285c242463c264f4579d071b5956ae24f8aabc5c05add9f"

vendor:
  # Private crypto backend (cassbeam/canvenient precedent: vendor what the
  # registry does not publish, no new conan requirement, same-tree build).
  # Published bctoolbox/5.3.115 is ENABLE_MBEDTLS=OFF, so it ships neither
  # bctoolbox/crypto.h nor the bctbx crypto symbols bzrtp unconditionally
  # needs. Only mbedtls/4.1.0 is published in-tree while the bctoolbox 5.3
  # wrapper supports v2/v3 only, so vendor the official mbedtls 3.6.5 LTS
  # release tarball plus the exact bctoolbox 5.3.115 sources and compile the
  # four backend files (crypto.c / mbedtls.c / ecc.cc / mbedtls.cc) into
  # libbzrtp. Official release file + checksum from the Mbed-TLS 3.6.5
  # release notes (same URL pattern as the in-tree mbedtls/4.1.0 recipe).
  # NOTE: each url is an ordered list per ci/conan/build_and_test.sh
  # get_mirrors() for github.com (gh-proxy first, official last as
  # fallback); sha256 unchanged, archives byte-identical.
  mbedtls:
    url:
      - "https://gh-proxy.com/https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.5/mbedtls-3.6.5.tar.bz2"
      - "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.5/mbedtls-3.6.5.tar.bz2"
    sha256: "4a11f1777bb95bf4ad96721cac945a26e04bf19f57d905f241fe77ebeddf46d8"
  # Same upstream tarball + sha256 as archives/b/bctoolbox/5.3.115/conandata.yml.
  bctoolbox:
    url:
      - "https://gh-proxy.com/https://github.com/BelledonneCommunications/bctoolbox/archive/refs/tags/5.3.115.tar.gz"
      - "https://github.com/BelledonneCommunications/bctoolbox/archive/refs/tags/5.3.115.tar.gz"
    sha256: "c2152de18c63ff2557cfae3b5180c76814b53680c42156ff37e5bc82ad81106c"
