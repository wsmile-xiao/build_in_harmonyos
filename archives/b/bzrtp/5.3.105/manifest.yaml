# 版本级 manifest — bzrtp 5.3.105
# 遵循 ARCHIVE-SPEC v3.0

version: "5.3.105"
software: "bzrtp"
status: built
build_date: "2026-09-17"
conan_ref: "bzrtp/5.3.105"

source:
  url: "https://github.com/BelledonneCommunications/bzrtp/archive/refs/tags/5.3.105.tar.gz"
  sha256: "084a842fffecaf982285c242463c264f4579d071b5956ae24f8aabc5c05add9f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"   # 默认 static；shared 变体由 options.shared 控制
    - "-DENABLE_UNIT_TESTS=ON"    # 构建上游 bzrtp-tester 并在 build() 内真实执行
    - "-DENABLE_ZIDCACHE=ON"      # 上游默认（sqlite 密钥连续性）；sqlite3 为正式 require
  dependencies:
    - "bctoolbox/5.3.115"   # 上游 find_package(BCToolbox 5.3.0)：同一 5.3 train，含 tester 组件
    - "sqlite3/3.49.1#669361066cc2c76e0ed897e6b6a27e38"      # 上游 bc_find_package(SQLite3 ... REQUIRED)，ZID cache 用；RREV pin（ohpcd v2 API 实测单值 2026-07-10），防 preflight 先查 conancenter 命中其 CMake 配方
  test_requires:
    - "bcunit/5.3.113"   # 上游测试组件硬性 find_package(BCUnit 3.0.2 REQUIRED)；ohpcd 已发布
  cc: clang
  cxx: clang++

patches_applied: []

# 上游测试（在 build() 内真实执行 bzrtp-tester，退出码 + Run Summary 双门禁，
# 证据解析见 conanfile.py _save_upstream_result；实测数待真机预检回填）
tests:
  upstream_total: 30            # 注册用例总数（TEST_NO_TAG 计数，取数命令见 test_package/MANIFEST.yml）
  suites:
    - name: "Packet Parser"
      cases: 5
    - name: "Crypto Utils"
      cases: 5
    - name: "Key exchange"
      cases: 18
    - name: "ZID Cache"
      cases: 2

knowledge_gained:
  - "bzrtp 与 bctoolbox 同属 5.3 train：find_package(BCToolbox 5.3.0) 用 ohpcd 的 bctoolbox/5.3.115 满足；必须用上游自带的 BCToolboxConfig（BCToolbox_DIR 指向包内 share/BCToolbox/cmake），CMakeDeps 生成的 config 没有 bc_* 宏、BCToolbox_TARGET 变量和 tester 组件"
  - "bc_find_package(SQLite3 SQLite::SQLite3 ...) 只在 TARGET SQLite::SQLite3 已存在时短路，否则把不存在的目标名写进链接行导致 configure 失败；用 CMakeDeps set_property 把 sqlite3 包的文件/目标/命名空间改写为 SQLite3/SQLite::SQLite3"
  - "bctoolbox 静态包的已安装 config 会 find_dependency(BCUnit)（无版本要求），bcunit 以 test_requires 声明即可满足构建期配置且不进入消费方依赖链"
  - "上游 key exchange 测试用 bctbx_key_agreement_algo_list() 探测 X25519 可用性并回退 DH3k：bctoolbox 关闭 decaf 时测试设计自适应，无需补丁"
  - "CUnit Run Summary 的 tests 行（Total/Ran/Passed/Failed/Inactive）是标记分母的唯一依据；另用 Test started/passed 行数做交叉证伪，ZID cache 禁用时的空转通过必须判失败"
  - "C 形态 API 的 C++ 静态库必须声明 cpp_info.system_libs 含 c++（E247 同模式，与 bctoolbox/5.3.115 一致）"
  - "ohos-aarch64 profile 把编译器钉死在绝对路径：主配方与 test_package 均需按 conf→PATH 探测可用编译器并经缓存变量/工具链补丁强制传入，否则换 worker 即在 project() 处双编译器检查失败"
