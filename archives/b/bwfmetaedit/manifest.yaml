software: bwfmetaedit
display: "BWF MetaEdit"
description: "WAV/BWF metadata editor for Broadcast WAVE Format files"
category: media-tool
homepage: "https://mediaarea.net/BWFMetaEdit"
license: BSD-3-Clause
build_system: autotools

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "构建系统位于 Project/GNU/CLI 目录（非标准位置）"
    - "需先运行 autogen.sh 生成 configure 脚本"
    - "E011: HMDFS umask 077 权限问题，需修改为 umask 022"
    - "PSCAN-MUSL-001: pthread_cancel 在 musl/OHOS 不可用，需条件编译跳过"
  common_dependencies:
    - zlib

# 版本索引
versions:
  "26.01":
    status: built
    build_date: "2026-06-12"