# 编译中学到的知识
knowledge_gained:
  - "E011: HMDFS 文件系统 umask 077 权限问题，需修改 configure 中的 umask 077 为 umask 022"
  - "PSCAN-MUSL-001: pthread_cancel 在 musl/OHOS 上不可用，需添加 #ifdef __OHOS__ 跳过 cancel"
  - "构建系统位于 Project/GNU/CLI 目录，需运行 autogen.sh 生成 configure"
  - "automake 版本不匹配时需创建符号链接 automake-1.17 -> automake-1.16"
  - "PKG_CONFIG_PATH 需包含 ~/usr/local/lib/pkgconfig"

