software: blaspp
display: "BLAS++"
description: "BLAS++ - a C++ API for BLAS (UTK ICL SLATE foundation layer; 前置依赖 of lapackpp)"
category: foundation
homepage: "https://github.com/icl-utk-edu/blaspp"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 C++（C++17）CMake 构建，设备原生编译；BLAS/LAPACK 后端经上游 BLASFinder 的 BLAS_LIBRARIES/LAPACK_LIBRARIES 直通候选给定库清单（含 flang Fortran 运行时），不做 -lblas 名称探测"
    - "GPU 后端（cuda/hip/sycl）gpu_backend=none 显式禁用；OpenMP 关闭；本包 Fortran 编译为零，无需 flang tool_requires"
    - "上游 tester 依赖 testsweeper（FetchContent 构建期 git clone）以同 tag 源码 vendor/ 随配方导出，FETCHCONTENT_SOURCE_DIR_TESTSWEEPER 指本地，上游 CMakeLists 零改动"
    - "上游测试入口 test/run_tests.py：计划项口径 N=90（HOST 56 实跑 + DEVICE 34 NOT_RUN）；tester 需 cblas（cblas/3.12.1）与 LAPACK"
    - "find_package(blaspp) / blaspp::blaspp 命名与上游一致；lapackpp 2024.10.26 的前置硬依赖（CMake FATAL_ERROR + 公开头 using blas::*）"

versions:
  "2024.10.26":
    status: built
    build_date: "2026-09-22"
    conan_ref: "blaspp/2024.10.26"
    notes: "零补丁；vendor testsweeper v2024.05.31；上游 run_tests.py HOST 56 计划项全跑"
