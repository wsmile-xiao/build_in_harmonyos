# 上游默认 --host（medium 尺寸）单轮 09:35:19 起跑、11:06:56 被中止时已运行
# 91.6 分钟仍未完成（56 个 HOST 计划项仅完成 37 项，最后的 batch-gemm 未返回）；
# gemm medium 单项样本 5.5 分钟亦未完成即被中止。全量预计数小时，
