# DEVICE 34 项 NOT_RUN：gpu_backend=none（鸿蒙无 GPU 后端；上游可选依赖，
# configure 显式禁用，不属止损项），不写 PASS。
upstream_check_command: "python3 run_tests.py --quick --host（tester 由 testsweeper 驱动）"
