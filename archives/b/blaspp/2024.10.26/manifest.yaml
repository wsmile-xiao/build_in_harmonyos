software: blaspp
version: "2024.10.26"
status: built
build_date: "2026-09-22"
build_system: cmake

source:
  url: "https://github.com/icl-utk-edu/blaspp/archive/refs/tags/v2024.10.26.tar.gz"
  sha256: "00668457cee1a91de997b142b31191f09e7c3e0a9966de67b2ad4ae708ef9161"
  tar_format: tar.gz
  tag: v2024.10.26

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-Dbuild_tests=ON（构建上游 tester，build() 内跑上游测试）"
    - "-Dgpu_backend=none（鸿蒙无 GPU 后端，上游可选依赖显式禁用）"
    - "-Duse_openmp=OFF"
    - "-DBLAS_LIBRARIES=<lapack/cblas 包库清单直通，见 conanfile.generate>"
    - "-DLAPACK_LIBRARIES=<lapack 包库清单直通>"
    - "-DFETCHCONTENT_SOURCE_DIR_TESTSWEEPER=<vendor/testsweeper-2024.05.31 本地源码>"
  dependencies:
    - lapack/3.12.1
    - cblas/3.12.1
  cc: hnp clang（profile tools.build:compiler_executables）

package:
  package_type: library
  libraries:
    - lib/libblaspp.a
  headers:
    - include/blas.hh
    - include/blas/*.hh
    - include/blas/defines.h（构建树生成，随包安装）

tests:
  upstream_blaspp_run_tests: "TOTAL=90 PASS=56 FAIL=0 SKIP=0 NOT_RUN=34（HOST 56 全 pass，--quick 全例程跑法；DEVICE 34 NOT_RUN=gpu_backend=none）"
  upstream_case_lines: "tester 逐用例行 5510 pass / 0 FAIL（辅助口径，与 conanfile 计数公式一致、不含 56 条 invocation 标记行；最终干净采信轮 Elapsed 41.53s，逐项明细见 reports/test-report.md）"
  test_package_consumer: "TOTAL=1 PASS=1 FAIL=0 SKIP=0 NOT_RUN=0"
  consumer_api_calls: 5
  consumer_assertions: 6

patches_applied: []

knowledge_gained:
  - "上游 FetchContent 构建期 git clone 依赖用官方变量 FETCHCONTENT_SOURCE_DIR_<名> 指向本地源码目录消除，上游 CMakeLists 零改动"  # knowledge_ref: E668
  - "BLAS++ 族（blaspp/lapackpp）经 BLAS_LIBRARIES/LAPACK_LIBRARIES 缓存变量直通库清单，绕开 -lblas 名称探测；静态链接序须消费者(lapack/cblas)在提供者(blas)之前"  # knowledge_ref: E667
