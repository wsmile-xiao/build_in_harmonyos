software: barvinok
display: "barvinok"
description: "整数点计数库及多面体分析命令行工具"
category: library
homepage: "https://barvinok.sourceforge.io/"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "主工程、isl、PolyLib 的 GNU config.guess/config.sub 需要识别 HarmonyOS 与 linux-ohos triplet"
    - "GMP 与 NTL 使用已发布 Conan 依赖，PolyLib 与 isl 保持 bundled 构建"
    - "native OHOS 构建时，configure 生成测试脚本需使用 /system/bin/sh；Linux/WSL 构建保留宿主 /bin/sh"
  common_dependencies:
    - gmp
    - ntl

versions:
  "0.41.9":
    status: pending_ci
    build_date: "2026-08-27"
    conan_ref: "barvinok/0.41.9"
