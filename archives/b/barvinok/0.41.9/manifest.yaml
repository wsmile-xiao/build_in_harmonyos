knowledge_gained:
  - "barvinok 0.41.9 是 Autotools 工程，发布包已包含 configure 和 config.sub。"
  - "主工程、isl 与 PolyLib 的 config.guess/config.sub 通过 E007 脚本补充 HarmonyOS 与 OHOS triplet。"
  - "依赖 NTL 的 GMP 支持，使用 gmp/6.3.0.1 与 ntl/11.6.0.2 的已发布配方。"
  - "默认使用包内 PolyLib 与 isl，避免引入未发布的额外依赖。"
  - "native OHOS configure 按知识条目 E232 通过 /system/bin/sh 启动，并保留 Conan 生成的完整参数。"
  - "OHOS HMDFS 下 config.status 内嵌子 shell 的 `umask 077` 会覆盖外层 umask，0700 临时目录不可写导致 subs1.awk Permission denied（E011）；按 adns/aespipe 先例用补丁将 configure 生成模板中的 umask 077 改为 022（0003/0006/0007/0011）为主修复，配方中保留的外层 `umask 002` 仅作兜底。"
  - "OHOS 的 ffs() configure 探测需通过 _XOPEN_SOURCE=700 显式启用声明。"
  - "make check 需同时加载 Conan 运行时环境和包内 .libs；静态主包的 isl Python ctypes 测试另用独立共享 isl 测试库验证。"
  - "PolyLib 在 NDEBUG 下不能把 pthread 初始化放在 assert 副作用中，0012-polylib-source-arith-errors.c.patch 显式保留 TLS 异常栈初始化。"
  - "静态主包的 isl Python 测试通过 0008 在 isl.py.top 读取 ISL_PYTHON_DLNAMEDIR，避免修改构建目录中的生成 isl.py。"
  - "CI 预下载器会截断含连字符的归档文件名，需按其实际缓存键同时准备截断名和完整名并核对 SHA256。"
  - "E135：CI worker 的 HNP python 动态加载器拒绝加载未签名 .so（dlopen Permission denied），本机 python.org HNP 却放行；测试用共享 isl 库必须在最终一次修改后用 binary-sign-tool 自签（.codesign 段）才能被 worker 加载，配方已内置 _sign_ohos_shared_library。"

