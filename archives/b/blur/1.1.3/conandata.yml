sources:
  url: "https://github.com/sonald/blur-effect/archive/refs/tags/1.1.3.tar.gz"
  sha256: "80baead168e117cdbd7dd915dac94b8055e63dc05ec5797f3030acfaf19e5654"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Bump cmake_minimum_required 2.8.11 -> 3.10 (cmake 4.x drops <3.5); drop libdrm/gbm/egl/glesv2 pkg-config requirements (OHOS has no DRM render nodes); link platform EGL/GLESv3; propagate pkg-config libdirs to linker"
    patch_type: "portability"
  - patch_file: "patches/0002-src-blur_image.cc.patch"
    patch_description: "Replace GBM/DRM offscreen path with EGL default display + pbuffer surface (no libgbm on OHOS); fix OpenHarmony GLES shader strictness (#version must start on first line; texture2D removed in GLSL ES 3.00)"
    patch_type: "portability"
