package: blur/1.1.3
homepage: "https://github.com/sonald/blur-effect"

upstream_check_command: "grep -c 'enable_testing\|add_test' CMakeLists.txt"  # 结果 0：上游无测试目标
upstream_test_in_build: false
upstream_test_command: ""   # 上游无测试（N=0），无命令可运行

upstream_tests: []          # 上游 1.1.3 无测试用例

# test_package 中自带的测试（消费者视角，鸿蒙侧补全）
test_package_tests:
  - file: test.sh
    description: "端到端离屏模糊冒烟（2 用例×5 断言）：32x32 与 256x256 fixture → blur_image -r 11 -p 2 → 断言输出合法 PNG/尺寸不变/内容已模糊；256x256 用例为 pbuffer 按图像尺寸创建的回归锚点（W4 审计 P1）"
    command: "sh test.sh blur_image"
  - file: test_in.png.b64
    description: "测试 fixture：32x32 RGBA 渐变图（自造，无版权负担）——base64 文本随仓（GitCode PR diff 不携带二进制补丁）"
    command: "(fixture, test.sh 运行时 base64 -d 解码)"
  - file: test_in_big.png.b64
    description: "测试 fixture：256x256 RGBA 渐变图（自造，无版权负担）——大图回读回归；base64 文本随仓"
    command: "(fixture, test.sh 运行时 base64 -d 解码)"

# 断言数：2 用例 × 5 断言（PNG 魔数入口 / 渲染 exit=0 / 输出魔数 / 尺寸保持 / 模糊生效）
assertion_count: 10
