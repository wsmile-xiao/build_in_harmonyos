software: blur
display: "blur"
description: "deepin blur-effect 离屏高斯模糊图像工具（OpenGL ES 3.0 离屏渲染，blur_image 命令行）"
category: graphics
homepage: "https://github.com/sonald/blur-effect"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 GBM+DRM 离屏路径不可用（OHOS 无 /dev/dri、无 libgbm）——改为 EGL_DEFAULT_DISPLAY + pbuffer surface（EGL 标准 API）"
    - "EGL/GLESv3 链接 OpenHarmony 平台库（clang 默认 sysroot 可见），gdk-pixbuf 及传递依赖走 conan 制品仓"
    - "cmake_minimum_required 2.8.11 被 cmake 4.x 拒绝，升至 3.10（同上游 PR#7 方向）"
    - "OpenHarmony GLES 严格模式：shader #version 必须首行、texture2D 在 GLSL ES 3.00 废弃改 texture"
    - "musl getopt 无 GNU 参数重排：调用时选项须置于输入文件路径之前"
  common_dependencies:
    - gdk-pixbuf
    - glib
    - EGL（平台库）
    - GLESv3（平台库）

versions:
  - version: "1.1.3"
    status: built
    build_date: "2026-09-09"
