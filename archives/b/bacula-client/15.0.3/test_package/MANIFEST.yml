# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bacula-client/15.0.3
homepage: "https://www.bacula.org"

# 上游测试命令 — bacula-client 官方单元测试为 src/tools 的 INSTTESTS
# (breaddir_test bpipe_test xattr_append_test crypto_test tags_test) +
# src/lib bsys_test。本包已在本地 OHOS aarch64 实跑（非跳过）。
upstream_check_command: "make -C src/tools breaddir_test bpipe_test xattr_append_test crypto_test tags_test && make -C src/lib bsys_test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-09-05 本地 OHOS aarch64 实测，6 个程序全部
# 实跑，未修改任何上游测试；合计 248 用例，243 通过，5 失败全部 OHOS
# 系统级阻塞——逐条定性见 PR 补充说明，无一是适配 bug，无一是缺环境跳过）：
# - breaddir_test    100/100 通过
# - bpipe_test         4/4   通过
# - xattr_append_test  7/7   通过
# - tags_test         33/33  通过
# - crypto_test       13/13  通过（夹具需 subjectKeyIdentifier 扩展，
#                             crypto_keypair_load_cert 经 openssl_cert_keyid
#                             硬校验，缺失即走错误上报路径段错误——夹具合规
#                             后全过；OHOS /tmp 只读 erofs，tmp 环境变量指向
#                             可写目录，属运行环境要求非阻塞）
# - bsys_test        86/91   （5 失败 = OHOS 系统级：/etc 为指向 /system/etc
#                             的符号链接致路径相等断言 x3；getcwd 路径无尾
#                             斜杠与测试期望不符 x1；fork/waitpid 子进程
#                             竞态（bclose_from 后 SIGCHLD 投递差异）x1，
#                             波动 84~86/91）
# - 消费者验证（test_package）：test_bacula_client.py（10 二进制存在/可执行/
#   ELF + 加载共享库运行尝试——bconsole 需连 Director，OHOS 无，R34 降级）
upstream_tests: []
