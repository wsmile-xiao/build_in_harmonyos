# test_package/MANIFEST.yml — boost-defaults 1.90.0.2
# 上游测试声明文件（CI L0e 强制存在；详见 docs/TEST_QUALITY_SPEC.md）

package: boost-defaults/1.90.0.2
homepage: "https://www.boost.org/"

# 元包无上游测试（上游仅 debian/ 打包目录 + 生成脚本，无 autopkgtest）
upstream_check_command: ""

# 上游无测试（Debian 元包无源码无测试）
upstream_test_in_build: false
upstream_test_command: ""

# 上游零测试（requirements-only 元包）
upstream_tests: []

# test_package 消费者测试：验证元包传播的 boost 头文件可用 + 默认版本正确
test_package_tests:
  - file: test.cpp
    description: "消费者测试：经 boost-defaults 传播的 Boost 1.90 头文件可用（shared_ptr/config/version）+ BOOST_LIB_VERSION==1_90 版本断言 + Boost.Test 编译库真实链接运行"
    command: "conan create（test_package 自动执行，self.run 直跑 test_boost_defaults）"

# 测试断言总数（3 个测试用例共 8 处 CHECK/REQUIRE：
# 版本断言 2 + smart_ptr 5 + config 1）
assertion_count: 8
