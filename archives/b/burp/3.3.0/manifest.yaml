software: burp
version: "3.3.0"
status: built
build_date: "2026-09-02"
build_system: cmake
source:
  url: "https://github.com/grke/burp/archive/refs/tags/3.3.0.tar.gz"
  tar_format: "tar.gz"
  dependencies:
    - "openssl/3.5.6"
    - "zlib/1.3.2"
    - "librsync/2.3.4"
    - "check/0.15.2"
    - "uthash/2.3.0"
build:
  system: "cmake"
  cc: "clang (OHOS NDK, --target=aarch64-linux-ohos)"
  cxx: "none (pure C project)"
  configure_options:
    - "CMakeToolchain via profile ohos-aarch64"
    - "-D<X>_ROOT_DIR=<dep package folder> x5 (openssl/zlib/librsync/check/uthash)"
patches_applied: "none（上游源码零修改；CMakeLists.txt 为构建时从 Makefile.am 机械生成的 overlay，随归档提交）"
runtime_modifications: "none"
knowledge_gained: "tarball 无预生成 configure 且 OHOS 构建环境无 automake/libtool——从 Makefile.am 机械生成 CMake overlay（$(VAR) 展开+反斜杠续行解析）；config.h 须按 OHOS sysroot 逐宏忠实生成（HAVE_CRYPT/HAVE_LOCKF/HAVE_XATTR/HAVE_BLAKE2 等经 sysroot 头文件+libc.so readelf 验证，缺 HAVE_CRYPT/HAVE_LOCKF 会多挂 2 个测试）；asfd 结构在 -DUTEST 下有额外字段，main_SOURCES 必须按 target 分别全量编译、不可建共享库（ODR 隐患）；OHOS /tmp 为只读 erofs，check 0.15.2 open_tmp_file 优先读 TEMP 环境变量（先于 P_tmpdir），runner 运行前须 export TEMP=<可写目录>；上游套件 233 checks 本地实跑 226 通过/7 失败/0 错误=96.99%，7 失败全部 OHOS 环境性（硬链接 link(2)→EPERM×4、inode 预置 security.selinux/user.hmdfs.perm/security.isolate 致 has_xattr()==0 必假、大小写不敏感 FS 致 setup_lower_failed 失败、硬链接错误路径 alloc 计数级联）"
