package: burp/3.3.0
homepage: "http://burp.grke.net/"

# burp 3.3.0 上游测试：utest/（check 框架，runner 目标，233 用例）——
# build 阶段 ctest -j1 实跑（TEMP 绕 OHOS 只读 /tmp）。OHOS aarch64
# 结果 Checks: 233, Failures: 8, Errors: 0（225/233=96.57%，多次运行
# 确定一致）。8 例全部已归因：7 例 OHOS 环境性（硬链接 EPERM×4——
# test_find/test_atomic_data_jiggle/test_bedup_non_burp_simple_link/
# test_bedup_non_burp_link_above_max_links；预置 xattr×1——test_xattrs；
# 大小写不敏感 FS×1——test_authorise_server 仅 setup_lower_failed；
# 硬链接级联×1——test_restore_some_things）+ 1 例 zlib/1.3.2 二进制
# 相关（test_verify_file_gzip_read_failure——新 libz.a 对 offset 10
# 的 gzip 损坏返回 Z_DATA_ERROR，A/B 验证与 -O0/-O3、librsync 无关；
# CI 由仓库 zlib 配方重建 → 确定性复现）。逐条见 manifest.yaml。
upstream_tests: 233
upstream_test_command: "build 阶段 ctest -j1 --output-on-failure（runner，check 框架，TEMP=${CMAKE_BINARY_DIR}/.tmp）"

test_package_tests:
  - file: test_burp.py
    description: "消费测试：bin/burp 可执行 + burp -V 输出含 burp-3.3.0 且退出码 0（2 断言；本地主机 HMDfs exec 策略禁止直接执行包内 dentry 时回退字节相同临时副本，CI 正常主机直接执行）"
    command: "python3 test_burp.py <package_folder>"

assertion_count: 2
