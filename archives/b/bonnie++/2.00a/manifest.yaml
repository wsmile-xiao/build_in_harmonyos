# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E011: configure/config.status 中 umask 077 导致 HMDFS 拒绝在临时目录中创建文件; 修改为 umask 022"
  - "Makefile.in 缺少 DESTDIR 支持; 在 install-bin 和 install 目标中添加 $(DESTDIR) 前缀"
  - "无 make check 目标 (基准测试套件，无单元测试)"
  - "bon_csv2txt 为 Perl 脚本，鸿蒙平台无 Perl 解释器"
  - "zcav 默认块大小 64MiB，测试小文件需用 -b 1 降低块大小"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/bonnie++-2.00a.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/bonnie++-2.00a.work
  source_orig_hash: f7267e1a8436f9b1
  source_work_hash: a9b6dc67df7f1b8d
  generated_at: '2026-06-17T22:30:34'
  patches_count: 3

patch_classification:
  - file: 0001-Makefile.patch
    type: build-fix
    platform_only: True
    description: "为 install-bin 和 install 目标添加 $(DESTDIR) 前缀，支持 R20 DESTDIR 模式"
    guard: 'always'
  - file: 0002-Makefile.in.patch
    type: build-fix
    platform_only: True
    description: "为 Makefile.in 模板的 install 目标添加 $(DESTDIR) 前缀"
    guard: 'always'
  - file: 0003-configure.patch
    type: platform-fix
    platform_only: True
    description: "configure 中 umask 077 改为 umask 022，修复 HMDFS 临时目录权限问题 (E011)"
    guard: 'always'
