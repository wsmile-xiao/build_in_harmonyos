# conandata.yml — barrier 2.4.0
# 源码 + vendored submodule 源码 + OHOS 补丁声明

sources:
  barrier:
    url: "https://codeload.github.com/debauchee/barrier/tar.gz/refs/tags/v2.4.0"
    sha256: "20046cae7a831d9bb3740b6f04feb9bded4c794c11586a70089080e94ae2fe77"
    # 注：配方里用 get(strip_root=True) 解压到源码目录
    destination: ""
  # P2: gulrak-filesystem（header-only ghc::filesystem），tarball 中子模块为空
  # NOTE: destination 由 conanfile.source() 显式传入，此处不声明以免重复关键字参数
  # 固定到 tag v1.5.16（GHC_FILESYSTEM_VERSION=10516）以保证供应链可复现，不用移动分支 refs/heads/master
  gulrak:
    url: "https://codeload.github.com/gulrak/filesystem/tar.gz/refs/tags/v1.5.16"
    sha256: "f4a098ed48e3b25b87b2be84cde58c884177af6b4ce27666ed2dbfe907b24418"
  # P2: google/googletest（ext/gtest + ext/gmock），tarball 中子模块为空
  googletest:
    url: "https://codeload.github.com/google/googletest/tar.gz/refs/tags/release-1.11.0"
    sha256: "b4870bf121ff7795ba20d20bcdd8627b8e088f2d1dab299a031c1034eddc93d5"

patches:
  # refresh-patch 生成（per-file difflib）：CMakeLists.txt（含 avahi P4 + cmake_min P1 两处）
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "OHOS: (P4) avahi-compat-libdns_sd 经 conan 暴露 CMake target（无 .pc），改用 find_package(CONFIG) 而非 pkg_check_modules； (P1) CMake 4 已移除 <3.5 支持，cmake_minimum_required 3.4 报错，升到 3.5"
    patch_type: "portability"
  # refresh-patch 生成：ArchMultithreadPosix.cpp
  - patch_file: "patches/0002-src-lib-arch-unix-ArchMultithreadPosix.cpp.patch"
    patch_description: "OHOS: pthread.h 不声明 pthread_setcancelstate/type（POSIX 取消函数），线程入口两行取消初始化移除（barrier core 从不依赖取消语义）"
    patch_type: "portability"
  # refresh-patch 生成：TestUtils.cpp（make_unittests 确定性字节源）
  - patch_file: "patches/0003-src-test-global-TestUtils.cpp.patch"
    patch_description: "OHOS/测试可移植性: generate_pseudo_random_bytes 由 uniform_int_distribution（跨标准库实现定义）改为 mt19937_64 & 0xFF，消除 libc++/libstdc++ 字节序列差异，使 SecureUtilsTests 期望值稳定"
    patch_type: "portability"
  # refresh-patch 生成：SecureUtilsTests.cpp（新期望值）
  - patch_file: "patches/0004-src-test-unittests-net-SecureUtilsTests.cpp.patch"
    patch_description: "OHOS/测试可移植性: 更新 SecureUtilsTests 的 4 处期望值（fingerprint hex + 3 段 randomart）以匹配确定性输入，套件在 OHOS（libc++）下 135/135 全绿"
    patch_type: "portability"
