# test_package/MANIFEST.yml
# barrier 2.4.0 — 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: barrier/2.4.0
homepage: "https://github.com/debauchee/barrier"

# barrier 使用 GTest（GoogleTest）。上游 unittests/integtests 目标未通过
# add_test 注册（上游如此），故 ctest 发现不了；配方 build() 直接运行
# unittests 可执行文件并输出 HMBS_UPSTREAM_TEST_RESULT 标记。
upstream_check_command: "unittests (gtest all)"

# conanfile.py build() 已集成上游单测（can_run 守卫运行 unittests）
upstream_test_in_build: true
upstream_test_command: "./unittests"

# 上游实际运行的测试程序（OHOS libc++ 下 135/135 通过）
upstream_tests:
  - file: test/unittests
    source: barrier-2.4.0/src/test/unittests
    description: "barrier C++ unit tests (gtest/GMock) — 135 tests from 13 suites"
    command: "./unittests"

# test_package 中自带的测试（消费者视角验证 CLI 二进制）
test_package_tests:
  - file: test.sh
    description: "smoke test: barrier CLI binary prints --version"
    command: "./test.sh"

# 测试断言总数（近似值, 用于质量评估）——135 上游 GTest + 2 CLI smoke
assertion_count: 137
