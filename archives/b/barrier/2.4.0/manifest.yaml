# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS 工具链设 CMAKE_SYSTEM_NAME=HarmonyOS，CMake 无对应 platform module，UNIX 变量为空导致所有 if(UNIX) 分支跳过；配方 generate() 需强制 CMAKE_SYSTEM_NAME=Linux"
- "barrier 的 check_include_files/check_library_exists 是模块式查找（非 target 模式），conan CMakeDeps target 不生效；需把依赖 include 目录注入 CMAKE_REQUIRED_INCLUDES/CMAKE_CXX_FLAGS_INIT，库目录注入 CMAKE_LIBRARY_PATH"
- "OHOS pthread.h 不声明 pthread_setcancelstate/type（POSIX 取消函数），patched 移除后 barrier core 正常工作（不依赖取消语义）"
- "avahi-compat-libdns_sd 在 ohpcd 仅暴露 CMake target 无 .pc，pkg_check_modules 失败，改为 find_package(CONFIG)"
- "CMake4 移除 cmake_minimum_required <3.5 支持，barrier 3.4 需升 3.5"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

