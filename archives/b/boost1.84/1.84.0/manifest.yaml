compiler: clang
platform: OpenHarmony
package_name_note: "boost1.84 为独立包名（区别于制品仓已有 boost/1.84.0），上游同源 boost 1.84.0"
notes: 手动编译 4 个库 + 全量头文件安装；上游测试 16 项中 15 项通过（parsers_test 段错误为已知环境差异，见 test_package/MANIFEST.yml）
