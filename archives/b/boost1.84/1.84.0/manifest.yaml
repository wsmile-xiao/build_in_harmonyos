build_options:
  - "手动编译 4 个非 header-only 库：filesystem / regex / program_options / iostreams"
  - "clang++ -std=c++17 -stdlib=libc++ -fPIC，静态库 .a 归档（b2 在 OHOS 不兼容）"
dependencies:
  - zlib/1.3.1
knowledge_gained:
  - Boost b2 (Boost.Build) 的 SHELL 执行机制在鸿蒙不兼容（E068 错误模式），需绕过 b2 手动编译
  - Boost CMake 支持是实验性的 superproject 模式，不支持独立构建
  - OHOS musl 无 pthread_setcancelstate，通过 BOOST_SP_NO_PTHREAD_SETCANCELSTATE 特性宏跳过（R8 合规，非平台宏）
  - System / date_time 自 Boost 1.69 起 header-only，无需编译
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题)
issues: []
