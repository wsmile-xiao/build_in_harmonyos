software: bsdutils
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.4.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.4.1.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-24"

# 构建系统标识（verify-build 要求）
build_system: make

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian snapshot 官方归档——debian-archive slink source/base）
  url: "https://snapshot.debian.org/archive/debian-archive/20090802T004153Z/debian/dists/slink/main/source/base/bsdutils_4.4.1.1.tar.gz"

  # 源码校验和
  sha256: "116ee4a6dd6dea93a3b7cb6676d3174c2de3ac38d26d3d3579a00d978cc82242"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 构建系统标识（verify-build 要求）
  build_system: make

  # 配置选项列表
  configure_options:
    - "CC=clang（命令行覆盖 Makefile 硬编码 gcc）"
    - "CFLAGS=-O2 -I. -DDEBIAN -Wno-deprecated-non-prototype"
    - "LDFLAGS=（清空 -s）"

  # 编译依赖列表（格式: name/version）——仅 -lutil（musl 兼容空库），无 Conan 依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码 patch——命令行覆盖 Makefile 变量）
patches_applied: []
runtime_modifications: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "Debian bsdutils 老版源码包（slink 1999）为纯 BSD 工具集，Makefile 硬编码 CC=gcc——命令行覆盖即可，无源码 patch"
    - "script.c 的 openpty/login_tty 由 musl libc 提供，-lutil 为 musl 兼容空库（链接通过无需处理）"
