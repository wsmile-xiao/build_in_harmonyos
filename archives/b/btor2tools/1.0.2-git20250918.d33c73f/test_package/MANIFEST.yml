# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: btor2tools/1.0.2-git20250918.d33c73f
homepage: "https://github.com/boolector/btor2tools"

# 上游测试命令: test/runtests.sh 使用 catbtor 解析 test/tests/*.in
# 并与对应 *.out 逐行 diff，覆盖语法错误/格式边界/排序等 case。
upstream_check_command: "make -C build/bin check (test/runtests.sh)"

# conanfile.py build() 方法中未集成上游测试（上游测试依赖构建目录布局）
upstream_test_in_build: false
upstream_test_command: "./test/runtests.sh"

# 上游实际运行的测试程序（catbtor + 解析 case 对）
upstream_tests:
  - file: test/runtests.sh
    source: btor2tools-d33c73f/test/runtests.sh
    description: "catbtor 解析回归测试脚本（test/tests/*.in 与 *.out 对比）"
    command: "./test/runtests.sh"

# test_package 中自带的测试（消费者视角验证：真实调用 btor2parser API）
test_package_tests:
  - file: test.c
    description: "消费者测试：btor2parser_new/read_lines/iter/max_id 解析 5 行 BTOR2 输入"
    command: "./test_btor2tools"

# 测试断言总数 (近似值：上游 runtests.sh 约 90 个 *.in/*.out 对作 diff)
assertion_count: 90