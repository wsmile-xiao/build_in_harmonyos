knowledge_gained:
  - "Boost.Container 测试（libs/container/test/ 69 个 .cpp）全部自带 int main()，不依赖 boost_unit_test_framework，可绕过 b2 手动编译运行"
  - "上游测试链接需要 libboost_container.a（dlmalloc_allocation_command 等符号在 libs/container/src/ 的编译单元中，上游 Jamfile run 目标都挂 /boost/container//boost_container）"
  - "slist_test 在 clang -O2 下死循环（CPU 满载 900s 不退出，非测试逻辑错误）；-O0 编译 0.2s 通过——该测试单独降级 -O0"
  - "OHOS 上运行测试二进制需 LD_LIBRARY_PATH 指向 SDK libc++_shared.so（clang++ -print-file-name=libc++_shared.so 自省定位，无硬编码版本路径），且 musl 加载器仅在经 shell 启动时遵守该变量"
  - "container 头文件不触碰 pthread_setcancelstate 路径，无需 boost/1.84.0 的 0001 补丁"
  - "package() 安装完整 boost/ 头树而非仅 container 子树：Boost 库间头文件传递依赖强，部分头树会破坏传递 include"

