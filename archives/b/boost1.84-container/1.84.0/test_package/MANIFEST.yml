# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: boost1.84-container/1.84.0
homepage: "https://www.boost.org/libs/container/"

# 上游测试入口：b2 编译系统（OHOS 不兼容，E068），无法直接运行 B2 测试目标；
# 上游 Jamfile.v2 以 [ run $(fileb) /boost/container//boost_container ] 逐个
# 注册 libs/container/test/*.cpp —— 共 69 个 .cpp 测试源，全部自带 int main()
# 且不依赖 boost_unit_test_framework。
upstream_check_command: "b2 libs/container/test"

# 本包在 conanfile.py build() 中手动编译 libboost_container.a（上游 Jamfile
# 同源集合）+ 逐个编译运行全部 69 个上游测试源（退出码判定），统计写入
# build_folder/upstream-tests-report.txt
upstream_test_in_build: true
upstream_test_command: "conan create（build() 内 _run_upstream_tests 逐个编译运行 libs/container/test/*.cpp）"

# 上游 container 测试全集（N=69，与 libs/container/test/ 目录实测 .cpp 数一致）
upstream_tests:
  - file: libs/container/test/alloc_basic_test.cpp
    source: boost_1_84_0/libs/container/test/alloc_basic_test.cpp
    description: "上游 container 测试 alloc_basic（绕过 b2 手动编译链接 libboost_container.a 后真实运行）"
    command: "clang++ ... alloc_basic_test.cpp -lboost_container && ./ut_alloc_basic"
