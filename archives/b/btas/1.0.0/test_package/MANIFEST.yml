# test_package/MANIFEST.yml
# 上游官方测试与消费者测试声明文件

package: btas/1.0.0
homepage: "https://github.com/ValeevGroup/BTAS"

# 上游测试:unittest/ 目录,捆绑 Catch v2.13.4,单一可执行 btas_test,
# 由 CTest 名 btas/unit/run 以 unittest/ 为工作目录执行(读取 *.txt 数据文件)。
# 原生验证命令(设备真实执行,配置 BTAS_USE_BLAS_LAPACK=OFF、Boost 无 serialization):
upstream_test_command: "cmake --build bt-build --target btas_test -j8 && cd BTAS-1.0.0/unittest && ../../bt-build/unittest/btas_test"

# 统计口径:计数单位 = Catch TEST_CASE(用例);SECTION 属用例内断言分组,不计用例数。
# 取数命令:
#   注册用例清单: ./btas_test --list-tests | grep -c '^  '   -> 20
#   执行结果:     ./btas_test | tail -3                      -> "test cases: 20 | 19 passed | 1 failed" / "assertions: 1118 | 1116 passed | 2 failed"
#   源码声明数:   grep -h TEST_CASE unittest/*.cc 共 29 行,扣 5 行注释
#   (tensorview_test.cc:165/258/374/406 的 `} // TEST_CASE(...)` 尾注释 +
#    tensor_cp_test.cc:29 被注释的 CP_ALS 声明) = 活跃声明 24
upstream_tests:
  - file: unittest/btas_test (contract/mohndle/range/tensor_blas/tensor_cp/tensor_func/tensor_lapack/tensor/tensorview/ztensor_cp 共 10 个 .cc)
    source: BTAS-1.0.0/unittest/
    description: "上游全量单元测试(Range/Tensor/TensorView/缩并/CP 分解等)"
    command: "cd BTAS-1.0.0/unittest && ../../bt-build/unittest/btas_test"
    result:
      registered_and_executed: 20
      passed: 19
      failed: 1   # Tensor SVD(tensor_lapack_test.cc:48,2 个断言 :48/:93 失败)
      skipped: 0
      assertions_total: 1118
      assertions_passed: 1116
      assertions_failed: 2

# 本配置下未编译、贡献 0 用例的源码声明(非 PASS、非 skip,单列说明):
# - CP / ZCP(tensor_cp_test.cc:17 + ztensor_cp_test.cc:15):位于
#   #ifdef BTAS_HAS_BLAS_LAPACK 文件段内,本配置未定义该宏(上游特性开关,非测试跳过);
#   同文件 tensor_cp_test.cc:29 另有被注释的 CP_ALS 声明,系上游死代码,不计入声明总数。
# - TensorView serialization(tensorview_test.cc:410):上游以 #if 0 显式禁用
#   (源内注释 "serialization of TensorView is disabled")。
# - performance(performance.cc):上游 unittest/CMakeLists.txt 的 btas_test_src_files
#   未列入该文件,不参与 btas_test 构建。
# 未编译小计 4;TOTAL(活跃 TEST_CASE 声明)= 20 执行 + 4 未编译 = 24。
#
# 失败用例技术原因(有原始证据):
# Tensor SVD 运行期抛 "BTAS: exception at btas/generic/gesvd_impl.h(43):
# GESVD Does not have a Generic Implementation" —— 上游设计:SVD 仅提供
# BLAS/LAPACK 后端实现,无 generic 回退;本配置因 blas++/lapack++ 在制品仓
# 无配方(conan list "blaspp/*"/"lapackpp/*" -r=ohpcd 均 0 匹配)而关闭
# BTAS_USE_BLAS_LAPACK。影响范围:仅 SVD 功能 1 用例;替代验证:gemm/gemv/
# ger/axpy/scal/dot/contract 等 generic 后端全部通过(19/20 用例、1116 断言)。
# 修复路径:另行发布 blaspp/lapackpp 配方后启用 BLAS 后端重测。

test_package_tests:
  - file: test_btas.cpp
    description: "消费者测试:生成头版本断言、feature 自动探测与默认索引类型 static_assert、scal/axpy/dot/gemm/contract 数值对账(含 complex 路径)、TensorView 写穿透"
    command: "./test_btas"

assertion_count: 14
