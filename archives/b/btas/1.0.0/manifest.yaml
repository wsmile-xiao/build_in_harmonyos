software: btas
# 版本级 manifest
# 文件位置: archives/b/btas/1.0.0/manifest.yaml

version: "1.0.0"
status: built
build_date: ""
build_system: none  # header-only INTERFACE 库;上游 CMake 仅用于配置生成 version.h 与安装

source:
  url: "https://github.com/ValeevGroup/BTAS/archive/refs/tags/v1.0.0.tar.gz"
  sha256: "759341a3330b46c47bb5fbf44456b7de83e8cc9c4de68faee02c34bcb985885c"
  tar_format: tar.gz

build:
  system: none  # header-only,打包 btas/ 头树 + 生成的 btas/version.h
  configure_options:
    - "-DBTAS_USE_BLAS_LAPACK=OFF (上游可选特性,blas++/lapack++ 制品仓无配方,见 notes.md)"
  dependencies:
    - boost/1.91.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "BTAS 为 INTERFACE(header-only)上游,CMake configure 期强制 FetchContent 拉取 kit-cmake(网络依赖),Conan 包改为直接打包头树并按 configure_file 规则生成 btas/version.h,test_package 断言 BTAS_VERSION 验证等价性 (reference: notes.md 打包决策节)"
  - "btas/features.h 以 __has_include 探测 Boost.Iterator/Container、btas/defaults.h 兜底 BTAS_TARGET_MAX_INDEX_RANK=6,因此 Boost 依赖只需传递 include 路径,无需向消费者传播上游 CMake 的 BTAS_HAS_* 编译定义 (reference: notes.md 打包决策节)"
  - "上游 unittest 的 tensor_lapack_test.cc(Tensor SVD 用例)不做编译守卫,在 BTAS_USE_BLAS_LAPACK=OFF 下运行期必然抛 gesvd 无 generic 实现异常,属上游设计而非移植缺陷;blas++/lapack++ 在制品仓无配方,补齐这两个包后方可全量通过 (reference: notes.md 上游测试计数节)"
  - "设备端原生验证 FetchContent 场景:对 $HOME/tmp 下 clone 出的仓库,dubious ownership 需按精确路径登记 safe.directory(父目录前缀不生效),并以 FETCHCONTENT_SOURCE_DIR_<NAME> 指向本地固定 tag 克隆绕过网络 clone (knowledge_ref: E101)"
  - "test_package 链接依赖共享库(boost .so)时,运行期需 VirtualRunEnv(scope=run) 生成 conanrunenv 并以 self.run(env=conanrun) 执行,否则 boost 共享库解析失败 (knowledge_ref: E298)"
  - "Conan 2 conan.tools.files 无 read 导出,读文本模板用 load,否则配方加载报 ImportError (reference: notes.md 原生探索节)"

knowledge_ref:
  - "E101"
  - "E298"
