# 软件级 manifest — btas
# 位置: archives/b/btas/manifest.yaml

software: btas
display: "BTAS"
description: "BTAS: Basic Tensor Algebra Subprograms — Valeev Group 的 C++17 header-only 张量代数库,提供 Range/Tensor/TensorView、逐元素运算、dot/scal/axpy/ger/gemv/gemm、张量缩并与 CP 分解等核心原语"
category: data
homepage: "https://github.com/ValeevGroup/BTAS"
license: BSD-3-Clause
build_system: none  # header-only; 上游 CMake 工程仅用于配置/安装 header

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "header-only INTERFACE 库,打包 btas/ 头树并按上游 configure_file 规则生成 btas/version.h"
    - "Boost 为强制依赖(container/iterator),feature 宏由 btas/features.h __has_include 自动探测,消费者无需额外编译定义"
    - "BLAS/LAPACK 绑定依赖 blas++/lapack++,制品仓无对应配方,采用上游支持的 BTAS_USE_BLAS_LAPACK=OFF 配置;SVD(gesvd) 无 generic 实现,按上游设计抛异常"
    - "Boost.Serialization 可选,制品仓 boost 二进制不含 serialization,序列化相关用例不编译"
  common_dependencies:
    - boost

# 版本索引(所有已归档版本,含状态)
versions:
  "1.0.0":
    status: built
    build_date: "2026-09-05"
    conan_ref: "btas/1.0.0"
