# test_package/MANIFEST.yml — burst/3.1.1
package: burst/3.1.1
homepage: "https://github.com/izvolov/burst"

# `check` is an ALL custom target which builds and directly runs burst-unit-tests.
upstream_check_command: "cmake --build build/Release --target check"
upstream_test_in_build: true
upstream_test_command: "burst-unit-tests --report_level=short --color_output"

upstream_tests:
  - directory: test/burst
    source: burst-3.1.1/test/burst/**/*.cpp
    description: "Complete upstream doctest suite for algorithms, containers, iterators, ranges, tuples and type traits"
    command: "burst-unit-tests --report_level=short --color_output"

test_package_tests:
  - file: test.cpp
    description: "Consumer checks radix_sort, three-range lazy intersection, dynamic_tuple and constexpr intpow through Burst::burst"
    command: "./test_burst"

# One framework-reported logical test case is the common counting unit.
# Doctest reports 724 upstream cases; the consumer adds four independent scenarios.
upstream_test_count: 724
test_package_test_count: 4
assertion_count: 1042
