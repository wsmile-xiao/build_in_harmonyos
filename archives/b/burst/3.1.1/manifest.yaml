# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.1.1"

# 软件名
software: "burst"

# 编译状态
# published | built | failed | archived
status: failed

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-12"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/izvolov/burst/archive/refs/tags/v3.1.1.tar.gz"

  # 源码校验和
  sha256: "ee58c7b98ca1709dd452b9ba46cb4c91fc0b2952edd020ed5bc2d600b3edeae7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBURST_TESTING=ON"
    - "-DBURST_BENCHMARKING=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - boost/1.90.0
  test_dependencies:
    - doctest/2.5.2
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Burst is header-only, but its 724-case upstream suite requires Boost headers and doctest."
  - "Use a recipe-local CMakeDeps build module to expose header-only Boost::system without building Boost.System."
  - "Disable benchmarks to avoid the optional compiled Boost.Program_options dependency."
  - "Map OHOS to CMake's Linux platform model for this platform-neutral POSIX header library, while retaining the OHOS profile and compiler."
  - "When CMAKE_SYSTEM_NAME=Linux makes CMake preserve a bare executable name in a cross-build custom target, build that executable target and run its absolute path with the original test arguments."
  - "OHOS AArch64 defaults plain char to unsigned, but the unchanged upstream to_unsigned<char> test places char in its signed-type matrix; compile the upstream suite with -fsigned-char per knowledge E419."

test_results:
  counting_basis: "framework-reported logical test cases"
  upstream_framework: "doctest 2.5.2"
  upstream_passed: 723
  upstream_failed: 1
  upstream_skipped: 0
  upstream_assertions_passed: 1035
  upstream_assertions_failed: 1
  consumer_scenarios_passed: 0
  consumer_assertions_passed: 0
  native_conan_create: "PASS (2026-09-12 Apple arm64 clean Conan 2.32.0 lifecycle; absolute-path upstream test execution)"
  native_upstream_passed: 724
  native_upstream_assertions_passed: 1036
  native_consumer_scenarios_passed: 4
  native_consumer_assertions_passed: 6
  ohos_conan_verify: "CI #45099 proved absolute-path execution works and ran all 724 upstream cases; 723 passed and only to_unsigned<char> failed because OHOS AArch64 defaults plain char to unsigned. The suite now uses -fsigned-char; rerun pending."

test_passed: 723
