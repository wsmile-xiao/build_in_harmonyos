package: boost1.84-graph/1.84.0
homepage: https://www.boost.org/

# 上游测试说明
# Boost 自带的 B2 构建系统在 OHOS 不兼容（SHELL 执行机制失败，E068/E099），
# 无法直接使用 b2 运行上游测试。本适配通过手动编译 boost.graph 官方测试源
# 文件（libs/graph/test/Jamfile.v2 注册的全部 120 个测试目标：96 run +
# 24 compile，含 graph.cpp 9 个 TEST 变体与 property_iter.cpp 9 个变体）
# 绕过 b2，在 OHOS 环境真实编译并运行，报告写入
# build_folder/upstream-tests-report.txt。
# 测试方式：clang++ 逐个编译测试源文件，run 型链接 libboost_graph.a
#（及测试期辅助库 timer/regex/serialization/filesystem——Jamfile 声明的
# /boost/* 库依赖，从同一源码树按各库 Jamfile 源清单现场编译，仅测试链接
# 用，不入包）后直接运行；compile 型按 b2 compile 语义只编译不链接。
# 带参数/数据文件的测试按上游 Jamfile 参数传入（metis weighted_graph.gr /
# cycle_ratio_s382.90.dot / planar_input_graphs 目录 / mas&stoer_wagner
# TEST_DIR / betweenness 100 / dijkstra_heap 10000 / random_matching 1000 1020）。
# b2 不兼容是已知技术障碍，项目方已记录（E068/E099 错误模式）。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/graph/test/Jamfile.v2 全部 120 目标（96 run + 24 compile）"
    description: "boost.graph 上游测试套件全量：adjacency_list/BFS/DFS/Dijkstra/最大流/平面性/VF2同构/GraphML/Graphviz 等，本地实测 120/120 通过（0 失败 0 豁免）"
    command: "clang++ <test>.cpp -lboost_graph [-lboost_timer|-lboost_regex|-lboost_serialization|-lboost_filesystem] && ./<test> [args]"
    result: passed
test_package_tests:
  - file: test_boost_graph.cpp
    description: "boost.graph: adjacency_list 构造 + BFS/DFS 访问序列 + Dijkstra 最短路径(7) + topological_sort + 编译库路径 read_graphviz(3v/2e) + write_graphviz + graphml 读写往返，9 组 API 断言"
    command: "ctest boost_graph_test"

assertion_count: 9  # test_package 实际断言组数；上游 120 测试目标全过见 upstream_tests
