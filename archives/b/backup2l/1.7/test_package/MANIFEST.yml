# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: backup2l/1.7
homepage: "https://github.com/gkiefer/backup2l"

# 上游测试命令 — backup2l 上游无独立 CI 单元测试套件（备份 shell 工具，
# 验证 = 脚本安装 + 运行 --help）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-21 实测记录）：
# - 上游无独立测试套件（无 make test 入口；仓库含 backup2l 脚本 +
#   install-sh + man page）
# - 构建验证：纯 shell 脚本无编译（install-sh 布局）
# - 消费者验证（test_package）：bash backup2l --help 输出用法（R34）——
#   实测通过；真实备份运行需可挂载文件系统（OHOS 受限，如实说明）
upstream_tests: []
