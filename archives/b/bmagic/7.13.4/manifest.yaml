# 编译中学到的知识（行内必须带 knowledge_ref/reference 引用）
knowledge_gained:
  - "上游平台探测 (config.guess/canon-system) 不识别 OHOS 且 FUSE 上 umask 077 临时目录不可写 (reference: E011, E160)：用上游 make 变量 OSNAME=aarch64-linux-gnu 直接指定平台 mk，零补丁绕过"
  - "OHOS uname -r 含空格使平台 mk 的 OS_VER 宏损坏 (knowledge_ref: E549 draft)：make 顶层覆盖 OS_VER=-D__HarmonyOS_HongMeng__（同族先例 E036）"
  - "GNU ld 专有 -export-dynamic 被 lld 误解析为 -e xport-dynamic，ELF entry=0x0 启动即段错误 (knowledge_ref: E547 draft)：COMMON_LDFLAGS=-rdynamic 等价覆盖 + 上游 relink 重链"
  - "设备无 g++，上游 GNU_CC 分支硬编码 CXX=g++：make 变量 CXX/CC/LD 覆盖为 Conan conf 提供的 clang/clang++ (R33)"
