software: bmagic
display: "bmagic (BitMagic C++ Library)"
description: "BitMagic C++ Library — compressed bit-vectors (bvector), sparse/integer/string sparse vectors, set-algebra algorithms, serialization and SIMD kernels (header-only)"
category: data-structure
homepage: "https://github.com/tlk00/BitMagic"
license: Apache-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游平台探测 (config.guess/canon-system) 不识别 OHOS：以 make 变量 OSNAME=aarch64-linux-gnu 直接指定平台 mk，不改上游文件"
    - "OHOS uname -r 含空格使平台 mk 的 OS_VER 宏损坏：OS_VER 顶层覆盖为 -D__HarmonyOS_HongMeng__"
    - "上游 aarch64.mk 的 GNU ld 专有 -export-dynamic 被 lld 误解析为 -e xport-dynamic (ELF entry=0x0, 启动即段错误)：COMMON_LDFLAGS=-rdynamic 等价覆盖"
    - "设备无 g++，CXX/CC/LD 以 make 变量覆盖为 Conan conf 提供的 clang/clang++ (R33)"
    - "上游测试 bmtest/bmtest64 单次全量 runs for days（CI conan create 3600s 窗口不可容纳）：包内完整编译 + ptest 完整运行 (8/8 全绿，时长 2–4 分钟量级)；设备侧按上游选择器分块全量执行于 2026-10-03 23:52 跑完——bmtest 13/13 块 + bmtest64 9/9 块 + ptest 8 子运行 = 上游 229 个单位全部 exit 0、0 失败、NOT_RUN=0（取数与逐块读数见 7.13.4/test_package/MANIFEST.yml）"
  common_dependencies: []

versions:
  "7.13.4":
    status: built
    build_date: "2026-09-05"
