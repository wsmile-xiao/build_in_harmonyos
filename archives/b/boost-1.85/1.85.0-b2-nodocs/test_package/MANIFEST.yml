name: test_boost
type: executable
description: >
  L1 smoke test for boost-1.85/1.85.0-b2-nodocs. Exercises all 9 b2-built
  static components (atomic/chrono/filesystem/iostreams/program_options/
  random/regex/system/thread) through a CMake consumer that links against
  the Conan-packaged Boost and runs the resulting binary on the OHOS host.
build_system: cmake
language: cpp
sources:
  - src/test_boost.cpp
  - CMakeLists.txt
  - conanfile.py
  - MANIFEST.yml
steps:
  build:
    command: cmake --build .
    description: Build the consumer binary against the packaged Boost components.
  run:
    command: ./test_boost
    description: >
      Execute the consumer on the OHOS host (ELF-signed, SDK libc++ on
      LD_LIBRARY_PATH). Exits 0 only if every component works.
expected_output: "boost-1.85 1.85.0-b2-nodocs: all 9 b2-built components OK"
