software: boost-1.85
version: 1.85.0-b2-nodocs
status: built
build_system: b2
configure_options: []
build_options:
  - "b2 直跑（OHOS 首例）：user-config.jam 以 gcc toolset 名字注册 OHOS clang++（绕过 clang.jam init-flags-cross 注入的 --target=arm64-pc-linux，保留 aarch64-unknown-linux-ohos 默认 target 与 sysroot）"
  - "b2 --with-{atomic,chrono,filesystem,iostreams,program_options,random,regex,system,thread} variant=release link=static threading=multi --no-cmake-config stage"
  - "b2 引擎来自 tool_requires boost-build/1.90.0（B2 5.3.2，制品仓已发布），不自举"
  - "ZLIB_INCLUDE/ZLIB_LIBPATH 指向 conan zlib 包（iostreams gzip，R36 依赖链 Conan 管理）"
  - "-DBOOST_SP_NO_PTHREAD_SETCANCELSTATE（E099 关联：OHOS musl 无 pthread_setcancelstate，补丁 0001）"
  - "上游测试：b2 原生测试框架（testing.capture-output）真实编译+运行"
dependencies:
  - zlib/1.3.1
build_dependencies:
  - boost-build/1.90.0
knowledge_gained:
  - "b2 在 OHOS 可直跑：E099 的『编译器探测失败』根因细化——clang toolset 注入 --target=arm64-pc-linux（tools/build/src/tools/clang.jam init-flags-cross，条件 <target-os>linux/<architecture>arm/<address-model>64）覆盖 OHOS clang 默认 target，破坏 sysroot/libc++ 头文件探测（__config_site/cstddef not found）"
  - "绕过方案：user-config.jam 用 gcc toolset 名字注册 OHOS clang++（gcc.jam 不注入 --target），cxx11_static_assert 探测即恢复 yes"
  - "b2 引擎二进制动态链接 libc++_shared.so，需 LD_LIBRARY_PATH 指向 SDK libc++ 目录（clang++ -print-file-name 自省定位）"
  - "b2 原生测试框架（testing.capture-output）在 OHOS 完整可用——手动编译配方做不到的上游测试运行方式"
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题——SHELL/ldconfig，本任务对照实验证明与 b2 编译无关)
  - E099 (b2 构建系统不兼容 OHOS——边界已细化：仅 clang toolset --target 注入问题，gcc toolset 伪装可绕过)
issues: []
compilation_date: 2026-09-09
compiler: clang
platform: OpenHarmony

notes: b2 直跑 OHOS 首例（路径 C 实验产物），9 库 b2 构建；完整对照实验报告见 notes.md
