# test_package/MANIFEST.yml
# 上游官方测试声明文件 (bptree 0.5.0, habedi/bptree)
# 单头文件 C 库：无 configure/ctest/meson；上游测试为 Makefile 的
# test/bench/example 目标（clang -std=c11 -Iinclude）。
# 独立上游用例 = test_bptree.c 中 29 个 RUN_TEST 调用（数值键默认构建）。

package: bptree/0.5.0
homepage: "https://github.com/habedi/bptree"

# 上游测试命令（本库无 make check；实际测试入口为 make test → bin/test_bptree）
upstream_check_command: "make test"

# conanfile.py 为 header-only 无编译阶段，上游测试不内嵌在 build()
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（29 个 RUN_TEST 用例全部在默认数值键构建下执行）
upstream_tests:
  - file: test/test_bptree.c
    source: bptree-0.5.0/test/test_bptree.c
    description: "B+ tree 单元测试：29 个 RUN_TEST（创建/插入/删除/范围查询/迭代器/不变量/压力）"
    command: "./bin/test_bptree"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 bptree_create/insert/contains/delete/check_invariants"
    command: "./test_bptree"

# 测试断言总数（近似值：上游 ASSERT 断言 + 消费者断言，用于质量评估）
assertion_count: 210
