  - "纯 C 单头文件库（BPTREE_IMPLEMENTATION 模式）配方用 package_type=header-library，copy() 必须绝对路径 src/dst（相对路径会解析到 build 目录，导致 test_package 报 Imported target includes non-existent path）"
