# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bsd-games/3.3
homepage: "https://bsd-games.sourceforge.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 bsd-games 3.3 无任何测试：源码包无 tests/ 目录、顶层 Makefile
# 无 test/check 目标（Alpine aports APKBUILD 亦标注 options="!check" # no tests）
upstream_check_command: "make check"
upstream_check_result: "上游无 test/check 目标，make check 不存在"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "18 个游戏二进制存在且可执行（18 断言）"
    command: "test -x {bindir}/{game}"
  - file: test.sh
    description: "caesar 无参数走频率分析（find_best_rotation 选中偏移 23）：echo 'Hello World' | caesar == 'Ebiil Tloia'"
    command: "./caesar"
  - file: test.sh
    description: "caesar 显式偏移 13：echo 'Hello' | caesar 13 == 'Uryyb'"
    command: "./caesar 13"
  - file: test.sh
    description: "wump -h 输出 Usage 用法文本"
    command: "./wump -h"

# 测试断言总数 (近似值, 用于质量评估)
# 18（二进制存在）+ 2（caesar 断言）+ 1（wump usage）= 21
assertion_count: 21
