# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://sourceforge.net/projects/bsd-games/files/bsd-games-3.3.tar.gz"

  # 源码校验和
  sha256: "78bfdf7f4e1f61ed42ad1209ef52520b89a583bd511e9606b8162f813078048d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=${package_folder}"
    - "--localstatedir=${package_folder}/var/lib"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ncurses/6.6

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Config.mk.in.patch"

# 适配修改说明：
# - patches/0001-Config.mk.in.patch: INSTALL_SCORE 去掉 "-g users"
#   （OHOS 无 users 组，install 阶段报 "install: bad group 'users'"）
#   → 改为 -m 664 /dev/null

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "bsd-games configure 用 pkg-config 探测 ncurses，但 conan ncurses 包只有 ncursesw.pc（无 ncurses.pc），探测失败回退默认 -lncurses → 需在 PKG_CONFIG_PATH 中提供 ncurses.pc 软链/别名"
  - "install 阶段 INSTALL_SCORE 使用 -g users 组，OHOS 无 users 组 → 报 bad group 'users'，需去掉 -g users"
  - "该 configure 为手写简化 autotools（非标准 autoconf），仅支持 --prefix/--bindir/--datadir/--mandir/--wordlist/--localstatedir/--builddir 选项，不支持 --enable-static/--disable-shared"

