# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.16"

# 构建系统类型
build_system: autotools

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/bgp/bgpq4/archive/refs/tags/1.16.tar.gz"

  # 源码校验和
  sha256: "c228e44bb62141851e7213563b5800b9b7b56d183f71563d5f0fe1ecdf57709e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 构建注意事项
  notes: "需要先运行 autoreconf --force --install --verbose 生成 configure；使用 out-of-source 构建绕过 HMDFS umask 077 权限问题；需修补 config.status 移除 umask 077；需修复 config.sub 中 ohos-linux 映射的重复行"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autotools git tag 源码缺少 configure 脚本，需先运行 autoreconf --force --install --verbose"
  - "HMDFS 的 umask 077 导致 config.status mktemp 临时目录不可写，需移除 umask 077 或使用 out-of-source 构建"
  - "预扫描脚本自动添加 ohos-linux 映射可能产生重复行，需手动修复 config.sub"

patch_generation:
