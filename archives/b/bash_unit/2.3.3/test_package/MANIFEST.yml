package: bash_unit/2.3.3
homepage: https://github.com/bash-unit/bash_unit

upstream_check_command: "./bash_unit tests/test*"
upstream_test_in_build: true
upstream_test_command: "TMPDIR=$TMPDIR ./bash_unit tests/test*"

upstream_tests:
  - file: tests/test_cli.sh
    source: bash_unit-2.3.3/tests/test_cli.sh
    description: "CLI behavior and argument handling"
    command: "./bash_unit tests/test_cli.sh"
  - file: tests/test_core.sh
    source: bash_unit-2.3.3/tests/test_core.sh
    description: "Core assertions and test runner behavior"
    command: "./bash_unit tests/test_core.sh"
  - file: tests/test_doc.sh
    source: bash_unit-2.3.3/tests/test_doc.sh
    description: "Documentation examples"
    command: "./bash_unit tests/test_doc.sh"
  - file: tests/test_tap_format
    source: bash_unit-2.3.3/tests/test_tap_format
    description: "TAP output format"
    command: "./bash_unit tests/test_tap_format"

test_package_tests:
  - file: test.sh
    description: "Consumer test invokes the packaged bash_unit executable"
    command: "bash test.sh"

assertion_count: 86
