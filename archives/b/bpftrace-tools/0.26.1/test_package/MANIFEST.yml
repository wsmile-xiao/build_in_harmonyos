package: bpftrace-tools/0.26.1
homepage: "https://github.com/bpftrace/bpftrace"

# 上游无针对 tools 子集的独立测试套件（仅 bpftrace 二进制有 tests/ 目录，含 gtest + runtime）
# tools/*.bt 为 .bt 脚本资源，依赖内核 eBPF 运行时，离线无可执行的 make check/ctest
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# 声明无上游测试（需审计字段，供 HMBS 校验）
upstream_tests_exist: false
upstream_test_audit: "审计时间 2026-09-07：解压 bpftrace-0.26.1.tar.gz，tools/ 含 47 个 *.bt（含 old/6 个），tools/CMakeLists.txt 仅 install(FILES ...) 无 test 目标；根 CMakeLists.txt 的 BUILD_TESTING 覆盖 src/tests 引擎测试（344+ 用例），与 tools 脚本无关；ci 中无针对 tools 的 make check/ctest 目标；发布包无自带测试脚本。确认 tools 子集确实无独立测试套件，仅能做静态校验。"

test_package_tests:
  - file: test.sh
    description: "静态校验 bpftrace-tools：统计工具数、核实核心工具存在与探针语法、非空检查"
    command: "bash test.sh <tools_dir>"

assertion_count: 7
