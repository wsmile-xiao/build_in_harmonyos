software: bpftrace-tools
display: "bpftrace-tools"
description: "bpftrace 官方精选工具集（.bt 脚本），提供 eBPF 观测能力"
category: system
homepage: "https://github.com/bpftrace/bpftrace"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯脚本资源包，无编译阶段，直接拷贝 tools/*.bt 到 share/bpftrace/tools"
    - "bpftrace 二进制本身需 LLVM/libbpf，不在本次分发范围，避免引入未发布依赖"
    - "package_id 清空，保证单一制品，避免 os/compiler 维度膨胀"
  common_dependencies: []

versions:
  "0.26.1":
    status: published
    build_date: "2026-09-07"
