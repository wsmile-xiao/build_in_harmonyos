# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bcc/0.37.0
homepage: "https://github.com/iovisor/bcc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（完整枚举见 notes.md 双口径台账：C++ 65 / Python 270 / Lua 58）
upstream_tests:
  - file: test_static
    source: tests/cc/test_static.c
    description: "C API 冒烟测试（单用例，需内核 BPF 支持，OHOS 平台不可运行）"
    command: "./test_static"
  - file: test_libbcc
    source: tests/cc/test_libbcc.cc + tests/cc/test_*.cc
    description: "C++ Catch 测试集（65 个 TEST_CASE，需内核 BPF，OHOS 平台首用例即失败）"
    command: "./test_libbcc"
  - file: test_clang.py
    source: tests/python/test_clang.py
    description: "Python 测试（84 个 test_，需内核 BPF + root，OHOS 平台不可运行）"
    command: "python3 test_clang.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用公开 C API（rw-engine 查询 + ELF 加载段遍历）"
    command: "./test_bcc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
