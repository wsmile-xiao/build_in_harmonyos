# test_package/MANIFEST.yml
# 上游官方测试声明文件（L0e 强制要求）

package: bandit/2.0.0
homepage: "https://github.com/banditcpp/bandit"

# 上游测试命令: bandit 上游自测 = 构建 bandit-specs 并运行
upstream_check_command: "cmake -S . -B build && make -C build bandit-specs && ./build/bin/bandit-specs --no-color --reporter=dots"

# conanfile.py build() 中未集成上游测试（header-only 配方；上游自测在本地适配验证阶段执行）
upstream_test_in_build: false
upstream_test_command: "./build/bin/bandit-specs --no-color --reporter=dots"

# 上游实际运行的测试程序: bandit-specs（specs/*.cpp + matchers/*.cpp，CMake GLOB 编译）
# 运行时注册 314 项 / 通过 310 / 跳过 4（xdescribe 硬跳过）/ 失败 0
# 注: 以下为代表性样本（8/28 文件）；完整 28 文件清点见 reports/test-ledger.md
upstream_tests:
  - file: specs/before_each_after_each.spec.cpp
    source: bandit-2.0.0/specs/before_each_after_each.spec.cpp
    description: "before_each/after_each 钩子行为"
    command: "./build/bin/bandit-specs"
  - file: specs/context.spec.cpp
    source: bandit-2.0.0/specs/context.spec.cpp
    description: "上下文栈行为"
    command: "./build/bin/bandit-specs"
  - file: specs/describe.spec.cpp
    source: bandit-2.0.0/specs/describe.spec.cpp
    description: "describe/describe_skip/xdescribe 行为"
    command: "./build/bin/bandit-specs"
  - file: specs/it.spec.cpp
    source: bandit-2.0.0/specs/it.spec.cpp
    description: "it 语句注册行为（86 处声明，含显式重载/mock 调用）"
    command: "./build/bin/bandit-specs"
  - file: specs/matchers/equal.cpp
    source: bandit-2.0.0/specs/matchers/equal.cpp
    description: "Equal 匹配器"
    command: "./build/bin/bandit-specs"
  - file: specs/matchers/contain.cpp
    source: bandit-2.0.0/specs/matchers/contain.cpp
    description: "Contain 匹配器"
    command: "./build/bin/bandit-specs"
  - file: specs/options.spec.cpp
    source: bandit-2.0.0/specs/options.spec.cpp
    description: "命令行选项解析"
    command: "./build/bin/bandit-specs"
  - file: specs/run.spec.cpp
    source: bandit-2.0.0/specs/run.spec.cpp
    description: "runner 运行行为"
    command: "./build/bin/bandit-specs"

# test_package 消费者用例（仅使用已安装公开头文件，编译链接运行）
test_package_tests:
  - file: test_bandit.cpp
    description: "消费者用例: 经 bandit::bandit 目标使用公开 API 的 BDD spec（3 条 it）"
    command: "./test_bandit --no-color --reporter=dots"

# 测试断言总数: 上游注册 314 项（通过 310 / 跳过 4）+ 消费者 3 项 + 鸿蒙专项 6 项
assertion_count: 323
