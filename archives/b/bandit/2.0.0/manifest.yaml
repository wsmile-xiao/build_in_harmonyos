version: "2.0.0"
software: bandit

# 编译状态: built(verify通过未upload) / published(verify通过+CI upload)
# PR 阶段（远端 CI upload 前）如实标注 built
status: built

build_date: "2026-09-19"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 GitHub 归档源（R39: 官方源）
  url: "https://github.com/banditcpp/bandit/archive/v2.0.0.tar.gz"

  # 官方 tag v2.0.0 tarball SHA-256
  sha256: "e86b7c60753d828149a42298152f807c8020f9905f410acb9e45d87f4ea22a5e"

  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  # 官方 tarball 不含 git submodule；snowhouse/cotire 按 v2.0.0 锁定 commit
  # 以官方源单独提供（snowhouse=34d4b6df…, cotire=d0eadcd2…）
  submodules:
    snowhouse:
      url: "https://github.com/joakimkarlsson/snowhouse/archive/34d4b6df949356bcc0814f976f015ebee6ced9b3.tar.gz"
      sha256: "71e4afddd2bf66fa14e96e3fb3e66edc1f9a233d56dab60482ca5b393a865a72"
    cotire:
      url: "https://github.com/sakra/cotire/archive/d0eadcd2a230a8701d5310e34cc45ea9d6649df2.tar.gz"
      sha256: "3fdb11de76f465dfa228c846e72f48fbe8d1bca119891076187d3b7ae6e67c89"

  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_CXX_FLAGS=-Wno-invalid-utf8"

  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 适配补丁:
# 0001-failure-formatter-virtual-dtor.patch
#   根因: bandit 2.0.0 抽象基类 failure_formatter 无虚析构，
#   被 libc++-ohos (SDK 26) 以 -Werror,-Wdelete-abstract-non-virtual-dtor 拦截
#   修复: 为 failure_formatter 增加 virtual ~failure_formatter()
patches_applied:
  - "0001-bandit-failure_formatters-failure_formatter.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "GitHub 官方 tarball 不含 git submodule，需按 tag 锁定 commit 以官方源补齐（bandit 2.0.0: snowhouse 34d4b6d, cotire d0eadcd）"
  - "CMake <3.5 兼容性已从 CMake 4.x 移除：老项目 cmake_minimum_required(2.8) 需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 或提升版本"
  - "旧版 C++11 头文件库在 libc++-ohos 下可能触发 -Wdelete-abstract-non-virtual-dtor：抽象基类缺虚析构属真实缺陷，加 virtual 析构即可"

