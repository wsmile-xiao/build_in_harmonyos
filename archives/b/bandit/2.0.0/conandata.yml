# conandata.yml — bandit 2.0.0
# 官方 GitHub 归档源（R39）。GitHub 官方 tarball 不含 git submodule，
# 因此 v2.0.0 锁定的 snowhouse submodule commit 以官方源单独声明，
# 解压到 bandit/assertion_frameworks/snowhouse（bandit.h 强依赖该头文件）。
# cotire（仅构建 bandit-specs 需要的 cmake 模块）不参与本 header-only 配方打包。

sources:
  - url: "https://github.com/banditcpp/bandit/archive/v2.0.0.tar.gz"
    sha256: "e86b7c60753d828149a42298152f807c8020f9905f410acb9e45d87f4ea22a5e"
  - url: "https://github.com/joakimkarlsson/snowhouse/archive/34d4b6df949356bcc0814f976f015ebee6ced9b3.tar.gz"
    sha256: "71e4afddd2bf66fa14e96e3fb3e66edc1f9a233d56dab60482ca5b393a865a72"
    destination: "bandit/assertion_frameworks/snowhouse"

patches:
  - patch_file: "patches/0001-bandit-failure_formatters-failure_formatter.h.patch"
    patch_description: "add virtual destructor to abstract base bandit::detail::failure_formatter (modern libc++ requires virtual dtor when deleting through base pointer; -Wdelete-abstract-non-virtual-dtor)"
    patch_type: "portability"
