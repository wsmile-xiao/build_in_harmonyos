# test_package/MANIFEST.yml
# 上游官方测试声明
# boxed-cpp 1.4.3 上游测试为单个 Catch2 v3 可执行 test-boxed-cpp（15 个 TEST_CASE），
# 由 test-boxed-cpp.cpp + CMake BOXED_TESTING=ON 驱动；依赖 Catch2 v3.4.0。

package: boxed-cpp/1.4.3
homepage: "https://github.com/contour-terminal/boxed-cpp"

upstream_check_command: "cmake -DBOXED_TESTING=ON .. && cmake --build . && ./test-boxed-cpp"

# conanfile.py build() 未集成上游 Catch2 测试（制品仓无 Catch2 v3，详见 notes.md / PR）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序（静态声明 15 个 TEST_CASE；OHOS clang15 libc++ 无 __cpp_lib_format，
# formatter 用例被上游条件编译排除，实跑 14 个全部通过）
upstream_tests:
  - file: test-boxed-cpp.cpp
    source: boxed-cpp-1.4.3/test-boxed-cpp.cpp
    description: "boxed-cpp 单元测试（Catch2 v3）：boxed/comparison/as/get/cast/unbox/算术/formatter 等 15 个 TEST_CASE"
    command: "./test-boxed-cpp"

# test_package 消费者测试（真实调用 boxed API 编译运行断言）
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：include boxed.hpp，构造 boxed 并调用 unbox/.as/boxed_cast/算术后断言"
    command: "./test_package"

assertion_count: 21
