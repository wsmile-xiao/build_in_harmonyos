# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: boost1.84-wserialization/1.84.0
homepage: "https://www.boost.org/libs/serialization/"

# 上游测试入口：b2 编译系统（OHOS 不兼容，E068），无法直接运行 B2 测试目标
upstream_check_command: "b2 libs/serialization/test"

# conanfile.py build() 手动编译上游 libs/serialization/src 的 46 个源文件
# （SOURCES + SOURCES_HAS_STD_WSTREAMBUF + WSOURCES，与 Jamfile.v2 定义一致）
upstream_test_in_build: false
upstream_test_command: ""

# 上游 serialization 测试集代表条目（b2 无法在 OHOS 运行，编译验证覆盖同一源集）
upstream_tests:
  - file: libs/serialization/src/text_wiarchive.cpp
    source: boost_1_84_0/libs/serialization/src/text_wiarchive.cpp
    description: "宽字符文本输入 archive（WSOURCES，本包编译产出）"
    command: "conan create"
  - file: libs/serialization/src/text_woarchive.cpp
    source: boost_1_84_0/libs/serialization/src/text_woarchive.cpp
    description: "宽字符文本输出 archive（WSOURCES，本包编译产出）"
    command: "conan create"
  - file: libs/serialization/src/xml_wiarchive.cpp
    source: boost_1_84_0/libs/serialization/src/xml_wiarchive.cpp
    description: "宽字符 XML 输入 archive（WSOURCES，本包编译产出）"
    command: "conan create"
  - file: libs/serialization/src/xml_woarchive.cpp
    source: boost_1_84_0/libs/serialization/src/xml_woarchive.cpp
    description: "宽字符 XML 输出 archive（WSOURCES，本包编译产出）"
    command: "conan create"
  - file: libs/serialization/src/basic_iarchive.cpp
    source: boost_1_84_0/libs/serialization/src/basic_iarchive.cpp
    description: "窄字符核心（SOURCES，wserialization 链接依赖）"
    command: "conan create"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_wserialization.cpp
    description: "宽字符 text/xml archive 往返序列化测试（std::wstring/vector/map，消费者视角）"
    command: "./test_wserialization"

# 断言计数：test_package 6 项核心校验（text 往返 id/name/scores/attrs + xml 往返 id/name/scores + 空输出校验）
assertion_count: 9
