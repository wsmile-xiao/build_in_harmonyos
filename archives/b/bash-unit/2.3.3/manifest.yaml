# bash-unit 2.3.3 适配清单
# bash_unit——纯 Bash 单元测试框架（单文件可执行 bash_unit——无编译）。
# 上游测试：./bash_unit tests/test_*（test_cli 18/test_core 30/test_tap_format 9
# = 57 用例本地实测全过）；test_doc.sh 硬编码 /tmp/$$（OHOS /tmp 只读——
# 系统级阻塞——未运行，如实记录）。OHOS 适配：toybox sed 不支持 -u——
# patch bash_unit 主脚本（-u 仅 unbuffered 性能优化——语义不变——不改测试用例）。

version: "2.3.3"
status: built

source:
  url: "https://github.com/bash-unit/bash_unit/archive/refs/tags/v2.3.3.tar.gz"
  sha256: "a2f76ddca88e2bef7c628c8cac6bf68b93a388fce143f6a4dc770fe1b3584307"
  tar_format: tar.gz

build:
  system: none
  notes: "纯 Bash 单文件可执行（bash_unit——无编译）；install.sh 仅为下载复制——配方直接复制 bash_unit 到 bin/"

patches_applied:
  - "bash_unit 主脚本：toybox sed 不支持 -u——'$SED' -u -e → '$SED' -e（-u 仅 unbuffered 性能优化——语义不变——不改任何测试用例）"

test:
  upstream_cases: 57
  upstream_suite: "./bash_unit tests/test_cli.sh tests/test_core.sh tests/test_tap_format（上游自带测试——test_doc.sh 硬编码 /tmp/$$——OHOS /tmp 只读系统级阻塞）"
  runnable: 57
  runnable_note: "上游 57 用例（cli 18 + core 30 + tap 9）本地实测全过；test_doc.sh 因 OHOS /tmp 只读（系统级阻塞）未运行——如实记录"
  pass_rate: "57/57（100%——可运行部分；test_doc 系统级阻塞未计入）"
  consumer_test: "test_package 验证 bin/bash_unit 存在 + 内联测试（assert_equals 1 1）真实执行 SUCCESS"

knowledge_gained:
  - "bash_unit 是纯 Bash 单元测试框架（单文件可执行）——上游自带 4 个测试文件（test_cli/test_core/test_doc/test_tap_format）"
  - "OHOS toybox sed 不支持 -u（--unbuffered）——bash_unit 主脚本第 452 行 '$SED' -u -e 报 Unknown option 'u'——去掉 -u（仅性能优化）语义不变"
  - "OHOS /tmp 只读（系统级阻塞）——test_doc.sh 硬编码 mkdir /tmp/$$——无法绕过——如实记录未运行"
