# 软件级 manifest
# 文件位置: archives/b/boolstuff/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: boolstuff
display: "BoolStuff"
description: "布尔表达式二叉树 C++ 库:解析 AND/OR/NOT 表达式并转换为析取范式(DNF),附 booldnf 命令行工具"
category: library
homepage: "http://sarrazip.com/dev/boolstuff.html"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 自带 config.guess(2016)不识别 HarmonyOS,需显式 --build/--host 指定 linux-gnu 三元组"
    - "configure/configure.ac 内含 Latin-1 字节,需转 UTF-8 以兼容 OHOS toybox sed"
    - "autoconf 2.69 生成脚本的临时目录 umask 077 与 OHOS HMMAC 冲突,需补丁改 022"
  common_dependencies: []

versions:
  "0.1.16":
    status: built
    build_date: "2026-09-05"
