sources:
  # Upstream home page (sarrazip.com) is dead as of 2026-09 (HTTPS fails,
  # HTTP 302 loops). Debian pool is the authoritative mirror; SHA-256 below
  # was cross-checked against boolstuff_0.1.16-1.dsc (Checksums-Sha256).
  url: "https://deb.debian.org/debian/pool/main/b/boolstuff/boolstuff_0.1.16.orig.tar.gz"
  sha256: "c07211da584eb78501a2838e4fe19ee284acb6989dd89db7f86f88c3fdb21e83"
patches:
  - patch_file: "patches/0001-ohos-autotools-compat.patch"
    patch_description: "OHOS autotools compatibility: convert Latin-1 config sources to UTF-8 (toybox sed regex fails on invalid UTF-8 bytes) and replace the autoconf-2.69 temp-dir umask 077 with 022 (OHOS HMMAC denies writes into 0700 directories even for the owner)"
    patch_type: "portability"
  - patch_file: "patches/0002-cpp17-noexcept.patch"
    patch_description: "Replace the 12 ISO C++17-invalid dynamic exception specifications throw(Error) with noexcept(false) (semantics preserved) so the library builds with -std=c++17 as required by the OHOS profile"
    patch_type: "portability"
