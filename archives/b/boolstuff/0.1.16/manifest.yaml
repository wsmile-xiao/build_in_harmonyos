# 版本级 manifest
# 文件位置: archives/b/boolstuff/0.1.16/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.16"
software: "boolstuff"
status: built
build_date: "2026-09-05"
build_system: "autotools"

source:
  url: "https://deb.debian.org/debian/pool/main/b/boolstuff/boolstuff_0.1.16.orig.tar.gz"
  sha256: "c07211da584eb78501a2838e4fe19ee284acb6989dd89db7f86f88c3fdb21e83"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--enable-shared"
    - "--disable-static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-autotools-compat.patch"
  - "0002-cpp17-noexcept.patch"

knowledge_gained:
  - "config.guess(2016) 无法识别 aarch64-HarmonyOS,需显式 --build/--host 三元组绕过 (reference: archives/b/boolstuff/0.1.16/notes.md)"
  - "toybox sed 对含非法 UTF-8 字节(Latin-1 高位)的行正则匹配失败,autoconf 2.69 AC_OUTPUT 报 could not make ./config.status;Latin-1→UTF-8 转换修复 (knowledge_ref: knowledge/drafts/DRAFT-E549-ohos-toybox-sed-invalid-utf8-configure.md)"
  - "autoconf AS_TMPDIR 的 umask 077 在 OHOS HMMAC 下拒写属已知问题,按既有知识 E129(HMDFS setgid + drwx--S---)以 umask 022 补丁修复,本包为该知识的新应用实例 (reference: knowledge/graph/E129.kv)"
  - "补丁改写 configure/configure.ac 后 mtime 触发 automake maintainer 重建链,missing fallback 用系统 autoconf 覆盖补丁;全依赖链(.m4/.am/.in/.ac 等)统一 pin 同一旧时间戳防御 (reference: archives/b/boolstuff/0.1.16/notes.md §1.6)"
  - "profile buildenv 的 CONFIG_SHELL=bash 聚合优先于配方 env;bash 下 ltmain.sh 2.4.2 生成 libtool 丢失引号转义致 syntax error near '}',build() 内命令行前缀赋值 CONFIG_SHELL=/bin/sh 修复 (knowledge_ref: knowledge/drafts/DRAFT-E551-ohos-conan-configshell-bash-libtool-escaping.md)"
  - "profile cppstd=17 注入 -std=c++17 后上游 throw(Error) 动态异常规范报错(默认 gnu++14 不触发);noexcept(false) 等价改写 (reference: archives/b/boolstuff/0.1.16/patches/0002-cpp17-noexcept.patch)"
  - "链接 libc++ 的共享库的 C API 消费者必须经 C++ 驱动链接,否则运行期 SIGTRAP(上游 checkc 用 force-cxx-linking.cpp 的原因) (reference: archives/b/boolstuff/0.1.16/test_package/conanfile.py)"
