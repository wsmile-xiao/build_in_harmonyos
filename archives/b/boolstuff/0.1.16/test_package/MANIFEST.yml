# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 统计口径(与最终设备日志一致):
#   上游测试单位 = 用例(case):
#     - check-test-cases.pl: test-cases.txt 中非注释非空行,每行 1 个用例(52)
#     - checkc: 1 个 C API 断言程序(程序级计数,内部约 50 条 assert)
#     - booldnf 行为断言: Makefile.am check 目标内 4 条 shell 断言
#       (--version 内容 / --help 退出码 / --unknown 退出码 1 / 空 stdin 空输出)
#     - test-regressions.pl: regressions.txt 中 "=> " 行,每行 1 个用例(60)
#   TOTAL = 117 = PASS 117 + FAIL 0 + SKIP 0 + NOT_RUN 0
#   取数命令:
#     grep -vE '^\s*(#|$)' src/boolstuff/test-cases.txt | wc -l   # 52
#     grep -cE '^(.*?)\s*=>\s+(.*?)$' src/commands/regressions.txt # 60
#     make check 日志: "Success." / "0 error(s) out of 60 tests"

package: boolstuff/0.1.16
homepage: "http://sarrazip.com/dev/boolstuff.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/boolstuff/checkdnf.cpp
    source: boolstuff-0.1.16/src/boolstuff/checkdnf.cpp
    description: "DNF 转换驱动程序,由 check-test-cases.pl 通过双向管道喂入 test-cases.txt 的 52 个用例"
    command: "perl check-test-cases.pl ./checkdnf test-cases.txt"
  - file: src/boolstuff/checkc.c
    source: boolstuff-0.1.16/src/boolstuff/checkc.c
    description: "C API 断言测试程序(建树/打印/DNF/克隆/解析/错误码)"
    command: "./checkc"
  - file: src/commands/booldnf.cpp
    source: boolstuff-0.1.16/src/commands/booldnf.cpp
    description: "booldnf 命令行为断言(--version/--help/--unknown/空 stdin),Makefile.am check 目标内 4 条 shell 断言"
    command: "make check (src/commands)"
  - file: src/commands/test-regressions.pl
    source: boolstuff-0.1.16/src/commands/test-regressions.pl
    description: "booldnf 回归测试驱动,通过双向管道验证 regressions.txt 的 60 个用例"
    command: "perl test-regressions.pl regressions.txt ./booldnf"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_parser.cpp
    description: "C++ API 消费者:解析/DNF 转换/DNF 项与变量检查/解析错误异常,运行时 23 项实质断言(实测输出 23 checks, 0 failures),退出码=失败数"
    command: "./test_parser"
  - file: test_c_api.c
    description: "C API 消费者:手工建树/打印/DNF/克隆/解析/错误码/契约语义,assert 断言(以 C++ 驱动链接,与上游 checkc 一致)"
    command: "./test_c_api"
  - file: test_package/conanfile.py
    description: "booldnf 命令行为验证:--version 输出与 DNF 转换输出 grep 精确匹配,2 项断言"
    command: "booldnf --version; echo ... | booldnf"

# 测试断言总数 (近似值, 用于质量评估)
# 口径: 上游 117 用例(52+1+4+60) + test_package 55 项
# (test_parser.cpp 运行时 23 项 check + test_c_api.c 30 条 assert + booldnf 2 项 grep)
assertion_count: 172
