# 版本级 manifest — brpc 1.17.0
# 文件位置: archives/b/brpc/1.17.0/manifest.yaml

version: "1.17.0"
software: "brpc"
status: built
build_date: "2026-09-02"
build_system: "cmake"

source:
  url: "https://github.com/apache/brpc/archive/refs/tags/1.17.0.tar.gz"
  sha256: "ce4b9f57030c1c24593a6a7397373704b2192521f08741eba132dcba6153214f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_UNIT_TESTS=OFF"
    - "-DBUILD_FUZZ_TESTS=OFF"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DWITH_SNAPPY=ON"
    - "-DWITH_THRIFT=OFF"
    - "-DWITH_GLOG=OFF"
    - "-DWITH_BTHREAD_TRACER=OFF"
    - "-DWITH_RDMA=OFF"
    - "-DDOWNLOAD_GTEST=OFF"
  dependencies:
    - "protobuf/33.6"
    - "abseil-cpp/20260107.1"
    - "gflags/2.2.2"
    - "leveldb/1.23"
    - "openssl/3.5.6"
    - "zlib/1.3.1"
    - "snappy/1.2.2"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-libc-compat.patch"
  - "0002-test-compat.patch"

knowledge_gained:
  - "bthread 协程 aarch64 上下文切换汇编内嵌在 src/bthread/context.cpp（__asm），OHOS musl 上 __linux__ 判定成立，走 linux_arm64 路径无需补丁"
  - "protobuf/33.6 (cmake_find_mode=none) 需显式注入 Protobuf_DIR/utf8_range_DIR/absl_DIR，与 grpc 配方同源"
  - "brpc CMake 构建内置 -DNO_TCMALLOC，不依赖 gperftools；thrift 不在仓用 WITH_THRIFT=OFF"
  - "OHOS 共享库无 SONAME 需 patchelf 补 + binary-sign-tool 自签（同 gflags 配方）"
