# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: brpc/1.17.0
homepage: "https://github.com/apache/brpc"

# 上游测试命令（brpc 上游单测为 gtest 二进制，test/CMakeLists.txt + run_tests.sh）
upstream_check_command: "cd build && ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试（本配方 CI 构建不跑上游单测，
# 上游单测在本地以 BUILD_UNIT_TESTS=ON 单独构建统计，见 reports/test-report.md）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（代表性套件，完整清单见 reports/test-report.md）
upstream_tests:
  - file: test/brpc_server_unittest.cpp
    source: test/brpc_server_unittest.cpp
    description: "brpc::Server 生命周期与 Start/Stop 测试"
    command: "./brpc_server_unittest"
  - file: test/brpc_channel_unittest.cpp
    source: test/brpc_channel_unittest.cpp
    description: "brpc::Channel RPC 调用往返测试"
    command: "./brpc_channel_unittest"
  - file: test/bthread_futex_unittest.cpp
    source: test/bthread_futex_unittest.cpp
    description: "bthread futex 同步原语测试"
    command: "./bthread_futex_unittest"

# test_package 中自带的测试（消费者视角：brpc::Server + Channel RPC 往返）
test_package_tests:
  - file: test_brpc.cpp
    description: "创建 brpc::Server 注册 EchoService，用 brpc::Channel 做 RPC 往返并校验回包"
    command: "./test_brpc"

# 测试断言总数（近似值，test_package 含 1 个 RPC 往返断言）
assertion_count: 1
