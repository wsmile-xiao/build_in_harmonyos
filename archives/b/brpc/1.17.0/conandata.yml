sources:
  url: "https://github.com/apache/brpc/archive/refs/tags/1.17.0.tar.gz"
  sha256: "ce4b9f57030c1c24593a6a7397373704b2192521f08741eba132dcba6153214f"

patches:
  - patch_file: "patches/0001-libc-compat.patch"
    patch_description: "libc 可移植性（零平台宏，全 POSIX/通用接口）：compat.h/bthread errno.h 显式 include sys/cdefs.h；errno.cpp 按 POSIX XSI 语义用 strerror_r（glibc 判定走 __GLIBC__）；time.cpp 保留 _GNU_SOURCE 使 CLOCK_* 可见；bthread errno.cpp 绕过 clang 模板常量限制；task_control.cpp 非 glibc 用 sched_setaffinity+pthread_gettid_np；rpcz_service.cpp 用 POSIX mktime 替代 glibc 扩展 timelocal；global.cpp 移除 glibc 特有 malloc_trim；pprof_service.cpp 用 /proc/self/cmdline 替代 glibc 全局 program_invocation_name"
    patch_type: "portability"
  - patch_file: "patches/0002-test-compat.patch"
    patch_description: "上游单测适配（CI 不构建单测，本地全量测试用）：C++17 移除的 random_shuffle 换 std::shuffle；protobuf 33 删除的头/宏等价替代；test/CMakeLists 保留注入 flags 并强制 C++17"
    patch_type: "portability"
