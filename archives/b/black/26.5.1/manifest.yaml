software: black
# 版本级 manifest
# 文件位置: archives/b/black/26.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "26.5.1"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: pip

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/psf/black/archive/refs/tags/26.5.1.tar.gz"
  sha256: "d77ef413366477e58d7693c2467e137ca8e7f7a545b1a4da1973a2ef09f66409"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: pip
  configure_options:
    - "pip_install"
    - "SETUPTOOLS_SCM_PRETEND_VERSION=26.5.1"
  dependencies:
    - python3/3.12.9
    - pip/26.1.2
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "GitHub tarball 缺少 git 元数据，需要 SETUPTOOLS_SCM_PRETEND_VERSION 环境变量 (ref: E041)"
  - "black 使用 hatch-vcs 版本管理，src/_black_version.py 在 tarball 中缺失需手动创建 (ref: E050)"
  - "纯 Python CLI 包需将运行时依赖（click 等 6 个）用 pip install --target 一并打进 site-packages，否则 bin wrapper 在无全局 pip 依赖的环境报 ModuleNotFoundError (ref: E077)"
