software: black
# 版本级 manifest
# 文件位置: archives/b/black/26.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "26.5.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-13"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/psf/black/archive/refs/tags/26.5.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: pip
  configure_options:
    - "pip_install"
    - "SETUPTOOLS_SCM_PRETEND_VERSION=26.5.1"
  dependencies:
    - python3/3.12.8
    - pip/24.3.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-src-_black_version.py.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "GitHub tarball 缺少 git 元数据，需要 SETUPTOOLS_SCM_PRETEND_VERSION 环境变量 (ref: E041)"
  - "black 使用 hatch-vcs 版本管理，src/_black_version.py 在 tarball 中缺失需手动创建 (ref: E050)"
  - "纯 Python 项目，使用 pip --target 安装到 staging 目录 (ref: E077)"
