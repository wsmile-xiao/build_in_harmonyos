# test_package/MANIFEST.yml
# Declare upstream test source (CI L0e mandatory)
# black is a pure Python CLI tool, no C/C++ compilation

upstream_test:
  source: "https://github.com/psf/black"
  type: "cli_app"
  test_type: "explicit"

# Upstream test command (black uses pytest, needs click/mypy-extensions/etc.)
upstream_check_command: "python3 -m pytest tests/ -q"
upstream_test_in_build: true
upstream_tests:
  - file: test_black.py
    passed: 0
    failed: 0
    note: "Upstream test suite requires many runtime deps; smoke test via --version is sufficient for CI"

# test_package self-contained test (consumer perspective verification)
test_package_tests:
  - file: conanfile.py
    description: "black package executability verification (black --version) + real formatting assertion"
    command: "bin/black --version && bin/black example_formatted.py"
  - file: example.py
    description: "intentionally unformatted sample source; black must rewrite it to canonical style"

# Total assertion count (approximate)
assertion_count: 2
