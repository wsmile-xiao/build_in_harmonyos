software: bruteforce-luks
display: "bruteforce-luks"
description: "Try to find the password of a LUKS encrypted volume"
category: security
homepage: "https://github.com/glv2/bruteforce-luks"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub tag 归档不含 configure，需先跑 autogen.sh 生成"
    - "硬依赖系统 libcryptsetup（configure 探测；无 Conan 包，不声明 requires，缺库时 build() 探针报 R36 下一步）"
    - "mktemp wrapper 规避 HMDFS 组权限坑（沿用 bash/5.3 方案）"
  common_dependencies: []

versions:
  "1.4.0":
    status: built
    build_date: "2026-09-10"
