# test_package/MANIFEST.yml — bruteforce-luks 1.4.0
# 上游官方测试声明文件（CI L0e 硬门禁要求存在）

package: bruteforce-luks/1.4.0
homepage: "https://github.com/glv2/bruteforce-luks"

# 上游测试存在性审计
# 审计结论：bruteforce-luks 1.4.0 上游无正式测试套件。
upstream_tests_exist: false
upstream_test_audit: |
  审计 bruteforce-luks 1.4.0 上游（glv2/bruteforce-luks tag 1.4.0，
  commit a18694abcca8a310f18b7a842f5c48d6b21c064f）：
  1. tag 归档文件清单无 tests/ 目录（仅 AUTHORS/COPYING/ChangeLog/INSTALL/
     Makefile.am/NEWS/README/README.md/autogen.sh/configure.ac/contrib/
     doc/bruteforce-luks.1/src/bruteforce-luks.c/src/version.h）。
  2. 1.4.0 的 Makefile.am 仅 bin_PROGRAMS + dist_man_MANS，无 TESTS、无 SUBDIRS。
  3. 1.4.0 的 configure.ac 仅 AC_CONFIG_FILES(Makefile)，无 tests/Makefile。
  4. 上游测试（tests/crack-volume1~3.sh + volume*-header）系 1.4.0 之后
    （1.4.1/master）新增，本版本不存在，不回填高版本测试。
  结论：上游 1.4.0 确无测试，按 no_tests 处理。

# 上游测试命令（无测试套件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
# 应用包无可链接库，用 POSIX sh 脚本真实执行已安装二进制并校验输出
# （bzip2/1.0.8 先例：test.sh + self.run）；不经过 CMake 编译
# （CMakeToolchain 在部分真机上因 profile 绝对编译器路径不可用而
# configure 失败）。test() 经 self.run() 调用该脚本（满足 L0d）。
test_package_tests:
  - file: test_package/test_bruteforce_luks.sh
    description: "真实执行 bruteforce-luks 二进制：-h 输出校验含 Usage/LUKS、无参调用校验含 Usage，共 2 断言"
    command: "sh test_bruteforce_luks.sh <bin/bruteforce-luks>"
  - file: test_package/conanfile.py
    description: "经 self.run() 调用 test_bruteforce_luks.sh 并输出 HMBS 双标记"
    command: "self.run sh test_bruteforce_luks.sh"

# 测试断言总数
assertion_count: 2
