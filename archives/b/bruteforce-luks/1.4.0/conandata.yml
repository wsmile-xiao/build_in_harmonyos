# conandata.yml — bruteforce-luks 1.4.0
# Official upstream sources only. CI mirror fallback
# (ci/conan/build_and_test.sh) auto-adds mirrors at build time;
# committing a proxy URL violates the PF7 source-URL gate.
#
# cryptsetup entry (header-half supply, cycle-10): the preflight/CI
# machines ship no system libcryptsetup (cycles 6-9 evidence). This is
# the OFFICIAL upstream release tarball from kernel.org; the sha256 is
# taken from the PGP-signed
# https://www.kernel.org/pub/linux/utils/cryptsetup/v2.7/sha256sums.asc
# (cryptsetup-2.7.2.tar.gz row). Only the verbatim public header
# lib/libcryptsetup.h is consumed at build time (see source()); no
# hand-written declarations, no stub.

sources:
  bruteforce-luks:
    url: "https://github.com/glv2/bruteforce-luks/archive/refs/tags/1.4.0.tar.gz"
    sha256: "1bbca147973b58a40adec2ef092832236cf1110bf3a0722b44101f98bed66a51"
  cryptsetup:
    url: "https://www.kernel.org/pub/linux/utils/cryptsetup/v2.7/cryptsetup-2.7.2.tar.gz"
