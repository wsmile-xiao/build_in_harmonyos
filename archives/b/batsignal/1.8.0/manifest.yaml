# batsignal 1.8.0 适配清单
# batsignal 是轻量电池守护进程（C 语言，.POSIX make 构建）——监听
# /sys/class/power_supply 电池状态，低电量/充满时用 libnotify 发桌面通知。
# 依赖：libnotify/0.8.3（制品仓已发布）+ libm（系统自带）。

