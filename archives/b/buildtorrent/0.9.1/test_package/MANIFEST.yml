# test_package/MANIFEST.yml — buildtorrent 0.9.1 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 上游无测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）

package: buildtorrent/0.9.1
homepage: "https://mathr.co.uk/web/buildtorrent.html"

upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "buildtorrent-0.9.1.tar.gz（mathr 官方发布包，sha256=ca7b2315dbfdb098f608af556eb80de88f989aeae18e49f105adb5b0f6b72937）"
    finding: "顶层 26 个文件：buildtorrent.c、md5.c/md5.h、sha1.c/sha1.h、configure.ac、Makefile.am、configure、config.guess/sub 等；无 tests/、test/ 目录，无任何 *test* 源文件"
  - path: "Makefile.am"
    finding: "仅定义 bin_PROGRAMS=buildtorrent、man_MANS=buildtorrent.1、buildtorrent_SOURCES（含 5 个源码文件）；无 TESTS、check_PROGRAMS、TESTS_ENVIRONMENT 等 automake 测试变量"
  - path: "Makefile.in（automake 1.16.5 生成）"
    finding: "含 automake 标准 check/check-am 空目标桩，无任何测试编译或执行逻辑；make -n check 仅回显无操作"
  - path: "configure.ac"
    finding: "仅含 AC_INIT/AC_PROG_CC/AC_HEADER_DIRENT/AC_C_CONST/AC_C_BIGENDIAN/AC_TYPE_SIZE_T 等构建检测；无 AC_CHECK_PROGS 测试接线，无测试输出文件"
  - path: "README/NEWS/ChangeLog/待办清单与 filelist.ex"
    finding: "仅描述 ./configure && make && make install 构建流程与 --help/man 用法；待办清单仅列多线程/哈希库等未来特性，无测试入口；filelist.ex 为 --filelist 输入格式示例，非测试"
  - path: "Debian buildtorrent 打包（salsa.debian.org/debian/buildtorrent）"
    finding: "debian/rules 仅执行构建与安装，同样未运行任何上游测试，佐证上游无可接入的测试套件"

test_package_tests:
  - file: test_buildtorrent.sh
    description: "消费者功能测试：真实执行 bin/buildtorrent 完成 5 项内容级验证——--version 版本号、--help 用法输出、单文件 torrent 生成（含 announce/info/pieces 等 bencode 字段与非空校验）、确定性字段复现（-D/-B/-d）、magnet 链接输出（R34 合规）"
    command: "<shell> test_buildtorrent.sh（BUILDTORRENT_BIN 指向包内 bin/buildtorrent）"

assertion_count: 5
