software: buildtorrent
display: "buildtorrent"
description: ".torrent 文件生成命令行工具，支持单文件/目录、trackerless、DHT 节点与 magnet 链接"
category: system
homepage: "https://mathr.co.uk/web/buildtorrent.html"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "无外部依赖的单程序 Autotools 工具（bin_PROGRAMS），默认即静态语义"
    - "2022 年版 config 脚本早于 HarmonyOS，用 portable GNU build/host triplets 过 configure 平台识别"
    - "HMDFS 会剥离 configure 可执行位，build() 内先 chmod 恢复再 configure"
  common_dependencies: []

versions:
