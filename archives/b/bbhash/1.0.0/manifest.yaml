# 版本级 manifest — bbhash 1.0.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 软件名
software: "bbhash"

# 编译状态（PR 阶段为 built；CI 上传制品成功后由发布流程置 published）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: "none"   # header-only 单头文件库，无 configure/cmake/makefile 库构建

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub archive 端点）
  url: "https://github.com/rizkg/BBHash/archive/refs/tags/v1.0.0.tar.gz"

  # 源码校验和
  sha256: "1721e3b1afe915a6cbec6a578dfd9a2226f2dabd73fcc8e7cef00085e158480c"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（header-only，无库编译；上游 makefile 仅构建测试/样例程序）
  system: none

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）— 无外部依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-BooPHF.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS（musl 系 libc）不传递提供 BSD 遗留 typedef u_int64_t，需显式 #include <sys/types.h>（glibc 经 unistd.h 等传递引入）"

patch_generation:
  method: refresh-patch-auto
  patches_count: 1

patch_classification:
  - file: 0001-BooPHF.h.patch
    type: portability
    platform_only: false        # 普适 POSIX 修复（加 <sys/types.h>），非平台宏
    guard: 'resolved'
