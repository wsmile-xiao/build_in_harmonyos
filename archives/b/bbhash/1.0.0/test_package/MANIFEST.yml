# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bbhash/1.0.0
homepage: "https://github.com/rizkg/BBHash"

# 上游测试命令 (makefile 的 test target)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "./Bootest 10000 1 2 -check"

# 上游实际运行的测试程序
upstream_tests:
  - file: bootest.cpp
    source: bbhash-1.0.0/bootest.cpp
    description: "Bootest 正确性验证（make test: ./Bootest 10000 1 2 -check，构造 MPH 并核验唯一映射）"
    command: "./Bootest 10000 1 2 -check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：仅通过公开头文件 BooPHF.h 构造 10 万个 key 的 minimal perfect hash 并核验全部 lookup 唯一"
    command: "./test_bbhash"
  - file: ohos_test.cpp
    description: "鸿蒙专项测试：-Werror 严格编译 + 4 线程 pthread 构造 + save/load 流往返一致"
    command: "./test_bbhash_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 100000