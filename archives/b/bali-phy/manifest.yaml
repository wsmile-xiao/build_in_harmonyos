software: bali-phy
display: "bali-phy"
description: "BAli-Phy - joint Bayesian estimation of alignment and phylogeny"
category: bioinformatics
homepage: "https://www.bali-phy.org/"
license: GPL-2.0
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson (>=1.1, C++20) 构建；OHOS/aarch64 + musl + clang 15 实测可用"
    - "ohpcd boost 配方不安装 Boost.JSON/uuid/convert/rational/compute 头：patches/boost-extra 逐字 vendor 183 个头文件（BSL-1.0，无 OHOS/musl 修改）"
    - "dlopen 的 builtins 模块需主程序导出 Box<T> typeinfo（0003 RTTI 注入，对应上游 issue #23，官方 4.2 才修）"
    - "libc++15 缺 std::string/vector/variant 的 <=>（0002 补丁提供等价实现）"
    - "29 个 builtins 共享模块须经 OHOS binary-sign-tool selfSign 签名后方可 dlopen"
    - "运行期自包含：boost/fmt 共享库随包拷贝，可执行文件设 $ORIGIN/../lib DT_RUNPATH"
  common_dependencies:
    - boost
    - eigen
    - fmt
    - cereal

versions:
  "4.1":
    status: built
    build_date: "2026-08-29"
    conan_ref: "bali-phy/4.1"
