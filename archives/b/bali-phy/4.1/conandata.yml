patches:
  "4.1":
    - patch_file: "patches/0001-meson-add-boost-json-src.patch"
      patch_description: "0001 add src/util/boost-json-src.cc (Boost.JSON header-only src.hpp TU) and register it in libutil_sources (linked by every executable and builtins module)"
      patch_type: "portability"
    - patch_file: "patches/0002-spaceship-libcxx15.patch"
      patch_description: "0002 portability: provide string/vector/variant three-way comparisons for libc++ 15 (OHOS clang 15 lacks std::<=> for these types, added in LLVM 17); restore the operator== that a defaulted <=> would have synthesized (Pattern/Alts/Constant/integer_container)"
      patch_type: "portability"

    - patch_file: "patches/0003-rtti-typeinfo-inject.patch"
      patch_description: "0003 RTTI typeinfo injection (user decision A): explicitly instantiate every Box<T> that the builtins .so modules define but the main executable does not, in a TU registered in baliphy_sources; with export_dynamic the main executable then exports these typeinfo symbols and musl unifies cross-module RTTI so dlopen dynamic_cast works (upstream issue #23 aarch64)"
      patch_type: "portability"
