# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# ⚠️ 如实声明测试来源：上游 baitfisher 1.2.7-git20211020.de26d5c【无随
# 快照发布的独立测试程序】（makefile 构建，无 tests/ 目录；BaitFisher 为
# CLI 程序，需输入文件运行）。本包测试均为 OHOS 适配自研（见下方
# test_package_tests）。

package: baitfisher/1.2.7-git20211020.de26d5c
homepage: "https://github.com/ZhianWang/BaitFisher"

# 上游官方测试：无独立测试程序（已核实：上游仓库无 tests/ 目录，
# 仅有 examples 示例数据）
upstream_official_tests: []

# 构建阶段执行的测试命令：上游 makefile 无 test 目标（纯构建）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 适配补全测试（自研，非上游）：无（消费者验证集中在 test_package）
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test.c
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：编译 test.c 运行（L0c 载体）；检查包内 BaitFisher-v1.2.8/BaitFilter-v1.0.6 可执行存在；BaitFisher 无参数运行输出 Usage（需输入文件，非零退出码属正常，断言可执行可用）"
    command: "./test_baitfisher"

# 测试断言总数 (实际统计：3 项断言，全部为适配自研断言：
# test.c 运行成功、BaitFisher 可执行存在、BaitFilter 可执行存在)
assertion_count: 3
