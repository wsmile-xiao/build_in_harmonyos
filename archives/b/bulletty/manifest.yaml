software: bulletty
display: "bulletty"
description: "a pretty TUI feed reader (RSS+ATOM) that stores articles locally as Markdown files"
category: net
homepage: "https://github.com/crocidb/bulletty"
license: MIT
build_system: cargo

ohos_adaptation:
  key_points:
    - "Pure Rust Cargo project, edition 2024, rust-version 1.90"
    - "Defaults to aarch64-unknown-linux-ohos on OHOS, overridable via RUST_TARGET"
    - "OHOS fallback uses checksum-pinned Harmonybrew Rust 1.97.1, OpenSSL, zlib, and CA bottles"
    - "reqwest TLS backend switched from default rustls (aws-lc-sys builds incompletely on OHOS cross-compile) to native-tls-vendored reusing the already-vendored OpenSSL"
  common_dependencies: []

versions:
  "0.2.2":
    status: built
    build_date: "2026-09-08"
    conan_ref: "bulletty/0.2.2"