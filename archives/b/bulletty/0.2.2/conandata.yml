sources:
  url:
    - "https://github.com/crocidb/bulletty/archive/refs/tags/v0.2.2.tar.gz"
  sha256: "e13b5743ee66a1d62c87f1ffa791a0c290d031fbb5d9363ce2c1e81cda25682d"

patches:
  "0.2.2":
    - patch_file: "patches/0001-Cargo.lock.patch"
      patch_description: "Cargo.lock: remove rustls/aws-lc-sys crates and add tokio-native-tls/hyper-tls/native-tls after switching reqwest TLS backend"
      patch_type: "portability"
    - patch_file: "patches/0002-Cargo.toml.patch"
      patch_description: "reqwest: switch default rustls backend (aws-lc-sys does not cross-compile completely on OHOS) to native-tls-vendored reusing vendored OpenSSL"
      patch_type: "portability"

# Used only when the OHOS runner image does not provide cargo/rustc.
# NOTE: openssl3 + zlib bottles are REQUIRED even with vendored OpenSSL in the
# app, because the Harmonybrew cargo/rustc binaries themselves link the standard
# libcrypto.so/libssl.so/libz.so at load time (OHOS system *_z.so are not the
# standard ABI — CI hit "EVP_aes_128_cbc: symbol not found" without them).
rust_toolchain:
  - name: rust
    url: "https://harmonybrew.atomgit.com/bottles/rust-1.97.1.arm64_ohos.bottle.tar.gz"
    sha256: "21b135fd7f403d08752a0fcc2bac70ee9a79909ad0e05e7c3ebbdd9afa66525e"
  - name: openssl3
    url: "https://harmonybrew.atomgit.com/bottles/openssl%403-3.6.3.arm64_ohos.bottle.tar.gz"
    sha256: "f773ba9053a6ac7ecf6b5d56e78d24d8386d60327f1f184d11132e965254d285"
  - name: zlib
    url: "https://harmonybrew.atomgit.com/bottles/zlib-ng-compat-2.3.3_1.arm64_ohos.bottle.tar.gz"
    sha256: "1c17a31f8104701bce6b471af8dbbd14bb67d16a504eec087018feb05493a430"
  - name: ca-certificates
    url: "https://harmonybrew.atomgit.com/bottles/ca-certificates-2026-08-13.arm64_ohos.bottle.tar.gz"
    sha256: "2916654bf828a59e1fd9862299300b48c1e5e7cb09fef279d4f78aaf066cd006"
