knowledge_gained:
  - "bulletty 0.2.2 is a Rust TUI feed reader (rasatui/crossterm) built with cargo, one binary bin/bulletty, no Conan deps."
  - "reqwest 0.13 default-tls maps to rustls; its aws-lc-sys (BoringSSL) crate fails OHOS cross-compile with missing EVP_*/EC_KEY_* symbols. Switching to features=[\"blocking\",\"native-tls-vendored\",\"charset\",\"http2\",\"system-proxy\"] reuses the already-vendored OpenSSL and builds cleanly."
  - "OHOS runner image has no Rust/Cargo; four SHA256-pinned Harmonybrew arm64_ohos bottles (rust/openssl3/zlib/ca-certificates) provide an isolated fallback."
  - "The Harmonybrew cargo wrapper is repaired to execute local cargo.real; CA bundle resolved for both preinstalled and fallback toolchains."
  - "Temporary Cargo config uses rsproxy sparse registry with retry/timeout/cainfo and OHOS clang linker."
  - "Upstream has 73 #[test] cases inside src/ (feedparser/feedutils/html/feedlibrary/tuimarkdown/readerscreen); `cargo test --release --target aarch64-unknown-linux-ohos --locked` passes 73/73 on OHOS cross-build."
