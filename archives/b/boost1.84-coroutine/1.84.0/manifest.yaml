software: boost1.84-coroutine
version: 1.84.0
status: built
build_system: custom-manual-compile
configure_options: []
build_options:
  - "CXXFLAGS: -std=c++17 -stdlib=libc++ -fPIC -O2 -DNDEBUG"
  - "DEFINES: BOOST_ALL_NO_LIB BOOST_CONTEXT_SOURCE BOOST_COROUTINE_SOURCE BOOST_COROUTINES_SOURCE BOOST_CONTEXT_STATIC_LINK BOOST_COROUTINE_STATIC_LINK"
  - "Boost.Context ASM: libs/context/src/asm/make_arm64_aapcs_elf_gas.S + jump_ + ontop_ + posix/stack_traits.cpp -> libboost_context.a (llvm-ar rcs)"
  - "Boost.Coroutine: libs/coroutine/src/detail/coroutine_context.cpp + exceptions.cpp + posix/stack_traits.cpp -> libboost_coroutine.a (llvm-ar rcs)"
dependencies: []
knowledge_gained:
  - Boost.Coroutine 的编译产物仅 3 个 .cpp；其 fcontext 依赖由 Boost.Context ASM (arm64_aapcs_elf_gas.S 三件套) 提供，OHOS aarch64 与 Linux 同属 elf/aapcs/gas，无需额外适配
  - B2 在 OHOS 不兼容 (E068)，手动编译上述翻译单元即可产出完整组件；clang 直接处理 .S 汇编
  - 上游 coroutine 测试 (2 项) 原用 boost.test 链接库，改为 included/unit_test.hpp 单头全实现以避免编译 boost_test
  - coroutine 的 stack_traits 在 context 与 coroutine 各有一份 (posix)，需分别编译避免符号缺失
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题)
issues:
  - "无：上游 2 项测试在 OHOS aarch64 全部通过"
compilation_date: 2026-09-05
compiler: clang
platform: OpenHarmony
notes: Boost.Coroutine 独立组件包，供下游以 boost1.84-coroutine/1.84.0 精确依赖；内含 Boost.Context fcontext 静态库 (make/jump/ontop ASM) 与全量 boost 头文件
