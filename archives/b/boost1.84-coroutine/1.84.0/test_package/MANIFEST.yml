package: boost1.84-coroutine/1.84.0
homepage: https://www.boost.org/doc/libs/1_84_0/libs/coroutine/

# 上游测试说明
# Boost 自带的 B2 构建系统在 OHOS 不兼容（SHELL 执行机制失败，E068），
# 无法直接使用 b2 运行上游测试。本适配通过手动编译 libs/coroutine/test/
# 下的官方测试源文件绕过 b2，在 OHOS 环境真实运行（头文件的 included
# boost.test 单头实现，无需链接 boost_unit_test_framework）。
# 上游 Jamfile 定义的 2 个 run 目标全部编译运行，均通过。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/coroutine/test/test_asymmetric_coroutine.cpp"
    description: "boost.coroutine 非对称协程主测试（push/pull、迭代器、异常、栈展开等 20+ 用例，实测 PASS）"
    command: "clang++ test_asymmetric_coroutine.cpp -lboost_coroutine -lboost_context && ./a.out"
    result: passed
  - file: "libs/coroutine/test/test_symmetric_coroutine.cpp"
    description: "boost.coroutine 对称协程测试（call/yield、栈属性等，实测 PASS）"
    command: "clang++ test_symmetric_coroutine.cpp -lboost_coroutine -lboost_context && ./a.out"
    result: passed

test_package_tests:
  - file: test_boost_coroutine.cpp
    description: "boost1.84-coroutine: asymmetric pull/push 数值与字符串传递 + symmetric call/yield + 栈分配器 + protected_stack_allocator + 异常捕获 + 迭代器（7 组断言）"
    command: "ctest boost_coroutine_test"

assertion_count: 7  # test_package 实际断言组数；上游 2 项测试（约 60+ BOOST_CHECK）见 upstream_tests
