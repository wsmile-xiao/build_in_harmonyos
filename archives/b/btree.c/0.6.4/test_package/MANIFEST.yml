# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: btree.c/0.6.4
homepage: "https://github.com/tidwall/btree.c"

# 上游测试命令 (tests/run.sh 编译并运行 test_btree.c + test_clone.c)
upstream_check_command: "tests/run.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_btree.c
    source: btree.c-0.6.4/tests/test_btree.c
    description: "btree.c 上游测试：btree_set/get/delete/load/ascend/descend 等主流程断言"
    command: "./test_btree.c"
  - file: test_clone.c
    source: btree.c-0.6.4/tests/test_clone.c
    description: "btree.c 上游测试：btree_clone 写时复制 (copy-on-write) 行为断言"
    command: "./test_clone.c"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：btree_new/set/get/ascend 公开 API 业务模拟验证"
    command: "./test_btree.c"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 24
