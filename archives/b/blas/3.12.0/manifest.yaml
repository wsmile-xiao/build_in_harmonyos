software: "blas"
version: "3.12.0"
status: "passed"
build_date: "2026-09-09"
build_system: "cmake"

source:
  url: "https://www.netlib.org/blas/blas-3.12.0.tgz"
  sha256: "ccc41b5d088e50db0030317ae9b0c9af375710c1392acad1fe209602da5a5aad"
  tar_format: "tar.gz"

build:
  system: "cmake"
  configuration: "static reference BLAS, all four precisions, OHOS armv8"
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DLAPACK_VERSION=3.12.0"
    - "-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY"
  dependencies:
    - "flang-ohos/20.1.0 (tool_requires)"
  cc: "clang"
  fortran: "flang"

patches_applied: []

knowledge_gained:
  - "Netlib provides a standalone BLAS-3.12.0.tgz archive with an upstream CMake build and 163 real Fortran source files; the archive also contains macOS ._ metadata entries."
  - "The library has no third-party dependency and does not install public C/C++ headers; consumers use the standard Fortran symbols such as ddot_ and dgemm_."
  - "OHOS native compilation needs flang-ohos/20.1.0 and its FortranRuntime/FortranDecimal archives in the consumer link interface."
  - "The upstream TESTING tree contains 12 Fortran executables; it remains pending until a native device shadow job can link and run them."
  - "CMake 4.1 needs CMAKE_POLICY_VERSION_MINIMUM=3.5 for the upstream legacy minimum version."
  - "OHOS Flang 20.1.0 rejects -frecursive; the recipe uses only target, sysroot, and resource-dir flags."
  - "Fortran BLAS arrays are column-major; the dgemm consumer expectation must use storage order 23,34,31,46."
  - "Conan exports must include LICENSE explicitly before package() can copy it into licenses/."

validation:
  local:
    recipe_python_syntax: "passed"
    yaml_structure: "passed"
    consumer_c_syntax: "passed with DevEco OHOS clang -Wall -Wextra -Werror"
    source_sha256: "verified"
    git_diff_check: "passed"
    directory_boundary: "passed"
    conan_create: "blocked: Conan/CMake/OHOS toolchain is not installed on this Windows host"
  native_device:
    status: "passed"
    l0_quality_gate: "passed"
    l1_conan_create: "passed: full single-package pipeline built and executed test_package"
    l2_consumer_test: "skipped by CI: package has no bin/; signed test_package consumer passed 6/6 assertions"
    l4_security_scan: "passed: no patches"
    l5_artifact_check: "passed: libblas.a, two Flang runtimes, blas.pc, licenses/LICENSE, 151 archive members, six expected symbols"
    source_layout_retry: "passed: strip_root=False with BLAS-3.12.0 source folder"
    shadow_ci_summary: "passed: Total 1, Success 1, Failed 0, pass rate 100%"
    command: "zsh ci/conan/build_and_test.sh archives/b/blas/3.12.0"

next_steps:
  - "Collect the 12 upstream TESTING results when a compatible native Flang runtime/test environment is available."
  - "Keep the 6 test_package assertions as the current packaged-consumer validation."
  - "Inspect the installed libblas.a, exported symbols, package layout, and signed consumer executable."
