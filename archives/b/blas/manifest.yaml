software: blas
display: "BLAS"
description: "Netlib reference BLAS - Basic Linear Algebra Subprograms (BLAS component of LAPACK 3.12.1)"
category: foundation
homepage: "https://www.netlib.org/blas/"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "参考 BLAS 现随 LAPACK 发行（netlib 官方声明 BLAS is now part of LAPACK release），3.12.1 源码取 netlib 官方 lapack-3.12.1.tar.gz 的 BLAS/ 组件，与仓库 lapack/3.12.1、cblas/3.12.1 同源"
    - "纯 Fortran 77（157 个 .f 文件），鸿蒙设备无 gfortran，tool_requires flang-ohos/20.1.0 编译（GNU make 内置 .f.o 规则消费 FC/FFLAGS）"
    - "上游 make 构建（BLAS/Makefile → SRC 产 libblas.a），绕开 CMake 路径——顶层 CMake 的 BLAS 目标需 Fortran 链接探针，flang-ohos 精简运行集无法完成（同 lapack 先例）"
    - "flang 编译/链接需显式 --target=aarch64-linux-ohos --sysroot=<SDK> -resource-dir=<SDK clang resdir>，链接加 -lFortranRuntime -lFortranDecimal；flang 运行期需 LD_LIBRARY_PATH 指向 SDK llvm/lib 与 flang 包 lib"
    - "libblas.a 内 xerbla.o 引用 _FortranAio*/_FortranAStopStatement 符号，消费方需链接 Fortran 运行时，随包复制 libFortranRuntime.a/libFortranDecimal.a"
    - "上游测试 12 个 blat 驱动全部真实运行（level1/2/3 × s/d/c/z），0 FAIL"
    - "消费方以 C 直接调用 Fortran LP64 符号（ddot_/dgemm_ 等尾下划线约定），无头文件"

versions:
  "3.12.1":
    status: built
    build_date: "2026-09-15"
    notes: "零补丁；源码取 netlib 官方 lapack-3.12.1.tar.gz 的 BLAS 组件；上游测试 12 驱动全部通过"
