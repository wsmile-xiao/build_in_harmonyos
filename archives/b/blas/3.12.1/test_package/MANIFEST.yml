package: blas/3.12.1
upstream_test_in_build: true
upstream_tests:
  - suite: "参考 BLAS 上游测试套件（BLAS/TESTING，make run）"
    description: "12 个 blat 驱动（level1/2/3 × s/d/c/z 四精度）真实运行：blat1 自包含逐 subprogram 校验；blat2/3 读源码树 *blat2/3.in 数据文件，逐函数校验计算与 error-exits。统计 PASS/FAIL（统计单位=测试程序验证行，取数 conanfile.py build() 内 *blat*.out 计数，详见 reports）"
test_package_tests:
  - file: test.c
    description: "直接链接 libblas 做真实数值计算：ddot/dasum/daxpy/dgemm（Fortran 符号，列主序），逐项对照手算值校验而非仅解析符号"
    command: "./test_probe"
assertion_count: 4
