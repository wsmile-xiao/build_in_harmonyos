software: bambamc
display: "bambamc"
description: "German Tischler 的轻量 C 实现：按名称归并（name collating）的 BAM 文件读写库"
category: data
homepage: "https://github.com/gt1/bambamc"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "官方 tag tarball 不含生成的 configure，必须 autoreconf 自举；且 config.guess/config.sub 由 autoreconf 现场生成，OHOS 变换必须在 autoreconf 之后应用"
    - "configure.in 使用 PKG_PROG_PKG_CONFIG/PKG_CHECK_MODULES，需要随配方携带 pkg.m4 并在 autoreconf 前放入 m4/"
    - "autoconf config.status 的 umask 077 在 HMDFS 下使临时目录对创建者不可写，需把生成的 configure 归一化为 umask 022"
    - "依赖必须是 PIC 变体：本仓 zlib/1.3.1 与 1.3.1.1 与 1.3.2 的 package_id 相同但 PIC 状态不同（1.3.1 非 PIC），选版前需用 conan cache path 精确解析包目录并对归档成员 readelf -r 判定"
    - "上游测试程序是 assert 自检式，需置 tc.ndebug=None 以免 Release profile 的 -DNDEBUG 把断言全部编译掉"
    - "AutotoolsToolchain 不翻译依赖 cpp_info，源码直接 include <zlib.h> 时需显式 AutotoolsDeps"
  common_dependencies:
    - zlib

versions:
  "0.0.50":
    status: built
    build_date: "2026-09-11"
    conan_ref: "bambamc/0.0.50"
