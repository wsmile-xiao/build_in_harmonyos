software: bambamc
version: "0.0.50"
status: built
build_system: autotools
build_date: "2026-09-11"
conan_ref: "bambamc/0.0.50"

source:
  url: "https://github.com/gt1/bambamc/archive/refs/tags/bambamc_0_0_50.tar.gz"
  sha256: "f1ca5b35ce115c3aa3a3630228293cab333d239b26476b271a056f038abdc7a5"
  tar_format: tar.gz

build:
  system: autotools
  bootstrap_command: "autoreconf --force --install"
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "（native 编译，未传 --build/--host 三元组；OHOS 三元组由 config.guess/config.sub 补丁产出）"
  dependencies:
    - "zlib/1.3.1.1"
  tool_dependencies:
    - "automake/1.18"
    - "libtool/2.5.4"
  cc: clang
  cxx: clang++
  package_type: library
  options:
    - "shared=False"
    - "fPIC=True"

patches_applied:
  - "0001-config-guess-harmonyos.patch"
  - "0002-config-sub-harmonyos.patch"

artifacts:
  libraries:
    - lib/libbambamc.a
  headers:
    - include/bambamc/*.h
  pkg_config:
    - lib/pkgconfig/bambamc.pc
  licenses:
    - licenses/COPYING
    - licenses/GPLv3

validation:
  upstream_tests:
    command: "src/bamwritertest > bamwritertest.bam; src/bamreadertest < bamwritertest.bam"
    result: "2/2 程序通过（TOTAL=2 PASS=2 FAIL=0 SKIP=0 NOT_RUN=0；统计单位为上游测试程序）"
    source: "archives/b/bambamc/0.0.50/reports/conan-create-log.md（标记 RUN: \"/.../bamwritertest\"）"
  test_package:
    command: "./test_bambamc consumer_roundtrip.bam"
    result: "28 checks, 0 failures"
    source: "archives/b/bambamc/0.0.50/reports/conan-create-log.md（Testing the package: Executing test 段）"
  conan_verify: "archives/b/bambamc/0.0.50/reports/conan-verify-report.md（verdict=PASS）"
  recipe_revision_note: >
    reports/conan-create-log.md 内标记 Exported: bambamc/0.0.50@ohpcd/stable#eaaa0c5e3b8cc5e19ab9c7e6508b0c93
    所记录的 recipe revision 是 conan-verify 的 E017 镜像注入形态（sources.url 单值 ghfast.top 前缀）导出所得 实测复现该值
    而净工作树（单一官方 URL）导出为 fa529e8974dadbaa1061bbb2aa45d3ae
    两者唯一差异是 sources.url 一行 源 tarball 的 sha256 与 package_id 7ed998dad2cd7b6fe73eee7bc365fa0677f5cb72 完全相同
    复现命令 conan export <pkg> --user=ohpcd --channel=stable（先在 conandata.yml 内做单值 URL 替换）
    定位一律用上列可搜索标记 不用行号（行号随留档头部的增删漂移）
  supplement: "archives/b/bambamc/0.0.50/reports/conan-verify-supplement.md（G4/L2/L4/L5 人工补测）"
  repro_script: "archives/b/bambamc/0.0.50/reports/repro-check.py（两轮可复现性实测脚本）"
  reproducible_fingerprint:
    metric: "两轮清缓存构建：30 个 ar 成员把构建目录 hash 归一后逐字节比对（脚本 reports/repro-check.py）"
    value: "c97d8802265717af76a5cb67f2c8081a38f375626302035ee1fef79548569ce8"
    note: "两轮一致；差异仅 10/30 成员的 .rodata.str1.1 内 assert 的 __FILE__ 路径含每轮缓存构建目录名，另加 ar 成员头时间戳；见 supplement 5.1/5.2"

knowledge_gained:
  - "官方 tag tarball 不含生成的 configure：必须先 autoreconf 自举；build() 顺序固定为「放 pkg.m4 → autoreconf → 打 config.guess/sub 补丁 → 修正 configure → configure/make」"  # knowledge_ref: DRAFT-E2188
  - "configure.in 的 PKG_PROG_PKG_CONFIG/PKG_CHECK_MODULES 需要 pkg.m4，而 pkg.m4 不在 aclocal 隐式搜索路径：配方 export_sources 携带 m4-pkg.m4 并在 autoreconf 前拷到 m4/（同已合入的 libfyaml 0.9.6 做法，命中 DRAFT-libfyaml-0.9.6-pkgm4-pkgcheck-unexpanded）"  # knowledge_ref: DRAFT-libfyaml-0.9.6-pkgm4-pkgcheck-unexpanded
  - "config.guess/config.sub 由 autoreconf 现场生成，仓内 scripts/patch-autotools-ohos.pl 的两处变换必须在 autoreconf 之后应用（此前应用会被 autoreconf 覆盖），产出 aarch64-unknown-linux-ohos"  # knowledge_ref: E007
  - "autoconf config.status 模板的 umask 077 + HMDFS 使临时目录对创建者不可写，configure 报 could not setup config files machinery：生成 configure 后把 umask 077 归一化为 022 即可（E011/E110/E114/E136 同族）"  # knowledge_ref: E011
  - "Conan Release profile 会给 AutotoolsToolchain 注入 -DNDEBUG，而上游测试程序是 assert 自检式（--enable-fast=no 为其默认）：必须置 tc.ndebug=None 否则断言被全部编译掉、测试变成空跑"  # knowledge_ref: DRAFT-E2188
  - "AutotoolsToolchain 不把依赖 cpp_info 翻译成 CPPFLAGS/LDFLAGS：src/Makefile.am 只消费 CPPFLAGS（ZLIBCPPFLAGS 未被引用），必须显式 AutotoolsDeps(self).generate() 否则编译 <zlib.h> 的消费者找不到头文件"  # knowledge_ref: DRAFT-E2186-autotools-deps-missing-dep-flags
  - "本仓 zlib/1.3.1 与 zlib/1.3.1.1 与 zlib/1.3.2 在 OHOS profile 下是同一个 package_id（6b129b06…）但 PIC 状态不同：zlib/1.3.1 配方未注入 -fPIC 其 zutil.o 对全局 z_errmsg 用 R_AARCH64_ADR_PREL_PG_HI21 链进共享库被 ld.lld 拒绝；1.3.1.1 与 1.3.2 配方均注入 CFLAGS=-fPIC -O2 故为 PIC"  # knowledge_ref: DRAFT-E2188
  - "发布版包的 package_id 不编码 PIC 状态，仅用 conan list 看 package_id 无法判定可链接性；可靠探测是先用 conan cache path <ref>:<package_id> 精确解析包目录再对归档成员做 readelf -r：出现 R_AARCH64_ADR_PREL_PG_HI21/R_AARCH64_ADD_ABS_LO12_NC 指向全局数据符号即为非 PIC；禁用 ls 通配猜目录（会把别的 ref 当成目标并得出方向相反的结论）"  # knowledge_ref: DRAFT-E2188
  - "上游 make check 是空套件（只有 noinst_PROGRAMS，无 TESTS 注册），真实测试入口是 bamreadertest/bamwritertest 两个 assert 程序：配方在 build() 内显式构建并运行它们"  # knowledge_ref: DRAFT-E2188
