# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）
#
# 上游测试事实（2026-09-11 实测，源码树 src/Makefile.am）：
#   - src/Makefile.am 只有 `noinst_PROGRAMS = bamreadertest bamwritertest`，
#     没有 check_PROGRAMS / TESTS 注册，因此 `make check` 是空套件（0 用例）。
#   - 上游全部测试入口就是这两个 assert 自检程序；`make` 默认构建它们。

package: bambamc/0.0.50
homepage: "https://github.com/gt1/bambamc"

# 上游测试命令（make -n check 实测：无 TESTS 注册，只有空 all-am 目标）
upstream_check_command: "make check"

# conanfile.py 的 build() 中已集成上游测试执行
upstream_test_in_build: true
upstream_test_command: "src/bamwritertest > bamwritertest.bam; src/bamreadertest < bamwritertest.bam"

# 上游实际运行的测试程序（upstream count = 2，统计单位为“测试程序”）
upstream_tests:
  - file: src/test/bamwritertest.c
    source: bambamc-bambamc_0_0_50/src/test/bamwritertest.c
    description: "testLibBamFree(): 通过写入 API 构造 BAM 头+两条比对；9 处 assert（含 null quality 路径）"
    command: "src/bamwritertest > bamwritertest.bam"
  - file: src/test/bamreadertest.c
    source: bambamc-bambamc_0_0_50/src/test/bamreadertest.c
    description: "runCollationTest(): 经 BamBam_BamCollator 读回上一步的 BAM；2 处 assert（实际执行路径）"
    command: "src/bamreadertest < bamwritertest.bam"

# 上游默认未编译的用例（既非 PASS 也非 SKIP：main() 中被注释掉，构建默认不执行）
# 注意：这两个函数各自还含 1 处 assert（源码第 80、114 行），因函数不被调用而不执行，
# 故不计入下面的 assertion_count。上游断言写作 `assert ( x )`（括号前有空格）。
upstream_not_compiled:
  - file: src/test/bamreadertest.c
    symbol: "lineBufferTest()"
    reason: "main() 中该调用被上游注释掉（源码第 141 行），不在默认执行路径；该函数内含 1 处 assert（第 80 行）"
  - file: src/test/bamreadertest.c
    symbol: "samBamSamTest()"
    reason: "main() 中该调用被上游注释掉（源码第 142 行），不在默认执行路径；该函数内含 1 处 assert（第 114 行）"

# test_package 中自带的测试（消费者视角验证，真实调用写/读 API，R34）
test_package_tests:
  - file: test_bambamc.c
    description: "消费者往返测试：BamBam_BamWriter 写出 BAM -> BamBam_BamFileDecoder 读回 -> 逐字段比对（名称/flag/位置/比对质量/模板长度/序列长度/FASTQ 还原，含反向链反向互补语义）"
    command: "./test_bambamc consumer_roundtrip.bam"

# 断言总数 = 实际执行的上游断言 11 + test_package 断言 28
# 上游 11 = bamwritertest.c 9（全部在 testLibBamFree()，由 main() 调用）
#         + bamreadertest.c 2（runCollationTest() 内；该文件另 2 处位于未调用的函数中，见上）
# 取数命令：grep -c 'assert *(' src/test/bamwritertest.c src/test/bamreadertest.c   # 9 / 4
assertion_count: 39
