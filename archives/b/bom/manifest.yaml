software: bom
display: "bom"
description: "Kubernetes SIGS 出品的 SPDX SBOM 生成与操作命令行工具"
category: build-tool
homepage: "https://github.com/kubernetes-sigs/bom"
license: Apache-2.0
build_system: go

ohos_adaptation:
  key_points:
    - "官方 CI 无可发现可执行的 go（沙箱 PATH 不含 go）：配方按 chkbit/caddy 先例自举固定版本 go1.25.12 SDK（golang.google.cn 优先、dl.google.com 兜底，URL+SHA256 固定），SDK 内逐 ELF 自签后使用（E318）"
    - "Go 产物为未签名 ELF，HarmonyOS 拒绝执行，必须 binary-sign-tool sign -selfSign 自签（E318）"
    - "GOCACHE/GOMODCACHE/GOTMPDIR/TMPDIR 统一置于沙箱可写工作区（OHOS_GO_WORKDIR 可覆盖，默认 /data/storage/el2/base/haps/entry/files/bom-conan-go）"
    - "纯 Go 无 cgo，CGO_ENABLED=0 即可，无 conan 依赖"
  common_dependencies: []

versions:
  "0.7.1":
    status: built
    build_date: "2026-09-06"
    conan_ref: "bom/0.7.1"
