version: "0.7.1"
software: bom
status: built
build_date: "2026-09-06"
conan_ref: "bom/0.7.1"

source:
  url: "https://github.com/kubernetes-sigs/bom/archive/refs/tags/v0.7.1.tar.gz"
  sha256: "3893c25e7ea3b625c7c7c7d2f89cdd53fe6d8d43fac8c587a8f81c920498cca2"
  tar_format: tar.gz

build:
  system: go
  build_system: go
  go_version: "1.25.12"
  configure_options:
    - "CGO_ENABLED=0"
    - "GOTOOLCHAIN=local"
    - "GOPROXY=https://goproxy.cn,https://proxy.golang.org,direct"
    - "GOSUMDB=sum.golang.google.cn"
    - "go-sdk 自举: golang.google.cn/dl/go1.25.12.linux-arm64.tar.gz（SHA256=8b5884aef89600aef5b0b051fb971f11f49bb996521e911f30f02a66884f7bd2，dl.google.com 兜底）"
    - "OHOS_GO_WORKDIR 默认 /data/storage/el2/base/haps/entry/files/bom-conan-go（沙箱可写工作区）"
  dependencies: []

patches_applied: []

knowledge_gained:
  - "官方 CI buildbot 沙箱（uid 100）无 PATH go，用户目录 ~/usr/local/go/bin/go 为 rwxr-x---（owner 20001006/group file_manager）不可执行 → go 供给必须在配方内自举（chkbit/caddy 既定模式）"
  - "go.mod 要求 go 1.24.0 且无 toolchain 行；go1.25.12 + GOTOOLCHAIN=local 满足；arm64 tarball SHA256 与 caddy 2.11.2-r1 固定值一致并经设备侧下载复验"
  - "tarball 构建无 git tag，bom version 显示 GitVersion: devel 属预期（宽松断言）"
  - "上游测试按 E318 逐包 go test -c + binary-sign-tool 自签 + 原源码目录运行；测试 ELF 置于工作区 test-out 目录"
  - "pkg/spdx 三个用例依赖直连 Google 端点（docker.pkg.dev / golang.org），设备网络不可达，以 -test.skip 显式声明跳过"
