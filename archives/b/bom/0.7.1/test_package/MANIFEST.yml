# test_package/MANIFEST.yml — upstream test declaration for bom/0.7.1
package: bom/0.7.1
homepage: https://github.com/kubernetes-sigs/bom

# 上游测试命令（Go 标准测试体系，无 make check）
upstream_check_command: "go test ./..."

# conanfile.py build() 中已集成上游测试（E318: go test -c + 自签 + 原目录运行）
upstream_test_in_build: true
upstream_test_command: "go test -c + binary-sign-tool selfSign + run from package dir"

upstream_tests:
  - file: pkg/license/license_test.go
    source: bom-0.7.1.tar.gz/pkg/license
    description: "许可证识别与 license-id 分类测试"
    command: "go test -c ./pkg/license"
  - file: pkg/osinfo/*_test.go
    source: bom-0.7.1.tar.gz/pkg/osinfo
    description: "容器镜像 OS 包扫描（alpine/debian/rpm/distroless/layer）测试"
    command: "go test -c ./pkg/osinfo"
  - file: pkg/provenance/*_test.go
    source: bom-0.7.1.tar.gz/pkg/provenance
    description: "SLSA provenance statement/predicate 测试"
    command: "go test -c ./pkg/provenance"
  - file: pkg/query/*_test.go
    source: bom-0.7.1.tar.gz/pkg/query
    description: "SPDX 文档查询表达式与过滤测试"
    command: "go test -c ./pkg/query"
  - file: pkg/spdx/*_test.go
    source: bom-0.7.1.tar.gz/pkg/spdx
    description: "SPDX document/package/file/gomod 核心结构与序列化测试"
    command: "go test -c ./pkg/spdx"

# 环境阻塞用例（需直连 Google 端点，设备网络不可达，见 notes.md）
blocked_tests:
  - name: TestPullImagesToArchive
    package: pkg/spdx
    reason: "拉取 registry.k8s.io 镜像经 *.docker.pkg.dev（Google 端点），dial tcp i/o timeout"
    skip_flag: "-test.skip=^(TestPullImagesToArchive|TestGetImageReferences|TestToSPDXPackage)$"
  - name: TestGetImageReferences
    package: pkg/spdx
    reason: "同上端点解析镜像引用，dial tcp i/o timeout"
  - name: TestToSPDXPackage
    package: pkg/spdx
    reason: "golang.org ?go-get=1 vanity import 元数据解析需直连 golang.org，设备不可达"

test_package_tests:
  - file: test.sh
    description: "消费者视角：bom version + bom generate 生成并校验 SPDX 2.3 文档"
    command: "bash test.sh"

# 用例计数（真机实测）：73 passed + 3 blocked = 76
assertion_count: 76
