package: boost1.84-url/1.84.0
homepage: https://www.boost.org/libs/url/

# 上游测试说明
# Boost.URL 的上游测试基于自带 test_suite 框架（libs/url/extra/test_main.cpp
# + test_suite.hpp，不依赖 boost.test）。b2 在 OHOS 不兼容（E068），
# 本适配在 conanfile.py build() 中直接用 clang++ 编译并运行
# libs/url/test/unit/ 下的测试源文件，链接到已编译的 libboost_url.a。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/url/test/unit/parse.cpp"
    description: "boost.url.parse 解析测试（5 断言）"
    command: "clang++ parse.cpp test_main.cpp -lboost_url && ./a.out"
    result: passed
  - file: "libs/url/test/unit/url.cpp"
    description: "boost.url.url 可变 URL 测试（1266 断言）"
    command: "clang++ url.cpp test_main.cpp -lboost_url && ./a.out"
    result: passed
