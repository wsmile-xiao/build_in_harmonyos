test_package_tests:
  - file: test_boost1_84_url.cpp
    description: "Boost.URL API 冒烟测试：parse_uri 解析访问器 + url 修改操作 + 百分号编解码 + 相对引用 resolve + segments/params 遍历（5 组断言）"
    command: "ctest boost1_84_url_test"

assertion_count: 7  # test_package 实际断言组数（5 组 + 编码双向 + resolve）；上游测试 19 项 4364 断言见 upstream_tests 列表
