  upstream_registered: "N=54（boostorg/log boost-1.84.0 test/Jamfile.v2 注册：run/* 52 + example 2，与人工审核实测一致）"
  upstream_run: "54/54 真跑通过（52 个 run 断言测试 + basic_usage/advanced_usage），另有 compile 4/4 + compile-fail 1/1 + self_contained_header 7/7，合计 66/66"
