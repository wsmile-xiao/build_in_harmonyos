knowledge_gained:
  - Boost.Log 的 log_setup 与 log 同源（libs/log/src/setup），但 log_setup 必须与 log core 同包或依赖 log 包；本包同时产出两者
  - Boost.Log 隐式依赖编译型 libboost_thread（tss_data 符号），b2 不可用时需手动编 pthread 分支 3 TU
  - syslog_backend 在非 Windows 用可移植 UDP socket 路径（Boost.Asio header-only），无需 native syslog API
  - settings 解析器非引号值仅允许 [A-Za-z0-9_+.-]，含 % 的值必须加引号（上游 parse_operand 行为）
  - 上游 self_contained_header 模板宏展开为 <boost/log/BOOST_LOG_TEST_HEADER>，宏值不得重复 log/ 前缀（否则拼成 boost/log/log/xxx.hpp 编译失败）
  - OHOS 上一手编译的 smoke 可执行文件运行前必须签名 + LD_LIBRARY_PATH 前置工具链 libc++ 目录，否则 rc=127
  - boost 上游 run 测试可绕过 b2 真跑：自编 boost_unit_test_framework（libs/test/src 19 TU，UTF_SOURCES 清单含 unit_test_main.cpp 提供静态链接 main，勿误排；BOOST_TEST_STATIC_LINK + 不定义 BOOST_TEST_NO_MAIN）后逐测试直编直链
  - boost/log 测试链接图：元包 regex/iostreams/filesystem + 自编 chrono（util_ipc_reliable_mq 需 steady_clock）+ -I libs/log/test/common（char_definitions 等辅助头）
  - CI conanbuild 环境 PATH 无 bash，并行编译须用 concurrent.futures 线程池而非 shell 作业控制
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题)
issues:
  - b2 构建系统在 OHOS 不可用，log/log_setup/thread 编译单元手动编译
