# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "boom-completion 是 holman/boom（Ruby CLI）的 bash/zsh 补全脚本（completion/boom.bash + boom.zsh），纯 Shell 无编译无依赖"
- "bash 补全按惯例放 share/bash-completion/completions/ 且文件名不带扩展名（boom 而非 boom.bash）；zsh 补全放 share/zsh/site-functions/ 且带 _ 前缀（_boom）——参考 Homebrew formula 的 bash_completion/zsh_completion install"
- "zsh 补全脚本内容用 #compdef boom 声明而非 _boom 函数名——test_package 断言应检查 #compdef boom"
- "纯脚本包 conanfile.py 仍需 export_sources()/apply_conandata_patches（G1 完整性要求），build() 可空"
