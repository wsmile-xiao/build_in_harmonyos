# test_package/MANIFEST.yml — boom-completion 0.5.0
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: boom-completion/0.5.0
homepage: "https://zachholman.com/boom/"

# 上游测试：boom 仓库的 test/ 为 Ruby CLI（boom 本体）的测试，非补全脚本；
# boom-completion 仅取 completion/boom.bash + boom.zsh 补全脚本（纯 Shell 无
# 上游测试用例），按 rule 1.2 如实声明。
upstream_check_command: "无（纯脚本包无上游测试）"
upstream_test_in_build: false
upstream_test_command: "无"

# test_package 消费者测试（R34 真实产物校验：补全脚本存在 + 内容关键函数）
test_package_tests:
  - file: conanfile.py
    description: "校验包内 share/bash-completion/completions/boom（含 _boom_complete）与 share/zsh/site-functions/_boom（含 _boom）存在"
    command: "conan create 内自动执行（test() 断言产物存在与内容）"
