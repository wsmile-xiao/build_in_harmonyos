sources:
  "25.0.4":
    url:
      - "https://gh-proxy.com/https://github.com/bareos/bareos/archive/refs/tags/Release/25.0.4.tar.gz"
      - "https://github.com/bareos/bareos/archive/refs/tags/Release/25.0.4.tar.gz"
    sha256: "273037beeef9a43b2a629bacdf7cf949857e17c722a679d723a8d2ba1422ce6e"

patches:
  "25.0.4":
    - patch_file: "patches/0001-clang-static-runtime-libs.patch"
      patch_description: "BUILD_UNIVERSAL_CLIENT forces ENABLE_STATIC_RUNTIME_LIBS=ON, but core/ only implements it for GNU and FATAL_ERRORs on Clang (OHOS toolchain); warn and keep shared runtime on Clang"
      patch_type: "portability"
    - patch_file: "patches/0002-unknown-platform-guard.patch"
      patch_description: "distname.sh reports BAREOS_PLATFORM=unknown on HarmonyOS and core/platforms/ has no such subdirectory; skip platform packaging files with a warning instead of failing configure (recipe never runs cmake install, only copies bareos-fd)"
      patch_type: "portability"
    - patch_file: "patches/0004-nls-no-setlocale-stub.patch"
      patch_description: "ENABLE_NLS=0 defines an empty setlocale macro that rewrites the declaration in sysroot locale.h and breaks every TU including C++ locale via libcxx __locale; drop only the setlocale stub and use the real OHOS setlocale()"
      patch_type: "portability"
    - patch_file: "patches/0005-mntent-cache-unused-vars.patch"
      patch_description: "HAVE_GETMNTENT is detected on OHOS but none of HAVE_LINUX_OS/HAVE_AIX_OS/HAVE_SUN_OS hold, leaving FILE* fp and struct stat st declared but unused under -Werror; guard the declarations with the same platform condition that gates all users"
      patch_type: "portability"
    - patch_file: "patches/0006-mntent-cache-skipfstype-unused.patch"
      patch_description: "Same HAVE_GETMNTENT-without-supported-OS case leaves static inline SkipFstype() with no call site, failing under -Werror -Wunused-function; mark it [[maybe_unused]] (upstream already uses this attribute in the same file) instead of adding more conditional guards"
      patch_type: "portability"
    - patch_file: "patches/0007-respect-build-shared-libs.patch"
      patch_description: "lib/bareos, findlib/bareosfind, fastlz/bareosfastlz and lmdb/bareoslmdb hardcode add_library(... SHARED), ignoring the recipe's BUILD_SHARED_LIBS=OFF; linking that SHARED libbareos against the conan non-PIC static libz.a fails on aarch64 (R_AARCH64_ADR_PREL_PG_HI21, recompile with -fPIC). Drop the hardcoded type so the recipe's setting yields static archives; filed plugins stay MODULE by design"
      patch_type: "portability"
    - patch_file: "patches/0008-fstype-fallback-unused-params.patch"
      patch_description: "OHOS matches no HAVE_DARWIN_OS/HAVE_FREEBSD_OS/HAVE_LINUX_OS/HAVE_SUN_OS/HAVE_WIN32 branch, falling into the 'No recognised OS' fstype() stub whose fname/fs/fslen params are entirely unused and fail under -Werror -Wunused-parameter; silence with (void) casts inside the fallback only, other OS branches untouched"
      patch_type: "portability"

# Vendored build-time sources (aevol/9.4.0 precedent). Upstream CMake fetches
# these via CPM at configure time; the recipe downloads them here and injects
# them via CPM_<NAME>_SOURCE so configure never touches the network.
# googletest is built + installed to a build-local prefix (GTest_ROOT) so the
# upstream gtest suite really runs.
