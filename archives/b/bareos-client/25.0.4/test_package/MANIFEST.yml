# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bareos-client/25.0.4
homepage: "https://www.bareos.org"

# 上游测试存在性声明 (HMBS 机器证据门禁要求)
# core/src/tests/ 审计：86 个 gtest .cc 文件，约 409 个 TEST/TEST_F/TEST_P
# 宏（2026-09-06 解包源码实测），71 个 bareos_add_test() 测试二进制，
# 经 gtest_discover_tests 以 gtest: 前缀注册进 ctest；GTest 缺失时上游
# 构建静默跳过整个目录，故配方在 build() 内先构建 vendored googletest
# 1.14.0 再主 configure，确保测试真实运行。
upstream_tests_exist: true
upstream_test_audit: >-
  core/src/tests/ (101 entries): 86 gtest .cc files, ~409 TEST/TEST_F/TEST_P
  macros (regex count on extracted Release/25.0.4 sources), 71
  bareos_add_test() binaries registered as ctest "gtest:*" via
  gtest_discover_tests in core/src/tests/CMakeLists.txt. systemtests/
  (5195 entries) needs a live Director/SD/FD cluster and is excluded from
  client-only builds by upstream design (guarded by if(NOT client-only)),
  so it is not part of this package's upstream suite.

# 上游测试命令
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: core/src/tests/*.cc (86 files, 71 test binaries)
    source: bareos-Release-25.0.4/core/src/tests/
    description: "上游 gtest 单元测试套件，约 409 个 TEST/TEST_F 用例，ctest 前缀 gtest:"
    command: "ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_bareos_fd.py
    description: "消费者测试: bareos-fd 存在/可执行/ELF/--version 真实运行（4 项检查）"
    command: "python3 test_bareos_fd.py <package>"

# 上游测试用例数（审计值：约 409 个 TEST 宏；ctest 实际发现数以预检
# HMBS_UPSTREAM_TEST_RESULT 标记为准）
upstream_test_case_count: 409

# 测试断言总数（审计口径：上游约 409＋消费者 4；实际通过数以预检标记为准）
assertion_count: 413
