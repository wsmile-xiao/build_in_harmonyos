software: bareos-client
version: "25.0.4"
status: built
build_date: "2026-09-06"
build_system: "cmake"
conan_ref: "bareos-client/25.0.4"

source:
  url: "https://github.com/bareos/bareos/archive/refs/tags/Release/25.0.4.tar.gz"
  sha256: "273037beeef9a43b2a629bacdf7cf949857e17c722a679d723a8d2ba1422ce6e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_UNIVERSAL_CLIENT=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DENABLE_WEBUI=OFF"
    - "-DENABLE_SYSTEMTESTS=OFF"
    - "-Dacl=OFF"
    - "-Dxattr=OFF (OHOS sysroot has sys/xattr.h but no AIX/Darwin/Linux/Sun backend; upstream option ignored by core/CMakeLists.txt, recipe build() appends a NOT-xattr reset after set(have_xattr YES) so !HAVE_XATTR stub path is taken)"
    - "-DENABLE_NLS=0 (OHOS has no gettext/libintl; upstream CACHE STRING 1/0, AIX precedent; T_(s) falls back to identity)"
    - "-DGTest_ROOT=<build>/gtest-install (vendored googletest 1.14.0)"
    - "-DCPM_<NAME>_SOURCE=<build>/cpm-sources/<name> (vendored CPM tarballs)"
    - "-DOPENSSL_ROOT_DIR=<openssl package> -DZLIB_ROOT=<zlib package>"
    - "-DMDB_USE_ROBUST=0 via toolchain preprocessor_definitions (OHOS lacks pthread robust-mutex APIs; upstream mdb.c documents this opt-out)"
  dependencies:
    - openssl/3.5.6
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-clang-static-runtime-libs.patch (Clang: static runtime unsupported -> warn + shared runtime)"
  - "patches/0002-unknown-platform-guard.patch (BAREOS_PLATFORM=unknown -> skip platform packaging with warning)"
  - "patches/0004-nls-no-setlocale-stub.patch (ENABLE_NLS=0: drop empty setlocale stub that breaks sysroot locale.h via libcxx __locale)"
  - "patches/0005-mntent-cache-unused-vars.patch (HAVE_GETMNTENT without Linux/AIX/Sun: guard unused fp/st declarations)"
  - "patches/0006-mntent-cache-skipfstype-unused.patch (same platform gap leaves SkipFstype() with no call site: [[maybe_unused]] instead of ifdef)"
  - "patches/0007-respect-build-shared-libs.patch (lib/findlib/fastlz/lmdb hardcode add_library(SHARED), ignoring BUILD_SHARED_LIBS=OFF; SHARED libbareos vs non-PIC static libz.a fails on aarch64: drop the type so OFF yields static archives)"
  - "patches/0008-fstype-fallback-unused-params.patch (OHOS hits the 'No recognised OS' fstype() stub with wholly unused fname/fs/fslen: (void) casts inside the fallback only, -Werror clean)"

knowledge_gained:
  - "xattr: upstream option(xattr) ignored by core/CMakeLists.txt; recipe build() _fix_xattr_option() appends NOT-xattr reset after set(have_xattr YES) (no line-number-dependent patch)"
  - "stdc++fs: upstream core/src/tests links dedupable_volume_test with NOT-FreeBSD genex, true on OHOS clang+libc++ where no libstdc++fs exists (lld unable to find library); recipe _fix_stdcppfs_link() restricts to CXX_COMPILER_ID:GNU (libc++ ships filesystem in main c++ lib)"
  - "BUILD_UNIVERSAL_CLIENT=ON 即上游可移植客户端预设，无需手选 client-only 各开关"
  - "CPM 依赖用 CPM_<NAME>_SOURCE 注入本地解压目录，configure 零网络（aevol/9.4.0 同款）"
  - "googletest 需在 build() 内先行构建安装再传 GTest_ROOT，否则 tests 目录被静默跳过"
  - "core/src/tests 共 71 个 bareos_add_test 测试二进制，约 409 个 TEST/TEST_F 宏"
  - "fvec tmpfile: upstream fvec.cc SetUp() uses std::tmpfile() (/tmp hardcoded); OHOS /tmp is read-only (preflight /tmp/shou6alf.tmp error), tmpfile returns NULL and fileno(NULL) SEGFAULTs 5 fvec_fixture tests; recipe _fix_fvec_tmpfile() falls back to mkstemp($TMPDIR/$TMP/$TEMP) and ASSERTs non-null (test semantics unchanged, only temp root replaced); NUL terminator copied via c_str() range, never a '\\0' char literal (clang -Wnull-character under -Werror)"
  - "test_backtrace: dladdr() needs dynamic symbols; link test_backtrace with LINKER:--export-dynamic via recipe _fix_backtrace_export_dynamic() so Backtrace name resolves on OHOS/lld (GNU behaviour unchanged)"
  - "ctest parsing: SEGFAULT lines report ***Exception not ***Failed; recipe _run_upstream_tests() now counts Exception/SegFault as failed and runs ctest in CTestTestfile dir, preventing passed==discovered while rc==1 undercount"
