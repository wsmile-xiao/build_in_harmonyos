software: bareos-client
display: "Bareos Client"
description: "Bareos 开源备份套件的可移植文件守护进程客户端（bareos-fd）"
category: system
homepage: "https://www.bareos.org"
license: AGPL-3.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "采用上游 BUILD_UNIVERSAL_CLIENT 可移植客户端预设（client-only，无 Director/SD）"
    - "CPM 六包与 googletest 全部 vendor 自带源码，configure 零网络访问"
    - "内部库全静态链接，只交付 bin/bareos-fd 单二进制"
    - "OHOS 无 sys/acl.h，需 -Dacl=OFF；xattr 缺失由上游 HAVE_XATTR 守卫自动降级"
  common_dependencies:
    - openssl
    - zlib

versions:
  "25.0.4":
    status: built
    build_date: "2026-09-06"
    conan_ref: "bareos-client/25.0.4"
