# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bitserializer/0.85.0
homepage: "https://github.com/PavelKisliak/BitSerializer"

# 上游测试命令 (CMake + CTest)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (本地验证: 860/860 passed)
upstream_tests:
  - file: tests/unit_tests
    source: bitserializer-0.85.0/tests/unit_tests
    description: "单元测试 (core/convert/std_types), CTest 860 项全过"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证, 实质调用被测包 API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 调用 bitserializer header-only core API (string<->numeric round-trip)"
    command: "./test_bitserializer"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 860
