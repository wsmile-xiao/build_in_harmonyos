# 版本级 manifest
# 文件位置: archives/b/bitserializer/0.85.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.85.0"

# 软件名
software: "bitserializer"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag v0.85）
  url: "https://github.com/PavelKisliak/BitSerializer/archive/refs/tags/v0.85.tar.gz"

  # 源码校验和（init-build 从官方 tag 下载的 tarball 实测 sha256）
  sha256: "4d031af8ed6bdbb3a54c8ff50101738507504d995aaeaae3b3689c668f36d2b6"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DBUILD_TESTS=OFF"
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DBUILD_BENCHMARKS=OFF"
  - "-DBUILD_SAMPLES=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（conandata.yml 声明）
patches_applied:
- "0001-cmake-bitserializerConfig.h.in.patch"
- "0002-include-bitserializer-common-text.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS libc++ (libcxx-ohos 26.0.0.18) charconv 无浮点 from_chars，需平台门控关闭能力宏并回退 strtod/snprintf"
- "OHOS libc++ 裁剪传递包含，使用 basic_string_view 的头文件必须显式 include <string_view>"
