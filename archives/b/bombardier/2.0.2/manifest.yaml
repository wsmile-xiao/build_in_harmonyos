software: bombardier
version: 2.0.2
status: built

source:
  url: https://github.com/codesenberg/bombardier/archive/refs/tags/v2.0.2.tar.gz
  checksum_sha256: ""

build:
  system: go
  build_system: go
  go_version: 1.22.0
  configure_options:
    - "CGO_ENABLED=1"
    - "GOPROXY=https://goproxy.cn,direct"
    - "GOTOOLCHAIN=local"
    - "CC=clang"
    - "GOCACHE=/data/storage/el2/base/cache/go-cache"
    - "GOTMPDIR=/data/storage/el2/base/cache/go-tmp"
    - "TMPDIR=/data/storage/el2/base/cache/go-tmp"
  build_command: "CGO_ENABLED=1 go build -v -ldflags='-s -w -linkmode=external -extld=clang' -o bombardier ."
  dependencies: []

artifacts:
  binaries:
    - bombardier

platform:
  name: HarmonyOS
  arch: aarch64
  libc: musl

notes:
  - "使用外部链接器绕过 HMDFS mmap 权限限制（E082）"
  - "使用 /data/storage/el2/base/cache 目录避开 HMDFS 权限问题"
  - "移除 go.mod toolchain 要求使用本地 Go 1.22.0"
  - "版本号显示为 unspecified（无法注入 ldflags）"

knowledge_gained:
  - pattern: "E082"
    description: "Go linker mmap permission denied on HMDFS"
    workaround: "Use external linker with CGO_ENABLED=1 and build in non-HMDFS directory"
