# conandata.yml — bcp 1.4.4
# 上游：COIN-OR Bcp（分支-切割-价格 MILP 框架），官方发行渠道
# sha256 双域锚定（2026-09-23 实测：coin-or.org 官方 vs coin-or.clemson.edu
# 异域镜像独立下载全等；Debian 池无件按异域镜像判据）

sources:
  url: "https://www.coin-or.org/download/source/Bcp/Bcp-1.4.4.tgz"
  sha256: "8b490ad35c28a79806f84dacbdc36d602ce0a3a4e32c3575f99495c6e6b4906e"

# 最小补丁：tarball 内 config.guess/config.sub 为 2007-04-29 / 2011 版，
# CPU 表 0 处 aarch64，`./config.sub aarch64-unknown-linux-musl` 直接
# "machine not recognized"（build1 实测于 configure 的 build system type 检查）；
# 且设备 uname -s = HarmonyOS，老 config.guess 不识别。与 coinor-dylp 1.10.4
# 同源同款（其 4 补丁对本包顶层与 Bcp/ 子层 dry-run 全过）：config.sub 补
# aarch64 CPU + linux-musl OS，config.guess 补 HarmonyOS/HongMeng 与
# aarch64:Linux 分支直接输出 unknown-linux-musl。顶层与 Bcp/ 各一份。
# 由 conanfile.py build() 的 apply_conandata_patches 应用。
patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_type: "portability"
    patch_description: "config.guess: add HarmonyOS (HongMeng) and aarch64 Linux branches"
  - patch_file: "patches/0002-config.sub.patch"
    patch_type: "portability"
    patch_description: "config.sub: recognize aarch64 CPU and linux-musl OS"
  - patch_file: "patches/0003-Bcp-config.guess.patch"
    patch_type: "portability"
    patch_description: "Bcp/config.guess: add HarmonyOS (HongMeng) and aarch64 Linux branches"
  - patch_file: "patches/0004-Bcp-config.sub.patch"
    patch_type: "portability"
    patch_description: "Bcp/config.sub: recognize aarch64 CPU and linux-musl OS"
