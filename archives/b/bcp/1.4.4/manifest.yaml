# 版本级 manifest — bcp 1.4.4
# 遵循 ARCHIVE-SPEC v2.0

version: "1.4.4"
software: bcp
status: built
build_date: "2026-09-23"
build_system: autotools

source:
  url: "https://www.coin-or.org/download/source/Bcp/Bcp-1.4.4.tgz"
  sha256: "8b490ad35c28a79806f84dacbdc36d602ce0a3a4e32c3575f99495c6e6b4906e"
  tar_format: tar.tgz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--build=aarch64-unknown-linux-musl"
    - "--enable-static"
    - "--disable-shared"
    - "--disable-dependency-tracking"
    - "--with-clp-incdir=<staging>"
    - "--with-clp-lib=<clp 闭包直连 .a>"
    - "--with-vol-incdir=<staging>"
    - "--with-vol-lib=<vol 闭包直连 .a>"
    - "--with-cgl-incdir=<staging>"
    - "--with-cgl-lib=<cgl 闭包直连 .a>"
  dependencies:
    - coinutils/2.11.13
    - coin-or/0.108.12
    - clp/1.17.10
    - cgl/0.60.10.1
    - vol/1.5.4
    - zlib/1.3.1
  cc: clang
  cxx: clang++
  cflags: "-O3 -pipe -DNDEBUG"
  cxxflags: "-O3 -pipe -DNDEBUG"

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-Bcp-config.guess.patch"
  - "0004-Bcp-config.sub.patch"
# 4 个 portability 补丁：tarball 的 config.guess/config.sub 为 2007/2011 版，
# 不认 aarch64 与 HarmonyOS（build1 实测 config.sub 失败）；顶层与 Bcp/ 子层
# 各两份，与 coinor-dylp 1.10.4 同款口径。依赖注入（Bcp/configure flags 模式，
# 捆绑 Clp/CoinUtils/Osi/Vol/Cgl 子树不进编译面）与 HMDFS 修复
# （shebang/config.guess sed/config.status/.lo）仍在 conanfile.py build() 内。

knowledge_gained:
  - "COIN-OR 捆绑依赖子树含 x86 专属头（Clp 的 immintrin.h 无条件 include，aarch64 探针 rc=1）：外部依赖 flags 模式让捆绑子树不进 SUBDIRS 即不触达；W0-3 全仓字面 grep 与构建面存在系统性偏差，捆绑子树/死块命中按「命中归类→探针定性→configure SUBDIRS 实证」三步裁量" # knowledge_ref: E693
  - "Bcp 上游测试 test/BAC 在 if ALWAYS_FALSE 下不在默认 SUBDIRS：make all 不编译 unitTest，须「显式 make -C test/BAC unitTest → OHOS ELF 自签 → make test」三步驱动，签名前置于执行" # knowledge_ref: E693
  - "COIN-OR 已发布包 .pc 固化 prefix=/ 不可作消费路径，flags 模式 + 合并头 staging + 直连 .a 闭包串" # knowledge_ref: E646

test_results:
  type: upstream_and_consumer
  upstream_test_in_build: true
  upstream_targets_registered: 1
  note: "上游注册测试目标 1（TESTS=BAC → unitTest -param bb.par，单场景 Benders branch-and-cut）；消费者断言 10（test_package/main.cpp）；逐项结果见 reports/test-report.md"
