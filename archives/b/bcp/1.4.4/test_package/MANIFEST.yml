# test_package/MANIFEST.yml
# 上游官方测试声明文件 — bcp 1.4.4
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试面（Bcp/Makefile.am 注册，口径=make test 目标）：
#   TESTS = BAC        → make test 遍历执行 test/BAC 的 `make test`
#   test/BAC: `./unitTest -param bb.par`（Benders branch-and-cut 单场景：
#   examples/BAC 的 bac.lp/bac.mps，bb.par 驱动；unitTest 由 7 个上游源
#   LP/BB_lp.cpp、TM/BB_tm.cpp、Member/BB_{user_data,packer,init,cut}.cpp、
#   Member/BB.cpp 链接 libBcp.la 构成）
# 注意：test/BAC 不在默认 SUBDIRS（Bcp/Makefile.am `if ALWAYS_FALSE`），
#   故 build() 按「显式 make -C test/BAC unitTest → ELF 自签 → make test」
#   三步驱动（make test 执行时 unitTest 已签名且 up-to-date，不重编）。

package: bcp/1.4.4
homepage: "https://projects.coin-or.org/Bcp"

# 上游测试命令（在源码树 Bcp/ 子目录执行）
upstream_check_command: "make test (in Bcp/ subpackage)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 -C test/BAC unitTest && <binary-sign-tool 自签 unitTest> && make -j1 test (in <source>/Bcp)"

# 上游实际运行的测试程序
upstream_tests:
  - file: Bcp/test/BAC/Makefile.am
    source: Bcp-1.4.4/Bcp/test/BAC/Makefile.am
    description: "unitTest（BAC 示例的 Benders branch-and-cut 集成测试，-param bb.par 驱动 bac.lp/bac.mps）"
    command: "./unitTest -param bb.par"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: main.cpp
    description: "消费者断言：版本宏 4 条 + BCP_buffer 契约/pack 往返 3 条 + BCP_cg_prob 构造真链接 libBcp.a 3 条（析构不崩计入 rc）"
    command: "./bcp_consumer"

# 测试断言总数（消费者断言数，用于质量评估）
assertion_count: 10
