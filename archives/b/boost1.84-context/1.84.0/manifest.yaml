knowledge_gained:
  - "Boost.Context 的 fcontext 汇编（make/jump/ontop_arm64_aapcs_elf_gas.S）在 OHOS aarch64 上由 llvm 集成汇编器直接编译通过（clang -x assembler-with-cpp），无需补丁；OHOS SDK clang 无独立 as，集成汇编器是唯一汇编路径"
  - "上游 lib boost_context 源集合（ARM64/AAPCS/ELF + clang）= 3 个 arm64 汇编 + posix/stack_traits.cpp；编译库自身需 -DBOOST_CONTEXT_SOURCE（Jamfile project requirements）"
  - "libs/context/test/ 6 个 .cpp 中 5 个是测试用例（test_invoke/test_apply/test_fcontext/test_fiber/test_callcc，自带 int main()、依赖 boost/core/lightweight_test.hpp）；is_libstdcxx.cpp 是 build-check 辅助 obj（#error 非测试），libc++ 下编译必然失败属预期"
  - "test_callcc/test_fiber 在 Jamfile 按 fcontext/ucontext-segmented 两种 impl 各注册一次变体，本包仅构建默认 fcontext（asm）实现，每源计 1 次"
  - "package() 安装完整 boost/ 头树而非仅 context 子树：Boost 库间头文件传递依赖强，部分头树会破坏传递 include"
  - "context 的 5 个上游测试在 CI 低内存 worker（CI-021）上 -O2 链接期全部 linker signal 被杀：纤维模板实例化比 container 更吃链接内存；全部降档 -Os -DNDEBUG -g0 后通过（库本体保持 -O2）"

