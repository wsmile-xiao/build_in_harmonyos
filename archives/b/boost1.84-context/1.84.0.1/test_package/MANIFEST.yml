# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: boost1.84-context/1.84.0
homepage: "https://www.boost.org/libs/context/"

# 上游测试入口：b2 编译系统（OHOS 不兼容，E068），无法直接运行 B2 测试目标；
# 上游 libs/context/test/Jamfile.v2 以 [ run test_xxx.cpp /boost/context//boost_context ]
# 注册测试，注册的 run 目标源文件共 5 个（test_invoke/test_apply/
# test_fcontext/test_fiber/test_callcc，均自带 int main()、依赖
# boost/core/lightweight_test.hpp）。test_fiber/test_callcc 在 Jamfile 中
# 按 fcontext/native-ucontext/segmented 三种 context-impl 变体各注册一次，
# 本包仅构建默认 fcontext 实现（asm），对应 test_fiber_asm/test_callcc_asm
# 变体各计 1 次。is_libstdcxx.cpp 是 build-check 辅助 obj（探测 libstdc++，
# 仅 gcc segmented-stack 路径用，#error "Not libstdc++" 直接编译失败于
# libc++），非测试用例不纳入统计。
upstream_check_command: "b2 libs/context/test"

# 本包在 conanfile.py build() 中手动编译 libboost_context.a（上游 Jamfile
# ARM64/AAPCS/ELF 同源集合：3 个 arm64 汇编 + posix/stack_traits.cpp，
# llvm 集成汇编器编译）+ 逐个编译运行 5 个上游测试用例（退出码判定），
# 统计写入 build_folder/upstream-tests-report.txt
upstream_test_in_build: true
upstream_test_command: "conan create（build() 内 _run_upstream_tests 逐个编译运行 libs/context/test/test_*.cpp）"

# 上游 context 测试全集（N=5，与 libs/context/test/ 目录实测 .cpp 数一致：
# 6 个 .cpp 中 5 个为测试用例 + 1 个 build-check 辅助 obj）
upstream_tests:
  - file: libs/context/test/test_apply.cpp
    source: boost_1_84_0/libs/context/test/test_apply.cpp
    description: "上游 context 测试 test_apply（boost::context::apply 元组展开调用，绕过 b2 手动编译链接 libboost_context.a 后真实运行）"
    command: "clang++ ... test_apply.cpp -lboost_context && ./ut_test_apply"
  - file: libs/context/test/test_callcc.cpp
    source: boost_1_84_0/libs/context/test/test_callcc.cpp
    description: "上游 context 测试 test_callcc（callcc continuation 挂起/恢复，对应 Jamfile fcontext 变体 test_callcc_asm）"
    command: "clang++ ... test_callcc.cpp -lboost_context && ./ut_test_callcc"
  - file: libs/context/test/test_fcontext.cpp
    source: boost_1_84_0/libs/context/test/test_fcontext.cpp
    description: "上游 context 测试 test_fcontext（make_fcontext/jump_fcontext 底层栈切换）"
    command: "clang++ ... test_fcontext.cpp -lboost_context && ./ut_test_fcontext"
  - file: libs/context/test/test_fiber.cpp
    source: boost_1_84_0/libs/context/test/test_fiber.cpp
    description: "上游 context 测试 test_fiber（fiber 挂起/恢复/数据交换，对应 Jamfile fcontext 变体 test_fiber_asm）"
    command: "clang++ ... test_fiber.cpp -lboost_context && ./ut_test_fiber"
  - file: libs/context/test/test_invoke.cpp
    source: boost_1_84_0/libs/context/test/test_invoke.cpp
    description: "上游 context 测试 test_invoke（boost::context::detail::invoke 可调用对象转发）"
    command: "clang++ ... test_invoke.cpp -lboost_context && ./ut_test_invoke"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_context.cpp
    description: "boost context 三层 API 测试（fiber resume 往返 + callcc continuation + fcontext_t make/jump 底层栈切换，共 3 组断言块）"
    command: "./test_context"

# 断言计数：3 组断言块（fiber 1 + callcc 1 + fcontext 1）
# + 上游 5 个测试源各自内置断言（退出码判定）
assertion_count: 3
