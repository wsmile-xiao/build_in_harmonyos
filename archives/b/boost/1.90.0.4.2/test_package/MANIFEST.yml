package: boost/1.90.0.4.2
homepage: "https://www.boost.org/"

# ── 上游测试实测申报（R51）────────────────────────────────────────────────
# 6 个编译型组件的官方 quick 测试实测：清点 6 / 实测 6 / 通过 6 / 100%。
# 依据：libs/<lib>/test/Jamfile.v2 的 quick 目标（或 quick*.cpp）；无 quick
# 目标的组件（atomic/container/unit_test_framework）取主官方 run 目标。
# 完整清单 + 逐项日志：reports/upstream-tests/UPSTREAM-TESTS-SUMMARY.md
upstream_tests:
  - file: "libs/system/test/quick.cpp"
    source: "boost-1.90.0/libs/system/test/quick.cpp"
    description: "官方 Boost.System quick 测试（Jamfile.v2 quick 目标；Boost 1.90 system 为 header-only，编译运行零链接）— OHOS 实测 PASS"
    command: "out_system_quick (reports/upstream-tests/system_quick.log)"
  - file: "libs/filesystem/test/quick.cpp"
    source: "boost-1.90.0/libs/filesystem/test/quick.cpp"
    description: "官方 Boost.Filesystem quick 测试（Jamfile.v2 quick 目标，<define>BOOST_FILESYSTEM_VERSION=4，实测编译同样加 -DBOOST_FILESYSTEM_VERSION=4）— OHOS 实测 PASS"
    command: "out_filesystem_quick (reports/upstream-tests/filesystem_quick.log)"
  - file: "libs/program_options/test/quick.cpp"
    source: "boost-1.90.0/libs/program_options/test/quick.cpp"
    description: "官方 Boost.ProgramOptions quick 测试（Jamfile.v2 quick 目标，运行参数 --path=initial）— OHOS 实测 PASS"
    command: "out_program_options_quick --path=initial (reports/upstream-tests/program_options_quick.log)"
  - file: "libs/atomic/test/atomic_api.cpp"
    source: "boost-1.90.0/libs/atomic/test/atomic_api.cpp"
    description: "官方 Boost.Atomic 主 API 测试（Jamfile.v2 test-suite atomic 首 run 目标；本组件无 quick 目标）— OHOS 实测 PASS"
    command: "out_atomic_api (reports/upstream-tests/atomic_api.log)"
  - file: "libs/container/test/deque_test.cpp"
    source: "boost-1.90.0/libs/container/test/deque_test.cpp"
    description: "官方 Boost.Container deque 测试（Jamfile.v2 test_all 枚举 run 目标；本组件无 quick 目标）— OHOS 实测 PASS"
    command: "out_container_deque (reports/upstream-tests/container_deque.log)"
  - file: "libs/test/test/usage-variants-ts/shared-library-test.cpp"
    source: "boost-1.90.0/libs/test/test/usage-variants-ts/shared-library-test.cpp"
    description: "官方 Boost.Test shared-library usage-variant 测试（BOOST_TEST_MODULE + BOOST_TEST_DYN_LINK + libboost_unit_test_framework.so；本组件无 quick 目标）— OHOS 实测 PASS"
    command: "out_utf_shared (reports/upstream-tests/unit_test_framework_shared.log)"

upstream_test_count: 6
upstream_test_run: 6
upstream_test_pass: 6
upstream_test_pass_rate: "100.0%"

# ── test_package 本地测试 ────────────────────────────────────────────────
test_package_tests:
  - file: "test.cpp"
    description: "Consumer link/API smoke test for ProgramOptions, Filesystem, System, and Morpheus-required header-only Boost modules."
    command: "test_boost_morpheus_components"
  - file: "test_unit_test_framework.cpp"
    description: "Boost.Test dynamic-link consumer (BOOST_TEST_DYN_LINK) linking Boost::unit_test_framework; mirrors pinocchio 4.1.0 upstream unittest."
    command: "test_boost_unit_test_framework"
  - file: "test_boost_ohos_dlopen.cpp"
    description: "OHOS 专属：dlopen 5 个编译型组件 libboost_*.so（RTLD_NOW）+ dlsym 真实导出符号 + 实际调用；验证 .codesign 签名库在 OHOS 加载器下可加载可重定位可调用。"
    command: "test_boost_ohos_dlopen"
  - python: "conanfile.py::_check_package_layout"
    description: "OHOS 专属打包检查：断言包内无 libboost_*.so.<digits> 版本化 soname 软链（HMDFS 不兼容，patch+BOOST_INSTALL_NO_VERSIONED_LIBS 修的点），且每个 libboost_*.so 均含 .codesign section。"
    command: "conan test 阶段自动执行"

test_package_test_count: 4
