software: boost
version: "1.90.0.4.2"
upstream_version: "1.90.0"
status: built
build_date: "2026-09-25"
build_system: cmake

source:
  url: "https://github.com/boostorg/boost/releases/download/boost-1.90.0/boost-1.90.0-cmake.tar.xz"
  sha256: "aca59f889f0f32028ad88ba6764582b63c916ce5f77b31289ad19421a96c555f"

build:
  system: cmake
  components:
    - atomic
    - container
    - filesystem
    - program_options
    - system
    - unit_test_framework
  dependencies: []

patches_applied:
  - file: "patches/0001-cmake-avoid-versioned-soname-links-on-ohos.patch"
    description: "Avoid HMDFS-incompatible versioned shared-library symlinks on OHOS"

validation:
  ohos:
    status: passed
    conan_verify: "2026-09-25 conan create 成功 (ohos-aarch64, clang 15, libc++)，包 boost/1.90.0.4.2#100ff22e…:01d92cf3…（最终 W3 权威日志 reports/w3-local-ci.log；create1.log 为中间迭代记录），test_package 三消费者全部编译/签名/运行通过"
    upstream_tests:
      result: "R51 上游测试实测：清点 6 / 实测 6 / 通过 6 / 100%（system/filesystem/program_options quick.cpp、atomic atomic_api.cpp、container deque_test.cpp、unit_test_framework shared-library-test.cpp），逐项日志 reports/upstream-tests/"
    ohos_specific:
      package_layout_check: "断言无 libboost_*.so.<digits> 版本化 soname 软链 + 每个 libboost_*.so 含 .codesign — PASS（14 个 .so 全部签名）"
      dlopen_consumer: "test_boost_ohos_dlopen：dlopen 5 个编译型组件库 + dlsym + 实际调用 — PASS"
    loader_signature_quirk:
      note: "OHOS /storage/Users tmpfs hmmac=use_task：读取已签名 .so 会使 .codesign 签名状态失效（加载器报 symbol not found/Permission denied），就地重签恢复；test() 已按 check→resign→run 顺序规避（详见 notes.md）"

knowledge_used:
  - "Boost.Test libs/test/CMakeLists.txt 的 _boost_test_dependencies 全部为 header-only 库，libboost_unit_test_framework.so 仅 NEEDED libc++_shared/libc，无编译型 boost 依赖。"
  - "BoostRoot.cmake 的 __boost_gather_dependencies 会为 BOOST_INCLUDE_LIBRARIES 中模块自动捎带并安装缺失的 header-only 依赖。"
  - "pinocchio 4.1.0 unittest 模式：find_package(Boost COMPONENTS unit_test_framework) + BOOST_TEST_DYN_LINK + 链接 Boost::unit_test_framework。"
  - "OHOS 加载器签名状态失效：/storage/Users tmpfs (hmmac=use_task) 下读取已签名 .so（cp / llvm-objcopy --dump-section / 任何读者）会使 .codesign 与文件状态不一致，加载器拒绝加载（symbol not found / Permission denied）；就地重签（llvm-objcopy --remove-section .codesign + binary-sign-tool sign）恢复。test_package test() 顺序：layout check（读）→ 就地重签（刷）→ 运行消费者。"
