# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试方式（本配方实际执行路径，见 conanfile.py _run_upstream_ts_suite）：
#   b2 构建系统在 OHOS 上不兼容（bootstrap.sh toolset 白名单无 OHOS，E068/E099），
#   上游 libs/test/build/CMakeLists.txt 独立构建在 OHOS 交叉环境下同样不适用
#   （check_cxx_compiler_flag 强加 -std=c++11 与 OHOS SDK 路径问题）。
#   配方 build() 内以 clang++ 直编上游 Boost.Test 19 源（默认 init API 测试库，
#   与上游 CMake boost_test_framework 目标一致：-DBOOST_TEST_NO_LIB），
#   再编译并真实运行 libs/test/test 下官方 ts-suite：
#   7 个 suite / 73 个单文件测试 + datasets 12-TU 单可执行 = 74 个可执行，
#   与上游 libs/test/test/CMakeLists.txt 的 bt-unittest-* 测试集合逐一对应。
#   测试编译标准 -std=c++17（R04 先例：C++11 下 fp-multiprecision 系列失败）。
#   逐条结果写入 build_folder/upstream-tests-report.txt。
package: boost/1.89.0
homepage: "https://www.boost.org/"

upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "conan create archives/b/boost/1.89.0 --build=boost/* (build() 内嵌：clang++ 直编 19 源测试库 + 74 个上游用例编译运行)"

# 上游实际运行的测试程序（与上游 CMake bt-unittest-* 集合一致，74 项）
upstream_tests:
  - file: "libs/test/test/writing-test-ts/*.cpp (23 个单文件用例)"
    description: "断言/工具/FP 比较/超时等（含 test-timeout-fail、test-timeout-suite-fail，上游 Jamfile L185/L187 标注 run-fail，按预期失败语义判定）"
  - file: "libs/test/test/execution_monitor-ts/*.cpp (3 个单文件用例)"
    description: "异常处理/执行监控"
  - file: "libs/test/test/framework-ts/*.cpp (11 个单文件用例)"
    description: "框架核心（含 version-uses-module-name、log-count-skipped-test）"
  - file: "libs/test/test/usage-variants-ts/*.cpp (10 个单文件用例)"
    description: "static/shared/single-header 使用变体（含 multiunit-1/2 双 TU）"
  - file: "libs/test/test/utils-ts/*.cpp (8 个单文件用例)"
    description: "algorithm/foreach/named_params/string_cast 等工具"
  - file: "libs/test/test/test-organization-ts/*.cpp (14 个单文件用例)"
    description: "test-suite 组织/模板化用例/数据集参数化"
  - file: "libs/test/test/smoke-ts/*.cpp (4 个单文件用例)"
    description: "basic-smoke-test 1-4"
  - file: "libs/test/test/test-organization-ts/datasets-test/*.cpp (12 个 TU → 1 个可执行)"
    description: "数据集测试（上游 CMake 单目标 boost_test_datasets；12 TU 含 BOOST_TEST_MAIN 入口，无模块重复定义）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：链接 Boost::unit_test_framework 静态库，库提供 main()（ALTERNATIVE_INIT_API），消费方提供 bool init_unit_test() 注册 3 个用例"
    command: "ctest test_boost"

# test_package 实际断言数（3 个用例：CHECK_EQUAL×1 + REQUIRE_EQUAL×1 + CHECK×1 + TEST×2）
assertion_count: 6
