  notes: "clang++ 直编 Boost.Test 19 源（-std=gnu++14 -DBOOST_TEST_ALTERNATIVE_INIT_API，llvm-ar 打包）+ 内嵌上游 ts-suite 74 用例真实编译运行"

patches_applied: []

knowledge_gained:
  - "Boost 1.89.0 bootstrap.sh 工具链白名单无 OHOS（grep -ci ohos → 0），b2 不兼容（E068/E099），沿用 1.90.0 clang++ 直编方案"
  - "1.89.0 与 1.90.0 的 Boost.Test 19 源清单完全一致（对照上游 libs/test/build/CMakeLists.txt BOOST_UTF_SRC 逐项核验），unit_test_main.ipp main() 契约逐字相同（ALTERNATIVE_INIT_API → 消费方提供 bool init_unit_test()）"
  - "内嵌上游 runner 需另编默认 init API 测试库：上游 CMake boost_test_framework 目标不带 BOOST_TEST_ALTERNATIVE_INIT_API，上游自测走 init_unit_test_suite 契约；直接链接包内库会全部 undefined"
  - "上游 CMake 对非 MSVC 强加 -std=c++11，fp-multiprecision 系列需 C++14+ 类型（R04，1.90.0 实测），内嵌 runner 用 -std=c++17"
  - "干净 conan 环境运行测试可执行需注入 SDK libc++ 目录到 LD_LIBRARY_PATH（clang++ -print-file-name 自省），否则 rc=127（1.85.0 先例）"
  - "pthread_setcancelstate 补丁不需要：19 个 UTF 源均不 include sp_thread_sleep.hpp（1.84/1.85 的 0001 补丁不迁移）"
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题)
  - E099 (b2 构建系统不兼容 OHOS)

issues: []
compilation_date: 2026-09-30
compiler: clang
platform: OpenHarmony

notes: 头文件全量安装 + Boost.Test 静态库（ALTERNATIVE_INIT_API）；上游 Boost.Test ts-suite 74 用例在 build 内真实编译运行（与上游 CMake bt-unittest-* 集合一致），零强制第三方依赖
