package: boost/1.91.0.1.3
homepage: "https://www.boost.org/"

upstream_check_command: "cd <build-folder> && ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "cd <build-folder> && ctest --output-on-failure --no-tests=error"
# ▸ Review-gate fix (rule4 少报): upstream_tests enumerates EVERY executed target.
#   14 Boost.ProgramOptions programs + 4 integration leaves = 18 test targets,
#   matching what actually runs: build()/upstream-components ctest (15/15:
#   multiprecision leaf + 14 ProgramOptions), build()/upstream-iostreams ctest
#   test_fd (1/1), build()/upstream-regex ctest quick (1/1), and test_package
#   boost_graph_upstream_disjoint_set. Device evidence in
#   logs/harmony-verify/boost-1.91.0.1.3-WIN01-<sha>.log. 用例数 = 测试程序/目标数.
