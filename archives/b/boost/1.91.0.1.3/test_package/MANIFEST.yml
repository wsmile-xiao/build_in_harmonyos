upstream_test_count: 18

# Boost.Log upstream suite (libs/log/test) is declared but NOT run inside the
# build tree: it is large and platform-brittle on OHOS. The compiled Boost.Log
# runtime contract is covered by test_package boost_log_contract below
# (real text-file sink round trip via add_file_log/log_setup).
not_run_in_build:
  - file: "libs/log/test/CMakeLists.txt"
    source: "boost-1.91.0-1/libs/log/test/CMakeLists.txt"
    reason: "Large upstream suite not suitable for the OHOS build-tree gate; runtime covered by boost_log_contract"

test_package_tests:
  - file: "unit.cpp"
    description: "Redex Regex, Filesystem path, and ProgramOptions flow (3 assertions)"
    command: "boost_component_unit"
  - file: "integration.cpp"
    description: "Redex mapped-file and generic filtering-stream flow (5 assertions)"
    command: "boost_redex_iostreams"
  - file: "atomic.cpp"
    description: "Isolated Boost.Atomic link contract (2 assertions)"
    command: "boost_atomic_contract"
  - file: "date_time.cpp"
    description: "Isolated Boost.DateTime compiled dependency contract (2 assertions)"
    command: "boost_date_time_contract"
  - file: "graph.cpp"
    description: "Boost.Graph disjoint-set header and compiled Graphviz target contract (8 assertions)"
    command: "boost_graph_contract"
  - file: "multiprecision.cpp"
    description: "Redex fixed-width cpp_int_backend header and limb API contract (8 assertions)"
    command: "boost_multiprecision_contract"
  - file: "ohos_portability.cpp"
    description: "Filesystem fallback and interruption-free Boost.Thread flow (3 assertions)"
    command: "boost_ohos_portability"
  - file: "log.cpp"
    description: "clang-include-graph set: Boost.Log file-sink runtime round trip via log_setup, plus Program_options/JSON/Filesystem contract"
    command: "boost_log_contract"

test_package_test_count: 8
