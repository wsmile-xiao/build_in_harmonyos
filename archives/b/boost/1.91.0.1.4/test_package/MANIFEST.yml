# Boost.Log upstream suite (libs/log/test) is declared but NOT run inside the
# build tree: it is large and platform-brittle on OHOS. The compiled Boost.Log
# runtime contract is covered by test_package boost_log_contract below
# (real text-file sink round trip via add_file_log/log_setup).
not_run_in_build:
  - file: "libs/log/test/CMakeLists.txt"
    source: "boost-1.91.0-1/libs/log/test/CMakeLists.txt"
    reason: "Large upstream suite not suitable for the OHOS build-tree gate; runtime covered by boost_log_contract"

test_package_tests:
