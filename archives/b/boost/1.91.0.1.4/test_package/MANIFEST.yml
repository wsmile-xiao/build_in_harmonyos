package: boost/1.91.0.1.4
homepage: "https://www.boost.org/"

upstream_check_command: "cd <build-folder> && ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "cd <build-folder> && ctest --output-on-failure --no-tests=error"
# The official Accumulators Jamfile declares 49 run targets. Its valarray.cpp
# target explicitly says "fails under libc++", so OHOS/Clang/libc++ excludes it.
# The CMake Jamfile importer also omits tail.cpp's inline requirements; the
# 0002 patch registers that unmodified upstream test. Applicable inventory:
# 48 Accumulators + 18 inherited targets = 66, subject to W3 verification.
