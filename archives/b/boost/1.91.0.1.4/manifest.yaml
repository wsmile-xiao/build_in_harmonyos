software: boost
version: "1.91.0.1.4"
upstream_version: "1.91.0"
status: built
build_date: "2026-10-04"
build_system: cmake

source:
  url: "https://github.com/boostorg/boost/releases/download/boost-1.91.0-1/boost-1.91.0-1-cmake.tar.xz"
  sha256: "cc5dc5006ecbdf0051f90979be31b4eee5987d9ae14ae9fb9c03cfa43fa3cdad"

# Scope: libosl prerequisite. On top of the Boost 1.91.0.1.3
# component set (filesystem/graph/program_options/thread/regex/iostreams/
# multiprecision + chrono/container/date_time/atomic/system closure) this
# variant ADDS the compiled Boost.Log pair (log + log_setup), the compiled
# Boost.Test unit_test_framework, and the compiled Boost.JSON component
# (libboost_json; Boost.JSON 1.91 has no header-only mode in the CMake
# superproject).
build:
  system: cmake
  components:
    - accumulators
    - filesystem
    - graph
    - iostreams
    - json
    - log
    - log_setup
    - multiprecision
    - program_options
    - regex
    - test            # unit_test_framework
    - thread
  optional_iostreams_backends:
    zlib: false
    bzip2: false
    lzma: false
    zstd: false
  header_only_extra:
    asio: true    # clang-include-graph needs boost/asio/post.hpp +
                  # thread_pool.hpp; core is header-only over already-installed
                  # headers, so package() copies boost/asio(+asio.hpp) from the
                  # source tarball (asio stays out of the build closure because
                  # the superproject scanner would pull Boost.Context, which has
                  # no OHOS aarch64 asm)
  dependencies: []

patches_applied:
  - file: "patches/0001-cmake-avoid-versioned-soname-links-on-ohos.patch"
    description: "Keep stable SONAMEs without HMDFS-incompatible version symlinks"
  - file: "patches/0002-cmake-register-accumulators-tail-test.patch"
    description: "Run the unmodified upstream tail test omitted by CMake's Jamfile importer"

knowledge_used:
  - E005
  - E099
  - E127
  - E207
  - openharmony-pc-conan-test-virtual-run-env
  - openharmony-pc-cmake-soname-hmdfs
  - boost-selective-component-package-missing-header
  - boost-log-compiled-components-ohos

validation:
  status: passed
  notes: >-
    W3 boost-w3-20261004T141208Z on 10.62.201.39:2222: conan create RC 0,
    applicable upstream 66/66 (63 main CTest, Iostreams 1, Regex 1, Graph
    leaf 1), consumers 9/9 including Accumulators mean/count. The official
    Jamfile excludes valarray under libc++; the otherwise omitted tail test
    is registered by patch 0002. This is target-device validation, not
    competition-worker CI. See notes.md for the Boost.Log suite boundary.
