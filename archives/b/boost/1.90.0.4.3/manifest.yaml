validation:
  ohos:
    status: pending-device
    note: "1.90.0.4.3 与 1.90.0.4.2 同源码同补丁，唯一差异是 package_info() 组件循环补登记 serialization（零新编译）；libboost_serialization.so 自 1.90.0.2 起已在包内。本机静态 diff/preflight 通过，真机 conan create 待 shadow CI。"
  knowledge_used:
  - "1.90.0.4.2 的 BOOST_INCLUDE_LIBRARIES 已含 serialization（libboost_serialization.so 已编译进包），但 package_info() 组件循环漏登记，CMakeDeps 不生成 Boost::serialization target——sfcgal 链接失败的根因。本版仅补登记，零新编译。"
  - "Boost serialization 编译型依赖仅 system（其余 mpl/utility/typeof 全 header-only，由 Boost::headers 覆盖）。"
