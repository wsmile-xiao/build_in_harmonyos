  - "Existing boost/1.90.0 is header-only; downstream consumers need compiled program_options/filesystem/system components."
  - "Boost.Python must be built against the OHOS CPython 3.12 runtime used by eigenpy."
  - "boost/1.90.0.2 is already published with a different recipe, so this Boost.Python rebuild uses the R37 suffix version 1.90.0.2.1."
  - "Use the official Boost CMake release asset instead of Boost.Build."
  - "OHOS test_package must prepend the CPython libdir to LD_LIBRARY_PATH when running Boost.Python consumers."
  - "OHOS CI may run without SDK llvm/lib in LD_LIBRARY_PATH; Boost CMake shared-library links use -fuse-ld=/data/service/hnp/bin/ld to avoid the SDK lld libxml2 runtime dependency."
  - "Boost CMake nested header-only modules use slash names such as numeric/conversion; numeric_conversion is ignored with a configure warning."
  - "When BOOST_INSTALL_NO_VERSIONED_LIBS suppresses versioned Boost CMake install outputs, add an explicit per-target unversioned DT_SONAME so L5 can validate downstream linker addressing."
  - "Official CI's Python::Python target may expose -lintl without a matching default link path; OHOS Boost.Python smoke tests should link the discovered absolute Python_LIBRARY instead."
  - "Boost packaging PRs must not report upstream tests as zero or rely on a tiny representative subset when the release contains a large libs/*/test tree; use CMake/CTest or Boost.Build where available, and record E212-limited Python import tests separately from runtime passes."
