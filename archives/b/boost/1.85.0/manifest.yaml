software: boost
version: 1.85.0
status: built
build_system: custom
configure_options: []
build_options:
  - "手动 clang++ 编译 4 个非 header-only 库（绕过 b2）：filesystem/regex/program_options/iostreams"
  - "-std=c++17 -stdlib=libc++ -O2 -DNDEBUG -fPIC（Release）"
  - "-DBOOST_SP_NO_PTHREAD_SETCANCELSTATE（E099：OHOS musl 无 pthread_setcancelstate）"
dependencies:
  - zlib/1.3.1
knowledge_gained:
  - "Boost 1.85.0 与 1.84.0 构建方式完全一致（b2 仍不兼容 OHOS，沿用 1.84.0 手动编译方案）（ref: E099）"
  - "1.85.0 将 program_options 的 Convert.cpp 重命名为 convert.cpp（大小写变更）（ref: boost-1.85-release-notes）"
  - "sp_thread_sleep.hpp 的 pthread_setcancelstate 问题在 1.85.0 仍存在，0001 补丁仍适用（ref: E099）"
  - "OHOS conan build 干净环境下，动态链接 libc++_shared.so 的测试可执行文件需注入 SDK libc++ 目录到 LD_LIBRARY_PATH（clang++ -print-file-name 自省定位），否则 rc=127（ref: boost-1.90.0.2.1-precedent）"
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题)
  - E099 (b2 构建系统不兼容 OHOS)
issues: []
compilation_date: 2026-09-02
compiler: clang
platform: OpenHarmony

notes: 手动编译 filesystem/regex/program_options/iostreams 四个库为静态库，其余库 header-only 随头文件安装；底稿为 1.84.0 归档
