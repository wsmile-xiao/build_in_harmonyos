# test_package/MANIFEST.yml
# 上游官方测试声明文件（box2d 3.1.1）
# box2d 使用单可执行 C 单元测试（test/main.c + RUN_TEST 宏），
# 实际运行命令: ./bin/test（本机 aarch64 OHOS 交叉编译产物直接执行）

package: box2d/3.1.1
homepage: "https://box2d.org"

# 上游测试命令（CMake 构建，test 目标）
upstream_check_command: "cmake --build build-ohos -j4 && ./bin/test"

# conanfile.py build() 中未集成上游测试（测试在适配阶段独立验证）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（9 个顶层用例 + 18 个 subtest，全部通过）
upstream_tests:
  - file: test/main.c
    source: box2d-3.1.1/test/main.c
    description: "Box2D unit tests (9 RUN_TEST: BitSet/Collision/Determinism/Distance/Id/Math/Shape/Table/World, 18 RUN_SUBTEST)"
    command: "./bin/test"

# test_package 中自带的测试（消费者视角验证，调用 box2d C API）
test_package_tests:
  - file: test.c
    description: "消费者测试：创建世界/刚体/圆形碰撞体并步进，验证链接与运行时"
    command: "./test_box2d"

# 测试断言总数（上游 9 顶层用例 + 消费者测试 4 项检查）
assertion_count: 13
