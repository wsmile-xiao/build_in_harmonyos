# 版本级 manifest
# 文件位置: archives/b/box2d/3.1.1/manifest.yaml
# box2d 3.1.1 — HarmonyOS PC (OHOS aarch64) 适配

# ============================================================
# 必须字段
# ============================================================

version: "3.1.1"
software: "box2d"
status: built
build_date: "2026-09-06"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/erincatto/box2d/archive/refs/tags/v3.1.1.tar.gz"
  sha256: "fb6ef914b50f4312d7d921a600eabc12318bb3c55a0b8c0b90608fa4488ef2e4"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=ohos.toolchain.cmake"
    - "-DOHOS_STL=c++_static"
    - "-DBOX2D_UNIT_TESTS=OFF"
    - "-DBOX2D_SAMPLES=OFF"
    - "-DBOX2D_BENCHMARKS=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_AR=/data/service/hnp/bin/llvm-ar"
    - "-DCMAKE_RANLIB=/data/service/hnp/bin/llvm-ranlib"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS SDK native/llvm/bin 缺 llvm-ranlib，纯 CMake 项目须显式 -DCMAKE_RANLIB=/data/service/hnp/bin/llvm-ranlib（E429 草稿）"
  - "JC5 full 模式整仓扫描可能命中其他库基线 .ci-trigger：git rm --cached 临时隔离 + 复跑 + git reset 恢复（复用既有 DRAFT）"