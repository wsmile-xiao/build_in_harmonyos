package: box2d/2.4.1
homepage: "https://box2d.org"

upstream_check_command: "./bin/unit_test"
upstream_test_in_build: true
upstream_test_command: "./bin/unit_test"

upstream_tests:
  - file: collision_test.cpp
    source: box2d-2.4.1/unit-test/collision_test.cpp
    description: "Collision, polygon centroid, mass, and inertia checks"
    command: "./bin/unit_test"
  - file: hello_world.cpp
    source: box2d-2.4.1/unit-test/hello_world.cpp
    description: "Falling box simulation reaches the expected resting position"
    command: "./bin/unit_test"
  - file: joint_test.cpp
    source: box2d-2.4.1/unit-test/joint_test.cpp
    description: "Distance, revolute, and prismatic joint reaction checks"
    command: "./bin/unit_test"
  - file: math_test.cpp
    source: box2d-2.4.1/unit-test/math_test.cpp
    description: "Sweep and transform math checks"
    command: "./bin/unit_test"
  - file: world_test.cpp
    source: box2d-2.4.1/unit-test/world_test.cpp
    description: "World begin-contact callback and contact lifecycle checks"
    command: "./bin/unit_test"

test_package_tests:
  - file: test_package.cpp
    description: "Create a Box2D world with static and dynamic bodies, run simulation steps, and verify body state and motion"
    command: "./test_box2d"

assertion_count: 6
