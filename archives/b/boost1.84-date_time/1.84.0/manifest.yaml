software: boost1.84-date_time
version: 1.84.0
status: built
build_system: manual-compile
configure_options: []
build_options:
  - "手动编译 libs/date_time/src/gregorian/greg_month.cpp（上游向后兼容 stub，保持 libboost_date_time 可链接）"
  - "-DBOOST_ALL_NO_LIB（禁用自动链接，Conan 管理链接）"
  - "-DBOOST_SP_NO_PTHREAD_SETCANCELSTATE（绕过 OHOS musl 缺失的 pthread_setcancelstate）"
  - "build() 内绕过 b2（E068）复现 Jamfile.v2 全部测试目标：55 run + 4 compile-fail + 5 未注册可运行源 = 64 目标（含 serialization 变体测试期编译 libs/serialization/src 供链接）"
dependencies: []
knowledge_gained:
  - Boost.Date_Time 自 1.69 起 core 为 header-only，上游仅保留 greg_month.cpp 编译单元作为向后兼容 stub
  - Boost b2 构建系统在鸿蒙不兼容（E068），需手动编译编译型库
  - boost/core sp_thread_sleep.hpp 在 OHOS musl 下 pthread_setcancelstate 不可用，需 patch + 特性宏
  - 上游 date_time 测试的 serialization 变体可测试期编译 serialization 源码运行（不打包）；musl 宽 locale 下 wofstream 宽流模板实例化失败（testgreg_wstream 排除原因）；musl 无完整 std::locale facets（testformat_date_parser 排除原因）
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题)
issues:
  - b2 构建系统在 OHOS 不可用，date_time 编译单元手动编译
compilation_date: 2026-09-06
compiler: clang
platform: OpenHarmony
notes: 从 boost 1.84.0 元包拆出的 date_time 组件包（积分赛 6054），完整 boost 头文件树 + libboost_date_time.a
