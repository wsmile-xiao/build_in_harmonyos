package: boost1.84-date_time/1.84.0
homepage: "https://www.boost.org/doc/libs/1_84_0/doc/html/date_time.html"

upstream_tests:
  source: "boost 1.84.0 libs/date_time/test/（上游 Boost.Date_Time 测试树，testfrmwk.hpp 轻量框架；上游共 66 个 .cpp）"
  scope: >-
    conanfile.py build() 阶段绕过 b2（E068）复现 Jamfile.v2 注册的全部测试目标
    并真实运行：55 个 run 目标（含 8 个 serialization 变体——测试期编译
    libs/serialization/src 48 个 .cpp 供链接、不打包；含 STD_CONFIG 宏变体与
    tz_database/local_time_facet 的 csv 数据文件参数；versioning_prev 先于
    curr 运行）+ 4 个 compile-fail 目标（按上游语义编译必须失败）+ 5 个未被
    Jamfile 注册但可正常编译运行的源（testint64_range / testcurrent_day /
    testlocal_time_input_facet / posix_time/testformatters / testtime_wstream），
    共 64 个目标全部纳入。通过退出码判定，报告写入 upstream-tests-report.txt，
    任一失败即 build() 失败。
  total: 66
  included: 64
  excluded: 7
  reason: >-
    排除 7 个源（逐条理由）：self_contained_header.cpp（b2 逐头自检样板，非
    独立测试）；testfrom_facet.cpp（上游注释明确不属于官方回归套件且依赖
    boost/algorithm_ext 超组件范围）；gregorian/testfacet.cpp（引用未定义符号
    generate_locale/create_facet_def，Jamfile 未注册的上游遗留）；
    gregorian/testformat_date_parser.cpp（musl 无完整 std::locale facets，
    OHOS 平台限制）；gregorian/testgreg_wstream.cpp（宽字符流 wofstream，
    musl 宽 locale 模板实例化失败，OHOS 平台限制）；posix_time/teststreams.cpp
    （引用上游已删除的 greg_facet_creator，上游 1.84.0 自身编译错误）；
    posix_time/testperiod.cpp（上游 FILE OBSOLETE，硬编码 return 1，已被
    testtime_period.cpp 取代）。

test_package_tests:
  - file: "test_boost1_84_date_time.cpp"
    description: >-
      消费者 API 测试（移植自上游 libs/date_time/test/ 断言）：gregorian 日历
      闰年与月末天数计算、date 构造与 day_of_week/day_of_year、
      date_duration 加减、date 迭代器、first/last_day_of_the_week_in_month、
      to_iso/to_simple 格式化与 from_string 系列解析、posix_time ptime 构造
      与 time_duration 运算、跨日进位、微秒精度、特殊值 not_a_date_time、
      date_period 包含判断。
    command: "test_boost1_84_date_time"

test_package_test_count: 1
