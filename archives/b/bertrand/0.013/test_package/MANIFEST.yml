# test_package/MANIFEST.yml
# 上游官方测试声明文件 — bertrand 0.013 (header-only, CMake/CTest)

package: bertrand/0.013
homepage: "https://github.com/bernedom/bertrand"

# 上游测试入口：CMake CTest，测试目录 test/ 由 BUILD_TESTING+BERTRAND_BUILD_TESTING 控制
upstream_check_command: "cmake -DBUILD_TESTING=ON .. && cmake --build . && ctest --output-on-failure"

# conanfile.py build() 不集成上游测试（上游测试需 Catch2 + 网络下载 conan.cmake，PR 内枚举申报）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（Catch2 单可执行文件，注册用例见台账）
upstream_tests:
  - file: test/src/bertrand_tests.cc
    source: bertrand-0.013/test/src/bertrand_tests.cc
    description: "Catch2 用例：Require/Ensure/Invariant 契约宏行为"
    command: "./bertrand_tests"
  - file: test/src/in_operator_tests.cc
    source: bertrand-0.013/test/src/in_operator_tests.cc
    description: "Catch2 用例：bertrand::find::in 值成员判定"
    command: "./bertrand_tests"
  - file: test/src/text_tests.cc
    source: bertrand-0.013/test/src/text_tests.cc
    description: "Catch2 用例：契约消息输出文本"
    command: "./bertrand_tests"
  - file: test/src/failing_contract.cc
    source: bertrand-0.013/test/src/failing_contract.cc
    description: "独立可执行：违约进程中止（契约异常分支）"
    command: "./failing_contract"

# test_package 中自带的测试（消费者视角验证公开头文件 API）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：bertrand::find / Require / Ensure 公开 API"
    command: "./test_bertrand"

# 测试断言总数（Catch2 用例 + 消费者测试断言，详见最终台账）
assertion_count: 20