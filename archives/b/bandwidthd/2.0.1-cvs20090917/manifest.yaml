knowledge_gained:
  - "源码归档不含 configure；主机侧生成物通过 0002-0005 补丁固化，OHOS Conan build 不执行 autoreconf。"
  - "交叉 configure 跳过 AC_CHECK_FILE 主机路径探测，并优先检查 libpng16。"
  - "通过 AC_CHECK_DECLS 和 AC_CHECK_MEMBERS 探测公开的 _res 及 retrans/retry 成员；任一不可用时跳过非必要 resolver 调优，不引入平台宏。"
  - "Autoconf 使用 AC_USE_SYSTEM_EXTENSIONS，并直接从 netinet/tcp.h 探测 tcphdr 字段，兼容 Conan 的源码外构建目录。"
  - "头文件中的全局数组改为 extern，避免现代 clang 的重复定义链接错误。"
  - "旧式外部 inline 定义在现代 clang 下需要 -fgnu89-inline，否则链接缺少 Credit、FindIp、HostIp2CharIp。"
  - "Makefile.in 未声明 conf.tab.h 依赖，make -j2 存在竞态；配方固定 make -j1。"
  - "上游没有 check 目标，test_package 真实执行 bandwidthd --help 和 -l。"
  - "OHOS Conan build 的 Perl XS 位于 HMDFS 时会被 hmmac 拒绝 dlopen；固化 configure 避免加载该 Perl 构建链。"
  - "OHOS config.status 的 CR 规范化 sed 管道可能失败；固化 configure 对 Unix 行尾直接复制 subs1.awk，避免配置文件生成阶段中止。"
  - "HMDFS 对 umask 077 创建的 Autotools 临时目录可能拒绝当前进程写入；固化 configure 将生成 config.status 的 umask 077 改为 umask 022（E129）。"
  - "遗留 Makefile.in 未声明 VPATH；Conan 配方必须将 build folder 设为 source folder，否则源码外 make 无法解析 bandwidthd.o。"
  - "OHOS configure 的首个 clang 链接探测同时需要显式 --target=aarch64-unknown-linux-ohos 和 SDK lld 的运行库路径；配方自动发现 /data/service/hnp/ohos-sdk.org/*/ohos/native/llvm/lib 并加入 LD_LIBRARY_PATH。"
  - "graph.c 对 resolver 的 _res.retrans/retry 访问必须同时由 AC_CHECK_DECLS 和 AC_CHECK_MEMBERS 保护；部分 OHOS libc 可能声明 _res 但不提供这两个成员。"
  - "OHOS worker 的 HNP bash 在 HMDFS 构建目录中 getcwd 不可靠；配方在 OHOS configure 调用时显式使用 /bin/sh，避免 Autoconf 工作目录探测失败。"
  - "遗留 install-sh 只识别 -m 755/-m 644，而 Makefile.in 传入紧凑的 -m755/-m644；0008-install-sh.patch 补充紧凑模式解析。"
  - "OHOS worker 拒绝从 HMDFS 直接执行未签名 ELF；test_package 将已安装 bandwidthd 复制到 /data/storage/el1/base，使用 binary-sign-tool self-sign 后再执行真实 CLI 检查。"

