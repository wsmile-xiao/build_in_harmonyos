sources:
  url: "https://deb.debian.org/debian/pool/main/b/bandwidthd/bandwidthd_2.0.1%2Bcvs20090917.orig.tar.gz"
  sha256: "9e91e59a64d98c4f2ae11530e8bd8e360ad4df9168ae77fa5896ffc5953fbffb"

patches:
  - patch_file: "patches/0001-bandwidthd.h.patch"
    patch_description: "Declare shared global tables extern in the header for modern Clang linkers."
  - patch_file: "patches/0002-config.guess.patch"
    patch_description: "Refresh the stale Autoconf host guesser without running autoreconf on OHOS."
  - patch_file: "patches/0003-config.h.in.patch"
    patch_description: "Ship the autoheader output required by the pre-generated configure script."
  - patch_file: "patches/0004-config.sub.patch"
    patch_description: "Recognize the aarch64-unknown-linux-ohos build triplet."
  - patch_file: "patches/0005-configure.patch"
    patch_description: "Ship a reproducibly generated configure script, including the portable config.status substitution step and the umask 022 HMDFS workaround, so OHOS does not load Perl XS modules from HMDFS."
  - patch_file: "patches/0006-configure.in.patch"
    patch_description: "Use system extensions, probe tcphdr through netinet/tcp.h, skip host filesystem probes when cross compiling, detect libpng16, and probe resolver members."
  - patch_file: "patches/0007-graph.c.patch"
    patch_description: "Guard optional resolver tuning with both the detected _res declaration and retrans/retry members."
  - patch_file: "patches/0008-install-sh.patch"
    patch_description: "Accept compact -m755/-m644 modes emitted by the legacy Makefile.in install rules."
