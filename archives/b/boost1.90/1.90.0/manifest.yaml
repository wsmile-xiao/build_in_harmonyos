software: boost1.90
version: "1.90.0"
status: published
build_date: "2026-09-10"
build_system: manual

source:
  url: "https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.gz"
  sha256: "5e93d582aff26868d581a52ae78c7d8edf3f3064742c6e77901a1f18a437eea9"
  tar_format: tar.gz

build:
  system: manual
  configure_options: []
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: clang++
  cxxflags: "-std=c++17 -stdlib=libc++ -DBOOST_ALL_NO_LIB -DBOOST_SYSTEM_NO_DEPRECATED -DBOOST_FILESYSTEM_NO_CXX20_CHAR8_T -DBOOST_FILESYSTEM_NO_CXX20_ATOMIC_REF -DBOOST_IOSTREAMS_NO_LIB"

patches_applied: []

knowledge_gained:
  - "Boost 1.90.0 的 b2 构建系统在 OHOS 上不兼容（类似 E068/E099），与 1.84 同结论"
  - "Boost 1.90 regex 精简为 2 个源文件（posix_api/wide_posix_api），ICU 无关构建（Jamfile SOURCES 实测）"
  - "Boost 1.90 上游已原生用 __OHOS__ 守卫 pthread_setcancelstate，boost1.84 的 0001 补丁不再需要"
  - "C++17 下 std::atomic_ref 不可用，仍需 -DBOOST_FILESYSTEM_NO_CXX20_ATOMIC_REF（atomic_ref.hpp 回落到 boost::atomic_ref header-only）"
  - "boost 1.90 各库 test/Jamfile.v2 注册测试目标数（实测）：filesystem 34 / regex 37 / program_options 30 / iostreams 45，合计 N=146"
  - "上游 iostreams 测试（test-iostreams 规则）链接 /boost/test//boost_unit_test_framework + /boost/filesystem//boost_filesystem，测试需一并编译这两个库"
  - "parsers_test.cpp 在 1.90 仍稳定段错误 rc=-11（OHOS musl 环境差异，与 1.84 同结论）"
