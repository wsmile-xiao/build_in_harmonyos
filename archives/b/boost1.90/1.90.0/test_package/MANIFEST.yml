test_package_tests:
  - file: test_boost.cpp
    description: "boost filesystem+regex+program_options+iostreams: path manipulation + regex_search + parse_command_line + gzip compress/decompress round-trip"
    command: "ctest boost_test"

assertion_count: 6  # test_package 实际断言数（filesystem 1 + regex 1 + program_options 2 + iostreams 2）；上游测试 31 项见 upstream_tests 列表（N=146 注册目标中可独立运行的全集）
