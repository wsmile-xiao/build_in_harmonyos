package: boost1.90/1.90.0
homepage: https://www.boost.org/

# 上游测试说明（2026-09-10 同版本重做测试闭环，实测 boost 1.90.0 源码）
# 上游构建系统注册测试目标数 N（实测各库 test/Jamfile.v2 规则解析，非手动子集）：
#   filesystem 34（主 Jamfile 32: 28 run + 3 compile + 1 compile-fail；issues/ 2 run）
#   regex      37（run/link/compile/compile-fail 直接规则，含 3 个 regex-test 展开）
#   program_options 30（14 po-test 每个展开 static+dll 双目标=28 + rtti-off run 1 + quick 1）
#   iostreams  45（all-tests 列表：44 test-iostreams + 1 compile-fail-iostreams）
#   合计 N=146（boost b2 目标级），本配方选取可独立运行（不依赖 ICU/Windows 机制/
#   线程变体）的 run 目标 31 项真实编译运行，其余按口径豁免（见 PR 正文逐项说明）。
# Boost 自带的 B2 构建系统在 OHOS 不兼容（SHELL 执行机制失败，E068），
# 无法直接使用 b2 运行上游测试。本适配通过手动编译各库自带测试源文件
# 绕过 b2，在 OHOS 环境真实运行。
# iostreams 系列测试需要 boost_unit_test_framework 静态库：本配方已在 build()
# 按上游官方 BOOST_UTF_SRC 清单（libs/test/build/CMakeLists.txt，19 个编译单元）
# 编译 libboost_unit_test_framework.a 供测试链接（仅测试辅助，不随包发布）。
# 测试方式：clang++ -std=c++17 -stdlib=libc++ 编译各库 test/*.cpp，
# 链接到已编译的 libboost_*.a，直接运行可执行文件。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/filesystem/test/copy_test.cpp"
    description: "boost.filesystem 复制测试"
    command: "clang++ copy_test.cpp -lboost_filesystem && ./a.out"
    result: passed
  - file: "libs/filesystem/test/convenience_test.cpp"
    description: "boost.filesystem 便捷接口测试（v4）"
    command: "clang++ convenience_test.cpp -DBOOST_FILESYSTEM_VERSION=4 -lboost_filesystem && ./a.out"
    result: passed
  - file: "libs/filesystem/test/foreach_test.cpp"
    description: "boost.filesystem 遍历测试（v4）"
    command: "clang++ foreach_test.cpp -DBOOST_FILESYSTEM_VERSION=4 -lboost_filesystem && ./a.out"
