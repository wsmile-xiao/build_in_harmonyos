# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bstrlib/1.0.0
homepage: "https://github.com/websnarf/bstrlib"

# 上游无 configure/make（纯 C 源码），测试程序直接编译源码 + 测试驱动
upstream_check_command: "clang -O2 -o bstest bstest.c -I. libbstr.a && ./bstest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本地已实测 0 失败）
upstream_tests:
  - file: bstest.c
    source: bstrlib-1.0.0/bstest.c
    description: "bstrlib 核心 API 测试（bstrlib.c）"
    command: "./bstest"
  - file: testaux.c
    source: bstrlib-1.0.0/testaux.c
    description: "bstraux 扩展 API 测试（bstraux.c）"
    command: "./testaux"
  - file: test.cpp
    source: bstrlib-1.0.0/test.cpp
    description: "C++ 封装测试（bstrwrap.cpp）"
    command: "./bstrtest-cpp"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 bfromcstr/biseqcstr API"
    command: "./test_bstrlib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 600
