build:
  build_system: custom
  compiler: clang
  flags: "-W -Wall -Wshadow -Wno-unused-result -Os -g"
  parallel_jobs: 2
  notes: >-
    djb/spac build system. conf-cc/conf-ld first lines carry the profile
    compiler (tools.build:compiler_executables). Two-phase build: a native
    (PATH-resolved) compiler bootstraps crc-gentab to generate the six CRC
    lookup tables, intermediate objects are removed, then the cross/native
    toolchain from the profile builds sysdeps.h + libraries. Programs and
    man pages are not built (library package; avoids the perl-based
    cli-generate generator).

