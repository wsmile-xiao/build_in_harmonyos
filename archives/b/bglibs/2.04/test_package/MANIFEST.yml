# test_package/MANIFEST.yml — 上游官方测试声明
# 上游测试入口: selftests.sh（djb 风格自测框架）
# 静态计数: grep -l '#ifdef SELFTEST_MAIN' */*.c 于 bglibs-2.04 tarball = 118
# 每个含 SELFTEST_MAIN 的 .c 文件编译为独立测试程序，运行输出与源文件内
# SELFTEST_EXP 段逐行比对（selftest-cmp）。

package: bglibs/2.04
homepage: "https://untroubled.org/bglibs"

# 上游测试命令（真实入口；无 make check 目标，selftests 即官方机制）
upstream_check_command: "sh selftests.sh"
upstream_test_in_build: false
upstream_test_command: "sh selftests.sh"

# 上游实际运行的测试程序（118 项，清单按模块分组）
upstream_tests:
  - file: "crc/gcrc16fwd.c 等 118 个含 SELFTEST_MAIN 的源文件"
    source: "bglibs-2.04/<module>/<name>.c (crc 4, crypto 13, fmt 9, iobuf 15, misc 3, msg 5, net 19, path 3, str 36, unix 2, ...)"
    description: "djb selftest: compile with -DSELFTEST_MAIN -include selftest.c, link .libs/libbg.a, run and diff against SELFTEST_EXP"
    command: "sh selftests.sh   # 118 executed on device, 117 passed, 1 env-failed (net/connect4.c: loopback connect EPERM)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test.c"
    description: "Consumer program: str_init/copy/append/prefix/free + fmt_ulldec + crc32_block(0xCBF43926) assertions"
    command: "./test_bglibs"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 19
