# 软件级 manifest
# 文件位置: archives/b/bglibs/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: bglibs
display: "bglibs (Bruce Guenter's base function libraries)"
description: "Collection of C base libraries (str, fmt, iobuf, adt, cdb, crc, crypto, net, unix helpers) used by cvm, vmailmgr and ucspi tools"
category: library
homepage: "https://untroubled.org/bglibs"
license: "LGPL-2.1-or-later"

build_system: custom

ohos_adaptation:
  key_points:
    - "djb/spac build system: conf-cc/conf-ld first line is embedded into generated wrapper scripts; inject profile compiler via conf files (R33)"
    - "libtool is a hard build dependency (ltcompile/makeshlib); CI workers need tool_requires libtool/2.5.4"
    - "Two-phase build: native crc-gentab generates CRC lookup tables, then cross-compile the library (CI has no aarch64 execution)"
    - "choose(1) runtime feature probes degrade conservatively under cross-compilation (sysdeps.h generated per environment)"
    - "HMDFS: libtool hard-link fallback emits warnings but artifacts are correct"
  common_dependencies: []

versions:
  "2.04":
    status: built
    build_date: "2026-09-12"
