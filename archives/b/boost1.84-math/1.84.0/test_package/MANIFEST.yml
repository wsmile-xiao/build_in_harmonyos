package: boost1.84-math/1.84.0
homepage: https://www.boost.org/

# 上游测试说明
# Boost 自带的 B2 构建系统在 OHOS 不兼容（SHELL 执行机制失败，E068/E099），
# 无法直接使用 b2 运行上游测试。本适配通过手动编译 boost.math 官方测试源
# 文件 test_tr1.c（上游经 b2 以 4 种目标运行 tr1 双精度/tr1 long double/
# c C 接口双精度/c C 接口 long double）绕过 b2，在 OHOS 环境真实运行两种
# 代表性模式，报告写入 build_folder/upstream-tests-report.txt。
# 测试方式：clang -std=c99 编译 test_tr1.c，链接到已编译的 libboost_math_*.a
#（-lc++ 因库内 C++ 异常处理需要 C++ 运行时），LD_LIBRARY_PATH 注入 SDK
# libc++ 目录后直接运行。
# b2 不兼容是已知技术障碍，项目方已记录（E068/E099 错误模式）。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/math/test/test_tr1.c (float+double 模式)"
    description: "boost.math tr1/c99 官方接口测试，float+double 全量 538 断言（链接 tr1/tr1f/c99/c99f 四库）"
    command: "clang -std=c99 test_tr1.c -lboost_math_tr1 -lboost_math_tr1f -lboost_math_c99 -lboost_math_c99f -lc++ && ./a.out"
    result: passed
  - file: "libs/math/test/test_tr1.c (TEST_LD long double 模式)"
    description: "boost.math tr1/c99 long double 断言 269 项，95 项超 quad 容差——OHOS musl 的 *l 函数族为 double 精度别名（nm 验证 coshl/cosh 同地址），平台限制非适配缺陷，详见 notes.md"
    command: "clang -std=c99 -DTEST_LD test_tr1.c -lboost_math_tr1l -lboost_math_c99l -lc++ && ./a.out"
    result: failed
test_package_tests:
  - file: test_boost_math.cpp
    description: "boost.math: constants::pi(double/float) + gcd/lcm + quaternion + header-only tgamma + 编译库 tr1 beta/erf + tr1f betaf + c99 cbrt，10 组 API 断言"
    command: "ctest boost_math_test"

assertion_count: 10  # test_package 实际断言组数（constants 2 + gcd/lcm 2 + quaternion 1 + special_functions 1 + tr1 编译库 2 + tr1f 1 + c99 1）；上游 test_tr1.c 两模式 538+269 断言见 upstream_tests 列表
