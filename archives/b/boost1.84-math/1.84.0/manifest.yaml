software: boost1.84-math
version: 1.84.0
status: built
build_system: custom
build_date: 2026-09-05
compilation_date: 2026-09-05
configure_options: []
build_options:
  - "手动 clang++ 编译 boost.math 的 6 个编译库（绕过 b2）：tr1/tr1f/tr1l + c99/c99f/c99l（与 libs/math/build/Jamfile.v2 定义一致）"
  - "-std=c++17 -stdlib=libc++ -O2 -DNDEBUG -fPIC（Release）"
  - "-DBOOST_SP_NO_PTHREAD_SETCANCELSTATE（E099：OHOS musl 无 pthread_setcancelstate）"
dependencies: []
knowledge_gained:
  - "Boost.Math 的编译部分只有 libs/math/src/tr1/ 的 126 个 .cpp，按 Jamfile.v2 分为 6 库（c99/tr1 × double/float/long double），其余全部 header-only（ref: boost-1.84.0-source）"
  - "Boost.Math 不依赖 zlib（底稿 boost 因 iostreams 依赖 zlib，math 组件无此依赖，requirements 为空）（ref: boost-1.84.0-source）"
  - "test_tr1.c 是纯 C 测试（__cplusplus 未定义时走 tr1_c_macros.ipp），须用 clang C 模式编译，库内 C++ 异常要求 -lc++（ref: boost-1.84.0-source）"
  - "OHOS musl 的 long double 数学函数族（coshl/powl 等）是 double 精度别名（nm 显示与 cosh/pow 同地址），而 aarch64 clang long double 是 IEEE quad（LDBL_MANT_DIG=113）——libc 返回 double 精度无法通过 quad 容差断言，平台限制（ref: ohos-sdk-26.0.0.18-nm）"
  - "boost_beta/boost_tgamma 等 tr1 符号在 libboost_math_tr1.a，boost_cbrt 等在 libboost_math_c99.a，C++ 内联包装层调用两者（ref: boost/math/tr1.hpp）"
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题)
  - E099 (b2 构建系统不兼容 OHOS)
issues:
  - "TEST_LD 模式 95/269 断言超 quad 容差：OHOS musl long double 函数族为 double 精度别名，平台限制（非适配缺陷，普通模式 538 断言全过）"
compilation_date: 2026-09-05
compiler: clang
platform: OpenHarmony

