package: boost1.84-log/1.84.0
homepage: https://www.boost.org/

# 上游测试说明（rule4 修复：2026-09-06 真跑上游全部注册测试目标）
# 上游 libs/log/test/Jamfile.v2 test_all 规则注册的测试目标（与官方
# boost_1_84_0.tar.gz 逐一核对）：
# - [ run ] × 52（run/*.cpp 每文件一个目标，不折叠）
# - [ compile ] × 4（compile/*.cpp，self_contained_header.cpp 是 b2
#   glob-tree 按公共头展开的模板，非独立注册目标）
# - [ compile-fail ] × 1（attr_functor_void_return.cpp）
# b2 在 OHOS 不兼容（E068），conanfile.py build() 内 _run_upstream_tests
# 用 clang++ 直编直跑全部 57 个目标（模式同 boost1.84-atomic），链接
# 本包 4 库 + 元包 filesystem/regex + 测试期编译的 unit_test_framework
# (19 TU) 与 chrono (3 TU)。实测 57/57 通过（含 3 个 POSIX IPC 测试，
# OHOS musl shm_open 可用；robust mutex 无声明走上游降级路径非阻塞）。
# 报告：build_folder/upstream-tests-report.txt。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/log/test/run/*.cpp (52 targets)"
    description: "上游 [run] 测试目标 52 项：attr/filt(含 5 种 regex 后端)/form/sink_ipc/src/util(含 IPC/once_block/manip/stp) 系列全部真实编译并运行（boost.test 驱动）"
    command: "conan create（build() _run_upstream_tests 绕过 b2 逐目标编译+运行，exit 0 判过）"
    result: passed
  - file: "libs/log/test/compile/*.cpp (4 targets)"
    description: "上游 [compile] 测试目标 4 项：current_function_support/src_logger_assignable/src_logger_get_attributes/util_unique_identifier（-fsyntax-only 编译通过判过）"
    command: "conan create（build() _run_upstream_tests，编译成功判过）"
    result: passed
  - file: "libs/log/test/compile_fail/attr_functor_void_return.cpp"
    description: "上游 [compile-fail] 测试目标 1 项：functor 属性 void 返回值应编译失败（编译失败判过）"
    command: "conan create（build() _run_upstream_tests，编译失败判过）"
    result: passed

test_package_tests:
  - file: test_boost_log.cpp
    description: "trivial 全级别日志 + 自定义同步 sink/formatter/attributes + init_from_stream 设置解析 + text_file_backend 文件写入 + 元包 filesystem 依赖联动"
    command: "ctest test_boost_log"

assertion_count: 8  # test_package 实际断言数（trivial 1 + sink 2 + named_scope 1 + setup 1 + filesystem 1 + file sink 1 + 总判定 1）；上游测试 57 项目标见 upstream_tests 列表
