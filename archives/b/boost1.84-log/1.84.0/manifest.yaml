software: boost1.84-log
version: 1.84.0
status: published
build_date: 2026-09-05
build_system: manual-compile
configure_options: []
build_options:
  - "-std=c++17 -stdlib=libc++ -fPIC"
  - "-DBOOST_LOG_BUILDING_THE_LIB=1"
  - "-DBOOST_LOG_WITHOUT_EVENT_LOG -DBOOST_LOG_WITHOUT_DEBUG_OUTPUT"
  - "-DBOOST_SPIRIT_USE_PHOENIX_V3=1 -DBOOST_THREAD_DONT_USE_CHRONO=1"
  - "-DBOOST_FILESYSTEM_NO_CXX20_ATOMIC_REF 不需要（未编 filesystem）"
dependencies:
  - boost/1.84.0（headers + filesystem + regex，制品仓已有）
knowledge_gained:
  - Boost.Log 依赖 atomic（lock_pool）与 thread（tss 数据）的编译符号，需随组件包一并编译
  - dump_avx2/dump_ssse3 为 x86 专属编译单元（immintrin.h 在 aarch64 #error），与上游 b2 行为一致跳过
  - setup/posix 子目录的 .cpp include 同目录 .hpp，需额外 -Ilibs/log/src -Ilibs/thread/src -Ilibs/atomic/src
  - 本地 conan 缓存可能残留旧版二进制（符号 ABI 不一致），链接失败时先 conan remove -c 重拉
  - 上游测试（b2 绕过）：boost.test unit_test_framework 19 TU + chrono 3 TU 测试期编译即可驱动 run/ 52 个测试；BOOST_THREAD_DONT_USE_CHRONO 是库 TU 宏，测试消费端需 chrono 路径（sleep_for）；OHOS musl shm_open 可用，IPC 测试全过；robust mutex（pthread_mutexattr_setrobust）无声明，上游 #if 守卫自动降级非阻塞
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题)
issues:
  - b2 构建系统在 OHOS 不兼容（E068，元包已记录），沿用手动编译；上游测试改为 build() 内 clang++ 直编直跑 57 个注册目标（rule4 修复，2026-09-06）
compilation_date: 2026-09-05
compiler: clang 15.0.4 (aarch64-unknown-linux-ohos)
platform: OpenHarmony
notes: libboost_log.a + libboost_log_setup.a + libboost_atomic.a + libboost_thread.a 四库静态包；posix IPC 后端 + syslog 后端已编译；上游测试 57/57（run 52 + compile 4 + compile-fail 1）真跑通过
