# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: bus/3.1.11
homepage: "https://github.com/maandree/bus"

# 上游无 tests/ 目录、无 make check 目标、无测试框架（纯 Makefile 工程，已核实）
upstream_check_command: "make check (不存在: Makefile 无 check 目标，grep 核实)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的可运行程序：doc/examples/ 下 23 个示例程序（全部编译通过 23/23）
# 运行受 OHOS 沙箱 System V IPC (semget/shmget) SIGSYS 阻塞，详见回报台账
upstream_tests:
  - file: doc/examples/*/*.c (23 个示例)
    source: bus-3.1.11/doc/examples/
    description: "上游示例程序（nonblocking/timed/telephony-and-music/daemon-dependencies/audio-volume-control 五组）"
    command: "clang -I. <example>.c -L. -lbus -o <example>"

# test_package 自带消费者验证（编译+链接+运行，仅用公开头文件 bus.h 与 -lbus）
test_package_tests:
  - file: test.c
    description: "消费者用例：bus_open(不存在文件) -> -1 ENOENT（真实公开 API，可观察结果）"
    command: "./test_bus"
  - file: test_ohos.c
    description: "鸿蒙专项测试：BUS_MEMORY_SIZE + bus_open ENOENT + bus_create 往返（SysV IPC 被沙箱拦截时如实报告 PLATFORM_LIMITATION）"
    command: "./test_ohos"

assertion_count: 4
