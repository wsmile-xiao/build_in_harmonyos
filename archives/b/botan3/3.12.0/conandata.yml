sources:
  "3.12.0":
    url: "https://botan.randombit.net/releases/Botan-3.12.0.tar.xz"
    sha256: "5370f98dc15f8c222ee1ce52cd61c8756a53be0dc57cc4c1b0714d5a09ad74fb"

patches:
  "3.12.0":
    - patch_file: patches/0001-libcpp15-array-spaceship.patch
      patch_type: portability
      patch_source: https://botan.randombit.net/releases/
      patch_description: |
        OHOS clang-15 ships a trimmed libc++ whose std::array has no
        operator<=>, so classes with std::array members and a defaulted
        spaceship operator (IPv6Address, X509_Certificate::Tag,
        DER_Hash, KeyId) get an implicitly-deleted operator<=> and fail
        to compile wherever they are used as ordered-container keys.
        Replace the defaulted spaceship with a defaulted operator== and
        a hand-written operator< based on std::array's legacy
        comparison (both verified available and semantically correct
        on device).
    - patch_file: patches/0002-libcpp15-ranges-equal.patch
      patch_type: portability
      patch_source: https://botan.randombit.net/releases/
      patch_description: |
        OHOS clang-15's libc++ lacks std::ranges::equal and
        std::ranges::any_of (other ranges facilities such as
        range_value_t/begin/end and the projections used elsewhere are
        present). Replace the twelve affected calls across
        p11_interface.cpp, ec_inner_data.cpp, certstor.cpp,
        certstor_flatfile.cpp, x509_crl.cpp and x509path.cpp with the
        equivalent iterator-based std::equal/std::any_of from C++17.
    - patch_file: patches/0004-ohos-disable-func-isa-attribute.patch
      patch_type: portability
      patch_source: https://botan.randombit.net/releases/
      patch_description: |
        OHOS clang-15 misparses multi-feature target attributes on
        AArch64: a function tagged target("+crypto+aes+simd") is still
        treated as lacking "+simd", which breaks Botan's always_inline
        SIMD kernels (first seen in ghash_cpu.cpp), and arch=-prefixed
        attribute strings are rejected outright (both verified on
        device with minimal test cases). Disable BOTAN_FUNC_ISA's
        attribute path entirely; the global -march flag from the
        recipe already enables every feature these functions need and
        runtime cpuid gating still selects the kernels.
    - patch_file: patches/0003-libcpp15-tests-ranges.patch
      patch_type: portability
      patch_source: https://botan.randombit.net/releases/
      patch_description: |
        Same std::ranges gap as 0002 but in the upstream test sources:
        twelve calls to std::ranges::sort/equal/find across
        test_strong_type.cpp, test_utils_bitvector.cpp,
        test_x509_path.cpp and unit_x509.cpp are rewritten with the
        iterator-based std::sort/std::equal/std::find so the upstream
        botan-test binary compiles under OHOS clang-15's libc++ and
        the full test suite can run via make check.
    - patch_file: patches/0005-tests-tmpdir.patch
      patch_type: portability
      patch_source: https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos
      patch_description: |
        Botan's POSIX test runner hardcodes /tmp for mkstemp (read-only
        on the OHOS device). Use the TMPDIR environment variable
        (falling back to '.') as in the merged botan2/2.19.5 recipe so
        DataSinkFlush-style temp-file tests pass; the recipe exports
        TMPDIR=<build_folder> for the make check invocation.
    - patch_file: patches/0006-tests-missing-stream-includes.patch
      patch_type: portability
      patch_source: https://botan.randombit.net/releases/
      patch_description: |
        Five upstream test translation units use std::ostream operator<<
        or construct std::ostringstream/istringstream while including
        only <iosfwd> (runner/test_stdout_reporter.cpp, test_asn1.cpp,
        test_bigint.cpp, test_pubkey.cpp, test_tls.cpp). Upstream gets
        away with it through transitive includes of newer libcs; OHOS
        clang-15's trimmed libc++ does not, so the stream type stays
        incomplete and operator<< fails ("invalid operands to binary
        expression", first seen in CI build #43458). Add the missing
        <ostream>/<sstream> includes.
    - patch_file: patches/0007-tests-octetstring-span-conversion.patch
      patch_type: portability
      patch_source: https://botan.randombit.net/releases/
      patch_description: |
        OHOS libc++15's std::span container constructor (pre-LLVM-16
        implementation) only accepts containers exposing .data();
        Botan::OctetString provides begin()/end() and converts through
        the C++20 ranges-based constructor that newer libcs implement.
        test_octetstring.cpp passes OctetString values to
        Test::Result::test_bin_eq(std::span, std::span), which therefore
        finds no viable overload (CI build #44821). Add an explicit
        as_span() bridge using the iterator-pair span constructor at the
        seven affected call sites.
    - patch_file: patches/0008-tests-result-bin-eq-octetstring.patch
      patch_type: portability
      patch_source: https://botan.randombit.net/releases/
      patch_description: |
        Same pre-LLVM-16 libc++ span limitation as 0007, but fixed at the
        helper level so every current and future call site is covered:
        Test::Result::test_bin_eq gains a (string_view, OctetString,
        OctetString) overload (forward-declared in tests.h and imported
        with a using-declaration exactly like the existing BigInt import,
        implemented in tests.cpp next to the other overloads, forwarding
        through iterator-pair span construction). Fixes test_srp6.cpp,
        whose srp6_client_agree()/step2() results are SymmetricKey (=
        alias of OctetString) values compared via test_bin_eq (CI builds
        #44907 and #44994).


