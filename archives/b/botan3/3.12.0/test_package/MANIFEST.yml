package: botan3/3.12.0
homepage: https://botan.randombit.net/

upstream_test_in_build: true
upstream_tests:
  - command: "make -j1 check (runs ./botan-test with --data-dir from build_config.json)"
    cases: 396
    description: "Upstream botan-test suite counted by registration entries in src/tests: BOTAN_REGISTER_TEST (363) + BOTAN_REGISTER_TEST_FN (33) = 396 source registration sites (122 is the number of test module FILES, not cases). 367 sites are compiled into the CI build and all pass via make check (CI #45634); 29 sites are compiled out by build-time gating: 14 for the recipe-disabled Kyber/Dilithium modules (test_kyber 8, test_dilithium 4, test_ml_dsa 1, test_tls_hybrid_kem_key 1) and 15 for external dependencies/optional framework modules that configure auto-skips (tpm 2, tpm2 8, boost-asio 1, compression framework 3, jitter_rng 1). 0003 patch makes the test sources compile under OHOS clang-15 (ranges -> iterator algorithms); 0005 redirects mkstemp to TMPDIR for the read-only /tmp."

test_package_tests:
  - file: test_botan3.cpp
    description: "Link Botan 3 and assert the SHA-256 digest of a fixed payload plus a hex codec round-trip"
    command: "ctest --output-on-failure"
    result: "1/1 Passed on OHOS armv8 real machine (2026-09-08)"
  - file: test_botan3_gcm.cpp
    description: "Consumer scenario: AES-256-GCM encryption against NIST GCM Test Case 14 (known-answer ciphertext+tag), authenticated decryption round-trip, tampered-tag rejection"
    command: "ctest --output-on-failure"
    result: "Passed on OHOS armv8 real machine (2026-09-08)"

assertion_count: 6
