# 版本级 manifest — botan3 3.12.0
# 遵循 ARCHIVE-SPEC v2.0

version: "3.12.0"
software: "botan3"
status: built
build_date: "2026-09-08"
build_system: custom

source:
  url: "https://botan.randombit.net/releases/Botan-3.12.0.tar.xz"
  sha256: "5370f98dc15f8c222ee1ce52cd61c8756a53be0dc57cc4c1b0714d5a09ad74fb"
  tar_format: tar.xz

build:
  system: custom
  configure_options:
    - "python3 configure.py --cc=clang --os=linux --cpu=arm64"
    - "--build-targets=static,tests (upstream test suite compiled and run via make check)"
    - "--without-os-features=explicit_bzero (OHOS musl libc lacks explicit_bzero; falls back to volatile memset)"
    - "--cc-abi-flags=-march=armv8.2-a+crypto+sha3+sm4 (macro-gated intrinsics need command-line features; see patch 0004)"
    - "--disable-modules=kyber,kyber_90s,kyber_common,kyber_round3,ml_kem,dilithium,dilithium_aes,dilithium_common,dilithium_round3,ml_dsa (clang-15 C++20 StrongSpan failures, cf. botan 3.6.1 record)"
    - "--link-method=copy (hmdfs /storage refuses symlink creation)"
    - "--without-documentation"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - file: "0001-libcpp15-array-spaceship.patch"
    purpose: "std::array has no operator<=> in OHOS libc++15; hand-written ==/</ for IPv6Address, Tag, DER_Hash, KeyId"
  - file: "0002-libcpp15-ranges-equal.patch"
    purpose: "ranges::equal/any_of missing; 12 call sites rewritten with iterator-based std::equal/std::any_of"
  - file: "0004-ohos-disable-func-isa-attribute.patch"
    purpose: "clang-15 misparses multi-feature target attributes on AArch64; BOTAN_FUNC_ISA expanded to nothing (global -march + runtime cpuid gating cover it)"
  - file: "0003-libcpp15-tests-ranges.patch"
    purpose: "12 std::ranges::sort/equal/find calls in upstream test sources rewritten with iterator-based algorithms so botan-test compiles under OHOS clang-15"
  - file: "0005-tests-tmpdir.patch"
    purpose: "mkstemp redirected from read-only /tmp to TMPDIR (fallback '.'), as in the merged botan2/2.19.5 recipe"
  - file: "0006-tests-missing-stream-includes.patch"
    purpose: "Add missing <ostream>/<sstream> includes to five test TUs that only include <iosfwd>; OHOS libc++15's thin transitive includes leave std::ostream incomplete (CI #43458)"
  - file: "0007-tests-octetstring-span-conversion.patch"
    purpose: "OctetString -> std::span conversion via iterator-pair bridge at 7 test_bin_eq call sites; pre-LLVM-16 libc++ span container ctor requires .data() which OctetString lacks (CI #44821)"
  - file: "0008-tests-result-bin-eq-octetstring.patch"
    purpose: "Helper-level fix for the same class: test_bin_eq (string_view, OctetString, OctetString) overload in tests.h/tests.cpp; covers test_srp6's SymmetricKey results (CI #44907)"

recipe_fixes:
  - "OHOS toybox shell truncates the single long 'ar crs libbotan-3.a <objs>' command line; recipe re-creates the archive via glob when make leaves no output"
  - "Headers packaged from build/include/public into upstream layout include/botan-3 with symlinks dereferenced; cpp_info.includedirs=['include/botan-3']"
  - "test_package declares CMAKE_CXX_STANDARD 20 because the shared profile defaults to cppstd=17"

knowledge_gained:
  - "configure.py supports --without-os-features=explicit_bzero which cleanly disables BOTAN_TARGET_OS_HAS_EXPLICIT_BZERO without patching build.h"
  - "OHOS clang-15's arm_neon.h is trimmed (vrevq_* intrinsics absent) and intrinsic declarations stay macro-gated even inside target-attribute functions, so ISA features must come from -march on the command line"
  - "OHOS clang-15 rejects/ignores multi-feature target attributes on AArch64: target(\"+crypto+aes+simd\") is still treated as lacking '+simd' and arch=-prefixed strings are rejected — function-level ISA attributes are unusable on this toolchain"
  - "OHOS libc++15 lacks std::array operator<=> (LLVM 16 added it) and ranges::equal/any_of — defaulted spaceship or these algorithms on container members fail"
  - "Device /storage (hmdfs) refuses symlink creation; botan --link-method=copy required"
  - "Upstream test suite requires C++20 ranges algorithms unavailable in OHOS clang-15 libc++ (13 call sites; botan 3.6.1 recorded the same)"
  - "Static archive and all library objects land flat in build_folder root and build/obj/lib/ (out_dir == build_dir for the make builder)"

