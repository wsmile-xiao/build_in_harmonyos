software: blockhash
# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件描述
# ============================================================

name: blockhash
description: Perceptual image hash calculation tool based on Block Mean Value algorithm
category: image/hash

# ============================================================
# 软件信息
# ============================================================

license: MIT
homepage: https://github.com/commonsmachinery/blockhash
source_url: https://github.com/commonsmachinery/blockhash

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "0.1"
    status: published
    build_date: "2026-05-07"
    harmonyos_adapted: true
    changes:
      - "使用 stb_image 替代 MagickWand"
      - "版本号改为 0.3.2-harmonyos"
      - "添加 Conan 配方 (conanfile.py + conandata.yml + test_package/)"
    archive_dir: archives/b/blockhash/0.1/

# ============================================================
# HarmonyOS 适配说明
# ============================================================

harmonyos_notes:
  dependency_issue: "原版依赖 MagickWand (ImageMagick)，ImageMagick 编译在 HMDFS 上有权限问题 (E064)"
  solution: "使用 stb_image.h 单头文件库替代 MagickWand，无外部依赖"
  tested_formats: ["JPEG", "PNG", "BMP", "GIF"]

# ============================================================
# 依赖信息
# ============================================================

# 原版依赖（HarmonyOS 版本已替换）
original_dependencies:
  - ImageMagick/MagickWand (已替换为 stb_image)

# HarmonyOS 版本依赖
harmonyos_dependencies:
  - stb_image/2.29 (内嵌，无需安装)

# ============================================================
# 关键词
# ============================================================

keywords:
  - perceptual hash
  - image hash
  - blockhash
  - stb_image
  - HarmonyOS
