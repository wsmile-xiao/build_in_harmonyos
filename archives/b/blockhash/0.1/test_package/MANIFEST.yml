# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: blockhash/0.1
homepage: "https://github.com/commonsmachinery/blockhash"

# 上游测试命令
upstream_check_command: "./test.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.sh
    source: blockhash-0.1/test.sh
    description: "上游测试脚本，运行 blockhash 对 testdata 目录中的测试图片计算感知哈希"
    command: "./test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 blockhash --version 验证二进制可用"
    command: "blockhash --version"

# 测试断言总数
assertion_count: 1
