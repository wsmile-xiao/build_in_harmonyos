software: blockhash
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-07"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/blockhash/blockhash-0.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建工具
  build_tool: manual
  
  # 配置选项列表
  configure_options:
    - "使用 stb_image 替代 MagickWand（HarmonyOS 适配）"
  
  # 编译依赖列表（格式: name/version）
  dependencies:
    - stb_image/2.29 (单头文件库，已内嵌)
  
  # 编译器
  cc: clang
  cxx: clang++
  
  # 编译命令
  compile_command: "clang -O3 -DVERSION='\"0.3.2-harmonyos\"' -o build/blockhash blockhash.c -lm"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-use-stb-image.patch"

# ============================================================
# HarmonyOS 适配说明
# ============================================================

harmonyos_adaptation:
  reason: "原版依赖 MagickWand (ImageMagick)，ImageMagick 编译在 HMDFS 上有权限问题"
  solution: "使用 stb_image.h 单头文件库替代 MagickWand，无外部依赖"
  changes:
    - "移除 MagickWand 头文件引用"
    - "添加 stb_image.h（单头文件图像加载库）"
    - "修改 process_image() 使用 stbi_load()"
    - "移除 MagickWandGenesis/Terminus"
    - "版本号改为 0.3.2-harmonyos"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E064: HMDFS 上 autotools configure 有权限问题，临时目录创建失败"
  - "解决方案: 使用 clang-wrapper 自动签名 conftest 可绕过权限问题"
  - "替代方案: 使用 stb_image 替代 MagickWand 避免复杂依赖链"
  - "stb_image 是单头文件库，无需编译，直接 #include 即可使用"