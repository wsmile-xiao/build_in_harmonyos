software: binaryen
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/123/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "123"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统（顶层字段，用于自检）
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/WebAssembly/binaryen/archive/refs/tags/version_123.tar.gz"

  # 源码校验和
  sha256: "a1e1caf250cab3a83938713594e55b6762591208e82087e3337f793e8c8eb7ab"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_STATIC_LIB=ON"
    - "-DBUILD_TESTS=OFF"
    - "-DCMAKE_C_COMPILER=/data/service/hnp/bin/clang"
    - "-DCMAKE_CXX_COMPILER=/data/service/hnp/bin/clang++"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - cmake/3.28

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 动态库模式在鸿蒙平台上的 RPATH 处理错误：相对路径 ../../lib 导致二进制无法找到库"
  - "解决方案：使用静态库模式（BUILD_STATIC_LIB=ON）避免动态链接和 RPATH 问题"
  - "静态编译的二进制文件体积较大（23-24MB），但无 RPATH 问题，可直接执行"
  - "googletest 子模块未包含在源码包中，需禁用测试构建（BUILD_TESTS=OFF）"
