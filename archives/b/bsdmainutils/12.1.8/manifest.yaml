# bsdmainutils 12.1.8 适配清单
# bsdmainutils 是 Debian 维护的 FreeBSD 工具集（12.1.3 后主包变
# transitional——usr.bin 仅剩 calendar + ncal，col/column/hexdump 等已迁
# util-linux）。源码取自 Debian snapshot 官方归档（sha256 固定校验一致）。
# 依赖：ncurses/6.6（ncal 的 -ltinfo，制品仓已发布）；libbsd 绕过（主仓库
# 无 conanfile.py、制品仓无包——仿 afsctool 先例移除 -lbsd/bsd 头 include，
# 内置 OpenBSD strtonum 兼容实现，arc4random_uniform musl 自带）。

version: "12.1.8"
status: built

source:
  url: "https://snapshot.debian.org/archive/debian/20230220T144122Z/pool/main/b/bsdmainutils/bsdmainutils_12.1.8.tar.xz"
  tar_format: tar.xz
  sha256: "9e3e693b2f8ca4f3f10f0d154dac092e6251f12dc782a069a22a48c92d11bcbf"

build:
  system: makefile
  configure_options: []
  cc: clang
  notes: ".POSIX make 构建（顶层 Makefile 递归 usr.bin/calendar + usr.bin/ncal）；依赖 ncurses/6.6（-ltinfo，PkgConfigDeps 生成 ncursesw.pc）；libbsd 绕过：移除 -lbsd 链接与 -include bsd/*.h（仿 afsctool 先例）+ 内置 strtonum 兼容实现（musl 无 strtonum）+ 移除未使用的 login_cap.h include；-j1 绕 OHOS 沙箱禁 mkfifo"

patches_applied:
  - "配方内 patch（非源码修改文件）：calendar/Makefile 移除 LIBS=-lbsd 与 -include bsd/stdlib.h；ncal/Makefile 移除 -lbsd 与 -include bsd/string.h；calendar.c 移除 #include <login_cap.h>（未调用）；新增 compat_strtonum.c（OpenBSD strtonum 语义兼容实现）追加到 calendar SRC"

test:
  upstream_cases: 0
  upstream_suite: "上游无测试套件（usr.bin/calendar/test 为空目录、ncal 无测试——如实记录 0/0）"
  runnable: 0
  runnable_note: "上游无测试套件可运行（0/0 如实记录——静态库存=0 无已执行）"
  pass_rate: "0/0（上游无测试套件）"
  consumer_test: "test_package 验证 calendar + ncal 可执行 + usage 输出（真实加载）"
