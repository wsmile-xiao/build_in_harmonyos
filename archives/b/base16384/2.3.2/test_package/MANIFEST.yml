package: base16384/2.3.2
homepage: "https://github.com/fumiama/base16384"

upstream_check_command: "cmake -DBUILD=test .. && make && ctest"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: coder_test.c
    source: base16384-2.3.2/test/coder_test.c
    description: "Roundtrip encode/decode for all encode/decode variant combinations (safe/unsafe)"
    command: "./coder_test"
  - file: file_test.c
    source: base16384-2.3.2/test/file_test.c
    description: "File-based encode/decode roundtrip test"
    command: "./file_test"
  - file: wrap_test.c
    source: base16384-2.3.2/test/wrap_test.c
    description: "Wrap-function (no-flag) encode/decode roundtrip test"
    command: "./wrap_test"

test_package_tests:
  - file: test.c
    description: "Encode/decode roundtrip on known payload, verify byte-for-byte match"
    command: "./test_base16384"

assertion_count: 4
