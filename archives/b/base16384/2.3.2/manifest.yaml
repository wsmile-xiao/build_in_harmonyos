knowledge_gained:
  - "base16384 是纯 C 库，零外部依赖，用 CJK 汉字编码二进制数据（2^14 字母表）"
  - "CMake 构建系统，需 bump cmake_minimum_required 2.8.12→3.5"
  - "上游 CMakeLists.txt 无条件同时构建 SHARED 和 STATIC 库，不受 BUILD_SHARED_LIBS 控制"
  - "上游测试需 -DBUILD=test 开启，会定义 BASE16384_BUFSZ_FACTOR=1 减小缓冲区"
  - "编解码 API 以字节为单位操作，支持文件/fd/fp/stream 多种 IO 接口"
  - "GPL-3.0 许可证，需注意与依赖项目的许可证兼容性"
