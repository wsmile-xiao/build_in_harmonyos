package: boost1.84-iostreams/1.84.0
homepage: https://www.boost.org/

# 上游测试说明
# Boost.Iostreams 1.84.0 自带测试位于 libs/iostreams/test（基于
# boost.test unit_test_framework + filesystem/regex 测试夹具）。上游 B2
# 构建系统在 OHOS 不兼容（E068，Boost.Build SHELL 执行机制失败），无法用
# b2 跑 test-suite iostreams。本适配在配方 build() 中手动编译上游测试
# 源文件（clang++ -std=c++17 -stdlib=libc++，链接 libboost_iostreams.a +
# 测试期辅助库 unit_test_framework/filesystem/regex + zlib/bzip2）并真实
# 运行，统计通过率写入 upstream-tests-report.txt，与上游 test-suite
# iostreams 等价。
#
# 上游 test-suite iostreams 清单（libs/iostreams/test/Jamfile.v2，
# NO_ZLIB/NO_BZIP2 未设、非 Windows、无 LARGE_FILE_*、无 liblzma/libzstd）：
#   run 型 47 项 + compile-fail 型 1 项 = 48 项
#   - run 型含：deprecated_file_descriptor_test 带 USE_DEPRECATED 宏变体、
#     code_converter_test 附加 detail/utf8_codecvt_facet.cpp 源、
#     grep_test/regex_filter_test 链接 boost_regex、zlib/gzip/bzip2/
#     write_failure 压缩测试
#   - windows_pipe_test 为 Windows-only（<build>no <target-os>windows:<build>yes）
#   - lzma_test/zstd_test 需 liblzma/libzstd 系统库（本包未启用，同元包口径）
#   - large_file_test 需 LARGE_FILE_TEMP/KEEP 环境变量（上游条件测试）
# 本地实测：48/48 通过（47 run 编译运行全过，1 compile-fail 按预期失败）。
upstream_test_in_build: true
upstream_tests:
