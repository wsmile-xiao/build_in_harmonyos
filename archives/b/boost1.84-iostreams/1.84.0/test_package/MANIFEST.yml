    description: "boost iostreams 下游消费冒烟：gzip/zlib/bzip2 三压缩 round-trip + file_descriptor 管道 + mapped_file（CMake find_package(boost1.84-iostreams COMPONENTS iostreams) → boost1.84-iostreams::iostreams）"
    command: "ctest boost1_84_iostreams_test"

assertion_count: 11  # test_package 实际断言数（gzip/zlib/bzip2 round-trip 3 + fd 管道 1 + mapped_file 3 + 汇总输出 4）；上游测试 48 项见 upstream_tests 列表
