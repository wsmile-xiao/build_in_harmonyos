# conandata.yml — boost1.84-iostreams 1.84.0
# 单一事实来源: 官方源码 URL + SHA256 + 补丁。
#
# 源码与 boost/1.84.0 元包同源（boost_1_84_0.tar.gz 官方发行包），
# 本配方编译 libs/iostreams/src 的 5 个 TU（file_descriptor/mapped_file/
# zlib/gzip/bzip2，依据上游 libs/iostreams/build/Jamfile.v2 的 lib
# boost_iostreams 源清单 + zlib/bzip2-requirements）。

sources:
  url:
    - "https://downloads.sourceforge.net/project/boost/boost/1.84.0/boost_1_84_0.tar.gz"
    - "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.gz"
  sha256: "a5800f405508f5df8114558ca9855d2640a2de8f0445f051fa1c7c3383045724"

patches:
  # OHOS musl 无 pthread_setcancelstate（E002 同族平台限制，底稿 boost/1.84.0 已验证）。
  # iostreams TU 与下游消费者经 smart_ptr 头链触及 sp_thread_sleep.hpp，
  # 以 BOOST_SP_NO_PTHREAD_SETCANCELSTATE 特性检测宏守卫，R8 合规（非平台宏）。
  # 与元包/atomic/log/wave 组件包同款补丁。
  - patch_file: "patches/0001-ohos-pthread-cancel-fix.patch"
    patch_description: "Skip pthread_setcancelstate (not available on OHOS musl) via BOOST_SP_NO_PTHREAD_SETCANCELSTATE feature-detection macro, R8-compliant (no platform macro). Required: iostreams TUs and downstream consumers reach sp_thread_sleep.hpp through the smart_ptr header chain."
    patch_type: "portability"
