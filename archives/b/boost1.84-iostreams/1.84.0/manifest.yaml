software: boost1.84-iostreams
version: 1.84.0
status: built
build_system: manual
configure_options: []
build_options:
  - "-std=c++17 -stdlib=libc++ -fPIC -DBOOST_ALL_NO_LIB -DBOOST_IOSTREAMS_NO_LIB -DBOOST_IOSTREAMS_USE_DEPRECATED"
dependencies:
  - zlib/1.3.1（zlib.cpp/gzip.cpp 压缩后端）
  - bzip2/1.0.8（bzip2.cpp 压缩后端）
knowledge_gained:
  - Boost.Iostreams 上游 Jamfile 编译库带 BOOST_IOSTREAMS_USE_DEPRECATED（deprecated 构造/open 重载的实现守卫），元包配方漏带此宏导致符号缺失
  - iostreams 源清单 = file_descriptor/mapped_file + zlib/gzip（zlib-requirements）+ bzip2（bzip2-requirements）；lzma/zstd 按需排除
  - 上游测试三辅助库均为测试期依赖：unit_test_framework 19TU / filesystem 9TU / regex 5TU（grep/regex_filter 测试）
  - 组件包 cmake_file_name 用包名（boost1.84-iostreams）避免与元包 "Boost" 的 CMakeDeps 冲突
  - OHOS 测试运行环境：LD_LIBRARY_PATH 指向编译器自省的 SDK libc++ 目录
patches:
  - 0001-ohos-pthread-cancel-fix.patch（与元包同款：iostreams TU 经 smart_ptr 头链触及 sp_thread_sleep.hpp）
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题)
issues: []
compilation_date: 2026-09-05
compiler: clang
platform: OpenHarmony
notes: Boost.Iostreams 组件拆分包（Debian libboost-iostreams1.84 模式）；zlib+bzip2 双压缩后端；选型与实现细节见 notes.md
