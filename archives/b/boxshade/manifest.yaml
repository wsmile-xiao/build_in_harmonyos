software: boxshade
display: "BOXSHADE"
description: "Pretty-print/shade multiple sequence alignments into PostScript, EPS, HPGL, RTF, ReGIS, LJ250, ASCII, xfig, PICT and HTML"
category: utility
homepage: "https://sources.debian.org/src/boxshade/"
license: "Public Domain"
build_system: makefile

ohos_adaptation:
  key_points:
    - "1997-era C (v3.31 C port): pre-C99 sources need -std=gnu89 with OHOS clang"
    - "No default Makefile - upstream ships makefile.unx; drive it directly with CC/CFLAGS/LDFLAGS/LIBS from the Conan conf"
    - "No configure/install/test targets; single ./boxshade executable"
    - "Runtime .par/.sim/.grp shading data must sit next to the binary (BOXDIR defaults to the executable directory)"
    - "No external dependencies; W0 dependency check passes"
  common_dependencies: []

versions:
  "3.3.1":
    status: built
    build_date: "2026-09-05"
    conan_ref: "boxshade/3.3.1"
