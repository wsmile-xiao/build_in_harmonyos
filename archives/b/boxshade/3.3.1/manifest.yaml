software: boxshade
version: "3.3.1"
status: built
build_date: "2026-09-05"
build_system: "makefile"
conan_ref: "boxshade/3.3.1"

source:
  url: "https://deb.debian.org/debian/pool/main/b/boxshade/boxshade_3.3.1.orig.tar.gz"
  sha256: "bf21eeecd0c4b1fc2299854091825fb082818ed779fb7a7ac98a9994f19445b1"
  tar_format: tar.gz

build:
  system: makefile
  build_subdir: "."
  configure_options:
    - "make -f makefile.unx -j1 CC=<conan-conf-c-compiler> CFLAGS='-O2 -std=gnu89 [ohos: --target/--sysroot]' LDFLAGS='[ohos: --target/--sysroot]' LIBS=''"
  dependencies: []
  cc: clang
  cxx: N/A

patches_applied: []

knowledge_gained:
  - "boxshade 3.3.1 is a 1997-era public-domain C program (C port v3.31); Debian pool orig tarball is the authoritative 3.3.1 source; the original EMBnet homepage is defunct"
  - "2026-09-05 CI OHOS worker had no curl/SSL (https conan download failed); http on the same authoritative Debian mirror was a temporary workaround. Recipe now uses the official https URL per repo rule (maintainer AI review PR 8460), SHA256 unchanged"
  - "Sources are pre-C99 (uses gets() and implicit declarations); OHOS clang fails on bx_read.c unless compiled with -std=gnu89"
  - "Upstream ships makefile.unx only (no default Makefile, no configure, no install/test targets); drive `make -f makefile.unx` directly and pack the resulting ./boxshade"
  - "Runtime shading files (*.par/*.sim/*.grp) are searched in CWD and then in $BOXDIR, which get_logical() defaults to the executable directory - packaging them in bin/ makes the binary self-contained"
  - "No external Conan dependencies (libc only); no upstream test suite exists"
