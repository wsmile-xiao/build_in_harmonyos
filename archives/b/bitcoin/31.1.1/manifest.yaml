# manifest.yaml — bitcoin 31.1.1 版本级清单
# 位置: archives/b/bitcoin/31.1.1/manifest.yaml (与 conanfile.py 同级)
# 用途: 声明 recipe 版本、依赖、构建配置与交付状态

package: bitcoin
version: "31.1.1"
status: pending_ci  # pending_ci | built | published | failed
build_date: ""

source:
  upstream_repo: "https://github.com/bitcoin/bitcoin"
  release_tag: "v31.1"
  url: "https://github.com/bitcoin/bitcoin/archive/refs/tags/v31.1.tar.gz"
  sha256: "88afbbc865f7527ebca82c197056ecc1877b6782d0fb1fe032b12f86bdd7e39e"
  tar_format: tar.gz

build:
  system: cmake
  compiler: clang  # OHOS SDK clang 15.x
  cxx_standard: 20
  configure_options:
    BUILD_GUI: "OFF"
    WITH_ZMQ: "OFF"
    ENABLE_IPC: "OFF"
    ENABLE_EXTERNAL_SIGNER: "OFF"
    BUILD_BENCH: "OFF"
    BUILD_FUZZ_BINARY: "OFF"
    ENABLE_WALLET: "ON"
    BUILD_TESTS: "ON"
    REDUCE_EXPORTS: "ON"
    CMAKE_COMPILE_WARNING_AS_ERROR: "OFF"
    WITH_CCACHE: "OFF"
  package_strategy: "shutil.copy2 byte-level copy (NOT cmake --install; OHOS fs-verity code-sign invalidation)"

dependencies:
  - sqlite3/3.49.1
  - libevent/2.1.13
  - boost/1.84.0

patches:
  count: 46
  type: portability
  numbering: "non-contiguous (0005-0055, gaps at 0001-0004/0015-0016/0028-0030); preserved as-is to avoid conandata/file mismatch"
  notes: "see notes.md for patch categorization and gap mapping"

test:
  upstream_cases: 734
  upstream_test_binary: "test_bitcoin"
  test_package_assertions: 3
  upstream_test_in_build: true
  upstream_test_command: "./test_bitcoin --run_test=util_tests/parse_hex -- -testdatadir=<可写目录>"
  sandbox_limitations:
    - "HMDFS uid mapping causes posix_stat Permission denied on tmpdir for first serial case"
    - "First-case failure leaves global args state residual → 619 cascading AddArg SIGABRT"
    - "Isolated suite runs pass (addrman_tests, util_tests/parse_hex, allocator_tests, span_tests)"

license: MIT
homepage: "https://bitcoincore.org/"
url: "https://github.com/bitcoin/bitcoin"
