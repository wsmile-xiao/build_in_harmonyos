sources:
  # bitcoin core 27.0 官方 release（bitcoincore.org 正式包，含 configure/Makefile.in，
  # 免 autogen.sh——CI 缺 automake/libtool 也能直接 configure + make；R39 官方原始 URL）
  # bitcoincore.org 下载偶发 IncompleteRead（连接中断）——加官方备用 CDN
  # download.bitcoincore.org 镜像（内容一致，sha256 匹配）
  url:
    - "https://bitcoincore.org/bin/bitcoin-core-27.0/bitcoin-27.0.tar.gz"
    - "https://download.bitcoincore.org/bin/bitcoin-core-27.0/bitcoin-27.0.tar.gz"
  sha256: "9c1ee651d3b157baccc3388be28b8cf3bfcefcd2493b943725ad6040ca6b146b"
# bitcoincore.org 下载 IncompleteRead 中断 + download.bitcoincore.org DNS 失败
# 时的兜底镜像：gh-proxy 代理 github release tag v27.0（内容与官方一致——
# 但 github archive tar 打包方式不同 → sha256 独立，配方 source() fallback）
bitcoin-github:
  url: "https://gh-proxy.com/https://github.com/bitcoin/bitcoin/archive/refs/tags/v27.0.tar.gz"
  sha256: "d6230128637dcf0ebfac5efdde6ad86b5afb876dbd24bccbcdd98c28bac7c034"
