# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: base64/0.5.0
homepage: "https://github.com/aklomp/base64"

# 上游测试命令 (CMake 注册 2 个测试目标)
upstream_check_command: "cmake -DBASE64_BUILD_TESTS=ON .. && make && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test/CMakeLists.txt add_test 注册)
upstream_tests:
  - file: test/test_base64.c
    source: base64-0.5.0/test/test_base64.c
    description: "上游单元测试: 多组 base64 编码/解码往返、流式 API、边界长度与错误输入"
    command: "./test_base64"
  - file: test/benchmark.c
    source: base64-0.5.0/test/benchmark.c
    description: "上游基准程序: 各 codec 吞吐量测量 (ctest 注册为测试项并实际执行)"
    command: "./benchmark"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 通过公开头文件调用 base64_encode/base64_decode 验证编码解码"
    command: "./test_base64"

# 测试断言总数 (test_base64.c 内部 20+ 断言组, 近似值用于质量评估)
assertion_count: 24