software: bvi
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/bvi/bvi/1.5.0/bvi-1.5.0.src.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.in.patch"
  - "0002-bm_unix.c.patch"
  - "0003-config.guess.patch"
  - "0004-config.sub.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/bvi-1.5.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/bvi-1.5.0.work
  source_orig_hash: cc5ef4811a51f23e
  source_work_hash: f3ba211e8e9f20f7
  generated_at: '2026-06-08T20:54:59'
  patches_count: 4

patch_classification:
  - file: 0001-Makefile.in.patch
    type: platform_fix
    platform_only: true
    guard: 'none'
    description: 硬链接改为软链接（HMDFS不支持硬链接）
  - file: 0002-bm_unix.c.patch
    type: platform_fix
    platform_only: true
    guard: 'HAVE_TERMCAP_H'
    description: 添加termcap.h头文件包含
  - file: 0003-config.guess.patch
    type: platform_detect
    platform_only: true
    guard: '__OHOS__'
    description: 添加HarmonyOS/__OHOS__平台识别
  - file: 0004-config.sub.patch
    type: platform_detect
    platform_only: true
    guard: 'ohos-linux'
    description: 添加ohos-linux三元组支持
