# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: brieflz/1.3.0
homepage: "https://github.com/jibsen/brieflz"

# 上游测试命令 (cmake + ctest)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (test/test_brieflz.c, greatest.h 框架)
upstream_tests:
  - file: test/test_brieflz.c
    source: brieflz-1.3.0/test/test_brieflz.c
    description: "BriefLZ 单元测试: 10 个独立 TEST (pack_nothing/pack_zeroes/pack_numbers/pack_alternate/pack_random/pack_random_start/pack_random_end/depack_nothing/depack_safe_errors/depack_safe_random)，SUITE 按压缩级别 1..10 循环实例化，共 70 个 RUN_TEST 实例，482153 断言"
    command: "./test_brieflz"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 通过公开 API blz_compress/blz_decompress 完成压缩-解压往返校验"
    command: "./test_brieflz"

# 测试断言总数 (近似值, greatest 实测输出)
assertion_count: 482153
