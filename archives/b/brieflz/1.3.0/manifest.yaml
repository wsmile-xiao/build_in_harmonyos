# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "-DBRIEFLZ_BUILD_TESTING=ON"

  # 编译依赖列表（格式: name/version）— 0 依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁，仅配方层传参）
