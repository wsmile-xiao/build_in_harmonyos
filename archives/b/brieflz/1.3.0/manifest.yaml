# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 源）
  url: "https://github.com/jibsen/brieflz/archive/refs/tags/v1.3.0.tar.gz"

  # 源码校验和（下载实测）
  sha256: "b380611b533458514cca37d8477b3d4f8389121d7ce93cbf5b05eda062577766"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
