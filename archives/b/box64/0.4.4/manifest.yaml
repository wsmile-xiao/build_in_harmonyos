knowledge_gained:
  - "OHOS clang 默认 PIE；box64 需 -no-pie（ET_EXEC）才能启动"
  - "box64 的 malloc/mmap/dlopen 族 wrapper 被导出到 .dynsym 时会截获 OHOS musl libc 自身 PLT，导致 main 前 SIGSEGV；需 -Wl,--version-script hide17.map（local: *）隐藏"
  - "OHOS musl 无符号版本（DT_VERDEF），GetNativeSymbolUnversioned 必须改为按名查找"
  - "OHOS musl 缺 fts/obstack/error/qsort_r/scandirat/exp10/isnanf/isinff/__libc_*，需兜底；运行时 dlvsym 为 stub"
  - "设备 runtime（ld-musl）与 SDK sysroot libc.so 导出符号集不同，链接需对缺失符号本地兜底"
  - "OHOS 禁止 ptrace；启动崩溃可用 LD_PRELOAD 信号探针 + BOX64_OHOS_TRACE 检查点定位"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/box64-0.4.4.orig
