# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求存在）
package: box64/0.4.4
homepage: "https://github.com/ptitSeb/box64"

# 上游测试清点（R51 三步法，如实申报；完整证据 reports/test-report.md）
# 清点：tests/CMakeLists.txt 注册 34 项 ctest（test01–test35，14 号用例被上游
#       注释禁用；BOX32=OFF/ANDROID=OFF），guest 程序为随 tarball 预编译的
#       x86_64 ELF，输出与 refNN.txt 逐一比对。
# 实跑：ctest --output-on-failure --timeout 60 → N=34 registrations, N'=34 run,
#       0 passed。全部 34 项同一根因（非本包自身缺陷，OHOS/musl 宿主限制）：
#       guest 测试程序是动态链接 glibc x86_64 ELF，box64 在 musl 宿主上无法
#       完成 glibc guest 的 wrap（libresolv.so.2 / __libc_start_main 解析失败，
#       SIGSEGV）；上游本就未支持 musl 宿主（issue #1027/#2012），glibc guest
#       运行需要 x86_64 glibc 运行库，OHOS 设备不可得。M3/R34 冒烟改用纯
#       syscall 静态 x86_64 ELF（test_package 内生成），真实跑通。
upstream_check_command: "ctest -N"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/test01..test35
    source: box64-0.4.4/tests/
    description: "34 项 ctest（x86_64 guest 动态 ELF 实跑 + refNN.txt 比对）；N=34/N'=34/0 passed，根因=musl 宿主无法 wrap glibc guest（见上）"
    command: "ctest --output-on-failure --timeout 60"

test_package_tests:
  - file: conanfile.py
    description: "R34 行为实跑（6 断言）：box64 --version 含 Box64 arm64/v0.4.4/Dynarec 且 rc=0（清空 LD_LIBRARY_PATH）；生成 177B x86_64 hello ELF（sha256 校验）实跑 stdout=hello from x86_64 rc=0；--exit-code 7 透传"
    command: "conan create ."
  - file: ohos_specific_test.py
    description: "R53 鸿蒙特有 14 断言（pure-python ELF 解析，无需 readelf）：ELF64 LE/AArch64/ET_EXEC（-no-pie 稳定化）/PT_INTERP=ld-musl-aarch64/.codesign 段/.dynsym 不导出 malloc-mmap-dlopen 族/libfts.so.0+libobstack.so.1 随包与 $ORIGIN RUNPATH/hello 为 EM_X86_64 且 sha256 匹配"
    command: "python3 ohos_specific_test.py <package_folder> hello_x86_64"

# 测试断言总数：R53 14 + R34 行为 6 = 20
assertion_count: 20
