software: bind
# 版本级 manifest 模板
# 文件位置: archives/b/bind/9.20.22/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.20.22"

# 构建系统类型
build_system: autotools

# 编译状态
status: built

# 编译日期
build_date: "2026-05-19"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.isc.org/isc/bind9/9.20.22/bind-9.20.22.tar.xz"
  sha256: ""
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--without-libnghttp2"
  dependencies:
    - "liburcu/0.14.1"
    - "libuv/1.52.1"
    - "openssl/1.1.1w"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# 无补丁，源码使用条件编译修复平台问题

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libuv需要visibility=default以暴露内部符号"
  - "HarmonyOS不支持RTM_NEWADDR/RTM_DELADDR，需使用USE_ROUTE_SOCKET条件编译"
  - "TMPDIR必须设置为/data/storage/el2/base/cache"

# ============================================================
# 特殊说明
# ============================================================

notes:
  - "硬链接创建失败(named-compilezone)，已通过符号链接解决"
  - "核心DNS功能(named/dig/nslookup/host/rndc)全部正常"
  - "预编译包已ELF签名，可直接在HarmonyOS上运行"