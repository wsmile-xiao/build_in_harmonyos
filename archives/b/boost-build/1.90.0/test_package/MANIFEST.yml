# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: boost-build/1.90.0
homepage: "https://www.boost.org/build/"

# boost-build uses custom build system (bootstrap.sh + b2), no standard test runner
upstream_check_command: "b2 --version"

# conanfile.py build() method does not run upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# b2 self-test suite (from test/ directory) uses gcc toolset by default,
# not applicable on OHOS; core Jam tests pass with toolset=clang
upstream_tests:
  - file: test/
    source: boost-build-1.90.0/test/
    description: "B2 self-test suite (Jam language + library integration tests)"
    command: "b2 toolset=clang"

# test_package consumer-side verification: runs b2 --version
test_package_tests:
  - file: conanfile.py
    description: "Verify b2 binary is installed and reports version"
    command: "b2 --version"

# Approximate assertion count
assertion_count: 1
