software: boost-build
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.90.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.90.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型 (verify-build G4 要求顶层字段)
# cmake | autotools | makefile | meson | custom
build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/boostorg/build/archive/refs/tags/boost-1.90.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "bootstrap.sh --cxx=clang++ --cxxflags=-fPIC -O2"
    - "b2 install --prefix=$DEFAULT_PREFIX toolset=clang"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # boost-build构建说明：使用bootstrap.sh构建b2引擎，然后用b2 install安装
  # DESTDIR不被b2支持，需要手动创建staging目录

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
