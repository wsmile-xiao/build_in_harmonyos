# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: boost-sml/1.2.0
homepage: "https://boost-ext.github.io/sml/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (header-only 库，无编译产物，无上游可执行测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Boost.SML header-only consumer test — builds a minimal state machine (idle->running->X) using sml::sm/make_transition_table and verifies transitions"
    command: "./test_package"

assertion_count: 2
