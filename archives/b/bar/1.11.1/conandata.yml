sources:
  url: "https://downloads.sourceforge.net/clpbar/bar_1.11.1.tar.gz"
  sha256: "fa0f5ec5c8400316c2f4debdc6cdcb80e186e668c2e4471df4fec7bfcd626503"

patches:
  - patch_file: "patches/0001-config-guess-ohos.patch"
    patch_description: "Recognize HarmonyOS (HongMeng kernel) in the bundled 2001 config.guess, mapping aarch64 to aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-ohos.patch"
    patch_description: "Accept aarch64 CPU and linux-ohos kernel-os in the bundled config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask-000.patch"
    patch_description: "Use umask 000 for configure/config.status tmp dirs (setgid hmdfs makes umask 077 dirs unwritable)"
    patch_type: "portability"
