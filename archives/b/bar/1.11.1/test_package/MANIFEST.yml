# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: bar/1.11.1
homepage: "http://clpbar.sourceforge.net/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: test-types
    command: "make check (test-types)"
    expected: "pass — type/size assertions"
  - name: test-001
    command: "make check (test-001)"
    expected: "pass — ./test-001-pre | ./bar 2>/dev/null | ./test-001-post"
  - name: test-002
    command: "make check (test-002)"
    expected: "pass — tar-based pipe transfer test"

test_package_tests:
  - file: test.sh
    description: "bar smoke test: verify binary runs and processes a data stream"
    command: "bash test.sh"

assertion_count: 2
