# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/9.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.3.2"

# 软件名
software: "bitmagic"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/tlk00/BitMagic/archive/refs/tags/v9.3.2.tar.gz"

  # 源码校验和
  sha256: "588c118fd69cc7b863bd035c9dfef9ac74b7cdd7a12a65a5aa85ae7c677aad60"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "BitMagic is header-only: CMakeLists.txt ships an INTERFACE library with no install rule"
  - "Package via copy('*.h', src='src', dst='include'); only C++17+ and pthread (with_threads) are runtime deps"
  - "set_range(0, 1024) yields count==1025 — boundary is inclusive on both ends"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
