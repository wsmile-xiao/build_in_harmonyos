# test_package/MANIFEST.yml
# Upstream BitMagic tests are stress/perf binaries (bmtest, bmperf) — not unit
# tests with pass/fail assertions. We use a small self-contained smoke test
# that exercises the core bvector<> API (set/get/count/optimize/iterate + set
# algebra: OR/AND/XOR) on the installed headers.

package: bitmagic/9.3.2
homepage: "https://github.com/tlk00/BitMagic"

# Upstream ships stress + perf binaries, not a CTest/check suite.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package self-contained consumer test (validates installed headers).
test_package_tests:
  - file: test_bitmagic.cpp
    description: >
      Header-only smoke test: builds a bvector<>, exercises set/get/count/
      optimize/iterate, plus set algebra (OR/AND/XOR). All assertions are
      plain assert() calls — no external test framework.
    command: "./test_bitmagic"

assertion_count: 16