# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: brigand/1.3.0
homepage: "https://github.com/edouarda/brigand"

# 上游测试入口：CMake test set (test/*.cpp)，main.cpp 驱动运行时检查
upstream_check_command: "cmake --build . && ctest"

# conanfile.py build() 已集成上游测试：编译 49 个非 Boost 测试源并运行 brigand_test
upstream_test_in_build: true
upstream_test_command: "./brigand_test"

# 上游实际运行的测试程序（代表性条目）
upstream_tests:
  - file: test/always.cpp
    source: brigand-1.3.0/test/always.cpp
    description: "brigand::always/apply 编译期断言"
    command: "./brigand_test"
  - file: test/list_test.cpp
    source: brigand-1.3.0/test/list_test.cpp
    description: "list 序列操作编译期断言"
    command: "./brigand_test"
  - file: test/sort_test.cpp
    source: brigand-1.3.0/test/sort_test.cpp
    description: "sort 编译期断言"
    command: "./brigand_test"
  - file: test/for_each.cpp
    source: brigand-1.3.0/test/for_each.cpp
    description: "for_each 运行时测试（main 调用）"
    command: "./brigand_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者编译期+运行时断言（size/front/at/count/all/any）"
    command: "./test_brigand"

# 测试断言总数 (49 个编译期测试源 + 消费者断言)
assertion_count: 50
