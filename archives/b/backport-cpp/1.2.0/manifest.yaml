# 版本级 manifest
# 文件位置: archives/b/backport-cpp/1.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（packaging/ 等废弃件不创建）

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.0"

# 软件名（平台登记名 = 仓库权威包目录名，分支名门禁 feat/backport-cpp-1.2.0）
software: "backport-cpp"

# 编译状态
# published | built | failed | archived
# O5：只有合并后 release upload 已确认才 published，本任务止于 built
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag tarball；与任务平台 sourceUrl 同一文件）
  url: "https://github.com/bitwizeshift/BackportCpp/archive/refs/tags/v1.2.0.tar.gz"

  # 源码校验和（本机实测 == conan-center-index recipes/backport-cpp/all/conandata.yml）
  sha256: "8efded40a1d0e6674824336499d8706043a62bd8ae8aef62210c8c215f710b84"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

  # 上游 tag（git ls-remote --tags 实核：v1.2.0 注解标签 → commit e5184de86940aae8b61a7578ced3ac02a5639657）
  upstream_tag: "v1.2.0"
  upstream_tag_commit: "e5184de86940aae8b61a7578ced3ac02a5639657"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（配方 generate() 同源注入，CI 只读 conanfile/conandata/test_package/patches）
  configure_options:
    - "-DBACKPORT_COMPILE_UNIT_TESTS=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）——本包运行期 0 依赖
  # catch2/2.13.10 仅为上游单测在 build() 期引入（recipe requirements() 条件注入），
  # 不是包的运行依赖：package() 只交付头文件，消费者不需要 catch2。
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-qualified-destructor-names.patch"

# ============================================================
# 知识沉淀（manifest 层记录，非 knowledge/drafts 草稿）
# ============================================================

knowledge_gained:
  - "clang 15 -pedantic-errors 对类外析构函数定义报 -Wdtor-name：析构声明里的名字必须与 ~ 前的名字同作用域被找到；按 clang fix-it 补写注入类名（A<T>::A::~A()）即过，零语义变化"
  - "ohpcd 制品仓 catch2/2.13.10 只打包头文件，不含 Catch2 v2 的 contrib/Catch.cmake；上游 test/CMakeLists.txt 的 include(Catch)/catch_discover_tests 会 configure 失败——注入最小 Catch.cmake（ctpg/1.3.7 先例）不改上游源码"
  - "上游 cmake/AddSelfContainmentTest.cmake 自带 cmake_minimum_required(VERSION 3.1)，CMake 4.x 需 CMAKE_POLICY_VERSION_MINIMUM=3.5 才不报兼容性错误"

# ============================================================
# 上游测试四类数字（口径见 test_package/MANIFEST.yml 与 notes.md）
# ============================================================

test_stats:
  # 1) 上游源码静态声明（行口径，与审方数法一致）
  upstream_static_total: 194
  upstream_static_catch2_cases: 168
  upstream_static_selfcontainment: 26
  # 2) 上游当前 HEAD 同命令清点（rule4 下界）
  upstream_head_total: 194
  # 3) 本次实际执行
  upstream_executed: 194
  upstream_failed: 0
  # 4) 新增 test_package 消费者测试（鸿蒙特有测试行，不进上游分母；另 3 条编译期 static_assert 不计入）
  consumer_assertions: 35
  consumer_failed: 0
