# test_package/MANIFEST.yml — backport-cpp/1.2.0
# CI 脚本 (ci/conan/build_and_test.sh L0e) 要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md
#
# ── 上游用例数口径（与审方 pc-pr-review 数法对齐：行口径 = 含 TEST_CASE 字样的源码行）──
#   grep -rh 'TEST_CASE' test --include='*.cpp' | wc -l      → 168
#   上游当前 HEAD（169d7fa, 2025-05-06）同一命令同样          → 168（无差额）
#   头文件自包含编译用例：根 CMakeLists.txt header_files 26 条，
#     BACKPORT_COMPILE_UNIT_TESTS=ON 时生成 Backport.SelfContainmentTest OBJECT 目标逐一独立编译
#   合计 168 + 26 = 194；差额 0（26 条 header 与上游 HEAD 一致）
# 全部数字来自 2026-09-27 设备端（HarmonyOS PC aarch64 / clang 15.0.4 / C++11）实测日志，
# 原始日志摘录见 ../notes.md「上游测试原始日志摘录」；完整日志留存在任务私有目录
# $HOME/tmp/backport-cpp-1.2.0/（reports/ 被仓库 .gitignore 忽略，不入 PR）。

package: backport-cpp/1.2.0
homepage: "https://github.com/bitwizeshift/BackportCpp"

# 上游测试入口：CMake -DBACKPORT_COMPILE_UNIT_TESTS=ON → make → ctest
upstream_check_command: "cmake -S <src> -B <build> -DCMAKE_BUILD_TYPE=Release -DBACKPORT_COMPILE_UNIT_TESTS=ON && cmake --build <build> && ctest --test-dir <build> --output-on-failure"

# conanfile.py build() 已集成上游测试（BACKPORT_COMPILE_UNIT_TESTS=ON）
upstream_test_in_build: true
upstream_test_command: "conan create 内 build(): \"<build>/test/Backport.test\" --durations yes && ctest --output-on-failure"

# 上游用例总数（行口径 + 头文件自包含编译用例）
upstream_test_count: 194
upstream_test_count_command: "grep -rh 'TEST_CASE' test --include='*.cpp' | wc -l   # = 168；+ 26 个头文件自包含编译用例 = 194"

# 设备端实际执行并全部通过的用例数
upstream_test_executed: 194
upstream_test_executed_command: "ctest --test-dir <build> --output-on-failure   # 1/1 聚合用例通过（其内含 Catch2 168 用例 + SelfContainmentTest 26 头编译）"

# 未执行 = 0（上游全部测试入口都在 build() 内执行）
upstream_test_unexecuted: 0
upstream_test_unexecuted_reason: "无：168 个 Catch2 TEST_CASE 与 26 个头文件自包含编译用例全部执行"

# ── 计数单位与口径 ───────────────────────────────────────────────
# 单位 = 上游测试用例（Catch2 TEST_CASE 行 168 + 头文件自包含编译用例 26）。
# ohpcd 的 catch2/2.13.10 未打包 contrib/Catch.cmake，配方按 ctpg/1.3.7 先例注入最小
# Catch.cmake ⇒ ctest 注册为 1 个聚合用例；Catch2 运行期自报口径由 build() 直跑
# （--durations yes）采集，逐用例名与耗时完整落进 reports/conan-create.log。
# 实测（2026-09-27，设备原生 clang 15.0.4，C++11）：
#   Backport.test --durations yes → 168 个用例逐行打印 + Catch2 汇总行（0 failed）
#   ctest --output-on-failure      → 100% tests passed
#   SelfContainmentTest            → 26 个头逐一独立编译通过（OBJECT 目标编译成功）

upstream_tests:
  - file: test/src/bpstd/variant.test.cpp
    source: BackportCpp-1.2.0/test/src/bpstd/variant.test.cpp
    description: "variant 单元测试（46 个 TEST_CASE）"
    command: "\"<build>/test/Backport.test\" \"variant\" --durations yes"
  - file: test/src/bpstd/string_view.test.cpp
    source: BackportCpp-1.2.0/test/src/bpstd/string_view.test.cpp
    description: "string_view 单元测试（31 个 TEST_CASE）"
    command: "\"<build>/test/Backport.test\" \"string_view\" --durations yes"
  - file: test/src/bpstd/optional.test.cpp
    source: BackportCpp-1.2.0/test/src/bpstd/optional.test.cpp
    description: "optional 单元测试（27 个 TEST_CASE）"
    command: "\"<build>/test/Backport.test\" \"optional\" --durations yes"
  - file: test/src/bpstd/span.test.cpp
    source: BackportCpp-1.2.0/test/src/bpstd/span.test.cpp
    description: "span 单元测试（21 个 TEST_CASE）"
    command: "\"<build>/test/Backport.test\" \"span\" --durations yes"
  - file: test/src/bpstd/any.test.cpp
    source: BackportCpp-1.2.0/test/src/bpstd/any.test.cpp
    description: "any 单元测试（18 个 TEST_CASE）"
    command: "\"<build>/test/Backport.test\" \"any\" --durations yes"
  - file: test/src/bpstd/{complex,exception,functional,iterator,memory,tuple,utility}.test.cpp
    source: BackportCpp-1.2.0/test/src/bpstd/
    description: "其余 7 个测试源（complex 6 + exception 1 + functional 2 + iterator 1 + memory 5 + tuple 6 + utility 4 = 25 个 TEST_CASE）"
    command: "\"<build>/test/Backport.test\" --durations yes"
  - file: CMakeLists.txt (header_files 26 条) + cmake/AddSelfContainmentTest.cmake
    source: BackportCpp-1.2.0/cmake/AddSelfContainmentTest.cmake
    description: "头文件自包含编译用例：26 个公开头逐一独立编译（Backport.SelfContainmentTest OBJECT 目标）"
    command: "cmake --build <build> --target Backport.SelfContainmentTest"

# test_package 中自带的测试（消费者视角验证，不进上游分母）
consumer_test_count: 35
test_package_tests:
  - file: test_backport_cpp.cpp
    description: "消费者测试：一个 TU 包含全部 16 个公开头 + 35 条运行期断言（CHECK 宏逐条真实求值），程序自报 PASS: 35/35；另有 3 条编译期 static_assert 只做编译期保障、不计入运行期总数"
    command: "./test_backport_cpp"

# 测试断言总数（消费者测试）
assertion_count: 35
