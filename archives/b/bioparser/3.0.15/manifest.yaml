# 版本级 manifest
# 文件位置: archives/b/bioparser/3.0.15/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.15"

# 软件名
software: bioparser

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag 3.0.15，无 v 前缀；CI 会自动附加镜像 fallback）
  url: "https://github.com/rvaser/bioparser/archive/refs/tags/3.0.15.tar.gz"

  # 源码校验和
  sha256: "950be627244aa4817d7ad58abcddaaa0b6cddc74b05b7ff3f4c4b51f792bb7b5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（四项候选均命中既有条目，七轴查重无新增差异，路径 A 复用）
knowledge_gained:
- "GitHub tag 名可能不带 v 前缀（bioparser 3.0.15），须用 releases/tags API 核实真实 tag 再拼归档 URL（opencsg 草稿覆盖）"
- "CMake 4.x 移除对 cmake_minimum_required < 3.5 的兼容，可用 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 兼容旧项目（E187/E103 覆盖）"
- "conandata.yml 注释中不得写裸 https URL：CI predl 预下载会提取任意 URL 并做 file:// 子串改写，污染后 conan create 失败（E333/E415/DRAFT-VENDP 覆盖）"
- "W3 junk_check 在分支零提交时回退 full 整仓扫描，会命中其他库历史遗留运行时文件；按基线隔离流程 git rm --cached 临时隔离、复跑、原样恢复（DRAFT-libfort/dr_mp3 覆盖）"
