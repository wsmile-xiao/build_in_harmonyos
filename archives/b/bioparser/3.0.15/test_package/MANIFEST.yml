# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: bioparser/3.0.15
homepage: "https://github.com/rvaser/bioparser"

# 上游测试命令 (CMake 构建，gtest 注册)
upstream_check_command: "cmake --build . --target bioparser_test && ./bin/bioparser_test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（单一可执行，gtest 注册 35 用例）
upstream_tests:
  - file: test/parser_test.cpp
    source: bioparser-3.0.15/test/parser_test.cpp
    description: "Parser::Create 工厂用例（1 个 TEST）"
    command: "./bin/bioparser_test"
  - file: test/fasta_parser_test.cpp
    source: bioparser-3.0.15/test/fasta_parser_test.cpp
    description: "FASTA 解析用例（10 个 TEST_F，含 gz 压缩）"
    command: "./bin/bioparser_test"
  - file: test/fastq_parser_test.cpp
    source: bioparser-3.0.15/test/fastq_parser_test.cpp
    description: "FASTQ 解析用例（6 个 TEST_F，含 gz 压缩）"
    command: "./bin/bioparser_test"
  - file: test/mhap_parser_test.cpp
    source: bioparser-3.0.15/test/mhap_parser_test.cpp
    description: "MHAP 解析用例（6 个 TEST_F，含 gz 压缩）"
    command: "./bin/bioparser_test"
  - file: test/paf_parser_test.cpp
    source: bioparser-3.0.15/test/paf_parser_test.cpp
    description: "PAF 解析用例（6 个 TEST_F，含 gz 压缩）"
    command: "./bin/bioparser_test"
  - file: test/sam_parser_test.cpp
    source: bioparser-3.0.15/test/sam_parser_test.cpp
    description: "SAM 解析用例（6 个 TEST_F，含 gz 压缩）"
    command: "./bin/bioparser_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：仅用公开头文件调用 Parser::Create/Parse 解析 FASTA"
    command: "./test_bioparser sample.fasta"

# 测试断言总数 (上游 35 用例 + 消费者可观察断言)
assertion_count: 35
