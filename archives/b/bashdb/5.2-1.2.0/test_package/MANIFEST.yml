# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bashdb/5.2-1.2.0
homepage: https://bashdb.sourceforge.net/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check SHELL=bash MAKEINFO=true LOG_COMPILER=bash"

# make check 实际运行的测试套件
upstream_tests:
  - name: "unit"
    source: bashdb-5.2-1.2.0/test/unit/
    description: "shunit2 单元测试（25 个用例，覆盖 require/alias/break/sort/validate 等）"
    command: "make -C test/unit check"
  - name: "integration"
    source: bashdb-5.2-1.2.0/test/integration/
    description: "集成测试（46 个用例，覆盖 break/watch/step/backtrace/info 等调试器命令）"
    command: "make -C test/integration check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "bashdb --version + 实际调试一个 bash 脚本（非交互 quit）"
    command: "bash test.sh"

# 测试断言总数 (近似值)
assertion_count: 200
