software: bashdb
display: "bashdb"
description: "GNU bash 调试器，交互式调试 bash 脚本（断点/单步/变量查看等）"
category: development
homepage: "https://bashdb.sourceforge.net/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure.ac bash 版本检查需扩展支持 5.2/5.3（制品仓 bash 为 5.3）"
    - "HarmonyOS 拒绝通过 shebang 直接 exec 脚本文件，bashdb 需用 bash 显式执行"
    - "/dev/fd 不可访问，bash 进程替换需改为 here-string"
    - "/tmp 只读，调试器临时目录默认使用 $TMPDIR"
    - "config.status 的 mktemp -d 权限异常，需 mktemp wrapper 强制 mkdir fallback"
  common_dependencies:
    - bash

versions:
  "5.2-1.2.0":
    status: published
    build_date: "2026-08-14"
