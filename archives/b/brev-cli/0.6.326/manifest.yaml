software:
  name: brev-cli
  display: Brev CLI
  category: network
  description: Cloud development environment connector

version:
  number: 0.6.326
  status: built

build:
  system: go
  configure_options: []
  date: 2026-06-08
  go_version: 1.26.1
  cgo_enabled: false
  build_tags: ["!nvml"]

artifacts:
  binaries:
    - bin/brev
  size: 39M

dependencies:
  runtime:
    - go-runtime (optional)

special_notes:
  - NVML support disabled (requires CGO and NVIDIA libraries)
  - Pure Go build for portability
  - May need ELF signature on HongMeng systems
