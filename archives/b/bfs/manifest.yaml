software: bfs
display: "Breadth-First Search (bfs)"
description: "广度优先版本的 UNIX find 命令，以广度优先顺序遍历文件系统"
category: utility
homepage: "https://github.com/tavianator/bfs"
license: ISC
build_system: custom

ohos_adaptation:
  key_points:
    - "使用非标准 configure 脚本（shell wrapper + makefile-based）"
    - "需禁用 statx syscall（HarmonyOS 对特殊文件描述符支持不完善）"
    - "使用 INSTALL=ginstall 参数"
  common_dependencies:
    - "ginstall (GNU coreutils)"

versions:
  "4.1":
    status: built
    build_date: "2026-06-15"
    source_url: "file:///storage/Users/currentUser/tmp/downloads/bfs-4.1.tar.gz"
    runtime_fixed: true