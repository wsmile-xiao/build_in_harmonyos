# 版本级 manifest — bart-view 0.3.00
# 文件位置: archives/b/bart-view/0.3.00/manifest.yaml
# 遵循 ARCHIVE-SPEC

version: "0.3.00"
software: "bart-view"

# 编译状态: built = conan create/conan-verify 通过，尚未 conan upload 到制品仓
status: built

# 编译日期
build_date: "2026-10-10"

# 构建系统
build_system: "makefile"

# 源码信息
source:
  url: "https://github.com/mrirecon/view/archive/refs/tags/v0.3.00.tar.gz"
  sha256: "6a5b564adeb4efbba5259366caa91d64e220cff32edb49e61081cdcb5350c24b"
  tar_format: tar.gz

# 构建配置
build:
  system: makefile
  configure_options:
    - 'BART_TOOLBOX_PATH=<vendored BART v1.0.00 源码目录>  # bart-view Makefile 用其定位 src/ 头文件与 lib/*.a'
    - 'CC=<OHOS clang，来自 tools.build:compiler_executables>'
    - 'CFLAGS=-O2 -std=c11 -fopenmp -fblocks -Wall'
    - 'LDFLAGS=<gtk/libpng/fftw3f/openblas 库路径 + compat/blocks_runtime_stub.o>'
    - 'PKG_CONFIG_PATH=<PkgConfigDeps 生成目录>  # 供 pkg-config gtk+-3.0'
  dependencies:
    - gtk/3.24.43
    - libpng/1.6.58
    - fftw3f/3.3.9
    - openblas/0.3.33
  cc: clang
  cxx: clang++

# vendored 依赖（BART 工具箱未以 Conan 包发布）
vendored:
  bart:
    url: "https://github.com/mrirecon/bart/archive/refs/tags/v1.0.00.tar.gz"
    sha256: "cf8ae4ba5d8152d269b059342e57df4e4a303cae15a122095141d69fddeaf9df"
    reason: "bart-view 链接 BART 静态库（misc/geom/num）并包含其头文件；制品仓 bart/1.0.00 为 application 包仅导出 bin/bart"

# 补丁信息（源码级适配在 conanfile.py build() 内以精确文本替换完成，见 notes.md）
patches_applied: []

# 测试结果
test_results:
  type: conan-create + conan-verify + CI 模拟
  total: 11
  passed: 11
  failed: 0
  note: "conan create exit=0；鸿蒙特有测试 test_cfl2png.py 11/11 通过（100%）。上游无自动化测试，仅 `make all` 构建入口。"

# 知识沉淀
knowledge_gained:
  - "bart-view 的 Makefile 经 BART_TOOLBOX_PATH 链接 BART 工具箱静态库（libmisc/libgeom/libnum）+ 头文件；制品仓的 bart/1.0.00 为 application 包只导出 bin/bart，下游无法用它链接——需要 vendored BART 源码或另立 toolbox 包"
  - "BART v1.0.00 从 src/misc/misc.h 删除 UNUSED 宏（v0.9.00 及以前存在），而 bart-view v0.3.00 的 view.c/draw.c 依赖它（README 要求 BART>=0.8.00）——bart-view 0.3.00 与 BART 1.0.00 上游并不自洽，需恢复该宏"
  - "BART 头文件 misc/nested.h 用 clang blocks（^）实现嵌套函数，编译需 -fblocks，链接需 libBlocksRuntime；鸿蒙无该库 → 最小 stub 提供 _NSConcreteStackBlock/_Block_copy/_Block_object_assign 等符号即可"
  - "clang 15 对 BART 源码比 GCC 严格：label at end of compound statement、case 标签后带初始化器声明（需块作用域）、C23 [[fallthrough]] 属性在 gnu17 不识别——需精确文本补块/替换"
  - "musl 的 strings.h 不声明 rindex()（BSD 遗留），cfl2png.c 直接使用会因隐式声明返回 int 触发 -Wint-conversion 错误（clang 15）→ 改 strrchr()"
  - "GTK3 经 PkgConfigDeps 生成 .pc 文件后必须显式设置 PKG_CONFIG_PATH（PkgConfigDeps 自身不写该环境变量），否则裸 Makefile 的 `pkg-config gtk+-3.0` 取不到 cflags/libs"
