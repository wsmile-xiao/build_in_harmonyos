# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bart-view/0.3.00
homepage: "https://github.com/mrirecon/view"

# 上游仓库无任何测试框架/测试用例：仅 src/ 源码 + 裸 Makefile，
# .gitlab-ci.yml 只执行 `make all`（构建 view / cfl2png），无 test/ 目录、
# 无 ctest/utest 目标。故 upstream_tests 为空。
upstream_check_command: "make all"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试（消费者视角，R34 实际执行被测包二进制）
test_package_tests:
  - file: test.c
    description: "L0c 测试源文件载体（application 包无库 API，编译验证消费者侧工具链）"
    command: "clang test.c -o test_bart_view"
  - file: test_cfl2png.py
    description: >
      鸿蒙特有测试：用自实现 PNG 解码器（chunk+CRC+zlib+反滤波）读出 cfl2png 实际
      写出的像素，与独立推算的真值逐像素比对——绝对窗口 256 像素零容差、相对窗口
      自动求 max(|diff|<=1 且单调)、翻转 -FZ 零容差、viridis 色图端点、全零数据、
      缩放尺寸、确定性、非法窗口被拒；另验证 view 无 DISPLAY 下 GTK3 依赖栈加载。
    command: "python3 test_cfl2png.py <package_bin_dir>"

# 断言总数：23 项命名检查 + 1283 次逐像素真值比较（实测输出）
assertion_count: 1306
