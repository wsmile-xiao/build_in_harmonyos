# 软件级 manifest — bart-view
# 文件位置: archives/b/bart-view/manifest.yaml

software: bart-view
display: "bart-view"
description: "BART 工具箱配套图像查看器（view：GTK3 多维图像查看；cfl2png：CFL 数据集导出 PNG）"
category: gfx
homepage: "https://github.com/mrirecon/view"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "BART 工具箱未以 Conan 包发布（bart/1.0.00 仅导出 bin/bart）→ 构建期 vendored BART v1.0.00 官方源码并就地构建 libmisc.a/libgeom.a/libnum.a"
    - "BART 源码的 clang 兼容修复（label-at-end、case 后声明块作用域、opts.c/mmio.c 精确块）随 vendored 构建应用"
    - "BART 1.0.00 删除 misc.h 的 UNUSED 宏（0.9.00 及以前存在），bart-view 依赖该宏 → vendored BART 构建期恢复"
    - "clang -fblocks（BART misc/nested.h 嵌套函数用 blocks）+ 鸿蒙无 libBlocksRuntime → compat/blocks_runtime_stub.c 提供 _Block_* 符号"
    - "cfl2png.c 的 rindex() 在 musl 未声明 → 改为标准等价 strrchr()"
    - "GTK3 经 PkgConfigDeps 生成 gtk+-3.0.pc，PKG_CONFIG_PATH 显式注入 Makefile 的 pkg-config 调用"
  common_dependencies:
    - gtk
    - libpng
    - fftw3f
    - openblas

versions:
  "0.3.00":
    status: built
    build_date: "2026-10-10"
