software: bluefish
display: "Bluefish GTK3 web/programming editor"
description: "Bluefish is a GTK3 editor for experienced web designers and programmers"
category: editor
homepage: "https://bluefish.openoffice.nl"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "bluefish 2.2.16 configure defaults to GTK3 (gtk+-3.0 >= 3.2.2); GTK2 is only an explicit --with-gtk2 fallback, so the published GTK3 chain is used and no GTK2 package is needed"
    - "Builds from the official release tarball with its shipped Autotools files (no autoreconf)"
    - "Adds OHOS support to config.guess/config.sub and an HMDFS-safe umask to configure"
    - "Adds a headless --selftest option (14 production-code checks) because HarmonyOS PC has no X server for GUI testing"
    - "Self-signs the packaged GUI executable and self-signs gdk-pixbuf-csource (unsigned ELF in the Conan package) which the Makefiles run to embed PNG icons as C arrays"
  common_dependencies:
    - gtk
    - glib
    - gdk-pixbuf
    - libxml2

versions:
  "2.2.16":
    status: built
    build_date: "2026-09-05"
    conan_ref: "bluefish/2.2.16"
    note: "GTK3 editor; runtime GUI requires an X/Wayland server which HarmonyOS PC does not provide — delivered and verified at compile/link level plus headless self-test"
