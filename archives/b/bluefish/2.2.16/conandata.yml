# conandata.yml — bluefish 2.2.16
# Official release tarball from the bluefish project's stable source area
# (bluefish.openoffice.nl download mirror). sha256 verified over two
# independent downloads (bennewitz mirror + sourceforge mirror, identical).

sources:
  url: "https://www.bennewitz.com/bluefish/stable/source/bluefish-2.2.16.tar.bz2"
  sha256: "14e6476fcee8fa326f7f63f1f693d252195f9dcb16af0fe3c915c499baf5dd74"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    strip: 1
    patch_description: "Teach the 2018 config.guess the HarmonyOS uname tuple so configure can guess the build type natively"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    strip: 1
    patch_description: "Accept the linux-ohos OS in the bundled config.sub (aarch64-unknown-linux-ohos)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    strip: 1
    patch_description: "Create config.status temporary directories with umask 022 (HMDFS setgid semantics reject 0700 dirs)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-bluefish.c.patch"
    strip: 1
    patch_description: "Add a headless --selftest option (runs before the GTK display opens) covering bf_lib config-encoding/string helpers, wordcount, integer parsing, libxml2 parsing, and GLib/GTK version bindings"
    patch_type: "test"
