package: bluefish/2.2.16
homepage: "https://bluefish.openoffice.nl"

upstream_tests_exist: false
upstream_test_audit:
  - source: "bluefish-2.2.16 release tarball"
    reason: "No tests/, test/, or t/ directory is present in the release tarball."
  - source: "Makefile.am / configure.ac (2.2.16 source tree)"
    reason: "No TESTS, check_PROGRAMS, XTEST, or AC_CONFIG_TESTDIR targets exist. The only check-local targets are: data/bflang/Makefile.am has its check-rng/check-bflang2 target commented out; man/Makefile.am has an empty check-local; desktop-data/Makefile.am has check-local that merely depends on the bluefish.desktop file being built (not a test executable)."
  - source: "VCS layout mirrors the release tarball"
    reason: "Bluefish does not ship an automated test suite with releases; development-time checks exist only in VCS checkouts behind --enable-development."
  - conclusion: "Upstream provides no automated test suite; the adaptation therefore adds programmatic headless tests without presenting them as upstream coverage."

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_bluefish.sh
    description: "Package presence: the installed bin/bluefish exists and is executable."
    command: "sh test_bluefish.sh <package>/bin/bluefish"
  - file: test_bluefish.sh
    description: "Upstream CLI contract: --version exits 0 and prints the exact 'Bluefish Editor 2.2.16' banner."
    command: "bluefish --version"
  - file: test_bluefish.sh
    description: "Upstream CLI contract: --help exits 0 and lists Usage plus --version and the adaptation's --selftest option."
    command: "bluefish --help"
  - file: test_bluefish.sh
    description: "New headless --selftest: 14 production-code checks (rcfile config value codec round trips, bf_lib string repeat/truncate, word count incl. UTF-8/empty, integer parsing incl. error path, libxml2 parse success/failure, GLib/GTK runtime version) must all PASS and the summary must read 'self-test: PASS'."
    command: "bluefish --selftest"
  - file: test_bluefish.sh
    description: "New no-display error path: without an X server (the HarmonyOS PC reality) the GUI launch must fail closed with the GTK 'Cannot open display' diagnostic, proving the packaged binary loads and initialises the GTK3/GLib stack it links."
    command: "bluefish"

test_scenario_count: 5
assertion_count: 28
assertion_count_basis:
  package_presence: 2
  upstream_cli_contract: 7
  adaptation_selftest: 17
  no_display_error_path: 2
  notes: "The 17 self-test assertions include the 14 individual production checks printed by bluefish --selftest plus its exit code, the per-check PASS line count and the summary line asserted by the shell harness."
