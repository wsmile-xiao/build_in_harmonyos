test_results:
  type: headless-binary-validation
  total: 28
  passed: 28
  failed: 0
  reason: "PASS for the installed aarch64 binary: 14 production self-test checks inside bluefish --selftest plus upstream CLI (--version/--help) assertions and the expected no-display failure path. GUI interaction cannot be automated because HarmonyOS PC has no X server; GUI code is delivered compiled and linked (proof: GTK3 display initialisation runs and fails closed with 'Cannot open display'). Upstream ships no automated tests (no tests/ dir, no TESTS/check_PROGRAMS in any Makefile.am)."

knowledge_gained:
  - "bluefish 2.2.16 (C, autotools) is a GTK3-first release: configure defaults to 'gtk+-3.0 >= 3.2.2' and only falls back to GTK2 (--with-gtk2) when GTK3 is absent. Task premise '2.2.x = GTK2 only' is refuted by configure.ac; the published GTK3 chain fully covers it, no GTK2 package is needed."
  - "2.2.16's config.guess/config.sub (2018-02 vintage) do not know HarmonyOS; the tarball config.guess must echo+exit for the HarmonyOS branch (older revisions use that style) and config.sub needs the linux-ohos OS+kernel rows."
  - "Autoconf 2.71 config.status creates its working directory with umask 077; HMDFS setgid semantics then make it unusable ('can't create ./confXXXX/subs1.awk: Permission denied'), so configure must create it with umask 022. Missing this patch fails conan create exactly at config.status time."
  - "bluefish embeds PNG toolbar icons at build time: Makefiles run $(GDK_PIXBUF_CSOURCE) --raw --extern --build-list ... > htmlbar_icons.c; on OHOS the Conan gdk-pixbuf tool is an unsigned ELF that cannot run from the cache, so configure reports 'gdk-pixbuf-csource... no' and the generated C array is missing (undeclared pixmap_* symbols). Copy + self-sign the tool into a build-tree host-tools dir and point GDK_PIXBUF_CSOURCE at it."
  - "bluefish configure probes pkg-config module names gdk-3.0 and gio-unix-2.0 that PkgConfigDeps does not emit; alias .pc files (same Libs/Cflags as gtk+-3.0/gio-2.0) satisfy the probes without double linking."
  - "Upstream has no automated tests (no tests/ directory; the only check-local targets are man's empty one and desktop-data's bluefish.desktop existence check; data/bflang's check-rng target is commented out)."
  - "bluefish --version/--help exit before the GTK display is opened, so they are headless-safe; the plain GUI launch fails closed with 'Cannot open display' (non-zero rc) which is the expected HarmonyOS PC behaviour."

