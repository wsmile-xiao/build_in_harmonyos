software: bibtex
display: "BibTeX"
description: "BibTeX 参考文献处理器 — 从 TeX Live web2c 构建的文献引用工具"
category: typesetting
homepage: "https://tug.org/bibtex"
license: "Knuth License (public domain)"
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 需添加 HarmonyOS (__OHOS__) 检测分支"
    - "HMDFS 文件系统上 mktemp -d 不支持，需用 mkdir 替代"
    - "三层 configure: kpathsea → web2c → web2c/web2c"
    - "CONFIG_SHELL 由 Conan profile 设置，无需手动 os.environ"
    - "config.sub 在 trunk 版本已包含 ohos* 支持，无需额外补丁"
  common_dependencies: []

versions:
  "0.99e":
    status: published
    build_date: "2026-08-24"
