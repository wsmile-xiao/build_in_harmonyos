# 版本级 manifest
# 文件位置: archives/b/bibtex/0.99e/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.99e"

# 软件名
software: "bibtex"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-24"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (R39: 官方源)
  url: "https://github.com/TeX-Live/texlive-source/archive/refs/heads/trunk.tar.gz"

  # 源码校验和
  sha256: "f89edb8a916bb1cb570796214788ffeb1d3c0b512fe124796e2b7d4591785513"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$PREFIX"
    - "--without-x"
    - "--disable-tex"
    - "--disable-mf"
    - "--disable-mf-nowin"
    - "--disable-aleph"
    - "--disable-hitex"
    - "--disable-pdftex"
    - "--disable-luatex"
    - "--disable-texprof"
    - "--disable-xetex"
    - "--disable-mflua"
    - "--disable-mfluajit"
    - "--disable-euptex"
    - "--disable-uptex"
    - "--disable-etex"
    - "--disable-ipc"
    - "--disable-dump-share"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-configure-mktemp-fix.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "config.guess 需要 HarmonyOS (__OHOS__) 检测分支，否则 configure 报 'cannot guess build type'"
  - "HMDFS 文件系统上 mktemp -d 不支持，需用 mkdir 替代（config.guess/config.sub 修复为补丁）"
  - "config.sub 在 texlive-source trunk 版本已包含 ohos* 和 linux-ohos* 支持，无需额外补丁"
  - "texlive 源码树使用 AC_CONFIG_AUX_DIR(../../build-aux) 共享顶层 config.guess/config.sub"
  - "CONFIG_SHELL 由 Conan profile 设置，configure 自动用 bash 重新执行自身"
  - "web2c 构建需要先配置 kpathsea → 再配置 web2c → 再配置 web2c/web2c 三层"
