# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bibtex/0.99e
homepage: "https://tug.org/bibtex"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: bibtex.test
    source: texk/web2c/bibtex.test
    description: "bibtex上游测试脚本，运行bibtex处理exampl.aux并比较输出"
    command: "./bibtex.test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行bibtex --version验证版本输出，并使用exampl.aux处理参考文献"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
