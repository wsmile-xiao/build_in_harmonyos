# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: bamutil/1.0.15
homepage: "https://github.com/statgen/bamUtil"

# 上游测试命令
upstream_check_command: "run the 19 scripts listed below from test/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make TARGET=clang test (cwd: test/)"

# 上游实际运行的测试程序（由 test/Makefile 的 TEST_COMMAND 串联）
upstream_tests:
  - file: test/samTests.sh
    source: bamutil-1.0.15/test/samTests.sh
    description: "SAM 基础测试"
    command: "./samTests.sh"
  - file: test/testFilter.sh
    source: bamutil-1.0.15/test/testFilter.sh
    description: "filter 测试"
    command: "./testFilter.sh"
  - file: test/testSeq.sh
    source: bamutil-1.0.15/test/testSeq.sh
    description: "seq 测试"
    command: "./testSeq.sh"
  - file: test/testRevert.sh
    source: bamutil-1.0.15/test/testRevert.sh
    description: "revert 测试"
    command: "./testRevert.sh"
  - file: test/testDiff.sh
    source: bamutil-1.0.15/test/testDiff.sh
    description: "diff 测试"
    command: "./testDiff.sh"
  - file: test/splitChromosome.sh
    source: bamutil-1.0.15/test/splitChromosome.sh
    description: "splitChromosome 测试"
    command: "./splitChromosome.sh"
  - file: test/writeRegion.sh
    source: bamutil-1.0.15/test/writeRegion.sh
    description: "writeRegion 测试"
    command: "./writeRegion.sh"
  - file: test/testSqueeze.sh
    source: bamutil-1.0.15/test/testSqueeze.sh
    description: "squeeze 测试"
    command: "./testSqueeze.sh"
  - file: test/testCigars.sh
    source: bamutil-1.0.15/test/testCigars.sh
    description: "CIGAR 测试"
    command: "./testCigars.sh"
  - file: test/testStats.sh
    source: bamutil-1.0.15/test/testStats.sh
    description: "stats 测试"
    command: "./testStats.sh"
  - file: test/testClipOverlap.sh
    source: bamutil-1.0.15/test/testClipOverlap.sh
    description: "clipOverlap 测试"
    command: "./testClipOverlap.sh"
  - file: test/testSplitBam.sh
    source: bamutil-1.0.15/test/testSplitBam.sh
    description: "splitBam 测试"
    command: "./testSplitBam.sh"
  - file: test/testTrimBam.sh
    source: bamutil-1.0.15/test/testTrimBam.sh
    description: "trimBam 测试"
    command: "./testTrimBam.sh"
  - file: test/testPolishBam.sh
    source: bamutil-1.0.15/test/testPolishBam.sh
    description: "polishBam 测试"
    command: "./testPolishBam.sh"
  - file: test/testMergeBam.sh
    source: bamutil-1.0.15/test/testMergeBam.sh
    description: "mergeBam 测试"
    command: "./testMergeBam.sh"
  - file: test/testGapInfo.sh
    source: bamutil-1.0.15/test/testGapInfo.sh
    description: "gapInfo 测试"
    command: "./testGapInfo.sh"
  - file: test/testBam2FastQ.sh
    source: bamutil-1.0.15/test/testBam2FastQ.sh
    description: "bam2FastQ 测试"
    command: "./testBam2FastQ.sh"
  - file: test/testDedup.sh
    source: bamutil-1.0.15/test/testDedup.sh
    description: "dedup 测试"
    command: "./testDedup.sh"
  - file: test/testRecab.sh
    source: bamutil-1.0.15/test/testRecab.sh
    description: "recab 测试"
    command: "./testRecab.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 bam 命令行工具可执行"
    command: "bam help"

# 测试断言总数 (近似值)
assertion_count: 1
