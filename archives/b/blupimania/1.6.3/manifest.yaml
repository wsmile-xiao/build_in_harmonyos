# 版本级 manifest
# 文件位置: archives/b/blupimania/1.6.3/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.3"

# 软件名
software: blupimania

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/blupi-games/blupimania/archive/refs/tags/v1.6.3.tar.gz"

  # 源码校验和
  sha256: "a25ab4a7c757e4fbb976f5b54250a5402b1df0143db6dbcb3337845b1f12df8d"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（CMakeToolchain 注入）
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux (E092)"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_EXE_LINKER_FLAGS=-L<dep libdirs> -Wl,-rpath-link,<dep libdirs>"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sdl2/2.30.10
    - sdl2-image/2.8.12
    - sdl2_mixer/2.8.2
    - libwebp/1.6.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMake 4.x 移除 <3.5 兼容，上游 cmake_minimum_required(3.2) 需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "E092：CMake 不识别 HarmonyOS，需 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64"
  - "上游动态分支链接 WebP::webpdemux，libwebp 配方仅暴露 WebP::webp——generate() 注入 WebP::webpdemux imported target 的 CMake build module（sdl2-image/2.8.12 同法）"
  - "CMakeDeps 配置名大小写敏感跟随 conan 包名 sdl2_mixer，上游 find_package(SDL2_mixer) 需 set_property cmake_file_name=SDL2_mixer"
  - "GUI 游戏可执行包无头冒烟：argtable3 在 SDL_Init 之前解析 --version 并以退出码 0 退出，test_package 据此断言真实行为"
  - "OHOS 可执行包需在 package() 对 bin/ 产物 binary-sign-tool 自签，消费者测试才能真实运行"
