software: bbe
display: "bbe"
description: "二进制块编辑器（sed-like binary editor）"
category: system
type: tool
homepage: "https://savannah.gnu.org/projects/bbe/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "2006版 config.guess/config.sub 需要更新支持 aarch64 和 HarmonyOS"
    - "config.status 临时目录需要使用 TMPDIR（HMDFS 权限问题）"
    - "configure umask 077 导致 HMDFS 上无法创建文件，改为 umask 000"
  common_dependencies: []

versions:
  "0.2.2":
    status: built
    build_date: "2026-08-06"
