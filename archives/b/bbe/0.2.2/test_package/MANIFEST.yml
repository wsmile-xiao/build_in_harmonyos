# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e compliance

package: bbe/0.2.2
homepage: "https://savannah.gnu.org/projects/bbe/"

# Upstream has no test suite (no `make check` target with tests)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# bbe has no automated test suite in upstream
upstream_tests: []

# Consumer-side tests in test_package
test_package_tests:
  - file: test.c
    description: "Verifies bbe package installation and binary availability"
    command: "./test_bbe"

# Functional tests run in conanfile.py test() method:
#   1. bbe --version (binary exists and runs)
#   2. echo 'hello world' | bbe -e 's/hello/HELLO/' (functional test)
assertion_count: 2
