package: boost1.84-random/1.84.0
homepage: https://www.boost.org/

# 上游测试说明
# Boost 自带的 B2 构建系统在 OHOS 不兼容（SHELL 执行机制失败），
# 无法直接使用 b2 运行上游测试。本适配通过手动编译 boost.random 库
# 自带测试源文件绕过 b2，在 OHOS 环境真实运行了 4 项上游测试：
# - test_random_device.cpp：原样编译运行（上游用 included/test_exec_monitor）
# - test_mt19937.cpp / test_mt19937_64.cpp：上游需要链接
#   boost_unit_test_framework（本配方未编译 test 库），按上游断言语义改用
#   boost/test/included/unit_test.hpp 单头全实现，宏定义与上游测试文件
#   逐字一致（validation value 等断言值不变）
# - random_demo.cpp：上游 example 的 run 目标（纯 header-only 演示）
# 测试方式：clang++ -std=c++17 -stdlib=libc++ 编译，链接已编译的
# libboost_random.a，直接运行可执行文件。
# b2 不兼容是已知技术障碍，项目方已记录（E068 错误模式）。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/random/test/test_random_device.cpp"
    description: "boost.random random_device 测试（entropy/取值范围/generate 批量读取，6 断言组）"
    command: "clang++ test_random_device.cpp -lboost_random && ./a.out"
    result: passed
  - file: "libs/random/test/test_mt19937.cpp"
    description: "boost.random mt19937 引擎测试（15 测试用例：默认种子/seed 序列/iterator 种子/discard/验证值等，宏逐字取自上游）"
    command: "clang++ test_mt19937.cpp -lboost_random && ./a.out"
    result: passed
  - file: "libs/random/test/test_mt19937_64.cpp"
    description: "boost.random mt19937_64 引擎测试（15 测试用例：64 位验证值 9981545732273789042 等，宏逐字取自上游）"
    command: "clang++ test_mt19937_64.cpp -lboost_random && ./a.out"
    result: passed
  - file: "libs/random/example/random_demo.cpp"
    description: "boost.random 官方示例（minstd_rand 均匀分布骰子演示，上游 Jamfile run 目标）"
    command: "clang++ random_demo.cpp && ./a.out"
    result: passed

test_package_tests:
  - file: test_boost_random.cpp
    description: "boost.random: mt19937 种子可复现/uniform_int 范围与覆盖/uniform_real 范围/random_device entropy+generate+唯一性/variate_generator 共 6 组校验"
    command: "ctest boost_random_test"

assertion_count: 6  # test_package 实际校验组数；上游测试 4 项见 upstream_tests 列表
