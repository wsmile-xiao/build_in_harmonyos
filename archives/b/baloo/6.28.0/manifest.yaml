knowledge_gained:
  - "KF6 6.28-series baloo builds against the ohpcd 6.14.x KF6 baseline by patching KF_DEP_VERSION 6.28.0->6.14.0; the variable also drives the find_dependency versions written into the installed KF6BalooConfig.cmake, so lowering it is mandatory for downstream consumption of the published 6.14 components."
  - "KIO is only required by the baloo kioworkers (search/tags/timeline kioslaves); dropping the KIO find_package component and the kioworkers subdirectory is sufficient to build the full library + file indexer + CLI toolset without kio on OHOS."
  - "OHOS clang 15 libc++ has no C++20 std::ranges algorithms (ranges::any_of/find_if); classic std::any_of/std::find_if with iterator pairs are drop-in replacements (patches 0003-0005)."
  - "The conan toolchain cppstd block injects a plain CMAKE_CXX_STANDARD=17 variable that both suppresses ECM KDECompilerSettings' own C++20 default and makes CMake append -std=c++17 after CMAKE_CXX_FLAGS; tc.blocks.remove('cppstd') fixes std::ranges builds on KDE Frameworks packages."
  - "CMake on the OHOS toolchain has no CMAKE_SYSROOT (the clang wrapper carries the sysroot implicitly), so ECM FindInotify fails and BUILD_KINOTIFY stays off, silently dropping the whole autotests/tests tree; prepending the SDK sysroot usr prefix to CMAKE_PREFIX_PATH in conan_cmakedeps_paths.cmake turns it back on."
  - "The OHOS musl sysroot defines SYS_ioprio_set but ships no <linux/ioprio.h> (glibc-only); guarding the include with __has_include degrades lowerIOPriority() to a safe no-op (patch 0006)."
  - "The published KF6 6.14 components (kconfig/solid/kcoreaddons/ki18n/...) carry no DT_SONAME, so linking them by imported target records machine-private absolute cache paths in DT_NEEDED; stamping IMPORTED_SONAME on each dependency target (kpackage 6.18.0.1 / E537 precedent) makes baloo's libraries record relocatable basenames."
  - "kfilemetadata/6.14.0 was published with absolute ~/.cache/conan2 DT_NEEDED entries; the musl loader does not fall back to LD_LIBRARY_PATH for absolute-path NEEDED, so the consumer test bridges the stale prefix with symlinks to the live cache."
