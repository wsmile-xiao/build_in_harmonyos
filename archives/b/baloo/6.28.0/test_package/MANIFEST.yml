# test_package/MANIFEST.yml
# Upstream and consumer test declaration for baloo/6.28.0.

package: baloo/6.28.0
homepage: https://invent.kde.org/frameworks/baloo

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E \"^(filewatchtest|filefetchjobtest|filemonitortest)$\""

upstream_tests:
  - file: autotests/
    source: baloo-6.28.0/autotests/
    description: "Baloo upstream CTest/autotests suite (37 registered cases: 3 codecs + 15 engine + 11 file + 4 lib + 4 integration)"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON; excludes tests that require a running D-Bus session bus / baloo_file daemon (filewatchtest, filefetchjobtest, filemonitortest)"
  - file: tests/
    source: baloo-6.28.0/tests/
    description: "Manual test executables (ecm_mark_as_test only; not registered in ctest)"
    command: "n/a (not ctest-registered upstream)"
    condition: "upstream registers these via ecm_mark_as_test without add_test, so they are not part of ctest runs on any platform"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke exercising Term/Query JSON round-trip and an LMDB-backed document round trip through Transaction (same pattern as upstream writetransactiontest)."
    command: "conan create (test_package builds and runs test_baloo)"

assertion_count: 6
