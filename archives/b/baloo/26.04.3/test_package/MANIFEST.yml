# test_package/MANIFEST.yml
# Upstream and consumer test declaration for baloo/26.04.3 (upstream 6.25.0).

package: baloo/26.04.3
homepage: https://invent.kde.org/frameworks/baloo

# 上游测试入口: CMake 构建期 ctest (KDE CI .kde-ci.yml test-before-installing)。
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 中已集成上游测试 (minimal-testable subset, 见下)
upstream_test_in_build: true
upstream_test_command: >
  ctest --test-dir <build> --output-on-failure --timeout 120 --no-tests=error
  -R "^(doctermscodectest|postingcodectest|positioncodectest|positiondbtest|
  postingdbtest|documentdbtest|documenturldbtest|documentiddbtest|
  documentdatadbtest|documenttimedbtest|idtreedbtest|idfilenamedbtest|
  mtimedbtest|andpostingiteratortest|orpostingiteratortest|
  postingiteratortest|phraseanditeratortest|termgeneratortest|
  queryserializationtest|advancedqueryparsertest|filefetchjobtest)$"

# 上游实际运行/声明的测试集 (autotests/, 官方 ctest 注册 36 项)
# 实测: 21 项 RUN 并 21/21 通过; filemonitortest 声明 NOT RUN。
upstream_tests:
  - file: autotests/unit/codecs
    source: baloo-6.25.0/autotests/unit/codecs/
    description: "3 codec unit tests (docterms/posting/position codec) - RUN in build(), all pass"
    condition: "registered when BUILD_KINOTIFY=ON (inotify header found in OHOS sysroot)"
  - file: autotests/unit/engine
    source: baloo-6.25.0/autotests/unit/engine/
    description: "15 engine/DB + query iterator tests (LMDB) - RUN in build(), all pass"
    condition: "registered when BUILD_KINOTIFY=ON"
  - file: autotests/unit/lib
    source: baloo-6.25.0/autotests/unit/lib/
    description: "queryserializationtest / advancedqueryparsertest / filefetchjobtest - RUN, all pass; filemonitortest declared NOT RUN"
    condition: "filemonitortest needs a session DBus daemon (QDBus signal roundtrip blocks on QEventLoop otherwise); OHOS has none - accepted gap ud-20260904-001"
  - file: autotests/unit/file
    source: baloo-6.25.0/autotests/unit/file/
    description: "file-class tests (baloofilecommon/inotify/DBus session) - declared NOT RUN"
    condition: "accepted gap ud-20260904-001; need inotify runtime / DBus session / indexer service"
  - file: autotests/integration
    source: baloo-6.25.0/autotests/integration/
    description: "integration tests + basicindexing benchmark - declared NOT RUN"
    condition: "accepted gap ud-20260904-001; need full indexer stack"
  - file: tests/
    source: baloo-6.25.0/tests/
    description: "manual mark-as-test executables (writeiotest/memorytest/inotifytest/...) - declared NOT RUN"
    condition: "accepted gap ud-20260904-001"

# test_package 自带的消费者测试 (R34: 真实 API 调用)
test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke test builds against libKF6Baloo and calls Baloo::Query (setSearchString/searchString/setLimit/limit)."
    command: "conan create (test_package builds and runs test_kbaloo) - PASSED 1/1"

assertion_count: 2
