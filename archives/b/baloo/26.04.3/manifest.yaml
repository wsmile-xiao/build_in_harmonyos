knowledge_gained:
- "KIO 未发布到 ohpcd; patch 顶层 KF6 COMPONENTS 去掉 KIO (OPTIONAL_COMPONENTS) 并跳过 src/kioworkers (唯一 KIO 消费者)"
- "KF_DEP_VERSION 下限 6.25.0 改 6.14.0: ohpcd KF 基线混合 6.14/6.18/6.26/6.29 线"
- "kfilemetadata/6.14.0 硬依赖 kconfig/kcoreaddons/ki18n 6.14.0 线 -> baloo 用同 major 6 override 提到 6.26.0 线 (conan 同 major 不改 package_id, 复用制品; kfilemetadata 会被重编译一次)"
- "qtbase/6.11.1 不含 Qt6DBus (仅 6.11.1.1 / qtbase-sql-dbus 有); KF 依赖全部 pin 6.11.1 -> baloo 需 qtbase/6.11.1.1 override"
- "conan 工具链在 profile cppstd=17 下于 CMAKE_CXX_FLAGS 末尾追加 -std=c++17, CMakeToolchain 变量的 -std=c++20 无效 -> 必须把 self.settings.compiler.cppstd 提到 20 (host 节点)"
- "OHOS libc++15 定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES, 所有 std::ranges 算法不可用 -> patch std::ranges::any_of 为 std::any_of"
- "OHOS sysroot 无 linux/ioprio.h -> patch priority.cpp 用 __has_include(<linux/ioprio.h>) 门控 ioprio 块"
- "kconfig_compiler_kf6 等宿主工具无 RPATH, 构建期须把依赖 lib 目录加进 LD_LIBRARY_PATH (否则误加载系统 Qt 报 relocation 错误); /system/lib64 追加在依赖 lib 之后"
- "sys/inotify.h 只在 OHOS sysroot; CMake find_path 需 CMAKE_INCLUDE_PATH 含 sysroot usr/include (conan_cmakedeps_paths.cmake 里 PREPEND) -> ECM FindInotify -> BUILD_KINOTIFY=ON 全测试树注册"
- "libKF6Baloo/Engine 自身有 DT_SONAME; 但 DT_NEEDED 含绝对路径 (kconfig/solid/kcoreaddons/ki18n 等依赖 .so 缺 SONAME, kfilemetadata R40 同类问题) - 依赖链既有限制, 交付需人工确认"
- "conan CMakeToolchain cppstd 时序坑（profile compiler.cppstd=17 后置 -std=c++17 覆盖 CMAKE_CXX_FLAGS=-std=c++20；须 configure() 提升 host settings.compiler.cppstd）→ knowledge/drafts/DRAFT-baloo-kf6-ohpcd-cmake-toolchain-cppstd.{kv,md}"
- "KF6 顶层依赖协商（KF_DEP_VERSION 地板放宽 6.25→6.14 + KIO 入 OPTIONAL_COMPONENTS + 消费者目录按 KF6_KIO_FOUND/TARGET 门控）→ knowledge/drafts/DRAFT-kf6-top-level-component-negotiation.{kv,md}"
- "OHOS libc++15 std::ranges 缺失第二实例：baloo std::ranges::any_of → C++11 std::any_of 调用点改写（策略对比并入既有 DRAFT）→ knowledge/drafts/DRAFT-ohos-libcxx15-missing-cpp20-ranges-algorithms"

- "round-5 (用户裁决 rule4 选项 A 收尾): 13 项无阻塞测试增跑全过 (integration writetransactiontest/basicindexingbenchmark_ts100/ts50; unit/file pendingfilequeuetest/fileindexerconfigtest/basicindexingjobtest/filtereddiriteratortest/unindexedfileiteratortest/metadatamovertest/extractorcommandpipetest/propertyserializationtest/extractorprocesstest/filewatchtest) + filemonitortest 沙箱 D-Bus 实跑 10/10 → ctest 35/36 全过"
- "querytest 失败根因: SearchStore 全局 Database 以只读方式打开 256GB 规格的 LMDB, 测试进程内已存在写句柄 → 第二个 256GB 虚拟映射失败 (内存不足, OHOS 沙箱); 低层引擎查询全过, 属平台运行时限制"
- "OHOS 沙箱自建 D-Bus session bus 配方: dbus-daemon 1.14.10 (DBUS_BUILD_TOOLS=ON) + 抽象 socket (unix:abstract=) + 账号兼容层 + 总线地址环境变量; conanfile 测试步幂等启动/停止 (先例 kdbusaddons/6.14.0 dbus-autotests-run.md)"
- "inotify 运行时复探 (round-5): inotify_init/inotify_add_watch 在 OHOS 沙箱可用 (探针即时返回), filewatchtest 真跑 PASS 7/7; round-1 的 12h 卡死不可复现, 原「inotify 缺失」声明已反证并更新, filewatchtest 按用户最终裁决并入 allowlist"
- "KIO 反驳证据: 36 项测试对应 43 个 ELF 的依赖表 0 条 KIO; 制品仓 kio 查询 0 条 → KIO 未发布且本包未链接"

