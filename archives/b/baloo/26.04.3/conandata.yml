# conandata.yml - baloo 26.04.3 (project index version)
# Upstream mapping: KDE Gear batch 26.04.3 -> baloo frameworks 6.25.0
# (upstream has NO baloo-26.04.3 tarball; scout.md + user decision
#  ud-20260904-001). Project version 26.04.3 is the conan package version.
sources:
  url: "https://download.kde.org/stable/frameworks/6.25/baloo-6.25.0.tar.xz"
  sha256: "d7746f5742d96f85c11b64a1aae8a6af1f20e55b815f81da8a4e6c3c5172a2d9"

patches:
  "26.04.3":
    - patch_file: "patches/0001-relax-kf6-and-qt6-requirements.patch"
      patch_description: >
        OHOS: trim Qt6 components to Core DBus Test; drop DBusAddons/IdleTime
        KF6 components (only used by gated-off kded/extractor); lower
        KF_DEP_VERSION floor to 6.14.0; make KIO optional and skip
        src/kioworkers; disable ki18n_install(po) (Qt6 LinguistTools absent);
        port std::ranges::any_of to std::any_of (OHOS libc++15 hides all
        std::ranges algorithms via _LIBCPP_HAS_NO_INCOMPLETE_RANGES).
      patch_type: "portability"
