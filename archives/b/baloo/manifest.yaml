software: baloo
display: "Baloo"
description: "KDE Frameworks 6 file indexing and searching framework (libKF6Baloo + LMDB engine + indexer daemon)"
category: library
homepage: "https://invent.kde.org/frameworks/baloo"
license: LGPL-2.1-only OR LGPL-3.0-only OR LicenseRef-KDE-Accepted-LGPL
build_system: cmake

ohos_adaptation:
  key_points:
    - "Project index version 26.04.3 maps to upstream baloo frameworks 6.25.0 (KDE Gear batch); no baloo-26.04.3 tarball exists"
    - "KIO is NOT published for OHOS/ohpcd -> patch 0001 makes it an OPTIONAL KF6 component and src/kioworkers (its only consumer, the kioslaves) is skipped"
    - "KF_DEP_VERSION floor lowered 6.25.0 -> 6.14.0 so the published KF6 baseline (kidletime/solid/kfilemetadata 6.14.0, kcrash 6.18.0) satisfies find_package(KF6 ...); also fixes the installed KF6BalooConfig.cmake find_dependency versions"
    - "std::ranges replaced with classic algorithms (OHOS clang 15 libc++ has no C++20 ranges algorithms)"
    - "Qt6 components trimmed to Core DBus Test; QML module, indexer service (BUILD_INDEXER_SERVICE=OFF) and ki18n_install(po) are cut off"
    - "BUILD_KINOTIFY requires sys/inotify.h visible to CMake find_path(); SDK sysroot usr prefix injected into CMAKE_PREFIX_PATH (ECM FindInotify -> BUILD_KINOTIFY -> upstream autotests); inotify runtime behavior not validated"
    - "Minimal-testable ctest subset (codecs/engine/lib = 22) runs in build(); file/integration/benchmark tests declared NOT RUN (accepted gap ud-20260904-001)"
    - "tc.blocks.remove(cppstd) in the recipe so ECM KDECompilerSettings sets C++20 itself"
    - "IMPORTED_SONAME block for SONAME-less KF6 deps (E537 relocatable linkage, kpackage precedent)"
    - "qtbase/6.11.1.1 (Qt6DBus) with override=True unifying transitive qtbase/6.11.1 references"
    - "linux/ioprio.h guarded by __has_include (musl sysroot has SYS_ioprio_set but not the header)"
  common_dependencies:
    - qtbase
    - qtdeclarative
    - kconfig
    - kcoreaddons
    - kdbusaddons
    - ki18n
    - kidletime
    - kfilemetadata
    - kcrash
    - solid
    - lmdb
    - ecm

versions:
  "26.04.3":
    status: built
    build_date: "2026-09-05"
    conan_ref: "baloo/26.04.3"
    knowledge_ref:
      - "DRAFT-baloo-kf6-ohpcd-cmake-toolchain-cppstd"
      - "DRAFT-kf6-top-level-component-negotiation"
  "6.28.0":
    status: built
    build_date: "2026-09-06"
    conan_ref: "baloo/6.28.0"
