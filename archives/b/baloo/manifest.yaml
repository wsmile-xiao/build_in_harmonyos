software: baloo
display: "Baloo"
description: "KDE Frameworks 6 file indexing and searching framework (libKF6Baloo + LMDB engine + indexer daemon)"
category: library
homepage: "https://invent.kde.org/frameworks/baloo"
license: LGPL-2.1-only OR LGPL-3.0-only OR LicenseRef-KDE-Accepted-LGPL
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_DEP_VERSION lowered to 6.14.0 (ohpcd KF6 baseline; also fixes the installed KF6BalooConfig.cmake find_dependency versions)"
    - "KIO component + kioworkers dropped (kio not published on ohpcd; only kioslaves use it)"
    - "std::ranges replaced with classic algorithms (OHOS clang 15 libc++ has no C++20 ranges algorithms)"
    - "tc.blocks.remove(cppstd) in the recipe so ECM KDECompilerSettings sets C++20 itself"
    - "SDK sysroot usr prefix injected into CMAKE_PREFIX_PATH for ECM FindInotify -> BUILD_KINOTIFY -> upstream autotests"
    - "IMPORTED_SONAME block for SONAME-less KF6 deps (E537 relocatable linkage, kpackage precedent)"
    - "qtbase/6.11.1.1 (Qt6DBus) with override=True unifying transitive qtbase/6.11.1 references"
    - "linux/ioprio.h guarded by __has_include (musl sysroot has SYS_ioprio_set but not the header)"
  common_dependencies:
    - qtbase
    - qtdeclarative
    - kconfig
    - kcoreaddons
    - ki18n
    - kdbusaddons
    - kfilemetadata
    - kcrash
    - solid
    - kidletime
    - lmdb
    - ecm

versions:
  "6.28.0":
    status: built
    build_date: "2026-09-06"
    conan_ref: "baloo/6.28.0"
