# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# bsd-mailx 8.1.2-0.20220412cvs 上游测试清点结论（R51 三步法）：
#   上游源码包（bsd-mailx_8.1.2-0.20220412cvs.orig.tar.xz，53 个文件）穷尽核查：
#   - 无 tests/ 目录、无 test/check/regress 目标（Makefile 为 OpenBSD bsd.prog.mk，
#     仅有 all/clean/install/distribution 目标）
#   - 无测试源文件、无 .gitignore 测试钩子、文档（USD.doc/mail.1）中 "check" 均为
#     功能描述而非测试命令
#   → 上游测试用例 0；test_package 以自研功能测试集（test_bsd_mailx.py）补全覆盖

package: bsd-mailx/8.1.2-0.20220412cvs
homepage: "https://salsa.debian.org/debian/bsd-mailx"

# 上游测试命令（穷尽核查后确认上游无测试目标）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试（上游无测试）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试，保持空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_bsd_mailx.py
    description: "bsd-mailx 命令行功能测试：usage 输出 / 空 mailbox 处理 / mailbox 读取打印 / 版本 banner"
    command: "python3 test_bsd_mailx.py <bin>/bsd-mailx"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
