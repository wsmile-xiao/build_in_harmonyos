# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游为 OpenBSD bsd.prog.mk 构建，OHOS 无 bsd.prog.mk，改写为 GNU make 兼容 Makefile"
  - "OpenBSD 特有 API（pledge/user_from_uid/uid_from_user/__va_list/warnc）需替换为 POSIX 等价实现"
  - "OHOS libc 无 vis.h（strvis/strnvis），从 OpenBSD 官方源移植 vis.c/vis.h"
  - "OHOS glob.h 无 GLOB_BRACE（GNU 扩展），用 #ifndef 兼容守卫置 0"
  - "OHOS termios 无 ALTWERASE/CCEQ（BSD 特有），用 #ifndef 兼容守卫"
  - "OHOS paths.h 无 _PATH_CSHELL，回退 _PATH_BSHELL"
  - "OHOS 无 OPEN_MAX，用 FOPEN_MAX（同 Debian 27 patch）"
  - "bsd-mailx 固定用 /tmp 作临时目录，适配遵循 $TMPDIR 环境变量（同 Debian 36 patch）"

