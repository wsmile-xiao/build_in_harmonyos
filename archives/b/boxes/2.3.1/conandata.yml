# conandata.yml — boxes 2.3.1
# 只写官方 GitHub tag tarball（R39）：镜像回退由 CI 的 get_mirrors 自动追加，
# 配方内不手写镜像前缀。

sources:
  url: "https://github.com/ascii-boxes/boxes/archive/refs/tags/v2.3.1.tar.gz"
  sha256: "0834e54c0d5293950412729cabf16ada3076a804eacba8f1aacc5381dfe3a96a"

patches:
  - patch_file: "patches/0001-boxes-harmonyos-compat.patch"
    patch_description: "boxes 2.3.1 Makefile 适配：CC 允许环境覆盖；链接宽字符 ncursesw"
    patch_type: "portability"
  - patch_file: "patches/0002-boxes-test-posix-sed.patch"
    patch_description: "boxes 2.3.1 测试框架 sed 表达式 POSIX 化：toybox sed 不支持 GNU 的 \\b 与 \\w，改用等价的 /^:EXPECTED/ 与 [[:alnum:]_]；仅改测试框架解析自身 fixture 的方式，不改任何用例、断言或期望输出"
    patch_type: "portability"
  - patch_file: "patches/0003-boxes-config-ohos.patch"
    patch_description: "boxes 2.3.1 config.h 添加 OHOS 平台分支：bionic 需要 _GNU_SOURCE  暴露 strdup/strcasecmp 等 POSIX 函数声明；原代码 fall through 到 _POSIX_SOURCE (POSIX.1-1990) 导致隐式声明，clang 15 将隐式声明视为错误"
    patch_type: "portability"