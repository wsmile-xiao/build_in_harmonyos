# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh) 要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: boxes/2.3.1
homepage: "https://boxes.thomasjensen.com/"

# 上游测试存在性审计（hmbs 硬门禁要求；上游确有测试，已接入并在真机执行）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 boxes 2.3.1 存在完整测试套件，black-box + sunny-day 套件
  已接入并在真机执行。
  1. black-box 套件（test/testrunner.sh --suite）：184 个 .txt 用例文件
     （test/ 目录，testrunner.sh 逐文件执行，diff 校验输出），可在真机完整执行。
  2. sunny-day 套件（test/test-sunny-days-all.sh）：遍历 boxes-config 中 72 个
     设计，每个设计执行 create/mend/remove 三个操作，共 216 个用例。
  3. utest 单元测试（utest/，cmocka 框架，main.c 注册 167 个测试函数）：需单独
     编译 unittest 二进制（链接 libcmocka + --coverage），未集成进 conan create；
     在 notes.md / PR 补充说明如实披露。
  4. 运行方式：conanfile.py build() 在真机把构建产物复制到可执行工作区后运行
     `bash test/testrunner.sh --suite` 与 `bash test/test-sunny-days-all.sh`，
     计数解析自两个 runner 的 "N tests executed, M successful, K failed" 末行。
     结果持久化为包内 res/upstream_test_result.json，test_package 阶段读取该
     文件并裸 print 输出 HMBS_UPSTREAM_TEST_RESULT 标记。

# 上游测试命令
upstream_check_command: "cd test && bash testrunner.sh --suite"
upstream_test_in_build: true
upstream_test_command: "cd test && bash testrunner.sh --suite && bash test-sunny-days-all.sh"

# 上游测试用例（真机可运行集合 = black-box 184 + sunny-day 216 = 400）
upstream_tests:
  - file: test/testrunner.sh
    source: "boxes-2.3.1/test/testrunner.sh"
    description: "black-box 套件：184 个 .txt 用例（画框/移除/对齐/ANSI/Unicode/配置解析等）"
    command: "bash testrunner.sh --suite"
  - file: test/test-sunny-days-all.sh
    source: "boxes-2.3.1/test/test-sunny-days-all.sh"
    description: "sunny-day 套件：72 个设计 x create/mend/remove = 216 个用例"
    command: "bash test-sunny-days-all.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "4 个真实用例：echo 画框、-d shell 设计、boxes -r 移除、--version 含 2.3.1"
    command: "sh test.sh <bin>"

# 测试断言总数 (近似值)
# 上游 400 个 black-box/sunny-day 用例（每个均 diff 断言）；test_package 4 条断言
assertion_count: 404

# 测试套件覆盖说明
test_suite_gaps:
  utest: "utest/ cmocka 套件（main.c 注册 167 个单元测试函数）需单独编译 unittest 二进制（-lcmocka --coverage），未集成进 conan create；已在 notes.md / PR 补充说明披露"
