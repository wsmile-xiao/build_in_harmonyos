# 版本级 manifest — boxes 2.3.1
# 遵循 ARCHIVE-SPEC v3.0

version: "2.3.1"

software: "boxes"

# 编译状态: built (真机预检通过后由 HMBS 更新为 published)
status: built

build_date: "2026-08-18"

# 构建系统: 自定义顶层 Makefile (src/Makefile，递归 out 构建)
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/ascii-boxes/boxes/archive/refs/tags/v2.3.1.tar.gz"
  sha256: "0834e54c0d5293950412729cabf16ada3076a804eacba8f1aacc5381dfe3a96a"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile

  configure_options: []

  # 运行依赖（OHPCD Conan 包）：libunistring + pcre2(32) + ncurses(wide)
  dependencies:
    - libunistring
    - pcre2
    - ncurses

  # 构建工具：flex/bison 生成 lexer/parser，使用真机自带（/data/service/hnp/bin），
  # 不声明 tool_requires（bison 会拉入 m4/meson 等源码构建，在 HMFS 上 shell_getcwd 崩溃）
  build_tools:
    - flex
    - bison

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-boxes-harmonyos-compat.patch"
  - "0002-boxes-test-posix-sed.patch"
  - "0003-boxes-config-ohos.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "boxes 顶层 Makefile 硬编码 CC=gcc，src/Makefile 改为 CC?= 允许环境覆盖（R33 从 Conan conf 取编译器）"
  - "赛方 worker 的 sed 是 toybox，不支持 GNU 扩展 \\b/\\w：testrunner.sh 的 /^:EXPECTED\\b.*$/ 永不匹配，导致 sed 范围越过 :EXPECTED 段、把框线 /**** 混入 filter 文件，再经 sed -E -f 时报 bad regex，179 个用例因此失败。改用 POSIX 等价写法即可，属测试框架自身解析问题，与用例无关"
  - "config.h 未覆盖 OHOS 平台：bionic 要求 _GNU_SOURCE 才暴露 strdup/strcasecmp，否则 clang 报隐式声明错误；将 OHOS 合入已有 Linux/glibc 分支"
  - "链接需 pcre2-32（UTF-32 正则）与 libunistring，ncurses 需宽字符变体 -lncursesw"
  - "上游 black-box 套件（184 用例）与 sunny-day 套件（72 设计 x create/mend/remove=216）在真机工作区复制后执行通过"
  - "OHOS 上 ELF 需 binary-sign-tool 签名（.codesign）才能在可写工作区执行；从 HMFS 复制带旧签名的二进制需强制重签"
  - "boxes 通过 ncurses setupterm 检测终端颜色，测试需 TERM=xterm + TERMINFO 指向 ncurses 包数据，否则绘制路径报 'terminals database is inaccessible'"

versions:
  "2.3.1":
    status: built
    build_date: "2026-08-18"