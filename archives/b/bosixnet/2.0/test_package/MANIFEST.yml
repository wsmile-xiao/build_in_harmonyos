# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
package: bosixnet/2.0
homepage: "https://github.com/tehnick/bosixnet"

# 上游测试命令 (bosixnet 上游无 make check / ctest)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/bosixnet-webui/bosixnet-webui.cpp
    source: bosixnet-2.0/src/bosixnet-webui/bosixnet-webui.cpp
    description: "FastCGI Web 界面主程序，支持 -v/--version 参数打印版本号 (Version: 1.7, 上游硬编码)"
    command: "bosixnet_webui --version"

# test_package 中自带的测试 (消费者视角验证二进制功能)
test_package_tests:
  - file: conanfile.py
    description: "运行 bosixnet_webui --version 验证二进制功能"
    command: "bosixnet_webui --version"
  - file: test_bosixnet.sh
    description: "轻量 smoke test：校验 --version 正常退出"
    command: "bosixnet_webui --version"

# 测试断言总数 (近似值，用于质量评估)
assertion_count: 2