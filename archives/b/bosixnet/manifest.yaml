software: bosixnet
display: "BOSixNet"
description: "Keeps dynamic DNS hostnames and hosts records up to date across one LAN"
category: system
homepage: "https://github.com/tehnick/bosixnet"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建；关闭 systemd / SysVinit 集成（HarmonyOS PC 无传统 init）"
    - "上游声明 cmake_minimum_required(2.8)，CMake >=4 需设 CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "fcgi 依赖无 Conan 配方，conanfile 从 cmd-pkgs 下载预编译包并按 sha256 校验，静态链接 libfcgi.a（OHOS musl ldso 对 $ORIGIN/LD_LIBRARY_PATH 解析不可靠）"
    - "安装路径 /etc/bosixnet/ 改为 ${CMAKE_INSTALL_PREFIX}/etc/bosixnet/"
  common_dependencies:
    - fcgi

versions:
  "2.0":
    status: built
    build_date: "2026-09-06"
    conan_ref: "bosixnet/2.0"