sources:
  url: "https://src.fedoraproject.org/repo/pkgs/buffer/buffer-1.19.tar.gz/e1e953f2a977753c5053b8ecf6c4f3f0/buffer-1.19.tar.gz"
  sha256: "a9d5c9a384bb7b608594aca3010aa090dfb18445198c0a95c63b8bd376d4cafb"

patches:
  - patch_file: "patches/0001-buffer.c.patch"
    patch_description: "buffer.c: SysV shmget/shmat → POSIX shm_open+ftruncate+mmap（OHOS 沙箱对 SysV IPC 返回 SIGSYS），并删除与 sys/shm.h 现代原型冲突的 K&R shmat 声明、补 stdlib.h"
    patch_type: "portability"
  - patch_file: "patches/0002-sem.c.patch"
    patch_description: "sem.c: SysV 信号量（semget/semop/semctl）→ POSIX 进程间信号量（sem_t 置于 MAP_SHARED|MAP_ANONYMOUS 映射，fork 继承共享），OHOS 沙箱同样拦截 semget/semop/semctl"
    patch_type: "portability"
