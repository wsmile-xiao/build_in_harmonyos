test_type: explicit
upstream_test_framework: none
assertion_count: 5

# 上游 buffer 1.19（1995 年最后修改）没有测试套件：源码树只有 buffer.c / sem.c /
# Makefile / README / buffer.man / COPYING，prescan 的 has_tests 为 false，
# 上游测试总数 N = 0（人工清点，与 knowledge/ARCHIVE-SPEC、prescan 报告一致）。
#
# 因此这里的 5 条是本适配新增的鸿蒙侧消费者用例（不进上游分母，单独计数），
# 每条都真实执行安装出来的 buffer 二进制：
#   1. 默认参数（10 KiB 块 × 99）256 KiB 往返逐字节一致
#   2. -s 65536 -b 4 -m 524288 下 1 MiB 往返逐字节一致
#   3. 空输入 → 空输出（环形缓冲下界）
#   4. -B 末块补齐：输出为 blocksize 整数倍且前缀与输入逐字节一致
#   5. -i/-o 文件形式与 stdin/stdout 语义等价
#
# 用例实现在被 git 跟踪的 test_buffer.sh（由 conanfile.py 的 test() 调用）：
# CI 的 L0c 要求 test_package/ 下存在测试源文件（.sh/.c/.py，conanfile.py 除外），
# 仅把断言内联在 conanfile.py 会让干净检出上 L0c 判 fail——本地因 conan 生成的
# conanbuildenv-*.sh（.gitignore 忽略、永不进 PR）而“看起来通过”，是假绿。

# 之所以必须走数据通路而不能只做 --version 冒烟：buffer 没有 --version/--help，
# 且其核心（POSIX 共享内存 + 进程间信号量）只在真正搬运数据时才会被建立；
# OHOS 沙箱拦截 SysV IPC（SIGSYS），这一层正是本包补丁的适配点。
