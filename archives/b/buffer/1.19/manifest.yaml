# 上游官网 http://hello-penguin.com/software/buffer 已不可达（DNS 可解析、TCP 无响应），
# 源码取自 Fedora dist-git 官方 lookaside 缓存；内容与 Debian 1.19-12.1 的 orig tarball
# 逐文件 sha256 一致（7/7 文件相同，仅 gzip 容器元数据不同）。
source:
  url: "https://src.fedoraproject.org/repo/pkgs/buffer/buffer-1.19.tar.gz/e1e953f2a977753c5053b8ecf6c4f3f0/buffer-1.19.tar.gz"
  sha256: "a9d5c9a384bb7b608594aca3010aa090dfb18445198c0a95c63b8bd376d4cafb"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-buffer.c.patch"
  - "0002-sem.c.patch"

knowledge_gained:
  - "OHOS 沙箱拦截 SysV IPC：shmget/semget/msgget 由内核以 SIGSYS（signal 31，exit 159）直接终止进程，fork/pipe/POSIX shm（shm_open+ftruncate+mmap）与 MAP_SHARED 匿名映射均可用；本机 /proc/sys/kernel/sem、msgmax 不存在。（knowledge_ref: DRAFT-E577）"
  - "buffer 的双进程环形缓冲整体建立在 SysV 共享内存+信号量之上，必须换成 POSIX 原语才能真正运行；同类先例 archives/a/afl/1.35b 的 shmget→mmap 补丁。（knowledge_ref: DRAFT-E577；ref: archives/a/afl/1.35b）"
  - "buffer 没有 --version/--help，只有参数错误时才打印 usage，纯冒烟测不到 IPC 通路；test_package 必须跑真实数据通路并逐字节比对。（knowledge_ref: DRAFT-E577）"
