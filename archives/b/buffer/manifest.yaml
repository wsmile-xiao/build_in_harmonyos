software: buffer
display: "buffer"
description: "极快的重分块过滤器：用双进程 + 共享内存环形缓冲加速向磁带/慢速管道的写入"
category: utility
homepage: "http://hello-penguin.com/software/buffer"
license: GPL-1.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "OHOS 沙箱拦截 System V IPC：shmget/semget/msgget 由内核以 SIGSYS(signal 31) 直接终止进程，工具无法启动。"
    - "上游双进程共享内存环形缓冲 + SysV 信号量必须整体换成 POSIX 原语：共享内存用 shm_open+ftruncate+mmap，信号量用 MAP_SHARED 匿名映射中的 sem_t（fork 继承共享）。"
    - "同类先例：archives/a/afl/1.35b 把 shmget/shmat 改为 shm_open+mmap（AFL++ 的 USEMMAP 方案同源）。"
    - "buffer 无 --version/--help，测试必须走真实数据通路并逐字节断言。"
  common_dependencies: []

versions:
  "1.19":
    status: built
    build_date: "2026-09-14"
    conan_ref: "buffer/1.19"
