# conandata.yml — blogc 0.20.1
sources:
  url: "https://github.com/blogc/blogc/releases/download/v0.20.1/blogc-0.20.1.tar.gz"
  sha256: "2ebc929d014bae02fe44377a9b3988f7a3b8259ef579e13daf027f52d9aaf319"

patches:
  "0.20.1":
    - patch_file: "patches/0001-Makefile.am.patch"
      patch_type: portability
      patch_description: "drop -Wl,--wrap=getenv for the sysinfo unit test: musl libc internally calls getenv, the wrap hijacks libc/cmocka internals and segfaults"
      strip: 1
    - patch_file: "patches/0002-Makefile.in.patch"
      patch_type: portability
      patch_description: "same -Wl,--wrap=getenv removal in the pre-generated Makefile.in shipped in the release tarball"
      strip: 1
    - patch_file: "patches/0003-src-blogc-make-atom.c.patch"
      patch_type: portability
      patch_description: "blogc-make atom rule hard-codes /tmp for its temporary template; honor TMPDIR first (OHOS /tmp is read-only)"
      strip: 1
    - patch_file: "patches/0004-tests-blogc-runserver-check_httpd_utils.c.patch"
      patch_type: portability
      patch_description: "OHOS musl does not expose ssize_t transitively; include <sys/types.h> in the httpd-utils wrap test"
      strip: 1
    - patch_file: "patches/0005-tests-blogc-check_sysinfo.c.patch"
      patch_type: portability
      patch_description: "rework the username unit tests to drive the real LOGNAME environment (setenv/unsetenv) now that --wrap=getenv is gone"
      strip: 1
