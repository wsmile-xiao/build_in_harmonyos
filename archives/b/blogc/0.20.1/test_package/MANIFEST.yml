# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: blogc/0.20.1
homepage: "https://github.com/blogc/blogc"

# 上游测试存在性审计（hmbs 硬门禁要求；上游确有测试，已接入并在真机执行）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 blogc 0.20.1 release tarball 存在完整测试套件，经 autotools
  TESTS 注册，已接入并在 OHOS 真机 make check 完整执行（27 个 TESTS 条目）。
  1. cmocka 单元测试程序 25 个（Makefile.am check_PROGRAMS）：
     tests/blogc/ 12 个（content_parser 48、datetime_parser 31、filelist_parser 3、
     renderer 42、source_parser 29、template_parser 46、toctree 2、rusage 4，
     以及链接器 -wrap 组 funcvars 2、loader 22、sysinfo 7、sysinfo2 1）、
     tests/common/ 6 个（config_parser 12、error 4、sort 6、utf8 5、utils 36，
     以及 -wrap 组 stdin 1）、
     tests/blogc-make/ 5 个（atom 10、rules 2、settings 6、utils 2，
     以及 -wrap 组 exec 6）、
     tests/blogc-runserver/ 2 个（-wrap 组 httpd_utils 4、mime 2），
     合计 cmocka_unit_test 注册用例 332 个（静态 grep 333 再扣除上游
     check_datetime_parser.c 中自行注释停用的 1 行注册，注明 not possible）。
  2. 端到端 shell 套件 2 个（check_SCRIPTS）：tests/blogc/check_blogc.sh（主工具
     真实渲染断言链）与 tests/blogc-make/check_blogc_make.sh（--enable-make）。
  3. make check 的 TESTS 注册条目 = 25 程序 + 2 脚本 = 27，全部执行。
  4. -wrap 测试注册说明（如实披露）：configure 用 AC_RUN_IFELSE 探测链接器
     -wrap 支持；本任务在 aarch64 OHOS 真机上构建（名义交叉、实际同架构），
     探针程序可在构建机直接执行，故 have_ld_wrap=yes，全部 -wrap 测试注册。
     blogc 主套件与 blogc-make 的 check_exec 编译依赖 -Wl,--wrap，lld 支持。
  5. 上游测试修改说明（补丁 0001-add-sys-types-h-for-musl-ssize-t.patch，唯一）：
     tests/blogc-runserver/check_httpd_utils.c 在 glibc 下经其他头文件间接获得
     ssize_t，OHOS musl 不再间接暴露导致编译失败（unknown type name 'ssize_t'）；
     在 include 块补一行 #include <sys/types.h>，不改变任何测试逻辑与断言。
  6. 运行方式：conanfile.py build() 就地构建后先以 ./blogc -v 探测可执行性
     （HMDFS 执行受限时自动回退到 ~/tmp/blogc-ws 工作区并自签名 ELF），
     然后 make check，解析 automake Testsuite summary（TOTAL/PASS/FAIL）与
     各程序 cmocka "[==========] Running N test(s)" 计数，结果持久化为包内
     res/upstream_test_result.json，test_package 阶段读取并裸 print 输出
     HMBS_UPSTREAM_TEST_RESULT 标记。

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试用例（真机可运行集合 = 25 个 cmocka 程序 + 2 个 shell 套件）
