# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "4 个真实用例：模板+源文件端到端渲染断言、blogc-make -v、blogc -v"
    command: "sh test.sh <bin> <pkg>"

# 测试断言总数 (近似值)
# 上游 27 个 TESTS 条目（25 个 cmocka 程序内部 332 个注册用例，332/332 真实
# 执行通过 + 2 个端到端脚本断言链）；test_package 4 条消费者断言
assertion_count: 334

# 测试套件覆盖说明
test_suite_gaps:
  unregistered: "tests/blogc-git-receiver/ 测试仅 BUILD_GIT_RECEIVER 时注册
    （--enable-git-receiver 默认关闭，其套件还依赖 git/tar 外部行为）"
