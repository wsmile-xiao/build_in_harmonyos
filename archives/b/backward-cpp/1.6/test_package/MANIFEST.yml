# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: backward-cpp/1.6
homepage: "https://github.com/bombela/backward-cpp"

# 上游测试命令 (CMake project, tests built when BACKWARD_TESTS=ON)
upstream_check_command: "cmake --build build -DBACKWARD_TESTS=ON && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (BACKWARD_TESTS=ON 时构建)
upstream_tests:
  - file: test/test.cpp
    source: backward-cpp-1.6/test/test.cpp
    description: "核心 API 测试 (12/12 通过: any_throw/exception/signals 等)"
    command: "./test_test"
  - file: test/stacktrace.cpp
    source: backward-cpp-1.6/test/stacktrace.cpp
    description: "栈回溯捕获测试 (2/2 通过)"
    command: "./test_stacktrace"
  - file: test/rectrace.cpp
    source: backward-cpp-1.6/test/rectrace.cpp
    description: "递归栈回溯测试 (2/2 通过)"
    command: "./test_rectrace"
  - file: test/select_signals.cpp
    source: backward-cpp-1.6/test/select_signals.cpp
    description: "信号处理回溯测试 (OHOS 上需交互, 输出完整 stacktrace)"
    command: "./test_select_signals"
  - file: test/suicide.cpp
    source: backward-cpp-1.6/test/suicide.cpp
    description: "栈溢出崩溃回溯测试 (OHOS 上无限递归超时, 输出完整 stacktrace)"
    command: "./test_suicide"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 捕获并打印栈回溯 (调用 backward::StackTrace/TraceResolver/Printer)"
    command: "./test_backward-cpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16
