software: btrfs-progs
# 软件级 manifest
# 文件位置: archives/b/btrfs-progs/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件基本信息
# ============================================================

# 软件名称
name: "btrfs-progs"

# 软件描述
description: "Btrfs 文件系统工具集，包括 mkfs.btrfs、btrfs、btrfsck 等命令"

# 软件类别
# filesystem|compression|archive|network|database|library|tool|other
category: filesystem

# 官方主页
homepage: "https://btrfs.readthedocs.io/"

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表（按时间倒序）
versions:
  - version: "5.19.1"
    status: built
    build_date: "2026-06-16"
    notes: "旧版本，内核代码依赖较少，可在 OHOS/musl 平台编译"

# ============================================================
# 编译特性
# ============================================================

# 构建系统类型（统计）
build_systems:
  - autotools

# 常用编译参数
common_configure_options:
  - "--disable-documentation"
  - "--disable-python"
  - "--disable-libudev"
  - "--disable-lzo"
  - "--disable-convert"

# 平台兼容性
platform_compatibility:
  ohos_arm64: partial  # 旧版本可用，新版本因内核依赖不可用
  notes: "v6.x 版本包含大量内核代码，需要完整 Linux 内核用户空间兼容层"

# ============================================================
# 依赖信息
# ============================================================

# 依赖列表
dependencies:
  - e2fsprogs
  - zstd
  - lzo2
  - uuid
  - blkid

# ============================================================
# 知识沉淀
# ============================================================

# 已应用的错误模式
error_patterns_applied:
  - E011  # HMDFS umask 权限问题
  - E007  # config.guess 平台识别
  - E051  # pthread_cancel 系统调用限制