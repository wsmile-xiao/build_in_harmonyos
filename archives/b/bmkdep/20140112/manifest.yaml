version: "20140112"
software: "bmkdep"
status: built
build_date: "2026-09-08"
conan_ref: "bmkdep/20140112"

source:
  url: "https://github.com/trociny/bmkdep/archive/refs/tags/20140112.tar.gz"
  sha256: "b80039dc18ec070886e21e3c1ea4a16fc60c239bb922add8c70838d982598635"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "Compile mkdep.c and findcc.c directly with the Conan-provided C compiler"
    - "DEFAULT_CC=clang"
    - "BMKDEP_PATH_TMP=/data/local/tmp"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-mkdep.c.patch"
  - "0002-findcc.h.patch"

knowledge_gained:
  - "The BSD Makefile only delegates to bsd.prog.mk; the two C sources can be compiled directly."
  - "TMPDIR remains the primary runtime temporary directory; the OHOS fallback is /data/local/tmp."
  - "The runtime compiler can be selected with CC; the OHOS package default is clang."

test_results:
  type: manual
  total: 0
  passed: 0
  failed: 0
  note: "Upstream ships no tests. Conan/local CI passes 6/6 generic consumer assertions; the OHOS VM passes the additional HarmonyOS-specific assertion for a combined 7/7."
