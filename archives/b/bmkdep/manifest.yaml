software: bmkdep
display: "bmkdep"
description: "Portable BSD mkdep utility for generating Makefile dependency lists"
category: build-tool
homepage: "https://github.com/trociny/bmkdep"
license: BSD-3-Clause
build_system: custom

ohos_adaptation:
  key_points:
    - "Compile the two C sources directly instead of requiring BSD bsd.prog.mk"
    - "Use clang as the default runtime compiler while preserving the CC override"
    - "Use /data/local/tmp as the fallback when TMPDIR is unset"
  common_dependencies: []

versions:
  "20140112":
    status: built
    build_date: "2026-09-08"
    conan_ref: "bmkdep/20140112"
