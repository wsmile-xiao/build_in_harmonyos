# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bash/5.3
homepage: https://www.gnu.org/software/bash/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试套件
upstream_tests:
  - name: "builtins"
    source: bash-5.3/tests/builtins.tests
    description: "内建命令测试"
  - name: "errors"
    source: bash-5.3/tests/errors.tests
    description: "错误处理测试"
  - name: "exec-sheet"
    source: bash-5.3/tests/exec.tests
    description: "命令执行测试"
  - name: "exp-tests"
    source: bash-5.3/tests/exp.tests
    description: "表达式展开测试"
  - name: "input-test"
    source: bash-5.3/tests/input.sh
    description: "输入处理测试"
  - name: "invoke"
    source: bash-5.3/tests/invoke.tests
    description: "脚本调用测试"
  - name: "locale"
    source: bash-5.3/tests/locale.tests
    description: "国际化/本地化测试"
  - name: "meta-tests"
    source: bash-5.3/tests/meta.tests
    description: "测试框架自身验证"
  - name: "parse"
    source: bash-5.3/tests/parse.tests
    description: "语法解析测试"
  - name: "printf"
    source: bash-5.3/tests/printf.tests
    description: "printf 内建命令测试"
  - name: "read"
    source: bash-5.3/tests/read.tests
    description: "read 内建命令测试"
  - name: "right-margin"
    source: bash-5.3/tests/right-margin.tests
    description: "行宽边界测试"
  - name: "trap"
    source: bash-5.3/tests/trap.tests
    description: "信号 trap 测试"
  - name: "type"
    source: bash-5.3/tests/type.tests
    description: "type 内建命令测试"
  - name: "varenv"
    source: bash-5.3/tests/varenv.tests
    description: "变量与环境测试"
  - name: "version"
    source: bash-5.3/tests/version.tests
    description: "版本号验证"
  - name: "cond-regpat"
    source: bash-5.3/tests/cond-regpat.tests
    description: "正则条件表达式测试"
  - name: "extglob"
    source: bash-5.3/tests/extglob.tests
    description: "扩展 glob 模式测试"
  - name: "glob-test"
    source: bash-5.3/tests/glob.tests
    description: "文件名通配测试"
  - name: "brace"
    source: bash-5.3/tests/brace.tests
    description: "花括号展开测试"

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "bash --version + 基本 shell 命令执行"
    command: "bash test.sh"

# 测试断言总数 (近似值)
assertion_count: 500
