software: bash
display: "GNU Bash"
description: "GNU Bourne Again Shell，标准 Unix shell 实现"
category: system
homepage: "https://www.gnu.org/software/bash/"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要修改 config.guess/config.sub 添加 HarmonyOS 识别"
    - "使用 --without-bash-malloc 避免与 musl libc 不兼容"
    - "使用 bundled readline（>= 8.3），不使用 --with-installed-readline"
    - "NEEDED 仅 libc.so，ncurses/readline 静态嵌入"
  common_dependencies:
    - ncurses

versions:
  "5.3":
    status: published
    build_date: "2026-04-13"
