# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.0"

# 软件名
software: "binary_log"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/p-ranav/binary_log/archive/refs/tags/v0.1.0.tar.gz"

  # 源码校验和
  sha256: "464c5452ba6061c3b0c5d195b82b8acee8317bfe64c9d56993abfd339fb188ed"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBINARY_LOG_DEVELOPER_MODE=ON"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_UNPACKER=OFF"
    - "-DBUILD_BENCHMARKS=OFF"
    - "-DBUILD_EXAMPLES=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "binary_log 0.1.0 是 C++20 header-only INTERFACE 库，不产生 .a/.so。"
  - "OHOS 的 CMake 系统名需映射为 Linux，否则会提示缺少 Platform/HarmonyOS.cmake。"
  - "开启 BINARY_LOG_DEVELOPER_MODE 和 BUILD_TESTING 后可运行上游 10 个 doctest 用例。"
  - "关闭 unpacker、benchmark、examples，避免引入非库交付物和额外构建依赖。"
  - "OHOS 默认 Conan profile 的 cppstd=17 不妨碍由 CMake target 传递 C++20；不应额外用 check_min_cppstd 阻断配方。"
  - "上游安装目录为 include/binary_log/binary_log.hpp，Conan includedirs 需指向 include/binary_log 才能保持消费者 include 路径。"
