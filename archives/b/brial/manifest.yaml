# 软件级 manifest — brial
# 遵循 ARCHIVE-SPEC v2.0

software: brial
display: "BRiAl"
description: "布尔环代数框架（PolyBoRi 的后继）— 布尔多项式环上的 Gröbner 基与化简"
category: math
homepage: "https://github.com/BRiAl/BRiAl"
license: GPL-2.0-or-later
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "conan 图里 **libpng 版本冲突**（传递依赖钉 1.6.58，本包要 1.6.58.1）→ `force=True` 收敛；选版原则是「让最少的包重建」，判据看 conan 打的 `- Build` / `- Cache` 标记，别猜"
    - "boost 的探测宏 `AX_BOOST_BASE` 只认 `--with-boost=<前缀>`，pkg-config 一眼不看"
  common_dependencies:
    - boost
    - m4ri
    - libpng

# ============================================================
# 版本索引
# ============================================================

versions:
  - version: "1.2.15"
    status: built
    build_date: "2026-08-17"
    notes: "首个鸿蒙 PC conan 配方；真机 conan create + test_package 断言全过"
