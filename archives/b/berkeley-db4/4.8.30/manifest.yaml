  - db_hotbackup
  - db_load
  - db_printlog
  - db_recover
  - db_sql
  - db_stat
  - db_upgrade
  - db_verify

libraries:
  - libdb-4.8.so
  - libdb-4.8.a
  - libdb.so
  - libdb.a

headers:
