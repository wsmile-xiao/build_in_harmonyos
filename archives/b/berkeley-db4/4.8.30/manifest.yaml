  - "0002-dist-config.guess.patch"
  - "0003-dist-config.sub.patch"
  - "0004-dist-configure.patch"

knowledge_gained:
  - "E007: 更新config.guess/config.sub为automake-1.17版本以支持HarmonyOS平台识别"
  - "berkeley-db需在build_unix目录下运行../dist/configure，init-build的_promote_nested_source会误提升dist/内容到根目录"
  - "HMDFS: umask 077 + mktemp -d创建2700权限目录(setgid位阻止写入)，chmod 755在HMDFS上无效；需去掉umask 077，依赖HMDFS自身ACL模型"
  - "berkeley-db没有make check目标，需用功能验证替代测试"

binaries:
  - db_archive
  - db_checkpoint
  - db_deadlock
