# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bankstown-lv2/1.1.0
homepage: "https://github.com/chadmed/bankstown"

# 上游源码审计：1.1.0 GitHub tag archive 不含任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "src/lib.rs"
    reason: "零 #[test] / #[cfg(test)] / mod tests；全部代码为插件 DSP 实现（Distortion/Saturator/biquad 链）。"
  - source: "Cargo.toml"
    reason: "无 [dev-dependencies] 段；唯一依赖 biquad 0.4.2 与 lv2 0.6.0 均为运行时依赖。"
  - source: "Cargo.lock"
    reason: "锁定 crate 树（lv2 生态 + biquad/libm），无任何 dev/test 依赖。"
  - source: "Makefile"
    reason: "仅有 default（cargo build --release）/install/uninstall 目标，无 test/check 目标。"
  - source: "源码树结构"
    reason: "无 tests/ 或 test/ 目录（tarball 顶层仅 src/ + Cargo.toml + Cargo.lock + Makefile + 两个 .ttl）。"
  - conclusion: "上游 1.1.0 未提供自动化测试；由 test_package 执行消费者视角的真实 LV2 C API 生命周期验证（dlopen + lv2_descriptor + instantiate/connect_port/run/cleanup）。"

# 上游测试命令：无上游测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无。
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_bankstown_lv2.c
    description: "真实 C 消费者：dlopen bankstown.so → lv2_descriptor(0)（校验 URI=https://chadmed.au/bankstown）→ instantiate(48kHz) → connect_port 全部 12 端口 → activate → run(64 样本) 校验输出非零（真实 DSP 处理）→ bypass 模式校验输入直通 → deactivate → cleanup → dlclose。"
    command: "clang -O1 test_bankstown_lv2.c -ldl -lm && ./test_bankstown_lv2 <bundle>"
  - file: test_audit.py
    description: "上游测试审计：重新下载上游 1.1.0 tarball（URL+sha256 同 conandata.yml）并扫描测试套件（#[test]/tests 目录/[dev-dependencies]/Makefile test 目标），确认上游无测试；同时审计打包 bundle 布局（so/manifest.ttl/bankstown.ttl 存在、manifest 引用 <bankstown.so>、ELF magic）。产出 HMBS_UPSTREAM_TEST_RESULT 标记（status=no_tests, discovered/executed/passed/failed=0）。"
    command: "python3 test_audit.py <bundle> <workdir>"

# 测试断言总数（近似值，用于质量评估）
# - test_bankstown_lv2.c: 16 个断言（dlopen + dlsym lv2_descriptor + lv2_descriptor(0) 非空 + URI 非空/匹配 + 6 个函数指针 + instantiate 非空 + 12 端口连接 + run 输出非零 + bypass 直通 + cleanup），HMBS_TEST_PACKAGE_RESULT 的 discovered=16/passedCount=每次实跑统计
# - test_audit.py: bundle 5 项审计 + 上游测试套件扫描（真实验证 0 测试）
assertion_count: 21