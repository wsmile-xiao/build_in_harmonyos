software: bankstown-lv2
# 版本级 manifest
# 文件位置: archives/b/bankstown-lv2/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-29"

# 构建系统类型 (顶层字段)
build_system: cargo

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/chadmed/bankstown/archive/refs/tags/1.1.0.tar.gz"

  # 源码校验和
  sha256: "e877508b73fe90774d74526d838f75e8ea278bdbcee0a1f92e3eca67ed734675"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | cargo | custom
  system: cargo

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # Rust crate 依赖由 Cargo.lock 管理，无 C/C++ 库依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"
# 说明：lv2-sys-2.0.0 的 target_os 门控补丁由 conanfile.py 在 build 阶段对
# vendor 的 crate 就地应用（非源码树补丁），故此处为空。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Rust Cargo cdylib 项目：cargo build --release 直接编译，无 configure 步骤；产物为 libbankstown.so（LV2 插件 bundle 二进制）。"
  - "rust-lv2 生态的 lv2-sys 2.0.0 仅用 #[cfg(target_os = \"linux\")]/\"windows\" 选择绑定模块，OHOS target_os=ohos 会触发 compile_error!；其 src/linux/aarch64.rs 是纯类型/常量绑定（无 libc 依赖），在 vendor 的 crate 中给 lib.rs 追加 ohos cfg-attr 别名即可（Cargo [patch.crates-io] 覆盖 Cargo.lock 固定版本）。"
  - "Rust 工具链在 OHOS 真机预检沙盒中可能不在 PATH，先探测已知位置（HNP/harmonybrew/rustup）；无则用 urllib 下载 Harmonybrew OHOS rust bottle 引导（argc/at51/martin 先例，设备 curl 无 CA bundle 不能用 curl/zsh 安装）。"
  - "OHOS Rust target 为 aarch64-unknown-linux-ohos，clang 作链接器（OHOS 无 cc 符号）；crates.io 直连 TLS 失败，改用 rsproxy.cn sparse 镜像。"
  - "LV2 插件是 shared-library 包：产物装入 lib/lv2/bankstown.lv2/（bankstown.so + manifest.ttl + bankstown.ttl），package_info 无导出 include/lib（resdirs 指向 bundle）。"
  - "上游无测试套件（无 #[test]/tests 目录/dev-dependencies/Makefile test 目标）：test_package 用真实 C 消费者 dlopen + LV2 C API 生命周期验证（R34），HMBS_UPSTREAM_TEST_RESULT 报 status=no_tests（sipcalc/xsel 先例）。"