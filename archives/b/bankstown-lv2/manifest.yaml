software: bankstown-lv2
display: "Bankstown LV2"
description: "轻量心理声学低音增强 LV2 插件（次低音谐波合成，适用于小扬声器）"
category: multimedia
homepage: "https://github.com/chadmed/bankstown"
license: MIT
build_system: cargo

ohos_adaptation:
  key_points:
    - "Rust Cargo cdylib 项目，cargo build --release 直接编译，无 configure 步骤"
    - "rust-lv2 生态的 lv2-sys 2.0.0 仅用 cfg(target_os=linux/windows) 选择绑定，OHOS target_os=ohos 触发 compile_error!；在 vendor 的 crate 追加 ohos cfg-attr 别名 + Cargo [patch]（conanfile.py _apply_lv2_sys_patch）"
    - "OHOS 预检沙盒 cargo/rustc 可能不在 PATH，经 Harmonybrew OHOS rust bottle 引导（argc/at51/martin 先例）"
    - "设置 CC/CXX=clang 与 RUSTFLAGS='-C linker=clang'（OHOS 无 cc 符号）；sysroot 存在时加 -Wl,--code-sign（lv2 .so 需签名才能真机加载）"
    - "OHOS /tmp 只读，构建与测试需用可写 TMPDIR；crates.io 直连无 CA bundle，用 rsproxy.cn sparse 镜像"
    - "上游无测试套件（无 #[test]/tests 目录/dev-dependencies/Makefile test 目标）：test_package 用真实 C 消费者 dlopen + LV2 C API 生命周期验证（R34），HMBS_UPSTREAM_TEST_RESULT 报 status=no_tests"
  common_dependencies:
    - "lv2/1.18.11-git"

versions:
  "1.1.0":
    status: built
    build_date: "2026-08-29"
    source_url: "https://github.com/chadmed/bankstown/archive/refs/tags/1.1.0.tar.gz"
    published_as: bankstown-lv2/1.1.0