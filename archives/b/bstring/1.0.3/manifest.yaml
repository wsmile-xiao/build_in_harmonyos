software: bstring
version: "1.0.3"
build_system: meson
status: published
build_date: "2026-06-09"

source:
  url: "https://github.com/msteinert/bstring/releases/download/v1.0.3/bstring-1.0.3.tar.xz"
  sha256: "90db08fd33e9494aea3f00f9b71cdcf3114c65457ee35558e8274df6ebac43f3"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  dependencies: []
  cc: clang
  cxx: clang++
  ld_workaround: "-fuse-ld=/data/service/hnp/bin/ld.bfd"

patches_applied: []

knowledge_gained:
  - "meson 构建需要 CC wrapper 自动签名 ELF 二进制（否则 sanity check Permission denied）"
  - "链接时必须使用 GNU ld 替代 lld（-fuse-ld=/data/service/hnp/bin/ld.bfd）"
  - "manifest 必须有顶层 build_system 字段（meson），init-build 可能检测不准"
  - "bstring 是库，验证方式通过 pkg-config 和 .so 文件检查"