# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0"

# 软件名
software: btyacc

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ChrisDodd/btyacc/archive/refs/tags/v3.0.tar.gz"

  # 源码校验和
  sha256: "25f759a5696c5c7325e4e2f7b95056c7468b0e4788526044eb8b8793997481e2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Makefile 工程（无 configure）：make 需传 CC=clang LINKER=clang 覆盖上游硬编码 gcc（本环境无 gcc）"
  - "btyacc 命令行选项必须位于语法文件名之前（btyacc -d -b <prefix> <grammar>），输出为 <prefix>_tab.c/_tab.h"
  - "Conan 2.29.1 版本校验正则要求版本号 ≥2 字符，单字符版本（如 '3'）被拒，需用上游完整版本号（如 3.0）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
