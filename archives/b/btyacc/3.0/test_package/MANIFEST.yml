# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: btyacc/3.0
homepage: "http://www.siber.com/btyacc/"

# 上游测试命令 (btyacc Makefile 无 check 目标)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# btyacc 自带 test/*.y 语法文件，需用 btyacc 本体解析验证
upstream_tests:
  - file: test/ansiC.y
    source: btyacc-3.0/test/ansiC.y
    description: "C 语法文件解析（btyacc 生成解析器）"
    command: "btyacc -d test/ansiC.y"
  - file: test/ansiC2.y
    source: btyacc-3.0/test/ansiC2.y
    description: "C 语法文件解析（变体）"
    command: "btyacc -d test/ansiC2.y"
  - file: test/ftp.y
    source: btyacc-3.0/test/ftp.y
    description: "FTP 协议语法解析"
    command: "btyacc -d test/ftp.y"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: btyacc 解析最小语法并生成 C 解析器输出"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3