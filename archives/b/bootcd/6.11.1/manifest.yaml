# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "bootcd 是 Debian 发行版构建工具（纯 Shell 脚本，Architecture: all），无编译无构建系统，依赖系统工具（busybox/xorriso/genisoimage 等）为运行时工具非 conan 库依赖"
- "上游源码在 salsa.debian.org git 仓库（master HEAD = 6.11.1），用 Git.clone 下载（git 独立 ssl，CI Python 无 SSL 模块时可下载，E372 方案）；conandata.yml 的 sources 段为 G1 完整性要求，git 源以 url+commit+type=git 提供"
- "包内主脚本清单需以源码实际存在的可执行 shell 脚本为准（bootcd/bootcdflopcp/bootcdinitramfshook/bootcdmodprobe/bootcdoverlayfs/bootcdproberoot/bootcdrst/runbootcdmodprobe/runbootcdproberoot/src2conf），不能凭工具名臆造"
- "bootcd 核心功能（复制系统成可启动 ISO）需完整 Debian 系统环境，OHOS 无法真正运行——test_package 只做脚本存在性 + bash 语法校验，按 rule 1.2 声明平台限制"
