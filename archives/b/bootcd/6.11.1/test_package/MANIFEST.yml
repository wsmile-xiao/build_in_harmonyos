# test_package/MANIFEST.yml — bootcd 6.11.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: bootcd/6.11.1
homepage: "https://bschu.de/bootcd/"

# 上游测试：bootcd 是纯 Shell 脚本工具集（Debian 发行版构建工具），上游无独立
# 测试框架（源码树无 test/ 目录，仅主脚本集）；核心功能（复制系统成可启动
# ISO）需完整 Debian 系统环境（xorriso/genisoimage 等）+ 真实挂载系统——
# OHOS 无，且无测试套件可运行——按 rule 1.2 如实声明平台限制。
upstream_check_command: "无（纯脚本工具集无上游测试框架，核心功能需 Debian 系统环境）"
upstream_test_in_build: false
upstream_test_command: "无"

# test_package 消费者测试（R34 真实产物校验：主脚本存在 + bash 语法 + .lib）
test_package_tests:
  - file: test_bootcd.py
    description: "断言 bin/bootcd/bootcd2disk/bootcdflopcp/bootcdbackup/bootcdmkinitramfs 存在且 /system/bin/sh -n 语法可解析，share/bootcd/*.lib 已打包"
    command: "conan create 内自动执行（test() 用 python3 运行）"
