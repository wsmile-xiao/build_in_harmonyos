software: blst
display: "blst"
description: "BLS12-381 signature library with hand-written AArch64/x86_64 assembly"
category: crypto
homepage: "https://github.com/supranational/blst"
license: "Apache-2.0"
build_system: custom

ohos_adaptation:
  key_points:
    - "上游 build.sh 以 CC/CFLAGS/AR/RANLIB 环境变量驱动, 配方按 R33 从 tools.build:compiler_executables 注入, 不使用 ${CC}"
    - "src/asm/*-armv8.pl 共 9 个 Perl 汇编生成器; 鸿蒙 PC 自带 perl 5.42.0 全部实跑通过, 产出与仓库内 build/elf/*-armv8.S 字节一致"
    - "build/assembly.S 按 __aarch64__ + __ELF__ 分发到 elf/*-armv8.S; libblst.a 内含 20 个 AArch64 汇编例程"
    - "上游无 C 测试程序(全仓无 int main 的 .c 测试), C 库经 Go(28 Test)/Rust(cargo 枚举 29 用例) 绑定间接测试, CI 含 ubuntu-24.04-arm"
    - "鸿蒙 PC 安装官方 go1.23.4.linux-arm64 + binary-sign-tool -selfSign 1 后, 上游 Go 套件真机 28/28 通过"
    - "Rust 用例数须按 cargo 枚举的 29 计而非 grep '#[test]' 的 23: lib.rs 的 macro_rules! sig_variant_impl 体内 6 个 #[test] 被 min_pk/min_sig 各展开一次, 加宏外 2 个共 14 个; 13+14+2=29"
    - "鸿蒙 PC 跑 Rust 必须用官方 aarch64-unknown-linux-ohos **host** 分发; 同版本 -musl/-gnu host 启动即 SIGSEGV, 而设备 clang 产出的静态/static-PIE/多线程/大二进制均正常, 属 host 运行时不兼容"
    - "binary-sign-tool 输出会丢可执行位需 chmod +x; cargo 需 linker 指 clang、SSL_CERT_FILE 供 CA、libssl.so 符号链接到 OHOS 的 libssl.so.3; rustdoc 未随 ohos host 发布故 doc-tests 不可跑"
    - "上游合计 N=28(Go)+29(Rust)=57; 执行 57, 通过 57, 失败 0; 执行覆盖率与已执行通过率均 57/57=100%"
    - "blst_fp 内部为小端 limb(limb_t l[6]), 与上游大端向量比较需先经 blst_bendian_from_fp()"
    - "零补丁; 未修改上游源码, 未删除或放宽任何测试"
  common_dependencies: []

versions:
  "0.3.17":
    status: built
    build_date: "2026-09-29"
    source_url: "https://github.com/supranational/blst/archive/refs/tags/v0.3.17.tar.gz"
