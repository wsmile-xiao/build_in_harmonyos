software: blst
version: "0.3.17"
status: built
build_date: "2026-09-29"
build_system: custom

source:
  url: "https://github.com/supranational/blst/archive/refs/tags/v0.3.17.tar.gz"
  sha256: "c3fef37b566b67419703b2bbb648e15176276af9a880c22aa8f5f2e8cecc2e4d"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "./build.sh -shared"
    - "CC=clang"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "blst 上游没有任何 C 测试程序（全仓无 int main 的 .c 测试）；C 库仅通过 bindings/go（28 个 Test）与 bindings/rust（cargo 实际枚举 29 个用例）间接测试，CI 矩阵含 ubuntu-24.04-arm。"
  - "Rust 用例数须按 cargo 枚举值 29 计，而非 grep '#[test]' 得到的 23：lib.rs 的 macro_rules! sig_variant_impl 体内含 6 个 #[test]，被 pub mod min_pk 与 pub mod min_sig 各展开一次（+6），加上宏外 2 个，lib.rs 共产生 14 个；13(bindings.rs)+14+2(pippenger-test_mod.rs)=29。"
  - "在鸿蒙 PC 上跑 Rust 必须用官方 aarch64-unknown-linux-ohos **host** 分发（rustc/cargo/rust-std 三个组件都发布）；同版本的 -musl / -gnu host 在本内核上启动即 SIGSEGV，而设备 clang 产出的静态/static-PIE/多线程/大二进制均正常，故属 host 运行时不兼容而非平台限制。"
  - "binary-sign-tool sign 输出的文件会丢失可执行位，签名后必须 chmod +x；cargo 需 linker 指到 clang（设备无 cc）、CA 用 SSL_CERT_FILE、并把 libssl.so/libcrypto.so 符号链接到 OHOS 的 libssl.so.3。Rust 官方未为 ohos host 发布 rustdoc，故 doc-tests 不可运行（用 cargo test --lib 规避）。"
  - "src/asm/*-armv8.pl 是 9 个 Perl 汇编生成器：在鸿蒙 PC 上用设备自带 perl 5.42 全部运行成功，且产出的 build/elf/*-armv8.S 与仓库内已提交版本字节完全一致。"
  - "build/assembly.S 按 __aarch64__ + __ELF__ 分发到 elf/*-armv8.S；编译后的 libblst.a 内含 20 个 AArch64 汇编例程（blst_sha256_block_armv8、mul_mont_384、add_mod_384、ct_inverse_mod_384、sqr_mont_384 等）。"
  - "blst_fp 以**小端 limb** 存储（limb_t l[6]）；与上游向量的大端十六进制比较必须先经 blst_bendian_from_fp() 转换，直接 memcmp 内部存储会失败。"
  - "HarmonyOS 会拒绝执行未签名 ELF；官方预编译 Go 工具链（linux-arm64）在 binary-sign-tool -selfSign 1 处理后可在鸿蒙 PC 原生运行，据此可在真机直接跑上游 Go 测试套件。"

verification:
  local_native_host: "CC=clang CFLAGS='-O2 -fno-builtin -fPIC -Wall -Wextra -Wno-error' ./build.sh -shared -> libblst.a + libblst.so"
  conan_create: "conan create . -pr:h/-pr:b=ci/conan/profiles/ohos-aarch64 -> rc=0"
  upstream_go_suite: "go test -v -count=1 bindings/go -> 28 RUN / 28 PASS / 0 FAIL（鸿蒙 PC 真机，cgo 编译 AArch64 汇编）"
  upstream_rust_suite: "cargo test --lib bindings/rust -> 29 passed / 0 failed（鸿蒙 PC 真机原生编译，rustc 1.98.1 aarch64-unknown-linux-ohos host；build.rs 经 cc crate 就地编译 src/server.c + build/assembly.S）"
  upstream_total: "N=57（Go 28 + Rust 29）；执行 57，通过 57，失败 0；执行覆盖率 57/57=100%，已执行通过率 57/57=100%"
  perl_asm_generator: "for pl in src/asm/*-armv8.pl; do perl $pl linux64; done -> 9/9 ok, byte-identical to shipped build/elf/*.S"
  abi_check: "test_package/ohos_abi_check.py -> 17/17 PASS (AArch64 ELF, .note.ohos.ident, OHOS libc, no host RPATH, 5 AArch64 asm symbols present in libblst.a)"
  consumer_test: "test_package/test_blst.c -> 7/7 PASS (RFC 9380 hash_to_g1 KAT vs upstream vector, sign/verify, tamper reject, G1 compress round-trip)"
