# test_package/MANIFEST.yml
package: blst/0.3.17
homepage: "https://github.com/supranational/blst"

# 本包交付的是 C 库本体（libblst.a / libblst.so）。
# 上游**没有 C 语言测试程序**（全仓库无 int main 的 .c 测试），
# 其 C 库是通过 Go / Rust 绑定间接测试的，故 upstream_test_in_build 为 false。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "bindings/go/*_test.go"
    source: "blst-0.3.17/bindings/go/"
    description: >-
      上游 Go 绑定测试：28 个 Test 函数（hash-to-curve、serdes、签名/验签、
      聚合、批量解压、多标量乘等）。由 .github/workflows/ci.yml 的
      `go test -test.v` 驱动；CI 矩阵含 ubuntu-24.04-arm（AArch64 原生）。
    command: "go test -v ./bindings/go"
  - file: "bindings/rust/src/lib.rs"
    source: "blst-0.3.17/bindings/rust/"
    description: >-
      上游 Rust 绑定测试：cargo test --lib 实际枚举 29 个用例（含 bindgen 结构
      布局校验、生成元、签名聚合、pairing）。注意 grep 化的 #[test] 源码字面量
      为 23，lib.rs 的 macro_rules! sig_variant_impl 体内 6 个 #[test] 被
      min_pk/min_sig 各展开一次，故实际为 29。
    command: "cargo test --release"
  - file: "bindings/vectors/hash_to_curve/*.json"
    source: "blst-0.3.17/bindings/vectors/hash_to_curve/"
    description: >-
      上游 hash-to-curve 官方向量（7 个 JSON：G1/G2 XMD SHA-256 SSWU
      NU/RO 与 expand_message_xmd），供上述 Go/Rust 测试消费。
    command: "(data consumed by the tests above)"

test_package_tests:
  - file: "test_blst.c"
    description: >-
      消费者测试（4 组断言）：RFC 9380 hash_to_g1 KAT（取自上游向量文件
      BLS12381G1_XMD_SHA-256_SSWU_RO_.json 的空消息用例）、keygen→sign→verify
      往返、篡改消息拒绝、G1 压缩/解压往返、公钥在曲线上。
    command: "test_blst"
  - file: "ohos_abi_check.py"
    description: >-
      产物 ELF/ABI 检查（纯 Python，任意宿主可跑）：AArch64 ELF64、OHOS musl
      解释器、.note.ohos.ident、无宿主 RPATH、无 Mach-O/PE 泄漏，以及
      libblst.a 内确实含 AArch64 汇编例程（blst_sha256_block_armv8 /
      mul_mont_384 / add_mod_384 / ct_inverse_mod_384 / sqr_mont_384）——
      纯 portable 构建会在此层失败。
    command: "python3 ohos_abi_check.py --package <pkg>"

assertion_count: 5
