# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: boolean-lite/0.1.0
homepage: "https://github.com/nonstd-lite/boolean-lite"

upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试: lest 框架, 4 个 CTest 可执行文件 (cpp98/cpp11/cpp14/cpp17), 每个含 17 个 CASE
upstream_tests:
  - file: test/boolean.t.cpp
    source: boolean-lite-0.1.0/test/boolean.t.cpp
    description: "boolean 核心单元测试 (lest 框架: 构造/转换/比较/取反/nodiscard/tweak header 等 17 个 CASE)"
    command: "ctest -R test-cpp17"
  - file: test/boolean-main.t.cpp
    source: boolean-lite-0.1.0/test/boolean-main.t.cpp
    description: "测试主函数入口 (lest 框架 main, 版本/标签/用例枚举)"
    command: "ctest -R test-cpp17"

test_package_tests:
  - file: test_boolean_lite.cpp
    description: "消费者测试: 验证 boolean-lite 头文件包含、boolean 构造/转换/比较/取反 API"
    command: "./test_boolean_lite"

assertion_count: 17
