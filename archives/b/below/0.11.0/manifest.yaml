# 版本级 manifest — below 0.11.0

version: "0.11.0"
software: "below"

# 编译状态
# built：本地 OHOS aarch64 交叉编译+链接+测试通过（399/414=96.4%）；未上传发布。
# Rust 工具链由制品仓基础设施包 rust-toolchain/1.97.1 提供（tool_requires），
# 不依赖系统 cargo、不使用 rustup 引导（rustup 无法识别 HarmonyOS 宿主，E105/E154）。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: "cargo"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://github.com/facebookincubator/below/archive/refs/tags/v0.11.0.tar.gz"

  # 源码校验和（实测 sha256）
  sha256: "bc5cb3a5d9b62768bbabe09431737d631e244fffcc06dada88c3f6c81a23da9a"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（Rust cargo workspace）
  system: custom

  # 配置选项列表（cargo 无 configure 选项）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libelf/0.8.13.1"
    - "zlib/1.3.2"

  # 构建期工具依赖（tool_requires）
  build_tools:
    - "rust-toolchain/1.97.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-sudotest-fs_type.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Rust 配方在竞赛 CI 的可行路径：以 tool_requires 引用基础设施包 rust-toolchain/1.97.1（rust-lang 官方 dist 预编译 aarch64-unknown-linux-ohos 工具链），避免系统无 cargo 与 rustup 无法识别 HarmonyOS 宿主（E105/E154）两个坑"
  - "below 主程序依赖 libbpf-sys → 需 libelf + zlib；接入 libelf/0.8.13.1（补全 gelf 函数）+ zlib/1.3.2 并对 libbpf-sys 打 OHOS 兼容补丁（netlink sockaddr_storage、byteswap）后主程序链接成功"
  - "上游 318 个测试宏（416 个测试函数）本机 OHOS aarch64 实跑 399/414 = 96.4%，失败均为 cgroup2 环境限制或日期断言差异"
