# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51：上游测试三步法申报）

package: below/0.11.0
homepage: "https://github.com/facebookincubator/below"

# 上游测试命令（cargo 项目，无 make check / ctest / meson test）
upstream_check_command: "cargo test --workspace --exclude below --tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cargo test --release --target aarch64-unknown-linux-ohos --workspace --exclude below --tests"

# 上游实际运行的测试程序（cargo 单元测试，静态统计 318 个 #[test] 宏，
# 实际展开测试函数 416 个：399 通过 / 15 失败 / 2 忽略，通过率 96.4%）
upstream_tests:
  - file: "below/btrfs/src/btrfs_api/test.rs, below/ethtool/src/ethtool_sys.rs, below/cgroupfs/src/test.rs, below/procfs/src/test.rs, below/dump/src/test.rs, below/store/src/*.rs 等（详见 notes.md 分 crate 清点表）"
    source: "below-0.11.0/<crate>/src/*.rs"
    description: "上游单元测试（318 个测试宏，399/414 通过，失败均因运行环境无 cgroup2 或日期断言差异）"
    command: "cargo test --workspace --exclude below --tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_below.py
    description: "消费者冒烟测试：运行打包的 below 二进制，断言 --help / dump --help 输出"
    command: "python3 test_below.py"

# 鸿蒙特有测试 (HarmonyOS-specific)：断言产物在本平台可用所必需的特性
# B1 ELF machine = AArch64；B2 PT_INTERP = OHOS musl loader（证明是 OHOS
# bionic/musl 二进制而非 glibc Linux）；B3 含 OHOS code signature（未签名
# ELF 在 HarmonyOS 上无法 execve，EACCES errno 13，正是配方 _sign_binaries()
# 修复的失败点）；B4 非空可执行文件
harmonyos_specific_tests:
  - file: test_below.py
    description: "鸿蒙特有测试 4 项（AArch64 / musl 解释器 / code signature / 产物完整性）"
    command: "PACKAGE_FOLDER=<pkg> python3 test_below.py"
    assertion_count: 4

# 依赖测试 (dependency functional test)：libelf/0.8.13.1 与 zlib/1.3.2 在本包中
# 均为**静态库**（libelf.a / libz.a），below 产物没有它们的 DT_NEEDED 记录，
# 因此仅凭运行 below 无法证明依赖在 HarmonyOS 上真实可用。test_deps.c 以消费者
# 身份用 OHOS clang 编译并链接这两个依赖包，在设备上实际执行依赖代码路径：
#   zlib  : zlibVersion / compress2 / uncompress 往返（4096 -> 315 字节，字节级一致）
#   libelf: elf_version / elf_begin / elf_kind / gelf_getehdr / elf_getshdrnum
#           解析真实 OHOS aarch64 ELF（e_machine=183）
# test_package/conanfile.py 显式声明 libelf/zlib 依赖（与 below 同版本，共享
# 同一二进制，不重复构建），编译并运行该测试。
dependency_tests:
  - file: test_deps.c
    description: "依赖功能测试 11 项断言（zlib 压缩往返 + libelf 解析 ELF），OHOS clang 编译消费者程序并实跑"
    command: "PACKAGE_FOLDER=<pkg> conan test ...（自动编译并执行）"
    assertion_count: 11
    dependencies:
      - "libelf/0.8.13.1"
      - "zlib/1.3.2"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 cargo 测试 416（399 通过 / 15 环境限制失败 / 2 忽略）
# + test_package 消费者冒烟 3 + 鸿蒙特有测试 4 + 依赖测试 11
assertion_count: 434
