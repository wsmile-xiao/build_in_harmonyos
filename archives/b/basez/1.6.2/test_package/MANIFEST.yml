# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: basez/1.6.2
homepage: "https://codeberg.org/vonshedknocker/basez"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序 (regtest.sh runs 18 test files)
upstream_tests:
  - file: regtest.sh.in
    source: basez-1.6.2/regtest.sh.in
    description: "RFC 4648 regression tests for base16/base32/base64 encode/decode"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "RFC 4648 Section 10 test vectors for base16/base32/base64"
    command: "test.sh <basez-binary>"

# 测试断言总数: 15 encode + 3 decode + 1 version = 19
assertion_count: 19
