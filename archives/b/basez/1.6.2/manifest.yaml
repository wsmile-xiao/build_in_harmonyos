software: basez
version: "1.6.2"
status: built
build_date: "2026-08-21"
build_system: makefile  # custom ./configure + Makefile.src (NOT autotools)

source:
  url: "https://deb.debian.org/debian/pool/main/b/basez/basez_1.6.2.orig.tar.gz"
  sha256: "2a9f821488791c2763ef0120c75c43dc83dd16567b7c416f30331889fd598937"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "--prefix=<package_folder>"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []
# basez 1.6.2 builds on OHOS without source patches.
# Custom configure script is already POSIX-compatible and accepts
# CC= and --prefix= as arguments.

knowledge_gained:
  - "basez uses a custom configure script (not autotools), which generates Makefile from Makefile.src via macro substitution"
  - "configure accepts CC=, CFLAGS=, CPPFLAGS=, LDFLAGS= as command-line arguments"
  - "configure detects compiler with: setexec CC gcc clang cc"
  - "regtest.sh.in creates local symlinks (base16 -> basez etc.) for testing; uses safe '[ -e X ] || ln -s' pattern (R5 compliant)"
  - "upstream make install also creates symlinks for encoding variants and installs bash-completion; deferred to future revision"
