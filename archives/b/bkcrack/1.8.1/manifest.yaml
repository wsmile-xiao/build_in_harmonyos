software: bkcrack
build_system: cmake
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.8.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/kimci86/bkcrack/tar.gz/v1.8.1"

  # 源码校验和
  sha256: "bb6a6d0bb1ccbb3c39cf8b3113581b5514b127023bbe0e864992c57e79346053"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBKCRACK_BUILD_TESTING=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-src-CMakeLists.txt.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "bkcrack原始CMake安装布局不标准(DESTINATION .)，需补丁修改为DESTINATION bin和share/bkcrack"
  - "bkcrack 1.8.1需要C++17(cxx_std_17)和pthread线程支持"
  - "cmake在HarmonyOS上会报System is unknown警告但不影响编译"
  - "bkcrack 31个ctest测试全部通过，功能完整可用"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/bkcrack-1.8.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/bkcrack-1.8.1.work
  source_orig_hash: 38096c1dfaae1880
  source_work_hash: c715982a0e1159a9
  generated_at: '2026-06-04T15:21:28'
  patches_count: 2

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: install-path-fix
    platform_only: True
    guard: 'none'
    description: "修复顶层CMakeLists.txt安装路径：example/tools/readme/license从DESTINATION .改为DESTINATION share/bkcrack"
  - file: 0002-src-CMakeLists.txt.patch
    type: install-path-fix
    platform_only: True
    guard: 'none'
    description: "修复src/CMakeLists.txt安装路径：binary从DESTINATION .改为DESTINATION bin"
