# test_package/MANIFEST.yml
# bamclipper v1.0.0 上游没有测试套件，因此这里仅登记适配消费者测试。
package: bamclipper/1.0.0
homepage: "https://github.com/tommyau/bamclipper"

upstream_check_command: "N/A (upstream v1.0.0 has no test target, test directory, or test samples)"
upstream_test_in_build: false
upstream_test_command: "N/A"
upstream_tests: []

supplemental_ohos_tests:
  - file: test.sh
    name: "package_layout_and_usage_error"
    description: "验证三个脚本存在且可执行，并验证 bamclipper.sh 缺少必需参数时返回错误。"
    command: "<Conan Bash> test.sh <bamclipper> <samtools> <parallel> <perl> <bash>"
  - file: test.sh
    name: "bam_file_workflow"
    description: "创建 SAM/BEDPE 样例，执行 BAMClipper，断言正反向 CIGAR 为 10S10M/10M10S，并验证 BAM 索引和 injectseparator 配对分隔。"
    command: "<Conan Bash> test.sh <bamclipper> <samtools> <parallel> <perl> <bash>"

test_package_tests:
  - file: test.sh
    description: "Runs the two real consumer test boundaries listed above with Conan-provided dependencies."
    command: "<Conan Bash> test.sh <bamclipper> <samtools> <parallel> <perl> <bash>"

upstream_test_count: 0
supplemental_ohos_test_count: 2
assertion_count: 2
