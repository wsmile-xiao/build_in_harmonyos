software: bamclipper
display: "BAMClipper"
description: "Remove PCR primer sequences from SAM/BAM alignments by soft-clipping"
category: bioinformatics
homepage: "https://github.com/tommyau/bamclipper"
license: MIT

build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Bash/Perl 脚本工具，无本地编译和 ELF 产物"
    - "入口及辅助脚本统一安装到包内 bin/"
    - "运行时固定依赖 bash/5.3、perl/5.42.2.1、samtools/1.21 和 parallel/20260522"
    - "上游 v1.0.0 没有测试目录、测试目标或测试样例"
    - "消费者测试显式使用 Conan 依赖包，避免 Worker 系统工具混用"
  common_dependencies:
    - "bash/5.3"
    - "perl/5.42.2.1"
    - "samtools/1.21"
    - "parallel/20260522"

versions:
  "1.0.0":
    status: built
    build_date: "2026-08-25"
