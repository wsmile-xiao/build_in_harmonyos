# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bullet3/3.25
homepage: "https://github.com/bulletphysics/bullet3"

# 上游测试命令
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 中是否已集成上游测试
# false —— 本配方交付面 BUILD_UNIT_TESTS=OFF（保持与已验证产物一致、缩短 CI 构建时间）。
# 上游套件改为独立构建面实测，结果见下方 measured_results。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的测试程序（CTest，test/ 目录）
# 全仓 grep -rn ADD_TEST test/ 共 8 处；其中 Test_DynamicsABA_bulletVSrbdl_PASS 受
# BULLET_BUILD_RBDL_COMPARE_TEST 门控（需外部 RBDL），上游默认不注册。
upstream_tests:
  - file: "test/collision"
    source: bullet upstream test/collision
    description: "碰撞检测（gtest 5 用例：GJK/MPR、EPA、解析球-球距离、heightfield 上轴过滤）"
    command: "Test_Collision"
  - file: "test/BulletDynamics"
    source: bullet upstream test/BulletDynamics
    description: "运动学角色控制器（gtest 1 用例）"
    command: "Test_btKinematicCharacterController"
  - file: "test/BulletDynamics/pendulum"
    source: bullet upstream test/BulletDynamics/pendulum
    description: "多体摆动力学（gtest 1 用例）"
    command: "Test_BulletDynamics"
  - file: "test/InverseDynamics"
    source: bullet upstream test/InverseDynamics
    description: "逆动力学（gtest 6 用例：Jacobian×3、bulletUrdfR2D2、kinematics differentiation×2）"
    command: "Test_BulletInverseDynamicsJacobian / Test_BulletInverseForwardDynamics / Test_BulletInverseDynamics"
  - file: "test/SharedMemory"
    source: bullet upstream test/SharedMemory
    description: "物理客户端/服务器（gtest 2 用例：DirectConnection、LoopBackSharedMemory）"
    command: "Test_PhysicsClientServer"

# 本次适配对上游套件的实测结果（2026-09-25，HarmonyOS PC aarch64 真机）
# 构建面: BUILD_UNIT_TESTS=ON + BUILD_BULLET3=ON + BUILD_EXTRAS=ON + BUILD_BULLET2_DEMOS=ON
#         构建目录位于源码树内（build3-ohc/，与上游 CI 的 build3/ 布局一致）
measured_results:
  command: "ctest --output-on-failure -j1"
  registered: 7
  passed: 6
  failed: 1
  skipped: 0
  gtest_cases_total: 15
  gtest_cases_passed: 14
  gtest_cases_failed: 1
  known_failure: "Test_PhysicsClientServer_PASS[LoopBackSharedMemory] → SIGSYS：OHOS 拦截 System V 共享内存 syscall（shmget），最小探针程序同样 rc=159"
  log: "reports/test-report.md"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "7 用例：刚体落地仿真 / 碰撞接触流形 / 序列化 / 任务调度 API / 软体绳索 / ohos_platform_abi / ohos_precision_contract"
    command: "./test_bullet"

# 测试断言总数（test.cpp 中 7 个用例，每个用例内含多次断言）
assertion_count: 7
ohos_specific_test_count: 2
