patch_count: 1

# 知识沉淀
knowledge_gained:
  - id: K001
    category: cmake_compatibility
    description: "bullet CMakeLists.txt 的 cmake_minimum_required(VERSION 2.4.3) 在 CMake 4.x 下被拒；补丁 0001 提升至 3.5（等价参数 -DCMAKE_POLICY_VERSION_MINIMUM=3.5）"
    severity: medium
  - id: K002
    category: platform_e092
    description: "CMake 无 HarmonyOS platform module，需在配方 generate() 覆写 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64（E092 通用绕行）"
    severity: high
  - id: K003
    category: upstream_test_layout
    description: "bullet 上游测试用 cwd 相对路径找 data/（b3FileUtils::findFile: ./data/../data/…../../../../data/）；构建目录必须在源码树内（如 build3/）才能命中 <src>/data，否则 InvDynCompare.bulletUrdfR2D2 等用例因找不到 r2d2.urdf 误报失败"
    severity: medium
  - id: K004
    category: ohos_syscall_limit
    description: "OHOS 拦截 System V 共享内存 syscall：最小探针调用 shmget 即被 SIGSYS(31) 杀死（rc=159）。bullet 的 PosixSharedMemory 后端（b3ConnectPhysicsLoopback）因此不可用，上游 Test_PhysicsClientServer 的 LoopBackSharedMemory 用例在 OHOS 上无法通过"
    severity: high
  - id: K005
    category: upstream_cmake_inconsistency
    description: "test/SharedMemory/CMakeLists.txt 无条件 LINK_LIBRARIES(... BussIK)，但 BussIK 目标只在 examples/CMakeLists.txt（BUILD_BULLET2_DEMOS=ON）下定义；BUILD_BULLET2_DEMOS=OFF + BUILD_BULLET3=ON 时链接报 'unable to find library -lBussIK'"
    severity: medium
  - id: K006
    category: vendored_platform_macro
    description: "examples/ThirdPartyLibs/clsocket/src/Host.h 的 uint32 等 typedef 仅在 _LINUX/_DARWIN/_BSD 或 WIN32 下定义，OHOS 两者皆无 → StatTimer.h:90 'unknown type name uint32'。仅影响 BUILD_EXTRAS/BUILD_BULLET2_DEMOS=ON 的 GUI/网络 demo 面（本配方已关闭）"
    severity: low

# 平台说明
platform_notes:
  - "在 HarmonyOS PC aarch64 真机原生构建；conan create 原生编译并运行 aarch64 二进制"
  - "静态库无需运行时依赖，链接后无动态库依赖"
  - "上游 ctest 需在源码树内构建目录运行，否则 data/ 资源查找失败（K003）"
  - "System V 共享内存被平台拦截（K004）"

# 使用建议
usage_notes:
  - "链接顺序：先功能库（BulletDynamics），再基础库（BulletCollision, LinearMath, Bullet3Common）"
  - "包含路径：-I$DEFAULT_PREFIX/include/bullet（例如 #include <btBulletDynamicsCommon.h>）"
  - "CMake 消费：find_package(bullet3 REQUIRED) + target_link_libraries(x bullet3::bullet3)"

