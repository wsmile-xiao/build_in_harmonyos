- "HarmonyOS PC: uid may be absent from the passwd database; pwd.getpwuid raises KeyError — extractor.py needs a fallback to process credentials"
- "HarmonyOS PC bundled Python: subprocess.call with bare executable names skips PATH search (posix_spawn without p-variant); resolve via shutil.which first"
- "HarmonyOS PC system Python has no setuptools; install privately with pip install --target into the Conan build folder and expose via PYTHONPATH"

