# test_package/MANIFEST.yml
# Upstream test declaration (CI L0e requirement, R51 honest reporting)

package: binwalk/2.3.4
homepage: "https://github.com/ReFirmLabs/binwalk"

# Upstream test infrastructure: setup.py test requires nose, which is dead on
# Python 3.12 (nose itself uses the removed imp module). Tests were executed
# with pytest 9 + a 10-line nose.tools compatibility shim instead.
upstream_check_command: "python3 setup.py test"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest testing/tests/ (pytest + nose.tools shim)"

# Upstream tests (binwalk ships testing/tests/*.py, nose style)
upstream_tests:
  - file: testing/tests/test_dirtraversal.py
    source: binwalk-2.3.4/testing/tests/test_dirtraversal.py
    description: "tar extraction + symlink sanitizer (needs external tar)"
    command: "python3 -m pytest testing/tests/test_dirtraversal.py"
    result: "pass (after patch 0003)"
  - file: testing/tests/test_firmware_cpio.py
    source: binwalk-2.3.4/testing/tests/test_firmware_cpio.py
    description: "cpio firmware signature scan"
    command: "python3 -m pytest testing/tests/test_firmware_cpio.py"
    result: "pass"
  - file: testing/tests/test_firmware_gzip.py
    source: binwalk-2.3.4/testing/tests/test_firmware_gzip.py
    description: "gzip firmware signature scan"
    command: "python3 -m pytest testing/tests/test_firmware_gzip.py"
    result: "pass"
  - file: testing/tests/test_firmware_jffs2.py
    source: binwalk-2.3.4/testing/tests/test_firmware_jffs2.py
    description: "jffs2 firmware signature scan"
    command: "python3 -m pytest testing/tests/test_firmware_jffs2.py"
    result: "pass"
  - file: testing/tests/test_firmware_squashfs.py
    source: binwalk-2.3.4/testing/tests/test_firmware_squashfs.py
    description: "squashfs firmware signature scan"
    command: "python3 -m pytest testing/tests/test_firmware_squashfs.py"
    result: "pass"
  - file: testing/tests/test_firmware_zip.py
    source: binwalk-2.3.4/testing/tests/test_firmware_zip.py
    description: "zip firmware signature scan"
    command: "python3 -m pytest testing/tests/test_firmware_zip.py"
    result: "fail: 4 != 2 — upstream expectation stale vs own magic DB (nested zip local file headers also match; pure byte matching, platform-independent)"
  - file: testing/tests/test_lzma.py
    source: binwalk-2.3.4/testing/tests/test_lzma.py
    description: "lzma scan + extraction"
    command: "python3 -m pytest testing/tests/test_lzma.py"
    result: "pass"

# test_package consumer-side verification (R34: real invocation of tested package)
test_package_tests:
  - file: test.sh
    description: "Import binwalk module and run binwalk --help in conanrun env"
    command: "bash test.sh (import binwalk; binwalk --help)"

upstream_test_summary: "6/7 pass, 1 fail (test_firmware_zip, upstream-inherent)"

assertion_count: 2
