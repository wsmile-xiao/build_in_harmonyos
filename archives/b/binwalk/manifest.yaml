# 软件级 manifest
# 文件位置: archives/b/binwalk/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: binwalk
display: "Binwalk (firmware analysis tool)"
description: "Firmware analysis tool for searching binary images for embedded files and code"
category: utility
homepage: "https://github.com/ReFirmLabs/binwalk"
license: MIT

build_system: setuptools

ohos_adaptation:
  key_points:
    - "Pure Python project: no C/C++ compilation, packaged via setuptools"
    - "Python 3.12 removed the imp module: patches replace imp.load_source with importlib.util (module.py/plugin.py)"
    - "System Python ships without setuptools: pip install --target into the Conan build folder, expose via PYTHONPATH"
    - "Extractor needs pwd.getpwuid KeyError fallback (uid absent from OHOS passwd db)"
    - "Bare command names skip PATH search in the bundled Python subprocess: resolve via shutil.which"
    - "v3 (Rust rewrite) does not build on OHOS (glibc dynamic linker); use v2 (Python)"
  common_dependencies: []

versions:
  "3.1.0":
    status: published
    build_date: "2026-06-05"
  "2.3.4":
    status: built
    build_date: "2026-09-18"
