# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ball/1.5.0-git20220524.d85d2dd
homepage: "https://www.ball-project.org"

# 上游测试命令 (用于 make -n check / ctest -N 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest -j1 --output-on-failure"

# 上游实际运行的测试程序 (BALL 核心库测试, test/*_test.C)
upstream_tests:
  - file: test/BALLTestExecutables.cmake
    source: ball-1.5.0+git20220524.d85d2dd/test/BALLTestExecutables.cmake
    description: "BALL 核心库 ctest 套件（约 245 个 *_test.C 用例，经 CMake BALLTestExecutables.cmake 注册）"
    command: "ctest -j1"

# 平台差异豁免声明（OHOS, aarch64, clang 15, cppstd 17）
# 依据 TEST_QUALITY_SPEC.md 3.3：个别用例因平台限制无法通过时声明豁免
upstream_test_exemptions:
  - test: FileSystem_test
    reason: "canonizePath() 的 tilde(~) 展开依赖 HOME 环境变量，OHOS 容器环境未设置 HOME 或展开行为与上游 Linux 不同，属平台环境差异"
  - test: AssignBondOrderProcessor_test2
    reason: "Option::USE_FINE_PENALTY 用例中 compareBondOrder() 结果依赖浮点精度，OHOS libc++/数学库实现与上游 x86_64 Linux 存在数值差异；同解析代码的 AssignBondOrderProcessor_test1 已通过，确认非适配引入缺陷"
  - test: Socket_test
    reason: "依赖 boost asio（TCPServerThread/TCPIOStream），OHOS 上 boost/1.91.0.1 无 asio 头，测试整体条件编译跳过（与 networking.h 守卫一致），网络功能在上游属可选功能"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：链接 libBALL 并真实调用 BALL::init() 与 BALL::String API"
    command: "./test_ball"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 245
