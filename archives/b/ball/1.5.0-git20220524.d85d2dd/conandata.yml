    # OHOS 适配补丁（C++17 兼容 + 依赖适配，refresh-patch 自动编号）：
    # 1. CMake 4.x 兼容：移除 CMP0042 OLD（4.x 强制 NEW）
    # 2. BALLCompilerSpecific.cmake 的 -std=c++11 改为 -std=c++17（OHOS libc++ 为 C++17+ 设计）
    # 3. boost 1.91.0.1 无 regex/system 编译库，去掉 regex/system
    # 4. hashGrid.h 的 std::mem_fun_ref 在 C++17 已移除，改 lambda
    # 5. regularExpression.h 的 boost/regex.h 映射 Windows 风格 regcompA，改用系统 <regex.h>
    # 6. dockResultFile.h 去掉未使用的 QtXml include 与 QXmlAttributes 重载
    # 7. networking.h 的 boost/asio 头缺失：无 asio 时 TCPIOStream 回退 std::iostream
    # 8-9. TOOLS 的 gzip 解压依赖 boost iostreams zlib（未编译），条件编译 BALL_ENABLE_GZIP 关闭
    # 10. exception.C 的 set_unexpected 在 C++17 已移除，条件编译
    # 11. enumerator.C 的 std::bind2nd 在 C++17 已移除，改 lambda
    # 12. hashGrid.C 的 char 窄化错误，改 signed char
    # 13. SDFile.C 补 <ios> include + std::streampos
    # 14. dockResultFile.C 删除 QXmlAttributes 重载定义
    # 15. genericMolFile.C 的 gzip 输出压缩条件编译（OHOS 无 zlib）
    # 16. molFileFactory.C 的 .gz 输入解压条件编译
    # 17. gridBasedScoring.C 的 gzip 读写条件编译
    # 18. DNAMutator.C 的 std::mem_fun 在 C++17 已移除，改 std::mem_fn
