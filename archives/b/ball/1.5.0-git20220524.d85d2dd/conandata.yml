    # 20. hybridisationProcessor.C 的 QDom 解析改用 QtCore QXmlStreamReader
    # 21. networking.C 实现文件与 networking.h 一致，包进 BALL_HAS_BOOST_ASIO 守卫
    # 22-23. VIEW 对话框的 gzip 下载解压条件编译
