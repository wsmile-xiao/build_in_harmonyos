knowledge_gained:
  - "boolinq 为单头文件 header-only 库，交付物仅 include/boolinq/boolinq.h，package_id 清空单一 ID" # knowledge_ref: E741
  - "release tarball 内 externals/googletest 与 externals/benchmark 子模块目录为空，上游根 CMakeLists 的 add_subdirectory 在 tarball 构建下必炸，需补丁改走 Conan GTest" # knowledge_ref: E741
  - "CMake 4.x 对 cmake_minimum_required(VERSION 3.0) 直接硬错误，老项目随包 CMakeLists 需补丁抬版本下限" # knowledge_ref: E741
  - "gtest/1.17.0 头文件实测要求 C++17（-std=c++11/c++14 编译失败），上游测试树钉 C++11 时必须同步抬到 17" # knowledge_ref: E741
  - "header-library 包的 G4/L2/L4/L5 门禁走跳过分支却并列打 ✅，需人工补测（device-facts §二.17）" # knowledge_ref: E741

