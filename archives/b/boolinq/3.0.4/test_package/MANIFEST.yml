# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: boolinq/3.0.4
homepage: "https://github.com/k06a/boolinq"

# 上游测试入口盘点命令（上游无 make check；测试由根 CMake 的 ADD_TEST 注册 2 条）
upstream_check_command: "grep -rcE '^[[:space:]]*TEST[[:space:]]*\\(' test/*.cpp  # 源码宏清点；ctest -N  # ADD_TEST 注册清点"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./boolinq-test && ./boolinq-test14  # gtest 汇总行解析计数，非零即失败"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/*.cpp
    source: boolinq-3.0.4/test/
    description: "GoogleTest 主套件 boolinq-test：38 个翻译单元，213 个 TEST 用例（全部通过）"
    command: "./boolinq-test"
  - file: test/GroupByTestComplex.cpp
    source: boolinq-3.0.4/test/GroupByTestComplex.cpp
    description: "GoogleTest 独立目标 boolinq-test14（上游要求 C++14，补丁下按 C++17 构建），1 个 TEST 用例（通过）"
    command: "./boolinq-test14"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者断言链：include <boolinq/boolinq.h> 后真实调用 from/where/select/sum/avg/count/any/all/contains/first/last/elementAt/take/skip/orderBy/distinct/toStdSet/toStdList/append/range/repeat/for_each/LinqEndException 共 26 个显式检查"
    command: "./test_boolinq"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 26
