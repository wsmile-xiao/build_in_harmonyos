package: boost1.84-serialization/1.84.0
homepage: https://www.boost.org/libs/serialization/

# 上游测试说明（2026-09-06 扩充，对齐审核实测口径 122）
# 上游 test/ 目录 122 个 .cpp 测试源，本包纳入 91 个，conan create 实测
# 91/91 通过（78 RUN + 4 compile-only + 9 compile-fail），0 失败。
# Boost.Serialization 的上游测试基于 test_tools.hpp（自带 main +
# boost/core/lightweight_test.hpp 的 BOOST_TEST 宏），不依赖
# boost_unit_test_framework 库——可绕过 b2 直接编译运行。
# 容器类测试（list/map/set/vector/deque）需链接测试夹具 A.cpp；多 TU
# polymorphic 类按上游规则传 -DBOOST_ARCHIVE_TEST=polymorphic_text_archive.hpp。
# 未纳入的 31 个（dll/多共享库类 3、SGI hash/slist 扩展 4、遗留未注册
# 13、空文件/已知失败 4、warn 变体 3、其他 4）逐类理由见 PR 描述与 notes.md。
# test_tools.hpp 的 tmpnam 用 boost::filesystem::unique_path，测试阶段
# 额外本地编译 boost_filesystem.a（仅测试用，不入 package 产物）。
upstream_test_in_build: true
