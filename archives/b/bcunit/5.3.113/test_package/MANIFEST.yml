# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bcunit/5.3.113
homepage: "https://github.com/BelledonneCommunications/bcunit"

# 上游测试:bcunit 自带内部自测程序 test_bcunit(自测试框架不能用 BCUnit 测试
# 自身),测试代码以 BCUNIT_BUILD_TESTS 条件编译嵌在框架源文件内
# (CUError/MyMem/TestDB/TestRun/Util 五个模块),由
# -DENABLE_BCUNIT_TEST=ON 编译为 BCUnit/Sources/Test/test_bcunit。
upstream_check_command: "cmake -DENABLE_BCUNIT_TEST=ON ... && make && ./BCUnit/Sources/Test/test_bcunit"

# conanfile.py build() 方法中是否已集成上游测试
# (5.3.113 配方在 build() 内以 ENABLE_BCUNIT_TEST=ON 编译并直接执行该自测程序,
#  输出同时 tee 到 build folder 的 upstream-self-test.log,并断言
#  Total Number of Assertions=3915、Failures=0,不符即构建失败;程序不安装,
#  包内容不受影响)
upstream_test_in_build: true
upstream_test_command: "make test_bcunit && ./BCUnit/Sources/Test/test_bcunit"

# 上游实际运行的测试程序
upstream_tests:
  - file: BCUnit/Sources/Test/test_bcunit.c
    source: bcunit-5.3.113/BCUnit/Sources/Test/test_bcunit.c
    description: "BCUnit 内部自测:CUError/MyMem/TestDB/TestRun/Util 五模块断言(统计单位=断言)"
    command: "./BCUnit/Sources/Test/test_bcunit"

# test_package 中自带的测试 (消费者视角验证)
# 同一二进制两次调用(上游 automated 接口同进程只能运行一次,见 test.c 说明):
#   test_bcunit          → 基础接口 + pUserData + 完整 JUnit 报告 + trace handler,6 项检查
#   test_bcunit partial  → 部分 JUnit 报告(CU_automated_enable_partial_junit),4 项检查
test_package_tests:
  - file: test_package/test.c
    description: "消费者冒烟:注册 registry/suite/3 用例并设置 CU_Suite.pUserData,CU_basic_run_tests 后校验 3/3、失败 0、断言 6;automated 接口输出 JUnit 完整报告(含 <testsuites>);CU_set_trace_handler 探针被框架输出路径调用"
    command: "./test_bcunit"
  - file: test_package/test.c
    description: "消费者冒烟(partial 模式):CU_automated_enable_partial_junit(CU_TRUE) 后 JUnit 报告不含 <testsuites> 但仍含 <testsuite>,运行 2 用例且失败 0"
    command: "./test_bcunit partial"

# 测试断言总数 (上游 test_bcunit 2026-09-10 设备实测)
assertion_count: 3915
