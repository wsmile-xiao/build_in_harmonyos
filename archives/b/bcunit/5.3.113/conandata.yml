sources:
  # Official Belledonne Communications repository, tag 5.3.113 archive.
  # (The 5.3.113 tag carries the linphone-sdk 5.3 line content: it declares
  # project(BCUnit VERSION "3.0.2") internally, see notes.md; the tag archive
  # is the official source distribution, no release asset exists upstream.)
  url: "https://github.com/BelledonneCommunications/bcunit/archive/refs/tags/5.3.113.tar.gz"
  sha256: "9353fd915cdd071587d00b914e21eb4f64a63bb9fbe181fd05c4f82c256a38ba"
patches:
  - patch_file: "patches/0001-fix-bcunit-test-include-directories.patch"
    patch_description: "Give the internal test target bcunit_test the framework header directories; the 5.3.113 refactor moved include paths from global include_directories() onto the bcunit target only so ENABLE_BCUNIT_TEST=ON no longer compiles (fatal error: BCUnit_intl.h file not found)"
    patch_type: "portability"
  - patch_file: "patches/0002-move-cu-trace-handler-to-framework.patch"
    patch_description: "Move the CU_trace_handler storage definition from the Basic interface source into framework Util.c; bcunit_test contains framework sources only while Util.c references the symbol so the upstream self-test program fails to link with undefined symbol CU_trace_handler"
    patch_type: "bugfix"
