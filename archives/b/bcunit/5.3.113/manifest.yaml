# 版本级 manifest
# 文件位置: archives/b/bcunit/5.3.113/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "5.3.113"
software: "bcunit"
status: built
build_date: "2026-09-10"
build_system: "cmake"

source:
  url: "https://github.com/BelledonneCommunications/bcunit/archive/refs/tags/5.3.113.tar.gz"
  sha256: "9353fd915cdd071587d00b914e21eb4f64a63bb9fbe181fd05c4f82c256a38ba"
  tar_format: tar.gz

build:
  system: cmake
  # 库类型由 Conan toolchain 写入的 BUILD_SHARED_LIBS 决定(上游 5.3.113 用裸
  # add_library() 建 bcunit 目标,无自己的 ENABLE_SHARED/ENABLE_STATIC 开关)。
  # 默认变体 shared=False → libbcunit.a;shared=True → libbcunit.so。
  # ENABLE_BCUNIT_TEST=ON 用于构建并运行上游内部自测;程序不安装,包内无 bin/。
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DENABLE_BCUNIT_TEST=ON"
    - "-DENABLE_BCUNIT_EXAMPLES=OFF"
    - "-DENABLE_BCUNIT_DOC=OFF"
    - "-DENABLE_BCUNIT_CURSES=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-bcunit-test-include-directories.patch"
  - "0002-move-cu-trace-handler-to-framework.patch"

# 上游测试统计（统计单位：断言；测试程序为上游自带的 BCUnit 内部自测 test_bcunit，
# 启用方式 -DENABLE_BCUNIT_TEST=ON 编译 BCUnit/Sources/Test/test_bcunit 并直接运行）
# 上游测试：TOTAL=3915 PASS=3915 FAIL=0 SKIP=0 NOT_RUN=0（取数命令见 notes.md §7）
# test_package 自建消费者：1 个程序 2 次调用（full/partial 两种 JUnit 模式）
# TOTAL=2 PASS=2 FAIL=0 SKIP=0 NOT_RUN=0（统计单位=进程调用；分栏统计，不混入上游数）
upstream_test:
  program: "BCUnit/Sources/Test/test_bcunit.c"
  enable_flag: "-DENABLE_BCUNIT_TEST=ON"
  stat_unit: "assertions"
  count_command: "./test_bcunit | grep 'Total Number of Assertions'"
  total: 3915
  pass: 3915
  fail: 0
  skip: 0
  not_run: 0

knowledge_gained:
  - "上游 5.3.113 把框架头文件目录从全局 include_directories() 改成 bcunit 目标的 target_include_directories() 时漏掉内部测试目标 bcunit_test,ENABLE_BCUNIT_TEST=ON 下 CUError.c 报 fatal error: BCUnit_intl.h file not found;给该目标补上源码与生成目录两个 Headers 路径即恢复(补丁 0001),属上游重构回归而非平台问题 (reference: archives/b/bcunit/5.3.113/patches/0001-fix-bcunit-test-include-directories.patch)"
  - "bcunit 的 CU_trace_handler 存储定义长期放在接口文件 Basic/Basic.c 而框架 Util.c 只 extern 引用;bcunit_test 静态库仅含框架源文件,5.3.113 的上游自测程序链接必然报 undefined symbol CU_trace_handler,把存储定义移入 Util.c(其他翻译单元本就 extern 引用)即修复,导出符号集与 ABI 不变(补丁 0002) (reference: archives/b/bcunit/5.3.113/patches/0002-move-cu-trace-handler-to-framework.patch)"
  - "bcunit 5.3.113 的 automated 接口在同一进程内只能运行一次:CU_automated_run_tests() 第二次调用必然 SIGSEGV,用未打补丁的原始源码 5.3.113 同样复现(与本次两个构建/链接补丁无关);同一进程内 basic 接口可重复运行、basic 与 automated 任意顺序各一次均正常,需要两种 JUnit 模式时分进程调用 (reference: archives/b/bcunit/5.3.113/notes.md)"
