# 版本级 manifest
# 文件位置: archives/b/bcunit/3.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "3.0.2"
software: "bcunit"
status: built
build_date: "2026-09-06"
build_system: "cmake"

source:
  url: "https://github.com/BelledonneCommunications/bcunit/archive/refs/tags/3.0.2.tar.gz"
  sha256: "eb7090aca5006aa0cea425722cb3fa1a7139185a7d9d1734d57844f69084713f"
  tar_format: tar.gz

build:
  system: cmake
  # 默认变体(shared=False);shared=True 时配方映射为 -DENABLE_SHARED=ON
  # -DENABLE_STATIC=OFF。ENABLE_CURSES/ENABLE_MEMTRACE/ENABLE_DEPRECATED 未显式
  # 传参,走上游默认 OFF(CMakeLists.txt option 声明)。
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DENABLE_SHARED=OFF"
    - "-DENABLE_STATIC=ON"
    - "-DENABLE_TEST=OFF"
    - "-DENABLE_EXAMPLES=OFF"
    - "-DENABLE_DOC=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-minimum-version-3.5.patch"
  - "0002-move-cu-trace-handler-to-framework.patch"

# 上游测试统计（统计单位：断言；测试程序为上游自带的 BCUnit 内部自测 test_bcunit，
# 启用方式 -DENABLE_TEST=ON 编译 BCUnit/Sources/Test/test_bcunit 并直接运行）
# 上游测试：TOTAL=3915 PASS=3915 FAIL=0 SKIP=0 NOT_RUN=0（取数命令见 notes.md §测试统计）
# test_package 自建消费者：1 个程序，2 用例（统计单位=tests，4 断言）TOTAL=2 PASS=2
# FAIL=0 SKIP=0 NOT_RUN=0（分栏统计，不混入上游数）
upstream_test:
  program: "BCUnit/Sources/Test/test_bcunit.c"
  enable_flag: "-DENABLE_TEST=ON"
  stat_unit: "assertions"
  count_command: "./test_bcunit | grep 'Total Number of Assertions'"
  total: 3915
  pass: 3915
  fail: 0
  skip: 0
  not_run: 0

knowledge_gained:
  - "CMake 4.x 移除对 cmake_minimum_required(VERSION <3.5) 的兼容支持;2017 年代上游声明 2.8.12 的 CMake 工程在 CMake 4.1 设备上 configure 直接报错,把最小版本提升到 3.5 即可恢复 (reference: archives/b/bcunit/3.0.2/patches/0001-cmake-minimum-version-3.5.patch)"
  - "bcunit 的 bcunit_test 静态库只含框架源文件,而 CU_trace_handler 存储定义错误地放在接口文件 Basic/Basic.c 中,ENABLE_TEST=ON 时 test_bcunit 链接报 undefined symbol CU_trace_handler;把存储定义移入框架 Util.c(其他翻译单元本就 extern 引用)修复,属上游架构性缺陷而非平台问题 (reference: archives/b/bcunit/3.0.2/patches/0002-move-cu-trace-handler-to-framework.patch)"
