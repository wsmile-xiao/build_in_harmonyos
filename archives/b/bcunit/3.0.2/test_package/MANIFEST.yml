# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bcunit/3.0.2
homepage: "https://github.com/BelledonneCommunications/bcunit"

# 上游测试:bcunit 自带内部自测程序 test_bcunit(自测试框架,不能用 BCUnit
# 测试自身),测试代码以 BCUNIT_BUILD_TESTS 条件编译嵌在框架源文件内
# (CUError/MyMem/TestDB/TestRun/Util 五个模块),由
# -DENABLE_TEST=ON 编译为 BCUnit/Sources/Test/test_bcunit。
upstream_check_command: "cmake -DENABLE_TEST=ON ... && make && ./BCUnit/Sources/Test/test_bcunit"

# conanfile.py build() 方法中是否已集成上游测试
# (包内默认不编测试程序;上游测试按流程在原生验证阶段独立执行,见 notes.md)
upstream_test_in_build: false
upstream_test_command: "make test_bcunit && ./BCUnit/Sources/Test/test_bcunit"

# 上游实际运行的测试程序
upstream_tests:
  - file: BCUnit/Sources/Test/test_bcunit.c
    source: bcunit-3.0.2/BCUnit/Sources/Test/test_bcunit.c
    description: "BCUnit 内部自测:CUError/MyMem/TestDB/TestRun/Util 五模块断言(统计单位=断言)"
    command: "./BCUnit/Sources/Test/test_bcunit"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.c
    description: "消费者冒烟:注册 registry/suite/2 个用例,CU_basic_run_tests 运行并校验计数 2/2、失败 0"
    command: "./test_bcunit"

# 测试断言总数 (上游 test_bcunit 2026-09-06 实测)
assertion_count: 3915
