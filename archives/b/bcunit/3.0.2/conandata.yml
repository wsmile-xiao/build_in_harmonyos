sources:
  # Official Belledonne Communications repository, tag 3.0.2 archive.
  # (The "release" asset bcunit-3.0.2.tar.gz does not exist upstream; the
  # tag archive below is the official source distribution.)
  url: "https://github.com/BelledonneCommunications/bcunit/archive/refs/tags/3.0.2.tar.gz"
  sha256: "eb7090aca5006aa0cea425722cb3fa1a7139185a7d9d1734d57844f69084713f"
patches:
  - patch_file: "patches/0001-cmake-minimum-version-3.5.patch"
    patch_description: "Raise cmake_minimum_required from 2.8.12 to 3.5; CMake 4.x removed compatibility with declarations below 3.5 so the 2017-era upstream declaration aborts configure on CMake 4.1"
    patch_type: "portability"
  - patch_file: "patches/0002-move-cu-trace-handler-to-framework.patch"
    patch_description: "Move the CU_trace_handler storage definition from Basic/Basic.c into framework Util.c (all other translation units already extern-reference it); fixes undefined symbol CU_trace_handler when linking the upstream self-test program test_bcunit"
    patch_type: "bugfix"
