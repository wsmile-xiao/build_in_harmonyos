# 软件级 manifest
# 文件位置: archives/b/bcunit/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: "bcunit"
display: "BCUnit"
description: "Belledonne Communications 维护的 C 单元测试框架(CUnit fork),提供 Basic/Automated(XML)/Console 三种输出接口,是 bctoolbox/Linphone 测试栈的依赖"
category: "library"
homepage: "https://github.com/BelledonneCommunications/bcunit"
license: "LGPL-2.0-or-later"
build_system: "cmake"

ohos_adaptation:
  key_points:
    - "tag 版本号与内容时代不一致:tag 3.0.2(2017 内容)与 tag 5.3.113(linphone-sdk 5.3 线内容)都声明 project(BCUnit VERSION \"3.0.2\"),按内容时代选版本"
    - "3.0.2:CMake 4.x 要求 cmake_minimum_required ≥3.5,上游 2017 年代声明 2.8.12 需提升(该版本补丁 0001)"
    - "5.3.113:上游把框架头文件目录改成只挂在 bcunit 目标上,内部测试目标 bcunit_test 失去 Headers 路径,ENABLE_BCUNIT_TEST=ON 编译即错(该版本补丁 0001)"
    - "两版本同型缺陷:上游自测程序 test_bcunit 因 CU_trace_handler 存储位置错误无法链接,需补丁把存储定义移入框架 Util.c"
    - "5.3.113 上游 automated 接口同进程二次调用必然 SIGSEGV(原始源码同样复现);消费侧分进程调用规避,不改上游"
    - "上游无第三方依赖,仅 libc;消费方式 #include \"BCUnit/BCUnit.h\""
  common_dependencies: []

versions:
  "3.0.2":
    status: built
    build_date: "2026-09-06"
    conan_ref: "bcunit/3.0.2"
  "5.3.113":
    status: built
    build_date: "2026-09-10"
    conan_ref: "bcunit/5.3.113"

current_version: "5.3.113"
status: "built"
