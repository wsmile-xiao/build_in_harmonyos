# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: boost1.84-contract/1.84.0
homepage: "https://www.boost.org/doc/libs/1_84_0/libs/contract/"

# 上游测试命令 (b2 构建系统在 OHOS 不兼容 E068，无法直接运行 make check，
# conanfile.py build() 中手动编译运行上游 lightweight_test 测试源文件)
upstream_check_command: "b2 libs/contract/test (upstream; OHOS 上不可用，配方内手动编译子集)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "conan create (配方 build() 编译运行 libs/contract/test 代表性子集，报告 upstream-tests-report.txt)"

# 上游实际运行的测试程序（配方 build() 手动编译运行，226 个源文件中
# 选 32 个代表性用例：排除 *_error.cpp 编译失败用例 / lib_*.cpp 库模式
# 辅助单元 / no_tva 变体；覆盖 constructor/destructor/function/
# public_function/invariant/old/call_if/check 核心特性面）
upstream_tests:
  - file: check/ifdef.cpp
    description: "断言级别宏开关 (BOOST_CONTRACT_STATIC_LINK 等 ifdef 组合)"
  - file: check/audit.cpp
    description: "audit 级断言（需 -DBOOST_CONTRACT_AUDITS，配方内已注入）"
  - file: check/axiom.cpp
    description: "axiom 级断言（需 -DBOOST_CONTRACT_AUDITS + AXIOM）"
  - file: constructor/smoke.cpp
    description: "构造函数契约冒烟"
  - file: constructor/access.cpp
    description: "构造函数契约访问控制"
  - file: constructor/throwing_body.cpp
    description: "构造函数体抛异常时的契约语义"
  - file: constructor/throwing_old.cpp
    description: "构造函数 old 值拷贝抛异常"
  - file: destructor/smoke.cpp
    description: "析构函数契约冒烟"
  - file: destructor/throwing_body.cpp
    description: "析构函数体抛异常"
  - file: function/smoke.cpp
    description: "自由函数契约冒烟"
  - file: function/throwing_pre.cpp
    description: "前置条件断言失败"
  - file: function/throwing_post.cpp
    description: "后置条件断言失败"
  - file: public_function/smoke.cpp
    description: "成员函数契约冒烟（含类不变式）"
  - file: public_function/static.cpp
    description: "静态成员函数契约"
  - file: public_function/protected.cpp
    description: "受保护成员函数契约"
  - file: public_function/virtual.cpp
    description: "虚函数契约（含子契约转发）"
  - file: public_function/virtual_branch.cpp
    description: "虚函数分支契约"
  - file: public_function/overload.cpp
    description: "重载成员函数契约"
  - file: public_function/friend.cpp
    description: "友元函数契约"
  - file: public_function/max_args.cpp
    description: "最大参数数契约"
  - file: invariant/decl_const.cpp
    description: "const 成员函数类不变式"
  - file: invariant/decl_static.cpp
    description: "静态类不变式"
  - file: old/no_macro.cpp
    description: "无宏 old 值拷贝"
  - file: old/auto.cpp
    description: "auto 类型 old 值"
  - file: old/if_copyable.cpp
    description: "可拷贝 old 值（BOOST_CONTRACT_OLD_PTR）"
  - file: call_if/false_.cpp
    description: "call_if false 分支（非 void 返回）"
  - file: call_if/true_.cpp
    description: "call_if true 分支"
  - file: call_if/equal_to.cpp
    description: "call_if STL equal_to 结合"
  - file: call_if/false_void.cpp
    description: "call_if void 返回类型"
  - file: call_if/no_equal_call_if.cpp
    description: "call_if 无相等比较类型"
  - file: specify/nothing.cpp
    description: "空契约说明（.nothing()）"
  - file: specify/old.cpp
    description: "old 值说明子句"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_boost_contract.cpp
    description: "Boost.Contract 消费者冒烟：自由函数 pre/post 契约、类不变式+public_function、call_if 编译期分派、Throw-on-Failure violation 捕获（set_postcondition_failure）"
    command: "./test_boost_contract"

assertion_count: 12
