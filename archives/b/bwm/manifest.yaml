software: bwm
display: "bwm"
description: "轻量控制台带宽监控命令行工具（Bandwidth Monitor，bwm-ng 上游 v0.6.3）"
category: network
homepage: "https://www.gropp.org/?id=projects&sub=bwm-ng"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "关闭 curses/ncurses UI（--without-curses / --without-ncurses），保留 plain/csv 文本输出"
    - "使用 --with-proc-netdev，通过 /proc/net/dev 读取接口统计"
    - "静态链接（-static，R26），产物无 NEEDED 动态依赖"
    - "autoreconf 之后补丁 config.guess/config.sub 识别 HarmonyOS（E007/R15），禁止 --build/--host"
    - "构建依赖 automake/1.18 + libtool/2.5.4（tool_requires），不硬编码本机路径"
    - "上游无测试套件，HMBS_UPSTREAM_TEST_RESULT 按 no_tests 口径输出"

versions:
  "0.6.3":
    status: built
    build_date: "2026-09-09"
