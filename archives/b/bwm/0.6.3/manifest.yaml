version: "0.6.3"
software: "bwm"
status: built
build_date: "2026-09-09"
build_system: "autotools"

source:
  url: "https://github.com/vgropp/bwm-ng/archive/refs/tags/v0.6.3.tar.gz"
  tar_format: tar.gz
  sha256: "c1a552b6ff48ea3e4e10110a7c188861abc4750befc67c6caaba8eb3ecf67f46"

build:
  system: autotools
  configure_options:
    - "--without-curses"
    - "--without-ncurses"
    - "--with-proc-netdev"
  extra_ldflags:
    - "-static  # link-time only (make LDFLAGS append); kept out of configure LDFLAGS so conftest is clean"
  tool_requires:
    - m4/1.4.19
    - autoconf/2.72
    - automake/1.18
    - libtool/2.5.4
    - perl/5.42.2
  cc: clang

patches_applied: []

knowledge_gained:
  - "bwm 0.6.3 upstream ships no test suite — no tests/ dir and no TESTS in Makefile.am, automake make check is a no-op (audited)"
  - "Disable curses/ncurses (--without-curses / --without-ncurses) on OHOS to avoid ncurses dev dep; plain/csv output retained"
  - "Use --with-proc-netdev input method; OHOS exposes /proc/net/dev"
  - "Static link via -static at make link time only (R26) so packaged bwm/bwm-ng has no runtime dynamic deps; -static is kept out of AutotoolsToolchain LDFLAGS so configure conftest stays clean (true-machine Error 77 otherwise)"
  - "E007/R15: after autoreconf, patch config.guess/config.sub for HarmonyOS; do not pass --build/--host"
  - "E114: relax umask 077 to 022 in generated configure so config.status temp dirs are writable on HMDFS"
  - "E178: tool_requires m4/1.4.19 + autoconf/2.72 + automake/1.18 + libtool/2.5.4 (full bootstrap chain) with autoreconf run under env=conanbuild; true machine has no autotools on PATH otherwise"
  - "OHOS has no /usr/bin/perl so automake/1.18 aclocal/automake wrappers die with ENOENT/126; build() shadows them with build-local shims execing the same hidden .*-real via perl/5.42.2 tool binary (autoconf/2.72 _wrap_perl_tools precedent; automake package untouched)"
  - "readonly_tmp guard: reuse HMBS-injected TMPDIR/TMP/TEMP, fallback to <build>/tmp so autoreconf/configure mktemp never hits read-only /tmp"
  - "HMBS evidence: test_package/test.sh emits HMBS_UPSTREAM_TEST_RESULT status=no_tests every run; test_package/conanfile.py re-emits it for cache-hit runs (build() does not run make check, upstream_test_in_build: false)"
