# upstream_tests_exist:false 的库一律 upstream_check_command:""
# (清单器凭此字段判"上游是否存在测试命令", 非空时强制要求真机发现并执行)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# false: 上游 genuinely 无测试套件, build() 不集成 make check;
# 上游测试证据由 test_package/test.sh 在 test 阶段产生 (对齐 osmctools/0.9 范例)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "bwm --version 烟雾测试，确认可执行并输出 bwm 字样（非空输出校验）"
    command: "bwm --version"
  - file: test.sh
    description: "bwm --help 烟雾测试，确认帮助信息含 usage/options/output"
    command: "bwm --help"
  - file: test.sh
    description: "bwm -o plain 输出模式（1 个采样窗口，非空或受控退出码）"
    command: "bwm -o plain -d 1 -c 1"
  - file: test.sh
    description: "bwm -o csv 输出模式（1 个采样窗口，逗号分隔符校验）"
    command: "bwm -o csv -d 1 -c 1"
  - file: test.sh
    description: "readelf 校验产物 ELF 类型（EXEC/DYN）"
    command: "readelf -h bwm"
  - file: test.sh
    description: "校验产物为静态链接（R26：不应有 NEEDED 项）"
    command: "readelf -d bwm"

assertion_count: 6
