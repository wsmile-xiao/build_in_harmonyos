package: bookloupe/2.0
homepage: "http://www.juiblex.co.uk/pgdp/bookloupe/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - "test/compatibility/*.tst — 35 compatibility cases (missing-space, spaced-punctuation, html-tag, html-symbol, spaced-doublequote, mismatched-quotes, he-be, digits, extra-period, ellipsis, short-line, abbreviation, example, non-ascii, embedded-lf, markup, user-defined-typo, brackets, single-quotes, grave-quotes, dashes, control-characters, unusual-characters, windows-1252, periods, long-line, unmarked-paragraph, hebe-jeebies, mail-from, scannos, before-comma, before-period, double-punctuation, genatives, embedded-cr)"
  - "test/bookloupe/*.tst — 2 bookloupe-specific cases (non-ascii, long-line)"

test_package_tests:
  - file: test_bookloupe.sh
    description: "Runs the packaged bookloupe binary on a sample e-text line and verifies it reports the expected 'Missing space?' diagnostic and exits 0"
    command: "bash test_bookloupe.sh"

assertion_count: 2
