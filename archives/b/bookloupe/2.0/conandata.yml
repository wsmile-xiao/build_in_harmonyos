# conandata.yml — bookloupe 2.0
# Source: official bookloupe website (http, upstream has no https endpoint).
sources:
  url: "http://www.juiblex.co.uk/pgdp/bookloupe/bookloupe-2.0.tar.gz"
  sha256: "15b1f5a0fa01e7c0a0752c282f8a354d3dc9edbefc677e6e42044771d5abe3c9"

patches:
  - patch_file: "patches/config-sub-aarch64.patch"
    patch_description: "Add aarch64 / aarch64-* to the bundled 2009-era config.sub CPU match lists so configure accepts the aarch64-linux host used on HarmonyOS PC"
    patch_type: "portability"
  - patch_file: "patches/configure-umask.patch"
    patch_description: "E114/HMDFS: config.status creates its temp dir with umask 077 (drwx--S--- not writable by owner on HMDFS) - relax to umask 022 so ./confXXXXXX/subs1.awk can be created"
    patch_type: "portability"
