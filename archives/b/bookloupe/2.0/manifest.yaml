software: bookloupe
version: "2.0"
status: built
build_date: "2026-09-05"
build_system: "autotools"
conan_ref: "bookloupe/2.0"

source:
  url: "http://www.juiblex.co.uk/pgdp/bookloupe/bookloupe-2.0.tar.gz"
  sha256: "15b1f5a0fa01e7c0a0752c282f8a354d3dc9edbefc677e6e42044771d5abe3c9"
  tar_format: tar.gz

build:
  system: autotools
  build_subdir: "."
  configure_options:
    - "./configure --prefix=/ (autotools; OHOS: --host=aarch64-linux [--build=aarch64-linux when native])"
    - "make -j1"
    - "make check -j1 (37 upstream .tst cases, only when can_run)"
  dependencies:
    - "glib/2.88.0.1"
  cc: clang
  cxx: N/A

patches_applied:
  - "patches/config-sub-aarch64.patch (add aarch64/aarch64-* to the bundled 2009-era config.sub CPU lists — minimal surgical portability change)"
  - "patches/configure-umask.patch (E114/HMDFS: relax config.status temp-dir umask 077→022)"

knowledge_gained:
  - "bookloupe 2.0 upstream source is only served over http (www.juiblex.co.uk has no https); the same-file tarball checksum matches the Homebrew formula (sha256 15b1f5a0...) — R39-official website source"
  - "Upstream is autotools + GLib (PKG_CHECK_MODULES glib-2.0 >= 2.18). PkgConfigDeps + PKG_CONFIG_PATH=generators_folder makes configure resolve glib-2.0 without a system glib; no pkg-config-free fallback needed"
  - "The bundled config.sub (2009-era) has no aarch64 CPU entries; surgical patch adds aarch64/aarch64-* to its CPU match lists so configure accepts --host=aarch64-linux (HarmonyOS PC)"
  - "OHOS HMDFS: config.status temp dir ./confXXXXXX created with umask 077 yields drwx--S--- not writable by owner → subs1.awk Permission denied (E114); patch relaxes umask to 022"
  - "Static glib: AC_CHECK_FUNCS g_mkdtemp link probe can spuriously fail → bl/mkdtemp.c would compile duplicate g_mkdtemp; pin ac_cv_func_g_mkdtemp/mkdtemp=yes"
  - "Libtool dependency *.la archives shipped by published conan packages record release-worker libdir → device libtool 'was moved / not a valid libtool archive'; delete dependency *.la before make"
  - "pkg-config 系统搜索残留 glib-2.0.pc 会使 GLIB_LIBS 缺 -lintl（设备间不确定）；用 PKG_CONFIG_LIBDIR=<generators> 禁用系统搜索"
  - "The glib/2.88.0.1 recipe publishes static glib (shared=False) binaries for armv8/clang15/OHOS; bookloupe links the static libglib-2.0.a (+ libintl.a and pcre2 from the Conan graph)"
  - "Upstream regression suite = 37 .tst cases (35 compatibility + 2 bookloupe) run through test/harness/loupe-test via 'make check'; runs only where binaries are executable (native OHOS worker/device)"
  - "Runtime data file bookloupe.typ is looked up in CWD then next to the executable — package it in bin/ so the tool is self-contained"
