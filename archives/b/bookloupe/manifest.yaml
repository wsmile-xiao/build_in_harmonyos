software: bookloupe
display: "bookloupe"
description: "Check Project Gutenberg candidate e-texts for common formatting errors (long/short lines, unbalanced quotes or brackets, punctuation and spacing, HTML tags, likely typos)"
category: utility
homepage: "http://www.juiblex.co.uk/pgdp/bookloupe/"
license: "GPL-2.0-only"
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools + GLib (glib-2.0 >= 2.18, PKG_CHECK_MODULES); GLib discovered through PkgConfigDeps .pc files (glib/2.88.0.1, static)"
    - "bundled config.sub predates aarch64 — refreshed via patches/config-sub-aarch64.patch; configure runs with --host=aarch64-linux"
    - "upstream regression suite: 37 .tst cases (test/compatibility 35 + test/bookloupe 2) via loupe-test harness, run through make check when can_run"
    - "runtime data file bookloupe.typ is looked up in CWD then next to the executable — installed in bin/ for a self-contained tool"
    - "no upstream C source changes required (build-aux portability only)"
  common_dependencies:
    - "glib"

versions:
  "2.0":
    status: built
    build_date: "2026-09-05"
    conan_ref: "bookloupe/2.0"
