# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: bshoshany-thread-pool/5.1.0
homepage: "https://github.com/bshoshany/thread-pool"

# 上游单文件测试程序（无 CMake 项目，用上游自带 compile_cpp.py 或 clang++ 直接编译运行）
upstream_test_command: "python3 scripts/compile_cpp.py tests/BS_thread_pool_test.cpp --run --type=release -c clang++ -s c++17"

upstream_tests:
  - file: tests/BS_thread_pool_test.cpp
    source: thread-pool-5.1.0/tests/BS_thread_pool_test.cpp
    description: "BS::thread_pool 上游全量测试程序（submit/loop/sequence/wait/pause/affinity/priority 等）"
    command: "python3 scripts/compile_cpp.py tests/BS_thread_pool_test.cpp --run --type=release -c clang++ -s c++17"

test_package_tests:
  - file: test_bs_thread_pool.cpp
    description: "消费者测试: submit_task/get、detach_loop/wait、并发求和、版本对象、native affinity get/set 回读（OHOS sched_* 补丁路径）"
    command: "./test_bs_thread_pool"

assertion_count: 6
