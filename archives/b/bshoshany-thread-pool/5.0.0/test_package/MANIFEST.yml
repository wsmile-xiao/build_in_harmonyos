# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: bshoshany-thread-pool/5.0.0
homepage: "https://github.com/bshoshany/thread-pool"

# 上游单文件测试程序（无 CMake 项目，直接 clang++/g++ 编译运行）
upstream_test_command: "clang++ -std=c++17 -I include -pthread tests/BS_thread_pool_test.cpp -o build/BS_thread_pool_test && build/BS_thread_pool_test"

upstream_tests:
  - file: tests/BS_thread_pool_test.cpp
    source: thread-pool-5.0.0/tests/BS_thread_pool_test.cpp
    description: "BS::thread_pool 上游全量测试程序（submit/parallelize/sequence/wait/pause/priority 等）"
    command: "clang++ -std=c++17 -I include -pthread tests/BS_thread_pool_test.cpp -o build/BS_thread_pool_test && build/BS_thread_pool_test"

test_package_tests:
  - file: test_bs_thread_pool.cpp
    description: "消费者测试: 验证 BS::thread_pool submit_task/get/parallelize_loop/wait 核心 API"
    command: "./test_bs_thread_pool"

assertion_count: 4
