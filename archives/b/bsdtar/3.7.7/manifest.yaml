version: "3.7.7"
software: bsdtar
display: "bsdtar"
description: "bsdtar CLI tool from libarchive 3.7.7 — multi-format archive and compression library"
category: compress
homepage: "https://www.libarchive.org/"
license: BSD-2-Clause
build_system: autotools
status: prepared
build_date: "2026-08-22"

source:
  url: "https://github.com/libarchive/libarchive/releases/download/v3.7.7/libarchive-3.7.7.tar.xz"
  sha256: "879acd83c3399c7caaee73fe5f7418e06087ab2aaf40af3e99b9e29beb29faee"
  tar_format: tar.xz
  original_url: "https://www.libarchive.org/downloads/libarchive-3.7.7.tar.xz"

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--without-xml2"
  dependencies:
    - zlib/1.3.1.1 (conan, cnb 制品仓)
    - xz/5.6.2 (conan, cnb 制品仓)
  cc: clang

patches_applied:
  - "0001-build-autoconf-config.guess.patch"
  - "0002-configure.patch"
  - "0003-test-utils-test-main-mode.patch"

knowledge_gained:
  - "E007: config.guess needs HarmonyOS recognition (aarch64:HarmonyOS case)"
  - "E011: hmfs umask 077 → Permission denied (configure patch 0002)"
  - "E079: HMDFS 不支持硬链接，bsdtar/bsdcpio 硬链接用例为平台限制"
  - "E129: HMDFS 权限位不完整保留（强制 setgid、裁剪 other 位），测试 mode 断言需放宽为 owner 位比较"
  - "E041: automake 版本不匹配触发级联重生成（时间戳规避）"
  - "E005: zlib -fPIC 静态库链接共享库要求"