# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bsdtar/3.7.7
homepage: https://www.libarchive.org/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试套件 (libarchive 自带 C 测试程序)
upstream_tests:
  - name: "libarchive_test"
    source: libarchive-3.7.7/libarchive/test/
    description: "libarchive 核心库单元测试 (archive_read/write 各格式)"
    command: "make check"
  - name: "bsdtar_test"
    source: libarchive-3.7.7/tar/test/
    description: "bsdtar 命令行工具测试"
    command: "make check"
  - name: "bsdcpio_test"
    source: libarchive-3.7.7/cpio/test/
    description: "bsdcpio 命令行工具测试"
    command: "make check"
  - name: "bsdcat_test"
    source: libarchive-3.7.7/cat/test/
    description: "bsdcat 命令行工具测试"
    command: "make check"
  - name: "bsdunzip_test"
    source: libarchive-3.7.7/unzip/test/
    description: "bsdunzip 命令行工具测试"
    command: "make check"

# 真实 make check 结果: 801 运行 / 39 失败 / 226 跳过
# 已知 OHOS 平台限制:
#   - HMDFS 不支持硬链接（E079）→ bsdtar/bsdcpio hardlink 测试失败
#   - hmfs 权限位/umask 差异（E011/E129）→ mode 断言失败
#   - uid/gid 解析失败（E040/E051）→ "Numeric user ID too large"
#   - 加密 backend 未编译 → test_P_encryption 失败
#   - fflags/xattr 平台能力差异 → test_option_fflags/test_option_xattrs exit 1
# 55 个无名 skip 为框架内 skipping() 调用计数，无独立测试名 → insufficient_evidence
upstream_test_results:
  total: 801
  failed: 39
  skipped: 226
  known_ohos_limits:
    - "HMDFS 不支持硬链接 (E079)"
    - "hmfs 权限位/umask 差异 (E011/E129)"
    - "uid/gid 解析失败 (E040/E051)"
    - "符号链接跟踪差异 (E050)"
    - "加密 backend 未编译"
    - "fflags/xattr 平台能力差异 (partial_reuse)"
    - "55 无名 skip insufficient_evidence"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libarchive.c
    description: "bsdtar --version + libarchive 内存 tar 读取往返验证"
    command: "bsdtar --version && ./test_libarchive"

# 测试断言总数 (近似值, 用于质量评估)
# 28 断言来自 test_option_xattrs 单独复现 (1 测试 28 断言)
# 30 断言来自 test_option_fflags 单独复现 (1 测试 30 断言)
# test_package: bsdtar --version (exit 0) + 内存 tar 读取 (exit 0)
assertion_count: 58