package: "baler/1.4.0"
homepage: "https://github.com/baler-collaboration/baler"

upstream_check_command: "pytest --collect-only -q tests (13 cases audited via grep def test_)"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest share/baler/tests -v -o addopts= (re-emitted in test_package; build() writes res/upstream_test_summary.json, test_package re-emits HMBS_UPSTREAM_TEST_RESULT; heavy torch/sklearn deps have no OHOS wheel -> honest skipped with discovered=13)"

upstream_tests:
  - file: "tests/test_data_processing.py"
    source: "baler-1.4.0/tests/test_data_processing.py"
    description: "Data processing utilities (normalize, find_minmax, save_model)"
    command: "pytest tests/test_data_processing.py -v"
  - file: "tests/test_helper.py"
    source: "baler-1.4.0/tests/test_helper.py"
    description: "Workspace/project creation helper"
    command: "pytest tests/test_helper.py -v"
  - file: "tests/test_utils.py"
    source: "baler-1.4.0/tests/test_utils.py"
    description: "Loss functions and LR scheduler"
    command: "pytest tests/test_utils.py -v"

test_package_tests:
  - file: "test_baler.py"
    description: "Import baler and exercise helper.create_new_project API"
    command: "python3 test_baler.py"
  - file: "test_cli.py"
    description: "Exercise baler CLI wrapper (baler --help and newProject)"
    command: "python3 test_cli.py"

assertion_count: 18
test_counting:
  upstream_independent_total: 13
  integration_independent_total: 2
  shared_static_counted_once: true
