# test_package/MANIFEST.yml — biosoup 0.10.0
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求）

package: biosoup/0.10.0
homepage: "https://github.com/rvaser/biosoup"

# 上游测试命令：上游 CMakeLists 提供 biosoup_test 可执行（GoogleTest），
# 经补丁注册 add_test(NAME biosoup_test COMMAND biosoup_test) 后由 ctest 执行
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test()（ctest 驱动 biosoup_test，GoogleTest 输出逐用例统计）"

# 上游实际运行的测试程序（按源文件归类；gtest TEST 定义共 11 个）
upstream_tests:
  - file: test/nucleic_acid_test.cpp
    source: biosoup-0.10.0/test/nucleic_acid_test.cpp
    description: "NucleicAcid 序列容器用例（4 个 TEST：构造/子串/反转互补/质量值）"
    command: "ctest -R biosoup_test"
  - file: test/overlap_test.cpp
    source: biosoup-0.10.0/test/overlap_test.cpp
    description: "Overlap 重叠结构用例（1 个 TEST）"
    command: "ctest -R biosoup_test"
  - file: test/progress_bar_test.cpp
    source: biosoup-0.10.0/test/progress_bar_test.cpp
    description: "ProgressBar 进度条用例（1 个 TEST）"
    command: "ctest -R biosoup_test"
  - file: test/sequence_test.cpp
    source: biosoup-0.10.0/test/sequence_test.cpp
    description: "Sequence 序列用例（1 个 TEST：反转互补语义）"
    command: "ctest -R biosoup_test"
  - file: test/timer_test.cpp
    source: biosoup-0.10.0/test/timer_test.cpp
    description: "Timer 计时器用例（4 个 TEST）"
    command: "ctest -R biosoup_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_biosoup.cpp
    description: "消费者测试：以库使用者身份 include biosoup/sequence.hpp，真实编译链接并断言 Sequence 构造、原子唯一 id、质量值与 ReverseAndComplement 变换（ACGTT→AACGT）"
    command: "./test_biosoup"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 15
