knowledge_gained:
  - "上游 FetchContent 拉取 googletest 在 conan 离线构建不可用：改 test_requires(gtest/1.17.0) + 补丁切 find_package(GTest REQUIRED CONFIG) + generate() 中手动设 GTest_DIR 指向包内 lib/cmake/GTest（abseil/20260526 先例同款）"
  - "conan 2 的 CMakeDeps 不为 tool_requires 生成 CMake config（generators 目录无 GTest 文件实证）——tool_requires + find_package 组合必须用 GTest_DIR 直指包内路径绕过"
  - "gtest 1.17 要求 C++14：上游全局 CXX_STANDARD 11 时仅对测试目标 set_target_properties CXX_STANDARD 14，不动库本体"
  - "上游漏注册 ctest（只有 add_executable）：补 enable_testing()+add_test 后 build() 内 cmake.test() 即可真实执行 11 个 gtest 用例"

