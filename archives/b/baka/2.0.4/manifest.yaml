# 版本级 manifest — baka 2.0.4
# 遵循 ARCHIVE-SPEC v2.0
# 状态: published（本地 conan create 通过 + test_package PASS，待 PR 合并后 CI release）

version: "2.0.4"
software: "baka"
status: published
build_date: "2026-08-29"
build_system: qmake

source:
  url: "https://github.com/u8sand/Baka-MPlayer/archive/refs/tags/v2.0.4.tar.gz"
  sha256: "43647217695bdfc85771ce2fc8fcecebd49bdf6282c3a439816cfb4e08754002"
  tar_format: tar.gz

build:
  system: qmake
  configure_options:
    - "CONFIG+=release"
  dependencies:
    required:
      - "qt5-qtbase/5.15.2.2 (published)"
      - "qt5-qtsvg/5.15.2 (published)"
      - "qt5-qtx11extras/5.15.2 (published)"
      - "libmpv/0.41.0 (published)"
      - "libx11/6.4.0 (published)"
      - "libxcb/1.16 (published)"
      - "zlib/1.3.1.1 (published)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-libmpv-041-events.patch (MPV_EVENT_PAUSE/UNPAUSE/IDLE → observe idle-active/pause 属性)"

knowledge_gained:
  - "baka 2.0.4 = Baka MPlayer 2.0.4（u8sand/Baka-MPlayer），Qt5 + libmpv 多媒体播放器（TEMPLATE=app，非库）"
  - "libmpv/0.41.0 已移除 MPV_EVENT_PAUSE/UNPAUSE/IDLE 旧事件（mpv 0.35 API 2.0 起）；baka 2.0.4（2015）直接使用旧事件且无条件编译保护 → patch 参照上游 master 修复：observe idle-active/pause 属性驱动播放状态 + frame_step → frame-step"
  - "x11.pc / mpv.pc 的 prefix 固定为 /（包内 .pc 未改写 prefix），pkg-config 提供的 -I/include 与 -L/lib 均无效 → include 走 CPATH、链接走 LIBRARY_PATH 显式补充（CPATH 须冒号拼接，conan 空格拼接会整体失效）"
  - "qt5-qtsvg/qtx11extras 模块 .pri 记录的是已删除的构建目录路径 → _setup_qmake_modules() 正则改写 .pri 指向包内 modules-inst，QMAKEMODULES 提供"
  - "baka 为 GUI 应用（QApplication + X11），无显示环境无法启动主程序 → test_package 用静态冒烟（arm64 ELF 断言 + conanrun 环境 ldd 依赖解析断言）"

failure_reason: null
