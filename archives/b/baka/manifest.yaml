# 软件级 manifest — baka
# 遵循 ARCHIVE-SPEC

software: baka
status: published

description: "Baka MPlayer — 基于 libmpv 的 Qt5 多媒体播放器（ohos-aarch64 适配完成）"
category: gfx
homepage: "https://github.com/u8sand/Baka-MPlayer"
license: GPL-2.0
build_system: qmake

ohos_adaptation:
  key_points:
    - "Qt5 GUI 播放器，src/Baka-MPlayer.pro 强制 PKGCONFIG += mpv（libmpv）与 unix 分支 QT += x11extras / PKGCONFIG += x11"
    - "libmpv/0.41.0 移除 MPV_EVENT_PAUSE/UNPAUSE/IDLE → patches/0001-libmpv-041-events.patch（参照上游 master：observe idle-active/pause 属性）"
    - "x11.pc/mpv.pc prefix=/ 失效 → include 走 CPATH（冒号拼接）、链接走 LIBRARY_PATH 显式补充"
    - "qmake 模块发现：_setup_qmake_modules() 改写 qtsvg/qtx11extras 的 modules-inst .pri 指向包内路径，QMAKEMODULES 提供"
    - "GUI 无显示环境测试限制 → test_package 静态冒烟（ELF 架构 + ldd 依赖解析）"
  common_dependencies:
    - "qt5-qtbase (published 5.15.2.2)"
    - "qt5-qtsvg (published 5.15.2)"
    - "qt5-qtx11extras (published 5.15.2)"
    - "libmpv (published 0.41.0)"
    - "libx11 (published 6.4.0)"
    - "libxcb (published 1.16)"
    - "zlib (published 1.3.1.1)"

versions:
  "2.0.4":
    status: published
    note: "ohos-aarch64 conan create 通过，test_package PASS（静态冒烟测试），提交 PR 走 CI release"
