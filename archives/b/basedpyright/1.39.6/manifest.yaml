software: basedpyright
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.39.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.39.6"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (npm registry)
  url: "https://registry.npmjs.org/basedpyright/-/basedpyright-1.39.6.tgz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | npm
  system: npm

  # 配置选项列表
  configure_options:
    - "npm install -g basedpyright@1.39.6"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - nodejs/24.13.0  # 系统已预装

  # 编译器（npm 包不需要）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# npm 包无需补丁

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "basedpyright 是 Node.js 包，使用 npm install -g 安装"
  - "依赖 nodejs-wheel-binaries 通过 pip 安装会失败（需要编译 nodejs）"
  - "使用系统预装的 nodejs 更方便，无需编译 nodejs-wheel-binaries"
  - "pip 安装失败时，改用 npm 安装是替代方案"