software: basedpyright
# 软件级 manifest 模板
# 文件位置: archives/b/basedpyright/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件基本信息
# ============================================================

name: basedpyright
description: "基于 pyright 的 Python 类型检查器"
category: development-tools  # 开发工具/类型检查器
license: MIT

homepage: https://github.com/DetachHead/basedpyright
repository: https://github.com/DetachHead/basedpyright

# ============================================================
# 版本索引
# ============================================================

versions:
  1.39.6:
    status: published
    build_date: "2026-06-05"
    notes: "npm 安装成功，使用系统预装 nodejs"

# ============================================================
# 软件特性
# ============================================================

build_type: npm  # 特殊构建类型：Node.js 包
dependencies:
  required:
    - nodejs >= 18.0.0
  optional: []

special_notes:
  - "basedpyright 是 Node.js 包，不适合传统 C/C++ 编译流程"
  - "推荐使用 npm install -g 安装"
  - "pip 安装可能因 nodejs-wheel-binaries 编译失败"
