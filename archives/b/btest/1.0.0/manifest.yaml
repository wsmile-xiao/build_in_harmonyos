software: btest
# 版本级 manifest 模板
# 文件位置: archives/b/btest/1.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-23"
build_system: shell

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub 官方 release，CI mirror fallback 覆盖 github.com）
  url: "https://github.com/zeek/btest/archive/refs/tags/v1.0.tar.gz"

  # 源码校验和
  sha256: "ff40f49decdd5580ab588777e48a194f3abe736452d88fc5268342d3cd63cca9"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: shell

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "btest 是纯 python 脚本包（zeek 项目的系统测试框架），无编译"
  - "上游版本号为 1.0（VERSION 文件），conan 版本号用 1.0.0（三段式）"
  - "安装布局：bin/btest + 8 个 btest-* 辅助脚本 + 4 个 btest-sphinx-* 脚本"
  - "运行时依赖 python >=3.7；sphinx 脚本需要 sphinx 环境"
