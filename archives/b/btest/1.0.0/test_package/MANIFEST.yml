# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: btest/1.0.0
homepage: "https://github.com/zeek/btest"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# btest 上游有 `make test` 目标（cd testing && make）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testing/Makefile
    description: "btest 自测试套件（用 btest 驱动 testing/btest.cfg）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_btest.sh
    description: "python -c py_compile 语法校验 + 验证 12 个脚本存在 + COPYING 许可证校验"
    command: "python3 test_btest.sh <package_root>"

# 测试断言总数 (近似值, 用于质量评估)
# 6 项断言: launcher 存在、py_compile launcher、12 个脚本存在、
#           py_compile 全脚本、COPYING 存在、shell test 通过
assertion_count: 6
