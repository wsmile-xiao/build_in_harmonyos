software: bootterm

# ============================================================
# 必须字段
# ============================================================

version: "0.5"
status: built
build_system: makefile
build_date: "2026-09-05"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/wtarreau/bootterm/archive/refs/tags/v0.5.tar.gz"
  sha256: "95cc154236655082fb60e8cdae15823e4624e108b8aead59498ac8f2263295ad"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "USR_CFLAGS=-DNO_TCGETS2"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "bootterm 源码为单文件 src/bt.c（约 2500 行），纯 Makefile 构建，无 configure，产物为单一二进制 bt，零外部库依赖"
  - "Makefile 内部固定赋值 CC := $(CROSS_COMPILE)cc、CFLAGS := ...，忽略环境变量，必须在 make 命令行传 CC=；追加编译参数走其预留的 USR_CFLAGS 变量"
  - "OHOS 工具链同时定义 __OHOS__ 与 __linux__：默认走 <asm/termbits.h> 分支，丢失 <termios.h> API 声明（11 个隐式声明警告），且 OHOS kernel-uapi 头无 TCGETS2（自定义波特率本就未启用）"
  - "上游自带 NO_TCGETS2 编译开关：make USR_CFLAGS=-DNO_TCGETS2 切到 musl <termios.h>，行为等价、零警告，无需改源码打补丁"
  - "上游 install 目标会调 strip 与系统 install 工具，采用手动复制 bin/bt 打包，ELF 签名交由 CI 后处理"
  - "上游无测试套件（无 tests/ 目录、无 make check 目标），test_package 提供 4 项消费者行为验证（-V/-h/-l 与二进制存在性）"
  - "源码内 VERSION 默认 0.5.0，包版本为上游 tag 0.5，-V 输出 BootTerm 0.5.0"
