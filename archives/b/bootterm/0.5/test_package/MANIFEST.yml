# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bootterm/0.5
homepage: "https://github.com/wtarreau/bootterm"

# 上游测试命令 (bootterm 无自带测试套件：无 tests/ 目录、无 make check 目标)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (bootterm 无上游测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_bootterm.py
    description: "bt 二进制功能验证：binary 存在性、-V 版本横幅与许可证、-h 完整用法、-l 串口列表空表退出码 0"
    command: "python3 test_bootterm.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
