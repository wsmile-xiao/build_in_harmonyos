# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: backupninja/1.2.2
homepage: "https://0xacab.org/riseup/backupninja"

# Upstream test command（如实申报：上游无测试套件）
upstream_check_command: "make check"

# Upstream test suite（规则 4 如实申报）：
# 上游 backupninja 1.2.2 无测试套件——tarball 无 tests/ 目录、Makefile.am
# 无测试目标（TESTS/check_PROGRAMS）、全源码树无 test/check 相关文件
# （已逐项核实）——N=0，如实申报。
upstream_tests_total: 0
upstream_tests_passed: 0
upstream_tests_skipped_reason: "上游 backupninja 1.2.2 无测试套件（tarball 无 tests/、Makefile.am 无测试目标，已核实）"
# 运行时限制如实申报：backupninja 完整运行需 lib 库目录（tools/setfile）+
# 完整配置条目——OHOS 沙箱不可复现（-V 输出版本 rc=2 环境限制）；编译/安装正常

# Upstream tests not run in build (none exist upstream; consumer-side test
# covers real execution of backupninja)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_backupninja.sh
    description: "Run backupninja -h to verify tool executes (help output)"

# Test assertion count
assertion_count: 1
