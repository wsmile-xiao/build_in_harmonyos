version: "0.6.3"
status: built
build_date: "2026-08-21"

source:
  url: "https://github.com/vgropp/bwm-ng/archive/refs/tags/v0.6.3.tar.gz"
  tar_format: tar.gz
  sha256: "c1a552b6ff48ea3e4e10110a7c188861abc4750befc67c6caaba8eb3ecf67f46"

build:
  system: autotools
  configure_options:
    - "--without-curses"
    - "--without-ncurses"
    - "--with-proc-netdev"
  extra_ldflags:
    - "-static"
  tool_requires:
    - automake/1.18
    - libtool/2.5.4
  cc: clang

patches_applied: []

knowledge_gained:
  - "bwm-ng ships no upstream test suite — no tests/ dir and no TESTS= in Makefile.am, automake generates default no-op `check` target"
  - "Disable curses/ncurses (--without-curses / --without-ncurses) on OHOS to avoid ncurses dev dep; bwm-ng still produces text/csv/plain output"
  - "Use --with-proc-netdev input method; OHOS exposes /proc/net/dev"
  - "Static link via -static (R26) so packaged bwm-ng has no runtime dynamic deps"
  - "E007/R15: after autoreconf, patch config.guess/config.sub for HarmonyOS; do not pass --build/--host"
  - "E114: relax umask 077 to 022 in generated configure so config.status temp dirs are writable on HMDFS"
  - "E178: tool_requires automake/1.18 + libtool/2.5.4 instead of hardcoded host automake paths"