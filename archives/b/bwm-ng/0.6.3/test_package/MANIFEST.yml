# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 注意：bwm-ng 上游未提供任何测试用例
#   - 源码包无 tests/ 目录
#   - Makefile.am / src/Makefile.am 内无 TESTS 变量
#   - automake 自动生成的 make check 是 no-op
# 因此本文件 upstream_tests 为空；test_package_tests 列出本适配补全的消费者测试。

package: bwm-ng/0.6.3
homepage: "https://www.gropp.org/?id=projects&sub=bwm-ng"

# 上游测试命令 (无上游测试)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 已集成：autotools.make(target="check") 调用，
# 但因上游无 TESTS=，automake 的默认 check 是 no-op。
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游官方测试用例 — 无
upstream_tests: []

# test_package 中自带的测试（适配补全）
test_package_tests:
  - file: test.sh
    description: "bwm-ng --version 烟雾测试，确认可执行并输出 bwm-ng 字样"
    command: "bwm-ng --version"
  - file: test.sh
    description: "bwm-ng --help 烟雾测试，确认帮助信息含 usage/options"
    command: "bwm-ng --help"
  - file: test.sh
    description: "bwm-ng -o plain 输出模式（1 个采样窗口）"
    command: "bwm-ng -o plain -d 1 -c 1"
  - file: test.sh
    description: "bwm-ng -o csv 输出模式（1 个采样窗口）"
    command: "bwm-ng -o csv -d 1 -c 1"
  - file: test.sh
    description: "readelf 校验产物 ELF 类型（EXEC/DYN）"
    command: "readelf -h bwm-ng"
  - file: test.sh
    description: "校验产物为静态链接（R26：不应有 NEEDED 项）"
    command: "readelf -d bwm-ng"

# 测试断言总数 (适配补全的 6 个断言；上游 0 个)
assertion_count: 6