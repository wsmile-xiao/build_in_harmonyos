# test_package/MANIFEST.yml — bruteforce-salted-openssl 1.5.0
# CI L0e requires this file to exist (upstream test declaration).

package: bruteforce-salted-openssl/1.5.0
homepage: "https://github.com/glv2/bruteforce-salted-openssl"

# Upstream runs the 4 crack tests via autotools `make check` (tests/crack-encrypted{1..4}.sh)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# Binary fixtures (encrypted{1..4}.dat) ship as base64 text (*.dat.b64) because
# the CI applies the PR as a text diff patch (binary files cannot be carried);
# test.sh decodes them back to the exact upstream bytes before running.
fixture_encoding: base64 (encryptedN.dat.b64 -> encryptedN.dat at test time)

# Upstream tests (verbatim port, only binary path adapted to conanrun PATH)
upstream_tests:
  - file: crack-encrypted1.sh
    source: bruteforce-salted-openssl-1.5.0/tests
    description: "Brute-force AES-256-CBC/MD5, expect password 'Alexia'"
    command: "bash crack-encrypted1.sh"
  - file: crack-encrypted2.sh
    source: bruteforce-salted-openssl-1.5.0/tests
    description: "Brute-force AES-256-CBC/SHA256 with dict.txt, expect 'Martin'"
    command: "bash crack-encrypted2.sh"
  - file: crack-encrypted3.sh
    source: bruteforce-salted-openssl-1.5.0/tests
    description: "Brute-force DES3/SHA256, expect 'Sara'"
    command: "bash crack-encrypted3.sh"
  - file: crack-encrypted4.sh
    source: bruteforce-salted-openssl-1.5.0/tests
    description: "Brute-force AES-256-CBC PBKDF2/SHA256 iter=100, expect 'Bob'"
    command: "bash crack-encrypted4.sh"

test_package_tests:
  - file: test.sh
    description: "Runs the 4 upstream crack tests against the packaged binary"
    command: "bash test.sh"

assertion_count: 4
