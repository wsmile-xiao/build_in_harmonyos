# test_package/MANIFEST.yml — BusyBox static 1.36.1
# CI L0e 门禁要求

package: busybox-static/1.36.1
homepage: "https://busybox.net/"

# Upstream BusyBox 1.36.1 ships a testsuite: testsuite/ holds 65 `*.tests`
# files driven by testsuite/runtest on top of testsuite/testing.sh.
# It is not run in the Conan build because it requires a booted Linux with
# root privileges, a working /bin/sh and applets disabled on OHOS.
upstream_test_in_build: false
upstream_test_source: "testsuite/ (65 *.tests files, driven by testsuite/runtest + testing.sh)"
upstream_test_cases: 65
upstream_test_command: "make check (requires root + full Linux userland; not portable to OHOS)"
upstream_test_not_run_reason: "needs root privileges, mknod/mount/mdev and a /bin/sh shebang interpreter; OHOS is a non-root musl environment with ELF signature enforcement and this recipe disables ip/tc/mdev/su/ifplugd/uevent applets"

# test_package smoke tests (consumer-side verification)
test_package_tests:
  - file: "test.sh"
    description: "6 assertions: artifact exists, static linking (readelf NEEDED), binary integrity, busybox --help, --list (applet count), runtime applets (echo/true/wc -l)"
    command: "bash test.sh"

assertion_count: 6

# The last stdout line of test.sh is a machine readable roll-up:
#   SUMMARY: executed=<n> passed=<n> failed=<n> skipped=<n>
# Assertions 4-6 need a signed (executable) ELF and are reported as SKIP,
# never as PASS, when the binary cannot run on the host.
result_summary_line: "SUMMARY: executed=<n> passed=<n> failed=<n> skipped=<n>"
