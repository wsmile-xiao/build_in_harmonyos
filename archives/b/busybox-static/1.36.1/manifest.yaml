# 版本级 manifest — BusyBox static 1.36.1
# 遵循 ARCHIVE-SPEC v2.0

version: "1.36.1"
software: "busybox-static"
status: built
build_date: "2026-08-28"
build_system: makefile

source:
  url: "https://busybox.net/downloads/busybox-1.36.1.tar.bz2"
  sha256: "b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314"
  tar_format: tar.bz2

build:
  system: makefile
  configure_options:
    - "make defconfig (generates .config from BusyBox defconfig)"
    - "CONFIG_STATIC=y (fully statically linked binary)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - file: "0001-ohos-compat-missing-libc-functions.patch"
    purpose: "Provide gethostid/strverscmp/sigisemptyset for OHOS musl compatibility"

recipe_fixes:
  - "OHOS /bin/sh shebang 执行修复：批量替换源码树中所有 #!/bin/sh 为 bash 路径"
  - "Makefile/Kbuild 脚本调用前缀 $(SHELL) 修复"
  - "CONFIG_STATIC=y sed 匹配修复（处理 # not set 格式）"
  - "AR/RANLIB 使用编译器完整路径"
  - "禁用 CONFIG_FEATURE_SH_EMBEDDED_SCRIPTS（无嵌入脚本）"

knowledge_gained:
  - "Static build produces self-contained 1.3MB binary with no NEEDED entries"
  - "CONFIG_STATIC=y enables -static in LDFLAGS automatically via BusyBox kbuild"
  - "OHOS /bin/sh cannot be used as shebang interpreter (ELF signing policy)"
  - "BusyBox kbuild invokes many scripts directly — need $(SHELL) prefix + shebang fix"
