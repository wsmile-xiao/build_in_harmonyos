software: bibtexconv
display: "BibTeXConv"
description: "BibTeX 格式转换工具，支持 BibTeX 到 ODT/HTML 等格式转换"
category: doc
homepage: "https://github.com/dreibh/bibtexconv"
license: GPL-3.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 需要设置 PKG_CONFIG_PATH 和 OPENSSL_ROOT_DIR"
    - "依赖 curl 和 openssl，需要预编译包或手动编译"
    - "CMake 平台识别显示 'System is unknown to cmake'，但不影响功能"
  common_dependencies:
    - curl/8.19.0
    - openssl/1.1.1w

versions:
  "2.2.2":
    status: published
    build_date: "2026-06-11"
    published_as: bibtexconv
    source_url: "https://github.com/dreibh/bibtexconv/archive/refs/tags/bibtexconv-2.2.2.tar.gz"