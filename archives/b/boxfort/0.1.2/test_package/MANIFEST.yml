# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: boxfort/0.1.2
homepage: https://github.com/Snaipe/BoxFort

# 上游测试命令 (meson test --list 枚举出的测试)
upstream_check_command: "meson test -C build --list"

# conanfile.py build() 中已集成上游测试 (samples + tests 选项开启, meson test)
upstream_test_in_build: true
upstream_test_command: "meson test -C build"

# 上游实际运行的测试 (meson test --list; 原生构建与包内构建同一套)
upstream_tests:
  - file: sample/nested.c
    source: BoxFort-0.1.2/sample/nested.c
    description: "嵌套沙箱: worker 内再起 worker, 期望输出两行 worker 标记"
    command: "meson test nested.c"
  - file: sample/callback.c
    source: BoxFort-0.1.2/sample/callback.c
    description: "回调 API: 子进程退出码 5 通过回调传回父进程"
    command: "meson test callback.c"
  - file: sample/context.c
    source: BoxFort-0.1.2/sample/context.c
    description: "bxf_context: arena 对象与静态变量跨沙箱继承"
    command: "meson test context.c"
  - file: sample/timeout.c
    source: BoxFort-0.1.2/sample/timeout.c
    description: "运行时配额: 死循环 worker 在配额到期后被杀"
    command: "meson test timeout.c"
  - file: test/cram/core.t
    source: BoxFort-0.1.2/test/cram/core.t
    description: "cram 功能测试 (3 组命令): 需要 cram/cram3 程序, 环境未安装 (command -v 探测为空), 上游 required:false 使该测试不注册; 已用 sh 手工执行全部 3 组命令, 输出与期望逐行一致 (NOT_RUN 的替代验证)"
    command: "cram --shell=sh test/cram"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_boxfort.c
    description: "真实 API 消费者: 嵌套沙箱 / 回调退出码传递 / 运行时配额击杀 / context 对象跨沙箱往返, 12 项 CHECK 断言"
    command: "ctest 或直接运行 test_package 可执行文件"

# 测试断言总数 (test_package 消费者的 CHECK 断言数)
assertion_count: 12
