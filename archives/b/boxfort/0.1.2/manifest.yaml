knowledge_gained:
  - "代码页完整性策略 (如 OHOS XPM) 禁止一切自改代码路径: mprotect R|W|X 报 EINVAL, mprotect R|W 于代码页被内核 SIGSEGV 击杀, /proc/self/mem 写入 EPERM, MAP_FIXED 覆盖可执行映射被击杀; 依赖重执行+改写 main 跳板的库应以一次性 fork 子进程运行时探测代码页可写性, 不可写时回退为 fork 子进程直接调用沙箱函数 (探测回退无平台宏, 上游平台行为不变; 证据: 设备探测 + samples 4/4 PASS)。 knowledge_ref: knowledge/drafts/DRAFT-boxfort-ohos-code-page-integrity.kv"
  - "用户态 VA 上限 39 位 (512 GiB, 如 OHOS): shm fd 的 MAP_FIXED 在 0x4000000000 可用、0x8000000000 起 EINVAL, 高地址预留窗口 (如 boxfort 的 [32 TiB, 125 TiB)) 应以运行时 MAP_FIXED 探测默认基址, EINVAL 时整体回退到低位窗口 (上游平台行为不变) (证据: t_arena4 探测输出 + 探测回退后 samples 4/4 PASS)。 knowledge_ref: knowledge/drafts/DRAFT-boxfort-ohos-39bit-user-va-map-fixed-limit.kv"

