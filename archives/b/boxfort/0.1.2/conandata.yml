sources:
  "0.1.2":
    url: "https://github.com/Snaipe/BoxFort/archive/refs/tags/v0.1.2.tar.gz"
    sha256: "7651a02c4ed159bb1631c34b4dd2a3df60253cd1956490a434a7ef22f20cd7c8"
patches:
  "0.1.2":
    - patch_file: "patches/0001-src-arena.c.patch"
      patch_description: "Runtime probe: when MAP_FIXED at the default arena base fails with EINVAL (user VA capped near 512 GiB, e.g. OpenHarmony), fall back to a [4 GiB, ~259 GiB) window; upstream platforms keep the [32 TiB, 125 TiB) window"
      patch_type: "portability"
    - patch_file: "patches/0002-src-context.c.patch"
      patch_description: "Direct-sandbox support: add bxfi_context_adopt so a forked sandbox adopts the inherited context as bxf_context_current()"
      patch_type: "portability"
    - patch_file: "patches/0003-src-sandbox-posix.c.patch"
      patch_description: "Runtime probe: when writing to executable code pages is fatal or rejected (code-page integrity, e.g. OpenHarmony XPM), run the sandbox function directly in the forked child instead of the self-exec + main-text-patchup handshake"
      patch_type: "portability"
    - patch_file: "patches/0004-src-context.h.patch"
      patch_description: "Declare bxfi_context_adopt for the direct-sandbox path"
      patch_type: "portability"
