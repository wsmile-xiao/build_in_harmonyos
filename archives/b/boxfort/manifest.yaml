software: boxfort
display: "BoxFort"
description: "跨平台进程沙箱 C 库 (Criterion 的底层隔离组件)"
category: library
homepage: "https://github.com/Snaipe/BoxFort"
license: MIT

build_system: meson

ohos_adaptation:
  key_points:
    - "OHOS 代码页保护 (XPM) 禁止自改代码: 沙箱 worker 由重执行+main 跳板改写改为 fork 子进程直接调用沙箱函数"
    - "OHOS 用户态 VA 上限 39 位: arena 预留窗口从 [32 TiB, 125 TiB) 下移到 [4 GiB, ~259 GiB)"
    - "上游仅构建静态库 (meson 硬编码 static_library), 配方不提供 shared 选项"
  common_dependencies: []

versions:
  "0.1.2":
    status: built
    build_date: "2026-09-05"
