# test_package/MANIFEST.yml — 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: blepvco/0.1.0
homepage: "https://www.smbolton.com/linux.html"

# 上游测试命令：blepvco 上游无测试套件。tarball 共 14 个文件（顶层 11 个 + extras/ 内 3 个，其中源码/构建 9、文档/许可 3、示例 2；无 test/ 目录、无任何测试文件），
# Makefile 目标仅 blepvco.so/install/archive/clean（无 test/check）；
# extras/minblep.c 虽含 main()，但它是生成 minblep_tables.c 的开发用表生成器
# （无断言、不入构建），不构成测试入口。
upstream_check_command: "make"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_ladspa_host.c
    description: "dlopen 宿主：加载 blepvco.so，遍历 ladspa_descriptor 期望 3 个描述符（Sync-Saw/Rect/Tri-VCO），逐个 instantiate/activate/run(64帧)/deactivate/cleanup，无崩溃且 exit 0 才 PASS"
    command: "conan test（test_package/conanfile.py 编译并运行宿主）"
  - file: conanfile.py
    description: "验证 lib/ladspa/blepvco.so 存在于包内（1 个断言），缺失时抛异常使测试失败"
    command: "conan test"

# 测试断言总数：上游无独立测试用例（0），test_package 7 个断言
# （so 存在、dlopen 成功、ladspa_descriptor 符号存在、3 个插件各 1 项
# instantiate/run、描述符总数==3）
assertion_count: 7
