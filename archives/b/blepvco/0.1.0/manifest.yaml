version: "0.1.0"
status: built
build_date: "2026-09-05"
conan_ref: "blepvco/0.1.0"

source:
  url: "https://www.smbolton.com/linux/blepvco-0.1.0.tar.gz"
  sha256: "b4db27128f5d622a611136f7595202b479d0c9210bdb735be84a42af37c1ef5f"
  tar_format: tar.gz

build:
  system: make
  configure_options:
    - "make -j1 CC=clang CXX=clang++（编译器经 conan profile conf 注入）"
  dependencies:
    - "ladspa-sdk/1.17"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-make-cxx-overridable.patch"

knowledge_gained:
  - "上游 Makefile 仅两条规则：内建规则编译（吃 $(CC)/$(CXX) 与 CPPFLAGS）+ 硬编码 g++ 的 -shared 链接；一行补丁改为 $(CXX) 即可完全工具链化"
  - "Conan 2.29 self.run(env=conanbuild) 对缺失 env 脚本静默跳过——必须显式 VirtualBuildEnv().generate() 才能让 profile [buildenv] 生效"
  - "LADSPA 插件测试无需完整宿主：dlopen + ladspa_descriptor 遍历 + 全端口连接后 run 即可冒烟（audio input 端口也必须 connect_port，否则 run 段错误）"
