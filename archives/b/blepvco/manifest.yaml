software: blepvco
display: "blepVCO"
description: "LADSPA antialiased hard-sync oscillator plugins (Sync-Saw/Rect/Tri VCO) with minBLEP band-limited step waveshapes"
category: audio
homepage: "https://www.smbolton.com/linux.html"
license: GPL-2.0-or-later
build_system: make

ohos_adaptation:
  key_points:
    - "LADSPA 插件集（3 个 minBLEP hard-sync 振荡器），由宿主 dlopen 加载，无 GUI、无平台 API 依赖"
    - "上游 Makefile 链接规则硬编码 g++，补丁改为可覆盖的 $(CXX)；编译器经 conan profile conf 注入"
    - "依赖闭包仅 ladspa.h（ladspa-sdk/1.17，已发布制品仓）"
    - "上游无测试套件；test_package 以 dlopen 宿主遍历 3 个描述符做冒烟验证"
  common_dependencies:
    - "ladspa-sdk/1.17"

versions:
  "0.1.0":
    status: built
    build_date: "2026-09-05"
    conan_ref: "blepvco/0.1.0"
