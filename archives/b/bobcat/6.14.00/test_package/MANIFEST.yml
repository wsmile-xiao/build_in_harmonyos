# bobcat/6.14.00 测试声明
package: bobcat/6.14.00
homepage: "https://fbb-git.gitlab.io/bobcat/"

# ── 上游测试 ──────────────────────────────────────────────
# 上游（bobcat 6.14.00 源码树）没有自动化测试套件：
#   - 无 make check / ctest / meson test 目标（上游构建由 icmake 脚本 ./build 驱动，
#     其用法仅 light/libraries/select/install/man 等，见源码 build 脚本 usage 文本）
#   - 源码树无测试框架文件；ohc-run.py prescan 报告 has_tests: false
#     （pre-scan-report.yaml，2026-09-05）
#   - 唯一 test/ 目录 mapbase/test 为手动交互式演示程序（无断言、无运行器），
#     101 个 */driver/ 目录为每类演示程序（demo，非测试）
# 上游测试统计口径：以源码树测试框架/测试运行器计数；TOTAL = 0

upstream_check_command: ""           # 上游无 check 目标
upstream_test_in_build: false
upstream_test_command: ""            # 上游无

upstream_tests: []                   # 上游无自动化测试用例

upstream_tests_total: 0
upstream_tests_passed: 0
upstream_tests_failed: 0
upstream_tests_skipped: 0
upstream_tests_not_run: 0
upstream_tests_note: >
  上游无自动化测试套件（TOTAL = PASS + FAIL + SKIP + NOT_RUN = 0）。
  非跳过：源码树不存在测试运行器与测试用例，属"上游默认不提供"。
  替代验证：conan 配方复刻上游 light 构建全部 128 类（构建即全量编译验证），
  加下方消费者行为测试与设备端原生构建（icmake ./build light）+ 消费者程序验证。

# ── 适配后（本包消费者）测试 ───────────────────────────────
# 统计单位：断言（test_bobcat.cpp 中 CHECK 宏调用，每次一个行为断言）。
# 计数来源：源码静态计数 = 运行输出 "consumer OK: N checks passed"（N 与之一致）。

test_package_tests:
  - file: test_bobcat.cpp
    description: >
      真实消费者：链接 libbobcat，调用 Exception（流式构造与 what() 传播）、
      DateTime（epoch 字段提取与流插入）、Pattern（正则匹配与捕获组）、
      String::split、Glob、Process（真实 fork/exec 子进程 stdout 捕获与
      退出状态），共 11 个行为断言
    command: "./test_bobcat"

test_package_assertion_count: 11
test_package_note: >
  断言数 = test_bobcat.cpp 中 CHECK 宏调用次数（11）。运行成功输出
  "consumer OK: 11 checks passed"，与静态计数一致；任何断言失败
  程序以非零退出码结束并打印 FAIL 行。

# ── 鸿蒙特有测试 ──────────────────────────────────────────
# 无新增鸿蒙特有测试文件；上述消费者在 OHOS 真机环境运行，其 Process
# 用例（fork/exec + 管道）即为 OHOS 平台进程能力的平台性验证。
