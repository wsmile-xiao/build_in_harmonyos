version: "6.14.00"
status: built
build_date: "2026-09-05"
conan_ref: "bobcat/6.14.00"

source:
  url: "https://deb.debian.org/debian/pool/main/b/bobcat/bobcat_6.14.00.orig.tar.gz"
  sha256: "92ac3879e92ec941c67c0505976349d4ba8c239a71a797257ad795afa514f5d2"
  tar_format: tar.gz

build:
  system: custom            # 上游 icmake；conanfile 复刻 light 模式语义
  configure_options: []     # 上游无 configure
  dependencies: []          # light 模式零第三方依赖
  cc: clang
  cxx: clang++
  cppstd: "20"              # 上游需要 C++20（std::unsigned_integral 等）
  mode: light               # 上游 ./build light：CLASSES 128 类，排除 SSL/Readline/X11/Milter 类

patches_applied:
  - "0001-use-posix-strerror_r-on-ohos.patch"
  - "0002-add-missing-typename-in-clock-headers.patch"
  - "0003-replace-clock-cast-with-from-sys.patch"
  - "0004-fix-filesystem-chrono-and-file_status-for-libc.patch"
  - "0005-fix-const-hdr-iterator-category-to-bidirectional.patch"
  - "0006-include-sys-types-h-in-headers-using-mode-t.patch"
  - "0007-include-unistd-h-in-proc-ih.patch"
  - "0008-qualify-posix-bind-with-scope-resolution.patch"

knowledge_gained:
  - "bobcat 6.14.00 需要 C++20（std::unsigned_integral、P0634 松弛 typename）；Debian 打包用 c++26 属激进默认，c++20 即可"  # knowledge_ref: knowledge/drafts/E2175-draft-623C.md
  - "OHOS libc++（LLVM 15 基线）无 C++23 std::chrono::clock_cast；file_clock 提供 C++20 规定的 from_sys/to_sys，可作 sys 链时钟转换的等价替换"  # knowledge_ref: knowledge/drafts/E2175-draft-623C.md
  - "OHOS libc++ 时长类型与 libstdc++ 不同：system_clock::duration 为微秒、file_clock rep 为 __int128 纳秒，跨时钟转换处需显式 time_point_cast"  # knowledge_ref: knowledge/drafts/E2175-draft-623C.md
  - "gcc 宽松、clang 严格的典型差异：依赖类型名缺 typename（类外成员定义/别名场景）、裸 mode_t/STDxx_FILENO 依赖传递包含、using namespace std 后裸 bind 被 std::bind 抢占"  # knowledge_ref: knowledge/drafts/E2175-draft-623C.md
  - "CI worker 上 SDK lld 依赖 libxml2.so.16 而 loader 路径未覆盖 SDK llvm/lib：子进程注入 LD_LIBRARY_PATH=<realpath(cxx)>/../lib 修复（编译器路径是符号链接，必须 realpath）"  # knowledge_ref: knowledge/drafts/E2175-draft-623C.md
  - "bobcat 上游无自动化测试套件（prescan has_tests=false；仅 101 个 driver 演示与 1 个交互式 mapbase/test），适配验证以真实消费者 API 断言替代"  # reference: docs/TEST_QUALITY_SPEC.md
