sources:
  "6.14.00":
    url: "https://deb.debian.org/debian/pool/main/b/bobcat/bobcat_6.14.00.orig.tar.gz"
    sha256: "92ac3879e92ec941c67c0505976349d4ba8c239a71a797257ad795afa514f5d2"

patches:
  "6.14.00":
    - patch_file: "patches/0001-use-posix-strerror_r-on-ohos.patch"
      patch_description: "OHOS musl 的 strerror_r 为 POSIX 语义（返回 int），上游按 glibc GNU 语义使用导致编译错误，改为 POSIX 等价写法"
      patch_type: "portability"
    - patch_file: "patches/0002-add-missing-typename-in-clock-headers.patch"
      patch_description: "clockbase/highsysclock 依赖类型名缺 typename（gcc 宽松、clang 严格报错），补齐显式 typename"
      patch_type: "portability"
    - patch_file: "patches/0003-replace-clock-cast-with-from-sys.patch"
      patch_description: "OHOS libc++ 未实现 C++23 std::chrono::clock_cast，改为 C++20 规定的 file_clock::from_sys 等价转换"
      patch_type: "portability"
    - patch_file: "patches/0004-fix-filesystem-chrono-and-file_status-for-libc.patch"
      patch_description: "OHOS libc++ 的 system_clock::duration 为微秒、file_clock rep 为 __int128 纳秒，to_sys 结果需显式 time_point_cast；file_status 比较改为 type() 比较"
      patch_type: "portability"
    - patch_file: "patches/0005-fix-const-hdr-iterator-category-to-bidirectional.patch"
      patch_description: "MailHeaders::const_hdr_iterator 实现了 operator--（双向）但 category 声明为 input_iterator_tag，libc++ 的 reverse_iterator 静态断言拒绝，改为 bidirectional_iterator_tag"
      patch_type: "bugfix"
    - patch_file: "patches/0006-include-sys-types-h-in-headers-using-mode-t.patch"
      patch_description: "七个公共头裸用 mode_t 但未包含 sys/types.h（依赖 glibc 环境传递包含），补显式包含"
      patch_type: "portability"
    - patch_file: "patches/0007-include-unistd-h-in-proc-ih.patch"
      patch_description: "proc.ih 裸用 STDIN_FILENO 等 POSIX 宏但未包含 unistd.h，补显式包含"
      patch_type: "portability"
    - patch_file: "patches/0008-qualify-posix-bind-with-scope-resolution.patch"
      patch_description: "内部头 using namespace std 后裸调用 bind，libc++ 下 std::bind 模板精确匹配抢占 POSIX bind，改为全局限定 ::bind"
      patch_type: "portability"
