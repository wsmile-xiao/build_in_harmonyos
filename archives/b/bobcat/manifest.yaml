# 软件级 manifest — bobcat
# 遵循 ARCHIVE-SPEC v3.0

software: bobcat
display: "Bobcat"
description: "Brokken's Own Base Classes And Templates：C++17/20 通用类库，覆盖子进程/管道/重定向、命令行解析、配置文件、流与套接字、共享内存、信号与线程工具、消息摘要等"
category: library
homepage: "https://fbb-git.gitlab.io/bobcat/"
license: GPL-3.0-or-later

# 上游实际构建系统为 icmake（作者自有构建工具），CI 通过 conanfile 复刻其语义
build_system: custom

ohos_adaptation:
  key_points:
    - "上游需要 icmake >= 12.01.00 构建工具，设备与 CI 均无此工具；conanfile 以 Python 复刻上游 `./build light` 的编译/链接语义"
    - "light 模式（CLASSES 128 类）零第三方依赖；SSL/Readline/X11/Milter 类由上游 light 模式排除（openssl/readline 暂无 OHOS binary）"
    - "上游需要 C++20（std::unsigned_integral 等概念），编译标准取 --std=c++20"
    - "OHOS libc++ 缺 C++23 clock_cast，已补丁改为 file_clock::from_sys 等价转换"
    - "musl/libc++ 严格性差异补丁：typename 补齐、POSIX strerror_r、裸 mode_t/STDxx_FILENO 头补齐、裸 bind 全局限定"
  common_dependencies: []

versions:
  "6.14.00":
    status: built
    build_date: "2026-09-05"
