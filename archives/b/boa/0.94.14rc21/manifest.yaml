# boa 0.94.14rc21 适配清单
# boa 是经典嵌入式 Web 服务器（单进程 HTTP daemon，C 语言，autoconf 2.59
# 构建）。上游 boa.org 官方站点已下线——源码取自 Debian snapshot 官方归档的
# boa_0.94.14rc21.orig.tar.gz（boa.org 官方 tarball 的 Debian 归档镜像，
# sha256 固定校验一致）。
# 依赖仅 libc（dmalloc/efence 为 configure 可选检测，OHOS 无则跳过）——无
# Conan 前置依赖。

version: "0.94.14rc21"
status: built

source:
  url: "https://snapshot.debian.org/archive/debian/20111208T031230Z/pool/main/b/boa/boa_0.94.14rc21.orig.tar.gz"
  tar_format: tar.gz
  sha256: "02c51bf25f29d56e641b662f0767759654c28d88ec31f55c5a73d57edfe13cf6"

build:
  system: autotools
  configure_options: []
  cc: clang
  notes: "autoconf 2.59 configure + make；构建产物 src/boa（主服务）+ src/boa_indexer（目录索引生成器）；sendfile 可选检测（OHOS 无则自动关闭）；无 Conan 前置依赖"

patches_applied: []

test:
  upstream_cases: 0
  upstream_suite: "上游无测试套件（tarball 无 test/tests 目录——examples/ 下 cgi-test.cgi/nph-test.cgi 为 CGI 示例脚本非测试——如实记录 0/0）"
  runnable: 0
  runnable_note: "上游无测试套件可运行（0/0 如实记录——静态库存=0 无已执行）"
  pass_rate: "0/0（上游无测试套件）"
  consumer_test: "test_package 验证 boa 可执行 + --help/usage 输出（真实加载）"
