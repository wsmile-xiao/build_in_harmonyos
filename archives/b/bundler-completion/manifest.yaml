software: bundler-completion
display: "Bundler Completion"
description: "Ruby Bundler（bundle/bundler）命令的 bash 自动补全脚本"
category: utility
homepage: "https://github.com/mernen/completion-ruby"
license: MIT
build_system: custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 bash 脚本，无需编译，安装到 share/bash-completion/completions/bundler"
    - "需要 bash-completion 包提供补全框架函数（运行时依赖）"
    - "上游 completion-bundle 注册 bundle/bundler 及版本化别名（bundle2.x … bundler3.x）"
  common_dependencies:
    - bash-completion

# 版本索引（所有已归档版本，含状态）
versions:
  "1.0.3":
    status: built
    build_date: "2026-09-12"
