# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bundler-completion/1.0.3
homepage: "https://github.com/mernen/completion-ruby"

# 上游测试命令 (requires a Rails test app + bash-completion library)
upstream_check_command: "bash tests/completion-bundle/test.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/completion-bundle/test.sh
    source: completion-ruby-1.0.3/tests/completion-bundle/test.sh
    description: "4 upstream completion cases (basic commands, global options, bundle exec rake, bundle exec rails); needs bash-completion library and a Rails test app (RAILS_TEST_APP_DIR)"
    command: "bash tests/completion-bundle/test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_bundler_completion.sh
    description: "Verify the installed completion file exists, is valid bash, defines __bundle(), registers it with complete, and that sourcing it registers completions for bundle/bundler"
    command: "bash test_bundler_completion.sh <completion_file>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
