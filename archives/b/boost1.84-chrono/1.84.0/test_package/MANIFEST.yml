package: boost1.84-chrono/1.84.0
homepage: https://www.boost.org/

# 上游测试说明
# Boost 自带的 B2 构建系统在 OHOS 不兼容（SHELL 执行机制失败），
# 无法直接使用 b2 运行上游测试。本适配通过手动编译 boost.chrono 库
# 自带测试源文件绕过 b2，在 OHOS 环境真实运行了 chrono 库的
# clock/duration/time_point/io 四组上游测试（共 21 项：17 项 run 型
# 全部通过；4 项 typedefs/types/default_ratio/ratio_alias 为上游
# Jamfile 定义的 chrono-compile 编译验证型，源文件无 main 函数，
# 按上游语义以编译通过计）。
# 测试方式：clang++ -std=c++17 -stdlib=libc++ 编译 libs/chrono/test/
# 各测试源文件，链接到已编译的 libboost_chrono.a，直接运行可执行文件。
# b2 不兼容是已知技术障碍，项目方已记录（E068 错误模式）。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/chrono/test/clock/clock_pass.cpp"
    description: "boost.chrono 时钟测试（11 断言，system_clock/steady_clock/high_resolution_clock/process_cpu_clocks/thread_clock）"
    command: "clang++ clock_pass.cpp -lboost_chrono && ./a.out"
    result: passed
  - file: "libs/chrono/test/duration/arithmetic_pass.cpp"
    description: "boost.chrono duration 算术测试（41 断言）"
    command: "clang++ arithmetic_pass.cpp -lboost_chrono && ./a.out"
    result: passed
  - file: "libs/chrono/test/duration/duration_cast_pass.cpp"
