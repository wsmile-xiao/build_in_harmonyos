test_package_tests:
  - file: test_boost_chrono.cpp
    description: "boost.chrono: steady_clock/duration 算术与 cast/time_point/thread_clock/process_cpu_clocks/duration I/O 共 7 组校验"
    command: "ctest boost_chrono_test"

assertion_count: 7  # test_package 实际校验组数；上游测试 21 项（17 run + 4 compile）见 upstream_tests 列表
