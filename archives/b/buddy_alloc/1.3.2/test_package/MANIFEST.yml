# test_package/MANIFEST.yml — buddy_alloc 1.3.2
# 上游官方测试声明（R51 申报表）

package: buddy_alloc/1.3.2
homepage: "https://github.com/spaskalev/buddy_alloc"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make test（依赖 cppcheck/llvm-cov，本平台缺失）；ctest -N 无注册项（CMake 仅 add_executable 目标，直接运行）；已用 clang 独立编译运行"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（全量枚举台账）
upstream_tests:
  - file: tests.c
    source: buddy_alloc-1.3.2/tests.c
    description: "主测试套件：165 个独立 test_* 用例（自定义 assert 框架，main() 逐一调用全部 165 个），clang -std=c99 编译运行 rc=0 全过"
    command: "clang -std=c99 -O2 tests.c -o buddy_tests && ./buddy_tests"
  - file: testcxx.cpp
    source: buddy_alloc-1.3.2/testcxx.cpp
    description: "C++ 翻译单元兼容性测试：以 C++11 包含 buddy_alloc.h 并实例化实现，编译运行 rc=0"
    command: "clang++ -std=c++11 -O2 testcxx.cpp -o buddy_cpp_tu && ./buddy_cpp_tu"
  - file: test-fuzz.c
    source: buddy_alloc-1.3.2/test-fuzz.c
    description: "fuzz 驱动（非独立用例，未入 CMake/Makefile 主目标）：独立编译失败——调用 buddy_tree() 但头文件仅前向声明 struct buddy_tree，上游缺陷，记录不计数"
    command: "clang -std=c99 -O2 test-fuzz.c（编译失败：undeclared buddy_tree）"
  - file: bench.c
    source: buddy_alloc-1.3.2/bench.c
    description: "基准程序（非独立用例，不计入通过率）：clang 编译运行 rc=0，总耗时约 23s"
    command: "clang -std=c99 -O2 bench.c -o buddy_bench && ./buddy_bench"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_consumer.c
    description: "消费者用例：仅用公开 API（buddy_init/malloc/free/alloc_size/arena_free_size）的业务上层模拟应用，编译链接运行并通过断言"
    command: "./test_consumer"
  - file: test_ohos.c
    description: "鸿蒙专项测试：64B 对齐 arena / embed 模式 / resize 语义 / safe_free 双重释放保护 / 256MiB 大 arena 往返，断言+可观察输出"
    command: "./test_ohos"

# 测试断言总数（上游 tests.c 165 用例 + 本 test_package 消费者/鸿蒙测试）
assertion_count: 165
