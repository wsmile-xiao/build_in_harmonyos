# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "boost1.84-thread 是 Debian 风格单库拆分包：从 boost 1.84.0 源码独立裁剪编译 libboost_thread.a（b2 在 OHOS 不可用，手动编译 5 个源文件：future/tss_null/pthread×3）"
  - "Boost.Thread 静态库编译需 -DBOOST_ALL_NO_LIB + -DBOOST_SP_NO_PTHREAD_SETCANCELSTATE（OHOS musl 无 pthread_setcancelstate，补丁 0001 以 feature-detection 宏绕开）"
  - "测试运行需注入 libc++_shared.so 的 LD_LIBRARY_PATH（clang++ -print-file-name 自省定位，先例 boost/1.85.0）"
