# 声明平台限制。
upstream_check_command: "无（纯 bash prompt 主题无上游测试框架）"
upstream_test_in_build: false
upstream_test_command: "无"

# test_package 消费者测试（R34 真实产物校验：bobby.theme.bash 存在 + bash 语法）
test_package_tests:
