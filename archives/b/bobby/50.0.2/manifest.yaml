# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "bobby 是 Bash-it/oh-my-bash 的 bash prompt 主题（bobby.theme.bash，纯 bash 脚本），无编译无构建系统，无 conan 库依赖（运行时依赖 bash+git）"
- "Git.clone 浅克隆（--depth 1）后不能 checkout 臆造的固定 commit——浅克隆只有 HEAD，固定 commit 需深克隆，臆造 commit 报 'unable to read tree'；直接 clone master（浅克隆 HEAD）即可"
- "纯脚本包 conanfile.py 需 export_sources()/apply_conandata_patches（G1 完整性要求）；test_package 用 python3 + 路径单引号（绕开工作目录括号的 sh 解析问题）"
