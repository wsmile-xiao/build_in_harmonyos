# ============================================================
# 源码信息
# ============================================================

source:
  # bobby 是 Bash-it 的 bash prompt 主题（themes/bobby/bobby.theme.bash），
  # 纯 bash 脚本。上游源头是 Bash-it 仓库（git 源，Git.clone 拉取）。
  url: "https://github.com/Bash-it/bash-it.git"
  commit: "master（浅克隆 HEAD，含 bobby 主题）"
  type: "git"
  sha256: ""
