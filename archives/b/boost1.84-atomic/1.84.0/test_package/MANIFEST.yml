package: boost1.84-atomic/1.84.0
homepage: https://www.boost.org/

# 上游测试说明
# Boost.Atomic 1.84.0 自带测试位于 libs/atomic/test（基于 Boost lightweight_test，
# 多线程部分使用 std::thread）。上游 B2 构建系统在 OHOS 不兼容（E068，
# Boost.Build SHELL 执行机制失败），无法用 b2 跑 test-suite atomic。
# 本适配在配方 build() 中手动编译上游测试源文件（clang++ -std=c++17
# -stdlib=libc++ -pthread，链接 libboost_atomic.a）并真实运行，
# 统计通过率写入 upstream-tests-report.txt，与上游 test-suite atomic 等价。
#
# 上游 test-suite atomic 清单（libs/atomic/test/Jamfile.v2）：
#   run 型 14 项（含 wait_fuzz）+ compile-fail 型 3 项 + compile 型 1 项 = 18 项
#   其中 BOOST_ATOMIC_FORCE_FALLBACK 变体（4 项重复编译）在本清单中按
#   api 测试折叠计入（同源文件不同宏配置，上游单独列名）。
# 本地实测：18/18 通过（14 run + 1 compile 编译运行全过，
#   3 compile-fail 按预期编译失败）。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/atomic/test/atomic_api.cpp"
    description: "Boost.Atomic 基本 API 测试（atomic 各宽度整型/结构体读写）"
    command: "clang++ atomic_api.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/atomic_ref_api.cpp"
    description: "Boost.AtomicRef API 测试"
    command: "clang++ atomic_ref_api.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/wait_api.cpp"
    description: "wait/notify API 测试（需 libboost_atomic lock_pool）"
    command: "clang++ wait_api.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/wait_ref_api.cpp"
    description: "atomic_ref wait/notify API 测试"
    command: "clang++ wait_ref_api.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/ipc_atomic_api.cpp"
    description: "进程间 atomic API 测试（IPC 原子量）"
    command: "clang++ ipc_atomic_api.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/ipc_atomic_ref_api.cpp"
    description: "进程间 atomic_ref API 测试"
    command: "clang++ ipc_atomic_ref_api.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/ipc_wait_api.cpp"
    description: "进程间 wait/notify API 测试"
    command: "clang++ ipc_wait_api.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/ipc_wait_ref_api.cpp"
    description: "进程间 atomic_ref wait/notify 测试"
    command: "clang++ ipc_wait_ref_api.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/atomicity.cpp"
    description: "原子性统计验证（多线程竞态 + 0.995 置信度估算）"
    command: "clang++ atomicity.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/atomicity_ref.cpp"
    description: "atomic_ref 原子性统计验证"
    command: "clang++ atomicity_ref.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/ordering.cpp"
    description: "内存序 acquire/release 传递性测试"
    command: "clang++ ordering.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/ordering_ref.cpp"
    description: "atomic_ref 内存序传递性测试"
    command: "clang++ ordering_ref.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/lockfree.cpp"
    description: "lock-free 能力宏验证（BOOST_ATOMIC_*_LOCK_FREE）"
    command: "clang++ lockfree.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/wait_fuzz.cpp"
    description: "wait/notify 压力 fuzz 测试"
    command: "clang++ wait_fuzz.cpp -lboost_atomic -lpthread && ./a.out"
    result: passed
  - file: "libs/atomic/test/cf_arith_void_ptr.cpp"
    description: "compile-fail：void 指针算术应编译失败（负向测试）"
    command: "clang++ -fsyntax-only cf_arith_void_ptr.cpp（预期失败）"
    result: passed
  - file: "libs/atomic/test/cf_arith_func_ptr.cpp"
    description: "compile-fail：函数指针算术应编译失败（负向测试）"
    command: "clang++ -fsyntax-only cf_arith_func_ptr.cpp（预期失败）"
    result: passed
  - file: "libs/atomic/test/cf_arith_mem_ptr.cpp"
    description: "compile-fail：成员指针算术应编译失败（负向测试）"
    command: "clang++ -fsyntax-only cf_arith_mem_ptr.cpp（预期失败）"
    result: passed
  - file: "libs/atomic/test/c_implicit_ctor.cpp"
    description: "compile：隐式构造约束编译测试"
    command: "clang++ -fsyntax-only c_implicit_ctor.cpp（预期成功）"
    result: passed

test_package_tests:
  - file: test_boost_atomic.cpp
    description: "boost atomic+atomic_ref+wait/notify+atomic_flag 下游消费冒烟（CMake find_package(boost1.84-atomic COMPONENTS atomic) → boost1.84-atomic::atomic）"
    command: "ctest boost1_84_atomic_test"

assertion_count: 12  # test_package 实际断言数（lock_free 1 + fetch_add 2 + atomic_ref 3 + wait/notify 2 + atomic_flag 2 + 汇总 2）；上游测试 18 项见 upstream_tests 列表
