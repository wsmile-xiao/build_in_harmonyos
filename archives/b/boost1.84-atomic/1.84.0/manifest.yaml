software: boost1.84-atomic
version: 1.84.0
status: built
build_system: manual
configure_options: []
build_options:
  - "-std=c++17 -stdlib=libc++ -fPIC -DBOOST_ALL_NO_LIB -DBOOST_ATOMIC_SOURCE"
dependencies: []
knowledge_gained:
  - Boost.Atomic 1.84 非 header-only：wait/notify 依赖编译库 lock_pool.cpp（aarch64 上唯一 TU）
  - Boost 组件拆分包模式：源码清单以 libs/<lib>/build/Jamfile.v2 的 lib 段为权威
  - lock_pool.cpp 编译需 -Ilibs/atomic/src（lock_pool_init1.ipp 的 Boost.PP 迭代 include）
  - OHOS musl 支持 futex syscall，lock_pool 走 BOOST_ATOMIC_USE_FUTEX 路径
  - 组件包形态选型：独立裁剪编译（元包缺 boost_atomic 组件声明，方案 B 不可行）
  - 组件包 cmake_file_name 用包名（boost1.84-atomic）避免与元包 "Boost" 的 CMakeDeps 冲突
  - OHOS 测试运行环境：LD_LIBRARY_PATH 指向编译器自省的 SDK libc++ 目录 + ELF 自签名
patches:
  - 0001-ohos-pthread-cancel-fix.patch（与元包同款：组件包携带全头文件树，下游用 boost/thread 头需 BOOST_SP_NO_PTHREAD_SETCANCELSTATE 守卫）
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题)
issues: []
compilation_date: 2026-09-05
compiler: clang
platform: OpenHarmony
notes: Boost.Atomic 组件拆分包（Debian libboost-atomic1.84 模式）；选型与实现细节见 notes.md
