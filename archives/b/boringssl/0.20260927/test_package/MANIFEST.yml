# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: boringssl/0.20260927
homepage: "https://boringssl.googlesource.com/boringssl/"

# 上游测试命令说明：BoringSSL 无 ctest/pytest 注册，测试为 gtest 独立二进制
# （BUILD_TESTING=ON 默认构建：crypto_test / ssl_test / decrepit_test /
#  pki_test / urandom_test），另有 Go 驱动的 runner（本平台无 Go，不使用）。
upstream_check_command: "ninja crypto_test ssl_test decrepit_test pki_test urandom_test && ./crypto_test && ./ssl_test && ..."

# build() 内已集成上游测试（R51）：构建 crypto_test/ssl_test 并实际运行
# （DeathTest 因 /tmp 只读 E002 运行时过滤）
upstream_test_in_build: true
upstream_test_command: "timeout 1800 ./crypto_test --gtest_filter=-*DeathTest* && timeout 1800 ./ssl_test --gtest_filter=-*DeathTest*"

# 上游实际测试清单（R51 三步法：清点 → 实跑 → 如实回填）
# 实跑环境：HarmonyOS PC (aarch64)，2026-09-28，clang 15.0.4 Release 构建
# 合计：3672 通过 / 3676 执行（1 上游自带 skip；urandom_test 平台限制失败）
upstream_tests:
  - file: crypto/crypto_test.cc
    source: boringssl-e98a6564/crypto/crypto_test.cc
    description: "crypto 全量单元测试：1844/1845 PASS（1 上游自带 skip：AEADTest.WycheproofAESEAX），排除 4 个 DeathTest（/tmp 只读 E002）"
    command: "./crypto_test --gtest_filter=-*DeathTest*"
  - file: ssl/ssl_test.cc
    source: boringssl-e98a6564/ssl/ssl_test.cc
    description: "SSL 全量单元测试：484/484 PASS，排除 2 个 DeathTest（/tmp 只读 E002）"
    command: "./ssl_test --gtest_filter=-*DeathTest*"
  - file: decrepit/decrepit_test.cc
    source: boringssl-e98a6564/decrepit/decrepit_test.cc
    description: "legacy 算法单元测试：12/12 PASS"
    command: "./decrepit_test"
  - file: pki/pki_test.cc
    source: boringssl-e98a6564/pki/pki_test.cc
    description: "PKI 证书解析/路径构建单元测试：1332/1332 PASS"
    command: "./pki_test"
  - file: crypto/rand/urandom_test.cc
    source: boringssl-e98a6564/crypto/rand/urandom_test.cc
    description: "熵源白盒测试 0/1 FAIL —— 依赖 ptrace(PTRACE_TRACEME) 拦截子进程系统调用，鸿蒙平台拒绝（Permission denied），平台限制非库缺陷"
    command: "./urandom_test"
  - file: ssl/test/runner (Go)
    source: boringssl-e98a6564/ssl/test/runner
    description: "Go 测试 runner：平台无 Go 工具链（R47 已证项目语言为 cpp），不适用"
    command: "go test ./ssl/test/runner"

# test_package 中自带的测试 (消费者视角验证 + 鸿蒙特有)
test_package_tests:
  - file: test_boringssl.cc
    description: "R34 消费者 E2E（27 断言）：内存 BIO pair 完整 TLS 1.3 握手（证书校验/密码套件/双向应用数据）+ BIGNUM 运算 + SHA-256 已知向量 + RAND_bytes"
    command: "ctest -R boringssl_consumer_e2e"
  - file: ohos_specific_test.py
    description: "R53 鸿蒙特有断言（23 条）：libssl.a/libcrypto.a 静态交付且无 .so（R26）、bssl ELF64/AArch64/PIE/musl 解释器/无 RPATH/静态 NEEDED、full RELRO + NX、bssl sha256sum + rand 16 真机实跑、静态库 API 符号、头文件交付"
    command: "python3 ohos_specific_test.py --pkg <package_folder>"

# 测试断言总数 (近似值)
# R34 = 27；R53 = 23；上游测试 = 3676（gtest 用例）
assertion_count: 3726
