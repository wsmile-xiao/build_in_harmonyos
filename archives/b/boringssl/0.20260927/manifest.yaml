build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DBUILD_TESTING=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Go 工具链非必需：cmake/go.cmake 明示 optional；汇编为预生成 gen/*-linux.S（平台宏守卫），Go 相关目标全在 if(GO_EXECUTABLE) 内（无 Go 时 run_tests 等为 dummy 目标，不参与默认构建）"
  - "CMake 在 HarmonyOS 上判为未知系统（System is unknown to cmake: Platform/HarmonyOS）→ recipe 内别名 CMAKE_SYSTEM_NAME=Linux（E092，先例 airspy），使上游 Linux 适配（-D_XOPEN_SOURCE=700 等）生效"
  - "libssl/libcrypto 为系统同名库（/usr/lib/libssl.so.3、libcrypto.so.3 存在）→ 必须静态构建（R26），交付 libssl.a/libcrypto.a，不产出 .so"
  - "gtest DeathTest 的 CapturedStream 在非 Android/iOS 平台硬编码 /tmp（gtest-port.cc:1104）；鸿蒙 /tmp 只读（E002）→ 死亡用例运行时过滤（crypto 4 + ssl 2），TEST_TMPDIR 无效"
  - "urandom_test 依赖 ptrace(PTRACE_TRACEME) 拦截子进程系统调用；鸿蒙平台拒绝（Permission denied）→ 0/1，属平台限制，非库缺陷"
  - "bssl CLI 的 --version 返回 rc=1（unknown command 回退 Usage），但 --help 与 -help 均 rc=0（CI L2 非阻塞）"
  - "静态链接的 bssl 动态依赖仅 libc++_shared.so + libc.so，解释器 /lib/ld-musl-aarch64.so.1，BIND_NOW + GNU_RELRO（full RELRO）、GNU_STACK NX"

