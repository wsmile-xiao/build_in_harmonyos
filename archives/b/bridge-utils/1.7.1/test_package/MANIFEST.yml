# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: bridge-utils/1.7.1
homepage: "https://www.linuxfoundation.org/collaborate/workgroups/networking/bridge"

# Upstream test command（如实申报：上游 tests/ 目录 2 个测试脚本）
upstream_check_command: "tests/functest"

# Upstream test suite（规则 4 如实申报）：
# 上游存在测试套件：tests/ 目录 functest（功能测试）+ stresstest（压力
# 测试）2 个测试脚本（+ mkbr/rmbr/busybr/showme 辅助脚本）。
# 未运行原因：functest 需 root + 内核模块（modprobe dummy）+ 网络设备
# （eth0），stresstest 需网络设备（ifconfig eth0）——OHOS 沙箱（非 root/
# 无内核模块/无网络设备）无法运行——环境限制，非适配问题。
upstream_tests_total: 2
upstream_tests_passed: 0
upstream_tests_skipped_reason: "上游 tests/ 2 个测试脚本（functest/stresstest）需 root + 内核模块（modprobe dummy）+ 网络设备（eth0）——OHOS 沙箱无此环境"

# Upstream tests not run in build (see skipped reason above; consumer-side
# test covers real execution of brctl)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_brctl.sh
    description: "Run brctl -V to verify tool executes (version 1.7.1)"

# Test assertion count
assertion_count: 1
