# 源码源：SourceForge project "bridge" 官方发布（权威）——bridge-utils 1.5
# 官方 tarball（kernel.org 仅发布 1.6/1.7.1；Debian 镜像仅有 1.7/1.7.1）。
# LFS 7.6 记录的权威下载源；MD5 ec7b381160b340648dede58c31bb2238（LFS 一致）。
# 树内容与 git.kernel.org tag v1.5 逐字节一致（LF 归一化后 40/40 文件相同，
# 已核对）；两 URL 均为官方 SourceForge 项目镜像（/download 与 ?viasf=1
# 重定向到签名下载服务器），CI 不可达 git.kernel.org（Read timed out，见
# erofs-utils 先例）→ 用 SourceForge 官方源 + sha256 锁定。
sources:
  url:
    - "https://sourceforge.net/projects/bridge/files/bridge/bridge-utils-1.5.tar.gz/download"
    - "https://downloads.sourceforge.net/project/bridge/bridge/bridge-utils-1.5.tar.gz?viasf=1"
  sha256: "42f9e5fb8f6c52e63a98a43b81bd281c227c529f194913e1c51ec48a393b6688"

patches:
  - patch_file: "patches/0001-libbridge-musl-headers.patch"
    patch_type: "portability"
    patch_description: "libbridge.h 显式引入 musl 系统头 sys/types.h+sys/time.h（u_int8_t/u_int16_t 与 struct timeval 由 musl 系统头定义，linux UAPI 头不间接引入）"