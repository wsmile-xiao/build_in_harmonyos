# 版本级 manifest（bridge-utils 1.5）
# 文件位置: archives/b/bridge-utils/1.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.5"

# 软件名
software: "bridge-utils"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: "autotools"

# 源码信息
source:
  # 1.5 官方发布托管在 SourceForge project "bridge"（kernel.org 仅发布
  # 1.6/1.7.1 tar；CI 不可达 git.kernel.org——erofs-utils 先例）
  url: "https://sourceforge.net/projects/bridge/files/bridge/bridge-utils-1.5.tar.gz"
  sha256: "42f9e5fb8f6c52e63a98a43b81bd281c227c529f194913e1c51ec48a393b6688"

# 构建配置
build:
  system: autotools
  configure_options:
  - "--with-linux-headers=/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot/usr/include"
  dependencies: []
  cc: clang
  cxx: clang++

# 应用的补丁列表
patches_applied:
- "0001-libbridge-musl-headers.patch"

# 知识沉淀
knowledge_gained:
- "bridge-utils 1.5 官方 tarball 托管在 SourceForge project bridge（kernel.org 仅 1.6/1.7.1）；CI worker 不可达 git.kernel.org 需 HTTP 官方源；树与 git tag v1.5 逐字节一致（LF 归一化后 40/40 文件相同）"
- "OHOS musl 需在编译单元显式引入系统头：u_int8_t/u_int16_t 由 sys/types.h 定义，struct timeval 由 sys/time.h 定义；linux UAPI 头（linux/if.h 等）与 OHOS sys/time.h 均不间接引入这两者"
- "SourceForge /download 或 ?viasf=1 URL 重定向到签名镜像：conan get() 需固定 filename（URL basename 为 /download、?viasf=1 无法推断扩展名）"
- "configure 由 autoconf 动态生成（1.5 无 configure）；configure 内 mktemp umask 077 在 HMDFS 跨用户下失败（同 itstool 先例，sed 改 000）"