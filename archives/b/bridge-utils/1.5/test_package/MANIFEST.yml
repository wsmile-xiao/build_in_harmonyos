# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: bridge-utils/1.5
homepage: "https://www.linuxfoundation.org/collaborate/workgroups/networking/bridge"

# Upstream test command（如实申报：上游 tests/ 目录 6 个测试脚本）
upstream_check_command: "tests/functest"

# Upstream test suite（规则 4 如实申报）：
# 上游 tests/ 目录共 6 个脚本：functest（功能测试）、stresstest（压力
# 测试）、mkbr（建桥）、rmbr（拆桥）、busybr（桥+网卡轮换）、showme
# （展示桥状态）。全部需 root + 内核模块（bridge/dummy）+/sbin/ifconfig
# 网络设备（eth0/eth1），functest 还涉及 modprobe/rmmod 与交互等待——
# OHOS 沙箱（非 root/无内核模块/无网络设备）无法运行——环境限制，
# 非适配问题，不起用作集成必跑项。
upstream_tests_total: 6
upstream_tests_passed: 0
upstream_tests_skipped_reason: "上游 tests/ 6 个脚本（functest/stresstest/mkbr/rmbr/busybr/showme）全部依赖 root + bridge/dummy 内核模块 + /sbin/ifconfig 网络设备（eth0/eth1），OHOS 沙箱环境不满足，属环境限制（已如实申报 N=6）"

# Upstream tests not run in build (see skipped reason above; consumer-side
# test covers real execution of brctl)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: test_brctl.sh
    description: "Run brctl -V to verify tool executes (version 1.5)"

# Test assertion count
assertion_count: 1