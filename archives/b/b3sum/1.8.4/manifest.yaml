version: "1.8.4"
status: published
build_date: "2026-04-24"

source:
  url: "https://github.com/BLAKE3-team/BLAKE3/archive/1.8.4.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBLAKE3_SIMD_TYPE=neon-intrinsics"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-b3sum.c.patch"

knowledge_gained:
  - "BLAKE3 C library can be used to build b3sum command-line tool"
  - "NEON intrinsics are supported on aarch64 HarmonyOS"
  - "Built from BLAKE3 C library implementation (c/ subdirectory of full repo)"
  - "Added b3sum.c command-line tool (simplified version)"
  - "This is NOT the full Rust b3sum implementation"
