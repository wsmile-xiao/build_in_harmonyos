software: btllib
# 软件级 manifest 模板
# 文件位置: archives/b/btllib/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: btllib

# 软件描述
description: Birol Lab Library - 生物信息学 C++ 工具库

# 软件分类
# bioinformatics | library | tools
category: bioinformatics

# 官方网站
homepage: https://github.com/BirolLab/btllib

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "1.7.8"
    status: built
    build_date: "2026-06-16"
    # 依赖列表（从版本级 manifest 继承）
    dependencies:
      - openmp/5.0

# ============================================================
# 编译特性
# ============================================================

# 构建系统
build_systems:
  - meson

# 编译器支持
compilers:
  - clang
  - gcc

# ============================================================
# 使用说明
# ============================================================

# 安装后可用的工具
binaries:
  - indexlr
  - randseq
  - mi_bf_generate

# 库文件
libraries:
  - libbtllib.a

# ============================================================
# 注意事项
# ============================================================

notes:
  - "所有子项目的 CMakeLists.txt 需要修改 CMake 版本要求"
  - "所有 bash 脚本需要修改 shebang 以适配鸿蒙系统"
  - "测试需要 samtools，如果没有可以禁用测试目录"