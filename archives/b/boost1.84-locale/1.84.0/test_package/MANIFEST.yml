package: boost1.84-locale/1.84.0
homepage: https://www.boost.org/

# 上游测试说明
# Boost 自带的 B2 构建系统在 OHOS 不兼容（SHELL 执行机制失败，E068），
# 无法直接使用 b2 运行上游测试。本适配通过手动编译 boost.locale 库
# 自带测试源文件绕过 b2，在 OHOS 环境真实运行了上游 Jamfile.v2 中
# 的 15 个 run 目标（test_message 在 libs/locale/test 目录下运行以
# 读取 .mo 文件；非 std 后端专属测试 test_collate/test_convert/
# test_boundary/test_formatting/test_icu_vs_os_timezone/test_winapi_*/
# test_posix_* 源码自带 #ifdef BOOST_LOCALE_NO_*_BACKEND 守卫，
# 本包 std-only 配置下编译后自动 Skipping 返回 0）。
# 后端配置：std 后端 + musl libc 内置 iconv（OHOS musl 自带，
# 与 glibc 平台上 iconv 属 libc 一部分的布局一致，零新增依赖）。
# 测试方式：clang++ -std=c++17 -stdlib=libc++ 编译 libs/locale/test/
# 各测试源文件，链接到已编译的 libboost_locale.a，直接运行可执行文件。
# 实测结果：15 项中 10 项完整通过；test_encoding / test_codepage_converter
# / test_message / test_std_collate / test_std_formatting 5 项因 OHOS
# musl C 库数据限制（gbk 字符集不支持、iso-2022-jp ESC 序列风格、
# //TRANSLIT 不可用、collate 字节序、money_put 无千分位）部分断言失败
# （合计 23 个失败断言），属平台限制（详见 test-report.md 豁免说明，
# E999 先例口径）。
# b2 不兼容是已知技术障碍，项目方已记录（E068 错误模式）。
upstream_test_in_build: true
upstream_tests:
  - file: "libs/locale/test/test_catalog.cpp"
    description: "boost.locale 消息编目测试"
    command: "clang++ test_catalog.cpp -lboost_locale && ./test_catalog"
    result: passed
  - file: "libs/locale/test/test_encoding.cpp"
    description: "boost.locale 编码转换测试（ISO8859-x/cp125x/cp932 等，含 musl 不支持的 gbk 分支）"
    command: "clang++ test_encoding.cpp -lboost_locale && ./test_encoding"
    result: partial_pass
  - file: "libs/locale/test/test_utf.cpp"
    description: "boost.locale UTF 编解码测试"
    command: "clang++ test_utf.cpp -lboost_locale && ./test_utf"
    result: passed
  - file: "libs/locale/test/test_util.cpp"
    description: "boost.locale 内部工具测试（含 test_helpers.cpp）"
    command: "clang++ test_util.cpp test_helpers.cpp -lboost_locale && ./test_util"
    result: passed
  - file: "libs/locale/test/test_date_time.cpp"
    description: "boost.locale 日期时间格式化测试"
    command: "clang++ test_date_time.cpp -lboost_locale && ./test_date_time"
    result: passed
  - file: "libs/locale/test/test_ios_info.cpp"
    description: "boost.locale ios_info facet 测试"
    command: "clang++ test_ios_info.cpp -lboost_locale && ./test_ios_info"
    result: passed
  - file: "libs/locale/test/test_ios_prop.cpp"
    description: "boost.locale ios 属性测试"
    command: "clang++ test_ios_prop.cpp -lboost_locale && ./test_ios_prop"
    result: passed
  - file: "libs/locale/test/test_codecvt.cpp"
    description: "boost.locale codecvt facet 测试"
    command: "clang++ test_codecvt.cpp -lboost_locale && ./test_codecvt"
    result: passed
  - file: "libs/locale/test/test_codepage_converter.cpp"
    description: "boost.locale 代码页转换器测试（含 Shift-JIS 分支，musl 无 cp932 多字节转换精度）"
    command: "clang++ test_codepage_converter.cpp -lboost_locale && ./test_codepage_converter"
    result: partial_pass
  - file: "libs/locale/test/test_stream_io.cpp"
    description: "boost.locale 流 I/O 测试"
    command: "clang++ test_stream_io.cpp -lboost_locale && ./test_stream_io"
    result: passed
  - file: "libs/locale/test/test_message.cpp"
    description: "boost.locale 消息翻译测试（cwd=libs/locale/test，ISO-8859-8 //TRANSLIT 分支受限）"
    command: "cd libs/locale/test && clang++ test_message.cpp -lboost_locale && ./test_message"
    result: partial_pass
  - file: "libs/locale/test/test_generator.cpp"
    description: "boost.locale generator 测试"
    command: "clang++ test_generator.cpp -lboost_locale && ./test_generator"
    result: passed
  - file: "libs/locale/test/test_std_collate.cpp"
    description: "boost.locale std 后端 collate 测试（sv_SE/en_US.ISO8859-1 locale 数据缺失豁免）"
    command: "clang++ test_std_collate.cpp -lboost_locale && ./test_std_collate"
    result: partial_pass
  - file: "libs/locale/test/test_std_convert.cpp"
    description: "boost.locale std 后端 conversion 测试"
    command: "clang++ test_std_convert.cpp -lboost_locale && ./test_std_convert"
    result: passed
  - file: "libs/locale/test/test_std_formatting.cpp"
    description: "boost.locale std 后端 formatting 测试（musl money_put 千分位差异豁免）"
    command: "clang++ test_std_formatting.cpp -lboost_locale && ./test_std_formatting"
    result: partial_pass

test_package_tests:
  - file: test_boost_locale.cpp
    description: "boost.locale: generator/info/encoding 往返/converter/collate/formatting/format 插值/date_time/message 回退共 9 组校验"
    command: "ctest boost_locale_test"

assertion_count: 9  # test_package 实际校验组数；上游测试 15 项（10 通过 + 5 平台限制部分通过）见 upstream_tests 列表
