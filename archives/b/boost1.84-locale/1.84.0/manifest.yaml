software: boost1.84-locale
version: 1.84.0
status: built
build_system: manual-compile (b2 incompatible with OHOS)
configure_options: []
build_options:
  - "手动编译 libs/locale/src/boost/locale 21 源文件（核心 15 + std 后端 5 + gregorian 1）→ libboost_locale.a"
  - "-std=c++17 -stdlib=libc++ -DBOOST_LOCALE_SOURCE -DBOOST_ALL_NO_LIB -DBOOST_THREAD_NO_LIB=1"
  - "-DBOOST_LOCALE_NO_POSIX_BACKEND=1 -DBOOST_LOCALE_NO_WINAPI_BACKEND=1 -DBOOST_LOCALE_NO_ICU_BACKEND=1 -DBOOST_LOCALE_WITH_ICONV"
  - "-DBOOST_SP_NO_PTHREAD_SETCANCELSTATE（配合 0001 补丁）"
dependencies: []
knowledge_gained:
  - Boost b2 构建系统 SHELL 执行机制在鸿蒙不兼容，手动编译绕过 (ref: E068)
  - std backend 的 libc++ facet（codecvt_byname/collate_byname/money_put 等）在 OHOS clang15+libc++ 下编译无障碍 (ref: E068 手动编译路径验证)
  - OHOS musl libc 内置 iconv，支持 ISO8859-x/cp125x/cp932/iso-2022-jp/koi8-r 等，ISO-8859-1↔UTF-8 往返字节精确；gbk 不支持、//TRANSLIT 不可用 (ref: E068 手动编译组合，平台差异记录于 notes.md)
  - 上游 Jamfile.v2 明确要求非 Windows 平台必须有 iconv 或 ICU，std-only 为上游不支持配置（conv API 对非 UTF-8 字符集全部抛 invalid_charset_error），采用 musl 内置 iconv 后恢复上游等价行为且零新增依赖 (ref: E068)
knowledge_ref:
  - E068 (Boost.Build 鸿蒙兼容性问题)
issues:
  - b2 构建系统失败：SHELL 执行机制在 OHOS 不兼容，改手动编译
  - musl locale 数据限制：sv_SE.UTF-8/en_US.ISO8859-1 等 locale 在 libc++ 抛 collate_byname 构造异常（测试内建 get_std_name 判空跳过路径覆盖）；gbk 字符集 musl iconv 不支持（test_encoding 单点失败）；ISO-8859-8 //TRANSLIT 不可用（musl 以 * 替换不可转换字符，test_message 1/2118 断言差异）
upstream_tests:
  total: 15
  passed: 10
  failed: 5
compilation_date: 2026-09-06
build_date: 2026-09-06
compiler: clang
platform: OpenHarmony
notes: 独立组件包，从 boost 1.84.0 全量源码裁剪，仅编译 locale 库（std 后端 + musl 内置 iconv）
