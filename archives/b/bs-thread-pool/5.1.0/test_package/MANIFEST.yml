package: bs-thread-pool/5.1.0
homepage: "https://github.com/bshoshany/thread-pool"

# Upstream has no CMake/ctest/gtest/autotools harness. The single test program
# tests/BS_thread_pool_test.cpp is compiled directly and run as:
#   clang++ -std=c++17 tests/BS_thread_pool_test.cpp -o bs_thread_pool_test -pthread
#   NO_COLOR=1 ./bs_thread_pool_test tests stdout
# which runs only the standard suite (no benchmarks/deadlock/plot/log file).
upstream_check_command: "clang++ -std=c++17 tests/BS_thread_pool_test.cpp -o bs_thread_pool_test -pthread && NO_COLOR=1 ./bs_thread_pool_test tests stdout"
upstream_test_in_build: true
upstream_test_command: "NO_COLOR=1 ./bs_thread_pool_test tests stdout"

# Static audit (v5.1.0 tarball): 59 check_* functions, 145 check() call sites.
# Runtime expands loops so the deterministic SUCCESS line reports 208 checks.
# Prior OHOS PC aarch64 run (2026-09-05, C++17 header, explicit -c clang++):
# 208/208 checks passed. True-machine preflight will re-verify.
upstream_test_total: 208
upstream_test_count_method: "auto"
upstream_tests_exist: true
upstream_test_audit: "tarball thread-pool-5.1.0: include/BS_thread_pool.hpp + tests/BS_thread_pool_test.cpp (4221 lines, no CMakeLists, custom harness with SUCCESS/FAILURE summary). Static: 59 check_* void funcs, 145 check( call sites. Runtime SUCCESS line is the single deterministic source. Prior OHOS evidence: 208/208 checks passed."

upstream_tests:
  - file: tests/BS_thread_pool_test.cpp
    source: thread-pool-5.1.0/tests/BS_thread_pool_test.cpp
    description: "Upstream standard suite: constructor/reset/tasks/member/callables/wait/loop/blocks/sequence/monitoring/pause/purge/vectors/priority/init/copy/shared_ptr/destruct/index (native extensions disabled, 208 checks)"
    command: "NO_COLOR=1 ./bs_thread_pool_test tests stdout"

test_package_tests:
  - file: test_bs_thread_pool.cpp
    description: "Consumer test: thread_count/submit_task/detach_task/detach_loop/submit_blocks/submit_sequence (6 checks)"
    command: "ctest -V"

test_package_test_count: 6
assertion_count: 6
