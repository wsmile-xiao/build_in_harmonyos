package: binutils/2.46.0
homepage: "https://www.gnu.org/software/binutils/"

upstream_check_command: "make -k -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -k -j1 check"

upstream_tests:
  - file: binutils/testsuite/*.exp
    source: binutils-2.46.0/binutils/testsuite
    description: "37 DejaGNU files: 34 executed drivers plus 3 config/library support files."
    command: "make -k -j1 check"
  - file: gas/testsuite/*.exp
    source: binutils-2.46.0/gas/testsuite
    description: "145 DejaGNU files: 142 executed drivers plus 3 config/library support files."
    command: "make -k -j1 check"
  - file: ld/testsuite/*.exp
    source: binutils-2.46.0/ld/testsuite
    description: "187 DejaGNU files: 184 executed drivers plus 3 config/library support files."
    command: "make -k -j1 check"
  - file: libctf/testsuite/*.exp
    source: binutils-2.46.0/libctf/testsuite
    description: "6 DejaGNU files: 4 executed drivers plus 2 config/library support files."
    command: "make -k -j1 check"
  - file: libsframe/testsuite/*.exp
    source: binutils-2.46.0/libsframe/testsuite
    description: "4 DejaGNU files: 3 executed drivers plus 1 config support file."
    command: "make -k -j1 check"
  - file: libiberty/testsuite/demangle-expected
    source: binutils-2.46.0/libiberty/testsuite
    description: "C++ demangler dataset: 420 cases."
    command: "make -C libiberty/testsuite -j1 check-cplus-dem"
  - file: libiberty/testsuite/d-demangle-expected
    source: binutils-2.46.0/libiberty/testsuite
    description: "D demangler dataset: 365 cases."
    command: "make -C libiberty/testsuite -j1 check-d-demangle"
  - file: libiberty/testsuite/rust-demangle-expected
    source: binutils-2.46.0/libiberty/testsuite
    description: "Rust demangler dataset: 75 cases."
    command: "make -C libiberty/testsuite -j1 check-rust-demangle"
  - file: libiberty/testsuite/test-pexecute.c
    source: binutils-2.46.0/libiberty/testsuite
    description: "Process execution integration target with an exit-status oracle."
    command: "make -C libiberty/testsuite -j1 check-pexecute"
  - file: libiberty/testsuite/test-expandargv.c
    source: binutils-2.46.0/libiberty/testsuite
    description: "Argument building and response-file expansion: 26 reported checks."
    command: "make -C libiberty/testsuite -j1 check-expandargv"
  - file: libiberty/testsuite/test-strtol.c
    source: binutils-2.46.0/libiberty/testsuite
    description: "String-to-integer conversion: 21 reported checks."
    command: "make -C libiberty/testsuite -j1 check-strtol"
  - file: libiberty/testsuite/test-doubly-linked-list.c
    source: binutils-2.46.0/libiberty/testsuite
    description: "Doubly linked list operations: 22 reported checks."
    command: "make -C libiberty/testsuite -j1 check-doubly-linked-list"

test_package_tests:
  - file: test.sh
    description: "Execute packaged as, readelf, objdump, nm, ar, ld, and strip in one ELF workflow, including a negative input control."
    command: "sh test.sh <fixture-dir> <output-dir> <packaged-tools>"
  - file: fixture-aarch64.S
    description: "AArch64 assembly fixture used by the HarmonyOS PC runner."
    command: "as fixture-aarch64.S -o fixture.o"
  - file: fixture-x86_64.S
    description: "x86_64 host assembly fixture used for WSL pre-development."
    command: "as fixture-x86_64.S -o fixture.o"
  - file: native-test.py
    description: "On native OHOS, link with installed GNU ld and execute signed linker, objcopy and strip outputs; three additional runtime assertions."
    command: "python3 native-test.py <package-dir> <output-dir> <C-compiler>"
  - file: native-consumer.c
    description: "Native executable fixture with exact output checked after each packaged ELF transformation."
    command: "clang -fuse-ld=<packaged-ld> native-consumer.c -o linked"

assertion_count: 16
host_assertion_count: 13
test_modifications:
  - "Upstream assertions and expected outputs are retained; execution drivers use configured shells, file/pipe channels, copied data fixtures and corrected log argument delimiters."
  - "OHOS test execution signs the requested native program and its local DT_NEEDED dependencies with the platform tool. No failure is relabelled as PASS or XFAIL."
  - "Consumers add an installed-package ELF workflow, a deliberate invalid-input control and three native OHOS execution assertions."
