compatibility:
  level: built
  notes: >-
    Targets native HarmonyOS PC aarch64. The final fresh-cache Conan create,
    packaging, 16 consumer assertions and all 367 enabled DejaGNU drivers
    completed. Results are 3419 PASS, 35 FAIL and 0 UNRESOLVED (98.99%); every
    FAIL is machine-mapped to a documented class; review of the logged contexts
    and control runs found zero failures caused by the current adaptation.
    gprofng is excluded because its collector uses Linux-specific runtime
    facilities, and gprof records 0 discovered / 0 executed after its native
    profiling probe fails. Generated configure scripts use a relaxed
    temporary-directory umask for HMDFS.
  technical_debt: >-
    Remove the scoped Clang unused-option suppression when the OHOS profile no
    longer forwards linker-only flags into Autoconf preprocessor probes; rerun
    configure and the complete test matrix after removal.

knowledge_gained:
  - "config.sub 2025-07-10 already accepts linux-ohos; only config.guess needs a HarmonyOS uname branch."
  - "Fourteen configure scripts create config.status directories with umask 077; HMDFS requires umask 022."
  - "Native OHOS HMDFS rejects direct shell-script execution from the Conan cache; generated Makefiles and gprof shell test rules use explicit shell execution, RUNTESTFLAGS supplies the target triplet, and make/install use -j1 to avoid restricted mkfifo jobserver paths."
  - "Clang-generated assembler in the upstream ld suite needs -fno-addrsig when consumed by GNU as 2.46.0."
  - "OHOS Clang must use the candidate GNU as inside compressed-debug linker tests; the flag is restored before later drivers."
  - "Native GNU ld outputs and literal-dlopen fixtures require scoped platform signing before execution."
  - "The release contains 386 DejaGNU .exp files across eight testsuite directories."
knowledge_references:
  - E007
  - E011
  - E272
  - E386
  - E490
  - "E547-draft-61BA"

