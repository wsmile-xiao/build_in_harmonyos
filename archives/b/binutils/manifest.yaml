software: binutils
display: "GNU Binutils"
description: "GNU assembler, linker, archive, symbol, and ELF inspection tools"
category: build-tool
homepage: "https://www.gnu.org/software/binutils/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Native HarmonyOS PC aarch64 command-line tool suite"
    - "Focused config.guess and HMDFS configure compatibility patches"
    - "Full DejaGNU inventory plus installed-package ELF workflow"
    - "Scoped native ELF signing and full HarmonyOS PC failure classification"
    - "gprofng excluded because its collector uses Linux-specific facilities"
  common_dependencies:
    - "dejagnu/1.6.3.1 (test only)"
    - "expect/5.45.4 (test only)"
    - "tcl/8.6.14 (test only)"

versions:
  "2.46.0":
    status: built
    build_date: "2026-09-08"
    conan_ref: "binutils/2.46.0"
