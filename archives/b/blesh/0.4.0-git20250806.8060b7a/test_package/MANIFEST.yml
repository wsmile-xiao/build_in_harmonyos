package: blesh/0.4.0-git20250806.8060b7a
homepage: "https://github.com/akinomyoga/ble.sh"

# blesh（ble.sh）是纯 Bash 脚本行编辑器——上游测试为 make check
# （bash out/ble.sh --test——ble/test 框架）。
upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "make check（bash out/ble.sh --test——上游 ble/test 框架——本地实测 7830/7830 运行通过（100%）——67 项为上游框架 skip（canvas 57 contra 工具缺失——上游同样 skip + util 6 mawk 沙箱编译受阻 + bash 4 版本分支）——nawk 已下载编译集成跑起来 util 6 项——OHOS HMDFS 权限模型适配 [[ -O dir ]]→[[ -w dir ]]（仅环境检查——不改测试用例）——如实记录）"

# 上游测试套件（ble/test 框架 27 个 section——lib/test-*.sh 中
# ble/test/start-section 声明总数 7897：bash 117 / canvas 系列 210 +
# GraphemeCluster c2break 77 + GraphemeBreakTest.txt 5783 / complete 7 /
# decode 33 / edit 2 / keymap.vi 系列 419 / main 29 / syntax 22 / util 1275）
upstream_tests: 7897

test_package_tests:
  - file: test_blesh.py
    description: "消费测试：source ble.sh --no-term 导出 BLE_VERSION（真实加载——非 stub）"
    command: "python3 test_blesh.py <package_folder>"

assertion_count: 2
