# blesh 0.4.0-git20250806.8060b7a 适配清单
# ble.sh——Bash Line Editor（纯 Bash 脚本库，Bash 3.0+ + POSIX 工具即够）
# GNUmakefile 构建（ble.pp 用 gawk 预处理生成 out/ble.sh + lib/*.sh）；
# 测试 make check = bash out/ble.sh --test（上游 ble/test 框架 27 section）。
# OHOS 适配点：HMDFS 权限模型（目录 owner 强制 20001006——ble.sh 初始化
# 的 [[ -O dir ]] owner 检查失败）→ 环境检查改 [[ -w dir ]]（仅初始化
# 检查——不改任何测试用例）；mkfifo 沙箱禁止——测试框架自带 mock 不阻塞。

version: "0.4.0-git20250806.8060b7a"
status: built

source:
  url: "https://github.com/akinomyoga/ble.sh/archive/8060b7ad6b2f66cf0f942d296de57e8d8be381f4.tar.gz"
  sha256: "a1c4049639705563a1fcdb4b811def58a8bb5929a1eb3a6249fa6c9bc814d45c"
  tar_format: tar.gz
  bundled: "ble.sh-8060b7a + blesh-contrib（CI worker 网络受限，配方内自包含）"

build:
  system: make
  notes: "GNUmakefile：ble.pp 用 gawk 预处理生成 out/ble.sh + lib/*.sh；make install INSDIR=<pkg>；contrib submodule（blesh-contrib）自包含下载解压（contrib/contrib.mk 需要）"

patches_applied:
  - "out/ble.sh 生成后 patch 初始化 owner 检查（[[ -O dir ]]→[[ -w dir ]]——OHOS HMDFS 权限模型环境适配——不改测试用例）"

test:
  upstream_cases: 7897
  upstream_suite: "make check = bash out/ble.sh --test（ble/test 框架——lib/test-*.sh 中 ble/test/start-section 声明 27 section 总数 7897：bash 117 / canvas 系列 210 + GraphemeCluster c2break 77 + GraphemeBreakTest.txt 5783 / complete 7 / decode 33 / edit 2 / keymap.vi 系列 419 / main 29 / syntax 22 / util 1275）"
  runnable: 7830
  runnable_note: "上游测试实跑：start-section 声明 7897，实际运行 7830（7830/7830 全过 100%）——67 项为上游测试框架 skip 如实分类：①canvas 57——依赖上游可选外部工具 ext/contra（akinomyoga/contra TTY 模拟器，ble.sh 发布物不含、上游仓库无 ext/ 目录、上游 CI 不安装——上游 CI 同样 skip）；contra 标准编译需 X11 头（OHOS 无 X11 图形栈——系统级阻塞）②util 6——mawk 变体缺失（ble.sh 测试遍历 awk/nawk/mawk/gawk；nawk 已下载编译集成跑起来 6 项，mawk 编译受阻于 configure 临时目录权限——OHOS 沙箱限制——如实记录）③bash 4——上游测试框架按 bash 版本条件的用例分支（bash 5.3 下不满足旧版本分支——上游同样 skip）；3 个 fail 已修复（writearray --nlfix：OHOS gawk 5.4.0 gensub 全局替换捕获组 bug——强制 IS_GAWK=0 走 gsub 兼容路径；fd#is-open 1/2：HMDFS 下 /proc/$BASHPID/fd/2 符号链接不可见——改 fd dup 测试 { : 10>&$1; }）"
  pass_rate: "7830/7897（99.15%——运行 7830/7830 全过，67 项为上游框架 skip：canvas 57 contra 工具缺失（上游同样 skip）+ util 6 mawk 沙箱编译受阻 + bash 4 版本分支——逐项如实记录）"
  consumer_test: "test_package 验证 source ble.sh --no-term 导出 BLE_VERSION（真实加载）"

knowledge_gained:
  - "ble.sh 是纯 Bash 脚本行编辑器（Bash 3.0+ + POSIX 工具）——GNUmakefile 用 gawk 预处理 ble.pp 生成 out/ble.sh"
  - "OHOS HMDFS 权限模型：目录 owner 强制为 20001006:file_manager（与进程 euid 不同）——bash 的 [[ -O dir ]] owner 检查必然失败——需改可写检查（环境适配，不改测试）"
  - "OHOS 沙箱禁止 mkfifo（Operation not permitted）——ble.sh 测试框架 lib/test-util.sh 自带 mkfifo mock 不阻塞"
  - "make 需要 contrib submodule（contrib/contrib.mk）——tarball 不含，自包含下载 blesh-contrib"
