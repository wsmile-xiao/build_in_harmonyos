sources:
  # blesh 0.4.0-git20250806.8060b7a——ble.sh Bash Line Editor（纯 Bash 脚本库）
  # 上游 commit 8060b7a（2025-08-06）tarball（GitHub codeload）
  url:
    - "https://gh-proxy.com/https://github.com/akinomyoga/ble.sh/archive/8060b7ad6b2f66cf0f942d296de57e8d8be381f4.tar.gz"
    - "https://github.com/akinomyoga/ble.sh/archive/8060b7ad6b2f66cf0f942d296de57e8d8be381f4.tar.gz"
  sha256: "a1c4049639705563a1fcdb4b811def58a8bb5929a1eb3a6249fa6c9bc814d45c"
  # contrib submodule（blesh-contrib——make 的 contrib/contrib.mk 需要；
  # CI worker 网络受限——自包含下载；commit 级固定——上游 master 更新不影响
  # 校验和（aireview P2：分支 URL + 固定 sha256 不可复现——已改 commit 级））
contrib:
  url:
    - "https://gh-proxy.com/https://github.com/akinomyoga/blesh-contrib/archive/d2109203480a7dfe1dead5f5f8f9f15a9146c90d.tar.gz"
    - "https://github.com/akinomyoga/blesh-contrib/archive/d2109203480a7dfe1dead5f5f8f9f15a9146c90d.tar.gz"
  sha256: "a31f459f2647e6d7c48a302845cd8bf80093a10794ed349d6c4a418425a2d1c6"
# The One True AWK（nawk）——ble.sh 测试循环遍历 awk/nawk/mawk/gawk 变体，
# OHOS 缺 nawk 导致 util 测试 6 项 skip（非系统性阻塞——下载编译补齐跑起来）；
# mawk 编译受阻（configure 临时目录权限——OHOS 沙箱限制）如实记录
nawk_source:
  url:
    - "https://codeload.github.com/onetrueawk/awk/tar.gz/refs/heads/master"
    - "https://github.com/onetrueawk/awk/archive/refs/heads/master.tar.gz"
  sha256: "b3883a3a464ab4a1d20d4cc3b9245983f6ee2f455a78ead9fa9ef5a7b201eb7d"
