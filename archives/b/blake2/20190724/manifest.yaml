# 版本级 manifest
# 文件位置: archives/{letter}/{name}/20190724/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "20190724"

software: blake2

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源）
  url: "https://github.com/BLAKE2/BLAKE2/archive/refs/tags/20190724.tar.gz"

  # 源码校验和（官方 tag 20190724 tarball SHA-256）
  sha256: "7f2c72859d462d604ab3c9b568c03e97b50a4052092205ad18733d254070ddc2"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型：多子目录 makefile（ref/b2sum/sse/neon/bench 各自 makefile），根目录无 configure
  system: makefile

  # 配置选项列表（makefile 无 configure；b2sum 用 NO_OPENMP=1 禁用 OpenMP）
  configure_options:
  - "NO_OPENMP=1"

  # 编译依赖列表：无第三方编译依赖（bench/md5.c 的 openssl/md5.h 仅基准工具用，不参与库与 b2sum 构建）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []