knowledge_gained:
  - "boost_prg_exec_monitor 上游构成（libs/test/build/Jamfile.v2 PRG_EXEC_MON_SOURCES）：execution_monitor.cpp + debug.cpp + cpp_main.cpp 三个转发翻译单元（均 #define BOOST_TEST_SOURCE 后 include impl/*.ipp）"
  - "prg_exec_monitor-ts 上游测试全部为 run-fail 型（Jamfile [ run-fail ... ] 注册）：测试程序故意触发错误（非零返回/除零/未捕获异常/assert），以非零退出码判定通过——不是普通 PASS 型测试，判定逻辑必须反转"
  - "uncatched-exception-test 上游注册为 included 单头模式（boost/test/included/prg_exec_monitor.hpp），其余 3 个静态链接 boost_prg_exec_monitor/<link>static"
  - "OHOS musl 无 pthread_setcancelstate：编译 test 库源码（经 smart_ptr 头链引 sp_thread_sleep.hpp）需要 0001 补丁 + BOOST_SP_NO_PTHREAD_SETCANCELSTATE 宏（与元包 boost/1.84.0 同款）"
  - "execution_monitor.ipp 的 sigaltstack/SA_SIGINFO/siginfo_t 在 OHOS musl 均可用（实测 SIGSTKSZ=12288 MINSIGSTKSZ=6144），无需 BOOST_TEST_DISABLE_ALT_STACK"
  - "debug.ipp 的 BOOST_LINUX_BASED_DEBUG 分支（sys/ptrace.h + /proc 文件）在 OHOS 可编译；attach_debugger 的 fork 路径仅在请求调试器时执行，正常测试不触发"
  - "PEM 退出码转译实测：cpp_main 返回非零 → 报告 \"error return code: N\" 后进程退出码 1；抛 C 字符串异常 → 退出码 200（exception code 205）；除零（SIGFPE）→ 退出码 1；NDEBUG 下 assert 路径返回 1 → 退出码 1"

