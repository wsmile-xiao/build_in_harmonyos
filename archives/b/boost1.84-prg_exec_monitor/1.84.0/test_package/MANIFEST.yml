# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: boost1.84-prg_exec_monitor/1.84.0
homepage: "https://www.boost.org/doc/libs/1_84_0/libs/test/doc/html/boost_test/prg_exec_monitor.html"

# 上游测试入口：b2 构建系统（OHOS 不兼容，E068），无法直接运行 B2 测试目标；
# 上游 libs/test/test/Jamfile.v2 L220-225 以 [ run-fail ... ] 注册
# prg_exec_monitor-ts 测试套件（run-fail = 测试程序故意触发错误，
# 以非零退出码判定通过——验证 PEM 把错误转译为非零 rc）。
upstream_check_command: "b2 libs/test/test (upstream; OHOS 上不可用，配方内手动编译运行)"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "conan create（build() 内 _run_upstream_tests 逐个编译运行 libs/test/test/prg_exec_monitor-ts/*.cpp，run-fail 语义：非零退出码即通过）"

# 上游 prg_exec_monitor 测试全集（N=4，与 libs/test/test/prg_exec_monitor-ts/
# 目录实测 .cpp 数一致；boost_1_84_0 tarball 源码实测）
upstream_tests:
  - file: libs/test/test/prg_exec_monitor-ts/result-code-test.cpp
    source: boost_1_84_0/libs/test/test/prg_exec_monitor-ts/result-code-test.cpp
    description: "上游 PEM 测试：cpp_main 返回 -1（非零）→ PEM 转译为非零退出码（run-fail 型，上游 Jamfile 注册 boost_prg_exec_monitor/<link>static）"
    command: "clang++ ... result-code-test.cpp -lboost_prg_exec_monitor && ./ut_result-code-test（期望非零退出）"
  - file: libs/test/test/prg_exec_monitor-ts/system-exception-test.cpp
    source: boost_1_84_0/libs/test/test/prg_exec_monitor-ts/system-exception-test.cpp
    description: "上游 PEM 测试：整数除零 → PEM 捕获系统信号（SIGFPE）转译为非零退出码（run-fail 型，静态链接）"
    command: "clang++ ... system-exception-test.cpp -lboost_prg_exec_monitor && ./ut_system-exception-test（期望非零退出）"
  - file: libs/test/test/prg_exec_monitor-ts/uncatched-exception-test.cpp
    source: boost_1_84_0/libs/test/test/prg_exec_monitor-ts/uncatched-exception-test.cpp
    description: "上游 PEM 测试：cpp_main 抛未捕获 C 字符串异常 → PEM 捕获报告（run-fail 型，上游 Jamfile 注册 included 单头模式）"
    command: "clang++ ... uncaughted-exception-test.cpp（included 单头模式，期望非零退出）"
  - file: libs/test/test/prg_exec_monitor-ts/user-fatal-exception-test.cpp
    source: boost_1_84_0/libs/test/test/prg_exec_monitor-ts/user-fatal-exception-test.cpp
    description: "上游 PEM 测试：assert 失败（NDEBUG 下直接返回 1）→ PEM 转译为非零退出码（run-fail 型，静态链接）"
    command: "clang++ ... user-fatal-exception-test.cpp -lboost_prg_exec_monitor && ./ut_user-fatal-exception-test（期望非零退出）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_prg_exec_monitor.cpp
    description: "Boost.ProgramExecutionMonitor 消费者冒烟：正常路径 rc=0、子进程 cpp_main 非零返回被 PEM 转译为非零退出码（fork+waitpid 断言）、未捕获 C 字符串异常被 PEM 捕获（非零退出）"
    command: "./test_prg_exec_monitor"

assertion_count: 6
