# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# ⚠️ 如实声明测试来源：上游 bogofilter 1.2.5【无随 tarball 发布的独立测试
# 程序】（configure 自带 make check 为自检，非独立测试套件；tarball 无
# tests/ 目录）。本包测试均为 OHOS 适配自研（见下方 test_package_tests）。

package: bogofilter/1.2.5
homepage: "http://bogofilter.sourceforge.net/"

# 上游官方测试：无独立测试程序（已核实：tarball 无 tests/ 目录；
# configure 自带的 make check 为构建自检）
upstream_official_tests: []

# 构建阶段执行的测试命令：上游 tarball 自带 configure make check
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

# 适配补全测试（自研，非上游）：无（消费者验证集中在 test_package）
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test.cpp
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：bogofilter -n/-s 训练 ham/spam 词库（sqlite3 引擎）→ 分类 spam 特征邮件 → 验证输出；同时检查包内 bogofilter/bogoutil 可执行"
    command: "./test_bogofilter"

# 测试断言总数 (实际统计：4 项断言，全部为适配自研断言)
assertion_count: 4
