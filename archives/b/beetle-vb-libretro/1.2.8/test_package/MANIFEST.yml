# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: beetle-vb-libretro/1.2.8
homepage: "https://github.com/libretro/beetle-vb-libretro"

# 上游构建为纯 Makefile（无 configure），无可用的 check/test 目标；
# 该 libretro 核心是插件库（.so），由前端 dlopen 消费。
upstream_check_command: "make (无 check/test 目标，libretro 核心无上游测试套件)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试套件；枚举结果：无 tests/ 目录、无 ctest/meson 注册、Makefile
# 无 check/test 目标。库为只读插件库（模拟器核心），由 libretro 前端加载。
upstream_tests: []

# test_package 自带的消费者视角测试（dlopen 核心并调用 retro_* 公开 ABI）
test_package_tests:
  - file: test.c
    description: "消费者冒烟：dlopen mednafen_vb_libretro.so，调用 retro_api_version/retro_get_system_info 验证核心 ABI"
    command: "./test_beetle-vb-libretro"
  - file: test_ohos.c
    description: "鸿蒙专项：OHOS 运行时完整生命周期 retro_init → retro_get_system_av_info → retro_deinit，校验 VB 时序/几何常量"
    command: "./test_beetle-vb-libretro-ohos"

assertion_count: 7
