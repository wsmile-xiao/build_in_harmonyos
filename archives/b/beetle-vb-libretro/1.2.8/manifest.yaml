# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.8"

# 软件名
software: "beetle-vb-libretro"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libretro/beetle-vb-libretro/archive/83ed42608601fb7b01d41e4f8fb2007a37b8c84e.tar.gz"

  # 源码校验和
  sha256: "02630caca19b3e5ba4a1132c78cca7c2ac7238169f7014d8f345b86540ce4fc7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Libretro 核心 dlopen 消费者测试必须先 retro_set_environment 再 retro_init，否则 retro_init 处 Signal 11（knowledge_ref: E401）"
  - "libretro 核心为纯 Makefile 插件库：package_type=library 须声明 shared 选项（knowledge_ref: E283）"
  - "raw makefile 配方 build() 须 cwd=source_folder 执行 make（knowledge_ref: E392）"
  - "GitHub 直连超时经 ghfast/gh-proxy 镜像，conandata 保留官方 URL（knowledge_ref: E017）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
