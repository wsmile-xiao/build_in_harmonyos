software: bashbro
# 版本级 manifest 模板
# 文件位置: archives/b/bashbro/1.13/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.13"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-23"
build_system: shell

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub 官方 release，CI mirror fallback 覆盖 github.com）
  url: "https://github.com/victrixsoft/bashbro/archive/refs/tags/bashbro-v1.13.tar.gz"

  # 源码校验和
  sha256: "4ed4560df8cccf66754ba0ec7a2e18860549a36a6a1929188e8394cfedf882f7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: shell

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "bashbro 是纯 bash 脚本包（基于 Bash 的 web 文件浏览器），无构建系统"
  - "安装布局：bin/bashbro + share/man/man1/bashbro.1 + share/bashbro/LICENSE"
  - "运行时依赖 bash；可选 socat 或 netcat（端口监听后端）"
  - "上游 GitHub release tarball 与 Debian orig tarball 内容一致（同 SHA256）"
