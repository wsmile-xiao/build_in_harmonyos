software: benchmark
display: "Google Benchmark"
description: "C++ 微基准测试支持库"
category: library
homepage: "https://github.com/google/benchmark"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMakeToolchain 在 OHOS 上显式使用 OHOS 平台模块与 aarch64 处理器。"
    - "使用 gtest/1.17.0.1 的 GTest 组件构建上游 GTest 测试，不将其暴露给 benchmark 消费者。"
    - "导出 benchmark::benchmark 与 benchmark::benchmark_main 两个 CMake 组件。"
  common_dependencies:
    - gtest (test-only)

versions:
  "1.9.5":
    status: built
    build_date: "2026-09-09"
