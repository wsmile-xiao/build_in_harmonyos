package: benchmark/1.9.5
homepage: "https://github.com/google/benchmark"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# The package enables all upstream CTest entries and disables only the
# x86_64/FileCheck assembly group. The final total is taken from `ctest -N` on
# the OHOS build, not from the number of source files.
upstream_tests:
  - file: test/CMakeLists.txt
    source: benchmark-1.9.5/test/CMakeLists.txt
    description: "Google Benchmark upstream CTest suite: non-GTest and GTest entries"
    command: "ctest --output-on-failure"

test_package_tests:
  - file: test.cpp
    description: "OHOS consumer compatibility test: links benchmark::benchmark, registers a public benchmark, runs it, and checks one matching benchmark result"
    command: "./test_benchmark --benchmark_min_time=0.001s"
  - file: test_main.cpp
    description: "OHOS consumer compatibility test: links benchmark::benchmark_main and runs the BENCHMARK_MAIN entry point"
    command: "./test_benchmark_main --benchmark_min_time=0.001s"

assertion_count: 1
