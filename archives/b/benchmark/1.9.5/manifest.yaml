version: "1.9.5"
software: "benchmark"
status: built
build_date: "2026-09-09"
build_system: cmake

source:
  url: "https://github.com/google/benchmark/archive/refs/tags/v1.9.5.tar.gz"
  sha256: "9631341c82bac4a288bef951f8b26b41f69021794184ece969f8473977eaa340"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS follows Conan option shared"
    - "BENCHMARK_ENABLE_TESTING=ON"
    - "BENCHMARK_ENABLE_GTEST_TESTS=ON"
    - "BENCHMARK_USE_BUNDLED_GTEST=OFF"
    - "BENCHMARK_ENABLE_ASSEMBLY_TESTS=OFF"
    - "BENCHMARK_ENABLE_DOXYGEN=OFF"
    - "BENCHMARK_INSTALL_DOCS=OFF"
    - "BENCHMARK_INSTALL_TOOLS=OFF"
  dependencies:
    - "gtest/1.17.0.1 (test-only)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游安装 benchmark 与 benchmark_main 两个库；Conan 以两个 CMake 组件分别导出。"
  - "上游 GTest 测试通过已发布 gtest/1.17.0.1 的 GTest::gmock_main 组件接入，测试依赖不进入消费者依赖链。"
  - "OHOS 上关闭仅面向 x86_64/FileCheck 的 assembly tests，保留全部非汇编 CTest 与 GTest 测试。"

test_results:
  type: ctest
  total: 84
  passed: 84
  failed: 0
  skipped: 0
  not_run: 0
  note: "设备端 ctest --output-on-failure：84/84 通过；OHOS test_package 的两个消费者兼容性用例均完成编译和运行（2/2）。"
