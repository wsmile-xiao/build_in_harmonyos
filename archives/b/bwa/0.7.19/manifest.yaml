software: bwa
# 版本级 manifest — bwa 0.7.19
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.7.19"

# 编译状态
status: published

# 编译日期
build_date: "2026-05-27"

# 构建系统类型（平铺字段，G4 门禁必需）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/lh3/bwa/archive/refs/tags/v0.7.19.tar.gz"
  sha256: "cdff5db67652c5b805a3df08c4e813a822c65791913eccfb3cf7d528588f37bc"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项（makefile 项目无需 configure）
  configure_options: []

  # 编译依赖列表
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"    # 添加 install 目标，支持 DESTDIR 模式（R20）
  - "0002-configure.patch"   # 添加 configure wrapper，G0 clean-verify 兼容

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Makefile 项目无 install 目标时，需通过补丁添加 DESTDIR 模式安装规则（R20）"
  - "纯 Makefile 项目无 configure 脚本时，需添加空操作 wrapper 以通过 G0 clean-verify"
  - "bwa Makefile 硬编码 gcc（环境 gcc→clang symlink 可正常工作）"
  - "bwa mem/aln 等子命令在 HMDFS 上需使用绝对路径访问文件"