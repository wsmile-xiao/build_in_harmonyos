software: blitzwave
display: "blitzwave"
description: "C++ wavelet mini-library building on the blitz++ array template library; heavily templated, n-dimensional wavelet decompositions"
category: library
homepage: "https://oschulz.github.io/blitzwave/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 0.8.0 只带 configure.ac + autogen.sh；build() 先 autoreconf --install --force（tool_requires automake/1.18 + libtool/2.5.4）"
    - "configure.ac 需补 AM_PROG_AR（automake>=1.12 + AM_INIT_AUTOMAKE([-Wall -Werror]) 使缺 AR 宏变成硬错误；homebrew/macports 同款补丁）"
    - "config.guess 无法识别 HarmonyOS，configure 传 --build/--host=aarch64-unknown-linux-ohos（config.sub 支持）"
    - "生成 configure 中的 umask 077 在 HMDFS 下使 config.status 临时目录不可写（E114），必须移除"
    - "configure 用命令行前缀 CONFIG_SHELL=/bin/sh 调用，避免 profile buildenv 的 bash 腐蚀 libtool 引号（boolstuff 先例）"
    - "conan blitz 包不带 blitz.pc/blitz-config，configure 走 AC_CHECK_LIB 兜底，-I/-L 由 AutotoolsToolchain extra flags 注入"
    - "make -j1（HMDFS jobserver fifo EPERM，E074）"
  common_dependencies:
    - blitz

versions:
  "0.8.0":
    status: built
    build_date: "2026-09-08"
