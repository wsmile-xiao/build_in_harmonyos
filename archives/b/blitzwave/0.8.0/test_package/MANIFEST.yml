# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI build_and_test.sh L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md
#
# blitzwave 0.8.0 上游没有测试框架和 `make check` 接线：
# src/Makefile.am 仅声明 noinst_PROGRAMS（三个 assert/行为型自测程序，
# 随 make all 构建），无 check_PROGRAMS/TESTS。统计单位 = 自测程序。
# N 取数命令（审方可在上游源码树直接复核，源码来自 GitHub tag v0.8.0，
# tarball sha256 = edb0b708a0587e77b8e0aa3387b44f4e838855c17e896a8277bb80fbe79b9a63）:
#   tar -tzf blitzwave-0.8.0.tar.gz | grep -E '^blitzwave-0.8.0/src/.*-test\.cxx$' | wc -l
#   → 3
# 判定口径：每个程序退出码 0 且关键实质输出在阈值内（见 upstream_tests.description）。

package: blitzwave/0.8.0
homepage: "https://oschulz.github.io/blitzwave/"

# 上游测试命令: 上游 0.8.0 无 make check 目标（src/Makefile.am 无 TESTS/
# check_PROGRAMS），等价命令为依次执行三个 noinst 自测程序
upstream_check_command: "ls src/*-test.cxx | wc -l  # = 3; 无 make check，逐个执行 ./src/*-test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "conanfile.py build() -> _run_upstream_tests(): autoreconf + configure + make -j1 后依次运行三个 noinst 程序"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/Wavelet-test.cxx
    source: blitzwave-0.8.0/src/Wavelet-test.cxx
    description: "小波描述符自检：打印 CDF(1,1)/CDF(2,2) 提升格式；2 条 assert（WL_HAAR==WL_CDF_1_1、WL_HAAR!=WL_CDF_2_2）+ 退出码 0"
    command: "./src/Wavelet-test"
  - file: src/WaveletDecomp-test.cxx
    source: blitzwave-0.8.0/src/WaveletDecomp-test.cxx
    description: "3 维图像分解/重构：退出码 0 且 MaxDiff(must be << 1)=0/0、量化后 MaxDiff 与 StdErr 量级合理、Decomp/Recomp 深度互为相反数；无 Exception: 输出。输入 testimage.pnm（tarball 自带）以 argv[1] 传入"
    command: "./src/WaveletDecomp-test src/testimage.pnm"
  - file: src/arrayTools-test.cxx
    source: blitzwave-0.8.0/src/arrayTools-test.cxx
    description: "数组切片/滤波/填充自检：退出码 0 且输出翻转+重索引切片、滤波耗时、fill 扩展结果，无 Exception: 输出。输入 intdata.txt（上游 tarball 与 git 仓库均缺失，由 conanfile build() 生成 256 点确定性整数信号作为补充 fixture）"
    command: "./src/arrayTools-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_blitzwave.cpp
    description: "消费者链接公开 API：1-D CDF(2,2) 完美重构（maxdiff<1e-10）、小波描述符恒等式、2-D 选维分解+分离系数往返（maxdiff<1e-8），输出 PASS 标记"
    command: "./test_blitzwave"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
assertion_count_note: "Wavelet-test 内 2 条 assert；WaveletDecomp-test/arrayTools-test 无 assert，为行为型（阈值化输出核对），计数见 upstream_tests.description"
