# 版本级 manifest
# 文件位置: archives/b/blitzwave/0.8.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.8.0"
software: "blitzwave"
status: built
build_date: "2026-09-08"
build_system: "autotools"

source:
  url: "https://github.com/oschulz/blitzwave/archive/refs/tags/v0.8.0.tar.gz"
  sha256: "edb0b708a0587e77b8e0aa3387b44f4e838855c17e896a8277bb80fbe79b9a63"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--enable-static --disable-shared  # default shared=False 变体"
    - "CONFIG_SHELL=/bin/sh（命令行前缀赋值）"
    - "autoreconf --install --force（bootstrap，先于 configure）"
  dependencies:
    - blitz/1.0.2
    - automake/1.18  # tool_requires: OHOS 镜像缺 automake
    - libtool/2.5.4  # tool_requires: OHOS 镜像缺 libtool
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-ac-add-AM_PROG_AR.patch"

knowledge_gained:
  - "上游只带 configure.ac+autogen.sh 的 autotools 包在 build() 内 autoreconf --install --force 自举;automake/libtool 以 tool_requires 提供(OHOS 镜像仅 /data/service/hnp/bin 有 autoconf 套件);补丁先于 autoreconf 应用则 configure.ac 恒旧于生成物无需 pin 时间戳 (reference: archives/b/blitzwave/0.8.0/notes.md)"
  - "automake>=1.12 + AM_INIT_AUTOMAKE([-Wall -Werror]) 组合下缺 AM_PROG_AR 使 autoreconf 硬失败;homebrew/macports 同款一行补丁修复 (reference: archives/b/blitzwave/0.8.0/notes.md)"
  - "conan blitz 包不带 blitz.pc/blitz-config;上游 configure 的 AC_CHECK_LIB 兜底可用；AutotoolsToolchain 不聚合依赖路径;须 tc.extra_cxxflags/-L extra_ldflags 注入 (reference: archives/b/blitzwave/0.8.0/notes.md)"
  - "上游 0.8.0 无测试框架无 make check 接线;三个 noinst assert/行为型自测程序随 make all 构建;WaveletDecomp-test/arrayTools-test 的 try/catch 会把异常吞成退出码 0（假绿）;采信须核对实质输出 (reference: archives/b/blitzwave/0.8.0/test_package/MANIFEST.yml)"
  - "arrayTools-test 读取的 intdata.txt 在上游 tarball 与 git 仓库中均缺失;以确定性整数信号生成补充 fixture 后真实执行 (reference: archives/b/blitzwave/0.8.0/notes.md)"

