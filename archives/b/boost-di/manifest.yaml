# 软件级 manifest — boost-di
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: boost-di

# 显示名
display: "Boost.DI"

# 一句话描述
description: "C++14 Dependency Injection library (Boost.Ext.DI)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://github.com/boost-ext/di"

# 开源许可证（SPDX 标识）
license: BSL-1.0

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "header-only 库，无编译产物，仅打包 include/boost/di.hpp 与 include/boost/di/"
    - "上游 CMake 仅用于构建测试/示例，库本体为 INTERFACE 目标"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.3.2":
    status: pending
    build_date: 2026-08-29
