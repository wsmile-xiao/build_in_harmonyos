# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求此文件存在)
# 详见: docs/TEST_QUALITY_SPEC.md

package: boost-di/1.3.2
homepage: "https://github.com/boost-ext/di"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# Boost.DI 为 header-only 库，上游测试基于 CMake + 自研测试框架
# (test/ut, test/ft, test/pt)，通过 -DBOOST_DI_OPT_BUILD_TESTS=ON 触发。
upstream_check_command: "cmake -S . -B build -DBOOST_DI_OPT_BUILD_TESTS=ON && cmake --build build && ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
# header-only 配方 build() 无编译产物，不内嵌上游测试；上游测试已作为独立本地门禁
# 实际运行（50/50 通过，见 notes.md 台账与 ledger_summary）。
upstream_test_in_build: false
upstream_test_command: "cmake --build build -j && ctest --output-on-failure"

# 上游实际运行的测试程序 (实际运行 50/50 个注册入口，见 notes.md 台账)
upstream_tests:
  - file: test/ut (37 个 ut 入口: inject/aux_/concepts/core/policies/providers/scopes/type_traits/wrappers/bindings/config/injector/make_injector)
    source: di-1.3.2/test/ut
    description: "上游单元测试（编译期+运行期 DI 语义验证），ctest 全部通过"
    command: "ctest -R 'test.ut_'"
  - file: test/ft (11 个 ft 入口: di_bind/di_config/di_config_global_policies/di_config_global_provider/di_errors/di_glibcxx_debug/di_inject/di_injector/di_no_memory_inc/di_no_std_inc/di_injector_except)
    source: di-1.3.2/test/ft
    description: "上游功能测试；di_errors 为编译失败预期测试（100 个子用例），需从源码 test/ 目录运行以解析相对 include 路径"
    command: "ctest -R 'test.ft_'"
  - file: test/pt (2 个 pt 入口: di_compile_time/di_run_time)
    source: di-1.3.2/test/pt
    description: "上游策略测试（编译期与运行期），ctest 全部通过"
    command: "ctest -R 'test.pt_'"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_di.cpp
    description: "Boost.DI 消费者 smoke test: make_injector/bind/create 真实 API 调用（R34 实质依赖被测包）"
    command: "./test_boost_di"

# 测试断言总数 (近似值, 用于质量评估; test_di.cpp 含 1 个 assert + 1 个返回码检查)
assertion_count: 2

# 逐入口可运行性台账摘要 (2026-08-29 实际执行, 详见 notes.md)
ledger_summary:
  registered_entries: 50
  executed: 50
  passed: 50
  failed_via_ctest_default_cwd: 1
  rerun_with_upstream_invocation: "test.ft_di_errors 从源码 test/ 目录重跑 exit=0，确认通过"
  upstream_di_errors_subcases: 100