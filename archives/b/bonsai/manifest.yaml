software: bonsai
display: "Bonsai"
description: "Python 3 module for LDAP, using libldap2 and winldap C libraries"
category: network
homepage: "https://github.com/noirello/bonsai"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Python C 扩展，链接 libldap/liblber，BuildExt 自动检测 Kerberos"
    - "HarmonyOS 上若无 openldap-dev 则回退纯 Python 安装，离线测试仍可通过"
    - "上游离线测试（DN/URL/LDIF）无需 LDAP 服务器，网络测试需 slapd"
  common_dependencies: []

versions:
  "1.5.2":
    status: published
    build_date: "2026-09-05"
