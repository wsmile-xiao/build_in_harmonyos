# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: bonsai/1.5.2
homepage: "https://github.com/noirello/bonsai"

upstream_check_command: "python -m pytest tests -k 'not test_ldapclient and not test_ldapconnection and not test_pool and not test_asyncio and not test_gevent and not test_tornado and not test_trio' -v"
upstream_test_in_build: true
upstream_test_command: "python -m pytest tests/test_ldapdn.py tests/test_ldapurl.py tests/test_ldapvaluelist.py tests/test_ldifreader.py tests/test_ldifwriter.py tests/test_ldapentry.py tests/test_utils.py -v"

upstream_tests:
  - name: "test_ldapdn"
    source: "bonsai-1.5.2/tests/test_ldapdn.py"
    description: "LDAP DN 解析与操作"
  - name: "test_ldapurl"
    source: "bonsai-1.5.2/tests/test_ldapurl.py"
    description: "LDAP URL 解析"
  - name: "test_ldapvaluelist"
    source: "bonsai-1.5.2/tests/test_ldapvaluelist.py"
    description: "LDAP 值列表"
  - name: "test_ldifreader"
    source: "bonsai-1.5.2/tests/test_ldifreader.py"
    description: "LDIF 读取"
  - name: "test_ldifwriter"
    source: "bonsai-1.5.2/tests/test_ldifwriter.py"
    description: "LDIF 写入"
  - name: "test_ldapentry"
    source: "bonsai-1.5.2/tests/test_ldapentry.py"
    description: "LDAP 条目对象"
  - name: "test_utils"
    source: "bonsai-1.5.2/tests/test_utils.py"
    description: "工具函数（转义、TLS 信息）"
  - name: "test_ad_acl"
    source: "bonsai-1.5.2/tests/test_ad_acl.py"
    description: "AD ACL 解析"
  - name: "test_ad_sid"
    source: "bonsai-1.5.2/tests/test_ad_sid.py"
    description: "AD SID"
  - name: "test_ldapreference"
    source: "bonsai-1.5.2/tests/test_ldapreference.py"
    description: "LDAP 引用"

test_package_tests:
  - file: test_bonsai.py
    description: "LDAPDN/LDAPURL/LDIF/LDAPEntry 消费者测试"
    command: "python3 test_bonsai.py"
  - file: test_ldif.py
    description: "LDIF 读写往返测试"
    command: "python3 test_ldif.py"

assertion_count: 80
