# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: bcal/2.5
homepage: "https://github.com/jarun/bcal"

# 上游测试命令 (bcal 使用 Python 测试脚本 test.py)
upstream_check_command: "python3 test.py"

# conanfile.py build() 方法中是否已集成上游测试
# bcal 的 test.py 需要交互式终端，不适合在 conan build 中运行
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# bcal 自带 test.py 测试脚本，但需要交互式终端环境
# 在 OHOS 平台 conan create 流程中无法运行交互式测试
upstream_tests:
  - file: test.py
    source: bcal-2.5/test.py
    description: "bcal 官方 Python 测试脚本（需要交互式终端，不适合 CI）"
    command: "python3 test.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 bcal -h 验证版本，bcal -c 255 验证基数转换，bcal -m 1 kib 验证字节计算"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
