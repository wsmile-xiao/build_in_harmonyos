software: bcal
display: "bcal"
description: "存储表达式计算器，支持字节单位换算、基数转换和位运算"
category: system
homepage: "https://github.com/jarun/bcal"
license: GPLv3
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure 脚本，使用 PREFIX 参数指定安装路径"
    - "依赖 readline 库，需要安装 readline 预编译包提供头文件和库"
    - "编译时使用 -Werror，clang 下无警告可直接编译通过"
  common_dependencies:
    - readline

versions:
  "2.5":
    status: built
    build_date: "2026-06-16"
