# 版本级 manifest — belle-sip 5.3.105
# 遵循 ARCHIVE-SPEC v2.0

version: "5.3.105"
software: "belle-sip"
status: built
build_date: "2026-10-02"
build_system: cmake

source:
  url: "https://gitlab.linphone.org/BC/public/belle-sip/-/archive/5.3.105/belle-sip-5.3.105.tar.gz"
  sha256: "0622ca5dde5f3ad630ef04e174f930a59053dede258b9617b90ef4ea5fe3b061"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_STRICT=OFF"
    - "-DENABLE_UNIT_TESTS=ON（with_unit_tests，默认）"
    - "-DENABLE_TOOLS=OFF（本包只交付库与头文件）"
    - "-DENABLE_TUNNEL=OFF / -DENABLE_MDNS=OFF（上游默认）"
    - "-DBUILD_SHARED_LIBS=OFF（静态包）"
    - "-DBCToolbox_DIR=<bctoolbox>/share/BCToolbox/cmake、-DBelr_DIR=<belr>/lib/cmake/Belr（用上游 config 提供 bc_* 宏与 *_TARGET 变量）"
    - "crypto 后端: -isystem <bzrtp>/include 编译 + 目标链接追加 -lbctbx-crypto-priv -lmbedcrypto -lmbedtls -lmbedx509"
    - "OHOS: -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=armv8（E092）"
  dependencies:
    - belr/5.3.105
    - bctoolbox/5.3.115
    - bzrtp/5.3.105（私有 crypto 后端提供者）
    - zlib/1.3.1
  test_dependencies:
    - bcunit/5.3.113
  cc: clang
  cxx: clang++

patches_applied: []

package_type: library
artifacts:
  - "lib/libbelle-sip.a"
  - "include/belle-sip/**（公共头，含 belle-sip.h 汇总头）"
  - "include/bctoolbox/**（公共头依赖的 bctoolbox 头，含 crypto.h）"
  - "share/belle-sip/**（grammars 与 CMake config）"
  - "licenses/LICENSE.txt（GPL-3.0-or-later）"
libs:
  - belle-sip
requires:
  - belr/5.3.105
  - bctoolbox/5.3.115
  - bzrtp/5.3.105
  - zlib/1.3.1

tests:
  upstream_suite: bcunit (belle-sip-tester，逐套件执行)
  upstream_runnable_suites: 10
  upstream_registered: 175
  upstream_passed: 175
  upstream_failed: 0
  upstream_skipped: 0
  upstream_pass_rate: "175/175 (100%，可运行套件)"
  upstream_exempted_suites: 5
  upstream_exempted_reason: "平台限制（系统 resolver 配置 / 回环 SIP·HTTP 服务 / 上游期望值差异），详见 test_package/MANIFEST.yml"
  consumer_checks: 12
  consumer_failures: 0
  consumer_pass_rate: "12/12 (100%)"
  command: "conan create archives/b/belle-sip/5.3.105 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"

knowledge_gained:
  - "Belledonne 栈的 crypto 缺口可复用已发布 bzrtp/5.3.105 的私有后端（crypto.h + libbctbx-crypto-priv.a + mbedtls 三件套），不必逐库重写 mbedtls vendoring（草稿 DRAFT-BELLE-SIP-5105-BELLEDONNE-CRYPTO-BACKEND-REUSE）"
  - "crypto 库必须追加到 target_link_libraries，仅用 CMAKE_*_LINKER_FLAGS 会因顺序在对象之前而 undefined"
  - "Belr/BCToolbox 的 config 安装位置不同（lib/cmake/Belr vs share/BCToolbox/cmake），需按候选路径探测后设 <Pkg>_DIR"
  - "bc_find_package(ZLIB ZLIB::ZLIB zlib) 会把字面量 ZLIB::ZLIB 写进 ZLIB_TARGET，需用 CMakeDeps 生成同名目标（bzrtp 的 SQLite3 同款坑）"

adaptation_paths:
  - B
