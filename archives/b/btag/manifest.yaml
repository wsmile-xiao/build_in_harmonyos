software: btag
display: "btag"
description: "Command-line audio file tagger with batch editing and filename normalization"
category: multimedia
homepage: "https://github.com/fernandotcl/btag"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use a capability switch to retain Boost.Locale by default and select the standard process locale only when that component is unavailable"
    - "Disable optional cue-sheet support because libcue is not available in the OHOS Conan registry"
    - "Keep both upstream title-capitalization tests enabled and executed"
  common_dependencies:
    - boost
    - libedit
    - taglib

versions:
  "1.4.1":
    status: failed
    build_date: "2026-09-09"
    conan_ref: "btag/1.4.1"
