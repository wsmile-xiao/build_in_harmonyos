# Upstream and consumer test declaration for btag 1.4.1.
package: btag/1.4.1
homepage: "https://github.com/fernandotcl/btag"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "cmake.test()"

upstream_tests:
  - file: tests/english_titles.cpp
    source: btag-release-1.4.1/tests/english_titles.cpp
    description: "English title-capitalization data set"
    command: "english_titles_test tests/data/english_titles.txt"
  - file: tests/spanish_titles.cpp
    source: btag-release-1.4.1/tests/spanish_titles.cpp
    description: "Spanish UTF-8 title-capitalization data set"
    command: "spanish_titles_test tests/data/spanish_titles.txt"

test_package_tests:
  - file: test.sh
    description: "Run the packaged btag help path and a dry-run over an empty media directory"
    command: "bash test.sh"

assertion_count: 4
