software: yaku-ns
display: "yaku-ns"
description: "yaku-ns —— antirez 的微型 DNS 服务器（权威/转发 + AXFR over TCP），附 yaku-getzone AXFR 客户端"
category: network
homepage: "https://github.com/antirez/yaku-ns"
license: GPL-2.0-only
build_system: makefile

versions:
  "0.2":
    status: built
    format: conan
    note: >-
      使用上游手写 Makefile 构建 yaku-ns 与 yaku-getzone；两个补丁分别修复 musl
      下 nameser.h 的自包含性、并为两个命令补 --version/--help。零第三方依赖
      （纯 POSIX socket C 代码），不需要工具链补齐。

# 源码来源说明：上游 antirez/yaku-ns 没有 0.2 tag / release tarball（其 master 的
# ENS_VERSION 仍是 0.1.6），0.2 发行版由 Debian 维护者发布。配方采用 Debian pool 的
# yaku-ns_0.2.orig.tar.gz——它是该发行版的权威、不可变分发通道，且与 0.2 tag
# 字节一致（双源 sha256 已核对，见版本目录 notes.md）。