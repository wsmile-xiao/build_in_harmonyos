# conandata.yml — yaku-ns 0.2
#
# Source of record for the 0.2 release: Debian's immutable pool copy of the
# upstream orig tarball.  antirez/yaku-ns has no 0.2 tag and no release tarball
# (its master still carries ENS_VERSION 0.1.6); the `0.2` tag lives in the
# Debian maintainer's mirror, and Debian's own orig tarball is byte-for-byte
# identical to that tag.  Both sources were hashed and agree on the sha256
# recorded below.
#
# deb.debian.org is used because it is the authoritative distribution channel for
# this exact release and stays reachable independently of any single Git host.
#
# NOTE: do not write any full URL above.  The CI pre-download step scans the
# whole of this file — comments included — for http(s) literals and tries to
# fetch every match as if it were a source, so a bare cross-check URL in a
# comment becomes a second phantom download.

sources:
  url: "https://deb.debian.org/debian/pool/main/y/yaku-ns/yaku-ns_0.2.orig.tar.gz"
  sha256: "9ad94c49d399d7b3b19e9042dd7a9413082d90c1f8efedb68f60332ef59c3fe6"

patches:
  - patch_file: "patches/0001-nameser-portability.patch"
    patch_type: "portability"
    patch_description: >-
      nameser.h 是 1993 年版 BSD arpa/nameser.h 的逐字拷贝，使用
      __BEGIN_DECLS/__END_DECLS/__P() 与 u_char/u_int16_t 却未包含定义它们的头文件。
      glibc 经 <features.h> 间接引入 <sys/cdefs.h>，musl（OHOS libc）不会，导致每个
      编译单元报 unknown type name '__BEGIN_DECLS'。补上显式 include 使该头文件自包含，
      两种 libc 下均正确，不改动任何上游逻辑。
  - patch_file: "patches/0002-cli-long-options.patch"
    patch_type: "portability"
    patch_description: >-
      两个可执行文件都不支持 --version：选项解析是仅含短选项的 getopt()，-h 打印用法后
      以 1 退出。改用 getopt_long() 并新增 --version/--help 两条长选项，既有短选项行为完全
      不变。版本号由配方注入（上游发布 0.2 时忘了更新 tunable.h 里的 ENS_VERSION，
      至今仍是 0.1.6），非 Conan 构建仍回落到 ENS_VERSION。