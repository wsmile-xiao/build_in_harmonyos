# test_package/MANIFEST.yml — yaku-ns 0.2
package: yaku-ns/0.2
homepage: "https://github.com/antirez/yaku-ns"

# 上游没有测试套件：0.2 的 Makefile 里 check 目标被注释掉了（只剩一行
# md5sum -vc MD5SUM.SIGNED.asc，且 alexmyczko 的 0.2 tag 里同样被注释），
# 源码树中也没有 tests/ 目录、没有 configure、没有 automake/make check 目标。
# 因此上游用例数为 0，全部验证由 test_package 的消费者测试承担。
upstream_check_command: "上游无测试目标（0.2 的 Makefile check 规则被注释，仅剩 md5sum 自校验）"
upstream_tests_total: 0
upstream_tests_passed: 0
upstream_test_in_build: false
upstream_test_in_test_package: false
upstream_tests: []

test_package_tests:
  - file: test_package/test_cli.py
    description: >-
      CLI 消费者测试（5 项断言）：yaku-ns/yaku-getzone 的 --version 与 --help
      均以 0 退出并打印程序名/上游用法行，未知长选项在两者上都以 1 退出
      （证明选项解析仍在生效，而非吞掉全部参数）。
  - file: test_package/test_elf_abi.py
    description: >-
      交叉产物校验（3 项断言）：直接解析打包产物的 ELF 头，确认两个可执行文件
      都是 ELFCLASS64，且 e_machine 与小端序符合调用方按 settings.arch 传入的目标
      架构（OHOS CI profile 的 arch=armv8 即 EM_AARCH64），即产物确为 OHOS aarch64
      目标而非仅"编过"。期望值由 settings.arch 推导而非写死，故配方 validate() 接受的
      Linux/OHOS 平台集在非 aarch64 宿主上同样成立。
  - file: test_package/test_dns_service.py
    description: >-
      鸿蒙特有功能测试（7 项断言）：以生成的 zone 在回环高位端口启动**打包后的**
      yaku-ns 守护进程，并用真实 DNS 报文校验 A 记录解析、区外名字返回 NXDOMAIN、
      MX（preference 10 + mail.example.com）、TXT、NS，以及 TCP（2 字节长度前缀）
      SOA 查询。所有响应均在本测试内解析报文，不依赖守护进程日志。
  - file: test_package/conanfile.py
    description: >-
      测试驱动：逐个 self.run 执行上述三个真实测试程序；目标不可运行时明确失败
      而非跳过（跳过会让本包最该防的回归恰好不被观测）。

# 三份测试的断言数之和：5 + 3 + 7
assertion_count: 15
# 目标不可运行也会执行的断言数：5（CLI）+ 3（ELF 头）
cross_build_assertion_count: 8
# 需要可运行目标才执行的断言数：7（DNS 服务）
conditional_runtime_assertion_count: 7
