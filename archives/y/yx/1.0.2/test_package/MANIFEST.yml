# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: yx/1.0.2
homepage: "https://gitlab.com/tomalok/yx"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test   # → (cd tests && ./do_tests.sh)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
# tests/do_tests.sh 注册 27 条 assert 断言（脚本自报 25，其中 2 条位于
# "echo ... | assert" 管道右侧子 shell 中，其计数不回流父 shell，属上游脚本
# 自身缺陷）；实跑结果 27/27 断言全部通过（0 failed）。
upstream_tests:
  - file: tests/do_tests.sh
    source: yx-1.0.2/tests/do_tests.sh
    description: "上游 shell 测试驱动：映射键枚举/嵌套路径/序列索引/标量与块标量/文档选择/错误路径，共 27 条 assert；14 个 YAML 夹具（10 个被脚本引用，4 个 keep/strip 变体为上游 TODO）"
    command: "./do_tests.sh"

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质执行被测包的二进制并断言输出
test_package_tests:
  - file: test.sh
    description: "端到端测试：--version、映射键枚举、嵌套标量路径提取、序列索引枚举、序列索引提取、未知键非零退出"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
