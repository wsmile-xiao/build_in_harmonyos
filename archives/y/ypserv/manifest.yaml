software: ypserv
display: "ypserv"
description: "NIS(YP) v2 服务器套件（Thorsten Kukuk 维护）：ypserv/rpc.ypxfrd/rpc.yppasswdd 守护进程，加 yppush/makedbm/mknetid/revnetgroup/yphelper/ypxfr 等映射工具"
category: system
homepage: "https://github.com/thkukuk/ypserv"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "tarball 自带预生成 configure，无需 autoreconf（OHOS worker 无 automake）"
    - "musl 缺 glibc/shadow-suite 的口令库接口（fgetpwent/putpwent/fgetgrent/sgetspent/fgetspent/putspent/getspnam/lckpwdf/ulckpwdf），以 patches/0005 的 ohos-musl-compat.h 提供真实实现"
    - "libtirpc 的 rpc/*.h 装在 include/tirpc，需 PKG_CONFIG_PATH 指向 PkgConfigDeps 生成的 .pc，否则 PKG_CHECK_MODULES 探测落空"
    - "gdbm 走 configure.ac 的裸 AC_CHECK_LIB，需显式注入 -I/-L"
    - "静态 libnsl.a 与 ypserv 自带 XDR 存在 2 个重复符号，需 -Wl,--allow-multiple-definition"
    - "autoconf config.status 的 umask 077 在 HMDFS 上导致 Permission denied，需放宽为 022"
    - "运行期强依赖 /etc/netconfig（libtirpc 硬编码路径，OHOS 镜像未提供且 /etc 只读）"
  common_dependencies:
    - libnsl
    - libtirpc
    - gdbm
    - libxcrypt

versions:
  "4.2":
    packaging: conan
    status: built
    build_date: "2026-09-22"
    notes: >-
      首个 conan 配方。9 个补丁覆盖 musl/HMDFS/clang15 三类可移植性问题；
      依赖全部取静态变体（libnsl/2.0.1、libtirpc/1.3.7、gdbm/1.23、libxcrypt/4.5.2），
      9 个可执行文件仅 NEEDED libc.so，运行期无需解析任何第三方 .so。
      上游 make check（test-securenets、test-ypserv_conf）在 build() 内执行，2/2 通过；
      test_package 12 项断言通过，其中 2 项为鸿蒙特有（musl 口令库兼容层语义）。
