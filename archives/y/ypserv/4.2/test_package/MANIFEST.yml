# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: ypserv/4.2
homepage: "https://github.com/thkukuk/ypserv"

# 上游测试清单来源: lib/Makefile.am:27 `check_PROGRAMS = test-securenets test-ypserv_conf`
#                  lib/Makefile.am:31 `TESTS = $(check_PROGRAMS)`
upstream_check_command: "make -n check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的测试程序（Automake TESTS，run in lib/）
upstream_tests:
  - file: test-securenets
    source: ypserv-4.2/lib/test-securenets.c
    description: "securenets/securenet_host() 匹配判定：加载 lib/securenets.test，校验 127.0.0.1/::1/fe80::202:b3ff:ad:245 命中、10.10.0.87/fe80::202:b3fe:ff:ff 不命中"
    command: "./test-securenets"
  - file: test-ypserv_conf
    source: ypserv-4.2/lib/test-ypserv_conf.c
    description: "ypserv.conf 解析：加载 lib/test/ypserv.conf（30 条规则），要求解析器不崩溃并正常退出"
    command: "./test-ypserv_conf"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "9 个工具 --version 冒烟；yphelper 通过 musl 兼容层合并 passwd/shadow 与 group/gshadow（鸿蒙特有）；makedbm 的 gdbm 存取往返"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
#   upstream: test-securenets 5 组 check_entry + test-ypserv_conf 1 组解析；
#   test_package: 9 个工具冒烟 + 2 组鸿蒙特有合并 + 1 组 gdbm 往返
assertion_count: 18
