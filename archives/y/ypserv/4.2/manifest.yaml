knowledge_gained:
  - "musl 的 <shadow.h> 只有 struct spwd、没有任何函数；fgetpwent/putpwent/fgetgrent/sgetspent/fgetspent/putspent/getspnam/lckpwdf/ulckpwdf 全缺，需要按 /etc/passwd|shadow|group 冒号格式真实解析并写出的兼容层，空壳 stub 会让 rpc.yppasswdd 静默假成功"
  - "静态 libnsl.a 的 yp_xdr.o 与 ypserv 自带 ypserv_xdr.c 重复定义 xdr_ypresp_all/xdr_ypresp_maplist；共享库版本靠动态符号抢占静默通过，静态库必须 -Wl,--allow-multiple-definition（且必须让可执行文件自身定义优先）"
  - "autoconf config.status 用 (umask 077 && mktemp -d) 建临时目录，HMDFS 下 0700 目录对下一个进程不可进入 → config.status: could not setup config files machinery"
  - "libtirpc 1.3.7 把 /etc/netconfig 硬编码（不支持 NETCONFIG 环境变量），OHOS 无该文件且 /etc 只读；ypserv 缺它启动即退出（__rpc_setconf(\"netpath\") 返回 NULL）"
  - "upstream make clean 会删掉 yppush.8（yppush/Makefile.am:13 CLEANFILES = *~ ${MANS}）——本地不要对该包执行 make clean"
  - "refresh-patch --auto 生成“新增文件”补丁时会在 .orig 里留 0 字节同名占位文件，下一次运行即产出 a/b 形式坏补丁（conan patch-ng 报 'source/target file does not exist'）"
  - "CI L4 危险函数规则 (strcpy|sprintf|gets|strcat)\\b 会把 fgets( 误判为 gets（fgets 命中率 3/3），该 warn 无法通过改代码消除"

notes_file: notes.md
