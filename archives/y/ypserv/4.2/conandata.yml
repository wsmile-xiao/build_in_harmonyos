sources:
  url: "https://github.com/thkukuk/ypserv/releases/download/v4.2/ypserv-4.2.tar.xz"
  sha256: "68357588814fff5169d7c0e7eb0a2754088ecf0a498ccac6c8b44d9acafe9f77"

patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: >-
      autoconf's config.status builds its scratch directory with
      `(umask 077 && mktemp -d)`.  A 0700 directory created below a setgid
      parent is not traversable by the next process on the OHOS hmfs/hmdfs
      mount, so config.status dies with "can't create ./confXXXXXX/subs1.awk:
      Permission denied".  Relax the umask to 022.  Same treatment as
      libnsl/2.0.1 and classads/1.0.10.
    patch_type: "portability"
  - patch_file: "patches/0002-lib-access.c.patch"
    patch_description: >-
      lib/access.c defines announce_ready() without a prototype although
      lib/access.h declares `void announce_ready (void)`.  lib/Makefile.am
      compiles with -Werror and clang 15 rejects it with
      -Wstrict-prototypes.  Make the definition match its own declaration.
    patch_type: "portability"
  - patch_file: "patches/0003-lib-test-securenets.c.patch"
    patch_description: >-
      test-securenets looks the transport up with getnetconfigent(), which
      libtirpc resolves from the hard coded /etc/netconfig database.  OHOS
      ships no netconfig database and mounts /etc read only, so build the
      entry the database would return (netid + semantics + protocol family),
      which is what securenet_host() decodes.  The 5 upstream assertions are
      unchanged; on a host with a netconfig database the original lookup is
      still used.
    patch_type: "portability"
  - patch_file: "patches/0004-lib-ypserv_conf.c.patch"
    patch_description: >-
      ypserv_conf.c released tmp->map after a malformed network/netmask
      entry although that member is only assigned later, i.e. it freed
      uninitialized heap.  Harmless on libcs whose malloc returns zeroed
      memory, but musl hands out recycled chunks and the parser died with
      SIGSEGV ("make check" test-ypserv_conf crashed).  Drop the bogus free.
    patch_type: "bugfix"
  - patch_file: "patches/0005-ohos-musl-compat.h.patch"
    patch_description: >-
      New header providing the traditional (glibc / shadow-suite) password
      database interfaces that musl libc does not implement:
      fgetpwent/putpwent, fgetgrent, sgetspent/fgetspent/putspent, getspnam
      and lckpwdf/ulckpwdf.  <shadow.h> on OHOS declares struct spwd but no
      function at all.  The implementations really parse/write the colon
      separated database formats and lock /etc/.pwd.lock with fcntl();
      no empty stubs.  Used by rpc.yppasswdd/update.c and yphelper/yphelper.c.
    patch_type: "portability"
  - patch_file: "patches/0006-rpc.yppasswdd-update.c.patch"
    patch_description: >-
      Include the musl password database compatibility header in
      rpc.yppasswdd/update.c.
    patch_type: "portability"
  - patch_file: "patches/0007-yphelper-yphelper.c.patch"
    patch_description: >-
      Include the musl password database compatibility header in
      yphelper/yphelper.c (fgetpwent/fgetgrent/fgetspent).
    patch_type: "portability"
  - patch_file: "patches/0008-ypserv-ypserv.c.patch"
    patch_description: >-
      ypserv.c uses open()/O_RDWR but only includes <sys/file.h>, which on
      musl does not pull in <fcntl.h>.  Add the missing include.
    patch_type: "portability"
  - patch_file: "patches/0009-ypxfr-ypxfr.c.patch"
    patch_description: >-
      ypxfr.c relies on <string.h> being pulled in transitively and uses the
      GNU only strdupa() (alloca based stack copy) that musl does not
      provide.  Include <string.h> and define the glibc equivalent of
      strdupa() when the libc has none.
    patch_type: "portability"
