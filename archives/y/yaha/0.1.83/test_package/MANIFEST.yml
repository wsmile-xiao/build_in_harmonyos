# test_package/MANIFEST.yml
# Upstream test inventory and consumer-level test declaration.
package: yaha/0.1.83
homepage: "https://github.com/GregoryFaust/yaha"

# The v0.1.83 source contains no tests/ directory and registers no CTest/pytest suite.
upstream_check_command: "none (no upstream automated test target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_package/test.sh
    description: >-
      Runs the packaged yaha executable to build an index and align matching
      FASTA and FASTQ reads with two threads; validates QNAME, FLAG, RNAME,
      POS, and CIGAR in each generated SAM record.
    command: "${CONFIG_SHELL:-/data/service/hnp/bin/bash} test.sh"

# Five SAM fields are checked for each of the two input formats.
assertion_count: 10
