# conandata.yml — yudit 3.1.0
# 官方发布源：https://yudit.org/download/ （Yudit 官方站点，无第三方镜像）

sources:
  "3.1.0":
    url: "https://yudit.org/download/yudit-3.1.0.tar.gz"
    sha256: "a188234d6127357684f52c3d6c6a4b9d8f5abd0f7db672566bf444ef7a7ce557"

patches:
  "3.1.0":
    - patch_file: "patches/0001-Makefile.conf.in.patch"
      patch_description: >-
        make install 的 INSTALL_PROGRAM 使用 `install-sh -c -s` 会 strip 二进制；
        OhOS 要求 ELF 签名，strip 后的二进制完全无法执行（loader 返回
        "operation not permitted"，实测 strip / llvm-strip 均如此）。安装时去掉 -s。
      patch_type: "portability"
    - patch_file: "patches/0002-configure.patch"
      patch_description: >-
        configure 内的两项 OhOS/HMDFS 平台修复：
        (1) autoconf 用 `umask 077 && mktemp -d ./confXXXXXX` 创建 config.status 的
            临时目录，HMDFS 上该 0700 目录对构建用户不可写（进程 uid 与文件属主 uid
            不同、同组；HMDFS 上 chmod 亦无效），config.status 报
            "can't create ./confXXXXXX/subs1.awk: Permission denied" →
            "could not setup config files machinery"，configure RC=1。改为 umask 022。
        (2) configure 通过硬编码 /tmp/gaspar$$ 探测 C++ 编译器，而 OhOS 的 /tmp 是
            只读 erofs，探测必然失败（"Read-only file system"）。改用 ${TMPDIR:-/tmp}。
      patch_type: "portability"
    - patch_file: "patches/0003-configure.ac.patch"
      patch_description: >-
        与 0002 的 (2) 同步：configure.ac 中硬编码的 /tmp/gaspar$$ 改为
        ${TMPDIR:-/tmp}，保证重新 autoconf 之后修复不会丢失。
      patch_type: "portability"
