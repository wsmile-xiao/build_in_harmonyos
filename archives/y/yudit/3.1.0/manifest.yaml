patches_applied:
  - "0001-Makefile.conf.in.patch"   # make install 不 strip（OhOS ELF 签名）
  - "0002-configure.patch"          # HMDFS umask 022 + ${TMPDIR:-/tmp}
  - "0003-configure.ac.patch"       # configure.ac 的 ${TMPDIR:-/tmp} 同步

knowledge_gained:
  - "HMDFS：autoconf `umask 077 && mktemp -d ./confXXXXXX` 创建的 0700 临时目录对构建用户不可写（进程 uid 20020084 / 文件属 uid 20001006 同组，HMDFS 上 chmod 亦无效），config.status 报 'could not setup config files machinery'；改为 umask 022  knowledge_ref: E011"
  - "OhOS /tmp 为只读 erofs，configure 硬编码 /tmp/gaspar$$ 的 C++ 编译器探测必然失败；改用 ${TMPDIR:-/tmp}  knowledge_ref: E002"
  - "configure 的 AC_PROG_CXX/AC_PATH_XTRA 会运行 conftest；经 LIBS 注入第三方库会让 conftest 带上其 DT_NEEDED，必须同时把这些 lib 目录加进 LD_LIBRARY_PATH，否则报 'cannot run C++ compiled programs'  knowledge_ref: E429(draft E429-draft-7060)"
  - "OhOS 需要 ELF 签名：strip 后的二进制完全无法执行（loader 报 operation not permitted），autotools `install -c -s` 必须去掉 -s  knowledge_ref: E543(draft E543-draft-687A)"
  - "libx11 的 X11 头文件依赖 xorgproto（X11/X.h）：xorgproto 只作传递依赖时 conan 标 'Skipped binaries' 不安装头文件，必须显式 require  knowledge_ref: archives/l/libfltk/1.3.11"

