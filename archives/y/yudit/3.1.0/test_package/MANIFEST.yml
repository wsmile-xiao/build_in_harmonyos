# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: yudit/3.1.0
homepage: "https://yudit.org/"

# ── 上游源码审计（R51 三步法第 1 步：清点上游测试入口）────────────────────────
# 结论：yudit 3.1.0 **没有自动化测试套件**。
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.in:3"
    reason: >-
      SUBDIRS=stoolkit swindow mytool swidget uniconv uniprint gui addon ——
      tests/ 不在默认构建子目录内，`make` / `make install` 都不会构建测试。
  - source: "全仓 Makefile*（grep '^check:\\|^test:\\|^tests:'）"
    reason: >-
      零命中：本工程使用手写 Makefile（非 automake），不存在 make check /
      make test 目标，也不存在 AM_TESTS / TESTS 变量。
  - source: "tests/Makefile:9"
    reason: >-
      all: rasterizerTest toolTest —— 仅两个手搓程序；%.ps/%.cpp 规则依赖作者本机
      字体（Serif.ttf / gulim.ttf）与 /usr/bin/uniprint 硬编码路径，并非测试套件。
  - source: "tests/ToolTest.cpp"
    reason: "main() 为**空函数体**（body 为空，no assertions，永远 return 0）。"
  - source: "tests/RasterizerTest.cpp:352"
    reason: >-
      main() 直接 `SAwt awt; panel->show(); SEventHandler::start();` —— 需要 X
      display 且无任何断言/退出码契约；本机无 X server 时 RC=139（SIGSEGV）。
      所有 TEST_* 开关除 TEST_WINDINGRULE_EVENODD 外均为 0（用例被上游关闭）。
  - conclusion: >-
      上游未提供自动化测试套件；上游 22 个 Unicode/PostScript 样例
      (tests/testtext/*.txt 19 个 + tests/{nam,yuu,z}.txt 3 个) 由本库适配流程
      用被测 uniprint/uniconv 全量跑通并单独汇报；test_package 真实执行被测
      二进制（uniconv / uniprint / yudit）作为 L1 消费者视角验证。

upstream_check_command: "make check  （不存在该目标；SUBDIRS 不含 tests/）"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的测试程序（非套件、无断言、需 X display）
upstream_tests:
  - file: tests/RasterizerTest.cpp
    source: yudit-3.1.0/tests/RasterizerTest.cpp
    description: "GUI 光栅化演示程序，无断言，需 X display（本机 RC=139）"
    command: "./rasterizerTest"
  - file: tests/ToolTest.cpp
    source: yudit-3.1.0/tests/ToolTest.cpp
    description: "空 main()，无任何测试逻辑"
    command: "./toolTest"

# test_package 中自带的测试（消费者视角验证，R34 实质执行被测包）
test_package_tests:
  - file: test_yudit.sh
    description: >-
      T1 uniconv UTF-8→UTF-16→UTF-8 往返一致 + BOM 校验；T2 uniprint 渲染样例为
      合法 PostScript（%!PS-Adobe-3.0 … %%EOF）；T3 yudit 加载完整 X11 运行期
      依赖链（libX11.so.6 → libxcb.so.1 / libXau.so.6 / libXdmcp.so.6）后到达
      显示层（无 X server 时输出 'Can not open display.'）。
    command: "$SHELL test_yudit.sh <package_folder>"
  - file: test_package/conanfile.py
    description: >-
      鸿蒙特有用例（settings.os == OHOS 时执行）：
      HMOS-1 产物为鸿蒙 PC 目标 ELF（ELF64 / e_machine=AArch64=0xB7 /
      PT_INTERP=/lib/ld-musl-aarch64.so.1）；
      HMOS-2 产物未被 strip（仍含 .symtab），对应 patches/0001-Makefile.conf.in.patch（鸿蒙 PC 上
      strip 后 ELF 签名失效、二进制不可执行）。
    command: "conanfile.test() 内置断言"

# 测试断言总数（近似值）：T1 3 + T2 3 + T3 2 + HMOS-1 3 + HMOS-2 1
assertion_count: 12
