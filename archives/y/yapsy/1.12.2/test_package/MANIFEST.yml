package: yapsy/1.12.2
homepage: "https://pypi.org/project/Yapsy/1.12.2/"
upstream_check_command: "python3 runtests.py -v"
upstream_test_in_build: false
upstream_test_command: "python3 runtests.py -v"
upstream_tests:
  - file: upstream_tests/runtests.py
    source: "https://files.pythonhosted.org/packages/source/Y/Yapsy/Yapsy-1.12.2.tar.gz"
    description: "The original upstream unittest suite plus three strict-version compatibility tests; run through the Conan consumer against the packaged modules"
    command: "python3 functional.py"
test_package_tests:
  - file: functional.py
    description: "Checks package import provenance, restores two SHA-256-verified upstream ZIP fixtures from Base64 text, and executes 97 upstream plus 3 compatibility unittest cases. H1 W3 r6 ran the predecessor with the same package recipe and test assertions: 100/100 passed; official finish still returned RC 1. The r14 fixture restoration entry has targeted host validation only, with no new H1 run."
    command: "python3 functional.py <package-folder> <upstream-tests> <results-json>"
# Approximate static count: 316 assert* call sites in bundled Python test sources plus the package-import provenance guard.
# This metadata is not a claim that 317 runtime assertions were evaluated.
assertion_count: 317
