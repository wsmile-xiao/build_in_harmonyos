software: yosys
display: "Yosys Open SYnthesis Suite"
description: "Yosys 是开源 Verilog RTL 综合框架（Yosys Open SYnthesis Suite），把 Verilog/SystemVerilog 前端与大量优化 pass 组合成可脚本化的综合流程，输出 RTLIL/Verilog/BLIF/JSON/EDIF 等网表格式，并可通过 ABC 做工艺映射与形式等价验证"
category: build-tool
homepage: "https://github.com/YosysHQ/yosys"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "构建系统是自带 Makefile（既非 autotools 也非 cmake），依赖注入只能靠 CXXFLAGS/LIBS 环境前缀"
    - "Makefile 自己赋值 CXX/CC（非 ?=），profile 的 tools.build:compiler_executables 到不了它，必须显式传 CC=/CXX=，否则编出宿主对象、链接报 skipping incompatible"
    - "上游 tag 归档的 abc/ 与 libs/cxxopts/ 子模块为空，无法树内构建 ABC，也不能树内取 cxxopts 头文件"
    - "ABC 以外部二进制接入：ABCEXTERNAL 经 -DABCEXTERNAL 编译进 kernel/yosys.o，运行时 exec；DISABLE_SPAWN=0 为必需"
    - "abc 声明为 host requirement 并用 runenv_info 导出 ABC 环境变量（kernel/yosys.cc 优先读 getenv(\"ABC\")），避免把构建机缓存路径固化进产物"
    - "make install 用 $(STRIP)，交叉编译时默认宿主 strip 无法识别 aarch64 ELF，需传 SDK 的 llvm-strip"
    - "OHOS 无 /bin/sh：CONFIG_SHELL 指向 /data/service/hnp/bin/bash；Makefile:441 硬编码调用 tclsh，需 tclsh→tclsh8.6 shim"
  common_dependencies:
    - readline
    - libffi
    - tcl
    - zlib
    - cxxopts
    - abc

versions:
  "0.66":
    status: built
    build_date: "2026-09-18"
    conan_ref: "yosys/0.66"
    source_url: "https://github.com/YosysHQ/yosys/archive/refs/tags/v0.66.tar.gz"
