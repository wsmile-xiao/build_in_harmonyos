# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: yosys/0.66
homepage: "https://github.com/YosysHQ/yosys"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# yosys 用自带 Makefile，无 check/ctest；顶层 make test = vanilla-test + unit-test
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
# 豁免说明（TEST_QUALITY_SPEC §3.1 层1 / §3.3 明确声明豁免原因）：
#   缺失的系统能力/依赖：
#     1) 上游 make test 的 tests/<dir>/generate_mk.py 以 `iverilog` 存在与否为前置，
#        多条用例还要 `vvp`；CI worker 不保证装有 iverilog / GTKWave(vcd2fst)；
#     2) 完整套件（50+ 目录）在设备上以小时计，超出 build() 的合理预算。
#   替代执行：把「真实执行被测产物」放在 test_package（yosys -V + read_verilog/synth/stat，
#   synth 默认调用外部 abc，可被 L1e 破坏性反向验证）；上游套件改在通道 B
#   （aarch64-linux-ohos + qemu-user）离线执行，统计见 notes.md「验证结果」一节。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（目录驱动，由 tests/gen_tests_makefile.py 生成各目录 Makefile）
upstream_tests:
  - file: "tests/Makefile"
    source: "yosys-0.66/tests/Makefile"
    description: "vanilla-test：遍历 tests/ 下 50+ 测试目录（simple/verilog/opt/sat/arch/sim/... ），逐条生成 PASS/FAIL 并汇总"
    command: "make -C tests vanilla-test"
  - file: "tests/unit/Makefile"
    source: "yosys-0.66/tests/unit/Makefile"
    description: "unit-test：编译并运行 libyosys.so 的 C++ 单元测试"
    command: "make unit-test"

# test_package 中自带的测试 (消费者视角验证)
# CLI 工具：用 popen 执行安装后的 yosys，验证版本横幅与一次真实综合
test_package_tests:
  - file: "test.c"
    description: "执行 yosys -V（校验 'Yosys 0.66'）与 yosys -p 'read_verilog test.v; synth -top top; stat'（走通前端+pass 管线+techmap+外部 abc）"
    command: "./test_yosys"

# 测试断言总数 (近似值)
assertion_count: 2
