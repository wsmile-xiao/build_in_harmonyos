# 版本级 manifest — yosys 0.66
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "0.66"
conan_ref: "yosys/0.66"

software: "yosys"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/YosysHQ/yosys/archive/refs/tags/v0.66.tar.gz"
  sha256: "096981d3cfd09a48cdd7cd52dd6135323477f9fb6b3bdcb09d4c7d8f1f324c99"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 自带 Makefile（非 autotools/cmake/meson）
  system: makefile

  # 传给 make 的关键变量（以环境前缀方式注入，见 conanfile.py build()）
  configure_options:
    - "ENABLE_ABC=1"
    - "ABCEXTERNAL=<abc 包的 bin/abc 绝对路径>"
    - "DISABLE_SPAWN=0"
    - "TCL_VERSION=tcl8.6"
    - "CXXFLAGS=-I<各依赖 include>（保留 Makefile 自身的 -I.）"
    - "LIBS=-L<各依赖 lib> -l<各依赖 lib>"

  # 运行时依赖（host requirements）
  dependencies:
    - "readline/8.3"
    - "libffi/3.5.2"
    - "tcl/8.6.16"
    - "zlib/1.3.1"
    - "cxxopts/3.3.1.1"
    - "abc/0.0.0.20260511"

  # 构建工具依赖（build_requirements）
  tool_dependencies:
    - "flex/2.6.4"
    - "bison/3.8.2"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# 全部适配在 conanfile.py 内完成（依赖注入、cxxopts 头文件物化、tclsh shim、
# CC/CXX/STRIP/M4/BISON_PKGDATADIR 注入），不改上游源码 —— 无需 patch 文件

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "自带 Makefile 项目：依赖注入只能用 CXXFLAGS/LIBS 环境前缀；make 命令行赋值会覆盖 Makefile 的 CXXFLAGS := $(CXXFLAGS) -I. 并丢掉 -I."
  - "Makefile 自赋 CXX/CC（非 ?=）时 profile 的 tools.build:compiler_executables 失效，交叉编译静默产出宿主对象，链接报 skipping incompatible .../libtcl8.6.so"
  - "上游 tag 归档子模块为空（abc/、libs/cxxopts/ 均 0 文件），树内构建 ABC 不可行；ABCEXTERNAL + DISABLE_SPAWN=0 是唯一通路"
  - "abc 应声明为 host requirement 并导出 ABC 运行环境变量（kernel/yosys.cc:652 优先 getenv），否则构建机缓存绝对路径被 -DABCEXTERNAL 固化进产物"
  - "make install 的 $(STRIP) 默认是宿主 strip，交叉编译报 strip: Unable to recognise the format；应从 CC 同目录取 llvm-strip"
  - "Makefile:441 硬编码调用 tclsh（TCLSH= 不被尊重），conan tcl 包只有 tclsh8.6，需 PATH shim"
  - "制品仓 bison/3.8.2 二进制硬编码 /data/service/hnp/bin/m4（strings 实证），非鸿蒙设备上 bison 生成 parser 时报 EIO；需按该路径是否存在条件注入 M4="
