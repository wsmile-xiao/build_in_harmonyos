# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 如实回填）
# 适配后实测：util_test 未完整通过（test_filter_printf 通过；test_check_user_token 在
# OHOS 沙箱 SIGABRT Signal 6，位于 check_user_token token 匹配循环，疑似 musl 交互/
# 上游缺陷待查——已恢复 mkstemp/fdopen 返回值检查，并更正此前误报的 5/5）；
# pam_test 场景1 因 OHOS 沙箱 socket 限制失败（ykclient curl 到 mock ykval server
# 不可达，"Error performing curl" 109），属环境性 expected_fail（与 dovecot 先例一致）。
# 注：conan 配方不运行 make check（upstream_test_in_build=false），CI 不受 util_test
# 崩溃影响；test_package 消费者测试（dlopen + ykpamcfg）全部通过。

package: yubico/2.27
homepage: "https://developers.yubico.com/yubico-pam/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/util_test.c
    source: pam_yubico-2.27/tests/util_test.c
    description: "工具函数测试：token 文件解析/用户校验/challenge-response/过滤（5 用例）"
    command: "./util_test"
  - file: tests/pam_test.c
    source: pam_yubico-2.27/tests/pam_test.c
    description: "PAM 认证端到端测试（5 个核心场景；LDAP/MySQL 场景未启用宏不编译）"
    command: "./pam_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：dlopen pam_yubico.so 并校验 PAM 入口符号（pam_sm_authenticate/setcred）"
    command: "./test_yubico"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
