    description: "config.guess 识别 aarch64:OHOS/HarmonyOS → aarch64-unknown-linux-ohos"
  - patch_file: "patches/0002-build-aux-config.sub.patch"
    description: "config.sub 两处加 linux-ohos* 识别（kernel-os 列表 + os 列表）"
