# 软件级 manifest — yp-tools
# 文件位置: archives/y/yp-tools/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: yp-tools
display: "yp-tools"
description: "NIS (YP) 客户端工具集：查询 NIS map、显示绑定服务器、修改 NIS 口令等"
category: network
homepage: "https://github.com/thkukuk/yp-tools"
license: GPL-2.0-only

build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 tag archive 不含 configure：build() 先跑 autogen.sh 自举（automake/libtool/autoconf/gettext-autopoint 由 tool_requires 提供）；bootstrap 需收敛 PERL5LIB（conan perl 5.42.2 的 XS 模块与 SDK perl 5.42.0 解释器 ABI 失配）"
    - "automake 1.18 的 config.guess 不识别 HarmonyOS（uname -s），configure 需显式 --build=aarch64-unknown-linux-ohos"
    - "OHOS sysroot 无 rpcsvc/、rpc/ 头文件，也无系统 libnsl/libtirpc → 强制依赖 libnsl/2.0.1 + libtirpc/1.3.7（二者静态，libnsl 传递 requires libtirpc）"
    - "sysroot 的 libintl.h / crypt.h 是「无函数原型桩」且无对应库 → 使用 gettext/0.22.5.1（libintl 静态链接）与 libxcrypt/4.5.2（crypt.h + libcrypt.a）"
    - "musl 共享 libc.so 既不声明也不导出 getpass()（仅静态 libc.a 有）→ AC_CHECK_FUNCS 探测 + 自备 termios 实现"
    - "HMDFS 不支持硬链接（link(2) 返回 EPERM）→ 安装别名 ypchsh/ypchfn/ypdomainname/nisdomainname 改用符号链接"
    - "上游仅声明 check_PROGRAMS 未注册 TESTS（make check 不执行）；补 TESTS=xdrfile-test 后真正执行，且无 /etc/netconfig 时按 automake 约定 skip(77)"
  common_dependencies:
    - libnsl
    - libtirpc
    - gettext
    - libxcrypt

versions:
  "4.2.3":
    status: built
    build_date: "2026-09-22"
    conan_ref: "yp-tools/4.2.3"
