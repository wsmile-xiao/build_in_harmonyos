# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: yp-tools/4.2.3
homepage: "https://github.com/thkukuk/yp-tools"

# 上游测试命令（automake：lib/Makefile.am 的 check_PROGRAMS + TESTS）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
#
# 实测结论（2026-09-22，OHOS PC aarch64，无 NIS 服务器）：
#   * lib/xdrfile-test：上游只声明了 check_PROGRAMS 而未注册 TESTS，make check
#     只编译不执行。本仓库用 patches/0002 补 `TESTS = xdrfile-test` 使其真正执行，
#     并用 patches/0003 让它在拿不到 ypbind3 绑定时按 automake 约定 skip（77）
#     而非对 NULL 解引用。实测结果：SKIP（原因：上游硬编码测试主机 'phex' 不可解析，
#     且 OHOS 无 /etc/netconfig、/etc 只读，libtirpc 的 netdir 无法初始化）。
#   * src/yptest：上游内建 NIS 自检工具（安装为 sbin/yptest），9 个用例全部被
#     执行到（无 NIS 服务器环境下按预期报错，退出码 6）。
upstream_tests:
  - file: lib/xdrfile-test.c
    source: yp-tools-4.2.3/lib/xdrfile-test.c
    description: "TIRPC/XDR ypbind3 绑定编解码往返测试（check_PROGRAMS，本仓库补 TESTS 注册）"
    command: "./lib/xdrfile-test [host]"
  - file: src/yptest.c
    source: yp-tools-4.2.3/src/yptest.c
    description: "上游内建 NIS 自检工具：Test 1..9 = domainname / ypbind / yp_match / yp_first / yp_next / yp_master / yp_order / yp_maplist / yp_all"
    command: "yptest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_yp_tools.sh
    description: "9 个上游工具样例（--version / --usage / 功能性调用）+ 4 个安装别名 + yptest 9 用例执行痕迹 + 6 条 OHOS(musl/HMDFS) 特有断言"
    command: "sh test_yp_tools.sh <package_folder>"

# 测试断言总数（实测）
assertion_count: 44
