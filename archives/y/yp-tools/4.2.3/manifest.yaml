# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "conan autotools 闭包内 conan perl/5.42.2 的 XS 模块与 SDK perl(5.42.0) 解释器 ABI 失配：autogen.sh 必须把 PERL5LIB 收敛为工具包纯 Perl 模块目录（automake/autoconf share），核心 XS 模块回落解释器自带 @INC（知识库已有 DRAFT-6049 同因）"
  - "OHOS musl sysroot 的 libintl.h / crypt.h 是「无函数原型桩」且无对应库：configure 探测会通过/落空，但编译报 -Wint-conversion（clang 15 默认把隐式声明转 int 视为错误），必须改用 conan gettext / libxcrypt 的头文件"
  - "musl 共享 libc.so 不导出 getpass()（静态 libc.a 里有）：需要 AC_CHECK_FUNCS([getpass]) 探测 + 自备实现，否则链接期 undefined symbol"
  - "HMDFS 不支持硬链接（link(2) 返回 EPERM）：上游 install-exec-hook 的 ln -f 必须改为 rm -f && ln -s"
  - "automake 1.18 的 config.guess 不识别 HarmonyOS（uname -s=HarmonyOS），configure 需显式 --build=aarch64-unknown-linux-ohos（config.sub 支持该三元组）"
  - "GitHub tag archive 无 configure 时，autogen.sh/libtoolize/automake --add-missing 会覆盖 tarball 内已有的 INSTALL/install-sh/m4/*.m4/mkinstalldirs，refresh-patch --auto 会把它们误记为源码变更 → 必须人工裁剪补丁集（5 个真实源码补丁）"
  - "CI L4 静态扫描的正则 (strcpy|sprintf|gets|strcat)\b 会把 fgets 误判为危险函数；实现中改用 getline 可消除该误报"
  - "ci/conan/build_and_test.sh 的镜像 fallback 改写会写回仓内 conandata.yml（其 EXIT 还原钩子还原的是已含镜像的版本），导致每次本地 W3 运行都把 gh-proxy.com 永久写入工作区 → PF7 源URL闸拦截；本地 W3 后必须手工还原官方单 URL"
