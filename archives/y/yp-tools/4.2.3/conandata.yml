# conandata.yml — yp-tools 4.2.3
# 官方源（GitHub tag archive，上游 release 无 dist tarball assets；
# 该 archive 不含 configure/Makefile.in，构建时由 autogen.sh 生成）
sources:
  url: "https://github.com/thkukuk/yp-tools/archive/refs/tags/v4.2.3.tar.gz"
  sha256: "62b2278d0277c1dad122ae4a20f7a25857265904edbe0a264f9bf25b7fe50dd8"

patches:
  - patch_file: "patches/0001-configure.ac.patch"
    patch_description: "AC_CHECK_FUNCS([getpass]): probe getpass() availability before using a replacement"
    patch_type: "portability"
    patch_source: "ohos-adaptation"
  - patch_file: "patches/0002-lib-Makefile.am.patch"
    patch_description: "Register lib/xdrfile-test in TESTS so that make check really executes the upstream test"
    patch_type: "portability"
    patch_source: "ohos-adaptation"
  - patch_file: "patches/0003-lib-xdrfile-test.c.patch"
    patch_description: "Skip (exit 77) instead of dereferencing NULL when no ypbind3 binding can be created (host 'phex' unresolvable / no /etc/netconfig)"
    patch_type: "portability"
    patch_source: "ohos-adaptation"
  - patch_file: "patches/0004-src-Makefile.am.patch"
    patch_description: "Install the ypchsh/ypchfn/ypdomainname/nisdomainname aliases as symlinks (HMDFS rejects link(2) with EPERM)"
    patch_type: "portability"
    patch_source: "ohos-adaptation"
  - patch_file: "patches/0005-src-yppasswd.c.patch"
    patch_description: "Provide a getpass() replacement for libcs that neither declare nor export it (musl/OHOS)"
    patch_type: "portability"
    patch_source: "ohos-adaptation"
