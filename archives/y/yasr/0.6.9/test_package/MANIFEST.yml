# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: yasr/0.6.9
homepage: "https://yasr.sourceforge.net"

upstream_check_command: ""
upstream_tests_exist: false
upstream_test_audit: "Audited the pristine yasr-0.6.9 upstream tarball (88 entries; SourceForge archive byte-identical to Debian's yasr_0.6.9.orig.tar.gz, sha256 41f17cfab8e88824a8dc1476602a0944b9030a8f8da2538a7a6549e3534e3bdf). grep -n \"^TESTS|^check_PROGRAMS|^noinst_PROGRAMS\" over Makefile.am, yasr/Makefile.am, acclogin/Makefile.am, m4/Makefile.am and po/Makefile.in.in yields exactly ONE hit: 'noinst_PROGRAMS = keytest' in yasr/Makefile.am — an interactive keyboard diagnostic that is deliberately not installed and that make check never executes. There is no test/ or tests/ directory, no gtest/criterion/check framework binding, and configure.in registers no test target. Upstream ships no test harness."
reason: "yasr 0.6.9 ships no upstream test framework: no TESTS/check_PROGRAMS in any Makefile.am, no test directory, no gtest/criterion/check bindings; the only program-ish entry is noinst_PROGRAMS = keytest (interactive diagnostic, not run by make check)."

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "鸿蒙消费者冒烟用例 ×5：①包内 bin/yasr 是常规可执行文件且非软链（验证 cpp_info.bindirs 与 package() 实物一致）；②share/yasr/yasr.conf 随包安装且非空（config.c 的第三级 PACKAGE_DATA_DIR 搜索候选 + Makefile.am 的 pkgdata_DATA）；③share/man/man1/yasr.1 已安装（yasr 唯一 CLI 口径 -C/-c/-s/-p 的出处）；④yasr -C 指向不存在配置 → rc≠0 且 stdout 打印三级搜索列表（证明 OHOS ELF 真加载、坏动态链接会是 rc=127 且无任何程序输出，且 musl getopt 可用）；⑤yasr -C 指向随包 yasr.conf → rc=0 且不再报 unable to find（真机走通 pty 会话建立与干净收尾，即补丁 0004 解开的 openpty/forkpty 路径经 OHOS musl libutil 实现）。不访问 TTS 设备、不联网、不读串口。"
    command: "sh test.sh"

assertion_count: 5
