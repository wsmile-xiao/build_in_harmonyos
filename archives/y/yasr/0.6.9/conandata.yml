#   https://downloads.sourceforge.net/yasr/yasr-0.6.9.tar.gz
#     -> 302 master.dl.sourceforge.net/project/yasr/yasr/0.6.9/yasr-0.6.9.tar.gz
#        （SourceForge 自身 CDN 重定向，与 vamps/0.99.2 的 /download 形态同族）
# sha256 = 41f17cfab8e88824a8dc1476602a0944b9030a8f8da2538a7a6549e3534e3bdf (235768 字节)
#   三向同哈希自证：① 上述官方址 HEAD/下载实算；② Debian 池内
#   yasr_0.6.9.orig.tar.gz 实算（同一 sha256，cmp 逐字节相同）；③ 本行声明值。
#   即 pristine upstream tarball 与 Debian 重打包所用 .orig 完全一致，故取官方址、
#   不吃 deb.debian.org 池址（PF7 黑名单），也不改一个哈希位。
# 上游身份：.dsc 的 Homepage = https://yasr.sourceforge.net/，Maintainer = Debian
#   Accessibility Team；GitHub 上的 mgorse/yasr 与 tbsaunde/yasr 均无 0.6.9 tag，
#   download.savannah.nongnu.org/releases/yasr/ 与 github.com/yasr/yasr 皆 404。
# 4 个适配补丁（生成器：ohc-run.py refresh-patch --auto，per-file-difflib）：
#   见 patches/ 与版本级 manifest 的 patch_generation / patch_classification。

sources:
  url: "https://downloads.sourceforge.net/yasr/yasr-0.6.9.tar.gz"
  sha256: "41f17cfab8e88824a8dc1476602a0944b9030a8f8da2538a7a6549e3534e3bdf"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Teach the bundled 2007-07-22 config.guess to recognise 'uname -s = HarmonyOS' and emit aarch64-unknown-linux-ohos; that vintage has no GUESS= accumulation mechanism, so the new branch must print the triplet and exit itself"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Accept the linux-ohos kernel/OS pair in the bundled 2007-06-28 config.sub: add linux-ohos* to the KERNEL-OS split list and -linux-ohos* to the OS whitelist ahead of the generic -linux*) branch, which would otherwise rewrite the triplet into -linux-gnu-ohos"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "Use umask 022 for config.status' temporary directory (E011): the build euid is not the owner of the tree on this host, so a 0700 mktemp dir is not writable by it and config.status silently produces no Makefile/config.h while configure still exits 0"
    patch_type: "portability"
  - patch_file: "patches/0004-yasr-yasr.h.patch"
    patch_description: "Guard the private openpty()/forkpty() prototypes with HAVE_OPENPTY/HAVE_FORKPTY: config.h reports both functions provided (LIBOBJS is empty, so the bundled replacements are not compiled) and the non-const prototypes clash with <pty.h>"
    patch_type: "portability"
